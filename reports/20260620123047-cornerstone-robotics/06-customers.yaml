  - - Singapore public integrated hospital / first installed site
    - Buyer likely public hospital leadership; users are local robotic-surgery teams; payer is hospital system
    - First local installation after certification; commissioning and training
    - Woodlands Health announced first installation in April 2026
    - Best proof that regulatory clearance can convert into a hospital deployment outside Hong Kong
    - No procedure counts, utilization, or commercial terms disclosed
  - - Singapore academic research and training partners
    - Buyer influence sits with NHG and NTU; users are surgeons, trainees, and clinical researchers
    - Joint clinical research, education, and future deployment pathway
    - July 2025 NHG / NTU MOU confirmed; active installation not publicly confirmed by June 2026
    - Adds credibility and pipeline access inside Singapore's public-health ecosystem
    - Relationship is still MOU-stage rather than a confirmed production customer
  - - Hong Kong private-hospital ecosystem pathway
