- id: named-customer-proof
  title: Named clinical partner deployments
  body: >-
    Named proof is real, but it is uneven in maturity. The clearest anchor is the CUHK / Prince of Wales Hospital
    relationship, where CUHK said Sentire had completed more than 55 operations since August 2022; that is the
    only publicly disclosed procedure-volume datapoint tied to a specific site and makes Hong Kong the company's
    main validation base. In the UK, Cornerstone announced a colorectal clinical investigation at Portsmouth's Queen
    Alexandra Hospital in mid-2025, and the public record still points to an active investigation rather than a
    finished commercial deployment. In Singapore, Woodlands Health disclosed the first local installation in April
    2026, making it the cleanest proof that certification converted into a real hospital deployment outside Hong Kong.
    By contrast, the NHG / NTU relationship remains a July 2025 MOU focused on research and training, with no
    confirmed installation announced by June 2026. CUHK Medical Centre strengthens the ecosystem narrative in Hong
    Kong, but public evidence does not yet show it as a live Sentire production customer. Across all five names,
    the pattern is clinical validation first and commercial disclosure second.
  claimRefs:
  - CU001
  - CU003
  - CU004
  - CU005
  - CU010
  - CU012
  - CU018
  - CU019
  - CU021
  - CU029
  tableRefs:
  - TU003
  figureRefs:
  - FU002
- id: adoption-trajectory
  title: Adoption trajectory and engagement metrics
  body: >-
    Cornerstone's adoption trajectory is visible through milestone events rather than through a clean operating KPI
    dashboard. The strongest hard signal is the 55-plus-case disclosure from the CUHK / Prince of Wales Hospital
    program, showing the system has moved beyond a one-off demo into repeated clinical use. A second important 2026
    proof point is the Woodlands Health installation, which shows that regulatory progress in Singapore translated
    into a site-level deployment. Beyond direct hospital milestones, Cornerstone's education and events footprint
    suggests the company is deliberately building surgeon awareness before broad revenue disclosure: the EAU26 London
    event cited engagement with more than 100 surgeons, and the professional-education pages describe a structured
    training ladder across specialties. The problem for diligence is denominator quality. Cornerstone does not publish
    installed-base count, utilization, aggregate procedure volume, training-graduate totals, or commercial revenue by
    customer. That means the public story supports momentum and multi-market engagement, but not a precise assessment
    of conversion efficiency from training interest to durable hospital adoption.
  claimRefs:
  - CU001
  - CU004
  - CU006
  - CU009
  - CU011
  - CU014
  - CU025
  - CU029
  - CU032
  - CU033
  tableRefs:
  - TU002
- id: retention-and-satisfaction
  title: Retention, durability, and satisfaction gaps
  body: >-
    Public durability evidence is materially thinner than public deployment evidence. Cornerstone has not disclosed
    NRR, GRR, churn, contract length, renewal schedules, consumables pull-through, or installed-base utilization.
    There are also no independently sourced customer-satisfaction surveys, peer-reviewed partner case studies, or
    broad hospital testimonials that would let an investor separate surgeon curiosity from durable account adoption.
    The best available proxies are continuity signals: CUHK / Prince of Wales Hospital has stayed active since 2022,
    the Portsmouth investigation was still presented as ongoing in mid-2026, and the professional-education program
    implies repeated training touchpoints rather than a one-time sale-and-walk-away motion. Those proxies matter,
    but they are not substitutes for commercial retention data. Even the 2026 EAU26 surgeon-engagement figure is an
    awareness signal, not evidence of repeat purchasing or expansion inside a hospital system. The practical takeaway
    is that durability remains an open diligence area: there is no public evidence of customer failure, but there is
    also no quantified proof of renewals, satisfaction, or land-and-expand economics.
  claimRefs:
  - CU003
  - CU009
  - CU010
  - CU013
  - CU014
  - CU019
  - CU021
  - CU029
  tableRefs:
  - TU004
  figureRefs:
  - FU003
  - FU004
- id: concentration-and-expansion
  title: Concentration risk and expansion pathway
  body: >-
    Customer concentration is currently one of the chapter's clearest risks. Every named Sentire relationship sits
    in the same broad buyer archetype: academic, teaching, or government-linked hospitals that can host trials,
    training, and early clinical evaluation. That concentration raises two related issues. First, revenue sensitivity
    is likely high because public proof still depends heavily on a small number of flagship institutions, especially
    the Hong Kong base at CUHK / Prince of Wales Hospital. Second, broader rollout requires slow procurement systems:
    NHS hospitals need evidence, governance approval, and capital planning; Singapore expansion requires public-system
    buy-in beyond a single installation; and Hong Kong system-wide scale would likely require Hospital Authority action
    across a 43-hospital network that has not yet been announced. The upside is that CE MDR and HSA certification now
    widen the addressable hospital universe in Europe and Singapore, while APAC surgical-robotics demand is growing
    quickly enough to support a larger commercial opportunity. Still, until Cornerstone converts training, MOUs, and
    investigations into repeatable contracts outside the academic/government niche, expansion should be viewed as
    promising but not yet de-risked.
  claimRefs:
  - CU007
  - CU008
  - CU017
  - CU020
  - CU022
  - CU023
  - CU024
  - CU027
  - CU028
  - CU030
  - CU031
  - CU035
