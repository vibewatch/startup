- id: moat-assessment
  title: Switching costs, moat durability, and competitive risk
  body: >-
    Surgical robotics creates unusually strong switching costs relative to most medical devices.
    A hospital that adopts a robotic platform invests in training surgeons (20–30 cases to proficiency),
    building OR workflows, and educating the care team. These investments are largely non-transferable:
    switching to a different robotic platform requires re-training and re-certification at the new
    system, typically at full cost. Intuitive's da Vinci moat is especially deep because its installed
    base is large enough that most hospitals, medical schools, and fellowship programs that train
    robotic surgeons use da Vinci, creating a system of surgeon preference that persists independently
    of hospital decisions. Surgeons who train on da Vinci at their fellowship will prefer da Vinci
    in their practice, and hospitals that want to recruit those surgeons must accommodate da Vinci.

    Cornerstone's moat claims are currently thinner than Intuitive's but potentially durable in
    specific geographies. Its in-house development model means it controls the full technology
    stack — mechanical, software, imaging, AI — which enables rapid iteration and a lower structural
    cost position than companies that license core modules. Its multi-jurisdiction regulatory approvals
    (NMPA, CE MDR, HSA) create formal market-access barriers for competitors in those jurisdictions.
    The CUHK MOU, Portsmouth NHS Trust partnership, and Woodlands Hospital Singapore deployment
    represent early reference sites that, if expanded, would build the kind of clinical evidence base
    that supports surgeon advocacy and further hospital decisions.

    The primary moat risk for Cornerstone is that the accessibility positioning is not proprietary:
    CMR Surgical, SS Innovations, and likely other entrants are converging on the same message, and
    capital availability for surgical robotics challengers has been high. CMR's US$200M raise in 2025
    versus Cornerstone's US$200M raise in the same period illustrates the competitive intensity at
    the funding level. The company that converts early clinical partnerships into large, multi-site
    deployment contracts first will establish the training flywheel advantage that makes switching
    away from its platform costly. Cornerstone's current disclosed position — three active clinical
    sites — leaves significant uncertainty about whether it will reach that scale before challengers
    with comparable positioning but deeper US presence (CMR) consolidate the accessible-robot niche.
