callouts:
- calloutType: risk
  title: US market absence is a growing strategic liability
  body: >-
    CMR Surgical's FDA clearance for cholecystectomy plus filed GYN 510(k), and Medtronic's US commercial
    Hugo launch in 2026, mean that two well-funded challengers will begin building US case volume, training
    ecosystems, and hospital relationships before Cornerstone has entered that market. Cornerstone has
    not disclosed any US FDA regulatory timeline, making the US market a strategic gap of unknown size.
  claimRefs:
  - CP008
  - CP011
  - CP040
- calloutType: strength
  title: APAC multi-jurisdiction regulatory advantage
  body: >-
    Cornerstone's combination of NMPA (China), CE MDR (EU), and HSA (Singapore) approvals — covering
    four major surgical specialties — is a differentiated regulatory position in the APAC market.
    No other challenger in this analysis simultaneously holds all three of these approvals; this
    gives Cornerstone a structural head-start in hospital procurement decisions in each of those
    markets.
  claimRefs:
  - CP024
  - CP031

