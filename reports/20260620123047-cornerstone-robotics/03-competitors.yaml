  evidenceGaps:
  - type: missing-source
    severity: material
    topic: fda-regulatory-timeline
    missingEvidence: Whether Cornerstone Robotics has filed or plans to file a US FDA 510(k) or PMA submission for Sentire, and if so, the expected timeline.
    whyItMatters: The US market is the largest single surgical robotics market and Cornerstone's absence from FDA clearance means it cannot sell in the US while CMR and Medtronic build installed-base advantages there.
    diligencePath: Request a US regulatory strategy memo from management; review any public FDA database entries for Sentire; confirm whether FDA pre-submission meetings have occurred.
    relatedQuestionRefs:
    - QP011
    - QP025
  - type: private-evidence-only
    severity: material
    topic: installed-base-and-case-volume
    missingEvidence: Cornerstone's current installed-base count by geography, cumulative procedure volume by specialty, and year-over-year growth in active sites.
    whyItMatters: These metrics directly measure whether Cornerstone is building the clinical evidence and training flywheel needed to compete with Intuitive and CMR at scale.
    diligencePath: Request site-by-site deployment table, monthly active units, and quarterly case volume by specialty under NDA.
  - type: missing-source
    severity: minor
    topic: moon-surgical-status
    missingEvidence: Moon Surgical's Maestro system current commercial status, FDA clearance, and procedure count.
    whyItMatters: Moon Surgical represents a different competitive angle (semi-active assistance) that could be relevant if Maestro is clinically adopted.
    diligencePath: Access Moon Surgical directly (non-web contact); review FDA 510(k) database for Maestro; check MedTech Dive or similar for latest coverage.
    relatedQuestionRefs:
    - QP020
  - type: private-evidence-only
    severity: minor
    topic: comparative-pricing
    missingEvidence: Pricing for Sentire, Versius Plus, and Hugo RAS from each company.
    whyItMatters: No independent total-cost-of-ownership comparison is possible without pricing data; accessibility claims cannot be evaluated without actual price transparency.
    diligencePath: Request price sheets under NDA from all three companies; cross-check against distributor or GPO pricing if available.
