- id: challenger-profiles
  title: Regional challenger and substitute profiles
  body: >-
    SS Innovations International (India) was founded by Dr. Sudhir Srivastava, who holds the record
    for the greatest number of robotic Beating Heart Totally Endoscopic Coronary Artery Bypass (TECAB)
    surgeries globally. Its SSi Mantra 3, introduced in March 2025, is positioned as the most advanced
    version of India's first indigenous surgical robotic system, with a deliberate cost-effectiveness
    agenda targeting underserved populations globally. The SS Innovations product line now spans five
    distinct systems — SSi Mantra 3, SSi Mudra, SSi Maya, SSi Yantra, and SSi Sutra — indicating
    a scaling product portfolio. MarketsAndMarkets identifies SS Innovations as an APAC startup and
    SME with a strong product portfolio and business strategy. Like Cornerstone, SS Innovations is
    pursuing the price-accessibility positioning that the incumbent systems have systematically
    underserved. However, SS Innovations does not publicly disclose system count, revenue, or installed
    base.

    Moon Surgical's Maestro system represents a different competitive angle — semi-active robotic
    assistance rather than a full robotic platform — but the company's website returned a 404 error
    at the time of research, limiting independent verification of Maestro's current commercial status
    or indication set. This does not eliminate Moon Surgical from diligence consideration, but means
    its profile cannot be independently verified from public sources in this chapter.

    The status-quo substitute — conventional laparoscopic surgery — remains the most widely used
    alternative and the highest-volume competitive option in all markets. Hospitals with large installed
    laparoscopic tower bases and trained surgeons face real switching costs when considering robotic
    adoption. The conversion argument for any robotic platform therefore rests on demonstrating that
    the improved clinical outcomes, surgeon ergonomics, and hospital throughput advantages outweigh
    the capital cost, training overhead, and disposable instrument premium. Cornerstone's stated
    mission to make surgery accessible and its five-pathway training program directly address the
    barriers that slow conversion from laparoscopic to robotic surgery.
