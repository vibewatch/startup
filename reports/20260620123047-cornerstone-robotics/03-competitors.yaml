chapter:
  number: 3
  title: Competitors
  summary: >-
    Intuitive Surgical dominates soft-tissue surgical robotics with approximately 60% global market share
    and US$2.77B Q1 2026 revenue. CMR Surgical (Versius Plus, FDA-cleared for cholecystectomy, 45,000 cases
    worldwide, US$200M raise April 2025) is the most credible direct challenger. Medtronic (Hugo RAS,
    US commercial launch 2026) and SS Innovations (SSi Mantra 3, India-first affordability) represent
    distinct regional challengers. Cornerstone Robotics differentiates through full-stack in-house
    development, APAC-focused regulatory approvals (NMPA, CE MDR, HSA), and structured hospital training
    programs, but lacks US FDA clearance and has not disclosed pricing or installed-base data. Multiple
    challengers are converging on the accessibility positioning, making differentiation durability a
    key diligence question.
sections:
- id: competitive-landscape
  title: Competitive landscape overview
  body: >-
    The global surgical robotics market is organized around one dominant incumbent (Intuitive Surgical),
    a set of funded direct challengers, and a growing cohort of regional entrants targeting the
    price-accessibility gap. Intuitive Surgical accounts for approximately 60% of global soft-tissue
    robotic surgery cases and generated US$2.77B in Q1 2026 revenue — a 23% year-on-year increase —
    while installing 431 new da Vinci systems globally in a single quarter. This scale creates a
    compounding competitive moat: a larger installed base generates more instrument and service revenue,
    which funds continued R&D that widens the capability gap with challengers.

    The direct challenger tier has consolidated around a few well-funded platforms. CMR Surgical
    (Cambridge, UK) is the most active challenger by measured clinical volume, with its Versius platform
    accumulating 45,000 cases worldwide and ranking as the second most utilized robotic surgical platform
    globally. CMR's April 2025 US$200M raise and FDA 510(k) clearance for cholecystectomy make it the
    most credible competitive threat to Intuitive in the US soft-tissue market. Medtronic launched Hugo
    commercially in the United States in 2026 after years of development, bringing the largest medical
    device company into direct competition with Intuitive in the US market for the first time.

    Regional challengers have emerged to address the APAC and emerging-market accessibility gap.
    SS Innovations (India) targets cost-effectiveness and domestic-manufacture positioning with its
    SSi Mantra 3. Cornerstone Robotics occupies a similar positioning in the APAC/China/UK corridor,
    emphasizing in-house development, vertical integration, and regulatory approvals in three
    jurisdictions (China, EU, Singapore) at a point where most non-Western entrants are still in
    clinical trials. The competitive landscape is therefore divided along three axes: scale and installed
    base (dominated by Intuitive), US-market clearance and funding depth (CMR, Medtronic), and
    APAC-local positioning with multi-jurisdiction approval (Cornerstone, SS Innovations).
