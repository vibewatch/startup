  topStrengths:
    - Multi-jurisdiction regulatory progress across China, the EU, and Singapore is unusually strong for a late-stage private surgical robotics challenger
    - The company combines founder-led technical depth, in-house platform development, and meaningful Hong Kong institutional sponsorship
    - Disclosed funding of roughly USD 435 million gives Cornerstone a real chance to finance manufacturing, training, and international commercialization
  topRisks:
    - No public revenue, pricing, installed-base, or margin data exists, making valuation support fundamentally narrative-led
    - Intuitive, Medtronic, CMR Surgical, and lower-cost regional challengers create heavy competitive pressure in every target geography
    - Surgical robotics is capital intensive and service heavy, so weak hospital conversion or slower utilization could force more financing before scale economics appear
  unresolvedGaps:
    - Revenue, gross margin, and system-placement data are not publicly disclosed
    - Cap-table, liquidation preference stack, and governance/control rights remain opaque
    - A public FDA pathway and US commercialization timeline are not yet clearly documented
