- id: TV002
  title: Thesis / Anti-Thesis Table
  description: Balanced case framing that shows why Cornerstone merits continued attention without earning a buy call today.
  columns:
  - Argument Type
  - Argument
  - Evidence
  - What Would Change This View
  rows:
  - - Thesis
    - APAC surgical robotics is growing quickly enough to support meaningful long-run value creation
    - Multiple analyst sources point to mid-teens growth and a rising regional TAM
    - If market growth slowed sharply or reimbursement stayed closed, strategic upside would compress
  - - Thesis
    - Cornerstone has demonstrated real regulatory execution across several jurisdictions
    - China, CE MDR, and Singapore milestones indicate credible product and regulatory capability
    - If approvals failed to translate into paying deployments, the regulatory signal would be less valuable
  - - Thesis
    - Strong financing support reduces short-term survival risk
    - The 2025 round was large and described as oversubscribed by multiple sources
    - If the next financing required a reset or bridge, the support signal would weaken
  - - Anti-thesis
    - Revenue opacity makes valuation testing impossible
    - No public revenue, margin, or utilization disclosure exists despite the unicorn-level implication
    - A disclosed revenue run rate and commercial contract base would materially improve confidence
  - - Anti-thesis
    - Customer proof still appears concentrated in pilots, partners, and reference sites
    - Public evidence highlights installations and partnerships more than recurring commercial adoption
    - Named paying hospital contracts or utilization disclosures would soften this concern
  - - Anti-thesis
    - Competition is intense and well funded
    - Intuitive, Medtronic, CMR Surgical, and SS Innovations all create different forms of pressure
    - A differentiated installed-base ramp or cost advantage would make the competition more manageable
  notes: The thesis is real, but each positive factor still requires a commercial proof point before it can fully defend the current valuation.
  claimRefs:
  - CV008
  - CV011
  - CV017
  - CV027
  - CV034
  - CV040
  - CV045
- id: TV003
  title: Bull / Base / Bear Scenario Table
  description: Scenario framing for valuation where explicit assumptions matter more than single-point precision.
  columns:
  - Scenario
  - Key Assumptions
  - Implied Valuation Logic
  - Key Risks
  - Probability Signal
  rows:
  - - Bear
    - Trial sites do not convert well, US pathway stays distant, and pricing pressure compresses adoption
    - Valuation falls toward $500M-$700M because the company looks overfunded relative to visible commercial proof
    - Down-round risk, slower deployment density, and weaker strategic optionality
    - ~30%
  - - Base
    - Cornerstone converts some lighthouse sites, keeps regulatory momentum, and begins disclosing credible commercial revenue by 2027-2028
    - Valuation holds around $1.0B-$1.5B as current financing signals become partially supported by fundamentals
    - Proof may arrive too slowly, preference terms may overhang common equity, and competitive pressure may intensify
    - ~50%
  - - Bull
    - China and APAC rollout scale well, additional approvals expand TAM, and the company shows repeatable multi-site commercial traction
    - Valuation reaches roughly $2.5B-$4.0B if the platform earns strategic scarcity value before a likely exit window
    - Execution complexity, reimbursement drag, and capital-intensive scaling can all break the ramp
    - ~20%
  notes: All scenario ranges are author estimates anchored on stage, market growth, and funding context rather than disclosed revenue or margin data.
  claimRefs:
  - CV004
  - CV009
  - CV016
  - CV022
  - CV025
- id: TV004
  title: Comparable Valuation Table
  description: Relevant comparable companies and programs, emphasizing stage fit over false precision on private multiples.
  columns:
  - Comparable
  - Stage/Type
  - Metric
  - Multiple/Valuation
  - Relevance
  - Limitation
  rows:
  - - Intuitive Surgical
    - Public market leader
    - Revenue / market leadership benchmark
    - Public large-cap, often discussed on premium revenue multiples
    - Shows what a mature surgical-robotics platform can earn in public markets
    - Too mature and too disclosed to be a direct multiple analog for Cornerstone today
  - - CMR Surgical
    - Private CE-marked challenger
    - Funding intensity / commercialization stage
    - ~$600M reported funding before broader expansion
    - Best private-stage reference for how much capital a serious challenger may need
    - Public valuation and detailed revenue disclosures are unavailable
  - - SS Innovations
    - Private emerging-market entrant
    - Pricing posture / APAC-style affordability
    - Sub-scale relative to Cornerstone, with emerging-market orientation
    - Useful for framing cost-sensitive adoption risk in Asia
    - Stage, scope, and clinical profile differ from Cornerstone
  - - Medtronic Hugo
    - Strategic incumbent program
    - Distribution and strategic backing
    - Backed by a much larger medtech parent rather than a standalone valuation
    - Shows how hard it is for a smaller entrant to compete on channel reach
    - Not a standalone company with separable valuation disclosures
  - - Cornerstone Robotics
    - Private APAC-focused challenger
    - Price-to-invested-capital anchor
    - Implied >$1B valuation on roughly $435M disclosed funding, or about 2.3x invested capital
    - Frames what today's private mark is asking investors to believe before revenue disclosure
    - Not a revenue-based multiple and not directly comparable to public medtech metrics
  enumerationScope:
    coverage: exhaustive
    basis: This table covers the decision-relevant public and private comparable references repeatedly surfaced in public evidence for Cornerstone's current stage and market position.
  notes: The comparable set is exhaustive for the public decision context, but private round valuation precision remains incomplete without database access or management materials.
