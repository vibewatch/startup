- id: TV005
  title: Thesis-Break and Kill Triggers Table
  description: Monitorable events that would materially change the recommendation or invalidate the valuation case.
  columns:
  - Trigger
  - Threshold/Event
  - Transmission to Thesis
  - Action Implication
  rows:
  - - US market path fails
    - No credible FDA strategy emerges by mid-2027 or a later filing gets negative feedback
    - Cuts the long-run TAM and weakens strategic exit optionality
    - Reduce upside assumptions and revisit whether the unicorn mark can still be justified
  - - Safety or recall event
    - Major recall, field action, or persistent adverse-event pattern
    - Damages product trust, slows adoption, and raises liability risk
    - Move to diligence hold and re-underwrite the platform from first principles
  - - Commercial conversion stalls
    - Reference sites remain pilots without named paying expansion
    - Confirms that regulatory proof is not translating into revenue proof
    - Maintain or deepen research-more stance and avoid pricing in scale
  - - Down-round financing
    - Next major raise prices materially below current implied mark
    - Signals weaker bargaining power, dilution, and possible overvaluation
    - Reset valuation range lower and scrutinize preference overhang
  - - China-linked supply disruption
    - Component or manufacturing interruption slows deliveries or service support
    - Directly hits rollout velocity and increases capital needs
    - Lower bull/base probabilities and demand continuity evidence
  notes: These are analyst-defined kill triggers tied to valuation support, not management guidance or formal investor rights clauses.
  claimRefs:
  - CV018
  - CV023
  - CV025
  - CV033
  - CV043
- id: TV006
  title: Final Diligence Asks Table
  description: Highest-value next asks for converting this public-view chapter into an underwrite-grade valuation memo.
  columns:
  - Topic
  - Missing Evidence
  - Why It Matters
  - Owner/Diligence Path
  rows:
  - - Revenue and financials
    - Audited financial statements, revenue run rate, burn, and margin bridge
    - Without revenue and burn, valuation multiples and runway assumptions remain guesswork
    - Request audited or reviewed financials plus management accounts
  - - Cap table and preference stack
    - Liquidation preferences, anti-dilution, seniority, and ownership by round
    - Common-equity returns can diverge sharply from headline valuation when preference stacks are heavy
    - Obtain cap table and shareholder documents from company counsel
  - - US FDA strategy
    - Submission path, timing, and any pre-sub or consultant materials
    - The US remains strategically important for TAM and exit comparables
    - Review regulatory plan with management and external advisors
  - - Private comparable round data
    - Round valuations or structured marks for CMR Surgical and similar assets
    - Private comps are more relevant than public multiples at this stage
    - Source from PitchBook, Dealogic, or investor references
  - - Independent clinical outcomes
    - Peer-reviewed procedure data from named partner sites
    - Clinical proof affects adoption, reimbursement, and strategic-acquirer confidence
    - Request study lists, publications, and principal-investigator interviews
  notes: These asks are ordered by how directly they improve valuation precision rather than by ease of collection.
