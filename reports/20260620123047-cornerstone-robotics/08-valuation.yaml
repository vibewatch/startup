company:
  name: Cornerstone Robotics
chapter:
  number: 8
  letter: V
  title: Valuation
  summary: 'Cornerstone Robotics has enough market, regulatory, and financing momentum to justify continued diligence, but not enough public commercial evidence to underwrite a buy-style recommendation at an implied unicorn valuation. The best-supported stance is research-more: strong category tailwinds and credible product progress offset by undisclosed revenue, trial-heavy customer proof, and a likely preference stack that outsiders cannot see.'
sections:
- id: investment-thesis-antithesis
  title: Investment thesis and anti-thesis
  body: 'The positive valuation case for Cornerstone starts with category logic rather than reported financial output. Surgical robotics remains a structurally attractive medtech segment, Asia Pacific is one of the faster-growing geographies, and Cornerstone has already demonstrated that it can navigate a difficult regulatory path across China, Europe, and Singapore. Those are not cosmetic milestones: they imply real engineering, clinical, manufacturing, and financing capability. The company also appears to have raised enough capital to keep funding commercialization while building a reference base around the Sentire platform. That is the core reason the story remains investable to study. The anti-thesis is equally important. Public evidence still does not show revenue, margins, installation economics, or repeatable non-academic customer conversion. In other words, Cornerstone may be a credible company in a good market without yet being a clearly supportable valuation at the current unicorn
    mark. The most honest public posture is to treat market strength and regulatory validation as necessary but insufficient until commercial proof and pricing clarity emerge.'
  claimRefs:
  - CV003
  - CV008
  - CV011
  - CV015
  - CV026
  - CV027
  - CV028
  - CV034
  - CV040
  - CV045
  tableRefs:
