  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-and-financials
    missingEvidence: Audited financial statements, revenue run rate, ARR, gross margin, and burn rate.
    whyItMatters: Without revenue and margin disclosure, valuation multiples are uncomputable and the implied $1B-plus mark cannot be tested against fundamentals.
    diligencePath: Request management accounts, investor materials, and any audited or reviewed financial statements from the company.
    relatedQuestionRefs:
    - QV026
    - QV030
  - type: private-evidence-only
    severity: material
    topic: cap-table-preference-stack
    missingEvidence: Preference stack, anti-dilution protections, liquidation preferences, and ownership percentages from all major rounds.
    whyItMatters: Dilution and liquidation preference overhang can materially change common-share economics even if the headline valuation looks attractive.
    diligencePath: Obtain the cap table and shareholder agreements from company legal counsel or lead investors.
    relatedQuestionRefs:
    - QV027
  - type: missing-source
    severity: material
    topic: us-fda-strategy
    missingEvidence: US FDA clearance strategy, timeline, and any pre-submission or consultant materials.
    whyItMatters: The US is strategically important for TAM, comparables, and IPO/exit narratives, so an absent or weak pathway caps upside.
    diligencePath: Confirm the FDA strategy in management meetings and request any pre-submission correspondence or external regulatory assessments.
    relatedQuestionRefs:
    - QV028
    - QV029
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-private-round-data
    missingEvidence: Private round valuation marks for CMR Surgical, SS Innovations, and other surgical-robotics challengers.
    whyItMatters: Private-market valuation data would offer the most relevant stage-matched anchor for Cornerstone and improve acquisition-premium analysis.
    diligencePath: Source through PitchBook, Dealogic, secondary investors, or direct diligence with comparable-company investors.
    relatedQuestionRefs:
    - QV028
    - QV030
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: material
    topic: independent-clinical-outcomes
    missingEvidence: Published peer-reviewed clinical outcomes from CUHK, Portsmouth, Woodlands, or other Sentire reference sites.
    whyItMatters: Independent outcomes data are necessary to strengthen reimbursement, adoption, and exit-readiness assumptions.
    diligencePath: Request study identifiers, publication status, and interviews with site investigators or surgeons.
    relatedQuestionRefs:
    - QV029
