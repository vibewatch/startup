  - TV002
  figureRefs:
  - FV001
- id: valuation-context
  title: Current valuation context and entry discipline
  body: 'Public valuation context is dominated by one fact and one omission. The fact is that Cornerstone appears to have crossed the unicorn threshold after its November 2025 financing round and now sits on roughly $435M of disclosed capital raised. The omission is that no public source reviewed here provides revenue, gross margin, annual recurring service revenue, procedure volume, or cash-burn detail. That omission matters because it blocks the most intuitive underwriting shortcut: a revenue multiple. Investors can say the business is well funded and can say outside media infer a $1B-plus mark, but they cannot test whether the price is aggressive or conservative against disclosed fundamentals. Entry discipline therefore has to be scenario-based rather than formulaic. The right public question is not whether Cornerstone is a good company, but whether the current implied valuation leaves enough margin of safety given opaque economics, unknown preference overhang, and the likelihood of continued
    capital intensity. Without clearer revenue and cap-table evidence, the best discipline is to track, not chase, the financing headline.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV007
  - CV009
