- id: drivers-constraints
  title: Growth drivers, adoption constraints, and Cornerstone's market fit
  body: >-
    The primary structural drivers for the global and APAC surgical robotics market are: (1) rising
    prevalence of chronic disease and aging populations increasing demand for complex surgical interventions,
    (2) growing clinical evidence that robotic-assisted surgery reduces complication rates, shortens hospital
    stays, and improves surgical ergonomics, (3) technology advances in AI guidance, improved imaging, and
    haptic feedback systems that are making robotic platforms more capable and easier to train, and (4)
    government investment in healthcare modernization and local manufacturing capacity, particularly in China,
    India, South Korea, and Japan. The prnewswire.com 2026 Medtec outlook note confirms that Intuitive
    Surgical's Q1 2026 results — US$2.77B revenue at 23% growth — validate strong hospital demand and
    suggest the market is in an acceleration phase rather than a saturation phase.

    Adoption constraints are concentrated in economics and training. High upfront system cost of US$2M
    or more limits penetration to institutions with large capital budgets. Ongoing maintenance,
    instrument replacement, and software subscription costs add to the total cost of ownership. Reimbursement
    inconsistency across national health systems means hospitals in many APAC markets cannot quickly
    recover system investment through patient billing. Training barriers are real: the surgical literature
    cited in IntelMarketResearch describes a learning curve of 20–30 cases per surgeon before achieving
    full proficiency, which delays full utilization and adds overhead to early-stage deployments. Regulatory
    approval timelines (3–5 years and costly clinical trials) also delay new entrants and updates to existing
    platforms. Finally, the DataMintelligence 2026 update notes that surgical errors related to insufficient
    training and wrong case selection remain a challenge, creating conservative institutional attitudes
    toward adoption.

    Cornerstone's positioning aligns most directly with the APAC-local manufacturing trend: it is one of
    the few non-Western platforms with regulatory approvals in China (NMPA), the EU (CE MDR), and Singapore
    (HSA). Its in-house development model and stated quality-manufacturing focus position it as a lower
    switching-cost alternative to Western incumbents in markets where government policy favors domestic
    procurement. The APAC market's faster CAGR (11.6–15.4%) versus the global average gives Cornerstone
    a growing total addressable pool even at current market penetration rates.
