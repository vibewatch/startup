chapter:
  number: 2
  title: Market Analysis
  summary: >-
    The global surgical robotics market is estimated at US$6.6–11.0B in 2025 across major analyst sources, with
    compound annual growth rates of 11–15% projected through 2030–2035. Asia-Pacific is the fastest-growing
    region, valued at US$1.16–2.04B in 2025 with CAGR of 11.6–15.4% depending on source and geography.
    China alone is forecast to reach 30B yuan (≈US$4B) by 2026. Primary buyers are large private hospitals
    and academic medical centers; high system cost (>US$2M), reimbursement gaps, and surgeon-training
    requirements are the leading adoption constraints. Cornerstone Robotics targets urology, general surgery,
    gynecology, and thoracic specialties — four of the top-five APAC application segments — and its APAC-first
    regulatory approvals (NMPA, CE MDR, HSA) align well with the fastest-growing sub-markets.
sections:
- id: market-boundary
  title: Market boundary, adjacencies, and status-quo substitutes
  body: >-
    The surgical robotics market is defined as systems and associated consumables used to assist surgeons
    performing minimally invasive procedures through robotic-assisted platforms. Included spend covers
    robotic surgery system hardware, surgical instruments and accessories (e.g., trocars, graspers, needle
    holders, cameras), and software, service, and maintenance contracts. Excluded spend includes pure
    laparoscopic towers without robotic control, open-surgery instrumentation, and non-surgical robotic
    applications such as diagnostic or pharmacy robotics. Adjacent markets that partially overlap include
    orthopedic robotic platforms (e.g., Stryker Mako, Zimmer Biomet ROSA), stereotactic neurosurgical
    systems, and cardiac-specific robotic platforms that some reports bundle or exclude depending on
    methodology — a key reason for the wide range of total market estimates.

    The status-quo substitute is conventional laparoscopic surgery: a well-established technique with a
    large installed base of non-robotic video towers and instruments. Surgeons trained exclusively on
    laparoscopic approaches represent a switching-cost barrier as they must invest significant time learning
    robotic consoles. Hospitals also compare robotic surgery against hybrid approaches (laparoscopic + robotic
    for specific steps) and, in some settings, against open surgery. The relevant adoption question for any
    robotic entrant is not merely clinical performance but total cost of ownership, reimbursement alignment,
    and the speed at which the hospital can build surgeon volume to justify the capital outlay. Cornerstone
    Robotics competes across all four of the leading APAC specialties — urology, general surgery, gynecology,
    and thoracic — that together represent approximately 75% of APAC application volume, putting it in direct
    competition with all major platforms rather than occupying a niche.
