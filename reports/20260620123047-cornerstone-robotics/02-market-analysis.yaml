- id: TM004
  title: Growth drivers and adoption constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Market implication
  - Diligence ask for Cornerstone
  rows:
  - - Aging populations and rising chronic disease prevalence
    - Driver
    - Current and accelerating
    - Higher surgical volume especially in urology, orthopedics, gynecology; direct demand expansion
    - Verify Cornerstone's pipeline strategy for age-demographic geographies (Japan, China)
  - - AI integration and advanced imaging adoption
    - Driver
    - Current and near-term
    - Platforms without AI guidance will be at growing disadvantage; Cornerstone in-house stack required to integrate
    - Confirm whether Sentire's roadmap includes AI-guided surgical assistance features
  - - Government modernization and local-manufacturer preference
    - Driver
    - Current (China, India, South Korea, Japan)
    - Domestic entrants benefit from procurement preference; reduces Western market share
    - Verify whether Cornerstone has accessed any China government-backed hospital procurement programs
  - - Cost-effective and modular platform development
    - Driver / competitive pressure
    - Near-term
    - Platform price-performance bar is rising; modular designs (CMR Versius) are setting new expectations
    - Request Cornerstone's system pricing and total-cost-of-ownership comparison versus da Vinci and Versius
  - - High capital cost and reimbursement gaps
    - Constraint
    - Current and persistent
    - Limits adoption to well-capitalized hospitals; slows penetration in tier-2 and rural markets
    - Assess whether Cornerstone offers financing, leasing, or usage-based models to lower upfront hurdle
  - - Surgeon training requirements (20–30 case learning curve)
    - Constraint
    - Current
    - Delays full utilization post-purchase; hospitals need adequate training capacity
    - Confirm Cornerstone's training throughput and average time-to-clinical-readiness from installation
  notes: >-
    Drivers and constraints represent the analyst-consensus view from multiple market reports; specific to
    the Asia-Pacific soft-tissue robotic surgery market unless noted.
