- id: market-sizing
  title: TAM, SAM, and SOM sizing across multiple analyst lenses
  body: >-
    Four major analyst firms produced 2025 global baseline estimates ranging from US$6.6B (DataMintelligence)
    to US$10.9B (IntelMarketResearch), with MarketsAndMarkets and Grand View Research producing 2024 baselines
    of approximately US$11.98B and US$11.48B respectively. The wide range (roughly 1.6x between low and high)
    reflects different scope decisions on whether orthopedic and specialty platforms are included. Forward
    projections to 2030 also diverge: IntelMarketResearch projects US$32.1B by 2034 (12.4% CAGR),
    MarketsAndMarkets US$27.14B by 2030 (14.7% CAGR), Grand View Research US$23.13B by 2030 (12.4% CAGR),
    and DataMintelligence US$16.89B by 2033 (11.3% CAGR). These estimates should be read as a range, not
    reconciled to a point estimate, because the methodological differences are not disclosed in public
    summary materials.

    The APAC sub-market shows more consistent estimates. MarketsAndMarkets sizes it at US$2.04B in 2025,
    growing to US$4.81B by 2031 at a 15.4% CAGR. Precedence Research estimates US$1.16B in 2025, US$1.29B
    in 2026, and US$3.48B by 2035 at an 11.6% CAGR. MarketResearch.com (Analyst View) estimates US$1.28B
    in 2025 with a 13.5% CAGR through 2033. These APAC estimates are narrower (roughly 1.6x spread) and
    consistently put the region's CAGR above the global average, making it the most attractive growth
    geography for new entrants. China alone represents a major opportunity: the market was approximately
    12B yuan (US$1.67B) in 2023 and is forecast to reach 30B yuan by 2026 per Wind Info data, implying
    a 42.61% domestic CAGR driven by government promotion of local manufacturers.

    A SAM for Cornerstone can be approximated as the portion of the APAC soft-tissue robotic surgery
    market addressable by a four-specialty general/gynecology/thoracic/urology platform. Given that these
    four specialties account for approximately 75–80% of APAC application volume, the SAM is in the range
    of US$0.9–1.6B in 2025. A SOM estimate is not supportable from public evidence because Cornerstone
    has not disclosed installed-base counts, procedure volumes, or pricing; this is recorded as a material
    evidence gap.
