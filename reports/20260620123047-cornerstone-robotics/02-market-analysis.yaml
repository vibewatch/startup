  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: SOM-and-market-share
    missingEvidence: Cornerstone's installed-base count, annual procedure volume by geography, and revenue from system sales versus consumables and services.
    whyItMatters: Without these inputs, a specific SOM estimate is not constructible and revenue-at-scale assumptions rely on analogy rather than evidence.
    diligencePath: Request installed-base table, cumulative procedure count by specialty, and revenue breakout by system vs. instruments vs. service under NDA.
    relatedQuestionRefs:
    - QM025
  - type: private-evidence-only
    severity: material
    topic: system-pricing
    missingEvidence: Sentire list price, service contract terms, instrument replacement economics, and total-cost-of-ownership comparison versus competitors.
    whyItMatters: Pricing is central to the accessibility claim and to modeling penetration rate in different hospital tiers.
    diligencePath: Request price sheets, service contracts, and a TCO model from Cornerstone's commercial team.
  - type: missing-source
    severity: minor
    topic: apac-reimbursement-detail
    missingEvidence: Country-by-country reimbursement status for robotic-assisted surgery in China, South Korea, Singapore, and UK.
    whyItMatters: Reimbursement is a major adoption gating factor; without country-level data, the constraint cannot be quantified.
    diligencePath: Review country-specific reimbursement databases (NHSA China, HIRA South Korea, MoH Singapore, NHS England) for robotic surgery codes.
  - type: stale
    severity: minor
    topic: china-market-estimate
    missingEvidence: Updated 2025–2026 China surgical robotics market data to validate or update the Wind Info 42.61% CAGR projection.
    whyItMatters: The China figure is the most extreme CAGR in the dataset and may reflect pre-regulation policy assumptions that have since changed.
    diligencePath: Access NMPA registration records and hospital procurement data through MedChina or China-specific market research.
