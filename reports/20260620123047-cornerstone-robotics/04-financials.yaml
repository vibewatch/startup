  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cac-payback
    missingEvidence: Customer-acquisition cost, payback period, and hospital sales-cycle data are not publicly disclosed.
    whyItMatters: Without CAC and payback, GTM efficiency cannot be benchmarked against other capital-intensive medtech models.
    diligencePath: Request cohort-level sales funnel data, commercial headcount productivity, and conversion timing from first demo to booked system.
    relatedQuestionRefs:
    - QI010
  - type: private-evidence-only
    severity: material
    topic: breakeven-threshold
    missingEvidence: No public installed-base, procedure-volume, or fixed-cost absorption data supports a minimum breakeven footprint calculation.
    whyItMatters: The margin thesis depends on knowing how many active systems and procedures are needed before service and disposable pull-through cover fixed costs.
