- id: TI003
  title: Unit Economics Snapshot
  columns:
  - Metric
  - Value/Estimate
  - Confidence
  - Why It Matters
  - Diligence Ask
  rows:
  - - Sentire system ASP
    - USD 0.8M-1.8M estimated range
    - Low
    - Core anchor for translating each hospital win into booked equipment revenue
    - Provide actual list price, realized ASP, and financing or lease terms
  - - Service attachment
    - Likely meaningful but undisclosed
    - Low
    - Determines recurring revenue quality and post-install gross-profit durability
    - Disclose attach rate, renewal rate, and service gross margin
  - - Disposable pull-through
    - Likely critical to lifetime value but unquantified
    - Medium
    - Recurring consumables often drive margin expansion after placement base is installed
    - Disclose per-procedure revenue, mix, and active procedure counts
  - - CAC / payback
    - Not publicly disclosed
    - Low
    - Enterprise medtech sales efficiency drives how much capital must be burned before scale
    - Share funnel conversion, sales cycle, and payback by account cohort
  - - Installed-base utilization
    - Not publicly disclosed
    - Low
    - Utilization determines whether fixed costs are absorbed and whether service teams become efficient
    - Provide systems placed, active sites, procedures per site, and uptime metrics
  notes: This snapshot separates what can be estimated from what remains completely undisclosed in open sources.
