company:
  name: Cornerstone Robotics
chapter:
  number: 4
  title: Financials
  summary: Cornerstone Robotics has the outline of a serious surgical-robotics revenue model and a clearly substantial funding base, but almost every underwrite-grade financial metric remains undisclosed. The strongest public evidence is the company’s roughly USD 435 million disclosed capital history, its manufacturing and R&D footprint, and the inferred mix of equipment, service, disposable, and training revenue; the weakest area is current revenue, margin, cash, and utilization transparency.
sections:
- id: revenue-model-and-monetization-structure
  title: Revenue Model and Monetization Structure
  body: 'Cornerstone Robotics presents the ingredients of a classic surgical-robotics revenue stack even though it does not publish the price sheet. The public record reviewed here supports four monetization layers: initial sale of the Sentire platform, annual or multi-year service and maintenance, per-procedure sterile disposables and instruments, and professional education or training services. That structure matters because it implies revenue quality will eventually depend less on one-time robot shipments than on recurring service attachment and procedure pull-through. The problem for diligence is that the company discloses the existence of these activities more clearly than it discloses the associated economics. No public source reviewed for this chapter gives list pricing, discount policy, contract duration, or revenue-recognition detail. The result is a credible but still schematic model: investors can see where revenue should come from, but not how much of it is currently realized,
    recurring, or margin-accretive.'
  claimRefs:
  - CI006
  - CI007
  - CI008
  - CI009
  - CI017
  - CI018
  - CI021
  - CI022
  - CI033
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: unit-economics-and-pricing-intelligence
  title: Unit Economics and Pricing Intelligence
  body: Public unit economics for Cornerstone Robotics are almost entirely benchmark-based. The company does not disclose Sentire ASP, service contract value, instrument pricing, gross margin, customer lifetime value, or CAC. That forces diligence to start from competitor context. In surgical robotics, established systems are expensive capital purchases with meaningful maintenance tails and recurring instrument revenue, so a Sentire price band in the high-six-figure to low-seven-figure range is plausible even if still unverified. The commercial question is not just whether hospitals can afford the first system, but whether utilization becomes high enough for service and disposable pull-through to offset installation and support costs. In that sense, unit economics are directionally understandable while still numerically opaque. Investors can sketch the bridge from system sale to recurring gross profit, but they cannot yet validate realized pricing, discount discipline, or sales efficiency.
    That leaves the underwriting case dependent on comparable-company logic rather than company disclosure.
  claimRefs:
  - CI007
  - CI010
  - CI012
  - CI013
