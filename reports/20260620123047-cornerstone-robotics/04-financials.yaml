- id: cost-structure-and-capital-intensity
  title: Cost Structure and Capital Intensity
  body: 'Cornerstone’s cost structure looks like that of a hardware-led medtech platform rather than a software company. The official footprint points to three R&D hubs, six business centers, and a 30000-square-meter manufacturing facility in China, all of which imply meaningful fixed expense before revenue is visible publicly. Manufacturing drives tooling, inventory, QA, field-service readiness, and spare-parts obligations. Clinical and regulatory work add another layer: once a surgical robot enters multiple markets, the company must support training, post-market surveillance, documentation, and localized commercial support. Those costs are not temporary launch items; they continue as the installed base grows. This is why public revenue opacity matters so much. Without utilization, installed-base, or gross-margin data, it is impossible to know whether Cornerstone is still in a pre-scale absorption phase or already moving toward operating leverage. The category backdrop suggests a heavy
    working-capital model where fixed costs are front-loaded and recurring profitability comes later.'
  claimRefs:
  - CI004
  - CI014
  - CI015
  - CI023
  - CI024
  - CI025
  - CI026
  - CI034
  figureRefs:
  - FI004
- id: capital-adequacy-and-funding-runway
  title: Capital Adequacy and Funding Runway
  body: The strongest public financial fact for Cornerstone Robotics is not revenue but funding. The company appears to have raised about USD 435 million across disclosed rounds, culminating in an approximately USD 200 million financing in November 2025. That is a substantial war chest for a private medtech company and likely the main reason the business could build manufacturing capacity, support multiple geographies, and continue regulatory expansion. Even so, capital raised is not the same as cash on hand. The public record does not disclose current cash, debt, burn, working-capital draw, or covenant obligations. A directional burn estimate can be inferred from the scale of infrastructure and the norms of surgical robotics, but the range remains broad and highly assumption-driven. The right conclusion is that Cornerstone looks funded enough to keep scaling in the near term, yet still financing-dependent until management discloses whether system adoption and recurring revenue are absorbing
    the fixed-cost base.
  claimRefs:
  - CI001
  - CI028
  - CI029
  - CI030
  - CI031
  - CI032
  - CI037
  - CI038
