    - No public price sheet, realized ASP, financing model, or geography adjustment disclosed
    - Low
  - - Annual service / maintenance
    - USD 0.08M-0.20M per system-year benchmark
    - Category benchmark from surgical-robot service economics and installed-base support logic
    - No public evidence on attach rate, term length, scope, or uptime SLA commitments
    - Low
  - - Per-procedure disposables
    - Material recurring revenue per case, exact price undisclosed
    - Inferred from recurring instrument economics common to robotic surgery platforms
    - No public instrument mix, turnover limit, or procedure-volume disclosure
    - Low
  - - Training / education
    - Commercially real but price undisclosed
    - Supported by official training and recruiting materials rather than explicit monetization schedules
    - Could be bundled into launch packages instead of billed separately
    - Low
  - - Revenue-recognition shape
    - Likely hybrid of up-front equipment plus deferred recurring services
    - Based on how capital equipment and support typically monetize in medtech
    - No public contract examples to test milestone timing, warranties, or bundle allocation
    - Low
  notes: Every number here is estimated or inferred from public comparables; Cornerstone has not disclosed list pricing or realized pricing.
