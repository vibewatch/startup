tables:
- id: TI001
  title: Revenue Streams Table
  columns:
  - Revenue Stream
  - Mechanism
  - Unit
  - Current Status
  - Quality Assessment
  - Diligence Ask
  rows:
  - - Capital equipment
    - Hospital or surgical center purchases a Sentire platform as a major-capex installation
    - System
    - Revenue stream is strongly implied by the product model but no public contract economics are disclosed
    - Strategically essential but opaque on ASP and booking cadence
    - Request list price, realized ASP, discount bands, and whether deals are purchase, lease, or milestone-based
  - - Service and maintenance
    - Annual support, uptime, maintenance, and spare-parts coverage after installation
    - System-year
    - Recurring service is economically likely for surgical robotics but no public service schedule or price is disclosed
    - Potentially high-quality recurring revenue if attach rate is strong
    - Request attach rate, average contract term, renewal rate, and field-service gross margin
  - - Per-procedure disposables
    - Sterile instruments and accessories are consumed or cycled as procedures are performed
    - Procedure
    - Mechanism is industry-standard and fits the platform model, but Cornerstone publishes no utilization or pricing data
    - Could become the main lifetime-value lever once installed base scales
    - Request disposable ASP, turnover assumptions, and procedure-volume by site
  - - Professional education and training
    - Clinician education, onboarding, and course delivery tied to robot adoption
    - Trainee or course
    - Training is publicly visible through official materials but not monetized publicly
    - Useful monetization layer and adoption enabler, but likely small today
    - Request course pricing, whether training is bundled, and training cost recovery
  - - Implementation and launch support
    - Pre-installation planning, setup, workflow integration, and early use support around first system go-live
    - Site launch
    - Commercially plausible but not described as a separate line item in public evidence
    - May be embedded in system pricing rather than billed separately
    - Clarify what implementation costs are capitalized, expensed, or billed to customers
  notes: Revenue mechanisms are inferred from product, footprint, and training disclosures; no public contract ledger or revenue-recognition note is available.
