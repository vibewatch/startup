- id: TI005
  title: Financial Disclosure Gaps
  columns:
  - Missing Metric
  - Impact on Diligence
  - Diligence Path
  - Severity
  rows:
  - - Revenue and revenue mix by stream
    - Prevents validation of revenue quality and dependence on one-off system sales
    - Request monthly and trailing-twelve-month revenue split across equipment, service, disposables, and training
    - Blocking
  - - Gross margin by line
    - Blocks any view on margin path and whether installed-base scaling is improving economics
    - Request gross margin by revenue stream plus service and disposable contribution margins
    - Blocking
  - - Installed base and procedure volume
    - Prevents conversion of product footprint into recurring revenue and utilization models
    - Request system placements, active sites, case volume, and per-site utilization
    - Material
  - - Cash, burn, and working capital
    - Prevents credible runway and solvency assessment
    - Request current cash, monthly burn, inventory build, receivables, and payables detail
    - Blocking
  - - Audited financial statements
    - Prevents validation of accounting quality, debt, capex, and revenue recognition
    - Request audited statements or lender-grade financial package before valuation work proceeds
    - Blocking
  notes: This table is intentionally gap-oriented because Cornerstone’s public financial narrative is much thinner than its milestone narrative.
