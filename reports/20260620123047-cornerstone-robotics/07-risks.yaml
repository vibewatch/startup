  evidenceGaps:
    - type: missing-source
      severity: material
      topic: us-fda-pathway
      missingEvidence: Public evidence of any FDA pre-submission, 510(k), De Novo, or PMA filing strategy, timing, or correspondence for Sentire.
      whyItMatters: US access is one of the biggest value drivers and risk reducers in surgical robotics, so the absence of a documented pathway leaves valuation upside and timing highly uncertain.
      diligencePath: Request regulatory strategy decks, FDA correspondence logs, advisor memos, and a milestone calendar for any planned US filing.
      relatedQuestionRefs: [QR002, QR017]
      relatedTableRefs: [TR001, TR005]
    - type: missing-source
      severity: material
      topic: china-manufacturing-controls
      missingEvidence: Public disclosure on alternate manufacturing sites, dual-sourcing plans, export-control contingency planning, and supplier concentration for China-based production.
      whyItMatters: A single-region manufacturing base can turn geopolitical or logistics friction into shipment, service, and recall-response risk across all markets.
      diligencePath: Request supplier map, continuity plan, second-site options, inventory policy, and critical-component dependency analysis.
      relatedQuestionRefs: [QR005, QR016]
      relatedTableRefs: [TR002, TR003]
    - type: private-evidence-only
      severity: material
      topic: financial-model-burn-rate
      missingEvidence: Audited revenue, gross margin, monthly burn, cash balance, working-capital needs, and recurring-revenue mix for Sentire commercialization.
      whyItMatters: Public fundraising alone cannot distinguish healthy scale investment from a business model that may require a faster-than-expected follow-on round.
      diligencePath: Obtain audited financials, board reporting packs, monthly cash bridge, and scenario model for gross margin and procedure-linked revenue.
      relatedQuestionRefs: [QR015, QR022, QR026]
      relatedTableRefs: [TR004, TR005]
    - type: missing-source
      severity: minor
      topic: ip-portfolio-depth
      missingEvidence: Patent family schedule, jurisdiction coverage, freedom-to-operate work product, and any history of licensing or disputes.
      whyItMatters: Surgical robotics is a dense IP environment, so limited public disclosure makes it hard to assess moat strength and latent legal exposure.
      diligencePath: Request patent counsel memo, patent appendix, and management discussion of defensive and offensive IP strategy.
      relatedQuestionRefs: [QR024]
      relatedTableRefs: [TR001]
    - type: missing-source
      severity: material
      topic: peer-benchmark-and-operating-depth
      missingEvidence: Stage-matched peer data on partner concentration, field reliability, partner-commitment changes, enforcement database coverage, and independent benchmarking of mitigation maturity versus sector best practice.
      whyItMatters: Several residual-risk questions remain only partially answered because public evidence is strongest on milestones and weakest on comparative operating depth, which is exactly where commercialization risk is decided.
      diligencePath: Build a peer benchmark pack covering partner concentration, service metrics, recall and enforcement screens, partner attrition history, and third-party quality-system comparisons for Cornerstone and close surgical-robotics peers.
      relatedQuestionRefs: [QR025, QR027, QR028, QR029, QR030]
      relatedTableRefs: [TR002, TR003, TR005]
