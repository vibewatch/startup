callouts:
  - calloutType: risk
    title: Competitive moat challenge
    body: >-
      Intuitive Surgical's installed base, surgeon familiarity, and recurring-instrument economics are the most durable
      long-term risk in the Cornerstone thesis. Even if Sentire continues to win regulatory milestones, the harder problem
      is persuading hospitals to switch capital, workflow, and training budgets away from platforms they already know.
    claimRefs: [CR007, CR008, CR009, CR036]
  - calloutType: risk
    title: China manufacturing geopolitical exposure
    body: >-
      Cornerstone's China-linked manufacturing footprint creates an exposure that is strategically larger than a normal
      supplier-risk issue. If export controls, customs friction, or geopolitical escalation affect advanced robotics inputs,
      the company has no publicly disclosed alternate manufacturing strategy to protect rollout continuity.
    claimRefs: [CR005, CR014, CR043]
  - calloutType: assumption
    title: Revenue and burn are estimated, not verified
    body: >-
      Public fundraising disclosures are strong enough to suggest meaningful runway, but the company does not disclose
      revenue, gross margin, or audited burn. Any financial-risk view in this chapter should therefore be read as a bounded
      estimate rather than as a management-verified operating model.
    claimRefs: [CR011, CR013, CR018]
