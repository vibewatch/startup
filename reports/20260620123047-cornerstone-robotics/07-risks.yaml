runDate: '2026-06-20'
company:
  name: Cornerstone Robotics
chapter:
  number: 7
  letter: R
  title: Risks
summary: >-
  Cornerstone Robotics' risk profile is led by four linked issues: Sentire has meaningful regulatory progress in China,
  the EU, and Singapore but no disclosed US FDA pathway; the company faces entrenched competition from Intuitive,
  Medtronic, and other robotic-surgery entrants; manufacturing concentration in China exposes the platform to supply-chain
  and geopolitical shocks; and public financial and governance disclosure remains thin despite the company's large funding
  history. No public recall, enforcement action, or litigation was identified through June 2026, but the absence of broad
  commercialization metrics means several high-severity risks remain only partially mitigated.
sections:
  - id: regulatory-legal-risk
    title: Regulatory and legal risks
    body: >-
      Cornerstone has real regulatory momentum, but it still has a market-access gap that matters disproportionately for
      valuation. The company publicly disclosed China NMPA approval earlier, then CE MDR and Singapore HSA certification in
      May 2026, yet no comparable US FDA clearance has been surfaced in company releases or independent coverage. That means
      Sentire remains absent from the world's largest surgical-robotics profit pool even as incumbent rivals continue to
      expand installed base and surgeon lock-in. The legal and compliance burden also continues after approval: CE MDR is not
      a one-time event, and ongoing post-market surveillance, complaint handling, and field-corrective-action obligations can
      become expensive as the installed base grows. UK commercialization adds another nuance because post-Brexit market entry
      is distinct from EU CE MDR, while the Portsmouth NHS activity is best read as clinical-evidence generation rather than
      proof of broad commercial MHRA-backed rollout. Public searches found no litigation, sanctions, or enforcement actions,
      but IP depth, freedom-to-operate analysis, and privacy controls remain thinly disclosed.
    claimRefs: [CR001, CR002, CR003, CR004, CR015, CR019, CR020, CR021, CR025, CR035, CR038, CR042]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: operational-supply-chain-risk
    title: Operational, supply-chain, and quality risks
    body: >-
      Surgical robotics creates operational risk even before scale, and Cornerstone adds a clear concentration layer because
      its manufacturing footprint is publicly tied to China. That exposes the company to component bottlenecks, customs or
      export-control disruption, and slower recovery if a quality problem emerges in the field. The platform is also a
      single-product system: any serious device defect, sterile-instrument issue, software fault, or adverse event could
      disrupt all commercialization at once rather than just a product line. The public record is encouraging in one narrow
      sense because no recall, adverse-device-event cluster, or regulator enforcement notice was identified through June 2026.
      But that absence should be treated as an early-stage observation, not as proof that risk has been retired. Cornerstone's
      quality page suggests some formal manufacturing and quality controls are in place, yet no third-party audit detail,
      cybersecurity certification, or patient-data governance architecture was found in public materials. That leaves quality,
      service readiness, and cyber-resilience only partially evidenced.
    claimRefs: [CR004, CR005, CR014, CR017, CR028, CR030, CR032, CR041, CR042, CR043]
    tableRefs: [TR002]
    figureRefs: [FR003]
  - id: competitive-commercialization-risk
    title: Competition and commercialization risks
    body: >-
      Competitive risk is the chapter's most persistent strategic threat because Cornerstone is entering a field where buyer
      behavior already favors scale incumbents. Intuitive's installed base and recurring instrument-and-service model create
      high switching costs, while Medtronic, CMR Surgical, SS Innovations, Moon Surgical, and other entrants compete for the
      same surgeon champions and hospital capital committees. Cornerstone therefore needs more than regulatory approvals: it
      needs evidence, training throughput, procurement wins, reimbursement pathways, and a reason for hospitals to adopt a
      new platform instead of expanding an existing one. The public record still shows an academic- and government-hospital
      go-to-market centered on lighthouse partnerships rather than a broad distributor network or mass-market reseller base.
      That raises partner concentration and trial-to-revenue conversion risk. Reimbursement is also unresolved. No dedicated
      Sentire reimbursement structure or publicly disclosed insurance coverage agreement was identified, so procurement may
      rely on research budgets, bundled hospital funding, or slow capital-approval cycles even after certification.
    claimRefs: [CR006, CR007, CR008, CR009, CR010, CR016, CR029, CR031, CR033, CR036, CR039, CR040, CR045]
    tableRefs: [TR003]
    figureRefs: [FR002]
  - id: financial-governance-risk
    title: Financial model and governance risks
    body: >-
      Cornerstone has raised large amounts of capital, but public financial transparency is still materially below what an
      investor would want for underwriting a hardware-heavy commercialization phase. The company has not disclosed revenue,
      ARR, gross margin, procedure-linked recurring revenue, or audited burn, so outside analysis cannot distinguish healthy
      investment intensity from a business model that may require frequent external capital. The most defensible public view
      is that the company has meaningful cash support after the 2025 financing, but runway remains an estimate rather than a
      verified fact. Governance risk is similarly centered on disclosure gaps. Samuel Au is the dominant public executive
      identity, while board composition, independent oversight, finance leadership depth, and succession planning are not
      clearly documented. That combination of founder concentration, limited reporting, and government-linked investor support
      is not inherently negative, but it does raise questions about control, accountability, and how resilient the company
      would be under a product delay, financing reset, or policy shock.
    claimRefs: [CR011, CR012, CR013, CR018, CR024, CR034, CR037, CR044]
    tableRefs: [TR004]
  - id: kill-criteria-mitigations
    title: Kill criteria, mitigations, and monitoring
    body: >-
      The investment case is not broken today, but it is only investable with explicit monitoring discipline. Cornerstone has
      already shown some mitigation capacity by winning CE MDR and Singapore HSA certifications, building hospital training
      relationships, and raising substantial capital. Those are real de-risking steps, not cosmetic signals. Even so, the
      highest-severity risks remain monitorable rather than solved. The most important thesis-break triggers are a failed or
      indefinitely absent US FDA pathway, a material product recall or serious safety signal, the loss of flagship academic
      partners, a down-round or forced bridge that implies capital stress, and geopolitical disruption that blocks component
      supply from China. Investors should treat the next 12 to 24 months as a validation period in which regulatory progress,
      quality performance, deployment conversion, and financing resilience all need to hold simultaneously. If those signals
      weaken together, the downside can transmit quickly from operations into revenue assumptions and valuation support.
    claimRefs: [CR019, CR021, CR022, CR023, CR025, CR030, CR041, CR043]
    tableRefs: [TR005]
