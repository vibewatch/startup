schemaVersion: report-v2
artifact: company-overview
slug: neuralink
runDate: 2026-10-15
company:
  name: Neuralink
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Neuralink is still a private, pre-revenue invasive BCI company, but the
    assigned evidence shows a real clinical footprint, a 2025 formal valuation
    anchor around $9.6-$9.65 billion, and expanding trial geography by 2026.
    The same evidence still leaves key underwriting basics unresolved,
    especially lifetime capital raised, live patient counts, the full
    governance map, and commercial economics beyond hospital-procedure
    estimates.
sections:
  - id: identity-and-platform
    title: Identity, stage, and current product scope
    body: |-
      Neuralink's current identity is clearer than its economics. Across the
      assigned official and independent sources, the company is a private
      neurotechnology developer founded in 2016 and headquartered in Fremont,
      California, building an invasive brain-computer-interface stack for
      paralysis-first use cases. The official site describes a system that
      translates neural signals into actions, while independent summaries
      consistently describe the integrated bundle as an implant, a surgical
      robot, and decoding software rather than a pure software product.

      The product story is no longer purely aspirational. Neuralink's homepage
      now foregrounds multiple implanted users and the official updates page
      shows a cadence of trial, safety, and product announcements. That does
      not make the business commercial: assigned third-party summaries still
      describe the company as private, pre-revenue, and pre-approval. For later
      chapters, the reliable reusable ground truth is that Neuralink has
      functioning human-trial hardware and software, but not yet a public
      revenue model or public-market disclosure profile.
    claimRefs: [CO001, CO002, CO003, CO004, CO011]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-capital-and-control
    title: Leadership, capital, and control visibility
    body: |-
      Public visibility into leadership is strongest around Elon Musk and Jared
      Birchall, with founding or senior-technical roles also attributed to Paul
      Merolla and Dongjin Seo in assigned investor-marketing profiles. That is
      enough to describe founder-market fit and key-person concentration, but
      not enough to underwrite governance cleanly. The assigned pool does not
      publish a complete current board roster, voting/control structure, or a
      reconciled stakeholder map that separates primary funding from secondary
      transactions and any debt or structured terms.

      Capital visibility is similarly mixed. Assigned sources agree on a 2025
      Series E of roughly $650 million at about a $9.6-$9.65 billion formal
      valuation, which is the cleanest current pricing anchor. After that, the
      evidence diverges materially: third-party sources cite total funding from
      $1.2 billion-plus to roughly $5 billion. That spread is too wide to treat
      as a settled cover metric, so later valuation work should use the formal
      round as the hard anchor and treat cumulative-capital tallies as a live
      diligence item instead of a verified fact.
    claimRefs: [CO005, CO006, CO007, CO008, CO014]
    tableRefs: [TO002, TO003]
  - id: milestones-and-risk-posture
    title: Milestones, footprint expansion, and unresolved execution risk
    body: |-
      The milestone pattern in the assigned pool is real and cumulative.
      Official and independent sources show a path from founding to first human
      implant, then to broader patient disclosure, international study
      expansion, and additional FDA Breakthrough Device Designations for
      Blindsight and speech restoration. By 2026 the chapter evidence supports
      an increasingly multi-program clinical platform, not just a single pilot
      implant story.

      The same sources also show why the name is still a diligence-heavy
      situation rather than a clean growth-equity story. Multiple summaries
      still call the business pre-revenue or pre-commercial, and risk-oriented
      sources emphasize multi-year approval timelines, thread-migration or
      durability questions, and founder concentration. The upshot is that
      Neuralink has crossed the threshold from concept to human use, but it has
      not crossed the threshold from clinical momentum to publicly evidenced
      commercial repeatability.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014, CO015]
callouts:
  - calloutType: insight
    title: Formal valuation is cleaner than cumulative-funding math
    body: >-
      The June 2025 Series E valuation is well corroborated in the assigned
      pool; total capital raised is not. Treat the round valuation as the
      dependable capital marker and the cumulative capital stack as open
      diligence.
    claimRefs: [CO005, CO006]
  - calloutType: risk
    title: Clinical proof exists, but commercialization proof does not
    body: >-
      Assigned evidence supports real implanted-patient progress, yet the same
      sources still describe Neuralink as pre-revenue, pre-approval, and
      exposed to long-duration durability and regulatory risk.
    claimRefs: [CO011, CO012, CO013]
  - calloutType: assumption
    title: Governance remains more personality-led than institutionally legible
    body: >-
      Musk and Birchall are visible, but the assigned public pool does not make
      the board, control rights, or succession plan legible enough for a clean
      governance underwrite.
    claimRefs: [CO007, CO008, CO014]
