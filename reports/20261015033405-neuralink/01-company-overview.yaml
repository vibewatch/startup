    rows:
      - [Corporate status, "Private; no ticker, S-1, or announced IPO date", "Sep 2026 third-party summaries", medium, "Monitor IPO filing only; public-market access is not current."]
      - ["Founded / HQ", "2016; Fremont, California", "Visible across 2026 company profiles", medium, "Verify legal entity and any HQ move in the diligence room."]
      - [Product scope, "Implanted BCI + surgical robot + decoder software", "Current official site and clinical summaries", medium, "Need independent performance and failure-rate disclosure."]
      - ["Last formal round", "Series E, about $650M", "June 2025 formal funding marker", medium, "Request executed round docs and any side letters."]
      - [Valuation, "$9.6-$9.65B post-money", "June 2025 formal round anchor", medium, "Treat higher secondary estimates as indications, not financing marks."]
      - ["Total capital raised", null, "Assigned summaries conflict from $1.2B+ to about $5B", low, "Reconcile primary capital, secondaries, debt, and any employee-liquidity sales."]
      - ["Patient count", "About 20 late 2025; 21 Jan 2026; 26 Jun 2026", "Point-in-time public disclosures", medium, "Need a current live enrollment and active-implant count."]
      - ["Revenue / run-rate", null, "Assigned sources call the company pre-revenue / pre-commercial", medium, "Request pricing, reimbursement, revenue, margin, burn, and runway data."]
      - [Headcount, null, "Third-party estimates conflict (201-500 vs. 450+)", low, "Request current headcount and hiring-plan data."]
      - [Geography, "US, Canada, Great Britain, UAE", "Trials or approvals reported by 2026", medium, "Confirm active sites and jurisdiction-by-jurisdiction enrollment."]
    notes: >-
      Null values mark metrics that are not cleanly supported in the assigned
      evidence; point-in-time patient and headcount figures should not be
      treated as a live operating dashboard.
    claimRefs: [CO001, CO002, CO003, CO005, CO006, CO009, CO011, CO013]
