    summary: >-
      Publicly visible milestones show Neuralink moving from founding to
      multi-program human clinical development, with financing and regulatory
      steps outpacing commercial disclosure.
    data:
      items:
        - date: 2016-07
          label: Founded in Fremont
          detail: Neuralink was founded in 2016 and public profiles place its headquarters in Fremont, California.
          tone: neutral
          claimRefs: [CO001]
        - date: 2024-01
          label: First human implant enters public record
          detail: The first PRIME participant was implanted on January 28, 2024.
          tone: positive
          claimRefs: [CO004]
        - date: 2024-07
          label: Second patient profile appears on official site
          detail: Neuralink's homepage lists Alex as implanted in July 2024.
          tone: positive
          claimRefs: [CO004]
        - date: 2024-09
          label: Blindsight gets breakthrough designation
          detail: Assigned sources say Blindsight received FDA Breakthrough Device Designation in 2024.
          tone: positive
          claimRefs: [CO010]
        - date: 2024-11
          label: ALS user profile broadens the use-case story
          detail: The homepage lists Brad, an ALS user, as implanted in November 2024.
          tone: positive
          claimRefs: [CO004]
        - date: 2025-05
          label: Speech-restoration breakthrough follows
          detail: Assigned sources place the speech-restoration Breakthrough Device Designation in 2025.
          tone: positive
          claimRefs: [CO010]
        - date: 2025-06
          label: Series E sets the latest formal valuation anchor
          detail: Independent summaries converge on roughly $650 million raised at about a $9.6-$9.65 billion valuation.
          tone: positive
          claimRefs: [CO005]
        - date: 2025-07
          label: Great Britain trial footprint launches
          detail: Neuralink's updates page says the GB-PRIME study launched across two sites in Great Britain.
          tone: positive
          claimRefs: [CO009]
        - date: 2026-06
          label: Global patient disclosures continue to climb
          detail: A September 2026 private-market summary says June 2026 enrollment reached 26 patients globally.
          tone: positive
          claimRefs: [CO013]
        - date: 2026
          label: Commercial proof still lags clinical momentum
          detail: Assigned third-party sources still describe Neuralink as pre-revenue, pre-commercial, and exposed to durability and approval risk.
          tone: risk
          claimRefs: [CO011, CO012]
    claimRefs: [CO001, CO004, CO005, CO009, CO010, CO011, CO012, CO013]
