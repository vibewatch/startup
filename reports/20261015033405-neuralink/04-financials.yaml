          label: Paralysis-focused clinical use
          note: Current public proof is clinical use and enrollment, not paid customer receipts.
        - id: implant
          label: N1 implant hardware
          note: Sacra estimates about $10,000 per device, but no realized selling price is disclosed.
        - id: procedure
          label: Surgery and support bundle
          note: Sacra cites total cost around $40,000; payer capture is not disclosed.
        - id: hospital
          label: Hospital / clinic buyer
          note: Sacra describes the initial go-to-market model as B2B2C through hospitals.
        - id: approval
          label: Approval and reimbursement path
          note: Commercial scale still depends on approval, coverage, and billing details that are not public.
        - id: revenue
          label: Recognized commercial revenue
          note: Elon Explained says the N1 has no price and no revenue yet.
      edges:
        - from: indication
          to: implant
          label: Clinical demand creates device demand
        - from: implant
          to: procedure
          label: Device is monetized with implantation
        - from: procedure
          to: hospital
          label: Provider setting captures delivery economics
        - from: hospital
          to: approval
          label: Billing scale depends on clearance and coverage
        - from: approval
          to: revenue
          label: Revenue appears only after paid procedures
    approximationNotes: "This figure shows the public mechanism path, not an observed revenue waterfall."
    claimRefs: [CI001, CI002, CI003, CI004]
