      - ["Surgical implantation + support", "Procedure revenue and peri-implant support around each case", "procedure episode", "No public realized price; Sacra cites total cost ~$40,000", "Low: third-party estimate, not disclosed price capture", "Need hospital bill, payer mix, and gross-to-net waterfall"]
      - ["Speech restoration application", "Future software-defined clinical application on the same implant platform", "therapy episode", "Breakthrough designation disclosed; no pricing or launch receipts", "Low: pipeline only", "Need commercialization timeline, coding path, and payer economics"]
      - ["Blindsight application", "Future indication expansion using the same implant platform", "therapy episode", "Planned trial path disclosed; no public commercialization terms", "Low: pipeline only", "Need trial budget, indication economics, and capital requirement"]
    notes: "Public evidence supports mechanism-level revenue paths, but realized pricing, reimbursement capture, and revenue recognition remain undisclosed."
    claimRefs: [CI001, CI002, CI003, CI004, CI013, CI014]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Monetization input
      - Public value/status
      - List vs realized pricing
      - Implication
      - Source
    rows:
      - ["Implant hardware", "~$10,000 per device (third-party estimate)", "Estimated list-like proxy; no realized selling price disclosed", "Too weak for revenue modeling", "Sacra"]
      - ["Procedure + support", "~$40,000 total cost (third-party estimate)", "Cost proxy, not disclosed hospital capture", "Cannot derive gross margin or payback", "Sacra"]
      - ["Current commercial revenue", "No public price and no revenue yet", "No paid-procedure evidence retained", "Clinical traction cannot be converted into ARR or revenue", "Elon Explained"]
      - ["Secondary-market share price", "~$82.87/share in late April 2026", "Private secondary indicator, not an operating price", "Useful for valuation context only", "Regolith"]
    notes: "Pricing rows mix third-party estimates, commercialization status, and secondary-market indicators; none proves realized hospital pricing or payer reimbursement."
    claimRefs: [CI002, CI003, CI004, CI011]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value/null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Lifetime capital raised", "$686M to $1.85B depending on source", "Low", "Changes dilution and runway assumptions materially", "Need signed cap table and round-close schedule"]
      - ["Latest valuation signals", "$9B formal round; ~$9.7B secondary indication", "Medium", "Sets the bar for future financing and return expectations", "Need round documents, share class, and liquidation preference detail"]
      - ["Headcount / fixed-cost proxy", "705 employees as of Sep 26", "Medium", "Implies substantial payroll before broad commercialization", "Need monthly opex, payroll run rate, and department mix"]
      - ["Regulatory scale still ahead", "30-100+ patient pivotal trials still needed after early feasibility", "Medium", "Longer trial path extends burn before cash generation", "Need trial budget, site count, and timeline to approval"]
      - ["Cash, burn, debt, runway", null, "Low", "Core underwriting inputs are still undisclosed publicly", "Need latest cash balance, monthly burn, debt covenants, and management runway view"]
    notes: "Null means the retained public sources do not disclose the metric at an underwritable level."
    claimRefs: [CI007, CI008, CI009, CI010, CI011, CI012, CI014]
figures:
