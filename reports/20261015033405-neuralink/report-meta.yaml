companyProfile:
  summary: >-
    Neuralink is a private invasive brain-computer-interface company building an implanted hardware, surgical robot, and
    decoder-software stack for paralysis-focused clinical use. The company has real human-trial momentum and a clear
    recent valuation anchor, but the public record still leaves its revenue model, reimbursement path, capital stack,
    and governance structure too opaque for clean underwriting.
