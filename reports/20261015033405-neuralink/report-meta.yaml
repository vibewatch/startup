  topStrengths:
    - Real implanted-patient progress now spans multiple public milestones and geographies.
    - The June 2025 Series E provides a clear current valuation anchor.
    - The platform spans implant hardware, surgical robotics, and decoder software across multiple indications.
  topRisks:
    - Public evidence still does not disclose revenue, reimbursement, gross margin, burn, debt, or runway.
    - Capital-stack and ownership visibility remain incomplete across public summaries.
    - Long-term implant durability, revision burden, and the regulatory path beyond early feasibility remain unresolved.
    - The company remains heavily tied to founder/personality concentration and a limited governance view.
  unresolvedGaps:
    - >-
      No public revenue bridge exists: pricing, reimbursement receipts, revenue mix, gross margin, burn, debt, and
      runway remain undisclosed.
    - >-
      Lifetime capital raised and the full cap-table / liquidation-preference structure are not reconciled in retained
      public evidence.
    - >-
      Public evidence does not quantify revision surgeries, serious adverse events, discontinuation, cohort retention,
      or a formal explant / continuity reserve.
    - >-
      The specific reimbursement plan — coding path, CMS engagement detail, and private-payer traction — is still not
      disclosed at an investor-underwritable level.
    - >-
      Governance visibility remains incomplete because the reviewed official materials do not publish a full board
      roster or a clean executive-governance map.
