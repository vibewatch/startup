callouts:
  - calloutType: "strength"
    title: "Integrated-stack advantage"
    body: >-
      Neuralink's most defensible edge in the reviewed pool is system integration:
      implant, wireless electronics, robotic placement, and decoding software are
      presented as one coordinated clinical product rather than as a standalone array.
    claimRefs: [CP001, CP008, CP009]
  - calloutType: "risk"
    title: "Less-invasive rivals can still win"
    body: >-
      Synchron and Precision do not need to beat Neuralink on maximum signal density
      to take share; they only need to be good enough for specific tasks while
      reducing surgical burden, reversibility concerns, or regulatory friction.
    claimRefs: [CP003, CP006, CP010, CP012]
