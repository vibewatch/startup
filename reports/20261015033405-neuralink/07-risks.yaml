  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: safety-disclosure
      missingEvidence: Cohort-level revision surgery rates, explant data, infection incidence, and durable signal-quality decay over time.
      whyItMatters: Without these data, it is hard to separate an improving early-feasibility program from a durable implant platform.
      diligencePath: Request the latest safety monitoring package, device survival curves, and any protocol amendments tied to hardware or surgery changes.
      relatedQuestionRefs: [QR002, QR008]
    - type: private-evidence-only
      severity: blocking
      topic: commercialization-gap
      missingEvidence: Public pricing, reimbursement strategy, hospital economics, gross margin assumptions, and continuity-support reserve design.
      whyItMatters: These inputs determine whether trial success can translate into investable economics and defensible patient support obligations.
      diligencePath: Request management's reimbursement roadmap, hospital deployment model, unit economics, and a long-term support covenant.
      relatedQuestionRefs: [QR006, QR008]
    - type: missing-source
      severity: material
      topic: governance-and-rights
      missingEvidence: A current public policy package on neural-data retention, consent withdrawal, and post-implant support obligations.
      whyItMatters: Privacy and continuity risk may become gating legal issues before scale commercialization.
      diligencePath: Request published data-governance policies, DPA-style controls, and device end-of-life procedures.
      relatedQuestionRefs: [QR005]
      relatedTableRefs: [TR001]
