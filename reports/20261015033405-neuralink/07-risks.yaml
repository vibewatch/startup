callouts:
  - calloutType: risk
    title: Regulatory progress is real, but it is not the same as approval readiness
    body: >-
      IDE access, Breakthrough designations, and multi-country trials prove
      motion, but the retained evidence still points to a multi-year approval
      and post-market support burden rather than a near-term de-risked device
      platform.
    claimRefs: [CR001, CR006, CR007, CR011]
  - calloutType: insight
    title: Neuralink's biggest operational hedge is learning speed, not proof of final reliability
    body: >-
      The company appears to be iterating quickly after the first patient's
      thread-retraction issue, yet the available public record still shows a
      platform learning curve rather than a fully proven device and procedure.
    claimRefs: [CR003, CR004, CR005, CR012]
  - calloutType: recommendation
    title: Thesis-break triggers should be tied to safety disclosure, reimbursement, and support commitments
    body: >-
      Investors should treat serious adverse-event disclosure, stalled
      enrollment, lack of reimbursement detail, or no long-term continuity plan
      as harder stop signs than enthusiastic enrollment or funding headlines.
    claimRefs: [CR007, CR008, CR011, CR013, CR016]
