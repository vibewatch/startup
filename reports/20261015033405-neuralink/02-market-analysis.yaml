    rows:
      - ["Telepathy paralysis use case", "Patients with severe paralysis", "Hospitals and clinical centers; payer support unresolved", "Neurosurgery plus rehabilitation / assistive-tech workflow", "Reliable cursor, typing, and digital-independence gains", "Active PRIME cohort and repeated thought-controlled computer use."]
      - ["Speech restoration", "Patients with severe communication impairment", "Hospital systems and neuro-rehab programs", "Speech, neurology, and assistive-communication budgets", "Breakthrough-designation progress plus usable decoded speech outcomes", "Program exists, but no public commercial pricing or payer evidence."]
      - ["Blindsight vision restoration", "Blind patients including people without functional eyes or optic nerves", "Future neurosurgical / ophthalmic centers", "Vision-restoration clinical budgets", "Human-trial start plus safety and efficacy proof", "Roadmap is public, but no commercial or trial-volume evidence yet."]
      - ["Long-term enhancement market", "Healthy users", "No current validated buyer", "No approved budget owner", "Sharp cost decline plus social and regulatory acceptance", "Optionality narrative only; treat as valuation upside, not core demand."]
    notes: "Economic buyers remain provider-mediated in retained evidence; direct-to-consumer demand is narrative rather than an evidenced current workflow."
    claimRefs: ["CM002", "CM006", "CM007", "CM012"]
