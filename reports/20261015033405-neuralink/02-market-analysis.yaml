      - ["Speech restoration adjacency", "Implant-enabled speech decoding workflows for ALS, stroke, and cerebral palsy populations", "General voice AI tools that do not require an implant", "Specialty clinics and hospital systems; reimbursement still pre-commercial", "A credible adjacency because it reuses the implant platform but still lacks commercialization proof."]
      - ["Vision restoration adjacency", "Visual-cortex implant and procedure economics for blind patients", "Consumer AR/VR and non-implant visual aids", "Neurosurgical and ophthalmic centers; future payer path required", "Potentially large, but still pre-human-commercial and therefore not a current SAM."]
