      - ["Alternative broad BCI baseline", "SubconsciousMind / March 2026 update", "Global", "$2.94B", "Not stated in retained excerpt", "Independent market framing tied to Neuralink clinical analysis", "Low-to-medium confidence; useful mainly because it shows estimate dispersion."]
      - ["US healthcare BCI upside lens", "Sacra / 2025-2026 profile", "United States", "$400B", "Potential healthcare opportunity", "Long-range adjacent-use-case TAM estimate", "Low confidence for underwriting; aspirational and not a current commercial market."]
      - ["Observed adoption cohort", "AdValorem and ElonExplained / Jan-Oct 2026", "Global clinical footprint", "21 enrolled; 20 implanted late-2025 baseline", "Cohort evidence rather than revenue growth", "Bottom-up operating proxy from trial participation", "Medium confidence for stage assessment; not a monetized procedure count."]
    notes: "This table intentionally mixes dollar TAM lenses with observed clinical cohorts because public evidence does not expose a clean, reimbursed SAM/SOM for Neuralink's current paralysis indication."
    claimRefs: ["CM003", "CM004", "CM005", "CM009", "CM013"]
  - id: "TM003"
    title: "Segment / buyer map"
    columns:
      - "Segment"
