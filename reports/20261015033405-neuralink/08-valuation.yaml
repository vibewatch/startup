  evidenceGaps:
    - type: missing-source
      severity: material
      topic: commercial-economics
      missingEvidence: Disclosed pricing by indication, reimbursement receipts or payer contracts, gross margin, and clinic-level unit economics.
      whyItMatters: Without a commercial bridge, investors cannot test whether quoted private marks are underwriting plausible earnings power or just technical scarcity.
      diligencePath: Request management materials that break out procedure pricing, reimbursement status, gross margin assumptions, and expected clinic utilization by launch cohort.
      relatedQuestionRefs: [QV003]
    - type: missing-source
      severity: material
      topic: cap-table-and-overhang
      missingEvidence: A reconciled capitalization table, liquidation preferences, option pool terms, debt or structured capital, and secondary-transfer constraints.
      whyItMatters: Preference overhang and dilution can materially alter the return to new investors even if the company eventually succeeds operationally.
      diligencePath: Obtain the latest cap table, financing documents, and any secondary-market transfer terms before underwriting an entry price.
      relatedQuestionRefs: [QV008]
    - type: missing-source
      severity: material
      topic: long-term-reliability
      missingEvidence: Longitudinal data on thread stability, revision and explant rates, serious adverse events, and continuity-of-service obligations.
      whyItMatters: Durability and support costs determine whether early clinical proof can become an economically viable medtech platform instead of a costly pilot program.
      diligencePath: Ask for cohort-by-cohort safety, performance-retention, and support-cost reporting, including any reserve assumptions for revisions or device failure.
      relatedQuestionRefs: [QV006, QV007]
