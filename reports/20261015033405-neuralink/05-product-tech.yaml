  evidenceGaps:
    - type: missing-source
      severity: material
      topic: wireless-cybersecurity
      missingEvidence: Public device-security architecture, threat-model, SBOM, encryption/authentication design, and postmarket quality-process disclosures for the wireless implant stack.
      whyItMatters: Neural data leaves the body wirelessly, so security and software quality controls can affect both patient safety and regulatory readiness.
      diligencePath: Request security architecture, secure-development process evidence, and regulatory cybersecurity work product from management or lead clinical/compliance staff.
      relatedQuestionRefs: [QE007]
    - type: private-evidence-only
      severity: material
      topic: longitudinal-reliability
      missingEvidence: Cohort-level retention, revision, explant, serious-adverse-event, and signal-degradation data across implanted patients.
      whyItMatters: Durable signal quality and revision burden are core to whether Neuralink is a scalable medtech product or a fragile clinical demo.
      diligencePath: Obtain blinded cohort metrics, protocol amendments, and investigator summaries from ongoing PRIME, GB-PRIME, UAE-PRIME, and VOICE studies.
      relatedQuestionRefs: [QE003, QE005]
    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: A public developer or practitioner signal such as open repos, package activity, public API ecosystem data, or integration-partner technical adoption metrics.
      whyItMatters: Public technical ecosystem evidence would help separate durable platform adoption from headline-driven clinical interest.
      diligencePath: Ask management for developer or integration telemetry and check whether future public SDK, API, or partner-implementation materials can be shared.
      relatedQuestionRefs: [QE004]
