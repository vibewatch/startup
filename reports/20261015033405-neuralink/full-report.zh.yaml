              - CV008
              - CV011
              - CV012
      - number: '8.3'
        title: 情景框架与估值背景
        blocks:
          - type: paragraph
            body: >-
              对 Neuralink 更合适的建模框架是里程碑法，而非倍数法，因为公开证据没有披露商业收入、毛利率或报销兑现，无法让传统收入或 EBITDA 可比组站得住。可比背景因此是临床和融资：最近约 $9B-$9.65B
              的一级报价、其上方仍未确认的二级热度，以及仍取决于安全性、耐久性、付款方接受度和生产执行的商业化路径。在这个视角下，基准情景是当前估值已资本化了大部分可见平台潜力；悲观情景则是，如果收入出现前审批、可靠性或报销时点延迟，融资轮估值持平或下调。
            claimRefs:
              - CV002
