      - number: '3.3'
        title: 商业包装仍不如能力定位透明
        blocks:
          - type: paragraph
            body: >-
              公开证据对技术路线和临床成熟度的说明，远强于对定价和采购的说明。在审阅来源中，Neuralink
              及其最接近的侵入式同行仍主要通过试验、专科中心或研究项目交付，而非透明的标价和标准销售条款。因此目前最显眼的转换成本变量是手术负担、中心准备度和监管路径，而不是谈判价格。Synchron
              更容易交付、Precision 更可逆，正是因为买方在能够比较实际报销、折扣或终身支持条款之前，就可以先比较这些准入特征。
            claimRefs:
              - CP010
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP014
              - CP015
      - number: '3.4'
        title: 护城河持久性取决于耐久性和执行，而非只有性能
        blocks:
          - type: paragraph
            body: >-
              证据确实支持 Neuralink 存在真实优势，但不是赢家通吃。若买方重视最大化直接神经访问、多应用平台和机器人植入，Neuralink
              看起来最强。反证同样清楚：线体回缩、长期信号稳定性未解决，以及多年审批工作，都给低侵入性或专攻言语的进入者留下先赢得窄场景的空间。换言之，Neuralink
              的护城河是有条件的；只有把工程优势转成持久的临床结果和可扩张的中心经济性，架构才会变成可防守的商业领先。
            claimRefs:
              - CP012
              - CP013
              - CP017
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 集成栈优势
            body: 在审阅资料中，Neuralink 最可防守的优势是系统集成：植入物、无线电子部件、机器人放置和解码软件被作为一个协调的临床产品呈现，而不是独立阵列。
            calloutType: strength
            claimRefs:
              - CP001
              - CP008
              - CP009
          - type: callout
            title: 低侵入性竞争者仍可能胜出
            body: Synchron 和 Precision 不必在最大信号密度上击败 Neuralink 才能夺取份额；只要针对特定任务足够好，同时降低手术负担、可逆性顾虑或监管摩擦即可。
            calloutType: risk
            claimRefs:
              - CP003
              - CP006
              - CP010
              - CP012
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与当前商业化状态
        blocks:
          - type: paragraph
            body: >-
              公开记录支持的是未来由医院交付的医疗器械模式，而不是已经变现的软件订阅业务。Sacra 将 Neuralink 描述为垂直整合的 B2B2C
              模式，初期向医院销售植入系统，经济性来自植入硬件以及配套的手术和支持流程。但这仍只是模式描述，不是实际收入的证明：Elon Explained 称 N1
              仍属实验性产品，尚无价格或收入；留存来源也没有披露付费医院合同、报销回款或确认收入政策。因此，本章可以说明收入未来如何形成，却没有投资级证据证明该机制已经把临床需求转成已确认销售。
