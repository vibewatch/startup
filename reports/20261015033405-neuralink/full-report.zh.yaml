        - 人体研究在常规注册信息完整可见前已推进
        - 中
        - 高
        - 试验现已注册，多中心招募也可见
        - 延迟预注册和稀少的公开方案细节仍削弱外部核验
        - 要求提供完整方案历史以及不良事件和修订日志
      - - 神经数据隐私与同意风险
        - 数据权利与患者自主框架
        - Frontiers 指出双向 BCI 存在隐私和意图表征问题
        - 中
        - 高
        - 这组资料没有公开证据显示存在超越早期谨慎态度的成熟治理制度
        - 监管范围可能从设备安全扩展至数据权利义务
        - 要求提供数据留存、撤回同意和模型治理控制
      - - 持续护理义务
        - 公司战略或融资变化时的产品支持
        - 未披露公开的持续支持储备或取出植入物支持政策
        - 中
        - 高
        - 持续融资降低了近期失败风险
        - 植入用户可能依赖一家私营公司进行维护和升级
        - 要求提供长期支持契约和设备生命周期终止方案
    notes: 按严重程度排序；各单元综合官方、学术和市场评论。这组资料中没有公开来源提供完整 PMA 时间表、持续支持储备或上市后监测方案。
    enumerationScope:
