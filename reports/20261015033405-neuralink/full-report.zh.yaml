        blocks:
          - type: paragraph
            body: >-
              Neuralink 销售的不是独立芯片，而是面向重度瘫痪患者的临床流程：神经外科团队植入 N1
              设备，机器人把线体电极放入与运动相关的皮层，软件再把信号转成光标、打字和设备控制。证据最充分的用途仍是数字独立，而不是泛化的“读心”或广泛消费增强。公开可见的收益很具体：第三方报道和公司相关报道描述了网页浏览、游戏、CAD
              工作、消息通信和日常电脑互动，但始终发生在严格管理的临床研究环境，而非开放商业分发。
