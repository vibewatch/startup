  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              公开记录仍支持“继续研究”的建议、中等信心、高风险评级和偏高的估值判断。Neuralink 仍是私营公司，没有公开 ticker、SEC 文件或公布的 IPO
              日期，因此投资人押注的是私募估值，而非公开市场发现。公开参考资料将最近正式或私募估值集中在 $9B-$9.65B
              附近，但独立评论还提到远高于该区间、尚未确认的二级交易指示，以及仍依赖审批、报销和商业化的内部计划，而这些尚未在披露财务结果中得到证明。组合起来，公司在分析上很有吸引力，但仅凭公开证据，当前价格背景对干净的投资判断仍过于昂贵。
