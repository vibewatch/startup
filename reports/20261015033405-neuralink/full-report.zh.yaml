  - id: TR003
    title: 合作伙伴 / 依赖风险登记表
    columns:
      - 依赖项
      - 交易对手方
      - 角色
      - 集中度
      - 失败情景
      - 严重程度
      - 缓释措施
      - 剩余敞口
    rows:
      - - 临床中心和研究人员
        - Barrow 及四个国家其他已披露的试验中心
        - 手术、招募、随访和数据生成
        - 中等
        - 中心放缓或监管方叫停会拖慢招募和证据生成
        - 高
        - 从单一美国中心向其他地域扩张
        - 侵入性手术仍依赖一个规模不大的专业网络
      - - 单一植入物加机器人平台
        - N1 植入物和 R1 机器人堆栈
        - 所有活跃项目的核心产品和流程
        - 高
        - 共因缺陷或流程故障同时打击多个适应症
        - 高
        - 迭代设计变更和全寿命测试
        - 在多代硬件经过实地验证前，集中度仍高
      - - 医院、支付方和私人资本
        - 医院客户、未来支付方和增长投资者
        - 商业采用融资和持续支持
        - 高
        - 试验技术成功，但报销或资本支持滞后于商业化
        - 高
        - 大额私募轮和 B2B2C 定位显示出市场路径
        - 公开报销经济和持续融资仍未经证实
    notes: 本登记表将明确交易对手方与商业化依赖放在一起，因为指定资料没有披露更完整的供应商名单或支付方合同。
    claimRefs:
