  - id: FE001
    title: 产品架构图
    type: stack
    summary: Neuralink 的产品是一套从手术通路到解码软件的端到端临床栈，而不是单一植入组件。
    data:
      layers:
        - label: 1. 患者筛选与研究方案
          items:
            - 试验队列中的重度瘫痪成年人
            - 照护者支持的入组与监测
          outputs:
            - 符合条件的参与者进入受监督的植入流程
        - label: 2. 手术通路
          items:
            - 开颅与手术室准备
            - 全身麻醉与临床地点流程
          outputs:
            - 供机器人插入的植入窗口
        - label: 3. 机器人植入
          modules:
            - R1 底座与运动平台
            - 配备多摄像头成像和 OCT 的机器人头部
            - 线体插入针系统
          outputs:
            - 精准放置柔性皮层线体
        - label: 4. 植入式感知与供电
          items:
            - 生物相容性外壳
            - 无线充电电池
            - 定制芯片与电子元件
          outputs:
            - 体内信号采集与遥测
        - label: 5. 神经接口层
          items:
            - 1,024 电极架构
            - 早期 64 线体配置，后续改为更细线体版本
          outputs:
            - 用于意图解码的神经活动流
        - label: 6. 解码与用户控制
          modules:
            - Neuralink 应用与解码器软件
            - 光标、打字和设备控制 UX
            - 正在形成的语音恢复配置
          outputs:
            - 试验阶段的数字自主使用场景
    approximationNotes: 分层是示意性的，反映公开资料对运营栈的描述，而不是已披露的内部系统图。
    claimRefs:
      - CE003
      - CE007
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 当前旅程仍要经过受监管的试验入组和激活循环，尚未看到医院规模的商业交接。
    data:
      items:
        - label: 登记与资格筛选
          actor: 潜在参与者
          stage: 进入
          touchpoints:
            - 四肢瘫痪或 ALS 资格
            - 试验地点筛选与入组
          detail: 公开证据从符合医学条件的参与者开始，而不是普通消费者。
        - label: 在临床地点进行手术植入
          actor: Neuralink 加地点护理团队
          stage: 植入
          touchpoints:
            - 机器人植入手术
            - 术后监测
          detail: 采用仍取决于专业试验地点和受监管的神经外科流程。
        - label: 初始激活与光标控制
          actor: 参与者
          stage: 激活
          touchpoints:
            - 在几分钟或几小时内控制电脑
            - 校准与解码器设置
          detail: 快速完成首次使用，是公开资料反复提及的证明点。
        - label: 日常数字自主循环
          actor: 参与者
          stage: 持续使用
          touchpoints:
            - 浏览网页和收发消息
            - 游戏以及学习 / 工作支持
          detail: 已公开姓名的用户展示了真实的日常价值，但活跃用户频率尚未完全披露。
        - label: 功能扩展与国际推广
          actor: 参与者与新地点
          stage: 扩展
          touchpoints:
            - CAD 和游戏使用场景
            - 英国及其他国家推广
          detail: 在大规模医院商业化得到证明之前，产品仍在队列内部拓宽应用。
        - label: 未来医院买方与支付方交接
          actor: 医院买方 / 支付方生态
          stage: 商业化
          touchpoints:
            - 定价与报销设计
            - 合同地点部署
          detail: 这一步仍由第三方建模，尚无公开合同证据证明其已发生。
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU005
      - CU006
      - CU010
      - CU011
      - CU012
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最高的剩余风险仍在监管时点、连续性和商业化，而不是早期临床进展不足。
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 缓解成熟度
      rows:
        - label: 监管许可延迟
          note: 突破性认定有助于推进沟通，但不能替代完整的疗效和安全性证明。
          values:
            - label: 高
              tone: negative
            - label: 高
              tone: negative
            - label: 低-中
              tone: warning
        - label: 长期安全性与耐久性
          note: 已有人体数据，但对于植入式神经技术，队列深度和随访仍然不足。
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: negative
            - label: 中
              tone: warning
        - label: 连续性与隐私义务
          note: 学术和法律评论领先于公开运营政策披露。
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: negative
            - label: 低
              tone: negative
        - label: 商业化与报销缺口
          note: 指定资料池中没有公开价格、收入或报销证据。
          values:
            - label: 高
              tone: negative
            - label: 高
              tone: negative
            - label: 低
              tone: negative
        - label: 平台集中度
          note: 每个活跃项目仍依赖同一套植入物和机器人流程。
          values:
            - label: 高
              tone: negative
            - label: 高
              tone: negative
            - label: 中
              tone: warning
        - label: 试验地点与研究者依赖
          note: 扩展到四个国家有所帮助，但侵入式手术仍依赖一个小型专家网络。
          values:
            - label: 中
              tone: warning
            - label: 中-高
              tone: warning
            - label: 中
              tone: warning
    approximationNotes: 序数标签根据保留的公开证据概括严重程度，而不是来自概率分布模型。
    claimRefs:
      - CR004
      - CR006
      - CR007
      - CR008
      - CR011
      - CR013
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 临床证据支持继续关注，但经济模型和价格支撑落后于当前的私募估值叙事。
    data:
      nodes:
        - label: 临床证据
          detail: 早期人体效用和不断增长的入组人数表明，该平台能在人身上发挥作用。
          claimRefs:
            - CV005
            - CV008
            - CV014
        - label: 平台广度
          detail: 如果独立项目获批，运动、语音和视觉期权将扩大上行空间。
          claimRefs:
            - CV011
        - label: 监管关口
          detail: 获批仍在等待中，内部时间表也不是已经去风险的结果。
          claimRefs:
            - CV004
            - CV006
            - CV008
        - label: 经济模型缺口
          detail: 公开来源仍无法对账报销、收入、利润率或股权结构表条款。
          claimRefs:
            - CV009
            - CV010
        - label: 估值背景
          detail: 最近一次报价的一级市场估值已接近 $9B-$9.65B，而更高的二级市场信号仍未获确认。
          claimRefs:
            - CV002
            - CV003
        - label: 建议
          detail: 在价格或证据改善之前，建议继续研究，风险高，估值偏紧。
          claimRefs:
            - CV012
            - CV013
    claimRefs:
      - CV002
      - CV004
      - CV006
      - CV009
      - CV010
      - CV012
      - CV013
