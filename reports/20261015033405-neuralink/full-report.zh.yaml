        - 需要返修手术和队列耐久性统计
      - - 侵入性手术与设备生物相容性
        - 开颅加植入电极带来出血、感染和瘢痕组织风险
        - 中
        - 高
        - 低-中
        - R1 的精度和无线设计可能降低部分风险，但无法消除侵入性神经外科暴露
        - 需要长期取出植入物、感染和信号衰减数据
      - - 平台级硬件或机器人流程缺陷
        - 每个临床项目都运行在同一 N1 加 R1 堆栈的不同版本上
        - 中
        - 高
        - 低-中
