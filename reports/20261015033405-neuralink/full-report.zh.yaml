      - number: '1.3'
        title: 里程碑、覆盖扩张与未决执行风险
        blocks:
          - type: paragraph
            body: >-
              指定资料中的里程碑是真实且不断累积的。官方和独立来源展示了从成立、首次人体植入，到更广泛的患者披露、国际研究扩展，以及 Blindsight 和言语恢复项目获得 FDA 突破性器械认定的路径。到 2026
              年，章节证据支持这是日益多项目化的临床平台，而不只是单一试点植入故事。
              同一批来源也说明，为何这仍是重尽调项目，而不是干净的成长股故事。多份摘要仍称其尚无收入或尚未商业化；风险导向来源则强调多年审批周期、线体迁移或耐久性问题，以及创始人集中度。结论是：Neuralink
              已从概念跨入人体使用，但尚未从临床势头跨入有公开证据支持的商业可重复性。
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
      - number: '1.4'
        title: 展示项
        blocks:
          - type: callout
            title: 正式估值比累计融资额更可靠
            body: 2025 年 6 月 E 轮估值在指定资料中得到充分交叉印证，但累计融资额并非如此。应把本轮估值视为可靠资本标记，把累计资本结构留作待尽调事项。
            calloutType: insight
            claimRefs:
              - CO005
              - CO006
          - type: callout
            title: 临床验证已出现，但商业化验证尚未出现
            body: 指定证据支持真实的植入患者进展，但同一批来源仍将 Neuralink 描述为尚无收入、尚未获批，并面临长期耐久性和监管风险。
            calloutType: risk
            claimRefs:
              - CO011
              - CO012
              - CO013
          - type: callout
            title: 治理仍更像由个人驱动，而非制度化透明
            body: Musk 和 Birchall 的角色清晰可见，但指定公开资料对董事会、控制权和继任计划的说明仍不足以支持干净的治理判断。
            calloutType: assumption
            claimRefs:
              - CO007
              - CO008
              - CO014
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 当前市场边界以瘫痪为先、由医疗服务方交付，且窄于广义神经科技 TAM 叙事
        blocks:
          - type: paragraph
            body: >-
              留存证据支持一个克制的市场定义：Neuralink 当前具有商业相关性的市场，是面向重度瘫痪患者的侵入式脑机接口医疗服务，由医院、神经外科团队和康复流程交付，而不是直接面向消费者的软件销售。Sacra
              明确把其商业模式定义为垂直整合的医疗器械公司，初期向医院销售植入系统；AdValorem 和 Acquinox 都把 PRIME
              瘫痪试验作为近期验证点。因此，人机共生、精神疾病治疗或消费增强等宽泛叙事属于相邻市场，不是今天足以支撑投资判断的核心市场。证据还指出真实替代方案：更低侵入性的
              BCI、传统辅助技术，以及护理人员支持的现状电脑访问。把这些替代方案纳入边界很重要，因为 Neuralink 向临床预算销售的是高摩擦手术干预，而不是泛化的软件或电子产品支出。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM007
              - CM011
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM012
      - number: '2.2'
        title: 公开 TAM 证据宽泛且方向性强；当前 SAM/SOM 尚未得到证明
        blocks:
          - type: paragraph
            body: >-
              公开来源提供了方向性的市场视角，却没有给出针对 Neuralink 当前适应症、干净且有证据支撑的 TAM-SAM-SOM 梯度。Acquinox 称全球 BCI 市场在 2025 年约为 $3.2B、2034
              年增至 $12.9B；SubconsciousMind 使用另一套 $2.94B 类别基线，因此即使是自上而下的估算，也因方法不同而变化。Sacra 还给出神经系统疾病、精神科治疗及推测性的 $400B 美国
              BCI 医疗机会等更大的相邻市场数字，但这些远超以瘫痪为核心的设备控制。最扎实的自下而上证据仍是运营而非商业：2025 年底约 20 名植入患者、2026 年 1 月更新中的 21
              名入组参与者，以及没有公开的从试验吞吐量到报销手术的桥接。因此，市场规模数字应被视为边界标记和采用锚点，而不是数学嵌套的收入瀑布。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM009
              - CM010
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM009
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM013
      - number: '2.3'
        title: 采用时点更取决于临床吞吐量、报销和耐久性，而非醒目的 TAM
        blocks:
          - type: paragraph
            body: >-
              需求逻辑可信，因为产品似乎解决了一个紧迫任务：利用高通道数、全植入式软硬件，为瘫痪患者恢复电脑访问。来源指出三个影响估值的驱动因素：信号分辨率优于低侵入性方案；Telepathy、言语和视觉项目可复用平台；自动化手术和更大规模生产有望降低运营瓶颈。但同一证据也表明，商业化仍受线体回缩风险、长期生物相容性、尚未获批、报销路径不成熟，以及动物试验和隐私争议带来的声誉或监管摩擦限制。实际市场份额取决于公司能否在医院经济模型内，把试验参与转化为可重复、可报销且耐久的手术，而不是抽象
              BCI 类别是否足够大。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM013
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 关键市场风险不是类别大小，而是转化为付费临床吞吐量
            body: 公开证据可以支撑宽泛的类别叙事，但仍未显示经过验证的适应症级定价栈、报销路径或能把 TAM 转成当前收入能力的耐久植入经济性。
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
              - CM012
              - CM013
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局覆盖直接同行、相邻植入方案和替代方案
        blocks:
          - type: paragraph
            body: >-
              Neuralink 并非只与另一家侵入式植入物供应商竞争。审阅资料显示，针对相同瘫痪和沟通任务存在三类重叠方案：Paradromics 和传统 Blackrock 研究栈等直接侵入式同行；Synchron
              的血管内 Stentrode 和 Precision Neuroscience
              的皮层表面阵列等负担较低的植入方案；以及完全避免开颅的非侵入式或现状辅助接口。买方决策不只是“技术最好”，还要判断患者、医生和机构愿意为特定用途承受多大的手术负担、可逆性代价和信号保真度。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
      - number: '3.2'
        title: 架构取舍比品牌更能决定定位
        blocks:
          - type: paragraph
            body: >-
              Neuralink
              公开可见的最大差异化在于架构集成。它的主张不只是电极更多，而是把全植入式无线设备、高密度皮层内线体、自研电子部件和专用植入机器人组合成一个临床栈。这使其在审阅资料中处于直接信号访问能力最高的位置；Synchron
              和 Precision 则沿侵入性曲线下移以换取采用优势，Paradromics 通过强调高带宽沟通工作负载，在性能目标上更接近 Neuralink。下方图表应读作有证据支撑的序数取舍图，而不是实测基准。
