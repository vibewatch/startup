  - id: TV001
    title: 建议总结表
    columns:
      - 维度
      - 评估
      - 证据
      - 哪些变化会改变判断
    rows:
      - - 建议
        - 继续研究
        - 临床证明真实存在，但公开经济数据仍过于单薄，不足以支持买入判断。
        - 待报销和商业指标披露，或入场价格重置后再评估。
      - - 置信度
        - 中
        - 来源证实设备取得进展，但融资和运营问题仍有重大未解之处。
        - 经审计的经济数据和更清晰的融资披露会提升置信度。
      - - 风险评级
        - 高
        - 公司仍处于获批前、收入前阶段，并暴露于耐久性和报销风险。
        - 获批里程碑和纵向安全数据积累后，风险才会下降。
      - - 估值立场
        - 偏高
        - 最近报价的一级市场估值约为 $9B-$9.65B，而更高的二级市场信号仍未确认。
        - 只有价格下跌或经济数据追上来，立场才会改善。
      - - 决策含义
        - 跟踪，但不要追逐稀缺性溢价
        - 公开证据支持有纪律地观察，而不是按当前估值激进入场。
        - 待股权结构表和诊所经济披露后再进行投资判断。
    notes: 本表将公开证据综合为投资立场；它不是现金流折现估值，也不是报价形成的市场清算价格。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV009
      - CV012
      - CV013
  - id: TV002
    title: 正论 / 反论表
    columns:
      - 论点
      - 证据
      - 哪些变化会改变判断
    rows:
      - - 正论
        - 官方和独立来源均支持：差异化的植入物加机器人堆栈，确实已在早期人体使用中创造价值。
        - 更大规模且表现持久的已发表队列将增强这一判断。
      - - 投资论点
        - 如果后续获得独立批准，同一植入平台可以拓展到语音和视觉项目。
        - 若能看到运动控制之外的报销和临床转化证据，将增强估值支撑。
      - - 反方论点
        - 公开来源仍将 Neuralink 描述为尚未产生收入、尚未获批的公司，经济模型之间也没有对账桥接。
        - 若披露定价、报销、利润率和诊所利用率，这一反方论点将减弱。
      - - 反方论点
        - 早期出现的线体回缩和移位问题表明，长期可靠性仍是商业化过程中的现实风险。
        - 具备稳定信号质量的纵向安全性和修订数据将缓解这一担忧。
    notes: 这些行是方向性的投资论据，不是点预测；每行都把当前证据与能够改变判断的具体证明配对。
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV008
      - CV011
      - CV012
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 获批时间与内部设定的 2029 年目标一致，平台广度也转化为可见的报销和诊所吞吐量。
        - 只有商业化证据验证今天的稀缺性溢价后，价值才可能超过最近一次报价的一级市场估值。
        - 监管延误、安全事件和报销阻力。
        - 需要新披露的经济数据，而不是只有叙事。
      - - 基准
        - 临床进展延续，但经济模型、股权结构表和支付方路径仍不透明。
        - 将当前 $9B-$9.65B 的一级市场估值区间视为新资金的上限，而不是上行锚点。
        - 获批周期长和稀释风险。
        - 与当前公开证据最一致。
      - - 悲观
        - 在产生收入之前，可靠性问题或监管延误出现，融资条款也趋紧。
        - 平价轮或低于最近一次一级市场估值的下调轮融资变得可能。
        - 资本密集度、优先权悬垂和更慢的商业化。
        - 股权结构表和利润率细节缺失，使这一下行风险仍然存在。
    notes: 情景区间是基于公开估值和已披露不确定性的里程碑式决策框架，不是管理层指引或公允价值结果。
    claimRefs:
      - CV002
      - CV003
      - CV006
      - CV007
      - CV009
      - CV010
      - CV013
