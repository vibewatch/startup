      - number: '1.2'
        title: 管理层、资本与控制权透明度
        blocks:
          - type: paragraph
            body: >-
              公开信息对 Elon Musk 和 Jared Birchall 的介绍最充分，指定的投资者营销资料还将创始人或高级技术角色归于 Paul Merolla 和 Dongjin
              Seo。这足以说明创始人与市场的匹配度及关键人物集中度，却不足以形成干净的治理判断。指定资料没有披露完整的现任董事会名单、投票和控制结构，也没有核对一致的利益相关方图谱来区分一级融资、二级交易、债务和结构化条款。
              资本信息同样混杂。指定来源都认可 2025 年 E 轮约 $650M、正式估值约 $9.6-$9.65B，这是当前最干净的定价锚点。此后证据明显分歧：第三方来源给出的总融资额从 $1.2B+ 到约 $5B
              不等。区间过宽，不能当作已确定的封面指标；后续估值工作应把正式融资轮作为硬锚点，把累计资本额视为仍待核实的尽调事项。
            claimRefs:
