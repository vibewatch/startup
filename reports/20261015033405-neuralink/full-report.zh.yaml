            body: >-
              从运营上看，Neuralink
              有改善证据，但相对于其野心，缓解措施仍不成熟。公司称加速寿命测试以捕捉设备失效模式；第三方摘要称，首位患者线体回缩问题带来的经验让后续病例有所改善。这些都是积极信号，但也确认设备稳定性、生物相容性和手术可重复性仍是现实风险，而不是已退出的风险。同一依赖横跨每个项目：Tesorb
              称整个临床组合都运行在同一 N1 植入物和 R1 机器人不同变体上，因此重大硬件缺陷、无菌问题、软件解码回归或机器人流程瓶颈可能同时打击所有活跃适应症。美国、加拿大、UAE
              和英国的试验扩张降低了单一地点集中度，却没有消除核心植入架构、机器人流程或少数专科地点和研究者的集中。
