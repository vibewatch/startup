      - number: '8.4'
        title: 最终尽调问题与退出准备度
        blocks:
          - type: paragraph
            body: >-
              最后的尽调应聚焦公开记录缺失的具体证据，而不是重复产品故事。优先问题包括按适应症核对一致的收入和定价模型、报销及付款方牵引力、毛利率和诊所经济性假设，以及位于普通股二级交易估值之上的确切融资栈。投资人还需要更清楚地了解不良事件率、线体稳定性、修订和取出预期，以及可能在规模化前消耗现金的服务或储备义务。在这些问题得到回答前，退出准备度仍更多取决于融资叙事和里程碑外观，而不是经过投资判断的经营经济性。
            claimRefs:
              - CV004
