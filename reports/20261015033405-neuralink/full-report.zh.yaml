      - number: '4.3'
        title: 公开投资判断与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              从财务上看，Neuralink 是一个临床牵引力令人鼓舞但公开披露尚不成熟的待审批植入平台。Acquinox 和 TSG 都把业务定位为尚无收入；The Times 和 Subconscious Mind
              则说明商业化仍可能消耗大量时间和资本：Neuralink
              在人体试验前必须处理电池、线体迁移、移除和数据安全问题，而当前早期可行性阶段之后似乎仍需更大规模的关键性试验。因此临床数量是产品有效性的代理指标，不是收入质量的代理指标。可投资模型的核心阻塞点没有改变：留存来源没有一家披露确认收入、实际定价、报销经济性、毛利率、现金、烧钱、债务或
              现金跑道；当前公开案例依靠的是平台潜力和融资渠道，而非足以支撑投资判断的经营指标。
