      - number: '8.2'
        title: 论点与反论点
        blocks:
          - type: paragraph
            body: >-
              论点很直接：官方材料和独立临床摘要支持 Neuralink 已拥有真实、能工作的侵入式 BCI
              平台，具备有意义的早期人体效用，并有可信路径从运动控制扩展到言语和视觉项目。反论点同样重要：同一批公开来源仍把它描述为尚无收入、尚未获批的公司，耐久性问题未解决，没有公开报销桥接，也没有干净的资本结构披露。换句话说，今天证据支持最充分的是技术和临床进展，而不是当前估值已经为新投资人提供有吸引力的风险调整后上行空间。
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
