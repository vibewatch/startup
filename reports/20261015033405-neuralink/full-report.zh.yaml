chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段与当前产品范围
        blocks:
          - type: paragraph
            body: >-
              Neuralink 的身份比其经济性更清晰。指定的官方和独立来源一致显示，公司是一家 2016 年成立、总部位于加州 Fremont
              的私营神经科技开发商，正在打造以瘫痪为首要场景的侵入式脑机接口栈。官网称系统会把神经信号转化为动作；独立摘要则一贯将其描述为植入物、手术机器人和解码软件组成的集成产品，而非纯软件产品。
              产品叙事已不再只是愿景。Neuralink
              首页突出展示多名植入用户，官方更新页也持续发布试验、安全和产品消息。但这不代表业务已经商业化：指定的第三方摘要仍称其为私营、尚无收入且尚未获批。后续章节可复用的可靠事实是：Neuralink
              已有能在人类试验中工作的软硬件，但尚未公开收入模式或公开市场披露体系。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO011
