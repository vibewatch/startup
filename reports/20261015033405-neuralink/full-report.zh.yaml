      - number: '4.2'
        title: 资本强度、估值信号与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Neuralink 的财务特征由资本密集度和较长开发周期主导。Sacra 称其在硬件开发、手术机器人和神经数据处理上的垂直整合，需要在有意义收入出现前投入大量资本；Tracxn 报告 2026 年 9 月员工数为
              705 人，说明大规模商业化前已有可观固定成本。公开融资数据表明公司仍能获得资本，但没有干净的账本：留存来源给出的累计融资额从约 $686M 到 $1.85B 不等。总体结论仍一致：Neuralink
              已筹得足以继续资助试验和生产的外部资本，但外部投资人仅凭公开披露无法干净判断稀释、现金效率或现金跑道。
