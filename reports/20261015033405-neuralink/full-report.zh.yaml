  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险图景
        blocks:
          - type: paragraph
            body: >-
              Neuralink 已超越概念炒作，但证据仍支持较高剩余风险判断，因为项目早期、侵入性强且资本密集。公开材料如今显示真实的人体试验基础：公司称 PRIME
              正评估植入物和手术机器人的安全性及初始功能；独立跟踪者称截至 2026 年 4 月，四国已有 21
              名入组参与者，公开记录中没有严重器械不良事件。这是有意义的进展，但对于一个皮层内植入平台仍是窄数据集；其未来案例依赖更大队列、持久信号质量和远超 2025 年底所报 12
              名植入患者的生产爬坡。因此核心排序是：第一，监管和长期安全风险；第二，运营与平台可靠性风险；第三，连续性、隐私和治理风险；第四，资本、报销和商业模式风险。
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR011
              - CR012
              - CR014
