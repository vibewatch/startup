      - number: '7.2'
        title: 监管、法律和伦理风险仍最难形成投资判断
        blocks:
          - type: paragraph
            body: >-
              Neuralink 有可信的监管进展，但距离广泛商业化并不近。官方记录显示 FDA 于 2023 年批准启动首次人体研究，后续来源显示 2025
              年言语恢复项目获得突破性器械认定。即便如此，独立分析反复提醒，突破性认定会加速与 FDA 的互动，却不能替代安全性和有效性证明；Sacra 仍把全面获批视为 2020
              年代后期问题，而不是近期事件。伦理和法律暴露也比普通医疗器械执行更广。Frontiers 认为长期用户支持、神经隐私和决策自主权需要更强保障，并批评 ClinicalTrials.gov
              注册延迟，因为外部审阅者起初缺少正常透明渠道。结果是一个真实的尽调阻塞点：尚无公开资料包能让投资人干净评估长期取出风险、连续性义务，以及最终报销和上市后监测制度。
            claimRefs:
