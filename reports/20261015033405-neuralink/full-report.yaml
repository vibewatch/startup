      - number: '4.3'
        title: Public underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >
              Financially, Neuralink looks like a pre-approval implant platform with encouraging clinical traction but
              immature public disclosure. Acquinox and TSG both frame the business as pre-revenue, while The Times and
              Subconscious Mind show why commercialization may still consume significant time and capital: Neuralink had
              to address battery, wire-migration, removal, and data-security concerns before human trials, and larger
              pivotal trials still appear necessary after the current early-feasibility phase. Clinical volume therefore
              functions as a product-validity proxy rather than a revenue-quality proxy. The central blockers to an
              investable model remain the same: no retained source discloses recognized revenue, realized pricing,
              reimbursement economics, gross margin, cash, burn, debt, or runway, so the current public case rests on
              platform promise and financing access rather than underwritable operating metrics.
            claimRefs:
              - CI004
              - CI005
              - CI013
              - CI014
              - CI015
              - CI016
