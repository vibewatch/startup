      - number: '1.3'
        title: Milestones, footprint expansion, and unresolved execution risk
        blocks:
          - type: paragraph
            body: |-
              The milestone pattern in the assigned pool is real and cumulative.
              Official and independent sources show a path from founding to first human
              implant, then to broader patient disclosure, international study
              expansion, and additional FDA Breakthrough Device Designations for
              Blindsight and speech restoration. By 2026 the chapter evidence supports
              an increasingly multi-program clinical platform, not just a single pilot
              implant story.

              The same sources also show why the name is still a diligence-heavy
              situation rather than a clean growth-equity story. Multiple summaries
              still call the business pre-revenue or pre-commercial, and risk-oriented
              sources emphasize multi-year approval timelines, thread-migration or
              durability questions, and founder concentration. The upshot is that
              Neuralink has crossed the threshold from concept to human use, but it has
              not crossed the threshold from clinical momentum to publicly evidenced
              commercial repeatability.
