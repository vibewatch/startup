          - type: callout
            title: Economics resemble a regulated implant platform, not SaaS
            body: >
              The durable public evidence is about hardware, surgery, trials, and manufacturing scale-up; the durable
              public evidence is not about recurring revenue, gross margin, or payback.
            calloutType: insight
