          valueNote: Acquinox forecast at about 16.7% CAGR from the 2025 baseline.
        - label: US healthcare BCI optionality
          value: 400
          unit: USD billions
          valueNote: Sacra's long-range healthcare opportunity lens; aspirational, not current SAM.
    approximationNotes: >-
      Layers are ordered from concrete current evidence to broader optionality and mix cohorts, people, and dollar
      lenses because retained public evidence does not disclose a clean Neuralink-specific SAM or SOM.
    claimRefs:
      - CM003
      - CM004
      - CM005
      - CM006
      - CM013
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: The landscape clusters by signal access and procedure burden rather than by one universal quality ranking.
    data:
      xAxis:
        label: Signal access / control ceiling
        min: 1
        max: 5
        low: Lower direct access
        high: Higher direct access
        description: Ordinal score from the reviewed public evidence; not a measured benchmark.
        scale: ordinal
      yAxis:
        label: Procedure burden / implantation complexity
        min: 1
        max: 5
        low: Lower burden
        high: Higher burden
        description: Ordinal score from delivery route and surgical complexity in the reviewed evidence.
        scale: ordinal
      points:
        - label: Neuralink
          x: 5
          'y': 5
          note: Intracortical threads, craniotomy, robot-assisted placement.
          claimRefs:
            - CP001
            - CP002
            - CP008
            - CP016
        - label: Paradromics
          x: 5
          'y': 5
          note: High-bandwidth invasive entrant with speech emphasis.
          claimRefs:
            - CP005
            - CP016
        - label: Blackrock
          x: 4
          'y': 5
          note: High-fidelity invasive research lineage with the longest track record.
          claimRefs:
            - CP004
            - CP016
        - label: Precision
          x: 3
          'y': 3
          note: Surface-array middle ground on burden and directness.
          claimRefs:
            - CP006
            - CP016
        - label: Synchron
          x: 2
          'y': 2
          note: Endovascular access lowers burden while sacrificing direct signal density.
          claimRefs:
            - CP003
            - CP010
            - CP016
        - label: Non-invasive substitutes
          x: 1
          'y': 1
          note: Lowest-burden access but the weakest direct neural signal path.
          claimRefs:
            - CP007
            - CP016
    approximationNotes: >-
      Coordinates are ordinal judgments synthesized from the reviewed evidence on access route, electrode directness,
      and surgical burden; they are not measured performance scores.
    claimRefs:
      - CP016
      - CP017
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a hospital-and-procedure revenue bridge, but not a disclosed commercial revenue bridge
      yet.
    data:
      nodes:
        - id: indication
          label: Paralysis-focused clinical use
          note: Current public proof is clinical use and enrollment, not paid customer receipts.
        - id: implant
          label: N1 implant hardware
          note: Sacra estimates about $10,000 per device, but no realized selling price is disclosed.
        - id: procedure
          label: Surgery and support bundle
          note: Sacra cites total cost around $40,000; payer capture is not disclosed.
        - id: hospital
          label: Hospital / clinic buyer
          note: Sacra describes the initial go-to-market model as B2B2C through hospitals.
        - id: approval
          label: Approval and reimbursement path
          note: Commercial scale still depends on approval, coverage, and billing details that are not public.
        - id: revenue
          label: Recognized commercial revenue
          note: Elon Explained says the N1 has no price and no revenue yet.
      edges:
        - from: indication
          to: implant
          label: Clinical demand creates device demand
        - from: implant
          to: procedure
          label: Device is monetized with implantation
        - from: procedure
          to: hospital
          label: Provider setting captures delivery economics
        - from: hospital
          to: approval
          label: Billing scale depends on clearance and coverage
        - from: approval
          to: revenue
          label: Revenue appears only after paid procedures
    approximationNotes: This figure shows the public mechanism path, not an observed revenue waterfall.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Neuralink's product is an end-to-end clinical stack from surgical access through decoding software, not a single
      implant component.
    data:
      layers:
        - label: 1. Patient selection and study protocol
          items:
            - Adults with severe paralysis in trial cohorts
            - Caregiver-supported onboarding and monitoring
          outputs:
            - Eligible participant enters supervised implant workflow
        - label: 2. Surgical access
          items:
            - Craniotomy and operating-room setup
            - General anesthesia and clinical-site workflow
          outputs:
            - Implant window for robotic insertion
        - label: 3. Robotic placement
          modules:
            - R1 base and motion stage
            - Robot head with multi-camera imaging and OCT
            - Needle system for thread insertion
          outputs:
            - Precise placement of flexible cortical threads
        - label: 4. Implanted sensing and power
          items:
            - Biocompatible enclosure
            - Wireless-charged battery
            - Custom chips and electronics
          outputs:
            - On-body signal acquisition and telemetry
        - label: 5. Neural interface layer
          items:
            - 1,024-electrode architecture
            - 64-thread early configuration with later thinner-thread revisions
          outputs:
            - Neural activity stream for intent decoding
        - label: 6. Decode and user control
          modules:
            - Neuralink application and decoder software
            - Cursor, typing, and device-control UX
            - Emerging speech-restoration configuration
          outputs:
            - Trial-stage digital independence use cases
    approximationNotes: >-
      Layering is schematic and reflects public descriptions of the operating stack rather than a disclosed internal
      systems diagram.
    claimRefs:
      - CE003
      - CE007
      - CE011
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      The current journey still runs through regulated trial enrollment and activation loops before any hospital-scale
      commercial handoff is visible.
    data:
      items:
        - label: Registry and eligibility screening
          actor: Prospective participant
          stage: Entry
          touchpoints:
            - Tetraplegia or ALS qualification
            - Trial-site screening and enrollment
          detail: Public evidence starts with medically eligible participants, not general consumers.
        - label: Surgical implantation at a clinical site
          actor: Neuralink plus site care team
          stage: Implant
          touchpoints:
            - Robotic implantation procedure
            - Post-op monitoring
          detail: Adoption still depends on specialized trial sites and regulated neurosurgical workflows.
        - label: Initial activation and cursor control
          actor: Participant
          stage: Activation
          touchpoints:
            - Computer control within minutes or hours
            - Calibration and decoder setup
          detail: Fast first-use moments are a repeated public proof point.
        - label: Daily digital independence loop
          actor: Participant
          stage: Ongoing use
          touchpoints:
            - Web browsing and messaging
            - Gaming and study / work support
          detail: Named users demonstrate real daily value, but active-user frequency is not fully disclosed.
        - label: Feature expansion and international rollout
          actor: Participant plus new sites
          stage: Expansion
          touchpoints:
            - CAD and gaming use cases
            - UK and other country rollout
          detail: The product is broadening inside the cohort before broad hospital commercialization is proven.
        - label: Future hospital buyer and payer handoff
          actor: Hospital buyer / payer ecosystem
          stage: Commercialization
          touchpoints:
            - Pricing and reimbursement design
            - Contracted site deployment
          detail: This step is still modeled by third parties rather than demonstrated by public contract evidence.
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU005
      - CU006
      - CU010
      - CU011
      - CU012
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Highest residual risk still sits in regulatory timing, continuity, and commercialization rather than lack of early
      clinical progress.
    data:
      columns:
        - label: Likelihood
        - label: Impact
        - label: Mitigation maturity
      rows:
        - label: Regulatory clearance delay
          note: Breakthrough status helps interaction but does not replace full efficacy and safety proof.
          values:
            - label: High
              tone: negative
            - label: High
              tone: negative
            - label: Low-Medium
              tone: warning
        - label: Long-term safety and durability
          note: Human data exist, but cohort depth and follow-up remain thin for implanted neurotech.
          values:
            - label: Medium
              tone: warning
            - label: High
              tone: negative
            - label: Medium
              tone: warning
        - label: Continuity and privacy obligations
          note: Academic and legal commentary is ahead of public operating policy disclosure.
          values:
            - label: Medium
              tone: warning
            - label: High
              tone: negative
            - label: Low
              tone: negative
        - label: Commercialization and reimbursement gap
          note: No public price revenue or reimbursement evidence in the assigned pool.
          values:
            - label: High
              tone: negative
            - label: High
              tone: negative
            - label: Low
              tone: negative
        - label: Platform concentration
          note: Every active program still depends on the same implant and robotic workflow.
          values:
            - label: High
              tone: negative
            - label: High
              tone: negative
            - label: Medium
              tone: warning
        - label: Trial-site and investigator dependency
          note: Expansion to four countries helps, but invasive procedures still run through a small specialist network.
          values:
            - label: Medium
              tone: warning
            - label: Medium-High
              tone: warning
            - label: Medium
              tone: warning
    approximationNotes: >-
      Ordinal labels summarize severity from the retained public evidence rather than a modeled probability
      distribution.
    claimRefs:
      - CR004
      - CR006
      - CR007
      - CR008
      - CR011
      - CR013
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Clinical proof supports interest, but economics and price support lag the current private-mark narrative.
    data:
      nodes:
        - label: Clinical proof
          detail: Early human utility and growing enrollment show the platform works in people.
          claimRefs:
            - CV005
            - CV008
            - CV014
        - label: Platform breadth
          detail: Motor, speech, and vision optionality expand upside if separate programs clear.
          claimRefs:
            - CV011
        - label: Regulatory gate
          detail: Approval is still pending and internal timelines are not de-risked outcomes.
          claimRefs:
            - CV004
            - CV006
            - CV008
        - label: Economics gap
          detail: Public sources still do not reconcile reimbursement, revenue, margin, or cap-table terms.
          claimRefs:
            - CV009
            - CV010
        - label: Valuation context
          detail: Last quoted primary marks already sit near $9B-$9.65B while richer secondary signals remain unconfirmed.
          claimRefs:
            - CV002
            - CV003
        - label: Recommendation
          detail: Research-more, high risk, and stretched until price or evidence improves.
          claimRefs:
            - CV012
            - CV013
    claimRefs:
