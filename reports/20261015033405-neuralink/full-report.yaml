      - number: '5.2'
        title: Architecture, deployment, and current maturity
        blocks:
          - type: paragraph
            body: >-
              The core architecture is now reasonably clear in public materials: implanted electronics and power sit
              under the skull, threads provide cortical recording density, the R1 robot handles precise insertion, and
              the external application performs decoding and user control. What is less mature is the evidence base
              around durability and repeatability at scale. Neuralink has expanded from a first implant to a broader
              multi-site and international trial network, and 2026 coverage describes thread and robot changes meant to
              improve retention and speed, but the public record is still dominated by small cohorts, company
              disclosures, and secondary analysis rather than peer-reviewed, cohort-level operating metrics.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE008
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE007
              - CE008
              - CE010
              - CE011
      - number: '5.3'
        title: Differentiation and scaling dependencies
        blocks:
          - type: paragraph
            body: >-
              Neuralink's differentiation is not simply "brain chip" branding; it is the specific combination of direct
              intracortical access, a fully implanted wireless package, and robot-assisted insertion. That gives it a
              richer signal path than less invasive approaches, but it also locks the product into surgical-site,
              clinician, and post-implant support dependencies that competitors can sometimes avoid. The 2026 transdural
              update may standardize part of the procedure, yet it does not remove craniotomy, anesthesia, or
              site-capacity constraints, so scaling remains as much an operating-model challenge as a pure hardware one.
            claimRefs:
              - CE007
              - CE009
              - CE011
      - number: '5.4'
        title: Trust, safety, and unresolved diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The visible trust-and-safety story today is weighted toward physical design and clinical process controls:
              hermetic packaging, wireless charging, robotic placement intended to avoid blood vessels, and
              adverse-event tracking within trials. That is directionally positive, but it is thinner than a mature
              medtech diligence package because public sources still do not provide detailed cybersecurity architecture,
              longitudinal revision-rate data, or standardized independent validation of speech-restoration and
              higher-channel roadmaps. For underwriting, the central question is no longer whether Neuralink can produce
              compelling demos; it is whether the company can convert early clinical wins into a repeatable,
              supportable, regulator-ready product system.
            claimRefs:
              - CE008
              - CE010
              - CE011
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scaling risk is operational, not just technical
            body: >-
              Neuralink can point to credible implant and user-control progress, but the product still depends on
              neurosurgical throughput, durable thread retention, and under-disclosed wireless quality or security
              controls.
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
              - CE010
              - CE011
