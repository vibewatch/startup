  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Current market boundary is paralysis-first, provider-mediated, and narrower than broad neurotech TAM claims
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports a disciplined market definition: Neuralink's current commercially relevant
              market is invasive brain-computer-interface care for severe paralysis, delivered through hospitals,
              neurosurgical teams, and rehabilitation workflows rather than direct consumer software sales. Sacra
              explicitly frames the business model as a vertically integrated medical-device company that initially
              sells an implant system to hospitals, while AdValorem and Acquinox both center the PRIME paralysis trials
              as the near-term proof point. That means broad narratives around human-AI symbiosis, psychiatric
              treatment, or consumer enhancement are adjacencies, not today's underwritable core market. The same
              evidence also identifies real substitutes: less invasive BCI approaches, legacy assistive technologies,
              and the status quo of caregiver-supported computer access. Keeping those substitutes inside the market
              boundary matters because Neuralink is selling a high-friction surgical intervention into clinical budgets,
              not merely participating in generic software or electronics spend.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM007
              - CM011
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM012
      - number: '2.2'
        title: Public TAM evidence is broad and directional; current SAM/SOM remains unproven
        blocks:
          - type: paragraph
            body: >-
              Public sources provide directional market lenses, but they do not yield a clean, evidence-backed
              TAM-SAM-SOM ladder for Neuralink's current indication. Acquinox cites a global BCI market of about $3.2
              billion in 2025 growing to $12.9 billion by 2034, while SubconsciousMind uses a separate $2.94 billion
              category baseline, so even broad top-down estimates vary by methodology. Sacra adds much larger adjacency
              numbers for neurological disorders, psychiatric treatment, and a speculative $400 billion US BCI
              healthcare opportunity, but those figures stretch far beyond paralysis-focused device control. The most
              grounded bottom-up evidence is still operational rather than commercial: roughly 20 implanted patients by
              late 2025, 21 enrolled participants in a January 2026 update, and no public bridge from trial throughput
              to reimbursed procedures. As a result, the market-sizing figure should be read as a set of boundary
              markers and adoption anchors, not as a mathematically nested revenue waterfall.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM009
              - CM010
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM009
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM013
      - number: '2.3'
        title: Adoption timing depends on clinical throughput, reimbursement, and durability more than headline TAM
        blocks:
          - type: paragraph
            body: >-
              The demand case is credible because the product appears to solve an acute job: restoring computer access
              for patients with paralysis through high-channel-count, fully implantable hardware and software-defined
              follow-on applications. Sources point to three drivers that matter for valuation: better signal resolution
              than less invasive approaches, platform reuse across Telepathy, speech, and vision programs, and the
              prospect of automated surgery plus higher-volume manufacturing lowering operational bottlenecks. But the
              same evidence says commercialization is still constrained by thread retraction risk, long-term
              biocompatibility, pre-approval status, immature reimbursement pathways, and reputational or regulatory
              friction from animal-testing and privacy controversies. In practice, Neuralink's realized market share
              will depend less on whether the abstract BCI category is large and more on whether the company can
              translate trial participation into repeatable, reimbursable, durable procedures within hospital economics.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM013
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The key market risk is not category size but conversion into paid clinical throughput
            body: >-
              Public evidence can support a broad category narrative, but it still does not show a verified
              indication-level pricing stack, reimbursement path, or durable implant economics that convert TAM into
              current revenue capacity.
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
              - CM012
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape spans direct peers, adjacent implants, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Neuralink is not competing only with one other invasive implant vendor. The reviewed pool shows three
              overlapping solution classes for the same paralysis and communication jobs: direct invasive peers such as
              Paradromics and the legacy Blackrock research stack, lower-burden implant approaches such as Synchron's
              endovascular Stentrode and Precision Neuroscience's cortical-surface array, and non-invasive or status-quo
              assistive interfaces that avoid craniotomy entirely. That matters because the buyer decision is not just
              "best technology." It is also a decision about what level of surgical burden, reversibility, and signal
              fidelity a patient, clinician, and institution are willing to underwrite for a given use case.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
