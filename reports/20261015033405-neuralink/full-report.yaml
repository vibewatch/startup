      - number: '4.2'
        title: Capital intensity, valuation signals, and financing dependency
        blocks:
          - type: paragraph
            body: >
              Neuralink's financial profile is dominated by capital intensity and long development cycles. Sacra says
              the company's vertical integration across hardware development, surgical robotics, and neural data
              processing requires substantial capital investment before meaningful revenue, while Tracxn reports 705
              employees as of September 2026, implying a meaningful fixed-cost base before broad commercialization.
              Public financing data show continuing access to capital, but not a clean ledger: retained sources disagree
              on total capital raised, ranging from about $686 million to $1.85 billion. The broad conclusion is still
              consistent: Neuralink has raised enough external capital to continue funding trials and manufacturing, but
              outside investors cannot cleanly underwrite dilution, cash efficiency, or runway from public disclosures
              alone.
