        title: Current customer proof is trial-user adoption, not paying-account adoption
        blocks:
          - type: paragraph
            body: >-
              The cleanest customer evidence is not logos or signed hospital contracts; it is direct usage by trial
              participants with severe motor impairment. Neuralink officially positions the implant as a way to control
              a computer or mobile device and to restore independence, while independent sources show the currently
              evidenced user base is still limited to people with tetraplegia from cervical spinal cord injury or ALS
              inside investigational studies. That makes the chapter's core distinction important: the company has
              credible user-value proof, but it has not yet published commercial buyer, payer, or reimbursement proof at
              an underwritable level.
