  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered product and workflow
        blocks:
          - type: paragraph
            body: >-
              Neuralink is not selling a stand-alone chip; the delivered product is a clinical workflow for
              severe-paralysis patients in which a neurosurgical team implants the N1 device, the robot places thread
              electrodes into movement-related cortex, and software then translates those signals into cursor, typing,
              and device control. The strongest supported use case remains digital independence rather than generalized
              "mind reading" or broad consumer augmentation. Publicly visible benefit is concrete: third-party coverage
              and company-linked reporting describe web browsing, gaming, CAD work, messaging, and routine computer
              interaction, but always inside tightly managed clinical-study settings rather than open commercial
              distribution.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE012
