      - number: '1.2'
        title: Leadership, capital, and control visibility
        blocks:
          - type: paragraph
            body: |-
              Public visibility into leadership is strongest around Elon Musk and Jared
              Birchall, with founding or senior-technical roles also attributed to Paul
              Merolla and Dongjin Seo in assigned investor-marketing profiles. That is
              enough to describe founder-market fit and key-person concentration, but
              not enough to underwrite governance cleanly. The assigned pool does not
              publish a complete current board roster, voting/control structure, or a
              reconciled stakeholder map that separates primary funding from secondary
              transactions and any debt or structured terms.

              Capital visibility is similarly mixed. Assigned sources agree on a 2025
              Series E of roughly $650 million at about a $9.6-$9.65 billion formal
              valuation, which is the cleanest current pricing anchor. After that, the
              evidence diverges materially: third-party sources cite total funding from
              $1.2 billion-plus to roughly $5 billion. That spread is too wide to treat
              as a settled cover metric, so later valuation work should use the formal
              round as the hard anchor and treat cumulative-capital tallies as a live
              diligence item instead of a verified fact.
