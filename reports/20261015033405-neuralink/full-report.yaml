      - number: '3.3'
        title: Commercial packaging remains less transparent than capability positioning
        blocks:
          - type: paragraph
            body: >-
              Public evidence is much stronger on technical route and clinical maturity than on pricing or procurement.
              Across the reviewed sources, Neuralink and its closest invasive peers are still packaged through trials,
              specialized centers, or research programs rather than through transparent list pricing and standard sales
              terms. That means the most visible switching-cost variables today are procedural burden, center readiness,
              and regulatory path, not negotiated price points. Synchron's easier delivery path and Precision's
              reversibility matter precisely because buyers can compare those access characteristics long before they
              can compare realized reimbursement, discounts, or lifetime-support terms.
            claimRefs:
              - CP010
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP014
              - CP015
      - number: '3.4'
        title: Moat durability depends on durability and execution, not only performance
        blocks:
          - type: paragraph
            body: >-
              The evidence does support a real Neuralink edge, but not a winner-take-all one. Neuralink looks strongest
              when the buyer values maximum direct neural access, a multi-application platform, and robotic implantation
              as part of the product. The disconfirming evidence is equally clear: thread retraction, unresolved
              long-term signal stability, and years of approval work leave space for less-invasive or speech-specialized
              entrants to win narrower niches first. In other words, Neuralink's moat is conditional. It must convert
              engineering advantage into durable clinical outcomes and scalable center economics before the architecture
              turns into a defensible commercial lead.
            claimRefs:
              - CP012
              - CP013
              - CP017
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated-stack advantage
            body: >-
              Neuralink's most defensible edge in the reviewed pool is system integration: implant, wireless
              electronics, robotic placement, and decoding software are presented as one coordinated clinical product
              rather than as a standalone array.
            calloutType: strength
            claimRefs:
              - CP001
              - CP008
              - CP009
          - type: callout
            title: Less-invasive rivals can still win
            body: >-
              Synchron and Precision do not need to beat Neuralink on maximum signal density to take share; they only
              need to be good enough for specific tasks while reducing surgical burden, reversibility concerns, or
              regulatory friction.
            calloutType: risk
            claimRefs:
              - CP003
              - CP006
              - CP010
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and current commercialization status
        blocks:
          - type: paragraph
            body: >
              The public record supports a future hospital-delivered medical-device model, not a currently monetized
              software subscription business. Sacra describes Neuralink as a vertically integrated B2B2C model that
              would initially sell implant systems to hospitals, with economics tied to implant hardware plus the
              surrounding surgical and support workflow. But that remains a model description rather than proof of
              realized revenue: Elon Explained says the N1 is still experimental and has no price or revenue yet, and
              none of the retained sources disclose a paid hospital contract, reimbursement receipt, or recognized
              revenue policy. That leaves the chapter with a usable mechanism for how revenue could eventually form, but
              not with investor-grade evidence that the mechanism has started converting clinical demand into booked
              sales.
