      - number: '3.2'
        title: Architecture tradeoffs drive positioning more than brand
        blocks:
          - type: paragraph
            body: >-
              Neuralink's strongest public differentiation is architectural integration. Its case is not merely that it
              has more electrodes; it combines a fully implantable wireless device, dense intracortical threads, custom
              electronics, and a purpose- built implantation robot into one clinical stack. That pushes Neuralink toward
              the highest direct signal-access position in the reviewed pool, while Synchron and Precision move down the
              invasiveness curve to gain adoption advantages and Paradromics stays closer to Neuralink on performance
              ambition by emphasizing high-bandwidth communication workloads. The figure below should be read as an
              evidence-backed ordinal map of those tradeoffs, not as a measured benchmark.
            claimRefs:
