            title: Runway cannot be underwritten from public evidence
            body: >
              Public sources show substantial financing access, but they do not disclose cash on hand, monthly burn,
              debt obligations, or a reconciled lifetime capital total, so any runway model would still be conjectural.
            calloutType: risk
            claimRefs:
