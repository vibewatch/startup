      - number: '6.2'
        title: Named participants show real usage depth and some geographic expansion
        blocks:
          - type: paragraph
            body: >-
              Neuralink's strongest customer evidence comes from named participants and concrete task performance rather
              than topline customer counts. The public arc runs from Noland Arbaugh's first implant and daily web,
              gaming, and communication use, to Alex using CAD software and first-person shooter games, to Paul becoming
              the first UK patient and controlling a computer within hours. The cohort count also expanded from one
              patient in early 2024 to 21 participants across four countries by January 2026. These are meaningful proof
              points for adoption and product utility, but they remain trial deployments rather than recurring
              contracted accounts.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU008
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU005
              - CU006
      - number: '6.3'
        title: Durability evidence is improving, but retention metrics are still missing
        blocks:
          - type: paragraph
            body: >-
              The best durability signal is operational rather than contractual. Public sources describe thread
              retraction in the first implant, followed by process and design changes that reportedly helped later
              implants avoid the same problem, and named users continued to expand the range of tasks they could
              perform. That supports a cautious land-and-expand narrative inside the study cohort: better device
              stability can enable broader use cases and more international enrollment. But there is still no disclosed
              NRR, GRR, churn, renewal timing, explant rate, reimbursement conversion, or active user denominator that
              would let an investor translate clinical momentum into customer-retention quality.
            claimRefs:
              - CU005
              - CU008
              - CU009
              - CU011
              - CU012
      - number: '6.4'
        title: Commercial concentration and payer risk remain largely opaque
        blocks:
          - type: paragraph
            body: >-
              Public sources point to a future hospital-mediated model, but they do not show a diversified
              paying-customer base today. Sacra frames Neuralink as a B2B2C medical-device company that would sell
              systems to hospitals, while ElonExplained notes the N1 still has no public price or revenue. In other
              words, the revenue-bearing buyer may eventually be a clinical site or hospital, but the evidence in this
              pool still centers on individual participants and investigational enrollment. Until the company publishes
              site economics, reimbursement paths, or concentration metrics, customer durability and channel dependence
              remain diligence gaps rather than strengths.
            claimRefs:
              - CU008
              - CU010
              - CU011
              - CU012
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Real usage proof exists
            body: >-
              Neuralink has moved beyond logo theater: named participants are publicly shown using the implant for web
              browsing, gaming, CAD, and communication, and the disclosed cohort grew to 21 participants across four
              countries by January 2026.
            calloutType: strength
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
          - type: callout
            title: Commercial durability is still unproven
            body: >-
              The public evidence set does not disclose pricing, reimbursement, renewal, churn, or top-customer
              concentration, so today's customer story is strong on participant outcomes and weak on investor-grade
              account economics.
            calloutType: risk
            claimRefs:
              - CU008
              - CU010
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              Neuralink has moved beyond concept-stage hype, but the evidence still supports a high residual-risk view
              because the program is early, invasive, and capital intensive. Public materials now show a real
              human-trial base: the company says PRIME is evaluating the safety and initial functionality of the implant
              and surgical robot, while independent trackers describe 21 enrolled participants across four countries
              with no serious adverse device events publicly reported as of April 2026. That is meaningful progress, yet
              it remains a narrow dataset for an intracortical implant platform whose go-forward case depends on larger
              cohorts, durable signal quality, and a manufacturing ramp far beyond the 12 implanted patients reported by
              late 2025. The core ranking is therefore: first, regulatory and long-term safety risk; second, operational
              and platform-reliability risk; third, continuity, privacy, and governance risk; and fourth, capital,
              reimbursement, and business-model risk.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR011
              - CR012
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR008
              - CR011
              - CR013
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and ethical risks remain the hardest to underwrite
        blocks:
          - type: paragraph
            body: >-
              Neuralink has credible regulatory progress but not a short path to broad commercialization. The official
              record shows FDA clearance to start the first-in-human study in 2023, and later sources show a 2025 speech
              restoration Breakthrough Device designation. Even so, independent analyses repeatedly warn that
              Breakthrough status speeds interaction with FDA rather than replacing proof of safety and efficacy, and
              Sacra still frames full clearance as a late-2020s problem rather than a near-term event. Ethical and legal
              exposure is also broader than ordinary medical device execution. Frontiers argues that long-term user
              support, neural privacy, and decision-making autonomy require stronger safeguards, and it criticizes the
              delayed ClinicalTrials.gov registration because outside reviewers initially lacked a normal transparency
              channel. The result is a real diligence blocker: there is still no public package that lets an investor
              cleanly score long-term explant risk, continuity obligations, or the eventual reimbursement and
              post-market surveillance regime.
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR015
      - number: '7.3'
        title: Operational scaling depends on one platform and a still-fragile workflow
        blocks:
          - type: paragraph
            body: >-
              Operationally, Neuralink has evidence of improvement, but the mitigation stack is still immature relative
              to its ambitions. The company describes accelerated lifetime testing to capture device failure modes, and
              third-party summaries say later cases improved after learnings from the first patient's thread retraction
              issue. Those are positive signs, but they also confirm that device stability, biocompatibility, and
              surgical repeatability remain live risks rather than retired ones. The same dependence cuts across every
              program: Tesorb says the entire clinical portfolio runs on variations of the same N1 implant and R1 robot,
              so a material hardware defect, sterility issue, software decoding regression, or robotic-process
              bottleneck could hit all active indications at once. Trial expansion across the US, Canada, UAE, and UK
              reduces single-site concentration, but it does not remove concentration in the core implant architecture,
              the robotic procedure, or a small set of specialist sites and investigators.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR012
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR011
              - CR012
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR007
              - CR012
              - CR013
              - CR014
              - CR016
      - number: '7.4'
        title: Financial and commercialization risk stays open because public economics are absent
        blocks:
          - type: paragraph
            body: >-
              The investment case still lacks the public economics needed to underwrite downside. Sacra and Elon
              Explained both describe an experimental product with no public price or revenue, while Sacra's
              business-model summary makes clear this is a vertically integrated hardware, software, and
              surgical-services company that must finance trials, manufacturing, and clinical support before scale
              revenue exists. Additional funding and a roughly $9B to $9.6B valuation anchor reduce near-term insolvency
              risk, but they do not solve reimbursement, hospital adoption, gross-margin visibility, or the continuity
              reserve that an implanted-device platform may ultimately need. The practical kill criteria are therefore
              observable: a serious adverse event that materially stalls enrollment, a failure to convert
              Breakthrough-designated programs into larger disclosed datasets, evidence that automated surgery does not
              improve throughput safely, or an inability to articulate a credible reimbursement and continuity model.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR011
              - CR012
              - CR013
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory progress is real, but it is not the same as approval readiness
            body: >-
              IDE access, Breakthrough designations, and multi-country trials prove motion, but the retained evidence
              still points to a multi-year approval and post-market support burden rather than a near-term de-risked
              device platform.
            calloutType: risk
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR011
          - type: callout
            title: Neuralink's biggest operational hedge is learning speed, not proof of final reliability
            body: >-
              The company appears to be iterating quickly after the first patient's thread-retraction issue, yet the
              available public record still shows a platform learning curve rather than a fully proven device and
              procedure.
            calloutType: insight
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR012
          - type: callout
            title: Thesis-break triggers should be tied to safety disclosure, reimbursement, and support commitments
            body: >-
              Investors should treat serious adverse-event disclosure, stalled enrollment, lack of reimbursement detail,
              or no long-term continuity plan as harder stop signs than enthusiastic enrollment or funding headlines.
            calloutType: recommendation
            claimRefs:
              - CR007
              - CR008
              - CR011
              - CR013
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The public record still supports a research-more recommendation, medium confidence, a high risk rating,
              and a stretched valuation stance. Neuralink remains private with no public ticker, no SEC filing, and no
              announced IPO date, so investors are underwriting private marks rather than public-market discovery.
              Public references cluster the last formal/private mark near $9B-$9.65B, but independent commentary also
              notes unconfirmed secondary indications well above that range and internal plans that still depend on
              approval, reimbursement, and commercialization that have not yet been proven in disclosed financial
              results. That combination makes the company analytically interesting but leaves the current price context
              too rich for a clean underwrite from public evidence alone.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV009
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV009
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV009
              - CV010
              - CV012
              - CV013
      - number: '8.2'
        title: Thesis vs. anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is straightforward: official materials and independent clinical summaries support that
              Neuralink has a real, functioning invasive BCI platform with meaningful early human utility and a credible
              path to expand from motor control into speech and vision programs. The anti-thesis is equally important:
              the same public sources still describe a pre-revenue, pre-approval company with unresolved durability
              questions, no public reimbursement bridge, and no clean cap-table disclosure. In other words, the
              best-supported evidence today is proof of technical and clinical progress, not proof that the current
              valuation already offers attractive risk-adjusted upside for a new investor.
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV011
              - CV012
      - number: '8.3'
        title: Scenario framing and valuation context
        blocks:
          - type: paragraph
            body: >-
              A model-appropriate framing for Neuralink is milestone-based rather than multiple-based, because public
              evidence does not disclose commercial revenue, gross margin, or reimbursement realization that would make
              a traditional revenue or EBITDA comp set defensible. The comparable set is therefore clinical and
              financing context: the last quoted primary marks around $9B-$9.65B, the still-unconfirmed secondary
              enthusiasm above that, and a commercialization path that remains tied to safety, durability, payer
              acceptance, and manufacturing execution. Under that lens, the base case is that current marks already
              capitalize much of the visible platform promise, while the bear case is a flat round or down round if
              approval, reliability, or reimbursement timelines slip before revenue appears.
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV007
              - CV009
              - CV010
              - CV013
      - number: '8.4'
        title: Final diligence asks and exit readiness
        blocks:
          - type: paragraph
            body: >-
              The final diligence work should focus on the specific evidence missing from the public record, not on
              repeating the product story. The priority asks are a reconciled revenue and pricing model by indication,
              reimbursement and payer traction, gross-margin and clinic-economics assumptions, and the exact financing
              stack sitting above common-equity secondary marks. Investors also need a cleaner view of adverse-event
              rates, thread stability, revision and explant expectations, and any service or reserve obligations that
              could absorb cash before scale. Until those answers are available, exit readiness is still more a function
              of financing narrative and milestone optics than of underwritten operating economics.
            claimRefs:
              - CV004
              - CV007
              - CV009
              - CV010
              - CV012
              - CV014
