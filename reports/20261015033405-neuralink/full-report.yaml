chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and current product scope
        blocks:
          - type: paragraph
            body: |-
              Neuralink's current identity is clearer than its economics. Across the
              assigned official and independent sources, the company is a private
              neurotechnology developer founded in 2016 and headquartered in Fremont,
              California, building an invasive brain-computer-interface stack for
              paralysis-first use cases. The official site describes a system that
              translates neural signals into actions, while independent summaries
              consistently describe the integrated bundle as an implant, a surgical
              robot, and decoding software rather than a pure software product.

              The product story is no longer purely aspirational. Neuralink's homepage
              now foregrounds multiple implanted users and the official updates page
              shows a cadence of trial, safety, and product announcements. That does
              not make the business commercial: assigned third-party summaries still
              describe the company as private, pre-revenue, and pre-approval. For later
              chapters, the reliable reusable ground truth is that Neuralink has
              functioning human-trial hardware and software, but not yet a public
              revenue model or public-market disclosure profile.
