evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-visibility
    missingEvidence: A current board roster, voting-control map, and formal succession structure.
    whyItMatters: >-
      Public leadership visibility is not the same as governance clarity, and control rights can materially affect risk
      and exit outcomes.
    diligencePath: Request the latest board materials, charter documents, cap table, and governance org chart from management.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: capital-reconciliation
    missingEvidence: >-
      A reconciled funding ledger that separates primary financing, secondary liquidity, debt, and any structured
      instruments.
    whyItMatters: >-
      Valuation context and downside protection depend on understanding how much fresh capital the company actually
      raised and on what terms.
    diligencePath: Request executed financing docs and a round-by-round cap-table bridge through the latest Series E.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-economics
    missingEvidence: Current pricing, reimbursement status, revenue, gross margin, burn, runway, and paying-customer data.
    whyItMatters: >-
      Clinical momentum alone cannot support a durable underwriting view without evidence of future unit economics and
      financing need.
    diligencePath: >-
      Obtain board-level financial reporting, reimbursement strategy materials, and a clinic-by-clinic commercialization
      plan.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: paralysis-sam-som
    missingEvidence: >-
      Indication-level eligible-patient counts, procedure volumes by site, reimbursement receipts, and payer policy
      detail for the current paralysis use case.
    whyItMatters: Without those inputs, broad BCI TAMs cannot be converted into a defensible current SAM or SOM for underwriting.
    diligencePath: >-
      Request site-level procedure forecasts, reimbursement dossiers, and any paid-claim or coverage-policy evidence
      from Neuralink or participating health systems.
    relatedQuestionRefs:
      - QM004
      - QM010
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: long-term-durability
    missingEvidence: >-
      Multi-year cohort data on explants, revisions, retained channel quality, and support burden after the first
      implantation period.
    whyItMatters: >-
      Durability determines whether hospitals and payers can treat the product as a repeatable therapy rather than an
      expensive experiment.
    diligencePath: >-
      Obtain longitudinal cohort summaries, revision logs, and follow-up protocol data from clinical investigators or
      company disclosures.
    relatedQuestionRefs:
      - QM007
      - QM010
  - type: stale
    severity: minor
    topic: consumer-optionality
    missingEvidence: >-
      A dated, evidence-backed launch criterion separating speculative consumer enhancement from regulated medical
      rollout.
    whyItMatters: >-
      Keeping that boundary explicit prevents the valuation case from double-counting optionality that has no current
      approval or buyer.
    diligencePath: >-
      Treat enhancement commentary as non-core until a product roadmap, regulatory path, and buyer definition are
      publicly documented.
    relatedQuestionRefs:
      - QM005
  - type: private-evidence-only
    severity: material
    topic: pricing-economics
    missingEvidence: >-
      Realized procedure pricing, reimbursement pathway, center economics, discounting, and contract terms across
      Neuralink and peer BCI vendors.
    whyItMatters: >-
      Without economic evidence, the chapter can compare technical and procedural switching costs better than true
      commercial switching costs.
    diligencePath: >-
      Request vendor proposals, partner-center procurement terms, reimbursement coding detail, and any patient-support
      or revision-liability commitments.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: revenue-bridge
    missingEvidence: >-
      Recognized revenue, revenue mix, reimbursement receipts, gross-to-net logic, and a disclosed revenue-recognition
      policy for the first paid procedures.
    whyItMatters: >-
      Without paid-procedure evidence, the chapter can describe only a future mechanism, not revenue quality or
      repeatability.
    diligencePath: >-
      Request the first commercial hospital contract, one paid claim or invoice, and management's revenue-recognition
      memo.
    relatedQuestionRefs:
      - QI001
      - QI002
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: Latest cash balance, monthly burn, debt obligations, covenant package, and management runway view.
    whyItMatters: >-
      Cash, burn, and debt are the core inputs for underwriting capital adequacy between clinical milestones and
      approval.
    diligencePath: >-
      Request the latest board deck or financing pack with cash, monthly burn, debt schedule, and base-case runway
      bridge.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: capital-raised
    missingEvidence: >-
      A reconciled round-by-round financing table that ties all primary raises and any secondary transactions to share
      classes and dates.
    whyItMatters: Conflicting public totals weaken dilution, valuation-step-up, and insider-support analysis.
    diligencePath: Reconcile the cap table against signed closing documents and prior financing announcements.
    relatedQuestionRefs:
      - QI005
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Bill of materials, implant manufacturing yield, procedure-support cost, and post-implant service burden.
    whyItMatters: Gross margin and payback cannot be inferred from list-like cost proxies alone.
    diligencePath: Request product-cost rollups, procedure support staffing assumptions, and early contribution-margin reporting.
    relatedQuestionRefs:
      - QI003
      - QI008
  - type: missing-source
    severity: material
    topic: wireless-cybersecurity
    missingEvidence: >-
      Public device-security architecture, threat-model, SBOM, encryption/authentication design, and postmarket
      quality-process disclosures for the wireless implant stack.
    whyItMatters: >-
      Neural data leaves the body wirelessly, so security and software quality controls can affect both patient safety
      and regulatory readiness.
    diligencePath: >-
      Request security architecture, secure-development process evidence, and regulatory cybersecurity work product from
      management or lead clinical/compliance staff.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: longitudinal-reliability
    missingEvidence: >-
      Cohort-level retention, revision, explant, serious-adverse-event, and signal-degradation data across implanted
      patients.
    whyItMatters: >-
      Durable signal quality and revision burden are core to whether Neuralink is a scalable medtech product or a
      fragile clinical demo.
    diligencePath: >-
      Obtain blinded cohort metrics, protocol amendments, and investigator summaries from ongoing PRIME, GB-PRIME,
      UAE-PRIME, and VOICE studies.
    relatedQuestionRefs:
      - QE003
      - QE005
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      A public developer or practitioner signal such as open repos, package activity, public API ecosystem data, or
      integration-partner technical adoption metrics.
    whyItMatters: >-
      Public technical ecosystem evidence would help separate durable platform adoption from headline-driven clinical
      interest.
    diligencePath: >-
      Ask management for developer or integration telemetry and check whether future public SDK, API, or
      partner-implementation materials can be shared.
    relatedQuestionRefs:
      - QE004
  - type: private-evidence-only
    severity: material
    topic: payer-economics
    missingEvidence: >-
      Public pricing, reimbursement assumptions, site economics, and who pays for implantation and follow-up in current
      and future deployments.
    whyItMatters: >-
      Without payer mechanics, the chapter cannot convert user proof into an underwritable commercial adoption curve or
      margin view.
    diligencePath: >-
      Request trial-site funding structure, future reimbursement strategy, target ASP, and any hospital LOIs or pilot
      procurement terms.
    relatedQuestionRefs:
      - QU008
  - type: missing-source
    severity: material
    topic: retention-and-concentration
    missingEvidence: >-
      Renewal, churn, explant, active-user frequency, cohort retention, and top-site or top-customer concentration
      metrics.
    whyItMatters: >-
      These metrics determine whether current trial momentum is durable or is concentrated in a small number of highly
      supported showcase cases.
    diligencePath: >-
      Request a cohort table with activation frequency, discontinuations, explants, site mix, and any concentration by
      geography or investigator.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: material
    topic: named-user-coverage
    missingEvidence: >-
      A complete public roster of implanted participants and sites with production-vs-pilot status and longitudinal
      usage outcomes.
    whyItMatters: >-
      The named proof table demonstrates real use but cannot show whether the rest of the cohort looks similar or is
      more fragile.
    diligencePath: >-
      Request a participant-by-participant or site-by-site summary with activation timing, current status, and primary
      outcome category.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: safety-disclosure
    missingEvidence: >-
      Cohort-level revision surgery rates, explant data, infection incidence, and durable signal-quality decay over
      time.
    whyItMatters: Without these data, it is hard to separate an improving early-feasibility program from a durable implant platform.
    diligencePath: >-
      Request the latest safety monitoring package, device survival curves, and any protocol amendments tied to hardware
      or surgery changes.
    relatedQuestionRefs:
      - QR002
      - QR008
  - type: private-evidence-only
    severity: blocking
    topic: commercialization-gap
    missingEvidence: >-
      Public pricing, reimbursement strategy, hospital economics, gross margin assumptions, and continuity-support
      reserve design.
    whyItMatters: >-
      These inputs determine whether trial success can translate into investable economics and defensible patient
      support obligations.
    diligencePath: >-
      Request management's reimbursement roadmap, hospital deployment model, unit economics, and a long-term support
      covenant.
    relatedQuestionRefs:
      - QR006
      - QR008
  - type: missing-source
    severity: material
    topic: governance-and-rights
    missingEvidence: >-
      A current public policy package on neural-data retention, consent withdrawal, and post-implant support
      obligations.
    whyItMatters: Privacy and continuity risk may become gating legal issues before scale commercialization.
    diligencePath: Request published data-governance policies, DPA-style controls, and device end-of-life procedures.
    relatedQuestionRefs:
      - QR005
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: commercial-economics
    missingEvidence: >-
      Disclosed pricing by indication, reimbursement receipts or payer contracts, gross margin, and clinic-level unit
      economics.
    whyItMatters: >-
      Without a commercial bridge, investors cannot test whether quoted private marks are underwriting plausible
      earnings power or just technical scarcity.
    diligencePath: >-
      Request management materials that break out procedure pricing, reimbursement status, gross margin assumptions, and
      expected clinic utilization by launch cohort.
    relatedQuestionRefs:
      - QV003
  - type: missing-source
    severity: material
    topic: cap-table-and-overhang
    missingEvidence: >-
      A reconciled capitalization table, liquidation preferences, option pool terms, debt or structured capital, and
      secondary-transfer constraints.
    whyItMatters: >-
      Preference overhang and dilution can materially alter the return to new investors even if the company eventually
      succeeds operationally.
    diligencePath: >-
      Obtain the latest cap table, financing documents, and any secondary-market transfer terms before underwriting an
      entry price.
    relatedQuestionRefs:
      - QV008
  - type: missing-source
    severity: material
    topic: long-term-reliability
    missingEvidence: >-
      Longitudinal data on thread stability, revision and explant rates, serious adverse events, and
      continuity-of-service obligations.
    whyItMatters: >-
      Durability and support costs determine whether early clinical proof can become an economically viable medtech
      platform instead of a costly pilot program.
    diligencePath: >-
      Ask for cohort-by-cohort safety, performance-retention, and support-cost reporting, including any reserve
      assumptions for revisions or device failure.
    relatedQuestionRefs:
      - QV006
      - QV007
