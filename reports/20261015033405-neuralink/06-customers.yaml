  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: payer-economics
      missingEvidence: >-
        Public pricing, reimbursement assumptions, site economics, and who pays
        for implantation and follow-up in current and future deployments.
      whyItMatters: >-
        Without payer mechanics, the chapter cannot convert user proof into an
        underwritable commercial adoption curve or margin view.
      diligencePath: >-
        Request trial-site funding structure, future reimbursement strategy,
        target ASP, and any hospital LOIs or pilot procurement terms.
      relatedQuestionRefs: [QU008]
    - type: missing-source
      severity: material
      topic: retention-and-concentration
      missingEvidence: >-
        Renewal, churn, explant, active-user frequency, cohort retention, and
        top-site or top-customer concentration metrics.
      whyItMatters: >-
        These metrics determine whether current trial momentum is durable or is
        concentrated in a small number of highly supported showcase cases.
      diligencePath: >-
        Request a cohort table with activation frequency, discontinuations,
        explants, site mix, and any concentration by geography or investigator.
      relatedQuestionRefs: [QU008]
    - type: enumeration-incomplete
      severity: material
      topic: named-user-coverage
      missingEvidence: >-
        A complete public roster of implanted participants and sites with
        production-vs-pilot status and longitudinal usage outcomes.
      whyItMatters: >-
        The named proof table demonstrates real use but cannot show whether the
        rest of the cohort looks similar or is more fragile.
      diligencePath: >-
        Request a participant-by-participant or site-by-site summary with
        activation timing, current status, and primary outcome category.
      relatedQuestionRefs: [QU008]
      relatedTableRefs: [TU003]
