schemaVersion: report-v2
artifact: customers
slug: neuralink
runDate: 2026-10-15
company:
  name: Neuralink
chapter:
  number: 6
  title: Customers
  summary: >-
    Neuralink has real user proof, but the current evidence base is still a
    clinical-user story rather than a commercial-customer story. Public sources
    show named participants using N1 for meaningful daily computing tasks and a
    cohort that reached 21 participants across four countries by January 2026,
    while pricing, reimbursement, renewal, and concentration data remain
    undisclosed.
sections:
  - id: trial-user-base
    title: Current customer proof is trial-user adoption, not paying-account adoption
    body: >-
      The cleanest customer evidence is not logos or signed hospital contracts;
      it is direct usage by trial participants with severe motor impairment.
      Neuralink officially positions the implant as a way to control a computer
      or mobile device and to restore independence, while independent sources
      show the currently evidenced user base is still limited to people with
      tetraplegia from cervical spinal cord injury or ALS inside investigational
      studies. That makes the chapter's core distinction important: the company
      has credible user-value proof, but it has not yet published commercial
      buyer, payer, or reimbursement proof at an underwritable level.
    claimRefs: [CU001, CU002, CU008, CU010, CU011, CU012]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: named-deployment-proof
    title: Named participants show real usage depth and some geographic expansion
    body: >-
      Neuralink's strongest customer evidence comes from named participants and
      concrete task performance rather than topline customer counts. The public
      arc runs from Noland Arbaugh's first implant and daily web, gaming, and
      communication use, to Alex using CAD software and first-person shooter
      games, to Paul becoming the first UK patient and controlling a computer
      within hours. The cohort count also expanded from one patient in early
      2024 to 21 participants across four countries by January 2026. These are
      meaningful proof points for adoption and product utility, but they remain
      trial deployments rather than recurring contracted accounts.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU012]
    tableRefs: [TU002, TU003]
  - id: durability-and-expansion
    title: Durability evidence is improving, but retention metrics are still missing
    body: >-
      The best durability signal is operational rather than contractual. Public
      sources describe thread retraction in the first implant, followed by
      process and design changes that reportedly helped later implants avoid the
      same problem, and named users continued to expand the range of tasks they
      could perform. That supports a cautious land-and-expand narrative inside
      the study cohort: better device stability can enable broader use cases and
      more international enrollment. But there is still no disclosed NRR, GRR,
      churn, renewal timing, explant rate, reimbursement conversion, or active
      user denominator that would let an investor translate clinical momentum
      into customer-retention quality.
    claimRefs: [CU005, CU008, CU009, CU011, CU012]
  - id: commercial-readiness-and-concentration
    title: Commercial concentration and payer risk remain largely opaque
    body: >-
      Public sources point to a future hospital-mediated model, but they do not
      show a diversified paying-customer base today. Sacra frames Neuralink as
      a B2B2C medical-device company that would sell systems to hospitals, while
      ElonExplained notes the N1 still has no public price or revenue. In other
      words, the revenue-bearing buyer may eventually be a clinical site or
      hospital, but the evidence in this pool still centers on individual
      participants and investigational enrollment. Until the company publishes
      site economics, reimbursement paths, or concentration metrics, customer
      durability and channel dependence remain diligence gaps rather than
      strengths.
    claimRefs: [CU008, CU010, CU011, CU012]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Use case / current evidence
      - Strategic value / gap
    rows:
      - [Adults with tetraplegia from cervical SCI, Undisclosed in public sources, Individual participant, Undisclosed, Thought-controlled computer and device use in investigational studies, Clearest directly evidenced current user segment]
      - [Adults with ALS / motor neuron disease, Undisclosed in public sources, Individual participant, Undisclosed, Computer control today and speech-restoration relevance for future VOICE workflows, User need is clear but commercial pathway is still undisclosed]
      - ["Trial hospitals and clinical sites in the US, Canada, UK, and UAE", Neuralink-sponsored enrollment plus clinical-site cooperation, Neurosurgical and study teams plus participants, Undisclosed, "Recruitment, implantation, activation, and follow-up inside regulated trials", Shows channel expansion but not disclosed contract value]
      - [Future hospital-mediated medical-device buyers, Hospital or health-system buyer per third-party model, Patient plus care team, Insurer / patient / provider mix undisclosed, Sacra's projected B2B2C path rather than a published live customer roster, Important upside path but still underwriting-by-analogy]
    notes: >-
      Rows blend directly evidenced trial-user segments with a clearly labeled
      projected hospital buyer path; public sources do not disclose pricing,
      reimbursement, or who funds each current implant episode.
    claimRefs: [CU001, CU002, CU003, CU010, CU011]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - [Named implanted users, 1 first human participant (Noland Arbaugh), 2024-01, MindTransfer + Wikipedia, medium, First real-world proof that N1 could enable daily computer use, Eligible patient pool and site count not disclosed]
      - [Cohort size, 12 implanted participants, 2025-09, MindTransfer + RobotCentral + Wikipedia, medium, Shows progression beyond a single showcase patient, Active-user frequency and discontinuation rate not disclosed]
      - [Cohort size and geography, 21 participants across four countries, "2026-01-28", MindTransfer + ElonExplained, medium, Demonstrates international enrollment momentum, Current 2026-10 patient count in assigned sources is not officially updated]
      - [Commercial economics disclosure, No public price or revenue yet, 2026, ElonExplained + Sacra, medium, Confirms adoption evidence is still clinical and pre-commercial, Reimbursement mix and site-level contract economics remain undisclosed]
    notes: >-
      This is a public-evidence trajectory table, not a GAAP customer ledger;
      cohort counts are study-participant counts, and the denominator of eligible
      candidates, paying sites, and active retained users is still missing.
    claimRefs: [CU003, CU004, CU007, CU008, CU011]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / participant
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - [Noland Arbaugh, Tetraplegia after spinal cord injury, Web browsing gaming academic work and communication by thought, Pilot / first-in-human but used daily over a multi-year follow-up window, Strongest named autonomy proof and longest public usage history, Early thread retraction means it is not a clean no-issues production analogue]
      - [Alex (second participant), Severe motor impairment in PRIME, CAD software use and first-person shooter gaming, Pilot / trial participant, Shows higher-precision cursor control and no reported thread retraction, Alias only and no published economic or renewal metrics]
      - [Paul (first UK patient), International trial participant, Controlled a computer within hours after implantation, Pilot / trial participant, Demonstrates UK site activation and geographic expansion, Only immediate activation is public; long-term use quality and site economics remain unknown]
    notes: >-
      This is a sample of publicly named or clearly described participants from
      assigned sources, not an exhaustive roster of every implanted user or site.
    enumerationScope:
      coverage: sample
      basis: >-
        Sample limited to participants explicitly named or uniquely described in
        assigned public sources as of the 2026-10-15 run date.
    claimRefs: [CU004, CU005, CU006]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      The current journey still runs through regulated trial enrollment and
      activation loops before any hospital-scale commercial handoff is visible.
    data:
      items:
        - label: Registry and eligibility screening
          actor: Prospective participant
          stage: Entry
          touchpoints:
            - Tetraplegia or ALS qualification
            - Trial-site screening and enrollment
          detail: Public evidence starts with medically eligible participants, not general consumers.
        - label: Surgical implantation at a clinical site
          actor: Neuralink plus site care team
          stage: Implant
          touchpoints:
            - Robotic implantation procedure
            - Post-op monitoring
          detail: Adoption still depends on specialized trial sites and regulated neurosurgical workflows.
        - label: Initial activation and cursor control
          actor: Participant
          stage: Activation
          touchpoints:
            - Computer control within minutes or hours
            - Calibration and decoder setup
          detail: Fast first-use moments are a repeated public proof point.
        - label: Daily digital independence loop
          actor: Participant
          stage: Ongoing use
          touchpoints:
            - Web browsing and messaging
            - Gaming and study / work support
          detail: Named users demonstrate real daily value, but active-user frequency is not fully disclosed.
        - label: Feature expansion and international rollout
          actor: Participant plus new sites
          stage: Expansion
          touchpoints:
            - CAD and gaming use cases
            - UK and other country rollout
          detail: The product is broadening inside the cohort before broad hospital commercialization is proven.
        - label: Future hospital buyer and payer handoff
          actor: Hospital buyer / payer ecosystem
          stage: Commercialization
          touchpoints:
            - Pricing and reimbursement design
            - Contracted site deployment
          detail: This step is still modeled by third parties rather than demonstrated by public contract evidence.
    claimRefs: [CU001, CU003, CU004, CU005, CU006, CU010, CU011, CU012]
callouts:
  - calloutType: strength
    title: Real usage proof exists
    body: >-
      Neuralink has moved beyond logo theater: named participants are publicly
      shown using the implant for web browsing, gaming, CAD, and communication,
      and the disclosed cohort grew to 21 participants across four countries by
      January 2026.
    claimRefs: [CU003, CU004, CU005, CU006]
  - calloutType: risk
    title: Commercial durability is still unproven
    body: >-
      The public evidence set does not disclose pricing, reimbursement, renewal,
      churn, or top-customer concentration, so today's customer story is strong
      on participant outcomes and weak on investor-grade account economics.
    claimRefs: [CU008, CU010, CU011, CU012]
