  evidenceGaps:
    - type: missing-source
      severity: material
      topic: reliability
      missingEvidence: Current corridor-level delivery, approval, failure, reversal, uptime, and incident metrics by payment rail and geography.
      whyItMatters: Broad product coverage does not establish that a target corridor will meet customer, treasury, or regulatory service requirements.
      diligencePath: Request twelve months of corridor-level operational dashboards, SLOs, incident reports, failed-transfer reason codes, and referenceable customer outcomes.
      relatedQuestionRefs: [QE007, QE008]
    - type: missing-source
      severity: material
      topic: trust-controls
      missingEvidence: Independent security assessment, certification scope, data-residency documentation, fraud-loss metrics, and model-governance artifacts.
      whyItMatters: Risk automation descriptions are not equivalent to tested security or control effectiveness for a regulated payments platform.
      diligencePath: Obtain current SOC/ISO or equivalent reports, penetration-test executive summaries, control matrices, vendor-risk documents, and fraud-model validation results under NDA.
      relatedQuestionRefs: [QE006, QE007]
    - type: missing-source
      severity: material
      topic: integrations
      missingEvidence: Current API reference, sandbox, webhook semantics, rate limits, reconciliation exports, and partner-outage runbooks.
