company:
  name: Chipper Cash
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports a research-more stance, not a current valuation
    endorsement. Historical financing marks diverge, the common-stock valuation
    was sharply reset in 2023, and no actionable secondary price or current
    audited operating base is available in the reviewed material.
sections:
  - id: recommendation-frame
    title: Recommendation and decision frame
    body: >-
      The recommendation is research-more, with high risk and no supportable
      current entry range. Forge reports limited market activity and no
      available Forge Price, while the reviewed valuation sources point to
      different historical marks rather than a current clearing price. That
      distinction matters: a financing valuation, a common-stock 409A mark, and
      a non-binding acquisition indication apply to different securities and
      circumstances. The company has demonstrated fundraising capacity and a
      monetizable payments model, but the public record does not establish
      current revenue quality, profitability, fully diluted ownership, or
      preference seniority. A decision should therefore remain conditional on
      primary financial and cap-table diligence rather than on the former
      unicorn headline.
    claimRefs: [CV001, CV002, CV005, CV007, CV011, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-and-reset
    title: Financing context and valuation reset
    body: >-
      The financing history establishes both demand and substantial repricing.
      TechCrunch reported a $13.8 million Series A in 2020, WeeTracker reported
      a $100 million Series C in 2021, and Forge lists a $2.23 billion
      post-money valuation for November 2021. Later third-party records diverge:
      Multiples lists a $1.3 billion mark, while Silicon Valley Investclub lists
      a $1.25 billion December 2022 convertible-note valuation. Forbes then
      reported that Chipper cut its internal common-stock 409A price by 70% in
      April 2023 and raised convertible debt with a much lower conversion
      trigger. These are not interchangeable measures, but together they make
      the direction of valuation risk unmistakable.
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV010, CV013]
    tableRefs: [TV002]
  - id: scenarios-and-comparables
    title: Scenarios and comparable evidence
    body: >-
      A revenue-multiple method would match a payments business better than a
      user-count multiple, but the denominator is not current enough for a
      defensible calculation. Multiples records $75 million of revenue beside
      a $1.3 billion valuation and labels the result 16.7x, while Forbes
      separately reported a broad 2022 revenue range from an unnamed source.
      Multiples also publishes a very wide comparable range, from 0.6x for
      PicPay to 32.0x for Zolve, without establishing like-for-like periods,
      geography, growth, margins, or product mix. The bull, base, and bear cases
      are therefore framed as diligence outcomes, not precise values or
      probability percentages.
    claimRefs: [CV003, CV008, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: exit-and-diligence
    title: Exit readiness and thesis-break tests
    body: >-
      Exit readiness is weak on public evidence. Forge says Chipper has not
      publicly communicated an IPO intention and shows limited market activity;
      Forbes reported that 2023 acquisition discussions broke down amid a
      dispute over financial disclosure and business viability. The thesis
      improves if audited statements confirm durable growth, positive gross
      margin, controlled losses, and adequate liquidity while a fully diluted
      cap table shows manageable preferences. It breaks if current performance
      is materially below the historical revenue reports, if senior claims
      consume plausible exit proceeds, or if user activity and pricing
      deteriorate together. Those tests should be resolved before negotiating
      price or target return.
    claimRefs: [CV001, CV002, CV007, CV008, CV009, CV010, CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Decision item, Assessment, Decision implication]
    rows:
      - [Recommendation, "Research more / track", "Do not endorse an entry price before primary diligence"]
      - [Confidence, Medium, "Historical financing and reset evidence are credible; current performance is not"]
      - [Risk rating, High, "Treat valuation, liquidity, governance, and operating opacity as coupled risks"]
      - [Valuation stance, "Insufficient current evidence", "Require an actionable price and fully diluted capitalization"]
      - [Return framework, "Not supportable publicly", "Model target return only after audited forecasts and exit preferences are verified"]
    notes: >-
      Qualitative investment judgment based only on the reviewed public sources;
      no current audited forecast, cap table, or tradable price was available.
    claimRefs: [CV002, CV005, CV007, CV010, CV015, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Evidence-based argument, What would change the view]
    rows:
      - [Thesis, "Multiple venture rounds demonstrate historical financing access", "Confirm present investor support and undrawn liquidity"]
      - [Thesis, "Payments, interchange, and transaction-fee products provide several monetization paths", "Verify revenue mix, take rate, gross margin, and cohort economics"]
      - [Anti-thesis, "The 2023 409A reset and low debt-conversion trigger indicate severe repricing", "Obtain the latest board-approved valuation and financing terms"]
      - [Anti-thesis, "Public valuation records disagree and do not provide a live clearing price", "Secure a priced primary round or bona fide secondary indications"]
      - [Anti-thesis, "Public reporting describes weaker activity after pricing changes", "Verify monthly active users, retention, and price elasticity by corridor"]
    notes: >-
      Financing events refer to different dates and security types; the table
      does not treat preferred, common, debt-conversion, or acquisition values as equivalent.
    claimRefs: [CV001, CV002, CV004, CV005, CV006, CV009, CV011, CV012, CV013]
  - id: TV003
    title: Bull, base, and bear scenario framework
    columns: [Scenario, Assumptions, Valuation or return logic, Probability signal, Downside or upside trigger]
    rows:
      - [Bull, "Audited growth, positive gross margin, improving engagement, and manageable preferences", "No numeric range supportable until current revenue and margin are verified", "Evidence signal: audited plan outperformance and competitive financing", "Trigger: durable multi-product usage and a credible exit path"]
      - [Base, "Business remains viable but growth and margins require disciplined execution", "Use current net revenue and peer multiples only after normalizing product mix and geography", "Evidence signal: stable cohorts, controlled losses, and adequate runway", "Trigger: miss against liquidity or gross-margin milestones"]
      - [Bear, "Activity weakens, pricing pressure persists, or senior claims dominate exit proceeds", "Underwrite capital impairment rather than the 2021 preferred valuation", "Evidence signal: another material down mark or emergency financing", "Trigger: adverse financing, regulatory constraint, or unresolved disclosure gaps"]
    notes: >-
      Scenarios are qualitative because the reviewed evidence does not provide a
      current audited forecast, fully diluted capitalization, or comparable-company normalization.
    claimRefs: [CV003, CV005, CV006, CV008, CV009, CV014, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Historical scale and financing proof are outweighed by repricing, liquidity limits, and missing current fundamentals.
    data:
      nodes:
        - id: historical-scale
          label: Historical scale evidence
          detail: Early user growth and transaction volume established product demand.
        - id: funding-proof
          label: Funding proof
          detail: Seed through Series C rounds demonstrated historical investor access.
        - id: valuation-reset
          label: Valuation reset
          detail: Later financing and the 2023 409A cut materially reduced the reference marks.
        - id: liquidity-limit
          label: No live price
          detail: Forge reports limited activity and no available Forge Price.
        - id: evidence-gap
          label: Current fundamentals missing
          detail: Audited revenue, profitability, cap table, and preference data are not public.
        - id: decision
          label: Research more
          detail: Resolve primary diligence before setting entry price or target return.
    approximationNotes: >-
      The flow is a decision sequence, not a quantitative scoring model or a
      statement that each step has equal weight.
    claimRefs: [CV002, CV005, CV010, CV012, CV013, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Price discipline
    body: >-
      Do not anchor to the 2021 preferred valuation. Require current audited
      operating results, fully diluted ownership, security preferences, and a
      bona fide transaction price before underwriting return.
    claimRefs: [CV001, CV004, CV005, CV006, CV016]
  - calloutType: risk
    title: The downside is security-specific
    body: >-
      Preferred-round, common-stock, convertible-debt, and acquisition values
      are not directly comparable; proceeds can differ materially once
      conversion terms and liquidation preferences are applied.
    claimRefs: [CV004, CV005, CV006, CV007]
