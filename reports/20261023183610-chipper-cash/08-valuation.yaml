  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue-quality
      missingEvidence: Current audited revenue, gross margin, operating loss, cash balance, burn, and runway by legal entity.
      whyItMatters: These inputs determine whether any revenue multiple or target return is economically meaningful.
      diligencePath: Obtain audited 2024-2026 statements, monthly management accounts, bank confirmations, and a budget-to-actual bridge.
      relatedQuestionRefs: [QV003]
    - type: private-evidence-only
      severity: material
      topic: financing
      missingEvidence: Fully diluted capitalization, liquidation preferences, conversion terms, senior debt, warrants, and employee-option dilution.
      whyItMatters: Headline enterprise or post-money values do not determine proceeds available to a new security.
      diligencePath: Review the current cap table, charter, financing documents, debt agreements, side letters, and a proceeds waterfall.
      relatedQuestionRefs: [QV005]
    - type: missing-source
      severity: material
      topic: liquidity
      missingEvidence: Bona fide current primary or secondary bids with security class, size, rights, and settlement terms.
      whyItMatters: Historical financing marks and non-binding indications cannot establish an executable entry price.
      diligencePath: Request recent signed term sheets and completed secondary trades, then reconcile each security to the cap table.
      relatedQuestionRefs: [QV002, QV008]
