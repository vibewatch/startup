evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: current-financials
    missingEvidence: Current audited income statement, balance sheet, cash-flow statement, debt schedule, and capitalisation table.
    whyItMatters: >-
      Historic funding and reported revenue cannot establish present liquidity, solvency, profitability, or ownership
      economics.
    diligencePath: >-
      Request management accounts, bank and debt confirmations, latest 409A or financing terms, and a reconciled cap
      table under NDA.
    relatedQuestionRefs:
      - QO003
      - QO004
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: A current executive, board, and regulated-entity leadership roster with dates and responsibilities.
    whyItMatters: >-
      The available 2023 governance account may be stale and cannot fully test key-person dependence or oversight
      capacity.
    diligencePath: Obtain the current board minutes, committee structure, executive roster, and country-level compliance ownership.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: >-
      A consistent current definition and time series for registered users, monthly active users, paying customers, TPV,
      and revenue.
    whyItMatters: >-
      Five-million-plus registered users and approximately one million monthly active users describe different
      populations and cannot be substituted.
    diligencePath: >-
      Request cohort, activity, retention, monetization, and product-level revenue schedules for the latest twelve
      months.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: access-blocked
    severity: minor
    topic: regulation
    missingEvidence: Current regulator and licensing records for every country in which Chipper Cash or its partners operate.
    whyItMatters: Payment operations depend on permissions and counterparties that may vary by country and product.
    diligencePath: >-
      Collect current licenses, registrations, safeguarding arrangements, and material regulatory correspondence by
      market.
    relatedQuestionRefs:
      - QO005
      - QO008
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A current corridor-level dataset separating total remittance flows, digital payment volume, enabled geographies,
      addressable payer groups, and Chipper's eligible corridors.
    whyItMatters: Historical company scale and broad remittance context cannot establish a comparable current TAM, SAM, or SOM.
    diligencePath: >-
      Request Chipper's corridor-level volume and revenue, then reconcile eligible corridors with current central-bank,
      regulator, and remittance datasets.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: segment-economics
    missingEvidence: >-
      Current active users, retention, payment volume, take rate, gross margin, loss rates, and compliance cost by
      corridor, payer, and product.
    whyItMatters: >-
      Registered users and historical volume do not show whether adoption is durable or whether growth produces positive
      contribution margin.
    diligencePath: >-
      Obtain monthly cohort and corridor economics under NDA, including explicit active-user definitions and merchant
      retention.
    relatedQuestionRefs:
      - QM008
      - QM009
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: blocking
    topic: competitor-scale
    missingEvidence: >-
      Current corridor-level transaction volumes, active users, market shares, win rates, and retention for Chipper Cash
      and its direct peers.
    whyItMatters: >-
      Historical company scale and unranked competitor lists do not establish current relative position or moat
      durability.
    diligencePath: Request 2025-2026 corridor volume, active-user, retention, and competitor win-loss data by country and product.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Current business rate cards, realized FX spreads, volume discounts, support tiers, and integration charges across
      comparable providers.
    whyItMatters: Historical or partial public prices do not establish customer-level total cost or sustainable unit economics.
    diligencePath: Obtain signed sample quotes and realized pricing by corridor, customer segment, payment method, and volume band.
    relatedQuestionRefs:
      - QP003
      - QP007
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: support-reliability
    missingEvidence: Public SLA, uptime history, incident log, and independently verified support-resolution metrics.
    whyItMatters: Operational reliability and exception handling are central switching and retention criteria for payment products.
    diligencePath: Request SLA terms, twelve-month incident history, support response distributions, and reference calls.
    relatedQuestionRefs:
      - QP004
      - QP007
      - QP008
    relatedTableRefs:
      - TP002
      - TP003
  - type: stale
    severity: material
    topic: geographic-coverage
    missingEvidence: Current licensed and live country-by-country product availability for Chipper Cash and named direct peers.
    whyItMatters: Assigned sources use different dates and scopes, and country gating can materially change competitive reach.
    diligencePath: Verify every corridor, product, license, settlement route, and partner dependency as of the underwriting date.
    relatedQuestionRefs:
      - QP007
      - QP009
    relatedTableRefs:
      - TP002
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, restricted balances, monthly burn, debt and settlement obligations, and a reconciled base/downside
      runway.
    whyItMatters: >-
      Historical funding and a former-employee runway estimate cannot establish present liquidity or the next financing
      trigger.
    diligencePath: >-
      Obtain bank statements, management accounts, debt agreements, settlement schedules, and a board-approved runway
      model.
    relatedQuestionRefs:
      - QI006
      - QI009
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Cohort retention, CAC, payback, realized take rates, gross margin, and contribution margin by product and
      corridor.
    whyItMatters: Positive aggregate cash flow does not show whether customer and transaction economics are repeatable.
    diligencePath: >-
      Request cohort and corridor files reconciled to audited revenue, direct costs, partner fees, fraud losses, and
      support costs.
    relatedQuestionRefs:
      - QI004
      - QI008
      - QI009
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: revenue-comparability
    missingEvidence: >-
      A reconciliation of public revenue figures to audited periods, definitions, exclusions, and revenue-recognition
      policy.
    whyItMatters: Run-rate, LTM, annual revenue, payment volume, and ARR are not interchangeable underwriting measures.
    diligencePath: Reconcile each public metric to audited statements and management's monthly revenue bridge.
    relatedQuestionRefs:
      - QI007
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: >-
      Current corridor-level delivery, approval, failure, reversal, uptime, and incident metrics by payment rail and
      geography.
    whyItMatters: >-
      Broad product coverage does not establish that a target corridor will meet customer, treasury, or regulatory
      service requirements.
    diligencePath: >-
      Request twelve months of corridor-level operational dashboards, SLOs, incident reports, failed-transfer reason
      codes, and referenceable customer outcomes.
    relatedQuestionRefs:
      - QE007
      - QE008
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Independent security assessment, certification scope, data-residency documentation, fraud-loss metrics, and
      model-governance artifacts.
    whyItMatters: >-
      Risk automation descriptions are not equivalent to tested security or control effectiveness for a regulated
      payments platform.
    diligencePath: >-
