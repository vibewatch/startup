company:
  name: Chipper Cash
chapter:
  number: 4
  title: Financials
  summary: Chipper Cash appears to use low-cost consumer transfers to feed merchant payments, cards, and investment products, while late-2025 positive free cash flow suggests materially better discipline. Current revenue quality, margins, cash, burn, debt, and cohort economics remain too thinly disclosed for underwriting.
sections:
  - id: revenue-model
    title: Revenue model and go-to-market
    body: >-
      The public record supports a transaction-led model rather than contracted recurring
      revenue. TechCrunch reported that Chipper Checkout was a fee-based merchant product
      designed to support the free consumer mobile-money service. ProductMint separately
      described stock and cryptocurrency transaction fees, card interchange, and business
      payment fees. This implies a consumer-led acquisition motion: inexpensive transfers
      build activity, then fee-bearing merchant, card, and investment products monetize
      selected usage. That architecture can create cross-sell leverage, but no assigned
      source provides a current audited revenue mix, product conversion rate, or realized
      take rate. Gross transaction volume therefore cannot be treated as revenue, and
      indicative fees cannot be treated as realized pricing.
    claimRefs: [CI001, CI002, CI003, CI004, CI016]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-traction
    title: Pricing, traction, and metric comparability
    body: >-
      Historical scale is visible but not directly comparable across periods. In June 2020,
      TechCrunch reported more than 1.5 million users and more than $100 million of monthly
      payment volume. Those measures describe adoption and payment throughput, not current
      active users, revenue, or margin. ProductMint later described one-percent fees for
      investment transactions and business collections, but those third-party rates are not
      an official current rate card. Revenue aggregators also conflict in framing: one lists
      $75 million alongside a January 2022 financing and warns that such figures may be
      run-rate or LTM, while another lists $52.9 million for 2024 yet says it lacks a public
      source for current revenue or profitability. These observations require reconciliation,
      not interpolation.
    claimRefs: [CI003, CI004, CI005, CI006, CI013, CI014, CI015]
    tableRefs: [TI002, TI003]
  - id: cost-and-capital
    title: Cost structure and capital adequacy
    body: >-
      TechCabal reported that quarterly free cash flow edged above zero in the final quarter
      of 2025 after restructuring, with Nigeria, Uganda, and demand for US-dollar virtual
      cards identified as leading revenue drivers. That is encouraging but remains a
      management-reported milestone without disclosed figures. Two former employees told
      TechCabal the company was profitable and had about 24 months of runway, while the
      company did not respond and provided no cash-flow bridge. Tracxn records $305 million
      raised across six rounds, including a $150 million Series C in November 2021, but
      historical funding is not current cash available. No assigned source discloses cash,
      monthly burn, restricted balances, debt obligations, working-capital needs, capex, or
      a downside runway.
    claimRefs: [CI007, CI008, CI009, CI010, CI011, CI012, CI016]
  - id: financial-verdict
    title: Financial verdict and diligence blockers
    body: >-
      The evidence supports a plausible transition from growth-funded expansion toward a
      more disciplined payments business, but it does not establish durable accounting
      profitability or attractive unit economics. Positive free cash flow can result from
      operating improvement, working-capital timing, or temporary cost suppression; the
      assigned sources do not separate those effects. Revenue quality also depends on
      corridor mix, foreign-exchange exposure, partner shares, card losses, compliance
      expense, and product engagement, none of which is quantified. Underwriting should
      remain conditional on audited financials, monthly cash and burn, debt and settlement
      obligations, corridor-level gross-to-net revenue, contribution margins by product,
      customer cohorts, CAC and payback, and a reconciliation of every publicly reported
      revenue figure.
    claimRefs: [CI007, CI008, CI009, CI013, CI014, CI015, CI016]
