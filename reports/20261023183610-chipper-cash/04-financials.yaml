      - [Quarterly free cash flow, "Above zero in Q4 2025, without figures", Medium, "Possible break-even milestone", "Cash-flow bridge and working-capital normalization"]
      - [Runway, "About 24 months reported by two former employees", Low, "Directional liquidity signal only", "Cash, burn, debt, restricted balances, and downside case"]
      - [Current revenue and gross margin, null, Low, "Core revenue-quality and scalability inputs", "Audited revenue recognition and product/corridor contribution margin"]
    notes: "Periods and denominators are preserved; null means the assigned sources did not disclose a supportable current value."
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI013, CI014, CI016]
