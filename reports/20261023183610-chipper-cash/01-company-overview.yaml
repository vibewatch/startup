company:
  name: Chipper Cash
chapter:
  number: 1
  title: Company Overview
  summary: Chipper Cash is a San Francisco-based fintech founded in 2018 by Ham Serunjogi and Maijid Moujaled to provide cross-border and local payments, with adjacent cards, investing, bill pay, and business payment products. Public evidence shows substantial historic funding and customer reach, but current operating scale, profitability, governance depth, and valuation remain only partly disclosed and sometimes inconsistent across sources.
sections:
  - id: identity-and-business
    title: Identity, product scope, and business model
    body: >-
      Chipper Cash was founded in 2018 and is headquartered in San Francisco. Its core proposition is cross-border and local money movement for African consumers and businesses, extended through cards, stock investing, airtime and data, bill pay, and business payment tooling. The company website describes transfers to bank and mobile-money accounts in 21+ African countries, while earlier reporting described a seven-country footprint at the time of its 2020 Series A. That difference is a useful reminder that geographic coverage is time-sensitive and should not be treated as a fixed operating footprint. The product architecture also matters commercially: low-cost transfers can acquire users, while cards, investment transactions, and business payment services provide potential monetization surfaces. Third-party descriptions attribute revenue to transaction, commission, service, interchange, stock/crypto, and payment fees, but current audited revenue and unit economics are not publicly established in this evidence set.
    claimRefs: [CO001, CO002, CO003, CO005]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Founders, leadership, and governance
    body: >-
      Ham Serunjogi and Maijid Moujaled are consistently identified as co-founders, with Serunjogi serving as CEO and Moujaled as President in the strongest available company-profile evidence. TechCrunch reports that the founders met at Grinnell College and that Serunjogi had worked at Facebook while Moujaled worked at Yahoo, Flickr, and Imgur before founding the company. A later third-party profile lists Patrick Triest as CTO and identifies Marc Gottschalk as Chief Legal Officer, but the available material does not independently document the full current executive team or board. Forbes Africa reported that the voting board had only three members in 2023: Serunjogi, Moujaled, and Deciens founder Dan Kimerling. That concentrated structure may support speed, but it also creates key-person and governance-depth diligence questions, especially after the reported layoffs, strategy reset, and restricted disclosure around cash and operating metrics.
    claimRefs: [CO006, CO007, CO008, CO009]
    tableRefs: [TO002]
  - id: financing-and-scale
    title: Financing, valuation, and operating scale
    body: >-
      Chipper Cash raised a $13.8 million Series A in June 2020, according to TechCrunch, after earlier seed financing. Later profiles summarize a $100 million Series C in May 2021 and a $150 million extension in November 2021, with reported 2021 valuation references around $2 billion. A compiled profile records a $35 million convertible note at a $1.25 billion post-money valuation in December 2022 and $3.98 million of debt in April 2023, but it is a secondary compilation rather than a filing. Forbes Africa reported more than $75 million of 2021 revenue, versus $18 million in 2020, and a person familiar with the finances estimated $100–150 million in 2022; these are not audited statements in the cited text. Scale indicators are similarly mixed: sources describe more than five million registered customers, while Forbes reported approximately one million monthly active users in 2022. Current revenue, cash balance, headcount, active customers, and valuation therefore remain gaps rather than safe cover metrics.
    claimRefs: [CO010, CO013, CO014, CO015]
    tableRefs: [TO003]
  - id: milestones-and-risks
    title: Milestones, adverse signals, and open diligence
    body: >-
      The company’s trajectory combines rapid product and geographic expansion with a material 2022–2023 retrenchment. It launched its first version in 2018, expanded across African markets, added business payments, entered the United Kingdom and United States, and added stock and crypto functionality according to third-party reporting. Forbes Africa then described multiple layoff rounds, a reduction of nearly 175 employees, a halt to planned Europe and Middle East expansion, and a 70% reduction in its internal 409A valuation in April 2023. The same report described a failed potential acquisition discussion with Zepz and disagreement over the information exchanged, so the account should be treated as reported and contested rather than settled fact. The website currently presents a broader 21+ country transfer claim and more than five million users, but the evidence does not establish current monthly activity, profitability, regulatory permissions in every market, or a current audited balance sheet. Those gaps are material to any assessment of resilience and governance.
    claimRefs: [CO016, CO017, CO018, CO019]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Broad product surface
    body: Chipper Cash combines cross-border payments with cards, investing, bill pay, and business payment products, creating multiple potential monetization paths around a payments-led customer relationship.
    claimRefs: [CO002, CO003, CO005]
  - calloutType: risk
    title: Scale and disclosure mismatch
    body: Public sources cite five million-plus registered customers but also approximately one million monthly active users in 2022, while current revenue, cash, and profitability remain undisclosed in the retained evidence.
    claimRefs: [CO014, CO015, CO019]
  - calloutType: assumption
    title: Historic financing is not current liquidity
    body: Reported funding totals and past valuations establish financing history, not cash available today; a current balance sheet and debt terms remain necessary diligence.
    claimRefs: [CO010, CO013]
