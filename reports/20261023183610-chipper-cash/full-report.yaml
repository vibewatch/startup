  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Chipper Cash combines mobile financial products, service-based application infrastructure, data and risk
      automation, and partner-dependent payment rails.
    data:
      layers:
        - label: Customer products
          detail: Mobile and financial products exposed to consumers.
          items:
            - label: Consumer wallet and P2P
              detail: Mobile money movement and cross-border transfers.
            - label: Cards and investments
              detail: Chipper USD Card plus stock and cryptocurrency features described in public product profiles.
        - label: Business workflows
          detail: Collections, disbursements, and merchant payment interfaces.
          items:
            - label: Collections and disbursements
              detail: Business APIs for bank-account and mobile-wallet payouts.
            - label: Merchant and Network API
              detail: Business collection, supplier-payment, and refund workflows.
        - label: Application platform
          detail: Mobile clients and service-based application infrastructure.
          items:
            - label: Mobile clients
              detail: React Native Android/iOS with Redux state management.
            - label: Service backend
              detail: Node.js service-based architecture, PostgreSQL, and RabbitMQ.
        - label: Data and controls
          detail: Analytics, monitoring, screening, and compliance automation.
          items:
            - label: Analytics plane
              detail: Snowflake warehousing, Python analysis, and SQL/data models.
            - label: Risk automation
              detail: Screening, authentication, transaction monitoring, and internal compliance tooling.
        - label: External rails and partners
          detail: Card, bank, wallet, issuer, and country-specific dependencies.
          items:
            - label: Card and payment partners
              detail: Bridge and Stripe infrastructure with Lead Bank identified as issuer in the partner disclosure.
            - label: Local rails
              detail: Bank accounts, mobile wallets, currencies, and country-specific regulatory dependencies.
        - label: Reliability and support
          detail: Deployment, monitoring, incident response, and operational ownership.
          items:
            - label: Delivery controls
              detail: CI/CD, unit testing, monitoring, and service-support workflows.
    claimRefs:
      - CE002
      - CE003
      - CE005
      - CE006
      - CE007
      - CE008
  - id: FU001
    title: Customer journey map
    summary: >-
      Chipper Cash's customer path runs from corridor need and wallet acquisition through transfer use, adjacent-product
      expansion, and partner-enabled reach, with retention evidence becoming less public after initial adoption.
    type: journey-map
    data:
      items:
        - label: Corridor need
          title: Sender or recipient needs cross-border movement
          touchpoints:
            - African cross-border or peer-to-peer payment need
            - Price and corridor availability shape acquisition
          note: The original problem is described in product and press accounts; customer incidence is not quantified.
        - label: Wallet acquisition
          title: Consumer opens a Chipper account
          touchpoints:
            - Mobile app
            - No-fee P2P positioning
          note: Reported user counts are not a verified active-user denominator.
        - label: Core use
          title: User sends, receives, or pays
          touchpoints:
            - Remittance
            - Bill pay
            - Card or wallet payment
          note: Public sources do not disclose repeat-corridor frequency or transaction-level retention.
        - label: Expansion
          title: Adjacent products and business rails
          touchpoints:
            - Stocks and crypto
            - Checkout and Network API
            - Creator payments
          note: Product availability is documented more clearly than product-level adoption.
        - label: Partner reach
          title: Local and global network distribution
          touchpoints:
            - Western Union global network
            - Zoona Zambia footprint
            - Platform integrations
          note: Partner launches do not establish contract duration, economics, or customer concentration.
        - label: Retention proof
          title: Durable repeat use remains unverified
          touchpoints:
            - Cohort retention request
            - Renewal and concentration review
          note: Public sources do not provide current retention, churn, or renewal schedules.
    approximationNotes: This is an evidence-organized workflow, not a measured conversion funnel; no stage conversion rates are inferred.
    claimRefs:
      - CU001
      - CU003
      - CU010
      - CU011
      - CU013
