      - number: '3.2'
        title: Capability, pricing, and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              The visible differentiation is product breadth in a mobile experience. Reviewed descriptions combine
              cross-border transfers, a virtual Visa card, cryptocurrency transactions, fractional stock investing, bill
              payment, airtime, merchant checkout, and a network API. Coverage claims need careful interpretation: Vault
              Compare describes delivery to bank accounts and mobile-money wallets in more than 21 African countries,
              whereas ProductMint's older profile listed user availability in seven African countries plus the United
              Kingdom and United States. Public commercial evidence is also asymmetric. Chipper business pricing remains
              quote-based, while the RFP comparison publishes specific Bank of America Merchant Services entry rates;
              ProductMint's 2022 fee descriptions are historical, not a current price card. Buyers therefore need
              corridor, foreign-exchange, support, integration, and partner-cost assumptions before comparing total
              cost.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
