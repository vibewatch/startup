  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and go-to-market
        blocks:
          - type: paragraph
            body: >-
              The public record supports a transaction-led model rather than contracted recurring revenue. TechCrunch
              reported that Chipper Checkout was a fee-based merchant product designed to support the free consumer
              mobile-money service. ProductMint separately described stock and cryptocurrency transaction fees, card
              interchange, and business payment fees. This implies a consumer-led acquisition motion: inexpensive
              transfers build activity, then fee-bearing merchant, card, and investment products monetize selected
              usage. That architecture can create cross-sell leverage, but no assigned source provides a current audited
              revenue mix, product conversion rate, or realized take rate. Gross transaction volume therefore cannot be
              treated as revenue, and indicative fees cannot be treated as realized pricing.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI016
          - type: table
            tableRef: TI001
            claimRefs:
