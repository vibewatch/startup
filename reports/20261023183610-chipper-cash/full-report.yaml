              - CP008
              - CP009
              - CP012
              - CP016
      - number: '3.3'
        title: Switching friction, moat durability, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Chipper's defensibility appears to rest on corridor liquidity, compliance execution, distribution
              partnerships, and cross-product convenience rather than on an exclusive feature. Historical scale was
              meaningful: TechCrunch reported more than 1.5 million users and more than $100 million in monthly volume
              in June 2020. The adverse evidence limits extrapolation. Forbes Africa later reported that monthly active
              users were about one million against more than five million registered users after a 2022 usage decline. A
              hosted interview with a former executive says the company subsequently narrowed its focus to selected
              corridors and products. Product gating, incomplete business pricing, and absent public service-level
              commitments make multi-homing with specialists plausible. Durability therefore requires current cohort
              retention, corridor profitability, win-loss, and partner-dependency evidence that is not public.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP012
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth can consolidate financial workflows
            body: >-
              The assigned evidence consistently presents Chipper Cash as a bundled consumer and business platform,
              which can reduce the number of point solutions a user or merchant must assemble.
            calloutType: strength
            claimRefs:
              - CP005
              - CP006
