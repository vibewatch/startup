  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Evidence-based argument
      - What would change the view
    rows:
      - - Thesis
        - Multiple venture rounds demonstrate historical financing access
        - Confirm present investor support and undrawn liquidity
      - - Thesis
        - Payments, interchange, and transaction-fee products provide several monetization paths
        - Verify revenue mix, take rate, gross margin, and cohort economics
      - - Anti-thesis
        - The 2023 409A reset and low debt-conversion trigger indicate severe repricing
        - Obtain the latest board-approved valuation and financing terms
      - - Anti-thesis
        - Public valuation records disagree and do not provide a live clearing price
        - Secure a priced primary round or bona fide secondary indications
      - - Anti-thesis
        - Public reporting describes weaker activity after pricing changes
        - Verify monthly active users, retention, and price elasticity by corridor
    notes: >-
      Financing events refer to different dates and security types; the table does not treat preferred, common,
      debt-conversion, or acquisition values as equivalent.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV006
      - CV009
      - CV011
      - CV012
      - CV013
  - id: TV003
    title: Bull, base, and bear scenario framework
    columns:
      - Scenario
      - Assumptions
      - Valuation or return logic
      - Probability signal
      - Downside or upside trigger
    rows:
      - - Bull
        - Audited growth, positive gross margin, improving engagement, and manageable preferences
        - No numeric range supportable until current revenue and margin are verified
        - 'Evidence signal: audited plan outperformance and competitive financing'
        - 'Trigger: durable multi-product usage and a credible exit path'
      - - Base
        - Business remains viable but growth and margins require disciplined execution
        - Use current net revenue and peer multiples only after normalizing product mix and geography
        - 'Evidence signal: stable cohorts, controlled losses, and adequate runway'
        - 'Trigger: miss against liquidity or gross-margin milestones'
      - - Bear
        - Activity weakens, pricing pressure persists, or senior claims dominate exit proceeds
        - Underwrite capital impairment rather than the 2021 preferred valuation
        - 'Evidence signal: another material down mark or emergency financing'
        - 'Trigger: adverse financing, regulatory constraint, or unresolved disclosure gaps'
    notes: >-
      Scenarios are qualitative because the reviewed evidence does not provide a current audited forecast, fully diluted
      capitalization, or comparable-company normalization.
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV008
