  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Historical scale and financing proof are outweighed by repricing, liquidity limits, and missing current
      fundamentals.
    data:
      nodes:
        - id: historical-scale
          label: Historical scale evidence
          detail: Early user growth and transaction volume established product demand.
        - id: funding-proof
          label: Funding proof
          detail: Seed through Series C rounds demonstrated historical investor access.
        - id: valuation-reset
          label: Valuation reset
          detail: Later financing and the 2023 409A cut materially reduced the reference marks.
        - id: liquidity-limit
          label: No live price
          detail: Forge reports limited activity and no available Forge Price.
        - id: evidence-gap
          label: Current fundamentals missing
          detail: Audited revenue, profitability, cap table, and preference data are not public.
        - id: decision
          label: Research more
          detail: Resolve primary diligence before setting entry price or target return.
    approximationNotes: The flow is a decision sequence, not a quantitative scoring model or a statement that each step has equal weight.
    claimRefs:
      - CV002
      - CV005
      - CV010
      - CV012
      - CV013
      - CV015
      - CV016
