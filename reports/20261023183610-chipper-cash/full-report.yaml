              - CI008
              - CI009
              - CI013
              - CI014
              - CI016
      - number: '4.3'
        title: Cost structure and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              TechCabal reported that quarterly free cash flow edged above zero in the final quarter of 2025 after
              restructuring, with Nigeria, Uganda, and demand for US-dollar virtual cards identified as leading revenue
              drivers. That is encouraging but remains a management-reported milestone without disclosed figures. Two
              former employees told TechCabal the company was profitable and had about 24 months of runway, while the
              company did not respond and provided no cash-flow bridge. Tracxn records $305 million raised across six
              rounds, including a $150 million Series C in November 2021, but historical funding is not current cash
              available. No assigned source discloses cash, monthly burn, restricted balances, debt obligations,
              working-capital needs, capex, or a downside runway.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI016
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a plausible transition from growth-funded expansion toward a more disciplined
              payments business, but it does not establish durable accounting profitability or attractive unit
              economics. Positive free cash flow can result from operating improvement, working-capital timing, or
              temporary cost suppression; the assigned sources do not separate those effects. Revenue quality also
              depends on corridor mix, foreign-exchange exposure, partner shares, card losses, compliance expense, and
              product engagement, none of which is quantified. Underwriting should remain conditional on audited
              financials, monthly cash and burn, debt and settlement obligations, corridor-level gross-to-net revenue,
              contribution margins by product, customer cohorts, CAC and payback, and a reconciliation of every publicly
              reported revenue figure.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI013
              - CI014
              - CI015
              - CI016
