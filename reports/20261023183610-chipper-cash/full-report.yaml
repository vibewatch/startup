        title: Pricing, traction, and metric comparability
        blocks:
          - type: paragraph
            body: >-
              Historical scale is visible but not directly comparable across periods. In June 2020, TechCrunch reported
              more than 1.5 million users and more than $100 million of monthly payment volume. Those measures describe
              adoption and payment throughput, not current active users, revenue, or margin. ProductMint later described
              one-percent fees for investment transactions and business collections, but those third-party rates are not
              an official current rate card. Revenue aggregators also conflict in framing: one lists $75 million
              alongside a January 2022 financing and warns that such figures may be run-rate or LTM, while another lists
              $52.9 million for 2024 yet says it lacks a public source for current revenue or profitability. These
              observations require reconciliation, not interpolation.
