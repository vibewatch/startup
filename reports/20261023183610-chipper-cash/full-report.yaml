              - CM011
              - CM012
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Consumer senders and recipients are the core users, with the sender typically bearing transfer and
              foreign-exchange economics. Merchant and platform buyers have a different workflow: finance, operations,
              or product teams procure payment acceptance, collection, payout, refund, and reconciliation capability.
              Chipper’s described model uses low-cost transfers to acquire users and then monetizes adjacent products,
              making repeat use and cross-sell more important than registrations alone. Adoption should be strongest
              where an enabled corridor reduces cost or waiting time, or where one integration replaces several local
              payment arrangements. The same logic makes corridor coverage, local methods, liquidity, support, and
              regulatory authorization prerequisites; broad brand awareness cannot substitute for a working route
              between a specific payer and recipient.
            claimRefs:
              - CM001
              - CM003
              - CM009
              - CM010
              - CM011
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Constraints and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Public evidence makes the opportunity execution-sensitive. Forbes Africa reported that price increases
              accompanied a usage dip, and that market entry required country-specific legal work, lawyers, consultants,
              and sometimes local staffing. This limits the speed at which a headline geographic market becomes
              serviceable. A comparison site describes business pricing as only partially public and otherwise
              quote-based, reducing buyers’ ability to compare all-in corridor costs. A low-reputation SlideShare page
              marketing “fully active” Chipper accounts is not demand evidence, but it is a concrete signal that account
              resale and identity abuse belong in trust diligence. Valuation should therefore depend on current active
              cohorts, corridor contribution margin, price elasticity, licensing coverage, loss rates, and merchant
              retention—not historical registrations, transaction volume, funding, or a broad continental market label.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwrite corridors, not a continental headline
            body: >-
              The evidence supports a portfolio of specific consumer and merchant payment corridors; it does not support
              treating all African fintech spend as Chipper's addressable market.
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM013
          - type: callout
            title: Registrations overstate demonstrated engagement
            body: >-
              The Forbes Africa snapshot paired more than five million registered users with about one million monthly
              active users, leaving retention and monetization by cohort as material diligence questions.
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM008
          - type: callout
            title: Rebuild sizing from private operating data
            body: >-
              Request active users, payment volume, take rate, gross margin, licensing status, and retention by corridor
              and payer before assigning a serviceable-market multiple.
            calloutType: recommendation
            claimRefs:
              - CM005
              - CM008
              - CM009
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Chipper Cash faces a layered competitive set because customers can solve each job separately. TechCrunch
              identified Paga as a local-payments competitor in Nigeria and described OPay and PalmPay as entrants
              seeking to scale from West Africa. A company database also tracks remittance and payments specialists such
              as Zepz, LemFi, Paysend, Taptap Send, Sendwave, Onafriq, and Flutterwave, while SoftwareSuggest surfaces
              crypto and trading products as adjacent alternatives. Those lists are useful for discovery, not
              market-share rankings or independent performance benchmarks. Bank-led processors, mobile-money incumbents,
              and internal integrations are additional substitutes for merchant or local-transfer workflows. The
              evidence therefore supports segmentation by corridor and job-to-be-done, while leaving current share and
              competitor economics unresolved.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
