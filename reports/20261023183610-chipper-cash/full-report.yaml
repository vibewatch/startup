  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflows
        blocks:
          - type: paragraph
            body: >-
              Chipper Cash’s product is best understood as a multi-rail payments platform rather than a single
              remittance feature. Public descriptions place consumer money movement, cross-border collections and
              disbursements, cards, stock and cryptocurrency investing, airtime and bill pay, and business payment APIs
              in the same product family. The customer workflow begins in a mobile application, where a consumer funds
              or receives value and then transfers, pays, or spends through a card; the business workflow uses APIs to
              collect payments, pay suppliers, or issue refunds. Bridge’s partner account describes the Chipper USD Card
              as a Visa-acceptance product launched in Nigeria in 2021 and says the integration supports programmatic
              card issuance, management, transaction processing, and funding. That gives the product a concrete
              expansion path, but it also makes partner availability, licensing, settlement, and corridor operations
              part of the customer experience rather than merely back-office concerns.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE006
              - CE013
      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The strongest public technical description comes from a historical Chipper engineering job listing, so it
              should be treated as an engineering surface rather than a complete audited architecture diagram. It names
              full-stack TypeScript, React Native mobile clients, Node.js service-based backend architecture, PostgreSQL
              application databases, RabbitMQ for inter-server communication, Heroku and Google Cloud hosting, Datadog
              and Logz.io monitoring, Snowflake warehousing, Python analytics, and automated CI/CD with unit testing. A
              second risk-engineering listing describes Python and TypeScript/Node.js services, SQL data models and
              transformations, internal compliance tooling, transaction monitoring, screening, authentication, and
              AI-assisted review workflows. This implies a distributed application and data plane with multiple
              operational dependencies. The partner card integration adds another dependency boundary: Bridge and Stripe
              support card issuance and cross-border payment orchestration, while Lead Bank is identified as the issuer
              in the partner disclosure. The stack is credible as an operating model, but public evidence does not
              establish service-level objectives, failover design, data-residency controls, or partner-outage behavior.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
