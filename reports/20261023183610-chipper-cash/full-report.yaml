  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable boundary is narrower than “African fintech.” Chipper’s core market is consumer cross-border
              and local person-to-person money movement, especially intra-African corridors, while merchant checkout and
              a network API extend the same rails into business payments. Cards, investing, airtime, and bill pay are
              adjacencies rather than part of a remittance-only market total. Banks, payment processors, mobile-money
              systems such as M-Pesa, cash, and specialist remittance providers remain status-quo substitutes. This
              boundary avoids counting unrelated lending, insurance, deposits, or general enterprise software as
              addressable spend. It also separates consumer transfer economics from merchant acceptance economics, whose
              payer, take rate, compliance burden, and sales motion differ materially.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM011
      - number: '2.2'
        title: Sizing without false precision
        blocks:
          - type: paragraph
            body: >-
              The assigned sources do not provide a current corridor-level market dataset, so a defensible TAM/SAM/SOM
              cannot be calculated. Historical scale proxies still establish demand: TechCrunch reported seven operating
              countries in 2020, while Chipper’s chief executive said the company had more than 1.5 million users and
              over $100 million of monthly volume. Forbes Africa later reported more than five million registered users
              but about one million monthly active users, implying an active-to-registered ratio no higher than
              approximately 20% for that reported snapshot. ProductMint’s $41 billion 2017 remittance context and a
              Chipper executive’s comments on high Sub-Saharan African corridor costs are directional only. None is
              current market revenue, ARR, cash available, or a comparable serviceable-market denominator.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM012
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
