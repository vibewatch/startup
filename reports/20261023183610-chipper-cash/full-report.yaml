  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Consumer payment activity can feed several fee-bearing products, but public evidence does not quantify conversion
      or contribution margins.
    data:
      nodes:
        - id: transfers
          label: Consumer transfers
          detail: Low-cost or fee-free activity builds engagement.
        - id: engaged-pool
          label: Engagement pool
          detail: Current active and retained cohorts are unavailable.
        - id: checkout
          label: Checkout and business payments
          detail: Merchant transaction fees are a reported revenue mechanism.
        - id: cards
          label: Card spend
          detail: Interchange is shared with card and issuing partners.
        - id: investing
          label: Investment activity
          detail: Third-party sources describe transaction fees.
        - id: net-revenue
          label: Net revenue
          detail: Product mix and realized take rates are unavailable.
        - id: cash-flow
          label: Free cash flow
          detail: Reported above zero in Q4 2025 without a monetary bridge.
