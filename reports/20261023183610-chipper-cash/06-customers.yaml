      - [Registered users, "5M", "2022-23 reporting", "Forbes Africa", "medium", "Broad installed base persisted", "Current active, transacting, and retained cohorts"]
      - [Monthly active users, "About 1M", "2022", "Forbes Africa", "medium", "Usage was materially below registered reach", "Exact measurement window and cohort definition"]
      - [Reported revenue, "More than $75M", "2021", "Forbes Africa", "medium", "Scale reached a meaningful commercial level", "Audited basis, segment mix, and current run rate"]
    notes: "The table preserves source periods and definitions; values should not be combined into a single growth rate because user, active-user, volume, and revenue denominators differ."
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or partner, Segment, Deployment/use case, Production vs pilot, Outcome or signal, Limitation, Supporting sources]
    rows:
      - [Twitter, Platform partner, Chipper Cash payments link integrated into Tip Jar for African creators, "Live integration reported", "Adds a named creator-payments distribution surface", "No usage, revenue, renewal, or geography-wide outcome disclosed", "U001; U004"]
      - [Western Union, Remittance/network partner, International transfers in the Chipper Cash app for Zambia, "Launched service", "Users can send and receive globally through Western Union network; wallet and cash-pickup options described", "Launch announcement does not disclose volume, economics, or customer retention", "U009; U001"]
      - [Zoona, Local payments partner, Zambia wallet and local payments integration after acquisition, "Operating partnership described", "Combines local payments knowledge with Chipper mobile technology", "No independent outcome, contract term, or active-user split disclosed", "U009; U005"]
    enumerationScope:
      coverage: sample
      basis: "Sample of publicly named platform, remittance, and local-payments relationships found in the assigned 2020-2026 source pool; it is not a complete customer register."
    notes: "Named relationships are evidence of deployment or partnership, not proof of paid revenue, retention, or customer satisfaction; syndicated coverage is not treated as independent corroboration."
    claimRefs: [CU010, CU011, CU012]
figures:
  - id: FU001
    title: Customer journey map
    summary: Chipper Cash's customer path runs from corridor need and wallet acquisition through transfer use, adjacent-product expansion, and partner-enabled reach, with retention evidence becoming less public after initial adoption.
    type: journey-map
    data:
      items:
        - label: Corridor need
          title: Sender or recipient needs cross-border movement
          touchpoints: ["African cross-border or peer-to-peer payment need", "Price and corridor availability shape acquisition"]
          note: "The original problem is described in product and press accounts; customer incidence is not quantified."
        - label: Wallet acquisition
          title: Consumer opens a Chipper account
          touchpoints: ["Mobile app", "No-fee P2P positioning"]
          note: "Reported user counts are not a verified active-user denominator."
        - label: Core use
          title: User sends, receives, or pays
          touchpoints: ["Remittance", "Bill pay", "Card or wallet payment"]
          note: "Public sources do not disclose repeat-corridor frequency or transaction-level retention."
        - label: Expansion
          title: Adjacent products and business rails
          touchpoints: ["Stocks and crypto", "Checkout and Network API", "Creator payments"]
          note: "Product availability is documented more clearly than product-level adoption."
        - label: Partner reach
          title: Local and global network distribution
          touchpoints: ["Western Union global network", "Zoona Zambia footprint", "Platform integrations"]
          note: "Partner launches do not establish contract duration, economics, or customer concentration."
        - label: Retention proof
          title: Durable repeat use remains unverified
          touchpoints: ["Cohort retention request", "Renewal and concentration review"]
          note: "Public sources do not provide current retention, churn, or renewal schedules."
    approximationNotes: "This is an evidence-organized workflow, not a measured conversion funnel; no stage conversion rates are inferred."
    claimRefs: [CU001, CU003, CU010, CU011, CU013]
callouts:
  - calloutType: strength
    title: Broad corridor reach
    body: Chipper Cash has publicly reported multi-country consumer reach and named distribution relationships spanning African corridors, the U.K., the U.S., and Zambia.
    claimRefs: [CU001, CU006, CU010, CU011]
  - calloutType: risk
    title: Registered users are not retention
    body: Public reporting separates five million registered users from about one million monthly active users in 2022, while current cohorts, churn, and repeat-corridor behavior remain undisclosed.
    claimRefs: [CU007, CU008, CU013]
  - calloutType: recommendation
    title: Request cohort and concentration evidence
    body: Before underwriting durability, request active and transacting cohorts, repeat use, segment revenue, top-customer or partner concentration, contract terms, and post-pricing-change unit economics.
    claimRefs: [CU013]
