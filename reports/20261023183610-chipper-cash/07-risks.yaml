    title: Risk heatmap
    type: matrix
    summary: Regulatory permission, financial resilience, service reliability, and control transparency carry the highest residual exposure.
    data:
      columns: [Risk area, Impact, Likelihood, Mitigation maturity, Residual exposure]
      rows:
        - label: "Regulatory permission"
          values: ["High", "Medium", "Partial", "High", "Current permission unverified"]
        - label: "FX and liquidity"
          values: ["High", "Medium-high", "Partial", "High", "Current buffers unverified"]
        - label: "Service and support reliability"
          values: ["High", "Medium", "Partial", "Medium-high", "No public SLA series"]
        - label: "Fraud, custody, and security transparency"
          values: ["High", "Medium", "Low-to-partial", "Medium-high", "Control detail limited"]
        - label: "Execution and partner dependency"
          values: ["High", "Medium-high", "Partial", "Medium-high", "Redundancy unverified"]
        - label: "Financial disclosure"
          values: ["High", "Medium", "Partial", "Medium-high", "Current accounts unavailable"]
    claimRefs: [CR005, CR009, CR010, CR011, CR013]
callouts:
  - calloutType: risk
    title: Highest-priority diligence
    body: Require current market-by-market licenses, audited liquidity and gross-margin evidence, corridor-level service and incident metrics, and documented custody and fraud-loss controls before treating historical stress as resolved.
    claimRefs: [CR005, CR009, CR010, CR011]
  - calloutType: assumption
    title: What the public record does not establish
    body: The cited evidence does not establish current insolvency, a current Kenyan enforcement action, a current security breach, or a precise cash-burn figure; those remain open diligence questions rather than quantified findings.
    claimRefs: [CR003, CR006, CR012]
