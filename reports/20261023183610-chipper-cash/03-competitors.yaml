      xAxis: "Product breadth across assigned evidence (ordinal score, 1 low to 5 high)"
      yAxis: "Africa-linked payment focus in assigned evidence (ordinal score, 1 low to 5 high)"
    approximationNotes: "Scores are analyst-authored ordinal placements from heterogeneous assigned sources; they are not market share, customer satisfaction, or independently measured benchmark values."
    claimRefs: [CP001, CP003, CP004, CP005, CP008, CP009, CP012, CP016]
