      - [Paga, "Direct local-payments peer", "Not quantified in assigned evidence", "Nigeria local-payments users", "Established local-payments positioning", "Current product scope, pricing, and share are not verified"]
      - [OPay and PalmPay, "Direct or adjacent regional fintechs", "$220 million of Chinese investment was reported across the two companies in 2019 without an allocation by company", "West African consumer payments", "Capital-backed regional expansion", "Evidence is historical and current position is not verified"]
      - ["Zepz, LemFi, Paysend, Taptap Send, and Sendwave", "Direct remittance specialists", "Named in an assigned competitor tracker; comparable scale is not supplied", "International and corridor-specific money transfer", "Focused remittance positioning", "The tracker does not establish relative share or performance"]
      - ["Onafriq and Flutterwave", "Payments infrastructure or merchant-payment alternatives", "Named in an assigned competitor tracker; comparable scale is not supplied", "Business payment and network workflows", "Infrastructure or merchant distribution", "Not a like-for-like consumer wallet comparison"]
      - ["Crypto and trading platforms", "Adjacent substitutes", "SoftwareSuggest lists Binance, Coinbase, KuCoin, PAYEER, Paxful, and others without comparable scale", "Crypto custody, trading, or investing", "Specialist product depth", "Alternative listing is not evidence of remittance parity"]
      - ["Bank-led processors", "Incumbent merchant-payment substitute", "RFP.wiki describes large-bank backing but does not quantify comparable Chipper scale", "Merchants prioritizing acquiring, compliance, and banking integration", "Institutional distribution and published entry rates", "Not a direct Africa-focused peer-to-peer substitute"]
      - ["Internal build plus local rails", "Status quo or internal build", "No comparable scale metric", "Businesses seeking workflow and data control", "Custom control over routing and reconciliation", "Requires licensing, integration, partner, and operating capability"]
    notes: Partial landscape assembled from assigned sources; dates and category definitions differ, current scale is unavailable for most competitors, and no row should be read as an exhaustive market-share ranking.
    enumerationScope:
      coverage: partial
      basis: "Named direct, incumbent, adjacent, and status-quo alternatives visible in the assigned evidence through 2026-10-23"
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP011, CP013]
  - id: TP002
    title: Feature and buying-criteria matrix
    columns: [Buying criterion, Chipper Cash, Specialist or incumbent alternative, Evidence-backed implication]
    rows:
      - [Cross-border transfers, "Core product with bank-account and mobile-money delivery described", "Remittance specialists, banks, and local mobile-money rails", "Chipper competes on corridor coverage and convenience; comparative speed and realized FX cost are unknown"]
      - [Product breadth, "Transfers, cards, crypto, stocks, bills, airtime, checkout, and API are described", "Specialists generally address narrower jobs in the assigned evidence", "Bundling can reduce app switching but is not proof of retention"]
      - [Cards and merchant acceptance, "Virtual Visa card plus checkout and network API are described", "Bank-led acquiring offers established card acceptance and banking integration", "Chipper extends beyond peer-to-peer transfers, while enterprise depth and SLA remain unclear"]
      - [Crypto and investing, "Crypto transactions and fractional stock investing are described", "Crypto exchanges and trading platforms offer specialist alternatives", "Chipper supports cross-sell; comparative liquidity, execution quality, and custody terms are unknown"]
      - [Public enterprise pricing, "Partial consumer and account fees; business commercials are quote-based", "BofA comparison shows published entry rates plus custom pricing", "A like-for-like total-cost comparison requires quotes, FX spreads, and ancillary fees"]
      - [Trust and regulatory posture, "Country-level capabilities and partnerships imply market-specific compliance work", "Bank processors bring institutional compliance programs; local rails bring market familiarity", "No assigned source provides a complete current country-by-country control comparison"]
      - [Support and reliability, "Live-chat or specialist support is described, but no public SLA was verified", "Support models vary across banks and specialists", "Reference checks and incident history are required before attributing service advantage"]
      - [Distribution and lock-in, "Mobile product, corridor coverage, card network, and API create convenience-based integration", "Specialists can coexist through multi-homing by corridor or product", "Public evidence does not quantify switching, retention, or partner concentration"]
    notes: Rows preserve unsupported cells as unknown; sources use different geographies, periods, product scopes, and publisher methods, so the matrix is not an independent benchmark.
    claimRefs: [CP005, CP006, CP008, CP009, CP012, CP015, CP016]
  - id: TP003
    title: Pricing, packaging, and switching implications
    columns: [Offer or dimension, Public evidence and period, Buyer implication, Open diligence item]
    rows:
      - ["Chipper consumer transfers", "TechCrunch described no-fee peer-to-peer payments in June 2020", "Low headline price can support acquisition", "Verify current fees and realized FX spreads by corridor"]
      - ["Chipper business payments", "RFP.wiki describes quote-based business commercials and no complete public enterprise rate card in 2026", "Commercial exposure depends on corridor and negotiated terms", "Obtain current take rate, settlement, volume-discount, and support terms"]
      - ["Chipper investments", "ProductMint reported a 1% stock or cryptocurrency transaction fee in its 2022 profile", "Adjacent products can monetize the wallet relationship", "Verify current fees, spreads, product availability, and custody terms"]
      - ["Chipper Network API", "ProductMint reported a 1% fee on collected business payments in its 2022 profile", "API integration can add workflow switching cost", "Verify current price, implementation effort, refunds, reconciliation, and settlement"]
      - ["Bank of America Merchant Services", "RFP.wiki reports 2.65% plus $0.10 for in-person payments and 2.99% plus $0.30 for online payments, alongside custom pricing", "Published entry rates aid initial comparison", "Confirm equipment, software, PCI, statement, and legacy-contract charges"]
      - ["Corridor and country access", "Assigned sources use different geographic scopes and report country-gated features", "Coverage can create local advantage while limiting global substitutability", "Map every licensed and live capability by origin, destination, method, and currency"]
      - ["Support and SLA", "RFP.wiki reports no verified public Chipper SLA or uptime commitment", "Operational exceptions can erase price-led savings", "Request SLA, twelve-month incidents, escalation metrics, and reference accounts"]
      - ["Partner and migration dependence", "A former executive described reworking major partnerships and narrowing product and corridor focus", "Partner changes can alter economics or continuity after integration", "Measure partner concentration, termination rights, migration time, and fallback routing"]
    notes: Public pricing mixes historical consumer observations with current comparison-page business observations; amounts are not treated as realized revenue, margin, or a complete all-in invoice.
    claimRefs: [CP007, CP008, CP009, CP010, CP012, CP015, CP016]
