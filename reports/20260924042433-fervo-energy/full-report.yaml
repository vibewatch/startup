companyProfile:
  summary: >-
    Fervo Energy is now a public enhanced geothermal systems developer that turns horizontal drilling, hydraulic
    fracturing, and reservoir monitoring into modular 24/7 clean power projects. Its flagship Cape Station build and
    Google-backed commercial relationships make it one of the most visible EGS companies in the market, but the
    operating model remains capital intensive and execution heavy.
  foundedDate: '2017-05-26'
  founders:
    - name: Tim Latimer
      role: CEO and co-founder
      background: Founded the company and leads the commercial and public-market effort.
    - name: Jack Norbeck, PhD
      role: CTO and co-founder
      background: Leads the technical architecture behind Fervo’s EGS approach.
  foundingLocation: Houston, Texas
  headquarters: Houston, Texas
  productSummary: >-
    Enhanced geothermal power plants and modular GeoBlocks / GeoClusters that deliver firm, low-carbon baseload
    electricity.
  customerFocus: Utilities, hyperscale data centers, and industrial off-takers that need 24/7 clean power.
  businessModel: Long-term power purchase agreements, project-finance-backed plant development, and asset ownership / operation.
  stage: Public
  fundingStatus: >-
    Public company after a May 2026 IPO that raised about $2.2B gross proceeds and followed project-level non-recourse
