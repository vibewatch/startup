chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating snapshot
        blocks:
          - type: paragraph
            body: >-
              Fervo Energy is now a public, Houston-headquartered enhanced geothermal company that combines oil-and-gas
              drilling methods with utility-scale power development. The refresh confirms the 2017 incorporation date,
              the Houston headquarters, the transition to a public listing, and the still-small employee base relative
              to the capital program. The company is no longer a pre-IPO story: it has a live market price, a materially
              larger balance sheet, and a set of disclosed commercial milestones that now need to be judged on execution
              rather than launch narrative.
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
              - CO008
          - type: table
            tableRef: TO001
            claimRefs: []
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO005
              - CO009
              - CO011
      - number: '1.2'
        title: Leadership, founders, and governance
        blocks:
          - type: paragraph
            body: >-
              The leadership picture remains founder-led, but public-company governance is now broader. Tim Latimer and
              Jack Norbeck still anchor the company’s technical and strategic identity, while the CFO and COO roles
              indicate the company is trying to industrialize execution. The board is still shaped by insiders and
              climate/energy veterans, which is helpful for project finance and resource development, but the
              public-company posture also raises the bar on disclosure discipline, controls, and capital allocation. The
              key diligence question is whether the founder-led culture can scale into a repeatable public-market
              utility developer.
            claimRefs:
              - CO002
              - CO003
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
              - CO014
      - number: '1.3'
        title: Capital, commercial milestones, and open questions
        blocks:
          - type: paragraph
            body: >-
              The company’s commercial progress is now anchored by three numbers: 658 MW of binding PPAs, roughly $7.2
              billion of contracted revenue backlog, and 500 MW under construction at Cape Station. The Google framework
              and the 396 MW PPA update materially expand the commercial narrative, but the framework itself is not the
              same as a fully converted, cash-flowing contract. The IPO, project finance, and ongoing capex are enough
              to keep the build moving, yet the refresh still carries forward open questions on precise contract terms,
              conversion timing, and the potential for follow-on capital needs if execution slips. The refresh also
              matters because it replaces stale pre-IPO assumptions with live public-company evidence, which changes the
              decision context from fundraising narrative to operating proof. Investors should now judge whether the
              next few quarters improve disclosure, commissioning, and contract conversion rather than whether the
              company can close an IPO.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO011
              - CO013
      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Open diligence item
            body: >-
              The Google framework and several of the largest PPAs are still not fully disclosed at contract-term level,
              so the refreshed view keeps a conservative stance on conversion certainty.
            calloutType: risk
            claimRefs:
              - CO011
              - CO012
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The market boundary is narrower than “all electricity.” Fervo is selling firm, 24/7 clean power to buyers
              that care about reliability, decarbonization, and time-to-power. That puts it in direct competition with
              gas peakers, solar-plus-storage, wind-plus-storage, grid upgrades, and other ways of securing dispatchable
              supply. The boundary matters because valuation should follow the subset of load that will actually pay for
              firmness, not the abstract size of the U.S. electricity system. The distinction matters because capital
              allocation, buyer urgency, and pricing power all sit inside that narrower wedge. If the market is defined
              too broadly, the company appears to address an enormous electricity market; if it is defined correctly,
              the opportunity is still large but much more selective.
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
              - CM012
          - type: table
            tableRef: TM001
            claimRefs: []
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
      - number: '2.2'
        title: Demand drivers and buyer economics
        blocks:
          - type: paragraph
            body: >-
              The demand signal is real: AI, data centers, electrification, and industrial reshoring are pushing buyers
              toward 24/7 power. Fervo’s own disclosures, plus the Google agreement and the PNNL article, all point to
              the same wedge — large-load customers want reliable carbon-free supply and are willing to contract early
              if the project can be delivered on schedule. Utilities, hyperscalers, and industrials differ on budget
              owner and procurement process, but they share a common trigger: they cannot wait for slower grid
              expansion. In practice, the buyer is often a procurement team trying to solve a reliability problem with a
              decarbonization constraint, while the end user is a data center or plant that cannot tolerate downtime.
              That makes the willingness to pay for firm power a central part of the market definition.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM008
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM011
      - number: '2.3'
        title: Sizing logic and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The right sizing method is triangulation. One lens is the growing data-center power appetite; another is
              the amount of contracted power Fervo already has; a third is the operational capacity of geothermal to
              translate resources into bankable megawatts. The constraints remain brutally physical: drilling,
              permitting, interconnection, and project capital. That makes the market attractive but execution-bound,
              which is why the report preserves open questions about conversion rates, contract depth, and the
              willingness of buyers to sign truly long-dated firm-power agreements.
            claimRefs:
              - CM009
              - CM010
              - CM012
          - type: table
            tableRef: TM002
            claimRefs: []
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape of substitutes and direct peers
        blocks:
          - type: paragraph
            body: >-
              The buyer’s choice set is broader than “other geothermal developers.” Fervo competes with incumbents,
              solar-plus-storage, gas peakers, grid upgrades, and on-site generation. That means the real contest is not
              just which technology is best in isolation, but which can deliver reliable power fastest and with the
              least execution risk. In practice, that turns the buying decision into a schedule-and-bankability test,
              not just a technology beauty contest. Fervo’s edge is strongest where buyers need a firm, low-carbon,
              long-duration contract and are willing to accept geology and project-finance risk in exchange. This is why
              the market comparison has to include delivery timing, not just technology purity and buyer urgency at
              scale.
            claimRefs:
              - CP001
              - CP002
              - CP010
          - type: table
            tableRef: TP001
            claimRefs: []
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP008
      - number: '3.2'
        title: Differentiation and moat durability
        blocks:
          - type: paragraph
            body: >-
              The company’s moat is structural, not purely software-like. It comes from drilling know-how, reservoir
              learning, modular deployment, and project finance credibility. Baron Capital’s discussion is useful
              because it frames Fervo as the EGS leader while also acknowledging that geothermal has long been
              constrained by dry wells and geography. In other words, Fervo’s current advantage is real, but it depends
              on continuing to learn faster than the market can copy. That is why the moat discussion needs to include
              operating cadence, not just engineering novelty, reservoir iteration, and cost decline.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP008
      - number: '3.3'
        title: Threats, switching costs, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Switching costs in power procurement are high once a buyer signs a long-dated PPA, but multi-homing is
              still possible because large buyers often source across multiple technologies. The biggest threat is
              another technology or developer that can deliver firm power faster and with less capital. That is why the
              report treats bankability, contract conversion, and the pace of learning as the core competitive monitors
              rather than relying on brand strength alone. The practical question is whether Fervo can keep widening its
              cost, schedule, and credibility lead faster than substitutes improve. The answer will show up first in
              contract terms and commissioning milestones.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP012
          - type: table
            tableRef: TP003
            claimRefs: []
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              Fervo is still in the transition from development revenue to commercial operating revenue. The public
              record shows only immaterial ancillary fees today, which means the real economic question is not current
              revenue quality but how quickly the company converts contracted megawatts into operating cash flow. The Q2
              and Q1 materials, plus the SEC filings, make clear that the company is still paying for construction,
              commissioning, and organizational scale-up before the true commercial base arrives. That delay matters
              because every quarter of delayed commercialization leaves the company more dependent on capital markets
              and project finance to bridge the gap.
            claimRefs:
              - CI001
              - CI002
              - CI003
          - type: table
            tableRef: TI001
            claimRefs: []
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI004
              - CI007
              - CI011
      - number: '4.2'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The capital stack is the core financial story. Fervo now has public-equity proceeds and a major
              project-finance precedent, but the company’s build program is still extremely capital intensive. Q2 capex
              and the 2026 capex guide show that the spending curve is still steep. That makes the balance sheet look
              better than it did pre-IPO, but not yet fully de-risked: the next underwriting question is whether
              construction and commissioning stay on budget and whether additional project finance is available on
              equally good terms. The company has more flexibility now, but the margin for error is still thin if capex
              or commissioning slips.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI012
          - type: table
            tableRef: TI002
            claimRefs: []
      - number: '4.3'
        title: Underwriting gaps and dilution risk
        blocks:
          - type: paragraph
            body: >-
              The most important missing data are project-level margins, customer concentration by revenue, and the
              precise economics of the Google-related contracts. The 658 MW backlog is strong evidence of demand, but
              the market still does not have steady-state operating margins to judge. If construction slips or if
              contract conversion lags, the company may need to fund more of the growth path with additional equity or
              less attractive project capital. That is why the financial view remains constructive but not complacent.
              In short, the missing line items are exactly the ones that would tell investors how much of the upside is
              already spoken for by financing needs.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI010
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Fervo is not selling software; it is selling firm, always-on electricity produced by a coupled drilling,
              reservoir, and power-block system. In customer terms, the product is a long-duration power contract that
              can serve data centers, utilities, and industrial loads without relying on intermittent generation plus
              storage. That makes the workflow closer to an infrastructure project than a SaaS sale, even though
              software, sensing, and modeling are increasingly important inside the operating stack. The commercial
              promise is simple, but the operating chain is not — every extra layer of physical execution has to clear
              the same commercial bar before a megawatt becomes bankable.
            claimRefs:
              - CE001
              - CE012
          - type: table
            tableRef: TE001
            claimRefs: []
          - type: table
            tableRef: TE002
            claimRefs: []
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE004
              - CE005
      - number: '5.2'
        title: Architecture, moduleization, and maturity
        blocks:
          - type: paragraph
            body: >-
              The architecture has moved from pilot proof to modular industrialization. Project Red proved the concept,
              Cape Station Phase I is now commissioning, and Phase II is the repeatability test. The design depends on
              the reservoir learning curve, the power-block conversion chain, and a supply base that can reliably
              deliver ORC turbines, controls, and tubulars. The technical question is not whether the system works at
              all; it is whether it can keep learning fast enough to meet the company’s cost and schedule promises. That
              makes architecture a maturity question as much as a hardware question.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE008
              - CE010
          - type: table
            tableRef: TE003
            claimRefs: []
      - number: '5.3'
        title: Trust, safety, developer signal, and remaining technical gaps
        blocks:
          - type: paragraph
            body: >-
              The public evidence on trust and safety is better than many first-of-kind industrial assets — the company
              emphasizes HSE, reports a low TRIR, and has now attracted PNNL/NVIDIA collaboration and hiring demand in
              technical roles. But the open technical gaps remain real — reservoir durability, induced seismicity, and
              the long-run fall in installed cost per kilowatt are still the things that will determine whether the
              platform scales from exciting to durable. In other words, the technical story is improving, but it is not
              yet boring — and boring is what a scaled infrastructure platform eventually has to become. That is the
              cost of scale.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE009
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Named customer proof and production usage
        blocks:
          - type: paragraph
            body: >-
              The strongest customer evidence is the Google relationship, which now has both a Nevada pilot connection
              and a much larger Cape Station expansion path. That is materially stronger than logo slides because it
              shows named counterparties, named megawatts, and a live link between pilot output and production
              contracts. The question is no longer whether Fervo has customer interest; the question is how far that
              customer base can broaden without becoming too dependent on a single hyperscaler. The public record
              therefore supports real customer proof, but not yet a complete customer map. The missing line is still
              revenue concentration, which is why the next set of disclosures matters so much overall today.
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU010
      - number: '6.2'
        title: Adoption trajectory and customer segmentation
        blocks:
          - type: paragraph
            body: >-
              The public record supports three customer archetypes: hyperscalers, utilities, and industrials. The
              company is trying to convert pilot credibility into long-term power contracts and behind-the-meter
              relationships. That makes the adoption path a classic land-and-expand motion, but in infrastructure form:
              one pilot, one early offtake, then large multi-year contracts once the technical and commercial case is
              proven. The near-term test is whether those archetypes diversify quickly enough to reduce concentration
              without slowing the pace of dealmaking. A broader customer mix would also make the public story less
              dependent on one hyperscaler narrative.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU008
              - CU009
          - type: table
            tableRef: TU001
            claimRefs: []
      - number: '6.3'
        title: Retention, concentration, and unresolved customer gaps
        blocks:
          - type: paragraph
            body: >-
              Customer durability remains underdisclosed. We know the names of some counterparties and the rough
              megawatt scale, but we do not yet know renewal rates, concentration by revenue, or how much of the
              commercial book sits behind a few marquee names. The biggest customer risk is that the business becomes
              “Google plus a handful of utilities” before a broader base of repeat buyers develops. That makes
              concentration disclosure and contract duration the next critical diligence asks, especially now that the
              company is in a public-market scrutiny regime. Until that data exists, every forward estimate should carry
              a concentration discount.
            claimRefs:
              - CU006
              - CU010
              - CU012
          - type: table
            tableRef: TU003
            claimRefs: []
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              Execution risk is the core issue across legal, operational, and financial dimensions. The filings make
              clear that schedule slips can trigger contractual penalties, while the operational process still depends
              on drilling, reservoir performance, and commissioning outcomes. Because the company is scaling from pilot
              to first commercial plant, even a relatively ordinary construction overrun can become a large valuation
              event. This is why the risk view stays high even though the commercial demand story is attractive. The
              practical takeaway is that each risk channel can amplify the others, so investors should think in terms of
              compounding failure modes rather than isolated problems. That is especially true once the company starts
              layering project finance, customer conversion, and public-market expectations on top of one another.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
          - type: table
            tableRef: TR002
            claimRefs: []
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR010
      - number: '7.2'
        title: Partner, supplier, and people risk
        blocks:
          - type: paragraph
            body: >-
              The company has done some things right: it has project-finance proof, supplier agreements, and a
              public-company operating cadence. But those mitigations are only partial. The company still depends on a
              chain of vendors, lenders, and internal execution leaders to move from construction to steady-state power.
              A fast-growing technical team is a strength, but it also increases control and coordination risk during
              the most fragile scaling period. The risk is not simply headcount; it is whether the organization can keep
              the same operating discipline while the asset base, supplier set, and public reporting burden all grow at
              once. The bigger the build program becomes, the more the people layer becomes a risk multiplier.
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR011
      - number: '7.3'
        title: Thesis-break triggers and monitoring plan
        blocks:
          - type: paragraph
            body: >-
              The kill criteria are straightforward: a missed first-power date, weak customer conversion from framework
              to PPA, a material financing setback, or any reservoir / HSE incident would all justify lowering the
              thesis materially. The market may be willing to forgive one slip, but not a pattern of slips. That means
              the monitorable metrics are more important than broad optimism: date-specific commissioning milestones,
              contract conversion, capex discipline, and incident-free operations. If any one of those metrics starts to
              miss repeatedly, the risk profile changes from manageable to structurally thesis-threatening.
            claimRefs:
              - CR009
              - CR010
              - CR012
          - type: table
            tableRef: TR003
            claimRefs: []
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, confidence, and valuation stance
        blocks:
          - type: paragraph
            body: >-
              The refreshed call remains track. Fervo is now a public company with real demand, a much bigger balance
              sheet, and a better project-finance story than the pre-IPO version of the company. But the public evidence
              still says “execution story,” not “finished underwrite.” The IPO price and the post-IPO market-cap
              references show that investors already gave the company meaningful future value; the burden now is to
              prove that the model can scale without the capital curve and schedule curve getting away from management.
              Put differently, valuation already reflects upside optionality, so incremental evidence has to come from
              operating delivery rather than another promise of future scale.
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
      - number: '8.2'
        title: Bull case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bull case is strong: Fervo has real contracted demand, a first project-finance proof point, and a
              potentially large market wedge. The anti-thesis is equally clear: commercial proof still depends on
              first-power timing, customer conversion, and reservoir durability. Those are not academic risks — they are
              the actual drivers of whether the company can turn a good market position into durable shareholder value.
              That is why the valuation answer stays conservative even though the commercial narrative has improved. The
              upside case is real, but it is still contingent on a long chain of execution steps that has not yet fully
              cleared.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV008
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV008
              - CV011
      - number: '8.3'
        title: Scenarios, references, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The best way to think about valuation here is as a set of milestone references rather than a clean
              multiple table. The IPO offer-price value, the subsequent market-cap reference in Baron’s letter, and the
              project-finance milestone are all useful anchors. Together they say: the company is worth watching, but
              not yet worth pretending that the first commercial plant has already proven the model. The final diligence
              asks are therefore straightforward — on-time commissioning, conversion of frameworks to bankable PPAs, and
              stable economics once the plants are on line. Until those asks are answered, any valuation framework
              should retain a material execution haircut.
            claimRefs:
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV003
            claimRefs: []
