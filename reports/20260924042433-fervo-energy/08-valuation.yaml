- id: TV003
  title: Scenario / comparable / diligence table
  columns:
  - row type
  - item
  - assumptions or status
  - implied value / return logic
  - relevance
  - limitation
  rows:
  - - scenario
    - Bull
    - On-time commissioning, Google conversion, better project finance
    - Multiple expansion and higher cash-flow visibility
    - Upside path
    - Execution must be nearly flawless
  - - scenario
