company:
  name: Fervo Energy
chapter:
  number: 8
  title: Valuation
  summary: Fervo’s public-market debut and Google-related demand are real, but execution risk keeps the right call at track
    rather than buy.
sections:
- id: valuation-summary
  title: Recommendation, confidence, and valuation stance
  body: The refreshed call remains track. Fervo is now a public company with real demand, a much bigger balance sheet, and
    a better project-finance story than the pre-IPO version of the company. But the public evidence still says “execution
    story,” not “finished underwrite.” The IPO price and the post-IPO market-cap references show that investors already gave
    the company meaningful future value; the burden now is to prove that the model can scale without the capital curve and
    schedule curve getting away from management. Put differently, valuation already reflects upside optionality, so incremental
    evidence has to come from operating delivery rather than another promise of future scale.
  claimRefs:
  - CV001
  - CV002
  - CV006
  - CV007
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: thesis-antithesis
  title: Bull case and anti-thesis
  body: 'The bull case is strong: Fervo has real contracted demand, a first project-finance proof point, and a potentially
    large market wedge. The anti-thesis is equally clear: commercial proof still depends on first-power timing, customer conversion,
    and reservoir durability. Those are not academic risks — they are the actual drivers of whether the company can turn a
    good market position into durable shareholder value. That is why the valuation answer stays conservative even though the
    commercial narrative has improved. The upside case is real, but it is still contingent on a long chain of execution steps
    that has not yet fully cleared.'
  claimRefs:
  - CV003
  - CV004
  - CV005
  - CV008
  - CV011
  tableRefs:
  - TV002
- id: scenarios-and-comps
  title: Scenarios, references, and final diligence asks
  body: 'The best way to think about valuation here is as a set of milestone references rather than a clean multiple table.
    The IPO offer-price value, the subsequent market-cap reference in Baron’s letter, and the project-finance milestone are
    all useful anchors. Together they say: the company is worth watching, but not yet worth pretending that the first commercial
    plant has already proven the model. The final diligence asks are therefore straightforward — on-time commissioning, conversion
    of frameworks to bankable PPAs, and stable economics once the plants are on line. Until those asks are answered, any
    valuation framework should retain a material execution haircut.'
  claimRefs:
  - CV009
  - CV010
  - CV012
  tableRefs:
  - TV003
