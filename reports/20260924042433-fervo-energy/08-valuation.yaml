    - Progress with schedule noise and ongoing capex
    - Hold / track
    - Most likely case
    - Still pre-margin
  - - scenario
    - Bear
    - Delays, weaker conversion, dilution
    - Multiple compression
    - Downside case
    - Could happen if milestones slip
  - - reference
    - IPO offer-price value
    - $27/share and ~7.6B-$7.7B implied equity value
    - Reference point for the initial public market price
    - Current benchmark
    - Not the same as steady-state intrinsic value
  - - reference
    - Aug. 2026 market cap
    - About $5.94B in Baron letter
    - Shows public market already below IPO reference
    - Useful reality check
    - A single-date snapshot
  - - reference
    - Initial project-finance milestone
    - $421.4M non-recourse Cape Station debt
    - Proves project-finance bankability
    - Important de-risking step
    - Only one project and one structure
  - - reference
    - Public-market skepticism
    - Cooling-off commentary after IPO
    - Adverse read-through from near-term market commentary
    - Keeps valuation discipline high
    - A sentiment reference rather than intrinsic value
  notes: The table intentionally mixes scenarios and milestone references because the company lacks a fully mature public
    peer set; valuation must be triangulated from milestones and market references.
