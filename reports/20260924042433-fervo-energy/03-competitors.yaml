company:
  name: Fervo Energy
chapter:
  number: 3
  title: Competitors
  summary: Fervo’s real competition is the buyer’s entire firm-power choice set, not just another geothermal startup, and
    its moat depends on drilling learning curves and project-finance credibility.
sections:
- id: competitor-landscape
  title: Landscape of substitutes and direct peers
  body: The buyer’s choice set is broader than “other geothermal developers.” Fervo competes with incumbents, solar-plus-storage,
    gas peakers, grid upgrades, and on-site generation. That means the real contest is not just which technology is best in
    isolation, but which can deliver reliable power fastest and with the least execution risk. In practice, that turns the
    buying decision into a schedule-and-bankability test, not just a technology beauty contest. Fervo’s edge is strongest
    where buyers need a firm, low-carbon, long-duration contract and are willing to accept geology and project-finance risk
    in exchange. This is why the market comparison has to include delivery timing, not just technology purity and buyer urgency
    at scale.
  claimRefs:
  - CP001
  - CP002
  - CP010
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: differentiation
  title: Differentiation and moat durability
  body: The company’s moat is structural, not purely software-like. It comes from drilling know-how, reservoir learning, modular
    deployment, and project finance credibility. Baron Capital’s discussion is useful because it frames Fervo as the EGS leader
    while also acknowledging that geothermal has long been constrained by dry wells and geography. In other words, Fervo’s
    current advantage is real, but it depends on continuing to learn faster than the market can copy. That is why the moat
    discussion needs to include operating cadence, not just engineering novelty, reservoir iteration, and cost decline.
  claimRefs:
  - CP003
  - CP004
  - CP005
  - CP006
  - CP011
  tableRefs:
  - TP002
- id: threats-and-switching
  title: Threats, switching costs, and adverse evidence
  body: Switching costs in power procurement are high once a buyer signs a long-dated PPA, but multi-homing is still possible
    because large buyers often source across multiple technologies. The biggest threat is another technology or developer
    that can deliver firm power faster and with less capital. That is why the report treats bankability, contract conversion,
    and the pace of learning as the core competitive monitors rather than relying on brand strength alone. The practical
    question is whether Fervo can keep widening its cost, schedule, and credibility lead faster than substitutes improve.
    The answer will show up first in contract terms and commissioning milestones.
  claimRefs:
  - CP007
  - CP008
  - CP009
  - CP012
  tableRefs:
  - TP003
