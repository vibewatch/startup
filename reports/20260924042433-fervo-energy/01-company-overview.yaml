  title: Company Overview
  summary: Fervo is now a public EGS developer with a larger balance sheet, a 199-person team, and a materially expanded commercial
    pipeline, but the Google framework and early-phase execution still deserve caution.
sections:
- id: company-snapshot
  title: Identity and operating snapshot
  body: 'Fervo Energy is now a public, Houston-headquartered enhanced geothermal company that combines oil-and-gas drilling
    methods with utility-scale power development. The refresh confirms the 2017 incorporation date, the Houston headquarters,
    the transition to a public listing, and the still-small employee base relative to the capital program. The company is
    no longer a pre-IPO story: it has a live market price, a materially larger balance sheet, and a set of disclosed commercial
    milestones that now need to be judged on execution rather than launch narrative.'
  claimRefs:
  - CO001
  - CO004
  - CO005
  - CO006
  - CO008
  tableRefs:
  - TO001
  figureRefs:
  - FO001
- id: leadership-governance
  title: Leadership, founders, and governance
  body: The leadership picture remains founder-led, but public-company governance is now broader. Tim Latimer and Jack Norbeck
    still anchor the company’s technical and strategic identity, while the CFO and COO roles indicate the company is trying
    to industrialize execution. The board is still shaped by insiders and climate/energy veterans, which is helpful for project
    finance and resource development, but the public-company posture also raises the bar on disclosure discipline, controls,
    and capital allocation. The key diligence question is whether the founder-led culture can scale into a repeatable public-market
    utility developer.
  claimRefs:
  - CO002
  - CO003
  - CO014
  tableRefs:
  - TO002
- id: capital-and-milestones
  title: Capital, commercial milestones, and open questions
  body: 'The company’s commercial progress is now anchored by three numbers: 658 MW of binding PPAs, roughly $7.2 billion
    of contracted revenue backlog, and 500 MW under construction at Cape Station. The Google framework and the 396 MW PPA
    update materially expand the commercial narrative, but the framework itself is not the same as a fully converted, cash-flowing
    contract. The IPO, project finance, and ongoing capex are enough to keep the build moving, yet the refresh still carries
    forward open questions on precise contract terms, conversion timing, and the potential for follow-on capital needs if
    execution slips. The refresh also matters because it replaces stale pre-IPO assumptions with live public-company evidence,
    which changes the decision context from fundraising narrative to operating proof. Investors should now judge whether the
    next few quarters improve disclosure, commissioning, and contract conversion rather than whether the company can close
    an IPO.'
  claimRefs:
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
  tableRefs:
  - TO003
