  title: Market Analysis
  summary: Fervo’s real market is not generic electricity; it is the much smaller but more valuable wedge of firm, 24/7 clean
    power for data centers, utilities, and industrial buyers.
sections:
- id: market-boundary
  title: Market boundary and substitutes
  body: The market boundary is narrower than “all electricity.” Fervo is selling firm, 24/7 clean power to buyers that care
    about reliability, decarbonization, and time-to-power. That puts it in direct competition with gas peakers, solar-plus-storage,
    wind-plus-storage, grid upgrades, and other ways of securing dispatchable supply. The boundary matters because valuation
    should follow the subset of load that will actually pay for firmness, not the abstract size of the U.S. electricity system.
    The distinction matters because capital allocation, buyer urgency, and pricing power all sit inside that narrower wedge.
    If the market is defined too broadly, the company appears to address an enormous electricity market; if it is defined
    correctly, the opportunity is still large but much more selective.
  claimRefs:
  - CM001
  - CM005
  - CM006
  - CM007
  - CM012
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: demand-and-buyers
  title: Demand drivers and buyer economics
  body: 'The demand signal is real: AI, data centers, electrification, and industrial reshoring are pushing buyers toward
    24/7 power. Fervo’s own disclosures, plus the Google agreement and the PNNL article, all point to the same wedge — large-load
    customers want reliable carbon-free supply and are willing to contract early if the project can be delivered on schedule.
    Utilities, hyperscalers, and industrials differ on budget owner and procurement process, but they share a common trigger:
    they cannot wait for slower grid expansion. In practice, the buyer is often a procurement team trying to solve a reliability
    problem with a decarbonization constraint, while the end user is a data center or plant that cannot tolerate downtime.
    That makes the willingness to pay for firm power a central part of the market definition.'
  claimRefs:
  - CM002
  - CM003
  - CM004
  - CM008
  - CM011
  tableRefs:
  - TM003
- id: sizing-and-constraints
  title: Sizing logic and adoption constraints
  body: 'The right sizing method is triangulation. One lens is the growing data-center power appetite; another is the amount
    of contracted power Fervo already has; a third is the operational capacity of geothermal to translate resources into bankable
    megawatts. The constraints remain brutally physical: drilling, permitting, interconnection, and project capital. That
    makes the market attractive but execution-bound, which is why the report preserves open questions about conversion rates,
    contract depth, and the willingness of buyers to sign truly long-dated firm-power agreements.'
  claimRefs:
  - CM009
  - CM010
  - CM012
  tableRefs:
  - TM002
