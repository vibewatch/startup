company:
  name: Fervo Energy
chapter:
  number: 6
  title: Customers
  summary: Fervo has real named customer proof — especially Google and utility counterparties — but the commercial book is
    still concentrated and not yet fully transparent on retention or revenue mix.
sections:
- id: customer-proof
  title: Named customer proof and production usage
  body: The strongest customer evidence is the Google relationship, which now has both a Nevada pilot connection and a much
    larger Cape Station expansion path. That is materially stronger than logo slides because it shows named counterparties,
    named megawatts, and a live link between pilot output and production contracts. The question is no longer whether Fervo
    has customer interest; the question is how far that customer base can broaden without becoming too dependent on a single
    hyperscaler. The public record therefore supports real customer proof, but not yet a complete customer map. The missing
    line is still revenue concentration, which is why the next set of disclosures matters so much overall today.
  claimRefs:
  - CU001
  - CU002
  - CU007
  - CU011
  tableRefs:
  - TU002
  figureRefs:
  - FU001
- id: adoption-and-segmentation
  title: Adoption trajectory and customer segmentation
  body: 'The public record supports three customer archetypes: hyperscalers, utilities, and industrials. The company is trying
    to convert pilot credibility into long-term power contracts and behind-the-meter relationships. That makes the adoption
    path a classic land-and-expand motion, but in infrastructure form: one pilot, one early offtake, then large multi-year
    contracts once the technical and commercial case is proven. The near-term test is whether those archetypes diversify quickly
    enough to reduce concentration without slowing the pace of dealmaking. A broader customer mix would also make the public
    story less dependent on one hyperscaler narrative.'
  claimRefs:
  - CU003
  - CU004
  - CU005
  - CU008
  - CU009
  tableRefs:
  - TU001
- id: retention-and-concentration
  title: Retention, concentration, and unresolved customer gaps
  body: Customer durability remains underdisclosed. We know the names of some counterparties and the rough megawatt scale,
    but we do not yet know renewal rates, concentration by revenue, or how much of the commercial book sits behind a few marquee
    names. The biggest customer risk is that the business becomes “Google plus a handful of utilities” before a broader base
    of repeat buyers develops. That makes concentration disclosure and contract duration the next critical diligence asks,
    especially now that the company is in a public-market scrutiny regime. Until that data exists, every forward estimate
    should carry a concentration discount.
  claimRefs:
  - CU006
  - CU010
  - CU012
  tableRefs:
  - TU003
