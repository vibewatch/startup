              - CI004
              - CI007
              - CI011
      - number: '4.2'
        title: 资金充裕度与融资依赖性
        blocks:
          - type: paragraph
            body: >-
              Fervo 的财务主线是资本。IPO 带来公开市场股权资金，首笔大型项目融资也树立了先例，但建厂计划仍极其烧钱。Q2 资本开支和 2026 年全年指引都显示支出仍在快速攀升。资产负债表比 IPO
              前健康得多，却尚未完全去风险：建设和调试能否按预算完成，后续项目能否以相近条件融资，是下一步要核实的重点。公司资金腾挪空间变大了，但若资本开支超支或调试延误，缓冲仍然有限。
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI012
          - type: table
            tableRef: TI002
            claimRefs: []
      - number: '4.3'
        title: 尽调查核缺口与股权稀释风险
        blocks:
          - type: paragraph
            body: >-
              最重要的缺口是项目利润率、按收入计算的客户集中度，以及 Google 相关合同的具体经济条款。658 MW 储备订单有力证明了需求，但目前还没有稳态运营利润率可供评估。若建设延期或合同转化滞后，Fervo
              可能需要增发股票，或接受条件较差的项目融资来继续扩张。因此，财务判断偏正面，但不能掉以轻心。缺少的这些数据，正好关系到未来融资需求会占掉多少潜在回报。
