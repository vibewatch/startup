    title: 公司概况
    sections:
      - number: '1.1'
        title: 业务定位与运营概况
        blocks:
          - type: paragraph
            body: >-
              Fervo Energy 总部位于休斯敦，是一家上市 EGS 开发商，把油气钻井工艺用于公用事业级电力项目。本次更新确认了公司 2017
              年注册成立、总部所在地和上市状态；与庞大的资本开支计划相比，员工规模仍然不大。如今市场可以直接给公司定价，资产负债表也因 IPO 明显扩张，商业里程碑陆续披露。评估重点已从 IPO
              前的融资故事转向项目能否按计划落地。
            claimRefs:
