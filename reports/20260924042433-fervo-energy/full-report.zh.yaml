  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户业务流程
        blocks:
          - type: paragraph
            body: >-
              Fervo 卖的不是软件，而是钻井、热储和动力机组协同产出的全天候稳定电力。客户买到的是一份长期供电合同，可服务数据中心、公用事业和工业负荷，不必依赖间歇性发电与储能组合。其销售和交付更像重资产基建，而非
              SaaS；软件、传感和建模虽日益重要，仍嵌在运营体系里。卖点简单，落地链条却很重：每增加一层实体工程，都得证明它能把兆瓦容量变成可融资资产。
            claimRefs:
              - CE001
              - CE012
