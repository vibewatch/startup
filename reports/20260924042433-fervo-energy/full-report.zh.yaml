      - number: '5.2'
        title: 系统架构、模块化程度与技术成熟度
        blocks:
          - type: paragraph
            body: >-
              Fervo 已从试点验证走到模块化工业化。Project Red 验证了概念，Cape Station 一期正在调试，二期将检验方案能否复制。设计能否奏效，取决于热储学习、动力机组转换链，以及 ORC
              透平、控制系统和井下管材能否稳定供应。现在的问题不只是系统能不能运行，而是公司能否持续快速学习，兑现成本和工期承诺。技术成熟度既看设备，也看整套架构能否重复交付。
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE008
              - CE010
          - type: table
            tableRef: TE003
            claimRefs: []
      - number: '5.3'
        title: 可信度、安全性、研发动向与残余技术缺口
        blocks:
          - type: paragraph
            body: >-
              与许多首台套工业资产相比，Fervo 的工程可信度和安全公开记录较好：公司强调 HSE，报告的总可记录事故率（TRIR）较低，也促成了与 PNNL、NVIDIA
              的合作，并带来技术岗位招聘需求。关键缺口仍在：热储能维持多久、如何控制诱发地震，以及每千瓦装机成本能否长期下降，都决定平台能否从新颖概念成长为可靠资产。技术进展虽有改善，但它尚未变得乏味；而成熟基础设施平台最终必须稳定到近乎乏味。这就是规模化的代价。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE009
              - CE011
