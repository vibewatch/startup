      - number: '1.2'
        title: 领导层、创始人与公司治理
        blocks:
          - type: paragraph
            body: >-
              公司仍由创始人主导，但上市后治理班底有所扩充。Tim Latimer 和 Jack Norbeck 延续技术与战略方向，CFO、COO
              的任命则显示公司正试图把项目执行工业化。董事会仍以内部人士和气候、能源领域资深人士为主，这有助于项目融资和资源开发；与此同时，上市公司也必须提高披露、内控和资本配置纪律。关键在于，创始人文化能否支撑公司成长为可复制运营的上市公用事业开发商。
