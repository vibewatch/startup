  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价透明度
        blocks:
          - type: paragraph
            body: >-
              Fervo 正从前期开发收入转向商业运营收入，但尚未完成切换。公开资料显示，目前只有金额极小的辅助服务费；真正要看的是已签约兆瓦何时能转成运营现金流。Q1、Q2 财报和 SEC
              文件显示，在商业收入成形前，公司仍须承担建设、调试和扩充团队的开支。商业化每晚一个季度，公司就要更多依靠资本市场和项目融资填补资金缺口。
            claimRefs:
              - CI001
