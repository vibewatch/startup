      - number: '3.2'
        title: 差异化优势与护城河持久度
        blocks:
          - type: paragraph
            body: >-
              Fervo 的护城河来自工程积累，而不是软件壁垒：钻井经验、热储学习、模块化交付和项目融资信誉共同构成优势。Baron Capital 将 Fervo 视为 EGS
              领军者，同时指出地热长期受干井风险和选址限制。Fervo 的先发优势确实存在，但能否守住，取决于学习速度是否持续快过竞争者的复制速度。评估护城河时，除了工程创新、热储改进和降本曲线，还要看项目执行节奏。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP008
      - number: '3.3'
        title: 潜在威胁、切换成本与反向证据
        blocks:
          - type: paragraph
            body: >-
              买方签下长期 PPA
              后，换供应商的成本很高；不过大客户常同时采用多种发电技术，因此多供应商并存并不少见。更大的威胁是其他技术或开发商能用更少资本、更快交付稳定电力。本报告因此重点跟踪项目融资可行性、合同转化和技术学习速度，而不只看品牌。关键是
              Fervo 能否持续扩大成本、工期和信誉上的领先幅度。答案会先体现在合同条款和电站投运节点上。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP012
