      - number: '6.3'
        title: 客户黏性、集中度与未决客户缺口
        blocks:
          - type: paragraph
            body: >-
              客户关系能否持续，目前披露不足。部分交易对手和大致兆瓦规模已知，但续约率、收入集中度，以及少数知名客户占商业订单的比例都还不清楚。最大风险是，在更多客户重复采购之前，业务就固化为「Google
              加几家公用事业公司」。因此，客户集中度和合同期限是下一步尽调重点；在数据披露前，远期估值应计入集中度折价。
            claimRefs:
              - CU006
              - CU010
              - CU012
          - type: table
            tableRef: TU003
            claimRefs: []
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              工程执行是贯穿法律、运营和财务的首要风险。公司申报文件指出，工期延误可能触发合同赔偿；运营又取决于钻井、热储表现和电站调试。Fervo
              正从示范项目迈向首座商业电站，即使是常见的建设超支，也可能显著冲击估值。这解释了为何需求前景虽好，风险评级仍高。投资者应关注风险如何相互放大，而不能孤立看待单一问题；项目融资、客户转化和公开市场预期叠加后尤其如此。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
          - type: table
            tableRef: TR002
            claimRefs: []
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR010
      - number: '7.2'
        title: 合作伙伴、供应商与人才团队风险
        blocks:
          - type: paragraph
            body: >-
              Fervo
              已取得项目融资、签下供应商协议，也建立了上市公司的运营节奏，但这些只能部分缓冲风险。从建设走向稳定发电，仍要靠供应商、贷款方和内部执行团队协同。技术团队扩张是优势，也会在脆弱的放量期增加管理与协调难度。关键不在员工人数本身，而在资产、供应链和上市披露负担同时增加时，公司能否守住运营纪律。建设计划越大，组织与人才风险越容易放大。
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR011
      - number: '7.3'
        title: 投资逻辑失效的触发条件与跟踪指标
        blocks:
          - type: paragraph
            body: >-
              触发下调投资判断的条件很明确：首期电站未能按期送电、框架协议转成正式 PPA 的表现疲弱、融资遇到重大阻碍，或发生任何热储 / HSE
              事故。市场或许能容忍一次延误，却难以接受反复失约。应重点跟踪有明确日期的调试节点、合同转化、资本开支纪律和无事故运营记录。若其中任何一项持续落后，风险就会从可管理的波动变成对投资逻辑的结构性冲击。
            claimRefs:
              - CR009
              - CR010
              - CR012
          - type: table
            tableRef: TR003
            claimRefs: []
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议、确信度与估值立场
        blocks:
          - type: paragraph
            body: >-
              本次更新仍给出「观察」（track）评级。Fervo 已上市，拥有真实需求、更充足的资产负债表，项目融资依据也比 IPO 前扎实。但公开证据支持的仍是「工程交付故事」，还不是已经验证完整的投资标的。IPO
              发行价和上市后市值显示，市场已计入相当一部分未来增长期权。现在公司必须证明，资本开支和工期都能受控，模式也能复制。后续估值要靠实际交付推动，而不是再许诺一次规模化愿景。
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
      - number: '8.2'
        title: 乐观情景与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              乐观情景有其依据：Fervo
              有已签约需求、首笔项目融资先例，切入的市场也可能很大。反面同样清楚：商业化仍取决于首度送电时间、客户转化和热储耐久性。这些因素将决定公司能否把先发优势变成长期股东回报，并非纸面上的理论风险。因此，即便商业故事改善，估值判断仍应审慎。上涨空间存在，但前提是一连串工程环节尚未完全跑通。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV008
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV008
              - CV011
      - number: '8.3'
        title: 情景分析、对标参考与最终尽调诉求
        blocks:
          - type: paragraph
            body: >-
              评估 Fervo，适合用里程碑作参照，而不是直接套一张估值倍数表。IPO 发行价、Baron
              信中提到的后续市值，以及项目融资节点，都是有用的锚点。它们共同说明：公司值得跟踪，但首座商业电站尚未证明整个模式已跑通。尽调应继续盯住按期调试、框架协议转为可融资
              PPA，以及电站投运后的稳定经济性。上述事项得到验证前，估值都应保留显著的工程执行折价。
            claimRefs:
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV003
            claimRefs: []
