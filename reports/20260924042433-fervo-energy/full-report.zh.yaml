  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Fervo 面向的不是「全部电力市场」，而是愿意为稳定供电付费的负荷：买方既要 24/7
              清洁电力，也看重可靠性、脱碳效果和通电速度。它因此要与燃气调峰、光伏配储、风电配储、电网升级等可调度电力方案竞争。估值应锚定这部分真正愿为稳定性溢价买单的客户，而不是美国电力系统的总规模。市场边界也决定资本流向、买方紧迫度和定价能力。定义过宽会夸大机会；聚焦之后，市场仍然可观，但可服务客户更明确。
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
              - CM012
          - type: table
            tableRef: TM001
            claimRefs: []
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
      - number: '2.2'
        title: 需求驱动因素与买方经济账
        blocks:
          - type: paragraph
            body: >-
              AI、数据中心扩张、电气化和制造业回流，都在推高买方对 24/7 电力的需求。Fervo 的披露、Google 协议和 PNNL
              文章指向同一机会：大负荷客户需要可靠的无碳供电；只要项目按期交付，他们愿意提前签长期合同。公用事业、超大规模云厂商和工业企业的预算与采购流程各不相同，却都等不起电网慢慢扩容。采购团队要同时满足供电可靠性和脱碳要求，机房、工厂等终端负荷则不能承受停电。愿意为稳定电力付费，正是这一细分市场成立的关键。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM008
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM011
      - number: '2.3'
        title: 市场测算逻辑与落地约束
        blocks:
          - type: paragraph
            body: >-
              市场规模应从三个角度交叉验证：数据中心用电增长、Fervo
              已签约的供电容量，以及地热项目把地下资源变成可融资兆瓦的实际能力。扩张仍受物理条件约束：钻井、许可审批、并网和项目资本都缺一不可。因此，市场虽有吸引力，落地却取决于工程执行。合同转化率、合同深度，以及买方是否愿意签真正长期的稳定供电协议，仍是待解问题。
            claimRefs:
              - CM009
              - CM010
              - CM012
          - type: table
            tableRef: TM002
            claimRefs: []
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 替代方案与直接竞对全景
        blocks:
          - type: paragraph
            body: >-
              Fervo
              面对的竞争不止其他地热开发商，还包括传统发电商、光伏配储、燃气调峰、电网扩容和园区自备电厂。胜负不只看技术本身，更看谁能以更低的工程风险、更快交付可靠电力。买方实际比较的是工期和融资可行性，而非技术优劣的纸面排名。当客户需要长期、稳定的零碳电力，并愿承担地质和项目融资风险时，Fervo
              的优势最明显。横向比较因此必须看交付进度，也要考虑大客户的实际采购需求。
            claimRefs:
              - CP001
              - CP002
