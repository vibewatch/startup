      - number: '6.2'
        title: 渗透路径与客群分层
        blocks:
          - type: paragraph
            body: >-
              公开信息指向三类客户：超大规模云厂商、公用事业和工业企业。Fervo
              希望把试点信誉转成长期购电合同和表后供电合作，路径是先做试点、拿下早期购电，再在技术和经济性验证后签多年期大单——这是基建版的「先落地、再扩张」。眼下要看这三类客户能否快速拓宽，同时不拖慢签约节奏，从而降低集中度。客户结构越均衡，公司越不必依赖单一云巨头的故事。
