      - number: '1.3'
        title: 资本运作、商业里程碑与未决问题
        blocks:
          - type: paragraph
            body: >-
              商业化进度可从三组数字看出：658 MW 具约束力 PPA、约 $7.2B 已签约储备订单，以及 Cape Station 在建的 500 MW。Google 框架协议和 396 MW PPA
              扩大了潜在需求，但框架协议不等于已转成正式合同，更不代表已有现金流。IPO 募资、项目融资和持续投入暂时支撑着建设；合同条款、转化时间，以及工程延误后是否还需追加资本，仍待厘清。             
              此次更新以最新上市公司披露取代 IPO 前旧假设，判断重心也从融资转向运营。接下来几个季度，要看披露能否改善、调试是否推进、合同能否转化，而不是 IPO 能否完成。
