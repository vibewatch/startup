companyProfile:
  summary: >-
    Fervo Energy 已是一家上市的增强型地热系统（EGS）开发商，靠水平钻井、水力压裂和储层监测，建设模块化的 24/7 清洁电力项目。旗舰项目 Cape Station 在建，Google 合作也带来商业进展，使 Fervo
    成为市场上最受关注的 EGS 公司之一；但这套模式仍极其烧钱，也高度依赖工程交付。
