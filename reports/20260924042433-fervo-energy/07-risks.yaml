chapter:
  number: 7
  title: Risks
  summary: 'Fervo’s main risk is execution: first-power timing, reservoir performance, customer conversion, and capital discipline
    all have to work together for the thesis to hold.'
acknowledgedWarnings:
- dimension: figureType
  reason: The chapter intentionally uses a causal DAG instead of the planned matrix because the risk story is about dependency
    flow and failure propagation, not a scorecard.
sections:
- id: risk-severity
  title: Severity-ranked risk overview
  body: Execution risk is the core issue across legal, operational, and financial dimensions. The filings make clear that
    schedule slips can trigger contractual penalties, while the operational process still depends on drilling, reservoir performance,
    and commissioning outcomes. Because the company is scaling from pilot to first commercial plant, even a relatively ordinary
    construction overrun can become a large valuation event. This is why the risk view stays high even though the commercial
    demand story is attractive. The practical takeaway is that each risk channel can amplify the others, so investors should
    think in terms of compounding failure modes rather than isolated problems. That is especially true once the company starts
    layering project finance, customer conversion, and public-market expectations on top of one another.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  tableRefs:
  - TR001
  - TR002
  figureRefs:
  - FR001
- id: partner-and-people-risk
  title: Partner, supplier, and people risk
  body: 'The company has done some things right: it has project-finance proof, supplier agreements, and a public-company operating
    cadence. But those mitigations are only partial. The company still depends on a chain of vendors, lenders, and internal
    execution leaders to move from construction to steady-state power. A fast-growing technical team is a strength, but it
    also increases control and coordination risk during the most fragile scaling period. The risk is not simply headcount;
    it is whether the organization can keep the same operating discipline while the asset base, supplier set, and public reporting
    burden all grow at once. The bigger the build program becomes, the more the people layer becomes a risk multiplier.'
  claimRefs:
  - CR005
  - CR006
  - CR008
  - CR011
- id: kill-criteria
  title: Thesis-break triggers and monitoring plan
  body: 'The kill criteria are straightforward: a missed first-power date, weak customer conversion from framework to PPA,
    a material financing setback, or any reservoir / HSE incident would all justify lowering the thesis materially. The market
    may be willing to forgive one slip, but not a pattern of slips. That means the monitorable metrics are more important
    than broad optimism: date-specific commissioning milestones, contract conversion, capex discipline, and incident-free
    operations. If any one of those metrics starts to miss repeatedly, the risk profile changes from manageable to structurally
    thesis-threatening.'
  claimRefs:
  - CR009
  - CR010
  - CR012
  tableRefs:
  - TR003
