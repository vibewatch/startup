company:
  name: Fervo Energy
chapter:
  number: 4
  title: Financials
  summary: Fervo is still pre-margin and capital intensive, but the IPO, project-finance proof point, and sizable backlog
    give it a better funding position than the pre-IPO snapshot.
sections:
- id: revenue-and-pricing
  title: Revenue model and pricing visibility
  body: Fervo is still in the transition from development revenue to commercial operating revenue. The public record shows
    only immaterial ancillary fees today, which means the real economic question is not current revenue quality but how quickly
    the company converts contracted megawatts into operating cash flow. The Q2 and Q1 materials, plus the SEC filings, make
    clear that the company is still paying for construction, commissioning, and organizational scale-up before the true commercial
    base arrives. That delay matters because every quarter of delayed commercialization leaves the company more dependent on
    capital markets and project finance to bridge the gap.
  claimRefs:
  - CI001
  - CI002
  - CI003
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: capital-adequacy
  title: Capital adequacy and financing dependency
  body: 'The capital stack is the core financial story. Fervo now has public-equity proceeds and a major project-finance precedent,
    but the company’s build program is still extremely capital intensive. Q2 capex and the 2026 capex guide show that the
    spending curve is still steep. That makes the balance sheet look better than it did pre-IPO, but not yet fully de-risked:
    the next underwriting question is whether construction and commissioning stay on budget and whether additional project
    finance is available on equally good terms. The company has more flexibility now, but the margin for error is still thin
    if capex or commissioning slips.'
  claimRefs:
  - CI004
  - CI005
  - CI006
  - CI007
  - CI012
  tableRefs:
  - TI002
- id: underwriting-gaps
  title: Underwriting gaps and dilution risk
  body: The most important missing data are project-level margins, customer concentration by revenue, and the precise economics
    of the Google-related contracts. The 658 MW backlog is strong evidence of demand, but the market still does not have steady-state
    operating margins to judge. If construction slips or if contract conversion lags, the company may need to fund more of
    the growth path with additional equity or less attractive project capital. That is why the financial view remains constructive
    but not complacent. In short, the missing line items are exactly the ones that would tell investors how much of the upside
    is already spoken for by financing needs.
  claimRefs:
  - CI008
  - CI009
  - CI010
  - CI011
  tableRefs:
  - TI003
