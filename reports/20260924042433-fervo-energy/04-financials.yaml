  title: Public financial gaps and unit economics table
  columns:
  - missing private metric
  - impact
  - exact diligence path
  rows:
  - - Gross margin / segment margin
    - Hard to underwrite commercial economics before first steady-state power
    - Request post-commissioning project-level unit economics
  - - Customer concentration by revenue
    - A few hyperscaler and utility counterparties could dominate future cash flow
    - Obtain contract-by-contract revenue allocation
  - - Run-rate revenue and annualized bookings
    - Still not meaningful in the public filings
    - Track the first few quarters of commercial operation
