  title: Product & Technology
  summary: 'Fervo’s product is a coupled energy system, not software: drill, engineer, monitor, and operate geothermal power
    blocks that are modular but still execution-heavy.'
sections:
- id: product-definition
  title: Product definition and customer workflow
  body: Fervo is not selling software; it is selling firm, always-on electricity produced by a coupled drilling, reservoir,
    and power-block system. In customer terms, the product is a long-duration power contract that can serve data centers,
    utilities, and industrial loads without relying on intermittent generation plus storage. That makes the workflow closer
    to an infrastructure project than a SaaS sale, even though software, sensing, and modeling are increasingly important
    inside the operating stack. The commercial promise is simple, but the operating chain is not — every extra layer of physical
    execution has to clear the same commercial bar before a megawatt becomes bankable.
  claimRefs:
  - CE001
  - CE012
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE001
- id: architecture-and-maturity
  title: Architecture, moduleization, and maturity
  body: The architecture has moved from pilot proof to modular industrialization. Project Red proved the concept, Cape Station
    Phase I is now commissioning, and Phase II is the repeatability test. The design depends on the reservoir learning curve,
    the power-block conversion chain, and a supply base that can reliably deliver ORC turbines, controls, and tubulars. The
    technical question is not whether the system works at all; it is whether it can keep learning fast enough to meet the
    company’s cost and schedule promises. That makes architecture a maturity question as much as a hardware question.
  claimRefs:
  - CE002
  - CE003
  - CE004
  - CE008
  - CE010
  tableRefs:
  - TE003
- id: trust-and-risk
  title: Trust, safety, developer signal, and remaining technical gaps
  body: The public evidence on trust and safety is better than many first-of-kind industrial assets — the company emphasizes
    HSE, reports a low TRIR, and has now attracted PNNL/NVIDIA collaboration and hiring demand in technical roles. But the
    open technical gaps remain real — reservoir durability, induced seismicity, and the long-run fall in installed cost per
    kilowatt are still the things that will determine whether the platform scales from exciting to durable. In other words,
    the technical story is improving, but it is not yet boring — and boring is what a scaled infrastructure platform eventually
    has to become. That is the cost of scale.
  claimRefs:
  - CE005
  - CE006
  - CE007
  - CE009
  - CE011
