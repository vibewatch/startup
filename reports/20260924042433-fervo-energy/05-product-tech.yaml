- id: TE002
  title: Workflow / use-case table
  columns:
  - user job
  - current workflow
  - company solution
  - measurable benefit
  - limitation
  rows:
  - - Need firm power for a data center
    - Grid queue or fossil backup
    - Behind-the-meter or direct PPA geothermal
    - 24/7 carbon-free supply
    - Depends on project timing
  - - Need utility-scale baseload
    - Gas or legacy geothermal
    - EGS GeoBlocks
    - More scalable clean baseload
    - Higher upfront capex
  - - Need reservoir optimization
    - Slow simulation / manual analysis
    - Digital twin with live data
    - Faster operational learning
    - Still being proven at scale
  notes: This workflow lens focuses on the buyer’s job-to-be-done and the measurable value proposition.
- id: TE003
  title: Technology / operating architecture and trust table
  columns:
  - layer/process/component
  - role
  - dependency
  - risk
  rows:
  - - Subsurface drilling and stimulation
    - Create engineered reservoirs
    - Horizontal drilling and rig availability
    - Execution and geology risk
  - - Well-field sensing and modeling
    - Track reservoir behavior
    - Fiber optics and data infrastructure
    - Data quality and model error
  - - Power-block conversion
    - Turn heat into electricity
    - ORC turbines and EPC partners
    - Equipment supply and commissioning risk
  - - HSE / compliance controls
    - Protect people and assets
    - Operational discipline and reporting
    - Induced seismicity / safety / permitting risk
  - - Roadmap / scale-up
    - Repeatable deployment
    - Project finance and modular design
    - Schedule and cost overrun risk
  notes: This table merges architecture, trust, and roadmap because the fast-profile table cap is three and the real diligence
    question is coupled execution.
