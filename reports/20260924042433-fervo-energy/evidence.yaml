evidenceGaps:
  - type: missing-source
    severity: material
    topic: google-framework
    missingEvidence: Fully disclosed contract terms for the Google framework and the 396 MW PPA update
    whyItMatters: The commercial conversion path remains central to revenue visibility and credit quality.
    diligencePath: Obtain the underlying contract documents or an SEC filing with the economic and termination terms.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: sam-som
    missingEvidence: A bottom-up SAM/SOM model for firm-power load by buyer class and geography
    whyItMatters: The size of the addressable wedge is central to valuation but remains only triangulated, not precisely modeled.
    diligencePath: Build a buyer-class load model from public data-center capacity announcements and utility IRPs.
    relatedQuestionRefs:
      - QM007
  - type: missing-source
    severity: minor
    topic: direct-comp-valuation
    missingEvidence: Better direct-source valuation and pricing data for incumbent geothermal and substitute technologies
    whyItMatters: The matrix is qualitative; detailed comparable pricing would sharpen the moat assessment.
    diligencePath: Collect public utility PPA disclosures and market-quote data for geothermal, solar-plus-storage, and gas peakers.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: margin-path
    missingEvidence: Project-level gross margin and long-run cash-flow conversion for Cape Station
    whyItMatters: Without margin visibility, the revenue-quality view remains partly inferential.
    diligencePath: Request post-commissioning operating metrics and project-level economics from management.
    relatedQuestionRefs:
      - QI006
      - QI008
  - type: missing-source
    severity: material
    topic: seismicity
    missingEvidence: Independent, quantified evidence on induced seismicity and reservoir durability at commercial scale
    whyItMatters: These are the main technical uncertainties that could affect long-run economics and permitability.
    diligencePath: Seek third-party geomechanical monitoring data and longer-run operating results from Phase I.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue concentration, renewal rate, and contract-duration disclosures
    whyItMatters: A concentrated customer book would materially affect durability and valuation.
    diligencePath: >-
      Request customer concentration by revenue and contract tenor from management after the next quarterly reporting
      cycle.
    relatedQuestionRefs:
      - QU005
      - QU008
    relatedTableRefs:
      - TU002
