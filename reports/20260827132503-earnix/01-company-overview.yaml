- id: scale-metrics-and-milestones
  title: Scale metrics, global footprint, and milestone caveats
  body: 'Public evidence supports real scale, but with caveats that matter later in the report. TPG’s 2025 release says Earnix has been adopted by over 100 of the largest tier-1 insurance companies in the world and lists customers such as AXA, Generali, Tokio Marine, Banco Santander, IAG, Toyota Financial Services, and Munich Re. The older 2021 funding release adds a process-scale indicator: customers reportedly deliver more than 1 billion quotes per year through Earnix software. Calcalist supplements that picture with named customers such as Tesco Bank and US Bank, and it adds the most useful public operating metrics available today: first operating profit in 2023 and revenue surpassing $100 million in 2024. Headcount is noisier. Calcalist cited about 300 employees in mid-2024, while database sources later widen the range to roughly 201-500 or higher. The safest conclusion is that Earnix is a scaled private enterprise vendor with genuine global reach and improving economics, but still with
    notable disclosure gaps around exact headcount, exact total primary capital raised, and the fully diluted value implied by its recent cap-table transactions.'
