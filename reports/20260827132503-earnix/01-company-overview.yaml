company:
  name: Earnix
chapter:
  number: 1
  title: Company Overview
  summary: Earnix is a long-lived Israeli insurtech and fintech software company founded in 2001 and headquartered in the Ramat Gan/Tel Aviv area, selling AI-driven pricing, rating, underwriting, and personalization software to insurers and banks. Public sources support an inflection from a $75M growth round in 2021 to major shareholder-liquidity events in 2024-2025, including a $120M secondary and a $290M continuation vehicle, while also showing revenue above $100M, first operating profit in 2023, a 2023 CEO transition to Robin Gilthorpe, and global reach across 35+ countries.
sections:
- id: identity-and-positioning
  title: Identity, founding, and market position
  body: 'Earnix is not a newly minted AI wrapper riding a recent market cycle; it is a two-decade-old Israeli enterprise software company that has repeatedly repositioned itself around real-time decisioning for regulated financial institutions. The strongest foundation facts come from a mix of official pages and third-party databases: company materials say Earnix has been serving insurers and banks since 2001, while Tracxn and Start-Up Nation Central both place the company in Israel and date the business to 2001. Current messaging consistently frames Earnix as mission-critical software for pricing, rating, underwriting, and product personalization rather than a lightweight analytics add-on. That positioning matters because it places Earnix closer to core operating infrastructure inside insurance and banking workflows, with the attendant switching-cost and governance implications. Public materials also show a broad international posture: Earnix talks about offices spanning the Americas, Europe,
    Asia Pacific, and Israel, and the 2025 TPG/JVP continuation-vehicle release says the company already operates in more than 35 countries across six continents.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO027
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: leadership-and-governance
  title: Leadership, founders, and governance visibility
  body: 'Leadership visibility is stronger than board transparency. Earnix’s current management page names Robin Gilthorpe as CEO, Ronit Maor as CFO, Sammy Krikler as Founder and Chief Insurance Officer, Craig Campestre as CRO, and Kathy Klingler as CMO, giving the market a current operating-leadership snapshot. The more material inflection was the 2023 CEO transition: Earnix recruited Gilthorpe from outside the company, explicitly replacing Udi Ziv while retaining Ziv on the board. That shift is important because it suggests the company entered a scale-up phase that required a more commercially oriented international operator without fully severing founder-era institutional memory. Governance breadth has expanded through public disclosures: the 2021 Insight-led financing added Jonathan Rosenbaum to the board, Earnix later announced an advisory board, and in October 2024 it added Jessica Buss, the CEO of Argo Group, to the board. Even so, investors should note that the public record still
    does not reveal a full board roster, committee structure, observer rights, or exact post-2025 control map.'
