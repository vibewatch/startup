  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: cap-table
    missingEvidence: Exact current cap table after the 2025 continuation vehicle, including common versus preferred ownership and any rollover LP economics.
    whyItMatters: Ownership concentration matters for governance control, future secondary supply, and any liquidation-preference analysis.
    diligencePath: Request a current cap table and post-transaction board-consent summary from management or lead investors.
    relatedQuestionRefs:
    - QO021
  - type: missing-source
    severity: material
    topic: current-valuation
    missingEvidence: A clean current valuation mark tied to share count and class structure rather than marketing commentary or secondary portals.
    whyItMatters: The investment case changes materially depending on whether the continuation vehicle was done near $1B, well above it, or with structured preferences.
    diligencePath: Obtain the continuation-vehicle term sheet or a board-approved valuation memo.
    relatedQuestionRefs:
    - QO022
  - type: missing-source
    severity: minor
    topic: board-transparency
    missingEvidence: A full board roster including investor directors, independent directors, observers, and committees.
    whyItMatters: Governance quality cannot be fully underwritten from selected appointment releases alone.
    diligencePath: Request governance documents and the latest board list.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A precise employee count by geography as of the run date.
    whyItMatters: Headcount is a useful proxy for operating leverage, go-to-market intensity, and post-acquisition integration burden.
    diligencePath: Validate current HRIS or payroll summary in diligence.
    relatedQuestionRefs:
    - QO024
  - type: conflicting-data
    severity: material
    topic: capital-raised
    missingEvidence: A reconciled schedule of cumulative primary capital raised versus secondary liquidity provided to investors.
    whyItMatters: Public databases disagree materially on lifetime capital raised and mix together company cash with shareholder-liquidity events.
    diligencePath: Request a historical financing ledger from management or lead investors.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: company-overview-to004
    missingEvidence: Additional public evidence to make TO004 exhaustive rather than partial.
    whyItMatters: Enumeration tables summarize the visible public set and should preserve what is still missing.
    diligencePath: Expand the public source pack or confirm the full population directly in diligence.
    relatedTableRefs:
    - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map-TO005
    missingEvidence: Full shareholder register, current board observer rights, and exact ownership percentages beyond the JVP-led majority signal.
    whyItMatters: The stakeholder map is directionally useful, but not exhaustive enough to clear concentration or control questions on its own.
    diligencePath: Request the current cap table, board materials, and shareholder-rights summary.
    relatedTableRefs:
    - TO005
