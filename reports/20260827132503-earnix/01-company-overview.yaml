- id: funding-and-capital-events
  title: Funding history, shareholder liquidity, and ownership concentration
  body: Earnix’s capital history is notable less for repeated primary rounds than for the way secondary and continuation transactions have taken over the story. The last clean primary anchor is the February 2021 $75 million growth round led by Insight Partners, disclosed at a $1 billion pre-money valuation. After that, the public record becomes more complicated. Calcalist reported a June 2024 secondary worth roughly $120 million to $130 million in which early investors Vintage and IGP sold down their positions to JVP, Insight, and the company. Crucially, Calcalist said the transaction did not occur above the 2021 valuation anchor, a meaningful caution signal when reading later enthusiasm. The next major event was the September 2025 $290 million JVP/TPG continuation vehicle. That transaction was not framed as ordinary fresh company financing; it was a single-asset continuation vehicle designed both to provide liquidity to early investors and to increase JVP’s ownership. TPG and JVP further
    said that JVP-led vehicles and associated growth investors would collectively own more than 50% of Earnix, making ownership concentration itself a diligence topic.
