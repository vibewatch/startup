- id: operational-and-product
  title: Operational resilience, cybersecurity, and product execution risk
  body: Operational risk is meaningful because Earnix is inserted into live pricing and underwriting workflows at regulated institutions. DORA raises the bar for customers’ operational-resilience expectations, which in turn raises the bar for vendors. Earnix has constructive public control signals—TLS 1.2, AES-256, SSO, MFA, formal SSDLC practices, annual third-party penetration testing, and trust-center disclosures—but those signals are self-described and incomplete. No reviewed public source quantifies uptime, incident frequency, or SLA attainment. Product breadth compounds the risk surface. Earnix now spans pricing, underwriting, rating, data, telematics, and newer AI-assistant functionality. The 2025 Zelros acquisition adds future upside, but it also increases execution complexity. In practice, the operational question is whether Earnix can maintain reliability and roadmap discipline while remaining deeply integrated into customer environments and partner ecosystems.
  claimRefs:
  - CR006
  - CR007
  - CR008
  - CR009
  - CR010
  - CR016
