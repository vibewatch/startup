- id: partner-financial-and-governance
  title: Partner, customer, financial, and governance risk
  body: 'Several of Earnix’s hardest risks come from what the public record does not quantify. The company clearly benefits from partner ecosystems and blue-chip customer references, but it does not publicly disclose how much revenue depends on those partners or on a handful of large accounts. That leaves real concentration risk. The financial side has the same pattern: public signals are directionally positive, but exact cash, burn, margin, and concentration remain opaque. Governance deserves a separate callout because the 2025 continuation vehicle appears to have increased JVP-led ownership above 50%, while public cap-table and minority-protection details remain thin. Sponsor control can be stabilizing, but it can also narrow outside-investor visibility. The risk is therefore not necessarily weak business quality; it is incomplete transparency around the variables that determine downside exposure and negotiating leverage.'
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR027
