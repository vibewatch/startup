chapter:
  number: 7
  title: Risks
  summary: Earnix’s risk profile is dominated by model-governance regulation, ecosystem dependence, and private-company disclosure opacity rather than by obvious existential distress. The most material external risks come from tightening AI and operational-resilience regimes in insurance and financial services—NAIC AI expectations in the U.S., EIOPA guidance and the EU AI Act in Europe, and DORA-driven operational resilience demands. Internally, the company’s breadth and partner-heavy go-to-market create execution risk, while JVP-led majority ownership and incomplete public financial disclosure create governance and valuation uncertainty for outside investors.
sections:
- id: regulatory-and-legal
  title: Regulatory and legal risk
  body: 'The single most important external risk surface for Earnix is not ordinary software competition; it is the regulatory tightening around AI use in financial decisioning. Insurance underwriting and pricing increasingly sit under explainability, fairness, documentation, and oversight expectations. EIOPA’s 2025 opinion and related factsheet make clear that European insurers must apply robust AI governance in line with existing supervisory regimes and the EU AI Act. In the United States, the NAIC AI bulletin similarly raises expectations for governance, documentation, and risk management by insurers using AI systems. This does not mean Earnix is itself the regulated insurer. But it does mean Earnix sells into customers whose procurement and legal review standards will rise materially if model behavior is hard to explain or audit. That can create both opportunity and friction: vendors with strong governance tooling may benefit, while weak documentation or fairness controls can slow adoption
    or trigger scrutiny.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR018
