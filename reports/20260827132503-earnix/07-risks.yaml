  - - Serious security or resilience event
    - Damages trust in mission-critical workflows
    - Pause investment work immediately
  - - Partner roadmaps absorb core Earnix functionality
    - Weakens differentiation and channel leverage
    - Reassess moat and margin outlook
  - - Weak retention / concentration data in diligence
    - Turns logo breadth into fragile economics
    - Lower valuation or walk away
  - - Acquisition or roadmap integration strain becomes visible
    - Suggests breadth is outrunning execution capacity
    - Raise risk rating and narrow entry range
  notes: These indicators are chosen because they are most likely to surface before full thesis failure becomes obvious in historical financials.
