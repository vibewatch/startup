  evidenceGaps:
  - type: missing-source
    severity: material
    topic: win-rates
    missingEvidence: Public win-rate, displacement, and market-share evidence in enterprise pricing-decisioning deals.
    whyItMatters: Without direct win-loss data, competitive conviction remains narrative-heavy.
    diligencePath: Request pipeline analytics, named competitive takeouts, and customer reference checks.
    relatedQuestionRefs:
    - QP021
  - type: missing-source
    severity: material
    topic: partner-dependence
    missingEvidence: Evidence on how much of pipeline or revenue depends on Guidewire, Verisk, or other ecosystem partners.
    whyItMatters: Partner dependence changes bargaining power and moat durability.
    diligencePath: Request channel-sourced bookings and implementation-source mix.
    relatedQuestionRefs:
    - QP022
    relatedTableRefs:
    - TP002
  - type: missing-source
    severity: minor
    topic: pricing-pressure
    missingEvidence: Public evidence on discounting, bundling, and pricing concessions in large-carrier deals.
    whyItMatters: Competitive pressure often appears first in price, not logo count.
    diligencePath: Request cohort pricing and gross-margin data by customer size.
    relatedQuestionRefs:
    - QP023
  - type: missing-source
    severity: minor
    topic: genai-table-stakes
    missingEvidence: Evidence on whether generative-AI copilots are truly changing vendor selection versus simply matching expectations.
    whyItMatters: If GenAI becomes table stakes, traditional decisioning differentiation may compress.
    diligencePath: Interview recent buyers and compare roadmap adoption across vendors.
    relatedQuestionRefs:
    - QP024
  - type: missing-source
    severity: material
    topic: category-defensibility
    missingEvidence: Evidence that Earnix owns a stable category rather than a transient wedge between core suites and specialists.
    whyItMatters: This is the central anti-thesis for long-term moat durability.
    diligencePath: Use win-loss evidence, renewal data, and partner-dependence analysis to test category ownership.
    relatedQuestionRefs:
    - QP025
