- id: co-opetition
  title: Co-opetition with platforms and data ecosystems
  body: 'The most strategically important competitors are often also partners. Guidewire is the clearest example: Earnix markets a Guidewire accelerator and benefits from the credibility of the Guidewire ecosystem, yet Guidewire’s own platform power means it can influence carrier architecture choices and potentially internalize more pricing functionality over time. Sapiens creates the same pattern in a different geography and segment, using a connector partnership that validates Earnix while also keeping Sapiens in control of a broader carrier-platform relationship. Verisk is different again. It is less a direct software twin and more a structural data and content gatekeeper in commercial-insurance pricing. These relationships are useful because they shorten time-to-value and reduce rip-and-replace friction. But they also cap independence: if a meaningful share of Earnix’s growth depends on riding around dominant ecosystems, then partner roadmaps and channel decisions become part of the
    competitive risk surface.'
  claimRefs:
  - CP004
  - CP007
  - CP013
  - CP014
  - CP015
  - CP023
  - CP024
  - CP027
  - CP028
  - CP035
