  evidenceGaps:
  - type: missing-source
    severity: material
    topic: reliability-metrics
    missingEvidence: Measured uptime, latency, incident frequency, and SLA attainment.
    whyItMatters: Mission-critical decisioning software needs quantified reliability, not only narrative trust statements.
    diligencePath: Request SLA pack, incident postmortems, and availability history.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: stack-independence
    missingEvidence: A decomposition of proprietary product value versus partner connectors and external data dependencies.
    whyItMatters: This affects both technical moat and gross-margin quality.
    diligencePath: Request architecture review and dependency map.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: independent-governance-evidence
    missingEvidence: Third-party assurance or audit evidence for model governance and responsible-AI controls.
    whyItMatters: Self-described controls are useful but not equivalent to external validation.
    diligencePath: Request audit reports, SOC documentation, and model-governance review materials.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE003
