company:
  name: Earnix
chapter:
  number: 5
  title: Product & Technology
  summary: Earnix’s product strategy centers on a cloud-based decisioning platform that spans pricing, underwriting, rating, product personalization, telematics, and adjacent data preparation. Public evidence shows a modular stack—Price-It, underwriting, enterprise rating, Filing Accelerator, Elevate Data, Pricing Accelerator, customer-engagement tools, and Copilot—supported by ecosystem integrations with Guidewire, Sapiens, Verisk, and J.D. Power. The key technical upside is a broad but coherent decisioning layer; the key technical risk is that this breadth depends on integration reliability, responsible-AI governance, and continued differentiation as partner platforms and competitors add their own AI layers.
sections:
- id: product-map
  title: Product map in customer workflow terms
  body: Earnix’s current product architecture reads like a deliberate attempt to own the decisioning layer across several adjacent workflows, not just one actuarial tool. The public module set spans Price-It for dynamic pricing, underwriting decision support, enterprise rating, Filing Accelerator, Pricing Accelerator, Elevate Data, customer-engagement tools, and Copilot. In customer-workflow terms, that means Earnix can participate in designing a rate, governing it, deploying it, operationalizing the underlying data, and increasingly helping business users interact with the workflow more efficiently. This breadth is strategically important. It makes the platform more relevant to multiple stakeholders—pricing, underwriting, product, analytics, and IT—while also creating more cross-sell surfaces inside a single enterprise account. It also means Earnix must prove it is coherent rather than sprawling. Public evidence supports the former narrative today, but the latter remains a diligence risk
    if too many modules become only lightly adopted.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  - CE018
  - CE019
