- id: integrations-and-roadmap
  title: Integrations, ecosystem fit, and roadmap expansion
  body: 'Pre-built integrations are a core part of the product strategy, not a peripheral nice-to-have. Earnix’s Guidewire accelerator explicitly promises fewer manual steps and faster deployment. The Sapiens connector positions Earnix within carrier policy and pricing workflows in EMEA and APAC, while Verisk integration links the platform to ISO ERC content in commercial insurance. This pattern suggests Earnix understands that insurer adoption speed often depends on how gracefully a new decisioning layer fits around incumbent systems. It also suggests why newer features such as Copilot and broader banking AI-decisioning matter: they expand the value proposition within that connected operating layer. But partnership-led acceleration brings a roadmap tradeoff. The more differentiation relies on connectors and ecosystem fit, the more Earnix must track partner priorities and defend its independence if those platforms build deeper native functionality.'
  claimRefs:
  - CE009
  - CE010
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
  - CE028
  - CE029
  - CE035
