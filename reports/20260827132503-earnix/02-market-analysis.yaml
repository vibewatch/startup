  evidenceGaps:
  - type: missing-source
    severity: material
    topic: som-by-segment
    missingEvidence: A bottom-up serviceable obtainable market model by geography, customer tier, and product module.
    whyItMatters: High-level TAM is not enough to underwrite achievable growth or sales-efficiency assumptions.
    diligencePath: Build a bottom-up model from current vertical penetration, target-account counts, and module attach assumptions.
    relatedQuestionRefs:
    - QM021
    - QM022
  - type: missing-source
    severity: material
    topic: buyer-budget-ownership
    missingEvidence: Direct evidence of who signs large pricing-modernization budgets inside tier-1 insurers and banks.
    whyItMatters: Budget ownership determines sales cycle, champion profile, and implementation sequencing.
    diligencePath: Interview former buyers or customers and request pipeline stage data from management.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: minor
    topic: telematics-economics
    missingEvidence: Evidence on profitable telematics monetization versus pilot-level experimentation.
    whyItMatters: Telematics can expand TAM but not every insurer captures economic value from it.
    diligencePath: Request customer case economics or attach-rate data for telematics deployments.
    relatedQuestionRefs:
    - QM024
  - type: missing-source
    severity: minor
    topic: market-concentration
    missingEvidence: Consistent evidence on long-run market concentration within insurance decisioning software.
    whyItMatters: Fragmentation versus concentration changes how durable market share can become.
    diligencePath: Use win-loss data, market-share studies, and customer reference mapping in diligence.
    relatedQuestionRefs:
    - QM025
