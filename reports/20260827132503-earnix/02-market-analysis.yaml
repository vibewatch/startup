chapter:
  number: 2
  title: Market Analysis
  summary: 'Earnix sits inside the overlap of insurance-core modernization, pricing and underwriting decisioning, telematics-enabled personalization, and banking price optimization. Public market studies agree the addressable markets are growing at double-digit rates, but they disagree sharply on exact sizing because some count only AI-in-insurance spend while others include broader P&C software, telematics, or cross-industry price-optimization software. The practical market conclusion is therefore less about one headline TAM and more about a durable buyer pain set: legacy carriers and banks need faster pricing updates, higher governance quality, and better personalization under tighter regulatory scrutiny.'
sections:
- id: market-boundary
  title: Market boundary and what Earnix actually sells into
  body: The right way to size Earnix is to start with product reality, not with the broadest possible insurtech headline. Earnix explicitly targets multiple insurance subsegments—personal P&C, commercial P&C, life, health, and telematics/UBI—and a parallel set of banking verticals including auto finance, mortgages, deposits, personal banking, and commercial banking. That breadth means Earnix is not purely an insurance-core vendor and not purely a generic price-optimization tool. It is better understood as a decisioning-platform company sitting at the intersection of pricing, underwriting, rating, product, and data-governance workflows. The key substitute is not one monolithic incumbent. Rather, Earnix appears to displace combinations of spreadsheets, legacy rating logic, manual filing packages, disconnected analytics, and slow product or rate-governance processes inside regulated institutions. That matters because the practical budget battle is often about improving mission-critical decisions
    faster without forcing a complete rip-and-replace of every surrounding core system.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM015
  - CM016
  - CM029
  - CM030
  - CM034
