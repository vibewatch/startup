  - TM006
- id: drivers-and-constraints
  title: Growth drivers versus adoption constraints
  body: 'The strongest 2026 demand drivers are visible and durable: insurers need better profitability management under claims inflation and more personalized offers under distribution pressure; banks need dynamic pricing as deposit and lending economics shift quickly; and AI has become a board-level topic rather than a pure innovation-team experiment. Earnix’s own 2024 survey that a majority of insurers planned to implement predictive models within two years is directionally constructive. But strong demand does not eliminate friction. Governance and explainability are now part of the buying checklist. Integration complexity remains high because decisioning sits across product, actuarial, underwriting, pricing, and IT data flows. Telematics is especially double-edged: it expands the value pool but only where insurers have the data plumbing, economics, and customer-consent model to monetize it. The market is therefore structurally attractive, but it is not frictionless, and vendor execution
    on deployment, governance, and change management matters as much as raw analytics capability. Public evidence also suggests buyers are not purchasing a generic horizontal AI tool: they are funding governed workflow change inside actuarial, product, underwriting, and lending teams that must coordinate with compliance, IT, and business owners. That makes the addressable budget larger than a point pricing widget, but smaller and slower-moving than a whole-core-system narrative.'
