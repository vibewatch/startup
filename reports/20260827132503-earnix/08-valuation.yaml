company:
  name: Earnix
chapter:
  number: 8
  title: Valuation
  summary: The cleanest valuation anchor for Earnix remains the February 2021 $1B pre-money funding round. Later events—the 2024 $120M-$130M secondary and the 2025 $290M continuation vehicle—show liquidity and investor conviction but do not disclose a clean new post-money valuation. With public revenue signals only indicating that Earnix crossed $100M in 2024, the supportable current range is roughly $1B-$2B, which implies approximately 10x-20x revenue on the most visible public revenue threshold. That can be defensible for a scaled, profitable, mission-critical vertical-AI software asset, but it is not obviously cheap relative to public decisioning and insurance-software comps; the right call is therefore Track / Research-More with medium confidence and a fair-to-stretched price stance depending on entry point.
sections:
- id: valuation-anchor-and-context
  title: Valuation anchor, capital context, and what is actually known
  body: The first rule in valuing Earnix is to separate hard anchors from implication. The hard anchor is the February 2021 $75 million growth round at a $1 billion pre-money valuation. After that, public evidence becomes structurally noisier. The June 2024 secondary provided large-scale liquidity but, according to Calcalist, did not clear above the 2021 valuation. The September 2025 continuation vehicle was even larger, but it was primarily an ownership-and-liquidity structure rather than a plain new primary round, and it did not disclose a clean post-money mark. That leaves investors with conviction signals but not precise price signals. This is why the right current range must be wide. Public evidence supports that sophisticated capital still values the asset highly enough to stay involved, but it does not yet support a single exact current valuation that can be treated as fact.
  claimRefs:
