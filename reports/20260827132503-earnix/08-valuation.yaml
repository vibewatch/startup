- id: scenario-work
  title: Bull, base, and bear scenario ranges
  body: 'The scenario framework should be range-based, not point-based. The bull case assumes that Earnix’s real revenue base is already meaningfully above the public $100 million threshold, that profitability deepens, that blue-chip customer quality remains durable, and that the broadened product layer across pricing, underwriting, banking, and newer AI features compounds into a premium software multiple. The bear case assumes that the public threshold is close to the true scale, that concentration and partner dependence are higher than expected, and that the 2024 secondary’s flat valuation signal is the better guide to price discipline. The base case splits the difference: strong asset, good sponsor support, real operating scale, but unresolved private-company opacity. That structure naturally points to a range roughly between $1 billion and $2 billion rather than a precision target.'
  claimRefs:
  - CV010
