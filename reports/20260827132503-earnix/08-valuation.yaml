- id: recommendation-and-triggers
  title: Recommendation, diligence asks, and thesis-break triggers
  body: 'The correct investment posture is neither dismissive nor price-insensitive. Earnix looks like a strong private asset: scaled, globally relevant, sponsor-backed, and apparently profitable at the operating level. That is enough to keep the company on a serious watch list. But it is not enough to justify paying any offered price. The missing information is exactly the information that converts a good company into a good investment—current ARR, retention, gross margin, cash runway, concentration, share count, preference stack, and the actual economics of the continuation vehicle. Without those details, a fair entry could become a stretched one very quickly. The right recommendation is therefore Track / Research-More with medium confidence, a high risk rating, and a fair-to-stretched valuation stance depending on entry point. A weak future financing, poor retention data, or visible regulatory and execution friction would break the thesis quickly. Another reason to stay range-based is
    public-market volatility itself. Even high-quality listed analytics and insurance-software names moved meaningfully through 2025-2026, which means any private premium needs to be justified by clearly superior growth, margins, or strategic control. Without that evidence, the rational stance is to maintain interest while refusing false precision. Price discipline still matters.'
