- id: multiple-framework
  title: Implied multiple framework and public comparable set
  body: 'The best current public earnings proxy is still crude: Calcalist said Earnix crossed $100 million in revenue in 2024 and reached first operating profit in 2023. If that threshold is used conservatively as the visible revenue base, a $1 billion to $2 billion valuation implies roughly 10x to 20x revenue. That is not outrageous for a profitable, mission-critical vertical AI and decisioning vendor, but it is not automatically cheap. Public comps help triangulate. Guidewire’s August 2026 market cap and revenue data imply roughly 11.8x trailing revenue; Verisk implies roughly 7.9x. Earnix can deserve a premium to some public insurance-software references because of growth, private optionality, and decisioning depth, but paying meaningfully above those public comp ranges requires confidence in metrics that the public record does not disclose. In other words, the multiple argument is plausible but under-evidenced.'
  claimRefs:
