    - ARR, margin, and cash disclosure
  - - Customer quality
    - 100+ tier-1 insurers and blue-chip banks
    - Concentration and retention unknown
    - Top-account mix and NRR / GRR
  - - Product depth
    - Mission-critical decisioning layer across pricing and underwriting
    - Partner dependence and broad roadmap risk
    - Usage, renewal, and implementation evidence
  - - Capital support
    - Sophisticated sponsors keep increasing exposure
    - Continuation structures can extend private-duration and control concentration
    - Cap table and sponsor time-horizon disclosure
  notes: The bull case is fundamentally about quality; the anti-thesis is fundamentally about price and opacity.
