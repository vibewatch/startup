  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: arr
    missingEvidence: Current ARR and its bridge to recognized revenue.
    whyItMatters: ARR is essential for valuation and revenue-quality analysis.
    diligencePath: Request current board metrics deck and audited or reviewed management accounts.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI005
  - type: missing-source
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current cash balance, burn, and runway after the continuation vehicle.
    whyItMatters: Sponsor support is not the same as balance-sheet certainty.
    diligencePath: Request treasury summary, monthly burn, and 12-18 month cash forecast.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: gross-margin
    missingEvidence: Gross margin after cloud, data, implementation, and support costs.
    whyItMatters: This determines whether Earnix behaves like premium enterprise SaaS or a heavier delivery model.
    diligencePath: Request gross-margin bridge by product and services component.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI003
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Account concentration, renewal, and expansion metrics.
    whyItMatters: The business can appear healthier or riskier depending on a handful of major carrier and bank relationships.
    diligencePath: Request top-customer revenue share, NRR, and GRR by cohort.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI005
  - type: conflicting-data
    severity: material
    topic: capital-history
    missingEvidence: A reconciled capital history distinguishing company primary capital from shareholder-liquidity transactions.
    whyItMatters: Public raised figures conflict materially across third-party sources and could misstate leverage or dilution.
    diligencePath: Request historical financing ledger and share-class schedule.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI004
