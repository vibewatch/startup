  - - Cash / burn / runway
    - Determines financing dependency
    - Not disclosed publicly
    - Request board package and treasury summary
  - - Gross margin
    - Determines true software economics
    - Not disclosed publicly
    - Request segment gross-margin bridge
  - - Customer concentration and NRR
    - Determines revenue durability
    - Not disclosed publicly
    - Request top-20 account breakdown and retention cohort
  - - Primary vs secondary capital history
    - Determines cash actually received by company
    - Conflicted in public sources
    - Request financing ledger and cap table
  notes: These blockers are exactly the metrics needed to convert positive public signals into investable underwriting conviction.
