  figureRefs:
  - FU002
- id: customer-risks-and-verdict
  title: Concentration risks, modernization friction, and verdict
  body: 'The core customer risk is not lack of logos; it is lack of portfolio economics. Earnix’s reference set skews toward major insurers, banks, and lenders, which is impressive but can hide concentration if a handful of very large accounts dominate bookings, renewals, or roadmap influence. Procurement friction also likely remains high because these are deeply integrated regulated deployments with multiple stakeholders and long implementation paths. The reviewed public record does not quantify implementation timelines, production-customer count, or the mix of live deployments versus historical logos. Enlyft offers only a directional estimate, not management-grade truth. The supportable verdict is therefore constructive: Earnix clearly has real adoption and credible logos, but investors still need account concentration, renewal, and production-status evidence before treating public customer breadth as equivalent to durable, diversified revenue quality. For investors, that means the customer
    story is good enough to clear the “real adoption” bar, but not the “fully underwritten retention and concentration” bar. The public evidence proves logos, workflows, and some outcome narratives; it does not prove cohort economics, deployment breadth within each account, or the revenue concentration that matters most to downside protection. Investors still need cohort economics before treating customer proof as full durability proof. Public customer logos alone do not resolve unit economics or renewal quality. Public evidence remains incomplete.'
