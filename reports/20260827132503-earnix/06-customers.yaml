- id: durability-and-expansion
  title: Durability, expansion path, and channel dependence
  body: The durability story is plausible but under-disclosed. Calcalist’s reporting that customers pay annual usage fees and sign three-to-five-year agreements is the best direct public signal that Earnix relationships are not merely short pilots. The continuation release’s emphasis on blue-chip insurer adoption also points toward enterprise-grade rather than experimental deployments. But the durability case remains incomplete because public sources do not provide GRR, NRR, churn, seat expansion, module attach, or cohort renewal metrics. Channel dependence also deserves attention. The Co-operators reference and other ecosystem narratives show that Earnix often lands around incumbent systems and partner connectors, which may be good for adoption but also means some customer acquisition and retention dynamics are intertwined with broader platform ecosystems. Publicly, the company looks sticky. Economically, the strength of that stickiness is still unproven.
  claimRefs:
  - CU013
  - CU016
  - CU021
  - CU022
  - CU023
  - CU024
  - CU026
  - CU029
  - CU032
  tableRefs:
