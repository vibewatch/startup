- id: named-proof
  title: Named customer proof and observed outcome themes
  body: 'Earnix’s public customer proof is strongest on named-reference quality and repeated workflow outcomes. The case-study set spans Gore Mutual, LINK4, Hollard, Warta, BavariaDirekt, BGL, Domestic & General, and Co-operators, while press releases add CSOB Insurance, NatWest, Angle Auto Finance, Matmut, and Simpego. Across these sources, the recurring outcome claims are consistent: faster model deployment, better pricing responsiveness, improved personalization, more automation, and stronger governance around rating and product changes. The breadth of use cases also matters. The U.S. financial institution auto-loan example, NatWest mortgage work, and Simpego telematics proof demonstrate that Earnix can travel beyond standard personal-lines pricing. This does not prove uniform portfolio quality, but it does support a real production footprint across multiple product lanes and geographies.'
  claimRefs:
