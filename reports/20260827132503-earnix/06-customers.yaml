  - type: missing-source
    severity: blocking
    topic: concentration
    missingEvidence: Revenue concentration by top account, geography, and ecosystem partner channel.
    whyItMatters: A few large logos could dominate the business even if the public brand set is broad.
    diligencePath: Request top-customer mix, channel-sourced bookings, and geographic revenue split.
