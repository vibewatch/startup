chapter:
  number: 6
  title: Customers
  summary: Customer evidence for Earnix is strong on named logos and workflow outcomes, but weak on portfolio economics. Official pages and case studies show adoption across insurers and banks in more than 35 countries, with public references including Gore Mutual, LINK4, Hollard, BavariaDirekt, Warta, Domestic & General, Co-operators, CSOB Insurance, NatWest, Angle Auto Finance, Matmut, Tesco Bank, US Bank, Banco Santander, Generali, IAG, and Toyota Financial Services. The public record supports real enterprise adoption and multi-year relationships, yet it does not disclose retention, churn, NRR, top-account concentration, or the share of revenue contributed by ecosystem partners and marquee logos.
sections:
- id: customer-base
  title: Customer base segmentation and geographic breadth
  body: Public evidence supports meaningful customer breadth across both insurance and banking. The official customer page positions Earnix as serving insurers and financial institutions, while the TPG continuation release says the company operates in more than 35 countries across six continents and has been adopted by over 100 of the largest tier-1 insurers in the world. That is not a small-vendor proof set. It suggests a customer base skewed toward large, regulated institutions that care about pricing, product, and underwriting workflows. Importantly, the named-customer set is not insurance-only. TPG and Calcalist together surface Banco Santander, Toyota Financial Services, Tesco Bank, and US Bank alongside carrier names such as AXA, Generali, IAG, and Tokio Marine. The result is a customer map broader than a typical P&C insurtech reference page, although precise customer count and revenue mix remain undisclosed.
