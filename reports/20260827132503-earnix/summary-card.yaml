  topStrengths:
    - >-
      Earnix occupies a valuable decisioning layer across pricing, underwriting, rating, and product personalization
      rather than a single narrow insurtech feature.
    - >-
      Public sources support real operating scale: 35+ countries, 100+ tier-1 insurer references, revenue above $100M in
      2024, and first operating profit in 2023.
    - >-
      The company has strong sponsor support, highlighted by the 2025 JVP/TPG continuation vehicle and JVP-led majority
      ownership.
    - >-
      Product breadth across insurance and banking, plus integrations with Guidewire, Sapiens, and Verisk, improves
      strategic relevance and cross-sell potential.
    - >-
      Trust-center, governance, and security messaging are more explicit than at many private software peers selling
      into regulated markets.
  topRisks:
    - >-
      Current ARR, margin, concentration, cash runway, and share-class economics remain undisclosed, limiting valuation
      precision.
    - >-
      AI-governance, explainability, and operational-resilience rules in insurance can slow adoption and raise
      compliance burdens for customers and vendors.
    - >-
      The 2024 secondary reportedly did not clear above the 2021 valuation, a cautionary price signal despite later
      sponsor enthusiasm.
    - >-
      Partner and ecosystem dependence around connectors and adjacent platforms can weaken leverage if those partners
      deepen native capabilities.
    - >-
      Broad product scope plus the Zelros integration can create roadmap and execution strain if adoption does not scale
      evenly across modules.
  unresolvedGaps:
    - Current ARR, NRR/GRR, gross margin, and cash runway are not publicly disclosed.
    - The exact valuation and security structure used in the 2025 continuation vehicle remain undisclosed.
    - Revenue concentration by customer, geography, and partner channel is not public.
    - No public source provides a current fully diluted cap table or liquidation-preference stack.
    - Public reliability and production-governance metrics are weaker than the narrative trust posture.
