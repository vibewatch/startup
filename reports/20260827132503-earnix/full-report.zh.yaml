      - number: '8.2'
        title: 隐含倍数框架与公开可比公司集合
        blocks:
          - type: paragraph
            body: >-
              目前最好的公开盈利代理指标仍然粗糙：Calcalist 称 Earnix 2024 年收入跨过 $100M，并在 2023 年首次运营盈利。如果保守地把这个门槛用作可见收入基础，$1B 到 $2B 的估值意味着约
              10x 到 20x 收入。对于一家盈利、关键任务型的垂直 AI 和决策供应商来说，这并不离谱，但也不会自动显得便宜。公开可比公司有助于三角测算。Guidewire 2026 年 8 月市值和收入数据隐含约
              11.8x 往绩收入；Verisk 隐含约 7.9x。由于增长、私有资产可选性和决策深度，Earnix
              可能配得上相对部分公开保险软件参照物的溢价；但若要显著高于这些公开可比区间，就需要对公开记录没有披露的指标有信心。换句话说，倍数论证可信，但证据不足。
