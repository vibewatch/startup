  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现可见度
        blocks:
          - type: paragraph
            body: >-
              公开记录支持清晰的变现逻辑，即便还不足以支持完整收入会计精度。Earnix 向保险公司和银行的定价、承保、费率厘定和产品工作流销售软件。产品页面一贯把公司定位为关键企业软件，而不是项目制咨询。最具体的商业细节来自
              Calcalist：报道称客户支付年度用量费，典型协议期限为三到五年。这是有价值的信号：它暗示关系具备经常性和一定合同耐久度，而不是短周期试点。模块图谱在财务上也重要。Earnix
              覆盖定价、承保、费率厘定、数据准备和银行决策，如果客户先成功部署一个工作流，再增加另一个工作流，商业模式适合先落地再扩张。公开证据对准确标价、折扣、实施费或收入确认政策很弱，但底层变现结构明显以软件和经常性收入为主。
