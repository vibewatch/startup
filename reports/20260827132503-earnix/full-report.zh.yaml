        title: 信任控制、治理与技术结论
        blocks:
          - type: paragraph
            body: >-
              作为私有软件公司，Earnix 对信任控制披露得少见地明确。其公开信任材料描述了传输中数据使用 TLS 1.2、静态数据使用 AES-256、支持 SSO 和 MFA、正式 SSDLC 流程、OWASP 和
              CIS
              等参考框架，以及年度第三方渗透测试。产品发布也强调定价和费率工作流中的透明度、治理和可解释性。这些都是有意义的正面因素，因为受监管客户不会轻易购买黑箱决策。尽管如此，公开信任证据来自公司自述且不完整。已审阅材料没有提供量化可用性、延迟、公开
              SLA 达成情况，也没有在广泛合规声明之外提供模型治理质量的独立公开审计。因此，正确的技术结论偏建设性：平台看起来宽、模块化且有治理意识，但投资者仍应把可靠性指标、集成负担和 Copilot
              的实际采用视为未解决的尽调问题。技术尽调重点因此从「Earnix
              是否具备真实产品宽度」转向「这种宽度能否被可重复地实施、治理和集成」。受监管市场买方不仅关心功能覆盖，也会关心发布纪律、连接器耐久度、模型治理工作流，以及进入生产仍需要多少客户定制服务。
