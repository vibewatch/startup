      - number: '2.3'
        title: 买方分层、采用路径与交易成因
        blocks:
          - type: paragraph
            body: >-
              保险和银行的买方行为不同，但核心逻辑相近：受监管金融机构希望定价和风险决策更灵敏，同时不丢治理。在保险领域，定价负责人、精算师、承保人、产品团队以及 CIO
              支持的转型小组都有合理采购动因，因为定价更新会影响增长、综合成本率、监管合规和经纪人响应速度。在银行领域，预算逻辑更多落在贷款、存款、按揭和消费金融产品负责人身上，他们需要更快守住利差并个性化报价。采用路径也更偏叠加层和集成，而不是全栈替换。Earnix
              围绕连接器、加速器和智能运营的定位暗示，机构往往想改善现有系统，而不是整体重写相邻系统。这有商业吸引力，因为项目范围更小；但也意味着 Earnix 必须反复证明集成可靠性和跨职能工作流变革，而不只是模型质量。
