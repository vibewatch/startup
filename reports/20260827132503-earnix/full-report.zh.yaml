        title: 投资建议、尽调要求与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              正确的投资姿态既不是轻视，也不是对价格不敏感。Earnix
              看起来是一项强私有资产：已具规模、全球相关性强、有资方背书，并且表面上达到运营盈利。这足以让公司留在严肃观察名单上。但这不足以支持任何报价都能接受。缺失信息恰恰是把好公司转化为好投资的信息——当前
              ARR、留存、毛利率、现金跑道、集中度、股数、优先股堆叠，以及延续基金的真实经济条款。没有这些细节，公平入场价可能很快变成偏高入场价。因此，合理建议是 观察 /
              继续研究，中等置信度、高风险评级，并根据入场点给出合理到偏高的估值立场。未来融资转弱、留存数据不佳，或监管与执行摩擦变得可见，都会快速击穿投资逻辑。另一个保持区间思维的理由，是公开市场本身波动很大。即便高质量上市分析和保险软件公司，2025-2026
              年也出现明显波动，这意味着任何私有市场溢价都需要由明显更好的增长、利润率或战略控制来证明。没有这些证据，理性姿态就是保持兴趣，同时拒绝虚假精度。价格纪律仍然重要。
