  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：既有厂商、邻近玩家与专业厂商
        blocks:
          - type: paragraph
            body: >-
              Earnix 的竞争集合比一张简单保险科技清单更宽，因为它切入的是被其他软件包围的关键工作流。第一层竞争者是全套现代化和保险核心系统供应商——Guidewire、Duck
              Creek、Sapiens、Majesco、Socotra、EIS，以及在某些场景下的 Verisk。即便它们不是完全相同的定价供应商，也能争夺同一笔 CIO
              预算，因为它们掌握相邻工作流界面、装机基础更强，或拥有更宽的转型项目。第二层是 FRISS、Gradient AI、ZestyAI、hyperexponential 等专业 AI
              厂商，攻击欺诈、风险选择、财产分析或定价基础设施等更窄的工作流切片。Earnix
              的品类主张只有在同时看清这两层后才成立：公司既不是一体化保险核心，也不是单功能利基工具。它靠足够宽、足以重要的决策层胜出，同时又比完整核心系统替换更聚焦、更快部署。
