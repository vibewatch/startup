  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚点、资本背景与已知事实
        blocks:
          - type: paragraph
            body: >-
              给 Earnix 估值的第一原则，是把硬锚点和推断分开。硬锚点是 2021 年 2 月 $75M 成长轮，投前估值 $1B。此后，公开证据结构性变得更嘈杂。2024 年 6 月老股交易提供了大规模流动性，但据
              Calcalist 称，并未突破 2021 年估值。2025 年 9
              月延续基金规模更大，但主要是所有权与流动性结构，而非普通的新一轮一级融资，并且没有披露干净的投后估值。这给投资者留下的是信心信号，而不是精确价格信号。因此，合理的当前区间必须足够宽。公开证据支持成熟资本仍认为这项资产有足够高价值、值得继续参与，但还不足以支持把某一个精确当前估值当作事实。
