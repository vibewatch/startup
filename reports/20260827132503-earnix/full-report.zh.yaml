      - number: '7.3'
        title: 合作伙伴、客户、财务与治理风险
        blocks:
          - type: paragraph
            body: >-
              Earnix
              几项最难评估的风险，来自公开记录没有量化的部分。公司显然受益于合作伙伴生态和蓝筹客户背书，但没有公开披露多少收入依赖这些伙伴或少数大客户。这留下了真实集中度风险。财务侧也是同样模式：公开信号方向积极，但准确现金、烧钱速度、利润率和集中度仍不透明。治理需要单独点出，因为
              2025 年延续基金似乎把 JVP 主导持股提高到 50%
              以上，而公开股权结构和少数股东保护细节仍很薄。资方控制可以带来稳定，但也可能压缩外部投资者可见度。因此，风险不一定是业务质量弱，而是决定下行敞口和谈判杠杆的变量透明度不足。
