    columns:
      - 敏感性杠杆
      - 低端结果
      - 高端结果
      - 为何重要
    rows:
      - - 当前收入基数
        - 接近公开 $100M 门槛
        - 显著高于公开门槛
        - 倍数压缩或扩张的最重要驱动
      - - 利润率质量
        - 早期 / 混合盈利
        - 可扩展的软件利润率，效率强
        - 决定溢价倍数是否站得住
      - - 留存与集中度
        - 队列表现不透明或偏弱
        - 强续约和多元收入基数
        - 改变下行保护和退出质量
      - - 资本结构
        - 优先权过重，或普通股敞口被稀释
        - 更干净的股份类别经济性
        - 可能实质改变普通股吸引力
    notes: 敏感性桥说明，建议更多取决于隐性的经营和结构细节，而不是一个静态标题估值。
