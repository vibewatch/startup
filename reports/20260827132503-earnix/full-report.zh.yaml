      - number: '3.4'
        title: 竞争结论与反向证据
        blocks:
          - type: paragraph
            body: >-
              正向竞争逻辑是，Earnix
              可以占据一个有价值的中间层：比单点工具更宽，比全套替换更轻，并且在保险和银行两端都有可信度，介于行动迟缓的既有核心系统和狭窄专业厂商之间。反向竞争逻辑同样重要。既有厂商可以向内扩张，尤其当 AI
              副驾和嵌入式分析变成标配。专业厂商可以向外扩张，尤其当客户更看重定向 ROI
              而不是平台宽度。已审阅的公开来源也没有量化胜率、替换率、生态收入依赖或实际企业交易中的定价压力。因此，公开证据支持一个可防守的竞争位置，但还不能证明一个已经坐稳、永久可防守的品类。投资者应把 Earnix
              视为拥挤赛道中位置不错的竞合玩家，而不是无人挑战的标准。竞争层面的启示是，当买方想要受治理的决策叠加层，并且改变速度快于核心系统发布周期时，Earnix
              可能胜出；当保险公司或银行希望把更多工作流整合到既有平台里，或专业厂商能在欺诈、财产风险建模等单一窄工作流中证明更深能力时，Earnix 更弱。
