      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              2026 年最强的需求驱动因素清晰且耐久：理赔通胀下，保险公司需要更好的盈利管理；分销压力下，保险公司需要更个性化的报价；存款和贷款经济性快速变化，银行需要动态定价；AI
              已成为董事会层面的议题，不再只是创新团队实验。Earnix 自己的 2024
              年调研显示，多数保险公司计划在两年内部署预测模型，这在方向上利好。但强需求不会消除摩擦。治理和可解释性已进入采购清单。集成复杂度仍高，因为决策横跨产品、精算、承保、定价和 IT
              数据流。车联网尤其两面性：它扩大价值池，但只有保险公司具备数据管道、经济性和客户同意模式时才能变现。因此，这个市场结构上有吸引力，但并非没有摩擦；供应商在部署、治理和变革管理上的执行力，与原始分析能力同样重要。公开证据还显示，买方购买的不是泛化横向
              AI 工具，而是在精算、产品、承保和贷款团队内部资助受治理的工作流变革，这些团队必须与合规、IT 和业务负责人协调。可寻址预算因此大于单点定价小工具，但小于、也慢于整套核心系统叙事。
