        title: 领导层、创始人与治理可见度
        blocks:
          - type: paragraph
            body: >-
              领导层可见度高于董事会透明度。Earnix 当前管理层页面列出 Robin Gilthorpe 为 CEO、Ronit Maor 为 CFO、Sammy Krikler 为创始人兼首席保险官、Craig
              Campestre 为 CRO、Kathy Klingler 为 CMO，给市场提供了最新运营领导层快照。更关键的拐点是 2023 年 CEO 更替：Earnix 从外部引入 Gilthorpe，明确接替 Udi
              Ziv，同时让 Ziv 留任董事会。这个变化重要，因为它暗示公司进入规模化阶段，需要更偏商业化的国际运营者，同时没有完全切断创始期的组织记忆。公开披露显示治理宽度也在扩大：2021 年 Insight 领投融资让
              Jonathan Rosenbaum 加入董事会，Earnix 后来宣布成立顾问委员会，并在 2024 年 10 月把 Argo Group CEO Jessica Buss
              加入董事会。即便如此，投资者仍应注意，公开记录没有披露完整董事会名单、委员会结构、观察员权利或 2025 年后的精确控制权图谱。
