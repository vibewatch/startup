      - number: '1.4'
        title: 规模指标、全球覆盖与里程碑限制
        blocks:
          - type: paragraph
            body: >-
              公开证据支持 Earnix 已有真实规模，但后文分析仍需要带上几个限制。TPG 2025 年新闻稿称，Earnix 已被全球 100+ 家最大一级保险公司采用，并列出 AXA、Generali、Tokio
              Marine、Banco Santander、IAG、Toyota Financial Services 和 Munich Re 等客户。较早的 2021 年融资新闻稿补充了流程规模指标：据称客户每年通过
              Earnix 软件交付超过 10 亿次报价。Calcalist 又补上 Tesco Bank、US Bank 等具名客户，并给出目前最有用的公开经营指标：2023 年首次运营盈利，2024 年收入超过
              $100M。员工数噪音更大。Calcalist 在 2024 年中引用约 300 名员工，而数据库来源随后把区间拉宽到约 201-500 人或更高。最稳妥的结论是，Earnix
              是一家已有规模的私有企业软件供应商，全球触达真实、经济性在改善，但在准确员工数、累计新股融资总额以及近期股权结构交易隐含的完全摊薄价值上，仍有明显披露缺口。
