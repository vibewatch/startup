              情景框架应基于区间，而不是单点。乐观情景假设 Earnix 的真实收入基础已经明显高于公开 $100M 门槛、盈利能力加深、蓝筹客户质量保持耐久，并且横跨定价、承保、银行和较新 AI
              功能的扩展产品层，能复合出溢价软件倍数。悲观情景假设公开门槛接近真实规模、集中度和伙伴依赖高于预期，且 2024
              年老股交易的平价估值信号更能指导价格纪律。基准情景取中间：资产强、资方支持好、运营规模真实，但私有公司不透明性尚未解决。该结构自然指向大约 $1B 到 $2B 的区间，而不是精确目标。
