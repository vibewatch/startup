      - number: '2.2'
        title: 用多重视角测算市场，而非押注单一 TAM
        blocks:
          - type: paragraph
            body: >-
              公开市场研究支持一个庞大且增长中的机会，但不应把它们揉成一个带虚假精度的单一 TAM。保险 AI
              报告聚焦承保、理赔和风险分析，把当前支出放在低双位数十亿美元区间。保险车联网研究捕捉到另一个相邻资金池，随着联网汽车和按用量计费模式扩张，该市场也在快速增长，但不同地区和定义下的数字差异很大。更广义的价格优化软件报告规模小得多，因为它们聚焦一个横跨多行业、范围更窄的软件类别。P&C
              软件研究则大得多，因为纳入了更广的核心系统和运营技术支出。分析结论很直接：Earnix
              同时参与几个扩张中的类别，正确尽调方法是用多重视角交叉测算机会，而不是假装一个市场研究标题就能概括这家公司。这也意味着，如果投资者偏好某一个视角，TAM 可能被明显高估或低估。
