      - number: '1.3'
        title: 融资历史、股东流动性与所有权集中
        blocks:
          - type: paragraph
            body: >-
              Earnix 的资本历史值得关注，不是因为它反复新股融资，而是因为老股和延续基金交易逐渐接管叙事。最后一个干净的新股锚点是 2021 年 2 月 Insight Partners 领投的 $75M
              成长轮，披露投前估值为 $1B。此后，公开记录变得更复杂。Calcalist 报道，2024 年 6 月发生了一笔约 $120M-$130M 的老股交易，早期投资方 Vintage 和 IGP 向
              JVP、Insight 及公司出售部分持股。关键是，Calcalist 称该交易并未高于 2021 年估值锚点；读到后续乐观叙事时，这是一个有意义的警示信号。下一项重大事件是 2025 年 9 月 $290M 的
              JVP/TPG 延续基金。该交易并未被包装为普通新增公司融资，而是单一资产延续基金，既给早期投资者提供流动性，也提高 JVP 持股。TPG 和 JVP 还称，JVP 主导的载体及相关成长型投资者将合计持有
              Earnix 超过 50%，使所有权集中本身成为尽调议题。
