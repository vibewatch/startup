  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Earnix 最重要的外部风险面不是普通软件竞争，而是金融决策中 AI 使用监管趋严。保险承保和定价越来越受到可解释性、公平性、文档和监督预期约束。EIOPA 2025
              年意见书及相关事实表明，欧洲保险公司必须按照现有监管框架和 EU AI Act 应用稳健 AI 治理。美国 NAIC AI bulletin 同样提高了使用 AI
              系统的保险公司在治理、文档和风险管理上的预期。这并不意味着 Earnix 自身就是受监管保险公司。但它确实意味着，Earnix
              卖给的客户会在采购和法务审查中大幅提高标准，尤其当模型行为难以解释或审计时。由此会同时产生机会和摩擦：治理工具强的供应商可能受益，而文档或公平性控制薄弱会拖慢采用，甚至引发审查。
