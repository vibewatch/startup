            body: >-
              财务牵引力有两种可见形式：明确的增长 / 盈利信号，以及反复出现的客户 ROI 叙事。Calcalist 报道，Earnix 2024 年收入跨过 $100M 门槛，并在 2023 年首次运营盈利。Earnix
              2024 年 10
              月董事会公告又补上一层：公司在保持持续盈利议程的同时，正朝数亿美元收入规模扩张。这些都是有用信号，但仍是私有公司表述和媒体报道，不是上市公司经审计文件。销售效率代理指标更多是定性的。客户和产品页面强调更快模型部署、更好定价控制、个性化和利润率改善——这些信息通常支撑企业
              ROI 销售。但同样的工作流复杂度让产品更粘，也可能拉长销售周期，并要求精算、产品、承保和 IT 团队协同。因此，公开证据指向可信牵引力和有意义的企业价值，但还没有量化 CAC、回本周期或转化模型。
