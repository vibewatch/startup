  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与 Earnix 实际切入的工作流
        blocks:
          - type: paragraph
            body: >-
              给 Earnix 定市场规模，正确起点是产品现实，而不是尽可能宽泛的保险科技标题。Earnix 明确瞄准多个保险细分——个人 P&C、商业 P&C、人寿、健康、车联网 /
              UBI——同时覆盖一组银行垂直场景，包括汽车金融、按揭、存款、个人银行和商业银行。这种宽度意味着 Earnix
              既不是纯保险核心系统供应商，也不是泛化的价格优化工具。更合适的理解是：它是一家决策平台公司，坐在定价、承保、费率厘定、产品和数据治理工作流的交叉点。关键替代对象并非一个单体巨头。相反，Earnix
              看起来是在受监管机构内部替代电子表格、遗留费率逻辑、手工报备包、割裂的分析工具，以及缓慢的产品或费率治理流程。之所以重要，是因为实际预算争夺往往围绕如何更快改进关键决策，而不是强迫客户把周边所有核心系统全部推倒重来。
