      - number: '7.2'
        title: 运营韧性、网络安全与产品执行风险
        blocks:
          - type: paragraph
            body: >-
              运营风险有分量，因为 Earnix 被插入受监管机构的实时定价和承保工作流。DORA 抬高了客户对运营韧性的要求，也随之抬高了供应商门槛。Earnix 有建设性的公开控制信号——TLS
              1.2、AES-256、SSO、MFA、正式 SSDLC 实践、年度第三方渗透测试和信任中心披露——但这些信号来自公司自述且不完整。已审阅公开来源没有量化可用性、事件频率或 SLA
              达成情况。产品宽度进一步放大风险面。Earnix 现在覆盖定价、承保、费率厘定、数据、车联网和较新的 AI 助手功能。2025 年 Zelros 收购增加未来上行，但也提高执行复杂度。实际问题是，Earnix
              在深度嵌入客户环境和合作伙伴生态的同时，能否保持可靠性和路线图纪律。
