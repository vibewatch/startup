companyProfile:
  summary: >-
    Earnix 成立于 2001 年，是以色列后期私营金融科技 / 保险科技软件公司，销售用于定价、承保、费率厘定、产品个性化及相关数据治理工作流的关键决策软件。公司服务 35+ 个国家的全球保险公司和银行，近期通过 2025 年
    JVP/TPG 延续基金加深资方支持，并借 Zelros 收购及围绕 Guidewire、Sapiens、Verisk 扩张的合作生态拓宽产品线。
