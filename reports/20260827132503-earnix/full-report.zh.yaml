      - number: '3.3'
        title: 切换成本、多栖采用与真正护城河
        blocks:
          - type: paragraph
            body: >-
              Earnix 的护城河并不来自绝对唯一性，而是工作流深度和集成灵活性的组合。定价、承保和费率厘定是跨职能流程，牵涉产品、精算、承保、合规和 IT。一旦决策逻辑嵌入，切换就不像换一个仪表盘那么容易。这给
              Earnix 带来一定工作流粘性。但粘性并非绝对。叠加式分析、专业 AI
              模块、财产风险和欺诈单点方案中，多栖采用仍然可行，也正因为如此，专业厂商仍能攻击工作流边缘。当客户想要一层同时覆盖定价、承保、治理和个性化的连贯系统时，公司差异化最强。当保险公司满足于大型套件里的够用功能，或愿意拼接更窄的利基工具时，公司位置最弱。换句话说，Earnix
              的护城河真实但有条件，不是垄断式护城河。
