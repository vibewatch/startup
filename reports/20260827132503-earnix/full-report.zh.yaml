      - number: '7.4'
        title: 缓释因素、监测指标与放弃条件
        blocks:
          - type: paragraph
            body: >-
              公开缓释因素可见，但并不全面。Earnix
              在公开材料中强调治理、透明度、安全控制、隐私姿态和数据纪律。对一家卖给受监管保险公司和银行的供应商来说，这些都是好信号。主要挑战在于，未来失败很可能先出现在二阶指标上：客户 AI
              部署放慢、生态杠杆变弱、合作伙伴或客户集中度上升，或模型治理负担正在拖延赢单的证据。最清晰的放弃条件同样具体：与不公平或不透明 AI
              使用相关的严重监管挑战、重大运营韧性或安全失败、无法整合收购和宽路线图范围的明确信号，或强 logo 之下客户经济性薄弱的证据。在这些风险未被管理层资料验证前，最可支持的判断是：Earnix
              承担高但可管理的执行和治理风险，而不是干净的低风险软件画像。实际结论是，Earnix
              应按受治理软件资产承销，下行更可能来自买方谨慎、实施拖累或信任失败，而不是简单需求不足。因此，监测纪律至关重要：公司可以在战略上显得强，却仍会因监管解释收紧、合作伙伴渠道转弱或生产可靠性证据不足而令人失望。
