  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创立与市场定位
        blocks:
          - type: paragraph
            body: >-
              Earnix 不是借近期市场周期冒出来的新 AI 外壳，而是一家已有二十多年历史的以色列企业软件公司，围绕受监管金融机构的实时决策多次重塑定位。最扎实的基础事实来自官方页面与第三方数据库的交叉验证：公司材料称
              Earnix 自 2001 年起服务保险公司和银行，Tracxn 与 Start-Up Nation Central 也都把公司定位在以色列，并将创立时间标为 2001 年。当前叙事一贯把 Earnix
              定义为定价、费率厘定、承保和产品个性化的关键软件，而不是轻量级分析插件。这个定位很重要，因为 Earnix
              更接近保险和银行工作流里的核心运营基础设施，也意味着切换成本和治理要求更高。公开材料还显示公司具备广泛国际化布局：Earnix 称其办公室覆盖美洲、欧洲、亚太和以色列，2025 年 TPG/JVP
              延续基金新闻稿则称公司已在六大洲 35+ 个国家运营。
