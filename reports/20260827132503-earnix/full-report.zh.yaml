            body: >-
              相对一般保险科技公司，Earnix 的成本结构看起来更好，因为它卖软件，而不是承担资产负债表上的保险风险；但它几乎肯定也不是纯横向 SaaS
              的毛利率画像。公司围绕数据准备、治理、定价加速器和集成的自身叙事，意味着实施、支持和客户成功工作不会轻。以色列、欧洲和北美的全球办公室也意味着固定薪酬和支持成本不低，而 2025 年 Zelros
              收购在带来产品上行的同时，又增加了集成开销。资本方面，公开证据较为微妙。2021 年 $75M 轮次明确资助扩张、创新、招聘和 M&A。后续 2024 年老股交易和 2025
              年延续基金明确支持流动性和资方承诺。但后两项事件都不应自动解读为公司获得干净的新增运营现金。评估当前资产负债表弹性时，这一区别很重要，尤其没有公开来源披露现金或烧钱速度。
