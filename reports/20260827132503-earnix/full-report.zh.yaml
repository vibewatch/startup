        title: 以客户工作流拆解产品图谱
        blocks:
          - type: paragraph
            body: >-
              Earnix 当前产品架构像是在有意占据多个相邻工作流上的决策层，而不只是一个精算工具。公开模块集合包括用于动态定价的 Price-It、承保决策支持、企业费率引擎、Filing
              Accelerator、Pricing Accelerator、Elevate Data、客户互动工具和 Copilot。按客户工作流看，这意味着 Earnix
              可以参与费率设计、治理、部署、底层数据运营化，并越来越多帮助业务用户更高效地与工作流交互。这种宽度有战略意义。它让平台对定价、承保、产品、分析和 IT
              等多个利益相关方更相关，也在单一企业客户内创造更多交叉销售界面。它也意味着 Earnix 必须证明自己是连贯的，而不是摊子铺太大。目前公开证据支持前一种叙事，但如果太多模块只是浅层采用，后一种仍是尽调风险。
