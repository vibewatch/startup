      - number: '3.2'
        title: 与平台和数据生态的竞合
        blocks:
          - type: paragraph
            body: >-
              最具战略意义的竞争者，往往也是合作伙伴。Guidewire 是最清晰的例子：Earnix 推广 Guidewire accelerator，并借 Guidewire 生态的可信度获益；但 Guidewire
              自身平台权力很强，能影响保险公司的架构选择，并可能随着时间内化更多定价功能。Sapiens 在不同地区和细分市场形成同样模式，用连接器合作验证 Earnix，同时继续控制更宽的保险公司平台关系。Verisk
              又不同。它与其说是直接软件同类，不如说是商业保险定价中的结构性数据和内容守门人。这些关系有用，因为能缩短实现价值的时间，减少推倒重来的摩擦。但它们也限制独立性：如果 Earnix
              增长中相当一部分要借主导生态前进，合作伙伴路线图和渠道决策就会成为竞争风险面的一部分。
