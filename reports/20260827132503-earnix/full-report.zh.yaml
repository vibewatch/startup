      - number: '6.4'
        title: 集中度风险、现代化摩擦与结论
        blocks:
          - type: paragraph
            body: >-
              核心客户风险不是缺少 logo，而是缺少组合经济性。Earnix
              参考客户偏向大型保险公司、银行和贷款机构，这很亮眼，但如果少数超大账户主导预订、续约或路线图影响力，也可能掩盖集中度。采购摩擦也很可能仍高，因为这些都是深度集成、受监管的部署，牵涉多方利益相关者和较长实施路径。已审阅公开记录没有量化实施周期、生产客户数，也没有区分当前上线部署与历史
              logo。Enlyft 只提供方向性估计，不是管理层级真相。因此，可支持的结论偏建设性：Earnix 显然有真实采用和可信
              logo，但在把公开客户宽度等同于耐久且分散的收入质量之前，投资者仍需要账户集中度、续约和生产状态证据。对投资者而言，客户故事足以越过「真实采用」门槛，但还没有越过「留存和集中度已完整承销」门槛。公开证据证明了
              logo、工作流和部分结果叙事；没有证明队列经济性、每个账户内部的部署宽度，或对下行保护最关键的收入集中度。投资者仍需要队列经济性，才能把客户证据视作完整耐久性证据。单靠公开客户 logo
              无法解决单位经济性或续约质量问题。公开证据仍不完整。
