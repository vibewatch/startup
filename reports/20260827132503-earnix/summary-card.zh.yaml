  topStrengths:
    - Earnix 卡住的是定价、承保、费率厘定和产品个性化的高价值决策层，不只是一个狭窄的保险科技功能。
    - 公开资料能支撑其真实运营规模：覆盖 35+ 个国家、拥有 100+ 个一级保险公司案例、2024 年收入超过 $100M，并在 2023 年首次实现经营利润。
    - 股东支持很强，2025 年 JVP/TPG 延续基金和 JVP 主导的多数股权就是核心信号。
    - 产品横跨保险和银行，并接入 Guidewire、Sapiens、Verisk，战略相关性和交叉销售空间都更强。
    - 面向受监管市场销售时，Earnix 对信任中心、治理和安全的表述，比许多私营软件同业更清楚。
  topRisks:
    - 当前 ARR、利润率、客户集中度、现金跑道和股权类别经济条款仍未披露，估值精度受限。
    - 保险业对 AI 治理、可解释性和运营韧性的规则，可能拖慢采用速度，也会抬高客户和供应商的合规负担。
    - 据报道，2024 年老股交易价格没有突破 2021 年估值；即便后来股东热情升温，这仍是一个需要警惕的价格信号。
    - 连接器和相邻平台依赖合作伙伴生态；一旦合作伙伴加深原生能力，Earnix 的议价力可能被削弱。
    - 产品范围很宽，还要整合 Zelros；如果各模块采用速度不均，路线图和执行都会承压。
  unresolvedGaps:
    - 当前 ARR、NRR/GRR、毛利率和现金跑道未公开披露。
    - 2025 年延续基金采用的确切估值和证券结构仍未披露。
    - 按客户、地区和合作伙伴渠道拆分的收入集中度未公开。
    - 没有公开来源给出当前完全稀释股权结构表或清算优先权堆叠。
    - 公开可靠性指标和生产治理指标弱于其信任叙事。
