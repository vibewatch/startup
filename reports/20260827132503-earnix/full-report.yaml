      - number: '4.3'
        title: Cost structure, capital needs, and funding quality
        blocks:
          - type: paragraph
            body: >-
              The cost structure looks better than average for an insurtech because Earnix sells software rather than
              taking balance-sheet insurance risk, but it almost certainly is not a pure horizontal SaaS margin profile.
              The company’s own messaging around data preparation, governance, pricing accelerators, and integrations
              suggests nontrivial implementation, support, and customer-success work. Global offices across Israel,
              Europe, and North America also imply meaningful fixed payroll and support costs, while the 2025 Zelros
              acquisition adds further integration overhead alongside product upside. On capital, public evidence is
              nuanced. The 2021 $75 million round clearly funded expansion, innovation, hiring, and M&A. The later 2024
              secondary and 2025 continuation vehicle clearly supported liquidity and sponsor commitment. But neither
