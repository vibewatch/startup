  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: incumbents, adjacents, and specialists'
        blocks:
          - type: paragraph
            body: >-
              Earnix’s competitor set is broader than a simple insurtech list because it sells into mission-critical
              workflows already surrounded by other software. The first competitor layer is full-suite modernization and
              insurance-core vendors—Guidewire, Duck Creek, Sapiens, Majesco, Socotra, EIS, and in some contexts Verisk.
              These companies can compete for the same CIO budget even when they are not identical pricing vendors
              because they own adjacent workflow surfaces, stronger installed bases, or broader transformation programs.
              The second layer is specialist AI vendors such as FRISS, Gradient AI, ZestyAI, and hyperexponential, which
              attack narrower workflow slices like fraud, risk selection, property analytics, or pricing infrastructure.
              Earnix’s category claim only makes sense when both layers are kept in view: the company is neither an
              all-in-one insurer core nor a single-function niche tool. It wins by offering a decisioning layer broad
              enough to matter and focused enough to deploy faster than a complete core replacement.
