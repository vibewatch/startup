  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what Earnix actually sells into
        blocks:
          - type: paragraph
            body: >-
              The right way to size Earnix is to start with product reality, not with the broadest possible insurtech
              headline. Earnix explicitly targets multiple insurance subsegments—personal P&C, commercial P&C, life,
              health, and telematics/UBI—and a parallel set of banking verticals including auto finance, mortgages,
              deposits, personal banking, and commercial banking. That breadth means Earnix is not purely an
              insurance-core vendor and not purely a generic price-optimization tool. It is better understood as a
              decisioning-platform company sitting at the intersection of pricing, underwriting, rating, product, and
              data-governance workflows. The key substitute is not one monolithic incumbent. Rather, Earnix appears to
              displace combinations of spreadsheets, legacy rating logic, manual filing packages, disconnected
              analytics, and slow product or rate-governance processes inside regulated institutions. That matters
              because the practical budget battle is often about improving mission-critical decisions faster without
              forcing a complete rip-and-replace of every surrounding core system.
