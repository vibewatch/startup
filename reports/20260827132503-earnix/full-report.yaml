      - number: '3.4'
        title: Competitive verdict and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The positive competitive thesis is that Earnix can occupy a valuable layer between slow-moving incumbent
              cores and narrow specialists: broader than a point tool, lighter than a full-suite replacement, and
              credible in both insurance and banking. The adverse competitive thesis is equally important. Incumbents
              can expand inward, especially as AI copilots and embedded analytics become table stakes. Specialists can
              expand outward, especially when customers prefer targeted ROI over platform breadth. And the reviewed
              public source set does not quantify win rates, displacement rates, ecosystem revenue dependence, or
              pricing pressure in live enterprise deals. That means public evidence supports a defendable competitive
              position, but not a proven, permanently defensible category. Investors should treat Earnix as a
              well-positioned co-opetition player in a crowded field rather than as an uncontested standard. The
              competitive lesson is that Earnix likely wins when a buyer wants a governed decisioning overlay with
              faster time-to-change than a core-system release cycle. It is weaker when a carrier or bank prefers to
              consolidate more workflow inside an incumbent platform, or when a specialist can prove superior depth in
              one narrow workflow such as fraud or property-risk modeling.
