            body: >-
              Earnix is unusually explicit about trust controls for a private software company. Its public trust
              materials describe TLS 1.2 for data in transit, AES-256 for data at rest, SSO and MFA support, formal
              SSDLC processes, reference frameworks such as OWASP and CIS, and annual third-party penetration testing.
              Product releases also stress transparency, governance, and explainability in pricing and rating workflows.
              These are meaningful positives because regulated customers do not buy black-box decisioning lightly.
              Still, public trust evidence is self-described and incomplete. The reviewed set does not provide
              quantified uptime, latency, public SLA attainment, or independent public audits of model-governance
              quality beyond broad compliance claims. The right technical verdict is therefore constructive: the
              platform appears broad, modular, and governance-aware, but investors should still treat reliability
              metrics, integration burden, and actual Copilot adoption as unresolved diligence questions. The technical
              diligence burden therefore shifts from whether Earnix has real product breadth to how repeatably that
              breadth is implemented, governed, and integrated. Buyers in regulated markets will care not only about
