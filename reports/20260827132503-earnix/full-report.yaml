companyProfile:
  summary: >-
    Earnix is a late-stage private Israeli fintech and insurtech software company founded in 2001 that sells
    mission-critical decisioning software across pricing, underwriting, rating, product personalization, and related
    data-governance workflows. The company serves global insurers and banks in more than 35 countries and has recently
    deepened sponsor backing through a 2025 JVP/TPG continuation vehicle while expanding its product breadth through the
    Zelros acquisition and a growing partner ecosystem around Guidewire, Sapiens, and Verisk.
  foundedDate: '2001-02-01'
  founders:
    - name: Sammy Krikler
      role: Founder / Chief Insurance Officer
      background: Insurance-domain founder who remains publicly visible in management as Chief Insurance Officer.
      claimRefs:
        - CO004
        - CO010
  foundingLocation: Israel
  headquarters: Ramat Gan, Israel
  productSummary: >-
    Earnix sells a cloud-based platform for pricing, underwriting, rating, product personalization, telematics, and
    related data-governance workflows. The modular stack includes Price-It, underwriting, enterprise rating, Filing
    Accelerator, Pricing Accelerator, Elevate Data, and Copilot, with connectors into insurance and banking ecosystems.
  customerFocus: >-
