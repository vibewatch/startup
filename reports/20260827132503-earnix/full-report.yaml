        blocks:
          - type: paragraph
            body: >-
              Leadership visibility is stronger than board transparency. Earnix’s current management page names Robin
              Gilthorpe as CEO, Ronit Maor as CFO, Sammy Krikler as Founder and Chief Insurance Officer, Craig Campestre
              as CRO, and Kathy Klingler as CMO, giving the market a current operating-leadership snapshot. The more
              material inflection was the 2023 CEO transition: Earnix recruited Gilthorpe from outside the company,
