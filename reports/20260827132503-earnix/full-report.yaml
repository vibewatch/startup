chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founding, and market position
        blocks:
          - type: paragraph
            body: >-
              Earnix is not a newly minted AI wrapper riding a recent market cycle; it is a two-decade-old Israeli
              enterprise software company that has repeatedly repositioned itself around real-time decisioning for
              regulated financial institutions. The strongest foundation facts come from a mix of official pages and
              third-party databases: company materials say Earnix has been serving insurers and banks since 2001, while
              Tracxn and Start-Up Nation Central both place the company in Israel and date the business to 2001. Current
              messaging consistently frames Earnix as mission-critical software for pricing, rating, underwriting, and
              product personalization rather than a lightweight analytics add-on. That positioning matters because it
              places Earnix closer to core operating infrastructure inside insurance and banking workflows, with the
              attendant switching-cost and governance implications. Public materials also show a broad international
              posture: Earnix talks about offices spanning the Americas, Europe, Asia Pacific, and Israel, and the 2025
              TPG/JVP continuation-vehicle release says the company already operates in more than 35 countries across
              six continents.
