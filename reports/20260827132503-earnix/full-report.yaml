              the company entered a scale-up phase that required a more commercially oriented international operator
              without fully severing founder-era institutional memory. Governance breadth has expanded through public
              disclosures: the 2021 Insight-led financing added Jonathan Rosenbaum to the board, Earnix later announced
              an advisory board, and in October 2024 it added Jessica Buss, the CEO of Argo Group, to the board. Even
              so, investors should note that the public record still does not reveal a full board roster, committee
              structure, observer rights, or exact post-2025 control map.
