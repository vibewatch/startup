      - number: '2.3'
        title: Buyer segmentation, adoption path, and why deals happen
        blocks:
          - type: paragraph
            body: >-
              Buyer behavior is different between insurance and banking, but the core logic is similar: regulated
              financial institutions want more responsive pricing and risk decisions without losing governance. In
              insurance, pricing leaders, actuaries, underwriters, product teams, and CIO-sponsored transformation
              groups all have plausible buying stakes because pricing updates can influence growth, combined ratio,
              regulatory compliance, and broker responsiveness. In banking, the budget logic tilts toward loan, deposit,
              mortgage, and consumer-product owners who need to defend margin and personalize offers faster. The
              adoption path also tends to favor overlays and integrations rather than full-stack replacements. Earnix’s
              own positioning around connectors, accelerators, and intelligent operations implies that institutions
              often want improvement without a wholesale rewrite of adjacent systems. That is commercially attractive
              because it lowers project scope, but it also means Earnix must repeatedly prove integration reliability
              and cross-functional workflow change, not just model quality.
