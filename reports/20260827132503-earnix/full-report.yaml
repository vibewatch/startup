            body: >-
              Public mitigations are visible, but they are not comprehensive. Earnix emphasizes governance,
              transparency, security controls, privacy posture, and data discipline in its public materials. Those are
              all good signs for a vendor selling into regulated insurers and banks. The main challenge is that future
              failure would likely appear first in second-order indicators: slower AI deployment at customers, weaker
              ecosystem leverage, growing partner or customer concentration, or evidence that model-governance burdens
              are delaying wins. The clearest kill criteria are equally concrete: a serious regulatory challenge tied to
              unfair or opaque AI use, a material operational-resilience or security failure, a demonstrated inability
              to integrate acquisitions and broad roadmap scope, or proof that customer economics are weak despite
              strong logos. Until these risks are tested with management-room data, the most supportable stance is that
              Earnix carries high but manageable execution and governance risk, not a clean low-risk software profile.
