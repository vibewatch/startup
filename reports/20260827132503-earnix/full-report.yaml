        - Compresses into lower band
      - - NRR / GRR / concentration
        - Tests durability and expansion
        - Supports premium multiple
        - Raises downside risk materially
      - - Gross margin and services mix
        - Tests software quality
        - Justifies premium to public comps
        - Narrows comp set to lower-quality software
      - - Share count and preference stack
        - Converts portal quotes into equity value
        - Improves entry precision
        - Can sharply impair common upside
      - - Continuation-vehicle economics
        - Clarifies true current mark and sponsor intent
        - Validates private-market support
        - Could reveal structure-driven rather than fundamentals-driven price
    notes: >-
      These are the few diligence items most likely to move valuation by hundreds of millions of dollars, not just by
      rounding error.
    claimRefs:
      - CV015
      - CV026
      - CV027
      - CV028
      - CV031
      - CV032
      - CV033
      - CV034
  - id: TV006
    title: Thesis-break trigger table
    columns:
      - Trigger
      - Why it breaks the thesis
      - Action implication
    rows:
      - - Weak next financing or structured down-mark
        - Shows sponsor support no longer offsets opacity
        - Reprice to bear range or walk away
      - - Poor retention or high concentration
        - Destroys quality-of-revenue narrative
        - Lower recommendation and demand discount
      - - Material regulatory friction on AI decisioning
        - Slows growth and raises compliance burden
        - Cut growth and multiple assumptions
      - - Operational strain from breadth or integration
        - Challenges execution premium
        - Lower valuation stance and confidence
      - - Unfavorable preference stack
        - Captures upside away from new entrants
        - Avoid or insist on lower entry price
    enumerationScope:
      coverage: partial
      basis: >-
        Lists the main public-evidence triggers that could most quickly collapse the valuation case; internal financial
        covenant or board triggers are not public.
    notes: The trigger set is partial because some decisive cap-table and covenant triggers are not publicly disclosed.
    claimRefs:
      - CV020
      - CV025
      - CV027
      - CV028
      - CV032
      - CV034
      - CV035
      - CV036
  - id: TV007
    title: Valuation sensitivity bridge table
    claimRefs:
      - CV040
      - CV041
      - CV042
    columns:
      - Sensitivity lever
      - Lower-end outcome
      - Upper-end outcome
      - Why it matters
    rows:
      - - Current revenue base
        - Near public $100M threshold
        - Materially above public threshold
        - Most important driver of multiple compression or expansion
      - - Margin quality
        - Early / mixed profitability
        - Scalable software margins with strong efficiency
        - Determines whether premium multiple is justified
      - - Retention and concentration
        - Opaque or weak cohort behavior
        - Strong renewal and diversified revenue base
        - Changes downside protection and exit quality
      - - Capital structure
        - Preference-heavy or diluted common exposure
        - Cleaner share-class economics
        - Can materially alter common-equity attractiveness
    notes: >-
      Sensitivity bridge explains why the recommendation depends more on hidden operating and structure details than on
      one static headline valuation.
