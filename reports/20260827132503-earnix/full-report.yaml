  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              The single most important external risk surface for Earnix is not ordinary software competition; it is the
              regulatory tightening around AI use in financial decisioning. Insurance underwriting and pricing
              increasingly sit under explainability, fairness, documentation, and oversight expectations. EIOPA’s 2025
              opinion and related factsheet make clear that European insurers must apply robust AI governance in line
              with existing supervisory regimes and the EU AI Act. In the United States, the NAIC AI bulletin similarly
              raises expectations for governance, documentation, and risk management by insurers using AI systems. This
              does not mean Earnix is itself the regulated insurer. But it does mean Earnix sells into customers whose
              procurement and legal review standards will rise materially if model behavior is hard to explain or audit.
              That can create both opportunity and friction: vendors with strong governance tooling may benefit, while
              weak documentation or fairness controls can slow adoption or trigger scrutiny.
