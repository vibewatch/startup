        title: Traction, growth, and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Financial traction is visible in two forms: explicit growth/profitability signals and repeated
              customer-ROI narratives. Calcalist reported that Earnix crossed the $100 million revenue threshold in 2024
              and reached its first operating profit in 2023. Earnix’s October 2024 board announcement adds a second
              layer by saying the company is scaling toward hundreds of millions of dollars of revenue while maintaining
              a continued-profitability agenda. These are useful signals, but they are still private-company statements
              and media reporting, not public-company audited filings. Sales-efficiency proxies are more qualitative.
              Customer and product pages emphasize faster model deployment, better pricing controls, personalization,
              and margin improvement—messages that typically support enterprise ROI selling. But the same workflow
              complexity that makes the product sticky likely lengthens cycles and requires coordination across
              actuarial, product, underwriting, and IT teams. Public evidence therefore points to credible traction and
              meaningful enterprise value, but not to a quantified CAC, payback, or conversion model.
