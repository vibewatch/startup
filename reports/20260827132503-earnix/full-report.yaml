  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization visibility
        blocks:
          - type: paragraph
            body: >-
              The public record supports a clear monetization logic even if it does not support full revenue-accounting
              precision. Earnix sells software into pricing, underwriting, rating, and product workflows for insurers
              and banks. Product pages consistently position the company as mission-critical enterprise software rather
              than a project-based consultancy. The strongest concrete commercial detail comes from Calcalist, which
              reported that customers pay annual usage fees and that typical agreements last three to five years. That
              is a valuable signal: it implies recurring enterprise relationships with some contract durability rather
              than short pilot cycles. The module map also matters financially. Because Earnix spans pricing,
              underwriting, rating, data preparation, and banking decisioning, the commercial model appears suited to
              land-and-expand economics if customers successfully deploy one workflow and later add another. Public
              evidence is weak on exact list prices, discounting, implementation fees, or revenue-recognition policy,
              but the underlying monetization structure looks meaningfully software-led and recurring.
