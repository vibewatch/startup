  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation anchor, capital context, and what is actually known
        blocks:
          - type: paragraph
            body: >-
              The first rule in valuing Earnix is to separate hard anchors from implication. The hard anchor is the
              February 2021 $75 million growth round at a $1 billion pre-money valuation. After that, public evidence
              becomes structurally noisier. The June 2024 secondary provided large-scale liquidity but, according to
              Calcalist, did not clear above the 2021 valuation. The September 2025 continuation vehicle was even
              larger, but it was primarily an ownership-and-liquidity structure rather than a plain new primary round,
              and it did not disclose a clean post-money mark. That leaves investors with conviction signals but not
              precise price signals. This is why the right current range must be wide. Public evidence supports that
              sophisticated capital still values the asset highly enough to stay involved, but it does not yet support a
              single exact current valuation that can be treated as fact.
