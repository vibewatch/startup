      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              Publicly, Earnix looks like a scaled, improving enterprise-software asset rather than a distressed or
              promotional private company. Revenue above $100 million, first operating profit in 2023, and strong
              sponsor backing are all constructive. The software is embedded in sticky workflows with multi-year
              agreements and a plausible cross-sell motion across pricing, underwriting, and banking. Those are
              meaningful positives. But the chapter cannot clear a true underwriting bar. No reviewed source discloses
              ARR, deferred revenue, gross margin, customer concentration, burn, runway, or the exact mix of primary
              versus secondary proceeds in the recent capital events. Even the historical totals for capital raised and
              current valuation are inconsistent across public data vendors. The right financial verdict is therefore
              positive on business quality and sponsor support, but still blocked on the private-company data that
              actually determine risk-adjusted return. A useful cross-check is what public insurance-software investors
              expect from listed peers: recurring-revenue mix, services burden, margin progression, and cash generation
