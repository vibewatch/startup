      - number: '3.3'
        title: Switching costs, multi-homing, and the real moat
        blocks:
          - type: paragraph
            body: >-
              Earnix’s moat is less about absolute uniqueness than about the combination of workflow depth and
              integration flexibility. Pricing, underwriting, and rating are cross-functional processes touching
              product, actuarial, underwriting, compliance, and IT. Once decision logic is embedded, switching is not as
              easy as swapping a dashboard. That gives Earnix some workflow stickiness. But the stickiness is not
              absolute. Multi-homing remains plausible in overlay analytics, specialist AI modules, or property-risk and
              fraud point solutions, which is exactly why specialist vendors can still attack the edge of the workflow.
              The company’s strongest differentiation appears when customers want one coherent layer across pricing,
              underwriting, governance, and personalization. Its weakest position appears when carriers are satisfied
              with good-enough features inside larger suites or are willing to stitch together narrower niche tools. In
              other words, Earnix’s moat is real but conditional, not monopolistic.
