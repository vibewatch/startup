  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product map in customer workflow terms
        blocks:
          - type: paragraph
            body: >-
              Earnix’s current product architecture reads like a deliberate attempt to own the decisioning layer across
              several adjacent workflows, not just one actuarial tool. The public module set spans Price-It for dynamic
              pricing, underwriting decision support, enterprise rating, Filing Accelerator, Pricing Accelerator,
              Elevate Data, customer-engagement tools, and Copilot. In customer-workflow terms, that means Earnix can
              participate in designing a rate, governing it, deploying it, operationalizing the underlying data, and
              increasingly helping business users interact with the workflow more efficiently. This breadth is
              strategically important. It makes the platform more relevant to multiple stakeholders—pricing,
              underwriting, product, analytics, and IT—while also creating more cross-sell surfaces inside a single
              enterprise account. It also means Earnix must prove it is coherent rather than sprawling. Public evidence
              supports the former narrative today, but the latter remains a diligence risk if too many modules become
