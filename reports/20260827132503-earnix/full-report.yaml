      - number: '2.2'
        title: Sizing the market with multiple lenses rather than one TAM
        blocks:
          - type: paragraph
            body: >-
              Public market studies support a large and growing opportunity, but they should not be blended into a
              false-precision single TAM. AI-for-insurance reports focus on underwriting, claims, and risk analytics and
              place current spend in the low double-digit billions. Insurance-telematics studies capture another
              adjacent pool that is growing quickly as connected-car and usage-based models scale, though their numbers
              vary materially by geography and definition. Broader price-optimization software reports are much smaller
              because they focus on a narrower software category spanning multiple industries. P&C-software studies are
              much larger because they include broader core-system and operational technology spend. The analytical
              takeaway is straightforward: Earnix participates in several expanding categories at once, and the correct
              diligence move is to triangulate the opportunity using multiple lenses instead of pretending that one
              market-research headline captures the business. That also implies a sizable risk that investors over- or
              understate TAM depending on which lens they privilege.
