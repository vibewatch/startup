figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  data:
    items:
    - label: Trigger
      detail: A plant, project site, utility, or ops-heavy business hits fragmented sourcing, long lead times, weak visibility, or quality inconsistency.
      touchpoints:
      - Tail-end spend sprawl
      - Multi-site urgency
      - Category standardization need
    - label: Evaluation
      detail: The customer compares catalog supply, managed procurement, and digital workflow tools against legacy ERP, distributor, or local-vendor processes.
      touchpoints:
      - Cost-saving target
      - Supplier-consolidation case
      - ERP / workflow fit
    - label: Pilot / design
      detail: Moglix scopes catalog build, buyer portal, vendor onboarding, packaging program, or project sourcing motion for the target account.
      touchpoints:
      - Catalog / SKU mapping
      - Commercial terms
      - Compliance and quality checks
    - label: Rollout
      detail: The program goes live through buyer portals, contract automation, synchronized sourcing, or managed supply workflows across plants or sites.
      touchpoints:
      - PO / PR integration
      - Supplier onboarding
      - Warehouse / logistics coordination
    - label: Operational proof
      detail: The relationship is judged on cycle time, savings, OTIF execution, inventory visibility, or project completion support.
      touchpoints:
      - Measured savings
      - Cycle-time reduction
      - Project schedule adherence
    - label: Expansion
      detail: Accounts can deepen from marketplace buying into modules such as Cognilix, vendor platforms, analytics, or broader category coverage.
      touchpoints:
      - Module attach
      - Multi-site expansion
      - Software fee upsell
