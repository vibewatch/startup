chapter:
  number: 6
  title: Customers
  summary: 'Moglix''s customer story is strongest at the large-enterprise end of Indian procurement. Public case studies and older third-party references place the company inside auto OEMs, metals and mining, oil and gas, utilities, Indian Railways-linked EPC, Air India, Unilever, Urban Company, Xpressbees, and other scaled buyers. Current 2026 product materials add depth rather than a clean logo count: 1,000+ customers reportedly use one or more Cognilix modules, while 10+ large enterprises use standalone Cognilix, built on a network of 45,000 suppliers, 1.2 million SKUs, and 58 warehouses. The weak spots are transparency and retention. Named-account disclosure is sparse relative to claimed scale, MSME proof is much thinner than enterprise proof, and no public NPS, GRR, NRR, or renewal data was found. Consumer complaint boards also show marketplace-side service frictions, supporting a cautious view on customer concentration and repeat-quality risk.'
sections:
- id: segment-mix-and-proof-surface
  title: Customer mix is broad, but public proof skews toward heavyweight enterprise accounts
  body: |-
    Moglix's public customer mix looks much more enterprise-heavy than consumer-like. The company's own business surfaces still frame the offer around enterprise procurement and vendor collaboration, while older public profiles describe Moglix as serving thousands of manufacturing companies or plants alongside a very large SME base. The 2026 Cognilix launch material shifts the discussion again: instead of headline logo count, it emphasizes depth of adoption, with more than 1,000 customers reportedly using one or more underlying modules and more than 10 large enterprises on standalone Cognilix deployments. That split matters because it suggests the company has built a wide commercial ecosystem, but its deepest and stickiest relationships are likely concentrated in larger managed accounts rather than the anonymous long tail.

    The proof surface also reflects that reality. Most quantified public case studies sit in automotive, metals and mining, oil and gas, utilities, infrastructure, logistics, and scaled digital operations. That is good evidence of serious B2B relevance, but it is not the same thing as clean disclosure of active customer count or concentration. Named customers do exist in older independent coverage, yet the current public roster is still much thinner than the scale claims would imply. The right read is that Moglix has real multi-segment reach, but investors should treat the enterprise layer as the core customer engine and the MSME layer as directionally large but under-disclosed.
