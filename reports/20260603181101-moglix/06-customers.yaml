  - - Large industrial enterprises
    - Strong
    - Hero MotoCorp / leading two-wheeler OEM, Unilever, Tata Steel, Vedanta-linked metals, large automotive and energy accounts
    - Multi-plant buying, ERP adjacency, supplier consolidation, category standardization
    - Managed procurement, buyer portals, contract automation, vendor-managed inventory, category expertise
    - Named-account disclosure is thinner than scale claims imply.
  - - PSU / government-linked buyers
    - Medium-strong
    - Air India, Indian Railways-linked EPC project, state transmission utility, West Bengal DISCOM, NTPC (legacy named reference)
    - Tender discipline, schedule pressure, compliance, liquidated-damage risk, complex project sourcing
    - Synchronized sourcing, project execution support, electrical and cable procurement, steel and PPE supply
    - Public-sector cycles are slower and L1-driven; revenue timing can be lumpy.
  - - Mid-market manufacturers and regional infra developers
    - Medium
    - Regional infra developer, automotive lighting manufacturer, second-largest tractor manufacturer
    - Working-capital stress, fragmented suppliers, weaker procurement data, heavy execution dependence
    - Procure-to-pay support, cataloging, supplier consolidation, custom manufacturing and packaging
    - Public evidence exists, but repeat usage and retention data are not disclosed.
  - - Digital-native and ops-heavy service businesses
    - Medium-strong
    - Urban Company, Xpressbees, food-delivery platform, large e-commerce enterprise, e-pharmacy retailer
    - High-volume distributed operations, packaging standardization, multi-city fulfilment, variable demand
    - Packaging procurement, 4PL support, buyer portal workflows, spend visibility, quality control
    - Many accounts are named, but most proof is historical and case-study-based.
  - - MSMEs / marketplace long tail
    - Weak-direct proof
    - 500,000+ SMEs / MSMEs in legacy company-linked coverage
    - High order fragmentation, lower ACV, more transactional behavior, broader assortment needs
    - Marketplace assortment, logistics reach, supplier network, easier discovery and ordering
    - Public proof of active usage, repeat rate, or segment economics is much thinner than enterprise proof.
