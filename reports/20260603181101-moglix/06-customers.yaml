- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Risk factor
  - Why it matters
  - Public evidence
  - Severity
  - What to ask management
  rows:
  - - Large-account concentration
    - A small number of heavyweight industrial and project accounts could drive an outsized share of GMV and implementation effort.
    - Detailed proof is concentrated in large OEMs, utilities, energy, infrastructure, and scaled digital operators.
    - High
    - Provide top-10 customer GMV / revenue share and contract concentration by segment.
  - - Metric-definition drift
    - Investor models can overstate growth if plants, companies, module users, and enterprise logos are treated as the same thing.
    - Legacy and 2026 public metrics use different units of account.
    - Medium
    - Reconcile active buyers, active enterprise accounts, module users, and annual transacting customers.
  - - Retention opacity
    - No public NPS, GRR, NRR, or renewal data exists to test customer quality.
    - Official pages and launch materials emphasize outcomes but omit retention metrics.
    - High
    - Share gross / net retention, renewal timing, and top-account churn history.
  - - MSME proof gap
    - The long-tail customer thesis matters for network effects, but public proof is mostly scale copy rather than behavior data.
    - Legacy MSME counts exist, but reviewed public case studies are overwhelmingly enterprise-focused.
    - Medium
    - Share active MSME cohorts, repeat-purchase rates, and contribution to GMV.
  - - Marketplace-side service quality
    - Returns, refunds, and support friction can damage brand trust and leak into broader customer acquisition costs.
    - Complaint boards and review sites show repeated after-sales issues.
    - Medium
    - Break out enterprise support SLA performance versus marketplace retail-service metrics.
  - - Government procurement friction
    - Public-sector demand is large, but slow tender cycles and L1 bias can delay wins and compress economics.
    - ETGovernment and NIC both show digitization progress but persistent procedural complexity.
    - Medium
    - Disclose PSU / government pipeline cycle length, win rates, and payment timing.
  - - Software upsell still early
    - Standalone Cognilix adoption is promising, but current full-platform deployment remains small relative to the broader base.
    - 1,000+ module customers vs 10+ standalone enterprise deployments.
    - Medium
    - Show module-to-platform conversion, software ACV, and renewal / expansion by cohort.
  notes: Severity reflects public-source evidence only; actual concentration could be better or worse depending on undisclosed account mix.
