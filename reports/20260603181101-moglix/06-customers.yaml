  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-disclosure
    missingEvidence: No public NPS, CSAT, GRR, NRR, renewal cohort, or SLA-attainment data was found for Moglix enterprise accounts.
    whyItMatters: Without retention and satisfaction metrics, investors cannot distinguish between one-time procurement wins and durable customer relationships.
    diligencePath: Request gross and net retention by customer segment, top-account renewal history, and customer-support SLA attainment for enterprise programs versus marketplace orders.
    relatedQuestionRefs:
    - QU017
    - QU023
    - QU025
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: critical
    topic: account-concentration
    missingEvidence: No public breakout exists for top-10 customer GMV or revenue share, customer tenure, or contract value concentration.
    whyItMatters: A handful of large industrial accounts could represent a material share of GMV and implementation load, but the public record is too sparse to size the risk.
    diligencePath: Request a concentration bridge showing top-10 and top-20 customer share of GMV, revenue, gross profit, and software ARR, plus renewal dates for the largest accounts.
    relatedQuestionRefs:
    - QU018
    - QU025
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table coverage
    missingEvidence: The public source set does not provide a complete, current named roster of Moglix enterprise customers; many case studies are anonymized or only indirectly identifiable.
    whyItMatters: Without a fuller named roster, investors cannot cleanly test logo quality, sector concentration, or whether flagship accounts are current versus legacy references.
    diligencePath: Request a current top-customer list with deployment status, segment, region, start date, and whether each account is marketplace-only, managed procurement, or software-enabled.
    relatedQuestionRefs:
    - QU002
    - QU022
    - QU025
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: msme-activity-quality
    missingEvidence: The public source set contains legacy MSME count claims but not fresh data on active MSME cohorts, repeat-order behavior, or contribution to GMV.
    whyItMatters: The long-tail marketplace thesis matters for network effects and margin mix, yet the public record is dominated by enterprise case studies.
    diligencePath: Request monthly active SME buyers, repeat-order rates, average order value, and gross margin by MSME cohort, separated from enterprise managed-procurement accounts.
    relatedQuestionRefs:
    - QU014
    - QU025
    relatedTableRefs:
    - TU001
  - type: conflicting-data
    severity: minor
    topic: metric-definition-drift
    missingEvidence: Public customer and ecosystem metrics are disclosed under changing definitions such as manufacturing plants, companies, business clients, module users, suppliers, and warehouses.
    whyItMatters: The definitional drift makes year-on-year customer-cohort analysis and attach-rate modeling unreliable.
    diligencePath: Ask management to reconcile historical and current KPIs under a single metric dictionary with annual time series for active buyers, enterprise logos, software customers, suppliers, and warehouses.
    relatedQuestionRefs:
    - QU006
    - QU024
    relatedTableRefs:
    - TU002
