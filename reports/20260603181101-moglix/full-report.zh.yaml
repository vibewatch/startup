      - number: '7.4'
        title: 领导层扩容、盈利转换和资本配置纪律仍是开放的执行考题
        blocks:
          - type: paragraph
            body: >-
              Moglix 显然在补强领导层板凳，但公开记录读起来仍像一家从创始人主导扩张走向机构化平台的公司，而不是已经完全完成转型的公司。Rahul Garg 仍是 IPO
              时点、AI/软件战略和资本配置叙事的公开面孔。围绕他，公司在 2025-26 年新增了一位面向 IPO 的 CFO、一位 CTO，以及一位董事总经理 / 首席商务官。这是正面信号，但也说明 Moglix
              自己认为，进入下一阶段前需要拓宽领导层带宽。2023 年裁员事件是公开记录中最清楚的反向人事标记，说明在融资压力下，成本纪律和团队士气已经经历过一次考验。


              财务和战略执行风险也与上市叙事紧密绑定。Moglix 公开讨论过盈利能力改善，报告 FY25 亏损下降，并继续投资软件和并购，但公开证据还没有显示利润率转换已经充分去风险。Moneycontrol 称 IPO
              时间线仍取决于迁册等结构性问题；Livemint
              称公司也预留了大量资金用于收购。这组组合形成典型后期规模风险：管理层必须在大致同一窗口内改善盈利、整合相邻业务、守住服务质量、完成反向迁册，并抵御替代品。如果其中任意两个项目一起滑坡，具备 IPO
              条件的叙事会很快转弱。
