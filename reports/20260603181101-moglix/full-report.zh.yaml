      - number: '3.2'
        title: 直接对手画像，以及各自从哪里攻击 Moglix
        blocks:
          - type: paragraph
            body: >
              最重要的印度竞争者分成三组。第一组是宽平台。IndiaMART 仍是在线 B2B 发现的规模型既有者，Q1 FY26 披露独立询盘 29M、供应商店铺 8.4M、付费供应商 2.18 lakh。Udaan
              的工业属性弱于 Moglix，但其公开平台仍把信贷、物流和面向零售的广泛品类组合在一起，覆盖 FMCG、主食、药品和生鲜。当买家更看重宽度、网络流动性和价格发现，而不是工厂现场执行时，这两个平台最重要。

              第二组是工业和原材料专家。OfBusiness 在采购加金融上的重叠最清楚，尤其是钢铁、聚合物、农业投入品或承包商营运资本主导购买动作时。Zetwerk
              相邻但不相同：当买家想要制造产能、供应商协调和供应保障，而不是重复性 MRO 目录时，它最强。第三组是更窄的专家。Bizongo 数字化企业供应商生态，并嵌入金融。Power2SME 是一个存续时间很长的 SME
              采购聚合商，但最新 CARE 评级显示其流动性紧张、资产负债表杠杆较高。ElasticRun 主要是履约和分销替代方案，而不是直接的 MRO 工作流拥有者。这种碎片化很重要，因为 Moglix
              很少只赢或输给一个对手；它通常在每个品类、紧急程度和客户分层中防守不同竞争者。
