        title: 身份、平台范围与公司版图
        blocks:
          - type: paragraph
            body: >
              Moglix 现在明显不只是一个工业用品在线目录。公司官方页面把它定义为服务制造业和基础设施买家的 B2B 采购与供应链平台，能力包括市场供给、集成采购工作流、采购 SaaS，以及通过 Credlix
              提供的嵌入式金融。品类跨度很宽：官方介绍材料仍以 MRO、安全、电气、照明、办公用品、电动工具和包装为故事主轴；更新的产品页面则把 Cognilix 定位为面向采购和 B2B 销售的 AI 操作系统。


              注册地和运营版图同样重要。Moglix 官方联系页列出的总部地址在 Singapore，印度运营则由 Delhi NCR 的 Noida 承担。当前产品页面显示，公司在
              India、USA、UAE、Singapore 和 Mexico 都有活跃运营；更早的外部报道也曾把 UK 列入版图。承销含义是，Moglix
              应被视为一个以印度为运营中心的跨境工业商业与软件平台，而不只是印度本土 MRO 市场。
