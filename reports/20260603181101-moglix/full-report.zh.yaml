      - number: '2.4'
        title: 正规化、制造业增长和公共采购数字化都是真实顺风
        blocks:
          - type: paragraph
            body: >
              结构性需求逻辑很强，因为印度工业经济体量大、碎片化，而且仍在正规化。印度 MSME 部 2025-26 年度报告称，该部门贡献 GDP 的 31.1%、出口的 48.5% 以上；IBEF 2026 年 MSME
              报告描述了 7.47 crore 家企业、32.82 crore 名雇员，以及截至 2026 年 2 月 7.85 crore 个单位的注册基础。对 Moglix 这样的公司尤其重要的是，IBEF 还称 72%
              的 MSME 交易现在已经数字化。这不意味着采购已经完全数字化，但意味着支付和合规轨道已经朝正确方向移动。Bessemer 的框架解释了机制：GST 降低跨州摩擦，eWay Bills
              提升物流可追踪性，TReDS 改善应收账款融资，PLI 或 Make in India 扩大工业基础。


              公共采购提供了第二个证明点。PIB、Mint、ET 和 Business Standard 都显示 GeM 已经跑到很大规模：FY25 截至 1 月 GMV 为 ₹4.09 lakh crore，FY25 GMV
              为 ₹5.4 trillion，FY26 GMV 为 ₹5 trillion，并拥有数百万卖家和强劲的 MSME 参与。这不是 Moglix 的
              SAM，但它有力证明，印度采购基础设施可以在全国范围内支撑数字目录购买、竞价、价格发现和买卖双方入驻。制造业基本面也有帮助：PIB 和 IBEF 显示 FY26 制造业 GVA 强劲增长、PMI
              扩张，政策目标也希望逐步把制造业 GDP 占比提高到 25%。这些条件会让工业采购平台变得更相关，而不是更边缘。
