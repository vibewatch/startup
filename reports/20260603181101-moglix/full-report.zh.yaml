      - number: '7.3'
        title: IPO 窗口完全打开前，伙伴、平台与替代品风险可能先压缩利润率
        blocks:
          - type: paragraph
            body: >-
              Moglix 的依赖风险不只是单一供应商或某个物流承包商。风险在供应商、ERP 系统、融资通道和替代采购渠道之间相互作用；这些替代渠道对许多采购动作已经足够好。Amazon Business
              继续直接面向制造和企业账户营销 RFQ、引导式采购、集成、支出分析和企业采购控制。OfBusiness 面向庞大的 SME 和原材料客群营销“采购 + 信贷”模式。两者都不是 Moglix
              托管式工业采购模式的完美复制，但合在一起说明，尾部支出软件和“采购 + 金融”已经是竞争品类，不是空白市场。这一点重要，因为 Moglix 正同时证明软件变现，并维持商品主导的运营规模。


              同样的相互依赖也存在于 Moglix 自己的技术栈内。PRNewswire 和 Moneycontrol 都把 Cognilix 描述为与现有 ERP 系统一起工作的一层，统一采购、供应链和 B2B
              电商工作流。这个定位商业上合理，但会带来依赖风险：干净数据、供应商参与、集成质量和物流执行必须同时跑通，承诺的软件价值才能落地。公开披露对供应商集中度、放贷方集中度和物流伙伴集中度也很薄。因此，正确解读不是
              Moglix 有一个显而易见的单点故障，而是公司有几个中等规模依赖风险；当竞争、弱数据质量或服务滑坡同时出现时，它们会合成一个大风险。
