  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 公开财务基线，以及为什么收入线需要范围纪律
        blocks:
          - type: paragraph
            body: >-
              Moglix 属于这样一类后期初创公司：公开财务可见度真实存在，但结构上仍不完整。开放来源现在提供三组相互重叠的视角：引用 Singapore 集团文件的新闻文章、连接 MCA
              的印度运营实体聚合数据，以及标准化融资和员工数的跟踪页面。这些视角有用，但并不相同。FY23 来源指向大约 ₹4,595-4,665 crore 的收入或 GMV 等效规模，亏损约 ₹193-196
              crore。FY24 来源指向 ₹4,964 crore 运营收入、₹5,309 crore 总收入，亏损降至约 ₹189 crore。随后 FY25 报道显示收入约 $681.5M，亏损大幅收窄；Tofler
              2025 年 3 月印度实体看板则显示收入 ₹4,946.6 crore，EBITDA 仍为负。

              干净的承销动作不是追一个“完美”收入数字，而是看收入构成说明了什么。FY24 披露显示，交易商品贡献了运营收入的 98.98%，佣金、IT 服务、保理和相关服务填补剩余部分。这让 Moglix
              在财务上更像一个货品很重、叠加软件和金融附件的采购平台，而不是干净的 SaaS
              公司。收入规模大且仍在增长，但质量取决于毛利率留存、应收纪律，以及软件和金融层能在多大程度上不靠货品引擎几乎独自扛起收入线而实现规模化。
