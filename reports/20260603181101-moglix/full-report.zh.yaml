            - 现场工程师和项目仓库
        - label: 预算负责人
          values:
            - 采购 + 工厂运营
            - 工厂网络运营
            - 工厂 + 共享服务采购
            - 项目或 EPC 预算
        - label: 核心痛点
          values:
            - 供应商分散，价格波动大
            - 缺货，采购可视性弱
            - 长尾支出和审批复杂
            - 现场采购分散，且有加工需求
        - label: 数字化触发点
          values:
            - 节省成本，并按 GST 合规标准化
            - 清理主数据，跨工厂管控
