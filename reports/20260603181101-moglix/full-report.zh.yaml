      - number: '8.2'
        title: 最后一轮估值锚点与可比公司组
        blocks:
          - type: paragraph
            body: >-
              可比证据比公司标题更能显出估值张力。OfBusiness 已盈利且按收入大得多，据报道最后一轮估值约 $5 billion，对应 FY24 收入约 $2.3 billion，约 2.2x 销售额。Zetwerk
              最新公开映射约为 $3 billion，对应 FY25 总收入 ₹12,798 crore，约 2.0x 销售额。Udaan 维持不变的 $1.8 billion 估值，对应 FY24 收入约 ₹5,700
              crore，折合约 2.7x 销售额，并且仍伴随明确的盈利和重组叙事。这些是最接近的印度后期私募市场映射，全部低于 Moglix 最后一轮隐含倍数。


              溢价侧对比对象是 IndiaMART，而不是另一家私有 B2B 电商独角兽。IndiaMART 2026 年 6 月市值约 $1.24 billion，相对年化 Q1 FY26 收入，隐含约 7x
              销售额，明显高于私有 B2B 区间。但 IndiaMART 是上市、盈利、轻资产且披露充分的公司，Moglix 还不是。Grainger 约 3.4x 销售额的公开倍数，以及 Würth 的 €20.7
              billion 收入规模，也进一步说明，工业分销规模本身不会自动获得风险投资溢价。含义很直接：如果盈利转换落地，Moglix 可以相对承压私有同行拿到溢价；但以今天公开证据，还不能有把握地支持支付等于或高于
