      - - Zetwerk
        - 私营；已秘密递交 IPO 文件
        - FY25 总收入约 ₹12,798cr；亏损约 ₹371cr
        - 约 $3B；约 2.0x 销售额
        - 可作为制造平台和印度 IPO 可比参照
        - 制造业运营模型与采购分销并不相同。
      - - Udaan
        - 私营；Series G 延长轮
        - FY24 收入约 ₹5,700cr；EBITDA 烧钱约 ₹923cr
        - 约 $1.8B；约 2.7x 销售额
        - 后期 B2B 商业的承压下限参照
        - 品类宽度和重组历史让可比性打折。
      - - IndiaMART
