      - number: '3.4'
        title: 切换成本、护城河耐久性与主要竞争风险
        blocks:
          - type: paragraph
            body: >
              Moglix 的护城河既不是微不足道，也不是永久稳固。其地位最耐久的部分，是品类聚焦、托管采购服务，以及在紧急工业品类中的运营准备度。公开对比来源反复把 Moglix 放在比 IndiaMART 或 Udaan
              更接近工业 MRO 和企业供应链执行的位置；Rahul Garg 被引用的观点也解释了为什么托管模型一旦嵌入工厂运营，就会变得有粘性：全栈 B2B 模型能在销售、分销、营运资本和履约之间制造协同。

              但几个风险是真实的。更快履约会增加成本，也可以被复制。当 OfBusiness、Udaan、Bizongo 和 Power2SME 都附加某种信贷或融资支持时，金融不再是独特差异点。IndiaMART
              拥有上市公司披露、现金和流动性优势，很难被轻视。Amazon Business、Grainger 和 Würth 可以在不复制 Moglix
              精确本地服务模型的情况下，拿下标准化间接支出或库存管理项目。当买家已经有强内部采购团队和分销商关系时，SAP 和 Coupa 也能压缩 Moglix
              的工作流层。最安全的承销结论因此是护城河耐久性中等：Moglix 在托管工业采购上有可防守切口，但普通长尾支出、供应商发现和金融驱动的原材料流仍可被竞争。
