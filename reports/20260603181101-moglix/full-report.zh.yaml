      - number: '1.3'
        title: 融资历史、估值锚与股东结构
        blocks:
          - type: paragraph
            body: >
              Moglix 到 2022 年初之前的公开资本历史很清楚，此后就没有那么干净。官方和独立报道都明确记录了 2021 年 5 月 $1B 估值的 Series E 轮，以及 2022 年 1 月约 $2.6B
              估值的 Series F 轮。在开放来源中，这两次仍是最后两个被广泛交叉验证的外部定价事件。之后，跟踪数据略有分歧：Tracxn 给出的累计融资约 $471M，Inc42 约 $481.5M，Owler 约
              $483.2M。2025 年 2 月的事件被描述为母公司向印度业务注入内部资金，而不是新的外部领投轮。


              实际尽调含义是，Moglix 仍是后期独角兽，但没有刷新过的公开估值基准。开放来源中可见的投资者包括 Tiger Global、Alpha Wave/Falcon Edge、Harvard
              Management、Sequoia/Peak XV、Accel、IFC、WFM Asia、Ward Ferry、Venture Highway 和 Jungle
              Ventures。不过，公开来源仍未披露当前股权结构表、治理权利，也未说明 2025 年注资是否实质改变了所有权经济。
