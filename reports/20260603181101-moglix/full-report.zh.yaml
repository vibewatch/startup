      - number: '6.4'
        title: 留存和集中度是公开客户记录最弱的部分
        blocks:
          - type: paragraph
            body: >-
              留存可见度有限。Moglix 确实发布了经过筛选的正面客户证言，包括成功换货、退款、快速响应和再次购买意愿，因此公开材料至少能看到一部分满意客户。但本次审阅的官方页面、发布故事和案例研究，没有披露
              NPS、CSAT、GRR、NRR、续约队列或账户级流失。反向一侧，公开投诉板和评价平台反复出现市场端问题：退货被拒、退款延迟、发错或损坏商品，以及客服回应混乱。这些信号不能直接当作大型企业账户流失的证据，因为
              Moglix Business 案例强调的企业项目，在结构上不同于零售式市场订单。但它们确实提示服务质量尾部风险。


              更大的分析问题是集中度。Moglix 最强的公开证据集中在大型工业买方、公用事业、项目型 EPC 账户和规模化数字运营商。这可能意味着 GMV 和实施投入中相当一部分绑定在少数重型账户上，而公开 MSME
              证据远弱于表层规模口径。政府和 PSU 需求显然扩大了可触达客群，但公共采购数字化仍伴随漫长招标周期、L1 偏好和执行摩擦。因此，本章对客户质量给出建设性判断，但对透明度和集中度保持谨慎。
