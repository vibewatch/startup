  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资 / 阶段
      - 目标细分市场
      - 核心强项
      - 相对 Moglix 的主要短板
    rows:
      - - IndiaMART
        - 已上市 B2B 市场平台老牌玩家
        - Q1 FY26：29M 询盘、8.4M 店铺、2.18 lakh 付费供应商；市值 ~$1.24B
        - MSME、大企业、覆盖多品类的广泛买方
        - 公开市场平台流动性最高，且有上市公司披露
        - 在托管式工厂现场采购和紧急 MRO 执行上的公开信号更弱
      - - Udaan
        - 综合 B2B 商务平台
        - 2025 年 $114M 融资轮，估值 ~$1.8B；累计融资 >$1.95B；FY24 收入 ₹5,700 crore
        - 小型零售商、HoReCa、FMCG 与主食买方、品类驱动型贸易账户
        - 面向零售导向品类的信贷、物流和广泛商品
        - 在工业 MRO 和企业托管采购上专业化程度较低
      - - OfBusiness
        - 原材料采购 + 融资平台
        - 累计融资 >$800M；FY24 收入 $2.3B；FY24 PAT $72.6M；IPO 目标 $6B-$9B
        - 购买投入品和营运资本的制造商、承包商和 SME
        - 原材料寻源很深，并能绑定金融
        - 更贴近原材料，而不是反复发生的工厂现场长尾支出工作流
      - - Zetwerk
        - 制造驱动的相邻竞争者
        - 累计融资 $877.62M+；IPO 前估值 ~$3B；FY25 总收入 ₹12,798 crore
        - 需要定制制造或供应保障的 OEM 和企业
        - 制造 OS、自有和合作工厂、1,800+ 客户、20+ 国家
        - 重心不在反复发生的 MRO 目录广度或托管式长尾支出采购
      - - Bizongo
        - 供应商数字化及包装 / 采购专家
        - 累计融资 $319.81M+；FY23 收入 ₹184.4 crore
        - 推进供应商网络、包装和供应链工作流数字化的企业
        - 采购到付款数字化，并嵌入供应商金融
        - 品类范围更窄，公开规模小于 Moglix
      - - Power2SME
        - SME 采购聚合商
        - 累计融资 $85.38M+；FY24 收入 ₹638.7 crore；FY25 收入 ₹1,009.57 crore
        - 采购金属、聚合物、纱线和化学品的 SME
        - 面向小企业的聚合采购 + 融资
        - 财务画像偏弱、流动性紧，且可见企业客户深度较低
      - - ElasticRun
        - 履约与分销替代方案
        - 估值下调至 $800M；2.5M+ sq. ft.；600+ 城市 / 镇
        - 需要覆盖 B2B、电商和即时零售多速度履约的品牌
        - 大型仓储和物流网络，并叠加 SaaS 层
        - 不是聚焦工业采购或 MRO 控制的平台
      - - Amazon Business / Grainger / Würth 组合
        - 全球间接采购与 MRO 替代组合
        - Amazon：300+ 集成；Grainger：市值 ~$60.97B，TTM 收入 $17.94B；Würth：VMI 节省指标
        - 集中管理间接支出和库存计划的企业
        - RFQ、认证供应商、VMI、自动售货、采购集成、成熟分销商打法
        - 对印度特定工业工作流和托管式地面服务的本地化较弱
    notes: |
      本枚举覆盖本章审阅的、与印度市场最贴近的直接和相邻替代方案，以及最重要的全球替代类别。各行是有证据支撑的快照，不是完整公司画像；当多个替代品以相近角度竞争同一买方任务时，用合并行呈现。
    enumerationScope:
      coverage: partial
      basis: >-
        Built from reviewed Indian direct rivals, industrial-adjacent platforms, and global substitute classes that
        solve the same procurement job; grouped rows reflect overlapping substitute sets rather than every company in
        the market.
