      - number: '4.2'
        title: 变现栈与公开可得的最佳销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              最好的公开证据显示，Moglix 至少通过五层变现：工业品销售、线上销售佣金、托管采购和支持服务、Cognilix
              软件费，以及通过保理和供应链金融产生的金融收入或费用。问题不是这些层是否存在；多个来源都点名了它们。问题在于实际定价和收入结构仍未披露。Moneycontrol 2026 年 1 月关于 Cognilix
              的报道很有价值，因为它明确称 Moglix 计划主要通过软件费变现该产品，部分合同会与交易量挂钩。这一点重要，因为它说明 Moglix 正试图在很薄的商品驱动基础之上，创造质量更高的软件收入流。

              公开 GTM 和销售效率代理指标最强的地方，不是明确的 CAC 或回本披露，而是客户结果案例。官方案例研究称，矿业场景节省成本 10-15%，锌业供应商基础减少
              30%，油气场景创建了干净主数据。Moneycontrol 还补充称，已有 10 多家企业独立使用 Cognilix，部分企业库存降幅最高 30%。这些是有用的扩张和 ROI
              信号，但仍没有披露实际软件定价、合同期限、续约率、销售周期长度，或按收入流拆分的贡献利润率。实际含义是，公开故事支持客户有付费意愿，但还不能支撑干净的销售效率承销。
