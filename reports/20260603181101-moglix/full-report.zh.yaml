          note: 从 $57.1B 的印度 MRO 基数、当前极低的线上渗透率，以及 Moglix 聚焦有组织的多站点间接采购而非全部工业支出推导
    approximationNotes: |
      这个区间由作者推导，应视为方向性判断而非事实。它用于把讨论从更宽的 $200B 外层市场逻辑拉回可约束范围。
