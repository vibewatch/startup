      - number: '4.4'
        title: 财务结论与仍然重要的尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              证据支持一个混合但不悲观的财务结论。Moglix 规模足以重要，FY25
              的公开改善足以让盈利逻辑继续成立，变现相邻层——软件、托管采购和金融——也足以支持毛利质量可能随时间改善的论点。官方融资历史也不是眼前问题；公司显然在 2021 年和 2022 年完成了大额增长轮，随后又在
              2025 年获得较小的母公司注资。更难的问题是，这些资本投入现在是否正在转化为耐久、低烧钱的运营模型。

              公开数据仍未解决这一点。最好的反向证据不是欺诈或监管困境，而是运营压力。Moglix 在 FY24 增速大幅放缓，利润率仍为负，2023
              年融资寒冬期间出现裁员，公开来源仍没有展示合并现金、现金跑道、客户集中度、实际抽佣率，或真正按收入流拆分的毛利瀑布。本章因此落在一个有纪律的结论上：Moglix
              看起来可融资，也有可能接近盈亏平衡，但承销案例仍取决于管理层证明，软件和金融附件能比商品型营运资本与制造扩张消耗资本更快地抬升利润率。在这些证据出现前，通往耐久盈利的路径应被视为有希望但尚未证明。
