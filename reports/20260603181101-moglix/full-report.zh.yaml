      - number: '8.4'
        title: 最终尽调清单与投资观点
        blocks:
          - type: paragraph
            body: >-
              真正会改变建议的，不是更多关于品类规模、AI 或采购数字化的叙事。投资者需要合并口径 FY25-FY26 收入桥、按商品 / 软件 /
              金融分流的经审计毛利率、营运资本和债务明细，以及对股权结构表和优先股堆叠的直接可见性。这些文件决定 Moglix 应该拿分销商式倍数、相对私有 B2B 同行的小幅溢价，还是未来 IndiaMART
              式重估。没有这些文件，讨论仍会锚在过时轮次价格和选择性追踪快照上，而不是当前可承销的经济性。


              如果盈亏平衡明显晚于管理层公开时间线、反向迁册拖延并推迟 IPO 窗口，或下一轮外部融资低于 2022 年锚点，投资逻辑会迅速转弱。如果 Moglix 证明 FY25
              利润率改善可持续，展示软件和金融附加能抬升混合经济性，并拿出当前外部验证而不只是内部支持，投资逻辑会增强。在此之前，正确投资姿态是跟踪执行、守住价格纪律。Moglix
              不是回避标的；它的公开上行仍真实，但当前估值支撑仍不完整。
