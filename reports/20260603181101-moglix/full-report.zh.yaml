  - id: FP003
    title: 护城河 / 就绪度 KPI
    type: kpi
    layout: compact
    summary: 紧凑的承销视角：Moglix 看起来最强的地方、替代品最可信的地方，以及公开证据仍缺什么。
    data:
      items:
        - label: 工业 MRO 聚焦
          value: High
          detail: 对比来源中，Moglix 比 IndiaMART 或 Udaan 更偏工业场景，也更重执行。
        - label: 托管采购就绪度
          value: High
          detail: BusinessLine 2025 年快照指向真实的次日履约：45+ 个履约中心，以及目标品类里 1 lakh+ 个在库 SKU。
        - label: 市场流动性缺口
          value: Medium
          detail: IndiaMART 的询盘、店铺和付费供应商仍领先；这会影响通用型、靠发现驱动的需求。
        - label: 金融差异化
          value: Medium-low
          detail: 信用越来越像入场券：OfBusiness、Udaan、Bizongo 和 Power2SME 都对外主打融资支持。
        - label: 纯软件替代风险
