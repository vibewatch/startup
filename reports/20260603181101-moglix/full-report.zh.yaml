  - id: TP003
    title: 定价 / 包装比较
    columns:
      - 竞争对手组
      - 公开定价 / 合同姿态
      - 看起来包含的内容
      - 仍不透明的内容
      - 对 Moglix 的含义
    rows:
      - - Moglix
        - 大多是协商式企业合同，而不是清晰公开的标价
        - 工业供应、托管采购、更快履约、金融邻接
        - 服务费、软件定价和实际品类利润率
        - 当买方更看重执行和整合、而非最低可见单价时，Moglix 位置最好
      - - IndiaMART
        - 市场平台变现，加上 SaaS 和信贷邻接；审阅来源没有披露当前套餐细节
        - 发现、线索流、供应商店铺、SaaS 扩张
        - 当前订阅价目表、托管服务定价和实际抽佣率
        - 强大的发现型竞争者，但并不是可一一对照的托管采购合同
      - - Udaan
        - 批发商品、信贷和物流经济性，而不是已发布的企业合同菜单
        - 广泛商品、自有品牌、信贷、快速配送
        - 品类级利润率、抽佣率和企业采购费用
        - 价格压力主要落在商品化品类，而不是专业 MRO 工作流
      - - OfBusiness
        - 以报价驱动的原材料定价，并绑定信贷，而不是透明标价
        - 投入品寻源、营运资本、制造和贸易邻接
        - 融资利差、服务费和确切品类经济性
        - 当钢材、化学品或承包商投入品主导采购动作时，重叠最严重
      - - Amazon Business / 全球分销商
        - 可见 SKU 价格、RFQ、VMI 计划和协商账户条款的组合
        - 认证供应商、长尾支出控制、自动售货、库存计划、采购集成
        - 企业返利、本地服务经济性和印度特定折扣结构
        - 对标准化间接支出和成熟采购团队是强替代
      - - SAP / Coupa
        - 软件订阅和寻源到付款授权，而不是产品利润率定价
        - 审批、供应商管理、合同、支出分析、合规
        - 审阅来源中的授权经济性和总体部署成本
        - 当买方把分销商和实物库存分开保留时，可以替代 Moglix 的工作流层
    notes: |
      这里审阅的大多数竞争对手公开定价透明度都低。因此，本表比较的是定价姿态和包装逻辑，而不是假装协商式企业采购合同存在清晰发布的收费表。
