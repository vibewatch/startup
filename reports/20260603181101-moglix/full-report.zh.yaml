      - number: '6.2'
        title: 部署证据覆盖汽车、能源、公共部门和数字原生买家
        blocks:
          - type: paragraph
            body: >-
              Moglix 客户章节最有力的部分，是落地证据密度很高。公开案例覆盖一家参与 Indian Railways 机车项目的 EPC
              承包商、一家私营原油生产商、大型两轮车和拖拉机制造商、州属公用事业公司、Unilever、Urban Company、Air India、一个服务 30,000
              家餐厅的外卖平台、Xpressbees、一家大型电子药房零售商、一家主要汽车照明制造商，以及一家以锌为核心的金属公司。这些引用质量不一：有些完全具名，有些可通过业务描述强识别，有些仍匿名。但合在一起，它们说明
              Moglix 已进入真实采购流程，而不是只在宣传一个大目录。


              工作流模式同样重要。公开材料通常把 Moglix 描述为运营买方门户、合同自动化、供应商整合、ERP 邻近采购、同步寻源、包装方案，或项目执行支持。量化结果很多：油气场景 PR-to-PO 提升 60%，两轮车
              OEM 订单周期缩短 85%，拖拉机制造商节省 85% 员工工时，输电公用事业节省 12%，外卖客户节省 30%，电商包装方案订单履约准确率 100%，多个汽车和金属案例节省 2-6%，并为 Urban
              Company、Xpressbees 和 Air India 提供大体量运营支持。这种宽度最清楚地证明，Moglix 的客户价值来自工作流和履约深度，而不只是线上品类。
