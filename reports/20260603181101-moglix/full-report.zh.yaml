      - number: '8.3'
        title: 乐观、基准和悲观区间及下行触发因素
        blocks:
          - type: paragraph
            body: >-
              这里用情景分析比假精确更诚实，因为核心缺口不是算术，而是验证。悲观情景假设印度后期私募市场纪律仍紧，2025 年 2 月内部轮被解读为支持而非验证，Moglix 偏商品重的模式按更接近
              OfBusiness、Zetwerk 或 Udaan 类型私有区间定价。在这种读法下，约 $1.0-$1.5 billion
              区间合理。它不需要业务崩盘；只需要投资者按分销型或重置倍数价格，为一家最后外部估值已是数年前的公司定价。


              基准情景承认 Moglix 有真实规模、亏损收窄，并有可行的盈亏平衡路径；同时仍折价处理缺少新外部轮、缺少完整分业务流利润率披露、以及反向迁册尚未完成。这支持约 $1.8-$2.2
              billion。乐观情景需要几件事同时发生：FY25 式增长必须延续，6 到 9 个月盈亏平衡目标必须被证明真实，迁册和 IPO
              准备必须保持正轨，公开市场情绪还要给予公司更接近盈利或上市基准的溢价。在这条路径下，$2.5-$3.0 billion 可以辩护。但今天，基准情景是唯一被公开证据完全支持的情景。
