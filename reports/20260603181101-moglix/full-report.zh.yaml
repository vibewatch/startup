  - id: FI004
    title: 资本强度 / 现金流图谱
    type: matrix
    layout: standard
    summary: 这张矩阵列出公开可见的主要资本消耗向量，以及它们对 Moglix 通往持久盈利的含义。
    data:
      columns:
