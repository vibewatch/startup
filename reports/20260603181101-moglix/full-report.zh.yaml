    data:
      nodes:
        - id: n1
          label: 监管与上市事项
          detail: FDI、GST、DPDP、RBI 数字借贷、反向迁回和 SEBI 事项都要干净落地。
          tone: negative
        - id: n2
          label: 供应商与物流执行
          detail: 供应商质量、仓储纪律和承运商交接共同决定交付与退款结果。
          tone: negative
        - id: n3
          label: ERP / 数据工作流质量
          detail: Cognilix 的价值取决于数据质量，以及能否稳定接入客户系统。
          tone: negative
        - id: n4
          label: 客户信任与采用
          detail: 服务质量和工作流验证决定 Moglix 会变得黏性更强，还是容易被替代。
          tone: neutral
        - id: n5
          label: 毛利与盈利能力转化
          detail: 只有采用留住、服务故障受控，软件收费和经营杠杆才会改善。
          tone: neutral
        - id: n6
          label: IPO 时间点与披露准备度
          detail: 反向迁回和公众公司控制成熟之后，上市叙事才可信。
          tone: negative
        - id: n7
          label: 估值 / 建议
