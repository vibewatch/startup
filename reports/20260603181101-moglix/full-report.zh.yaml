      - 收入 / 规模
      - 估值 / 倍数
      - 可比意义
      - 局限
    rows:
      - - Moglix
        - 私营；上一轮外部融资为 2022 年 1 月
        - FY24 收入约 ₹4,964cr；FY25 运营收入约 $681.5M
        - $2.46B-$2.6B 历史估值；约 4.4x FY24 收入或约 3.8x FY25 收入
        - 直接标的公司，也是当前定价锚
        - 这个锚已经过时，2025 年资金来自母公司，不是新的外部领投。
      - - OfBusiness
        - 私营；正在筹备 IPO
        - FY24 收入约 $2.3B，税后利润约 $72.6M
        - 上一轮约 $5B；约 2.2x 销售额
        - 最佳印度盈利型 B2B 商业可比参照
