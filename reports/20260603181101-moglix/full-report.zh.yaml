        - 中
        - 这是效率和利润率修复的简单压力测试
        - 索取 FY25、FY26 YTD 以及 Cognilix 合同后的同口径比率
      - - 营运资本天数
        - Tofler 显示，2025 年 3 月营运资本天数为 27，应收账款天数 56，应付账款天数 33
