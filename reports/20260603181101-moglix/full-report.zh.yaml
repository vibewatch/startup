        - Tofler 2025 年 3 月净利率约 -2.6%；FY25 集团亏损仍约 $11.3 million
        - 中
        - 亏损在收窄，但盈利能力是否可持续仍不清楚
        - 索取经审计合并净利润桥接表和特殊项目调节表
