      - number: '6.3'
        title: 规模信号真实，但公开指标历史不可直接横比
        blocks:
          - type: paragraph
            body: >-
              Moglix 披露的规模明确信号向上，但拼不成干净的同口径历史。较早的公开来源称，公司服务 3,000+ 家制造企业或工厂、500,000+ 家 SME，并由大约 10,000-16,000
              家供应商、25-35+ 个仓库和 450,000-500,000+ 个 SKU 支撑。到 2026 年，Cognilix 发布把公司重新放到生态规模和软件深度框架下：45,000 家供应商、1.2 million
              个 SKU、58 个仓库、80 个国家、1,000+ 家使用底层模块的客户，以及 10+ 家使用独立 Cognilix 的大型企业。从方向看，信号正面：Moglix
              扩大了供应商覆盖和实体基础设施，同时把一部分采购关系转成更高价值的软件合作。


              问题在于定义漂移。制造企业、制造工厂、商业客户、企业客户、模块客户和独立使用 Cognilix
              的大型企业，不是同一种单位，公开记录也很少把它们对齐。因此，数据能有力支持生态宽度结论，但不能精确回答活跃客户增长、附加率或净留存率。投资者应把当前披露解读为有意义的装机基础变现潜力，而不是一条完全可比的时间序列。
