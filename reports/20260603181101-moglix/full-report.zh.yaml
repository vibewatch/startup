      - number: '3.3'
        title: 能力、定价姿态与分销对比
        blocks:
          - type: paragraph
            body: >
              能力对比最能看出 Moglix 的差异化。已审阅的对比来源一致把 Moglix 定位得比 IndiaMART 或 Udaan 更工业、更重执行。BusinessLine 2025 年快照尤其有用，因为它显示
              Moglix 在 PPE、MRO 和电气耗材上，借助 1 lakh+ 库存 SKU 和 45+ 履约中心，把 21 个城市的交付从 96 小时压缩到次日达。这看起来很不同于 IndiaMART
              的市场流动性模型，也不同于 Udaan 广泛的零售贸易品类。OfBusiness 在采购加金融上重叠更多，而不是一般发现；Zetwerk 更接近制造保障，而不是重复性 MRO 补货。

              不过，公开定价证据远薄于公开产品证据。多数企业合同似乎是谈判定价，而不是目录价。IndiaMART 公开披露市场规模和盈利，但不披露可比的托管采购费率表。Udaan 和 OfBusiness
              披露品类重点和融资，但没有干净的企业抽佣率。Amazon Business 是最清晰的长尾支出替代品，提供 RFQ、引导式采购、售货机、验证供应商和 300+ 个电子采购集成。Grainger 和 Würth
              展示了成熟托管库存和 MRO 分销在全球规模上的样子。SAP 和 Coupa
              的意义不同：它们让大型买家把审批、合同、供应商管理和支出可见度留在内部。因此，当客户想要实物执行和托管工业补货，而不只是工作流软件时，Moglix 最容易赢。
