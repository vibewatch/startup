        - 工厂耗材、备件、安全、电气、工具、办公和设施用品，用于持续运营
        - 长期大宗商品合约下销售的直接生产原材料
        - 工厂采购负责人、维护负责人和供应链负责人；由工厂或集团采购预算支付
        - MRO 目录、供应商整合和合同采购构成 Moglix 核心切入点
      - - 采购工作流与电子采购软件
        - 寻源到付款工作流、供应商管理、目录控制、分析、合同和订单管理
        - 没有采购工作流的独立 ERP 核心；通用办公生产力工具
        - 集团采购、共享服务或采购转型预算
        - 核心数字控制层，让供应整合更具粘性
      - - 库存、VMI 和补货服务
        - 供应商管理库存、基于 ARC 的补货、现场库房和实时订单跟踪
        - 没有采购工作流或目录控制的纯第三方物流
        - 工厂运营或供应链预算
        - 多站点企业的重要运营差异化因素
      - - 包装、制造加工和基础设施相邻业务
        - 定制包装、间接 EPC 或基础设施采购，以及与企业采购绑定的加工制品
        - 消费包装、通用零售电商，以及托管采购之外的直接资本开支建设合同
        - 采购与业务单元预算负责人
        - 相邻扩张层，但不是最干净的直接 SAM 口径
      - - 嵌入式金融与营运资本支持
        - 发票贴现、PO 融资，以及与采购流关联的信贷驱动交易促成
        - 脱离供应商或采购工作流的独立放贷
        - 司库、财务或供应商关系负责人
        - 战略飞轮和变现增强项，而不是最干净的市场边界
      - - 被排除的现状方案和替代品
        - N/A
        - 本地线下分销商、直接 OEM 代表、仅靠内部 ERP 的采购和人工工厂采购
        - 现有工厂采购团队
        - 这些是买方完成任务的既有方式，定义切换摩擦，而不是计入 SAM
    notes: |
      边界有意窄于“所有印度 B2B 电商”。Moglix 的直接市场是经常性工业采购，以及让这种采购能跨站点治理的软件和服务层。
