  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Moglix 的规模和战略相关性足以让它留在投资者观察名单上，但公开记录不足以证明应把 2022 年 1 月估值当成当前公允价值来支付。公司确实在 Series F 轮以 $2.6 billion 估值融资
              $250 million，多个数据库仍保留这个锚点。问题在于，它已经是旧估值。此后没有新的第三方融资轮清楚地以同等或更高价格重新承销公司；2025 年 2
              月注资来自新加坡母公司，而不是新的外部领投方。因此，2025 年资本事件更适合作为流动性和 IPO 准备信号，而不是新的市场验证。


              经营图景足够好，仍保留上行空间，但还不足以抹平估值缺口。FY24 公开收入约 ₹4,964 crore，后续 FY25 报道指向约 $681.5 million 经营收入，亏损接近减半。管理层还称 6 到 9
              个月内可能达到盈亏平衡。这些都是实质利好。即便如此，过时的 $2.6 billion 估值仍意味着约 4.4x FY24 收入、约 3.8x FY25
              收入。对于一家仍偏商品重、仍依赖融资、且持久盈利尚未被公开证明的公司，这个定价偏高。因此，基于公开来源的有纪律结论是观察，而不是买入。
