      - 工作流步骤
      - 实测结果
      - 局限
    rows:
      - - 目录采购和寻源到付款
        - 手工创建 PR、追报价、目录割裂
        - Cerebra + Moglix Business
        - 发起申请 → 目录选择 → 审批 → PO → ERP 确认
        - PR 创建时间最高下降 85%；需求到 PO 周期快 5-10x
        - 公开证据最强的是 SAP 联动案例，而不是广泛连接器矩阵。
      - - 供应商入驻与协作
        - 供应商沟通割裂、文件缺口
        - Cortex
        - OTP 入驻 → 完善资料 → 合规文件 → 订单 / 发票跟踪 → 付款可见性
        - 入驻快 70%；合规文件完整率 90%
        - 未公开欺诈评分、KYC 工作流深度或集成 API 细节。
      - - 库存规划与补货
        - 库存周转天数高、积压库存多、预测偏弱
        - Cogniplan
        - ERP 中发起 PR → AI 推荐 → 用户调整 / 说明理由 → 审批 → 监控
        - 库存天数降低 20% 的目标；某案例四个月优化 6.25%
        - 模型假设、预测准确率和失败模式未公开。
      - - 竞争性寻源和拍卖
        - RFQ 周期慢、价格发现弱
        - Connexa
        - 供应商短名单 → 拍卖活动 → 出价 / 重新拍卖 → 授标 → 审计轨迹
        - 声称寻源成本降低 40%、周期加快 30%
        - 未公开按品类拆分的拍卖量。
      - - 数字化销售和客户订单可视化
        - 手工询价、电话报价、透明度弱
        - Cognimart
        - 目录 / 价格发布 → 订单捕获 → SAP / CRM 同步 → 发货可视化 → 仪表板
        - 某案例手工工作量减少 60%，周转速度最高提升 80%
        - 公开证据有选择性，且偏向重工业。
      - - 买方移动控制塔
        - 离开桌面系统后仍需配送可视化
        - 买方移动 App
        - 查看配送 → 跟踪订单 → 查看采购到付款数据 → 发起查询
        - 企业工作流按角色延伸到移动端
        - App 文案看起来早于最新 Cognilix 规模披露。
      - - 供应商和渠道营运资金
        - 供应商和经销商普遍承受应收账款压力
        - Credlix
        - 发票 / PI 上传 → 融资申请 → 放款方放款 → 对账
        - 释放最高 90-95% 的发票价值；覆盖企业和经销商项目
        - 未公开信贷损失、定价或放款方集中度指标。
