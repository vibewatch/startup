  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户组合很宽，但公开证明偏向重量级企业账户
        blocks:
          - type: paragraph
            body: >-
              Moglix 的公开客户组合看起来远比消费型业务更偏企业。公司自己的业务页面仍围绕企业采购和供应商协作来表述产品；更早的公开资料则称 Moglix 在服务数千家制造企业或工厂的同时，也覆盖很大的 SME
              基础。2026 年 Cognilix 发布材料又一次改变了讨论方式：它不再强调 logo 数量，而是强调采用深度，称超过 1,000 家客户正在使用一个或多个底层模块，且 10 多家大型企业独立部署
              Cognilix。这种拆分很重要，因为它说明公司已经搭起了宽商业生态，但最深、最有粘性的关系很可能集中在较大的托管账户，而不是匿名长尾。

              证明表面也反映了这一现实。多数可量化公开案例研究落在汽车、金属和采矿、油气、公用事业、基础设施、物流和规模化数字运营。这是严肃 B2B
              相关性的好证据，但不同于清楚披露活跃客户数或客户集中度。较早的独立报道中确实出现过具名客户，但当前公开名单仍比规模主张暗示的要薄得多。正确读法是，Moglix
              具备真实的多细分覆盖，但投资者应把企业层视为核心客户引擎，把 MSME 层视为方向上很大但披露不足。
