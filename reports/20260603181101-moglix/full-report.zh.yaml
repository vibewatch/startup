      - number: '7.2'
        title: 规模越大，运营质量、履约和数据安全风险越高
        blocks:
          - type: paragraph
            body: >-
              Moglix 已经到了小流程故障可叠加成商业损害的规模。Cognilix 发布材料描述的网络包括 45,000 家供应商、1.2 million 个 SKU、业务跨 80 个国家、58
              个仓库；中东扩张故事又叠加了跨境仓储和第三方物流协调。这个足迹支撑采购深度，但也意味着 Moglix 同时暴露在供应商入驻质量、目录准确性、预测质量、仓库纪律、快递交接和 ERP 同步风险下。Cognilix
              越像一层工作流，把供应商入驻、合规检查、库存预测、支付和物流串起来，一个节点的故障就越容易渗到下一个节点，而不是停留在局部服务问题。


              公开投诉界面支持这种谨慎。消费者投诉平台反复出现退货被拒、发错货、货损、退款延迟、跟踪信息混乱等指称。它们不是企业账户流失的干净证据，但仍能指示公司实体和支持流程可能在哪些环节失灵。Moglix 自己的 FAQ
              部分解释了这种摩擦：工业品退货范围较窄，平台费不可退，部分品类把买方引向替换件或品牌服务中心，而不是简单退款。网络安全方面，公开记录没有确认的具名泄露事件，但隐私政策坦承，互联网传输无法保证 100%
              安全，第三方网站也可能遵循不同隐私实践。对于一家协调采购、供应商和支付数据的公司，即便没有披露事故，这个缺口也具实质性。
