      - number: '5.2'
        title: 架构和运营模型以工作流为中心，贴近 ERP，并越来越多由 AI 辅助
        blocks:
          - type: paragraph
            body: >-
              公开材料没有暴露深到代码层面的架构，但确实透露了相当具体的运营设计。Moglix 的企业栈与现有 ERP 系统并行，而不是直接替换它们。SAP 在产品页面和案例研究中被明确点名；在这些材料里，Cogniplan
              把建议注入 PR 流，Cerebra 自动创建 PO 并处理 ERP 确认。Cortex 增加了该架构的供应商边缘，提供基于 OTP 的入驻、合规文件、发票处理、货运追踪和可审计记录。Connexa
              通过拍卖、价格基准、审计轨迹、TLS 加密和云原生托管延伸寻源层；Cognimart 则使用 Moglix 自己的商业和履约基础设施来支持数字销售。

              AI 和数据层也比早期 Moglix 材料更可见。Cogniplan 营销自学习库存逻辑和替代产品推荐；数据治理和支出分析页面显示，主数据标准化和支出智能被当作独立能力。Google Cloud
              的客户案例研究又提供了外部技术证明，说明 Moglix 已经在搜索、目录和寻源工作流中使用 Vertex AI 和 OCR。这一点重要，因为它说明 Cognilix
              不完全是一个从零开始的营销包装；它看起来是在打包 Moglix 已经内建进采购和商业系统的运营经验。限制在于，架构细节仍止步于工作流层。除了与 SAP 连接的例子和营销描述，公开材料没有暴露 API、具名
              Oracle 连接器、参考集成或正式系统图。
