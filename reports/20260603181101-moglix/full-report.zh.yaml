  - id: TV005
    title: 投资逻辑失效与终止触发器表
    columns:
      - 触发器
      - 当前状态
      - 监测信号
      - 行动含义
    rows:
      - - 缺少新的外部价格发现
        - 2022 年 1 月之后的当前资本是母公司内部支持，不是新的领投轮。
        - 任何新的外部融资轮定价低于 2022 年锚点。
        - 把案例推向悲观情景，并坚持重置入场价格。
      - - 盈亏平衡大幅推迟
        - 管理层称可能在六到九个月内实现盈亏平衡。
        - EBITDA 持续为负，或 FY26 亏损趋势明显恶化。
        - 降低乐观和基准情景的信心。
      - - 反向迁册或 IPO 工作延误
        - IPO 仍是 2026-27 年愿景，而不是已递交文件的流程。
        - 迁册里程碑延后，或上市指引推迟。
        - 从估值框架中拿掉 IPO 溢价。
      - - 商品占比偏重的经济性延续
        - 公开证据仍显示收入组合偏分销，业务流层面的利润率披露有限。
        - 没有证据表明软件和金融能显著抬升混合毛利率。
        - 按更接近工业分销或承压私营同行的倍数给 Moglix 估值。
      - - 下一轮外部融资持平或下调
        - 公开记录尚未显示 Series F 之后有新的外部领投定价。
        - 任何外部资本定价等于或低于隐含基准情景。
        - 把 2022 年估值视为完全失效，只按当前基本面重新承销。
    notes: 这些是会移动估值的触发器，不是泛泛风险。
