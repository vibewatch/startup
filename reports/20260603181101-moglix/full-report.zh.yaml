companyProfile:
  summary: >-
    Moglix 是印度领先的 B2B 工业采购平台，Rahul Garg（IIT Kanpur / Google 背景）于 2015 年创立，公司总部位于
    Noida。公司为印度和部分国际市场（Singapore、UK、UAE）的大型企业与 MSME（中小微企业）数字化工厂现场 MRO 和间接采购。核心市场覆盖安全、电气、MRO、包装、IT 硬件等品类，SKU 超过 700,000
    个。Moglix Business 为类似 Fortune 500 的企业提供技术驱动的托管采购，Credlix 则提供供应链金融（发票贴现、动态折扣、经销商融资），并已承诺 $50M 用于美国和墨西哥扩张。2025 年推出的
    Cognilix 是基于 $40B+ 交易数据打造的 AI 驱动 B2B 操作系统，标志着公司开始向软件毛利区间推进。 2022 年 1 月，Moglix 以 $2.6B 估值完成 $250M Series F
    轮融资；此后公司没有按新估值引入外部资本。最近一次融资事件是 2025 年 2 月 Singapore 母公司参与的 $12.3M 内部轮。FY24 收入增长约 5.5%，达到 ₹4,964 Cr，亏损收窄至 ₹189
    Cr，盈亏平衡已近在眼前，但尚未确认。管理层给出的 IPO 评估窗口是 2026-27 年。
