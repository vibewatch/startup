  - id: FI001
    title: 收入模型桥接图
    type: flow
    layout: standard
    summary: 企业采购活动看起来如何转化为 Moglix 收入：以商品为重心，软件和金融层叠加其上。
    data:
      nodes:
        - id: enterprise-demand
          label: 企业采购需求
          detail: 大型制造商和基础设施买方把间接支出、MRO 和供应商工作流集中起来。
        - id: goods-volume
          label: 商品主导的交易量
          detail: FY24 公开披露显示，贸易商品占运营收入 98.98%。
        - id: service-layer
          label: 托管采购 / 支持
          detail: 供应商整合、仪表盘、追踪和工作流服务伴随核心供应交易交付。
        - id: software-layer
          label: Cognilix 软件费
          detail: 白标软件费和部分与交易量挂钩的合同，意在加深非电商收入。
        - id: finance-layer
          label: 保理 / Credlix 金融收入
          detail: 保理和营运资本产品通过金融收入或费用贴在贸易流上。
        - id: recognized-revenue
          label: 确认收入
          detail: 商品收入主导已披露的收入；佣金、IT 服务、保理和配套服务填补剩余收入桶。
        - id: gross-profit
          label: 毛利结果
          detail: 利润率质量取决于软件和金融相对商品采购与交付成本能放大多少。
      edges:
        - from: enterprise-demand
          to: goods-volume
          label: 采购订单
        - from: enterprise-demand
          to: service-layer
          label: 工作流 / 支持范围
        - from: goods-volume
          to: recognized-revenue
          label: 贸易商品销售
        - from: service-layer
          to: recognized-revenue
          label: 支持 / 服务收入
        - from: software-layer
          to: recognized-revenue
          label: 软件费
        - from: finance-layer
          to: recognized-revenue
          label: 保理 / 金融收入
        - from: recognized-revenue
          to: gross-profit
          label: 扣除采购和运营成本
    approximationNotes: 桥接图的形状有来源支撑，但逐收入流的实际拆分没有公开披露。
    claimRefs:
      - CI003
      - CI010
      - CI033
      - CI034
      - CI036
      - CI038
      - CI053
  - id: FI002
    title: 单位经济桥接图
    type: flow
    layout: standard
    summary: 决定 Moglix 能否把规模转成持久盈利能力的公开变量。
    data:
      nodes:
        - id: revenue-scale
          label: 收入规模
          detail: FY24 和 FY25 的公开报道显示，收入体量很大，但仍以商品为重心。
        - id: goods-cost
          label: 采购 / 销售成本
          detail: 采购和销售成本约吃掉已披露成本基数的 84-90%。
        - id: opex
          label: 运营费用
          detail: 员工、运输、IT、法律和其他开销仍然不小，即便广告支出有所收敛。
        - id: working-capital
          label: 营运资本拖累
          detail: 应收账款、库存和银行授信都重要，因为现金转换不像软件业务。
        - id: software-finance-uplift
          label: 软件 / 金融拉升
          detail: Cognilix 和 Credlix 是改善收入质量和利润率结构的主要潜在驱动因素。
        - id: ebitda
          label: EBITDA / 盈亏平衡
          detail: FY24 仍为负；管理层在 2024 年底称，距离盈亏平衡还有 6 到 9 个月。
      edges:
        - from: revenue-scale
          to: goods-cost
          label: 商品主导的收入组合
        - from: revenue-scale
          to: opex
          label: 交付与 SG&A 需求
        - from: goods-cost
          to: ebitda
          label: 商品毛利率偏薄
        - from: opex
          to: ebitda
          label: 经营杠杆考验
        - from: working-capital
          to: ebitda
          label: 现金转换压力
        - from: software-finance-uplift
          to: ebitda
          label: 若规模化，收入组合质量更高
    approximationNotes: 该图为定性分析，因为 Moglix 没有公开披露分收入流毛利、CAC、回本周期或合并口径烧钱速度。
