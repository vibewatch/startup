              规模披露足以支撑一个判断：Moglix 是印度最大的工业商业平台之一。但披露还不够干净，不能把每个公开数字都压成一个“最新”指标。官方 2026 年 AI 产品页面称，交易额超过 $40B，供应商 45,000
