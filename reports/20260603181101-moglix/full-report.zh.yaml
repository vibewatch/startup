  - id: FM003
    title: 买家 / 细分市场地图
    type: matrix
    layout: wide
    summary: |
      Moglix 的买方推进路径跨职能：工业采购、工厂运营和物流负责人都重要，但触发点通常是反复出现的运营痛点，而不是泛泛的 IT 项目。
    data:
      columns:
        - 采矿与金属
        - 石油与天然气
        - 流程制造
        - 基础设施 / EPC
      rows:
        - label: 主要买家
          values:
            - 集团采购 / 材料负责人
            - 工厂采购 + 运营经理
            - 间接采购 / 维护负责人
            - 项目采购 / 商务负责人
        - label: 主要用户
          values:
            - 维护 + 品类经理
            - 各工厂维护团队
