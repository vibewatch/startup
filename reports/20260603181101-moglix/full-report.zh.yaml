      - number: '2.2'
        title: 多个测算视角都显示市场很大，但直接切口更窄
        blocks:
          - type: paragraph
            body: >
              最宽的公开市场视角来自 Bessemer Venture Partners。它认为，到 2030 年，印度在线 B2B 市场机会可能达到约 $200B，但在线部分仍不到整体 B2B 市场的
              5%。这能证明数字化跑道仍长，却远不足以定义 Moglix 的直接 TAM。更近一层的视角来自 6Wresearch，其预测印度 B2B 电商在 2026-2032 年 CAGR 为
              17.6%，并把制造业识别为增长最快的终端用户板块。最接近的支出代理指标则是 IMARC 对印度 MRO 市场的估算：2025 年为 $57.1B，到 2034 年升至 $66.6B。这仍然宽于 Moglix
              的目标账户，但已经更接近 Moglix 实际试图数字化的预算科目。


              因此，正确的承销动作不是把数字相加，而是按视角使用。GeM 推动的公共采购数字化显示，印度大型采购流可以大规模线上化；MSME 和制造业证据则解释了为何供应商和买家密度如此之高。即便如此，Moglix
              也不应把整个 MRO 池都宣称为即时 SAM，因为印度 B2B 的整体数字渗透率仍低。若假设到 2030 年前，只有中个位数比例的印度直接 MRO 和相邻间接采购支出准备流入托管数字采购平台，那么 2026
              年可服务切口保守约为 $3-6B，更站得住脚。这个区间置信度低，但比泛泛的 $200B 标题更能支持决策。
