      - number: '2.3'
        title: 买家分层、预算所有者与采用触发点
        blocks:
          - type: paragraph
            body: >
              Moglix 的公开案例研究指向一个可重复的买家模式：大型、多地点工业运营商，采购在运营上很重要，但组织上很混乱。矿业和有色金属案例强调供应商碎片化、主数据差、库存未优化、价格差异和 GST
              合规。油气案例指出计划外 MRO
              需求、跨工厂价格差异、缺货和采购可见度弱。锌业案例强调手工下单、物流条款不一致和高库存持有成本。这些不是小办公室买家的问题，而是工厂、项目现场和工业网络的问题；采购权分散在工厂经理、维护团队、品类负责人和集团采购负责人之间。


              因此，预算所有权往往是拆分的，而不是单一的。在采矿和金属行业，买方通常是集团采购或物料管理负责人，但使用者是工厂或维护职能。在油气和流程制造中，工厂网络或运营预算的重要性往往不低于采购预算。基础设施和 EPC
              环境又加入了现场工程师和项目商务负责人。采用时点取决于这一点：当初始 ROI 能通过供应商整合、更低间接成本、更干净主数据、更少缺货或更强合同合规显现时，Moglix
              最可能落地。销售很少只关乎价格发现；真正卖的是让混乱的多地点采购可治理。
