      - number: '2.5'
        title: 市场规模不能消除摩擦；全球标杆展示终局
        blocks:
          - type: paragraph
            body: >
              这个市场的主要风险不是采购数字化是否重要，而是转型是否足够快、足够赚钱，让 Moglix 在既有企业、本地分销商或营运资本压力拖慢模型之前拿到大份额。Moglix
              自己的解决方案页面承认，碎片化间接采购有隐性成本——多供应商、行政负担重、数据散落和供应链脆弱；Bessemer 又补上了更具战略性的警告：B2B
              市场通常需要营运资本，且营运资本可能变得足够重，压缩利润率。6Wresearch 则补充了更软但仍实质的摩擦，包括数字基础设施缺口、合规担忧、高运营成本和传统采购习惯。换句话说，TAM 存在，但摩擦是结构性的。


              因此，有用的比较对象不是纯软件品类，而是成熟工业分销模型。Grainger 2025 年 10-K 展示了规模化工业 MRO 分销的样子：4.6M 客户、5,000
              多家供应商、数百万个产品、电子采购连接能力、库存管理服务，以及高接触服务和无限品类两套模型。Würth 2025 年年报也指向同一方向：€20.7B 销售额、80 个国家超过 86,000
              名员工，电子商务超过销售额的 25%。这些标杆说明 Moglix 追求的是一个结构上有效的品类，但也意味着胜出的模型要同时组合目录深度、服务强度、数字工作流控制和供应链执行。这比“商业软件”更难，但如果
              Moglix 能执行，也更耐久。
