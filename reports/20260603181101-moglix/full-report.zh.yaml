    rows:
      - - 大客户集中度
        - 少数重量级工业和项目客户可能贡献过高份额的 GMV，同时吃掉大量实施资源。
        - 细节证据集中在大型 OEM、公用事业、能源、基础设施和规模化数字运营商。
        - 高
        - 提供前 10 大客户的 GMV / 收入占比，以及按细分市场拆分的合同集中度。
      - - 指标定义漂移
        - 如果把工厂、公司、模块用户和企业 logo 视为同一口径，投资人模型会高估增长。
        - 历史指标与 2026 年公开指标采用不同计量单位。
        - 中
        - 对齐活跃买方、活跃企业账户、模块用户和年度交易客户口径。
      - - 留存不透明
        - 没有公开 NPS、GRR、NRR 或续约数据可检验客户质量。
        - 官方页面和发布材料强调结果，却省略留存指标。
        - 高
        - 披露总留存 / 净留存、续约节奏和头部客户流失历史。
      - - MSME 证据缺口
        - 长尾客户逻辑关系到网络效应，但公开证据主要是规模话术，而非行为数据。
        - 历史上披露过 MSME 数量，但已审阅的公开案例研究几乎都聚焦企业客户。
        - 中
        - 披露活跃 MSME 队列、复购率和对 GMV 的贡献。
      - - 市场端服务质量
        - 退货、退款和支持摩擦会损害品牌信任，并外溢到更广的获客成本。
        - 投诉平台和评价网站反复出现售后问题。
        - 中
        - 分拆企业支持 SLA 表现与市场零售服务指标。
      - - 政府采购摩擦
        - 公共部门需求大，但招标周期慢、L1 偏好会拖慢中标并压缩经济性。
        - ETGovernment 和 NIC 均显示数字化在推进，但流程复杂度仍在。
        - 中
