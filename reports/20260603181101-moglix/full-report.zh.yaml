  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
      - 模块 / 资产
      - 主要用户
      - 公开描述
      - 成熟度 / 状态
      - 差异化
      - 收入模式
      - 尽调缺口
    rows:
      - - Moglix Business 托管采购
        - 企业采购团队
        - 为工业买家整合采购、供应商整合、跟踪和品类执行。
        - 公开界面成熟
        - 把工作流控制与实物供应执行绑在一起。
        - 托管采购 / 交易驱动
        - 索取按企业账户划分的模块级毛利率和挂载率。
      - - 市场平台 / 目录层
        - 买家和品类经理
        - 应用商店文案显示，基于目录的工业品采购覆盖大规模 SKU 和 45+ 个品类。
        - 成熟，但不同界面文案不一
        - 受益于供应商和仓储网络，以及移动端订单跟踪。
        - 商品毛利和交易经济性
        - 将旧应用商店规模文案与当前 Cognilix 规模指标对账。
      - - Cerebra
        - 买家 / 审批人
        - 寻源到付款和目录工作流，包含 PR、审批和 PO 处理。
        - 有客户证据的活跃模块
        - 公开资料中 ERP 联动工作流信号最强。
        - 软件费 / 工作流合同
        - 索取具名客户推荐、API 文档和实施原型。
      - - Cortex
        - 供应商和采购运营
        - 供应商入驻、合规、开票、发货跟踪和供应商分析。
        - 有客户证据的活跃模块
        - 面向供应商的工作流，加上可审计记录。
        - 软件费 / 供应商管理合同
        - 索取留存率和从入驻到上线的转化指标。
      - - Cogniplan
        - 库存规划人员和工厂采购
        - AI 库存规划、SAP 联动的 PR 推荐和异常管理。
        - 有奖项和案例研究证据的活跃模块
        - AI 驱动最明确、量化 ROI 最清楚的产品。
        - 软件费 / 库存优化合同
        - 索取模型输入要求、预测准确率和人工覆盖率。
      - - Connexa
        - 寻源团队
        - 拍卖引擎，支持重新拍卖、基准比价、审计轨迹和供应商入驻支持。
        - 公开活跃模块
        - 给采购栈加上寻源智能和治理。
        - 软件费 / 寻源事件定价
        - 索取实际拍卖量、中标率和品类适配度。
      - - Cognimart
