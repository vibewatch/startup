      - number: '4.3'
        title: 成本结构、营运资本与资本需求仍是核心财务问题
        blocks:
          - type: paragraph
            body: >-
              公开来源收敛到一个核心事实：Moglix 的经济性仍由采购和营运资本主导，而不是由高毛利经常性软件主导。据报道，FY23 采购成本约占成本基础的 90%；FY24 仍约占总费用的 84%。公开 FY24
              指标依然疲弱，EBITDA 利润率为负，ROCE 为负，并且据称每赚取 1 卢比运营收入要花 ₹1.11。FY25 表面上更好，因为亏损几乎减半，但销售成本仍主导支出，公开披露仍没有给出真正的现金消耗桥。

              类监管文件来源让资本强度更具体。Tofler 显示，2025 年 3 月借款约 ₹222.2 crore，现金仅约 ₹47 crore，应收账款约 ₹752.5 crore，并可见与 HSBC、Citi、Axis
              和 ICICI 相关的抵押金额。无论这些抵押数字等于当前未偿债务，还是历史授信规模，它们都清楚显示 Moglix
              的资产负债表以有意义的规模接入银行和贸易金融基础设施。因此，资本充足性不只关乎股权融资轮。它还取决于应收周转、贷款人意愿，以及在商品驱动营运资本需求再次扩大之前，软件和金融附加能否足够快地改善利润率——尤其是
              $50M Credlix 投资和 ₹80 crore Khatema 收购进一步提高了运营野心之后。
