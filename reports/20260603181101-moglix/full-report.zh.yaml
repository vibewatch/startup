  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、上市与金融合规，是近期最大的摆动因子
        blocks:
          - type: paragraph
            body: >-
              Moglix 近期最重要的风险，不是单一诉讼或一次性合规事件；而是在推进反向迁册和最终印度 IPO 的同时，公司还要管理一整套宽泛监管栈。

              Moglix 自己的供应商条款明确称，其网站覆盖符合印度 FDI 政策的 B2B 电商和 B2C 市场平台业务。这一点重要，因为公开市场叙事不再只是企业软件或工业分销。外部法律评论继续在允许的 B2B
              电商和库存主导的直面消费者模式之间划出清晰边界，政府围绕仅出口库存 FDI 的咨询也说明，政策边界仍在变化，并非永久落定。在此之上，还叠加 GST 平台运营方义务、DPDP 落地、Credlix
              式融资通道触及受监管放贷机构时的 RBI 数字借贷规则，以及 SEBI 上市义务。核心风险因此变成执行宽度：太多法律工作流必须同时保持干净，IPO 路径才能顺畅。


              反向迁册计划放大了这一风险。Rahul Garg 公开把 2026-27 定为目标上市窗口，公司也新增了一位有明确公开上市和资本市场经验的
              CFO，但公开报道同时称，时点仍取决于迁册等结构性工作。法律评论描述的反向迁册机制，需要法院和监管深度参与，涉及新加坡和印度流程，不是简单的内部文件调整。这不代表计划不可行；多家印度创业公司已经做过类似迁移。但投资者应把监管准备视为带里程碑风险的受监控项目，而不是已经解决的前置条件。
