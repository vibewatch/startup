          modules:
            - Cerebra
            - Cortex
            - Cogniplan
            - Connexa
            - Cognimart
        - label: 数据与智能层
          detail: 支出分析、RFQ 洞察、主数据治理、OCR、搜索和 AI 推荐提升决策质量。
          modules:
            - 支出与 RFQ 分析
