      - number: '1.2'
        title: 创始人中心性、可见高管与治理不透明
        blocks:
          - type: paragraph
            body: >
              Moglix 仍然明显由创始人主导。Rahul Garg 依然是战略、产品愿景和资本市场叙事的公开面孔，机构履历材料也继续把公司与他的 Google、IIT Kanpur 和 ISB
              背景紧密绑定。公开可见的运营负责人并非缺席：Moglix 自己的团队页列出 Sandeep Goel 负责战略和运营，Sanjeev Arora 负责财务，Animesh Srivastava
              负责技术，另有营销、EMEA、人力资本和供应链负责人。


              缺失的信息和可见信息一样值得注意。已审阅的公开页面没有给出当前董事会名单、委员会架构，或逐投资者的持股安排。这不能证明治理薄弱，但确实让外部人在评估一家后期、IPO 前公司时，看不清谁控制董事会决策，也看不清如果
              Rahul Garg 角色变化，继任将如何处理。因此，本章支持一个混合结论：运营班底有一定可信可见度，但治理透明度仍有限，关键人物依赖也很实质。
