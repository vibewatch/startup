  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 投资逻辑
      - 反向逻辑
      - 解决路径
    rows:
      - - Moglix 规模足够重要，运营改善也足以维持 IPO 可选性。
        - 最后一个干净外部价格仍停留在 2022 年 1 月，估值锚已经过时。
        - 承认规模真实存在，但在新的外部验证出现前，把估值标记视为暂定。
      - - FY25 收入和亏损走势显示，公司正向盈亏平衡靠近。
        - 公开数据仍无法证明利润具备持续性，也看不清各业务流的利润质量。
        - 认可改善，但不能据此给出完整的软件式重估。
      - - 如果迁册按计划推进，2026-27 年 IPO 窗口可能带来估值溢价情绪。
        - IPO 时间本身仍取决于反向迁册执行和市场条件。
        - 把 IPO 视为上行情景的可选项，而不是基准情景的确定性。
      - - Moglix 可以凭品类聚焦和采购深度，主张相对承压的私营同行享有溢价。
        - OfBusiness、Zetwerk 和 Udaan 的定价倍数更低或相近，尽管其中一些维度的基准更清晰。
        - 基准情景采用适度溢价，不要把 2022 年估值完整延续。
      - - IndiaMART 证明，印度 B2B 平台可以拿到较高的公开市场倍数。
        - 但 IndiaMART 的资产更轻、盈利能力更强，披露也远比 Moglix 充分。
        - IndiaMART 只适合作为乐观情景的上限参照，不能直接当作基准可比公司。
      - - 如果管理层证明软件和金融挂载能抬升利润率，估值支撑会很快改善。
        - 在审计后的经济数据披露之前，市场可能继续把 Moglix 估成偏分销的平台。
        - 维持观察建议，直到尽调补上经济性缺口。
    notes: 每一行都按投资判断来写，价格、尽调和执行都会改变其权重。
