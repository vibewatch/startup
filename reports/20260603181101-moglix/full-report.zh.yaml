  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 版图：印度直接对手、全球间接对手与软件替代品
        blocks:
          - type: paragraph
            body: >
              Moglix 的竞争场域最好理解为几个相互重叠的类别，而不是单一市场。

              最接近的印度本土重叠者包括 IndiaMART、Udaan、OfBusiness、Zetwerk、Bizongo、Power2SME，以及更宽松意义上的
              ElasticRun。但每家公司攻击的是同一任务的不同部分。IndiaMART 赢在发现和卖家流动性；Udaan 赢在广义 B2B 商业、信贷和品类宽度；OfBusiness
              把原材料采购和营运资本支持混在一起；Zetwerk 强调制造保障和供应商聚合；Bizongo 数字化供应商网络和采购到付款工作流；Power2SME 聚合 SME 采购并配套融资；ElasticRun
              更像履约与分销替代品，而不是工厂现场 MRO 专家。

              真正的替代集合还要更宽。BusinessLine 2025 年报道显示，在日益商品化的 B2B 市场中，Moglix 和 Udaan 都把更快履约视为战略护城河；IndiaMART 2.0 文章则认为，全栈
              B2B 模型反复受物流、营运资本和信用风险约束。因此，现状路径和内部自建同样重要：企业可以继续使用线下分销商、中央采购团队和现有 ERP 流程，也可以加入 SAP 或 Coupa
              的纯软件层，而不把实物供应关系交给托管商业玩家。Amazon Business、Grainger 和 Würth
              代表另一类替代品：标准化长尾支出和库存项目可以交给大型分销商集中管理，而不一定交给印度特定采购平台。
