  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出，以及为何 Moglix 不是普通市场
        blocks:
          - type: paragraph
            body: >
              Moglix 的直接市场应围绕企业间接采购和工业 MRO 来界定，而不是“所有印度电商”，甚至也不是所有 B2B 贸易。公司当前解决方案页面描述的是一个面向工业供应链的单一操作系统，明确覆盖
              MRO、包装、基础设施和数字采购工作流。其电子采购材料清楚说明了待完成任务：为多地点企业数字化请购、审批、供应商发现、下单、支付处理、合同管控和分析。专门的 MRO
              页面进一步收窄问题，把它定义为维修工具、安全设备、备件及相关工厂用品等运营物资的间接采购，并由供应商整合、VMI、ARC 和 ERP 集成支撑。


              这个边界很重要，因为 Moglix 的相邻层确实存在，但重要性并不相同。包装和基础设施产品拓宽了钱包份额，Cognilix 又增加了 AI
              驱动的数据与工作流层；但最干净的市场边界仍是可重复的工业采购场景，在这里，供应商碎片化、价格不一致和数据可见度低会反复制造痛点。因此，排除在外的支出应包括直接原材料采购、普通 B2C
              商业、从未数字化的纯线下分销商关系，以及不附着在采购工作流上的独立借贷。更合适的定位是：Moglix 是一个带有商业和履约深度的软件化工业采购栈，而不是包打天下的 B2B 市场。
