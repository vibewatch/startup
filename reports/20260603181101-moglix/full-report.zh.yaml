  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河维度
      - Moglix 位置
      - 主要威胁
      - 严重性
      - 缓解 / 尽调问题
    rows:
      - - 工业 MRO 专业化
        - 比 IndiaMART 或 Udaan 更聚焦工厂现场和紧急补货
        - 综合市场平台可能把通用长尾支出和重发现需求商品化
        - 高
        - 量化 Moglix GMV 中有多少来自紧急工业品类，多少来自容易替代的支出
      - - 托管式采购服务
        - 当买方要的是执行而不只是软件时，差异化明显
        - SAP、Coupa 和内部采购团队可以吸收工作流和合规层
        - 高
        - 审阅已运行成熟 ERP 或寻源到付款系统买方的赢单 / 输单数据
      - - 速度与履约网络
        - 公开证据显示，Moglix 在工业品类里确有次日履约能力
        - 速度会抬高成本，竞争对手也能复制更快送达承诺
        - 中
        - 不要只看表层服务水平，要按城市、品类和紧急程度验证贡献利润率
      - - 金融邻接业务
        - 有助于提高钱包份额，也能切中营运资本痛点
        - OfBusiness、Udaan、Bizongo、Power2SME 都在主打融资或信用支持
        - 高
        - 衡量挂载率、违约率，以及金融业务带来的是持续留存还是短期转化
      - - 供应商与目录广度
        - 工业品组合覆盖够宽，但市场平台主导地位并不明显
        - IndiaMART 的发现流动性、Amazon 认证供应商和分销商关系，都可能截走标准化需求
        - 高
        - 按主要客户群比较复购占比和首单发现需求
      - - 品类扩张韧性
        - 工作流和履约绑定的工业采购场景最强
        - Zetwerk 掌握制造保障，全球分销商则有成熟 VMI 操作手册
        - 中
        - 要求管理层说明：哪些场景里 Moglix 是主记录系统，哪些只是众多供应商之一
    notes: |
      本清单聚焦护城河耐久性，而非公司质量。几项风险来自 B2B 采购模式本身，尤其是物流成本、营运资本强度，以及买家轻易把工作流软件与实物供应拆开的能力。
