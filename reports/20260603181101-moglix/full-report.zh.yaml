      - 买方
      - 使用者
      - 付款方
      - 工作流场景
      - 预算归属
      - 采用触发因素
    rows:
      - - 多元化采矿及有色金属
        - 集团采购或物料管理负责人
        - 工厂维修团队和品类经理
        - 工厂采购预算，中央监督
        - 供应商分散、数据不达标、价格波动，并且需要满足 GST 合规
        - CPO 或工厂运营负责人
        - 需要统一供应商，并拿到两位数成本节省
      - - 锌及基本金属运营
        - 多地点采购与物流负责人
        - 工厂买方和 PO 后物流团队
        - 中央采购和库存预算
        - 手工下单、INCOTERMS 不一致、货运可见性弱，库存持有成本高
        - 物料管理负责人
        - 需要压缩供应商基数并强化物流控制
      - - 石油天然气及 LPG 钢瓶制造
        - 工厂采购负责人和运营经理
        - 分布在 13 家工厂的维修团队
        - 运营或工厂采购预算
        - 工厂网络内 MRO 需求临时性强、采购可见性有限，并频繁缺货
        - COO 或工厂网络负责人
        - 需要清理主数据，并守住跨工厂价格纪律
      - - 流程制造、化肥和化工
        - 间接采购与维修负责人
        - 维修和库房团队
        - 工厂及共享服务采购预算
        - 长尾支出复杂、目录膨胀、审批繁琐，维修周期里还要顶住服务水平风险
        - 工厂负责人或采购控制人
        - 需要标准化目录、审批和合同合规
      - - 基础设施、EPC 和项目现场
        - 项目采购或商务负责人
        - 现场工程师和项目库房
        - 项目或 EPC 预算
        - 现场采购分散、存在加工制造需求，项目之间还有间接采购
        - 项目总监或商务负责人
        - 需要更快现场履约，并更好整合支出
      - - 企业采购转型
        - CPO 或数字采购项目负责人
        - 采购分析师和工厂请购人
        - 集团采购或 CIO 转型预算
        - 接入 ERP 的寻源、供应商管理和支出分析落地
        - CFO 或 CPO
        - 需要跨地点的可见性、合规和一致采购体验
    notes: |
      Moglix 的买方地图更偏运营，而非纯财务。公司落点在工厂和项目采购规模足以支撑工作流控制、供应商整合，以及跨多地点数据清理的场景。
