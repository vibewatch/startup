            body: |
              最强的市场洞察不是印度 B2B 单纯很大，而是线上渗透率相对总市场仍低。跑道因此真实存在，但这也意味着 Moglix 必须靠解决混乱的运营问题取胜，而不能假设采购量会自己搬到线上。
