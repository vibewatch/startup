  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用客户工作流理解产品栈
        blocks:
          - type: paragraph
            body: >-
              Moglix 当前的产品表面最好理解为一个栈：从托管工业采购出发，再向软件模块、供应商工具和金融展开。较早的 Moglix Business 层仍锚定运营故事：集成采购、供应商整合、电子采购、MRO
              优化，以及在油气等行业的特定执行能力。这一层不只是数字目录。公开页面反复围绕多地点企业的工作流控制、可见度、成本效率、合规和物流执行来描述产品。

              在这个运营基础之上，Cognilix 现在把软件层打包成具名模块。Cerebra 覆盖从寻源到付款和基于目录的采购，Cortex 处理供应商入驻与协作，Cogniplan 聚焦库存规划，Connexa
              处理拍卖，Cognimart 则把栈延伸到 B2B 数字销售。Credlix 再加入发票贴现、提前付款、供应商金融和渠道金融等营运资本流。实际产品技术含义是，Moglix
              的护城河主张不再只是品类丰富或市场流动性，而是把企业请购、供应商工作流、仓库和融资连接成一张运营织物的能力。买家和供应商移动应用强化了这一判断，因为它显示 Moglix
              已经构建了专门面向角色的工作流界面，而不是只依赖桌面目录。
