evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: TO002 leadership and founder table coverage
    missingEvidence: Current board roster, committee memberships, succession plan, and management authority matrix.
    whyItMatters: >-
      Moglix has a visible public executive bench, but board-level governance quality cannot be assessed from public
      materials alone.
    diligencePath: >-
      Request the latest board deck, board and committee roster, succession planning materials, and an updated executive
      org chart.
    relatedQuestionRefs:
      - QO006
      - QO026
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: TO003 stakeholder or investor map coverage
    missingEvidence: >-
      Full current cap table, shareholder rights schedule, and transaction documents for the February 2025 parent-led
      infusion.
    whyItMatters: >-
      Open sources identify visible investors, but not current ownership percentages, preferences, or whether the
      internal funding altered economics materially.
    diligencePath: >-
      Request the latest cap table, investor rights summary, intercompany funding documents, and any fair-value or
      secondary-pricing memos.
    relatedQuestionRefs:
      - QO009
      - QO024
      - QO025
      - QO026
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: Exact current group headcount by function, geography, and contractor mix.
    whyItMatters: >-
      Public sources cluster around roughly 1.3k employees, but the range is still profile-derived rather than
      company-verified, and materially higher market narratives remain unresolved.
    diligencePath: >-
      Request a current HR headcount bridge covering employees, contractors, geography, and leadership span of control
      as of the run date.
    relatedQuestionRefs:
      - QO014
  - type: missing-source
    severity: minor
    topic: geography and customer roster completeness
    missingEvidence: A management-verified list of current countries, large customers, and revenue concentration by market.
    whyItMatters: >-
      Public sources show both historical UK/UAE footprints and newer US/Mexico/Middle East emphasis, while official
      case studies anonymize many customers.
    diligencePath: >-
      Request a current country-by-country revenue and customer map, plus an enterprise logo sheet or customer
      concentration schedule.
    relatedQuestionRefs:
      - QO015
      - QO016
  - type: missing-source
    severity: minor
    topic: regulatory and litigation record beyond layoffs
    missingEvidence: >-
      A consolidated list of current or historical regulatory actions, material litigation, and unresolved compliance
      matters.
    whyItMatters: >-
      Public open-source review surfaced layoffs but not a clear regulator or court record; absence of easily accessible
      evidence is not the same as absence of risk.
    diligencePath: >-
      Request a legal proceedings schedule, compliance register, and external counsel summary of pending or threatened
      actions.
    relatedQuestionRefs:
      - QO022
  - type: enumeration-incomplete
    severity: material
    topic: TO004 milestone chronology
    missingEvidence: >-
      A management-verified chronology of launches, acquisitions, financing closes, market entries, exits, and
      governance changes since 2015.
    whyItMatters: >-
      The public milestone record is directionally strong but incomplete, especially for exact product-launch dates,
      international rollout timing, and board-level milestones.
    diligencePath: >-
