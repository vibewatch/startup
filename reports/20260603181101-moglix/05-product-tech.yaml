  evidenceGaps:
  - type: missing-source
    severity: material
    topic: formal-security-posture
    missingEvidence: Public security whitepaper, SOC 2 or ISO 27001 security certification page, public status page, and quantified uptime / DR metrics for Cognilix or the Moglix procurement stack.
    whyItMatters: Enterprise procurement tools touch approvals, supplier master data, invoices, and ERP-adjacent workflows; process-compliance messaging is not a substitute for security and reliability evidence.
    diligencePath: Request the security architecture pack, latest certifications, penetration-test summary, incident-response and business-continuity playbooks, and historical uptime by module.
    relatedQuestionRefs:
    - QE019
    - QE024
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: integration-documentation
    missingEvidence: Named connector matrix, API or webhook documentation, and implementation references covering Oracle and non-SAP ERPs in addition to the SAP-linked examples now visible publicly.
    whyItMatters: ERP adjacency is central to Moglix’s deployment thesis, but customers cannot underwrite implementation speed from generic integration claims alone.
    diligencePath: Request supported ERP list, connector architecture, sample API docs, reference implementation plans, and module-by-module implementation timelines.
    relatedQuestionRefs:
    - QE009
    - QE024
    relatedTableRefs:
    - TE003
    - TE004
  - type: private-evidence-only
    severity: material
    topic: module-adoption-quality
    missingEvidence: Module-wise customer counts, active usage, renewal, expansion, ARR, and implementation duration by product line.
    whyItMatters: The software layer is credible, but public adoption proof remains selective and does not yet show how sticky or scalable each module is.
    diligencePath: Request module-level pipeline, deployed accounts, usage metrics, renewals, expansion cohorts, and the split between software-only and commerce-linked contracts.
    relatedQuestionRefs:
    - QE016
    - QE017
    - QE025
    relatedTableRefs:
    - TE001
    - TE005
  - type: missing-source
    severity: material
    topic: reliability-and-service-levels
    missingEvidence: Public SLA, warehouse-service metrics, incident-rate data, auction success rates, and inventory-model accuracy benchmarks.
    whyItMatters: Moglix’s promise depends on real-time workflows, physical execution, and AI recommendations; without service-level evidence, operational quality is hard to underwrite.
    diligencePath: Request customer SLAs, warehouse OTIF history, incident logs, auction performance metrics, and forecast-accuracy scorecards by module.
    relatedQuestionRefs:
    - QE011
    - QE012
    - QE019
    - QE024
    relatedTableRefs:
    - TE002
    - TE004
  - type: private-evidence-only
    severity: material
    topic: roadmap-sequencing
    missingEvidence: A dated multi-quarter roadmap showing which modules are GA, in rollout, or experimental and how the software layer will be prioritized relative to warehouses, finance, and category expansion.
    whyItMatters: The January 2026 launch makes the software thesis investable, but not yet precise enough to judge sequencing or capital allocation across modules.
    diligencePath: Request the internal roadmap, product review cadence, release notes, ownership map, and module-level investment budget for the next 12-24 months.
    relatedQuestionRefs:
    - QE021
    - QE025
    relatedTableRefs:
    - TE005
