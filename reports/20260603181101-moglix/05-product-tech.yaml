- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current pain point
  - Product module
  - Workflow steps
  - Measured outcome
  - Limitation
  rows:
  - - Catalog buying and source-to-pay
    - Manual PR creation, quote chasing, fragmented catalogs
    - Cerebra + Moglix Business
    - Request raised → catalog selection → approval → PO → ERP acknowledgement
    - Up to 85% lower PR creation time; 5-10x faster demand-to-PO cycle
    - Public proof is strongest on SAP-linked examples, not a broad connector matrix.
  - - Supplier onboarding and collaboration
    - Fragmented supplier communication and document gaps
    - Cortex
    - OTP onboarding → profile completion → compliance docs → order/invoice tracking → payment visibility
    - 70% faster onboarding; 90% compliance-document completeness
    - No public detail on fraud scoring, KYC workflow depth, or integration APIs.
  - - Inventory planning and replenishment
    - High inventory days, excess stock, weak forecasting
    - Cogniplan
    - ERP PR raised → AI recommendation → user override / justification → approval → monitoring
    - 20% inventory-days reduction target; 6.25% optimization in four months in one case
    - Model assumptions, forecast accuracy, and failure modes are not public.
  - - Competitive sourcing and auctions
    - Slow RFQ cycles and weak price discovery
    - Connexa
    - Supplier shortlist → auction event → bids / re-auction → award → audit trail
    - 40% sourcing-cost reduction and 30% faster cycles claimed
    - No public category-by-category auction volume disclosure.
  - - Digital selling and customer order visibility
    - Manual enquiries, pricing calls, weak transparency
    - Cognimart
    - Catalog / price publishing → order capture → SAP / CRM sync → dispatch visibility → dashboards
    - 60% less manual effort and up to 80% faster turnaround in one case
    - Public evidence is selective and heavy-industry skewed.
  - - Buyer mobile control tower
    - Need delivery visibility away from desktop systems
    - Buyer mobile app
    - View deliveries → track orders → see procure-to-pay data → raise query
    - Role-specific mobile continuation of enterprise workflow
    - App copy appears older than newest Cognilix scale disclosures.
  - - Supplier and channel working capital
    - Receivables pressure across suppliers and distributors
    - Credlix
    - Invoice / PI upload → finance request → lender disbursal → reconciliation
    - Up to 90-95% invoice-value unlock; enterprise and distributor programs
    - No public credit-loss, pricing, or lender-concentration metrics.
  notes: This table maps buyer, supplier, and finance jobs to the corresponding Moglix surface and the best publicly visible workflow evidence. Outcomes are company-claimed or case-study-based unless otherwise noted.
  enumerationScope:
    coverage: partial
    basis: Focused on the main repeatable enterprise and supplier workflows visible in current public materials, not every industry-specific customization or category workflow.
