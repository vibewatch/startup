  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Public description
  - Maturity / status
  - Differentiation
  - Revenue model
  - Diligence gap
  rows:
  - - Moglix Business managed procurement
    - Enterprise procurement teams
    - Integrated procurement, vendor consolidation, tracking, and category execution for industrial buyers.
    - Mature public surface
    - Combines workflow control with physical supply execution.
    - Managed procurement / commerce-led
    - Request module-level gross margin and attach rate by enterprise account.
  - - Marketplace / catalog layer
    - Buyers and category managers
    - Catalog-based industrial buying across large SKU sets and 45+ categories in app-store copy.
    - Mature but copy varies by surface
    - Benefits from supplier and warehouse network plus mobile order tracking.
    - Goods margin and transaction economics
    - Reconcile old app-store scale copy with current Cognilix scale metrics.
  - - Cerebra
    - Buyers / approvers
    - Source-to-pay and catalog workflow with PR, approvals, and PO processing.
    - Active module with customer proof
    - Strongest public ERP-linked workflow signal.
    - Software fee / workflow contract
    - Request named customer references, API docs, and implementation archetypes.
  - - Cortex
    - Suppliers and procurement ops
    - Vendor onboarding, compliance, invoicing, shipment tracking, and supplier analytics.
    - Active module with customer proof
    - Supplier-facing workflow plus audit-ready records.
    - Software fee / supplier-management contract
    - Request retention and onboarding-to-live conversion metrics.
  - - Cogniplan
    - Inventory planners and plant buyers
    - AI inventory planning, SAP-linked PR recommendations, and exception management.
    - Active module with award and case-study proof
    - Most explicit AI-led product and clearest quantified ROI.
    - Software fee / inventory optimization contract
    - Request model-input requirements, forecast accuracy, and override rates.
  - - Connexa
    - Sourcing teams
    - Auction engine with re-auctions, benchmarking, audit trail, and supplier onboarding support.
    - Active public module
    - Adds sourcing intelligence and governance to procurement stack.
    - Software fee / sourcing event pricing
    - Request actual auction volumes, win rates, and category fit.
  - - Cognimart
    - Commercial and channel teams
    - Digital storefront and B2B marketplace layer with fulfilment and analytics.
    - Active module with case-study proof
    - Lets Moglix reuse commerce and fulfilment infrastructure for customer-owned selling.
    - Software fee / commerce-volume linked pricing
    - Request GMV, active storefront count, and renewal data.
  - - Credlix
    - Suppliers, anchors, distributors, exporters
    - Invoice discounting, early payment, vendor finance, and channel finance.
    - Operating finance rail
    - Adds working-capital products tightly linked to procurement flow.
    - Finance fee / spread / program economics
    - Request lender mix, loss rates, and attach rate to procurement customers.
  notes: The matrix covers the main publicly visible modules and rails, not every category page or internal tool. Maturity is based on current public surfaces, case studies, and app listings rather than private deployment logs.
