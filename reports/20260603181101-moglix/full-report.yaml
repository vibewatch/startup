  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk dimension
      - Early warning signal
      - Kill criterion
      - Action implication
    rows:
      - - Regulatory / listing
        - Reverse-flip milestones slip; new unresolved regulator or court issue emerges.
        - IPO-readiness timetable moves materially beyond 2027 without compensating profitability proof.
        - Re-rate the listing thesis and underwrite the business as a private, slower-maturing asset.
      - - Finance / Credlix
        - Lender-partner disclosure stays opaque or digital-lending controls look thin.
        - Inability to show clean lender-of-record structure, compliance controls, and default performance.
        - Treat finance attachment as a risk amplifier instead of a moat.
      - - Service quality
        - Complaint volume, refund friction, or enterprise implementation delays increase.
        - Persistent support or fulfilment issues begin showing up in reference calls or repeat-order weakness.
        - Cut confidence in software and managed-procurement durability.
      - - Competition / substitution
        - Standardized spend shifts to Amazon Business or internal procurement tools.
        - Moglix cannot show differentiated win rates, retention, or workflow depth in target verticals.
        - Re-rate margin upside and exit multiple assumptions.
      - - Leadership / governance
        - Key new executives churn, or decision-making remains visibly founder-concentrated.
        - CFO / CTO / MD-CBO layer fails to institutionalize reporting, controls, or operating ownership.
        - Treat the company as still founder-dependent and apply higher execution discount.
      - - Expansion / integration
        - MEA rollout or acquisition integration absorbs cash and management attention faster than expected.
        - International and M&A programs weaken core India service levels or delay profitability conversion.
        - Narrow the growth story back to the core India business until proof improves.
    notes: >-
      Kill criteria are investment-oriented triggers, not forecasts; each is framed as something management can either
