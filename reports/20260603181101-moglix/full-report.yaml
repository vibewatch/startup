      - number: '8.4'
        title: Final diligence asks and investment view
        blocks:
          - type: paragraph
            body: >-
              What would move the recommendation is not more narrative about category size, AI, or procurement
              digitization. Investors need a consolidated FY25-FY26 revenue bridge, audited gross margin by goods,
              software, and finance streams, a working-capital and debt schedule, and direct visibility into the cap
              table and preference stack. Those files determine whether Moglix deserves a distributor-like multiple, a
              modest premium to private B2B peers, or an eventual IndiaMART-style re-rating. Without them, the debate
              stays anchored to stale round prices and selective tracker snapshots rather than to current underwriteable
              economics.


              The thesis would weaken quickly if break-even slips materially beyond management's public timeline, if
              reverse-flip work drags and the IPO window moves out, or if the next external financing is priced below
              the 2022 anchor. The thesis would strengthen if Moglix proves that FY25 margin improvement is durable,
              shows that software and finance attachments lift blended economics, and produces current external
              validation rather than only internal support. Until then, the right investment posture is to monitor
              execution and hold price discipline. Moglix is not an avoid; it is a company whose public upside remains
              real but whose current valuation support remains incomplete.
            claimRefs:
              - CV006
