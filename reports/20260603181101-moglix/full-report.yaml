  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer mix is broad, but public proof skews toward heavyweight enterprise accounts
        blocks:
          - type: paragraph
            body: >-
              Moglix's public customer mix looks much more enterprise-heavy than consumer-like. The company's own
              business surfaces still frame the offer around enterprise procurement and vendor collaboration, while
              older public profiles describe Moglix as serving thousands of manufacturing companies or plants alongside
              a very large SME base. The 2026 Cognilix launch material shifts the discussion again: instead of headline
              logo count, it emphasizes depth of adoption, with more than 1,000 customers reportedly using one or more
              underlying modules and more than 10 large enterprises on standalone Cognilix deployments. That split
              matters because it suggests the company has built a wide commercial ecosystem, but its deepest and
              stickiest relationships are likely concentrated in larger managed accounts rather than the anonymous long
              tail.


              The proof surface also reflects that reality. Most quantified public case studies sit in automotive,
              metals and mining, oil and gas, utilities, infrastructure, logistics, and scaled digital operations. That
              is good evidence of serious B2B relevance, but it is not the same thing as clean disclosure of active
              customer count or concentration. Named customers do exist in older independent coverage, yet the current
              public roster is still much thinner than the scale claims would imply. The right read is that Moglix has
              real multi-segment reach, but investors should treat the enterprise layer as the core customer engine and
              the MSME layer as directionally large but under-disclosed.
