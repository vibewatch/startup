      - number: '3.3'
        title: Capability, pricing posture, and distribution comparison
        blocks:
          - type: paragraph
            body: >
              Capability comparison is where Moglix's differentiation becomes clearer. The reviewed comparison sources

              consistently position Moglix as more industrial and execution-heavy than IndiaMART or Udaan.
              BusinessLine's

              2025 snapshot is especially useful because it shows Moglix compressing delivery from 96 hours to next-day

              across 21 cities in PPE, MRO, and electrical consumables, using 1 lakh-plus stocked SKUs and 45-plus

              fulfilment centres. That looks very different from IndiaMART's marketplace-liquidity model or Udaan's
              broad

              retail-trade assortment. OfBusiness overlaps more on procurement plus finance than on general discovery,

              while Zetwerk is closer to manufacturing assurance than to recurring MRO replenishment.


              Public pricing evidence, however, is much thinner than public product evidence. Most enterprise contracts

              appear negotiated rather than list priced. IndiaMART publicly discloses marketplace scale and earnings,
              but

              not a like-for-like managed procurement fee schedule. Udaan and OfBusiness disclose category focus and

              financing, but not clean enterprise take rates. Amazon Business is the clearest tail-spend substitute with

              RFQ, guided buying, vending, verified suppliers, and 300-plus e-procurement integrations. Grainger and
              Würth

              show what mature managed inventory and MRO distribution can look like at global scale. SAP and Coupa
              matter

              for a different reason: they allow large buyers to keep approvals, contracts, supplier management, and
              spend

              visibility in-house. Moglix therefore wins best when the customer wants physical execution and managed

              industrial replenishment, not just workflow software.
