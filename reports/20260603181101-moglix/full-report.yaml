  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Competitor set
      - Public pricing / contract posture
      - What appears included
      - What remains opaque
      - Implication for Moglix
    rows:
      - - Moglix
        - Mostly negotiated enterprise contracts rather than clean public list pricing
        - Industrial supply, managed procurement, faster fulfilment, finance adjacency
        - Service fees, software pricing, and realized category margins
        - Best positioned when the buyer values execution and consolidation over lowest visible unit price
      - - IndiaMART
        - >-
          Marketplace monetization plus SaaS and credit adjacencies; current package detail not visible in reviewed
          sources
        - Discovery, lead flow, supplier storefronts, SaaS expansion
        - Current subscription schedule, managed-service pricing, and realized take rates
        - Powerful discovery competitor, but not a clean like-for-like managed procurement contract
      - - Udaan
        - Wholesale product economics, credit, and logistics economics rather than published enterprise contract menus
        - Broad assortment, private labels, credit, fast delivery
        - Category-level margins, take rates, and enterprise procurement fees
        - Price pressure is strongest in commoditized categories rather than specialized MRO workflows
      - - OfBusiness
        - Quote-led raw-material pricing with credit attachment rather than transparent list pricing
        - Input sourcing, working capital, manufacturing and trade adjacencies
        - Financing spread, service charges, and exact category economics
        - Most serious overlap where steel, chemicals, or contractor inputs dominate the buying motion
      - - Amazon Business / global distributors
        - Mix of visible SKU prices, RFQs, VMI programs, and negotiated account terms
        - Verified suppliers, tail-spend control, vending, inventory programs, procurement integrations
        - Enterprise rebates, local service economics, and India-specific discount structures
        - Strong substitute for standardized indirect spend and mature procurement teams
      - - SAP / Coupa
        - Software subscription and source-to-pay licensing, not product-margin pricing
        - Approvals, supplier management, contracts, spend analytics, compliance
        - License economics and total deployment cost in reviewed sources
        - Can displace Moglix's workflow layer when buyers keep distributors and physical inventory separate
    notes: >
      Public pricing transparency is low across most competitors reviewed here. The table therefore compares pricing
      posture and packaging logic rather than pretending there is a clean, published fee schedule for negotiated
      enterprise procurement contracts.
