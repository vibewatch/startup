      - number: '2.5'
        title: Market Size Does Not Remove the Frictions; Global Benchmarks Show the End State
        blocks:
          - type: paragraph
            body: |
              The main risk in this market is not whether procurement digitization matters; it is whether the
              transition happens fast enough and profitably enough for Moglix to capture a large share before
              incumbents, local distributors, or working-capital burdens slow the model. Moglix’s own solution
              pages admit the hidden costs of fragmented indirect procurement—multiple vendors, administrative
              overload, scattered data, and supply-chain vulnerability—but Bessemer adds the more strategic
              warning: working capital is often necessary in B2B marketplaces and can become capital-intensive
              enough to compress margins. 6Wresearch adds softer but still material frictions, including digital
              infrastructure gaps, compliance concerns, high operating costs, and traditional procurement habits.
              In other words, TAM exists, but friction is structural.

              The useful comparison is therefore with mature industrial distribution models rather than with pure
              software categories. Grainger’s 2025 10-K shows what scaled industrial MRO distribution looks like:
              4.6 million customers, over 5,000 suppliers, millions of products, eProcurement connectivity,
              inventory-management services, and separate high-touch versus endless-assortment models.
              Würth’s 2025 annual report points in the same direction, with €20.7 billion in sales, more than
              86,000 employees across 80 countries, and e-business surpassing 25% of sales. Those benchmarks
              suggest Moglix is pursuing a structurally valid category, but they also imply that the winning model
              combines catalog depth, service intensity, digital workflow control, and supply-chain execution. That
              is a harder market than “commerce software,” but also a more durable one if Moglix can execute.
            claimRefs:
              - CM023
              - CM024
              - CM028
              - CM041
              - CM042
