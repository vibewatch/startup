      - number: '4.3'
        title: Cost structure, working capital, and capital needs remain the core financial question
        blocks:
          - type: paragraph
            body: >-
              Public sources converge on one central fact: Moglix’s economics are still dominated by procurement and
              working capital, not by high-margin recurring software. In FY23 procurement costs reportedly represented
              about 90% of the cost base; in FY24 they were still about 84% of total expenses. Public FY24 metrics
              remained weak, with negative EBITDA margin, negative ROCE, and a reported ₹1.11 spent to earn each rupee
              of operating revenue. FY25 looks better on the surface because losses nearly halved, but cost of sales
              still dominated expenditure and public disclosures still do not provide a true cash-burn bridge.


              The filing-style sources make the capital-intensity point more concrete. Tofler shows March 2025
              borrowings of about ₹222.2 crore, cash of only about ₹47 crore, receivables of roughly ₹752.5 crore, and
              visible charge amounts with HSBC, Citi, Axis, and ICICI. Whether those charge figures equal current
              outstanding debt or historical facility sizes, they clearly show that Moglix’s balance sheet interacts
              with banks and trade-finance infrastructure at meaningful scale. Capital adequacy therefore is not just
              about equity rounds. It also depends on receivable turns, lender appetite, and whether software and
              finance attach can improve margin fast enough before goods-led working-capital needs expand
              again—especially after the $50 million Credlix investment and the ₹80 crore Khatema acquisition added
              further operating ambition.
