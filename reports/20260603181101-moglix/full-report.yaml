  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, listing, and finance-compliance risk is the highest near-term swing factor
        blocks:
          - type: paragraph
            body: >-
              Moglix's most important near-term risk is not a single lawsuit or one-off compliance event; it is the
              breadth of the

              regulatory stack the company is trying to manage while also preparing for a reverse flip and eventual
              India IPO.

              Moglix's own supplier terms explicitly say its website covers both B2B e-commerce and B2C marketplace
              businesses in

              line with India's FDI policy, which matters because the public-market story is no longer just about
              enterprise

              software or industrial distribution. External legal commentary continues to draw a bright line between
              permitted B2B

              commerce and inventory-led direct-to-consumer models, and government consultation on export-only inventory
              FDI shows

              that the policy perimeter is still live rather than permanently settled. Layer onto that GST operator
              duties, DPDP

              implementation, RBI digital-lending rules where Credlix-style financing rails touch regulated lenders, and
              SEBI

              listing obligations, and the core risk becomes execution breadth: too many legal workstreams have to stay
              clean at

              once for the IPO path to remain smooth.


              The reverse-flip program sharpens that risk. Rahul Garg has publicly framed 2026-27 as the target listing
              window and

              the company has added a CFO with explicit public-listing and capital-markets experience, but public
              reporting also

              says timing remains contingent on structural work such as redomiciliation. The reverse-flip mechanics
              described in

              legal commentary are court- and regulator-intensive, involving Singapore and Indian processes rather than
              a simple

              internal paperwork change. That does not make the plan impossible; several Indian startups have done
              similar moves.

              It does mean investors should treat regulatory readiness as a monitored program with milestone risk, not
              as a solved

              prerequisite.
