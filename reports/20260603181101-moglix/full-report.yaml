      - number: '3.4'
        title: Switching costs, moat durability, and the main competitive risks
        blocks:
          - type: paragraph
            body: >
              Moglix's moat is neither trivial nor permanent. The most durable parts of the position are category focus,

              managed procurement services, and operational readiness in urgent industrial categories. Public comparison

              sources repeatedly place Moglix closer to industrial MRO and enterprise supply-chain execution than
              IndiaMART

              or Udaan, while Rahul Garg's quoted view that full-stack B2B models create synergies across sales,

              distribution, working capital, and fulfilment explains why a managed model can be sticky once embedded
              into

              plant operations.


              Still, several risks are real. Faster fulfilment increases cost and can be copied. Finance is no longer a

              unique differentiator when OfBusiness, Udaan, Bizongo, and Power2SME all attach some form of credit or

              financing support. IndiaMART has listed-company disclosure, cash, and liquidity advantages that make it
              hard

              to dismiss. Amazon Business, Grainger, and Würth can win standardized indirect spend or
              inventory-management

              programs without replicating Moglix's exact local service model. SAP and Coupa can also compress Moglix's

              workflow layer when a buyer already has strong internal procurement teams and distributor relationships.
              The

              safest underwriting conclusion is therefore moderate moat durability: Moglix has a defensible wedge in

              managed industrial procurement, but generic tail spend, supplier discovery, and finance-enabled
              raw-material

              flows remain contestable.
