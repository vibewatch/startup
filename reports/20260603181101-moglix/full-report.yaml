      - number: '6.3'
        title: Scale signals are real, but the public metric history is not apples-to-apples
        blocks:
          - type: paragraph
            body: >-
              Moglix's scale disclosures clearly point upward, but they do not form a clean cohort history. Older public
              sources describe the business as serving 3,000+ manufacturing companies or plants and 500,000+ SMEs,
              supported by roughly 10,000-16,000 suppliers, 25-35+ warehouses, and 450,000-500,000+ SKUs. By 2026, the
              Cognilix launch reframes the company around ecosystem scale and software depth: 45,000 suppliers, 1.2
              million SKUs, 58 warehouses, 80 countries, 1,000+ customers using underlying modules, and 10+ large
              enterprises using standalone Cognilix. Directionally, that is encouraging. It suggests Moglix has expanded
              supplier breadth and physical infrastructure while turning some procurement relationships into
              higher-value software engagements.


              The caveat is definitional drift. Manufacturing companies, manufacturing plants, business clients,
              enterprise customers, module customers, and standalone Cognilix enterprises are different units, and the
              public record rarely reconciles them. So the data supports a strong conclusion about ecosystem breadth,
              but not a precise conclusion about active-customer growth, attach rates, or net retention. Investors
              should read the current disclosures as evidence of meaningful installed-base monetization potential rather
              than as a fully comparable time series.
