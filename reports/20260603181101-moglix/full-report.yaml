      - - Break-even guidance
        - CNBC TV18 interview with Rahul Garg
        - Management said break-even should happen within six to nine months from Sep 2024
        - Improvement narrative is plausible, but still needs current proof
        - Request monthly EBITDA, cash burn, and covenant headroom through FY26
      - - Visible borrowing / bank facilities
        - Tofler charges and borrowings view
