      - number: '8.2'
        title: Last-round anchor versus the comparable set
        blocks:
          - type: paragraph
            body: >-
              Comparable evidence makes the valuation tension much clearer than the company headline alone. OfBusiness,
              which is profitable and much larger by revenue, was reported at around a $5 billion last-round valuation
              on about $2.3 billion of FY24 revenue, or roughly 2.2x sales. Zetwerk's latest public read-through is
              around $3 billion on FY25 gross revenue of ₹12,798 crore, or about 2.0x sales. Udaan's unchanged $1.8
              billion valuation on roughly ₹5,700 crore of FY24 revenue works out to roughly 2.7x sales and still comes
              with an explicit profitability and restructuring story. Those are the closest late-stage Indian
              private-market read-throughs, and all sit below Moglix's last-round implied multiple.


              The premium-side comparison is IndiaMART, not another private B2B commerce unicorn. IndiaMART's June 2026
              market cap of about $1.24 billion against annualized Q1 FY26 revenue implies roughly 7x sales, which is
              materially richer than the private B2B band. But IndiaMART is public, profitable, asset-light, and
              disclosure-rich in a way Moglix is not. Grainger's public multiple of roughly 3.4x sales and Würth's €20.7
              billion revenue base further show that industrial-distribution scale alone does not automatically deserve
              a venture premium. The implication is straightforward: Moglix can justify a premium to stressed private
              peers if profitability conversion lands, but today's public evidence does not support paying a premium
              equal to or above the 2022 anchor with confidence.
