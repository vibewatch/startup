      - number: '4.2'
        title: Monetization stack and the best public proxies for sales efficiency
        blocks:
          - type: paragraph
            body: >-
              The best public evidence says Moglix monetizes through at least five layers: sale of industrial goods,
              commissions on online sales, managed procurement and support services, software fees from Cognilix, and
              finance income or fees via factoring and supply-chain finance. The issue is not whether these layers
              exist; multiple sources name them. The issue is that realized pricing and revenue mix remain undisclosed.
              Moneycontrol’s January 2026 Cognilix report is valuable because it explicitly says Moglix plans to
              monetize the product primarily through software fees, with some contracts linked to commerce volumes. That
              matters because it shows Moglix is trying to create a higher-quality software revenue stream on top of a
              very thin goods-led base.


              Public GTM and sales-efficiency proxies are strongest in customer outcome case studies rather than in
              explicit CAC or payback disclosure. Official case studies claim 10-15% cost savings in mining, 30%
              supplier-base reduction in zinc, and clean master-data creation in oil and gas. Moneycontrol adds that
              more than 10 enterprises already use Cognilix standalone and that some have seen inventory reductions of
              up to 30%. Those are useful expansion and ROI signals, but they still do not disclose realized software
              pricing, contract duration, renewal rates, sales-cycle length, or contribution margin by stream. In
              practice, that means the public story supports customer willingness to pay, but not yet clean
              sales-efficiency underwriting.
