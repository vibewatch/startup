  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Current status
      - Monitoring signal
      - Action implication
    rows:
      - - No fresh external price discovery
        - Current capital after Jan 2022 is internal-parent support, not a new lead round.
        - Any new external round priced below the 2022 anchor.
        - Move the case toward bear and insist on a reset entry price.
      - - Break-even slips materially
        - Management said break-even could happen within six to nine months.
        - Continued negative EBITDA or materially worse FY26 loss trend.
        - Reduce confidence in bull and base cases.
      - - Reverse-flip or IPO work delays
        - IPO remains a 2026-27 aspiration rather than a filed process.
        - Domicile shift milestones slip or listing guidance moves out.
        - Remove IPO premium from the valuation framework.
      - - Goods-heavy economics persist
        - Public evidence still shows a distribution-heavy revenue mix and limited stream-level margin disclosure.
        - No evidence that software and finance materially lift blended gross margin.
        - Value Moglix closer to industrial-distribution or stressed private-peer multiples.
      - - Next external raise is flat or down
        - The public record has not yet shown a new outside-led price since Series F.
        - Any external capital priced at or below implied base case.
        - Treat the 2022 mark as fully broken and re-underwrite from current fundamentals only.
    notes: These are valuation-moving triggers, not generic risks.
    claimRefs:
      - CV006
      - CV007
      - CV036
      - CV045
      - CV046
      - CV049
      - CV052
