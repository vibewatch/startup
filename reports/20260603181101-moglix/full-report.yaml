  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct Indian rivals, global indirects, and software substitutes'
        blocks:
          - type: paragraph
            body: >
              Moglix's competitive field is best understood as several overlapping classes rather than a single market.

              The closest India-native overlaps are IndiaMART, Udaan, OfBusiness, Zetwerk, Bizongo, Power2SME, and in a

              looser sense ElasticRun. But each attacks a different part of the job. IndiaMART wins on discovery and

              seller liquidity; Udaan wins on broad B2B commerce, credit, and category breadth; OfBusiness blends raw-

              material procurement with working-capital support; Zetwerk emphasizes manufacturing assurance and supplier

              aggregation; Bizongo digitizes vendor networks and procure-to-pay workflows; Power2SME aggregates SME

              procurement with financing; ElasticRun is closer to a fulfilment and distribution substitute than a plant-

              floor MRO specialist.


              The real substitute set is wider still. BusinessLine's 2025 coverage shows Moglix and Udaan both treating

              faster fulfilment as a strategic moat in an increasingly commoditized B2B market, while the IndiaMART 2.0

              article argues that full-stack B2B models are repeatedly constrained by logistics, working capital, and

              credit risk. That is why status-quo and internal-build options matter: an enterprise can keep using
              offline

              distributors, central procurement teams, and existing ERP processes, or it can add software-only layers
              from

              SAP or Coupa without handing the physical supply relationship to a managed commerce player. Amazon
              Business,

