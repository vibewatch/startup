  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Thesis
      - Anti-thesis
      - Resolution
    rows:
      - - Moglix has enough scale to matter and enough operating improvement to keep IPO optionality alive.
        - The last clean external price is still from January 2022, so the valuation anchor is stale.
        - Treat scale as real but the mark as provisional until new external validation appears.
      - - FY25 revenue and loss trends suggest the company is moving toward break-even.
        - Public data still does not prove durable profitability or stream-level margin quality.
        - Give credit for improvement, not for a full software-like re-rating.
      - - A 2026-27 IPO window could create premium sentiment if redomiciliation stays on schedule.
        - IPO timing itself is contingent on reverse-flip execution and market conditions.
        - Model IPO as upside optionality, not as a base-case certainty.
      - - Moglix can argue for a premium to stressed private peers because of category focus and procurement depth.
        - >-
          OfBusiness, Zetwerk, and Udaan all price at lower or similar multiples despite clearer benchmarks in some
          dimensions.
        - Use a moderate premium in base case, not a full carry-forward of the 2022 mark.
      - - IndiaMART shows that Indian B2B platforms can earn premium public multiples.
        - IndiaMART is far more asset-light, profitable, and disclosure-rich than Moglix.
        - Use IndiaMART only as a bull-case ceiling reference, not a direct base-case comp.
      - - If management proves margin lift from software and finance attachments, valuation support can improve quickly.
        - Until audited economics are opened, the market may continue to value Moglix as a distribution-heavy platform.
        - Keep the recommendation at track until diligence closes the economics gap.
    notes: Each row is framed as an investment claim that can move with price, diligence, and execution.
