  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - Moat dimension
      - Moglix position
      - Key threat
      - Severity
      - Mitigation / diligence ask
    rows:
      - - Industrial MRO specialization
        - Clearer plant-floor and urgent-replenishment focus than IndiaMART or Udaan
        - Broad marketplaces can commoditize generic tail spend and discovery-heavy demand
        - High
        - Quantify what share of Moglix GMV comes from urgent industrial categories versus easily substitutable spend
      - - Managed procurement services
        - Meaningful differentiation when buyers want execution not just software
        - SAP, Coupa, and internal procurement teams can absorb workflow and compliance layers
        - High
        - Review win/loss data where buyers already run mature ERP or source-to-pay systems
      - - Speed and fulfilment network
        - Public evidence suggests real next-day execution capability in industrial categories
        - Speed raises cost and competitors can replicate faster delivery promises
        - Medium
        - Validate contribution margins by city, category, and urgency band rather than headline service levels
      - - Finance adjacency
        - Helpful for wallet share and working-capital pain points
        - OfBusiness, Udaan, Bizongo, and Power2SME all market financing or credit support
        - High
        - Measure attach rates, defaults, and whether finance drives durable retention or just short-term conversion
      - - Supplier and catalog breadth
        - Good breadth in industrial assortments, but not obvious marketplace dominance
        - >-
          IndiaMART discovery liquidity, Amazon verified suppliers, and distributor relationships can capture
          standardized demand
        - High
        - Compare repeat-order mix versus first-order discovery needs across major customer cohorts
      - - Category expansion durability
        - Strongest in industrial procurement where workflow and fulfilment are linked
        - Zetwerk owns manufacturing assurance, while global distributors own mature VMI playbooks
        - Medium
        - Ask management to show where Moglix is the system of record versus just one supplier among many
    notes: >
      The register focuses on moat durability rather than company quality. Several risks are structural to the B2B
      procurement model itself, especially logistics cost, working-capital intensity, and the ease with which buyers can
      split workflow software from physical supply.
