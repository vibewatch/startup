      - number: '6.2'
        title: Deployment evidence spans auto, energy, public-sector, and digital-native buyers
        blocks:
          - type: paragraph
            body: >-
              The strongest part of Moglix's customer chapter is the density of deployment evidence. Public case studies
              span an EPC contractor on an Indian Railways locomotive project, a private-sector crude-oil producer,
              large two-wheeler and tractor manufacturers, state utilities, Unilever, Urban Company, Air India, a
              food-delivery platform serving 30,000 restaurants, Xpressbees, a large e-pharmacy retailer, a major
              automotive-lighting manufacturer, and a zinc-oriented metals company. These references vary in quality:
              some are fully named, some are strongly identifiable from business descriptors, and some stay anonymized.
              But taken together they show that Moglix is operating inside real procurement workflows rather than merely
              advertising a broad catalog.


              The workflow pattern is equally important. Moglix is usually described as running buyer portals, contract
              automation, vendor consolidation, ERP-adjacent procurement, synchronized sourcing, packaging programs, or
              project execution support. Quantified outcomes are abundant: 60% PR-to-PO improvement in oil and gas, 85%
              order-cycle reduction at the two-wheeler OEM, 85% staff-hour savings at the tractor manufacturer, 12%
              savings at a transmission utility, 30% savings at the food-delivery account, 100% order-fulfilment
              accuracy in the e-commerce packaging program, 2-6% savings in several automotive and metals cases, and
              large-volume operational support for Urban Company, Xpressbees, and Air India. That breadth is the
              clearest evidence that Moglix's customer value is tied to workflow and fulfilment depth, not just online
              assortment.
