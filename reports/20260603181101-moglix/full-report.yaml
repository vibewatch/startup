      - number: '4.4'
        title: Financial verdict and the diligence blockers that still matter
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a mixed but not bearish financial verdict. Moglix has enough scale to matter, enough
              public improvement in FY25 to keep a profitability thesis alive, and enough monetization
              adjacencies—software, managed procurement, and finance—to argue that gross-profit quality could improve
              over time. Official funding history is also not the immediate issue; the company clearly raised large
              growth rounds in 2021 and 2022 and then received a smaller 2025 parent infusion. The harder question is
              whether those capital inputs are now converting into a durable, lower-burn operating model.


              That remains unresolved in public data. The best adverse evidence is not fraud or regulatory distress; it
              is operational strain. Moglix’s growth decelerated sharply in FY24, margins remained negative, layoffs
              appeared during the 2023 funding winter, and public sources still do not show consolidated cash, runway,
              customer concentration, realized take rate, or a true stream-by-stream gross-margin waterfall. The chapter
              therefore lands on a disciplined conclusion: Moglix looks financeable and plausibly near break-even, but
              the underwriting case still depends on management proving that software and finance attachments can lift
              margin faster than goods-heavy working capital and manufacturing expansion consume capital. Until that
              evidence is provided, the path to durable profitability should be treated as promising but unproven.
