      - number: '8.3'
        title: Bull, base, and bear range with downside triggers
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis is more honest than false precision here because the core gap is not arithmetic; it is
              validation. The bear case assumes that late-stage Indian private-market discipline stays tight, that the
              February 2025 internal round is read as support rather than validation, and that Moglix's goods-heavy
              model is valued closer to OfBusiness, Zetwerk, or Udaan-type private bands. On that reading, a range of
              roughly $1.0-$1.5 billion is plausible. It does not require a collapse in the business; it only requires
              investors to pay distribution-like or reset-multiple prices for a company whose last external mark is now
              several years old.


              The base case gives Moglix credit for real scale, narrowing losses, and a plausible path to break-even,
              while still discounting the absence of a fresh outside round, full stream-level margin disclosure, and
              complete reverse-flip execution. That supports roughly $1.8-$2.2 billion. The bull case needs several
              things to happen together: FY25-style growth has to continue, the six-to-nine-month break-even target has
              to prove real, redomiciliation and IPO readiness have to stay on track, and public-market sentiment has to
              reward the company with a premium closer to profitable or listed benchmarks. Under that path, $2.5-$3.0
              billion becomes defendable. Today, however, the base case is the only one fully supported by public
              evidence.
