      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Treat the 2022 valuation as an anchor, not an answer
            body: >-
              The Series F mark is still useful because it proves Moglix once cleared a premium late-stage round. It is
              not enough to prove fair value in 2026 because the company has not yet shown fresh outside price discovery
              at or above that level.
