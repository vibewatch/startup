        title: Architecture and operating model are workflow-centric, ERP-adjacent, and increasingly AI-assisted
        blocks:
          - type: paragraph
            body: >-
              Public materials do not expose a deep code-level architecture, but they do reveal a fairly specific
              operating design. Moglix’s enterprise stack sits alongside existing ERP systems rather than replacing them
              outright. SAP is named explicitly on product pages and case studies, where Cogniplan injects
              recommendations into PR flows and Cerebra automates PO creation and ERP acknowledgements. Cortex adds the
              supplier edge of that architecture with OTP-based onboarding, compliance documents, invoice handling,
              shipment tracking, and audit-ready records. Connexa extends the sourcing layer with auctions, price
              benchmarking, audit trails, TLS encryption, and cloud-native hosting, while Cognimart uses Moglix’s own
              commerce and fulfilment infrastructure to support digital selling.


              The AI and data layer is also more visible than in earlier Moglix materials. Cogniplan markets
              self-learning inventory logic and alternative-product recommendations; the data-governance and
              spend-analytics pages show that master-data standardization and spend intelligence are treated as
              standalone capabilities. Google Cloud’s customer case study adds an external technical proof point that
              Moglix is already using Vertex AI and OCR inside search, catalog, and sourcing workflows. That matters
              because it suggests Cognilix is not purely a greenfield marketing wrapper; it appears to package operating
              learnings Moglix already built into its internal procurement and commerce systems. The caveat is that
              architecture specificity still stops at the workflow layer. Public materials do not expose APIs, named
              Oracle connectors, reference integrations, or a formal systems diagram beyond SAP-linked examples and
              marketing descriptions.
