      - number: '3.2'
        title: Direct rival profiles and where each one attacks Moglix
        blocks:
          - type: paragraph
            body: >
              The most important Indian competitors split into three clusters. First are the broad platforms. IndiaMART

              remains the scale incumbent in online B2B discovery, with 29 million unique enquiries, 8.4 million
              supplier

              storefronts, and 2.18 lakh paying suppliers disclosed for Q1 FY26. Udaan is less industrially specific
              than

              Moglix, but its public platform still combines credit, logistics, and wide retail-oriented assortment
              across

              FMCG, staples, pharma, and fresh produce. Those two platforms matter most when the buyer values breadth,

              network liquidity, and price discovery more than plant-floor execution.


              Second are industrial and raw-material specialists. OfBusiness is the clearest overlap on procurement plus

              finance, especially where steel, polymers, agriculture inputs, or contractor working capital dominate the

              buying motion. Zetwerk is adjacent rather than identical: it is strongest when the buyer wants
              manufacturing

              capacity, supplier coordination, and supply assurance, not just a recurring MRO catalog. Third are
              narrower

              specialists. Bizongo digitizes enterprise vendor ecosystems with embedded finance. Power2SME is a
              long-lived

              SME procurement aggregator, but the latest CARE rating shows stretched liquidity and a leveraged balance

              sheet. ElasticRun is mainly a fulfilment and distribution alternative, not a direct MRO workflow owner.
              This

              fragmentation matters because Moglix rarely wins or loses to one rival; it is usually defending against a

              different competitor in each category, urgency band, and customer segment.
