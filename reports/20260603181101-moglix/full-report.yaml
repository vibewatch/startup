      - number: '6.4'
        title: Retention and concentration are the weakest parts of the public customer record
        blocks:
          - type: paragraph
            body: >-
              Retention visibility is limited. Moglix does publish curated positive testimonials, including comments
              about successful replacements, refunds, rapid response, and intent to buy again, so there is at least some
              public evidence of happy customers. But none of the official pages, launch stories, or case studies
              reviewed here disclose NPS, CSAT, GRR, NRR, renewal cohorts, or account-level churn. On the adverse side,
              public complaint boards and review platforms show recurring marketplace-side issues around rejected
              returns, delayed refunds, wrong or damaged items, and confusing support responses. Those signals should
              not be treated as direct evidence that large enterprise accounts are churning, because the enterprise
              programs highlighted in Moglix Business case studies are structurally different from retail-style
              marketplace orders. They do, however, flag a service-quality tail risk.


              The bigger analytical issue is concentration. Moglix's best public proof sits in large industrial buyers,
              utilities, project-led EPC accounts, and scaled digital operators. That likely means a meaningful share of
              GMV and implementation effort is tied to a relatively small set of heavyweight accounts, while public MSME
              proof remains much thinner than the top-line scale claims suggest. Government and PSU demand clearly
              expands the addressable segment, but public-procurement digitization still sits alongside long tender
              cycles, L1 bias, and execution friction. The chapter verdict is therefore constructive on customer
              quality, but cautious on transparency and concentration.
