  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Moglix is large enough and strategically relevant enough to stay on an investor watchlist, but the public
              record does not justify paying the January 2022 mark as if it were current fair value. The company did
              raise $250 million at a $2.6 billion valuation in Series F, and multiple databases still carry that
              anchor. The problem is that it is now a legacy mark. There has been no later third-party financing round
              that clearly re-underwrote the company at or above that price, and the February 2025 infusion came from
              the Singapore parent rather than from a new outside lead investor. That makes the 2025 capital event more
              useful as a liquidity and IPO-prep signal than as fresh market validation.


              The operating picture is good enough to keep upside alive, but not good enough to erase that valuation
              gap. FY24 public revenue was about ₹4,964 crore and FY25 reporting later pointed to about $681.5 million
              of operating revenue with losses nearly halving. Management also said break-even could come within six to
              nine months. Those are real positives. Even so, the stale $2.6 billion mark still implies roughly 4.4x
              FY24 revenue and about 3.8x FY25 revenue, which looks demanding for a business that remains goods-heavy,
              still-financing-dependent, and not yet publicly proven as durably profitable. The disciplined
              public-source call is therefore track rather than buy.
