        - 'Jan 2022: $250 million at $2.6 billion valuation'
        - Last clean external price-setting round in public evidence
        - Confirm current cap table and whether any terms still govern next financing or IPO
      - - Parent infusion
        - Inc42 report citing RoC filings
        - 'Dec 2024-Feb 2025: INR 107.58 crore (~$12.3 million) via CCCPS from Singapore parent'
        - Supports the balance sheet but does not create a fresh external valuation mark
        - Request board minutes, rights terms, and use-of-funds bridge
