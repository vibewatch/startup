  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product stack in customer-workflow terms
        blocks:
          - type: paragraph
            body: >-
              Moglix’s current product surface is best understood as a stack that starts with managed industrial
              procurement and then fans out into software modules, supplier tools, and finance. The older Moglix
              Business layer still anchors the operational story: integrated procurement, vendor consolidation,
              e-procurement, MRO optimization, and industry-specific execution in sectors such as oil and gas. That
              layer is not just a digital catalog. Public pages repeatedly frame the product around workflow control,
              visibility, cost efficiency, compliance, and logistics execution across multi-site enterprises.


              On top of that operating base, Cognilix now packages the software layer into named modules. Cerebra covers
              source-to-pay and catalog-based buying, Cortex handles supplier onboarding and collaboration, Cogniplan
              focuses on inventory planning, Connexa handles auctions, and Cognimart extends the stack into B2B digital
              selling. Credlix then adds working-capital flows such as invoice discounting, early payment, vendor
              finance, and channel finance. The practical product-tech implication is that Moglix’s moat claim is no
              longer only assortment or marketplace liquidity. It is the ability to connect enterprise requisitions,
              supplier workflows, warehouses, and financing into one operating fabric. The mobile buyer and supplier
              apps strengthen that reading by showing that Moglix has built dedicated role-based workflow surfaces
              rather than relying only on a desktop catalog.
