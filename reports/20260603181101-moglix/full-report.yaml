        - >-
          Plant procurement head, maintenance leader, and supply-chain owner; paid from plant or group procurement
          budget
        - Core Moglix wedge via MRO catalogs, vendor consolidation, and contract buying
      - - Procurement workflow and e-procurement software
        - Source-to-pay workflows, vendor management, catalog control, analytics, contract and order management
        - Standalone ERP cores without procurement workflow; generic office productivity tools
        - Group procurement, shared services, or procurement-transformation budget
        - Core digital-control layer that makes supply consolidation sticky
      - - Inventory, VMI, and replenishment services
        - Vendor-managed inventory, ARC-based replenishment, on-site stores, and real-time order tracking
        - Pure third-party logistics without procurement workflow or catalog control
        - Plant operations or supply-chain budget
        - Important operational differentiator for multi-site enterprises
      - - Packaging, fabrication, and infrastructure adjacencies
        - >-
          Customized packaging, indirect EPC or infrastructure buying, and fabricated products tied to enterprise
          procurement
        - >-
          Consumer packaging, generic retail e-commerce, and direct capex construction contracts outside managed
          procurement
        - Procurement plus business-unit budget owner
        - Adjacent expansion layer, but not the cleanest direct SAM lens
      - - Embedded finance and working-capital support
        - Invoice discounting, PO finance, and credit-led transaction enablement linked to procurement flows
        - Standalone lending disconnected from supplier or procurement workflows
        - Treasury, finance, or supplier-relationship owner
        - Strategic flywheel and monetization enhancer rather than the cleanest market boundary
      - - Excluded status quo and substitutes
        - N/A
        - Local offline distributors, direct OEM reps, internal ERP-only buying, and manual plant procurement
        - Existing plant procurement teams
        - These are incumbent ways buyers solve the job and define switching friction rather than counted SAM
    notes: >
      The boundary is intentionally narrower than “all Indian B2B e-commerce.” Moglix’s direct market is recurring
