companyProfile:
  summary: >-
    Moglix is India's leading B2B industrial procurement platform, founded in 2015 by Rahul Garg (IIT Kanpur / Google
    alumni) and headquartered in Noida. The company digitises factory-floor MRO and indirect procurement for large
    enterprises and MSMEs across India and select international markets (Singapore, UK, UAE). Its core marketplace
    carries 700,000+ SKUs across safety, electrical, MRO, packaging, and IT hardware categories. Moglix Business
    provides tech-enabled managed procurement for Fortune 500-style enterprises, while Credlix offers supply-chain
    financing (invoice discounting, dynamic discounting, dealer financing) with $50M committed for US and Mexico
    expansion. The 2025 launch of Cognilix, an AI-powered B2B operating system built on $40B+ in transaction data, marks
    the company's push into software margin territory. After a $250M Series F at a $2.6B valuation in January 2022,
    Moglix has not taken external capital at a new mark; a $12.3M internal round in February 2025 from its Singapore
    parent is the latest funding event. FY24 revenue grew ~5.5% to ₹4,964 Cr with losses narrowing to ₹189 Cr, putting
    break-even within sight but not yet confirmed. Management has guided for a 2026-27 IPO evaluation window.
