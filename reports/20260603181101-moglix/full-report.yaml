    columns:
      - Ask
      - Priority
      - What it would change
      - Owner / path
    rows:
      - - Audited FY25-FY26 revenue bridge
        - High
        - Shows whether public revenue figures line up across Singapore, India, and stream-level views.
        - CFO pack plus auditor materials.
      - - Gross margin by goods, software, and finance stream
        - High
        - Determines whether Moglix deserves a distribution multiple or a premium software/fintech blend.
        - Finance team and board materials.
      - - Working-capital, debt, and facility schedule
        - High
        - Clarifies liquidity risk, lender dependence, and equity value leakage.
        - Treasury schedule and lender term sheets.
      - - Cap table and preference stack
        - High
        - Changes true downside protection and common-equity outcomes even if headline valuation holds.
        - Legal counsel, cap-table software export, and financing docs.
      - - Reverse-flip and IPO milestone plan
        - Medium
        - Determines whether bull-case IPO optionality is real or merely aspirational.
        - General counsel, tax advisors, and board calendar.
      - - Proof of durable break-even
        - High
        - Moves the recommendation faster than any market narrative because it changes the multiple investors can pay.
        - Monthly management accounts and FY26 board updates.
    notes: These are the minimum files needed to move from watchlist interest to an underwriteable price.
