      - number: '5.4'
        title: Roadmap, differentiation, and the main product-tech risks
        blocks:
          - type: paragraph
            body: >-
              The clearest 2026 roadmap signal is the formal launch of Cognilix. That event reframes Moglix from a
              procurement operator with software support into a company trying to sell a white-label procurement and
              commerce operating system with software-fee monetization. Public evidence suggests that the modules were
              not invented overnight: customer case studies, app surfaces, and Google Cloud’s AI case study all imply
              that pieces of the stack already existed in production form before the January 2026 branding push. That
              gives the roadmap some credibility. Moglix is not launching software in the abstract; it is productizing
              workflows already exercised across its supplier, buyer, warehouse, and finance network.


              Differentiation nonetheless depends on several hard-to-copy but also hard-to-disentangle assets. Moglix
              can plausibly learn from procurement volumes, supplier behavior, warehouse operations, and financing
              touchpoints in ways that pure software vendors cannot. At the same time, those same advantages create
              dependencies: ERP implementation quality, supplier onboarding, warehouse execution, lender participation
              through Credlix, and continuous data cleanup all affect product value. Public rollout proof is still
              selective, and disclosure consistency is imperfect — for example, app-store copy still references a
              19-warehouse network while newer Cognilix pages market 58+ warehouses. The resulting verdict is
              constructive but not complacent. Moglix has a credible full-stack procurement product story and a
              meaningful software wedge, but investors should still ask for harder proof on module adoption quality,
              formal security controls, integration depth, and roadmap sequencing before underwriting the software layer
              as a durable margin driver.
            claimRefs:
              - CE008
              - CE012
