        title: Milestones, expansion vectors, and the main open-source risk signals
        blocks:
          - type: paragraph
            body: >
              Recent milestones show Moglix widening both its product surface and its industrial asset base. The 2024

              decision to commit $50 million to Credlix pushed the platform further into embedded working-capital and

              cross-border finance, especially for the US and Mexico. The Khatema Fibres acquisition then added a more

              tangible manufacturing and packaging capability, with management explicitly linking it to next-day
              delivery

              expansion and entry into additional categories. Current 2026 Cognilix messaging reinforces that software,

              workflow automation, and AI are now central to the group narrative.


              The most clearly documented adverse signal in open sources is people-related rather than regulatory:

              Moglix laid off 2-3% of staff in early 2023 while still hiring elsewhere. Combined with continuing public

              discussions around losses, a potential redomicile ahead of IPO, and still-thin board disclosure, the

              company overview supports a balanced view. Moglix has meaningful scale, strategic ambition, and a broader

              moat than a pure marketplace, but it still needs to substantiate profitability durability, exact current

              operating metrics, and governance maturity before public-market readiness can be assumed.
