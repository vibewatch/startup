  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor
      - Category
      - Scale / funding / stage
      - Target segment
      - Core strength
      - Main limitation versus Moglix
    rows:
      - - IndiaMART
        - Listed B2B marketplace incumbent
        - 'Q1 FY26: 29M enquiries, 8.4M storefronts, 2.18 lakh paying suppliers; ~$1.24B market cap'
        - MSMEs, large enterprises, broad cross-category buyers
        - Highest public marketplace liquidity and listed-company disclosure
        - Weaker public signal on managed plant-floor procurement and urgent MRO execution
      - - Udaan
        - Broad B2B commerce platform
        - $114M 2025 round at ~$1.8B; >$1.95B raised; FY24 revenue ₹5,700 crore
        - Small retailers, HoReCa, FMCG and staple buyers, category-led trade accounts
        - Credit, logistics, and broad assortment across retail-oriented categories
        - Less specialized in industrial MRO and enterprise managed procurement
      - - OfBusiness
        - Raw-material procurement plus financing platform
        - '>$800M raised; FY24 revenue $2.3B; FY24 PAT $72.6M; IPO target $6B-$9B'
        - Manufacturers, contractors, and SMEs buying inputs and working capital
        - Deep raw-material sourcing plus finance attachment
        - Closer to raw materials than to recurring plant-floor tail-spend workflows
      - - Zetwerk
        - Manufacturing-led adjacent competitor
        - $877.62M+ funding; ~$3B pre-IPO valuation; FY25 gross revenue ₹12,798 crore
        - OEMs and enterprises needing custom manufacturing or supply assurance
        - Manufacturing OS, owned and partner plants, 1,800+ customers, 20+ countries
        - Not centered on recurring MRO catalog breadth or managed tail-spend procurement
      - - Bizongo
        - Vendor digitization and packaging/procurement specialist
        - $319.81M+ funding; FY23 revenue ₹184.4 crore
        - Enterprises digitizing vendor networks, packaging, and supply-chain workflows
        - Procure-to-pay digitization with embedded vendor finance
        - Narrower category scope and smaller public scale than Moglix
      - - Power2SME
        - SME procurement aggregator
        - $85.38M+ funding; FY24 revenue ₹638.7 crore; FY25 revenue ₹1,009.57 crore
        - SMEs buying metals, polymers, yarn, and chemicals
        - Aggregated procurement plus financing for smaller businesses
        - Weak financial profile, stretched liquidity, and lower visible enterprise depth
      - - ElasticRun
        - Fulfilment and distribution substitute
        - $800M marked-down valuation; 2.5M+ sq. ft.; 600+ cities/towns
        - Brands needing multi-speed fulfilment across B2B, e-commerce, and quick commerce
        - Large warehousing and logistics footprint with SaaS layer
        - Not a focused industrial procurement or MRO control platform
      - - Amazon Business / Grainger / Würth
        - Global indirect and MRO substitute set
        - 'Amazon: 300+ integrations; Grainger: ~$60.97B market cap and $17.94B TTM revenue; Würth: VMI savings metrics'
        - Enterprises centralizing indirect spend and inventory programs
