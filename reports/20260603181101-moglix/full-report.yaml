      - number: '1.2'
        title: Founder centrality, visible executives, and governance opacity
        blocks:
          - type: paragraph
            body: |
              Moglix remains plainly founder-led. Rahul Garg is still the public face of strategy, product vision,
              and capital markets messaging, and institutional biography material continues to tie the company closely
              to his Google, IIT Kanpur, and ISB background. Publicly visible operating leaders are not absent:
              Moglix’s own team page names Sandeep Goel in strategy and operations, Sanjeev Arora in finance,
              Animesh Srivastava in technology, and leaders for marketing, EMEA, human capital, and supply chain.

              What is missing is as notable as what is visible. The reviewed public surfaces do not provide a current
              board roster, committee structure, or an investor-by-investor ownership schedule. That does not prove
              weak governance, but it does leave outsiders underwriting a late-stage, pre-IPO story with incomplete
              public visibility into who controls board decisions and how succession would be handled if Rahul Garg’s
              role changed. The chapter therefore supports a mixed conclusion: credible operating bench visibility,
              but still limited governance transparency and material key-person dependence.
