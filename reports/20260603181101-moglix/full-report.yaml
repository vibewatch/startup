  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Why Moglix Is Not Just a Generic Marketplace
        blocks:
          - type: paragraph
            body: |
              Moglix’s direct market should be defined around enterprise indirect procurement and industrial
              MRO rather than around “all Indian e-commerce” or even all B2B trade. The company’s current
              solution pages describe a single operating system for industrial supply chains with specific
              coverage across MRO, packaging, infrastructure, and digital procurement workflows. Its
              e-procurement materials are explicit about the job-to-be-done: digitizing requisitions,
              approvals, supplier discovery, order placement, payment processing, contract control, and
              analytics for multi-site enterprises. The dedicated MRO page narrows this further by framing the
              problem as indirect procurement for operational goods such as repair tools, safety equipment,
              spares, and related plant supplies, supported by vendor consolidation, VMI, ARCs, and ERP
              integration.

              That boundary matters because Moglix’s adjacent layers are real but not equally central. Its
              packaging and infrastructure offerings broaden wallet share, and Cognilix adds an AI-led data and
              workflow layer, but the cleanest market boundary remains recurring industrial procurement where
              fragmented vendors, inconsistent pricing, and low data visibility create recurring pain. Excluded
              spend should therefore include direct raw-material purchasing, generic B2C commerce, purely
              offline distributor relationships that never digitize, and standalone lending not attached to the
              procurement workflow. Moglix is best framed as a software-enabled industrial procurement stack
              with commerce and fulfillment depth, not as a catch-all B2B marketplace.
            claimRefs:
              - CM001
              - CM002
              - CM003
