slug: moglix
runDate: '2026-06-03'
company:
  name: Moglix
chapter:
  number: 1
  title: Company Overview
  summary: >
    Moglix is best understood today as a founder-led industrial commerce platform with a layered
    product stack: marketplace supply, enterprise procurement workflows, procurement SaaS, packaging
    and manufacturing adjacencies, and supply-chain finance via Credlix. The cleanest public capital
    anchors remain the May 2021 unicorn round and the January 2022 Series F at roughly a $2.6
    billion valuation; the February 2025 capital event appears to have been internal parent funding
    rather than a fresh external price-setting round. Current official product surfaces point to much
    larger operating scale than older marketplace profiles, but public headcount, governance detail,
    and the exact current cap table remain only partially transparent.
sections:
  - id: identity-platform-and-domicile
    title: Identity, platform scope, and corporate footprint
    body: |
      Moglix now looks materially broader than a simple online catalog for industrial supplies. Official
      company surfaces describe a B2B procurement and supply-chain platform serving manufacturing and
      infrastructure buyers, with marketplace supply, integrated procurement workflows, procurement SaaS,
      and embedded finance through Credlix. The category mix is wide: official about materials still anchor
      the story in MRO, safety, electricals, lighting, office supplies, power tools, and packaging, while
      more recent product pages frame Cognilix as an AI-led operating system for procurement and B2B selling.

      The domicile picture is equally important. Moglix’s official contact page lists Singapore as the
      headquarters address, while India operations are run from Noida in Delhi NCR. Current product pages
      show active operating presence across India, the USA, UAE, Singapore, and Mexico, while older external
      reporting also placed the company in the UK. The underwriting implication is that Moglix should be
      treated as a cross-border industrial commerce and software platform with an India operating center,
      not just as a domestic MRO marketplace.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO008, CO038, CO040]
    figureRefs: [FO002]
  - id: leadership-and-governance
    title: Founder centrality, visible executives, and governance opacity
    body: |
      Moglix remains plainly founder-led. Rahul Garg is still the public face of strategy, product vision,
      and capital markets messaging, and institutional biography material continues to tie the company closely
      to his Google, IIT Kanpur, and ISB background. Publicly visible operating leaders are not absent:
      Moglix’s own team page names Sandeep Goel in strategy and operations, Sanjeev Arora in finance,
      Animesh Srivastava in technology, and leaders for marketing, EMEA, human capital, and supply chain.

      What is missing is as notable as what is visible. The reviewed public surfaces do not provide a current
      board roster, committee structure, or an investor-by-investor ownership schedule. That does not prove
      weak governance, but it does leave outsiders underwriting a late-stage, pre-IPO story with incomplete
      public visibility into who controls board decisions and how succession would be handled if Rahul Garg’s
      role changed. The chapter therefore supports a mixed conclusion: credible operating bench visibility,
      but still limited governance transparency and material key-person dependence.
    claimRefs: [CO009, CO010, CO011, CO039]
    tableRefs: [TO002]
  - id: capital-history-and-stakeholders
    title: Funding history, valuation anchors, and stakeholder structure
    body: |
      Moglix’s public capital history is clear through early 2022 and much less clean afterward. Official
      and independent reporting clearly document the May 2021 Series E at a $1 billion valuation and the
      January 2022 Series F at roughly a $2.6 billion valuation. Those remain the last widely corroborated
      external price-setting events in open sources. After that, tracker numbers diverge modestly: Tracxn
      places total funding around $471 million, Inc42 around $481.5 million, and Owler around $483.2 million.
      The February 2025 event was described as internal parent funding into the Indian arm rather than a fresh
      outside-led round.

      The practical diligence implication is that Moglix is still a late-stage unicorn, but not one with a
      newly refreshed public valuation benchmark. Investors visible in open sources include Tiger Global,
      Alpha Wave/Falcon Edge, Harvard Management, Sequoia/Peak XV, Accel, IFC, WFM Asia, Ward Ferry,
      Venture Highway, and Jungle Ventures. However, public sources still do not reveal the current cap table,
      governance rights, or whether the 2025 infusion changed ownership economics in a material way.
    claimRefs: [CO012, CO013, CO014, CO015, CO016, CO017, CO018, CO019]
    tableRefs: [TO003]
  - id: scale-customers-and-metrics
    title: Scale, customer proof, and headline KPI reliability
    body: |
      Scale disclosure is strong enough to support the thesis that Moglix is one of India’s largest industrial
      commerce platforms, but not clean enough to collapse every public number into a single “latest” metric.
      Official 2026 AI-product surfaces cite more than $40 billion in transactions, 45,000 suppliers,
      1.2-1.3 million SKUs, 58 warehouses, and operations across 80 countries. Recent coverage around Credlix
      expansion also points to more than 1,000 large manufacturers and 3,000 factories. By contrast, older
      TechCrunch reporting described a materially smaller snapshot with 16,000 suppliers, 40 warehouses, and
      700,000-plus SKUs.

      Customer proof exists, but it is selective. Historical reporting consistently names Hero MotoCorp,
      Vedanta, Tata Steel, Unilever, Air India, and NTPC, while official case studies now tend to anonymize
      customers by industry rather than publish a comprehensive roster. Headcount is the weakest headline KPI:
      public profiles cluster around roughly 1,268 to 1,350 employees, so any materially higher figure should
      be treated as unverified until management provides a current organization chart and country-by-country
      employee split.
    claimRefs: [CO020, CO021, CO022, CO023, CO024, CO025, CO026, CO036, CO037]
    tableRefs: [TO001]
    figureRefs: [FO003]
  - id: milestones-expansion-and-adverse-signals
    title: Milestones, expansion vectors, and the main open-source risk signals
    body: |
      Recent milestones show Moglix widening both its product surface and its industrial asset base. The 2024
      decision to commit $50 million to Credlix pushed the platform further into embedded working-capital and
      cross-border finance, especially for the US and Mexico. The Khatema Fibres acquisition then added a more
      tangible manufacturing and packaging capability, with management explicitly linking it to next-day delivery
      expansion and entry into additional categories. Current 2026 Cognilix messaging reinforces that software,
      workflow automation, and AI are now central to the group narrative.

      The most clearly documented adverse signal in open sources is people-related rather than regulatory:
      Moglix laid off 2-3% of staff in early 2023 while still hiring elsewhere. Combined with continuing public
      discussions around losses, a potential redomicile ahead of IPO, and still-thin board disclosure, the
      company overview supports a balanced view. Moglix has meaningful scale, strategic ambition, and a broader
      moat than a pure marketplace, but it still needs to substantiate profitability durability, exact current
      operating metrics, and governance maturity before public-market readiness can be assumed.
    claimRefs: [CO027, CO028, CO029, CO030, CO031, CO032, CO033, CO034, CO035]
    tableRefs: [TO004]
    figureRefs: [FO001]
