- id: SR002
  title: Operational quality, fulfilment, and data-security risk rise with scale
  body: |-
    Moglix now operates at a scale where small process failures can compound into commercial damage. The Cognilix launch
    materials describe a network of 45,000 suppliers, 1.2 million SKUs, operations across 80 countries, and 58
    warehouses, while the Middle East expansion story adds another layer of cross-border warehousing and third-party
    logistics coordination. That footprint is a strength for procurement depth, but it also means Moglix is exposed to
    supplier onboarding quality, catalog accuracy, forecasting quality, warehouse discipline, courier handoffs, and ERP
    synchronization at the same time. The more Cognilix becomes the workflow layer tying together supplier onboarding,
    compliance checks, inventory forecasting, payments, and logistics, the more a failure in one node can bleed into the
    next node rather than remaining a contained service issue.

    The public complaint surface supports that caution. Consumer-complaint boards contain recurring allegations around
    rejected returns, wrong-product deliveries, damaged goods, refund delays, and confusing tracking details. Those are
    not clean evidence of enterprise-account churn, but they are still useful indicators of where the company's physical
    and support processes can fail. Moglix's own FAQ partly explains the friction: returns for industrial goods are
    narrow, platform fees are non-refundable, and some categories push buyers toward replacement parts or brand service
    centers instead of easy refunds. On the cyber side, the public record is not one of a confirmed named breach, but the
    privacy policy itself is candid that internet transmission cannot be guaranteed 100% secure and that third-party
    sites may follow different privacy practices. For a business coordinating procurement, supplier, and payment data,
    that gap is material even without a disclosed incident.
