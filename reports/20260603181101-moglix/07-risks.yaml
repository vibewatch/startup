- id: SR004
  title: Leadership scaling, profitability conversion, and capital-allocation discipline remain open execution tests
  body: |-
    Moglix has clearly been adding leadership bench strength, but the public record still reads as a company moving from
    founder-led scale-up to institutional platform rather than one that has fully completed that transition. Rahul Garg is
    still the public face for IPO timing, AI/software strategy, and capital-allocation messaging. Around him, the company
    has added an IPO-oriented CFO, a CTO, and a managing director/chief business officer in 2025-26. That is positive,
    but it also signals that Moglix itself sees the need to widen leadership bandwidth before the next phase. The 2023
    layoff episode is the clearest adverse personnel marker in the open record, suggesting that cost discipline and team
    morale have already been tested once under funding pressure.

    Financial and strategic execution risk also remains tightly coupled to the listing narrative. Moglix has publicly
    discussed profitability improvement, has reported lower losses in FY25, and continues to invest in software and
    acquisitions, but the public evidence does not yet show a fully de-risked margin transition. Moneycontrol says the
    IPO timeline is still contingent on structural issues such as redomiciliation; Livemint says the company has also set
    aside substantial capital for acquisitions. That combination creates a classic late-stage scale risk: management has
    to improve profitability, integrate adjacencies, preserve service quality, complete the reverse flip, and fend off
    substitutes all within roughly the same window. If any two of those programs slip together, the IPO-ready narrative
    weakens quickly.
