  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: credlix-license-transparency
    missingEvidence: Direct public evidence showing whether Credlix itself is regulated as an NBFC, acts only as an LSP, or uses a hybrid partner structure by product.
    whyItMatters: The finance-attachment upside changes meaningfully depending on who bears lending, compliance, data, and default obligations.
    diligencePath: Request lender roster, lender-of-record language, NBFC registrations if any, product flow diagrams, and compliance memos mapping each program to RBI rules.
    relatedQuestionRefs:
    - QR005
  - type: missing-source
    severity: material
    topic: litigation-and-enforcement-screen
    missingEvidence: Counsel-led searches across Indian tribunals, Singapore entities, arbitration, and regulator records for all Moglix group entities and key executives.
    whyItMatters: Public portal review can miss entity-name variants, sealed matters, settled disputes, and non-indexed proceedings that still matter to IPO readiness.
    diligencePath: Run professional litigation, enforcement, and sanction screening across India and Singapore legal databases plus entity-level corporate records.
    relatedQuestionRefs:
    - QR007
  - type: private-evidence-only
    severity: material
    topic: supplier-and-logistics-concentration
    missingEvidence: Current concentration by supplier, category, warehouse, lender, and logistics partner, including failure-contingency design.
    whyItMatters: The public record shows scale and multi-node dependence but not whether a small number of counterparties carry outsized operational or commercial weight.
    diligencePath: Request top-20 supplier, carrier, lender, and node concentration tables plus contingency plans and SLA history.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: material
    topic: cyber-posture-and-incidents
    missingEvidence: Named security certifications, penetration-testing cadence, breach history, incident-response metrics, and material security-event disclosure.
    whyItMatters: Moglix coordinates supplier, order, payment, and procurement data at meaningful scale, so privacy-policy language alone is not enough to underwrite cyber resilience.
    diligencePath: Request ISO or SOC certifications, recent audit summaries, red-team results, and a 24-month incident log with remediation status.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: reverse-flip-program-detail
    missingEvidence: Moglix-specific court, tax, shareholder, and entity-restructuring timetable for the Singapore-to-India reverse flip.
    whyItMatters: Public commentary confirms intent, but not whether tax leakage, court sequencing, or shareholder approvals could materially delay IPO timing.
    diligencePath: Request the transaction structure memo, legal milestones, tax-scenario analysis, and board-approved program plan for redomiciliation.
    relatedQuestionRefs:
    - QR030
