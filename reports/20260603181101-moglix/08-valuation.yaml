        - {label: '2.7x FY25 revenue', value: 1.84, detail: 'A Udaan-like private-market read-through on FY25 revenue.', tone: neutral}
        - {label: '3.2x FY25 revenue', value: 2.18, detail: 'Upper end of the public-evidence base case.', tone: positive}
        - {label: '3.8x FY25 revenue', value: 2.59, detail: 'What the old $2.6B mark implies on FY25 revenue.', tone: neutral}
        - {label: '4.4x FY24 revenue', value: 2.60, detail: 'What the same $2.6B mark implies on FY24 revenue.', tone: risk}
        - {label: '4.4x FY25 revenue', value: 3.00, detail: 'Bull-case premium if profitability and IPO optionality both clear.', tone: positive}
    claimRefs: [CV038, CV039, CV040, CV041, CV042, CV043, CV044, CV048, CV049]
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: The public-evidence range is wide because the key input is current validation, not just historical growth.
    data:
      items:
        - {label: Bear, low: 1.0, mid: 1.25, high: 1.5, displayValue: '$1.0B-$1.5B', detail: 'Multiple reset and no IPO premium.', tone: risk}
        - {label: Base, low: 1.8, mid: 2.0, high: 2.2, displayValue: '$1.8B-$2.2B', detail: 'Scale plus improving losses, but still discounted for missing current validation.', tone: neutral}
        - {label: Bull, low: 2.5, mid: 2.75, high: 3.0, displayValue: '$2.5B-$3.0B', detail: 'Requires durable profitability and successful IPO positioning.', tone: positive}
        - {label: Preferred entry zone, low: 1.5, mid: 1.8, high: 2.0, displayValue: '$1.5B-$2.0B', detail: 'Range where investors are better paid for present disclosure and execution risk.', tone: positive}
