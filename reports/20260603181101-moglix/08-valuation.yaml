schemaVersion: report-v2
artifact: valuation
slug: moglix
runDate: '2026-06-03'
company:
  name: Moglix
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports Moglix as a scaled and improving industrial procurement platform, but not as a clean
    $2.5-$2.6 billion underwriting case today. The last true external price discovery is still the January 2022 Series F,
    the February 2025 capital came from Moglix's own parent rather than a new outside lead, and public comparable work
    points to a more defensible base-case range of roughly $1.8-$2.2 billion. The recommendation is track, with medium
    confidence, high risk, and a stretched valuation stance until profitability, disclosure quality, and IPO-readiness
    evidence improve.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: |-
      Moglix is large enough and strategically relevant enough to stay on an investor watchlist, but the public record does not justify paying the January 2022 mark as if it were current fair value. The company did raise $250 million at a $2.6 billion valuation in Series F, and multiple databases still carry that anchor. The problem is that it is now a legacy mark. There has been no later third-party financing round that clearly re-underwrote the company at or above that price, and the February 2025 infusion came from the Singapore parent rather than from a new outside lead investor. That makes the 2025 capital event more useful as a liquidity and IPO-prep signal than as fresh market validation.

      The operating picture is good enough to keep upside alive, but not good enough to erase that valuation gap. FY24 public revenue was about ₹4,964 crore and FY25 reporting later pointed to about $681.5 million of operating revenue with losses nearly halving. Management also said break-even could come within six to nine months. Those are real positives. Even so, the stale $2.6 billion mark still implies roughly 4.4x FY24 revenue and about 3.8x FY25 revenue, which looks demanding for a business that remains goods-heavy, still-financing-dependent, and not yet publicly proven as durably profitable. The disciplined public-source call is therefore track rather than buy.
    claimRefs: [CV001, CV002, CV004, CV005, CV006, CV007, CV008, CV018, CV019, CV038, CV039, CV045, CV046, CV050, CV051, CV054]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: last-round-anchor-vs-comparable-set
    title: Last-round anchor versus the comparable set
    body: |-
      Comparable evidence makes the valuation tension much clearer than the company headline alone. OfBusiness, which is profitable and much larger by revenue, was reported at around a $5 billion last-round valuation on about $2.3 billion of FY24 revenue, or roughly 2.2x sales. Zetwerk's latest public read-through is around $3 billion on FY25 gross revenue of ₹12,798 crore, or about 2.0x sales. Udaan's unchanged $1.8 billion valuation on roughly ₹5,700 crore of FY24 revenue works out to roughly 2.7x sales and still comes with an explicit profitability and restructuring story. Those are the closest late-stage Indian private-market read-throughs, and all sit below Moglix's last-round implied multiple.

      The premium-side comparison is IndiaMART, not another private B2B commerce unicorn. IndiaMART's June 2026 market cap of about $1.24 billion against annualized Q1 FY26 revenue implies roughly 7x sales, which is materially richer than the private B2B band. But IndiaMART is public, profitable, asset-light, and disclosure-rich in a way Moglix is not. Grainger's public multiple of roughly 3.4x sales and Würth's €20.7 billion revenue base further show that industrial-distribution scale alone does not automatically deserve a venture premium. The implication is straightforward: Moglix can justify a premium to stressed private peers if profitability conversion lands, but today's public evidence does not support paying a premium equal to or above the 2022 anchor with confidence.
    claimRefs: [CV013, CV014, CV015, CV016, CV017, CV020, CV021, CV022, CV023, CV024, CV025, CV026, CV027, CV028, CV029, CV030, CV031, CV032, CV033, CV034, CV040, CV041, CV042, CV043, CV044, CV046, CV055, CV056, CV059]
    tableRefs: [TV004]
    figureRefs: [FV002]
  - id: scenario-range-and-downside-triggers
    title: Bull, base, and bear range with downside triggers
    body: |-
      Scenario analysis is more honest than false precision here because the core gap is not arithmetic; it is validation. The bear case assumes that late-stage Indian private-market discipline stays tight, that the February 2025 internal round is read as support rather than validation, and that Moglix's goods-heavy model is valued closer to OfBusiness, Zetwerk, or Udaan-type private bands. On that reading, a range of roughly $1.0-$1.5 billion is plausible. It does not require a collapse in the business; it only requires investors to pay distribution-like or reset-multiple prices for a company whose last external mark is now several years old.

      The base case gives Moglix credit for real scale, narrowing losses, and a plausible path to break-even, while still discounting the absence of a fresh outside round, full stream-level margin disclosure, and complete reverse-flip execution. That supports roughly $1.8-$2.2 billion. The bull case needs several things to happen together: FY25-style growth has to continue, the six-to-nine-month break-even target has to prove real, redomiciliation and IPO readiness have to stay on track, and public-market sentiment has to reward the company with a premium closer to profitable or listed benchmarks. Under that path, $2.5-$3.0 billion becomes defendable. Today, however, the base case is the only one fully supported by public evidence.
    claimRefs: [CV007, CV018, CV019, CV035, CV036, CV037, CV038, CV039, CV045, CV046, CV047, CV048, CV049, CV050, CV052, CV057, CV058]
    tableRefs: [TV003, TV005]
    figureRefs: [FV003, FV004]
  - id: final-diligence-asks-and-investment-view
    title: Final diligence asks and investment view
    body: |-
      What would move the recommendation is not more narrative about category size, AI, or procurement digitization. Investors need a consolidated FY25-FY26 revenue bridge, audited gross margin by goods, software, and finance streams, a working-capital and debt schedule, and direct visibility into the cap table and preference stack. Those files determine whether Moglix deserves a distributor-like multiple, a modest premium to private B2B peers, or an eventual IndiaMART-style re-rating. Without them, the debate stays anchored to stale round prices and selective tracker snapshots rather than to current underwriteable economics.

      The thesis would weaken quickly if break-even slips materially beyond management's public timeline, if reverse-flip work drags and the IPO window moves out, or if the next external financing is priced below the 2022 anchor. The thesis would strengthen if Moglix proves that FY25 margin improvement is durable, shows that software and finance attachments lift blended economics, and produces current external validation rather than only internal support. Until then, the right investment posture is to monitor execution and hold price discipline. Moglix is not an avoid; it is a company whose public upside remains real but whose current valuation support remains incomplete.
    claimRefs: [CV006, CV007, CV012, CV018, CV019, CV045, CV046, CV050, CV051, CV052, CV053, CV054]
    tableRefs: [TV006]
    figureRefs: []
tables:
