callouts:
  - calloutType: recommendation
    title: Treat the 2022 valuation as an anchor, not an answer
    body: The Series F mark is still useful because it proves Moglix once cleared a premium late-stage round. It is not enough to prove fair value in 2026 because the company has not yet shown fresh outside price discovery at or above that level.
    claimRefs: [CV001, CV014, CV045, CV046]
  - calloutType: assumption
    title: What has to be true for the bull case to work
    body: Moglix has to convert FY25 progress into durable break-even, keep the reverse-flip and IPO timeline on track, and show that the next external validation reflects current fundamentals rather than legacy paper marks.
    claimRefs: [CV006, CV007, CV018, CV019, CV049, CV051]
