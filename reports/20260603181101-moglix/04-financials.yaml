- id: FI004
  title: Capital intensity / cash-flow map
  type: matrix
  layout: standard
  summary: Matrix of the main public capital-consumption vectors and what each implies for Moglix’s path to durable profitability.
  data:
    columns:
    - Observed signal
    - Financial implication
    rows:
    - label: Goods-led revenue mix
      values:
      - label: Traded goods at 98.98% of FY24 revenue
        tone: negative
        detail: Reported revenue quality remains dominated by low-margin merchandise flow.
      - label: Merchandise mix caps gross-margin upside
        tone: negative
        detail: Software and finance must become larger to change the blended margin profile.
    - label: Working capital
      values:
      - label: ₹752.5cr receivables; 27 WC days; ₹47cr cash
        tone: negative
        detail: India-entity filing proxies show real cash-conversion demands.
      - label: Runway cannot be inferred from public cash alone
        tone: negative
        detail: Consolidated cash and facility headroom are still missing.
    - label: Borrowings and charges
      values:
      - label: ₹222.2cr borrowings plus bank charge lines
        tone: neutral
        detail: The model clearly uses lender support in addition to equity.
      - label: Debt schedule and covenants are still opaque
        tone: negative
        detail: Without maturities and utilization, capital adequacy is incomplete.
    - label: Software uplift
      values:
      - label: Software fees and white-label contracts now explicit
        tone: positive
        detail: Cognilix could improve revenue quality if adoption broadens.
      - label: Scale still undisclosed
        tone: neutral
        detail: No public software ARR, attach rate, or gross-margin data yet.
    - label: Finance arm expansion
      values:
      - label: $50m Credlix investment and invoice-finance model
        tone: neutral
        detail: Adds fee-income potential and trade-finance optionality.
      - label: Also adds credit and working-capital complexity
        tone: negative
        detail: Finance income is not free of risk and may require additional capital support.
    - label: Manufacturing acquisition
      values:
      - label: ₹80cr Khatema acquisition with ₹300-400cr output target
        tone: neutral
        detail: Could deepen category control and packaging economics.
      - label: Raises asset intensity versus a pure marketplace
        tone: negative
        detail: Manufacturing expansion can increase capex, inventory, and execution risk.
  approximationNotes: 'The matrix is intentionally directional: public sources reveal the main capital vectors, but not the full return-on-invested-capital math behind each one.'
