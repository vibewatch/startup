company:
  name: Moglix
chapter:
  number: 4
  title: Financials
  summary: 'Public evidence shows Moglix as a large but still goods-heavy procurement platform: FY24 revenue reached about ₹4,964 crore with losses narrowing to about ₹189 crore, while FY25 reporting points to roughly $681.5 million of revenue and much smaller losses. The improvement story is real, but the decisive underwriting gap remains unchanged: public sources still do not provide a clean consolidated cash-flow view, realized take rate, or stream-level margin bridge, so durability of break-even remains promising rather than proven.'
sections:
- id: public-financial-baseline-and-revenue-quality
  title: Public financial baseline and why the topline needs scope discipline
  body: 'Moglix is one of those late-stage startups where public financial visibility is real but still structurally incomplete. Open sources now provide three overlapping lenses: news articles quoting Singapore-group filings, MCA-linked aggregators for the Indian operating entity, and tracker pages that normalize funding and headcount. Those lenses are useful, but they are not identical. FY23 sources point to roughly ₹4,595-4,665 crore of revenue or GMV-equivalent scale with losses around ₹193-196 crore. FY24 sources point to ₹4,964 crore of operating revenue, ₹5,309 crore of total income, and losses reduced to roughly ₹189 crore. FY25 reporting then suggests revenue of about $681.5 million and sharply narrower losses, while Tofler’s March 2025 India-entity dashboard shows ₹4,946.6 crore of revenue and still-negative EBITDA.


    The clean underwriting move is therefore to focus less on one “perfect” revenue figure and more on what the composition says. FY24 disclosures show traded goods accounting for 98.98% of operating revenue, with commissions, IT services, factoring, and allied services filling the residual bucket. That makes Moglix financially more like a goods-heavy procurement platform with software and finance attachments than like a clean SaaS company. Revenue is large and still growing, but quality depends on gross-margin retention, receivable discipline, and how much of the software and finance layer can scale without the goods engine carrying almost all of the top line.'
