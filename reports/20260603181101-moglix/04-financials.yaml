- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Status
  - Underwriting impact
  - Exact diligence path
  rows:
  - - Audited consolidated cash-flow statement
    - Unavailable in open sources
    - Cannot verify true burn, free cash flow, or self-funding capacity
    - Obtain FY25 audited consolidated financial statements and monthly cash-flow bridge
  - - Consolidated cash balance and runway
    - Partially available only via India-entity cash figure
    - Break-even guidance cannot be tested without group cash and facility headroom
    - Request consolidated cash, undrawn lines, and board-approved runway model
  - - Realized take rate and software ARR
    - Unavailable
    - Cannot separate goods-led pass-through from higher-quality software monetization
    - Request stream-level revenue bridge, bookings, ARR, and gross margin by stream
  - - Customer concentration and retention
    - Unavailable
    - Revenue quality and downside resilience remain opaque
    - Request top-20 customer exposure, NRR or re-order metrics, and gross-margin concentration
  - - Debt covenant and facility schedule
    - Partially visible via charge records only
    - Lender dependence cannot be stress-tested without maturity and covenant detail
    - Request sanction letters, charge documents, utilization, and covenant compliance
  - - Acquisition and Credlix return profile
    - Unavailable beyond headline spend and output claims
    - Cannot judge whether new manufacturing and finance bets improve or dilute returns
    - Request post-acquisition model, Credlix unit economics, and hurdle-rate assumptions
  notes: This table is the most decision-useful exhibit in the chapter because the biggest remaining underwriting risks stem from absent private data, not from lack of narrative about growth.
