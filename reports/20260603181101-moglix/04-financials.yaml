- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public estimate / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Gross margin
    - Tofler shows 6.5% gross margin on March 2025 India-entity data
    - medium
    - Confirms that current public economics look merchandise-heavy rather than software-like
    - Request consolidated gross margin by goods, software, and finance streams
  - - Operating margin / EBITDA
    - FY24 EBITDA margin about -1.5%; Tofler operating margin about -1.4%
    - medium
    - Shows progress toward break-even is still incomplete in public data
    - Request monthly FY25-FY26 EBITDA bridge and management forecast
  - - Net margin
    - Tofler March 2025 net margin about -2.6%; FY25 group loss still about $11.3 million
    - medium
    - Losses are shrinking, but profitability is not yet clearly durable
    - Request audited consolidated net income bridge and exceptional-item reconciliation
  - - Cost of sales intensity
    - Procurement and cost of sales dominate at 84-90% of cost base across FY23-FY25 disclosures
    - medium
    - Explains why topline scale alone does not guarantee margin expansion
    - Request category gross-profit tree and mix by private label vs third-party supply
  - - Expense per unit of revenue
    - FY24 public reporting says Moglix spent ₹1.11 to earn ₹1 of operating revenue
    - medium
    - Simple pressure test for efficiency and margin recovery
    - Request the same ratio for FY25, FY26 YTD, and post-Cognilix contracts
  - - Working-capital days
    - Tofler shows working-capital days 27, receivable days 56, payable days 33 for March 2025
    - medium
    - Cash conversion is central in a procurement-led model
    - Request consolidated cash-conversion cycle and inventory turns by product class
  - - Borrowings / lender exposure
    - Tofler shows ₹222.2 crore borrowings and multiple bank charge lines
    - medium
    - Signals dependence on working-capital finance and lender support
    - Request debt schedule, sanctioned limits, utilization, and covenants
  - - Revenue per employee
    - Estimated roughly ₹3.1 crore-₹3.9 crore per employee from mixed public sources
    - low
    - Serves as a rough sales-efficiency proxy only
    - Request GAAP revenue per FTE by entity and geography
  notes: This table mixes direct public metrics and low-confidence derived proxies. Every private or entity-mismatched metric is flagged as such rather than treated as management-grade truth.
