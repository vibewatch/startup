- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Sale of traded industrial goods
    - Principal merchandised procurement revenue from industrial supplies and related categories
    - ₹ / % of revenue
    - FY24 traded goods revenue about ₹4,914 crore; 98.98% of operating revenue
    - medium
    - Request category-level gross margin and SKU-level contribution by cluster
  - - Marketplace commissions
    - Commission on online sales attached to marketplace transactions
    - '% of GMV / revenue'
    - Explicitly disclosed as a residual revenue line in FY23 and FY24, but no public take rate
    - low
    - Request realized take rate by category, geography, and customer cohort
  - - IT / software services
    - Cognilix and IT-service layer sold as software fees, with some volume-linked pricing
    - Contract fee / usage-linked fee
    - Public 2026 evidence shows software-fee monetization, but no disclosed software ARR or bookings
    - medium
    - Request FY26 software revenue, renewal rates, and standalone gross margin
  - - Factoring / supply-chain finance
    - Credlix financing, factoring, and allied services
    - Finance fee / yield
    - Factoring explicitly appears in FY24 residual revenue mix; Credlix markets invoice financing up to 95% of invoice value
    - medium
    - Request financed volume, yield, take rate, loss rates, and lender economics
  - - Managed procurement / support services
    - Process digitization, support, analytics, and service operations around procurement workflows
    - Service fee / implementation fee
    - Support services appear in FY23 reporting and official procurement pages, but realized pricing is undisclosed
    - low
    - Request managed-procurement fee schedules, deployment fees, and renewal rates
  notes: Public sources support the existence of five monetization layers, but only goods revenue is quantified with confidence; software and finance remain strategically important but numerically underdisclosed.
