  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: consolidated-cash-flow
    missingEvidence: Audited consolidated cash-flow statement, month-end cash balances, and a board-level runway model.
    whyItMatters: Without consolidated cash and cash-flow visibility, the public break-even narrative cannot be tested for durability.
    diligencePath: Request the latest audited consolidated statements plus a monthly cash waterfall from April 2025 onward.
    relatedQuestionRefs:
    - QI018
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: stream-level-monetization
    missingEvidence: A stream-by-stream revenue bridge separating goods margin, commissions, software fees, finance income, and support services.
    whyItMatters: Revenue quality is the core underwriting question, and public sources only partially distinguish the layers.
    diligencePath: Request management reporting that reconciles GMV, recognized revenue, gross profit, and renewal by stream.
    relatedQuestionRefs:
    - QI006
    - QI007
    - QI008
    - QI009
    - QI023
    relatedTableRefs:
    - TI001
    - TI002
    - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-quality
    missingEvidence: Top-customer concentration, repeat-order rates, software retention, and contribution margin by major account.
    whyItMatters: Large enterprise procurement can look stable until concentration or discounting risk is revealed.
    diligencePath: Request top-20 customer revenue, cohort retention, gross margin, and contract-tenor data.
    relatedQuestionRefs:
    - QI010
    - QI021
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: debt-and-covenants
    missingEvidence: Full lender schedule with sanctioned limits, utilization, collateral, maturities, and covenant status.
    whyItMatters: Working-capital facilities are visible, but actual liquidity risk cannot be underwritten without terms.
    diligencePath: Pull charge documents, sanction letters, and covenant-compliance certificates facility by facility.
    relatedQuestionRefs:
    - QI013
    - QI014
    - QI024
    relatedTableRefs:
    - TI003
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: capital-allocation-returns
    missingEvidence: Post-investment return model for Credlix and post-acquisition return model for Khatema Fibres.
    whyItMatters: The latest capital deployment choices add complexity and may improve or dilute returns depending on execution.
    diligencePath: Request ROIC model, payback expectations, and board materials for Credlix and Khatema.
    relatedQuestionRefs:
    - QI019
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
