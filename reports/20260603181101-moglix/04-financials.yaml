- id: TI004
  title: Capital adequacy table
  columns:
  - Capital item
  - Public evidence
  - Current value / status
  - Implication
  - Diligence ask
  rows:
  - - Series E equity round
    - Official Moglix announcement
    - 'May 2021: $120 million at $1 billion valuation'
    - Established unicorn status and funded early full-stack expansion
    - Confirm remaining proceeds, liquidation preferences, and board rights
  - - Series F equity round
    - Official Moglix announcement
    - 'Jan 2022: $250 million at $2.6 billion valuation'
    - Last clean external price-setting round in public evidence
    - Confirm current cap table and whether any terms still govern next financing or IPO
  - - Parent infusion
    - Inc42 report citing RoC filings
    - 'Dec 2024-Feb 2025: INR 107.58 crore (~$12.3 million) via CCCPS from Singapore parent'
    - Supports the balance sheet but does not create a fresh external valuation mark
    - Request board minutes, rights terms, and use-of-funds bridge
  - - Tracker total funding range
    - Inc42 Datalabs and Tracxn
    - About $471 million to $481.51 million+
    - Capital history needs reconciliation; exact total is not one clean public number
    - Request round-by-round cap table and secondary-vs-primary split
  - - Break-even guidance
    - CNBC TV18 interview with Rahul Garg
    - Management said break-even should happen within six to nine months from Sep 2024
    - Improvement narrative is plausible, but still needs current proof
    - Request monthly EBITDA, cash burn, and covenant headroom through FY26
  - - Visible borrowing / bank facilities
    - Tofler charges and borrowings view
    - ₹222.2 crore borrowings plus visible bank charge lines
    - Shows that working-capital finance matters alongside equity
    - Request lender-by-lender outstanding balance, limits, and security package
  - - Cash and liquidity
    - Tofler India-entity dashboard
    - ₹47.0 crore cash and equivalents at March 2025 for India entity only
    - Insufficient to infer group runway without consolidation context
    - Request consolidated cash, restricted cash, and undrawn facilities
  - - Capital intensity additions
    - CNBC on Khatema and Credlix
    - ₹80 crore acquisition plus $50 million Credlix investment
    - Expansion now includes manufacturing and finance arms, which can consume more capital than pure software
    - Request capex, working-capital, and expected payback by initiative
  notes: The table intentionally distinguishes external priced rounds, internal parent capital, visible debt evidence, and operational uses of capital because those do not carry the same underwriting meaning.
