  summary: How enterprise procurement activity appears to convert into Moglix revenue, with software and finance layers attaching on top of a goods-heavy base.
  data:
    nodes:
    - id: enterprise-demand
      label: Enterprise procurement demand
      detail: Large manufacturers and infrastructure buyers centralize indirect spend, MRO, and supplier workflows.
    - id: goods-volume
      label: Goods-led transaction volume
      detail: Public FY24 disclosures show traded goods making up 98.98% of operating revenue.
    - id: service-layer
      label: Managed procurement / support
      detail: Vendor consolidation, dashboards, tracking, and workflow services accompany core supply transactions.
    - id: software-layer
      label: Cognilix software fees
      detail: White-label software fees and some volume-linked contracts are intended to deepen non-commerce revenue.
    - id: finance-layer
      label: Factoring / Credlix finance income
      detail: Factoring and working-capital products attach to the trade flow through finance income or fees.
    - id: recognized-revenue
      label: Recognized revenue
      detail: Goods revenue dominates reported top line, while commissions, IT services, factoring, and allied services fill the residual bucket.
    - id: gross-profit
      label: Gross profit outcome
      detail: Margin quality depends on how much software and finance scale relative to goods procurement and delivery costs.
