  - id: FP003
    title: Moat / readiness KPIs
    type: kpi
    layout: compact
    summary: Compact underwriting view of where Moglix appears strongest, where substitutes are most credible, and what remains missing from public evidence.
    data:
      items:
        - label: Industrial MRO focus
          value: High
          detail: Moglix is more industrial and execution-heavy in reviewed comparison sources than IndiaMART or Udaan.
        - label: Managed-procurement readiness
          value: High
          detail: BusinessLine's 2025 snapshot points to real next-day execution, 45+ fulfilment centres, and 1 lakh+ stocked SKUs in targeted categories.
        - label: Marketplace-liquidity gap
          value: Medium
          detail: IndiaMART still leads on enquiries, storefronts, and paying suppliers, which matters for generic discovery-led demand.
        - label: Finance uniqueness
          value: Medium-low
          detail: Credit is increasingly table stakes because OfBusiness, Udaan, Bizongo, and Power2SME all market financing support.
        - label: Software-only substitution risk
          value: Medium-high
          detail: SAP and Coupa can absorb workflow, compliance, and supplier-management needs when buyers keep supply in-house.
        - label: Public pricing transparency
          value: Low
          detail: Reviewed sources mostly describe pricing posture and packaging logic rather than actual enterprise contract economics.
    claimRefs: [CP002, CP005, CP023, CP027, CP029, CP032, CP040, CP041, CP050, CP051, CP052, CP053, CP054, CP055]
