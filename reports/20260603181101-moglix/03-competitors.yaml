  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: competitor-matrix-coverage
      missingEvidence: Current customer-verified feature maps and contract structures for Moglix, IndiaMART, Udaan, OfBusiness, Zetwerk, and the main substitute sets at product level.
      whyItMatters: The competitor profile table and capability matrix are evidence-backed but still grouped because public sources do not publish one like-for-like feature sheet across every rival.
      diligencePath: Request current product comparison decks, enterprise RFP responses, and demo scripts from management and major customers.
      relatedQuestionRefs: [QP014, QP018, QP024]
      relatedTableRefs: [TP001, TP002]
    - type: missing-source
      severity: material
      topic: pricing-transparency
      missingEvidence: Current list pricing, take rates, service fees, and realized contract economics for Moglix and the main rival procurement platforms.
      whyItMatters: Pricing power and margin durability are central to underwriting, but reviewed public sources mostly describe packaging posture rather than actual enterprise economics.
      diligencePath: Obtain sample contracts, invoices, rebate schedules, and category-level gross-margin decks for Moglix, IndiaMART, Udaan, OfBusiness, Amazon Business, SAP, and Coupa.
      relatedQuestionRefs: [QP018, QP024]
      relatedTableRefs: [TP003]
    - type: private-evidence-only
      severity: material
      topic: win-rates-and-replacement-patterns
      missingEvidence: Current win-loss data versus IndiaMART, OfBusiness, Udaan, and ERP-led internal procurement teams by category and account size.
      whyItMatters: Moat durability depends on whether Moglix consistently wins urgent industrial workflows or loses generic spend to broader marketplaces and software-led internal models.
      diligencePath: Review CRM opportunity data, displacement notes, and renewal cohorts for the last 12 months with competitor attribution.
      relatedQuestionRefs: [QP023, QP024, QP025]
    - type: missing-source
      severity: minor
      topic: global-benchmark-india-penetration
      missingEvidence: India-specific penetration and win-loss evidence for Amazon Business, Grainger, and Würth against Moglix target accounts.
      whyItMatters: Global distributors and software suites are real substitutes, but open sources do not isolate their India MRO penetration or plant-floor relevance.
      diligencePath: Ask management and channel partners for India-specific case studies, distributor overlap data, and category-level benchmark evidence.
      relatedQuestionRefs: [QP022, QP025]
