figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    layout: wide
    summary: Ordinal map of procurement breadth versus enterprise-managed-procurement focus across Moglix's main direct and substitute competitors.
    data:
      points:
        - label: Moglix
          x: 7
          y: 8
          description: Industrial breadth plus high enterprise and managed-procurement intensity in MRO-heavy workflows.
        - label: IndiaMART
          x: 9
          y: 5
          description: Highest marketplace breadth and discovery scale, but a weaker public signal on managed plant-floor execution.
        - label: Udaan
          x: 8
          y: 4
          description: Broad category commerce and credit, but public positioning remains retail and trade heavy.
        - label: OfBusiness
          x: 6
          y: 7
          description: Raw-material depth and finance attachment with stronger enterprise/contractor orientation than generic marketplaces.
        - label: Zetwerk
          x: 5
          y: 7
          description: Manufacturing assurance and supplier aggregation rather than recurring MRO catalog breadth.
        - label: Amazon Business / global distributors
          x: 8
          y: 6
          description: Strong indirect-spend breadth, RFQ and inventory programs, but less localized India-specific managed service.
        - label: SAP / Coupa
          x: 3
          y: 9
          description: Highest workflow control and compliance depth, but no owned physical supply layer.
    approximationNotes: >
      x-axis is an evidence-backed ordinal 1-10 score for category breadth and adjacent spend coverage; y-axis is
      an evidence-backed ordinal 1-10 score for enterprise-managed-procurement intensity. These are analytical
      scores anchored to reviewed product and profile sources, not audited market-share metrics.
    claimRefs: [CP003, CP004, CP005, CP008, CP015, CP022, CP029, CP032, CP046, CP048, CP049, CP050, CP051, CP052]
