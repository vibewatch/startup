  rows:
  - - Diversified mining and non-ferrous metals
    - Group procurement or materials-management leader
    - Plant maintenance teams and category managers
    - Plant procurement budget with central oversight
    - Fragmented supplier base, sub-standard data, price variation, and GST-compliance needs
    - CPO or plant-operations leadership
    - Need to standardize vendors and capture double-digit cost savings
  - - Zinc and base-metals operations
    - Multi-location procurement and logistics lead
    - Plant buyers and post-PO logistics teams
    - Central procurement and inventory budget
    - Manual ordering, inconsistent INCOTERMS, weak shipment visibility, and high carrying costs
    - Materials-management head
    - Need to reduce supplier base and improve logistics control
  - - Oil and gas and LPG cylinder manufacturing
    - Plant procurement head and operations manager
    - Maintenance teams across 13 plants
    - Operations or plant procurement budget
    - Unplanned MRO demand, limited purchase visibility, and stock-outs across plant network
    - COO or plant-network head
    - Need clean master data and cross-plant price discipline
  - - Process manufacturing, fertilizer, and chemicals
    - Indirect procurement and maintenance leader
    - Maintenance and stores teams
    - Plant and shared-services procurement budget
    - Tail-spend complexity, catalog sprawl, approvals, and service-level risk during maintenance cycles
    - Plant head or procurement controller
    - Need standardized catalogs, approvals, and contract compliance
  - - Infrastructure, EPC, and project sites
    - Project procurement or commercial head
    - Site engineers and project stores
    - Project or EPC budget
    - Dispersed site buying, fabrication requirements, and indirect procurement across projects
    - Project director or commercial owner
    - Need faster site fulfillment and better spend consolidation
  - - Enterprise procurement transformation
    - CPO or digital-procurement program owner
    - Procurement analysts and plant requesters
    - Group procurement or CIO transformation budget
    - ERP-connected sourcing, vendor management, and spend analytics rollout
    - CFO or CPO
    - Need visibility, compliance, and a consistent buying experience across sites
