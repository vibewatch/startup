- id: sizing-lenses-and-what-is-actually-addressable
  title: Multiple Sizing Lenses Show a Large Market, but the Direct Wedge Is Narrower
  body: 'The broadest public market lens comes from Bessemer Venture Partners, which argues that

    India’s online B2B marketplace opportunity could reach roughly $200 billion by 2030 even while

    remaining under 5% of the overall B2B market. That is useful evidence that digitization runway is

    still long, but it is far too broad to call Moglix’s direct TAM. A closer lens comes from 6Wresearch,

    which forecasts 17.6% CAGR for India B2B e-commerce during 2026-2032 and identifies

    manufacturing as the fastest-growing end-user segment. The closest spend proxy, however, is

    IMARC’s India MRO market estimate: $57.1 billion in 2025, rising to $66.6 billion by 2034. That

    is still broader than Moglix’s target accounts, but it is much closer to the budget lines Moglix is

    actually trying to digitize.


    The right underwriting move is therefore lens-based rather than additive. Public-procurement

    digitization through GeM shows that large Indian buying flows can move online at scale, while the

    MSME and manufacturing evidence shows why supplier and buyer density is so large. Even so,

    Moglix should not claim the full MRO pool as immediate SAM because overall digital penetration in

    Indian B2B remains low. A conservative analytical 2026 serviceable wedge of roughly $3-6 billion is

    more defensible if one assumes that only a mid-single-digit share of India’s direct MRO and

    adjacent indirect-procurement spend is ready to flow through managed digital procurement

    platforms before 2030. That range is low confidence, but it is materially more decision-useful than

    a generic $200 billion headline.

    '
