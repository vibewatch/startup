evidenceGaps:
- type: private-evidence-only
  severity: material
  topic: Moglix GMV and revenue mix by category and vertical
  missingEvidence: Current Moglix GMV, revenue, and gross-margin split across MRO, packaging, infrastructure, software, and finance, plus sector mix by manufacturing, mining, oil and gas, infrastructure, and other buyers.
  whyItMatters: Without current category and vertical mix, the serviceable-market estimate can only be analytical and low-confidence rather than tied to real customer cohorts.
  diligencePath: Request management reporting that breaks down GMV, revenue, gross margin, and active-customer counts by product line, industry vertical, and geography for FY25-FY26.
  relatedQuestionRefs:
  - QM024
  - QM025
  - QM027
  relatedTableRefs:
  - TM002
- type: missing-source
  severity: material
  topic: Private versus government procurement exposure
  missingEvidence: A public source isolating Moglix’s current mix of private-enterprise procurement versus PSU or government-linked procurement.
  whyItMatters: GeM proves digital procurement at scale, but investors still need to know whether Moglix’s own demand mix is driven primarily by private industry, public-sector buying, or both.
  diligencePath: Request a customer-segmentation bridge showing revenue or GMV split by private enterprise, PSU, government, export, and channel accounts.
  relatedQuestionRefs:
  - QM021
  - QM026
- type: missing-source
  severity: material
  topic: India industrial e-procurement software spend benchmark
  missingEvidence: A clean public 2026 benchmark isolating India source-to-pay and industrial procurement software spend separate from physical goods GMV.
  whyItMatters: Moglix blends software, commerce, and fulfillment; without a clean software-spend benchmark, its procurement-OS upside cannot be sized precisely from public data alone.
  diligencePath: Obtain paid analyst extracts or management materials that separate procurement SaaS, source-to-pay, and industrial workflow software from physical MRO and indirect spend.
  relatedQuestionRefs:
  - QM003
  - QM019
  - QM024
