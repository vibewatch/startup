    body: "Flatpay's audited 2025 accounts reveal €70m in operating losses and €94m in negative free cash outflow, with management projecting 2026 losses to widen further to €140–150m. While supported by €146m in 2025 equity funding and a €24m state debt facility, the company faces persistent financing dependency unless gross margins and sales payback rapidly improve."
    claimRefs:
