companyProfile:
  summary: >-
    Flatpay is a Copenhagen-founded fintech that sells flat-rate card acquiring, payment terminals, and POS software to
    small and medium-sized European merchants. It has scaled rapidly across seven markets through direct field sales and
    on-site installation, but the public record still leaves its unit economics, retention quality, and regulatory
    posture only partially proven.
