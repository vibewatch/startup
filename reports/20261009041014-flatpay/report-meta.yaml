  topStrengths:
    - Rapid merchant and revenue growth across multiple European markets.
    - Simple merchant value proposition with direct field sales and on-site installation.
    - Strong investor backing and a clear SMB payments wedge.
  topRisks:
    - Unit economics remain opaque, including realized margin, retention, and payback.
    - Field-sales expansion is capital intensive and has already produced large losses and burn.
    - Surcharging, partner dependence, and market-by-market compliance create regulatory and execution risk.
  unresolvedGaps:
    - Audited 2025-2026 group financial statements with gross margin, cash flow, and balance-sheet detail.
    - Cohort retention, churn, CAC, payback, and NRR by market and merchant segment.
    - Current cash balance, burn, runway, and debt or leasing obligations after the 2025 financing round.
    - A complete legal, regulatory, and acquiring-partner map for every operating market.
