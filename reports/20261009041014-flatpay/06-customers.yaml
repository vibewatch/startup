  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: >-
        Named production customers with deployment dates, products used,
        transaction scale, reference contacts, and quantified outcomes.
      whyItMatters: >-
        Aggregate merchant counts and category labels cannot establish production
        quality, realized value, or customer referenceability.
      diligencePath: >-
        Obtain at least three customer references across countries and verticals,
        then reconcile interviews to contracts, invoices, and usage records.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: retention-evidence
      missingEvidence: >-
        Monthly customer cohorts showing logo churn, GRR, NRR, renewals,
        contract duration, utilization, support burden, and reactivation.
      whyItMatters: >-
        Gross account growth does not distinguish durable adoption from replacement
        selling, inactivity, or high churn.
      diligencePath: >-
        Review anonymized account-level cohorts by acquisition month, country,
        vertical, product, and sales representative, tied to billed revenue.
      relatedQuestionRefs: [QU004]
    - type: private-evidence-only
      severity: material
      topic: concentration
      missingEvidence: >-
        Top-customer, top-acquirer, country, vertical, and sales-channel shares of
        volume, gross profit, and net revenue.
      whyItMatters: >-
        Seven-market breadth does not by itself rule out customer, geography,
        channel, or partner concentration.
      diligencePath: >-
        Request concentration schedules for the latest month and trailing twelve
        months, plus stress tests for loss of the largest acquirer or market.
      relatedQuestionRefs: [QU006, QU009]
