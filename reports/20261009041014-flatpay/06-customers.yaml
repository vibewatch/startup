schemaVersion: "report-v2"
artifact: customers
slug: flatpay
runDate: 2026-10-09
company:
  name: Flatpay
chapter:
  number: 6
  title: Customers
  summary: >-
    Flatpay serves small and medium-sized physical merchants through a simple
    terminal, mPOS, and point-of-sale offer backed by field sales and on-site
    installation. Public sources indicate rapid merchant growth, but inconsistent
    snapshot definitions and the absence of named-customer outcomes, cohort
    retention, and concentration data leave durability unproven.
sections:
  - id: customer-segments-and-jobs
    title: Customer segments and operating jobs
    body: >-
      Flatpay's stated customer is the small or medium-sized physical merchant:
      the owner or operator buys the service, front-line staff use the terminal or
      point-of-sale workflow, and the merchant bears payment-acceptance costs.
      Flatpay's US landing page presents payment terminal, mPOS, and point of sale
      as three solutions and names merchant categories including bars, florists,
      markets, coffee shops, butchers, and fast-casual restaurants. Independent
      coverage likewise describes the company as serving small merchants or
      small and medium-sized businesses. The evidence therefore supports a broad
      in-person SMB segmentation, but not segment-level account counts, payment
      volume, revenue, retention, or profitability. Seven-market operating
      references show geographic breadth, while the source pool does not permit a
      reliable allocation of merchants or economics by country or vertical.
    claimRefs: [CU001, CU002, CU011]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory is strong but not cohort evidence
    body: >-
      The retained record shows a steep directional increase in adoption. A
      partnership profile reported more than 2,500 customers after Flatpay began
      scaling in late 2022. A later newsletter described about 60,000 customers,
      up from 7,000 in April 2024, while a dated June 2026 industry commentary
      reported 100,000 merchants across seven markets and EUR20 billion of annual
      processing volume on a run-rate basis. These are not a clean time series:
      the publications use both customers and merchants, one snapshot lacks a
      publication date in the fetched text, and none discloses measurement rules,
      active-status criteria, or cohort denominators. Processing volume is also
      not revenue or ARR. The evidence supports scale and growth, but not precise
      acquisition velocity, utilization, or durable recurring economics.
    claimRefs: [CU003, CU004, CU005, CU006, CU013]
    tableRefs: [TU002]
  - id: proof-retention-and-reference-quality
    title: Named proof and retention remain the central evidence gap
    body: >-
      Public customer proof is substantially weaker than the aggregate adoption
      narrative. Flatpay's landing page lists merchant categories and says its
      merchants include stories it is proud of, but the fetched page does not
      identify a merchant, deployment date, production status, or quantified
      outcome. The independent items in the assigned pool report company-wide
      customer or merchant counts rather than customer-authored results. No
      retained source supplies gross or net revenue retention, logo churn,
      renewals, contract duration, cohort behavior, customer satisfaction, or
      segment concentration. This is absence from the reviewed public evidence,
      not proof that the company lacks references or strong retention. Investment
      diligence should therefore treat named production references and
      invoice-level cohorts as private-evidence requests rather than infer
      durability from logo categories or aggregate growth.
    claimRefs: [CU002, CU014, CU016]
    tableRefs: [TU003]
  - id: expansion-loop-and-concentration-risk
    title: Expansion loop, dependencies, and concentration risk
    body: >-
      Flatpay's acquisition loop is unusually operational. Industry commentary
      says the founders adapted an alarm-industry field-sales model, use field
      sales as the sole distribution model, and expect representatives to produce
      about 20 deals per month. The official onboarding path then moves from an
      in-person meeting to solution selection and on-site installation, followed
      by daily payouts and 24/7 support. This can reduce adoption friction for
      merchants that value hands-on service, but it also makes sales productivity,
      installation cost, and local staffing central to expansion economics. The
      early Finaro relationship supplied white-label acquiring capability, and
      Flatpay's legal page says terms vary by market. A separate industry source
      reports that competitors view the surcharge-funded offer as controversial
      and replicable. Public evidence does not quantify customer, channel, or
      acquirer concentration, so those exposures remain open rather than benign.
    claimRefs: [CU007, CU008, CU009, CU010, CU012, CU015]
    figureRefs: [FU001]
