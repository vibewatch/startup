callouts:
  - calloutType: strength
    title: Rapid directional merchant adoption
    body: >-
      Multiple snapshots rise from more than 2,500 customers after launch to a
      reported 100,000 merchants by June 2026, although definitions are not
      standardized.
    claimRefs: [CU003, CU004, CU005, CU006]
  - calloutType: risk
    title: Growth is not retention proof
    body: >-
      The retained public record lacks named customer outcomes, cohort retention,
      churn, renewals, contract length, and concentration data.
    claimRefs: [CU014]
