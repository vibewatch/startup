callouts:
  - calloutType: "risk"
    title: "Direct Field Sales Overhead and Merchant Churn Sensitivity"
    body: "Flatpay's hyper-growth relies on an intensive direct sales force of over 2,000 employees conducting in-person merchant visits. Sales representatives face strict quotas of 20 closed deals per month and rapid dismissal for underperformance. This aggressive model carries high fixed customer acquisition overhead and heightened operational vulnerability to SME merchant business failure rates across European retail and hospitality sectors."
    claimRefs:
      - "CO009"
      - "CO014"
  - calloutType: "insight"
    title: "Unit Economics Shielded by Consumer Card Surcharging"
    body: "Industry analysis reveals that Flatpay's ability to offer zero subscription fees and low flat transaction rates to merchants is heavily subsidised by offering free processing on corporate and international cards funded via consumer surcharges. While compelling to SME business owners, this practice invites regulatory scrutiny under European payment services rules and merchant trade resistance if acquiring interchange dynamics shift."
    claimRefs:
      - "CO009"
