  - id: TV001
    title: Recommendation summary and underwriting framework
    columns:
      - Decision Parameter
      - Assigned Stance
      - Evidence Basis
      - Investment Implication
    rows:
      - - Recommendation
        - track
        - Rapid merchant expansion countered by unverified profitability and lack of audited group accounts
        - Do not commit fresh primary capital at €1.5B post-money without audited financial confirmation
      - - Confidence
        - medium
        - High corroboration on Series C financing size and valuation, but low visibility into unit margins
        - Rely on third-party cross-checks rather than management public forward-looking guidance
      - - Risk Rating
        - high
        - High cash burn, aggressive headcount scaling, direct door-to-door sales model turnover
        - Underwrite high downside exposure if merchant acquisition velocity falters across new markets
      - - Valuation Stance
        - stretched
        - €1.5B ($1.75B) mark implies over 12x current ARR, exceeding normalized European payments comps
        - Price demands flawless 300% forward growth delivery and durable transaction margins
    notes: >-
      Underwriting framework synthesis based on Series C headline valuation metrics reported across financial media in
      November 2025.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV008
      - CV014
  - id: TV002
    title: Investment thesis and anti-thesis evaluation
    columns:
      - Perspective
      - Core Argument
      - Supporting Evidence
      - Thesis-Altering Catalyst
    rows:
      - - Core Thesis
        - Direct field sales model bypasses bank channels to capture underserved European SME payment volume
        - Over 60,000 active merchants across 6 European countries, including 20,000 merchants in Germany
        - Field sales rep productivity dropping below 20 merchant contracts per month quota
      - - Product Simplicity
        - Unified terminal and POS software with predictable flat pricing removes complex hidden fee structures
        - Public marketing guarantees flat-rate transaction pricing with zero hidden fees and daily payouts
        - Rise in merchant contract disputes, hardware return rates, or churn to integrated ISV platforms
      - - 'Anti-Thesis: Surcharging'
        - Merchant acquisition velocity relies on zero-fee processing funded via consumer card surcharges
        - Industry payments analysis identifies credit card consumer surcharging as primary growth catalyst
        - EU or national regulatory enforcement banning business card surcharging mechanisms
      - - 'Anti-Thesis: Burn Rate'
        - Operating model is unprofitable with heavy overhead from 1,400 to 1,500 personnel
        - Executive commentary admits company is still unprofitable despite €145M round
        - Failure to reach EBITDA breakeven before Series C capital reserves deplete
    notes: Comparison of core operational growth arguments against structural unit-economic and regulatory risks.
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV008
      - CV010
      - CV011
      - CV012
  - id: TV003
    title: Multi-year valuation and operating scenario matrix
    columns:
      - Scenario
      - Operating Assumptions
      - Projected ARR
      - Assumed Multiple
      - Implied Valuation
      - Downside Triggers and Key Risks
    rows:
      - - Bull Case
        - 300% annual ARR growth achieved; field sales successfully replicates in Netherlands and UK
        - €450M
        - 6.0x
        - €2.7B ($3.1B)
        - Multiple compression if public payment peers trade down; terminal supply chain disruptions
      - - Base Case
        - Growth moderates to 80% as European markets saturate; steady merchant churn in Germany and Denmark
        - €220M
        - 5.0x
        - €1.1B ($1.3B)
        - Valuation sits below Series C post-money mark, creating down-round risk for late-stage investors
      - - Bear Case
        - Consumer surcharging banned across key markets; merchant churn spikes to 25%; field sales turnover
        - €130M
        - 4.0x
        - €520M ($600M)
        - Severe cash drain necessitating distressed recapitalization or emergency structured financing
    notes: Scenario analysis evaluating post-money entry valuation relative to prospective operational trajectories.
    claimRefs:
      - CV002
      - CV004
      - CV007
      - CV011
      - CV013
      - CV014
      - CV016
figures:
  - id: FO001
    title: Flatpay Corporate Evolution and Milestone Timeline
    type: timeline
    summary: Chronological trajectory of Flatpay from founding through international expansion and unicorn funding.
    data:
      items:
        - date: 2022-01
          label: Corporate Founding
          detail: Flatpay is established in Copenhagen by Sander Janca-Jensen, Rasmus Busk, Rasmus Carlsen, and Peter Lüth.
        - date: 2023-06
          label: German Market Launch
          detail: >-
            Flatpay launches commercial merchant operations in Germany, onboarding over 1,000 local merchants within its
            first year.
        - date: 2024-04
          label: Series B Funding
          detail: >-
            Secures €45M in Series B funding led by Dawn Capital with participation from Seed Capital to expand product
            and sales footprint.
        - date: 2024-04
          label: Integrated POS Launch
          detail: Rolls out fully integrated point-of-sale software and terminal packages alongside daily settlement features.
        - date: 2025-10
          label: ARR Milestone Reached
          detail: >-
            Crosses €100M in annual recurring revenue run-rate while servicing approximately 60,000 active European
            merchants.
        - date: 2025-11
          label: Unicorn Financing Round
          detail: >-
            Closes €145M Series C round at a €1.5B valuation ($1.75B), expanding institutional syndicate to back
            European scale.
        - date: 2026-06
          label: Merchant Base and GMV Surge
          detail: >-
            Announces 100,000 active merchants across 7 European countries and reaches €20B in annualized processing
            volume.
        - date: 2026-10
          label: Marketing Leadership Reorganization
          detail: >-
            Appoints Nikolai Pedersen as CMO managing 35 marketing staff as Rasmus Carlsen transitions to Chief Brand
            Officer.
    approximationNotes: >-
      Timeline dates reflect public announcements and executive interview disclosures; specific day-level corporate
      registration dates remain private.
    claimRefs:
      - CO001
      - CO004
      - CO005
      - CO006
      - CO008
      - CO011
      - CO012
      - CO013
