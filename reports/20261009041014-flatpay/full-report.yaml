              - CO009
              - CO012
              - CO013
              - CO014
      - number: '1.2'
        title: Founding Team, Leadership Evolution, and Key-Person Exposure
        blocks:
          - type: paragraph
            body: >-
              The business was launched by serial founders Sander Janca-Jensen (Chief Executive Officer), Rasmus Busk,
              Rasmus Hellmund Carlsen, and Peter Lüth. Notably, the founders did not originate from the traditional
              payment acquiring industry; rather, they previously scaled direct distribution operations in the alarm
              security sector, adapting in-person direct sales techniques to merchant acquiring. Leadership development
              follows an internal apprenticeship model: executive hires are drawn from elite strategy consulting
              backgrounds (such as McKinsey and BCG) and paired directly with a co-founder for six to twelve months
              before taking country-level commercial directorships, with every country managing director promoted
              internally. Material organizational evolution includes the transition of co-founder Rasmus Carlsen to
              Chief Brand Officer to guide international expansion, while former marketing director Nikolai Pedersen was
              appointed Chief Marketing Officer overseeing a 35-person centralized marketing team across Flatpay's seven
              operating jurisdictions. While operational discipline and field accountability remain rigorous, executive
              authority is heavily concentrated in CEO Sander Janca-Jensen.
            claimRefs:
              - CO004
              - CO008
              - CO010
              - CO011
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO008
              - CO010
              - CO011
      - number: '1.3'
        title: Capitalization Trajectory, Scale Discrepancies, and Commercial Distribution
        blocks:
          - type: paragraph
            body: >-
              Flatpay's capitalization trajectory is among the fastest recorded for European payment ventures. The
              company completed a €45M Series B funding round in April 2024 led by Dawn Capital alongside Seed Capital
              and angel investors including Mario Götze, subsequent to earlier seed financing. In late 2025, Flatpay
              achieved unicorn status after securing a €145M Series C round at a pre-money valuation of €1.5B (USD
              1.75B), with follow-on reporting in growth publications recording transaction volumes up to €161.5M
              including backing from AVP, Smash Capital, and Hedosophia. Operating scale expanded from 7,000 active
              daily merchants in April 2024 to 60,000 by late 2025, reaching 100,000 active merchants by mid-2026 and
              marketing claims of 125,000 merchants and 2,000 staff by late 2026. Management disclosed crossing €100M in
              annual recurring revenue in late 2025 with an annualized processing volume run-rate of €20B, targeting
              300% ARR growth toward €400M–€500M in 2026 and 1 million merchants by 2029. However, distribution is
              driven almost exclusively by intensive door-to-door field sales reps requiring quotas of 20 deals per
              month, paired with a controversial consumer surcharging mechanism on international and corporate payment
              cards.
            claimRefs:
              - CO005
              - CO006
              - CO009
              - CO012
              - CO013
              - CO014
              - CO015
