              - CP005
              - CP007
      - number: '3.3'
        title: Distribution power, switching friction, and strategic direction
        blocks:
          - type: paragraph
            body: >-
              Flatpay's field-led onboarding creates both a distribution asset and a scaling constraint. On-site
              installation, training, and round-the-clock support can deepen the merchant relationship, but the lack of
              self-serve signup adds friction relative to plug-and-play competitors. An assigned company job repost
              shows Flatpay developing an SME banking product and customer-facing app, and an older secondary article
              describes ambitions in ecommerce and expense management. Those moves could increase product breadth and
              switching costs, yet they also move Flatpay toward SumUp's established bundle. A Danish trade article's
              report of 35 marketing employees across seven markets indicates meaningful go-to-market investment, but it
              does not establish acquisition efficiency or channel defensibility.
            claimRefs:
              - CP002
              - CP008
              - CP009
              - CP011
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The evidence does not establish a durable technology or cost moat. Flat pricing is valuable to merchants,
              but SumUp can price below Flatpay's reported terminal rate for sufficient domestic card volume, and
              high-volume merchants may negotiate cheaper interchange-plus economics elsewhere. Flatpay's defensibility
              therefore appears to depend on local sales execution, service quality, retention, cross-sell, and the
              successful rollout of financial products. The official legal hub says terms vary by market but does not
              expose a complete entity-by-entity licensing and acquiring-partner map in the fetched page. Underwriting
              should require cohort win-loss data, realized pricing, churn after repricing, service-cost data, and a
              jurisdiction-level regulatory map before assigning material value to the claimed moat.
            claimRefs:
              - CP007
              - CP012
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Service differentiation is not yet a proven moat
            body: >-
              Flatpay's installation and support model may improve conversion and retention, but the public evidence
              does not quantify win rates, churn, service cost, or merchant lifetime value against broader incumbents.
            calloutType: risk
            claimRefs:
              - CP002
              - CP014
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Architecture
        blocks:
          - type: paragraph
            body: >-
              Flatpay operates an integrated payment facilitation and card acquiring model tailored specifically for
              small and medium-sized physical enterprises (SMEs) across European retail and hospitality sectors. The
              company's core commercial pitch is rooted in extreme pricing simplicity, offering a flat headline
              processing fee of 0.99% for card terminal transactions and 1.49% for integrated point-of-sale (POS)
              purchases, with zero monthly recurring software subscription charges. Unlike traditional bank acquirers
              and legacy processors that levy complex interchange-plus markups, minimum monthly billing thresholds, PCI
              compliance penalties, and statement generation fees, Flatpay guarantees transparent flat-rate billing and
              daily settlement payouts. To protect unit profitability against low-volume merchant terminal abandonment,
              Flatpay enforces a strict merchant underwriting threshold requiring at least €100,000 in annual card
              processing volume while systematically rejecting multi-location franchises and enterprise retail chains.
              Additionally, Flatpay utilizes an innovative card-surcharge mechanism to pass through international and
              commercial card costs directly to cardholders rather than absorbing cross-border interchange markups.
              Customer referral and acquisition is further augmented by a structured partner program that compensates
              qualified affiliate agencies on a cost-per-lead and cost-per-meeting basis via PartnerStack.
            claimRefs:
              - CI003
              - CI004
              - CI006
              - CI014
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI014
          - type: figure
            figureRef: FI001
            claimRefs:
