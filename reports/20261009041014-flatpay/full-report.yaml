  - id: FI001
    title: Flatpay Revenue and Gross Profit Conversion Waterfall
    type: waterfall
    summary: >-
      Illustrative waterfall model demonstrating how €100m in annualized gross processing revenue converts through
      interchange rail costs, direct sales overhead, and terminal capex into projected operating deficits.
    data:
      items:
        - label: Gross Merchant Processing Revenue
