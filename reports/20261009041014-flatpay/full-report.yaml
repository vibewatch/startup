chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Product Architecture, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Flatpay was founded in 2022 in Copenhagen, Denmark, by digital entrepreneurs and payment executives
              seeking to disrupt European merchant services. The company provides a full-service acquiring and
              point-of-sale (POS) platform specifically targeted at small and medium-sized enterprises (SMEs) that have
              traditionally faced opaque interchange-plus pricing and variable processing fees from legacy banks and
              merchant acquirers. Flatpay packages payment terminals, mobile POS (mPOS), and all-in-one POS counter
              software with a transparent flat-rate transaction fee, eliminating terminal setup charges, subscription
              fees, and hidden gateway add-ons. Its offering includes 24/7 technical support, on-site hardware and
              software installation by field technicians, daily payment settlements, and automated bookkeeping
              integrations that sync daily Z-reports directly into accounting systems. Operating across seven core
              European markets—Denmark, Finland, Germany, France, Italy, the Netherlands, and the United Kingdom—Flatpay
              positions itself as an operational hub for independent merchants, expanding beyond physical terminals into
              online payment acceptance.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO005
