      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and In-Person Adoption Workflows
        blocks:
          - type: paragraph
            body: >-
              Buyer behavior across the SMB merchant spectrum differs fundamentally from corporate IT procurement,
              driven by owner-operator dynamics and intense operational time constraints. Across Flatpay's target
              merchant base, the primary economic buyer is almost universally the business owner-operator, managing
              partner, or primary retail franchisee. Unlike corporate procurement environments governed by formal
              competitive requests for proposals (RFPs) and multi-stakeholder IT evaluation committees, SMB
              decision-makers operate with compressed evaluation horizons, managing shopkeeping, inventory
              replenishment, and customer service simultaneously. Consequently, inbound digital self-service funnels
              frequently fail to convert busy brick-and-mortar shopkeepers, who lack the administrative bandwidth or
              technical inclination to compare complex acquiring rate schedules online or configure wireless POS
              hardware unassisted. Flatpay resolves this structural adoption barrier through a proactive direct
              distribution model: sales representatives physically visit merchants with demonstration suitcases, conduct
              immediate side-by-side terminal demonstrations, present simplified cost comparison analyses with pen and
              paper, and complete on-site hardware installation immediately upon agreement. The merchant budget owner
              funds transaction costs directly from daily operational gross margins rather than a discretionary software
              budget, rendering Flatpay's value proposition—transparent flat-rate processing, zero monthly subscription
              fees, zero hardware purchase capital outlays, daily fund settlements, and round-the-clock technical
              support—compelling and accessible. Contractual terms are governed by standardized regional service
              agreements, establishing direct card acquiring terms while avoiding multi-year lock-in fees that
              traditionally discourage small business owners from abandoning incumbent banking arrangements.
            claimRefs:
              - CM001
              - CM004
              - CM006
              - CM007
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM004
              - CM006
              - CM007
              - CM012
              - CM013
      - number: '2.4'
        title: Structural Growth Drivers, Regulatory Mandates, and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The adoption of modernized SMB payment solutions across Europe is propelled by powerful structural
              tailwinds, yet tempered by persistent operational, competitive, and regulatory frictions. A paramount
              secular driver is the ongoing decline of cash payments at the physical point of sale across the European
              Union. Central banking and European Union transaction data document that cash's share of POS transaction
              counts dropped precipitously from 72% in 2016 and 78% in earlier monitoring periods down to 50% in 2022
              and further into the low 40% range by 2024–2026, with Nordic economies and the Netherlands seeing cash
              transactions plummet below 25%. This rapid consumer migration toward contactless debit cards, credit
              cards, and mobile smartphone wallets forces even micro-retailers to maintain robust electronic payment
              terminals to avoid losing walk-in commercial trade. Furthermore, merchant discount rate (MDR) compression
              and regulatory fee caps have eroded standalone payment processing margins, forcing providers to bundle
              value-added software, business accounts, and embedded financial services. However, material constraints
              govern market velocity. Incumbent commercial banks and established payment champions such as Nexi,
              Worldline, and Barclays hold entrenched commercial relationships and long-term banking deposits,
              frequently capturing over 80% market share in core southern and western European territories.
              Additionally, customer acquisition costs in a direct field-sales model remain substantially elevated
              relative to digital marketing, necessitating disciplined quota enforcement—such as requiring sales
              representatives to generate 20 merchant deals monthly—to maintain capital efficiency and sustain a
              10-to-12-month customer payback period. Finally, varying national fiscalization mandates, certified
              receipt regulations, and cross-border interchange rules require localized product adaptations that prevent
              seamless pan-European deployment without dedicated in-country operational infrastructure.
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM009
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Direct Field Distribution Overcomes the SMB Inertia Dilemma
            body: >-
              The central bottleneck in European small merchant acquiring has never been product availability, but
              merchant adoption inertia. Small shopkeepers and restaurateurs rarely dedicate personal time to
              researching card terminal providers online. By deploying in-person sales representatives carrying
              demonstration hardware kits directly into merchant premises, Flatpay converts an otherwise friction-laden
              procurement evaluation into an immediate on-site trial, circumventing digital acquisition fatigue.
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
              - CM012
              - CM013
          - type: callout
            title: Bank Entrenchment and High Field CAC Bound Market Penetration
            body: >-
              While the addressable European SMB merchant pool exceeds 2.8 million establishments across Flatpay's seven
              operating markets, incumbent commercial banks control upwards of 80% of local acquiring relationships.
              Winning merchants away from established bank bundles requires maintaining high-touch door-to-door sales
              forces. If sales representative deal velocity falls below target quotas, customer acquisition payback
              periods will lengthen rapidly, capping sustainable market penetration.
            calloutType: risk
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Flatpay competes most directly with European SMB payment specialists such as SumUp and Zettle, while
              Stripe Terminal is an adjacent developer-led alternative and Adyen is an enterprise-oriented incumbent.
              Traditional acquirers remain the status quo for merchants willing to accept variable fee structures or
              negotiate interchange-plus pricing, and merchants with technical resources can assemble payments,
              software, and hardware from multiple vendors. Flatpay's third-party review evidence says it serves more
              than 70,000 merchants across seven European markets, whereas the comparison source describes SumUp as a
              much larger and older platform. The result is a crowded landscape in which Flatpay is differentiated by
              operating model and merchant experience, not by owning an uncontested category.
            claimRefs:
              - CP003
              - CP006
              - CP010
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
