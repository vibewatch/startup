        - label: Interchange & Network Rail Fees
          value: -42
          unit: EUR M
          detail: Estimated payment scheme fees, interchange, and acquiring costs paid to card networks and banking partners.
        - label: Net Acquired Processing Revenue
          value: 58
          unit: EUR M
          detail: Estimated retained gross payment margin before hardware depreciation and operating costs.
        - label: Field Sales & Personnel Expenses
          value: -69
          unit: EUR M
          detail: Direct sales and staff costs based on 2025 audited staff costs (€69m) and rapid expansion to 2,000 FTEs.
        - label: Terminal Equipment Capex Amortization
          value: -26
          unit: EUR M
          detail: Amortization and carrying costs for €40m of deployed PAX A920 hardware and merchant setups.
        - label: Other Operational Overhead
          value: -33
          unit: EUR M
