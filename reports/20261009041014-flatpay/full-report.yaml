      - number: '4.2'
        title: Commercial Traction and Geographic Revenue Mix
        blocks:
          - type: paragraph
            body: >-
              Flatpay's aggressive market expansion across Northern and Western Europe delivered extraordinary top-line
              expansion between 2024 and 2026. According to audited annual accounts for fiscal year 2025, group revenues
              more than tripled year-over-year from approximately €11 million to €39 million as international rollouts
              in Germany, Finland, and Italy began contributing meaningful processing volume. Momentum continued into
              2026, with company disclosures indicating that annualized revenue reached €100 million by June 2026 on an
              annualized card processing volume run rate of €20 billion across more than 100,000 active SME merchants.
              Germany has rapidly emerged as Flatpay's largest geographic market, generating €15 million in 2025
              revenue, followed by Finland with €6 million and Italy with €4 million, while initial entry into France
              and Great Britain got underway during 2026. The merchant onboarding engine has maintained a reported
              monthly growth trajectory of approximately 7%, adding roughly 5,000 new SME accounts per month. However,
              public disclosure does not break down revenue mix between card processing spread, software interchange
              margin, and peripheral merchant fees, leaving the durability of net acquired take rates unverified.
            claimRefs:
              - CI001
              - CI002
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI013
              - CI014
      - number: '4.3'
        title: Cost Structure, Headcount Inflation, and Hardware Capex
        blocks:
          - type: paragraph
            body: >-
              Underpinning Flatpay's rapid top-line scaling is an exceptionally capital-intensive operational apparatus
              characterized by explosive headcount growth and heavy balance-sheet hardware outlays. Operating losses
              surged dramatically from €20 million in 2024 to €70 million in 2025, almost entirely driven by an
              unprecedented surge in personnel expenses. Group staff costs increased by €49 million during the year to
              reach €69 million, mirroring average full-time equivalent (FTE) headcount jumping from 257 in 2024 to 957
              in 2025. Continued recruitment to fuel in-person sales rollouts expanded total workforce headcount to
              roughly 2,000 employees by mid-2026. Because Flatpay standardizes on deploying Android-based PAX A920
              smart payment terminals directly to merchant premises with zero upfront hardware charge, device
              procurement creates substantial working capital and fixed asset commitments. At year-end 2025, Flatpay
              held €40 million of payment equipment on its balance sheet, including €14 million prepaid for future
              device deliveries. This capital-intensive deployment model requires sustained merchant retention to recoup
              upfront device manufacturing, shipping, and direct on-site technician installation expenses.
            claimRefs:
              - CI007
              - CI008
              - CI013
              - CI014
      - number: '4.4'
        title: Cash Burn, Capital Adequacy, and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              The pace of physical sales deployment and international market entry generated startling cash burn during
              fiscal year 2025, resulting in negative free cash outflow before financing of €94 million. Flatpay
              cushioned this severe operational deficit by raising €146 million in fresh equity financing during late
              2025 at an official post-money valuation of €1.5 billion, which conferred unicorn status and supplemented
              earlier Series B financing of €45 million led by Dawn Capital and Seed Capital. In addition to equity
              capital, Flatpay secured a €24 million loan facility from Denmark's Export and Investment Fund (EIFO) to
              finance equipment and international receivables. Despite these liquidity injections, forward guidance
              highlights ongoing dependency on external capital. Management projects that full-year 2026 revenue will
              reach €100 million to €105 million while annual operating losses will balloon further to €140 million to
              €150 million as the business finances aggressive sales teams in France and the UK. With secondary
              transactions and private deal trackers pricing Flatpay at approximately $1.7 billion as of September 2026,
              the company will require substantial ongoing funding or rapid unit-level margin stabilization to reach
              operating cash flow breakeven.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI015
      - number: '4.5'
        title: Financial Verdict and Key Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Flatpay represents a high-velocity, high-capital-intensity growth experiment in European payment
              acquiring. While its top-line trajectory from founding in 2022 to €100 million annualized revenue run rate
              in 2026 demonstrates clear merchant appetite for transparent flat-rate processing, its underlying
              economics remain unproven for growth equity underwriting. Crucially, Flatpay has not published its
              realized gross margin after payment scheme assessment fees, card network interchange, and acquirer
              processing costs. A flat list fee of 0.99% leaves very narrow net margin spread after interchange on
              domestic debit transactions and risks negative net revenue on non-surcharged commercial cards.
              Furthermore, Flatpay's exclusive reliance on dedicated in-house direct field sales teams—eschewing digital
              self-service onboarding or third-party reseller channels—imposes severe fixed operating expenditure that
              balloons alongside geographic expansion. Prospective investors must treat historical cash burn and
              terminal asset depreciation as critical underwriting risks. Formal diligence requires audited merchant
              cohort retention tables, customer acquisition cost payback schedules, realized gross take rate waterfalls
              across payment rails, and terminal recovery loss rates upon merchant contract termination.
            claimRefs:
              - CI003
              - CI005
              - CI007
              - CI010
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI007
              - CI013
      - number: '4.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Ballooning Operating Losses and Severe Cash Outflow
            body: >-
              Flatpay's audited 2025 accounts reveal €70m in operating losses and €94m in negative free cash outflow,
              with management projecting 2026 losses to widen further to €140–150m. While supported by €146m in 2025
              equity funding and a €24m state debt facility, the company faces persistent financing dependency unless
              gross margins and sales payback rapidly improve.
            calloutType: risk
            claimRefs:
              - CI007
              - CI009
              - CI010
              - CI011
          - type: callout
            title: The Fixed-Cost Burden of Direct Field Sales and Terminal Hardware
            body: >-
              Flatpay's refusal to use digital acquisition channels or third-party sales agents concentrates risk in
              direct field personnel and capitalized hardware. With staff costs reaching €69m and terminal equipment
              assets totaling €40m, merchant unit retention and volume floor enforcement are essential to avoid
              catastrophic capital erosion.
            calloutType: insight
            claimRefs:
              - CI004
              - CI005
              - CI008
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Merchant Workflow and Product Offerings
        blocks:
          - type: paragraph
            body: >-
              Flatpay packages in-person card payments and merchant management software into three primary hardware and
              software tiers: standalone payment terminals, mobile POS (mPOS), and full point-of-sale setups. Rather
              than positioning itself as a developer-oriented gateway, the company targets physical storefront merchants
              such as restaurants, cafes, florists, hair salons, and retail shops processing over €100,000 annually. For
              these merchants, the POS functions as the operational core of the business, unifying product catalogues,
              modifiers, table management, order taking, barcode scanning, kitchen and receipt printing, and daily cash
              reconciliation into a single interface. Daily payouts and round-the-clock live support serve as key
              retention drivers for non-technical retail operators who cannot tolerate payment terminal downtime.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE007
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE008
              - CE010
      - number: '5.2'
        title: System Architecture and Technology Stack
        blocks:
          - type: paragraph
            body: >-
              Underneath its merchant-facing applications, Flatpay operates a distributed backend built primarily on
              Java and Spring Boot, utilizing MySQL and Flyway for transactional relational persistence and AWS SQS for
              asynchronous event decoupling. Services run containerized within Docker on AWS ECS, provisioned via
              Terraform and structured following Domain-Driven Design (DDD) and ports-and-adapters architecture. To
              handle in-store environments across multi-terminal merchant locations, the platform coordinates local
              hardware peripherals and synchronizes state across shared POS devices in real time. Rather than bearing
              the massive regulatory capital and licensing overhead of operating as a full banking institution or
              building card schemes from scratch, Flatpay outsources underlying payment acquiring and international
              licensing to Adyen, enabling high authorization rates while maintaining its proprietary application layer.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
              - CE007
              - CE009
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE006
              - CE007
              - CE009
      - number: '5.3'
        title: Deployment Motion, Regulatory Compliance, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              Flatpay’s deployment and go-to-market motion is tightly coupled with in-person field visits: sales teams
              meet merchants on-site, conduct hardware and software installation, and configure local network
              peripherals. This direct hands-on setup lowers setup friction for retail staff but limits self-service
              velocity. Technical risks stem from high third-party dependency on upstream financial infrastructure
              partners, regional fiscalization requirements, and the absence of a public developer API. Because each
              European market enforces distinct tax compliance rules, such as certified cash register logging and
              governmental sales reporting, Flatpay must continuously engineer localized fiscal modules. Furthermore,
              external platform integrations rely on third-party gateways like Frisbii rather than an open developer
              portal, creating potential integration friction for complex multi-channel merchants.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Infrastructure Outsourcing as a Scalability Lever
            body: >-
              Flatpay's decision to leverage Adyen for core European card acquiring and licensing decouples geographical
              expansion from financial licensing overhead. This allows engineering resources to focus entirely on
              merchant-facing POS workflows, order management, and localized fiscal compliance across its seven European
              markets.
            calloutType: insight
            claimRefs:
              - CE008
              - CE009
          - type: callout
            title: Developer Extensibility and Custom Integration Bottleneck
            body: >-
              The lack of an open, self-service developer API portal restricts Flatpay's addressable market primarily to
              standard retail and hospitality setups. Merchants requiring custom enterprise ERP or specialized
              e-commerce integrations must rely on third-party bridge gateways like Frisbii, capping technical
              flexibility.
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and operating jobs
        blocks:
          - type: paragraph
            body: >-
              Flatpay's stated customer is the small or medium-sized physical merchant: the owner or operator buys the
              service, front-line staff use the terminal or point-of-sale workflow, and the merchant bears
              payment-acceptance costs. Flatpay's US landing page presents payment terminal, mPOS, and point of sale as
              three solutions and names merchant categories including bars, florists, markets, coffee shops, butchers,
              and fast-casual restaurants. Independent coverage likewise describes the company as serving small
              merchants or small and medium-sized businesses. The evidence therefore supports a broad in-person SMB
              segmentation, but not segment-level account counts, payment volume, revenue, retention, or profitability.
              Seven-market operating references show geographic breadth, while the source pool does not permit a
              reliable allocation of merchants or economics by country or vertical.
            claimRefs:
              - CU001
              - CU002
              - CU011
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU011
      - number: '6.2'
        title: Adoption trajectory is strong but not cohort evidence
        blocks:
          - type: paragraph
            body: >-
              The retained record shows a steep directional increase in adoption. A partnership profile reported more
              than 2,500 customers after Flatpay began scaling in late 2022. A later newsletter described about 60,000
              customers, up from 7,000 in April 2024, while a dated June 2026 industry commentary reported 100,000
              merchants across seven markets and EUR20 billion of annual processing volume on a run-rate basis. These
              are not a clean time series: the publications use both customers and merchants, one snapshot lacks a
              publication date in the fetched text, and none discloses measurement rules, active-status criteria, or
              cohort denominators. Processing volume is also not revenue or ARR. The evidence supports scale and growth,
              but not precise acquisition velocity, utilization, or durable recurring economics.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
      - number: '6.3'
        title: Named proof and retention remain the central evidence gap
        blocks:
          - type: paragraph
            body: >-
              Public customer proof is substantially weaker than the aggregate adoption narrative. Flatpay's landing
              page lists merchant categories and says its merchants include stories it is proud of, but the fetched page
              does not identify a merchant, deployment date, production status, or quantified outcome. The independent
              items in the assigned pool report company-wide customer or merchant counts rather than customer-authored
              results. No retained source supplies gross or net revenue retention, logo churn, renewals, contract
              duration, cohort behavior, customer satisfaction, or segment concentration. This is absence from the
              reviewed public evidence, not proof that the company lacks references or strong retention. Investment
              diligence should therefore treat named production references and invoice-level cohorts as private-evidence
              requests rather than infer durability from logo categories or aggregate growth.
            claimRefs:
              - CU002
              - CU014
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU014
      - number: '6.4'
        title: Expansion loop, dependencies, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Flatpay's acquisition loop is unusually operational. Industry commentary says the founders adapted an
              alarm-industry field-sales model, use field sales as the sole distribution model, and expect
              representatives to produce about 20 deals per month. The official onboarding path then moves from an
              in-person meeting to solution selection and on-site installation, followed by daily payouts and 24/7
              support. This can reduce adoption friction for merchants that value hands-on service, but it also makes
              sales productivity, installation cost, and local staffing central to expansion economics. The early Finaro
              relationship supplied white-label acquiring capability, and Flatpay's legal page says terms vary by
              market. A separate industry source reports that competitors view the surcharge-funded offer as
              controversial and replicable. Public evidence does not quantify customer, channel, or acquirer
              concentration, so those exposures remain open rather than benign.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU012
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU007
              - CU008
              - CU009
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Rapid directional merchant adoption
            body: >-
              Multiple snapshots rise from more than 2,500 customers after launch to a reported 100,000 merchants by
              June 2026, although definitions are not standardized.
            calloutType: strength
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
          - type: callout
            title: Growth is not retention proof
            body: >-
              The retained public record lacks named customer outcomes, cohort retention, churn, renewals, contract
              length, and concentration data.
            calloutType: risk
            claimRefs:
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk Architecture
        blocks:
          - type: paragraph
            body: >-
              Flatpay operates structurally as an unregulated commercial distributor and software provider rather than a
              fully licensed payment institution or card acquirer. As set out in its standard UK merchant terms, Flatpay
              explicitly does not process card transactions itself, delegating all acquiring operations to external
              licensed card processors under a mandated power of attorney granted by the merchant. This agency
              architecture isolates Flatpay from direct prudential banking capital requirements but introduces acute
              legal vulnerabilities across its operating territories. Under clause 7 of its March 2026 terms, Flatpay
              facilitates merchant surcharging on corporate and international cards by transmitting Bank Identification
              Number lists directly to card terminals, a mechanism highlighted by industry observers as a central yet
              controversial driver of Flatpay's commercial adoption. Because consumer protection and payment service
              regulations across the UK and the European Union restrict payment surcharges to direct underlying costs,
              any regulatory investigation or card network crackdown by Visa or Mastercard on automated terminal
              surcharging creates direct regulatory liability. Furthermore, under clause 22, card network dispute fines
              and chargeback penalties are passed through to merchants alongside an aggressive 25% administrative fee
              markup, exposing Flatpay to merchant litigation and regulatory scrutiny regarding unfair contract terms in
              commercial dealings.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR007
              - CR009
              - CR011
              - CR014
      - number: '7.2'
        title: Partner Concentration and Hardware Financing Dependencies
        blocks:
          - type: paragraph
            body: >-
              Flatpay's business model relies on a multi-tiered dependency chain spanning third-party equipment lessors,
              terminal hardware manufacturers, and upstream card acquirers. Point-of-sale terminals and accessories
              deployed to merchants free of charge are frequently not owned by Flatpay but leased through third-party
              financing institutions, specifically Nordania Leasing (a division of Danske Bank A/S) or other designated
              financing companies. Clause 4.1 of Flatpay's merchant contract stipulates that if the underlying leasing
              agreement between Flatpay and the financing company terminates, the third-party financing company may
              demand termination of the merchant loan agreements, empowering Flatpay to cancel customer agreements
              immediately without compensation. On the acquiring layer, Flatpay retains unilateral authority to
              substitute card acquirers while merchant agreements terminate automatically with immediate effect if an
              acquirer severs its relationship with Flatpay or the merchant. Hardware supply is concentrated in Android
              terminals manufactured by PAX Technology (specifically the PAX A920 Pro), creating single-vendor supply
              chain and firmware vulnerability. The entire merchant relationship is further enforced via non-cancellable
              36-month lock-in periods with GBP 39 monthly liquidated damages per solution if monthly transaction
              turnover fails to meet GBP 1,100, a rigid structure that elevates partner counterparty risk and merchant
              churn upon contract expiration.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR010
              - CR012
      - number: '7.3'
        title: Operational, Quality, and Financial Model Risks
        blocks:
          - type: paragraph
            body: >-
              Flatpay's aggressive hyper-growth strategy—expanding across seven European markets including Denmark,
              Finland, Germany, and Italy while scaling headcount past 2,000 personnel—strains execution quality and
              operational controls. Direct field sales reps face demanding quotas of 20 deals per month with rapid
              termination for underperformance, generating organizational churn and potential mis-selling risks at the
              merchant point of sale. Operationally, Flatpay legally disclaims virtually all operational liability:
              under clause 13.2.1 of its merchant terms, software and hardware are provided 'as-is', and Flatpay
              disclaims liability for lost merchant profits resulting from terminal inoperability, gateway defects, or
              telecommunications outages. In outdoor market scenarios, local terminal caching is limited to 500
              transactions on PAX A920 Pro devices, forcing merchants to balance offline business continuity against
              unmitigated fraud exposure. Financially, Flatpay monetizes via fixed interchange-inclusive flat rates
              (0.99% for terminals and 1.49% for POS systems in-person), leaving its gross margin vulnerable to card
              interchange rate adjustments, unfavorable card brand mix shifts, and marketing overhead across
              international markets.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR009
              - CR011
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural Acquiring and Financing Decoupling
            body: >-
              Flatpay's business model relies on two fundamental third-party delegations: acquiring transaction
              settlement is provided exclusively by partner acquirers, while payment hardware is leased from commercial
              finance institutions like Nordania Leasing. If either layer fractures, Flatpay's contracts empower
              unilateral termination without customer compensation, exposing merchants to sudden service halts.
            calloutType: risk
            claimRefs:
              - CR002
              - CR006
              - CR007
          - type: callout
            title: The Surcharging Regulatory Fragility
            body: >-
              Industry analysts observe that Flatpay's ability to offer zero-fee processing on international and
              business cards rests on shifting card fees onto consumers via terminal-level BIN surcharges. Because
              surcharging is heavily restricted across European jurisdictions to strictly documented incremental cost,
              any regulatory tightening poses a direct threat to Flatpay's core merchant acquisition pitch.
            calloutType: insight
            claimRefs:
              - CR001
              - CR003
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing Context, Entry Valuation, and Underwriting Stance
        blocks:
          - type: paragraph
            body: >
              Flatpay concluded a prominent €145M ($169M–$170M) Series C financing round in November 2025 led by AVP and
              Smash Capital alongside Dawn Capital and Seed Capital, which elevated the Danish merchant payments
              platform to a post-money valuation of €1.5B ($1.75B). This milestone established the company as Denmark's
              fastest unicorn within three years of its 2022 founding. While CEO and co-founder Sander Janca-Jensen
              publicized that Flatpay surpassed €100M ($116M) in annualized recurring revenue in October 2025 with
              ambitions to reach €400M–€500M by year-end 2026, external third-party platforms such as GetLatka
              independently estimate 2025 annual revenue at approximately $127M.


              The core investment thesis rests on Flatpay's direct, in-person field acquisition machine, where sales
              teams visit small and medium-sized merchants door-to-door with terminal hardware kits, cutting out
              intermediary distributor commissions and displacing fragmented legacy bank processors. However,
              underwriting the €1.5B valuation requires intense scrutiny. Flatpay remains operating at an accounting
              loss while sustaining 1,400 to 1,500 employees, creating elevated cash burn that demands rapid customer
              addition across its six to seven European operating jurisdictions. Given the absence of audited cohort
              retention, net revenue retention metrics, and statutory consolidated financial filings, the risk rating is
              classified as high and the valuation stance is considered stretched.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV007
              - CV008
              - CV011
              - CV014
      - number: '8.2'
        title: Structural Thesis vs. Anti-Thesis and Surcharging Exposure
        blocks:
          - type: paragraph
            body: >
              A balanced assessment of Flatpay's commercial engine requires weighing its direct distribution velocity
              against severe regulatory and business model vulnerabilities. Proponents highlight Flatpay's predictable
              flat-rate payment pricing and rapid SME onboarding across major European retail sectors, including dining,
              florists, and bakeries. The operational velocity demonstrated in Germany—its largest geographic market
              with 540 employees and over 20,000 active merchants—shows strong initial merchant adoption of its combined
              POS software and payment terminal bundle.


              Conversely, the critical anti-thesis identifies Flatpay's controversial practice of offering zero-cost
              payment processing to merchants on business and international credit cards by passing substantial
              surcharges onto end consumers. Payments industry analysts note that this mechanism is the central catalyst
              for merchant adoption rather than superior proprietary software. This practice introduces critical legal
              and regulatory risks across European jurisdictions governed by strict interchange fee caps and consumer
              surcharging restrictions. If card schemes or national consumer authorities restrict surcharge
              pass-through, Flatpay would face immediate merchant churn or severe transaction margin compression.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: Scenario Underwriting, Downside Triggers, and Diligence Asks
        blocks:
          - type: paragraph
            body: >
              Evaluating Flatpay's risk-reward profile over a multi-year horizon requires testing explicit bull, base,
              and bear scenarios against multiple compression and field expansion execution risks. Under a bull
              scenario, Flatpay successfully scales its field sales force, enters new European markets such as the
              Netherlands, and achieves €450M in ARR by late 2027, validating a €2.7B valuation at a normalized 6.0x
              revenue multiple. In the base scenario, expansion friction and rising sales representative turnover dampen
              growth toward €220M ARR, compressing the multiple to 5.0x and delivering an implied valuation of €1.1B,
              beneath the Series C valuation mark.


              The bear case models regulatory crackdowns on consumer surcharging alongside competitive retaliation from
              incumbents like SumUp, Nexi, and Adyen. Under such circumstances, merchant churn accelerates, net
              processing revenue compresses, and ARR stagnates near €130M, driving a severe down-round valuation of
              €520M (4.0x multiple). Before considering any direct equity co-investment or secondary liquidity,
              diligence must verify statutory 2025 audited financial statements, examine interchange margin contracts,
              inspect field sales representative unit economics, and confirm compliance with EU cross-border surcharging
              directives.
            claimRefs:
              - CV004
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV007
              - CV011
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Disciplined Underwriting: Maintain Track Recommendation'
            body: >-
              Although Flatpay has executed an impressive top-line land grab across Northern and Central Europe, the
              €1.5B post-money valuation prices in perfection while masking regulatory vulnerabilities around consumer
              card surcharging and sustained operating losses. Investors should monitor audited financial statements and
              cohort retention trends before committing growth capital.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV007
              - CV011
              - CV014
