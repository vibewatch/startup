      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Direct Field Sales Overhead and Merchant Churn Sensitivity
            body: >-
              Flatpay's hyper-growth relies on an intensive direct sales force of over 2,000 employees conducting
              in-person merchant visits. Sales representatives face strict quotas of 20 closed deals per month and rapid
              dismissal for underperformance. This aggressive model carries high fixed customer acquisition overhead and
              heightened operational vulnerability to SME merchant business failure rates across European retail and
              hospitality sectors.
            calloutType: risk
            claimRefs:
              - CO009
              - CO014
          - type: callout
            title: Unit Economics Shielded by Consumer Card Surcharging
            body: >-
              Industry analysis reveals that Flatpay's ability to offer zero subscription fees and low flat transaction
              rates to merchants is heavily subsidised by offering free processing on corporate and international cards
              funded via consumer surcharges. While compelling to SME business owners, this practice invites regulatory
              scrutiny under European payment services rules and merchant trade resistance if acquiring interchange
              dynamics shift.
            calloutType: insight
            claimRefs:
              - CO009
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundaries, Included Spend, Adjacencies, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The addressable market for Flatpay is defined by point-of-sale (POS) card payment acceptance, hardware
              terminals, and integrated commercial workflow software for European small and medium-sized enterprises
              (SMBs). Operating across European commercial hubs including Denmark, Finland, Germany, France, Italy, the
              Netherlands, and the United Kingdom, the target perimeter encompasses brick-and-mortar retailers,
              independent food and beverage venues, quick-service eateries, butchers, bakeries, salons, and personal
              care establishments. In these sectors, face-to-face debit and credit card processing forms the critical
              operational lifeline for merchant revenue collection. Included spend comprises merchant discount rates
              (MDR), transaction processing fees, POS terminal hardware purchases or subsidized leases, basic inventory
              control tools, tipping administration, receipt generation, and real-time transaction reconciliation
              dashboards. Crucially, the target market explicitly excludes enterprise-grade omnichannel orchestration,
              complex multi-lane tier-one supermarket architectures, high-volume airline and travel reservation engines,
              cross-border multi-currency foreign exchange gateways, and sophisticated multi-tier inventory optimization
              systems tailored for multinational retail brands. Adjacencies to this core perimeter include e-commerce
              merchant acquiring, merchant cash advances, business banking debit cards, and automated tax accounting
              integrations. The status-quo substitute for Flatpay's integrated solution remains entrenched legacy
              commercial bank acquiring agreements—often characterized by multi-tiered interchange-plus pricing
              schedules, monthly recurring terminal rental fees, compliance penalties, and opaque billing statements.
              Alternatively, micro-merchants rely on self-onboarded mobile dongles with high variable take rates, while
              un-digitized operators continue to conduct cash transactions despite persistent regulatory discouragement
              and declining cash usage across the European Union.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Addressable Market Sizing, Sizing Lenses, and Penetration Ceilings
        blocks:
          - type: paragraph
            body: >-
              Sizing the market for European SMB merchant payment services requires combining top-down macroeconomic
              enterprise statistics with bottom-up merchant transaction economics. Small and medium-sized enterprises
              account for approximately 99% of all European commercial enterprises, comprising an aggregate population
              of more than 25 million registered enterprises across the European Union and the United Kingdom. Within
              this vast macro environment, Flatpay defines its serviceable addressable audience through a highly
              disciplined transaction band: merchants generating between €60,000 and €7,000,000 in annual gross
              transaction volume (annual TPV). Merchants below €60,000 typically represent micro-enterprises or hobbyist
              sole proprietorships where low transaction velocity cannot absorb dedicated hardware installations or
              justify direct in-person field acquisition costs. Conversely, enterprises generating above €7,000,000
              possess procurement leverage to negotiate customized interchange-plus-plus processing schedules,
              multi-lane hardware tenders, and specialized enterprise software integrations that exceed Flatpay's
              standardized terminal and software bundle. In Flatpay's seven primary operational jurisdictions—Denmark,
              Finland, Germany, France, Italy, the Netherlands, and the United Kingdom—the addressable SMB merchant
              cohort is estimated at approximately 2.8 million to 3.5 million retail and hospitality establishments,
              representing an aggregate annual payment processing volume exceeding €350 billion. Assuming an average
              merchant discount take rate ranging between 1.0% and 1.2%, the implied serviceable revenue pool spans €3.5
              billion to €4.2 billion annually across these seven markets. Independent industry estimates from tech
              sector researchers such as GetLatka and mid-market growth trackers corroborate this massive revenue pool,
              projecting that leading challengers can capture triple-digit annual recurring revenue scale. However,
              penetration ceilings are tightly constrained by regional banking dominance, where incumbent banking
              conglomerates typically control over 80% of local acquiring relationships, leaving emerging non-bank
              challengers to compete aggressively for contested merchant accounts.
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM007
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
