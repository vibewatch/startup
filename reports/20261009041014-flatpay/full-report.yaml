      - number: '3.2'
        title: Pricing, packaging, and capability trade-offs
        blocks:
          - type: paragraph
            body: >-
              Flatpay's public proposition is easy to explain: one rate across card types, no hidden fees, and a
              technician-led installation. The assigned comparison evidence reports a 1.49% UK terminal rate and a 1.69%
              POS rate, while SumUp offers 1.69% pay-as-you-go or 0.99% plus GBP19 per month for qualifying domestic
              consumer-card volume. Those are list-price comparisons, not realized merchant economics, and neither
              source provides contract-level discounts, loss rates, chargeback experience, or effective blended take
              rates. SumUp's broader banking, invoicing, payment-link, online-store, booking, and loyalty tools create a
              bundling advantage. Conversely, Flatpay's hands-on deployment can reduce implementation burden for
              merchants without in-house technical staff.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP002
            claimRefs:
