        - Gross margin compression if corporate/international card share rises without surcharge
        - Unit economics and interchange gross margin breakdown by card tier and market
      - - High field sales rep churn and mis-selling risk
        - Strict performance quota of 20 deals/month and aggressive termination policy
        - High
        - High
