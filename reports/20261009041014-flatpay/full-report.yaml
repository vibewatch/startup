  - id: TR002
    title: Partner and dependency risk register
    columns:
      - Dependency Category
      - Counterparty / Partner
      - Functional Role
      - Concentration
      - Failure Scenario
      - Severity
      - Mitigation Strategy
      - Residual Risk
    rows:
      - - Third-party terminal financing
        - Nordania Leasing (Danske Bank A/S) / TPFCs
        - Financing and legal ownership of deployed POS terminal fleet
        - High concentration
        - Termination of master lease enables lessor to demand hardware recovery from merchants
        - Critical
        - Contractual termination without compensation; diversification across alternate TPFCs
        - Immediate fleet disruption and customer loss if master lease covenants breached
      - - Card payment acquiring
        - Designated external acquiring payment service providers
        - Transaction settlement, card scheme access, and merchant fund payouts
        - High concentration
        - Acquirer termination instantly halts merchant transaction processing
        - Critical
        - Power of attorney to substitute acquirers; multiple acquiring partnerships
        - Operational blackout and transition friction during unexpected acquirer offboarding
      - - Terminal hardware manufacturing
        - PAX Technology (PAX A920 Pro) / CPOS
        - Physical payment terminal and POS Android hardware supply
        - High concentration
        - Hardware supply chain interruption or firmware security vulnerabilities
        - High
        - Dual hardware options (PAX handheld vs CPOS X5 countertop terminal)
        - Inability to onboard field sales pipeline during hardware stockouts
      - - Mobile network connectivity
        - Telecom cellular providers / merchant Wi-Fi
        - Transaction data and communication routing for standalone terminals
        - Medium concentration
        - Cellular network outages or local Wi-Fi dead zones disrupting transactions
        - Medium
        - Bundled SIM subscription; local offline storage for up to 500 transactions
        - Offline storage ceiling triggers lost sales or unmitigated merchant fraud exposure
    notes: >-
      Primary counterparty dependencies mapped from March 2026 UK terms and conditions and public product architecture;
      ordered by severity.
    claimRefs:
      - CR006
      - CR007
      - CR008
      - CR010
