      An ordinal map separates Flatpay's service-heavy focus from broader self-serve platforms and negotiated incumbent
      alternatives.
    data:
      xAxis:
        label: 'Product breadth: focused to broad'
        min: 1
        max: 5
      yAxis:
        label: 'Deployment service: self-directed to hands-on'
        min: 1
        max: 5
