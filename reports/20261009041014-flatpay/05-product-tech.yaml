chapter:
  number: 5
  title: "Product & Technology"
  summary: "Flatpay delivers an integrated point-of-sale and card-acquiring platform designed to eliminate complex fee structures for European small and medium-sized physical businesses. Its technology pairs proprietary POS application software with standard payment hardware and outsourced financial infrastructure from partners including Adyen, trading custom processor margins for rapid geographic expansion."
sections:
  - id: "product-offering-workflow"
    title: "Merchant Workflow and Product Offerings"
    body: "Flatpay packages in-person card payments and merchant management software into three primary hardware and software tiers: standalone payment terminals, mobile POS (mPOS), and full point-of-sale setups. Rather than positioning itself as a developer-oriented gateway, the company targets physical storefront merchants such as restaurants, cafes, florists, hair salons, and retail shops processing over €100,000 annually. For these merchants, the POS functions as the operational core of the business, unifying product catalogues, modifiers, table management, order taking, barcode scanning, kitchen and receipt printing, and daily cash reconciliation into a single interface. Daily payouts and round-the-clock live support serve as key retention drivers for non-technical retail operators who cannot tolerate payment terminal downtime."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "architecture-operating-model"
    title: "System Architecture and Technology Stack"
    body: "Underneath its merchant-facing applications, Flatpay operates a distributed backend built primarily on Java and Spring Boot, utilizing MySQL and Flyway for transactional relational persistence and AWS SQS for asynchronous event decoupling. Services run containerized within Docker on AWS ECS, provisioned via Terraform and structured following Domain-Driven Design (DDD) and ports-and-adapters architecture. To handle in-store environments across multi-terminal merchant locations, the platform coordinates local hardware peripherals and synchronizes state across shared POS devices in real time. Rather than bearing the massive regulatory capital and licensing overhead of operating as a full banking institution or building card schemes from scratch, Flatpay outsources underlying payment acquiring and international licensing to Adyen, enabling high authorization rates while maintaining its proprietary application layer."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
    figureRefs:
      - "FE001"
    tableRefs:
      - "TE003"
  - id: "deployment-integration-risks"
    title: "Deployment Motion, Regulatory Compliance, and Technical Risks"
    body: "Flatpay’s deployment and go-to-market motion is tightly coupled with in-person field visits: sales teams meet merchants on-site, conduct hardware and software installation, and configure local network peripherals. This direct hands-on setup lowers setup friction for retail staff but limits self-service velocity. Technical risks stem from high third-party dependency on upstream financial infrastructure partners, regional fiscalization requirements, and the absence of a public developer API. Because each European market enforces distinct tax compliance rules, such as certified cash register logging and governmental sales reporting, Flatpay must continuously engineer localized fiscal modules. Furthermore, external platform integrations rely on third-party gateways like Frisbii rather than an open developer portal, creating potential integration friction for complex multi-channel merchants."
    claimRefs:
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
