callouts:
  - calloutType: "insight"
    title: "Infrastructure Outsourcing as a Scalability Lever"
    body: "Flatpay's decision to leverage Adyen for core European card acquiring and licensing decouples geographical expansion from financial licensing overhead. This allows engineering resources to focus entirely on merchant-facing POS workflows, order management, and localized fiscal compliance across its seven European markets."
    claimRefs:
      - "CE008"
      - "CE009"
  - calloutType: "risk"
    title: "Developer Extensibility and Custom Integration Bottleneck"
    body: "The lack of an open, self-service developer API portal restricts Flatpay's addressable market primarily to standard retail and hospitality setups. Merchants requiring custom enterprise ERP or specialized e-commerce integrations must rely on third-party bridge gateways like Frisbii, capping technical flexibility."
    claimRefs:
      - "CE012"
      - "CE013"
