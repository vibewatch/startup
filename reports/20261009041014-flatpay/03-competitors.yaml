      - ["On-site installation", "Included", "Self-install", "Unknown", "Unknown", "Medium"]
      - ["Business banking", "Product under development", "Available", "Unknown", "Unknown", "Medium"]
      - ["Invoicing and payment links", "Not offered in comparison source", "Available", "Unknown", "Unknown", "Medium"]
      - ["Online commerce", "Gateway and plugins reported", "Online store reported", "Online payments adjacency reported", "Unknown", "Medium"]
      - ["Hospitality workflow", "Table, split-bill, and kitchen features reported", "POS Plus capabilities reported", "Unknown", "Unknown", "Medium"]
      - ["Regulatory disclosure", "Complete market map not available in fetched hub", "UK FCA authorization reported by comparison source", "Unknown", "Unknown", "Low"]
    notes: "Cells reflect only the assigned fetched sources as of 2026-10-09; 'unknown' means the pool did not support a comparison, not that the capability is absent."
    claimRefs: [CP001, CP002, CP006, CP008, CP012]
  - id: TP003
    title: UK list-price and packaging comparison
    columns:
      - Offer
      - Published price or unit
      - Included capabilities
      - Discount or unknown
      - Competitive implication
    rows:
      - ["Flatpay Terminal", "1.49% per transaction", "Standalone terminal; on-site setup reported", "No monthly fee; realized rate unverified", "Lower headline PAYG rate than SumUp"]
      - ["Flatpay POS products", "1.69% per transaction", "POS software and hardware package", "Upfront hardware charges vary; realized rate unverified", "Matches SumUp PAYG rate before hardware"]
      - ["Flatpay custom", "Custom above GBP200,000 annual turnover", "Negotiated package", "Actual discount unavailable", "Creates uncertainty for larger merchants"]
      - ["SumUp pay-as-you-go", "1.69% per transaction", "Payments and free software entry points", "No monthly payment plan required", "Comparable to Flatpay POS pricing"]
      - ["SumUp Payments Plus", "0.99% plus GBP19 per month", "Lower domestic consumer-card rate", "Card mix and eligibility matter", "Can undercut Flatpay above the break-even volume"]
      - ["Negotiated interchange-plus", "No comparable public rate", "Traditional acquiring contract", "Depends on volume, card mix, and negotiation", "Potential displacement risk at high volume"]
    notes: "List prices are reported by May/August 2026 review sources and may change; they are not realized revenue, effective merchant cost, or a margin measure."
    claimRefs: [CP004, CP005, CP007]
figures:
  - id: FP001
    title: Competitive positioning on product breadth and service intensity
    type: quadrant
    summary: >-
      An ordinal map separates Flatpay's service-heavy focus from broader self-serve platforms and negotiated
      incumbent alternatives.
    data:
      xAxis:
        label: "Product breadth: focused to broad"
        min: 1
        max: 5
      yAxis:
        label: "Deployment service: self-directed to hands-on"
        min: 1
        max: 5
      points:
        - label: Flatpay
          x: 3
          y: 5
          detail: "Payments and POS with emerging banking; on-site installation and support."
        - label: SumUp
          x: 5
          y: 2
          detail: "Payments, banking, invoicing, commerce, bookings, and loyalty; self-install."
        - label: "Stripe Terminal"
          x: 4
          y: 1
          detail: "Developer-oriented payment integration; service intensity not evidenced."
        - label: "Zettle / PayPal"
          x: 3
          y: 2
          detail: "Established SMB payments alternative; detailed breadth not evidenced."
        - label: Adyen
          x: 5
          y: 2
          detail: "Enterprise omnichannel alternative rather than Flatpay's field-led SMB model."
        - label: "Traditional acquirer"
          x: 2
          y: 2
          detail: "Negotiated acquiring economics with variable-fee complexity."
    approximationNotes: >-
      Scores are analyst-authored ordinal positions from the assigned qualitative evidence, not measured market
      data; unsupported capabilities were not treated as absent.
    claimRefs: [CP013, CP014, CP015]
callouts:
  - calloutType: risk
    title: Service differentiation is not yet a proven moat
    body: >-
      Flatpay's installation and support model may improve conversion and retention, but the public evidence
      does not quantify win rates, churn, service cost, or merchant lifetime value against broader incumbents.
    claimRefs: [CP002, CP014, CP015]
