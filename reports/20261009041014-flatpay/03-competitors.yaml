      - ["Stripe Terminal", "Adjacent platform", "Not quantified in assigned evidence", "Developer-led and omnichannel merchants", "Flexible integrations and connection to online payments", "More technical setup; current price comparison unavailable"]
      - [Adyen, "Enterprise incumbent", "Not quantified in assigned evidence", "Enterprise omnichannel merchants", "Broad enterprise payment scope", "Not positioned around Flatpay's service-heavy SMB motion"]
      - ["Traditional acquirer", "Status quo substitute", "Fragmented and not quantified", "Merchants using negotiated acquiring contracts", "Potentially lower interchange-plus economics at high volume", "Variable fees and harder statement reconciliation"]
      - ["Internal multi-vendor stack", "Build/substitute", "Not publicly measurable", "Merchants combining gateway, POS, and accounting tools", "Control and vendor choice", "Integration and support burden; no comparable cost evidence"]
