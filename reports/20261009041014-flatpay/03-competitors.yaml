schemaVersion: "report-v2"
artifact: competitors
slug: flatpay
runDate: 2026-10-09
company:
  name: Flatpay
chapter:
  number: 3
  title: Competitors
  summary: >-
    Flatpay's clearest competitive wedge is a simple in-person rate paired with on-site installation and
    support, but SumUp already combines comparable acquiring economics with a broader financial-software
    suite. The available evidence points to a service-and-execution moat rather than a proprietary pricing
    moat, while regulatory posture, realized pricing, retention, and win-loss data remain material gaps.
sections:
  - id: competitive-landscape
    title: Competitive landscape and buyer alternatives
    body: >-
      Flatpay competes most directly with European SMB payment specialists such as SumUp and Zettle, while
      Stripe Terminal is an adjacent developer-led alternative and Adyen is an enterprise-oriented incumbent.
      Traditional acquirers remain the status quo for merchants willing to accept variable fee structures or
      negotiate interchange-plus pricing, and merchants with technical resources can assemble payments,
      software, and hardware from multiple vendors. Flatpay's third-party review evidence says it serves more
      than 70,000 merchants across seven European markets, whereas the comparison source describes SumUp as a
      much larger and older platform. The result is a crowded landscape in which Flatpay is differentiated by
      operating model and merchant experience, not by owning an uncontested category.
    claimRefs: [CP003, CP006, CP010, CP013]
    tableRefs: [TP001]
  - id: pricing-and-capabilities
    title: Pricing, packaging, and capability trade-offs
    body: >-
      Flatpay's public proposition is easy to explain: one rate across card types, no hidden fees, and a
      technician-led installation. The assigned comparison evidence reports a 1.49% UK terminal rate and a
      1.69% POS rate, while SumUp offers 1.69% pay-as-you-go or 0.99% plus GBP19 per month for qualifying
      domestic consumer-card volume. Those are list-price comparisons, not realized merchant economics, and
      neither source provides contract-level discounts, loss rates, chargeback experience, or effective
      blended take rates. SumUp's broader banking, invoicing, payment-link, online-store, booking, and loyalty
      tools create a bundling advantage. Conversely, Flatpay's hands-on deployment can reduce implementation
      burden for merchants without in-house technical staff.
    claimRefs: [CP001, CP002, CP004, CP005, CP006]
    tableRefs: [TP002, TP003]
  - id: distribution-and-direction
    title: Distribution power, switching friction, and strategic direction
    body: >-
      Flatpay's field-led onboarding creates both a distribution asset and a scaling constraint. On-site
      installation, training, and round-the-clock support can deepen the merchant relationship, but the lack
      of self-serve signup adds friction relative to plug-and-play competitors. An assigned company job repost
      shows Flatpay developing an SME banking product and customer-facing app, and an older secondary article
      describes ambitions in ecommerce and expense management. Those moves could increase product breadth and
      switching costs, yet they also move Flatpay toward SumUp's established bundle. A Danish trade article's
      report of 35 marketing employees across seven markets indicates meaningful go-to-market investment, but
      it does not establish acquisition efficiency or channel defensibility.
    claimRefs: [CP002, CP008, CP009, CP011, CP014]
    figureRefs: [FP001]
  - id: moat-and-diligence
    title: Moat durability and displacement risk
    body: >-
      The evidence does not establish a durable technology or cost moat. Flat pricing is valuable to merchants,
      but SumUp can price below Flatpay's reported terminal rate for sufficient domestic card volume, and
      high-volume merchants may negotiate cheaper interchange-plus economics elsewhere. Flatpay's defensibility
      therefore appears to depend on local sales execution, service quality, retention, cross-sell, and the
      successful rollout of financial products. The official legal hub says terms vary by market but does not
      expose a complete entity-by-entity licensing and acquiring-partner map in the fetched page. Underwriting
      should require cohort win-loss data, realized pricing, churn after repricing, service-cost data, and a
      jurisdiction-level regulatory map before assigning material value to the claimed moat.
    claimRefs: [CP007, CP012, CP015]
