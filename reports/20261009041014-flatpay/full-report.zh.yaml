      - number: '5.3'
        title: 部署方式、监管合规与技术风险
        blocks:
          - type: paragraph
            body: >-
              Flatpay
              的部署和市场进入方式与现场拜访紧密绑定：销售团队上门见商户，完成软硬件安装，并配置本地网络外设。这种直接上手设置降低了零售员工的启动摩擦，但限制了自助服务的速度。技术风险来自对上游金融基础设施合作伙伴的高度第三方依赖、区域财政系统要求，以及缺少公开开发者
              API。由于欧洲各市场执行不同的税务合规规则，例如认证收银机记录和政府销售申报，Flatpay 必须持续开发本地化财政模块。此外，外部平台集成依赖 Frisbii
              等第三方网关，而不是开放的开发者门户；这可能给复杂的多渠道商户带来集成摩擦。
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: 展示项
        blocks:
          - type: callout
            title: 外包基础设施作为扩张杠杆
            body: Flatpay 利用 Adyen 负责欧洲核心银行卡收单和牌照，把地域扩张与金融牌照成本解耦。这样一来，工程资源可以专注于面向商户的 POS 工作流、订单管理以及七个欧洲市场的本地化财政合规。
            calloutType: insight
            claimRefs:
              - CE008
              - CE009
          - type: callout
            title: 开发者扩展能力与定制集成瓶颈
            body: 缺少开放的自助开发者 API 门户，使 Flatpay 的可服务市场主要局限于标准零售和餐饮场景。需要定制企业 ERP 或专业电商集成的商户必须依赖 Frisbii 等第三方桥接网关，技术灵活性因此受到限制。
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
  - number: 6
