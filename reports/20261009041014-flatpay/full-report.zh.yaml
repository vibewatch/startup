      - number: '5.2'
        title: 系统架构与技术栈
        blocks:
          - type: paragraph
            body: >-
              在面向商户的应用之下，Flatpay 运行着主要基于 Java 和 Spring Boot 构建的分布式后端，使用 MySQL 和 Flyway 做事务型关系持久化，使用 AWS SQS 解耦异步事件。服务运行在
              AWS ECS 的 Docker 容器中，通过 Terraform 配置，并遵循领域驱动设计（DDD）和端口与适配器架构。为应对多终端商户门店中的店内环境，平台协调本地硬件外设，并实时同步共享 POS
              设备之间的状态。Flatpay 没有承担经营完整银行机构所需的庞大监管资本和牌照成本，也没有从零搭建卡组织，而是把底层支付收单和国际牌照外包给 Adyen，在保持自有应用层的同时实现较高授权率。
