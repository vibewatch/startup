      - number: '3.2'
        title: 定价、套餐与能力取舍
        blocks:
          - type: paragraph
            body: >-
              Flatpay 的公开主张很容易解释：所有卡种一个费率、没有隐藏费用、由技术人员负责安装。指定对比证据显示，英国终端费率为 1.49%，POS 费率为 1.69%；SumUp 则提供 1.69%
              的随用随付方案，或对符合条件的国内消费者卡交易量收取 0.99% 加每月 GBP19。这些只是标价比较，不是商户实际经济结果；两个来源都没有提供合同级折扣、损失率、拒付经验或有效混合费率。SumUp
              更广泛的银行、开票、支付链接、线上商店、预约和忠诚度工具构成套餐优势。相较之下，Flatpay 的上门部署可以降低没有内部技术人员的商户的实施负担。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
