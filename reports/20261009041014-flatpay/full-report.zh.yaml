      - number: '2.3'
        title: 买方细分、预算归属与面对面采用流程
        blocks:
          - type: paragraph
            body: >-
              中小商户不同群体的买方行为与企业 IT 采购有根本差异，背后是业主经营模式和极度紧张的运营时间。Flatpay 的目标商户中，主要经济买方几乎总是企业主、经营合伙人或主要零售加盟商。与由正式 RFP
              和多利益相关方 IT
              评估委员会主导的企业采购环境不同，中小企业决策者的评估周期更短，同时还要处理店铺经营、补货和客户服务。因此，数字自助获客漏斗经常无法转化忙碌的实体店主：他们既没有足够行政精力，也未必愿意在线比较复杂的收单费率表或独立配置无线
              POS 硬件。Flatpay
              通过主动直销化解这一结构性采用障碍：销售代表带着演示箱上门，立即进行终端并排演示，用纸笔完成简化的成本对比，并在达成协议后直接现场安装硬件。商户预算负责人直接从日常经营毛利中支付交易成本，而不是动用可自由支配的软件预算；因此，Flatpay
              的价值主张——透明固定费率处理、零月度订阅费、零硬件购买支出、每日资金结算和全天候技术支持——既有吸引力，也容易负担。合同采用标准化区域服务协议，建立直接银行卡收单条款，同时避免多年锁定费，后者过去常让小企业主不愿离开现有银行安排。
            claimRefs:
              - CM001
              - CM004
              - CM006
              - CM007
              - CM012
              - CM013
