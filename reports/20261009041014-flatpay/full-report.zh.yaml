      - number: '3.3'
        title: 分销能力、切换摩擦与战略方向
        blocks:
          - type: paragraph
            body: >-
              Flatpay 由现场团队主导的开户既是分销资产，也构成扩张约束。上门安装、培训和全天候支持可以加深商户关系，但缺少自助注册，相比即插即用的竞争者增加了摩擦。一则公司招聘职位转发显示，Flatpay
              正在开发中小企业银行产品和面向客户的应用；另一篇较早的二手文章则称公司有意进军电商和费用管理。这些动作可能扩大产品范围并提高切换成本，但也会把 Flatpay 推向 SumUp
              已经建立的套餐模式。丹麦行业文章称，Flatpay 在七个市场拥有 35 名营销员工，说明公司投入了可观的市场进入资源，但这并不能证明获客效率或渠道防御力。
            claimRefs:
              - CP002
              - CP008
              - CP009
              - CP011
              - CP014
          - type: figure
