              - CP014
              - CP015
      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              现有证据无法证明 Flatpay 拥有持久的技术或成本护城河。固定定价对商户有价值，但对于足够大的国内卡交易量，SumUp 可以把价格压到 Flatpay
              报道的终端费率以下；高交易量商户也可能在其他地方谈到更便宜的 interchange-plus 条件。因此，Flatpay
              的防御力似乎取决于本地销售执行、服务质量、留存、交叉销售以及金融产品能否成功推出。官方法律中心称条款因市场而异，但抓取页面没有展示完整的逐实体牌照和收单合作方地图。投资判断应要求公司提供队列赢单 /
              丢单数据、实际定价、重新定价后的流失率、服务成本数据和按司法辖区划分的监管地图，之后再为其声称的护城河赋予实质价值。
            claimRefs:
              - CP007
              - CP012
              - CP015
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 服务差异化尚未成为经过证明的护城河
            body: Flatpay 的安装和支持模式可能改善转化与留存，但公开证据没有量化相对更广泛现有企业的赢单率、流失率、服务成本或商户生命周期价值。
            calloutType: risk
            claimRefs:
              - CP002
              - CP014
              - CP015
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现架构
        blocks:
          - type: paragraph
            body: >-
              Flatpay 采用一体化支付促成和银行卡收单模式，专门服务欧洲零售和餐饮行业的中小型实体企业（SME）。公司的核心商业卖点是极简定价：银行卡终端交易收取 0.99% 的固定处理费，集成式销售点（POS）采购收取
              1.49%，且不收月度软件订阅费。传统银行收单机构和老牌处理商通常会收取复杂的 interchange-plus 加价、月度最低计费门槛、PCI 合规罚金和账单生成费；Flatpay
              则承诺透明的固定费率账单和每日结算。为了防止低交易量商户弃用终端、损害单位利润，Flatpay 设置严格的商户承保门槛：年卡处理量至少
              €100,000，同时系统性拒绝多门店加盟商和企业零售连锁。除此之外，Flatpay
              还使用银行卡附加费机制，把国际卡和商业卡成本直接转嫁给持卡人，而不是自行承担跨境交换费加价。客户推荐和获客还得到结构化合作伙伴计划的补充：通过 PartnerStack
              按线索成本和会议成本向合格的联盟机构支付报酬。
            claimRefs:
              - CI003
              - CI004
              - CI006
              - CI014
