      - number: '4.2'
        title: 商业牵引与地域收入组合
        blocks:
          - type: paragraph
            body: >-
              Flatpay 在北欧和西欧的激进扩张，推动 2024 至 2026 年收入大幅增长。根据 2025 财年的审计年报，集团收入同比增长超过三倍，从约 €11M 增至
              €39M；德国、芬兰和意大利的国际扩张开始贡献有意义的处理量。势头延续至 2026 年：公司披露，截至 2026 年 6 月，年化收入已达 €100M，年化卡处理量运行率为 €20B，活跃中小商户超过
              100,000 家。德国迅速成为 Flatpay 最大的地域市场，2025 年收入为 €15M，其后是芬兰的 €6M 和意大利的 €4M；法国和英国则在 2026 年开始进入。商户开户引擎据报保持每月约 7%
              的增长轨迹，每月新增约 5,000 个中小企业账户。然而，公开披露没有拆分卡处理价差、软件交换费利润和周边商户费用之间的收入组合，因此净获客费率的持久性仍未得到验证。
            claimRefs:
              - CI001
              - CI002
          - type: table
            tableRef: TI001
            claimRefs:
