      - number: '1.2'
        title: 创始团队、领导层演变与关键人风险
        blocks:
          - type: paragraph
            body: >-
              该业务由连续创业者 Sander Janca-Jensen（首席执行官）、Rasmus Busk、Rasmus Hellmund Carlsen 和 Peter Lüth
              创立。值得注意的是，创始人并非出身于传统支付收单行业；他们此前在报警安防领域做大了直销业务，随后把面对面直销技巧应用于商户收单。领导层培养采用内部学徒制：高管从 McKinsey、BCG
              等顶级战略咨询背景中招募，先与一名联合创始人直接搭档 6 至 12 个月，再接任国家级商业主管；每个国家的董事总经理都由内部晋升。组织的重要变化包括：联合创始人 Rasmus Carlsen
              转任首席品牌官，负责国际扩张；前营销总监 Nikolai Pedersen 出任首席营销官，统领覆盖 Flatpay 七个运营辖区的 35 人集中式营销团队。运营纪律和一线问责仍然严格，但 CEO Sander
              Janca-Jensen 高度集中掌握高管层权力。
            claimRefs:
              - CO004
              - CO008
              - CO010
              - CO011
