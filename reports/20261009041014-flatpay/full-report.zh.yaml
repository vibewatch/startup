      - number: '2.4'
        title: 结构性增长驱动、监管要求与采用约束
        blocks:
          - type: paragraph
            body: >-
              欧洲现代化中小企业支付方案的采用受到强劲结构性顺风推动，但仍受持续存在的运营、竞争和监管摩擦制约。最重要的长期驱动因素，是欧盟实体销售点现金支付持续下降。央行和欧盟交易数据表明，现金在 POS
              交易笔数中的占比已从 2016 年的 72% 以及更早监测期的 78%，骤降至 2022 年的 50%，并在 2024–2026 年进一步降至 40% 出头；北欧经济体和荷兰的现金交易占比更跌破
              25%。消费者快速转向非接触式借记卡、信用卡和手机钱包，迫使哪怕是微型零售商也必须保有可靠的电子支付终端，以免失去到店交易。与此同时，商户折扣率（MDR）压缩和监管费率上限侵蚀了单纯支付处理的利润，迫使服务商把增值软件、企业账户和嵌入式金融服务打包销售。不过，市场速度仍受实质约束。现有商业银行以及
              Nexi、Worldline 和 Barclays 等成熟支付巨头拥有根深蒂固的商业关系和长期银行存款，在南欧和西欧核心地区经常占据超过 80%
              的市场份额。此外，直销模式的获客成本仍远高于数字营销，因此必须严格执行配额——例如要求销售代表每月创造 20 笔商户交易——才能维持资本效率并支撑 10 至 12
              个月的客户回本周期。最后，各国财政系统要求、认证收据规定和跨境交换费规则各不相同，需要做本地化产品改造；若没有各国专门的运营基础设施，就无法顺畅覆盖全欧洲。
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM009
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 直销分销破解中小商户的惰性难题
            body: >-
              欧洲小商户收单的核心瓶颈从来不是产品供应，而是商户采用惰性。小店主和餐饮经营者很少愿意花时间在线研究银行卡终端供应商。Flatpay
              让销售代表带着演示硬件套件直接进入商户场所，把原本摩擦重重的采购评估变成即时现场试用，从而绕开数字获客疲劳。
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
              - CM012
              - CM013
          - type: callout
            title: 银行根深蒂固、高现场获客成本限制市场渗透
            body: >-
              尽管 Flatpay 七个运营市场的欧洲中小商户池超过 280 万家，现有商业银行仍控制当地超过 80%
              的收单关系。要把商户从成熟银行套餐中争取过来，就必须维持高接触度的上门销售团队。如果销售代表的成交速度低于目标配额，获客回本周期就会迅速拉长，限制可持续市场渗透。
            calloutType: risk
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM014
              - CM015
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              Flatpay 最直接的竞争对手是 SumUp 和 Zettle 等欧洲中小企业支付专业公司；Stripe Terminal 是相邻的开发者主导型替代方案，Adyen
              则是面向企业客户的现有巨头。愿意接受浮动费率或协商 interchange-plus 定价的商户，仍可选择传统收单机构；拥有技术资源的商户也可以从多个供应商拼装支付、软件和硬件。Flatpay
              的第三方评价证据称，公司服务七个欧洲市场的 70,000 多家商户；而对比来源称 SumUp 是规模大得多、成立更早的平台。结果是一个拥挤的市场：Flatpay
              的差异化来自运营模式和商户体验，而不是占据一个没有竞争的品类。
            claimRefs:
              - CP003
              - CP006
              - CP010
