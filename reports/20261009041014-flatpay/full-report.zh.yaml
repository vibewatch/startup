      - number: '2.2'
        title: 可服务市场规模、估值视角与渗透上限
        blocks:
          - type: paragraph
            body: >-
              估算欧洲中小商户支付服务市场，需要把自上而下的宏观企业统计与自下而上的商户交易经济学结合起来。中小企业约占欧洲所有商业企业的 99%，在欧盟和英国合计超过 2,500
              万家注册企业。在这一庞大的宏观环境中，Flatpay 以严格的交易区间界定其可服务受众：年总交易量（年 TPV）在 €60,000 至 €7,000,000 之间的商户。低于 €60,000
              的商户通常是微型企业或个体业主，交易频率不足以承担专用硬件安装成本，也不足以支撑面对面直销的获客成本。反之，年交易量超过 €7,000,000 的企业拥有采购议价能力，可以协商定制的
              interchange-plus-plus 处理方案、多通道硬件招标和专业企业软件集成，这些需求超出 Flatpay 标准化的终端和软件套餐。在 Flatpay
              的七个主要运营辖区——丹麦、芬兰、德国、法国、意大利、荷兰和英国——可服务的中小商户群估计约为 280 万至 350 万家零售和餐饮机构，合计年支付处理量超过 €350B。假设平均商户折扣费率为 1.0% 至
              1.2%，隐含的可服务收入池为这七个市场每年 €3.5B 至 €4.2B。GetLatka 等科技行业研究机构和中端市场增长追踪机构的独立估算也印证了这一庞大收入池，并预测头部挑战者可以达到三位数的 ARR
              规模。然而，区域银行的主导地位严格限制了渗透上限：现有银行集团通常控制当地超过 80% 的收单关系，新兴非银行挑战者只能激烈争夺处于竞争状态的商户账户。
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM007
              - CM009
              - CM010
              - CM011
