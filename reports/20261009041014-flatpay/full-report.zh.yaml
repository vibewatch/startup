      - number: '1.4'
        title: 展示项
        blocks:
          - type: callout
            title: 直销团队开支与商户流失敏感度
            body: >-
              Flatpay 的超高速增长依赖一支超过 2,000 人的高强度直销团队，他们需要上门拜访商户。销售代表每月必须完成 20
              笔成交，表现不佳时会被迅速解雇。这种激进模式带来高额固定获客开支，也让公司更容易暴露于欧洲零售和餐饮行业中小商户的经营失败率。
            calloutType: risk
            claimRefs:
              - CO009
              - CO014
          - type: callout
            title: 消费者银行卡附加费掩盖的单位经济
            body: >-
              行业分析显示，Flatpay
              能向商户提供零订阅费和低固定交易费，很大程度上依靠一种补贴机制：公司向公司卡和国际卡提供免费处理，再通过消费者附加费为此买单。对中小企业主而言，这一方案很有吸引力；但如果收单交换费机制发生变化，它会招致欧洲支付服务规则下的监管审查，也可能遭遇商户抵制。
            calloutType: insight
            claimRefs:
              - CO009
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出、相邻领域与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Flatpay
              的可服务市场由欧洲中小企业的销售点（POS）银行卡支付受理、硬件终端和一体化商业工作流软件构成。目标范围覆盖丹麦、芬兰、德国、法国、意大利、荷兰和英国等欧洲商业中心的实体零售商、独立餐饮场所、快餐店、肉店、面包店、美容院和个人护理机构。在这些行业，面对面借记卡和信用卡处理是商户收款的关键运营命脉。纳入支出包括商户折扣率（MDR）、交易处理费、POS
              终端采购或补贴租赁、基础库存控制工具、小费管理、收据生成以及实时交易对账仪表板。目标市场明确排除企业级全渠道编排、复杂的一级多通道超市架构、高交易量航空和旅行预订引擎、跨境多币种外汇网关，以及为跨国零售品牌定制的复杂多层库存优化系统。核心边界之外的相邻领域包括电商商户收单、商户现金预支、企业银行借记卡和自动化税务会计集成。Flatpay
              一体化方案的现状替代品仍是根深蒂固的传统商业银行收单协议，通常带有多层 interchange-plus
              定价表、每月终端租赁费、合规罚金和不透明的账单。小微商户则可能依赖自行开通的移动刷卡设备，接受较高的浮动费率；尚未数字化的经营者仍继续收取现金，尽管监管持续不鼓励现金使用，且整个欧盟的现金使用率正在下降。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
