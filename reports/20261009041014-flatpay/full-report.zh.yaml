            body: >-
              留存记录显示采用量呈陡峭的方向性增长。一份合作伙伴简介称，Flatpay 在 2022 年末开始扩张后拥有超过 2,500 名客户。之后的一份通讯称客户数约为 60,000，较 2024 年 4 月的 7,000
              家增长；一篇日期为 2026 年 6 月的行业评论则称，公司在七个市场拥有 100,000 家商户，年处理量运行率为 EUR20
              billion。这些数据并不是干净的时间序列：出版物混用了客户和商户两个口径，其中一个快照在抓取文本中没有发布日期，且没有任何来源披露测量规则、活跃状态标准或队列分母。处理量也不等于收入或
              ARR。证据支持规模和增长，但不能证明精确的获客速度、使用率或持久的经常性经济。
            claimRefs:
