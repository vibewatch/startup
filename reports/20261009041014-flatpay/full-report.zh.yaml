        title: 客户细分与运营任务
        blocks:
          - type: paragraph
            body: >-
              Flatpay 所称的客户是中小型实体商户：业主或经营者购买服务，一线员工使用终端或销售点工作流，商户承担支付受理成本。Flatpay 美国落地页将支付终端、mPOS 和 point of sale
              列为三种方案，并点名酒吧、花店、市场、咖啡店、肉店和快休闲餐厅等商户类别。独立报道同样称公司服务小商户或中小企业。因此，现有证据支持广泛的面对面中小企业细分，但无法提供按细分划分的账户数、支付量、收入、留存或利润。七个市场的运营记录显示地域覆盖广度，但现有来源不足以可靠地按国家或垂直行业分配商户和经济数据。
            claimRefs:
