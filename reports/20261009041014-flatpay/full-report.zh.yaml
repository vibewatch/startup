        - 季节性 SMB 队列中商户高流失及未付款争议量上升
        - 受营业额不足费影响商户的队列流失率
    notes: 根据商户条款、产品规格和直销运营指标汇总运营及商业模式风险；按严重性排序。
    claimRefs:
      - CR005
      - CR009
      - CR011
      - CR013
      - CR014
      - CR015
  - id: TV001
    title: 建议总结与投资判断框架
    columns:
      - 决策参数
      - 立场
      - 证据基础
      - 投资含义
    rows:
      - - 建议
        - 跟踪
        - 商户快速扩张，但盈利能力未经验证，且缺少经审计的集团账目
        - 在没有经审计财务确认的情况下，不要以 €1.5B 投后估值投入新的一级资本
      - - 信心
        - 中
        - 对 C 轮融资规模和估值的交叉印证较充分，但单位利润率可见度低
        - 依靠第三方交叉核验，不要依赖管理层公开的前瞻性指引
      - - 风险评级
        - 高
        - 现金消耗高、人员扩张激进，采用上门直销模式且人员流动大
        - 若新市场的商户获取速度放缓，应按高下行暴露进行投资判断
      - - 估值立场
        - 偏高
        - €1.5B（$1.75B）估值对应当前 ARR 超过 12 倍，高于正常化欧洲支付可比公司
        - 该价格要求前瞻增长稳定达到 300%，且交易利润率持久
    notes: 投资判断框架综合了金融媒体在 2025 年 11 月报道的 C 轮估值核心指标。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV008
      - CV014
  - id: TV002
    title: 投资论点与反论点评估
    columns:
      - 视角
      - 核心论点
      - 支持证据
      - 改变论点的催化剂
    rows:
      - - 核心论点
        - 现场直销模式绕过银行渠道，获取服务不足的欧洲 SME 支付交易量
        - 覆盖 6 个欧洲国家的活跃商户超过 60,000 家，其中德国有 20,000 家
        - 现场销售代表的生产率降至每月 20 份商户合同指标以下
      - - 产品简单
        - 统一终端和 POS 软件采用可预测的固定定价，去除复杂的隐性费用结构
        - 公开营销承诺固定费率交易定价、零隐性费用和每日结算
        - 商户合同争议、硬件退货率或转向集成 ISV 平台的流失上升
      - - 反论点：附加费
        - 商户获取速度依靠消费者银行卡附加费补贴的零手续费处理
        - 支付行业分析将信用卡消费者附加费视为主要增长催化剂
        - 欧盟或各国监管机构执法，禁止商业卡附加费机制
      - - 反论点：消耗速度
        - 运营模式无利可图，1,400 至 1,500 名员工带来沉重间接成本
        - 高管评论承认，尽管完成 €145M 融资，公司仍未盈利
        - 在 C 轮资本储备耗尽前无法达到 EBITDA 盈亏平衡
    notes: 对比核心运营增长论点与结构性单位经济及监管风险。
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV008
      - CV010
      - CV011
      - CV012
  - id: TV003
    title: 多年度估值与运营情景矩阵
    columns:
      - 情景
      - 运营假设
      - 预计 ARR
      - 假设倍数
      - 隐含估值
      - 下行触发因素与关键风险
    rows:
      - - 乐观情景
        - ARR 年增长达到 300%；现场销售在荷兰和英国成功复制
        - €450M
        - 6.0x
        - €2.7B ($3.1B)
        - 若公开市场支付可比公司估值下调，倍数压缩；终端供应链中断
      - - 基准情景
        - 欧洲市场趋于饱和，增长放缓至 80%；德国和丹麦商户持续流失
        - €220M
        - 5.0x
        - €1.1B ($1.3B)
        - 估值低于 C 轮投后估值，给后期投资者带来下轮融资风险
      - - 悲观情景
        - 关键市场禁止消费者附加费；商户流失率跃升至 25%；现场销售人员流失
        - €130M
        - 4.0x
        - €520M ($600M)
        - 现金严重流失，必须进行困境重组资本化或紧急结构化融资
    notes: 评估投后进入估值相对于潜在运营轨迹的情景分析。
    claimRefs:
      - CV002
      - CV004
      - CV007
      - CV011
      - CV013
      - CV014
      - CV016
figures:
  - id: FO001
    title: Flatpay 公司演进与里程碑时间线
    type: timeline
    summary: Flatpay 从成立、国际扩张到独角兽融资的时间轨迹。
    data:
      items:
        - date: 2022-01
          label: 公司成立
          detail: Flatpay 由 Sander Janca-Jensen、Rasmus Busk、Rasmus Carlsen 和 Peter Lüth 在哥本哈根创立。
        - date: 2023-06
          label: 德国市场上线
          detail: Flatpay 在德国启动商户商业运营，首年即接入超过 1,000 家当地商户。
        - date: 2024-04
          label: B 轮融资
          detail: 完成 €45M B 轮融资，由 Dawn Capital 领投、Seed Capital 参与，用于扩大产品和销售覆盖。
        - date: 2024-04
          label: 集成 POS 上线
          detail: 推出完整集成的 POS 软件和终端套餐，并提供每日结算功能。
        - date: 2025-10
          label: 达到 ARR 里程碑
          detail: 年度经常性收入运行率突破 €100M，同时服务约 60,000 家活跃欧洲商户。
        - date: 2025-11
          label: 独角兽融资轮
          detail: 完成 €145M C 轮融资，估值 €1.5B（$1.75B），扩大机构投资者联合体以支持欧洲规模化发展。
        - date: 2026-06
          label: 商户基础与 GMV 激增
          detail: 宣布覆盖 7 个欧洲国家的 100,000 家活跃商户，年度化处理量达到 €20B。
        - date: 2026-10
          label: 营销领导层重组
          detail: 任命 Nikolai Pedersen 为 CMO，管理 35 名营销人员；Rasmus Carlsen 转任首席品牌官。
    approximationNotes: 时间线日期来自公开公告和高管访谈披露；具体到日的公司注册日期仍为非公开信息。
    claimRefs:
      - CO001
      - CO004
      - CO005
      - CO006
      - CO008
      - CO011
      - CO012
      - CO013
  - id: FM001
    title: 欧洲 SMB 支付市场规模金字塔
    type: pyramid
    summary: 分层市场规模展示从欧洲企业总支出逐步收窄至 Flatpay 可触达的 SMB 处理量和已获取规模。
    data:
      items:
        - label: 欧洲 SME 总体版图（TAM）
          value: 25000000
          unit: Merchants
          detail: 欧盟 27 国及英国共有 25M+ 家注册 SME，对应 €1.8T–€2.2T 的零售卡支付潜在总额。
        - label: 核心 7 市场 SMB 零售覆盖（SAM）
          value: 3200000
          unit: Merchants
          detail: 据估算，丹麦、芬兰、德国、法国、意大利、荷兰和英国共有约 2.8M–3.5M 家实体 SMB 商户。
        - label: 可触达目标 TPV 区间（§60K-§7M TPV）
          value: 1200000
          unit: Merchants
          detail: 年处理量为 €60K–€7M、适合专用终端和直销的 SMB 商户。
        - label: 现场销售争夺细分市场（SOM 目标）
          value: 400000
          unit: Merchants
          detail: 未来 5 年在可触达城市和郊区商业销售区域内的现实可触达管线。
        - label: 中期扩张目标（2029 年目标）
          value: 1000000
          unit: Merchants
          detail: 管理层提出的长期里程碑：覆盖欧洲及跨大西洋市场的 100 万家商户。
        - label: 当前已获取基础（2025 年末 / 2026 年运行率）
          value: 70000
          unit: Merchants
          detail: 60,000–100,000 家已部署活跃商户，产生约 €20B 的年度化卡交易运行率。
    approximationNotes: 商户规模分层来自欧盟委员会统计、Flatpay 运营披露和行业交易基准；数值四舍五入至重要里程碑队列。
    claimRefs:
      - CM001
      - CM002
      - CM005
      - CM007
      - CM009
      - CM010
  - id: FP001
    title: 产品广度与服务强度的竞争定位
    type: quadrant
    summary: 序数定位图将 Flatpay 以服务为重的重点，与更广泛的自助平台及议价型传统方案区分开。
    data:
      xAxis:
        label: 产品广度：聚焦至广泛
        min: 1
        max: 5
      yAxis:
        label: 部署服务：自助至全程协助
        min: 1
        max: 5
      points:
        - label: Flatpay
          x: 3
          'y': 5
          detail: 支付和 POS，并逐步拓展银行业务；提供现场安装与支持。
        - label: SumUp
          x: 5
          'y': 2
          detail: 支付、银行、开票、商业、预订和会员；自助安装。
        - label: Stripe Terminal
          x: 4
          'y': 1
          detail: 面向开发者的支付集成；没有服务强度证据。
        - label: Zettle / PayPal
          x: 3
          'y': 2
          detail: 成熟的 SMB 支付替代方案；没有详细广度证据。
        - label: Adyen
          x: 5
          'y': 2
          detail: 企业全渠道替代方案，而非 Flatpay 以现场销售为主的 SMB 模式。
        - label: 传统收单方
          x: 2
          'y': 2
          detail: 可协商的收单经济条件，但费用复杂且不固定。
    approximationNotes: 分数是分析师根据指定定性证据编制的序数位置，不是测量所得市场数据；没有证据支持的能力未被视为缺失。
    claimRefs:
      - CP013
      - CP014
      - CP015
  - id: FI001
    title: Flatpay 收入与毛利润转化瀑布图
    type: waterfall
    summary: 示意性瀑布模型展示 €100m 年度化总处理收入如何经过交换费通道成本、直销间接成本和终端资本开支，最终转化为预计运营亏损。
    data:
      items:
        - label: 商户处理总收入
          value: 100
          unit: EUR M
          detail: 截至 2026 年 6 月、覆盖 100,000 家以上欧洲商户的年度化收入运行率。
        - label: 交换费与网络通道费用
          value: -42
          unit: EUR M
          detail: 预计支付卡组织费、交换费及支付给卡网络和银行合作方的收单成本。
        - label: 净收单处理收入
          value: 58
          unit: EUR M
          detail: 扣除硬件折旧和运营成本前预计留存的支付毛利。
        - label: 现场销售与人员费用
          value: -69
          unit: EUR M
          detail: 根据 2025 年经审计的 €69m 员工成本，以及快速扩张至 2,000 名 FTE 计算的直销与人员成本。
        - label: 终端设备资本开支摊销
          value: -26
          unit: EUR M
          detail: 已部署 €40m PAX A920 硬件及商户安装的摊销和持有成本。
        - label: 其他运营间接成本
          value: -33
          unit: EUR M
          detail: 七个市场的设施、行政、合规和国际扩张间接成本。
        - label: 预计运营结果
          value: -70
          unit: EUR M
          detail: 反映 2025 年经审计的 €70m 运营亏损及管理层对 2026 年运营亏损扩大的预测。
    approximationNotes: 收入、人员成本、资产负债表设备和运营亏损锚定于 2025 年经审计账目及支付业务的 2026 年 6 月披露；交换费差额和资本开支摊销部分为行业示意性估计。
