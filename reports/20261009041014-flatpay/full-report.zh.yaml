chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、产品架构与商业模式
        blocks:
          - type: paragraph
            body: >-
              Flatpay 于 2022
              年在丹麦哥本哈根由数字领域创业者和支付业高管创立，目标是颠覆欧洲商户服务。公司提供全服务收单和销售点（POS）平台，专门面向中小企业（SME）；这些企业过去常面对传统银行和商户收单机构不透明的
              interchange-plus 定价及浮动处理费。Flatpay 将支付终端、移动 POS（mPOS）和一体化 POS
              收银软件打包，以透明的固定交易费销售，免除终端设置费、订阅费及隐性网关附加费。其服务包括全天候技术支持、现场技术人员上门安装硬件和软件、每日结算，以及将每日 Z
              报表直接同步至会计系统的自动记账集成。Flatpay 在丹麦、芬兰、德国、法国、意大利、荷兰和英国七个核心欧洲市场运营，将自己定位为独立商户的运营中枢，并从实体终端延伸至线上支付受理。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO007
