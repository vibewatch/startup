      - number: '4.3'
        title: 成本结构、人员膨胀与硬件资本开支
        blocks:
          - type: paragraph
            body: >-
              Flatpay 收入快速增长的底层，是一套资本密集度极高的运营体系，其特点是员工数量激增和资产负债表上的大量硬件支出。经营亏损从 2024 年的 €20M 大幅扩大到 2025 年的
              €70M，几乎完全由人员费用前所未有的增长驱动。集团员工成本当年增加 €49M，达到 €69M；平均全职等效（FTE）人数则从 2024 年的 257 人跃升至 2025 年的 957
              人。为支持面对面销售扩张，公司持续招聘，到 2026 年年中总员工数约 2,000 人。Flatpay 统一将基于 Android 的 PAX A920
              智能支付终端直接部署到商户场所，且不收前期硬件费用，因此设备采购形成大量营运资金和固定资产承诺。截至 2025 年末，Flatpay 资产负债表上持有 €40M 支付设备，其中 €14M
              已预付未来设备交付。这个资本密集型部署模式需要持续的商户留存，才能收回设备制造、运输以及技术人员直接上门安装的前期费用。
            claimRefs:
              - CI007
              - CI008
              - CI013
              - CI014
      - number: '4.4'
        title: 现金消耗、资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              2025 财年实体销售部署和国际市场进入的速度造成惊人的现金消耗，融资前自由现金流出为负 €94M。Flatpay 在 2025 年末以官方 €1.5B 投后估值新增股权融资
              €146M，缓冲了这一严重运营赤字；这轮融资赋予其独角兽地位，也补充了此前由 Dawn Capital 和 Seed Capital 领投的 €45M B 轮融资。除股权资本外，Flatpay
              还从丹麦出口与投资基金（EIFO）获得 €24M 贷款额度，用于设备和国际应收账款融资。尽管注入了这些流动性，前瞻指引仍凸显公司对外部资本的持续依赖。管理层预计，2026 全年收入将达到 €100M 至
              €105M，而年度经营亏损将进一步扩大至 €140M 至 €150M，因为公司要为法国和英国的激进销售团队提供资金。截至 2026 年 9 月，二级交易和私募交易追踪机构对 Flatpay 的定价约为
              $1.7B；公司需要持续获得大量融资，或迅速稳定单位层面的利润率，才能达到经营现金流盈亏平衡。
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI015
      - number: '4.5'
        title: 财务结论与关键尽调障碍
        blocks:
          - type: paragraph
            body: >-
              Flatpay 是欧洲支付收单领域一个高速、高资本密集度的增长实验。公司从 2022 年创立到 2026 年达到 €100M
              年化收入运行率，说明商户明确需要透明的固定费率处理；但对于成长股权投资判断，其底层经济仍未经证明。关键在于，Flatpay 尚未披露扣除支付网络评估费、卡组织交换费和收单处理成本后的实际毛利率。0.99%
              的固定标价费率，在国内借记卡交易扣除交换费后留下的净利润价差非常窄；对于不收附加费的商业卡交易，还可能产生负净收入。此外，Flatpay
              完全依赖内部专职直销团队，放弃数字自助开户和第三方经销渠道，这会带来严重的固定运营支出，并随地域扩张而膨胀。潜在投资者必须把历史现金消耗和终端资产折旧视为关键投资判断风险。正式尽调需要审计后的商户队列留存表、获客成本回本计划、各支付通道实际毛获客费率瀑布表，以及商户合同终止时的终端回收损失率。
            claimRefs:
              - CI003
              - CI005
              - CI007
              - CI010
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI003
