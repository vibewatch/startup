            body: >-
              Flatpay 经审计的 2025 年账目显示，经营亏损为 €70m，自由现金流出为负 €94m；管理层预计 2026 年亏损将进一步扩大至 €140–150m。虽然公司获得了 2025 年 €146m
              股权融资和 €24m 国有债务额度支持，但只要毛利率和销售回本速度不能迅速改善，公司就会持续依赖融资。
