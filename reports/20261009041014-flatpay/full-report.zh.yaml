  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 商户工作流与产品供给
        blocks:
          - type: paragraph
            body: >-
              Flatpay 将面对面银行卡支付和商户管理软件打包成三档主要软硬件方案：独立支付终端、移动
              POS（mPOS）以及完整销售点系统。公司并不把自己定位成面向开发者的网关，而是服务餐厅、咖啡馆、花店、美发沙龙和零售店等实体门店商户；这些商户年处理量超过 €100,000。对这些商户而言，POS
              是业务运营核心，把商品目录、规格选项、桌台管理、点单、条码扫描、厨房和收据打印以及每日现金对账统一到一个界面中。每日结算和全天候实时支持，是无法容忍支付终端停机的非技术型零售经营者的重要留存驱动因素。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
