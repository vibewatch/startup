      - number: '1.3'
        title: 资本化轨迹、规模差异与商业分销
        blocks:
          - type: paragraph
            body: >-
              Flatpay 的资本化轨迹是欧洲支付创业公司中增长最快的案例之一。公司于 2024 年 4 月完成 €45M B 轮融资，由 Dawn Capital 领投，Seed Capital 和包括 Mario
              Götze 在内的天使投资人跟投，此前还完成过种子轮融资。2025 年末，Flatpay 以 €145M C 轮融资跻身独角兽，投前估值为 €1.5B（USD
              1.75B）；成长类媒体的后续报道记录的交易总额最高达 €161.5M，参与方包括 AVP、Smash Capital 和 Hedosophia。运营规模从 2024 年 4 月的 7,000 家活跃日商户扩大到
              2025 年末的 60,000 家，2026 年年中达到 100,000 家活跃商户；截至 2026 年末，营销口径称商户数达 125,000 家、员工数达 2,000 人。管理层披露，2025 年末 ARR
              已突破 €100M，年化处理量运行率为 €20B，并计划 2026 年 ARR 增长 300% 至 €400M–€500M、2029 年商户数达到 1 million
              家。然而，分销几乎完全依赖高强度上门直销，销售人员每月需完成 20 笔交易，同时配合一项颇具争议的机制：对国际卡和公司卡收取消费者附加费。
