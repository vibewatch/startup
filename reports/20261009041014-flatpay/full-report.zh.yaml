  - id: FE001
    title: Flatpay 分层产品与运营架构
    type: stack
    summary: 展示 Flatpay 技术栈的结构拆解：从店内实体硬件，经云端后端服务，延伸至外包银行基础设施。
    data:
      layers:
        - label: 店内外设与结账硬件
          detail: 台式终端、移动 mPOS 设备、条码读取器，以及热敏小票和厨房订单打印机。
          modules:
            - 基础、移动和高级终端
            - 条码扫描器与热敏打印机
        - label: 边缘协调与设备网格
          detail: 在共享商户店面布局及本地外设连接之间实时同步状态。
          modules:
            - 多终端状态同步引擎
            - 本地硬件通信驱动
        - label: 核心 POS 应用层
          detail: Spring Boot 微服务管理产品目录、类别、修饰项、动态购物篮和桌位安排。
          modules:
            - 产品与库存目录服务
            - 订单生命周期与桌位管理
        - label: 财税化与监管引擎
          detail: 自动现金管理、日终 Z 报表及本地化财税交易审计导出。
          modules:
            - 政府税务申报引擎
            - 审计轨迹与现金对账
        - label: 云平台与消息骨干
          detail: 在 AWS ECS 上部署容器化服务，通过 AWS SQS 异步传递消息，并使用 MySQL 存储。
          modules:
            - AWS ECS 微服务集群
            - AWS SQS 事件管线与 MySQL 数据库
        - label: 收单与金融基础设施
          detail: 通过 Adyen 外包欧洲卡收单、牌照、卡组织路由和嵌入式金融服务。
          modules:
            - Adyen 统一卡组织收单
            - 嵌入式金融服务管线
    approximationNotes: 层级分类综合了工程架构清单和战略合作伙伴基础设施披露。
    claimRefs:
      - CE001
      - CE006
      - CE007
      - CE009
