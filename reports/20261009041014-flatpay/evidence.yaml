evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financial-statements
    missingEvidence: >-
      Audited financial statements for Flatpay group operations for 2025-2026 detailing audited net revenue, gross
      margins after interchange, operating cash flow, and monthly burn.
    whyItMatters: >-
      Management claims of €100M+ ARR and €20B GMV cannot be verified against statutory filings, preventing independent
      confirmation of gross vs net revenue take-rate dynamics.
    diligencePath: >-
      Obtain Danish Central Business Register (CVR) audited statutory filings for Flatpay ApS and consolidated European
      operating entities during confirmatory legal diligence.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: merchant-cohort-retention
    missingEvidence: >-
      Audited merchant cohort retention schedules, annualized gross and net revenue churn percentages, and customer
      lifetime value (LTV) across each of Flatpay's seven European operating markets.
    whyItMatters: >-
      Direct in-person field sales incur high customer acquisition expenses; without granular cohort churn and retention
      disclosures, evaluating whether merchant lifetime value comfortably exceeds upfront sales CAC remains impossible
      to underwrite with high confidence.
    diligencePath: >-
      Request country-by-country merchant vintage cohort retention curves, monthly gross volume attrition logs, and
      gross profit payback figures from management during private investment diligence.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: regulation
    missingEvidence: A market-by-market legal entity, license, sponsor bank, acquirer, safeguarding, and complaint-handling map.
    whyItMatters: Regulatory dependency and counterparty concentration can change trust, continuity, and expansion risk.
    diligencePath: >-
      Request counsel-verified entity charts, license numbers, program agreements, and regulator correspondence for all
      seven markets.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: >-
      Cohort-level win rates, churn, multi-homing, repricing outcomes, service cost, and competitor-specific loss
      reasons.
    whyItMatters: >-
      Without measured behavior, installation and support cannot be valued as durable retention or distribution
      advantages.
    diligencePath: Review CRM win-loss exports and monthly merchant cohorts by market, channel, product, tenure, and prior provider.
    relatedQuestionRefs:
      - QP010
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Audited gross margin and net take rate breakdown after interchange, scheme, and card processing fees.
    whyItMatters: >-
      Card acquiring gross margins dictate whether Flatpay's 0.99% flat list rate can profitably cover direct field
      sales overhead and terminal hardware depreciation.
    diligencePath: >-
      Request audited revenue reconciliations, interchange cost schedules, and gross margin waterfalls by country from
      Flatpay finance.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: cohort-retention
    missingEvidence: Merchant cohort churn rates, net revenue retention (NRR), and terminal return or refurbishment recovery metrics.
    whyItMatters: >-
      High merchant turnover or lost terminal equipment would destroy unit economics given the €400 estimated upfront
      capex per deployed merchant terminal.
    diligencePath: Obtain quarterly merchant cohort retention curves, monthly churn percentages, and terminal salvage recovery data.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Named production customers with deployment dates, products used, transaction scale, reference contacts, and
      quantified outcomes.
    whyItMatters: >-
      Aggregate merchant counts and category labels cannot establish production quality, realized value, or customer
      referenceability.
    diligencePath: >-
      Obtain at least three customer references across countries and verticals, then reconcile interviews to contracts,
      invoices, and usage records.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-evidence
    missingEvidence: >-
      Monthly customer cohorts showing logo churn, GRR, NRR, renewals, contract duration, utilization, support burden,
      and reactivation.
    whyItMatters: Gross account growth does not distinguish durable adoption from replacement selling, inactivity, or high churn.
    diligencePath: >-
      Review anonymized account-level cohorts by acquisition month, country, vertical, product, and sales
      representative, tied to billed revenue.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-customer, top-acquirer, country, vertical, and sales-channel shares of volume, gross profit, and net revenue.
    whyItMatters: Seven-market breadth does not by itself rule out customer, geography, channel, or partner concentration.
    diligencePath: >-
      Request concentration schedules for the latest month and trailing twelve months, plus stress tests for loss of the
      largest acquirer or market.
    relatedQuestionRefs:
      - QU006
      - QU009
  - type: missing-source
    severity: material
    topic: regulatory-licensing-audit
    missingEvidence: >-
      Formal regulatory correspondence and licensing review documents from the Danish Financial Supervisory Authority
      (Finanstilsynet) and the UK Financial Conduct Authority regarding Flatpay's payment agent status.
    whyItMatters: >-
      Clarifies whether changes in European payment intermediary regulations (PSD3/PSR) will force Flatpay to obtain a
      direct PI or EMI license.
    diligencePath: Request legal regulatory opinion memos and correspondence logs between Flatpay and national financial supervisors.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-margins
    missingEvidence: Audited group financial statements confirming net revenue, gross processing margin, interchange fees, and EBITDA.
    whyItMatters: >-
      Without audited financial statements, public ARR claims of €100M+ cannot be verified against statutory net
      transaction turnover.
    diligencePath: Obtain Danish CVR statutory filed accounts for FLATPAY ApS and management accounts under NDA.
    relatedQuestionRefs:
      - QV009
    relatedTableRefs:
      - TV001
