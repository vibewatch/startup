callouts:
  - calloutType: "insight"
    title: "Direct Field Distribution Overcomes the SMB Inertia Dilemma"
    body: "The central bottleneck in European small merchant acquiring has never been product availability, but merchant adoption inertia. Small shopkeepers and restaurateurs rarely dedicate personal time to researching card terminal providers online. By deploying in-person sales representatives carrying demonstration hardware kits directly into merchant premises, Flatpay converts an otherwise friction-laden procurement evaluation into an immediate on-site trial, circumventing digital acquisition fatigue."
    claimRefs:
      - "CM001"
      - "CM006"
      - "CM012"
      - "CM013"
  - calloutType: "risk"
    title: "Bank Entrenchment and High Field CAC Bound Market Penetration"
    body: "While the addressable European SMB merchant pool exceeds 2.8 million establishments across Flatpay's seven operating markets, incumbent commercial banks control upwards of 80% of local acquiring relationships. Winning merchants away from established bank bundles requires maintaining high-touch door-to-door sales forces. If sales representative deal velocity falls below target quotas, customer acquisition payback periods will lengthen rapidly, capping sustainable market penetration."
    claimRefs:
      - "CM002"
      - "CM003"
      - "CM008"
      - "CM014"
      - "CM015"
