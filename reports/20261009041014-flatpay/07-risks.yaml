chapter:
  number: 7
  title: "Risks"
  summary: "Flatpay's merchant-acquiring and POS model combines rapid direct-sales merchant onboarding with critical structural dependencies on external card acquirers, third-party terminal leasing facilities, and controversial cardholder surcharging practices. The business faces operational and margin exposure from non-cancellable 36-month merchant contracts and turnover minimums, alongside strict downstream liability shifts for network fines and hardware downtime."
sections:
  - id: "regulatory-and-legal-risks"
    title: "Regulatory and Legal Risk Architecture"
    body: "Flatpay operates structurally as an unregulated commercial distributor and software provider rather than a fully licensed payment institution or card acquirer. As set out in its standard UK merchant terms, Flatpay explicitly does not process card transactions itself, delegating all acquiring operations to external licensed card processors under a mandated power of attorney granted by the merchant. This agency architecture isolates Flatpay from direct prudential banking capital requirements but introduces acute legal vulnerabilities across its operating territories. Under clause 7 of its March 2026 terms, Flatpay facilitates merchant surcharging on corporate and international cards by transmitting Bank Identification Number lists directly to card terminals, a mechanism highlighted by industry observers as a central yet controversial driver of Flatpay's commercial adoption. Because consumer protection and payment service regulations across the UK and the European Union restrict payment surcharges to direct underlying costs, any regulatory investigation or card network crackdown by Visa or Mastercard on automated terminal surcharging creates direct regulatory liability. Furthermore, under clause 22, card network dispute fines and chargeback penalties are passed through to merchants alongside an aggressive 25% administrative fee markup, exposing Flatpay to merchant litigation and regulatory scrutiny regarding unfair contract terms in commercial dealings."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
    tableRefs:
      - "TR001"
    figureRefs:
      - "FR001"
  - id: "partner-and-hardware-dependencies"
    title: "Partner Concentration and Hardware Financing Dependencies"
    body: "Flatpay's business model relies on a multi-tiered dependency chain spanning third-party equipment lessors, terminal hardware manufacturers, and upstream card acquirers. Point-of-sale terminals and accessories deployed to merchants free of charge are frequently not owned by Flatpay but leased through third-party financing institutions, specifically Nordania Leasing (a division of Danske Bank A/S) or other designated financing companies. Clause 4.1 of Flatpay's merchant contract stipulates that if the underlying leasing agreement between Flatpay and the financing company terminates, the third-party financing company may demand termination of the merchant loan agreements, empowering Flatpay to cancel customer agreements immediately without compensation. On the acquiring layer, Flatpay retains unilateral authority to substitute card acquirers while merchant agreements terminate automatically with immediate effect if an acquirer severs its relationship with Flatpay or the merchant. Hardware supply is concentrated in Android terminals manufactured by PAX Technology (specifically the PAX A920 Pro), creating single-vendor supply chain and firmware vulnerability. The entire merchant relationship is further enforced via non-cancellable 36-month lock-in periods with GBP 39 monthly liquidated damages per solution if monthly transaction turnover fails to meet GBP 1,100, a rigid structure that elevates partner counterparty risk and merchant churn upon contract expiration."
    claimRefs:
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR010"
    tableRefs:
      - "TR002"
  - id: "operational-financial-and-execution-risks"
    title: "Operational, Quality, and Financial Model Risks"
    body: "Flatpay's aggressive hyper-growth strategy—expanding across seven European markets including Denmark, Finland, Germany, and Italy while scaling headcount past 2,000 personnel—strains execution quality and operational controls. Direct field sales reps face demanding quotas of 20 deals per month with rapid termination for underperformance, generating organizational churn and potential mis-selling risks at the merchant point of sale. Operationally, Flatpay legally disclaims virtually all operational liability: under clause 13.2.1 of its merchant terms, software and hardware are provided 'as-is', and Flatpay disclaims liability for lost merchant profits resulting from terminal inoperability, gateway defects, or telecommunications outages. In outdoor market scenarios, local terminal caching is limited to 500 transactions on PAX A920 Pro devices, forcing merchants to balance offline business continuity against unmitigated fraud exposure. Financially, Flatpay monetizes via fixed interchange-inclusive flat rates (0.99% for terminals and 1.49% for POS systems in-person), leaving its gross margin vulnerable to card interchange rate adjustments, unfavorable card brand mix shifts, and marketing overhead across international markets."
    claimRefs:
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR015"
    tableRefs:
      - "TR003"
