callouts:
  - calloutType: "risk"
    title: "Structural Acquiring and Financing Decoupling"
    body: "Flatpay's business model relies on two fundamental third-party delegations: acquiring transaction settlement is provided exclusively by partner acquirers, while payment hardware is leased from commercial finance institutions like Nordania Leasing. If either layer fractures, Flatpay's contracts empower unilateral termination without customer compensation, exposing merchants to sudden service halts."
    claimRefs:
      - "CR002"
      - "CR006"
      - "CR007"
  - calloutType: "insight"
    title: "The Surcharging Regulatory Fragility"
    body: "Industry analysts observe that Flatpay's ability to offer zero-fee processing on international and business cards rests on shifting card fees onto consumers via terminal-level BIN surcharges. Because surcharging is heavily restricted across European jurisdictions to strictly documented incremental cost, any regulatory tightening poses a direct threat to Flatpay's core merchant acquisition pitch."
    claimRefs:
      - "CR001"
      - "CR003"
      - "CR014"
