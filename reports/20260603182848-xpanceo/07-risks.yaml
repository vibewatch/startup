- id: TR005
  title: Mitigation and thesis-break criteria table
  columns:
  - Risk
  - Monitorable indicator
  - Threshold / event
  - Action implication
  rows:
  - - Integrated product schedule risk
    - Updated roadmap, external demos, and partner milestone disclosures
    - Integrated demo slips more than two quarters beyond early 2027 without compensating validation
    - Re-rate execution risk upward; treat next round as milestone rescue rather than normal progress capital
  - - Clinical / regulatory proof risk
    - Human-study disclosure, external validation, intended-use clarity, and regulator engagement
    - No human feasibility or third-party validation appears before the next financing process
    - Do not underwrite medical upside or premium consumer launch timing
  - - Partner concentration risk
    - JBD, ITEN, Konica, and manufacturing-partner continuity
    - Loss, material delay, or non-renewal at a critical subsystem partner without a qualified backup
    - Assume schedule slippage and higher burn; request contingency sourcing plan
  - - Security / privacy architecture risk
    - Privacy policy package, data-flow diagrams, threat model, and incident readiness
    - No product-specific security/privacy design is available before pilot or customer discussions
    - Delay commercial diligence until architecture and accountability model are visible
  - - Capital dependence risk
    - Burn, runway, sponsor participation, and round terms
    - Flat/down round before integrated proof or visibly rising sponsor concentration
    - Reassess valuation and downside protection terms
  - - Commercial proof risk
    - Named pilots, customers, pricing, and workflow adoption evidence
    - Post-demo period still shows no named paying customer or conversion path
    - Treat consumer-replacement thesis as long-dated optionality only
  notes: Thresholds are analyst-defined and meant to convert a broad risk register into decisions investors can actually monitor between rounds.
