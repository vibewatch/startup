  evidenceGaps:
  - type: missing-source
    severity: material
    topic: clinical-validation
    missingEvidence: Human feasibility data, wear-duration data, and comparison against clinical standards for glaucoma, biomarker sensing, or medicine-monitoring use cases.
    whyItMatters: Prototype and artificial-eye validation do not resolve device-liability, reimbursement, or approval risk for a direct-eye health product.
    diligencePath: Request human-study protocols, IRB or ethics approvals, comparator methodology, and any interim clinical or usability readouts.
    relatedQuestionRefs:
    - QR003
    - QR004
    - QR005
    relatedTableRefs:
    - TR001
    - TR002
  - type: private-evidence-only
    severity: material
    topic: partner-contracts-and-sourcing
    missingEvidence: Executed partner contracts, exclusivity terms, field-of-use limits, backup sourcing, and any production-volume commitments for display, battery, testing, and manufacturing.
    whyItMatters: Public partnership announcements show access and intent, but not the durability or scalability of those relationships under commercialization pressure.
    diligencePath: Review JBD, ITEN, Konica, and manufacturing-side contracts; confirm second-source strategy and key termination clauses.
    relatedQuestionRefs:
    - QR011
    - QR012
    - QR024
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: qms-and-manufacturing
    missingEvidence: ISO 13485 status, supplier qualification procedures, process capability, encapsulation yield, endurance testing, and failure-mode analysis.
    whyItMatters: These are the documents that separate an impressive lab platform from a repeatable device company.
    diligencePath: Request QMS documents, certification status, manufacturing readiness reviews, pilot-line output data, and reliability test plans.
    relatedQuestionRefs:
    - QR019
    - QR026
    relatedTableRefs:
    - TR002
    - TR004
  - type: missing-source
    severity: material
    topic: security-and-privacy-architecture
    missingEvidence: Product-specific data-flow diagrams, access controls, retention policy, incident-response plan, software update model, and security architecture for gaze and health telemetry.
    whyItMatters: The privacy and cyber burden cannot be underwritten from generic statements about AI or sensors; it depends on exactly how data flows through the product stack.
    diligencePath: Request architecture diagrams, DPA and privacy package, threat model, SBOM approach, and breach-handling process.
    relatedQuestionRefs:
    - QR007
    - QR008
    - QR009
    - QR031
    relatedTableRefs:
    - TR001
    - TR002
