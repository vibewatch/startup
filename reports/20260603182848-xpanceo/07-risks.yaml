    whyItMatters: A precommercial company at a unicorn valuation can still fail if the first viable workflow is too expensive, too operationally heavy, or too niche.
    diligencePath: Request first-segment GTM plan, costed BOM, pricing waterfall, and sales assumptions by medical, industrial, and frontier routes.
