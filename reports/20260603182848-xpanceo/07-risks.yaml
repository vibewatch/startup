- id: FR001
  title: Xpanceo risk heatmap — likelihood vs. impact
  type: matrix
  layout: wide
  summary: Positions the main Xpanceo risk scenarios on a three-column impact matrix, showing that the densest concentration of risk remains in the high-likelihood / critical-impact zone around regulatory proof, integration, and manufacturing readiness.
  data:
    columns:
    - Medium impact
    - High impact
    - Critical impact
    rows:
    - label: Very low likelihood
      values:
      - Isolated partner PR issue
      - Academic-collaboration slowdown
      - Minor exhibit/demo delay
    - label: Low likelihood
      values:
      - Narrow space-test cancellation
      - Single use-case reprioritization
      - Non-core feature removal
    - label: Medium likelihood
      values:
      - Privacy design rework
      - Partner-term renegotiation
      - Cyber-device documentation burden expands schedule
    - label: High likelihood
      values:
      - Pricing and GTM remain undefined through demo
      - No public QMS/yield evidence by next round
      - Integrated-demo timing slips beyond current roadmap
    - label: Very high likelihood
      values:
      - Human/regulatory proof remains behind prototype cadence
      - Biosensor and comfort constraints persist into integrated build
      - Manufacturing and safety evidence trail commercialization
  approximationNotes: Likelihood is qualitative and based on the reviewed corpus as of 2026-06-03. Impact refers to likely effect on launch timing, financing leverage, and valuation rather than on current revenue, because Xpanceo is precommercial.
