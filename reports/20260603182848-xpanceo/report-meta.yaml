companyProfile:
  summary: >-
    Xpanceo is a Dubai-based deep-tech company founded in 2021 by Roman Axelrod and Dr. Valentyn
    Volkov to build a smart contact lens that merges XR display, biomarker sensing, intraocular-pressure
    monitoring, night vision, and AI assistance into a single wearable. Public disclosures show rare
    financing for a company at this stage — a $40M seed round followed by a $250M Series A at a $1.35B
    valuation — but the business remains pre-commercial, with no public revenue, named paying customers,
    or regulatory clearance.
  foundedDate: '2021-01-01'
  founders:
    - name: Roman Axelrod
      role: Founder & Managing Partner
      background: Serial entrepreneur and primary external strategist for Xpanceo's post-screen computing thesis.
      claimRefs: [CO002]
    - name: Dr. Valentyn Volkov
      role: Founder & Scientific Partner
      background: Physicist and nanophotonics specialist who anchors the company's optics, materials, and biosensing work.
      claimRefs: [CO003]
  foundingLocation: Dubai, United Arab Emirates
  headquarters: Dubai, United Arab Emirates
  productSummary: >-
    AI-powered smart contact lens platform combining XR display, health monitoring from tear fluid,
    intraocular-pressure sensing, passive eye tracking, night vision, and wireless-power concepts,
    with companion-device and partner-supported subsystems still being integrated.
  customerFocus: >-
    Early likely wedges are clinically mediated monitoring, frontier or industrial AR, and other niche
    deployments before broader consumer XR.
  businessModel: >-
    Pre-commercial. The most plausible future model is hardware sales plus companion devices, software,
    or service layers tied to clinical monitoring or enterprise deployment; no public pricing or revenue
    model has been validated.
  stage: Series A / pre-commercial deep tech
