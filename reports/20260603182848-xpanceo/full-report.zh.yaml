  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域与替代品
        blocks:
          - type: paragraph
            body: >-
              不能把 Xpanceo 当作处在一个成熟、可比公司清晰的市场里来分析。公司位于仍在成形的智能隐形眼镜品类，但实际机会横跨至少三个相邻支出池：通过眼部可穿戴设备进行的医疗监测、消费级或专业消费级 XR
              计算，以及受限环境中的前沿或工业免手持界面。这些支出池共享使能技术——微显示、供电系统、生物传感器、生物相容材料和配套计算——但买方、付款方、证明门槛和收入时间表差异很大。因此，单一宽口径 TAM
              数字对决策没有帮助。用于青光眼筛查的隐形眼镜、为工业用户替代 AR 眼镜的镜片，以及消费级 XR 镜片，面对的是不同的监管、报销、分销和信任壁垒。


              替代品集合同样重要。在医疗监测里，替代品包括传统临床眼压测量、连续血糖监测仪、实验室诊断，以及与智能手机连接的疾病管理工具。在消费计算里，替代品是智能手机、智能手表、智能眼镜，以及来自 Meta、Apple 和
              Snap 的 XR 头显。在工业或前沿场景中，头盔显示和加固型免手持系统仍是现状。因此，市场分析纳入的支出应限定在带传感器或显示能力的智能镜片，以及它们可能合理替代的相邻工作流——不是所有隐形眼镜，不是所有
              XR，也不是整个可穿戴计算经济。
