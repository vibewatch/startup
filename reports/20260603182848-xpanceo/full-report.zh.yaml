      - number: '8.3'
        title: 情景分析与可比估值框架
        blocks:
          - type: paragraph
            body: >-
              传统 DCF 或远期收入倍数对 Xpanceo
              没有决策价值，因为公司仍处于收入前阶段，也还在冲刺第一个一体化产品里程碑。更合适的方法是基于里程碑做情景分析，并用公开和私有可比公司校准。这些可比两面都有。负面一侧，Magic Leap
              融资数十亿美元，曾达到更高的私有估值，最后已知估值却更低，后续也更强调制造合作。Mojo Vision 达到原型和监管可信度，却从智能镜片产品转向 micro-LED。公开市场一侧，Vuzix 和 Kopin
              是已经出货的 XR 或光学专业公司，拥有真实收入，但截至 2026 年 6 月，市值仍分别约为 $344M 和 $1.09B。


              这些参照不能让 Xpanceo 与某个同行直接可比，但足以约束估值纪律。Xpanceo 的估值已经高于 Vuzix，也高于或接近小型公开光学专业公司，尽管它尚无收入；同时，它低于过往 XR
              私有峰值估值，而那些估值后来在商业化难度超过叙事之后被压缩。因此，合理的乐观 / 基准 /
              悲观结构应围绕里程碑重估，而不是英雄式终局市场假设。乐观情景需要准时的一体化演示、外部验证、清晰监管路径和首批付费试点证据。基准情景假设技术推进，但没有商业阶跃。悲观情景假设进度滑坡，人体或监管证明缺席，并且智能眼镜继续主导
              XR 采用，融资环境变得更难。
