  - id: TV006
    title: 投资逻辑破裂和终止触发器表
    columns:
      - 触发器
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 集成演示时间线破裂
        - 公开集成演示明显晚于 early 2027，且没有抵消性的第三方验证
        - 叙事溢价减弱，因为时间点是当前价值故事的核心
        - 按持平 / 下轮假设重新承销；不要以溢价定价追加资金
      - - 人体 / 监管没有进展
        - 下一轮融资周期前，看不到人体可行性、监管沟通或设备专属安全资料包
        - 医疗和直接贴眼上行只能按长期可选性估值
        - 把医疗和高端消费者用例视为基本排除在近期模型之外
      - - 救援式融资信号
        - 下一轮融资呈现出资方集中、防御性结构化，或明显低于上一轮
        - 证实技术进展没有转化为广泛市场信心
        - 转向下行保护，而不是增长承销模式
      - - 智能眼镜替代加速
        - 主流 XR 采用继续流向智能眼镜，而隐形眼镜仍停留在原型或专业场景
        - 消费者替代逻辑可信度逐步下降
        - 任何剩余上行只聚焦于小众临床或工业切口
      - - 合作伙伴关键路径失效
        - 关键显示、电池或验证伙伴出现重大延期或中断，且没有明确替代
        - 集成产品和融资时间线都会变弱
        - 提高执行风险折扣，并假设更长退出周期
    notes: 上述触发器可公开跟踪，供投资人决定持有、重新承销或拒绝新资金；不是脱离背景的机械规则。
    claimRefs:
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
  - id: TV007
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 股权结构表和优先权堆叠
        - 清算优先权、期权池或治理权利没有公开信息
        - 缺少上述信息，无法评估回报测算和下行保护
        - 管理层 / 律师数据室请求
      - - 烧钱速度、现金跑道和下一轮计划
        - 没有公开的按项目烧钱速度、现金跑道或融资应急计划
        - 高估值且无收入，对时间延误极其敏感
        - 财务尽调和董事会材料
      - - 人体或第三方验证
        - 没有公开人体研究、外部基准或付费试点证据
        - 缺少验证证据，情景权重无法显著上调
        - 临床 / 产品尽调
      - - 监管和 QMS 路径
        - 没有公开的产品专属监管路线图或质量体系资料包
        - 直接贴眼硬件风险仍是商业化最大堵点
        - 法规事务尽调、预期用途地图和 QMS 审查
      - - 合作伙伴合同和采购韧性
        - 公开证据没有显示排他性、备份或量产准备条款
        - 关键路径伙伴可以决定进度和烧钱速度
        - 商务和运营尽调
      - - 制造准备度
        - 没有公开良率、可靠性或量产数据
        - 缺少可制造性，演示价值不等于产品价值
        - 工程尽调和制造准备度审查
    notes: 在上一轮披露估值下，上述尽调问题都不应被视为可选项；每一项对情景权重的影响都可能超过增量原型新闻。
    claimRefs:
      - CV008
      - CV034
      - CV040
