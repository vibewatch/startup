  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              不应把 Xpanceo 的“产品”描述成一款客户已经能购买的商业智能隐形眼镜。公开记录显示的是一套分阶段架构，由多个面向具体任务的原型组成，每个原型解决最终系统的一部分：AR 显示、泪液感测、IOP
              感测、被动眼动追踪、无线数据传输、供电或储能。换句话说，今天存在的是一组子系统演示和工作流特定概念；一体式镜片仍是未来整合里程碑。这个区分很重要，因为一片镜片到底是由智能手机读取、与头盔配对、使用后放进光谱容器，还是由配套设备供电，会对应截然不同的客户工作流、支持负担和监管路径。


              工作流证据很具体。Xpanceo 的青光眼概念使用镜片上的光学图案，再由智能手机摄像头和 AI 应用作为读出系统。药物监测概念把镜片作为采集表面，随后把分析转移到一个专用容器，用光谱读取药物特征。前沿 AR
              概念则把镜片与头盔或宇航服图像源及外部电源配对。即便是数据读取和无线供电概念，也依赖一个充当能量链路和计算枢纽的配套设备。因此，公开产品地图支持一个冷静结论：Xpanceo
              拥有许多可见的模块级资产，但集成的、可交付客户的产品仍只是已宣布的路线图对象，而不是已经交付的设备。
