      - number: '7.3'
        title: 合作伙伴、依赖与生态风险
        blocks:
          - type: paragraph
            body: >-
              Xpanceo 目前公开可见的护城河离不开合作伙伴集中。一体化显示路线图公开绑定 JBD 的微显示技术，镜片内电池路径绑定 ITEN 的固态微型电池工作，Konica Minolta 则是已披露的 AR
              智能隐形眼镜测试系统伙伴。这些关系在战略上有价值，因为外部合作把多年子系统工作压缩到更短周期；但它们也在一体化产品最脆弱的环节制造依赖风险。本轮审阅的公开材料没有披露备用供应商、排他条款、批量采购承诺，或这些交易对手的量产义务。落到执行层面，JBD、ITEN
              或关键验证伙伴的一次延迟，都可能变成 Xpanceo 一体化演示的延迟，并进一步影响下一轮融资叙事。


              市场结构会放大这种依赖风险。Counterpoint 2026 年 4 月更新称，智能眼镜正在 XR 中占据中心位置，这意味着更大的界面市场先转向侵入性更低、生态支持更强的形态。最清晰的反向可比仍是 Mojo
              Vision：一家技术上严肃的智能镜片先行者，即便拿到 FDA 突破性器械资格，后来也转向 microLED 组件。这段历史不意味着 Xpanceo
              必然失败，但它说明，子系统优秀和品类关注度不会自动转化为商业镜片业务。更现实的解读是，Xpanceo
              近期路径会落在狭窄的工业、前沿或医疗中介楔子市场；在这些场景里，免手持、隐形界面的价值异常高，支持栈也能保持可控。
