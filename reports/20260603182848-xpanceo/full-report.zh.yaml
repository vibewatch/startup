  - id: TV005
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 关联度
      - 局限
    rows:
      - - Xpanceo
        - 最新披露的私募轮次
        - $1.35B 估值，$250M Series A；未有收入、未商业化
        - 设定投资人必须判断的实际决策价格
        - 未披露公开股权结构、收入或监管支撑指标
      - - Magic Leap
        - 私募 XR 融资先例
        - $3.48B 累计融资；曾有 $6B 估值；最近已知估值 $2B；2025 与 Pegatron 达成生产协议
        - 说明 XR 叙事估值既能冲得很高，也会在之后压缩
        - 形态不同，运营历史也比 Xpanceo 长得多
      - - Mojo Vision
        - 智能隐形眼镜里程碑先例
        - 原型加 FDA 突破性设备认定信号，随后转向 micro-LED，并围绕该平台取得后续融资
        - 智能隐形眼镜商业化风险最强的反向可比
        - 镜片阶段的公开估值数据有限
      - - Vuzix
        - 上市智能眼镜 / 波导可比
        - ~$344M June 2026 市值和 $6.28M 2025 收入
        - 已有出货的 XR 专业厂商，尽管有实际收入，估值仍远低于 Xpanceo
        - 小规模公众流通盘和不同产品架构降低直接可比性
      - - Kopin
        - 上市光学 / 显示可比
        - ~$1.09B June 2026 市值和 $39.32M 2025 收入
        - 可作为有收入光学专业厂商的公开高端参照
        - 组件导向和防务敞口不同于 Xpanceo 的集成镜片投资逻辑
      - - Meta Orion / Snap Spectacles
        - 里程碑参照
        - Orion 仍是打磨成熟的原型；Spectacles 目标在 2026 消费者首发
        - 显示大型科技竞争正先从眼镜推进
        - 上述对象是生态参照，不是干净的估值可比
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful public and private analogues visible in the fetched corpus for a pre-commercial
        smart-lens company; it is not an exhaustive XR peer set.
    notes: 不存在完美可比对象。本表用于框定估值纪律，而不是暗示某个公开市场倍数可以机械套用到 Xpanceo。
