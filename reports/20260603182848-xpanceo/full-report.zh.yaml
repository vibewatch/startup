      - number: '5.3'
        title: 部署、整合、验证与路线图
        blocks:
          - type: paragraph
            body: >-
              部署证据在 Xpanceo 已经围绕窄任务展示完整工作流的地方最强。最好的例子是青光眼监测、药物监测和前沿 AR。每个案例中，镜片只是更大操作系统里的一个节点，系统还包括智能手机摄像头、AI
              模型、光谱容器、头盔电子设备或宇航服集成。这意味着，即便单个镜片模块能独立工作，整合风险仍然很高。也意味着公司的近期部署路径更可能先从受限或专业场景开始，而不是大众消费者大规模用它替代手机和眼镜。与
              Mohammed Bin Rashid Space Centre 的航天合作强化了这个判断：项目包括地面模拟、抛物线飞行、材料测试和未来可能的在轨评估，这是可信的验证工作，但不是产品发布证据。


              路线图仍是将来时。到 2025 年 7 月，Xpanceo 称已有 15 个可工作原型；到 MWC 2026，又称跨多代已建成 28 个以上。MWC 2026
              还把关键使能技术框定为首个完全整合原型的组成要素，预计 2026 年底完成，并于 2027 年初公开亮相。这是有意义的里程碑，但投资者应把它当成整合目标，而不是商业化里程碑。Konica Minolta
              测试装置、基于 10,000 次测量训练的 AI 模型，以及内部生物相容性或眼内评估等公开验证信号，显示出工程认真度；但它们还不能替代已披露的人体试验结果、耐久数据、制造良率或监管申报。
