      - number: '2.4'
        title: 增长驱动、采用约束与矛盾信号
        blocks:
          - type: paragraph
            body: >-
              Xpanceo 的增长逻辑不难理解。科学综述持续把智能隐形眼镜描述为一个有前景的平台，可用于非侵入式监测血糖、眼压、炎症标志物和给药。实验室研究展示了透气且生物相容的设计，Xpanceo
              自身的原型节奏也显示子系统快速推进。在品类层面，IDC 数据表明消费者正走向轻量、AI 优先的可穿戴设备；Meta 的 Orion 愿景和 Snap 的 Spectacles
              路线图也验证了市场对无屏计算的长期兴趣。这些都是真实驱动。


              但约束栈比增长栈更长。FDA
              针对隐形眼镜和直接接触医疗器械的指南，强调按接触时长对整机进行生物相容性评估和终点评估。综述文献反复回到同一批障碍：透氧性、舒适性、背景干扰、长期佩戴、无线读出、可规模化制造、临床验证和成本效益。FDA
              获取到的获批传感器型数字健康设备清单中，似乎没有智能隐形眼镜。Mojo Vision 从镜片品类撤退、转向 microLED
              组件，是尤其重要的反向信号，因为它说明即便技术能力很强的团队，也没能跨过从原型可信度到商业产品之间的鸿沟。市场是真实的，但可投资的近期市场比品类叙事暗示的更小、更慢、监管更重。
