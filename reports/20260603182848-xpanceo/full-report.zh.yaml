            body: >-
              Xpanceo
              公开的留存韧性证据几乎空白。已审阅来源均未披露客户数、活跃账户、付费试点、净留存率（NRR）、总留存率（GRR）、流失率、合同期限、续约节奏或满意度指标。可见的售后触点也不存在：没有面向客户的支持文档、公开成功计划或参考评价，读者无法据此判断重复使用质量。这并不等于产品没有粘性。相反，Xpanceo
              提出的若干工作流一旦验证，很可能具备粘性：青光眼监测会嵌进医生和患者的日常流程，太空或工业 AR 会嵌进任务专属操作系统。但这是结构性推断，不是已经证明的留存。


              因此，采购摩擦是核心客户风险。临床路线要过直接接触眼部安全性、生物相容性、校准和报销几道关；前沿路线取决于机构或雇主是否接受配套硬件、头盔或航天服集成，以及受限环境下的可靠性测试；消费路线的信任问题最难，因为它要与智能眼镜这类摩擦更低的替代品竞争。这里的反向类别证据很关键：综述文献仍要求大规模验证，Mojo
              Vision 的转向也说明，哪怕技术上亮眼的智能隐形眼镜项目，也未必能转化为可重复的客户采用。公司没有披露付费客户，首批商业牵引也会从集中客户群起步，早期客户集中和渠道依赖不可避免。
