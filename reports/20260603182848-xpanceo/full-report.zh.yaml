      - number: '1.2'
        title: 创始人、领导层可信度与利益相关方网络
        blocks:
          - type: paragraph
            body: >-
              Xpanceo 的领导层叙事围绕一对创始人展开：一边是创业叙事能力，一边是科学深度。Roman Axelrod 是公司的外部代表，持续把智能隐形眼镜框定为当下个人设备的最终替代者。Dr. Valentyn
              Volkov 负责支撑技术论证；公司材料和伙伴报道都强调他在纳米光子学、材料科学、纳米光学和生物传感上的专长。公司也重度借用外部可信度信号：诺奖得主 Konstantin Novoselov
              担任科学顾问委员会主席，University of Dubai 于 2025 年 6 月签署创新合作，JBD 提供 microLED 显示技术，Konica Minolta 与 Xpanceo 合作测试 AR
              镜片，ITEN 则合作完成集成固态电池概念验证。


              这张网络在战略上有价值，因为 Xpanceo 同时要攻克多项前沿难题：显示、供电、感测、光学、材料、安全和可制造性。与此同时，网络结构也凸显了关键人物风险和整合风险。公开技术叙事仍有很大部分经由 Volkov
              输出，关键使能组件则依赖伙伴执行，而不是已经完成的内部产品栈。以学术和科学深度看，领导团队在年轻初创公司中异常强，但运营证明仍处于商业化前，并且依赖伙伴。
