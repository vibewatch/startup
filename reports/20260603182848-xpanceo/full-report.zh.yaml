      - number: '5.4'
        title: 差异化、信任、安全、隐私与质量控制
        blocks:
          - type: paragraph
            body: >-
              Xpanceo 的差异化是真实的，但大多仍在上游。公司看起来凭借原型广度、材料科学野心和伙伴准入形成差异，而不是靠已证明的制造规模或已获批产品。JBD 给了它一条可信的微显示路径，Konica Minolta
              给了它面向镜片的显示验证工具，ITEN 给了它一条可信的固态电池路线。种子阶段对低维材料和透明柔性电子的讨论，以及公司的论文足迹，也强化了它的材料和光学故事。但公开 IP 信号并不精确：不同来源对公司拥有 20
              件专利申请还是 24 件申请说法不一，论文数量也随日期和页面在 110 到 300+ 之间变化。这仍然支持其在 know-how 和科学招聘上的护城河，但还不是一个完全可衡量的 IP 堡垒。


              信任和合规是公开记录最弱的地方。科学综述和 FDA 指南清楚表明，直接戴在眼球上的智能镜片要面对生物相容性、透氧性、接触时长测试、发热、舒适性和长期可靠性负担。检索到的 FDA
              材料也显示，相邻的传感器型设备可以获批，但这并不能证明隐形眼镜已经获批。公开的 Xpanceo 来源没有披露 FDA 批准、CE
              标志、关键临床结果、正式质量认证，或针对凝视和健康数据的产品级安全与隐私架构。正确结论不是这些控制不存在，而是它们尚未公开。对承销来说，这让产品技术风险集中在验证、隐私和质量体系执行上，而不只是创意生成。
