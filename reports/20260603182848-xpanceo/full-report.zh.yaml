      - number: '8.2'
        title: 融资背景、稀释不确定性与进入纪律
        blocks:
          - type: paragraph
            body: >-
              公开融资事实异常简单，也异常令人不舒服。Xpanceo 披露 2023 年完成 $40M 种子轮，并在 2025 年 7 月以标称 $1.35B 估值完成 $250M Series A 轮；Tracxn
              列示累计融资 $290M、阶段为 Series
              A。但投资人通常需要用来判断该价格是否站得住脚的东西，几乎全部未披露：收入、烧钱速度、股权结构表、期权池、优先股堆叠、董事会权利、客户合同、定价和监管时间表。因此，公开证据支持标题估值，却不支持其底层承销细节。


              进入纪律很重要，因为轮次规模只能被框定，无法确认。如果 $1.35B 是投后估值，Series A 轮大约卖出公司 18.5%；如果是投前估值，投后约为 $1.60B，新钱股权约为
              15.6%。公开来源没有告诉投资人哪种解读正确，也没有披露清算优先权或其他下行保护条款。这意味着当前价格应被视为叙事和里程碑估值，而不是透明的公允价值锚。对新投资人来说，商业证明缺席意味着更审慎的姿态是要求显著更强的尽调证据，或者更好的价格。
