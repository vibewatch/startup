        - 仍要求后续商业化跟上，不能只有打磨漂亮的演示
        - 20%
      - - 基准
        - 集成演示具备技术可信度，但审批、定价和规模化收入仍是未来工作
        - $0.9B 到 $1.4B 区间，约为当前披露估值的 0.7x 到 1.0x
        - 若证据没有加速，持平或小幅下行融资会变得合理
        - 45%
      - - 悲观
        - 演示延期，人体 / 监管证据继续缺位，以眼镜为先的 XR 仍赢得主流采用
        - $0.2B 到 $0.6B 区间，约为当前披露估值的 0.15x 到 0.45x
        - 下轮、救援式融资或战略重置可能性上升
        - 35%
    notes: 本表做的是里程碑估值，不是收入预测。概率加权中点约为 $1.1B 到 $1.2B，低于当前披露估值，因此不支持激进的新资金入场。
