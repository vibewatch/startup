      - number: '4.4'
        title: 公开财务缺口与承销结论
        blocks:
          - type: paragraph
            body: >-
              公开记录让核心承销问题仍未解。投资者仍不知道 Xpanceo
              当前现金余额、实际月度烧钱、价目表、更换节奏、BOM、良率假设、试点转化、客户集中度、毛利率、报销策略、服务或保修负担，以及股权结构保护。这意味着本章可以描述经济形态，但不能验证经济表现。这些缺失尤其重要，因为公司所在品类已有真实反向先例。Mojo
              Vision 曾达到原型和 FDA 突破性器械里程碑，之后却从智能镜片产品转向 micro-LED；Magic Leap 的历史和 Pegatron 生产合作也显示，即便是知名度更高的 XR
              公司，也可能在形成持久商业化前需要巨额后续资本和规模制造支持。


              公开可比公司强化了同样的谨慎。Vuzix 和 Kopin 等已经产生收入的 XR 或光学专业公司，相对于 Xpanceo 披露的 $1.35B
              估值仍规模有限，这提醒投资者，进入市场不会自动创造软件式经济性，也不会消除融资敏感性。因此，财务结论是谨慎但不否定。对一家尚未商业化的智能镜片初创公司来说，Xpanceo
              资金异常充足，技术工作广度也意味着真实期权价值。但收入质量目前未验证，利润率路径高度不确定，资本强度可能很高；在展示可重复付费需求、可信监管路径和可制造的单位经济之前，公司仍依赖未来融资或战略伙伴。
