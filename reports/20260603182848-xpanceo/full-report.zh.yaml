  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反向逻辑与价格敏感性
        blocks:
          - type: paragraph
            body: >-
              Xpanceo 的投资逻辑并不难理解。轻量级 AI 可穿戴设备是真实方向；在这样一家早期硬件公司身上，Xpanceo
              已经拼出异常强的资本底座、可见的原型迭代节奏和科学抱负。如果它能把承诺中的一体化智能镜片变成可信的 2027
              年演示，拿出人体可行性或第三方验证，并落下首个工业或临床中介试点，公司仍可能成为一个新界面品类里的稀缺战略期权。


              但按今天价格，反向逻辑更强。公开证据仍显示，这是一家收入前、商业化前公司：没有披露批准、没有具名付费客户，也没有公开人体试验结果。IDC 和 Counterpoint 都显示，XR
              需求先流向智能眼镜，而不是更具侵入性的可穿戴设备。这能验证后屏幕方向，但也意味着买方接受度正在流向摩擦更低的产品，而 Xpanceo 仍在组装第一片一体化镜片。在 $1.35B
              估值下，关键问题不是技术是否有趣，而是投资人是否已经在为尚未证明的里程碑买单。
