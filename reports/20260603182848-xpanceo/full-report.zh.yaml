            body: >-
              本章最清晰的反向证据是 Mojo Vision。公开来源显示，Mojo 曾拥有原型、IRB 支持的可行性工作和 FDA 突破性器械资格，但公司仍转向 micro-LED
              显示，并在之后围绕新战略融资，而不是继续镜片产品。这一过程削弱了“仅靠技术进展就能在智能镜片中形成持久护城河”的投资逻辑。市场规模来源也不稳定：一家供应商把品类规模定在个位数百万，另一家则预测数亿规模，差异太大，不能当作可靠的竞争保护伞。因此，Xpanceo
              的护城河尚未由市场结构验证。它也许最终能靠整合、舒适性、监管执行或渠道合作赢得护城河，但今天更耐久的护城河在既有生态、制造准入和受监管医疗分销手里，而不是在一个尚未商业化的一体式镜片叙事里。举证责任在商业可重复性，而不只是技术可能性。
