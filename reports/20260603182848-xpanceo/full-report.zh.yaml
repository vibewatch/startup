      - number: '8.4'
        title: 退出就绪度、最终尽调要求与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              从公开记录看，Xpanceo 尚未具备 IPO 就绪度。更可信的退出路径是战略收购、重大平台合作，或在技术和监管大幅降险之后由内部主导下一轮融资。大型
              XR、光学、眼科和医疗科技平台都可能成为合理交易对手，但前提是公司展示的不只是原型广度。关口证据仍然基础：股权结构表清晰度、烧钱速度和现金跑道、合作伙伴耐久性、首个人体或外部验证、监管与质量路径，以及制造就绪数据。没有这些项目，投资人承销的不是退出进程，而是相信未来融资市场仍会奖励这个故事。


              因此，正确的监控纪律应当基于里程碑，而且要足够严格。如果一体化演示时间线实质性滑过 2027
              年初且没有抵消性验证，如果下一轮融资周期前仍看不到人体或面向监管的进展，或如果下一轮看起来像救援式、赞助方集中的融资，那么当前估值逻辑会很快变弱。同样，如果智能眼镜继续赢得主流采用，而直接接触眼部设备仍卡在原型或专科小众市场，消费者替代逻辑会越来越难辩护。今天的正确立场是在已披露估值下不投入新资金，同时把公司放进高信念观察名单，等待证据驱动的重新承销。
