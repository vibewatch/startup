        title: 图表与要点
        blocks:
          - type: callout
            title: 对收入前智能镜片公司来说，资本基础罕见
            body: 已披露 $290M 融资总额让 Xpanceo 拥有比多数直接接触眼球硬件初创公司更长的时间。这不能解决商业化，但确实让持续研发和追逐里程碑比典型种子阶段同业更可信。
            calloutType: strength
            claimRefs:
              - CI003
