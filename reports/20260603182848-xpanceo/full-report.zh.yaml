      - number: '2.5'
        title: 图表与要点
        blocks:
          - type: callout
            title: 正确的市场框定是先楔形、后宇宙
            body: 公开证据支持一个巨大的长期需求池，但近期可变现市场非常小。投资者应先把 Xpanceo 当作楔形市场公司承销，其次才是通用设备平台。
