        title: 格局：直接同业、巨头、相邻公司与替代品
        blocks:
          - type: paragraph
            body: >-
              不能用一个整齐的同业篮子来分析 Xpanceo。已获取语料至少支持四类竞争者：InWith 以及已经转向的 Mojo 项目等直接智能镜片同业；Meta Orion、Apple Vision Pro 和 Snap
              Spectacles 等 XR 设备巨头；Magic Leap 等相邻光学或组件巨头；以及不用镜片也能解决部分同一用户问题的医疗或现状替代品。这很重要，因为买方的选择并不是“现在选 Xpanceo
              还是另一家镜片初创公司”；常常是“以后等 Xpanceo，还是现在用眼镜、头显、临床工作流或受监管的监测产品”。市场报告来源还把可能进入者扩大到眼科巨头和消费电子公司，意味着 Xpanceo
              未来的竞争会是多线作战，而不是与某一个初创公司群体正面对打。
