      - number: '5.2'
        title: 技术与运营架构
        blocks:
          - type: paragraph
            body: >-
              Xpanceo 的架构是混合式的，而不是在镜片层完全自给自足。公开披露指向两条 AR 显示路径：一条是使用外部图像源和镜片内光学元件的全息方案；另一条是与 JBD
              共同开发、更激进的集成微显示路径。感测栈同样模块化：泪液生物传感使用电化学测量和无线传输，IOP 感测使用由 AI
              应用解读的光学图案，被动眼动追踪则使用普通摄像头可读取、无需镜片内主动电子器件的莫尔式微观图案。放在一起看，这些选择说明 Xpanceo
              正试图让眼上设备尽可能薄、尽可能低功耗，同时把计算、部分读出和部分供电任务卸载给配套设备、智能手机、头盔或容器。


              供电是公开架构中最硬的瓶颈。Xpanceo 自己的 ITEN 电池工作直白说明，低功耗生物传感或许可以靠眨眼、热梯度、电化学反应或太阳能电池收集微量能量来支撑，但 AR
              图像投射仍需要持续的毫瓦级功率和高密度储能。这就是公司为什么同时探索无线供电配套设备、现成和定制微电池、专用能量采集器，以及透明柔性电子。在材料上，种子阶段和后续来源都持续指向低维或 van der Waals
              材料、准 2D 金属薄膜和透明柔性电子这些核心使能项。呈现出来的图景技术上自洽，但依赖很重：显示、感测、供电和读出，只有在外部支持栈保持紧密整合时才各自成立。
