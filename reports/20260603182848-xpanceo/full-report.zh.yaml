        title: 能力、定价与进入市场比较
        blocks:
          - type: paragraph
            body: >-
              从能力看，眼镜和头显巨头已经证明了抬眼界面，但硬件比隐形眼镜命题承诺的更笨重。Meta 把 Orion 定位为真 AR 原型，Apple 已经出货重量级空间计算头显，Snap
              仍在通过开发者优先的眼镜项目建设。Xpanceo 的反向定位是最大限度压缩界面：一片镜片最终合并 XR 显示、感测、夜视和变焦。问题在于商业化证明。已获取品类中的公开定价披露很少，但这种缺失对 Xpanceo
              最麻烦，因为公司仍未商业化，也没有展示包装模型；QYResearch 则暗示医疗路径很可能是 B2B，消费路径类似订阅。这意味着公司的最终 GTM
              可能需要按分层变化，而不是放大一套通用商业模型。落到实践，Xpanceo 可能需要一套销售动作服务受监管医疗或工业部署，另一套服务任何未来消费产品；而 Apple 和 Snap
              已经可以复用现有设备、软件和开发者基础设施。
