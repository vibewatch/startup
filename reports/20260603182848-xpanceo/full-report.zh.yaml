    approximationNotes: 矩阵值是对公开证据质量的判断，不是直接的客户健康指标。由于没有公开的付费队列，留存可见度仍然较低。
    claimRefs:
      - CU012
      - CU016
      - CU019
      - CU024
      - CU025
      - CU038
      - CU039
  - id: FR001
    title: Xpanceo 风险热力图——可能性与影响
    type: matrix
    layout: wide
    summary: 将 Xpanceo 主要风险场景放入三列影响矩阵，显示风险最密集地带仍在高可能性 / 关键影响区，核心是监管证明、集成和制造准备度。
    data:
      columns:
        - 中等影响
        - 高影响
        - 关键影响
      rows:
        - label: 极低可能性
          values:
            - 孤立的合作伙伴公关问题
            - 学术合作放缓
            - 小规模展览 / 演示延迟
        - label: 低可能性
          values:
            - 小范围太空测试取消
            - 单一用例优先级调整
            - 非核心功能移除
        - label: 中等可能性
          values:
            - 隐私设计返工
            - 合作条款重新谈判
            - 设备网络安全文档负担拉长排期
        - label: 高可能性
          values:
            - 直到演示阶段，定价和 GTM 仍未明确
            - 下一轮前没有公开 QMS / 良率证据
            - 集成演示时间滑出当前路线图
        - label: 极高可能性
          values:
            - 人体 / 监管证明落后于原型节奏
            - 生物传感器和舒适性约束延续到集成版本
            - 制造和安全证据滞后于商业化
    approximationNotes: 可能性是定性判断，基于截至 2026-06-03 已审阅的材料。影响指对发布时间、融资议价力和估值的可能作用，而不是对当前收入的影响，因为 Xpanceo 尚未商业化。
    claimRefs:
      - CR006
      - CR015
      - CR022
      - CR025
      - CR032
      - CR041
  - id: FR002
    title: 风险传导图——技术和伙伴风险如何流向融资结果
    type: dag
    layout: wide
    summary: 有向无环图展示安全、集成、伙伴和隐私风险如何传导到排期、烧钱速度、监管负担和估值结果。
    data:
      nodes:
        - id: safety
          label: 直接入眼安全性 / 生物相容性证明
        - id: integration
          label: 多子系统集成风险
        - id: partner
          label: JBD / ITEN / Konica / 制造依赖
        - id: privacy
          label: 健康、生物识别和视线数据合规
        - id: cyber
          label: 设备网络安全文档和韧性负担
        - id: schedule
          label: 演示和发布排期滑坡
        - id: burn
          label: 烧钱速度更高 / 开发周期更长
        - id: validation
          label: 外部或人体验证延迟
        - id: financing
          label: 依赖下一轮 / 条款更弱
        - id: valuation
          label: 估值压缩
      edges:
        - from: safety
          to: validation
          label: 需要更多测试和证据
        - from: integration
          to: schedule
          label: 子系统耦合拖慢交付
        - from: partner
          to: schedule
          label: 供应商或伙伴延迟冲击关键路径
        - from: privacy
          to: validation
          label: 必须设计控制和授权同意模型
        - from: cyber
          to: validation
          label: 上市前资料包膨胀
        - from: schedule
          to: burn
          label: 研发周期拉长
        - from: validation
          to: financing
          label: 融资时证据更弱
        - from: burn
          to: financing
          label: 资金需求更高
        - from: financing
          to: valuation
          label: 更依赖资方或条款更苛刻
        - from: schedule
          to: valuation
          label: 叙事可信度变弱
    approximationNotes: 传导路径是定性判断，聚焦可能的因果方向，而不是建模边权重。
    claimRefs:
      - CR013
      - CR015
      - CR020
      - CR021
      - CR022
      - CR039
      - CR040
      - CR041
  - id: FR003
    title: 依赖图——集成智能隐形眼镜路线图周边的关键外部节点
    type: dag
    layout: wide
    summary: 梳理位于 Xpanceo 集成演示关键路径附近的外部合作方和机构，突出其在显示、电池、测试、融资和专业验证上的集中度。
    data:
      nodes:
        - id: xpanceo
          label: Xpanceo 核心路线图
        - id: jbd
          label: JBD 微显示路径
        - id: iten
          label: ITEN 电池路径
        - id: konica
          label: Konica 测试系统
        - id: mbrsc
          label: MBRSC / 太空验证
        - id: sponsor
          label: Opportunity Venture 资本连续性
        - id: manuf
          label: 制造伙伴（未披露）
        - id: reg
          label: 监管机构 / 审批负担
        - id: market
          label: 智能眼镜主导的 XR 市场趋势
      edges:
        - from: jbd
          to: xpanceo
          label: 显示子系统
        - from: iten
          to: xpanceo
          label: 电池子系统
        - from: konica
          to: xpanceo
          label: 验证工具
        - from: mbrsc
          to: xpanceo
          label: 专业用途验证
        - from: sponsor
          to: xpanceo
          label: 融资连续性
        - from: manuf
          to: xpanceo
          label: 未来规模化关口
        - from: reg
          to: xpanceo
          label: 审批和合规关口
        - from: market
          to: xpanceo
          label: 采用基准转向眼镜
    approximationNotes: 该图只纳入公开材料中可见、相关性最高的外部节点；未披露供应商、代工厂和法律顾问关系在这里不可观察。
    claimRefs:
      - CR016
      - CR017
      - CR018
      - CR019
      - CR020
      - CR021
      - CR030
      - CR040
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 从市场兴趣和原型进展，经过证据缺口和估值张力，推导最终建议的决策链。
    data:
      nodes:
        - id: n1
          label: 真实市场方向
          detail: 轻量 AI 可穿戴和 XR 是真实主题，但当前采用路径由眼镜主导
        - id: n2
          label: Xpanceo 进展
          detail: $290M 已披露融资、28+ 个原型，集成演示目标仍是 2027 年
        - id: n3
          label: 缺失证明
          detail: 没有公开收入、具名付费客户、审批或人体验证
        - id: n4
          label: 当前价格锚点
          detail: $1.35B 估值已计入重要里程碑兑现
        - id: n5
          label: 可比公司约束
          detail: Magic Leap 和 Mojo 提示估值压缩风险；Vuzix 和 Kopin 给出公开市场的底部和天花板
        - id: n6
          label: 结论
          detail: 当前价格不适合新资金进入；只有证明改善或入场价格重置，才值得跟踪
      edges:
        - from: n1
          to: n4
          label: 支撑叙事
        - from: n2
          to: n4
          label: 支撑野心
        - from: n3
          to: n4
          label: 削弱支撑
        - from: n4
          to: n5
          label: 必须对照检验
        - from: n5
          to: n6
          label: 导出
    claimRefs:
      - CV001
      - CV009
      - CV018
      - CV019
      - CV025
      - CV042
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 隐含估值对里程碑证据的敏感性，而不是对传统收入倍数的敏感性。
    data:
      items:
        - label: 延迟 / 没有新证明
          value: 0.5
          detail: 若时间线滑坡且验证仍缺失，以十亿美元计的示意性下行估值
        - label: 仅按时完成集成演示
          value: 1.2
          detail: 演示有帮助，但没有客户或监管证明，估值标记不会比当前价格重估太多
        - label: 演示 + 第三方或人体可行性数据
          value: 1.8
          detail: 估值支撑的第一次实质性去风险事件
        - label: 演示 + 付费试点 / 开发协议
          value: 2.3
          detail: 早期商业证据能更好衔接下一轮
        - label: 演示 + 监管和制造资料包
          value: 2.7
          detail: 公开信息下，2027-2028 年最强、也较现实的里程碑重估路径
    claimRefs:
      - CV026
      - CV027
      - CV028
      - CV029
      - CV031
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 以百万美元计的情景估值区间，并与当前披露估值锚点对比。
    data:
      items:
        - label: 悲观情景
          low: 200
          mid: 400
          high: 600
          unit: M USD
          detail: 若时间线和证明恶化，路径是降价融资或战略重置
        - label: 当前披露估值
          low: 1350
          mid: 1350
          high: 1350
          unit: M USD
          detail: 2025 年 7 月 A 轮估值参照点
        - label: 基准情景
          low: 900
          mid: 1150
          high: 1400
          unit: M USD
          detail: 技术进展延续，但商业和监管证明仍不完整
        - label: 乐观情景
          low: 2000
          mid: 2500
          high: 3000
          unit: M USD
          detail: 按时完成集成演示，加上第一次实质外部验证和试点证据
    claimRefs:
      - CV001
      - CV027
      - CV028
      - CV029
      - CV031
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 按投资委员会风格，从价格敏感承销最在意的维度给 Xpanceo 打分。
    data:
      items:
        - label: 市场方向
          value: 7
          detail: AI 可穿戴和抬头界面是真实主题，但近期路径由眼镜主导
        - label: 产品野心
          value: 8
          detail: 很少有初创公司尝试如此高的界面压缩程度和如此宽的子系统覆盖
        - label: 证明质量
          value: 4
          detail: 已有原型进展，但人体、监管和商业证明缺失
        - label: 商业证据
          value: 2
          detail: 没有公开收入、具名付费客户或定价模型披露
        - label: 竞争护城河
          value: 6
          detail: 科学野心和合作伙伴阵容真实存在，但生态和渠道护城河目前在别处
        - label: 风险画像
          value: 3
          detail: 直接入眼监管、集成、制造和融资风险仍高度集中
        - label: 估值纪律
          value: 2
          detail: 按公开信息做情景测算，当前私募估值几乎不给错误留空间
        - label: 证据质量
          value: 5
          detail: 核心融资和路线图事实可见，但股权结构表和运营指标不可见
    claimRefs:
      - CV003
      - CV004
      - CV010
      - CV022
      - CV025
      - CV040
