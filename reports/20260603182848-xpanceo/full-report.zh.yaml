      - number: '7.2'
        title: 运营、质量、安全与集成风险
        blocks:
          - type: paragraph
            body: >-
              第二组主要风险在运营端：Xpanceo 已展示多个模块，但组合系统仍停留在未来时。MWC 2026
              材料描述的是关键使能技术，而不是已经部署的一体化镜片；多个公开工作流仍依赖头盔图像源、智能手机拍摄、专用容器、配套设备、天线或眼外供电。对一个商业化前的平台来说，这种架构可以理解，但它也意味着 Xpanceo
              要解决的不是单个工程问题，而是一整套紧耦合问题：电力、热量、光学、舒适度、无线传输、校准、封装和用户工作流。智能隐形眼镜综述仍把透氧性、长时间佩戴、热安全、校准稳定性和规模化制造列为未解障碍；角膜缺氧研究也提醒外界，眼睛作为部署环境容错极低。


              公开缓释因素真实存在，但仍不成熟。Xpanceo 超过 28 个原型、Konica Minolta 测试系统、ITEN 微型电池概念验证，以及 10,000
              次测量的青光眼模型，都降低了公司只是概念项目的概率。但这些数据点没有回答最难的规模化问题：生产良率、续航、失效模式、供应商认证、人体佩戴时长或正式质量认证。公开来源也没有显示关键子系统的第二供应来源安排或量产承诺。对投资人来说，核心结论是技术进展确实存在；但剩余风险仍高，因为子系统成功并不能保证一体化角膜可穿戴设备在真实场景里安全、可靠、可制造，也足够易于采用。
