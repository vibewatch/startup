  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律、隐私与责任风险
        blocks:
          - type: paragraph
            body: >-
              Xpanceo 最高强度的风险仍是监管证明：这是一款直接接触眼部的设备，同时叠加 AR 显示、健康监测、AI 读数和联网配套设备。FDA
              来源说得很清楚，隐形眼镜属于医疗器械，生物相容性评估取决于身体接触的性质和持续时间。关键在于，Xpanceo
              并不是要推出一片被动镜片；它试图商业化一款戴在角膜上的设备，并且可能围绕青光眼、泪液生物标志物和用药监测提出诊断或监测主张。本轮审阅的公开材料仍未披露 FDA 批准、CE
              标志、关键临床结果或商业发布。公开的青光眼验证叙事令人鼓舞，但范围很窄：Xpanceo 称其 AI 模型已用 10,000 次测量训练，并可在人工眼模型上工作，这不等于在人类临床中与眼压计等效。


              法律和隐私层面同样重要。如果 Xpanceo 商业化眼动追踪或健康监测，公司就需要在多个司法辖区处理敏感的生物识别和健康数据；这些类别会触发特殊处理条件或数据泄露通知风险。GDPR 第 9
              条把用于唯一识别个人的生物识别数据和健康相关数据列为特殊类别个人数据，FTC 的健康数据泄露通知规则也会给个人健康记录式数据流带来事后义务。FDA 的 2026
              年网络安全指南又给联网网络设备增加了一层负担：设计、标签和上市前文件必须证明网络韧性，而不只是光学或生物传感性能。Xpanceo 最终可能搭起合适的控制体系，但公开记录尚未展示产品级隐私架构、QMS
              栈或安全包。因此，剩余监管和设备责任风险仍排在本章最前面。
