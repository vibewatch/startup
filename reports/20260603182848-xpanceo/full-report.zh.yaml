      - number: '1.3'
        title: 融资时间线、里程碑与反向背景
        blocks:
          - type: paragraph
            body: >-
              即使部分运营指标不清楚，公开融资故事也很直接。Xpanceo 2023 年 10 月种子轮报道金额为 $40M，2025 年 7 月 Series A 为 $250M，两轮均由 Opportunity
              Venture (Asia) 领投。Series A 对应 $1.35B 估值，并把公司推入独角兽行列。公司和第三方来源都把这轮融资描述为在 MENA 以及更广泛 XR /
              可穿戴品类中都异常大的融资，这意味着估值已经嵌入了非常激进的技术和商业执行预期。此后的里程碑节奏以原型为主：GITEX 2025 展示了六款镜片，MWC 2026 强调跨多代的 28
              个以上原型，管理层则把首个集成原型的完成目标定在 2026 年底，并计划 2027 年初公开演示。


              反向背景同样重要。公开材料没有披露人体试验结果、监管批准、经常性收入或具名付费客户。智能隐形眼镜领域文献仍在强调验证、安全、舒适性、校准和制造方面的未解挑战。品类历史也说明，技术进展并不保证商业化：Mojo
              Vision 放弃了智能隐形眼镜项目，转向销售 microLED 技术。Xpanceo 最终也许能在前人受阻的地方跑通，但公司概况不能把独角兽估值当成商业化风险已经解决的证据。
