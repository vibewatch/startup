companyProfile:
  summary: >-
    Xpanceo 是一家位于 Dubai 的深科技公司，由 Roman Axelrod 和 Dr. Valentyn Volkov 于 2021 年创立，目标是打造一款智能隐形眼镜，把 XR 显示、生物标志物感测、眼压监测、夜视和
    AI 辅助合进一个可穿戴设备。公开披露显示，公司在这个阶段拿到了罕见融资——2023 年 $40M 种子轮，随后 2025 年以 $1.35B 估值完成 $250M Series
    A——但业务仍未商业化，没有公开收入、具名付费客户或监管批准。
