      - number: '2.2'
        title: 受证据约束的市场测算视角
        blocks:
          - type: paragraph
            body: >-
              对 Xpanceo 做可信的市场测算，必须使用多重视角，而不是一个自上而下的品类数字。临床视角要从疾病负担和患者需求出发：WHO 称至少 2.2B
              人存在近视或远视损伤，并把青光眼和糖尿病视网膜病变列为主要原因之一。American Academy of Ophthalmology 对 JAMA Ophthalmology 的 2024 年摘要估计，2022
              年美国有 4.22M 成年人患有青光眼；IDF 则称全球每 9 人中就有 1
              人患糖尿病。这些患病率数字说明，连续或更便利监测的临床需求非常大，但在下一个产品周期中，真正能由高端智能隐形眼镜服务的只会是很窄的一部分，因为任何这类设备都必须证明舒适性、安全性、校准能力和报销匹配。


              消费计算视角不同。IDC 报告称，2025 年 XR 设备出货量反弹 44.4%，且由智能眼镜而非头显引领，说明需求正转向更轻、更常开形态。Meta 的 Orion 论述和 Snap 的 Spectacles
              路线图指向同一方向：后屏幕计算作为品类趋势是真实的。但这些来源也解释了为什么 Xpanceo 的 SAM 远小于整个 XR
              市场。眼镜和头显已经拥有分销、开发者工具和用户教育优势。一款直接戴在眼球上的镜片必须先跨过更高的信任和安全门槛，才能捕捉相近需求。结论是楔形市场：真正的近期 SOM
              很可能先来自专业临床或高端前沿部署，更广泛的消费级 XR 在后面。
