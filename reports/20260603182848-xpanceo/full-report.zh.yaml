      - - 工业或现场 AR
        - 雇主 ROI 和安全审查
        - 头盔或配套设备生态
        - 相比现有眼镜或头盔 HUD，集成负担更重
        - 如果收益不明显，买方可能偏好侵入性更低的替代品
        - 要求具名工业试点候选方和可量化任务改进目标
      - - 消费 XR
        - 销售现场的信任和舒适度
        - 零售和支持渠道尚未公开
        - 直接贴眼佩戴接受度，需要对比智能眼镜替代品
        - 消费者犹豫会让需求落后于技术准备度
        - 要求发布市场、价格带和退货政策假设
    notes: 各细分场景的采购摩擦不同。同一硬件平台面对诊所、机构、雇主或消费者时，可能需要完全不同的渠道、审批关口和证据门槛。
