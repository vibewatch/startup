chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品野心与当前规模
        blocks:
          - type: paragraph
            body: >-
              Xpanceo 把自己定位为后屏幕计算公司，而不是传统眼镜初创公司。在官方材料中，公司描述的是一款隐形、无重量感的智能隐形眼镜：戴在眼球上，同时集成 XR 显示、生物标志物感测、无线连接和 AI
              辅助。这个定位很关键，因为 Xpanceo
              试图把多个硬件类别——智能手机、智能手表、智能眼镜，以及部分医疗可穿戴设备——压缩进一个界面。因此，公司的故事既异常大胆，也异常依赖多套子系统的整合；其他初创公司通常会把这些子系统分开商业化。


              公开证据支撑了公司身份和阶段的基本事实。Xpanceo 于 2021 年在 Dubai 由 Roman Axelrod 和 Dr. Valentyn Volkov 创立。Tracxn 将其归类为 Series A
              公司，披露融资 $290M，估值 $1.35B。2025 年 7 月的独角兽公告称，公司在扩充实验室能力的同时，科学家、工程师和商业负责人从 50 人增至 100 人。到 MWC
              2026，管理层称多代原型数量已超过 28 个，但公司仍把首个完全整合产品描述为未来发布，而不是已经推出的设备。强资本加尚未商业化，正是投资者必须抓住的核心事实组合。
