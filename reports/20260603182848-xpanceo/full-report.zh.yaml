            body: >-
              Xpanceo 确实有具名外部证明，但投资者需要正确分类。公开记录中最接近终端用户的强证明是与 Mohammed Bin Rashid Space Centre
              的合作。该项目包括实验室验证、地面模拟、抛物线飞行测试，以及未来可能的在轨评估，实质上强于普通新闻稿。但它仍是一条验证路径，不是已披露的采购证据。University of Dubai
              关系也很具体，但最好理解为生态和应用研究证明：联合研发、实验室准入、实习、教育用例和真实世界试点。它不是生产客户付费购买设备的证据。


              会议材料制造了类似区分。MWC 2026 和 GITEX 2025 都显示 Xpanceo 能向外部受众展示面向具体用例的工作流，MWC25
              还明确称访客可以与技术互动。这好过隐身模式，但活动互动不是留存账户。本章中的具名证明因此集中在合作者、测试伙伴和展示项目周围。这有帮助，因为它显示了外部兴趣和一定运营认真度；也有限制，因为这些具名证明面都没有披露商业条款、重复使用、席位数、部署单元，或从演示和验证转化为收入的路径。
