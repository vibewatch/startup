        - 准确性、校准和医疗信任
        - 如果临床医生不信任数据质量，监测工作流就卖不动
        - 要求与标准眼压测量对比，并说明报销路径
      - - 用药监测
        - 专科诊所或治疗项目采用
        - 光谱检测容器与护理路径集成
        - 佩戴镜片后的额外流程复杂度
        - 佩戴后的容器步骤可能太复杂，难以作为简单消费品销售
        - 要求目标疾病项目、周转时间和灵敏度阈值
      - - 泪液健康读数
        - 验证和消费者理解
        - 手机联动读数和配套电子设备
        - 信号干扰和校准
        - 健康监测承诺能吸引用户，但测量漂移会让用户失望
        - 要求纵向校准数据以及假阳性 / 假阴性率
      - - 太空或任务 AR
        - 机构安全审查和任务集成
        - 航天服、头盔和遥测系统
        - 恶劣环境可靠性和漫长采购周期
        - 任务采购方需要证明镜片能提升安全或速度，而不只是新奇
