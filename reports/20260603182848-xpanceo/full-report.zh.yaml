      - number: '4.2'
        title: 成本结构、利润率驱动与单位经济约束
        blocks:
          - type: paragraph
            body: >-
              Xpanceo 的成本结构看起来研发密集、依赖伙伴，也不像软件。2025 年 7 月独角兽公告称，公司在扩充实验室能力的同时，科学家、工程师和商业负责人从 50 人增至 100 人；Xpanceo
              自己的研究页面强调 300
              多篇科学论文或文章。这是一家前沿研究组织的画像，不是轻资本数字产品团队。公开语料描述的子系统也强化了这个结论：集成微显示、定制准直、无线供电、配套设备计算、生物传感、天线与柔性电子整合、电池概念验证，以及首创光学测试基础设施。每一项都指向昂贵的迭代循环；毛利率优化甚至还没开始。


              利润率路径同样受监管和可制造性现实约束。FDA
              针对直接接触组织器械的指南强调，要对成品器械做生物相容性评估，并按接触时长评估生物学终点。近期智能隐形眼镜综述也强调，透氧性、润湿性、长期佩戴、背景干扰、可规模化制造和临床转化仍是未解障碍。放在一起看，这些来源意味着
              Xpanceo 的近期经济性会由工程、验证和质量成本主导，而不是由可变利润率优化主导。即便未来软件、分析或监测层能带来有吸引力的贡献利润率，公司也必须先吸收硬件
              BOM、测试、工装、监管和支持负担。公开披露的销售效率指标也不存在：没有
              CAC、回本周期、漏斗转化或销售周期数据。唯一可见的代理信号是以展会和合作伙伴为主导的进入市场动作，这或许能服务早期试点，但还不是可重复、高效获客的证据。
