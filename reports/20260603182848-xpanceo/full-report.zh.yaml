  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 买方、用户、付款方与分层地图
        blocks:
          - type: paragraph
            body: >-
              Xpanceo
              的公开材料没有显示真实客户名单，因此客户章节必须从工作流证据而不是合同证据出发。工作流证据支持三条可能的早期路径。第一条是临床监测。在这条路径中，用户是患者，但买方和付款方很可能是眼科诊所、医院、专科服务提供方或保险支持项目，而不是为新奇感购买设备的消费者。Xpanceo
              目前面向医疗的概念——青光眼管理、药物监测和泪液读数——都对应这样的问题：医疗信任、重复测量和报销逻辑，比大众消费营销更重要。


              第二条路径是前沿或工业 AR，雇主、机构或任务项目负责购买和付款，宇航员、飞行员、急救人员、操作员或精英运动员作为用户。这条路径与公司今天的公开证明更匹配，因为 Xpanceo
              反复强调眼镜会造成遮挡、而配套硬件可以接受的环境。第三条路径是最终的消费级 XR，买方、用户和付款方合并为同一个人。这条路径在战略上仍重要，但公开证据不足。最强的地理信号也不是全球消费需求，而是与 UAE
              相关的生态集中：本章审阅到的具名外部证明面集中在 Dubai 及周边机构关系，而不是一个广泛分布的客户基础。
