  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型、变现路径与 GTM 姿态
        blocks:
          - type: paragraph
            body: >-
              Xpanceo
              尚未披露收入、具名付费客户、标价或商业发布。因此，公开记录只能支撑一个前瞻性的收入地图，而不是当前经营表现。最清晰的变现线索来自产品定位。官方和第三方活动报道显示，在任何可信的大众消费推出之前，Xpanceo
              正先推动工业和医疗相邻用例：MWC 2026 围绕可部署的工业应用来框定公司，而 MWC 2025 和 GITEX 2025 突出了青光眼监测、泪液生物传感、AR
              显示、无线数据传输和配套设备架构。这在财务上很关键，因为它暗示未来会有多种收入机制，而不是一个通用 SKU。


              落到实践，Xpanceo 未来的 P&L
              可能混合硬件销售、配套设备套装、企业试点合同、临床医生介导的监测项目、软件或分析费，也可能在更后期加入消费订阅或应用界面。但这些收入线目前没有任何一条在公开层面落地。MWC 2025
              披露配套设备同时充当充电器和主计算枢纽，说明第一款可销售包装不太可能是一片独立镜片；更可能是带配件、软件和支持元素的系统销售。科学综述支持医疗和生物传感机会，但也强调成本效益、临床准确性和患者依从性仍需大规模验证。财务上的正确读法不是“许多收入流已经得到验证”，而是“有许多可能的变现分支，但没有公开转化数据”。工业硬件部署、诊所介导的监测服务，以及任何未来消费级
              XR 产品，最终收入确认可能差异很大，使当前公开证据不足以承销 ASP、留存或收入质量。
