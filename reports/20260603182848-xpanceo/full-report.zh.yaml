      - number: '4.3'
        title: 资本充足性、烧钱框架与融资依赖
        blocks:
          - type: paragraph
            body: >-
              如公司概况所述，Xpanceo 迄今只披露了两轮融资：2023 年 10 月 $40M 种子轮，以及 2025 年 7 月 $250M Series A；Tracxn 显示累计披露融资 $290M，处于
              Series A 阶段。2025 年 7
              月官方公告还称，新资金将用于完成首款智能隐形眼镜开发，扩充研发、产品、设计和运营团队，并加速走向市场。对一家收入前、直接接触眼球的硬件公司来说，这是强资本基础。它应该足以让 Xpanceo
              比多数智能镜片初创公司在牌桌上留得更久。


              难点在于，公开烧钱和现金数据仍缺失。唯一可辩护的公开算术只是历史框架：从种子轮公告到 Series A 完成间隔约 20.7 个月；如果种子轮是当时唯一可用资金，并且到 2025 年 7
              月已全部消耗，则种子期平均烧钱上限约为每月 $1.93M，或每年 $23.2M。实际平均烧钱很可能低于这个上限，因为公司通常不会在现金精确归零时才完成新一轮融资；但这个种子期均值也不能作为后 Series A
              阶段的现实预测。管理层明确计划扩大员工和运营，同时推进商业化，这很可能抬高持续支出。因此，正确的公开结论有两点：Xpanceo
              在当前阶段比多数同业资金更充足，但仍依赖融资，因为没有经营收入抵消验证、可制造性和市场进入的现金需求。下一次融资触发因素很可能由证据驱动，而不是由原型数量驱动：付费试点、面向监管的进展、外部验证和制造准备度，比又一次概念演示更重要。
