      - number: '6.2'
        title: 采用轨迹与当前证明面
        blocks:
          - type: paragraph
            body: >-
              采用故事是真实的，但目前仍以原型、演示和验证项目来衡量，而不是以已披露账户衡量。2023 年公开报道称，Xpanceo 已经为 AR、健康监测、夜视或变焦分别搭建原型路径。MWC25
              材料随后把故事从概念推进到现场互动，称访客可以测试从智能隐形眼镜向手机传输数据。GITEX 2025 又把证明面扩展到六个原型，覆盖 AR 视觉、头盔辅助
              AR、面向葡萄糖的健康读数、供电或数据配套设备、集成微电池和 IOP 感测镜片。到 MWC 2026，公司称跨多代已建成 28
              个以上原型，并展示了覆盖药物监测、青光眼管理、航空航天、运营和精英运动表现的独立应用。


              从产品开发角度看，这是一条有意义的采用轨迹，但它还不是客户轨迹。同一批 MWC 2026 材料仍把首个完全整合原型框定为未来里程碑，目标是在 2027 年初公开亮相。正确解读是，Xpanceo
              拓宽了可信用例数量，也提高了用户工作流的具体性，但还没有跨过进入公开可证商业部署的门槛。对本章来说，新鲜度很重要：2026 年证据提高了买方地图和试点逻辑的精度，但没有关闭商业证明缺口。
