      - number: '2.3'
        title: 买方、用户和付款方分层
        blocks:
          - type: paragraph
            body: >-
              Xpanceo 可能的买方地图分成三条不同采用路径。第一条是医疗路径，用户是患者，但买方和付款方可能是医疗服务提供方、医院系统、眼科诊所、糖尿病管理项目或保险方。在这个分层中，待完成任务不是未来主义
              XR，而是更好的监测、更早的干预和更少的门诊。第二条是消费级或专业消费级 XR 路径，买方、用户和付款方一开始合并为同一个人。这里，镜片必须与现有屏幕的便利性竞争，也要与已经能在不直接接触眼球的情况下提供轻量
              AI 辅助的智能眼镜竞争。第三条是企业或前沿路径，买方和付款方是雇主或机构，用户则是外勤人员、飞行员、宇航员、赛车手或国防人员。


              这种分层很重要，因为每条路径对应不同的证明负担。医疗买方需要验证、准确性和报销逻辑。消费买方需要舒适性、美观、隐私和明确的日常用途。企业买方需要任务完成、可靠性、安全性和总拥有成本逻辑。Xpanceo 自己在
              MWC 2026 的信息也贴合这种分阶段结构：它强调药物监测、青光眼管理和前沿 AR，而不只是泛泛的消费级镜片。这种框定在战略上合理，因为它比“一步替代所有个人设备”的头号承诺更符合可能的早期市场顺序。
