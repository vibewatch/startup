callouts:
  - calloutType: strength
    title: Rare capital base for a pre-revenue smart-lens company
    body: |-
      The disclosed $290M funding total gives Xpanceo materially more time than most direct-eye hardware startups ever get. That does not solve commercialization, but it does make continued R&D and milestone pursuit more credible than at a typical seed-stage peer.
    claimRefs: [CI003, CI029]

  - calloutType: risk
    title: Burn and runway remain opaque even though the balance-sheet story is headline-rich
    body: |-
      Investors know the round sizes, but they still do not know current cash, burn, or runway. That gap matters because the company is expanding toward commercialization while still disclosing no revenue or customer base.
    claimRefs: [CI004, CI028, CI036]

  - calloutType: insight
    title: Xpanceo is likely a multi-model business, not a single-SKU consumer gadget story
    body: |-
      The public product map points toward enterprise, medical, and consumer monetization branches that would recognize revenue differently and carry very different margin structures. Underwriting should therefore focus on which wedge wins first rather than assume one universal XR hardware model.
    claimRefs: [CI007, CI008, CI010, CI012]

