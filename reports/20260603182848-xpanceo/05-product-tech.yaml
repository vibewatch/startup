- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Domain
  - Public evidence
  - Current status
  - Why it matters
  - Diligence ask
  rows:
  - - Biocompatibility
    - FDA guidance plus Xpanceo space-test announcement mention biocompatibility and in-eye evaluations
    - Early-stage / not publicly complete
    - Device sits directly on ocular tissue
    - Request ISO 10993 plan, test reports, and wear-duration protocol
  - - Contact-duration endpoints
    - FDA endpoint framework varies by body-contact category and duration
    - Known regulatory requirement
    - Longer wear raises burden for direct-eye hardware
    - Map intended wear duration to endpoint package and submission plan
  - - Thermal and electrical safety
    - Battery POC discusses heat, overvoltage, and failure-mode constraints; wireless-power posts discuss safety claims
    - Partially addressed in public materials
    - Heat or electrical faults on the eye are unacceptable
    - Request thermal envelope, SAR / radiation analysis, and fault-response data
  - - Clinical validation
    - AI model training counts and internal evaluations are public, but clinical outcome data are not
    - Insufficient public evidence
    - Engineering demos do not equal medical proof
    - Request pilot-study design, accuracy metrics, and endpoint definitions
  - - Privacy and cybersecurity
    - Health and gaze data workflows are visible, but product-specific security architecture is not
    - Publicly undisclosed
    - Health and eye-tracking data are sensitive
    - Request data-flow map, encryption architecture, retention policy, and threat model
  - - Manufacturing quality
    - Konica rig and manufacturing-compatible module language exist, but no formal quality certification is public
    - Publicly undisclosed
    - Scaling a soft ocular device depends on process control
    - Request quality-system documents, supplier controls, and yield metrics
  - - Regulatory status
    - No public FDA clearance, CE mark, or marketed smart lens found in reviewed sources
    - Pre-clearance / pre-commercial
    - Commercial launch depends on clearance pathway
    - Request FDA / notified-body strategy, pre-submission history, and target indications
  notes: The key trust conclusion is not that Xpanceo is unsafe; it is that the public record is far stronger on concept validation than on formal trust and compliance evidence.
