  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: integrated-prototype-specs
    missingEvidence: Public sources do not disclose integrated-prototype specs such as field of view, brightness, latency, battery life, continuous wear duration, weight, or thermals for the all-in-one lens target.
    whyItMatters: The public roadmap hinges on integration, but investors cannot assess whether the combined product will be useful or safe without system-level performance data.
    diligencePath: Request the integrated prototype specification sheet, test plan, and acceptance criteria for the end-2026 build.
    relatedQuestionRefs:
    - QE004
    - QE006
    - QE014
    - QE025
  - type: missing-source
    severity: blocking
    topic: clinical-and-regulatory-path
    missingEvidence: No public human-study outcomes, FDA or CE submission history, indication definition, or regulatory classification strategy were found for Xpanceo’s smart-lens products.
    whyItMatters: Direct-eye medical or hybrid wearable products cannot be underwritten without a credible clinical and regulatory path.
    diligencePath: Request pre-submission correspondence, study protocols, comparator metrics, and the intended first regulated indication.
    relatedQuestionRefs:
    - QE016
    - QE017
    - QE025
  - type: private-evidence-only
    severity: material
    topic: manufacturing-quality-and-yield
    missingEvidence: Public materials mention manufacturing compatibility and test systems but do not disclose yields, process capability, defect modes, supplier qualification, or formal quality certifications.
    whyItMatters: Lens-scale electronics and batteries can fail even when prototypes work; commercialization depends on repeatable manufacturing and quality control.
    diligencePath: Request process-flow documentation, pilot-line yield data, supplier map, and quality-management certifications or audits.
    relatedQuestionRefs:
    - QE012
    - QE015
    - QE025
  - type: missing-source
    severity: material
    topic: privacy-and-cybersecurity-controls
    missingEvidence: No product-specific public architecture was found for encryption, identity, storage, retention, consent, or secure handling of gaze and health data.
    whyItMatters: Gaze vectors, tear biomarkers, and medical readouts are sensitive data categories that can materially affect adoption and compliance risk.
    diligencePath: Request system data-flow diagrams, security design review, privacy impact assessment, and retention / deletion policy.
    relatedQuestionRefs:
    - QE018
    - QE025
  - type: private-evidence-only
    severity: material
    topic: ip-and-partner-dependency
    missingEvidence: Public sources do not provide a complete patent ledger, freedom-to-operate analysis, exclusivity terms with JBD / Konica / ITEN, or fallback supplier strategy.
    whyItMatters: If partner access is part of the moat, investors need to know whether it is durable and contractually protected.
