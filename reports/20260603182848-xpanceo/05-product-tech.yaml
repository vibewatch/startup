tables:
- id: TE001
  title: Product module / prototype matrix
  columns:
  - Module / product line
  - Current user workflow
  - Public maturity
  - Key enabling tech
  - Differentiation
  - Diligence gap
  rows:
  - - AR vision lens with microdisplay
    - Wearer receives visual overlays in-lens; currently shown in demos rather than field deployment
    - Subsystem prototype / public demo
    - Microdisplay, optical system, external sensors or collimation optics
    - Direct-eye AR without glasses bulk
    - Need brightness, wear-time, heat, and human-factors data
  - - Holographic frontier / helmet lens
    - Lens pairs with helmet or suit image source and external power for constrained environments
    - Subsystem prototype / public demo
    - Holographic optical element, helmet companion, wireless power/content link
    - Works where glasses are obstructive or unsafe
    - Need named users, environmental qualification, and durability data
  - - Health readings lens
    - Tear-fluid sensor sends readings to smartphone or companion
    - Subsystem prototype / calibration ongoing
    - Electrochemical biosensor, wireless data link
    - Non-blood biomarker readout from tears
    - Need calibration, interference, and clinical accuracy data
  - - IOP / glaucoma lens
    - User scans optical pattern with smartphone AI app to estimate eye pressure
    - Subsystem prototype / public validation demo
    - Optical pressure-responsive pattern, AI readout model
    - Non-invasive monitoring workflow outside clinic visits
    - Need human comparison against clinical tonometry
  - - Medicine monitoring lens + container
    - Lens is worn, then placed in spectroscopy container to detect drug signatures
    - Subsystem prototype / workflow concept
    - Gold nanoparticles, spectroscopy container, tear analysis
    - Targets therapy monitoring rather than generic wellness
    - Need assay sensitivity/specificity and turnaround benchmarks
  - - Passive eye-tracking module
    - Standard cameras in laptops, vehicles, or helmets infer gaze from lens patterns
    - Subsystem prototype / published announcement
    - Microscopic gratings, moiré patterns, passive optical marker
    - No active electronics or dedicated lens power required
    - Need third-party validation and deployment software details
  - - Companion device / antenna
    - Portable accessory supplies power/data and acts as compute bridge
    - Subsystem prototype / enabling module
    - High-efficiency antenna, wireless power transfer, data relay
    - Moves bulk and power away from the eye
    - Need battery life, ergonomics, latency, and safety envelopes
  - - Battery + materials platform
    - Custom battery and thin electronics support short-burst AR and sensing
    - Proof of concept / enabling module
    - Solid-state microbattery, transparent flexible electronics, encapsulation
    - Addresses the hardest bottleneck in lens integration
    - Need yield, cycle life, manufacturability, and failure-mode data
  notes: Rows describe the public product-tech surface that is visible today. Xpanceo has not published a complete bill of materials or commercial SKU list, so this is a module map rather than a shipping product catalog.
