- id: architecture-stack
  title: Technology and operating architecture
  body: 'Xpanceo’s architecture is hybrid rather than fully self-contained at the lens layer. Public disclosures point to two AR display paths: a holographic approach that uses an external image source and optical element in the lens, and a more ambitious integrated-microdisplay path developed with JBD. The sensing stack is similarly modular: tear-fluid biosensing uses electrochemical measurement and wireless transfer, IOP sensing uses an optical pattern interpreted by an AI app, and passive eye tracking uses moiré-style microscopic patterns readable by ordinary cameras without active electronics in the lens. Together, those choices suggest Xpanceo is trying to keep the on-eye device as thin and low-power as possible while offloading compute, some readout, and some power tasks to a companion, smartphone, helmet, or container.


    Power is the hardest bottleneck in the public architecture. Xpanceo’s own ITEN battery work states plainly that low-power biosensing may be supported by harvesting tiny amounts of energy from blinking, thermal gradients, electrochemical reactions, or solar cells, but AR image projection still needs sustained milliwatt-scale power and dense storage. That is why the company is simultaneously exploring wireless-power companions, off-the-shelf and custom microbatteries, dedicated energy harvesters, and transparent flexible electronics. On materials, seed-stage and later sources consistently point to low-dimensional or van der Waals materials, quasi-2D metallic films, and transparent flexible electronics as core enablers. The picture that emerges is technically coherent but dependency-heavy: display, sensing, power, and readout each work only if the external support stack remains tightly integrated.'
