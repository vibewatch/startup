- id: leadership-network
  title: Founders, leadership credibility, and stakeholder network
  body: 'Xpanceo’s leadership narrative centers on a founder pair that mixes entrepreneurial storytelling with scientific depth. Roman Axelrod is the external face of the company and consistently frames the smart lens as the eventual replacement for today’s personal devices. Dr. Valentyn Volkov anchors the technical case, with company materials and partner coverage describing expertise in nanophotonics, materials science, nano-optics, and biosensing. The company also leans heavily on external credibility signals: Nobel laureate Konstantin Novoselov chairs the scientific advisory board, University of Dubai signed an innovation partnership in June 2025, JBD supplies microLED display technology, Konica Minolta worked with Xpanceo on AR lens testing, and ITEN collaborated on an integrated solid-state battery proof of concept.


    This network is strategically useful because Xpanceo is trying to solve multiple frontier problems at once: display, power, sensing, optics, materials, safety, and manufacturability. At the same time, the network structure highlights key-person and integration risk. Much of the public technical narrative still runs through Volkov, while major enabling components depend on partner execution rather than a finished in-house product stack. The leadership team looks unusually strong for a young startup on academic-scientific depth, but the operating proof remains pre-commercial and partner-dependent.'
