callouts:
- calloutType: strength
  title: Rare capital base for a still-pre-commercial hardware thesis
  body: A $250M Series A on top of a $40M seed gives Xpanceo a funding base that most frontier hardware startups never achieve before commercialization. That capital materially improves its odds of surviving long enough to integrate display, sensing, power, and optics into one product.
  claimRefs:
  - CO004
  - CO005
  - CO006
- calloutType: risk
  title: Prototype velocity does not equal regulatory or commercial readiness
  body: The public record shows many subsystem prototypes and partner announcements, but it does not yet show human-trial outcomes, regulatory clearance, or commercial deployment. Investors should avoid treating prototype count as a substitute for validation milestones.
  claimRefs:
  - CO010
  - CO011
  - CO014
  - CO033
  - CO034
- calloutType: insight
  title: Partner concentration is part of the thesis, not a side note
  body: Xpanceo’s display, testing, battery, and academic credibility all rely on external partners. That helps a young company move quickly, but it also means the operating model is a networked platform of dependencies rather than a fully self-contained product company.
  claimRefs:
  - CO018
  - CO019
  - CO020
  - CO021
