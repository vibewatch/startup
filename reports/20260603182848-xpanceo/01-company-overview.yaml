company:
  name: Xpanceo
chapter:
  number: 1
  title: Company Overview
  summary: Xpanceo is a Dubai-based deep tech company founded in 2021 by Roman Axelrod and Dr. Valentyn Volkov to build an AI-powered smart contact lens that combines XR display, health sensing, night vision, and wireless power in a single wearable. Public disclosures show a $40M seed round followed by a $250M Series A at a $1.35B valuation in July 2025, giving the company $290M total disclosed funding and unicorn status. By MWC 2026 the company said it had built more than 28 prototypes and was targeting an integrated public demo in early 2027, but there is still no disclosed clinical-trial result, regulatory clearance, or commercial launch, leaving commercialization risk materially higher than the headline valuation suggests.
sections:
- id: identity-scale
  title: Identity, product ambition, and current scale
  body: 'Xpanceo positions itself as a post-screen computing company rather than a conventional eyewear startup. Across its official materials, the company describes an invisible, weightless smart contact lens that combines an XR display, biomarker sensing, wireless connectivity, and AI-powered assistance inside a device worn directly on the eye. That positioning matters because Xpanceo is trying to collapse multiple hardware categories — smartphone, smartwatch, smart glasses, and some medical wearables — into a single interface. The corporate story is therefore both unusually ambitious and unusually dependent on integrating many subsystems that other startups typically commercialize separately.


    Public evidence supports the basics of identity and stage. Xpanceo was founded in Dubai in 2021 by Roman Axelrod and Dr. Valentyn Volkov. Tracxn classifies the company as a Series A business with $290M in disclosed financing and a $1.35B valuation. The July 2025 unicorn announcement said the company had grown from 50 to 100 scientists, engineers, and business leaders while expanding lab capacity. By MWC 2026, management said the prototype count had passed 28 across multiple generations, but the company still described the first fully integrated product as a future unveiling rather than a launched device. That combination — strong capital plus pre-commercial status — is the core fact pattern investors must hold in mind.'
