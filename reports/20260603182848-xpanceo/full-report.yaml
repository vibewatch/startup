  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis, anti-thesis, and price sensitivity
        blocks:
          - type: paragraph
            body: >-
              Xpanceo's investment thesis is not hard to understand. Lightweight AI wearables are a real direction of
              travel, and the company has assembled an unusually strong capital base, visible prototype cadence, and
              scientific ambition for such an early-stage hardware business. If it can turn the promised integrated
              smart lens into a credible 2027 demo, show human-feasibility or third-party validation, and land an
              initial industrial or clinically mediated pilot, then the company could still become a scarce strategic
              option on a new interface category.


              The anti-thesis is stronger at today's price. Public evidence still shows a pre-revenue, pre-commercial
              company with no disclosed approvals, no named paying customers, and no public human-trial result. IDC and
              Counterpoint both indicate that XR demand is moving first toward smart glasses rather than toward more
              invasive wearables. That helps validate the post-screen direction, but it also means buyer acceptance is
              flowing to lower-friction products while Xpanceo is still assembling its first integrated lens. At $1.35B,
              the relevant question is not whether the technology is interesting; it is whether investors are already
              paying for milestones that remain unproven.
