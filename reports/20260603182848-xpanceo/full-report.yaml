  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Likely path from problem selection to scaled deployment, with segment-specific proof gates early in the journey.
    data:
      items:
        - label: Problem trigger
          detail: Monitoring burden, obstructive eyewear, or mission-specific need creates a reason to consider a lens.
          touchpoints:
            - Glaucoma or treatment-monitoring pain
            - Hands-free AR requirement
            - Consumer curiosity about invisible XR
        - label: Technical evaluation
          detail: Buyer evaluates safety, workflow fit, and whether companion hardware is acceptable.
          touchpoints:
            - Smartphone or container readout
            - Helmet or suit integration
            - Comfort and trust screening
        - label: Validation program
          detail: External organization or event tests the workflow in a controlled setting.
          touchpoints:
            - Conference demos
            - University pilots
            - MBRSC simulations
        - label: First paid deployment
          detail: A clinic, agency, or employer would need to convert the workflow into budgeted usage.
          touchpoints:
            - Regulatory sign-off
            - Procurement approval
            - Training and support plan
        - label: Expansion
          detail: The same account would need evidence of repeat usage and broader workflow adoption.
          touchpoints:
            - More users or sites
            - Additional lens workflow
            - Renewal or follow-on order
    claimRefs:
      - CU001
      - CU002
      - CU007
      - CU031
      - CU040
      - CU041
  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    summary: Public proof narrows sharply from many discussed use cases to zero disclosed paying customers.
    data:
      items:
        - label: Public use-case families discussed
          value: 6
        - label: Named external proof surfaces
          value: 4
        - label: Multi-stage validation programs disclosed
          value: 2
        - label: Publicly named paying customers
          value: 0
    approximationNotes: >-
      Counts are derived from the public proof surfaces reviewed for this chapter, not from an internal CRM. They
      measure public evidence density rather than real pipeline conversion.
