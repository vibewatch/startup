      - number: '4.2'
        title: Cost structure, margin drivers, and unit-economics constraints
        blocks:
          - type: paragraph
            body: >-
              Xpanceo's cost structure appears R&D-heavy, partner-dependent, and unlike software. The July 2025 unicorn
              announcement said the company had grown from 50 to 100 scientists, engineers, and business leaders while
              expanding lab capacity, and Xpanceo's own research surfaces emphasize 300-plus scientific papers or
              articles. That is the profile of a frontier research organization, not a capital-light digital product
              team. The subsystems described in the public corpus reinforce that conclusion: integrated microdisplays,
              custom collimation, wireless power transfer, companion-device compute, biosensing, antenna and
              flexible-electronics integration, battery proof of concept, and first-of-kind optical testing
              infrastructure. Each one points toward expensive iteration loops before gross margin optimization even
              begins.


              Margin path is equally constrained by regulatory and manufacturability realities. FDA guidance for devices
              with direct tissue contact stresses biocompatibility evaluation of the finished device and
              contact-duration-specific biological endpoints. Recent smart-contact-lens reviews likewise stress oxygen
              permeability, wettability, long-term wear, background interference, scalable manufacturing, and clinical
              translation as unresolved hurdles. Taken together, those sources imply that Xpanceo's near-term economics
              will be dominated by engineering, validation, and quality costs rather than by variable-margin
              optimization. Even if a future software, analytics, or monitoring layer carries attractive contribution
              margins, the company must first absorb hardware BOM, testing, tooling, regulatory, and support burdens.
              Publicly disclosed sales-efficiency metrics are absent as well: there is no CAC, payback, funnel
              conversion, or sales-cycle data. The only visible proxy is a trade-show and partnership-led go-to-market
              motion, which may work for early pilots but is not evidence of repeatable, efficient demand generation
              yet.
