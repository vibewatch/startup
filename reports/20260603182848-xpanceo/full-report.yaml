  - id: FR001
    title: Xpanceo risk heatmap — likelihood vs. impact
    type: matrix
    layout: wide
    summary: >-
      Positions the main Xpanceo risk scenarios on a three-column impact matrix, showing that the densest concentration
      of risk remains in the high-likelihood / critical-impact zone around regulatory proof, integration, and
      manufacturing readiness.
    data:
      columns:
        - Medium impact
        - High impact
        - Critical impact
      rows:
        - label: Very low likelihood
          values:
            - Isolated partner PR issue
            - Academic-collaboration slowdown
            - Minor exhibit/demo delay
        - label: Low likelihood
          values:
            - Narrow space-test cancellation
            - Single use-case reprioritization
            - Non-core feature removal
        - label: Medium likelihood
          values:
            - Privacy design rework
            - Partner-term renegotiation
            - Cyber-device documentation burden expands schedule
        - label: High likelihood
          values:
            - Pricing and GTM remain undefined through demo
            - No public QMS/yield evidence by next round
            - Integrated-demo timing slips beyond current roadmap
        - label: Very high likelihood
          values:
            - Human/regulatory proof remains behind prototype cadence
            - Biosensor and comfort constraints persist into integrated build
            - Manufacturing and safety evidence trail commercialization
    approximationNotes: >-
      Likelihood is qualitative and based on the reviewed corpus as of 2026-06-03. Impact refers to likely effect on
      launch timing, financing leverage, and valuation rather than on current revenue, because Xpanceo is precommercial.
    claimRefs:
      - CR006
      - CR015
      - CR022
      - CR025
      - CR032
      - CR041
  - id: FR002
    title: Risk transmission map — how technical and partner risks flow into financing outcomes
    type: dag
    layout: wide
    summary: >-
      Directed acyclic graph showing how safety, integration, partner, and privacy risks propagate into schedule, burn,
      regulatory burden, and valuation outcomes.
    data:
      nodes:
        - id: safety
          label: Direct-eye safety / biocompatibility proof
        - id: integration
          label: Multi-subsystem integration risk
        - id: partner
          label: JBD / ITEN / Konica / manufacturing dependency
        - id: privacy
          label: Health, biometric, and gaze-data compliance
        - id: cyber
          label: Cyber-device documentation and resilience burden
        - id: schedule
          label: Demo and launch schedule slip
        - id: burn
          label: Higher burn / longer development cycle
        - id: validation
          label: Delayed external or human validation
        - id: financing
          label: Next-round dependence / weaker terms
        - id: valuation
          label: Valuation compression
      edges:
        - from: safety
          to: validation
          label: more testing and evidence required
        - from: integration
          to: schedule
          label: subsystem coupling slows delivery
        - from: partner
          to: schedule
          label: supplier or partner delay hits critical path
        - from: privacy
          to: validation
          label: controls and consent model must be designed
        - from: cyber
          to: validation
          label: premarket package expands
        - from: schedule
          to: burn
          label: extended R&D runway
        - from: validation
          to: financing
          label: weaker proof at fundraise
        - from: burn
          to: financing
          label: higher capital need
        - from: financing
          to: valuation
          label: more sponsor dependence or tougher terms
        - from: schedule
          to: valuation
          label: narrative credibility weakens
    approximationNotes: Transmission paths are qualitative and focus on likely causal direction rather than modelled edge weights.
    claimRefs:
      - CR013
      - CR015
      - CR020
      - CR021
      - CR022
      - CR039
      - CR040
      - CR041
  - id: FR003
    title: Dependency map — critical external nodes around the integrated smart-lens roadmap
    type: dag
    layout: wide
    summary: >-
      Maps the external counterparties and institutions that sit near Xpanceo's integrated-demo critical path,
      emphasizing concentration in display, battery, testing, financing, and specialist validation.
    data:
      nodes:
        - id: xpanceo
          label: Xpanceo core roadmap
        - id: jbd
          label: JBD microdisplay path
        - id: iten
          label: ITEN battery path
        - id: konica
          label: Konica testing system
        - id: mbrsc
          label: MBRSC / space validation
        - id: sponsor
          label: Opportunity Venture capital continuity
        - id: manuf
          label: Manufacturing partner (undisclosed)
        - id: reg
          label: Regulators / approval burden
        - id: market
          label: Smart-glasses-led XR market trend
      edges:
        - from: jbd
          to: xpanceo
          label: display subsystem
        - from: iten
          to: xpanceo
          label: battery subsystem
        - from: konica
          to: xpanceo
          label: validation tooling
        - from: mbrsc
          to: xpanceo
          label: specialist-use validation
        - from: sponsor
          to: xpanceo
          label: financing continuity
        - from: manuf
          to: xpanceo
          label: future scale-up gate
        - from: reg
          to: xpanceo
          label: approval and compliance gate
        - from: market
          to: xpanceo
          label: adoption benchmark shifts toward glasses
    approximationNotes: >-
      The map includes only the highest-salience external nodes visible in the public corpus; undisclosed suppliers,
      contract manufacturers, and legal counsel relationships are not observable here.
    claimRefs:
      - CR016
      - CR017
      - CR018
      - CR019
      - CR020
      - CR021
      - CR030
      - CR040
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Decision chain from market interest and prototype progress through proof gaps and valuation tension to the final
      recommendation.
    data:
      nodes:
        - id: n1
          label: Real market direction
          detail: Lightweight AI wearables and XR are real, but adoption is currently glasses-led
        - id: n2
          label: Xpanceo progress
          detail: $290M disclosed funding, 28+ prototypes, integrated demo still targeted for 2027
        - id: n3
          label: Missing proof
          detail: No public revenue, named paying customers, approvals, or human validation
        - id: n4
          label: Current price anchor
          detail: $1.35B valuation already embeds significant milestone success
        - id: n5
          label: Comparable discipline
          detail: Magic Leap and Mojo warn on compression; Vuzix and Kopin show public-market floors and ceilings
        - id: n6
          label: Verdict
          detail: Pass for new money at current price; track only if proof improves or entry resets
      edges:
        - from: n1
          to: n4
          label: supports narrative
        - from: n2
          to: n4
          label: supports ambition
        - from: n3
          to: n4
          label: undermines support
        - from: n4
          to: n5
          label: must be checked against
        - from: n5
          to: n6
          label: yields
    claimRefs:
      - CV001
      - CV009
      - CV018
      - CV019
      - CV025
      - CV042
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: Sensitivity of implied valuation to milestone evidence rather than to conventional revenue multiples.
    data:
      items:
        - label: Delay / no new proof
          value: 0.5
          detail: Illustrative downside valuation in USD billions if timeline slips and validation remains absent
        - label: On-time integrated demo only
          value: 1.2
          detail: Demo helps, but without customer or regulatory proof the mark does not re-rate much above today's price
        - label: Demo plus third-party or human-feasibility data
          value: 1.8
          detail: First serious de-risking event for valuation support
        - label: Demo plus paid pilot / development agreement
          value: 2.3
          detail: Early commercial evidence creates a better bridge to the next round
        - label: Demo plus regulatory and manufacturing package
          value: 2.7
          detail: Strongest realistic 2027-2028 milestone re-rating visible from public information
    claimRefs:
      - CV026
      - CV027
      - CV028
      - CV029
      - CV031
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: Scenario valuation ranges in USD millions, compared with the current disclosed valuation anchor.
    data:
      items:
        - label: Bear case
          low: 200
          mid: 400
          high: 600
          unit: M USD
          detail: Down-round or strategic-reset path if timeline and proof deteriorate
        - label: Current disclosed valuation
          low: 1350
          mid: 1350
          high: 1350
          unit: M USD
          detail: July 2025 Series A valuation reference point
        - label: Base case
          low: 900
          mid: 1150
          high: 1400
          unit: M USD
          detail: Technical progress continues but commercial and regulatory proof remain incomplete
        - label: Bull case
          low: 2000
          mid: 2500
          high: 3000
          unit: M USD
          detail: On-time integrated demo plus first serious external validation and pilot evidence
    claimRefs:
      - CV001
      - CV027
      - CV028
      - CV029
      - CV031
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-style scoring of Xpanceo on the dimensions most relevant to price-sensitive underwriting.
    data:
      items:
        - label: Market direction
          value: 7
          detail: AI wearables and eyes-up interfaces are real themes, but the near-term path is glasses-led
        - label: Product ambition
          value: 8
          detail: Few startups attempt this level of interface compression and subsystem breadth
        - label: Proof quality
          value: 4
          detail: Prototype progress exists, but human, regulatory, and commercial proof are missing
        - label: Commercial evidence
          value: 2
          detail: No public revenue, named paying customers, or pricing model disclosed
        - label: Competitive moat
          value: 6
          detail: Scientific ambition and partner set are real, but ecosystem and channel moats sit elsewhere today
        - label: Risk profile
          value: 3
          detail: Direct-eye regulation, integration, manufacturing, and financing risks remain concentrated
        - label: Valuation discipline
          value: 2
          detail: Current private mark leaves little room for error on public-information scenario math
        - label: Evidence quality
          value: 5
          detail: Core funding and roadmap facts are visible, but cap table and operating metrics are not
    claimRefs:
      - CV003
      - CV004
      - CV010
      - CV022
      - CV025
      - CV040
