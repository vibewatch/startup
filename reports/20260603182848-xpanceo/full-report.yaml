  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, adjacents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Xpanceo should not be analyzed against one neat peer basket. The fetched corpus supports at least four
              rival classes: direct smart-lens peers such as InWith and the now-pivoted Mojo program; incumbent XR
              devices such as Meta Orion, Apple Vision Pro, and Snap Spectacles; adjacent optical or component
              incumbents such as Magic Leap; and medical or status-quo substitutes that solve portions of the same user
              problem without requiring a lens at all. This matters because buyer choice is not “Xpanceo or another lens
              startup”; it is often “Xpanceo later versus a glasses, headset, clinic workflow, or regulated monitoring
              product now.” The market-report sources also broaden the likely-entrant set to ophthalmic incumbents and
              consumer-electronics firms, meaning Xpanceo’s eventual rivalry will be multi-front rather than
              head-to-head with one startup cohort.
