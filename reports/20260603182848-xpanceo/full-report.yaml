      - number: '8.2'
        title: Financing context, dilution uncertainty, and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The public financing facts are unusually simple and unusually uncomfortable. Xpanceo disclosed a $40M seed
              round in 2023 and a $250M Series A in July 2025 at a stated $1.35B valuation, while Tracxn lists $290M of
              total funding and Series A stage. Yet almost everything an investor would normally need to judge whether
              that price is supportable remains undisclosed: revenue, burn, cap table, option pool, preference stack,
              board rights, customer contracts, pricing, and regulatory timeline. Public evidence therefore supports the
              headline mark but not the underwriting detail underneath it.


              Entry discipline matters because the round-size math can only be bounded, not confirmed. If $1.35B was a
              post-money valuation, the Series A sold roughly 18.5% of the company; if it was pre-money, the post-money
              would be about $1.60B and the new-money stake about 15.6%. Public sources do not tell investors which
              interpretation is correct. Nor do they reveal liquidation preferences or other downside-protection terms.
              That means the current price should be treated as a narrative and milestone mark, not as a transparent
              fair-value anchor. For a new investor, the absence of commercial proof means a prudent posture is to
              demand either materially stronger diligence evidence or a better price.
            claimRefs:
