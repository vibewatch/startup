      - number: '7.2'
        title: Operational, quality, safety, and integration risk
        blocks:
          - type: paragraph
            body: >-
              The second major risk cluster is operational: Xpanceo has shown many modules, but the combined system is

              still future tense. MWC 2026 materials describe key enabling technologies rather than a deployed
              integrated

              lens, and multiple public workflows still rely on helmet image sources, smartphone capture, specialized

              containers, companions, antennas, or off-eye power. That architecture is understandable for a
              precommercial

              platform, but it means Xpanceo must solve not one engineering problem but a tightly coupled stack of
              power,

              heat, optics, comfort, wireless transfer, calibration, packaging, and user workflow. Reviews of smart
              contact

              lenses continue to describe oxygen permeability, long-duration wear, thermal safety, calibration
              stability,

              and scalable manufacturing as unresolved barriers, while corneal-hypoxia work underscores how unforgiving
              the

              eye is as a deployment environment.


              The public mitigations are real but immature. Xpanceo's 28-plus prototype count, the Konica Minolta
              testing

              system, the ITEN microbattery proof of concept, and the 10,000-measurement glaucoma model all reduce the
              odds

              that the company is merely conceptual. But none of those data points answer the hardest scale questions:

              production yields, endurance, failure modes, supplier qualification, human wear-duration, or formal
              quality

              certification. Public sources also do not show second-source arrangements or volume commitments for
              critical

              subsystems. For investors, the key conclusion is that technical progress exists, yet residual exposure
              remains

              high because subsystem success does not guarantee that an integrated corneal-wearable device will be safe,

              reliable, manufacturable, or easy enough to adopt in the field.
