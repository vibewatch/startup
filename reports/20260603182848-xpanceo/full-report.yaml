      - number: '3.2'
        title: Capability, pricing, and go-to-market comparison
        blocks:
          - type: paragraph
            body: >-
              On capabilities, the glasses and headset incumbents already prove eyes-up interfaces, but they do so with
              bulkier hardware than a contact-lens thesis promises. Meta frames Orion as a true-AR prototype, Apple
              ships a heavyweight spatial-computing headset, and Snap is still building through a developer-first
              glasses program. Xpanceo’s counter-position is maximum interface compression: one lens that eventually
              merges XR display, sensing, night vision, and zoom. The problem is commercialization proof. Public pricing
              disclosure is thin across the fetched category, but the absence is most problematic for Xpanceo because
              the company is still pre-commercial and has not exposed a packaging model, while QYResearch suggests
              medical routes will likely be B2B and consumer routes subscription-like. That means the company’s eventual
              GTM may need to change by segment instead of scaling one universal commercial model. In practical terms,
              Xpanceo may need one sales motion for regulated medical or industrial deployments and another for any
              future consumer product, whereas Apple and Snap can already reuse existing device, software, and developer
              infrastructure.
