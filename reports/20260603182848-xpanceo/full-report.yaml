  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, privacy, and liability risk
        blocks:
          - type: paragraph
            body: >-
              Xpanceo's highest-severity risk remains regulatory proof for a direct-eye device that combines AR display,

              health monitoring, AI readout, and connected companions. FDA sources are explicit that contact lenses are

              medical devices and that biocompatibility assessment depends on the nature and duration of body contact.

              That matters because Xpanceo is not trying to launch a passive lens; it is attempting to commercialize a

              device worn on the cornea that may also create diagnostic or monitoring claims for glaucoma, tear-fluid

              biomarkers, and medicine monitoring. Public materials reviewed for this run still do not disclose FDA

              clearance, CE marking, pivotal clinical outcomes, or a commercial launch. The public glaucoma-validation

              narrative is encouraging but narrow: Xpanceo says its AI model has been trained on 10,000 measurements and

              works across artificial eye models, which is not the same as human clinical equivalence to tonometry.


              The legal and privacy layer is similarly material. If Xpanceo commercializes gaze tracking or health

              monitoring, the company would need to handle sensitive biometric and health data in jurisdictions where

              those categories trigger special processing conditions or breach-notification exposure. GDPR Article 9
              treats

              biometric data used to uniquely identify a person and data concerning health as special-category personal

              data, while the FTC's Health Breach Notification Rule creates post-incident obligations for
              personal-health-

              record-style data flows. FDA's 2026 cybersecurity guidance adds another burden for connected cyber
              devices:

              design, labeling, and premarket documentation must show cyber resilience, not just optical or biosensing

              performance. Xpanceo may ultimately build the right controls, but the public record does not yet expose a

              product-specific privacy architecture, QMS stack, or security package. That keeps residual regulatory and

              device-liability risk at the top of the chapter.
            claimRefs:
