      - number: '2.4'
        title: Growth drivers, adoption constraints, and contradictory signals
        blocks:
          - type: paragraph
            body: >-
              The growth case for Xpanceo is easy to understand. Scientific reviews continue to describe smart contact
              lenses as a promising platform for non-invasive monitoring of glucose, intraocular pressure, inflammatory
              markers, and drug delivery. Lab research demonstrates breathable and biocompatible designs, and Xpanceo’s
              own prototype cadence shows rapid subsystem progress. At the category level, IDC’s data indicates that
              consumers are moving toward lightweight, AI-first wearables, while Meta’s Orion vision and Snap’s
              Spectacles roadmap validate long-term interest in screenless computing. These are real drivers.


              But the constraint stack is longer than the growth stack. FDA guidance for contact lenses and
              direct-contact medical devices emphasizes whole-device biocompatibility evaluation and endpoint assessment
              by duration of contact. Review literature keeps returning to the same blockers: oxygen permeability,
              comfort, background interference, long-term wear, wireless readout, scalable manufacturing, clinical
              validation, and cost-effectiveness. No smart contact lens appears on the FDA’s fetched list of authorized
              sensor-based digital-health devices. Mojo Vision’s retreat from the lens category into microLED components
              is a particularly important adverse signal because it shows that even technically sophisticated teams have
              failed to bridge the gap from prototype credibility to commercial product. The market is real, but the
              investable near-term market is smaller, slower, and more regulated than the category narrative implies.
