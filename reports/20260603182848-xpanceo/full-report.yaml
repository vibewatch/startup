      - number: '8.4'
        title: Exit readiness, final diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Xpanceo is not IPO-ready on the public record. The more credible exit path is a strategic acquisition,
              major platform partnership, or internally led next round after meaningful technical and regulatory
              de-risking. Large XR, optics, ophthalmic, and medtech platforms could become logical counterparties, but
              only after the company shows more than prototype breadth. The gating evidence is still basic: cap-table
              clarity, burn and runway, partner durability, first human or external validation, a regulatory and quality
              path, and manufacturing-readiness data. Without those items, investors are not underwriting an exit
              process; they are underwriting faith that a future financing market will still reward the story.


              The right monitoring discipline is therefore milestone-based and unforgiving. If the integrated-demo
              timeline slips materially beyond early 2027 without offsetting validation, if no human or regulator-facing
              progress becomes visible before the next financing cycle, or if the next round appears rescue-like and
              sponsor-concentrated, then the current valuation logic weakens quickly. Likewise, if smart glasses
              continue winning mainstream adoption while direct-eye devices remain stuck in prototype or specialist
              niches, the consumer replacement thesis becomes progressively harder to defend. The correct stance today
              is pass for fresh capital at the disclosed mark, while keeping the company on a high-conviction watchlist
              for proof-driven re-underwriting.
