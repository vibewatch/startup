  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition in workflow terms
        blocks:
          - type: paragraph
            body: >-
              Xpanceo’s “product” should not be described as a single commercial smart contact lens that customers can
              already buy. The public record instead shows a staged architecture of task-specific prototypes that each
              solve one part of the eventual system: AR display, tear-fluid sensing, IOP sensing, passive eye tracking,
              wireless data transfer, power delivery, or energy storage. In other words, what exists today is a toolbox
              of subsystem demonstrations and workflow-specific concepts, while the all-in-one lens remains a future
              integration milestone. That distinction matters because customer workflow, support burden, and regulatory
              pathway differ sharply depending on whether a lens is read by a smartphone, paired with a helmet, placed
              in a spectroscopy container after use, or powered by a companion device.


              The workflow evidence is concrete. Xpanceo’s glaucoma concept uses an optical pattern on the lens and a
              smartphone camera plus AI app as the readout system. Its medicine-monitoring concept uses the lens as a
              collection surface and then shifts analysis to a specialized container that reads drug signatures with
              spectroscopy. Its frontier AR concepts pair the lens with a helmet or spacesuit image source and external
              power. Even its data-reading and wireless-power concepts depend on a companion device that acts as energy
              link and compute hub. The public product map therefore supports a sober conclusion: Xpanceo has many
              visible module-level assets, but the integrated customer-ready product is still an announced roadmap
              object rather than a delivered device.
