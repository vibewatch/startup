  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Xpanceo should not be analyzed as if it participates in one mature market with clean comparables. The
              company sits inside a still-forming smart contact lens category, but its actual opportunity spans at least
              three adjacent spend pools: medical monitoring through ocular wearables, consumer or prosumer XR
              computing, and frontier or industrial hands-free interfaces for constrained environments. Those pools
              share enabling technologies — microdisplays, power systems, biosensors, biocompatible materials, and
              companion compute — yet they differ sharply in buyer, payer, proof threshold, and time to revenue. That is
              why a single broad TAM figure is not decision-useful. A contact lens that screens glaucoma, a lens that
              replaces AR glasses for industrial users, and a consumer XR lens all face different regulatory,
              reimbursement, distribution, and trust barriers.


              The substitute set is equally important. In medical monitoring, substitutes include traditional clinical
              tonometry, continuous glucose monitors, lab diagnostics, and smartphone-linked disease-management tools.
              In consumer computing, the substitutes are smartphones, smartwatches, smart glasses, and XR headsets from
              Meta, Apple, and Snap. In industrial or frontier settings, helmet displays and ruggedized hands-free
              systems remain the status quo. For market analysis, therefore, included spend should be limited to sensor-
              or display-enabled smart lenses and the adjacent workflows they could plausibly displace — not all contact
              lenses, not all XR, and not the entire wearable-computing economy.
