      - number: '7.3'
        title: Partner, dependency, and ecosystem risk
        blocks:
          - type: paragraph
            body: >-
              Xpanceo's current public moat is inseparable from partner concentration. The integrated display roadmap is

              publicly linked to JBD's microdisplay technology, the in-lens battery path is linked to ITEN's solid-state

              microbattery work, and Konica Minolta is the disclosed testing-system partner for AR smart contact lenses.

              These relationships are strategically helpful because they compress years of subsystem work into external

              collaborations, but they also create dependency risk precisely where the all-in-one product is most
              fragile.

              Public materials reviewed for this run do not disclose backup suppliers, exclusivity terms, volume
              purchase

              commitments, or production-scale obligations for those counterparties. In practical terms, a delay at JBD,

              ITEN, or a key validation partner can become a delay to Xpanceo's integrated demo and therefore to its
              next

              financing narrative.


              Market structure compounds that dependency risk. Counterpoint's April 2026 update says smart glasses are
              now

              taking center stage in XR, which means the broader interface market is moving first toward less invasive
              form

              factors with stronger ecosystem support. The cleanest adverse comp is still Mojo Vision: a technically
              serious

              smart-lens pioneer that later pivoted to microLED components, even after receiving FDA Breakthrough Device

              status. That history does not mean Xpanceo must fail, but it does show that subsystem excellence and
              category

              attention do not automatically translate into a commercial lens business. The most realistic
              interpretation is

              that Xpanceo's near-term path is through narrow industrial, frontier, or medically mediated wedges where
              the

              value of hands-free invisibility is unusually high and the support stack can remain controlled.
            claimRefs:
