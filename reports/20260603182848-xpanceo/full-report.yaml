      - number: '4.3'
        title: Capital adequacy, burn framing, and financing dependency
        blocks:
          - type: paragraph
            body: >-
              As established in Company Overview, Xpanceo has disclosed only two financing rounds so far: a $40M seed in
              October 2023 and a $250M Series A in July 2025, with Tracxn showing $290M of total disclosed funding and
              Series A stage. The July 2025 official announcement also said the fresh capital would finalize development
              of the first smart contact lens, expand the team across R&D, product, design, and operations, and
              accelerate the path to market. That is a strong capital base for a pre-revenue direct-eye hardware
              company. It should be enough to keep Xpanceo in the game materially longer than most smart-lens startups.


              The hard part is that public burn and cash data are still missing. The only defensible public arithmetic
              is historical framing: the gap between the seed announcement and Series A close was about 20.7 months, so
              if the seed had been the only capital available and had been fully consumed by July 2025, the average
              seed-era burn ceiling would have been roughly $1.93M per month or $23.2M per year. Realized average burn
              was likely below that ceiling because companies usually do not close a new round with precisely zero cash
              left, but that seed-era average is not a realistic forecast for the post-Series-A period either.
              Management explicitly planned to expand staff and operations while pushing toward commercialization, which
              likely raises ongoing spend. The correct public conclusion is therefore twofold: Xpanceo is better
              capitalized than most peers at this stage, but it is still financing-dependent because no operating
              revenue offsets the cash demands of validation, manufacturability, and market entry. The next financing
              trigger is likely to be evidence-driven rather than prototype-count-driven: paid pilots, regulator-facing
              progress, external validation, and manufacturing readiness matter more than another concept demo.
