      - number: '3.4'
        title: Moat durability, commoditization risk, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The cleanest adverse evidence in the chapter is Mojo Vision. Public sources show that Mojo had a
              prototype, IRB-backed feasibility work, and FDA breakthrough-device status, yet the company still pivoted
              to micro-LED displays and later raised capital around that new strategy rather than the lens product. That
              sequence weakens any thesis that technical progress alone will create a durable moat in smart lenses.
              Market-size sources are also unstable: one vendor pegs the category in single-digit millions while another
              projects hundreds of millions, which is too inconsistent to treat as a reliable competitive shelter.
              Xpanceo’s moat is therefore not validated by market structure yet. It may eventually earn one through
              integration, comfort, regulatory execution, or channel partnerships, but today the more durable moats sit
              with incumbent ecosystems, manufacturing access, and regulated-care distribution rather than with a
              pre-commercial all-in-one lens narrative. The burden of proof is commercial repeatability, not just
              technical possibility.
