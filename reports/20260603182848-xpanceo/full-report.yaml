      - number: '6.4'
        title: Durability gaps, procurement friction, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Public durability evidence for Xpanceo is almost entirely absent. No reviewed source disclosed customer
              count, active accounts, paid pilots, NRR, GRR, churn, contract length, renewal timing, or satisfaction
              metrics. There is also no visible post-sale surface such as support documentation for customers, public
              success programs, or reference reviews that would allow a reader to infer repeat usage quality. That does
              not mean the product lacks stickiness. In fact, several of Xpanceo’s proposed workflows would likely be
              sticky once validated: glaucoma monitoring would sit inside clinician and patient routines, while space or
              industrial AR would be embedded in mission-specific operating systems. But that is structural inference,
              not demonstrated retention.


              Procurement friction is therefore the core customer risk. Clinical routes face direct-eye safety,
              biocompatibility, calibration, and reimbursement hurdles. Frontier routes depend on agencies or employers
              accepting companion hardware, helmet or suit integration, and reliability testing in constrained
              environments. Consumer routes face the hardest trust problem because they compete against lower-friction
              substitutes such as smart glasses. The adverse category evidence matters here: review literature still
              calls for large-scale validation, and Mojo Vision’s pivot shows that even technically impressive
              smart-lens programs can fail to translate into repeatable customer adoption. With no paid customers
              disclosed, first commercial traction would also begin from a concentrated base, making early customer
              concentration and channel dependence unavoidable.
