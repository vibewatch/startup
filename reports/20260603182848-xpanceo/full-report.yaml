      - number: '3.3'
        title: Distribution power, switching costs, and supply access
        blocks:
          - type: paragraph
            body: >-
              The main competitive asymmetry is not raw imagination but operating leverage. Apple and Snap already have
              developer surfaces and software ecosystems that can create lock-in around tools, content, and installed
              workflows, while Meta benefits from a smart-glasses category that IDC says is pulling XR toward comfort
              and persistent AI. Magic Leap’s Pegatron deal shows what Xpanceo still lacks: a disclosed path from
              optical innovation to scaled manufacturing. In healthcare, the lock-in dynamic shifts again toward
              clinics, reimbursement logic, and regulated channels. Multi-homing remains possible because no smart-lens
              platform has established a dominant installed base, but that cuts both ways: it lowers customer lock-in
              for everyone while rewarding whichever rival first secures dependable channels, supply, and trust. Xpanceo
              therefore enters the field with high conceptual upside but low current distribution power. Until the
              company can show repeatable pilots, supplier depth, and channel partners, buyers will rationally default
              toward products or workflows that already have procurement, support, and compliance muscle behind them.
