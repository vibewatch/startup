      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              A credible sizing exercise for Xpanceo has to use multiple lenses instead of one top-down category number.
              The clinical lens begins with disease burden and patient need: WHO says at least 2.2 billion people have a
              near or distance vision impairment and lists glaucoma plus diabetic retinopathy among the leading causes.
              The American Academy of Ophthalmology’s 2024 summary of JAMA Ophthalmology estimates 4.22 million U.S.
              adults had glaucoma in 2022, while IDF says 1 in 9 people globally live with diabetes. Those prevalence
              figures show that the clinical need for continuous or easier monitoring is very large, but only a narrow
              slice is realistically serviceable by a premium smart contact lens in the next product cycle because any
              such device must prove comfort, safety, calibration, and reimbursement fit.


              The consumer-computing lens is different. IDC reports XR device shipments rebounded 44.4% in 2025 and were
              led by smart glasses rather than headsets, suggesting demand is shifting toward lighter, always-on form
              factors. Meta’s Orion thesis and Snap’s Spectacles roadmap both point in the same direction: post-screen
              computing is real as a category trend. But those sources also underline why Xpanceo’s SAM is much smaller
              than the total XR market. Glasses and headsets already have distribution, developer tools, and
              user-education advantages. A lens worn directly on the eye must clear stricter trust and safety hurdles
              before it can capture comparable demand. The result is a wedge-market conclusion: the true near-term SOM
              is likely specialty clinical or premium frontier deployment first, broader consumer XR later.
