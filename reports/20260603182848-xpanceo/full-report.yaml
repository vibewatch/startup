  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, payer, and segment map
        blocks:
          - type: paragraph
            body: >-
              Xpanceo’s public materials do not show a live customer roster, so the customer chapter has to start from
              workflow evidence instead of contract evidence. That workflow evidence supports three plausible early
              routes. The first is clinical monitoring. In that route, the user is the patient, but the buyer and payer
              would likely sit with an ophthalmology clinic, hospital, specialty provider, or insurer-backed program
              rather than with a consumer buying a gadget for novelty. Xpanceo’s current healthcare-facing concepts —
              glaucoma management, medicine monitoring, and tear-fluid readings — all map to problems where medical
              trust, repeat measurements, and reimbursement logic matter more than broad consumer marketing.


              The second route is frontier or industrial AR, where employers, agencies, or mission programs would buy
              and pay while astronauts, pilots, first responders, operators, or elite athletes act as users. This route
              is better aligned with the company’s public proof today because Xpanceo repeatedly highlights environments
              where glasses are obstructive and companion hardware is acceptable. The third route is eventual consumer
              XR, where buyer, user, and payer collapse into the same person. That route remains strategically important
              but publicly under-evidenced. The strongest geographic signal is also not global consumer demand but
              UAE-linked ecosystem concentration: the named external proof surfaces reviewed for this chapter are
              centered on Dubai and adjacent institutional relationships rather than on a broad distributed customer
              base.
