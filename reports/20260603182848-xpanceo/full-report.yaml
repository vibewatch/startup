  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product ambition, and current scale
        blocks:
          - type: paragraph
            body: >-
              Xpanceo positions itself as a post-screen computing company rather than a conventional eyewear startup.
              Across its official materials, the company describes an invisible, weightless smart contact lens that
              combines an XR display, biomarker sensing, wireless connectivity, and AI-powered assistance inside a
              device worn directly on the eye. That positioning matters because Xpanceo is trying to collapse multiple
              hardware categories — smartphone, smartwatch, smart glasses, and some medical wearables — into a single
              interface. The corporate story is therefore both unusually ambitious and unusually dependent on
              integrating many subsystems that other startups typically commercialize separately.


              Public evidence supports the basics of identity and stage. Xpanceo was founded in Dubai in 2021 by Roman
              Axelrod and Dr. Valentyn Volkov. Tracxn classifies the company as a Series A business with $290M in
              disclosed financing and a $1.35B valuation. The July 2025 unicorn announcement said the company had grown
              from 50 to 100 scientists, engineers, and business leaders while expanding lab capacity. By MWC 2026,
              management said the prototype count had passed 28 across multiple generations, but the company still
              described the first fully integrated product as a future unveiling rather than a launched device. That
              combination — strong capital plus pre-commercial status — is the core fact pattern investors must hold in
              mind.
