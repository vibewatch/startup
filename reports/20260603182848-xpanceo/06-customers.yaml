  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-count
    missingEvidence: A current paying-customer count, active pilot count, and active account denominator by segment.
    whyItMatters: Without a denominator, public proof cannot distinguish broad market pull from a handful of showcase relationships.
    diligencePath: Ask management for live customer, paid-pilot, unpaid-pilot, and active-program counts split across healthcare, industrial, and consumer routes.
    relatedQuestionRefs:
    - QU007
    relatedTableRefs:
    - TU002
    - TU004
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Renewal rate, contract length, repeat usage frequency, NRR, GRR, and churn metrics for any commercial cohort.
    whyItMatters: Customer durability is unmeasurable without retention and repeat-usage evidence, which keeps the chapter at proof-of-interest rather than proof-of-stickiness.
    diligencePath: Request cohort retention, contract terms, device usage frequency, and any renewal or extension data from pilot or paid accounts.
    relatedQuestionRefs:
    - QU011
    - QU012
    relatedTableRefs:
    - TU004
  - type: enumeration-incomplete
    severity: material
    topic: named-customers
    missingEvidence: A list of named commercial pilots, procurement-stage programs, or revenue-linked customers beyond collaborators and conference demos.
    whyItMatters: Named proof is currently dominated by validation partners and public showcases, which can overstate commercial readiness.
    diligencePath: Ask for the top ten named customer prospects and the exact stage of each relationship from demo to unpaid pilot to paid deployment.
    relatedQuestionRefs:
    - QU006
    - QU020
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: satisfaction-signal
    missingEvidence: Public user reviews, marketplace ratings, practitioner references, or named operator feedback on actual use.
    whyItMatters: Without sentiment or review surfaces, there is no external check on comfort, reliability, and workflow usability.
    diligencePath: Request reference calls from a clinician, industrial operator, and validation partner, plus any internal satisfaction surveys or blind test results.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-and-expansion
    missingEvidence: Pipeline concentration, first-customer ACV assumptions, expected land-and-expand motion, and geographic mix of near-term opportunities.
    whyItMatters: Early concentration risk is likely to be extreme if one program becomes the first paid customer, but the public record does not show how management plans to diversify.
    diligencePath: Ask for top-customer pipeline share, first-customer revenue sensitivity, and planned sequencing across medical, industrial, and consumer channels.
    relatedQuestionRefs:
    - QU018
    - QU025
    relatedTableRefs:
    - TU005
    - TU006
