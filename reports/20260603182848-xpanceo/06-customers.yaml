- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration or channel risk
  - Impact
  - Public evidence
  - Diligence path
  rows:
  - - First paid pilot in healthcare
    - Earliest revenue may come from one clinic or specialty program
    - High initial concentration if one pilot becomes the whole customer base
    - No public customer count; healthcare use cases are prominent in demos
    - Request top-five opportunity pipeline and expected first paid clinical account
  - - First paid pilot in space or frontier operations
    - Government or mission program dependence can create lumpy revenue and long cycles
    - High concentration and procurement delay risk
    - MBRSC is the strongest named end-user-adjacent proof surface today
    - Request budget owner, procurement stage, and whether any program has moved beyond validation
  - - Partner-led enabling stack
    - Dependence on JBD, ITEN, Konica Minolta, and companion hardware slows independent channel control
    - Can delay launches or compress margin if one dependency slips
    - Public sources repeatedly frame enabling partners as critical to display, power, and testing
    - Request single-source exposure and backup-partner plan by subsystem
  - - Consumer channel ambition
    - Consumer path competes against smart-glasses substitutes with lower trust friction
    - Could delay broad adoption even if technical demo succeeds
    - Public proof for consumer XR is weaker than for healthcare or frontier workflows
    - Request launch sequencing and channel strategy rather than one universal go-to-market story
  - - Land-and-expand narrative
    - No public evidence yet shows one customer expanding from one workflow into several
    - Expansion case remains hypothetical
    - Public proof is wide across use cases but shallow across any single account
    - Request pilot-to-expansion conversion assumptions and attach-rate targets
  - - Geography concentration
    - Named external proof is unusually concentrated around Dubai or UAE-linked institutions
    - Early channel risk if the ecosystem is narrower than the long-term global story
    - University of Dubai and MBRSC are the clearest named external institutions in the public record
    - Request geographic pipeline mix and target regions for first regulated or industrial launches
  notes: This table focuses on how first-customer wins could still leave Xpanceo exposed to concentration, channel, and dependency risk because the public customer base is not yet diversified.
