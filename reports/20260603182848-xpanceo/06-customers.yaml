- id: TU006
  title: Procurement and proof-friction table
  columns:
  - Segment
  - Main approval gate
  - Companion or channel dependence
  - Primary friction
  - Why the friction matters
  - Diligence ask
  rows:
  - - Glaucoma monitoring
    - Clinical validation and regulatory acceptance
    - Smartphone app and provider workflow
    - Accuracy, calibration, and medical trust
    - Monitoring workflows fail commercially if data quality is not trusted by clinicians
    - Request comparison against standard tonometry and path to reimbursement
  - - Medicine monitoring
    - Specialty-clinic or therapy-program adoption
    - Spectroscopy container and care pathway integration
    - Added workflow complexity after lens wear
    - Post-wear container step may be too complex for a simple consumer sale
    - Request target disease programs, turnaround time, and sensitivity thresholds
  - - Tear-fluid health readings
    - Validation and consumer comprehension
    - Phone-linked readout and companion electronics
    - Signal interference and calibration
    - Health-monitoring promise can attract users but disappoint if measurements drift
    - Request longitudinal calibration data and false-positive or false-negative rates
  - - Space or mission AR
    - Agency safety review and mission integration
    - Space suit, helmet, and telemetry systems
    - Reliability in harsh environments and long procurement cycles
    - Mission buyers need proof that the lens improves safety or speed, not just novelty
    - Request test results, mission owner, and path from validation to procurement
  - - Industrial or field AR
    - Employer ROI and safety review
    - Helmet or companion-device ecosystem
    - Integration burden versus existing eyewear or helmet HUDs
    - Buyers may prefer less invasive substitutes if benefit is not dramatic
    - Request named industrial pilot candidates and measured task-improvement targets
  - - Consumer XR
    - Trust and comfort at point of sale
    - Retail and support channel not yet public
    - Direct-eye wear acceptance versus smart-glasses substitutes
    - Consumer hesitation can keep demand behind technical readiness
    - Request launch market, price band, and return-policy assumptions
  notes: Procurement friction differs by segment. The same hardware platform may require very different channels, approval gates, and proof thresholds depending on whether the buyer is a clinic, agency, employer, or consumer.
