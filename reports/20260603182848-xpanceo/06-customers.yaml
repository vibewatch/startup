  rows:
  - - Glaucoma monitoring
    - Ophthalmology clinic or provider / patient / provider, payer, or insurer-backed program
    - Likely clinic-mediated and smartphone-linked rather than direct retail
    - AI-powered selfie workflow and IOP-oriented prototype evidence at GITEX 2025 and MWC 2026
    - Strongest medical wedge because the job to be done is frequent monitoring rather than entertainment
    - No clinical accuracy disclosure, reimbursement logic, or named provider customer
  - - Medicine monitoring for complex therapies
    - Specialty provider or treatment program / patient / provider or health system
    - Likely institutional channel because post-wear spectroscopy and treatment adjustment are involved
    - MWC 2026 positioned this for therapies such as cancer and thrombosis side-effect management
    - Could create high-value medical workflow if validated in oncology or specialty care
    - No named hospital, lab, oncology program, or paid pilot disclosed
  - - Tear-fluid health readings
    - Provider, wellness program, or advanced consumer / wearer / unclear
    - Smartphone-linked readout suggests hybrid clinical-consumer channel experimentation
    - GITEX 2025 showed glucose and biomarker readings sent to smartphones
    - Broadens addressable health-monitoring narrative beyond one disease
    - Calibration and interference still open; buyer and payer remain ambiguous
  - - Frontier aerospace and space operations
    - Agency or mission program / astronaut or operator / agency budget
    - UAE-linked institutional proof through Mohammed Bin Rashid Space Centre collaboration
    - Space-suit integration, ground simulations, and possible future in-orbit testing
    - Best named pilot-style proof because usefulness can outweigh everyday comfort concerns
    - No procurement contract, unit economics, or deployment count disclosed
  - - Industrial or mission-critical AR
    - Employer or operations program / field worker, pilot, first responder, racer / enterprise or government budget
    - Channel likely runs through integrators, helmet systems, and specialized hardware programs
    - MWC 2026 highlighted aerospace, operations, and elite sport performance; MWC25 showed helmet-assisted AR and companion-device workflows
    - Could become first paid wedge if hands-free function matters more than consumer aesthetics
    - No named industrial customer or signed pilot publicly identified
  - - Consumer or prosumer XR
    - Individual / individual / individual
    - Broad global market narrative, but no public retail or preorder channel
    - AR, night vision, zoom, and content-display claims exist, but proof remains prototype-stage
    - Largest long-term narrative if comfort and trust are solved
    - Lowest current evidence quality and strongest substitute pressure from smart glasses
  notes: Segments are inferred from specific product workflows, collaborator programs, and public demo materials reviewed in this run; Xpanceo does not publish a formal customer-segmentation framework or revenue mix.
