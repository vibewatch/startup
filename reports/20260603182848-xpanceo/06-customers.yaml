- id: named-proof-and-what-it-is-not
  title: Named external proof, collaborators, and pilot-like evidence
  body: 'Xpanceo does have named external proof, but investors need to classify it correctly. The strongest end-user-adjacent proof in the public record is the Mohammed Bin Rashid Space Centre collaboration. That program includes lab validation, ground simulations, parabolic-flight testing, and possible future in-orbit evaluation, which is materially stronger than a generic press release. But it is still a validation pathway, not disclosed purchase evidence. The University of Dubai relationship is also concrete, yet it is best read as ecosystem and applied-research proof: joint R&D, lab access, internships, educational use cases, and real-world pilots. It is not evidence of a production customer paying for units.


    Conference materials create a similar distinction. MWC 2026 and GITEX 2025 both show that Xpanceo can present use-case-specific workflows to outside audiences, and MWC25 explicitly said visitors could interact with the technology. That is better than stealth, but event interaction is not the same thing as a retained account. The named proof in this chapter therefore clusters around collaborators, testing partners, and showcase programs. That is helpful because it demonstrates outside interest and some operational seriousness. It is also limiting because none of the named proof surfaces disclose commercial terms, repeat usage, seat counts, deployed units, or a conversion from demo and validation into revenue.'
