- id: TV006
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Integrated-demo timing breaks
    - Public integrated demo slips materially beyond early 2027 without offsetting third-party validation
    - Narrative premium weakens because timing is a core part of the current value story
    - Re-underwrite at flat/down-round assumptions; do not add capital at premium pricing
  - - No human / regulatory progress
    - No visible human-feasibility, regulator-engagement, or device-specific safety package before the next financing cycle
    - Medical and direct-eye upside should be valued as long-dated optionality only
    - Treat medical and premium-consumer cases as effectively excluded from the near-term model
  - - Rescue-style financing signal
    - Next financing appears sponsor-concentrated, structured defensively, or clearly below the last round
    - Confirms that technical progress has not translated into broad market confidence
    - Move to downside-protection rather than growth-underwriting mode
  - - Smart-glasses substitution accelerates
    - Mainstream XR adoption keeps flowing to smart glasses while lenses remain prototype or specialist only
    - Consumer replacement thesis becomes progressively less credible
    - Focus any remaining upside on niche clinical or industrial wedges only
  - - Partner critical-path failure
    - Material delay or disruption at a critical display, battery, or validation partner without clear replacement
    - Integrated product and financing timeline both weaken
    - Raise execution-risk discount and assume longer time-to-liquidity
  notes: These are monitorable public triggers designed for investors deciding whether to hold, re-underwrite, or decline new capital, not mechanical rules divorced from context.
  claimRefs:
