  - CV036
  - CV037
  - CV038
  - CV039
- id: TV007
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Cap table and preference stack
    - No public information on liquidation preferences, option pool, or governance rights
    - Return math and downside protection cannot be evaluated without this
    - Management / counsel data room request
  - - Burn, runway, and next-round plan
    - No public burn-by-program, cash runway, or financing contingency plan
    - A high valuation with no revenue is highly sensitive to timing slippage
    - Finance diligence and board materials
  - - Human or third-party validation
    - No public human study, external benchmark, or paid pilot evidence
    - Scenario weights cannot move materially higher without this proof
    - Clinical / product diligence
  - - Regulatory and QMS path
    - No public product-specific regulatory roadmap or quality-system package
    - Direct-eye hardware risk remains the biggest blocker to commercialization
    - Regulatory affairs diligence, intended-use map, and QMS review
  - - Partner contracts and sourcing resilience
    - Public evidence does not show exclusivity, backups, or volume-readiness terms
    - Critical-path partners can determine schedule and burn
    - Commercial and operations diligence
  - - Manufacturing readiness
    - No public yield, reliability, or volume manufacturing data
    - Demo value and product value are not the same without manufacturability
    - Engineering diligence and manufacturing-readiness review
  notes: None of these asks should be treated as optional at the last disclosed valuation because each one can move the scenario weights more than incremental prototype headlines can.
