- id: scenarios-comparables
  title: Scenario analysis and comparable valuation framing
  body: 'A conventional DCF or forward-revenue multiple is not decision-useful for Xpanceo because the company is pre-revenue and still aiming for its first integrated product milestone. The more appropriate method is milestone-based scenario analysis checked against public and private analogues. Those analogues cut both ways. On the negative side, Magic Leap raised billions, reached much higher private valuations, and still ended up with a lower last-known mark plus a later emphasis on manufacturing partnerships. Mojo Vision reached prototype and regulatory credibility yet pivoted away from the smart-lens product toward micro-LEDs. On the public side, Vuzix and Kopin are shipping XR or optics specialists with real revenue, but their June 2026 market caps still sit around $344M and $1.09B respectively.


    Those references do not make Xpanceo directly comparable to any one peer, but they do bound valuation discipline. Xpanceo''s mark is already above Vuzix and above or near small public optics specialists despite lacking revenue, and it sits below prior peak XR private marks that later compressed after commercialization proved harder than the narrative implied. A reasonable bull/base/bear structure therefore centers on milestone re-rating, not on heroic terminal-market assumptions. The bull case needs an on-time integrated demo, outside validation, a clear regulatory path, and first paid pilot evidence. The base case assumes technical progress without commercial step-change. The bear case assumes slippage, absent human or regulatory proof, and tougher funding conditions as smart glasses continue to dominate XR adoption.'
