    - On-time integrated demo, third-party or human-feasibility validation, clear regulatory path, and first paid or near-paid pilots by 2027-2028
    - $2.0B to $3.0B valuation range, or roughly 1.5x to 2.2x versus the current disclosed mark
    - Still requires commercialization to follow, not just a polished demo
    - 20%
  - - Base
    - Integrated demo lands with technical credibility, but approvals, pricing, and scaled revenue remain future work
    - $0.9B to $1.4B range, or roughly 0.7x to 1.0x versus the current disclosed mark
    - Flat or slightly down financing becomes plausible if proof does not accelerate
