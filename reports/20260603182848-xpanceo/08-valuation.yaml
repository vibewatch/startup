- id: TV003
  title: Financing context and entry discipline table
  columns:
  - Item
  - Public evidence
  - Valuation implication
  - Caveat
  rows:
  - - Latest disclosed round
    - $250M Series A at a stated $1.35B valuation in July 2025
    - Establishes the current price anchor for all return math
    - Public sources do not clearly state whether the valuation was pre- or post-money
  - - Prior financing
    - $40M seed in 2023, also led by Opportunity Venture
    - Sponsor continuity reduces near-term financing uncertainty
    - Concentration around one disclosed lead can increase dependence later
  - - Total disclosed funding
    - Tracxn lists $290M and Series A stage
    - Large capital base buys time for deep-tech integration work
    - Total funding does not substitute for commercial proof or pricing power
  - - Implied primary dilution range
    - Roughly 15.6% to 18.5%, depending on whether $1.35B was pre- or post-money
    - Return expectations for new investors depend heavily on this interpretation
    - This range is inferred from disclosed round size and valuation language only
  - - Preference / cap-table visibility
    - No public preference stack, option pool, or board-rights detail
    - Downside protection and overhang cannot be underwritten responsibly
    - Investors should not invent missing terms
  - - Entry discipline
    - Public evidence supports narrative strength, not operating-metric support
    - New money should demand milestone-linked pricing rather than pay full narrative premium
    - View can improve if diligence reveals stronger hidden de-risking than public sources show
  notes: The combination of a very large Series A and missing cap-table detail means investors know the price headline but not enough about the waterfall beneath it.
