  - - Bear
    - Demo slips, human/regulatory proof stays absent, and glasses-led XR keeps winning mainstream adoption
    - $0.2B to $0.6B range, or roughly 0.15x to 0.45x versus the current disclosed mark
    - Down round, rescue financing, or strategic reset becomes likely
    - 35%
  notes: This is milestone valuation, not revenue forecasting. The probability-weighted midpoint is roughly $1.1B to $1.2B, which is below the current disclosed valuation and therefore does not support an aggressive new-money entry.
