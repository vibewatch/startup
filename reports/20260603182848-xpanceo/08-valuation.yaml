- id: TV005
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Xpanceo
    - Latest disclosed private round
    - $1.35B valuation on a $250M Series A; pre-revenue and pre-commercial
    - Sets the actual decision price investors must judge
    - No public cap-table, revenue, or regulatory support metrics disclosed
  - - Magic Leap
    - Private XR funding precedent
    - $3.48B total funding; prior $6B marks; last known valuation $2B; Pegatron production deal in 2025
    - Shows both how high XR narrative valuations can go and how they can compress later
    - Different form factor and much longer operating history than Xpanceo
  - - Mojo Vision
    - Smart-lens milestone precedent
    - Prototype plus FDA breakthrough-device signal, followed by pivot to micro-LEDs and later financing around that platform
    - Strongest adverse comp for smart-lens commercialization risk
    - Public valuation data for the lens phase is limited
  - - Vuzix
    - Public smart-glasses / waveguide comp
    - ~$344M June 2026 market cap and $6.28M 2025 revenue
    - Shipping XR specialist valued well below Xpanceo despite actual revenue
    - Small public float and different product architecture reduce direct comparability
  - - Kopin
    - Public optics / display comp
    - ~$1.09B June 2026 market cap and $39.32M 2025 revenue
    - Useful upper-end public check for a revenue-generating optics specialist
    - Components orientation and defense exposure differ from Xpanceo's integrated lens thesis
  - - Meta Orion / Snap Spectacles
    - Milestone reference
    - Orion remains a polished prototype; Spectacles target consumer debut in 2026
    - Shows big-tech competition is moving through glasses first
    - These are ecosystem references, not clean valuation comparables
