callouts:
- calloutType: strength
  title: Xpanceo competes on minimum form factor, not on current scale
  body: The company’s strongest strategic angle is that a contact lens could eventually compress several device categories into one invisible interface. None of the current alternatives combine that ambition with the same lens-native story, even if many already beat Xpanceo on readiness.
  claimRefs:
  - CP001
  - CP031
  - CP034
- calloutType: risk
  title: Mojo is the most important adverse comp, not the most flattering one
  body: Investors should treat Mojo Vision as a warning that smart-lens programs can achieve prototype and regulatory milestones yet still pivot away before a product business forms. That makes Xpanceo’s remaining commercialization gaps more material than its prototype narrative alone suggests.
  claimRefs:
  - CP012
  - CP013
  - CP037
  - CP043
- calloutType: insight
  title: If Xpanceo goes medical first, its true rivals shift
  body: A medical or industrial wedge can make Xpanceo more credible, but it also changes the competitor set from consumer-XR brands toward clinics, regulated incumbents, and payer-mediated channels. That means winning the right first segment may matter more than beating every smart-glasses vendor head-on.
  claimRefs:
  - CP030
  - CP032
  - CP038
  - CP039
