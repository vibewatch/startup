- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Factor
  - Category
  - Evidence
  - Impact on adoption
  - Read-through for Xpanceo
  rows:
  - - Non-invasive health monitoring demand
    - driver
    - WHO disease burden + biosensor literature
    - Expands clinical relevance of tear-based sensing
    - Supports glaucoma and biomarker wedge
  - - AI-first lightweight wearables trend
    - driver
    - IDC smart-glasses-led XR rebound
    - Improves user readiness for post-screen computing
    - Validates form-factor direction without proving lens readiness
  - - Miniaturized display and power progress
    - driver
    - Xpanceo, JBD, and literature on breathable smart lenses
    - Makes lens integration less theoretical than five years ago
    - Supports prototype narrative but not mass production yet
  - - Direct-eye safety and comfort burden
    - constraint
    - FDA biocompatibility and literature requirements
    - Raises validation cost and timeline
    - Major gating item versus glasses or patches
  - - Calibration and clinical-accuracy burden
    - constraint
    - Glucose / IOP literature and FDA framework
    - Limits medical claims until validated
    - Makes medical wedge slower but more defensible if solved
  - - Manufacturing and long-term wearability
    - constraint
    - Review literature on oxygen permeability and scalable fabrication
    - Reduces effective SAM in the near term
    - Could delay consumer rollout materially
  - - Trust / privacy / willingness to wear
    - constraint
    - Consumer substitutes already exist in smart glasses and phones
    - Can compress consumer adoption even if technology works
    - Implies phased rollout and niche-first entry
  - - Adverse precedent from Mojo Vision
    - constraint
    - IEEE coverage of Mojo pivot
    - Shows technical teams can still fail commercially
    - Important reminder against treating prototype progress as inevitability
  notes: Drivers explain why the category exists; constraints explain why the near-term monetizable market is much smaller than the narrative suggests.
