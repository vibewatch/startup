- id: TM002
  title: TAM / SAM / SOM sizing lens table
  columns:
  - Sizing lens
  - Evidence anchor
  - Large theoretical pool
  - Serviceable near-term pool
  - Implication for Xpanceo
  rows:
  - - Glaucoma / ocular monitoring
    - WHO + AAO glaucoma prevalence
    - Very large global disease burden; 4.22M U.S. adults with glaucoma and millions globally
    - Narrower premium monitored cohort due to device price, safety, and provider workflow
    - Best early clinical wedge if accuracy and regulatory path are proven
  - - Diabetes / biomarker monitoring
    - IDF diabetes prevalence + smart-lens biosensing literature
    - 1 in 9 people live with diabetes globally
    - Only a small subset is likely reachable initially because lens-based glucose monitoring must beat existing CGM workflows
    - Huge long-term upside but toughest calibration and reimbursement challenge
  - - Consumer XR computing
    - IDC XR growth + Meta / Apple / Snap device evidence
    - Large post-screen interest as smart glasses expand and headsets mature
    - Small near-term premium cohort willing to wear a direct-eye device
    - Narrative is exciting but serviceable demand is much smaller than total XR spend
  - - Industrial / frontier AR
    - Xpanceo frontier-use messaging + XR device substitutes
    - Meaningful but niche pool in field work, aerospace, racing, and defense
    - Potentially reachable sooner because buyers value hands-free function over mass-market aesthetics
    - Could become bridge market before consumer replacement thesis
  - - Total smart-lens category ceiling
    - Grand View category recognition + literature + Xpanceo roadmap
    - Large enough to support venture-scale outcome if category matures
    - Still constrained by regulation, trust, and almost no approved products
    - Use stepwise market-entry assumptions rather than one broad TAM
  notes: This table intentionally avoids a single top-down dollar TAM. The evidence supports large need pools but only a narrow near-term serviceable market for a premium smart contact lens.
