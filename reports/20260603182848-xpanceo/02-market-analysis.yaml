  rows:
  - - Clinical monitoring smart lenses
    - Sensor-enabled lenses for glaucoma, tear biomarkers, or medication adherence
    - Commodity vision-correction lenses without sensors
    - Tonometers, CGM patches, clinic visits, lab tests
    - Most plausible early wedge because medical pain points are acute
  - - Consumer / prosumer XR smart lenses
    - Display-enabled lenses for overlays, notifications, navigation, and AI assistance
    - All XR headsets and all smart glasses sales
    - Smartphones, smartwatches, Ray-Ban Meta, Snap Spectacles, Apple Vision Pro
    - This is the largest narrative pool but has the highest trust and comfort hurdle
  - - Industrial / frontier smart lenses
    - Hands-free display or sensing for constrained environments like helmets, field work, racing, and aerospace
    - Generic industrial software spend
    - Helmet HUDs, tablets, rugged wearables, specialized glasses
    - May accept companion hardware earlier than consumers will
  - - Enabling-component ecosystem
    - Microdisplays, battery systems, biosensors, companion devices, and test rigs specifically supporting smart lenses
    - Broad semiconductor or optics markets not dedicated to smart lenses
    - Standalone component suppliers
    - Important because Xpanceo’s near-term ecosystem value may emerge before end-user scale
