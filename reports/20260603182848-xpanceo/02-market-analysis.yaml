callouts:
- calloutType: insight
  title: The right market framing is wedge-first, not universe-first
  body: The public evidence supports a huge long-term need pool but a very small near-term monetizable market. Investors should underwrite Xpanceo as a wedge-market company first and a universal device platform second.
  claimRefs:
  - CM024
  - CM025
  - CM026
  - CM033
  - CM039
- calloutType: risk
  title: Regulation is a market-shaping force, not just a product checkpoint
  body: Direct-eye devices inherit biocompatibility, wear-duration, and clinical-accuracy burdens that radically narrow the serviceable market until proven. That is why the biggest theoretical markets are not automatically the first practical ones.
  claimRefs:
  - CM011
  - CM012
  - CM013
  - CM030
  - CM031
- calloutType: strength
  title: The category direction is real even if the lens category is immature
  body: IDC, Meta, Apple, and Snap collectively show that computing is moving toward lighter, more ambient wearable interfaces. Xpanceo benefits from that macro direction even though it still has to prove that a contact lens is the winning implementation.
