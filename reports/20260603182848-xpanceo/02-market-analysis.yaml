- id: buyers-segments
  title: Buyer, user, and payer segmentation
  body: 'Xpanceo’s likely buyer map splits into three distinct adoption paths. First is the medical route, where the user is the patient but the buyer and payer may sit with a provider, hospital system, ophthalmology practice, diabetes-management program, or insurer. In this segment, the job to be done is not futuristic XR; it is better monitoring, earlier intervention, and fewer clinic visits. Second is the consumer or prosumer XR route, where buyer, user, and payer initially collapse into the same person. Here the lens must compete against the convenience of existing screens and against smart glasses that already deliver lightweight AI assistance without direct ocular contact. Third is the enterprise or frontier route, where buyer and payer are employers or agencies while users are field workers, pilots, astronauts, racers, or defense personnel.


    This segmentation matters because each route implies a different proof burden. Medical buyers need validation, accuracy, and reimbursement logic. Consumer buyers need comfort, aesthetics, privacy, and clear everyday utility. Enterprise buyers need task completion, reliability, safety, and total-cost-of-ownership logic. Xpanceo’s own MWC 2026 messaging leans into this phased structure by highlighting medicine monitoring, glaucoma management, and frontier AR rather than only a generic consumer lens. That framing is strategically sensible because it matches the likely early market sequence better than the headline promise of replacing every personal device in one step.'
