evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-headcount
    missingEvidence: >-
      A current employee count and functional headcount split for engineering, clinical, regulatory, and operations
      roles.
    whyItMatters: >-
      Public sources conflict between 67-100 employees and do not support larger informal estimates, making scale
      assessment noisy.
    diligencePath: Request org chart, current employee census, and hiring plan from management.
    relatedQuestionRefs:
      - QO007
      - QO025
  - type: missing-source
    severity: blocking
    topic: clinical-and-regulatory-status
    missingEvidence: >-
      Named clinical-trial protocols, first-in-human results, or any filed/cleared regulatory submissions for the
      integrated lens.
    whyItMatters: Prototype progress cannot be translated into launch probability without clinical and regulatory evidence.
    diligencePath: Request regulatory roadmap, trial design documents, and any correspondence with FDA or EU notified bodies.
    relatedQuestionRefs:
      - QO022
      - QO025
  - type: missing-source
    severity: material
    topic: commercial-traction
    missingEvidence: Named paying customers, pilot contracts, revenue disclosures, or channel agreements for commercial deployment.
    whyItMatters: The valuation is hard to underwrite without any public commercial proof.
    diligencePath: Request customer pipeline, pilot agreements, and launch-market plan.
    relatedQuestionRefs:
      - QO021
      - QO025
  - type: private-evidence-only
    severity: material
    topic: governance-and-capital-terms
    missingEvidence: Board composition, pro-rata rights, preferences, and any undisclosed debt or secondary transactions.
    whyItMatters: Capital concentration and investor protections shape downside protection and next-round dynamics.
    diligencePath: Request cap table, board list, and financing documents under NDA.
    relatedQuestionRefs:
      - QO011
      - QO025
  - type: missing-source
    severity: material
    topic: leadership-roster-gap
    missingEvidence: >-
      A fuller public or NDA-provided leadership roster covering operations, product, regulatory, and finance roles
      beyond the founder pair and advisory chair.
    whyItMatters: >-
      The leadership table is intentionally partial because public information is concentrated on founders and selected
      external validators, which limits management bench assessment.
