              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI003
              - CI015
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI010
              - CI015
      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Oxylabs announced a $130 million investment from Warburg Pincus in July 2026 at an approximately $3.6
              billion valuation, described by multiple outlets as the company's first outside investment after a
              bootstrapped period. The proceeds were described as supporting global infrastructure, product development,
              and expansion toward AI and agentic applications. The public materials do not disclose cash on hand, cash
              consideration versus secondary liquidity, debt, preferred-stock terms, board rights, use-of-funds
              allocation, burn, runway, or a next-round trigger. SaaSRise explicitly says that the investment terms,
              including preferred-stock provisions or board seats, were not made public. Legal exposure is a financial
              variable: SiliconANGLE reports that Reddit sued Oxylabs and other providers over alleged collection of
              copyrighted content, while the article also characterizes large-scale scraping as a legal gray area. The
              result is a financially credible but disclosure-constrained profile: reported ARR and customer scale are
              encouraging, yet the absence of audited revenue, margin, cash-flow, and financing detail keeps the
              chapter's underwriting conclusion at track/research-more rather than buy.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Financial diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The most decision-relevant missing inputs are not additional headline funding figures. An investor needs a
              bridge from gross billings and usage to recognized revenue, a split between proxy, API, browser, AI-credit
              and dataset revenue, and evidence that reported ARR is repeatable rather than concentrated in a small
              number of high-volume accounts. Margin analysis should separate IP sourcing, bandwidth, data-center,
              anti-bot, browser compute, support, and sales costs. Capital diligence should reconcile the $130 million
              transaction with cash available to the operating company, any shareholder liquidity, debt or security
              preferences, and the planned investment pace. Commercial diligence should test list-versus-realized price,
              renewal, expansion, failed-request economics, and customer concentration. Until those items are disclosed,
              the reported scale is a useful starting point but not a complete basis for valuation or runway
              underwriting.
            claimRefs:
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reported scale with multiple monetization layers
            body: >-
              Oxylabs has reported more than $350 million of ARR and more than 350,000 customers while broadening from
              proxy access into managed web-data products.
            calloutType: strength
            claimRefs:
              - CI002
              - CI003
              - CI004
          - type: callout
            title: Financial disclosure is insufficient for full underwriting
            body: >-
              No retained source discloses audited revenue recognition, gross margin, cash, burn, runway, customer
              concentration, or Warburg's transaction terms.
            calloutType: risk
            claimRefs:
              - CI012
              - CI013
              - CI015
