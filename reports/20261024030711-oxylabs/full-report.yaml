  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer trade-offs
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than proxy vendors. Oxylabs sells a bundle of residential, mobile,
              ISP, and datacenter access plus scraper APIs, browser tooling, and AI-oriented extraction. AI Engineer
              describes the product surface as proxy networks, Web Scraper API, Fast Search API, browser automation, and
              custom datasets, while CNET frames the buyer fit as enterprise rather than individual usage. The landscape
              therefore has direct enterprise peers such as Bright Data, mid-market providers such as Decodo and SOAX,
              budget providers such as Proxy-Cheap, DataImpulse, and Webshare, and workflow substitutes such as Apify or
              a customer's internal scraper. A buyer can also use a status-quo approach: public APIs, direct crawling
              where permitted, or a smaller number of manually maintained data feeds.

              The central trade-off is not simply IP count. CNET reports 175 million residential IPs, 99.9%
              infrastructure uptime, and a 0.65-second average response time in its review of Proxyway results, but also
              says setup requires more technical expertise and that documentation is less beginner-friendly than
              Decodo's. AIMultiple's 2026 benchmark independently places Oxylabs among the fastest residential and
              mobile providers, while its methodology measures success only when a response is 200–399 and contains
              expected page content. This supports a premium reliability hypothesis, not a universal performance
              guarantee.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP009
              - CP010
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP004
              - CP006
              - CP011
              - CP016
      - number: '3.2'
        title: Capability, packaging, and distribution
        blocks:
          - type: paragraph
            body: >-
              Oxylabs' differentiation is the integration layer around access. AI Engineer reports country-to-coordinate
              targeting, sticky sessions, Web Unblocker, Unblocking Browser, Web Scraper API, OxyCopilot, AI Studio, and
              integrations with automation and agentic frameworks. Data4AI, a vendor review rather than independent
              proof, similarly describes specialized scrapers, cloud-storage delivery, and a playground that reduces
              request-building friction. The competitor implication is clear: Oxylabs can sell fewer moving parts to
              large data teams, especially when CAPTCHA handling, JavaScript rendering, and repeated extraction matter.

              Bright Data remains the closest broad platform comparison in the assigned evidence. Apify's comparison
              says Bright Data has a larger specialized API marketplace, while Oxylabs has a general scraper API and a
              more accessible playground. The same article reports G2 satisfaction scores of 67.88 for Oxylabs, 70.79
              for Bright Data, and 99.09 for Apify as of October 9, 2026, based on different review counts; this is a
              relative signal, not a controlled product benchmark. Managed substitutes also change the control boundary:
              ScraperAPI's official documentation uses request credits rather than bandwidth and does not sell
              individual pool IPs, while ScrapingBee describes a managed product that bundles proxy rotation and
              JavaScript rendering. The distribution advantage is therefore strongest where procurement values account
              management, compliance documentation, and managed workflows, while self-serve developers can multi-home
              across cheaper raw proxy suppliers, managed APIs, and open-source tooling.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP008
              - CP016
      - number: '3.3'
        title: Pricing pressure and moat durability
        blocks:
          - type: paragraph
            body: >-
              Public comparisons consistently position Oxylabs at the premium end, but list prices are not directly
              comparable across products or vendors. CNET shows residential pay-as-you-go pricing of $4.00 per GB and a
              1,000 GB tier at $2.00 per GB in its reviewed plans. Thunderbit's competitor-authored review likewise says
              volume lowers the unit rate, but argues that buyers below 50 GB per month can find better value elsewhere
              and that the path between small and enterprise tiers is awkward. The comparison demonstrates that product
              scope, commitment, and billing basis matter; a headline unit price is not a normalized total cost.

              Proxy-Cheap's own comparison positions itself as the budget winner and says Oxylabs is better suited to
              high-volume enterprise procurement. Because that source is competitor-authored, it is evidence of market
              positioning rather than an independent price-performance conclusion. ScraperAPI and ScrapingBee show
              another substitution path: managed products can charge by request or credit and absorb rotation or
              rendering work rather than selling raw pool IPs. Oxylabs' durable moat is consequently plausible in
              network quality, difficult-target know-how, and integrated workflow support, but exposed to
              commoditization, cheaper multi-homing, and legal or sourcing scrutiny. TNW reports that large-scale
              scraping sits in a legal grey zone and residential networks face sourcing scrutiny, making compliance and
              traffic-origin transparency strategic rather than merely promotional.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP013
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP016
      - number: '3.4'
        title: Competitive verdict and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Oxylabs appears strongest for enterprise buyers whose cost of blocked requests, downtime, or compliance
              review exceeds the premium paid for scale and managed tooling. CNET's review records strong target-level
              success rates in its cited Proxyway research, and AIMultiple's repeated benchmark cadence provides a
              better basis for monitoring than vendor marketing alone. The countercase is equally concrete: CNET
              identifies a steeper learning curve, Proxy-Cheap and Thunderbit promote cheaper or simpler alternatives,
              and Apify's comparison shows that a marketplace substitute can score higher on relative user satisfaction.
              Those latter comparisons are competitor-issued and support the existence of pricing pressure, not the
              vendors' superiority claims.

              The investment conclusion should therefore underwrite a segmented moat rather than assume category
              dominance. Key diligence asks are realized versus list pricing by workload, gross margin after residential
              traffic costs, retention and multi-homing, customer concentration, and the independently measured
              incremental value of Oxylabs' APIs over raw proxy access. The public evidence also does not establish
              whether reported network scale converts into durable availability on each buyer's target mix. Competitive
              advantage is credible, but durability remains conditional on maintaining traffic provenance, compliance,
              target success, and an integration surface that cheaper providers cannot quickly replicate.
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP011
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Premium positioning is buyer-specific
            body: >-
              Oxylabs' strongest defense is the combined reliability, targeting, and managed extraction stack; raw proxy
              bandwidth alone is exposed to cheaper alternatives and multi-homing.
            calloutType: insight
            claimRefs:
              - CP001
              - CP005
              - CP009
          - type: callout
            title: Moat evidence is not yet cohort evidence
            body: >-
              Public sources support capability and relative performance, but do not disclose retention, switching
              costs, realized price, or customer concentration by segment.
            calloutType: risk
            claimRefs:
              - CP012
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and observable traction
        blocks:
          - type: paragraph
            body: >-
              Public descriptions position Oxylabs as a layered web-data infrastructure business rather than a single
              proxy SKU. The offer spans residential, datacenter and mobile proxy access, managed scraping and browser
              products, and structured data services. Independent coverage describes the original proxy business
              evolving into a broader web-intelligence platform, while a competitor review says the company sells
              proxies and scraper APIs for large-scale data gathering. This supports a usage-linked infrastructure
              model, but it does not establish the mix of recurring subscriptions, usage revenue, datasets, or
              enterprise contracts. SiliconANGLE and The Next Web report more than 350,000 customers and ARR above $350
              million in connection with the July 2026 financing; these are company-reported figures carried by third
              parties, not audited financial statements. Customer count is also not defined as active paying accounts,
              technical teams, or end users. The evidence supports commercial scale, not a verified ARR bridge, cohort
              retention profile, or revenue concentration analysis.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
      - number: '4.2'
        title: Pricing, delivery cost, and unit economics
        blocks:
          - type: paragraph
            body: >-
              Public pricing evidence shows several billing meters: proxy traffic by gigabyte, fixed or dedicated IP
              allocations, successful scraper results, managed traffic, browser traffic, AI credits, and dataset
              subscriptions or custom quotes. Proxidize's reviewed price comparison reports public entry points of $30
              per month for 5GB of residential traffic and $30 per month for 4GB of mobile traffic, while its
              methodology says it competes with Oxylabs and did not purchase every plan. A separate competitor review
              reports Web Scraper API from $49 per month and datacenter pricing around $1.20 per IP, but it is not an
              official tariff. These observations are useful as list-price signals, not realized price or gross margin.
              Variable traffic, retries, anti-bot handling, browser assets, support, and network expansion can all
              affect cost to serve. The public record does not provide CAC, payback, churn, gross margin, contribution
              margin, utilization, or customer-level pricing, so unit-economics fields remain diligence asks rather than
              estimates.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
