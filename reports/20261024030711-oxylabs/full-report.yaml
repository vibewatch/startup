  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Oxylabs was established in 2015 and is headquartered in Vilnius, Lithuania. The company began as a premium
              proxy provider and now presents a broader web-data infrastructure platform for acquiring and structuring
              public-web information for enterprise and AI use cases. Independent coverage broadly confirms that
              evolution, while the company and its investor describe demand across cybersecurity, e-commerce, financial
              services, and AI systems. The disclosed commercial scale is substantial but remains management-reported:
              Oxylabs says it had $350 million of annual recurring revenue and more than 350,000 customers in July 2026.
              Neither figure should be read as audited revenue, cash, or a verified active-customer denominator. The
              operating profile is therefore clear, but its revenue quality and customer composition are not.
