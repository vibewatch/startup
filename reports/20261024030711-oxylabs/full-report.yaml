  - id: FM001
    title: Evidence-constrained market sizing ladder
    type: pyramid
    summary: >-
      The available evidence narrows from broad web-data demand to a company-specific opportunity, but only the broad
      adjacent-market layer has a published value and its methodology is incomplete.
    data:
      nodes:
        - label: Public-web data demand
          value: Not quantified
          detail: Broad need across AI, commerce, search, advertising, research, and security workflows
        - label: Web access infrastructure
          value: Not quantified
          detail: Proxy, unblocking, extraction API, and hosted browser spend
        - label: Adjacent web-scraping category
          value: $1.17B cited for 2026
          detail: Low-confidence top-down estimate with undisclosed boundary and geography
        - label: Enterprise premium tier
          value: Not quantified
          detail: Workloads where reliability, support, targeting, and governance justify a premium
        - label: Oxylabs serviceable market
          value: Not quantified
          detail: Requires segment demand, geographic eligibility, product fit, and pricing data
        - label: Oxylabs obtainable market
          value: Not quantified
          detail: Requires win rates, retention, capacity, competition, and account-level budget evidence
    approximationNotes: >-
      The ladder is a boundary hierarchy, not a proportional funnel. Only the adjacent 2026 category estimate is
      published; the other layers remain explicitly unquantified.
    claimRefs:
      - CM001
      - CM005
      - CM006
      - CM007
      - CM008
      - CM009
      - CM011
      - CM016
  - id: FP001
    title: Competitive positioning by enterprise depth and price flexibility
    type: quadrant
    summary: >-
      Evidence-backed ordinal positioning separates managed enterprise depth from self-serve price flexibility;
      coordinates are analytical scores, not measured market shares.
    data:
      points:
        - label: Oxylabs
          x: 8
          'y': 7
          detail: Managed APIs, broad proxy types, enterprise support; premium pricing and steeper setup
          tone: positive
        - label: Bright Data
          x: 9
          'y': 5
          detail: Broad marketplace and enterprise scope; higher complexity and quote friction reported
          tone: neutral
        - label: Decodo
          x: 6
          'y': 7
          detail: Mid-market ease and value positioning; narrower managed scope
          tone: neutral
        - label: Proxy-Cheap
          x: 3
          'y': 9
          detail: Budget and pay-as-you-go positioning; competitor-authored claims
          tone: neutral
        - label: DataImpulse
          x: 3
          'y': 8
          detail: Low-cost residential positioning; competitor-authored claims
          tone: neutral
        - label: Apify
          x: 7
          'y': 8
          detail: Large tool marketplace and workflow breadth; not a like-for-like proxy platform
          tone: neutral
      xAxis:
        label: Enterprise workflow depth
        min: 0
        max: 10
        low: Narrow raw access
        high: Broad managed workflow
        description: Analyst ordinal score from retained capability evidence
        scale: ordinal
      yAxis:
        label: Self-serve price flexibility
        min: 0
        max: 10
        low: High commitment
        high: Low commitment
        description: Analyst ordinal score from retained pricing evidence
        scale: ordinal
    approximationNotes: >-
      Ordinal scores synthesize the cited capability, pricing, and usability evidence; they are not a market-share
      ranking or a measured benchmark.
    claimRefs:
      - CP004
      - CP006
      - CP011
      - CP016
