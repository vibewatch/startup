  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Oxylabs' relevant market is paid infrastructure for accessing, collecting, and structuring public-web data
              at scale. It spans residential, mobile, ISP, and datacenter proxies; managed unblocking; scraper APIs; and
              hosted browser infrastructure. The boundary excludes consumer VPNs, generic cloud hosting, downstream
              analytics, and data products that do not perform acquisition. Buyers can also assemble an internal stack
              from proxy supply, browser automation, parsers, retries, and governance controls. That substitute matters
              because raw proxy spend and managed-result spend carry different denominators: bandwidth or IPs for the
              former, successful results or managed capacity for the latter.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports direction, not a bankable TAM. ProxyCove cites an approximately $1.17
              billion web-scraping market in 2026, up from $1.03 billion in 2025, and a $2.2-$2.3 billion early-2030s
              range at roughly 13-18% annual growth. The underlying analyst, geography, category boundary, and
              calculation are not reproduced, so these values remain low-confidence adjacent-market estimates. Proxyway
              instead supplies structural evidence: more than 50 vendors were established in 2025 while residential
              proxy access costs up to 75% less than three years earlier. Together, those lenses indicate demand growth
              alongside supply expansion and price compression, but they cannot isolate Oxylabs' serviceable or
              obtainable market.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
