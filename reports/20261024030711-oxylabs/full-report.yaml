      - number: '5.2'
        title: Operating architecture and technical dependencies
        blocks:
          - type: paragraph
            body: >-
              The architecture separates customer applications from access infrastructure. Developers or AI systems
              submit a target or route requests through an endpoint; managed services can then add rendering, CAPTCHA
              handling, blocking resistance, rotation, and parsing before returning pages or structured output. Oxylabs'
              documentation describes a 177+ million-IP network across 195 countries, but that headline is
              company-issued and does not disclose active, unique, concurrently available, or ethically audited
              addresses. A third-party directory describes Oxy Parser as using language models to generate XPath
              selectors and Pydantic models to validate output, with selector caching for repeat jobs. That is a
              specific technical mechanism, but the pool contains no reproducible accuracy, drift, or cost benchmark.
            claimRefs:
              - CE002
              - CE003
              - CE005
              - CE006
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
