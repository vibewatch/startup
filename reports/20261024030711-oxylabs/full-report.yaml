  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Oxylabs serves two related customer workflows: teams can route their own collection software through proxy
              infrastructure, or they can delegate more of the access, rendering, CAPTCHA, and request-management stack
              to managed products. The current official documentation names Web API, Proxies, Agent Browser, Web
              Unblocker, and the classic Web Scraper API, while an independent AI Engineer directory also identifies
              Fast Search API, browser automation, custom datasets, and AI Studio. This breadth lets developers choose
              between low-level control and managed extraction rather than forcing a single operating model. The
              tradeoff is portfolio complexity: public materials establish availability, but not product-level customer
              counts, workload mix, retention, or independently measured service quality for every module.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
