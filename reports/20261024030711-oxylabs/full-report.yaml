          - type: callout
            title: Track pending primary financial disclosure
            body: >-
              The financing validates investor interest, but the missing margin, cash-flow and capitalization data
              warrants a track/research-more stance rather than a fully underwritten buy.
            calloutType: recommendation
            claimRefs:
