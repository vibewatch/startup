        title: Exhibits
        blocks:
          - type: callout
            title: Treat public sizing as directional
            body: >-
              Use the retained market estimate as an adjacent-category reference only; build SAM and SOM bottom-up from
              eligible workloads, accepted-result economics, customer budgets, and observed win rates.
            calloutType: recommendation
            claimRefs:
