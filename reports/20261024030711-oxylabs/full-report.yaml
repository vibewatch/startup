      - number: '2.3'
        title: Buyer, user, and payer map
        blocks:
          - type: paragraph
            body: >-
              Public reviews consistently place Oxylabs in enterprise workflows such as AI data collection, e-commerce
              intelligence, SERP monitoring, ad verification, market research, and cybersecurity. Developers and data
              engineers are the direct users, while platform, commercial-analytics, marketing, or risk leaders are the
              likely budget owners. Adoption starts with a representative workload and expands when geographic coverage,
              accepted-result reliability, structured output, and support offset engineering effort. The commitment
              model favors recurring high-volume demand; smaller or volatile workloads face higher effective unit costs
              and can choose lighter providers or retain more work in-house. Public sources do not disclose Oxylabs'
              revenue mix by buyer or workflow.
            claimRefs:
              - CM004
              - CM010
              - CM011
              - CM015
