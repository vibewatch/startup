  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recent financing mark passes through operating-proof, comparable-quality, and risk gates before producing a
      track recommendation.
    data:
      nodes:
        - id: observed-mark
          label: $130M investment at a $3.6B mark
          note: Recent, corroborated transaction evidence
        - id: reported-scale
          label: $350M revenue or ARR; 350,000+ customers
          note: Issuer-reported operating scale
        - id: multiple-anchor
          label: Reported 10.3x revenue multiple
          note: Direct ratio, but metric basis needs reconciliation
        - id: evidence-gate
          label: Verify margins, retention, concentration, and security terms
          note: Private evidence required
        - id: risk-gate
          label: Test pricing, legal, and traffic-provenance downside
          note: No incident is inferred from missing evidence
        - id: decision
          label: Track at medium confidence
          note: Buy only with better proof or a lower effective price
    approximationNotes: The flow is qualitative; it does not imply numeric conversion rates, probabilities, or value-proportional steps.
