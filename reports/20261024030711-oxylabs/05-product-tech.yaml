company:
  name: Oxylabs
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Oxylabs has expanded from raw proxy access into a layered web-data platform spanning
    managed scraping APIs, browser automation, unblocking, search-oriented data access,
    and custom datasets. Independent reviews support the platform's scale and performance,
    but deployment complexity, bandwidth economics, security assurance, network-sourcing
    verification, and product-level adoption remain material diligence gaps.
sections:
  - id: product-surface
    title: Product surface and customer workflow
    body: >-
      Oxylabs serves two related customer workflows: teams can route their own collection
      software through proxy infrastructure, or they can delegate more of the access,
      rendering, CAPTCHA, and request-management stack to managed products. The current
      official documentation names Web API, Proxies, Agent Browser, Web Unblocker, and the
      classic Web Scraper API, while an independent AI Engineer directory also identifies
      Fast Search API, browser automation, custom datasets, and AI Studio. This breadth
      lets developers choose between low-level control and managed extraction rather than
      forcing a single operating model. The tradeoff is portfolio complexity: public
      materials establish availability, but not product-level customer counts, workload
      mix, retention, or independently measured service quality for every module.
    claimRefs: [CE001, CE002, CE003, CE004, CE005]
    tableRefs: [TE001]
  - id: operating-architecture
    title: Operating architecture and technical dependencies
    body: >-
      The architecture separates customer applications from access infrastructure.
      Developers or AI systems submit a target or route requests through an endpoint;
      managed services can then add rendering, CAPTCHA handling, blocking resistance,
      rotation, and parsing before returning pages or structured output. Oxylabs'
      documentation describes a 177+ million-IP network across 195 countries, but that
      headline is company-issued and does not disclose active, unique, concurrently
      available, or ethically audited addresses. A third-party directory describes Oxy
      Parser as using language models to generate XPath selectors and Pydantic models to
      validate output, with selector caching for repeat jobs. That is a specific technical
      mechanism, but the pool contains no reproducible accuracy, drift, or cost benchmark.
    claimRefs: [CE002, CE003, CE005, CE006]
    tableRefs: [TE002]
    figureRefs: [FE001]
  - id: deployment-reliability
    title: Deployment, integration, and reliability
    body: >-
      External evidence suggests strong infrastructure but a meaningful implementation
      burden. CNET, citing Proxyway's 2025 research and its own use, reported 99.9% uptime,
      a 93.28% average success rate on named popular targets, and a 0.65-second average
      response time; those figures should remain tied to that methodology and should not
      be generalized to every target or Oxylabs product. CNET also found the service less
      beginner-friendly and more technically demanding than alternatives. A Scrapfly
      implementation guide shows why: raw-proxy users still manage credentials,
      authentication, connection pooling, rotation, payload size, retries, and target-side
      blocking. A separate Proxyway test of 15 highly protected sites reported an 85.82%
      average success rate and 16.76-second average response time for Oxylabs' Web
      Unblocker. Managed APIs reduce implementation burden, but shift diligence toward
      opaque routing, target coverage, benchmark variation, and escalation support.
    claimRefs: [CE007, CE008, CE009, CE010, CE011, CE012, CE013, CE014]
    tableRefs: [TE003]
  - id: differentiation-controls
    title: Differentiation, controls, and roadmap evidence
    body: >-
      The defensible product thesis is breadth plus operating scale: one vendor offers raw
      networks, managed extraction, browser automation, unblocking, and AI-oriented data
      interfaces. CNET's review provides the strongest independent support for proxy
      quality and integrations, while competitor-authored comparisons acknowledge
      reliability, broad geography, responsive support, and a comparatively intuitive API
      playground. Those same comparisons flag premium pricing and learning-curve risk, so
      they are directional rather than independent benchmarks. Trust evidence is weaker.
      A review site reports KYC, ethical IP sourcing, and privacy controls, but the assigned
      evidence does not include certification reports, penetration-test summaries, a
      status history, incident disclosures, supplier-consent audits, or a dated roadmap.
      The official documentation was visibly maintained at retrieval, yet documentation
      freshness alone does not prove control effectiveness or roadmap execution.
    claimRefs: [CE007, CE008, CE009, CE012, CE013, CE014, CE015, CE016]
callouts:
  - calloutType: risk
    title: Assurance lags product breadth
    body: >-
      Public evidence supports a broad, mature-looking product surface, but not a complete
      security, privacy, sourcing, or reliability control record. Underwriting should
      require product-specific SLAs and independent assurance rather than extrapolating
      from network scale or marketing claims.
    claimRefs: [CE003, CE008, CE015, CE016]
