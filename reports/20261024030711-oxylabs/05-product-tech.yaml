      - - Parsing and structured output
        - "Turns retrieved HTML or search output into reusable structured data"
        - "Selector generation, schema validation, caches, and site-layout adaptation"
        - "No reproducible accuracy, drift, or exception-handling benchmark in assigned evidence"
    notes: >-
      This is a functional decomposition synthesized from official documentation and
      third-party implementation descriptions, not a disclosed internal system diagram.
    claimRefs: [CE002, CE006, CE007, CE010, CE011, CE016]
