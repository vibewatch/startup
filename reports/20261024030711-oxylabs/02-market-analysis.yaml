      - ["E-commerce and market intelligence", "Commercial-intelligence lead", "Analyst or developer", "Commercial analytics budget", "Localized price, inventory, and assortment monitoring", "Commercial operations or marketing leader", "Reliable geographic coverage and accepted outputs"]
      - [SEO and ad verification, "Search or advertising lead", "SEO analyst or automation engineer", "Marketing technology budget", "SERP monitoring, localization, and placement checks", "Marketing leader", "Repeatable collection across locations and protected targets"]
      - ["Cybersecurity and enterprise automation", "Security, trust, or automation lead", "Security analyst or developer", "Risk, security, or operations budget", "Threat intelligence and persistent automated workflows", "CISO or operations leader", "Stable sessions, controls, support, and procurement-ready governance"]
    notes: "Roles are evidence-constrained synthesis from retained reviews and use-case descriptions; public evidence does not disclose Oxylabs' segment revenue, retention, or budget concentration."
    claimRefs: [CM004, CM010, CM011, CM015]
figures:
  - id: FM001
    title: Evidence-constrained market sizing ladder
    type: pyramid
    summary: The available evidence narrows from broad web-data demand to a company-specific opportunity, but only the broad adjacent-market layer has a published value and its methodology is incomplete.
    data:
      nodes:
        - label: Public-web data demand
          value: "Not quantified"
          detail: "Broad need across AI, commerce, search, advertising, research, and security workflows"
        - label: Web access infrastructure
          value: "Not quantified"
          detail: "Proxy, unblocking, extraction API, and hosted browser spend"
        - label: Adjacent web-scraping category
          value: "$1.17B cited for 2026"
          detail: "Low-confidence top-down estimate with undisclosed boundary and geography"
        - label: Enterprise premium tier
          value: "Not quantified"
          detail: "Workloads where reliability, support, targeting, and governance justify a premium"
        - label: Oxylabs serviceable market
          value: "Not quantified"
          detail: "Requires segment demand, geographic eligibility, product fit, and pricing data"
        - label: Oxylabs obtainable market
          value: "Not quantified"
          detail: "Requires win rates, retention, capacity, competition, and account-level budget evidence"
    approximationNotes: "The ladder is a boundary hierarchy, not a proportional funnel. Only the adjacent 2026 category estimate is published; the other layers remain explicitly unquantified."
    claimRefs: [CM001, CM005, CM006, CM007, CM008, CM009, CM011, CM016]
callouts:
  - calloutType: recommendation
    title: Treat public sizing as directional
    body: Use the retained market estimate as an adjacent-category reference only; build SAM and SOM bottom-up from eligible workloads, accepted-result economics, customer budgets, and observed win rates.
    claimRefs: [CM008, CM009]
  - calloutType: risk
    title: Growth and commoditization coexist
    body: AI-led usage can expand while raw residential access gets cheaper and new suppliers proliferate, shifting value toward reliability, managed extraction, and governance.
    claimRefs: [CM005, CM006, CM007, CM016]
