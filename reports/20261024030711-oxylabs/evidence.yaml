evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: >-
      Transaction documents showing primary versus secondary proceeds, security type, preferences, dilution, and
      governance rights.
    whyItMatters: Funding raised does not show how much cash entered the company or how investor economics and control changed.
    diligencePath: >-
      Request the executed investment agreement, pre- and post-close cap tables, funds-flow statement, and
      shareholder-rights schedule.
    relatedQuestionRefs:
      - QO005
      - QO010
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: disclosure
    missingEvidence: >-
      Audited financial statements and reconciled definitions for ARR, revenue by product, customer count, gross margin,
      retention, and concentration.
    whyItMatters: >-
