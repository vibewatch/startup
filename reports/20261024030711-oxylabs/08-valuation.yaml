    title: Recommendation logic
    type: flow
    summary: The recent financing mark passes through operating-proof, comparable-quality, and risk gates before producing a track recommendation.
    data:
      nodes:
        - id: observed-mark
          label: "$130M investment at a $3.6B mark"
          note: "Recent, corroborated transaction evidence"
        - id: reported-scale
          label: "$350M revenue or ARR; 350,000+ customers"
          note: "Issuer-reported operating scale"
        - id: multiple-anchor
