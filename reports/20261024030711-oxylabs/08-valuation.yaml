    title: Recommendation summary table
    columns: [Dimension, Assessment, Evidence basis, Decision implication]
    rows:
      - [Recommendation, track, "A recent $3.6B financing mark exists, but operating quality and security terms remain private.", "Monitor and complete private diligence before considering entry."]
      - [Confidence, medium, "The transaction is well corroborated; core underwriting inputs are not.", "Raise confidence only after reconciling operating metrics and financing rights."]
      - [Risk rating, high, "Premium pricing, legal sensitivity, private-company disclosure, and multiple risk can compound.", "Require downside protection and explicit thesis-break monitoring."]
      - [Valuation stance, "fair only conditionally", "The reported mark equals 10.3x the recorded $350M revenue-or-ARR figure.", "Treat the mark as unsupported if the metric basis or durability fails verification."]
    notes: "Assessment as of 2026-10-24; the transaction mark is reported, while recommendation, confidence, risk rating, valuation stance, and implications are analytical judgments constrained by missing private evidence."
    claimRefs: [CV001, CV005, CV007, CV008, CV009, CV012, CV013, CV014, CV015, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, Evidence read, What would change the view, Current implication]
    rows:
      - ["Enterprise scale", "Reported $350M revenue or ARR and 350,000+ customers indicate scale.", "An audited bridge shows materially lower recurring revenue or concentrated low-quality demand.", "Supports continued diligence, not a buy by itself."]
      - ["Premium infrastructure positioning", "Independent review describes enterprise reliability, support, and difficult-target use cases.", "Win-rate, uptime, retention, or realized-price data fail to support a premium.", "Potential moat remains unverified economically."]
      - ["Customer cost pressure", "Residential usage is billed by bandwidth, and reviewers characterize Oxylabs as premium priced.", "Cohort retention and gross margin prove superior total cost of ownership.", "Creates exposure to lower-cost alternatives."]
      - ["Compliance and traffic provenance", "Industry coverage identifies legal sensitivity and names Oxylabs in a web-data dispute.", "Independent legal and sourcing assurance shows controls, clean provenance, and no material unresolved exposure.", "A valuation prerequisite and downside monitor."]
    notes: "The table distinguishes issuer-reported scale from independent reviews and competitor commentary; legal coverage is a risk signal, not a finding of liability or proof of an incident."
    claimRefs: [CV003, CV004, CV006, CV007, CV008]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation and return logic, Probability signal, Key risk or downside trigger]
    rows:
      - [Bull, "The $350M metric is reconciled to durable recurring revenue; growth, margins, retention, and compliance controls support premium quality.", "Upside to the current mark could be justified, but no public dollar range or target return is defensible.", "Requires private proof; public probability is not estimable.", "Operating evidence fails to support premium economics."]
      - [Base, "The reported metric is substantially verified and the current enterprise positioning persists.", "The $3.6B transaction and reported 10.3x ratio remain the only direct anchors; entry still depends on security terms.", "Most observable anchor, not a probability estimate.", "The metric proves to be run-rate rather than durable recurring revenue."]
      - [Bear, "Revenue quality, pricing, legal exposure, or traffic provenance weakens and the multiple compresses.", "A lower effective entry price is required; incompatible or internally inconsistent comparables do not establish a precise floor.", "Material downside remains plausible but unquantified.", "Down-round, sustained compression, or material compliance disruption."]
    notes: "Scenarios intentionally omit unsupported valuation ranges, probabilities, and target returns. C3 AI and Similarweb-related observations illustrate comparability limits rather than supplying Oxylabs multiples."
    claimRefs: [CV003, CV005, CV006, CV007, CV008, CV009, CV010, CV011, CV012, CV015, CV016]
