company:
  name: Oxylabs
chapter:
  number: 8
  title: Valuation
  summary: Oxylabs' July 2026 financing establishes a $3.6 billion private mark and a reported 10.3x multiple on a $350 million revenue-or-ARR figure. The evidence supports tracking the company rather than buying at that mark because revenue quality, economics, security terms, and comparable-company calibration remain insufficiently disclosed.
sections:
  - id: financing-anchor
    title: Financing anchor and decision frame
    body: >-
      The clearest price signal is the July 2026 Warburg Pincus transaction:
      company-issued material syndicated by Yahoo Finance and independent sources
      report a $130 million investment at an approximately $3.6 billion valuation.
      They also describe it as Oxylabs' first external institutional financing after
      years of bootstrapping. Public reporting associates the transaction with a
      $350 million revenue-or-ARR figure and more than 350,000 customers, but those
      operating figures remain issuer-reported rather than audited evidence in the
      assigned pool. The financing therefore proves that an informed investor accepted
      the headline mark; it does not establish common-equity value, target return, or
      the durability of the metric used to justify the price.
    claimRefs: [CV001, CV002, CV003, CV004, CV009, CV013, CV014]
    tableRefs: [TV001]
  - id: thesis-antithesis
    title: Thesis and anti-thesis
    body: >-
      The investment thesis is enterprise positioning: independent review evidence
      describes Oxylabs as a premium provider built for difficult, large-scale
      collection workloads, while the reported customer base and outside financing
      indicate meaningful commercial scale. The anti-thesis is that premium pricing
      and bandwidth-sensitive usage can raise customer cost, and a competitor's
      optimization guide explicitly frames itself as an alternative to buying raw
      bandwidth. Legal and sourcing exposure also remain valuation variables. The
      Next Web characterizes large-scale scraping as legally sensitive, and ProxyCove
      discusses litigation in which Oxylabs was named as an intermediary. These
      sources do not prove liability or an incident, but they make compliance quality,
      traffic provenance, retention, and margin evidence prerequisites for sustaining
      a premium multiple.
    claimRefs: [CV002, CV003, CV004, CV006, CV007, CV008]
    tableRefs: [TV002]
  - id: scenarios-comparables
    title: Scenarios and comparable evidence
    body: >-
      Multiples.vc calculates 10.3x against its recorded $350 million figure, making
      that ratio the only direct public valuation anchor in the pool. The wider
      comparable evidence is not strong enough to produce a defensible range. C3 AI's
      filed exhibit reports fiscal-year revenue of $250.3 million alongside a
      $498.5 million GAAP operating loss, demonstrating how an AI-labelled company can
      have economics unlike a profitable infrastructure provider. A Similarweb
      market-data page is internally inconsistent about its own price-to-sales ratio,
      displaying 2.62, 34.0, and 1.66 on the same page. Rather than average incompatible
      businesses or unreliable observations, the scenarios below state the operating
      evidence that would justify upside, preserve the current mark, or require a
      lower entry price.
    claimRefs: [CV005, CV010, CV011, CV012, CV015, CV016]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: recommendation-diligence
    title: Recommendation, exit readiness, and diligence
    body: >-
      The current recommendation is track, with medium confidence, a high risk rating,
      and a conditionally fair valuation stance. The $3.6 billion mark is credible as
      a recent transaction observation, but public evidence cannot support a buy or a
      target return without an audited revenue-to-ARR bridge, gross margin, retention,
      customer concentration, cohort quality, and the executed financing rights.
      Exit readiness is similarly unproven because the pool contains no audited Oxylabs
      statements, public-company control record, or disclosed path to liquidity.
      A buy case requires either materially better operating proof or a lower effective
      common-equity entry price. A down-round, weaker substantiated revenue basis,
      sustained price compression, or a material compliance or traffic-sourcing
      disruption would break the current thesis.
    claimRefs: [CV001, CV005, CV007, CV008, CV009, CV012, CV013, CV014, CV015, CV016]
