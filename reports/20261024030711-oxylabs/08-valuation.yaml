          note: "Direct ratio, but metric basis needs reconciliation"
        - id: evidence-gate
          label: "Verify margins, retention, concentration, and security terms"
          note: "Private evidence required"
        - id: risk-gate
          label: "Test pricing, legal, and traffic-provenance downside"
          note: "No incident is inferred from missing evidence"
        - id: decision
          label: "Track at medium confidence"
          note: "Buy only with better proof or a lower effective price"
    approximationNotes: "The flow is qualitative; it does not imply numeric conversion rates, probabilities, or value-proportional steps."
    claimRefs: [CV001, CV003, CV005, CV008, CV009, CV013]
callouts:
  - calloutType: recommendation
    title: Track, not buy
    body: "The financing mark is credible enough to anchor diligence, but public evidence is not sufficient to underwrite common-equity value or a target return."
    claimRefs: [CV001, CV009, CV012, CV013, CV014]
  - calloutType: risk
    title: Do not convert reported scale into audited economics
    body: "The $350 million figure is variously described as revenue, ARR, run-rate revenue, or LTM revenue; a management and audit bridge is required before using it as a durable valuation denominator."
    claimRefs: [CV003, CV005, CV015]
