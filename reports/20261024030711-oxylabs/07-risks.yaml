          values: [null, 1, 1, null, High]
        - label: Scraping litigation and access restrictions
          values: [null, null, 1, null, High]
        - label: Network reliability and bandwidth economics
          values: [null, null, 1, null, Medium-high]
        - label: Acquisition and financing dependency
          values: [null, 1, 1, null, Medium-high]
        - label: Regulatory transparency obligations
          values: [null, 1, null, null, Medium-high]
        - label: Customer concentration and churn
          values: [null, 1, null, null, High]
    approximationNotes: "Likelihood, impact, mitigation maturity, and residual severity are qualitative analytical ratings from the cited public evidence; the matrix does not imply quantified probabilities."
    claimRefs: [CR001, CR003, CR005, CR009, CR013]
callouts:
  - calloutType: risk
    title: Thesis-break trigger
    body: "A substantiated unlawful-source finding, material injunction, or sustained service deterioration that causes measurable customer loss would break the current infrastructure thesis; absent private control evidence, those triggers remain unresolved."
    claimRefs: [CR003, CR004, CR008, CR013]
  - calloutType: insight
    title: Public evidence is control-oriented, not outcome-oriented
    body: "KYC, ethical procurement, and monitoring are described as controls, but the assigned sources do not establish their coverage, independent assurance, incident outcomes, or customer-level effectiveness."
    claimRefs: [CR004, CR009, CR013, CR014]
