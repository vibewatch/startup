callouts:
  - calloutType: strength
    title: Institutional capital followed a decade of self-funded development
    body: Independent coverage and the investor announcement agree that the July 2026 transaction was Oxylabs' first outside investment since its 2015 founding.
    claimRefs: [CO001, CO009]
  - calloutType: risk
    title: Headline financing does not resolve control or liquidity
    body: Public sources disclose the investment and valuation but not the primary-versus-secondary mix, security, preferences, dilution, or governance rights.
    claimRefs: [CO013]
  - calloutType: assumption
    title: Scale metrics remain reported rather than audited
    body: The $350 million ARR, more-than-350,000-customer, and approximately-500-employee figures require definitions and reconciliations before underwriting.
    claimRefs: [CO004, CO005, CO014, CO016]
