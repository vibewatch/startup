chapter:
  number: 1
  title: Company Overview
  summary: Oxylabs is a Vilnius-based web-data infrastructure and premium proxy provider established in 2015 that took its first outside investment in July 2026, a $130 million Warburg Pincus transaction valuing it at approximately $3.6 billion. The evidence supports substantial reported scale and a defined executive transition, but audited metric definitions, founder and board detail, and transaction rights remain private.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Oxylabs was established in 2015 and is headquartered in Vilnius, Lithuania. The
      company began as a premium proxy provider and now presents a broader web-data
      infrastructure platform for acquiring and structuring public-web information for
      enterprise and AI use cases. Independent coverage broadly confirms that evolution,
      while the company and its investor describe demand across cybersecurity,
      e-commerce, financial services, and AI systems. The disclosed commercial scale is
      substantial but remains management-reported: Oxylabs says it had $350 million of
      annual recurring revenue and more than 350,000 customers in July 2026. Neither
      figure should be read as audited revenue, cash, or a verified active-customer
      denominator. The operating profile is therefore clear, but its revenue quality and
      customer composition are not.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO016]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Vytautas Savickas is identified as chief executive officer or group chief
      executive, and Jurgis Gabrielius Rudgalvis as chief financial officer. Tech Funding
      News reports that Savickas moved into the group CEO role earlier in 2026 and that
      Julius Cerniauskas became chairman, giving investors a visible operating-to-chair
      transition but not a complete succession plan. The assigned evidence does not
      establish Oxylabs' legal founders, a full board roster, executive ownership, or the
      governance rights obtained by Warburg Pincus. Those omissions prevent a reliable
      assessment of voting control, founder dependence, board independence, and
      management depth. Public statements show clear CEO and CFO accountability for
      strategy and capital allocation; they do not reveal the institutional checks around
      those executives.
    claimRefs: [CO006, CO007, CO008, CO013]
    tableRefs: [TO002]
  - id: capital-history-and-milestones
    title: Capital history, milestones, and exposure
    body: >-
      The July 9, 2026 transaction is consistently described as Oxylabs' first outside
      investment since 2015. Warburg Pincus invested $130 million at an approximately
      $3.6 billion valuation, but the public disclosures do not identify how much was
      primary growth capital versus shareholder liquidity, what security was issued, or
      which preferences and board rights accompanied it. Earlier acquisitions of Webshare
      in 2022 and ScrapingBee in 2025 show that the platform expansion preceded the
      institutional round. Independent and industry commentary also identifies legal
      scrutiny of large-scale scraping and residential-proxy sourcing as a category-level
      exposure. That does not establish an adjudicated adverse outcome against Oxylabs:
      the assigned pool lacks a primary court or regulatory record sufficient to verify
      one. The investment strengthens strategic capacity, but headline funding raised is
      not the same as cash available to the company.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO015]
    tableRefs: [TO003]
    figureRefs: [FO001]
