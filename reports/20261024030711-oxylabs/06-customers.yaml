      - ["Residential proxy benchmark", "560,000 requests over 14 days; Oxylabs: 489,032 unique IPs, 99.83% average success, 0.68-second average response", "Current page accessed 2026-10-24", "Proxyway; medium confidence for the published test", "Supports reliability as a customer value proposition", "No customer-adoption, renewal, or revenue denominator"]
    notes: "The table separates operating evidence, service-level claims, company-reported scale, and review volume; none is a retention or revenue cohort."
    claimRefs: [CU005, CU006, CU007, CU016]
  - id: TU003
    title: Named customer proof table
    columns: [Customer, Segment, Deployment / use case, Production vs pilot, Outcome, Limitation]
    rows:
      - [Wiser Solutions, Retail intelligence software, Datacenter proxies for repeated extraction across thousands of domains, Production-use described by customer executive, "Steady flow of retail data supporting retail insights", "Company-issued case study; no contract, renewal, or independently audited outcome"]
      - [Capterra reviewer set, Mixed self-employed and small-business users, "Proxy setup, scraping, and recurring service use", "User reviews; individual production status varies", "Reviews cite speed, support, and reliability", "Reviews are self-selected and do not prove enterprise retention"]
      - [Trustpilot reviewer set, Small and individual users, Proxy setup and support interactions, User reviews; deployment status not disclosed, "Recent reviews cite helpful setup and support", "Also contains an adverse top-up-credit complaint; no verified account or spend data"]
