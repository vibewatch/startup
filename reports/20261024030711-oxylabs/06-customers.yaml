chapter:
  number: 6
  title: Customers
  summary: Oxylabs appears oriented toward enterprise data-collection teams that value delivery reliability, geographic targeting, and managed scraping over low entry price. Evidence supports a named Wiser deployment and sampled third-party user feedback, but public evidence does not establish retention, cohort durability, customer concentration, or the production status of most logos.
sections:
  - id: buyer-segments
    title: Buyer, user, and payer segments
    body: >-
      The evidence points to a two-layer customer model. Technical data teams can buy direct
      proxy access and retain responsibility for clients, parsers, retries, and monitoring, while
      larger enterprises can buy managed APIs that return HTML or structured records. The buyer
      is therefore usually a web-data, e-commerce intelligence, SEO, advertising, AI-data, or
      security team; the end user may be an engineer or analyst, and the economic payer is the
      business whose data workflow depends on those requests. Enterprise orientation is
      corroborated by independent reviews describing large-scale programs, account managers,
      KYC, and pricing that improves with volume. This supports a high-value, usage-linked
      infrastructure proposition, but it does not reveal segment mix, average contract value, or
      revenue by vertical.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-proof
    title: Adoption trajectory and named customer proof
    body: >-
      Public adoption evidence is strongest where a customer describes an operating workflow,
      rather than where Oxylabs displays a logo. Wiser Solutions says it uses Oxylabs
      Datacenter Proxies to make thousands of extraction requests to thousands of domains
      multiple times per day, and identifies reliable, cost-effective data collection as a
      business requirement. That is meaningful production-use evidence for a retail-intelligence
      customer, although the case study is company-issued and reports no contract value,
      renewal metric, or independently audited outcome. Capterra reviews add user-level evidence
      of setup, speed, support, and multi-year use, while also flagging price and tiering as
      constraints. The broader claim that Oxylabs has more than 350,000 customers or technical
      teams was repeated by The Next Web and ProxyCove from company disclosures; neither source
      establishes a verified active-account count, paid-account share, or common denominator.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002, TU003]
  - id: durability-and-expansion
    title: Retention, expansion, and procurement friction
    body: >-
      The commercial logic supports expansion inside a customer workflow: a team can start with
      a direct proxy, add geographic coverage or higher-volume pools, and move selected targets
      to managed scraping APIs.       Review evidence describes enterprise support, large-volume
      pricing advantages, and switching costs created by integration and operational reliability.
      Those are mechanisms for expansion, not proof that expansion occurs. No retained source
      provides NRR, GRR, logo churn, renewal rates, cohort data, contract duration, or customer
      concentration. Procurement friction is visible: residential access may require KYC and
      review, and smaller users face high entry prices or restricted trial access. This can
      protect quality and compliance while narrowing the addressable buyer pool. The key
      diligence question is whether large accounts renew and broaden usage after initial
      integration, rather than whether the product can attract one-off users.
    claimRefs: [CU010, CU011, CU012, CU013]
  - id: customer-risk
    title: Customer-quality risks and diligence gaps
    body: >-
      Customer evidence is positive but unevenly independent. Wiser provides a concrete
      production-use reference, and an archived Capterra page includes 22 reviews with positive
      comments on reliability and support; however, the historical review set also identifies premium pricing, steep
      plan steps, and limited pay-as-you-go flexibility. Trustpilot contains both recent support
      praise and an adverse complaint alleging that top-up credits disappeared, which is a
      customer-experience signal rather than proof of systemic misconduct. Reviews do not
      establish retention or revenue durability, and the named Wiser relationship does not
      establish that other logos are production deployments. Before underwriting, obtain a
      customer cohort bridge, gross and net retention, top-customer and channel concentration,
      production-versus-pilot status for named references, and evidence that pricing or KYC
      friction is not driving avoidable churn.
    claimRefs: [CU014, CU015, CU016, CU010]
    figureRefs: [FU001]
