      coverage: partial
      basis: "Publicly named or platform-identified customer evidence available in the assigned URLs accessed on 2026-10-24"
    notes: "Only Wiser is a named company deployment. Review-platform rows are evidence of user experience, not named enterprise references or verified production deployments."
    claimRefs: [CU005, CU006, CU014, CU015, CU016]
