        - id: expand
          label: "Expand"
          detail: "More traffic, geographies, products, or managed extraction"
        - id: renew
          label: "Renew"
          detail: "Retention and concentration are not publicly disclosed"
    claimRefs: [CU010, CU011, CU012]
callouts:
  - calloutType: strength
    title: Concrete production reference
    body: "Wiser describes repeated extraction across thousands of domains and positions Oxylabs as part of its retail-intelligence workflow, which is stronger evidence than a logo-only reference."
    claimRefs: [CU005, CU006]
  - calloutType: risk
    title: Durability is the central unknown
    body: "The assigned evidence does not disclose NRR, GRR, churn, contract duration, cohorts, or top-customer concentration, so adoption breadth cannot be converted into a durability conclusion."
    claimRefs: [CU010, CU013]
