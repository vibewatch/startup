company:
  name: Oxylabs
chapter:
  number: 4
  title: Financials
  summary: Oxylabs presents a large, recurring-revenue profile and has recently added substantial institutional capital, but the public record does not disclose audited revenue quality, margins, cash, burn, or financing terms. The underwriting case therefore rests on reported scale and product breadth while treating profitability, concentration, and capital adequacy as unresolved.
sections:
  - id: revenue-quality
    title: Revenue model and observable traction
    body: >-
      Public descriptions position Oxylabs as a layered web-data infrastructure business rather than a single proxy SKU. The offer spans residential, datacenter and mobile proxy access, managed scraping and browser products, and structured data services. Independent coverage describes the original proxy business evolving into a broader web-intelligence platform, while a competitor review says the company sells proxies and scraper APIs for large-scale data gathering. This supports a usage-linked infrastructure model, but it does not establish the mix of recurring subscriptions, usage revenue, datasets, or enterprise contracts. SiliconANGLE and The Next Web report more than 350,000 customers and ARR above $350 million in connection with the July 2026 financing; these are company-reported figures carried by third parties, not audited financial statements. Customer count is also not defined as active paying accounts, technical teams, or end users. The evidence supports commercial scale, not a verified ARR bridge, cohort retention profile, or revenue concentration analysis.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
  - id: monetization-and-costs
    title: Pricing, delivery cost, and unit economics
    body: >-
      Public pricing evidence shows several billing meters: proxy traffic by gigabyte, fixed or dedicated IP allocations, successful scraper results, managed traffic, browser traffic, AI credits, and dataset subscriptions or custom quotes. Proxidize's reviewed price comparison reports public entry points of $30 per month for 5GB of residential traffic and $30 per month for 4GB of mobile traffic, while its methodology says it competes with Oxylabs and did not purchase every plan. A separate competitor review reports Web Scraper API from $49 per month and datacenter pricing around $1.20 per IP, but it is not an official tariff. These observations are useful as list-price signals, not realized price or gross margin. Variable traffic, retries, anti-bot handling, browser assets, support, and network expansion can all affect cost to serve. The public record does not provide CAC, payback, churn, gross margin, contribution margin, utilization, or customer-level pricing, so unit-economics fields remain diligence asks rather than estimates.
    claimRefs: [CI005, CI006, CI007, CI008, CI009]
    tableRefs: [TI002, TI003]
    figureRefs: [FI001]
  - id: capital-adequacy
    title: Capital adequacy and underwriting verdict
    body: >-
      Oxylabs announced a $130 million investment from Warburg Pincus in July 2026 at an approximately $3.6 billion valuation, described by multiple outlets as the company's first outside investment after a bootstrapped period. The proceeds were described as supporting global infrastructure, product development, and expansion toward AI and agentic applications. The public materials do not disclose cash on hand, cash consideration versus secondary liquidity, debt, preferred-stock terms, board rights, use-of-funds allocation, burn, runway, or a next-round trigger. SaaSRise explicitly says that the investment terms, including preferred-stock provisions or board seats, were not made public. Legal exposure is a financial variable: SiliconANGLE reports that Reddit sued Oxylabs and other providers over alleged collection of copyrighted content, while the article also characterizes large-scale scraping as a legal gray area. The result is a financially credible but disclosure-constrained profile: reported ARR and customer scale are encouraging, yet the absence of audited revenue, margin, cash-flow, and financing detail keeps the chapter's underwriting conclusion at track/research-more rather than buy.
    claimRefs: [CI010, CI011, CI012, CI013, CI014]
    tableRefs: []
  - id: diligence-blockers
    title: Financial diligence blockers
    body: >-
      The most decision-relevant missing inputs are not additional headline funding figures. An investor needs a bridge from gross billings and usage to recognized revenue, a split between proxy, API, browser, AI-credit and dataset revenue, and evidence that reported ARR is repeatable rather than concentrated in a small number of high-volume accounts. Margin analysis should separate IP sourcing, bandwidth, data-center, anti-bot, browser compute, support, and sales costs. Capital diligence should reconcile the $130 million transaction with cash available to the operating company, any shareholder liquidity, debt or security preferences, and the planned investment pace. Commercial diligence should test list-versus-realized price, renewal, expansion, failed-request economics, and customer concentration. Until those items are disclosed, the reported scale is a useful starting point but not a complete basis for valuation or runway underwriting.
    claimRefs: [CI015, CI016]

tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [stream, mechanism, unit, current value/status, quality, diligence ask]
    rows:
      - [Proxy access, "Residential, datacenter, mobile and related IP products", "GB, IP or allocation", "Public product descriptions; no consolidated mix", "Observed product structure", "Revenue and gross-margin mix by proxy type"]
      - [Managed web access, "Web Scraper API, Web Unblocker and browser services", "Successful result or managed traffic", "Publicly described; no revenue split", "Observed product structure", "Billable-event definition, success rate and realized price"]
      - [AI/data products, "AI extraction, structured datasets and enterprise web intelligence", "Credits, subscription or custom dataset", "Publicly described; custom pricing is common", "Observed product structure", "Contracted ARR, renewal and delivery-cost bridge"]
      - [Reported traction, "Company-reported customer and ARR scale", "Customers and ARR", "More than 350,000 customers; ARR above $350M", "Third-party reported company claim", "Active paying-account definition and ARR reconciliation"]
    notes: "Sources include third-party coverage and competitor reviews; product breadth is not a revenue mix, and the reported ARR/customer figures are not audited in the retained evidence."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Public pricing and monetization signals
    columns: [product or signal, public price/status, billing unit, qualification, implication]
    rows:
      - [Residential proxy, "$30/month for 5GB ($6/GB)", "GB", "Competitor comparison; public list price can change", "Usage and bandwidth drive revenue and cost"]
      - [Mobile proxy, "$30/month for 4GB ($7.50/GB)", "GB", "Competitor comparison; not realized customer price", "Mix and utilization determine gross profit"]
      - [Web Scraper API, "From $49/month", "Successful result plus traffic", "Competitor review; not an official quote", "Managed service can monetize engineering convenience"]
      - [Datacenter proxy, "Around $1.20/IP for a cited plan", "IP allocation", "Competitor review; plan and date limitations apply", "Fixed-IP products have different economics from bandwidth products"]
    notes: "Prices are external list-price observations, not audited revenue. Taxes, discounts, enterprise contracts, usage, retries and product-specific billing rules may change realized economics."
    claimRefs: [CI005, CI006, CI007, CI008]
  - id: TI003
    title: Unit-economics evidence and diligence status
    columns: [metric, value/null, confidence, why it matters, diligence ask]
    rows:
      - [ARR, "> $350M", "medium", "Indicates reported commercial scale", "Audited ARR bridge and recurring-revenue definition"]
      - [Customer count, "> 350,000", "medium", "Signals broad distribution but not account quality", "Active paying customers, cohort and concentration schedule"]
      - [Gross margin, null, "low", "Determines whether infrastructure growth converts to cash generation", "Product-level COGS and contribution margin"]
      - [CAC/payback, null, "low", "Tests whether growth is efficient and repeatable", "Sales spend, cohort bookings, churn and payback"]
      - [Cash on hand and runway, null, "low", "Determines financing dependency after the raise", "Cash-flow statement, burn, debt and use-of-proceeds schedule"]
    notes: "Null values are unavailable in the assigned public sources and are not estimates; each null has a specific diligence request."
    claimRefs: [CI002, CI003, CI015, CI016]

figures:
  - id: FI001
    title: Publicly evidenced revenue-to-capital bridge
    type: flow
    summary: "A source-backed operating model from customer activity through monetized web-data services to reported recurring revenue and new capital."
    data:
      nodes:
        - {id: customers, label: "350,000+ reported customers", detail: "Company-reported customer count; definition not disclosed"}
        - {id: activity, label: "Web-data activity", detail: "Proxy, API, browser and structured-data usage"}
        - {id: monetization, label: "Multiple billing meters", detail: "GB, IP, result, traffic, credits and datasets"}
        - {id: arr, label: "> $350M reported ARR", detail: "Third-party reported company claim; not audited"}
        - {id: financing, label: "$130M Warburg investment", detail: "Announced July 2026; approximately $3.6B valuation"}
        - {id: gaps, label: "Unresolved cash-flow bridge", detail: "Gross margin, burn, cash, debt and terms unavailable"}
    claimRefs: [CI001, CI002, CI005, CI010, CI015]

callouts:
  - calloutType: strength
    title: Reported scale with multiple monetization layers
    body: "Oxylabs has reported more than $350 million of ARR and more than 350,000 customers while broadening from proxy access into managed web-data products."
    claimRefs: [CI002, CI003, CI004]
  - calloutType: risk
    title: Financial disclosure is insufficient for full underwriting
    body: "No retained source discloses audited revenue recognition, gross margin, cash, burn, runway, customer concentration, or Warburg's transaction terms."
    claimRefs: [CI012, CI013, CI015, CI016]
  - calloutType: recommendation
    title: Track pending primary financial disclosure
    body: "The financing validates investor interest, but the missing margin, cash-flow and capitalization data warrants a track/research-more stance rather than a fully underwritten buy."
    claimRefs: [CI010, CI012, CI015, CI016]

