companyProfile:
  summary: >-
    GigaAI is a privately held Beijing embodied-AI company founded in 2023 by
    Huang Guan. It positions itself as a full-stack physical-AGI platform that
    combines world-generation and world-action models (GigaWorld, GigaBrain,
    DriveDreamer), data-collection hardware, and self-developed robots for both
    industrial and household use. Public reporting shows a rare financing surge:
    a March 2026 Pre-B round of roughly CNY1B, an April 2026 B1 round of nearly
    CNY1.5B, and a June 2026 B2 round of CNY1B, pushing valuation above CNY10B
    and making the company one of China’s newest embodied-AI unicorns. The
    public file is much thinner on operating economics than on technical and
    fundraising milestones, so the company should still be treated as a
    high-potential but high-opacity private issuer.
  foundedDate: "2023-06-01"
