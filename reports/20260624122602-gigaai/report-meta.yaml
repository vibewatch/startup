summary:
  headline: >-
    GigaAI is a technically ambitious Beijing physical-AGI company with strong
    2026 capital access and credible early deployment signals, but public
    evidence still does not support underwriting its unicorn valuation with the
    same confidence one would apply to a more disclosed robotics peer.
