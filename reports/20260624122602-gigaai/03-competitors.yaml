company:
  name: GigaAI
chapter:
  number: 3
  title: Competitors
  summary: GigaAI competes in a crowded embodied-AI field where Unitree already publishes a US$13.5K humanoid list price,
    EngineAI is racing toward 10,000-unit manufacturing, AgiBot is building a dataset-and-developer moat, Figure is pairing
    home-focused hardware with a 12,000-unit BotQ line, and Physical Intelligence is attacking the stack as a robot-agnostic
    model layer. GigaAI has meaningful momentum from its CNY3.5 billion 2026 fundraising and named home and factory pilots,
    but its moat still looks less durable than peers with stronger price transparency, richer developer ecosystems, broader
    channels, or deeper manufacturing scale. Adverse sector evidence from Berkeley, MIT Technology Review, and KrASIA also
    suggests commercialization may stay slower and more fragile than current fundraising narratives imply.
sections:
- id: landscape-overview
  title: 'Landscape: direct peers, incumbents, and substitute paths'
  body: 'GigaAI sits in the embodied-AI market, but it is not competing only against other Chinese humanoid startups. Its
    public product line spans a wheeled industrial robot (Maker H01) and a wheeled household robot (SeeLight S1), so buyers
    can compare it not only with direct Chinese peers such as EngineAI, AgiBot, and Unitree, but also with Western general-purpose
    programs like Figure and Physical Intelligence, plus traditional industrial automation vendors such as FANUC, KUKA, and
    ABB. That distinction matters because GigaAI is asking buyers to adopt a new robot form factor before the industry has
    converged on whether homes, factories, or model-layer software will create the largest near-term value pool. Direct peers
    are strongest where GigaAI is weakest in public materials: Unitree already has a public storefront and global research
    distribution signal, EngineAI has louder manufacturing-scale claims and a Luxshare-backed supply chain story, and AgiBot
    exposes more public dataset and developer-surface evidence. The substitute set is also unusually strong. FANUC, KUKA,
    and ABB already serve material handling, welding, assembly, palletizing, and inspection with broad product catalogs and
    established support models. For many industrial tasks, the practical alternative to GigaAI is not another humanoid at
    all, but lower-risk fixed or collaborative automation that procurement teams already know how to deploy and maintain.'
