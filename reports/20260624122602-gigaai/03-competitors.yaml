    topic: realized-pricing
    missingEvidence: Realized enterprise pricing, service attach rates, and warranty terms for GigaAI, EngineAI, AgiBot, and
      Figure are not public in the fetched source set.
    whyItMatters: Without realized pricing, it is hard to test whether GigaAI is truly cost-competitive or merely marketing-equivalent
      to peers.
