- id: peer-profiles
  title: 'Direct peer profiles: capability, package, and pricing posture'
  body: 'GigaAI public evidence supports a two-lane strategy: SeeLight S1 for domestic service and Maker H01 for industrial
    handling, with both products leaning on wheeled mobility rather than fully legged locomotion. That makes the company more
    concrete than pure research players, but it also means the comparison set is heterogeneous. EngineAI is pushing an industrialization
    narrative around T800 mass delivery, 79 inspection checkpoints, and a 10,000-unit capability claim; AgiBot is pairing
    commercial-mass-production messaging with AGIBOT World and active public repositories; Unitree is the clearest price disruptor
    because its official G1 page openly lists a US$13.5K price and hardware configuration; Figure is packaging Figure 03 around
    Helix, home use, and BotQ manufacturing scale; and Physical Intelligence is not primarily selling a robot unit at all,
    but a model layer intended to control any robot. Pricing is therefore only partially comparable. Unitree is the only direct
    peer in this source set with a clean published list price. GigaAI, EngineAI, AgiBot, Figure, and Physical Intelligence
    all present stronger product or platform narratives than realized commercial pricing disclosures. That matters because
    in an immature market, public price transparency is itself a competitive weapon: it lowers purchase friction, expands
    developer reach, and gives the vendor a clearer cost-down story.'
