- id: distribution-and-switching-costs
  title: Distribution, supply power, and switching costs
  body: 'The most durable near-term competitive advantages in embodied AI are not raw dexterity specs; they are channel access,
    component leverage, and installed-base learning. GigaAI does have early distribution proof: Yicai reports roughly 100
    SeeLight S1 orders, a factory deployment with FAW Tooling Die Technology, and a three-year 1,000-unit Maker agreement
    with Longsheng Technology. But this still looks concentrated rather than broad. Unitree couples public retail-style pricing
    with a global research-distribution signal through Nvidia’s researcher system selection. EngineAI has stronger public
    evidence of manufacturing and supply-chain depth through Luxshare and a dedicated Shenzhen base. AgiBot’s GitHub and dataset
    footprint create another form of distribution by making its tooling legible to developers and researchers. Figure is building
    channel power differently through vertical integration, BMW proof points, and its BotQ line. Against that backdrop, GigaAI
    switching costs are likely real but still emerging. Once a robot is integrated into safety rules, workflow software, task-specific
    data collection, and staff training, replacing it becomes painful. Yet this market is still early enough that multi-homing
    remains feasible: many customers are probably comparing pilots rather than committing to a single long-term robot stack.
    That keeps first deployments strategically important but means no current player, including GigaAI, can assume durable
    lock-in from pilots alone.'
  claimRefs:
