- id: moat-durability-and-adverse-evidence
  title: Moat durability and adverse evidence
  body: 'GigaAI does have ingredients for a credible moat: fresh capital, named industrial customers, a household pilot narrative,
    and internally branded models such as GigaWorld and GigaBrain. But each moat vector has a visible counterweight. Capital
    is plentiful across the category, so fundraising alone is not durable. Public pilot wins matter, but EngineAI and Figure
    are also scaling manufacturing stories, while AgiBot and Physical Intelligence are investing in model and data flywheels
    that may travel across hardware generations faster than GigaAI’s product-specific advantages. The strongest adverse evidence
    is sector-wide. Berkeley researchers argue the dexterity data gap is so large that useful human-level manipulation should
    not be expected in the next two, five, or even ten years. MIT Technology Review reports that humanoids still lack common
    sense and that adoption will likely be slow and industry specific, while also highlighting questions around how much real
    production proof Figure’s BMW relationship represents. KrASIA adds the financing warning: investors themselves increasingly
    describe embodied AI as fuzzy, commercialization as low-gear, and valuations as vulnerable to bubble dynamics. For GigaAI,
    the implication is straightforward. The company may be well positioned for continued pilots, but its competitive durability
    still depends on converting capital and demos into repeatable field performance faster than better-priced, more open,
    or better-distributed rivals.'
