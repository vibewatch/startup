- id: trust-quality-compliance-and-roadmap
  title: Trust, quality, compliance, and roadmap posture
  body: 'Public quality signals currently come from open code, benchmark participation, and named deployment references rather than from the conventional enterprise trust stack. The repos are Apache 2.0 licensed, the GigaBrain challenge formalizes community evaluation tracks around GigaWorld and RoboChallenge, and the technical pages expose training, inference, and evaluation paths instead of only polished launch videos. That is useful evidence that the company wants outside usage and scrutiny. At the same time, the public official surface still does not disclose pricing, formal safety certification, support SLA, or a dedicated trust portal, which limits how much diligence a buyer can do on production-readiness from public materials alone. [CE017] [CE023] [CE037] [CE038] [CE039]


    The roadmap is aggressive. Public June 2026 materials point to Q3 milestones for scaled SeeLight S1 operations, a SeeLight S2 release, and GigaBrain-1, followed by GigaBrain-2 and GigaBrain-3 inside a 12-month physical-AGI roadmap. That roadmap is strategically coherent with the Dual Pyramid story: more home and factory deployment creates more data, more data feeds the world-model and action-model loop, and the next generation of robots is supposed to become more usable rather than just more impressive on stage. But until GigaAI publishes clearer safety, reliability, and benchmark-link evidence, the roadmap should be read as ambitious but not yet fully de-risked. [CE011] [CE032] [CE033] [CE034] [CE035] [CE040]'
