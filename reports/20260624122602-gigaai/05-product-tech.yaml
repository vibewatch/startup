  rows:
  - - Maker H01
    - Industrial, service, and open-scene operators
    - Early commercial delivery / pilot rollout
    - Native body linked directly to GigaBrain and GigaWorld loops
    - No public MTBF, fleet uptime, or service-network disclosure
  - - GigaBrain-0 / 0.5M*
    - Robot developers and robot operators
    - Public technical release with benchmark claims
    - World-model-conditioned VLA path with structured task and motion planning
    - Most public proof is benchmark and demo heavy, not SLA heavy
  - - GigaWorld-0 / GigaWorld-Policy
    - Embodied AI developers
    - Open-source framework plus newer policy layer
    - Data amplification plus closed-loop simulation and RL training
    - Direct public benchmark links for all marketing claims are incomplete
  - - SeeLight S1 / S2
    - Households and residential operators
    - S1 ordered; S2 announced for Q3 2026
    - Consumer-facing brand tied to the same foundation-model stack
    - Safety certification, pricing, and maintenance model are undisclosed
  - - Maker M01 / U-01 / E-01
    - Data-collection operators
    - Announced as part of data pyramid
    - Dedicated hardware for true-robot, handheld, and egocentric capture
    - Exact throughput, BOM, and deployment volume are not public
  - - DriveDreamer family
    - AV OEMs and autonomy teams
    - Research-to-commercial branch with named customer activity
    - World-model data generation, reconstruction, and closed-loop simulation in driving
    - Public customer ledger and benchmark backlinks remain partial
  notes: Rows separate embodied products, data hardware, and AV world-model products so the reader can see where GigaAI is selling bodies, policies, data engines, or adjacent infrastructure.
