- id: deployment-integration-and-reliability
  title: Deployment, integration, and reliability evidence
  body: 'The strongest public deployment proof is not a consumer app metric but a chain of field rollouts. Gasgoo reports initial Maker H01 deliveries into the Hubei Humanoid Robot Innovation Center, while June 2026 reporting says the GigaWorld + GigaBrain + Maker H01 trio entered FAW Tooling Die for real industrial workflows and that a 1,000-unit three-year rollout with Longsheng Technology is planned. On the household side, SeeLight S1 is tied to a 100-home order book with Q3 2026 scaled operations. These disclosures indicate that GigaAI is treating deployment as an input to the model loop, not only as a revenue endpoint. [CE029] [CE030] [CE031] [CE032] [CE033] [CE034]


    Integration proof is also better than for many hardware-first robot startups because the public repos show explicit interfaces. GigaBrain includes inference server and client paths; GigaTrain handles distributed training and checkpointing; GigaDatasets packages and evaluates multimodal robot data; and GigaModels spans training, inference, deployment, and compression. The open-source surface makes the stack more legible, but reliability evidence is still more pilot- and benchmark-heavy than operations-heavy: public materials do not yet disclose uptime, MTBF, field failure rate, or customer support SLA. [CE017] [CE018] [CE019] [CE020] [CE021] [CE037] [CE039]'
