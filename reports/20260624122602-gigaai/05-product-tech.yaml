  evidenceGaps:
  - type: missing-source
    severity: material
    topic: robot-safety-certifications
    missingEvidence: Published safety certification set, operating constraints, and test methodology for SeeLight and Maker deployments.
    whyItMatters: Home and factory robots face materially different risk environments, and public evidence is not yet strong enough to underwrite safety posture from launch copy alone.
    diligencePath: Request formal certification documents, safety-case writeups, and field-incident escalation procedures from the company.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: support-and-sla
    missingEvidence: Customer-facing SLA, maintenance response commitments, warranty terms, and post-sale support model.
    whyItMatters: Operational reliability and serviceability will determine whether pilots can convert into scaled factory and household programs.
    diligencePath: Request enterprise support terms, service network coverage, and spare-parts / replacement workflows.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE004
  - type: conflicting-data
    severity: minor
    topic: drive-customer-count
    missingEvidence: Reconciled customer-count ledger for DriveDreamer showing signed, active, and production customers by date.
    whyItMatters: Official copy says 20+ signed customers while June media says 30+ served; the gap is probably temporal, but it is still unresolved publicly.
    diligencePath: Ask for a dated customer-count bridge and anonymized customer-stage breakdown.
    relatedQuestionRefs:
    - QE026
  - type: missing-source
    severity: material
    topic: benchmark-backlinks
    missingEvidence: Direct public benchmark pages or result ledgers for WorldArena, RoboCasa365, and other cited scoreboard claims.
    whyItMatters: Benchmark leadership is core to the company’s differentiation story, so missing backlinks reduce auditability of headline claims.
    diligencePath: Request canonical public result URLs and versioned result snapshots for every benchmark cited in marketing and media.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE004
    - TE005
  - type: private-evidence-only
    severity: material
    topic: pricing-and-unit-economics
    missingEvidence: Public pricing, deployment economics, and service cost model for Maker, SeeLight, and foundation-model services.
    whyItMatters: Without commercial terms, it is difficult to judge whether the data flywheel can scale economically outside subsidized pilots.
