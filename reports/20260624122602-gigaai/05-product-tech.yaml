- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Key dependency
  - Primary risk
  rows:
  - - Five-layer data pyramid
    - Supplies weak-to-strong supervision from web video through real robots
    - Cheap collection hardware plus simulation stack
    - Coverage and accuracy are difficult to scale simultaneously
  - - GigaWorld-0 / GigaWorld-Policy
    - Generates embodied interaction data and world-action priors
    - High-fidelity simulation and world-model training infra
    - Benchmark proofs and external reproductions are still early
  - - GigaBrain / RAMP
    - Turns multimodal context and future-state/value predictions into robot actions
    - Stable data formatting, future prediction quality, human-in-the-loop rollouts
    - Policy quality depends on the predictive value of the world model
  - - GigaTrain / GigaDatasets / GigaModels
    - Provides distributed training, curation, packaging, and deployable model libraries
    - Open-source maintenance and hardware availability
    - Open repos show capability, not guaranteed production support
  - - Maker / SeeLight bodies
    - Embodies the policy in factories and homes while feeding back new data
    - Mechanical reliability, batteries, arms, and perception integration
    - Body reliability can bottleneck model wins in real environments
  - - DriveDreamer branch
    - Extends world-model economics into driving simulation and data generation
    - Access to customer data, sensors, and evaluation loops
    - Customer-count disclosure and benchmark backlinks are uneven
  notes: 'Architecture rows are grouped by where value is created: data, world model, policy, infra, body, and adjacent driving business.'
