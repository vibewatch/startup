- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - GigaAI solution
  - Measurable benefit
  - Limitation
  rows:
  - - Run repeated factory handling tasks
    - Hard-code automation and re-tune each station
    - Maker H01 + GigaBrain + GigaWorld in factory workflows
    - FAW case says adaptation moved from months to weeks
    - No public long-run failure-rate data by task class
  - - Launch a home-assistance robot service
    - Recruit staff or rely on narrow single-purpose devices
    - SeeLight S1 / planned S2 household platform
    - 100-home order book and Q3 2026 scale target are public
    - No public household retention, incident, or servicing data
  - - Collect high-fidelity embodied training data
    - Use small expensive robot fleets only
    - Maker M01 plus S1, U-01, and E-01 across data layers
    - Broader supervision mix than robot-only collection
    - Exact capture cost and volume per device are undisclosed
  - - Train a generalist robot policy
    - Fine-tune on limited real-robot demonstrations
    - GigaWorld data engine + GigaBrain policy stack
    - 10,931-hour disclosed pretraining mix with synthetic coverage
    - Synthetic-to-real contribution outside company benchmarks remains hard to audit
  - - Generate and test AV edge cases
    - Wait for rare road events or pay for expensive simulation loops
    - DriveDreamer / DriveDreamer4D / UniDriveDreamer
    - Claims lower corner-case collection burden and lower test cost
    - Customer scale and benchmark links are not fully reconciled publicly
  notes: This table translates the company’s model-and-robot vocabulary into buyer jobs so the distinction between data infrastructure, embodied execution, and AV simulation is explicit.
