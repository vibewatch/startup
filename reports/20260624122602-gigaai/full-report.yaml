      - number: '7.5'
        title: Mitigations, monitoring, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The encouraging part of the risk picture is that most of the top risks are monitorable. Export-control
              pressure can be tracked through disclosed hardware choices, procurement flexibility, and whether the
              company demonstrates progress on smaller-device deployment rather than only frontier-scale training.
              Regulatory risk can be monitored through public filing numbers, safety assessments, privacy documentation,
              and whether household offerings ship with clear warnings, terms, and incident pathways. Product risk
              should be judged by hard field evidence: repeat customers, lower scene-adaptation time without offsetting
              safety events, disclosed reliability targets, and evidence that home robots survive real usage rather than
              carefully managed showcases. Capital risk should be monitored through customer breadth, service gross
              margins, and whether new financing is still needed mainly to subsidize data collection and compute.
              Finally, people risk should be monitored through bench depth and visible operating maturity: stronger
              compliance, QA, field-service, and enterprise-support leadership would reduce the sense that too much
              trust is concentrated in a founder and a small research core. If those signals do not improve within the
              next product cycle, the investment thesis should move from “track” toward a clear kill decision rather
              than be carried by world-model hype alone.
