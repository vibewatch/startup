              delivered. Fourth, the household path moved from demos into a 100-unit launch narrative. But that is where
              the adoption trail becomes less clean: some outlets describe orders, some describe employee-housing or
              talent-apartment tests, and China Daily describes a free-trial launch into ordinary households. Finally,
              the DriveDreamer side has at least one direct public customer proof point through ECARX, but the broader
              30-plus customer count remains a non-itemized claim. Net result: the company is clearly moving from
