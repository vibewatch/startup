      - number: '6.3'
        title: Retention, satisfaction, and service visibility are still the weakest parts of the public record
        blocks:
          - type: paragraph
            body: >-
              GigaAI now has more visible deployment proof than many physical-AI startups, but the public record still
              trails badly on durability metrics. No reviewed source discloses NRR, GRR, churn, renewal rates, contract
              duration, or any cohort view for either industrial accounts or home users. That means the chapter can
              verify launch motion and named sites, but not whether accounts are renewing, expanding, or generating
              recurring margin after installation. The home pilot sources are especially revealing on this point. China
              Daily frames the first 100 household units as a free trial, with data collection and fault identification
              built into the process. eWeek’s field-reporting adds concrete quality gaps: some chores remain slow,
              awkward, or messy, which is useful because it shows the robots are being tested in reality rather than
              only in polished demos. China Daily’s 2,000-plus WeChat messages indicate interest, but interest is not
              equivalent to conversion. The most honest reading is that satisfaction proof is currently anecdotal and
              operational rather than contractual. Until GigaAI publishes renewal, service, and maintenance metrics,
              retention should be treated as a diligence question, not an inferred strength.
