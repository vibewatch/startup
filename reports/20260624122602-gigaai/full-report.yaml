        title: Milestones, public metrics, and risk signals
        blocks:
          - type: paragraph
            body: >-
              The milestone arc is stronger on technical and deployment narrative than on audited operating data.
              Research repos and papers show the company moving from DriveDreamer in autonomous-driving world models to
              GigaWorld-0 as an embodied-data engine, then onward to GigaBrain and physical robot products. By early
              2026, GigaAI was claiming large-scale Maker H01 deliveries, a first shipment to the Hubei Humanoid Robot
