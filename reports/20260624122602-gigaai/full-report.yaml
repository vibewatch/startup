      - number: '7.3'
        title: Safety, liability, and technical generalization risk
        blocks:
          - type: paragraph
            body: >-
              GigaAI’s hardest product risk is that the company is trying to compress three difficult problems into one
              commercialization cycle: safe embodied hardware, world-model-driven generalization, and economically
              supportable field operations. The company’s own papers and repositories are candid that real-world robot
              data is expensive and time-consuming to collect, that world-model-generated data is supposed to reduce
              that bottleneck, and that the stack depends on multiple internal frameworks plus significant compute. That
              is a coherent technical strategy, but it is not equivalent to proof that long-horizon sim-to-real transfer
              is solved. External sources are more skeptical: MIT Technology Review highlights that humanoids still lack
              common sense and face slow, industry-specific adoption, while IEEE Spectrum argues that the market is
              mostly hypothetical, that AI is not yet robust enough for market requirements, and that industrial buyers
              care about battery life, safety, and reliability at something closer to 99.99% than flashy demo quality.
              If GigaAI’s SeeLight and Maker programs move into homes and factories before failure-rate, service, and
              incident controls are mature, Chinese product-quality law creates real exposure: products that may
              endanger people or property must meet safety standards, carry warnings, and can trigger producer liability
              when defects cause injury or damage.
