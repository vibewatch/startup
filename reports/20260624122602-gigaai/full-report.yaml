  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: How technical, legal, and financing shocks propagate into revenue timing, margins, and valuation confidence.
    data:
      nodes:
        - id: n1
          label: GigaAI scale thesis
          type: hub
        - id: n2
          label: Compute access
          type: infrastructure
          risk: Advanced GPU or acceleration constraints slow model iteration and deployment performance.
        - id: n3
          label: World-model generalization
          type: technology
          risk: Synthetic-data gains may not fully survive messy factory or home settings.
        - id: n4
          label: Safety / liability
          type: regulatory
          risk: Defects or poor warnings can create direct legal and adoption consequences.
        - id: n5
          label: Compliance burden
          type: regulatory
          risk: Filing, data-governance, and labeling duties can delay household or public deployments.
        - id: n6
          label: Field reliability
          type: operations
          risk: Downtime and service cost determine whether pilots become repeatable production accounts.
        - id: n7
          label: Customer adoption
          type: commercial
          risk: Slow conversions keep customer concentration high and elongate payback.
        - id: n8
          label: Gross margin
          type: financial
          risk: Service-heavy support and compute spending can suppress margin quality.
        - id: n9
          label: Financing need
          type: financial
          risk: If margin and adoption lag, the company remains dependent on fresh external capital.
        - id: n10
          label: Valuation confidence
          type: financial
          risk: Public valuation can outrun evidence if risks compound faster than operating proof.
      edges:
        - from: n1
          to: n2
