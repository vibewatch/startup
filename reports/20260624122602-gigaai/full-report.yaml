      - number: '8.4'
        title: Bull, base, and bear cases
        blocks:
          - type: paragraph
            body: >-
              The right way to value GigaAI today is to ask what future disclosure would have to exist for the current
              mark to look cheap, fair, or clearly too high. In the bull case, GigaAI turns today’s fundraising burst
              into real deployment scale: industrial orders expand toward the 1,000-unit ambition, home pilots convert
              beyond the current reported 100-order signal, and a software or model layer attaches to hardware
              deployments at meaningful gross margin. Under that path, the company could justify a value comfortably
              above the current mark. The base case is more restrained: commercialization happens, but mainly as
              hardware-heavy pilots and early production revenue, so disclosed scale arrives slower and the company
              trades around or modestly below today’s round. The bear case is that the category remains hype-rich and
              revenue-poor longer than investors expect; in that world, the lack of disclosure combines with multiple
              compression and a preference-heavy next round to create real down-round risk. Because revenue is
              undisclosed, the scenario frame is more honest than a false single-point target.
