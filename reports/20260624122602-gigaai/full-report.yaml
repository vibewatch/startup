        title: Public traction versus revenue visibility
        blocks:
          - type: paragraph
            body: >-
              Public traction exists, but it is mostly operational rather than financial. Yicai, QQ, and related Chinese
              coverage converge on three headline commercialization signals: roughly 100 SeeLight S1 orders before mass
              household delivery, a three-year framework to deploy 1,000 Maker-series robots with Longsheng Technology,
              and industrial deployment with FAW Tooling Die using the GigaWorld-GigaBrain-Maker stack for tasks such as
              depalletizing and cross-area transport. Earlier Gasgoo reporting also shows the first Maker H01 shipment
              reaching the Hubei Humanoid Robot Innovation Center and frames 2026 as a push from model narrative into
              scenario landing and delivery. On the software side, QQ and NCSTI describe DriveDreamer as a signed
              infrastructure business serving more than 30 domestic and overseas automaker or autonomy customers, which
              is important because it implies the driving simulator branch is not just a paper asset. But none of those
              traction signals close the accounting loop. Public sources do not disclose recognized revenue, deferred
              revenue, gross profit, customer concentration, or how much of the 1,000-unit framework is binding purchase
              order versus staged intention. They also do not explain whether home orders are paid in full, partially
              reserved, subsidized, or free pilot placements. So the company has more commercialization proof than a
              pure demo startup, yet still far less than a financially underwritable growth company.
