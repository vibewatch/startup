      - number: '5.2'
        title: Dual Pyramid architecture and the world-model stack
        blocks:
          - type: paragraph
            body: >-
              The key product-tech thesis is the Dual Pyramid system: one pyramid for data acquisition and one for
              algorithmic learning. The data pyramid moves from broad but weakly supervised internet video up through
              human demonstrations, world-model simulators, synthetic simulation, and finally high-fidelity real-robot
              data. The algorithm pyramid then moves from world simulation to action alignment and finally experience
              reinforcement. This framing matters because GigaAI is claiming that embodied scaling will not come from a
              single-model trick; it will come from controlling both the data ladder and the learning ladder. [CE008]
              [CE009] [CE010] [CE011]


              Inside that architecture, GigaWorld is the data engine and GigaBrain is the action policy. Official
              materials and the open repo describe GigaWorld-0 as an open framework that generates high-generalization
              embodied interaction data and provides closed-loop simulation and RL training support. GigaBrain then
              consumes multimodal inputs—including images, point clouds, text, and embodiment state—and emits structured
              task and motion plans. The more advanced GigaBrain-0.5M* layer adds RAMP, which conditions the policy on
              future-state and value predictions from a world model. The stack is therefore not just “robot plus model”;
              it is a feedback architecture where world-model outputs become both training data and action context.
              [CE005] [CE006] [CE007] [CE013] [CE014] [CE016] [CE022]
