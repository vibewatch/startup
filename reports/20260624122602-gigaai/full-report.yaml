      - number: '2.2'
        title: 'Sizing lenses: real automation substrate vs speculative humanoid upside'
        blocks:
          - type: paragraph
            body: >-
              Public sizing lenses diverge because they measure different things. IFR data shows the automation
              substrate is already large and concrete: robot density reached a global record in 2023, China already
              controls most new industrial installations, and the installed base in Chinese manufacturing is counted in
              millions of units. That is the foundation layer into which GigaAI-like capabilities can sell. By contrast,
              broad embodied AI analyst reports such as TBRC describe a single-digit-billion market in 2025-2026, while
              narrower humanoid reports from MarketsandMarkets project faster growth from a smaller base. Bank research
              then stretches the horizon further: Goldman’s conservative scenario is still only single-digit billions
              over the next decade, while Morgan Stanley and BofA model enormous long-range shipment or revenue outcomes
              if the category reaches mass adoption. These figures should not be averaged into one neat TAM. Instead,
              they imply a ladder: a current automation-installed base, a nearer embodied-AI software and system layer,
              then a much more speculative general humanoid opportunity. For diligence, the market number that matters
              most for GigaAI is the serviceable slice where robotics OEMs, integrators, and operators are already
              paying to reduce setup time, improve perception, or increase task generalization. Public sources do not
              yet isolate that layer cleanly, so SAM and SOM remain evidence-constrained rather than model-precise.
