      - number: '1.3'
        title: Funding history, valuation, and capital formation
        blocks:
          - type: paragraph
            body: >-
              GigaAI’s funding story is the defining reason it matters in later chapters. Public reporting shows a clear
              staircase from a seed round into angel financing in 2024, Pre-A and Pre-A+ rounds in 2025, an A1 round
              backed by Huawei Hubble and Huakong Fund, and a disclosed A2 round of RMB 200 million. The pace then
              accelerated sharply in 2026. Reviewed sources converge on a nearly RMB 1 billion Pre-B round in March, a
              nearly RMB 1.5 billion B1 round in April, and a RMB 1 billion B2 round in June. Yicai then summarized the
              three-month burst at RMB 3.5 billion, about USD 518 million, while multiple Chinese outlets said valuation
              had crossed RMB 10 billion; Crunchbase separately logged GigaAI as an April 2026 unicorn at roughly USD
              1.5 billion after a Series B. The capital base is therefore unquestionably large, but still not fully
              transparent. Some reports identify a long investor list for each round, yet one B1 participant remains
              described only as a “well-known tech giant,” and public sources do not disclose the exact board rights,
              ownership outcomes, or whether any material secondary component existed. The practical takeaway is that
              valuation and fundraising velocity are well supported, while cap-table mechanics remain a follow-up item
              rather than a solved fact.
