              Longsheng Technology to deploy 1,000 Maker-series robots. Household ambition also became more concrete:
              multiple sources said SeeLight S1 had about 100 orders with broader delivery or operation targeted for the
              third quarter of 2026. The problem is that public operating metrics still lag the storytelling. Reviewed
              materials provide no verified revenue, ARR, or headcount, and customer evidence is framed through
              deployments, orders, and model benchmarks rather than cash generation. The sharpest external skepticism
              found in this pass came from Tencent News commentary warning that valuation inflation, real-world
              generalization, and commercialization remain open questions across the world-model boom. No concrete
              lawsuit or penalty surfaced in reviewed source material, but the absence of public negative filings should
              not be mistaken for completed legal diligence.
