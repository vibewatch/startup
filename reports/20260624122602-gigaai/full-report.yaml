  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      GigaAI’s current customer path runs from ecosystem discovery into real-scene testing, then into scale claims that
      still need renewal proof.
    data:
      items:
        - id: stage-1
          label: Discovery / ecosystem entry
          actor: Government-backed lab, factory partner, or Tier-1 integrator
          description: >-
            Entry often begins through a regional robotics ecosystem, a partner lab, or a strategic software integration
            discussion rather than a self-serve product motion.
          channels:
            - Hubei center
            - TEDA / FAW lab
            - ECARX integration
        - id: stage-2
          label: Task-definition and scenario proof
          actor: Plant operations team or pilot household
          description: >-
            The buyer validates a narrow set of tasks such as box unloading, cross-area transport, domestic chores, or
            driving-world-model simulation.
          channels:
            - FAW tasks
            - home chores
            - DriveDreamer use cases
        - id: stage-3
          label: On-site adaptation and data capture
          actor: GigaAI technical team + partner site
          description: >-
            Deployment doubles as data collection, model iteration, and fault finding; the company explicitly says
            household trials will feed product upgrades.
          channels:
            - household data consent
            - data factory
            - scenario verification
        - id: stage-4
          label: Limited rollout / first delivery
          actor: Named proof holder
          description: >-
            Public evidence today sits here: first units shipped, named factory tasks, verified first batches, and one
            direct automotive software integration.
          channels:
            - Hubei first unit
            - Longsheng first batch
            - ECARX integration
        - id: stage-5
          label: Scale claim / renewal requirement
          actor: Account leadership + service organization
          description: >-
            The next step is multi-site scaling, after-sales support, and renewals—exactly where public metrics are
            still missing.
          channels:
            - 1,000-unit plan
            - 100-home narrative
            - after-sales model
    claimRefs:
