            body: >-
              The comparable set argues for humility more than conviction. On the premium side, Figure’s official
              financing path went from $2.6 billion in 2024 to $39 billion in 2025, while Physical Intelligence moved
              from $5.6 billion to reports of an $11 billion-plus next round. Those outcomes show what the market will
              sometimes pay for embodied-AI platform optionality. But neither comp rescues GigaAI’s price by itself:
              both are global narrative leaders, and Physical Intelligence at least discloses a software subscription
              logic. The more useful anchor is Unitree, because it provides both valuation and operating disclosure.
              Caixin reports a 12.7 billion yuan June 2025 valuation, a 42 billion yuan 2026 IPO target, 1.7 billion
              yuan 2025 revenue, and 280 million yuan profit. Public robotics comps make the same point in a different
              way. Symbotic’s market cap and filed revenue imply a high-single-digit annualized sales multiple, while
              Serve shows how tiny-revenue robotics names can print eye-catching multiples on very small bases. Against
              that set, GigaAI’s current mark is not absurd for the category, but it is under-evidenced relative to
