      - number: '8.3'
        title: Financing context, dilution overhang, and what the public file does not support
        blocks:
          - type: paragraph
            body: >-
              The financing context is clear even if the economics are not. Yicai and other reviewed outlets converge
              that GigaAI raised CNY3.5 billion over roughly three months in 2026, comprising a March Pre-B, April B1,
              and June B2/strategic round, with post-financing valuation above CNY10 billion. That scale of capital
              formation is real and materially improves GigaAI’s odds of surviving the costly training-plus-hardware
              race. It also creates a different diligence burden. At this stage, the right underwriting questions are no
              longer whether the company can raise money, but what that money bought in terms of ownership, liquidation
              preference seniority, secondary leakage, and runway extension. None of those terms are visible in the
              reviewed public file. The absence of disclosed revenue, backlog, and gross margin means investors cannot
              yet test whether the latest round reflects traction, scarce strategic optionality, or simply a hot capital
              market for embodied AI. In practice, scenario-based valuation dominates because conventional
              round-to-revenue multiple work cannot yet be grounded in disclosed operating data.
            claimRefs:
