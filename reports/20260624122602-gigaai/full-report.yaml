  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered products, brands, and user jobs
        blocks:
          - type: paragraph
            body: >-
              GigaAI is no longer just a research brand wrapped around a single robot demo. Its public product surface
              spans four anchor routes on the official site—Maker H01, GigaBrain, GigaWorld, and DriveDreamer—while June
              2026 launch coverage adds the household brand SeeLight with S1 and S2 as the family-facing branch of the
              same stack. That means the company is selling at least three different things at once: embodied foundation
              models, native robot bodies, and world-model tooling for adjacent verticals such as autonomous driving. In
              workflow terms, Maker H01 is the execution surface, GigaBrain is the decision layer, GigaWorld is the
              embodied data-and-simulation layer, and DriveDreamer is the driving-world-model branch. [CE001] [CE003]
              [CE004] [CE006] [CE028] [CE033] [CE034]


              The user jobs are similarly split. For industrial users, the disclosed tasks are box depalletizing,
              cross-zone transport, dynamic obstacle avoidance, and precise operations in real factories. For household
              users, the SeeLight line is framed around chores and longer-horizon home assistance. For AV customers,
              DriveDreamer is sold as infrastructure for data generation, corner-case handling, and closed-loop
              simulation. The broadest interpretation is that GigaAI is trying to own the stack from data capture to
              policy learning to physical execution, rather than monetizing only a robot SKU or only a model API.
              [CE010] [CE031] [CE033] [CE036] [CE041]
