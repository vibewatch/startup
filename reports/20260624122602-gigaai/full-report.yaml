  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: where GigaAI actually sells into'
        blocks:
          - type: paragraph
            body: >-
              For GigaAI, the relevant market boundary is not generic AI software and not all robotics hardware. The
              usable boundary starts with physical automation environments that already pay for sensing, manipulation,
              or workflow adaptation, then narrows to the software and systems layer that helps robots perceive, plan,
              and generalize in messy real-world tasks. Public evidence supports four buckets inside the boundary:
              industrial robotics upgrades in manufacturing, logistics and warehouse robotics, selected service
              workflows such as retail or pharmacy, and enabling world-model or simulation infrastructure sold to
              robotics OEMs and integrators. What stays outside the boundary is just as important. Broad office
              copilots, pure chat interfaces, fixed-function factory machinery with no learning loop, and consumer-home
              robotics dreams without validated budgets should not be counted as near-term demand for GigaAI. Multiple
              adverse sources stress that humanoid embodiment itself is not the market; many jobs are still better
              served by wheeled, fixed-base, or task-specific robots. That matters because GigaAI’s product logic
              appears closer to the infrastructure and deployment layer than to a mass-market household robot vendor. In
              practice, the market is governed by existing automation spend, integration pain, and operator willingness
              to pay for better generalization—not by the largest headline TAM in a bank note.
            claimRefs:
              - CM001
              - CM002
              - CM012
              - CM044
              - CM045
              - CM051
