  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments, buyer structure, and where proof is actually strongest
        blocks:
          - type: paragraph
            body: >-
              GigaAI’s public customer story is broader than a single humanoid-robot SKU, but the evidence is not evenly
              distributed across segments. The strongest supportable segments today are industrial manufacturing, home
              or eldercare pilots, and automotive simulation. Industrial proof is anchored by named factory deployments
              at FAW Tooling Die, the first-delivery relationship with the Hubei Humanoid Robot Innovation Center, and
              the three-year Longsheng program in Wuxi. Automotive evidence is narrower but real: ECARX has officially
              integrated DriveDreamer into AutoGPT, which gives GigaAI at least one direct Tier-1 style partner proof
              point for world-model adoption. Home and eldercare evidence is early but unusually visible, with a
              100-unit household launch narrative repeated across Chinese and English outlets. By contrast, 3C
              electronics and warehousing or logistics are best understood as claimed segment reach rather than named,
              independently itemized account proof. That distinction matters because it keeps GigaAI’s customer map
              credible without overstating public evidence. The buyer-user-payer split also differs by segment:
              factories and public institutions appear to sponsor deployments, operations teams are the users, and
