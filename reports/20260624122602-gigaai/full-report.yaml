      - number: '4.3'
        title: Unit economics and capital intensity
        blocks:
          - type: paragraph
            body: >-
              The most useful financial view is comparative rather than company-specific because GigaAI discloses almost
              none of the line items investors would normally use for robot unit economics. External anchors suggest the
              stack is capital intensive. Industrial robot guides in 2026 place arm-only pricing roughly in the
              USD25,000 to USD180,000 band, with fully deployed cells often reaching USD80,000 to USD400,000 once
              tooling, integration, and safety are included, and multi-year total cost of ownership reaching well above
              sticker price. Standard Bots’ ABB pricing guide points in the same direction: distributor quotes vary by
              model and region, and a fully equipped heavy-duty system can top USD120,000. For GigaAI specifically,
              Humanoid.guide’s USD160,000 Maker H01 anchor is useful only as a low-confidence external comparator, not
              as verified company pricing. Household economics look even less settled. RoboActu reports that SeeLight S1
              pilot households receive units for free and that the hardware price target is under RMB100,000 by
              mid-2027, which implies the home business may still be in a subsidized data-collection and
              product-learning phase rather than a mature margin phase. Comparable public robotics filings reinforce the
              caution. UBTECH’s 2025 results show strong humanoid growth and a 37.7% gross margin, yet the company still
              reported a substantial loss while scaling production. iRobot’s filing shows how consumer-robot businesses
              can run into inventory stress, promotional pressure, and going-concern risk when demand, price, and cost
              structure do not align. For GigaAI, the right conclusion is not that unit economics are bad; it is that
              they are still unproven and probably heterogeneous by product line.
