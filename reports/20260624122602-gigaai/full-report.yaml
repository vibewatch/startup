      - number: '8.2'
        title: Recommendation, confidence, and entry discipline
        blocks:
          - type: paragraph
            body: >-
              We rate GigaAI research-more with medium confidence, a high risk rating, and a stretched valuation stance.
              That is not a bearish call on the company’s technical ambition; it is a price-sensitive call on what is
              publicly knowable today. The current valuation anchor, above CNY10 billion or about $1.5 billion, is
              plausible only if GigaAI can convert its present funding momentum into disclosed revenue scale, acceptable
              hardware economics, and software attach that commands a premium multiple. The evidence needed to make that
              leap is still missing. Public reporting shows promising commercialization markers, including a reported
              roughly 100-order home robot book and a 1,000-unit annual delivery target, but those are still weaker
              anchors than reported revenue, recurring software spend, or audited margin disclosure. Entry discipline
              should therefore be explicit: do not pay current price on narrative alone; require dated revenue, gross
              margin, backlog quality, and preference-stack disclosure, or seek entry at a material discount to the
              current mark.
