      "id": "geopolitical-and-regulatory-risk",
      "title": "Geopolitical and regulatory risk",
      "body": "The most structural external risk is that GigaAI is scaling exactly where regulatory density is rising. On the U.S. side, BIS guidance now states that advanced computing exports can require licenses for China-headquartered entities even when the recipient sits outside China, and the 2025–2026 control posture broadened scrutiny over chips designed for the China market and over diversion through third countries. That matters because GigaAI’s public technical stack is explicitly framed around scalable training, multi-GPU execution, FP8 efficiency, world-model data engines, and deployment paths that even mention NVIDIA Jetson. On the China side, the burden is no longer limited to generic AI rhetoric. China has published a national standard system for humanoid robotics and embodied AI, while CAC rules already impose obligations around lawful training data handling, IP respect, content marking, transparency, and filing or security-assessment duties for algorithmic services with public-opinion or social-mobilization characteristics. For GigaAI, the practical issue is not that every rule certainly applies today; it is that household robots, multimodal data capture, and model-mediated outputs make the company likely to encounter several of them as products leave controlled demonstrations and enter more consumer-like or broad industrial contexts.",
