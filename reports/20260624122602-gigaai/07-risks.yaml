    {
      "id": "adoption-capital-and-dependency-risk",
      "title": "Adoption, capital, and dependency risk",
      "body": "Commercial risk comes less from a lack of narrative and more from the possibility that narrative outruns repeatable adoption. Public sources do show real deployment markers: Maker H01 deliveries to the Hubei Humanoid Robot Innovation Center, FAW Tooling factory use cases, a three-year 1,000-robot Longsheng plan, and roughly 100 SeeLight S1 orders ahead of targeted Q3 2026 scale-up. But those same disclosures leave key gaps unfilled. They do not publish field uptime, MTBF, incident rates, warranty economics, service staffing, or revenue conversion from pilots into recurring production accounts. That makes partner dependence important: a handful of named industrial relationships carry outsized signaling value, so slippage at any anchor customer or deployment partner could hit both perception and learning loops. Financing risk is similarly non-trivial. The company’s fundraising velocity is impressive, yet the disclosed use of proceeds shows that capital is still fueling model, data, and rollout expansion. In other words, the company does not yet look self-proving on public operating economics; it looks like a well-financed contender racing to prove them. In a more skeptical humanoid market, that distinction becomes critical.",
