    "number": 7,
    "title": "Risks",
    "summary": "GigaAI’s risk profile is dominated by three linked issues: compute and geopolitical dependency amid tighter U.S.-China chip controls, productization risk for world-model-driven humanoids that still face unresolved reliability and safety thresholds, and capital dependence because public evidence emphasizes fundraising, orders, and roadmap ambition more than disclosed operating economics. China’s regulatory environment is also getting denser rather than lighter, with embodied AI now intersecting humanoid standards, algorithm filing and security-assessment duties, product liability law, and labor-compliance rules that could bite once deployments move beyond controlled pilots."
  },
  "sections": [
    {
      "id": "ranked-risk-posture",
      "title": "Severity-ranked risk posture",
      "body": "GigaAI is unusually strong on ambition and capital access, but the public record still points to a high residual risk profile rather than a de-risked scaling story. The company now presents itself as a full-stack physical-AGI platform spanning world models, action models, data engines, and native robot bodies; public funding coverage says it raised CNY3.5 billion in three months and is targeting both industrial and household deployments. Those are real advantages, yet they intensify rather than reduce execution pressure. The same sources show that fresh capital is being directed into data systems, model refinement, and robot scaling, which means the business still depends on expensive iteration loops before durable unit economics are visible. External skeptics are also directionally consistent: humanoid demand remains largely hypothetical, AI robustness is not yet at market-grade reliability, and safety plus battery constraints remain gating issues. In practice, the top risks cluster into five buckets: export-control and compute risk, China regulatory and filing risk, product safety and defect liability, commercialization and capital dependence, and concentrated partner or key-person execution risk. The chapter therefore treats GigaAI as investable only if diligence can convert company-claimed scale signals into evidence on compliance, reliability, customer breadth, and capital efficiency.",
