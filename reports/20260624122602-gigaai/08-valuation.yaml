    {
      "id": "diligence-asks-and-thesis-breaks",
      "title": "Exit readiness, thesis-break triggers, and final diligence asks",
      "body": "Public evidence does not support treating GigaAI as exit-ready today. The company clearly has the fundraising momentum and category position to become a future IPO or strategic-acquisition candidate, but the disclosure file is still too thin for that path to be underwritten with confidence. The most important thesis-break is simple: if dated revenue, backlog, or gross-margin disclosure arrives and shows a business well below the scale required to defend a $1.5 billion-plus mark, the valuation case collapses quickly. Closely related triggers are a down-round with heavy senior preferences, evidence that order signals are mostly pilots rather than contracted demand, or proof that hardware utilization is improving slower than investors assumed. Final diligence should therefore focus on exact 2026 booked revenue, gross margin by hardware versus software or services, customer concentration, signed backlog and cancellation rights, burn and runway after the 2026 rounds, and the preference stack. Until those are answered, the prudent IC posture is to keep GigaAI in active coverage rather than convert narrative excitement into a price-insensitive commitment.",
