    "number": 8,
    "title": "Valuation",
    "summary": "GigaAI has assembled an unusually strong capital stack for a two-year-old embodied-AI company, but public valuation support is much weaker than the financing headlines. The 2026 Pre-B, B1, and B2 rounds total CNY3.5 billion and push valuation above CNY10 billion (about $1.5 billion), yet reviewed sources still do not disclose revenue, gross margin, backlog quality, or preference terms. Relative to peers, the current mark is easier to explain as scenario-driven option value than as evidence-backed multiple support, so the right call is research-more, medium confidence, high risk, and valuation stretched."
  },
  "sections": [
    {
      "id": "thesis-antithesis",
      "title": "Investment thesis and anti-thesis",
      "body": "The positive case for GigaAI is not hard to see. In one quarter the company raised a China-scale war chest across a CNY1 billion Pre-B, a nearly CNY1.5 billion B1, and a CNY1 billion B2/strategic round, while positioning itself as a full-stack physical-AGI player spanning world models, embodied models, industrial robots, and home robots. That combination matters because capital access is itself a moat in embodied AI: it funds hardware iteration, data collection, simulation, and manufacturing learning curves that weaker peers cannot afford. The anti-thesis is that the current price is being justified mainly by category momentum and optionality, not by disclosed economics. Reviewed public sources still do not publish GigaAI revenue, gross margin, customer concentration, backlog conversion, or round terms. In this sector, that omission matters. The best-supported premium peers either have official software-platform narratives with global investors behind them, such as Figure and Physical Intelligence, or they are moving toward much stronger financial disclosure, as Unitree has through the IPO path. GigaAI may become one of those winners, but public evidence today does not prove it already deserves the same underwriting treatment.",
