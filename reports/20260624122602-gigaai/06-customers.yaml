- id: expansion-loops-and-concentration-risks
  title: Expansion exists, but concentration and ecosystem dependence remain real risks
  body: 'The most plausible expansion loop is now visible in public materials: a pilot or first deployment generates data, the data improves GigaWorld or GigaBrain, the improved stack supports broader scenario coverage, and that richer proof helps the company win the next site or partner. Hubei and Wuhan are central to that loop because they combine a data factory, intelligent-manufacturing promotion, policy funding, and curated residential testbeds. Longsheng adds a second scale vector by combining manufacturing support with a multi-year deployment program in Wuxi. Those are strengths, but they also reveal concentration risk. A large share of named proof today sits inside a small number of government-linked or partner-led ecosystems, and no public source discloses how much revenue or installed base depends on those ecosystems. The Longsheng 1,000-unit plan is also a pipeline commitment, not realized installed base. Likewise, household traction still appears concentrated in premium or policy-backed
    housing environments before exposure to broad middle-income demand. So the commercial upside is credible, but the market is not yet diversified enough for investors to underwrite low concentration risk from public evidence alone.'
