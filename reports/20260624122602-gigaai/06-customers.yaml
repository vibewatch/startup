- id: named-proof-and-adoption-trajectory
  title: Named customer proof and the adoption trajectory from first delivery to scale claims
  body: 'The adoption trajectory is strongest when it is read as a ladder rather than a single headline. First, Gasgoo reports that GigaAI has already started Maker H01 deliveries and that the first unit went to the Hubei Humanoid Robot Innovation Center. Second, GigaAI’s industrial proof moved into named automotive manufacturing in April 2026, when FAW Tooling Die was disclosed as a live factory site for box unloading, cross-area transport, dynamic obstacle avoidance, and precise operations. Third, June 2026 added the Longsheng relationship, where the company and its Wuxi partner announced a three-year plan for 1,000 Maker-series robots and said a first batch had already cleared industrial-handling verification and been delivered. Fourth, the household path moved from demos into a 100-unit launch narrative. But that is where the adoption trail becomes less clean: some outlets describe orders, some describe employee-housing or talent-apartment tests, and China Daily describes a free-trial
    launch into ordinary households. Finally, the DriveDreamer side has at least one direct public customer proof point through ECARX, but the broader 30-plus customer count remains a non-itemized claim. Net result: the company is clearly moving from concept to field use, yet much of the public scaling language is still plan-heavy rather than revenue-heavy.'
