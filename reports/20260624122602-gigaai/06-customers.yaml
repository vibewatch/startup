  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: home-launch-terms
    missingEvidence: A reconciled ledger showing how many of the first 100 SeeLight units are paid orders, employee pilots, free household trials, or talent-apartment tests.
    whyItMatters: Headline adoption language is currently the fastest-moving customer proof in the chapter, but the commercial signal changes materially if the first 100 units are subsidized or internal pilots rather than paying end users.
    diligencePath: Request the signed orderbook, pricing terms, free-trial allocation, and install-site list for the first 100 home units.
    relatedQuestionRefs:
    - QU009
    - QU011
    relatedTableRefs:
    - TU002
    - TU003
  - type: missing-source
    severity: material
    topic: 3c-logistics-named-customers
    missingEvidence: Named customer references, deployment photos, procurement records, or partner case studies for 3C electronics and non-Longsheng logistics users.
    whyItMatters: GigaAI publicly claims reach into 3C electronics and warehousing or logistics, but public proof remains too generic to treat those segments as validated independent demand pools.
    diligencePath: Ask management for named logos, site references, scenario KPIs, and whether any segment contributes repeat revenue today.
    relatedQuestionRefs:
    - QU016
    - QU017
    relatedTableRefs:
    - TU001
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-visibility
    missingEvidence: NRR, GRR, renewal rate, contract duration, churn, repeat purchase, task-success trend, and service-call frequency by segment.
    whyItMatters: Without retention or repeat-usage metrics, public customer proof can confirm pilots and launches but not durability or product-market fit.
    diligencePath: Request cohort data for industrial accounts and household trial continuation, plus service and maintenance logs.
    relatedQuestionRefs:
    - QU018
    - QU024
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: concentration-data-gap
    missingEvidence: Revenue or installed-base concentration by top customer, partner, or regional ecosystem, including any dependency on Hubei/Wuhan or Longsheng-related programs.
    whyItMatters: The disclosed proof set is concentrated in a few named ecosystems; without concentration data it is hard to judge land-and-expand quality or single-account downside.
    diligencePath: Request top-5 customer exposure, contract term, expansion pipeline, and percent of revenue linked to state-backed pilots or a single partner.
    relatedQuestionRefs:
    - QU022
    - QU025
    - QU026
    relatedTableRefs:
    - TU005
