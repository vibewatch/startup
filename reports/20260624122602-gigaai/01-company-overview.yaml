  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "GigaAI is a Beijing-based physical-AGI startup founded in 2023 around world models, embodied foundation models, and self-developed robots for industrial and household use. Public financing coverage indicates a rapid rise from seed and angel funding into a three-round RMB 3.5 billion fundraising burst in March-June 2026 that pushed valuation above RMB 10 billion, but exact board control, lifetime capital raised, revenue, and headcount remain under-disclosed. The company also presents a real diligence wrinkle: the active operating site is gigaai.cc while the English-brand .com is a parked domain for sale."
  },
  "sections": [
    {
      "id": "identity-domain-and-business-model",
      "title": "Identity, domain control, and business model",
      "body": "The strongest basic identity picture is internally consistent on company name, geography, and product framing, but not on the English-language domain. The active site at gigaai.cc resolves to a minimal page titled “极佳科技,” while gigaai.com is a parked domain listed for sale rather than a live corporate surface. That does not undermine the operating company, but it is a real diligence flag for counterparties who would naturally test the .com first. Independent finance and industry coverage consistently identify the business as Beijing 极佳视界科技有限公司 / GigaAI, founded in 2023 and headquartered in Beijing. The operating thesis is broader than a single robot SKU: the company repeatedly describes a stack that combines world models, embodied foundation models, native robot bodies, and generalized scenarios. In practical commercial terms, that translates into two monetization paths still being proven in public: software or foundation-model services delivered through software, API, or licensing to partners, and hardware-plus-deployment programs built around the Maker industrial line and SeeLight household line. Public sources support the strategic framing, but they do not yet disclose durable revenue, ARR, or customer count metrics that would let investors separate narrative momentum from recurring commercial scale.",
