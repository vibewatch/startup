- id: buyers-and-budget-owners
  title: Buyer, user, and payer segmentation
  body: 'The clearest buyers are not households; they are enterprises and robotics companies with measurable labor, uptime, and changeover problems. In manufacturing, the user may be the production line, maintenance team, or plant engineer, but the payer is usually the factory automation, capex, or operations budget. In logistics, users are sortation, picking, and warehouse operators, while payers are 3PL, parcel, or retailer operations leaders who can compare robotics spend against labor turnover, throughput, and injury costs. In service settings such as retail or pharmacy, the user experience may be customer-facing, but adoption still depends on whether the operator can budget the robot against labor savings or service consistency. A separate segment matters even more for GigaAI: robotics OEMs and integrators who buy simulation, perception, or world-model infrastructure as an enabling layer for many deployments. Those buyers own the data pipeline, model retraining loop, and deployment
    tooling, which makes them more natural infrastructure customers than end users buying a single robot. China-specific reporting suggests logistics and convenience retail are among the earliest commercialization paths because these segments combine dense workflows, high-frequency tasks, and good data exhaust. Home humanoids remain much less bankable because willingness to pay, safety tolerance, and actual user preference are all less certain.'
  claimRefs:
  - CM035
  - CM042
  - CM045
  - CM046
  - CM049
