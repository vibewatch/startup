- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Labor shortages and aging workforces
    - Driver
    - Current to 2035+
    - Supports ROI for automation in manufacturing, logistics, and care
    - Quantify which GigaAI target sectors have measurable vacancy or overtime pain
  - - China 15th Five-Year Plan and strategic-emerging-industry support
    - Driver
    - Current to 2030
    - Creates policy sponsorship and procurement pull for robotics and embodied AI in China
    - Request direct evidence of programs, grants, or pilot zones relevant to GigaAI
  - - Installed automation substrate in China
    - Driver
    - Current
    - Large robot base and local supplier depth lower adoption friction for upgrades
    - Map which parts of the installed base can actually consume GigaAI products
  - - Simulation, world-model, and VLA progress
    - Driver
    - Current to medium term
    - Improves perception, planning, and retraining economics before full autonomy arrives
    - Request deployment evidence that these tools reduce integration time or error rates
  - - Setup and reengineering costs in robotics
    - Driver when reduced
    - Current
    - If software cuts setup costs, more variable workflows become automatable
    - Validate whether GigaAI reduces engineering hours, fixture cost, or changeover downtime
  - - Dexterity and sim-to-real bottlenecks
    - Constraint
    - Current to long term
    - Limits general-purpose manipulation and slows expansion beyond narrow workflows
    - Request task-level benchmarks in real environments, not only simulation or demos
  - - Reliability, safety, and standards burden
    - Constraint
    - Current
    - Industrial buyers require very high uptime and clear safe-failure behavior
    - Obtain uptime, MTBF, intervention rate, and safety-case evidence from production pilots
  - - Demand discovery and capex trust ramp
    - Constraint
    - Current to medium term
    - Few sites can yet justify thousands of humanoids; phased adoption is more realistic
    - Ask for pilot-to-production conversion, payback periods, and renewal / expansion rates
  notes: Drivers and constraints are tied to timing because GigaAI’s investable window depends more on deployment cadence and proof of ROI than on a single top-down TAM figure.
