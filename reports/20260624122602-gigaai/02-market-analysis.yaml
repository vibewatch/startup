  - - MarketsandMarkets
    - 2025-2030
    - South Korea
    - 'Humanoid market: $112.6M (2025) to $583.5M (2030)'
    - 39.0% CAGR
    - Humanoid-only country forecast
    - Medium
    - Illustrates Asia growth but still omits China public value detail
  - - Goldman Sachs (via CNBC)
    - 10-15 year base; 2035 blue sky
    - Global
    - ~$6B base case over 10-15 years; up to $154B by 2035 blue-sky
    - Not stated as CAGR
    - Humanoid market framed around manufacturing and elderly-care labor substitution
    - Low
    - Scenario spread is enormous and depends on costs, acceptance, and use-case breakthroughs
  - - Morgan Stanley (via CNBC)
    - 2030 / 2040 / 2050
    - Global
    - 'Humanoid population: 40k (2030), 8M (2040), 63M (2050)'
    - Not stated as CAGR
    - Installed-base population forecast tied to labor shortages and embodied AI progress
    - Low
    - Population forecast is not revenue and sits far above current deployments
  - - Morgan Stanley (via CNBC)
    - '2050'
    - Global
    - 'Humanoid revenue: $4.7T; ~1B units'
    - Long-dated scenario
    - Long-range revenue view for integrated humanoid value chain
    - Low
    - Very long duration forecast with aggressive adoption assumptions
  - - Bank of America Institute
    - 2025 / 2026 / 2030 / 2035 / 2060
    - Global
    - 'Shipments: 20k (2025), 90k (2026), 1.2M (2030), 10M (2035); installed base 3B by 2060'
    - 86% shipment CAGR to 2035
    - Humanoid shipment and installed-base model based on AI maturity, hardware cost declines, and demographics
    - Medium
    - Useful for curve shape, but still a model rather than audited demand
  notes: Rows intentionally mix broad embodied-AI, humanoid, shipment, and revenue lenses to preserve contradictory estimates rather than collapse them into one false-precision TAM.
