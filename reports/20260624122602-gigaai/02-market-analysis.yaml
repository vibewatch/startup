- id: drivers-constraints-and-adoption-timing
  title: Growth drivers, adoption constraints, and China-specific timing
  body: 'The strongest demand drivers are labor scarcity, policy support, and falling integration friction. IFR, WEF, and BofA all point to structural labor shortages, aging workforces, and reshoring pressure as reasons companies keep automating. China adds a different accelerant: national policy, a deep component base, high robot installation volumes, and rising local supplier share. On the technology side, the most credible near-term value is not magical autonomy but lower setup cost, better perception, more flexible manipulation, and faster iteration through simulation and data loops. BCG’s framework is useful here: Levels 2 and 3 create value now, while Level 5 reasoning and broad world models remain aspirational. That distinction is central to GigaAI’s market timing. The best near-term adoption cases are settings where existing fleets, warehouses, or factories can absorb better software before they buy thousands of general humanoids. The constraints are equally material. Adverse sources
    repeatedly highlight dexterity, the sim-to-real data gap, reliability, battery life, safety standards, and weak proof of large-site humanoid demand. Several sources also argue that flat factories often favor wheeled or task-specific systems over legged humanoids. So the adoption path is likely phased: industrial and logistics deployments first, broader service use later, and household humanoids last. For GigaAI, that means the investable market today is the upgrade cycle inside already-automating environments, especially in China and Asia-Pacific, rather than a universal robot-labor replacement story.'
