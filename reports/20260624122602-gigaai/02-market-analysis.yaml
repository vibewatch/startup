figures:
- id: FM001
  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: The usable market narrows from a massive installed automation base, to a single-digit-billion embodied-AI layer, to narrower humanoid budgets, and finally to much more speculative long-dated bull cases.
  approximationNotes: Values are source-backed but intentionally mix units and horizons to show narrowing relevance, not to imply arithmetic additivity.
  data:
    items:
    - label: Automation substrate
      value: China ~2.0M industrial robots; 54% of global annual installations
      detail: Existing installed base that can buy upgrades before buying general humanoids.
    - label: Broad embodied-AI layer
      value: $3.8B in 2026; $7.24B by 2030
      detail: TBRC definition includes robots, exoskeletons, autonomous systems, and smart appliances.
    - label: Near-term humanoid commercialization
      value: U.S. humanoid market $857.9M in 2025 to $4.601B by 2030
      detail: Useful as a narrower commercialization wedge, but geography-specific and not a full global SAM.
    - label: Long-dated upside scenario
      value: $6B to $154B by 2035; $4.7T by 2050 in bullish bank cases
      detail: Speculative scenarios show optionality, not today’s validated budget pool.
