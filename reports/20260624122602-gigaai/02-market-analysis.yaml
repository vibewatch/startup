chapter:
  number: 2
  title: Market Analysis
  summary: 'GigaAI sits in a real but uneven market: the installed base of industrial automation and logistics robotics is already large, while the generalized humanoid and world-model layer remains early, forecast-rich, and highly contradictory. The best evidence supports a near-term serviceable market in Chinese and global industrial, logistics, and robotics-platform budgets where simulation, perception, and changeover economics matter now, not in household humanoid fantasies.'
sections:
- id: market-boundary
  title: 'Market boundary: where GigaAI actually sells into'
  body: 'For GigaAI, the relevant market boundary is not generic AI software and not all robotics hardware. The usable boundary starts with physical automation environments that already pay for sensing, manipulation, or workflow adaptation, then narrows to the software and systems layer that helps robots perceive, plan, and generalize in messy real-world tasks. Public evidence supports four buckets inside the boundary: industrial robotics upgrades in manufacturing, logistics and warehouse robotics, selected service workflows such as retail or pharmacy, and enabling world-model or simulation infrastructure sold to robotics OEMs and integrators. What stays outside the boundary is just as important. Broad office copilots, pure chat interfaces, fixed-function factory machinery with no learning loop, and consumer-home robotics dreams without validated budgets should not be counted as near-term demand for GigaAI. Multiple adverse sources stress that humanoid embodiment itself is not the market;
    many jobs are still better served by wheeled, fixed-base, or task-specific robots. That matters because GigaAI’s product logic appears closer to the infrastructure and deployment layer than to a mass-market household robot vendor. In practice, the market is governed by existing automation spend, integration pain, and operator willingness to pay for better generalization—not by the largest headline TAM in a bank note.'
  claimRefs:
  - CM001
  - CM002
  - CM012
  - CM044
  - CM045
  - CM051
  tableRefs:
  - TM001
- id: sizing-lenses
  title: 'Sizing lenses: real automation substrate vs speculative humanoid upside'
  body: 'Public sizing lenses diverge because they measure different things. IFR data shows the automation substrate is already large and concrete: robot density reached a global record in 2023, China already controls most new industrial installations, and the installed base in Chinese manufacturing is counted in millions of units. That is the foundation layer into which GigaAI-like capabilities can sell. By contrast, broad embodied AI analyst reports such as TBRC describe a single-digit-billion market in 2025-2026, while narrower humanoid reports from MarketsandMarkets project faster growth from a smaller base. Bank research then stretches the horizon further: Goldman’s conservative scenario is still only single-digit billions over the next decade, while Morgan Stanley and BofA model enormous long-range shipment or revenue outcomes if the category reaches mass adoption. These figures should not be averaged into one neat TAM. Instead, they imply a ladder: a current automation-installed base,
    a nearer embodied-AI software and system layer, then a much more speculative general humanoid opportunity. For diligence, the market number that matters most for GigaAI is the serviceable slice where robotics OEMs, integrators, and operators are already paying to reduce setup time, improve perception, or increase task generalization. Public sources do not yet isolate that layer cleanly, so SAM and SOM remain evidence-constrained rather than model-precise.'
  claimRefs:
  - CM003
  - CM004
