  evidenceGaps:
  - type: missing-source
    severity: material
    topic: world-model-infrastructure-tam
    missingEvidence: A public source that isolates simulation / world-model / deployment-software revenue from broader embodied-AI or humanoid categories.
    whyItMatters: Without a standalone infrastructure denominator, public TAM can overstate or understate the layer GigaAI is most likely to monetize.
    diligencePath: Request third-party market work or management cohort data on software / tooling revenue by robotics customer type; cross-check with OEM procurement budgets.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: gigaai-som
    missingEvidence: GigaAI-specific target vertical mix, pricing model, pilot pipeline, and conversion assumptions needed for a bottom-up SOM.
    whyItMatters: Public market data is too coarse to convert broad robotics or humanoid estimates into a defendable obtainable market for this company.
    diligencePath: Obtain pipeline by vertical, ACV or project pricing, attach rates to OEM / integrator customers, and pilot-to-production conversion data under NDA.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: minor
    topic: china-budget-breakdown
    missingEvidence: A primary public breakdown of Chinese robotics policy spend between traditional industrial automation, humanoids, and embodied-AI software.
    whyItMatters: Policy is clearly supportive, but public sources do not quantify how much demand is earmarked for each robotics layer.
    diligencePath: Review municipal subsidy notices, procurement bulletins, and industry fund disclosures tied to robotics and embodied intelligence programs.
    relatedQuestionRefs:
    - QM006
    - QM018
  - type: conflicting-data
    severity: material
    topic: humanoid-forecast-divergence
    missingEvidence: Comparable methodology across bank and analyst forecasts for target year, revenue basis, installed base, and category boundary.
    whyItMatters: Forecast spread is too large for one-point TAM statements and can distort valuation if not normalized.
    diligencePath: Rebuild a normalized lens separating installed base, annual shipments, and revenue by year and by market boundary before using any top-down figure in valuation work.
    relatedQuestionRefs:
    - QM010
    - QM011
    relatedTableRefs:
    - TM002
