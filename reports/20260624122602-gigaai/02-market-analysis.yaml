tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to GigaAI
  rows:
  - - Industrial robotics upgrades
    - Perception, manipulation, planning, and software layers attached to manufacturing robots and cells
    - Pure fixed-function machinery with no adaptive software or learning loop
    - Plant automation, manufacturing engineering, capex owners
    - Highest near-term relevance because budgets already exist and ROI is measured against labor, throughput, and changeover costs
  - - Logistics and warehouse robotics
    - Sortation, picking, AMR orchestration, simulation, and perception stacks for distribution centers
    - Generic warehouse IT that does not touch physical workflows
    - 3PL operators, parcel carriers, retail distribution operations
    - High relevance because warehouses already collect data, run pilots, and value throughput gains
  - - Retail / pharmacy / care service robotics
    - Robots used in repetitive in-store, pharmacy, or assistive tasks with defined workflows
    - Consumer companion robots sold on novelty alone
    - Store operations, healthcare operators, assisted-living budgets
    - Selective relevance; budgets are narrower but some Chinese pilots show real deployments
  - - World-model / simulation / tooling infrastructure
    - Simulation, synthetic data, ROS / AI middleware, model deployment, validation, and retraining tools sold to robotics OEMs or integrators
    - Generic enterprise AI copilots or developer tools not used in robot deployment
    - Robotics OEM product teams, integrators, platform engineering
    - Strategically important because it scales across fleets and embodiments even before humanoids scale
  - - Mass consumer home humanoids
    - Only limited research or pilot demand belongs in the near-term market
    - Assuming all household labor is serviceable spend today
    - Consumers, insurers, eldercare ecosystems
    - Low near-term relevance because user preference, safety, privacy, and willingness to pay remain weakly validated
  notes: Boundary logic separates deployable robotics budgets from generic AI or speculative household TAM so the chapter does not overstate GigaAI’s reachable market.
