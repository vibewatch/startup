  topStrengths:
    - >-
      The company has assembled a rare full-stack physical-AGI story spanning world models, embodied foundation models,
      data systems, and self-developed robots rather than a single demo product.
    - >-
      Capital access is unusually strong for a 2023-founded startup: public reporting supports RMB 3.5 billion raised
      over three months in 2026 and valuation above RMB 10 billion.
    - >-
      Named deployment evidence exists in industrial and household contexts, including FAW Tooling, the Hubei Humanoid
      Robot Innovation Center, a Longsheng 1,000-robot plan, and roughly 100 SeeLight S1 orders.
    - >-
      Founder-market fit is clear: Huang Guan’s background ties together computer vision, autonomous driving, embodied
      AI, and commercialization.
  topRisks:
    - >-
      Public disclosure is far behind valuation: reviewed sources do not provide revenue, gross margin, ARR, headcount,
      customer concentration, or financing-term transparency.
    - >-
      Commercialization proof remains weaker than the funding narrative because most public evidence is based on orders,
      pilots, and announced deployments rather than audited revenue or repeat production adoption.
    - >-
      The business is exposed to compute, export-control, and geopolitical risk because physical-AI training and
      deployment still lean on scarce advanced chips and global infrastructure dependencies.
    - >-
      Simulation and world-model claims still face real sim-to-real, reliability, and safety hurdles before robots can
      meet industrial-grade uptime requirements.
    - >-
      Governance and key-person concentration are material because the public story is dominated by Huang Guan and a
      narrow visible technical bench while board composition remains undisclosed.
  unresolvedGaps:
    - >-
      Dated 2026 revenue, gross margin, backlog, burn, and runway figures remain undisclosed in reviewed public
      materials.
    - >-
      Exact board composition, voting control, liquidation preferences, and any secondary component of the 2026 rounds
      are not public.
    - >-
      Customer concentration, conversion from pilots/orders to paid production, and warranty/support economics remain
      unclear.
    - >-
      Current employee headcount and organization depth beyond the visible founder-scientist core are not publicly
      verified.
    - >-
      Independent benchmark evidence on reliability, safety, and sim-to-real performance in scaled field conditions
      remains sparse.
