  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论题与反论题
        blocks:
          - type: paragraph
            body: >-
              GigaAI 的正向逻辑不难看到。一个季度内，公司完成中国规模的资金储备：CNY1 billion Pre-B、近 CNY1.5 billion B1，以及 CNY1 billion B2 /
              战略轮，同时把自己定位为全栈实体 AGI 玩家，覆盖世界模型、具身模型、工业机器人和家庭机器人。这个组合很重要，因为在具身 AI
              里，资金获取本身就是护城河：它能支持硬件迭代、数据采集、仿真和制造学习曲线，而较弱同行负担不起。反论题在于，当前价格主要由品类动能和选择权支撑，而不是由已披露经济性支撑。已审阅公开来源仍没有公布 GigaAI
              的收入、毛利率、客户集中度、积压订单转化或轮次条款。在这个行业里，这种缺失很关键。支撑最充分的高溢价同行，要么有官方软件平台叙事和全球投资人背书，例如 Figure 和 Physical
              Intelligence；要么正走向更强的财务披露，如 Unitree 的 IPO 路径。GigaAI 可能成为这些赢家之一，但今天的公开证据还不能证明它已经值得同等承销待遇。
