      - number: '7.3'
        title: 安全、责任和技术泛化风险
        blocks:
          - type: paragraph
            body: >-
              GigaAI
              最难的产品风险在于，公司试图把三件难事压进同一个商业化周期：安全的具身硬件、由世界模型驱动的泛化，以及经济上可支撑的现场运营。公司自己的论文和代码库坦率承认，真实世界机器人数据采集既贵又耗时，世界模型生成数据本意是缓解这个瓶颈，而技术栈依赖多个内部框架和大量算力。这是一套连贯的技术策略，但不等于已经证明长周期
              sim-to-real 迁移被解决。外部来源更谨慎：MIT Technology Review 强调，人形机器人仍缺少常识，采用节奏慢且高度行业化；IEEE Spectrum 则认为市场大多仍是假设，AI
              还不够稳健，达不到市场要求，工业买家关心的是电池寿命、安全和可靠性，更接近 99.99% 的水准，而不是炫目的演示质量。如果 GigaAI 的 SeeLight 和 Maker
              项目在故障率、服务和事故控制成熟之前进入家庭和工厂，中国产品质量法会带来真实敞口：可能危及人身或财产安全的产品必须符合安全标准、附带警示；缺陷造成伤害或损失时，生产者可能承担责任。
