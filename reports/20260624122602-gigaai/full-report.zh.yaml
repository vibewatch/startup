      - number: '7.5'
        title: 缓释、监控和否决标准
        blocks:
          - type: paragraph
            body: >-
              风险图景中较积极的一面是，大多数头部风险都可以监控。出口管制压力可以通过披露的硬件选择、采购灵活性，以及公司是否展示小型设备部署进展——而不仅是前沿规模训练——来跟踪。监管风险可以通过公开备案编号、安全评估、隐私文件，以及家庭产品是否附带清晰警示、条款和事故处理路径来监控。产品风险应由硬现场证据判断：复购客户、场景适配时间下降且未以安全事件为代价、披露可靠性目标，以及家庭机器人能经受真实使用而不是精心管理的展示。资本风险应通过客户广度、服务毛利率，以及新融资是否仍主要用于补贴数据采集和算力来监控。最后，人员风险应通过梯队深度和可见运营成熟度来观察：更强的合规、QA、现场服务和企业支持领导力，会降低外界对信任过度集中在创始人和小型研究核心上的担忧。如果这些信号在下一个产品周期内没有改善，投资论题应从“跟踪”转向明确否决，而不是继续由世界模型热度托着。
