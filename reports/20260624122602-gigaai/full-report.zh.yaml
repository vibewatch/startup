            body: >-
              GigaAI 的公开证据支撑一条双线策略：SeeLight S1 面向家庭服务，Maker H01
              面向工业搬运，两款产品都更依赖轮式移动，而不是完全腿式行走。这让公司比纯研究玩家更具体，但也意味着比较集合很杂。EngineAI 围绕 T800 批量交付、79 个检测点和 10,000
              台能力主张推进工业化叙事；AgiBot 把商业化量产信息同 AGIBOT World 和活跃公开代码库捆在一起；Unitree 是最清楚的价格颠覆者，因为其官方 G1 页面公开列出 US$13.5K
              价格和硬件配置；Figure 用 Helix、家庭使用和 BotQ 制造规模来包装 Figure 03；Physical Intelligence
              则并不主要卖机器人单机，而是卖一个意图控制任意机器人的模型层。因此，定价只能部分比较。Unitree 是本来源集合中唯一有清晰公开标价的直接同业。GigaAI、EngineAI、AgiBot、Figure 和
