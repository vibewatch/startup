  - id: FO001
    title: GigaAI 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 公开叙事从世界模型研究出发，延伸到具身机器人、大额融资，以及最早可见的家庭和工业部署。
    data:
      items:
        - label: DriveDreamer 发布
          detail: 面向自动驾驶研究，发布由真实世界驱动的世界模型
          date: 2023-09
          tone: positive
