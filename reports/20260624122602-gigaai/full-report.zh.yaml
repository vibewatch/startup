      - number: '5.2'
        title: 双金字塔架构与世界模型栈
        blocks:
          - type: paragraph
            body: >-
              核心产品技术论点是 Dual Pyramid
              系统：一个金字塔负责数据获取，一个负责算法学习。数据金字塔从广泛但弱监督的互联网视频，向上经过人类演示、世界模型仿真器、合成仿真，最终到高保真实体机器人数据。算法金字塔则从世界仿真推进到动作对齐，最终到经验强化。这个框架很关键，因为
              GigaAI 主张具身扩展不会来自单一模型技巧，而会来自同时控制数据阶梯和学习阶梯。[CE008] [CE009] [CE010] [CE011]


              在这套架构里，GigaWorld 是数据引擎，GigaBrain 是动作策略。官方材料和开放代码库把 GigaWorld-0 描述为一个开放框架，用来生成高泛化具身交互数据，并提供闭环仿真和 RL
              训练支持。GigaBrain 则消费多模态输入——包括图像、点云、文本和具身状态——并输出结构化任务和运动规划。更高级的 GigaBrain-0.5M* 层加入
              RAMP，用世界模型对未来状态和价值的预测来约束策略。因此，这套栈不只是「机器人加模型」；它是一套反馈架构，世界模型输出既成为训练数据，也成为动作上下文。[CE005] [CE006] [CE007]
              [CE013] [CE014] [CE016] [CE022]
