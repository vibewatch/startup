          - type: paragraph
            body: >-
              今天给 GigaAI 估值，正确方法是反问：未来需要出现什么披露，当前标记才会显得便宜、合理或明显过高。牛市情景中，GigaAI 把今天的融资爆发转化为真实部署规模：工业订单朝 1,000
              台雄心扩张，家庭试点越过当前据称 100
              台订单信号，软件或模型层附着在硬件部署上，并产生有意义的毛利率。沿着这条路径，公司可以证明明显高于当前标记的价值。基准情景更克制：商业化发生，但主要以硬件为重的试点和早期生产收入为主，因此已披露规模来得更慢，公司围绕今天轮次交易，或略低于今天轮次。熊市情景是，品类比投资人预期更长时间地保持高热度、低收入；在这种世界里，披露缺失叠加倍数压缩和下一轮偏重优先权，会造成真实
              down-round 风险。由于收入未披露，场景框架比虚假的单点目标更诚实。
