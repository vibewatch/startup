            body: >-
              当前公开质量信号来自开放代码、基准参与和具名部署引用，而不是传统企业信任栈。代码库采用 Apache 2.0 许可，GigaBrain challenge 围绕 GigaWorld 和 RoboChallenge
              正式化社区评测赛道，技术页面也展示训练、推理和评估路径，而不只是精修发布视频。这些都是公司希望外部使用和审视的有用证据。同时，公开官网仍未披露定价、正式安全认证、支持 SLA
              或专门信任门户，这限制了买方仅凭公开材料判断生产就绪度的能力。[CE017] [CE023] [CE037] [CE038] [CE039]


              路线图很激进。2026 年 6 月公开材料指向 Q3 里程碑：SeeLight S1 规模化运营、SeeLight S2 发布和 GigaBrain-1，随后在 12 个月物理 AGI 路线图中推出
              GigaBrain-2 和 GigaBrain-3。该路线图与 Dual Pyramid
              叙事在战略上自洽：更多家庭和工厂部署产生更多数据，更多数据喂给世界模型和动作模型闭环，下一代机器人理应变得更好用，而不只是舞台上更惊艳。但在 GigaAI
              发布更清楚的安全、可靠性和基准链接证据之前，这一路线图应被理解为雄心很大，但尚未完全去风险。[CE011] [CE032] [CE033] [CE034] [CE035] [CE040]
