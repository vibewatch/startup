      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              最清楚的买方不是家庭，而是有可衡量人工、正常运行时间和换线问题的企业与机器人公司。在制造业，用户可能是产线、维护团队或工厂工程师，但付款方通常是工厂自动化、资本开支或运营预算。物流场景里，用户是分拣、拣选和仓库运营人员，付款方则是
              3PL、包裹或零售运营负责人，他们会把机器人支出同人员流失、吞吐量和工伤成本对比。零售或药房等服务场景中，用户体验可能面向消费者，但采用仍取决于运营方能否用人工节约或服务一致性为机器人编预算。还有一个分层对
              GigaAI 更重要：机器人 OEM
              和集成商，它们把仿真、感知或世界模型基础设施作为许多部署的赋能层来购买。这些买方掌握数据流水线、模型再训练闭环和部署工具，因此比购买单台机器人的终端用户更像自然的基础设施客户。中国专项报道显示，物流和便利零售属于最早的商业化路径之一，因为这些场景流程密集、任务高频，且数据尾气好。家用人形机器人仍远没那么可承销，因为付费意愿、安全容忍度和真实用户偏好都更不确定。
