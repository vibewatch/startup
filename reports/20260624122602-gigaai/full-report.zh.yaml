      - number: '3.4'
        title: 护城河耐久性与反向证据
        blocks:
          - type: paragraph
            body: >-
              GigaAI 确实具备可信护城河的材料：新鲜资本、具名工业客户、家用试点叙事，以及 GigaWorld、GigaBrain
              等内部品牌模型。但每一条护城河向量都有可见的反重力。品类里资本很充裕，因此融资本身并不耐久。公开试点胜利重要，但 EngineAI 和 Figure 也在放大制造故事，AgiBot 与 Physical
              Intelligence 则投资模型和数据飞轮，这些飞轮可能比 GigaAI 的产品特定优势更快穿越硬件代际。最强反向证据来自整个行业。Berkeley
              研究者认为灵巧操作数据缺口巨大，未来两年、五年甚至十年都不应期待实用的人类水平操作。MIT Technology Review 报道人形机器人仍缺常识，采用大概率缓慢且行业特定，同时也提出 Figure 与
              BMW 关系到底代表多少真实生产证明的问题。KrASIA 补上融资警告：投资人自己也越来越把具身 AI 描述为模糊，商业化处于低挡位，估值容易受泡沫动态影响。对 GigaAI
              的含义很直接。公司也许很适合继续推进试点，但竞争耐久性仍取决于它能否比价格更优、更开放或分发更强的对手更快把资本和演示转成可重复的现场表现。
