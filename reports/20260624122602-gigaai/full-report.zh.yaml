  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层、买方结构与证据真正最强的地方
        blocks:
          - type: paragraph
            body: >-
              GigaAI 的公开客户故事比单个类人机器人 SKU 更宽，但证据在各分层之间并不均匀。今天最能支撑的分层是工业制造、家庭或养老试点，以及汽车仿真。工业证明由 FAW Tooling Die
              的具名工厂部署、与湖北人形机器人创新中心的首批交付关系，以及无锡 Longsheng 项目锚定。汽车证据更窄但真实：ECARX 已正式把 DriveDreamer 集成进 AutoGPT，这给了 GigaAI
              至少一个直接 Tier-1 风格的世界模型采用证明点。家庭和养老证据仍早，但可见度异常高，100 台家庭发布叙事在中英文媒体中反复出现。相比之下，3C
              电子、仓储或物流更适合理解为公司宣称覆盖的分层，而不是具名、独立逐项列出的客户证据。这一区分很重要，因为它既让 GigaAI
              的客户地图保持可信，又不会夸大公开证据。买方、用户、付款方在各分层中也不同：工厂和公共机构似乎赞助部署，运营团队是用户，国资背景试点或企业预算很可能是付款方；家庭则仍更接近试用参与者，而不是经常性订阅者。
