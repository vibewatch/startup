      - number: '1.3'
        title: 融资历史、估值与资本形成
        blocks:
          - type: paragraph
            body: >-
              GigaAI 的融资故事，是它在后续章节值得关注的核心原因。公开报道显示，公司从种子轮进入 2024 年天使融资，2025 年完成 Pre-A 和 Pre-A+ 轮，A1 轮由 Huawei Hubble 和
              Huakong Fund 支持，并披露了 RMB 200 million 的 A2 轮。2026 年节奏明显加速。已审阅来源在 3 月近 RMB 1 billion 的 Pre-B 轮、4 月近 RMB 1.5
              billion 的 B1 轮、6 月 RMB 1 billion 的 B2 轮上基本一致。随后第一财经将三个月融资概括为 RMB 3.5 billion，约 USD 518
              million，多家中文媒体称估值已超过 RMB 10 billion；Crunchbase 也将 GigaAI 记录为 2026 年 4 月 Series B 后估值约 USD 1.5 billion
              的独角兽。因此，资本底座无疑很大，但仍未完全透明。有些报道列出了每轮的长投资人名单，但一名 B1
              参与方仍只被描述为「知名科技巨头」，公开来源也没有披露准确董事会权利、持股结果，或是否存在重大老股转让。实际结论是，估值和融资速度有充分支撑；但股权表机制仍是待追问事项，而非已解决事实。
