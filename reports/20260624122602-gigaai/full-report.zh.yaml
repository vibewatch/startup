      - number: '4.3'
        title: 单位经济性与资本强度
        blocks:
          - type: paragraph
            body: >-
              最有用的财务视角是比较式，而不是公司专属式，因为 GigaAI 几乎没有披露投资人通常用来判断机器人单位经济性的项目。外部锚点显示，这套栈资本强度很高。2026 年工业机器人指南把仅机械臂价格大致放在
              USD25,000 到 USD180,000 区间；若把工装、集成和安全纳入，完整部署单元往往达到 USD80,000 到 USD400,000，多年总拥有成本远高于标价。Standard Bots 的 ABB
              定价指南也指向同一方向：经销商报价因型号和地区而异，一套装备齐全的重载系统可能超过 USD120,000。对 GigaAI 本身，Humanoid.guide 的 USD160,000 Maker H01
              锚点只能作为低置信度外部对照，不能当作经验证的公司定价。家庭端经济性更不确定。RoboActu 报道称 SeeLight S1 试点家庭免费拿到设备，硬件价格目标是在 2027 年中降至 RMB100,000
              以下，这意味着家庭业务可能仍处在有补贴的数据采集和产品学习阶段，而非成熟毛利阶段。可比公开机器人公司财报也强化了谨慎结论。UBTECH 2025 年业绩显示人形业务强劲增长、毛利率
              37.7%，但公司在扩产中仍录得显著亏损。iRobot 申报文件则显示，当需求、价格和成本结构无法匹配时，消费机器人业务会遭遇库存压力、促销压力和持续经营风险。对 GigaAI
              来说，正确结论不是单位经济性很差，而是它仍未被证明，并且很可能按产品线高度异质。
