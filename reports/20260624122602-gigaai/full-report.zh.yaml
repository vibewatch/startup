      - number: '8.6'
        title: 退出准备度、论题破裂触发点和最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              公开证据不支持今天把 GigaAI 视为已具备退出准备。公司显然拥有融资动能和品类位置，未来可能成为 IPO
              或战略收购候选，但披露文件仍太薄，无法让这条路径被有信心地承销。最重要的论题破裂点很简单：如果带日期的收入、积压订单或毛利率披露出现，并显示业务规模远低于支撑 $1.5 billion
              以上标记所需水平，估值逻辑会迅速塌陷。紧密相关的触发点包括：带有重度 senior preferences 的
              down-round、订单信号主要是试点而非合同需求的证据，或硬件利用率提升慢于投资人假设的证明。因此，最终尽调应聚焦 2026
              年确切已签收入、硬件与软件或服务分项毛利率、客户集中度、已签积压订单与取消权、2026 年融资后的 burn 和 runway，以及优先权结构。在这些问题得到回答之前，审慎的 IC 姿态是把 GigaAI
              留在积极覆盖中，而不是把叙事兴奋转化为对价格不敏感的承诺。
