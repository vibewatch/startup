      - number: '5.4'
        title: 差异化、开放工具与相邻驾驶栈
        blocks:
          - type: paragraph
            body: >-
              GigaAI 的差异化不在单个基准奖杯，而在栈的广度。它已经开源了具身 VLA 代码库、世界模型代码库、训练框架、数据框架和共享模型库，公开 GitHub 组织在这些界面上也已有可观 star
              牵引力。这给了公司强于典型封闭机器人 OEM 的开发者信号，也让产品故事更容易审计：这套栈可检查、可复现，并以基准为导向。[CE018] [CE023] [CE024] [CE037] [CE038]


              驾驶分支同样重要，因为它拓宽了变现和数据飞轮论点。DriveDreamer、DriveDreamer4D 和 UniDriveDreamer 显示，GigaAI
              并没有把世界模型当成机器人专用小众方向；它把同一套「数据机器」逻辑用于 AV 仿真、4D 重建和多模态 camera-LiDAR
              生成。如果这些分支继续共享基础设施和人才，它们会强化公司关于护城河来自世界模型运营、而非单一本体形态的主张。风险在于，客户数量和基准规模主张在官方和媒体界面之间仍记录不均。[CE025] [CE026]
