  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接同业、既有巨头与替代路径
        blocks:
          - type: paragraph
            body: >-
              GigaAI 处在具身 AI 市场，但竞争对手不只是其他中国人形机器人创业公司。其公开产品线横跨轮式工业机器人 Maker H01 和轮式家用机器人 SeeLight S1，因此买方不仅会把它同
              EngineAI、AgiBot、Unitree 等中国直接同业比较，也会同 Figure、Physical Intelligence 等西方通用项目，以及 FANUC、KUKA、ABB
              等传统工业自动化厂商比较。这一区分很重要，因为在行业尚未收敛到家庭、工厂或模型层软件哪一块会创造最大近端价值池之前，GigaAI 就在要求买方采用新的机器人形态。直接同业最强之处，恰是 GigaAI
              在公开材料中最弱之处：Unitree 已经有公开商城和全球研究分发信号，EngineAI 的制造规模主张和 Luxshare 支持的供应链故事更响，AgiBot
              则公开了更多数据集和开发者界面证据。替代集合也异常强。FANUC、KUKA 和 ABB 已经用广泛产品目录和成熟支持模式服务物料搬运、焊接、装配、码垛和检测。对许多工业任务来说，GigaAI
              的实际替代品根本不是另一台人形机器人，而是采购团队已经知道如何部署和维护的低风险固定式或协作式自动化。
