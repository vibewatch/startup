      - number: '7.4'
        title: 采用、资本和依赖风险
        blocks:
          - type: paragraph
            body: >-
              商业风险较少来自叙事不足，更多来自叙事跑在可重复采用之前。公开来源确实显示真实部署标志：Maker H01 交付给湖北人形机器人创新中心、一汽模具工厂用例、三年 1,000 台机器人龙盛计划，以及约 100 台
              SeeLight S1 订单，目标是在 2026 年 Q3
              扩量。但同一批披露留下了关键空白。它们没有公布现场可用率、MTBF、事故率、保修经济性、服务人员配置，也没有披露试点转化为经常性生产账户的收入情况。这使伙伴依赖变得重要：少数具名工业关系承担了过大的信号价值，因此任何锚定客户或部署伙伴的滑坡，都可能同时打击市场认知和学习闭环。融资风险同样不低。公司的融资速度令人印象深刻，但披露的募资用途显示，资本仍在为模型、数据和铺开扩张供血。换句话说，从公开经营经济性看，公司还不能自我证明；它更像一个融资充足、正在赛跑以证明经济性的竞争者。在更谨慎的人形机器人市场里，这一区分会变得关键。
