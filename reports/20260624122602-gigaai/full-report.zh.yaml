chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、域名控制与商业模式
        blocks:
          - type: paragraph
            body: >-
              最扎实的基础身份画像，在公司名称、所在地和产品叙事上内部一致，但英文域名并不一致。活跃网站 gigaai.cc 指向一个标题为「极佳科技」的极简页面，而 gigaai.com
              是挂牌待售的停放域名，并非公司官网。这不削弱运营主体本身，但对自然会先查 .com 的交易对手来说，是一个真实的尽调提示。独立财经和行业报道一致把业务识别为北京极佳视界科技有限公司 / GigaAI，2023
              年成立，总部在北京。公司的经营假设不止一个机器人 SKU：公司反复描述的是一套把世界模型、具身基础模型、自有机器人本体和泛化场景合在一起的栈。落到商业化，就是两条仍在公开视野中验证的变现路径：通过软件、API
              或授权向合作伙伴交付软件或基础模型服务，以及围绕 Maker 工业线和 SeeLight 家庭线的硬件加部署项目。公开来源支撑战略叙事，但还没有披露稳定收入、ARR
              或客户数量等指标，投资人无法据此把叙事动能和经常性商业规模拆开。
