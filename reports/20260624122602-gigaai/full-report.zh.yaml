      - number: '6.4'
        title: 扩张已经出现，但集中度和生态依赖仍是真实风险
        blocks:
          - type: paragraph
            body: >-
              公开材料里已经能看到最合理的扩张闭环：试点或首次部署产生数据，数据改进 GigaWorld 或
              GigaBrain，升级后的技术栈覆盖更多场景，更丰富的证明再帮助公司拿下下一个点位或伙伴。湖北和武汉处在这个闭环中心，因为它们同时提供数据工厂、智能制造推广、政策资金和经过筛选的住宅测试床。龙盛则增加了第二条规模化路径：在无锡把制造支持与多年部署计划结合起来。这些都是优势，但也暴露了集中度风险。目前大部分具名证明落在少数政府关联或伙伴主导的生态里，公开来源没有披露收入或装机基数有多大比例依赖这些生态。龙盛
              1,000
              台计划也是管线承诺，不是已经落地的装机量。同样，家庭牵引在接触广泛中等收入需求之前，仍看起来集中在高端或政策支持的住房环境。因此，商业上行空间可信，但仅凭公开证据，市场还没有多元化到足以让投资人承销低集中度风险。
