      - number: '8.3'
        title: 融资背景、稀释悬顶和公开文件无法支持的内容
        blocks:
          - type: paragraph
            body: >-
              融资背景清楚，经济性却不清楚。第一财经和其他已审阅媒体基本一致认为，GigaAI 在 2026 年约三个月内融资 CNY3.5 billion，包括 3 月 Pre-B、4 月 B1 和 6 月 B2 /
              战略轮，投后估值超过 CNY10 billion。这种资本形成规模是真实的，并显著提高了 GigaAI
              在昂贵的训练加硬件竞赛中存活的概率。它也带来不同的尽调负担。到了这一阶段，正确的承销问题不再是公司能否融资，而是这些钱换来了多少所有权、清算优先权顺位、老股转让泄漏和 runway
              延长。已审阅公开文件没有呈现任何这些条款。收入、积压订单和毛利率未披露，意味着投资人还无法测试最新一轮反映的是牵引、稀缺战略选择权，还是具身 AI
              热钱市场。实际操作中，场景估值会占主导，因为常规轮次收入倍数还无法用已披露经营数据扎根。
