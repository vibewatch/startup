  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价姿态
        blocks:
          - type: paragraph
            body: >-
              公开记录中的 GigaAI 不是单线硬件供应商。最清楚的备案式和公司关联证据显示，其业务范围在法律上可以覆盖软件开发、行业应用系统、机器人制造与销售、设备租赁、安装维护、数据服务和进出口。2026 年 6
              月独立报道进一步把变现架构说清：一条线是通过软件、API 和授权向合作伙伴出售基础模型能力；另一条线是用 SeeLight 和 Maker
              系列把模型栈带入家庭和工业环境的自有产品。这意味着公司原则上可以同时变现经常性软件层和资本设备层，并围绕两者提供部署服务。缺失的是实际组合。已审阅官方或独立来源都没有披露当前收入（如有）中模型服务与机器人硬件分别占多少。定价透明度同样很薄。GigaAI
              未在官方界面发布标价、公开结账流程或标准化套餐层级；媒体报道描述的是订单、试点和合同，而不是已发布商业条款。实际读法是报价制模式：工业端协商式企业销售，消费端早期项目式家庭推出，模型或仿真基础设施则很可能采用定制商业条款。这种姿态对工业机器人很正常，但它显著限制了外部人士今天推断实际
              ASP、折扣或贡献毛利的能力。
