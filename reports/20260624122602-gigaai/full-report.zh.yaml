  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 已交付产品、品牌与用户任务
        blocks:
          - type: paragraph
            body: >-
              GigaAI 已不再只是围绕单个机器人演示包装的研究品牌。其官网公开产品界面覆盖四条锚定路线——Maker H01、GigaBrain、GigaWorld 和 DriveDreamer——而 2026 年 6
              月发布报道又加入家庭品牌 SeeLight，S1 和 S2
              是同一栈面向家庭的一支。这意味着公司至少同时在卖三类东西：具身基础模型、自有机器人本体，以及面向自动驾驶等相邻垂直领域的世界模型工具。按工作流拆，Maker H01 是执行界面，GigaBrain
              是决策层，GigaWorld 是具身数据与仿真层，DriveDreamer 是驾驶世界模型分支。[CE001] [CE003] [CE004] [CE006] [CE028] [CE033] [CE034]


              用户任务也同样分裂。工业用户侧，已披露任务包括箱体拆垛、跨区运输、动态避障，以及真实工厂里的精细操作。家庭用户侧，SeeLight 系列围绕家务和更长期的家庭辅助展开。AV 客户侧，DriveDreamer
              被销售为数据生成、长尾场景处理和闭环仿真的基础设施。最宽的解读是，GigaAI 想拥有从数据捕获到策略学习再到物理执行的整条栈，而不是只变现一个机器人 SKU 或一个模型 API。[CE010] [CE031]
              [CE033] [CE036] [CE041]
