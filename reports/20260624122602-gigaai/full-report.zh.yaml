      - number: '8.5'
        title: 可比集合：溢价上限、披露锚点和警示性上市可比
        blocks:
          - type: paragraph
            body: >-
              可比集合更支持谦逊，而不是确信。溢价侧，Figure 的官方融资路径从 2024 年 $2.6 billion 到 2025 年 $39 billion；Physical Intelligence 则从 $5.6
              billion 走向下一轮超过 $11 billion 的报道。这些结果显示，市场有时愿意为具身 AI 平台选择权支付高价。但这两个可比本身都无法拯救 GigaAI 的价格：两者都是全球叙事领导者，且
              Physical Intelligence 至少披露了软件订阅逻辑。更有用的锚点是 Unitree，因为它同时提供估值和经营披露。财新报道其 2025 年 6 月估值为 127 亿元、2026 年 IPO 目标为
              420 亿元、2025 年收入为 17 亿元、利润为 2.8 亿元。上市机器人可比用另一种方式说明同一点。Symbotic 的市值和申报收入隐含高个位数年化销售倍数；Serve
              则说明，收入极小的机器人公司也能在很小基数上打出吸睛倍数。放在这组可比中，GigaAI 当前标记在品类里并不荒谬，但相较已披露同行，证据不足。
