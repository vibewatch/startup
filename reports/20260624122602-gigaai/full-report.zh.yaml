      - number: '8.2'
        title: 建议、信心和进入纪律
        blocks:
          - type: paragraph
            body: >-
              我们给予 GigaAI “继续研究”评级，信心为中，风险评级为高，估值姿态为偏紧。这不是看空公司的技术野心，而是基于今天公开可知信息的价格敏感判断。当前估值锚点超过 CNY10 billion，约 $1.5
              billion；只有当 GigaAI
              能把当前融资动能转化为已披露收入规模、可接受的硬件经济性，以及可获得溢价倍数的软件附着时，这一估值才站得住。支撑这一步跨越的证据仍然缺失。公开报道显示出有希望的商业化标志，包括据称约 100 台家庭机器人订单和
              1,000
              台年交付目标，但这些锚点仍弱于已报告收入、经常性软件支出或经审计的利润率披露。因此，进入纪律应明确：不要只为叙事支付当前价格；要求有日期的收入、毛利率、积压订单质量和优先权结构披露，或者以明显低于当前标记的价格进入。
