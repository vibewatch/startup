            body: >-
              近期融资给了 GigaAI 空间，但披露不足以判断公司已经能自我供血。支撑最强的公开事实，是 2026 年 3 月至 6 月横跨 Pre-B、B1 和 B2 的融资潮，合计约 RMB3.5
              billion，投后估值超过 RMB10 billion。第一财经和 NCSTI 关于资金用途的表述高度一致：管理层计划继续投入数据与算法「双金字塔」，迭代物理 AGI
              基础模型，并扩大家庭和工业部署。换句话说，新资金投向进一步模型开发和商业化建设，而不是一台已经清晰盈利、正在吐现金的机器。这并不天然负面；前沿机器人业务常常需要这样。但资本充足性无法完整评估，因为已审阅公开来源没有披露账上现金、月度烧钱、跑道月数、债务负担、客户融资义务或项目融资结构。可比上市公司说明了这个遗漏为何重要。ABB
              2025 年综合报告即便在成熟规模下，也记录了数十亿美元级年度资本开支和研发预算；UBTECH 则显示，人形机器人收入快速增长仍可能与扩产期的大额经营亏损并存。含义是，GigaAI
              近期资本是战略缓冲，而不是证明公司无需下一轮融资就能支撑家庭推出、工业安装、支持义务和模型研发。下一轮融资讨论应从标题估值转向付费部署转化、重复软件收入和毛利耐久性的证据。
