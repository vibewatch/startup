      - number: '5.3'
        title: 部署、集成与可靠性证据
        blocks:
          - type: paragraph
            body: >-
              最强公开部署证明不是消费者应用指标，而是一串现场 rollout。Gasgoo 报道 Maker H01 首批交付湖北人形机器人创新中心；2026 年 6 月报道则称 GigaWorld + GigaBrain
              + Maker H01 三件套进入 FAW Tooling Die 执行真实工业流程，并计划与 Longsheng Technology 推进三年 1,000 台 rollout。家庭侧，SeeLight S1
              绑定约 100 户订单簿，并计划 2026 年第三季度规模化运营。这些披露表明，GigaAI 把部署当成模型闭环输入，而不只是收入终点。[CE029] [CE030] [CE031] [CE032]
              [CE033] [CE034]


              集成证明也强于许多硬件优先的机器人创业公司，因为公开代码库展示了明确接口。GigaBrain 包含推理服务器和客户端路径；GigaTrain 处理分布式训练和 checkpoint；GigaDatasets
              打包并评估多模态机器人数据；GigaModels 覆盖训练、推理、部署和压缩。开源界面让这套栈更可读，但可靠性证据仍更多来自试点和基准，而不是运营：公开材料尚未披露正常运行时间、MTBF、现场故障率或客户支持
              SLA。[CE017] [CE018] [CE019] [CE020] [CE021] [CE037] [CE039]
