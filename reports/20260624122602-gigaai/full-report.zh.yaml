      - number: '2.2'
        title: 规模测算视角：真实自动化底座 vs 推测性人形上行空间
        blocks:
          - type: paragraph
            body: >-
              公开市场规模口径分歧很大，因为它们衡量的不是同一件事。IFR 数据显示，自动化底座已经庞大且具体：2023 年全球机器人密度创纪录，中国已掌控大部分新增工业装机，中国制造业装机基数以百万台计。这是 GigaAI
              这类能力可以卖入的基础层。相比之下，TBRC 等宽口径具身 AI 报告把 2025-2026 年市场描述为几十亿美元级，MarketsandMarkets
              等更窄的人形机器人报告则从更小基数出发预测更快增长。银行研究把时间线拉得更长：Goldman 的保守情景在未来十年仍只有个位数十亿美元级，而 Morgan Stanley 和 BofA
              则在品类走向大规模采用的前提下，建模出巨大的长期出货或收入结果。这些数字不该被平均成一个整洁 TAM。它们更像一架梯子：当前的自动化装机基数，更近的具身 AI
              软件和系统层，再往上才是更具推测性的通用人形机会。尽调时，对 GigaAI 最重要的市场数字，是机器人
              OEM、集成商和运营方已经愿意付费以降低设置时间、改善感知或提高任务泛化的可服务切片。公开来源尚未清晰隔离这一层，因此 SAM 和 SOM 仍受证据约束，而不是模型可精确测算。
