      - number: '7.2'
        title: 地缘政治和监管风险
        blocks:
          - type: paragraph
            body: >-
              最结构性的外部风险在于，GigaAI 正好在监管密度上升的地方扩张。美国侧，BIS 指引现在表明，即便接收方位于中国境外，面向中国总部实体的先进计算出口也可能需要许可证；2025–2026
              年的管制姿态扩大了对中国市场设计芯片以及经第三国转运的审查。这一点很重要，因为 GigaAI 公开技术栈明确围绕可扩展训练、多 GPU 执行、FP8 效率、世界模型数据引擎，以及甚至提到 NVIDIA
              Jetson 的部署路径。中国侧，负担也不再只是笼统的 AI 口号。中国已发布人形机器人与具身智能国家标准体系，CAC
              规则也已经对训练数据合法处理、尊重知识产权、内容标识、透明度，以及具有舆论属性或社会动员能力的算法服务备案或安全评估义务提出要求。对 GigaAI
              来说，实际问题不是每条规则今天都必然适用；而是家庭机器人、多模态数据采集和模型介导输出，会让公司在产品离开受控演示、进入更像消费者或更宽泛工业环境时，可能碰到其中多项规则。
