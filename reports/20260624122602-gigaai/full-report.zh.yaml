          - type: paragraph
            body: >-
              相比许多只展示实体 AI 的初创公司，GigaAI 现在有更多可见部署证明，但公开记录在耐久性指标上仍严重滞后。已审阅来源没有披露 NRR、GRR、流失率、续约率、合同期限，也没有给出工业账户或家庭用户的
              cohort 视图。因此，本章可以核验启动动作和具名点位，却无法判断客户是否续约、扩张，或安装后是否产生经常性利润。家庭试点来源在这一点上尤其说明问题。中国日报把首批 100
              台家庭设备描述为免费试用，并把数据采集和故障识别纳入流程。eWeek
              的现场报道补上了具体质量缺口：有些家务仍然慢、别扭或不整洁；这反而有价值，因为它说明机器人是在真实环境里测试，而不只是停留在精修演示中。中国日报提到 2,000 多条 WeChat
              留言，说明有兴趣，但兴趣不等于转化。最诚实的读法是：当前满意度证明更多是轶事和运营层面的，而不是合同层面的。在 GigaAI 公布续约、服务和维护指标之前，留存应被视为尽调问题，而不是可推断的优势。
