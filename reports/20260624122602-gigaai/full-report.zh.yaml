      - number: '4.5'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              可投资的正面在于广度。GigaAI
              似乎不止一种变现选项，而且这些选项与真实公开牵引力对齐：工业机器人部署、早期家庭需求、基础模型服务叙事，以及看起来已有外部客户的自动驾驶仿真基础设施分支。可投资的负面在于不透明。公司仍不公布已确认收入、毛利率、烧钱或现金跑道，公开定价也缺席、以报价制为主，或只是第三方松散估算。这让故事更像「融资加现场证明」，而不是「可审计的财务扩张」。因此，我的财务结论是谨慎正面但尚不可承销：2026
              年融资后，近端偿付风险看起来降低，但在 GigaAI
              披露多少部署转化为收入、收入中硬件与软件各占多少、家庭推出附带哪些服务义务，以及放量后毛利率改善还是压缩之前，财务质量仍无法干净打分。投资人只有在公司能证明当前订单的付费转化、重复工业或仿真合同，并至少部分披露毛利、现金消耗和支持经济性时，才应认为下一轮融资有依据。
