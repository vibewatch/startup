      - number: '2.4'
        title: 增长驱动、采用约束与中国特有节奏
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动来自劳动力稀缺、政策支持和集成摩擦下降。IFR、WEF 和 BofA
              都指出，结构性劳动力短缺、劳动力老龄化和制造业回流压力，是企业持续自动化的原因。中国还多了一种加速器：国家政策、深厚零部件基础、高机器人装机量和本土供应商份额提升。技术侧，近端最可信的价值不是神奇自治，而是降低设置成本、改善感知、让操作更灵活，并通过仿真和数据闭环加快迭代。BCG
              的框架在这里有用：Level 2 和 Level 3 现在就创造价值，Level 5 推理和宽口径世界模型仍偏愿景。这一区分对 GigaAI
              的市场时机很关键。最佳近端采用场景，是既有车队、仓库或工厂先吸收更好软件，再购买数千台通用人形机器人。约束同样实质。反向来源反复点出灵巧度、仿真到现实的数据鸿沟、可靠性、电池寿命、安全标准，以及大型场站人形需求证据不足。多方还认为，平面工厂往往更适合轮式或任务专用系统，而不是腿式人形。因此，采用路径大概率分阶段：先工业和物流部署，再更广泛服务场景，最后才是家用人形。对
              GigaAI 来说，今天可投资的市场是已在自动化环境里的升级周期，尤其在中国和亚太，而不是一个普适机器人劳动力替代故事。
