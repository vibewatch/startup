      - number: '1.2'
        title: 创始人、领导层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始人集中度是公开资料里最清楚的特征之一。几乎每篇融资和人物报道都会出现黄冠，身份是创始人兼 CEO，履历横跨清华自动化、Horizon Robotics、PhiGent / 鉴智机器人、Microsoft
              Research Asia 和 Samsung China Research。对一家做世界模型和机器人的公司来说，这让创始人与市场的匹配度格外可读：他的履历把计算机视觉、自动驾驶、具身 AI
              和工业化连在一起。公开可见的第二梯队领导层更窄，但仍有意义。投资人和人物报道提到郑珠为联合创始人兼首席科学家，孙少岩为联合创始人且有 Alibaba Cloud 和 Horizon 经历，毛继明为有 Baidu
              Apollo 背景的工程负责人。郑珠个人主页独立确认其 GigaAI
              头衔，这让领导层画像不只停留在融资宣传文案。仍然不透明的是治理。已审阅来源披露了大型机构投资人联盟，却没有公布董事会构成、投票控制、保护性条款，也没有说明近期融资是否重塑了创始人控制权。因此，尽调里的关键人物风险是真实存在的：公开叙事、融资通道和技术路线图可信度，都显著集中在黄冠和一个小型技术班底身上。
