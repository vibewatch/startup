            body: >-
              公开牵引力存在，但主要是运营层面，而非财务层面。第一财经、QQ 和相关中文报道在三项头部商业化信号上收敛：大规模家庭交付前约 100 个 SeeLight S1 订单、与 Longsheng Technology
              三年部署 1,000 台 Maker 系列机器人的框架，以及在 FAW Tooling Die 使用 GigaWorld-GigaBrain-Maker 栈执行拆垛、跨区域运输等任务的工业部署。更早的
              Gasgoo 报道也显示，首批 Maker H01 发往湖北人形机器人创新中心，并把 2026 年描述为从模型叙事走向场景落地和交付的一年。软件侧，QQ 和 NCSTI 把 DriveDreamer
              描述为已签约的基础设施业务，服务 30
              多家国内外车企或自动驾驶客户；这一点重要，因为它暗示自动驾驶仿真分支不只是纸面资产。但这些牵引信号都没有闭合会计环路。公开来源没有披露已确认收入、递延收入、毛利、客户集中度，也没有说明 1,000
              台框架中多少是有约束力的采购订单、多少是分阶段意向。它们也没有解释家庭订单是全额付款、部分预订、有补贴，还是免费试点投放。因此，公司比纯演示型创业公司有更多商业化证明，但距离财务上可承销的成长公司仍差得很远。
