  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：GigaAI 实际卖向哪里
        blocks:
          - type: paragraph
            body: >-
              对 GigaAI 而言，相关市场边界不是泛 AI
              软件，也不是所有机器人硬件。可用边界从已经为感知、操作或流程适配付费的物理自动化环境开始，再收窄到帮助机器人在混乱真实任务中感知、规划和泛化的软件与系统层。公开证据支持边界内四个桶：制造业工业机器人升级、物流和仓储机器人、零售或药房等特定服务流程，以及卖给机器人
              OEM 和集成商的世界模型或仿真基础设施。边界外的东西同样重要。通用办公室 copilot、纯聊天界面、没有学习闭环的固定功能工厂机械、缺乏预算验证的消费级家庭机器人愿景，都不应计入 GigaAI
              近端需求。多份反向来源强调，人形本体本身不是市场；很多工作仍更适合轮式、固定底座或任务专用机器人。这一点很重要，因为 GigaAI
              的产品逻辑看起来更接近基础设施和部署层，而不是大众家庭机器人供应商。实际市场由既有自动化支出、集成痛点和运营方为更好泛化付费的意愿决定，而不是银行报告里最大的标题 TAM。
