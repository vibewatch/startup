      - number: '3.3'
        title: 分发、供应能力与切换成本
        blocks:
          - type: paragraph
            body: >-
              具身 AI 近端最耐久的竞争优势，不是原始灵巧度参数，而是渠道触达、零部件杠杆和装机基数学习。GigaAI 确实有早期分发证据：第一财经报道约 100 个 SeeLight S1 订单、与 FAW Tooling
              Die Technology 的工厂部署，以及与 Longsheng Technology 的三年 1,000 台 Maker 协议。但这看起来仍是集中式，而非广覆盖。Unitree 把面向零售的公开定价同
              Nvidia 研究者系统选择带来的全球研究分发信号结合起来。EngineAI 借 Luxshare 和专属深圳基地，拿出了更强的制造和供应链深度公开证据。AgiBot 的 GitHub
              和数据集足迹让开发者与研究者看得懂其工具，形成另一种分发。Figure 则通过垂直整合、BMW 证明点和 BotQ 产线以不同方式构建渠道力。在这个背景下，GigaAI
              的切换成本可能真实存在，但仍在形成。一旦机器人接入安全规则、流程软件、任务特定数据采集和员工培训，替换就会痛苦。但市场仍足够早，多栈并用仍可行：许多客户可能还在比较试点，而不是押注一个长期机器人栈。这让首批部署具有战略重要性，但也意味着包括
              GigaAI 在内的任何玩家，都不能仅凭试点假设自己已有耐久锁定。
