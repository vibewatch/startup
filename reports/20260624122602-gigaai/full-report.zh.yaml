            body: >-
              采用轨迹最好不要只看单个标题，而要按阶梯读。第一，盖世汽车称，GigaAI 已开始交付 Maker H01，首台交给了湖北人形机器人创新中心。第二，2026 年 4 月，GigaAI
              的工业验证进入具名汽车制造场景：一汽模具被披露为实际工厂点位，用于卸箱、跨区域转运、动态避障和精细作业。第三，2026 年 6 月又新增龙盛关系，公司与无锡伙伴宣布三年部署 1,000 台 Maker
              系列机器人，并称首批已通过工业搬运验证且完成交付。第四，家庭路径从演示走到 100
              台首发叙事。但采用线索在这里开始变得不够干净：有的媒体说订单，有的说员工住房或人才公寓测试，中国日报则称这是面向普通家庭的免费试用。最后，DriveDreamer 侧至少有 ECARX
              这一直接公开客户证明，但更宽泛的 30 多个客户数仍是未逐项列明的说法。结果是：公司确实在从概念走向现场使用，但公开扩张语言仍更多由计划支撑，而不是由收入支撑。
