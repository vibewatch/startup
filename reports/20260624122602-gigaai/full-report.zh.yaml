  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 品类
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 与 GigaAI 的相关性
    rows:
      - - 工业机器人升级
        - 附着在制造机器人和单元上的感知、操作、规划和软件层
        - 没有自适应软件或学习闭环的纯固定功能机械
        - 工厂自动化、制造工程、capex 负责人
        - 近期相关性最高，因为预算已经存在，ROI 会对照劳动力、吞吐量和换线成本衡量
      - - 物流和仓储机器人
        - 面向配送中心的分拣、拣选、AMR 编排、仿真和感知栈
        - 不触及物理工作流的通用仓库 IT
        - 3PL 运营商、包裹承运商、零售配送运营
        - 相关性高，因为仓库已经采集数据、跑试点，并重视吞吐提升
      - - 零售 / 药房 / 护理服务机器人
        - 用于店内、药房或辅助任务中重复工作、且工作流明确的机器人
        - 仅靠新奇感销售的消费者陪伴机器人
        - 门店运营、医疗健康运营商、辅助生活预算
        - 选择性相关；预算更窄，但部分中国试点显示真实部署
      - - 世界模型 / 仿真 / 工具基础设施
        - 出售给机器人 OEM 或集成商的仿真、合成数据、ROS / AI 中间件、模型部署、验证和再训练工具
        - 未用于机器人部署的通用企业 AI copilots 或开发者工具
        - 机器人 OEM 产品团队、集成商、平台工程
        - 具有战略重要性，因为即便人形机器人尚未规模化，它也能跨机队和不同形态扩展
      - - 大众消费者家庭人形机器人
        - 近期市场只应纳入有限研究或试点需求
        - 假设所有家庭劳动今天都可服务化为支出
        - 消费者、保险方、养老生态
        - 近期相关性低，因为用户偏好、安全、隐私和支付意愿仍缺乏充分验证
    notes: 边界逻辑把可部署机器人预算与通用 AI 或投机性家庭 TAM 分开，避免本章夸大 GigaAI 可触达市场。
