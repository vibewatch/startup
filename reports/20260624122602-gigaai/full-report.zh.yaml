      - number: '1.4'
        title: 里程碑、公开指标与风险信号
        blocks:
          - type: paragraph
            body: >-
              公司的里程碑曲线，在技术和部署叙事上强于经审计经营数据。研究代码库和论文显示，公司从自动驾驶世界模型 DriveDreamer，推进到作为具身数据引擎的 GigaWorld-0，再进入 GigaBrain
              和实体机器人产品。到 2026 年初，GigaAI 已宣称 Maker H01 大规模交付、首批发往湖北人形机器人创新中心、与 FAW Tooling 和 Alibaba Cloud 的制造流程，以及与
              Longsheng Technology 三年部署 1,000 台 Maker 系列机器人的计划。家庭端野心也更具体：多方来源称 SeeLight S1 约有 100 个订单，并计划在 2026
              年第三季度扩大交付或运营。问题在于，公开经营指标仍落后于故事。已审阅材料没有提供经验证的收入、ARR 或员工人数，客户证据也更多来自部署、订单和模型基准，而不是现金生成。本轮检索中最尖锐的外部质疑来自
              Tencent News 评论，它提醒世界模型热潮中估值膨胀、真实世界泛化和商业化仍是开放问题。已审阅来源中没有出现具体诉讼或处罚，但没有公开负面案卷并不等于法律尽调已经完成。
