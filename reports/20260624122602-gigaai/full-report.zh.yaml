  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险姿态
        blocks:
          - type: paragraph
            body: >-
              GigaAI 在野心和资金获取上异常强，但公开记录仍指向较高剩余风险，而不是已经降险的规模化故事。公司现在把自己定位为全栈实体 AGI
              平台，覆盖世界模型、动作模型、数据引擎和原生机器人本体；公开融资报道称其三个月内融资 CNY3.5
              billion，并同时瞄准工业和家庭部署。这些确实是优势，却会加重而不是降低执行压力。同一批来源显示，新资金正投向数据系统、模型打磨和机器人扩产，也就是说，在可持续单位经济性可见之前，业务仍依赖昂贵的迭代循环。外部怀疑者的方向也一致：人形机器人需求大体仍是假设，AI
              稳健性还没达到市场级可靠性，安全和电池约束仍是门槛。实际来看，头部风险集中在五类：出口管制和算力风险、中国监管和备案风险、产品安全和缺陷责任、商业化和资本依赖，以及集中伙伴或关键人执行风险。因此，本章只在尽调能把公司声称的规模信号转化为合规、可靠性、客户广度和资本效率证据时，才把
              GigaAI 视为可投资对象。
