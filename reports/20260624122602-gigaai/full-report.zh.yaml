companyProfile:
  summary: >-
    GigaAI 是一家未上市的北京具身 AI 公司，由黄冠于 2023 年创立。公司把自己定位为全栈物理 AGI
    平台，组合了世界生成与世界行动模型（GigaWorld、GigaBrain、DriveDreamer）、数据采集硬件以及自研机器人，面向工业和家庭场景。公开报道显示融资节奏罕见：2026 年 3 月 Pre-B 轮约 CNY1B，4
    月 B1 轮近 CNY1.5B，6 月 B2 轮 CNY1B，估值推升至 CNY10B 以上，也让公司成为中国最新一批具身 AI
    独角兽之一。公开资料在技术和融资里程碑上远多于经营经济性，因此仍应把公司视为高潜力但高度不透明的私营发行人。
  foundedDate: '2023-06-01'
  founders:
