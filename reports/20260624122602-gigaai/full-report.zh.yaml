    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 面向投委会的打分，聚焦对 GigaAI 价格敏感型决策最关键的变量。
    data:
      items:
        - label: 融资能力
          score: 9/10
          note: 三个月内融资 CNY3.5B，给执行留下了真实跑道
        - label: 市场时点
          score: 7/10
          note: 具身 AI 资金充足，但当前终端市场规模仍然有限
        - label: 商业验证
          score: 4/10
          note: 公司已有订单和交付目标，但没有披露收入
        - label: 披露质量
          score: 2/10
          note: 收入、毛利率、积压订单质量和轮次条款仍不透明
        - label: 同行位置
          score: 6/10
          note: 本土融资势头强，但已披露牵引力不及 Unitree，叙事领导力也弱于 Figure
        - label: 估值支撑
          score: 3/10
          note: 当前估值标记需要情景兑现来支撑，而公开材料尚未给出证据
        - label: 整体投委会就绪度
          score: 4/10
          note: 值得持续跟踪；但还不到不计价格入场的阶段
    approximationNotes: 打分是给委员会使用的定性辅助，不是机械模型；重点看估值质量和披露就绪度。
    claimRefs:
      - CV004
      - CV005
