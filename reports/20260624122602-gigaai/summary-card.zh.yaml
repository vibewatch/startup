summary:
  headline: GigaAI 是一家技术野心很强的北京 physical-AGI 公司，2026 年融资通道强，也有可信的早期部署信号；但公开证据还不足以像评估披露更充分的机器人同行那样，有把握地支撑其独角兽估值。
