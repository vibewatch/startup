  topStrengths:
    - 公司讲出的不是单一演示产品，而是一条少见的全栈 physical-AGI 路线，覆盖世界模型、具身基础模型、数据系统和自研机器人。
    - 作为一家 2023 年成立的创业公司，资本通道少见地强：公开报道支持其 2026 年三个月内融资 RMB 3.5 billion，估值超过 RMB 10 billion。
    - 工业和家庭场景已有具名部署证据，包括 FAW Tooling、湖北人形机器人创新中心、Longsheng 1,000 台机器人计划，以及约 100 台 SeeLight S1 订单。
    - 创始人与市场匹配度清楚：Huang Guan 的背景把计算机视觉、自动驾驶、具身 AI 和商业化串在一起。
  topRisks:
    - 公开披露远远落后于估值：已审阅来源没有给出收入、毛利率、ARR、员工数、客户集中度或融资条款透明度。
    - 商业化证据仍弱于融资叙事，因为多数公开证据来自订单、试点和已宣布部署，而不是经审计收入或可重复的生产采用。
    - physical-AI 训练和部署仍依赖稀缺先进芯片与全球基础设施，公司因此暴露在算力、出口管制和地缘政治风险下。
    - 在机器人达到工业级在线率要求前，仿真和世界模型主张还要跨过真实的 sim-to-real、可靠性和安全门槛。
    - 治理和关键人集中度是实质风险：公开叙事由 Huang Guan 和少数可见技术骨干主导，董事会构成仍未披露。
  unresolvedGaps:
    - 已审阅公开材料仍未披露截至 2026 年的收入、毛利率、积压订单、烧钱速度和现金跑道数据。
    - 精确董事会构成、投票控制权、清算优先权，以及 2026 年融资中是否含老股转让，都没有公开。
    - 客户集中度、试点 / 订单向付费量产的转化，以及保修 / 支持经济性仍不清楚。
    - 当前员工数，以及可见创始人科学家核心之外的组织深度，尚未得到公开验证。
    - 关于规模化现场条件下可靠性、安全性和 sim-to-real 表现的独立基准证据仍很少。
