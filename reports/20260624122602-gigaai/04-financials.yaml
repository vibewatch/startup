company:
  name: GigaAI
chapter:
  number: 4
  title: Financials
  summary: GigaAI has a credible multi-lane monetization story across industrial robots, household robots, model services, and driving-simulation infrastructure, but public evidence still points to a financing-first rather than cash-flow-first business. The strongest proof today is recent capital raised plus early orders and deployments; the weakest proof is missing revenue, gross margin, burn, runway, and realized pricing disclosure, which keeps underwriting dependent on future conversion evidence rather than current financial reporting.
sections:
- id: revenue-model-and-pricing-posture
  title: Revenue model and pricing posture
  body: 'GigaAI is not a one-line hardware vendor in the public record. The clearest filing-style and company-linked evidence shows a business scope that can legally support software development, industry application systems, robot manufacturing and sales, equipment leasing, installation and maintenance, data services, and import-export activity. Independent June 2026 coverage then makes the monetization architecture explicit: one lane is foundation-model capability sold to partners through software, API, and licensing; the other is native products that bring the model stack into household and industrial environments through the SeeLight and Maker lines. That matters because the company can, in principle, monetize both a recurring software layer and a capital-equipment layer, plus deployment services around both. What is missing is the realized mix. No reviewed official or independent source disclosed how much revenue, if any, currently comes from model services versus robot hardware. Pricing
    transparency is similarly thin. GigaAI does not publish list prices, a public checkout flow, or standardized plan tiers on its official surface, while media coverage describes orders, pilots, and contracts rather than posted commercial terms. The practical read is a quote-based model: negotiated enterprise selling in industry, early-program household rollout in consumer settings, and likely bespoke commercial terms for model or simulator infrastructure. That posture is normal for industrial robotics, but it sharply limits how much outsiders can infer about realized ASP, discounting, or contribution margin today.'
