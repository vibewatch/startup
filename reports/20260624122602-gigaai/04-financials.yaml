- id: financial-verdict
  title: Financial verdict
  body: 'The investable positive is breadth. GigaAI appears to have more than one monetization option, and the options line up with real public traction: industrial robot deployments, early household demand, foundation-model service rhetoric, and a driving-simulator infrastructure branch that seems to have external customers. The investable negative is opacity. The company still does not publish recognized revenue, gross margin, burn, or cash runway, and public pricing remains either absent, quote-based, or loosely third-party-estimated. That makes the story feel closer to “funding plus field proof” than to “auditable financial scaling.” My financial verdict is therefore cautiously constructive but not underwritten: near-term solvency risk looks lower after the 2026 fundraise, yet financial quality remains impossible to score cleanly until GigaAI discloses how many deployments translate into revenue, what portion of revenue is hardware versus software, what service obligations attach to
    household rollout, and whether gross margin improves or compresses as volume rises. Investors should treat the next round as justified only if the company can show paid conversion from current orders, repeat industrial or simulator contracts, and at least partial visibility into gross margin, cash burn, and support economics.'
