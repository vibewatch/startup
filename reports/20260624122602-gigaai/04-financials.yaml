  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: drivedreamer-contract-value
    missingEvidence: Average contract value, renewal rate, and gross margin for DriveDreamer or other simulator contracts.
    whyItMatters: Software or simulation revenue could be the cleanest margin line in the company, but today it cannot be valued separately from hardware narrative.
    diligencePath: Request top-10 DriveDreamer customer contract summaries, ACV distribution, renewal data, and implementation cost.
    relatedQuestionRefs:
    - QI004
  - type: private-evidence-only
    severity: material
    topic: unit-economics-disclosure
    missingEvidence: Product-line ASP, gross margin, installation cost, service cost, and warranty reserve for Maker and SeeLight.
    whyItMatters: Without line-level unit economics, there is no way to test whether growth improves or worsens value creation.
    diligencePath: Request board or lender deck showing SKU-level pricing, gross margin waterfall, and support burden by product line.
    relatedQuestionRefs:
    - QI014
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current cash balance, monthly burn, and base / downside runway scenarios.
    whyItMatters: Capital adequacy is the core financial diligence question for a company scaling robots and models simultaneously.
    diligencePath: Request current treasury snapshot, monthly cash bridge, and 12-month operating plan with hiring, capex, and deployment assumptions.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: gigaai-debt-and-project-finance
    missingEvidence: Any disclosed debt facilities, project-finance obligations, customer financing arrangements, or covenant packages tied to GigaAI itself.
    whyItMatters: Hidden debt or financing constraints can materially change dilution risk and the practical value of the recent equity rounds.
    diligencePath: Request debt schedule, security agreements, customer financing side letters, and any lender covenant summaries.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI004
