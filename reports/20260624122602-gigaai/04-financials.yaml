- id: TI004
  title: Capital adequacy table
  columns:
  - Metric
  - Value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Recent capital raised
    - RMB3.5B over Mar-Jun 2026
    - High
    - Strongest public solvency support in current file
    - Confirm gross versus net proceeds and any secondary or restricted-use components
  - - Post-financing valuation
    - '> RMB10B'
    - High
    - Frames market appetite but not liquidity
    - Provide cap table, liquidation stack, and any ratchet / preference terms
  - - Cash on hand
    - 'null'
    - High
    - Runway cannot be assessed without current cash
    - Disclose unrestricted cash, restricted cash, and near-term funding obligations
  - - Monthly burn
    - 'null'
    - High
    - Recent fundraising may still be insufficient if deployment and R&D burn are extreme
    - Provide monthly cash burn split between R&D, manufacturing, sales, and support
  - - Runway months
    - 'null'
    - High
    - Runway is the core adequacy test for a company scaling both hardware and models
    - Provide base-case runway under current plan and downside runway under delayed conversion
  - - Planned use of funds
    - Data and algorithm systems, model iteration, and scaled household / industrial deployment
    - High
    - Shows capital is earmarked for continued build-out, not merely balance-sheet repair
    - Disclose budget allocation by model training, manufacturing, GTM, home operations, and working capital
  - - Next-round trigger
    - Should be paid deployment conversion, repeat software contracts, and disclosed margin profile rather than another narrative step-up
    - Medium
    - Future financing quality depends on evidence that orders become cash-efficient revenue
    - Define board-level milestones that would justify the next primary round or debt facility
  notes: The table focuses on forward adequacy, not restating the full historical funding chronology already covered elsewhere. Null means undisclosed in reviewed public sources.
