- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on analysis
  - Exact diligence path
  rows:
  - - Recognized revenue by line
    - Cannot tell whether deployments are converting into cash or which lane deserves software-like multiples
    - Request monthly revenue bridge split across Maker hardware, SeeLight hardware, model services, DriveDreamer, and support
  - - Gross margin by line
    - Impossible to know whether home rollout, industrial installs, or simulator contracts improve or dilute economics
    - Request product-level gross margin waterfall including hardware BOM, field service, freight, and compute
  - - Cash, burn, and runway
    - Capital adequacy remains impressionistic despite the large 2026 raise
    - Request board pack or lender deck with current cash, monthly burn, and runway scenarios
  - - Backlog quality and revenue recognition rules
    - 1,000-unit frameworks and household orders may overstate near-term revenue if milestones are loose
    - Request signed contract summaries with acceptance criteria, cancellation rights, and revenue-recognition policy
  - - DriveDreamer contract value and renewal data
    - Driving infrastructure could be the cleanest recurring revenue stream, but value is hidden
    - Request top-customer ACV, implementation time, gross margin, and renewal / expansion cohorts
  - - Household service cost and incident profile
    - Home robots can destroy margins through servicing, safety, and replacements before scale
    - Request pilot-home cohort data on install time, support tickets, incident rate, and maintenance cost per active unit
  notes: These are the specific blind spots preventing a clean underwriting case today; each row names a concrete document or dataset that would resolve it.
