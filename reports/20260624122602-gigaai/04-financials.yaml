    - Possible robot leasing, installation, maintenance, and field service around hardware placements
    - Per month / site / SLA
    - Filing scope allows leasing and installation, but no direct public evidence of active GigaAI RaaS contracts
    - Low
    - Confirm whether any active customer pays via rental, service subscription, or usage pricing rather than capex purchase
