  rows:
  - - Maker industrial robots
    - Sell or deploy Maker-series robots into factory and logistics workflows, likely with integration and maintenance attached
    - Per robot / project
    - Named deployments plus 1,000-robot Longsheng framework; no disclosed recognized revenue
    - Medium
    - Provide signed PO backlog, realized ASP, acceptance milestones, warranty reserve, and service attach rate
  - - SeeLight household robots
    - Household robot hardware plus possible future support or service plans
    - Per household unit / service package
    - ~100 orders publicly reported; public pilot rollout still precedes verified commercial revenue disclosure
    - Low-Med
    - Disclose deposit terms, paid conversion, installation cost, support burden, and churn / return assumptions
  - - Foundation-model services
    - Software, API, and licensing for partners using GigaBrain / GigaWorld capabilities
    - Per API, license, or enterprise contract
    - Explicitly described in June 2026 coverage, but no public contract value or customer count for this lane
    - Medium
    - Show customer logos, contract ACV, usage-based revenue terms, and renewal structure
  - - DriveDreamer simulation infrastructure
    - World-model simulator / driving infrastructure sold to OEM, Tier 1, or autonomy teams
    - Per enterprise contract / deployment
    - Publicly described as serving 30+ automaker or autonomy customers, but pricing undisclosed
    - Medium
    - Disclose average contract size, term length, deployment scope, and recurring versus project mix
