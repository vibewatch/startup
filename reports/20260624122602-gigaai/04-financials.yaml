- id: capital-adequacy-and-financing-dependency
  title: Capital adequacy and financing dependency
  body: 'Recent financing gives GigaAI room, but not enough disclosure to call the company self-funding. The best-supported public fact is the fundraising burst: about RMB3.5 billion raised across Pre-B, B1, and B2 in March through June 2026, with post-financing valuation above RMB10 billion. Public use-of-funds language is strikingly consistent across Yicai and NCSTI: management plans to keep investing in the data-and-algorithm “dual pyramid,” iterate the physical AGI foundation model, and scale household and industrial deployment. In other words, fresh capital is being allocated to further model development and commercialization build-out, not to a visibly profitable machine already throwing off cash. That is not automatically negative; frontier robotics businesses often need this. But capital adequacy cannot be fully assessed because no reviewed public source disclosed cash on hand, monthly burn, runway months, debt load, customer financing obligations, or project-finance structures.
    Comparable public comps show why that omission matters. ABB’s 2025 integrated report records billion-dollar annual capex and R&D budgets even at mature scale, while UBTECH shows that rapid humanoid revenue growth can still coexist with sizeable operating losses during production ramp. The implication is that GigaAI’s recent capital is a strategic buffer, not proof that the company can finance household rollout, industrial installations, support obligations, and model R&D without another round. The next financing debate should therefore pivot away from headline valuation and toward proof of paid deployment conversion, repeat software revenue, and margin durability.'
