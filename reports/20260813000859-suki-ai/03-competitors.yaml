  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized contract pricing
    missingEvidence: Customer-paid ACV, seat pricing, and implementation services across Suki and key peers.
    whyItMatters: Without realized pricing, comparative ROI and margin quality cannot be assessed from public sources alone.
    diligencePath: Interview customers, request procurement summaries, and gather competitor quotes from recent bake-offs.
    relatedQuestionRefs:
    - QP013
    - QP023
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: renewal and churn outcomes
    missingEvidence: Renewal rates, note-edit burden, and vendor replacement data after first-year deployment.
    whyItMatters: The real moat is renewal behavior, not slideware differentiation. Public sources rarely cover post-go-live persistence.
    diligencePath: Ask reference customers and channel partners for renewal cohorts and displacement anecdotes.
    relatedQuestionRefs:
    - QP015
    - QP016
    relatedTableRefs:
    - TP004
  - type: conflicting-data
    severity: minor
    topic: ordinal feature rankings
