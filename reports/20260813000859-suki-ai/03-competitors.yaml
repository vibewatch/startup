- id: durability
  title: Moat Durability and Adverse Competitive Signals
  body: 'Suki’s moat claims are real but only partly durable. Multi-EHR interoperability, OEM embedding, and a broader workflow roadmap are stronger than the typical point ambient scribe. However, those advantages are only defensible if customers continue to prefer an independent layer over native suites. Capital disparity matters because Abridge and Ambience can invest more in enterprise support, model development, and GTM. Incumbents can pressure price through bundling even if their note quality is merely adequate. Pricing opacity is another adverse signal: public buyers still cannot compare real seat economics or renewal rates across the field, which makes market-share narratives noisier than they appear. The correct underwriting view is that Suki has differentiated routes to market, but not an unassailable moat; success depends on proving that multi-EHR neutrality and partner-friendliness beat bundling over time over multiyear renewals.'
