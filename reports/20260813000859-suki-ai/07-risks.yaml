- id: financial-execution
  title: Financial, Customer, and Execution Risk
  body: 'Financial-model risk is unusually important because public proof is strong on adoption anecdotes but weak on operating quality. No fetched public source discloses ARR, NRR, burn, runway, or debt. That means investors cannot judge whether Suki is scaling efficiently, or simply spending into a hot category. ScaleXP’s 2026 commentary makes that more relevant because private software markets are rewarding visible retention and margin quality rather than narrative alone. At the same time, rapid scope expansion across direct enterprise sales, partner-embedded channels, multiple care settings, a growing workforce, and an expanding executive bench raises execution complexity. Customer concentration is also opaque: the company may have many logos, but the public record does not show where revenue actually concentrates. In short, the company could be operationally strong, but current public evidence does not prove it at the depth required for risk-adjusted underwriting.'
  claimRefs:
  - CR029
  - CR030
