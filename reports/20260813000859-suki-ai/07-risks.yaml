  - - Quality / reliability issue
    - High-profile deployment failure or unacceptable edit burden
    - Marquee customer rollback or stalled expansion
    - Treat as thesis-break risk until resolved
  notes: These triggers are intentionally concrete so diligence can be tied to observable evidence rather than general concern.
