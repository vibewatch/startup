chapter:
  number: 7
  title: Risks
  summary: Suki’s biggest risks are not basic product existence or market relevance, but privacy/consent governance, partner dependency, limited public operating evidence, and the possibility that native EHR or incumbent bundles compress its strategic value. Public mitigations around encryption, clinician review, and HIPAA/SOC 2 posture are real, but they do not yet close the gaps around incident history, renewal quality, or legal/regulatory scoping.
sections:
- id: regulatory-legal
  title: Regulatory and Legal Risk
  body: The single most important legal risk is consent and governance around ambient recording. The American Bar Association frames ambient AI scribes as ePHI-rich systems with privacy and cybersecurity exposure, while 2026 lawsuit coverage shows that improper consent handling can quickly become litigation, not only policy debate. JAMA’s consent research reinforces that this is an active implementation problem in ambulatory care. Suki is not publicly presented as a regulated medical device today, and no fetched source shows FDA clearance for its current product. Even so, FDA guidance still matters as a forward-looking boundary if Suki pushes further into reasoning, decision support, or other higher-stakes clinical functions. The practical risk is therefore less about current device regulation and more about legal process rigor, customer consent workflows, and whether expanding functionality crosses into more heavily scrutinized territory.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR011
  - CR012
  - CR013
  - CR014
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: operational-security
  title: Operational, Quality, and Security Risk
  body: Public mitigations exist, but they are incomplete. Suki claims HIPAA compliance, SOC 2 certification, encryption, anonymized training data, and clinician control over generated content. Those are the right starting controls for an ambient clinical workflow. The problem is that they do not substitute for independent evidence of reliability, incident handling, or quality. The company’s own help documentation shows it has already had to design around EHR downtime and local workflow friction, which means operational resilience matters in daily use. Engineering posts reveal stringent latency and voice-understanding demands, reinforcing that a degraded system can quickly become a clinician-adoption problem. Product-safety risk also rises as the product spans coding, Q&A, and more structured workflow assistance, because the downside of a mistake can move from annoyance into reimbursement or clinical-trust damage.
