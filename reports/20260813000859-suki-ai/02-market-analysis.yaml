company:
  name: Suki AI
chapter:
  number: 2
  title: Market Analysis
  summary: 'Suki AI operates inside the fast-growing ambient clinical intelligence market: a narrower wedge than all healthcare AI, but a broader platform opportunity than a point ambient-scribe product. Third-party estimates place the core clinical-documentation market at roughly $0.8 billion in 2025 growing above $10 billion by 2034, while broader AI-in-clinical-workflow spend already exceeds $2.7 billion in 2025. Adoption is no longer hypothetical: AJMC found 62.6% of Epic hospitals had implemented ambient documentation tools by mid-2025. Demand is driven by charting burden, EHR integration, and CFO-visible ROI, but constrained by privacy, consent, and market-boundary confusion.'
sections:
- id: boundary
  title: Market Boundary and Status-Quo Alternatives
  body: 'Suki’s true market is best defined as ambient clinical intelligence for provider workflows: software that listens to clinical conversations, converts them into structured notes, and increasingly triggers adjacent actions such as coding, summaries, prior-authorization preparation, and care-management handoffs. That definition is wider than legacy speech dictation or point transcription because context, workflow logic, and system integration are part of the value proposition. It is also narrower than “healthcare AI” or “clinical workflow AI,” which include imaging, decision support, analytics, and unrelated administrative automation. Status-quo substitutes remain human scribes, after-hours self-documentation, template-based dictation, EHR macros, and partial speech-recognition tools. The market is therefore defined by the job to be done—reducing documentation friction while preserving data quality—rather than by model architecture alone. As a result, ambient AI should be underwritten
    as an enterprise workflow software category with adjacent expansion options, not as a commodity speech feature.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM010
  - CM025
  - CM027
  - CM028
  tableRefs:
  - TM001
- id: sizing
  title: 'Sizing Lenses: Narrow Documentation Wedge vs Broader Workflow Spend'
  body: 'Market sizing depends heavily on scope. A narrow documentation-only lens from Fortune values the global generative-AI clinical-documentation market at $0.79 billion in 2025 and projects it to exceed $10 billion by 2034. A broader workflow lens from MarketsandMarkets places AI in clinical workflow at $2.78 billion in 2025 and $11.08 billion by 2030. Research and Markets uses a different frame again—clinical conversations—capturing software, services, documentation, telehealth, and multiple end uses. These are not interchangeable numbers. For Suki, the most decision-useful approach is bottom-up: estimate reachable clinician seats inside enterprise provider organizations and EHR channels, then apply realistic annual seat economics. That produces a U.S. TAM in the low single-digit billions rather than a heroic tens-of-billions near-term revenue opportunity. The analytical takeaway is that the category is large enough to support several winners, but scope discipline is required when
    moving from TAM rhetoric to valuation underwriting.'
  claimRefs:
  - CM005
  - CM006
  - CM007
  - CM008
