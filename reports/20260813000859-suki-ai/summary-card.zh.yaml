  topStrengths:
    - Suki 有真实客户证明，包括 ARC 97% 参与度指标，以及可量化的节省时间和编码相关 ROI 证据。
    - 产品不只是简单 scribe，已经覆盖编码、伙伴嵌入和新的护理场景邻近市场。
    - 环境式 AI 品类具备战略意义，并已在 Epic 医院中广泛采用，长期相关性有支撑。
    - 上一轮公开估值锚点约 $500M，比二级市场摘要里常见的 $1B+ 说法扎实得多。
  topRisks:
    - 公开证据仍没有披露 ARR、留存、毛利率、烧钱速度或现金跑道，而这些变量才决定 Suki 是否配得上高端软件倍数。
    - Oracle 与 Epic/Nuance 的捆绑压力可能压住 Suki 倍数，除非其中立层价值主张持续清晰差异化。
    - 重伙伴的 go-to-market 路径能加速覆盖，也会削弱直接客户控制和利润率捕获。
    - 品类拥挤，买家越来越会让供应商正面对比；如果 Suki 不能证明更强耐久性，商品化风险会上升。
  unresolvedGaps:
    - 按细分市场和渠道划分的 ARR、NRR、GRR、流失和队列扩张。
    - 毛利率、烧钱速度、现金跑道以及实施 / 托管成本结构。
