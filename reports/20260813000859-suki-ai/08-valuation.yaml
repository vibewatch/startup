- id: exit-diligence
  title: Exit Readiness, Thesis-Breakers, and Final Diligence Asks
  body: 'Exit optionality exists, but it should not be overstated. Suki sits in a strategic part of healthcare software, has major ecosystem relationships, and could plausibly become relevant to strategic acquirers or, over time, to public-market investors. Yet the gap between being strategically relevant and being exit-ready is disclosure quality. Public-company comparables offer deep filings, transparent financials, and trackable cohort economics; Suki does not. That means the final gating work is obvious and non-negotiable: recurring-revenue quality, retention cohorts, gross margin, burn and runway, top-customer concentration, partner economics, legal structure, and cap-table rights. The thesis also has clear break points. A down-round, a major workflow-partner displacement, weak renewals, or failure of ROI claims to generalize would all materially damage valuation support. Until those issues are closed, investors should preserve price discipline and treat diligence quality as part of
    the valuation itself.'
