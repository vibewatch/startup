- id: multiple-logic
  title: Comparable Logic and Public-Market Reference Bands
  body: 'The right comparable method for Suki is mixed but not arbitrary. The company is not just a note-generation feature, so pure dictation or commodity transcription references would understate its strategic ambition. At the same time, it is not yet entitled to the cleanest premium-software multiple because the public record lacks ARR, NRR, gross margin, and renewal quality. That makes a stacked reference set more appropriate: private SaaS baselines from SaaS Capital; broader healthtech SaaS and AI bands from Healthcare Digital and the healthtech-saas benchmark; and public workflow or vertical-software sanity checks from Doximity, Waystar, and Veeva. Those references produce a wide but useful map. Premium vertical healthcare software can sit around the upper-single-digit revenue-multiple zone, solid healthcare workflows can cluster mid-single digits, and weaker or commoditizing assets can compress far below that. The lesson is not that one comp decides Suki’s worth; it is that proof
    quality determines where in the band Suki belongs.'
