company:
  name: Suki AI
chapter:
  number: 8
  title: Valuation
  summary: Suki’s last well-supported public valuation anchor is about $500 million after a $70 million Series D in 2024, with follow-on Zoom investment bringing total funding to roughly $168 million. The company has enough market, product, and customer proof to stay investable, but not enough public financial disclosure to support a premium up-round or a $1B+ shorthand with confidence. The right stance is track / conditional invest, scenario-based valuation, and explicit diligence asks before price conviction.
sections:
- id: valuation-context
  title: Valuation Context and Reference Mark
  body: 'Suki’s valuation context is more usable than most private healthcare-AI companies, but still much thinner than a public comp set. Multiple independent sources converge on the same basic anchor: a $70 million Series D in October 2024, total funding of roughly $165 million at that point, and a valuation around $500 million. Follow-on reporting around the Zoom Ventures investment raises total funding to about $168 million, but does not establish a later, higher priced round. That matters because the user prompt’s $1B+ shorthand is not the best-supported public baseline. The company does have enough product breadth and customer traction to justify being taken seriously at growth-equity valuation levels. What public evidence does not yet justify is blind acceptance of a materially higher mark without private evidence on revenue quality, retention, and margins. For that reason, valuation should start from the last supported public anchor and then move outward through scenario work rather
    than through headline inflation.'
  claimRefs:
