  - type: private-evidence-only
    severity: material
    topic: Cap table, rights, and governance
    missingEvidence: Entity map, preference stack, option pool, board rights, pro rata, and IP ownership by entity.
    whyItMatters: Entry price alone does not determine return; rights and structure materially change realized outcomes.
    diligencePath: Run legal diligence on the cap table, charters, investor rights, and entity/IP structure.
