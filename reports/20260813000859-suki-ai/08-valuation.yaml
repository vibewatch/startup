- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Recurring revenue quality
    - ARR bridge, NRR, GRR, churn, expansion, cohort trends
    - Determines where in the comp range Suki belongs
    - CFO data room / finance diligence
  - - Unit economics and cash
    - Gross margin, burn, runway, hosting and implementation burden
    - Separates a great product from a great business
    - Finance diligence
  - - Customer durability
    - Top-10 ARR mix, renewal history, channel-sourced revenue, contract duration
    - Shows whether logos convert to resilient revenue
    - Commercial diligence
  - - Partner economics
    - OEM terms, revenue share, control points, API dependency, exclusivity limits
    - Clarifies margin capture and strategic control
    - Business-development / legal diligence
  - - Structure and rights
    - Entity map, IP ownership, cap table, preferences, pro rata, governance rights
    - Determines real entry economics and exit outcomes
    - Legal diligence
  notes: These are the minimum asks required to move from strategic interest to priced conviction.
