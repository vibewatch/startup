- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Why it matters
  - Action implication
  rows:
  - - Down-round or flat financing under stress
    - Would weaken confidence in the last public mark and reveal capital-market skepticism
    - Re-underwrite from the bear case
  - - Major workflow-partner displacement
    - Would cut distribution and weaken moat inside key clinical workflows
    - Reduce valuation ceiling materially
  - - Renewal or concentration weakness in private cohorts
    - Would show that logo breadth is not durable revenue quality
    - Pause or pass unless price resets
  - - ROI claims fail to generalize beyond best public case studies
    - Would weaken willingness-to-pay and premium-multiple logic
    - Move from track to pass unless compensated by price
  notes: Kill triggers focus on events that directly damage revenue durability or the rationale for premium valuation.
