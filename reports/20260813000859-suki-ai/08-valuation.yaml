  evidenceGaps:
  - type: private-evidence-only
    severity: high
    topic: Revenue quality and retention package
    missingEvidence: ARR bridge, NRR, GRR, churn, expansion, cohort retention, and new-vs-existing ARR mix.
    whyItMatters: These variables determine whether Suki deserves a premium AI/software multiple or a more ordinary workflow multiple.
    diligencePath: Request CFO pack with cohort tables and monthly recurring-revenue bridge.
    relatedQuestionRefs:
    - QV006
    - QV008
    - QV016
    - QV019
    - QV025
    - QV028
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: high
    topic: Gross margin, burn, and capital adequacy
    missingEvidence: Gross margin by product, cloud and implementation cost structure, burn, runway, debt, and cash balance.
    whyItMatters: A company can have strategic relevance and still be overvalued if operating leverage is weak or financing need is near-term.
    diligencePath: Request P&L bridge, cash-flow summary, and board-level financing plan.
    relatedQuestionRefs:
    - QV006
    - QV021
    - QV023
    - QV024
    - QV025
    - QV028
    relatedTableRefs:
    - TV001
    - TV003
    - TV006
  - type: private-evidence-only
    severity: high
    topic: Customer durability and partner economics
    missingEvidence: Top-customer concentration, renewal history, channel-sourced ARR share, OEM economics, and termination/control clauses.
    whyItMatters: Public logo breadth does not show who controls revenue, who owns the end customer, or how durable expansion really is.
    diligencePath: Request top-10 ARR list, renewal cohorts, and material partner contract summaries.
    relatedQuestionRefs:
    - QV019
