- id: verdict-blockers
  title: Financial Verdict and Underwriting Blockers
  body: 'The positive financial case for Suki is credible: it has enterprise-style distribution, credible productivity ROI, coding-linked revenue impact, and enough disclosed capital to keep investing. The negative case is equally important: investors still lack the core private metrics that determine whether ambient clinical AI is a great product or a great business. No fetched public source provides ARR, GAAP revenue, net retention, gross margin, implementation burden, cash runway, or debt profile. In a software market where valuation frameworks increasingly reward efficient growth and retention quality instead of narrative alone, that opacity matters. The correct underwriting stance is therefore not to dismiss Suki, but to treat financial diligence as a gating workstream. Any round above the last known valuation reference requires internal revenue cohorts, margin bridges, pipeline conversion, and cap-table detail before price can be defended.'
  claimRefs:
  - CI032
  - CI033
  - CI041
  - CI042
  - CI043
