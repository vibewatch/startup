- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing Private Metric
  - Impact
  - Exact Diligence Path
  rows:
  - - ARR and GAAP revenue
    - Prevents valuation and growth-quality underwriting
    - Request monthly ARR bridge, revenue by quarter, and forecast
  - - Gross margin and services burden
    - Prevents understanding of software quality and scalability
    - Request hosting, support, implementation, and human-review cost split
  - - Net retention / gross retention
    - Prevents testing whether ROI converts into expansion and durability
    - Request logo retention, seat expansion, and cohort renewals
  - - Cash burn and runway
    - Prevents capital-adequacy judgment and next-round timing analysis
    - Request cash flow statement, burn by month, and runway scenarios
  - - Realized pricing and discounts
    - Prevents clean unit-economics and CAC-payback modeling
    - Request ACV distribution, discounts, and services attach rates
  - - Debt and preference overhang
    - Prevents true post-money risk and downside analysis
    - Request debt schedule, liquidation preferences, and option pool detail
  notes: These are not nice-to-have metrics; they are the minimum package required to convert public enthusiasm into investable financial underwriting.
