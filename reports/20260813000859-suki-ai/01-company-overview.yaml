company:
  name: Suki AI
chapter:
  number: 1
  title: Company Overview
  summary: Suki AI is a private Redwood City healthcare AI company founded in 2017 by Punit Soni to reduce clinical administrative burden through ambient clinical intelligence. Public sources show a $70 million Series D announced in October 2024, total disclosed funding of roughly $168 million after a January 2025 Zoom Ventures investment, and an implied valuation of about $500 million rather than the unicorn-level figure often repeated in secondary summaries. The company has broadened from an AI voice assistant into an EHR-integrated platform spanning documentation, coding, developer APIs, and distribution partnerships with athenahealth, MEDITECH, Premier, and Zoom.
sections:
- id: identity-business-model
  title: Identity, Mission, and Business Model
  body: Suki positions itself as an ambient clinical intelligence company rather than a narrow speech-to-text vendor. The public website emphasizes an end-to-end assistant for clinicians that spans pre-visit preparation, ambient documentation during the encounter, post-visit tasks, and coding support. Across the homepage, solutions pages, and clinician product pages, the company consistently frames its value proposition as giving clinicians time back by removing manual charting and administrative burden rather than increasing visit volume through harder productivity targets. That framing matters because it places Suki at the intersection of physician burnout reduction, clinical workflow automation, and revenue-cycle support. The product is marketed across desktop and mobile form factors, supports more than one hundred specialties, and claims support for eighty languages with English note generation. Suki’s business model is best described publicly as enterprise healthcare software sold through
    direct health-system relationships and embedded distribution partnerships, with no evidence of self-serve consumer monetization.
  claimRefs:
  - CO001
  - CO008
  - CO009
  - CO010
  - CO011
