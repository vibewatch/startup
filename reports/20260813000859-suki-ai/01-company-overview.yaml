- id: leadership-governance
  title: Founder, Management Team, and Governance Visibility
  body: 'Founder-CEO Punit Soni remains central to Suki’s identity and external narrative. Third-party trackers tie the company’s 2017 founding to Soni, while the current about page still lists him as founder and CEO. The visible executive bench now includes Joe Chang as CTO, Kevin Wang as chief medical officer, Vikram Khanna as chief revenue officer, Dave Szela as chief growth officer, Aden Fine as general counsel, and two notable 2025 additions: Bryan Morris as CFO and Abhi Pathak as CPO. This supports the view that Suki is attempting to professionalize beyond founder-led early-stage operations and prepare for a larger enterprise go-to-market motion. What remains opaque is governance depth. Public materials do not disclose a detailed board roster, board committees, super-voting rights, ownership concentration, or debt covenants. Investors are listed across press releases and tracker pages, but control rights are not. As a result, key-person dependence on Soni is still meaningful, and governance
    diligence should focus on board composition, investor consent thresholds, and whether strategic investors have any preferential data or commercial rights.'
  claimRefs:
  - CO003
  - CO004
  - CO005
  - CO006
