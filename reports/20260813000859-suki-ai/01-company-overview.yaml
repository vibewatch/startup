- id: adverse-flags
  title: Adverse Checks and Remaining Diligence Flags
  body: The most important adverse flags in a company-level snapshot are not a disclosed Suki-specific scandal, but the risks inherent to the ambient-documentation category combined with limited public financial disclosure. Legal analysis from the American Bar Association underscores that ambient AI scribes create privacy, consent, and cybersecurity exposure because recordings and transcripts are regulated health information. That matters for Suki because its product strategy depends on continual ambient capture across clinician workflows. At the same time, Suki’s public materials do not disclose ARR, gross margin, retention, realized seat pricing, board rights, or debt facilities, leaving investors unable to determine whether the company’s $500 million implied valuation is conservative or already full. Finally, public evidence supports strong EHR partnerships but not a Microsoft relationship, making the company more exposed to Microsoft/Nuance and Epic as competitors than to any clearly
    disclosed strategic alliance with them. Those unknowns are manageable for a growth-stage private company, but they are central diligence asks before underwriting an entry valuation.
