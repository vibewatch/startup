- id: scale-and-milestones
  title: Scale Signals, Distribution Reach, and Operating Momentum
  body: The most concrete public scale signals around Suki come through breadth, distribution, and named deployment milestones rather than disclosed ARR. On breadth, the company advertises support for more than one hundred specialties, eighty languages, and all major EHR families relevant to U.S. enterprise care. On distribution, Premier gives Suki access to a procurement channel spanning more than 4,350 hospitals and health systems, while athenahealth’s preferred-partner designation exposes it to a network of 170,000 providers. On deployment, Suki disclosed more than a dozen MEDITECH health-system implementations in 2024, plus direct customer milestones with Rush and Ascension Saint Thomas. The developer-platform announcement with Bond Vet and the Epic ambient API integration further suggest that Suki is pursuing both direct clinician use and OEM-style embedding into partner workflows. Revelio’s estimate of roughly 426 employees in March 2026 suggests a company that is still scaling, but
    without the workforce footprint of the largest category leaders. Overall, the operating picture is one of credible mid-stage momentum, not hyper-scale dominance.
