company:
  name: Suki AI
chapter:
  number: 6
  title: Customers
  summary: Suki’s public customer proof is strongest in named health-system and partner-embedded deployments that show measurable documentation, adoption, and coding outcomes across multiple care settings. The company appears to be winning both direct enterprise accounts and embedded-platform relationships, but public evidence still falls short on retention, expansion economics, and customer concentration—meaning the topline adoption story is credible while durability remains under-documented.
sections:
- id: segments
  title: Customer Segments, Buyers, and Visible Use Cases
  body: 'Suki’s visible customer footprint is more diverse than a single enterprise-health-system story. Public references span multispecialty groups like Austin Regional Clinic, academic and nonprofit health systems like Rush and Ascension Saint Thomas, partner-embedded EHR channels such as MEDENT and Sevocity, home health and specialty-care workflows through WellSky, telehealth via Zoom Workplace for Clinicians, and even veterinary workflows through Bond Vet. That implies the economic buyer is usually a provider organization or workflow platform, while the end user is the clinician. The breadth is strategically important because it reduces reliance on one care setting, but it also complicates customer analysis: direct customer, embedded-partner customer, and clinician end user are not always the same entity. Investors therefore need to separate channel reach from true paid-account depth.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU022
  - CU023
  - CU024
  - CU026
  - CU029
  - CU030
