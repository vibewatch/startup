- id: TU005
  title: Expansion and Concentration Risk Table
  columns:
  - Expansion Driver
  - Concentration Risk
  - Impact
  - Diligence Path
  rows:
  - - Land-and-expand inside health systems
    - Expansion may be cohort-based rather than contract-wide
    - Could inflate perceived scale before full rollout
    - Review seats purchased versus seats active
  - - Partner-embedded distribution
    - Revenue control may sit with partner more than Suki
    - Can weaken pricing power or visibility
    - Request revenue mix and partner contract terms
  - - Marketplace presence
    - Logos may be mistaken for active paid deployments
    - Can overstate penetration
    - Separate listed channels from paying accounts
  - - Home-health / specialty channels
    - Partner installed base may be confused with Suki direct customer count
    - Can distort TAM and customer-count analysis
    - Request direct usage attributable to Suki layer
  - - Ambient-AI consent scrutiny
    - Customer rollouts may slow or narrow due to privacy review
    - Longer sales cycles and tighter enablement policies
    - Review legal review steps and consent workflow by customer
  - - Large-enterprise account mix
    - Top-customer concentration is undisclosed
    - Could create hidden revenue dependency
    - Request top-10 customers by ARR and renewal status
  notes: The expansion story is plausible, but concentration and control risks remain opaque without private customer and contract data.
