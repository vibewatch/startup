- id: outcomes
  title: Outcome Quality and Production-vs-Pilot Distinctions
  body: Suki’s customer-outcome evidence is unusually strong for a private ambient-AI vendor, but it is still heterogeneous. ARC publishes engagement, documentation-time, and coding-linked outcome data. Rush contributes financial productivity metrics via independent trade coverage. FMOLHS shows pilot behavior, work-life-balance improvement, and a 65% drop in after-hours note completion. The MEDITECH cluster adds site-level proof, including a 50% reduction in note-completion time at St. Mary’s. WellSky and OSPTA extend this into home health and specialty care, while Witham / medent provides an individual clinician-level case study. Even so, not every deployment is at the same maturity stage. Some are clearly enterprise-wide or production-grade, some remain cohort or pilot based, and some embedded channel relationships say more about product distribution than about direct customer retention. That distinction matters for underwriting.
  claimRefs:
  - CU007
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU017
  - CU020
  - CU021
  - CU025
  - CU031
  - CU034
  tableRefs:
  - TU004
- id: durability
  title: Retention, Expansion, and Concentration Visibility
  body: 'The public record supports an expansion narrative more than a retention narrative. Rush moving from trial to enterprise rollout, FMOLHS widening beyond the initial cohort, Ascension broadening from residents to hundreds of clinicians, and MEDENT positioning Suki as a retention-enhancing embedded capability all point toward land-and-expand behavior. However, none of the fetched sources discloses NRR, GRR, churn, contract length, or customer-concentration ratios. This means investors can infer momentum, but not durability. The partner-heavy distribution model also cuts both ways: it can accelerate adoption through MEDITECH, WellSky, Zoom, or Sevocity, yet it may also mask where revenue, control, and end-customer loyalty actually sit. Strong deployment freshness therefore does not eliminate the need for direct renewal and concentration diligence.'
  claimRefs:
  - CU006
  - CU012
