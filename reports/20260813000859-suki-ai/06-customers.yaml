- id: risks
  title: Adoption Headwinds and Remaining Customer Diligence
  body: The largest customer-level risk is not a lack of logos, but uncertainty around durability and governance. Public customer proof is still dominated by company and partner communications, with limited independent review-site evidence or procurement data. Marketplace listings establish availability, not production usage or renewal. Channel-scale numbers such as WellSky’s installed base should also not be mistaken for direct Suki penetration. Finally, the ambient-AI category itself faces privacy and consent scrutiny, which could slow customer decision cycles or constrain how broadly customers enable ambient recording features. The right conclusion is that Suki has meaningful customer traction and unusually current proof into 2026, but investors still need renewal cohorts, segment-level revenue mix, and direct customer references before treating the expansion story as a durable revenue engine.
  claimRefs:
  - CU032
  - CU034
  - CU035
  - CU036
