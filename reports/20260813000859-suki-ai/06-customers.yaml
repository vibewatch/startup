  figureRefs:
  - FU001
- id: adoption-proof
  title: Named Customer Proof and Adoption Trajectory
  body: The strongest public proof of scaled deployment comes from ARC, Rush, the MEDITECH cluster, Ascension Saint Thomas, and partner-powered launches at WellSky. ARC is the cleanest 2026 enterprise data point because it combines scale, engagement, time savings, and coding lift inside a 40-location multispecialty group. Rush provides a useful expansion narrative, moving from a 2024 trial to a 2025 enterprise rollout after demonstrating clinical and financial value. The MEDITECH announcement broadens that picture across more than a dozen health systems with named sites such as St. Mary’s and Decatur County Memorial. Ascension adds resident and 700-plus clinician exposure, while WellSky and Zoom show Suki appearing inside other healthcare products rather than only as a standalone procurement. Taken together, the adoption story looks real, current, and multi-channel.
