              Abridge 和 Ambience
              能在企业支持、模型开发和市场拓展上投入更多。既有厂商即便病历质量只是够用，也能靠捆绑压价。定价不透明是另一个反向信号：公开买方仍无法横向比较真实席位经济性或续约率，市场份额叙事因此比表面更嘈杂。正确的投资研判是，Suki
              有差异化上市路径，但不是不可攻破的护城河；成败取决于它能否在多年续约中证明，多 EHR 中立性和伙伴友好度能长期击败捆绑。
