        title: 可比逻辑与公开市场参考区间
        blocks:
          - type: paragraph
            body: >-
              对 Suki 来说，正确的可比方法是混合的，但不是随意拼凑。公司不只是一个生成病历功能，所以纯听写或商品化转录参考会低估其战略野心。同时，公开记录缺少
              ARR、NRR、毛利率和续约质量，它还拿不到最干净的高端软件倍数。因此，更合适的是堆叠参考组：来自 SaaS Capital 的私营 SaaS 基线；来自 Healthcare Digital 和医疗科技
              SaaS 基准的更宽医疗科技 SaaS 与 AI 区间；以及 Doximity、Waystar 和 Veeva
              等公开工作流或垂直软件的合理性校验。这些参考会形成一个宽但有用的地图。高端垂直医疗软件可以落在高个位数收入倍数区间，稳健医疗工作流可能聚集在中个位数，较弱或商品化资产可能远低于此。结论不是某一个可比对象决定
              Suki 值多少钱；而是证据质量决定 Suki 应落在区间的哪一段。
