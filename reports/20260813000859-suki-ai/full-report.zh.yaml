      - number: '1.3'
        title: 资本形成、估值与投资方基础
        blocks:
          - type: paragraph
            body: >-
              公开证据不支持 Suki 已经是十亿美元公司的常见说法。更有支撑的图景是：2024 年 10 月宣布 $70 million Series D；该轮后累计融资约 $165 million；根据 Reuters
              后续报道和 Sacra 融资档案，隐含估值约 $500 million。公司随后在 2025 年 1 月宣布获得 Zoom Ventures 的战略投资，已披露资本总额升至约 $168
              million。Series D 报道称 Hedosophia 领投，Venrock 和 March Capital 参投；独立追踪页面则保留了 Flare Capital、Breyer Capital 和
              InHealth Ventures 等更早投资方名称。这个资本基础对一家环境式病历记录公司而言相当可观，但明显小于 Abridge 或 Ambience 等当前巨额融资同行。投资研判有两层含义：Suki
              有足够资本和战略背书来维持可信度，但还没有证明自身拥有让品类整合或激进既有厂商竞争变得无关紧要的估值或资本主导地位。
