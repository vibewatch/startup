      - number: '1.5'
        title: 反向核查与剩余尽调红旗
        blocks:
          - type: paragraph
            body: >-
              公司层面快照里，最重要的反向红旗不是已披露的 Suki 专属丑闻，而是环境式文档品类的内在风险叠加有限的公开财务披露。American Bar Association 的法律分析强调，环境式 AI
              记录员会带来隐私、同意和网络安全暴露，因为录音和转录文本属于受监管健康信息。这对 Suki 很重要，因为它的产品策略依赖在临床医生工作流中持续进行环境式采集。同时，Suki 公开材料没有披露
              ARR、毛利率、留存、实际席位价格、董事会权利或债务工具，投资人无法判断 $500 million 隐含估值是保守还是已经打满。最后，公开证据支持强 EHR 伙伴关系，但不支持 Microsoft
              关系，因此公司面对 Microsoft/Nuance 和 Epic 的竞争暴露，高于面对已明确披露的同类战略联盟。这些未知项对成长期私营公司来说可管理，但在为入场估值背书之前，它们是核心尽调问题。
