  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Suki
              的真实市场最适合定义为面向医疗服务提供方工作流的环境式临床智能：软件监听临床对话，把对话转成结构化病历，并越来越多地触发编码、摘要、事前授权准备、照护管理交接等相邻动作。这个定义宽于传统语音听写或点状转录，因为上下文、工作流逻辑和系统集成都是价值主张的一部分。它又窄于“医疗
              AI”或“临床工作流 AI”，后两者还包括影像、决策支持、分析和无关的行政自动化。现状替代品仍然包括人工记录员、下班后自行写病历、模板化听写、EHR
              宏和部分语音识别工具。因此，市场边界由待完成任务决定——在保住数据质量的同时降低文档摩擦——而不是只由模型架构决定。也就是说，环境式 AI
              应按企业工作流软件品类来研判，并带有相邻扩张选项，而不是按商品化语音功能来定价。
