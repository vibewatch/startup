              Suki 的估值背景比多数私营医疗 AI 公司更可用，但仍远薄于公开可比公司组。多个独立来源汇聚到同一个基本锚点：2024 年 10 月 $70 million Series D，当时累计融资约 $165
              million，估值约 $500 million。围绕 Zoom Ventures 投资的后续报道把累计融资提高到约 $168 million，但没有确立更晚、更高定价的新一轮。这很重要，因为用户提示中的
              $1B+
              简写并不是公开证据最支持的基线。公司的产品广度和客户牵引力足以支撑在成长期股权估值层面被认真对待。公开证据尚不能支撑在缺少收入质量、留存和毛利率私有证据的情况下，盲目接受显著更高的估值。因此，估值应从最后一个有支撑的公开锚点出发，再通过情景分析向外展开，而不是靠标题膨胀外推。
