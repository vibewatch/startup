            body: >-
              在纯环境式 AI 公司中，Abridge 是最强的规模基准。它称获得 300 多家医疗系统信任，并据报道在 2025 年完成 $300 million Series E 后估值达到 $5.3
              billion。Ambience 的部署可见度较小，但完成了规模巨大的 $243 million Series C，估值 $1.25 billion，同时从病历生成推向收入完整性和合规。DeepScribe
              看起来更窄、更专科驱动，尤其在肿瘤科，但也有 Ochsner 的 4,700 名临床医生部署等显著临床规模信号。Nabla 正从记笔记转向更宽的智能体工作流框架。放在这个竞争场中，Suki 的约 $500
              million 估值和约 $168 million 已披露融资，让它处在可信但未成规模的中间层，而不是品类资本领导者。
