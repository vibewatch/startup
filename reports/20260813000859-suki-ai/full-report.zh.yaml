        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              公开缓释措施存在，但并不完整。Suki 声称 HIPAA 合规、SOC 2
              认证、加密、匿名化训练数据，以及临床医生控制生成内容。这些是环境式临床工作流应有的起点控制。问题在于，它们不能替代可靠性、事故处理或质量的独立证据。公司自己的帮助文档显示，它已经不得不围绕 EHR
              停机和本地工作流摩擦做设计，这意味着运营韧性影响日常使用。工程文章披露了严格的延迟和语音理解要求，进一步说明系统一旦降级，很快就会变成临床医生采用问题。随着产品覆盖编码、Q&A
              和更结构化的工作流辅助，产品安全风险也会上升，因为错误的下行影响可能从烦恼升级到报销或临床信任损害。
