              是否在高效率扩张，还是只是在热门品类中烧钱。ScaleXP 的 2026
              年评论让这个问题更重要，因为私营软件市场正在奖励可见留存和毛利率质量，而不是单纯叙事。同时，公司快速扩张范围，横跨直接企业销售、伙伴嵌入式渠道、多个照护场景、增长中的员工队伍和扩大的高管梯队，执行复杂度随之上升。客户集中度也不透明：公司可能有许多客户标识，但公开记录没有显示收入实际集中在哪里。简言之，公司可能运营很强，但当前公开证据还没有达到风险调整后投资研判所需的深度。
