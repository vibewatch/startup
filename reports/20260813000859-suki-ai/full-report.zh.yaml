      - number: '8.4'
        title: 情景区间、建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Suki
              没有披露传统收入倍数模型所需输入，与其做伪精确，不如用情景框架。悲观情景假设公司更像一家承压的医疗科技工作流供应商：市场拥挤，留存证据还不完整；在这种情况下，价值可能跌破上一轮公开估值锚点。基准情景承认公司有真实战略价值，商业上也站得住，但在非公开尽调拿出更多证据前，估值应贴近已知公开锚点。乐观情景不能只靠叙事，必须有强得多的证明：一流留存、扎实毛利、广泛
              OEM 变现，以及接近高端垂直软件而非商品化病历记录工具的客户耐久性。由此建议很清楚：Suki 可以进入可投资短名单，但只能作为「观察 /
              有条件投资」标的；只有证据改善或入场价格纪律带来优势时，才值得推进。现有公开证据支持关注，不支持抢投。
