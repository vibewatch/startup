    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与商业模式
        blocks:
          - type: paragraph
            body: >-
              Suki
              把自己定位为环境式临床智能公司，而不是狭义的语音转文字厂商。公开网站强调一个端到端临床医生助手：就诊前准备、诊中环境式记录、就诊后任务和编码支持都在覆盖范围内。无论首页、解决方案页还是临床医生产品页，公司都持续把价值主张写成把时间还给临床医生，靠减少手工写病历和行政负担，而不是用更硬的生产率目标推高接诊量。这一点很重要，因为
              Suki 处在医生职业倦怠缓解、临床工作流自动化和收入周期支持的交叉点。产品覆盖桌面和移动端，支持 100 多个专科，并称支持 80 种语言、生成英文病历。公开信息下，Suki
              的商业模式最适合描述为企业级医疗软件：通过直接医疗系统关系和嵌入式分销伙伴销售，没有自助式消费者变现证据。
