      - number: '1.4'
        title: 规模信号、分销触达与运营动能
        blocks:
          - type: paragraph
            body: >-
              Suki 最具体的公开规模信号来自覆盖广度、分销和具名部署里程碑，而不是已披露 ARR。覆盖广度上，公司宣传支持 100 多个专科、80 种语言，以及美国企业级医疗相关的所有主要 EHR
              家族。分销上，Premier 让 Suki 触达覆盖 4,350 多家医院和医疗系统的采购渠道，athenahealth 的优选伙伴身份则让它进入 170,000 名医疗服务提供者的网络。部署上，Suki 披露
              2024 年有十多家 MEDITECH 医疗系统实施，并有 Rush 和 Ascension Saint Thomas 的直接客户里程碑。与 Bond Vet 的开发者平台公告，以及 Epic 环境式 API
              集成，进一步说明 Suki 同时在推进临床医生直接使用和嵌入合作伙伴工作流的 OEM 式路径。Revelio 估计 2026 年 3 月约有 426
              名员工，说明公司仍在扩张，但还没有最大品类领导者的人力规模。整体看，运营图景是可信的中期动能，而不是超大规模主导。
