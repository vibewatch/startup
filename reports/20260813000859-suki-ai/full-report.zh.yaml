            body: >-
              Suki 的正向财务论点可信：它拥有企业级分销、可信的生产率 ROI、与编码相关的收入影响，以及足够的已披露资本来继续投入。反向论点同样重要：投资人仍缺少判断环境式临床 AI
              究竟是好产品还是好生意的核心私有指标。抓取到的公开来源没有提供 ARR、GAAP
              收入、净留存、毛利率、实施负担、现金跑道或债务轮廓。在一个估值框架越来越奖励高效率增长和留存质量、而不是单纯叙事的软件市场中，这种不透明很关键。正确的投资研判姿态不是否定
