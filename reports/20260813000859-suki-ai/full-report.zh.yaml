              Suki 的可见客户足迹比单一企业级医疗系统故事更多元。公开引用覆盖 Austin Regional Clinic 这样的多专科集团、Rush 和 Ascension Saint Thomas
              这样的学术及非营利医疗系统、MEDENT 和 Sevocity 等合作伙伴嵌入式 EHR 渠道、通过 WellSky 进入居家医疗和专科照护工作流、通过 Zoom Workplace for Clinicians
              进入远程医疗，甚至通过 Bond Vet
              进入兽医工作流。这意味着经济买方通常是医疗服务提供方组织或工作流平台，终端用户则是临床医生。广度具有战略意义，因为它降低了对单一照护场景的依赖，但也让客户分析更复杂：直接客户、嵌入式伙伴客户和临床医生终端用户并不总是同一个实体。因此，投资人需要把渠道触达与真实付费账户深度分开。
