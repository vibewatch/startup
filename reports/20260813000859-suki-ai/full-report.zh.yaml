  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现界面
        blocks:
          - type: paragraph
            body: >-
              Suki 的变现模式像企业级医疗 SaaS，有两个相连界面：面向临床医生的工作流助手，以及让合作伙伴把环境式 AI
              嵌入自有产品的平台层。官方产品页描述了一个覆盖文档、编码和临床推理的端到端助手；开发者平台公告则明确增加了面向 EHR 和其他医疗科技解决方案的 SDK 与 API 能力。Sacra
              的独立分析与这个图景方向一致，称按医疗服务提供者或企业许可收费是核心模式。关键细节在于，公开来源没有清楚展示直接订阅、企业许可和合作伙伴平台安排之间的收入拆分。这意味着收入多元化在战略上看似合理，但当前组合和毛利率轮廓仍需要管理层数据。
