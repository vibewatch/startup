            body: >-
              Suki 的公开信任姿态有意义，但仍不完整。Compose 声明 HIPAA 合规和 SOC 2 认证、传输和静态加密、加密的 HIPAA
              合规云端录音存储、匿名化模型训练数据，以及临床医生对建议内容的明确控制。WellSky
              在伙伴部署中独立强化了人工审核控制。对一款处理敏感医患对话的产品而言，这些都是正向信号。但投资人应把控制声明与运营严谨性的证明分开。抓取到的来源没有提供详细事故历史、正式可用性证据、公开模型评估卡，或比产品页更深入的控制叙事。同时，ABA
