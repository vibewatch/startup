      - number: '2.2'
        title: 规模测算视角：狭义文档切口与更宽工作流支出
        blocks:
          - type: paragraph
            body: >-
              市场规模高度取决于口径。Fortune 的狭义文档视角把全球生成式 AI 临床文档市场估为 2025 年 $0.79 billion，并预计到 2034 年超过 $10
              billion。MarketsandMarkets 的更宽工作流视角把临床工作流中的 AI 估为 2025 年 $2.78 billion、2030 年 $11.08 billion。Research and
              Markets 又使用另一套框架——临床对话——覆盖软件、服务、文档、远程医疗和多种终端用途。这些数字不能互换。对 Suki 来说，最有决策价值的方法是自下而上：估算企业医疗服务提供方组织和 EHR
              渠道内可触达的临床医生席位，再套用现实的年度席位经济性。得到的美国 TAM 更可能是低个位数十亿美元，而不是近期收入机会达到数百亿美元的激进叙事。分析结论是，品类足以容纳多个赢家，但从 TAM
              话术走向估值研判时，必须守住范围纪律。
