      - number: '1.2'
        title: 创始人、管理团队与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始人兼 CEO Punit Soni 仍然是 Suki 身份和外部叙事的核心。第三方追踪网站把公司的 2017 年创立与 Soni 绑定，当前关于页面也仍将他列为创始人兼 CEO。公开可见的高管梯队现在包括
              CTO Joe Chang、首席医疗官 Kevin Wang、首席收入官 Vikram Khanna、首席增长官 Dave Szela、总法律顾问 Aden Fine，以及 2025 年两个重要新增职位：CFO
              Bryan Morris 和 CPO Abhi Pathak。这支持一种判断：Suki
              正在从创始人主导的早期运营，走向更职业化的组织，并为更大规模的企业级市场拓展做准备。治理深度仍不透明。公开材料没有披露详细董事会名单、董事会委员会、超级投票权、所有权集中度或债务契约。新闻稿和追踪页面列出了投资方，但没有列出控制权安排。因此，对
              Soni 的关键人物依赖仍然明显，治理尽调应聚焦董事会构成、投资方同意权门槛，以及战略投资方是否拥有任何优先数据或商业权利。
