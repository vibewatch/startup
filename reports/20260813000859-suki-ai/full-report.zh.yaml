      - number: '8.3'
        title: 投资逻辑、反向逻辑与公开记录真正支持的内容
        blocks:
          - type: paragraph
            body: >-
              正向估值逻辑可信。Suki 有真实客户验证、深度工作流相关性，以及已经延伸到编码、伙伴嵌入式部署、护理和照护管理的平台叙事。如果这些相邻场景能转化为耐久合同收入，它们会让 Suki
              比一家简单的环境式记录初创公司更有价值。反向逻辑同样重要：公开记录仍主要由公司和伙伴筛选后的证明主导，而决定后期定价的核心经济变量仍未披露。Oracle、Epic/Nuance 以及拥挤的环境式 AI
              市场也带来明显天花板压力，买方越来越多地做竞争性评估。因此，公开证据支持战略相关性和上行可选性，但不支持默认给出高端倍数结论。投资人应把 Suki
              理解为证据不完整的严肃候选，而不是价格可以只靠市场热度推断的已验证高端资产。
