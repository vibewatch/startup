      - number: '8.5'
        title: 退出准备度、投资逻辑破坏点与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              退出可选路径存在，但不应夸大。Suki
              位于医疗软件的战略位置，拥有重要生态关系，也可能进入战略收购方视野；时间拉长后，公开市场投资人也可能关注。但战略相关与真正具备退出条件之间，差在披露质量。可比上市公司有披露充分的监管文件、透明财务和可追踪的队列经济；Suki
              没有。因此，最终闸门很清楚，也没有商量空间：经常性收入质量、留存队列、毛利率、烧钱速度和现金跑道、头部客户集中度、合作伙伴经济性、法律结构以及股权结构表权利。投资逻辑也有清晰断点。降价融资、重大工作流合作伙伴流失、续约疲弱，或
              ROI 主张无法普遍成立，都会实质性削弱估值支撑。在这些问题关闭前，投资人应守住价格纪律，并把尽调质量本身视为估值的一部分。
