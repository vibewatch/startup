      - - 私有 SaaS 基线
        - 框架基准
        - 预测私有 SaaS 倍数约 4.8x-5.3x
        - 可作为私有软件定价纪律的有用底线
        - 并非医疗特定，且假设 ARR / NRR 输入已知
      - - 通用医疗科技 / 高端 AI 区间
        - 行业基准
        - 通用医疗科技 SaaS 约 4.0x-6.0x；高端 AI / 数据约 6.0x-8.0x+
        - 最适合 Suki 的广义行业参照
        - 仍然泛化，并非 Suki 特定
      - - Doximity / Waystar
        - 公开市场工作流可比公司
        - 2026 年参考材料中，大致是高个位数到中个位数收入倍数
        - 与临床医生工作流和收入周期经济性相关
        - 业务组合和上市公司成熟度不同
      - - Veeva
        - 高端垂直 SaaS 可比公司
        - 按来源 / 日期不同，EV / 收入约 6.9x 到 9.1x
        - 有用的溢价上限参考
        - 生命科学软件，披露更强且盈利能力已验证
      - - 承压医疗科技队列
        - 下行合理性校验
        - 增长和质量恶化时，收入倍数可能低于 1.5x
        - 有用的悲观情景护栏
        - 商业模式并不直接匹配
    notes: 这些行覆盖本章使用的主要可比视角，而不是列出所有可能的医疗软件可比对象。
    claimRefs:
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Rows capture the main public and benchmark reference points used for this chapter as of 2026-08-13; they are not
        claimed to be every possible comp in healthcare software.
  - id: TV005
    title: 投资逻辑破裂与终止触发因素表
    columns:
      - 触发因素
      - 重要原因
      - 行动含义
    rows:
      - - 承压下降轮或平轮融资
        - 会削弱对上次公开估值的信心，并暴露资本市场疑虑
        - 按悲观情景重新测算
      - - 主要工作流合作伙伴被替代
        - 会削减分发，并削弱关键临床工作流内的护城河
        - 大幅下调估值上限
      - - 私有队列中出现续约或集中度弱点
        - 会表明客户 logo 广度并不等于耐久收入质量
        - 除非价格重置，否则暂停或放弃
      - - ROI 主张无法从最佳公开案例推广
        - 会削弱付费意愿和溢价倍数逻辑
        - 除非价格补偿，否则从观察转为放弃
    notes: 终止触发因素聚焦会直接伤害收入耐久性或溢价估值理由的事件。
    claimRefs:
      - CV021
      - CV027
      - CV028
      - CV029
      - CV045
  - id: TV006
    title: 最终尽调清单表
    columns:
      - 主题
      - 缺失证据
      - 重要原因
      - 负责人或尽调路径
    rows:
      - - 经常性收入质量
        - ARR 桥接、NRR、GRR、流失、扩张、队列趋势
        - 决定 Suki 应落在可比区间的哪个位置
        - CFO 数据室 / 财务尽调
      - - 单位经济性和现金
        - 毛利率、烧钱速度、现金跑道、托管和实施负担
        - 区分好产品和好生意
        - 财务尽调
      - - 客户耐久性
        - Top-10 ARR 结构、续约历史、渠道来源收入、合同期限
        - 显示客户 logo 能否转化为韧性收入
        - 商业尽调
      - - 合作伙伴经济性
        - OEM 条款、收入分成、控制点、API 依赖、排他限制
        - 厘清利润率捕获和战略控制
        - 商务拓展 / 法律尽调
      - - 结构与权利
        - 实体图谱、IP 所有权、股权结构表、优先权、按比例认购权、治理权
        - 决定真实入场经济性和退出结果
        - 法律尽调
    notes: 这些是从战略兴趣走向有定价信念所需的最低证据清单。
    claimRefs:
      - CV012
      - CV020
      - CV029
      - CV031
      - CV044
      - CV046
