      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              环境式 AI 预算落在临床运营、IT 和财务的交叉处。大型医疗系统里，CMIO 和 CIO 常常发起评估，因为产品会改变文档工作流和 EHR 行为；CFO
              的关注度也在上升，因为减少写病历时间、编码支持和缓解职业倦怠都可能创造可衡量经济价值。医生集团中，诊所管理员和医生所有者可能握有预算，因为产品直接影响接诊吞吐、人员配置和医疗服务提供者留存。EHR
              厂商已经成为独立买方类别：athenahealth 选择合作而不是从零自建，MEDITECH 在供应商生态中展示环境式工具，Oracle 则在推广原生临床 AI
              智能体。这意味着采用路径不再只是供应商直销医疗服务提供方；OEM 关系和渠道伙伴现在也是重要上市路径。随着工作流范围变宽，用户也从主治医生延伸到住院医、高级执业医护、照护管理人员和居家医疗临床人员。
