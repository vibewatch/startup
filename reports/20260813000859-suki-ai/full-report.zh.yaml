      - number: '2.5'
        title: 约束、矛盾与尽调注意事项
        blocks:
          - type: paragraph
            body: >-
              快速采用并没有消除真实市场约束。JAMA 同意研究和 American Bar Association 关于就诊音频和转录文本会变成敏感受监管数据的警告说明，隐私和同意已经成为上线设计的一部分。FDA
              指南也设置了另一条边界：一旦工作流软件跨入受监管设备范围，文档和生命周期要求会显著提高。采用也不均衡；AJMC、Emory 和 Nature
              都指出，资源更充足的大型机构采用更强，这意味着社区医疗服务提供方和财务承压医疗服务提供方即使有真实需求，也可能落后。竞争结构很激烈：STAT 追踪到 2024 年近 90
              家医疗系统在试用环境式记录员，Gartner 识别了 50 多个供应商产品，Microsoft 已经把 DAX Copilot 卖给 400 多家组织，Oracle 也在推进原生工作流
              AI。因此，市场有吸引力，但不顺滑。投资人应谨慎对待宽泛 TAM 主张，把真正的平台差异化与 EHR 捆绑分销区分开，并要求提供试点转企业部署和实际定价的硬证据。
