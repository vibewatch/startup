              公告、帮助中心文档和市场列表都指向一家公司围绕真实运营约束交付产品，而不只是营销一个 AI 未来。同时，一些可见路线图语言——例如 MEDITECH 材料中的 AI Dictation
              即将推出——说明并非每项能力都已完全成熟。更重要的是，公开证据仍停在最难的尽调问题之前：跨专科准确率、幻觉率、逐专科表现、规模化可靠性，以及未来是否有任何功能集可能触发设备式监管监督。因此，最好的产品结论是差异化且可信，但生产使用中的独立验证仍然不足。
