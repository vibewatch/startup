      - number: '4.3'
        title: 公开 ROI 信号与单位经济性方向
        blocks:
          - type: paragraph
            body: >-
              Suki 最强的公开财务证据不是已确认收入，而是客户层面的 ROI 证明。多个来源指向生产率和编码提升；如果这些提升能够持续，就能支撑较高付费意愿。Suki 自称病历完成速度快 72%，首年 ROI 达
              9X。Austin Regional Clinic 报告称，文档时间减少 18.5%，每名医疗服务提供者每年与编码相关的改善为 $1,452，已上线临床医生参与率为 97%。Rush
              报告了更高的就诊量、Level 5 编码改善，以及估算的每用户月度收入提升。FMOLHS 和 WellSky
              又补充了采用、下班后负担和文档时间能够显著改善的证据。这些都不能证明净留存率（NRR）或毛利率，但合在一起，支撑的是真实回本故事，而不是只靠 AI 叙事争预算。
