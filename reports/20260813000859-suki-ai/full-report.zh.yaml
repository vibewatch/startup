  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接、既有平台、相邻与替代方案
        blocks:
          - type: paragraph
            body: >-
              Suki 的竞争集合宽于一小串环境式记录厂商。直接同行是 Abridge、Ambience Healthcare、DeepScribe 和 Nabla 等独立环境式文档平台。既有厂商或平台替代方案包括
              Microsoft 旗下 Nuance DAX Copilot、Oracle Health Clinical AI Agent、新兴原生 EHR
              能力、人工记录员和内部自建。替代集合仍然重要，因为买方可以选择劳动力、捆绑方案或自研，而不是购买独立软件。这意味着 Suki 争夺的不只是产品偏好；它还要在 EHR
              生态和采购渠道中争夺分销位置，因为这些渠道能在正面比选开始前就预先塑造供应商选择。
