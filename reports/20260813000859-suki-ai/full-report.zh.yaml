        blocks:
          - type: paragraph
            body: >-
              定价仍是最大的公开数据缺口之一。最强的可见代理指标是 DeepCura 的评测，它引用大约每月 $299
              作为起步价，同时也指出存在企业合同；但抓取到的来源没有披露实际年度合同价值、部署费用或批量折扣行为。这种不透明让市场拓展代理指标更重要。Suki
              的公开商业动作明显由企业带动，Premier、athenahealth 和 MEDITECH 都充当放大器，可能降低获客成本或缩短采购。合作伙伴平台策略还可能把 EHR
              和工作流供应商变成渠道承载方，而不只是集成端点，从而进一步改善分销经济性。即便如此，在附着率和渠道来源订单通过私下数据展示之前，投资人不能假设渠道触达会顺畅转化成高效率收入。
