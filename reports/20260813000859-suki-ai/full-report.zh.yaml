            body: >-
              对 Suki 经济性的最可辩护公开判断是，它应有软件式模型，同时存在真实但可管理的交付开销。Sacra 把业务描述为高固定成本 R&D 和相对低可变成本，这符合语音与 LLM 软件栈。同时，深度 EHR
              集成、客户成功支持、云端音频处理和合作伙伴嵌入，可能带来投资人不能忽视的实施和支持负担。资本上，公司在 Series D 融资 $70 million，随后披露 Zoom 投资后累计融资约 $168
              million，独立报道把参考估值放在接近 $500 million。Revelio 的 426 名员工和 49 个招聘岗位说明 Suki
              仍在投入，并不明显是在收割现金。但公开信息仍没有披露账上现金、烧钱速度、现金跑道或债务，因此资本充足度结论仍然是方向性，而非精确判断。
