      - number: '3.4'
        title: 分销力量、锁定效应与多供应商并行风险
        blocks:
          - type: paragraph
            body: >-
              分销力量越来越决定品类经济性。Nuance 深度嵌入 Epic，以及 Microsoft 的 400 多个 DAX 客户，展示了既有厂商装机基础的优势。Oracle
              的原生智能体也从另一个平台角度强调了同一风险。Suki 用不同的分销论点回应：与多个 EHR 和工作流供应商合作，让它们嵌入
              Suki，避免依赖单一平台。这一策略可以扩大触达，但不能消除续约风险。即使环境式产品深度集成，医疗系统在采购时也可能多供应商并行试点，然后再标准化。如果 Epic 或 Oracle
              以低增量价格捆绑基础文档功能，战场就会从单纯产品质量转向更宽的工作流范围、数据可携带性、渠道控制和专科信任。最终决定渠道广度能否变成持久锁定的，是续约数据，而不是发布公告。
