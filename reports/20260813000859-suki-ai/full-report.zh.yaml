  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              单一最重要的法律风险，是围绕环境式录音的同意和治理。American Bar Association 把环境式 AI 记录员界定为富含 ePHI、带有隐私和网络安全暴露的系统；2026
              年诉讼报道显示，同意处理不当会很快变成诉讼，而不只是政策争论。JAMA 的同意研究进一步说明，这是门诊照护中的活跃实施问题。今天，公开信息并没有把 Suki
              呈现为受监管医疗设备，抓取到的来源也没有显示其当前产品获得 FDA 许可。即便如此，如果 Suki 进一步进入推理、决策支持或其他更高风险临床功能，FDA
              指南仍是前瞻性边界。实际风险因此少在当前设备监管，更多在法律流程严谨度、客户同意工作流，以及功能扩张是否跨入更受审查的领域。
