          label: 最近公开估值约 $500M
          description: 最干净的公开锚点是 2024/2025 年那组融资。
        - id: n3
          label: 缺少 ARR / NRR / 利润率披露
          description: 核心投资测算指标仍未公开。
        - id: n4
          label: 竞争与合作伙伴压力
          description: Oracle、Epic/Nuance 与合作伙伴依赖，压住了自动给溢价的空间。
        - id: n5
          label: 观察 / 有条件投资
          description: 只有守住价格纪律并做更深尽调，才推进。
      edges:
