    missingEvidence: ARR, GAAP revenue, gross margin, and net retention by year.
    whyItMatters: >-
      Without public revenue quality metrics, the company-level snapshot cannot test whether the implied valuation is
      conservative or already full.
    diligencePath: Request historical monthly ARR bridge, GAAP revenue by quarter, and 2026 plan from management or lead investors.
    relatedQuestionRefs:
