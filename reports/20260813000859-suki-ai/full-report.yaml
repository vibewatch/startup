      - number: '8.4'
        title: Scenario Ranges, Recommendation, and Price Discipline
        blocks:
          - type: paragraph
            body: >-
              Because Suki does not disclose the inputs needed for a conventional revenue-multiple model, a scenario
              framework is safer than false precision. The bear case assumes the company behaves more like a pressured
              healthtech workflow vendor operating in a crowded market with incomplete retention proof; in that world,
              value can drift below the last public mark. The base case accepts that the company is strategically real
              and commercially relevant, but keeps valuation close to the known public anchor until private diligence
              proves more. The bull case requires something much stronger than narrative: best-in-class retention,
              strong margins, broad OEM monetization, and customer durability that looks closer to premium vertical
              software than to a commoditizing scribe tool. That logic leads to a clear recommendation. Suki belongs on
              the investable short list, but only as a track / conditional invest name where evidence improvement or
              entry-price discipline creates the edge. Public evidence today supports interest, not urgency.
            claimRefs:
