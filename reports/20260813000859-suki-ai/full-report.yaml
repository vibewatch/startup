      - number: '2.2'
        title: 'Sizing Lenses: Narrow Documentation Wedge vs Broader Workflow Spend'
        blocks:
          - type: paragraph
            body: >-
              Market sizing depends heavily on scope. A narrow documentation-only lens from Fortune values the global
              generative-AI clinical-documentation market at $0.79 billion in 2025 and projects it to exceed $10 billion
              by 2034. A broader workflow lens from MarketsandMarkets places AI in clinical workflow at $2.78 billion in
              2025 and $11.08 billion by 2030. Research and Markets uses a different frame again—clinical
              conversations—capturing software, services, documentation, telehealth, and multiple end uses. These are
              not interchangeable numbers. For Suki, the most decision-useful approach is bottom-up: estimate reachable
              clinician seats inside enterprise provider organizations and EHR channels, then apply realistic annual
              seat economics. That produces a U.S. TAM in the low single-digit billions rather than a heroic
              tens-of-billions near-term revenue opportunity. The analytical takeaway is that the category is large
              enough to support several winners, but scope discipline is required when moving from TAM rhetoric to
              valuation underwriting.
