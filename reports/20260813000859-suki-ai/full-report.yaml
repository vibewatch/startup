      - number: '1.5'
        title: Adverse Checks and Remaining Diligence Flags
        blocks:
          - type: paragraph
            body: >-
              The most important adverse flags in a company-level snapshot are not a disclosed Suki-specific scandal,
              but the risks inherent to the ambient-documentation category combined with limited public financial
              disclosure. Legal analysis from the American Bar Association underscores that ambient AI scribes create
              privacy, consent, and cybersecurity exposure because recordings and transcripts are regulated health
              information. That matters for Suki because its product strategy depends on continual ambient capture
              across clinician workflows. At the same time, Suki’s public materials do not disclose ARR, gross margin,
              retention, realized seat pricing, board rights, or debt facilities, leaving investors unable to determine
              whether the company’s $500 million implied valuation is conservative or already full. Finally, public
              evidence supports strong EHR partnerships but not a Microsoft relationship, making the company more
              exposed to Microsoft/Nuance and Epic as competitors than to any clearly disclosed strategic alliance with
              them. Those unknowns are manageable for a growth-stage private company, but they are central diligence
              asks before underwriting an entry valuation.
            claimRefs:
              - CO015
              - CO016
              - CO035
              - CO036
              - CO037
              - CO038
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >-
              Suki’s true market is best defined as ambient clinical intelligence for provider workflows: software that
              listens to clinical conversations, converts them into structured notes, and increasingly triggers adjacent
              actions such as coding, summaries, prior-authorization preparation, and care-management handoffs. That
              definition is wider than legacy speech dictation or point transcription because context, workflow logic,
              and system integration are part of the value proposition. It is also narrower than “healthcare AI” or
              “clinical workflow AI,” which include imaging, decision support, analytics, and unrelated administrative
              automation. Status-quo substitutes remain human scribes, after-hours self-documentation, template-based
              dictation, EHR macros, and partial speech-recognition tools. The market is therefore defined by the job to
              be done—reducing documentation friction while preserving data quality—rather than by model architecture
              alone. As a result, ambient AI should be underwritten as an enterprise workflow software category with
              adjacent expansion options, not as a commodity speech feature.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM010
              - CM025
              - CM027
              - CM028
