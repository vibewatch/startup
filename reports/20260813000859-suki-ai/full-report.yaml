        title: Pricing Opacity and Sales-Efficiency Proxies
        blocks:
          - type: paragraph
            body: >-
              Pricing remains one of the biggest public-data gaps. The strongest visible proxy is DeepCura’s review,
              which cites roughly $299 per month as a starting point while also noting enterprise contracting, but
              nothing in the fetched source set discloses realized annual contract value, deployment fees, or
              volume-discount behavior. That opacity makes GTM proxies more important. Suki’s public commercial motion
              is clearly enterprise-led, with Premier, athenahealth, and MEDITECH all functioning as force multipliers
              that may lower acquisition cost or shorten procurement. The partner-platform strategy could further
              improve distribution economics by turning EHRs and workflow vendors into channel carriers, not just
              integration endpoints. Still, investors cannot assume channel reach converts cleanly into efficient
