      - number: '3.4'
        title: Distribution Power, Lock-In, and Multi-Homing Risk
        blocks:
          - type: paragraph
            body: >-
              Distribution power increasingly determines category economics. Nuance’s full embedding in Epic and
              Microsoft’s 400-plus DAX customers demonstrate the advantage of incumbent installed base. Oracle’s native
              agent underscores the same risk from another platform. Suki counters with a different distribution thesis:
              partner with multiple EHRs and workflow vendors, let them embed Suki, and avoid depending on a single
              platform. That strategy can widen reach but does not eliminate renewal risk. Even deeply integrated
              ambient products can be multi-homed during procurement because health systems often run simultaneous
              pilots across multiple vendors before standardizing. If Epic or Oracle bundle basic documentation at low
              incremental price, the battlefield shifts from product quality alone to broader workflow scope, data
              portability, channel control, and specialist trust. Renewal data, not launch announcements, will
              ultimately decide whether channel breadth becomes durable lock-in.
            claimRefs:
              - CP016
              - CP017
              - CP018
              - CP020
              - CP021
              - CP022
              - CP023
              - CP029
              - CP030
              - CP033
