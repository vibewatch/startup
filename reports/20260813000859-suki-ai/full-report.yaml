chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Suki positions itself as an ambient clinical intelligence company rather than a narrow speech-to-text
              vendor. The public website emphasizes an end-to-end assistant for clinicians that spans pre-visit
              preparation, ambient documentation during the encounter, post-visit tasks, and coding support. Across the
              homepage, solutions pages, and clinician product pages, the company consistently frames its value
              proposition as giving clinicians time back by removing manual charting and administrative burden rather
              than increasing visit volume through harder productivity targets. That framing matters because it places
              Suki at the intersection of physician burnout reduction, clinical workflow automation, and revenue-cycle
              support. The product is marketed across desktop and mobile form factors, supports more than one hundred
              specialties, and claims support for eighty languages with English note generation. Suki’s business model
              is best described publicly as enterprise healthcare software sold through direct health-system
              relationships and embedded distribution partnerships, with no evidence of self-serve consumer
              monetization.
