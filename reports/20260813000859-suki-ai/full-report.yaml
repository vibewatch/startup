  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              The single most important legal risk is consent and governance around ambient recording. The American Bar
              Association frames ambient AI scribes as ePHI-rich systems with privacy and cybersecurity exposure, while
              2026 lawsuit coverage shows that improper consent handling can quickly become litigation, not only policy
              debate. JAMA’s consent research reinforces that this is an active implementation problem in ambulatory
              care. Suki is not publicly presented as a regulated medical device today, and no fetched source shows FDA
              clearance for its current product. Even so, FDA guidance still matters as a forward-looking boundary if
              Suki pushes further into reasoning, decision support, or other higher-stakes clinical functions. The
              practical risk is therefore less about current device regulation and more about legal process rigor,
              customer consent workflows, and whether expanding functionality crosses into more heavily scrutinized
              territory.
            claimRefs:
