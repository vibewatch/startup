      - number: '2.5'
        title: Constraints, Contradictions, and Diligence Caveats
        blocks:
          - type: paragraph
            body: >-
              Rapid adoption does not remove real market constraints. Privacy and consent are now part of go-live
              design, as shown by the JAMA consent study and the American Bar Association’s warning that encounter audio
              and transcripts become sensitive regulated data. FDA guidance creates another boundary condition: once
              workflow software crosses into regulated device territory, documentation and lifecycle expectations
              increase materially. Adoption is also uneven; AJMC, Emory, and Nature all point to stronger uptake among
              larger, better-resourced institutions, implying that community and financially stressed providers may lag
              even if the need is real. Competitive structure is intense: STAT tracked nearly ninety health systems
              experimenting with ambient scribes in 2024, Gartner identified more than fifty vendor offerings, Microsoft
              had already sold DAX Copilot to more than four hundred organizations, and Oracle is pushing native
              workflow AI. The market is therefore attractive but not frictionless. Investors should treat broad TAM
              claims cautiously, separate true platform differentiation from bundled EHR distribution, and request hard
              evidence on pilot-to-enterprise conversion and realized pricing.
            claimRefs:
              - CM017
              - CM024
              - CM029
