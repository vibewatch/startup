      - number: '7.5'
        title: Mitigations, Monitorable Triggers, and Thesis-Breakers
        blocks:
          - type: paragraph
            body: >-
              The public mitigation picture is mixed. On the positive side, Suki has visible data-handling controls,
              human review gates, and multiple channel proofs that the product can run in production environments. On
              the negative side, the most important risks still lack public closure: consent governance, independent
              quality benchmarks, incident history, partner-control economics, and renewal durability. The best
              monitorable triggers are therefore operational and external rather than purely narrative. A meaningful
              consent-related legal action, the loss of a major EHR or platform partner, a clear bundling defeat inside
              Epic or Oracle ecosystems, a down-priced financing event, or a material deployment failure at a marquee
              customer would each have direct transmission into revenue, moat, and valuation. Those are the right risks
              to diligences against before price discipline softens.
            claimRefs:
