      - number: '7.2'
        title: Operational, Quality, and Security Risk
        blocks:
          - type: paragraph
            body: >-
              Public mitigations exist, but they are incomplete. Suki claims HIPAA compliance, SOC 2 certification,
              encryption, anonymized training data, and clinician control over generated content. Those are the right
              starting controls for an ambient clinical workflow. The problem is that they do not substitute for
              independent evidence of reliability, incident handling, or quality. The company’s own help documentation
              shows it has already had to design around EHR downtime and local workflow friction, which means
              operational resilience matters in daily use. Engineering posts reveal stringent latency and
              voice-understanding demands, reinforcing that a degraded system can quickly become a clinician-adoption
              problem. Product-safety risk also rises as the product spans coding, Q&A, and more structured workflow
              assistance, because the downside of a mistake can move from annoyance into reimbursement or clinical-trust
              damage.
