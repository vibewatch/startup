      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Ambient-AI budgets sit at the intersection of clinical operations, IT, and finance. In large health
              systems, CMIOs and CIOs often sponsor evaluation because the product changes documentation workflows and
              EHR behavior, but CFOs increasingly care because reduced charting time, coding support, and burnout
              mitigation can create measurable economic value. In physician groups, practice administrators and
              physician owners can be the budget holders because the product directly affects throughput, staffing, and
              provider retention. EHR vendors have emerged as a separate buyer class: athenahealth partnered rather than
              building from scratch, MEDITECH is surfacing ambient tooling in its vendor ecosystem, and Oracle is
              promoting a native clinical AI agent. That means the adoption path is no longer just direct
              vendor-to-provider selling; OEM relationships and channel partnerships are now material routes to market.
              Users extend beyond attending physicians to residents, advanced practice providers, care managers, and
              home-health clinicians as the workflow scope broadens.
