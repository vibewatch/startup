      - number: '3.2'
        title: Direct Peer Profiles and Relative Scale
        blocks:
          - type: paragraph
            body: >-
              Among pure-play ambient AI companies, Abridge is the strongest scale benchmark. It claims trust from more
              than 300 health systems and was reported at a $5.3 billion valuation after a $300 million Series E in
              2025. Ambience is smaller in deployment visibility but raised a huge $243 million series C at a $1.25
              billion valuation while pushing beyond note generation into revenue integrity and compliance. DeepScribe
              appears narrower and more specialty-led, especially in oncology, but it has notable clinical scale signals
              such as Ochsner’s 4,700-clinician deployment. Nabla is moving from note-taking into a broader agentic
              workflow frame. Against that field, Suki’s ~$500 million valuation and ~$168 million disclosed funding
              place it in the credible but subscale middle tier rather than the category’s capital leader.
