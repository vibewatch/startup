      - number: '4.4'
        title: Cost Structure, Capital Adequacy, and Cash-Need Proxies
        blocks:
          - type: paragraph
            body: >-
              The most defensible public view of Suki’s economics is that it should have a software-like model with real
              but manageable delivery overhead. Sacra frames the business as high fixed-cost R&D and relatively low
              variable cost, which fits a voice-and-LLM software stack. At the same time, deep EHR integrations,
              customer-success support, cloud audio handling, and partner embedding likely create implementation and
              support burdens that investors should not ignore. On capital, the company raised $70 million in Series D,
              then disclosed roughly $168 million total funding after Zoom’s investment, with independent reporting
              putting the reference valuation near $500 million. Revelio’s 426 employees and 49 job postings suggest
              Suki is still investing, not obviously harvesting cash. But there is still no public disclosure of cash on
              hand, burn, runway, or debt, so the capital-adequacy verdict remains directional rather than precise.
