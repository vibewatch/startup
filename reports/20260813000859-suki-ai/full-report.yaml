        title: Partner, Platform, and Competitive Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              Suki’s route to market is also one of its core risks. The company benefits from distribution and workflow
              leverage through MEDITECH, athenahealth, Zoom, WellSky, and other embedded channels, but each partner also
              becomes a point of dependency. If a partner changes API rules, slows commercial support, or launches its
              own feature set, Suki can lose workflow depth, distribution priority, or pricing leverage. That threat
              becomes more acute when native or incumbent offerings from Oracle and Nuance/Epic are bundled directly
              into the dominant workflow environment. In that world, Suki’s neutral-layer value proposition must beat
              convenience and default positioning, not just raw feature quality. The consequence is that partner success
              alone is not sufficient; what matters is whether Suki keeps enough control over customer outcomes,
