        title: Public ROI Signals and Unit-Economics Direction
        blocks:
          - type: paragraph
            body: >-
              Suki’s strongest public financial evidence is not booked revenue but customer-level ROI proof. Multiple
              sources point to productivity and coding lift that, if persistent, could support high willingness to pay.
              Suki itself claims 72% faster note completion and 9X first-year ROI. Austin Regional Clinic reported an
              18.5% reduction in documentation time, a $1,452 annual coding-related improvement per provider, and a 97%
              engagement rate among onboarded clinicians. Rush reported higher encounter volumes, improved Level 5
              coding, and estimated monthly revenue uplift per user. FMOLHS and WellSky add evidence that adoption,
              after-hours burden, and documentation time can move materially. None of these prove net retention or gross
