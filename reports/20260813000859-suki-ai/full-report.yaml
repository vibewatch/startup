  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Surfaces
        blocks:
          - type: paragraph
            body: >-
              Suki’s monetization model looks like enterprise healthcare SaaS with two connected surfaces: a
              clinician-facing workflow assistant and a platform layer for partners that want to embed ambient AI into
              their own products. Official product pages describe an end-to-end assistant spanning documentation,
              coding, and clinical reasoning, while the developer-platform announcement explicitly adds SDK and API
              capabilities for EHRs and other health-tech solutions. Independent analysis from Sacra is directionally
              consistent with that picture, describing per-provider or enterprise license fees as the core model. The
              important nuance is that public sources do not show a clean revenue split between direct subscriptions,
              enterprise licenses, and partner-platform arrangements. That means revenue diversity looks strategically
              plausible, but its current mix and margin profile still require management data.
