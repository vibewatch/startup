  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Direct, Incumbent, Adjacent, and Substitute Alternatives'
        blocks:
          - type: paragraph
            body: >-
              The competitive set for Suki is broader than a short list of ambient-scribe vendors. Direct peers are
              independent ambient-documentation platforms such as Abridge, Ambience Healthcare, DeepScribe, and Nabla.
              Incumbent or platform alternatives include Nuance DAX Copilot within Microsoft, Oracle Health Clinical AI
              Agent, emerging native EHR capabilities, human scribes, and internal build efforts. The substitute set
              still matters because buyers can choose labor, bundling, or proprietary development instead of independent
              software. This means Suki is not only fighting for product preference; it is also fighting for
              distribution position inside EHR ecosystems and procurement channels that can pre-shape vendor selection
              before a head-to-head bake-off even begins.
