      - number: '8.3'
        title: Thesis, Anti-Thesis, and What the Public Record Actually Supports
        blocks:
          - type: paragraph
            body: >-
              The positive valuation thesis is credible. Suki has real customer proof, deep workflow relevance, and a
              platform narrative that now extends into coding, partner-embedded deployments, nursing, and care
              management. Those adjacencies make it more valuable than a simple ambient-scribe startup if they convert
              into durable contracted revenue. The anti-thesis is equally important: the public record is still
              dominated by curated company and partner proof, while the core economic variables that determine
              late-stage pricing remain undisclosed. There is also meaningful ceiling pressure from Oracle, Epic/Nuance,
              and a crowded ambient-AI market where buyers increasingly run competitive evaluations. Public evidence
              therefore supports strategic relevance and upside optionality, but not a premium-multiple conclusion by
              default. Investors should interpret Suki as a serious candidate with incomplete evidence—not as a proven
              premium asset whose price can be inferred from market excitement alone.
