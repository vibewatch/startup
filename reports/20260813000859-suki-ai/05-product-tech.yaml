- id: maturity-risks
  title: Maturity Signals, Roadmap Evidence, and Technical Risks
  body: 'The strongest maturity signal is that Suki now shows real product evidence across clinician workflows, partner embedding, and developer-facing technical content. The platform blog, Epic API announcement, help-center docs, and marketplace listings all point to a company shipping around actual operational constraints rather than only marketing an AI future. At the same time, some visible roadmap language—such as AI Dictation coming soon in MEDITECH materials—shows not every capability is fully mature. More importantly, public evidence still stops short of the hardest diligence questions: cross-specialty accuracy, hallucination rates, specialty-by-specialty performance, reliability at scale, and whether any feature set could trigger device-style regulatory oversight in the future. The best product verdict is therefore differentiated and credible, but still short on independent validation in production use.'
