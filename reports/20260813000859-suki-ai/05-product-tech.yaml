- id: deployment
  title: Deployment, Integration, and Operational Workflow Depth
  body: 'Operational depth shows up most clearly in the integration and support surfaces. The Epic ambient API announcement points to an early attempt at native workflow insertion. MEDITECH marketplace pages and help documentation go further, showing Expanse-specific documentation, coding support, dictation into fields, and Chrome-extension workflows. The offline help article is especially useful because it demonstrates operational thinking beyond ideal conditions: Suki can continue an ambient visit, hold the note, and submit it later when the EHR comes back online, with coding edits still available. Partner evidence from WellSky, Zoom, athenahealth, and Oracle shows deployment beyond a single EHR family. This breadth is a strength, but it also means implementation complexity and partner-dependency risk are inherent to the product design.'
  claimRefs:
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
