- id: trust-controls
  title: Trust, Safety, Security, and Compliance Controls
  body: 'Suki’s public trust posture is meaningful but still incomplete. Compose states HIPAA compliance and SOC 2 certification, encryption in transit and at rest, encrypted HIPAA-compliant cloud recording storage, anonymized model-training data, and explicit clinician control over suggested content. WellSky independently reinforces the human-review control in a partner deployment. These are positive signals, especially for a product handling sensitive clinician-patient conversations. But investors should separate control statements from proof of operating rigor. The fetched source set does not provide a detailed incident history, formal uptime evidence, a public model-evaluation card, or a deeper control narrative beyond the product page. At the same time, the ABA’s privacy analysis underscores why this gap matters: ambient AI products create ePHI-rich audio and transcript surfaces that raise consent, privacy, and cybersecurity exposure.'
  claimRefs:
  - CE020
  - CE021
  - CE022
  - CE023
  - CE024
  - CE025
