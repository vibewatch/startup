company:
  name: Suki AI
chapter:
  number: 5
  title: Product & Technology
  summary: 'Suki’s public product posture is broader than a simple ambient scribe: it combines clinician workflow software, coding support, reasoning features, multi-EHR writeback, and a partner platform for embedded ambient AI. Technical evidence from engineering posts and help docs suggests real product depth around voice capture, command understanding, offline workflows, and EHR integration, but independent quality benchmarks, deeper reliability evidence, and formal regulatory scoping remain important diligence gaps.'
sections:
- id: product-scope
  title: Product Scope and Module Map
  body: Suki’s current public product surface is explicitly modular. The clinician-facing product covers pre-visit preparation, ambient documentation, coding support, Q&A, patient summaries, and post-visit tasks. The broader solutions page adds assisted revenue cycle and clinical reasoning as named solution families, while Suki Compose positions a more flexible ambient documentation and ICD-10 coding experience for workflows that may not be as deeply embedded inside a specific EHR. This matters because it shows Suki moving from a single use case into a workflow layer with multiple monetizable jobs to be done. It also means product diligence should focus not only on note quality, but on whether these adjacent modules are genuinely production-ready or still mostly market-facing expansion stories.
  claimRefs:
  - CE001
  - CE002
  - CE006
  - CE007
  - CE031
  - CE042
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: architecture
  title: Workflow and Technical Architecture
  body: 'The public architecture story is specific enough to be credible. Suki says it accesses EHR data in real time, generates notes, and writes them back without copy-paste, which implies a deeper workflow relationship than ambient transcription alone. The SDK and API materials add a second architectural route: embed Suki capabilities inside partner products instead of routing all usage through a standalone Suki interface. Engineering posts reinforce that this stack includes distinct subsystems for browser audio transport, intent classification, slot filling, and voice-agent orchestration. The command-understanding post even makes sub-300ms latency a public design target. Together, these sources support a view of Suki as a layered voice-and-workflow platform rather than a thin wrapper around a generic model endpoint.'
  claimRefs:
  - CE008
  - CE009
  - CE010
  - CE016
  - CE017
