      detail: Desktop app, mobile iOS and Android surfaces, Chrome extension, and partner-embedded interfaces provide the clinician or operator entry point.
    - label: Layer 2 — Workflow functions
      detail: Ambient documentation, voice commands, coding support, clinical Q&A, summaries, and post-visit workflows form the visible application behavior.
    - label: Layer 3 — Core intelligence
      detail: Audio capture, intent classification, note generation, and clinical-context handling transform voice and chart context into usable outputs.
    - label: Layer 4 — System integration
      detail: EHR read and writeback, SDKs, APIs, and marketplace-driven partner integrations connect Suki to production healthcare workflows.
    - label: Layer 5 — Trust controls
      detail: Encryption, HIPAA and SOC 2 claims, anonymized training-data policy, and clinician review control act as cross-cutting safeguards.
