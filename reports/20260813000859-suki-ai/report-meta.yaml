companyProfile:
  summary: >-
    Suki AI is a Redwood City healthcare AI company founded in 2017 by Punit Soni. Public evidence
    shows a clinician-facing ambient documentation and coding product that has expanded into a
    broader platform spanning partner-embedded workflows, revenue-cycle support, nursing, and care
    management adjacencies.
  foundedDate: '2017-01-01'
  founders:
    - name: Punit Soni
      role: Founder and CEO
      background: Public founder-operator and primary external face of Suki since launch.
      claimRefs: [CO003, CO004]
  foundingLocation: Redwood City, California, United States
  headquarters: Redwood City, California, United States
  productSummary: >-
    Suki sells ambient clinical documentation, coding support, clinical Q&A, and related workflow
    automation for clinicians, while also offering SDK/API-style partner embedding and OEM motion.
  customerFocus: >-
    Health systems, multispecialty groups, clinicians, and partner platforms such as EHRs,
    telehealth vendors, and specialty-care workflow providers.
  businessModel: >-
    Enterprise healthcare software sold through direct deployments and partner-embedded channels,
    with monetization likely tied to clinician seats, enterprise contracts, and platform/OEM
    relationships.
  stage: Private growth-stage healthcare AI platform
  fundingStatus: >-
    Public sources support a $70M Series D in October 2024, roughly $165M total funding after that
    round, and roughly $168M after the January 2025 Zoom Ventures investment, with a best-supported
    valuation anchor around $500M.
  disclosureProfile: private-undisclosed
  claimRefs: [CO002, CO003, CE002, CE004, CV002, CV003, CV006]
summary:
  headline: >-
    Suki has enough product, customer, and market evidence to remain investable in principle, but
    current public disclosure still supports research-more rather than a premium-price conviction
    call.
  overallScore: 6.6
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: fair
  keyMetrics:
    valuationUsdM: 500
    revenueRunRateUsdM: null
    arrUsdM: null
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 168
    customerCount: null
    headcount: 426
  topStrengths:
    - >-
      Suki has real customer proof, including ARC’s 97% engagement marker and measurable time- and
      coding-related ROI evidence.
    - >-
      The product is broader than a simple scribe and now spans coding, partner embedding, and new
      care-setting adjacencies.
    - >-
      The ambient-AI category is strategically meaningful and already widely adopted across Epic
      hospitals, supporting long-term relevance.
    - >-
      The last public valuation anchor around $500M is materially more grounded than the $1B+
      shorthand often repeated in secondary summaries.
  topRisks:
    - >-
      Public evidence still does not disclose ARR, retention, gross margin, burn, or runway, which
      are the variables that actually determine whether Suki deserves a premium software multiple.
    - >-
      Oracle and Epic/Nuance bundling pressure can cap Suki’s multiple unless its neutral-layer
      value proposition stays clearly differentiated.
    - >-
      The partner-heavy route to market can accelerate reach while also weakening direct customer
      control and margin capture.
    - >-
      The category is crowded and buyers increasingly compare vendors head-to-head, raising the risk
      of commoditization if Suki cannot prove superior durability.
  unresolvedGaps:
    - ARR, NRR, GRR, churn, and cohort expansion by segment and channel.
    - Gross margin, burn, runway, and implementation/hosting cost structure.
    - Top-customer concentration, renewal history, and partner contract economics.
    - Entity map, IP ownership, cap-table rights, and investor preferences.
disclaimer: >-
  This report is an AI-assisted diligence summary based on publicly available information as of
