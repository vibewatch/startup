  topStrengths:
    - >-
      Suki has real customer proof, including ARC’s 97% engagement marker and measurable time- and coding-related ROI
      evidence.
    - >-
      The product is broader than a simple scribe and now spans coding, partner embedding, and new care-setting
      adjacencies.
    - >-
      The ambient-AI category is strategically meaningful and already widely adopted across Epic hospitals, supporting
      long-term relevance.
    - >-
      The last public valuation anchor around $500M is materially more grounded than the $1B+ shorthand often repeated
      in secondary summaries.
  topRisks:
    - >-
      Public evidence still does not disclose ARR, retention, gross margin, burn, or runway, which are the variables
      that actually determine whether Suki deserves a premium software multiple.
    - >-
      Oracle and Epic/Nuance bundling pressure can cap Suki’s multiple unless its neutral-layer value proposition stays
      clearly differentiated.
    - >-
      The partner-heavy route to market can accelerate reach while also weakening direct customer control and margin
      capture.
    - >-
      The category is crowded and buyers increasingly compare vendors head-to-head, raising the risk of commoditization
      if Suki cannot prove superior durability.
  unresolvedGaps:
    - ARR, NRR, GRR, churn, and cohort expansion by segment and channel.
    - Gross margin, burn, runway, and implementation/hosting cost structure.
    - Top-customer concentration, renewal history, and partner contract economics.
    - Entity map, IP ownership, cap-table rights, and investor preferences.
