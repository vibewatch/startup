- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Residual security is not transferable or is deeply subordinated
    - Counsel review shows little or no economic claim for outside holders
    - Turns the opportunity into a legal stub rather than an investable asset
    - Immediate avoid
  - - Enterprise retention breaks
    - Material churn or negative NRR on the surviving Windsurf customer base
    - Bull and base cases lose their revenue denominator
    - Mark to bear range
  - - Pricing war accelerates
    - Seat or usage prices reset down without a matching cost offset
    - Premium multiple support compresses toward public comp bands
    - Reduce value range and widen discount
  - - Integrated product motion stalls
    - No visible cross-sell, no retention proof, or no roadmap coherence inside Cognition
    - Strategic premium stops being repeatable
    - Treat 2025 prints as one-off event values
  - - People or IP shock emerges
    - Further attrition, legal dispute, or evidence that licensed IP cannot be commercialized cleanly
    - Execution and legal overhang rise at once
    - Suspend underwriting until resolved
  notes: Kill triggers are framed as observable events so the recommendation can be revisited without relying on narrative momentum.
  claimRefs:
