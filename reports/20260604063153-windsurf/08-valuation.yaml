tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Evidence base
  - Decision implication
  rows:
  - - Recommendation
    - Avoid standalone Windsurf entry
    - Strategic demand was real, but public evidence no longer shows a clean independent equity security
    - Do not underwrite a fresh venture-style position today
  - - Confidence
    - Medium
    - Transaction facts are well corroborated, but economics across stakeholders remain opaque
    - Use ranges and legal diligence instead of point-estimate underwriting
  - - Risk rating
    - High
    - Ownership split, undocumented waterfall, and post-deal execution risk can drive severe impairment
    - Assume downside can approach full loss for any residual claim
  - - Valuation stance
    - Expensive / unavailable as clean entry
    - Synthetic 29x–37x strategic references exceed Cursor and most public devtools comp bands
    - Require a major discount and explicit rights before re-opening
  - - Re-open condition
    - Transferable security at or below roughly $1.0B look-through value
    - Would align entry closer to the base-case range and partially compensate for opacity
    - Only then move from avoid to diligence-heavy re-evaluation
  notes: Decision table reflects standalone Windsurf only; it does not underwrite a separate investment in combined Cognition.
