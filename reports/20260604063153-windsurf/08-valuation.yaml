- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current cap table and waterfall
    - Security classes, preferences, participation rights, option treatment
    - Defines whether any surviving equity is still meaningful
    - Counsel-certified cap table plus waterfall model
  - - Google agreement allocation
    - Cash to corporate entity versus employee compensation versus license value
    - Determines how much of the $2.4B was really monetizable by investors
    - Request executed agreement or board memo
  - - Cognition purchase agreement
    - Headline consideration, escrow, holdbacks, and class-by-class allocation
    - Needed to know what the remainder sale was worth
    - Obtain signed SPA or merger agreement
  - - Customer retention bridge
    - ARR and account retention for pre-deal Windsurf cohorts inside Cognition
    - Tests whether the $82M base actually survived economically
    - Request cohort, NRR, and top-20 account status
  - - Post-deal employee retention
    - Org chart, attrition by function, and sales-coverage continuity
    - Checks whether the acquired asset can still execute
    - HR and operating review with management
  - - Secondary security availability
    - Whether any transferable standalone or residual claim can still be bought
    - Without a security there is no entry, regardless of intrinsic value
    - Confirm with counsel, broker, and company finance contacts
  notes: These asks are prerequisites for revisiting the avoid call; they are not optional follow-ups.
