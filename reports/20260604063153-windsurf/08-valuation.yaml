- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Valuation / multiple
  - Relevance
  - Limitation
  rows:
  - - Windsurf Series C (Aug 2024)
    - Last clean private round
    - $1.25B headline / ~15.2x on later $82M ARR
    - Last undisputed standalone equity benchmark
    - Uses a later ARR denominator for directional comparison
  - - Reported OpenAI interest (Jul 2025)
    - Failed strategic bid
    - ~$3.0B / ~36.6x on $82M ARR
    - Shows how strategic control interest priced scarcity
    - Bid expired and never closed
  - - Google reverse-acquihire / license (Jul 2025)
    - Talent plus non-exclusive license
    - ~$2.4B / ~29.3x on $82M ARR
    - Proves the founders and technology had enormous strategic value
    - Not a whole-company equity acquisition
  - - Cursor (Jun 2025)
    - Private AI-coding round
    - $9.9B / >$500M ARR / ~19.8x
    - Closest intact private AI-coding comp
    - Much larger revenue base and intact control
  - - Combined Cognition (Sep 2025 vs May 2026 ARR est.)
    - Post-acquisition platform
    - $10.2B / ~$492M ARR est. / ~20.7x
    - Shows the multiple band for an integrated platform after buying Windsurf
    - Not a Windsurf-alone value and uses an analyst ARR estimate
  - - GitLab (Jun 2026)
    - Public DevSecOps comp
    - $5.22B market cap / $759.2M FY2025 revenue / ~6.9x
    - Public-market lower band for a scaled developer platform
    - Slower growth and public-market discipline
  - - JFrog (Jun 2026)
    - Public developer-tools comp
    - $10.15B market cap / $428.5M FY2024 revenue / ~23.7x
    - Upper public band for a high-quality devtools asset
    - Not AI-native and margin profile differs
  notes: Synthetic Windsurf multiples divide headline transaction values by Cognition’s disclosed $82M ARR to keep the comparison frame consistent; table is curated rather than exhaustive.
