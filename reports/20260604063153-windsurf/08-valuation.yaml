- id: diligence-and-kill-triggers
  title: Diligence Priorities and Thesis-Break Triggers
  body: 'The diligence agenda is unusually legal and structural for a valuation chapter because ordinary operating work is not enough. The key missing documents are the Google licensing and talent agreement, the Cognition purchase agreement for the remainder, and a current cap table showing which classes participated in each step of the 2025 split transaction. Without those, neither dilution nor preference overhang can be modeled with integrity. Operating diligence still matters: investors need cohort retention for Windsurf’s enterprise accounts inside Cognition, evidence that pricing pressure has not permanently compressed unit economics, and proof that post-acquisition culture disruption has not impaired product velocity or account coverage. The thesis breaks quickly if customer retention is weak, if residual common or preferred holders turn out to have little remaining economic claim, or if the AI-coding price war pushes clearing multiples toward public-comp territory. Conversely, the
    call could improve only if diligence proves a transferable security, transparent rights, and a price at or below roughly the base-case synthetic range. Until then, the right stance is not to wait for better sentiment but to avoid mistaking strategic excitement for an investable standalone equity opportunity.'
