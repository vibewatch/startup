- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Bull-case evidence
  - Anti-thesis evidence
  - What would change the view
  rows:
  - - Asset quality
    - 82M ARR, 350+ enterprise customers, and hundreds of thousands of DAU show real product-market fit
    - Customer retention after the carve-up is not publicly disclosed
    - A post-deal cohort bridge showing enterprise ARR retention
  - - Strategic demand
    - OpenAI, Google, and Cognition all pursued Windsurf within days
    - The three bids targeted different pieces of value, not a clean standalone company
    - Proof that a new investor can buy the same economic exposure
  - - Comparable support
    - Cursor and combined Cognition show intact AI-coding platforms can clear ~20x revenue bands
    - Windsurf is no longer intact or founder-led, so those multiples require a discount
    - Evidence of control, rights, and durable customer ownership
  - - Execution durability
    - Most of the team stayed outside Google long enough for Cognition to buy a functioning business
    - Culture-reset coverage and pricing pressure raise retention and margin risk
    - Verified retention, stable pricing, and healthy post-deal product velocity
  notes: This table separates company quality from investability; Windsurf can score well on the former while still failing the latter.
