  evidenceGaps:
  - type: missing-source
    severity: material
    topic: google-allocation-breakdown
    missingEvidence: Official purchase-accounting or term-sheet detail showing how Google’s $2.4B split across employee compensation, license value, and corporate proceeds.
    whyItMatters: Without a verified allocation, public investors cannot tell how much value reached the corporate entity versus individual employees.
    diligencePath: Request the executed Google agreement or a board-level transaction memo with cash-flow allocation and stakeholder treatment.
    relatedQuestionRefs:
    - QV019
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: blocking
    topic: cognition-purchase-consideration
    missingEvidence: Cognition purchase agreement, headline consideration, escrow terms, and allocation by security class for the remaining Windsurf business.
    whyItMatters: This is the core document required to know whether any surviving minority security still has meaningful economic value.
    diligencePath: Obtain the signed acquisition agreement and accompanying board or counsel summary before any valuation committee discussion.
    relatedQuestionRefs:
    - QV020
    - QV021
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-waterfall
    missingEvidence: Current cap table, option ledger, liquidation preferences, participation features, and any amendments triggered by the 2025 transactions.
    whyItMatters: Return modeling is impossible without knowing who owns the surviving claims and what sits senior to a new investor.
    diligencePath: Request counsel-certified cap table materials and waterfall analysis covering pre-deal and post-deal ownership.
    relatedQuestionRefs:
    - QV021
    - QV026
  - type: missing-source
    severity: material
    topic: customer-retention-after-carve-up
    missingEvidence: A customer bridge showing how much of Windsurf’s pre-deal enterprise ARR and seat base remained active after the Google and Cognition split.
    whyItMatters: Bull and base cases assume the disclosed $82M ARR base survived economically, but public reporting does not confirm that retention.
    diligencePath: Request cohort retention, top-20 account status, and ARR migration data from Cognition or former Windsurf finance leadership.
    relatedQuestionRefs:
    - QV024
