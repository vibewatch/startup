company:
  name: Windsurf
chapter:
  number: 8
  title: Valuation
  summary: Windsurf’s last clean standalone benchmark was the August 2024 $1.25B Series C, but the July 2025 split outcome converted the company into a strategic asset realization rather than a fresh venture financing opportunity. Using Cognition’s disclosed $82M ARR, the headline reference points span roughly 15x to 37x ARR, yet ownership opacity and the lack of a clean standalone security make the disciplined recommendation avoid any independent Windsurf entry absent far deeper diligence and a major discount.
sections:
- id: recommendation-and-entry
  title: Recommendation and Entry Framing
  body: 'From a company-quality standpoint, Windsurf clearly built a valuable asset. The last clean benchmark was the August 2024 Series C at $1.25B, and the later July 2025 process showed even stronger strategic demand: OpenAI’s reported $3B offer lapsed, Google then paid about $2.4B to hire the founders and some researchers while licensing technology, and Cognition separately signed to buy the remaining product, IP, brand, and business. But those facts cut against a fresh standalone investment thesis. They prove the asset was valuable, not that an outside investor can still buy a coherent independent company. Public evidence shows the founder-led control center moved to Google, the operating remainder moved toward Cognition, and no new standalone financing was disclosed. On a price-sensitive basis the correct recommendation is avoid: the comparable question is not whether Windsurf was good, but whether there is still a clean Windsurf security with understandable rights and a supportable
    entry price. Public evidence does not yet clear that bar.'
  claimRefs:
