- id: transaction-bridge-and-comps
  title: Transaction Bridge and Comparable Context
  body: 'Transaction math reinforces the caution. Using Cognition’s disclosed $82M ARR as a common denominator, the last clean Series C benchmark screens at about 15.2x ARR, the reported OpenAI interest at about 36.6x, and Google’s $2.4B reverse-acquihire and license at about 29.3x. The Google number should not be treated as a normal whole-company valuation because Google neither bought control nor took an equity stake; it bought key talent access and a non-exclusive technology license. Cursor is the closest intact private comparable: TechCrunch reported a $9.9B valuation at more than $500M ARR in June 2025, or about 19.8x ARR. Combined Cognition, by Sacra’s May 2026 ARR estimate and CNBC’s September 2025 valuation round, screens around 20.7x. Public developer-tooling comps are much lower or at least narrower: GitLab’s June 2026 market cap implies roughly 6.9x FY2025 revenue, while JFrog screens near 23.7x FY2024 revenue. Copilot matters strategically, but not as a clean equity comp, because
    GitHub sells it as a bundled product inside a larger platform with individual, business, and enterprise plans. The valuation signal is therefore this: intact platforms can clear premium multiples, but split assets with opaque ownership should trade at a discount, not at the richest strategic prints.'
