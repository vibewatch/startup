- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - What is supportable
  - Why it matters
  - Diligence ask
  rows:
  - - Total capital raised pre-sale
    - ~$243M
    - Supported by Sacra and secondary profiles
    - Defines the last clean standalone funding base
    - Need cap table and cash balances after Series C
  - - Series C
    - $150M at $1.25B valuation
    - Supported as the last clean standalone round
    - Last venture valuation anchor
    - Need use-of-funds memo and remaining cash at signing
  - - Standalone cash on hand at sale
    - Not disclosed
    - No public balance-sheet figure found
    - Cannot calculate clean runway
    - Need month-end cash immediately before July 2025 deals
  - - Standalone monthly burn
    - Not disclosed
    - No direct public burn metric found for Windsurf
    - Cannot test capital intensity as an independent company
    - Need monthly burn by quarter through sale close
  - - Standalone runway months
    - Not disclosed
    - Not computable from public record
    - Key missing solvency metric
    - Need cash plus burn bridge
  - - Debt / project finance obligations
    - None publicly disclosed
    - No debt or project-finance evidence surfaced in reviewed sources
    - Absence of disclosure is not proof of zero debt
    - Need debt schedule, leases, and off-balance-sheet commitments
  - - Google transaction
    - ~$2.4B reverse-acquihire / license
    - Applies to founders, selected researchers, and technology license rather than whole-company purchase
    - Explains why the next financing path ended
    - Need allocation of proceeds by stakeholder class
  - - Cognition acquisition
    - Price undisclosed; product + brand + IP + business acquired
    - Officially included the revenue base and operating business
    - Shifted capital adequacy question to buyer balance sheet
    - Need purchase-price allocation and retention package costs
  - - Cognition post-acquisition round
    - Reported as $400M at $10.2B or nearly $500M at $9.8B
    - Secondary reporting conflicts on exact size and valuation
    - Still indicates strong parent-company funding capacity
    - Need signed financing documents or cap table update
  - - Parent burn disclosure
    - Under $20M net burn since founding before Sept 2025 round
    - Repeated by multiple outlets
    - Suggests ample runway once combined with fresh financing
    - Need post-acquisition burn and integration-spend cadence
  notes: Capital adequacy is split intentionally between the final standalone company and the post-sale owner because the July 2025 transaction sequence changed the relevant solvency question.
