callouts:
- calloutType: insight
  title: 'Revenue quality verdict: real demand, opaque mix'
  body: 'Windsurf clearly built a real business: $82M ARR, 350+ enterprise customers, and a large user base are too much signal to dismiss. The problem is not whether demand existed; it is that the public record does not disclose how much of that ARR was enterprise versus self-serve, how cohort retention behaved, or how much of the base survived the ownership and model-access shock. Treat revenue quality as medium, not pristine.'
  claimRefs:
  - CI007
  - CI010
  - CI036
- calloutType: risk
  title: 'Margin path verdict: repair underway, proof absent'
  body: The pricing sequence from flow-action credits to prompt credits to quotas plus API-priced overages is exactly what a company under inference-cost pressure should try. But it remains evidence of attempted repair, not proof of healthy unit economics. Until management provides contribution margin by tier and model mix, the central financial risk is still gross-margin opacity combined with supplier concentration.
  claimRefs:
  - CI013
  - CI017
  - CI037
  - CI040
