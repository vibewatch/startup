- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Severity
  - Best public proxy used
  - Exact diligence path
  rows:
  - - Self-serve vs enterprise revenue split
    - Prevents clean judgment on ARR quality and channel mix
    - High
    - $82M ARR + 350+ enterprise customers + public pricing ladder
    - Request revenue by segment, cohort, and plan
  - - GAAP revenue / deferred revenue
    - ARR may overstate near-term recognized revenue
    - High
    - ARR only
    - Request audited financials or monthly close package
  - - Gross margin by plan / model
    - Blocks unit-economics underwriting
    - High
    - Sacra negative-margin statement + OpenAI pricing + GitLab comp
    - Request gross margin waterfall by tier and model route
  - - CAC / payback
    - Cannot test PLG efficiency or enterprise sales productivity
    - Medium
    - PLG motion and customer stories only
    - Request fully loaded CAC, payback, and sales-funnel conversion
  - - NRR / churn
    - Cannot measure durability of the acquired ARR base
    - High
    - No durable public proxy
    - Request gross retention, NRR, and churn by segment
  - - ACV / contract term / deployment mix
    - Unknown enterprise revenue quality and implementation burden
    - High
    - 350+ enterprise customers plus pricing tiers
    - Request customer segmentation by ACV, contract length, and hosted vs hybrid
  - - Post-acquisition retention and migration churn
    - Cannot know how much ARR survived model-access disruption and ownership change
    - High
    - Successor surface user and enterprise counts
    - Request customer migration cohorts and retained ARR by month
  - - Standalone cash / burn / debt
    - Prevents clean pre-sale runway analysis
    - Medium
    - Funding history only
    - Request balance sheet, debt schedule, and cash-flow statement immediately before sale
