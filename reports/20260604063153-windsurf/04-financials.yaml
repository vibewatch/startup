- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Free funnel
    - Freemium acquisition
    - User
    - Active but non-revenue; now lives inside Devin Desktop
    - Low direct revenue but high pipeline value
    - Need free MAU, activation, and free-to-paid conversion
  - - Pro self-serve
    - Monthly subscription plus quota
    - $20/mo now; $15/mo in 2025 reset
    - Core individual paid tier across both 2025 and 2026 plans
    - Medium-high recurring but exposed to model-cost variance
    - Need paid seat count, overage attach rate, and churn
  - - Max / power-user self-serve
    - Premium monthly subscription
    - $200/mo in 2026; historically some power users bought add-on packs or used $60 Pro Ultimate
    - New explicit power-user monetization layer
    - Medium recurring, but likely cost-heavy
    - Need Max attach rate and gross margin by power cohort
  - - Teams
    - Per-seat or org package with admin controls
    - $30/user/mo in 2025; $40/user/mo in Mar 2026; successor page now shows $80 base + $40/full dev seat
    - Commercial bridge from PLG into managed org spend
    - High recurring if admin tooling sticks
    - Need team conversion, average seat count, and realized ARPU
  - - Enterprise
    - Contracted seats, deployment, support
    - $60/user/mo in 2025 reset; custom on successor surface
    - 350+ enterprise customers at acquisition; existing billing agreements preserved in 2026 change
    - Very high if contracts renew and expand
    - Need ACV, term length, renewal rate, and deployment mix
  - - Extra usage / add-ons
    - Prompt-credit packs in 2025; API-priced overages in 2026
    - $10/250 credits or $40/1,000 credits in 2025; API pricing in 2026
    - Monetizes heavy premium-model consumption
    - Medium because usage-linked and cost-linked
    - Need share of ARR from overages and passthrough margin
  notes: Table distinguishes funnel, recurring subscriptions, enterprise contracts, and usage-linked monetization; list prices are not realized net revenue.
