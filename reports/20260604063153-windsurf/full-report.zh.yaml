      - number: '3.3'
        title: 切换成本、分发权力与现状 / 内部自建替代品
        blocks:
          - type: paragraph
            body: >-
              分发和切换成本比基准测试截图更能解释这个品类。GitHub 能把 Copilot 卖进既有 GitHub 采购、代码库管理、移动端、CLI 和知识工作流；这让它成为许多团队评估 AI IDE
              前会先加上的默认工具。Amazon Q 在高度依赖 AWS 的环境里也有类似优势，因为身份、计费、console 操作和编程支持都处在一个熟悉的管理界面里。Cursor 的切换成本不同：一旦团队在它的 VS
              Code fork、SAML、SCIM、共享规则、云端智能体、自动化和 Jira 交接上标准化，工具就会嵌入日常工程管理，而不是作为可选扩展坐在编辑器旁边。Tabnine 的粘性由采购驱动，而不是产品驱动：需要
              VPC、本地或隔离部署的受监管团队，可能只有少数可用供应商，竞争场马上收窄。Claude Code 很强，但仍是本地优先、强调批准流程，因此容易与既有环境并行试点。Replit
              在从零应用构建上很容易采用，但这让它更像快速产品创建的替代品，而不是企业代码库治理工具。因此，Windsurf 最重要的竞争者之一其实是现状本身：团队可以在 IDE、终端、MCP 工具、CI/CD API
              和特定供应商智能体之间多平台并用，而不是承诺使用单一助手。在这种世界里，买方惯性利好既有平台，也提高了 Windsurf 的证明负担：它必须证明自己能成为权威系统，而不只是另一个 AI 标签页。
