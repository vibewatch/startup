  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、品牌与当前运营外壳
        blocks:
          - type: paragraph
            body: >-
              Windsurf 的公司故事已经不是一条简单的 Series C 软件公司叙事。业务 2021 年以 Exafunction 起步，聚焦 GPU 优化基础设施，随后在 2022 年以 Codeium 名义转向
              AI 编程辅助。2025 年 4 月官方改名文章说得很清楚：管理层把 2024 年 11 月 Windsurf Editor
              发布视为决定性转折，公司想从「代码补全扩展」转变为「智能体开发环境」。到本次运行日，转型又向前走了一步。windsurf.com 和 codeium.com 现在都跳转到 Devin
              Desktop，线上首页也明确告诉老 Windsurf 用户，其方案、定价、扩展和设置会通过 OTA 升级延续。尽调上，独立 Windsurf 品牌在历史上仍重要，但面向客户的运营外壳现在已经是
              Cognition 主导的更大技术栈里的继任产品界面。这实质性改变了投资框架，也改变了后续章节的可比对象。
