              SWE-bench 成绩确立为 2024 年的突破时刻，但官方 SWE-bench 生态后来公开了更新或开放智能体高得多的 Verified 分数。这不能证明 Devin
              在生产中很弱，但确实说明基准测试驱动的差异化压缩得有多快。Cursor 最强的采用率和偏好数字来自公司自称，意味着买方仍需现场证明，看看这种热度有多少能穿过采购、合规和大代码库推广。Replit
              的公开材料也展示了相邻替代品如何通过把设计、部署和智能体执行捆进一个云工作区，吸走经典 AI IDE 的注意力。从 Windsurf 视角看，净结果偏冷：它原本作为插件既有平台与完全自主智能体之间 AI
