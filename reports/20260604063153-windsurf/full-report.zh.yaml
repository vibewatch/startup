  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - Windsurf 护城河主张
      - 威胁
      - 严重度
      - 公开证据
      - 缓释 / 尽调问题
    rows:
      - - 编码环境里的智能体执行足够形成差异化
        - GitHub、Cursor、Amazon Q、Claude Code 和 Replit 现在都主打某种智能体工作流
        - 高
        - 智能体界面已覆盖 IDE、终端、云智能体和项目工具
        - 在真实客户仓库上衡量任务级胜率，而不是依赖品类标签
      - - 价格仍能抢份额
        - Copilot Pro $10 和 Amazon Q Pro $19 压低低端价格带，而 Cursor、Claude 和 Devin 聚在 $20 左右
        - 高
        - 官方公开定价显示，多数严肃个人付费档位已挤在窄价格带里
        - 用转化率、周期时间或质量数据证明 ROI，而不是低价席位话术
      - - 信任方案足以通过企业采购
        - Tabnine 提供 VPC / 本地 / 隔离部署；GitHub 和 AWS 提供更强的管理和合同界面
        - 高
        - 竞争对手越来越把消费者试用和企业治理隔开
        - 记录部署模型、训练默认设置和客户可控管理界面
      - - 基准测试领先足以撑起品牌
        - SWE-bench 头条变化快过产品口碑，开放智能体成绩已超过 Devin 早期发布分数
        - 高
        - 官方基准生态里，Verified 结果已高于 Devin 最初 13.86% 的发布报告
        - 在客户私有代码库上跑受控对测，并公布方法论
      - - 仅靠集成就能形成锁定
        - MCP、IDE 扩展、CLI 和 API 让很多团队很容易多工具并用
        - 中
        - 多数对手现在都连接 GitHub、Jira、Slack、终端或外部工具的某种组合
        - 跟踪有多少客户将平台标准化，而不是把它当第二工具使用
      - - 品牌切换不会影响竞争位置
        - 公开 Windsurf 入口如今指向 Devin Desktop，容易模糊买家究竟在评估什么
        - 中
        - 继任产品定位强化自动化，但削弱旧有独立 IDE 身份
        - 要求提供旧 Windsurf 账户的队列迁移、续约和扩张数据
    notes: 严重度反映投资者相关性，不只是客户侧严重度。多行是综合性判断，结合了多个竞争对手的定价、基准测试和采购证据。
