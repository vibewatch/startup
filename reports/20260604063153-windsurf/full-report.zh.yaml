  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型转型与结构可见度
        blocks:
          - type: paragraph
            body: >-
              Windsurf 的商业化故事更像三个阶段，而不是一张稳定 SaaS 方案表。2025 年 4 月，公司公开简化定价，取消 flow action 额度，转向 prompt 额度方案：Pro 每月
              $15、Teams 每用户每月 $30、Enterprise 每用户每月 $60，并提供池化附加额度和企业部署选项。2026 年 3 月，公司再次调整，这次用每日和每周配额替代额度，保留 Free 和
              Pro，新增 $200 Max 档，并把付费超额用量转为 API 标价。到 2026 年 6 月本次运行日，实时客户界面已不再以独立 Windsurf 品牌呈现，而是 Devin
              Desktop；Free、Pro、Max、Teams 和 Enterprise 仍存在，但团队包变成 $80 基础费加每个完整开发者席位
              $40。这个时间线很重要，因为它显示公司在模型行为变化时，反复尝试让商业化同时贴合智能体成本和客户心理。


              收入结构方向上可见，但没有量化披露。官方收购材料确认，到 2025 年 7 月 Windsurf 已是 $82M ARR 业务，企业 ARR 环比翻倍，企业客户超过 350 家；而 Sacra
              更早的估计仍显示更广客户基础里有数十万用户和超过 1,000 家企业。合起来看，这与 PLG
              到企业漏斗一致：免费和付费自助方案制造使用量与分发，随后团队和企业层把集中账单、分析、部署和安全需求变现。缺口在于精确拆分。没有公开来源说明 ARR 中有多少来自低 ARPU
              自助席位、多少来自更大的企业合同，所以正确承销姿态是：商业化偏企业，但新客户创建仍实质依赖自助漏斗。
