        title: 具名客户证明质量
        blocks:
          - type: paragraph
            body: >-
              具名客户证明最能看出历史 Windsurf 与当前 Cognition/Devin 继任产品之间的证据质量差距。历史 Windsurf 的公开证明大多停留在 logo 层面：Sacra 点名
              Zillow、Dell 和 Anduril 是客户，但公开材料没有说明这些账户的部署阶段、团队规模或量化结果。相比之下，当前继任产品界面发布了生产环境案例研究。Nubank 是最强例子：Devin 参与了一项
              6M+ 行 ETL 迁移，触及约 100,000 个数据类，工程工时效率提升 12x、成本节省超过 20x，并帮助 Data、Collections 和 Risk 业务单元在数周内完成迁移。Ramp
              报告每周最多合并 80 个 PR，每月节省 10,000+ 小时；Litera 报告测试覆盖率提高 40%、回归周期加快 93%、30 天内 90+ 用户上线、三周发布五个产品；Gumroad 称 Devin
              四个月合并 1,583 个 PR，合并率 >85%；Hamming 称 Devin 贡献了总代码量的 25%；AngelList 借助 20 个并行智能体，将 Redshift 到 Snowflake
              的迁移速度提高 5.2x；Evinova 则给出受监管医疗场景证明，GxP 文档速度提升 8x，前 10 天自主修复 66% 的 bug。


              但这不代表当前所有具名 logo 都同样有力。Cognition 融资文章及后续报道列出 Goldman Sachs、Citi、Cisco、Palantir、Santander、U.S. Army 和 U.S.
              Navy，但这些是客户名单披露，不是已发布的结果型案例研究。因此，投资人应把证明分成三层：历史 Windsurf 仅有 logo、当前合并后的 logo 名单、当前已量化的案例研究。
