  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 投委会（IC）式评分卡，把强资产需求和弱独立可投资性拆开看。
    data:
      items:
        - label: 市场需求
          value: 4/5
          detail: AI 编程仍是战略品类，买方兴趣很强
        - label: 产品 / 客户验证
          value: 4/5
          detail: $82M ARR 和 350+ 家企业客户说明商业牵引力真实
        - label: 战略兴趣
          value: 5/5
          detail: 2025 年，OpenAI、Google 和 Cognition 都追逐过该资产
        - label: 所有权清晰度
          value: 1/5
          detail: 没有公开股权结构表、对价分配桥表或清晰的交易后证券结构图
        - label: 估值支撑
          value: 2/5
          detail: 新投资人能支撑的只有折价后的合成区间
        - label: 退出清晰度
          value: 1/5
          detail: 拆分后，尚无公开证据显示存在新的独立退出路径
        - label: 证据质量
          value: 3/5
          detail: 交易事实清楚，但利益相关方经济账仍有部分隐藏
    approximationNotes: 评分卡是定性的投委会（IC）总结，不是机器打分模型；它有意把所有权清晰度的权重放得高于产品热度。
