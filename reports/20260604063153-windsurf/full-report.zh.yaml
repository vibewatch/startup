      - number: '2.2'
        title: 通过采用率和收入代理指标测算规模
        blocks:
          - type: paragraph
            body: >-
              Windsurf 的 TAM / SAM / SOM
              栈无法像成熟软件品类那样被公开清晰观察到。公开证据对采用率和商业化代理指标更强，对一个被普遍接受的美元规模估计更弱，所以应通过几组受约束的视角来测算市场。采用率视角已经很大：GitHub 国际调查称，超过 97%
              的受访者曾在工作中使用过 AI 编程工具；JetBrains 则报告 69% 试过用 ChatGPT 编程，40% 试过 Copilot。常规使用率低于试用率，但仍然可观：JetBrains 看到 49%
              常规使用 ChatGPT 编程，26% 常规使用 Copilot。再结合 GitHub 2024 年生成式 AI 项目和贡献的激增，说明这个品类已经越过新奇阶段。

              商业化代理指标指向同一方向。GitHub 把 Copilot 定位为拥有数百万个人用户和数万商业客户的产品；Cursor 已经提出官方企业渗透声称，这在两年前对一家 IDE 创业公司来说还显得难以置信；Sacra
              和 TechCrunch 都显示，在 2025 年结束前很久，投资者和付费客户就已经奖励了 Cursor 的收入爬坡。Windsurf 自身继任界面声称用户超过 1M、企业客户超过
              4,000。这些数字不能证明所有用户都在付费，也不能证明该基数能干净归因于收购前 Windsurf 产品，但它们确实证明：智能体编辑器的可寻址市场已经以数百万用户和数千企业账户来衡量，而不是少数灯塔试点。

              实际含义是，Windsurf 应按一条已验证的高价开发者软件预算线来估值。该品类已经大到足以支撑差异化自助、团队和企业定价，但仍年轻到精确市场份额数学比采用率和收入速度数据更嘈杂。
