      - number: '7.2'
        title: 模型供应商依赖、安全与监管风险
        blocks:
          - type: paragraph
            body: >-
              下一层风险来自上游模型依赖与智能体安全暴露的叠加。Windsurf 自己的合作伙伴故事称，Claude 支撑 Cascade 的核心推理和规划；当前 Devin 定价则宣传可访问 OpenAI、Claude 和
              Gemini 前沿模型。这有助于分散风险，但不能消除供应商权力；产品被嵌进一组不断变化的第三方定价、配额和政策制度中。Anthropic 和 OpenAI 都保留广泛的访问权利，Anthropic
              自己的产品页面也说，限额和价格变更可由其酌情发生。与此同时，Devin 的集成和 MCP
              支持放大了错误的影响半径：文档承认幻觉和不安全代码仍可能出现，即便营销材料强调沙箱、按工具限定范围、默认拒绝出站流量以及人工控制合并。OWASP 和 CISA
              也强调，提示注入、不安全插件、过度自主性和糟糕的安全部署实践，是智能体 AI 的核心风险而不是边缘案例。监管暴露真实存在，但可管理。EU AI Act 现在适用 GPAI
              透明度和版权义务，美国版权政策仍未定型。正确结论是：只有管理层能用独立证据证明企业级控制，而不只是产品文案，并且能证明收购后运营仍满足受监管买方隐含要求的标准，Windsurf 的安全和监管姿态才具备可投资性。
