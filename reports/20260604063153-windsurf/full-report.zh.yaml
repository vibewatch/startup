            body: >-
              Windsurf 最新的独立价值规模标记分两层。第一层是整合前运营规模：Sacra 估计到 2025 年 7 月 ARR 约 $82M、到 2025 年初活跃开发者超过 800,000、企业客户超过
              1,000、每日处理 token 超过 100B。第二层是当前继任产品界面：Devin Desktop 首页声称用户超过 1M、企业客户超过
              4,000，说明装机基础至少被保住了，也可能在新产品包装下继续扩张。不过，交易后证据并非全是正面。Economic Times 和 WinBuzzer 都描述了 Cognition 接手剩余 Windsurf
              业务后的裁员、买断和极端工作预期。这些信号不否定被收购资产的质量，但确实抬高了整合和留存风险。尽调上更合理的结论是：Windsurf
              打造了一个有分量、快速增长的企业开发者工具业务，但可投资实体已经转化为交易后的运营组件，不再是一家完整、准备融下一轮的私营公司。
