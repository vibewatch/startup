      - number: '4.3'
        title: Series C 之后及 2025 年所有权变化后的资本充足性
        blocks:
          - type: paragraph
            body: >-
              Windsurf 干净的独立资本故事止于 Series C。公开摘要一致把累计融资放在约 $243M，其中 2024 年 8 月完成 $150M Series C，估值 $1.25B。这足以说明，在 2025
              年交易序列之前，公司并非明显处在资本饥饿状态。但 2025 年 7 月从根本上改变了「现金跑道」的含义。Google 约 $2.4B 的人才加技术交易没有买下整家公司；随后 Cognition
              同意收购剩余业务，包括产品、IP、品牌和运营收入基础，金额未披露。此后，相关偿付能力问题从 Windsurf 的独立烧钱，转向 Cognition 是否愿意、也是否有能力为整合和持续产品开发出资。


              在这个更窄问题上，母公司看起来资金充足。多家高质量媒体报道 Cognition 在 2025 年 9 月以 $10.2B 估值融资约 $400M，另一篇报道则称同一轮接近 $500M、估值
              $9.8B。差异本身是披露缺口，但两个版本都指向同一方向：买方在交易完成后不久拿到了新资金。VentureBeat 和 TechCrunch 也都重复称，Cognition 自成立以来净烧钱保持在 $20M
              以下，同时 Devin ARR 从 2024 年 9 月的 $1M 增至 2025 年 6 月的 $73M，意味着融资前资本效率异常高。


              这并不意味着收购后没有财务风险。裁员和九个月买断要约说明整合成本真实存在，也可能带来客户服务中断和员工留存压力。但风险在于整合质量和留存收入，而不是产品界面层面的近期流动性。
