      - number: '7.3'
        title: 竞争、分发与单位经济风险
        blocks:
          - type: paragraph
            body: >-
              竞争不只是激烈，而是结构性不对称。GitHub 可以把 Copilot cloud agents 与集中式策略控制、广泛模型访问打包，Cursor 已经在营销企业安全、零数据留存控制以及有意义的 Fortune
              500 渗透。公开证据也显示，该品类的算力经济并不稳定：GitHub 2026 年 4 月暂停新的 Copilot 注册，外部报道称智能体工作负载迫使用量上限和模型降级。这一点很关键，因为 Windsurf
              当前定价相对品类并不低，却仍允许客户按 API 定价购买额外用量，从而把供应商成本波动压进毛利率或客户账单。Cursor 的规模——2025 年 4 月 ARR 为 $200 million，2025 年 6
              月超过 $500 million——说明竞争对手有预算同时补贴价格、企业销售和安全营销。OpenAI 与 Anthropic 更棘手，因为它们能从技术栈两端进攻：上游调整模型条款，下游推出 Codex 或
              Claude Code。公开基准和对比网站让买方更容易看清赛场，也压缩了仅靠叙事维持差异化的半衰期。这里的剩余暴露很高：即便竞争对手继续更快改进、更强打包，或更聪明地配给算力，Windsurf
              也必须证明自己能守住企业留存和实际 ROI。
