  - id: TP003
    title: 定价 / 打包比较
    columns:
      - 厂商
      - 自助入门价
      - 团队 / 商业版信号
      - 企业版姿态
      - 打包细节
      - Windsurf 含义
    rows:
      - - GitHub Copilot
        - Free $0；Pro $10；Pro+ $39；Max $100
        - Business 和 Enterprise 集中管理、额度池化
        - 企业 DPA、策略控制、GitHub.com 索引
        - 重度智能体使用也消耗 AI 额度，部分工作流消耗 GitHub Actions 分钟数
        - 最便宜的可信既有厂商，也是 GitHub 重度团队最容易加购的工具
      - - Cursor
        - Hobby 免费；Individual $20
        - 团队价：Teams $40/user/mo
        - Enterprise 定制
        - 高级模型、云智能体、Bugbot、团队市场、隐私模式
        - Windsurf 已很难只靠价格竞争
      - - Amazon Q Developer
        - 免费层零成本
        - 专业版：Pro $19/user/mo
        - IAM Identity Center 和 AWS 账户管理
        - Transformation 超额按 LOC 计费，$0.003
        - 价格近乎持平，且更贴合超大规模云厂商采购
      - - Tabnine
        - Code Assistant 价：$39/user/mo
        - Agentic Platform 价：$59/user/mo
        - 可私有部署
        - 更高标价搭配不训练和私有部署选择
        - 信任优先的买家可能愿意为避免纯云取舍支付溢价
      - - Replit
        - Starter 免费，含每日 Agent 额度
        - Core $20 年付 / $25 月付；Pro $95 年付 / $100 月付
        - Enterprise 定制，含 SSO/SAML 和隐私控制
        - 额度驱动定价更贴合应用构建和运行时用量，而非按席位编码助手
        - 对从零搭建产品的团队是相关替代品，作为直接企业 IDE 替代则不够清晰
      - - Claude Code
        - Claude Pro $17 年付 / $20 月付
        - Team $20 年付 / $25 月付每席；Max 从 $100 起
        - Enterprise 定制
        - Claude Code 打包进更宽的 Claude 方案，而不是单独按席位销售
        - 对想要本地控制和前沿模型的重度用户，价值很强
      - - Devin / Windsurf 继任产品
        - Free $0；Pro $20；Max $200
        - Teams $80/month，加 $40/mo / 完整开发者席位
        - Enterprise 定制
        - 用量额度按日、按周刷新，额外用量按 API 定价出售
        - 继任定价在核心付费档位上已不比 Cursor、Amazon Q 或 Claude Code 便宜
    notes: 公开标价不是企业实际成交价。表格展示买家在折扣、量级承诺、AI 额度超额或协商部署条款之前看到的价格。
