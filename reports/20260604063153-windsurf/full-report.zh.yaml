      - number: '4.4'
        title: 未披露财务与承销结论
        blocks:
          - type: paragraph
            body: >-
              最大分析约束不是需求发现，而是披露质量。公开来源足以说明 Windsurf 已具备战略价值、达到有意义
              ARR，并发展出真实企业业务。但这些来源不足以告诉投资者，独立基础上的业务到底有多持久、利润有多好。公开记录缺失的是经典承销指标：GAAP 收入、递延收入、净留存和总留存、分细分流失率、CAC、回本周期、ACV
              分布、合同期限、按方案或模型家族拆分的毛利率，以及收购后迁移留存。即便 Cognition 收购后的融资数据，也存在轮次规模互相冲突的报道。


              这种缺口结构导向谨慎结论。收入质量真实但并不完美：业务显然找到了产品市场匹配和买方紧迫感，但公开记录无法拆开自助与企业结构，也无法告诉我们 $82M ARR
              有多少穿越了模型访问和所有权冲击。利润率路径在设计上改善，但没有数字证明：从 flow-action 额度转向 prompt 额度，再转向配额和 API
              标价超额用量，正是一家公司试图停止低价出售昂贵智能体会话时会做的事，但这些步骤都没有证明贡献利润率为正。资本充足性现在已不再是独立层面的主要问题，Cognition 内部的整合治理和留存才是。


              总体看，Windsurf 应被视为一个战略重要的开发者工具资产，其需求信号强到足以吸引多个买方，但独立财务报表仍过于不完整，无法支撑高信心独立承销。正确的尽调下一步是拿到私有数据，而不是继续做公开外推。
