      - number: '4.2'
        title: 单位经济性、推理成本压力与 GTM 效率代理指标
        blocks:
          - type: paragraph
            body: >-
              公开证据对核心经济张力异常清楚：Windsurf 有真实商业需求，但据称毛利率很差。Sacra
              的描述很直白：前沿模型推理成本超过了公司向用户收取的价格；考虑到高端编程模型的成本曲线，以及智能体会话会随着时间扩大上下文和工具用量，这很可信。OpenAI 的公开 API 价格表显示高端模型成本会如何随着
              token 量快速放大；GitLab FY2025 10-K 则提供了有用对照：一家成熟开发者工具软件公司的毛利率为 89%，同时明确警告 AI 功能可能压低这一利润率。换句话说，Windsurf
              据称的利润率压力不像普通软件分发低效，更像这个品类特有的成本：把重度依赖前沿模型的智能体工作流卖得太便宜、定价太简单。


              定价重设计看起来就是在修复这种错配。2025 年从 flow-action 额度转向 prompt 额度，是在应对一个单条 prompt 可能触发远多于以往工具调用的环境。2026 年转向配额加 API
              标价超额用量，则更进一步，让重度使用更明显地变成可变成本，同时把企业协议与自助计费分开。这应当改善重度用户商业化，但不能证明毛利率健康，因为基础配额仍补贴部分高端模型使用，公司也没有披露超额用量结构、模型路由结构或各档贡献利润率。


              GTM 效率比量化更容易框定。Windsurf 显然用 PLG 做分发，再在漏斗上部通过企业控制和部署功能变现。Nubank 案例研究为企业销售提供了真正 ROI 证据，但公开记录仍缺 CAC、回本周期、NRR
              和流失率。结果是：企业价值主张可信，销售效率数据不完整。
