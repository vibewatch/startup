      - number: '1.3'
        title: 融资历史与 2025 年交易序列
        blocks:
          - type: paragraph
            body: >-
              作为一家独立风投支持公司，Windsurf 最干净的资本故事止于 2024 年 8 月 Series C：General Catalyst 领投约 $150M，累计融资增至约 $243M，估值约
              $1.25B。此后，公司战略价值快速超出常规创业阶段标签。Sacra 和 TechCrunch 都描述了一条 2025 年 7 月序列：OpenAI 据称的收购兴趣到期，Google 支付约 $2.4B
              挖走创始人和一部分研究团队，同时获得技术许可；随后 Cognition 签署最终协议，收购剩余业务。Cognition 官方公告值得注意，因为它披露了经营基本盘——$82M ARR、企业 ARR 环比翻倍、350
              多家企业客户——同时强调被收购资产包包括产品、IP、商标和品牌。换句话说，Windsurf 不再是一家普通 Series C
              创业公司，而是被拆分的战略资产；其经济价值不是通过一笔干净收购实现，而是通过人才、技术和客户关系转移兑现。
