      - number: '6.4'
        title: 耐久性、扩张、集中度与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              耐久性、扩张和采购风险仍是客户故事中最缺证明的部分。无论历史 Windsurf 还是当前继任产品界面，都没有披露 NRR、GRR、logo
              续约率、头部客户集中度，或免费用户转化为团队及企业合同的情况。公开材料里最好的耐久性代理指标不是财务指标，而是运营指标：Anthropic 提到上线后日留存非常高，Gumroad
              从单个小组扩展到全公司使用，Bilt 在 106 名工程师中铺开 Devin 且超过一半每周使用，Litera 在 30 天内将 Devin 活跃使用量提高一倍以上。这些使用信号令人鼓舞，但不能替代付费续约数据。


              反向证据也真实存在。存档的 G2 覆盖评论深度太浅，无法提供购买洞察；Trustpilot 评论则记录了围绕定价调整、退款争议、额度耗尽以及长期用户称 2026 年 3
              月大改后取消订阅的强烈反弹。TechCrunch 还报道，Anthropic 2025 年 6 月切断 Claude 直接访问后，部分 Windsurf
              客户转向竞争对手。在采购层面，今天的企业版报价强于历史公开记录，因为它宣传 VPC 部署、SOC 2 Type II、teamspace 隔离以及 SSO/管理员控制。但合并后的实体仍需协调 Windsurf
              的按席位定价与 Devin 基于使用量的算力经济、按 API 定价的超额用量。这会带来预算和续约摩擦，而集中度风险恰恰最难被观察。
