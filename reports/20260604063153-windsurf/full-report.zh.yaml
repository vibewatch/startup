        title: 合成乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观、基准和悲观情景应被读作合成的穿透估值，而不是报价市场价格。乐观情景下，Windsurf $82M ARR 基础的大部分经济价值留存在 Cognition 买下的剩余业务中，客户关系证明有粘性，未来买方按接近
              Cursor 或高端公开可比公司的倍数承销该资产。这可以支撑约 $1.6B 到 $2.2B 的价值。基准情景更保守，在我看来也更有决策价值：对已披露 ARR 适用 10x 到 15x
              区间，再因创始人离开、企业客户基础留存未经验证，以及公开持有人不了解存续分配顺位而打折。由此得到约 $0.8B 到 $1.2B。悲观情景不是理论推演；如果经济价值已经通过 Google
              的薪酬和许可包、以及未披露的 Cognition 购买分配实现，剩余股东只留下高度次级或实际上被清零的权利，那么这就是逻辑后果。在这一框架下，穿透价值可能下探至 $0 到
              $0.4B。由于没有公开证据显示新的融资流程或干净二级证券，这组情景推演导向入场纪律，而不是热情。
