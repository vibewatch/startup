      - CV053
  - id: TV006
    title: 最终尽调请求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前股权结构表和瀑布分配
        - 证券类别、优先权、参与权、期权处理
        - 决定任何存续股权是否仍有意义
        - 律师认证的股权结构表加瀑布模型
      - - Google 协议分配
        - 流向公司实体的现金、员工薪酬和授权价值之间的分配
        - 决定 $2.4B 中有多少真正可由投资者变现
        - 要求提供已签署协议或董事会备忘录
      - - Cognition 购买协议
        - 名义对价、托管、扣留款，以及按证券类别的分配
        - 需要知道剩余资产出售到底值多少钱
        - 获取已签署的 SPA 或合并协议
      - - 客户留存桥
        - Cognition 内部交易前 Windsurf 队列的 ARR 和账户留存
        - 检验 $82M 基础在经济上是否真正存续
        - 要求提供队列、NRR 和前 20 大账户状态
      - - 交易后员工留存
        - 组织架构图、按职能划分的流失率，以及销售覆盖连续性
        - 检查被收购资产是否仍能执行
        - 与管理层开展 HR 和运营审查
      - - 老股证券可得性
        - 是否仍能买到任何可转让的独立权利或剩余请求权
        - 没有证券就没有入口，无论内在价值如何
        - 与律师、经纪人和公司财务联系人确认
    notes: 这些请求是重新审视回避建议的前置条件，不是可选的后续事项。
    claimRefs:
