  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 所有权过渡与控制风险
        blocks:
          - type: paragraph
            body: >-
              Windsurf 最高严重度的风险在于，公司已不再是一个干净、由创始人领导的运营单元。Google 挖走了 CEO、联合创始人和关键研究负责人，Cognition 则签约接手剩余产品、品牌、IP
              和客户基础。资产最需要连续性的时刻，核心人才所有权与运营业务所有权发生了分离。剩余业务并不小：Cognition 披露约 $82 million ARR、超过 350
              家企业客户，以及数十万日活用户。换言之，整合失败不只是拖慢上行空间；它可能损害一个庞大的安装基础和真实收入流。公开缓释措施只是不完整的。Cognition 承诺尊重式处理和即时连续性，但也表示会大举投资，把
              Windsurf
              折入自己的技术栈。随后关于裁员、买断和更强硬工作文化的负面报道，提高了产品、支持和商业化连续性在客户看到承诺产品增益前就恶化的概率。投资含义很直接：这是一个影响关键的风险，缓释成熟度只有部分到位；尽调应把留存和客户连续性指标视为一阶闸门，而不是背景性
              HR 噪音。
