        title: 尽调重点与投资逻辑失效触发器
        blocks:
          - type: paragraph
            body: >-
              对估值章节来说，尽调议程异常偏法律和结构，因为普通运营尽调不够。关键缺失文件包括 Google 许可和人才协议、Cognition 对剩余业务的购买协议，以及一张当前股权结构表，显示哪些类别参与了 2025
              年分拆交易的每一步。没有这些文件，就无法严谨建模稀释或清算优先权负担。运营尽调仍然重要：投资人需要看到 Cognition 内部 Windsurf
              企业账户的队列留存，证明定价压力没有永久压缩单位经济，并证明收购后文化扰动没有伤害产品速度或账户覆盖。如果客户留存疲弱、剩余普通股或优先股持有人事实证明几乎没有剩余经济权利，或者 AI
              编码价格战把出清倍数推向公开可比公司区间，投资逻辑会迅速失效。反过来，只有当尽调证明存在可转让证券、透明权利，且价格不高于大致基准情景合成区间时，这个判断才可能改善。在此之前，正确姿态不是等待情绪好转，而是避免把战略热度误认为可投资的独立股权机会。
