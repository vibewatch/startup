  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 买方 / 用户 / 付款方分层
        blocks:
          - type: paragraph
            body: >-
              Windsurf 的客户地图最适合理解为三层买方 / 用户 / 付款方栈，而不是单一细分。历史上，Codeium / Windsurf
              使用经典产品驱动漏斗：免费个人开发者先进入，团队负责人或工程经理在代码库内扩展使用，企业买方只有在身份、治理和部署控制变重要后才介入。Sacra
              明确把这一动作描述为自下而上采用，把有机开发者使用转化为团队级、再到企业级部署。当前继任定价页仍反映同一阶梯：Free、Pro、Max、Team 和需联系销售的
              Enterprise。这意味着主要用户仍是软件开发者，日常内部支持者通常是工程负责人或平台负责人；一旦 SSO、VPC 和管理控制进入讨论，经济买方就变成集中工程、IT 或采购预算负责人。


              细分结构比泛泛的「开发者」更宽。历史 Windsurf 证明点集中在处理大型复杂代码库的企业开发团队，Sacra 点名 Dell、Zillow 和 Anduril 为公开客户，Anthropic
              也描述了多年企业代码库工作。当前继任界面进一步拓宽了这一组合：Ramp 和 Bilt 代表金融科技 / 平台工程团队，Litera 代表法律科技 QA 与发布工程，Hamming AI
              代表基础设施团队，AngelList 代表数据工程，Evinova 代表受监管临床软件团队。Gumroad 和 Linktree
              也显示，一旦产品嵌入，产品、支持、营销等非工程职能也可以间接或直接使用智能体。这扩大了用户宽度，但也让预算归属更复杂，因为工具可以从工程起步，随后触达更广运营团队。
