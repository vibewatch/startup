        title: 安全、合规与企业治理姿态
        blocks:
          - type: paragraph
            body: >-
              公开信任姿态比早期 Windsurf 品牌本身显示的要强很多，但仍部分是平台级而非产品特定。企业营销称客户数据留在客户控制环境中，可运行在 VPC 内，且不会用于训练。安全文档补充了传输中和静态加密、SOC 2
              Type II 覆盖，以及企业承诺永不使用客户数据训练。当前安全工作流页面还描述了隔离的临时沙箱、短期凭证、密钥脱敏、域名白名单、人工控制合并，以及可导出到 SIEM
              的会话记录。面向企业推广，管理指南增加了模型访问、终端自动运行等级、MCP 启用和其他团队设置的治理杠杆。主要细节在于，开放性也制造了新的治理工作。Cognition 自己的管理指南警告，MCP 可能在
              Devin Desktop 安全监控之外创建基础设施资源，因此企业仍需要围绕外部服务器和第三方 ACP 智能体设置白名单与审批流程。公开文档在控制和流程上不错，但对客户可见可靠性指标和服务级别保证仍然偏薄。
