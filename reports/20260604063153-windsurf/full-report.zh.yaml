      - number: '2.3'
        title: 买方地图、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              AI 编程的买方分层，与其说由公司规模定义，不如说由谁承担迁移风险定义。个人开发者是摩擦最低的入口，因为决策本质上是：一款每月 $10 到 $20
              的工具，能否带来足够的日常生产力或使用愉悦感，值得刷信用卡。团队方案出现于工程经理或创始人想要一致性、用量可见性、隐私默认值和统一账单时。企业买方又加一层：采购、安全、身份、审计、用量预算和模型治理政策都会成为产品的一部分，而不只是旁边的清单。Cursor
              和 GitHub 的公开材料把这一点说得很明白；可变现产品不再只是模型访问，而是对智能体行为的管理控制。

              这种结构有利于经典的自下而上再转自上而下动作。开发者会先于公司完全批准去试用 AI 工具，等 ROI 可见、安全问题可控后，团队再标准化。因此，当前定价锚点很关键。GitHub
              低价个人方案拉动广泛试验，Cursor 的 $40 团队档捕获愿意为协作付费的专业团队，Tabnine 的高价私有部署面向受监管买方，AWS Q
              则说明买方已经处在更广平台关系里时，用量型或池化经济性也可以接受。这个品类因此不是单一市场，而是一架付费意愿阶梯：从自助生产力到有治理的企业自动化。

              对 Windsurf 来说，近期最强匹配是那些重视编辑器切换、想要更智能体优先工作流的细分。最弱匹配则是把既有平台分发、政府级证明或私有部署弹性置于 UX 新鲜感之上的买方。这些买方已经有可信替代品。
