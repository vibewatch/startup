  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 单位
      - 当前数值 / 状态
      - 收入质量
      - 尽调问题
    rows:
      - - 免费漏斗
        - 免费增值获客
        - 用户
        - 活跃但不产生收入；现在位于 Devin Desktop 内
        - 直接收入低，但管线价值高
        - 需要免费 MAU、激活率和免费转付费转化率
      - - Pro 自助
        - 月订阅加额度
        - 现在 $20/mo；2025 年重置时 $15/mo
        - 2025 和 2026 方案里的核心个人付费档位
        - 经常性收入中高，但暴露于模型成本波动
        - 需要付费席位数、超额用量附加率和流失率
      - - Max / 重度用户自助
        - 高阶月订阅
        - 2026 年 $200/mo；历史上部分重度用户购买附加包或使用 $60 Pro Ultimate
        - 新设的明确重度用户变现层
        - 中等经常性收入，但成本可能偏重
        - 需要 Max 附加率和重度用户队列毛利率
      - - Teams
        - 带管理控制的按席位或组织套餐
        - 2025 年 $30/user/mo；2026 年 3 月 $40/user/mo；继任页面现在显示 $80 基础费 + $40/full dev seat
        - 从 PLG 走向受管组织支出的商业桥梁
        - 管理工具粘住后，经常性收入质量高
        - 需要团队转化率、平均席位数和实际 ARPU
      - - Enterprise
        - 合同席位、部署、支持
        - 2025 年重置时 $60/user/mo；继任界面定制
        - 收购时 350+ 家企业客户；2026 年调整中保留既有计费协议
        - 合同能续约并扩张，收入质量很高
        - 需要 ACV、合同期限、续约率和部署组合
      - - 额外用量 / 附加包
        - 2025 年为 prompt 额度包；2026 年为按 API 定价的超额用量
        - 2025 年 $10/250 额度或 $40/1,000 额度；2026 年按 API 定价
        - 把高强度高级模型消耗变现
        - 中等，因为收入跟用量和成本绑定
        - 需要来自超额用量的 ARR 占比和成本转嫁毛利
    notes: 表格区分漏斗、经常性订阅、企业合同和用量绑定变现；标价不是实际净收入。
