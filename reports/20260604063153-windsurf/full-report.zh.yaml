      - number: '6.2'
        title: 采用轨迹与历史 / 继任边界
        blocks:
          - type: paragraph
            body: >-
              公开采用指标必须拆成三个阶段看。第一阶段是早期上线证据，Anthropic 的客户故事显示出异常快的产品驱动增长：Windsurf 两天拿到 10,000
              名用户，第二周结束时已达数十万，管理层称日留存非常高。Anthropic 页面还写明有 800,000+ 活跃用户和 1,000+ 企业客户；Sacra 也独立称，到 2025 年初 Codeium 已扩展到
              800,000+ 活跃开发者和 1,000+ 家企业。第二阶段是收购时点的口径明显更窄：Cognition 2025 年 7 月的收购公告和 TechCrunch 都说，Windsurf 带来 350+
              企业客户、数十万日活用户、$82M 年经常性收入（ARR），且企业 ARR 环比翻倍。由此看，历史上的「1,000+ 企业」口径与后来「350+ 企业客户」口径并不是可直接比较的分母。


              第三阶段是今天的继任产品界面，明确已经是交易后的口径。当前 Windsurf/Devin Desktop 首页声称有 1M+ 开发者和 4,000+ 企业客户，Cognition 后续融资文章还说，老
              Windsurf 与收购前 Devin 的企业客户重叠率低于 5%，合并后的企业 ARR 在交割后前七周增长超过 30%。这些都是重要商业信号，但不能倒填进历史 Windsurf。最干净的解读是：交易前的历史
              Windsurf 已证明很强的 PLG 采用能力；更大的 1M+/4,000+ 覆盖面，则是当前合并平台的营销口径。
