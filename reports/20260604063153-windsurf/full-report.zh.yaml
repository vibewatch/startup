  - id: TV005
    title: 投资逻辑破裂与终止触发表
    columns:
      - 触发项
      - 阈值
      - 如何传导到投资逻辑
      - 行动含义
    rows:
      - - 剩余证券不可转让，或被深度劣后
        - 律师审查显示，外部持有人几乎没有或完全没有经济请求权
        - 机会从可投资资产变成法律尾部权利
        - 立即回避
      - - 企业留存破裂
        - 存续 Windsurf 客户基础出现重大流失或负 NRR
        - 乐观和基准情景失去收入分母
        - 估值下调到悲观区间
      - - 价格战加速
        - 席位或用量价格下调，且没有匹配的成本抵消
        - 溢价倍数支撑向公开可比公司区间压缩
        - 下调价值区间并扩大折扣
      - - 整合产品推进停滞
        - Cognition 内部看不到交叉销售、留存证明或一致路线图
        - 战略溢价不再可重复
        - 将 2025 年成交价视为一次性事件价值
      - - 人员或 IP 冲击出现
        - 进一步人员流失、法律纠纷，或证据显示授权 IP 无法干净商业化
        - 执行和法律悬而未决风险同时上升
        - 问题解决前暂停承销
    notes: 终止触发项按可观察事件来写，这样无需依赖叙事惯性，也能重新审视建议。
    claimRefs:
