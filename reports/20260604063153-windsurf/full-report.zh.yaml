        title: 产品连续性与当前界面范围
        blocks:
          - type: paragraph
            body: >-
              现在应把 Windsurf 看作连续性产品，而不是停摆产品。2026 年 6 月转型把 Windsurf 改名为 Devin Desktop，但 FAQ 明确说它在更大的 Devin 品牌伞下仍是同一个
              IDE、同一个编辑器、同一组核心功能。这种连续性很重要，因为它保住了既有 Windsurf 用户工作流——扩展、快捷键、LSP 式编辑行为、本地规则和 JetBrains
              插件支持——同时把界面重新居中到智能体编排。首页和 Agent Command Center 文档把定位讲得很清楚：产品不再只是 AI 辅助编辑器，而是本地和云端智能体的命令界面，用 Spaces
              把会话、PR、文件和任务上下文放在一起。历史背景也强化了这个判断。Codeium 已在 2025 年把自己改名为 Windsurf，Cognition 后来的收购文章仍把 Windsurf 称作智能体
              IDE。因此，收购后的动作是加法：Cognition 保留 IDE，并把它改造成更大 Devin 产品家族的桌面前端，而不是直接替换。
