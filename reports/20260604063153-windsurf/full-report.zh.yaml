  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 估值 / 倍数
      - 相关性
      - 局限
    rows:
      - - Windsurf Series C 轮（2024 年 8 月）
        - 最后一轮干净的私募融资
        - $1.25B 名义估值 / 以后续 $82M ARR 计算约 15.2x
        - 最后一个无争议的独立股权基准
        - 使用后续 ARR 分母，只作方向性比较
      - - 据报道 OpenAI 表达兴趣（2025 年 7 月）
        - 未成功的战略报价
        - 约 $3.0B / 以 $82M ARR 计算约 36.6x
        - 显示战略控制权兴趣如何给稀缺性定价
        - 报价已过期且从未成交
      - - Google 反向收购式招聘 / 授权（2025 年 7 月）
        - 人才加非独家授权
        - 约 $2.4B / 以 $82M ARR 计算约 29.3x
        - 证明创始人和技术具有巨大战略价值
        - 不是整家公司股权收购
      - - Cursor（2025 年 6 月）
        - 私有 AI 编码融资轮
        - $9.9B / >$500M ARR / 约 19.8x
        - 最接近的完整私有 AI 编码可比公司
        - 收入基数大得多，控制权也完整
      - - 合并后 Cognition（2025 年 9 月 vs 2026 年 5 月 ARR 估计）
        - 收购后平台
        - $10.2B / 约 $492M ARR 估计 / 约 20.7x
        - 显示买入 Windsurf 后，整合平台所处的倍数区间
        - 不是 Windsurf 单独价值，且使用分析师 ARR 估计
      - - GitLab（2026 年 6 月）
        - 公开 DevSecOps 可比公司
        - $5.22B 市值 / $759.2M FY2025 收入 / 约 6.9x
        - 规模化开发者平台的公开市场下沿
        - 增速更慢，且受公开市场纪律约束
      - - JFrog（2026 年 6 月）
        - 公开开发者工具可比公司
        - $10.15B 市值 / $428.5M FY2024 收入 / 约 23.7x
        - 高质量开发者工具资产的公开市场上沿
        - 不是 AI 原生，利润率画像也不同
    notes: 合成的 Windsurf 倍数用交易名义价值除以 Cognition 披露的 $82M ARR，以保持比较口径一致；本表经过筛选，并非穷尽列表。
    enumerationScope:
      coverage: partial
      basis: >-
        Curated to the seven most decision-relevant private, strategic, and public developer-platform references
        available in fetched public sources as of the 2026-06-04 run date.
