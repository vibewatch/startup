          note: 所有权不透明但资产价值仍存时，折价承销区间
        - label: 乐观情景价值（$M）
          low: 1600
          mid: 1900
          high: 2200
          note: 假设客户基础完整，且高端可比项支撑估值
        - label: 重新开放入场上限（$M）
          low: 700
          mid: 850
          high: 1000
          note: 可部分抵消当前所有权不透明的价格区间
    approximationNotes: 这些区间不是公开估值标记或融资轮价格；它们是在所有权信息不完整时用于决策的合成价值。
    claimRefs:
      - CV048
