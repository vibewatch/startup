  - id: TR005
    title: 缓释与终止标准表
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 所有权过渡失败
        - 原 Windsurf 人员流失、支持中断或整合滑坡
        - 连续两个季度出现重大原团队流失，或企业支持明显退化
        - 不再把过渡视为临时噪音；重新承销客户耐久性和产品路线图可信度
      - - 供应商访问或政策冲击
        - Anthropic 或 OpenAI 的条款、限额、定价或模型目录变化
        - 暂停访问、硬性削减配额，或供应商成本上升到足以在没有抵消项时损害当前定价
        - 立即重做利润率模型，并在备用权利得到证明前下调信心
      - - 安全 / 治理失效
        - 已确认的提示注入事件、密钥泄露，或在控制存在下仍进入生产的不良合并
        - 任何公开事件表明，人工审核未能遏制重大客户工作流中的智能体失效
        - 在事件响应复盘和客户流失影响分析完成前，按投资逻辑破裂处理
      - - 竞争性分发或定价挤压
        - 大型企业竞争失单，或被迫实质降价
        - 需要大幅下调有效价格，同时 ARR 质量或续约速度转弱
        - 将基准情景下调到更低利润率、更短护城河周期；不要按高溢价倍数承销
      - - 监管市场准备度缺口
        - 企业尽调失败、发生执法事件，或无法为目标细分市场出示合规证据
        - 任何大型监管行业或公共部门机会，都因控制缺失或合规责任未厘清而受阻
        - 在拿出控制证据前，把监管市场上行空间移出基准情景
    notes: 这些阈值是决策规则，不是泛泛的观察项；一旦触发，每一条都会改变承销判断。
