      - number: '8.2'
        title: 交易桥接与可比背景
        blocks:
          - type: paragraph
            body: >-
              交易数学进一步支持谨慎。以 Cognition 披露的 $82M ARR 作为共同分母，最后一个干净的 Series C 基准约为 15.2x ARR，据报道 OpenAI 兴趣对应约 36.6x，Google
              $2.4B 反向收购式挖人与许可交易约为 29.3x。Google 这个数字不应被视为正常的整家公司估值，因为 Google 既没有买下控制权，也没有取得股权；它买的是关键人才访问和非独家技术许可。Cursor
              是最接近且仍完整的私有可比公司：TechCrunch 报道其 2025 年 6 月估值 $9.9B、ARR 超过 $500M，约为 19.8x ARR。按 Sacra 2026 年 5 月 ARR 估计和
              CNBC 2025 年 9 月估值轮，合并后的 Cognition 约为 20.7x。公开开发者工具可比公司的倍数低得多，或至少更窄：GitLab 2026 年 6 月市值隐含约 6.9x FY2025
              收入，JFrog 约为 23.7x FY2024 收入。Copilot 具有战略意义，但不是干净的股权可比，因为 GitHub
              将其作为更大平台里的打包产品销售，覆盖个人、商业和企业计划。因此，估值信号很清楚：完整平台可以拿到溢价倍数，但所有权不透明的分拆资产应打折交易，而不是按最贵的战略成交价定价。
