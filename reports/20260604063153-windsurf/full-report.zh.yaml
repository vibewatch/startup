        - 用区间和法律尽调替代单点估值承销
      - - 风险评级
        - 高
        - 所有权拆分、未记录的瀑布分配，以及交易后执行风险，可能造成严重减值
        - 假设任何剩余权利的下行可接近全损
      - - 估值立场
        - 昂贵 / 无法作为干净入口
        - 合成的 29x–37x 战略参照，高于 Cursor 和多数公开开发者工具可比公司区间
