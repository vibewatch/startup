        - Claude 支撑核心规划流程，也通过 Claude Code 直接竞争
        - 高
        - 竞品持续改进的同时，定价、限额或访问条款收紧
        - 严重
        - 多模型支持，并已在前沿模型之间分散
        - 高
      - - 模型供应商和直接工作流进入者
        - OpenAI
        - 模型供应商，也在重叠工作流中运营 Codex
        - 高
        - 政策变化、访问限制或直接产品捆绑压缩 Windsurf 灵活性
        - 高
        - 多模型路由，客户可在供应商之间选择
        - 高
      - - 代码仓库和企业分发平台
        - GitHub / Microsoft
        - PR 工作流、代码仓库集成和 Copilot 企业分发
        - 高
        - API 或产品政策变化偏向 Copilot，或让依赖工作流更不可靠
        - 高
        - 维持多界面工作流，并强调本地加云端的灵活性
        - 中
      - - 云基础设施主干
        - AWS
        - 当前生产环境和企业部署底座
        - 中
        - 宕机、定价变化或更严格的 AI 服务条款扰乱服务质量
        - 中
        - 隔离、出站控制和企业部署选项
        - 中
      - - 历史产品知识和创始人背景
        - 被 Google 聘走的创始人 / 研究团队
        - 相当一部分路线图背景和技术叙事留在被收购运营边界之外
        - 中
        - 知识分离拖慢产品整合，或削弱模型选择优势
        - 高
        - IP 转让，加上 Cognition 内留存的 GTM、工程和产品人员
        - 中
    notes: 当对手方本身也是直接或相邻竞争者、且有自己的编码智能体议程时，剩余暴露仍然高。
