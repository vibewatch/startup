  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局、竞争者类型与买方的第一选择
        blocks:
          - type: paragraph
            body: >-
              Windsurf 如今所在的市场里，买方可以通过几条非常不同的渠道解决同一件事。GitHub Copilot 和 Amazon Q Developer
              是默认既有选项，因为它们借助现有开发者和云控制平面，而不是要求团队采用一个全新环境。GitHub 在 GitHub.com、IDE、终端、项目工具、聊天应用和 MCP 服务器中推广 Copilot，同时
              GitHub 自身平台规模在 2024 年已越过 100M 开发者和 518M 项目。AWS 在云技术栈里做类似事情：Amazon Q 覆盖 IDE、CLI、AWS Console、Slack、Teams，甚至
              GitHub 预览工作流，这让它成为已经在 AWS 身份和运维上标准化的团队最自然替代品。Cursor 是最重要的直接 IDE 原生对手，因为它把 VS Code fork 与云端智能体、Jira
              工作流钩子，以及公司声称覆盖 64% Fortune 500 和 50,000 多家企业的渗透结合起来。Tabnine 从信任侧进攻，提供私有部署选项；Replit
              从应用构建器侧进攻，提供并行智能体和浏览器原生产品构建。Claude Code 和 Devin 则进一步走向更高委托度的智能体工作流。战略结论是，Windsurf 不再与一个单一 AI
              编程助手品类竞争；它同时面对拥有分发的既有平台、拥有工作流深度的挑战者，以及承诺比自动补全更高自主性的智能体原生工具。
