      - number: '5.2'
        title: Cascade 工作流、上下文栈与本地到云端交接
        blocks:
          - type: paragraph
            body: >-
              核心本地工作流仍是 Cascade，它不只是侧边栏聊天机器人。文档描述了分开的 Code 和 Chat 模式、后台规划智能体、长任务 Todo 列表、每条 prompt 最多 20 次工具调用、排队消息、感知
              linter 的编辑，以及对用户已在编辑器中完成工作的实时感知。在这个本地循环之上，Devin Desktop 保留了一套差异化上下文栈：Tab 由内部模型驱动并针对流畅度优化，Supercomplete
              不只建议下一 token 文本，还能建议删除和新增；Fast Context 加基于 RAG 的上下文引擎，旨在为任务找出确切文件和行。DeepWiki 增加符号级解释，并可直接提升到
              Cascade。云端交接是另一个重要架构元素。Devin in Devin Desktop 让用户先在本地勾勒或调查，再把工作发送到云端 Devin VM；VM
              会独立持续运行，并在同一工作区返回可审查输出。这种本地到云端连续性，正是 Windsurf 想要占住的产品行为。
