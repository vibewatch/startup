        title: 创始人、领导层变化与治理可见度
        blocks:
          - type: paragraph
            body: >-
              公开创始人归因比提示词最初给出的背景更窄。本次审阅的较高质量公开档案一致把 Varun Mohan 和 Douglas Chen 识别为创始组合：Mohan 担任 CEO，Chen
              是关键技术联合创始人。Google 在 2025 年 7 月完成反向收购式挖人交易后，临时领导权转给 Jeff
              Wang；他的公开表态把随后几天描述成危机应对式过渡，而不是计划内接班。治理可见度仍然很差。公司自有页面和可访问的第三方资料页，都没有披露足够细的董事会名单、独立董事或股东控制机制，无法支撑治理质量判断。这个不透明度很关键，因为公司经历了一种极不寻常的拆分交易结局：Google
              挖走顶层技术领导层却没有取得控制权，随后 Cognition 收购剩余运营业务。公共治理细节缺失，使外部很难复原交接期间是谁为小股东、留任员工或客户谈下了哪些保护。
