  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: Board roster, investor rights, and any independent director appointments remain undisclosed.
    whyItMatters: Opaque governance reduces confidence in how the 2025 split transactions were negotiated and how minority stakeholders were protected.
    diligencePath: Request cap table, board materials, and definitive transaction agreements from the company or existing investors.
    relatedQuestionRefs:
    - QO010
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: metric-disclosure
    missingEvidence: Audited revenue, gross margin, burn, and cash data are not publicly available for the standalone Windsurf entity.
    whyItMatters: Without audited operating metrics, valuation and unit-economics analysis must lean on management or analyst estimates.
    diligencePath: Seek management financial package, QoQ ARR bridge, gross-margin waterfall, and board-approved budget.
    relatedQuestionRefs:
    - QO020
    relatedTableRefs:
    - TO003
  - type: conflicting-data
    severity: material
    topic: employee-treatment
    missingEvidence: Public reporting does not fully reconcile who benefited from the Google transaction versus the Cognition transaction.
    whyItMatters: Uneven economic outcomes can affect retention, litigation risk, and post-acquisition operating continuity.
    diligencePath: Review employee-option treatment schedules, separation packages, and communication memos for both July 2025 transactions.
    relatedQuestionRefs:
    - QO024
  - type: missing-source
    severity: minor
    topic: founder-attribution
    missingEvidence: No primary or high-quality third-party source reviewed here clearly documents Neil Agarwal as a formal co-founder.
    whyItMatters: Founder identity affects founder-market-fit analysis and reference checking, so unresolved attribution should not be assumed into later chapters.
    diligencePath: Confirm founding incorporation records, early cap-table documents, or archived official team pages before treating the role as established.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO004
