company:
  name: Windsurf
chapter:
  number: 1
  title: Company Overview
  summary: Windsurf began in 2021 as Exafunction, pivoted into AI coding software as Codeium, and rebranded to Windsurf after launching its agentic editor in late 2024. The company raised about $243 million through a $150 million Series C at a $1.25 billion valuation, but by mid-2025 its founders and some research staff moved to Google while Cognition acquired the remaining product, IP, and operating business. As of the 2026 run date, windsurf.com resolves to Devin Desktop, so the diligence question is less about a clean next financing and more about how much standalone value survived the ownership transition.
sections:
- id: identity-evolution
  title: Identity, branding, and current operating shell
  body: 'Windsurf’s corporate story is no longer a simple Series C software-company narrative. The business began as Exafunction in 2021, focused on GPU optimization infrastructure, then pivoted in 2022 into AI coding assistance under the Codeium name. The official April 2025 rebrand post makes clear that management viewed the November 2024 Windsurf Editor launch as the decisive turning point: the company wanted to move from being understood as a code-completion extension toward being recognized as an agentic development environment. By run date, that transition has gone one step further. Both windsurf.com and codeium.com now resolve to Devin Desktop, and the live homepage explicitly tells legacy Windsurf users that their plans, pricing, extensions, and settings carry over through an over-the-air upgrade. For diligence purposes, this means the standalone Windsurf brand still matters historically, but the customer-facing operating shell is now a successor product surface inside a broader
    Cognition-led stack. That materially changes both the investment frame and the comparability set for later chapters.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO022
  - CO025
  tableRefs:
  - TO004
  figureRefs:
  - FO001
- id: leadership-governance
  title: Founders, leadership changes, and governance visibility
  body: 'Public founder attribution is narrower than the prompt’s initial context suggests. The higher-quality public profiles reviewed for this run consistently identify Varun Mohan and Douglas Chen as the founding pair, with Mohan serving as CEO and Chen serving as the key technical co-founder. After Google’s July 2025 reverse-acquihire, interim leadership shifted to Jeff Wang, whose public statements framed the following days as a crisis-response transition rather than a planned succession. Governance visibility remains poor. Neither the company’s own pages nor the accessible third-party profile pages disclose a board roster, independent directors, or shareholder-control mechanics in enough detail to underwrite governance quality. That opacity matters because the company experienced a highly unusual split-transaction outcome: Google hired away the top technical leadership without taking control, and Cognition then acquired the remaining operating business. The lack of public governance
    detail makes it hard to reconstruct who negotiated what protections for minority holders, remaining employees, or customers during that handoff.'
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
  - CO039
  tableRefs:
  - TO002
- id: capital-and-ownership-transition
  title: Funding history and the 2025 transaction sequence
  body: 'As a standalone venture-backed company, Windsurf’s cleanest capital story ends with the August 2024 Series C: roughly $150 million led by General Catalyst, bringing cumulative capital raised to about $243 million and valuation to about $1.25 billion. After that point, the company became strategically valuable in a way that outgrew conventional venture-stage labeling. Sacra and TechCrunch both describe a July 2025 sequence in which OpenAI’s reported interest expired, Google paid roughly $2.4 billion to hire away the founders and a slice of the research team while licensing technology, and Cognition then signed a definitive agreement to acquire the remaining business. Cognition’s official announcement is notable because it discloses operating fundamentals—$82 million ARR, enterprise ARR doubling quarter over quarter, and 350-plus enterprise customers—while also emphasizing that the acquired asset package included the product, IP, trademark, and brand. In other words, Windsurf ceased
    to be an ordinary Series C startup and instead became a carved-up strategic asset whose economic value was realized through talent, technology, and customer-relationship transfers rather than a single clean acquisition.'
