- id: sec-security-and-controls
  title: Security, compliance, and enterprise governance posture
  body: The public trust posture is materially stronger than early Windsurf branding alone would suggest, but it is still partly platform-level rather than product-specific. Enterprise marketing says customer data stays in the customer-controlled environment, can run in a VPC, and is not used for training. Security docs add encryption in transit and at rest, SOC 2 Type II coverage, and an enterprise promise never to train on customer data. The current security workflow pages also describe isolated ephemeral sandboxes, short-lived credentials, secrets redaction, domain allowlists, human-controlled merges, and SIEM-exportable session transcripts. For enterprise rollout, the admin guide adds governance levers over model access, terminal auto-run levels, MCP enablement, and other team settings. The main nuance is that openness creates new governance work. Cognition’s own admin guide warns that MCP can create infrastructure resources outside Devin Desktop’s security monitoring, so enterprises
    still need allowlists and approval processes around external servers and third-party ACP agents. Public documentation is therefore good on controls and process, but still thin on customer-visible reliability metrics and service-level assurances.
