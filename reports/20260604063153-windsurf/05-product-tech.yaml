- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Company solution
  - Measurable benefit / signal
  - Limitation
  rows:
  - - Implement or refactor code locally
    - Prompt in Cascade Code mode, iterate with tools and linter fixes
    - Cascade plans tasks, edits files, and can auto-fix lint issues
    - Designed to keep developer in flow without leaving editor
    - No public pass-rate or error-rate disclosure by workflow
  - - Navigate an unfamiliar codebase
    - Use Fast Context, DeepWiki, and Chat / @-mentions
    - RAG indexing plus symbol-level explanations and pinned context
    - Public docs emphasize exact file/line retrieval and hover explanations
    - Quality claims remain company-reported rather than independently benchmarked
  - - Escalate a bigger task to the cloud
    - Plan locally, then single-click handoff to cloud Devin
    - Cloud VM continues after laptop closes and returns reviewable output in same workspace
    - Shared quotas let Desktop, CLI, and cloud usage fund one workflow
    - Metered pricing makes true unit economics hard to audit publicly
  - - Security remediation or failed-check repair
    - Trigger from GitHub, Jira, Slack, scanners, or webhooks
    - Devin investigates, patches, reruns tests/scanners, and opens PRs
    - Official page cites ~70% automated resolution for named scanners and Itaú backlog work
    - Outcome data is company-claimed and concentrated in selected case studies
  - - Compare against plugin-first assistants
    - Stay in standalone IDE, or host external agents through ACP
    - Dedicated shell for local plus cloud agents instead of only extension UI
    - Artificial Analysis still distinguishes Windsurf as standalone IDE
    - Competitors increasingly match cloud agents, MCP, and enterprise controls
  notes: Workflow rows mix official process descriptions with selective public outcome examples; absence of broad telemetry is itself a diligence point.
