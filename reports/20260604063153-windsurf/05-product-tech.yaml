  rows:
  - - Devin Desktop shell
    - Individual dev + team dev
    - GA; renamed from Windsurf on 2026-06-02
    - Standalone IDE that now acts as agent control surface, not just chat overlay
    - Depends on continued desktop rollout and admin acceptance of rename
    - Need current active-user split between desktop and plugin surfaces
  - - Cascade / Devin Local
    - Everyday coder inside editor
    - GA but being rebranded under Devin Local
    - Local agent keeps editing loop fast and preserves offline-ish workflow
    - Depends on local machine resources, model access, and policy limits
    - Need public success-rate data by task class
  - - Cloud Devin in Desktop
    - Power users and teams offloading longer tasks
    - Rolling out across self-serve plans
    - Single-click handoff from local planning to cloud VM execution
    - Consumes shared quotas and requires connected identity + repo access
    - Need attach-rate data from desktop sessions to cloud sessions
  - - Agent Command Center + Spaces
    - Users managing multiple sessions
    - New primary surface in Windsurf 2.0 / Devin Desktop
    - Unified Kanban view for local and cloud agents with shared context
    - Depends on product adoption of multi-agent workflow, not just single chat
    - Need public evidence of weekly active usage for Spaces
  - - ACP / third-party agents
    - Advanced users and enterprise teams
    - Documented; enabled on Pro/Max/Teams
    - Lets Desktop host Codex, Claude Agent, Junie, Gemini CLI, and custom agents
    - Requires per-team governance and preinstalled agent binaries
    - Need adoption data and pricing mix for third-party agent usage
  - - 'Context stack: Fast Context, DeepWiki, Supercomplete'
    - All users seeking codebase-grounded work
    - Mature core feature set
    - Combines RAG retrieval, symbol explanation, and edit-aware completion inside one IDE
    - Quality depends on indexing, prompt routing, and repo scale
    - Need independent accuracy / hallucination benchmarks for very large repos
  notes: Current public module map synthesized from current desktop, docs, and admin surfaces; gaps are diligence asks rather than inferred absences.
