- id: sec-open-integration-and-pricing
  title: Open agent hosting, integrations, and monetization mechanics
  body: 'Cognition is trying to make the desktop shell more durable than any single model choice. ACP makes the editor an agent host, not just a first-party assistant surface: the docs compare ACP with LSP and explicitly show Codex CLI, Claude Agent, Junie, Gemini CLI, and OpenCode as compatible examples. MCP then broadens the tool layer by connecting Devin to monitoring, databases, documentation systems, and other external services, while the public API splits organization-level session operations from enterprise-level analytics, audit, billing, and infrastructure controls. Pricing has changed just as much as the integration model. Windsurf’s self-serve business moved in March 2026 away from the earlier credit or ACU framing toward quotas plus on-demand usage, and the current public plan stack is Free, Pro at $20, Max at $200, Teams with an $80 minimum plus $40 full seats, and Enterprise custom. Importantly, the quotas span Desktop, CLI, and cloud Devin together. That lowers the entry price
    versus early Devin-era positioning, but it also means the product has become a metered multi-surface bundle whose economics depend on how much work shifts from local agents to cloud execution.'
