chapter:
  number: 5
  title: Product & Technology
  summary: 'Windsurf has effectively evolved into Devin Desktop: the same IDE and plugin-compatible surface, but now reorganized as a command center for local and cloud coding agents. The product’s strongest differentiators are local-to-cloud continuity, codebase context features such as Supercomplete, Fast Context, and DeepWiki, plus open ACP/MCP integration; pricing has shifted toward quota-plus-usage mechanics that lower entry price but make unit economics more metered. Security posture is stronger than early Windsurf branding implied — with SOC 2, VPC, SSO/SCIM/RBAC, audit logs, and SIEM export paths — but public uptime and adoption-mix evidence remain limited.'
sections:
- id: sec-evolution-and-surface
  title: Product continuity and current surface area
  body: 'Windsurf now has to be read as a continuity product, not a shutdown product. The June 2026 transition renamed Windsurf to Devin Desktop, but the FAQ explicitly says it is the same IDE, same editor, and same core feature set under a broader Devin brand umbrella. That continuity matters because it preserves the existing Windsurf user workflow — extensions, keybindings, LSP-style editing behavior, local rules, and JetBrains plugin support — while re-centering the interface around agent orchestration. The homepage and Agent Command Center docs show the intended positioning clearly: the product is no longer just an AI-assisted editor, but a command surface for local and cloud agents, with Spaces used to keep sessions, PRs, files, and task context together. Historical context reinforces that reading. Codeium had already rebranded itself to Windsurf in 2025, and Cognition’s later acquisition post still described Windsurf as the agentic IDE. The post-acquisition move is therefore additive:
    Cognition is keeping the IDE and turning it into the desktop front end for a larger Devin product family rather than replacing it outright.'
