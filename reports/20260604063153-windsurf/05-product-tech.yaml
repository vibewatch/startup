- id: sec-agentic-workflow-and-context
  title: Cascade workflow, context stack, and local-to-cloud handoff
  body: 'The core local workflow remains Cascade, which is more than a side-panel chatbot. The docs describe separate Code and Chat modes, a background planning agent, Todo lists for long tasks, up to 20 tool calls per prompt, queued messages, linter-aware edits, and real-time awareness of what the user has already done in the editor. On top of that local loop, Devin Desktop keeps a differentiated context stack: Tab is powered by an in-house model optimized for flow, Supercomplete can suggest deletions and additions instead of only next-token text, and Fast Context plus the RAG-based context engine are designed to surface the exact files and lines needed for a task. DeepWiki adds symbol-level explanations that can be promoted directly into Cascade. The cloud handoff is the other important architectural element. Devin in Devin Desktop lets a user sketch or investigate locally, then send the work to a cloud Devin VM that keeps running independently and returns reviewable output inside the
    same workspace. That local-to-cloud continuity is the product behavior Windsurf is trying to own.'
