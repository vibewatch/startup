  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability-gap
    missingEvidence: Customer-facing uptime, incident-rate, and SLA commitments for Devin Desktop and cloud Devin.
    whyItMatters: Without service commitments, it is hard to price operational risk for teams that want to shift meaningful engineering throughput into cloud execution.
    diligencePath: Request the current enterprise MSA or service schedule, last 12 months of incident summaries, and internal SLO dashboards segmented by desktop and cloud services.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: adoption-mix
    missingEvidence: The share of Windsurf/Desktop users who actively use cloud Devin, ACP agents, or local-only modes.
    whyItMatters: The monetization and retention story depends on whether the desktop is mainly a lightweight completion surface or a true cross-product orchestration shell.
    diligencePath: Ask for MAU by surface, handoff rates from local to cloud, ACP activation rates, and plan-level gross margin or usage curves for Pro, Max, Teams, and Enterprise cohorts.
  - type: missing-source
    severity: minor
    topic: desktop-compliance-scope
    missingEvidence: A desktop-specific public trust center detailing attestations, data residency, and retention boundaries distinct from broader Cognition platform docs.
    whyItMatters: Enterprise buyers may accept platform-level assurances, but product-specific scope statements reduce ambiguity when desktop, CLI, review, and cloud agents are bundled together.
    diligencePath: Request the current trust-center package, desktop data-flow diagram, and product-specific subprocessor / retention matrix used in enterprise security reviews.
    relatedTableRefs:
    - TE004
