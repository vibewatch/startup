- id: moat-durability-and-adverse-evidence
  title: Moat durability and adverse evidence from Windsurf’s perspective
  body: 'The adverse evidence is what makes this category hard to underwrite. GitHub’s March 2026 privacy
    update drew a sharp line between enterprise accounts and consumer Copilot tiers by saying Free, Pro,
    and Pro+ interaction data may be used for training unless users opt out; that creates a trust segmentation
    opportunity, but only at the edge because GitHub preserved stronger enterprise protections. Devin
    faces a different adverse pattern: Cognition’s original technical report established a 13.86% SWE-bench
    result as a breakout moment in 2024, yet the official SWE-bench ecosystem later publicized much higher
    Verified scores for newer or open agents. That does not prove Devin is weak in production, but it
    does show how quickly benchmark-led differentiation can compress. Cursor’s own strongest adoption
    and preference numbers are company-claimed, which means buyers still need live proof of how much of
    that enthusiasm survives procurement, compliance, and large-repo rollout. Replit’s public material
    also shows how adjacent substitutes can siphon attention away from classic AI IDEs by bundling design,
    deployment, and agent execution in one cloud workspace. From Windsurf’s perspective, the net result
    is sobering: the original promise of being the AI-native middle ground between plugin incumbents and
    fully autonomous agents has narrowed. Durable advantage now depends on proving better trust, deeper
    workflow embed, or measurably better execution on real customer tasks—not simply matching the market
    on price or repeating yesterday’s benchmark headlines.'
