- id: switching-costs-distribution-and-multi-homing
  title: Switching cost, distribution power, and the status quo/internal-build substitute
  body: 'Distribution and switching cost explain more of the category than benchmark screenshots do. GitHub
    can sell Copilot into existing GitHub procurement, repository management, mobile, CLI, and knowledge
    workflows; that makes it the default tool many teams add before they evaluate an AI IDE. Amazon Q
    has a similar advantage inside AWS-heavy environments because identity, billing, console operations,
    and coding support sit inside one familiar administrative surface. Cursor’s switching costs are different:
    once a team standardizes on its VS Code fork, SAML, SCIM, shared rules, cloud agents, automations,
    and Jira handoffs, the tool becomes embedded in day-to-day engineering management rather than sitting
    beside the editor as an optional extension. Tabnine’s stickiness is procurement-led instead of product-led:
    regulated teams that need VPC, on-premises, or air-gapped deployment may have only a small set of
    viable vendors, and that narrows the competitive field immediately. Claude Code is powerful but remains
    local-first and approval-oriented, which makes it easy to pilot alongside existing environments. Replit
    is easy to adopt for greenfield app-building, but that makes it more of a substitute for fast product
    creation than for enterprise repo governance. That leaves one of Windsurf’s most important competitors
    as the status quo itself: teams can multi-home across IDEs, terminals, MCP tooling, CI/CD APIs, and
    vendor-specific agents rather than commit to a single assistant. In that world, buyer inertia benefits
    incumbents and raises the burden on Windsurf to prove it can become the system of record rather than
    just another AI tab.'
