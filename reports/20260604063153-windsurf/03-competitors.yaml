- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim for Windsurf
  - Threat
  - Severity
  - Public evidence
  - Mitigation / diligence ask
  rows:
  - - Agentic execution inside a coding environment is enough differentiation
    - GitHub, Cursor, Amazon Q, Claude Code, and Replit now all market some form of agent workflow
    - High
    - Agent surfaces now span IDEs, terminals, cloud agents, and project tools
    - Measure task-level win rates on real customer repos instead of relying on category labels
  - - Pricing can still win share
    - Copilot Pro $10 and Amazon Q Pro $19 compress the low end while Cursor, Claude, and Devin cluster
      around $20
    - High
    - Official public pricing now sits in a tight band for most serious individual tiers
    - Prove ROI with conversion, cycle-time, or quality data rather than a cheap-seat pitch
  - - Trust posture is adequate for enterprise procurement
    - Tabnine offers VPC/on-prem/air-gap; GitHub and AWS offer stronger admin and contractual surfaces
    - High
    - Competitors increasingly separate consumer experimentation from enterprise governance
    - Document deployment models, training defaults, and customer-controlled admin surfaces
  - - Benchmark leadership can carry the brand
    - SWE-bench headlines are moving faster than product reputations and open agents already exceed early
      Devin launch scores
    - High
    - Official benchmark ecosystem now contains higher Verified results than Devin’s original 13.86% launch
      report
    - Run controlled bake-offs on private customer codebases and publish methodology
  - - Integrations alone create lock-in
    - MCP, IDE extensions, CLIs, and APIs make multi-homing easy for many teams
    - Medium
    - Most rivals now connect to some mix of GitHub, Jira, Slack, terminals, or external tools
    - Track what percentage of customers standardize on the platform versus running it as a second tool
  - - The brand transition is neutral to competitive position
    - The public Windsurf surface now resolves to Devin Desktop, which can blur what exactly buyers are
      evaluating
    - Medium
    - Successor positioning helps automation but reduces the old standalone-IDE identity
    - Request cohort migration, renewal, and expansion data for legacy Windsurf accounts
  notes: Severity reflects investor relevance rather than customer severity alone. Several rows are synthesis
    claims that combine pricing, benchmark, and procurement evidence across multiple competitors.
