  evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-landscape-coverage
    missingEvidence: Comparable public profiles for smaller open-source, vertical-specific, and internal-build
      alternatives that sit below the visibility threshold of this chapter.
    whyItMatters: The competitor profile table is intentionally partial; a refresh could surface niche
      entrants that matter in specific regulated or vertical workflows.
    diligencePath: Run a refresh search across open-source agents, vertical developer tools, and internal
      platform substitutes, then extend the competitor profile table if any show meaningful enterprise
      traction.
    relatedQuestionRefs:
    - QP001
    relatedTableRefs:
    - TP001
  - type: missing-source
    severity: material
    topic: realized-enterprise-pricing
    missingEvidence: Redacted order forms, renewal quotes, AI-credit budgets, and discount schedules for
      Copilot, Cursor, Devin, Amazon Q, and Tabnine enterprise deals.
    whyItMatters: List pricing is a weak proxy for what large customers actually pay, especially when
      usage credits, overages, and deployment commitments enter the contract.
    diligencePath: Request customer invoices, partner quotes, or seller-provided pricing bands so the
      pricing table can compare realized enterprise spend instead of list pricing.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: replit-enterprise-overlap
    missingEvidence: Segment-level customer and revenue evidence showing how much Replit overlaps with
      Windsurf in mature enterprise buying cycles rather than startup or builder use cases.
    whyItMatters: Replit clearly matters as an adjacent substitute, but the public record is thin on how
      often it wins the same large-account evaluations that Windsurf, Cursor, Copilot, or Devin face.
    diligencePath: Obtain segment-level customer references or pipeline data that separates Replit app-building
      buyers from enterprise coding-assistant buyers.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: windsurf-migration-retention
    missingEvidence: Cohort migration, renewal, and expansion data for legacy Windsurf customers after
      the public move to Devin Desktop.
    whyItMatters: Switching-cost and moat claims for the successor surface are much stronger if the installed
      base actually stayed, expanded, and standardized on the new workflow.
    diligencePath: Request migration dashboards, seat expansion data, and renewal cohorts from Cognition
      for accounts that started as Windsurf customers.
    relatedQuestionRefs:
    - QP022
    - QP027
  - type: conflicting-data
    severity: minor
    topic: benchmark-transferability
    missingEvidence: A controlled private-repo bake-off that uses identical tasks, prompts, and review
      standards across Devin, Cursor, Copilot, Amazon Q, and Claude Code.
    whyItMatters: Public benchmark and vendor-claimed evaluation evidence helps frame the market, but
      it does not fully answer how these tools behave on private enterprise codebases with real security
      and change-management constraints.
    diligencePath: Run a customer-side evaluation on one representative monorepo and issue set, then compare
      cycle time, correctness, review burden, and security controls across vendors.
    relatedQuestionRefs:
    - QP019
