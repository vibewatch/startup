  - - GitHub Copilot
    - Incumbent workflow platform
    - 100M+ GitHub developer ecosystem; millions of users; $10-$100 self-serve ladder
    - Broad professional developers and enterprises
    - Native GitHub distribution across IDE, CLI, mobile, and GitHub.com
    - Consumer trust split on training and no support for GitHub Enterprise Server
  - - Cursor
    - IDE-native challenger
    - 64% of Fortune 500 using Cursor; 50,000+ enterprises; >$500M ARR and $9.9B valuation reported
    - Professional engineers and engineering teams
    - VS Code fork plus cloud agents, Jira workflows, and strong developer preference claims
    - No proprietary model and enterprise pricing remains custom
  - - Amazon Q Developer
    - Hyperscaler coding assistant
    - AWS distribution with $19/user/mo Pro and broad admin adjacency
    - AWS-standardized enterprises and cloud-heavy developers
    - IDE/CLI/console coverage plus IAM and operations context
    - Most compelling where AWS is already the standard
  - - Tabnine
    - Privacy-first enterprise niche
    - $39 and $59 list tiers; private deployment options for enterprise
    - Regulated or security-sensitive organizations
    - VPC, on-premises, air-gapped deployment and zero-retention posture
    - Lower mass-market distribution than GitHub, AWS, or Cursor
  - - Replit
    - Cloud app-builder substitute
    - Millions of developers; free to $95 annualized self-serve plans; enterprise custom
    - Startups, product builders, students, and small teams
    - Parallel agents, integrated artifacts, and fast app shipping in one cloud workspace
    - Less obviously matched to mature enterprise repo governance
  - - Claude Code
    - Frontier-model local agent
    - Claude Pro/Max/Team bundle pricing from $20 to $100+
    - Power users and teams that want local control with frontier models
    - Runs locally, uses tests and PRs, and requires explicit approval
    - Less centrally managed than cloud-first enterprise platforms
  - - Devin / successor Windsurf surface
    - Cloud agent and successor platform
    - Free to $200 individual pricing plus team and enterprise plans
    - Teams willing to delegate end-to-end coding work
    - Cloud agents plus GitHub, Slack, Jira, MCP, and dedicated deployment
    - Benchmark edge has compressed and the Windsurf brand is now nested inside a broader product surface
