callouts:
- calloutType: risk
  title: 'Risk: incumbents and open agents are compressing the middle of the market'
  body: Windsurf originally looked differentiated as a more agentic alternative to Copilot without requiring
    the buyer to jump all the way to a fully autonomous coding system. That middle position is now crowded.
    GitHub and Amazon Q added more agent workflows, Cursor deepened IDE-native execution, and official
    SWE-bench evidence shows the broader agent ecosystem improving quickly. The risk is that buyers get
    good-enough autonomy from incumbents and best-available autonomy from other agents before Windsurf
    proves a durable procurement or trust wedge.
  claimRefs:
  - CP033
  - CP034
  - CP035
  - CP042
  - CP045
- calloutType: strength
  title: 'Strength: the successor surface still offers a high-delegation workflow'
  body: The successor Devin surface is not just another chat box bolted onto an editor. Public docs emphasize
    cloud agents, GitHub / Slack / Jira connectivity, MCP extensibility, enterprise admin controls, dedicated
    deployment, and opt-in training defaults. For customers that want unattended execution with human
    review rather than only suggestions, that remains a meaningful product posture—even if it is no longer
    a unique one.
  claimRefs:
  - CP027
  - CP028
  - CP039
