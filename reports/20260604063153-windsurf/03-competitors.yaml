- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor
  - Entry self-serve price
  - Team / business signal
  - Enterprise posture
  - Packaging nuance
  - Windsurf implication
  rows:
  - - GitHub Copilot
    - Free $0; Pro $10; Pro+ $39; Max $100
    - Business and Enterprise are centrally managed and credit-pooled
    - Enterprise DPA, policy controls, GitHub.com indexing
    - Heavy agent usage also consumes AI credits and some workflows consume GitHub Actions minutes
    - Cheapest credible incumbent and easiest add-on for GitHub-heavy teams
  - - Cursor
    - Hobby free; Individual $20
    - Teams $40/user/mo
    - Enterprise custom
    - Premium models, cloud agents, Bugbot, team marketplace, privacy mode
    - No longer leaves much room for Windsurf to compete purely on price
  - - Amazon Q Developer
    - Free tier at zero cost
    - Pro $19/user/mo
    - IAM Identity Center and AWS account administration
    - Transformation overages billed by LOC at $0.003
    - A near-price-parity alternative with stronger hyperscaler procurement alignment
  - - Tabnine
    - Code Assistant $39/user/mo
    - Agentic Platform $59/user/mo
    - Private deployment available
    - Higher list price paired with no-training and private deployment choices
    - Trust-led buyers may pay a premium to avoid cloud-only tradeoffs
  - - Replit
    - Starter free with daily Agent credits
    - Core $20 annual / $25 monthly; Pro $95 annual / $100 monthly
    - Enterprise custom with SSO/SAML and privacy controls
    - Credit-led pricing matches app-building and runtime usage more than seat-based coding assistance
