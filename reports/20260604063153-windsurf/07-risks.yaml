- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Ownership transition failure
    - Legacy Windsurf attrition, support disruption, or integration slippage
    - Two consecutive quarters of material legacy-team attrition or visible enterprise-support degradation
    - Stop treating transition as temporary noise; re-underwrite customer durability and product roadmap credibility
  - - Provider access or policy shock
    - Anthropic or OpenAI terms, limits, pricing, or model catalog changes
    - Suspension, hard quota reduction, or provider cost increase large enough to impair current pricing without offset
    - Rework margin model immediately and downgrade confidence until fallback rights are proven
  - - Security / governance failure
    - Confirmed prompt-injection incident, secrets leak, or bad merge reaching production despite controls
    - Any public incident showing human review did not contain agentic failure on a material customer workflow
    - Treat as thesis-break pending incident response review and customer-churn impact analysis
  - - Competitive distribution or pricing squeeze
    - Large-enterprise competitive losses or forced effective price cuts
    - Need to cut effective pricing materially while ARR quality or renewal velocity weakens
    - Shift base case to lower margin and shorter moat duration; avoid underwriting premium multiples
  - - Regulated-market readiness gap
    - Failed enterprise diligence, enforcement event, or inability to evidence compliance for a target segment
    - Any major regulated or public-sector opportunity blocked by missing controls or unresolved compliance ownership
    - Move regulated-market upside out of the base case until control evidence is produced
  notes: These thresholds are designed as decision rules, not generic watch-items; each one changes underwriting if triggered.
