  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: model-provider-contracts
    missingEvidence: Current Anthropic/OpenAI commercial terms, minimum-spend commitments, notice periods, suspension rights,
      and fallback rights for the combined Windsurf/Devin business.
    whyItMatters: Without vendor-contract detail, investors cannot underwrite whether current pricing survives a provider
      policy or cost shock.
    diligencePath: Request executed provider agreements, current model-routing mix, and any pre-negotiated fallback or self-hosting
      rights.
    relatedQuestionRefs:
    - QR024
  - type: private-evidence-only
    severity: material
    topic: governance-and-retention
    missingEvidence: Post-acquisition org chart, board oversight for the split transaction, succession plan, retention grants,
      and voluntary attrition by function for legacy Windsurf teams.
    whyItMatters: Ownership-transition risk depends on who still runs the product and whether key operators stayed long enough
      to preserve customer continuity.
    diligencePath: Request a post-close integration memo, monthly attrition dashboard, leadership roster, and support/CS coverage
      by top account.
    relatedQuestionRefs:
    - QR029
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin by plan, provider mix, overage take-rate, top-customer concentration, NRR, churn, and usage
      economics for the integrated Windsurf/Devin business.
    whyItMatters: Pricing pressure and API pass-through risk cannot be fully underwritten without actual unit-economics and
      retention data.
    diligencePath: Request management P&L bridge, cohort retention, provider COGS mix, and top-10-customer revenue concentration.
    relatedQuestionRefs:
    - QR030
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-register
    missingEvidence: Jurisdiction-by-jurisdiction inventory of all sector rules that bind the combined Windsurf/Devin offering
      in government, financial services, healthcare, and EU deployments.
    whyItMatters: The legal register below is intentionally severity-ranked, not exhaustive, so edge-case sector rules could
      still surprise diligence.
    diligencePath: Build a compliance matrix by jurisdiction and regulated-customer segment, then re-rank the register with
      legal counsel.
    relatedQuestionRefs:
    - QR014
    - QR016
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: Public bug-bounty program, latest independent pentest summary, uptime/SLA history, and any post-acquisition
      security incident log for the current surface.
    whyItMatters: Control claims are easier to trust when independent assurance and incident response quality are visible
      over time.
    diligencePath: Request trust-center packet, post-close incident register, and last-two-quarters uptime report before underwriting
      enterprise durability.
    relatedQuestionRefs:
    - QR020
