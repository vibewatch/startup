- id: mitigation-monitoring-and-kill-triggers
  title: Mitigations, monitoring indicators, and thesis-break triggers
  body: 'Public mitigations exist, but their maturity is uneven. The best visible controls are at the workflow level: isolated
    execution, human-controlled merges, branch protections, repo and tool scoping, and audit trails. The weakest area is operating
    transparency after the transaction. There is no public board-level account of who governs the split asset, no disclosed
    provider-contract hedge, no public retention dashboard, and no unit-economics view that tells investors how much pricing
    room remains if model costs or competitive pressure worsen. That means monitoring discipline has to do the heavy lifting.
    The most useful indicators are voluntary attrition among legacy Windsurf operators, enterprise-customer retention, provider-term
    changes, extra-usage realization, and any security event that breaks the premise that human review contains agentic risk.
    The thesis should also be stress-tested against market signals: if Copilot or Cursor keep gaining enterprise share while
    Windsurf must discount to hold accounts, the current revenue base could become lower-quality than the headline ARR suggests.
    For diligence, the chapter’s kill criteria are intentionally concrete: they translate control-transition, provider, security,
    and competition risk into monitorable events that can force an immediate underwriting reset instead of letting risk drift
    hide behind category momentum.'
  claimRefs:
  - CR018
  - CR020
  - CR032
  - CR039
  - CR040
  - CR043
