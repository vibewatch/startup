      - number: '4.4'
        title: Undisclosed financials and the underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              The biggest analytical constraint is not demand discovery; it is disclosure quality. Public sources are
              enough to show that Windsurf became strategically valuable, reached meaningful ARR, and developed a real
              enterprise business. They are not enough to tell an investor how durable or profitable that business was
              on a standalone basis. Missing from the public record are the classic underwriting metrics: GAAP revenue,
              deferred revenue, net and gross retention, churn by segment, CAC, payback, ACV distribution, contract
              term, gross margin by plan or model family, and post-acquisition migration retention. Even the
              post-acquisition financing data for Cognition contains conflicting round-size reports.


              That gap structure leads to a careful verdict. Revenue quality is real but not pristine: the business
              clearly found product-market fit and buyer urgency, yet the public record cannot disentangle self-serve
              from enterprise mix or tell us how much of the $82M ARR held through the model-access and ownership shock.
              Margin path is improving in design but not proven in numbers: the shift from flow-action credits to prompt
              credits to quotas and API-priced overages is exactly what one would expect from a company trying to stop
              undercharging for expensive agent sessions, but none of those steps prove positive contribution margin.
              Capital adequacy is less of a standalone issue now than integration governance and retention inside
              Cognition.


              Overall, Windsurf should be viewed as a strategically important developer-tools asset whose demand signal
              was strong enough to attract multiple buyers, but whose standalone financial statements remain too
              incomplete for high-confidence independent underwriting. The right diligence next step is private data
              access, not more public extrapolation.
