      - number: '7.3'
        title: Competition, distribution, and unit-economics risk
        blocks:
          - type: paragraph
            body: >-
              Competition is not just intense; it is structurally asymmetric. GitHub can pair Copilot cloud agents with
              centralized policy control and broad model access, while Cursor is already marketing enterprise security,
              zero-data-retention controls, and meaningful Fortune 500 penetration. Public evidence also shows the
              category’s compute economics are unstable: GitHub paused new Copilot sign-ups in April 2026 and outside
              reporting says agentic workloads forced usage caps and model downgrades. That matters because Windsurf’s
              current pricing is ambitious relative to the category, yet it still lets customers buy extra usage at API
              pricing, which pushes supplier cost volatility into either gross margin or customer bills. Cursor’s
              scale—$200 million ARR in April 2025 and above $500 million by June 2025—shows that rivals have the budget
              to subsidize price, enterprise sales, and security marketing simultaneously. OpenAI and Anthropic are even
              more problematic because they can attack from both ends of the stack: they can change model terms upstream
              and ship Codex or Claude Code downstream. Public benchmarks and comparison sites make the field more
              legible to buyers, which reduces the half-life of differentiation by narrative alone. The residual
              exposure here is high: Windsurf must prove it can defend enterprise retention and realized ROI even if
              competitors keep improving faster, bundling harder, or rationing compute more intelligently.
