      - number: '1.2'
        title: Founders, leadership changes, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Public founder attribution is narrower than the prompt’s initial context suggests. The higher-quality
              public profiles reviewed for this run consistently identify Varun Mohan and Douglas Chen as the founding
              pair, with Mohan serving as CEO and Chen serving as the key technical co-founder. After Google’s July 2025
              reverse-acquihire, interim leadership shifted to Jeff Wang, whose public statements framed the following
              days as a crisis-response transition rather than a planned succession. Governance visibility remains poor.
              Neither the company’s own pages nor the accessible third-party profile pages disclose a board roster,
              independent directors, or shareholder-control mechanics in enough detail to underwrite governance quality.
              That opacity matters because the company experienced a highly unusual split-transaction outcome: Google
              hired away the top technical leadership without taking control, and Cognition then acquired the remaining
              operating business. The lack of public governance detail makes it hard to reconstruct who negotiated what
              protections for minority holders, remaining employees, or customers during that handoff.
