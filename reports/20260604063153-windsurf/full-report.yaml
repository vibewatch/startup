      - CV016
      - CV017
      - CV018
      - CV019
      - CV029
      - CV031
      - CV033
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: Low, base, and high look-through value ranges for bear, base, bull, and re-open-entry scenarios.
    data:
      items:
        - label: Bear case value ($M)
          low: 0
          mid: 200
          high: 400
          note: Residual equity heavily impaired or economically extinguished
        - label: Base case value ($M)
          low: 800
          mid: 1000
          high: 1200
          note: Discounted underwriting range for opaque but surviving asset value
        - label: Bull case value ($M)
          low: 1600
          mid: 1900
          high: 2200
          note: Assumes intact customer base and high-end comp support
        - label: Re-open entry ceiling ($M)
          low: 700
          mid: 850
          high: 1000
          note: Price band that could offset some of the current ownership opacity
    approximationNotes: >-
      These ranges are not public marks or round prices; they are synthetic values for decision-making under incomplete
      ownership information.
    claimRefs:
      - CV048
      - CV049
      - CV050
      - CV055
      - CV056
      - CV057
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: IC-style scorecard separating strong asset demand from weak standalone investability.
    data:
      items:
        - label: Market demand
          value: 4/5
          detail: AI coding remains a strategic category with strong buyer interest
        - label: Product / customer proof
          value: 4/5
          detail: $82M ARR and 350+ enterprise customers imply real commercial traction
        - label: Strategic interest
          value: 5/5
          detail: OpenAI, Google, and Cognition all pursued the asset in 2025
        - label: Ownership clarity
          value: 1/5
          detail: No public cap table, allocation bridge, or clean post-deal security map
        - label: Valuation support
          value: 2/5
          detail: Only discounted synthetic ranges look supportable for a new investor
        - label: Exit clarity
          value: 1/5
          detail: No public evidence of a fresh standalone exit path after the carve-up
        - label: Evidence quality
          value: 3/5
          detail: Transaction facts are clear, but stakeholder economics remain partially hidden
    approximationNotes: >-
      The scorecard is a qualitative IC summary, not a machine-scored model, and it intentionally weights ownership
      clarity more heavily than product excitement.
    claimRefs:
      - CV025
      - CV032
      - CV041
      - CV049
      - CV055
      - CV056
      - CV057
