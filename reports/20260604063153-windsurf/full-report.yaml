            title: Compute economics and legal uncertainty can still compress the category
            body: >-
              The category’s biggest risk is not lack of interest but the cost and governance burden of sustained agent
              use. GitHub’s pauses and usage caps, plus unresolved copyright questions around generated code, show that
              successful adoption can create margin pressure and legal friction at the same time.
