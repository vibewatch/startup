      - CV007
      - CV009
      - CV018
      - CV033
      - CV055
      - CV056
      - CV057
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      Synthetic value outcomes for Windsurf under different benchmark multiples anchored to public and private
      references.
    data:
      items:
        - label: GitLab-like 6.9x on $82M ARR
          value: 566
          detail: $M look-through value using public lower-band comp
        - label: Base 10x on $82M ARR
          value: 820
          detail: $M entry point for discounted underwriting
        - label: Series C benchmark 15.2x
          value: 1250
          detail: $M last clean standalone round
        - label: Cursor-like 19.8x
          value: 1624
          detail: $M if Windsurf were still an intact leader
        - label: Google transaction print 29.3x
          value: 2400
          detail: $M strategic talent plus license figure
        - label: OpenAI interest 36.6x
          value: 3000
          detail: $M failed bid reference, not a closed deal
    approximationNotes: >-
      Bars are synthetic outputs in $M and intentionally compare unlike references on one common $82M ARR denominator to
      show how quickly the headline values diverge.
    claimRefs:
