      - number: '1.4'
        title: Scale markers, current surface, and adverse integration evidence
        blocks:
          - type: paragraph
            body: >-
              Windsurf’s latest independently valuable scale markers sit in two layers. The first is pre-integration
              operating scale: Sacra estimates roughly $82 million ARR by July 2025, more than 800,000 active developers
              by early 2025, over 1,000 business customers, and more than 100 billion tokens processed daily. The second
              is the current successor-product surface: the Devin Desktop homepage claims more than 1 million users and
              more than 4,000 enterprise customers, indicating that the installed base was at least preserved and likely
              expanded under the new product wrapper. Still, the post-deal evidence is not uniformly positive. Economic
              Times and WinBuzzer both describe layoffs, buyouts, and extreme work expectations after Cognition took
              over the remaining Windsurf business. Those signals do not negate the quality of the asset that was
              acquired, but they do raise integration and retention risk. For diligence, the right conclusion is that
              Windsurf built a meaningful, fast-growing enterprise developer-tools business, yet the investable entity
              has already transformed into a post-transaction operating component rather than an intact private company
              raising a next round.
