      - number: '8.3'
        title: Synthetic Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              The bull, base, and bear work should be read as a synthetic look-through valuation, not as a quoted market
              price. In a bull case, most of Windsurf’s $82M ARR base remains economically intact inside the remainder
              that Cognition bought, customer relationships prove sticky, and a future buyer underwrites the asset near
              Cursor-like or high-end public-comp multiples. That can support roughly $1.6B to $2.2B of value. The base
              case is more conservative and, in my view, more decision-useful: apply a 10x to 15x band to the disclosed
              ARR, then discount for founder departure, unverified retention of the enterprise base, and the fact that
              public holders do not know the surviving waterfall. That yields roughly $0.8B to $1.2B. The bear case is
              not theoretical; it is the logical consequence if the economic value was already realized through Google’s
              compensation and licensing package and the undisclosed Cognition purchase allocation, leaving residual
              shareholders with heavily subordinated or effectively extinguished claims. Under that frame, look-through
              value can fall toward $0 to $0.4B. Because there is no public evidence of a fresh financing process or a
              clean secondary security, the scenario work leads to entry discipline rather than enthusiasm.
            claimRefs:
