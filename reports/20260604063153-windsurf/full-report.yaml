  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ownership transition and control risk
        blocks:
          - type: paragraph
            body: >-
              Windsurf’s highest-severity risk is that the company no longer exists as a clean, founder-led operating
              unit. The Google hire-away removed the CEO, co-founder, and key research leaders, while Cognition signed
              for the remaining product, brand, IP, and customer base. That split means ownership of core talent and
              ownership of the operating business diverged at the exact moment the asset needed continuity. The
              remaining business was not small: Cognition disclosed roughly $82 million of ARR, more than 350 enterprise
              customers, and hundreds of thousands of daily active users. In other words, integration failure would not
              merely delay upside; it could impair a large installed base and a real revenue stream. Public mitigation
              is only partial. Cognition promised respectful treatment and immediate continuity, but it also said it
              would invest heavily in folding Windsurf into its own stack. Subsequent adverse reporting on layoffs,
              buyouts, and a harder work culture raises the likelihood that product, support, and go-to-market
              continuity could degrade before customers see the promised product upside. The investment implication is
              straightforward: this is a critical-impact risk with only partial mitigation maturity, and diligence
              should treat retention and customer continuity metrics as first-order gating items rather than background
              HR noise.
            claimRefs:
              - CR001
              - CR002
              - CR003
