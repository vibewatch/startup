companyProfile:
  summary: >
    Windsurf began in 2021 as Exafunction, pivoted into AI coding software as Codeium, and became one of the
    fastest-growing AI developer-tools startups after launching the Windsurf Editor in late 2024. The product thesis
    combined IDE-native assistance, codebase context, agentic workflows, and enterprise deployment controls for
    organizations that wanted more than a plugin-only coding copilot.


    The company’s independent venture story effectively ended in July 2025. Google hired away key founders and technical
    leaders in a large talent-and-licensing transaction, while Cognition acquired the remaining product, IP, brand,
    team, and customer base. By the 2026 run date, windsurf.com resolves to Devin Desktop, meaning the core diligence
    question is no longer whether Windsurf can raise the next clean round, but how much strategic and product value
    survived the transition into successor ownership.
