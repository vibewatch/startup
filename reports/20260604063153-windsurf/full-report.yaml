  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: Decision path from asset quality and strategic demand through ownership opacity to the avoid recommendation.
    data:
      nodes:
        - id: n1
          label: Asset quality
          type: input
          detail: $82M ARR, 350+ enterprise customers, hundreds of thousands of DAU
        - id: n2
          label: Strategic demand
          type: input
          detail: OpenAI, Google, and Cognition all pursued Windsurf within days
        - id: n3
          label: Ownership opacity
          type: process
          detail: No public cap table, purchase allocation, or surviving security map
        - id: n4
          label: Comparable band
          type: process
          detail: Cursor and combined Cognition clear ~20x; public comps span roughly 7x to 24x
        - id: n5
          label: Entry test
          type: process
          detail: Can a new investor buy a clean transferable claim at a discounted price?
        - id: n6
          label: 'Recommendation: Avoid'
          type: output
          detail: Do not underwrite standalone Windsurf until rights and price become legible
      edges:
        - from: n1
          to: n5
          label: supports interest
        - from: n2
          to: n5
          label: raises benchmark
        - from: n3
          to: n5
          label: blocks underwriting
        - from: n4
          to: n5
          label: sets discount need
        - from: n5
          to: n6
          label: fails today
    approximationNotes: >-
      The flow compresses multiple valuation facts into a single IC-style decision chain rather than a deterministic
      financial model.
    claimRefs:
