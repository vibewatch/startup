chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, branding, and current operating shell
        blocks:
          - type: paragraph
            body: >-
              Windsurf’s corporate story is no longer a simple Series C software-company narrative. The business began
              as Exafunction in 2021, focused on GPU optimization infrastructure, then pivoted in 2022 into AI coding
              assistance under the Codeium name. The official April 2025 rebrand post makes clear that management viewed
              the November 2024 Windsurf Editor launch as the decisive turning point: the company wanted to move from
              being understood as a code-completion extension toward being recognized as an agentic development
              environment. By run date, that transition has gone one step further. Both windsurf.com and codeium.com now
              resolve to Devin Desktop, and the live homepage explicitly tells legacy Windsurf users that their plans,
              pricing, extensions, and settings carry over through an over-the-air upgrade. For diligence purposes, this
              means the standalone Windsurf brand still matters historically, but the customer-facing operating shell is
              now a successor product surface inside a broader Cognition-led stack. That materially changes both the
              investment frame and the comparability set for later chapters.
