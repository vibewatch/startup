      - number: '3.2'
        title: Capability, pricing, and trust posture by competitor
        blocks:
          - type: paragraph
            body: >-
              On list pricing alone, Windsurf no longer owns an obvious value wedge. GitHub Copilot’s self-serve ladder
              starts at $10 for Pro and runs to $100 for Max, while Amazon Q Pro is $19 per user per month, Cursor
              Individual is $20 and Teams is $40 per user per month, Claude Code rides inside Claude Pro at $20 monthly
              or $17 with annual billing, and Devin’s current successor surface starts at $20 with a $200 Max tier.
              Tabnine sits higher at $39 for its code assistant and $59 for its agentic platform, but that premium buys
              a different procurement story: VPC, on-premises, and fully air-gapped deployment plus explicit
              zero-retention and no-training language. Replit’s surface is even more usage-shaped, with free daily agent
              credits at the Starter level, Core at $20 monthly when billed annually, and Pro at $95 monthly when billed
              annually. Capability breadth has also converged. GitHub now offers agent workflows across GitHub and the
              terminal, Cursor extends from editor-native agents into cloud agents and Jira, Amazon Q bundles coding
              help with AWS operations, Claude Code runs tests and opens pull requests from the local machine, Replit
              pushes parallel app-building agents, and Devin layers cloud execution on top of GitHub, Slack, Jira, MCP,
              and dedicated deployment options. From Windsurf’s perspective, the remaining whitespace is not raw feature
              checkboxes. It is whether a buyer values deep autonomous execution enough to tolerate a weaker trust or
              distribution posture than hyperscalers and privacy-first vendors can offer.
