      - number: '4.3'
        title: Capital adequacy through Series C and after the 2025 ownership change
        blocks:
          - type: paragraph
            body: >-
              Windsurf’s clean standalone capital story ends at Series C. Public summaries consistently place total
              capital raised at roughly $243M, with a $150M Series C at a $1.25B valuation in August 2024. That is
              enough financing to show the company was not operating from a position of obvious capital starvation
              immediately before the 2025 transaction sequence. But July 2025 fundamentally changed what “runway” means.
              Google’s roughly $2.4B talent-and-technology deal did not buy the company whole; Cognition then agreed to
              buy the remaining business, including product, IP, brand, and operating revenue base, for an undisclosed
              amount. After that point, the relevant solvency question shifted from Windsurf’s standalone burn to
              Cognition’s willingness and ability to fund integration and continued product development.


              On that narrower question, the parent looks adequately financed. Multiple high-quality outlets reported
              that Cognition raised roughly $400M at a $10.2B valuation in September 2025, while another report
              described the same round as nearly $500M at a $9.8B valuation. The discrepancy itself is a disclosure gap,
              but both versions point in the same direction: the buyer had fresh capital soon after closing the deal.
              VentureBeat and TechCrunch also both repeated that Cognition’s net burn had stayed under $20M since
              founding while Devin scaled from $1M ARR in September 2024 to $73M ARR in June 2025, implying unusual
              capital efficiency before the raise.


              That does not mean there is no financial risk post-acquisition. Layoffs and nine-month buyout offers
              indicate real integration expense, possible customer-service discontinuity, and employee-retention stress.
              But the risk is integration quality and retained revenue, not near-term liquidity at the product-surface
              level.
