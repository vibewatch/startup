            body: >-
              The important proof point is not one headline TAM number. It is that developers already trial these tools
              at very high rates, vendors already charge meaningful recurring seat prices, and AI-native editors already
              show revenue and enterprise scale. Windsurf is competing for a real software budget line, not for a
