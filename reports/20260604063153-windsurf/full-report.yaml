              Windsurf clearly built a real business: $82M ARR, 350+ enterprise customers, and a large user base are too
              much signal to dismiss. The problem is not whether demand existed; it is that the public record does not
              disclose how much of that ARR was enterprise versus self-serve, how cohort retention behaved, or how much
              of the base survived the ownership and model-access shock. Treat revenue quality as medium, not pristine.
