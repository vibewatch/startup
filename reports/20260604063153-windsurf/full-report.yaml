      - number: '1.3'
        title: Funding history and the 2025 transaction sequence
        blocks:
          - type: paragraph
            body: >-
              As a standalone venture-backed company, Windsurf’s cleanest capital story ends with the August 2024 Series
              C: roughly $150 million led by General Catalyst, bringing cumulative capital raised to about $243 million
              and valuation to about $1.25 billion. After that point, the company became strategically valuable in a way
              that outgrew conventional venture-stage labeling. Sacra and TechCrunch both describe a July 2025 sequence
              in which OpenAI’s reported interest expired, Google paid roughly $2.4 billion to hire away the founders
              and a slice of the research team while licensing technology, and Cognition then signed a definitive
              agreement to acquire the remaining business. Cognition’s official announcement is notable because it
              discloses operating fundamentals—$82 million ARR, enterprise ARR doubling quarter over quarter, and
              350-plus enterprise customers—while also emphasizing that the acquired asset package included the product,
              IP, trademark, and brand. In other words, Windsurf ceased to be an ordinary Series C startup and instead
              became a carved-up strategic asset whose economic value was realized through talent, technology, and
              customer-relationship transfers rather than a single clean acquisition.
