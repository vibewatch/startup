      - number: '7.2'
        title: Model-provider dependency, security, and regulatory risk
        blocks:
          - type: paragraph
            body: >-
              The next risk layer is the combination of upstream model dependency and agentic-security exposure.
              Windsurf’s own partner story says Claude powers core reasoning and planning in Cascade, while current
              Devin pricing advertises access to OpenAI, Claude, and Gemini frontier models. That is useful
              diversification, but it does not remove supplier power; it embeds the product inside a moving set of
              third-party pricing, quota, and policy regimes. Anthropic and OpenAI both reserve broad rights around
              access, and Anthropic’s own product page says limits and price changes can happen at its discretion. At
              the same time, Devin’s integrations and MCP support widen the blast radius of mistakes: the docs
              acknowledge hallucinations and insecure code are still possible, even as they market sandboxes, per-tool
              scoping, default-deny egress, and human-controlled merges. OWASP and CISA reinforce that prompt injection,
              insecure plugins, excessive agency, and poor secure deployment practices are core agentic-AI risks rather
              than edge cases. Regulatory exposure is real but manageable. The EU AI Act now applies GPAI transparency
              and copyright obligations, while U.S. copyright policy remains unsettled. The right conclusion is that
              Windsurf’s security and regulatory posture is investable only if management can prove enterprise controls
              with independent evidence, not just product copy, and if it can show that post-acquisition operations
              still meet the standard implied by regulated buyers.
