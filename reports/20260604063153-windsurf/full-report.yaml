  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model transition and mix visibility
        blocks:
          - type: paragraph
            body: >-
              Windsurf’s monetization story is auditable in three phases rather than one stable SaaS plan sheet. In
              April 2025, the company publicly simplified pricing by eliminating flow action credits and moving to
              prompt-credit plans: Pro at $15 per month, Teams at $30 per user per month, and Enterprise at $60 per user
              per month, with pooled add-on credits and enterprise deployment options. In March 2026, the company moved
              again, this time replacing credits with daily and weekly quotas, keeping Free and Pro, adding a new $200
              Max tier, and shifting paid overages to API-priced usage. By the June 2026 run date, the live customer
              surface is no longer branded as standalone Windsurf but as Devin Desktop, where Free, Pro, Max, Teams, and
              Enterprise still exist but the team package has become an $80 base plus $40 per full developer seat. That
              timeline matters because it shows repeated efforts to keep monetization aligned with agent cost and
              customer psychology as model behavior changed.


              The revenue mix is directionally visible but not quantitatively disclosed. Official acquisition materials
              confirm that Windsurf was already an $82M ARR business by July 2025, with enterprise ARR doubling quarter
              over quarter and more than 350 enterprise customers, while Sacra’s earlier estimates still showed hundreds
              of thousands of users and over 1,000 businesses in the broader customer base. The combined picture is
              consistent with a PLG-to-enterprise funnel: free and paid self-serve plans created usage and distribution,
              then teams and enterprise layers monetized centralized billing, analytics, deployment, and security needs.
              What is missing is the exact split. No public source says what percentage of ARR came from low-ARPU
              self-serve seats versus larger enterprise contracts, so the right underwriting posture is to treat the mix
              as enterprise-leaning in monetization but still materially dependent on a self-serve funnel for new logo
              creation.
