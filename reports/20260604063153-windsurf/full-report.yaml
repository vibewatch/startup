  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, competitor classes, and the buyer’s first choice
        blocks:
          - type: paragraph
            body: >-
              Windsurf now sits in a market where buyers can solve the same job through several very different channels.
              GitHub Copilot and Amazon Q Developer are the default incumbent options because they ride existing
              developer and cloud control planes rather than asking teams to adopt a brand-new environment. GitHub
              markets Copilot across GitHub.com, IDEs, terminals, project tools, chat apps, and MCP servers, while
              GitHub’s own platform scale crossed 100 million developers and 518 million projects in 2024. AWS does
              something similar inside the cloud stack: Amazon Q spans the IDE, CLI, AWS Console, Slack, Teams, and even
              GitHub preview workflows, making it the most natural substitute for teams already standardized on AWS
              identity and operations. Cursor is the most important direct IDE-native rival because it combines a VS
              Code fork with cloud agents, Jira workflow hooks, and company-claimed enterprise penetration across 64% of
              the Fortune 500 and 50,000-plus enterprises. Tabnine attacks from the trust-led side with private
              deployment options, while Replit attacks from the app-builder side with parallel agents and browser-native
              product building. Claude Code and Devin push further toward higher-delegation agent workflows. The
              strategic takeaway is that Windsurf is no longer competing against one monolithic AI coding assistant
              category; it is competing against incumbents that own distribution, challengers that own workflow depth,
              and agent-native tools that promise more autonomy than autocomplete ever could.
