  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: customer-denominators
    missingEvidence: A management bridge that reconciles the historical 1,000+ enterprise-customer claim, the 350+ acquisition snapshot, and the current 4,000+ successor-surface claim with consistent account definitions.
    whyItMatters: Without a denominator bridge, investors cannot tell whether the customer base actually expanded, whether definitions changed, or how much of the current footprint belongs to Devin rather than historical Windsurf.
    diligencePath: 'Request a management memo mapping each public count to its exact denominator: active paid enterprise accounts, total businesses, paid seats, free orgs, and combined-platform customers.'
    relatedQuestionRefs:
    - QU019
    relatedTableRefs:
    - TU006
  - type: private-evidence-only
    severity: material
    topic: conversion-rates
    missingEvidence: Free-to-paid, paid-to-Team, and Team-to-Enterprise conversion rates, plus active-seat utilization by cohort.
    whyItMatters: The chapter can describe a plausible PLG motion, but without conversion rates it cannot quantify how durable or efficient that funnel really is.
    diligencePath: Request funnel reporting by quarter, including free WAU, paying individuals, active Team workspaces, enterprise accounts, and conversion timing.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU001
    - TU002
  - type: private-evidence-only
    severity: material
    topic: concentration-and-renewals
    missingEvidence: Top-customer revenue share, top-ten concentration, renewal rates, contract terms, and expansion-vs-renewal bookings split.
    whyItMatters: Public evidence shows strong adoption proxies, but it does not reveal whether a small number of large accounts dominate ARR or whether renewals are keeping pace with new-logo growth.
    diligencePath: Request cohort-level renewal waterfalls and a customer concentration schedule with ACV bands, renewals, and logo churn over the last four quarters.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU004
    - TU005
  - type: enumeration-incomplete
    severity: material
    topic: historical-logo-depth
    missingEvidence: A fuller historical Windsurf customer list with deployment stage, use case, and referenceability for marquee accounts such as Zillow, Dell, and Anduril.
    whyItMatters: Historical logo-only proof can overstate customer quality if those accounts were pilots, small teams, or one-off departmental deployments rather than scaled enterprise standards.
    diligencePath: Request historical CRM exports or customer-reference decks that show account status, seat counts, and named executive sponsors for pre-acquisition Windsurf logos.
    relatedQuestionRefs:
    - QU003
    - QU010
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, seat-retention, and usage-retention data by plan tier and enterprise size.
    whyItMatters: Public usage anecdotes and case-study expansion do not establish whether the broader customer base is renewing or simply being replaced by new logos.
    diligencePath: Request monthly retention dashboards split between self-serve, Team, and Enterprise, plus post-pricing-change churn by cohort.
    relatedQuestionRefs:
    - QU013
    relatedTableRefs:
    - TU004
