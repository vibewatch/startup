chapter:
  number: 6
  title: Customers
  summary: |-
    Historical Windsurf clearly achieved product-led scale — Anthropic and Sacra point to roughly 800,000+ active developers and 1,000+ enterprise customers by early 2025, while Cognition and TechCrunch said the business still carried 350+ enterprise accounts and hundreds of thousands of daily active users at acquisition. Public proof quality, however, is uneven: historical Windsurf evidence is logo- and aggregate-metric heavy, whereas current Devin / Cognition successor surfaces provide detailed case studies for Nubank, Ramp, Litera, Gumroad, Hamming, AngelList, Itaú, Bilt, Linktree, Crossmint, and Evinova, plus a current homepage claim of 1M+ developers and 4,000+ enterprise customers. NRR, GRR, concentration, and conversion rates remain undisclosed, and pricing backlash on Trustpilot shows durability risk even as the combined platform now claims <5% customer overlap and >30% enterprise ARR growth in the seven weeks after the deal.
acknowledgedWarnings: []
sections:
- id: buyers-users-payers
  title: Buyer / User / Payer Segmentation
  body: |-
    Windsurf’s customer map is best understood as a three-layer buyer/user/payer stack rather than a single segment. Historically, Codeium/Windsurf used a classic product-led funnel: free individual developers entered first, team leads or engineering managers expanded usage inside repositories, and enterprise buyers stepped in only once identity, governance, and deployment controls mattered. Sacra describes this motion explicitly as bottom-up adoption that converts organic developer usage into team-wide and then enterprise-wide deployment. The current successor pricing page still reflects the same ladder: Free, Pro, Max, Team, and contact-sales Enterprise. That means the primary user remains the software developer, the day-to-day internal champion is usually an engineering lead or platform owner, and the economic buyer is a centralized engineering, IT, or procurement budget owner once SSO, VPC, and admin controls enter the conversation.

    The segment mix is broader than generic “developers.” Historical Windsurf proof points cluster around enterprise development teams working on large, complex codebases, with Sacra naming Dell, Zillow, and Anduril as public customers and Anthropic describing years of enterprise codebase work. The current successor surface widens that mix further: Ramp and Bilt show fintech/platform engineering teams, Litera legal-tech QA and release engineering, Hamming AI infrastructure teams, AngelList data engineering, and Evinova regulated clinical software teams. Gumroad and Linktree also show that once the product is embedded, non-engineering functions such as product, support, and marketing can use the agent indirectly or directly. That expands user breadth, but it also makes budget ownership more complicated because the tool can start in engineering and later touch broader operating teams.
