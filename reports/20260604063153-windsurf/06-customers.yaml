- id: named-customer-proof
  title: Named Customer Proof Quality
  body: |-
    Named customer proof is where the evidence quality gap between historical Windsurf and the current Cognition/Devin successor is most visible. Historical Windsurf public proof is mostly logo-level: Sacra names Zillow, Dell, and Anduril as customers, but public documentation does not show deployment stage, team size, or quantified outcomes for those accounts. In contrast, the current successor surface publishes production case studies. Nubank is the strongest example: Devin worked on a 6M+ line ETL migration touching roughly 100,000 data classes, delivered 12x engineering-hour efficiency and more than 20x cost savings, and helped Data, Collections, and Risk business units finish migrations in weeks. Ramp reports up to 80 merged PRs per week and 10,000+ hours saved monthly; Litera reports 40% higher test coverage, 93% faster regression cycles, 90+ users in 30 days, and five product launches in three weeks; Gumroad says Devin merged 1,583 PRs in four months at >85% merge rate; Hamming says Devin contributes 25% of total code volume; AngelList completed a Redshift-to-Snowflake migration 5.2x faster using 20 parallel agents; and Evinova shows regulated-healthcare proof with 8x faster GxP documentation and 66% of bugs fixed autonomously in the first 10 days.

    That does not mean all current named logos are equally strong. Cognition’s funding post and follow-on reporting list Goldman Sachs, Citi, Cisco, Palantir, Santander, the U.S. Army, and the U.S. Navy, but those are roster disclosures rather than published outcome case studies. Investors should therefore separate three proof tiers: historical Windsurf logos only, current combined logo roster, and current quantified case studies.
