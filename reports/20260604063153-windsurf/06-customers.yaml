- id: durability-and-risk
  title: Durability, Expansion, Concentration, and Procurement Friction
  body: |-
    Durability, expansion, and procurement risk are still the least proven parts of the customer story. Neither historical Windsurf nor the current successor surface discloses NRR, GRR, logo renewal rates, top-customer concentration, or conversion from free users into team and enterprise contracts. The best public durability proxies are operational rather than financial: Anthropic cites very high daily retention after launch, Gumroad expanded from a single pod to company-wide use, Bilt rolled Devin across 106 engineers with more than half using it weekly, and Litera more than doubled active Devin usage within 30 days. Those are encouraging usage signals, but they are not a substitute for paid renewal data.

    The downside evidence is real. Archived G2 coverage offered too little review depth to provide buying insight, and Trustpilot reviews capture sharp backlash around pricing changes, refund disputes, exhausted limits, and claims that long-time users cancelled after the March 2026 overhaul. TechCrunch also reported that some Windsurf customers switched to competitors after Anthropic cut direct Claude access in June 2025. On procurement, today’s enterprise offer is stronger than the historical public record because it advertises VPC deployment, SOC 2 Type II, teamspace isolation, and SSO/admin controls. But the combined entity still has to reconcile Windsurf’s per-seat pricing with Devin’s usage-based compute economics and API-priced overages. That creates budgeting and renewal friction precisely where concentration risk is hardest to observe.
