figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: The public record supports a journey that begins with developer-led experimentation, formalizes through team and security controls, and then expands into broader engineering workflows.
  approximationNotes: This figure synthesizes public pricing, partner commentary, and customer case studies; it describes the dominant public motion rather than a mandatory single path for every account.
  data:
    items:
    - label: Discover and trial
      actor: Individual developer
      touchpoints:
      - Free plan
      - Developer word of mouth
      - Fast launch adoption
      painpoint: Developers want immediate coding help before procurement engages.
      opportunity: Freemium access and strong early launch growth reduce initial adoption friction.
    - label: Adopt inside a team
      actor: Engineering lead / pod manager
      touchpoints:
      - Team plan
      - Shared repositories
      - Slack / GitHub workflows
      painpoint: Managers need evidence that the tool helps real repository work rather than demos.
      opportunity: Current case studies show repetitive work, migrations, testing, and bug fixing can all be delegated.
    - label: Pass security and budget review
      actor: IT admin / procurement
      touchpoints:
      - SSO
      - Admin controls
      - SOC 2 Type II
      - VPC deployment
      painpoint: Enterprise buyers need governance, privacy, and predictable spend.
      opportunity: The current enterprise offer now exposes the controls that the historical public record barely documented.
    - label: Land a production use case
      actor: Engineering org
      touchpoints:
      - Migration playbooks
      - Testing agents
      - Tech-debt automation
      - Support triage
      painpoint: Teams need an initial KPI win to justify deeper rollout.
      opportunity: Nubank, Ramp, Litera, and Gumroad provide measurable examples of production adoption.
    - label: Expand across adjacent workflows
      actor: Platform lead / executive sponsor
      touchpoints:
      - More repos
      - More seats
      - Cross-functional users
      - Agent + IDE bundle
      painpoint: Without workflow breadth, the tool can remain a niche assistant instead of a platform standard.
      opportunity: Low overlap between legacy Windsurf and Devin customers creates real cross-sell whitespace.
    - label: Renew and standardize
      actor: Executive buyer
      touchpoints:
      - Renewal review
      - Pricing negotiations
      - Policy controls
      - Roadmap confidence
      painpoint: Public evidence still lacks NRR, concentration, and renewal visibility.
      opportunity: Enterprise controls and broader use-case depth can support renewal, but public proof remains incomplete.
  claimRefs:
