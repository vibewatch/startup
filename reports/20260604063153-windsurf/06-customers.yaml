- id: adoption-trajectory
  title: Adoption Trajectory and Historical-vs-Successor Boundary
  body: |-
    Public adoption metrics have to be split into three eras. First, early launch evidence from Anthropic’s customer story shows unusually fast product-led uptake: Windsurf hit 10,000 users in two days, climbed into the hundreds of thousands by the end of week two, and management described daily retention as very high. Anthropic’s page also states 800,000+ active users and 1,000+ enterprise customers, while Sacra independently says Codeium had expanded to 800,000+ active developers and 1,000+ businesses by early 2025. Second, the acquisition snapshot is materially narrower: Cognition’s July 2025 acquisition announcement and TechCrunch both say Windsurf came with 350+ enterprise customers, hundreds of thousands of daily active users, $82M ARR, and enterprise ARR doubling quarter-over-quarter. That suggests the historical “1,000+ enterprises” claim and the later “350+ enterprise customers” claim are not directly comparable denominators.

    Third, today’s successor surface is explicitly post-transaction. The current Windsurf/Devin Desktop homepage claims 1M+ developers and 4,000+ enterprise customers, and Cognition’s later funding post says the overlap between legacy Windsurf and pre-acquisition Devin enterprise customers was under 5% while combined enterprise ARR rose more than 30% in the first seven weeks after close. Those are important commercial signals, but they should not be backfilled into historical Windsurf. The cleanest interpretation is that historical Windsurf proved strong PLG adoption before the deal, while the larger 1M+/4,000+ footprint is a current combined-platform marketing surface.
