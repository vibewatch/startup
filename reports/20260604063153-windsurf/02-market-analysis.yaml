- id: buyer-map-and-budget-ownership
  title: Buyer map, budget ownership, and adoption path
  body: |-
    Buyer segmentation in AI coding is defined less by company size alone than by who owns the migration risk. Individual developers are the lowest-friction entry point because the decision is essentially whether a $10 to $20 monthly tool creates enough daily productivity or enjoyment to justify a credit card charge. Team plans begin when an engineering manager or founder wants consistency, usage visibility, privacy defaults, and one billing surface. Enterprise buyers add another layer entirely: procurement, security, identity, auditability, usage budgets, and model-governance policies become part of the product, not just adjacent checklists. Cursor’s and GitHub’s public materials make this explicit; the monetizable product is no longer only model access but administrative control over how agents behave.
    This structure favors a classic bottom-up-to-top-down motion. Developers try AI tools before their companies fully approve them, then teams standardize once ROI is visible and security questions become manageable. That is why current pricing anchors matter so much. GitHub’s low-cost individual pricing pulls broad experimentation, Cursor’s $40 team tier captures professional teams willing to pay for coordination, Tabnine’s premium private deployment speaks to regulated buyers, and AWS Q shows that usage-based or pooled economics are acceptable when the buyer already lives inside a broader platform relationship. The category is therefore not one monolithic market but a ladder of willingness to pay from self-serve productivity to governed enterprise automation.
    For Windsurf, the strongest near-term fit is the segment that values an editor switch because it wants a more agent-first workflow. The weakest fit is the segment that prizes incumbent distribution, government-grade attestations, or private deployment flexibility above UX novelty. Those buyers already have credible substitutes.
