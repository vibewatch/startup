  evidenceGaps:
  - type: missing-source
    severity: material
    topic: market-size-precision
    missingEvidence: A clean public TAM/SAM/SOM dollar stack that isolates AI-native IDEs from broader coding-assistant, cloud-agent, and adjacent workflow spend remains unavailable.
    whyItMatters: Without a precise denominator, public market sizing for Windsurf should stay evidence-constrained and proxy-based rather than pretending to be audited.
    diligencePath: Request vendor cohort data, independent sell-side market models, and billing mix by self-serve versus enterprise seats before relying on a single TAM figure.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: successor-base-mix
    missingEvidence: No public source splits the current 1M+ users and 4,000+ enterprise customers between inherited legacy Windsurf usage and net-new post-Cognition adoption.
    whyItMatters: That mix determines whether Windsurf is still compounding as a product or merely carrying forward an installed base through a successor surface.
    diligencePath: Request cohort retention, seat migration, and expansion data that separates legacy Windsurf, Devin Desktop upgrades, and new logo additions.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
    - TM004
  - type: private-evidence-only
    severity: material
    topic: regulated-deployment-proof
    missingEvidence: Current public Windsurf / Devin materials do not document government-grade or sector-specific deployment attestations such as FedRAMP or equivalent isolated-environment commitments.
    whyItMatters: Regulated and public-sector buyers can be large budgets, but absent deployment proof they should be treated as constrained or out of reach in a base-case market model.
    diligencePath: Ask for customer references, compliance roadmap, deployment architecture, and signed security questionnaires for heavily regulated accounts.
