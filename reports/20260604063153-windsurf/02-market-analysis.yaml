callouts:
- calloutType: strength
  title: This market already supports premium software budgets
  body: The important proof point is not one headline TAM number. It is that developers already trial these tools at very high rates, vendors already charge meaningful recurring seat prices, and AI-native editors already show revenue and enterprise scale. Windsurf is competing for a real software budget line, not for a speculative innovation grant.
  claimRefs:
  - CM008
  - CM014
  - CM015
  - CM020
  - CM023
  - CM026
- calloutType: risk
  title: Compute economics and legal uncertainty can still compress the category
  body: The category’s biggest risk is not lack of interest but the cost and governance burden of sustained agent use. GitHub’s pauses and usage caps, plus unresolved copyright questions around generated code, show that successful adoption can create margin pressure and legal friction at the same time.
  claimRefs:
  - CM018
  - CM019
  - CM038
- calloutType: insight
  title: Windsurf does not need every segment; it needs the switch-IDE wedge
  body: Windsurf’s best opportunity is the team that believes agent orchestration and review are worth changing the editor for. Its weakest ground is the buyer who values incumbent platform bundling or private deployment more than workflow depth. That narrows the true serviceable market, but it also makes the thesis more testable.
  claimRefs:
  - CM027
  - CM029
  - CM030
  - CM032
  - CM040
  - CM041
