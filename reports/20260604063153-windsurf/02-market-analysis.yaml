- id: sizing-via-adoption-and-revenue-proxies
  title: Sizing via adoption and revenue proxies
  body: |-
    A clean TAM/SAM/SOM stack for Windsurf is not publicly observable in the way a mature software category might be. Public evidence is stronger on adoption and monetization proxies than on one universally accepted dollar estimate, so the market should be sized through several constrained lenses. The adoption lens is already large: GitHub’s international survey says more than 97% of respondents have used AI coding tools at work at some point, while JetBrains reports that 69% have tried ChatGPT for coding and 40% have tried Copilot. Regular-use numbers are lower than trial numbers, but still material: JetBrains sees 49% regular ChatGPT-for-coding use and 26% regular Copilot use. Combined with GitHub’s 2024 surge in generative-AI projects and contributions, this indicates the category has moved past novelty.
    Monetization proxies point the same direction. GitHub positions Copilot as a product with millions of individual users and tens of thousands of business customers; Cursor has already reached official enterprise penetration claims that would have looked implausible for an IDE startup two years ago; Sacra and TechCrunch both show that investors and paying customers rewarded Cursor’s revenue ramp well before 2025 closed. Windsurf’s own successor surface claims more than one million users and more than four thousand enterprise customers. Those figures do not prove that all users are paying, or that the base is cleanly attributable to the pre-acquisition Windsurf product, but they do prove that the addressable market for agentic editors is already measured in millions of users and thousands of enterprise accounts, not in a handful of lighthouse pilots.
    The practical implication is that Windsurf should be valued against a proven, premium developer-software budget line. The category is already large enough to support differentiated self-serve, team, and enterprise pricing, but still young enough that precise market-share math is noisier than adoption and revenue velocity data.
