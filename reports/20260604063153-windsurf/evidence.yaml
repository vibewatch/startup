evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: Board roster, investor rights, and any independent director appointments remain undisclosed.
    whyItMatters: >-
      Opaque governance reduces confidence in how the 2025 split transactions were negotiated and how minority
      stakeholders were protected.
    diligencePath: Request cap table, board materials, and definitive transaction agreements from the company or existing investors.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: metric-disclosure
    missingEvidence: Audited revenue, gross margin, burn, and cash data are not publicly available for the standalone Windsurf entity.
    whyItMatters: >-
      Without audited operating metrics, valuation and unit-economics analysis must lean on management or analyst
      estimates.
    diligencePath: Seek management financial package, QoQ ARR bridge, gross-margin waterfall, and board-approved budget.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: employee-treatment
    missingEvidence: >-
      Public reporting does not fully reconcile who benefited from the Google transaction versus the Cognition
      transaction.
    whyItMatters: Uneven economic outcomes can affect retention, litigation risk, and post-acquisition operating continuity.
    diligencePath: >-
      Review employee-option treatment schedules, separation packages, and communication memos for both July 2025
      transactions.
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: minor
    topic: founder-attribution
    missingEvidence: No primary or high-quality third-party source reviewed here clearly documents Neil Agarwal as a formal co-founder.
    whyItMatters: >-
      Founder identity affects founder-market-fit analysis and reference checking, so unresolved attribution should not
      be assumed into later chapters.
    diligencePath: >-
      Confirm founding incorporation records, early cap-table documents, or archived official team pages before treating
      the role as established.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: market-size-precision
    missingEvidence: >-
      A clean public TAM/SAM/SOM dollar stack that isolates AI-native IDEs from broader coding-assistant, cloud-agent,
      and adjacent workflow spend remains unavailable.
    whyItMatters: >-
      Without a precise denominator, public market sizing for Windsurf should stay evidence-constrained and proxy-based
      rather than pretending to be audited.
    diligencePath: >-
      Request vendor cohort data, independent sell-side market models, and billing mix by self-serve versus enterprise
      seats before relying on a single TAM figure.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: successor-base-mix
    missingEvidence: >-
      No public source splits the current 1M+ users and 4,000+ enterprise customers between inherited legacy Windsurf
      usage and net-new post-Cognition adoption.
    whyItMatters: >-
      That mix determines whether Windsurf is still compounding as a product or merely carrying forward an installed
      base through a successor surface.
    diligencePath: >-
      Request cohort retention, seat migration, and expansion data that separates legacy Windsurf, Devin Desktop
      upgrades, and new logo additions.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
      - TM004
  - type: private-evidence-only
    severity: material
    topic: regulated-deployment-proof
    missingEvidence: >-
      Current public Windsurf / Devin materials do not document government-grade or sector-specific deployment
      attestations such as FedRAMP or equivalent isolated-environment commitments.
    whyItMatters: >-
      Regulated and public-sector buyers can be large budgets, but absent deployment proof they should be treated as
      constrained or out of reach in a base-case market model.
    diligencePath: >-
      Ask for customer references, compliance roadmap, deployment architecture, and signed security questionnaires for
      heavily regulated accounts.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM003
      - TM004
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-landscape-coverage
    missingEvidence: >-
      Comparable public profiles for smaller open-source, vertical-specific, and internal-build alternatives that sit
      below the visibility threshold of this chapter.
    whyItMatters: >-
      The competitor profile table is intentionally partial; a refresh could surface niche entrants that matter in
      specific regulated or vertical workflows.
    diligencePath: >-
      Run a refresh search across open-source agents, vertical developer tools, and internal platform substitutes, then
      extend the competitor profile table if any show meaningful enterprise traction.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: realized-enterprise-pricing
    missingEvidence: >-
      Redacted order forms, renewal quotes, AI-credit budgets, and discount schedules for Copilot, Cursor, Devin, Amazon
      Q, and Tabnine enterprise deals.
    whyItMatters: >-
      List pricing is a weak proxy for what large customers actually pay, especially when usage credits, overages, and
      deployment commitments enter the contract.
    diligencePath: >-
      Request customer invoices, partner quotes, or seller-provided pricing bands so the pricing table can compare
      realized enterprise spend instead of list pricing.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: replit-enterprise-overlap
    missingEvidence: >-
      Segment-level customer and revenue evidence showing how much Replit overlaps with Windsurf in mature enterprise
      buying cycles rather than startup or builder use cases.
    whyItMatters: >-
      Replit clearly matters as an adjacent substitute, but the public record is thin on how often it wins the same
      large-account evaluations that Windsurf, Cursor, Copilot, or Devin face.
    diligencePath: >-
      Obtain segment-level customer references or pipeline data that separates Replit app-building buyers from
      enterprise coding-assistant buyers.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: windsurf-migration-retention
    missingEvidence: >-
      Cohort migration, renewal, and expansion data for legacy Windsurf customers after the public move to Devin
      Desktop.
    whyItMatters: >-
      Switching-cost and moat claims for the successor surface are much stronger if the installed base actually stayed,
      expanded, and standardized on the new workflow.
    diligencePath: >-
      Request migration dashboards, seat expansion data, and renewal cohorts from Cognition for accounts that started as
      Windsurf customers.
    relatedQuestionRefs:
      - QP022
      - QP027
  - type: conflicting-data
    severity: minor
    topic: benchmark-transferability
    missingEvidence: >-
      A controlled private-repo bake-off that uses identical tasks, prompts, and review standards across Devin, Cursor,
      Copilot, Amazon Q, and Claude Code.
    whyItMatters: >-
      Public benchmark and vendor-claimed evaluation evidence helps frame the market, but it does not fully answer how
      these tools behave on private enterprise codebases with real security and change-management constraints.
    diligencePath: >-
      Run a customer-side evaluation on one representative monorepo and issue set, then compare cycle time, correctness,
      review burden, and security controls across vendors.
    relatedQuestionRefs:
      - QP019
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Segment revenue split between self-serve subscriptions, teams, enterprise contracts, and usage-linked overages.
    whyItMatters: Without mix data, ARR quality and the sustainability of enterprise-led growth cannot be underwritten cleanly.
    diligencePath: >-
