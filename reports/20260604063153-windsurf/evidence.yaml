      post-close migration.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: retention-and-cac
    missingEvidence: NRR, gross and logo churn, CAC, payback, ACV distribution, and average contract term.
