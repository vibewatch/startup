  topStrengths:
    - >-
      Affordable consumer and education positioning, including a Bumi launch price near CNY 9,998, creates a
      differentiated entry wedge.
    - >-
      Six publicly listed bipedal and bionic products address consumer, education, research, reception, service, and
      interaction use cases.
    - A nearly CNY 1 billion Series B reported in March 2026 provides fresh industrialization backing.
    - >-
      Public reports of launch sales, preorders, marketplace activity, and channel partners indicate demand interest,
      although conversion quality is unverified.
  topRisks:
    - >-
      Reported orders and preorders are not reconciled to paid shipments, accepted deliveries, active use, returns, or
      repeat demand.
    - >-
      Audited revenue, gross margin, working capital, cash, burn, runway, cap table, and financing terms are
      unavailable.
    - >-
      Named safety certifications, laboratory reports, incident histories, recalls, and jurisdiction-specific approvals
      were not found in the retained evidence.
    - Supplier, channel, customer, and international service concentration cannot be quantified from public disclosures.
  unresolvedGaps:
    - >-
      Reconcile paid orders, cancellations, production, shipments, acceptance, returns, active use, and repeat purchase
      by product and geography.
    - >-
      Obtain audited financials, current cash, burn, runway, unit economics, cap table, round terms, and financing-close
      documentation.
    - >-
      Verify model-specific safety, battery, electrical, cybersecurity, privacy, insurance, incident, recall, and
      regulatory records.
    - Obtain named customer references, cohort retention, measured outcomes, and revenue and channel concentration.
    - >-
      Benchmark reliability, task success, lifetime cost, patents, and freedom to operate against named peers using
      independent evidence.
