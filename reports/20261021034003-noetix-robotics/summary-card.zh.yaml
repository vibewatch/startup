  topStrengths:
    - 面向消费者和教育场景的亲民定位，包括 Bumi 近 CNY 9,998 的上市价，打开了差异化切入口。
    - 六款公开列出的双足和仿生产品覆盖消费、教育、科研、接待、服务和交互场景。
    - 2026 年 3 月据报道接近 CNY 1 billion 的 B 轮融资，为产业化提供了新的资金支持。
    - 公开报道中的上市销售、预订、平台活动和渠道合作伙伴显示市场有兴趣，但转化质量尚未验证。
  topRisks:
    - 据报道的订单和预订尚未与已付款发货、验收交付、活跃使用、退货或重复购买需求核对。
    - 经审计收入、毛利率、营运资金、现金、烧钱速度、现金跑道、股权结构表和融资条款均不可得。
    - 留存证据中未找到具体的安全认证、实验室报告、事故记录、召回记录和辖区特定审批。
    - 供应商、渠道、客户和国际服务集中度无法从公开披露中量化。
  unresolvedGaps:
    - 按产品和地域核对已付款订单、取消、生产、发货、验收、退货、活跃使用和重复购买。
    - 获取经审计财务报表、当前现金、烧钱速度、现金跑道、单位经济性、股权结构表、轮次条款和融资交割文件。
    - 核实具体型号的安全、电池、电气、网络安全、隐私、保险、事故、召回和监管记录。
    - 获取具名客户推荐、队列留存、实测结果，以及收入和渠道集中度数据。
    - 用独立证据，将可靠性、任务成功率、全生命周期成本、专利和实施自由与具名同业进行基准比较。
