schemaVersion: "report-v2"
artifact: customers
slug: noetix-robotics
runDate: "2026-10-21"
company:
  name: Noetix Robotics
chapter:
  number: 6
  title: Customers
  summary: >-
    Noetix addresses consumer, education/research, venue-service, healthcare, and
    industrial users, but public adoption proof is concentrated in launch-period
    quantities and company-reported deliveries. The retained evidence does not
    identify named production customers, retention cohorts, or revenue concentration.
sections:
  - id: customer-segments
    title: Customer segments and buying contexts
    body: >-
      The public portfolio points to a multi-segment strategy rather than one
      established ideal customer profile. Bumi is positioned for lower-cost consumer
      and education use, N2 and E1 for bipedal-motion development and research, and W1
      for guided-tour or reception settings. Other retained profiles extend the
      marketed application set to healthcare, eldercare, home service, industrial
      collaboration, logistics, and customized automation. These descriptions identify
      plausible users and buying contexts, not verified deployments or economic buyers.
      Household buyers appear to be the intended payer for Bumi, institutions for
      education and research platforms, and venue or enterprise operators for service
      and industrial systems, but no source provides segment revenue, account counts,
      procurement cycles, or payer-level conversion data.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption evidence is real but not yet comparable
    body: >-
      The strongest quantity evidence is uneven. Korthos says Noetix reported delivery
      of 105 N2 and E1 units in July 2025, while Robotics Registry records an announced
      105-unit shipment to undisclosed mass-production buyers dated August 1, 2025;
      these likely describe the same event and must not be added together. The registry
      separately reports 2,500-plus N2 preorders and 500 Bumi units sold during the
      first 48 hours on JD.com. Robotichina lists a 2026 Bumi target above 10,000 units.
      Deliveries, preorders, launch sales, and a management target have different
      statuses, time bases, and denominators, so they do not establish a coherent
      installed-base or sell-through trajectory. The evidence indicates launch demand,
      while active usage and repeat purchase remain unmeasured.
    claimRefs: [CU006, CU007, CU008, CU009, CU010, CU015]
    tableRefs: [TU002]
  - id: proof-quality
    title: Named references, durability, and concentration remain unproven
    body: >-
      None of the retained sources names an end customer and pairs that identity with a
      production deployment, measured outcome, or renewal. Robotics Registry labels its
      deployment log as announced and cited only, and its sole shipment row describes
      undisclosed buyers. RBTX, a channel partner rather than an independent benchmark,
      claims strategic relationships in automotive, e-commerce, and healthcare plus
      clients across three regions, but supplies no names, site counts, contract status,
      or outcomes. The source set also contains no NRR, GRR, churn, renewal, cohort,
      satisfaction, contract-length, or segment-revenue disclosure. As a result,
      customer durability, expansion, customer concentration, and channel dependence
      cannot be quantified from public evidence.
    claimRefs: [CU012, CU013, CU014, CU016]
    tableRefs: [TU003]
  - id: acquisition-support-expansion
    title: Public journey surfaces stop before renewal
    body: >-
      Noetix has visible acquisition and support infrastructure: its official site
      presents a broad product catalog, a purchase-and-cooperation route, after-sales
      access, video tutorials, documentation, an app, and a mini-program. RoboAtlas also
      describes contact-sales routes, while RBTX offers a live product demo and presents
      itself as an access channel for business buyers. This creates a plausible journey
      from discovery through evaluation, purchase, deployment, and support. The public
      trail then stops: there is no evidence tying those surfaces to activation,
      utilization, cross-sell, renewal, or advocacy. Diligence should therefore request
      account-level cohorts that reconcile orders, shipments, activations, monthly
      active robots, support incidents, repeat purchases, renewals, and revenue by
      direct versus partner channel.
    claimRefs: [CU005, CU011, CU012, CU014, CU016]
    figureRefs: [FU001]
tables:
  - id: TU001
    title: Customer segmentation and evidence boundary
    columns:
      - Segment
      - Buyer / payer
      - User
      - Product or use case
      - Public scale evidence
      - Diligence gap
    rows:
      - ["Consumer / home", "Household buyer (intended)", "Individual or family", "Bumi; home-service positioning", "500 launch-period JD.com sales reported; no active-user count", "Repeat use, returns, support burden, and household willingness to pay"]
      - ["Education / research", "School, university, or lab", "Students, teachers, developers, researchers", "Bumi, N2, and E1; embodied-AI development", "105 N2/E1 deliveries were company-reported without buyer identities", "Institution count, classroom versus lab use, utilization, and renewal"]
      - ["Reception / guided tour", "Venue or service operator", "Staff and visitors", "W1 and bionic interaction systems", "Applications are marketed; no named production site", "Site count, workflow integration, service-level requirements, and outcomes"]
      - ["Healthcare / eldercare", "Institution or household (not disclosed)", "Care staff, patients, or older adults", "Healthcare, eldercare, and companion scenarios", "Application claims only", "Safety approvals, supervised pilots, payer, outcomes, and production status"]
      - ["Industrial / logistics", "Enterprise operator", "Operations staff", "N2, collaborative workcells, logistics, and monitoring", "Partner page claims sector relationships without names", "Named client, payload/task scope, uptime, labor savings, and channel economics"]
    notes: >-
      Segment assignments synthesize marketed applications from retained company,
      directory, and partner pages; blanks in scale evidence indicate missing public
      deployment proof, not zero adoption.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU012]
  - id: TU002
    title: Reported adoption quantities and non-comparability
    columns:
      - Metric
      - Value
      - Period / date
      - Evidence status
      - Confidence
      - Implication and missing denominator
    rows:
      - ["N2/E1 units delivered", 105, "July 2025", "Noetix-reported quantity repeated by Korthos", "Medium", "Shipment evidence; buyer count, sites, ordered units, acceptance, and activation are undisclosed"]
      - ["N2/E1 announced shipment", 105, "2025-08-01 registry entry", "Undisclosed mass-production buyers; announced and cited only", "Medium", "Likely the same event as the July report; do not add to the 105 deliveries"]
      - ["N2 preorders", "2,500+", "Period not stated; registry reviewed 2026-07-05", "Third-party registry compilation", "Medium", "Order interest; conversion, deposits, cancellations, delivery timing, and unique buyers are absent"]
      - ["Bumi launch sales", 500, "First 48 hours on JD.com", "Third-party registry compilation", "Medium", "Launch sell-through; inventory offered, returns, activations, and repeat use are absent"]
      - ["Bumi sales target", "10,000+", "2026 target", "Target, not realized sales", "Low", "Signals ambition; no quarterly phasing, production denominator, orders, or delivered-unit reconciliation"]
    notes: >-
      Values retain their original metric names and periods. Deliveries, announced
      shipments, preorders, launch sales, and targets are not additive or a common
      cohort; unavailable denominators are stated in the final column.
    claimRefs: [CU006, CU007, CU008, CU009, CU010, CU015]
  - id: TU003
    title: Named customer proof table
    columns:
      - Relationship record
      - Segment
      - Deployment / use case
      - Production versus pilot
      - Reported outcome
      - Limitation
    rows:
      - ["Undisclosed N2/E1 mass-production buyers", "Consumer / commercial", "105 units", "Announced shipment; site status not given", "Units reportedly delivered", "No buyer, country, site, acceptance, activation, or outcome"]
      - ["JD.com Bumi purchasers", "Consumer", "Retail launch", "Sales reported; activation not disclosed", "500 units in first 48 hours", "No unique-buyer, return, usage, satisfaction, or repeat-purchase data"]
      - ["RBTX-claimed strategic relationships", "Automotive, e-commerce, healthcare", "Humanoids and automation solutions", "Not disclosed", "Partner claims clients across North America, Europe, and Asia", "No counterparty names, deployments, contract status, site counts, or measured outcomes"]
    notes: >-
      Partial inventory of relationship records in the assigned source pool, not an
      exhaustive customer list. None qualifies as a named end-customer production
      reference with a measured outcome.
    enumerationScope:
      coverage: partial
      basis: >-
        Public records in the assigned source pool through the 2026-10-21 access date;
        private references and undisclosed buyers are outside the observable boundary.
    claimRefs: [CU006, CU007, CU008, CU009, CU012, CU013, CU015]
figures:
  - id: FU001
    title: Publicly observable customer journey and evidence break
    type: journey-map
    summary: >-
      Public surfaces cover discovery through support, while usage, expansion, and
      renewal lack disclosed customer evidence.
    data:
      nodes:
        - id: discover
          label: Discover
          detail: Product catalog and application positioning expose consumer, education, service, healthcare, and industrial use cases.
          touchpoints: ["Official website", "Market directories", "Partner listing"]
        - id: evaluate
          label: Evaluate
          detail: Product pages, documentation, video tutorials, and a partner demo support technical or use-case evaluation.
          touchpoints: ["Product pages", "Documentation", "Video tutorials", "Live demo"]
        - id: purchase
          label: Purchase
          detail: The site provides a purchase-and-cooperation route; Bumi also has reported JD.com launch sales.
          touchpoints: ["Purchase / cooperation contact", "JD.com launch channel"]
        - id: deploy
          label: Deploy
          detail: Public quantities cover deliveries and announced shipments but not named sites, acceptance, or activation.
          touchpoints: ["105-unit delivery report", "Undisclosed buyers"]
        - id: support
          label: Support
          detail: After-sales login, app, mini-program, tutorials, and documents create visible support surfaces.
          touchpoints: ["After-sales portal", "App", "Mini-program", "Documentation"]
        - id: expand-renew
          label: Expand / renew
          detail: No retained source reports active usage, repeat purchase, cross-sell, renewal, churn, or cohort economics.
          touchpoints: ["Evidence gap", "Account-level diligence request"]
    approximationNotes: >-
      This is an evidence-availability sequence, not a conversion funnel; stage order
      does not imply conversion rates, elapsed time, or verified customer progression.
    claimRefs: [CU011]
callouts:
  - calloutType: risk
    title: Launch demand is not retention
    body: >-
      The public quantities mix preorders, launch sales, deliveries, and a target. None
      measures active use, repeat purchase, renewal, or customer-level revenue, so they
      cannot establish durable product-market fit.
    claimRefs: [CU014, CU015]
