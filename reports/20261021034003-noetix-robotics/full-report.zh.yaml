  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与融资背景
        blocks:
          - type: paragraph
            body: >-
              建议是跟踪并继续研究，而不是买入。两份 2026 年报道将 B 轮规模定为接近 CNY 1 billion、约 US$140
              million，并称宁德时代关联的产业投资平台领投；其中一份还称这是第九轮融资，公司完成了股份制改造。这些事实提升了融资能力，可能有助于制造执行，但不能确定投后估值、出售的股权比例、清算优先权、债务、可用现金或投资者回报潜力。EquityZen
              只有在其访问流程后才列出估值、股权结构表、收入和优先权信息，因此审阅的公开页面不能锚定入场价格。另一份资料列出的 US$46 million 累计融资额甚至低于单独报道的最新一轮规模，更说明需要一份一手融资台账。
