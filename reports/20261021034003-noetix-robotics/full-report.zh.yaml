              - CO013
              - CO016
      - number: '1.2'
        title: 管理层与治理
        blocks:
          - type: paragraph
            body: >-
              公开资料一致将 Jiang Zheyuan 列为创始人兼 CEO，Gasgoo 则称 Zhang Shipu 是参与海外扩张规划的联合创始人。Jiang 据报道拥有强化学习研究背景，这与具身 AI
              开发方向相关；Zhang
              的发言则把管理层与制造及国际执行联系起来。不过，留存证据没有披露董事会名单、投票权、高管继任计划，或创始人以下各职能的负责人。这带来关键人和治理风险：投资者无法判断产品、制造、财务、合规和国际业务是否由独立且负责的管理者掌管，还是都集中在创始团队手中。
            claimRefs:
              - CO004
              - CO005
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
              - CO014
              - CO016
      - number: '1.3'
        title: 融资与利益相关方结构
        blocks:
          - type: paragraph
            body: >-
              Gasgoo 报道称，Noetix 于 2026 年 3 月 2 日宣布接近 CNY 1 billion 的 B
              轮融资，并称这是公司成立以来的第九轮融资。这些披露说明了融资节奏和阶段，但没有说明累计融资额、投前或投后估值、稀释、清算优先权、债务或可用现金。Expolume 另称北京机器人产业基金提供支持，RBTX
              则自称商业接入合作伙伴。留存的 B 轮报道没有列出该轮投资者，因此公开利益相关方图谱必然不完整。要判断控制权或主要股东的经济利益是否一致，仍需股权结构表、融资文件和董事会材料。
            claimRefs:
