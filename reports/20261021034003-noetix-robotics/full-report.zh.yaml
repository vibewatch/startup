      - number: '8.2'
        title: 正向论点与反向论点
        blocks:
          - type: paragraph
            body: >-
              可投资的正向论点是规模加平价：近期融资可以支持生产，官网展示多型号产品组合，独立登记机构记录了厂商自述的 Bumi 发布期销量和 N2
              预订单。反向论点是，这些还不是经过验证的收入、留存、利润率或现金转化指标。Gasgoo
              对行业的判断是，投资者正在从技术炒作转向可行商业模式和现金创造。留存公开记录仍未达到这一标准。合作伙伴资料描述了广泛部署和客户信任，目录网站重复了融资及经营说法，但抓取文本没有指出合同、经审计发票、队列行为、保修成本或独立验证的安装。因此，产品广度和订单公告支持继续尽调，却不能单独支持溢价估值。
