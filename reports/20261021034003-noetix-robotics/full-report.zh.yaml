    title: 受证据约束的竞争定位图
    type: quadrant
    summary: 分析师根据留存证据完整度与面向买方的即时性绘制的序数图；不是业绩排名。
    data:
      xAxis:
        label: 留存证据完整度（1=稀疏，5=广泛）
        min: 1
        max: 5
      yAxis:
        label: 面向买方的即时性（1=概念 / 内部，5=已定价的消费产品）
        min: 1
        max: 5
      points:
        - label: Noetix Bumi
          x: 5
          'y': 5
          note: 公开标价参考、官方产品存在以及订单报道证据。
        - label: Noetix 更广泛的产品组合
          x: 4
          'y': 4
          note: 可见多款产品和多个渠道，但大多数定价与部署结果未知。
        - label: Unitree R1
          x: 2
          'y': 3
          note: 留存证据提供参考价格和同行名称，不代表能力相当。
        - label: AgiBot
          x: 1
          'y': 2
          note: 被列为开源人形机器人同行；这组证据中的商业证据稀疏。
        - label: RobotEra
          x: 1
          'y': 2
          note: 被列为直接同行；这组证据中没有定价和部署证据。
        - label: 内部自建或现状
          x: 1
          'y': 1
          note: 买方必须考虑的替代方案，但没有留存的采购基线。
    approximationNotes: 分数是分析师根据章节表格编制的序数证据评估，不是实测产品性能、市场份额或基准阈值；证据稀疏或缺失时，完整度分数较低。
    claimRefs:
      - CP002
      - CP003
      - CP005
      - CP008
      - CP015
  - id: FI001
    title: 经证据限定的硬件收入桥
    type: flow
    summary: 公开证据覆盖产品、标价和已宣布需求，但没有覆盖已确认收入或毛利。
    data:
      nodes:
        - id: customer-need
          label: 客户需求
          detail: 消费 / 教育用途或企业自动化需求
        - id: product-selection
          label: 产品或解决方案
          detail: 具名人形机器人 SKU 或定制化自动化部署
        - id: quoted-price
          label: 标价或合同
          detail: Bumi 和 N2 有公开标价证据；实际合同价格不可得
        - id: order
          label: 订单或预订
          detail: 公开数量混合了销售、订单、预订和计划交付
        - id: recognized-revenue
          label: 已确认收入
          detail: 指定证据中未披露
        - id: gross-profit
          label: 毛利
          detail: 未披露；COGS、保修、运费、支持和渠道成本不可得
    approximationNotes: 这是受证据约束的流程顺序，不是转化漏斗；不推算转化率或金额总额。
    claimRefs:
      - CI001
      - CI003
      - CI008
      - CI011
      - CI016
  - id: FE001
    title: 有公开证据支持的产品架构栈
    type: stack
    summary: 公开产品逻辑覆盖客户与产品触点、应用、具身智能、感知与控制、机电系统以及工业化。
    data:
      layers:
        - label: 客户与产品触点
          modules:
            - Bumi
            - N2
            - E1
            - Xiaoyue
            - W1
            - Xiaonuo
        - label: 应用与开发者入口
          modules:
            - 教育
            - 家庭互动
            - 研究
            - 接待
            - SDK
            - 文档
        - label: 具身智能
          modules:
            - 具身操作系统
            - 学习算法
            - 任务规划
        - label: 感知与控制
          modules:
            - 深度视觉
            - 传感器融合
            - 运动控制
        - label: 机电系统与动力
          modules:
            - 关节电机
            - BLDC 驱动
            - 电池系统
            - 结构硬件
        - label: 工业化与支持
          modules:
            - 供应商认证
            - 计划中的 ERP/MES
            - 售后服务
            - 海外本地化
    approximationNotes: 根据公开描述重构的概念架构栈；不代表未披露的接口、所有权边界或量产准备度。
    claimRefs:
      - CE001
      - CE007
      - CE010
      - CE012
      - CE015
  - id: FU001
    title: 可公开观察的客户旅程与证据断点
    type: journey-map
    summary: 公开触点覆盖发现到支持，但使用、扩张和续约缺少披露的客户证据。
    data:
      nodes:
        - id: discover
          label: 发现
          detail: 产品目录和应用定位展示了消费、教育、服务、医疗和工业使用场景。
          touchpoints:
            - Official website
            - Market directories
            - Partner listing
        - id: evaluate
          label: 评估
          detail: 产品页面、文档、视频教程和伙伴演示支持技术或使用场景评估。
          touchpoints:
            - Product pages
            - Documentation
            - Video tutorials
            - Live demo
        - id: purchase
          label: 购买
          detail: 网站提供购买与合作入口；Bumi 也有 JD.com 上市销售报道。
          touchpoints:
            - Purchase / cooperation contact
            - JD.com launch channel
        - id: deploy
          label: 部署
          detail: 公开数量覆盖交付和已宣布发货，但没有具名站点、验收或启用信息。
          touchpoints:
            - 105-unit delivery report
            - Undisclosed buyers
        - id: support
          label: 支持
          detail: 售后登录、应用、小程序、教程和文档构成可见的支持触点。
          touchpoints:
            - After-sales portal
            - App
            - Mini-program
            - Documentation
        - id: expand-renew
          label: 扩张 / 续约
          detail: 没有留存来源报告活跃使用、复购、交叉销售、续约、流失或队列经济性。
          touchpoints:
            - Evidence gap
            - Account-level diligence request
    approximationNotes: 这是证据可得性顺序，不是转化漏斗；阶段顺序不代表转化率、经过时间或经验证的客户进展。
    claimRefs:
      - CU011
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 该定性矩阵仅考虑指定公开证据中可见的缓释措施，并据此排列剩余风险敞口。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 生产与交付规模
          values:
            - 高
            - 高
            - 建设中
            - 高
        - label: 安全与认证证明
          values:
            - 中
            - 高
            - 未验证
            - 高
        - label: 国际售后执行
          values:
            - 高
            - 高
            - 已计划
            - 高
        - label: 订单到持续使用的转化
          values:
            - 中
            - 高
            - 未验证
            - 高
        - label: 财务与股权结构表透明度
          values:
            - 高
            - 中高
            - 非公开
            - 高
        - label: 渠道与供应商集中度
          values:
            - 中
            - 中高
            - 部分描述
            - 中高
    approximationNotes: 分类型分析师评估，不是测量所得的概率模型；评级反映截至 2026-10-21 的证据质量和剩余不确定性。
    claimRefs:
      - CR013
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 在决策时点，缺失的价格与经济性证据压过了融资和产品信号。
    data:
      nodes:
        - id: financing
          label: 融资能力
          detail: 接近 RMB 1 billion 的 B 轮融资，并有产业领投方
        - id: portfolio
          label: 产品广度
          detail: 官方网站展示六款具名机器人产品
        - id: demand
          label: 需求信号
          detail: 厂商声称的上市销售、预订和已宣布部署
        - id: proof
          label: 证明质量
          detail: 二手与伙伴证据缺少经审计的交易细节
        - id: economics
          label: 经济性检验
          detail: 行业标准如今更强调可行商业模式和现金创造
        - id: decision
          label: 决策
          detail: 在价格、条款和单元经济性得到验证前，继续跟踪和研究
    approximationNotes: 仅表示有序逻辑；节点不编码规模、概率或转化。
    claimRefs:
      - CV002
      - CV007
      - CV009
      - CV014
      - CV015
      - CV016
