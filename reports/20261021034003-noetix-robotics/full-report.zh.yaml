        title: 里程碑与规模信号
        blocks:
          - type: paragraph
            body: >-
              公开里程碑显示，公司从 2023 年 9 月成立，到 N2 取得赛事成绩、Bumi 于 2025 年 10 月发布，再到 2026 年 3 月完成大额 B 轮，推进很快。报道中的需求指标包括超过 2,500 个
              N2 订单、预售后三小时内售出 200 台 Bumi，以及截至 2025 年底的数千个 Bumi 订单。这些数字不能与已交付设备、确认收入、经常性客户或留存用户混为一谈。Gasgoo 还转述了 2026
              年第二季度交付 1,000 台海外产品的计划，但留存来源没有确认是否完成。独立登记机构将规格标为厂商自述且缺少部署字段，更凸显了获取订单、发货、退货、激活和服务数据的必要性。
