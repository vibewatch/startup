              持仓目前具有流动性，或符合某项具体交易。投资前，公司应提供已签署的融资文件、完全稀释股权结构表、优先权和反稀释条款、经审计财务报表、按月从订单到现金的转化、产品级毛利率、退货与保修数据、客户集中度，以及区分预订单和已付款交付的证据。若融资勾稽显示稀释程度明显差于所述、规模化生产后单位贡献持续为负、已宣布订单转化很弱，或无法验证低价产品的可靠性和服务负担，都将触发投资论点破裂。
