  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              证据将 Unitree Robotics、AgiBot 和 RobotEra 列为直接竞品，Gasgoo 则把 LimX Dynamics、LinkerBot、GALAXEA 和 AI² Robotics
              放入资金充裕的更广泛具身机器人群体。买方的替代选择不止这些风险投资支持的公司：Noetix
              还要面对内部机器人开发、传统自动化、低价教育套件和持续的人工劳动。留存资料没有提供这些替代方案的可比规格或采购结果，因此表格将其视为解决方案类别，而不假装它们是经过测量的产品基准。Noetix
              自身覆盖消费、教育、研究、接待、家庭服务和工业协作场景，扩大了可服务的工作集合，也使其暴露于各类别的专业厂商。
