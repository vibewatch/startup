chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与产品范围
        blocks:
          - type: paragraph
            body: >-
              Noetix Robotics 于 2023 年 9 月在北京成立，开发融合人工智能、机器人仿生、感知和运动控制的人形机器人。当前官网展示 Bumi、Xiaoyue、N2、E1、W1 和 Xiaonuo
              等多条产品线，并非单一产品公司。其定位覆盖消费陪伴和教育，也延伸到研究、服务及工业场景，但公开记录没有披露按产品或市场划分的收入结构。Bumi 报道中的 9,998
              元人民币上市价很关键：这个价格点说明公司押注消费者可负担性，却不能证明公司已经实现有吸引力的毛利率、重复使用或规模化售后经济性。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO009
              - CO016
