      - number: '3.3'
        title: 定价、分销与切换成本
        blocks:
          - type: paragraph
            body: >-
              Bumi 报道中的 9,998 元人民币标价是最明显的可观察切入口：AI Market Watch 将其与 Unitree R1 的 39,999
              元人民币参考价比较。这一比较适合说明标价定位，却不能说明交付成本、能力对等、折扣、保修、服务或全生命周期经济性。留存证据中没有找到公开的 N2、定制自动化或其他列名竞品合同价格。Noetix
              正靠直营购买和支持入口、RBTX 合作伙伴渠道，以及已宣布的国际扩张计划发展分销。切换成本和锁定效应因此尚无法量化；SDK 和文档可能创造集成价值，但没有来源证明专有数据效应、独家渠道或客户留存。
