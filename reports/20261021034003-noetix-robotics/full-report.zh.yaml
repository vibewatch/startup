              公开牵引力令人鼓舞，但定义很弱。Origin of Bots 报道称，Bumi 在京东首小时售出 100 台、两天内售出 500 台；Noetix 后来称，一款约 1
              万元的机器人收到了线上和线下数千个订单。这些数字的期间、总体、取消权和交付状态各不相同。某机器人登记机构明确将规格标为厂商自述、部署仅限已宣布和有引用的记录，因此这些数量都不应视为确认收入。Gasgoo 描述了
              2026 年第二季度交付 1,000 台海外产品及建设 ERP/MES 供应链的计划，但截至运行日期，指定证据没有证明计划已完成。
