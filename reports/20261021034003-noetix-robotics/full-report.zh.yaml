              Gasgoo 报道接近 CNY 1 billion 的 B 轮融资及成立以来九轮融资，而 Robotico 列出已融资 USD 46
              million；留存来源没有提供足够的定义、日期、币种或股权结构表文件来勾稽这些数字。EquityZen
              只有在账户资格审核后才公开展示估值、股权结构表、财务和风险信息，进一步说明关键投资判断输入并不公开。合作伙伴和资料来源还描述了对国内供应链的依赖、京东发布期销售、经销商供货和计划中的国际渠道，但没有量化交易对手集中度或替代采购。监测应跟踪现金跑道、融资交割文件、优先权条款、按物料清单划分的供应商占比、已付款发货的渠道占比、服务覆盖，以及续约或重复使用证据。无论表面需求多强，只要无法勾稽融资所得、已付款发货、毛利率或关键单一来源零部件，就应暂停投资。
