  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价证据
        blocks:
          - type: paragraph
            body: >-
              公开模式主要是按台销售硬件：Noetix 官网展示六款机器人，独立资料和合作伙伴资料还为企业买方补充了定制自动化路径。Bumi 的公开价格最清晰，为 9,998 元，Forbes 也称其低于 $1,500；
              Robotico 另列 N2 起价 39,000
              元（$6,200）。这些是标价或发布价，不是实际平均售价。没有一份审阅过的来源披露折扣、合同条款、软件或服务附加率、保修收入、收入确认政策或按产品划分的结构。因此，收入桥只能停留在未披露的确认收入和毛利，不能暗示未经支持的转化率或利润率。
