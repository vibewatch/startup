      - number: '3.2'
        title: 差异化与能力
        blocks:
          - type: paragraph
            body: >-
              最清晰的差异化来自产品组合架构，而不是已被证明的性能领先。RobotsBeat 描述了双足与仿生并行的策略，当前官网列出六款产品，覆盖消费、运动、技术、导览和陪伴角色。合作伙伴资料把 N2
              的叙事扩展到制造、物流、医疗和客户服务，官网则提供
              SDK、文档、支持和生态入口。这些要素可能降低集成摩擦并支持多产品分销，但目前主要仍是厂商或合作伙伴的说法。留存证据没有提供关于运动能力、可靠性、安全性、自主性或总拥有成本的独立正面对比基准。
