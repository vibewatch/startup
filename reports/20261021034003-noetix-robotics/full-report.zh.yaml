      - number: '8.3'
        title: 情景与估值框架
        blocks:
          - type: paragraph
            body: >-
              由于缺少经审计收入、毛利率、经常性收入结构、营运资金、现金消耗和正常化现金流，传统收入倍数或现金流折现估值无法由这组证据支持。因此，情景框架采用可观察的尽调里程碑，而不是编造区间。乐观情景要求把报道中的需求转化为已付款、低退货交付，并持续改善单位经济性；基准情景假设资本推动生产，但商业证明仍不完整；悲观情景假设订单转化、可靠性或现金转化令人失望。只有在公司提供完全稀释股权结构表并勾稽融资总额后，入场纪律才应采用分阶段或里程碑条件结构。产品价格比较可以帮助判断采用，却不是独立的股权估值基准，也不能替代可比公司的企业价值或交易倍数。
