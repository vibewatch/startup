  - id: TV003
    title: 乐观、基准与悲观情景框架
    columns:
      - 情景
      - 以证据为条件的假设
      - 估值与回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 据报道的订单转化为低退货率的付费交付；新增资本推动产能扩大；产品利润率改善
        - 以独立来源的可比交易为参照，基于经验证的未来收入和利润率估值；目前没有找到公开的、足以支撑该估值区间的依据
        - 在转化率和利润率数据到位前，中低
        - 退货、保修费用或交付延误抹去单元贡献利润
      - - 基准
        - 融资支持生产，但需求证据仍不一致，经济性数据仍属非公开信息
        - 采用与里程碑挂钩的分批投资，或在审阅股权结构表、优先股堆叠和经审计经济数据前暂缓进入
        - 基于当前证据缺口，中高
        - 新一轮条款意味着意外稀释，或在商业证明出现前再次出现现金需求
      - - 悲观
        - 预订转化疲弱、低定价带来服务负担，或工业化方面的说法没有转化为重复部署
        - 除非重置价格，并根据清算和稀释条款提供下行保护，否则不进入
        - 中等，因为留存来源无法消除这些风险
        - 规模化生产后单元贡献仍为负，或已宣布的需求无法与现金流核对
    notes: 情景信号是定性的，不是数值概率；由于公开证据缺少进入价格、证券条款、经审计收入和利润率，估值区间与目标回报被有意省略。
    claimRefs:
      - CV001
