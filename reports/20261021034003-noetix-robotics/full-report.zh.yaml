      - number: '3.4'
        title: 持久性与不利情形
        blocks:
          - type: paragraph
            body: >-
              乐观情景是垂直整合、广泛产品线和据报道迈向规模化交付共同带来的成本颠覆。不利情形是，在 Noetix 证明可靠性、重复购买和有吸引力的服务经济性之前，这些特征已可在资金充裕的中国生态中被复制。公司 2025
              年官方更新声称已有数千个订单并实现大规模交付，而 Robotics Registry 明确将其记录的规格标为厂商自述。接近 RMB 1 billion 的 B
              轮融资可能用于工业化，但融资额不等于可用现金、盈利能力或护城河。按当前证据，Noetix 有清晰的平价和产品组合论点，却没有经过独立验证的持久优势。
