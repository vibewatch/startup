  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 先定义市场，再测算规模
        blocks:
          - type: paragraph
            body: >-
              可投资市场不能被定义为全部机器人，甚至全部人形机器人。Noetix 近期的切入口是以 Bumi 为代表、面向家庭娱乐和教育的平价人形硬件；N2
              和仿生产品线则把机会延伸到研究、导览、接待、娱乐、医疗和工业协作。这些场景的买方、预算、安全要求、支持负担和替换周期各不相同，不能在没有共同口径的情况下简单相加。工业自动化、固定式
              固定式终端、传统教育套件和人工服务流程属于相邻市场或替代方案，不能自动算作可触达收入。划清边界，才能避免把低廉的消费级单价误当成 Noetix 能够拿下更大自动化市场的证据。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
      - number: '2.2'
        title: 产品信号还不足以构成 TAM
        blocks:
          - type: paragraph
            body: >-
              现有规模证据是自下而上且口径异质的。来源报告了约 9,998 元人民币的消费级价格、前 48 小时售出的 500 台 Bumi、截至 2025 年底的数千个合计订单、超过 2,500 个 N2 预订单、一个
              1,000 台 Bumi 的订单，以及据称覆盖超过 70,000
              所学校的教育合作伙伴。这些都是有用的需求信号，但混合了价格、发布期销量、预订单、单个客户订单和合作伙伴潜在触达范围。它们不能相加、年化，也不能当作收入。留存的八个来源都没有提供市场价值、CAGR、装机量分母、独立测量的售罄率或按地域划分的采用率。因此，本章选择不量化
              TAM、SAM 和 SOM，而不是制造虚假精确度。
            claimRefs:
              - CM005
              - CM009
              - CM010
              - CM011
              - CM012
              - CM014
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM005
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM009
              - CM011
              - CM012
              - CM014
              - CM016
      - number: '2.3'
        title: 不同细分市场的买方、用户和付款方并不相同
        blocks:
          - type: paragraph
            body: >-
              家庭采用更像可选消费电子购买，买方和付款方通常是同一人，但使用者可能是孩子或全家。教育场景的路径更复杂：学校、编程平台或家长可能负责购买，学生使用机器人，而课程或采购负责人掌控部署。研究机构可以从实验室或设备预算中采购；接待、导览、医疗和工业应用则需要组织买方及流程负责人。公开证据能确认这些使用场景，却没有披露采购周期、预算科目、续购行为、使用率或客户级
              ROI。因此，买方地图只是尽调中的分析性路径假设，不是已验证的销售漏斗。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM007
              - CM008
              - CM012
              - CM013
      - number: '2.4'
        title: 低价打开试用，支持和证据决定规模化
        blocks:
          - type: paragraph
            body: >-
              价格冲击是最清晰的采用驱动因素：两份专业资料将 Bumi 定价在约 9,998 元人民币或 US$1,400，另两份则公布了不同的 N2 近似价格，既体现低价定位，也说明跨市场比较很脆弱。Noetix
              官网还提供购买、文档和售后入口，这是采用所需的基础设施，却不能证明服务质量。主要约束包括区域价格、运输、保修覆盖、电池续航、经验证的售罄率和实际海外交付，这些都尚未解决。估值上，只有在测量转化、退货、支持成本、使用率和重复需求后，产品订单才应获得期权价值；否则，表面触达范围可能夸大收入池，并压缩看似需要的规模化时间。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
              - CM014
              - CM016
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 订单不是经常性需求的分母
            body: 发布期销量、预订单、单笔大额订单和计划交付都无法说明取消、退货、验收、活跃使用、重复购买或确认收入。
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM013
              - CM016
          - type: callout
            title: 价格是采用切入口，不是 TAM
            body: 平价硬件可能扩大试用需求，但估值应等待证据，确认低价在承担支持成本后仍能成立，并转化为可重复的细分市场经济性。
            calloutType: insight
