    title: Capability and buying-criteria matrix
    columns:
      - Buying criterion
      - Noetix evidence
      - Named direct peers
      - Internal build or status quo
      - Diligence implication
    rows:
      - ["Consumer affordability", "Bumi reported at RMB 9,998", "Unitree R1 reference at RMB 39,999; others unknown", "No comparable retained cost", "Validate delivered configuration and lifetime cost"]
      - ["Portfolio breadth", "Six products visible on the official site across bipedal and biomimetic roles", "Only selected product names retained", "Scope can be tailored but is unmeasured", "Breadth is visible; commercial depth is not"]
      - ["Core technology", "Full-stack and 30+ patent claims reported", "Unknown in retained pool", "Depends on buyer engineering capacity", "Request patent schedule and subsystem make-versus-buy map"]
      - ["Developer and support surface", "Resource center, SDK, documentation, after-sales, and ecosystem links visible", "Unknown in retained pool", "Buyer owns integration and maintenance", "Test documentation quality and API stability"]
      - ["Enterprise use cases", "Partner lists manufacturing, logistics, healthcare, and customer service", "Unknown in retained pool", "Conventional automation may solve narrow tasks", "Require named reference deployments and acceptance criteria"]
      - ["Commercial proof", "Company claimed thousands of orders and large-scale delivery in 2025", "No comparable retained evidence", "Existing process is already deployed", "Separate orders, shipped units, paid acceptance, and repeat use"]
    notes: >-
      Evidence-backed comparison with unsupported peer cells marked unknown; vendor
      and partner descriptions are not independent performance benchmarks.
    claimRefs: [CP001, CP002, CP003, CP006, CP007, CP008, CP009, CP014]
  - id: TP003
    title: Pricing, packaging, and channel comparison
    columns:
      - Offer
      - Public price or contract model
      - Included capability evidence
      - Discount or unknown
      - Competitive implication
    rows:
      - [Noetix Bumi, "RMB 9,998 reported list price", "Consumer-grade humanoid; official site positions it as an AI companion", "Configuration, warranty, service, discounts, and realized price unknown", "Strong entry-price signal but not a total-cost comparison"]
      - [Noetix N2 and enterprise solutions, "No public contract price retained", "Athletic humanoid plus partner-described industrial and service use cases", "Customization, support, and integration terms unknown", "Enterprise competitiveness cannot be priced from the pool"]
      - [Unitree R1, "RMB 39,999 reference price reported by AI Market Watch", "Humanoid reference product; parity with Bumi not established", "Configuration and realized price unknown", "Directional list-price anchor only"]
      - [AgiBot and RobotEra, Unknown, "Named direct humanoid peers", "Pricing, packaging, discounts, and support unknown", "Commercial comparison requires direct quotes"]
      - ["Internal build or conventional alternative", "No retained cost baseline", "Buyer-controlled solution or existing workflow", "Labor, integration, maintenance, and opportunity cost unknown", "Status quo may win if humanoid ROI is unproven"]
    notes: >-
      Public list-price references are not realized revenue, contract economics, or
      capability-normalized total cost; null comparisons remain explicit diligence gaps.
    claimRefs: [CP003, CP005, CP006, CP015]
figures:
  - id: FP001
    title: Evidence-constrained competitive positioning map
    type: quadrant
    summary: >-
      Analyst ordinal map of retained-evidence completeness versus buyer-facing
      immediacy; it is not a performance ranking.
    data:
      xAxis:
        label: "Retained-evidence completeness (1=sparse, 5=broad)"
        min: 1
        max: 5
      yAxis:
        label: "Buyer-facing immediacy (1=conceptual/internal, 5=priced consumer offer)"
        min: 1
        max: 5
      points:
        - label: "Noetix Bumi"
          x: 5
          y: 5
          note: "Public list-price reference, official product presence, and reported order evidence."
        - label: "Noetix broader portfolio"
          x: 4
          y: 4
          note: "Multiple products and channels are visible, but most pricing and deployment outcomes are unknown."
        - label: "Unitree R1"
          x: 2
          y: 3
          note: "Retained evidence supplies a reference price and peer name, not capability parity."
        - label: "AgiBot"
          x: 1
          y: 2
          note: "Named as an open-source humanoid peer; commercial evidence is sparse in this pool."
        - label: "RobotEra"
          x: 1
          y: 2
          note: "Named as a direct peer; pricing and deployment evidence are absent from this pool."
        - label: "Internal build or status quo"
          x: 1
          y: 1
          note: "Required buyer alternative with no retained procurement baseline."
    approximationNotes: >-
      Scores are analyst-authored ordinal evidence assessments derived from the
      chapter tables, not measured product performance, market share, or benchmark
      thresholds; sparse or absent evidence receives a low completeness score.
    claimRefs: [CP002, CP003, CP005, CP008, CP015]
callouts:
  - calloutType: strength
    title: Affordability is the clearest wedge
    body: >-
      The retained comparison places Bumi at RMB 9,998 against a RMB 39,999 Unitree
      R1 reference, while Noetix also exposes a broader bipedal and biomimetic catalog.
    claimRefs: [CP001, CP002, CP003]
  - calloutType: risk
    title: Capital and claims are ahead of independent proof
    body: >-
      A capitalized entrant cohort and mostly vendor-derived operating metrics make
      commoditization, execution, and pricing pressure more credible than a durable
      moat conclusion.
    claimRefs: [CP008, CP009, CP011, CP012, CP015]
