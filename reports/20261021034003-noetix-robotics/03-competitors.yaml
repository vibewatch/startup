      - [RobotEra, Direct peer, Unknown in retained pool, "STAR1 humanoid according to the retained directory", "Named direct peer", "No comparable pricing, deployments, or performance evidence retained"]
      - ["LimX Dynamics, LinkerBot, GALAXEA, AI² Robotics", Adjacent embodied-robotics cohort, "Gasgoo reports billion-yuan Series B rounds", "Embodied-intelligence products; segments not established here", "Capitalized entrant set", "Grouped funding context is not a product benchmark"]
      - ["Internal build, conventional automation, education kits, manual work", "Substitute and status quo", Unknown, "Buyers solving training, service, interaction, or automation jobs", "Can avoid humanoid form-factor risk or vendor dependency", "No retained procurement comparison or cost baseline"]
    notes: >-
      Partial landscape assembled only from the assigned evidence pool; unknown means
      the retained sources do not establish the field, and reported financing is not
      cash available.
    claimRefs: [CP004, CP005, CP010, CP011, CP012, CP013]
