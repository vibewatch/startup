  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Evidence-backed argument, What would change the view]
    rows:
      - [Thesis, "Nearly RMB 1 billion Series B provides meaningful production and deployment capital", "Signed closing documents and a post-financing cash bridge would strengthen the claim"]
      - [Thesis, "CATL-linked lead investor may add industrial and supply-chain relevance", "Documented procurement, manufacturing, or supply-chain commitments would convert potential into evidence"]
      - [Thesis, "Official portfolio spans multiple bipedal and bionic products", "Paid usage and retention by product would show whether breadth creates commercial value"]
      - [Thesis, "Registry records vendor-claimed 500 Bumi units in 48 hours and 2,500-plus N2 pre-orders", "Invoice, cash collection, return, and repeat-purchase data would validate demand"]
      - [Anti-thesis, "Public fundraising totals conflict: US$46 million profile total versus a roughly US$140 million latest round", "A primary round-by-round financing ledger would resolve the discrepancy"]
      - [Anti-thesis, "Sector investment standards have shifted from technical hype toward business-model and cash-flow proof", "Audited margins, unit contribution, and operating cash conversion would address the concern"]
      - [Anti-thesis, "Partner and directory claims are broad but not contract-level customer proof", "Named references, deployment acceptance records, and concentration data would improve confidence"]
    notes: "Demand and deployment quantities remain vendor-claimed or directory-reported unless explicitly stated; rows distinguish financing capacity from commercial validation."
    claimRefs: [CV002, CV007, CV008, CV009, CV010, CV011, CV014, CV015]
  - id: TV003
    title: Bull, base, and bear scenario framework
    columns: [Scenario, Evidence-conditioned assumptions, Valuation and return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Reported orders convert to paid low-return deliveries; new capital scales production; product margins improve", "Value against verified forward revenue and margin using independently sourced peer transactions; no public range is currently defensible", "Medium-low until conversion and margin data arrive", "Returns, warranty expense, or delivery delays erase contribution margin"]
      - [Base, "Funding supports production but demand evidence remains mixed and economics stay private", "Use milestone-conditioned tranches or defer entry until cap table, preferences, and audited economics are reviewed", "Medium-high based on current evidence gaps", "New round terms imply unexpected dilution or cash needs recur before commercial proof"]
      - [Bear, "Pre-orders convert weakly, low pricing creates service burden, or industrial claims do not become repeat deployments", "No entry absent a reset price and downside protection tied to liquidation and dilution terms", "Medium because retained sources do not close these risks", "Negative unit contribution persists after scaled production or announced demand cannot be reconciled to cash"]
    notes: "Scenario signals are qualitative, not numerical probabilities; valuation ranges and target returns are intentionally withheld because public evidence lacks entry price, security terms, audited revenue, and margins."
    claimRefs: [CV001, CV005, CV009, CV010, CV011, CV014, CV015, CV016]
