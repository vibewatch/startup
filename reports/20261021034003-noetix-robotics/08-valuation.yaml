chapter:
  number: 8
  title: Valuation
  summary: >-
    Noetix has fresh industrial backing and visible product-demand signals, but the retained public
    evidence does not disclose a current equity value, security terms, audited economics, or verified
    sell-through. The appropriate stance is track and research more, with any entry decision conditioned
    on primary financial, cap-table, and commercialization evidence.
sections:
  - id: recommendation-and-financing
    title: Recommendation and financing context
    body: >-
      The recommendation is track and research more rather than buy. Two 2026 reports place the Series B
      at nearly RMB 1 billion, about US$140 million, and identify a CATL-linked industrial investment
      platform as lead; one also describes this as the ninth financing round and says the company completed
      a joint-stock reform. Those facts improve financing capacity and may help manufacturing execution,
      but they do not establish the post-money valuation, ownership sold, liquidation preference, debt,
      cash available, or investor return potential. EquityZen lists valuation, cap-table, revenue, and
      preference information only behind its access process, so the reviewed public page cannot anchor an
      entry price. A separate profile's US$46 million total-raised figure is also below the reported size
      of the latest round alone, reinforcing the need for a primary financing ledger.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV012, CV013, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-antithesis
    title: Thesis and anti-thesis
    body: >-
      The investable thesis is scale plus affordability: recent funding can support production, the
      official site presents a multi-model product portfolio, and an independent registry records
      vendor-claimed Bumi launch sales and N2 pre-orders. The anti-thesis is that these are not yet
      validated revenue, retention, margin, or cash-conversion metrics. Gasgoo's own sector framing says
      investors are moving beyond technical hype toward viable business models and cash generation.
      That standard remains unmet in the retained public record. A partner listing describes broad
      deployments and customer trust, while directories repeat financing and operating claims, but the
      fetched text does not identify contracts, audited invoices, cohort behavior, warranty costs, or
      independently verified installations. Product breadth and order announcements therefore support
      continued diligence, not a premium valuation by themselves.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV011, CV014, CV015, CV016]
    tableRefs: [TV002]
  - id: scenario-framework
    title: Scenario and valuation framework
    body: >-
      A conventional revenue-multiple or discounted-cash-flow valuation is not supportable from this
      evidence set because audited revenue, gross margin, recurring mix, working capital, burn, and
      normalized cash flow are absent. The scenario framework therefore uses observable diligence
      milestones rather than invented ranges. The bull case requires conversion of reported demand into
      paid, low-return deliveries with improving unit economics; the base case assumes capital funds
      production while commercial proof remains mixed; the bear case assumes order conversion, reliability,
      or cash conversion disappoints. Entry discipline should use a staged or milestone-conditioned
      structure only after the company supplies a fully diluted cap table and reconciles financing totals.
      Product-price comparisons can inform adoption, but they are not independent equity-valuation
      benchmarks and cannot substitute for peer enterprise values or transaction multiples.
    claimRefs: [CV001, CV005, CV009, CV010, CV011, CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness and final diligence
    body: >-
      Exit readiness is unproven. EquityZen describes IPO, merger or acquisition, and eligible secondary
      resale as generic private-market exit mechanisms, but its public page does not establish that a
      Noetix position is currently liquid or eligible for a specific transaction. Before investment, the
      company should provide signed financing documents, a fully diluted cap table, preference and
      anti-dilution terms, audited financials, monthly bookings-to-cash conversion, product-level gross
      margin, returns and warranty data, customer concentration, and evidence separating pre-orders from
      paid deliveries. Thesis-break triggers are a financing reconciliation that implies materially worse
      dilution than represented, persistent negative unit contribution after scaled production, weak
      conversion of announced orders, or inability to validate the low-cost products' reliability and
      service burden.
    claimRefs: [CV005, CV006, CV009, CV010, CV011, CV012, CV013, CV014, CV015, CV016]
