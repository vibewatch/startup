company:
  name: Noetix Robotics
chapter:
  number: 4
  title: Financials
  summary: >-
    Noetix exposes a hardware-led monetization model with consumer and larger
    humanoid list prices, announced order volumes, customized automation, and an
    overseas channel plan. The reviewed evidence does not disclose recognized
    revenue, gross margin, cash, burn, or runway, so revenue quality and capital
    adequacy remain un-underwritable from public data.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing evidence
    body: >-
      The public model is primarily per-unit hardware: Noetix's website presents
      six named robots, while independent and partner profiles add a customized
      automation path for enterprise buyers. Bumi is the clearest public price
      point at 9,998 yuan, also described by Forbes as below $1,500; Robotico
      separately lists N2 from 39,000 yuan ($6,200). These are list or launch
      prices, not realized average selling prices. No reviewed source discloses
      discounts, contract terms, software or service attach rates, warranty
      revenue, revenue recognition policy, or mix by product. The resulting
      bridge therefore stops at undisclosed recognized revenue and gross profit
      rather than implying unsupported conversion or margin.
    claimRefs: [CI001, CI002, CI003, CI004, CI008, CI016]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: traction-and-go-to-market
    title: Orders, delivery signals, and go-to-market
    body: >-
      Public traction is promising but definitionally weak. Origin of Bots
      reports 100 Bumi units sold in the first hour and 500 within two days on
      JD.com, while Noetix later said a roughly ten-thousand-yuan robot had
      received thousands of online and offline orders. Those periods,
      populations, cancellation rights, and delivery status differ. A robotics
      registry explicitly labels specifications vendor-claimed and deployments
      announced and cited only, so none of these counts should be treated as
      recognized revenue. Gasgoo described a plan for 1,000 overseas deliveries
      by the second quarter of 2026 and an ERP/MES-backed supply chain, but the
      assigned evidence does not establish completion of that plan as of the
      run date.
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI010]
    tableRefs: [TI002]
  - id: cost-structure-and-capital
    title: Cost structure and capital adequacy
    body: >-
      The only concrete cost evidence is architectural: Origin of Bots attributes
      the low price to in-house control boards and motor drivers, selective use
      of metal, composite materials, and mostly domestic sourcing. That may
      reduce bill-of-materials cost, but it does not reveal component cost,
      labor, warranty, after-sales, freight, channel fees, inventory turns, or
      gross margin. Forbes reports more than $150 million raised, while Gasgoo
      reports registered capital of about 4.09 million yuan after a 26% increase;
      these are different metrics and neither equals cash available. Without a
      cash balance, burn, debt, committed capex, or working-capital schedule,
      runway and the trigger for another financing cannot be calculated.
    claimRefs: [CI011, CI013, CI014, CI015, CI016]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: Financial underwriting verdict
    body: >-
      Noetix has demonstrated price discovery and order interest across more than
      one hardware tier, and its announced manufacturing and overseas plans show
      an intent to scale. The adverse counterpoint is material: Origin of Bots
      says the low price limits capability and that the consumer robot market is
      crowded. The investment case therefore depends on evidence not present in
      the assigned pool—paid and delivered units by SKU, recognized revenue,
      gross margin after warranty and support, customer acquisition cost,
      channel economics, returns, inventory exposure, cash burn, and runway.
      Until management supplies those schedules, funding raised and order
      announcements should be treated as financing and demand signals rather
      than proof of durable unit economics.
    claimRefs: [CI003, CI008, CI012, CI013, CI016]
