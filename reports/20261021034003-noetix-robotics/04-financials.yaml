    rows:
      - [Bumi launch price, "9,998 yuan (about US$1,380)", "Presale opened in October 2025; per robot", "Independent profile; corroborated by Forbes as below $1,500", "Supports low entry price, not realized ASP"]
      - [Bumi early demand, "100 units first hour; 500 within two days", "JD.com launch window", "Third-party report of sales", "Short launch window does not establish retention or recurring demand"]
      - [Ten-thousand-yuan robot orders, "Thousands of online and offline orders", "Company statement dated November 24, 2025", "Company-claimed; delivery and cancellation status unspecified", "Cannot be converted into revenue without paid-delivery data"]
      - [Overseas expansion plan, "First batch of 1,000 units", "Planned by Q2 2026 across five regions", "Third-party report of management plan; completion not shown", "Requires shipment, acceptance, and after-sales cost evidence"]
    notes: "Order, sale, preorder, and delivery language is preserved by source; the rows are not a common funnel and do not share one population or recognition period."
    claimRefs: [CI003, CI005, CI006, CI010]
  - id: TI003
    title: Unit economics and capital-adequacy ledger
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Gross margin by SKU, null, Low, "Core test of whether low prices absorb hardware, warranty, and support costs", "Audited SKU-level revenue, COGS, warranty, freight, and channel fees"]
      - [Cost-engineering inputs, "In-house boards/drivers; composites; selective metal; mostly domestic sourcing", Medium, "Identifies cost levers but not their monetary contribution", "BOM, labor, yield, scrap, and supplier concentration by SKU"]
      - [CAC and payback, null, Low, "Required to judge consumer launch efficiency and enterprise sales economics", "Spend and contribution margin by acquired and retained customer cohort"]
      - [Cash burn and runway, null, Low, "Determines financing dependency and timing of the next raise", "Monthly cash bridge, unrestricted cash, debt, capex, and working-capital plan"]
      - [External funding raised, "More than $150 million reported by Forbes", Medium, "Indicates financing access but not current liquidity", "Cap table, proceeds received, remaining cash, and use-of-funds reconciliation"]
    notes: "Funding raised is not cash available, registered capital is not financing proceeds, and every null is an unavailable private metric rather than a zero."
    claimRefs: [CI011, CI013, CI014, CI015, CI016]
