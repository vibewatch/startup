callouts:
  - calloutType: risk
    title: Orders are not revenue
    body: >-
      Announced sales, orders, preorders, and planned deliveries use different
      definitions and cannot establish paid delivery, revenue recognition, or
      gross margin without management schedules.
    claimRefs: [CI005, CI006, CI007, CI008, CI010]
  - calloutType: recommendation
    title: Gate underwriting on a cash and unit-economics data room
    body: >-
      Require invoice-to-cash reconciliation by SKU, contribution margin after
      warranty and support, inventory aging, returns, unrestricted cash, monthly
      burn, debt, capex, and a base/downside runway model before pricing risk.
    claimRefs: [CI011, CI013, CI014, CI015, CI016]
