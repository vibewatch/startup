evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Complete board roster, voting rights, founder ownership, delegated executive responsibilities, and succession
      plan.
    whyItMatters: Without governance evidence, founder dependence and investor control cannot be assessed.
    diligencePath: >-
      Request the cap table, articles, board minutes, executive organization chart, employment terms, and succession
      documentation.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: Valuation, cumulative equity and debt raised, current cash, revenue, gross margin, and cash-flow statements.
    whyItMatters: A disclosed round amount is not valuation, total raised, cash available, revenue, or runway.
    diligencePath: >-
      Obtain financing documents, audited financial statements, monthly management accounts, bank balances, and the
      current operating plan.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-scale
    missingEvidence: >-
      Order-level deposits, cancellations, shipments, returns, activations, retained users, and after-sales cost by
      model and geography.
    whyItMatters: >-
      Reported orders and delivery targets cannot establish recognized revenue, customer count, retention, or unit
      economics.
    diligencePath: >-
      Reconcile order-system exports to invoices, cash receipts, shipment scans, device activations, returns, and
      service tickets.
    relatedQuestionRefs:
      - QO005
      - QO007
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: stakeholders
    missingEvidence: >-
      Complete investor syndicates for all nine reported rounds and the rights, ownership, and board representation of
      each stakeholder.
    whyItMatters: The public stakeholder map cannot establish control, dilution, preference overhang, or related-party exposure.
    diligencePath: >-
      Request the fully diluted cap table, financing history, shareholder register, side letters, and board-observer
      agreements.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: legal-regulatory
    missingEvidence: >-
      Independent legal, regulatory, recall, safety-incident, and product-liability records for the company and its
      deployed robots.
    whyItMatters: >-
      The assigned adverse search returned no substantive independent legal record, which is not evidence that no
      incidents exist.
    diligencePath: >-
      Run jurisdiction-specific court, corporate registry, product-safety, cybersecurity, sanctions, and regulator
      checks using legal names and affiliates.
    relatedQuestionRefs:
      - QO003
      - QO007
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Credible market values, CAGR, installed base, annual segment shipments, and geography-specific adoption
      denominators for consumer and education humanoids.
    whyItMatters: >-
      Without common units and denominators, product-level signals cannot support a defensible TAM, SAM, SOM,
      penetration rate, or valuation multiple.
    diligencePath: >-
      Commission a bottom-up market model using audited channel sell-through, distributor inventory, segment ASPs,
      replacement cycles, and public procurement data.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-segments
    missingEvidence: >-
      Customer-level procurement paths, named budget owners, sales-cycle length, utilization, renewal behavior, and
      measured ROI by segment.
    whyItMatters: Public use-case labels do not show who controls budget or whether pilots convert into repeatable paid deployments.
    diligencePath: >-
      Review CRM cohorts and contracts, then interview at least two buyers in each priority segment about budget source,
      approval path, deployment, and outcomes.
    relatedQuestionRefs:
      - QM004
      - QM010
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: substitutes
    missingEvidence: >-
      Comparable cost, outcome, switching-friction, and buyer-preference evidence for manual workflows, fixed
      automation, educational kits, and other non-humanoid options.
    whyItMatters: Addressable spend is overstated if buyers can solve the job more cheaply without a humanoid form factor.
    diligencePath: Build a workflow-level alternative-cost benchmark and validate it through buyer interviews and lost-deal analysis.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM001
  - type: conflicting-data
    severity: material
    topic: demand-quality
    missingEvidence: >-
      Audited orders, cancellations, deliveries, returns, active use, support cost, recognized revenue, and repeat
      purchases by product and geography.
    whyItMatters: >-
      Company-reported launch figures and pre-orders may materially overstate durable adoption and cannot be converted
      into revenue or SOM.
    diligencePath: >-
      Reconcile order, shipment, acceptance, refund, activation, and revenue ledgers, then sample confirmations from
      customers and channel partners.
    relatedQuestionRefs:
      - QM002
      - QM003
      - QM007
      - QM008
      - QM010
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: peer-benchmarking
    missingEvidence: >-
      Independent head-to-head tests of locomotion, autonomy, reliability, safety, and lifetime cost across Noetix and
      named peers.
    whyItMatters: >-
      Without normalized tests, affordability and portfolio breadth cannot establish product superiority or moat
      durability.
    diligencePath: >-
      Commission a repeatable buyer-use-case benchmark using production units and disclose configurations, failures, and
      maintenance inputs.
    relatedQuestionRefs:
      - QP003
      - QP006
      - QP007
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: pricing-and-switching-gaps
    missingEvidence: >-
      Executed contracts, realized prices, warranty and service terms, integration cost, renewal behavior, and
      multi-homing rates.
    whyItMatters: List prices cannot show gross margin, delivered cost, lock-in, or buyer willingness to renew.
    diligencePath: >-
      Review a stratified contract sample and customer cohort data, then interview buyers that renewed, multi-homed, or
      churned.
    relatedQuestionRefs:
      - QP004
      - QP005
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: commercialization
    missingEvidence: >-
      Reconciliation of orders, paid deposits, shipped units, accepted deployments, returns, active use, and repeat
      purchases.
    whyItMatters: Vendor-reported orders and production claims do not establish sell-through, retention, or durable demand.
    diligencePath: Reconcile ERP, logistics, payment, return, and telemetry records by product and customer cohort.
    relatedQuestionRefs:
      - QP002
      - QP006
      - QP008
    relatedTableRefs:
      - TP001
      - TP002
  - type: missing-source
    severity: material
    topic: intellectual-property
    missingEvidence: >-
      Patent schedule, claim mapping, freedom-to-operate review, component sourcing, and evidence of exclusive supply or
      channel rights.
    whyItMatters: Patent counts and full-stack claims do not by themselves show defensibility or protection from commoditization.
    diligencePath: >-
      Conduct technical IP diligence and map each differentiating subsystem to ownership, supplier concentration, and
      alternatives.
    relatedQuestionRefs:
      - QP005
      - QP006
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: SKU-level recognized revenue, COGS, gross margin, warranty, freight, support, return rates, CAC, and payback.
    whyItMatters: Low list prices cannot be underwritten without contribution margin and acquisition economics.
    diligencePath: Obtain monthly cohort and SKU schedules reconciled to the general ledger, invoices, returns, and cash receipts.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Unrestricted cash, monthly burn, debt, capex commitments, working capital, planned use of funds, and next-round
      trigger.
    whyItMatters: Funding raised and registered capital do not establish current liquidity or runway.
    diligencePath: Review bank statements, debt documents, the board-approved budget, and a monthly base/downside cash bridge.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: revenue-quality
    missingEvidence: Reconciliation of orders and preorders to paid, delivered, accepted, non-returned units and recognized revenue.
    whyItMatters: Public demand counts use different definitions and cannot establish sell-through or revenue quality.
    diligencePath: >-
      Request order-level status, cancellation and return data, shipment records, invoices, and cash collection by SKU
      and channel.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Realized pricing, discounts, contract duration, payment terms, software or service attach, and channel
      commissions.
    whyItMatters: Public list prices do not determine net revenue or margin.
    diligencePath: Sample executed contracts and invoices across consumer, education, enterprise, and overseas channels.
    relatedQuestionRefs:
      - QI002
      - QI006
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: safety-and-reliability
    missingEvidence: >-
      Named product-safety, electrical, battery, cybersecurity, and privacy certifications plus incident, recall,
      failure-rate, and uptime records.
    whyItMatters: >-
