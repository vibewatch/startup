      - Scenario
      - Evidence-conditioned assumptions
      - Valuation and return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Reported orders convert to paid low-return deliveries; new capital scales production; product margins improve
        - >-
          Value against verified forward revenue and margin using independently sourced peer transactions; no public
          range is currently defensible
        - Medium-low until conversion and margin data arrive
        - Returns, warranty expense, or delivery delays erase contribution margin
      - - Base
        - Funding supports production but demand evidence remains mixed and economics stay private
        - >-
          Use milestone-conditioned tranches or defer entry until cap table, preferences, and audited economics are
          reviewed
        - Medium-high based on current evidence gaps
        - New round terms imply unexpected dilution or cash needs recur before commercial proof
      - - Bear
        - >-
          Pre-orders convert weakly, low pricing creates service burden, or industrial claims do not become repeat
          deployments
        - No entry absent a reset price and downside protection tied to liquidation and dilution terms
        - Medium because retained sources do not close these risks
        - Negative unit contribution persists after scaled production or announced demand cannot be reconciled to cash
    notes: >-
      Scenario signals are qualitative, not numerical probabilities; valuation ranges and target returns are
      intentionally withheld because public evidence lacks entry price, security terms, audited revenue, and margins.
    claimRefs:
      - CV001
      - CV005
      - CV009
      - CV010
      - CV011
      - CV014
      - CV015
      - CV016
