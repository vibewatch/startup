chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product scope
        blocks:
          - type: paragraph
            body: >-
              Noetix Robotics was founded in Beijing in September 2023 and develops humanoid robots that combine
              artificial intelligence, robotic bionics, perception, and motion control. Its current official sites
              present a broad portfolio spanning Bumi, Xiaoyue, N2, E1, W1, and Xiaonuo rather than a single-product
              company. The positioning reaches consumer companionship and education as well as research, service, and
              industrial use cases, but the public record does not disclose revenue mix by product or market. Bumi's
              reported CNY 9,998 launch price is strategically important because it signals a consumer-accessibility
              thesis, not evidence that the company has achieved attractive gross margins, repeat usage, or scaled
              after-sales economics.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO009
              - CO016
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
