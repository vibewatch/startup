  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Define the market before sizing it
        blocks:
          - type: paragraph
            body: >-
              The investable market should not be framed as all robotics or even all humanoids. Noetix's near-term wedge
              is affordable humanoid hardware for household entertainment and education, led by Bumi, while N2 and the
              bionic product line extend the opportunity into research, guided tours, reception, entertainment,
              healthcare, and industrial collaboration. Those applications have different buyers, budgets, safety
              requirements, support burdens, and replacement cycles, so their spend cannot be added without a common
              denominator. Industrial automation, fixed kiosks, conventional educational kits, and manual service
              workflows are adjacencies or substitutes rather than automatically addressable revenue. This boundary
              keeps a low consumer unit price from being mistaken for evidence that Noetix can capture the much broader
              automation market.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
      - number: '2.2'
        title: Product signals do not yet form a TAM
        blocks:
          - type: paragraph
            body: >-
              The available sizing evidence is bottom-up and heterogeneous. Sources report a roughly CNY 9,998 consumer
              price, 500 Bumi units sold in the first 48 hours, several thousand combined orders by year-end 2025, more
              than 2,500 N2 pre-orders, a 1,000-unit Bumi order, and an education partner said to cover more than 70,000
              schools. These are useful demand signals, but they mix prices, launch sales, pre-orders, one customer
              order, and a partner's potential reach. They cannot be summed, annualized, or treated as revenue. None of
              the eight retained sources supplies a market value, CAGR, installed-base denominator, independently
              measured sell-through, or geography-specific adoption rate. Accordingly, this chapter leaves TAM, SAM, and
              SOM unquantified rather than manufacturing precision.
            claimRefs:
              - CM005
              - CM009
              - CM010
              - CM011
              - CM012
              - CM014
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM005
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM009
              - CM011
              - CM012
              - CM014
              - CM016
      - number: '2.3'
        title: Buyers, users, and payers differ by segment
        blocks:
          - type: paragraph
            body: >-
              Household adoption is likely a discretionary-electronics purchase in which the buyer and payer are usually
              the same, while the user may be a child or family. Education introduces a more complex route: a school,
              programming platform, or parent may buy, students use the robot, and curriculum or procurement owners
              control deployment. Research institutions can justify purchases from laboratory or equipment budgets,
              whereas reception, guided-tour, healthcare, and industrial applications require an organizational buyer
              and a workflow owner. The public evidence identifies these use cases but does not disclose procurement
              cycles, budget lines, renewal behavior, utilization, or customer-level ROI. The buyer map is therefore an
              analytical routing hypothesis for diligence, not a verified sales funnel.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM007
              - CM008
              - CM012
              - CM013
      - number: '2.4'
        title: Affordability opens trials; support and proof govern scale
        blocks:
          - type: paragraph
            body: >-
              Price disruption is the clearest adoption driver: two specialist profiles place Bumi near CNY 9,998 or
              US$1,400, while two others publish different approximate N2 prices, illustrating both the low-cost
              positioning and the fragility of cross-market comparisons. Noetix also exposes purchase, documentation,
              and after-sales routes on its official site, which is necessary infrastructure for adoption but not proof
              of service quality. The principal constraints are unresolved regional pricing, shipping, warranty
              coverage, battery runtime, verified sell-through, and realized overseas delivery. For valuation, product
              orders should earn option value only after conversion, returns, support cost, utilization, and repeat
              demand are measured; otherwise headline reach can overstate the revenue pool and compress the apparent
              time to scale.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
              - CM014
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Orders are not a recurring-demand denominator
            body: >-
              Launch sales, pre-orders, a single large order, and planned deliveries do not reveal cancellations,
              returns, acceptance, active use, repeat purchases, or recognized revenue.
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM013
              - CM016
          - type: callout
            title: Price is an adoption wedge, not a TAM
            body: >-
              Affordable hardware may expand trial demand, but valuation should wait for evidence that low price
              survives support costs and converts into repeatable segment economics.
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The evidence identifies Unitree Robotics, AgiBot, and RobotEra as named direct peers, while Gasgoo places
              LimX Dynamics, LinkerBot, GALAXEA, and AI² Robotics in the broader capital-rich embodied-robotics cohort.
              The buyer set is wider than those venture-backed names: Noetix also competes with internal robotics
              development, conventional automation, lower-cost educational kits, and continued manual work. The retained
              pool does not provide comparable specifications or procurement outcomes for those substitutes, so the
              table treats them as solution classes rather than pretending they are measured product benchmarks. Noetix
              itself spans consumer, education, research, reception, home-service, and industrial-collaboration use
              cases, which expands its addressable job set but also exposes it to specialists in each category.
            claimRefs:
              - CP004
              - CP005
