      - number: '3.3'
        title: Pricing, distribution, and switching
        blocks:
          - type: paragraph
            body: >-
              Bumi's reported RMB 9,998 list price is the sharpest observable wedge: AI Market Watch compares it with a
              RMB 39,999 Unitree R1 reference price. That comparison is useful for list-price positioning, not for
              delivered cost, capability parity, discounts, warranty, service, or lifetime economics. No public contract
              pricing is present in the retained evidence for N2, customized automation, or the other named peers.
              Distribution is developing through Noetix's direct purchase and support surfaces, the RBTX partner
              channel, and a stated international expansion plan. Switching cost and lock-in are therefore unquantified;
              SDK and documentation may create integration value, but no source establishes proprietary data effects,
              exclusive channels, or customer retention.
            claimRefs:
              - CP003
              - CP006
              - CP007
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP015
      - number: '3.4'
        title: Durability and adverse case
        blocks:
          - type: paragraph
            body: >-
              The bull case is cost disruption supported by vertical integration, a broad product range, and reported
              movement into scaled delivery. The adverse case is that these attributes are replicable in a heavily
              financed Chinese ecosystem before Noetix proves reliability, repeat purchase, or attractive service
              economics. Its official 2025 update claimed thousands of orders and large-scale delivery, while Robotics
              Registry explicitly labels its recorded specifications vendor-claimed. Nearly RMB 1 billion of Series B
              financing may fund industrialization, but funding raised is not a measure of cash availability,
              profitability, or moat. On current evidence, Noetix has a visible affordability and portfolio thesis, not
              an independently verified durable advantage.
            claimRefs:
              - CP008
              - CP009
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Affordability is the clearest wedge
            body: >-
              The retained comparison places Bumi at RMB 9,998 against a RMB 39,999 Unitree R1 reference, while Noetix
              also exposes a broader bipedal and biomimetic catalog.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: callout
            title: Capital and claims are ahead of independent proof
            body: >-
              A capitalized entrant cohort and mostly vendor-derived operating metrics make commoditization, execution,
              and pricing pressure more credible than a durable moat conclusion.
            calloutType: risk
            claimRefs:
