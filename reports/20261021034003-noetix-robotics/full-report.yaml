  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing evidence
        blocks:
          - type: paragraph
            body: >-
              The public model is primarily per-unit hardware: Noetix's website presents six named robots, while
              independent and partner profiles add a customized automation path for enterprise buyers. Bumi is the
              clearest public price point at 9,998 yuan, also described by Forbes as below $1,500; Robotico separately
              lists N2 from 39,000 yuan ($6,200). These are list or launch prices, not realized average selling prices.
              No reviewed source discloses discounts, contract terms, software or service attach rates, warranty
              revenue, revenue recognition policy, or mix by product. The resulting bridge therefore stops at
              undisclosed recognized revenue and gross profit rather than implying unsupported conversion or margin.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI008
              - CI016
          - type: table
            tableRef: TI001
            claimRefs:
