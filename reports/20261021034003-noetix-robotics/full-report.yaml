              - CO009
              - CO010
              - CO012
              - CO013
              - CO016
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Public profiles consistently identify Jiang Zheyuan as founder and chief executive, while Gasgoo
              identifies Zhang Shipu as a co-founder involved in overseas expansion planning. Jiang's reported
              reinforcement-learning research background is directionally relevant to embodied-AI development, and
              Zhang's comments connect leadership to manufacturing and international execution. However, the retained
              evidence does not disclose a board roster, voting rights, executive succession plan, or functional
              leadership below the founders. This creates key-person and governance risk: investors cannot determine
              whether product, manufacturing, finance, compliance, and international operations have independent
              accountable owners or are concentrated around the founding team.
            claimRefs:
              - CO004
              - CO005
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
              - CO014
              - CO016
      - number: '1.3'
        title: Financing and stakeholder structure
        blocks:
          - type: paragraph
            body: >-
              Gasgoo reported that Noetix announced a nearly CNY 1 billion Series B on March 2, 2026 and said this was
              its ninth financing round since inception. Those disclosures establish financing cadence and stage, but
              not total capital raised, pre- or post-money valuation, dilution, liquidation preferences, debt, or cash
              available. Expolume separately identifies support from the Beijing Robot Fund, while RBTX presents itself
              as a commercial-access partner. The retained Series B report does not name that round's investors, so the
              public stakeholder map is necessarily partial. A cap table, financing documents, and board materials are
              required before drawing conclusions about control or the economic alignment of major shareholders.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO008
              - CO015
      - number: '1.4'
        title: Milestones and scale signals
        blocks:
          - type: paragraph
            body: >-
              Public milestones show rapid movement from a September 2023 founding to an N2 race result, Bumi's October
              2025 launch, and a large Series B in March 2026. Reported demand indicators include more than 2,500 N2
              orders, 200 Bumi units sold within three hours of presales, and several thousand Bumi orders by the end of
              2025. These figures are not interchangeable with delivered units, recognized revenue, recurring customers,
              or retained users. Gasgoo also relayed a plan for 1,000 overseas deliveries by the second quarter of 2026;
              the retained sources do not confirm completion. An independent registry's vendor-claimed specification
              label and missing deployment fields reinforce the need for order-level, shipment, return, activation, and
              service data.
