      - number: '5.2'
        title: Architecture and technical differentiation
        blocks:
          - type: paragraph
            body: >-
              The available architecture evidence points to an integrated stack rather than a single software layer.
              EquityZen describes bionic mechanical structures, perception systems, motion-control algorithms, joint
              motors, and an embodied operating system; Expolume similarly identifies motion control, vision, and
              learning algorithms. Hybrid Electronics reports that N2 combines an 18-degree-of-freedom BLDC body with
              depth cameras and edge compute, though this supplier-oriented profile is not an independent benchmark. The
              differentiation thesis is consequently cost-aware mechatronics plus onboard perception and locomotion
              software, exposed through official SDK, documentation, and open-source links. Public materials do not
              reveal model architecture, training data, simulation-to-real performance, control-loop latency, component
              yields, or a defensible patent boundary.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE010
              - CE014
