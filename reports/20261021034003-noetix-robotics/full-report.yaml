      - number: '4.2'
        title: Orders, delivery signals, and go-to-market
        blocks:
          - type: paragraph
            body: >-
              Public traction is promising but definitionally weak. Origin of Bots reports 100 Bumi units sold in the
              first hour and 500 within two days on JD.com, while Noetix later said a roughly ten-thousand-yuan robot
              had received thousands of online and offline orders. Those periods, populations, cancellation rights, and
              delivery status differ. A robotics registry explicitly labels specifications vendor-claimed and
              deployments announced and cited only, so none of these counts should be treated as recognized revenue.
              Gasgoo described a plan for 1,000 overseas deliveries by the second quarter of 2026 and an ERP/MES-backed
              supply chain, but the assigned evidence does not establish completion of that plan as of the run date.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI005
              - CI006
              - CI010
      - number: '4.3'
        title: Cost structure and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              The only concrete cost evidence is architectural: Origin of Bots attributes the low price to in-house
              control boards and motor drivers, selective use of metal, composite materials, and mostly domestic
              sourcing. That may reduce bill-of-materials cost, but it does not reveal component cost, labor, warranty,
              after-sales, freight, channel fees, inventory turns, or gross margin. Forbes reports more than $150
              million raised, while Gasgoo reports registered capital of about 4.09 million yuan after a 26% increase;
              these are different metrics and neither equals cash available. Without a cash balance, burn, debt,
              committed capex, or working-capital schedule, runway and the trigger for another financing cannot be
              calculated.
            claimRefs:
              - CI011
              - CI013
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI011
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Financial underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Noetix has demonstrated price discovery and order interest across more than one hardware tier, and its
              announced manufacturing and overseas plans show an intent to scale. The adverse counterpoint is material:
              Origin of Bots says the low price limits capability and that the consumer robot market is crowded. The
              investment case therefore depends on evidence not present in the assigned pool—paid and delivered units by
              SKU, recognized revenue, gross margin after warranty and support, customer acquisition cost, channel
              economics, returns, inventory exposure, cash burn, and runway. Until management supplies those schedules,
              funding raised and order announcements should be treated as financing and demand signals rather than proof
              of durable unit economics.
            claimRefs:
              - CI003
              - CI008
              - CI012
              - CI013
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Orders are not revenue
            body: >-
              Announced sales, orders, preorders, and planned deliveries use different definitions and cannot establish
              paid delivery, revenue recognition, or gross margin without management schedules.
            calloutType: risk
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI010
          - type: callout
            title: Gate underwriting on a cash and unit-economics data room
            body: >-
              Require invoice-to-cash reconciliation by SKU, contribution margin after warranty and support, inventory
              aging, returns, unrestricted cash, monthly burn, debt, capex, and a base/downside runway model before
              pricing risk.
            calloutType: recommendation
            claimRefs:
              - CI011
              - CI013
              - CI014
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product portfolio and customer workflows
        blocks:
          - type: paragraph
            body: >-
              Noetix's current official surface lists six products: Bumi, Xiaoyue, N2, E1, W1, and Xiaonuo, while
              RoboHub separately describes five robot products and labels the company at pilot-delivery stage. The
              clearest externally reported entry product is Bumi: Humanoids Daily reported a sub-RMB 10,000 price, 94 cm
              height, 12 kg weight, education and home positioning, and an open programming interface. N2 is the
              athletic and developer-facing platform; E1 is positioned as a larger embodied-intelligence option. The
              remaining official product labels imply companion, bionic-interaction, and reception workflows, but their
              technical specifications, shipment status, and measurable outcomes are not disclosed in the assigned
              evidence. Portfolio breadth therefore exceeds the publicly verifiable maturity data behind each line.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
