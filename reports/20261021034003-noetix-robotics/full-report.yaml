      - number: '3.2'
        title: Differentiation and capability
        blocks:
          - type: paragraph
            body: >-
              The clearest differentiation is portfolio architecture rather than a proven performance lead. RobotsBeat
              describes a dual-track bipedal and biomimetic strategy, and the current company site lists six named
              products across consumer, athletic, technical, guidance, and companion roles. A partner listing broadens
              the N2 narrative into manufacturing, logistics, healthcare, and customer service, while the official site
              exposes SDK, documentation, support, and ecosystem surfaces. These elements could lower integration
              friction and enable multi-product distribution, but they remain primarily vendor or partner claims. The
              retained evidence contains no independent head-to-head benchmark for locomotion, reliability, safety,
              autonomy, or total cost of ownership.
            claimRefs:
