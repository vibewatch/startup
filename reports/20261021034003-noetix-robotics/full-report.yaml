      - number: '5.3'
        title: Deployment maturity, industrialization, and roadmap
        blocks:
          - type: paragraph
            body: >-
              Product maturity should be underwritten as early commercialization rather than proven scaled deployment.
              RoboHub's October 2026 profile still labels Noetix "Pilot Delivery." Gasgoo reported that the March 2026
              financing was intended to deepen home-consumer use and accelerate industrialization, and that the company
              planned an ERP/MES-enabled production and supply-chain system for customization, scale, and localized
              overseas service. Those are roadmap and company-reported plans, not evidence of achieved yield, field
              uptime, or after-sales capacity. The official homepage adds a September 2026 Scalabot
              embodied-intelligence sub-brand announcement, indicating continuing platform expansion. This pace creates
              option value but also raises execution risk across parallel hardware, software, manufacturing, and service
              programs.
            claimRefs:
              - CE002
              - CE011
              - CE012
              - CE015
      - number: '5.4'
        title: Trust, reliability, safety, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The public trust surface is incomplete. The official site links to after-sales service, tutorials,
              documentation, policies, and SDK downloads, and its footer lists two Chinese algorithm-record identifiers.
              RBTX, a partner marketplace, says collision avoidance and emergency-stop mechanisms meet global standards,
              but the assigned evidence provides no named standard, test report, certificate, recall record, incident
              history, privacy assessment, or security architecture. Humanoids Daily explicitly cautioned that Bumi's
              claimed high-performance capabilities remained to be demonstrated in real-world use. Component
              availability is another dependency because the public architecture relies on motor drivers, sensors,
              compute modules, batteries, and precision components. Investment diligence should require SKU-level
              certifications, reliability and failure-rate data, software-support commitments, supply-chain
              qualification, and independent field testing before treating marketing claims as production proof.
            claimRefs:
              - CE008
              - CE009
              - CE013
              - CE014
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Low entry price broadens access but does not prove product-market maturity
            body: >-
              Bumi's reported sub-RMB 10,000 price and open programming interface lower the experimentation barrier,
              while public evidence still lacks standardized field reliability, repeat-use, and support-cost data.
            calloutType: insight
            claimRefs:
              - CE003
              - CE004
              - CE013
          - type: callout
            title: Safety assertions are not yet diligence-grade
            body: >-
              A partner listing mentions collision avoidance, emergency stops, and global standards, but no named
              certification or test report appears in the assigned source set.
            calloutType: risk
            claimRefs:
              - CE009
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying contexts
        blocks:
          - type: paragraph
            body: >-
              The public portfolio points to a multi-segment strategy rather than one established ideal customer
              profile. Bumi is positioned for lower-cost consumer and education use, N2 and E1 for bipedal-motion
              development and research, and W1 for guided-tour or reception settings. Other retained profiles extend the
              marketed application set to healthcare, eldercare, home service, industrial collaboration, logistics, and
              customized automation. These descriptions identify plausible users and buying contexts, not verified
              deployments or economic buyers. Household buyers appear to be the intended payer for Bumi, institutions
              for education and research platforms, and venue or enterprise operators for service and industrial
              systems, but no source provides segment revenue, account counts, procurement cycles, or payer-level
              conversion data.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU012
      - number: '6.2'
        title: Adoption evidence is real but not yet comparable
        blocks:
          - type: paragraph
            body: >-
              The strongest quantity evidence is uneven. Korthos says Noetix reported delivery of 105 N2 and E1 units in
              July 2025, while Robotics Registry records an announced 105-unit shipment to undisclosed mass-production
              buyers dated August 1, 2025; these likely describe the same event and must not be added together. The
              registry separately reports 2,500-plus N2 preorders and 500 Bumi units sold during the first 48 hours on
              JD.com. Robotichina lists a 2026 Bumi target above 10,000 units. Deliveries, preorders, launch sales, and
              a management target have different statuses, time bases, and denominators, so they do not establish a
              coherent installed-base or sell-through trajectory. The evidence indicates launch demand, while active
              usage and repeat purchase remain unmeasured.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU015
      - number: '6.3'
        title: Named references, durability, and concentration remain unproven
        blocks:
          - type: paragraph
            body: >-
              None of the retained sources names an end customer and pairs that identity with a production deployment,
              measured outcome, or renewal. Robotics Registry labels its deployment log as announced and cited only, and
              its sole shipment row describes undisclosed buyers. RBTX, a channel partner rather than an independent
              benchmark, claims strategic relationships in automotive, e-commerce, and healthcare plus clients across
              three regions, but supplies no names, site counts, contract status, or outcomes. The source set also
              contains no NRR, GRR, churn, renewal, cohort, satisfaction, contract-length, or segment-revenue
              disclosure. As a result, customer durability, expansion, customer concentration, and channel dependence
              cannot be quantified from public evidence.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU012
              - CU013
              - CU015
      - number: '6.4'
        title: Public journey surfaces stop before renewal
        blocks:
          - type: paragraph
            body: >-
              Noetix has visible acquisition and support infrastructure: its official site presents a broad product
              catalog, a purchase-and-cooperation route, after-sales access, video tutorials, documentation, an app, and
              a mini-program. RoboAtlas also describes contact-sales routes, while RBTX offers a live product demo and
              presents itself as an access channel for business buyers. This creates a plausible journey from discovery
              through evaluation, purchase, deployment, and support. The public trail then stops: there is no evidence
              tying those surfaces to activation, utilization, cross-sell, renewal, or advocacy. Diligence should
              therefore request account-level cohorts that reconcile orders, shipments, activations, monthly active
              robots, support incidents, repeat purchases, renewals, and revenue by direct versus partner channel.
            claimRefs:
              - CU005
              - CU011
              - CU012
              - CU014
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU011
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Launch demand is not retention
            body: >-
              The public quantities mix preorders, launch sales, deliveries, and a target. None measures active use,
              repeat purchase, renewal, or customer-level revenue, so they cannot establish durable product-market fit.
            calloutType: risk
            claimRefs:
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Residual risk hierarchy and investment implications
        blocks:
          - type: paragraph
            body: >-
              The risk hierarchy is driven by the mismatch between ambitious commercialization plans and the limited
              primary evidence available to test them. Public materials describe a broad product portfolio, consumer and
              education use cases, international expansion, and manufacturing-system buildout, but the retained set does
              not include named product certifications, regulator decisions, court records, incident histories, recall
              records, or audited operating metrics. This absence is bounded to the reviewed source set and is not proof
              that the company lacks certifications or has never had an incident. The highest residual exposures are
              therefore production and export-service execution, safety and compliance substantiation, order-to-delivery
              conversion, and financial transparency. Investment should remain conditional on a source-room review that
              reconciles paid orders, shipments, returns, warranty events, cash, runway, cap table, and
              jurisdiction-specific approvals before valuation or growth assumptions are credited.
            claimRefs:
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR013
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, legal, safety, and IP exposure
        blocks:
          - type: paragraph
            body: >-
              The company website provides links to terms and policies, documentation, tutorials, and after-sales
              service, while a channel partner claims collision avoidance and emergency-stop mechanisms meet global
              industry standards. Neither source names the applicable standards, test laboratories, certificates,
              jurisdictions, or product variants, so the partner statement should not be treated as independent
              certification. A separate market profile claims more than 30 patents, but no patent-office records were
              present in the assigned evidence. For consumer, school, community, healthcare, and international
              deployment, the diligence threshold should be product-by-product safety files, privacy and data-flow maps,
              software-update controls, insurance, warranty and recall procedures, patent schedules, and legal searches
              in each launch jurisdiction. Failure to provide named, current certificates and an incident register
              before scaled deployment would be a thesis-break trigger.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR011
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR011
              - CR015
      - number: '7.3'
        title: Production, quality, service, and demand-conversion risk
        blocks:
          - type: paragraph
            body: >-
              Gasgoo reported that Noetix planned 1,000 first-batch overseas deliveries by the second quarter of 2026
              and was building ERP and MES capabilities plus localized after-sales service. As of the run date, the
              retained evidence does not verify whether that dated milestone was completed. The same report described
              several thousand orders by the end of 2025 and initial deliveries scheduled for March 2026, while a
              robotics registry repeated launch-sales and preorder figures but explicitly labeled specifications as
              vendor-claimed and listed neither deployment countries nor service footprint. Orders, preorders,
              production, shipments, accepted deliveries, and repeat usage are different denominators. Underwriting
              should require a monthly bridge across those stages, failure and return rates by model, warranty cost,
              component yield, field incidents, and service response by geography. A material missed-delivery backlog
              without a reconciled cause and recovery plan would break the commercialization thesis.
            claimRefs:
              - CR001
              - CR005
              - CR008
              - CR009
              - CR010
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR005
              - CR008
              - CR009
              - CR010
              - CR015
      - number: '7.4'
        title: Capital, partner, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Gasgoo reported a nearly CNY 1 billion Series B round and nine financing rounds since inception, whereas
              Robotico lists USD 46 million raised; the retained sources do not provide definitions, dates, currencies,
              or cap-table documents sufficient to reconcile those figures. EquityZen publicly advertises valuation,
              cap-table, financial, and risk information only after account qualification, reinforcing that key
              underwriting inputs are not public. Partner and profile sources also describe domestic-supply-chain
              reliance, JD.com launch sales, reseller availability, and planned international channels, but do not
              quantify counterparty concentration or alternate sourcing. Monitoring should track cash runway, funding
              close documentation, preference terms, supplier share by bill of materials, channel share of paid
              shipments, service coverage, and renewal or repeat-use evidence. Inability to reconcile financing
              proceeds, paid shipments, gross margin, or a critical single-source component should pause investment
              regardless of headline demand.
            claimRefs:
              - CR006
              - CR007
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR007
              - CR011
              - CR012
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Evidence-access kill criteria
            body: >-
              Pause underwriting if Noetix cannot provide model-specific safety evidence, a reconciled order-to-delivery
              bridge, audited cash and financing records, field-quality data, and supplier and channel concentration
              before scaled international deployment.
            calloutType: risk
            claimRefs:
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and financing context
        blocks:
          - type: paragraph
            body: >-
              The recommendation is track and research more rather than buy. Two 2026 reports place the Series B at
              nearly RMB 1 billion, about US$140 million, and identify a CATL-linked industrial investment platform as
              lead; one also describes this as the ninth financing round and says the company completed a joint-stock
              reform. Those facts improve financing capacity and may help manufacturing execution, but they do not
              establish the post-money valuation, ownership sold, liquidation preference, debt, cash available, or
              investor return potential. EquityZen lists valuation, cap-table, revenue, and preference information only
              behind its access process, so the reviewed public page cannot anchor an entry price. A separate profile's
              US$46 million total-raised figure is also below the reported size of the latest round alone, reinforcing
              the need for a primary financing ledger.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV012
              - CV013
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV012
              - CV013
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV007
              - CV009
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is scale plus affordability: recent funding can support production, the official
              site presents a multi-model product portfolio, and an independent registry records vendor-claimed Bumi
              launch sales and N2 pre-orders. The anti-thesis is that these are not yet validated revenue, retention,
              margin, or cash-conversion metrics. Gasgoo's own sector framing says investors are moving beyond technical
              hype toward viable business models and cash generation. That standard remains unmet in the retained public
              record. A partner listing describes broad deployments and customer trust, while directories repeat
              financing and operating claims, but the fetched text does not identify contracts, audited invoices, cohort
              behavior, warranty costs, or independently verified installations. Product breadth and order announcements
              therefore support continued diligence, not a premium valuation by themselves.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
      - number: '8.3'
        title: Scenario and valuation framework
        blocks:
          - type: paragraph
            body: >-
              A conventional revenue-multiple or discounted-cash-flow valuation is not supportable from this evidence
              set because audited revenue, gross margin, recurring mix, working capital, burn, and normalized cash flow
              are absent. The scenario framework therefore uses observable diligence milestones rather than invented
              ranges. The bull case requires conversion of reported demand into paid, low-return deliveries with
              improving unit economics; the base case assumes capital funds production while commercial proof remains
              mixed; the bear case assumes order conversion, reliability, or cash conversion disappoints. Entry
              discipline should use a staged or milestone-conditioned structure only after the company supplies a fully
              diluted cap table and reconciles financing totals. Product-price comparisons can inform adoption, but they
              are not independent equity-valuation benchmarks and cannot substitute for peer enterprise values or
              transaction multiples.
            claimRefs:
              - CV001
              - CV005
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness and final diligence
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is unproven. EquityZen describes IPO, merger or acquisition, and eligible secondary resale
              as generic private-market exit mechanisms, but its public page does not establish that a Noetix position
              is currently liquid or eligible for a specific transaction. Before investment, the company should provide
              signed financing documents, a fully diluted cap table, preference and anti-dilution terms, audited
              financials, monthly bookings-to-cash conversion, product-level gross margin, returns and warranty data,
              customer concentration, and evidence separating pre-orders from paid deliveries. Thesis-break triggers are
              a financing reconciliation that implies materially worse dilution than represented, persistent negative
              unit contribution after scaled production, weak conversion of announced orders, or inability to validate
              the low-cost products' reliability and service burden.
            claimRefs:
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price discipline overrides company-quality signals
            body: >-
              Fresh capital and product momentum justify continued diligence, but no public equity value, fully diluted
              ownership, preference stack, or audited unit economics supports a price-anchored return case.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV012
              - CV013
              - CV016
