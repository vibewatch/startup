companyProfile:
  summary: >-
    Noetix Robotics is a Beijing humanoid-robotics company founded in September 2023. It develops bipedal and bionic
    robots spanning affordable consumer and education products, research and developer platforms, reception and
    guided-tour systems, and interaction-oriented companions. Public reporting identifies a nearly CNY 1 billion Series
    B in March 2026, but current valuation, cumulative funding, audited financial performance, governance, and verified
    commercial deployment remain undisclosed or unreconciled.
