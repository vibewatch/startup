        - label: Financial and cap-table transparency
          values: [High, Medium-high, Private, High]
        - label: Channel and supplier concentration
          values: [Medium, Medium-high, Partially described, Medium-high]
    approximationNotes: >-
      Categorical analyst assessment, not a measured probability model; ratings reflect evidence
      quality and residual uncertainty as of 2026-10-21.
    claimRefs: [CR013, CR015, CR016]
callouts:
  - calloutType: risk
    title: Evidence-access kill criteria
    body: >-
      Pause underwriting if Noetix cannot provide model-specific safety evidence, a reconciled
      order-to-delivery bridge, audited cash and financing records, field-quality data, and
      supplier and channel concentration before scaled international deployment.
    claimRefs: [CR015, CR016]
