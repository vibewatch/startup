company:
  name: Noetix Robotics
chapter:
  number: 7
  title: Risks
  summary: >-
    Noetix Robotics' principal public-evidence risks are executional: converting
    reported orders into supported deliveries, substantiating safety and compliance
    across export markets, and scaling service alongside production. The retained
    evidence also leaves material gaps around audited financials, certifications,
    incidents, litigation, and patent status, making document access a condition
    for underwriting rather than evidence that adverse events have not occurred.
sections:
  - id: residual-risk-hierarchy
    title: Residual risk hierarchy and investment implications
    body: >-
      The risk hierarchy is driven by the mismatch between ambitious commercialization
      plans and the limited primary evidence available to test them. Public materials
      describe a broad product portfolio, consumer and education use cases, international
      expansion, and manufacturing-system buildout, but the retained set does not include
      named product certifications, regulator decisions, court records, incident histories,
      recall records, or audited operating metrics. This absence is bounded to the reviewed
      source set and is not proof that the company lacks certifications or has never had an
      incident. The highest residual exposures are therefore production and export-service
      execution, safety and compliance substantiation, order-to-delivery conversion, and
      financial transparency. Investment should remain conditional on a source-room review
      that reconciles paid orders, shipments, returns, warranty events, cash, runway, cap
      table, and jurisdiction-specific approvals before valuation or growth assumptions are
      credited.
    claimRefs: [CR015, CR016]
    figureRefs: [FR001]
  - id: regulatory-legal-safety
    title: Regulatory, legal, safety, and IP exposure
    body: >-
      The company website provides links to terms and policies, documentation, tutorials,
      and after-sales service, while a channel partner claims collision avoidance and
      emergency-stop mechanisms meet global industry standards. Neither source names the
      applicable standards, test laboratories, certificates, jurisdictions, or product
      variants, so the partner statement should not be treated as independent certification.
      A separate market profile claims more than 30 patents, but no patent-office records
      were present in the assigned evidence. For consumer, school, community, healthcare,
      and international deployment, the diligence threshold should be product-by-product
      safety files, privacy and data-flow maps, software-update controls, insurance, warranty
      and recall procedures, patent schedules, and legal searches in each launch jurisdiction.
      Failure to provide named, current certificates and an incident register before scaled
      deployment would be a thesis-break trigger.
    claimRefs: [CR002, CR003, CR004, CR011, CR015]
    tableRefs: [TR001]
  - id: operations-quality-demand
    title: Production, quality, service, and demand-conversion risk
    body: >-
      Gasgoo reported that Noetix planned 1,000 first-batch overseas deliveries by the
      second quarter of 2026 and was building ERP and MES capabilities plus localized
      after-sales service. As of the run date, the retained evidence does not verify whether
      that dated milestone was completed. The same report described several thousand orders
      by the end of 2025 and initial deliveries scheduled for March 2026, while a robotics
      registry repeated launch-sales and preorder figures but explicitly labeled specifications
      as vendor-claimed and listed neither deployment countries nor service footprint. Orders,
      preorders, production, shipments, accepted deliveries, and repeat usage are different
      denominators. Underwriting should require a monthly bridge across those stages, failure
      and return rates by model, warranty cost, component yield, field incidents, and service
      response by geography. A material missed-delivery backlog without a reconciled cause and
      recovery plan would break the commercialization thesis.
    claimRefs: [CR001, CR005, CR008, CR009, CR010, CR015]
    tableRefs: [TR002]
  - id: capital-partners-kill-criteria
    title: Capital, partner, and concentration risk
    body: >-
      Gasgoo reported a nearly CNY 1 billion Series B round and nine financing rounds since
      inception, whereas Robotico lists USD 46 million raised; the retained sources do not
      provide definitions, dates, currencies, or cap-table documents sufficient to reconcile
      those figures. EquityZen publicly advertises valuation, cap-table, financial, and risk
      information only after account qualification, reinforcing that key underwriting inputs
      are not public. Partner and profile sources also describe domestic-supply-chain reliance,
      JD.com launch sales, reseller availability, and planned international channels, but do
      not quantify counterparty concentration or alternate sourcing. Monitoring should track
      cash runway, funding close documentation, preference terms, supplier share by bill of
      materials, channel share of paid shipments, service coverage, and renewal or repeat-use
      evidence. Inability to reconcile financing proceeds, paid shipments, gross margin, or a
      critical single-source component should pause investment regardless of headline demand.
    claimRefs: [CR006, CR007, CR011, CR012, CR013, CR014, CR016]
    tableRefs: [TR003]
