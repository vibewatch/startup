  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Counterparty or resource
      - Role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Public mitigation
      - Residual exposure
    rows:
      - - External capital and private financial data
        - Investors and future financing providers
        - Fund industrialization and consumer expansion
        - Round counts and raised-capital figures are not reconcilable from retained public sources.
        - Capital arrives late, carries adverse terms, or proves insufficient for hardware scale.
        - High
        - Nearly CNY 1 billion Series B was reported in March 2026.
        - High pending audited cash, burn, runway, cap table, and preference terms.
      - - Component and manufacturing supply
        - Domestic suppliers and production system
        - Components, assembly, and scale-up
        - A profile claims a 100% domestic supply chain but provides no supplier shares or alternates.
        - Single-source failure, yield problems, or working-capital strain delay deliveries.
        - High
        - Vertical integration and ERP/MES investment are claimed or planned.
        - High pending bill-of-materials concentration, yields, and alternate qualification.
      - - Sales, reseller, and service channels
        - JD.com, RBTX, resellers, and planned overseas service partners
        - Demand capture, distribution, and support
        - Launch activity is visible, but channel share of paid shipments is not disclosed.
        - A key channel changes terms or service coverage trails installed units.
        - Medium-high
        - Multiple markets and partner routes are described.
        - Medium-high pending channel mix, contracts, return rates, and service-level evidence.
    notes: >-
      Dependency assessment uses public plans and channel descriptions; concentration percentages,
      contract terms, and supplier shares remain private-evidence gaps.
    claimRefs: [CR006, CR007, CR011, CR012, CR014, CR016]
