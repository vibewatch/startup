        certifications plus incident, recall, failure-rate, and uptime records.
      whyItMatters: >-
        Partner marketing and registration identifiers do not establish safe,
        reliable operation around consumers, students, or workers.
      diligencePath: >-
        Obtain certification reports, test-lab identities, hazard analyses, incident
        logs, warranty-return data, and SKU-level field reliability cohorts.
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: >-
        Public repository activity, package downloads, API changelog, contributor
        count, forum activity, or another practitioner-community adoption proxy.
      whyItMatters: >-
        Official SDK and documentation links show availability but not ecosystem
        usage, software quality, or developer retention.
      diligencePath: >-
        Request repository and package-registry links, SDK release history, active
        developer counts, support-ticket cohorts, and named integrator references.
      relatedQuestionRefs: [QE006]
    - type: private-evidence-only
      severity: material
      topic: performance-validation
      missingEvidence: >-
        Independent task-success, runtime, fall-rate, recovery, payload, latency,
        environmental-tolerance, and duty-cycle benchmarks by SKU.
      whyItMatters: >-
        Demonstrations and component specifications do not establish repeatable
        customer performance or maintenance economics.
      diligencePath: >-
        Commission controlled third-party testing and inspect raw field telemetry
        segmented by hardware revision, workload, and operating environment.
      relatedQuestionRefs: [QE005]
    - type: private-evidence-only
      severity: material
      topic: product-maturity
      missingEvidence: >-
        SKU-level production start dates, units shipped and active, yield, backlog,
        warranty returns, software support windows, and deployment outcomes.
      whyItMatters: >-
        A broad portfolio can mask prototypes or low-volume pilots and multiplies
        manufacturing and support complexity.
      diligencePath: >-
        Reconcile serialized-unit production records, customer acceptance documents,
        service logs, BOM revisions, and monthly yield by product family.
      relatedQuestionRefs: [QE001, QE004]
