          modules: [Bumi, N2, E1, Xiaoyue, W1, Xiaonuo]
        - label: Applications and developer access
          modules: [Education, Home interaction, Research, Reception, SDK, Documentation]
        - label: Embodied intelligence
          modules: [Embodied operating system, Learning algorithms, Task planning]
        - label: Perception and control
          modules: [Depth vision, Sensor fusion, Motion control]
        - label: Mechatronics and power
          modules: [Joint motors, BLDC actuation, Battery system, Structural hardware]
        - label: Industrialization and support
          modules: [Supplier qualification, Planned ERP/MES, After-sales service, Overseas localization]
    approximationNotes: >-
      Conceptual stack reconstructed from public descriptions; it does not assert
      undisclosed interfaces, ownership boundaries, or production readiness.
    claimRefs: [CE001, CE007, CE010, CE012, CE015]
callouts:
  - calloutType: insight
    title: Low entry price broadens access but does not prove product-market maturity
    body: >-
      Bumi's reported sub-RMB 10,000 price and open programming interface lower the
      experimentation barrier, while public evidence still lacks standardized field
      reliability, repeat-use, and support-cost data.
    claimRefs: [CE003, CE004, CE013]
  - calloutType: risk
    title: Safety assertions are not yet diligence-grade
    body: >-
      A partner listing mentions collision avoidance, emergency stops, and global
      standards, but no named certification or test report appears in the assigned
      source set.
    claimRefs: [CE009, CE016]
