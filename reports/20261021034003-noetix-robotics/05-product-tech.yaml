      - [N2, "Research, education, exhibition, and developer use", "Commercially listed; company overall remains pilot delivery", "Athletic locomotion, 18 DoF, depth cameras, and edge compute", "Repeatable task benchmarks, field failure rate, and supported API versions"]
      - [E1, "Organizations seeking a larger embodied-intelligence platform", "Officially listed; SKU-level shipment status not disclosed", "Larger platform and embodied-intelligence positioning", "Specifications, payload, runtime, deployment count, and production status"]
      - [Xiaoyue, "Consumer companion interaction", "Officially listed; maturity not disclosed", "Presented as a companion product", "Technical specification, price, release status, and measurable use case"]
      - [W1, "Reception and guided-tour workflows", "Officially listed; maturity not disclosed", "Presented as a guidance specialist", "Autonomy boundary, navigation stack, customer deployment, and safety case"]
      - [Xiaonuo, "Bionic companion interaction", "Officially listed; maturity not disclosed", "Presented as an empathetic companion", "Model behavior, privacy controls, hardware specification, and release status"]
    notes: >-
      Product names and labels come from the current official homepage; Bumi and N2
      details use independent secondary reports. Null-equivalent maturity fields mean
      the assigned public evidence did not disclose SKU-level status.
    claimRefs: [CE001, CE002, CE003, CE004, CE006]
  - id: TE002
    title: Workflow and use-case evidence
    columns:
      - User job
      - Current workflow
      - Noetix solution
      - Measurable public benefit
      - Limitation
    rows:
      - ["Learn and program humanoid behavior", "Classroom or hobbyist robotics exercises", "Bumi with an open programming interface", "Entry price reported below RMB 10,000", "No learning-outcome, retention, or active-developer metric"]
      - ["Develop locomotion and embodied applications", "Research teams integrate sensors, compute, and motion APIs", "N2/E1 plus SDK and documentation links", "N2 specifications indicate onboard sensing and edge compute", "No public API stability, package-download, or repository-activity data"]
      - ["Demonstrate dynamic bipedal motion", "Exhibitions and demonstrations emphasize movement", "N2 athletic locomotion platform", "Reported 3.5 m/s top speed and continuous-backflip demonstrations", "No standardized independent reliability or task-success benchmark"]
      - ["Guide visitors or provide reception", "Human-facing navigation and interaction", "W1 guidance product and RBTX-listed N2 service uses", null, "No named production deployment, safety case, or outcome data"]
      - ["Provide home or companion interaction", "Consumer-facing voice, motion, and bionic interaction", "Bumi, Xiaoyue, and Xiaonuo", "Bumi's low reported entry price reduces acquisition barrier", "Privacy, daily use, support burden, and long-term engagement are undisclosed"]
    notes: >-
      Benefits are limited to explicitly reported price or product specifications;
      null means no measurable outcome appeared in the assigned prefetched evidence.
    claimRefs: [CE004, CE005, CE006, CE008, CE009, CE013]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or process
      - Publicly described role
      - Dependency
      - Underwriting risk
    rows:
      - ["Applications and embodied OS", "Coordinates autonomy and human-robot interaction", "Software interfaces, models, and application logic", "No disclosed model architecture, training-data governance, or support policy"]
      - ["Perception and sensor fusion", "Supports environmental awareness and interaction", "Depth cameras, inertial sensing, multimodal sensors, and compute", "No benchmark for detection accuracy, latency, or degraded conditions"]
      - ["Motion planning and control", "Generates bipedal locomotion and task execution", "Learning algorithms, motor control, and joint feedback", "Demonstrations are not duty-cycle or repeatability evidence"]
      - ["Mechatronics and power", "Converts control commands into physical motion", "BLDC actuation, reducers, batteries, drivers, and thermal protection", "Supplier concentration, cycle life, safety testing, and field failure rates are undisclosed"]
      - ["Industrialization and support", "Builds, configures, ships, and services product variants", "Planned ERP/MES, qualified suppliers, localization, and after-sales network", "The public record describes plans rather than audited yield or service-level performance"]
    notes: >-
      This architecture is reconstructed only from assigned company, marketplace, and
      secondary-source descriptions; undisclosed implementation details are treated as
      gaps, not inferred facts.
    claimRefs: [CE005, CE006, CE007, CE008, CE010, CE012, CE014]
