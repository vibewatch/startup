    title: Evidence-constrained sizing lenses
    columns:
      - Lens
      - Period / geography
      - Observed value
      - Methodology
      - Confidence
      - Limitation
    rows:
      - - Market-wide TAM / CAGR
        - Current review; geography unavailable
        - Not quantified
        - Review of all eight retained sources
        - Low
        - No market-value, CAGR, or installed-base denominator appears in the corpus
      - - Addressable application breadth
        - Current; geography unspecified
        - Education, research, entertainment, guided-tour, reception, and healthcare
        - Public use-case screen
        - Medium
        - Application labels are not revenue pools and may overlap
      - - Consumer entry price
        - 2025 launch context; China
        - CNY 9,998 / about US$1,400 for Bumi
        - Product-level price point
        - Medium
        - Regional price, tax, shipping, warranty, and current availability vary or are undisclosed
      - - Launch sales
        - First 48 hours; JD.com
        - 500 Bumi units
        - Company-reported launch sales repeated by specialist sources
        - Medium
        - One launch window is not annual sell-through or recurring demand
      - - N2 demand
        - Early 2026; geography unspecified
        - More than 2,500 pre-orders
        - Registry compilation of an announced order book
        - Low
        - Conversion, cancellation, delivery, and revenue recognition are unavailable
      - - Large-order signal
        - Period and geography unspecified
        - 1,000 Bumi units ordered by Huicheng
        - Specialist database profile
        - Low
        - Contract terms, delivery, acceptance, and payment are not disclosed
      - - Education-channel reach
        - Period unspecified; China implied
        - Coding Cat coverage of more than 70,000 schools
        - Partner-footprint proxy
        - Low
        - Reach is not Noetix deployment, paid adoption, or active utilization
      - - Overseas delivery ambition
        - By Q2 2026; North America, Europe, Middle East, Southeast Asia, Japan and South Korea
        - Planned first batch of 1,000 units
        - Company plan reported by Gasgoo
        - Low
        - The deadline predates this review, but actual completion is not evidenced
    notes: >-
      Values retain their original units and denominators. Prices, sales, pre-orders,
      customer orders, partner reach, and planned deliveries are not additive and are not
      transformed into TAM, SAM, SOM, revenue, or annual run-rate.
    claimRefs: [CM003, CM005, CM009, CM010, CM011, CM012, CM013, CM014]
  - id: TM003
    title: Segment, buyer, user, and adoption map
    columns:
      - Segment
      - Buyer
      - User
      - Payer / budget owner
      - Workflow
      - Adoption trigger and diligence test
    rows:
      - - Household consumer
        - Parent, enthusiast, or family
        - Child or household member
        - Household discretionary budget
        - Entertainment, companionship, and informal learning
        - Local price plus verified battery, warranty, returns, and support
      - - K12 education
        - School, programming platform, or parent
        - Student and instructor
        - Procurement, curriculum, or household budget; allocation unverified
        - Programming education and embodied-AI demonstration
        - Curriculum fit, teacher support, safety, utilization, and measurable outcomes
      - - Research institution
        - Laboratory lead or faculty
        - Researcher, developer, or student
        - Laboratory equipment or research budget
        - Motion-control, perception, and embodied-AI development
        - SDK depth, reproducibility, uptime, and technical support
      - - Reception and guided-tour
        - Venue or service operator
        - Staff and visitor
        - Customer-experience or operations budget
        - Greeting, navigation, presentation, and interaction
        - Workflow integration, reliability, safety, and labor-value evidence
      - - Healthcare and community
        - Provider, community center, or operator
        - Staff, resident, or patient
        - Provider capital or innovation budget
        - Interaction, demonstration, and assistance concepts
        - Safety, regulatory scope, efficacy, accessibility, and supervised-use evidence
      - - Industrial collaboration
        - Manufacturer or automation integrator
        - Operator and engineering team
        - Automation or operations budget
        - Collaborative task execution
        - Task-level ROI, payload, cycle time, uptime, and integration cost
    notes: >-
      Use cases come from retained sources; payer, budget-owner, and adoption-trigger
      fields are analytical hypotheses because no procurement records or customer ROI studies
      were available in the assigned evidence.
    claimRefs: [CM002, CM003, CM004, CM007, CM008, CM012, CM013]
figures:
  - id: FM001
    title: Addressability ladder from category to realized demand
    type: pyramid
    summary: >-
      Public evidence narrows from unquantified category breadth to product-level demand
      signals, but it does not support an additive TAM/SAM/SOM calculation.
    data:
      items:
        - label: Global humanoid category
          value: Not quantified
          detail: No retained source provides a market value, CAGR, or installed base.
        - label: Consumer and education humanoids
          value: Not quantified
          detail: Bumi defines the entry wedge, but segment spend is unavailable.
        - label: Publicly described applications
          value: 6 named use cases
          detail: Education, research, entertainment, guided-tour, reception, and healthcare.
        - label: Potential education-channel reach
          value: 70,000+ schools
          detail: Coding Cat partner coverage, not verified Noetix deployments.
        - label: Announced large order
          value: 1,000 Bumi units
          detail: Order terms, delivery, acceptance, and payment are not public.
        - label: Launch sales signal
          value: 500 units in 48 hours
          detail: Company-reported JD.com launch sales, not an annual run-rate.
    approximationNotes: >-
      The pyramid is an evidence-narrowing sequence, not a value-proportional chart.
      Category scope, use-case count, partner reach, order units, and launch sales have
      different denominators and must not be summed or interpreted as conversion stages.
    claimRefs: [CM002, CM003, CM005, CM009, CM011, CM012, CM014, CM016]
callouts:
  - calloutType: risk
    title: Orders are not a recurring-demand denominator
    body: >-
      Launch sales, pre-orders, a single large order, and planned deliveries do not reveal
      cancellations, returns, acceptance, active use, repeat purchases, or recognized revenue.
    claimRefs: [CM009, CM010, CM011, CM013, CM016]
  - calloutType: insight
    title: Price is an adoption wedge, not a TAM
    body: >-
      Affordable hardware may expand trial demand, but valuation should wait for evidence
      that low price survives support costs and converts into repeatable segment economics.
    claimRefs: [CM005, CM006, CM007, CM008, CM014, CM015]
