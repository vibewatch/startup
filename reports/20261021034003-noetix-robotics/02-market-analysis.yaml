  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing-gap
      missingEvidence: >-
        Credible market values, CAGR, installed base, annual segment shipments, and
        geography-specific adoption denominators for consumer and education humanoids.
      whyItMatters: >-
        Without common units and denominators, product-level signals cannot support a
        defensible TAM, SAM, SOM, penetration rate, or valuation multiple.
      diligencePath: >-
        Commission a bottom-up market model using audited channel sell-through,
        distributor inventory, segment ASPs, replacement cycles, and public procurement data.
      relatedQuestionRefs: [QM002]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: buyer-segments
      missingEvidence: >-
        Customer-level procurement paths, named budget owners, sales-cycle length,
        utilization, renewal behavior, and measured ROI by segment.
      whyItMatters: >-
        Public use-case labels do not show who controls budget or whether pilots convert
        into repeatable paid deployments.
      diligencePath: >-
        Review CRM cohorts and contracts, then interview at least two buyers in each
        priority segment about budget source, approval path, deployment, and outcomes.
      relatedQuestionRefs: [QM004, QM010]
      relatedTableRefs: [TM003]
    - type: missing-source
      severity: material
      topic: substitutes
      missingEvidence: >-
        Comparable cost, outcome, switching-friction, and buyer-preference evidence for
        manual workflows, fixed automation, educational kits, and other non-humanoid options.
      whyItMatters: >-
        Addressable spend is overstated if buyers can solve the job more cheaply without
        a humanoid form factor.
      diligencePath: >-
        Build a workflow-level alternative-cost benchmark and validate it through buyer
        interviews and lost-deal analysis.
      relatedQuestionRefs: [QM009]
      relatedTableRefs: [TM001]
    - type: conflicting-data
      severity: material
      topic: demand-quality
      missingEvidence: >-
        Audited orders, cancellations, deliveries, returns, active use, support cost,
