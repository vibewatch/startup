companyProfile:
  summary: >-
    Thought Machine is a London-based private fintech infrastructure company that sells Vault Core, a cloud-native core
    banking engine, and Vault Payments, a related payments-processing product. The platform targets banks migrating from
    legacy mainframes to programmable, cloud-hosted ledger infrastructure, with most commercial traction concentrated in
    tier-1 and other large regulated institutions.
