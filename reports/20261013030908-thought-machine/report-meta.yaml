  topStrengths:
    - Real enterprise demand is visible in tier-1 customer wins and continued ARR growth.
    - Vault Core remains differentiated as a cloud-native, programmable banking engine.
    - The company has monetized across both core banking and payments processing.
  topRisks:
    - Gross margin, runway, and cash burn remain undisclosed, limiting underwriting confidence.
    - Long migration cycles delay revenue realization and can create execution risk.
    - The valuation benchmark is stale relative to the current operating scale.
  unresolvedGaps:
    - 2025/2026 cash balance, burn, runway, and debt obligations remain undisclosed publicly.
