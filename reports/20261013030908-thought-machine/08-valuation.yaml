callouts:
  - calloutType: recommendation
    title: 'Diligence Stance: Maintain Research-More Rating Pending Term Sheet Transparency'
    body: >-
      Thought Machine demonstrates undeniable technical merit and tier-1 customer validation with its Deutsche Bank win
      and $100M+ ARR milestone. However, the $2.7 billion valuation benchmark from 2022 represents an aggressive ~27x
      ARR multiple in a normalized capital environment. Given ongoing accounting losses (£42M in 2025) and undisclosed
      liquidation terms from recent 2025 and 2026 financing rounds, investors should require balance sheet visibility
      and a substantial valuation discount before committing capital.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV006
      - CV007
  - calloutType: risk
    title: 'Capital Structure Overhang: Opaque Seniority in Convertible Debt Transactions'
    body: >-
      The May 2026 financing transaction comprised £9 million in primary convertible loan notes alongside £21 million in
      secondary share option sales to an unnamed tier-1 bank client. Combined with the £51 million Series E raised in
      July 2025 at undisclosed valuation terms, late-stage investors face a potentially complex liquidation preference
      overhang that could impair common and junior preferred returns in an exit prior to 2028.
    claimRefs:
      - CV004
      - CV005
      - CV009
      - CV011
