  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Investment Pillar
      - Thesis Argument
      - Anti-Thesis Counterargument
      - Diligence / Falsification Trigger
    rows:
      - - Commercial Traction
        - Thought Machine has signed 20 tier-1 banks globally including a 10-year Deutsche Bank contract.
        - >-
          Announced contracts feature multi-year implementation lags where revenue trails headlines until migrations go
          live in 2027.
        - Monitor 2027 Deutsche Bank live account conversion rates and milestone billing schedules.
      - - Software Monetization
        - Vault Core operates on a usage-based SaaS model where fees scale as banks migrate accounts to the cloud.
        - >-
          Core banking migrations are operationally risky and banks may stall rollouts or keep legacy mainframes running
          in parallel.
        - Verify contract minimum annual commitment clauses and historical account migration completion rates.
      - - Financial Trajectory
        - Revenue surged 57% in 2025 to £74.8M with positive free cash flow reported in H2 2025.
        - >-
          The company posted an annual operating loss of £42M in 2025 following flat top-line performance across 2023
          and 2024.
        - Review audited 2026 balance sheet to verify sustained operating profitability and net cash burn.
      - - Strategic Alignment
        - Global banks like Lloyds, JPMorgan, and Standard Chartered provide defensive captive adoption as shareholders.
        - >-
          Customer-shareholder overlap creates governance conflicts, non-standard commercial pricing, and valuation
          opacity.
        - Examine arm's-length third-party pricing terms for customers without equity ownership in Thought Machine.
    notes: >-
      Comparative thesis and anti-thesis drivers evaluating operational scalability against enterprise implementation
      frictions.
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core Operating Assumptions
      - Implied Valuation / Multiple
      - Downside Triggers / Key Risks
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          ARR expands to $180M+ by 2028; Deutsche Bank and tier-1 migrations complete on schedule; 75%+ software gross
          margin.
        - $2.5B–$3.0B valuation (14–16x forward ARR multiple).
        - Migration execution slip; public software multiples contract below 10x.
        - 20% (requires flawless execution of complex core migrations across tier-1 clients).
      - - Base Case
        - >-
          ARR grows at 25–30% CAGR to $140M by 2028; services mix remains elevated at 30%+; break-even achieved by late
          2027.
        - $1.2B–$1.5B valuation (8–10x forward ARR multiple).
        - Prolonged parallel legacy running costs and pricing renegotiations from banking consortiums.
        - 55% (consistent with historical sales cycles and enterprise IT replacement inertia).
      - - Bear Case
        - >-
          ARR growth slows to 10–15%; migrations stall; tier-1 banks delay rollout; persistent operating losses require
          dilutive capital.
        - $600M–$800M valuation (4–5x forward ARR multiple).
        - Implementation failures, platform outages, or customer churn among flagship accounts.
        - 20% (reflects structural downside if core replacement projects encounter operational roadblocks).
      - - Downside Restructuring
        - >-
          Cash runway exhausts prior to sustained profitability; convertible notes enforce punitive ratchet terms;
          down-round recapitalization.
        - $350M–$500M liquidation/recapitalization mark.
        - Senior liquidation preferences wipe out junior equity and common option holders.
        - 5% (mitigated by strong tier-1 banking shareholder support and recent debt injections).
    notes: Scenario analysis assuming $100M+ ARR baseline in 2026 and modeled through projected 2028 exit window.
    claimRefs:
