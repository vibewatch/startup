    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Evidence Basis
      - Decision Implication
    rows:
      - - Recommendation
        - Research-more
        - ARR > $100M in Q2 2026 alongside £42M 2025 operating loss
        - Withhold immediate investment until cash runway and gross margin quality are verified under NDA.
      - - Valuation Stance
        - Stretched
        - Stale 2022 Series D benchmark of $2.7B represents ~27x ARR multiple
        - Requires a 40–50% valuation discount or explicit evidence of 50%+ software gross margin before entry.
      - - Risk Rating
        - High
        - Multi-year tier-1 migration execution risk and delayed IPO horizon to 2028
        - Structure investment with downside liquidation protections and minimum governance rights.
      - - Target Horizon / Action
        - Diligence Track
        - Deutsche Bank migrations starting 2027 provide observable operational milestones
        - Track 2026/2027 live account migration progress and monitor audited cash burn trajectory.
    notes: >-
      Synthesis of core recommendation dimensions based on Q2 2026 ARR milestone, 2025 filed accounts, and historical
      2022 Series D benchmark.
    claimRefs:
