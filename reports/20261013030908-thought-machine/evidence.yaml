evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: Leadership and founder table coverage
    missingEvidence: >-
      Full organizational executive directory including VP Engineering, Chief Product Officer, and Chief Financial
      Officer biographies and employment contracts.
    whyItMatters: Validates depth of technical succession planning and executive retention beyond founder Paul Taylor.
    diligencePath: Request management presentation with senior executive bios and organizational reporting chart in data room.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: Stakeholder or investor map coverage
    missingEvidence: >-
      Fully diluted cap table, shareholder agreement, voting rights distribution, and liquidation preference schedule
      across seed through 2026 rounds.
    whyItMatters: >-
      Determines investor governance control, conversion thresholds, and junior common equity subordination under the
      2022 Series D preference stack.
    diligencePath: >-
      Obtain corporate capitalization table and Articles of Association from UK Companies House filings and management
      diligence package.
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: Funding valuation terms and cash burn opacity
    missingEvidence: >-
      Official valuation benchmark, burn rate, cash runway, and reconciliation of the July 2025 financing (£44.8M vs
      £51M) and May 2026 convertible loan notes.
    whyItMatters: >-
      Prevents independent verification of enterprise valuation and capital efficiency following the stale May 2022
      $2.7B Series D figure.
    diligencePath: >-
      Review audited financial statements for FY2025 and interim Q2 2026 management accounts to confirm cash balances
      and convertible debt covenants.
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: material
    topic: bank-budget-allocation
    missingEvidence: >-
      Disaggregated core banking software license spend for Vault Core within Deutsche Bank's overall 600 million euro
      IT and operations modernization budget.
    whyItMatters: >-
      Without itemized software license fees separated from systems integration and internal migration costs, software
      vendor revenue capture per Tier 1 bank cannot be calculated directly.
    diligencePath: Review enterprise software contract fee schedules or procurement disclosures from Deutsche Bank Private Bank.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Exact contractual per-account pricing tiers, implementation services fee splits, and discount schedules across
      Tier 1 versus regional bank deployments.
    whyItMatters: >-
      Without disclosed rate cards, evaluating realized software gross margin versus systems integration revenue remains
      impossible from public filings.
    diligencePath: >-
      Request customer procurement schedules, RFP scorecards, or anonymized client license agreements during
      confirmatory diligence.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: gross-margin-breakdown
    missingEvidence: Audited gross margin percentage and software versus professional services revenue breakdown.
    whyItMatters: >-
      Without segmented gross margins, investors cannot determine whether Thought Machine functions as high-margin pure
      software or labor-intensive systems integration.
    diligencePath: >-
      Request audited management accounts detailing hosting cost of goods sold, professional services utilization, and
      subscription gross margins.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-burn-and-runway
    missingEvidence: Current cash and cash equivalents balance, monthly net operating cash burn, and debt repayment schedule.
    whyItMatters: >-
      A £9 million primary injection via convertible notes in May 2026 indicates reliance on bridge financing; true
      runway depends on unverified net cash burn.
    diligencePath: Inspect latest treasury reports, bank account statements, and terms of convertible loan notes issued in May 2026.
    relatedQuestionRefs:
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: minor
    topic: pricing-schedule
    missingEvidence: Standard enterprise rate cards, per-account tiered pricing brackets, and minimum commitment floors.
    whyItMatters: >-
      Realized ACVs and pricing elasticity across tier 1 versus regional banks cannot be modeled without contractual fee
      schedules.
    diligencePath: Review representative enterprise customer order forms and master services agreements across top 5 accounts.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: throughput-benchmarking
    missingEvidence: >-
      Independent third-party performance benchmarks and stress-test data for Vault Core under sustained peak
      transactional load across complex legacy multi-product portfolios.
    whyItMatters: >-
      While Thought Machine claims high throughput via cloud elasticity and event streaming, the public record lacks
      independently audited latency and transaction-per-second metrics for tier-1 bank scale migrations.
    diligencePath: >-
      Request customer-specific performance benchmarking reports, cloud resource consumption telemetry, and migration
      load testing results under NDA during technical due diligence.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: customer-retention
    missingEvidence: Audited net revenue retention (NRR), gross revenue retention (GRR), and logo churn percentages by client cohort.
