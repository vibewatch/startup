      Without public disclosure of retention and expansion metrics, it is impossible to independently verify underlying
      software cohort health.
    diligencePath: >-
      Request audited customer cohort retention schedules, multi-year NRR history, and contract renewal rates under
      confidentiality.
    relatedQuestionRefs:
