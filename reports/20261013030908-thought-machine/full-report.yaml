  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Enterprise Buyer Segmentation & Architectural Fit
        blocks:
          - type: paragraph
            body: >
              Thought Machine segments its banking buyer base into three primary operational tiers: tier 1 multinational
              banking institutions executing core modernization, regional commercial and consumer banks seeking agility,
              and sponsor or BaaS banks powering modern fintech balance sheets. The platform's flagship universal
              product engine, Vault Core, alongside Vault Payments, enables financial institutions to replace monolithic
              mainframe core architectures with Python-configured smart contract products and cloud-native
              microservices. For global tier 1 banks such as JPMorgan Chase, Standard Chartered, and Intesa Sanpaolo,
              the primary economic buyer is the Chief Information Officer or Group Head of Technology seeking to retire
              multi-decade legacy technical debt and eliminate scheduled maintenance downtime. In the regional and
              specialized institution tier—exemplified by institutions like Mascoma, General Bank of Canada, and
              Pathward—the buying center focuses on accelerating new product delivery and enabling API-driven B2B2C or
              sponsor banking capabilities. However, these distinct buyer segments display vastly different procurement
              cycles, implementation burdens, and custom integration complexities across their existing ledger estates.
            claimRefs:
              - CU001
