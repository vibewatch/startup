      - number: '7.4'
        title: Financial Model and Liquidity Horizon
        blocks:
          - type: paragraph
            body: >-
              While Thought Machine surpassed $100 million in annual revenue for the financial year ending December 2025
              and crossed $100 million in annual recurring revenue as of the second quarter of 2026, the company
              operates with persistent financial opacity. Critical unit economics including software gross margins,
              customer acquisition costs, net revenue retention, and ongoing operational cash burn remain undisclosed
              publicly, preventing independent verification of software-tier profitability. Furthermore, corporate
              leadership has publicly postponed prospective London IPO expectations from previous post-Series D targets
              to 2028 at the earliest, citing challenging public equity market conditions. This deferred liquidity
              horizon, combined with a funding model backed heavily by customer-investors, exposes private shareholders
              to illiquidity risk and potential recapitalization dilution.
            claimRefs:
              - CR010
              - CR011
              - CR013
