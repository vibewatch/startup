  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core Operating Assumptions
      - Implied Valuation / Multiple
      - Downside Triggers / Key Risks
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          ARR expands to $180M+ by 2028; Deutsche Bank and tier-1 migrations complete on schedule; 75%+ software gross
          margin.
        - $2.5B–$3.0B valuation (14–16x forward ARR multiple).
        - Migration execution slip; public software multiples contract below 10x.
        - 20% (requires flawless execution of complex core migrations across tier-1 clients).
      - - Base Case
        - >-
          ARR grows at 25–30% CAGR to $140M by 2028; services mix remains elevated at 30%+; break-even achieved by late
          2027.
        - $1.2B–$1.5B valuation (8–10x forward ARR multiple).
        - Prolonged parallel legacy running costs and pricing renegotiations from banking consortiums.
        - 55% (consistent with historical sales cycles and enterprise IT replacement inertia).
      - - Bear Case
        - >-
          ARR growth slows to 10–15%; migrations stall; tier-1 banks delay rollout; persistent operating losses require
          dilutive capital.
        - $600M–$800M valuation (4–5x forward ARR multiple).
        - Implementation failures, platform outages, or customer churn among flagship accounts.
        - 20% (reflects structural downside if core replacement projects encounter operational roadblocks).
      - - Downside Restructuring
        - >-
          Cash runway exhausts prior to sustained profitability; convertible notes enforce punitive ratchet terms;
          down-round recapitalization.
        - $350M–$500M liquidation/recapitalization mark.
        - Senior liquidation preferences wipe out junior equity and common option holders.
        - 5% (mitigated by strong tier-1 banking shareholder support and recent debt injections).
    notes: Scenario analysis assuming $100M+ ARR baseline in 2026 and modeled through projected 2028 exit window.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV006
      - CV007
      - CV011
