  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Modular Footprint
        blocks:
          - type: paragraph
            body: >-
              Thought Machine delivers modern core banking infrastructure designed from the ground up for cloud
              environments. Rather than supplying a monolithic core banking suite that binds customer relationship
              management, risk analytics, and statutory reporting into a single codebase, Thought Machine restricts its
              primary engine, Vault Core, to the real-time double-entry ledger. Business logic for financial products is
              expressed externally as Python smart contracts managed through its Universal Product Engine, which can
              support current accounts, savings, credit cards, mortgages, and commercial lending on a single unified
              ledger engine. Alongside Vault Core, the company provides Vault Payments, a cloud-native issuer processing
              and payments engine developed to streamline transaction routing and integrated with payment networks
              including Mastercard. In North America, regulated institutions such as Pathward deploy Vault Core as
              foundational sponsor banking infrastructure to scale commercial lending and partner payments across
              fintech programs.
            claimRefs:
