        title: Named Customer Deployments & Production Status
        blocks:
          - type: paragraph
            body: >
              Verified customer deployments highlight Thought Machine's dual penetration of tier 1 global institutions
              and specialized regional financial players. In the United States, Pathward selected Vault Core in August
              2026 to modernize its sponsor banking infrastructure, providing real-time ledger capabilities across
              commercial lending, payments sponsorship, and fintech partner programs. In Canada, Schedule 1 chartered
              General Bank of Canada initiated a migration to Vault Core to support its transformation into a B2B2C
              financial product manufacturer. In the United Kingdom, anchor client Lloyds Banking Group deployed Vault
              Core and Vault Payments into live production, achieving a reported 40% reduction in system downtimes
              alongside a 30% increase in payment processing efficiency. Meanwhile, global tier 1 deployments such as
              JPMorgan Chase's retail core overhaul and Standard Chartered's digital banking operations showcase deep
              enterprise production validation. Despite these high-profile references, public visibility into customer
