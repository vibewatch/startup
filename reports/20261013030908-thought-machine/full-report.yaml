  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Core banking engines sit at the absolute operational center of regulated financial institutions,
              subjecting software infrastructure vendors to stringent regulatory scrutiny, data sovereignty mandates,
              and cloud governance frameworks across international jurisdictions. Operating as Thought Machine Group
              Limited in England and Wales while expanding across North America and Asia requires continuous adherence
              to jurisdiction-specific central bank supervisory guidelines, operational resilience directives, and
              financial data protection rules. As tier-1 banks replatform systemic deposit and lending ledgers onto
              Vault Core, financial authorities impose rigorous third-party vendor oversight, requiring comprehensive
              disaster recovery validation, deterministic auditability, and transparent business continuity guarantees
              that can complicate or prolong enterprise contract cycles.
            claimRefs:
              - CR003
              - CR004
              - CR012
          - type: table
