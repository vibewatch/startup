      - number: '8.2'
        title: Valuation Benchmark History and Capital Structure Overhang
        blocks:
          - type: paragraph
            body: >-
              Thought Machine's prevailing market valuation remains pinned to a historical benchmark established in May
              2022, when Temasek led a $160 million Series D round at a post-money valuation of $2.7 billion. Subsequent
              financing activity has deliberately bypassed public valuation resets, prioritizing balance sheet
              flexibility over price discovery. In July 2025, the company secured £51 million from existing shareholders
              in an unpriced Series E round to finance ongoing engineering expansion. This was followed on 27 May 2026
              by a £30 million transaction from an unnamed tier-1 bank client, split between £9 million in primary
              convertible loan notes and £21 million in secondary market share purchases for employee liquidity.
              Measuring the legacy $2.7 billion valuation against the current $100 million ARR threshold implies a 27x
              ARR multiple—demanding for an enterprise infrastructure vendor carrying ongoing operating losses.
              Moreover, the layering of convertible debt and internal insider rounds creates potential liquidation
              preference seniorities that could compress returns for new equity holders.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
