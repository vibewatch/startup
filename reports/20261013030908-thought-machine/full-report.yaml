  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Spend Taxonomy
        blocks:
          - type: paragraph
            body: >-
              The modern core banking infrastructure market is defined by back-end accounting, deposit management,
              lending engines, and product logic platforms that maintain the definitive customer ledger. Historically,
              incumbent financial institutions treated core banking as an inseparable component of massive, monolithic
              mainframe deployments that also encapsulated client-facing user interfaces, branch terminal systems, and
              batch clearing processes. The contemporary market boundary cleanly decouples this core operating engine
              from upstream digital experience layers, customer relationship management systems, and external payment
              schemes. Thought Machine's primary offering, Vault Core, focuses strictly on cloud-native ledger
              processing and configurable smart contract product definition. Spend in this category represents software
              subscription and licensing investments, distinctly separated from public cloud infrastructure hosting fees
              and external systems integration budgets. While adjacent categories such as payment issuer processing via
              Vault Payments expand total client contract value, pure-play core software addressability is governed by
              the enterprise requirement to replace brittle legacy ledgers with flexible cloud infrastructure.
            claimRefs:
              - CM004
              - CM013
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM004
              - CM013
              - CM014
      - number: '2.2'
        title: TAM, SAM, SOM, and Addressable Sizing Framework
        blocks:
          - type: paragraph
            body: >-
              Quantifying the market for core banking modernization requires examining institutional spending across
              multiple constraining filters rather than relying on top-line banking technology aggregates. Across the
              global financial services industry, total annual enterprise information technology expenditure exceeds
              three hundred billion dollars. However, software dedicated to core banking engines accounts for twelve
              billion to fifteen billion dollars of this total, with the substantial majority historically locked into
              maintenance contracts with legacy mainframe incumbents. The serviceable addressable market for modern
              cloud-native core software is currently estimated between four billion and six billion dollars, bounded by
              the multi-year planning horizons required for institutional replatforming across Tier 1, Tier 2, and
              specialized regional banks. For Thought Machine, the near-term serviceable obtainable market is anchored
              in active modernization programs, representing an immediate addressable opportunity of two hundred fifty
              million to five hundred million dollars across expansion in its twenty existing Tier 1 relationships and
              near-term competitive procurements.
            claimRefs:
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
          - type: figure
