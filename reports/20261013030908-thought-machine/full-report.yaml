      - number: '5.3'
        title: Deployment Workflows, Integrations, and Migration Patterns
        blocks:
          - type: paragraph
            body: >-
              Deploying Vault Core into enterprise financial institutions requires disciplined integration architecture
              and specialized systems engineering. Because Thought Machine provides an unbundled core engine rather than
              an all-in-one suite, financial institutions must integrate the ledger with surrounding channels, card
              processors, anti-money laundering engines, and regulatory compliance data stores via REST APIs and Kafka
              event topics. To bridge this integration requirement, Thought Machine has cultivated a certified partner
              ecosystem that includes global systems integration firms such as Vacuumlabs, Luxoft, and NTT DATA. These
              partners execute end-to-end technical designs, author product smart contracts, configure ledger account
              hierarchies, and manage complex migration programs from legacy core mainframes to cloud-native targets.
              Implementation workflows typically adopt incremental migration patterns, running Vault Core alongside
              legacy back-office systems before cutting over active product books.
            claimRefs:
              - CE004
              - CE007
              - CE008
              - CE010
              - CE013
