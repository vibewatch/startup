      - number: '7.2'
        title: Operational Architecture and Migration Execution
        blocks:
          - type: paragraph
            body: >-
              Replacing traditional mainframe core banking engines represents one of the highest-risk operational
              undertakings in the global financial services industry, where unforeseen downtime or transaction
              inconsistencies directly impair customer solvency and institutional solvency. Legacy core banking
              platforms have historically hardcoded product business logic into brittle relational database schemas,
              creating extreme friction during data migration and parallel run cutovers. Thought Machine mitigates
              single-point infrastructure failure by deploying Vault Core across three availability zones with automated
              failover and smart contract product isolation, supported by AWS Transform and Vault Forge AI pipelines
              that extract legacy logic into sandbox testbeds. Nevertheless, complex data reconciliation, bespoke legacy
              integrations, and conservative bank sign-off gates mean multi-year migration programmes remain vulnerable
              to unexpected delays and implementation cost overruns.
            claimRefs:
              - CR001
