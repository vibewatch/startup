              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: 'Scenario Analysis: Bull, Base, and Bear Return Profiles'
        blocks:
          - type: paragraph
            body: >-
              Underwriting equity participation in Thought Machine requires evaluating multi-year rollout mechanics
              against macro multiples. Enterprise core banking replacement entails complex integration timelines: under
              the announced Deutsche Bank schedule, actual product migrations do not commence until 2027, with legacy
              mainframes running in parallel throughout the transition. In our bull case scenario (20% probability),
              tier-1 migrations accelerate seamlessly, expanding usage-based live account volumes and lifting ARR toward
              $180 million by 2028 with 75%+ software gross margins, supporting an enterprise valuation between $2.5
              billion and $3.0 billion at 14–16x forward ARR. In our base case (55% probability), migration friction and
              substantial professional services overhead maintain ARR growth at 25–30% CAGR toward $140 million,
              resulting in valuation compression to $1.2 billion–$1.5 billion (8–10x ARR). In our bear case (20%
              probability), banking clients defer core transitions, slowing ARR expansion to 10–15% and precipitating a
              down-round valuation between $600 million and $800 million (4–5x ARR).
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV011
      - number: '8.4'
        title: Exit Readiness, Diligence Asks, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Liquidity expectations must be calibrated against realistic capital markets constraints. Chief Executive
              Paul Taylor has stated that an initial public offering in London is unlikely prior to 2028 at the
              earliest, citing challenging public market conditions and emphasizing commercial delivery over headline
              valuation marks. Furthermore, the shareholding structure introduces structural alignment dynamics:
              institutions including Lloyds Banking Group, JPMorgan Chase, and SEB operate simultaneously as major
              strategic equity backers and foundational software clients. While this captive relationship provides
              substantial barrier-to-entry protection, it complicates arm's-length price verification and contract
              renegotiation dynamics. Technically, Thought Machine retains defensibility via Vault's clean three-layer
              architecture and global ecosystem partnerships with networks like Mastercard. Prior to capital allocation,
              diligence must focus on three non-negotiable items: audited cash burn and runway verification, full
              capitalization table seniority terms, and segmented gross margin contributions between recurring software
              licensing and professional services.
            claimRefs:
              - CV007
              - CV009
              - CV011
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Diligence Stance: Maintain Research-More Rating Pending Term Sheet Transparency'
            body: >-
              Thought Machine demonstrates undeniable technical merit and tier-1 customer validation with its Deutsche
              Bank win and $100M+ ARR milestone. However, the $2.7 billion valuation benchmark from 2022 represents an
              aggressive ~27x ARR multiple in a normalized capital environment. Given ongoing accounting losses (£42M in
              2025) and undisclosed liquidation terms from recent 2025 and 2026 financing rounds, investors should
              require balance sheet visibility and a substantial valuation discount before committing capital.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
          - type: callout
            title: 'Capital Structure Overhang: Opaque Seniority in Convertible Debt Transactions'
            body: >-
              The May 2026 financing transaction comprised £9 million in primary convertible loan notes alongside £21
              million in secondary share option sales to an unnamed tier-1 bank client. Combined with the £51 million
              Series E raised in July 2025 at undisclosed valuation terms, late-stage investors face a potentially
              complex liquidation preference overhang that could impair common and junior preferred returns in an exit
              prior to 2028.
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
              - CV009
