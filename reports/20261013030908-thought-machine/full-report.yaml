  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Recommendation Framework
        blocks:
          - type: paragraph
            body: >-
              Thought Machine presents a distinct dichotomy between proven enterprise adoption and unverified late-stage
              valuation economics. Commercial traction reached a watershed milestone in Q2 2026 as annual recurring
              revenue crossed $100 million, propelled by multi-year tier-1 migrations and a 57% top-line revenue
              expansion to £74.8 million in 2025. The company has now assembled a contracted roster of 20 tier-1
              financial institutions worldwide, capped by Deutsche Bank's August 2026 commitment to replace 15 core
              banking systems with Vault Core across a ten-year horizon. However, financial diligence reveals persistent
              operating friction: Thought Machine generated an operating loss of £42 million in 2025, narrowing from
              £69.4 million in 2024 but highlighting that sustained accounting profitability remains unrealized. While
              management reported positive free cash flow in late 2025, the multi-year implementation cycle means cash
              realization substantially lags marquee customer announcements. Consequently, we assign a research-more
              recommendation with a stretched valuation stance and high risk rating, advising institutional investors to
              condition entry on private audit access.
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
