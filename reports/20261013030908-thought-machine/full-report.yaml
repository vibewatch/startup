  - id: FE001
    title: Vault Platform Layered Operating Architecture
    type: stack
    summary: >-
      Six-layer architectural stack of Thought Machine's Vault platform illustrating separation from external banking
      channels down to physical persistence.
    data:
      layers:
        - label: 'Layer 1: Channel & Integration Tier'
          detail: >-
            REST APIs, GraphQL endpoints, webhook dispatchers, and integration SDKs connecting web, mobile, partner
            systems, and sponsor banking platforms.
        - label: 'Layer 2: Event Streaming Fabric'
          detail: >-
            Apache Kafka event streaming infrastructure routing prioritized real-time transaction events, ledger
            updates, and audit feeds.
        - label: 'Layer 3: Product Logic & Smart Contracts'
          detail: >-
            Universal Product Engine executing deterministic Python smart contracts for deposits, lending, mortgages,
            and cards at specific transaction hooks.
        - label: 'Layer 4: Payment Processing Engine'
          detail: >-
            Vault Payments subsystem handling card issuing, scheme adapters (Mastercard), and real-time payment rail
            messaging.
        - label: 'Layer 5: Core Real-Time Ledger'
          detail: >-
            Immutable double-entry transactional ledger maintaining real-time balance calculations, posting rules, and
            timestamped transaction logs.
        - label: 'Layer 6: Cloud Infrastructure & Persistence'
          detail: >-
            Cloud-native containerized microservices running on Kubernetes across AWS, GCP, Azure, or private cloud with
            ACID relational storage.
    approximationNotes: Architectural layers reflect generalized deployment blueprints published by Vacuumlabs and NTT DATA.
    claimRefs:
