            body: >-
              After two years of stagnant top-line performance where revenue recorded £47.8 million in 2023 and £47.6
              million in 2024 according to filed accounts, Thought Machine experienced a sharp acceleration in fiscal
              year 2025. Total revenue rose 57% year over year to reach £74.8 million, crossing the $100 million
