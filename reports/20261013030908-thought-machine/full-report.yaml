      - number: '7.3'
        title: Partner and Platform Dependencies
        blocks:
          - type: paragraph
            body: >-
              Thought Machine's cloud-native operating model creates deep structural dependencies on third-party
              hyperscaler hosting providers and global payments network infrastructure. Vault platform instances rely
              predominantly on public cloud environments including Amazon Web Services to execute microservices
              workloads and run reverse-engineering AI agents, leaving the company exposed to potential cloud region
              outages, platform fee increases, and sovereign data residency limitations. Simultaneously, the commercial
              adoption of Vault Payments depends on an end-to-end integration partnership with Mastercard, utilizing
              Mastercard Cloud Edge for issuer processing and card transaction routing. Although partnerships with
              institutions like Pathward validate multi-segment adoption, any disruption across underlying cloud hosting
              agreements or card network alliances poses immediate operational and strategic counterparty risk.
            claimRefs:
