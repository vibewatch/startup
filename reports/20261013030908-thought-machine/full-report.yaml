      - number: '5.4'
        title: Technical Differentiation, Trust Controls, and Architectural Risks
        blocks:
          - type: paragraph
            body: >-
              Thought Machine’s primary technical moat rests on its smart contracts paradigm, which substitutes
              hardcoded database configurations with version-controlled, testable Python code executed at transaction
              hooks such as on-posting and on-acceptance. This architecture allows financial product managers to
              prototype and deploy new deposit or lending instruments in days rather than waiting for annual vendor
              release cycles. However, this architectural decoupling introduces distinct operational and technical
              risks. Fraud detection and anti-financial crime checks must operate outside the immediate transaction
              execution loop, requiring asynchronous evaluation or authorization-stage network coordination inspired by
              card networks. Furthermore, backdated transactions require careful grace-period boundaries to recalculate
              interest and balance curves without violating ledger immutability. Finally, while Thought Machine powers
              prominent production deployments across global institutions, independent third-party benchmarks verifying
              sustained transaction-per-second ceilings under complex multi-product concurrent loads remain undisclosed
              publicly.
            claimRefs:
              - CE002
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Smart Contracts as Code Redefines Banking Product Agility
            body: >-
              Defining financial products through Python smart contracts decouples product logic from core engine code,
              enabling financial institutions to build, simulate, and update financial products in days without vendor
              code releases or database schema alterations.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
          - type: callout
            title: Asynchronous Risk Decoupling Demands External Orchestration
            body: >-
              Because Vault Core strictly isolates the ledger from surrounding banking functions, fraud detection,
              general ledger accounting, and complex migrations require external event orchestration and certified
              integration partners, shifting architectural complexity to the integration layer.
            calloutType: risk
            claimRefs:
              - CE004
              - CE011
