  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Investment Pillar
      - Thesis Argument
      - Anti-Thesis Counterargument
      - Diligence / Falsification Trigger
    rows:
      - - Commercial Traction
        - Thought Machine has signed 20 tier-1 banks globally including a 10-year Deutsche Bank contract.
        - >-
          Announced contracts feature multi-year implementation lags where revenue trails headlines until migrations go
          live in 2027.
        - Monitor 2027 Deutsche Bank live account conversion rates and milestone billing schedules.
      - - Software Monetization
        - Vault Core operates on a usage-based SaaS model where fees scale as banks migrate accounts to the cloud.
        - >-
          Core banking migrations are operationally risky and banks may stall rollouts or keep legacy mainframes running
          in parallel.
        - Verify contract minimum annual commitment clauses and historical account migration completion rates.
      - - Financial Trajectory
        - Revenue surged 57% in 2025 to £74.8M with positive free cash flow reported in H2 2025.
        - >-
          The company posted an annual operating loss of £42M in 2025 following flat top-line performance across 2023
          and 2024.
        - Review audited 2026 balance sheet to verify sustained operating profitability and net cash burn.
      - - Strategic Alignment
        - Global banks like Lloyds, JPMorgan, and Standard Chartered provide defensive captive adoption as shareholders.
        - >-
          Customer-shareholder overlap creates governance conflicts, non-standard commercial pricing, and valuation
          opacity.
        - Examine arm's-length third-party pricing terms for customers without equity ownership in Thought Machine.
    notes: >-
      Comparative thesis and anti-thesis drivers evaluating operational scalability against enterprise implementation
      frictions.
