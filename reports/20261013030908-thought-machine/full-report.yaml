      - number: '4.3'
        title: Capital Adequacy, Cash Flow, and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              Thought Machine reported achieving positive free cash flow during the second half of fiscal year 2025,
              with management noting that operating expenses had remained broadly stable across a four-year window while
              revenue expanded. Nonetheless, the company's capital strategy reveals ongoing dependence on structured
              bridge capital. In May 2026, Thought Machine finalized a £30 million financing transaction backed by an
              unnamed tier 1 bank client. Of that total, only £9 million represented primary capital injected through
              convertible loan notes, while £21 million facilitated a secondary purchase of employee share options. The
              reliance on convertible debt rather than an equity round underscores cautious late-stage valuation
              dynamics; the company's last public equity benchmark was set at $2.7 billion in May 2022 during its Series
              D round led by Temasek. Management has deferred initial public offering timelines to 2028 at the earliest,
              prioritizing commercial milestones over public market valuation benchmarks.
            claimRefs:
              - CI005
              - CI006
              - CI007
      - number: '4.4'
        title: Unit Economics, Delivery Risks, and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              From an institutional underwriting perspective, Thought Machine demonstrates authentic product market fit
              and tier 1 validation, but its software quality economics cannot be confirmed without deeper private
              disclosure. Key unit economics metrics—including audited gross margin percentage, net revenue retention
              rates, professional services revenue share, and cash runway—remain undisclosed private data points.
              Industry observers and critics note that complex core banking migrations carry material execution risks;
              any high-profile cutover failure at a tier 1 institution could stall prospective enterprise pipelines for
              years. Furthermore, cloud hyperscaler migration toolkits like AWS Vault Forge risk commoditizing
              modernization workflows, threatening to compress margins into professional services delivery rather than
              pure software economics. While positive second-half 2025 free cash flow indicates improving operating
              leverage, rigorous diligence requires verifying hosting cost of goods sold and post-migration retention
              before underwriting private software multiples.
            claimRefs:
