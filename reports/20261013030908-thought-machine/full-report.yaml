      - number: '5.2'
        title: Cloud-Native Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Vault Core’s technical architecture follows an event-driven microservices paradigm that eliminates
              traditional batch-oriented banking windows. Every transactional state change generates timestamped events
              published across Apache Kafka streaming clusters, allowing downstream banking services to ingest account
              postings and balance transitions in milliseconds. Unlike legacy platforms that embed a general ledger
              directly into the core posting path, Vault Core separates general ledger functionality entirely, streaming
              real-time financial events to external general ledger accounting packages. This decoupling ensures that
              customer-facing transaction throughput remains unaffected by monthly accruals, amortization schedules, or
              complex reporting queries. The platform runs containerized microservices managed on Kubernetes and
              supports multi-cloud deployments across Amazon Web Services, Google Cloud Platform, Microsoft Azure, and
              private cloud environments, relying on cloud-native relational databases with strict serializability
              guarantees rather than mainframe emulation.
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE006
              - CE010
