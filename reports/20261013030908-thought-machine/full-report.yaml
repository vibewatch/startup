      - number: '6.2'
        title: Adoption Trajectory & Revenue Model Dynamics
        blocks:
          - type: paragraph
            body: >
              Commercial adoption of Thought Machine's platform has reached significant enterprise milestones, with the
              company reporting over $100 million in annual revenue for 2025 alongside surpassing the $100 million ARR
              threshold as of Q2 2026. This financial expansion reflects a 57% year-on-year revenue surge supported by
              multi-year core banking commitments across 68 signed client banks globally. The business model combines
              long-term baseline subscription agreements with variable usage-based fee structures tied directly to the
              number of live customer accounts and transaction volumes processed on Vault Core. Under this account-based
              monetization structure, client contracts typically commence with a pilot deployment of several hundred
              thousand accounts before scaling across millions of primary retail accounts. Crucially, a critical
              operational gap exists between contract execution and live revenue generation: major enterprise core
              migrations require multi-year transition phases where banks run legacy mainframes and Vault Core in
              parallel. This timing asymmetry means reported ARR and contractual milestones substantially lead cash
              collections and realized platform usage fees, leaving commercial growth sensitive to migration delays.
            claimRefs:
              - CU006
