      - number: '1.2'
        title: 创始人、管理层与治理架构
        blocks:
          - type: paragraph
            body: >-
              Thought Machine 的公司战略和架构原则，反映出创始人兼 CEO Paul Taylor 的专业背景。Taylor 拥有语音技术博士学位，曾创办 Rhetorical Systems（2004 年被
              Nuance Communications 收购）和 Phonetic Arts（2010 年被 Google 收购）。后来担任 Google
              工程负责人期间，他看到了超大规模云服务商的软件工程实践与全球金融机构陈旧技术栈之间的鲜明差距，这促成了他在 2014 年创办 Thought Machine。


              Taylor 对公司战略和架构仍拥有决定性话语权，既是公司的主要公开发言人，也是负责 Tier-1
              银行高管关系的核心人物。高级管理团队分布在伦敦和里斯本的工程中心，以及纽约、迈阿密、新加坡和澳大利亚的区域商业办公室。工程团队遵循严格的微服务设计标准，维护一个全球统一代码仓库，不为单个客户分叉代码。这套运营纪律降低了本地交付风险，同时让跨国客户部署能够共享全企业平台升级。
            claimRefs:
              - CO002
              - CO005
              - CO014
