  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 展示公司自 2014 年成立至 2026 年生产扩张的架构、融资和商业规模化关键里程碑。
    data:
      items:
        - label: 公司在伦敦成立
