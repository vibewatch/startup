      - number: '3.3'
        title: 护城河持久性、转换成本与被替代风险
        blocks:
          - type: paragraph
            body: >-
              核心银行平台位于银行技术基础设施中最关键、风险最敏感的层级。因此，企业一旦部署 Vault Core，转换成本就会很高，也会深度锁定供应商。Tier-1
              机构重构平台需要多年并行运行、监管审批和资产负债表账本验证，未来数十年被其他核心供应商替代的可能性很低。Thought Machine 还通过 Vault Payments 向支付处理相邻领域扩张，并借助与
              Mastercard 的端到端合作扩大客户终身价值，在卡和账户支付网络中进一步提高企业粘性。


              但这些结构性优势并不能消除竞争和运营替代风险。首要风险是智能合约配置语言带来的运营复杂度和人才稀缺性；银行 IT 团队普遍缺乏所需的专业工程能力。Temenos
              等传统供应商拥有庞大的全球合作伙伴网络和数千个开箱即用的本地监管模块，而 Thought Machine 需要客户或系统集成商手工配置这些内容。此外，随着 Thought Machine 向 Pathward
              等北美区域银行和 sponsor bank 扩张，它必须证明企业级平台不依赖全球 Tier-1 银行常见的巨额工程预算，也能高效部署。
            claimRefs:
              - CP006
              - CP011
              - CP012
              - CP013
              - CP014
