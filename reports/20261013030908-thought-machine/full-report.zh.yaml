      - number: '1.4'
        title: 商业里程碑、生产规模化与战略路线图
        blocks:
          - type: paragraph
            body: >-
              运营 12 年来，Thought Machine 已从早期挑战者银行试点走到 Tier-1 机构的企业级生产迁移。到 2026 年年中，公司技术已服务 30 多个国家的 68 家金融机构，其中包括全球最大银行中的
              18 家，覆盖国际市场 10% 以上。重要生产部署包括 Lloyds Banking Group、Intesa Sanpaolo、新加坡 Standard Chartered 的 Trust Bank，以及
              Deutsche Bank 的私人银行；后者根据多年期全球协议选择 Vault Core，将 15 个核心系统整合为 2 个。


              FY2025 的商业加速打破了持续两年的收入平台期（2023 年 £47.8 million、2024 年 £47.6 million），收入同比增长 57% 至 £74.8 million（超过 $100
              million）。此外，Thought Machine 报告称，截至 2026 年第二季度，年度经常性收入（ARR）已突破 $100 million，背后是 Tier-1 客户多年期迁移承诺。公司还与
              Mastercard 合作扩大 Vault Payments 的发卡处理业务，并与 Amazon Web Services 合作开发传统核心迁移的生成式工具。在美洲，Thought Machine 已扩展到 20
              家机构；其中 Pathward 于 2026 年 8 月选择 Vault Core，推动美国 sponsor banking 基础设施现代化。
