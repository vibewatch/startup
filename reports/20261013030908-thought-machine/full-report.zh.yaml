          - type: callout
            title: 核心迁移周期长，造成严重收入滞后
            body: >-
              Thought Machine 虽已成功与 18 至 20 家全球 Tier-1 机构签约，但核心银行迁移通常需要 2 至 4 年复杂集成，才能把完整账户量切换到 Vault
              Core。由于公司部分依靠按账户和平台用量收费，已披露合同胜利会形成多年收入滞后，使商业现金流容易受到银行实施延迟影响。
            calloutType: risk
            claimRefs:
              - CU007
              - CU010
              - CU016
          - type: callout
            title: 在全球 Tier-1 银行巨头中的渗透无出其右
            body: >-
              Thought Machine 在下一代核心银行供应商中处于领先位置，已在 JPMorgan Chase、Lloyds Banking Group、Standard Chartered 和 Intesa
              Sanpaolo 等全球机构落地旗舰部署。赢得 Tier-1 验证带来显著竞争护城河，也证明 Vault Core 可以作为关键任务核心替换的企业平台。
            calloutType: strength
            claimRefs:
              - CU003
              - CU008
              - CU011
              - CU014
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              核心银行引擎位于受监管金融机构的运营中心，因此软件基础设施供应商必须面对各司法辖区严格的监管审查、数据主权要求和云治理框架。Thought Machine Group Limited
              在英格兰和威尔士运营，同时向北美和亚洲扩张，必须持续遵守各司法辖区央行监管指引、运营韧性指令和金融数据保护规则。随着 Tier-1 银行把系统性存款和贷款账本迁移到 Vault
              Core，金融监管机构会加强第三方供应商监管，要求全面验证灾难恢复、实现确定性审计，并提供透明的业务连续性保障，这些要求可能让企业合同周期更复杂、更漫长。
            claimRefs:
              - CR003
              - CR004
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR004
              - CR012
      - number: '7.2'
        title: 运营架构与迁移执行
        blocks:
          - type: paragraph
            body: >-
              替换传统主机核心银行引擎，是全球金融服务业风险最高的运营工作之一；意外停机或交易不一致会直接损害客户偿付能力和机构偿付能力。传统核心银行平台长期把产品业务逻辑硬编码在脆弱的关系数据库模式中，导致数据迁移和并行运行切换极其困难。Thought
              Machine 在三个可用区部署 Vault Core，启用自动故障转移并隔离智能合约产品，降低基础设施单点故障风险；同时借助 AWS Transform 和 Vault Forge AI
              流程，把传统逻辑提取到沙盒测试环境。不过，复杂的数据核对、定制传统集成和谨慎的银行签字门槛，仍让多年期迁移项目容易出现意外延误和实施成本超支。
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR008
              - CR011
              - CR013
      - number: '7.3'
        title: 伙伴与平台依赖
        blocks:
          - type: paragraph
            body: >-
              Thought Machine 的云原生运营模式，深度依赖第三方云超大规模托管商和全球支付网络基础设施。Vault 平台实例主要依靠包括 Amazon Web Services
              在内的公有云环境运行微服务工作负载和逆向工程 AI 代理，因此公司面临云区域中断、平台费用上涨和主权数据驻留限制等风险。同时，Vault Payments 的商业采用依赖与 Mastercard
              的端到端集成合作，使用 Mastercard Cloud Edge 进行发卡处理和卡交易路由。Pathward
              等机构的合作虽验证了多细分市场采用，但底层云托管协议或卡网络联盟出现任何中断，都会带来即时的运营和战略交易对手风险。
            claimRefs:
              - CR005
              - CR006
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR014
      - number: '7.4'
        title: 财务模型与流动性期限
        blocks:
          - type: paragraph
            body: >-
              Thought Machine 在截至 2025 年 12 月的财年收入超过 $100 million，并于 2026 年第二季度突破 $100 million
              ARR，但公司持续缺乏财务透明度。毛利率、客户获取成本、净收入留存和持续运营现金消耗等关键单位经济指标均未公开披露，无法独立验证软件业务的盈利能力。此外，管理层已公开把原先 Series D 后的伦敦 IPO
              预期推迟到最早 2028 年，理由是公开股权市场环境充满挑战。流动性期限推迟，加上高度依赖客户投资者的融资模式，使私有股东面临流动性风险和潜在的再资本化稀释。
            claimRefs:
              - CR010
              - CR011
              - CR013
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 公开市场流动性推迟与透明度不足
            body: >-
              Thought Machine 有意把潜在的伦敦 IPO 推迟到 2028 年，凸显其在艰难金融科技环境中的估值脆弱性。ARR 已超过 $100
              million，但运营利润率和现金跑道仍未披露，投资者面临长期流动性风险，且未经验证的软件单位经济进一步放大了这一风险。
            calloutType: risk
            claimRefs:
              - CR010
              - CR011
              - CR013
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与建议框架
        blocks:
          - type: paragraph
            body: >-
              Thought Machine 在已验证的企业采用与未经验证的后期估值经济性之间呈现鲜明分化。2026 年第二季度，ARR 突破 $100 million，商业势头 达到关键里程碑；这一增长由多年期 Tier-1
              迁移推动，2025 年收入同比增长 57% 至 £74.8 million。公司如今已在全球签约 20 家 Tier-1 金融机构，Deutsche Bank 于 2026 年 8 月承诺在十年周期内用
              Vault Core 替换 15 个核心银行系统，进一步巩固了这一客户阵容。然而，财务尽调显示运营摩擦仍在：Thought Machine 2025 年运营亏损 £42 million，虽较 2024 年的
              £69.4 million 收窄，但持续会计盈利尚未实现。管理层虽报告 2025
              年末自由现金流转正，多年实施周期仍意味着现金兑现大幅落后于知名客户公告。因此，我们给出“继续研究”建议，认为估值偏高、风险评级高，并建议机构投资者把进入条件设为可查阅私下审计资料。
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
              - CV011
      - number: '8.2'
        title: 估值基准历史与资本结构悬置
        blocks:
          - type: paragraph
            body: >-
              Thought Machine 当前的市场估值仍锚定在 2022 年 5 月确立的历史基准上：Temasek 领投 Series D 轮，投后估值为 $2.7 billion，融资额为 $160
              million。此后的融资刻意绕开公开估值重置，优先保留资产负债表灵活性，而非发现价格。2025 年 7 月，公司从现有股东处获得 £51 million，完成一轮未定价的 Series E
              融资，用于持续扩大工程团队。随后在 2026 年 5 月 27 日，一家未具名的 Tier-1 银行客户完成 £30 million 交易，其中 £9 million 为新增可转换贷款票据，£21 million
              用于二级市场购股，为员工提供流动性。将历史 $2.7 billion 估值与当前 $100 million ARR 门槛对照，意味着 ARR 倍数为
              27x；对于一家持续经营亏损的企业基础设施厂商，这一倍数偏高。此外，可转换债务与内部人士轮次叠加，可能形成更高顺位的清算优先权，压缩新股东的回报。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: 情景分析：乐观、基准与悲观回报画像
        blocks:
          - type: paragraph
            body: >-
              评估 Thought Machine 的股权参与机会，必须把多年期落地机制与宏观估值倍数放在一起看。企业核心银行系统替换涉及复杂的集成周期：按照已宣布的 Deutsche Bank 计划，实际产品迁移要到
              2027 年才开始，过渡期间旧主机仍将并行运行。              在乐观情景下（概率 20%），Tier-1 银行迁移顺利提速，按用量计费的活跃账户数增加，ARR 到 2028 年升至约 $180
              million，软件毛利率超过 75%，并以未来 ARR 的 14–16x 支撑 $2.5 billion 至 $3.0 billion 的企业估值。在基准情景下（概率 55%），迁移摩擦和高额专业服务开支使
              ARR 以 25–30% CAGR 增长至约 $140 million，估值压缩至 $1.2 billion–$1.5 billion（8–10x ARR）。在悲观情景下（概率
              20%），银行客户推迟核心系统迁移，ARR 增速降至 10–15%，并导致下轮融资估值降至 $600 million–$800 million（4–5x ARR）。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV011
      - number: '8.4'
        title: 退出准备度、尽调要求与打破论点的触发条件
        blocks:
          - type: paragraph
            body: >-
              流动性预期必须以现实的资本市场约束为准。首席执行官 Paul Taylor 表示，伦敦 IPO 最早也不太可能早于 2028
              年，理由是公开市场环境艰难，公司将商业交付置于醒目的估值标记之上。此外，股权结构带来结构性的利益协调问题：Lloyds Banking Group、JPMorgan Chase 和 SEB
              等机构同时是主要战略股权支持者和基础软件客户。这种绑定关系虽然构成了较高的进入壁垒，却让公平交易价格验证和合同重谈更加复杂。从技术上看，Thought Machine 依靠 Vault 简洁的三层架构，以及与
              Mastercard 等网络的全球生态合作，仍具备防御力。在配置资本前，尽调必须聚焦三项不可妥协的内容：经审计的现金消耗与现金跑道核验、完整股权结构表中的顺位条款，以及经常性软件许可与专业服务之间分拆的毛利贡献。
            claimRefs:
              - CV007
              - CV009
              - CV011
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 尽调立场：在条款清单透明度提高前维持“继续研究”评级
            body: >-
              Thought Machine 凭借赢得 Deutsche Bank 客户以及达到 $100M+ ARR 里程碑，展现出无可否认的技术实力和 Tier-1 客户验证。不过，在资本环境正常化的情况下，2022 年
              $2.7 billion 的估值基准对应约 27x ARR，仍然激进。考虑到公司持续亏损（2025 年亏损 £42M），以及近期 2025 年和 2026
              年融资轮次的清算条款未披露，投资者在投入资本前应要求更清晰的资产负债表信息，并争取大幅估值折扣。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
          - type: callout
            title: 资本结构悬置：可转换债务交易中的顺位不透明
            body: >-
              2026 年 5 月的融资交易包括 £9 million 新增可转换贷款票据，以及向一家未具名 Tier-1 银行客户出售 £21 million 的二级股份期权。再加上 2025 年 7
              月按未披露估值条款筹得的 £51 million Series E，后期投资者可能面临复杂的清算优先权悬置；若在 2028 年之前退出，这种结构可能损害普通股和次级优先股的回报。
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
              - CV009
              - CV011
