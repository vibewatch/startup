  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 核心银行格局与竞争对手画像
        blocks:
          - type: paragraph
            body: >-
              核心银行基础设施市场分为根深蒂固的传统供应商和现代云原生架构两派。Temenos、Finastra
              等成熟厂商凭借完整的区域合规套件和深厚的系统集成生态，掌握全球绝大多数运营中的银行核心。但             
              这些植根主机的平台主管着单体代码库和脆弱的批处理流程，维护负担重，产品发布节奏慢。作为回应，Thought Machine、Mambu、10x Banking 和 Starling's Engine
              等现代核心竞争者，构建了面向公有云实时交易处理的微服务平台。


              在云原生阵营中，Thought Machine 高度聚焦 Tier-1 机构账户，这与最初在数字挑战者银行和金融科技贷款机构中扩张的同行形成差异。Mambu 凭借灵活的 SaaS
              核心部署，较早在中型机构取得商业进展；10x Banking 则瞄准模块化核心现代化；而 Thought Machine 已在 68 家全球签约客户中拿下全球最大银行的 18 家。JPMorgan
              Chase、Standard Chartered 和 Lloyds Banking Group 等大型银行客户的战略股权投资进一步强化了这一 Tier-1 聚焦，为其提供竞争对手难以复制的商业分销协同。
