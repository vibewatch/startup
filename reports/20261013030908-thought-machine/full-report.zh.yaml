      - number: '5.2'
        title: 云原生架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              Vault Core 的技术架构遵循事件驱动的微服务范式，消除了传统批处理银行窗口。每次交易状态变化都会生成带时间戳的事件，并发布到 Apache Kafka
              流集群，让下游银行服务在毫秒级接收账户入账和余额变动。不同于把总账直接嵌入核心入账路径的传统平台，Vault Core
              将总账功能完全分离，把实时金融事件流式传给外部总账会计软件。这样，客户交易吞吐不会受到月度计提、摊销计划或复杂报表查询影响。平台运行在 Kubernetes 管理的容器化微服务上，支持 Amazon Web
              Services、Google Cloud Platform、Microsoft Azure 和私有云环境的多云部署，依赖具备严格可串行化保证的云原生关系数据库，而不是主机仿真。
            claimRefs:
              - CE001
