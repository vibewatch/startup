  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与支出分类
        blocks:
          - type: paragraph
            body: >-
              现代核心银行基础设施市场包括后端会计、存款管理、贷款引擎和产品逻辑平台，它们维护最终客户账本。过去，银行把核心银行视为大型单体主机部署中不可分割的一部分，客户界面、网点终端系统和批量清算流程也都封装其中。如今的市场边界已将这一核心运营引擎，与上游数字体验层、客户关系管理系统和外部支付网络清晰分开。Thought
              Machine 的主要产品 Vault Core 专注于云原生账本处理和可配置智能合约产品定义。该品类的支出是软件订阅和许可投资，与公有云基础设施托管费及外部系统集成预算明确分开。Vault Payments
              等相邻品类的支付发卡处理业务虽会扩大客户合同总额，但纯核心软件的可服务空间仍由企业替换脆弱传统账本、转向灵活云基础设施的需求决定。
            claimRefs:
              - CM004
              - CM013
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM004
              - CM013
              - CM014
      - number: '2.2'
        title: TAM、SAM、SOM 与可服务规模框架
        blocks:
          - type: paragraph
            body: >-
              要量化核心银行现代化市场，不能只看银行科技总量，而要按多个约束条件拆解机构支出。全球金融服务业每年的企业信息技术支出超过三千亿美元，但专门用于核心银行引擎的软件只有一百二十亿至一百五十亿美元，其中绝大部分历史上被传统主机厂商的维护合同锁定。现代云原生核心软件的可服务市场目前估计为四十亿至六十亿美元，受
              Tier 1、Tier 2 及专业区域银行进行多年重构规划的周期约束。对 Thought Machine 而言，近期可服务的可获得市场来自正在进行的现代化项目；扩展现有 20 家 Tier 1
              客户关系并争取近期竞争性采购，可立即触达二点五亿至五亿美元的机会。
            claimRefs:
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: 买方分层、采购治理与预算归属
        blocks:
          - type: paragraph
            body: >-
              核心银行软件的采购动态会随银行层级显著变化，并影响销售周期和经济韧性。在 Deutsche Bank、Lloyds Banking Group 等全球 Tier 1
              机构，核心重构属于多年期资本转型项目，需要董事会批准并由多个部门共同分配预算。Deutsche Bank 选择 Vault Core 就说明了这种模式：项目属于一项总额六亿欧元 的信息技术、运营和人工智能投资，由
              CIO 与 COO 共同治理。相较之下，Pathward 等中型和区域金融机构通过 CIO 主导的运营效率要求推动核心现代化，以支持可规模化的 Banking-as-a-Service 合作。Tier 1
              合同能带来高额年度经常性软件收入和多年平台粘性，但其治理结构也会拉长采购评估，并加重对第三方集成商的依赖。
            claimRefs:
              - CM001
              - CM003
              - CM008
              - CM009
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM003
              - CM008
              - CM009
      - number: '2.4'
        title: 增长驱动、监管推动与采用约束
        blocks:
          - type: paragraph
            body: >-
              经济、竞争和监管催化剂叠加，正加速云原生核心银行软件的采用。传统贷款机构面临严峻运营成本压力；相比传统主机环境，云原生架构有望将维护支出最多降低
              百分之五十。此外，欧盟《数字运营韧性法案》等监管框架，正把技术债务从运营不便转化为紧迫的合规负担，迫使机构消除数十年旧代码中固有的单点故障。不过，极高的迁移风险和结构性转换成本仍严重限制采用。核心改造通常需要 7
              至 10 年分阶段执行，期间新旧引擎并行运行，以避免灾难性运营中断。欧洲银行业此前多次出现高关注度迁移失败，说明机构风险厌恶仍是决定市场转换速度的首要阻力。
            claimRefs:
              - CM002
              - CM010
              - CM011
              - CM012
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 核心银行现代化的迁移惯性高
            body: 即使云原生软件优势已经得到验证，核心银行改造仍是 5 至 10 年的企业级承诺。Deutsche Bank 的十年时间表说明，选择供应商软件只是第一步，系统集成商预算和并行运行的运营风险缓释同样占据重要支出。
            calloutType: risk
            claimRefs:
