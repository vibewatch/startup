  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 展示核心银行现代化市场的 TAM、SAM 和 SOM 分层。
    data:
      items:
        - label: 全球银行 IT 支出（$300B+）
          detail: 全球商业银行、零售银行和投资银行机构的企业 IT 总支出
        - label: 全球核心银行软件 TAM（$12B-$15B）
          detail: 覆盖所有旧式和现代架构的核心软件许可、订阅和维护
        - label: 云原生核心银行 SAM（$4B-$6B）
          detail: 欧洲和美洲云原生核心软件可争取的平台重构市场
        - label: 一级与二级现代化重点（$2B-$3B）
          detail: 已积极启动的大型跨司法辖区私人银行和零售银行核心替换预算
        - label: 近期可服务市场（$1.2B）
          detail: 全球前 100 家银行机构正在进行或已排期的核心供应商评估
        - label: Thought Machine 目标管线 SOM（$250M-$500M）
          detail: 现有客户合同扩展和入围投标带来的近期可执行 ARR 管线
    approximationNotes: 市场分层代表行业分析师区间，并结合 Thought Machine 已披露的客户层级综合得出。
