    approximationNotes: 展示从多年期银行合同签署，经账户迁移，到按用量计费现金流兑现的商业变现流程。
    claimRefs:
      - CI001
      - CI009
      - CI010
  - id: FE001
    title: Vault 平台分层运营架构
    type: stack
    summary: Thought Machine Vault 平台的六层架构栈，展示从外部银行渠道到底层物理持久化的分层。
    data:
      layers:
        - label: 第 1 层：渠道与集成层
          detail: REST API、GraphQL 端点、webhook 调度器和集成 SDK，连接 Web、移动端、合作伙伴系统及发起行平台。
        - label: 第 2 层：事件流传输层
          detail: Apache Kafka 事件流基础设施负责路由高优先级实时交易事件、账本更新和审计流。
        - label: 第 3 层：产品逻辑与智能合约
          detail: Universal Product Engine 在特定交易钩子处执行确定性的 Python 智能合约，覆盖存款、贷款、按揭和卡产品。
        - label: 第 4 层：支付处理引擎
          detail: Vault Payments 子系统处理发卡、支付网络适配器（Mastercard）和实时支付轨道消息。
        - label: 第 5 层：核心实时账本
          detail: 不可变的复式记账交易账本，维护实时余额计算、记账规则和带时间戳的交易日志。
        - label: 第 6 层：云基础设施与持久化
          detail: 云原生容器化微服务运行在 AWS、GCP、Azure 或私有云的 Kubernetes 上，并采用 ACID 关系型存储。
    approximationNotes: 架构分层反映 Vacuumlabs 和 NTT DATA 发布的通用部署蓝图。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
      - CE006
  - id: FU001
    title: 企业核心银行客户采用与扩张旅程
    type: journey-map
    summary: 展示从初始绿地部署到在线账户收入扩张的多阶段企业采用路径。
    data:
      items:
        - label: 评估与选型
          stage: 评估与选型
          action: Architectural benchmarking and smart contract proof-of-concept against legacy cores
          touchpoints:
            - 高管简报和 RFP
            - AWS Vault Forge 遗留代码提取
            - 监管架构审计
        - label: 初始实施
          stage: 初始实施
          action: Sandbox configuration of Python smart contract products and API integration
          touchpoints:
            - Vault Core 沙盒部署
            - 系统集成商入场（例如 GFT）
            - 借助 Vault Payments 接入支付轨道
        - label: 试点 / 分阶段上线
          stage: 试点 / 分阶段上线
          action: Controlled production launch with initial cohort of live accounts
          touchpoints:
            - 小规模在线账户部署（约 100k-500k 个账户）
            - 与主机系统双轨运行并核对账本
            - 实时账本压力测试
        - label: 全量生产迁移
          stage: 全量生产迁移
          action: Mass migration of retail core portfolios and retirement of legacy systems
          touchpoints:
            - 完成全体客户的账本切换
            - 全天候持续运营（24/7），零停机
            - 退役主机数据库许可证
        - label: 扩张与生态延伸
          stage: 扩张与生态延伸
          action: Adding Vault Payments modules and third-party integration library capabilities
          touchpoints:
            - 启用 Vault Payments
            - 集成 Trade Ledger 商业贷款
            - 随账户基数复合增长，扩大按用量计费收入
        - label: 多实体规模化
          stage: 多实体规模化
          action: Replicating universal core across multi-region operating groups and affiliate entities
          touchpoints:
            - 多处理组部署
            - 跨境支付清算
            - 全球企业客户批量折扣
    approximationNotes: 采用阶段综合自高管公开表述中的银行接入轨迹和按用量计费变现路径。
    claimRefs:
      - CU002
      - CU004
      - CU007
      - CU010
      - CU011
