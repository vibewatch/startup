      - number: '3.2'
        title: 技术与商业差异化
        blocks:
          - type: paragraph
            body: >-
              Thought Machine 的主要技术护城河，是 Vault Core 内的 Universal Product Engine（UPE）和智能合约配置层。Vault
              不再为按揭、存款、信用卡和商业贷款分别运行功能孤岛，而是在单一通用账本架构上，把每个金融产品定义为独立智能合约。这样，金融机构无需修改核心系统代码或创建定制分支，就能构建、测试并部署定制产品。此外，Vault
              把云基础设施、核心能力和产品配置拆为三个独立层，使交易可以全天候 24/7 实时处理，且没有计划内维护窗口。


              在商业上，Thought Machine 依靠多年期企业平台许可协议变现，并叠加按 Vault
              上运行的活跃客户账户计收的经常性费用。这种合同结构让软件收入扩张与客户采用同步，但核心迁移推进时，合同签署与收入兑现之间会出现明显滞后。相比由高额前置永久许可费和持续维护费主导的传统许可模式，Thought
              Machine 的模式更符合现代企业软件经济学。不过，独立评测显示，Tier-1 迁移的项目实施周期为 18 至 24 个月，入门级部署成本超过 $200,000，这为次级银行和早期金融机构设置了商业门槛。
