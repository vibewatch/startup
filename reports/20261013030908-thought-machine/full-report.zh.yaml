            - 高
            - 中
            - 中等
            - 高
        - label: 云超大规模厂商基础设施依赖
          values:
            - 高
            - 低
            - 高级
            - 中
        - label: 多司法辖区监管合规
          values:
            - 中
            - 中
            - 高级
            - 低
        - label: 卡支付网络与支付合作伙伴锁定
          values:
            - 中
            - 低
            - 中等
            - 中
        - label: 公开市场流动性窗口推迟
          values:
            - 高
            - 高
            - 早期
            - 高
        - label: 未经验证的现金消耗与经营利润率
          values:
            - 高
            - 中
            - 早期
            - 高
    approximationNotes: 基于企业合同复杂度、公开市场披露情况与平台架构的定性风险评分。
    claimRefs:
      - CR001
      - CR005
      - CR008
      - CR011
      - CR013
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 从商业规模和客户验证出发，经过结构性风险与估值纪律，最终得出“继续研究”的建议。
    data:
      nodes:
        - id: scale
          label: 商业规模：2026 年第二季度 ARR > $100M，收入同比增长 57% 至 £74.8M
        - id: customer-proof
          label: 客户验证：已签约 20 家一级银行，其中包括 Deutsche Bank 的 10 年期合同
        - id: economic-reality
          label: 财务阻力：2025 年经营亏损 £42M，部署周期多年延宕（德国迁移安排在 2027 年）
        - id: valuation-gap
          label: 估值纪律：$2.7B 的 D 轮基准对应 27x ARR，但 2025/2026 年条款不透明
        - id: exit-horizon
          label: 退出周期：CEO 以公开市场环境艰难为由，将伦敦 IPO 最早推迟至 2028 年
        - id: recommendation
          label: 最终立场：建议继续研究；估值评级偏高，风险高
      edges:
        - from: scale
          to: customer-proof
          label: 验证一级客户需求
        - from: customer-proof
          to: economic-reality
          label: 遇到交付延宕
        - from: economic-reality
          to: valuation-gap
          label: 压缩 2022 年倍数
        - from: valuation-gap
          to: exit-horizon
          label: 推迟流动性窗口
        - from: exit-horizon
          to: recommendation
          label: 决定暂缓并开展尽调
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV007
      - CV008
      - CV009
      - CV011
