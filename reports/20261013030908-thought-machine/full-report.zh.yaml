        title: 产品定义与模块化边界
        blocks:
          - type: paragraph
            body: >-
              Thought Machine 从底层为云环境打造现代核心银行基础设施。它没有提供把客户关系管理、风险分析和法定报告绑定在同一代码库中的单体核心银行套件，而是将主要引擎 Vault Core
              限定为实时复式账本。金融产品业务逻辑由 Universal Product Engine 以 Python 智能合约形式在外部定义，可在统一账本引擎上支持活期账户、储蓄、信用卡、按揭和商业贷款。除 Vault
              Core 外，公司还提供 Vault Payments，这是一个云原生发卡处理和支付引擎，用于简化交易路由，并与 Mastercard 等支付网络集成。在北美，Pathward 等受监管机构把 Vault
              Core 作为 sponsor banking 基础设施，以在金融科技项目中扩展商业贷款和合作伙伴支付。
            claimRefs:
              - CE001
