  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心运营假设
      - 隐含估值 / 倍数
      - 下行触发因素 / 主要风险
      - 概率信号
    rows:
      - - 乐观情景
        - ARR 到 2028 年扩大至 $180M+；Deutsche Bank 和一级银行迁移按计划完成；软件毛利率达到 75%+。
        - $2.5B–$3.0B 估值（远期 ARR 的 14–16 倍）。
        - 迁移执行延期；公开市场软件倍数收缩至 10 倍以下。
        - 20%（要求一级客户的复杂核心迁移零失误执行）。
      - - 基准情景
        - ARR 到 2028 年按 25–30% CAGR 增长至 $140M；服务收入占比维持在 30%+ 的高位；2027 年底前达到盈亏平衡。
        - $1.2B–$1.5B 估值（远期 ARR 的 8–10 倍）。
        - 旧系统长期并行运行的成本，以及银行联盟推动的价格重谈。
        - 55%（符合历史销售周期和企业 IT 替换惯性）。
      - - 悲观情景
        - ARR 增长放缓至 10–15%；迁移停滞；一级银行推迟上线；持续运营亏损迫使公司筹集稀释性融资。
        - $600M–$800M 估值（远期 ARR 的 4–5 倍）。
        - 实施失败、平台宕机，或旗舰账户客户流失。
        - 20%（反映核心替换项目遇到运营障碍时的结构性下行）。
      - - 下行重组
        - 现金 runway 在实现持续盈利前耗尽；可转债触发惩罚性棘轮条款；公司以折价轮完成资本重组。
        - $350M–$500M 清算 / 资本重组估值。
        - 高级清算优先权将初级股权和普通期权持有人权益全部抹去。
        - 5%（一级银行股东的强力支持和近期债务注资降低了该风险）。
    notes: 假设 2026 年 ARR 基线为 $100M+，并建模至预计 2028 年退出窗口。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV006
      - CV007
      - CV011
