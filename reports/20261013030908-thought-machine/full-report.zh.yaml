chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、架构愿景与创立
        blocks:
          - type: paragraph
            body: >-
              Thought Machine 于 2014 年由 Paul Taylor 在伦敦创立，目标是解决传统银行 IT
              的系统性脆弱性和架构停滞。此前十年间，零售、电商、物流和电信业已明确转向超大规模云基础设施，但全球银行系统仍依赖以 COBOL
              编写的传统主机平台。这些单体架构把存款账户、贷款工具和交易账本硬编码进僵化基础设施，导致常规产品改进需要 12 至 24 个月，运营维护支出高企，也容易受到计划内批处理停机影响。


              为了把产品设计与底层核心处理解耦，Thought Machine 从零打造了 API 优先、云原生的银行引擎 Vault Core。Vault Core
              不再在传统核心之上覆盖数字化表层，而是引入不可变的实时账本，以及名为 Universal Product Engine 的独立配置层。金融产品和交易流程以 Python
              智能合约形式定义，让银行无需修改核心平台代码，就能在数周内推出定制储蓄账户、商业贷款和按揭产品。平台覆盖 Amazon Web Services、Google Cloud Platform 和 Microsoft
              Azure 等主要云超大规模服务商，支持与现有传统核心并存、完整迁移存量账簿，以及从零建设数字银行。
            claimRefs:
              - CO001
              - CO004
              - CO006
              - CO007
