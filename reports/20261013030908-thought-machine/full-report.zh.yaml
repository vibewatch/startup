          - type: callout
            title: 智能合约逻辑的实施摩擦与人才稀缺
            body: >-
              Vault 的智能合约配置虽然无需修改传统核心代码，但其专有语言要求专门的开发技能，而传统银行 IT 部门普遍缺乏这类人才。再加上 18 至 24
              个月的部署周期和高项目成本，这种复杂度可能造成交付摩擦，并使中端市场和较小金融科技机构容易转向开箱即用的 SaaS 核心方案。
