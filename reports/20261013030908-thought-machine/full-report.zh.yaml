      - number: '1.3'
        title: 资本化历史、战略投资者与尽调现实
        blocks:
          - type: paragraph
            body: >-
              Thought Machine 的资本化路径显示，风险投资机构资本与 Tier-1 战略客户投资者很早就形成了协同。完成种子期融资后，公司于 2016 年完成 Series A，Lloyds Banking
              Group 提供股权支持，建立了客户主导机构资本化的模式。此后，公司于 2020 年完成 $83 million 的 Series B（后来扩大至 $125 million），并于 2021 年 11 月完成由
              Nyca Partners 领投的 $200 million Series C。Series C 让 Thought Machine 成为投后估值超过 $1 billion 的金融科技独角兽，也引入了
              JPMorgan Chase Strategic Investments、Standard Chartered Ventures 和 ING Ventures 的战略股权投资。


              2022 年 5 月，公司完成 Temasek 领投的 $160 million Series D，正式估值基准达到 $2.7 billion。不过，2022 年 5
              月的估值仍是最后一次正式披露的股权基准。之后的融资显示估值敏感度上升，并采用了结构化资本机制。2025 年 7 月，公司完成一轮内部融资，申报文件和新闻来源分别将其描述为 £44.8 million 或 £51
              million。2026 年 5 月，Thought Machine 从一家现有 Tier-1 银行客户处融资 £30 million（$41 million）；其中 £21 million
              是员工期权的二级股份出售，只有 £9 million 通过可转债作为新增一级资本注入。伦敦 IPO 最早推迟至 2028 年，若要把过时的 $2.7 billion
              估值倍数用于投资判断，就必须直接尽调优先清算权和现金消耗经济性。
            claimRefs:
              - CO003
              - CO008
