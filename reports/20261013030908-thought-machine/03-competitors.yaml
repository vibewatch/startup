callouts:
  - calloutType: insight
    title: Strategic Investor Alignment as a Defensive Channel Moat
    body: Thought Machine's equity capitalization includes several of its largest global client banks, including JPMorgan Chase, Standard Chartered, and Lloyds Banking Group. This structural customer-shareholder alignment reinforces long-term vendor retention, aligns product roadmaps with systemically important institutions, and creates formidable distribution barriers against rival next-generation core banking entrants.
    claimRefs:
      - CP003
      - CP005
      - CP013
  - calloutType: risk
    title: Implementation Friction and Talent Scarcity in Smart-Contract Logic
    body: While Vault's smart-contract configuration eliminates legacy core code modifications, the proprietary language requires specialized developer skillsets that are scarce across traditional bank IT departments. Together with 18-to-24 month deployment cycles and high project costs, this complexity creates potential delivery friction and leaves mid-market and smaller fintech tiers vulnerable to turnkey SaaS core alternatives.
    claimRefs:
      - CP006
      - CP007
      - CP014
