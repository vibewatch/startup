callouts:
  - calloutType: "risk"
    title: "Long Core Migration Cycles Create Severe Revenue Lag"
    body: >
      While Thought Machine has successfully contracted with 18 to 20 tier 1 global institutions, core banking migrations typically require 2 to 4 years of complex integration before full account volumes transition onto Vault Core. Because the company's business model relies partially on per-account and platform usage fees, reported contract wins create multi-year revenue lags, leaving commercial cash flows vulnerable to bank implementation delays.
    claimRefs:
      - "CU007"
      - "CU010"
      - "CU016"
  - calloutType: "strength"
    title: "Unrivaled Penetration Among Tier 1 Global Banking Incumbents"
    body: >
      Thought Machine holds an industry-leading position among next-generation core banking vendors, securing flagship deployments at global institutions including JPMorgan Chase, Lloyds Banking Group, Standard Chartered, and Intesa Sanpaolo. Winning tier 1 validation provides substantial competitive moats and establishes Vault Core as a viable enterprise platform for mission-critical core replacements.
    claimRefs:
      - "CU003"
      - "CU008"
      - "CU011"
      - "CU014"
