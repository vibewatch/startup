  title: "Customers"
  summary: "Thought Machine powers core banking infrastructure across 68 signed institutions globally—including tier 1 leaders such as JPMorgan Chase, Lloyds Banking Group, and Standard Chartered—while accelerating into regional banks and sponsor institutions like Pathward and General Bank of Canada. However, commercial revenue realization is gated by multi-year core migration timelines, and high customer concentration among top tier 1 banks creates meaningful revenue timing exposure."
sections:
  - id: "customer-segmentation"
    title: "Enterprise Buyer Segmentation & Architectural Fit"
    body: >
      Thought Machine segments its banking buyer base into three primary operational tiers: tier 1 multinational banking institutions executing core modernization, regional commercial and consumer banks seeking agility, and sponsor or BaaS banks powering modern fintech balance sheets. The platform's flagship universal product engine, Vault Core, alongside Vault Payments, enables financial institutions to replace monolithic mainframe core architectures with Python-configured smart contract products and cloud-native microservices. For global tier 1 banks such as JPMorgan Chase, Standard Chartered, and Intesa Sanpaolo, the primary economic buyer is the Chief Information Officer or Group Head of Technology seeking to retire multi-decade legacy technical debt and eliminate scheduled maintenance downtime. In the regional and specialized institution tier—exemplified by institutions like Mascoma, General Bank of Canada, and Pathward—the buying center focuses on accelerating new product delivery and enabling API-driven B2B2C or sponsor banking capabilities. However, these distinct buyer segments display vastly different procurement cycles, implementation burdens, and custom integration complexities across their existing ledger estates.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory"
    title: "Adoption Trajectory & Revenue Model Dynamics"
    body: >
      Commercial adoption of Thought Machine's platform has reached significant enterprise milestones, with the company reporting over $100 million in annual revenue for 2025 alongside surpassing the $100 million ARR threshold as of Q2 2026. This financial expansion reflects a 57% year-on-year revenue surge supported by multi-year core banking commitments across 68 signed client banks globally. The business model combines long-term baseline subscription agreements with variable usage-based fee structures tied directly to the number of live customer accounts and transaction volumes processed on Vault Core. Under this account-based monetization structure, client contracts typically commence with a pilot deployment of several hundred thousand accounts before scaling across millions of primary retail accounts. Crucially, a critical operational gap exists between contract execution and live revenue generation: major enterprise core migrations require multi-year transition phases where banks run legacy mainframes and Vault Core in parallel. This timing asymmetry means reported ARR and contractual milestones substantially lead cash collections and realized platform usage fees, leaving commercial growth sensitive to migration delays.
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU002"
  - id: "customer-proof"
    title: "Named Customer Deployments & Production Status"
    body: >
      Verified customer deployments highlight Thought Machine's dual penetration of tier 1 global institutions and specialized regional financial players. In the United States, Pathward selected Vault Core in August 2026 to modernize its sponsor banking infrastructure, providing real-time ledger capabilities across commercial lending, payments sponsorship, and fintech partner programs. In Canada, Schedule 1 chartered General Bank of Canada initiated a migration to Vault Core to support its transformation into a B2B2C financial product manufacturer. In the United Kingdom, anchor client Lloyds Banking Group deployed Vault Core and Vault Payments into live production, achieving a reported 40% reduction in system downtimes alongside a 30% increase in payment processing efficiency. Meanwhile, global tier 1 deployments such as JPMorgan Chase's retail core overhaul and Standard Chartered's digital banking operations showcase deep enterprise production validation. Despite these high-profile references, public visibility into customer churn, retention metrics (NRR/GRR), and individual account migration velocity remains strictly limited, creating significant diligence uncertainty regarding long-term client expansion economics.
    claimRefs:
      - "CU003"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
    tableRefs:
      - "TU003"
