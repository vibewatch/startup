callouts:
  - calloutType: "risk"
    title: "Delivery Risk and Revenue Lag in Large Bank Core Migrations"
    body: "Because tier 1 core banking migrations span 12 to 24 months with live product cutovers often scheduled years after contract execution, headline contract wins like Deutsche Bank do not generate immediate software revenue. Any deployment stall threatens future enterprise sales and delays usage-based monetization."
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI011"
  - calloutType: "insight"
    title: "Convertible Debt Financing Signals Cautious Late-Stage Valuation Climate"
    body: "Thought Machine's May 2026 financing transaction yielded only £9 million in primary growth capital via convertible loan notes alongside £21 million in secondary share option sales. Deferring an IPO to 2028 and avoiding a priced equity round reflects management's decision to decouple current operations from its stale 2022 valuation."
    claimRefs:
      - "CI006"
      - "CI007"
