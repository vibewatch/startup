chapter:
  number: 5
  title: Product & Technology
  summary: Thought Machine delivers Vault Core, a cloud-native core banking engine centered on a real-time double-entry ledger with product behavior authored as Python smart contracts, alongside Vault Payments for transaction processing. Its modular architecture decouples the transactional ledger from general ledger reporting and external risk systems, supported by certified integration partners such as Vacuumlabs, NTT DATA, and Luxoft, though public benchmarks for sustained tier-1 throughput under complex multi-product migrations remain undisclosed.
sections:
  - id: product-definition-and-modular-footprint
    title: Product Definition and Modular Footprint
    body: >-
      Thought Machine delivers modern core banking infrastructure designed from the ground up for cloud environments. Rather than supplying a monolithic core banking suite that binds customer relationship management, risk analytics, and statutory reporting into a single codebase, Thought Machine restricts its primary engine, Vault Core, to the real-time double-entry ledger. Business logic for financial products is expressed externally as Python smart contracts managed through its Universal Product Engine, which can support current accounts, savings, credit cards, mortgages, and commercial lending on a single unified ledger engine. Alongside Vault Core, the company provides Vault Payments, a cloud-native issuer processing and payments engine developed to streamline transaction routing and integrated with payment networks including Mastercard. In North America, regulated institutions such as Pathward deploy Vault Core as foundational sponsor banking infrastructure to scale commercial
      lending and partner payments across fintech programs.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE008
      - CE009
    tableRefs:
      - TE001
  - id: cloud-native-architecture-and-operating-model
    title: Cloud-Native Architecture and Operating Model
    body: >-
      Vault Core’s technical architecture follows an event-driven microservices paradigm that eliminates traditional batch-oriented banking windows. Every transactional state change generates timestamped events published across Apache Kafka streaming clusters, allowing downstream banking services to ingest account postings and balance transitions in milliseconds. Unlike legacy platforms that embed a general ledger directly into the core posting path, Vault Core separates general ledger functionality entirely, streaming real-time financial events to external general ledger accounting packages. This decoupling ensures that customer-facing transaction throughput remains unaffected by monthly accruals, amortization schedules, or complex reporting queries. The platform runs containerized microservices managed on Kubernetes and supports multi-cloud deployments across Amazon Web Services, Google Cloud Platform, Microsoft Azure, and private cloud environments, relying on cloud-native
      relational databases with strict serializability guarantees rather than mainframe emulation.
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE006
      - CE010
    tableRefs:
      - TE003
    figureRefs:
      - FE001
  - id: deployment-workflows-and-migration-patterns
    title: Deployment Workflows, Integrations, and Migration Patterns
    body: >-
      Deploying Vault Core into enterprise financial institutions requires disciplined integration architecture and specialized systems engineering. Because Thought Machine provides an unbundled core engine rather than an all-in-one suite, financial institutions must integrate the ledger with surrounding channels, card processors, anti-money laundering engines, and regulatory compliance data stores via REST APIs and Kafka event topics. To bridge this integration requirement, Thought Machine has cultivated a certified partner ecosystem that includes global systems integration firms such as Vacuumlabs, Luxoft, and NTT DATA. These partners execute end-to-end technical designs, author product smart contracts, configure ledger account hierarchies, and manage complex migration programs from legacy core mainframes to cloud-native targets. Implementation workflows typically adopt incremental migration patterns, running Vault Core alongside legacy back-office systems before cutting over active
      product books.
    claimRefs:
      - CE004
      - CE007
      - CE008
      - CE010
      - CE013
    tableRefs:
      - TE002
  - id: technical-differentiation-trust-and-architectural-risks
    title: Technical Differentiation, Trust Controls, and Architectural Risks
    body: >-
      Thought Machine’s primary technical moat rests on its smart contracts paradigm, which substitutes hardcoded database configurations with version-controlled, testable Python code executed at transaction hooks such as on-posting and on-acceptance. This architecture allows financial product managers to prototype and deploy new deposit or lending instruments in days rather than waiting for annual vendor release cycles. However, this architectural decoupling introduces distinct operational and technical risks. Fraud detection and anti-financial crime checks must operate outside the immediate transaction execution loop, requiring asynchronous evaluation or authorization-stage network coordination inspired by card networks. Furthermore, backdated transactions require careful grace-period boundaries to recalculate interest and balance curves without violating ledger immutability. Finally, while Thought Machine powers prominent production deployments across global institutions,
      independent third-party benchmarks verifying sustained transaction-per-second ceilings under complex multi-product concurrent loads remain undisclosed publicly.
    claimRefs:
      - CE002
      - CE011
      - CE012
      - CE013
      - CE014
