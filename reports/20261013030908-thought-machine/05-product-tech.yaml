      - CE001
      - CE002
  - calloutType: risk
    title: Asynchronous Risk Decoupling Demands External Orchestration
    body: Because Vault Core strictly isolates the ledger from surrounding banking functions, fraud detection, general ledger accounting, and complex migrations require external event orchestration and certified integration partners, shifting architectural complexity to the integration layer.
    claimRefs:
      - CE004
      - CE011
      - CE012
      - CE013
