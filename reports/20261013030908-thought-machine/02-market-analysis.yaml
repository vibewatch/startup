  rows:
  - - Global Tier 1 Banks (e.g. Deutsche Bank, Lloyds)
    - Chief Information Officer / Chief Operating Officer
    - Core banking operations, product engineers, branch/ledger managers
    - Central IT Capital Investment Budget / Transformation Fund
    - Multi-year parallel run replacing 10-15 legacy platforms with unified cloud engine
    - Executive Board / Group CIO
    - Legacy technical debt crises, regulatory operational resilience mandates (DORA), cost-to-income targets
  - - Tier 2 & Specialized Banks (e.g. Private / Wealth Banking)
    - Head of Private Banking / Technology Division Lead
    - Relationship managers, private banking operations officers
    - Divisional Technology Budget
    - Consolidation of fragmented bespoke systems into real-time multi-currency ledger
    - Divisional COO / Business Line CEO
    - Pressure from digital wealth challengers, bespoke legacy unmaintainability, demand for rapid product launch
  - - Mid-Size & Regional Banks (e.g. Pathward, Mascoma)
    - Chief Information & Operations Officer / Chief Executive Officer
    - Retail lending staff, payments operations teams
    - Bank Technology Operating Budget
    - Greenfield core replacement or migration to expand national lending and payments access
    - CIO / CFO
    - Need for modern Banking-as-a-Service rails, partner fintech onboarding speed, aging core vendor limitations
  - - Challenger Neobanks & Fintechs
    - Chief Technology Officer / Co-Founder
    - Software engineers, product managers, automated underwriting teams
    - Venture Capital / Operating Cash Flow
    - Native API-first core buildout launching new card and savings products in weeks
    - CTO / VP Engineering
    - Time-to-market necessity, unit economics scalability, lack of legacy mainframe infrastructure
  notes: Buyer segmentation reflects distinct decision hierarchies, where Tier 1 lenders require board-level approval and regional banks operate under operational CIO mandates.
