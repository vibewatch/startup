      - number: '3.3'
        title: 差异化壁垒韧性、转换门槛与被替代风险
        blocks:
          - type: paragraph
            body: >-
              CFS 的核心竞争护城河依托两根互为强化的防御支柱：科学维度的可预测性，以及工业维度的自主制造能力。不同于依赖全新、未经证实的等离子体物理机理的非传统约束构型，CFS 的 SPARC 与 ARC
              装置直接建立在全球 150 余台托卡马克数十载积累的经验物理学基础之上。将这一稳健的物理基本盘与自研 20-tesla 高温超导（HTS）VIPER 线缆及 Devens 基地的自建磁体产线相结合，CFS
              相比传统低温超导装置获得了 16 倍的聚变功率密度提升（与磁场强度的四次方 B^4 呈比例关系）。此外，CFS 引入与 Siemens NX 及 NVIDIA Omniverse
              整合的工业数字化工程流，以加速分系统装配并压缩设计迭代周期。然而，其差异化优势的持久性仍面临严峻的技术与经济脆弱性。在商业电站中，实现净上网电量（Milestone
              5）需要克服巨大的厂用电循环负荷——包括等离子体辅助加热、HTS 线圈深冷制冷、激光或射频源（RF）以及常规电站辅机负荷。采用直接能量转换路线的开发商（如 Helion 的
              FRC）可避开蒸汽朗肯循环，不受理论卡诺循环效率上限（~40%）约束，有望在发电效率上实现翻倍提升。此外，若竞争性技术路线以更低的氚增殖需求实现净发电，或亚洲主权资本支持的项目推动低成本 HTS
              磁体供应链商业化，将削弱 CFS 的制造先行优势，对其护城河构成长期侵蚀风险。
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP014
              - CP015
              - CP016
