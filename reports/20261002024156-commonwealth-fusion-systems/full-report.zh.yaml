      - number: '1.3'
        title: 资本沿革与利益相关方
        blocks:
          - type: paragraph
            body: >-
              CFS 汇集了体量罕见的一级市场资本基盘。已披露轮次包括 2021 年 $1.8B 的 B 轮融资、2025 年 8 月 $863M 的 B2 轮融资，以及 2026 年 7 月 $1B 的追加股权融资；CFS
              称其累计融资额已达 $4B [CO004, CO009, CO010]。产业资本参与具备显著商业价值：Google 与 Eni 既是股权投资方，也是未来购电客户；Tiger Global、Breakthrough
              Energy Ventures、NVentures、Counterpoint Global 及日本企业财团亦出现在融资披露名单中 [CO004, CO009,
              CO011]。但融资额不应等同于账面可用现金，资金实际消耗、剩余出资承诺、负债、老股交易、清算优先权及项目融资资金需求均未公开。
