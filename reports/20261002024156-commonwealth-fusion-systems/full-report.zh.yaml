              - CV014
      - number: '8.3'
        title: 乐观、基准与悲观情景分析框架
        blocks:
          - type: paragraph
            body: >-
              公开证据仅足以推演里程碑情景，不足以支撑具备可防守性的股权估值区间。乐观情景要求 SPARC 在公司既定时限附近达成 Q>1，随后拿出关于 ARC 建造造价、项目融资及工程交付的可靠证据。基准情景假定 SPARC
              保持渐进突破，但净上网电量转换与首台套电站经济性依然面临不确定性。悲观情景则是 Q>1
              试验失败或出现重大延误，抑或融资条款向高级别证券过度让渡价值。本报告未对各情景赋予数值概率，因为公开材料中既无独立工程概率测算，亦无经审计的项目经济模型。同理，缺少入场价格、股权条款、稀释模型与退出估值，根本无法测算目标回报率；上述内容均为不可或缺的准入尽调输入项，绝非从累计融资额中倒推估算的变量。
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV014
              - CV016
      - number: '8.4'
        title: 商业化信号、退出成熟度与最终尽调清单
        blocks:
          - type: paragraph
            body: >-
              ARC 规划虽现商业信号，但尚无达到估值要求的现金流证据。CFS 称 Google 已同意采购首座电站半数电力，但保留证据未提供定价、期限、里程碑、违约救济或可融资性条款。Forge 指出 CFS 尚未认可
              IPO 计划，二级市场交易有限且未显示价格；这属于公开退出能见度偏弱的证据，不能证明私下不存在流动性。终审尽调应调取 2026 年 7 月融资文件、完全稀释股权结构表、优先股堆叠、现金余额与项目预算、SPARC
              测试计划、ARC 建设与运营模型、PPA 文件及融资方案。只有在技术验证与交易经济性均可观测时，评级观点才应上调；单靠融资规模无法弥补任一要求。
            claimRefs:
              - CV003
              - CV004
              - CV008
              - CV009
              - CV014
              - CV015
      - number: '8.5'
        title: 附录
        blocks:
          - type: callout
            title: 定价是缺失输入项，而非可假设变量
            body: 已披露融资规模无法替代当前股权价格、证券条款、完全稀释所有权或下行保护优先权。在获取这些交易输入参数前，应将公司保留在里程碑观察名单中。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV014
              - CV015
