chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与运营模式
        blocks:
          - type: paragraph
            body: >-
              Commonwealth Fusion Systems（CFS）于 2018 年脱胎自 MIT 创立，总部位于 Massachusetts 州 Devens [CO001,
              CO002]。其运营逻辑是利用高温超导磁体缩小托卡马克体积：SPARC 作为示范装置，旨在验证核聚变净能量增益；ARC 则属于规划中的电网级电站
              [CO003]。公司目前并非售电收入型企业。公开材料勾勒出分步推进的开发路径，技术验证、电站工程设计、电网接入、电站建设及未来售电分阶段实施。因此，眼下最具备决策价值的评估维度是融资能力、执行里程碑以及已签约的未来需求，而非
              ARR 或当期商业发电量。
            claimRefs:
              - CO001
              - CO002
              - CO003
