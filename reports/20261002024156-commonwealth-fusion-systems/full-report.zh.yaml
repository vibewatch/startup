              CFS 已确立全球资金最雄厚的私营聚变开发商地位，其在 2026 年 7 月完成 $1.0B 股权融资，累计实缴资本达到 $4.0B，约占私营核聚变领域总融资的 30%。该轮融资紧随 2025 年 8 月完成的
              $863M B2 轮融资，标志着投资方群体从风险投资辛迪加拓宽至资金雄厚的基础设施产业资本、主权财富基金与养老金机构。尽管二手交易报告援引了 $8.0B
              投后估值上限的市场传闻，但具体股权估值倍数、月度运营现金烧钱速度及在手净现金储备仍未公开。CEO Bob Mumgaard 曾公开表示，从 SPARC 示范跨越至部署 ARC 商业电站机组，所需资金将超过
