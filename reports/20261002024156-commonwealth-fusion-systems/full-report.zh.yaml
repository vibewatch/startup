      - number: '3.4'
        title: 展项
        blocks:
          - type: callout
            title: 托卡马克物理历史积淀奠定 CFS 核心科学护城河
            body: >-
              在商业核聚变开发领域，最坚固的准入门槛在于等离子体物理定标率的可预测性。当同行竞争者押注缺乏充足历史验证的非传统磁约束或脉冲构型时，CFS 的强场托卡马克直接继承了全球已建造逾 150
              座实验托卡马克的成熟经验。磁场强度翻倍可显著提高聚变功率密度（按 B^4 比例增长），使 CFS 能够在不踏入未知物理学盲区的前提下大幅缩小反应堆体积。
            calloutType: insight
            claimRefs:
              - CP001
              - CP003
              - CP005
          - type: callout
            title: 净上网电量与等离子体增益对比：厂用循环电陷阱
            body: >-
              在等离子体边界达成科学净能量增益（Q>1）是必要条件，但不足以保证商业可行性。Milestone 5（向电网销售净电量）要求净电力输出必须覆盖电站全部内部寄生负荷，包括 HTS
              磁体深冷制冷、射频等离子体加热及电站辅助系统设备。次级辅助系统效率低下可能吃尽全部毛发电量，无论等离子体物理性能如何优异，都无法输出正向净电量。
            calloutType: risk
            claimRefs:
              - CP006
              - CP014
              - CP015
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 商业变现模式与购电消纳架构
        blocks:
          - type: paragraph
            body: >-
              Commonwealth Fusion Systems 属于商业化前阶段的能源技术开发商，距离实际发电运营仍有数年之遥，因而结构性消纳协议成为确立收入可见度的核心支柱。公司已与战略产业伙伴 Eni 及
              Google 达成正式双边协议，采购其规划设于 Virginia 州 Chesterfield County Fall Line 聚变电站的 400 MW 商业电站 ARC
              所产半数以上的清洁稳定电力。依据上述安排，实体电力将依托 Dominion Energy 输电基础设施注入 PJM 批发市场，购电方则付费并核销清洁能源属性。一级半市场追踪机构 UpMarket 报告估计其
              2026 年收入为 $31.7M，但这代表里程碑拨款、科研合作补贴或分析建模合作等非发电收入，并非商业售电。鉴于长期购电合同定价、价格上调保底机制及违约罚则严格保密，在 SPARC
              净能量验证落地前，其收入质量尚无法按照机构级项目融资标准予以核定。
            claimRefs:
