        - 已披露累计融资金额达 $4B。
        - 完工预算与现金对账证实拥有充足跑道。
      - - 核心逻辑
        - 科学里程碑
        - CFS 设定自 2026 年 2 月起约两年内实现 SPARC Q>1。
        - 独立测试结果证实所述等离子体里程碑。
      - - 核心逻辑
        - 商业路径
        - CFS 规划在 2030 年代初建成约 400 MW 的 ARC 电站。
        - 具备可审计的成本、工期、许可与运营计划以支撑交付。
      - - 反方逻辑
        - 估值不透明
        - 最新估值与可用的市场价格均未公开。
        - 融资文件明确价格、股权稀释以及优先股堆叠。
      - - 反方逻辑
        - Q>1 后的验证缺口
        - CFS 称 Q>1 是对外售电的必要非充分条件。
        - 电站级净上网电量与可靠性证据弥合该转化缺口。
      - - 反方逻辑
        - 资本负担高度集中
        - CFS 称其将对首座 ARC 自行融资、建造、持有并运营。
        - 落实有约束力的无追索权资本或风险共担资本，以降低公司层面敞口。
