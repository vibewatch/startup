      - number: '6.2'
        title: 具名客户背书、消纳承诺与 PPA 路径
        blocks:
          - type: paragraph
            body: >-
              CFS 的合同级客户验证建立在双边远期购电协议之上，而非实际交付的兆瓦时发电量。公司已与两大基石合作伙伴正式签署长期 PPA：Google 与 Eni。2025 年 7 月，Google
              签署了行业首创的企业购电协议，采购规划建于 Virginia 州 Chesterfield County Fall Line 聚变电站 ARC 设施的 200 MW（200 兆瓦）清洁电力，锁定了该设施预计
              400 MWe 额定输出电量的一半。2025 年 9 月，意大利跨国能源公司 Eni 紧随其后，签署了一份价值超过 $1B 的商业购电协议，承购首座商业 ARC
              电站所产清洁聚变电能。在电站并网投运之前数年，这两项战略协议合计锁定了首台商业反应堆 50% 以上的发电容量。与此同时，CFS 宣布与区域公用事业公司 Dominion Energy 展开战略合作，以统筹推进
              Virginia 州当地的电网接入与基础设施建设。尽管上述声明具备里程碑意义，但迄今尚未实际输送任何电量，底层合同架构依然属于附带条件的远期承诺，完全取决于 SPARC 的实验验证与 ARC 的建设落地。
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
