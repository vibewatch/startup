      - number: '4.2'
        title: 成本结构、工程建设开支与包层工程
        blocks:
          - type: paragraph
            body: >-
              CFS 具有极高的研发资本密集度，主要源于高温超导（HTS）REBCO 磁体的精密制造、高真空低温恒温器容器，以及 Devens 基地和 Fall Line 场址的专用基础设施建设。运营支出主要由逾 1,000
              名高精尖员工的专业工程薪酬与原型试制开销构成。管理层口径显示，在投入数十亿美元建设预算后，SPARC 示范托卡马克的建设进度已达约 80%，目标是在 2027
              年实现净能量增益（Q>1）。然而，独立核电研究机构的技术分析表明，关键的电站辅助系统组件面临根本性的成本与运行不确定性。具体而言，美国电力科学研究院（Electric Power Research
              Institute）指出，用于氚捕集与增殖的液态包层技术在全球范围内尚不成熟，在商业 ARC 部署前可能引发资本支出激增和运行屏蔽瓶颈。CFS 已加入英国 LIBRTI
              测试计划以同步验证氚包层设计，但尚未跑通的增殖经济性仍是一项悬而未决的尽调约束。
