            - Type One 缆线许可
    approximationNotes: 对已披露组件的概念性综合；排列顺序并不意味着每一处接口、控制或安全系统均已公开记录。
    claimRefs:
      - CE015
  - id: FU001
    title: CFS 获客与商业化演进图
    type: journey-map
    summary: 从机构股权绑定到远期 PPA 协议锁定，直至最终实现公用事业电网同步的商业演进路径。
    data:
      items:
        - label: 'Phase 1: 战略股权绑定'
          stage: 早期验证
          description: 吸引企业能源与科技领军企业作为 Series A 和 B 轮战略投资方参与。
          touchpoints:
            - Eni 早期股权投资及联合研发
            - Google 参与 Series B 轮多批次融资
        - label: 'Phase 2: 远期购电协议锁定'
          stage: PPA 签约
          description: 将战略投资者转化为 ARC 的双边长期购电客户。
          touchpoints:
            - Google 200 MWe 企业直接 PPA 协议
            - Eni $1B+ 长期商业消纳合同
        - label: 阶段 3：并网排队整合
          stage: 输电许可申报
          description: 向区域电力批发市场提交正式监管与并网申请。
          touchpoints:
            - PJM Interconnection 批发并网排队申请
            - Dominion Energy Virginia 公用事业机构协调
        - label: 阶段 4：规模化实验验证
          stage: 科学风险出清
          description: 在 SPARC 上验证聚变净能量输出，达成合同约定的履约里程碑。
          touchpoints:
            - 在 Devens 完成 SPARC 托卡马克总装
            - 以 2027 年验证净能量增益 Q>1 为目标
        - label: 阶段 5：商业电网送电
          stage: 商业运行消纳
          description: 投运 400 MWe Fall Line Station 并向电网输送基荷电力。
          touchpoints:
            - Chesterfield County ARC 商业投运
            - 依据已签署 PPA 产生商业化收入
        - label: 阶段 6：多电厂规模化扩张
          stage: 机组规模化部署
          description: 面向全球公用事业与企业客户推广标准化 ARC 电站。
          touchpoints:
            - Eni 国际东道国选址
            - 拓展超大规模数据中心表后供电站点
    approximationNotes: 展示从战略投资到商业化送电的结构化推进路径。
    claimRefs:
      - CU001
      - CU003
      - CU006
      - CU008
      - CU010
      - CU014
  - id: FR001
    title: 聚变商业化风险等级矩阵
    type: matrix
    summary: 从发生概率与影响程度评估核心运营、监管及财务风险因素。
    data:
      columns:
        - 发生概率：低
        - 发生概率：中
        - 发生概率：高
      rows:
        - label: 监管：出口管制
          values:
            - label: ITAR/EAR 跨国人员配置摩擦
              tone: neutral
            - label: 军民两用磁体技术归类审查
              tone: warning
            - label: 跨国工程数据传输延迟
              tone: warning
        - label: 工程：数字孪生
          values:
            - label: CAD/PLM 架构模型失步
              tone: neutral
            - label: Omniverse 等离子体模拟偏差
              tone: warning
            - label: 高热负荷模拟与实体建造偏差
              tone: warning
        - label: 运营：低温系统与安全
          values:
            - label: 台架测试液氦泄漏事故
              tone: neutral
            - label: 工业级高压引线裸露风险
              tone: warning
            - label: 强场超导磁体失超事件
              tone: negative
        - label: 供应链：REBCO 高温超导带材
          values:
            - label: 单一供应商带材化学品质漂移
              tone: neutral
            - label: 商业规模 REBCO 缺陷筛查瓶颈
              tone: warning
            - label: 数公里级强场线圈良率大幅下滑
              tone: negative
        - label: 电网并网：PJM 排队
          values:
            - label: Fall Line 变电站环境选址挑战
              tone: neutral
            - label: 区域输电集群研究成本激增
              tone: warning
            - label: 多年期 PJM 批发并网队列积压
              tone: negative
        - label: 核心物理与资本：净能量输出
          values:
            - label: 联邦加速器监管框架倒退至 Part 50
              tone: warning
            - label: SPARC 未建模等离子体不稳定性（Q < 1 失败）
              tone: critical
            - label: 商业 ARC 电站数十亿美元资本缺口
              tone: critical
    approximationNotes: 矩阵基于 2026 年披露的技术与财务基准归类定性风险因素。
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR006
      - CR008
      - CR009
  - id: FV001
    title: 投资建议逻辑
    type: flow
    summary: 融资能力保障了验证项目的推进，但在确立具备可投性的估值前，科学成功与交易经济性必须双双跑通。
    data:
      nodes:
        - id: capital
          label: $4B 累计融资额
          detail: 仅展示融资能力，并不代表在手现金余额或股权价值。
        - id: assembly
          label: 建成 SPARC
          detail: 2026 年 7 月所筹资金旨在支持 SPARC 与 ARC 工程推进。
        - id: science
          label: 验证 Q>1
          detail: 公司设定的目标节点距 2026 年 2 月约有两年。
        - id: engineering
          label: 将等离子体验证转化为电厂级验证
          detail: Q>1 是必要条件，但无法直接证实具备可售净电产出能力。
        - id: arc
          label: 完成 ARC 融资与交付
          detail: CFS 计划在 2030 年代初达成约 400 MW 装机规模，并打算自主持有首座电厂。
        - id: decision
          label: 确立进场估值
          detail: 需要价格、稀释比例、优先权利、项目经济性及退出路径证据。
    approximationNotes: 属于排序决策逻辑而非预测；各项标签完整保留公司既定目标与公开证据缺口。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV008
