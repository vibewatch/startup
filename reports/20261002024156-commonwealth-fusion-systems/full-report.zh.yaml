      - number: '7.2'
        title: 监管合规、电网接入与数据治理
        blocks:
          - type: paragraph
            body: >-
              核聚变能源的商业化落地，需应对将聚变系统区别于传统核裂变基础设施的动态演进监管框架。在美国，聚变设施受益于先例认定，即聚变电站被归入粒子加速器副产物物料框架实施监管，而非适用商业裂变反应堆许可。然而，电网接入给批发输电运营商带来了严峻的监管挑战。2026
              年 4 月，CFS 正式向 PJM Interconnection 提交了并网申请，针对其规划设于 Virginia 州 Chesterfield County Fall Line 聚变电站的 400 MWe
              ARC 电站。PJM 体系内的并网研究排队历来存在长达数年的积压、电网容量受限以及输电扩容改造成本分摊争议，这可能导致送电时间推迟至 2030 年代初的目标之后。与此同时，CFS
              必须严守地方环境安全法规、危险化学品处置标准、职业辐射剂量限值，以及管辖敏感超导与磁约束数据的联邦《出口管制法》。在数字化与商业化运营中，CFS
              对供应商分析及客户追踪实施严格的数据处理条款，并在监管执法与法律诉讼解决中保留了明确的披露权限。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR011
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR014
      - number: '7.3'
        title: 资本密集度、资金缺口与对手方集中度
        blocks:
          - type: paragraph
            body: >-
              CFS 承受着极高的资本开支强度，单靠一级市场股权融资无法走通 ARC 的完整商业化全流程。尽管继 2025 年 $863M B2 轮与 2026 年 7 月 $1B 成长轮融资后，其累计股权融资已达
              $4B，但公司管理层确认，现有可用资金仍不足以建造完整体量的 ARC 设施，该工程还需追加数十亿美元资本。早期商业承诺与供应链伙伴的高度集中进一步加剧了财务风险。CFS 与身兼产业投资人的 Google 及
              Eni 签署了覆盖 ARC 规划发电量半数以上的长期购电协议，对承诺挂钩严格投运节点的两家交易对手形成了实质性收入依赖。此外，CFS 高度依赖专业工业技术伙伴来保持工程研发节奏，包括借助 NVIDIA 获取
              Omniverse 仿真算法库，以及依托 Siemens 搭建 Xcelerator PLM 架构。核心战略伙伴之间的任何运营摩擦、成本攀升或协议取消，都将危及项目融资、稀释现有股东权益，或推迟商业并网送电时间。
            claimRefs:
              - CR009
              - CR012
              - CR013
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR009
              - CR010
              - CR012
              - CR013
      - number: '7.4'
        title: 展项
        blocks:
          - type: callout
            title: 首台套项目的资金筹措瓶颈
            body: >-
              尽管 CFS 累计成功募集了 $4B 风投及机构资本，但 CEO Bob Mumgaard 已公开表示，现有资金仍不足以支持商业 ARC 聚变电站建设。鉴于 ARC
              属于首台套聚变电站项目，商业项目贷款机构与基础设施资本方在承诺提供数十亿美元银团支持前，很可能要求 SPARC 率先完成 Q > 1 平衡点验证，这使得 CFS 面临显著的里程碑执行延误风险。
            calloutType: risk
            claimRefs:
              - CR003
              - CR009
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与建仓纪律
        blocks:
          - type: paragraph
            body: >-
              投资建议为观察（track）或继续研究（research-more），置信度中等，风险评级高，而非在未标明价格的情况下盲目买入。CFS 宣布于 2026 年 7 月完成 $1B 股权融资，累计募资达
              $4B，展现出未商业化核聚变开发商中罕见的资金筹措能力。但该证据并未披露公司估值、证券条款、股权稀释比例、清算优先权或扣除项目开支后的剩余现金。因此，累计融资额既不可视作账面可用现金，亦不可作为估值锚点。二级平台
              Forge 同样未显示成交价或投后估值，并将市场交易活跃度标注为受限。入场建仓应严格以获取投资意向书、股权结构表、资金用途对账单，以及足以补偿非此即彼的技术与项目交付风险的价格为前提。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV014
              - CV015
      - number: '8.2'
        title: 投资逻辑、反向逻辑与里程碑逻辑
        blocks:
          - type: paragraph
            body: >-
              核心投资逻辑在于，CFS 将巨额资本支持与分阶段的验证规划紧密结合：建成 SPARC、验证 Q>1，并凭此成果支撑定于 2030 年代初投运的约 400 MW（约 400 兆瓦）ARC
              电站。公司还在设计与实验流程中深度融合与 Siemens 及 NVIDIA 合作的数字孪生系统。反向逻辑同样举足轻重。CFS 解释称，Q>1
              仅衡量等离子体表现，是建造可并网商用电站的必要非充分条件；能量转换效率、电站辅助系统、工程施工及运营管理均在该里程碑之外。CFS 亦表示其计划对首台 ARC
              自行融资、建造、持有并运营，这使得执行风险与资金偿付义务高度集中于一身。SPARC 若未能达成 Q>1 或严重逾期，将直接扼杀近期最核心的科学去风险催化剂，而绝非仅仅推迟收入确认节奏。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV012
              - CV016
