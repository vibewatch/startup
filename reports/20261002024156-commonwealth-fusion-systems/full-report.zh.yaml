      - number: '3.2'
        title: 竞品规模、商业承诺与资金卡位
        blocks:
          - type: paragraph
            body: >-
              资本规模、战略合作深度与购电消纳架构，构成了核聚变开发商之间的核心商业护城河。继 2026 年 7 月完成 $1B 融资后，Commonwealth Fusion Systems 累计募资已达
              $4B，约占迄今全球私营聚变行业总融资额的 30%。这一资本实力显著超越非上市同行：Helion Energy 于 2026 年 9 月完成 $500M 的 G 轮融资，而欧洲与亚洲创业公司的累计融资规模通常低于
              $500M。CFS 将其资产负债表优势转化为机构级消纳承诺，于 2026 年 4 月成为首家向 PJM Interconnection 提交并网排队申请的核聚变开发商，用于其位于 Virginia 州
              Chesterfield County 的 Fall Line 聚变电站。关键在于，CFS 凭借与 Google（200 MW）及 Eni（$1B 协议）签署的企业购电协议（PPA），已提前锁定了 ARC 所产
              400 MWe 电力的一半以上，并得到与 Dominion Energy 的区域开发合作以及 Hyundai Motor Group 全球制造实力的支撑。相比之下，Helion 的商业验证主要依托与
              Microsoft 就规划中 50 MW Orion 电站签署的单一双边 PPA。然而竞品横向对比显示，尽管 CFS
              在资产负债表规模与承购承诺上保持领先，但单纯依靠资金体量无法完全抵御执行替代风险——倘若其他替代技术路线更早实现并网供电，或展现出更低的电站辅助系统（BOP）资本密集度，市场格局仍可能发生分化。
