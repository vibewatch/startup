            body: >-
              最核心的成熟度信号在于物理总装进度：Brandon Sorbom 称 SPARC 组装完成度约为 75%，目标是在 2027 年实现首次等离子体放电。即便 SPARC 达成 Q>1，CFS 本身亦提示称，Q
              值衡量的是等离子体产生的聚变能量与用于加热等离子体的输入能量之比，并不衡量电站消耗或发出的全部电量。因此，SPARC 验证成功虽能化解重大物理与工程集成里程碑的不确定性，但无法证明 ARC
