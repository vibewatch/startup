      - number: '6.3'
        title: 合同履约韧性、对手方集中度与消纳风险
        blocks:
          - type: paragraph
            body: >-
              Commonwealth Fusion Systems 的商业基本面呈现出极高的对手方集中度与不对称交付风险。Google 与 Eni 占据了已公布商业消纳量的全部份额，导致 CFS 的远期客户收入 100%
              集中于这两家同时兼任公司股权投资方的企业。这种“投资人兼客户”的双重身份在工程建设前期有助于统合战略利益，但若反应堆部署工期延误，将带来显著的公司治理纠纷与商业重新谈判风险。规范两份 PPA
              的核心商务条款——包括每兆瓦时行权价、调价公式、合同期限、商业运营日（COD）交付窗口，以及延期违约金或终止条款——均未公开。若 SPARC 未能在目标 2027 年实现核聚变净能量增益（Q>1），或 ARC
              建造费用突破资金储备上限，客户可能行使解约权，或转向小型裂变模块化反应堆（SMR）等替代性先进核能方案。此外，PJM Interconnection
              的监管审批周期与地方规划审批程序带来采购落地阻力，可能将首批供电交付时间推迟至 2030 年代初之后。
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU011
              - CU012
      - number: '6.4'
        title: 展项
        blocks:
          - type: callout
            title: 投资者与购电方合一的战略联动模式
            body: >-
              CFS 的获客模式具备独特的自我强化战略联动：其主要商业售电对手方 Google 与 Eni，同时也是其资产负债表上最重要的股权投资者。这一双重绑定为 CFS
              提供了传统独立发电商所欠缺的早期商业背书与耐心资本，在反应堆投运前确立起可靠的需求托底，为数十亿美元的电站融资提供坚实支撑。
            calloutType: insight
            claimRefs:
              - CU003
              - CU006
              - CU008
          - type: callout
            title: 单一里程碑风险暴露与严重的客户集中度
            body: >-
              由于 CFS 已公布商业消纳量的 100% 均集中于 Google 与 Eni，SPARC 净能量增益验证（Q>1）的任何推迟或 Fall Line
              电站的成本超支，都将危及整体商业储备管线。在缺乏公开定价条款、解约触发节点或多元化独立公用事业消纳方的情况下，若任一基石交易对手暂停履约或重新谈判远期承诺，CFS 的远期收入将面临重大脆弱性。
            calloutType: risk
            claimRefs:
              - CU008
              - CU012
              - CU013
              - CU015
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 前沿物理学机理与实际生产运维隐患
        blocks:
          - type: paragraph
            body: >-
              Commonwealth Fusion Systems 面临的核心技术敞口，在于从磁约束工程跨越至自持燃烧等离子体物理这一过程尚未得到验证。尽管公司的 20-tesla
              高温超导磁体在台架测试中展现出可行的磁场生成能力，但在科学净能量平衡（Q > 1）下运行 SPARC
              涉及全新的等离子体状态，在实机运行前无法获得充分验证。外部学术评估强调，未建模的等离子体不稳定性、热负荷排出动力学以及高能中子辐照轰击，均属于潜在的工程失效模式。在制造与运营维度，CFS 依赖其设在
              Massachusetts 州 Devens 与 California 州 Milpitas 基地对 REBCO
              超导带材及低温线圈组件进行精密制造。原型组件的工业化生产与实验室测试使人员和设施面临严重危险，包括数百万伏的高压放电、低温容器密封失效、强磁场环境、有毒铅焊料物质以及高真空密封失效。尽管 CFS 联合
              Siemens 与 NVIDIA 部署了预测性数字孪生基础设施以优化装配仿真并压缩实验周期，但在 SPARC 托卡马克实现等离子体起振与稳态热包容之前，实体原型的工程风险依然存在。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR010
