            body: >-
              公开的高管架构由创始人主导：Bob Mumgaard 为联合创始人兼 CEO，Brandon Sorbom 为联合创始人兼首席科学官，Dan Brunner 为联合创始人兼 CTO；Mitchell
              Goldstein 担任 CFO
              [CO012]。这一架构将科学叙事、融资号召力与技术执行力高度集中于少数创始成员手中。现有公开证据支持这些运营职责，但无法确定现任董事会名册、投资者保护性条款、投票控制权、接班人计划或核心管理层变动。上述信息缺口使得外界难以对正式治理结构作出可靠结论，也无法确认战略投资者是否拥有超出公开经济与商业合作之外的权利。
            claimRefs:
