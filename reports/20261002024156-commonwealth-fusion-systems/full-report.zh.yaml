  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、覆盖支出与基荷替代品
        blocks:
          - type: paragraph
            body: >-
              Commonwealth Fusion Systems（CFS）的商业目标市场本质上界定为批发电力生产与企业直接清洁电力采购，而非核聚变反应堆硬件或科研设备销售 [CM002]。CFS 将其商业 ARC
              设施设计为直接向区域输电网输出 400 MW（400 兆瓦）连续净电功率 [CM001]。该运营模式将 CFS
              定位为独立发电商与技术授权方，瞄准快速增长的全球电力需求基本盘；分析师预测显示，受电动出行、工业电气化及爆发式计算负载驱动，到 2050 年全球电力需求将扩张至原来的约两倍半
              [CM008]。该基荷电力市场中的既有替代方案包括先进裂变小型模块化反应堆（SMR）、增强型地热系统（EGS）以及配备碳捕集与封存（CCS）的天然气发电。核聚变相较这些替代方案的核心差异化价值，在于零碳排放、无长半衰期高放射性废物，以及具备不受严苛地理选址限制的高功率密度。
            claimRefs:
              - CM001
              - CM002
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
      - number: '2.2'
        title: 多维视角下的目标市场规模测算
        blocks:
          - type: paragraph
            body: >-
              测算商业核聚变的目标市场规模，需评估从近期资本支出到远期发电量的不同分析周期 [CM003]。独立市场研究机构 MarketsandMarkets 估计，全球核聚变市场规模在 2026 年为 $18.00B，到
              2031 年将以 13.4% 的复合年均增长率增至 $33.77B [CM003]。这一预测反映出公私资本加速注入，以及头部行业参与者的卡位态势；其中 CFS 与 Tokamak Energy、TAE
              Technologies、Helion 及 General Fusion 并列为全球领先企业 [CM004]。就 CFS 而言，其近期目标市场落地能力体现在与 Google 达成的里程碑式商业协议：Google
              签约承购 200 MW（200 兆瓦），恰好占 CFS 设在 Virginia 州 Chesterfield County 首座商业 ARC 设施 400 MW 输出电量的一半 [CM005,
              CM006]。剩余发电容量则规划与 Dominion Energy 合作融入区域电网 [CM010]。技术落地则依托与 NVIDIA 及 Siemens 的产业合作得以加速，部署高精度 AI
              数字孪生以压缩从设计到商业并网的工程周期 [CM014]。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM010
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM006
      - number: '2.3'
        title: 客户分群、采购路径与商业消纳
        blocks:
          - type: paragraph
            body: >-
              CFS 的 ARC 商业电站买方分群涵盖三大核心客户群体：超大规模科技运营商、受监管的批发公用事业电力公司，以及跨国能源巨头 [CM005, CM007,
              CM010]。超大规模科技企业构成推进最积极的早期采购群体，受 AI 数据中心园区 24/7 全天候无碳能源硬性指标驱动，Google 签署直接购电协议并扩大对 CFS 的股权投资即是明证
              [CM005]。受监管的电力公用事业公司构成第二类群体，以 CFS 在 Virginia 州与 Dominion Energy 的战略合作为代表，其采购依托向 PJM Interconnection
              等区域输电组织提交正式电网接入申请展开 [CM009, CM010]。跨国能源生产商构成第三类群体；意大利能源巨头 Eni 已签署一项金额超 $1B 的商业协议，承购未来商业化 ARC
              部署的电力，并联合投资反应堆开发 [CM007]。这一横跨多客群的商业吸引力提振了投资者信心，支撑 CFS 于 2026 年 7 月完成 $1B 的追加股权融资，将累计融资额推升至 $4B [CM013]。
            claimRefs:
              - CM005
              - CM007
              - CM009
              - CM010
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM007
              - CM009
              - CM010
      - number: '2.4'
        title: 采用瓶颈、技术依赖与规模化缺口
        blocks:
          - type: paragraph
            body: >-
              尽管商业售电意向达到前所未有的热度，CFS 聚变能源的大规模市场应用仍受制于关键的技术、监管与经济约束 [CM011, CM013]。在各项前提条件中，最核心的是 Massachusetts 州 Devens 的
              SPARC 示范装置运行验证 [CM011]。在 SPARC 成功实现核聚变净能量增益（Q>1）前，商业 ARC 部署无法推进；该验证须证明强场超导磁体与等离子体约束产生的能量超过加热等离子体所需的输入能量
              [CM011, CM012]。Lawrence Livermore 的 National Ignition Facility 是目前全球唯一达成 Q>1 的装置，凸显出其中蕴含的巨大物理学挑战
              [CM012]。此外，公司与 Google 及 Eni 签署的商业购电协议条款严格保密，平准化度电成本基准、电价上调上限及可用率考核罚则对外部尽调而言均未经证实 [CM015]。围绕 PJM
              Interconnection 并网排队审批，以及从示范硬件跨越至百亿美元级商业电站建设所需的资本支出，同样存在显著尽调缺口。
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM015
      - number: '2.5'
        title: 展项
        blocks:
          - type: callout
            title: 商业需求先于技术验证
            body: >-
              传统能源技术通常需要完整的电网级实际运营记录方能商业化，而 CFS 在 SPARC 达成核聚变净能量增益（Q>1）的数年之前，便已锁定提前商业购电承诺（包括 Google 的 200 MW PPA 与 Eni 的
              $1B+ 协议）。这种买方行为反映出超大规模厂商为满足 AI 算力扩张，急于锁定零碳 24/7 全天候基荷电力的迫切需求达到前所未有的程度。
            calloutType: insight
            claimRefs:
              - CM005
              - CM008
          - type: callout
            title: 远期市场规模取决于 Q>1 与 PJM 并网审批
            body: >-
              尽管市场研究模型预计到 2031 年核聚变领域规模将扩至 $33.77B，但将储备协议转化为实际商业收入的前提，依然在于 SPARC 须在 2027 年前验证物理可行性（Q>1），且 ARC 的 Virginia
              电站须完成 PJM Interconnection 批发输电接入审批。
            calloutType: risk
            claimRefs:
              - CM006
              - CM009
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 聚变替代技术路线与竞争格局
        blocks:
          - type: paragraph
            body: >-
              Commonwealth Fusion Systems
              的竞争格局涵盖三层同心对标梯队：探索替代约束路径的一级市场直接聚变开发商、机构及国家级聚变科研项目，以及由先进裂变与燃气联合循环发电构成的现有基荷电力替代方案。在商业聚变领域，CFS
              的强场托卡马克设计与各类磁约束及非磁约束路线展开直接竞逐。Helion Energy 是技术进度最为领先的非托卡马克商业聚变开发商，采用脉冲式磁惯性场反转位形（FRC），依托氘-氦-3
              燃料循环与直接感应能量转换技术。尽管 Helion 将其 50 MW 的 Orion 电站向 Microsoft 交付商业电力的目标时间定在最早 2028 年，但 CFS 联合创始人 Brandon Sorbom
              与 Helion CEO David Kirtley 在 TechCrunch Disrupt 2026
              上均强调，除等离子体物理指标外，商业跨越还须解决电站集成、持续高频脉冲以及电网同步等难题。其他私营磁约束开发商包括同样研发高温超导球形托卡马克的 Tokamak Energy，以及 Type One Energy
              等仿星器开发商；惯性约束路线则由 National Ignition Facility 在物理尺度上完成了验证。在聚变初创企业之外，CFS 的商业电站 ARC
              直接对标化石能源基荷发电与小型裂变模块化反应堆（SMR）。CFS 在设计 ARC 时明确参照美国约 2,000
              座现有天然气电站的运行形态——提供可调度、高密度、无长半衰期核废料的零碳电力；同时在燃料可获得性与安全监管负担上与 SMR 竞争，因美国监管框架将核聚变比照粒子加速器而非裂变反应堆实施监管。
