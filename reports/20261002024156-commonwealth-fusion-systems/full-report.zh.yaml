  - id: TV003
    title: 乐观、基准与悲观情景框架
    columns:
      - 情景
      - 假设条件
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - SPARC 在所述时间窗口附近达成 Q>1；ARC 成本、PPA 与项目融资达到尽调级可信度。
        - 无公开数值区间；创造价值的前提是投资条款清单定价低于独立证据支持的里程碑调整后价值。
        - 工程放大、净发电转化、施工建造与股权稀释。
        - 仅在获得 SPARC 独立测试结果以及具备可融资性的 ARC 证据后方可强化。
      - - 基准
        - SPARC 取得进展，但 Q>1 达成时点或 ARC 经济性仍存不确定性。
        - 若缺少入场价格、持股比例、稀释幅度与退出假设，则无法测算目标回报。
        - 工期延误、清算优先权积压、后续追加资本需求与流动性匮乏。
        - 与技术进展持续但非公开条款仍无法获取时的跟踪策略相契合。
      - - 悲观
        - SPARC 未能达成或大幅推迟 Q>1，或融资条款将下行风险转嫁给普通股。
        - 从公开证据无法限定下行风险边界；若缺乏保护性条款和经核验的资金需求，应避免入场。
        - 科学验证失败、资本结构重组、项目取消以及无法及时退出。
        - 因里程碑未达预期证据、不利融资条款或 ARC 交付信誉受损而触发。
    notes: 仅供定性情景分析；所留存证据库缺少公开披露的当前估值、股权结构表、经审计财务模型及独立概率测算。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV014
      - CV016
