        title: Capital and Stakeholders
        blocks:
          - type: paragraph
            body: >-
              CFS has assembled an unusually large private capital base. The disclosed sequence includes a $1.8 billion
              Series B in 2021, an $863 million Series B2 in August 2025, and $1 billion of additional equity in July
              2026, when CFS said total capital raised had reached $4 billion [CO004, CO009, CO010]. Strategic
              participation is commercially relevant: Google and Eni are both investors and future power purchasers,
              while Tiger Global, Breakthrough Energy Ventures, NVentures, Counterpoint Global, and a Japanese corporate
              consortium appear in financing disclosures [CO004, CO009, CO011]. Funding raised should not be read as
              cash available, however, because deployment, remaining commitments, debt, secondaries, liquidation
              preferences, and project-finance requirements are not disclosed.
