  - id: TR002
    title: Operational, Quality, and Scientific Risk Register
    columns:
      - Failure Mode
      - Likelihood
      - Severity
      - Mitigation Maturity
      - Residual Exposure
      - Unresolved Gap
    rows:
      - - Unpredicted Plasma Instabilities in SPARC
        - Medium
        - Critical
        - Developing
        - Failure to demonstrate net energy gain (Q > 1), delaying ARC plant commitment
        - Plasma physics behavior in unmodeled regimes cannot be verified prior to active machine operations
      - - Cryogenic and High-Voltage Testing Hazards
        - Medium
        - High
        - Established
        - Facility downtime, component destruction, and technician injury from industrial energy releases
        - Long-term cycle fatigue and thermal quench dynamics under repeated high-field pulsed operation
      - - Digital Twin Modeling Discrepancies
        - Low
        - Medium
        - Advanced
        - Simulation errors leading to rework during physical assembly of vacuum and coil structures
        - Validation gap between Omniverse virtual models and real-world high-heat plasma interactions
      - - REBCO Superconductor Tape Manufacturing Defects
        - Medium
        - High
        - Developing
        - Degraded magnetic field performance, coil hot spots, or premature magnet quench
        - Large-scale defect screening and yield consistency across hundreds of kilometers of tape
    notes: >-
      Ordered by severity and impact on core milestone achievement; mitigations reflect disclosed safety protocols and
      digital twin simulation tools.
