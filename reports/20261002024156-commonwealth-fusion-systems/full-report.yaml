chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Commonwealth Fusion Systems (CFS) was founded in 2018 as an MIT spinout and is headquartered in Devens,
              Massachusetts [CO001, CO002]. Its operating thesis is to use high-temperature superconducting magnets to
              make a smaller tokamak: SPARC is the demonstration machine intended to establish net fusion energy, while
              ARC is the planned grid-scale power plant [CO003]. This is not a current electricity-revenue business.
              Public materials describe a development sequence in which technical proof, plant engineering,
              interconnection, construction, and future power sales occur in stages. Accordingly, the most
              decision-useful present-day measures are financing capacity, execution milestones, and contracted future
              demand rather than ARR or current commercial generation.
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO009
              - CO010
              - CO011
              - CO013
              - CO014
              - CO015
      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              The public leadership roster is founder-led: Bob Mumgaard is identified as co-founder and CEO, Brandon
              Sorbom as co-founder and chief science officer, and Dan Brunner as co-founder and chief technology
              officer; Mitchell Goldstein is listed as chief financial officer [CO012]. This concentrates scientific
              narrative, fundraising credibility, and technical execution in a small founding group. The available pool
              supports those operating roles but does not establish the current board roster, investor protective
              provisions, voting control, succession planning, or material leadership changes. Those omissions prevent a
              reliable conclusion about formal governance or whether strategic investors possess rights beyond their
              disclosed economic and commercial relationships.
