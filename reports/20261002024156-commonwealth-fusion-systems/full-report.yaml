  - id: TV002
    title: Thesis and Anti-Thesis
    columns:
      - Side
      - Argument
      - Evidence state
      - What would change the view
    rows:
      - - Thesis
        - Financing capacity
        - $4B cumulative capital raised is disclosed.
        - Budget-to-completion and cash reconciliation confirm adequate runway.
      - - Thesis
        - Scientific milestone
        - CFS targets SPARC Q>1 in about two years from February 2026.
        - Independent test results demonstrate the stated plasma milestone.
      - - Thesis
        - Commercial path
        - CFS describes a roughly 400 MW ARC in the early 2030s.
        - Auditable cost, schedule, permitting, and operating plans support delivery.
      - - Anti-thesis
        - Valuation opacity
        - The latest valuation and a usable market price are not public.
        - Financing documents establish price, dilution, and preference stack.
      - - Anti-thesis
        - Proof gap after Q>1
        - CFS states Q>1 is necessary but not sufficient for saleable electricity.
        - Plant-level net-electricity and reliability evidence closes the conversion gap.
      - - Anti-thesis
        - Concentrated capital burden
        - CFS says it will finance, build, own, and operate the first ARC.
        - Committed non-recourse or risk-sharing capital reduces corporate exposure.
    notes: The rows distinguish company targets from observed disclosure gaps; no row assigns an unsupported probability.
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV006
      - CV007
      - CV008
      - CV014
  - id: TV003
    title: Bull, Base, and Bear Scenario Framework
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - SPARC reaches Q>1 near the stated horizon; ARC costs, PPAs, and financing become diligence-grade.
        - >-
          No public numeric range; value creation requires a term-sheet price below independently supported
          milestone-adjusted value.
        - Scale-up, net-electricity conversion, construction, and dilution.
        - Strengthens only after independent SPARC results and financeable ARC evidence.
      - - Base
        - SPARC progresses, but Q>1 timing or ARC economics remain uncertain.
        - No target return is calculable without entry price, ownership, dilution, and exit assumptions.
        - Schedule extension, preference overhang, follow-on capital, and weak liquidity.
        - Consistent with track while technical progress continues but private terms remain unavailable.
      - - Bear
        - SPARC misses or materially delays Q>1, or financing terms shift downside to common equity.
        - Downside cannot be bounded from public evidence; avoid entry without protective terms and verified cash needs.
        - Scientific failure, recapitalization, project cancellation, and no timely exit.
        - Triggered by failed milestone evidence, adverse financing terms, or loss of ARC delivery credibility.
    notes: >-
      Qualitative scenarios only; the retained pool lacks a disclosed current valuation, cap table, audited model, and
      independent probability estimates.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV014
      - CV016
