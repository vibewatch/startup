        - Revenue shortfall and debt financing impediment if corporate offtake commitments lapse
      - - Offtake and Commercialization Partner
        - Eni
        - Strategic investor and offtaker
        - Over $1B commercial deal and Series A/B investor
        - Shift in European corporate capital allocation away from long-duration fusion energy
        - High
