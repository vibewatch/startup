company:
  name: "Commonwealth Fusion Systems"
chapter:
  number: 6
  title: "Customers"
  summary: "Commonwealth Fusion Systems has transitioned commercial fusion from speculative science to contractual off-take, anchoring its customer base on bilateral long-term power purchase agreements (PPAs) with hyperscaler and utility partners. Commercial traction is concentrated on its planned 400 MWe ARC power station in Chesterfield County, Virginia, where Google and Eni have each contracted to purchase power—representing more than half of the plant's future output, including a landmark agreement valued at over $1 billion with Eni. However, customer revenue remains entirely pre-delivery and non-operational, leaving CFS exposed to binary milestone delivery risks, heavy counterparty concentration, and unresolved power pricing and curtailment terms."
sections:
  - id: "customer-segmentation-and-commercial-structure"
    title: "Customer Segmentation and Commercial Architecture"
    body: "Commonwealth Fusion Systems operates across three distinct buyer categories that reflect its progression from physical fusion hardware R&D to utility-scale power generation. The primary commercial segment consists of firm clean power offtakers, specifically hyperscale data center operators and global integrated energy utilities seeking round-the-clock, zero-carbon baseload electricity. Hyperscalers such as Google face urgent 24/7 carbon-free energy mandates alongside escalating power consumption from artificial intelligence infrastructure, rendering intermittent wind and solar insufficient without clean firm generation. Integrated utilities such as Eni pursue fusion offtake to establish long-term positions in next-generation baseload assets while hedging conventional fossil generation. The secondary customer segment encompasses regional grid operators and regulated transmission entities, represented by PJM Interconnection—the largest wholesale electricity market in the United States—into which CFS submitted an interconnection queue application in 2026. The tertiary customer segment comprises enterprise operations and engineering technology partners that support CFS's internal facility scaling, where vendors like TechUltra and AVEVA deploy cloud software across more than 1,000 active internal users to streamline Devens manufacturing, procurement, and asset modeling workflows."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "named-customer-commitments-and-ppa-trajectories"
    title: "Named Customer Proof, Offtake Commitments, and PPA Trajectories"
    body: "Contractual customer proof for CFS is anchored in bilateral forward power purchase agreements rather than delivered megawatt-hours. The company has formally executed long-term PPAs with two cornerstone partners: Google and Eni. In July 2025, Google executed a first-of-a-kind corporate power purchase agreement to procure 200 megawatts of clean electricity from the planned ARC facility at the Fall Line Fusion Power Station in Chesterfield County, Virginia, securing half of the facility's expected 400 MWe nameplate output. In September 2025, Italian multinational energy company Eni followed with a commercial power offtake agreement valued at over $1 billion to purchase clean fusion power from the first commercial ARC power plant. Together, these two strategic commitments account for more than 50% of the first commercial reactor's generation capacity well in advance of plant commissioning. In parallel, CFS announced strategic collaboration with regional utility Dominion Energy to coordinate local grid access and infrastructure in Virginia. Despite these landmark announcements, no power has been transmitted, and the underlying contract structures remain contingent forward commitments dependent on SPARC experimental validation and ARC completion."
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU002"
  - id: "concentration-risks-and-contractual-durability"
    title: "Contract Durability, Counterparty Concentration, and Offtake Risks"
    body: "The commercial profile of Commonwealth Fusion Systems is defined by acute counterparty concentration and asymmetric delivery risk. With Google and Eni controlling the entirety of announced commercial offtake volume, CFS exhibits 100% customer revenue concentration across two corporate counterparties who are simultaneously equity investors in the company. This dual investor-customer dynamic aligns strategic incentives during the pre-construction phase but creates significant governance and commercial renegotiation risks if reactor deployment schedules slip. Critical economic terms governing both PPAs—including strike prices per megawatt-hour, indexation formulas, contract durations, commercial operation date (COD) delivery windows, and delay damages or termination clauses—remain undisclosed. If SPARC fails to demonstrate net fusion energy (Q>1) on its targeted 2027 timeline, or if ARC construction costs exceed capital reserves, customers may exercise termination rights or seek alternative advanced nuclear options such as small modular fission reactors (SMRs). Furthermore, regulatory approval timelines through PJM Interconnection and local zoning bodies introduce procurement friction that could delay first power delivery beyond the early 2030s."
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
    tableRefs:
      - "TU003"
