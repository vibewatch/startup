callouts:
  - calloutType: "insight"
    title: "The Dual Investor-Offtaker Strategic Loop"
    body: "CFS's customer acquisition model is uniquely structured around a self-reinforcing strategic loop: its primary commercial power offtakers—Google and Eni—are also among its most significant balance-sheet equity investors. This dual alignment provides CFS with early commercial validation and patient capital that conventional independent power producers lack, establishing a credible demand floor that underwrites multi-billion-dollar plant financing before reactor operations commence."
    claimRefs:
      - "CU003"
      - "CU006"
      - "CU008"
  - calloutType: "risk"
    title: "Binary Milestone Exposure and Severe Customer Concentration"
    body: "Because 100% of CFS's announced commercial offtake is concentrated across Google and Eni, any delay in SPARC net energy demonstration (Q>1) or cost overrun at the Fall Line Station jeopardizes the entire commercial pipeline. Without published pricing terms, termination milestones, or independent merchant utility offtake diversity, CFS faces substantial revenue vulnerability if either cornerstone counterparty pauses or renegotiates its forward commitments."
    claimRefs:
      - "CU008"
      - "CU012"
      - "CU013"
      - "CU015"
