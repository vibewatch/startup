    title: "First-of-a-Kind Capital Financing Bottleneck"
    body: "While CFS has successfully amassed $4 billion in lifetime venture and institutional capital, CEO Bob Mumgaard has publicly stated that existing funds remain insufficient to finance the commercial ARC power plant. Because ARC represents a first-of-a-kind fusion power project, commercial project debt and infrastructure capital providers may demand demonstrated Q > 1 breakeven on SPARC before committing multi-billion-dollar syndicates, leaving CFS exposed to milestone execution delays."
