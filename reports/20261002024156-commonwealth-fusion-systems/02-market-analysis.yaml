callouts:
  - calloutType: "insight"
    title: "Commercial Demand Precedes Technical Demonstration"
    body: "Unlike traditional energy technologies that require completed utility-scale operational history before commercialization, CFS has secured advance commercial offtake commitments (including Google's 200 MW PPA and Eni's $1B+ agreement) years prior to achieving net fusion energy (Q>1) at SPARC. This buyer behavior reflects unprecedented urgency among hyperscalers to secure zero-carbon, 24/7 baseload electricity for AI compute expansions."
    claimRefs:
      - "CM005"
      - "CM008"
  - calloutType: "risk"
    title: "Long-Term Market Sizing Hinges on Q>1 and PJM Interconnection"
    body: "While market research models project the fusion sector expanding to $33.77 billion by 2031, commercial conversion of pipeline commitments into realized revenue remains contingent on SPARC proving physics feasibility (Q>1) by 2027 and ARC completing wholesale interconnection approvals with PJM Interconnection for its Virginia station."
    claimRefs:
      - "CM006"
      - "CM009"
      - "CM012"
