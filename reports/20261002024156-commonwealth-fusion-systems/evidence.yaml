evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board roster, ownership percentages, voting control, investor protective provisions, succession plans, and
      documented leadership changes.
    whyItMatters: >-
      Founder dependence and strategic-investor influence cannot be assessed without the formal governance and control
      structure.
    diligencePath: >-
      Request the current capitalization table, charter, investor-rights agreements, board minutes, and executive
      succession plan in the diligence data room.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Issuer-certified current headcount, revenue or run-rate, complete customer count, and a dated operating-location
      roster.
    whyItMatters: Conflicting workforce figures and absent commercial metrics prevent a reliable current scale assessment.
    diligencePath: >-
      Obtain payroll records, audited financial statements, revenue recognition schedules, customer contracts, and the
      current facilities register.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Issuer-certified valuation, cash balance, remaining capital commitments, debt and credit facilities, secondaries,
      share preferences, and financing dilution.
    whyItMatters: >-
      Funding raised is not cash available, and conflicting third-party valuation references cannot establish entry
      price or financing capacity.
    diligencePath: >-
      Review bank statements, audited cash-flow statements, debt documents, preferred-stock terms, secondary-transfer
      records, and the fully diluted capitalization table.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: contractual-transparency
    missingEvidence: >-
      Detailed pricing per megawatt-hour, escalation schedules, and minimum delivery availability penalties in the
      Google and Eni power purchase agreements.
    whyItMatters: >-
      Without disclosed PPA pricing structures, projected project-level internal rate of return (IRR) and levelized cost
      of electricity (LCOE) competitiveness against advanced fission or geothermal baseload cannot be validated.
    diligencePath: >-
      Engage CFS commercial development leadership under NDA or inspect public utility commission filings if Dominion
      Energy submits rate-recovery or offtake rider documentation.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: substation-interconnection-cost
    missingEvidence: >-
      PJM Interconnection study report specifying network upgrade costs, interconnection queue position timing, and
      transmission capacity allocations for Fall Line Station.
    whyItMatters: >-
      Interconnection queue delays in PJM regularly exceed three to five years, posing schedule risk to CFS' early 2030s
      commercial grid delivery target.
    diligencePath: >-
      Monitor PJM Interconnection publicly published planning queue records for Chesterfield County substation
      interconnection milestones.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: safety-quality-reliability
    missingEvidence: >-
      Independent safety assessments, quality certifications, security and incident records, commissioning acceptance
      criteria, and quantified SPARC or ARC reliability targets.
    whyItMatters: >-
      Component and construction progress do not establish that an integrated machine or commercial plant can operate
      safely and reliably.
    diligencePath: >-
      Request the safety case, quality-management certifications, incident log, commissioning plan, reliability model,
      and independent test reports.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE001
      - TE003
  - type: private-evidence-only
    severity: material
    topic: commercial-magnet-performance
    missingEvidence: >-
      Delivery schedules, acceptance-test results, warranties, service terms, and operating performance for external CFS
      magnet systems.
    whyItMatters: >-
      Announced partnerships do not establish repeatable product delivery, field reliability, or attractive
      technology-product economics.
    diligencePath: >-
      Review customer acceptance records, warranty terms, service-level obligations, manufacturing yields, and realized
      contract economics.
    relatedQuestionRefs:
      - QE004
    relatedTableRefs:
      - TE001
      - TE002
  - type: missing-source
    severity: material
    topic: ppa-pricing-terms
    missingEvidence: >-
      Public disclosure of strike price per MWh, inflation escalation, and contract duration for the Google and Eni
      PPAs.
    whyItMatters: >-
      Without price per MWh data, the long-term revenue run-rate and unit economics of the ARC commercial power plant
      cannot be independently audited.
    diligencePath: >-
      Review state utility commission regulatory filings (Virginia SCC), FERC filings, or corporate ESG energy
      procurement disclosures.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU001
      - TU002
  - type: private-evidence-only
    severity: material
    topic: ppa-cancellation-clauses
    missingEvidence: >-
      Specific terms regarding milestone delay liquidated damages, target COD delivery windows, and customer exit
      rights.
    whyItMatters: >-
      Failure to hit SPARC net energy gain (Q>1) or delays beyond the early 2030s could allow offtakers to terminate
      commitments without financial penalty.
    diligencePath: Request confidential customer PPA contracts during formal investor diligence and assess legal walkaway provisions.
    relatedQuestionRefs:
      - QU007
      - QU008
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: minor
    topic: commercial-offtake-pipeline
    missingEvidence: >-
      Comprehensive pipeline of prospective enterprise, hyperscaler, and utility customers currently in active bilateral
      PPA negotiations.
    whyItMatters: >-
      Validating that customer demand extends beyond early equity partners is critical to proving broader market
      adoption for a multi-gigawatt fleet.
    diligencePath: >-
      Audit CFS commercial business development pipeline, letters of intent (LOIs), and non-binding memorandums of
      understanding (MOUs).
    relatedQuestionRefs:
      - QU001
    relatedTableRefs:
      - TU001
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: Regulatory / Legal Risk Register
    missingEvidence: >-
      Comprehensive audit of all state-level environmental permits, local Chesterfield County zoning approvals, and NRC
      advanced notice of proposed rulemakings.
    whyItMatters: >-
      While federal policy treats fusion under accelerator rules, state and local transmission approvals can
      independently delay Fall Line station ground-breaking.
    diligencePath: >-
      Review Virginia State Corporation Commission docket filings and PJM regional transmission expansion planning
      committee minutes.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: valuation-disclosure
    missingEvidence: >-
