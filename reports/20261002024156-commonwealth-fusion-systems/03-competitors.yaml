  - id: "competitor-profiling-and-capital-positioning"
    title: "Competitor Scale, Commercial Commitments, and Capital Positioning"
    body: "Capital scale, strategic partnership depth, and off-take procurement structures define the primary commercial moats among competing fusion developers. Following its $1 billion financing round in July 2026, Commonwealth Fusion Systems has accumulated $4 billion in cumulative capital—representing approximately 30 percent of all capital raised across the global private fusion industry to date. This capitalization substantially outpaces private peers: Helion Energy closed its Series G round at $500 million in September 2026, while European and Asian ventures operate with cumulative capitalizations typically below $500 million. CFS has translated its balance-sheet dominance into institutional off-take commitments, becoming the first fusion developer to submit an interconnection queue application to PJM Interconnection in April 2026 for its Fall Line Fusion Power Station in Chesterfield County, Virginia. Crucially, CFS has pre-sold more than half of the 400 MWe generated by ARC under corporate power purchase agreements (PPAs) with Google (200 MW) and Eni ($1 billion agreement), bolstered by a regional development partnership with Dominion Energy and global manufacturing backing from Hyundai Motor Group. By contrast, Helion's commercial validation rests on a single bilateral PPA with Microsoft for its planned 50 MW Orion plant. However, competitor comparisons demonstrate that while CFS leads in balance-sheet scale and off-take commitments, capital volume alone does not insulate the company against execution displacement if alternative architectures achieve earlier grid delivery or lower balance-of-plant capital intensity."
    claimRefs:
      - "CP001"
      - "CP002"
