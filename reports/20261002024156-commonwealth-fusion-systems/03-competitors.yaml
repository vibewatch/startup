callouts:
  - calloutType: "insight"
    title: "Tokamak Physics Legacy as CFS's Definitive Scientific Moat"
    body: "In commercial fusion development, the deepest barrier to entry is predictability of plasma physics scaling. While peer competitors pursue unconventional magnetic or pulsed geometries that lack extensive historical validation, CFS's high-field tokamak builds upon over 150 experimental tokamaks constructed worldwide. Doubling magnetic field strength yields a sixteen-fold increase in fusion power density (scaling as B^4), enabling CFS to shrink reactor volume without entering unmapped physics territory."
    claimRefs:
      - "CP001"
      - "CP003"
      - "CP005"
  - calloutType: "risk"
    title: "Net Electricity Versus Plasma Gain: The Recirculating Power Trap"
    body: "Achieving scientific net energy gain (Q>1) at the plasma boundary is necessary but insufficient to guarantee commercial viability. Milestone 5—generating net electricity for sale onto the grid—requires net power flows to exceed all internal parasitic plant loads, including HTS magnet cryogenic cooling, radiofrequency plasma heating, and balance-of-plant auxiliary equipment. Inefficient secondary subsystems can consume all gross electrical generation, preventing positive net electricity regardless of plasma performance."
    claimRefs:
      - "CP006"
      - "CP014"
      - "CP015"
