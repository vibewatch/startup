callouts:
  - calloutType: risk
    title: Pre-Commercial Capital Scale and Unvalidated Breeding Economics
    body: >-
      Commonwealth Fusion Systems has achieved unprecedented private fundraising scale ($4.0 billion cumulative), yet it
      remains structurally exposed to binary scientific proof (SPARC Q>1) and unvalidated balance-of-plant economics.
      The global immaturity of liquid tritium blanket technology identified by EPRI represents an unquantified capex and
      licensing risk that could delay commercial ARC deployment regardless of magnet performance.
    claimRefs:
      - CI008
      - CI009
      - CI010
      - CI014
  - calloutType: insight
    title: Strategic Maturation of the Institutional Capital Stack
    body: >-
      The July 2026 $1.0 billion financing demonstrates a pivotal transition in fusion financing: broadening investor
      participation from early-stage venture capital into sovereign wealth, pension, and infrastructure investors.
      Combining long-term corporate offtake agreements with Google and Eni alongside deep infrastructure capital
      positions CFS with superior runway relative to venture-dependent fusion peers.
    claimRefs:
      - CI002
      - CI011
      - CI012
      - CI013
