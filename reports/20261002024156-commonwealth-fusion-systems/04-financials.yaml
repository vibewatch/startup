        - REBCO HTS tape supply contracts and precision assembly
        - Capital Expenditure (Construction)
        - High (reported ~80% complete as of 2026)
        - Remaining budget-to-complete and milestone overrun reserves
      - - Personnel & Specialized Engineering
        - Plasma physicists, magnet engineers, cryogenic specialists
        - Technical payroll across 1,000+ FTE workforce
        - Operating Expenditure (R&D / G&A)
        - High (headcount verified across filings and press)
        - Annualized cash compensation run-rate and equity vesting dilution
      - - Liquid Blanket & Tritium Systems
        - Lithium eutectic blanket, heat exchangers, neutron shielding
        - Specialized materials fabrication and LIBRTI program testing
        - Capital Expenditure (R&D / ARC Design)
        - Low (blanket technology immature globally)
        - Testing results from UK LIBRTI and prototype manufacturing cost models
      - - Site Infrastructure & Interconnection
        - Devens campus facilities, Fall Line site lease, substation
        - Dominion Joint Development Agreement and civil works
        - Capital Expenditure (Project Infrastructure)
        - Medium (site secured, PJM application pending)
        - Dominion JDA capital expenditure obligations and substation upgrade allocation
    notes: >-
      Cost allocation estimates derived from construction progress milestones and EPRI technical evaluations; balance of
