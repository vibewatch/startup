  topStrengths:
    - Disclosed $4 billion capital base gives CFS unusual runway for a pre-commercial fusion developer.
    - SPARC and ARC provide a coherent demonstration-to-commercialization roadmap.
    - Google and Eni combine strategic capital with future offtake validation.
    - Founder-led technical leadership keeps the core scientific and execution narrative aligned.
  topRisks:
    - SPARC Q>1 remains the key binary technical gate.
    - ARC capex, tritium/breeding, and plant-financing requirements are not yet underwritten.
    - Customer concentration in Google and Eni creates meaningful execution and renegotiation risk.
    - Valuation, cash, and financing terms remain opaque.
  unresolvedGaps:
    - SPARC net-energy probability, timeline, and operating results remain unproven.
    - ARC pre-FEED capex, schedule, and project-finance structure remain undisclosed.
    - PPA pricing, duration, remedies, and termination terms for Google and Eni are not public.
    - Current valuation, cash balance, preference stack, and fully diluted cap table are not public.
    - Current headcount and staffing trend remain inconsistent across retained public sources.
