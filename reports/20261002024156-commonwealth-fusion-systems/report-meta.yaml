companyProfile:
  summary: >-
    Commonwealth Fusion Systems is a 2018 MIT spinout building SPARC, a compact high-field tokamak intended to prove net
    fusion energy, and ARC, a planned commercial 400 MW fusion power plant in Virginia. The company has raised $4
    billion, is led by its founder group, and has secured future power-purchase commitments from Google and Eni, but it
    remains pre-commercial and still lacks disclosed valuation, cash balance, and financeable project economics.
  headquarters: Devens, Massachusetts
