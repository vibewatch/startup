chapter:
  number: 8
  title: "Valuation"
  summary: "CFS has disclosed $4 billion of cumulative capital raised, but neither the July 2026 round valuation nor a usable private-market price is public. The appropriate stance is track or research more: SPARC's Q>1 result is the key scientific gate, while entry price, security terms, ARC economics, and exit liquidity remain private-evidence gaps."
sections:
  - id: "recommendation-and-entry-discipline"
    title: "Recommendation and Entry Discipline"
    body: >-
      The recommendation is track or research more, with medium confidence and high
      risk, rather than buy at an unspecified price. CFS announced a $1 billion July
      2026 equity financing and $4 billion of cumulative capital raised, demonstrating
      unusual financing capacity for a pre-commercial fusion developer. That evidence
      does not disclose the company's valuation, security terms, ownership dilution,
      liquidation preferences, or cash remaining after program expenditures. Funding
      raised therefore cannot be treated as cash available or as a valuation proxy.
      Forge also displays no price or post-money valuation and labels market activity
      limited. Entry should remain conditional on a term sheet, cap table, use-of-funds
      reconciliation, and a price that compensates for binary technical and project
      delivery risk.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV014"
      - "CV015"
    tableRefs:
      - "TV001"
  - id: "thesis-and-anti-thesis"
    title: "Thesis, Anti-Thesis, and Milestone Logic"
    body: >-
      The thesis is that CFS has paired substantial financing with a staged proof plan:
      complete SPARC, demonstrate Q>1, and use that evidence to support a roughly
      400-megawatt ARC plant in the early 2030s. The company is also applying a Siemens
      and NVIDIA digital-twin collaboration to design and experimental workflows.
      The anti-thesis is equally material. CFS explains that Q>1 measures plasma
      performance and is necessary but not sufficient for a saleable power plant;
      conversion efficiency, plant systems, construction, and operations remain beyond
      that milestone. CFS also says it intends to finance, build, own, and operate the
      first ARC, concentrating execution and capital obligations. A missed or materially
      delayed SPARC Q>1 result would remove the principal near-term scientific
      de-risking event rather than merely shift revenue timing.
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV010"
      - "CV012"
      - "CV016"
    tableRefs:
      - "TV002"
    figureRefs:
      - "FV001"
  - id: "scenario-framework"
    title: "Bull, Base, and Bear Framework"
    body: >-
      Public evidence supports milestone scenarios, not defensible equity-value ranges.
      The bull case requires SPARC to achieve Q>1 near the company's stated horizon,
      followed by credible ARC cost, financing, and delivery evidence. The base case
      assumes continued SPARC progress but preserves uncertainty around net-electricity
      conversion and first-plant economics. The bear case is a failed or materially
      delayed Q>1 program, or financing terms that transfer too much value to senior
      securities. No scenario is assigned a numerical probability because the pool
      contains neither independent engineering probabilities nor audited project
      economics. Likewise, no target return can be calculated without an entry price,
      ownership terms, dilution model, and exit value; those are gating diligence
      inputs, not variables to estimate from cumulative funding.
    claimRefs:
      - "CV003"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV013"
      - "CV014"
      - "CV016"
    tableRefs:
      - "TV003"
  - id: "commercial-and-exit-readiness"
    title: "Commercial Signals, Exit Readiness, and Final Diligence"
    body: >-
      The ARC plan has commercial signals but not yet valuation-grade cash-flow
      evidence. CFS says Google agreed to purchase half of the first plant's power, yet
      the retained evidence does not provide pricing, duration, milestones, remedies,
      or bankability terms. Forge states that CFS has not endorsed an IPO plan and shows
      limited market activity with no displayed price; that is evidence of weak public
      exit visibility, not proof that no private liquidity exists. Final diligence
      should obtain the July 2026 financing documents, fully diluted cap table,
      preference stack, cash balance and program budget, SPARC test plan, ARC
      construction and operating model, PPA documents, and financing plan. The view
      should improve only when technical proof and transaction economics are both
      observable; financing scale alone does not close either requirement.
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV008"
      - "CV009"
      - "CV014"
      - "CV015"
