callouts:
  - calloutType: "risk"
    title: "Q>1 is necessary evidence, not a commercial-power result"
    body: >-
      CFS defines Q at the plasma boundary. A SPARC Q>1 result would be an
      important physics and integration milestone, but it would not establish
      ARC net electricity, continuous plant availability, or commercial
      operating cost.
