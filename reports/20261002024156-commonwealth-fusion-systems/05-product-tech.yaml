company:
  name: "Commonwealth Fusion Systems"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    CFS is building a staged product system: SPARC is the still-unproven Q>1
    demonstration machine, while ARC is the planned 400 MW commercial plant.
    The strongest disclosed technical asset is its 20-tesla ReBCO magnet
    capability, but whole-plant reliability, safety controls, and net-electric
    performance remain public-evidence gaps.
sections:
  - id: "product-ladder"
    title: "A Product Ladder From Demonstration to Grid Power"
    body: >-
      CFS does not yet offer operating fusion generation; its product ladder
      separates scientific demonstration, commercial generation, and enabling
      magnet technology. SPARC is intended to demonstrate plasma Q>1, whereas
      ARC is the planned plant that would convert fusion heat into electricity
      for the grid. CFS describes ARC as a 400 MW plant for the early 2030s,
      but that remains a roadmap claim rather than operating evidence.
      Alongside those assets, CFS is packaging magnet systems for Realta and
      licensing HTS cable technology to Type One Energy. This creates a
      nearer-term technology-supply surface, although the assigned evidence
      does not disclose delivered-unit economics, field reliability, or
      realized magnet-product revenue.
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE011"
      - "CE012"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"
  - id: "architecture-and-manufacturing"
    title: "High-Field Architecture and Integration Tooling"
    body: >-
      The architecture begins with ReBCO high-temperature superconductors,
      which Eni says enabled a prototype magnet to generate a 20-tesla field.
      That high-field magnet layer supports a more compact tokamak design, but
      component validation is not system validation: TechJournal reports that
      most toroidal field coils had been built and tested while work continued
      on poloidal field systems. CFS combines internal control of magnets with
      selective outsourcing of adaptable components such as vacuum vessels.
      It is also linking Siemens NX and Teamcenter data with NVIDIA Omniverse
      and OpenUSD for a SPARC digital twin. The tooling may accelerate
      simulation-to-test feedback, yet no public benchmark in the pool
      quantifies schedule reduction, defect reduction, or predictive accuracy.
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
    tableRefs:
      - "TE003"
  - id: "deployment-workflows"
    title: "Deployment and Partner Workflows"
    body: >-
      CFS serves several distinct workflows rather than one finished-product
      buyer journey. Its own scientists and engineers use SPARC to test plasma
      performance and compare experimental results with simulations. External
      fusion developers can obtain integrated magnet packages or license HTS
      cable technology instead of recreating the full magnet stack. Future
      utilities and offtakers would depend on ARC for grid electricity, but
      public commercial agreements do not demonstrate delivered generation.
      The Realta package includes cryogenics, electrical power, and structural
      supports, which indicates that CFS is productizing more than a bare coil.
      However, the reviewed sources do not provide acceptance criteria,
      warranties, service obligations, deployment lead times, or operating
      performance for those external magnet systems.
    claimRefs:
      - "CE003"
      - "CE004"
      - "CE010"
      - "CE011"
      - "CE012"
    tableRefs:
      - "TE002"
  - id: "maturity-and-diligence"
    title: "Maturity, Technical Risk, and Diligence Priorities"
    body: >-
      The most important maturity signal is physical assembly: Brandon Sorbom
      said SPARC was about 75% complete and targeting first plasma in 2027.
      Even if SPARC reaches Q>1, CFS itself cautions that Q measures fusion
      energy produced in the plasma against energy used to heat the plasma; it
      does not measure all electricity consumed or generated by a plant.
      Consequently, a successful SPARC result would retire a major physics and
      integration milestone without proving ARC net electricity, continuous
      availability, maintainability, or cost. The July 2026 financing supports
      completion of SPARC and continued ARC development, but funding is not
      technical validation. The assigned evidence also lacks an independently
      tested safety case, quality certification, incident history, and
      quantified reliability targets, so those controls should remain explicit
      diligence gaps rather than assumed strengths.
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE014"
