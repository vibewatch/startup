company:
  name: "Commonwealth Fusion Systems"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Commonwealth Fusion Systems is a 2018 MIT spinout headquartered in Devens, Massachusetts, developing the SPARC demonstration tokamak as the precursor to an ARC commercial power plant. The company says it had raised $4 billion by July 2026, but valuation, current headcount, revenue, board rights, and financing terms remain either undisclosed or inconsistent across the available public evidence."
sections:
  - id: "identity-and-operating-model"
    title: "Identity and Operating Model"
    body: "Commonwealth Fusion Systems (CFS) was founded in 2018 as an MIT spinout and is headquartered in Devens, Massachusetts [CO001, CO002]. Its operating thesis is to use high-temperature superconducting magnets to make a smaller tokamak: SPARC is the demonstration machine intended to establish net fusion energy, while ARC is the planned grid-scale power plant [CO003]. This is not a current electricity-revenue business. Public materials describe a development sequence in which technical proof, plant engineering, interconnection, construction, and future power sales occur in stages. Accordingly, the most decision-useful present-day measures are financing capacity, execution milestones, and contracted future demand rather than ARR or current commercial generation."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership and Governance"
    body: "The public leadership roster is founder-led: Bob Mumgaard is identified as co-founder and CEO, Brandon Sorbom as co-founder and chief science officer, and Dan Brunner as co-founder and chief technology officer; Mitchell Goldstein is listed as chief financial officer [CO012]. This concentrates scientific narrative, fundraising credibility, and technical execution in a small founding group. The available pool supports those operating roles but does not establish the current board roster, investor protective provisions, voting control, succession planning, or material leadership changes. Those omissions prevent a reliable conclusion about formal governance or whether strategic investors possess rights beyond their disclosed economic and commercial relationships."
    claimRefs:
      - "CO012"
    tableRefs:
      - "TO002"
  - id: "capital-and-stakeholders"
    title: "Capital and Stakeholders"
    body: "CFS has assembled an unusually large private capital base. The disclosed sequence includes a $1.8 billion Series B in 2021, an $863 million Series B2 in August 2025, and $1 billion of additional equity in July 2026, when CFS said total capital raised had reached $4 billion [CO004, CO009, CO010]. Strategic participation is commercially relevant: Google and Eni are both investors and future power purchasers, while Tiger Global, Breakthrough Energy Ventures, NVentures, Counterpoint Global, and a Japanese corporate consortium appear in financing disclosures [CO004, CO009, CO011]. Funding raised should not be read as cash available, however, because deployment, remaining commitments, debt, secondaries, liquidation preferences, and project-finance requirements are not disclosed."
    claimRefs:
      - "CO004"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO014"
      - "CO015"
    tableRefs:
      - "TO003"
  - id: "milestones-and-execution-risk"
    title: "Milestones and Execution Risk"
    body: "The milestone record shows real organizational and financing progress: SPARC construction began in 2021, the Devens campus opened in 2023, a Virginia ARC site was announced in 2024, Google signed for 200 MW in 2025, and two large financing events followed [CO005, CO006, CO007, CO008, CO009, CO010]. The timing record also requires care. A public reference says SPARC had once been targeted to begin operations in 2026 but was expected in April 2026 to turn on in 2027; CFS separately wrote in February 2026 that it aimed to reach Q>1 in about two years [CO016]. Turn-on and Q>1 are different milestones, so neither should be presented as current commercial generation."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO016"
    figureRefs:
      - "FO001"
