- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - direction
  - what would change the view
  rows:
  - - Anthropic has frontier-scale demand proof with >$47B run-rate and 500+ business customers above $1M annualized spend.
    - thesis
    - If audited or normalized figures show much lower retained revenue, the premium case weakens materially.
  - - Cloud distribution through AWS, Google, Microsoft, and Snowflake broadens reach faster than a direct-only GTM model could.
    - thesis
    - If those same channels take too much economics or reduce first-party control, distribution becomes a margin drag instead of a moat.
  - - A ~20.5x headline ARR multiple is not visibly absurd against premium AI software comps.
    - thesis
    - If scarcity multiples normalize toward Amazon-like or mature-platform levels, the current mark loses support quickly.
  - - Series H terms, dilution, and liquidation preference are still not public.
    - anti-thesis
    - Seeing the full preference stack and any ratchets could materially improve or worsen the underwrite.
  - - Capital intensity is large enough that demand alone will not determine value.
    - anti-thesis
    - A clean spend-to-revenue bridge and utilization schedule would reduce fear that compute obligations outrun monetization.
  - - Legal, procurement, and reliability issues can compress the multiple before financials catch up.
    - anti-thesis
    - Closure of active disputes, steadier service quality, and cleaner government positioning would improve confidence.
  notes: Arguments are framed around what the current price already assumes, not around whether Anthropic is a technically strong company.
  claimRefs:
  - CV002
  - CV004
  - CV006
  - CV008
  - CV011
- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - assumptions
  - valuation / return logic
  - key risks
  - probability signal
  rows:
  - - Bull
    - Anthropic converts the current run-rate into roughly $38B-$42B of durable revenue, keeps premium enterprise and coding share, and holds a 14x-16x scarcity multiple.
    - Implied valuation about $532B-$672B, or roughly 1.4x-1.8x the current verified mark before dilution.
    - Requires headline ARR to prove durable, compute to stay available, and legal/governance noise not to re-rate the multiple.
    - low-medium
  - - Base
    - Normalized durable revenue settles around $28B-$32B and the market awards about 10x-12x, closer to premium software than frontier euphoria.
    - Implied valuation about $280B-$384B, roughly flat to modest downside versus the current mark.
    - Even good execution may only hold the present valuation if net revenue and margins are less attractive than the headline suggests.
    - medium
  - - Bear
    - Net revenue equivalent is only about $20B-$24B or public comps compress toward 7x-9x because compute, legal, or procurement issues worsen.
    - Implied valuation about $140B-$216B, meaning substantial downside from the current verified mark.
    - Compression can happen without demand collapse if partner economics and obligations dominate the story.
    - medium
  notes: The scenarios use revenue-multiple logic because public evidence is too weak on profit and cash-flow conversion for a DCF-quality model.
