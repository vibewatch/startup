callouts:
- calloutType: insight
  title: Anthropic already looks like a multi-surface enterprise AI business, not a single chatbot product
  body: Official pricing pages, enterprise materials, and partner announcements show subscriptions, seats, token-priced APIs, add-on services, and major channel routes. That breadth improves revenue durability even before private segment mix is disclosed.
  claimRefs:
  - CI001
  - CI003
  - CI006
- calloutType: risk
  title: Capital intensity is visible, but true liquidity remains opaque
  body: Amazon’s filing and Anthropic’s own partnership releases show unusually large financing and compute commitments, but none of them disclose Anthropic cash on hand, burn, or runway. Public evidence therefore proves dependence on major partners more clearly than it proves self-funded durability.
  claimRefs:
  - CI001
- calloutType: recommendation
  title: Do not underwrite gross margin or runway from public evidence alone
  body: Anthropic’s public disclosures are good enough to describe pricing, channel breadth, and partner capital support, but they are not good enough to close a financial diligence case. Management data is still required for margin, cash, burn, and contract-quality questions.
  claimRefs:
  - CI001
