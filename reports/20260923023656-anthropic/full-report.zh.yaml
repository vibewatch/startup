  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算口径
        blocks:
          - type: paragraph
            body: >-
              Anthropic 的可服务市场应该从它的变现触点向外定义，而不是从整个 AI 技术栈向内框定。公开定价和平台材料显示，公司变现的是席位订阅、企业部署功能、开发者与 Agent API
              用量，以及面向高校的专门教育产品组合。这比宽泛的生成式 AI 叙事窄得多；后者还会把设备、服务器、咨询和其他基础设施层都算进去。因此，Gartner 对 2025 年终端用户支出 $644B
              的预测，可作为整体外沿包络，但不能直接当作 Anthropic 的收入池。Menlo 对 2025 年企业市场 $37B 的估计，以及对应用层 $19B 的估计，更接近真正能流向 Anthropic
              或其应用生态的预算，尽管这些数字仍偏美国企业口径，也不是公司特定口径。实际投资判断边界应包括企业知识工作席位、按量计费的编程和 Agent 工作流、全校教育协议，以及经 AWS 和 Google Cloud
              伙伴中介的 Claude 消耗。边界外应排除硬件更新、通用云基础设施，以及不能通过 Anthropic 产品或伙伴渠道变现的宽泛 AI 服务支出。即便如此，Anthropic 特定的 SAM 和 SOM
              仍是尽调问题，而不是公开事实，因为公开披露还没有给出合同金额和分部收入结构。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM001
