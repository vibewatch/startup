        - 从个人使用走向托管协作，天然适合先落地再扩张。
        - 没有公开席位数、客户到席位转化或部门扩张数据。
      - - 企业工作区
        - 买方是 CIO、安全、IT 或采购；用户是员工；付款方是企业预算负责人。
        - 销售辅助的企业包包含 SSO、SCIM、审计日志、支出控制、开票和支持 HIPAA 的套餐。
        - 让 Anthropic 能进入受监管、重视安全的买方。
        - 自助式企业与销售辅助企业之间的收入结构未披露。
      - - 直连 API / 开发者平台
        - 买方是工程或平台负责人；用户是开发者和应用；付款方是工程预算。
        - 平台页面显示按量付费、月度发票账单和承诺消费选项。
        - 从聊天席位扩展到嵌入产品的用量和更高量级消耗。
        - 公开来源未披露 API 客户数、平均支出或按群组划分的留存。
      - - 合作伙伴渠道企业
        - 买方沿用既有超大规模云或采购关系；用户是企业开发者和内部团队；付款方是云预算或合并软件预算。
        - Bedrock、Vertex AI、Microsoft Foundry、AWS Marketplace 以及基于市场平台的 Anthropic 路线都在分发 Claude。
        - 降低采购摩擦，并扩大地域和治理适配范围。
        - 渠道结构、收入分成，以及相对 Anthropic 直销的功能一致性差异未披露。
      - - 嵌入型软件供应商
        - 买方是 SaaS 厂商；用户是该厂商自己的客户；付款方是 SaaS 厂商。
        - Slack、Intercom、GitLab 和 Cox Automotive 将 Claude 嵌入面向客户的产品或工作流。
        - 形成杠杆化 B2B2B 触达，Anthropic 能间接接触终端客户。
        - 公开证据很少拆出专属 Claude 的终端客户变现。
      - - 教育与受监管机构
        - 买方是机构领导层；用户是学生、教职员工、职员或受监管知识工作者；付款方是机构预算。
        - Syracuse、NBIM 和教育解决方案页面显示大学与受监管金融采用。
        - 证明不止适配软件公司，也支撑高背书价值标杆客户。
        - 续约条款、数据驻留适配和合规映射仍部分不透明。
    notes: 细分表按买方-用户-付款方结构和分发路径划分 Anthropic 的客户群，而不是只按公司规模划分，因为公开证据显示这些细分市场的采购路径存在实质差异。
