  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 论点
      - 方向
      - 什么会改变判断
    rows:
      - - Anthropic 已拿出前沿规模的需求证据：年化收入率超过 $47B，且 500 多个企业客户的年化支出超过 $1M。
        - 正向
        - 如果审计或标准化数据表明留存收入低得多，高溢价叙事会明显削弱。
      - - 通过 AWS、Google、Microsoft 和 Snowflake 的云分发，比纯直销 GTM 更快拓宽触达。
        - 正向
        - 如果这些渠道抽走过多经济性，或削弱第一方控制权，分发就会从护城河变成利润率拖累。
      - - 与高端 AI 软件可比公司相比，约 20.5x 的表观 ARR 倍数并不明显荒唐。
        - 正向
        - 如果稀缺性倍数向 Amazon 式或成熟平台水平回归，当前估值会很快失去支撑。
      - - Series H 条款、稀释和清算优先权仍未公开。
        - 反向
        - 看到完整优先权堆栈以及任何棘轮条款，可能显著改善或恶化投资判断。
      - - 资本强度大到足以让需求不再单独决定价值。
        - 反向
        - 清晰的支出到收入桥和利用率排期，会降低算力义务跑赢变现的担忧。
      - - 法律、采购和可靠性问题可能在财务数据跟上前先压缩倍数。
        - 反向
        - 现有争议收口、服务质量更稳、政府定位更干净，都会提升信心。
    notes: 这些论点围绕当前价格已经计入什么，而不是围绕 Anthropic 技术上是否足够强。
