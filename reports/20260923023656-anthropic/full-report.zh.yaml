        - 直接竞争的前沿模型实验室
        - CNBC 报道其 2025 年 3 月估值为 $61.5B
        - 企业、开发者、编码密集团队、受监管买方
        - 编码口碑强，多云分销，公开页面上的企业控制能力异常深入
        - 具体企业合同定价和实际折扣未公开
      - - OpenAI
        - 直接竞争的前沿模型实验室 + 企业平台
        - 消费者心智的私募市场领导者；公开 API 价目表和商用/企业产品入口
        - 开发者、业务团队、广泛企业部署
        - API 覆盖广，业务数据控制强，装机基础庞大
        - 经审阅的公开抓取未暴露完整企业席位价格表
      - - Google Gemini / Workspace 与 Vertex AI
        - 既有套件厂商 + 云平台
        - 拥有 Workspace 和 Google Cloud 分发的公开既有厂商
        - 标准化使用 Workspace 的企业和云构建者
        - 捆绑生产力分发、企业数据区域、DLP 和 Vertex 控制
        - 企业定价大多需要联系销售，完全可比的 API 包也混杂在多个表面中
      - - Microsoft 365 Copilot / Azure OpenAI
        - 既有套件厂商 + 云平台
        - 拥有 Microsoft 365 和 Azure 分发的公开既有厂商
        - 标准化使用 Microsoft 的企业和 Azure 开发者
        - 嵌入式应用工作流入口、以 Microsoft Graph 为依据的上下文、Microsoft 365 内部的隐私边界
        - 公开审阅页面更强调打包和控制，而不是简单的苹果对苹果席位经济性
      - - Amazon Bedrock / Amazon Q
        - 多模型基础设施 + 助手
        - AWS 分发，多家模型提供商，Amazon Q Lite/Pro 标价
        - 以 AWS 为中心的构建者、平台团队、内部知识工作部署
        - 模型可选性、批量折扣、安全/合规姿态，以及 Amazon Q 的低入门席位价格
        - 终端用户助手品牌弱于 Claude、ChatGPT 或 Copilot
      - - OpenRouter
        - 邻近路由层
        - 通过一个 API 接入 60+ 家提供商的 300+ 个模型；按量付费额度收取 5.5% 平台费
        - 优先看重提供商可选性的开发者和团队
        - 切换快、可回退、可选择提供商，并简化多模型采购
        - 它是路由层，不是垂直整合的企业助手
      - - Mistral
        - 主权和隐私导向替代方案
        - CNBC 报道其 2025 年 9 月估值约为 $14B
        - 对欧洲敏感的企业、AI 构建者、私有部署买方
        - 可任意地点部署的姿态、数据所有权表述、隐私和企业打包
        - 公开采用份额证据远少于 Anthropic 或 OpenAI
      - - 基于开放权重模型的内部自建
        - 替代方案 / 内部自建
        - Menlo 称 2025 年仍有 24% 用例由内部自建而非采购
        - 内部 AI 工程、治理或主权需求更强的团队
        - 控制力最高、模型可选性强，私有部署灵活
        - 较购买成品更慢见效，集成负担也更高
    notes: 本表覆盖 2026 年企业买方解决 Anthropic 核心任务的主要方式：直接实验室、套件既有厂商、路由层、主权厂商和内部自建。
