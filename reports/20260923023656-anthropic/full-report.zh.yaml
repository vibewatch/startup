        - Workspace Enterprise 需联系销售；Google Cloud / Vertex 另有定价入口
        - Gemini 嵌入 Gmail、Docs、Meet、Chat、Drive；Vault、DLP、数据区域、端点管理
        - 已审阅企业页面未公开可与 Anthropic Team 或 OpenAI Business 逐项对比的价格
        - Google 即使直接模型价格不易比较，也可能靠捆绑经济性取胜
      - - Microsoft
        - 已审阅 Copilot 定价页面，但这里无法干净提取经审计的精确席位经济性；Azure OpenAI 提供按量付费、预置容量和批量定价模式
        - Copilot Chat、Word、PowerPoint、Excel、Outlook、Teams、Graph 语境锚定、Azure OpenAI 部署灵活性
        - Enterprise 席位价格和谈判条款需要直接尽调读合同
        - Microsoft 的强项更多是打包和既有客户杠杆，而非透明标价
      - - Amazon
        - Amazon Q Business Lite 每用户每月 $3；Pro 每用户每月 $20；Bedrock 模型定价按提供商和档位变化，并有批量折扣
        - 识别权限的 Q 回复、Q Apps、QuickSight 集成、Bedrock 多模型访问、护栏
        - Bedrock 总成本取决于所选模型组合、流量以及预留或批量档位
        - Amazon 是入门成本最清楚的替代方案，适合更看重可选性而非单一品牌模型的买家
      - - OpenRouter
        - 免费档、按量付费或 Enterprise；按量付费点数收取 5.5% 平台费；提供商 token 价格原价转嫁、不加价
        - 300+ 个模型、提供商路由、故障回退、Enterprise SSO/SAML、预算和支出控制
        - Enterprise 定价取决于用量和承诺；BYOK 会形成另一套费用结构
        - OpenRouter 能压低模型买家的切换成本，削弱单一供应商定价权
      - - Mistral
        - Free、Pro、Team、Enterprise 公开套餐；Team 公开标价可见；Enterprise 定制
        - 协作工作区、连接器、数据导出、域名验证、偏隐私的部署选项
        - 企业商业条款和大客户折扣未公开
        - 与其说 Mistral 是大众市场捆绑包，不如说它更适合作为主权化和部署灵活性的替代方案
    notes: 多个竞争对手的公开企业定价并不完整。未知项保持明示，不把它们归一成误导性的席位价格对比。
