      - number: '2.3'
        title: 增长驱动、采用约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              需求侧信号足以支撑市场继续扩张。Microsoft 的 2025 Work Trend Index 显示，领导者把 2025 年视为关键年份，预期 Agent 会进入战略，并面对明确的生产率—产能缺口。PwC 的
              Jobs Barometer 用工资、岗位和人均收入信号强化了这种宏观拉力，说明 AI 已经开始转化为业务价值。Anthropic
              自己的企业案例也显示，支持、提案和分析任务中有实质性工作流效率提升。但刹车力量同样重要。Deloitte 显示，即便 ROI 为正，多数实验仍难以快速规模化，监管合规和治理时间线也已成为硬约束。Stack
              Overflow 的 2025 开发者调查在从业者层面显示了同样张力：使用率高，但信任度低，部署型用例仍被回避，Agent 准确性和隐私担忧很普遍。EU AI Act、NIST AI RMF 和 OECD
              问责框架都指向同一方向：后果更高的使用场景，需要比早期生产力试点更多的文档、监控、监督和信任建设。竞争仍很激烈。放到估值上，这意味着 Anthropic
              受益于真实市场拉力和多条预算路径，但投资判断应因试点转生产的速度偏慢、以及缺少可拆出干净 SAM 或 SOM 的公开分部经济性而打折。
