      - number: '1.3'
        title: 资本基础、伙伴分发与公开规模信号
        blocks:
          - type: paragraph
            body: >-
              公开融资和合作证据把 Anthropic 明确放在后期私人公司阵营。公司在 2025 年 3 月正式披露 $3.5B Series E 轮，投后估值 $61.5B；TechCrunch 则引用
              Crunchbase 称累计融资约 $18.2B。Amazon 不只是财务投资人：Anthropic 和 Amazon 都表示，在 2023 年 9 月合作下，AWS 成为 Anthropic
              关键任务工作负载的主要云服务商；Amazon 只持有少数股权，却通过 Bedrock 分发和芯片协作获得重大商业相关性。公开证据也指向 Google 同时是重要支持方和通过 Vertex AI 分发的伙伴。GTM
              方面，Anthropic 官方材料显示 Claude 既直接分发，也通过 Team 和 Enterprise 计划、Amazon Bedrock、Zoom 集成，以及 Snowflake
              的数据云触达客户。规模信号强但不均衡：Reuters 2026 年 4 月报道称 Anthropic 可能已经缩小了与 OpenAI 的收入差距；但经审计收入、客户数、员工数和一张对齐后的股权结构图仍未公开。
            claimRefs:
              - CO001
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
      - number: '1.4'
        title: 里程碑、监管审视与证据缺口
        blocks:
          - type: paragraph
            body: >-
              Anthropic 的公开时间线已经足够密集，足以影响后续章节。记录从 2021 年 Series A 和公司公开亮相开始，经过 2023 年 Long-Term Benefit Trust 设立和 Amazon
              合作，再到 2024 年 Claude 3 发布和 Mike Krieger 入职，并延伸到 2025–2026 年事件：FTC 公开审视云服务商合作、Series E 融资、Snowflake
              分发扩张、印度办公室建设，以及 Vas Narasimhan 董事任命。公开证据也在这里开始变得不完整。FTC 的调查和员工报告明确提示，与 Anthropic
              有关的安排存在锁定、切换成本，以及获取敏感技术信息等风险。CourtListener 也显示 Bartz v. Anthropic PBC
              的版权诉讼仍在进行。与此同时，几项公司概览里的标准指标仍无法从公开材料解决：准确员工数、已核验的当前客户数，以及包含 Google 和其他投资人持股比例的一张完整股权结构表。这些缺口不削弱 Anthropic
              作为领先前沿 AI 公司的地位，但确实挡住了更干净的投资判断。
            claimRefs:
              - CO001
