          - type: paragraph
            body: >-
              以私人 AI 公司标准看，Anthropic 的客户案例研究异常具体，最好的案例远超 Logo 幻灯片。Lyft 称，其通过 Amazon Bedrock 部署的 Claude 驱动客服助手，把平均解决时间缩短
              87%，现在每天解决数千个请求。GitLab 把 Claude 定位为 GitLab Duo Agent Platform 的默认模型，并继承既有 DevSecOps 技术栈的合规和审计控制。Slack 称，由
              Claude 驱动的搜索、摘要和回顾在数十亿条消息和文件上运行，为平均用户每周节省 97 分钟。HubSpot 报告生产率最高提升 40%，复杂技术排障从三到五天降至不到一小时。Syracuse
              University 从实验走向全校推广，向每位学生、教职工提供 Claude，并报告授权用户中每周活跃使用率为 80–90%，学生和员工活动强劲增长。Delivery Hero 展示了另一种证明：Claude
              嵌入工程工作流，每天合并 100+ 个 pull request，中央工程 LiteLLM 请求约 95% 流向 Claude。Intercom 和 Cox Automotive 把这种模式延伸到 B2B2B
              场景，Anthropic 的有效触达也包括它们的客户。结果是，公司在支持、软件交付、协作、分析、教育和受监管金融上形成了可信的生产使用记录。
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU009
              - CU010
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU012
      - number: '6.3'
        title: 耐久度与扩张：Anthropic 有多条落地并扩张路径，但留存、集中度和锁定证据仍弱
        blocks:
          - type: paragraph
            body: >-
              GTM 叙事最强之处在于扩张触点，而不是披露的续约经济性。Anthropic 可以通过直接 App 计划、直接 API 合同、超大云厂商渠道和 marketplace
              采购路径落地客户，然后通过更多席位、更深治理控制、开发者工作流，或消耗既有 Anthropic 承诺的伙伴工具扩张。AWS Marketplace 可用性、AWS 与 Vertex 路由，以及 Cox
              Automotive 的 Bedrock 部署，都支撑这种扩张叙事。同时，公开证据提醒不能假设强锁定。Harvey 的公开材料强调按任务严格评估模型，而不是给每个工作流一个永久默认模型。Delivery Hero
              使用 Vertex AI 和 LiteLLM，一部分原因就是保留模型选择并避免采购瓶颈。Bedrock 客户也拿不到完整的一方 Anthropic
              工具栈，因此伙伴渠道增长可以提升触达，同时降低与直接平台的功能一致性。最大未解问题是耐久度。公开来源没有披露
              NRR、GRR、流失、合同期限、队列留存或头部客户集中度。采购摩擦也可见：更高支出上限需要销售介入，Priority Tier 正常运行时间需要承诺，部分买方仍需尽调区域工作区可用性，公开状态页也显示 4 月下旬
              claude.ai、API、MCP apps 和 Claude Code 反复出现事件。因此，本章结论在采用和可背调性上偏正面，但前提是对续约、大客户经济性和渠道依赖做直接尽调。
            claimRefs:
              - CU001
          - type: table
            tableRef: TU003
            claimRefs:
              - CU011
              - CU012
      - number: '6.4'
        title: 图表
        blocks:
          - type: callout
            title: 公开客户证明明显强于只列 Logo 的营销
            body: Anthropic 最好的客户证据给出了高管、工作流、渠道和测量结果。这让客户叙事比典型只列 Logo 的前沿模型供应商更容易做背调。
            calloutType: strength
            claimRefs:
              - CU011
              - CU012
          - type: callout
            title: 留存和集中度是本章最大盲点
            body: 即使案例研究很强，也无法回答 Anthropic 是否能盈利续约、高效扩张，或是否过度依赖少数客户或伙伴渠道。
            calloutType: risk
            claimRefs:
              - CU001
          - type: callout
            title: 渠道宽度帮助采用，但削弱锁定假设
            body: 超大云厂商渠道和 Marketplace 伙伴扩大触达；Harvey 和 Delivery Hero 等客户则显示，Anthropic 可以赢得工作负载份额，却不拥有完整工作流或合同。
            calloutType: insight
            claimRefs:
              - CU001
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 最高风险栈：算力紧张、可靠性退化和进行中的诉讼是残余暴露中最高的部分
        blocks:
          - type: paragraph
            body: >-
              Anthropic 已为前沿模型风险建立了可见缓释：Responsible Scaling
              Policy、受控发布、公开状态页、法律使用控制和多云分发；但公开记录仍指向一个集中的最高风险栈。最清晰的近期运营风险，是使用增长正在超过服务质量。Anthropic 自己 2026 年 4 月的 Amazon
              算力文章称，高峰时段增长已经拉紧 Free、Pro、Max 和 Team 用户的基础设施；状态页记录了 4 月下旬多次事件，横跨 Claude.ai、API 和 Claude Code。Fortune
              随后补充了一个更伤害性的细节：持续数周的 Claude Code 下滑不只是容量问题，也是由三起内部工程错误导致的执行问题。与此同时，法律和政策暴露仍在进行。Bartz 和解以 $1.5B
              成本解决了一起以盗版为中心的作者案件，但 Concord 出版商案卷到 2026 年 4 月下旬仍活跃，Defense Department
              的供应链风险争议也显示，政府渠道可能很快被政治化。结论不是投资逻辑已经破裂，而是这家公司增长最快的产品仍在制造新的法律、可靠性和治理触点，其速度快于公开披露关闭这些问题的速度。
            claimRefs:
              - CR001
              - CR003
              - CR009
              - CR011
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.2'
        title: 法律、监管与安全姿态：缓释真实存在，但隐私、版权和两用问题仍未关闭
        blocks:
          - type: paragraph
            body: >-
              Anthropic 的安全和治理姿态比大多数同行更明确。公司公开把部署锚定在 ASL 阈值上，表示 Responsible Scaling Policy 的重大变更在咨询 Long-Term Benefit
              Trust 后需要董事会批准，并披露一种公益治理模型：Trust 可在四年内选出董事会多数席位。这些是真实缓释，但不会抹掉残余法律和政策风险。Anthropic
              的隐私政策仍称，除非用户选择退出，公司会用用户输入和输出来训练；即便已退出的内容，也可用于安全审查或显式报告。这给企业买方带来持续的隐私、采购和司法辖区尽调问题。版权方面，Bartz
              和解厘清了一个边界：Anthropic 为盗版式收集行为付出了最高的即时成本，但它没有消除活跃出版商诉讼带来的暴露。安全方面，Anthropic 透明度中心把取舍说得很清楚：Mythos Preview
              被有意加门槛，因为零日发现天然具有两用性；同一个透明度中心仍把评测感知和过度主动的模型行为作为活跃研究问题讨论，而不是已解决问题。
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR006
              - CR007
