              Anthropic 关键任务工作负载和未来模型开发的主要云服务商；Anthropic 2025 年 11 月的 Microsoft-NVIDIA 公告则称，公司承诺采购 $30B Azure
              算力容量，并签约额外最高一吉瓦容量。同一发布还加入最高 $10B NVIDIA 投资和最高 $5B Microsoft 投资，同时仍称 Amazon 是 Anthropic
              的主要云服务商和训练伙伴。最重要的硬证据来自 Amazon 的 2025 年一季度 10-Q。Amazon 披露，2023 年有一张 $1.25B Anthropic 可转换票据，2024 年有第二张
              $2.75B 票据，2024 年末有第三张 $1.3B 票据，并有一笔须在 2025 年四季度前履行的 $2.7B 进一步承诺。它还披露了这些票据部分转换为无投票权优先股、重分类产生约 $3.3B 收益，以及截至
              2025 年 3 月 31 日票据和优先股合计公允价值估计为 $13.8B。再加上 Anthropic 自己关于 Project Glasswing 和 ASL-3
