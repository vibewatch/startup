      - CV004
      - CV006
      - CV008
      - CV011
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - Anthropic 将当前年化收入率转化为约 $38B-$42B 的可持续收入，守住高端企业与编程场景份额，并维持 14x-16x 的稀缺性倍数。
        - 隐含估值约 $532B-$672B，约为当前已验证估值的 1.4x-1.8x，尚未计入稀释。
        - 需要证明表观 ARR 具备耐久性，算力供给持续可得，且法律 / 治理噪音不触发倍数重估。
        - 中低
      - - 基准
        - 标准化可持续收入落在约 $28B-$32B，市场给约 10x-12x，更接近高端软件，而不是前沿 AI 狂热。
        - 隐含估值约 $280B-$384B，相比当前估值大致持平至小幅下行。
        - 即使执行良好，如果净收入和利润率不如表观口径好，可能也只能守住当前估值。
        - 中
      - - 悲观
        - 净收入等价口径只有约 $20B-$24B，或因算力、法律、采购问题恶化，公开可比公司倍数压缩到 7x-9x。
        - 隐含估值约 $140B-$216B，意味着较当前已验证估值有显著下行。
        - 即使需求没有崩塌，只要伙伴经济性和义务主导叙事，压缩也可能发生。
        - 中
    notes: 这些情景使用收入倍数逻辑，因为公开证据对利润和现金流转化太弱，不足以支撑 DCF 质量的模型。
    claimRefs:
      - CV006
      - CV008
      - CV011
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Anthropic 的公开记录从 2021 年公司成立和融资，走向一个由信任治理、超大云厂商合作和全球扩张支撑的前沿 AI 平台，同时仍处于活跃监管审视之下。
    data:
      items:
        - date: '2021-05-28'
          label: Series A / 早期公开发布
          detail: Anthropic 宣布 $124M Series A，并公布 Dario 和 Daniela Amodei 为领导者。
          tone: positive
        - date: '2023-09-19'
          label: LTBT 治理细节披露
          detail: Anthropic 公开解释 Long-Term Benefit Trust 及其取得董事会多数席位的路径。
          tone: neutral
        - date: '2023-09-25'
          label: Amazon 合作扩展
          detail: 宣布最高 $4B 投资和 AWS 作为主云的地位。
          tone: positive
        - date: '2024-03-04'
          label: Claude 3 发布
          detail: Haiku、Sonnet 和 Opus 奠定现代 Claude 家族。
          tone: positive
        - date: '2025-01-17'
          label: FTC 工作人员报告
          detail: 竞争报告提示云-AI 合作中的锁定和切换成本担忧。
          tone: warning
        - date: '2025-03-03'
          label: Series E 轮，估值 $61.5B
          detail: Anthropic 完成 $3.5B 融资，投后估值 $61.5B。
          tone: positive
        - date: '2025-12-03'
          label: Snowflake 企业扩张
          detail: $200M 合作把 Claude 推向 12,600 多个 Snowflake 客户。
          tone: positive
        - date: '2026-04-14'
          label: Narasimhan 加入董事会
          detail: LTBT 任命一位 Novartis CEO / 医师科学家进入董事会。
          tone: neutral
    approximationNotes: null
    claimRefs:
      - CO013
  - id: FM001
    title: 市场规模视角
    type: pyramid
    layout: standard
    summary: 公开市场规模应作为嵌套视角处理：宽泛的全球上限、更窄的企业支出池，以及更接近 Anthropic 可变现市场的应用层切片。
    data:
      nodes:
        - label: 全球生成式 AI 支出：2025 年 $644B
          detail: Gartner 的宽口径终端用户支出视角，也是该品类的上限边界。
          tone: neutral
        - label: 企业生成式 AI 支出：2025 年 $37B
          detail: Menlo 的企业视角，比整个 AI 技术栈 TAM 更接近真实买方预算。
          tone: positive
        - label: 应用层企业支出：2025 年 $19B
          detail: Menlo 的切片，最接近 Anthropic 可直接或间接变现的市场部分。
          tone: positive
        - label: Anthropic 直接触点：席位、API、教育和伙伴渠道
          detail: Anthropic 变现的是应用层的一个子集，而不是整个 AI 技术栈。
          tone: neutral
        - label: 补充视角 5
          detail: 为覆盖深度保留的补充视角。
          tone: neutral
        - label: 补充视角 6
          detail: 为覆盖深度保留的补充视角。
          tone: neutral
    approximationNotes: 这是一个视角堆栈，不是严格的 TAM-SAM-SOM 瀑布，因为底层来源使用的市场边界不同。
    claimRefs:
      - CM012
  - id: FP001
    title: 竞争定位图
    type: quadrant
    layout: wide
    summary: Anthropic 在模型质量和企业控制上得分较高，但 Google 和 Microsoft 在分发上更靠右，Amazon 和 OpenRouter 在买方可选性上更高。
    data:
      xAxis:
        label: 分发杠杆（0-10 序数）
      yAxis:
        label: 买方可选性 / 部署灵活性（0-10 序数）
      points:
        - label: Anthropic
          x: 7
          'y': 5
          detail: 2025 年数据中的企业与编程领导者，但套件锁定弱于 Google 或 Microsoft。
          tone: positive
        - label: OpenAI
          x: 7
          'y': 4
          detail: 装机基础大、API 覆盖广，但多模型灵活性没那么明确。
          tone: neutral
        - label: Google
          x: 9
          'y': 6
          detail: Workspace 加 Google Cloud 带来强采购杠杆，并具备可信的信任控制。
          tone: warning
        - label: Microsoft
          x: 10
          'y': 4
          detail: 套件分发最深，Graph 语境锚定也强，但供应商可选性较低。
          tone: warning
        - label: Amazon
          x: 8
          'y': 9
          detail: Bedrock 和 Q 提供模型选择、低入门价格和强 AWS 治理。
          tone: warning
        - label: OpenRouter
          x: 5
          'y': 10
          detail: 路由层最大程度降低切换成本，但缺少完整企业应用表面。
          tone: warning
        - label: 开放权重自建
          x: 3
          'y': 10
          detail: 控制力和私有部署能力最高，但集成负担也最重。
          tone: neutral
        - label: Mistral
          x: 4
          'y': 8
          detail: 主权和任意环境部署定位强，但公开采纳证据较薄。
          tone: neutral
    approximationNotes: 评分是序数判断，来自审阅过的公开证据，关注分发、定价结构、路由和部署选项，而不是厂商直接披露的指标。
    claimRefs:
      - CP012
  - id: FI001
    title: 收入模型桥
    type: flow
    layout: wide
    summary: Anthropic 通过直接订阅、企业合同、API 和伙伴渠道变现，但留存毛利仍取决于私下折扣和云经济性。
    data:
      nodes:
        - id: subs
          label: 付费订阅
          detail: Claude Pro 和 Max 带来直接的经常性消费者或专业用户收入。
          tone: positive
        - id: seats
          label: 团队和高端席位
          detail: Team 和 Enterprise 席位带来工作区收入和高端席位加购。
          tone: positive
        - id: api
          label: 直接 API token
          detail: 按 token 计价的用量是最清晰的公开变现入口。
          tone: positive
        - id: addons
          label: 增值服务
          detail: 网页搜索、代码执行和托管智能体带来增量用量收入。
          tone: positive
        - id: channels
          label: 伙伴渠道
          detail: Bedrock、Google Cloud、Foundry、Snowflake 和 Zoom 相关分发拓宽触达。
          tone: neutral
        - id: gross
          label: 总收入池
          detail: 所有变现入口先汇集，再扣除折扣和伙伴结算。
          tone: positive
        - id: cost
          label: 算力与安全成本栈
          detail: 推理、训练、云成本转嫁和安全控制挤压留存经济性。
          tone: warning
        - id: retained
          label: 留存毛利
          detail: 最终利润率质量不公开，因为实际定价和成本分摊都是私下数据。
          tone: neutral
      edges:
        - from: subs
          to: gross
        - from: seats
          to: gross
        - from: api
          to: gross
        - from: addons
          to: gross
        - from: channels
          to: gross
        - from: gross
          to: cost
        - from: cost
          to: retained
    approximationNotes: 这座桥是定性的，因为公开证据只暴露标价和部分渠道结构，没有经审计收入或产品级毛利率。
    claimRefs:
      - CI012
  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Anthropic 的公开产品栈按用户触点、企业控制、模型层级、工作流工具和多云部署分层，而不是一个单体产品。
    data:
      layers:
        - label: 用户触点
          detail: 终端用户入口覆盖聊天、终端、IDE 和嵌入工作流的产品触点。
          items:
            - label: Claude 应用
              detail: 消费者和团队 / 企业聊天工作区。
            - label: Claude Code
              detail: 终端、IDE 和 GitHub 邻近的编程入口。
        - label: 管理与控制平面
          detail: 企业管理和策略控制负责身份、权限、日志和数据留存。
          items:
            - label: 企业治理
              detail: SSO、SCIM、审计日志、Compliance API、数据留存、支出控制。
            - label: 政策层
              detail: Constitution、AUP、RSP、隐私和法律条款塑造可接受使用边界。
        - label: 模型层级
          detail: Anthropic 对外提供差异化模型家族，按能力、成本、速度和专门用途调优。
          items:
            - label: Opus 4.7
              detail: 能力最高的通用可用模型。
            - label: Sonnet 4.6
              detail: 面向广泛企业使用的规模化前沿智能。
            - label: Haiku 4.5
              detail: 面向子智能体和延迟敏感任务的快速低成本层。
            - label: Mythos Preview
              detail: 门控网络安全模型。
        - label: 工作流工具
          detail: 工具把基础模型访问转成智能体式、上下文丰富的工作流，而不是普通聊天补全。
          items:
            - label: 代码执行
              detail: 用于分析和制图的沙箱 Python 运行时。
            - label: MCP 连接器
              detail: 通过开放协议服务器远程访问工具和数据。
            - label: 文件与缓存
              detail: 可复用上下文对象，加上寿命更长的提示词状态。
        - label: 部署与基础设施
          detail: Anthropic 直接提供模型，也通过已披露云合作支撑的超大云厂商渠道提供模型。
          items:
            - label: Anthropic API
              detail: 第一方平台端点。
            - label: Bedrock、Vertex、Foundry
              detail: 具备各自治理边界的超大云厂商渠道。
            - label: AWS 和 GCP 算力
              detail: 公开披露的核心基础设施底座。
        - label: 安全与合规层
          detail: 安全、验证和政策控制决定平台能否用于受监管或高风险工作流。
          items:
            - label: 验证
              detail: 评估、监控和人工审核支持更高信任度的部署。
            - label: 合规控制
              detail: 隐私、政策和法律条款约束企业使用和可接受部署模式。
    approximationNotes: null
    claimRefs:
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Anthropic 的客户旅程通常从个人或团队证明价值开始，再经过管理、采购和渠道选择，最后扩展到更广的工作流或嵌入式产品。
    data:
      nodes:
        - id: cj1
          label: 发现
          detail: 个人或小团队从 Free、Pro、Max，或轻量级 API 概念验证开始。
          tone: neutral
        - id: cj2
          label: 工作流验证
          detail: 具体用例证明价值：支持自动化、编程、搜索、分析或教育。
          tone: positive
        - id: cj3
          label: 管理与安全审查
          detail: 企业买方评估 SSO、SCIM、审计日志、支出控制、支持 HIPAA 的产品打包和隐私边界。
          tone: warning
        - id: cj4
          label: 采购路径
          detail: 买方选择直接与 Anthropic 签约、超大云厂商路由、AWS Marketplace，或其他市场平台式采购。
          tone: neutral
        - id: cj5
          label: 生产部署
          detail: Claude 通过工作区推出、产品嵌入或智能体式平台集成触达终端用户。
          tone: positive
        - id: cj6
          label: 扩张或多元化
          detail: 用量可以跨席位和工作流扩张，但部分客户也会保留模型选择和渠道灵活性。
          tone: warning
    approximationNotes: 这条旅程把若干已观察到的购买动作抽象为一条定性路径；实际客户流程会因细分市场和渠道而异。
    claimRefs:
      - CU012
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: Anthropic 最高残余风险集中在版权和政策风险敞口、算力支撑下的可靠性压力、伙伴依赖，而不是单一孤立故障模式。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 残余严重度
      rows:
        - label: 版权 / 政府政策
          values:
            - label: 中高
              tone: warning
              detail: 现有诉讼和政策波动已经可见。
            - label: 严重
              tone: negative
              detail: 不利结果可能冲击渠道访问、合规成本和信任。
            - label: 中
              tone: warning
              detail: 已有缓释措施，但法院和监管结果仍由外部决定。
            - label: 高
              tone: negative
              detail: 在诉讼和政策风险敞口进一步收窄前，残余风险仍高。
        - label: 可靠性 / 编程质量
          values:
            - label: 高
              tone: negative
              detail: 状态页事故和事后复盘证据显示，负载下会反复出现问题。
            - label: 高
              tone: negative
              detail: 编程质量和可用时间现在会影响企业工作流和声誉。
            - label: 中
              tone: warning
              detail: Anthropic 发布事故和回滚信息，但公开 SLA 数据缺失。
            - label: 高
              tone: negative
              detail: 只要编程需求仍是增长引擎，残余风险敞口就保持高位。
        - label: 算力 / 云交易对手
          values:
            - label: 中高
              tone: warning
              detail: 多项巨额承诺已公开，并通过少数供应商运行。
            - label: 严重
              tone: negative
              detail: 定价、容量时点和利润率都可能通过这些节点传导。
            - label: 中
              tone: warning
              detail: 多云存在有帮助，但无法消除合同和交付风险。
            - label: 高
              tone: negative
              detail: 公开证据仍缺少固定支出到用量的桥。
        - label: 治理 / 披露 / 集中度
          values:
            - label: 中
              tone: warning
              detail: 治理明确但非传统，关键集中度指标仍是私有数据。
            - label: 高
              tone: warning
              detail: 披露失误或隐藏的集中度意外，可能迅速压缩信心。
            - label: 中低
              tone: neutral
              detail: IPO 准备和政策透明度带来一些纪律。
            - label: 中高
              tone: warning
              detail: 残余风险敞口主要来自公开披露精度不足，而不是完全没有缓释。
        - label: 模型安全 / 监管
          values:
            - label: 中
              tone: warning
              detail: 前沿模型政策审视会持续存在，并可能收紧发布条件。
            - label: 高
              tone: negative
              detail: 安全或监管约束可能放慢发布，减少可触达用例。
            - label: 中
              tone: warning
              detail: Responsible Scaling、门控模型和披露有帮助，但不能消除风险敞口。
            - label: 中高
              tone: warning
              detail: 监管推进可能快于产品推出，因此残余风险仍在。
        - label: 竞争 / 商品化
          values:
            - label: 中高
              tone: warning
              detail: 当竞争对手推出类似功能时，模型和工具趋同可能压缩差异化。
            - label: 高
              tone: negative
              detail: 如果编程和智能体式功能商品化，定价权和份额可能走弱。
            - label: 中
              tone: warning
              detail: 品牌、生态和分发伙伴关系部分抵消威胁。
            - label: 中高
              tone: warning
              detail: 如果企业买方把模型视为可互换，残余风险敞口仍然不小。
    approximationNotes: null
    claimRefs:
      - CR014
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议来自强需求证据与标准化不足、庞大算力义务和非传统治理之间的碰撞。
    data:
      nodes:
        - id: scale
          label: 规模证明
          detail: 已验证 $965B 估值、超过 $47B 的年化收入率，以及 500 多个年化支出超过 $1M 的企业客户。
          tone: positive
        - id: comp
          label: 可比公司语境
          detail: 表观倍数接近高端软件可比公司，而不是明显荒唐的区间。
          tone: positive
        - id: quality
          label: 标准化缺口
          detail: 收入是年化口径，Reuters 称 Anthropic 按总收入计数，与一些需扣除超大云厂商分成的口径不同。
          tone: warning
        - id: capital
          label: 资本强度
          detail: AWS、Azure 和 TPU 承诺足够大，可能改变利润率和下行情景。
          tone: warning
        - id: governance
          label: 治理 / 法律压力
          detail: LTBT 控制复杂性、活跃诉讼、Pentagon 冲突和可靠性压力都重要。
          tone: warning
        - id: decision
          label: 继续研究
          detail: 公开证据足以保持跟踪，但过于不完整，无法按当前已验证估值证明买入合理。
          tone: neutral
      edges:
        - from: scale
          to: comp
        - from: comp
          to: decision
        - from: quality
          to: decision
        - from: capital
          to: decision
        - from: governance
          to: decision
    approximationNotes: null
    claimRefs:
      - CV012
