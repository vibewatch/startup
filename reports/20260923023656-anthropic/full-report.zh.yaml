chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与运营模式
        blocks:
          - type: paragraph
            body: >-
              Anthropic 官方公司页面把公司定位为一家 AI 安全与研究公司，目标是构建可靠、可解释、可控的 AI 系统。这个身份不只是品牌叙事：同一批官方材料把 Anthropic
              的使命连到公益公司形态、安全优先的研究议程，以及一个通过直接产品和伙伴渠道分发 Claude 的商业模式。公开产品和商业方案显示，公司并不只押注单一消费者 App，而是靠 Claude 订阅、企业席位、API
              访问，以及嵌入主要云和工作流平台的分发变现。官方公司页面没有披露街道地址，但 Anthropic 自己的招聘页面和研究文章反复把运营锚定在 San
              Francisco；对本章而言，这是最有支撑的主要办公地点。公开地理证据也显示，公司从这个基地向 Tokyo 和 Bengaluru 扩张，以支撑国际化规模化。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO009
              - CO010
              - CO012
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO008
      - number: '1.2'
        title: 治理、领导层与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              治理是尽调里最有辨识度的变量之一。Anthropic 表示自己是 Public Benefit Corporation，其董事会由股东和 Long-Term Benefit Trust 共同选举。LTBT
              页面进一步说明，该信托是一个独立机构，由五名没有财务利益冲突的成员组成，有权选择并罢免一部分董事；这部分席位计划随时间成为多数。这个结构重要，是因为它给 Anthropic
              增加了一层使命治理；这层安排与超大规模融资、战略云依赖放在一起并不自然，却是有意设计。当前公开材料把 Dario Amodei 和 Daniela Amodei 标识为核心创始高管；Mike Krieger
              2024 年加入担任 Chief Product Officer，补上了资深产品规模化能力，Vas Narasimhan 2026 年进入董事会，则带来受监管行业经验。即便有这些补强，公开记录仍显示
              Anthropic 对 Amodei 二人与少数领导者有明显关键人物依赖；这些人连接研究可信度、融资、公共政策和商业执行。
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
