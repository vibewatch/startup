  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接实验室、捆绑式在位者、路由层与内部自建替代
        blocks:
          - type: paragraph
            body: >-
              Anthropic 不是在一个买方只在 Claude 和另一家前沿模型实验室之间二选一的市场里销售。现实替代集合已经分层。直接模型实验室竞争仍然重要，尤其是与 OpenAI 的竞争；但大型企业买方也可以留在
              Google 或 Microsoft 的既有生产力套件里，通过 Amazon Bedrock、OpenRouter
              等基础设施和路由层采购，或者在治理和控制比购买单一供应商完整产品面更重要时，基于开放权重技术栈内部自建。公开证据显示 Anthropic 自己也参与了这个更宽的格局：Claude 既直接销售，也通过 Amazon
              Bedrock 和 Google Cloud Vertex AI 销售；Claude Code 则把产品延伸到开发者工作流。Menlo 2025
              年企业数据是重要背景，因为它显示内部自建仍然存在，但不再是主流路径：76% 的 AI 用例现在是采购而非内部构建，只有 13% 的企业日常工作负载使用开源模型。这意味着 Anthropic
              受益于当下买方对采购工具的偏好，但也面对一个更流动的市场；买方可以在多种采购和路由选择之间切换，而不是接受经典单一供应商 SaaS 锁定模式。
            claimRefs:
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
