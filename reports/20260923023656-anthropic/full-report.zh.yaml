              - CP011
      - number: '3.2'
        title: 画像与定价：Anthropic 在编程和企业份额上领先，但竞争对手用捆绑或选择权进攻
        blocks:
          - type: paragraph
            body: >-
              最强的直接竞争对手仍是 OpenAI，因为它同时在 API 用量和企业聊天上竞争，其公开 API 费率表也仍与 Anthropic 旗舰 token
              定价可比。但官方产品界面显示，赛场上各家的战略姿态并不相同。Anthropic 自己的定价页明确列出 Claude Team 和 Enterprise，把 Claude Code
              纳入付费订阅，并开放相对深入的企业控制层。Google Workspace Enterprise 计划和 Microsoft 365 Copilot 的竞争方式不同：它们把 AI
              嵌入企业已经付费且治理的工具里，因此即使直接模型偏好并不一致，也拥有采购杠杆。Amazon Bedrock 和 OpenRouter
              竞争的是选择权，而不是一个品牌助手；它们让买方在同一个控制平面背后保留多个模型供应商。Mistral 围绕隐私、部署自由和主权定位，在 Studio 材料中提供 Team 与 Enterprise
              包装，以及随处部署的表述。独立 2025 年份额数据是 Anthropic 已不再只是小众挑战者的最清晰证据：TechCrunch 对 Menlo 年中企业数据的报道显示，Anthropic 企业 LLM
              使用份额为 32%，OpenAI 为 25%；编程份额为 42%，OpenAI 为 21%。这是实打实的当前优势，但它也与大部分大型企业合同在按量 API
              之外定价不透明、以及必须防御分发更强的对手并存。公开赢单、输单和续约证据将决定这种领先是否持久。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP011
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP012
      - number: '3.3'
        title: 切换成本、锁定、多宿主与护城河耐久度
        blocks:
          - type: paragraph
            body: >-
              Anthropic 的护城河真实存在，但有条件。Claude Team 和 Enterprise 的公开企业控制能力——SSO、管理员控制、审计日志、SCIM、支出控制和留存选项——帮助 Anthropic
              更像一个严肃工作系统，而不是轻量模型端点。一旦企业把 Claude 标准化用于编程或知识工作流，这会支撑更高黏性的部署。反向证据同样重要。Microsoft 和 Google 可以把 AI
              采购隐藏在现有套件和身份关系里。Amazon Bedrock 与 OpenRouter 让多模型路由、供应商选择和后备切换更易运营，降低多宿主摩擦。来自内部自建或 Mistral
              等供应商的开放权重与随处部署选项，在主权和私有部署用例里仍然重要，尽管 Menlo 2025 年数据显示开源工作负载仍属少数。结果是，这个市场的结构性锁定弱于经典 SaaS：Anthropic
              可以靠模型质量、编程表现和企业易用性取胜，但不能假设这些胜利会自动转化为持久经济权力。因此，尽调重点应放在实际合同条款、迁移摩擦、留存，以及 Claude
              在编程和企业控制上的领先是否大到足以压过捆绑力量与路由选择权。
