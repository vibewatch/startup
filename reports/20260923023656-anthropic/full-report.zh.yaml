              - CM007
              - CM008
      - number: '2.2'
        title: 买方分层、预算与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Anthropic 同时在卖给多张买方地图。最上层是横向企业知识工作；Team 和 Enterprise 包装、SSO、审计日志和域控制支撑广泛员工部署。第二层是开发者和技术买方；Claude
              Code、按 token 计价的 API、托管 Agent 功能，以及在 AWS 和 Google Cloud 上的伙伴可用性，契合平台、工程和产品预算。第三层是机构高等教育；Anthropic
              已推出专门产品、全校协议，以及 Learning Mode 和教育集成等面向教学法的功能。客户证明和伙伴证明进一步拓宽了地图：ServiceNow 在开发者和运营场景使用 Claude，Anthropic
              企业材料突出支持与分析工作流，云市场则把采购导入企业已经掌握的预算。采用路径也似乎可以复制。Menlo 的 PLG 证据和 Stack Overflow
              的开发者使用率显示，个人和团队试用可以很快发生；但企业推广通常需要安全、支出控制、治理审查，然后再通过直销或伙伴采购形成更大预算承诺。因此，买方覆盖面广，但推进节奏不均。
            claimRefs:
              - CM010
              - CM002
              - CM011
              - CM004
              - CM012
