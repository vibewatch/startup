- id: TU002
  title: Customer growth / adoption trajectory table
  columns:
  - metric
  - value
  - date
  - source / segment
  - implication
  - missing denominator
  rows:
  - - Internal AI adoption
    - 89%
    - 2026-05-04 snapshot
    - Zapier case study
    - Suggests deep internal penetration rather than a limited pilot.
    - Paid Claude seat count and spending level are not disclosed.
  - - Internal AI adoption
    - 97%
    - '2026-01-08'
    - Zapier customer-owned blog
    - Indicates adoption continued rising after the Anthropic case study benchmark.
    - The metric is companywide AI usage, not necessarily Claude-exclusive usage.
  - - Licensed weekly active usage
    - 80-90%
    - 2026-05-04 snapshot
    - Syracuse University case study
    - Strong repeat-usage proxy for an institution-wide rollout.
    - Exact licensed-base denominator for the 30,000-person claim is not broken out by role.
  - - Student peak daily active usage growth
    - 394%
    - 2025-10 to 2026-04
    - Syracuse University case study
    - Shows ramp after deployment rather than one-time launch curiosity.
    - Base daily-active level is not disclosed.
  - - Customer support resolution improvement
    - 87% faster
    - null
    - Lyft deployment via Amazon Bedrock
    - Strong operational ROI in a production customer-service workflow.
    - No contract value or agent-seat denominator is disclosed.
  - - Engineering automation throughput
    - 100+ pull requests/day at 85% success
    - 2026-05-04 snapshot
    - Delivery Hero case study
    - Demonstrates production agentic coding usage rather than experimentation.
    - Total eligible engineering tickets and total engineer base are not disclosed.
  - - Customer-support automation
    - 51% average resolution; up to 86%
    - 2024-10-10 to 2026-05-04
    - Intercom and Intercom customer story
    - Shows Anthropic reach through a platform that serves 25,000+ businesses.
    - The 86% figure is best-case, not portfolio-wide average.
  - - Regulated-enterprise deployment ramp
    - 600+ active users; >20% weekly time saved
    - 2026-05-04 snapshot
    - NBIM case study
    - Suggests rapid adoption beyond pilot in a highly regulated environment.
    - No renewal or budget-expansion data is disclosed.
  notes: Public evidence is strongest on workflow outcomes and user-adoption proxies. It is weaker on customer counts, renewal rates, and contract economics, so the table includes the missing denominator explicitly instead of implying precision that the sources do not provide.
