figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Anthropic’s customer journey typically starts with an individual or team proving value, then passes through admin, procurement, and channel choices before expanding into broader workflows or embedded products.
  data:
    nodes:
    - id: cj1
      label: Discovery
      detail: Individuals or small teams start with Free, Pro, Max, or a lightweight API proof of concept.
      tone: neutral
    - id: cj2
      label: Workflow proof
      detail: 'A specific use case demonstrates value: support automation, coding, search, analytics, or education.'
      tone: positive
    - id: cj3
      label: Admin and security review
      detail: Enterprise buyers evaluate SSO, SCIM, audit logs, spend controls, HIPAA-ready packaging, and privacy boundaries.
      tone: warning
    - id: cj4
      label: Procurement path
      detail: The buyer chooses direct Anthropic contracting, hyperscaler routing, AWS Marketplace, or other marketplace-based procurement.
      tone: neutral
    - id: cj5
      label: Production deployment
      detail: Claude reaches end users through workspace rollout, product embedding, or agentic platform integration.
      tone: positive
    - id: cj6
      label: Expansion or diversification
      detail: Usage can expand across seats and workflows, but some customers also preserve model choice and channel flexibility.
      tone: warning
  approximationNotes: This journey abstracts several observed buying motions into one qualitative path; actual customer flows differ by segment and channel.
  claimRefs:
  - CU012
callouts:
- calloutType: strength
  title: Public customer proof is materially better than logo-only marketing
  body: Anthropic’s best customer evidence names executives, workflows, channels, and measured outcomes. That makes the customer story more referenceable than a typical frontier-model vendor that only lists logos.
  claimRefs:
  - CU011
  - CU012
- calloutType: risk
  title: Retention and concentration are the chapter’s main blind spots
  body: Even strong case studies do not answer whether Anthropic renews profitably, expands efficiently, or relies too much on a handful of customers or partner channels.
  claimRefs:
  - CU001
- calloutType: insight
  title: Channel breadth helps adoption but weakens assumptions about lock-in
  body: Hyperscaler channels and Marketplace partners widen reach, while customers like Harvey and Delivery Hero show Anthropic can win workload share without owning the entire workflow or contract.
  claimRefs:
  - CU001
