- id: section-2
  title: Buyer segmentation, budgets, and adoption path
  body: 'The public evidence suggests Anthropic is selling into multiple buyer maps at once. At the top is horizontal enterprise knowledge work, where Team and Enterprise packaging, SSO, audit logs, and domain controls support broad employee deployment. The second is the developer and technical buyer, where Claude Code, token-priced APIs, managed-agent features, and partner availability on AWS and Google Cloud fit platform, engineering, and product budgets. The third is institutional higher education, where Anthropic has launched a dedicated product, full-campus agreements, and pedagogy-specific features such as Learning Mode and educational integrations. Customer proof and partner proof widen the map further: ServiceNow uses Claude in developer and operational contexts, Anthropic''s enterprise materials highlight support and analytical workflows, and cloud marketplaces route procurement through budgets enterprises already control. Adoption also appears to follow a repeatable path. Menlo''s
    PLG evidence and Stack Overflow''s developer-use rates suggest individual and team experimentation can happen quickly, but enterprise rollout usually needs security, spend controls, governance review, and then a larger budget commitment through direct sales or partner procurement. That makes buyer coverage broad, but progression uneven.'
  claimRefs:
  - CM010
  - CM002
  - CM011
  - CM004
  - CM012
  tableRefs:
  - TM002
  figureRefs:
  - FM001
- id: section-3
  title: Growth drivers, adoption constraints, and valuation relevance
  body: 'Demand-side signals are strong enough to support continued market expansion. Microsoft''s 2025 Work Trend Index shows leaders treating 2025 as a pivotal year, expecting agents to become part of strategy, and facing a clear productivity-capacity gap. PwC''s Jobs Barometer reinforces that macro pull with wage, job, and revenue-per-employee signals that suggest AI is already translating into business value. Anthropic''s own enterprise case studies also point to meaningful workflow productivity gains in support, proposals, and analytical tasks. But the braking forces are just as material. Deloitte shows that most experiments still do not scale quickly even when ROI is positive, and that regulatory compliance and governance timelines are now binding constraints. Stack Overflow''s 2025 developer survey shows the same tension at the practitioner level: usage is high, but trust is low, deployment use cases remain avoided, and agent accuracy and privacy worries are widespread. The EU AI
    Act, NIST AI RMF, and OECD accountability framing all point in the same direction: higher-consequence uses will require more documentation, monitoring, oversight, and trust-building than early productivity pilots. Competition also remains intense. For valuation, that means Anthropic benefits from real market pull and multiple budget paths, but underwriting should discount for slow pilot-to-production conversion and for the lack of public segment economics needed to isolate a clean SAM or SOM.'
