chapter:
  number: 2
  title: Market Analysis
  summary: Anthropic is exposed to a large generative AI demand backdrop, but the market that matters for underwriting is narrower than headline AI-spend narratives suggest. The most relevant public lenses are seat-based enterprise assistance, developer and agent API consumption, institutional education deployments, and partner-mediated cloud procurement. Demand is real across functions, but regulation, governance, trust, and missing segment-level economics still limit precise SAM or SOM sizing.
sections:
- id: section-1
  title: Market boundary and sizing lenses
  body: Anthropic's addressable market should be defined from its monetization surfaces outward, not from the entire AI stack inward. Public pricing and platform materials show the company monetizes a combination of seat-based subscriptions, enterprise deployment features, developer and agent API usage, and a dedicated education offering for universities. That is materially narrower than broad generative-AI narratives that also count devices, servers, consulting, and other infrastructure layers. Gartner's $644 billion 2025 forecast is therefore useful as an outer envelope for overall end-user spending, but not as a direct revenue pool for Anthropic. Menlo's 2025 enterprise estimate of $37 billion and its $19 billion application-layer estimate are closer to the budgets that can actually flow into Anthropic or its application ecosystem, even though those figures remain U.S.-enterprise centric and not company specific. The practical underwriting boundary should include enterprise knowledge-work
    seats, coding and agent workflows billed on usage, campus-wide education agreements, and partner-mediated Claude consumption via AWS and Google Cloud. It should exclude hardware refresh, generic cloud infrastructure, and broad AI services spend that does not monetize through Anthropic's products or partner channels. That still leaves Anthropic-specific SAM and SOM as diligence questions rather than public facts, because public disclosures stop short of contract values and segment revenue mix.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  - CM007
  - CM008
  - CM009
  tableRefs:
