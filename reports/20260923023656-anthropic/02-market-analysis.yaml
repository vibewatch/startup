  title: Segment / buyer map
  columns:
  - segment
  - buyer
  - user
  - payer/workflow
  - budget owner
  - adoption trigger
  rows:
  - - Enterprise knowledge workers
    - CIO, COO, or transformation leader
    - Analysts, managers, and general office staff
    - Seat-based assistant, research, and document workflows
    - Central IT or shared productivity budgets
    - Need to close the productivity-capacity gap with controlled enterprise deployment
  - - Developers and engineering
    - CTO, VP Engineering, or platform leader
    - Software engineers, platform teams, and product builders
    - Claude Code, APIs, and agentic software workflows
    - Engineering and platform budgets
    - Need for faster coding, prototyping, and multi-step automation
  - - Customer support and service operations
    - Support operations or CX leader
    - Support agents and service managers
    - Case-resolution, summarization, and knowledge workflows
    - Support budgets with IT participation
    - Pressure to reduce response time while preserving quality
  - - Sales and revenue operations
    - CRO, sales-ops, or enablement leader
    - Sellers, proposal teams, and analysts
    - Research, proposal drafting, and account-preparation workflows
    - Sales operations and commercial enablement budgets
    - Need to increase seller productivity and reduce repetitive preparation work
  - - Higher education
    - Provost, CIO, and procurement leader
    - Students, faculty, researchers, and administrators
    - Campus-wide Claude access and educational workflows
    - Central university administration and IT
    - Need for secure institution-wide AI access with pedagogy-specific guardrails
  - - Regulated analytical work
    - CFO, legal, compliance, or operations leader
    - Finance staff, lawyers, and specialist analysts
    - Document-heavy review, analysis, and support workflows
    - Functional budgets plus governance oversight
    - High labor intensity and strong ROI potential, tempered by heavier review requirements
  notes: Anthropic appears to sell horizontally through shared productivity and developer budgets, while also opening distinct institutional and regulated-workflow motions that have different governance burdens.
