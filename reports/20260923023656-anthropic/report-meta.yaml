  topStrengths:
    - Run-rate revenue and large customer adoption show extraordinary commercial momentum.
    - Claude is distributed across AWS, Google Cloud, Azure, and partner ecosystems.
    - Governance and safety positioning remain unusually explicit for a frontier AI company.
  topRisks:
    - Normalized revenue, margins, and partner take-rates are still not public.
