  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: >-
          Customer segmentation: Anthropic sells to individuals, enterprise admins, developers, and partner-routed
          buyers across multiple verticals
        blocks:
          - type: paragraph
            body: >-
              Anthropic’s public customer footprint now spans several distinct buying motions rather than a single
              homogeneous “Claude user.” The pricing and platform pages show individual subscribers on Free, Pro, and
              Max plans; team and enterprise workspace buyers that care about SSO, SCIM, audit logs, spend controls, and
              HIPAA-ready packaging; and developer/API buyers that can purchase usage directly, via monthly invoicing,
              or through committed-spend programs. On top of that direct motion, Anthropic increasingly reaches
              enterprise users through partner channels: Amazon Bedrock, Google Vertex AI, Microsoft Foundry, AWS
              Marketplace, and newer marketplace-style procurement routes. The customer directory and education solution
              page broaden the segment picture further. They show not only well-known software vendors such as GitLab,
              Slack, HubSpot, Zapier, Intercom, Cox Automotive, and Harvey, but also education, financial-services,
              cybersecurity, and EMEA-tagged deployments. That matters because the buyer, user, and payer are often
              different. A CIO or security team may approve Claude for Work, a platform team may route usage through
              Bedrock or Vertex, and line employees or downstream end customers may be the actual users. For diligence,
              this is positive because Anthropic is not dependent on one narrowly defined ICP, but it also means the
              revenue mix between self-serve seats, direct enterprise, API consumption, and partner-routed usage remains
              opaque in public evidence.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU001
