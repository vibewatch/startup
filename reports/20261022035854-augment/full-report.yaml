  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Transaction execution and autonomous-action risk combine high potential impact with incomplete mitigation
      evidence.
    data:
      columns:
        - label: Likelihood
          detail: Qualitative assessment from observed events and public signals
        - label: Impact
          detail: Potential effect on product continuity, customers, or investment value
        - label: Mitigation maturity
          detail: Strength of publicly evidenced controls rather than management intent
        - label: Residual severity
          detail: Exposure remaining after the reported mitigation
      rows:
        - label: Harness asset acquisition and integration
          values:
            - label: High
              detail: The acquisition of select assets was announced
            - label: High
              detail: Product, contract, team, and roadmap continuity may change
            - label: Unknown
              detail: No integration plan or transition metrics in the pool
            - label: High
              detail: Transaction perimeter and execution evidence are incomplete
        - label: Autonomous execution error
          values:
            - label: Medium
              detail: Reviews identify hallucination and manual-intervention risk
            - label: High
              detail: Actions can reach code, terminals, databases, and integrations
            - label: Partial
              detail: Checkpoints, sandboxing, RBAC, and audit logs are reported
            - label: High
              detail: No independent incident or rollback performance data
        - label: Security and compliance scope
          values:
            - label: Unknown
              detail: The pool does not establish an incident frequency
            - label: High
              detail: Enterprise source code and connected systems are sensitive
            - label: Claimed
              detail: Certifications and controls are reported by secondary sources
            - label: Medium-high
              detail: Current scope, exceptions, and shared controls are unverified
        - label: Pricing and credit volatility
          values:
            - label: High
              detail: A review reports two pricing-model changes in six months
            - label: Medium-high
              detail: Budget unpredictability can impede renewals and adoption
            - label: Low
              detail: Consumption and extra-credit rates remain undisclosed in the pool
            - label: High
              detail: No contractual price protection or workload distribution is available
        - label: Platform and model dependency
          values:
            - label: Medium
              detail: The product connects to multiple external environments
            - label: High
              detail: Provider changes may affect capability, access, and cost
            - label: Partial
              detail: MCP and broad integration coverage offer some diversification
            - label: Medium-high
              detail: Provider mix, contracts, and concentration are not quantified
        - label: Financial and adoption opacity
          values:
            - label: Medium
              detail: A private-company disclosure gap is persistent rather than an event rate
            - label: High
              detail: Runway, retention, and concentration affect transition viability
            - label: Low
              detail: No public revenue, ARR/MRR, burn, or runway evidence in this pool
            - label: High
              detail: Funding raised cannot be treated as cash available
    approximationNotes: >-
      Qualitative ordinal assessment only; placements are not measured probabilities, benchmark thresholds, or
      value-proportional scores.
    claimRefs:
