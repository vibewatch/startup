      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Secondary profiles consistently place Augment's founding in 2022 and describe an enterprise-focused AI
              coding platform for teams working in large, complex codebases. Gartner lists Palo Alto as the head-office
              location, while IntelPilot characterizes the model as B2B SaaS and reports a shift toward usage-based
              pricing. The product is distributed through developer workflows rather than a standalone greenfield-only
              proposition: reviewed sources describe IDE, command-line, code-review, and context services aimed at
              multi-repository engineering environments. These points establish the historical operating identity, but
              they do not establish the legal entity, product ownership, or office footprint after the reported October
              2026 asset sale.
