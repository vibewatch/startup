  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and category position
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not all generative AI or all developer productivity software. It is the spend on
              AI-enabled software-engineering workflows: code understanding, agentic implementation, code review,
              debugging, migration, onboarding, and the controls needed to deploy those workflows inside an
              organization. The inclusion boundary covers software subscriptions and usage budgets paid by engineering
              organizations for those activities. It excludes general-purpose chat, model infrastructure sold to
              developers, conventional IDE licenses, and unassisted consulting labor. Augment's public positioning is
              unusually specific within that boundary: the pool describes a platform built around multi-repository
              context, autonomous agents, and broader SDLC integration, while a 2026 SiliconANGLE report describes its
              Context Engine MCP as a way to make semantic code context available to other agents. This creates a
              plausible wedge between generic completion and enterprise codebase intelligence, but the evidence is
              largely product and market commentary rather than audited category revenue. The category should therefore
              be treated as an adoption opportunity, not as a verified company revenue pool.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM009
      - number: '2.2'
        title: Sizing through multiple lenses
        blocks:
          - type: paragraph
            body: >-
              The evidence supports three different sizing lenses, none of which should be silently combined. First, a
              third-party market view in the assigned pool says the AI coding assistant market was projected at $20–30
              billion by 2025, while another calls it a $6 billion market in 2026 growing at 22% CAGR. Neither fetched
              page exposes a methodology, and the incompatible vintages and values should not be normalized or treated
              as Augment's obtainable market. Second, a bottom-up price lens is observable: public plan descriptions put
              entry pricing at $20 per month, a team plan at $60 or $100 per month depending on the reviewed page and
              plan vintage, and enterprise pricing at custom rates. These are list-price anchors, not realized ARR or
              wallet share. Third, an evidence-constrained serviceable wedge is defined by teams with large or
              multi-repository codebases, complex migrations, regulated-data requirements, or a need for cross-tool
              context. The pool provides buyer and use-case descriptions for that wedge, but no verified count of
              eligible companies, seats, conversion, or net retention. Accordingly, the opportunity may support
              enterprise software economics, but the investable sizing remains a diligence gap.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM007
              - CM008
              - CM013
              - CM016
      - number: '2.3'
        title: Buyers, adoption drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The primary economic buyer is likely a VP of Engineering, CTO, or engineering platform leader; senior
              engineers, technical leads, architects, and security teams are users or influencers. The buyer's budget
              case is strongest when context loss, migration backlog, code-review throughput, onboarding time, or
              compliance controls are visible operating constraints. The reviewed buyer descriptions point to mid-sized
              and large software organizations with multiple repositories and legacy or polyglot systems, while Gartner
              peer material in the pool records positive user ratings but also mentions occasional irrelevant
              suggestions, limited analytics, and manual intervention to avoid hallucination. That combination matters:
              the adoption trigger is not simply interest in AI, but a measurable workflow bottleneck that justifies a
              new line item and human oversight. Switching costs can rise through indexed code, workflow integrations,
              memories, and review processes, yet those same integrations create data-governance and portability
              questions. Pricing uncertainty is material because usage-based inference fees, top-ups, and differences
              between public plan descriptions make annual budget predictability harder to assess. Finally, the October
              2026 acquisition of selected Augment assets by Harness, as recorded by the assigned sources, is a
              market-structure event whose effect on existing plans and buyer confidence was not publicly clarified in
              those sources; it is a current diligence question rather than evidence of either acceleration or
              deterioration.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Sizing and adoption gaps
        blocks:
          - type: paragraph
            body: >-
              Public material is sufficient to map the product category and likely buying motion, but not to underwrite
              market share. The missing denominators include the number of target engineering organizations, eligible
              seats per organization, paid versus trial conversion, realized price after discounts, usage expansion,
              renewal and multi-homing behavior, and the share of deployments that require enterprise controls. The pool
              also contains conflicting or time-sensitive commercial descriptions: one reviewed page lists Indie,
              Standard, Max, and Enterprise tiers, while another describes Standard and Business plans and a later
              asset-acquisition event. These differences may reflect plan changes or source quality, so they should not
              be normalized into a single price curve. The prudent market stance is therefore “credible category wedge,
              unverified serviceable market.” A buyer interview set, current price card, cohort-level retention data,
              and an independent market methodology would materially improve confidence.
            claimRefs:
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Credible wedge, incomplete denominator
            body: >-
              Augment appears positioned for a real enterprise workflow problem, but the assigned evidence does not
              establish the number of eligible organizations, paid seats, or obtainable share.
            calloutType: insight
            claimRefs:
              - CM002
              - CM008
              - CM013
          - type: callout
            title: Procurement and price uncertainty
            body: >-
              Conflicting public plan descriptions, usage-based charges, and an October 2026 asset acquisition make
              current packaging, budget predictability, and buyer continuity important diligence items.
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than named AI coding vendors. Augment's direct peers include
              GitHub Copilot Enterprise, Cursor, Sourcegraph Cody, and Codeium/Windsurf; adjacent options include
              Tabnine, Continue.dev, Cline, Aider, and JetBrains AI Assistant. The status quo is conventional IDE
              tooling, internal developer-platform work, or a mixed stack in which an organization keeps its incumbent
              assistant and adds specialized context services. Gartner describes Augment as Developer AI that uses a
              large-codebase understanding to produce personalized suggestions and insights, while a 2026 alternatives
              comparison explicitly frames Cursor as the closest IDE-integrated alternative and Cody as the
              enterprise-scale codebase-context alternative. This means the buying decision is primarily about
              repository scale, workflow integration, security/deployment, and whether the buyer wants one agent or a
              composable stack. Augment's own comparison page is useful for identifying its intended category, but it is
              company-issued and not independent proof of superiority. More importantly, a low-reputation news index
              dated October 9, 2026 says Harness announced an acquisition of selected Augment assets, including Cosmos,
              Auggie CLI, and the Context Engine. That current signal could reshape the competitor map and product
              ownership, but the assigned pool lacks the primary transaction announcement or contractual scope needed to
              confirm whether Augment remains a standalone platform.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP015
      - number: '3.2'
        title: Capability, distribution, and switching comparison
        blocks:
          - type: paragraph
            body: >-
              The central product trade-off is depth of context versus distribution and workflow breadth. A fetched
              comparison of Augment, Copilot, and Cursor says Augment's Context Engine can span 500,000 files and 30 or
              more repositories, while Copilot is described through a 64K-128K token window and Cursor through
              single-repository indexing; these are third-party review assertions and should be validated in a
              controlled pilot rather than treated as audited benchmarks. Another source describes Copilot's GitHub
              integration as its default advantage, Cursor's single-repository fit as its strength, and Cody's
              self-hosted option as a genuine differentiator. Gartner review evidence adds favorable user sentiment for
              contextual suggestions and IDE integration, but also records occasional irrelevant or generic outputs and
              limited enterprise analytics. Augment therefore has a credible wedge for complex, multi-repository teams,
              while incumbents retain distribution, ecosystem, and simpler onboarding. Switching costs are likely to
              rise with indexed repositories, memories, integrations, and workflow conventions, but the same
              integrations can support multi-homing; a team can pair Augment with another completion or IDE product.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP011
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP015
              - CP017
      - number: '3.3'
        title: Pricing, packaging, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Pricing is a material competitive variable and a source of uncertainty. The 2026 Fast.io review reports
              that Augment removed inline completions from non-Enterprise plans on March 31, 2026 and made Business the
              cheapest plan at $100 per month for up to 50 seats; it also reports unpredictable credit consumption and a
              30,000-credit trial requiring a card. The same review contrasts this with free or lower-priced entry
              points for Copilot and Cursor. These details may be current but are one review's account and should be
              rechecked in procurement. A separate 2026 comparison lists Cursor at $20-$40 per user per month, Copilot
              Workspace at $10-$39, and Cody at custom enterprise pricing, while describing self-hosted options for
              Cody, Tabnine, and Codeium. Augment's durable advantage would need to come from measurable productivity,
              onboarding, review, or risk outcomes that outweigh price and lock-in; public evidence here is mostly
              company-selected testimonials, directory summaries, and reviewer assertions. The adverse case is that
              completions commoditize, pricing changes erode trust, and platform vendors bundle sufficient context with
              existing developer workflows.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: Competitive diligence verdict
        blocks:
          - type: paragraph
            body: >-
              Augment appears best positioned for engineering organizations with large, interdependent repositories,
              compliance requirements, and a willingness to pay for agentic workflow depth. Cursor is a credible
              single-repository and IDE-native substitute; Copilot is the strongest distribution and ecosystem
              incumbent; Cody and self-hosted alternatives are credible where deployment control dominates; open-source
              or BYO-model tools remain substitutes for teams prioritizing flexibility and auditability. The evidence
              does not yet establish a durable moat: independent win-loss data, realized pricing, retention, deployment
              breadth, and apples-to-apples productivity outcomes remain unavailable in this pool. The reported Harness
              transaction also makes product continuity, support ownership, and roadmap commitments immediate diligence
              items rather than ordinary future risks. A buyer should first verify the transaction scope, then run a
              parallel pilot on the same repositories, compare context-retrieval quality and total cost, test
              security/deployment requirements, and measure renewal intent before assuming Augment's positioning is
              defensible.
            claimRefs:
              - CP003
              - CP015
              - CP017
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Enterprise context is the clearest wedge
            body: >-
              Assigned sources consistently describe Augment's differentiation as large-codebase, multi-repository
              context and agentic workflow depth rather than generic autocomplete.
            calloutType: strength
            claimRefs:
              - CP005
              - CP006
              - CP015
          - type: callout
            title: Pricing and commoditization can narrow the market
            body: >-
              The reported Harness acquisition of selected assets, removal of non-Enterprise inline completions,
              credit-based usage, and changing packages increase continuity and procurement risk while Copilot and other
              tools retain lower-friction entry points.
            calloutType: risk
            claimRefs:
              - CP003
              - CP010
              - CP011
              - CP013
              - CP017
          - type: callout
            title: Underwrite through a parallel pilot
            body: >-
              Compare Augment, Copilot, Cursor, and Cody on identical repositories and tasks, including retrieval
              freshness, review quality, security controls, realized usage cost, and user retention intent.
            calloutType: recommendation
            claimRefs:
              - CP015
              - CP017
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing architecture
        blocks:
          - type: paragraph
            body: >-
              The clearest current public model is a hybrid subscription-and-consumption structure. A third-party June
              2026 pricing review reports a Business plan at $100 per month for as many as 50 seats, with the same
              amount included for pooled usage; Enterprise is custom-priced. Usage economics are more explicit than
              realized revenue: model tokens are passed through at provider list prices with a 40% service fee, while
              Cosmos sandbox compute is reported at $0.19 per hour. This gives Augment three possible economic
              levers—base subscription, model-service markup, and compute—but public sources do not disclose
              customer-level discounts, overage incidence, Enterprise commitments, or revenue recognition. The bridge
              therefore maps billing mechanics rather than claiming a verified revenue mix or gross-profit conversion.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
