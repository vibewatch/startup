              - CI004
              - CI005
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI014
      - number: '4.2'
        title: Traction and sales-efficiency signals
        blocks:
          - type: paragraph
            body: >-
              Public traction is directional rather than underwriteable. GetLatka reports $20 million of annual revenue
              for October 2025 but explicitly says the source was not recorded; AI Central separately labels
              approximately $20 million as ARR in late 2025. Revenue and ARR are not interchangeable, and another
              retained directory says no public revenue or ARR data exist. Customer-review evidence is more useful for
              value discovery than for financial measurement: Gartner reviewers describe workflow benefits but also
              limited analytics and occasional irrelevant output, while one compiled customer example reports a shorter
              merge cycle. These signals can support willingness-to-pay hypotheses, but they do not reveal CAC, sales
              cycle, expansion, renewal, concentration, or payback.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI012
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI015
              - CI016
      - number: '4.3'
        title: Cost structure and margin path
        blocks:
          - type: paragraph
            body: >-
              The disclosed billing design exposes important cost drivers without proving margin. Model-token cost is
              largely variable and visible to the buyer, the 40% service fee is intended to fund the Context Engine and
              platform, and Cosmos compute is billed separately. SiliconANGLE reports Augment's claim that better
              context can improve coding-agent quality and reduce wasted tokens, which is a plausible customer-value
              mechanism but not evidence of Augment's own gross margin. Hosting, inference rebates, support,
              implementation, sales commissions, and research-and-development costs remain unavailable. Consequently, no
              defensible gross-margin, contribution-margin, or cash-payback estimate can be built from the retained
              public evidence, and the unit-economics table treats those fields as diligence requests rather than
              zeroes.
            claimRefs:
              - CI002
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Capital adequacy, transaction change, and verdict
        blocks:
          - type: paragraph
            body: >-
              Third-party sources converge on $252 million raised historically, but funding raised is not cash on hand
              and says nothing about October 2026 burn, runway, debt, or contractual obligations. More importantly, an
              October 2026 aggregator reproduces an announcement that Harness acquired select Augment assets, including
              Cosmos, Auggie CLI, the Context Engine, and related technology, with the team joining Harness. The word
              “select” prevents treating this as proof that every asset or liability transferred, and no retained source
              provides consideration or balance-sheet treatment. The financial verdict is therefore not a stand-alone
              growth underwriting: pricing has a legible usage-based architecture, but revenue quality, margin, cash
              needs, and the post-transaction entity perimeter are unresolved. Diligence should prioritize the purchase
              agreement, closing statement, retained liabilities, customer-contract assignment, and a monthly
              cohort-level operating model.
            claimRefs:
              - CI005
              - CI009
              - CI010
              - CI011
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Stand-alone underwriting is no longer the default frame
            body: >-
              The reported sale covered select assets and related technology, not an explicitly documented whole-company
              acquisition. Transaction scope, consideration, customer-contract assignment, and any residual entity must
              be established before applying conventional revenue or runway analysis.
            calloutType: risk
            claimRefs:
              - CI010
              - CI011
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and user workflow
        blocks:
          - type: paragraph
            body: >-
              Augment Code is delivered inside an engineer's existing development workflow rather than as a standalone
              replacement for the IDE. The Visual Studio Marketplace listing describes a VS Code extension for
              professional engineers and large codebases, with Agent for completing tasks and solving production
              problems and Chat for questions, project planning, and defining changes. It also says Agent understands
              “your code, APIs, schemas, and dependencies,” while Smart Apply updates code in one click. The listed
              workflow is therefore broader than autocomplete: a developer can orient within an unfamiliar system, ask
              questions, plan changes, and apply multi-file edits. The same listing points users to Agent and Chat,
              native integrations, and “100+ tools with MCP.” This establishes the product surface and intended
              workflow, but not independent proof of the quality, latency, or safety of those operations.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE007
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE007
              - CE008
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE007
              - CE012
      - number: '5.2'
        title: Technology architecture and maturity
        blocks:
          - type: paragraph
            body: >-
              Public descriptions consistently center the product on a Context Engine that maintains a representation of
              a large codebase and uses it to ground suggestions and agent actions. A Gartner Peer Insights page
              describes deep understanding of the large codebase, dependencies, and documentation, while third-party
              product summaries describe cross-file and cross-repository context and a Cosmos multi-agent layer. Those
              latter details should be treated as vendor-directory or market-description evidence rather than
              independently verified architecture. The available evidence does show a product that spans VS Code,
              agentic task execution, Chat, code review or PR workflows, and MCP-style integrations. A September 10,
              2026 item in a news aggregator reports that Harness acquired select assets including Cosmos, Auggie CLI,
              and the Code Context Engine; without a primary announcement in the assigned pool, the transaction scope
              and resulting roadmap remain unverified. The evidence also does not establish the implementation of
              indexing, retrieval, orchestration, model routing, or multi-agent coordination, so the architecture map
              intentionally labels those as public descriptions and diligence items rather than verified internals.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE013
      - number: '5.3'
        title: Trust, deployment, and implementation risks
        blocks:
          - type: paragraph
            body: >-
              The product's value depends on accurate context and safe application of changes across a customer's
              codebase, making integration quality, access boundaries, rollback, and reliability central diligence
              topics. Gartner user material reports strong contextual understanding and IDE integration, but also
              records occasional irrelevant suggestions, limited enterprise analytics, minimal offline support, and a
              need for manual intervention to avoid hallucination. A competitor-authored comparison additionally states
              that developers may encounter stale-file handling, reliability issues in migrations and integrations, and
              setup hurdles; because the issuer is a competitor, this is an adverse lead rather than a benchmark. The
              public pool contains no independent security audit, incident record, uptime history, or technical
              performance benchmark for Augment Code. Security and support controls, data retention, model-provider
              boundaries, deployment options, and production rollback procedures therefore remain material diligence
              gaps.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE005
              - CE007
              - CE008
              - CE012
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Context is the product thesis
            body: >-
              The strongest supported differentiation is a workflow built around understanding large codebases,
              dependencies, and documentation rather than only the active file. This is a credible product thesis for
              large engineering organizations, but public evidence does not yet independently quantify its advantage.
            calloutType: strength
            claimRefs:
              - CE001
              - CE005
              - CE006
          - type: callout
            title: Architecture and trust controls remain under-disclosed
            body: >-
              Product descriptions are detailed about user-facing capabilities but sparse on independently verifiable
              architecture, security controls, reliability, and data-handling boundaries. Procurement should require
              technical and security evidence before treating the marketing surface as production maturity.
            calloutType: risk
            claimRefs:
              - CE009
              - CE010
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying motion
        blocks:
          - type: paragraph
            body: >-
              The clearest customer segment is the enterprise engineering organization rather than the individual
              developer seeking inexpensive autocomplete. WorkOS's April 2026 interview with Augment's CEO describes
              financial institutions, media companies, and a large furniture company building toward agent-heavy
              software engineering, while AIIDEList describes the product as best for enterprise engineering teams,
              large monorepos, production refactors, and repository-scale debugging. The buyer is therefore likely an
              engineering or technology organization with a complex repository and governance requirements; the end user
              is the engineer, technical lead, or reviewer who needs repository context. The public record does not
              disclose segment-level revenue, account counts, geography mix, or a verified payer profile, so those
              remain diligence questions rather than quantified conclusions.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption signals and durability
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows several adoption surfaces but not durable cohort economics. The WorkOS interview
              provides a current qualitative signal that large, regulated and risk-aware enterprises are making
              infrastructure bets around agentic coding. Gartner Peer Insights presents a 4.8 rating from 42 ratings and
              includes reviews from software, telecom, and IT services employees; those reviews praise context-aware
              suggestions, codebase understanding, and code review while also noting occasional irrelevant or generic
              outputs and limited analytics. These signals are useful for product reception, but they do not prove
              active account retention, renewal, expansion, or production-wide deployment. Pricing and usage volatility
              are also relevant to durability: AIIDEList says usage-based billing can be harder to predict, and the
              WorkOS interview calls usage spiky, hard to predict, and growing fast.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
      - number: '6.3'
        title: Named customer proof and concentration gaps
        blocks:
          - type: paragraph
            body: >-
              Named proof is uneven. The WorkOS interview identifies financial institutions, media companies, and a
              large furniture company only at category level, without names or deployment outcomes. The assigned
              directory sources describe enterprise use cases and integrations but do not independently establish
              production status, contract size, renewal, or expansion. Gartner's review page adds named reviewer
              contexts and dated user comments, which is stronger than a logo-only claim, but the record remains a small
              public sample and is not a customer census. Consequently, the report can support a thesis that Augment has
              credible enterprise adoption signals, not a claim that adoption is broad, retained, or concentrated in any
              particular account. Customer references, cohort retention, account-level usage, pilot-to- production
              conversion, and top-account exposure are the highest-value diligence asks.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU005
              - CU008
              - CU010
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Enterprise fit is more credible than broad customer scale
            body: >-
              The strongest evidence supports a specific buyer problem—large, complex, and governance-sensitive
              engineering environments—rather than a quantified customer base.
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: callout
            title: Retention and concentration are not publicly measurable
            body: >-
              No retained source supplies NRR, GRR, churn, renewal terms, account concentration, or a complete named
              deployment list; these gaps limit confidence in durability.
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              The highest-priority risk is execution through transition. A Harness-issued announcement reproduced by
              Parsers.vc says Harness acquired select Augment assets, including Cosmos, the Auggie CLI, and the Code
              Context Engine, and that the team behind those products would join Harness. That event makes product
              continuity, customer-contract assignment, roadmap ownership, and integration execution immediate diligence
              questions rather than hypothetical long-term risks. The next tier combines autonomous-action risk with
              commercial volatility: public user material describes terminal execution and database migrations, Gartner
              reviewers identify hallucination-related manual intervention, and independent reviews describe pricing
              changes and undisclosed credit-consumption rates. These signals do not establish measured incident
              probabilities, so likelihood labels below are qualitative and residual severity stays high where
              mitigation evidence is only reported rather than independently verified.
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR010
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR010
              - CR012
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and control assurance
        blocks:
          - type: paragraph
            body: >-
              Secondary sources associate Augment with SOC 2 Type II, ISO/IEC 42001, customer-managed encryption keys,
              role-based access controls, audit logging, sandboxed execution, and no-training or zero-retention options.
              Those are relevant mitigations, but they do not establish the current audit period, scope, exceptions,
              shared-control obligations, subprocessor chain, or contractual remedies for a particular buyer. The
              assigned source pool also contains no primary litigation docket, regulator record, breach disclosure, or
              intellectual-property schedule. Silence in this pool must remain a gap, not evidence of a clean history.
              Legal approval should therefore require auditor-issued reports, the data-processing agreement,
              incident-notification terms, customer-data and model-training restrictions, indemnities, and confirmation
              of how the Harness transaction affects licenses and customer obligations.
            claimRefs:
              - CR001
              - CR007
              - CR008
              - CR010
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.3'
        title: Operational, quality, and security exposure
        blocks:
          - type: paragraph
            body: >-
              Augment's product can act across code, terminals, databases, and connected development systems, so an
              inaccurate instruction or stale context can propagate beyond a wrong suggestion. A developer account
              describes the agent finding an execution error and attempting a fix, while Gartner's review summary says
              manual intervention can be needed to avoid hallucination. SiliconANGLE also reports Augment's own
              explanation that agents hallucinate and waste tokens on irrelevant context. Checkpoints, sandboxing,
              access controls, and audit logs are useful mitigations, but the pool supplies no independent uptime,
              rollback-time, incident-rate, penetration-test, or false-positive measurements. A production pilot should
              therefore use least privilege, mandatory review for consequential actions, representative failure
              injection, rollback tests, and monitored usage ceilings before autonomy expands.
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Partner, commercial, and financial dependencies
        blocks:
          - type: paragraph
            body: >-
              The asset acquisition concentrates near-term execution on Harness's integration decisions and creates
              uncertainty over product packaging, support ownership, and renewal terms. Technical dependencies are also
              broad: SiliconANGLE reports that the Context Engine can connect to external agents and model environments
              through MCP, while review sources describe dependence on IDEs and collaboration platforms. Commercial
              predictability is weaker. Vantaige reports two pricing-model changes in six months and cites one user's
              description of an effective increase approaching tenfold; AI Central Resources says credit-consumption
              rates and extra-credit pricing were undisclosed. CheckThat.ai reports no publicly disclosed revenue,
              growth, ARR/MRR, or acquisition metrics. Funding history is not cash availability, and no evidence here
              establishes burn, runway, margin, retention, customer concentration, or transition economics.
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR012
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR012
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break and monitoring triggers
            body: >-
              Pause expansion if transaction diligence cannot establish customer and IP continuity, if a material
              control exception remains open, if representative pilots show repeated uncontained code or data incidents,
              if credit cost cannot be bounded contractually, or if management cannot provide current runway, retention,
              and concentration evidence. Monitor product deprecations, support ownership, incident response, rollback
              performance, provider-cost pass-through, renewal terms, and customer-reference continuity through the
              Harness integration.
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR008
              - CR014
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Augment's positive case is built on an enterprise coding proposition, substantial institutional financing,
              favorable user-review evidence, and a reported strategic transaction. Tracxn describes a Palo Alto Series
              B provider of AI-powered coding-assistant and developer-productivity tools and reports $252M raised across
              three rounds. Gartner Peer Insights users describe contextual understanding and fast responses, while
              SiliconANGLE reported on October 8, 2026 that Harness acquired selected Augment assets, including Cosmos,
              Auggie CLI, the Code Context Engine, and related technology. That acquisition validates the strategic
              relevance of the product assets, but it does not disclose consideration, proceeds to shareholders, or the
              treatment of the remaining company. The anti-thesis is equally material: retained sources conflict on
              whether an ARR figure is publicly available, and none provides verified current growth, gross margin,
              retention, burn, runway, or acquisition economics. Parsers' archived April 2024 report of a $977M
              financing valuation is historical rather than a current mark. This combination makes the decision highly
              price-sensitive and disclosure-constrained.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV014
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV005
              - CV011
              - CV012
      - number: '8.2'
        title: Entry discipline and scenario logic
        blocks:
          - type: paragraph
            body: >-
              A conventional revenue-multiple valuation cannot be responsibly calculated because no retained primary or
              high-confidence source verifies current ARR, growth, gross margin, net retention, or capitalization.
              CheckThat states that no public revenue, growth, ARR/MRR, or customer-acquisition metrics exist, while
              Vantaige reports approximately $20M ARR as of late 2025 without providing primary evidence in the fetched
              text. Tracxn reports $252M of cumulative funding and a latest Series B dated November 4, 2024, but masks
              that round's amount and valuation. Its competitor data provide funding comparisons - Sourcegraph at $223M,
              Tabnine at $102M, Codegen at $16.2M, and Magic AI at $466M - not revenue multiples or transaction
              valuations. The most defensible framework is therefore scenario-based: a bull case requires disclosed
              strategic consideration or verified recurring revenue and retention; a base case recognizes product value
              but no proof of shareholder proceeds; and a bear case allows limited common-equity recovery if the asset
              sale did not transfer the whole business. Entry discipline requires transaction documents, preference
              terms, financials, and customer concentration before assigning a price.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: Recommendation and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The current recommendation is research-more, with low confidence in any precise valuation stance and high
              risk because the central transaction and operating facts are missing or conflicted. The acquisition and
              favorable user reviews are positive validation signals, but neither establishes a purchase price,
              shareholder proceeds, or a verified recurring-revenue denominator. The 2024 financing history is useful
              historical context, not a current entry price. The thesis would strengthen if Harness or the transaction
              parties disclosed consideration, retained-business scope, customer and revenue transfer, or continuing
              capitalization; it would weaken if the deal was primarily an asset or talent acquisition with limited
              monetizable revenue, if customer contracts did not transfer, or if credit-based usage produced weak gross
              margins. Vantaige's report that pricing changed twice in six months adds monetization risk that should be
              tested rather than assumed away. Immediate diligence should obtain the definitive agreement, cap table and
              liquidation preferences, audited or management financials, cohort retention, customer concentration, and
              post-transaction product plans. Limited consideration, inability to verify recurring revenue, or absent
              durable customer contracts are thesis-break triggers.
            claimRefs:
              - CV002
              - CV003
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more, not a price-insensitive buy
            body: >-
              The evidence supports strategic interest and product relevance, but the current price, proceeds,
              capitalization, and operating denominator are not public in the assigned sources. Require primary
              transaction and financial evidence before underwriting.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV011
              - CV012
              - CV013
          - type: callout
            title: Transaction scope is the central uncertainty
            body: >-
              Harness is reported to have acquired selected assets, not necessarily the whole company or all shareholder
              claims. Consideration, retained liabilities, customer transfer, and preference treatment must be verified.
            calloutType: risk
            claimRefs:
              - CV003
              - CV011
              - CV012
