        title: Capital history and public scale signals
        blocks:
          - type: paragraph
            body: >-
              The clearest historical capital marker is the April 2024 emergence from stealth: multiple secondary
              sources report $252 million raised in total, including a $227 million Series B, and a $977 million
              valuation. Those figures are financing history, not evidence of current cash, revenue, or enterprise
              value. Public operating metrics are materially weaker. IntelPilot reports roughly 156 employees and $155.7
              million of 2026 revenue, while Vantaige reports roughly $20 million of late-2025 ARR; the periods and
