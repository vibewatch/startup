        title: Milestones, product validation, and current continuity
        blocks:
          - type: paragraph
            body: >-
              Augment's public chronology shows rapid financing followed by agent and context product expansion: an
              agent launch in April 2025, two pricing-model changes during 2025, and Model Context Protocol access for
              the Context Engine in February 2026. Independent user-review evidence is positive on contextual
              suggestions but also flags irrelevant output, limited enterprise analytics, and the need for manual
              intervention. The latest corporate event is more consequential than another product release: Parsers.vc
              records Harness acquiring selected products, the Context Engine, and related technology, with the team
              joining Harness. Because the assigned pool lacks the underlying transaction announcement and terms, this
              chapter treats Augment's present standalone status, retained assets, liabilities, and capitalization as
