        title: Leadership, governance, and concentration
        blocks:
          - type: paragraph
            body: >-
              Vantaige and AI Central identify Igor Ostrovsky and Guy Gur-Ari as the technical founders and Scott
              Dietzen as a senior founding leader. Their backgrounds span large-scale storage architecture, Google AI
              research, and enterprise software leadership, which is directionally aligned with the product's
              large-codebase thesis. Current authority is not reliably established: one profile calls Dietzen executive
              chairman, another calls him chief executive, and a third records different CEO names while explicitly
              noting that the relationship is unclear. No assigned source supplies a current board roster, ownership
              table, voting rights, or post-acquisition management structure, leaving governance and key-person
              dependence as material diligence items.
