          detail: "Business plan reported at $100 monthly for up to 50 seats."
        - id: pooled-usage
          label: Included pooled usage
          detail: "$100 reported to cover tokens, service fees, and compute."
        - id: model-tokens
          label: Model-token consumption
          detail: "Reported at provider public list prices."
        - id: service-fee
          label: Service fee
          detail: "Reported at 40% of LLM spend."
        - id: cosmos-compute
          label: Cosmos compute
          detail: "Reported at $0.19 per sandbox hour."
        - id: revenue-to-gross-profit
          label: Revenue to gross profit
          detail: "Realized mix, recognition, provider rebates, and delivery costs unavailable."
    approximationNotes: >-
      Ordered conceptual flow only; it does not imply conversion rates,
      proportional values, recognized revenue, or gross margin.
    claimRefs: [CI001, CI002, CI014]
