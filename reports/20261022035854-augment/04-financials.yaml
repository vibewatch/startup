schemaVersion: "report-v2"
artifact: financials
slug: augment
runDate: 2026-10-22
company:
  name: Augment
chapter:
  number: 4
  title: Financials
  summary: >-
    Augment's public monetization model combines a $100 monthly Business plan,
    metered model usage, a 40% service fee, and separately metered Cosmos
    compute, but realized pricing and gross profit remain undisclosed. Third-party
    revenue signals conflict in definition and provenance, and the October 2026
    acquisition of select assets by Harness makes transaction scope, surviving
    liabilities, and stand-alone capital adequacy the central underwriting gaps.
sections:
  - id: revenue-model
    title: Revenue model and pricing architecture
    body: >-
      The clearest current public model is a hybrid subscription-and-consumption
      structure. A third-party June 2026 pricing review reports a Business plan
      at $100 per month for as many as 50 seats, with the same amount included
      for pooled usage; Enterprise is custom-priced. Usage economics are more
      explicit than realized revenue: model tokens are passed through at
      provider list prices with a 40% service fee, while Cosmos sandbox compute
      is reported at $0.19 per hour. This gives Augment three possible economic
      levers—base subscription, model-service markup, and compute—but public
      sources do not disclose customer-level discounts, overage incidence,
      Enterprise commitments, or revenue recognition. The bridge therefore
      maps billing mechanics rather than claiming a verified revenue mix or
      gross-profit conversion.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-sales-efficiency
    title: Traction and sales-efficiency signals
    body: >-
      Public traction is directional rather than underwriteable. GetLatka
      reports $20 million of annual revenue for October 2025 but explicitly says
      the source was not recorded; AI Central separately labels approximately
      $20 million as ARR in late 2025. Revenue and ARR are not interchangeable,
      and another retained directory says no public revenue or ARR data exist.
      Customer-review evidence is more useful for value discovery than for
      financial measurement: Gartner reviewers describe workflow benefits but
      also limited analytics and occasional irrelevant output, while one
      compiled customer example reports a shorter merge cycle. These signals
      can support willingness-to-pay hypotheses, but they do not reveal CAC,
      sales cycle, expansion, renewal, concentration, or payback.
    claimRefs: [CI006, CI007, CI008, CI012, CI013]
    tableRefs: [TI003]
  - id: cost-and-margin
    title: Cost structure and margin path
    body: >-
      The disclosed billing design exposes important cost drivers without
      proving margin. Model-token cost is largely variable and visible to the
      buyer, the 40% service fee is intended to fund the Context Engine and
      platform, and Cosmos compute is billed separately. SiliconANGLE reports
      Augment's claim that better context can improve coding-agent quality and
      reduce wasted tokens, which is a plausible customer-value mechanism but
      not evidence of Augment's own gross margin. Hosting, inference rebates,
      support, implementation, sales commissions, and research-and-development
      costs remain unavailable. Consequently, no defensible gross-margin,
      contribution-margin, or cash-payback estimate can be built from the
      retained public evidence, and the unit-economics table treats those fields
      as diligence requests rather than zeroes.
    claimRefs: [CI002, CI014, CI015, CI016]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy, transaction change, and verdict
    body: >-
      Third-party sources converge on $252 million raised historically, but
      funding raised is not cash on hand and says nothing about October 2026
      burn, runway, debt, or contractual obligations. More importantly, an
      October 2026 aggregator reproduces an announcement that Harness acquired
      select Augment assets, including Cosmos, Auggie CLI, the Context Engine,
      and related technology, with the team joining Harness. The word “select”
      prevents treating this as proof that every asset or liability transferred,
      and no retained source provides consideration or balance-sheet treatment.
      The financial verdict is therefore not a stand-alone growth underwriting:
      pricing has a legible usage-based architecture, but revenue quality,
      margin, cash needs, and the post-transaction entity perimeter are
      unresolved. Diligence should prioritize the purchase agreement, closing
      statement, retained liabilities, customer-contract assignment, and a
      monthly cohort-level operating model.
    claimRefs: [CI005, CI009, CI010, CI011, CI015, CI016]
callouts:
  - calloutType: risk
    title: Stand-alone underwriting is no longer the default frame
    body: >-
      The reported sale covered select assets and related technology, not an
      explicitly documented whole-company acquisition. Transaction scope,
      consideration, customer-contract assignment, and any residual entity must
      be established before applying conventional revenue or runway analysis.
    claimRefs: [CI010, CI011, CI015]
tables:
  - id: TI001
    title: Revenue streams and monetization status
    columns:
      - Stream
      - Mechanism
      - Billing unit
      - Current public status
      - Revenue quality
      - Diligence ask
    rows:
      - ["Business subscription", "Flat plan with pooled included usage", "$100 per month for up to 50 seats", "Reported current list offer", "List price only; realized revenue unknown", "Export contracts, invoices, discounts, and monthly recognized revenue"]
      - ["LLM usage", "Provider token cost plus service fee", "Provider token price plus 40%", "Reported current usage mechanic", "Variable and usage-linked; mix unknown", "Provide token cost, billed usage, rebates, and gross profit by cohort"]
      - ["Cosmos compute", "Metered sandbox runtime", "$0.19 per hour", "Reported current compute rate", "Usage-linked; infrastructure cost unknown", "Provide utilization, cloud cost, idle time, and contribution margin"]
      - ["Enterprise", "Custom commercial agreement", "Custom", "Unlimited seats reported; price undisclosed", "Potentially contracted but term and minimum unknown", "Provide ACV, term, minimum spend, renewals, and services allocation"]
      - ["Code Review", "Included product capability", "Included in paid plans", "No separate public price identified", "Bundled allocation unknown", "Show attach rate, usage cost, and standalone or bundled revenue treatment"]
    notes: >-
      Current list mechanics come primarily from Locoroo and AI Central; they
      are not audited realized pricing, revenue mix, or accounting policy.
    claimRefs: [CI001, CI002, CI003]
  - id: TI002
    title: Pricing evidence and underwriting interpretation
    columns:
      - Price or term
      - Public value
      - Evidence status
      - Underwriting interpretation
      - Required confirmation
    rows:
      - ["Business base plan", "$100 monthly", "Two 2026 reviews agree", "Low entry cost can widen team trials; no realized-price evidence", "Current order form and booked-price distribution"]
      - ["Included usage", "$100 pooled across usage categories", "Reported by two reviews", "Base fee may be substantially consumed by variable delivery cost", "Usage waterfall and deferred-revenue treatment"]
      - ["LLM service fee", "40% of model-token spend", "Reported by June 2026 review", "Visible markup is not equivalent to gross margin", "Provider rebates, bad debt, support, and platform cost allocation"]
      - ["Cosmos compute", "$0.19 per hour", "Reported by June 2026 review", "Separately metered but cloud-cost spread is unknown", "Infrastructure invoice reconciliation and utilization"]
      - ["Enterprise", "Custom", "Public price unavailable", "Enterprise mix and discounting cannot be modeled", "Signed agreements, ACV, duration, minimums, and concessions"]
    notes: >-
      Values are public list terms reported by third parties as of 2026; null or
      custom fields do not imply zero price, zero discount, or zero cost.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
  - id: TI003
    title: Unit economics and capital-adequacy diligence
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Annual revenue", "$20M for October 2025, source not recorded", "Low", "Directional scale only; not audited or current", "Monthly GAAP revenue ledger through closing"]
      - ["ARR", "~$20M in late 2025 from a low-tier review", "Low", "ARR definition may differ from revenue", "Contract-level ARR bridge with exclusions and FX"]
      - ["Gross margin", null, "Unavailable", "Determines whether service fee covers inference and platform delivery", "Gross margin by subscription, tokens, compute, and services"]
      - ["CAC and sales cycle", null, "Unavailable", "Enterprise motion may require material sales and implementation cost", "Cohort CAC, fully loaded commissions, and median cycle"]
      - ["Payback and NRR", null, "Unavailable", "Tests durability of usage expansion and pricing", "Logo and dollar retention plus CAC payback by cohort"]
      - ["Cash, burn, and runway", null, "Unavailable", "Historical funding does not establish current liquidity", "Monthly cash, net burn, restricted cash, and runway plan"]
      - ["Debt and obligations", null, "Unavailable", "Transaction and hosting commitments may alter capital needs", "Debt schedule, cloud commitments, leases, and change-of-control clauses"]
      - ["Transaction consideration", null, "Unavailable", "Select-asset sale prevents a clean stand-alone valuation bridge", "Purchase agreement, consideration waterfall, and retained liabilities"]
    notes: >-
      The table separates third-party-reported revenue and ARR labels; null means
      no usable value appears in the retained source set, not that the metric is zero.
    claimRefs: [CI006, CI007, CI008, CI009, CI010, CI015, CI016]
figures:
