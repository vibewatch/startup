    notes: "Assessment is an analyst synthesis of the cited public evidence; unknown valuation is not treated as zero."
    claimRefs: [CV003, CV005, CV011, CV012]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Enterprise product differentiation", "Tracxn describes AI coding and developer-productivity tooling; Gartner reviews cite contextual understanding and IDE integration.", "Independent deployment and renewal data would confirm durable willingness to pay."]
      - ["Institutional financing signal", "Tracxn reports $252M raised across three rounds.", "Current cap table, preference stack, and post-2024 financing would show whether capital translated into equity value."]
      - ["Strategic validation", "SiliconANGLE reports Harness acquired selected Augment assets in October 2026.", "Consideration, scope, customer transfer, and continuing operations would determine shareholder value."]
      - ["Thin public economics", "Assigned sources do not establish current ARR, growth, margin, retention, burn, or runway.", "Audited or management financials and cohort data would permit model-based valuation."]
      - ["Execution and pricing risk", "Vantaige describes credit-based pricing and reports that pricing changed twice in six months.", "Contracted pricing, usage costs, renewal rates, and gross margin would test monetization quality."]
    notes: "Rows distinguish positive thesis signals from unresolved anti-thesis evidence; absence of disclosure is a diligence gap, not proof of poor performance."
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV007, CV008, CV009, CV014, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Harness paid meaningful consideration for a broad asset set; customers and recurring revenue transferred; economics are healthy.", "Strategic takeout value can support an attractive outcome, but no price or return can be calculated from assigned evidence.", "Low-to-medium; requires transaction documents.", "Consideration or customer transfer is materially below expectations."]
      - [Base, "Asset acquisition validates product value but scope, proceeds, and standalone economics remain unclear.", "Research-more is appropriate; no defensible current multiple or target return.", "Medium; consistent with disclosed facts and gaps.", "No continuing commercial product or evidence of recurring revenue."]
      - [Bear, "Asset-only transaction, weak customer transfer, or high cost-to-serve leaves limited value for existing equity.", "Downside may include little or no recoverable common-equity value; exact loss is unknowable.", "Material; cannot be dismissed without primary evidence.", "Transaction documents show limited consideration or preference overhang."]
      - [Diligence gate, "Obtain transaction agreement, cap table, ARR, growth, gross margin, retention, burn, runway, and concentration.", "Only after the gate can a comparable or cash-flow model be selected.", "Required before investment approval.", "Any critical item remains unavailable or contradictory."]
      - [Comparable set, "Tracxn reports total funding of $223M for Sourcegraph, $102M for Tabnine, $16.2M for Codegen, and $466M for Magic AI.", "These are financing totals, not valuation or revenue-multiple observations; do not apply them as price benchmarks.", "Context only.", "Comparable economics and transaction values remain unavailable."]
    notes: "Scenarios are qualitative because assigned sources do not disclose transaction consideration, current valuation, or a revenue denominator; no probability-weighted value is invented."
    claimRefs: [CV003, CV005, CV007, CV011, CV012, CV013, CV014, CV015]
