callouts:
  - calloutType: recommendation
    title: Research-more, not a price-insensitive buy
    body: The evidence supports strategic interest and product relevance, but the current price, proceeds, capitalization, and operating denominator are not public in the assigned sources. Require primary transaction and financial evidence before underwriting.
    claimRefs: [CV003, CV005, CV007, CV011, CV012, CV013]
  - calloutType: risk
    title: Transaction scope is the central uncertainty
    body: Harness is reported to have acquired selected assets, not necessarily the whole company or all shareholder claims. Consideration, retained liabilities, customer transfer, and preference treatment must be verified.
    claimRefs: [CV003, CV011, CV012]
