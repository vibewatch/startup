schemaVersion: "report-v2"
artifact: customers
slug: augment
runDate: 2026-10-22
company:
  name: Augment
chapter:
  number: 6
  title: Customers
  summary: Augment is positioned for enterprise engineering teams with large, complex codebases, and current public evidence includes a named customer interview, a structured peer-review record, and several directory-level descriptions. The evidence supports target-segment fit and active adoption signals, but not a verified customer count, renewal rate, net retention, or customer concentration profile.
sections:
  - id: customer-segments-and-buyers
    title: Customer segments and buying motion
    body: >-
      The clearest customer segment is the enterprise engineering organization rather than the
      individual developer seeking inexpensive autocomplete. WorkOS's April 2026 interview with
      Augment's CEO describes financial institutions, media companies, and a large furniture
      company building toward agent-heavy software engineering, while AIIDEList describes the
      product as best for enterprise engineering teams, large monorepos, production refactors,
      and repository-scale debugging. The buyer is therefore likely an engineering or technology
      organization with a complex repository and governance requirements; the end user is the
      engineer, technical lead, or reviewer who needs repository context. The public record does
      not disclose segment-level revenue, account counts, geography mix, or a verified payer
      profile, so those remain diligence questions rather than quantified conclusions.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-durability
    title: Adoption signals and durability
    body: >-
      Public evidence shows several adoption surfaces but not durable cohort economics. The WorkOS
      interview provides a current qualitative signal that large, regulated and risk-aware
      enterprises are making infrastructure bets around agentic coding. Gartner Peer Insights
      presents a 4.8 rating from 42 ratings and includes reviews from software, telecom, and IT
      services employees; those reviews praise context-aware suggestions, codebase understanding,
      and code review while also noting occasional irrelevant or generic outputs and limited
      analytics. These signals are useful for product reception, but they do not prove active
      account retention, renewal, expansion, or production-wide deployment. Pricing and usage
      volatility are also relevant to durability: AIIDEList says usage-based billing can be harder
      to predict, and the WorkOS interview calls usage spiky, hard to predict, and growing fast.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
  - id: named-proof-and-concentration
    title: Named customer proof and concentration gaps
    body: >-
      Named proof is uneven. The WorkOS interview identifies financial institutions, media
      companies, and a large furniture company only at category level, without names or deployment
      outcomes. The assigned directory sources describe enterprise use cases and integrations but
      do not independently establish production status, contract size, renewal, or expansion.
      Gartner's review page adds named reviewer contexts and dated user comments, which is stronger
      than a logo-only claim, but the record remains a small public sample and is not a customer
      census. Consequently, the report can support a thesis that Augment has credible enterprise
      adoption signals, not a claim that adoption is broad, retained, or concentrated in any
      particular account. Customer references, cohort retention, account-level usage, pilot-to-
      production conversion, and top-account exposure are the highest-value diligence asks.
    claimRefs: [CU010, CU011, CU012, CU013]
    tableRefs: [TU003]
    figureRefs: [FU001]
