      - [Large monorepo and production-code organizations, "Engineering leaders and senior maintainers", "Cross-file context, repository debugging, code review, and modernization", "Potentially high value when context retrieval is the bottleneck", "AIIDEList lists large monorepos and production refactors; no independently measured ROI"]
      - [Regulated or governance-sensitive enterprises, "Security, procurement, and engineering stakeholders", "Governed AI-assisted development and enterprise controls", "Compliance and control requirements can support enterprise expansion", "Directory material cites enterprise security features; certification and deployment scope require diligence"]
      - [Individual or small-project developers, "Individual developer payer and user", "Simple coding assistance and lightweight workflows", "Lower strategic value and weaker fit than complex repositories", "AIIDEList says the product is not best for solo developers seeking the cheapest autocomplete"]
    notes: "Segments combine current public positioning with qualitative customer evidence; no source discloses segment revenue, account counts, or payer mix, and null-like gaps are not estimates."
    claimRefs: [CU001, CU002, CU003, CU004]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Metric, Value, Date, Source, Confidence, Implication, Missing denominator]
    rows:
      - ["Peer rating", "4.8 rating from 42 ratings", "2026 page; reviews dated 2025-11 to 2026-03", "Gartner Peer Insights", "medium", "Positive public product-reception signal", "Reviewer population is not an active-customer census"]
      - ["Enterprise adoption signal", "Financial institutions, media companies, and a large furniture company described as actively building toward agent-heavy engineering", "2026-04-15", "WorkOS interview with Augment CEO", "medium", "Supports enterprise demand and use-case breadth", "Company names, contract status, deployment scale, and outcomes are not disclosed"]
      - ["Usage predictability", "Usage described as spiky, hard to predict, and growing fast", "2026-04-15", "WorkOS interview with Augment CEO", "medium", "Budgeting friction may affect procurement and renewal", "No usage distribution, spend per account, or churn linkage"]
      - ["Customer satisfaction", "Review comments are favorable overall but mention occasional irrelevant or generic suggestions and limited analytics", "2025-11 to 2026-03", "Gartner Peer Insights", "medium", "Signals product value with execution and observability caveats", "Small and potentially self-selected public review sample"]
    notes: "Values are retained as reported by the cited sources; public evidence does not provide a customer-count series, active-use denominator, cohort table, renewal rate, NRR, GRR, or churn."
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or group, Segment, Deployment or use case, Production vs pilot, Outcome, Limitation]
    rows:
      - ["Financial institutions (unnamed)", "Regulated enterprise engineering", "Building toward software engineering organizations where agents handle much of implementation", "Status described qualitatively; production scope not established", "Shows reported enterprise interest in agentic workflows", "No customer names, contract evidence, usage, or outcome metric"]
      - ["Media companies (unnamed)", "Enterprise engineering", "Building toward agent-heavy software implementation", "Status described qualitatively; production scope not established", "Shows use-case breadth beyond startups", "No deployment scale, renewal, or outcome metric"]
      - ["Large furniture company (unnamed)", "Large enterprise engineering", "Building toward agent-heavy software implementation", "Status described qualitatively; production scope not established", "Shows adoption interest in a non-software vertical", "No customer name, production evidence, or quantified benefit"]
      - ["Gartner reviewer: Team Lead, Security Operations", "Software organization", "Context-aware coding suggestions, code review, and codebase explanation", "User review; deployment scale not stated", "5.0 review and favorable productivity comments", "Public review is a single reviewer account, not retention evidence"]
      - ["Gartner reviewer: Engineer", "Telecommunication", "Context-aware suggestions, complex-codebase understanding, and code review", "User review; deployment scale not stated", "5.0 review and stated workflow benefit", "No account identity, contract duration, or renewal data"]
      - ["Gartner reviewer: Operations Associate", "IT services", "Context-aware coding assistance in daily workflows", "User review; deployment scale not stated", "5.0 review and positive consistency comments", "No production breadth, expansion, or independent outcome measure"]
    enumerationScope:
      coverage: sample
      basis: "Publicly visible 2025-2026 customer and reviewer references retained in the assigned source pool; not a complete account census."
    notes: "The table intentionally distinguishes unnamed customer groups and reviewer accounts from named production deployments; no retained source establishes a complete named-customer list or pilot-to-production conversion."
    claimRefs: [CU010, CU011, CU012, CU013]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: "Augment's public customer path runs from complex-codebase pain through governed adoption, but the expansion and retention stages remain unverified."
    data:
      items:
        - stage: "Problem fit"
          label: "Problem fit"
          title: "Complex repository or large-codebase pain"
          detail: "Teams seek context across dependencies, documentation, and multiple files."
          claimRefs: [CU001, CU002]
        - stage: "Evaluation"
          label: "Evaluation"
          title: "Repository-aware coding and review"
          detail: "Potential buyers assess context quality, code review, governance, and workflow fit."
          claimRefs: [CU003, CU005]
        - stage: "Pilot"
          label: "Pilot"
          title: "Engineer and reviewer use"
          detail: "Public reviews describe coding suggestions, codebase understanding, and code review."
          claimRefs: [CU006, CU007]
        - stage: "Production adoption"
          label: "Production adoption"
          title: "Enterprise agent workflows"
          detail: "WorkOS reports enterprise organizations building toward agent-heavy implementation."
          claimRefs: [CU008]
        - stage: "Expansion"
          label: "Expansion"
          title: "Broader teams, tools, or workflows"
          detail: "Potential expansion is plausible from enterprise positioning, but no retained source quantifies it."
          claimRefs: [CU009, CU013]
        - stage: "Retention proof"
          label: "Retention proof"
          title: "Renewal, cohorts, and concentration"
          detail: "NRR, GRR, churn, contract duration, top-account share, and pilot conversion remain open."
          claimRefs: [CU010, CU011, CU012]
    approximationNotes: "The map is an evidence-organized workflow, not a measured conversion funnel; stages after public product reception are explicitly unverified."
    claimRefs: [CU001, CU005, CU008, CU010, CU013]
callouts:
  - calloutType: strength
    title: "Enterprise fit is more credible than broad customer scale"
    body: "The strongest evidence supports a specific buyer problem—large, complex, and governance-sensitive engineering environments—rather than a quantified customer base."
    claimRefs: [CU001, CU002, CU003]
  - calloutType: risk
    title: "Retention and concentration are not publicly measurable"
    body: "No retained source supplies NRR, GRR, churn, renewal terms, account concentration, or a complete named deployment list; these gaps limit confidence in durability."
    claimRefs: [CU010, CU011, CU012, CU013]
