  evidenceGaps:
    - type: missing-source
      severity: material
      topic: product-continuity
      missingEvidence: Primary transaction confirmation, exact transferred assets, current product availability, support ownership, and post-acquisition roadmap.
      whyItMatters: A transfer of core product assets could change deployment support, integration commitments, packaging, and the durability of the existing roadmap.
      diligencePath: Obtain the Harness and Augment transaction announcements, customer migration terms, current service documentation, and a dated post-acquisition roadmap.
      relatedQuestionRefs: [QE003]
    - type: missing-source
      severity: material
      topic: trust
      missingEvidence: Independent security audit, penetration-test summary, data-processing terms, model-provider boundaries, and customer-managed access-control documentation.
      whyItMatters: The product processes source code and can execute or apply changes, so security and data-boundary evidence is central to enterprise deployment risk.
      diligencePath: Request current SOC or ISO certificates, audit scope, subprocessors, retention policy, encryption details, tenant-isolation controls, and a security questionnaire response.
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: material
      topic: reliability
      missingEvidence: Independent benchmarks for context freshness, retrieval quality, task success, false-positive rate, rollback frequency, and service availability.
      whyItMatters: Context quality and safe change application are the core value proposition, but the assigned public evidence does not establish comparable performance.
      diligencePath: Obtain customer-validated benchmark methodology, production incident history, status-page history, and representative before-and-after task results.
      relatedQuestionRefs: [QE005, QE006]
    - type: access-blocked
      severity: material
      topic: integrations
      missingEvidence: Detailed documentation for connector permissions, MCP scopes, audit logging, and failure isolation.
      whyItMatters: External-tool access can expand the blast radius of an erroneous or compromised agent action.
      diligencePath: Run a technical workshop covering connector scopes, credential storage, approval gates, logs, rate limits, and revocation behavior.
      relatedQuestionRefs: [QE008]
