      - ["Context layer", "Uses codebase, API, schema, dependency, and documentation context", "Customer repositories and documentation", "Request indexing freshness, tenant isolation, and retrieval-quality evidence"]
      - ["Agent layer", "Completes tasks and solves production problems", "Foundation models and tool execution", "Identify model providers, permissions, approval gates, and rollback controls"]
      - ["Integration layer", "Extends the workflow through native integrations and MCP tools", "Third-party systems and connector credentials", "Review scopes, logging, rate limits, and failure containment"]
      - ["Review / SDLC layer", "Public summaries describe code review, PR management, and incident-response use cases", "Git hosting and operational data", "Verify product availability, audit trails, and measured outcomes"]
    notes: This is a public-surface architecture model, not a verified implementation diagram; the key technical components and controls require direct vendor diligence.
    claimRefs: [CE004, CE005, CE007, CE008, CE012]
