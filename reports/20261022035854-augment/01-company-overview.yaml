schemaVersion: "report-v2"
artifact: company-overview
slug: augment
runDate: 2026-10-22
company:
  name: Augment
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Augment built an enterprise AI coding platform around persistent codebase context and
    raised a reported $252 million by April 2024, including a $227 million Series B at a
    reported $977 million valuation. The current investment perimeter is unclear because
    a secondary news aggregator records Harness acquiring select Augment Code assets and
    hiring the associated team on October 9, 2026.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Secondary profiles consistently place Augment's founding in 2022 and describe an
      enterprise-focused AI coding platform for teams working in large, complex codebases.
      Gartner lists Palo Alto as the head-office location, while IntelPilot characterizes
      the model as B2B SaaS and reports a shift toward usage-based pricing. The product is
      distributed through developer workflows rather than a standalone greenfield-only
      proposition: reviewed sources describe IDE, command-line, code-review, and context
      services aimed at multi-repository engineering environments. These points establish
      the historical operating identity, but they do not establish the legal entity,
      product ownership, or office footprint after the reported October 2026 asset sale.
    claimRefs: [CO001, CO002, CO003, CO014, CO016]
    tableRefs: [TO001]
  - id: capital-and-public-scale-signals
    title: Capital history and public scale signals
    body: >-
      The clearest historical capital marker is the April 2024 emergence from stealth:
      multiple secondary sources report $252 million raised in total, including a $227
      million Series B, and a $977 million valuation. Those figures are financing history,
      not evidence of current cash, revenue, or enterprise value. Public operating metrics
      are materially weaker. IntelPilot reports roughly 156 employees and $155.7 million
      of 2026 revenue, while Vantaige reports roughly $20 million of late-2025 ARR; the
      periods and metric definitions differ, and CheckThat says no public revenue or
      ARR/MRR figures exist. The apparent conflict requires primary financial evidence
      before either figure is used for valuation.
    claimRefs: [CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO003]
  - id: leadership-and-governance
    title: Leadership, governance, and concentration
    body: >-
      Vantaige and AI Central identify Igor Ostrovsky and Guy Gur-Ari as the technical
      founders and Scott Dietzen as a senior founding leader. Their backgrounds span
      large-scale storage architecture, Google AI research, and enterprise software
      leadership, which is directionally aligned with the product's large-codebase thesis.
      Current authority is not reliably established: one profile calls Dietzen executive
      chairman, another calls him chief executive, and a third records different CEO
      names while explicitly noting that the relationship is unclear. No assigned source
      supplies a current board roster, ownership table, voting rights, or post-acquisition
      management structure, leaving governance and key-person dependence as material
      diligence items.
    claimRefs: [CO004, CO005, CO016]
    tableRefs: [TO002]
  - id: milestones-and-current-continuity
    title: Milestones, product validation, and current continuity
    body: >-
      Augment's public chronology shows rapid financing followed by agent and context
      product expansion: an agent launch in April 2025, two pricing-model changes during
      2025, and Model Context Protocol access for the Context Engine in February 2026.
      Independent user-review evidence is positive on contextual suggestions but also
      flags irrelevant output, limited enterprise analytics, and the need for manual
      intervention. The latest corporate event is more consequential than another product
      release: Parsers.vc records Harness acquiring selected products, the Context Engine,
      and related technology, with the team joining Harness. Because the assigned pool
      lacks the underlying transaction announcement and terms, this chapter treats Augment's
      present standalone status, retained assets, liabilities, and capitalization as
      unresolved rather than carrying forward its pre-transaction stage.
    claimRefs: [CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
