  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: acquisition
      missingEvidence: >-
        The executed purchase agreement, complete asset and liability schedules, surviving
        legal entities, consideration, employee transfer list, and capitalization effects.
      whyItMatters: >-
        Without the transaction perimeter, investors cannot tell whether Augment remains a
        standalone investable company or which historical metrics still describe the entity.
      diligencePath: >-
        Obtain the definitive transaction documents, corporate registry extracts, current
        cap table, and written confirmation from Harness and Augment counsel.
      relatedQuestionRefs: [QO009]
      relatedTableRefs: [TO001, TO003]
    - type: conflicting-data
      severity: material
      topic: leadership
      missingEvidence: >-
        A dated official leadership and board roster showing titles, reporting lines,
        retention arrangements, voting rights, and post-transaction responsibilities.
      whyItMatters: >-
        Conflicting executive titles prevent a reliable assessment of governance,
        founder dependence, and accountability after the reported asset transfer.
      diligencePath: >-
        Request board minutes, employment and retention agreements, the current
        organization chart, and direct management confirmation.
      relatedQuestionRefs: [QO002, QO009]
      relatedTableRefs: [TO002]
    - type: conflicting-data
      severity: material
      topic: revenue
      missingEvidence: >-
        Audited or management-certified revenue, ARR, customer count, gross margin,
        retention, burn, cash, and runway using explicit definitions and periods.
      whyItMatters: >-
        Revenue, ARR, and funding are not interchangeable, and the available secondary
        values cannot support a current scale or valuation conclusion.
      diligencePath: >-
        Review monthly financial statements, bank balances, ARR bridge, customer-level
        billing export, cohort retention, and the post-transaction operating plan.
      relatedQuestionRefs: [QO004, QO009]
      relatedTableRefs: [TO001]
    - type: enumeration-incomplete
      severity: material
      topic: ownership
      missingEvidence: >-
        A fully diluted pre- and post-transaction capitalization table including investors,
        employee options, convertibles, debt, preferences, and board designation rights.
      whyItMatters: >-
        Public investor names do not reveal control, proceeds, liquidation preferences,
        dilution, or remaining economic exposure.
      diligencePath: >-
        Obtain the latest signed cap table, financing documents, option ledger, debt
        schedule, and transaction waterfall.
      relatedQuestionRefs: [QO003, QO006, QO009]
      relatedTableRefs: [TO003]
