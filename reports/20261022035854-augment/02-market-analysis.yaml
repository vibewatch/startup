    claimRefs: [CM005, CM007, CM008, CM013, CM016]
callouts:
  - calloutType: insight
    title: Credible wedge, incomplete denominator
    body: "Augment appears positioned for a real enterprise workflow problem, but the assigned evidence does not establish the number of eligible organizations, paid seats, or obtainable share."
    claimRefs: [CM002, CM008, CM013]
  - calloutType: risk
    title: Procurement and price uncertainty
    body: "Conflicting public plan descriptions, usage-based charges, and an October 2026 asset acquisition make current packaging, budget predictability, and buyer continuity important diligence items."
    claimRefs: [CM011, CM012, CM014]
