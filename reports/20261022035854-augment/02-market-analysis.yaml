schemaVersion: "report-v2"
artifact: market-analysis
slug: augment
runDate: 2026-10-22
company:
  name: Augment
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Augment addresses a specific slice of developer tooling: AI-assisted software
    engineering for teams whose repositories, workflows, and compliance requirements
    make shallow code completion insufficient. Public evidence supports a differentiated
    enterprise use case and visible price points, but does not support a defensible
    company-specific SAM or SOM, so the sizing view separates category evidence from
    Augment's serviceable wedge.
sections:
  - id: market-boundary
    title: Market boundary and category position
    body: >-
      The relevant market is not all generative AI or all developer productivity
      software. It is the spend on AI-enabled software-engineering workflows: code
      understanding, agentic implementation, code review, debugging, migration,
      onboarding, and the controls needed to deploy those workflows inside an
      organization. The inclusion boundary covers software subscriptions and usage
      budgets paid by engineering organizations for those activities. It excludes
      general-purpose chat, model infrastructure sold to developers, conventional
      IDE licenses, and unassisted consulting labor. Augment's public positioning is
      unusually specific within that boundary: the pool describes a platform built
      around multi-repository context, autonomous agents, and broader SDLC integration,
      while a 2026 SiliconANGLE report describes its Context Engine MCP as a way to
      make semantic code context available to other agents. This creates a plausible
      wedge between generic completion and enterprise codebase intelligence, but the
      evidence is largely product and market commentary rather than audited category
      revenue. The category should therefore be treated as an adoption opportunity,
      not as a verified company revenue pool.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing through multiple lenses
    body: >-
      The evidence supports three different sizing lenses, none of which should be
      silently combined. First, a third-party market view in the assigned pool says
      the AI coding assistant market was projected at $20–30 billion by 2025, while
      another calls it a $6 billion market in 2026 growing at 22% CAGR. Neither fetched
      page exposes a methodology, and the incompatible vintages and values should not
      be normalized or treated as Augment's obtainable market. Second, a bottom-up
      price lens is observable: public plan descriptions put entry pricing at $20 per
      month, a team plan at $60 or $100 per month depending on the reviewed page and
      plan vintage, and enterprise pricing at custom rates. These are list-price
      anchors, not realized ARR or wallet share. Third, an evidence-constrained
      serviceable wedge is defined by teams with large or multi-repository codebases,
      complex migrations, regulated-data requirements, or a need for cross-tool
      context. The pool provides buyer and use-case descriptions for that wedge, but
      no verified count of eligible companies, seats, conversion, or net retention.
      Accordingly, the opportunity may support enterprise software economics, but the
      investable sizing remains a diligence gap.
    claimRefs: [CM005, CM006, CM007, CM008, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyers, adoption drivers, and constraints
    body: >-
      The primary economic buyer is likely a VP of Engineering, CTO, or engineering
      platform leader; senior engineers, technical leads, architects, and security
      teams are users or influencers. The buyer's budget case is strongest when
      context loss, migration backlog, code-review throughput, onboarding time, or
      compliance controls are visible operating constraints. The reviewed buyer
      descriptions point to mid-sized and large software organizations with multiple
      repositories and legacy or polyglot systems, while Gartner peer material in the
      pool records positive user ratings but also mentions occasional irrelevant
      suggestions, limited analytics, and manual intervention to avoid hallucination.
      That combination matters: the adoption trigger is not simply interest in AI, but
      a measurable workflow bottleneck that justifies a new line item and human
      oversight. Switching costs can rise through indexed code, workflow integrations,
      memories, and review processes, yet those same integrations create data-governance
      and portability questions. Pricing uncertainty is material because usage-based
      inference fees, top-ups, and differences between public plan descriptions make
      annual budget predictability harder to assess. Finally, the October 2026
      acquisition of selected Augment assets by Harness, as recorded by the assigned
      sources, is a market-structure event whose effect on existing plans and buyer
      confidence was not publicly clarified in those sources; it is a current diligence
      question rather than evidence of either acceleration or deterioration.
    claimRefs: [CM009, CM010, CM011, CM012]
    tableRefs: [TM003]
  - id: market-gaps
    title: Sizing and adoption gaps
    body: >-
      Public material is sufficient to map the product category and likely buying
      motion, but not to underwrite market share. The missing denominators include the
      number of target engineering organizations, eligible seats per organization,
      paid versus trial conversion, realized price after discounts, usage expansion,
      renewal and multi-homing behavior, and the share of deployments that require
      enterprise controls. The pool also contains conflicting or time-sensitive
      commercial descriptions: one reviewed page lists Indie, Standard, Max, and
      Enterprise tiers, while another describes Standard and Business plans and a
      later asset-acquisition event. These differences may reflect plan changes or
      source quality, so they should not be normalized into a single price curve.
      The prudent market stance is therefore “credible category wedge, unverified
      serviceable market.” A buyer interview set, current price card, cohort-level
      retention data, and an independent market methodology would materially improve
      confidence.
    claimRefs: [CM013, CM014, CM015]
tables:
  - id: TM001
    title: Market definition and budget ownership
    columns: [Segment or category, Included spend, Excluded or substitute spend, Buyer / payer, Relevance to Augment]
    rows:
      - [AI coding assistants, "Code generation, review, debugging, and agent usage subscriptions", "General-purpose chat and model API infrastructure", "Engineering leadership; sometimes developer tooling", "Core category but incumbent-heavy"]
      - [Codebase intelligence, "Indexing, semantic search, dependency context, and cross-repository grounding", "Conventional IDE search and static documentation alone", "Platform engineering or architecture budget", "Closest differentiated wedge"]
      - [Agentic SDLC workflows, "Ticket-to-PR, migration, review, incident and remediation automation", "Custom consulting projects and unrelated workflow SaaS", "VP Engineering, CTO, or transformation program", "Expansion path if outcomes are proven"]
      - [Enterprise AI governance, "SSO, SCIM, CMEK, data residency, audit and support controls", "Generic security tooling not tied to developer AI", "Security and procurement co-owners", "Enabler for regulated adoption"]
    notes: "Boundary synthesized from the assigned market and product sources; categories are analytical groupings, not reported market shares, and excluded spend is not independently measured."
    claimRefs: [CM001, CM002, CM009]
  - id: TM002
    title: Market sizing lenses and evidence limits
    columns: [Lens, Publisher / year, Geography, Value or anchor, Methodology visible in pool, Confidence, Limitation]
    rows:
      - [Broad category estimate A, "CheckThat.ai / 2026 page", "Not stated", "$20–30bn projected AI coding assistant market by 2025", "Underlying market research and method not identified", low, "Broad category figure is not Augment TAM"]
      - [Broad category estimate B, "Baeseokjae / 2026 review", "Not stated", "$6bn in 2026 with 22% CAGR", "Method not disclosed in fetched text", low, "Conflicts with estimate A and is not an Augment-specific denominator"]
      - [Public entry price, "The AI Agent Index / 2026 page", "US dollars", "$20 per month Standard plan", "Plan description", medium, "List price; usage and conversion unknown"]
      - [Team price, "Baeseokjae / 2026 review", "US dollars", "$60 per month Standard plan", "Plan description", medium, "Conflicts with another reviewed plan description"]
      - [Enterprise price, "Baeseokjae / 2026 review", "US dollars", "Custom pricing; unlimited users described", "Plan description", medium, "No realized contract value or seat count"]
      - [Serviceable wedge, "Multiple assigned sources / 2026", "Not stated", "Large, multi-repository engineering teams", "Use-case and buyer segmentation", medium, "No organization or seat denominator"]
      - [Company obtainable share, "Assigned pool", "Not stated", null, "No public company-specific denominator", low, "Requires target-account, conversion, retention, and price data"]
    notes: "Values retain publisher, year, currency, and uncertainty. The two broad estimates are non-comparable third-party statements with no visible methodology; null means the assigned evidence does not support a numeric company SOM."
    claimRefs: [CM005, CM006, CM007, CM008, CM013, CM016]
  - id: TM003
    title: Buyer, user, payer, and adoption map
    columns: [Segment, Buyer, User / influencer, Budget owner, Adoption trigger, Constraint or diligence ask]
    rows:
      - [Large software enterprise, "VP Engineering or CTO", "Staff engineers, architects, platform teams", "Engineering productivity or platform", "Cross-service changes and legacy complexity", "Prove productivity and renewal outcomes"]
      - [Regulated engineering organization, "CTO with security and procurement", "Developers plus security reviewers", "Engineering plus security", "Need for SSO, CMEK, data residency, or auditability", "Validate deployment and data-handling requirements"]
      - [Mid-market SaaS team, "Engineering leader", "Developers and tech leads", "Developer tooling", "Migration backlog, onboarding, review throughput", "Compare realized price with incumbent tools"]
      - [Individual or small team, "Developer or team lead", "Same person or small team", "Individual or team subscription", "Large codebase navigation or complex refactoring", "Test whether context benefit exceeds simpler tools"]
      - [System-integrator channel, "Partner account owner and customer CTO", "Delivery engineers", "Customer transformation budget", "Repeatable enterprise rollout", "Confirm partner economics and attribution"]
    notes: "Buyer roles and triggers are evidence-backed hypotheses from the assigned pool; no source provides a complete enumeration of customers, budgets, or conversion rates."
    claimRefs: [CM009, CM010, CM011, CM012]
