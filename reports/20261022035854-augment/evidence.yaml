      - QM005
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: pricing
    missingEvidence: A current official price card and contract-level explanation of usage fees, top-ups, and enterprise packaging.
    whyItMatters: Conflicting public plans make budget predictability and cross-source market comparisons unreliable.
