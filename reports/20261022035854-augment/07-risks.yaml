callouts:
  - calloutType: recommendation
    title: Thesis-break and monitoring triggers
    body: >-
      Pause expansion if transaction diligence cannot establish customer and IP continuity, if a
      material control exception remains open, if representative pilots show repeated uncontained
      code or data incidents, if credit cost cannot be bounded contractually, or if management cannot
      provide current runway, retention, and concentration evidence. Monitor product deprecations,
      support ownership, incident response, rollback performance, provider-cost pass-through, renewal
      terms, and customer-reference continuity through the Harness integration.
    claimRefs: [CR001, CR002, CR007, CR008, CR014, CR015, CR016]
