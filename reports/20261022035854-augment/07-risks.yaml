schemaVersion: "report-v2"
artifact: risks
slug: augment
runDate: 2026-10-22
company:
  name: Augment
chapter:
  number: 7
  title: Risks
  summary: >-
    Augment's risk profile is dominated by the announced sale of select assets to Harness, the
    blast radius of autonomous code and terminal actions, and commercial opacity around pricing
    and private-company economics. Reported compliance controls reduce but do not resolve exposure
    because the assigned evidence contains no primary assurance reports, incident record, or audited
    financial disclosure.
sections:
  - id: severity-ranked-risk-posture
    title: Severity-ranked risk posture
    body: >-
      The highest-priority risk is execution through transition. A Harness-issued announcement
      reproduced by Parsers.vc says Harness acquired select Augment assets, including Cosmos, the
      Auggie CLI, and the Code Context Engine, and that the team behind those products would join
      Harness. That event makes product continuity, customer-contract assignment, roadmap ownership,
      and integration execution immediate diligence questions rather than hypothetical long-term
      risks. The next tier combines autonomous-action risk with commercial volatility: public user
      material describes terminal execution and database migrations, Gartner reviewers identify
      hallucination-related manual intervention, and independent reviews describe pricing changes
      and undisclosed credit-consumption rates. These signals do not establish measured incident
      probabilities, so likelihood labels below are qualitative and residual severity stays high
      where mitigation evidence is only reported rather than independently verified.
    claimRefs: [CR001, CR002, CR009, CR010, CR014, CR015]
    figureRefs: [FR001]
  - id: regulatory-legal-and-control-assurance
    title: Regulatory, legal, and control assurance
    body: >-
      Secondary sources associate Augment with SOC 2 Type II, ISO/IEC 42001, customer-managed
      encryption keys, role-based access controls, audit logging, sandboxed execution, and
      no-training or zero-retention options. Those are relevant mitigations, but they do not
      establish the current audit period, scope, exceptions, shared-control obligations, subprocessor
      chain, or contractual remedies for a particular buyer. The assigned source pool also contains
      no primary litigation docket, regulator record, breach disclosure, or intellectual-property
      schedule. Silence in this pool must remain a gap, not evidence of a clean history. Legal
      approval should therefore require auditor-issued reports, the data-processing agreement,
      incident-notification terms, customer-data and model-training restrictions, indemnities, and
      confirmation of how the Harness transaction affects licenses and customer obligations.
    claimRefs: [CR001, CR007, CR008, CR010, CR011]
    tableRefs: [TR001]
  - id: operational-quality-and-security
    title: Operational, quality, and security exposure
    body: >-
      Augment's product can act across code, terminals, databases, and connected development systems,
      so an inaccurate instruction or stale context can propagate beyond a wrong suggestion. A
      developer account describes the agent finding an execution error and attempting a fix, while
      Gartner's review summary says manual intervention can be needed to avoid hallucination.
      SiliconANGLE also reports Augment's own explanation that agents hallucinate and waste tokens on
      irrelevant context. Checkpoints, sandboxing, access controls, and audit logs are useful
      mitigations, but the pool supplies no independent uptime, rollback-time, incident-rate,
      penetration-test, or false-positive measurements. A production pilot should therefore use
      least privilege, mandatory review for consequential actions, representative failure injection,
      rollback tests, and monitored usage ceilings before autonomy expands.
    claimRefs: [CR002, CR003, CR005, CR008, CR009, CR010, CR011]
    tableRefs: [TR002]
  - id: partner-commercial-and-financial-dependencies
    title: Partner, commercial, and financial dependencies
    body: >-
      The asset acquisition concentrates near-term execution on Harness's integration decisions and
      creates uncertainty over product packaging, support ownership, and renewal terms. Technical
      dependencies are also broad: SiliconANGLE reports that the Context Engine can connect to
      external agents and model environments through MCP, while review sources describe dependence
      on IDEs and collaboration platforms. Commercial predictability is weaker. Vantaige reports two
      pricing-model changes in six months and cites one user's description of an effective increase
      approaching tenfold; AI Central Resources says credit-consumption rates and extra-credit
      pricing were undisclosed. CheckThat.ai reports no publicly disclosed revenue, growth, ARR/MRR,
      or acquisition metrics. Funding history is not cash availability, and no evidence here
      establishes burn, runway, margin, retention, customer concentration, or transition economics.
    claimRefs: [CR001, CR004, CR006, CR012, CR014, CR015, CR016]
    tableRefs: [TR003]
