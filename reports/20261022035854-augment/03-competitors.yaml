company:
  name: Augment
chapter:
  number: 3
  title: Competitors
  summary: Augment competes in enterprise AI coding through deep, multi-repository context and agent workflows rather than commodity inline completion. Public evidence points to meaningful differentiation against Copilot and Cursor on cross-repository context and against Sourcegraph Cody on freshness, but a low-reputation news index says Harness announced the acquisition of selected Augment assets on October 9, 2026; transaction scope, pricing changes, limited independent outcomes, and incumbent distribution leave standalone moat durability and product continuity unproven.
sections:
  - id: landscape
    title: Competitive landscape and buyer alternatives
    body: >-
      The relevant competitive set is broader than named AI coding vendors. Augment's
      direct peers include GitHub Copilot Enterprise, Cursor, Sourcegraph Cody, and
      Codeium/Windsurf; adjacent options include Tabnine, Continue.dev, Cline, Aider,
      and JetBrains AI Assistant. The status quo is conventional IDE tooling,
      internal developer-platform work, or a mixed stack in which an organization
      keeps its incumbent assistant and adds specialized context services. Gartner
      describes Augment as Developer AI that uses a large-codebase understanding to
      produce personalized suggestions and insights, while a 2026 alternatives
      comparison explicitly frames Cursor as the closest IDE-integrated alternative
      and Cody as the enterprise-scale codebase-context alternative. This means the
      buying decision is primarily about repository scale, workflow integration,
      security/deployment, and whether the buyer wants one agent or a composable
      stack. Augment's own comparison page is useful for identifying its intended
      category, but it is company-issued and not independent proof of superiority.
      More importantly, a low-reputation news index dated October 9, 2026 says
      Harness announced an acquisition of selected Augment assets, including
      Cosmos, Auggie CLI, and the Context Engine. That current signal could reshape
      the competitor map and product ownership, but the assigned pool lacks the
      primary transaction announcement or contractual scope needed to confirm
      whether Augment remains a standalone platform.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
  - id: capability
    title: Capability, distribution, and switching comparison
    body: >-
      The central product trade-off is depth of context versus distribution and
      workflow breadth. A fetched comparison of Augment, Copilot, and Cursor says
      Augment's Context Engine can span 500,000 files and 30 or more repositories,
      while Copilot is described through a 64K-128K token window and Cursor through
      single-repository indexing; these are third-party review assertions and should
      be validated in a controlled pilot rather than treated as audited benchmarks.
      Another source describes Copilot's GitHub integration as its default advantage,
      Cursor's single-repository fit as its strength, and Cody's self-hosted option
      as a genuine differentiator. Gartner review evidence adds favorable user
      sentiment for contextual suggestions and IDE integration, but also records
      occasional irrelevant or generic outputs and limited enterprise analytics.
      Augment therefore has a credible wedge for complex, multi-repository teams,
      while incumbents retain distribution, ecosystem, and simpler onboarding.
      Switching costs are likely to rise with indexed repositories, memories,
      integrations, and workflow conventions, but the same integrations can support
      multi-homing; a team can pair Augment with another completion or IDE product.
    claimRefs: [CP005, CP006, CP007, CP008, CP009]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: economics
    title: Pricing, packaging, and moat durability
    body: >-
      Pricing is a material competitive variable and a source of uncertainty. The
      2026 Fast.io review reports that Augment removed inline completions from
      non-Enterprise plans on March 31, 2026 and made Business the cheapest plan at
      $100 per month for up to 50 seats; it also reports unpredictable credit
      consumption and a 30,000-credit trial requiring a card. The same review
      contrasts this with free or lower-priced entry points for Copilot and Cursor.
      These details may be current but are one review's account and should be
      rechecked in procurement. A separate 2026 comparison lists Cursor at
      $20-$40 per user per month, Copilot Workspace at $10-$39, and Cody at custom
      enterprise pricing, while describing self-hosted options for Cody, Tabnine,
      and Codeium. Augment's durable advantage would need to come from measurable
      productivity, onboarding, review, or risk outcomes that outweigh price and
      lock-in; public evidence here is mostly company-selected testimonials,
      directory summaries, and reviewer assertions. The adverse case is that
      completions commoditize, pricing changes erode trust, and platform vendors
      bundle sufficient context with existing developer workflows.
    claimRefs: [CP010, CP011, CP012, CP013, CP014]
    tableRefs: [TP003]
  - id: diligence
    title: Competitive diligence verdict
    body: >-
      Augment appears best positioned for engineering organizations with large,
      interdependent repositories, compliance requirements, and a willingness to
      pay for agentic workflow depth. Cursor is a credible single-repository and
      IDE-native substitute; Copilot is the strongest distribution and ecosystem
      incumbent; Cody and self-hosted alternatives are credible where deployment
      control dominates; open-source or BYO-model tools remain substitutes for
      teams prioritizing flexibility and auditability. The evidence does not yet
      establish a durable moat: independent win-loss data, realized pricing,
      retention, deployment breadth, and apples-to-apples productivity outcomes
      remain unavailable in this pool. The reported Harness transaction also makes
      product continuity, support ownership, and roadmap commitments immediate
      diligence items rather than ordinary future risks. A buyer should first
      verify the transaction scope, then run a parallel pilot on the same
      repositories, compare context-retrieval quality and total cost, test
      security/deployment requirements, and measure renewal intent before assuming
      Augment's positioning is defensible.
    claimRefs: [CP003, CP015, CP017]

tables:
  - id: TP001
    title: Competitor profile and buyer fit
    columns: [Competitor or alternative, Category, Target segment, Differentiation, Limitation or diligence issue]
    rows:
      - [Augment, Direct enterprise peer, "20+ engineer teams with complex multi-repository codebases", "Real-time deep context, agent workflows, enterprise controls", "Reported Harness asset acquisition, pricing, and outcomes need primary validation"]
      - [GitHub Copilot Enterprise, Direct incumbent, "GitHub-centric organizations and broad developer rollouts", "Native GitHub, Actions, and ecosystem distribution", "Less granular cross-service context according to comparison sources"]
      - [Cursor, Direct IDE peer, "Individual developers and single-repository teams", "AI-native IDE, semantic indexing, multi-file agent edits", "IDE lock-in and reported context drift on very large repositories"]
      - [Sourcegraph Cody, Direct enterprise peer, "Enterprise monorepos and organizations needing deployment control", "Code graph, BYO LLM, self-hosted or VPC options", "Setup complexity and uncertain long-term product investment"]
      - [Codeium/Windsurf, Direct or adjacent peer, "Free-tier users and regulated organizations", "Broad IDE support, Cascade agent, self-hosted enterprise option", "Product and ownership changes require current procurement diligence"]
      - [Tabnine, Adjacent enterprise peer, "Regulated industries and privacy-first buyers", "Privacy-first and on-premise positioning", "May trade breadth or context depth for deployment control"]
      - [Continue.dev / Cline / Aider, Open or workflow substitutes, "Teams prioritizing model choice, auditability, or CLI workflows", "Open-source or BYO-model flexibility", "More configuration and less turnkey enterprise support"]
      - [Internal build and status quo, Substitute, "Organizations with strong developer-platform teams", "Maximum workflow control and no new vendor dependency", "Engineering cost, maintenance burden, and slower time to value"]
    notes: "Sources are a mixed set of company pages, independent reviews, a review-directory page, and comparison articles; competitor claims are not equivalent independent benchmarks. Unknowns remain for realized pricing, retention, and deployment breadth."
    claimRefs: [CP001, CP002, CP003, CP004, CP015]
  - id: TP002
    title: Capability and buying-criteria matrix
    columns: [Buying criterion, Augment, GitHub Copilot Enterprise, Cursor, Sourcegraph Cody, Evidence implication]
    rows:
      - [Multi-repository context, "Claimed 500,000 files across 30+ repositories", "Retrieval via GitHub search and smaller contextual window", "Primarily single-repository indexing", "Code graph across large codebases", "Pilot on representative cross-service tasks"]
      - [Context freshness, "Real-time or incremental indexing claimed", "On-demand retrieval in GitHub workflow", "Project indexing with local IDE workflow", "Scheduled refresh described by comparison source", "Measure stale-reference error rate"]
      - [Agentic workflow, "Auggie, Intent, checkpoints, terminal actions", "GitHub-native agents and issue-to-PR workflow", "Composer and parallel agent workflows", "Agent plus code-navigation workflow", "Compare task completion and review burden"]
      - [IDE and ecosystem reach, "VS Code, JetBrains, Vim, CLI, GitHub integrations", "Broadest GitHub and Actions distribution", "Cursor IDE required", "VS Code, JetBrains, web, enterprise platform", "Switching cost depends on existing stack"]
      - [Deployment and security, "SOC 2, ISO 42001, CMEK and deployment options claimed", "Enterprise organizational controls", "Public evidence in pool is limited", "Self-hosted or VPC is a stated differentiator", "Validate controls contractually"]
      - [Price transparency, "Credit-based and changed packaging; current terms need confirmation", "Published individual/enterprise anchors in comparisons", "Published individual/team anchors in comparisons", "Custom enterprise pricing", "Model total cost under actual agent usage"]
      - [Multi-homing, "Context Engine MCP can be paired with other tools", "Strongest when GitHub is system of record", "Primarily one IDE", "BYO LLM supports composability", "Test coexistence before assuming lock-in"]
      - [Independent outcome proof, "Gartner user reviews plus company-selected cases", "Broad adoption but comparable outcome data absent here", "Reviewer assertions and market presence", "Independent proof and product investment require diligence", "Do not underwrite moat from testimonials alone"]
    notes: "Cells summarize assigned sources and explicitly preserve uncertainty; they are not a standardized benchmark. Several rows combine source-reported architecture with analyst interpretation, so a controlled buyer pilot is required."
    claimRefs: [CP005, CP006, CP007, CP008, CP009, CP011, CP015]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Vendor or option, Published or reported price, Packaging model, Included capability or positioning, Competitive implication]
    rows:
      - [Augment Business, "$100/month for up to 50 seats (reported)", "Flat fee plus usage credits", "Cosmos, CLI, MCP, analytics; Enterprise adds advanced controls", "Potential scale advantage, but usage ceiling and current terms require verification"]
      - [Augment Enterprise, "Custom pricing (reported)", "Custom users, usage, support, deployment", "SSO/OIDC/SCIM, SLA, on-premise or air-gapped options", "Competes on control and compliance rather than low entry price"]
      - [Cursor, "$20-$40/user/month (comparison-reported)", "Per-user subscription", "AI-native IDE and agentic editing", "Clearer small-team anchor but higher aggregate cost at scale"]
      - [GitHub Copilot, "$10-$39/user/month (comparison-reported)", "Free, Pro, Business, Enterprise tiers", "GitHub ecosystem and broad rollout", "Distribution and low-friction adoption pressure"]
      - [Sourcegraph Cody, "Enterprise custom pricing (comparison-reported)", "Enterprise contract", "Code graph and BYO LLM; self-hosted/VPC option", "Deployment control may justify bespoke pricing"]
      - [Codeium / Continue.dev, "Free tier or open source (comparison-reported)", "Free, API-cost, or enterprise custom", "Self-hosting or model flexibility", "Low-cost substitutes increase price pressure"]
    notes: "Prices are reported by assigned 2026 comparison/review sources, not independently verified contracts. Credit consumption, discounts, realized price, and feature availability can change; do not treat list or review-reported pricing as revenue or margin evidence."
    claimRefs: [CP010, CP011, CP012, CP013, CP014]

figures:
  - id: FP001
    title: Competitive positioning by context depth and ecosystem reach
    summary: "An evidence-constrained ordinal map places Augment and Cody toward deeper context, while Copilot and Cursor retain stronger workflow or ecosystem reach; coordinates are analytical, not measured benchmark scores."
    type: quadrant
    data:
      points:
        - {name: Augment, x: 8, y: 7, label: "Augment", detail: "Deep multi-repository context; narrower distribution, changed packaging, and transaction-scope uncertainty reported by assigned sources"}
        - {name: GitHub Copilot, x: 4, y: 10, label: "Copilot", detail: "Broad GitHub ecosystem and rollout reach; shallower cross-service context described by comparison sources"}
        - {name: Cursor, x: 6, y: 7, label: "Cursor", detail: "Strong IDE-native context for single repositories; requires its own IDE"}
        - {name: Sourcegraph Cody, x: 9, y: 6, label: "Cody", detail: "Enterprise code graph and self-hosted/VPC options; setup and investment questions remain"}
        - {name: Codeium/Windsurf, x: 5, y: 8, label: "Codeium/Windsurf", detail: "Broad IDE support and self-hosted positioning; current ownership/product terms need diligence"}
        - {name: Open/BYO-model tools, x: 3, y: 5, label: "Open/BYO-model", detail: "High flexibility and auditability; more configuration and lower turnkey enterprise support"}
      xAxis: {label: "Context depth and repository scale", min: 0, max: 10}
      yAxis: {label: "Ecosystem reach and deployment flexibility", min: 0, max: 10}
    approximationNotes: "Coordinates are ordinal analyst synthesis from assigned source descriptions, not independently measured scores; no claim is made that one point is quantitatively superior to another."
    claimRefs: [CP005, CP006, CP007, CP008, CP015, CP017]

callouts:
  - calloutType: strength
    title: Enterprise context is the clearest wedge
    body: "Assigned sources consistently describe Augment's differentiation as large-codebase, multi-repository context and agentic workflow depth rather than generic autocomplete."
    claimRefs: [CP005, CP006, CP015]
  - calloutType: risk
    title: Pricing and commoditization can narrow the market
    body: "The reported Harness acquisition of selected assets, removal of non-Enterprise inline completions, credit-based usage, and changing packages increase continuity and procurement risk while Copilot and other tools retain lower-friction entry points."
    claimRefs: [CP003, CP010, CP011, CP013, CP017]
  - calloutType: recommendation
    title: Underwrite through a parallel pilot
    body: "Compare Augment, Copilot, Cursor, and Cody on identical repositories and tasks, including retrieval freshness, review quality, security controls, realized usage cost, and user retention intent."
    claimRefs: [CP015, CP017]

