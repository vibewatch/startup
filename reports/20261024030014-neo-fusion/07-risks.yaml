chapter:
  number: 7
  title: Risks
  summary: "Neo Fusion's public record leaves the most material risks unresolved: nuclear licensing, safety-case evidence, first-of-a-kind execution, commercialization economics, and capital sufficiency. Available sources establish the regulatory burden, a reported BEST milestone sequence, and sector benchmarks, but do not verify a Neo Fusion-specific permit, incident record, operating performance, or financing runway."
sections:
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: Nuclear regulation is a gating risk rather than a routine compliance item for a pre-commercial fusion developer. China's Nuclear Safety Law applies to nuclear facilities, nuclear materials, and radioactive waste, and requires licensing for siting, construction, operation, and decommissioning. It also assigns the operator overall nuclear-safety responsibility and requires safety analysis, environmental-impact documentation, quality assurance, emergency planning, and financial protection. The retained record does not show a Neo Fusion-specific license, safety analysis, environmental approval, or regulator decision. Until those documents are produced, the probability and timing of regulatory delay remain unresolved, and the investment case should treat first plasma and any later power-production milestone as conditional rather than scheduled.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: operational-technical
    title: Operational, technical, and commercialization risk
    body: The central operating risk is not merely whether a fusion pulse can be produced, but whether a repeatable, maintainable and licensable plant can be built at an economic cost. A Baidu-compiled profile reports that BEST assembly began in May 2025, with completion planned for 2027 and energy output above input planned for 2030; this is a milestone narrative, not an independently audited schedule or performance result. The public evidence available to this chapter does not document Neo Fusion's machine-level safety case, tritium and radioactive-waste handling, uptime, component lifetime, or independently verified energy gain. Broader energy evidence warns that levelized cost does not capture every system-level effect. The appropriate mitigation is staged technical disclosure with independent review and explicit go/no-go criteria for plasma performance, availability, safety, and cost.
    claimRefs: [CR005, CR006, CR007, CR008, CR015]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: dependencies-financial
    title: Partner, capital, and execution dependencies
    body: Fusion commercialization is capital- and ecosystem-intensive, and the assigned evidence does not establish Neo Fusion's cash balance, paid-in capital, debt, committed financing, supplier concentration, or customer contracts. FusionXInvest reports majority ownership by state-owned entities, creating a material governance and strategic-capital dependency whose exact rights remain undisclosed. A funding announcement from another fusion company illustrates sector capital requirements but is not evidence of Neo Fusion's runway. As a commercial benchmark, Google signed a 200 MW agreement with Commonwealth Fusion Systems that POWER reports is tied to SPARC reaching net fusion energy. Diligence should obtain a cap table, paid-in-capital schedule, milestone budget, governance rights, procurement plan, and binding offtake or host-site commitments.
    claimRefs: [CR009, CR010, CR011, CR014, CR016]
    tableRefs: [TR003]
  - id: thesis-breaks
    title: Monitoring and thesis-break triggers
    body: The practical risk framework is to monitor evidence that converts an unresolved question into a measurable failure. A thesis break would include a missed licensing gate without a documented revised path, material slippage against the reported 2027 assembly or 2030 net-energy milestones without a funded recovery plan, failure to demonstrate repeatable machine performance against a published metric, a material increase in required capital without committed sources, loss of a critical partner or supplier without replacement, or inability to show a credible safety, waste, maintenance, and grid-integration package. These triggers are evidence-based because the assigned pool contains no confirmed Neo Fusion incident, lawsuit, outage, or customer-loss record. That absence is not proof that no such event occurred.
    claimRefs: [CR003, CR004, CR006, CR010, CR015, CR016]
