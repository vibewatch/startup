  evidenceGaps:
    - type: access-blocked
      severity: minor
      topic: adverse-evidence
      missingEvidence: Direct adverse reporting or regulator records specific to Neo Fusion.
      whyItMatters: The assigned searches returned no retained URLs for the recorded queries, limiting incident and litigation verification.
      diligencePath: Request a legal, regulatory, incident, insurance, and customer-complaint schedule from management and verify material entries with primary records.
      relatedQuestionRefs: [QR008]
    - type: missing-source
      severity: blocking
      topic: regulatory-legal-register
      missingEvidence: Neo Fusion-specific siting, construction, operation, environmental, and nuclear-safety approvals for BEST.
      whyItMatters: Licensing is a prerequisite to construction and operation, so an unverified regulatory path can invalidate the announced milestone sequence.
      diligencePath: Obtain regulator-issued permit identifiers, safety-analysis filings, environmental approvals, and correspondence for the BEST site.
      relatedQuestionRefs: [QR001, QR002]
      relatedTableRefs: [TR001]
    - type: missing-source
      severity: material
      topic: operational-quality-security-risk-register
      missingEvidence: Independent BEST performance, availability, component-life, tritium, waste, and emergency-planning evidence.
      whyItMatters: Fusion technical success does not by itself establish safe, repeatable, licensable, or economic operation.
      diligencePath: Commission an independent technical review with raw pulse data, safety analyses, maintenance assumptions, waste flows, and availability.
      relatedQuestionRefs: [QR003, QR004, QR005]
      relatedTableRefs: [TR002]
    - type: private-evidence-only
      severity: material
      topic: partner-dependency-risk-register
      missingEvidence: A dated cap table, paid-in-capital schedule, committed financing list, debt schedule, and milestone budget for Neo Fusion.
      whyItMatters: Registration capital, announced investment, and cash available are different quantities; without reconciliation, runway and dilution cannot be assessed.
      diligencePath: Request bank-confirmed cash, paid-in capital, debt, investor rights, monthly burn, and a milestone-linked financing plan.
      relatedQuestionRefs: [QR006, QR007]
      relatedTableRefs: [TR003]
