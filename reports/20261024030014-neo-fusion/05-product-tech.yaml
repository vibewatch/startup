figures:
  - id: FE001
    title: BEST product architecture map
    type: stack
    summary: BEST is publicly described as a compact superconducting tokamak whose experimental output is intended to inform a future fusion-engineering pathway.
    data:
      layers:
        - label: Research platform
          detail: Research and international-access context around the BEST program.
          items:
            - label: International access
              detail: CAS says the Hefei program opens major fusion platforms to global scientists.
            - label: EAST-to-CFEDR bridge
              detail: BEST is described as an intermediate phase between EAST and a future CFEDR.
        - label: Machine architecture
          detail: Physical confinement system described in public BEST material.
          items:
            - label: Compact high-field tokamak
              detail: Independent coverage describes BEST as a compact high-field tokamak.
            - label: Superconducting magnets
              detail: Public descriptions identify a superconducting tokamak and superconducting-magnet technology.
        - label: Experimental operation
          detail: Planned operating regime and reactor-relevant test conditions.
          items:
            - label: Burning plasma
              detail: CAS reports deuterium-tritium burning-plasma experiments.
            - label: Long-pulse and high-flux testing
              detail: Coverage emphasizes long pulse duration, high neutron fluence, and high energy and particle flux.
        - label: Forward pathway
          detail: Intended progression from experiment toward engineering demonstration.
          items:
            - label: Net-energy target
              detail: CAS reports a 20–200 MW fusion-power target and net-energy-gain objective; achievement is unverified.
            - label: Future demonstration
              detail: Secondary material positions BEST as a step toward a larger demonstration reactor.
        - label: Fuel and diagnostics
          detail: Fuel-cycle and measurement dependencies that must be disclosed before performance can be underwritten.
          items:
            - label: Deuterium-tritium handling
              detail: CAS identifies deuterium-tritium burning-plasma experiments; the public package does not detail tritium accountancy.
            - label: Diagnostics and control
              detail: Public sources do not disclose diagnostic coverage or real-time control performance.
        - label: Safety and quality
          detail: Machine-level safety, quality assurance, and regulatory evidence remains a diligence requirement.
          items:
            - label: High-flux materials
              detail: High neutron fluence and energy and particle flux are reported design challenges.
            - label: Safety case
              detail: No complete public safety, waste, or regulatory package was retained.
    claimRefs: [CE005, CE006, CE007, CE010, CE014]
callouts:
  - calloutType: insight
    title: What is demonstrated versus planned
    body: Construction and component-assembly milestones are the clearest public evidence. Plasma performance, net energy, safety, reliability, and commercial power delivery remain planned or undisclosed.
    claimRefs: [CE003, CE008, CE012, CE013]
  - calloutType: assumption
    title: Architecture boundary
    body: The chapter treats BEST as a research and engineering platform rather than assuming that a fusion-power target implies grid electricity, positive cash generation, or commercial readiness.
    claimRefs: [CE008, CE010, CE012]
