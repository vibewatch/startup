slug: neo-fusion
runDate: 2026-10-24
company:
  name: Neo Fusion
chapter:
  number: 5
  title: Product & Technology
  summary: Neo Fusion is developing BEST, a compact high-field superconducting tokamak intended to bridge EAST-era research and a future demonstration reactor. Public evidence supports a real construction and component-assembly program, but key machine-level performance, safety, reliability, and commercialization details remain unverified.
sections:
  - id: product-definition
    title: Product definition and maturity
    body: >-
      Neo Fusion's product is not a commercial electricity tariff or an operating power
      plant; it is the BEST experimental fusion platform and the engineering capability
      around it. A company profile describes Neo Fusion as founded in 2023 in Anhui and
      focused on designing and developing a tokamak fusion device. The company profile
      also describes majority ownership by state-owned enterprises including China
      National Petroleum Corporation and Hefei Science Island, controlled by the Chinese
      Academy of Sciences. A separate company-information page says the business was
      established on 19 May 2023 and describes BEST as its main project, but that page is
      a secondary directory rather than an audited technical disclosure. Independent
      coverage says BEST construction began in 2023, the main building was complete, and
      component pre-assembly had begun; it reports expected completion in 2027. That is
      meaningful physical maturity, but it is not evidence that the device has achieved
      plasma performance, net energy, or power-plant reliability.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001]
  - id: architecture-workflow
    title: Architecture and operating workflow
    body: >-
      The disclosed architecture is a compact, high-field tokamak with superconducting
      magnets, long-pulse operation, and a burning-plasma research objective. The
      Institute of Plasma Physics at the Max Planck Society describes the comparison
      stellarator Wendelstein 7-X as using 50 non-planar superconducting coils to produce
      its optimized magnetic field and to investigate continuous operation; this is a
      useful external benchmark for the engineering burden of superconducting magnetic
      confinement, not a claim about Neo Fusion's design. The BEST descriptions instead
      emphasize high neutron fluence, high density, and high energy and particle flux as
      deliberate test conditions. CAS reporting says the planned experiments use
      deuterium-tritium burning plasma, target 20 to 200 megawatts of fusion power, and
      seek net energy gain. The workflow therefore runs from superconducting magnetic
      confinement and plasma heating through long-pulse burning-plasma experiments and
      measurement of energy and particle exhaust; public material does not disclose a
      complete subsystem bill of materials, tritium-breeding design, heat-extraction
      design, or control-system performance.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE002, TE003]
    figureRefs: [FE001]
  - id: differentiation-risks
    title: Differentiation, dependencies, and technical risks
    body: >-
      Neo Fusion's potential differentiation is the combination of a compact high-field
      burning-plasma device, access to Hefei's research ecosystem, and a stated bridge
      from EAST to a future CFEDR-class demonstration path. CAS says the international
      program opens major Hefei fusion platforms to scientists from more than ten
      countries, while the DOE's June 2026 roadmap frames commercial fusion around
      unresolved science, materials, and technology gaps and a fusion pilot-plant path in
      the 2030s. Those external references reinforce that BEST is strategically relevant,
      but they do not validate Neo Fusion's own performance. A Chinese information page
      reports a plan to complete BEST assembly in 2027 and achieve fusion energy output
      greater than input in 2030; this is a company/project roadmap claim, not an observed
      result. The principal diligence risks are therefore unverified first-plasma and
      net-energy milestones, high-flux materials and component lifetime, tritium and
      waste handling, thermal and electrical integration, control reliability, and the
      absence of a public machine-level safety or regulatory package. A sector market
      report also notes that continuous commercial-scale fusion is difficult because
      plasma stability requires sophisticated control and small technical failures can
      cause costly delays; its forecasts are not Neo Fusion-specific evidence.
    claimRefs: [CE010, CE011, CE012, CE013, CE014, CE015, CE016]
    callouts:
      - calloutType: risk
        title: Technical proof remains the gating item
        body: "The construction record is stronger than the public performance record: BEST's assembly milestones are visible, while first-plasma, net-energy, duty-cycle, component-life, and safety evidence is not."
        claimRefs: [CE003, CE008, CE012, CE013]
