      - [Burn and runway, null, low, "Tests milestone financing dependency", "No burn or runway schedule disclosed", "24-month monthly forecast and variance history"]
      - [Capex to first plasma, null, low, "Tests funding need before technical milestone", "No integrated Neo Fusion budget", "Committed and remaining capex by work package"]
      - [Power cost or LCOE, null, low, "Tests eventual competitiveness", "No Neo Fusion plant model", "Independent techno-economic model"]
    notes: "Null values mean unavailable public evidence, not zero; these are the minimum underwriting requests for a capital-intensive, milestone-dependent project."
    claimRefs: [CI005, CI006, CI007, CI008, CI010, CI011, CI012, CI015]
