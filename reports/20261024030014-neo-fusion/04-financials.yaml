chapter:
  number: 4
  title: Financials
  summary: Neo Fusion appears to be a pre-commercial fusion developer whose public materials emphasize reactor development and ecosystem formation rather than realized revenue, pricing, or audited operating metrics. The evidence supports a capital-intensive, milestone-dependent underwriting case, but does not support a revenue run-rate, margin, burn, runway, or deployable-cash estimate.
sections:
  - id: revenue-model
    title: Revenue model and monetization visibility
    body: Neo Fusion's public profile describes a 2023-founded Anhui company focused on controlled-fusion technology and tokamak development, not a commercial product with disclosed customers or contract terms. Its public-facing activity is framed around building a fusion device and participating in an emerging industrial ecosystem. That supports an R&D or project-development interpretation, but it does not establish recurring revenue, recognized revenue, ARR, GMV, utilization, or realized pricing. The financial underwriting consequence is that any future monetization is contingent on technical milestones, project finance, and eventual power or technology commercialization rather than current operating cash generation. Official or customer contracts, revenue recognition policies, backlog, and paid pilot evidence remain unavailable in the assigned evidence.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
  - id: cost-structure
    title: Cost structure and unit economics
    body: >-
      Fusion development has a structurally heavy cost base: high-temperature plasma systems, superconducting magnets, cryogenics, vacuum systems, diagnostics, specialized fabrication, site infrastructure, and engineering labor must be funded before commercial output. Comparable public reporting describes SPARC assembly around a 1,000-tonne machine, major cryostat and magnet interfaces, and a planned commercial plant, illustrating why a prototype-to-power pathway should not be modeled like a software business. Market research also identifies high capital costs and technological complexity as commercialization constraints. Neo Fusion-specific gross margin, engineering cost per milestone, manufacturing yield, service-delivery cost, working-capital cycle, and capex schedule are not publicly established.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and financing dependency
    body: >-
      The available evidence points to financing dependency without providing a cash balance or runway. A company profile says Neo Fusion is majority owned by state-owned enterprises including China National Petroleum Corporation and Hefei Science Island, and Baidu Baike reports that registered capital increased from RMB 5.0 billion to RMB 14.5 billion in 2024. Registered capital is not evidence of paid-in capital or cash available for operations. A 2026 Anhui report separately describes planned university collaboration and a broader fusion-industry ecosystem. These facts may indicate institutional sponsorship and access to an industrial network, but they do not establish unrestricted cash, debt terms, committed project finance, or investor rights. The assigned FusionXInvest headline flags a possible reduction in investor exposure, but the fetched page exposes only a membership gate; neither the transaction nor its rationale is verified. The appropriate conclusion is financing uncertainty, not a precise solvency judgment.
    claimRefs: [CI009, CI010, CI011, CI012, CI016]
  - id: underwriting-verdict
    title: Financial verdict and diligence blockers
    body: Neo Fusion's financial profile is best treated as pre-commercial infrastructure and technology underwriting. Industry sources describe growing private fusion investment and future power-purchase activity, but those are sector comparables and not Neo Fusion revenue, valuation, or cash availability. A market report forecasts large fusion-market totals while simultaneously describing high capital costs, technical complexity, regulatory uncertainty, and possible delays beyond 2030; those forecasts are directional context, not a company forecast. The central diligence question is whether a verified financing plan bridges the company from current engineering work to first plasma, then to a power-generating demonstration and customer or offtake contracts. Until management supplies audited financials, cap table, cash and burn schedule, milestone budget, debt/project-finance obligations, and commercialization terms, the recommendation should remain research-more with low confidence in financial underwriting.
    claimRefs: [CI013, CI014, CI015]
    figureRefs: [FI001]
