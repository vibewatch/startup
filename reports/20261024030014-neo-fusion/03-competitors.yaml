      - [High-temperature-superconductor evidence, "Superconducting-magnet work is described for BEST; performance data not disclosed in pool", "MIT reports a 20-tesla full-scale magnet program tied to CFS", "ITER uses a different large international engineering base", "CFS has the strongest retained technical evidence on this criterion"]
      - [Construction and commissioning readiness, "BEST assembly target and 2030 energy-output target reported; current commissioning evidence unavailable", "SPARC components are being installed and commissioning is expected to take months", "Public facilities have long operating histories but are not a commercial product", "Neo Fusion's schedule evidence is earlier-stage than CFS's physical assembly evidence"]
      - [Commercial distribution and offtake, "No customer, tariff, or power-purchase evidence retained", "ARC site outside Richmond, Virginia reported; offtake terms not established in pool", "Conventional grid, renewables, and storage have existing distribution", "Commercial access is an unresolved differentiator for both private peers"]
    notes: "The matrix records only source-supported observations; unknown or unavailable cells are intentional. It compares pathways and disclosed milestones, not a normalized engineering score."
    claimRefs: [CP002, CP005, CP006, CP007]
  - id: TP003
    title: Pricing / packaging comparison
    columns: [Pathway, Price or contract model, Included capability, Discount or unknowns, Competitive implication]
    rows:
      - [Neo Fusion / BEST, "Not publicly disclosed", "Experimental tokamak development and intended energy-demonstration path", "No realized project cost, tariff, customer contract, or component price retained", "Cannot underwrite commercial differentiation from list-price evidence"]
      - [CFS SPARC / ARC, "Not publicly disclosed", "SPARC demonstration reactor and planned ARC commercial plant", "Construction cost, power price, and realized economics unavailable in retained sources", "Physical build progress improves credibility but does not prove attractive delivered cost"]
      - [Public fusion research infrastructure, "Public-program funding model; no customer price", "Research, engineering, and shared scientific infrastructure", "Public subsidy and mission scope make direct price comparison invalid", "Alternative access to fusion capability may reduce urgency to buy a private system"]
    notes: "No retained source provides a comparable commercial price or contract. Null/unknown commercial fields are evidence gaps, not zero prices or zero costs."
    claimRefs: [CP008, CP011, CP014]
figures:
