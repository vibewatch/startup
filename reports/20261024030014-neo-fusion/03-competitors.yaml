company:
  name: Neo Fusion
chapter:
  number: 3
  title: Competitors
  summary: Neo Fusion is pursuing a state-backed, magnetic-confinement tokamak path centered on BEST, while the most visible commercial peers are differentiating through reactor milestones, private financing, superconducting-magnet know-how, and power-offtake commitments. The competitive case is strategically credible but remains exposed to first-of-a-kind commissioning, commercialization timing, and limited public evidence on price, customer contracts, and plant economics.
sections:
  - id: landscape
    title: Landscape and strategic position
    body: >-
      Neo Fusion competes in a heterogeneous field rather than a single product
      market. Its disclosed path is a tokamak and BEST-centered engineering
      program, with company-profile evidence describing a 2023 founding and a
      majority state-owned structure. The Chinese program context is material:
      Xinhua reported that BEST is intended to demonstrate net fusion power gain
      and electricity generation around 2030, while also placing the project in
      a broader national move from fundamental research toward engineering.
      The nearest direct commercial comparison in the retained evidence is
      Commonwealth Fusion Systems (CFS), whose SPARC tokamak is being assembled
      for a planned 2027 start and whose ARC plant has a stated Virginia site.
      Other alternatives include laser-based inertial confinement at the
      National Ignition Facility, established public programs such as ITER, and
      other private concepts such as Helion, TAE, General Fusion, and Tokamak
      Energy. These are not interchangeable products: they differ in plasma
      configuration, maturity, financing model, and intended route to grid
      power.
    claimRefs: [CP002, CP003, CP004]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: buyer_tradeoffs
    title: Buyer trade-offs, capability, and distribution
    body: >-
      A future fusion buyer is likely to value credible net-power performance,
      repeatable component manufacturing, regulatory readiness, schedule
      confidence, and a path to plant financing more than a laboratory
      milestone alone. CFS provides a useful comparator because TechCrunch
      describes both a physical SPARC assembly milestone and a multi-month
      commissioning process, while MIT's account of the underlying REBCO magnet
      work shows that the technology advantage depends on difficult engineering
      and supply-chain execution. Neo Fusion's differentiator is access to
      Chinese state-linked institutions and a domestic engineering ecosystem,
      but public sources do not disclose a commercial customer, power-purchase
      agreement, list price, or realized unit economics. Accordingly, the
      matrix separates observed capability or strategic access from unsupported
      commercial assumptions. Internal build and status quo remain credible
      categories because a buyer may defer adoption or rely on public research
      infrastructure rather than buy a private reactor, but this pool does not
      support a quantified comparison of those alternatives.
    claimRefs: [CP005, CP006, CP007, CP008]
    tableRefs: [TP002]
  - id: durability_risks
    title: Moat durability and displacement risk
    body: >-
      Neo Fusion's potential moat is institutional and execution-based rather
      than a proven recurring software-style lock-in. The disclosed combination
      of Chinese Academy of Sciences-linked research, state-owned capital, and
      BEST engineering access may improve patient capital, procurement, and
      domestic coordination. It does not by itself establish superior reactor
      economics. CFS has demonstrated a different form of advantage through
      high-temperature-superconductor magnet development, private-company
      construction, and a stated commercial-site plan; MIT reports that the
      magnet program included full-scale testing and supply-chain procurement.
      The competitive threat is therefore milestone convergence: if several
      concepts reach net power, the advantage may move to manufacturing yield,
      licensing, financing, grid integration, and delivered cost. The retained
      evidence does not establish Neo Fusion's pricing, export strategy,
      component exclusivity, or customer switching costs, so those items remain
      diligence gaps rather than asserted weaknesses. Sector research also
      identifies high capital cost, plasma-stability complexity, and regulatory
      uncertainty as common constraints, so schedule slippage or cost escalation
      can erode differentiation without a superior reactor concept emerging.
    claimRefs: [CP009, CP010, CP011, CP012, CP015, CP016]
    tableRefs: [TP003]
  - id: evidence-boundary
    title: Evidence boundary and open issues
    body: >-
      The comparison is deliberately evidence-constrained. Public market
      reports list many fusion concepts and describe intense competition, but
      their market-size forecasts are not direct evidence of Neo Fusion's
      obtainable market or of any competitor's realized economics. Unknown
      cells should be treated as underwriting gaps, not as evidence that a
      competitor lacks the capability. The table therefore distinguishes
      technical pathway, observed construction, and commercial evidence, since
      those dimensions mature on different schedules and cannot be collapsed
      into one unverified ranking.
    claimRefs: [CP013, CP014]
