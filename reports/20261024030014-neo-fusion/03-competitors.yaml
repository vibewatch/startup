    title: Competitive positioning map
    type: quadrant
    summary: Evidence-backed ordinal positioning separates institutional access and engineering commercialization evidence from the limited public disclosure of customer economics.
    data:
      xAxis:
        label: Commercialization evidence
        min: 0
        max: 5
      yAxis:
        label: Institutional or technical access
        min: 0
        max: 5
      points:
        - {label: Neo Fusion, x: 2, y: 5, note: "State-linked research and capital access are disclosed; commercial economics are not"}
        - {label: CFS, x: 4, y: 4, note: "SPARC construction and ARC site are reported; net power and economics remain unproven"}
        - {label: NIF, x: 3, y: 5, note: "Scientific break-even history is reported; laser route is not a commercial tokamak"}
        - {label: ITER, x: 2, y: 5, note: "Large international research infrastructure; no customer-priced product"}
        - {label: Helion, x: 3, y: 4, note: "Market evidence reports plant construction and a power-use target; direct project documents are absent"}
        - {label: Tokamak Energy, x: 1, y: 2, note: "Named as a private tokamak competitor, with no comparable milestone evidence in this pool"}
    approximationNotes: "Coordinates are ordinal analyst scores from 0 to 5 based only on the retained sources' disclosed milestones and institutional descriptions; they are not measured performance, market share, valuation, or customer economics."
    claimRefs: [CP002, CP005, CP006, CP013]
callouts:
  - calloutType: insight
    title: Institutional access is not yet a commercial moat
    body: Neo Fusion's state-linked structure and BEST access may support capital and engineering continuity, but the retained evidence does not show customer contracts, price, plant economics, or switching costs.
    claimRefs: [CP008, CP009]
  - calloutType: risk
    title: Milestone convergence could shift the basis of competition
    body: If multiple fusion concepts reach net power, manufacturing yield, licensing, financing, grid integration, and delivered cost may matter more than the initial reactor concept.
    claimRefs: [CP010, CP011, CP012]
