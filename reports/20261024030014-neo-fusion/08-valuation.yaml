      - [Bear, "Milestones slip or costs rise; further financing creates dilution or unfavorable preference terms.", "Downside cannot be quantified without cap table, budget, and cash data.", "Material downside signal.", "Schedule, cost, fuel-cycle, and financing risk."]
      - [Entry gate, "Independent technical review, paid-in-capital reconciliation, cap table, budget, offtake, and regulatory package are delivered.", "Re-underwrite using a stage-appropriate method after evidence arrives.", "Required before a buy call.", "Missing evidence remains the constraint."]
    notes: "Scenarios are qualitative because public evidence does not disclose revenue, cash burn, project cost, ownership economics, or a priced Neo Fusion transaction."
    claimRefs: [CV011, CV012, CV013, CV015]

