company:
  name: Neo Fusion
chapter:
  number: 8
  title: Valuation
  summary: "Neo Fusion has strategic capital, a distinctive Hefei fusion platform, and a visible BEST milestone path, but public evidence does not disclose an equity valuation, paid-in-capital schedule, revenue, customer contracts, or plant-level economics. The appropriate stance is research-more: preserve upside optionality while requiring financing, milestone, governance, and commercialization evidence before assigning price or return expectations."
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      The investment case is strategic rather than conventionally financial. Public descriptions place Neo Fusion at the intersection of Hefei's fusion-science base, state-linked capital, and a commercial vehicle intended to move BEST from experiment toward later demonstration and power applications. The company was established in 2023, and the accessible company profile describes tokamak development and majority ownership by state-owned enterprises. A separate 36Kr report says registered capital rose from CNY 5 billion to CNY 14.5 billion and identifies CNY 2.9 billion from China National Petroleum Kunlun Capital for a 20% stake. Those figures are capital-structure signals, not a priced financing valuation or proof that the full registered-capital amount is paid in and available for construction. The anti-thesis is therefore material: the public record still lacks an outside-investor price, cap-table rights, cash runway, revenue, offtake, or a machine-to-grid economics bridge. The DOE roadmap is useful context, not Neo Fusion evidence: it says private fusion investment exceeds $10 billion while critical materials and fuel-cycle gaps remain.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001, TV002]
  - id: financing-and-market-context
    title: Financing context and market discipline
    body: >-
      Fusion financing is attracting large strategic and institutional commitments, but sector funding should not be used as a proxy for Neo Fusion's valuation. The Fusion Report describes Commonwealth Fusion Systems' July 2026 additional $1 billion equity financing and a $4 billion cumulative total, while Helion's June 2026 round carried a reported $15.5 billion post-money valuation. These are competitor transactions with different technologies, jurisdictions, milestones, and disclosure; they are not comparable-company marks for Neo Fusion. Market research reports also publish very large addressable-market forecasts, but their definitions combine research, equipment, pilot plants, and future power applications, so they do not establish serviceable revenue or a company-level multiple. The more decision-useful external discipline is cost and deployment learning: Our World in Data reports an 88% fall in utility-scale solar electricity cost from 2009 to 2024, while Lazard's 2026 LCOE+ summary says renewables remain the most cost-competitive unsubsidized new-build generation. Fusion must ultimately clear those alternatives on delivered cost, reliability, schedule, and financing risk; no retained source demonstrates that Neo Fusion does so today.
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV003]
  - id: scenario-and-recommendation
    title: Scenarios, recommendation, and entry discipline
    body: >-
      A defensible scenario framework is milestone-based, not a discounted-cash-flow exercise. The favorable case requires BEST to meet its disclosed engineering sequence, demonstrate energy output greater than input around 2030, and convert scientific capability into a funded demonstration and credible commercial pathway. The base case is continued strategic financing and technical progress without enough public evidence to underwrite a power-plant return, leaving the asset suitable for monitoring rather than a priced buy. The adverse case is schedule slippage, cost escalation, unresolved fuel-cycle or materials gaps, or a financing round that reveals dilution, preference, or governance terms unfavorable to new capital. The evidence supports research-more with low confidence in any precise valuation stance, not a buy call. Entry discipline should be defined by a verified paid-in-capital schedule, milestone budget, independent technical review, and financing terms. A numerical target return or valuation range would be false precision because current public sources do not provide Neo Fusion revenue, cash burn, project cost, ownership economics, or an exit market.
    claimRefs: [CV011, CV012, CV013, CV014]
    figureRefs: [FV001]
  - id: exit-and-diligence
    title: Exit readiness and thesis-break triggers
    body: >-
      Exit readiness is presently unproven. The retained company description identifies a three-stage ambition spanning an experimental device, an engineering demonstration device, and a commercial power station, while the Baike entry reports a 2027 assembly target and a 2030 energy-output target. Those dates are useful monitoring markers, not contracted delivery obligations or an investable exit timetable. A credible next financing or strategic exit would require evidence of technical acceptance, commercial counterparties, licensing and safety readiness, and transparent investor rights. The thesis breaks if registered capital cannot be reconciled to paid-in cash and committed uses, if BEST milestones move without a funded recovery plan, if independent engineering cannot validate performance, or if delivered-power economics are materially inferior to available low-carbon alternatives. The immediate diligence ask is a data room covering cap table, paid-in capital, preference stack, debt, budget, milestones, procurement, regulatory status, offtake, and commercialization assumptions. Until that package exists, valuation should remain unknown and recommendation research-more.
    claimRefs: [CV002, CV011, CV013, CV015]

