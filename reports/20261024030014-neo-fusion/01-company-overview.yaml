company:
  name: Neo Fusion
chapter:
  number: 1
  title: Company Overview
  summary: Neo Fusion is a Hefei-based fusion-energy company founded in 2023 to develop a tokamak device and commercial fusion pathway. Public evidence supports its state-linked ownership, BEST project, and capital-registration milestones, but does not establish deployable cash, operating revenue, customer traction, or outside-investor economics.
sections:
  - id: identity-and-business
    title: Identity, location, and operating model
    body: Neo Fusion, also identified in Chinese records as 聚变新能（安徽）有限公司, was founded in 2023 and is located in Hefei, Anhui, China. FusionXInvest describes the company as developing controlled-fusion technologies for global commercial use, with a primary focus on designing and developing a tokamak fusion device. Its company profile says Neo Fusion is majority owned by state-owned enterprises, including China National Petroleum Corporation and Hefei Science Island, which is controlled by the Chinese Academy of Sciences. The Baidu Baike record describes the company as a research-and-engineering vehicle whose operating scope includes emerging-energy research, nuclear-power equipment engineering services, power-generation technical services, and related engineering and intellectual-property services. This evidence supports a pre-commercial, state-linked technology-development model rather than a demonstrated merchant-power business. No source in the assigned pool establishes paying customers, commercial revenue, ARR, or a completed power-plant project.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: ownership-and-capital
    title: Ownership, capital, and governance visibility
    body: The available evidence indicates a government-linked capitalization structure, but it does not show the distinction between registered capital, paid-in capital, committed project funding, and cash available for construction. Baidu Baike records an initial registered capital of RMB5 billion at formation and RMB14.5 billion after a 2024 increase, and identifies China National Petroleum Group Kunlun Capital and Hefei Science Island Holdings as shareholders added that year. These figures should not be treated as a valuation or as cash runway. The same record names Huang Suzhen as legal representative from December 2024, but the public pool does not provide a cap table, investor-rights schedule, debt terms, board composition, founder biographies, or a complete executive roster. That opacity is material because the project is capital-intensive and the ownership structure may determine control, funding continuity, and access for outside capital.
    claimRefs: [CO003, CO005, CO006, CO007, CO008, CO015]
    tableRefs: [TO002, TO003]
  - id: milestones-and-readiness
    title: Milestones and commercialization readiness
    body: >-
      Neo Fusion's observable milestone path is centered on BEST, a compact tokamak fusion
      experiment intended to bridge research capability and a future commercial route. The
      Baidu Baike record says the company was formed on 2023-05-19, describes the 2024 ownership
      and registered-capital change, reports that BEST engineering assembly began in 2025, and
      records a 2026-09-27 shipment of batch-manufactured TF coil boxes. It also states a plan
      for assembly completion in 2027 and fusion-energy output greater than input in 2030; those
      are plans or reported targets, not achieved operating results. Independent comparator
      evidence shows why engineering execution matters: MIT reports a 20-tesla
      high-temperature-superconducting magnet test for a different fusion program, while
      TechCrunch reports that Commonwealth Fusion Systems was still commissioning a
      first-of-kind tokamak after installing a cryostat base. These comparisons provide context
      for execution risk, not evidence that Neo Fusion has matched those milestones. A sector
      research source separately identifies high capital cost, technical complexity, regulatory
      uncertainty, and slow permitting as commercialization constraints. The assigned pool
      contains no source that verifies Neo Fusion revenue, customers, valuation, headcount,
      safety case, or regulatory approval.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014, CO016]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: State-linked platform with a defined flagship asset
    body: Neo Fusion has a clearly identified BEST tokamak program and reported strategic/state-linked ownership, giving it institutional access and a concrete technical asset around which milestones can be assessed.
    claimRefs: [CO002, CO003, CO009]
  - calloutType: risk
    title: Registered capital is not verified runway
    body: The public record reports a large registered-capital base, but the assigned evidence does not show paid-in capital, cash availability, debt, or the budget needed to reach the stated BEST milestones.
    claimRefs: [CO005, CO007]
  - calloutType: recommendation
    title: Research more before underwriting
    body: The company identity and project are sufficiently established for continued diligence, but missing cap-table, governance, funding-use, operating, and regulatory evidence prevents an investment-ready conclusion.
    claimRefs: [CO008, CO012, CO013, CO014]
