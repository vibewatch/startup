evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital
    missingEvidence: >-
      A dated cap table and paid-in-capital schedule separating registered capital, subscribed capital, project
      commitments, debt, and cash.
    whyItMatters: >-
      Registered capital alone cannot establish Neo Fusion's deployable runway or the economic position available to
      outside investors.
    diligencePath: >-
      Obtain the latest audited accounts, capital-contribution records, shareholder agreements, debt schedule, and BEST
      project budget from management or the relevant registry.
    relatedQuestionRefs:
      - QO005
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A complete founder, executive, board, beneficial-owner, and investor-rights record.
    whyItMatters: >-
      Governance visibility is needed to assess key-person dependence, control, related-party risk, and financing
      access.
    diligencePath: >-
      Request current corporate-registration extracts, board and shareholder resolutions, governance documents, and
      management biographies.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: scale
    missingEvidence: Neo Fusion-specific revenue, customer, headcount, procurement, and offtake evidence.
    whyItMatters: >-
      No public evidence in the assigned pool demonstrates commercialization, operating scale, or a customer-backed path
      to revenue.
    diligencePath: >-
      Request management accounts, payroll/headcount records, signed research or offtake contracts, and a customer
      pipeline with status definitions.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: blocking
    topic: regulatory
    missingEvidence: A BEST-specific safety, regulatory, tritium, waste, and permitting package.
    whyItMatters: >-
      A technical milestone does not establish permission to operate or the safety basis required for a future
      power-generating facility.
    diligencePath: >-
      Obtain regulator correspondence, permits, safety-case summaries, environmental documentation, and independent
      technical review for BEST.
    relatedQuestionRefs:
      - QO010
  - type: stale
    severity: minor
    topic: milestones
    missingEvidence: A current project-status update confirming whether the 2027 assembly and 2030 net-energy targets remain in force.
    whyItMatters: Future dates are reported plans and may change as first-of-kind engineering work proceeds.
    diligencePath: >-
      Request a dated BEST integrated schedule, critical-path risk register, budget-to-complete, and milestone
      acceptance report.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: Neo Fusion-specific SAM, SOM, customer pipeline, offtake, tariff, host-site, and unit-economics evidence.
    whyItMatters: Broad market forecasts do not establish the portion Neo Fusion can serve or monetize.
    diligencePath: >-
      Obtain a bottom-up market model tied to named buyer segments, host geography, milestone dates, power price
      assumptions, and signed or qualified counterparties.
    relatedQuestionRefs:
      - QM004
      - QM005
    relatedTableRefs:
      - TM002
      - TM003
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: A reconciled scope and methodology bridge between the Maximize and Precedence market estimates.
    whyItMatters: The headline values differ in label, period, and implied market boundary, creating false precision if combined.
    diligencePath: >-
      Request source methodologies and normalize included technologies, applications, geographies, and revenue
      definitions before using either estimate in valuation.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: commercialization-timing
    missingEvidence: >-
      A Neo Fusion milestone definition connecting BEST completion to first plasma, net energy, licensing, and
      commercial demonstration.
    whyItMatters: A 2027 completion target is not enough to infer revenue timing or bankable adoption.
    diligencePath: >-
      Request the integrated BEST schedule, commissioning gates, permitting path, technical success criteria, and
      post-BEST demonstration plan.
    relatedQuestionRefs:
      - QM007
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Comparable project cost, tariff, offtake, and customer-contract evidence for Neo Fusion and its closest peers.
    whyItMatters: >-
      Without realized commercial terms, capability comparisons cannot be translated into delivered-cost or underwriting
      conclusions.
    diligencePath: Obtain signed offtake or host-site documents, project budgets, tariff assumptions, and customer diligence calls.
    relatedQuestionRefs:
      - QP005
  - type: missing-source
    severity: material
    topic: moat
    missingEvidence: Evidence of proprietary components, licensing rights, switching costs, and export or deployment restrictions.
    whyItMatters: Institutional access may be replicable or may not transfer into durable commercial advantage.
    diligencePath: Request an IP schedule, supplier agreements, licensing plan, and customer deployment architecture.
    relatedQuestionRefs:
      - QP007
      - QP010
  - type: missing-source
    severity: material
    topic: commercialization
    missingEvidence: >-
      Independent evidence on delays, cost escalation, failed milestones, or displacement by alternative fusion
      concepts.
    whyItMatters: First-of-a-kind reactor programs can lose advantage if peers achieve net power or financing milestones first.
    diligencePath: Refresh with project-level construction updates, regulator filings, and independent technical reviews.
    relatedQuestionRefs:
      - QP008
  - type: missing-source
    severity: minor
    topic: competitor-scale
    missingEvidence: Comparable competitor funding and scale disclosures across the named private fusion companies.
    whyItMatters: Scale can affect procurement, hiring, and schedule resilience, but current pool evidence is uneven.
    diligencePath: Collect audited filings, financing announcements, and project-level headcount or supplier disclosures.
    relatedQuestionRefs:
      - QP009
  - type: missing-source
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Audited financial statements, cap table, paid-in-capital schedule, unrestricted cash, monthly burn, runway, debt,
      and committed project-finance documents.
    whyItMatters: >-
      The company is pre-commercial and capital intensive, so sponsorship or registration-capital references cannot
      establish deployable runway or dilution risk.
    diligencePath: >-
      Request a management data room with audited accounts, bank statements, financing agreements, cap table, and a
      24-month cash forecast.
    relatedQuestionRefs:
      - QI005
      - QI006
  - type: missing-source
    severity: material
    topic: monetization
    missingEvidence: >-
      Customer, offtake, licensing, engineering-services, or component-supply contracts with price, volume, timing, and
      recognition terms.
    whyItMatters: >-
      Without realized commercial terms, revenue quality and any valuation based on future power output remain
      untestable.
    diligencePath: >-
      Obtain executed or redacted contracts, backlog, pipeline conversion, payment history, and revenue-recognition
      policy.
    relatedQuestionRefs:
      - QI001
      - QI002
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Integrated engineering budget and independent techno-economic model covering capex, operating cost, maintenance,
      fuel cycle, power conversion, and schedule contingency.
    whyItMatters: >-
      Comparable fusion projects demonstrate equipment complexity, but do not establish Neo Fusion's cost curve or
      margin path.
    diligencePath: >-
      Commission an independent technical and financial model with work-package budgets, milestone probabilities, and
      sensitivity cases.
    relatedQuestionRefs:
      - QI003
      - QI007
  - type: conflicting-data
    severity: material
    topic: milestone-risk
    missingEvidence: >-
      Primary documentation reconciling BEST specifications, milestones, revised schedule, and financing consequences
      after the reported investor dissatisfaction.
    whyItMatters: Milestone changes can increase capex, extend runway needs, or delay commercial credibility.
    diligencePath: >-
      Request the current BEST baseline schedule, change-control log, investor communications, and remaining funding
      requirement.
    relatedQuestionRefs:
      - QI007
  - type: missing-source
