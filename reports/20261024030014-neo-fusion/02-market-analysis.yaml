callouts:
  - calloutType: insight
    title: Near-term market is infrastructure-led
    body: The strongest evidence supports demand for experiments, enabling systems, and public-private demonstration infrastructure before it supports a bankable market for Neo Fusion-generated electricity.
    claimRefs: [CM001, CM002, CM009, CM010]
  - calloutType: assumption
    title: Headline market forecasts are directional
    body: Two published estimates use different scopes and forecast periods, so they should not be combined into a single precise TAM or used as Neo Fusion's serviceable market.
    claimRefs: [CM005, CM006]
