company:
  name: Neo Fusion
chapter:
  number: 2
  title: Market Analysis
  summary: "Neo Fusion participates in a fusion-development market whose commercial boundary is narrower than headline market reports imply: the near-term addressable spend is experimental machines, enabling systems, and public-private demonstration infrastructure, not current electricity revenue. The evidence supports strong clean-power and industrial-demand drivers, but commercialization remains constrained by technical complexity, capital intensity, permitting, and the absence of Neo Fusion-specific customer or offtake proof."
sections:
  - id: market-boundary
    title: Market boundary and status quo
    body: >-
      The relevant market for Neo Fusion is the development and deployment of
      controlled fusion systems, with BEST positioned as an intermediate
      experimental tokamak between EAST and the future CFEDR. That boundary
      includes public research programs, private reactor developers, superconducting
      magnets, plasma-control and diagnostics, cryogenic and materials systems,
      and eventual power-plant engineering. It excludes today's general
      electricity market, unsupported claims of current fusion power sales, and
      unrelated nuclear-fission generation. The evidence describes fusion as a
      prospective source of low-carbon baseload power, with adjacent applications
      in industrial heat, hydrogen production, and space propulsion, but those are
      downstream options rather than demonstrated Neo Fusion revenue pools. The
      status quo is therefore a mix of conventional generation, renewables,
      fission, and continued experimental research; a fusion buyer must justify
      reliability, cost, safety, and schedule against those alternatives.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and commercialization timing
    body: >-
      Published market estimates show why a single TAM number would be
      misleading. Precedence Research estimates a global nuclear-fusion market of
      USD 471.99 billion in 2030 and USD 843.46 billion in 2040, while Maximize
      Market Research reports USD 347.48 billion in 2025 and USD 572.74 billion
      in 2032. These estimates use different labels, forecast windows, and
      methodologies, and neither isolates Neo Fusion's serviceable segment or
      cashable share. The constrained near-term SAM is better represented by
      experimental and pilot-plant procurement, engineering supply chains, and
      public-private demonstration budgets. BEST's stated 2027 completion target
      supports a development-stage timing lens, not a forecast of commercial
      electricity sales. Public market reports identify power generation as the
      dominant application while also naming industrial heat, hydrogen, and space
      propulsion as emerging adjacencies; the adoption path remains contingent on
      machine performance, permitting, and project economics.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyers, drivers, and constraints
    body: >-
      The buyer map is staged rather than a conventional software funnel. Public
      science institutions and state-backed energy or research bodies are the
      apparent current budget owners for experimental devices and enabling
      infrastructure. Industrial partners, utilities, and large electricity
      users become prospective demonstration or offtake counterparties only after
      a machine clears technical and regulatory milestones. Maximize identifies
      clean-energy demand, public-private investment, AI-assisted plasma work,
      and superconducting materials as growth drivers; it also identifies high
      capital costs, extreme operating conditions, complex diagnostics, regulatory
      uncertainty, safety concerns, and slow permitting as constraints. The MIT
      account of CFS's magnet program shows that advanced magnets can improve the
      engineering case, but its described commissioning and failure testing also
      illustrate that first-of-a-kind systems require specialized supply chains,
      validation, and schedule tolerance. For Neo Fusion, the key valuation
      question is whether BEST converts state-supported development capability
      into reproducible reactor, licensing, and eventual offtake economics.
    claimRefs: [CM010, CM011, CM012, CM013, CM014]
    tableRefs: [TM003]
  - id: sizing-gaps
    title: Evidence limits and diligence implications
    body: >-
      The assigned evidence does not establish a Neo Fusion-specific SAM, SOM,
      tariff, host site, customer, purchase agreement, or unit-economics model.
      It also does not show how registration-capital figures translate into
      deployable project cash, nor whether BEST's 2027 completion target means
      first plasma, integrated commissioning, or another milestone. The market
      reports are useful directional lenses but are not substitutes for a
      bottom-up bill of materials, schedule, permitting plan, or power-market
      model. Accordingly, market attractiveness is credible at the sector level
      but commercialization confidence remains low-to-medium. Investors should
      request a milestone-linked budget, machine performance thresholds, a
      regulatory and tritium/waste package, named counterparties or offtake
      evidence,       and a geography-specific comparison with fission, renewables,
      storage, and grid procurement alternatives before underwriting a large
      serviceable market.
    claimRefs: [CM015, CM016]
