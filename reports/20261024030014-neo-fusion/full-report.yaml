      - number: '5.3'
        title: Differentiation, dependencies, and technical risks
        blocks:
          - type: paragraph
            body: >-
              Neo Fusion's potential differentiation is the combination of a compact high-field burning-plasma device,
              access to Hefei's research ecosystem, and a stated bridge from EAST to a future CFEDR-class demonstration
              path. CAS says the international program opens major Hefei fusion platforms to scientists from more than
              ten countries, while the DOE's June 2026 roadmap frames commercial fusion around unresolved science,
              materials, and technology gaps and a fusion pilot-plant path in the 2030s. Those external references
              reinforce that BEST is strategically relevant, but they do not validate Neo Fusion's own performance. A
              Chinese information page reports a plan to complete BEST assembly in 2027 and achieve fusion energy output
              greater than input in 2030; this is a company/project roadmap claim, not an observed result. The principal
              diligence risks are therefore unverified first-plasma and net-energy milestones, high-flux materials and
              component lifetime, tritium and waste handling, thermal and electrical integration, control reliability,
              and the absence of a public machine-level safety or regulatory package. A sector market report also notes
              that continuous commercial-scale fusion is difficult because plasma stability requires sophisticated
              control and small technical failures can cause costly delays; its forecasts are not Neo Fusion-specific
              evidence.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
