              - CI010
              - CI011
              - CI012
              - CI015
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The available evidence points to financing dependency without providing a cash balance or runway. A
              company profile says Neo Fusion is majority owned by state-owned enterprises including China National
              Petroleum Corporation and Hefei Science Island, and Baidu Baike reports that registered capital increased
              from RMB 5.0 billion to RMB 14.5 billion in 2024. Registered capital is not evidence of paid-in capital or
              cash available for operations. A 2026 Anhui report separately describes planned university collaboration
              and a broader fusion-industry ecosystem. These facts may indicate institutional sponsorship and access to
              an industrial network, but they do not establish unrestricted cash, debt terms, committed project finance,
              or investor rights. The assigned FusionXInvest headline flags a possible reduction in investor exposure,
              but the fetched page exposes only a membership gate; neither the transaction nor its rationale is
              verified. The appropriate conclusion is financing uncertainty, not a precise solvency judgment.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI016
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Neo Fusion's financial profile is best treated as pre-commercial infrastructure and technology
              underwriting. Industry sources describe growing private fusion investment and future power-purchase
              activity, but those are sector comparables and not Neo Fusion revenue, valuation, or cash availability. A
              market report forecasts large fusion-market totals while simultaneously describing high capital costs,
              technical complexity, regulatory uncertainty, and possible delays beyond 2030; those forecasts are
              directional context, not a company forecast. The central diligence question is whether a verified
              financing plan bridges the company from current engineering work to first plasma, then to a
              power-generating demonstration and customer or offtake contracts. Until management supplies audited
              financials, cap table, cash and burn schedule, milestone budget, debt/project-finance obligations, and
              commercialization terms, the recommendation should remain research-more with low confidence in financial
              underwriting.
            claimRefs:
              - CI013
              - CI014
