      - number: '4.2'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              Fusion development has a structurally heavy cost base: high-temperature plasma systems, superconducting
              magnets, cryogenics, vacuum systems, diagnostics, specialized fabrication, site infrastructure, and
              engineering labor must be funded before commercial output. Comparable public reporting describes SPARC
              assembly around a 1,000-tonne machine, major cryostat and magnet interfaces, and a planned commercial
              plant, illustrating why a prototype-to-power pathway should not be modeled like a software business.
              Market research also identifies high capital costs and technological complexity as commercialization
              constraints. Neo Fusion-specific gross margin, engineering cost per milestone, manufacturing yield,
              service-delivery cost, working-capital cycle, and capex schedule are not publicly established.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
