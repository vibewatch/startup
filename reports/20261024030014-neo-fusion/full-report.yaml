  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Nuclear regulation is a gating risk rather than a routine compliance item for a pre-commercial fusion
              developer. China's Nuclear Safety Law applies to nuclear facilities, nuclear materials, and radioactive
              waste, and requires licensing for siting, construction, operation, and decommissioning. It also assigns
              the operator overall nuclear-safety responsibility and requires safety analysis, environmental-impact
              documentation, quality assurance, emergency planning, and financial protection. The retained record does
              not show a Neo Fusion-specific license, safety analysis, environmental approval, or regulator decision.
              Until those documents are produced, the probability and timing of regulatory delay remain unresolved, and
              the investment case should treat first plasma and any later power-production milestone as conditional
              rather than scheduled.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR007
              - CR013
      - number: '7.2'
        title: Operational, technical, and commercialization risk
        blocks:
          - type: paragraph
            body: >-
              The central operating risk is not merely whether a fusion pulse can be produced, but whether a repeatable,
              maintainable and licensable plant can be built at an economic cost. A Baidu-compiled profile reports that
              BEST assembly began in May 2025, with completion planned for 2027 and energy output above input planned
              for 2030; this is a milestone narrative, not an independently audited schedule or performance result. The
              public evidence available to this chapter does not document Neo Fusion's machine-level safety case,
              tritium and radioactive-waste handling, uptime, component lifetime, or independently verified energy gain.
              Broader energy evidence warns that levelized cost does not capture every system-level effect. The
              appropriate mitigation is staged technical disclosure with independent review and explicit go/no-go
              criteria for plasma performance, availability, safety, and cost.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR009
              - CR011
              - CR015
              - CR016
      - number: '7.3'
        title: Partner, capital, and execution dependencies
        blocks:
          - type: paragraph
            body: >-
              Fusion commercialization is capital- and ecosystem-intensive, and the assigned evidence does not establish
              Neo Fusion's cash balance, paid-in capital, debt, committed financing, supplier concentration, or customer
              contracts. FusionXInvest reports majority ownership by state-owned entities, creating a material
              governance and strategic-capital dependency whose exact rights remain undisclosed. A funding announcement
              from another fusion company illustrates sector capital requirements but is not evidence of Neo Fusion's
              runway. As a commercial benchmark, Google signed a 200 MW agreement with Commonwealth Fusion Systems that
              POWER reports is tied to SPARC reaching net fusion energy. Diligence should obtain a cap table,
              paid-in-capital schedule, milestone budget, governance rights, procurement plan, and binding offtake or
              host-site commitments.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR014
              - CR016
      - number: '7.4'
        title: Monitoring and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The practical risk framework is to monitor evidence that converts an unresolved question into a measurable
              failure. A thesis break would include a missed licensing gate without a documented revised path, material
              slippage against the reported 2027 assembly or 2030 net-energy milestones without a funded recovery plan,
              failure to demonstrate repeatable machine performance against a published metric, a material increase in
              required capital without committed sources, loss of a critical partner or supplier without replacement, or
              inability to show a credible safety, waste, maintenance, and grid-integration package. These triggers are
              evidence-based because the assigned pool contains no confirmed Neo Fusion incident, lawsuit, outage, or
              customer-loss record. That absence is not proof that no such event occurred.
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR010
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary diligence blocker
            body: >-
              Do not treat BEST milestones as investable execution evidence until Neo Fusion provides regulator-verified
              approvals, an independent machine and safety package, and a reconciled financing runway.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investment case is strategic rather than conventionally financial. Public descriptions place Neo
              Fusion at the intersection of Hefei's fusion-science base, state-linked capital, and a commercial vehicle
              intended to move BEST from experiment toward later demonstration and power applications. The company was
              established in 2023, and the accessible company profile describes tokamak development and majority
              ownership by state-owned enterprises. A separate 36Kr report says registered capital rose from CNY 5
              billion to CNY 14.5 billion and identifies CNY 2.9 billion from China National Petroleum Kunlun Capital
              for a 20% stake. Those figures are capital-structure signals, not a priced financing valuation or proof
              that the full registered-capital amount is paid in and available for construction. The anti-thesis is
              therefore material: the public record still lacks an outside-investor price, cap-table rights, cash
              runway, revenue, offtake, or a machine-to-grid economics bridge. The DOE roadmap is useful context, not
              Neo Fusion evidence: it says private fusion investment exceeds $10 billion while critical materials and
              fuel-cycle gaps remain.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV011
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV009
              - CV010
              - CV013
      - number: '8.2'
        title: Financing context and market discipline
        blocks:
          - type: paragraph
            body: >-
              Fusion financing is attracting large strategic and institutional commitments, but sector funding should
              not be used as a proxy for Neo Fusion's valuation. The Fusion Report describes Commonwealth Fusion
              Systems' July 2026 additional $1 billion equity financing and a $4 billion cumulative total, while
              Helion's June 2026 round carried a reported $15.5 billion post-money valuation. These are competitor
              transactions with different technologies, jurisdictions, milestones, and disclosure; they are not
              comparable-company marks for Neo Fusion. Market research reports also publish very large
              addressable-market forecasts, but their definitions combine research, equipment, pilot plants, and future
              power applications, so they do not establish serviceable revenue or a company-level multiple. The more
              decision-useful external discipline is cost and deployment learning: Our World in Data reports an 88% fall
              in utility-scale solar electricity cost from 2009 to 2024, while Lazard's 2026 LCOE+ summary says
              renewables remain the most cost-competitive unsubsidized new-build generation. Fusion must ultimately
              clear those alternatives on delivered cost, reliability, schedule, and financing risk; no retained source
              demonstrates that Neo Fusion does so today.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV003
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.3'
        title: Scenarios, recommendation, and entry discipline
        blocks:
          - type: paragraph
            body: >-
              A defensible scenario framework is milestone-based, not a discounted-cash-flow exercise. The favorable
              case requires BEST to meet its disclosed engineering sequence, demonstrate energy output greater than
              input around 2030, and convert scientific capability into a funded demonstration and credible commercial
              pathway. The base case is continued strategic financing and technical progress without enough public
              evidence to underwrite a power-plant return, leaving the asset suitable for monitoring rather than a
              priced buy. The adverse case is schedule slippage, cost escalation, unresolved fuel-cycle or materials
              gaps, or a financing round that reveals dilution, preference, or governance terms unfavorable to new
              capital. The evidence supports research-more with low confidence in any precise valuation stance, not a
              buy call. Entry discipline should be defined by a verified paid-in-capital schedule, milestone budget,
              independent technical review, and financing terms. A numerical target return or valuation range would be
              false precision because current public sources do not provide Neo Fusion revenue, cash burn, project cost,
              ownership economics, or an exit market.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV011
              - CV013
              - CV014
      - number: '8.4'
        title: Exit readiness and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is presently unproven. The retained company description identifies a three-stage ambition
              spanning an experimental device, an engineering demonstration device, and a commercial power station,
              while the Baike entry reports a 2027 assembly target and a 2030 energy-output target. Those dates are
              useful monitoring markers, not contracted delivery obligations or an investable exit timetable. A credible
              next financing or strategic exit would require evidence of technical acceptance, commercial
              counterparties, licensing and safety readiness, and transparent investor rights. The thesis breaks if
              registered capital cannot be reconciled to paid-in cash and committed uses, if BEST milestones move
              without a funded recovery plan, if independent engineering cannot validate performance, or if
              delivered-power economics are materially inferior to available low-carbon alternatives. The immediate
              diligence ask is a data room covering cap table, paid-in capital, preference stack, debt, budget,
              milestones, procurement, regulatory status, offtake, and commercialization assumptions. Until that package
              exists, valuation should remain unknown and recommendation research-more.
            claimRefs:
              - CV002
              - CV011
              - CV013
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more, not a priced buy
            body: >-
              Strategic backing and a visible BEST path are meaningful positives, but the retained evidence does not
              disclose a Neo Fusion valuation, deployable cash, revenue, offtake, or plant economics.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV011
              - CV014
          - type: callout
            title: Registered capital is not valuation
            body: >-
              The reported CNY 14.5 billion registered-capital figure must not be presented as paid-in cash, enterprise
              value, or available runway until the cap table and capital schedule are verified.
            calloutType: risk
            claimRefs:
              - CV002
              - CV003
              - CV015
