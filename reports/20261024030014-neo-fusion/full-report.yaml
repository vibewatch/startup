  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and maturity
        blocks:
          - type: paragraph
            body: >-
              Neo Fusion's product is not a commercial electricity tariff or an operating power plant; it is the BEST
              experimental fusion platform and the engineering capability around it. A company profile describes Neo
              Fusion as founded in 2023 in Anhui and focused on designing and developing a tokamak fusion device. The
              company profile also describes majority ownership by state-owned enterprises including China National
              Petroleum Corporation and Hefei Science Island, controlled by the Chinese Academy of Sciences. A separate
              company-information page says the business was established on 19 May 2023 and describes BEST as its main
              project, but that page is a secondary directory rather than an audited technical disclosure. Independent
              coverage says BEST construction began in 2023, the main building was complete, and component pre-assembly
              had begun; it reports expected completion in 2027. That is meaningful physical maturity, but it is not
              evidence that the device has achieved plasma performance, net energy, or power-plant reliability.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE008
