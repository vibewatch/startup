              2024, but the public pool does not provide a cap table, investor-rights schedule, debt terms, board
              composition, founder biographies, or a complete executive roster. That opacity is material because the
              project is capital-intensive and the ownership structure may determine control, funding continuity, and
              access for outside capital.
