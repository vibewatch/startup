      - number: '1.3'
        title: Milestones and commercialization readiness
        blocks:
          - type: paragraph
            body: >-
              Neo Fusion's observable milestone path is centered on BEST, a compact tokamak fusion experiment intended
              to bridge research capability and a future commercial route. The Baidu Baike record says the company was
              formed on 2023-05-19, describes the 2024 ownership and registered-capital change, reports that BEST
              engineering assembly began in 2025, and records a 2026-09-27 shipment of batch-manufactured TF coil boxes.
              It also states a plan for assembly completion in 2027 and fusion-energy output greater than input in 2030;
              those are plans or reported targets, not achieved operating results. Independent comparator evidence shows
              why engineering execution matters: MIT reports a 20-tesla high-temperature-superconducting magnet test for
              a different fusion program, while TechCrunch reports that Commonwealth Fusion Systems was still
              commissioning a first-of-kind tokamak after installing a cryostat base. These comparisons provide context
              for execution risk, not evidence that Neo Fusion has matched those milestones. A sector research source
              separately identifies high capital cost, technical complexity, regulatory uncertainty, and slow permitting
              as commercialization constraints. The assigned pool contains no source that verifies Neo Fusion revenue,
              customers, valuation, headcount, safety case, or regulatory approval.
