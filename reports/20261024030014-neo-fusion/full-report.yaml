  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              The relevant market for Neo Fusion is the development and deployment of controlled fusion systems, with
              BEST positioned as an intermediate experimental tokamak between EAST and the future CFEDR. That boundary
              includes public research programs, private reactor developers, superconducting magnets, plasma-control and
              diagnostics, cryogenic and materials systems, and eventual power-plant engineering. It excludes today's
              general electricity market, unsupported claims of current fusion power sales, and unrelated
              nuclear-fission generation. The evidence describes fusion as a prospective source of low-carbon baseload
              power, with adjacent applications in industrial heat, hydrogen production, and space propulsion, but those
              are downstream options rather than demonstrated Neo Fusion revenue pools. The status quo is therefore a
              mix of conventional generation, renewables, fission, and continued experimental research; a fusion buyer
              must justify reliability, cost, safety, and schedule against those alternatives.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM010
      - number: '2.2'
        title: Sizing lenses and commercialization timing
        blocks:
          - type: paragraph
            body: >-
              Published market estimates show why a single TAM number would be misleading. Precedence Research estimates
              a global nuclear-fusion market of USD 471.99 billion in 2030 and USD 843.46 billion in 2040, while
              Maximize Market Research reports USD 347.48 billion in 2025 and USD 572.74 billion in 2032. These
              estimates use different labels, forecast windows, and methodologies, and neither isolates Neo Fusion's
              serviceable segment or cashable share. The constrained near-term SAM is better represented by experimental
              and pilot-plant procurement, engineering supply chains, and public-private demonstration budgets. BEST's
              stated 2027 completion target supports a development-stage timing lens, not a forecast of commercial
              electricity sales. Public market reports identify power generation as the dominant application while also
              naming industrial heat, hydrogen, and space propulsion as emerging adjacencies; the adoption path remains
              contingent on machine performance, permitting, and project economics.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
      - number: '2.3'
        title: Buyers, drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The buyer map is staged rather than a conventional software funnel. Public science institutions and
              state-backed energy or research bodies are the apparent current budget owners for experimental devices and
              enabling infrastructure. Industrial partners, utilities, and large electricity users become prospective
              demonstration or offtake counterparties only after a machine clears technical and regulatory milestones.
              Maximize identifies clean-energy demand, public-private investment, AI-assisted plasma work, and
              superconducting materials as growth drivers; it also identifies high capital costs, extreme operating
              conditions, complex diagnostics, regulatory uncertainty, safety concerns, and slow permitting as
              constraints. The MIT account of CFS's magnet program shows that advanced magnets can improve the
              engineering case, but its described commissioning and failure testing also illustrate that first-of-a-kind
              systems require specialized supply chains, validation, and schedule tolerance. For Neo Fusion, the key
              valuation question is whether BEST converts state-supported development capability into reproducible
              reactor, licensing, and eventual offtake economics.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: Evidence limits and diligence implications
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not establish a Neo Fusion-specific SAM, SOM, tariff, host site, customer,
              purchase agreement, or unit-economics model. It also does not show how registration-capital figures
              translate into deployable project cash, nor whether BEST's 2027 completion target means first plasma,
              integrated commissioning, or another milestone. The market reports are useful directional lenses but are
              not substitutes for a bottom-up bill of materials, schedule, permitting plan, or power-market model.
              Accordingly, market attractiveness is credible at the sector level but commercialization confidence
              remains low-to-medium. Investors should request a milestone-linked budget, machine performance thresholds,
              a regulatory and tritium/waste package, named counterparties or offtake evidence,       and a
              geography-specific comparison with fission, renewables, storage, and grid procurement alternatives before
              underwriting a large serviceable market.
            claimRefs:
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Near-term market is infrastructure-led
            body: >-
              The strongest evidence supports demand for experiments, enabling systems, and public-private demonstration
              infrastructure before it supports a bankable market for Neo Fusion-generated electricity.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM010
          - type: callout
            title: Headline market forecasts are directional
            body: >-
              Two published estimates use different scopes and forecast periods, so they should not be combined into a
              single precise TAM or used as Neo Fusion's serviceable market.
            calloutType: assumption
            claimRefs:
              - CM005
              - CM006
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and strategic position
        blocks:
          - type: paragraph
            body: >-
              Neo Fusion competes in a heterogeneous field rather than a single product market. Its disclosed path is a
              tokamak and BEST-centered engineering program, with company-profile evidence describing a 2023 founding
              and a majority state-owned structure. The Chinese program context is material: Xinhua reported that BEST
              is intended to demonstrate net fusion power gain and electricity generation around 2030, while also
              placing the project in a broader national move from fundamental research toward engineering. The nearest
              direct commercial comparison in the retained evidence is Commonwealth Fusion Systems (CFS), whose SPARC
              tokamak is being assembled for a planned 2027 start and whose ARC plant has a stated Virginia site. Other
              alternatives include laser-based inertial confinement at the National Ignition Facility, established
              public programs such as ITER, and other private concepts such as Helion, TAE, General Fusion, and Tokamak
              Energy. These are not interchangeable products: they differ in plasma configuration, maturity, financing
              model, and intended route to grid power.
            claimRefs:
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP013
      - number: '3.2'
        title: Buyer trade-offs, capability, and distribution
        blocks:
          - type: paragraph
            body: >-
              A future fusion buyer is likely to value credible net-power performance, repeatable component
              manufacturing, regulatory readiness, schedule confidence, and a path to plant financing more than a
              laboratory milestone alone. CFS provides a useful comparator because TechCrunch describes both a physical
              SPARC assembly milestone and a multi-month commissioning process, while MIT's account of the underlying
              REBCO magnet work shows that the technology advantage depends on difficult engineering and supply-chain
              execution. Neo Fusion's differentiator is access to Chinese state-linked institutions and a domestic
              engineering ecosystem, but public sources do not disclose a commercial customer, power-purchase agreement,
              list price, or realized unit economics. Accordingly, the matrix separates observed capability or strategic
              access from unsupported commercial assumptions. Internal build and status quo remain credible categories
              because a buyer may defer adoption or rely on public research infrastructure rather than buy a private
              reactor, but this pool does not support a quantified comparison of those alternatives.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Neo Fusion's potential moat is institutional and execution-based rather than a proven recurring
              software-style lock-in. The disclosed combination of Chinese Academy of Sciences-linked research,
              state-owned capital, and BEST engineering access may improve patient capital, procurement, and domestic
              coordination. It does not by itself establish superior reactor economics. CFS has demonstrated a different
              form of advantage through high-temperature-superconductor magnet development, private-company
              construction, and a stated commercial-site plan; MIT reports that the magnet program included full-scale
              testing and supply-chain procurement. The competitive threat is therefore milestone convergence: if
              several concepts reach net power, the advantage may move to manufacturing yield, licensing, financing,
              grid integration, and delivered cost. The retained evidence does not establish Neo Fusion's pricing,
              export strategy, component exclusivity, or customer switching costs, so those items remain diligence gaps
              rather than asserted weaknesses. Sector research also identifies high capital cost, plasma-stability
              complexity, and regulatory uncertainty as common constraints, so schedule slippage or cost escalation can
              erode differentiation without a superior reactor concept emerging.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP011
              - CP014
      - number: '3.4'
        title: Evidence boundary and open issues
        blocks:
          - type: paragraph
            body: >-
              The comparison is deliberately evidence-constrained. Public market reports list many fusion concepts and
              describe intense competition, but their market-size forecasts are not direct evidence of Neo Fusion's
              obtainable market or of any competitor's realized economics. Unknown cells should be treated as
              underwriting gaps, not as evidence that a competitor lacks the capability. The table therefore
              distinguishes technical pathway, observed construction, and commercial evidence, since those dimensions
              mature on different schedules and cannot be collapsed into one unverified ranking.
            claimRefs:
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Institutional access is not yet a commercial moat
            body: >-
              Neo Fusion's state-linked structure and BEST access may support capital and engineering continuity, but
              the retained evidence does not show customer contracts, price, plant economics, or switching costs.
            calloutType: insight
            claimRefs:
              - CP008
              - CP009
          - type: callout
            title: Milestone convergence could shift the basis of competition
            body: >-
              If multiple fusion concepts reach net power, manufacturing yield, licensing, financing, grid integration,
              and delivered cost may matter more than the initial reactor concept.
            calloutType: risk
            claimRefs:
              - CP010
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization visibility
        blocks:
          - type: paragraph
            body: >-
              Neo Fusion's public profile describes a 2023-founded Anhui company focused on controlled-fusion technology
              and tokamak development, not a commercial product with disclosed customers or contract terms. Its
              public-facing activity is framed around building a fusion device and participating in an emerging
              industrial ecosystem. That supports an R&D or project-development interpretation, but it does not
              establish recurring revenue, recognized revenue, ARR, GMV, utilization, or realized pricing. The financial
              underwriting consequence is that any future monetization is contingent on technical milestones, project
              finance, and eventual power or technology commercialization rather than current operating cash generation.
              Official or customer contracts, revenue recognition policies, backlog, and paid pilot evidence remain
              unavailable in the assigned evidence.
