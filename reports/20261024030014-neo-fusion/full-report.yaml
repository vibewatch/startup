chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, location, and operating model
        blocks:
          - type: paragraph
            body: >-
              Neo Fusion, also identified in Chinese records as 聚变新能（安徽）有限公司, was founded in 2023 and is located in
              Hefei, Anhui, China. FusionXInvest describes the company as developing controlled-fusion technologies for
              global commercial use, with a primary focus on designing and developing a tokamak fusion device. Its
              company profile says Neo Fusion is majority owned by state-owned enterprises, including China National
              Petroleum Corporation and Hefei Science Island, which is controlled by the Chinese Academy of Sciences.
              The Baidu Baike record describes the company as a research-and-engineering vehicle whose operating scope
              includes emerging-energy research, nuclear-power equipment engineering services, power-generation
              technical services, and related engineering and intellectual-property services. This evidence supports a
              pre-commercial, state-linked technology-development model rather than a demonstrated merchant-power
              business. No source in the assigned pool establishes paying customers, commercial revenue, ARR, or a
              completed power-plant project.
