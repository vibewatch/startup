      - number: '5.2'
        title: Architecture and operating workflow
        blocks:
          - type: paragraph
            body: >-
              The disclosed architecture is a compact, high-field tokamak with superconducting magnets, long-pulse
              operation, and a burning-plasma research objective. The Institute of Plasma Physics at the Max Planck
              Society describes the comparison stellarator Wendelstein 7-X as using 50 non-planar superconducting coils
              to produce its optimized magnetic field and to investigate continuous operation; this is a useful external
              benchmark for the engineering burden of superconducting magnetic confinement, not a claim about Neo
              Fusion's design. The BEST descriptions instead emphasize high neutron fluence, high density, and high
              energy and particle flux as deliberate test conditions. CAS reporting says the planned experiments use
              deuterium-tritium burning plasma, target 20 to 200 megawatts of fusion power, and seek net energy gain.
              The workflow therefore runs from superconducting magnetic confinement and plasma heating through
              long-pulse burning-plasma experiments and measurement of energy and particle exhaust; public material does
              not disclose a complete subsystem bill of materials, tritium-breeding design, heat-extraction design, or
              control-system performance.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
