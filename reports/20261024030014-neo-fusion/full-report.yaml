              - CE013
          - type: callout
            title: Architecture boundary
            body: >-
              The chapter treats BEST as a research and engineering platform rather than assuming that a fusion-power
              target implies grid electricity, positive cash generation, or commercial readiness.
            calloutType: assumption
            claimRefs:
              - CE008
              - CE010
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and ecosystem roles
        blocks:
          - type: paragraph
            body: >-
              Neo Fusion's evidenced counterparties are capital and institutional stakeholders rather than disclosed
              commercial customers. Reuters reported that Anhui government-owned energy companies and investment arms
              controlled 50% of the company at formation, while Nio and Nio Capital held 19.9% and 10.1% respectively.
              CnEVPost described the project as intended to attract additional strategic and financial investors in
              phases, and FusionXInvest describes a primary focus on designing and developing a tokamak device. This
              points to a stakeholder model in which state-linked energy entities may be future hosts, infrastructure
              partners, or offtake enablers, while Nio is a strategic investor and potential industrial ecosystem
              participant; none of those roles, by themselves, proves a paying customer relationship. The available
              record does not identify a signed power purchaser, a utility offtake contract, a paid pilot, or a
              recurring commercial service.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU012
              - CU015
      - number: '6.2'
        title: Adoption and named proof
        blocks:
          - type: paragraph
            body: >-
              The observable trajectory is project formation and technical development, not market adoption. Public
              descriptions place the company in Hefei and characterize its activity as controlled-fusion research and
              tokamak development; the referenced company profile does not report customer counts, production sites,
              utilization, revenue, or renewals. The customer-facing proof available in this pool is indirect: Nio's
              investment and the surrounding Anhui energy infrastructure context demonstrate strategic interest, while
              the public energy plan describes system-level demand for generation, transmission, storage, and
              flexibility. Those signals can support a future partner-development hypothesis, but they cannot be
              converted into active-account or deployment metrics. A diligence-ready adoption series therefore has
              missing denominators and missing commercial milestones. A September 2026 BEST component shipment is
              evidence of construction progress, not customer acceptance. By comparison, a fusion peer has publicly
              documented external-supplier coordination, illustrating the kind of third-party execution trail Neo Fusion
              has not disclosed in this assigned evidence; the competitor example is not an independent benchmark or
              proof of equivalent maturity.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU015
              - CU016
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU009
              - CU016
      - number: '6.3'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              No source in the assigned pool reports Neo Fusion's NRR, GRR, churn, renewal rate, contract length,
              customer satisfaction, or revenue concentration. The clearest concentration signal is ownership and
              ecosystem dependence: Reuters attributes half of the initial control to Anhui government-owned energy
              companies and investment arms, while Nio and Nio Capital together represented 30% of the disclosed equity
              stakes. That structure may provide patient strategic support, but it also leaves outside investors without
              evidence that demand is diversified beyond state-linked capital and strategic sponsors. The Fusion Report
              explicitly excludes Chinese fusion-company funding from its industry totals because that market is opaque;
              this is an industry-level caution, not evidence of Neo Fusion customer performance. Expansion into power
              production would additionally require offtake, licensing, grid interconnection, and plant-economics
              evidence that is not disclosed here. ITER describes fusion's baseload potential but says average
              electricity cost cannot yet be extrapolated before operating experience and identifies reliable tritium
              breeding and recovery as a critical challenge. These sector-level constraints reinforce that bankable
              economics and fuel-cycle validation precede durable utility demand.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
