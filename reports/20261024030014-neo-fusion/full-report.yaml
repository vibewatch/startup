      - number: '1.2'
        title: Ownership, capital, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The available evidence indicates a government-linked capitalization structure, but it does not show the
              distinction between registered capital, paid-in capital, committed project funding, and cash available for
              construction. Baidu Baike records an initial registered capital of RMB5 billion at formation and RMB14.5
              billion after a 2024 increase, and identifies China National Petroleum Group Kunlun Capital and Hefei
              Science Island Holdings as shareholders added that year. These figures should not be treated as a
