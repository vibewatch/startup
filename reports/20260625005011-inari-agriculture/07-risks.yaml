- id: mitigation-and-kill-criteria
  title: Mitigations, monitoring signals, and kill criteria
  body: >-
    The practical mitigation case is real but incomplete. Regulatory risk can be reduced by keeping products inside the clearest U.S. categories, engaging APHIS early, and sequencing launch geographies toward friendlier jurisdictions and higher-value partners first. Acceptance risk can be reduced by benefit-led communication, transparent labeling options, and letting partners sell agronomic outcomes rather than molecular abstractions. Litigation risk can be managed through docket monitoring, targeted settlement analysis, insurance or reserve planning, and partner diligence on germplasm provenance and depository practice. Operational risk can be reduced by proving repeatability crop by crop instead of overextending the platform promise into too many simultaneous launches.


    But those mitigations only matter if they produce observable signals. Investors should look for hard evidence that field performance is reproducible across environments, that launch partners expand beyond the current named set, and that regulatory pathways are becoming shorter rather than more bespoke. The case should be marked down materially if the Corteva dispute produces an injunction risk, a broad adverse interpretation of depository use, or partner hesitation around freedom-to-operate. Likewise, the thesis should break if Inari needs another major restructuring or large fundraise before public evidence of partner conversion and commercial seed volumes emerges. In other words, the company is still investable only as a staged de-risking story: regulation, IP, field proof, and channel expansion each need to improve in sequence, and failure on any one of those nodes can propagate into revenue timing, valuation, and financing pressure.
