- id: litigation-and-ip
  title: Litigation, IP, and concentration risk
  body: >-
    The sharpest company-specific external risk is the Corteva litigation. Public docket materials show the case has been running since 2023 and, as of Judge Murphy's March 2, 2026 memorandum, was moving through expert discovery and dispositive motions with a September 23, 2026 trial date. The dispute is not a nuisance complaint. Corteva alleges that Inari exploited deposited seed technology and overlapping patent/PVP rights to enter the market, while Inari argues that access to patented biological material is necessary for follow-on innovation and that layered IP rights can be used anti-competitively. The court has already rejected some of Inari's patent-misuse and sham-litigation theories while allowing other defenses, including unclean hands, to continue. That leaves meaningful legal uncertainty without giving Inari a clean procedural escape hatch.


    The May 2026 DOJ statement of interest raises the stakes further by framing the case as relevant to competition in a seed industry with high concentration and high barriers to entry. That language helps explain why litigation risk here is strategic, not just legal expense. If partners, investors, or prospective acquirers conclude that freedom-to-operate around elite germplasm, deposited material, or stacked IP rights is narrower than expected, commercialization timelines and bargaining power can deteriorate before any final judgment. Inari also markets its own deep IP portfolio and proprietary toolbox, which is useful offensively and defensively but increases the chance of reciprocal disputes in a concentrated industry dominated by better-capitalized incumbents. The residual exposure is therefore not just damages; it is launch delay, partner hesitation, and wider discount rates on a business that still depends on third-party channels to monetize.
  claimRefs:
