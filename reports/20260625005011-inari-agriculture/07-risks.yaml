  - - Funding dependence
    - Capital and restructuring signals
    - Another major layoff or large raise before public evidence of partner conversion and product pull-through
    - Assume longer path to scale and higher dilution risk
  notes: These kill criteria are intentionally observable from future filings, releases, and diligence materials rather than internal narrative alone.
