- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Inari solution
  - Measurable benefit
  - Limitation
  rows:
  - - Choose yield-improvement targets in broadacre crops
    - Conventional breeding and trait search over long cycles
    - Predictive design proposes high-value edit targets inside elite germplasm programs
    - Company claims faster design loops and better odds of complex-trait improvement
    - No public benchmark on model precision versus alternatives
  - - Apply multiple edits to complex pathways
    - Sequential or single-gene edit programs
    - Multiplex gene editing toolbox can combine several edit types at once
    - Company claims ability to address complex pathways such as yield and resource use
    - Public sources do not disclose edit efficiency, off-target rates, or throughput
  - - Validate edits before commercialization
    - Greenhouse and field testing across crop environments
    - Design Blueprints and field-feedback loop route candidates through lab, greenhouse, and field
    - Independent sources confirm greenhouse expansion and ongoing demos/trials
    - Validation still needs multiple seasons and regional proof
  - - Move designs into farmer-facing products
    - Seed company must integrate edits into branded varieties
    - Partner-led route through Beck’s, Mertec/MS, Eden/Stine, and InterGrain
    - Lowers need for Inari-owned distribution and leverages partner germplasm
    - Creates dependence on partners for launch timing and channel adoption
  - - Support sustainability and ROI claims
    - Seed seller must show farm-level value, not just lab novelty
    - High Yield Designs and wheat targets frame yield plus resource-efficiency benefits
    - Public claims include +7.5% soybean target and 10–15% wheat target
    - Public evidence does not yet show realized commercial-acre outcomes
  notes: Benefit cells separate company-claimed agronomic upside from independently observed workflow milestones.
