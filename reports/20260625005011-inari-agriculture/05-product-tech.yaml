- id: ip-position-and-regulatory-fit
  title: IP position and regulatory fit
  body: 'Inari’s product differentiation claim is not just “we use CRISPR.” Public materials argue for a broader stack: predictive design on the front end, multiplex editing in the middle, and a widening patent estate around delivery methods, guide-RNA movement, regulatory-sequence optimization, and edited GM-trait packaging. The 2022 GM-traits announcement is especially notable because Inari claimed patents on edited versions of established corn and soybean GM traits and said its proprietary CRISPR-CasS system let it work outside third-party patent thickets. Independent patent listings do not verify freedom to operate, but they do show a genuine spread of patent families from 2024 through 2026 in machine-learning-guided regulatory-sequence design, root-mediated guide-RNA delivery, plant germline editing, delivery chemistry, and other plant-editing methods. That breadth suggests Inari is trying to own workflow leverage points, not just one crop trait.


    Regulatory fit also looks stronger than many biotech startups get. APHIS said Inari’s gene-engineered soybean for enhanced yield and plant architecture is not subject to 7 CFR part 340, and a separate APHIS letter said Inari’s CRISPR-edited wheat lines with increased yield and modified architecture are not regulated articles under part 340 once plant-pest vector sequences are bred out. CRS materials reinforce that gene-edited crops can already commercialize in the United States under the coordinated USDA/FDA/EPA framework. But “not regulated by APHIS” is not the same thing as “no regulatory work left.” Both APHIS letters explicitly point to possible EPA, FDA, and quarantine authorities, and international launches still depend on local rules such as the Australian framework InterGrain references.'
