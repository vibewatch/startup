figures:
- id: FE001
  title: Product architecture map
  type: stack
  layout: wide
  summary: Layered view of Inari’s public SEEDesign™ architecture from data and modeling through editing and field validation.
  data:
    layers:
    - label: Multi-omic data layer
      detail: Sequence, transcriptomic, proteomic, epigenomic, structural-variant, and field-linked data implied by platform copy and computational-biology hiring.
    - label: Predictive Design Engine
      detail: Machine-learning and genomic-science layer used to choose edits for predictable trait outcomes and design blueprints.
    - label: Gene Editing Toolbox
      detail: Multiplex editing layer that can turn genes on or off, tune expression, and make targeted replacements using natural DNA edits.
    - label: Design Blueprints + validation
      detail: Candidate designs are applied to crop varieties, then refined through greenhouse and field data from sequence to phenotype to field and back.
    - label: Partner commercialization layer
      detail: Seed-company partners integrate validated designs into branded crop portfolios for farmer delivery.
  approximationNotes: Layer boundaries are an analyst synthesis from public descriptions, job postings, and whitepaper language; Inari has not published a formal systems diagram.
