  evidenceGaps:
  - type: missing-source
    severity: material
    topic: quality-disclosure-gap
    missingEvidence: Public documentation of stewardship controls, seed quality KPIs, cybersecurity or data-governance certifications, and product-recall or incident history.
    whyItMatters: The company markets a software-heavy, biologically sensitive platform, but investors still need visibility into operational controls and risk management beyond regulatory letters.
    diligencePath: Request quality manuals, stewardship SOPs, audit summaries, security policies, and incident logs from management.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: commercial-launch-scale
    missingEvidence: Commercial SKU list, acreage under trial or launch, seed multiplication volumes, and partner launch calendars for soy, corn, and wheat.
    whyItMatters: Technical maturity and greenhouse scale do not translate directly into launch readiness without multiplication, channel, and acreage evidence.
    diligencePath: Ask for partner pipeline by crop, multiplication plans, launch geographies, and current commercial acres by season.
    relatedTableRefs:
    - TE001
    - TE005
  - type: missing-source
    severity: material
    topic: agency-completeness
    missingEvidence: Public FDA or EPA consultation status for each relevant Inari crop program.
    whyItMatters: APHIS non-regulated determinations do not alone clear every pathway needed for broad commercialization or international product planning.
    diligencePath: Request management’s agency interaction log, consultation letters, and product-by-product regulatory matrix.
    relatedQuestionRefs:
    - QE021
    - QE022
    relatedTableRefs:
    - TE004
