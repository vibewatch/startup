company:
  name: Inari Agriculture
chapter:
  number: 5
  title: Product & Technology
  summary: Inari’s publicly documented product is not a farmer-facing seed brand but a partner-facing SEEDesign™ platform that combines machine learning, genomics, and multiplex gene editing to create crop-specific design solutions for soybeans, corn, and wheat. The evidence supports real technical depth, a growing patent estate, and crop-specific regulatory progress under USDA review pathways, but it also shows a business still constrained by partner germplasm, multi-season field validation, unresolved public quality-control disclosure, and live Corteva IP litigation.
sections:
- id: product-definition-and-customer-workflow
  title: Product definition and customer workflow
  body: 'Inari’s product is best understood as a partner-facing crop-design system rather than a direct-to-farmer seed brand. Across the SEEDesign™ platform page, the solutions page, and the company about page, Inari consistently presents itself as the company that creates intelligent designs for partners, then pushes those designs into elite germplasm and partner portfolios. That makes the commercial object less like a standalone software license and more like a design-plus-validation workflow that helps seed companies improve their own branded products. The clearest productized offer is High Yield Designs for Soybeans, which Inari says is its first commercial-ready solution and is marketed around a minimum 7.5% target increase in yield potential. About-page milestones also show progression from first seed-company partner demonstrations in summer 2022 to commercial-ready soybean trials across all major U.S. growing regions in summer 2025.


    The workflow implied by public evidence is consistent. Inari starts with its predictive design layer, applies multiplex edits, validates outcomes through greenhouse and field work, and then relies on seed-company partners for germplasm access, local breeding integration, and downstream farmer delivery. Public partnership announcements with Beck’s, Mertec/M.S. Technologies, Eden Enterprise, and InterGrain reinforce that the customer is primarily the breeder or seed company first, and the farmer only indirectly through partner channels. That structure likely reduces the need for Inari to build its own retail seed organization, but it also means product success depends on partner adoption, partner germplasm quality, and partner willingness to launch edited designs at commercial scale.'
