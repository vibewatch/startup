- id: crop-pipeline-and-product-operations
  title: Crop pipeline and product operations
  body: 'Public crop maturity looks uneven but real. Soybeans appear farthest along because Inari calls High Yield Designs for Soybeans its first commercial-ready solution, and its about page says those designs were trialed across all U.S. growing regions in summer 2025. Wheat appears behind soy but ahead of pure concept stage: InterGrain says it is evaluating Inari’s initial editing designs in field testing in Australia, and the original launch announcement framed the collaboration around a 10–15% wheat-yield target plus input-efficiency gains. Corn looks commercially earlier than soy because public evidence centers on breeding-program access and partner R&D expansion rather than named commercial-ready launch milestones.


    West Lafayette is central to turning platform output into product candidates. Independent coverage and company location materials describe the Indiana site as the hub for product development, field evaluation, and commercial operations, while Cambridge and Ghent remain more discovery- and modeling-oriented. The 2024 expansion added a 42,000-square-foot facility and more than doubled greenhouse space, which is a meaningful scale signal for validation throughput, seed increase, and handling more crop varieties. Still, this is not proof that Inari has vertically integrated seed manufacturing or large commercial acreage under its own control. The operational design remains partner-assisted: Inari can speed design and validation, but crop launch still depends on germplasm providers, local breeders, regulatory timing, and partner distribution into the field.'
