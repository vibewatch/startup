      - number: '7.4'
        title: Commercial, capital, and partner-concentration risk
        blocks:
          - type: paragraph
            body: >-
              Inari's route to market solves one problem and creates another. By supporting rather than rivaling seed
              companies, Inari avoids building a full global seed-distribution stack from scratch. But that same model
              concentrates commercialization in a small set of counterparties that control germplasm access, product
              prioritization, and farmer reach. The public record still points to Beck's and Eden/Stine on corn,
              Mertec/MS Technologies on soybeans, and InterGrain on Australian wheat as the clearest named channels.
              Those relationships prove industry interest, but they also mean Inari does not yet appear to have
              diversified launch risk across a broad customer base. Public sources still emphasize demonstration plots,
              field testing, and commercial readiness rather than scaled farmer adoption, so there is limited external
              evidence on conversion rates, revenue mix, or partner concentration.


              That channel dependence lands in a difficult farm-economics backdrop. USDA and ERS materials show
              broadacre seeds sell into highly penetrated corn and soybean markets, while Seed World's 2026 outlook
              emphasizes tight margins, policy-driven oilseed demand, and growers scrutinizing every input decision. New
              technology can win in that environment, but only if it proves ROI clearly enough to earn acreage and
              partner shelf space. Financially, Inari has abundant outside support on paper: the company said January
              2025 funding brought cumulative equity above $720 million, and independent coverage reported a reported
              $2.17 billion valuation. Yet the same public record shows a January 2026 mass layoff of 64 workers in
              Indiana and multiple CEO/commercial leadership changes across 2025. That combination is consistent with a
              company still funding commercialization rather than harvesting proven operating leverage. If partner
              launches slip or field proof disappoints, Inari likely returns to the capital markets from a weaker
              negotiating position.
