      - number: '8.3'
        title: Public and private comparables argue for humility around the $2.17 billion mark
        blocks:
          - type: paragraph
            body: >-
              There is no perfect public comp for Inari, which is part of the problem. Cibus is the closest listed
              gene-editing seed platform in the current evidence set, yet StockAnalysis showed only about $103.8 million
              of market capitalization and $4.29 million of trailing revenue as of June 25, 2026, while Cibus still
              reported large losses and depended on milestone-heavy commercialization plans. Pairwise looks
              strategically healthier in some ways because Corteva made a major equity investment and formed a five-year
              joint venture, but even Pairwise’s September 2024 round was only $40 million and total disclosed
              fundraising was $155 million, not an Inari-sized standalone equity mark. On the downside, Benson Hill
              shows how badly ag-biotech valuations can unwind when asset intensity, commercialization timing, and
              financing needs fall out of sync; its Chapter 11 outcome and Confluence reset are a real warning. Arcadia
              is not a clean gene-editing seed comp anymore, but its tiny scale, strategic-alternatives language, and
              funding need still show that the public market is unforgiving toward subscale ag-bio stories. Taken
              together, the comparable set does not prove Inari is overvalued. It does show that the burden of proof for
              a multi-billion-dollar private mark is much higher than the burden implied by public trading levels or
              smaller strategic financings elsewhere in the category.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV017
              - CV018
              - CV019
              - CV021
              - CV023
              - CV024
              - CV032
              - CV045
              - CV055
          - type: table
            tableRef: TV004
            claimRefs:
              - CV003
              - CV013
              - CV017
              - CV019
              - CV023
              - CV032
              - CV045
              - CV055
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV025
              - CV028
              - CV046
              - CV047
              - CV048
              - CV051
              - CV053
      - number: '8.4'
        title: The mark can work, but only if milestones convert into disclosed economics and legal de-risking
        blocks:
          - type: paragraph
            body: >-
              The public case for sustaining or growing the January 2025 mark is not hard to describe. Inari would need
              to show that first-generation product progress becomes paid commercialization: signed partner economics,
              recurring royalty or milestone structures, paid acreage or volume ramps, and evidence that launches in
              soy, corn, or wheat move beyond demonstration plots and commercial-ready trial language. Additional upside
              support would come from litigation de-risking, regulatory clarity, and confirmation that the workforce
              reset did not materially impair product timelines. The challenge case is equally clear. Public sources
              show a permanent 64-person Indiana layoff tied to changing business needs, ongoing Corteva litigation
              around patented seed access, and a sector-wide reality that faster editing does not remove multi-season
              validation or approval complexity. Corteva’s 10-K and Bayer’s annual report also remind investors that
              seed and trait commercialization remains long-cycle and expensive even for incumbents. Because Inari still
              does not disclose revenue or unit economics, I do not use revenue-multiple math here. Instead, the right
              framework is scenario framing around whether commercialization proof closes the gap between a strategic
              venture mark and an underwritten operating valuation. On the present record, too many of those proof
              points remain prospective.
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV030
              - CV031
              - CV036
              - CV046
              - CV047
              - CV048
              - CV054
          - type: table
            tableRef: TV005
            claimRefs:
              - CV046
              - CV047
              - CV048
              - CV051
              - CV052
              - CV053
              - CV054
          - type: table
            tableRef: TV006
            claimRefs:
              - CV025
              - CV028
              - CV045
              - CV048
              - CV050
      - number: '8.5'
        title: 'Recommendation: research-more / stretched until the company proves monetization, not just capability'
        blocks:
          - type: paragraph
            body: >-
              My recommendation at the disclosed January 2025 price is research-more, with medium confidence, high risk,
              and a stretched valuation stance. The base case is not that Inari is a weak company; the evidence points
              to a serious platform, credible backers, and genuine product progress. The problem is price sensitivity. A
              multi-billion-dollar valuation can be justified if partner-led launches translate into visible recurring
              economics and if the company comes through litigation and validation without meaningful erosion. But
              today’s public record forces too much faith-based underwriting: there is no disclosed revenue run rate, no
              gross margin, no contract structure, no preference stack, and no post-layoff cash runway. My scenario
              ranges therefore stay anchored to milestone logic rather than invented multiple math. The bear range
              assumes further slips or legal friction push the company closer to a reset round; the base range assumes
              first monetization but continued opacity; and the bull range assumes credible launch conversion, economics
              disclosure, and durable strategic sponsorship. That framework leaves room for a strong business outcome
              later, but it does not support a confident buy call at the last reported mark today.
            claimRefs:
              - CV049
              - CV050
              - CV051
              - CV052
              - CV053
              - CV054
              - CV055
          - type: table
            tableRef: TV007
