  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory asymmetry and market-access risk
        blocks:
          - type: paragraph
            body: >-
              Inari's core promise is that multiplex gene editing can move faster than conventional breeding, but the
              regulatory environment does not move at the same speed. In the United States, gene-edited crops still sit
              inside the coordinated USDA-FDA-EPA framework, and CRS notes that APHIS reverted to the pre-2020 Part 340
              regime after the SECURE rule was prospectively vacated in late 2024. That does not mean commercialization
              stops; it means developers again face a less settled approval path, especially when edits, field movement,
              or import/export facts do not fit the simplest exemption narrative. EPA has also streamlined some
              plant-incorporated protectant exemptions, but only for narrow categories, so pest-protection traits can
              still trigger agency review even when a yield or quality edit would not. For a company like Inari, which
              sells through partners rather than direct branded seed launches, regulatory friction can compound because
              every launch must work not only for Inari but also for the partner's own compliance, stewardship, and
              channel economics.


              The international picture is harder. Frontiers and MoFo both describe a fragmented global regime in which
              the United States and many non-EU jurisdictions lean product- or risk-based, while Europe has historically
              treated genome-edited organisms closer to GMOs and only recently started moving toward a differentiated
              NGT framework. Even when that direction becomes more permissive, public databases, seed labeling,
              segregation, or country-by-country implementation can still add cost and delay. Inari's own InterGrain
              release explicitly says the Australian wheat program must satisfy local regulatory requirements, which is
              a reminder that broadacre-crop developers do not get one global clearance event. The risk is not that gene
              editing is banned everywhere; the risk is that staggered rules, documentation burdens, and traceability
              expectations slow partner launches enough to blunt the value of Inari's faster design cycle.
            claimRefs:
