      - number: '2.4'
        title: Growth drivers, adoption constraints, and preserved diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The demand case for better row-crop seed is strong, but the adoption path is not frictionless. On the
              positive side, USDA, FAPRI, and Seed World all point toward a world where future production gains rely
              more on yield improvement, resilience, and efficiency than on simple acreage expansion. Biofuel policy is
              also relevant: soybean crush and soybean-oil demand are growing because biomass-based diesel targets are
              pulling on the oilseed system, while corn remains tied to feed and ethanol demand. Those are the kinds of
              structural pressures that can make higher-performing genetics valuable. Against that, Inari faces several
              constraints. Row-crop biotechnology is already mature, with U.S. corn and soybean acreage overwhelmingly
              engineered and increasingly stacked, so buyers compare new traits against strong incumbent baselines.
              Regulatory burden is uneven: EPA has created exemptions for some plant-incorporated protectants, but
              USDA’s post-SECURE uncertainty keeps process risk alive. IP concentration and litigation matter too, as
              does the scientific reality that drought and climate-resilience traits must prove themselves across
              heterogeneous environments and management systems. The chapter therefore supports a real market need while
              preserving unresolved questions on pricing, local field proof, and Inari-specific reach.
            claimRefs:
