      - number: '6.4'
        title: Retention, switching costs, and concentration
        blocks:
          - type: paragraph
            body: >-
              Retention evidence is the weakest part of the public customer file. None of the retained sources disclose
              NRR, GRR, churn, renewal rates, contract length, satisfaction scores, or explicit grower repurchase data.
              That absence does not mean the relationships are weak; it means the public record cannot separate logos
              and collaboration milestones from durable commercial economics. The strongest available proxy is
              structural switching cost. Once a seed-company partner commits elite germplasm, breeding cycles, field
              testing, and launch planning to an Inari-enabled program, changing course is not trivial. The same is true
              on the grower side, where agronomic trust tends to be won season by season through repeat local
              performance rather than one-time product awareness.

              Even so, concentration is hard to underwrite because the visible customer base is narrow and
              crop-specific. Publicly named proof clusters around a small set of counterparties: M.S.
              Technologies/Mertec in soy, Beck's and Eden/Stine in corn, and InterGrain in wheat. That is enough to show
              channel access, but not enough to estimate partner revenue mix, top-customer exposure, or whether one crop
              or relationship dominates near-term economics. The prudent reading is that Inari probably has meaningful
              dependence on a handful of seed-company relationships in its first commercialization wave, but the public
              record does not quantify that dependence. Any investment view on durability should therefore demand
              contract structure, renewal behavior, acreage progression, and partner concentration data before calling
              the customer base diversified or sticky.
