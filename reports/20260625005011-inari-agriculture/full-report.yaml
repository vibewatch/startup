  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The correct market frame for Inari is not “all agriculture” and not even “all crop biotechnology.” Inari
              is trying to create value inside the row-crop seed stack for corn, soybeans, and wheat, where breeders,
              germplasm owners, seed retailers, and growers decide which genetics earn acreage and repeat purchase.
              Included spend therefore starts with branded commercial seed, embedded trait value, breeding access, and
              partner-led commercialization work. It excludes crop-protection chemicals, fertilizer, irrigation
              hardware, commodity grain merchandising, and the rest of farm-input spend except where those budgets act
              as substitutes for better genetics. The status quo is powerful: incumbent seed platforms already package
              germplasm, trait stacks, field support, and channel trust. Conventional breeding and agronomic
              interventions also remain real substitutes, especially when buyers prefer lower regulatory risk or do not
              yet see enough third-party proof that gene-edited gains will persist across environments. That makes
              Inari’s challenge one of displacing trusted decision patterns, not simply entering an empty category.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM018
              - CM019
              - CM028
