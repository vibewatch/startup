  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, payer, and channel design
        blocks:
          - type: paragraph
            body: >-
              Inari's customer model is best understood as a layered channel rather than a direct-to-grower seed brand.
              The company repeatedly says it supports, not rivals, seed-company customers, and its solutions page frames
              the offer as intelligent designs that help partners expand their own portfolios. That language matters
              because it clarifies who actually buys first: seed companies and breeding partners appear to be the
              immediate commercial counterparties, while growers are the eventual users and payers only after
              partner-branded products reach the farm. The public record does not show Inari running a branded retail
              seed catalog or a direct farmer salesforce. Instead, the company appears to sell proof, design capability,
              and germplasm-enabled product potential into existing seed channels.

              That structure creates both leverage and dependency. The leverage is obvious: Inari can access elite
              breeding programs, local agronomy teams, and established distribution without building a nationwide
              seed-delivery stack from scratch. The dependency is just as important. If partner breeding teams, catalog
              managers, or local agronomists do not decide the products are worth advancing, Inari has no direct path to
              force adoption downstream. Switching costs therefore accumulate in shared field data, germplasm
              integration, and launch planning rather than in software lock-in. For growers, the real adoption hurdle is
              not whether they know Inari's name; it is whether partner-branded seed consistently improves margin enough
              to win repeat placement in ordinary seasonal purchasing decisions.
