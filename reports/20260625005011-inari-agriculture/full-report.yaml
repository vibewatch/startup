  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Inari is closest to platform peers but competes inside incumbent-controlled markets'
        blocks:
          - type: paragraph
            body: >-
              The retained evidence points to a layered competitive set rather than a single clean peer group. Inari
              presents itself as an AI-enabled SEEDesign platform that combines genomics, artificial intelligence, and
              gene editing to improve broadacre crops such as soybeans and wheat. That makes Pairwise the nearest
              platform analogue because it also frames itself around CRISPR tools, crop design, and licensing rather
              than around a single seed brand. But the commercial battlefield is still defined by Bayer, Corteva, and
              Syngenta, which already operate global breeding, trait, field-trial, and farmer-distribution systems
              across the same row-crop categories. Public-market peers such as Cibus/Calyxt, Arcadia, Yield10, and
              Benson Hill illustrate a third layer: technically credible innovators that have nonetheless needed
              mergers, restructurings, asset sales, or strategic narrowing to keep moving. The result is a market where
              Inari must prove that design speed and partner friendliness can overcome incumbents' installed commercial
              machinery.
