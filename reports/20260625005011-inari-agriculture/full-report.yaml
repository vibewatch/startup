      - number: '1.3'
        title: Capital Base, Valuation Signal, and Stakeholders
        blocks:
          - type: paragraph
            body: >-
              Inari reached late-stage private-company scale before any commercial launch at visible revenue scale. The
              official January 2025 release confirmed a $144 million fundraise and cumulative equity of more than $720
              million, while multiple independent outlets described that event as a Series G round. Those same
              third-party reports converged on a post-money valuation of about $2.17 billion, up from roughly $1.65
              billion a year earlier, giving investors a concrete but still secondary valuation signal. The investor
              list in the 2025 round matters strategically: a wholly owned subsidiary of the Abu Dhabi Investment
              Authority joined the cap table alongside continued support from Hanwha Impact, NGS Super, the State of
              Michigan Retirement System, and founder Flagship Pioneering.


              The capital story is strong, but disclosure remains private-company thin exactly where a diligence reader
              would want more precision. Official sources reviewed for this chapter do not disclose current revenue,
              revenue run rate, or total active customer count. Headcount disclosure is also mixed: 2024-2025 releases
              repeatedly said more than 300 employees, but the 2026 locations page says 200+ employees and the 2026
              layoff record suggests the workforce has been reset. Investors therefore have credible evidence of funding
              depth and stakeholder quality, but only partial visibility into the operational metrics that would prove
              how efficiently that capital has translated into commercialization.
