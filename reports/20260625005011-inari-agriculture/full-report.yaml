      - number: '3.3'
        title: Specialists and public-market peers show both the appeal and the fragility of advanced-breeding startups
        blocks:
          - type: paragraph
            body: >-
              Pairwise is the clearest evidence that Inari is not alone in pitching a partner-first gene-editing
              platform. Its Fulcrum system combines CRISPR, AI, and plant biology; the company claims 15 crops edited,
              81 potential products, and 72% success in targeted improvements. Yet the same source set shows why
              platform quality alone is not enough: Pairwise took a $25 million equity check from Corteva and entered a
              five-year joint venture to reach row-crop scale faster. Cibus and Calyxt chose merger as their route to
              public-market relevance, Arcadia has narrowed toward wellness products while keeping only a small
              agronomic-traits remnant, Yield10 ended in asset sale to Nufarm after delisting and Chapter 11, and Benson
              Hill's assets now live on in Confluence after bankruptcy. These cases do not invalidate Inari's model, but
              they do warn that technical differentiation can still be overwhelmed by capital needs, go-to-market
              friction, or the long wait for large-acre commercial proof.
