      - number: '4.1'
        title: Revenue model and commercial readiness
        blocks:
          - type: paragraph
            body: >-
              Inari's public materials point to a partner-led B2B revenue model rather than a direct branded seed-sales
              motion. The company repeatedly says it exists to support, not rival, seed companies, and its solutions
              page frames the offer as intelligent designs that help partners grow their own portfolios. The strongest
              commercialization signals are operational rather than financial: first seed-company partner demonstrations
              in summer 2022, a first commercial-ready soy design trialed across all U.S. growing regions in summer
              2025, and continued work with seed-company customers in demonstration plots as of the January 2025
              financing. That evidence is enough to say Inari has moved beyond pure platform R&D into pre-revenue or
              early-commercial partner enablement. It is not enough to say which revenue line is dominant, because no
              retrieved source discloses whether economics come from upfront collaboration fees, milestones, royalties,
              downstream seed sales, or some mix across those levers.


              The product and crop focus is also clear. Inari concentrates its first wave on soybeans, corn, and wheat,
              and its crop-specific collaborations show how the model scales: Beck's and Eden/Stine for corn, Mertec/MS
              Technologies for soybeans, and InterGrain for Australian wheat. Those agreements are financially relevant
              because they reduce the need for Inari to build a full proprietary seed distribution stack from scratch.
              But partner leverage is not the same thing as revenue visibility. Public sources show commercial intent,
              customer access, and field progression; they do not show signed paid volumes, partner minimums, or
              realized monetization.
