            body: >-
              The strongest supportable moat claim for Inari is not that it already outscales the incumbents; the public
              evidence does not show that. Instead, Inari's differentiation is that it packages AI-enabled design, gene
              editing, and partner deployment around broadacre yield improvement, starting with soy and wheat, without
              needing to own a full crop-protection stack. That is a credible wedge because Pairwise's trajectory and
