      - number: '1.2'
        title: Leadership, Governance, and Key-Person Dependence
        blocks:
          - type: paragraph
            body: >-
              The leadership record shows both continuity and a meaningful 2025 transition. At launch, Flagship
              materials identified Ignacio Martinez as founding CEO, David Berry as co-founder, and Ponsi Trivisvavet as
              the operating CEO appointed in April 2018. Ponsi was still the quoted CEO in the January 2025 financing
              release, but in June 2025 the company announced that she was stepping down for health reasons and that
              Martinez would serve as interim CEO. In October 2025 Inari then appointed Lisa Nunez Safarian, a longtime
              Monsanto and Bayer executive and an Inari board member since May 2025, as permanent chief executive
              effective November 4. By the 2026 run date, the official leadership page lists Safarian as CEO and
              director and Martinez as board chair and company co-founder.


              This chapter therefore should not propagate the prompt anchor that names Ponsi as current CEO. The same
              caution applies to the CTO anchor: the reviewed 2026 public leadership materials do not surface a CTO
              title or Enoch Ng. That does not prove the role does not exist internally, but it does mean the public
              record available to this chapter does not verify it. Governance visibility is adequate for the top of the
              org chart but incomplete for control rights, observer seats, and the full executive bench, so key-person
              risk remains concentrated in the CEO, board chair, and a small visible set of commercial and scientific
              leaders.
