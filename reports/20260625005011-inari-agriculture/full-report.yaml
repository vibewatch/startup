      - number: '7.3'
        title: Biological execution and scale-up risk
        blocks:
          - type: paragraph
            body: >-
              Inari's science story is ambitious by design. Its platform materials emphasize predictive design,
              multiplex editing, multiple edit types executed at once, and iterative learning from sequence to phenotype
              to field. That is exactly why biological execution risk remains high. Complex agronomic traits are rarely
              single-gene wins; they depend on trait networks, genetic background, environment, and farming practice.
              Industry commentary in 2026 makes the same point from a commercialization angle: CRISPR can accelerate
              breeding, but it does not eliminate multi-season validation, regional testing, or the need for durable
              performance in real seed systems. Inari's own process description confirms that it must carry designs
              through greenhouse and field testing before a design becomes commercially ready. Faster editing changes
              cycle time; it does not repeal biology.


              That execution burden shows up physically as well as scientifically. Inari's 2024 West Lafayette expansion
              doubled greenhouse capacity and added warehouse and commercial operations infrastructure, which undercuts
              any simplistic view that the company is merely software plus CRISPR. The business may be asset-light
              relative to a fully integrated seed major, but commercialization still requires controlled environments,
              field capacity, partner coordination, and repeated validation across soybean, corn, and wheat backgrounds.
              If first-generation yield claims do not hold across seasons, geographies, or partner germplasm, the
              platform loses credibility quickly because its value proposition is step-change performance rather than
              incremental convenience. This is also where GMO confusion and acceptance risk re-enters: even if the
              science works, seed companies, retailers, and farmers still need enough confidence that the product is
              understandable, compliant, and worth adopting.
