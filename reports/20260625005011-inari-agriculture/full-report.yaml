      - number: '2.2'
        title: Sizing lenses, adoption base, and why a single TAM is misleading
        blocks:
          - type: paragraph
            body: >-
              Public sources support a large market backdrop, but they do not justify one precise TAM for Inari. Broad
              commercial-seed publishers place the category around USD 101-103 billion in 2026, while narrower GM-seed
              estimates center closer to USD 27 billion and gene-edited summaries sit much smaller but faster growing.
              Those numbers are useful only if separated by scope. Inari’s current opportunity is not the whole
              commercial seed market, because that includes vegetables, specialty crops, and conventional seed pools
              outside its first-wave focus. It is also not the full GM market, because some incumbent trait pools and
              geographies are structurally hard to reach. A better approach is multi-lens: start with broad category
              ceilings, then narrow through crop mix, adoption base, and planted-acre realities. USDA’s 2026 outlook
              alone points to 224 million U.S. planted acres across corn, soybeans, and wheat, which shows why
              large-acre crops matter. Even so, no reviewed source isolates what share of that acreage is actually
              reachable by Inari’s partner model, so a clean SAM or SOM remains unresolved and should stay unresolved in
              the analysis.
