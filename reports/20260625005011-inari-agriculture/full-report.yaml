      - number: '6.5'
        title: Adverse evidence and commercialization timing
        blocks:
          - type: paragraph
            body: >-
              The two strongest adverse signals are internal execution pressure and external commercialization drag.
              Internally, Inari's January 2026 WARN notice and follow-on trade coverage show a permanent layoff of 64
              employees in West Lafayette, explicitly tied to changing business needs. Because that site is described as
              the center of product development and commercial operations, the reduction matters to the customer story:
              it suggests the company is still adjusting cost structure and pace while trying to bring row-crop products
              through validation and launch. Externally, the Corteva litigation and related DOJ attention show that
              seed-industry IP access remains a live friction for newer entrants. Even if Inari disputes the
              allegations, the existence of the dispute is a reminder that channel access and commercialization are not
              occurring in a frictionless market.

              Broader 2026 trade commentary makes the timing risk plain. Seed World's commercialization analysis argues
              that gene editing may compress the lab cycle, but it does not remove the need for multi-season validation,
              regional testing, retail and consumer confidence, or value-chain alignment. In other words, faster editing
              does not automatically mean faster customer adoption. That observation fits Inari's evidence set almost
              perfectly: the company has credible partner proof, commercialization rhetoric, and some field-validation
              detail, but it still lacks public proof of repeat farmer purchasing or broad production-scale deployment
              outside the soybean commercial-ready narrative. For underwriting purposes, the adverse read is not that
              demand is absent; it is that time-to-durable-adoption may be longer than scientific progress alone would
              imply.
            claimRefs:
