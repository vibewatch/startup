  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The January 2025 mark is a milestone bet, not a disclosed-economics valuation
        blocks:
          - type: paragraph
            body: >-
              The cleanest public fact pattern is straightforward. Inari said in January 2025 that it raised $144
              million, lifting cumulative equity above $720 million, and independent coverage reported the round at a
              $2.17 billion valuation versus $1.65 billion a year earlier. That means the market accepted a meaningful
              step-up even though the public record still does not show revenue, ARR, gross margin, contracted acreage,
              royalty rates, or cash burn. In other words, the mark is not being supported by public operating
              disclosure in the way a public-equity investor would underwrite a growth company. It is being supported by
              a combination of platform belief, investor sponsorship, and confidence that first-generation product
              progress can convert into commercial economics later. The company itself framed the round as being fueled
              by first-generation product performance and progress toward commercialization, not by already-disclosed
              monetization. That matters for interpretation: the mark likely embeds expectations that partner-led
              launches in soy, corn, and wheat can move from demonstration and trial activity into repeatable,
              contract-backed revenue. It does not prove those economics exist today. For diligence purposes, that makes
              the $2.17 billion post-money best read as a strategic milestone valuation whose validity depends on the
              next tranche of proof, not as a valuation already anchored by disclosed unit economics.
