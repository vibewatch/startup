              - CV050
          - type: callout
            title: No revenue multiple math used
            body: >-
              Because public revenue and unit economics are undisclosed, the valuation ranges are framed around
              milestone conversion, financing context, and comparable outcomes rather than invented sales multiples.
            calloutType: assumption
            claimRefs:
