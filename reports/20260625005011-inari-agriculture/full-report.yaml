      - number: '5.5'
        title: Technical verdict and bottlenecks
        blocks:
          - type: paragraph
            body: >-
              The core technical verdict is that Inari looks more mature on architecture and pipeline progression than
              on publicly verified delivery outcomes. The platform description is concrete enough to believe there is a
              real AI-plus-genomics-plus-editing workflow, the developer-signal evidence shows genuine computational
              biology hiring, and the APHIS letters show product-specific regulatory progress rather than only future
              aspiration. The patent estate also looks broad enough to support a plausible moat around parts of the
              design-to-editing workflow. Those are meaningful strengths for a company trying to sell into
              incumbent-controlled seed systems.


              The bottlenecks are equally clear. First, faster editing does not erase the need for multi-season
              validation, regional testing, and commercial-scale proof; Seed World’s 2026 commercialization analysis is
              a strong independent reminder of that. Second, Inari’s route to market remains partner-dependent on
              germplasm access and partner channels, which means execution risk sits partly outside its walls. Third,
              the public record still says little about quality systems, stewardship controls, cyber or data-governance
              practices, seed multiplication economics, or commercial acreage. Finally, Corteva litigation keeps IP
              execution risk live into 2026, while DOJ’s intervention underscores how contested seed-industry IP access
              remains. Inari therefore appears technically credible and increasingly launch-oriented, but still not
              publicly de-risked on rollout friction, stewardship disclosure, or litigation overhang.
            claimRefs:
