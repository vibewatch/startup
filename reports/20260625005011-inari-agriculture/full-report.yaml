      - number: '5.2'
        title: Platform architecture and data stack
        blocks:
          - type: paragraph
            body: >-
              The exact public brand name is SEEDesign™. More importantly, Inari gives enough detail to infer a specific
              architecture rather than a generic “AI + biology” slogan. The platform page breaks the system into three
              named modules: Predictive Design Engine, Gene Editing Toolbox, and Design Blueprints. Inari says the
              Predictive Design Engine unites machine learning and genomic science to choose edits with predictable
              outcomes, while the Gene Editing Toolbox performs multiple edits and edit types at the same time. Design
              Blueprints then apply those editing designs to selected crop varieties and feed lab, greenhouse, and field
              observations back into the platform. The overall loop is sequence to phenotype to field and back again,
              which is a stronger technical description than a simple claim of using AI somewhere in the workflow.


              The developer-signal evidence also matters here because it shows the platform is not purely conceptual.
              Inari’s careers page locates modeling, prototyping, and research in Ghent and publicly highlights
              computational biology talent, while a third-party job listing for a computational biology research
              associate describes bioinformatics pipelines across Amp-Seq, transcriptomics, proteomics, epigenomics,
              structural variants, and tooling such as Nextflow, AWS, Docker, and Jupyter. That does not reveal
              proprietary architecture, model performance, or editing hit rates. But it does independently support that
              Inari is building a multi-omic and software-heavy operating stack rather than only running wet-lab gene
              editing experiments. The important caveat is that most performance language here remains company-claimed;
              no retrieved source independently benchmarks prediction accuracy, edit efficiency, or trait-conversion
              rates versus peers.
