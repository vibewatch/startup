              - CV054
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is the issue, not the existence of a platform story
            body: >-
              The evidence is strong enough to keep Inari on the list and weak enough to reject a clean buy call at the
              last disclosed price.
            calloutType: recommendation
            claimRefs:
