companyProfile:
  summary: >-
    Inari Agriculture is a private seed-technology company founded by Flagship Pioneering in 2016 and unveiled in 2018 around an AI-enabled SEEDesign platform for broadacre crops. The company applies predictive genomics and multiplex gene editing to soybeans, corn, and wheat, with a partner-oriented model designed to improve germplasm and trait performance without becoming a traditional branded seed major. Public evidence shows a January 2025 $144 million financing, more than $720 million of cumulative equity raised, a reported $2.17 billion post-money valuation, and commercialization milestones including U.S. soybean trials across growing regions and an InterGrain wheat collaboration in Australia. The main underwriting constraint is not strategic ambition but disclosure opacity: public sources still do not provide revenue, customer-count, acreage, margin, or round-term detail, and the 2026 layoff plus live Corteva litigation create execution and valuation risk.
