  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Public enterprise price sheets, realized license economics, or per-acre commercialization terms for Inari and the retained peer set.
    whyItMatters: Without verified pricing power, the analysis can compare packaging posture and route to market but cannot prove who monetizes traits best.
    diligencePath: Request current customer or partner term sheets, realized pricing examples, or management commentary under NDA for at least two crops.
    relatedQuestionRefs:
    - QP018
    - QP028
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: commercialization-proof
    missingEvidence: Current commercial acreage, repeat-partner conversion, retention, and win-rate data for Inari and Pairwise in broadacre deployments.
    whyItMatters: Moat durability depends on whether platform wins are turning into recurring commercial launches rather than isolated pilot or trial milestones.
    diligencePath: Ask management for crop-by-crop launch metrics, partner renewal data, and examples where the platform displaced incumbent breeding or trait alternatives.
    relatedQuestionRefs:
    - QP026
    - QP028
    relatedTableRefs:
    - TP005
  - type: access-blocked
    severity: minor
    topic: cibus-current-filings-detail
    missingEvidence: A directly readable current Cibus SEC-filings detail page or recent filing text beyond the investor-relations landing surface.
    whyItMatters: The current chapter can describe the merger story and investor surface, but not a deeper 2026 filing-level commercialization update from Cibus.
    diligencePath: Fetch readable SEC filing URLs or investor PDF filings directly once a stable path is identified, then update the public-company backing comparison.
    relatedQuestionRefs:
    - QP011
    - QP017
    relatedTableRefs:
    - TP003
  - type: conflicting-data
    severity: material
    topic: regulatory-timing
    missingEvidence: A harmonized country-by-country timeline tying crop-specific gene-editing pathways to export-market acceptance for soy, wheat, and canola.
    whyItMatters: Competitive moat depends not only on technical performance but on who can launch into multi-market trade systems without regulatory surprise.
    diligencePath: Commission counsel or regulatory affairs teams to map crop-by-crop approvals, labeling, and trade-recognition risks across key export jurisdictions.
    relatedQuestionRefs:
    - QP024
    - QP025
    relatedTableRefs:
    - TP005
