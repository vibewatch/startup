- id: pricing-regulatory-and-switching
  title: 'Pricing, regulation, and switching cost: public price sheets are scarce, so reach and approvals matter more'
  body: 'Public pricing is the weakest part of the evidence set. None of the reviewed Inari, Pairwise, Cibus, Confluence, or Arcadia pages expose robust enterprise rate cards for seed-design, licensing, or trait-access economics. That means competitive comparisons are more credible on contract posture and route to market than on price-per-acre or license-fee precision. At the same time, regulation remains a meaningful competitive variable. CRS and MoFo show that U.S. oversight remains split across USDA, FDA, and EPA and that the SECURE-rule vacatur pushed APHIS back to older processes while new revisions are considered. Frontiers adds the global point: divergent national rules raise costs, delay launches, and complicate trade. Those burdens are easier for Bayer, Corteva, and Syngenta to absorb than for smaller platforms. Switching cost also favors incumbents, because elite germplasm access, trait stewardship, field-trial infrastructure, and grower relationships are harder to replace than
    a software interface alone.'
