- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / backing
  - Target crops / segment
  - Differentiation
  - Limitation versus Inari
  rows:
  - - Inari
    - Benchmark platform
    - Private venture-backed platform; three global sites disclosed
    - Soybeans, wheat, broadacre breeding partners
    - AI-enabled SEEDesign plus gene editing and partner model
    - Public commercialization, pricing, and acreage disclosure remain limited
  - - Bayer Crop Science / Monsanto
    - Global incumbent
    - Public-company reporting and global integrated agriculture stack
    - Corn, soy, cotton, canola, wheat, rice, vegetables
    - Seeds, traits, crop protection, biologicals, digital tools, genome editing
    - Broader but less focused on partner-only seed-design positioning
  - - Corteva
    - Global incumbent
    - Public pure-play ag company with investor and SEC surfaces
    - Row crops including soy, corn, canola and gene-edited collaborations
    - Pioneer distribution, germplasm, Catalyst investment platform
    - Startup-style platform flexibility is less visible than enterprise scale
  - - Syngenta
    - Global incumbent
    - Large global group with ~60,000 employees and >100-country reach
    - Corn, soybean, wheat and broader seed portfolios
    - Large R&D engine, trait stack distribution, Shoots IP platform
    - Editing message is one component of a much larger trait machine
  - - Pairwise
    - Direct platform peer
    - Private startup with $155M disclosed funding by Sept. 2024
    - Specialty crops plus corn, soy, wheat, canola and blackberries
    - Fulcrum CRISPR platform, licensing model, product and partner breadth
    - Already leaned into incumbent partnership through Corteva JV
  - - Cibus / Calyxt
    - Public advanced-breeding peer
    - Merged public company with investor filings surface
    - Canola, rice, productivity traits, ingredients
    - RTDS platform and public-market trait-licensing story
    - Public evidence on current scale is thinner than on merger strategy
  - - Arcadia Biosciences
    - Public narrowed peer
    - Nasdaq reporting surface but small-scale results and funding need
    - Wellness products plus residual agronomic wheat traits
    - Legacy crop-science IP and public disclosure surface
    - Current focus is much narrower than Inari’s broadacre design ambition
  - - Yield10 / Nufarm
    - Acquired trait peer
    - Yield10 assets absorbed by Nufarm in 2025
    - Camelina omega-3, herbicide tolerance, bioenergy traits
    - Specialized oilseed trait package now backed by larger seed owner
    - Standalone Yield10 did not remain independent
  - - Benson Hill / Confluence
    - Restructured breeding peer
    - Benson assets bought out of Chapter 11 by private Confluence
    - Soy quality traits and broadacre soybean programs
    - AI-driven CropOS, crop accelerator, licensing/distribution focus
    - Bankruptcy reset highlights commercialization and capital fragility
  notes: Rows mix direct peers, incumbents, and restructured advanced-breeding companies because buyers can compare Inari against both startup platforms and distribution-heavy seed majors.
