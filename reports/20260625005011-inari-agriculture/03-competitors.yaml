- id: TP005
  title: Moat durability / competitive risk register
  columns:
  - Moat claim for Inari
  - Threat
  - Severity
  - Why it matters
  - Diligence ask
  rows:
  - - AI-enabled seed design compresses breeding iteration
    - Incumbents can pair editing with their own germplasm and field networks
    - High
    - Better design does not automatically win if launch channels sit elsewhere
    - Request partner conversion data from design to commercial seed launches
  - - Partner-first model can scale without owning every brand
    - Partners may keep most economic upside or slow deployment
    - Medium
    - Channel dependence can limit pricing power and market visibility
    - Request economics by partner type and renewal terms
  - - Broadacre focus targets large value pools in soy and wheat
    - These are also the exact crops where incumbents are strongest
    - High
    - Competition is fiercest where Bayer, Corteva, and Syngenta already lead
    - Request crop-by-crop win/loss examples and germplasm-access terms
  - - Gene editing creates differentiated biological IP
    - Regulatory divergence and product-trade friction can delay launches
    - High
    - Time-to-market favors better-capitalized organizations
    - Request expected approval path by crop and export market
  - - Startup peers validate market demand for editing platforms
    - Peer bankruptcies and asset sales show commercialization risk
    - High
    - The category has not yet proven that every good platform becomes a durable business
    - Request cash-use priorities and commercialization milestones
  - - Public pricing opacity may preserve negotiation flexibility
    - It also prevents outside validation of unit economics
    - Medium
    - Investors cannot benchmark moat through pricing power alone
    - Request realized pricing and gross-margin evidence under NDA
  notes: Severity scores reflect evidence-backed competitive risk rather than a prediction that any single threat will definitively materialize.
