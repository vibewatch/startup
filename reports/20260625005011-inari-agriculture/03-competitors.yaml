- id: TP004
  title: Pricing / packaging / distribution comparison
  columns:
  - Company or class
  - Public pricing signal
  - Distribution or route to market
  - What the evidence actually supports
  - Unknowns
  rows:
  - - Inari
    - No public enterprise rate card retained
    - Partner-led access to breeding and seed-company channels
    - Yield-focused solutions for partners and commercial-ready soy trialing
    - Exact license economics and partner revenue split
  - - Bayer
    - No public enterprise gene-edit licensing price sheet retained
    - Owned brands, trait stewardship, crop-protection and digital channels
    - Integrated row-crop distribution and extensive pipeline
    - How specific editing economics are priced against conventional trait bundles
  - - Corteva
    - No public enterprise price sheet retained
    - Pioneer and partner channels plus Catalyst investing
    - Can combine internal and external innovation with seed distribution
    - Exact economics of Pairwise-enabled products
  - - Syngenta
    - No public public-facing price card retained
    - Large seed portfolio, field network, hybrid and trait channels
    - Commercial system already reaches farmers at scale
    - How much premium future edited traits will command
  - - Pairwise
    - No public enterprise platform price card retained
    - Licensing, collaborations, and JV routes
    - Platform breadth and partner-first GTM are explicit
    - Unit economics by crop and by licensee
  - - Cibus / Calyxt
    - No public product-pricing sheet retained
    - Trait-licensing and public-company investor story
    - Precision-engineered seed and ingredient positioning are public
    - Current customer economics and scale of deployed acres
  - - Arcadia
    - Not relevant as a direct enterprise seed-design price comparator
    - Current visible GTM is consumer wellness plus residual traits
    - Wellness-product revenue is public; crop-trait commercialization is not broad
    - Whether agronomic traits remain material to strategy
  - - Yield10 / Nufarm and Confluence
    - No public startup-like list pricing retained
    - Acquirer or licensee distribution paths
    - Asset value is visible through transactions and product pages
    - Standalone startup pricing benchmarks
  notes: Because public price cards are scarce across the retained set, the comparison focuses on packaging posture, distribution ownership, and missing disclosure rather than invented dollars.
