- id: incumbent-platforms
  title: 'Incumbents: Bayer, Corteva, and Syngenta bring broader crop portfolios and heavier commercialization muscle'
  body: 'Bayer, Corteva, and Syngenta are not just technology comparables; they are distribution and regulatory comparables that set the practical bar Inari has to clear. Bayer describes an integrated pipeline spanning seeds, traits, crop protection, biologicals, and digital tools across corn, soy, cotton, canola, wheat, rice, and vegetables. Corteva still frames itself as a pure-play agriculture company with recognized seed brands, and its Pairwise transaction shows that it can buy outside gene-editing capability rather than wait for startups to mature independently. Syngenta is explicit that transgenic traits remain strategically important while gene editing feeds next-generation products, and it pairs that R&D stance with a very large scientific organization, broad corn-trait portfolio, and material annual investment base. For Inari, the implication is straightforward: incumbents do not need to win every editing breakthrough internally as long as they control elite germplasm, stewarded
    launches, field networks, and global regulatory execution.'
