    - Can pair editing access with established channels
  - - Pairwise
    - Private fundraising and partner announcements
    - Series C plus Corteva investment and JV
    - Independent scale still partly dependent on partners
    - Closest proof that partner-first gene editing can attract incumbents
  - - Cibus / Calyxt
    - Merged public-company investor surface
    - Trait transfers and public trait-licensing story
    - Current product-scale detail is thinner than merger messaging
    - Public listing helps credibility but does not guarantee broad launch success
  - - Arcadia
    - Nasdaq filings and Q1 2026 results
    - Zola volume growth and public filings cadence
    - Needs additional funding in near future per company
