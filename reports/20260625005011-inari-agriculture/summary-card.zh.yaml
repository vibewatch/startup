  topStrengths:
    - Inari 是私人农业生物技术公司中资本底子最厚的一批，已披露股权融资超过 $720 million，2025 年 1 月一轮还继续拿到 Flagship 和一家 ADIA 子公司的支持。
    - 公司的技术与作物逻辑连贯：AI 驱动的 SEEDesign、多重编辑，以及覆盖大豆、玉米和小麦的公开项目，而不是单一狭窄性状实验。
    - 公开商业化证据还早，但确实存在，包括横跨美国种植区的大豆试验、公司宣称的大豆最低 7.5% 增产目标，以及旨在实现两位数增产的 InterGrain 小麦合作。
    - 相比从零搭建完整品牌种子分销体系，Inari 以合作伙伴为中心的模式可能降低进入市场的摩擦。
  topRisks:
    - 公开来源仍未披露收入、客户数、合同覆盖英亩、利润率、现金跑道，或 $2.17 billion 私募估值背后的详细条款。
    - Corteva 种子 IP 诉讼仍在进行，也凸显公司对种质资源获取、保藏规则，以及可辩护自由实施空间的真实依赖。
    - 2026 年 1 月 West Lafayette 裁员 64 人，说明多年高额私募融资之后，商业化路径和成本结构仍在重置。
    - 基因编辑种子采用仍要面对监管碎片化、GMO 争议外溢到消费者认知，以及农业漫长采用周期。
  unresolvedGaps:
    - 当前收入、ARR、毛利率、烧钱速度、现金跑道，以及 2025 年试验活动是否转化为实质性经常性商业收入。
    - 具名客户数、英亩或袋装销量承诺、合作伙伴集中度、定价结构，以及种子公司渠道的续约证据。
    - Series G 轮详细条款，包括清算优先权、所有权变化、老股交易，以及据报道 $2.17 billion 投后估值的精确依据。
    - 当前管理层梯队厚度、CTO 或首席科学运营架构，以及 2026 年裁员是否实质削弱技术或商业能力。
