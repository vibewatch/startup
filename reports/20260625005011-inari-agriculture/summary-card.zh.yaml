summary:
  headline: Inari 已融到足够资本，也拿出足够作物级技术证明，值得继续尽调；但公开商业化经济性缺位、IP 诉讼仍在推进、2026 年人员重置未消化，投资判断只能停在继续研究，而不是买入。
