- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Future output growth depends more on yield than acreage expansion
    - Driver
    - Structural / 2026+
    - Raises value of genetics that improve consistency and stress performance
    - How much of Inari’s pipeline is aimed at yield stability versus top-end yield?
  - - Climate volatility and drought stress
    - Driver
    - Structural / 2026+
    - Makes water, nitrogen, and resilience claims economically relevant if validated
    - What multi-environment evidence supports crop-specific stress benefits?
  - - Biofuel and oilseed demand growth
    - Driver
    - 2026-2027 visible
    - Supports trait demand in soybean and corn systems through crush and fuel-linked demand
    - Which Inari traits map most directly to soybean-oil and corn-demand incentives?
  - - EPA exemptions for certain edited PIPs
    - Driver
    - Current
    - Can reduce regulatory burden for a subset of pest-related edited traits
    - Which planned Inari traits, if any, could fit these exemptions?
  - - Mature installed base of engineered row-crop seeds
    - Mixed / constraint
    - Current
    - Shows buyers accept advanced seed technology but also sets a high incumbent bar
    - How much better must Inari-enabled products be to displace existing stacks?
  - - USDA post-SECURE uncertainty and multi-agency coordination
    - Constraint
    - Current / 2026
    - Adds process risk and timing uncertainty for launches and field transitions
    - What regulatory pathway applies to each core-crop product and geography?
  - - IP concentration, litigation, and germplasm access barriers
    - Constraint
    - Current
    - Favors large incumbents and can slow challengers through legal and licensing burden
    - What freedom-to-operate work has Inari completed by crop and partner?
  - - Field-validation complexity across heterogeneous environments
    - Constraint
    - Structural
    - Climate-trait claims must survive genotype-by-environment-by-management variation
    - What independent, multi-location trial packages exist for corn, soybean, and wheat?
  notes: Driver and constraint timing mixes structural and near-term effects. Several rows are adoption proxies rather than direct revenue metrics and therefore need follow-up diligence before valuation use.
