- id: buyer-user-payer-and-channel-map
  title: Buyer, user, payer, and channel economics
  body: 'Inari’s commercialization path looks business-to-business first and farm-facing second. The first buyer is typically a seed company, breeding partner, or germplasm owner that can evaluate designs, run field testing, and eventually place the product into a branded seed catalog. Retail channels such as Beck’s matter because they sit close to the grower and control local trust, agronomy support, and the economics of repeat seed purchases. The end user is still the grower, because on-farm performance determines whether a design earns acreage next season, but the grower is not necessarily the first payer to Inari. Public materials instead point to licensing, collaboration, or partner-development arrangements upstream of the farm gate. This matters because adoption timing is set by partner validation cycles, not just farmer curiosity about gene editing. The partner set also reveals why Inari focuses on corn, soybeans, and wheat: those are the crops with giant acreage, dense incumbent
    channels, and enough gross-profit pool for differentiated genetics to matter. What remains missing is pricing transparency—public evidence does not show royalty splits, transfer pricing, or the exact economic bargain between Inari and each channel partner.'
