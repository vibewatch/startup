tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Inari
  rows:
  - - Large-acre commercial seed market ceiling
    - Commercial seed purchases across major field crops, including branded genetics and seed-company margins
    - Crop protection, fertilizer, irrigation equipment, grain merchandising
    - Seed companies, retailers, growers
    - Useful outer ceiling but too broad for underwriting Inari directly
  - - Row-crop seed and trait stack
    - Corn, soybean, and wheat genetics, trait value, breeding access, field validation, and launch support
    - Vegetable seeds, specialty crops, and unrelated farm-input budgets
    - Breeders, germplasm owners, branded seed companies
    - Closest strategic market boundary for Inari today
  - - Gene-edited design / licensing layer
    - Editing design, partner development work, and royalty-like economics embedded inside seed commercialization
    - Standalone farm software or generic R&D spend not tied to launchable seed products
    - Seed-company partners and breeding collaborators
    - Likely first monetization layer for Inari
  - - Status-quo substitute budgets
    - Incumbent traited seeds, conventional breeding programs, and agronomic workarounds used to defend yield
    - Non-seed capital projects with no direct genetics decision
    - Growers and incumbent seed systems
    - Shows that buyers can respond to stress without adopting a new editing platform
  - - Explicitly excluded adjacencies
    - Commodity crop revenue, crop-protection product revenue, irrigation hardware, and downstream food processing
    - n/a
    - n/a
    - Important context, but not the spend pool Inari directly captures
  notes: Boundary rows are analytical categories, not additive TAM buckets. The table separates broad seed-market ceilings from the narrower partner-mediated gene-edited seed layer relevant to Inari.
