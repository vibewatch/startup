  evidenceGaps:
  - type: missing-source
    severity: material
    topic: inari-sam-som
    missingEvidence: A public or management-supported breakdown that isolates Inari’s reachable SAM or SOM by crop, geography, and partner channel.
    whyItMatters: Without a company-specific market boundary, valuation has to rely on broad category ceilings that overstate precision.
    diligencePath: Request partner-level pipeline acreage, named launch geographies, and management’s internal SAM/SOM bridge from broad seed markets to Inari-enabled product revenue.
    relatedQuestionRefs:
    - QM010
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-and-royalties
    missingEvidence: Public pricing, royalty, or revenue-share terms that show who pays Inari and how economics split between breeders, retailers, and growers.
    whyItMatters: The buyer map is clear qualitatively, but monetization power and gross-margin potential depend on contract structure rather than acreage alone.
    diligencePath: Request sample commercial agreements, royalty schedules, or management commentary on partner pricing and gross-margin architecture.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: material
    topic: third-party-yield-validation
    missingEvidence: Independent multi-location field-trial data validating Inari’s corn, soybean, and wheat yield/resource claims against commercial checks.
    whyItMatters: Company targets sound attractive, but purchase behavior in row crops turns on repeated local field performance under real management conditions.
    diligencePath: Request trial books, replicated-location summaries, or partner agronomy data by crop and environment before underwriting adoption speed.
    relatedQuestionRefs:
    - QM027
    relatedTableRefs:
    - TM004
