  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: Four-layer view from the broad commercial seed ceiling to Inari’s much narrower partner-mediated row-crop opportunity.
  data:
    items:
    - label: Broad commercial seeds ceiling
      value: ~USD 101-103B (2026)
      note: Published commercial-seed market summaries from Precedence and Fortune Business Insights set the outer ceiling for all crop categories and seed formats.
      layer: 1
      claimRef: CM008
    - label: GM row-crop seed core
      value: USD 26.9B (2026)
      note: Mordor’s GM-seed lens is closer to the incumbent row-crop trait market that Inari must fit into or displace.
      layer: 2
      claimRef: CM011
    - label: Gene-edited seed growth pool
      value: USD 7.14B (2025) to USD 22.31B (2030)
      note: Public gene-edited market summaries suggest fast growth but still sit well below the full commercial seed category.
      layer: 3
      claimRef: CM015
    - label: Inari near-term reachable layer
      value: Undisclosed / unresolved
      note: Evidence points to a subset of corn, soybean, and wheat partner programs, but no reviewed public source isolates a clean Inari SAM or SOM.
      layer: 4
      claimRef: CM017
  approximationNotes: The first three layers are published market lenses with different scopes and horizons. The fourth layer is intentionally non-numeric because no defensible public Inari SAM/SOM was found.
