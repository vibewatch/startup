    {
      "id": "milestones-and-adverse-overhang",
      "title": "Milestones, Litigation, and Adverse Overhang",
      "body": "Inari's milestone record reads like a company moving from platform formation to productization and then into a riskier commercialization phase. The about page records the opening of West Lafayette in 2018, the expansion to Ghent in 2019, U.S. germplasm collaborations in 2021, the InterGrain wheat partnership in 2022, first seed-company demonstration plots later in 2022, wheat editing evaluations in Australia in 2024, and first commercial-ready soy trials in 2025. Layered onto that operational chronology are two major financing markers: a $103 million round in January 2024 and the $144 million January 2025 round that took cumulative capital above $720 million.\n\nThe adverse record is also material and must stay attached to the overview rather than being deferred. Corteva sued Inari in Delaware in September 2023 over patented and plant-variety-protected seeds; later court materials and legal commentary show the case evolved into a broader fight over depository access, overlapping patent and PVP rights, and the competitive boundary for follow-on innovation. The U.S. Department of Justice entered the debate in 2026 with a statement of interest emphasizing the public's need to access patented biological material for competition and innovation. Separately, Inari filed a January 2026 WARN notice for 64 permanent West Lafayette layoffs, with local reporting saying Cambridge staff were also affected. The company's public record therefore combines serious technical ambition with live IP and execution risk.",
