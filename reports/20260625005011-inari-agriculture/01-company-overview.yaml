    {
      "id": "platform-crops-and-commercialization",
      "title": "Platform, Crop Focus, and Commercialization Posture",
      "body": "The technology and crop record are clear enough to define what Inari is trying to sell even though hard customer metrics remain private. Across official pages, whitepaper material, and trade coverage, Inari repeatedly presents the SEEDesign platform as the combination of AI-enabled predictive design and multiplex gene editing applied to broadacre crops. The first-wave crop set is soybeans, corn, and wheat. The most concrete official near-term product statement is soybean-focused: the solutions page says the first commercial-ready solution is a High Yield Design for soybeans and sets a minimum target of +7.5% yield potential, while the about-page history says those soy designs were trialed across all U.S. growing regions in summer 2025.\n\nCorn and wheat are not speculative adjacencies; they are part of the same verified operating narrative. The company cites an InterGrain wheat collaboration aimed at higher-yield wheat for Australia, and the public patent trail shows ongoing work in wheat, maize, and soybean editing. The business model underneath those programs is explicitly partner-oriented. Inari and its supporters describe an asset-light model meant to support seed companies and their farmer customers rather than compete head-on as a branded seed major. That lowers channel conflict and explains why germplasm access, partner demonstrations, and IP strategy are core milestones rather than side notes.",
