  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Inari Agriculture is a Cambridge, Massachusetts seed-technology company founded by Flagship Pioneering in 2016 and publicly unveiled in 2018 around an AI-enabled SEEDesign platform for broadacre crops. By run date, the verified record shows a January 2025 $144 million financing with independent reports of a $2.17 billion post-money valuation, a 2025 CEO transition from Ponsi Trivisvavet to Lisa Nunez Safarian, and public crop programs in soybeans, corn, and wheat. The same record also shows material adverse overhang from Corteva seed-IP litigation and a January 2026 layoff of 64 workers in West Lafayette, while core private metrics such as revenue and customer count remain undisclosed."
  },
  "sections": [
    {
      "id": "identity-footprint-and-model",
      "title": "Identity, Footprint, and Business Model",
      "body": "Inari Agriculture's core identity is unusually consistent across its official materials and founding backstory. The company says it was founded by Flagship Pioneering in 2016, publicly emerged from that incubation in 2018, and is building a seed-technology business rather than a vertically integrated crop-input brand. The official about, funding, and Flagship launch materials all describe the same technology stack: an AI-enabled SEEDesign platform that combines genomics, predictive design, and multiplex gene editing to create higher-performing broadacre seeds. That positioning matters because later chapters should treat Inari as a platform company whose economic logic depends on partnering with seed companies rather than replacing them.\n\nThe footprint is also clear enough to act as ground truth for the rest of the report. Cambridge, Massachusetts is the global headquarters and platform center; West Lafayette, Indiana is the product-development and commercial hub in the U.S. corn and soybean belt; and Ghent, Belgium supports modeling, prototyping, and research. Official pages describe three sites on two continents, with the current locations page showing 200+ employees while 2024-2025 press releases still described the company as having more than 300 employees. That gap is a real diligence signal rather than a rounding issue, especially once the 2026 restructuring is added to the picture.",
