  topStrengths:
    - >-
      Inari has one of the deepest capital bases in private ag-biotech, with more than $720 million of disclosed equity
      and continued support from Flagship plus an ADIA subsidiary in the January 2025 round.
    - >-
      The company has a coherent technical and crop thesis: AI-enabled SEEDesign, multiplex editing, and public programs
      across soybeans, corn, and wheat rather than a single narrow trait experiment.
    - >-
      Public commercialization evidence is early but real, including soybean trials across U.S. growing regions, a
      stated minimum 7.5% yield target in soy, and the InterGrain wheat collaboration aimed at double-digit yield
      improvement.
    - >-
      Inari's partner-oriented model may reduce go-to-market friction relative to building a full branded-seed
      distribution stack from scratch.
  topRisks:
    - >-
      Public sources still do not disclose revenue, customer count, acreage under contract, margins, cash runway, or the
      detailed terms behind the $2.17 billion private valuation.
    - >-
      Corteva seed-IP litigation remains active and highlights real dependence on germplasm access, depository rules,
      and defensible freedom to operate.
    - >-
      The January 2026 64-person West Lafayette layoff suggests commercialization and cost structure are still being
      reset after years of heavy private funding.
    - >-
      Gene-edited seed adoption still faces regulatory fragmentation, consumer-perception spillover from GMO debates,
      and long agricultural adoption cycles.
  unresolvedGaps:
    - >-
      Current revenue, ARR, gross margin, burn, runway, and whether any 2025 trial activity converted into material
      recurring commercial revenue.
    - >-
      Named customer count, acreage or bag-volume commitments, partner concentration, pricing structure, and renewal
      evidence for seed-company channels.
    - >-
      Detailed Series G terms including liquidation preferences, ownership changes, secondary activity, and the exact
      basis for the reported $2.17 billion post-money valuation.
    - >-
      Current executive bench depth, CTO or chief science operating structure, and whether 2026 layoffs changed
      technical or commercial capacity materially.
