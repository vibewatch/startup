summary:
  headline: >-
    Inari has raised enough capital and assembled enough crop-specific technical proof to warrant continued diligence,
    but the lack of public commercialization economics, ongoing IP litigation, and the 2026 workforce reset keep the
    investment case in research-more territory rather than buy territory.
