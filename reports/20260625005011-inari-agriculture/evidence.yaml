evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: commercial-disclosure
    missingEvidence: Current revenue, run-rate, and total active customer count from management or audited materials.
    whyItMatters: Capital intensity and commercialization quality cannot be judged cleanly without hard output metrics.
    diligencePath: Request the latest board deck or monthly operating review with revenue, bookings, and customer-count pages.
    relatedQuestionRefs:
      - QO018
      - QO019
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: headcount-disclosure
    missingEvidence: A reconciled employee count by site after the January 2026 restructuring.
    whyItMatters: >-
      Official disclosures say both more than 300 employees and 200 plus employees, which changes views on operating
      capacity.
    diligencePath: >-
      Ask HR or finance for a dated headcount roll-forward showing gross reductions and current FTEs by Cambridge, West
      Lafayette, and Ghent.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO001
      - TO002
  - type: private-evidence-only
    severity: material
    topic: ownership-and-control
    missingEvidence: >-
      Current cap table, board-observer rights, and any special governance or veto terms held by Flagship or later
      investors.
    whyItMatters: >-
      Stakeholder quality is visible, but control rights determine how financing leverage and strategic direction
      actually work.
    diligencePath: Request the latest cap table, investor-rights agreement summary, and board composition memo.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO002
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table
    missingEvidence: >-
      A complete internal milestone ledger for product, partnership, and commercialization events not publicized
      externally.
    whyItMatters: >-
      This chapter establishes the canonical chronology for later chapters, so missing internal events can distort
      sequencing and causality.
    diligencePath: >-
      Request the company's internal timeline or corporate development chronology and reconcile it against the public
      record.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO005
  - type: missing-source
    severity: material
    topic: inari-sam-som
    missingEvidence: >-
      A public or management-supported breakdown that isolates Inari’s reachable SAM or SOM by crop, geography, and
      partner channel.
    whyItMatters: >-
      Without a company-specific market boundary, valuation has to rely on broad category ceilings that overstate
      precision.
    diligencePath: >-
      Request partner-level pipeline acreage, named launch geographies, and management’s internal SAM/SOM bridge from
      broad seed markets to Inari-enabled product revenue.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-and-royalties
    missingEvidence: >-
      Public pricing, royalty, or revenue-share terms that show who pays Inari and how economics split between breeders,
      retailers, and growers.
    whyItMatters: >-
      The buyer map is clear qualitatively, but monetization power and gross-margin potential depend on contract
      structure rather than acreage alone.
    diligencePath: >-
      Request sample commercial agreements, royalty schedules, or management commentary on partner pricing and
      gross-margin architecture.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: third-party-yield-validation
    missingEvidence: >-
      Independent multi-location field-trial data validating Inari’s corn, soybean, and wheat yield/resource claims
      against commercial checks.
    whyItMatters: >-
      Company targets sound attractive, but purchase behavior in row crops turns on repeated local field performance
      under real management conditions.
    diligencePath: >-
      Request trial books, replicated-location summaries, or partner agronomy data by crop and environment before
      underwriting adoption speed.
    relatedQuestionRefs:
      - QM027
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Public enterprise price sheets, realized license economics, or per-acre commercialization terms for Inari and the
      retained peer set.
    whyItMatters: >-
      Without verified pricing power, the analysis can compare packaging posture and route to market but cannot prove
      who monetizes traits best.
    diligencePath: >-
      Request current customer or partner term sheets, realized pricing examples, or management commentary under NDA for
      at least two crops.
    relatedQuestionRefs:
      - QP018
      - QP028
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: commercialization-proof
    missingEvidence: >-
      Current commercial acreage, repeat-partner conversion, retention, and win-rate data for Inari and Pairwise in
      broadacre deployments.
    whyItMatters: >-
      Moat durability depends on whether platform wins are turning into recurring commercial launches rather than
      isolated pilot or trial milestones.
    diligencePath: >-
      Ask management for crop-by-crop launch metrics, partner renewal data, and examples where the platform displaced
      incumbent breeding or trait alternatives.
    relatedQuestionRefs:
      - QP026
      - QP028
    relatedTableRefs:
      - TP005
  - type: access-blocked
    severity: minor
    topic: cibus-current-filings-detail
    missingEvidence: >-
      A directly readable current Cibus SEC-filings detail page or recent filing text beyond the investor-relations
      landing surface.
    whyItMatters: >-
      The current chapter can describe the merger story and investor surface, but not a deeper 2026 filing-level
      commercialization update from Cibus.
    diligencePath: >-
      Fetch readable SEC filing URLs or investor PDF filings directly once a stable path is identified, then update the
      public-company backing comparison.
    relatedQuestionRefs:
      - QP011
      - QP017
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: material
    topic: regulatory-timing
    missingEvidence: >-
