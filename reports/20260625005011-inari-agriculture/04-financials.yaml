  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: Booked revenue, ARR if applicable, and revenue recognition policy by crop program and partner.
    whyItMatters: Without disclosed revenue, commercialization cannot be translated into operating scale or growth quality.
    diligencePath: Request quarterly revenue bridge and partner-level revenue waterfall under NDA.
    relatedQuestionRefs:
    - QI012
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: contract-economics
    missingEvidence: Executed economics showing whether Inari earns fees, milestones, royalties, seed sales, or mixed contract structures.
    whyItMatters: The business model cannot be underwritten if public evidence shows value proposition but not monetization mechanics.
    diligencePath: Request executed contract summaries and sample economics for top partner cohorts.
    relatedQuestionRefs:
    - QI002
    - QI014
    relatedTableRefs:
    - TI001
    - TI002
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current cash balance, monthly burn, runway, debt balance, covenant package, and any grant obligations.
    whyItMatters: Total raised does not prove capital adequacy; runway and financing dependency remain unknown.
    diligencePath: Request treasury package, monthly cash report, debt schedule, and board-approved financing plan.
    relatedQuestionRefs:
    - QI013
    - QI023
    relatedTableRefs:
    - TI003
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Active paid partner count, top-customer concentration, and commercialization conversion by crop and geography.
    whyItMatters: Named collaborations do not reveal whether revenue is diversified or concentrated in a small number of counterparties.
    diligencePath: Request partner pipeline dashboard and top-10 concentration analysis.
    relatedQuestionRefs:
    - QI015
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: litigation-economics
    missingEvidence: Legal reserve, insurance recovery assumptions, and management view of commercialization delay risk from Corteva litigation.
    whyItMatters: The case is active through at least 2026 and could affect cost structure, partner confidence, or timing.
    diligencePath: Request litigation budget, reserve treatment, and partner diligence materials prepared for counterparties.
    relatedQuestionRefs:
    - QI017
    relatedTableRefs:
    - TI005
