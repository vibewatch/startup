- id: capital-base-and-adequacy
  title: Capital base and adequacy
  body: 'Inari has clearly had access to large private capital pools. The company said the January 2024 fundraise added $103 million and brought cumulative equity raised above $575 million. One year later, Inari said it closed another $144 million and pushed cumulative equity above $720 million, with participation from ADIA and several returning institutional backers. Independent coverage reported the 2025 round at a $2.17 billion valuation versus $1.65 billion a year earlier. Those facts matter because they show investors continued to finance the company deep into the commercialization phase rather than only at the platform-discovery stage.


    The harder question is adequacy, and public evidence does not answer it. Inari disclosed a $20 million West Lafayette expansion and a larger commercial build-out, but no cash-on-hand figure, monthly burn, runway target, or debt schedule. The funding raises therefore prove support, not sufficiency. A company can raise hundreds of millions and still be close to a next-round trigger if field programs, regulatory work, partner enablement, and legal costs consume capital faster than revenues emerge. The absence of debt, grant, or project-finance disclosure does not prove those items are zero; it only means they are not visible in the retrieved record.'
