- id: capital-intensity-and-commercialization-risk
  title: Capital intensity and commercialization risk
  body: 'The broader seed and gene-editing context argues against treating Inari as a cheap-to-scale software story. CRS and USDA materials show gene-edited crops can reach commercialization under U.S. rules, but they still sit inside coordinated USDA, FDA, and EPA oversight and must survive field validation, market access, and customer adoption. Seed World''s 2026 commercialization analysis is especially important: the edit may be fast, but multi-season validation, regional testing, and value-chain alignment still take years. That is consistent with Inari''s own path from 2022 demonstration plots to 2025 commercial-ready soy trials rather than immediate broad launch.


    Incumbent economics reinforce the capital burden. Corteva''s 2025 10-K says regulatory approvals for biotech seed products are lengthy, costly, and complex, and it spent $591 million of capex in 2025 with roughly $600 million expected in 2026. Bayer Crop Science reported €2.013 billion of adjusted R&D expense and €1.009 billion of cash-flow-relevant capital expenditure in 2025. Inari does not need Bayer- or Corteva-scale assets to prove its model, but those numbers are a reminder that crop innovation at commercial scale remains expensive. Pairwise''s Corteva-backed joint venture and Benson Hill''s Chapter 11 filing show the same two-sided reality: strategic demand for gene editing is real, but financing and execution risk remain unforgiving.'
