- id: financial-verdict-and-diligence-blockers
  title: Financial verdict and diligence blockers
  body: 'The financial verdict is that Inari has credible commercialization momentum but not public-company-grade financial visibility. The strongest evidence is directional: more than $720 million of cumulative equity, a reported $2.17 billion valuation in 2025, partner demonstrations since 2022, a commercial-ready soy design trial in 2025, a $20 million product-operations expansion, and a senior commercial hire charged with driving revenue. Those are the right kinds of milestones for a late-stage seed-technology company. They support a view that Inari is trying to monetize through partner channels rather than build a full-stack seed manufacturer and distributor.


    But the public record still fails the underwriting test. There is no disclosed revenue, ARR, price list, royalty schedule, gross margin, cash balance, burn rate, customer concentration, or contract economics. The January 2026 WARN-linked layoff of 64 West Lafayette-area employees, plus the still-live Corteva litigation, also show that cost control and legal execution remain part of the story. For diligence, the must-have asks are straightforward: booked revenue by program and partner; contract structure by collaboration; cash, burn, and runway; margin by product stream; and any debt, covenant, or litigation reserve exposure. Until those are available, the company looks well financed for experimentation and scaling, but not publicly underwritable on revenue quality or margin path.'
