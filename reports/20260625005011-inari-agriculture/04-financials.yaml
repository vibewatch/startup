- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Revenue by crop program / partner
    - Cannot judge whether commercialization has produced real sales or only field-stage readiness
    - Request quarterly revenue bridge by crop, partner, geography, and revenue recognition policy
  - - Gross margin and cost-to-serve by stream
    - Cannot test whether the asset-light model is already margin accretive or still venture-subsidized
    - Request contribution margin by platform work, licensing, and any downstream seed economics
  - - Pricing, milestone, and royalty schedules
    - Cannot translate agronomic value into realized monetization
    - Request executed contract summaries, milestone definitions, and royalty waterfalls
  - - Cash balance, monthly burn, and runway plan
    - Cannot assess dilution risk or next-round timing despite >$720 million raised historically
    - Request cash waterfall, board runway case, and downside financing trigger
  - - Customer concentration and paid partner count
    - Cannot tell whether revenue is diversified or dependent on a few lighthouse counterparties
    - Request active paid partners, top-5 concentration, and pipeline conversion statistics
  - - Debt, grants, litigation reserves, and covenants
    - Cannot judge hidden fixed claims on cash or the cost of the Corteva dispute
    - Request debt schedule, grant terms if any, legal reserve treatment, and indemnity exposure
  notes: These are underwriting blockers, not cosmetic asks. Each gap corresponds to a metric or contract term the public record does not disclose.
