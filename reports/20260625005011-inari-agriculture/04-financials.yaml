- id: pricing-and-unit-economics-opacity
  title: Pricing and unit-economics opacity
  body: 'The financial problem is not lack of strategic narrative; it is lack of disclosed unit economics. Across the retrieved official pages, financing announcements, trade coverage, and legal materials, Inari does not publish revenue, ARR, pricing schedules, royalties, milestones, customer count, gross margin, CAC, payback, or cash conversion metrics. The solutions page makes the commercial proposition tangible by advertising a minimum target increase in soybean yield potential of 7.5% and promising ROI across the value chain, but it still does not show how Inari captures that value contractually. Even the strongest commercialization update—the appointment of a chief commercial officer to lead revenue growth and go-to-market scaling—signals intent, not economics.


    That matters because gene-edited seed businesses can look asset-light while still carrying real pre-scale cost. Inari has to fund predictive design, gene-editing workflows, field validation, partner support, regulatory work, and commercial organization build-out before investors can judge whether partner-led revenue becomes high-quality, recurring economics. The public record therefore supports a narrow conclusion: there is evidence of commercial progress and value proposition, but almost none on realized monetization or efficiency. This chapter treats those missing metrics as diligence blockers, not as zeros and not as implied SaaS-style economics.'
  claimRefs:
  - CI007
  - CI016
  - CI022
