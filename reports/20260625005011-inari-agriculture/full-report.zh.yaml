      - number: '3.2'
        title: 现任巨头：Bayer、Corteva 和 Syngenta 作物组合更广，商业化肌肉更重
        blocks:
          - type: paragraph
            body: >-
              Bayer、Corteva 和 Syngenta 不只是技术可比对象；它们在分销和监管上也设定了 Inari 必须跨过的现实门槛。Bayer
              描述了一条整合管线，覆盖种子、性状、作物保护、生物制剂和数字工具，作物包括玉米、大豆、棉花、油菜、小麦、水稻和蔬菜。Corteva 仍把自己定位为拥有知名种子品牌的纯农业公司；其 Pairwise
              交易说明，它可以购买外部基因编辑能力，而不必等待初创公司独立成熟。Syngenta 明确表示转基因性状仍有战略重要性，同时基因编辑会输送下一代产品；它还把这一 R&D
              姿态与庞大科研组织、广泛玉米性状组合和可观年度投资基础配在一起。对 Inari 而言，含义很直接：只要现任者控制精英种质、负责任发布、田间网络和全球监管执行，它们不需要在内部赢下每一次编辑突破。
