      - number: '3.4'
        title: 定价、监管与转换成本：公开价格表稀缺，因此触达和审批更重要
        blocks:
          - type: paragraph
            body: >-
              公开定价是证据集中最薄弱的一环。已审阅的 Inari、Pairwise、Cibus、Confluence 或 Arcadia
              页面，都没有披露稳健的企业级价格表，用于种子设计、授权或性状准入经济性。因此，竞争比较在合同姿态和上市路径上更可信，在每英亩价格或授权费精度上较弱。同时，监管仍是有意义的竞争变量。CRS 和 MoFo
              显示，美国监管仍由 USDA、FDA 和 EPA 分担，SECURE 规则被撤销后，APHIS 在考虑新修订时又回到旧流程。Frontiers
              补充了全球层面：各国规则分化会抬高成本、拖慢发布并复杂化贸易。Bayer、Corteva 和 Syngenta
              比小平台更容易吸收这些负担。转换成本也有利于现任者，因为精英种质获取、性状管理、田间试验基础设施和种植者关系，比单独的软件界面更难替换。
