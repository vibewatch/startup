      - - Corteva
        - 育种、性状、数字化、外部创新投资
        - 在大豆、玉米、油菜和气候韧性性状上重叠高
        - 成熟种子分销，加上 JV 支持的基因编辑扩张
        - 凭 Pioneer 和上市公司基础设施非常强
