      - number: '7.3'
        title: 生物执行与规模化风险
        blocks:
          - type: paragraph
            body: >-
              Inari
              的科学叙事从设计上就很雄心勃勃。其平台材料强调预测性设计、多重编辑、一次执行多种编辑类型，以及从序列到表型再到田间的迭代学习。这正是生物执行风险仍然很高的原因。复杂农艺性状很少是单基因胜利；它们取决于性状网络、遗传背景、环境和耕作实践。2026
              年的行业评论从商业化角度提出了同一点：CRISPR 可以加速育种，但不能消除多季验证、区域测试，或在真实种子体系中拿出持久表现的需求。Inari
              自己的流程描述也确认，在一项设计达到商业就绪前，公司必须把设计推进到温室和田间测试。更快的编辑改变的是周期时间，不是废除生物学。


              这种执行负担既体现在科学上，也体现在实体设施上。Inari 2024 年的 West Lafayette 扩建把温室容量翻倍，并增加仓库和商业运营基础设施，这削弱了那种把公司简单看成「软件加
              CRISPR」的观点。相对于完全一体化的种子巨头，该业务可能较轻资产，但商业化仍需要受控环境、田间能力、合作伙伴协调，以及在大豆、玉米和小麦背景下反复验证。如果第一代产量主张不能跨季节、地域或合作伙伴种质成立，平台可信度会迅速受损，因为它的价值主张是阶跃式表现，而不是渐进便利。GMO
              混淆和接受度风险也会在这里重新进入：即使科学有效，种子公司、零售商和农户仍需要足够信心，相信产品可理解、合规，并值得采用。
