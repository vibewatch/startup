      - number: '6.5'
        title: 反向证据与商业化时间
        blocks:
          - type: paragraph
            body: >-
              最强的两个反向信号是内部执行压力和外部商业化拖慢。内部看，Inari 2026 年 1 月的 WARN 通知及后续行业报道显示，West Lafayette 永久裁员 64
              人，并明确与业务需求变化相关。由于该基地被描述为产品开发和商业运营中心，这次缩减与客户叙事直接相关：公司一边试图推动大田作物产品通过验证并上市，一边仍在调整成本结构和节奏。外部看，Corteva 诉讼及相关
              DOJ 关注表明，对新进入者而言，种子行业 IP 接入仍是现实摩擦。即使 Inari 对指控有异议，争端本身也提醒投资人：渠道接入和商业化并不是在无摩擦市场中发生。

              2026 年更广泛的行业评论把时间风险说得很明白。Seed World
              的商业化分析认为，基因编辑可能压缩实验室周期，但不会取消多季验证、区域测试、零售和消费者信心，或价值链对齐的需求。换句话说，更快的编辑不自动等于更快的客户采用。这一观察几乎完全贴合 Inari
              的证据组合：公司有可信的合作伙伴验证、商业化叙事和一些田间验证细节，但除了大豆商业就绪叙事外，仍缺少农户重复购买或广泛生产规模部署的公开证明。承保时，反向解读不是需求不存在，而是达到持久采用所需时间，可能长于单靠科学进展所暗示的时间。
