        - 规模加 IP 共享灵活性压缩初创公司的空白地带
      - - Pairwise
        - Fulcrum CRISPR 平台和授权
        - 在大豆、玉米、小麦和油菜上重叠高；特种作物集合也更宽
        - 已商业化食品验证，并有活跃 JV / 授权模式
        - 中等；通过伙伴改善，而不是自有种子渠道
        - 平台逻辑最接近 Inari
      - - Cibus / Calyxt
        - RTDS 生产力性状，加上配料平台
        - 在油菜和水稻上中等；大豆 / 小麦重叠较不明显
        - 性状转移和上市公司故事，但当前证据仍窄
        - 中等；引用了一些非监管历史
        - 有公开市场准入，但已证明的宽度较薄
      - - Arcadia
        - 传统作物科学，当前聚焦健康产品
        - 低到中等；仅剩小麦性状残余
        - 消费产品商业化，不是大田作物性状规模化
        - 基于留存证据为低到中等
        - 现在更像警示同业，而不是紧密运营对手
      - - Yield10 / Nufarm
        - 收购方旗下的 Camelina 油籽性状
        - 与 Inari 当前公开作物集合的直接重叠低
        - 独立平台结束；资产在 Nufarm 旗下延续
        - 在 Nufarm 旗下中等，历史上独立时弱
