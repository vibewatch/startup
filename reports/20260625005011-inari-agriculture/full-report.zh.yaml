  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 监管、IP 和生物学风险会传导到上市时间、伙伴信心、融资杠杆，最终影响估值。
    data:
      nodes:
        - id: reg
          label: 监管摩擦
          description: 美国 / 欧盟路径分化、标签要求，以及特定产品审查风险
        - id: ip
          label: Corteva 诉讼
          description: 专利 / PVP 争议和种子托管先例风险
        - id: bio
          label: 田间表现不及预期
          description: 多重性状增益无法跨季节或种质重复
        - id: accept
          label: 接受度拖累
          description: 零售商或消费者对 GMO 的混淆拖慢渠道信心
        - id: partner
          label: 伙伴犹豫
          description: 种子公司交易对手推迟或收窄上市计划
        - id: launch
          label: 上市延误
          description: 商业时间和地理范围向外推迟
        - id: rev
          label: 收入转化落空
          description: 证据未能转化为多元商业销售
        - id: cash
          label: 融资压力
          description: 额外资本或重组需求上升
        - id: val
          label: 估值压缩
          description: 风险溢价扩大，谈判筹码下降
      edges:
        - to: launch
          from: reg
        - to: partner
          from: reg
        - to: partner
          from: ip
        - to: cash
          from: ip
        - to: launch
          from: bio
        - to: accept
          from: bio
        - to: partner
          from: accept
        - to: launch
          from: partner
        - to: rev
          from: launch
        - to: cash
          from: rev
        - to: val
          from: cash
        - to: val
          from: partner
    approximationNotes: 边描述的是从 Inari 伙伴主导模式和当前公开证据推断出的因果传导逻辑；未分配量化权重。
