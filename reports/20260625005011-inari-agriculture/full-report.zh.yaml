      - number: '8.3'
        title: 公开与私有可比公司都提示，对 $2.17 billion 估值应保持克制
        blocks:
          - type: paragraph
            body: >-
              Inari 没有完美的公开可比公司，这本身就是问题的一部分。在当前证据集中，Cibus 是最接近的上市基因编辑种子平台；但 StockAnalysis 显示，截至 2026 年 6 月 25 日，其市值仅约
              $103.8 million，过去 12 个月收入为 $4.29 million，而 Cibus 仍报告大额亏损，并依赖里程碑密集型商业化计划。Pairwise 在某些方面看起来战略状态更健康，因为
              Corteva 进行了重大股权投资并组建五年期合资公司，但即便 Pairwise 2024 年 9 月融资也只有 $40 million，披露总融资为 $155 million，而不是 Inari
              这种独立股权估值量级。下行端，Benson Hill 展示了当资产强度、商业化时间和融资需求失步时，农业生物技术估值可以如何严重回撤；其 Chapter 11 结果和 Confluence
              重启是一个真实警告。Arcadia 已不再是干净的基因编辑种子可比公司，但其微小规模、战略替代方案措辞和融资需求仍表明，公开市场对未成规模的农业生物故事并不宽容。合在一起，可比公司集合不能证明 Inari
              被高估。它确实说明，多十亿美元私有估值所需的证明负担，远高于公开交易水平或品类内较小战略融资所暗示的负担。
