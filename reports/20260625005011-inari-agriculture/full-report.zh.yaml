  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与商业就绪度
        blocks:
          - type: paragraph
            body: >-
              Inari 的公开材料指向伙伴主导的 B2B
              收入模式，而不是直接销售品牌种子。公司反复表示自己要支持种子公司，而不是与其竞争；解决方案页面也把产品表述为帮助伙伴扩大自有组合的智能设计。最强的商业化信号是运营性的，而非财务性的：2022
              年夏天首次进行种子公司伙伴示范，2025 年夏天首个商业就绪大豆设计覆盖美国所有种植区域试验，截至 2025 年 1 月融资时仍在与种子公司客户推进示范田。这些证据足以说明 Inari 已经走出纯平台
              R&D，进入收入前或早期商业化的伙伴赋能阶段。它不足以说明哪条收入线占主导，因为没有检索到的来源披露经济性究竟来自预付合作费、里程碑、版税、下游种子销售，还是这些杠杆的组合。


              产品和作物重点也很清楚。Inari 第一波聚焦大豆、玉米和小麦；作物特定合作展示了模式如何扩展：玉米有 Beck's 和 Eden/Stine，大豆有 Mertec/MS Technologies，小麦有澳大利亚
              InterGrain。这些协议具有财务意义，因为它们降低了 Inari
              从零搭建完整自有种子分销栈的必要性。但伙伴杠杆不等于收入可见度。公开来源显示商业意图、客户准入和田间进展；没有显示已签约付费量、伙伴最低承诺或已实现变现。
