  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 2025 年 1 月估值是一场里程碑押注，不是基于已披露经济性的估值
        blocks:
          - type: paragraph
            body: >-
              最干净的公开事实模式很直接。Inari 称其 2025 年 1 月融资 $144 million，使累计股权融资超过 $720 million；独立报道称本轮估值为 $2.17 billion，高于一年前的
              $1.65
              billion。这意味着，尽管公开记录仍没有收入、ARR、毛利率、已签约面积、特许权使用费率或现金消耗，市场仍接受了一次有意义的上调。换句话说，这个估值并不是像公开股票投资人承保成长公司那样，由公开经营披露支撑。支撑它的是平台信念、投资人背书，以及第一代产品进展未来能转化为商业经济性的信心。公司自己也把本轮融资表述为由第一代产品表现和商业化进展推动，而不是由已经披露的变现能力推动。这对解读很重要：该估值很可能嵌入了这样的预期，即由合作伙伴牵头的大豆、玉米和小麦上市，可以从示范和试验活动转向可重复、有合同支撑的收入。但它不能证明这些经济性今天已经存在。尽调时，$2.17
              billion 投后估值最适合被理解为一个战略里程碑估值，其有效性取决于下一批证据，而不是一个已经由披露单位经济性锚定的估值。
