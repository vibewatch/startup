      - number: '1.2'
        title: 领导层、治理与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              领导层记录同时显示了延续性和一次重要的 2025 年交接。Flagship 在发布材料中把 Ignacio Martinez 列为创始 CEO，David Berry 列为联合创始人，Ponsi
              Trivisvavet 列为 2018 年 4 月任命的运营 CEO。Ponsi 在 2025 年 1 月融资新闻稿中仍是被引用的 CEO，但公司在 2025 年 6 月宣布她因健康原因卸任，由 Martinez
              出任临时 CEO。2025 年 10 月，Inari 又任命 Lisa Nunez Safarian 为正式 CEO，11 月 4 日生效；她长期任职于 Monsanto 和 Bayer，并自 2025 年 5
              月起担任 Inari 董事。到 2026 年运行日，官方领导层页面列 Safarian 为 CEO 兼董事，Martinez 为董事长兼公司联合创始人。


              因此，本章不应沿用把 Ponsi 称为现任 CEO 的提示锚点。CTO 锚点也同样需要谨慎：已审阅的 2026 年公开领导层材料没有显示 CTO 头衔，也没有显示 Enoch
              Ng。这不能证明该职位在内部不存在，但说明本章可用的公开记录无法验证它。公司对组织顶部的治理可见度尚可，但控制权、观察员席位和完整高管团队仍不完整；关键人风险仍集中在
              CEO、董事长以及少数可见的商业和科学领导者身上。
