      - number: '7.5'
        title: 缓释措施、监测信号与杀死标准
        blocks:
          - type: paragraph
            body: >-
              实务上的缓释逻辑真实存在，但并不完整。监管风险可以通过把产品留在最清晰的美国类别内、尽早接触
              APHIS，以及把上市地域先排序到更友好的司法辖区和更高价值的合作伙伴来降低。接受度风险可以通过围绕收益沟通、提供透明标签选项，并让合作伙伴销售农艺结果而非分子抽象概念来降低。诉讼风险可以通过案卷监控、针对性和解分析、保险或准备金规划，以及对种质来源和寄存实践开展合作伙伴尽调来管理。运营风险可以通过按作物证明可重复性来降低，而不是把平台承诺过度延展到过多同步上市。


              但这些缓释措施只有在产生可观察信号时才有意义。投资人应寻找硬证据：田间表现能跨环境复现，上市伙伴超出现有具名集合，监管路径正在缩短而不是越来越定制化。如果 Corteva
              争端产生禁令风险、对寄存使用作出广泛不利解释，或让合作伙伴围绕自由实施产生犹豫，案例应被实质性下调。同样，如果 Inari
              在出现合作伙伴转化和商业种子销量的公开证据之前，又需要一次重大重组或大型融资，投资论点也应破裂。换句话说，公司目前仍只适合作为分阶段去风险故事来投资：监管、IP、田间验证和渠道扩张都需要依次改善，任何一个节点失败，都可能传导到收入时间、估值和融资压力。
