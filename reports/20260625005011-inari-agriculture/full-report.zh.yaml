      - number: '8.4'
        title: 估值可以成立，但前提是里程碑转化为已披露经济性，并且法律风险下降
        blocks:
          - type: paragraph
            body: >-
              支撑或推高 2025 年 1 月估值的公开案例并不难描述。Inari
              需要证明第一代产品进展会变成付费商业化：已签署的合作伙伴经济条款、重复性特许权使用费或里程碑结构、付费面积或销量爬坡，以及大豆、玉米或小麦上市超越示范田和商业就绪试验措辞的证据。额外上行支撑将来自诉讼去风险、监管清晰度，以及确认裁员重置没有实质损害产品时间线。挑战案例同样清晰。公开来源显示，Indiana
              永久裁员 64 人与业务需求变化相关，围绕专利种子接入的 Corteva 诉讼仍在推进，且全行业现实是，更快编辑不会移除多季验证或审批复杂度。Corteva 的 10-K 和 Bayer
              年报也提醒投资人，即使对在位者而言，种子和性状商业化仍是长周期、高成本过程。由于 Inari
              仍不披露收入或单位经济性，我这里不使用收入倍数计算。更合适的框架，是围绕商业化验证能否弥合战略性风险投资估值与可承保经营估值之间的缺口来做情景拆解。以当前记录看，这些证明点仍有太多停留在未来。
