      - number: '4.5'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              财务结论是，Inari 有可信的商业化动量，但没有达到公开公司级别的财务可见度。最强证据是方向性的：累计股权融资超过 $720 million，2025 年报告估值 $2.17 billion，2022
              年以来有伙伴示范，2025 年有商业就绪大豆设计试验，完成 $20 million 产品运营扩张，并任命负责推动收入的高级商业高管。这些都是后期种子技术公司应有的里程碑。它们支持这样一种看法：Inari
              正试图通过伙伴渠道变现，而不是建设全栈种子制造商和分销商。


              但公开记录仍未通过承销测试。公司没有披露收入、ARR、价格表、版税计划、毛利率、现金余额、烧钱速度、客户集中度或合同经济性。2026 年 1 月与 WARN 相关的 West Lafayette 地区 64
              人裁员，加上仍在进行的 Corteva
              诉讼，也说明成本控制和法律执行仍是故事的一部分。尽调必须索取的材料很直接：按项目和伙伴划分的已预订收入；按合作划分的合同结构；现金、烧钱和跑道；按产品流划分的利润率；以及任何债务、契约或诉讼准备金敞口。拿到这些之前，公司看起来有足够资金用于实验和扩张，但收入质量和利润率路径还不能公开承销。
