      - number: '6.4'
        title: 留存、转换成本与集中度
        blocks:
          - type: paragraph
            body: >-
              留存证据是公开客户档案中最弱的一环。留存来源没有披露
              NRR、GRR、流失率、续约率、合同期限、满意度分数，或明确的种植者复购数据。这种缺口不意味着关系薄弱；它意味着公开记录无法把客户标识和合作里程碑，与持久商业经济性区分开。最强的可用代理指标是结构性转换成本。一旦种子公司合作伙伴把精英种质、育种周期、田间测试和上市规划投入一个由
              Inari 支撑的项目，改变方向并不轻松。种植者一侧也类似：农艺信任通常靠本地表现一季一季反复验证赢来，而不是靠一次性产品认知建立。

              即便如此，集中度仍很难承保，因为可见客户基础狭窄且按作物分散。公开具名验证集中在少数对手方周围：大豆中的 M.S. Technologies/Mertec，玉米中的 Beck's 和
              Eden/Stine，以及小麦中的 InterGrain。这足以证明渠道触达，但不足以估算合作伙伴收入结构、头部客户暴露，或某一种作物或关系是否主导近端经济性。审慎解读是，Inari
              在第一轮商业化浪潮中很可能对少数种子公司关系存在有意义的依赖，但公开记录没有量化这种依赖。因此，任何关于耐久性的投资判断，在把客户基础称为多元或粘性之前，都应要求合同结构、续约行为、面积推进和合作伙伴集中度数据。
