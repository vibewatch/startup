      - number: '4.3'
        title: 资本基础与充足性
        blocks:
          - type: paragraph
            body: >-
              Inari 显然能获得大规模私募资本池。公司称 2024 年 1 月融资增加 $103 million，并把累计股权融资推至 $575 million 以上。一年后，Inari 称又完成 $144
              million，并把累计股权融资推至 $720 million 以上，ADIA 和多家回归机构投资者参与其中。独立报道给出 2025 年轮次估值 $2.17 billion，高于一年前的 $1.65
              billion。这些事实重要，因为它们说明投资者在公司深入商业化阶段后仍继续融资，而不只是平台发现阶段支持。


              更难的问题是资金是否充足，公开证据没有回答。Inari 披露了 $20 million 的 West Lafayette
              扩张和更大的商业建设，但没有现金在手、月度烧钱、跑道目标或债务计划。融资证明了支持，不证明足够。即使一家公司融到数亿美元，如果田间项目、监管工作、伙伴赋能和法律成本在收入出现前消耗资本更快，它仍可能接近下一轮触发点。没有债务、补助或项目融资披露，并不证明这些项目为零；只能说明它们在已检索记录中不可见。
