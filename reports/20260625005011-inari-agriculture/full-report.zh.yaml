companyProfile:
  summary: >-
    Inari Agriculture 是一家私营种子技术公司，由 Flagship Pioneering 于 2016 年创立，并在 2018 年以面向大田作物的 AI 驱动 SEEDesign
    平台公开亮相。公司把预测基因组学和多重基因编辑用于大豆、玉米和小麦，采用伙伴导向模式，目标是在不成为传统品牌种子巨头的情况下提升种质和性状表现。公开证据显示，公司在 2025 年 1 月完成 $144 million
    融资，累计股权融资超过 $720 million，报告投后估值为 $2.17 billion；商业化里程碑包括覆盖美国各产区的大豆试验，以及在澳大利亚与 InterGrain
    开展小麦合作。承销的主要约束不是战略野心，而是披露不透明：公开来源仍没有收入、客户数、英亩数、利润率或轮次条款细节；2026 年裁员和仍在进行的 Corteva 诉讼也带来执行与估值风险。
