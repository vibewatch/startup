      - number: '1.5'
        title: 里程碑、诉讼与负面悬而未决事项
        blocks:
          - type: paragraph
            body: >-
              Inari 的里程碑记录像是一家公司从平台形成走向产品化，再进入风险更高的商业化阶段。关于页面记录了 2018 年 West Lafayette 开设、2019 年 Ghent 扩张、2021
              年美国种质合作、2022 年 InterGrain 小麦伙伴关系、2022 年晚些时候首批种子公司示范田、2024 年澳大利亚小麦编辑评估，以及 2025
              年首批商业就绪大豆试验。在这条运营时间线之上，还有两个主要融资标记：2024 年 1 月的 $103 million 轮，以及 2025 年 1 月把累计资本推高至 $720 million 以上的 $144
              million 轮。


              负面记录同样重要，必须放在概览中，而不能后置处理。Corteva 2023 年 9 月在 Delaware 起诉
              Inari，争议涉及受专利和植物品种保护的种子；后续法院材料和法律评论显示，案件演变为围绕保藏访问、重叠专利和 PVP 权利、以及后续创新竞争边界的更大争议。美国司法部在 2026
              年以利益声明加入讨论，强调公众需要获取受专利保护的生物材料，以支持竞争和创新。另一个独立事项是，Inari 在 2026 年 1 月提交 WARN 通知，涉及 West Lafayette 64
              个永久裁员岗位；当地报道还称 Cambridge 员工也受影响。因此，公司公开记录同时包含严肃的技术雄心、正在进行的 IP 风险和执行风险。
