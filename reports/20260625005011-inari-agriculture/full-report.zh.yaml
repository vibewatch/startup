      - number: '6.2'
        title: 按作物和地域拆解的具名验证
        blocks:
          - type: paragraph
            body: >-
              具名验证是真实存在的，但各作物之间并不均衡。大豆的公开证据最清晰。Inari 的解决方案页面称，其第一个达到商业就绪状态的方案是一项高产大豆设计，并描述了与合作伙伴开展的田间试验，同时突出 M.S.
              Technologies 是把基因编辑解决方案带给美国农户的第一条路径。较早的 Mertec/M.S. Technologies 合作补上了育种背景这一层：它把 Inari 接入 Stine
              的大豆项目。玉米验证更早期，也更偏渠道：Beck's 提供美国农户触达和测试能力，Eden Enterprise 则扩大了对 Stine
              精英玉米育种基础的接入。小麦验证在地域上不同，开发指向也略更具体。InterGrain 给 Inari 打开了进入澳大利亚小麦的路径；到 2024 年，行业报道称，该合作已经在 University of
              Western Australia 研究设施种植第一批基因编辑小麦品系。

              从地域看，公开足迹因此在大豆和玉米上以美国为中心，但在小麦上实质延伸到了澳大利亚。加入 Iowa Soybean Research Center 还释放出贴近中西部农户的信号，因为 Inari
              不只是在抽象地销售平台，而是在嵌入一个明确声称要为大豆农户创造价值的农艺和研究网络。同样重要的是，具名验证没有证明什么。除大豆外，几乎没有公开证据显示任何具名合作伙伴已经从合作和验证措辞，走到披露商业化产量或重复购买行为。因此，本章可以支撑渠道相关性和按作物划分的合作伙伴触达，但不能证明整个客户群已经具备广泛生产成熟度。
