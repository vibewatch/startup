            body: >-
              Pairwise 是最清晰的证据，说明 Inari 并不是唯一在推销伙伴优先的基因编辑平台。其 Fulcrum 系统结合 CRISPR、AI 和植物生物学；公司声称已编辑 15 种作物、拥有 81
              个潜在产品，并在目标改良上达到 72% 成功率。但同一组来源也说明为什么仅有平台质量不够：Pairwise 接受了 Corteva 的 $25 million
              股权投资，并进入五年期合资企业，以更快触达行作物规模。Cibus 和 Calyxt 选择合并来获得公开市场相关性；Arcadia 在保留少量农艺性状残余的同时转向健康产品；Yield10 在退市和 Chapter
              11 后以资产出售给 Nufarm 收场；Benson Hill 的资产则在破产后延续到 Confluence。这些案例并不否定 Inari
              模式，但提醒我们：资本需求、上市路径摩擦或等待大面积商业证明的漫长周期，仍可能压过技术差异化。
