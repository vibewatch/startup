        - label: 3. 与伙伴团队做田间验证
          detail: 项目在上市决策前经过育种、试验和展示田环节
          tone: neutral
        - label: 4. 伙伴产品组合决策
          detail: 种子公司产品团队决定 Inari 加持材料是否进入品牌上市规划
          tone: risk
        - label: 5. 种植者购买与农场表现
          detail: 农户采用取决于本地农艺、已证明的利润改善，以及伙伴销售执行
          tone: neutral
        - label: 6. 复购与扩张
          detail: 只有结果足以支撑重复投放，并扩展到更多地理市场或作物，耐久性才成立
          tone: risk
    approximationNotes: 这是一张结构性客户旅程图，不是已测量的账户漏斗。公开记录披露阶段和依赖项，比披露转化率更清楚。
    claimRefs:
      - CU001
      - CU002
      - CU020
      - CU025
      - CU026
      - CU027
      - CU039
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 这条公开证据漏斗从广泛伙伴集合收窄到更少项目；后者有明确商业化就绪表述，或详细田间验证证明。
    data:
      items:
        - label: 客户集合中公开具名交易对手
          value: 6
        - label: 具名地理市场的特定作物项目
          value: 5
        - label: 明确产量或农户价值目标的项目
          value: 4
        - label: 有伙伴引语或直接外部背书的项目
          value: 4
        - label: 田间验证细节超出上市 PR 的项目
          value: 2
        - label: 明确使用可商业化表述的项目
          value: 1
    approximationNotes: 数值统计的是公开证明面，不是客户、收入或种植面积。该图旨在显示证据如何从许多关系，收窄到极少数接近上市的主张。
    claimRefs:
      - CU003
      - CU005
      - CU011
      - CU013
      - CU014
      - CU015
      - CU021
      - CU022
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 按部署阶段、证据质量、种植者连接和留存可见度比较具名交易对手。
    data:
      columns:
        - 部署阶段
        - 证据质量
        - 种植者连接
        - 留存可见度
        - 关键不确定性
      rows:
        - label: M.S. Technologies
          values:
            - 商业化前上市路径
            - 高——客户专题加合作报道
            - 明确说明直达美国农户路径
            - 低
            - 未披露付费种植面积和复购
        - label: Beck's
          values:
            - 测试与渠道合作
            - 中高——官方信息加 PRNewswire 佐证
            - 强调直达美国农户入口
            - 低
            - 没有公开商业规模证明
        - label: InterGrain
          values:
            - 验证阶段小麦项目
            - 高——官方、伙伴和行业报道佐证
            - 说明直达澳大利亚种植者价值主张
            - 低
            - 未披露上市时间或商业种植面积
        - label: Eden Enterprise
          values:
            - 育种入口合作
            - 中——单一来源证明
            - 通过 Stine 育种基础间接触达
            - 低
            - 未发现佐证上市或田间更新的来源
        - label: Iowa Soybean Research Center
          values:
            - 研究和顾问合作
            - 中——官方机构来源
            - 通过 checkoff 和大学网络靠近农户
            - 低
            - 不是生产型客户关系
        - label: 未具名种子公司展示客户
          values:
            - 展示田
            - 中——独立 AgFunder 引语
            - 间接，未具名
            - 低
            - 交易对手名称和转化率未披露
    approximationNotes: 证据质量和留存可见度是评估者基于具体程度、佐证情况，以及来源是否披露商业跟进作出的判断。
    claimRefs:
      - CU005
      - CU006
      - CU011
      - CU015
      - CU021
      - CU022
      - CU023
      - CU024
      - CU028
