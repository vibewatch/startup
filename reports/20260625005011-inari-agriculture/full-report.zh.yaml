      - number: '5.3'
        title: 作物管线与产品运营
        blocks:
          - type: paragraph
            body: >-
              公开作物成熟度不均衡，但确实存在。大豆看起来最靠前，因为 Inari 把 High Yield Designs for Soybeans 称为首个商业就绪方案，关于页面也称这些设计已在 2025
              年夏天覆盖美国所有种植区域试验。小麦落后于大豆，但已超过纯概念阶段：InterGrain 称其正在澳大利亚田间测试中评估 Inari 的初始编辑设计，最初发布公告还把合作目标设定为小麦增产 10–15%
              并提升投入效率。玉米看起来比大豆更早期，因为公开证据集中在育种项目准入和伙伴 R&D 扩张，而不是已命名的商业就绪发布里程碑。


              West Lafayette 是把平台输出转化为产品候选的核心。独立报道和公司地点材料把 Indiana 站点描述为产品开发、田间评估和商业运营枢纽，而 Cambridge 和 Ghent
              更偏发现和建模。2024 年扩张新增 42,000-square-foot 设施，并使温室空间增加一倍以上，这是验证吞吐、种子扩繁和处理更多作物品种的有意义规模信号。不过，这不能证明 Inari
              已垂直整合种子制造，或在自有控制下拥有大规模商业英亩。运营设计仍由伙伴协助：Inari 可以加快设计和验证，但作物发布仍取决于种质提供者、本地育种者、监管节奏和伙伴向田间分销的能力。
