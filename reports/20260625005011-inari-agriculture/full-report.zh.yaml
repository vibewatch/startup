      - number: '2.2'
        title: 规模测算视角、采用基础，以及为什么单一 TAM 会误导
        blocks:
          - type: paragraph
            body: >-
              公开来源支持一个很大的市场背景，但不足以为 Inari 给出一个精确 TAM。广义商业种子出版商把 2026 年品类规模放在约 USD 101–103 billion，较窄的 GM 种子估算接近 USD 27
              billion，基因编辑汇总则更小但增速更快。这些数字只有按范围拆开才有用。Inari 当前机会不是整个商业种子市场，因为其中包括蔬菜、特种作物和第一波重点之外的常规种子池。它也不是完整 GM
              市场，因为部分现任性状池和地区在结构上很难触达。更好的方法是多镜头：先从广义品类天花板出发，再按作物组合、采用基础和实际种植英亩收窄。仅 USDA 2026 年展望就指向美国玉米、大豆和小麦合计 224
              million 种植英亩，说明大面积作物为什么重要。即便如此，已审阅来源没有隔离出其中到底多少英亩能被 Inari 的伙伴模式触达，因此清晰的 SAM 或 SOM 仍未解决，并应在分析中保持未解决状态。
