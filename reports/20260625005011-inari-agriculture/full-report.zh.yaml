chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、布局与商业模式
        blocks:
          - type: paragraph
            body: >-
              Inari Agriculture 的核心身份，在官方材料和创立叙事中异常一致。公司称其由 Flagship Pioneering 于 2016 年创立，2018
              年从孵化体系中公开亮相，建设的是种子技术业务，而不是垂直整合的作物投入品品牌。官方关于页面、融资材料和 Flagship 发布材料都描述同一套技术栈：AI 驱动的 SEEDesign
              平台，把基因组学、预测设计和多重基因编辑结合起来，创造表现更好的大田作物种子。这一定位很关键：后续章节应把 Inari 视为平台公司，其经济逻辑取决于与种子公司合作，而不是替代它们。


              公司的地域布局也足够清晰，可作为本报告其余部分的事实基准。Cambridge, Massachusetts 是全球总部和平台中心；West Lafayette, Indiana
              是位于美国玉米和大豆带的产品开发与商业枢纽；Ghent, Belgium 支撑建模、原型和研究。官方页面描述了两大洲的三个站点；当前地点页面显示员工 200+，而 2024–2025 年新闻稿仍称公司拥有超过
              300 名员工。这个差距是真实的尽调信号，不只是四舍五入问题；把 2026 年重组纳入后尤其如此。
