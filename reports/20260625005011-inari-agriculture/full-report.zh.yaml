      - number: '8.5'
        title: 建议：research-more / 在公司证明变现而不只是能力之前，估值偏紧
        blocks:
          - type: paragraph
            body: >-
              以 2025 年 1 月披露价格为基准，我的建议是 research-more，置信度中等，风险高，估值姿态偏紧。基准情景不是 Inari
              是一家弱公司；证据指向一个严肃平台、可信背书和真实产品进展。问题在于价格敏感度。如果合作伙伴牵头的上市转化为可见的重复经济性，且公司穿过诉讼和验证而没有实质侵蚀，多十亿美元估值可以被证明合理。但今天的公开记录迫使承保过度依赖信念：没有披露收入
              run rate、没有毛利率、没有合同结构、没有清算优先权栈，也没有裁员后的现金
              runway。因此，我的情景区间仍锚定里程碑逻辑，而不是虚构的倍数计算。熊市区间假设进一步滑延或法律摩擦把公司推近重置轮；基准区间假设出现首次变现但透明度仍有限；牛市区间假设可信的上市转化、经济性披露和持久战略背书。这个框架为未来强劲业务结果留出空间，但并不支持在今天最后报告估值上给出有信心的买入判断。
