      - number: '8.2'
        title: 投资人组合是正面信号，但仍是信号而非证明
        blocks:
          - type: paragraph
            body: >-
              2025 年这一轮强于普通的内部领投过桥。Inari 称，大部分资金来自新投资者，包括 Abu Dhabi Investment Authority 的一家全资子公司；现有投资者 Hanwha
              Impact、NGS Super、State of Michigan Retirement System 和 Flagship Pioneering
              也参与了本轮。这个组合重要，因为它说明本轮吸引的是长久期机构和回归支持者，而不只是动量资本。NGS Super
              自己的网站明确强调为退休结果进行有纪律的长期投资，这与耐心资本行为一致。即便如此，投资人质量不应被误认为估值验证。当一个品类具有战略稀缺性，而一家公司看起来是少数具备规模的私有选项之一时，强配置者也可能付高价。更站得住的解读更窄：Series
              G 表明，经历多轮融资和近商业化主张之后，Inari
              仍能接入大规模资本池，这降低了近端融资压力，也支撑了一个论点——成熟投资人仍看见平台期权价值。但它没有回答当前价格是否已经充分折现诉讼、验证时间线，或那些仍缺失的合同经济性；这些经济性才让外部人区分伟大平台和伟大生意。
