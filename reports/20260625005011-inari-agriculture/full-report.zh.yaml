      - number: '5.4'
        title: IP 地位与监管适配
        blocks:
          - type: paragraph
            body: >-
              Inari 的产品差异化主张不只是“我们使用 CRISPR”。公开材料强调的是更宽的栈：前端预测设计、中段多重编辑，以及围绕递送方法、guide-RNA 移动、调控序列优化和编辑 GM
              性状打包而扩展的专利资产。2022 年 GM 性状公告尤其值得注意，因为 Inari 声称拥有成熟玉米和大豆 GM 性状编辑版本的专利，并称其自有 CRISPR-CasS
              系统使其可绕开第三方专利丛林。独立专利列表不能验证实施自由，但确实显示 2024 至 2026 年之间，机器学习引导调控序列设计、根介导 guide-RNA
              递送、植物生殖系编辑、递送化学和其他植物编辑方法等多个专利族真实分布。这个广度说明 Inari 试图掌握工作流杠杆点，而不是只押注一个作物性状。


              监管适配也比许多生物技术初创公司更强。APHIS 表示，Inari 用于增强产量和植株结构的基因工程大豆不受 7 CFR part 340 约束；另一封 APHIS 信函称，Inari 经 CRISPR
              编辑、产量提高且结构改变的小麦品系，在植物害虫载体序列被育种剔除后，不属于 part 340 下的受监管物。CRS 材料进一步说明，基因编辑作物已经可以在美国 USDA/FDA/EPA 协同框架下商业化。但“不受
              APHIS 监管”不等于“没有剩余监管工作”。两封 APHIS 信都明确指出可能存在 EPA、FDA 和检疫权限；国际发布仍取决于本地规则，例如 InterGrain 提到的澳大利亚框架。
