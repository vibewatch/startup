  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 买方、用户、付款方与渠道设计
        blocks:
          - type: paragraph
            body: >-
              理解 Inari
              的客户模型，最合适的视角不是直面种植者的种子品牌，而是一套分层渠道。公司反复强调，它支持种子公司客户，而不是与其竞争；其解决方案页面也把产品表述为智能设计，帮助合作伙伴扩充自己的产品组合。这种措辞很关键，因为它说明谁才是第一层买方：种子公司和育种伙伴看起来是直接商业对手方，种植者则要等到带有合作伙伴品牌的产品进入农场后，才成为最终用户和付款方。公开记录没有显示
              Inari 运营自有品牌零售种子目录，也没有显示它拥有直接面向农户的销售团队。公司看起来是在把验证结果、设计能力，以及由种质支撑的产品潜力，卖进既有种子渠道。

              这种结构既带来杠杆，也带来依赖。杠杆很清楚：Inari
              不必从零搭建全国性的种子交付体系，就能接触精英育种项目、地方农艺团队和成熟分销网络。依赖同样重要。如果合作伙伴的育种团队、目录经理或地方农艺师不决定推进这些产品，Inari
              就没有直接路径推动下游采用。因此，转换成本沉淀在共享田间数据、种质整合和上市规划里，而不是软件锁定里。对种植者而言，真正的采用门槛不是他们是否知道 Inari
              这个名字，而是合作伙伴品牌的种子能否稳定提升利润率，从而在普通季节性采购决策中反复赢得田块位置。
