      - number: '2.3'
        title: 买方、用户、付款方与渠道经济性
        blocks:
          - type: paragraph
            body: >-
              Inari 的商业化路径看起来先是 B2B，再间接触达农场。第一买方通常是种子公司、育种伙伴或种质所有者，它们能评估设计、跑田间测试，最终把产品放进品牌种子目录。Beck’s
              等零售渠道很重要，因为它们贴近种植者，掌握本地信任、农艺支持和种子复购经济性。终端用户仍是种植者，因为农场表现决定一个设计下季能否拿到英亩；但种植者不一定是最先向 Inari
              付款的人。公开材料反而指向农场门口上游的授权、合作或伙伴开发安排。这很关键，因为采用节奏由伙伴验证周期决定，而不只是农户对基因编辑的好奇心。伙伴组合也解释了 Inari
              为什么聚焦玉米、大豆和小麦：这些作物英亩巨大、现任渠道密集，且毛利池足够大，差异化遗传才有意义。缺失的仍是价格透明度——公开证据没有显示版税分成、转让定价，或 Inari 与各渠道伙伴之间的确切经济交易。
