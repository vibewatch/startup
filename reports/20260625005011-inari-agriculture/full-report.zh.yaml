      - number: '1.3'
        title: 资本基础、估值信号与利益相关方
        blocks:
          - type: paragraph
            body: >-
              Inari 在出现可见收入规模的商业发布前，已经达到后期私营公司的资本体量。官方 2025 年 1 月新闻稿确认融资 $144 million，累计股权融资超过 $720 million；多家独立媒体把该事件称为
              Series G 轮。这些第三方报道还一致指向约 $2.17 billion 的投后估值，高于一年前约 $1.65 billion，为投资者提供了具体但仍属二级来源的估值信号。2025
              年轮次的投资者名单具有战略意义：Abu Dhabi Investment Authority 的全资子公司入股，Hanwha Impact、NGS Super、State of Michigan
              Retirement System 和创始方 Flagship Pioneering 继续支持。


              资本故事很强，但披露在尽调读者最需要精度的地方仍像私营公司一样薄。为本章审阅的官方来源没有披露当前收入、收入运行率或活跃客户总数。员工数披露也不一致：2024–2025 年新闻稿反复称超过 300 名员工，但
              2026 年地点页面写的是 200+，2026 年裁员记录也说明团队已经重置。因此，投资者有可信证据证明融资深度和股东方质量，却只能部分看见能证明资本转化为商业化效率的运营指标。
