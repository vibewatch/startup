  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：Inari 最接近平台型同行，但竞争发生在现任巨头控制的市场里
        blocks:
          - type: paragraph
            body: >-
              保留下来的证据指向一个分层竞争集，而不是单一干净的可比公司组。Inari 把自己呈现为 AI 驱动的 SEEDesign 平台，结合基因组学、人工智能和基因编辑，改良大豆、小麦等大田作物。这使 Pairwise
              成为最近的平台类比对象，因为它也围绕 CRISPR 工具、作物设计和授权来定位，而不是围绕单一种子品牌。但商业战场仍由 Bayer、Corteva 和 Syngenta
              定义；它们已经在同一批行作物品类中运营全球育种、性状、田间试验和农户分销系统。Cibus/Calyxt、Arcadia、Yield10 和 Benson Hill
              等公开市场同行构成第三层：技术上可信的创新者，仍不得不通过合并、重组、资产出售或战略收窄来继续前进。结果是，Inari 必须证明设计速度和伙伴友好性能压过现任者已经装好的商业机器。
