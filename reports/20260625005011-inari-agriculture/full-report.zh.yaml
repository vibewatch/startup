      - number: '6.3'
        title: 采用轨迹与商业化运营
        blocks:
          - type: paragraph
            body: >-
              公开来源中能看到的采用轨迹，更适合解读为从育种接入走向上市就绪的分阶段搭建，而不是一条已披露的已签约收入曲线。时间线从 2021 年开始，当时 Inari 公布了玉米和大豆领域的种子公司合作。2022
              年范围扩展到澳大利亚小麦；到 2024 年，公司开始谈到第一批基因编辑小麦品系，并在 West Lafayette 进行一次面向产品开发和商业运营的重大扩建。2025 年 1
              月的融资公告进一步收紧了商业化叙事，提到第一代产品表现、商业化进展，以及美国内外种子公司的兴奋反馈。AgFunder 补充了一个重要的独立细节：Inari 正在与种子公司客户合作建设示范田。

              2025 年，公司还通过聘任首席商务官来领导全球商业战略并推动收入，做出了一次清晰的组织调整。这本身不能证明客户转化，但符合一家试图把按作物划分的研发项目转成合作伙伴可接入商业动作的公司。West
              Lafayette 也强化了同一点。多方来源把该基地描述为产品开发和商业运营所在地，并称 2024 年扩建旨在扩大面向种子客户的交付能力。合在一起，这些事实支撑一条商业化就绪叙事：Inari
              已经不只是公告阶段的科学成果，它拥有具名对手方、运营建设和一位资深 GTM 招聘。但证据仍止步于投资人通常会要求的采用指标之前，例如付费合作伙伴数量、面积、销售单位，或从示范田转为重复商业化投放的转化。
