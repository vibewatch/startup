      - number: '1.4'
        title: 平台、作物重点与商业化姿态
        blocks:
          - type: paragraph
            body: >-
              技术和作物记录已经足够界定 Inari 想卖什么，尽管硬性的客户指标仍未公开。官方页面、白皮书材料和行业报道反复把 SEEDesign 平台描述为 AI
              驱动预测设计与多重基因编辑的结合，应用于大田作物。第一波作物是大豆、玉米和小麦。最具体的官方近期产品表述聚焦大豆：解决方案页面称首个商业就绪方案是面向大豆的 High Yield Design，并设定至少
              +7.5% 产量潜力的目标；关于页面历史则称这些大豆设计已在 2025 年夏天覆盖美国所有种植区域试验。


              玉米和小麦不是投机性的相邻赛道，而是同一条已验证运营叙事的一部分。公司提到与 InterGrain
              的小麦合作，目标是在澳大利亚开发更高产小麦；公开专利线索也显示小麦、玉米和大豆编辑仍在推进。这些项目之下的商业模式明确以伙伴为导向。Inari
              及其支持者描述的是资产较轻的模式，旨在支持种子公司及其农户客户，而不是以品牌种子巨头身份正面竞争。这样可以降低渠道冲突，也解释了为什么种质获取、伙伴验证和 IP 策略是核心里程碑，而不是旁枝末节。
