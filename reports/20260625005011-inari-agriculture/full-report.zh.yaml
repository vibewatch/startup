  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Inari 的产品最好理解为面向伙伴的作物设计系统，而不是直接面向农户的种子品牌。在 SEEDesign™ 平台页面、解决方案页面和公司关于页面中，Inari
              始终把自己表述为给伙伴创造智能设计的公司，再把这些设计推入精英种质和伙伴组合。于是，商业对象不像一张独立软件许可，更像一套设计加验证的工作流，帮助种子公司改良自有品牌产品。最清晰的产品化产品是 High
              Yield Designs for Soybeans；Inari 称这是其首个商业就绪方案，并围绕至少提升 7.5% 产量潜力进行营销。关于页面里程碑还显示，项目从 2022 年夏天首批种子公司伙伴示范，推进到
              2025 年夏天覆盖美国所有主要种植区域的商业就绪大豆试验。


              公开证据所暗示的工作流是一致的。Inari 先从预测设计层开始，进行多重编辑，通过温室和田间工作验证结果，再依靠种子公司伙伴提供种质获取、本地育种整合和下游农户交付。与 Beck’s、Mertec/M.S.
              Technologies、Eden Enterprise 和 InterGrain 的公开伙伴公告进一步证明，客户首先主要是育种者或种子公司，农户只是通过伙伴渠道间接触达。这个结构很可能降低 Inari
              建立自有零售种子组织的必要性，但也意味着产品成功取决于伙伴采用、伙伴种质质量，以及伙伴在商业规模发布编辑设计的意愿。
