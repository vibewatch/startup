      - number: '5.2'
        title: 平台架构与数据栈
        blocks:
          - type: paragraph
            body: >-
              准确的公开品牌名是 SEEDesign™。更重要的是，Inari 给出的细节足以推断出一套具体架构，而不是泛泛的“AI + 生物学”口号。平台页面把系统拆成三个命名模块：Predictive Design
              Engine、Gene Editing Toolbox 和 Design Blueprints。Inari 称 Predictive Design Engine
              结合机器学习和基因组科学，选择结果可预测的编辑；Gene Editing Toolbox 同时执行多重编辑和多种编辑类型；Design Blueprints
              再把这些编辑设计应用到选定作物品种，并把实验室、温室和田间观察反馈回平台。整体循环是从序列到表型到田间再返回，这比简单声称在工作流某处使用 AI 更像技术描述。


              开发者信号证据在这里也重要，因为它显示平台并非纯概念。Inari 的招聘页面把建模、原型和研究放在 Ghent，并公开强调计算生物学人才；第三方计算生物学研究助理职位描述则提到跨
              Amp-Seq、转录组学、蛋白质组学、表观基因组学、结构变异的生物信息管线，以及 Nextflow、AWS、Docker 和 Jupyter
              等工具。这没有揭示专有架构、模型表现或编辑命中率。但它独立支持了这一点：Inari 正在建设多组学和软件密集型运营栈，而不只是做湿实验室基因编辑。关键 caveat
              是，这里的多数性能语言仍来自公司主张；未检索到的来源没有独立对标其预测准确率、编辑效率或性状转化率相对同行的表现。
