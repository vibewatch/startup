  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Inari 的正确市场框架不是“整个农业”，甚至也不是“整个作物生物技术”。Inari
              试图在玉米、大豆和小麦的行作物种子栈中创造价值；在这套栈里，育种者、种质所有者、种子零售商和种植者共同决定哪些遗传组合能拿到英亩并带来复购。因此，纳入的支出首先是品牌商业种子、嵌入式性状价值、育种准入和伙伴主导的商业化工作。作物保护化学品、肥料、灌溉硬件、商品粮贸易和其余农资支出不应纳入，除非这些预算扮演更好遗传方案的替代品。现状很强：现任种子平台已经把种质、性状栈、田间支持和渠道信任打包在一起。常规育种和农艺干预也仍是真实替代方案，尤其当买方偏好更低监管风险，或还没有看到足够第三方证据证明基因编辑收益能跨环境持续时。于是，Inari
              的挑战是替换既有可信决策模式，而不只是进入一个空白品类。
