  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管不对称与市场准入风险
        blocks:
          - type: paragraph
            body: >-
              Inari 的核心承诺是，多重基因编辑可以比传统育种更快，但监管环境不会以同样速度移动。在美国，基因编辑作物仍处在 USDA-FDA-EPA 协调框架内；CRS 指出，SECURE 规则在 2024
              年末被前瞻性撤销后，APHIS 已回到 2020 年前的 Part 340
              制度。这不意味着商业化停止；它意味着开发者重新面对一条不那么稳定的审批路径，尤其当编辑、田间转移或进出口事实无法落入最简单的豁免叙事时。EPA
              也简化了一些植物内置保护剂豁免，但只限窄类目，因此即使产量或品质编辑无需审查，抗虫保护性状仍可能触发机构审查。对 Inari
              这类通过合作伙伴销售、而非直接推出自有品牌种子的公司而言，监管摩擦可能叠加放大，因为每次上市不仅要对 Inari 成立，也要对合作伙伴自己的合规、管护和渠道经济性成立。


              国际图景更难。Frontiers 和 MoFo 都描述了一个碎片化的全球制度：美国及许多非欧盟司法辖区更偏产品或风险导向，而欧洲历史上把基因组编辑生物更接近 GMO 对待，直到最近才开始走向差异化 NGT
              框架。即使方向变得更宽松，公共数据库、种子标签、分离管理或逐国落地仍可能增加成本和延迟。Inari 自己的 InterGrain
              新闻稿明确称，澳大利亚小麦项目必须满足当地监管要求，这提醒大田作物开发者，不会拿到一次全球通行许可。风险不是基因编辑到处被禁；风险是错峰规则、文件负担和可追溯预期把合作伙伴上市拖慢到足以削弱 Inari
              更快设计周期的价值。
