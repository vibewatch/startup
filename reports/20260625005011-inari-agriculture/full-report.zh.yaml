      - number: '4.2'
        title: 定价与单位经济性不透明
        blocks:
          - type: paragraph
            body: >-
              财务问题不是缺少战略叙事，而是缺少已披露的单位经济性。在已检索的官方页面、融资公告、行业报道和法律材料中，Inari
              没有公布收入、ARR、价格表、版税、里程碑、客户数、毛利率、CAC、回本期或现金转化指标。解决方案页面通过宣传大豆产量潜力最低提升 7.5%、并承诺覆盖价值链的 ROI，把商业主张变得具体；但它仍没有说明
              Inari 如何通过合同捕获这部分价值。即便是最强的商业化更新——任命首席商务官来推动收入增长和上市扩张——也只是传递意图，而不是经济性。


              这很重要，因为基因编辑种子业务看起来可以资产较轻，但在规模化前仍背负真实成本。投资者要判断伙伴主导收入能否变成高质量、可重复的经济性之前，Inari
              必须先资助预测设计、基因编辑流程、田间验证、伙伴支持、监管工作和商业组织搭建。因此，公开记录只支持一个较窄结论：有商业进展和价值主张的证据，但几乎没有已实现变现或效率证据。本章把这些缺失指标视为尽调阻塞项，而不是零，也不是隐含的
              SaaS 式经济性。
