        - 用来检验估值标记是否建立在真实变现上
        - 管理层财务模型和董事会材料
      - - 合同经济性
        - 最低承诺、定价公式、版税率和终止权
        - 决定伙伴主导模式的耐久性和利润潜力
        - 商业合同和律师审阅
      - - Series G 条款
        - 清算优先权、参与权、ratchet 和治理 side letter
        - 没有条款，headline post-money 可能夸大普通股价值
        - 领投方律师和融资 data room
      - - 裁员后的 runway
        - 现金、烧钱、2026-2027 年招聘计划，以及人员重置对作物时间表的影响
        - 检验成本动作是主动还是被动
        - 财务团队、运营计划和工厂 / 场地审查
      - - 诉讼敞口
        - 最好 / 最坏法律结果、准备金假设和绕行选项
        - 直接影响退出准备度和估值下行
        - 外部 IP 律师和案件备忘录
      - - 发布转化
