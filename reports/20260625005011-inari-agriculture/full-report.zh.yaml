      - number: '2.4'
        title: 增长驱动、采用约束与保留尽调缺口
        blocks:
          - type: paragraph
            body: >-
              更好的行作物种子的需求逻辑很强，但采用路径并不顺滑。积极一面，USDA、FAPRI 和 Seed World
              都指向同一个世界：未来产量增长更多依靠单产提升、韧性和效率，而不是简单扩大面积。生物燃料政策也相关：生物质柴油目标拉动油籽体系，使大豆压榨和豆油需求增长；玉米仍与饲料和乙醇需求绑定。这些结构性压力会让表现更好的遗传方案变得有价值。反面是，Inari
              面临多重约束。行作物生物技术已经成熟，美国玉米和大豆英亩绝大多数已经工程化且性状日益叠加，所以买方会把新性状与强大的现任基线比较。监管负担不均衡：EPA 为部分植物内置保护剂建立了豁免，但 USDA 在
              SECURE 之后的不确定性仍让流程风险存在。IP 集中和诉讼也重要；科学现实同样重要，干旱和气候韧性性状必须在异质环境和管理体系中证明自己。因此，本章支持真实市场需求，同时保留关于定价、本地田间证明和
              Inari 特定触达能力的未解问题。
