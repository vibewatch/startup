      - number: '7.2'
        title: 诉讼、IP 与集中度风险
        blocks:
          - type: paragraph
            body: >-
              最尖锐的公司特定外部风险是 Corteva 诉讼。公开案卷材料显示，该案自 2023 年以来一直推进；截至 Murphy 法官 2026 年 3 月 2 日备忘录，案件正进入专家发现和即决动议阶段，审判日期定为
              2026 年 9 月 23 日。这不是一桩无关痛痒的投诉。Corteva 指称 Inari 利用寄存种子技术和重叠的专利 / PVP 权利进入市场；Inari 则主张，接触已获专利的生物材料是后续创新所必需，层叠
              IP 权利也可能被用于反竞争。法院已经驳回 Inari 的部分专利滥用和虚假诉讼理论，同时允许包括不洁之手在内的其他抗辩继续推进。这留下了有意义的法律不确定性，也没有给 Inari 一个干净的程序性逃生口。


              2026 年 5 月 DOJ
              提交的利益声明进一步抬高了赌注，因为它把该案放在种子行业高集中度和高进入壁垒下的竞争问题中理解。这种措辞解释了为什么这里的诉讼风险是战略性的，而不只是法律费用。如果合作伙伴、投资人或潜在收购方认为，围绕精英种质、寄存材料或层叠
              IP 权利的自由实施空间比预期更窄，商业化时间线和议价能力可能在最终判决前就已恶化。Inari 也营销自己的深厚 IP
              组合和专有工具箱，这对进攻和防守都有用，但在由资本更雄厚的在位者主导的集中行业里，也提高了相互争议的概率。因此，剩余暴露不只是赔偿金，而是上市延迟、合作伙伴犹豫，以及市场对一个仍依赖第三方渠道变现的业务给出更高折现率。
