        title: 资本强度与商业化风险
        blocks:
          - type: paragraph
            body: >-
              更广泛的种子和基因编辑背景，不支持把 Inari 当作便宜扩张的软件故事。CRS 和 USDA 材料显示，基因编辑作物可以在美国规则下商业化，但仍处于 USDA、FDA 和 EPA
              协同监管之下，并且必须通过田间验证、市场准入和客户采用。Seed World 的 2026 年商业化分析尤其重要：编辑可以很快，但多季验证、区域测试和价值链协调仍需要数年。这与 Inari 自身从 2022
              年示范田到 2025 年商业就绪大豆试验的路径一致，而不是立即大范围发布。


              现任者经济性进一步强化了资本负担。Corteva 2025 年 10-K 称，生物技术种子产品的监管审批漫长、昂贵且复杂；其 2025 年 capex 为 $591 million，并预计 2026 年约
              $600 million。Bayer Crop Science 报告 2025 年调整后 R&D 费用为 €2.013 billion，与现金流相关的资本支出为 €1.009 billion。Inari 不需要
              Bayer 或 Corteva 级别资产来证明模式，但这些数字提醒我们，商业规模的作物创新仍然昂贵。Pairwise 获 Corteva 支持的合资企业和 Benson Hill 的 Chapter 11
              申请显示了同一枚硬币的两面：基因编辑的战略需求真实存在，但融资和执行风险依旧严苛。
