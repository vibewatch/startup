  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: customer-count-opacity
      missingEvidence: Active paid-customer count, named revenue-generating partners, and acreage or unit metrics by crop and geography.
      whyItMatters: Without basic customer-count and utilization data, the chapter cannot separate early commercial traction from broad market adoption.
      diligencePath: Request a partner pipeline table showing active paid programs, acreage under evaluation, and seasonal volume or royalty metrics.
      relatedQuestionRefs:
        - QU013
        - QU014
      relatedTableRefs:
        - TU002
    - type: enumeration-incomplete
      severity: material
      topic: production-proof-gap
      missingEvidence: Stage-by-stage status for each named partner showing collaboration, trial, pilot, commercial launch, and repeat-season progression.
      whyItMatters: The public record proves named relationships, but only soybeans have explicit commercial-ready wording and only wheat has later field-validation detail.
      diligencePath: Obtain a commercialization-stage matrix from management for each crop partner, including the last completed milestone and next gate.
      relatedQuestionRefs:
        - QU011
      relatedTableRefs:
        - TU003
    - type: private-evidence-only
      severity: material
      topic: retention-opacity
      missingEvidence: Renewal rates, contract duration, grower repurchase rates, satisfaction metrics, and referenceable customer outcomes.
      whyItMatters: Durability is the key difference between credible partner logos and an underwritable customer base.
      diligencePath: Request contract templates, renewal history, repurchase data by season, and at least two reference calls with partner product or breeding leaders.
      relatedQuestionRefs:
        - QU015
        - QU016
        - QU026
      relatedTableRefs:
        - TU004
    - type: private-evidence-only
      severity: material
      topic: concentration-opacity
      missingEvidence: Top-partner revenue share, crop mix by revenue, and any exclusivity or minimum-commitment terms.
      whyItMatters: A small visible partner set could imply high concentration risk, but the public record cannot size that dependence.
      diligencePath: Request partner concentration analysis by revenue, crop, and geography plus any exclusivity, territory, or termination provisions.
      relatedQuestionRefs:
        - QU019
        - QU020
        - QU028
      relatedTableRefs:
        - TU005
