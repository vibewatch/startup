  - id: adoption-trajectory-and-commercial-ops
    title: Adoption trajectory and commercial operations
    body: >-
      The adoption trajectory visible in public sources is best read as a
      staged build-out from breeding access toward launch readiness, not as a
      disclosed booked-revenue curve. The timeline starts in 2021, when Inari
      publicized seed-company collaborations in corn and soy. It broadened to
      Australian wheat in 2022, then by 2024 was talking about first
      gene-edited wheat lines and a major West Lafayette expansion dedicated to
      product development and commercial operations. The January 2025 financing
      announcement tightened the commercialization message further by citing
      first-generation product performance, progress toward commercialization,
      and excitement from seed companies in and outside the United States.
      AgFunder added an important independent detail: Inari was working with
      seed-company customers in demonstration plots.

      The company also made a clear organizational move in 2025 by hiring a
      chief commercial officer to lead global commercial strategy and drive
      revenue. That does not prove customer conversion by itself, but it is
      consistent with a company trying to turn crop-specific R&D programs into
      partner-ready commercial motion. West Lafayette reinforces the same point.
      Multiple sources describe the site as home to product development and
      commercial operations and say the 2024 expansion was meant to scale
      delivery to seed customers. Together, those facts support a
      commercialization-readiness story: Inari has more than announcement-stage
      science, named counterparties, operational build-out, and a senior GTM
      hire. But the evidence still stops short of the adoption metrics
      investors would normally want, such as paid partner count, acreage, units
      sold, or conversion from demonstration plot to recurring commercial
      placement.
    claimRefs:
      - CU014
      - CU015
      - CU017
      - CU018
      - CU019
      - CU037
