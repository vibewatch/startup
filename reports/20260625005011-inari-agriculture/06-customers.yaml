company:
  name: Inari Agriculture
chapter:
  number: 6
  title: Customers
  summary: >-
    Inari's public customer evidence supports a partner-led row-crop seed model
    in which seed companies are the buyer and first payer, growers are the end
    user, and crop-specific collaborators supply germplasm, breeding reach, and
    local channels. The strongest proof is in soybeans, where Inari calls its
    first solution commercial-ready and names M.S. Technologies as the first
    route to U.S. farmers, while corn and wheat remain collaboration-heavy with
    weaker production proof. Customer durability and concentration remain the
    key gaps: public sources still do not disclose paid-customer count, acreage,
    renewals, contract length, or partner revenue mix, while 2026 layoffs and
    industry commentary reinforce that commercialization cycles can stay long
    even when the science is moving quickly.
sections:
  - id: buyer-user-payer-and-channel-design
    title: Buyer, user, payer, and channel design
    body: >-
      Inari's customer model is best understood as a layered channel rather than
      a direct-to-grower seed brand. The company repeatedly says it supports,
      not rivals, seed-company customers, and its solutions page frames the
      offer as intelligent designs that help partners expand their own
      portfolios. That language matters because it clarifies who actually buys
      first: seed companies and breeding partners appear to be the immediate
      commercial counterparties, while growers are the eventual users and payers
      only after partner-branded products reach the farm. The public record does
      not show Inari running a branded retail seed catalog or a direct farmer
      salesforce. Instead, the company appears to sell proof, design capability,
      and germplasm-enabled product potential into existing seed channels.

      That structure creates both leverage and dependency. The leverage is
      obvious: Inari can access elite breeding programs, local agronomy teams,
      and established distribution without building a nationwide seed-delivery
      stack from scratch. The dependency is just as important. If partner
      breeding teams, catalog managers, or local agronomists do not decide the
      products are worth advancing, Inari has no direct path to force adoption
      downstream. Switching costs therefore accumulate in shared field data,
      germplasm integration, and launch planning rather than in software
      lock-in. For growers, the real adoption hurdle is not whether they know
      Inari's name; it is whether partner-branded seed consistently improves
      margin enough to win repeat placement in ordinary seasonal purchasing
      decisions.
    claimRefs:
      - CU001
      - CU002
      - CU020
      - CU025
