callouts:
  - calloutType: strength
    title: Inari has real channel proof across three major row-crop lanes
    body: The public record shows crop-specific counterparties in soy, corn, and wheat, plus a research-network foothold in Iowa and an Australian wheat partner. That is materially stronger than a generic "we work with the industry" claim.
    claimRefs:
      - CU005
      - CU007
      - CU009
      - CU011
      - CU023
      - CU036
  - calloutType: risk
    title: Commercialization proof is much stronger than retention proof
    body: Named partners, demonstration plots, and a CCO hire show motion toward market, but none of the retained sources disclose renewals, paid-customer count, acreage, partner economics, or grower repurchase behavior.
    claimRefs:
      - CU015
      - CU019
      - CU028
      - CU029
      - CU038
  - calloutType: assumption
    title: Seed-company partners are the practical gating customer in the near term
    body: Growers matter economically, but the immediate yes/no decision sits with breeding teams, product managers, and partner channels that decide whether an Inari-enabled design reaches a branded portfolio at all.
    claimRefs:
      - CU001
      - CU002
      - CU020
      - CU027
