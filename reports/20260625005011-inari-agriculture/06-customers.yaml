figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: Shows how Inari moves from design and germplasm access to partner launch and eventual grower repeat purchase in a seed-company-led channel.
    data:
      nodes:
        - label: 1. Design target and crop blueprint
          detail: AI-enabled design defines a yield, resilience, or input-efficiency outcome for soy, corn, or wheat
          tone: neutral
        - label: 2. Germplasm and breeding access
          detail: Seed-company or breeding partners contribute elite germplasm and local breeding knowledge
          tone: positive
        - label: 3. Field validation with partner teams
          detail: Programs move through breeding, trials, and demonstration plots before launch decisions
          tone: neutral
        - label: 4. Partner portfolio decision
          detail: Seed-company product teams decide whether an Inari-enabled material enters branded launch planning
          tone: risk
        - label: 5. Grower purchase and on-farm performance
          detail: Farmer adoption depends on local agronomy, proven margin improvement, and partner sales execution
          tone: neutral
        - label: 6. Repeat purchase and expansion
          detail: Durability comes only if results justify repeat placement and expansion into more geographies or crops
          tone: risk
    approximationNotes: This is a structural customer journey, not a measured funnel of accounts. The public record discloses stages and dependencies more clearly than it discloses conversion rates.
    claimRefs:
