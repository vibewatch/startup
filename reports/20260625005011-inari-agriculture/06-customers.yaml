  - id: named-proof-by-crop-and-geography
    title: Named proof by crop and geography
    body: >-
      The named proof is real but uneven by crop. Soybeans have the clearest
      public evidence. Inari's solutions page says its first commercial-ready
      solution is a high-yield soybean design, describes field trials with
      partners, and spotlights M.S. Technologies as the first route for
      bringing gene-editing solutions to U.S. farmers. The older Mertec/M.S.
      Technologies collaboration adds the missing breeding-context layer by
      tying Inari into Stine's soybean program. Corn proof is earlier-stage and
      more channel-oriented: Beck's provides U.S. farmer access and testing
      capacity, while Eden Enterprise expands access to Stine's elite corn
      breeding base. Wheat proof is geographically distinct and slightly more
      development-specific. InterGrain gives Inari a route into Australian
      wheat, and by 2024 trade coverage said the partnership was already
      growing first gene-edited wheat lines at University of Western Australia
      research facilities.

      Geographically, the public footprint is therefore U.S.-centric in soy and
      corn but meaningfully extends to Australia in wheat. Iowa Soybean Research
      Center membership adds a Midwest farmer-adjacent signal because Inari is
      not just selling a platform in the abstract; it is embedding itself in an
      agronomy and research network that explicitly says it aims to create value
      for soybean farmers. What the named proof does not show is equally
      important. Outside soybeans, there is little public evidence that any
      named partner has moved from collaboration and validation language into
      disclosed commercial production volumes or repeat purchase behavior. The
      chapter can therefore underwrite channel relevance and crop-specific
      partner access, but not broad production maturity across the whole
      customer set.
