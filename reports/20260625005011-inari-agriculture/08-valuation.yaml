- id: what-would-justify-or-challenge-the-mark
  title: The mark can work, but only if milestones convert into disclosed economics and legal de-risking
  body: 'The public case for sustaining or growing the January 2025 mark is not hard to describe. Inari would need to show that first-generation product progress becomes paid commercialization: signed partner economics, recurring royalty or milestone structures, paid acreage or volume ramps, and evidence that launches in soy, corn, or wheat move beyond demonstration plots and commercial-ready trial language. Additional upside support would come from litigation de-risking, regulatory clarity, and confirmation that the workforce reset did not materially impair product timelines. The challenge case is equally clear. Public sources show a permanent 64-person Indiana layoff tied to changing business needs, ongoing Corteva litigation around patented seed access, and a sector-wide reality that faster editing does not remove multi-season validation or approval complexity. Corteva’s 10-K and Bayer’s annual report also remind investors that seed and trait commercialization remains long-cycle and expensive
    even for incumbents. Because Inari still does not disclose revenue or unit economics, I do not use revenue-multiple math here. Instead, the right framework is scenario framing around whether commercialization proof closes the gap between a strategic venture mark and an underwritten operating valuation. On the present record, too many of those proof points remain prospective.'
