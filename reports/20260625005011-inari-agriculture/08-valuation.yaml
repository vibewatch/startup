- id: TV007
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue quality
    - Booked revenue, milestones, royalties, and renewals by partner and crop
    - Needed to test whether the mark rests on real monetization
    - Management financial model and board materials
  - - Contract economics
    - Minimum commitments, pricing formulas, royalty rates, and termination rights
    - Determines durability and margin potential of partner-led model
    - Commercial contracts and counsel review
  - - Series G terms
    - Liquidation preferences, participation, ratchets, and governance side letters
    - Without terms, headline post-money can overstate common-equity value
    - Lead investor counsel and financing data room
  - - Runway after layoff
    - Cash, burn, 2026-2027 hiring plan, and effect of workforce reset on crop timelines
    - Tests whether cost actions were proactive or reactive
    - Finance team, operating plan, and plant/site review
  - - Litigation exposure
    - Best- and worst-case legal outcomes, reserve assumptions, and workaround options
    - Directly affects exit readiness and valuation downside
    - External IP counsel and case memos
  - - Launch conversion
    - Paid pilot-to-launch funnel by soybean, corn, and wheat partner
    - Key bridge between platform proof and revenue-quality proof
    - Sales ops dashboard and partner references
  notes: Every item is a must-have before underwriting the January 2025 price as investable rather than simply interesting.
