- id: comparable-set-and-market-check
  title: Public and private comparables argue for humility around the $2.17 billion mark
  body: There is no perfect public comp for Inari, which is part of the problem. Cibus is the closest listed gene-editing seed platform in the current evidence set, yet StockAnalysis showed only about $103.8 million of market capitalization and $4.29 million of trailing revenue as of June 25, 2026, while Cibus still reported large losses and depended on milestone-heavy commercialization plans. Pairwise looks strategically healthier in some ways because Corteva made a major equity investment and formed a five-year joint venture, but even Pairwise’s September 2024 round was only $40 million and total disclosed fundraising was $155 million, not an Inari-sized standalone equity mark. On the downside, Benson Hill shows how badly ag-biotech valuations can unwind when asset intensity, commercialization timing, and financing needs fall out of sync; its Chapter 11 outcome and Confluence reset are a real warning. Arcadia is not a clean gene-editing seed comp anymore, but its tiny scale, strategic-alternatives
    language, and funding need still show that the public market is unforgiving toward subscale ag-bio stories. Taken together, the comparable set does not prove Inari is overvalued. It does show that the burden of proof for a multi-billion-dollar private mark is much higher than the burden implied by public trading levels or smaller strategic financings elsewhere in the category.
