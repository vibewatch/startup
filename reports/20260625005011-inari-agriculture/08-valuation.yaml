- id: scenario-range-recommendation-and-diligence-asks
  title: 'Recommendation: research-more / stretched until the company proves monetization, not just capability'
  body: 'My recommendation at the disclosed January 2025 price is research-more, with medium confidence, high risk, and a stretched valuation stance. The base case is not that Inari is a weak company; the evidence points to a serious platform, credible backers, and genuine product progress. The problem is price sensitivity. A multi-billion-dollar valuation can be justified if partner-led launches translate into visible recurring economics and if the company comes through litigation and validation without meaningful erosion. But today’s public record forces too much faith-based underwriting: there is no disclosed revenue run rate, no gross margin, no contract structure, no preference stack, and no post-layoff cash runway. My scenario ranges therefore stay anchored to milestone logic rather than invented multiple math. The bear range assumes further slips or legal friction push the company closer to a reset round; the base range assumes first monetization but continued opacity; and the bull
    range assumes credible launch conversion, economics disclosure, and durable strategic sponsorship. That framework leaves room for a strong business outcome later, but it does not support a confident buy call at the last reported mark today.'
