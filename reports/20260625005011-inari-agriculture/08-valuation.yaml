- id: TV003
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Capital support
    - Series G shows durable access to sophisticated capital
    - Strong investors can still overpay for scarce strategic stories
    - Disclose insider / outsider split, terms, and next-round milestones
  - - Commercial proof
    - Round cited first-generation product performance and commercialization progress
    - Public record still stops short of paid recurring economics
    - Show booked revenue, royalties, or contracted acreage by program
  - - Business model
    - Partner-led model could scale without building a full seed-distribution stack
    - Partner-led models can still hide weak economics or slow adoption
    - Provide partner contract structures and renewal behavior
  - - Strategic signal
    - Investor mix suggests long-duration institutional support
    - Signal is weaker than proof of monetization or margin quality
    - Show follow-on participation plus outside customer payments
  - - Category structure
    - Few scaled private seed-tech platforms can command strategic scarcity premium
    - Comparable public and distressed outcomes imply the premium can collapse fast
    - Show sustained launch conversion and legal de-risking
  - - Downside protection
    - Large capital raised gives the company time to execute
    - Workforce cuts and litigation show time is still being bought at a cost
    - Show post-2026 runway, legal reserves, and unchanged crop timelines
  notes: Judgment table pairs every bullish argument with the specific missing proof needed to rely on it.
