  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: series-g-terms
    missingEvidence: Series G price-per-share, liquidation preferences, participation rights, governance side letters, and any structured downside protection.
    whyItMatters: Headline post-money can materially overstate common-equity value when investors receive strong terms.
    diligencePath: Request financing documents, board approvals, and counsel summary of investor rights.
    relatedQuestionRefs:
    - QV010
    relatedTableRefs:
    - TV007
  - type: private-evidence-only
    severity: blocking
    topic: revenue-and-unit-economics
    missingEvidence: Booked revenue, milestone receipts, royalty terms, gross margin, and partner renewal behavior by crop and program.
    whyItMatters: Without economics disclosure, the valuation cannot be cross-checked against operating proof.
    diligencePath: Obtain management financial model, monthly reporting pack, and cohort-style partner economics.
    relatedQuestionRefs:
    - QV007
    - QV026
    relatedTableRefs:
    - TV007
  - type: missing-source
    severity: material
    topic: post-layoff-runway
    missingEvidence: Post-January-2026 headcount, cash runway, and timing impact of the workforce reduction by crop program.
    whyItMatters: The layoff can be interpreted either as prudent discipline or as a stress signal depending on remaining runway and milestone timing.
    diligencePath: Ask for updated org chart, budget-to-actual burn, and product milestone tracker after restructuring.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV006
    - TV007
  - type: private-evidence-only
    severity: material
    topic: paid-customer-proof
    missingEvidence: Signed customer count, contracted acreage or volume, and any recurring commercial payments already received.
    whyItMatters: The difference between commercial interest and commercial revenue is the key swing factor in whether the 2025 mark was justified.
    diligencePath: Request commercial pipeline report and verify with customer reference calls.
    relatedQuestionRefs:
    - QV026
    relatedTableRefs:
    - TV005
    - TV007
  - type: enumeration-incomplete
    severity: material
    topic: comparable valuation table coverage gap
    missingEvidence: More direct public valuation references for late-stage seed-tech and gene-editing platforms, especially clean listed peers and recent private round terms.
    whyItMatters: The comparable valuation table is intentionally partial because the public market has few clean peers; stronger comparables would tighten the scenario ranges and test whether Inari's mark is scarcity-driven or economically deserved.
    diligencePath: Extend the comp set with additional current public market data, private financing documents, and any secondary or tender references available in diligence.
    relatedQuestionRefs:
    - QV015
    - QV023
    - QV024
    - QV025
    relatedTableRefs:
    - TV004
