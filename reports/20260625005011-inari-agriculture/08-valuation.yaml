- id: TV006
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Commercialization delay
    - 2025-2026 product claims fail to convert into disclosed paid launches by next round
    - Strategic valuation remains ungrounded in economics
    - Assume lower range / demand reset pricing
  - - Litigation setback
    - Corteva case restricts access, raises damages risk, or blocks key products
    - IP moat becomes liability rather than asset
    - Move to avoid unless legal path is clear
  - - Further workforce reset
    - Another material layoff or site contraction before revenue disclosure
    - Signals weaker-than-expected operating leverage or runway
    - Treat as negative revision to execution probability
  - - Opaque round terms persist
    - No clarity on preferences, structure, or investor protections
    - Outside investors cannot compare economics with insiders
    - Do not match last round price
  - - Comp market worsens
    - Public gene-editing or ag-bio comps re-rate lower on commercialization misses
    - Private mark loses external support
    - Raise required return or wait
  notes: Trigger table translates qualitative risks into concrete events that would change the valuation stance.
