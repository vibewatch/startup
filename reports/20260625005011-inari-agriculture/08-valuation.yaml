- id: investor-signal-and-funding-history
  title: The investor mix is a positive signal, but it is still a signal rather than proof
  body: 'The 2025 round is stronger than a generic inside-led bridge. Inari said most of the capital came from new investors, including a wholly owned subsidiary of the Abu Dhabi Investment Authority, while existing investors Hanwha Impact, NGS Super, the State of Michigan Retirement System, and Flagship Pioneering also participated. That mix matters because it suggests the round drew long-duration institutions and returning backers rather than only momentum capital. NGS Super’s own site explicitly emphasizes disciplined, long-term investing for retirement outcomes, which is consistent with patient capital behavior. Even so, investor quality should not be mistaken for valuation validation. Strong allocators can still overpay when a category carries strategic scarcity and a company appears to be one of the few scaled private options. The more defensible reading is narrower: the Series G shows that Inari still had access to large pools of capital after multiple prior rounds and near-commercialization
    claims, which lowers near-term financing stress and supports the argument that sophisticated investors still see option value in the platform. It does not answer whether the present price fully discounts litigation, validation timelines, or the still-missing contract economics that would let outsiders distinguish a great platform from a great business.'
