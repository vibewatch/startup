  - id: s4-scenarios
    title: Bull / Base / Bear Valuation Scenarios
    body: >-
      Three scenarios bracket the credible valuation range for Ro, differentiated by revenue trajectory,
      applied multiple, and exit conditions. The bear case assumes the FDA compounding ban caused a
      material step-down in 2025 revenue—Ro loses the majority of its compounded-GLP-1 volume without
      equivalent branded replacement, and margins compress sharply on pass-through branded drug economics.
      If 2025 revenue falls to $400–500M at a LifeMD-to-Teladoc multiple of 0.5–1×, implied value is
      approximately $200–500M. At $7.0B, this represents a down-round discount of 93–97%.


      The base case assumes the branded-GLP-1 transition sustains Ro's growth trajectory: NovoCare
      Wegovy savings program (starting at $149/month self-pay) and Lilly Zepbound pricing ($299/month
      self-pay) remain accessible to Ro's cash-pay patient base, maintaining volume even as margin per
      script compresses. On 2025E revenue of $600–750M and a Hims-discounted multiple of 2.5–4×
      (accounting for private illiquidity and information asymmetry), implied value is $1.5–3.0B.


      The bull case assumes a manufacturer exclusive or preferred-partner agreement with Novo Nordisk or
      Eli Lilly, sustained above-market revenue growth to $800M+ by end of 2025, and execution toward
      a 2026–2027 IPO at a forward-revenue premium of 5–7×. Even in this scenario, the $7.0B 2022 mark
      is barely defensible without meaningful 2025 growth evidence. The stretch bull—$4.0–6.0B—would
      require Ro to demonstrate financial metrics resembling Hims circa mid-2025, which itself only
      reached that valuation on $2.35B of revenue. The probability of the stretch bull is low absent
      audited financials and a filed S-1.
