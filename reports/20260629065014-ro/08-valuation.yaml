  - id: s6-exit-verdict
    title: Exit Readiness and Diligence Verdict
    body: >-
      Ro's exit readiness is materially limited as of June 2026. No S-1 has been filed or announced.
      TechStackIPO, which tracks pre-IPO digital health disclosures, shows no PCAOB audit relationship,
      no registered underwriter, and no SEC pre-filing activity for Roman Health Ventures Inc. (CIK
      0001706332). The SEC's EDGAR database reflects no current periodic or prospectus filings for Ro.
      The earliest credible IPO window—absent an accelerated S-1 filing in H2 2026—is 2027 at the
      earliest, extending illiquidity risk and compressing expected IRR for any investor entering at
      the $7.0B mark.


      Strategic M&A is the more likely near-term exit mechanism. Potential strategic acquirers with
      clear synergy rationale include CVS Health (pharmacy distribution + PBM leverage), UnitedHealth
      Group Optum (provider network integration), Amazon Pharmacy/Health (digital distribution at scale),
      and large telehealth incumbents seeking GLP-1 capabilities. Any M&A process would require
      Ro to produce audited financials as a pre-condition, making the financial audit itself a gating
      step for all exit scenarios.


      The final diligence verdict: Ro is a high-potential asset being presented at a price that
      cannot be validated against current evidence. The $7.0B mark was set in a profoundly different
      capital market environment, before the FDA's compounding ban restructured the GLP-1 revenue
      model, before the public-comp set repriced by 60–90%, and before four years of undisclosed
      operating performance accumulated. No institutional investor should underwrite the 2022 mark.
      A negotiated entry at $1.5–2.5B, conditioned on audited financials and 2025 revenue
      transparency, represents a fair risk-adjusted framework given the thesis.
