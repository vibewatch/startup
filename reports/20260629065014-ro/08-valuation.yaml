callouts:
  - calloutType: risk
    title: "$7B Mark Implies 11.7× Revenue — 3–4× Above the Best Public DTC Comp"
    body: >-
      Applying the current Hims & Hers multiple (3.3× FY2025 revenue) to Ro's estimated 2024 revenue of
      $598M yields approximately $2.0B—less than one-third of the $7.0B February 2022 mark. Even allowing
      for Ro's higher growth rate and private-market control premium, the gap between the 2022 mark and any
      supportable current valuation is extraordinary. The 11.7× implied P/S exists only in a pre-GLP-1
      compounding-ban, pre-rate-hike world that no longer applies.
    claimRefs:
      - CV006
      - CV011
      - CV017
      - CV037

  - calloutType: insight
    title: "Hims's Trajectory Shows What Ro Would Need to Justify Its Valuation"
    body: >-
      Hims & Hers grew from $1.88B market cap at end-2023 to $7.85B by June 2026—a 4× increase driven
      by FY2025 revenue of $2.35B and demonstrated operating profitability. For Ro to reach $7B at Hims-
      equivalent multiples, it would need to demonstrate ~$2.1B in audited revenue with positive operating
      trends. Sacra estimates Ro at $598M in 2024—suggesting Ro needs 3.5× more revenue to justify the
      existing mark at current comp multiples. This is not impossible over a 3–5 year horizon but is far
      from guaranteed.
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV003
      - CV006

  - calloutType: recommendation
    title: "Conditional Entry Framework: $1.5–2.5B with Audited Financials as the Gating Condition"
    body: >-
      A rational entry framework for an institutional investor: negotiate a valuation of $1.5–2.5B (base
      case), require delivery of PCAOB-audited FY2023 and FY2024 financial statements before signing,
      demand 2025 YTD revenue and GLP-1 branded margin disclosure, and condition funding on receipt of
      full cap table and preference stack analysis. At $2.0B entry versus a $1.5–3.0B base-case range,
      the risk-adjusted return is positive even with a 30–40% private-market illiquidity discount.
      At $7.0B, the return math requires an outcome that would make Ro the largest pure-play DTC
      telehealth company in history—an outcome with no current evidence base.
    claimRefs:
      - CV009
      - CV036
      - CV040
      - CV054
      - CV056

