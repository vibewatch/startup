  - id: s3-public-comps
    title: Public Comparable Company Analysis
    body: >-
      The most instructive comp for Ro is Hims & Hers Health (NYSE: HIMS), the only other publicly traded
      DTC telehealth platform with material GLP-1 revenue and a vertically integrated pharmacy. Hims
      reported FY2025 revenue of $2,347.6M (59% YoY growth) and an FY2025 gross margin of approximately
      73.8%. As of June 28, 2026, Hims trades at a market cap of approximately $7.85B—implying roughly
      3.3× FY2025 revenue. At its peak in late 2025, Hims traded at a P/S above 6× on trailing revenue.
      Ro's GLP-1 leadership and integrated pharmacy are directly analogous to Hims, but Hims is four times
      Ro's estimated revenue scale and has achieved public-company financial transparency. Hims's current
      trading multiple, after significant market cap expansion from $1.88B at end-2023, reflects both
      GLP-1 tailwinds and ongoing profitability progress—conditions Ro has not yet demonstrated publicly.


      Teladoc Health (NYSE: TDOC) provides the cautionary counterpart. Despite $2.57B in FY2024 revenue,
      Teladoc trades at a market cap of approximately $1.51B as of June 2026—roughly 0.5–0.6× revenue.
      Teladoc's distress reflects a failed B2B enterprise model pivot, sustained net losses, and
      goodwill impairment from the $18.5B Livongo acquisition. Teladoc's model is materially different
      from Ro's (enterprise rather than DTC, no GLP-1 pharmacy), so its multiple is a floor reference
      rather than a base case.


      LifeMD (NASDAQ: LFMD) is the smallest direct comp, with FY2025 revenue of $194.1M and an
      approximately 86% gross margin on a subscription-heavy model. Its June 2026 market cap of $0.19B
      implies roughly 1.0× FY2025 revenue—reflecting limited scale, thin liquidity, and GLP-1
      re-positioning risk. WeightWatchers International (NASDAQ: WW) is a cautionary analog: the company
      filed for Chapter 11 bankruptcy in 2024 and emerged with a restructured balance sheet; its current
      market cap is highly distressed, illustrating the structural fragility of weight-management
      platforms without a defensible recurring revenue base.
