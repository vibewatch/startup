  - id: s4-satisfaction
    title: Customer Experience and Satisfaction Signals
    body: >-
      Customer satisfaction evidence for Ro is anchored by Trustpilot volume: more than 25,000
      reviews with an aggregate rating of 4.6 out of 5. Member testimonials on Ro's review page
      highlight four recurring satisfaction drivers: insurance concierge handling prior
      authorizations without patient effort; provider responsiveness and personalized communication;
      supply assurance through the supply tracker; and structured weekly check-ins enabling
      consistent progress. Specific named members — Billy S., Colleen B., Kristen B., and
      Stephanie T. — describe the experience in Ro's own marketing material as providing "a new
      sense of confidence," relief from insurance complexity, and meaningful weight-loss outcomes.

      Independent third-party reviews corroborate convenience and provider quality. Innerbody, which
      conducted hands-on product testing across multiple Roman product lines, awarded an overall
      rating of 4.25 out of 5 (on a 5-point scale), citing convenient online interface, access to
      proven treatments, licensed doctors with rigorous background checks, free follow-ups and
      messaging, pricing transparency, and standard two-day free shipping. Innerbody noted that
      Roman lacks live chat support — a feature offered by competitor Hims — and that some service
      lines (mental health, allergy) were removed, characterizing this negatively for existing users.

      US News' 2026 GLP-1 provider scorecard recognizes Ro specifically for its insurance support
      team that helps navigate prior authorizations and insurance-related concerns, positioning it
      among the best-in-class GLP-1 providers for insurance access. Healthline acknowledges Ro's
      convenience and discreet shipping as strengths but reports friction signals including slow
      response times and shipping and billing issues among some users. Third-party verification
      confirms Ro's core access thesis while flagging the same operational friction areas surfaced
      by adverse reviews.
    claimRefs:
      - CU019
