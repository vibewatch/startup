        plan paid upfront or $145 per month on a monthly plan, exclusive of GLP-1 medication costs.
      type: company-claimed
      confidence: high
      freshness: current
      sourceRefs:
        - SU002
        - SU003

    - id: CU004
      topic: glp1-formulary
      statement: >-
        GLP-1 medications available through Ro Body include Wegovy (semaglutide injection pen and
        pill), Zepbound (tirzepatide injection pen and KwikPen), Foundayo (orforglipron, oral),
        and Ozempic (semaglutide, off-label for weight loss).
