chapter:
  number: 6
  title: Customers
  summary: >-
    Ro's direct-to-patient telehealth model serves cash-pay and commercially insured US adults
    seeking fast, discreet access to GLP-1 weight-loss care, sexual health treatments, fertility
    support, and hair and skin products. Ro Body (GLP-1 weight loss) represents the dominant
    segment at an estimated 62% of 2024 revenue. A December 2025 peer-reviewed study (n=655,
    published in the Obesity journal) confirmed 16.6% average body weight loss at 68 weeks on
    semaglutide through Ro's platform — outcomes consistent with clinical trials — positioning Ro
    as the first telehealth GLP-1 provider with peer-reviewed real-world outcomes data at this
    scale. Customer satisfaction is strong by Trustpilot volume (25,000+ reviews, 4.6/5) and
    third-party expert ratings (Innerbody 4.25/5), but adverse signals include BBB complaints
    centered on cancellation and billing confusion (1.28/5, 36 reviews), government-plan
    exclusions (Medicare/Medicaid/Tricare ineligible), and no published subscriber count, NRR,
    cohort retention, or post-shortage-removal revenue impact data.

sections:
  - id: s1-customer-segments
    title: Target Customer Segments
    body: >-
      Ro targets cash-pay and commercially insured US adults across five therapeutic areas: GLP-1
      weight loss (Ro Body), men's sexual health (Roman), women's health and fertility (Rory,
      Modern Fertility), hair loss and dermatology, and preventive OTC health (Ro Zero). The
      company operates entirely direct-to-patient — there is no employer or health-system sales
      channel — with all care initiated digitally through Ro's website or mobile app. The target
      profile for Ro Body is an adult with overweight or obesity who wants a discreet,
      asynchronous, and fast path to GLP-1 medication access, bypassing the traditional multi-visit
      PCP-to-specialist referral cycle.

      The Roman product line targets adult men seeking discreet access to FDA-approved ED, PE, and
      hair-loss medications with free telehealth consultations and fast, unmarked shipping. Roman
      was Ro's founding product and still represents meaningful brand awareness, though GLP-1
      weight loss now dominates revenue at an estimated 62% of 2024 total. Rory and Modern
      Fertility target women of reproductive age seeking hormonal health, fertility testing,
      menopause management, and skincare via the same async telehealth model. Ro Zero addresses
      smoking cessation. All segments operate US-only and share the same ro.OS infrastructure,
      enabling cross-product data leverage and common provider credential verification. Ro does not
      serve patients with complex chronic conditions requiring in-person evaluation, patients not
      seen by any clinician in the prior three years, or patients enrolled in Medicare, Medicaid,
      Tricare, or Supplemental Medicare for GLP-1 programs.
    claimRefs:
      - CU001
      - CU002
      - CU025
