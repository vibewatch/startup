  claims:
    - id: CU001
      topic: customer-segments
      statement: >-
        Ro targets cash-pay and commercially insured US adults across five therapeutic areas:
        GLP-1 weight loss (Ro Body), men's sexual health (Roman), women's health and fertility
        (Rory, Modern Fertility), hair loss and dermatology, and preventive OTC health (Ro Zero).
      type: company-claimed
      confidence: high
      freshness: current
      sourceRefs:
