      topic: 68-week-weight-loss-outcomes
      statement: >-
        In Ro's December 2025 peer-reviewed study (n=655), patients treated with branded
        semaglutide through Ro's platform achieved an average body weight reduction of 16.6%
        (SD 7.5; 95% CI −17.1 to −16.0) over 68 weeks.
