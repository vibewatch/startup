        - SU015
        - SU016
        - SU017

    - id: CU002
      topic: ro-body-program
      statement: >-
        Ro Body is Ro's flagship weight-loss product, combining GLP-1 medications (Wegovy,
        Zepbound, Foundayo, or Ozempic) with ongoing clinical support including monthly
        check-ins, unlimited messaging, 1:1 health coaching, insurance concierge, and app-based
        monitoring tools.
      type: company-claimed
      confidence: high
      freshness: current
      sourceRefs:
        - SU002
        - SU013
        - SU023

    - id: CU003
