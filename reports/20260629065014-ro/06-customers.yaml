  - id: FU002
    title: Ro Body Patient Adoption Flow — Discovery to Long-Term Membership
    type: flow
    layout: standard
    summary: >-
      Step-by-step patient adoption flow showing the stages from initial discovery through active
      Ro Body membership and long-term persistence, with known timing benchmarks and key decision
      or conversion points. Funnel conversion rates at each stage are not publicly disclosed by Ro.
    data:
      nodes:
        - id: n1
          label: "Discovery"
          detail: "Adult with overweight/obesity discovers Ro via digital ads, Serena Williams campaign, search, or word of mouth"
        - id: n2
          label: "Online Assessment"
          detail: "Completes condition-specific questionnaire online; no in-person visit; 2-day eligibility determination"
        - id: n3
          label: "Provider Review & Prescription"
          detail: "Ro-affiliated provider reviews async intake; GLP-1 prescribed if BMI/health criteria met; medication selected based on profile and coverage"
        - id: n4
          label: "Coverage Navigation"
          detail: "Insurance path: concierge handles prior auth (2–3 weeks) | Cash-pay path: LillyDirect/NovoCare (1–2 weeks)"
        - id: n5
          label: "Active Ro Body Member"
          detail: "GLP-1 prescription active; membership running; monthly check-ins + unlimited messaging + health coaching"
        - id: n6
          label: "Long-Term Persistent Patient (≥68 wk)"
          detail: "Adherent member basis for Ro's outcomes study (16.6% avg weight loss); renewal and cross-product expansion"
      edges:
        - from: n1
          to: n2
          label: "Intent to seek care"
        - from: n2
          to: n3
          label: "Assessment submitted"
        - from: n3
          to: n4
          label: "Prescription issued"
        - from: n4
          to: n5
          label: "Medication received"
        - from: n5
          to: n6
          label: "Ongoing adherence"
    approximationNotes: >-
      Patient journey timing sourced from Ro's how-it-works page and US News 2026 review. Conversion
      rates between stages are not publicly disclosed by Ro. The long-term persistent patient stage
      represents the n=655 semaglutide study cohort (persisters who reported weight at 68 weeks);
      total Ro Body member count at any stage is unknown.
    claimRefs:
      - CU009
      - CU011
      - CU029
      - CU030

  - id: FU003
    title: Customer Proof Quality Matrix — Evidence Dimensions by Proof Category
    type: matrix
    layout: wide
    summary: >-
      Assessment of Ro's five customer-proof categories across five evidence-quality dimensions,
      showing relative strength, independence, and actionability of each proof type for diligence purposes.
    data:
      columns:
        - "Evidence Type"
        - "Source Independence"
        - "Sample Size / Volume"
        - "Outcome Measurement"
        - "Diligence Weight"
      rows:
        - label: "Peer-Reviewed Semaglutide Study"
          values:
            - "Objective outcomes data; peer-reviewed in Obesity journal"
            - "Industry-academic collaboration (Weill Cornell, Univ. of Indiana); company-sponsored but peer-reviewed"
            - "n=655 persisters; largest telehealth semaglutide real-world sample"
            - "16.6% avg weight loss; ≥5/10/20% threshold data; safety endpoints"
            - "High — but survivorship bias limits generalizability to full patient population"
        - label: "Trustpilot Aggregate Reviews"
          values:
            - "User satisfaction ratings; platform-moderated"
            - "Independent user-generated; not curated by Ro"
            - "25,000+ reviews; high statistical volume"
            - "Satisfaction only; no clinical outcome or retention data"
            - "Medium — high volume confirms scale; adverse minority is informative for friction analysis"
        - label: "Third-Party Expert Reviews (Innerbody, US News)"
          values:
            - "Editorial product evaluation"
            - "Editorially independent; no disclosed Ro compensation"
            - "2–3 major publications; each with single reviewer team"
            - "Qualitative; no patient-level outcome measurement"
            - "Medium — strong signal for product quality and experience; limited sample size"
        - label: "Named Member Testimonials (Ro site)"
          values:
            - "Self-reported satisfaction and anecdotal outcome claims"
            - "Company-curated; selected by Ro for marketing purposes"
            - "4+ named members cited on official site"
            - "Anecdotal; no verification; weight loss claims not independently measured"
            - "Low — marketing material; not suitable for diligence outcome claims"
        - label: "BBB Complaint Profile"
          values:
            - "Third-party complaint registry"
            - "Independent from Ro; complaint-skewed population"
            - "36 complaints; low absolute volume"
            - "No outcomes; documents billing, cancellation, and support friction"
            - "Medium for risk identification — small sample but consistent complaint categories across sources"
    approximationNotes: >-
      Evidence quality ratings are qualitative assessments derived from source analysis as of June 2026.
      "Diligence weight" reflects relative usefulness for investment due diligence, not for clinical validity.
      The peer-reviewed study is the highest-quality external evidence for clinical efficacy but is
      subject to survivorship bias and company sponsorship. Trustpilot volume is objectively measurable;
      the adverse minority is the most actionable signal.
    claimRefs:
      - CU009
      - CU019
      - CU020
      - CU023
      - CU028

  - id: FU004
    title: Clinical Weight Loss Outcomes — Ro Real-World vs. SURMOUNT-1 Trial Benchmarks
    type: bar
    layout: standard
    summary: >-
      Comparison of average percentage weight loss from Ro's 68-week real-world semaglutide study
      versus SURMOUNT-1 tirzepatide phase 3 trial outcomes (NEJM 2022) at comparable time points.
      Values represent mean percentage weight change from baseline; negative values indicate loss.
    data:
      items:
        - label: "Ro semaglutide real-world — avg weight loss at 68 wk (%)"
          value: 16.6
        - label: "SURMOUNT-1 tirzepatide 5 mg — avg weight loss at 72 wk (%)"
          value: 15.0
        - label: "SURMOUNT-1 tirzepatide 10 mg — avg weight loss at 72 wk (%)"
          value: 19.5
        - label: "SURMOUNT-1 tirzepatide 15 mg — avg weight loss at 72 wk (%)"
          value: 20.9
        - label: "Ro semaglutide — % patients achieving ≥5% weight loss"
          value: 95.4
        - label: "Ro semaglutide — % patients achieving ≥10% weight loss"
          value: 82.0
        - label: "Ro semaglutide — % patients achieving ≥20% weight loss"
          value: 32.8
        - label: "SURMOUNT-1 tirzepatide placebo — avg weight loss at 72 wk (%)"
          value: 3.1
    approximationNotes: >-
      Ro semaglutide outcomes from Ro press release (December 2025) and peer-reviewed study in Obesity
      journal. SURMOUNT-1 tirzepatide values from NEJM (Jastreboff et al., 2022; doi:10.1056/NEJMoa2206038).
      Direct comparisons between studies are not valid due to different populations, designs, and time points;
      these figures illustrate the relative efficacy landscape for context only. Ro's outcomes reflect
      persisters only (survivorship bias). SURMOUNT-1 outcomes reflect the intent-to-treat population
      using treatment-regimen estimand.
    claimRefs:
      - CU009
      - CU010
      - CU015
      - CU016
      - CU038

acknowledgedWarnings:
  - dimension: figureType
    reason: >-
      Two planned figure type substitutions are documented. First, the planned retention/repeat cohort
      figure cannot be authored because Ro has not published patient-level cohort retention data with
      interim time-point breakdowns; a bar figure (FU004) comparing average percentage weight loss
      from Ro's real-world semaglutide study versus SURMOUNT-1 tirzepatide benchmarks is substituted.
      Second, the planned adoption/deployment funnel is rendered as a flow figure (FU002) using the
      flow acceptedType listed in the chapter plan — funnel items require numeric conversion rates
      that are undisclosed; the flow diagram conveys the same adoption-path information. Journey-map
      (FU001) and matrix (FU003) planned types are also present.
  - dimension: unverifiedSource
    reason: >-
      Several customer-review and outcomes URLs were fetched through reader or host-normalized variants
      during drafting; the cited canonical URLs reflect the analyzed content even where the fetch trail
      did not preserve the exact same string form.

