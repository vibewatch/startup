  - id: FU001
    title: Ro Customer Journey Map — Segments, Touchpoints, and Expansion Loops
    type: journey-map
    layout: wide
    summary: >-
      End-to-end customer journey from awareness through long-term care and cross-product expansion,
      showing key touchpoints, product layers, and renewal loops across Ro's five therapeutic areas.
    data:
      nodes:
        - id: n1
          label: "Awareness & Screening"
          detail: "Adults with health goals (weight loss, ED, fertility, hair loss) discover Ro via digital ads, Serena Williams campaign, search, or word of mouth"
        - id: n2
          label: "Online Assessment"
          detail: "Condition-specific questionnaire; no in-person visit required; eligibility determination within 2 days"
        - id: n3
          label: "Provider Review & Prescription"
          detail: "Ro-affiliated provider asynchronously reviews intake; issues prescription for GLP-1, ED, hair loss, or other medication if eligible"
        - id: n4
          label: "Coverage Navigation"
          detail: "Insurance concierge handles prior authorization and plan coverage (2–3 weeks); cash-pay patients routed directly to fulfillment"
        - id: n5
          label: "Medication Fulfillment"
          detail: "Prescription filled by Ro pharmacy network or branded manufacturer channels (LillyDirect, NovoCare); cash-pay 1–2 weeks; insured ~2–3 weeks; discreet packaging"
        - id: n6
          label: "Ongoing Care & Monitoring"
          detail: "Monthly check-ins, unlimited messaging, 1:1 health coaching, structured side-effect check-ins, dose titration, metabolic lab testing, GLP-1 supply tracker"
        - id: n7
          label: "Renewal & Cross-Product"
          detail: "Annual membership renewal; cross-product adoption (weight loss + fertility, ED, hair loss); clinical program adjustments based on outcomes"
    claimRefs:
      - CU002
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
