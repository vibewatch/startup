        Ro's 68-week study enrolled a random nationwide sample of patients treated with branded
        semaglutide (Wegovy or Ozempic) who persisted with treatment and reported their weight
        at 68 weeks (±14 days). The sample was 67.9% women, mean age 45.8 years, median baseline
        BMI 32.3 kg/m².
