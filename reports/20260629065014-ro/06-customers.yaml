  - id: s2-patient-journey
    title: Patient Access Journey and Program Structure
    body: >-
      The Ro patient access journey for Ro Body follows four stages: online assessment, provider
      review, coverage navigation or cash-pay fulfillment, and ongoing care. Assessment begins
      with a condition-specific questionnaire completed entirely online; no in-person visit is
      required, and patients receive eligibility determination within two days. A Ro-affiliated
      provider asynchronously reviews the patient's medical history and — if eligible — issues a
      GLP-1 prescription (Wegovy, Zepbound, Foundayo, or Ozempic) without a synchronous
      appointment requirement.

      For insurance patients, Ro's concierge team handles prior authorization and plan coverage
      navigation on the patient's behalf at no additional charge, typically requiring two to three
      weeks for resolution. Cash-pay patients bypass insurance steps and can receive their first
      GLP-1 dose within one to two weeks via Ro's pharmacy network or through integration with
      branded manufacturer self-pay channels: LillyDirect for tirzepatide (Zepbound) and NovoCare
      for semaglutide (Wegovy). Medication arrives in discreet packaging with one-to-four-day
      shipping from Ro's pharmacy partners.

      Ongoing care includes unlimited asynchronous messaging with the assigned provider, structured
      monthly check-ins, one-to-one health coaching for behavior change, structured side-effect
      check-ins, anti-nausea prescription support if needed, metabolic lab testing at Quest
      Diagnostics or via at-home kit, and access to Ro's GLP-1 Supply Tracker showing real-time
      availability of Wegovy and Zepbound. The Ro Body membership costs $39 for the first month,
      then $74 per month on an annual plan or $145 per month on a monthly plan, exclusive of
      medication costs. Ro also partners with Serena Williams as a marketing ambassador for its
      GLP-1 weight-loss program, broadening consumer awareness among demographics traditionally
      underserved by telehealth platforms.
