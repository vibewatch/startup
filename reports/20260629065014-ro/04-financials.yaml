callouts:
  - calloutType: risk
    title: Stale $7B Valuation Is the Largest Single Diligence Blocker
    body: >-
      Ro's last equity round at $7B implies ~11.7× 2024 estimated revenue—3.9× the current Hims & Hers public market multiple of ~3×. With no new round since February 2022 and digital-health multiples having compressed materially since the 2021–2022 peak, any LP or co-investor marking Ro at last-round value is likely holding an artificially elevated position. A realistic current-market mark at Hims comparables would value Ro at ~$1.5–2.1B, implying a 70%+ decline from last round. This is not a judgment on Ro's growth quality—it reflects a four-year-old market benchmark being misapplied to a sector that repriced sharply.
    claimRefs:
      - CI014
      - CI028
      - CI038

  - calloutType: risk
    title: Compounding Ban Removed Ro's Highest-Margin GLP-1 Product with Unknown P&L Impact
    body: >-
      The FDA's May 2025 decision to remove semaglutide from the drug shortage list ended Ro's ability to offer compounded semaglutide—an estimated $370M revenue stream in 2024 at meaningfully higher gross margins than branded pass-through. While Ro pivoted to branded Wegovy/Ozempic dispensing, the revenue-per-patient economics are fundamentally different: patients now pay $936–$1,023/month (vs. ~$299/month) and Ro earns thin dispensing margins rather than compound-manufacturing margins. Volume effects (fewer patients can afford branded rates) and margin effects (thinner per-patient gross profit) create a double headwind with no public 2025 data to validate management's response.
    claimRefs:
      - CI004
      - CI007
      - CI008
      - CI011
      - CI030
      - CI033

  - calloutType: insight
    title: Hims & Hers Provides the Strongest Financial Benchmark for Underwriting Ro
    body: >-
      Hims & Hers is the most comparable public company to Ro by model (direct-to-patient cash-pay telehealth + pharmacy), growth profile (~69% vs. Ro's ~66% in 2024), and GLP-1 exposure. Hims reported 2024 gross profit of $1,173M (79.4% gross margin) on $1,477M revenue—confirming that a high-GLP-1-mix telehealth operator at scale can achieve high blended margins. This benchmark anchors the optimistic end of Ro's gross margin range. However, Hims' current market multiple (~3× revenue) rather than the $7B Ro last-round mark should frame any current-period investment scenario.
    claimRefs:
      - CI019
      - CI022
      - CI028
      - CI045

