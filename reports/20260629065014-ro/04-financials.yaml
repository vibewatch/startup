  - id: s6
    title: Financial Disclosure Gaps and Diligence Verdict
    body: >-
      Ro's financial opacity is the most significant underwriting blocker in this report. The company has not filed audited financial statements, disclosed gross margins, published subscriber counts, or released any proxy for burn rate or cash position. Investors relying solely on public data cannot build a defensible financial model for Ro. The Sacra revenue estimates (~$360M 2023, ~$598M 2024) are the most credible independent data points, but they carry no assurance and may reflect outdated information.


      Five specific gaps are blocking: (1) audited P&L across all revenue segments; (2) COGS and gross margin by segment to validate the telehealth vs. pharmacy margin split; (3) subscriber count and ARPU to validate the revenue-per-user denominator; (4) current cash position and runway, especially given the possible SVB credit facility transition and uncertain 2025 revenue; and (5) the financial impact of the FDA compounding ban, which eliminated what was likely Ro's highest-margin GLP-1 revenue stream. The absence of an S-1 filing or IPO process means none of these gaps are likely to close imminently without investor-level due diligence access.


      Manufacturer pricing dependence adds a structural financial risk: Novo Nordisk and Eli Lilly control the pricing of Wegovy, Ozempic, Zepbound, and Mounjaro. Any manufacturer price increase, rebate structure change, or exclusivity strategy can reduce Ro's economics without management having any offsetting lever. Ro's status as a distributor/prescriber—not a manufacturer—is a fundamental structural constraint on long-term margin improvement in the GLP-1 segment.
