  - id: s5
    title: Public Market Comparables and Implied Valuation
    body: >-
      Three public direct-to-patient telehealth companies offer limited but useful benchmarks for contextualizing Ro's financial position. Hims & Hers (HIMS)—the closest analog by model, scale, and GLP-1 exposure—reported 2024 revenue of $1,477M (69% year-over-year growth) with a 79.4% gross margin, and trades at approximately $4.4B market cap (3.0× 2024 revenue) as of mid-2026 following a significant multiple compression from peak 2021 levels. LifeMD (LFMD) is a smaller direct-to-patient telehealth operator with 2024 revenue of $212M; it reported net losses and trades at approximately $0.22B (roughly 1.0× revenue). Teladoc (TDOC) anchors the bear case: $2,570M in 2024 revenue, declining YoY, and a market cap of approximately $0.8B (0.3× revenue)—reflecting sustained net losses and a structurally challenged B2B model.


      Ro's $7B last-round valuation implies approximately 11.7× its estimated $598M in 2024 revenue. This multiple is substantially above the current Hims multiple of 3.0× and reflects either a significant premium for Ro's growth and strategic optionality, or a stale mark that has not been refreshed since the 2021–2022 private-market peak. The digital health market broadly saw compressed multiples from 2022 to 2025; Ro's lack of a refreshed round means its headline valuation does not reflect current market conditions. If marked at Hims' current multiple, Ro's implied market value would be approximately $1.8B—a potential write-down of more than 70% from last disclosed round.


      One important caveat: Ro's 66% growth rate as of 2024 is faster than Hims' 69% in the same period at a smaller revenue base, but Hims is publicly audited and Ro is not. Any multiple comparison is further complicated by the absence of verified Ro gross margins, profitability data, and forward guidance.
