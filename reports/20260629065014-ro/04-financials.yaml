  - id: s2
    title: Pricing Architecture and Margin Structure
    body: >-
      Ro operates a two-layer monetization model: (1) recurring telehealth subscription fees charged directly to the patient, and (2) pharmacy revenue from prescription fulfillment. The subscription layer—typically $15–100/month depending on the product line—carries structurally high gross margins analogous to digital-health SaaS, given that the primary cost is physician/provider time and platform infrastructure. The pharmacy layer economics differ sharply by product.


      For Ro's compounded semaglutide offering (operative until May 2025), the compound was manufactured internally or by contracted 503B compounding pharmacies. Patients paid approximately $299/month or less—a substantial discount to branded Wegovy's $936–$1,023/month list price. Ro captured a meaningful portion of the spread between compound COGS and list equivalent, yielding estimated gross margins in the 30–50% range for the compounded product. The branded-drug pass-through model that replaced it is fundamentally different: Ro facilitates the prescription and charges a dispensing/administrative fee, but the drug manufacturer captures most of the selling price. Hims & Hers, the closest public comparator, reported 2024 gross profit of $1,173M on $1,477M revenue—a 79.4% blended gross margin—driven by a similar product mix shift toward compounded then branded GLP-1. Ro's blended margin is estimated to be somewhat lower given its greater pharmacy-pass-through reliance.


      GoodRx data confirms compounded semaglutide prices from telehealth platforms ranged from roughly $99–$400/month, versus $936–$1,023/month for branded Wegovy. The 3–10× price gap underscores why compounding was critical to Ro's GLP-1 growth story: at $299/month, Ro was addressable to a far larger cash-pay population than at branded rates. The FDA-mandated transition to branded drugs is both a margin headwind and a potential volume headwind.
