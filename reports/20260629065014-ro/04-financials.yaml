chapter:
  number: 4
  title: Financials
  summary: >-
    Ro is a high-growth private direct-to-patient telehealth and pharmacy company with estimated 2024 revenue of ~$598M (Sacra), up ~66% year-over-year, driven overwhelmingly by GLP-1 weight-loss medications (~62% of 2024 revenue). The company has raised ~$1.03B in total equity, with its last disclosed round being $150M at a $7B valuation in February 2022—a multiple that looks stale against current public-comp peers trading at 0.3x–3x revenue. Ro does not publish audited financials; gross margins, burn rate, and cash position are unverified. The FDA's May 2025 removal of semaglutide from the shortage list terminated Ro's compounded GLP-1 offering and created a structural revenue and margin inflection whose full impact remains unquantified without access to 2025 financials.

sections:
  - id: s1
    title: Revenue Scale and Mix
    body: >-
      Sacra, the leading private-company research platform covering digital-health unicorns, estimates Ro's 2024 revenue at approximately $598M, representing growth of roughly 66% year-over-year from an estimated ~$360M in 2023. These are unaudited third-party estimates; Ro discloses no public financials as a private company. The dominant driver of 2024 revenue was GLP-1 weight-loss medications, which Sacra estimates contributed approximately $370M—about 62% of total revenue—reflecting the explosive consumer demand for semaglutide and tirzepatide prescriptions.


      Ro's earlier revenue trajectory suggests approximately $150–200M in 2022 revenue before the GLP-1 demand surge. The step-change in growth from 2022 to 2024 closely parallels the industry-wide GLP-1 prescription boom, but also creates a single-category concentration risk: if GLP-1 revenue is disrupted—by the FDA compounding ban, manufacturer pricing decisions, or competitive dynamics—the topline is highly exposed. Non-GLP-1 revenue streams (Roman for men's health, Ro Pharmacy for general medications, Ro Body/wellness programs) collectively represent an estimated ~$228M of the 2024 total, though segment-level breakdowns are not publicly available.


      The FDA's removal of semaglutide (and tirzepatide) from the shortage list in early 2025 effectively prohibited Ro and its peers from offering lower-cost compounded GLP-1s. Ro's response—pivoting to branded Wegovy and Ozempic prescriptions—shifts substantial revenue to branded-drug pass-through, which carries far thinner gross margins than compounded formulations. The full 2025 revenue and margin impact of this transition is unknown without access to audited or management-disclosed financials.
