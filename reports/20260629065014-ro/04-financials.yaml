  - id: s3
    title: Unit Economics and Capital Efficiency
    body: >-
      Ro's unit economics are structurally opaque due to private-company non-disclosure. Drawing on public comparators and industry benchmarks, several proxies can be constructed. At ~$598M 2024 estimated revenue, and assuming an active subscriber base of several hundred thousand to one million patients (Sacra does not publish subscriber counts), average revenue per user (ARPU) is in the range of $600–$1,500 per year depending on subscriber count assumptions. For GLP-1 patients on branded Wegovy at ~$936–$1,023/month, annual pharmacy revenue per patient exceeds $11,000—but at thin pharmacy gross margin, the net contribution per GLP-1 patient is modest.


      Customer acquisition cost (CAC) in direct-to-patient telehealth is intensive. Competitors like Hims & Hers have disclosed customer acquisition costs of $60–$150 per subscriber in non-GLP-1 segments, but GLP-1 patients—who arrive via paid social, TV, and celebrity campaigns—likely cost more. Ro's high-profile Serena Williams partnership and broad digital advertising imply elevated CAC in the weight-loss category. Without published CAC or cohort data, payback period analysis is not supportable from public evidence.


      The analogous public benchmark, Hims & Hers, reported 2024 gross profit of $1,173M (79.4% margin) and posted its first full-year operating profit in 2024. LifeMD—a smaller direct-to-patient telehealth company—reported 2024 revenue of $212M with a net loss of $23.2M, demonstrating how similar-model companies at lower scale remain unprofitable. Teladoc, an enterprise-B2B model, reported 2024 revenue of $2,570M but continues to trade at deep distressed multiples (~0.3× revenue) due to sustained net losses and declining B2B utilization. These comps suggest Ro's profitability status, if achievable at ~$598M revenue, would represent a stronger-than-comp outcome—but there is no public evidence to confirm or deny this.
