companyProfile:
  summary: >-
    Ro (Roman Health Ventures, Inc.) is a New York-based direct-to-patient healthcare company founded
    in 2017 by Zachariah Reitano, Saman Rahmanian, and Rob Schutz. Originally launched as Roman for
    men's sexual health, the company expanded into GLP-1 weight loss, fertility, women's health,
    smoking cessation, hair, skin, and supplements while building the ro.OS platform to integrate
    patient intake, clinical review, pharmacy fulfillment, labs, and in-home care. Sacra estimates Ro
    reached approximately $598M of revenue in 2024, with roughly 62% tied to GLP-1 obesity care,
    making the company both one of the more scaled private D2C healthcare platforms and highly exposed
    to drug-supply, pricing, and regulatory shifts.
  foundedDate: "2017-04-04"
  founders:
    - name: Zachariah Reitano
      role: Co-Founder & CEO
      background: Founded Ro after a family-health experience highlighted the gap between convenient consumer software and fragmented healthcare access.
      claimRefs: [CO009]
    - name: Saman Rahmanian
      role: Co-Founder
      background: Listed in SEC Form D filings as an executive officer and director during the company's earliest financing rounds.
      claimRefs: [CO010]
    - name: Rob Schutz
      role: Co-Founder
      background: Listed in SEC Form D filings as an executive officer and director and associated with early go-to-market and brand formation.
      claimRefs: [CO011]
  foundingLocation: New York, New York, US
  headquarters: New York, New York, US
  productSummary: >-
    Ro sells cash-pay telehealth consultations, prescriptions, pharmacy fulfillment, diagnostics, and
    ongoing care programs across weight loss, men's health, women's health, fertility, smoking
    cessation, hair, skin, and supplements. Its ro.OS platform connects patient messaging and intake,
    provider workflows, lab ordering, pharmacy operations, and in-home care logistics.
  customerFocus: >-
    Primarily US consumers seeking discreet, convenient, direct-pay healthcare access for stigmatized
    or chronic conditions, with growing relevance to employer and manufacturer-linked obesity care.
  businessModel: >-
    Direct-to-consumer subscriptions and visit fees, pharmacy margin or service revenue on prescriptions,
    at-home and partner diagnostics, and manufacturer-linked branded GLP-1 distribution pathways.
  stage: Late-stage private company with stale 2022 growth-round valuation benchmark
