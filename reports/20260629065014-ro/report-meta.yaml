  topStrengths:
    - Vertically integrated ro.OS workflow links telehealth, pharmacy, diagnostics, and in-home care more tightly than most D2C peers.
    - Estimated 2024 revenue of roughly $598M and 66% YoY growth indicate real scale despite private-company opacity.
    - Preferred manufacturer relationships with Novo Nordisk and Eli Lilly support branded GLP-1 access after compounding restrictions tightened.
    - Broad condition coverage across Roman, Rory, fertility, smoking cessation, weight loss, and daily health creates cross-sell potential.
  topRisks:
    - Roughly 62% of estimated 2024 revenue is tied to GLP-1 care, creating acute concentration risk.
    - The last disclosed valuation is a February 2022 $7B mark that appears difficult to justify against current public comps.
    - No audited financials, S-1, or other public operating disclosures exist to verify revenue quality, margins, burn, or capital structure.
    - Regulatory tightening around compounded GLP-1 promotion and telehealth advertising could raise compliance and acquisition costs.
    - Manufacturer channel or pricing changes by Novo Nordisk or Eli Lilly could impair growth abruptly.
  unresolvedGaps:
    - Audited 2023-2025 revenue, gross margin, burn, cash runway, and debt balances remain undisclosed.
    - The current economics of Ro's Novo and Lilly relationships, including rebates, exclusivity, and margin structure, are unknown.
    - The existence of any post-2022 secondary transactions, internal markdowns, or cap-table preference overhang is not publicly visible.
    - Customer support resolution rates and complaint severity are only partially observable because key review surfaces are blocked or incomplete.
    - No verified SEC registration statement confirms whether IPO preparation is active or still speculative.
