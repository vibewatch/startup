summary:
  headline: >-
    Ro has built a real scaled asset in D2C healthcare with strong GLP-1 growth and meaningful vertical
    integration, but the stale $7B mark, lack of audited disclosure, and heavy dependence on regulated
    manufacturer channels keep the company in watchlist rather than clear-buy territory.
