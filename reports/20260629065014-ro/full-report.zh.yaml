  - id: TM004
    title: 增长驱动与约束清单
    columns:
      - 驱动或约束
      - 方向
      - 时点
      - 对 Ro 的影响
      - 尽调问题
    rows:
      - - GLP-1 需求激增（成人肥胖率 42.4%）
        - 驱动
        - 当前且持续
        - 结构性顺风；约 70M 临床合格成人（BMI≥30，或 ≥27 且有合并症）构成持续数十年的治疗管线
        - 确认 Ro 能否放大患者量，同时不牺牲临床质量、不增加监管风险
      - - 可及性摩擦 — 医生短缺、等待时间、病耻感
        - 驱动
        - 当前
        - 无法或不愿线下就医的患者会转向远程医疗；Ro 的异步模式摩擦低
        - 跟踪初始问诊环节的 NPS / 放弃率；验证 Ro 相对同业的转化率
      - - 远程医疗同等支付与州覆盖扩张（44 个州已有私营支付方法律；CCHP 2025）
        - 驱动
        - 近期（到 2025 年逐步成熟）
        - Ro 追逐雇主合同时，监管和报销风险下降；远程医疗成为常规护理场景
        - 确认 CCHP 对 Ro 运营州的跟踪；评估处方法合规性
      - - 雇主承担肥胖成本（86% 将长期成本列为首要担忧；IFEBP）
        - 驱动
        - 正在形成（2025–2027 年浪潮）
        - 自保雇主有明确购买动机；PHTI 框架与 Ro Body 产品匹配
        - 获取首批企业合同披露；跟踪 Ro Body 入组增长，并与消费者细分市场对比
      - - GLP-1 标价门槛（$936–$1,023/月；NCSL）
        - 约束
        - 当前且结构性
        - 若没有复方替代，现金自付患者会撞上可负担性悬崖；留存和依从性承压
        - 监测复方药监管状态；量化 Ro 品牌 GLP-1 与复方 GLP-1 收入拆分
      - - FDA 收紧复方药（短缺状态取消风险）
        - 约束
        - 近期（2025–2026）
        - 若 semaglutide 被移出短缺清单，复方药房将被禁止配制；Ro 2024 年 GLP-1 收入中约 $370M 可能受冲击
        - 每月跟踪 FDA 短缺数据库状态；评估 Ro 与 Novo Nordisk / Lilly 的品牌 GLP-1 供货协议
      - - 跨州执照与 Ryan Haight Act 处方规则
        - 约束
        - 当前
        - 全美 50 州医生资质认证和 DEA 合规抬高运营成本，也限制开方速度
        - 审核 Ro 医生网络执照覆盖；评估远程医疗开方的合规姿态
      - - 雇主覆盖收缩风险（许多雇主考虑缩减；KFF 2025）
        - 约束
        - 正在形成（2025–2026）
        - 若大型雇主削减 GLP-1 福利，雇主渠道 B2B 增长可能慢于预期
        - 监测 KFF / IFEBP 年度调查；逐年跟踪自保计划 GLP-1 覆盖率
      - - GLP-1 停药与 CAC 强度
        - 约束
        - 结构性
        - 真实世界停药率高，压低 LTV；Ro 必须持续重新获客挽回流失患者，或搭建留存项目
        - 披露患者留存 / 流失指标；评估 Ro Body 行为辅导效果
      - - 供给波动与 GLP-1 短缺历史
        - 约束
        - 近期（缓解但未解决）
        - Ro 的供给跟踪器承认波动；短缺会迫使患者排队，并造成收入波动
        - 确认 Ro 与药企的直接供货协议；评估履约率和缺货订单数据
    notes: 时点分类（当前 / 近期 / 正在形成 / 结构性）反映 2026-06-29 的运行日期。驱动与约束的量级并不相等；考虑到 GLP-1 收入集中度，复方药收紧风险被归为重大到可能阻断。
