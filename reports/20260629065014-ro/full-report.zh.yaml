      - number: '8.7'
        title: 附录
        blocks:
          - type: callout
            title: $7B 标记意味着 11.7× 收入——比最佳公开 DTC 可比公司高 3–4×
            body: >-
              将当前 Hims & Hers 倍数（FY2025 收入的 3.3×）套到 Ro 2024 年估算收入 $598M 上，得到约 $2.0B——不到 2022 年 2 月 $7.0B 标记的三分之一。即便承认 Ro
              增速更高和私营市场控制权溢价，2022 年标记与任何可支撑当前估值之间的差距仍异常巨大。11.7× 隐含 P/S 只存在于 GLP-1 复方药禁令前、加息前的世界，今天已不适用。
            calloutType: risk
            claimRefs:
              - CV006
              - CV011
              - CV017
              - CV037
          - type: callout
            title: Hims 的轨迹显示 Ro 需要做到什么，才能支撑自身估值
            body: >-
              Hims & Hers 市值从 2023 年底 $1.88B 增至 2026 年 6 月 $7.85B，增长 4×，驱动因素是 FY2025 收入 $2.35B 和已证明的运营盈利能力。Ro 若要按等同 Hims
              的倍数达到 $7B，需要证明约 $2.1B 的经审计收入，并呈现正向经营趋势。Sacra 估算 Ro 2024 年收入为 $598M——这意味着 Ro 需要再增长 3.5×，才能按当前可比倍数支撑既有标记。3–5
              年内并非不可能，但远非板上钉钉。
            calloutType: insight
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV003
              - CV006
          - type: callout
            title: 有条件进入框架：$1.5–2.5B，并以经审计财务报表作为闸门条件
            body: >-
              机构投资者的理性进入框架：谈判 $1.5–2.5B 估值（基准情景），签约前要求交付 PCAOB 审计的 FY2023 和 FY2024 财务报表，要求披露 2025 年 YTD 收入和 GLP-1
              品牌药利润率，并以收到完整股权结构表和优先权堆栈分析作为出资条件。以 $2.0B 进入、对照 $1.5–3.0B 基准区间，即使计入 30–40% 的私营市场流动性折价，风险调整回报仍为正。若按 $7.0B
              进入，回报测算要求 Ro 成为史上最大的纯 DTC 远程医疗公司——而当前没有证据支撑这种结果。
            calloutType: recommendation
            claimRefs:
              - CV009
              - CV036
              - CV040
              - CV054
              - CV056
