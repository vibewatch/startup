  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界——Ro 服务与不服务的市场
        blocks:
          - type: paragraph
            body: >-
              做任何规模测算前，必须先界定市场边界。最宽的远程医疗口径包括所有支付类型下的虚拟临床互动——Medicare、Medicaid、 商业保险和现金自付。Ro
              只经营现金自付、无保险这个子集：患者以订阅模式自掏腰包支付远程医疗咨询、药房履约、 居家实验室和居家护理。这个边界排除了医院远程医疗项目、保险报销的视频问诊，以及由计划而非患者直接付费的雇主按人头虚拟护理合同。

              在现金自付远程医疗内部，Ro 进一步集中在慢性和生活方式驱动病症——体重管理、性健康、脱发、皮肤护理、戒烟和生育—— 而非急诊护理或行为健康，后两者由 Teladoc、Hims & Hers、MDLive
              等竞争者服务。GLP-1 抗肥胖药物板块是主导收入驱动因素： Sacra 估算 Ro 2024 年约 $370M 收入来自 GLP-1 产品。Ro 的药房板块（Ro Pharmacy）和居家诊断是邻近变现层，
              把现金自付价值链延伸到远程医疗问诊之外。

              关键现状替代方案包括：到线下初级保健医生或内分泌科医生处开 GLP-1 处方、线下减重诊所（如 Calibrate、WeightWatchers）、 非处方减肥产品以及减重手术。NCSL
              指出，对部分患者而言，减重手术可能是比品牌 GLP-1 更低成本且持久的替代方案； 在成本敏感或有保险覆盖的人群中，这一替代具备可信度。地理替代也相关：专科覆盖充分、线下护理可负担的地区， 患者采用 Ro
              模式的触发因素弱于农村或服务不足市场。

              值得跟踪的邻近方向包括雇主赞助的虚拟体重管理（Ro 的 Ro Body 项目已有早期信号）、药企直接签约（Novo Nordisk 和 Eli Lilly 正在扩大分销）以及可能打开保险介导市场的 PBM /
              保险公司合作。
