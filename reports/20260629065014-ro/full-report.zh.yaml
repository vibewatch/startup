      - number: '4.2'
        title: 定价架构与利润率结构
        blocks:
          - type: paragraph
            body: >-
              Ro 的变现分两层：第一层是直接向患者收取的周期性远程医疗订阅费，第二层是处方履约带来的药房收入。订阅层通常按产品线收取 $15–100/月；主要成本是医生 /
              服务提供者时间和平台基础设施，因此毛利率结构上较高，接近数字医疗 SaaS。药房层的经济性则因产品而异。


              Ro 的配制 semaglutide 产品（运营至 2025 年 5 月）由内部或签约 503B 配制药房生产。患者每月支付约 $299 或更低，显著低于品牌 Wegovy 每月 $936–$1,023
              的标价。Ro 捕获了配制药 COGS 与品牌标价之间可观的一部分价差，配制产品估计毛利率在 30–50% 区间。取代它的品牌药转售模式完全不同：Ro 负责促成处方并收取配药 /
              行政费用，但药厂拿走大部分售价。最接近的上市可比公司 Hims & Hers 披露，2024 年收入 $1,477M、毛利 $1,173M，综合毛利率 79.4%；类似的产品组合从配制 GLP-1 转向品牌
              GLP-1，是主要驱动。考虑到 Ro 对药房转售更依赖，其综合毛利率估计略低。


              GoodRx 数据确认，远程医疗平台的配制 semaglutide 价格大约在 $99–$400/月，而品牌 Wegovy 为 $936–$1,023/月。3–10 倍的价差说明，配制药为什么是 Ro 的
              GLP-1 增长故事的关键：$299/月的价格让 Ro 能触达远大于品牌药价格下的自费人群。FDA 强制转向品牌药，既压低利润率，也可能压低销量。
            claimRefs:
