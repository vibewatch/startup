  - id: TM001
    title: 市场定义表——Ro 的边界 vs. 广义远程医疗
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 支付方
      - 与 Ro 的相关性
    rows:
      - - 美国远程医疗（广义 TAM）
        - 所有支付方类型下的全部虚拟临床接触；估算 $87–$114B（Grand View Research，受限）
        - 线下就医、医院 CapEx、EMR 软件、非临床数字工具
        - Medicare、Medicaid、商业保险、雇主、现金支付患者
        - 外层 TAM 边界；包含 Ro 不服务的细分（保险中介、医院场景）
      - - DTC 现金支付远程医疗（Ro 核心模式）
        - 同步远程医疗问诊、异步消息、订阅式临床管理——不走保险
        - 保险报销就诊、医院视频系统、雇主按人头付费平台
        - 自费的个人消费者
        - 核心收入模式；靠消除保险摩擦形成差异
      - - GLP-1 抗肥胖 / 减重护理
        - 远程医疗处方、复方或品牌 GLP-1 配药、持续临床监测
        - 不通过 Ro 计费的保险覆盖品牌 GLP-1 处方配药
        - 现金支付患者；部分可享雇主福利但通过 Ro 自费的患者
        - 主导收入驱动；约 $370M Ro 2024 年收入（Sacra 估算）
      - - 在线药房 / 邮购履约
        - GLP-1（复方 semaglutide/tirzepatide）邮购配药，以及 ED / 脱发 / 皮肤仿制药
        - 零售药房、保险报销专科药房、PBM 裁定配药
        - 与 DTC 问诊患者相同；Ro Pharmacy 垂直整合
        - 问诊费之外的增厚利润层；若复方被禁止，则有监管风险
      - - 雇主赞助虚拟体重管理
        - 雇主资助项目，结合 GLP-1 获取、教练、营养和行为支持
        - 医院健康项目、肥胖症按人头 PCP 就诊、减重手术福利
        - 自保雇主作为直接支付方；员工作为用户
        - 新兴 B2B 细分；Ro Body 定位于此；没有已确认公开企业合同
      - - 现状替代（传统线下护理）
        - 线下 PCP / 内分泌科就诊、线下减重诊所、减重手术、OTC 减肥产品
        - N/A——这是替代方案，不是 Ro 竞争的细分
        - 有足够线下渠道的个人患者；有专科保险覆盖的参保患者
        - 农村和服务不足市场替代方案更弱；等待时间长或病耻感高时也更弱
    notes: >-
      Grand View Research 的市场规模来自受限访问页面；$87–$114B 区间被二级报道广泛引用，本文将其作为指示性数据处理，置信度为中。排除的支出边界沿用 Ro
      公开披露的现金自付、无保险模式。雇主细分市场仍属推测，需等待企业合同确认。
