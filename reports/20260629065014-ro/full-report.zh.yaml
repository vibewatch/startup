            - Ro Pharmacy Network — 6 家自有药房，分布式履约
            - 药品安全工具 — 禁忌提醒和过敏提示
            - 身份验证 — 仅向已验证患者安全配药
        - label: 实验室与诊断层
          detail: 双模式实验室检测，自动交付结果
          modules:
            - Lab App — 居家套件下单和自动结果交付
            - Quest Diagnostics 集成 — 全国数千个零售检测点
            - CLIA/CAP 认证实验室处理 — Ro 专用实验室处理居家套件
            - 自动结果交付 — 实验室数据直接整合进患者病历
