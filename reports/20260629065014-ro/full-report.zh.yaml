      - number: '7.7'
        title: 运营、技术与终止标准——监控急性风险
        blocks:
          - type: paragraph
            body: >-
              Ro 的运营和技术风险真实存在，但比监管和供应链敞口更可管理。异步远程医疗模式留下不良事件发现缺口：GLP-1 副作用，包括胰腺炎、心律失常和精神反应，可能不会在每月随访周期中浮现。Ro 发布了 GLP-1
              安全页面，但没有披露不良事件报告率、MedWatch 提交量或升级标准——如果临床结局营销扩大，监管机构可能审查这一缺口。平台和数据安全风险存在，但对云端医疗来说属于标准风险；即使 Ro
              没有公开披露具体认证，也很可能有 HIPAA 商业伙伴保护。


              最重要的监控框架是终止标准表：五个触发点各自都可能击穿 Ro 的投资逻辑。最关键的是 FDA 直接点名 Ro 采取行动——截至 2026 年 6
              月尚未发生，但在行业执法姿态升级下，这仍是近期最清晰的逻辑破裂场景。投资者应监控 FDA 警告信数据库、Ro 自身供应追踪器、雇主福利覆盖调查，以及任何新融资或二级市场交易，寻找投资逻辑改善或恶化的证据。
