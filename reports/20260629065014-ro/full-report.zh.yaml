            title: SAM / SOM 估算高度不确定；需要多条尽调路径
            body: >-
              美国现金自付 DTC 体重管理和 GLP-1 药房市场缺少经核实、可公开获取的一手估算，因此本章所有 SAM 估算都是反推或间接代理。 三个最佳可用方法——Grand View Research
              自上而下（受限）、Sacra 从 Ro 收入隐含推导 SAM、NCSL / KFF Medicaid 支出作为下限—— 给出的区间为 $15–$250B，宽到无法据此承销。管理层披露患者数、ARPU
              和支付方结构拆分，将显著收窄不确定性。
