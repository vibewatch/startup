  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Ro 核心业务的可寻址市场——D2C 远程医疗、GLP-1 减重护理和线上药房——已经吸引至少五类可信竞争者：（1）上市 D2C 远程医疗平台（Hims &
              Hers、LifeMD）；（2）雇主资助的慢性病平台（Calibrate、Noom）；（3）B2B 虚拟护理聚合商 （Teladoc Health）；（4）平台支持的混合模式（Amazon One
              Medical）；（5）转向处方护理的传统消费者健康品牌（WeightWatchers）。 每类玩家都有不同的 GTM 动作、定价模式和 GLP-1 获取策略。Ro 的定义性特征是纵向整合：它运营自有药房（Ro
              Pharmacy / Body by Ro）， 运行异步和同步远程医疗问诊，并为 GLP-1 患者搭建供应链可视化工具。相比 LifeMD 这类纯远程医疗模式，这让 Ro 的第三方依赖在结构上更低； 但它也直接与
              Hims & Hers 在运营上竞争，后者同样拥有药房和肽制造设施。关键竞争风险是，FDA 对复方 GLP-1 的执法 （截至 2026 年 5 月 31 日，990+ 起不良事件报告）威胁依赖复方
              semaglutide 和 tirzepatide 的商业模式——Hims 也共享这一风险， 但每个平台的药企关系和复方占比不同，暴露也不同。
