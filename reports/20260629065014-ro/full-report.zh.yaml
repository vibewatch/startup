      - number: '4.7'
        title: 附录
        blocks:
          - type: callout
            title: 陈旧的 $7B 估值是最大的单一尽调障碍
            body: >-
              Ro 上一轮股权融资按 $7B 估值完成，意味着约为 2024 年估计收入的 11.7×，是 Hims & Hers 当前上市市场约 3× 倍数的 3.9×。自 2022 年 2
              月以来没有新一轮融资，数字医疗倍数又已较 2021–2022 年峰值大幅压缩；任何仍按上一轮价值标记 Ro 的 LP 或共同投资者，很可能持有一个人为抬高的头寸。若按 Hims 可比倍数作现实的当前市场标记，Ro
              价值约为 $1.5–2.1B，意味着较上一轮下跌 70% 以上。这不是对 Ro 增长质量的判断，而是一个四年前市场基准被错用在已大幅重定价的行业上。
            calloutType: risk
            claimRefs:
              - CI014
              - CI028
              - CI038
          - type: callout
            title: 配制禁令移除了 Ro 利润率最高的 GLP-1 产品，P&L 影响未知
            body: >-
              FDA 于 2025 年 5 月决定将 semaglutide 移出药品短缺清单，终止了 Ro 提供配制 semaglutide 的能力；该收入流 2024 年估计为 $370M，毛利率显著高于品牌药转售。Ro
              虽然转向品牌 Wegovy/Ozempic 配药，但单名患者经济性完全不同：患者现在支付 $936–$1,023/月（此前约 $299/月），Ro
              获取的是很薄的配药利润，而不是配制生产利润。销量影响（能负担品牌药价格的患者减少）和利润率影响（单名患者毛利更薄）形成双重逆风，且没有公开 2025 年数据来验证管理层应对。
            calloutType: risk
            claimRefs:
              - CI004
              - CI007
              - CI008
              - CI011
              - CI030
              - CI033
          - type: callout
            title: Hims & Hers 是承销 Ro 最强的财务基准
            body: >-
              按模式（直接面向患者的自费远程医疗 + 药房）、增长轮廓（2024 年约 69%，Ro 约 66%）和 GLP-1 暴露看，Hims & Hers 是与 Ro 最可比的上市公司。Hims 披露，2024 年收入
              $1,477M、毛利 $1,173M（毛利率 79.4%），确认高 GLP-1 占比的规模化远程医疗运营商可以实现较高综合毛利率。这个基准锚定了 Ro 毛利率区间的乐观端。但任何当前时期的投资情景，都应以
              Hims 当前市场倍数（约 3× 收入）为框架，而不是 Ro 上一轮 $7B 标记。
