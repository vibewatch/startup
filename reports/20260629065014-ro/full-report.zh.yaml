    approximationNotes: >-
      Ro semaglutide 结果来自 Ro 新闻稿（2025 年 12 月）和 Obesity 期刊的同行评审研究。SURMOUNT-1 tirzepatide 数值来自 NEJM（Jastreboff
      等，2022；doi:10.1056/NEJMoa2206038）。研究人群、设计和时间点不同，不能直接比较；这些数字仅用于展示相对疗效格局。Ro 的结果仅反映坚持者（幸存者偏差）。SURMOUNT-1
