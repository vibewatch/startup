      - number: '5.4'
        title: 产品线宽度与平台覆盖
        blocks:
          - type: paragraph
            body: >-
              ro.OS 支撑一个多垂直的消费者健康组合，远不止 GLP-1。Roman（男性健康）是 Ro 的创始产品线，覆盖勃起功能障碍、脱发及相关病症，提供处方和 OTC 产品；它还曾与 Walmart
              合作在线下销售男性健康 OTC 产品线。Rory（女性健康）覆盖更年期症状管理、护肤和脱发。Modern Fertility 于 2021 年被收购，提供激素检测、排卵检测、妊娠检测和生育补充剂。Ro Zero
              聚焦戒烟。Ro Mind 曾提供心理健康服务（抑郁和焦虑），但截至 2026 年 6 月，其当前状态未能在公开页面确认。

              收购直接拓宽了平台的技术边界。Workpath（约 2020 年收购）是一套软件平台，可通过 API 支持按需居家照护和诊断服务；Ro 曾用 Workpath 整合虚拟和线下照护，也曾向其他医疗公司提供
              Workpath API，用于临床试验、诊断和居家照护。Kit（2021 年收购）带来了居家诊断检测能力，与 Workpath 物流结合后，支撑 Lab App 的居家试剂盒服务。Ro 收购 Modern
              Fertility 时发布的新闻稿称，Ro 已在美国几乎每个县促成「超过八百万次数字医疗访问，包括 98% 的初级保健荒漠地区」，既强调平台全国覆盖，也强调触达服务不足地区。

              产品宽度带来交叉销售可选性和共享数据优势：GLP-1 患者也可能使用 Modern Fertility 激素检测、Roman OTC 或 Ro Zero，且全部在 ro.OS
              的单一患者记录内管理。TechStackIPO 指出，Ro 是「美国唯一整合远程医疗、药房、居家检测、实验室和诊断的公司」；但这一独占性说法尚未与所有竞争对手逐一独立验证。
