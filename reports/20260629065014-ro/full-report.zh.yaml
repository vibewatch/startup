      - number: '8.3'
        title: 公开可比公司分析
        blocks:
          - type: paragraph
            body: >-
              对 Ro 最有参考价值的可比公司是 Hims & Hers Health（NYSE: HIMS），它是另一家有实质 GLP-1 收入且垂直整合药房的上市 DTC 远程医疗平台。Hims 报告 FY2025 收入
              $2,347.6M（同比增长 59%），FY2025 毛利率约 73.8%。截至 2026 年 6 月 28 日，Hims 市值约 $7.85B——约为 FY2025 收入的 3.3×。2025
              年末高点时，Hims 以超过 6× 的追踪收入 P/S 交易。Ro 的 GLP-1 领先地位和整合药房与 Hims 直接可比，但 Hims 的估算收入规模是 Ro 的四倍，并且已经具备上市公司财务透明度。Hims
              当前交易倍数是在市值从 2023 年底 $1.88B 大幅扩张后形成的，反映了 GLP-1 顺风和持续盈利改善；Ro 尚未公开证明这些条件。


              Teladoc Health（NYSE: TDOC）提供了警示性对照。尽管 FY2024 收入为 $2.57B，截至 2026 年 6 月，Teladoc 市值约 $1.51B——约为收入的
              0.5–0.6×。Teladoc 的困境来自 B2B 企业模式转型失败、持续净亏损，以及 $18.5B 收购 Livongo 后的商誉减值。Teladoc 模式与 Ro 有重大差异（企业端而非 DTC，没有
              GLP-1 药房），所以它的倍数是底部参照，而不是基准情形。


              LifeMD（NASDAQ: LFMD）是规模最小的直接可比公司，FY2025 收入 $194.1M，订阅占比较高的模式毛利率约 86%。其 2026 年 6 月市值 $0.19B，约为 FY2025 收入的
              1.0×——反映规模有限、流动性薄，以及 GLP-1 重新定位风险。WeightWatchers International（NASDAQ: WW）是警示性类比：该公司 2024 年申请 Chapter 11
              破产并以重组后资产负债表走出破产；其当前市值高度承压，说明缺少可防守经常性收入基础的体重管理平台存在结构性脆弱。
