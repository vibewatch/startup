  - id: TV004
    title: 牛 / 基准 / 熊估值情景
    columns:
      - 情景
      - 收入假设（2025E）
      - 适用倍数
      - 隐含估值
      - 关键成立假设
      - 主要下行触发项
    rows:
      - - 熊
        - $350–500M（复方禁令导致收入下降 20–40%）
        - 0.5–1.0×（Teladoc 到 LifeMD 的困境区间）
        - $175M–$500M
        - FDA 执法或品牌药定价让 Ro 的 GLP-1 产品失去竞争力
        - FDA 直接执法；Hims 拿走多数品牌 GLP-1 量；收入下降 >30%
      - - 基准
        - $600–750M（品牌药转换以较低利润率维持增长）
        - 2.5–4.0×（相对 Hims 因私有公司流动性差和信息缺口折价）
        - $1.5B–$3.0B
        - NovoCare/Lilly 定价可接入；Ro 保住患者基础；品牌药利润率恢复到 30%+
        - 收入停在 $600M 以下；增长减速后倍数压缩至 LifeMD 区间
      - - 牛
        - $800M–$1.0B（厂商合作 + 新垂直加速增长）
