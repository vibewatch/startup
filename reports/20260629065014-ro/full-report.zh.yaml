          note: Hims 2025 年峰值 P/S 区间下限；Ro 基准情景上端
        - label: 6.0×（Hims 2025 峰值）
          value: 3588
          unit: USD millions
          note: Hims 2025 年中 TTM P/S 达到约 6×；仅当 Ro 匹配 Hims 增长轨迹时适用
        - label: 8.0×（2021 增长溢价）
          value: 4784
          unit: USD millions
          note: 增长时代的类 SaaS 溢价；当前无可比公司支撑
        - label: 11.7×（2022 标记隐含）
