      - number: '1.5'
        title: 不利角度、监管疑虑与未决问题
        blocks:
          - type: paragraph
            body: |
              几个不利角度需要尽调关注。第一，IPO 状态存在主动争议。第三方跟踪器 TechStackIPO 称 Ro
              「已于 2026 年 2 月向 SEC 提交 S-1——IPO 正在积极推进」，并给出 $5B 估值。但截至 2026 年 6 月运行日期，
              查询 SEC EDGAR（CIK 0001706332）只返回 Form D 豁免发行通知（七轮，2017–2022），没有 S-1 或 S-1/A
              注册声明。Reitano 2021 年 3 月确实表示上市是「何时而非是否」的问题，但没有发行文件确认 IPO 启动。
              这一矛盾是实质尽调警讯；在 SEC 文件确认之前，TechStackIPO 数据必须视为未经验证的第三方猜测。

              第二，Biospace 2025 年 9 月的分析提出监管套利疑虑：Serena Williams 在 Super Bowl 广告和社交媒体上
              推广 Ro 的 GLP-1 产品，却没有披露药企必须纳入的药品级副作用警示。Biospace 认为，远程医疗公司利用 FDA
              管辖空白（FDA 覆盖药企，但传统上不覆盖作为处方方的远程医疗提供商）。FDA Commissioner Marty Makary
              在一篇 JAMA 文章中明确点名远程医疗公司，并宣布 2025 年执法政策转向；约 100 封执法信发给存在药品推广违规的公司。
              Hims & Hers 被认定是 Super Bowl 广告的一名收信方。Ro 在这一监管转向中的暴露重大，且尚未完全解决。

              第三，消费者投诉数据有限。Ro 的 Trustpilot 页面返回 403 错误，拟访问的 BBB 资料 URL 重定向到无关实体，
              导致无法直接汇总客户评价数据。多个二级来源提到存在投诉，但投诉频率和解决率无法验证。

              第四，收入和估值数字依赖第三方估算。Sacra 是有声誉的私营市场分析机构，但 Ro 收入并未公开披露。
              $598M 估算、66% 增长率以及约 $370M 的 GLP-1 占比，都是 Sacra 基于消费者信用卡数据和行业建模得出的估算，
              不是经审计财务数据。Sacra 将 TrumpRx（2025 年 11 月宣布的联邦采购平台）识别为 Ro GLP-1 订阅经济性的结构性威胁：
              该平台通过竞争渠道以约 $350/月提供 Wegovy，促使 Ro 降价匹配。
