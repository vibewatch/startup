  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反方逻辑与建议
        blocks:
          - type: paragraph
            body: >-
              Ro 在消费者医疗增长最快的细分赛道里占据结构性优势位置：面向患者直连的 GLP-1 体重管理。Sacra 估算其 2024 年收入约 $598M，较 2023 年约 $360M 同比增长
              66%——很少有私营数字健康公司能匹配这条轨迹。垂直整合的 Ro OS 平台（患者互动、远程医疗问诊、自有药房、居家诊断）制造了纯远程医疗市场平台没有的切换摩擦。与 Novo Nordisk 和 Eli
              Lilly 就品牌 Wegovy 与 Zepbound 建立的制造商合作，带来分销可信度，也提供复方药禁令后的业务连续路径。


              反方逻辑同样具体。2022 年 2 月的 $7.0B 估值——相当于 2024 年收入估算的 11.7×——是四年前的标记，诞生于已经不存在的成长资产市场高点。每一家公开 DTC
              远程医疗可比公司都已重新定价：最直接的可比 Hims & Hers，FY2025 收入 $2.35B、市值 $7.85B，交易倍数约为 FY2025 收入的 3.3×；Teladoc 约为 FY2024 收入的
              0.5×；LifeMD 约为 FY2025 收入的 1.0×。即使用 Hims 的溢价套到 Ro 2024 年收入估算上，隐含价值也只有约 $1.8–2.0B——不到 2022 年标记的三分之一。关键在于，Ro
              不发布经审计财务报表，没有提交 S-1，也没有披露 2025 年收入数据；GLP-1 复方药禁令后的过渡可能已经造成重大的收入和利润率拐点，而方向和幅度都未知。


              建议是有条件持有：Ro 是可信的品类领导资产，值得耐心资本关注；但考虑可比公司、披露缺口和禁令后收入不确定性，按 $7.0B 或接近该水平进入并不成立。机构投资最低可接受框架，是在 $1.5–2.5B
              谈判估值区间设尽调门槛，并以收到经审计 2023–2024 年财务报表和 2025 年 YTD 收入为条件。
