  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 核心风险栈——FDA 执法合流是最紧迫的近期威胁
        blocks:
          - type: paragraph
            body: >-
              Ro 的风险画像由一个监管与商业合流的威胁主导，这与大多数数字健康尽调场景结构上不同。2026 年 FDA 三个连续动作——2 月声明限制面向大众营销的配制商使用 GLP-1 API，3 月向远程医疗公司发出
              30 封 warning letter，4 月拟议规则将 semaglutide、tirzepatide 和 liraglutide 排除出 503B 配制 bulk list——都收紧了 Ro 估计贡献 62%
              收入的产品线环境。截至 2026 年 6 月，公开记录中尚未识别出针对 Ro 的直接执法行动；但行业态势很明确：FDA 已释放信号，DTC 远程医疗公司必须清除任何残留的配制 GLP-1
              营销、暗示同等性的主张或非品牌产品采购，而这些做法正是 2022–2024 年短缺时期的特征。


              这种监管合流直接传导到 Ro 的二阶风险。药厂依赖极强，因为 Ro 没有公开披露与 Novo Nordisk 或 Eli Lilly
              的供应协议，短缺例外到期后也没有配制兜底选项。财务不透明又放大了两类风险：没有经审计财务、没有 S-1，且 $7.0B 标记已陈旧四年，投资者无法独立验证 Ro
              是否有资本或合规基础设施穿越执法浪潮。治理不透明——包括未解决的 Ohanian-Williams 关联方问题——又增加了第三层可验证性风险。
            claimRefs:
