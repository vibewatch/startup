  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入规模与结构
        blocks:
          - type: paragraph
            body: >-
              Sacra 是覆盖数字医疗独角兽的头部私营公司研究平台，估算 Ro 2024 年收入约为 $598M，较 2023 年估算约 $360M 同比增长约 66%。这些是未经审计的第三方估算；Ro
              作为私营公司没有披露公开财务。2024 年收入的主导驱动因素是 GLP-1 减重药物，Sacra 估算其贡献约 $370M——约占总收入 62%——反映消费者对 semaglutide 和 tirzepatide
              处方的爆发式需求。


              Ro 更早的收入轨迹显示，GLP-1 需求激增前，2022 年收入约为 $150–200M。2022 至 2024 年的增长跃迁与全行业 GLP-1 处方热潮高度同步，但也制造了单一品类集中风险：如果 GLP-1
              收入因 FDA 复方禁令、药企定价决策或竞争动态受扰，收入线将高度暴露。 非 GLP-1 收入流（男性健康 Roman、一般药品 Ro Pharmacy、Ro Body / 健康项目）合计估算约占 2024
              年总额的 $228M， 但没有公开的分部级拆分。


              FDA 2025 年初将 semaglutide（以及 tirzepatide）移出短缺清单，实际上禁止 Ro 及同行提供更低成本的复方 GLP-1。 Ro 的应对——转向品牌 Wegovy 和 Ozempic
              处方——把大量收入转为品牌药转手收入，其毛利率远低于复方配方。若无法获取经审计或管理层披露的财务数据， 这一转型对 2025 年收入和利润率的完整影响仍未知。
