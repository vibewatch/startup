      - number: '7.5'
        title: 客户、声誉与营销合规风险
        blocks:
          - type: paragraph
            body: >-
              Ro 的客户口碑信号分裂，给营销效率和订阅留存的承保判断带来风险。Trustpilot 有 25,000+ 条评价，评分 4.6/5，这是规模化的正面信号。但 BBB 的 36 条评价只有
              1.28/5，集中在账单混乱、取消订阅困难和药品履约问题上——这些反向信号表明，最不满、也最可能公开升级投诉的客群承受了不成比例的摩擦。BioSpace 还特别指出，Serena Williams
              品牌大使活动发生在 FDA 收紧 DTC GLP-1 营销监管的背景下。


              如果 Williams 活动内容包含暗示 GLP-1 疗效相同的表述——FDA 2026 年 3 月警告信明确禁止这类语言——该活动就会给 Ro 带来直接合规敞口。FDA
              扩大对社交媒体药品广告的执法，提高了名人驱动活动被审查的概率。Ro 的临床结局数据能为部分疗效主张提供支撑，但这些证据只适用于 semaglutide，不能自动延伸到 Ro 处方目录中正在营销的每一种
              GLP-1，也不能覆盖仍被线上索引的每一个营销素材。
