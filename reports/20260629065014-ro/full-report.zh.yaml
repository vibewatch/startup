  - id: TV005
    title: Thesis-Break 与 Kill Triggers
    columns:
      - 触发项
      - 阈值或事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - FDA 直接对 Ro 执法
        - 因 GLP-1 营销或复方制剂向 Ro 发出警告信、同意令或禁令
        - 收入立即受扰动；声誉受损；潜在产品暂停；熊情景启动
        - 退出或不进入；若已投资，执行重大不利变化条款
      - - 2025 年数据确认收入下滑
        - 经审计或管理层披露的 2025 年收入低于 $500M（较 $598M 2024E 下降 >16%）
        - 确认复方禁令造成结构性收入损失；基准情景向熊情景坍缩
        - 将进入估值重新谈到 $300–600M 区间；要求盈利路径承诺
      - - Hims 或 Amazon 拿下品牌 GLP-1 主导份额
        - Hims 品牌 GLP-1 收入超过 DTC 市场 60%；Ro 留存同比下降 >20%
        - Ro 失去品类领导优势；倍数压缩至 LifeMD 区间（<1×）
        - 从基准下调到熊；任何追加投资前复核竞争策略
      - - Down-round 或低于 $1.0B 的 acqui-hire
        - Ro 以低于 $1.0B 的隐含估值融资或完成交易
        - 确认熊论点；$7.0B 进入将严重稀释；普通股价值接近归零
        - 逻辑破裂；在首次可行机会退出；按损失确认记录
      - - CEO 或联合创始人离任且无继任安排
        - Zachariadis 或创始团队成员离任，且未指定替任者
        - 执行风险放大；机构投资者信心受损；IPO 时间线后移
        - 暂停新增投资；推进前要求董事会治理更新和继任计划
    notes: 触发项具有前瞻性，基于公开可观察信号。阈值为尽调估计，不是公司指引。收入阈值以 Sacra $598M 2024E 为基准；下滑幅度相对该估计计算。
    claimRefs:
      - CV041
      - CV043
      - CV046
      - CV053
      - CV055
      - CV058
  - id: TV006
    title: 最终尽调要求
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 经审计财务报表
        - FY2023 和 FY2024 经 PCAOB 审计的 P&L、资产负债表和现金流量表
        - Sacra 收入估计（$598M 2024E）未经验证；毛利率、烧钱速度和债务未知；没有审计数字就无法做投资承销
        - 公司管理层；作为 term sheet 前置条件；接触 PCAOB 注册审计师关系
      - - 2025 年收入和 GLP-1 品牌药经济性
        - 管理层披露的 2025 年 YTD 收入；品牌 Wegovy 和 Zepbound 处方的毛利率；禁令后的患者留存率
        - 2025 年 5 月 FDA 复方禁令是 Ro 近期历史上最大的单一财务事件；完整 P&L 影响是本次估值最关键未知数
        - 管理层 data room；如可取得，用 NovoCare/Lilly 配药量数据交叉验证
      - - 股权结构和优先权堆叠
        - 完整股本结构表，包括优先权、清算优先权、参与优先条款、反稀释条款，以及任何未行权权证或期权
        - 任何低于 $3.0B 的退出中，$1.03B+ 股权融资形成的优先权堆叠可能吃掉大部分甚至全部留给普通股股东的剩余价值
        - 公司法律顾问；通过 data room 索取；审阅 Series E term sheet
      - - SVB 信贷额度替换
        - SVB 2023 年 3 月倒闭后的当前债务安排、未偿余额、契约包和到期计划
        - 未知债务安排可能包含限制性契约，影响 M&A 或 IPO；未偿债务会降低退出时的股权价值
        - 公司 CFO 和法律顾问；投资前需要信贷额度协议
      - - GLP-1 患者留存和流失数据
        - 使用品牌 Wegovy 和 Zepbound 的 GLP-1 患者月度 cohort 留存率；按渠道和药品拆分的 12 个月 LTV 估计
        - GLP-1 LTV 决定单位经济和支撑高 CAC 的能力；没有留存数据，就无法建模单患者盈利能力
        - 公司 data room；用 NovoCare 注册率和 Lilly Zepbound 计划参与情况交叉检查
      - - 二级市场交易和参考标记
        - 2023–2026 年任何 Ro 股权二级要约回购、员工股票购买，或 CrossOff/Forge/EquityZen 交易价格
        - 二级市场价格比 2022 年融资轮更能反映当前标记；没有二级活动本身也提示流动性风险
        - Forge Global、EquityZen 或 Nasdaq Private Market 的公开挂牌二级交易；公司法律顾问提供任何要约回购记录
    notes: 尽调要求来自本章和前几章的信息缺口分析。优先级：（1）经审计财务，（2）2025 年收入，（3）股权结构——这三项是任何投资决策的门槛。其余项目也重要，但优先级次之。
    claimRefs:
      - CV051
      - CV052
      - CV053
      - CV054
      - CV055
      - CV056
      - CV057
      - CV058
