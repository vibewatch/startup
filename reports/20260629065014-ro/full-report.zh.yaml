      - number: '2.5'
        title: 约束与逆风
        blocks:
          - type: paragraph
            body: >-
              推动 Ro 增长的同一波 GLP-1 热潮，也带来集中风险。NCSL 数据显示，品牌 GLP-1 月标价仍为 $936–$1,023； 同一 NCSL 调查发现，即便有保险，约一半已参保 GLP-1
              用户仍称分摊金额过高。Ro 的现金自付患者承担 100% 成本， 持续依从性取决于复方 semaglutide 是否可得（更便宜但法律地位不稳），或患者是否愿意支付品牌标价。

              FDA 对复方药的收紧是最尖锐的近端约束。FDA 已表示，随着药企供应恢复，将把 semaglutide 和其他 GLP-1 从短缺状态中移除， 这会禁止复方药房合法生产这些药物。Ro
              的减重供应跟踪页面承认供应波动，BioSpace 也指出监管套利疑虑：Ro 的 Serena Williams GLP-1 营销活动与 FDA 对复方实践加强审查同时发生。这给 Ro 2024 年约 62% 来自
              GLP-1 产品的收入带来二元风险。

              远程医疗开方监管又增加了一层摩擦。CCHP 2025 年秋季报告显示，虽然多数州扩大了远程医疗覆盖，但各州开方规则、跨州医生执照、 以及 Ryan Haight Act 对受控物质开方的要求仍是 DTC
              平台的合规约束。跨州医生执照带来运营复杂度，也限制 Ro 扩大医生网络的速度。

              雇主覆盖动态有利有弊。雇主代表增长机会，但 KFF 发现，许多雇主正在主动收缩 GLP-1 减重用途覆盖，或加强覆盖要求。 IFEBP 报告称，覆盖 GLP-1 减重用途的雇主计划中，82%
              使用使用管理作为控费机制。这意味着 Ro 的任何雇主渠道都会面对阶梯治疗、 事先授权和资格门槛，从而抬高 CAC、降低转化。

              最后，停药经济性在结构上很难。真实世界数据表明 GLP-1 停药率高，PHTI 2025 年报告也明确警告：没有结构化行为支持时， 停止 GLP-1
              治疗的患者会迅速反弹增重。高流失会压低生命周期价值，迫使公司持续重新获客——即便新增患者需求增长，CAC 强度也会持续拖累业务。
