      - number: '6.5'
        title: 负面信号与客户摩擦
        blocks:
          - type: paragraph
            body: >-
              Ro 的 BBB 档案显示，基于 36 条投诉驱动评论，评分为 1.28/5.0，显著低于 Ro 在 Trustpilot 的 4.6/5。Innerbody
              评论中心记录的投诉主题集中在两个方面：订阅取消流程沟通不清，以及保险覆盖预期未兑现。Healthline 独立报告称有「一些关于响应慢、缺少沟通以及配送和账单问题的报告」，在定性层面印证 BBB 投诉画像。BBB
              样本量较小（36 条评论，对比 Trustpilot 25,000+ 条），统计意义有限；但三个独立来源的投诉类别一致——取消摩擦、账单清晰度和沟通延迟——构成值得在规模化下监测的结构性客服风险。

              一个重要访问限制压缩了 Ro 可触达患者人群：Ro 明确不为 Medicare、Supplemental Medicare、Tricare 和 Medicaid
              等政府资助计划协调保险覆盖。持有这些计划的患者只能作为自费会员加入 Ro Body，并且仅限部分药物；Medicaid
              患者和某些其他政府资助计划患者完全没有资格加入。这一排除限制了低收入和老年人群的访问，而这些群体承担着部分最高肥胖负担；它削弱了 Ro 的访问公平叙事，也在 Medicare GLP-1
              肥胖覆盖扩大时形成潜在监管暴露。Innerbody 还指出，Ro 移除了心理健康远程医疗平台和过敏药物配送项目；这些服务线收缩可能反映 GLP-1 资源集中，但也降低了既有用户的产品宽度。
            claimRefs:
