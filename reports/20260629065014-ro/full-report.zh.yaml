      - number: '3.5'
        title: Ro 的相对位置、护城河耐久性与被替代风险
        blocks:
          - type: paragraph
            body: >
              相比纯 D2C 同行，Ro 的结构性优势包括：（1）自有药房网络，带来更紧的单位经济和供应链控制；（2）GLP-1 供应跟踪
              （ro.co/weight-loss/supply-tracker），展示运营成熟度和患者信任；（3）Roman（男性性健康和一般健康）、Rory（女性健康）、 Zero（戒烟）和 Modern
              Fertility（生育和家庭计划）等多品牌深度，组合可比 Hims & Hers，宽于 LifeMD 或 Thirty Madison。 但 Ro 估算约 62% 收入集中在 GLP-1，与 Hims &
              Hers（个性化 / GLP-1 占美国收入 >70%）高度相似；随着 GLP-1 市场成熟， 两个平台都容易受到 FDA 对复方的执法以及品牌药价格压缩影响。

              相比 Hims & Hers，Ro 的关键竞争缺口是披露质量和资本可得性。Hims 有上市公司披露节奏、订阅用户指标和约 $10.1B 市值， 可用于收购和员工薪酬。Ro 的 $7B 2022 年私募估值形成于
              GLP-1 成为主导收入驱动因素之前；以当前估算 $598M 收入为基数， 隐含倍数很可能已经过期。截至运行日期没有 S-1 提交，Ro
              的财务控制和审计质量未接受公开审视；这对机构投资者和大型雇主伙伴都是实质尽调风险。 Teladoc 的 Walmart 分销合作和 Amazon 的 Prime 分发模式共同指向一个风险：未来 3–5
              年，实体零售或平台聚合可能侵蚀 Ro 的直达患者获客成本优势。
