        - 2025 年 5 月复方禁令后的 GLP-1 收入拐点可能显著改变图景
    notes: 所有评估均基于公开可得的第三方估计（主要是 Sacra）和截至 2026 年 6 月的上市可比公司交易数据。Ro 不发布经审计财务；本报告未纳入任何经验证的内部财务数据。
