      - number: '5.2'
        title: 端到端患者流程
        blocks:
          - type: paragraph
            body: >-
              Ro 的运营模型把一次初始患者访问，完全在 ro.OS 内转化为长期照护关系。流程从患者通过 Patient App 完成针对具体病种的在线问诊问卷开始；随后 Care Delivery App 将这份
              intake 推送给 Ro 关联服务提供者异步审核。服务提供者用 EMR 评估患者病史、判断资格，并在适当情况下开出处方，全程无需患者同步在线。

              GLP-1 减重场景里，处方生成后，Ro 的保险 concierge 模块代表患者处理事先授权和保险覆盖文件。自费患者可在一周内收到第一剂 GLP-1；保险患者通常需要约两到三周等待覆盖判定。处方由 Ro
              的药房网络履约；品牌 GLP-1 则可直接由药厂项目（NovoCare、LillyDirect）发货。

              后续照护通过 Patient App 的 Care Comms 功能管理，患者可随时向服务提供者询问副作用、进展更新或问题。Care Delivery App 的 Health Tasks
              模块提供智能任务优先级，让服务提供者和护理团队更高效分诊回复。实验室检测通过 Lab App 接入闭环：服务提供者可以订购居家检测试剂盒，或引导患者前往全国 Quest Diagnostics
              网点，结果会自动回流到患者病历。Ro 创始人信还提到一项基于 LLM 的不良事件分诊能力，准确率 94%、平均响应时间 33 分钟；但该具体性能数据仅来自公司。
