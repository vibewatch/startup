        - DTC 会员模式承受结构性压力；若转向保险驱动渠道或 B2B 路线，需要重做关键战略和成本架构
    notes: >-
      这些 kill criteria 都设计成可从公开来源监控——FDA 警告信数据库、Ro 自有供应追踪器、第三方新闻、BBB 和雇主福利调查——不依赖内部访问。短期最关键触发项是 FDA 直接对 Ro
      采取行动；截至报告日尚未发生，但在当前执法姿态下，这是最清晰的 thesis-break 事件。
