        - Care Comms 消息触发 Care Delivery App 中的自动副作用提醒
        - 实时副作用报告；LLM 辅助分诊；药剂师可标记禁忌症
        - LLM 准确率数据仅来自公司口径；不良事件升级协议没有公开基准
