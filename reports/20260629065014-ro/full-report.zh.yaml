      - number: '6.4'
        title: 客户体验与满意度信号
        blocks:
          - type: paragraph
            body: >-
              Ro 的客户满意度证据主要锚定 Trustpilot 体量：超过 25,000 条评论，综合评分 4.6/5。Ro 评论页面上的会员证言突出四个反复出现的满意度驱动因素：保险 concierge
              代办事先授权、无需患者自行处理；服务提供者响应快且沟通个性化；supply tracker 带来供应确定性；结构化每周 check-in 帮助持续推进。Billy S.、Colleen B.、Kristen B.
              和 Stephanie T. 等具名会员在 Ro 自有营销材料中描述体验，称获得了「新的自信」、从保险复杂性中解脱，并取得有意义的减重结果。

              独立第三方评论也印证了便利性和服务提供者质量。Innerbody 对多个 Roman 产品线做了上手测试，给出 4.25/5 的整体评分（5
              分制），理由包括便捷的在线界面、可获得经验证治疗、执照医生经过严格背景审查、免费 follow-up 和消息沟通、定价透明，以及标准两日免费配送。Innerbody 指出 Roman 缺少实时聊天支持，而竞争对手
              Hims 提供该功能；部分服务线（心理健康、过敏）被移除，对既有用户而言是负面因素。

              US News 的 2026 年 GLP-1 服务提供者评分卡特别认可 Ro 的保险支持团队，认为其帮助处理事先授权和保险相关问题，使 Ro 位列 GLP-1 保险访问最佳提供者之一。Healthline 承认
              Ro 的便利性和隐私配送是优势，但也报告了一些摩擦信号，包括部分用户反馈响应慢、配送和账单问题。第三方验证确认了 Ro 的核心访问论点，同时标记出负面评论中同样出现的运营摩擦区域。
