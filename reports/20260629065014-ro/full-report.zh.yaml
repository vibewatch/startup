      - number: '1.4'
        title: 产品组合、规模与关键里程碑
        blocks:
          - type: paragraph
            body: |
              Ro 2017 年 10 月从单一病种男性性健康平台（勃起功能障碍）起步，之后扩展到减重 / GLP-1 管理、
              男性性健康（Roman 品牌）、女性健康（Rory 品牌）、戒烟（Zero 品牌）、生育、脱发、护肤和每日健康补充剂。
              减重 / GLP-1 垂直现在占主导：Sacra 估算 GLP-1 收入 2024 年约为 $370M（约占总估算收入 62%），
              而 2021 年占比几乎可以忽略。总估算收入从 2023 年约 $360M 增至 2024 年约 $598M，同比增长约 66%。

              Ro 的服务规模可观：截至 2021 年 5 月，公司称其在几乎所有美国县促成超过 800 万次数字医疗问诊，
              覆盖 98% 的初级保健荒漠地区——该数字来自其自有新闻稿。Tracxn 法人实体数据显示，主要运营实体
              ROMAN HEALTH VENTURES INC. 截至 2024 年 12 月 31 日雇用 489 人，相关实体同日显示 496 名员工；
              这些数字并非 Ro 官方披露。

              关键收购里程碑包括 2021 年 5 月收购 Modern Fertility（报道交易价值超过 $225M）。Modern Fertility
              是一家生殖健康公司，由 Afton Vechery 和 Carly Leahy 共同创立；二人分别加入 Ro 担任女性健康总裁和品牌副总裁。
              2021 年，Ro 还收购了 Workpath（居家护理软件 API，支持按需护理和采血）和 Kit（居家诊断初创公司）。
              这些收购支撑了 ro.OS 背后的纵向整合护理路径模式。

              Ro Body GLP-1 会员（$145/月订阅）打包远程医疗、实验室检查、剂量滴定和教练服务。与 Novo Nordisk
              的 NovoCare Pharmacy 以及 Eli Lilly 现金自付渠道的直接合作，使 Ro 能获得品牌 Wegovy、Zepbound
              及其口服类似物（semaglutide pill、Foundayo），从而区别于复方药房，并巩固 Ro 作为药企优先分销伙伴的地位。
              Ro 也发布临床结果数据：平台上的 semaglutide 患者 68 周平均减重 16.6%（655 名患者，经 Obesity 期刊同行评议），
              tirzepatide 患者 12 个月减重 19.5%，支持其向支付方和雇主拓展。
