      - number: '5.3'
        title: GLP-1 减重产品组合
        blocks:
          - type: paragraph
            body: >-
              Ro 最大的商业产品是 GLP-1 减重服务 Ro Body，它把处方 GLP-1 药物与持续照护管理打包。项目首次在线问诊起价 $39；符合条件的患者随后在会员层按年度 Prepay & Save 计划最低支付
              $74/月，药费另计。Ro 明确将其 GLP-1 价格定位为与药厂直销项目一致：「与 LillyDirect、NovoCare 和 TrumpRx 相同」。

              Ro 目前在 Body 会员中提供四种 GLP-1 药物：（1）Wegovy pen（semaglutide 注射剂，FDA 批准用于体重管理和降低心血管风险），药厂试验中最高剂量平均减重约
              19%；（2）Wegovy pill（semaglutide 口服剂，FDA 批准，首月 $149，之后 $199–$299）；（3）Zepbound KwikPen（tirzepatide
              注射剂，被描述为「起效最快的 GLP-1」，药厂试验中平均减重约 20%，首月 $299，之后 $399–$449/月）；（4）Foundayo pill（orforglipron，被描述为「最新获 FDA
              批准的 GLP-1 减重药片」，价格与 LillyDirect 持平）。有保险覆盖的患者可通过商业药房福利获得 Wegovy pen、Zepbound pen 和 Ozempic；若无覆盖，品牌药标价为
              $900–$1,100/月。

              Ro 的 supply tracker 提供实时社区和 FDA 交叉参考工具，展示 GLP-1 短缺状态。截至 2026 年 6 月，所有列示药物按 FDA 定义均显示「短缺已解决」，但 tracker
              仍呈现社区报告的局部供应问题，反映监管配制禁令之后分销脆弱性仍在。GLP-1 药物通过延缓胃排空、降低食欲，并作用于肠道和大脑的 GLP-1 受体来减重。严重安全警示包括甲状腺 C 细胞肿瘤（MTC）、胰腺炎以及
              Ro 安全信息页面和 FDA 上市后安全指引记录的药物相互作用风险。
