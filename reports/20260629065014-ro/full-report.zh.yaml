    columns:
      - 风险
      - 可监测触发器
      - 阈值 / 事件
      - 行动含义
    rows:
      - - FDA 复方执法变成直接针对 Ro 的行动
        - FDA 网站发布点名 Roman Health Ventures 或 Ro 的警告信或同意令
        - FDA 在其公开警告信数据库发布给 Ro 的警告信，或提起禁令申请
        - 立即暂停 GLP-1 营销；开展法律审查；显著收入面临风险；若收入受到实质损害，则投资假设被打破
      - - Novo Nordisk 或 Lilly 供应中断
        - Ro 供应追踪页显示 Wegovy 或 Zepbound 重新进入供应受限，或制造商新闻稿宣布重新分配 DTC 渠道
        - 任何确认的供应减少 > 20%，且影响 Ro Body 订阅用户履约超过 30 天
        - 将增长假设下调 30–50%；重新评估订阅连续性和流失轨迹；触发对供应协议的详细尽调
      - - 估值减记，或融资估值低于 $5B
        - 新一轮融资、要约回购、二级交易或 409A 披露估值明显低于 2022 年 $7.0B 标记
        - 任何公开报道的交易低于 $5.0B，或出现困境融资事件
        - 下调所有估值情景；重新评估退出时点假设；核查清算优先权堆叠是否会损害普通股权益
      - - 营销合规行动，或 BBB/FTC 投诉显著升级
        - 多起集体诉讼提交、FTC 宣布调查，或 BBB 认证被撤销；BBB 投诉量超过当前 36 条评论水平
        - FTC 对 Ro 发出新的民事调查要求，或投诉激增（> 100 起未解决 BBB 投诉）
        - 调整运营成本模型以计入法律抗辩；重新检查客户信任和获客成本假设
      - - GLP-1 市场结构性变化——保险广泛覆盖
        - 大型美国雇主的 GLP-1 覆盖率超过 60%；全国性支付方以标准处方集推出 GLP-1 肥胖适应症福利
