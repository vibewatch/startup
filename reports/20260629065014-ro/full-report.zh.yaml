      - number: '2.2'
        title: 市场规模——TAM、SAM、SOM 与证据约束
        blocks:
          - type: paragraph
            body: >-
              需要多种规模测算镜头，因为没有单一公开估算能隔离 Ro 的现金自付体重管理和 GLP-1 药房机会。最宽的可用框架是美国远程医疗市场—— Grand View Research 估计 2023 年约为
              $87–$114B，并以约 24% CAGR 增至 2030 年估算 $776B； 但这个数字采用宽口径，包含所有支付类型和服务形态。McKinsey 常被引用的后 COVID「四分之一万亿」分析，
              估算美国在慢性护理、行为健康和急诊护理中的可寻址虚拟护理价值为 $250B。两个数字均有访问限制；此处作为上限背景保留， 不直接作为 SAM 输入。

              更窄的需求代理是美国 GLP-1 / 抗肥胖药物市场。NCSL 数据援引 KFF 分析显示，单 Medicaid 2024 年在 GLP-1 上支出约 $9B，高于 2019 年
              $1B——这只代表政府支付方需求。可用公开来源没有直接记录美国 GLP-1 处方总支出（所有支付方）， 但 NCSL 报告称 12% 美国成年人正在使用 GLP-1 药物，且月标价区间为
              $936–$1,023；即便依从率中等， 也意味着一个数十亿美元级年市场。Sacra 估算 Ro 2024 年 GLP-1 相关收入约 $370M、同比增长约 66%， 暗示 Ro 占美国 GLP-1
              患者总支出的低个位数百分比。

              Ro 这个具体现金自付、GLP-1 聚焦模式的自下而上 SAM 很难拆出来，因为多数公开市场数据把远程医疗和处方药分开处理。
              下方规模表保留所有镜头、方法和限制，而不是选择一个估算作为定论。关键尽调缺口列在证据缺口下。

              雇主 GLP-1 支出是一个新兴邻近预算池。IFEBP 2024 年调查显示，对于覆盖 GLP-1 减重用途的雇主计划， GLP-1 药物平均占年度总理赔的
              9.7%。美国私营雇主处方药支出处于数千亿美元量级；即便自保计划只部分覆盖 GLP-1， 也代表 $5–18B 的增量需求层——Ro 这类虚拟体重管理供应商正越来越多瞄准这部分预算。
