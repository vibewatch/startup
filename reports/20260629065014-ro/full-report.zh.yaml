      - number: '8.6'
        title: 退出准备度与尽调结论
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，Ro 的退出准备度明显受限。公司没有提交或宣布 S-1。追踪 IPO 前数字健康披露的 TechStackIPO 显示，Roman Health Ventures Inc.（CIK
              0001706332）没有 PCAOB 审计关系、没有注册承销商，也没有 SEC 预提交活动。SEC 的 EDGAR 数据库显示 Ro 没有当前定期报告或招股书文件。若 2026 年下半年没有加速提交
              S-1，最早可信 IPO 窗口也要到 2027 年，流动性风险延长，并压缩任何按 $7.0B 标记进入的投资者预期 IRR。


              战略 M&A 更可能成为近期退出机制。具备清晰协同逻辑的潜在战略收购方包括 CVS Health（药房分销 + PBM 杠杆）、UnitedHealth Group Optum（医疗服务网络整合）、Amazon
              Pharmacy/Health（规模化数字分销），以及寻求 GLP-1 能力的大型远程医疗既有玩家。任何 M&A 流程都会要求 Ro 先拿出经审计财务报表，因此财务审计本身就是所有退出情景的闸门。


              最终尽调结论：Ro 是高潜力资产，但呈现给市场的价格无法用当前证据验证。$7.0B 标记诞生于截然不同的资本市场环境，当时 FDA 的复方药禁令尚未重塑 GLP-1 收入模型，公开可比公司也尚未下调
              60–90%，更没有积累四年未披露经营表现。机构投资者不应按 2022 年标记承保。考虑投资逻辑，若以经审计财务报表和 2025 年收入透明度为条件，在 $1.5–2.5B 谈判进入，才是公平的风险调整框架。
            claimRefs:
              - CV051
              - CV052
              - CV053
              - CV054
