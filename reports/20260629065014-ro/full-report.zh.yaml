      - number: '2.6'
        title: 图表
        blocks:
          - type: callout
            title: 复方禁令是近期关键收入风险
            body: >-
              Ro 2024 年估算收入约 62% 来自 GLP-1 产品（Sacra）。其中相当一部分收入很可能涉及复方 semaglutide——只有在 FDA 将 GLP-1 认定为短缺时才可获得。如果
              semaglutide 被移出 FDA 短缺清单，Ro 的复方药房模式将面对近期法律悬崖。 这不是假设性风险：FDA 2025 年已把某些 GLP-1 分子移出短缺认定，BioSpace 也指出 Ro
              在监管收紧中的营销问题。 尽调必须量化品牌与复方 GLP-1 收入，并评估 Ro 与 Novo Nordisk、Eli Lilly 的品牌供应连续性协议。
