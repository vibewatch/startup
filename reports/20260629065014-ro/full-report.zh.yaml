      - number: '6.3'
        title: 临床结果与真实世界疗效证据
        blocks:
          - type: paragraph
            body: >-
              2025 年 12 月，Ro 发布了首篇同行评审研究，评估通过远程医疗接受 semaglutide 治疗的长期减重和安全结果。研究由 Weill Cornell Medicine 医生 Dr. Beverly
              Tchang（第一作者）与 Indiana University 教授 David B. Allison 共同署名，发表于 Obesity——The Obesity Society
              的官方期刊。研究纳入了全国随机样本中的 655 名患者；这些患者通过 Ro 平台接受品牌 semaglutide（Wegovy 或 Ozempic）治疗，坚持用药并在 68 周（正负 14
              天）报告体重。样本中女性占 67.9%，平均年龄 45.8 岁，基线 BMI 中位数为 32.3 kg/m²。

              研究发现，68 周时平均体重下降 16.6%（SD 7.5；95% CI −17.1 至 −16.0）。几乎所有患者（95.4%）体重至少下降 5%，82.0% 至少下降 10%，32.8% 至少下降
              20%。安全性特征与 STEP 临床试验一致：最常见副作用为恶心或呕吐（37.3%）和便秘（15.6%），未发现新的安全问题。第 68 周时，52.1% 患者使用 2.4 mg semaglutide
              维持剂量。Ro 的临床项目还包括 Zepbound（tirzepatide）；该药在 SURMOUNT-1 三期试验（NEJM，2022 年）中，在每周 5 mg、10 mg、15 mg 剂量下 72
              周平均体重分别下降 15.0%、19.5% 和 20.9%，整体试验完成率为 86%。

              一个关键方法学但书是幸存者偏差：655 名患者 cohort 只来自坚持到 68 周并报告体重的患者。初始 cohort 总规模未披露，导致真实项目级平均结果无法验证。这项研究是已发表的最大真实世界
              semaglutide 远程医疗数据集，并在 ObesityWeek 2025 展示（八篇摘要），但所有已发表研究都由公司赞助或与公司相邻。
