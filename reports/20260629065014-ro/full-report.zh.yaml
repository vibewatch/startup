      - number: '1.2'
        title: 创始人、领导层与董事会治理
        blocks:
          - type: paragraph
            body: |
              Ro 由 Zachariah Reitano（CEO）、Saman Rahmanian 和 Rob Schutz 共同创立。
              三人都出现在 2017 年和 2020 年 SEC Form D 文件的相关人士名单中。Reitano 的创立动机
              很个人：家族长期病史——多次心脏病发作、癌症、神经系统疾病——以及医生父亲作为非正式健康向导
              的角色，启发他「用软件把他的父亲带进每个人家里」。Reitano 仍是公司的战略、公开叙事和投资者关系核心面孔；
              公司对他的关键人物依赖很高。

              Series A 之后，董事会治理明显扩张。Alexis Ohanian（Reddit 联合创始人、776 Capital）
              在 2018 年 Series A 后加入董事会，之后的 SEC Form D 文件也确认了这一点。Rick Heitzmann
              （FirstMark Capital 董事总经理）持有董事席位，与 FirstMark 作为领投方的角色一致。Tony West
              （前 Uber 首席法务官）于 2020 年 9 月加入董事会，带来监管和法律经验。Hemant Taneja
              （General Catalyst 管理合伙人、Livongo Health 联合创始人）作为投资者代表，对董事会有影响力。
              Margo Georgiadis 曾任 Ancestry.com CEO 和 Google SVP，2021 年 10 月加入董事会，补上消费者数字医疗规模化经验。

              这里存在关联方动态：Alexis Ohanian 是董事和投资人，其妻 Serena Williams 自 2025 年起出现在
              Ro 的 GLP-1 营销活动中，包括一个高曝光的 Super Bowl 广告。Biospace 和其他分析师指出，
              这种关系可能构成潜在利益冲突，也带来监管套利疑虑（见第 5 节）。除截至 2022 年初的来源外，
              当前完整董事会构成无法独立核实；之后若有领导层变动，公开文件中也未确认。
