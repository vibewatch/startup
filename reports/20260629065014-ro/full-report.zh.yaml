      - number: '5.5'
        title: 技术强项与防御性
        blocks:
          - type: paragraph
            body: >-
              Ro 的首要技术差异化，在于拥有完整临床工作流栈。不同于依赖第三方 EHR（Epic、Cerner 或通用远程医疗平台）的竞争对手，Ro 自建了专用
              EMR；按其说法，这套系统「为交付照护而设计，而不是为计费而设计」。Care Delivery App 将患者 intake
              数据、实验室结果、临床笔记和沟通整合到单一界面，减少服务提供者切换上下文。智能任务优先级（Health Tasks）和自动副作用提醒，在规模化下支撑临床质量和吞吐量。

              药房侧，Ro 运营六家自有药房，连接到 Pharmacy App 的分布式履约网络。Pharmacy App
              向药剂师提供实时患者数据、药物禁忌提醒、过敏提醒和身份验证配药；公司称这些能力可减少治疗延误并支持依从性。Sacra 分析指出，Ro
              的纵向整合把自有实验室处理、自有药房和专有供应链可视性结合起来，从而实现当天或次日发药。

              Lab App 的双模式检测——自有居家试剂盒送往 CLIA 认证、CAP 认可的专用实验室，同时接入数千个 Quest Diagnostics
              网点——让患者和服务提供者无需另约诊断，就能获得灵活、可及的检测。结果自动送入患者照护记录，省去人工跟进步骤。Ro 的 LegitScript
              认证确认其遵守在线药房合规标准，为患者和监管方提供基础信任信号。这些资产合在一起形成转换成本：患者的照护历史、实验室结果、处方记录和服务提供者关系都嵌入 ro.OS，迁移到竞争对手会带来运营扰动。
