      - number: '4.4'
        title: 资本结构与前瞻充足性
        blocks:
          - type: paragraph
            body: >-
              Ro 已在五轮已知融资中披露累计募集约 $1.03B 股权资金；最近一笔交易是 2022 年 2 月以 $7B 估值完成的 $150M Series E。Endpoints News、TechCrunch
              以及提交给 SEC 的 Form D 均确认了该轮。更早融资包括 $150M Series C（2019 年）、$200M Series C 延展轮（2020 年）以及 2021 年 3 月以 $5B 估值完成的
              $500M Series D。融资时间线已在公司概览章节详述；本章不重复这些 claim ID，但用本地来源确认已募集资本数字。Ro 还获得过 Silicon Valley Bank 的信贷额度，披露于 SVB
              发布的案例研究。Silicon Valley Bank 于 2023 年 3 月倒闭后，该额度的性质及替代安排未知，成为未解决的资本结构问题。


              没有公开财务报表，账上现金、月度消耗和 runway 都无法验证。如果 Ro 在约 $598M 收入规模已实现现金流盈亏平衡或更好（与成熟、接近 SaaS 的规模化运营模型一致），资本需求可能不大。但 GLP-1
              转向品牌药后，单笔交易收入更高、利润率更低，现金动态可能已出现实质变化。2022–2024 年，利率上升压缩估值倍数，后续融资更难执行，数字医疗整体经历资本收紧。Ro
              上一轮融资距今已超过四年，限制了它指向可信当前估值标记的能力，也可能让任何按 $7B 参考估值退出或融资的路径变得更复杂。
