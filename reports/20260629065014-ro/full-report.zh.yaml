      - number: '7.4'
        title: 收入集中与财务不透明——陈旧估值、未知 runway 与 GLP-1 利润率风险
        blocks:
          - type: paragraph
            body: >-
              Ro 的财务风险由两个少见因素叠加放大：收入高度集中，披露又极度不透明。GLP-1 减重业务约占 2024 年约 $1.03B 收入的
              62%，形成单一产品线敞口；公司没有披露任何对冲、供应合同或替代收入来源来缓释风险。Sacra 的估算是目前唯一可得的收入数字；Ro 不发布经审计财务报表，不披露 EBITDA 或现金流，也不给指引。$7.0B
              估值已经陈旧四年，定在 2022 年市场高点的倍数上，而公开数字健康可比公司后来已经放弃了这类倍数。


              用公开远程医疗公司的倍数套到 Ro 的估算收入上，2022 年估值应大幅折价。自 2022 年 Series E 之后，市场没有公开报道新的融资；没有公开财务数据，也无法独立验证 Ro
              的现金是否足以覆盖合规成本、法律抗辩，以及在当前监管拐点中的增长投入。Hims & Hers 在复方药过渡后的表现也显示，品牌 GLP-1 占比上升会压缩毛利，意味着 Ro
              最重要的产品线可能比短缺期模型更受监管、利润也更薄；而短缺期模型很可能推动了此前的增长跳升。
