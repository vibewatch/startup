      - number: '3.6'
        title: 图表
        blocks:
          - type: callout
            title: FDA 复方执法：全行业 GLP-1 收入风险
            body: >
              FDA 已警告远程医疗公司营销未获批 GLP-1 药物（包括 retatrutide），并截至 2026 年 5 月 31 日收到 990+ 起复方 semaglutide 和 730+ 起复方
              tirzepatide 不良事件报告。进口警示（66-80）限制存在质量疑虑的 GLP-1 API 进入美国供应链。Ro 和 Hims & Hers 的商业模式都在不同程度上依赖复方或个性化 GLP-1
              配方。FDA 在 2025 年初结束复方 semaglutide 短缺豁免，迫使 Hims & Hers 转换其复方模式。Ro 对同一动态的暴露重大但未披露。任何 Ro
              投资者都必须尽调公司的药房复方占比，以及面对进一步执法行动的应急方案。
            calloutType: risk
            claimRefs:
              - CP032
              - CP033
              - CP034
              - CP040
          - type: callout
            title: Hims & Hers 既是同行，也是蓝本
            body: >
              Hims & Hers 采取了与 Ro 基本相同的纵向整合策略——自有药房、建设实验室检测、推出 GLP-1 项目——但它是在上市公司框架下推进， 有披露财务、收入规模为 4×，并通过 ZAVA
              扩张到欧洲。Hims 的 FY2025 10-K 是目前公开可得、映射 Ro 自身商业模式、单位经济和监管风险面的最佳代理。 关键问题是，Ro 的纵向整合和药企关系能否形成相对 Hims
              的持久成本或供应优势，还是 Hims 已经补上差距。
