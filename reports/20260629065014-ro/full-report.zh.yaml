      - number: '4.6'
        title: 财务披露缺口与尽调结论
        blocks:
          - type: paragraph
            body: >-
              Ro 的财务不透明，是本报告最重要的承销阻碍。公司未提交经审计财务报表，未披露毛利率，未发布订阅用户数，也未给出任何可替代的 burn rate 或现金状况指标。仅依赖公开数据的投资者，无法为 Ro
              建立可辩护的财务模型。Sacra 的收入估计（2023 年约 $360M、2024 年约 $598M）是最可信的独立数据点，但没有保证，也可能反映过时信息。


              五个具体缺口卡住了判断：（1）所有收入分部的经审计 P&L；（2）按分部拆分的 COGS 和毛利率，用于验证远程医疗与药房利润率分层；（3）订阅人数和 ARPU，用于验证每用户收入分母；（4）当前现金状况和
              runway，尤其考虑到 SVB 信贷额度可能已迁移、2025 年收入不确定；（5）FDA 配制禁令的财务影响，它取消的很可能是 Ro 利润率最高的 GLP-1 收入流。没有 S-1 文件或 IPO
              进程，意味着若无投资者级别尽调权限，这些缺口短期内不太可能关闭。


              对药厂定价的依赖增加了结构性财务风险：Novo Nordisk 和 Eli Lilly 控制 Wegovy、Ozempic、Zepbound、Mounjaro
              的定价。任何药厂提价、返利结构变化或排他策略，都可能压低 Ro 的经济性，而管理层没有抵消杠杆。Ro 是分销商 / 开方方，不是制造商；这从根本上限制了 GLP-1 分部长期利润率改善。
