      - number: '5.7'
        title: 附录
        blocks:
          - type: callout
            title: 全栈纵向整合是 Ro 的核心护城河
            body: >-
              Ro 在 ro.OS 内拥有患者、服务提供者、药房和实验室工作流；这套自有、非授权平台制造了结构性转换成本。六家自有药房、内部 CLIA/CAP 实验室处理能力和专用
              EMR，并不是数字健康初创公司的常规配置。这套纵向栈支持当天或次日发药、实验室到照护的反馈闭环，以及服务提供者工具；依赖第三方平台的竞争对手，若没有大量资本和工程投入，很难复制。
            calloutType: strength
            claimRefs:
              - CE001
              - CE031
              - CE032
              - CE043
              - CE046
          - type: callout
            title: GLP-1 产品结构性依赖 Novo Nordisk 和 Eli Lilly
            body: >-
              Ro 将 GLP-1 定价定位为匹配 LillyDirect 和 NovoCare，这意味着公司无法低于药厂参考价，也拿不到有意义的药品毛利。Novo Nordisk 和 Eli Lilly 控制 Ro 所有
              GLP-1 药物的供应、标价和可得性。任何药厂提价、返利结构变化或 API 政策变化，都会直接损害 Ro 的经济性，且没有抵消杠杆。配制禁令（2025 年 5
              月）已经是一个先例：外部监管或药厂动作可以在管理层无法控制的情况下重塑 Ro 的产品经济性。
            calloutType: risk
            claimRefs:
              - CE015
              - CE045
              - CE051
          - type: callout
            title: ro.OS 技术深度来自自我描述，缺少独立基准
            body: >-
              Ro 未发布 ro.OS 的 uptime SLA、API 文档、SOC 2 Type II 认证或独立临床结果基准。关于 LLM 分诊准确率（94%）、响应时间（平均 33
              分钟）和平台规模的说法，均来自公司自有沟通。BioSpace 关于远程医疗 GLP-1
              营销监管审查趋严的报道，再叠加消费平台上的负面患者评论，构成定性风险信号：公司口径下的产品质量指标，可能并不能反映规模化后的真实患者体验。
            calloutType: risk
            claimRefs:
              - CE033
              - CE048
              - CE049
          - type: callout
            title: ro.OS 作为封闭平台限制 TAM，但保住整合护城河
            body: >-
              Ro 决定不对外授权 ro.OS，等于放弃了一个能放大每美元基础设施投入收入的 SaaS 商业模式。Workpath（被收购前）等竞争对手已经展示过 B2B API 路线。封闭生态选择意味着，ro.OS
              的价值完全通过患者订阅和药房收入兑现，而不是平台授权收入；商业模式风险因此集中在消费者获客和留存动态上，而不是 B2B 合同稳定性上。
            calloutType: insight
            claimRefs:
              - CE002
              - CE034
              - CE035
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 目标客户分层
        blocks:
          - type: paragraph
            body: >-
              Ro 面向美国自费和商业保险成年人，覆盖五个治疗领域：GLP-1 减重（Ro Body）、男性性健康（Roman）、女性健康和生育（Rory、Modern Fertility）、脱发和皮肤科，以及预防性 OTC
              健康（Ro Zero）。公司完全采用直接面向患者模式，没有雇主或医疗系统销售渠道；所有照护都通过 Ro 网站或移动 App 数字化发起。Ro Body 的目标画像，是希望以隐私、异步、快速方式获得 GLP-1
              药物的超重或肥胖成年人，绕开传统多次就诊的 PCP 到专科转诊周期。

              Roman 产品线面向成年男性，提供 FDA 批准的 ED、PE 和脱发药物，强调隐私、免费远程医疗咨询以及快速无标识发货。Roman 是 Ro 的创始产品，仍有可观品牌认知，但 GLP-1
              减重目前主导收入，估计占 2024 年总收入的 62%。Rory 和 Modern Fertility 面向育龄女性，提供激素健康、生育检测、更年期管理和护肤，采用同样的异步远程医疗模式。Ro Zero
              覆盖戒烟。所有分部仅服务美国，共用同一 ro.OS 基础设施，从而实现跨产品数据利用和统一服务提供者资质验证。Ro 不服务需要线下评估的复杂慢病患者、过去三年没有见过任何临床医生的患者，也不为
              Medicare、Medicaid、Tricare 或 Supplemental Medicare 覆盖患者提供 GLP-1 项目。
