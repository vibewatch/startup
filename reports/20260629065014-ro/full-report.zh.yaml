  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: ro.OS 平台架构
        blocks:
          - type: paragraph
            body: >-
              Ro 搭建了 ro.OS——Ro Operating System——这是一套自有、纵向整合的技术平台，由四个互联应用组成：Patient App、Care Delivery App、Pharmacy App 和
              Lab App。Ro 称，ro.OS 旨在「纵向整合医疗的核心部分，把全国远程医疗、实验室和药房服务放到同一个平台上」。这种统一架构消除了传统照护交付里常见的多系统碎片化：服务提供者不必在独立
              EHR、药房管理系统和实验室门户之间来回切换。

              ro.OS 平台只面向 Ro 患者和 Ro 关联服务提供者，不授权给其他远程医疗公司或医疗运营商；这是一种有意为之的封闭生态策略。Ro FAQ 明确称，该平台「目前不向任何其他远程医疗或数字健康公司开放」。搭建
              ro.OS 的团队包括内部工程师、数据科学家、产品设计师、隐私和安全专家、临床负责人，以及药房和实验室运营专家，Ro 招聘页面均有提及。TechStackIPO 独立将 Ro 描述为一家「后期 /
              Pre-IPO」医疗技术公司，拥有直接面向患者的平台，把远程医疗、诊断和慢病药房整合在一起；这正是 ro.OS 支撑的同一整合模式。

              ro.OS 产品页面记录的关键架构能力包括：结构化患者 intake 和治疗 check-in；用于消息 / 电话 / 视频互动的通信枢纽 Care Comms；用于智能分派护理团队任务的 Health
              Tasks；用于防止处方欺诈的 Patient Identity 模块；以及用于保险导航的 Insurance Support 模块。ro.co 页脚带有 LegitScript
              认证徽章——这是第三方在线药房合规认证；公司还称平台覆盖「全套隐私和安全工具」。
