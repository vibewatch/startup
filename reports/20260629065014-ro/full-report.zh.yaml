      - number: '7.6'
        title: 治理、利益冲突与披露不透明
        blocks:
          - type: paragraph
            body: >-
              Ro 的治理更像一个重大尽调缺口，而不是已确认的问题。董事会构成从未公开披露；2021 年 EDGAR Form D 文件显示 Initialized Capital 和 General Catalyst
              是投资方，但没有列出独立董事。Alexis Ohanian 是投资人，并与 Ro 存在治理关系；他的妻子 Serena Williams 则担任 Ro GLP-1 产品的付费品牌大使。如果 Ohanian
              持有活跃董事席位，这一安排按标准治理框架会构成关联方交易，并在 IPO 阶段的 S-1 规则下需要披露。


              目前没有这类披露，因为 Ro 尚未提交 S-1。TechStackIPO 将 Ro 列为具备 IPO 准备画像的公司，但 EDGAR 确认没有 S-1
              或上市公司文件。治理不透明、估值标记陈旧、财务表现未披露三者叠加，使独立投资承保受到严重限制。任何当前规模的机构投资，都应把完整治理披露包、最新董事会名单、委员会成员明细和关联方政策审查作为第一步尽调要求。
