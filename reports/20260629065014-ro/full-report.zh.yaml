      - number: '4.5'
        title: 上市可比公司与隐含估值
        blocks:
          - type: paragraph
            body: >-
              三家直接面向患者的远程医疗上市公司，为判断 Ro 的财务位置提供了有限但有用的基准。Hims & Hers（HIMS）在模式、规模和 GLP-1 暴露上最接近，披露 2024 年收入 $1,477M（同比增长
              69%）、毛利率 79.4%；截至 2026 年中，经历 2021 年峰值后的显著倍数压缩后，市值约 $4.4B（2024 年收入的
              3.0×）。LifeMD（LFMD）是规模更小的直接面向患者远程医疗运营商，2024 年收入 $212M，披露净亏损，市值约 $0.22B（约 1.0× 收入）。Teladoc（TDOC）锚定悲观情形：2024
              年收入 $2,570M，同比下滑，市值约 $0.8B（0.3× 收入），反映持续净亏损和结构性承压的 B2B 模式。


              Ro 上一轮 $7B 估值意味着约为 2024 年估计收入 $598M 的 11.7×。该倍数显著高于 Hims 当前 3.0× 的倍数，要么反映市场对 Ro 增长和战略可选性的显著溢价，要么只是
              2021–2022 年私募市场峰值后未刷新的陈旧标记。2022–2025 年，数字医疗市场整体倍数被压缩；Ro 没有新一轮融资，意味着其头部估值不反映当前市场条件。若按 Hims 当前倍数标记，Ro
              的隐含市值约为 $1.8B，相比上一轮披露估值可能减记超过 70%。


              一个重要但书：截至 2024 年，Ro 66% 的增长率在较小收入基数上快于 Hims 同期 69% 的增长，但 Hims 接受公开审计，Ro 没有。Ro
              的毛利率、盈利数据和前瞻指引均未经验证，也让任何倍数比较更复杂。
