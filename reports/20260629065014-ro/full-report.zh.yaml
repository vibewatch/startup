              - CU037
      - number: '6.6'
        title: 扩张驱动、集中风险与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Sacra 估计，Ro 2024 年约 62% 的收入来自 GLP-1 减重药物，这种集中度带来实质业务风险。FDA 2025 年 5 月将 semaglutide 移出药品短缺清单，终止了 Ro 的配制
              GLP-1 产品；该产品此前提供了更低成本的获客和留存渠道。这一转向对 2025 年收入、毛利率或订阅用户留存的量化影响未经验证，因为 Ro 自 2022 年融资以来未发布经审计财务或订阅用户指标。

              扩张机会真实且多元。随着雇主 GLP-1 覆盖扩大，Ro 的保险 concierge 能力使其处于有利位置；这是结构性顺风，可能降低对自费的依赖，并扩大可触达患者量。通过 LillyDirect 增加
              Zepbound KwikPen，以及加入 Foundayo（口服 orforglipron，2026 年获 FDA 批准），在更低价格点提供了新入口，可能触达当前被排除的价格敏感人群。tirzepatide
              相比 semaglutide 在可比时间点呈现更强疗效（15–21% 对约 15–16% 体重下降），随着保险覆盖扩大，可能推动临床偏好和处方目录迁移。Ro 在 ObesityWeek 2025
              的研究露出（八篇摘要）以及同行评审结果研究，说明平台层面在投入临床可信度，或可支持服务提供者和支付方关系。

              没有公开 NRR、GRR、cohort 留存、客户数或 LTV 数据，外部无法独立评估扩张经济性。完整尽调至少需要：未经审计的 2025 年按产品分部拆分季度收入、Ro Body 订阅用户留存 cohort
              数据、管理层确认短缺后产品组合，以及保险患者与自费患者结构及其对应利润率拆分。
