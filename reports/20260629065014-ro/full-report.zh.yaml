        - 药品收入估计 <10%；远程医疗 / 咨询层更高
        - 低
        - GLP-1 约占收入 62%；这个规模下的压缩毛利约束盈利能力
        - 拆分每张 GLP-1 处方的药品 COGS 与配药 / 远程医疗毛利
      - - 远程医疗 / 订阅毛利率
