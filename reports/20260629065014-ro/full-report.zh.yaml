      - number: '4.3'
        title: 单位经济性与资本效率
        blocks:
          - type: paragraph
            body: >-
              Ro 是私营公司，披露有限，单位经济性结构上不透明。借助上市可比公司和行业基准，可以搭出几个代理指标。按 2024 年估计收入约 $598M、活跃订阅患者数从数十万到一百万不等来假设（Sacra
              未披露订阅人数），ARPU 大约为每年 $600–$1,500，取决于订阅人数假设。GLP-1 患者若使用品牌 Wegovy，价格约 $936–$1,023/月，单名患者年药房收入超过
              $11,000；但药房毛利率很薄，单名 GLP-1 患者的净贡献有限。


              直接面向患者的远程医疗 CAC 压力较大。Hims & Hers 等竞争对手披露，非 GLP-1 分部每名订阅用户获客成本为 $60–$150；但 GLP-1
              患者多来自付费社交、电视和名人营销，成本可能更高。Ro 与 Serena Williams 的高调合作，以及广泛数字广告投放，都指向减重品类 CAC 偏高。没有公开 CAC 或 cohort
              数据，公共证据不足以支撑回本期分析。


              可比上市基准 Hims & Hers 披露，2024 年毛利 $1,173M（毛利率 79.4%），并在 2024 年首次实现全年经营利润。规模较小的直接面向患者远程医疗公司 LifeMD 披露 2024 年收入
              $212M、净亏损 $23.2M，说明类似模式在较低规模下仍无法盈利。Teladoc 采用企业 B2B 模式，2024 年收入 $2,570M，但因持续净亏损和 B2B 使用量下滑，仍以深度承压倍数交易（约
              0.3× 收入）。这些可比公司意味着，如果 Ro 能在约 $598M 收入规模实现盈利，将强于可比公司表现；但公开证据既无法证实，也无法否定。
