        - 低
        - 高毛利锚点，随着 GLP-1 占比提高决定综合毛利下限
        - 确认各垂直的医生人工成本、每订阅用户平台成本
      - - 客户获客成本（综合）
        - 未知；数字医疗基准 $60–$400/患者
        - 低
        - CAC 决定回本周期和增长效率；Ro 的名人营销暗示 CAC 偏高
        - 披露各渠道、各垂直 CAC；末次点击与综合归因口径
      - - 活跃订阅用户年收入（ARPU）
        - 估计 $600–$2,000/年（区间由未知订阅用户数驱动）
        - 低
