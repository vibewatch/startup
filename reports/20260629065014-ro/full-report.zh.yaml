    approximationNotes: TAM 和 DTC SAM 数值来自访问受限的分析师报告，以及基于 Ro 收入和假设市占区间的反推；应视作数量级估计，而非可引用数字。单位为十亿美元。SOM 是唯一直接来自具名估计的数字（Sacra，2024）。
