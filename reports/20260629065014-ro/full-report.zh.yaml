companyProfile:
  summary: >-
    Ro（Roman Health Ventures, Inc.）是一家总部位于纽约的直达患者医疗公司，由 Zachariah Reitano、Saman Rahmanian 和 Rob Schutz 于 2017 年创立。公司最初以
    Roman 品牌切入男性性健康，之后扩展到 GLP-1 减重、生育、女性健康、戒烟、头发、皮肤和补充剂，并搭建 ro.OS 平台，把患者问诊录入、临床审核、药房履约、实验室和居家护理串起来。Sacra 估算 Ro 2024 年收入约
    $598M，其中约 62% 来自 GLP-1 肥胖护理；这让 Ro 同时成为规模较大的私营 D2C 医疗平台之一，也让公司高度暴露于药品供应、定价和监管变化。
