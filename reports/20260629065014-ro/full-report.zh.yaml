      - number: '8.2'
        title: 最近融资背景与隐含倍数
        blocks:
          - type: paragraph
            body: >-
              Ro 最近一轮定价股权融资是 2022 年 2 月 $150M Series E，Endpoints News、TechCrunch 和提交给 SEC 的 Form D 均已确认。该轮由 ShawSpring
              Partners 领投，公司投后估值 $7.0B。在此之前，Ro 于 2021 年 3 月以 $5.0B 投后估值融资 $500M，由 General Catalyst 领投。所有轮次披露的股权融资总额约
              $1.03B。自 2022 年 2 月以来，没有已确认的股权融资公告——间隔已超过四年。


              $7.0B 标记下的隐含市销率，完全取决于把哪一年的收入放进分母。2022 年 2 月融资时，Ro 2021 年收入估计约 $150–200M，隐含 35–47× 前瞻 P/S。用 Sacra 2024 年
              $598M 估算收入计算，隐含倍数为 11.7×。用 2023 年约 $360M 估算收入计算，融资时倍数约为 19.4×——按今天标准仍然极端。上述数字没有一个基于经审计财务数据。


              标记陈旧是核心尽调风险。Ro 的 SVB 信贷额度披露于银行发布的案例研究，为资本结构增加了一层；SVB 2023 年 3
              月倒闭后，该额度的性质和替代安排均未确认。资本结构复杂性（优先权堆栈、债务、任何管理层或员工流动性安排）从公开来源看完全不透明，在任何投资决策前都必须视为阻断性尽调缺口。
