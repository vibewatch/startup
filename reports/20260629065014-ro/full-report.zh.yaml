      - number: '6.2'
        title: 患者访问路径与项目结构
        blocks:
          - type: paragraph
            body: >-
              Ro Body 的患者访问路径分四步：在线评估、服务提供者审核、保险导航或自费履约、持续照护。评估从针对具体病种的问卷开始，全程在线完成；无需线下就诊，患者可在两天内收到资格判定。Ro
              关联服务提供者异步审核患者病史，并在符合条件时开具 GLP-1 处方（Wegovy、Zepbound、Foundayo 或 Ozempic），不要求同步问诊。

              保险患者由 Ro concierge 团队代为处理事先授权和保险计划覆盖导航，不额外收费，通常需要两到三周得出结果。自费患者绕过保险步骤，可在一到两周内通过 Ro 药房网络，或通过品牌药厂自费渠道整合，收到第一剂
              GLP-1；tirzepatide（Zepbound）对应 LillyDirect，semaglutide（Wegovy）对应 NovoCare。药品由 Ro 药房合作伙伴以隐私包装寄送，运输时间一到四天。

              持续照护包括与指定服务提供者无限异步消息沟通、结构化月度 check-in、一对一行为改变健康 coaching、结构化副作用 check-in、必要时的抗恶心处方支持、Quest Diagnostics
              或居家试剂盒代谢实验室检测，以及访问 Ro 的 GLP-1 Supply Tracker，实时查看 Wegovy 和 Zepbound 可得性。Ro Body 会员首月 $39，之后年度计划 $74/月或月度计划
              $145/月，不含药费。Ro 还与 Serena Williams 合作，作为其 GLP-1 减重项目的营销大使，在传统上未被远程医疗平台充分覆盖的人群中扩大消费者认知。
