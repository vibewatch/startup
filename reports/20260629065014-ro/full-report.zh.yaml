      - number: '3.3'
        title: GLP-1 减重挑战者：Calibrate、Noom、WeightWatchers Clinic
        blocks:
          - type: paragraph
            body: >
              Calibrate 占据一个独特的雇主资助细分：它向雇主而非患者直接销售 GLP-1 开方，打包 1:1 视频教练和生活方式模块。雇主覆盖完整项目成本。 会员三年平均减重
              19%，是一个强临床结果主张。Calibrate 的雇主渠道让它免受 D2C 获客成本影响，但也意味着增长受雇主福利采用周期限制； 相比 Ro 的直达患者模式，其可寻址市场更窄。Calibrate
              仍是私营公司，未披露收入。

              Noom 已从行为减重 App 转向 GLP-1 + 教练的混合模式。当前定价（2026 年 3 月 31 日生效）为首期 $149，之后 $349/月—— 高于多数同行。Noom 项目把行为科学教练与医生开具的
              GLP-1 药物结合，瞄准同时需要药物和行为支持的患者。Noom 有 B2B 部门 （Noom for Health），但其公开 GLP-1 产品主要是 D2C。Noom 引用的一项回顾性研究显示，被开具
              GLP-1 的活跃项目用户比被动用户减重更多， 但证据来自公司报告且样本自我选择。

              WeightWatchers（WW）2024 年 5 月申请 Chapter 11 破产保护，并完成降低债务负担的重组。WW 已在传统 Points 项目之外转向处方减重服务，
              但其品牌与生活方式节食的联想，以及破产程序带来的声誉损伤，在临床 GLP-1 护理市场形成逆风。WW 对 Ro 的主要竞争威胁是品牌级消费者认知， 而不是临床或药理基础设施。
            claimRefs:
              - CP024
              - CP025
              - CP026
              - CP027
              - CP028
              - CP029
      - number: '3.4'
        title: 更广义虚拟护理平台：Teladoc Health 与 Amazon One Medical
        blocks:
          - type: paragraph
            body: >
              Teladoc Health（NYSE: TDOC）是美国虚拟护理规模领导者，但经济模式与 Ro 根本不同。Teladoc 2026 年 Q1 合并收入为 $613.8M（年化约 $2.5B），分为
              Integrated Care（$395.4M，同比增长 2%）和 BetterHelp 心理健康（$218.4M， 同比下降 9%）。Teladoc 通过与 100+ 健康计划和超过半数 Fortune 500
              雇主的关系，服务 100M+ 美国人；2026 年 5 月宣布 Walmart 的 Better Care Services 平台将分销 Teladoc
              的急诊护理、皮肤科和营养服务——说明实体零售可以延伸远程医疗触达。 Teladoc 不拥有药房，也没有直接 GLP-1 开方项目；其体重管理限于病症管理教练和联网设备。Teladoc 的护城河是支付方和雇主网络，
              不是产品宽度。2026 年 Q1 净亏损为 $63.8M（$0.36/股），BetterHelp 已连续几个季度下滑，使其增长轨迹存在不确定性。

              Amazon One Medical（可通过 clinic.amazon.com 访问）把线下初级保健诊所与 24/7 按需虚拟护理结合。Amazon Prime 会员支付 $9/月（$99/年），即可预约当天
              / 次日门诊和虚拟护理；非 Prime 会员支付 $199/年。Amazon 通过 Prime 的分发能力（170M+ 订阅用户） 是其结构性优势：它可以以接近零的边际获客成本向现有订阅用户营销医疗服务。One
              Medical 接受主要保险的预约就诊。One Medical 首页没有 GLP-1 开方项目证据，说明它仍聚焦初级保健和急诊护理，而非慢性病专科化。Amazon 长期想掌握医疗消费者关系——把药房（Amazon
              Pharmacy）、 可穿戴设备（Halo）和初级保健结合起来——这对依赖搜索和社交获客的 D2C 平台构成生死级分发威胁。
