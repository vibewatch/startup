      - number: '7.3'
        title: 药厂与供应链依赖——未签约暴露于 Novo Nordisk 和 Eli Lilly
        blocks:
          - type: paragraph
            body: >-
              Ro 的 GLP-1 业务是两家药企的自费分销渠道：Novo Nordisk 对应 Wegovy 和 Ozempic，Eli Lilly 对应 Zepbound；两者都没有公开披露与 Ro
              的供应协议。2022–2024 年 semaglutide 短缺期间，Ro 还有通过配制药房的替代路径；但短缺结束和 FDA 拟议 503B 排除，已经消灭了这一可选性。如果 Novo Nordisk 或 Eli
              Lilly 将供应重新分配给优先零售药房、PBM 或保险渠道——两家公司历史上都优先考虑这些渠道——Ro 的订阅用户群将面临履约中断，且没有披露的兜底方案。


              Hims & Hers 2025 年 10-K 将药厂供应列为重大风险因素，Ro 面临同样的结构性暴露。Ro 的内部药房通过控制配药提供了一定运营缓冲，但并不改变品牌 GLP-1
              分子上游依赖两家药厂的事实。Sacra 的 Ro 资料明确提到这一集中风险，Ro 自己的公开 supply tracker 也显示，管理层已经把供应连续性视为核心运营问题，而不是理论上的边缘情况。
