          detail: 所有远程医疗形态、所有支付方类型。Grand View Research 估计（访问受限）；仅作指示性上限。包含医院远程医疗、保险计费问诊和所有病种。
          tone: neutral
        - label: DTC / 现金自费远程医疗可触达市场：~$15–$40B（估计）
          detail: 不走保险、患者自费，覆盖慢性生活方式病种的远程医疗。可得公开来源没有直接测量；根据 Ro 收入和假设 1.5–4% 市占率估算。
          tone: positive
        - label: Ro 的 SAM：GLP-1 + 减重 + 性健康 / 男性健康 + 邻近领域：~$15–$25B（估计）
          detail: 现金自费体重管理、GLP-1 药房、性健康、头发 / 皮肤。包含雇主导向项目。高度偏向 GLP-1；Sacra 数据显示 $370M/~$598M = 62% GLP-1 收入集中度。
          tone: positive
        - label: Ro SOM：$598M 2024 年实际收入（Sacra）
          detail: Sacra 估计；同比增长 ~66%。GLP-1 产品 ~$370M，其余来自传统男性健康、生育、诊断和药房。意味着在 SAM 中为低个位数百分比份额。
