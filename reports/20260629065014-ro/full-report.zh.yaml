      - number: '3.2'
        title: 直接 D2C 远程医疗同行：Hims & Hers、LifeMD、Thirty Madison
        blocks:
          - type: paragraph
            body: >
              Hims & Hers（NYSE: HIMS）是 Ro 最直接、也最强的竞争者。FY2025，Hims & Hers 报告收入 $2,347.6M——约为 Ro 估算 $598M 的 4×——拥有约
              2,511,000 名订阅用户，月 ARPU 为 $83。个性化产品（包括复方 GLP-1 配方）占美国收入 70% 以上， Hers 品牌约占美国收入 40%，主要由 GLP-1 和皮肤科驱动。Hims 复制了
              Ro 的纵向整合打法：拥有药房、实验室检测设施和肽制造设施， 并在 2025 年 7 月收购 ZAVA 进入欧洲。其 GLP-1 减重产品线包括 Wegovy Pill（$149/月起）、Wegovy
              Pen（$199/月） 和 Zepbound Vial（$299/月），均要求 Hims 会员资格（首月 $39，之后 $149/月）。Hims 的上市公司披露节奏、订阅用户指标和 $10.1B 市值（2025
              年中）给了它 Ro 作为私营公司无法匹敌的融资能力和品牌可信度。

              LifeMD（NASDAQ: LFMD）规模较小但在增长。FY2025 收入为 $194.1M（增长 25%），约 328,000 名活跃患者订阅用户， 毛利率约
              86%，反映其采用合作药房模式，而非自有履约。LifeMD 约 95% 收入为经常性订阅。其产品覆盖（通过 Wegovy 做体重管理、 女性健康、心理健康、急诊 / 初级护理）与 Ro 大体相似，但缺少让 Ro
              和 Hims 差异化的自有药房基础设施。已披露的收入确认会计重大缺陷 （某些药房安排的代理人 vs. 委托人处理）是近期可信度风险。

              Thirty Madison（运营 Keeps、Cove、Facet 和 Nurx 品牌）以约 $1B 估值融资 $140M，在虚拟优先专科护理中推进按病种划分的多品牌策略。 其 Nurx
              品牌覆盖避孕和性健康，与 Ro 的 Rory 品牌重叠。但 Thirty Madison 没有主要 GLP-1 减重产品，因此对当前 GLP-1 超级周期的暴露有限。
