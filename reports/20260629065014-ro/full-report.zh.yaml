  - id: FV004
    title: 投资 KPI——关键尽调维度的 IC 评分卡
    type: kpi
    layout: compact
    summary: 面向 IC 的 Ro 评分，覆盖市场、产品、客户、经济性、护城河、团队、透明度、风险和估值维度，采用 1–10 分制。
    approximationNotes: 分数反映作者基于本章和前文证据做出的尽调评估。所有分数仅供参考；不代表经审计或公司核验的信息。
    data:
      items:
        - label: 市场机会
          value: 8 / 10
          description: GLP-1 TAM 超过 $100B；远程医疗渗透仍处早期；人口结构顺风强
          status: strength
        - label: 产品 / 平台
          value: 7 / 10
          description: Ro OS 垂直整合有差异化；复方配药禁令移除了利润率最高的产品
          status: strength
        - label: 客户证据
          value: 6 / 10
          description: 临床结果数据强（68 周试验）；Trustpilot 和评测证据混杂；留存未知
          status: neutral
        - label: 单位经济性
          value: 4 / 10
          description: 品牌 GLP-1 相比复方药利润率受压；CAC 和 LTV 未经公开验证
          status: risk
        - label: 竞争护城河
          value: 6 / 10
          description: 垂直整合 DTC GLP-1 先发；Hims 以 4× 规模执行；Amazon 构成威胁
          status: neutral
        - label: 管理层 / 团队
          value: 5 / 10
          description: 创始人经验丰富；公开高管披露有限；Ohanian 关联方问题未解决
          status: neutral
        - label: 财务透明度
          value: 2 / 10
          description: 无审计财务、无 S-1、无 PCAOB 审计师；所有指标均为第三方估算
          status: risk
        - label: 风险画像
          value: 3 / 10
          description: FDA 在该品类执法活跃；GLP-1 集中度 62%；药企依赖极端
          status: risk
        - label: 估值吸引力
          value: 2 / 10
          description: $7B 标记隐含 2024E 收入 11.7×，而 Hims 为 3.3×；已陈旧 4 年；下轮风险高
          status: risk
