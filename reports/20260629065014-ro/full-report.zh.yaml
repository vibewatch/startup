chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与运营模式
        blocks:
          - type: paragraph
            body: |
              Roman Health Ventures, Inc. 是公司法定名称，对外运营品牌为 Ro。
              该实体是 Delaware 公司，SEC CIK 为 0001706332，2017 年注册成立。公司
              2017 年 10 月以 Roman 品牌上线，聚焦男性勃起功能障碍远程医疗。2018 年 9 月
              更名为 Ro，释放出更宽的多病种野心。截至 2026 年 6 月运行日期，用户提供的事实
              显示 Ro 总部位于 221 Canal Street, 3rd Floor, New York, NY 10013；更早的
              SEC Form D 文件列出的地址包括 900 Broadway（2017）和 116 West 23rd Street
              （2020–2021）。

              Ro 宣称的使命，是用尽可能简单、有效的护理帮助患者达成健康目标，并成为每位患者的
              「第一通电话」。商业模式完全是直接面向消费者、现金自付（无需保险），靠临床订阅
              （如 $145/月的 Ro Body 项目）、仿制药和品牌 GLP-1 的药房履约利润，以及居家诊断
              变现。其核心单位经济判断是：纵向整合——在同一平台（ro.OS）下拥有远程医疗、药房、
              实验室和居家护理——可以比单一服务远程医疗竞争者实现更低服务成本和更高患者生命周期价值。

              ro.OS 是 Ro 的专有操作系统，打包了四个集成应用：Patient App（消息、病历、目标跟踪）、
              Care Delivery App（供医生使用的 EMR、质量和安全工具）、Pharmacy App（履约和患者协调）
              以及 Lab App（居家和零售实验室集成）。Ro 网站称其已帮助全美数百万患者、交付数千万次治疗、
              产生数亿次护理互动——这些数字均为公司口径，未见公开审计核验。
