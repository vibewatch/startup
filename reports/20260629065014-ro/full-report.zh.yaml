      - number: '7.2'
        title: 监管与执法风险——FDA、DEA、FTC 与跨州执照复杂度
        blocks:
          - type: paragraph
            body: >-
              FDA 针对配制和误导性营销 GLP-1 的执法行动，是最清晰的即时法律风险。2026 年 2 月的 FDA 声明点名 Hims & Hers 和其他配制药房，但也明确发给大规模营销配制 GLP-1 API
              的公司；这套措辞同样适用于任何在短缺期间提供配制 semaglutide 的 DTC 远程医疗平台。2026 年 3 月的 30 封 warning letter
              针对在配制产品上无限定使用远程医疗公司商标的企业；2026 年 4 月拟议的 503B 排除规则，将永久关闭这些分子的机构药房配制通道。Ro 转向纯品牌药模式，降低了配制暴露；但历史营销资产、Serena
              Williams 大使活动，以及网站 GLP-1 项目页面，仍需按 FDA 当前执法标准审计。


              FTC 的 2021 年远程医疗指引及其对欺骗性健康主张的广泛权限，为 Ro 网站上的减重结果主张增加了平行监管层。DEA 的远程医疗管制药物开方框架影响 Ro 的 Roman 平台，并且可能对
              testosterone 和其他激素产品趋严。跨州复杂度按 CCHP 记录的 50 州差异来管理，但任何单一州若在没有提前通知的情况下限制异步 GLP-1 开方，都可能影响一个实质订阅用户 cohort。FDA
              Commissioner Makary 在 JAMA 评论中承诺终结电视广告 adequate-provision 规则，也给 Ro 可能投放的广播或流媒体广告带来风险。
