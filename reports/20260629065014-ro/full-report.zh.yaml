        - label: 第三方专家评测（Innerbody、US News）
          values:
            - 编辑产品评估
            - 编辑独立；未披露 Ro 付费
            - 2–3 家主要出版物；每家为单一评测团队
            - 定性；无患者层面结果衡量
            - 中——产品质量和体验信号强；样本规模有限
        - label: 具名会员证言（Ro 网站）
          values:
            - 自报满意度和轶事性结果主张
            - 公司策展；Ro 为营销目的筛选
            - 官方网站引用 4+ 名具名会员
            - 轶事性；无验证；减重主张未独立衡量
            - 低——营销材料；不适合作为尽调中的结果主张依据
        - label: BBB 投诉画像
          values:
            - 第三方投诉登记
            - 独立于 Ro；样本偏向投诉人群
            - 36 起投诉；绝对数量低
            - 无结果数据；记录计费、取消和客服摩擦
