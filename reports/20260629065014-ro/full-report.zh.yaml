      - number: '5.6'
        title: 技术约束、依赖与待解问题
        blocks:
          - type: paragraph
            body: >-
              多个结构性约束限制了 ro.OS 的独立性和防御性。第一，Ro 的 GLP-1 产品目前已贡献估计收入的大部分，却完全依赖 Novo Nordisk（Wegovy、Ozempic）和 Eli
              Lilly（Zepbound、Foundayo）提供药品供应、定价和可得性。药厂定价决定、排他安排或 API 政策变化，都可能实质改变 Ro 的经济性，而 Ro 没有抵消杠杆。价格页明确写明 Ro 匹配
              LillyDirect 和 NovoCare 定价，这把 Ro 定位为无法低于药厂参考价的分销商。

              第二，受监管的临床工作流带来运营复杂度。各州远程医疗开方规则不同；事先授权周期（两到三周）制造转化摩擦；GLP-1 安全监测（甲状腺癌风险、胰腺炎、心血管监测）又带来持续临床合规义务。BioSpace
              报道称，2025–2026 年，药企和监管机构正加大审视远程医疗 GLP-1 营销做法，尤其是对名人代言 DTC 活动的监管趋严。

              第三，ro.OS 的技术深度主要来自自我描述。公开证据中没有独立技术审计、正常运行时间统计、软件架构披露或面向开发者的 API 文档。公司关于 LLM 准确率（94%）、响应时间（平均 33
              分钟）和平台规模（「数千万次治疗」）的说法，无法由公开证据验证。Trustpilot 上有患者评论提到处方处理延误和客服挑战，为用户体验质量提供了有限但负面的信号。没有公开技术路线图，外部观察者无法看清 Ro
              的前瞻功能开发计划和基础设施投入。
            claimRefs:
              - CE015
