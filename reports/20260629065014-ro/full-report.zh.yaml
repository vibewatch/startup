      - number: '8.4'
        title: 牛市 / 基准 / 熊市估值情景
        blocks:
          - type: paragraph
            body: >-
              三个情景按收入轨迹、适用倍数和退出条件，为 Ro 的可信估值区间设边界。熊市情景假设 FDA 复方药禁令导致 2025 年收入出现实质性台阶式下滑——Ro 失去大部分复方 GLP-1
              量，品牌药替代不足，品牌药转售经济性又使利润率急剧压缩。如果 2025 年收入降至 $400–500M，并按 LifeMD 到 Teladoc 的 0.5–1× 倍数计算，隐含价值约 $200–500M。相对
              $7.0B，这意味着 93–97% 的下轮折价。


              基准情景假设品牌 GLP-1 过渡能维持 Ro 的增长轨迹：NovoCare Wegovy 储蓄计划（自费起价 $149/月）和 Lilly Zepbound 定价（自费 $299/月）继续对 Ro
              的现金支付患者群可及，即使单张处方利润压缩，销量仍能维持。按 2025E 收入 $600–750M 和相对 Hims 折价后的 2.5–4× 倍数（计入私营流动性不足和信息不对称），隐含价值为
              $1.5–3.0B。


              牛市情景假设 Ro 与 Novo Nordisk 或 Eli Lilly 达成制造商独家或优先合作协议，到 2025 年底收入持续高于市场增长并达到 $800M+，并朝 2026–2027 年 IPO 执行，取得
              5–7× 远期收入溢价。即便在这个情景下，没有有意义的 2025 年增长证据，2022 年 $7.0B 标记也只是勉强可辩护。拉伸牛市——$4.0–6.0B——要求 Ro 拿出类似 2025 年中 Hims
              的财务指标；而 Hims 本身是在 $2.35B 收入基础上才达到那一估值。没有经审计财务报表和已提交 S-1，拉伸牛市概率较低。
            claimRefs:
