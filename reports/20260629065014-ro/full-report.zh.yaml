    title: ro.OS 产品架构：四应用栈
    type: stack
    layout: wide
    summary: ro.OS 垂直整合四个专用应用，覆盖患者入口、临床护理交付、药房履约和实验室诊断。
    data:
      layers:
        - label: 患者入口层
          detail: 面向患者的门户，覆盖所有护理触点
          modules:
            - Patient App — 护理沟通（消息 / 电话 / 视频）、进展跟踪、病历
            - 保险支持模块 — 保障范围导航和事先授权优化
            - 患者身份 — 防欺诈和处方验证
            - GLP-1 供应追踪器 — 实时 FDA + 社区短缺状态
        - label: 护理交付层
          detail: 面向医生的 EMR 和护理管理工具
          modules:
            - Care Delivery App — 专为护理而非计费设计的 EMR
            - Health Tasks — 面向护理团队的智能任务优先级和路由
            - 副作用提醒 — 自动不良事件标记和 LLM 分诊
            - 临床笔记与护理协调 — 跨团队文档
        - label: 药房与履约层
          detail: 药师集成的药品履约和安全工具
          modules:
