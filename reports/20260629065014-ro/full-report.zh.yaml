      - number: '2.3'
        title: 买方、用户与支付方分层
        blocks:
          - type: paragraph
            body: >-
              Ro 当前业务几乎完全是 B2C、现金自付。个人患者同时是买方（注册、输入支付信息）、用户（接受临床护理和药物）和支付方（承担 100%
              成本）。这带来低摩擦、高自主权的动态——患者动机强且自我筛选——但也让业务对自付成本和 CAC 敏感。

              雇主是最可信的新兴买方分层。IFEBP 2024 年脉搏调查发现，受访公共雇主和多雇主计划中，26% 覆盖 GLP-1 减重用途， 63% 只覆盖糖尿病用途。KFF 2025 Employer Health
              Benefits Survey 发现，虽然更多大型雇主开始覆盖 GLP-1 减重用途， 成本担忧正推动许多雇主考虑收缩覆盖，或增加阶梯治疗和使用管理要求。PHTI 2025 年 12
              月雇主指南明确点名虚拟体重管理平台， 称其是雇主赞助 GLP-1 项目的首选落地载体，并识别三个关键阶段——启动、维持和支持性停药——与 Ro Body 的项目结构高度贴合。 这为 Ro
              创造了可信的企业销售动作，尽管尚未披露公开确认的雇主合同。

              药企（Novo Nordisk、Eli Lilly）是结构性变数。它们掌握上游供应关系，并受益于患者量增长。它们可以成为分销伙伴， 但也可能推出竞争性直达患者项目或排他药房关系，从而挤出 Ro。

              Medicaid 和 Medicare 在 Ro 当前模式中基本被排除。NCSL 确认，Medicare 在联邦层面被禁止覆盖单纯减重药物， Medicaid 对肥胖用 GLP-1 的覆盖因州而异，截至 2026
              年 1 月只有 13 个项目覆盖。Ro 是现金自付模式， 未参保患者构成支付方排除细分市场的自然 TAM 天花板。
