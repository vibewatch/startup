              自保雇主代表 $5–18B 的增量需求池，Ro 的纵向整合平台在结构上适合服务这一市场。PHTI 2025 年 12 月雇主指南明确把虚拟体重管理平台 定位为 GLP-1 项目的落地载体。Ro Body
              的三阶段护理模式（临床资格、药物管理、行为支持）直接映射到 PHTI 框架。 但尚无公开披露的已确认企业合同；雇主福利的 B2B 销售周期，也比 Ro 已优化的 DTC 转化漏斗更长、更复杂。
