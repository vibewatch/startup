      - Ro 方案（ro.OS）
      - 可量化 / 已描述收益
      - 已知限制
    rows:
      - - 发起就诊
        - 预约线下门诊（数周）；通勤；在诊所等待
        - 在 Patient App 填写针对病症的在线问卷；医生异步审核
        - 几分钟即可发起就诊，而不是等数周；7×24 可用
        - 异步模式难以覆盖需要线下评估的复杂多系统疾病
      - - 获取 GLP-1 处方
        - PCP 咨询 + 转诊至肥胖专科；多次就诊
        - 医生通过 Care Delivery App 审核初始问诊并开方；通常同一场会话完成
        - 处方路径更快；无需线下就诊
        - 医生资格审核为异步；响应时间 SLA 未公布
      - - 处理保险覆盖
        - 患者自行争取；致电保险公司；手工提交预授权表格
        - 保险管家模块代表患者处理预授权和文书
        - 保险路径约 2–3 周；减轻患者负担
        - 预授权通过率未披露；部分患者的 GLP-1 仍无保险覆盖
      - - 药房履约
        - 带处方去本地药房；库存不确定；可能等待很久
        - Pharmacy App 将处方路由至 Ro 药房网络或品牌厂商发货
        - 现金支付：<1 周拿到首剂；保险：约 2 周；分布式药房网络提供冗余
        - 无保险时品牌 GLP-1 价格：$900–$1,100/月；Ro 无法低于厂商参考价定价
      - - 持续监测和剂量调整
        - 安排复诊；副作用需要另约医生
        - 通过 Care Comms 异步消息沟通；Health Tasks 路由紧急问题；自动副作用提醒
        - 可持续获得护理；基于 LLM 的分诊（94% 准确率、33 分钟响应，公司口径）
        - 无独立验证的正常运行时间或医生响应 SLA
      - - 实验室检测
        - 单独预约 Quest 或医院实验室；人工通知结果
        - Lab App：医生下单居家套件，或将患者路由至 Quest；结果自动集成
