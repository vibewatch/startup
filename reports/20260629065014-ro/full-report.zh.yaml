      - number: '2.4'
        title: 增长驱动因素
        blocks:
          - type: paragraph
            body: >-
              Ro 所在市场的结构性需求逻辑在数字医疗中属于最强一档。NIDDK 报告称，42.4% 美国成年人患有肥胖，另有 30.7% 超重—— 约 230M 成年人处于较高健康风险。CDC 数据显示，40.1M
              美国人患有已诊断或未诊断糖尿病，115.2M 有糖尿病前期； 这部分人群与 GLP-1 临床适用人群高度重叠。该人群规模远超当前治疗能力，在减重医学中形成长期供需失衡。

              GLP-1 需求进一步放大了市场信号。NCSL 报告称，2019 至 2024 年 Medicaid GLP-1 处方增长 8×。CCHP 2025 年秋季报告确认， 44 个州加 DC、Puerto Rico
              和 US Virgin Islands 已颁布私人支付方远程医疗报销法律，24 个州加 Puerto Rico
              有支付同等要求，帮助远程医疗成为被认可的护理渠道。这类监管扩张降低了消费者通过远程医疗寻求护理时的信任摩擦。

              可及性障碍——地理上的医生短缺、专科预约等待时间长、线下体重管理的污名——放大了 Ro 的竞争位置。Ro 的全虚拟模式、
              邮寄药房和无需保险，拿掉了最常见摩擦点。内分泌科和肥胖医学医生短缺，使远程医疗成为结构性替代，而不只是便利性替代。

              雇主在肥胖护理上的成本压力正在产生新的机构需求信号。IFEBP 数据显示，86% 雇主计划赞助方在考虑 GLP-1 覆盖时， 把长期肥胖成本和相关慢性病风险列为首要因素。雇主寻找包含行为教练的管理式项目时，Ro
              的整合平台模式——临床 + 药房 + 支持—— 比纯药房点状供应商更贴合 PHTI 推荐框架。
