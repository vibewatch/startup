  - id: TV002
    title: 正方论点与反方论点
    columns:
      - 论点
      - 支撑证据
      - 哪些因素会改变判断
    rows:
      - - 正方：GLP-1 增长跑道大，Ro 是领先者
        - Sacra 估计 2024 年收入同比增长 66% 至 $598M；行业估计显示 GLP-1 TAM 到 2030 年超过 $130B
        - GLP-1 市场饱和；主要支付方取消覆盖；品牌药定价让 DTC 模式不可行
      - - 正方：垂直整合带来更持久的利润率和留存优势
        - Ro OS 平台覆盖患者、药房、实验室和诊疗交付；自有配药绕开第三方利润
        - Hims 或 Amazon 复制同等基础设施；API 让药房物流商品化
      - - 正方：厂商合作锁定供应和品牌可信度
        - Ro 可接入 NovoCare Wegovy 储蓄计划（自费 $149/月）和 Lilly Zepbound（$299/月）
        - Novo 或 Lilly 指定独家优选伙伴，把 Ro 挡在最优定价之外
      - - 反方：$7B 标记是 2022 年遗留物，与当前可比公司不一致
        - Hims 按 $7.85B 市值交易，对应 FY2025 收入 3.3×；Ro 基于 2024E 收入的隐含倍数为 11.7×
        - Ro 以 $1.5–2.5B 完成新股权融资，把估值标记重置到与可比公司一致的水平
      - - 反方：GLP-1 集中度带来极端单品类脆弱性
        - 估计 2024 年收入约 62% 来自 GLP-1；复方禁令在 2025 年 5 月移除了利润率最高的产品
        - 非 GLP-1 收入（Roman、生育、Ro Pharmacy）扩大到占总收入 >50%
      - - 反方：没有经审计财务，无法做投资承销
        - 未提交 S-1，未披露 PCAOB 审计师，没有公开 P&L 或资产负债表
        - Ro 发布 2023–2024 年经审计财务，并由 PCAOB 注册审计师提交 Form S-1
    notes: 正方论点基于 Sacra 和公开厂商定价来源；反方论点基于截至 2026 年 6 月的上市可比公司市场数据和 FDA 监管时间线。所有收入估计均为 Sacra 第三方估计；Ro 尚未确认。
