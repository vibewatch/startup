      - number: '1.3'
        title: 资本基础与估值历史
        blocks:
          - type: paragraph
            body: |
              2017 年 8 月至 2022 年 2 月，Ro 在七轮有记录融资中累计募集约 $1.03B 一级资本。
              公司 2017 年完成两轮种子轮（8 月：$2.87M；11 月：General Catalyst 领投 $3.1M），
              2018 年 9 月完成 FirstMark Capital 领投的 $88M Series A，2019 年 4 月以 $500M 投后估值
              完成 $85M Series B，2020 年 7 月完成 General Catalyst 领投的 $200M Series C（当时累计融资：
              $376M），2021 年 3 月完成 General Catalyst、FirstMark 和 TQ Ventures 领投的 $500M Series D，
              估值 $5B（当时累计 $876M），并于 2022 年 2 月完成 ShawSpring 领投的 $150M 延展轮，估值
              $7B。所有轮次均可通过 SEC Form D 文件确认，或由至少两个独立新闻或数据来源交叉验证。

              General Catalyst 是最主要的机构资本提供方，领投或共同领投了 Series C 和 2021 年 3 月 Series D。
              Silicon Valley Bank（SVB）提供了并行债务工具，从 Series A 后的 $20M 成长资本工具，扩展到
              Series D 同步的 $125M 循环信贷额度，为营运资本提供弹性。多轮重复出现的投资者包括 SignalFire、
              BoxGroup、Initialized Capital、TQ Ventures 和 Torch Capital，反映机构持续看好。

              截至 2026 年 6 月运行日期，2022 年 2 月之后没有公司确认或向 SEC 提交的融资轮。上一轮定价给出的
              $7B 估值因此已过期超过四年。Sacra 对 2024 年收入 $598M 的估算意味着，按 2022 年估值计算的收入倍数
              约为 11.7x；考虑远程医疗板块整体重估，2026 年很可能无法维持这一比率。自 SVB 2021 年循环信贷额度以来，
              未见公开披露二级交易、可转债或新增债务工具。
