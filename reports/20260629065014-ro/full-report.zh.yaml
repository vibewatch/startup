      - number: '8.5'
        title: 折价因素与上行催化
        blocks:
          - type: paragraph
            body: >-
              六个结构性折价因素使 Ro 的合理估值低于简单收入倍数可比法给出的水平。第一，缺少经审计财务报表，任何关键指标——收入、利润率、现金或债务——都无法独立验证。第二，GLP-1 收入集中（约占 2024
              年估算收入的 62%）造成单一产品线脆弱性：任何 FDA 执法、供应中断或品牌药定价变化，都会不成比例地冲击 Ro 的收入。第三，制造商依赖极端——Ro 没有披露独家供应协议，2025 年 5
              月之后也没有复方药后备选项。第四，$1.03B 股权融资带来的优先权堆栈和债务包袱（另加 SVB 信贷额度）可能在任何低于 $2B 的退出中显著压缩普通股价值。第五，私营流动性不足应相对等价公开市场倍数折价
              20–35%。第六，看不到 IPO 准备（没有 S-1 文件、没有披露公开审计师关系、没有宣布承销商接触），退出时间被拉长，机会成本上升。


              上行催化真实存在，但带有投机性。正式 NovoCare 药房合作或 Lilly Zepbound
              配药协议将释放制造商认可、供应确定性和利润率正常化信号。向支付能力更高的商业保险市场做地域扩张，会改善收入质量。盈利能力证明——哪怕在约 $598M 收入上达到运营盈亏平衡——也会显著提高 IPO
              投资者愿意支付的退出倍数。战略收购方（CVS、UnitedHealth、Amazon Health）如果支付控制权溢价，即使不 IPO 也可能支撑 4–6×，从而压缩退出折价。即便在买方市场，Ro
              的品类领导地位——垂直整合 DTC GLP-1 的规模化先发者——仍是有意义的 M&A 谈判优势。
