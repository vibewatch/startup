  - id: glp1-challengers
    title: "GLP-1 Weight-Loss Challengers: Calibrate, Noom, WeightWatchers Clinic"
    body: >
      Calibrate occupies a distinct employer-funded niche: it sells GLP-1 prescribing
      bundled with 1:1 video coaching and lifestyle modules to employers rather than
      directly to patients. Employers cover the full program cost. Members lose an
      average 19% of body weight over three years, a strong clinical outcome claim.
      Calibrate's employer channel insulates it from D2C customer acquisition costs
      but means its growth is gated by employer benefit adoption cycles, limiting
      its addressable market relative to Ro's direct-to-patient model. Calibrate
      remains private with no disclosed revenue.

      Noom has repositioned from a behavioral weight-loss app to a GLP-1 plus
      coaching hybrid. Current pricing (effective March 31, 2026) is $149 for the
      first period, $349/month thereafter—a higher price point than most peers.
      The Noom program combines behavioral science coaching with clinician-prescribed
      GLP-1 medication, targeting patients who want both pharmacological and
      behavioral support. Noom has a B2B arm (Noom for Health) but its public
      GLP-1 offering is primarily D2C. A retrospective study cited by Noom shows
      that active program users who were prescribed GLP-1s lost more weight than
      passive users, but this evidence is company-reported and self-selected.

      WeightWatchers (WW) filed for Chapter 11 bankruptcy protection in May 2024
      and completed a restructuring that reduced its debt load. WW has pivoted
      toward prescription weight-loss services alongside its traditional Points
      program, but its brand associations with lifestyle dieting and the
      reputational damage from bankruptcy proceedings create headwinds in the
      clinical GLP-1 care market. WW's primary competitive threat to Ro is
      brand-name consumer recognition rather than clinical or pharmacological
      infrastructure.
    claimRefs:
      - CP024
      - CP025
      - CP026
      - CP027
