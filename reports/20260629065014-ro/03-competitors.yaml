callouts:
  - calloutType: risk
    title: "FDA Compounding Enforcement: Sector-Wide GLP-1 Revenue Risk"
    body: >
      The FDA has issued warnings to telehealth companies for marketing unapproved
      GLP-1 drugs (including retatrutide) and has received 990+ adverse event reports
      for compounded semaglutide and 730+ for compounded tirzepatide as of May 31,
      2026. An import alert (66-80) restricts GLP-1 APIs with quality concerns from
      entering the US supply chain. Both Ro and Hims & Hers have business models
      that depend—to varying degrees—on compounded or personalized GLP-1 formulations.
      The ending of the FDA shortage exemption for compounded semaglutide in early 2025
      forced Hims & Hers to transition its compounding model. Ro's exposure to the
      same dynamic is material but undisclosed. Any investor in Ro must diligence the
      company's pharmacy compounding mix and its contingency plan for further
      enforcement actions.
    claimRefs:
      - CP032
      - CP033
      - CP034
      - CP040

  - calloutType: insight
    title: "Hims & Hers Is Both Peer and Blueprint"
    body: >
      Hims & Hers has followed an essentially identical vertical integration strategy
      to Ro—owning pharmacies, building lab testing, launching GLP-1 programs—but
      has done so as a public company with disclosed financials, at 4× the revenue
      scale, and with European expansion via ZAVA. Hims's FY2025 10-K provides the
      best publicly available proxy for Ro's own business model, unit economics,
      and regulatory risk surface. The key question is whether Ro's vertical
      integration and manufacturer relationships provide a durable cost or supply
      advantage over Hims, or whether Hims has closed that gap.
    claimRefs:
      - CP001
      - CP004
      - CP008
      - CP040

