  - id: d2c-peers
    title: "Direct D2C Telehealth Peers: Hims & Hers, LifeMD, Thirty Madison"
    body: >
      Hims & Hers (NYSE: HIMS) is the single most direct and most formidable
      competitor to Ro. In FY2025, Hims & Hers reported revenue of $2,347.6M—
      approximately 4× Ro's estimated $598M—with ~2,511,000 subscribers and
      a monthly ARPU of $83. Personalized offerings (including compounded GLP-1
      formulations) represented over 70% of US revenue, and the Hers brand
      accounted for ~40% of US revenue, driven primarily by GLP-1 and dermatology.
      Hims has replicated Ro's vertical integration playbook: it owns pharmacies,
      laboratory testing facilities, and a peptide manufacturing facility, and in
      July 2025 acquired ZAVA to expand into Europe. Its GLP-1 weight-loss lineup
      includes Wegovy Pill (from $149/month), Wegovy Pen ($199/month), and
      Zepbound Vial ($299/month), all requiring a Hims membership ($39 first month,
      $149/month thereafter). Hims's public filing cadence, disclosed subscriber
      metrics, and $10.1B market cap (mid-2025) give it fundraising and brand
      credibility that Ro, as a private company, cannot match.

      LifeMD (NASDAQ: LFMD) is smaller but growing. FY2025 revenue was $194.1M
      (up 25%), with ~328,000 active patient subscribers and an ~86% gross margin
      reflecting a partner-pharmacy model rather than owned fulfillment. Approximately
      95% of LifeMD revenue is recurring subscription. Its product coverage (weight
      management via Wegovy, women's health, mental health, urgent/primary care)
      is broadly similar to Ro's, but it lacks the owned pharmacy infrastructure
      that differentiates Ro and Hims. A disclosed material weakness in revenue
      recognition accounting (agent vs. principal treatment for certain pharmacy
      arrangements) is a near-term credibility risk.

      Thirty Madison (operating Keeps, Cove, Facet, and Nurx brands) raised
      $140M at a ~$1B valuation and pursues a condition-specific multi-brand
      strategy in virtual-first specialized care. Its Nurx brand addresses
      contraception and sexual health, overlapping with Ro's Rory brand. However,
      Thirty Madison has no primary GLP-1 weight-loss offering, limiting
      its exposure to the current GLP-1 supercycle.
