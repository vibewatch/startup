  - id: broader-platforms
    title: "Broader Virtual Care Platforms: Teladoc Health and Amazon One Medical"
    body: >
      Teladoc Health (NYSE: TDOC) is the scale leader in US virtual care but
      operates through fundamentally different economics than Ro. Teladoc's Q1 2026
      consolidated revenue was $613.8M (annualized ~$2.5B), split between
      Integrated Care ($395.4M, up 2% YoY) and BetterHelp mental health ($218.4M,
      down 9% YoY). Teladoc serves 100M+ Americans through relationships with
      100+ health plans and more than half of Fortune 500 employers, and in
      May 2026 announced that Walmart's Better Care Services platform would
      distribute Teladoc services for urgent care, dermatology, and nutrition—
      demonstrating how physical retail can extend telehealth reach. Teladoc
      does not own a pharmacy and has no direct GLP-1 prescribing program; its
      weight management is limited to condition-management coaching and connected
      devices. Teladoc's moat is its payer and employer network, not product
      breadth. Its net loss was $63.8M in Q1 2026 ($0.36/share), and BetterHelp
      has been declining for several consecutive quarters, creating uncertainty
      about its growth trajectory.

      Amazon One Medical (accessible via clinic.amazon.com) blends in-person
      primary care offices with 24/7 on-demand virtual care. Amazon Prime members
      pay $9/month ($99/year) for access to same/next-day office appointments and
      virtual care; non-Prime members pay $199/year. Amazon's distribution power
      via Prime (170M+ subscribers) is its structural advantage: it can market
      healthcare to an existing subscriber base at near-zero marginal acquisition
      cost. One Medical accepts major insurance for scheduled visits. There is
      no evidence on the One Medical homepage of a GLP-1 prescribing program,
      suggesting it remains focused on primary care and urgent care rather than
      chronic disease specialization. Amazon's longer-term ambition to own the
      healthcare consumer relationship—combining pharmacy (Amazon Pharmacy),
      wearables (Halo), and primary care—is an existential distribution threat
      to D2C platforms that rely on search and social for patient acquisition.
