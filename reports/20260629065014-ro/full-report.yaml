  - id: TV004
    title: Bull / Base / Bear Valuation Scenarios
    columns:
      - Scenario
      - Revenue Assumption (2025E)
      - Applied Multiple
      - Implied Valuation
      - Key Enabling Assumption
      - Primary Downside Trigger
    rows:
      - - Bear
        - $350–500M (compounding ban causes 20–40% revenue decline)
        - 0.5–1.0× (Teladoc-to-LifeMD distressed range)
        - $175M–$500M
        - FDA enforcement or branded drug pricing makes Ro's GLP-1 offer uncompetitive
        - Direct FDA enforcement action; Hims captures most branded GLP-1 volume; revenue falls >30%
      - - Base
        - $600–750M (branded transition sustains growth at reduced margin)
        - 2.5–4.0× (Hims-discounted for private illiquidity and information gap)
        - $1.5B–$3.0B
        - NovoCare/Lilly pricing accessible; Ro retains patient base; branded margins recover to 30%+
        - Revenue stalls below $600M; multiple compresses to LifeMD range on growth deceleration
      - - Bull
        - $800M–$1.0B (manufacturer partnership + new verticals accelerate growth)
        - 5.0–6.5× (Hims-comparable growth premium; IPO readiness demonstrated)
        - $4.0B–$6.5B
        - Preferred manufacturer partnership; audited financials filed; S-1 in progress for 2027 IPO
        - IPO delayed past 2027; market multiple compression; no manufacturer agreement executed
    notes: >-
      Revenue assumptions are scenario-specific estimates, not company-disclosed guidance. Multiples are drawn from
      public-comp trading levels as of June 2026; private-company illiquidity discount of 20–35% is embedded in the
      base-case multiple range. Implied valuations are enterprise value proxies and do not account for preference stack,
      debt, or management carve-outs.
    claimRefs:
