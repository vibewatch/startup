    summary: >-
      Shows how the implied Ro enterprise value changes as the applied P/S multiple moves from distressed-comp levels
      (0.5×) to peak growth-era premium (11.7×), anchored to the $598M 2024E revenue estimate.
    approximationNotes: >-
