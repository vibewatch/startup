      - number: '3.3'
        title: 'GLP-1 Weight-Loss Challengers: Calibrate, Noom, WeightWatchers Clinic'
        blocks:
          - type: paragraph
            body: >
              Calibrate occupies a distinct employer-funded niche: it sells GLP-1 prescribing bundled with 1:1 video
              coaching and lifestyle modules to employers rather than directly to patients. Employers cover the full
              program cost. Members lose an average 19% of body weight over three years, a strong clinical outcome
              claim. Calibrate's employer channel insulates it from D2C customer acquisition costs but means its growth
              is gated by employer benefit adoption cycles, limiting its addressable market relative to Ro's
              direct-to-patient model. Calibrate remains private with no disclosed revenue.

              Noom has repositioned from a behavioral weight-loss app to a GLP-1 plus coaching hybrid. Current pricing
              (effective March 31, 2026) is $149 for the first period, $349/month thereafter—a higher price point than
              most peers. The Noom program combines behavioral science coaching with clinician-prescribed GLP-1
              medication, targeting patients who want both pharmacological and behavioral support. Noom has a B2B arm
              (Noom for Health) but its public GLP-1 offering is primarily D2C. A retrospective study cited by Noom
              shows that active program users who were prescribed GLP-1s lost more weight than passive users, but this
              evidence is company-reported and self-selected.

              WeightWatchers (WW) filed for Chapter 11 bankruptcy protection in May 2024 and completed a restructuring
              that reduced its debt load. WW has pivoted toward prescription weight-loss services alongside its
              traditional Points program, but its brand associations with lifestyle dieting and the reputational damage
              from bankruptcy proceedings create headwinds in the clinical GLP-1 care market. WW's primary competitive
              threat to Ro is brand-name consumer recognition rather than clinical or pharmacological infrastructure.
            claimRefs:
              - CP024
              - CP025
              - CP026
              - CP027
              - CP028
              - CP029
      - number: '3.4'
        title: 'Broader Virtual Care Platforms: Teladoc Health and Amazon One Medical'
        blocks:
          - type: paragraph
            body: >
              Teladoc Health (NYSE: TDOC) is the scale leader in US virtual care but operates through fundamentally
              different economics than Ro. Teladoc's Q1 2026 consolidated revenue was $613.8M (annualized ~$2.5B), split
              between Integrated Care ($395.4M, up 2% YoY) and BetterHelp mental health ($218.4M, down 9% YoY). Teladoc
              serves 100M+ Americans through relationships with 100+ health plans and more than half of Fortune 500
              employers, and in May 2026 announced that Walmart's Better Care Services platform would distribute Teladoc
              services for urgent care, dermatology, and nutrition— demonstrating how physical retail can extend
              telehealth reach. Teladoc does not own a pharmacy and has no direct GLP-1 prescribing program; its weight
              management is limited to condition-management coaching and connected devices. Teladoc's moat is its payer
              and employer network, not product breadth. Its net loss was $63.8M in Q1 2026 ($0.36/share), and
              BetterHelp has been declining for several consecutive quarters, creating uncertainty about its growth
              trajectory.

              Amazon One Medical (accessible via clinic.amazon.com) blends in-person primary care offices with 24/7
              on-demand virtual care. Amazon Prime members pay $9/month ($99/year) for access to same/next-day office
              appointments and virtual care; non-Prime members pay $199/year. Amazon's distribution power via Prime
              (170M+ subscribers) is its structural advantage: it can market healthcare to an existing subscriber base
              at near-zero marginal acquisition cost. One Medical accepts major insurance for scheduled visits. There is
              no evidence on the One Medical homepage of a GLP-1 prescribing program, suggesting it remains focused on
              primary care and urgent care rather than chronic disease specialization. Amazon's longer-term ambition to
              own the healthcare consumer relationship—combining pharmacy (Amazon Pharmacy), wearables (Halo), and
              primary care—is an existential distribution threat to D2C platforms that rely on search and social for
              patient acquisition.
            claimRefs:
