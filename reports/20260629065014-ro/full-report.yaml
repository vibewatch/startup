  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: ro.OS Platform Architecture
        blocks:
          - type: paragraph
            body: >-
              Ro has built ro.OS—the Ro Operating System—as a proprietary, vertically integrated technology platform
              comprising four interconnected applications: the Patient App, Care Delivery App, Pharmacy App, and Lab
              App. Ro describes ro.OS as designed to "vertically integrate the core parts of healthcare, bringing
              together nationwide telehealth, lab, and pharmacy services on one platform." This unified architecture
              eliminates the multi-system fragmentation common in traditional care delivery: providers need not switch
              between a separate EHR, a pharmacy management system, and a lab portal.

              The ro.OS platform is exclusively available to Ro's patients and Ro-affiliated providers—it is not
              licensed to other telehealth companies or healthcare operators, a deliberate closed-ecosystem strategy.
              Ro's FAQ explicitly states the platform is "not currently available to any other telehealth or digital
              health companies." The team that built ro.OS includes in-house engineers, data scientists, product
              designers, privacy and security specialists, clinical leaders, and pharmacy and lab operations experts,
              all cited in Ro's career page. TechStackIPO independently characterizes Ro as a "Late Stage / Pre-IPO"
              healthcare technology company with a direct-to-patient platform integrating telemedicine, diagnostics, and
              pharmacy for chronic conditions—the same integrated model ro.OS enables.

              Key architectural capabilities documented on ro.OS product pages include: structured patient intake and
              treatment check-ins, a communication hub (Care Comms) for message/call/video interactions, Health Tasks
              for smart care-team routing, a Patient Identity module for prescription fraud prevention, and an Insurance
              Support module for coverage navigation. The footer of ro.co carries a LegitScript certification badge—a
              third-party online pharmacy compliance certification—and the company describes a "full set of privacy and
              security tools" across the platform.
