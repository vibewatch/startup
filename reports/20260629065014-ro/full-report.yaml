  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Top risk stack — FDA enforcement convergence is the most acute near-term threat
        blocks:
          - type: paragraph
            body: >-
              Ro's risk profile is dominated by a converging regulatory-commercial threat that is structurally unlike
              most digital health diligence situations. Three sequential FDA actions in 2026 — a February statement
              restricting GLP-1 APIs for mass-marketed compounders, a March wave of 30 warning letters to telehealth
              companies, and an April proposed rule excluding semaglutide, tirzepatide, and liraglutide from the 503B
              compounding bulks list — have each tightened the environment for the product line that drives an estimated
              62% of Ro's revenue. No direct enforcement action against Ro has been identified in public records as of
              June 2026, but the industry posture is unambiguous: the FDA has signaled that DTC telehealth firms must
              eliminate any vestige of compounded-GLP-1 marketing, implied-sameness claims, or unbranded product
              sourcing — practices that characterized the 2022–2024 shortage era.


              This regulatory convergence cascades directly into Ro's second-order risks. Manufacturer dependency is
              extreme because Ro has no publicly disclosed supply agreement with Novo Nordisk or Eli Lilly and no
              fallback compounding option after the shortage exception expired. Financial opacity amplifies both risks:
              with no audited financials, no S-1, and a $7.0B mark that is four years stale, investors cannot
              independently verify whether Ro has the capital or compliance infrastructure to navigate the enforcement
              wave. Governance opacity — including the unresolved Ohanian-Williams related-party question — adds a third
              dimension of verifiability risk.
            claimRefs:
              - CR001
              - CR002
              - CR003
