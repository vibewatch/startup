      - number: '3.5'
        title: Ro's Relative Position, Moat Durability, and Displacement Risk
        blocks:
          - type: paragraph
            body: >
              Ro's structural advantages over pure-play D2C peers are (1) owned pharmacy network enabling tighter unit
              economics and supply chain control; (2) GLP-1 supply tracking (ro.co/weight-loss/supply-tracker) that
              demonstrates operational maturity and patient trust; and (3) multi-brand depth across Roman (men's sexual
              and general health), Rory (women's health), Zero (smoking cessation), and Modern Fertility (fertility and
              family planning), a portfolio comparable to Hims & Hers and wider than LifeMD or Thirty Madison. However,
              Ro's estimated ~62% revenue concentration in GLP-1 closely mirrors Hims & Hers (personalized/GLP-1 >70% of
              US revenue), making both platforms vulnerable to FDA enforcement on compounding and to brand-name drug
              price compression as the GLP-1 market matures.

              Ro's critical competitive gap relative to Hims & Hers is disclosure quality and capital access. Hims has a
              public filing cadence, disclosed subscriber metrics, and a ~$10.1B market cap that provides currency for
              acquisitions and employee compensation. Ro's $7B 2022 private valuation was set before GLP-1 became the
              dominant revenue driver; the implied multiple on an estimated $598M current revenue base is likely stale.
              No S-1 has been filed as of the run date, and Ro's financial controls and audit quality have not been
              subject to public scrutiny, a material due-diligence risk for institutional investors and large employer
              partners. Teladoc's Walmart distribution partnership and Amazon's Prime-based distribution model both
              point to the risk that physical retail or platform aggregation erodes Ro's direct-to-patient acquisition
              cost advantages over a 3–5 year horizon.
