  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold or Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Direct FDA enforcement action against Ro
        - Warning letter, consent decree, or injunction issued to Ro for GLP-1 marketing or compounding
        - Immediate revenue disruption; reputational damage; potential product suspension; bear case activated
        - Exit or do not enter; enforce material adverse change clause if invested
      - - Revenue decline confirmed in 2025 data
        - Audited or management-disclosed 2025 revenue below $500M (>16% decline from $598M 2024E)
        - Confirms compounding ban caused structural revenue loss; base case collapses toward bear
        - Renegotiate entry valuation to $300–600M range; demand path-to-profitability commitment
      - - Hims or Amazon captures dominant branded GLP-1 share
        - Hims branded GLP-1 revenue exceeds 60% of DTC market; Ro retention declines >20% YoY
        - Ro loses category leadership advantage; multiple compresses to LifeMD range (<1×)
        - Downgrade from base to bear; review competitive strategy before any additional investment
      - - Down-round or acqui-hire at less than $1.0B
        - Ro raises capital or completes transaction at implied valuation below $1.0B
        - Confirms bear thesis; severe dilution at $7.0B entry; common equity value approaches zero
        - Thesis broken; exit at first available opportunity; document as loss realization
      - - CEO or co-founder departure without succession
        - Zachariadis or founding team member exits without named replacement
        - Execution risk amplified; institutional investor confidence undermined; IPO timeline slips
        - Pause new investment; request board governance update and succession plan before proceeding
    notes: >-
      Triggers are forward-looking and based on publicly observable signals. Thresholds are diligence-based estimates,
      not company guidance. Revenue threshold uses Sacra $598M 2024E as base; decline severity is relative to that
      estimate.
    claimRefs:
      - CV041
      - CV043
      - CV046
      - CV053
      - CV055
      - CV058
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner or Diligence Path
    rows:
      - - Audited financial statements
        - PCAOB-audited P&L, balance sheet, and cash flow statement for FY2023 and FY2024
        - >-
          Sacra revenue estimates ($598M 2024E) are unverified; gross margin, burn rate, and debt are unknown; no
          investment underwriting is possible without audited numbers
        - Company management; require as pre-condition for term sheet; engage PCAOB-registered auditor relationship
      - - 2025 revenue and GLP-1 branded economics
        - >-
          Management-disclosed 2025 YTD revenue; gross margin on branded Wegovy and Zepbound scripts; post-ban patient
          retention rate
        - >-
          The May 2025 FDA compounding ban is the single largest financial event in Ro's recent history; the full P&L
          impact is the most critical unknown in this valuation exercise
        - Management data room; triangulate against NovoCare/Lilly dispensing volume data if accessible
      - - Cap table and preference stack
        - >-
          Full capitalization table including preference rights, liquidation preferences, participating preferred terms,
          anti-dilution provisions, and any warrants or options outstanding
        - >-
          At any exit below $3.0B, preference stack from $1.03B+ in equity raises may consume most or all of the
          residual value available to common stockholders
        - Company legal counsel; request via data room; review Series E term sheet
      - - SVB credit facility replacement
        - >-
          Current debt facilities, outstanding balances, covenant package, and maturity schedule following SVB's March
          2023 failure
        - >-
          Unknown debt facilities may include restrictive covenants affecting M&A or IPO; outstanding debt reduces
          equity value at exit
        - Company CFO and legal counsel; credit facility agreements required before investment
      - - GLP-1 patient retention and churn data
        - >-
          Monthly cohort retention rates for GLP-1 patients on branded Wegovy and Zepbound; 12-month LTV estimates by
          channel and drug
        - >-
          GLP-1 LTV drives unit economics and ability to sustain elevated CAC; without retention data, profitability per
          patient cannot be modeled
        - Company data room; cross-check against NovoCare enrollment rate and Lilly Zepbound program participation
      - - Secondary market transactions and reference marks
        - >-
          Any secondary tender offer, employee share purchase, or CrossOff/Forge/EquityZen transaction price for Ro
          equity in 2023–2026
        - >-
          Secondary market prices provide a more current mark than the 2022 round; absence of secondary activity itself
          signals illiquidity risk
        - >-
          Forge Global, EquityZen, or Nasdaq Private Market for publicly listed secondary transactions; company counsel
          for any tender offer records
    notes: >-
      Diligence asks reflect the information gap analysis from this and prior chapters. Priority order: (1) audited
      financials, (2) 2025 revenue, (3) cap table — these three are gating items for any investment decision. Remaining
      items are material but secondary.
    claimRefs:
      - CV051
      - CV052
      - CV053
      - CV054
      - CV055
      - CV056
      - CV057
      - CV058
