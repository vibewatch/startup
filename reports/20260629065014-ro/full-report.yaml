      - number: '7.2'
        title: Regulatory and enforcement risks — FDA, DEA, FTC, and cross-state licensure complexity
        blocks:
          - type: paragraph
            body: >-
              The FDA's enforcement campaign against compounded and misleadingly marketed GLP-1s represents the clearest
              immediate legal risk. The February 2026 FDA statement named Hims & Hers and other compounding pharmacies
              but was explicitly addressed to companies mass-marketing compounded GLP-1 APIs — language that applies
              equally to any DTC telehealth platform that offered compounded semaglutide during the shortage. The March
              2026 wave of 30 warning letters targeted companies using telehealth firm trademarks on compounded products
              without qualification, and the April 2026 proposed 503B exclusion would permanently close the
              institutional pharmacy compounding door for these molecules. Ro's transition to a branded-only model
              reduces its compounding exposure, but legacy marketing assets, the Serena Williams ambassador campaign,
              and the website's GLP-1 program pages still need to be audited against the FDA's current enforcement
              standards.


              The FTC's 2021 telehealth guidance and its broader authority over deceptive health claims create a
              parallel regulatory layer for weight loss outcome claims on Ro's website. The DEA's telemedicine
              prescribing framework for controlled substances affects Ro's Roman platform and may tighten for
              testosterone and other hormone products. Cross-state complexity is managed at CCHP's documented 50-state
              variation level, but any single state regulatory action restricting asynchronous GLP-1 prescribing —
              without advance notice — could affect a material subscriber cohort. FDA Commissioner Makary's JAMA op-ed
              commitment to end the adequate-provision TV ad rule also creates risk for broadcast or streaming campaigns
              Ro may run.
