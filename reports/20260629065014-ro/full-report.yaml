    layout: wide
    summary: >-
      Ro's principal risk pathways converge on three transmission channels: FDA regulatory enforcement impairs the GLP-1
      product line; manufacturer supply decisions control revenue continuity; and governance/disclosure opacity prevents
      investors from independently underwriting any of the downstream financial outcomes.
    data:
