        title: Customer, reputation, and marketing compliance risks
        blocks:
          - type: paragraph
            body: >-
              Ro's customer reputation signals present a split picture that creates underwriting risk for marketing
              efficiency and subscriber retention. Trustpilot shows 25,000+ reviews at 4.6/5, which is a positive signal
              at scale. But BBB shows 1.28/5 across 36 reviews centered on billing confusion, subscription cancellation
              difficulty, and medication fulfillment issues — adverse signals that suggest the segment most frustrated,
              and most likely to escalate publicly, is experiencing disproportionate friction. The Serena Williams brand
              ambassador campaign has been specifically flagged by BioSpace as occurring in the context of tightening
              FDA oversight of DTC GLP-1 marketing.


              If any of Williams' campaign content included implied-sameness language about GLP-1 efficacy — language
              the FDA's March 2026 warning letters explicitly prohibited — the campaign creates direct compliance
              exposure for Ro. Expanded FDA enforcement over social media pharmaceutical advertising increases the
              probability that celebrity-driven campaigns will face scrutiny. Ro's clinical outcomes data provides
              substantiation for some outcome claims, but that evidence applies to semaglutide specifically and does not
              automatically extend to every GLP-1 currently marketed through the Ro formulary or to every marketing
              asset still indexed online.
