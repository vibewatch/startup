          - type: callout
            title: Hims & Hers Is Both Peer and Blueprint
            body: >
              Hims & Hers has followed an essentially identical vertical integration strategy to Ro—owning pharmacies,
              building lab testing, launching GLP-1 programs—but has done so as a public company with disclosed
              financials, at 4× the revenue scale, and with European expansion via ZAVA. Hims's FY2025 10-K provides the
              best publicly available proxy for Ro's own business model, unit economics, and regulatory risk surface.
              The key question is whether Ro's vertical integration and manufacturer relationships provide a durable
              cost or supply advantage over Hims, or whether Hims has closed that gap.
