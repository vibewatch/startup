      - number: '8.2'
        title: Last Financing Context and Implied Multiples
        blocks:
          - type: paragraph
            body: >-
              Ro's last priced equity round was a $150M Series E in February 2022, confirmed by Endpoints News,
              TechCrunch, and a Form D filing with the SEC. The round was led by ShawSpring Partners and valued the
              company at $7.0B post-money. Prior to that, Ro raised $500M at a $5.0B post-money valuation in March 2021,
              led by General Catalyst. Total disclosed equity across all rounds is approximately $1.03B. No confirmed
              equity round has been announced since February 2022—a gap of more than four years.


              The implied price-to-sales multiple at the $7.0B mark depends entirely on which revenue year is used as
              the denominator. At the time of the February 2022 round, Ro's 2021 revenue is estimated at approximately
              $150–200M, implying a 35–47× forward-looking P/S. Using Sacra's 2024 estimate of $598M, the implied
              multiple is 11.7×. Using 2023 estimated revenue of ~$360M, the multiple would have been approximately
              19.4× at time of round—still extreme by today's standards. None of these figures is based on audited
              financials.


              The staleness of the mark is the central diligence risk. Ro's SVB credit facility, disclosed in a
              bank-published case study, created an additional capital structure layer; following SVB's March 2023
              collapse, the nature and replacement of that facility is unconfirmed. Capital structure complexity
              (preference stack, debt, any management or employee liquidity provisions) is entirely opaque from public
              sources and must be treated as a blocking diligence gap ahead of any investment decision.
            claimRefs:
              - CV010
