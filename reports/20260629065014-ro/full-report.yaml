  - id: FU003
    title: Customer Proof Quality Matrix — Evidence Dimensions by Proof Category
    type: matrix
    layout: wide
    summary: >-
      Assessment of Ro's five customer-proof categories across five evidence-quality dimensions, showing relative
      strength, independence, and actionability of each proof type for diligence purposes.
    data:
      columns:
        - Evidence Type
        - Source Independence
        - Sample Size / Volume
        - Outcome Measurement
        - Diligence Weight
      rows:
        - label: Peer-Reviewed Semaglutide Study
          values:
            - Objective outcomes data; peer-reviewed in Obesity journal
            - Industry-academic collaboration (Weill Cornell, Univ. of Indiana); company-sponsored but peer-reviewed
            - n=655 persisters; largest telehealth semaglutide real-world sample
            - 16.6% avg weight loss; ≥5/10/20% threshold data; safety endpoints
            - High — but survivorship bias limits generalizability to full patient population
        - label: Trustpilot Aggregate Reviews
          values:
            - User satisfaction ratings; platform-moderated
            - Independent user-generated; not curated by Ro
            - 25,000+ reviews; high statistical volume
            - Satisfaction only; no clinical outcome or retention data
            - Medium — high volume confirms scale; adverse minority is informative for friction analysis
        - label: Third-Party Expert Reviews (Innerbody, US News)
          values:
            - Editorial product evaluation
            - Editorially independent; no disclosed Ro compensation
            - 2–3 major publications; each with single reviewer team
            - Qualitative; no patient-level outcome measurement
            - Medium — strong signal for product quality and experience; limited sample size
        - label: Named Member Testimonials (Ro site)
          values:
            - Self-reported satisfaction and anecdotal outcome claims
            - Company-curated; selected by Ro for marketing purposes
            - 4+ named members cited on official site
            - Anecdotal; no verification; weight loss claims not independently measured
            - Low — marketing material; not suitable for diligence outcome claims
        - label: BBB Complaint Profile
          values:
            - Third-party complaint registry
            - Independent from Ro; complaint-skewed population
            - 36 complaints; low absolute volume
            - No outcomes; documents billing, cancellation, and support friction
            - Medium for risk identification — small sample but consistent complaint categories across sources
    approximationNotes: >-
      Evidence quality ratings are qualitative assessments derived from source analysis as of June 2026. "Diligence
      weight" reflects relative usefulness for investment due diligence, not for clinical validity. The peer-reviewed
      study is the highest-quality external evidence for clinical efficacy but is subject to survivorship bias and
      company sponsorship. Trustpilot volume is objectively measurable; the adverse minority is the most actionable
      signal.
    claimRefs:
      - CU009
      - CU019
      - CU020
      - CU023
      - CU028
  - id: FU004
    title: Clinical Weight Loss Outcomes — Ro Real-World vs. SURMOUNT-1 Trial Benchmarks
    type: bar
    layout: standard
    summary: >-
      Comparison of average percentage weight loss from Ro's 68-week real-world semaglutide study versus SURMOUNT-1
      tirzepatide phase 3 trial outcomes (NEJM 2022) at comparable time points. Values represent mean percentage weight
      change from baseline; negative values indicate loss.
    data:
      items:
        - label: Ro semaglutide real-world — avg weight loss at 68 wk (%)
          value: 16.6
        - label: SURMOUNT-1 tirzepatide 5 mg — avg weight loss at 72 wk (%)
          value: 15
        - label: SURMOUNT-1 tirzepatide 10 mg — avg weight loss at 72 wk (%)
          value: 19.5
        - label: SURMOUNT-1 tirzepatide 15 mg — avg weight loss at 72 wk (%)
          value: 20.9
        - label: Ro semaglutide — % patients achieving ≥5% weight loss
          value: 95.4
        - label: Ro semaglutide — % patients achieving ≥10% weight loss
          value: 82
        - label: Ro semaglutide — % patients achieving ≥20% weight loss
          value: 32.8
        - label: SURMOUNT-1 tirzepatide placebo — avg weight loss at 72 wk (%)
          value: 3.1
    approximationNotes: >-
      Ro semaglutide outcomes from Ro press release (December 2025) and peer-reviewed study in Obesity journal.
      SURMOUNT-1 tirzepatide values from NEJM (Jastreboff et al., 2022; doi:10.1056/NEJMoa2206038). Direct comparisons
      between studies are not valid due to different populations, designs, and time points; these figures illustrate the
      relative efficacy landscape for context only. Ro's outcomes reflect persisters only (survivorship bias).
      SURMOUNT-1 outcomes reflect the intent-to-treat population using treatment-regimen estimand.
