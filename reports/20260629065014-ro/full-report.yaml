  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              The addressable market for Ro's core businesses—D2C telehealth, GLP-1 weight-loss care, and online
              pharmacy—has attracted at least five credible competitor archetypes: (1) public D2C telehealth platforms
              (Hims & Hers, LifeMD); (2) employer-funded chronic-disease platforms (Calibrate, Noom); (3) B2B
              virtual-care aggregators (Teladoc Health); (4) platform-backed hybrid models (Amazon One Medical); and (5)
              legacy consumer wellness brands pivoting to prescription care (WeightWatchers). Each archetype brings a
              different GTM motion, pricing model, and GLP-1 access strategy. Ro's defining characteristic is vertical
              integration: it operates its own pharmacy (Ro Pharmacy / Body by Ro), runs asynchronous and synchronous
              telehealth consultations, and has built supply-chain visibility tooling for its GLP-1 patients. This
              creates a structurally lower third-party dependency than pure-telehealth models like LifeMD but puts it in
              direct operational competition with Hims & Hers, which also owns pharmacies and a peptide-manufacturing
              facility. A key competitive risk is that FDA enforcement on compounded GLP-1s (990+ adverse-event reports
              as of May 31, 2026) threatens business models reliant on compounded semaglutide and tirzepatide—a risk
              shared with Hims, but with different exposure depending on each platform's manufacturer relationships and
              compounding mix.
            claimRefs:
