    title: Investment KPIs — IC Scorecard Across Key Diligence Dimensions
    type: kpi
    layout: compact
    summary: >-
      IC-ready scoring for Ro across market, product, customers, economics, moat, team, transparency, risk, and
      valuation dimensions on a 1–10 scale.
    approximationNotes: >-
      Scores reflect the author's diligence-based assessment grounded in evidence from this and prior chapters. All
      scores are advisory; they do not reflect audited or company-verified information.
    data:
      items:
        - label: Market Opportunity
          value: 8 / 10
          description: GLP-1 TAM $100B+; telehealth penetration still early; demographic tailwinds strong
          status: strength
        - label: Product / Platform
          value: 7 / 10
          description: Ro OS vertical integration is differentiated; compounding ban removed highest-margin offering
          status: strength
        - label: Customer Proof
          value: 6 / 10
          description: Strong clinical outcome data (68-week trial); Trustpilot and review evidence mixed; retention unknown
          status: neutral
        - label: Unit Economics
          value: 4 / 10
          description: Branded GLP-1 margins compressed vs. compounded; CAC and LTV not publicly validated
          status: risk
        - label: Competitive Moat
          value: 6 / 10
          description: First-mover in vertically integrated DTC GLP-1; Hims executing at 4× scale; Amazon a threat
          status: neutral
        - label: Management / Team
          value: 5 / 10
          description: Experienced founder; limited public executive disclosure; Ohanian related-party unresolved
          status: neutral
        - label: Financial Transparency
          value: 2 / 10
          description: No audited financials; no S-1; no PCAOB auditor; all metrics third-party estimated
          status: risk
        - label: Risk Profile
          value: 3 / 10
          description: FDA enforcement active in category; GLP-1 concentration 62%; manufacturer dependency extreme
          status: risk
        - label: Valuation Attractiveness
          value: 2 / 10
          description: $7B mark implies 11.7× 2024E revenue vs. Hims at 3.3×; 4-year stale; down-round risk high
          status: risk
