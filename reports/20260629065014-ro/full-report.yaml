  - id: TM001
    title: Market Definition Table — Ro's Boundary vs. Broad Telehealth
    columns:
      - segment/category
      - included spend
      - excluded spend
      - buyer/payer
      - relevance to Ro
    rows:
      - - US Telehealth (Broad TAM)
        - All virtual clinical encounters across all payer types; estimated $87–$114B (Grand View Research, restricted)
        - In-person care, hospital CapEx, EMR software, non-clinical digital tools
        - Medicare, Medicaid, commercial insurers, employers, cash-pay patients
        - Outer TAM envelope; includes segments Ro does not serve (insurance-mediated, hospital-based)
      - - DTC Cash-Pay Telehealth (Ro's core model)
        - Synchronous telehealth consults, asynchronous messaging, subscription clinical management — no insurance
        - Insurance-billed visits, hospital video systems, employer-capitated platforms
        - Individual consumers paying out-of-pocket
        - Core revenue model; differentiates by eliminating insurance friction
      - - GLP-1 Anti-Obesity / Weight-Loss Care
        - Telehealth prescriptions, compounded or branded GLP-1 dispensing, ongoing clinical monitoring
        - Insurance-covered branded GLP-1 prescription fills not billed through Ro
        - Cash-pay patients; some employer-benefit-eligible patients who use Ro out-of-pocket
