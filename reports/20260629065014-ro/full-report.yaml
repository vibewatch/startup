      - number: '6.3'
        title: Clinical Outcomes and Real-World Efficacy Evidence
        blocks:
          - type: paragraph
            body: >-
              In December 2025, Ro published the first peer-reviewed study evaluating both long-term weight loss and
              safety outcomes of semaglutide treatment via telehealth, co-authored with Weill Cornell Medicine physician
              Dr. Beverly Tchang (lead author) and Professor David B. Allison of Indiana University. Published in
              Obesity — the official journal of The Obesity Society — the study enrolled a random nationwide sample of
              655 patients treated with branded semaglutide (Wegovy or Ozempic) through Ro's platform who persisted with
              treatment and reported their weight at 68 weeks (plus or minus 14 days). The sample was 67.9% women, with
              mean age 45.8 years and median baseline BMI of 32.3 kg/m².

              The study found an average body weight reduction of 16.6% (SD 7.5; 95% CI −17.1 to −16.0) at 68 weeks.
              Nearly all patients (95.4%) achieved at least 5% body weight loss, 82.0% achieved at least 10%, and 32.8%
              achieved at least 20%. The safety profile was consistent with the STEP clinical trials: the most common
              side effects were nausea or vomiting (37.3%) and constipation (15.6%), with no new safety concerns
              identified. At week 68, 52.1% of patients were on the 2.4 mg semaglutide maintenance dose. Ro's clinical
              program also includes Zepbound (tirzepatide), which in the SURMOUNT-1 phase 3 trial (NEJM, 2022) showed
              mean weight reductions of 15.0%, 19.5%, and 20.9% at 72 weeks for 5-mg, 10-mg, and 15-mg weekly doses,
              respectively, with an overall trial completion rate of 86%.

              A critical methodological caveat is survivorship bias: the 655-patient cohort was drawn exclusively from
              patients who persisted through 68 weeks and reported their weight. The total initial cohort size is
              undisclosed, making true program-wide average outcomes unverifiable. This study is the largest published
              real-world semaglutide telehealth dataset and was presented at ObesityWeek 2025 (eight abstracts), but all
              published research is company-sponsored or company-adjacent.
