        title: Exhibits
        blocks:
          - type: callout
            title: Compounding Prohibition Is the Key Near-Term Revenue Risk
            body: >-
              Approximately 62% of Ro's estimated 2024 revenue came from GLP-1 products (Sacra). A significant share of
              that revenue likely involves compounded semaglutide — available only while FDA designates GLP-1s as in
              shortage. If semaglutide is removed from the FDA shortage list, Ro's compound pharmacy model faces a
              near-term legal cliff. This is not a speculative risk: FDA removed certain GLP-1 molecules from shortage
              designation in 2025, and BioSpace has flagged Ro's marketing amid tightening oversight. Diligence must
              quantify branded vs. compounded GLP-1 revenue and assess Ro's supplier agreements with Novo Nordisk and
              Eli Lilly for branded supply continuity.
