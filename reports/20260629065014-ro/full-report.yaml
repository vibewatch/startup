      - number: '5.6'
        title: Technology Constraints, Dependencies, and Open Questions
        blocks:
          - type: paragraph
            body: >-
              Several structural constraints limit ro.OS's independence and defensibility. First, Ro's GLP-1 product—now
              the majority of estimated revenue—depends entirely on Novo Nordisk (Wegovy, Ozempic) and Eli Lilly
              (Zepbound, Foundayo) for drug supply, pricing, and availability. Manufacturer pricing decisions,
              exclusivity arrangements, or API policy changes can materially alter Ro's economics with no offsetting
              lever. The pricing page explicitly states Ro matches LillyDirect and NovoCare pricing—positioning Ro as a
              distributor that cannot price below manufacturer reference points.

              Second, the regulated clinical workflow creates operational complexity. Each state has distinct telehealth
              prescribing rules; prior authorization timelines (two to three weeks) create conversion friction; and
              GLP-1 safety monitoring (thyroid cancer risk, pancreatitis, cardiovascular monitoring) imposes ongoing
              clinical compliance obligations. BioSpace reported that pharma companies and regulators are increasingly
              scrutinizing telehealth GLP-1 marketing practices in 2025–2026, citing tightening oversight of
              celebrity-endorsed DTC campaigns.

              Third, the technology depth of ro.OS is largely self-described. No independent technical audits, uptime
              statistics, software architecture disclosures, or developer-facing API documentation are publicly
              available. The company's claims about LLM accuracy (94%), response time (33-minute average), and platform
              scale ("tens of millions of treatments") cannot be verified from public evidence. Trustpilot contains
              patient reviews reporting prescription processing delays and customer service challenges, providing
              limited but adverse signals about user experience quality. The absence of a public technology roadmap
              means Ro's forward feature development plans and infrastructure investments remain entirely opaque to
              external observers.
            claimRefs:
              - CE015
              - CE037
              - CE045
              - CE048
              - CE049
              - CE050
