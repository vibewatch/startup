  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Target Customer Segments
        blocks:
          - type: paragraph
            body: >-
              Ro targets cash-pay and commercially insured US adults across five therapeutic areas: GLP-1 weight loss
              (Ro Body), men's sexual health (Roman), women's health and fertility (Rory, Modern Fertility), hair loss
              and dermatology, and preventive OTC health (Ro Zero). The company operates entirely direct-to-patient —
              there is no employer or health-system sales channel — with all care initiated digitally through Ro's
              website or mobile app. The target profile for Ro Body is an adult with overweight or obesity who wants a
              discreet, asynchronous, and fast path to GLP-1 medication access, bypassing the traditional multi-visit
              PCP-to-specialist referral cycle.

              The Roman product line targets adult men seeking discreet access to FDA-approved ED, PE, and hair-loss
              medications with free telehealth consultations and fast, unmarked shipping. Roman was Ro's founding
              product and still represents meaningful brand awareness, though GLP-1 weight loss now dominates revenue at
              an estimated 62% of 2024 total. Rory and Modern Fertility target women of reproductive age seeking
              hormonal health, fertility testing, menopause management, and skincare via the same async telehealth
              model. Ro Zero addresses smoking cessation. All segments operate US-only and share the same ro.OS
              infrastructure, enabling cross-product data leverage and common provider credential verification. Ro does
              not serve patients with complex chronic conditions requiring in-person evaluation, patients not seen by
              any clinician in the prior three years, or patients enrolled in Medicare, Medicaid, Tricare, or
              Supplemental Medicare for GLP-1 programs.
