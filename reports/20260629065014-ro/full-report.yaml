            title: Full-Stack Vertical Integration Is Ro's Primary Moat
            body: >-
              Ro owns the patient-provider-pharmacy-lab workflow within ro.OS—a proprietary, non-licensed platform that
              creates structural switching costs. Six owned pharmacies, in-house CLIA/CAP lab processing, and a
              purpose-built EMR are not typical for digital health startups. This vertical stack enables same-day or
              next-day drug shipment, integrated lab-to-care feedback loops, and provider tooling that competitors who
              rely on third-party platforms cannot easily replicate without significant capital and engineering
              investment.
            calloutType: strength
