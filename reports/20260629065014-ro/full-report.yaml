      - number: '4.4'
        title: Capital Structure and Forward Adequacy
        blocks:
          - type: paragraph
            body: >-
              Ro has raised approximately $1.03B in total disclosed equity across five known rounds, with its most
              recent transaction being a $150M Series E in February 2022 at a $7B valuation. That round was confirmed by
              Endpoints News, TechCrunch, and a Form D filed with the SEC. Earlier rounds included a $150M Series C
              (2019), a $200M Series C extension (2020), and a $500M Series D at $5B (March 2021). The funding
              chronology is detailed in the Company Overview chapter; this chapter does not reproduce those claim IDs
              but confirms the capital raised figure using local sources. Ro also received a credit facility from
              Silicon Valley Bank, disclosed through an SVB-published case study. Following Silicon Valley Bank's
              failure in March 2023, the nature and replacement of that facility is unknown and represents an unresolved
              capital structure question.


              With no public financials, cash on hand, monthly burn, and runway cannot be validated. If Ro is cash-flow
              breakeven or better at ~$598M revenue (consistent with a mature SaaS-adjacent operating model at scale),
              its capital needs may be modest. However, the GLP-1 pivot to branded drugs—higher revenue per transaction
              but lower margins—may have changed the cash dynamics materially. Digital health generally experienced
              capital tightening through 2022–2024 as rising interest rates compressed valuation multiples and made
              follow-on rounds harder to execute. Ro's last round is now more than four years old, which limits its
              ability to point to a credible current mark and may complicate any exit or fundraise at the $7B reference
              valuation.
