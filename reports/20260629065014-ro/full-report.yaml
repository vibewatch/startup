          - type: callout
            title: GLP-1 Product Depends Structurally on Novo Nordisk and Eli Lilly
            body: >-
              Ro positions its GLP-1 pricing as matching LillyDirect and NovoCare—meaning the company cannot undercut
              manufacturer reference prices and absorbs no meaningful drug margin. Novo Nordisk and Eli Lilly control
              supply, list price, and availability for every GLP-1 medication Ro offers. Any manufacturer price
              increase, rebate structure change, or API policy change directly impairs Ro's economics with no offsetting
              lever. The compounding ban (May 2025) was a prior example of how external regulatory or manufacturer
              action can restructure Ro's product economics without management control.
            calloutType: risk
            claimRefs:
              - CE015
              - CE045
              - CE051
          - type: callout
            title: ro.OS Technical Depth Is Self-Described; Independent Benchmarking Is Absent
            body: >-
              Ro has not published uptime SLAs, API documentation, SOC 2 Type II attestations, or independent clinical
              outcome benchmarks for ro.OS. Claims about LLM triage accuracy (94%), response time (33-minute average),
              and platform scale all originate from the company's own communications. BioSpace reporting on tightening
              regulatory scrutiny of telehealth GLP-1 marketing, combined with adverse patient reviews on consumer
              platforms, adds qualitative risk signals that the company-stated product quality metrics may not reflect
              actual patient experience at scale.
            calloutType: risk
            claimRefs:
              - CE033
              - CE048
              - CE049
          - type: callout
            title: ro.OS as a Closed Platform Limits TAM but Preserves Integrated Moat
            body: >-
              Ro's decision not to license ro.OS externally forecloses a SaaS business model that could multiply revenue
              per dollar of infrastructure investment. Competitors like Workpath (before acquisition) demonstrated the
              B2B API approach. The closed-ecosystem choice means ro.OS's value is captured entirely through patient
              subscription and pharmacy revenue rather than platform licensing, concentrating business model risk on
              consumer acquisition and retention dynamics rather than B2B contract stability.
            calloutType: insight
            claimRefs:
