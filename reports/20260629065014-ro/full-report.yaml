  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Ro's highest residual risks cluster around FDA regulatory enforcement and manufacturer dependency, both of which
      are high-likelihood, high-impact risks with low mitigation maturity. Governance, disclosure, and valuation risks
      are medium likelihood but carry high impact because they are largely unverifiable from public evidence.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: FDA compounding/DTC enforcement
          values:
            - label: high
              tone: negative
              detail: Three escalating FDA actions Feb–Apr 2026; industry-wide enforcement posture already active.
            - label: critical
              tone: negative
              detail: Core GLP-1 revenue stream at risk; ~62% of estimated revenue exposed.
            - label: low-medium
              tone: warning
              detail: Transition to branded-only underway but not complete; legacy marketing exposure unverified.
            - label: high
              tone: negative
              detail: No confirmed Ro-specific action yet, but industry posture is escalating; residual risk is high.
        - label: Manufacturer / supply concentration
          values:
            - label: medium
              tone: warning
              detail: No shortage currently; but no supply agreement disclosed.
            - label: critical
              tone: negative
              detail: Novo Nordisk / Lilly control Ro primary revenue line without disclosed contractual protection.
            - label: low
              tone: negative
              detail: No public supply agreement or preferred-partner status; Ro has no disclosed fallback.
            - label: high
              tone: negative
              detail: Unmitigated dependency on two manufacturers for the dominant revenue driver.
        - label: Governance / disclosure opacity
          values:
            - label: low-medium
              tone: neutral
              detail: No confirmed governance crisis; Ohanian-Williams relationship has not been formally investigated.
            - label: high
              tone: warning
              detail: Related-party uncertainty and four-year valuation staleness impair investment underwriting.
            - label: low
              tone: negative
              detail: No public board roster, audit committee, or conflict-of-interest disclosure.
            - label: medium-high
              tone: warning
              detail: Residual risk is driven primarily by missing disclosure rather than confirmed misconduct.
        - label: Revenue concentration / financial opacity
          values:
            - label: high
              tone: negative
              detail: ~62% single-product dependency is already realized; no counter-evidence is available.
            - label: high
              tone: negative
              detail: Stale $7B mark, no audited financials, and no S-1 leave capital constraint unknowable.
            - label: low
              tone: negative
              detail: Ro has not published any financial transparency measures.
            - label: high
              tone: negative
              detail: Valuation and capital risk are severely underwriting-impaired.
        - label: Customer / reputation / marketing compliance
          values:
            - label: medium
              tone: warning
              detail: BBB complaints and ambassador campaign overlap with the FDA enforcement window.
            - label: medium
              tone: warning
              detail: Reputational damage or FTC action could impair customer-acquisition economics.
            - label: medium
              tone: warning
              detail: Clinical outcomes evidence provides some substantiation; marketing remains under review.
            - label: medium
              tone: warning
              detail: Not a thesis-break alone, but it compounds the other risk clusters.
    approximationNotes: null
    claimRefs:
      - CR002
      - CR003
      - CR017
      - CR018
      - CR024
      - CR028
      - CR039
      - CR045
