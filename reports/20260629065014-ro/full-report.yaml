      - number: '3.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'FDA Compounding Enforcement: Sector-Wide GLP-1 Revenue Risk'
            body: >
              The FDA has issued warnings to telehealth companies for marketing unapproved GLP-1 drugs (including
              retatrutide) and has received 990+ adverse event reports for compounded semaglutide and 730+ for
              compounded tirzepatide as of May 31, 2026. An import alert (66-80) restricts GLP-1 APIs with quality
              concerns from entering the US supply chain. Both Ro and Hims & Hers have business models that depend—to
              varying degrees—on compounded or personalized GLP-1 formulations. The ending of the FDA shortage exemption
              for compounded semaglutide in early 2025 forced Hims & Hers to transition its compounding model. Ro's
              exposure to the same dynamic is material but undisclosed. Any investor in Ro must diligence the company's
              pharmacy compounding mix and its contingency plan for further enforcement actions.
            calloutType: risk
            claimRefs:
