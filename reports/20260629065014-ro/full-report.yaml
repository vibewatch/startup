      - number: '5.3'
        title: GLP-1 Weight Loss Product Suite
        blocks:
          - type: paragraph
            body: >-
              Ro's largest commercial product is its GLP-1 weight loss offering—Ro Body—which pairs prescription GLP-1
              medications with ongoing care management. The program starts at $39 for an initial online visit, after
              which patients who qualify pay as little as $74/month on an annual Prepay & Save plan for the membership
              layer; medication costs are billed separately. Ro explicitly positions its GLP-1 prices as matching
              manufacturer direct programs: "the same as LillyDirect, NovoCare, and TrumpRx."

              Ro currently offers four GLP-1 medications under the Body membership: (1) Wegovy pen (semaglutide
              injection, FDA-approved for weight management and cardiovascular risk reduction), with an average
              manufacturer-trial weight loss of ~19% at the highest dose; (2) Wegovy pill (semaglutide oral,
              FDA-approved, starts at $149/first month then $199–$299 thereafter); (3) Zepbound KwikPen (tirzepatide
              injection, described as "the fastest-working GLP-1," with ~20% average weight loss in manufacturer trials,
              starting at $299/first month then $399–$449/month); and (4) Foundayo pill (orforglipron, described as "the
              newest FDA-approved GLP-1 pill for weight loss," priced at parity with LillyDirect). Insurance-covered
              patients can access Wegovy pen, Zepbound pen, and Ozempic through their commercial pharmacy benefit, where
              branded list prices run $900–$1,100/month without coverage.

              Ro's supply tracker provides a real-time community and FDA cross-reference tool showing GLP-1 shortage
              statuses. As of June 2026, all listed medications show "shortage resolved" per FDA designations, but the
              tracker continues to surface community reports of spot supply issues— reflecting ongoing distribution
              fragility even after the regulatory compounding ban. GLP-1 medications achieve weight loss by slowing
              gastric emptying, reducing appetite, and acting on GLP-1 receptors in the gut and brain. Serious safety
              warnings include risk of thyroid C-cell tumors (MTC), pancreatitis, and drug interactions documented in
              Ro's safety information pages and FDA postmarket safety guidance.
