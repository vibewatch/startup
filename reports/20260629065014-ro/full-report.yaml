  - id: FV001
    title: Recommendation Logic — From Evidence to Investment Stance
    type: flow
    layout: standard
    summary: Chain from scale and product evidence through risks and valuation to the conditional-hold recommendation.
    data:
      nodes:
        - id: n1
          label: GLP-1 Revenue Scale
          detail: ~$598M est. 2024; 66% YoY growth (Sacra); 62% GLP-1 concentration
        - id: n2
          label: Vertical Integration Advantage
          detail: 'Ro OS: patient portal, telehealth, in-house pharmacy, diagnostics'
        - id: n3
          label: Manufacturer Partnerships
          detail: NovoCare Wegovy ($149/mo self-pay); Lilly Zepbound ($299/mo)
        - id: n4
          label: Regulatory / Compounding Risk
          detail: May 2025 FDA ban on compounded semaglutide; 62% revenue category exposed
        - id: n5
          label: Public Comp Multiples
          detail: Hims 3.3× FY2025; LifeMD ~1.0×; Teladoc ~0.5× (Jun 2026)
        - id: n6
          label: Stale $7B Mark (11.7× implied)
          detail: Set Feb 2022; 4+ years stale; no subsequent priced round
        - id: n7
          label: Disclosure Gap (No Audited Financials)
          detail: No S-1, no PCAOB auditor disclosed, no verified P&L
        - id: n8
