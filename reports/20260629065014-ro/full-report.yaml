        title: Operational, technology, and kill criteria — monitoring the acute risks
        blocks:
          - type: paragraph
            body: >-
              Ro's operational and technology risks are real but more manageable than its regulatory and supply chain
              exposures. The asynchronous telehealth model creates an adverse event detection gap: GLP-1 side effects
              including pancreatitis, cardiac arrhythmia, and psychiatric reactions may not surface in monthly check-in
              cycles. Ro publishes a GLP-1 safety page but does not disclose adverse event reporting rates, MedWatch
              submissions, or escalation criteria — a gap that regulators could scrutinize if clinical outcomes
              marketing expands. Platform and data security risks exist but are standard for cloud-based healthcare and
              likely have HIPAA business-associate protections even if Ro has not publicly disclosed its specific
              certifications.


              The most important monitoring framework is the kill criteria table: five triggers that could independently
              break the Ro investment thesis. The most critical is direct FDA action naming Ro — which has not occurred
              as of June 2026 but remains the clearest near-term thesis-break scenario given the escalating industry
              enforcement posture. Investors should monitor the FDA warning-letter database, Ro's own supply tracker,
              employer benefit coverage surveys, and any new fundraising or secondary-market transaction for evidence
              that the thesis is advancing or deteriorating.
