      - number: '6.5'
        title: Adverse Signals and Customer Friction
        blocks:
          - type: paragraph
            body: >-
              The BBB profile for Ro shows a 1.28 out of 5.0 rating based on 36 complaint-driven reviews, substantially
              below Ro's Trustpilot score of 4.6/5. Complaint themes documented by Innerbody's review center on two
              areas: miscommunications around subscription cancellation procedures and insurance coverage expectations
              that were not met. Healthline independently reports "some reports of slow response times, lack of
              communication, and issues with shipping and billing" — corroborating the BBB complaint profile at a
              qualitative level. The small BBB sample size (36 reviews versus 25,000+ on Trustpilot) limits statistical
              significance, but the consistency of complaint categories across three independent sources — cancellation
              friction, billing clarity, and communication delays — represents a structural customer service risk worth
              monitoring at scale.

              A significant access restriction constrains Ro's addressable patient population: Ro explicitly does not
              coordinate insurance coverage for government-funded plans including Medicare, Supplemental Medicare,
              Tricare, and Medicaid. Patients with these plans may join the Ro Body program only as cash-pay members for
              certain medications; Medicaid patients and patients on certain other government-funded plans are
              ineligible to join at all. This exclusion restricts access for lower-income and elderly populations who
              bear some of the highest obesity burden, limiting Ro's equity-of-access narrative and creating a potential
              regulatory exposure if Medicare GLP-1 obesity coverage expands. Innerbody also notes the removal of Ro's
              mental health telehealth platform and allergy medication delivery program — service-line contractions that
              may reflect GLP-1 resource concentration but reduce product breadth for prior users.
            claimRefs:
              - CU022
              - CU023
              - CU025
              - CU036
              - CU037
      - number: '6.6'
        title: Expansion Drivers, Concentration Risk, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Sacra estimates approximately 62% of Ro's 2024 revenue derived from GLP-1 weight-loss medications — a
              concentration that creates material business risk. The FDA's May 2025 removal of semaglutide from the drug
              shortage list terminated Ro's compounded GLP-1 offering, which previously provided a lower-cost
              acquisition and retention channel. The quantitative impact of this transition on 2025 revenue, gross
              margins, or subscriber retention is unverified, as Ro has not published audited financials or subscriber
              metrics since its 2022 fundraise.

              Expansion opportunities are real and multiple. Ro's insurance concierge capability positions it favorably
              as employer GLP-1 coverage broadens — a structural tailwind that could reduce cash-pay dependence and
              expand addressable patient volume. The addition of Zepbound KwikPen via LillyDirect and Foundayo (oral
              orforglipron, FDA-approved 2026) provides new entry points at lower price points, potentially addressing
              price-sensitive segments currently excluded. The superior efficacy profile of tirzepatide versus
              semaglutide at comparable time points (15–21% versus approximately 15–16% weight loss) may drive clinical
              preference and formulary migration as insurance coverage expands. Ro's ObesityWeek 2025 research presence
              (eight abstracts) and the peer-reviewed outcomes study signal a platform-level investment in clinical
              credibility that could support provider and payer relationships.

              The absence of published NRR, GRR, cohort retention, customer count, or LTV data makes it impossible to
              independently evaluate expansion economics. Full diligence requires at minimum: unaudited 2025 quarterly
              revenue by product segment, retention cohort data from Ro Body subscribers, post-shortage product mix
              confirmation from management, and a breakdown of insured versus cash-pay patient mix and associated margin
              structure.
