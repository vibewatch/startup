  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Anti-Thesis, and Recommendation
        blocks:
          - type: paragraph
            body: >-
              Ro occupies a structurally advantaged position in the fastest-growing segment of consumer healthcare:
              direct-to-patient GLP-1 weight management. Sacra estimates 2024 revenue at approximately $598M,
              representing 66% year-over-year growth from ~$360M in 2023—a trajectory few private digital health
              companies have matched. The vertically integrated Ro OS platform (patient engagement, telehealth consult,
              in-house pharmacy, at-home diagnostics) creates switching friction that pure-play telehealth marketplaces
              lack. Manufacturer partnerships with Novo Nordisk and Eli Lilly for branded Wegovy and Zepbound provide
              distribution credibility and a post-compounding-ban business continuity path.


              The anti-thesis is equally concrete. The $7.0B February 2022 valuation—implying 11.7× the 2024 revenue
              estimate—is a four-year-old mark set in a peak growth-asset market that no longer exists. Every public DTC
              telehealth comparable has repriced: Hims & Hers, the most direct analogue, trades at approximately 3.3×
              FY2025 revenue with a $7.85B market cap on $2.35B revenue; Teladoc trades at roughly 0.5× FY2024 revenue;
              LifeMD at approximately 1.0× FY2025 revenue. Applying even the Hims premium to Ro's 2024 revenue estimate
              yields an implied value of ~$1.8–2.0B—less than one-third of the 2022 mark. Critically, Ro publishes no
              audited financials, has filed no S-1, and has disclosed no 2025 revenue data; the GLP-1 compounding-ban
              transition may have caused a material revenue and margin inflection whose sign and magnitude are unknown.


              The recommendation is conditional hold: Ro represents a credible category-leadership asset worthy of
              patient capital, but entry at or near the $7.0B mark is not supportable given the comp set, the disclosure
              deficit, and the post-ban revenue uncertainty. A diligence-gate entry at a $1.5–2.5B negotiated valuation,
              conditioned on receipt of audited 2023–2024 financials and 2025 YTD revenue, is the minimum acceptable
              framework for institutional investment.
