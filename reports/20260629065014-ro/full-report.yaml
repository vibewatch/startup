          - type: callout
            title: Employer Channel Is the Most Credible Path to SAM Expansion
            body: >-
              Self-insured employers represent a $5–18B incremental demand pool that Ro's vertically integrated platform
              is structurally positioned to serve. PHTI's December 2025 employer guide explicitly frames virtual weight
              management platforms as the implementation vehicle for GLP-1 programs. Ro Body's three-phase care model
              (clinical eligibility, medication management, behavioral support) maps directly to the PHTI framework.
              However, no confirmed enterprise contracts have been disclosed publicly, and the B2B sales cycle for
              employer benefits is longer and more complex than the DTC conversion funnel Ro has optimized.
            calloutType: insight
            claimRefs:
              - CM014
              - CM015
              - CM018
              - CM024
              - CM025
          - type: callout
            title: SAM/SOM Estimates Carry High Uncertainty; Multiple Diligence Paths Required
            body: >-
              The lack of a verified, publicly available primary estimate for the US cash-pay DTC weight-management and
              GLP-1 pharmacy market means all SAM estimates in this chapter are back-calculations or indirect proxies.
              The three best available approaches — Grand View Research top-down (restricted), Sacra implied SAM from Ro
              revenue, and NCSL/KFF Medicaid spend as a floor — give ranges of $15–$250B, which is too wide to
              underwrite against. Management disclosure of patient count, ARPU, and payer-mix breakdowns would
              materially narrow the uncertainty.
