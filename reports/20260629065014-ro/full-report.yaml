      - number: '2.5'
        title: Constraints and Headwinds
        blocks:
          - type: paragraph
            body: >-
              The same GLP-1 boom that fuels Ro's growth also introduces concentrated risk. NCSL data report that
              branded GLP-1 monthly list prices remain $936–$1,023, and the same NCSL survey found that approximately
              half of insured GLP-1 users still report cost-sharing amounts too high even with insurance. For Ro's
              cash-pay patients who bear 100% of cost, sustained adherence depends on either compounded semaglutide
              availability (cheaper, but legally precarious) or patient willingness to pay branded list prices.

              The FDA compounding clampdown is the most acute near-term constraint. FDA has indicated it will remove
              semaglutide and other GLP-1s from shortage status as manufacturer supply recovers, which would prohibit
              compound pharmacies from legally producing these drugs. Ro's weight-loss supply tracker page acknowledges
              supply volatility, and BioSpace has flagged the regulatory arbitrage concern: Ro's Serena Williams
              marketing campaign for GLP-1s coincides with intensifying FDA scrutiny of compounding practices. This
              creates binary revenue risk for the ~62% of Ro's 2024 revenue attributable to GLP-1 products.

              Telehealth prescribing regulations add another friction layer. CCHP's Fall 2025 report shows that while
              most states have expanded telehealth coverage, state-by-state variation in prescribing rules, out-of-state
              provider licensing, and Ryan Haight Act requirements for controlled-substance prescribing remain
              compliance constraints for DTC platforms. Cross-state physician licensing creates operational complexity
              and limits the speed at which Ro can expand its provider footprint.

              Employer coverage dynamics cut both ways. While employers represent growth opportunity, KFF found that
              many are actively scaling back GLP-1 coverage for weight loss or strengthening coverage requirements.
              IFEBP reports that 82% of employer plans with GLP-1 weight-loss coverage use utilization management as a
              cost-control mechanism. This means any employer channel for Ro will face step-therapy, prior
              authorization, and eligibility gatekeeping that increase CAC and reduce conversion.

              Finally, discontinuation economics are structurally challenging. Real-world data indicate high GLP-1
              discontinuation rates, and PHTI's 2025 report explicitly warns that patients who stop GLP-1 therapy
              rapidly regain weight without structured behavioral support. High churn reduces lifetime value and forces
              continuous re-acquisition spend — a dynamic that makes CAC intensity a persistent drag even as new patient
              demand grows.
