      - number: '5.4'
        title: Product Line Breadth and Platform Coverage
        blocks:
          - type: paragraph
            body: >-
              ro.OS underpins a multi-vertical consumer health portfolio that goes well beyond GLP-1. Roman (men's
              health) is Ro's founding product line and addresses erectile dysfunction, hair loss, and related
              conditions via prescription and OTC offerings; it also partnered with Walmart to sell a men's health OTC
              line in-store. Rory (women's health) addresses menopause symptom management, skincare, and hair loss.
              Modern Fertility, acquired in 2021, provides hormone testing, ovulation testing, pregnancy testing, and
              fertility supplements. Ro Zero focuses on smoking cessation. Ro Mind offered mental health services
              (depression and anxiety) though its current status is not confirmed on public pages as of June 2026.

              Acquisitions have directly expanded the platform's technical surface area. Workpath (acquired ~2020) is a
              software platform enabling on-demand in-home care and diagnostic services via an API; Ro has used Workpath
              to integrate virtual and in-person care, and has offered Workpath's API to other healthcare companies for
              use in clinical trials, diagnostics, and home-based care. Kit (acquired 2021) brought at-home diagnostic
              testing capabilities that combined with Workpath's logistics to power the Lab App's at-home kit service.
              Ro's modern-fertility press release from the time of acquisition described Ro as having facilitated "more
              than eight million digital healthcare visits in nearly every county in the United States, including 98% of
              primary care deserts"—citing both the platform's national reach and its access to underserved geographies.

              The product breadth creates cross-sell optionality and shared data advantages: a GLP-1 patient may also
              use Modern Fertility hormone tests, Roman OTC, or Ro Zero—all managed within a single patient record in
              ro.OS. TechStackIPO notes that Ro is "the only company in the US that integrates telehealth, pharmacy,
              at-home testing, labs and diagnostics," though this exclusivity claim has not been independently verified
              against all competitors.
