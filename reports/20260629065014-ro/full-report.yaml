chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Operating Model
        blocks:
          - type: paragraph
            body: |
              Roman Health Ventures, Inc. is the legal name of the company that operates publicly as Ro.
              The entity is a Delaware corporation with SEC CIK 0001706332, incorporated in 2017. The
              company launched in October 2017 under the Roman brand, focusing on erectile dysfunction
              telehealth for men. In September 2018 it rebranded as Ro, signaling a broader multi-condition
              ambition. As of the June 2026 run date, Ro is headquartered at 221 Canal Street, 3rd Floor,
              New York, NY 10013 per the user-supplied fact; earlier SEC Form D filings listed 900 Broadway
              (2017) and 116 West 23rd Street (2020–2021).

              Ro's stated mission is to help patients achieve their health goals by delivering the easiest,
              most effective care possible, aspiring to be every patient's "first call." The business model
              is entirely direct-to-consumer and cash-pay (no insurance required), monetizing through
              clinical subscriptions (e.g., the $145/month Ro Body program), pharmacy fulfillment margins
              on generics and branded GLP-1s, and at-home diagnostics. A key unit-economics assertion is
              that vertical integration—owning telehealth, pharmacy, labs, and in-home care under one
              platform (ro.OS)—enables lower cost-to-serve and higher lifetime value per patient than
              single-service telehealth competitors.

              ro.OS, Ro's proprietary operating system, packages four integrated applications: the Patient
              App (messaging, records, goal-tracking), the Care Delivery App (EMR, quality, and safety
              tools for providers), the Pharmacy App (fulfillment and patient coordination), and the Lab
              App (at-home and retail lab integrations). The Ro website describes millions of patients
              helped nationwide, tens of millions of treatments delivered, and hundreds of millions of
              care interactions—all company-claimed figures without publicly audited verification.
