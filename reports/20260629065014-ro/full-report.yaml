  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Scale and Mix
        blocks:
          - type: paragraph
            body: >-
              Sacra, the leading private-company research platform covering digital-health unicorns, estimates Ro's 2024
              revenue at approximately $598M, representing growth of roughly 66% year-over-year from an estimated ~$360M
              in 2023. These are unaudited third-party estimates; Ro discloses no public financials as a private
              company. The dominant driver of 2024 revenue was GLP-1 weight-loss medications, which Sacra estimates
              contributed approximately $370M—about 62% of total revenue—reflecting the explosive consumer demand for
              semaglutide and tirzepatide prescriptions.


              Ro's earlier revenue trajectory suggests approximately $150–200M in 2022 revenue before the GLP-1 demand
              surge. The step-change in growth from 2022 to 2024 closely parallels the industry-wide GLP-1 prescription
              boom, but also creates a single-category concentration risk: if GLP-1 revenue is disrupted—by the FDA
              compounding ban, manufacturer pricing decisions, or competitive dynamics—the topline is highly exposed.
              Non-GLP-1 revenue streams (Roman for men's health, Ro Pharmacy for general medications, Ro Body/wellness
              programs) collectively represent an estimated ~$228M of the 2024 total, though segment-level breakdowns
              are not publicly available.


              The FDA's removal of semaglutide (and tirzepatide) from the shortage list in early 2025 effectively
              prohibited Ro and its peers from offering lower-cost compounded GLP-1s. Ro's response—pivoting to branded
              Wegovy and Ozempic prescriptions—shifts substantial revenue to branded-drug pass-through, which carries
              far thinner gross margins than compounded formulations. The full 2025 revenue and margin impact of this
              transition is unknown without access to audited or management-disclosed financials.
