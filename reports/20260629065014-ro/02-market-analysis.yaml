figures:
  - id: FM001
    title: Market Sizing Pyramid — Ro's TAM to SOM
    type: pyramid
    layout: standard
    summary: >-
      Four nested layers from broad US telehealth TAM down to Ro's 2024 actual revenue, illustrating the sizing
      funnel and boundary assumptions at each level.
    data:
      nodes:
        - label: "US Telehealth Broad TAM: ~$87–$114B (2023)"
          detail: >-
            All telehealth modalities, all payer types. Grand View Research estimate (restricted access); indicative
            upper bound only. Includes hospital telemedicine, insurer-billed visits, and all conditions.
          tone: neutral
        - label: "DTC / Cash-Pay Telehealth Addressable: ~$15–$40B (estimated)"
          detail: >-
            No-insurance, patient-funded telehealth across chronic lifestyle conditions. Not directly measured by
            available public sources; estimated from Ro revenue and assumed 1.5–4% market share.
          tone: positive
        - label: "Ro's SAM: GLP-1 + Weight Loss + Sexual/Men's Health + Adjacent: ~$15–$25B (estimated)"
          detail: >-
            Cash-pay weight management, GLP-1 pharmacy, sexual health, hair/skin. Includes employer-directed
            programs. Heavily GLP-1-weighted; Sacra data imply $370M/~$598M = 62% GLP-1 revenue concentration.
          tone: positive
        - label: "Ro SOM: $598M Actual 2024 Revenue (Sacra)"
          detail: >-
            Sacra estimate; ~66% YoY growth. GLP-1 products ~$370M, remainder from legacy men's health, fertility,
            diagnostics, and pharmacy. Implies low single-digit % share of SAM.
          tone: positive
    approximationNotes: >-
      TAM and DTC SAM values are derived from restricted-access analyst reports and back-calculation from Ro revenue
      at assumed market-share ranges; they should be treated as order-of-magnitude estimates, not cited figures.
      Units are USD billions. SOM is the only figure directly sourced from a named estimate (Sacra, 2024).
