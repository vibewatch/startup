  - id: s2
    title: Market Sizing — TAM, SAM, SOM, and Evidence Constraints
    body: >-
      Multiple sizing lenses are required because no single public estimate isolates Ro's cash-pay weight-management
      and GLP-1 pharmacy opportunity. The broadest available framing is the US telehealth market — Grand View Research
      estimated it at approximately $87–$114B in 2023 with a ~24% CAGR toward an estimated $776B by 2030, though this
      figure uses a broad definition inclusive of all payer types and modalities. McKinsey's often-cited "quarter
      trillion" post-COVID analysis estimated $250B of addressable virtual care value in the US across chronic care,
      behavioral health, and urgent care. Both figures are restricted-access; they are preserved as upper-bound
      context, not as direct SAM inputs.

      A narrower demand proxy is the US GLP-1/anti-obesity drug market. NCSL data, citing KFF analysis, show Medicaid
      alone spent ~$9B on GLP-1s in 2024, up from $1B in 2019 — representing government-payer demand only. Total US
      GLP-1 prescription spending (all payers) is not directly documented in available public sources, but NCSL's
      report that 12% of US adults are currently taking a GLP-1 drug and the $936–$1,023 monthly list price range
      imply a multi-billion-dollar annual market even at modest adherence. Sacra's estimate that Ro generated ~$370M
      of GLP-1-related revenue in 2024 with ~66% YoY growth implies Ro holds approximately a low single-digit
      percentage of total US GLP-1 patient spending.

      A bottom-up SAM estimate for Ro's specific cash-pay, GLP-1-focused model is difficult to isolate because most
      public market data treats telehealth and prescription drugs separately. The sizing table below preserves all
      lenses, their methodologies, and their limitations rather than selecting one estimate as definitive. Key
      diligence gaps are noted under evidence gaps.

      Employer GLP-1 spend is an emerging adjacent budget pool. IFEBP's 2024 survey reports that GLP-1 drugs represent
      on average 9.7% of total annual claims for employer plans that cover them for weight loss. With US private
      employer prescription drug spending in the hundreds of billions, even partial GLP-1 coverage across
      self-insured plans represents a $5–18B incremental demand layer — one that virtual weight management vendors
      like Ro are increasingly targeting.
