  evidenceGaps:
    - type: missing-source
      severity: material
      topic: telehealth TAM
      missingEvidence: >-
        A verified, primary-source, US-specific SAM estimate for cash-pay DTC telehealth platforms combining
        weight management, GLP-1 pharmacy, and sexual health. Grand View Research and McKinsey reports are both
        inaccessible; no independent analyst has published a publicly available estimate for this specific market.
      whyItMatters: >-
        Without a SAM-level estimate, all sizing is back-calculated from Ro's revenue with an assumed market share,
        creating circular reasoning. Investors cannot underwrite a growth thesis without an independent market size.
      diligencePath: >-
        License Grand View Research or IQVIA DTC health market report; request management disclosure of patient count,
        revenue-by-product-line, and payer-mix breakdown to enable bottom-up SAM calculation.
      relatedQuestionRefs:
        - QM001
        - QM017
        - QM022
      relatedTableRefs:
        - TM002
    - type: private-evidence-only
      severity: material
      topic: employer B2B revenue
      missingEvidence: >-
        No public disclosure of Ro's enterprise employer contracts, B2B revenue, or Ro Body employer enrollment.
        PHTI and IFEBP evidence confirms the market opportunity exists, but Ro's actual penetration is unknown.
      whyItMatters: >-
        The employer B2B channel is cited as a key growth vector; without disclosure, it cannot be sized or
        discounted in a valuation model.
      diligencePath: >-
        Request management disclosure of enterprise contract count, average contract value, and Ro Body employer
        vs. consumer enrollment split.
      relatedQuestionRefs:
        - QM025
      relatedTableRefs:
        - TM003
    - type: conflicting-data
      severity: material
      topic: compounding prohibition timeline
      missingEvidence: >-
        The exact timing and scope of FDA's semaglutide shortage removal and its impact on Ro's compound pharmacy
        operations is not clearly established from public sources. FDA's shortage database is up-to-date but does
        not specify Ro-specific impact.
      whyItMatters: >-
        Compounding prohibition could eliminate up to $370M of Ro's GLP-1 revenue segment. Timing and Ro's
        mitigation strategy (branded drug supply agreements) are critical to near-term financial modeling.
      diligencePath: >-
        Track FDA shortage database status monthly; request Ro's supply agreement disclosures with Novo Nordisk
        and Eli Lilly; confirm compound pharmacy percentage of GLP-1 revenue.
      relatedQuestionRefs:
        - QM011
        - QM019
      relatedTableRefs:
        - TM004
    - type: missing-source
      severity: minor
      topic: GLP-1 total US market size
      missingEvidence: >-
        Total US GLP-1 prescription drug spending across all payers (commercial, Medicaid, Medicare, cash-pay) in
        2024. IQVIA report was inaccessible; no single public source compiles all-payer GLP-1 spend.
      whyItMatters: >-
        Without total market size, Ro's revenue share cannot be calculated, making competitive position sizing
        and SAM penetration estimates highly uncertain.
      diligencePath: >-
        License IQVIA or Novo Nordisk/Lilly earnings call data for US GLP-1 prescription volumes and revenue;
        cross-reference with Medicaid data from NCSL/KFF as a floor.
      relatedQuestionRefs:
        - QM016
      relatedTableRefs:
        - TM002
    - type: missing-source
      severity: minor
      topic: GLP-1 net pricing vs. compounded alternatives
      missingEvidence: >-
        Net price of branded GLP-1 drugs after PBM rebates, manufacturer coupons, and patient assistance programs,
        and a head-to-head comparison to compounded semaglutide pricing available through platforms like Ro.
        No publicly available source itemizes all-in net pricing for cash-pay versus insured patients.
      whyItMatters: >-
        Net price determines actual out-of-pocket burden for Ro's cash-pay patients relative to insured alternatives.
        The pricing gap between compounded and branded GLP-1 is the core affordability driver for Ro's market access.
      diligencePath: >-
        Cross-reference GoodRx coupon prices, Novo Nordisk/Lilly patient savings program terms, and Ro disclosed
        compound semaglutide price; request management disclosure of blend average selling price for GLP-1 program.
