    title: Market Definition Table — Ro's Boundary vs. Broad Telehealth
    columns:
      - segment/category
      - included spend
      - excluded spend
      - buyer/payer
      - relevance to Ro
    rows:
      - - US Telehealth (Broad TAM)
        - All virtual clinical encounters across all payer types; estimated $87–$114B (Grand View Research, restricted)
        - In-person care, hospital CapEx, EMR software, non-clinical digital tools
        - Medicare, Medicaid, commercial insurers, employers, cash-pay patients
        - Outer TAM envelope; includes segments Ro does not serve (insurance-mediated, hospital-based)
      - - DTC Cash-Pay Telehealth (Ro's core model)
        - Synchronous telehealth consults, asynchronous messaging, subscription clinical management — no insurance
        - Insurance-billed visits, hospital video systems, employer-capitated platforms
        - Individual consumers paying out-of-pocket
        - Core revenue model; differentiates by eliminating insurance friction
      - - GLP-1 Anti-Obesity / Weight-Loss Care
        - Telehealth prescriptions, compounded or branded GLP-1 dispensing, ongoing clinical monitoring
        - Insurance-covered branded GLP-1 prescription fills not billed through Ro
        - Cash-pay patients; some employer-benefit-eligible patients who use Ro out-of-pocket
        - Dominant revenue driver; ~$370M of Ro's 2024 revenue (Sacra estimate)
      - - Online Pharmacy / Mail-Order Drug Fulfillment
        - Mail-order dispensing of GLP-1s (compounded semaglutide/tirzepatide), generics for ED/hair/skin
        - Retail pharmacy, insurance-billed specialty pharmacy, PBM-adjudicated fills
        - Same as DTC consult patients; Ro Pharmacy is vertically integrated
        - Margin-accretive layer beyond consult fees; regulatory risk if compounding prohibited
      - - Employer-Sponsored Virtual Weight Management
        - Employer-funded programs combining GLP-1 access, coaching, nutrition, behavioral support
        - Hospital wellness programs, capitated PCP visits for obesity, bariatric surgery benefits
        - Self-insured employers as direct payers; employees as users
        - Emerging B2B segment; Ro Body is positioned here; no confirmed enterprise contracts public
      - - Status-Quo Substitute (traditional in-person care)
        - In-person PCP/endocrinologist visits, in-person weight-loss clinics, bariatric surgery, OTC diet products
        - N/A — this is the substitute, not a segment Ro competes in
        - Individual patients with adequate in-person access; insured patients with specialist coverage
        - Substitute weakens in rural/underserved markets and where wait times or stigma are high
    notes: >-
      Grand View Research market size is from a restricted-access page; the $87–$114B range is widely cited in
      secondary reporting and treated here as indicative with medium confidence. Excluded spend boundaries
      follow Ro's publicly stated cash-pay, no-insurance model. Employer segment is speculative pending
      confirmed enterprise contracts.
