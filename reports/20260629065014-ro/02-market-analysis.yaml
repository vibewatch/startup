  - id: s3
    title: Buyer, User, and Payer Segmentation
    body: >-
      Ro's current business is almost entirely business-to-consumer, cash-pay. The individual patient is
      simultaneously the buyer (signs up, inputs payment), the user (receives clinical care and drugs), and the payer
      (bears 100% of cost). This creates a low-friction, high-ownership dynamic — patients are highly motivated and
      self-selected — but also creates sensitivity to out-of-pocket cost and CAC.

      Employers represent the most credible emerging buyer segment. IFEBP's 2024 pulse survey found that 26% of
      surveyed public employers and multiemployer plans covered GLP-1s for weight loss, while 63% covered them for
      diabetes only. The KFF 2025 Employer Health Benefits Survey found that while more large employers are covering
      GLP-1s for weight loss, cost concerns are driving many to consider scaling back or add step-therapy and
      utilization management requirements. PHTI's December 2025 employer guide explicitly calls out virtual weight
      management platforms as the preferred implementation vehicle for employer-sponsored GLP-1 programs, identifying
      three critical phases — Initiation, Maintenance, and Supported Discontinuation — that align closely with Ro
      Body's program structure. This creates a credible enterprise sales motion for Ro, though no publicly confirmed
      employer contracts have been disclosed.

      Drug manufacturers (Novo Nordisk, Eli Lilly) are a structural wildcard. They hold the upstream supply
      relationship and benefit from patient volume growth. They could become distribution partners, but could also
      launch competitive direct-to-patient programs or exclusive pharmacy relationships that displace Ro.

      Medicaid and Medicare represent a largely excluded segment in Ro's current model. NCSL confirms that Medicare
      is federally prohibited from covering weight-loss-only drugs, and Medicaid coverage of GLP-1s for obesity
      varies by state with only 13 programs covering it as of January 2026. Ro is cash-pay and uninsured patients
      represent a natural TAM ceiling for the payer-excluded segment.
