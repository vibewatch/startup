callouts:
  - calloutType: risk
    title: Compounding Prohibition Is the Key Near-Term Revenue Risk
    body: >-
      Approximately 62% of Ro's estimated 2024 revenue came from GLP-1 products (Sacra). A significant share of
      that revenue likely involves compounded semaglutide — available only while FDA designates GLP-1s as in
      shortage. If semaglutide is removed from the FDA shortage list, Ro's compound pharmacy model faces a near-term
      legal cliff. This is not a speculative risk: FDA removed certain GLP-1 molecules from shortage designation in
      2025, and BioSpace has flagged Ro's marketing amid tightening oversight. Diligence must quantify branded vs.
      compounded GLP-1 revenue and assess Ro's supplier agreements with Novo Nordisk and Eli Lilly for branded
      supply continuity.
    claimRefs:
      - CM007
      - CM035
      - CM036
      - CM040
  - calloutType: insight
    title: Employer Channel Is the Most Credible Path to SAM Expansion
    body: >-
      Self-insured employers represent a $5–18B incremental demand pool that Ro's vertically integrated platform is
      structurally positioned to serve. PHTI's December 2025 employer guide explicitly frames virtual weight
      management platforms as the implementation vehicle for GLP-1 programs. Ro Body's three-phase care model
      (clinical eligibility, medication management, behavioral support) maps directly to the PHTI framework. However,
      no confirmed enterprise contracts have been disclosed publicly, and the B2B sales cycle for employer benefits
      is longer and more complex than the DTC conversion funnel Ro has optimized.
    claimRefs:
      - CM014
      - CM015
      - CM018
      - CM024
      - CM025
  - calloutType: assumption
    title: SAM/SOM Estimates Carry High Uncertainty; Multiple Diligence Paths Required
    body: >-
      The lack of a verified, publicly available primary estimate for the US cash-pay DTC weight-management and
      GLP-1 pharmacy market means all SAM estimates in this chapter are back-calculations or indirect proxies.
      The three best available approaches — Grand View Research top-down (restricted), Sacra implied SAM from Ro
      revenue, and NCSL/KFF Medicaid spend as a floor — give ranges of $15–$250B, which is too wide to underwrite
      against. Management disclosure of patient count, ARPU, and payer-mix breakdowns would materially narrow
      the uncertainty.
    claimRefs:
      - CM008
      - CM010
      - CM011

