  - id: TM004
    title: Growth Drivers and Constraints Register
    columns:
      - driver or constraint
      - direction
      - timing
      - implication for Ro
      - diligence ask
    rows:
      - - GLP-1 demand surge (42.4% adult obesity prevalence)
        - Driver
        - Present and ongoing
        - Structural tailwind; ~70M clinically eligible adults (BMI≥30 or ≥27 + comorbidity) represent a multi-decade treatment pipeline
        - Confirm Ro's capacity to scale patient volume without degrading clinical quality or adding regulatory risk
      - - Access friction — provider shortages, wait times, stigma
        - Driver
        - Present
        - Telehealth captures patients who cannot or will not access in-person care; Ro's async model has low friction
        - Track NPS / abandonment at initial consultation step; validate Ro's conversion rates vs. peers
      - - Telehealth parity and state coverage expansion (44 states have private payer laws; CCHP 2025)
        - Driver
        - Recent (maturing through 2025)
        - Reduces regulatory and reimbursement risk as Ro pursues employer contracts; normalizes telehealth as a care setting
        - Confirm CCHP tracking of states where Ro operates; assess prescribing law compliance
      - - Employer obesity cost burden (86% cite long-term costs as top concern; IFEBP)
        - Driver
        - Emerging (2025–2027 wave)
        - Self-insured employers are motivated buyers; PHTI framework aligns with Ro Body's offering
        - Obtain first enterprise contract disclosures; track Ro Body enrollment growth vs. consumer segment
      - - GLP-1 list price barrier ($936–$1,023/month; NCSL)
        - Constraint
        - Present and structural
        - Cash-pay patients face affordability cliff without compounded alternatives; patient retention and adherence at risk
        - Monitor compounding regulatory status; quantify Ro branded vs. compounded GLP-1 revenue split
      - - FDA compounding clampdown (shortage status removal risk)
        - Constraint
        - Near-term (2025–2026)
        - Removal of semaglutide from shortage list would prohibit compound pharmacies; ~$370M of Ro's 2024 GLP-1 revenue potentially disrupted
        - Track FDA shortage database status monthly; assess Ro's branded GLP-1 supply agreements with Novo Nordisk / Lilly
      - - Cross-state licensing and Ryan Haight Act prescribing rules
        - Constraint
        - Present
        - Provider credentialing in all 50 states and DEA compliance add operational cost and constrain prescribing velocity
        - Audit Ro's provider network licensure coverage; assess compliance posture for telehealth prescribing
      - - Employer coverage pullback risk (many employers considering scaling back; KFF 2025)
        - Constraint
        - Emerging (2025–2026)
        - If large employers reduce GLP-1 benefits, employer-channel B2B growth may be slower than projected
        - Monitor KFF/IFEBP annual surveys; track self-insured plan GLP-1 coverage rates year over year
      - - GLP-1 discontinuation and CAC intensity
        - Constraint
        - Structural
        - High real-world discontinuation rates reduce LTV; Ro must continuously re-acquire churned patients or build retention programs
        - Disclose patient retention/churn metrics; assess Ro Body behavioral coaching efficacy
      - - Supply volatility and GLP-1 shortage history
        - Constraint
        - Recent (easing but not resolved)
        - Ro's supply tracker acknowledges volatility; shortages force patient waitlists and create revenue lumpiness
        - Confirm Ro's direct manufacturer supply agreements; assess fill-rate and back-order data
    notes: >-
      Timing classifications (Present/Near-term/Emerging/Structural) reflect the run date of 2026-06-29. Drivers
      and constraints are not equal in magnitude; compounding clampdown risk is classified as material-to-blocking
      given GLP-1 revenue concentration.
