  - id: s4
    title: Growth Drivers
    body: >-
      The structural demand case for Ro's market is among the strongest in digital health. NIDDK reports that 42.4%
      of US adults have obesity and another 30.7% are overweight — representing approximately 230M adults at elevated
      health risk. CDC data show 40.1M Americans with diagnosed or undiagnosed diabetes and 115.2M with prediabetes,
      a population that overlaps heavily with GLP-1 clinical eligibility. This population vastly exceeds current
      treatment capacity, creating a chronic supply/demand imbalance in weight-loss medicine.

      GLP-1 demand has compounded the market signal. NCSL reports Medicaid GLP-1 prescriptions grew 8× from 2019
      to 2024. CCHP's Fall 2025 report confirms that 44 states plus DC, Puerto Rico, and the US Virgin Islands have
      enacted private payer telehealth reimbursement laws, and 24 states plus Puerto Rico have payment parity
      requirements that help normalize telehealth as a legitimate care channel. This regulatory expansion reduces
      trust friction for consumers seeking care via telehealth.

      Access barriers — geographic provider shortages, long wait times for specialist appointments, and stigma around
      in-person weight management — amplify Ro's competitive position. Ro's fully virtual model, mail-order pharmacy,
      and no-insurance requirement remove the most common friction points. Provider shortages in endocrinology and
      obesity medicine make telehealth a structural substitute, not just a convenience one.

      Employer cost pressure on obesity care is generating a new institutional demand signal. IFEBP data show that
      86% of employer plan sponsors cite long-term obesity costs and associated chronic-disease risks as their top
      factor when considering GLP-1 coverage. As employers look for managed programs that include behavioral
      coaching, Ro's integrated platform model — clinical + pharmacy + support — fits the PHTI-recommended framework
      better than point-solution pharmacy-only vendors.
