  headline: Ro 在 D2C 医疗里已经做出一个有规模的真实资产，GLP-1 增长强、纵向整合也有分量；但 $7B 估值锚已经陈旧，缺少审计披露，又高度依赖受监管药厂渠道，公司更适合放进观察名单，还不是明确买入。
