  topStrengths:
    - 纵向整合的 ro.OS 工作流把远程医疗、药房、诊断和上门护理接得更紧，强于大多数 D2C 同行。
    - 2024 年收入估计约 $598M、同比增长 66%，说明私营公司不透明之下仍有真实规模。
    - 与 Novo Nordisk、Eli Lilly 的优先药厂关系，在复方药限制收紧后支撑品牌 GLP-1 获取。
    - Roman、Rory、生育、戒烟、减重和日常健康等病种覆盖广，带来交叉销售潜力。
  topRisks:
    - 估计 2024 年收入约 62% 绑定 GLP-1 护理，集中度风险很尖锐。
    - 最后披露的估值是 2022 年 2 月 $7B；对照当前公开可比公司，这个标记似乎难以支撑。
    - 没有审计财务、S-1 或其他公开经营披露，无法验证收入质量、利润率、烧钱速度或资本结构。
    - 复方 GLP-1 推广和远程医疗广告的监管收紧，可能推高合规和获客成本。
    - Novo Nordisk 或 Eli Lilly 一旦调整药厂渠道或定价，增长可能突然受损。
  unresolvedGaps:
    - 经审计的 2023-2025 年收入、毛利率、烧钱速度、现金跑道和债务余额仍未披露。
    - Ro 与 Novo、Lilly 关系的当前经济性未知，包括返利、排他性和利润率结构。
    - 2022 年后是否存在老股交易、内部估值下调或股权结构 preference overhang，公开资料看不到。
    - 客服解决率和投诉严重程度只能部分观察，因为关键评价渠道被屏蔽或不完整。
    - 没有经核验的 SEC 注册声明能确认 IPO 准备正在推进，而不只是猜测。
