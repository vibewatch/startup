  data:
    nodes:
    - id: d1
      label: FDA / DEA / FTC
      description: Regulatory enforcement bodies for compounding, DTC ads, and prescribing.
    - id: d2
      label: Novo Nordisk
      description: Primary GLP-1 manufacturer for Wegovy and Ozempic.
    - id: d3
      label: Eli Lilly
      description: Secondary GLP-1 manufacturer for Zepbound.
    - id: d4
      label: Capital markets / investors
      description: No external funding since 2022; runway is unknown.
    - id: d5
      label: State medical boards / CCHP framework
      description: 50-state licensing and prescribing rules.
    - id: d6
      label: Ro Pharmacy (in-house)
      description: Dispensing and fulfillment layer.
    - id: d7
      label: GLP-1 revenue (~62% of estimated $1.03B)
      description: Critical financial node.
    - id: d8
      label: Platform solvency and IPO readiness
      description: Ultimate value-realization path.
