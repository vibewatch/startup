- id: s6-governance
  title: Governance, conflicts of interest, and disclosure opacity
  body: >-
    Ro's governance presents a material diligence gap rather than a confirmed problem. The board composition has never been publicly disclosed; EDGAR Form D filings from 2021 show Initialized Capital and General Catalyst as investors but name no independent directors. Alexis Ohanian is an investor with a governance relationship to Ro, and his wife Serena Williams serves as Ro's paid brand ambassador for GLP-1 products. This arrangement — if Ohanian holds an active board seat — would constitute a related-party transaction under standard governance frameworks and would require disclosure under IPO-era S-1 rules.


    No such disclosure exists because no S-1 has been filed. TechStackIPO lists Ro as having an IPO readiness profile, but EDGAR confirms no S-1 or public company filings. The combination of governance opacity, stale valuation mark, and undisclosed financial performance creates an environment where independent investment underwriting is severely limited. Any institutional investment at current scale would require a full governance disclosure package, a current board roster, committee membership detail, and related-party policy review as a first diligence step.
