- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold/event
  - action implication
  rows:
  - - FDA compounding enforcement becomes direct action against Ro
    - FDA website announces warning letter or consent decree naming Roman Health Ventures or Ro specifically
    - FDA posts a warning letter to Ro on its public warning letter database or files an injunction
    - Immediate pause of GLP-1 marketing; legal review; significant revenue at risk; thesis-break event if revenue is impaired materially
  - - Novo Nordisk or Lilly supply disruption
    - Ro's supply tracker page goes back to limited supply for Wegovy or Zepbound, or manufacturer press release announces DTC channel reallocation
    - Any confirmed supply reduction of > 20% affecting Ro Body subscriber fulfilment for more than 30 days
    - Reduce growth assumptions by 30–50%; re-evaluate subscriber continuity and churn trajectory; trigger detailed diligence on supply agreements
  - - Valuation writedown or fundraise at below $5B
    - New capital raise, tender offer, secondary transaction, or 409A disclosed at a valuation materially below the 2022 $7.0B mark
    - Any publicly reported transaction below $5.0B or a distressed financing event
    - Revise all valuation scenarios downward; reassess exit timing assumptions; check for liquidation preference stacking that could impair common equity
  - - Marketing compliance action or major BBB/FTC complaint escalation
    - Multiple class-action filings, FTC investigation announcement, or BBB accreditation revoked; increase in BBB complaint volume beyond current 36 reviews
    - New FTC civil investigative demand against Ro or a complaint surge (> 100 unresolved BBB complaints)
    - Adjust operating cost model for legal defense; re-examine customer trust and acquisition cost assumptions
  - - GLP-1 market structural shift — broad insurance coverage
    - Employer GLP-1 coverage rate exceeds 60% of large US employers; national payer launches GLP-1 obesity benefit with standard formulary
    - Published employer benefit survey shows majority of workers have in-network GLP-1 coverage
    - DTC membership model comes under structural pressure; model shift to an insurance-enabled channel or B2B route would require material strategic and cost re-architecture
  notes: Kill criteria are designed to be monitorable from public sources — FDA warning letter databases, Ro's own supply tracker, third-party news, BBB, and employer benefit surveys — without requiring insider access. The most important near-term trigger is direct FDA action against Ro, which has not occurred as of the report date but is the clearest thesis-break event given the current enforcement posture.
