- id: s3-supply-chain
  title: Manufacturer and supply chain dependency — uncontracted exposure to Novo Nordisk and Eli Lilly
  body: >-
    Ro's GLP-1 business is a cash-pay distribution channel for two pharmaceutical manufacturers — Novo Nordisk for Wegovy and Ozempic and Eli Lilly for Zepbound — neither of which has a publicly disclosed supply agreement with Ro. During the 2022–2024 semaglutide shortage, Ro had an alternative route through compounding pharmacies, but that optionality has been extinguished by the shortage's end and the FDA's proposed 503B exclusion. If Novo Nordisk or Eli Lilly reallocates supply toward preferred retail pharmacy, PBM, or insurance channels — as both have historically prioritized — Ro's subscriber base would face fulfillment disruptions with no disclosed fallback.


    The Hims & Hers 2025 10-K identified manufacturer supply as a material risk factor, and Ro faces an identical structural exposure. Ro's in-house pharmacy provides some operational buffer by controlling dispensing, but it does not change the upstream supply dependency on two manufacturers for branded GLP-1 molecules. Sacra's Ro profile notes this concentration risk explicitly, and Ro's own public supply tracker demonstrates that management already treats continuity of supply as a core operating issue rather than a theoretical edge case.
