- id: s4-financial-opacity
  title: Revenue concentration and financial opacity — stale valuation, unknown runway, and GLP-1 margin risk
  body: >-
    Ro's financial risk profile is compounded by an unusual combination of high revenue concentration and extreme disclosure opacity. GLP-1 weight loss accounts for an estimated 62% of roughly $1.03B in 2024 revenue, creating single-product-line exposure that is without disclosed mitigation in the form of hedges, supply contracts, or alternative revenue streams. Sacra's estimate is the only available revenue figure; Ro publishes no audited financials, no EBITDA or cash flow disclosure, and no guidance. The $7.0B valuation is four years stale, set at a 2022 peak-market multiple that public digital health comparables have since abandoned.


    Applying public-company telehealth multiples to Ro's estimated revenue implies a substantial discount to the 2022 mark. No new fundraising has been publicly reported since the 2022 Series E, and without public financials, the adequacy of Ro's cash position to fund compliance costs, legal defense, and growth through the current regulatory inflection cannot be independently verified. Hims & Hers' post-compounding transition also suggests branded GLP-1 mix can pressure gross margin, meaning Ro's most important product line may be both more regulated and less profitable than the shortage-era model that likely drove its growth spike.
