callouts:
- calloutType: risk
  title: FDA enforcement is industry-wide, not company-specific — but Ro is directly in scope
  body: Three FDA actions in Feb–Apr 2026 targeted the compounded GLP-1 DTC market that Ro operated in during the shortage; no Ro-specific action has been filed, but the enforcement standards now prohibit marketing practices that were common across the industry.
  claimRefs:
  - CR002
  - CR003
  - CR004
  - CR047
- calloutType: risk
  title: Manufacturer dependency is the supply-chain equivalent of a single-customer revenue concentration
  body: Ro has no disclosed supply contract with Novo Nordisk or Eli Lilly; approximately 62% of estimated revenue depends on branded drug supply from these two manufacturers, with no fallback compounding option remaining after the shortage exception expired.
  claimRefs:
  - CR013
  - CR014
  - CR017
  - CR048
- calloutType: assumption
  title: The $7.0B mark may be 4x overpriced relative to public comps
  body: Applying Hims & Hers' 2026 public market multiple of roughly 1–2x forward revenue to Ro's estimated ~$1.03B revenue implies a $1–2B range; the 2022 private mark may deserve a premium, but that premium is unverifiable without audited financials.
  claimRefs:
  - CR018
  - CR022
  - CR038
  - CR039
- calloutType: insight
  title: Ro peer-reviewed clinical data is a partial mitigation for FTC and FDA marketing scrutiny
  body: The December 2025 peer-reviewed study showing 16.6% body weight loss at 68 weeks is the strongest mitigation for outcome-claim enforcement, but it applies only to semaglutide and does not address the sameness prohibition or ambassador-campaign compliance risk.
  claimRefs:
  - CR007
  - CR026
  - CR028
  - CR044
