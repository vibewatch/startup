  - id: s2-patient-journey
    title: End-to-End Patient Workflow
    body: >-
      Ro's operating model converts an initial patient visit into a longitudinal care relationship entirely
      within ro.OS. The workflow begins when a patient completes a condition-specific online visit
      questionnaire through the Patient App; the Care Delivery App then surfaces this intake to a
      Ro-affiliated provider for asynchronous review. Providers use the EMR to evaluate the patient's
      medical history, set eligibility, and, where appropriate, generate a prescription—all without the
      patient needing to be present synchronously.

      For GLP-1 weight loss, after a prescription is created, Ro's insurance concierge module handles
      prior authorization and coverage paperwork on the patient's behalf. Cash-pay patients can receive
      their first GLP-1 dose in less than a week; insurance patients take approximately two to three weeks
      for coverage determination. Prescriptions are fulfilled by Ro's pharmacy network or, for branded
      GLP-1s, shipped directly from manufacturer programs (NovoCare, LillyDirect).

      Ongoing care is managed through the Patient App's Care Comms feature, which enables patients to
      message their provider about side effects, progress updates, or questions at any time. The Care
      Delivery App's Health Tasks module provides smart task prioritization so providers and care teams
      can triage responses efficiently. Lab testing integrates into the loop via the Lab App: providers
      can order at-home test kits or direct patients to Quest Diagnostics locations nationwide, with
      results automatically fed back into the patient's record. Ro's founder letter also references an
      LLM-based adverse-event triage capability with 94% accuracy and 33-minute average response time,
      though this specific performance data is company-sourced only.
