  - id: s5-strengths-defensibility
    title: Technical Strengths and Defensibility
    body: >-
      Ro's primary technical differentiator is ownership of the full clinical workflow stack. Unlike
      competitors that rely on third-party EHRs (Epic, Cerner, or generic telehealth platforms), Ro
      has built a purpose-built EMR that is, per its own description, "designed for delivering care,
      not billing for it." The Care Delivery App embeds patient intake data, lab results, clinical
      notes, and communication into a single interface, reducing context-switching for providers.
      Smart task prioritization (Health Tasks) and automated side-effect alerting support clinical
      quality and throughput at scale.

      On the pharmacy side, Ro operates six owned pharmacies connected to the Pharmacy App's
      distributed fulfillment network. The Pharmacy App provides pharmacists with real-time patient
      data, drug contraindication alerts, allergy reminders, and identity-verified dispensing—
      capabilities the company claims reduce treatment delays and support adherence. Sacra's analysis
      notes that Ro's vertical integration enables same-day or next-day medication shipment by
      combining its own lab processing, owned pharmacies, and proprietary supply chain visibility.

      The Lab App's dual-mode testing (proprietary at-home kits sent to a CLIA-certified, CAP-
      accredited dedicated lab, plus integration with thousands of Quest Diagnostics locations) gives
      patients and providers flexible, accessible testing without the friction of scheduling a
      separate diagnostic appointment. Automated result delivery directly into the patient's care
      record eliminates manual follow-up steps. Ro's LegitScript certification confirms its adherence
      to online pharmacy compliance standards, providing a baseline trust signal for patients and
      regulators. Together, these assets create switching costs: a patient's care history, lab results,
      prescription record, and provider relationship are all embedded in ro.OS, making migration to
      a competitor operationally disruptive.
