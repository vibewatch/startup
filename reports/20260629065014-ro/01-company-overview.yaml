callouts:
  - calloutType: risk
    title: "IPO Status Unverified — TechStackIPO vs. SEC EDGAR Conflict"
    body: >
      TechStackIPO claims Ro filed an S-1 in February 2026 and is actively pursuing an IPO. SEC
      EDGAR for CIK 0001706332 shows only Form D exempt-offering notices through the June 2026 run
      date — no S-1 or S-1/A registration statement. This conflict must be resolved before any
      IPO-predicated valuation assumptions are applied. The last confirmed valuation ($7B, Feb 2022)
      is over four years stale.
    claimRefs:
      - CO041
      - CO042

  - calloutType: risk
    title: "GLP-1 Revenue Concentration and Manufacturer Dependence"
    body: >
      Sacra estimates that ~62% of Ro's 2024 revenue came from GLP-1 products, up from negligible
      in 2021. This concentration in a single drug class creates material exposure to manufacturer
      pricing changes, formulary decisions, and regulatory actions. Novo Nordisk ended its Wegovy
      telehealth partnership with Hims & Hers in June 2025 while retaining Ro — demonstrating that
      this relationship is valuable but also contingent.
    claimRefs:
      - CO032
      - CO049

  - calloutType: insight
    title: "Vertically Integrated Platform Is the Core Defensive Moat"
    body: >
      Ro's ro.OS platform — integrating telehealth, pharmacy, labs, and in-home care — is the
      structural differentiator from single-service D2C peers. Modern Fertility, Workpath, and Kit
      acquisitions enable closing the clinical loop between prescribing, monitoring, and renewal,
      which creates long-duration care pathways. This is Ro's primary argument against commoditization
      from TrumpRx, generic telehealth competitors, and retail healthcare channels.
    claimRefs:
      - CO036
      - CO037
      - CO038
      - CO051

