  - id: s3
    title: Capital Base and Valuation History
    body: |
      Ro has raised approximately $1.03B in primary capital across seven documented rounds from
      August 2017 through February 2022. The company completed two seed rounds in 2017 (August:
      $2.87M; November: $3.1M led by General Catalyst), a $88M Series A in September 2018 led
      by FirstMark Capital, an $85M Series B in April 2019 at a $500M post-money valuation, a
      $200M Series C in July 2020 led by General Catalyst (total raised: $376M at that point), a
      $500M Series D in March 2021 led by General Catalyst, FirstMark, and TQ Ventures at a $5B
      valuation ($876M total at the time), and a $150M extension in February 2022 led by
      ShawSpring at a $7B valuation. All rounds are confirmed through SEC Form D filings or
      cross-verified through at least two independent news or data sources.

      General Catalyst is the dominant institutional capital provider, having led or co-led the
      Series C and the March 2021 Series D. Silicon Valley Bank (SVB) provided parallel debt
      facilities scaling from a $20M growth capital facility after Series A through a $125M
      revolving credit line alongside the Series D, enabling working capital flexibility.
      Recurring investors across multiple rounds include SignalFire, BoxGroup, Initialized Capital,
      TQ Ventures, and Torch Capital, reflecting sustained institutional conviction.

      No funding round has been confirmed by the company or filed with the SEC after February 2022
      as of the June 2026 run date. The $7B valuation from the last priced round is therefore
      stale by more than four years. Sacra's estimate of $598M in 2024 revenue would imply a
      revenue multiple of approximately 11.7x on the 2022 valuation—a ratio that the broader
      telehealth sector re-rating would likely not sustain at that level in 2026. No secondary
      transactions, convertible notes, or additional debt facilities have been publicly disclosed
      since SVB's 2021 revolving credit line.
