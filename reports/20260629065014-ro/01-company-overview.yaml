  - id: s4
    title: Product Portfolio, Scale, and Key Milestones
    body: |
      Ro began as a single-condition men's sexual health platform (erectile dysfunction) in October
      2017 and has since expanded to cover weight loss/GLP-1 management, men's sexual health
      (Roman brand), women's health (Rory brand), smoking cessation (Zero brand), fertility,
      hair loss, skincare, and daily health supplements. The weight-loss/GLP-1 vertical now
      dominates: Sacra estimates that GLP-1 revenue reached approximately $370M in 2024 (~62%
      of total estimated revenue), up from a negligible share in 2021. Total estimated revenue
      grew from ~$360M in 2023 to ~$598M in 2024, a ~66% year-over-year increase.

      Ro's service scale is substantial: by May 2021 the company reported facilitating more than
      8 million digital healthcare visits in nearly every US county, including 98% of primary care
      deserts—a figure cited in its own press releases. Tracxn legal entity data shows the
      principal operating entity (ROMAN HEALTH VENTURES INC.) employed 489 persons as of
      December 31, 2024, with a related entity showing 496 employees on the same date; these
      figures are not officially disclosed by Ro.

      Key acquisition milestones include the May 2021 acquisition of Modern Fertility (reported
      deal value over $225M), a reproductive health company co-founded by Afton Vechery and
      Carly Leahy, who joined Ro as President of Women's Health and VP of Brand respectively.
      In 2021 Ro also acquired Workpath (in-home care software API enabling on-demand nursing
      and phlebotomy) and Kit (at-home diagnostics startup). These acquisitions enabled the
      vertically integrated care-pathway model underpinning ro.OS.

      The Ro Body GLP-1 membership ($145/month subscription) bundles telehealth, lab work,
      dose titration, and coaching. Direct partnerships with Novo Nordisk's NovoCare Pharmacy
      and Eli Lilly's cash-pay channels give Ro access to branded Wegovy, Zepbound, and their
      oral analogs (semaglutide pill, Foundayo), differentiating from compounders and cementing
      Ro's status as a preferred manufacturer distribution partner. Ro also publishes clinical
      outcome data: semaglutide patients on the platform lost an average 16.6% body weight over
      68 weeks (655 patients, peer-reviewed in Obesity journal), and tirzepatide patients lost
      19.5% at 12 months, supporting payer and employer outreach.
