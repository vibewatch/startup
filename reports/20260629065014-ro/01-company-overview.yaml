  - id: s2
    title: Founders, Leadership, and Board Governance
    body: |
      Ro was co-founded by Zachariah Reitano (CEO), Saman Rahmanian, and Rob Schutz. All three
      are listed as related persons in SEC Form D filings from 2017 and 2020. Reitano's founding
      motivation was personal: his family's extensive medical history—multiple heart attacks,
      cancer, neurological disease—and the role of his physician father as an informal health guide
      inspired him to "put his dad in everyone's home through software." Reitano remains the
      central strategic, public, and investor-relations face of the company; key-person dependence
      on him is high.

      Board governance has expanded meaningfully since Series A. Alexis Ohanian (Reddit co-founder,
      776 Capital) joined the board as a director following the 2018 Series A, confirmed in
      subsequent SEC Form D filings. Rick Heitzmann (FirstMark Capital managing director) holds a
      board seat consistent with FirstMark's lead-investor role. Tony West (former Uber Chief Legal
      Officer) joined the board in September 2020, bringing regulatory and legal expertise. Hemant
      Taneja (General Catalyst managing partner, co-founder of Livongo Health) serves as an investor
      representative with board influence. Margo Georgiadis, former CEO of Ancestry.com and SVP at
      Google, joined the board in October 2021, adding consumer digital-health scaling experience.

      A related-party dynamic exists: Alexis Ohanian is a board member and investor, and his wife
      Serena Williams has appeared in Ro's GLP-1 marketing campaigns beginning in 2025, including
      a high-profile Super Bowl advertisement. Biospace and other analysts have flagged this
      relationship as creating a potential conflict-of-interest angle and regulatory arbitrage
      concern (addressed in section 5). Full current board composition is not independently
      verifiable beyond sources through early 2022; leadership changes since then (if any) are
      not confirmed in publicly available filings.
