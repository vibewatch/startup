- id: named-proof
  title: Named Customer Proof and Reference Quality
  body: 'This is where the evidence is weakest on the diligence scale. Psibot has no named production customer publicly disclosed; its clients are described generically — "a large logistics client", "one of the world''s largest fibre-optic cable makers" — or are strategic investors rather than arm''s-length buyers. The fibre-optic testing and the logistics sorting pilot are the two most concrete engagements, but both are pilot/testing-stage with unquantified outcomes and no reference-customer attestations. Against a diligence rubric that prizes named, production-grade references with measurable outcomes, Psibot''s customer proof is low-quality despite strong investor validation.


    The ecosystem context must be read carefully to avoid over-crediting it. Chery Automobile''s AiMOGA Robotics subsidiary unveiled its own humanoid (Mornine) and signed a 1,000-unit intelligent-police-robot deal in April 2026, and the Chery/AiMOGA ecosystem spans 30-plus countries — but AiMOGA''s robots are not confirmed to run Psibot''s Psi model, so that deal is ecosystem context, not direct Psibot customer proof. The honest position is that Psibot''s named-proof table lists mostly unnamed pilots and strategic-investor relationships, and the single most valuable near-term diligence step is obtaining named, production references with disclosed outcomes.'
