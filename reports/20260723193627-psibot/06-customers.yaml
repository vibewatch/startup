- id: adoption-trajectory
  title: Adoption and Deployment Trajectory
  body: 'The adoption trajectory is early and pilot-weighted. The most tangible number is roughly 100 data-collection/manipulation units deployed in Beijing by early 2026, gathering distributed real-world manipulation data in logistics settings. Crucially, this footprint doubles as both deployment and dataset-building: warehouse workers wear Psi-SynEngine data gloves during real operations, so the "deployment" is as much an operator base assembling the one-million-hour 2026 data goal as it is a set of paying enterprise accounts. That blurring means the 100 units are not, on their own, revenue proof.


    Beyond the data-collection footprint, adoption is a small-scale warehouse sorting validation at a large Chinese logistics client (reporting efficiency gains) and testing at a major fibre-optic cable maker — pilots and tests, not multi-site production accounts. Psibot discloses no active-account count, deployment count, utilization rate, or repeat-purchase data, so the denominator behind any adoption claim is missing. Sector context cuts both ways: Morgan Stanley doubled its 2026 China humanoid shipment forecast to 50,000 units, signalling genuine pilot-to-production momentum that benefits Psibot''s OEM licensees, but the same market remains early, and Psibot''s own conversion from pilot to durable production accounts is not yet demonstrated.'
