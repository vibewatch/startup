- id: retention-durability
  title: Retention, Repeat Usage, and Durability
  body: 'On retention there is nothing to measure, and that absence is itself the finding. Psibot discloses no net revenue retention, gross retention, churn, renewal rate, or contract length, and there is no cohort or repeat-usage data of any kind. Two structural facts compound the gap: the company was founded in 2024, so it is simply too young to have completed meaningful renewal cycles, and its adoption is pilot-stage, so there are few if any contracts whose durability could be assessed. No customer-satisfaction score, NPS, or reference-quality metric is disclosed either.


    What can be said about durability is qualitative and forward-looking. If an OEM licensee builds its product on the Psi model and accumulates deployment history, switching costs rise, and Psibot''s proprietary dataset plus OEM relationships would become the durable assets that lock customers in. But that is a thesis, not a demonstrated retention curve. The sector backdrop reinforces caution: IDC reports more than 85% of 2025 humanoid deployments were non-productive, so even where robots are deployed, sustained productive usage — the precondition for renewal — is far from guaranteed. Every retention field in this chapter is therefore null with a specific diligence request attached.'
