- id: expansion-concentration
  title: Expansion, Concentration, and Channel Dependence
  body: 'Psibot''s intended expansion motion is land-and-expand through OEM licensing amplified by the data flywheel — each deployment enriches the dataset that improves the model that wins the next OEM — but there is no disclosed evidence of account expansion, upsell, or multi-site rollout yet, and procurement dynamics (sales cycle, contract length, pricing) are undisclosed, so buyer friction cannot be assessed. The expansion case is structurally plausible and empirically unproven.


    Concentration and channel dependence are the sharpest risks. Early demand is linked to strategic investors — Chery, Lens Technology, and state-linked funds (GL Ventures, Lanchi Ventures, SDIC Advanced Manufacturing Fund, Jingxi Ruiling) — rather than to demonstrably arm''s-length commercial buyers. That backing is genuinely valuable: it shortens sales cycles, de-risks manufacturing access, and constitutes high-quality validation even absent named production customers. But it is double-edged, concentrating demand in a small set of related parties and raising the question of whether early revenue is commercial or strategic. Geographic concentration in China adds a second axis of concentration, tying adoption to domestic state-owned-enterprise adoption mandates while constraining international expansion. The diligence priority is a related-party transaction schedule and a top-customer concentration disclosure.'
