  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: named production customers and reference quality
    missingEvidence: Any named, production-grade customer with disclosed deployment scope, contract, and measurable outcome, versus the current unnamed pilots and strategic-investor relationships.
    whyItMatters: Named production references with outcomes are the strongest customer-proof signal; their absence means adoption rests on pilots and investor validation, not demonstrated commercial demand.
    diligencePath: Request named reference customers, signed deployment contracts with scope and outcomes, site counts, and permission to contact production references directly.
    relatedQuestionRefs:
    - QU010
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: retention, cohort, and repeat-usage metrics
    missingEvidence: Net revenue retention, gross retention, churn, renewal rate, contract length, and any cohort or repeat-usage series for Psibot's deployments.
    whyItMatters: Without retention and cohort data, durability and lifetime value cannot be assessed, and pilot enthusiasm cannot be distinguished from sustained, renewing usage.
    diligencePath: Obtain cohort retention by deployment vintage, renewal and churn rates by account, contract lengths, and repeat-purchase history from Psibot and its OEM licensees.
    relatedQuestionRefs:
    - QU013
    - QU014
    relatedTableRefs:
    - TU004
    - TU006
  - type: private-evidence-only
    severity: material
    topic: satisfaction, concentration, and related-party share
    missingEvidence: Customer-satisfaction/NPS scores, top-customer concentration, and the share of revenue linked to strategic investors versus arm's-length buyers.
    whyItMatters: Satisfaction and concentration data reveal whether early demand is durable and commercial or a small set of related-party engagements, materially affecting revenue quality.
    diligencePath: Request a satisfaction/NPS summary, a top-customer concentration schedule, and a related-party transaction schedule distinguishing strategic-investor demand from arm's-length demand.
    relatedQuestionRefs:
    - QU019
    relatedTableRefs:
    - TU005
