chapter:
  number: 6
  title: Customers
  summary: 'Psibot''s customer story is investor-validated but commercially unproven. Because Psibot sells an intelligence layer rather than robots, its primary customers are robot OEMs and developers who license the Psi VLA model, with logistics/warehousing (barcode sorting, high-SKU clothing distribution) and manufacturing (fibre-optic cable handling) as the end-use verticals. The concrete adoption evidence is thin and pilot-stage: a small-scale warehouse sorting validation at an unnamed large Chinese logistics client, testing at one of the world''s largest fibre-optic cable makers, and roughly 100 data-collection/manipulation units deployed in Beijing by early 2026 — the latter an operator/worker base building the dataset rather than paying enterprise accounts. No named production customer, no active-account count, no utilization rate, and no repeat-purchase data are disclosed. The strongest customer-adjacent asset is the quality of Psibot''s strategic backers and ecosystem: Chery Automobile (with its AiMOGA Robotics subsidiary, which unveiled humanoids and a 1,000-unit intelligent-police-robot deal in April 2026) and Lens Technology (building an embodied-intelligence centre), plus state-linked funds (GL Ventures, Lanchi Ventures, SDIC Advanced Manufacturing Fund, Jingxi Ruiling). This backing is double-edged — it shortens sales cycles and de-risks manufacturing, but it concentrates early demand and raises related-party questions, since AiMOGA''s own robots are not confirmed to run the Psi model. On retention and durability, there is simply nothing to measure: no NRR, GRR, churn, renewal, contract-length, cohort, or satisfaction data, and the company (founded 2024) is too young to show renewal cycles. Sector evidence tempers the read — IDC reports more than 85% of 2025 humanoid deployments were non-productive and a Morgan Stanley survey found only 23% of prospective industrial buyers satisfied — even as Morgan Stanley doubled its 2026 China shipment forecast to 50,000 units, a tailwind for Psibot''s OEM licensees. The customer verdict: strong strategic validation and named pilots, but no named production customers, no retention visibility, and elevated concentration/related-party risk that diligence must resolve.'
sections:
- id: segmentation
  title: Customer Base Segmentation
  body: 'Psibot''s customer model follows directly from its platform-licensing strategy: it does not sell finished robots to end-enterprises but licenses the Psi vision-language-action model to robot OEMs and developers, who then embody it in their own hardware for end-customers. In buyer/user/payer terms, the OEM is typically the buyer and payer, while the end-enterprise (a warehouse or factory operator) is the ultimate user of the manipulation capability. The verticals are concrete: logistics and warehousing — barcode sorting and high-SKU clothing-distribution picking, where object diversity and frequent task changes demand the generalization a VLA model provides — and manufacturing, evidenced by testing at one of the world''s largest fibre-optic cable makers.


    Geographically the base is concentrated in China, consistent with Psibot''s Beijing/Shanghai footprint and China''s state-backed embodied-AI push, with logistics, retail, and smart-manufacturing warehousing as the target segments. The addressable customer set is therefore the many robot OEMs across China''s rapidly scaling humanoid market, through which large logistics buyers (State Grid-, SF Express-, and China Post-type enterprises) become reachable. Psibot chose barcode-sorting logistics as its first real-world deployment precisely because high SKU diversity and changing tasks are where rigid automation fails and a generalizing brain earns its keep — a deliberate wedge segment rather than a broad launch.'
