- id: milestones-and-trajectory
  title: Milestones and Trajectory
  body: 'Psibot''s chronology of record spans just under two years but is unusually dense across founding, product, financing, and commercialization tracks. The company was founded on 1 September 2024; released its first end-to-end reinforcement-learning embodied model, Psi R0, on 30 December 2024; began proof-of-concept engagements and signings with key clients in January 2025; released Psi R0.5 in March 2025; launched its Psibot V1 and Psibot H1 hardware platforms in April 2025; and released the flagship Psi R1 in May 2025, demonstrating what it classifies as L3 (autonomous, long-horizon) dexterous manipulation by having a robot play Mahjong autonomously for more than thirty continuous minutes.


    The financing and scale milestones then accelerated: the angel round in November 2024, the 2-billion-yuan combined angel/Pre-A disclosure in March 2026, the release of the human-data-pretrained Psi-R2 and Psi-W0 models on 10 April 2026 (with 1,000 hours of multimodal hand-manipulation data open-sourced), and the Chery-led near-US$100 million round reported on 23 July 2026 at a US$1.48 billion valuation. Several product entries are anchored at month granularity from company materials, and the July 2026 round is reported as still finalizing rather than closed, so the timeline preserves those qualifications rather than smoothing them. Adverse or governance events (litigation, executive churn, recalls) are not present in retained public sources — consistent with a very young private company, though also a function of limited disclosure rather than a clean audited record.'
