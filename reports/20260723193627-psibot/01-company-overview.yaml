- id: leadership-and-team
  title: Founders, Leadership, and Key-Person Dependence
  body: 'Psibot is led by founder and CEO Dr. Viktor Wang (Chinese name Wang Qibin / 王启斌), who holds a PhD from George Washington University and brings roughly two decades of hardware and commercialization experience, including as president of JD.com''s robotics business and vice-president of products at Yunji Technology, with earlier stints at BlackBerry. The technical bench is the company''s signature asset: co-founder and engineering leader Dr. Xiaojie Chai spent more than fifteen years in robotics and autonomous driving at Alibaba and Tencent and has led L4 self-driving deployment; chief scientist Prof. Yaodong Yang is an assistant dean and Boya Scholar at Peking University''s Institute for Artificial Intelligence, a UCL-trained reinforcement-learning researcher who won the NeurIPS 2022 embodied dexterous-manipulation challenge and heads the PKU-PsiBot Joint Lab; and co-founder Yuanpei Chen, a Gen-Z researcher who was a visiting scholar at Stanford under Karen Liu and Fei-Fei Li and claims to be the first to control bimanual multi-skill manipulation in the real world with reinforcement learning.


    This concentration of scientific talent — Psibot markets itself as the "embodied-AI company with the highest density of scientists" — is also its most acute governance risk. The investment thesis leans heavily on a handful of named individuals: the CEO''s commercialization track record, the chief scientist''s academic pedigree and PKU lab, and Chen''s control-model research. Board composition, equity split, and formal governance are not disclosed in public sources, and there is no evidence of an independent board or professional management depth beyond the founding scientists, which concentrates key-person dependence and makes retention of the academic founders a material diligence question.'
