company:
  name: Psibot
chapter:
  number: 1
  title: Company Overview
  summary: 'Psibot (also known as Lingchu Intelligence / 灵初智能) is a Chinese embodied-AI startup founded in September 2024 that builds Vision-Language-Action (VLA) plus reinforcement-learning models for dexterous robotic manipulation, targeting logistics and industrial automation. Its differentiator is a "small full-stack" platform strategy: it licenses its Psi-series AI "brain" and sells a proprietary human-hand data-collection system rather than competing purely on humanoid hardware. On 23 July 2026 Bloomberg reported the company was close to finalizing a round of nearly US$100 million led by carmaker Chery Automobile with Lens Technology participating, at a roughly US$1.48 billion post-money valuation that makes it one of China''s newest embodied-AI unicorns, lifting total capital raised since inception to about US$300 million. The founding bench is unusually research-heavy — a JD.com robotics veteran CEO, an Alibaba/Tencent autonomous-driving engineer, a Peking University reinforcement-learning professor, and a Stanford scholar from Fei-Fei Li''s orbit — but revenue, headcount, and shipment figures remain undisclosed.'
sections:
- id: identity-and-business-model
  title: Identity, Headquarters, and Business Model
  body: 'Psibot, which trades in Chinese-language sources under the name Lingchu Intelligence (灵初智能), is an embodied-artificial-intelligence company founded on 1 September 2024 and operating out of Beijing and Shanghai. It describes itself as a leader in China''s embodied-AI sector focused on general-purpose embodied intelligence, large-scale Vision-Language-Action (VLA) models, and dexterous-manipulation algorithms, with the stated mission to "create infinite productivity with AI and robots" and a vision to "become a global leader in intelligent robotics." A VLA model takes camera images of a robot''s surroundings and natural-language instructions as input and outputs low-level motor commands directly, collapsing the separate perception, planning, and control pipelines of traditional industrial automation and allowing a robot to generalize across novel objects and conditions without task-specific reprogramming.


    The commercial thesis is a platform play rather than a hardware race. Psibot licenses its Psi-series model — the intelligence "brain" — to third-party robot developers, sells a proprietary human-hand data-collection system (Psi-SynEngine exoskeleton gloves), and offers simulation and training-data services. Management calls this a "small full-stack": Psibot controls the high-value design elements (system architecture, degrees of freedom, motion range, and the model) while outsourcing component production and manufacturing to specialist suppliers. The bet is that the most defensible position in embodied AI is the software brain and the proprietary data flywheel behind it, not the robot body, so that whichever hardware form factor ultimately wins, Psibot''s intelligence layer and dexterous-manipulation dataset compound in value across the whole industry.'
