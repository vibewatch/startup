- id: cover-metrics-and-scale
  title: Cover Metrics, Scale, and Disclosure Profile
  body: 'The verifiable cover metrics for Psibot are almost entirely capital and team indicators; operating metrics are undisclosed. Confirmable as of the run date are the founding date (September 2024), the reported US$1.48 billion valuation, roughly US$300 million raised, the July 2026 round of nearly US$100 million led by Chery, and a product cadence running from Psi R0 (December 2024) to Psi R1 (May 2025) and Psi-R2 plus Psi-W0 (April 2026). By contrast, revenue, run-rate, gross margin, burn, headcount, and a hard customer count are not disclosed in any retained public source, and the company itself declined to attach a valuation to its earlier rounds.


    This makes Psibot a private-undisclosed company whose scale must currently be inferred from proxies rather than financials: the size and strategic quality of its investor base, a stated goal to collect one million hours of manipulation data in 2026 and build China''s largest dexterous-hand dataset, an open-sourced 1,000-hour tranche out of 100,000 hours of reserves, and named pilot engagements at a large logistics vendor and a major fibre-optic cable maker. Each unsupported cover metric is carried as an explicit evidence gap with a concrete diligence path (audited financials, an HR-certified headcount, a signed-customer list), because in a sector that produced more than twenty Chinese unicorns in 2026 alone, distinguishing genuine traction from capital-driven hype requires operating data the company has not yet released.'
