  evidenceGaps:
  - type: missing-source
    severity: material
    topic: revenue
    missingEvidence: Any disclosed revenue, run-rate, gross margin, or bookings figure for Psibot.
    whyItMatters: Without operating metrics, the reported unicorn valuation has no financial anchor and scale can only be inferred from capital and pilots.
    diligencePath: Request management or audited financials, a bookings/pipeline report, and licensing revenue by customer.
    relatedQuestionRefs:
    - QO017
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: A run-date-accurate employee count by function and location.
    whyItMatters: Headcount is a core proxy for burn and execution capacity, yet no retained source pins it.
    diligencePath: Request an HR-certified headcount as of 2026-06-30 or later, split by R&D vs commercial.
    relatedQuestionRefs:
    - QO018
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: customers
    missingEvidence: A named, counted list of paying or piloting customers and contract values.
    whyItMatters: The commercialization thesis depends on real deployments, but only two unnamed pilots (logistics, fibre-optic) are described.
    diligencePath: Request signed customer references, deployment counts, and licensing agreements.
    relatedQuestionRefs:
    - QO019
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: Leadership and founder table
    missingEvidence: Full board roster, equity split, and complete management bench for the Leadership and founder table.
    whyItMatters: Governance and control rights cannot be assessed without the board and cap-table detail.
    diligencePath: Obtain the incorporation records, board list, and shareholder register.
    relatedQuestionRefs:
    - QO007
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: Stakeholder or investor map
    missingEvidence: Full shareholder register with ownership percentages and round valuations for the Stakeholder or investor map.
    whyItMatters: Investor control rights and dilution history are central to a diligence judgment.
    diligencePath: Request the cap table, round term sheets, and any secondary transactions.
