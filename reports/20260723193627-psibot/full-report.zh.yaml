      - number: '4.2'
        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Psibot 的 GTM
              动作不是大规模销售漏斗，而是少数深度战略合作，这与早期平台授权商相符。公开部署证据很薄，但具体：在一家中国大型物流客户处做小规模仓库验证（报告分拣效率提升），并在全球最大光纤光缆制造商之一处测试。2026 年 7
              月轮次领投方本身就是渠道——Chery Automobile（Fortune Global 500 车企，拥有 AiMOGA 机器人子公司，并与 Nvidia 有战略合作）和 Lens
              Technology（Apple 与 Tesla 精密组件供应商，正在建设具身智能中心，目标年产 3,000 台人形机器人和 10,000 台机器狗）——因此，投资人牵引的需求和制造拉力构成 GTM 的核心部分。


              常规销售效率指标完全不可得。公开来源没有销售周期、获客成本、回本周期、管线覆盖或渠道经济性，也无法可靠代理，因为授权价格和单客户收入未知。战略投资人结构是双刃代理：它可能缩短销售周期、降低制造入口风险，但也意味着早期收入可能是关联方或试点阶段收入，而非公平交易的商业需求——这个区别会实质影响收入质量。诚实判断是，Psibot
              的 GTM 由资本和关系驱动；承销人想看的每个效率指标，目前都是尽调请求，不是数据点。
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI022
              - CI023
      - number: '4.3'
        title: 成本结构、毛利率与资本强度
        blocks:
          - type: paragraph
            body: >-
              理论上，大脑和数据授权商应当比机器人制造商拥有更接近软件的成本结构：VLA 模型训练完成后，增量授权毛利率较高，最重的成本是研发人才、算力和数据采集，而不是物料清单和装配。Psibot
              通过外包制造强化这个叙事，并声称外骨骼手套采集数据的成本约为传统遥操作的十分之一——这个说法未经验证，但结构上很关键，因为数据采集成本是数据飞轮模型里的主导可变成本。若属实，它会降低支撑整个投资逻辑所需数据集的资本强度。


              Psibot 没有披露这些数据，因此无法用公开数据建模利润率路径，只能拿最接近的公开可比公司做参照。Unitree 招股书显示，一家纵向一体化硬件厂商靠自制电机和执行器，在 2025 年 ¥1.708B
              收入上实现约 60% 毛利率（2022 年为
              44%）。这个数字给深度一体化硬件同业设了一个偏上限的参照；纯软件授权商原则上可以在增量单位上超过它，但必须先用尚未验证的收入基数，吸收沉重的固定研发、算力和数据采集成本。因此资本强度问题反转了通常的机器人担忧：Psibot
              的风险不在工厂资本开支，而在当前资本耗尽前，授权收入能否覆盖庞大且前置的模型与数据成本。Lens Technology 自身扩张（2025 年前九个月 R&D 投入 RMB 2.44B）说明周边具身 AI
              硬件生态建设有多昂贵。
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI024
