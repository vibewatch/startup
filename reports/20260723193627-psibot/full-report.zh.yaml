      - number: '6.2'
        title: 采用与部署轨迹
        blocks:
          - type: paragraph
            body: >-
              采用轨迹仍早，且以试点为主。最实在的数字是到 2026 年初，北京大约部署了 100 台数据采集/ 操作单元，在物流场景采集分布式真实操作数据。关键在于，这一足迹既是部署，也是数据集建设：
              仓库工人在真实作业中佩戴 Psi-SynEngine 数据手套，因此所谓「部署」既是一批付费企业账户， 也是一群操作员在拼 2026 年 100 万小时数据目标。这种边界模糊意味着，100 台设备本身不能
              证明收入。


              除数据采集足迹外，采用证据是某大型中国物流客户的小规模仓储分拣验证（报道有效率提升），以及 在一家主要光纤光缆制造商处测试——这是试点和测试，不是多站点生产账户。Psibot 没有披露活跃
              账户数、部署量、利用率或复购数据，因此任何采用主张背后的分母都缺失。行业背景有两面性： Morgan Stanley 把 2026 年中国人形机器人出货预测上调一倍至 50,000 台，说明从试点走向生产
              的动量真实存在，并利好 Psibot 的 OEM 被授权方；但市场本身仍早，Psibot 自己从试点转为稳定 生产账户的能力尚未证明。
