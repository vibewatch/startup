  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              Psibot 的风险可以排出清晰的严重程度。严重度最高、最难缓释的一组，是中国特有的监管和法律 暴露——《国家情报法》、修订后的《网络安全法》，以及《数据安全法》/PIPL 跨境制度——因为它 是结构性的（附着在
              Psibot 的国籍和数据中心模式上），直接限制可触达的国际客户和投资者基础， 且公司自身再怎么行动也无法完全中和。第二高的一组是商业证明和炒作风险：未经验证的基准测试、
              试点阶段可靠性、全行业过度承诺，以及没有收入锚的估值。依赖风险（Nvidia 算力、精密部件） 和人才/执行风险（关键人物集中、公司 2024 年才成立）处在重要但可部分缓释的层级。


              传导机制决定投资论点怎么受伤。监管风险会传导为国际需求和融资可选性受限；商业证明风险会 传导为试点转生产变慢，进而压到收入，最终压到估值；依赖风险会传导到成本、毛利率和供应连续性；
              人才风险会传导到执行和路线图交付。因为 Psibot 没有披露收入，每一项下游风险最终都最重地 砸在估值上；当前估值靠团队质量、数据飞轮和战略投资方支撑，而不是基本面。下文热力图和传导
              图会按可能性和残余严重度给这些暴露排序，并追踪它们如何流入财务模型。
            claimRefs:
              - CR040
              - CR031
              - CR037
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR040
              - CR001
              - CR031
          - type: figure
            figureRef: FR002
            claimRefs:
              - CR031
              - CR009
              - CR040
      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              监管和法律暴露是 Psibot 的定义性风险。作为一家中国公司，它受《国家情报法》（2017 年）约束； 该法第 7 条写明：「任何组织和公民都应当依法支持、协助和配合国家情报工作。」独立法律分析 （China
              Law Translate）给恐慌式解读降温：这项义务位于总则，类似其他中国法律中的配合义务， 也没有专门执行机制——但同一分析也认为，中国公民或公司无法有意义地抵抗直接的国家安全请求，
              也不能指望法院提供救济。对一家全部价值都在自有操作数据集上的公司来说，这种残余的强制访问 风险，对任何海外客户或投资者都很重要；美国国土安全部商业咨询通告也正式化了西方监管视角： 中国公司处理的数据带有这类暴露。


              2026 年活跃的监管议程进一步放大暴露。修订后的《网络安全法》于 2026 年 1 月 1 日生效，把 一般行政罚款上限从 RMB 1 million 提高 10 倍至 RMB 10 million，明确纳入
              AI 伦理、风险监测 和安全监管义务，并把域外适用扩大到任何「危害中国网络安全」的海外活动。其上还有《数据安全法》 和 PIPL，要求数据分类并设置跨境传输制度（CAC
              安全评估、标准合同条款或认证）——Psibot 的 模型依赖大量操作数据的积累和流动，因此直接相关。外部地缘政治暴露又叠在上面：美国出口管制 审查，以及海外上市/采购限制（困扰同行 Unitree
              的同类「间谍法」担忧）会约束 Psibot 出海销售 或海外融资。Psibot 没有披露诉讼、执法行动、IP 纠纷，或必须持有的具体牌照，留下了下方登记表 跟踪的尽调缺口。
