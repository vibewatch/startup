      - number: '2.5'
        title: 规模测算缺口与相互冲突的预测
        blocks:
          - type: paragraph
            body: >-
              规模测算留下了尽调必须补齐的重大缺口。第一，没有公开来源拆出 Psibot 专属的可服务可得市场（SAM）或可获得市场（SOM）；其服务市场只能被推断为人形机器人、仓储机器人和物流机器人 TAM
              中的一块授权与数据切片，而 Psibot 没有披露收入、抽成率或授权单位数来锚定这块切片。第二，头部 TAM
              不能相加：人形机器人、仓储机器人、物流机器人和“具身智能”在不同机构口径下定义不同且彼此重叠，相加会高估机会。


              第三，预测离散度极高。独立分析指出，2030 年人形机器人市场预测相差约四倍——从约 US$4B 到超过
              US$15B——并把这个差距解读为投机热度，而非稳定共识；同一批评也认为，行业里被报道的独角兽估值可能跑在真实部署和收入前面。第四，全球仓库自动化渗透率仍低，意味着巨大空间，也意味着短期转化尚未验证。这些矛盾被保留下来，而不是被调和：市场确实很大、增长很快，但真正能测算
              Psibot 钱包份额的数字——SAM、SOM、抽成率和已确认客户数——仍是后续估值最敏感的开放问题。
