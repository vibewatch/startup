          detail: 团队顶尖，也有数据集雄心，但尚未验证。
          tone: warning
          claimRefs:
            - CV003
        - label: 商业验证
          value: 3 / 10
          detail: 未披露收入；基准未验证。
          tone: negative
          claimRefs:
            - CV005
        - label: 单位经济 / 财务
          value: 2 / 10
          detail: 收入、利润率和现金消耗均未披露。
          tone: negative
          claimRefs:
            - CV005
        - label: 风险约束
          value: 3 / 10
          detail: 监管、数据访问和执行风险高。
          tone: negative
          claimRefs:
            - CV011
        - label: 估值吸引力
          value: 3 / 10
          detail: US$1.48B 相对基本面偏高。
          tone: negative
          claimRefs:
            - CV012
        - label: 证据质量
          value: 3 / 10
          detail: 公开证据薄；只有一次融资事件。
          tone: negative
          claimRefs:
            - CV010
