      - number: '7.3'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Psibot 的核心风险是灵巧操作尚未在生产级可靠性上得到证明。IDC 报告称，2025 年超过 85% 的人形机器人部署属于非生产性；MERICS 判断中国具身 AI 部署依赖特定场地、需要手工调校、
              成本过高，广泛采用前成本至少要下降一半。Psibot 授权的是智能层而非自造机器人，因此真实世界 质量还取决于 OEM 合作方把 Psi 模型接入其硬件的效果——这是一片协同界面，Psibot 只部分控制，
              因为它设计结构和运动范围，但外包零部件生产和制造。


              叠加其上的是验证缺口：Psibot 的招牌能力主张——30 多分钟自主打麻将，以及低至同行十分之一的 训练数据成本——均由公司披露，没有独立基准测试；更广泛的行业还被批评为编排式演示，无法转化
              为可靠、长时间、广变化的部署。模型依赖大规模人类手套数据采集，数据质量和数据集完整性风险 真实存在；Psibot 也没有披露产品安全记录、事故历史或责任保险覆盖。下方运营登记表按严重度
              排列这些失效模式，并标出尚未解决的安全与可靠性披露。
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
              - CR017
              - CR018
