      - number: '6.3'
        title: 具名客户证据与参考质量
        blocks:
          - type: paragraph
            body: >-
              在尽调尺度上，这里的证据最弱。Psibot 没有公开披露任何具名生产客户；客户要么被泛称为「一家 大型物流客户」「全球最大光纤光缆制造商之一」，要么是战略投资方，而非独立第三方买家。光纤
              测试和物流分拣试点是两个最具体的合作，但二者都停留在试点/测试阶段，结果未量化，也没有参考 客户背书。若按重视具名、生产级、结果可衡量参考客户的尽调标尺，尽管投资人验证很强，Psibot 的客户证据质量仍低。


              生态背景必须谨慎解读，避免给过高信用。Chery Automobile 旗下 AiMOGA Robotics 发布了自己的 人形机器人（Mornine），并在 2026 年 4 月签下 1,000
              台智能警用机器人订单；Chery/AiMOGA 生态覆盖 30 多个国家——但没有确认 AiMOGA 的机器人运行 Psibot 的 Psi 模型，因此这笔订单是 生态背景，不是 Psibot
              的直接客户证据。诚实的说法是，Psibot 的具名证据表主要列出匿名试点 和战略投资方关系；短期最有价值的尽调动作，是拿到具名、生产级、结果披露的参考客户。
