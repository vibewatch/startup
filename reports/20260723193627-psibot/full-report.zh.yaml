  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用客户工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              Psibot 卖的是智能，不是铁。核心产品是 Psi 系列视觉-语言-动作（VLA）模型——一个能感知场景、 理解自然语言指令并生成灵巧机器人动作的「大脑」——交付方式不是 Psibot 品牌整机，而是授权给
              第三方机器人厂商的智能层。放到客户工作流里，软件接收一个任务（「分拣这些包裹」「给这排货架 补货」）以及摄像头和传感器输入，输出一串抓取、放置和修正动作，由机械臂或人形机器人执行，
              面向仓储分拣、包装、补货和制造搬运。


              Psibot 采用「小全栈」模式：公司定义机器人设计参数——结构、运动范围、自由度——但把零部件 生产和制造外包，自己保持轻资产并聚焦模型。产品能力最常被引用的证据点是 Psi R1 麻将演示：
              机器人在开放环境中与人类自主打麻将超过 30 分钟，长时序任务把灵巧摸牌操作和策略推理揉在 一起，Psibot 用它定义 L3 级自主。由此看，产品定位是物流和制造现场的「操作系统」。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
