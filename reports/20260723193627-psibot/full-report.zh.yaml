      - number: '4.4'
        title: 公开牵引力与私有指标缺口
        blocks:
          - type: paragraph
            body: >-
              Psibot 展示出来的东西与披露出来的东西之间存在落差，这是其财务画像的核心特征。公开侧有具体但非财务的信号：新近约 US$100M 轮次，估值 US$1.48B；不到两年累计融资约
              US$300M；一线战略投资人；物流和光纤制造的具名商业试点；快速扩大的技术足迹（约十八个月内从 Psi R0 推进到 Psi-R2/W0，并从所称 100,000 小时数据储备中开源首批 1,000
              小时）；以及 PKU-PsiBot 联合实验室。私有侧，几乎所有硬财务指标都缺失：无收入、无 ARR、无毛利率、无月度烧钱速度、无现金跑道、无员工数、无授权单位数、无客户集中度披露。


              这很重要，因为行业公开数据提醒投资人：不能把演示当需求。Unitree 招股书——目前最清晰的具身 AI 经济性窗口——显示，即使是销量领导者，也只有约 9% 的人形机器人收入来自真正的工业部署，74%
              来自研究和教育，17% 来自商业“展示”用途；2025 年前九个月，真实产线收入仅约 ¥15.7M（US$2.2M）。Morgan Stanley 买方调查发现，只有 23%
              的潜在工业买方对现有产品满意。在这种背景下，Psibot 的具名试点值得鼓励，但没有量化；投资人需要更高强度证据，证明它已经拿到真实、公平交易、经常性的收入。本节每个私有缺口都在缺口表中配有具体尽调路径。
