      - number: '7.7'
        title: 图表
        blocks:
          - type: callout
            title: 《国家情报法》风险真实但有细节
            body: 第 7 条要求配合国家情报工作，但独立法律分析认为，其范围比常见说法更窄，且缺少直接执行机制 ——同时仍承认中国公司无法有意义地抵抗合法国家安全请求。对海外客户真正重要的，是残余强制 访问风险。
            calloutType: insight
