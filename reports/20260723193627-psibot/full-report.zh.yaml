      - - 员工数和 R&D 能力
        - 成本基数和扩张能力不清
        - 按职能划分员工数和薪酬年化支出
    notes: 每个缺口都配有可消除疑点的精确证据；合在一起，就是财务尽调方按基本面给 Psibot 估值前必须完成的清单。
