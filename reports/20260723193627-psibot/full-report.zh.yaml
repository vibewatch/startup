      - number: '3.3'
        title: 能力、定价与 GTM 对比
        blocks:
          - type: paragraph
            body: >-
              能力上，Psibot 拼的是模型质量和灵巧度，而不是单机产量。分层快 / 慢 VLA 加强化学习架构，以及灵巧操作基准（连续 30 多分钟自主麻将演示），是公司的招牌；但同样的快 / 慢、VLA 优先路径也出现在
              Physical Intelligence（π0 到 Hi Robot）、Figure（Helix）、Google Gemini Robotics 和 Nvidia GR00T
              身上，核心技术路线并不独特。原始规模上，Psibot 落后 AgiBot、Unitree 和 UBTech 数个数量级——对手是数千到一万多台，Psibot 仍是未披露试点量。


              定价和 GTM 上，对比很尖锐。硬件同业公开单机价格和租赁条款——UBTech U1 起价 ¥119,800，Unitree G1 约 US$16,000，AgiBot 机型约 US$5,000 起，还提供
              robot-as-a-service 租赁——并借助 BMW、BYD、NIO 的工厂试点、零售体验店和公开上市触达买方，拿到分销和资本。Psibot
              的模型授权和数据平台定价没有披露；作为私有大脑授权商，公司缺少上市或捆绑式竞争对手的分销和资产负债表半径。抵消项是 Chery 和 Lens Technology
              带来的战略投资人供应链及传感器入口，以及私有人手操作数据集。信任和监管姿态上，分析师提示中国人形机器人厂商有结构性法律风险，而文件并未披露；Morgan Stanley 买方调查显示，仅 23%
              的潜在工业买方对现有产品满意——这是适用于整个赛道的需求侧警告。
