      - number: '2.2'
        title: 多视角市场测算
        blocks:
          - type: paragraph
            body: >-
              没有单一数字能概括 Psibot 的市场，因此用五个独立视角框定。第一，人形机器人：Global Market Insights 估算 2025 年全球市场约 US$7.9B，并预测从 2026 年
              US$10.9B 增至 2031 年 US$54.2B、2035 年 US$192.7B，CAGR 37.6%；Research and Markets
              同样将其定义为早期、指数级增长市场。第二，仓储机器人：Fortune Business Insights 估算 2025 年为 US$6.51B，并从 2026 年 US$7.35B 增至 2034 年
              US$25.41B（CAGR 16.8%），Asia-Pacific 占 51.7%。第三，物流机器人：Global Market Insights 给出 2025 年 US$17.8B，并从 2026 年
              US$20.7B 增至 2035 年 US$91.4B。第四，广义仓库自动化：Grand View Research 估算 2023 年 US$19.23B，2030 年达到 US$59.52B。


              第五，也是地理上最贴近 Psibot 的视角，是中国：36Kr Research Institute 估算中国具身智能产业从 2018 年 ¥213.3B 增至 2025 年 ¥915B，并在 2026 年超过
              ¥1T；Morgan Stanley 预测 2026 年中国人形机器人出货约 50,000 台（较 28,000 台增长约 79%），2030 年达 446,000 台，中国市场从 2026 年约 US$2B
              增至 2030 年约 US$15B。销量印证很强：IDC 报告称 2025 年全球人形机器人出货超过 18,000 台，中国厂商贡献约 90% 单位量，并预计 2030 年出货超过 510,000 台，CAGR
              约 95%。TrendForce 还预计中国人形机器人产量在 2026 年增长约 94%。这些视角方向一致、量级分歧明显，因此 2026 年人形机器人 TAM 在全球范围内更现实地落在 US$6B–11B
              区间，长期数字仍偏投机。
