      - number: '8.5'
        title: 可比估值
        blocks:
          - type: paragraph
            body: >-
              公开可比公司能框定争论，但不能终结争论。中国侧，Unitree 获批科创板上市意味着市值接近 RMB 42 billion（约 US$5.83 billion）；CCB International
              预计若计入品牌溢价，最高可达 RMB 109 billion（约 US$15.1 billion），相当于一家 2025 年出货超过 5,500 台机器人且已经盈利 的公司，对应 32x 市销率。DEEP
              Robotics 的收入约为 Unitree 的五分之一，但按约 RMB 13.9 billion （约 US$1.93 billion）发行估值计算，隐含市销率更高，达 41x。更广泛的群体中，至少 25
              家国内 具身智能公司估值已经超过 RMB 10 billion（约 US$1.39 billion），其中 15 家在 2026 年上半年 成为独角兽。


              全球侧，Figure AI 在 2025 年达到约 US$39 billion，Physical Intelligence 据报洽谈估值超过 US$11 billion，Skild AI 讨论过约 US$8-12
              billion 区间，Apptronik 接近 US$5.5 billion 完成 融资。关键限制是可比性：这些同行大多处于收入前或按远期倍数定价，公开市场公司则是全栈硬件 集成商，而 Psibot 是软件 /
              智能层授权方。这种错配意味着，可比公司能支撑巨大可寻址可选性， 但不能给 Psibot 具体商业模式一个精确公允价值；IPO 群体带来的估值方法重置转向可审计指标， 也可能压缩这一群体当前享有的账面溢价。
