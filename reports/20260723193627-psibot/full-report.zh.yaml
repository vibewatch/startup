            claimRefs:
              - CV029
              - CV030
              - CV031
              - CV033
              - CV034
      - number: '8.6'
        title: 退出路径、论点失效触发因素与尽调事项
        blocks:
          - type: paragraph
            body: >-
              Psibot 可能的退出路径有两条：沿着 Unitree 和 GigaAI 正在打出的路线，走境内科创板或香港上市；或被 Chery
              这类已经依赖其技术的产业支持方战略收购。短期退出准备度很低：公司尚未产生收入，仍是私营状态；任何公开市场窗口打开前，都需要拿出可验证、可审计的商业牵引力，尤其投资人很快会有三个更细颗粒度的上市参照，市场会奖励交付和盈利能力。


              投资论点会在几种情况下失效：核心基准被独立证伪；授权业务无法越过绑定战略伙伴放大；监管或出口管制事件切断算力或数据访问；或公司在现金跑道耗尽前融不到钱。任何资本承诺前，最终尽调清单包括：经审计财务报表和收入确认政策；可联系的具名客户推荐名单，并区分独立交易收入与关联方收入；覆盖
              Chery 和 Lens 的关联方交易表；考虑出口管制敞口后的组件 BOM 和算力供应计划；完整股权结构表及清算优先权层级；以及对 L3
              操作和麻将自主性主张的独立第三方验证。总体看，机会高风险、高期权性；我们建议有条件通过，只有在上述证据交付、且价格按明确的下轮估值下调安全边际谈妥后，才具备可投性。
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
          - type: table
            tableRef: TV005
            claimRefs:
              - CV025
              - CV039
              - CV027
          - type: table
            tableRef: TV006
            claimRefs:
              - CV038
              - CV013
              - CV019
      - number: '8.7'
        title: 展示材料
        blocks:
          - type: callout
            title: 有条件观察，严守价格纪律
            body: 在没有具名生产参考客户、经审计财务和关联方收入表之前，不应按 US$1.48B 投后估值领投。期权性真实存在；但按入场价计算，下行不对称。
            calloutType: insight
            claimRefs:
              - CV009
              - CV013
          - type: callout
            title: 估值押的是执行期权，不是结果倍数
            body: 未披露收入、ARR、利润率或员工数。价格建立在团队、数据飞轮和战略支持方信号上；即将到来的 Unitree / DEEP / Leju 上市，会把行业重新拉回可审计指标。
            calloutType: insight
            claimRefs:
              - CV005
              - CV021
          - type: callout
            title: 可比公司支撑期权性，不支撑单点估值
            body: >-
              全球可比（Figure US$39B、Physical Intelligence 超过 US$11B）和中国可比（Unitree 32x、DEEP 41x
              市销率）大多是全栈公司或尚未产生收入；平台授权模式没有干净的公开市场参照。
            calloutType: insight
            claimRefs:
              - CV031
              - CV035
