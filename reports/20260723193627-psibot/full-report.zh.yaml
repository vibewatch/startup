  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与替代选择
        blocks:
          - type: paragraph
            body: >-
              Psibot 位于具身 AI 智能层，所以竞争集合比“其他机器人制造商”更宽。五类玩家值得关注。直接同业是销售或开源通用“大脑”的机器人基础模型提供商：Physical Intelligence（π0/π0.7
              模型族）和 Nvidia 的 GR00T 参考栈。既有玩家和硬件规模玩家是中国“三巨头”——AgiBot（Zhiyuan）、Unitree 和 UBTech——再加上纵向一体化的西方公司 Figure AI 和
              Tesla，它们都自研大脑并规模出货。相邻玩家包括 Galaxy General 的 Galbot、Apptronik、Boston Dynamics、1X 和
              Agility。替代方案和现状方案是固定工业自动化、AGV/AMR 和人力；从成本和可靠性看，它们仍是多数仓库默认选择。最后，自研也是现实选项：OEM 可以开发自己的控制模型，也可以采用 Nvidia 开放的
              GR00T，而不是授权 Psibot。


              竞争范围过宽，正是 Psibot 的核心问题。公司不卖本体，因此既要对抗免费 / 开放选项（Nvidia GR00T），也要对抗内部自研选项（Tesla、Figure、Unitree 和 AgiBot
              都训练自有大脑）；而纯大脑类别里已公开的对手 Physical Intelligence 和 Nvidia 资本实力远强于 Psibot。潜在进入者进一步抬高强度：OpenAI 牵头对 Figure 投资
              US$6.7B，并运营一支 200 多名研究员的内部机器人基础模型团队（Project Atlas）；Google 也推出 Gemini Robotics。因此版图更有利于规模和资本，Psibot
              必须靠模型能力、灵巧度和私有数据打出差异，而不是靠分销取胜。
