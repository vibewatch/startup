      - number: '5.6'
        title: 信任、安全、合规与质量控制
        blocks:
          - type: paragraph
            body: >-
              信任图景被一条清晰分界线切开：研究经过验证，产品化尚未验证。能力层面，Psibot 的头部指标 ——30 分钟以上自主麻将、100% 翻牌准确率，以及 95%/99.9%「不可能三角」成功率——均由公司披露，
              没有独立基准测试；唯一可被外部核验的能力证据，是同行评议的 DexGraspVLA 结果（AAAI 2026 Oral，90%+ 零样本抓取）。独立分析师给叙事降温：MERICS 认为中国人形机器人整体缺乏精度和
              灵巧度，依赖特定场地试验，成本仍然太高，并且 VLA 突破仍看向美国研究——这直接检验了成熟度 主张。


              安全、安保和质量控制层面存在有记录的缺口：没有公开证据显示 Psibot 拥有安全认证、功能安全 标准，或管控其数据采集和模型授权业务的数据隐私与安全控制。这个问题尤其尖锐，因为 Psibot
              正在中国趋严制度下积累 100,000 小时以上人类操作数据储备——2026 年 1 月 1 日生效的《网络 安全法》修正案，罚款最高可达 RMB 10 million，且具备域外适用；数据安全框架也正好覆盖大型
              行为数据集。因此，质量结论并不均衡：研究成熟度高（同行评议工作、快速迭代、延迟阶跃变化）， 但产品化成熟度——现场可靠性、认证、披露的基准测试和算力供应韧性——薄弱、未验证，或被依赖
              关系约束。每一处弱点都对应一项具体尽调请求，而不是一个公司声称的数字。
            claimRefs:
              - CE032
              - CE033
              - CE034
