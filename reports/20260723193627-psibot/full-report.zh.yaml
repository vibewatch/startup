      - number: '8.3'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Psibot 累计融资超过 US$300 million；2026 年 7 月由 Chery Automobile 和 Lens Technology 领投 的一轮约 US$100 million
              融资，将投后估值定在 US$1.48 billion；此前还有一轮约 RMB 2 billion（约 US$280 million）的融资。由于公司处在收入前阶段，这一估值来自投资人信号、 顶尖具身 AI
              团队稀缺性，以及产业投资方的战略牵引，而不是单位经济模型——公开证据可以证实这轮 融资事实，却无法独立验证其公允价值。


              因此，入场纪律压倒一切。既是投资方、也可能消费 Psibot 技术的战略投资方设定了出清价格，所以 独立第三方财务投资人应预期支付溢价，并应按一次或多次未来稀释性融资的真实概率控制仓位：行业 18-24
              个月现金续航意味着流动性事件前会反复要钱，形成优先权堆栈压力。降价融资风险已经 偏高且还在上升，因为 Unitree、DEEP Robotics 和 Leju 即将公开上市，正在把中国机器人估值方法 从自上而下
              TAM 外推，重置为可审计交付、收入和盈利能力——这种重置对一家靠叙事定价的收入前平台 结构性不利。在接近当前估值投入资本之前，我们会要求审计财务、具名客户参考清单、关联方收入清单 和优先权堆栈披露。
            claimRefs:
              - CV002
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
      - number: '8.4'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              牛市情景假设 Psibot 的能力主张得到独立验证，OEM 授权在多个硬件合作方之间放大，灵巧手数据飞轮 复利成耐久护城河；在这些条件下，平台可重估至 US$4-6 billion 或更高，与软件中心型全球同行的
              溢价一致。基准情景假设试点转化缓慢，能力在规模化上仍可信但未证明，Psibot 继续作为一家私有 独角兽，估值落在约 US$1.5-2.5 billion 区间，同时继续消耗资本来延长现金续航。熊市情景假设
              基准测试不及预期、监管或算力获取冲击，或在市场收紧时融资失败，迫使降价融资或出现困境结果， 估值落在 US$0.3-0.7 billion 区间甚至更低。


              主导下行触发因素包括头部基准测试被证伪、失去 Nvidia 级算力访问、数据安全或《国家情报法》执法 事件封死国际需求，以及现金续航到期前无法完成下一轮融资。基于今天可获得的公开证据，基准情景
              是最可辩护的中枢估计；牛市情景需要尚不存在的独立证明，行业预期中的 2027-2028 年整合也提高了 熊市尾部权重。隐含价值对两个假设高度敏感：商业里程碑达成概率，以及一旦出现可审计指标，市场
              愿意套用的收入倍数。
