      - number: '7.4'
        title: 合作方与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Psibot 的依赖图谱有三个关键节点。第一是算力：中国具身 AI 开发者普遍依赖 Nvidia Jetson 边缘模块和 Isaac 仿真/训练工具，二者暴露于美国出口管制政策——一旦获取收紧，可能抬高成本或
              削弱训练能力，是供应和能力尾部风险。第二是精密机械部件：行业供应链分析显示，海外供应商 （德国 Schaeffler、日本 THK 和 NSK）主导灵巧系统所需的特种滚珠丝杠和高端谐波减速器，这是
              中国正在缩小但尚未消除的瓶颈。第三是资本和渠道对手方：Psibot 早期需求和融资集中在战略投资方 （Chery、Lens Technology）和国资相关基金，收入路径则经过 OEM
              被授权方，而不是多元化的独立 第三方客户。


              这些依赖会彼此部分抵消。中国控制着估计 63–70% 的人形机器人供应链，并在电机、执行器、电池 以及越来越多的减速器上快速国产化，这缓冲了机械部件风险，也给 Psibot 的被授权方带来成本和
              物流优势。但前沿算力依赖更难本地化，早期需求集中在关联方也提出一个问题：Psibot 的进展 是商业性的还是战略性的。中国单一国家集中度把 Psibot 绑定到国内政策周期和国企采用，同时限制
              国际多元化。下方依赖登记表和地图按集中度与残余暴露给每个对手方排序。
