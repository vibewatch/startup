  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Psibot 的投资故事建立在定位、团队和数据上，而不是任何已披露财务表现。牛市论点是，把一个 视觉-语言-动作（VLA）「大脑」授权给机器人 OEM，切中了具身 AI 技术栈里最可防守、最可扩张 的层：如果
              Psi R1 平台成为中国灵巧操作的事实智能标准，Psibot 就能在许多硬件厂商之上获取 软件式经济性，而不背负它们的资本密集度。这个论点由一个履历异常强的创始团队强化 （Peking University 的
              Yaodong Yang、经由 Yuanpei Chen 连接的 Stanford / Fei-Fei Li 传承，以及 Alibaba / Tencent 机器人老兵 Xiaojie
              Chai），也由建设中国最大灵巧手数据集作为 复利数据飞轮的目标、以及提供资本和产业牵引的战略投资方（Chery Automobile 和 Lens Technology） 强化。市场背景很大：WAIC 2026
              参展公司合计估值超过 US$14.7 billion，仅 2026 年上半年就有 15 家中国具身 AI 初创公司跨入独角兽行列。


              反论点同样具体。Psibot 没有披露收入、ARR、毛利率或员工人数；头部能力主张（L3、30 分钟自主 麻将演示）由公司自报，没有独立基准测试；行业分析师估计，超过 85% 的具身 AI 部署仍是非生产性
              试点；《国家情报法》和数据安全制度限制了全球可比本应暗示的国际需求。早期进展也可能 来自关联投资方的战略牵引，而不是独立第三方商业需求，从而削弱价格背后的收入质量信号。简言之， US$1.48 billion
              估值是对执行的期权，不是结果的倍数；举证责任完全在公司一边。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
      - number: '8.2'
        title: 建议、信心、风险评级与估值立场
        blocks:
          - type: paragraph
            body: >-
              我们的建议是有条件观望：在拿到具名生产参考客户、审计财务报表和关联方收入清单之前，不要按当前 US$1.48 billion 投后估值领投或跟价。可选性真实存在，但按入场价看下行不对称，因此条款纪律
              比对故事的信念更重要。我们对这一判断的信心为低到中：公开证据基础单薄，主要来自公司表述和一次 融资事件的媒体报道，几乎没有独立、可审计的运营数据。整体风险评级为高，驱动因素包括商业证明缺席、
              能力基准未经验证、监管和数据访问暴露，以及分析师预计 2027-2028 年 18-24 个月现金续航 到期后，行业会进入全面「淘汰年」。


              我们的估值立场是，US$1.48 billion 相对已披露基本面偏高——只有拿团队、数据飞轮、战略投资方信号， 以及中国和全球具身 AI 可比公司的高估值集合来解释才站得住；但这些都不能替代收入。建议逻辑经过
              四道门：平台经济性是否可扩张？能力和商业牵引是否有独立证明？监管和执行风险是否受控？ 入场价格是否有支撑？Psibot 通过了第一道门，今天没有通过第二道门，第三道门也只部分通过，第四
              道门则是有条件通过——所以结论是守价格纪律的观望，而不是直接放弃或买入。下方尽调计分卡显示， 机会在市场和护城河上得分高，但在商业证明、单位经济模型、风险控制和证据质量上得分低。
