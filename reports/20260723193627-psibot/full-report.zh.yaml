      - number: '5.2'
        title: 产品线与模块图谱
        blocks:
          - type: paragraph
            body: >-
              Psibot 的产品组合是一叠模型加一个数据采集工具，迭代速度很快。模型线包括 Psi R0（2024 年 12 月 30 日，被描述为行业首个端到端强化学习具身模型）、Psi R0.5（2025 年 3
              月）、Psibot V1 和 H1 硬件参考平台（2025 年 4 月）、旗舰 Psi R1（2025 年 5 月），以及 Psi-R2 世界-动作模型与 Psi-W0 动作条件世界模型（2026 年 4 月
              10 日）。头部模型之下还有两个功能 子模型——负责规划的 Psi-P0，以及负责控制的 Psi-C0；后者由联合创始人、RL 负责人 Yuanpei Chen 开发。


              数据层是 Psi-SynEngine：一套自有采集系统，基于 16 自由度外骨骼手套，具备亚毫米级 3D 轨迹精度，以及 3D 指尖触觉和力反馈感知，用来规模化捕捉人手操作。报道称 Psibot 的灵巧机器
              人手有 21 个自由度。Psi-R2 训练使用了 95,472 小时人类数据，覆盖 294 个场景和 4,821 个 任务；Psibot 已开源其所称 100,000 小时多模态数据储备中的前 1,000
              小时。因此，产品线图谱 是一代代模型叠在一台定制数据采集引擎之上——整个投资论点靠这项资产复利。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE001
            claimRefs: []
      - number: '5.3'
        title: 技术架构与运行模式
        blocks:
          - type: paragraph
            body: >-
              Psi R1 的架构是分层、端到端设计，把视觉-语言-动作模型与强化学习融合，在一个训练好的系统里 连接高层规划和低层灵巧控制。Psibot 称为「Chain of Action
              Thought」（CoAT）的推理机制， 让系统在开放、动态环境中拆解并执行长时序任务——公司把这种能力定义为 L3（自主推理和操作）， 高于 L1（基础抓放）和
              L2（没有认知链的人类式抓握）。为了打通思考和运动，设计使用了一个 连接规划与控制的「Action Tokenizer」，以及一个快/慢「S1 fast / S2 slow」双系统大脑，把
              反应式控制和审慎规划分开。


              2026 年的演进是 Psi-R2 / Psi-W0 双模型架构。Psi-R2 是世界-动作模型；Psi-W0 是动作条件 世界模型，用来做反事实推理并带动强化学习「飞轮」。关于这一双模型设计的报道称，它把推理
              延迟从 2.2 秒降到 100 毫秒以内——这对实时操作是一个阶跃变化。学术实现 DexGraspVLA 采用 预训练视觉语言模型做高层规划器，用扩散式低层控制器，反复把多样输入映射为跨域不变表征，
              让模仿学习能够泛化。公开设计目标是同时拿到高泛化、高灵巧、高成功率的「不可能三角」 （95% 验证、99.9% 规模化部署目标），路径是先用大量人类数据预训练，再用少量真实机器人 数据微调——这正面回应了具身
              AI 的数据稀缺问题。
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
              - CE017
              - CE018
