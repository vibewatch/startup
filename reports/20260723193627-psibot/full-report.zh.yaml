      - number: '4.5'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              前瞻资本充足性是 Psibot 最强的财务维度。历史融资时间线已在公司概览覆盖；简言之，Psibot 先后叠加了天使轮（2024 年 11 月，由 GL Ventures 和 Lanchi Ventures
              领投，国资背景共同投资人参与）、2026 年 3 月 10 日公告的天使轮加 Pre-A 合计约 ¥2B（约 US$280M），以及 2026 年 7 月由 Chery Automobile 领投、Lens
              Technology 参与、接近完成的约 US$100M 轮次，估值 US$1.48B——不到两年总资本约
              US$300M。若九位数新轮次刚刚落袋，且没有制造资本开支负担，一家年轻的软件和数据公司理论上可以在下一次融资前支撑两到三年的研发、算力和数据采集扩张；但具体现金余额、烧钱速度和现金跑道仍未披露，必须确认。


              融资依赖仍然真实存在。Psibot
              没有披露收入基数来支撑自我造血，因此仍依赖资本市场持续开放，以及战略投资人的善意；这些投资人的利益部分来自产业而非纯财务。公开来源没有债务或项目融资义务，这符合轻资产授权商定位；但下一轮融资触发点实际上是能力与商业化里程碑：Psibot
              必须在当前热度驱动的估值环境降温前（2026 年诞生 22 家以上具身 AI 独角兽；2026 年上半年中国具身 AI 融资
              US$13.8B），把数据领先和试点转化为可展示的授权收入。战略投资人影响力集中，以及后续资本可能以技术里程碑为条件，是需要测试的关键融资风险。
