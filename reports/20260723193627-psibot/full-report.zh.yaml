      - number: '6.5'
        title: 扩张、集中度与渠道依赖
        blocks:
          - type: paragraph
            body: >-
              Psibot 设想的扩张动作，是通过 OEM 授权先落地后扩张，再由数据飞轮放大——每一次部署丰富 数据集，数据集改进模型，模型再赢下下一个 OEM。但公司尚未披露账户扩张、追加销售或多站点
              铺开证据，采购动态（销售周期、合同期限、定价）也未披露，因此无法评估买方摩擦。扩张 逻辑在结构上说得通，在经验证据上尚未证明。


              集中度和渠道依赖是最尖锐的风险。早期需求与战略投资方相关——Chery、Lens Technology，以及 国资相关基金（GL Ventures、Lanchi Ventures、SDIC Advanced
              Manufacturing Fund、Jingxi Ruiling）——而不是与可证明的独立第三方商业买家相关。这类背书确实有价值：它缩短销售周期、
              降低制造进入风险，即便没有具名生产客户，也构成高质量验证。但它是一把双刃剑，会把需求集中 到少数关联方，并提出一个问题：早期收入到底是商业性的，还是战略性的。中国地理集中度构成
              第二条集中度轴线，把采用绑定到国内国企采用要求，同时限制国际扩张。尽调优先事项是关联方 交易清单和前几大客户集中度披露。
