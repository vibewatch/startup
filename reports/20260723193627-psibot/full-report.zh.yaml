      - number: '1.3'
        title: 融资历史、投资人与估值
        blocks:
          - type: paragraph
            body: >-
              Psibot 在不到两年里走完了一整段早期融资曲线。公司在 2024 年 11 月完成天使轮，由 GL Ventures（Hillhouse）和 Lanchi Ventures 领投，China
              Development Bank Capital、Guozhong Capital、CCTV Media Convergence Industrial Investment Fund 等国家队资本参与。约
              2026 年 3 月 10 日，公司在一份联合公告中披露，天使轮和 Pre-A 轮合计达到 ¥2B（约 US$280M）；公告刻意卡在中国“两会”政治窗口期。Pre-A 由上海国资 Xuhui Capital
              领投，Liangxi Sci-Tech Innovation Phase II Mother Fund（Bohua Capital 管理）、Xi Venture Capital、Pufeng Capital 和
              Timing Capital 参与，多家老股东追加投资。


              2026 年 7 月 23 日，Bloomberg 报道称 Psibot 接近完成新一轮近 US$100M 融资，投后估值约 US$1.48B，由车企 Chery Automobile 领投，Apple 和
              Tesla 供应商、精密玻璃及传感器厂商 Lens Technology 参与。消息人士称该轮尚未交割；若完成，公司自成立以来累计融资约 US$300M，并跻身中国最新一批具身 AI
              独角兽。投资人组合战略浓度很高：早期是国资产业基金，随后引入汽车和制造供应链资本，呼应中国把 AI 推向“实体经济”的大方向。2024 年至 2026 年初的轮次没有披露定价估值，US$1.48B 数字来自
              Bloomberg 报道而非公司确认；因此轮次状态和估值都应按“已报道、未交割”事实处理。
