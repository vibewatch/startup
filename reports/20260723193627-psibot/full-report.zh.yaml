      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动来自中国产业政策。第十五个五年规划（2026–2030）把具身智能提升为与量子、生物制造并列的国家战略支柱，配套国家投资、采购要求和 MIIT/SASAC 部署目标；国家标准自 2026
              年初开始发布，MIIT 也把 2025 年定义为中国“人形机器人量产元年”。人口老龄化和结构性劳动力短缺带来持久替代需求，供应链本土化则让中国整机成本接近可比海外产品的
              50%，改善采用经济性。资本本身也是驱动：2025 年前十一个月，中国具身智能融资达到 ¥33.5B（约为上一年同期四倍），全年超过 ¥38B、305 笔交易；这股动能延续到 2026 年上半年的密集融资潮。


              约束同样具体。MERICS 认为中国人形机器人仍缺精度和灵巧度，现场专用试验成本高，成本至少还要砍半，并且 VLA
              突破仍依赖美国研究。精密部件——高精度滚珠丝杠、齿轮和先进传感器——仍有部分进口依赖，这是供应和成本风险，也正是政策明确要攻克的方向。高单机成本、可靠性上限，以及灵巧操作周围的安全和保险壁垒，使大多数部署仍停在受控试点。独立分析更直白：真正用于生产的工业收入只占人形机器人销售约
              3–5%，其余来自研究、展厅和尝鲜买家——这是收入质量警告，直接给行业头部增长打了折扣。
