      - number: '6.4'
        title: 留存、复购与耐久性
        blocks:
          - type: paragraph
            body: >-
              留存没有可衡量数据，这种缺席本身就是结论。Psibot 没有披露净收入留存、毛留存、流失率、续约 率或合同期限，也没有任何队列或复用数据。两个结构性事实进一步放大缺口：公司成立于 2024
              年，还太年轻，尚未跑完有意义的续约周期；采用仍在试点阶段，几乎没有可评估耐久性的 合同。客户满意度分数、NPS 或参考质量指标也没有披露。


              关于耐久性，只能做定性且前瞻的判断。若 OEM 被授权方基于 Psi 模型构建产品并积累部署历史， 切换成本会上升，Psibot 的自有数据集和 OEM 关系会变成锁住客户的耐久资产。但这是一条论点，
              不是已经展示出来的留存曲线。行业背景也提示谨慎：IDC 报告称，2025 年超过 85% 的人形机器人 部署属于非生产性，因此即便机器人已经部署，持续生产性使用——续约的前提——也远未得到保证。
              本章每一个留存字段因此都是空值，并附带具体尽调请求。
            claimRefs:
              - CU014
              - CU015
              - CU019
              - CU032
              - CU033
