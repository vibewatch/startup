      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Psibot 服务两条买方渠道，付费方不同。授权渠道里，买方是嵌入 Psi 大脑的机器人 OEM 或开发商，“用户”是机器人自己的控制栈，付费方是 OEM
              的研发预算。直连企业渠道里，买方是物流运营商或制造商，用户是仓库和产线操作员，付费方是企业资本开支；在中国，越来越多还来自国企和政府采购。物流和电商是领先买方垂直——Fortune Business
              Insights 预计电商在 2026 年约占仓储机器人市场 47%——这与 Psibot 披露的分拣试点吻合。在中国，指令性产业政策把预算权推向承担政策试点的国企和政府实体。


              采用路径从实验室演示走向小规模试点，再到场景验证，最后才是多站点规模化部署。到 2026 年，行业仍集中在试点和验证阶段：IDC 报告称，2025 年超过 85%
              的人形机器人部署用于表演、教育、数据采集和导览，而非生产工作，制造和物流只有早期试点。Psibot
              自身商业化信号——一家中国大型物流客户的仓库分拣项目，以及一家领先光纤光缆制造商的测试——也处在试点阶段，且二者都不是已确认的大规模付费客户；因此买方地图更多描述意图和结构，而不是已验证收入。
