      - number: '7.5'
        title: 财务、模型与人才/执行风险
        blocks:
          - type: paragraph
            body: >-
              财务上，主导风险是不透明：Psibot 没有披露收入、ARR、毛利率、现金消耗率或现金续航，因此约 $1.48B 估值靠团队质量、数据飞轮和明星投资方支撑，而不是基本面。具身 AI 研发高度资本密集
              ——同行每年投入数亿美元到十多亿美元——所以 Psibot 迄今约 $300 million 融资意味着现金续航 有限，未来很可能反复融资；一旦基准测试不及预期或资本市场收紧，公司会暴露于降价融资或
              稀释风险。行业泡沫放大了估值风险：Morgan Stanley 调研发现，尽管预测被上调一倍，潜在工业 买家中只有 23% 对当前人形机器人产品满意；2026 年约 22 家具身 AI 独角兽诞生——这是典型泡沫
              信号，会提高估值倍数压缩的概率。


              人才和执行风险高度集中。Psibot 的可信度依赖一个小团队——CEO Viktor Wang，以及一群学术带头人 （Peking University 的 Yaodong Yang、来自
              Stanford/Fei-Fei Li 圈层的 Yuanpei Chen、SJTU 的 Ying Wen）——任何关键人物离开，都会伤到能力和叙事；具身 AI 人才市场竞争也极为激烈。作为 一家 2024
              年才成立的公司，Psibot 还要同时扩张硬件、数据运营和 OEM 关系，承担非常年轻组织 常见的执行风险。下方人才/执行登记表按严重度排序，并给出尽调路径。
            claimRefs:
              - CR029
              - CR030
              - CR031
              - CR032
              - CR033
              - CR034
              - CR035
              - CR036
