    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              Psibot 在中文来源中以 Lingchu Intelligence（灵初智能）运营，是一家具身 AI 公司，2024 年 9 月 1 日成立，在北京、上海办公。公司自称是中国具身 AI
              赛道的领导者，聚焦通用具身智能、大规模视觉-语言-动作（VLA）模型和灵巧操作算法；其使命是“用 AI 和机器人创造无限生产力”，愿景是“成为智能机器人全球领导者”。VLA
              模型把机器人周围的摄像头图像和自然语言指令作为输入，直接输出底层电机指令；传统工业自动化里的感知、规划、控制三套链路被压成一条，机器人因此能在新物体、新工况下泛化，不必按任务重新编程。


              商业假设不是硬件竞赛，而是平台玩法。Psibot 把 Psi 系列模型——智能“大脑”——授权给第三方机器人开发商，销售自研人手数据采集系统（Psi-SynEngine
              外骨骼手套），并提供仿真和训练数据服务。管理层称其为“小全栈”：Psibot 掌控高价值设计要素（系统架构、自由度、运动范围和模型），组件生产与制造交给专业供应商。公司押注具身 AI
              最可防守的位置不在机器人本体，而在软件大脑和背后的私有数据飞轮；无论最终哪种硬件形态胜出，Psibot 的智能层和灵巧操作数据集都能随整个行业增值。
