      - number: '1.4'
        title: 封面指标、规模与披露画像
        blocks:
          - type: paragraph
            body: >-
              Psibot 可核验的封面指标几乎全是资本和团队信号，经营指标没有披露。截至报告日能够确认的是：公司成立于 2024 年 9 月；据报道估值 US$1.48B；累计融资约 US$300M；2026 年 7 月由
              Chery 领投近 US$100M 轮次；产品节奏从 Psi R0（2024 年 12 月）推进到 Psi R1（2025 年 5 月），再到 Psi-R2 和 Psi-W0（2026 年 4
              月）。相反，收入、收入运行率、毛利率、烧钱速度、员工数和硬客户数量，在任何留存公开来源中都未披露；公司自己也没有给早期轮次挂估值。


              这使 Psibot 成为一家私有且披露不足的公司，目前只能用代理指标而非财务数据推断规模：投资人阵容的规模和战略质量，2026 年采集 100 万小时操作数据、打造中国最大灵巧手数据集的目标，从 100,000
              小时储备中开源 1,000 小时，以及大型物流供应商和主要光纤光缆制造商的具名试点。每个缺乏支撑的封面指标都作为明确证据缺口保留，并配上具体尽调路径（经审计财务、HR 认证员工数、已签约客户名单）；因为仅
              2026 年中国就诞生了二十多家具身 AI 独角兽，要区分真实牵引力和资本驱动的热度，必须拿到公司尚未释放的经营数据。
