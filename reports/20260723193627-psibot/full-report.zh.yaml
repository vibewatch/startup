      - number: '3.4'
        title: 切换成本、锁定与分销权力
        blocks:
          - type: paragraph
            body: >-
              对大脑授权商来说，切换经济性是最核心的竞争问题。机器人 OEM 可以采用 Nvidia 开放的 GR00T 栈、授权 Physical Intelligence，或自建控制模型；除非 Psibot
              的私有灵巧手数据集真正形成数据锁定，否则离开 Psibot 的切换成本结构性偏低。多栖接入进一步加压：OEM
              可以同时整合多家基础模型提供商，并让它们互相压价，限制单一大脑供应商的定价权。内部自研威胁并非假设——Tesla、Figure、Unitree 和 AgiBot 都训练私有大脑，Nvidia 也把 GR00T
              作为开放参考平台分发；因此 Psibot 的可授权大脑假设，同时面对免费 / 开放和内部自研替代。


              分销权也偏向既有玩家。硬件同业掌握工厂关系（BMW、BYD、NIO）、零售渠道和公开市场入口；Nvidia 则同时是整个赛道许多公司的算力供应商和大脑竞争者：许多中国同业基于 Jetson 和 Isaac
              构建，Nvidia 还点名 Unitree H2 Plus 机体作为 GR00T Reference Humanoid 的硬件基础。Psibot
              的抗衡力量来自战略投资人的制造和传感器供应链，以及中国市场入口，但这些都依赖伙伴而非公司自有。净结果是：这是一家拥有可信数据飞轮护城河叙事的大脑供应商，但相较资本更足、纵向一体化或开源的对手，结构性锁定弱、分销有限。
            claimRefs:
              - CP020
              - CP021
              - CP022
              - CP032
              - CP037
      - number: '3.5'
        title: 护城河耐久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Psibot 最能防守的护城河叙事，是其私有人手操作数据集和数据采集引擎，以及打造中国最大灵巧手数据集的目标。如果灵巧操作数据是可靠 VLA
              模型的稀缺输入，早期且持续复利的数据领先可能具备耐久性。但耐久性尚未证明，时间窗口也有限。每个严肃对手都在放大数据：Figure 从内部真实世界视频中学习，Physical Intelligence 提取 RL
              Token 做快速在线强化学习，Nvidia 通过 Isaac 仿真大规模生成合成数据。如果开放模型或资金更足的模型补上灵巧度差距，大脑层会商品化，Psibot 的授权假设就会被侵蚀。


              反向证据不少。行业层面，2025 年人形机器人部署绝大多数并非生产用途——研究、教育、演示和导览占主导——真正的工业收入只占低个位数；Unitree 自己的招股书显示，研究和教育占人形机器人收入
              73.6%，真实产线收入在 2025 年前九个月仅约 ¥15.7M（US$2.2M）。Morgan Stanley 买方调查（满意度 23%）和 Unitree 2026 年 Q1
              增速放缓都说明供给正在跑过已验证需求。在这个背景下，Psibot 的估值比 Figure（US$39B）和 Physical Intelligence（>US$11B）低一个数量级，也低于 Unitree 约
              US$6B 的 IPO 目标；因此它既不是能力领导者，也不是规模领导者——存活逻辑压在数据飞轮锁定和中国市场入口上，而两者仍需证明。
