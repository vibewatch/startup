      - number: '5.5'
        title: 差异化、IP 与关键依赖
        blocks:
          - type: paragraph
            body: >-
              Psibot 的差异化靠数据飞轮，不靠某个唯一算法。论点是「机器人版 Android」：通过外骨骼手套 Psi-SynEngine 采集自有、低成本的人手操作数据——公司称成本约为传统遥操作的十分之一——再把
              数据喂给授权给多家 OEM 机身的 VLA 模型，让每一次部署都丰富数据集、反过来改进模型。公开 IP 足迹真实且外部可见：DexGraspVLA 框架（开源代码和数据集）、VLA 综述和论文清单
              （「Awesome-VLA-Papers」），以及通过 Psi-Robot GitHub 组织发布的 Psi SynHand 模型；同时 还有创始人的学术履历（Yaodong Yang、Yuanpei
              Chen）。


              但这种差异化必须放到强可比对象和硬依赖里看。Physical Intelligence 等全球实验室也在走类似 分层 VLA 路线，OpenVLA 这类开放基线（一个 7B 模型，表现超过 55B 闭源
              RT-2-X）说明范式并非 专有——Psibot 的优势在数据和灵巧操作重点，不在独一无二的架构。关键依赖都在外部：Nvidia 算力（Jetson 边缘模块和 Isaac
              仿真）被中国同行共同使用，也暴露在美国出口管制之下；精密 部件（特种滚珠丝杠约 90% 由德国 Schaeffler 和日本 THK/NSK 供应）是任何具身硬件都绕不开的 需求；PKU
              联合实验室和战略投资方则牵引研发和制造需求。这些依赖被明确画出，因为约束 Psibot 操作空间的，与其说是算法，不如说是它们。
            claimRefs:
