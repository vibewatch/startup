      - number: '1.5'
        title: 里程碑与发展轨迹
        blocks:
          - type: paragraph
            body: >-
              Psibot 有记录的时间线不到两年，但在成立、产品、融资和商业化四条线上密度异常高。公司于 2024 年 9 月 1 日成立；2024 年 12 月 30 日发布首个端到端强化学习具身模型 Psi
              R0；2025 年 1 月开始与关键客户推进概念验证和签约；2025 年 3 月发布 Psi R0.5；2025 年 4 月推出 Psibot V1 和 Psibot H1 硬件平台；2025 年 5 月发布旗舰
              Psi R1，并用机器人连续自主打麻将超过 30 分钟，展示其定义的 L3（自主、长时程）灵巧操作能力。


              融资和规模里程碑随后提速：2024 年 11 月天使轮；2026 年 3 月披露天使轮 / Pre-A 合计 ¥2B；2026 年 4 月 10 日发布用人类数据预训练的 Psi-R2 和 Psi-W0
              模型（并开源 1,000 小时多模态手部操作数据）；2026 年 7 月 23 日报道 Chery 领投近 US$100M 轮次，估值 US$1.48B。部分产品节点只在公司材料中精确到月份，2026 年 7
              月轮次也仍是接近交割而非已完成；时间线保留这些限定，而不是抹平。留存公开来源中没有负面或治理事件（诉讼、高管流失、召回）——这符合一家极年轻私有公司的特征，但也更像披露有限，而非经审计记录完全干净。
