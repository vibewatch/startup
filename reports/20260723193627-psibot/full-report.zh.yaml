  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、收入流与定价
        blocks:
          - type: paragraph
            body: >-
              Psibot 变现的是智能，不是硬件。公司材料描述的是“小全栈”模式：掌控机器人设计参数（结构、运动范围、自由度），但把组件生产和制造外包；收入来自向第三方机器人开发商授权 Psi 系列 VLA
              模型，销售私有人手数据采集系统（Psi-SynEngine，使用 16-DOF 外骨骼手套，可实现亚毫米 3D
              轨迹精度和指尖触觉感知），并提供仿真及训练数据平台。公司明确的商业目标是打造中国最大灵巧手数据集，并在 2026 年采集 100 万小时操作数据，这把数据本身也改写成可变现资产。这是 Android
              式平台假设：把授权“大脑”铺进许多 OEM 本体，而不是销售单一机器人。


              关键财务警告在于，这些收入流没有任何一个披露价格、抽成率、授权单位数或已确认收入。报道显示 Psibot 到 2026
              年初已通过中国物流和制造商业试点产生部分收入，但金额、合同结构和收入确认时点全部不公开。硬件同业会公开透明单机价格——UBTech U1 起价 ¥119,800，Unitree G1 起价 ¥85,000（约
              US$12,000），R1 Air 起价 ¥29,900（约 US$4,300）——而 Psibot
              的授权和数据平台定价未披露，因此连间接三角测算收入都做不到。本章每条变现线索都标为公司主张（收入流存在）或不可获得（经济性），并配上具体尽调请求，而不是估算值。
