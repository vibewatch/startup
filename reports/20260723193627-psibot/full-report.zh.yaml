          tone: neutral
        - label: 动作 token 化
          detail: 把计划转成可执行控制 token。
          tone: neutral
        - label: 灵巧执行（抓取 / 放置）
          detail: 机器人手完成操作步骤。
          tone: neutral
        - label: 反馈 + 纠错
          detail: 触觉 / 视觉反馈帮助从抓取失败中恢复。
          tone: positive
      edges:
        - from: Natural-language task + camera input
          to: Plan (CoAT reasoning)
        - from: Plan (CoAT reasoning)
          to: Action tokenization
        - from: Action tokenization
          to: Dexterous execution (grasp / place)
        - from: Dexterous execution (grasp / place)
          to: Feedback + correction
        - from: Feedback + correction
          to: Plan (CoAT reasoning)
