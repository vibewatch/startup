companyProfile:
  summary: >-
    Psibot (Lingchu Intelligence / 灵初智能) 是一家中国具身 AI 初创公司，2024 年成立，总部位于北京和上海。公司开发面向机器人灵巧操作的视觉-语言-动作（VLA）模型平台，旗舰系统 Psi R1
    已展示 L3 级自主操作能力（30 分钟自主打麻将）。Psibot 不造自有机器人，而是把 AI “大脑”——智能层——授权给机器人制造商，并希望打造中国最大的灵巧手数据集，形成可复利的数据飞轮。公司已在物流仓库分拣场景落地。
