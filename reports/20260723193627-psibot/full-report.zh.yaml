  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、替代方案与相邻赛道
        blocks:
          - type: paragraph
            body: >-
              Psibot 的市场是具身 AI 的“大脑”层：公司授权 Psi 系列 VLA
              加强化学习模型，销售自研人手数据采集系统，并提供仿真和训练数据服务，而不是制造机器人本体。纳入范围的支出因此是模型授权、数据和仿真服务、数据采集硬件；排除范围是 Psibot
              外包、或授权客户自建的机器人底盘、执行器和整机装配。这个边界很关键，因为它把 Psibot 的可服务市场从自身出货量中拆出来：作为平台，公司机会随下游采用其智能层的机器人总装机基数放大，而不取决于 Psibot
              自己卖出多少台机器。


              Psibot 要替代的现状方案，是固定可编程自动化和 AGV/AMR
              车队——它们速度快，但遇到新物体就不能无重新编程泛化——以及承担分拣、拣选和灵巧搬运的人力。相邻市场包括人形机器人（通用大脑的主要硬件载体）、仓储机器人（分拣是最近的商业应用）、物流机器人和更广义的工业机器人。由于不同机构对这些池子的定义不同——人形机器人、仓储机器人、物流机器人、“具身智能”——其头部总量彼此重叠，不能直接相加；下一节所有规模测算都受这个前提约束。
