      - number: '3.2'
        title: 竞争对手画像——规模、融资与方向
        blocks:
          - type: paragraph
            body: >-
              中国硬件领导者定义了规模标尺。AgiBot 成立于 2023 年，有 BYD 背书，2026 年 3 月 30 日生产出第 10,000 台人形机器人，从 5,000 台到 10,000 台约用三个月；2025
              年出货约 5,168 台（Omdia 排名全球第一）。Unitree 在 2026 年 6 月 1 日用创纪录的 73 天通过 STAR Market 上市委审议，目标估值约 US$6.2B，同时融资约
              ¥4.2B（约 US$583M）；2025 年收入达到 ¥1.699B（约 US$240M），毛利率约 60%，人形机器人已贡献超过一半收入，H1 型号累计超过 11,000 台。UBTech 在 2026 年
              6 月 30 日开放全尺寸 UWORLD U1 系列订单，首日累计订单突破 13,361 台，起价 ¥119,800；此前 2025 年全尺寸机器人出货 1,079 台，人形机器人收入 ¥821M。


              纯大脑和西方全栈玩家定义了资本与能力标尺。Physical Intelligence 成立于 2024 年，构建通用机器人基础模型（π0、π0.7，后者带 RL Token 和 Multi-Scale
              Embodied Memory，可处理超过十分钟任务），据报道正以超过 US$11B 估值融资约 US$1B，四个月前估值还是 US$5.6B，背后投资人包括 Founders
              Fund、Lightspeed、Jeff Bezos 和 Nvidia。Figure AI 成立于 2022 年，2025 年 9 月以 US$39B 估值完成 Series C（累计融资约
              US$1.9B），运行自研 Helix 大脑，正在放量 Figure 03，并有 OpenAI 牵头的 US$6.7B 投资支持。Tesla 到 2026 年 6 月已在 Giga Texas 部署约 1,000
              台 Optimus Gen 3，目标年底内部部署 5,000 台。与这些公司相比，Psibot 约 US$1.48B 估值和未披露出货量，使其更像中腰部的能力与数据挑战者，而不是规模领导者。
