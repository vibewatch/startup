      - number: '5.4'
        title: 部署、集成、可靠性与路线图
        blocks:
          - type: paragraph
            body: >-
              Psibot 的部署模式直接来自其授权论点：公司不交付成品机器人，而是把 Psi 模型授权给机器人 OEM，同时销售 Psi-SynEngine 数据系统以及仿真和训练数据服务，把自己的大脑接入合作方硬件。
              公开部署证据具体但单薄——一家大型中国物流客户的小规模仓储分拣验证（报道有效率提升），以及 在全球最大光纤光缆制造商之一处测试。研发和验证由 PKU-PsiBot Joint Lab for Embodied
              Dexterous Manipulation 锚定，该实验室产出 Psibot 公开论文。


              可靠性和支持层面，画面是一处缺口：大约 18 个月内迭代五代模型加硬件，节奏异常快；但没有 独立的现场可靠性、在线率、平均故障间隔时间（MTBF）或支持 SLA 数据公开，外部无法 核验产品化成熟度。公司披露的
              2026 年运营目标，是建设中国最大的灵巧手数据集，并在年内采集 100 万小时操作数据。从 Psi-R2/W0 发布看，路线图指向数据储备和 RL 飞轮扩张——继续加深模型
              及其训练数据，而不是转向自有硬件——这与轻资产、平台授权方策略一致。
            claimRefs:
              - CE019
              - CE020
