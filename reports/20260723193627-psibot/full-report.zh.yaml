            body: 自 2026 年 1 月 1 日起，CSL 将罚款提高 10 倍至 RMB 10 million，纳入 AI 治理义务，并扩大 域外适用——这直接关系到 Psibot 的数据中心模式及其 OEM 客户。
            calloutType: insight
