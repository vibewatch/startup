      - number: '4.6'
        title: 财务判断——收入质量、利润率路径与阻碍
        blocks:
          - type: paragraph
            body: >-
              看收入质量，结论是「尚未证明，但不是不存在」。Psibot 的变现模式可信且有差异化 （授权加可变现数据资产），也有具名试点；但公司没有披露任何已实现收入，没有独立第三方经常性
              合同证据，早期收入停留在试点或关联方阶段的风险也真实存在。看利润率路径，软件授权模式最终 理应比硬件同行更高毛利，但没有成本或收入披露，路径无法建模；最诚实的参照点是 Unitree 约 ~60%
              的硬件毛利率，以及其在 Q1 2026 同时因研发负担而利润腰斩，这说明即便是已经盈利的 龙头，具身 AI 经济性也会很快被压缩。看资本密集度，Psibot 有优势——轻资产、没有工厂资本开支
              ——但未验证的收入线要承接前置的模型和数据成本，风险正好反过来。


              尽调阻断项具体且严重。最大的一项是已实现收入和合同披露完全缺席：没有这些，收入质量、ARR 轨迹和单位经济模型都无法支撑投资判断。第二项是现金、现金消耗、现金续航三件套未披露，把资本充足性从
              「大概率舒服」变成一个假设。第三项是客户集中度和关联方暴露，因为需求与战略投资方相关。 在 Psibot 打开已实现财务数据之前，这仍是一笔由团队、数据和投资方驱动的赌注；眼下的财务
              报表不是数字，而是一组结构清楚的问题。本章图表和缺口表逐项列出这些阻断项，以及能够解除 阻断的确切证据。
            claimRefs:
              - CI031
              - CI032
              - CI033
              - CI034
              - CI035
