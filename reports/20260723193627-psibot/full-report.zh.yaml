  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群分层
        blocks:
          - type: paragraph
            body: >-
              Psibot 的客户模型直接来自平台授权策略：公司不把成品机器人卖给终端企业，而是把 Psi 视觉-语言-动作模型授权给机器人 OEM 和开发者，由后者把模型装进自己的硬件，再服务终端客户。
              按买方/用户/付款方拆分，OEM 通常是买方和付款方，终端企业（仓库或工厂运营方）才是操作能力 的最终用户。垂直场景很具体：物流和仓储——条码分拣、高 SKU 服装配送拣选，这些场景里物体
              多样、任务频繁变化，需要 VLA 模型提供泛化——以及制造业，证据是在全球最大光纤光缆制造商 之一处测试。


              地理上，客户基础集中在中国，这与 Psibot 的北京/上海布局和中国国家支持的具身 AI 推进一致； 目标细分市场是物流、零售和智能制造仓储。因此，可触达客户集是中国快速扩张的人形机器人市场 里的众多机器人
              OEM；通过它们，大型物流买家（State Grid、SF Express、China Post 一类企业） 才变得可达。Psibot 把条码分拣物流选为第一个真实部署场景，正是因为高 SKU 多样性和任务变化
              会让刚性自动化失效，泛化大脑才有用武之地——这是有意选择的楔入场景，而不是一次广泛发布。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
