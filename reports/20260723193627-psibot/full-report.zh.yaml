      - number: '7.6'
        title: 缓释、监测与否决标准
        blocks:
          - type: paragraph
            body: >-
              Psibot 最强的缓释因素是投资方和数据资产。明星战略投资者（Chery 及其 AiMOGA 机器人子公司、 Lens
              Technology）和国资相关基金，降低了资本获取以及制造/商业化渠道风险；自有操作数据集 ——2026 年目标为 100 万小时——如果能证明会带来模型质量，就是一条真实且会复利的护城河。这些
              缓释因素真实但不完整：它们更能解决融资和渠道风险，远不如解决监管准入、商业证明或估值风险； 后几项仍是支撑论点的关键不确定性。


              监测上，价值最高的触发指标包括：第三方独立验证（或推翻）Psibot 的基准测试主张；付费、独立 第三方生产部署而非试点和数据采集单元的证据；美国出口政策下 Nvidia/算力获取的任何变化；
              《国家情报法》或《网络安全法》下已披露的执法或强制数据访问事件；以及关键创始人或首席科学家 离职。论点失效标准也由此直接推出：核心基准测试可信验证失败、前沿算力获取长期丧失、
              国家驱动的数据访问事件让国际需求失效，或降价融资重置估值论点。下方缓释与否决标准表把 每项主要风险配上可监测触发因素、阈值和行动含义；本章尽调事项——审计财务、具名生产参考客户、 关联方清单、部件
              BOM，以及诉讼/执法历史——是解决残余不确定性的最快路径。
            claimRefs:
              - CR037
              - CR038
              - CR039
              - CR040
