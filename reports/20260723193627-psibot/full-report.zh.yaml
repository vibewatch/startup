      - number: '1.2'
        title: 创始人、领导层与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              Psibot 由创始人兼 CEO Viktor Wang 博士（中文名 Wang Qibin / 王启斌）领导。他拥有 George Washington University
              博士学位，具备约二十年硬件和商业化经验，曾任 JD.com 机器人业务总裁、Yunji Technology 产品副总裁，更早曾在 BlackBerry 任职。技术班底是公司的标志性资产：联合创始人、工程负责人
              Xiaojie Chai 博士在 Alibaba 和 Tencent 的机器人及自动驾驶项目中积累十五年以上经验，并主导过 L4 自动驾驶落地；首席科学家 Yaodong Yang 教授是 Peking
              University Institute for Artificial Intelligence 助理院长、Boya Scholar，也是在 UCL 受训的强化学习研究者，曾赢得 NeurIPS 2022
              具身灵巧操作挑战赛，并牵头 PKU-PsiBot Joint Lab；联合创始人 Yuanpei Chen 是一名 Z 世代研究员，曾在 Stanford 跟随 Karen Liu 和 Fei-Fei Li
              做访问学者，并称自己率先用强化学习在真实世界控制双臂多技能操作。


              科学人才高度集中——Psibot 将自己包装为“科学家密度最高的具身 AI 公司”——也是最尖锐的治理风险。投资逻辑很大程度压在少数具名个人身上：CEO 的商业化履历、首席科学家的学术背书和 PKU 实验室，以及
              Chen 的控制模型研究。公开来源未披露董事会构成、股权分配和正式治理安排，也看不到独立董事会或创始科学家之外的职业管理层厚度；关键人物依赖因此集中，学术创始人的留任成为实质尽调问题。
