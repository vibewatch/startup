- id: comparables
  title: Comparable Valuations
  body: 'Public comparables frame — but do not settle — the debate. On the Chinese side, Unitree''s approved STAR Market listing implies a market capitalization near RMB 42 billion (about US$5.83 billion), with CCB International projecting up to RMB 109 billion (about US$15.1 billion) including brand premium, equivalent to a 32x price-to-sales multiple on a company that shipped over 5,500 robots in 2025 and is already profitable. DEEP Robotics, roughly one-fifth of Unitree''s revenue, carries an even richer implied 41x price-to-sales multiple at an approximately RMB 13.9 billion (about US$1.93 billion) issuance valuation. Across the broader cohort, at least 25 domestic embodied-intelligence companies now carry valuations above RMB 10 billion (about US$1.39 billion), 15 of them minted in the first half of 2026.


    On the global side, Figure AI reached about US$39 billion in 2025, Physical Intelligence was reported in talks above US$11 billion, Skild AI has been discussed in a roughly US$8-12 billion range, and Apptronik closed near US$5.5 billion. The critical limitation is comparability: most of these peers are pre-revenue or forward-multiple priced, and the public-market names are full-stack hardware integrators, whereas Psibot is a software / intelligence-layer licensor. That mismatch means the comps justify a large addressable optionality but do not support a precise fair value for Psibot''s specific business model, and the reset toward auditable metrics from the IPO cohort is likely to compress the paper premiums this cohort currently enjoys.'
