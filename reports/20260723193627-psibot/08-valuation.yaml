- id: recommendation
  title: Recommendation, Confidence, Risk Rating, and Valuation Stance
  body: 'Our recommendation is a conditional Watch: do not lead or price-take at the current US$1.48 billion post-money without named production references, audited financial statements, and a related-party revenue schedule in hand. The optionality is genuine and the downside is asymmetric at entry price, so discipline on terms matters more than conviction on the story. Confidence in this judgment is low-to-medium: the public evidence base is thin, dominated by company statements and press coverage of a single financing event, with almost no independent, auditable operating data. The overall risk rating is high, driven by the absence of commercial proof, unverified capability benchmarks, regulatory and data-access exposure, and a sector-wide "elimination year" that analysts expect in 2027-2028 as 18-to-24-month cash runways expire.


    Our valuation stance is that US$1.48 billion is stretched relative to disclosed fundamentals — it is defensible only by reference to team, the data flywheel, strategic-backer signaling, and the rich comparable set of Chinese and global embodied-AI peers, none of which is a substitute for revenue. The recommendation logic chains through four gates: Is the platform economically scalable? Is there independent proof of capability and commercial traction? Are regulatory and execution risks contained? And is the entry price supported? Psibot clears the first, fails the second and (partly) third today, and only conditionally clears the fourth — which is why the verdict is a price-disciplined Watch rather than an outright pass or buy. The diligence scorecard that follows scores the opportunity strong on market and moat but weak on commercial proof, unit economics, risk containment, and evidence quality.'
