- id: scenarios
  title: Bull, Base, and Bear Scenarios
  body: 'The bull case assumes Psibot''s capability claims are independently verified, OEM licensing scales across multiple hardware partners, and the dexterous-hand data flywheel compounds into a durable moat; under those conditions the platform could re-rate toward US$4-6 billion or more, consistent with the premiums attached to software-centric global peers. The base case assumes pilots convert only slowly, capability remains credible but unproven at scale, and Psibot stays a private unicorn in the roughly US$1.5-2.5 billion band while consuming additional capital to extend runway. The bear case assumes benchmark disappointment, a regulatory or compute-access shock, or a failed raise into a tightening market, forcing a down-round or distressed outcome in the US$0.3-0.7 billion range or worse.


    The dominant downside triggers are disproof of the headline benchmarks, loss of access to Nvidia-class compute, a data-security or National-Intelligence-Law enforcement event that forecloses international demand, and inability to close the next round before runway expires. On the public evidence available today the base case is the most defensible central estimate; the bull case requires independent proof that does not yet exist, and the sector''s expected 2027-2028 consolidation raises the weight on the bear tail. Implied value is highly sensitive to the assumed probability of hitting commercial milestones and to the revenue multiple the market is willing to apply once auditable metrics exist.'
