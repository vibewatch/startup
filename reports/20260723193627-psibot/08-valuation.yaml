- id: exit-diligence
  title: Exit Paths, Thesis-Break Triggers, and Diligence Asks
  body: 'Psibot''s plausible exit paths are a domestic STAR Market or Hong Kong listing along the trail Unitree and GigaAI are blazing, or a strategic acquisition by an industrial backer such as Chery that already depends on the technology. Near-term exit readiness is low: the company is pre-revenue and private and would need demonstrable, auditable commercial traction before any public-market window opens to it, especially as investors gain three granular listed reference points that reward delivery and profitability.


    The thesis breaks if the headline benchmarks are independently disproven, if licensing fails to scale beyond captive strategic partners, if a regulatory or export-control event severs compute or data access, or if the company cannot raise before runway expiry. Our final diligence asks, before any capital commitment, are: audited financial statements and a revenue-recognition policy; a named, contactable customer-reference list distinguishing arm''s-length from related-party revenue; a related-party transaction schedule covering Chery and Lens; a component bill-of-materials and compute-supply plan given export-control exposure; a full cap table with the liquidation-preference stack; and independent third-party verification of the L3 manipulation and Mahjong-autonomy claims. On balance the opportunity is high-risk and high-optionality; we recommend a conditional pass that becomes investable only once these proofs are delivered and price is negotiated with an explicit down-round margin of safety.'
