- id: financing
  title: Financing Context and Entry Discipline
  body: 'Psibot has raised more than US$300 million cumulatively, with a round of roughly US$100 million in July 2026 led by Chery Automobile and Lens Technology setting the US$1.48 billion post-money valuation; an earlier financing of approximately RMB 2 billion (about US$280 million) preceded it. Because the company is pre-revenue, that valuation is derived from investor signaling, scarcity of elite embodied-AI teams, and strategic pull from industrial backers rather than from unit economics — a basis that public evidence can corroborate as a fact of the round but cannot independently validate as fair value.


    Entry discipline therefore dominates. Strategic backers who also stand to consume Psibot''s technology set the clearing price, so an arm''s-length financial investor should expect to pay a premium and should size any position against a real probability of one or more future dilutive rounds: sector runways of 18-24 months imply repeated capital calls before any liquidity event, creating preference-stack overhang. Down-round risk is elevated and rising because the imminent public listings of Unitree, DEEP Robotics, and Leju are resetting China''s robotics valuation methodology away from top-down TAM extrapolation toward auditable deliveries, revenue, and profitability — a reset that is structurally unfavorable to a pre-revenue platform priced on narrative. We would require audited financials, a named-customer reference list, a related-party revenue schedule, and preference-stack disclosure before committing capital at anything near the current mark.'
