  evidenceGaps:
  - type: missing-source
    severity: material
    topic: audited financials, cap table, and preference stack
    missingEvidence: Audited financial statements, a full cap table, and the liquidation-preference stack for Psibot.
    whyItMatters: Without financials and the preference stack, the US$1.48B valuation cannot be validated on fundamentals and the dilution / downside-protection overhang cannot be quantified.
    diligencePath: Request audited or management financials, a full cap table, and the liquidation-preference schedule from Psibot and its counsel before any commitment.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: moderate
    topic: target return, hold period, and IRR
    missingEvidence: The entry terms, ownership percentage, and exit-timing assumptions needed to model a supportable target return or IRR.
    whyItMatters: Return math cannot be constructed from public evidence because pricing, ownership, and exit timing are private to the round participants.
    diligencePath: Obtain the term sheet, ownership and preference terms, and a management exit-timing view to model IRR under each scenario.
    relatedQuestionRefs:
    - QV029
  - type: enumeration-incomplete
    severity: moderate
    topic: comparable-company completeness
    missingEvidence: A complete comparable set covering the many private Chinese unicorns and a clean public analog for a pure software / intelligence-layer licensor.
    whyItMatters: The comparable set is partial and lacks a pure-play licensing analog, so any comp-derived value for Psibot is indicative rather than precise.
    diligencePath: Extend the comp set with disclosed private rounds and any emerging pure-play AI-licensing comparables as they are reported.
    relatedQuestionRefs:
    - QV023
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: material
    topic: independent benchmark verification
    missingEvidence: Independent third-party verification of Psibot's L3 manipulation and 30-minute autonomous Mahjong claims.
    whyItMatters: The central capability premise underpinning the valuation is company-reported and unverified, so the bull case cannot be underwritten.
    diligencePath: Commission independent reproduction of the headline manipulation and autonomy benchmarks under controlled conditions.
    relatedQuestionRefs:
    - QV009
