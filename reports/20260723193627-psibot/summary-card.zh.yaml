  topStrengths:
    - 平台授权模式切入具身 AI 技术栈里最容易规模化、也最能守住壁垒的一层，有机会在多家 OEM 身上跑出软件式经济性。
    - 创始团队履历罕见：覆盖 Peking University、Stanford / Fei-Fei Li 学术脉络，以及 Alibaba / Tencent 机器人经验。
    - Chery Automobile、Lens Technology 等头部战略投资人同时给资金和产业牵引，降低融资与制造落地风险。
    - 公司想搭建中国最大的灵巧手数据集，把数据飞轮越滚越厚；已展示 L3 操作能力，包括 30 分钟自主麻将。
    - 市场大且扩张快：WAIC 2026 具身 AI 公司合计估值超过 US$14.7B，2026 H1 中国新增 15 家独角兽。
  topRisks:
    - 收入、ARR、毛利率、烧钱速度、现金跑道和员工数均未披露，US$1.48B 估值更多押注团队、数据与投资人，而不是基本面。
    - 核心能力基准由公司自报，尚无独立验证；分析师估计，超过 85% 的具身 AI 部署仍停留在非生产试点。
    - 中国特定监管与数据访问风险（National Intelligence Law、修订后的 Cybersecurity Law、Data Security Law / PIPL）会压住海外需求和融资可选项。
    - 对 Nvidia 级算力和精密部件的依赖暴露在美国出口管制下；Unitree / DEEP / Leju 即将上市，也可能把估值锚拉回可审计指标，带来 down-round 风险。
    - 18-24 个月现金跑道耗尽后，行业预计在 2027-2028 年进入「淘汰年」；早期牵引也可能来自战略投资人拉动，而非独立第三方需求。
  unresolvedGaps:
    - 经审计财务数据——收入、ARR、毛利率、烧钱速度和现金跑道——以及最新一轮承诺资本与已到账资本的拆分。
    - 完整股权结构表和清算优先权堆叠，用于量化稀释与下行保护。
    - 对 L3 操作能力和 30 分钟自主麻将说法进行独立第三方验证。
    - 可具名、可联系的客户背调名单，并区分独立第三方收入与关联方（Chery / Lens）收入。
    - 中国 AI、数据和网络安全法律下的诉讼、执法与许可记录；鉴于出口管制风险，还需要部件 BOM 与算力供应计划。
