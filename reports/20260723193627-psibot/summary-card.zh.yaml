summary:
  headline: Psibot 同时拿到了顶级具身 AI 团队、平台授权模式和头部战略投资人，估值也站上 $1.48B 独角兽档位——但收入未披露、性能基准来自自报，还暴露在中国特定监管风险下。按当前估值投入前，尽调必须先验证这张执行期权能否兑现。
