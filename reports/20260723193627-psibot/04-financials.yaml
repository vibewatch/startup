  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: realized revenue and contracts
    missingEvidence: Any disclosed Psibot revenue, ARR, recognized-revenue figure, or licensing contract with terms, take-rate, and licensed-unit counts.
    whyItMatters: Without realized-revenue and contract data, revenue quality, ARR trajectory, and unit economics cannot be underwritten at all — this is the core financial blocker.
    diligencePath: Request audited or management revenue by stream, signed licensing agreements with pricing and take-rate, licensed-unit counts by OEM, and revenue-recognition policy.
    relatedQuestionRefs:
    - QI002
    - QI005
    - QI023
    relatedTableRefs:
    - TI005
  - type: missing-metric
    severity: material
    topic: cash, burn, and runway
    missingEvidence: Psibot's cash on hand after the July 2026 round, monthly burn rate, implied runway, and planned use of funds.
    whyItMatters: Capital adequacy is Psibot's strongest dimension but currently rests on inference; without the cash/burn/runway triad it remains an assumption rather than a fact.
    diligencePath: Obtain the post-round balance sheet, monthly operating burn, headcount and compute cost lines, and the board-approved use-of-proceeds plan.
    relatedQuestionRefs:
    - QI019
    - QI010
    relatedTableRefs:
    - TI004
  - type: missing-metric
    severity: material
    topic: unit economics and sales efficiency
    missingEvidence: Licensing price/take-rate, gross margin per stream, CAC, payback, sales cycle, and customer-concentration/related-party share.
    whyItMatters: Sales-efficiency and unit-economics proxies drive any forward revenue model; their absence blocks margin-path and scalability underwriting and hides related-party risk.
    diligencePath: Request per-customer economics, gross margin by stream, sales-cycle data, pipeline coverage, and a related-party transaction schedule.
    relatedQuestionRefs:
    - QI007
    - QI009
    relatedTableRefs:
