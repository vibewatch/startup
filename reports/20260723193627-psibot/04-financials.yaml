company:
  name: Psibot
chapter:
  number: 4
  title: Financials
  summary: 'Psibot is a pre-disclosure private company: it publishes no revenue, ARR, gross margin, burn, or headcount figures, so this chapter separates what is verifiable (capital raised) from what must be treated as unavailable private data. On capital, the evidence is strong and consistent: Psibot has raised roughly US$300 million since its September 2024 founding — an angel-plus-Pre-A stack of about ¥2 billion (~US$280 million) announced 10 March 2026, then a near-final ~US$100 million round in July 2026 led by Chery Automobile with Lens Technology that set a US$1.48 billion valuation. Its revenue model is a licensing-and-data platform: it licenses the Psi VLA model to robot OEMs, sells the proprietary Psi-SynEngine human-hand data-collection system, and offers simulation and training-data services. None of these streams has a disclosed price, unit count, or recognized-revenue figure, so unit economics are entirely a gap. Because there is no Psibot filing, this chapter benchmarks unit economics against the closest public comparable — Unitree''s STAR Market IPO prospectus (2025 revenue ¥1.708 billion, ~60% gross margin, but only ~9% of humanoid revenue from genuine industrial use and Q1 2026 net profit down ~52%) — to frame the margin, demand, and capital-intensity questions a licensor faces. The financial verdict: capital adequacy looks comfortable for 2-3 years given a fresh ~US$100 million and deep-pocketed strategic backers, but revenue quality is unproven, the margin path is unmodellable on public data, and the single largest diligence blocker is the total absence of realized-revenue and contract disclosure.'
sections:
- id: revenue-model
  title: Revenue Model, Streams, and Pricing
  body: 'Psibot monetizes intelligence, not hardware. Its own materials describe a "small full-stack" model: it controls robot design parameters (structure, range of motion, degrees of freedom) but outsources component production and manufacturing, and it earns money by licensing its Psi-series VLA model to third-party robot developers, by selling a proprietary human-hand data-collection system (Psi-SynEngine, using 16-DOF exoskeleton gloves with sub-millimetre 3D trajectory precision and fingertip tactile sensing), and by offering simulation and training-data platforms. A stated commercial objective is to build China''s largest dexterous-hand dataset and to collect one million hours of manipulation data in 2026, which reframes data itself as a monetizable asset. This is an Android-style platform thesis: spread the licensed "brain" across many OEM bodies rather than sell a single robot.


    The critical financial caveat is that not one of these streams carries a disclosed price, take-rate, licensed-unit count, or recognized-revenue figure. Coverage indicates Psibot began generating some revenue through commercial pilots in Chinese logistics and manufacturing by early 2026, but the amounts, contract structures, and recognition timing are all private. Where hardware peers publish transparent unit prices — UBTech''s U1 from ¥119,800, Unitree''s G1 from ¥85,000 (~US$12,000) and R1 Air from ¥29,900 (~US$4,300) — Psibot''s licensing and data-platform pricing is undisclosed, so its revenue cannot be triangulated even indirectly. Every monetization line in this chapter is therefore labelled either company-claimed (the streams exist) or unavailable (their economics), and each carries a specific diligence request rather than an estimated value.'
