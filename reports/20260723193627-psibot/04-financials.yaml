- id: cost-structure-margins
  title: Cost Structure, Gross Margin, and Capital Intensity
  body: 'A brain-and-data licensor should, in theory, have a more software-like cost structure than a robot manufacturer: once a VLA model is trained, incremental licensing carries high gross margin, and the heaviest costs are R&D talent, compute, and data acquisition rather than bill-of-materials and assembly. Psibot leans into this by outsourcing manufacturing and by claiming its exoskeleton-glove data-collection approach costs roughly one-tenth of traditional teleoperation — an unverified but structurally important assertion, because data-acquisition cost is the dominant variable cost of the data-flywheel model. If true, it lowers the capital intensity of building the dataset that underpins the whole thesis.


    None of this is disclosed for Psibot, so its margin path is unmodellable on public data and is instead framed against the closest public comparable. Unitree''s IPO prospectus shows a vertically integrated hardware maker reaching ~60% gross margin (up from 44% in 2022) by producing motors and actuators in-house, on 2025 revenue of ¥1.708 billion. That figure sets an upper-ish bound for a hardware peer with deep integration; a pure-software licensor could in principle exceed it on incremental units but must first absorb heavy fixed R&D, compute, and data-collection costs against an unproven revenue base. The capital-intensity question therefore inverts the usual robotics concern: Psibot''s risk is not factory capex but whether licensing revenue can ever cover a large, front-loaded model-and-data cost base before capital runs down. Lens Technology''s own scale-up (RMB 2.44 billion of R&D in the first nine months of 2025) illustrates how expensive the surrounding embodied-AI hardware ecosystem is to build.'
