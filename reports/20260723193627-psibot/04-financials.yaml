- id: capital-adequacy
  title: Capital Adequacy and Financing Dependency
  body: 'Forward capital adequacy is Psibot''s strongest financial dimension. The historical funding chronology is covered in Company Overview; in summary, Psibot layered an angel round (November 2024, led by GL Ventures and Lanchi Ventures with state-linked co-investors), a combined angel-plus-Pre-A stack of about ¥2 billion (~US$280 million) announced 10 March 2026, and a near-final ~US$100 million July 2026 round led by Chery Automobile with Lens Technology at a US$1.48 billion valuation — roughly US$300 million of total capital in under two years. With a fresh nine-figure round just closed and no manufacturing capex burden, a young software-and-data company can plausibly fund two to three years of R&D, compute, and data-collection scaling before needing more, though the exact cash position, burn rate, and runway are undisclosed and must be confirmed.


    The financing-dependency picture is nonetheless real. Psibot has no disclosed revenue base to self-fund, so it remains dependent on continued capital markets access and on the goodwill of strategic backers whose interests are partly industrial rather than purely financial. There is no public evidence of debt or project-finance obligations, which is appropriate for an asset-light licensor, but the next-round trigger is effectively a capability-and-commercialization milestone: Psibot must convert its data lead and pilots into demonstrable licensing revenue before the current hype-driven valuation environment (22-plus embodied-AI unicorns minted in 2026; US$13.8 billion of Chinese embodied-AI funding in H1 2026) cools. Concentration of strategic-investor influence and the possibility that follow-on capital is contingent on hitting technical milestones are the key financing risks to test.'
