- id: buyer-segmentation
  title: Buyers, Users, Payers, and the Adoption Path
  body: 'Psibot serves two buyer channels with distinct payers. In the licensing channel, the buyer is a robot OEM or developer that embeds the Psi brain, the "user" is the robot''s own control stack, and the payer is the OEM''s R&D budget. In the direct-enterprise channel, the buyer is a logistics operator or manufacturer, the users are warehouse and line operators, and the payer is enterprise capex or, increasingly in China, state-owned-enterprise and government procurement. Logistics and e-commerce are the leading buyer vertical — Fortune Business Insights projects e-commerce at roughly 47% of the warehouse-robotics market in 2026 — which aligns with Psibot''s disclosed sorting pilots. In China, directive industrial policy pushes budget ownership toward SOEs and government entities executing policy-mandated pilots.


    The adoption path runs from lab demonstration to small-scale pilot to scenario validation to scaled multi-site deployment. As of 2026 the sector is concentrated at the pilot and validation stages: IDC reports that more than 85% of 2025 humanoid deployments were in performances, education, data collection, and guided-tour scenarios rather than production work, with only early pilots in manufacturing and logistics. Psibot''s own commercialization signals — a large Chinese logistics client for warehouse sorting and a leading fibre-optic cable maker — sit at this pilot stage, and neither is a confirmed paying customer at scale, so the buyer map describes intent and structure more than proven revenue.'
