- id: market-sizing
  title: Market Sizing Across Multiple Lenses
  body: 'No single number captures Psibot''s market, so five independent lenses frame it. First, humanoid robots: Global Market Insights valued the global market at about US$7.9B in 2025 and forecasts growth from US$10.9B in 2026 to US$54.2B by 2031 and US$192.7B by 2035, a 37.6% CAGR; Research and Markets similarly frames an early, exponentially growing market. Second, warehouse robotics: Fortune Business Insights sizes it at US$6.51B in 2025, rising from US$7.35B in 2026 to US$25.41B by 2034 (16.8% CAGR), with Asia-Pacific at 51.7% share. Third, logistics robots: Global Market Insights puts the 2025 market at US$17.8B, growing from US$20.7B in 2026 to US$91.4B by 2035. Fourth, warehouse automation broadly: Grand View Research estimates US$19.23B in 2023 reaching US$59.52B by 2030.


    Fifth and most relevant geographically, China: 36Kr Research Institute sizes China''s embodied-intelligence industry rising from ¥213.3B in 2018 to ¥915B in 2025 and above ¥1 trillion in 2026, while Morgan Stanley forecasts ~50,000 China humanoid shipments in 2026 (up ~79% from 28,000) and 446,000 by 2030, with the China market at ~US$2B in 2026 rising to ~US$15B by 2030. Volume corroboration is strong: IDC reports global humanoid shipments exceeded 18,000 units in 2025, led by Chinese vendors who accounted for roughly 90% of units, and projects shipments above 510,000 by 2030 at a ~95% CAGR. TrendForce adds that China humanoid output should climb ~94% in 2026. These lenses agree on direction and disagree on magnitude, so the 2026 humanoid TAM realistically clusters in the US$6–11B range globally while long-run figures remain speculative.'
