company:
  name: Psibot
chapter:
  number: 2
  title: Market Analysis
  summary: 'Psibot sells into the embodied-AI "robot brain" layer — Vision-Language-Action (VLA) plus reinforcement-learning software and dexterous-manipulation data — that sits atop, rather than inside, the robotics hardware stack. That position lets its addressable market track multiple adjacent pools: the global humanoid-robot market (about US$10.9B in 2026, forecast toward US$54B by 2031), the warehouse-robotics market (US$7.35B in 2026), the logistics-robots market (US$20.7B in 2026), and China''s broader embodied-intelligence industry, which 36Kr Research Institute sizes above ¥1 trillion in 2026. Demand is powered by directive Chinese industrial policy (the 15th Five-Year Plan elevating embodied intelligence to a national pillar, with MIIT/SASAC deployment mandates), demographic labor shortages, and a supply chain that holds whole-machine cost near half of overseas equivalents. The constraints are equally concrete: MERICS and independent skeptics flag weak precision/dexterity, high unit cost, import-dependent precision components, and revenue quality where only an estimated 3–5% of humanoid sales come from truly productive industrial work. No public source isolates a Psibot-specific SAM or SOM, and 2030 forecasts diverge roughly four-fold, so the market is large and fast-growing but its near-term conversion is unproven.'
sections:
- id: market-boundary
  title: Market Boundary, Substitutes, and Adjacencies
  body: 'Psibot''s market is the embodied-AI "brain" layer: it licenses its Psi-series VLA-plus-reinforcement-learning models, sells a proprietary human-hand data-collection system, and offers simulation and training-data services, rather than manufacturing robot bodies. The included spend is therefore model licenses, data and simulation services, and data-collection hardware; the excluded spend is the robot chassis, actuators, and full-machine assembly that Psibot outsources or that its licensees build themselves. This boundary matters because it decouples Psibot''s addressable market from its own unit shipments: as a platform, its opportunity scales with the whole downstream install base of robots that adopt its intelligence layer, not with how many machines Psibot ships.


    The status-quo substitutes Psibot displaces are fixed programmable automation and AGV/AMR fleets — which are fast but cannot generalize across novel objects without reprogramming — and manual human labor for sorting, picking, and dexterous handling. The bordering adjacent markets are humanoid robots (the primary hardware host for a general-purpose brain), warehouse robotics (the nearest commercial application, in sorting), logistics robots, and industrial robotics more broadly. Because publishers define these pools differently — humanoid robots versus warehouse robotics versus logistics robots versus "embodied intelligence" — their headline totals overlap and are not directly additive, a caveat that governs every sizing lens in the next section.'
