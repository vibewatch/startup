- id: drivers-constraints
  title: Growth Drivers and Adoption Constraints
  body: 'The strongest demand driver is Chinese industrial policy. The 15th Five-Year Plan (2026–2030) elevates embodied intelligence to a national strategic pillar alongside quantum and biomanufacturing, committing state investment, procurement mandates, and MIIT/SASAC deployment targets, with national standards beginning to release in early 2026 and MIIT branding 2025 China''s "first year of humanoid mass production." Demographic pressure — population aging and structural labor shortages — provides durable replacement demand, and supply-chain localization lets Chinese whole-machine costs sit near 50% of comparable overseas products, improving adoption economics. Capital is itself a driver: China embodied-intelligence financing reached ¥33.5B in the first eleven months of 2025 (about four times year-earlier levels), exceeding ¥38B and 305 deals for the full year, and momentum carried into a heavy H1-2026 funding surge.


    The constraints are equally concrete. MERICS assesses that Chinese humanoids still lack precision and dexterity, run costly site-specific trials, must cut costs by at least half, and still lean on US research for VLA breakthroughs. Precision components — high-precision ball screws, gears, and advanced sensors — remain partially import-dependent, a supply and cost risk that policy explicitly targets. High unit costs, reliability limits, and safety and insurance barriers around dexterous manipulation keep most deployments in controlled pilots. Independent analysis is blunter still: it estimates that truly productive industrial revenue is only about 3–5% of humanoid sales, with the rest from research, showrooms, and novelty buyers — a revenue-quality warning that directly qualifies the sector''s headline growth.'
