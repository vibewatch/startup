- id: sizing-gaps
  title: Sizing Gaps and Contradictory Estimates
  body: 'The sizing exercise leaves material gaps that diligence must close. First, no public source isolates a Psibot-specific serviceable available market (SAM) or serviceable obtainable market (SOM); its served market can only be inferred as a licensing-and-data slice of the humanoid, warehouse-robotics, and logistics-robots TAMs, and Psibot discloses no revenue, take-rate, or licensed-unit count to anchor that slice. Second, the headline TAMs are not additive: humanoid robots, warehouse robotics, logistics robots, and "embodied intelligence" are defined differently by different publishers and overlap, so summing them overstates the opportunity.


    Third, forecast dispersion is extreme. Independent analysis notes 2030 humanoid-market forecasts diverge roughly four-fold — from about US$4B to over US$15B — and reads that spread as a marker of speculative heat rather than settled consensus; the same critique holds that reported unicorn valuations across the sector may outrun grounded deployment and revenue. Fourth, warehouse-automation penetration remains low globally, implying large headroom but also unproven near-term conversion. These contradictions are preserved rather than reconciled: the market is unambiguously large and fast-growing, but the specific numbers that would size Psibot''s wallet — SAM, SOM, take-rate, and confirmed customer count — are the open questions that most affect the valuation in later chapters.'
