companyProfile:
  summary: >-
    Psibot (Lingchu Intelligence / 灵初智能) is a Chinese embodied-AI startup founded in 2024 and headquartered in Beijing
    and Shanghai. It develops a Vision-Language-Action (VLA) model platform for dexterous robotic manipulation, with a
    flagship Psi R1 system that has demonstrated L3-level autonomous manipulation (a 30-minute autonomous Mahjong
    session). Rather than building its own robots, Psibot licenses its AI "brain" — the intelligence layer — to robotics
    manufacturers, and aims to build China's largest dexterous-hand dataset as a compounding data flywheel. It has been
    deployed in logistics warehouses for sorting.
