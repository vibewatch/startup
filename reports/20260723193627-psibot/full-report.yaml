      - number: '4.4'
        title: Public Traction Versus Private-Metric Gaps
        blocks:
          - type: paragraph
            body: >-
              The gap between what Psibot has demonstrated and what it has disclosed is the defining feature of its
              financial profile. On the public side there are concrete, if non-financial, signals: a fresh ~US$100
              million round at a US$1.48 billion valuation, roughly US$300 million raised in under two years, marquee
              strategic backers, named commercial pilots in logistics and fibre-optic manufacturing, a rapidly expanding
              technical footprint (Psi R0 through Psi-R2/W0 within about eighteen months, plus open-sourcing the first
              1,000 hours of a stated 100,000-hour data reserve), and a PKU-PsiBot joint lab. On the private side,
              essentially every hard financial metric is missing: no revenue, no ARR, no gross margin, no monthly burn,
              no runway figure, no headcount, no licensed-unit count, and no customer-concentration disclosure.


              This matters because the sector's public data warns against reading demos as demand. Unitree's prospectus
              — the clearest window into embodied-AI economics — shows that even the volume leader books only ~9% of
              humanoid revenue from genuine industrial deployment, with 74% from research and education and 17% from
              commercial "display" use, and that genuine production-line revenue was only about ¥15.7 million (US$2.2
              million) in the first nine months of 2025. A Morgan Stanley buyer survey found just 23% of prospective
              industrial buyers satisfied with current products. Against that backdrop, Psibot's named pilots are
              encouraging but unquantified, and the burden of proof on realized, arm's-length, recurring revenue is
              high. Every private gap in this section is paired with a specific diligence path in the gaps table.
