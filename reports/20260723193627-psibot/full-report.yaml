        title: Exhibits
        blocks:
          - type: callout
            title: Policy is the demand engine
            body: >-
              China's 15th Five-Year Plan makes embodied intelligence a national strategic pillar with state investment,
              procurement mandates, and MIIT/SASAC deployment targets — a directive tailwind that channels SOE budgets
              toward exactly the logistics and manufacturing pilots Psibot targets.
            calloutType: insight
            claimRefs:
              - CM017
              - CM026
          - type: callout
            title: Revenue quality, not TAM, is the constraint
            body: >-
              Independent analysis estimates only ~3–5% of humanoid sales are truly productive industrial revenue, with
              2030 forecasts diverging four-fold; the market's size is not the risk, the quality and timing of
              conversion is.
            calloutType: insight
            claimRefs:
              - CM022
              - CM023
          - type: callout
            title: No Psibot-specific SAM or SOM exists
            body: >-
              Every sizing lens is a market-wide pool. No public source isolates Psibot's take-rate, licensed-unit
              count, or revenue, so its serviceable and obtainable market remain evidence gaps carried into valuation.
            calloutType: insight
