      commercial-proof risks dominate the high-residual quadrant.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Regulatory / data-access (NIL, CSL, DSL)
          values:
            - label: Medium-High
              tone: warning
            - label: High
              tone: negative
            - label: Low
              tone: negative
            - label: High
              tone: negative
        - label: Commercial proof / unverified benchmarks
          values:
            - label: High
              tone: negative
            - label: High
              tone: negative
            - label: Low
              tone: negative
            - label: High
