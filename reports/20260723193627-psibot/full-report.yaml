      - number: '7.6'
        title: Mitigations, Monitoring, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Psibot's strongest mitigants are its backers and its data asset. Marquee strategic investors (Chery, with
              its AiMOGA robotics subsidiary; Lens Technology) and state-linked funds de-risk capital access and
              manufacturing/commercialization channels, and the proprietary manipulation dataset — targeting one million
              hours in 2026 — is a genuine, compounding moat if the model quality it feeds proves out. These mitigants
              are real but partial: they address financing and channel risk far better than they address
              regulatory-access, commercial-proof, or valuation risk, which remain the load-bearing uncertainties.


              For monitoring, the highest-value trigger indicators are: independent third-party verification (or
              disproof) of Psibot's benchmark claims; evidence of paid, arm's-length production deployments versus
              pilots and data-collection units; any change in Nvidia/compute access under US export policy; disclosed
              enforcement or compelled-data-access events under the National Intelligence or Cybersecurity Laws; and
              departure of a key founder or chief scientist. The thesis-break (kill) criteria follow directly: a
              credible failure to verify core benchmarks, a durable loss of frontier compute access, a state-driven
              data-access event that poisons international demand, or a down-round that resets the valuation thesis. The
              mitigation-and-kill-criteria table below pairs each major risk with a monitorable trigger, threshold, and
              action implication, and this chapter's diligence asks — audited financials, named production references, a
              related-party schedule, a component bill of materials, and litigation/enforcement history — are the
              fastest route to resolving the residual uncertainty.
            claimRefs:
              - CR037
              - CR038
              - CR039
              - CR040
          - type: table
            tableRef: TR005
            claimRefs: []
      - number: '7.7'
        title: Exhibits
        blocks:
          - type: callout
            title: National Intelligence Law risk is real but nuanced
            body: >-
              Article 7 obligates cooperation with state intelligence, but independent legal analysis finds it narrower
              than often claimed and lacking a direct enforcement mechanism — while still conceding a Chinese firm
              cannot meaningfully resist a lawful state security request. The residual compelled-access risk is what
              matters to foreign customers.
            calloutType: insight
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: Amended Cybersecurity Law raises the stakes in 2026
            body: >-
              Effective 1 January 2026, the CSL raises fines tenfold to RMB 10 million, integrates AI-governance
              obligations, and broadens extraterritorial reach — directly relevant to Psibot's data-centric model and
              its OEM customers.
            calloutType: insight
            claimRefs:
              - CR003
              - CR005
          - type: callout
            title: A unicorn valuation with no fundamentals
            body: >-
              Psibot discloses no revenue, ARR, margin, burn, or runway, so its $1.48B valuation rests on team, data,
              and backers. If unverified benchmarks disappoint or capital tightens, down-round risk is elevated.
            calloutType: insight
            claimRefs:
              - CR029
              - CR031
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Psibot's investment case rests on positioning, people, and data rather than on any disclosed financial
              performance. The bull thesis is that licensing a Vision-Language-Action "brain" to robotics OEMs targets
              the most defensible and most scalable layer of the embodied-AI stack: if the Psi R1 platform becomes a
              de-facto intelligence standard for Chinese dexterous manipulation, Psibot captures software-like economics
              across many hardware makers without carrying their capital intensity. That thesis is reinforced by an
              unusually credentialed founding team (Peking University's Yaodong Yang, a Stanford / Fei-Fei Li lineage
              via Yuanpei Chen, and Alibaba / Tencent robotics veteran Xiaojie Chai), a stated goal of building China's
              largest dexterous-hand dataset as a compounding data flywheel, and strategic backers (Chery Automobile and
              Lens Technology) who supply both capital and industrial pull. The market context is large: firms
              exhibiting at WAIC 2026 carried an aggregate valuation above US$14.7 billion, and 15 Chinese embodied-AI
              startups crossed unicorn status in the first half of 2026 alone.


              The anti-thesis is equally concrete. Psibot has disclosed no revenue, ARR, gross margin, or headcount; its
              headline capability claims (an L3, 30-minute autonomous Mahjong demonstration) are self-reported and not
              independently benchmarked; industry analysts estimate more than 85% of embodied-AI deployments remain
              non-productive pilots; and the National Intelligence Law and data-security regime cap the international
              demand that a global comparison would otherwise imply. Early traction may also reflect strategic pull from
              related backers rather than arm's-length commercial demand, weakening the revenue-quality signal behind
              the price. In short, the US$1.48 billion valuation is an option on execution, not a multiple on results,
              and the burden of proof sits squarely on the company.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
      - number: '8.2'
        title: Recommendation, Confidence, Risk Rating, and Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              Our recommendation is a conditional Watch: do not lead or price-take at the current US$1.48 billion
              post-money without named production references, audited financial statements, and a related-party revenue
              schedule in hand. The optionality is genuine and the downside is asymmetric at entry price, so discipline
              on terms matters more than conviction on the story. Confidence in this judgment is low-to-medium: the
              public evidence base is thin, dominated by company statements and press coverage of a single financing
              event, with almost no independent, auditable operating data. The overall risk rating is high, driven by
              the absence of commercial proof, unverified capability benchmarks, regulatory and data-access exposure,
              and a sector-wide "elimination year" that analysts expect in 2027-2028 as 18-to-24-month cash runways
              expire.


              Our valuation stance is that US$1.48 billion is stretched relative to disclosed fundamentals — it is
              defensible only by reference to team, the data flywheel, strategic-backer signaling, and the rich
              comparable set of Chinese and global embodied-AI peers, none of which is a substitute for revenue. The
              recommendation logic chains through four gates: Is the platform economically scalable? Is there
              independent proof of capability and commercial traction? Are regulatory and execution risks contained? And
              is the entry price supported? Psibot clears the first, fails the second and (partly) third today, and only
              conditionally clears the fourth — which is why the verdict is a price-disciplined Watch rather than an
              outright pass or buy. The diligence scorecard that follows scores the opportunity strong on market and
              moat but weak on commercial proof, unit economics, risk containment, and evidence quality.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV009
              - CV014
          - type: figure
            figureRef: FV004
