      - number: '7.4'
        title: Partner and Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              Psibot's dependency map has three critical nodes. First, compute: Chinese embodied-AI developers broadly
              rely on Nvidia's Jetson edge modules and Isaac simulation/training tooling, which are exposed to US
              export-control policy — a supply and capability tail-risk that could raise costs or degrade training if
              access tightens. Second, precision mechanical components: industry supply-chain analysis identifies
              foreign suppliers (Schaeffler of Germany, THK and NSK of Japan) as dominant in the special ball screws and
              high-end harmonic reducers that dexterous systems need, a bottleneck China is closing but has not
              eliminated. Third, capital and channel counterparties: Psibot's early demand and financing are
              concentrated in strategic investors (Chery, Lens Technology) and state-linked funds, and its revenue path
              runs through OEM licensees rather than diversified arm's-length customers.


              These dependencies partly offset each other. China controls an estimated 63–70% of the humanoid supply
              chain and is rapidly localizing motors, actuators, batteries, and increasingly reducers, which cushions
              the mechanical-component risk and gives Psibot's licensees cost and logistics advantages. But the compute
              dependency is harder to localize at the frontier, and the concentration of early demand in related parties
              raises the question of whether Psibot's traction is commercial or strategic. Single-country concentration
              in China ties Psibot to domestic policy cycles and state-owned-enterprise adoption while limiting
              international diversification. The dependency register and map below rank each counterparty by
              concentration and residual exposure.
