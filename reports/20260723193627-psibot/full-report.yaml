      - CR001
      - CR031
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      How Psibot's principal risks flow into revenue, customers, margin, financing, and ultimately valuation, which
      absorbs the most exposure given the absence of a revenue anchor.
    data:
      nodes:
        - label: Regulatory / data-access risk
          detail: NIL, amended CSL, DSL/PIPL exposure.
          tone: negative
        - label: Commercial-proof risk
          detail: Unverified benchmarks; pilot-stage reliability.
          tone: negative
        - label: Dependency risk
          detail: Nvidia compute; precision components.
