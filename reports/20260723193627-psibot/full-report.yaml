  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Overview
        blocks:
          - type: paragraph
            body: >-
              Psibot's risks resolve into a clear severity ranking. The highest-severity, hardest-to-mitigate cluster is
              China-specific regulatory and legal exposure — the National Intelligence Law, the amended Cybersecurity
              Law, and the Data Security Law/PIPL cross-border regime — because it is structural (it attaches to
              Psibot's nationality and its data-centric model), it directly caps the reachable international customer
              and investor base, and no amount of company action fully neutralizes it. The second-highest cluster is
              commercial-proof and hype risk: unverified benchmarks, pilot-stage reliability, sector-wide
              over-promising, and a valuation with no revenue anchor. Dependency risk (Nvidia compute, precision
              components) and people/execution risk (key-person concentration, a company founded only in 2024) sit at
              material but partially mitigable levels.


              The transmission mechanism matters for the investment thesis. Regulatory risk transmits into constrained
              international demand and financing optionality; commercial-proof risk transmits into slower
              pilot-to-production conversion and therefore into revenue and, ultimately, valuation; dependency risk
              transmits into cost, gross margin, and supply continuity; people risk transmits into execution and roadmap
              delivery. Because Psibot has no disclosed revenue, every downstream risk lands hardest on valuation, which
              is presently underwritten by team quality, the data flywheel, and strategic backers rather than by
              fundamentals. The heatmap and transmission map that follow rank these exposures by likelihood and residual
              severity and trace how each flows into the financial model.
            claimRefs:
              - CR040
              - CR031
