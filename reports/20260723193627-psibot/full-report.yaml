      - number: '1.3'
        title: Funding History, Investors, and Valuation
        blocks:
          - type: paragraph
            body: >-
              Psibot has compressed a full early-stage capital arc into under two years. It closed an angel round in
              November 2024 led by GL Ventures (Hillhouse) and Lanchi Ventures, with state-backed "national team"
              capital including China Development Bank Capital, Guozhong Capital, and the CCTV Media Convergence
              Industrial Investment Fund. In a joint announcement around 10 March 2026 — deliberately timed to China's
              "Two Sessions" political season — the company disclosed that its combined angel and Pre-A rounds totalled
              2 billion yuan (about US$280 million); the Pre-A was led by Shanghai state-owned Xuhui Capital with
              participation from the Liangxi Sci-Tech Innovation Phase II Mother Fund (managed by Bohua Capital), Xi
              Venture Capital, Pufeng Capital, and Timing Capital, and several existing investors increased their
              stakes.


              On 23 July 2026, Bloomberg reported that Psibot was close to finalizing a further round of nearly US$100
              million at a roughly US$1.48 billion post-money valuation, led by carmaker Chery Automobile with
              precision-glass and sensor maker Lens Technology — a supplier to Apple and Tesla — participating. That
              round, which sources describe as not yet closed, would lift total capital raised since inception to about
              US$300 million and place Psibot among China's newest embodied-AI unicorns. The investor mix is
              strategically dense: state industrial funds early, then automotive and manufacturing-supply-chain capital,
              reflecting a broader Chinese push to move AI into the "real economy." No priced valuation was attached to
              the 2024–early-2026 rounds, and the US$1.48 billion figure rests on Bloomberg reporting rather than a
              company confirmation, so both the round status and the mark should be treated as reported-not-closed
              facts.
