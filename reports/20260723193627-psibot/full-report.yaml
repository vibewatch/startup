  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The Competitive Landscape and Alternatives
        blocks:
          - type: paragraph
            body: >-
              Psibot sits in the embodied-AI intelligence layer, so the relevant competitive set is wider than other
              robot makers. Five classes matter. Direct peers are robot-foundation-model providers that sell or
              open-source a general-purpose "brain": Physical Intelligence (the π0/π0.7 model family) and Nvidia's GR00T
              reference stack. Incumbents and hardware-scale players are the Chinese "big three" — AgiBot (Zhiyuan),
              Unitree, and UBTech — plus vertically integrated Western firms Figure AI and Tesla, all of which build
              brains in-house and ship at scale. Adjacent players include Galaxy General's Galbot, Apptronik, Boston
              Dynamics, 1X, and Agility. Substitutes and the status quo are fixed industrial automation, AGVs/AMRs, and
              human labor, which remain the default for most warehouses on cost and reliability. Finally, internal build
              is a live alternative: an OEM can develop its own control model or adopt Nvidia's open GR00T rather than
              license Psibot.


              This breadth is the crux of Psibot's competitive problem. Because it does not sell a body, it must win
              against both the free/open option (Nvidia GR00T) and the internal option (Tesla, Figure, Unitree, and
              AgiBot all train proprietary brains), while its published rivals in the pure-brain category — Physical
              Intelligence and Nvidia — are far better capitalized. Likely entrants raise the intensity further: OpenAI
              leads a US$6.7B investment in Figure and runs an internal 200-plus-researcher robot foundation-model
              effort (Project Atlas), and Google fields Gemini Robotics. The landscape therefore favors scale and
              capital, and Psibot must differentiate on model capability, dexterity, and proprietary data rather than
              distribution.
