  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition in Customer-Workflow Terms
        blocks:
          - type: paragraph
            body: >-
              Psibot sells intelligence, not iron. Its core product is the Psi-series vision-language-action (VLA) model
              — the "brain" that perceives a scene, interprets a natural-language instruction, and generates dexterous
              robot actions — delivered to third-party robot makers as a licensed intelligence layer rather than as a
              Psibot-branded machine. In practical customer-workflow terms, the software takes a task ("sort these
              parcels", "restock this shelf") plus camera and sensor input and outputs a sequence of grasps, placements,
              and corrections that a robot arm or humanoid executes, targeting warehouse sorting, packaging, restocking,
              and manufacturing handling.


              Psibot operates a "small full-stack" model: it defines robot design parameters — structure, range of
              motion, degrees of freedom — but outsources component production and manufacturing, keeping itself
              asset-light and focused on the model. The most-cited proof point of the product's capability is the Psi R1
              Mahjong demonstration: the robot played Mahjong with humans autonomously for more than thirty minutes in
              an open environment, a long-horizon task blending dexterous tile manipulation with strategic reasoning
              that Psibot uses to define L3-level autonomy. This positions the product as a manipulation "operating
              system" for the logistics and manufacturing floor.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE002
            claimRefs: []
          - type: figure
            figureRef: FE002
            claimRefs:
              - CE002
