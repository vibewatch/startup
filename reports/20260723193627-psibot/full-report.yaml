      A qualitative dependency map; node tone reflects concentration and single-source exposure, with compute and
      regulator nodes marked most severe.
    claimRefs:
      - CR019
      - CR021
      - CR026
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Decision gates leading to the conditional Watch recommendation; Psibot clears scalability, fails the proof gate
      today, only partly clears risk containment, and conditionally clears price support.
    data:
      nodes:
        - label: Is the platform economically scalable?
          detail: Licensing the "brain" targets software-like economics.
          tone: positive
        - label: Independent proof of capability and traction?
          detail: Benchmarks self-reported; no audited commercial proof.
          tone: negative
        - label: Are regulatory and execution risks contained?
          detail: NIL, data regime, and key-person risk only partly mitigated.
          tone: warning
        - label: Is the entry price supported?
          detail: US$1.48B stretched vs fundamentals; comps give optionality only.
          tone: warning
        - label: Conditional Watch — price-disciplined
          detail: Do not lead without named refs and audited financials.
          tone: warning
        - label: Investable only on proofs delivered
          detail: Upgrade path once diligence asks are satisfied.
          tone: neutral
      edges:
        - from: Is the platform economically scalable?
          to: Independent proof of capability and traction?
        - from: Independent proof of capability and traction?
          to: Are regulatory and execution risks contained?
        - from: Are regulatory and execution risks contained?
          to: Is the entry price supported?
        - from: Is the entry price supported?
          to: Conditional Watch — price-disciplined
        - from: Conditional Watch — price-disciplined
          to: Investable only on proofs delivered
    approximationNotes: >-
      The gate assessments are the author's qualitative synthesis of the cited evidence; node tone marks where Psibot
      clears (positive), fails (negative), or partly clears (warning) each gate.
    claimRefs:
      - CV009
      - CV014
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      Implied enterprise value (US$B) across scenarios and reference points; the range spans an order of magnitude
      around the current mark.
    data:
      items:
        - label: Bear (benchmark or regulatory shock)
          value: 0.5
          displayValue: ~US$0.5B
          detail: Down-round or distressed outcome.
          tone: negative
        - label: Current round price
          value: 1.48
          displayValue: US$1.48B
          detail: July 2026 post-money.
          tone: neutral
        - label: Base (slow conversion, stays unicorn)
          value: 2
          displayValue: ~US$2.0B
          detail: Private unicorn band midpoint.
          tone: neutral
        - label: Bull (verified proof, OEM scale)
          value: 5
          displayValue: ~US$5.0B
          detail: Software-peer premium if benchmarks verified.
          tone: positive
        - label: Full-stack comp premium reference
          value: 8
          displayValue: ~US$8.0B
          detail: Upper reference from listed / global full-stack comps.
          tone: warning
    approximationNotes: >-
      Values are indicative scenario midpoints derived from the comparable set and scenario claims, not a
      discounted-cash-flow output; Psibot has no revenue to anchor a precise multiple.
    claimRefs:
      - CV028
      - CV022
      - CV023
      - CV024
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Low-mid-high implied valuation (US$B) by scenario; the bear-to-bull spread underscores how much rests on unproven
      milestones.
    data:
      items:
        - label: Bear case (US$B)
          low: 0.3
          mid: 0.5
          high: 0.7
          displayValue: US$0.3-0.7B
          detail: Benchmark, regulatory, or financing shock.
          tone: negative
        - label: Base case (US$B)
          low: 1.5
          mid: 2
          high: 2.5
          displayValue: US$1.5-2.5B
          detail: Slow conversion; stays a private unicorn.
          tone: neutral
        - label: Bull case (US$B)
          low: 4
          mid: 5
          high: 6
          displayValue: US$4-6B
          detail: Verified proof and scaled OEM licensing.
          tone: positive
    approximationNotes: >-
      Ranges are scenario-based judgment anchored to comparable valuations; they are not probability-weighted and
      exclude tail outcomes beyond the stated bands.
    claimRefs:
      - CV022
      - CV023
      - CV024
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Diligence scorecard (0-10; higher is more favorable); the opportunity scores strong on market and moat but weak on
      proof, unit economics, risk containment, and evidence quality.
    data:
      items:
        - label: Market / TAM
          value: 8 / 10
          detail: Large sector; WAIC firms over US$14.7B.
          tone: positive
          claimRefs:
            - CV004
        - label: Moat / data flywheel
          value: 6 / 10
          detail: Elite team and dataset ambition, but unproven.
          tone: warning
          claimRefs:
            - CV003
        - label: Commercial proof
          value: 3 / 10
          detail: No disclosed revenue; benchmarks unverified.
          tone: negative
          claimRefs:
            - CV005
        - label: Unit economics / financials
          value: 2 / 10
          detail: No revenue, margin, or burn disclosed.
          tone: negative
          claimRefs:
            - CV005
        - label: Risk containment
          value: 3 / 10
          detail: Regulatory, data-access, and execution risk high.
          tone: negative
          claimRefs:
            - CV011
        - label: Valuation attractiveness
          value: 3 / 10
          detail: US$1.48B stretched vs fundamentals.
          tone: negative
          claimRefs:
            - CV012
        - label: Evidence quality
          value: 3 / 10
          detail: Thin public base; single financing event.
          tone: negative
          claimRefs:
            - CV010
    approximationNotes: >-
      Scores are the author's qualitative diligence judgment on a 0-10 scale synthesizing the cited claims, not a
      quantitative model output.
    claimRefs:
      - CV004
      - CV005
      - CV011
      - CV012
