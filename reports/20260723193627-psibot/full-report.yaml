chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Psibot, which trades in Chinese-language sources under the name Lingchu Intelligence (灵初智能), is an
              embodied-artificial-intelligence company founded on 1 September 2024 and operating out of Beijing and
              Shanghai. It describes itself as a leader in China's embodied-AI sector focused on general-purpose
              embodied intelligence, large-scale Vision-Language-Action (VLA) models, and dexterous-manipulation
              algorithms, with the stated mission to "create infinite productivity with AI and robots" and a vision to
              "become a global leader in intelligent robotics." A VLA model takes camera images of a robot's
              surroundings and natural-language instructions as input and outputs low-level motor commands directly,
              collapsing the separate perception, planning, and control pipelines of traditional industrial automation
              and allowing a robot to generalize across novel objects and conditions without task-specific
              reprogramming.


              The commercial thesis is a platform play rather than a hardware race. Psibot licenses its Psi-series model
              — the intelligence "brain" — to third-party robot developers, sells a proprietary human-hand
              data-collection system (Psi-SynEngine exoskeleton gloves), and offers simulation and training-data
              services. Management calls this a "small full-stack": Psibot controls the high-value design elements
              (system architecture, degrees of freedom, motion range, and the model) while outsourcing component
              production and manufacturing to specialist suppliers. The bet is that the most defensible position in
              embodied AI is the software brain and the proprietary data flywheel behind it, not the robot body, so that
              whichever hardware form factor ultimately wins, Psibot's intelligence layer and dexterous-manipulation
              dataset compound in value across the whole industry.
