              - CV012
      - number: '8.3'
        title: Financing Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              Psibot has raised more than US$300 million cumulatively, with a round of roughly US$100 million in July
              2026 led by Chery Automobile and Lens Technology setting the US$1.48 billion post-money valuation; an
              earlier financing of approximately RMB 2 billion (about US$280 million) preceded it. Because the company
              is pre-revenue, that valuation is derived from investor signaling, scarcity of elite embodied-AI teams,
              and strategic pull from industrial backers rather than from unit economics — a basis that public evidence
              can corroborate as a fact of the round but cannot independently validate as fair value.


              Entry discipline therefore dominates. Strategic backers who also stand to consume Psibot's technology set
              the clearing price, so an arm's-length financial investor should expect to pay a premium and should size
              any position against a real probability of one or more future dilutive rounds: sector runways of 18-24
              months imply repeated capital calls before any liquidity event, creating preference-stack overhang.
              Down-round risk is elevated and rising because the imminent public listings of Unitree, DEEP Robotics, and
              Leju are resetting China's robotics valuation methodology away from top-down TAM extrapolation toward
              auditable deliveries, revenue, and profitability — a reset that is structurally unfavorable to a
              pre-revenue platform priced on narrative. We would require audited financials, a named-customer reference
              list, a related-party revenue schedule, and preference-stack disclosure before committing capital at
              anything near the current mark.
            claimRefs:
              - CV002
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
      - number: '8.4'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              The bull case assumes Psibot's capability claims are independently verified, OEM licensing scales across
              multiple hardware partners, and the dexterous-hand data flywheel compounds into a durable moat; under
              those conditions the platform could re-rate toward US$4-6 billion or more, consistent with the premiums
              attached to software-centric global peers. The base case assumes pilots convert only slowly, capability
              remains credible but unproven at scale, and Psibot stays a private unicorn in the roughly US$1.5-2.5
              billion band while consuming additional capital to extend runway. The bear case assumes benchmark
              disappointment, a regulatory or compute-access shock, or a failed raise into a tightening market, forcing
              a down-round or distressed outcome in the US$0.3-0.7 billion range or worse.


              The dominant downside triggers are disproof of the headline benchmarks, loss of access to Nvidia-class
              compute, a data-security or National-Intelligence-Law enforcement event that forecloses international
              demand, and inability to close the next round before runway expires. On the public evidence available
              today the base case is the most defensible central estimate; the bull case requires independent proof that
              does not yet exist, and the sector's expected 2027-2028 consolidation raises the weight on the bear tail.
              Implied value is highly sensitive to the assumed probability of hitting commercial milestones and to the
              revenue multiple the market is willing to apply once auditable metrics exist.
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
          - type: table
            tableRef: TV003
            claimRefs:
              - CV022
              - CV023
              - CV024
          - type: figure
