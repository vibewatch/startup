      - number: '5.2'
        title: Product-Line and Module Map
        blocks:
          - type: paragraph
            body: >-
              Psibot's portfolio is a stack of models plus a data-collection instrument, iterated at remarkable speed.
              The model line runs Psi R0 (30 December 2024, described as the industry's first end-to-end
              reinforcement-learning embodied model), Psi R0.5 (March 2025), the Psibot V1 and H1 hardware reference
              platforms (April 2025), the flagship Psi R1 (May 2025), and the Psi-R2 world-action model with the Psi-W0
              action-conditioned world model (10 April 2026). Beneath the headline models sit two functional sub-models
              — Psi-P0 for planning and Psi-C0 for control, the latter developed by co-founder and RL leader Yuanpei
              Chen.


              The data layer is the Psi-SynEngine: a proprietary acquisition system built on 16-degree-of-freedom
              exoskeleton gloves with sub-millimetre 3D trajectory precision and 3D fingertip tactile and force-feedback
              sensing, used to capture human-hand manipulation at scale. Reporting places Psibot's dexterous robot hand
              at 21 degrees of freedom. Psi-R2 is trained on 95,472 hours of human data spanning 294 scenarios and 4,821
              tasks, and Psibot has open-sourced the first 1,000 hours of a stated 100,000-hour multimodal data reserve.
              The product-line map, then, is model generations layered on top of a bespoke data-capture engine — the
              asset the whole thesis compounds on.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE001
            claimRefs: []
      - number: '5.3'
        title: Technical Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Psi R1's architecture is a hierarchical, end-to-end design that fuses a vision-language-action model with
              reinforcement learning, linking high-level planning to low-level dexterous control in a single trained
              system. The reasoning mechanism Psibot names "Chain of Action Thought" (CoAT) lets the system decompose
              and execute long-horizon tasks in open, dynamic environments — the capability it defines as L3 (autonomous
              reasoning and manipulation), above L1 (basic pick-and-place) and L2 (human-like grips without a cognition
              chain). To connect deliberation and motion, the design uses an "Action Tokenizer" that bridges planning
              and control, and a fast/slow "S1 fast / S2 slow" dual-system brain that separates reactive control from
              deliberative planning.


              The 2026 evolution is the Psi-R2 / Psi-W0 dual-model architecture. Psi-R2 is the world-action model;
              Psi-W0 is an action-conditioned world model enabling counterfactual reasoning and a reinforcement-learning
              "flywheel." Reporting on the dual-model design credits it with cutting inference latency from 2.2 seconds
              to under 100 milliseconds — a step-change for real-time manipulation. The academic instantiation,
              DexGraspVLA, uses a pre-trained vision-language model as high-level planner and a diffusion-based
              low-level controller, iteratively mapping diverse inputs to domain-invariant representations so imitation
              learning generalizes. The stated design goal is an "Impossible Triangle" of high generalization, high
              dexterity, and high success (95% validation, 99.9% scaled-deployment targets), achieved by pre-training on
              abundant human data before fine-tuning on minimal real-robot data — a direct answer to embodied AI's
              data-scarcity problem.
