      - number: '3.4'
        title: Switching Costs, Lock-In, and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              For a brain licensor, switching economics are the central competitive question. Because a robot OEM can
              adopt Nvidia's open GR00T stack, license Physical Intelligence, or build its own control model, switching
              costs away from Psibot are structurally low unless its proprietary dexterous-hand dataset creates genuine
              data lock-in. Multi-homing compounds the pressure: OEMs can integrate several foundation-model providers
              simultaneously and play them against each other on price, which caps any single brain vendor's pricing
              power. The internal-build threat is not hypothetical — Tesla, Figure, Unitree, and AgiBot all train
              proprietary brains, and Nvidia distributes GR00T as an open reference platform, so Psibot's
              licensable-brain thesis competes against both free/open and in-house alternatives at once.


              Distribution power also favors the incumbents. Hardware peers own factory relationships (BMW, BYD, NIO),
              retail channels, and public-market access, while Nvidia is simultaneously the compute supplier and the
              brain competitor for much of the field: many Chinese peers build on Jetson and Isaac, and Nvidia named
              Unitree's H2 Plus body as the hardware foundation for its GR00T Reference Humanoid. Psibot's
              counterweights are its strategic backers' manufacturing and sensor supply chains and its Chinese-market
              access, but these are partner-dependent rather than owned. The net picture is a brain vendor with a
              plausible data-flywheel moat but weak structural lock-in and limited distribution relative to
              better-capitalized, vertically integrated, or open-source rivals.
            claimRefs:
              - CP020
              - CP021
              - CP022
              - CP032
              - CP037
      - number: '3.5'
        title: Moat Durability and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              Psibot's most defensible moat claim is its proprietary human-hand manipulation dataset and data-collection
              engine, with a stated goal of building China's largest dexterous-hand dataset. If dexterous-manipulation
              data is the scarce input for reliable VLA models, an early and compounding data lead could be durable. But
              the durability is unproven and time-limited. Every serious rival is also scaling data: Figure learns from
              in-house real-world video, Physical Intelligence extracts RL Tokens for fast online reinforcement
              learning, and Nvidia generates synthetic data at scale through Isaac simulation. If open or better-funded
              models close the dexterity gap, the brain layer commoditizes and Psibot's licensing thesis erodes.


              The disconfirming evidence is significant. Sector-wide, 2025 humanoid deployments were overwhelmingly
              non-productive — research, education, demonstrations, and guided tours — with genuine industrial revenue
              only a small single-digit share; Unitree's own prospectus shows research and education at 73.6% of
              humanoid revenue and true production-line revenue of only about ¥15.7 million (US$2.2 million) in the
              first nine months of 2025. A Morgan Stanley buyer survey (23% satisfaction) and Unitree's decelerating Q1
              2026 growth suggest supply is outpacing validated demand. Against that backdrop, Psibot's valuation is an
              order of magnitude below Figure (US$39B) and Physical Intelligence (>US$11B) and below Unitree's ~US$6B
              IPO target, so it is neither the capability leader nor the scale leader — its survival case rests on
              data-flywheel lock-in and Chinese-market access that remain to be demonstrated.
