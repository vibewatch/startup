      - number: '4.6'
        title: Financial Verdict — Revenue Quality, Margin Path, and Blockers
        blocks:
          - type: paragraph
            body: >-
              On revenue quality, the verdict is "unproven, not absent." Psibot has a credible, differentiated
              monetization model (licensing plus a monetizable data asset) and named pilots, but zero disclosed realized
              revenue, no evidence of arm's-length recurring contracts, and a real risk that early revenue is pilot- or
              related-party-stage. On the margin path, a software-licensing model should ultimately out-margin hardware
              peers, but with no cost or revenue disclosure the path is unmodellable; the honest reference point is
              Unitree's ~60% hardware gross margin and its simultaneous Q1 2026 profit halving under R&D load, which
              shows how quickly embodied-AI economics can compress even for a profitable leader. On capital intensity,
              Psibot is advantaged — asset-light, no factory capex — but its front-loaded model-and-data cost base
              against an unproven revenue line is the mirror-image risk.


              The diligence blockers are specific and severe. The single largest is the complete absence of
              realized-revenue and contract disclosure: without it, revenue quality, ARR trajectory, and unit economics
              cannot be underwritten at all. The second is the undisclosed cash/burn/runway triad, which turns capital
              adequacy from "probably comfortable" into an assumption. The third is customer concentration and
              related-party exposure, given strategic-investor-linked demand. Until Psibot opens realized financials,
              this remains a team-, data-, and backer-driven bet whose financial statements are, for now, a set of
              well-formed questions rather than numbers. The chapter's figures and gaps table enumerate each blocker and
              the exact evidence that would clear it.
