        - from: Slow pilot-to-production conversion
          to: Financing dependence
        - from: Cost / margin pressure
          to: Financing dependence
        - from: Financing dependence
          to: Valuation (absorbs exposure)
        - from: Slow pilot-to-production conversion
          to: Valuation (absorbs exposure)
    approximationNotes: >-
