      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest demand driver is Chinese industrial policy. The 15th Five-Year Plan (2026–2030) elevates
              embodied intelligence to a national strategic pillar alongside quantum and biomanufacturing, committing
              state investment, procurement mandates, and MIIT/SASAC deployment targets, with national standards
              beginning to release in early 2026 and MIIT branding 2025 China's "first year of humanoid mass
              production." Demographic pressure — population aging and structural labor shortages — provides durable
              replacement demand, and supply-chain localization lets Chinese whole-machine costs sit near 50% of
              comparable overseas products, improving adoption economics. Capital is itself a driver: China
              embodied-intelligence financing reached ¥33.5B in the first eleven months of 2025 (about four times
              year-earlier levels), exceeding ¥38B and 305 deals for the full year, and momentum carried into a heavy
              H1-2026 funding surge.


              The constraints are equally concrete. MERICS assesses that Chinese humanoids still lack precision and
              dexterity, run costly site-specific trials, must cut costs by at least half, and still lean on US research
              for VLA breakthroughs. Precision components — high-precision ball screws, gears, and advanced sensors —
              remain partially import-dependent, a supply and cost risk that policy explicitly targets. High unit costs,
              reliability limits, and safety and insurance barriers around dexterous manipulation keep most deployments
              in controlled pilots. Independent analysis is blunter still: it estimates that truly productive industrial
              revenue is only about 3–5% of humanoid sales, with the rest from research, showrooms, and novelty buyers —
              a revenue-quality warning that directly qualifies the sector's headline growth.
            claimRefs:
              - CM017
              - CM018
              - CM019
              - CM020
              - CM021
              - CM022
              - CM024
              - CM029
              - CM030
              - CM035
          - type: table
            tableRef: TM004
            claimRefs: []
      - number: '2.5'
        title: Sizing Gaps and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >-
              The sizing exercise leaves material gaps that diligence must close. First, no public source isolates a
              Psibot-specific serviceable available market (SAM) or serviceable obtainable market (SOM); its served
              market can only be inferred as a licensing-and-data slice of the humanoid, warehouse-robotics, and
              logistics-robots TAMs, and Psibot discloses no revenue, take-rate, or licensed-unit count to anchor that
              slice. Second, the headline TAMs are not additive: humanoid robots, warehouse robotics, logistics robots,
              and "embodied intelligence" are defined differently by different publishers and overlap, so summing them
              overstates the opportunity.


              Third, forecast dispersion is extreme. Independent analysis notes 2030 humanoid-market forecasts diverge
              roughly four-fold — from about US$4B to over US$15B — and reads that spread as a marker of speculative
              heat rather than settled consensus; the same critique holds that reported unicorn valuations across the
              sector may outrun grounded deployment and revenue. Fourth, warehouse-automation penetration remains low
              globally, implying large headroom but also unproven near-term conversion. These contradictions are
              preserved rather than reconciled: the market is unambiguously large and fast-growing, but the specific
              numbers that would size Psibot's wallet — SAM, SOM, take-rate, and confirmed customer count — are the open
              questions that most affect the valuation in later chapters.
            claimRefs:
              - CM022
              - CM023
              - CM031
              - CM032
              - CM034
              - CM036
              - CM039
