              - CV024
      - number: '8.5'
        title: Comparable Valuations
        blocks:
          - type: paragraph
            body: >-
              Public comparables frame — but do not settle — the debate. On the Chinese side, Unitree's approved STAR
              Market listing implies a market capitalization near RMB 42 billion (about US$5.83 billion), with CCB
              International projecting up to RMB 109 billion (about US$15.1 billion) including brand premium, equivalent
              to a 32x price-to-sales multiple on a company that shipped over 5,500 robots in 2025 and is already
              profitable. DEEP Robotics, roughly one-fifth of Unitree's revenue, carries an even richer implied 41x
              price-to-sales multiple at an approximately RMB 13.9 billion (about US$1.93 billion) issuance valuation.
              Across the broader cohort, at least 25 domestic embodied-intelligence companies now carry valuations above
              RMB 10 billion (about US$1.39 billion), 15 of them minted in the first half of 2026.


              On the global side, Figure AI reached about US$39 billion in 2025, Physical Intelligence was reported in
              talks above US$11 billion, Skild AI has been discussed in a roughly US$8-12 billion range, and Apptronik
              closed near US$5.5 billion. The critical limitation is comparability: most of these peers are pre-revenue
              or forward-multiple priced, and the public-market names are full-stack hardware integrators, whereas
              Psibot is a software / intelligence-layer licensor. That mismatch means the comps justify a large
              addressable optionality but do not support a precise fair value for Psibot's specific business model, and
              the reset toward auditable metrics from the IPO cohort is likely to compress the paper premiums this
              cohort currently enjoys.
            claimRefs:
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
          - type: table
            tableRef: TV004
            claimRefs:
              - CV029
              - CV030
              - CV031
              - CV033
              - CV034
      - number: '8.6'
        title: Exit Paths, Thesis-Break Triggers, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Psibot's plausible exit paths are a domestic STAR Market or Hong Kong listing along the trail Unitree and
              GigaAI are blazing, or a strategic acquisition by an industrial backer such as Chery that already depends
              on the technology. Near-term exit readiness is low: the company is pre-revenue and private and would need
              demonstrable, auditable commercial traction before any public-market window opens to it, especially as
              investors gain three granular listed reference points that reward delivery and profitability.


              The thesis breaks if the headline benchmarks are independently disproven, if licensing fails to scale
              beyond captive strategic partners, if a regulatory or export-control event severs compute or data access,
              or if the company cannot raise before runway expiry. Our final diligence asks, before any capital
              commitment, are: audited financial statements and a revenue-recognition policy; a named, contactable
              customer-reference list distinguishing arm's-length from related-party revenue; a related-party
              transaction schedule covering Chery and Lens; a component bill-of-materials and compute-supply plan given
              export-control exposure; a full cap table with the liquidation-preference stack; and independent
              third-party verification of the L3 manipulation and Mahjong-autonomy claims. On balance the opportunity is
              high-risk and high-optionality; we recommend a conditional pass that becomes investable only once these
              proofs are delivered and price is negotiated with an explicit down-round margin of safety.
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
          - type: table
            tableRef: TV005
            claimRefs:
              - CV025
              - CV039
              - CV027
          - type: table
            tableRef: TV006
            claimRefs:
              - CV038
              - CV013
              - CV019
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Conditional Watch, price-disciplined
            body: >-
              Do not lead at US$1.48B post-money without named production references, audited financials, and a
              related-party revenue schedule. Optionality is real; downside at entry price is asymmetric.
            calloutType: insight
            claimRefs:
              - CV009
              - CV013
          - type: callout
            title: Valuation is an option on execution, not a multiple on results
            body: >-
              No disclosed revenue, ARR, margin, or headcount. The price rests on team, data flywheel, and
              strategic-backer signaling; the imminent Unitree / DEEP / Leju listings reset the sector toward auditable
              metrics.
            calloutType: insight
            claimRefs:
              - CV005
              - CV021
          - type: callout
            title: Comps justify optionality, not a point estimate
            body: >-
              Global (Figure US$39B, Physical Intelligence over US$11B) and Chinese (Unitree 32x, DEEP 41x
              price-to-sales) comps are mostly full-stack or pre-revenue; the platform-licensing model has no clean
              public analog.
            calloutType: insight
            claimRefs:
              - CV031
              - CV035
