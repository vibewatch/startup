  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Streams, and Pricing
        blocks:
          - type: paragraph
            body: >-
              Psibot monetizes intelligence, not hardware. Its own materials describe a "small full-stack" model: it
              controls robot design parameters (structure, range of motion, degrees of freedom) but outsources component
              production and manufacturing, and it earns money by licensing its Psi-series VLA model to third-party
              robot developers, by selling a proprietary human-hand data-collection system (Psi-SynEngine, using 16-DOF
              exoskeleton gloves with sub-millimetre 3D trajectory precision and fingertip tactile sensing), and by
              offering simulation and training-data platforms. A stated commercial objective is to build China's largest
              dexterous-hand dataset and to collect one million hours of manipulation data in 2026, which reframes data
              itself as a monetizable asset. This is an Android-style platform thesis: spread the licensed "brain"
              across many OEM bodies rather than sell a single robot.


              The critical financial caveat is that not one of these streams carries a disclosed price, take-rate,
              licensed-unit count, or recognized-revenue figure. Coverage indicates Psibot began generating some revenue
              through commercial pilots in Chinese logistics and manufacturing by early 2026, but the amounts, contract
              structures, and recognition timing are all private. Where hardware peers publish transparent unit prices —
              UBTech's U1 from ¥119,800, Unitree's G1 from ¥85,000 (~US$12,000) and R1 Air from ¥29,900 (~US$4,300) —
              Psibot's licensing and data-platform pricing is undisclosed, so its revenue cannot be triangulated even
              indirectly. Every monetization line in this chapter is therefore labelled either company-claimed (the
              streams exist) or unavailable (their economics), and each carries a specific diligence request rather than
              an estimated value.
            claimRefs:
