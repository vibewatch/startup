            body: >-
              Operationally, Psibot's central risk is that dexterous manipulation remains unproven at production
              reliability. IDC reports that more than 85% of 2025 humanoid deployments were non-productive, and MERICS
              judges Chinese embodied-AI deployments to be site-specific, dependent on hand-tuning, and too expensive,
              with costs needing to fall by half or more before broad adoption. Because Psibot licenses an intelligence
              layer rather than making robots, real-world quality also depends on how well OEM partners integrate the
              Psi model into their hardware — a coordination surface Psibot only partly controls, since it designs
              structure and motion range but outsources component production and manufacturing.


              Compounding this is a verification gap: Psibot's marquee capability claims — 30-plus minutes of autonomous
              Mahjong play and a training-data cost as low as one-tenth of peers — are company-reported and have not
              been independently benchmarked, and the broader field is criticized for choreographed demos that do not
              translate to reliable, long-duration, wide-variation deployment. Data-quality and dataset-integrity risk
              is real given the model's dependence on human-glove data collection at scale, and Psibot discloses no
              product-safety record, incident history, or liability-insurance coverage. The operational register below
              ranks these failure modes by severity and flags the unresolved safety-and-reliability disclosures.
