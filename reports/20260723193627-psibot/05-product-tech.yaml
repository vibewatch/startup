  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: independent capability benchmarks
    missingEvidence: Independent, third-party verification of Psibot's headline demos (30-minute autonomous Mahjong, 100% tile-flip accuracy, 95%/99.9% success) beyond the peer-reviewed DexGraspVLA grasping result.
    whyItMatters: Without independent benchmarks, the flagship capability claims that anchor the L3-autonomy narrative and the valuation cannot be trusted as more than company demonstrations.
    diligencePath: Request reproducible benchmark protocols, third-party evaluation reports, and standardized manipulation-benchmark scores (e.g., success rate on public dexterous-manipulation suites) audited by an independent lab.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: field reliability and support
    missingEvidence: Field-reliability, uptime, mean-time-between-failure, and support-SLA data for Psi-model deployments in production logistics or manufacturing settings.
    whyItMatters: Fast release cadence does not prove productization; reliability and support data determine whether pilots can scale into dependable commercial deployments.
    diligencePath: Obtain deployment logs, uptime/MTBF metrics, incident reports, and support-SLA terms from named pilot customers, plus references from OEM licensees.
    relatedQuestionRefs:
    - QE017
    relatedTableRefs:
    - TE005
  - type: access-blocked
    severity: material
    topic: safety, security, and compute-dependency resilience
    missingEvidence: Evidence of safety certifications and functional-safety standards, data-security controls over the 100,000-hour human-data reserve, and any plan to reduce Nvidia-compute and foreign-component dependency.
    whyItMatters: Absent safety/security controls and a hard dependency on export-controlled compute and foreign precision parts expose the model-and-data thesis to regulatory and supply-chain shocks.
    diligencePath: Request certification documents, a data-governance and privacy-controls description compliant with China's 2026 Cybersecurity Law, and a compute/component sourcing-and-contingency plan.
    relatedQuestionRefs:
    - QE023
    - QE026
    relatedTableRefs:
    - TE004
tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - User
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Psi R1 (hierarchical VLA + RL model)
    - OEM robot developers (licensed)
    - Released May 2025; flagship
    - L3 autonomy via CoAT; fast/slow brain
    - No independent benchmark beyond DexGraspVLA
  - - Psi-R2 world-action model
    - OEM developers; internal training
    - Released 10 Apr 2026
    - Trained on 95,472 hrs human data; latency <100ms
    - Training-set composition and eval unaudited
  - - Psi-W0 action-conditioned world model
    - Internal RL flywheel
    - Released 10 Apr 2026
    - Counterfactual reasoning for planning
    - No public accuracy or ablation data
  - - Psi-P0 / Psi-C0 sub-models
    - Internal (planning / control)
    - In use; version cadence unclear
    - Modular planning-control split
    - No spec sheet or interface docs public
  - - Psi-SynEngine (16-DOF exoskeleton gloves)
    - Data-collection operators; sold as product
    - In production; core data asset
    - Sub-mm 3D precision + fingertip tactile
    - Unit price, units shipped undisclosed
  - - Dexterous hand (21-DOF)
    - Embodying OEM hardware
    - Reference design; outsourced build
    - High articulation for manipulation
    - Reliability/durability data absent
  - - Psibot V1 / H1 hardware platforms
    - Reference / demo hardware
    - Released Apr 2025
    - Reference bodies for the Psi model
    - Not the commercial focus; specs thin
  notes: Every module is confirmed to exist from company and third-party sources; maturity reflects release status, not verified field performance. Each row pairs the asset with a specific diligence gap.
  enumeration: true
  enumerationScope:
    coverage: exhaustive
    basis: Company product pages, third-party product profiles, and the peer-reviewed research repository, cross-checked against the funding-announcement coverage.
- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Psibot solution
  - Measurable benefit
  - Limitation
  rows:
  - - Warehouse parcel sorting
    - Manual sorting or fixed-function conveyors
    - Psi model drives dexterous pick-place on OEM robot
    - Reported sorting-efficiency gains (unquantified)
    - Single small-scale validation; no throughput data
  - - Manufacturing part handling
    - Human operators / rigid automation
    - VLA-guided manipulation of varied parts
    - Flexibility across SKUs without reprogramming
    - Tested at one fibre-optic maker; scope narrow
  - - Restocking / packaging
