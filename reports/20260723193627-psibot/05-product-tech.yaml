- id: architecture
  title: Technical Architecture and Operating Model
  body: 'Psi R1''s architecture is a hierarchical, end-to-end design that fuses a vision-language-action model with reinforcement learning, linking high-level planning to low-level dexterous control in a single trained system. The reasoning mechanism Psibot names "Chain of Action Thought" (CoAT) lets the system decompose and execute long-horizon tasks in open, dynamic environments — the capability it defines as L3 (autonomous reasoning and manipulation), above L1 (basic pick-and-place) and L2 (human-like grips without a cognition chain). To connect deliberation and motion, the design uses an "Action Tokenizer" that bridges planning and control, and a fast/slow "S1 fast / S2 slow" dual-system brain that separates reactive control from deliberative planning.


    The 2026 evolution is the Psi-R2 / Psi-W0 dual-model architecture. Psi-R2 is the world-action model; Psi-W0 is an action-conditioned world model enabling counterfactual reasoning and a reinforcement-learning "flywheel." Reporting on the dual-model design credits it with cutting inference latency from 2.2 seconds to under 100 milliseconds — a step-change for real-time manipulation. The academic instantiation, DexGraspVLA, uses a pre-trained vision-language model as high-level planner and a diffusion-based low-level controller, iteratively mapping diverse inputs to domain-invariant representations so imitation learning generalizes. The stated design goal is an "Impossible Triangle" of high generalization, high dexterity, and high success (95% validation, 99.9% scaled-deployment targets), achieved by pre-training on abundant human data before fine-tuning on minimal real-robot data — a direct answer to embodied AI''s data-scarcity problem.'
