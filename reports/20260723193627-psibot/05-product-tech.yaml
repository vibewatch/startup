- id: differentiation-ip
  title: Differentiation, IP, and Critical Dependencies
  body: 'Psibot''s differentiation rests on a data flywheel rather than on a single unique algorithm. The thesis is "Android for robots": collect proprietary, low-cost human-hand manipulation data through the exoskeleton-glove Psi-SynEngine — claimed at roughly one-tenth the cost of traditional teleoperation — and feed it into a VLA model licensed across many OEM bodies, so each deployment enriches the dataset that improves the model. The published IP footprint is real and externally visible: the DexGraspVLA framework (open-sourced code and dataset), a VLA survey and paper list ("Awesome-VLA-Papers"), and Psi SynHand models released through the Psi-Robot GitHub organization, alongside the founders'' academic pedigree (Yaodong Yang, Yuanpei Chen).


    The differentiation must, however, be read against strong comparators and hard dependencies. Global labs such as Physical Intelligence pursue similar hierarchical VLA approaches, and open baselines like OpenVLA (a 7B model that outperformed the 55B closed RT-2-X) show the paradigm is not proprietary — Psibot''s edge is its data and dexterity focus, not a unique architecture. The critical dependencies are external: Nvidia compute (Jetson edge modules and Isaac simulation), shared across Chinese peers and exposed to US export controls; precision components (special ball screws ~90% supplied by Schaeffler in Germany and THK/NSK in Japan) that any embodying hardware needs; and the PKU joint lab and strategic backers for research and manufacturing pull. These dependencies are mapped explicitly because they, more than the algorithm, bound Psibot''s room to manoeuvre.'
