- id: deployment-roadmap
  title: Deployment, Integration, Reliability, and Roadmap
  body: 'Psibot''s deployment model follows directly from its licensing thesis: rather than shipping a finished robot, it licenses the Psi model to robot OEMs and sells the Psi-SynEngine data system plus simulation and training-data services, integrating its brain into partner hardware. The public deployment evidence is specific but thin — a small-scale warehouse sorting validation at a large Chinese logistics client (reporting efficiency gains) and testing at one of the world''s largest fibre-optic cable makers. Research and validation are anchored by the PKU-PsiBot Joint Lab for Embodied Dexterous Manipulation, which produces Psibot''s published work.


    On reliability and support, the picture is a gap: five model generations plus hardware in roughly eighteen months is an unusually fast cadence, but no independent field-reliability, uptime, mean-time-between-failure, or support-SLA data is public, so productization maturity cannot be verified from outside. The stated 2026 operating goals are to build China''s largest dexterous-hand dataset and to collect one million hours of manipulation data during the year. The roadmap trajectory, read from the Psi-R2/W0 release, points toward scaling the data reserve and the RL flywheel — deepening the model and its training data rather than pivoting to proprietary hardware — consistent with the asset-light, platform-licensor strategy.'
