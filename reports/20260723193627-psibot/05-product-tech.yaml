- id: trust-safety
  title: Trust, Safety, Compliance, and Quality Controls
  body: 'The trust picture is defined by a sharp split between verified research and unverified productization. On capability, Psibot''s headline metrics — 30-plus-minute autonomous Mahjong, 100% tile-flip accuracy, and the 95%/99.9% "Impossible Triangle" success figures — are company-reported and not independently benchmarked; the only externally verifiable capability evidence is the peer-reviewed DexGraspVLA result (AAAI 2026 Oral, 90%+ zero-shot grasping). Independent analysts temper the story: MERICS assesses that Chinese humanoids broadly lack precision and dexterity, rely on site-specific trials, remain too expensive, and still look to US research for VLA breakthroughs — a direct check on the maturity claims.


    On safety, security, and quality controls, there is a documented gap: no public evidence shows Psibot safety certifications, functional-safety standards, or data-privacy and security controls governing its data-collection and model-licensing operations. This matters acutely because Psibot is amassing a 100,000-plus-hour reserve of human-manipulation data under China''s tightening regime — the Cybersecurity Law amendments effective 1 January 2026 carry penalties up to RMB 10 million with extraterritorial reach, and the data-security framework applies squarely to large behavioural datasets. The quality verdict is therefore uneven: research maturity is high (peer-reviewed work, fast cadence, a latency step-change), while productization maturity — field reliability, certifications, disclosed benchmarks, and compute-supply resilience — is weak, unverified, or dependency-bound. Each weakness is paired with a specific diligence request rather than a claimed number.'
