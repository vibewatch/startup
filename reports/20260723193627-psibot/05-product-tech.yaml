- id: product-line-map
  title: Product-Line and Module Map
  body: 'Psibot''s portfolio is a stack of models plus a data-collection instrument, iterated at remarkable speed. The model line runs Psi R0 (30 December 2024, described as the industry''s first end-to-end reinforcement-learning embodied model), Psi R0.5 (March 2025), the Psibot V1 and H1 hardware reference platforms (April 2025), the flagship Psi R1 (May 2025), and the Psi-R2 world-action model with the Psi-W0 action-conditioned world model (10 April 2026). Beneath the headline models sit two functional sub-models — Psi-P0 for planning and Psi-C0 for control, the latter developed by co-founder and RL leader Yuanpei Chen.


    The data layer is the Psi-SynEngine: a proprietary acquisition system built on 16-degree-of-freedom exoskeleton gloves with sub-millimetre 3D trajectory precision and 3D fingertip tactile and force-feedback sensing, used to capture human-hand manipulation at scale. Reporting places Psibot''s dexterous robot hand at 21 degrees of freedom. Psi-R2 is trained on 95,472 hours of human data spanning 294 scenarios and 4,821 tasks, and Psibot has open-sourced the first 1,000 hours of a stated 100,000-hour multimodal data reserve. The product-line map, then, is model generations layered on top of a bespoke data-capture engine — the asset the whole thesis compounds on.'
