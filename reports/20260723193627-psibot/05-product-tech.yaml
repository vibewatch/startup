chapter:
  number: 5
  title: Product & Technology
  summary: 'Psibot''s product is not a robot but a robot "brain": the Psi-series vision-language-action (VLA) model, sold as an intelligence layer that third-party OEM hardware embodies. In customer-workflow terms the software turns a natural-language task plus camera input into dexterous, multi-step manipulation for jobs such as warehouse sorting, packaging, and restocking. The product line advanced unusually fast — Psi R0 (30 Dec 2024, an industry-first end-to-end RL embodied model), R0.5 (Mar 2025), the Psibot V1/H1 hardware reference platforms (Apr 2025), the flagship Psi R1 (May 2025), and the Psi-R2 world-action model plus Psi-W0 action-conditioned world model (10 Apr 2026) — supported by sub-models Psi-P0 (planning) and Psi-C0 (control) and the proprietary Psi-SynEngine 16-DOF exoskeleton-glove data-collection system. Architecturally, Psi R1 is a hierarchical VLA-plus-RL design using a "Chain of Action Thought" (CoAT) reasoning layer, an Action Tokenizer bridging planning and control, and a fast/slow (S1/S2) dual-system brain; Psibot claims this delivers L3 autonomous manipulation, evidenced by a 30-plus-minute autonomous Mahjong demo. The single externally verifiable capability is peer-reviewed: DexGraspVLA from the PKU-PsiBot Joint Lab (AAAI 2026 Oral) reports 90%+ zero-shot dexterous grasping across thousands of unseen cluttered scenes. The core differentiation is a data flywheel — low-cost human-hand data (claimed ~1/10 the cost of teleoperation) feeding a model licensed across many bodies — targeting China''s largest dexterous-hand dataset and one million hours of data in 2026. The technology verdict is uneven: research and demo capability is strong (peer-reviewed, fast cadence, dual-model latency cut from 2.2s to <100ms), but productization signals — independent field-reliability, uptime, safety certifications, and disclosed benchmarks — are weak or absent, and the stack depends on Nvidia compute (Jetson/Isaac) and foreign precision components (Schaeffler/THK/NSK), with the 100,000-hour human-data reserve raising data-security questions under China''s 2026 Cybersecurity Law amendments.'
sections:
- id: product-definition
  title: Product Definition in Customer-Workflow Terms
  body: 'Psibot sells intelligence, not iron. Its core product is the Psi-series vision-language-action (VLA) model — the "brain" that perceives a scene, interprets a natural-language instruction, and generates dexterous robot actions — delivered to third-party robot makers as a licensed intelligence layer rather than as a Psibot-branded machine. In practical customer-workflow terms, the software takes a task ("sort these parcels", "restock this shelf") plus camera and sensor input and outputs a sequence of grasps, placements, and corrections that a robot arm or humanoid executes, targeting warehouse sorting, packaging, restocking, and manufacturing handling.


    Psibot operates a "small full-stack" model: it defines robot design parameters — structure, range of motion, degrees of freedom — but outsources component production and manufacturing, keeping itself asset-light and focused on the model. The most-cited proof point of the product''s capability is the Psi R1 Mahjong demonstration: the robot played Mahjong with humans autonomously for more than thirty minutes in an open environment, a long-horizon task blending dexterous tile manipulation with strategic reasoning that Psibot uses to define L3-level autonomy. This positions the product as a manipulation "operating system" for the logistics and manufacturing floor.'
