  evidenceGaps:
  - type: missing-source
    severity: material
    topic: data-flywheel moat durability
    missingEvidence: Independent verification of the size, uniqueness, and defensibility of Psibot's dexterous-hand dataset versus rivals' data programs.
    whyItMatters: The data flywheel is Psibot's only differentiated moat; if it is not genuinely scarce, the brain layer commoditizes and the licensing thesis fails.
    diligencePath: Obtain dataset metrics (hours, task diversity, unique manipulations), licensing terms, and a benchmark against π0.7, Helix, and GR00T.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: Psibot pricing and licensing model
    missingEvidence: Any disclosed Psibot licensing price, take-rate, or contract model to benchmark against peers' published unit prices and leasing rates.
    whyItMatters: Without pricing, Psibot's revenue potential and competitiveness against transparent hardware pricing cannot be assessed.
    diligencePath: Request licensing agreements, per-unit or per-deployment economics, and the data-platform price list.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: shipment and deployment scale confirmation
    missingEvidence: Independent confirmation of Psibot's deployed or licensed unit volumes to compare against peers' disclosed shipment counts.
    whyItMatters: Peers disclose 10,000-plus units; Psibot discloses none, so its competitive scale is unverifiable and its valuation lacks a volume anchor.
    diligencePath: Obtain licensed-unit counts by OEM, deployed pilots by customer, and third-party validation of any deployment claims.
    relatedQuestionRefs:
    - QP027
    relatedTableRefs:
    - TP001
