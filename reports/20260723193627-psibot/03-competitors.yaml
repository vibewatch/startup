callouts:
- id: callout-brain-vs-body
  type: insight
  title: The brain-versus-body bet
  body: The central competitive question is whether value accrues to the AI brain (Psibot, Physical Intelligence, Nvidia) or the integrated body (Tesla, Figure, Unitree, AgiBot). As of 2026 capital flows to both, but revenue overwhelmingly favors the hardware players who also build brains in-house.
  claimRefs:
  - CP040
  - CP022
- id: callout-low-switching
  type: risk
  title: Low switching costs threaten the licensing thesis
  body: OEMs can adopt Nvidia's open GR00T, license Physical Intelligence, or build in-house, so Psibot's licensable-brain model has weak structural lock-in unless its dexterous-hand dataset proves genuinely scarce and hard to replicate.
  claimRefs:
  - CP020
  - CP025
- id: callout-scale-gap
  type: caveat
  title: A capability challenger, not a scale leader
  body: Psibot's ~US$1.48B valuation and undisclosed shipments place it well below Figure, Physical Intelligence, and Unitree; its case rests on model capability, dexterity, and data rather than manufacturing or distribution scale.
  claimRefs:
  - CP030
  - CP015
