company:
  name: Psibot
chapter:
  number: 3
  title: Competitors
  summary: 'Psibot competes for the embodied-AI "brain" against three overlapping cohorts and two default alternatives. The Chinese hardware-scale leaders — AgiBot (10,000th unit in March 2026, BYD-backed), Unitree (STAR Market IPO approved June 2026 at a ~US$6.2B target, 11,000+ H1 units, ~60% gross margin), and UBTech (13,361 U1 orders on launch day) — dominate roughly 80–90% of global humanoid shipments and build their own AI brains in-house. The US robot-foundation-model labs — Physical Intelligence (π0.7, reportedly raising ~US$1B at >US$11B) and Nvidia GR00T (an open reference stack that made Unitree its hardware base) — attack the same brain layer Psibot licenses. Vertically integrated players — Figure AI (US$39B valuation, in-house Helix, OpenAI-backed) and Tesla Optimus (~1,000 units at Giga Texas) — bundle brain and body. Psibot''s ~US$1.48B valuation makes it a mid-tier challenger differentiated by a "small full-stack" licensing model and a proprietary dexterous-hand dataset, not by manufacturing scale. The competitive risks are acute: its VLA fast/slow architecture is echoed by every major rival, switching costs for OEMs are low against open (GR00T) and internal builds, and sector-wide demand evidence is weak — a Morgan Stanley survey found only 23% of prospective industrial buyers satisfied, and Unitree''s own prospectus shows just ~9% of humanoid revenue from industrial use.'
sections:
- id: competitive-landscape
  title: The Competitive Landscape and Alternatives
  body: 'Psibot sits in the embodied-AI intelligence layer, so the relevant competitive set is wider than other robot makers. Five classes matter. Direct peers are robot-foundation-model providers that sell or open-source a general-purpose "brain": Physical Intelligence (the π0/π0.7 model family) and Nvidia''s GR00T reference stack. Incumbents and hardware-scale players are the Chinese "big three" — AgiBot (Zhiyuan), Unitree, and UBTech — plus vertically integrated Western firms Figure AI and Tesla, all of which build brains in-house and ship at scale. Adjacent players include Galaxy General''s Galbot, Apptronik, Boston Dynamics, 1X, and Agility. Substitutes and the status quo are fixed industrial automation, AGVs/AMRs, and human labor, which remain the default for most warehouses on cost and reliability. Finally, internal build is a live alternative: an OEM can develop its own control model or adopt Nvidia''s open GR00T rather than license Psibot.


    This breadth is the crux of Psibot''s competitive problem. Because it does not sell a body, it must win against both the free/open option (Nvidia GR00T) and the internal option (Tesla, Figure, Unitree, and AgiBot all train proprietary brains), while its published rivals in the pure-brain category — Physical Intelligence and Nvidia — are far better capitalized. Likely entrants raise the intensity further: OpenAI leads a US$6.7B investment in Figure and runs an internal 200-plus-researcher robot foundation-model effort (Project Atlas), and Google fields Gemini Robotics. The landscape therefore favors scale and capital, and Psibot must differentiate on model capability, dexterity, and proprietary data rather than distribution.'
