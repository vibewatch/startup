- id: capability-pricing-comparison
  title: Capability, Pricing, and Go-to-Market Comparison
  body: 'On capability, Psibot competes on model quality and dexterity rather than unit output. Its hierarchical fast/slow VLA-plus-reinforcement-learning architecture and dexterous-manipulation benchmarks (a 30-plus-minute autonomous Mahjong demonstration) are its calling card, but the same fast/slow, VLA-first approach is echoed by Physical Intelligence (π0 to Hi Robot), Figure (Helix), Google Gemini Robotics, and Nvidia GR00T, so the core technical approach is not unique. On raw scale it trails AgiBot, Unitree, and UBTech by orders of magnitude — thousands to more than ten thousand units versus Psibot''s undisclosed pilot volumes.


    On pricing and go-to-market the contrast is sharp. Hardware peers publish unit prices and leasing terms — UBTech''s U1 from ¥119,800, Unitree''s G1 around US$16,000, AgiBot models from roughly US$5,000, plus robot-as-a-service leasing — and reach buyers through factory pilots at BMW, BYD, and NIO, retail experience stores, and public listings that supply both distribution and capital. Psibot''s model-licensing and data-platform pricing is undisclosed, and as a private brain-licensor it lacks the distribution and balance-sheet reach of a listed or bundled competitor. Its offsetting advantages are strategic-backer supply and sensor access via Chery and Lens Technology, and a proprietary human-hand manipulation dataset. On trust and regulatory posture, analysts flag that Chinese humanoid makers carry structural legal risks that filings do not disclose, and a Morgan Stanley buyer survey found only 23% of prospective industrial buyers satisfied with current products — a demand-side caution that applies across the field.'
