- id: competitor-profiles
  title: Competitor Profiles — Scale, Funding, and Direction
  body: 'The Chinese hardware leaders define the scale benchmark. AgiBot, founded in 2023 and BYD-backed, produced its 10,000th humanoid on 30 March 2026, accelerating from 5,000 to 10,000 units in about three months, and shipped roughly 5,168 units in 2025 (ranked first globally by Omdia). Unitree cleared its STAR Market listing-committee review on 1 June 2026 in a record 73 days, targeting an approximately US$6.2 billion valuation while raising about ¥4.2 billion (~US$583 million); its 2025 revenue reached ¥1.699 billion (~US$240 million) at about 60% gross margin, with humanoids already more than half of revenue, and its H1 model surpassed 11,000 cumulative units. UBTech opened orders for its full-size UWORLD U1 line on 30 June 2026 and passed 13,361 cumulative orders on day one, priced from ¥119,800, after shipping 1,079 full-size units for ¥821 million of humanoid revenue in 2025.


    The pure-brain and Western full-stack players define the capital and capability benchmark. Physical Intelligence, founded in 2024, builds general-purpose robot foundation models (π0, π0.7 with an RL Token and Multi-Scale Embodied Memory for tasks longer than ten minutes) and is reportedly raising about US$1 billion at a valuation north of US$11 billion, up from US$5.6 billion four months earlier, backed by Founders Fund, Lightspeed, Jeff Bezos, and Nvidia. Figure AI, founded in 2022, raised a Series C in September 2025 at a US$39 billion valuation (about US$1.9 billion raised in total), runs its in-house Helix brain, is ramping Figure 03, and is backed by an OpenAI-led US$6.7 billion investment. Tesla had deployed about 1,000 Optimus Gen 3 units at Giga Texas by June 2026, targeting 5,000 internally by year-end. Against all of these, Psibot''s ~US$1.48 billion valuation and undisclosed shipment volumes mark it as a mid-tier, capability-and-data challenger rather than a scale leader.'
