- id: switching-lockin-distribution
  title: Switching Costs, Lock-In, and Distribution Power
  body: 'For a brain licensor, switching economics are the central competitive question. Because a robot OEM can adopt Nvidia''s open GR00T stack, license Physical Intelligence, or build its own control model, switching costs away from Psibot are structurally low unless its proprietary dexterous-hand dataset creates genuine data lock-in. Multi-homing compounds the pressure: OEMs can integrate several foundation-model providers simultaneously and play them against each other on price, which caps any single brain vendor''s pricing power. The internal-build threat is not hypothetical — Tesla, Figure, Unitree, and AgiBot all train proprietary brains, and Nvidia distributes GR00T as an open reference platform, so Psibot''s licensable-brain thesis competes against both free/open and in-house alternatives at once.


    Distribution power also favors the incumbents. Hardware peers own factory relationships (BMW, BYD, NIO), retail channels, and public-market access, while Nvidia is simultaneously the compute supplier and the brain competitor for much of the field: many Chinese peers build on Jetson and Isaac, and Nvidia named Unitree''s H2 Plus body as the hardware foundation for its GR00T Reference Humanoid. Psibot''s counterweights are its strategic backers'' manufacturing and sensor supply chains and its Chinese-market access, but these are partner-dependent rather than owned. The net picture is a brain vendor with a plausible data-flywheel moat but weak structural lock-in and limited distribution relative to better-capitalized, vertically integrated, or open-source rivals.'
