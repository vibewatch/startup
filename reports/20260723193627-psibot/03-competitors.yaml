- id: moat-durability
  title: Moat Durability and Displacement Risk
  body: 'Psibot''s most defensible moat claim is its proprietary human-hand manipulation dataset and data-collection engine, with a stated goal of building China''s largest dexterous-hand dataset. If dexterous-manipulation data is the scarce input for reliable VLA models, an early and compounding data lead could be durable. But the durability is unproven and time-limited. Every serious rival is also scaling data: Figure learns from in-house real-world video, Physical Intelligence extracts RL Tokens for fast online reinforcement learning, and Nvidia generates synthetic data at scale through Isaac simulation. If open or better-funded models close the dexterity gap, the brain layer commoditizes and Psibot''s licensing thesis erodes.


    The disconfirming evidence is significant. Sector-wide, 2025 humanoid deployments were overwhelmingly non-productive — research, education, demonstrations, and guided tours — with genuine industrial revenue only a small single-digit share; Unitree''s own prospectus shows research and education at 73.6% of humanoid revenue and true production-line revenue of only about ¥15.7 million (US$2.2 million) in the first nine months of 2025. A Morgan Stanley buyer survey (23% satisfaction) and Unitree''s decelerating Q1 2026 growth suggest supply is outpacing validated demand. Against that backdrop, Psibot''s valuation is an order of magnitude below Figure (US$39B) and Physical Intelligence (>US$11B) and below Unitree''s ~US$6B IPO target, so it is neither the capability leader nor the scale leader — its survival case rests on data-flywheel lock-in and Chinese-market access that remain to be demonstrated.'
