summary:
  headline: >-
    Psibot pairs an elite embodied-AI team, a platform-licensing model, and marquee strategic backers with a $1.48B
    unicorn price — but with no disclosed revenue, self-reported benchmarks, and China-specific regulatory exposure, the
    valuation is an option on execution that diligence must underwrite before committing at the current mark.
