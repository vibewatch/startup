  topStrengths:
    - >-
      Platform-licensing model targets the most scalable and defensible layer of the embodied-AI stack, with potential
      software-like economics across many OEMs.
    - >-
      Unusually credentialed founding team spanning Peking University, a Stanford / Fei-Fei Li lineage, and Alibaba /
      Tencent robotics experience.
    - >-
      Marquee strategic backers (Chery Automobile, Lens Technology) supply both capital and industrial pull, de-risking
      financing and manufacturing.
    - >-
      Ambition to build China's largest dexterous-hand dataset as a compounding data flywheel and a demonstrated L3
      manipulation capability (30-minute autonomous Mahjong).
    - >-
      Large and fast-scaling market: WAIC 2026 embodied-AI firms carried an aggregate valuation above US$14.7B and 15
      Chinese unicorns were minted in H1 2026.
  topRisks:
    - >-
      No disclosed revenue, ARR, gross margin, burn, runway, or headcount, so the US$1.48B valuation rests on team,
      data, and backers rather than fundamentals.
    - >-
      Headline capability benchmarks are self-reported and not independently verified, while analysts estimate over 85%
      of embodied-AI deployments remain non-productive pilots.
    - >-
      China-specific regulatory and data-access exposure (National Intelligence Law, amended Cybersecurity Law, Data
      Security Law / PIPL) caps international demand and financing optionality.
    - >-
      Dependency on Nvidia-class compute and precision components exposed to US export controls, plus down-round risk as
      imminent Unitree / DEEP / Leju listings reset valuations toward auditable metrics.
    - >-
      Sector-wide "elimination year" expected in 2027-2028 as 18-24-month runways expire, and early traction may reflect
      strategic-backer pull rather than arm's-length demand.
  unresolvedGaps:
    - >-
      Audited financials — revenue, ARR, gross margin, burn, and runway — plus committed versus deployed capital from
      the latest round.
    - Full cap table and liquidation-preference stack to quantify dilution and downside protection.
    - Independent third-party verification of the L3 manipulation and 30-minute autonomous Mahjong claims.
    - >-
      A named, contactable customer-reference list distinguishing arm's-length from related-party (Chery / Lens)
      revenue.
    - >-
      Litigation, enforcement, and licensing history under Chinese AI, data, and cybersecurity law, and a component
      bill-of-materials / compute-supply plan given export-control exposure.
