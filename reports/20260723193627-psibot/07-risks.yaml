    statement: Psibot's net residual risk is elevated — regulatory-access, commercial-proof, and valuation risks remain load-bearing and only partly mitigated by strong backing — making these the primary uncertainties diligence must resolve.
    type: inferred
    topic: residual-risk
    sourceRefs:
    - SR014
    - SR015
    - SR021
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR001
    - QR030
  evidenceGaps:
  - type: access-blocked
    severity: material
    topic: litigation, enforcement, and regulatory-compliance history
    missingEvidence: Any disclosed litigation, regulatory enforcement action, IP dispute, data-access request, or the specific licenses and approvals Psibot holds under Chinese AI, data, and cybersecurity law.
    whyItMatters: Without enforcement and litigation history, the practical (versus theoretical) severity of Psibot's regulatory exposure cannot be assessed, and compelled-data-access risk to foreign customers stays unquantified.
    diligencePath: Request a litigation and regulatory-enforcement schedule, records of any state data-access requests (to the extent disclosable), and the full set of licenses/approvals held, from Psibot and Chinese counsel.
    relatedQuestionRefs:
    - QR013
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: financials, burn, and runway
    missingEvidence: Revenue, ARR, gross margin, operating burn, cash balance, and runway for Psibot, plus committed versus deployed capital from the latest round.
    whyItMatters: Financial opacity means a $1.48B valuation cannot be tied to fundamentals, and down-round or dilution risk cannot be sized without burn and runway.
    diligencePath: Obtain audited or management financials (revenue, margin, burn), cash balance, and a runway/next-raise projection under the current capital-intensive R&D plan.
    relatedQuestionRefs:
    - QR021
  - type: private-evidence-only
    severity: moderate
    topic: component bill of materials and supplier identity
    missingEvidence: The specific compute, actuator, reducer, and sensor suppliers in Psibot's reference designs and its OEM partners' robots, versus the sector-level dependency picture.
    whyItMatters: Sector-level dependency (Nvidia, Schaeffler/THK/NSK) is documented, but Psibot's own bill of materials is needed to size its true supply-continuity and export-control exposure.
    diligencePath: Request a component bill of materials and supplier list for Psibot's reference platform and key licensees, with single-source and export-controlled parts flagged.
    relatedQuestionRefs:
    - QR022
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: moderate
    topic: product-safety, incident, and liability-insurance record
    missingEvidence: Product-safety certifications, incident/recall history, and product-liability insurance coverage for Psibot's deployed manipulation systems.
    whyItMatters: Dexterous manipulation near workers carries safety and liability exposure; without an incident record and insurance, operational and legal tail-risk is unquantified.
    diligencePath: Request safety certifications, an incident/recall log, and product-liability insurance certificates covering deployed and licensed systems.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR002
