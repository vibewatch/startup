- id: financial-people
  title: Financial, Model, and People/Execution Risk
  body: 'Financially, the dominant risk is opacity: Psibot discloses no revenue, ARR, gross margin, burn rate, or runway, so its roughly $1.48B valuation is underwritten by team quality, the data flywheel, and marquee backers rather than by fundamentals. Embodied-AI R&D is highly capital-intensive — peers spend hundreds of millions to over a billion annually — so Psibot''s roughly $300 million raised to date implies a finite runway and likely repeated future raises, exposing it to down-round or dilution risk if benchmarks disappoint or capital markets tighten. Valuation risk is amplified by sector froth: a Morgan Stanley survey found only 23% of prospective industrial buyers satisfied with current humanoid products even as forecasts were doubled, and roughly 22 embodied-AI unicorns were minted in 2026 — a classic bubble signal that raises the odds of multiple compression.


    People and execution risk is concentrated. Psibot''s credibility rests on a small group — CEO Viktor Wang and a cluster of academic leaders (Yaodong Yang at Peking University, Yuanpei Chen from the Stanford/Fei-Fei Li orbit, Ying Wen at SJTU) — so departure of any key figure would damage both capability and narrative, and the market for embodied-AI talent is fiercely competitive. As a company founded only in 2024, Psibot also carries the ordinary execution risk of a very young organization scaling hardware, data operations, and OEM relationships simultaneously. The people/execution register below ranks these by severity and sets diligence paths.'
