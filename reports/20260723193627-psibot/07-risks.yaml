- id: regulatory-legal
  title: Regulatory and Legal Risk
  body: 'Regulatory and legal exposure is Psibot''s defining risk. As a Chinese company, it falls under the National Intelligence Law (2017), whose Article 7 states that "all organizations and citizens shall support, assist, and cooperate with national intelligence efforts in accordance with law." Independent legal analysis (China Law Translate) tempers the alarmist reading: the obligation sits in the law''s general provisions, mirrors cooperation duties in other Chinese statutes, and carries no dedicated enforcement mechanism — yet the same analysis concludes that a Chinese citizen or company could not meaningfully resist a direct state security request and that courts cannot be relied on for a remedy. For a firm whose entire value is a proprietary manipulation dataset, that residual compelled-access risk is material to any foreign customer or investor, and a US Department of Homeland Security business advisory formalizes the Western regulatory view that data handled by Chinese firms carries this exposure.


    The exposure is amplified by an active 2026 regulatory agenda. The amended Cybersecurity Law took effect on 1 January 2026, raising the general administrative-fine cap tenfold from RMB 1 million to RMB 10 million, expressly integrating AI ethics, risk-monitoring and safety-oversight obligations, and broadening extraterritorial reach to any overseas activity that "endangers China''s cybersecurity." That sits atop the Data Security Law and PIPL, which impose data classification and a cross-border-transfer regime (CAC security assessment, standard contractual clauses, or certification) — directly relevant because Psibot''s model depends on accumulating and moving large volumes of manipulation data. Layered on top is external geopolitical exposure: US export-control scrutiny and foreign-listing/procurement restrictions (the same "spy law" concerns that dogged peer Unitree) constrain Psibot''s ability to sell or raise abroad. Psibot discloses no litigation, enforcement actions, IP disputes, or the specific licenses it must hold, leaving a diligence gap the register below tracks.'
