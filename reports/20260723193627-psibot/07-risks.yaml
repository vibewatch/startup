- id: mitigations-kill-criteria
  title: Mitigations, Monitoring, and Kill Criteria
  body: 'Psibot''s strongest mitigants are its backers and its data asset. Marquee strategic investors (Chery, with its AiMOGA robotics subsidiary; Lens Technology) and state-linked funds de-risk capital access and manufacturing/commercialization channels, and the proprietary manipulation dataset — targeting one million hours in 2026 — is a genuine, compounding moat if the model quality it feeds proves out. These mitigants are real but partial: they address financing and channel risk far better than they address regulatory-access, commercial-proof, or valuation risk, which remain the load-bearing uncertainties.


    For monitoring, the highest-value trigger indicators are: independent third-party verification (or disproof) of Psibot''s benchmark claims; evidence of paid, arm''s-length production deployments versus pilots and data-collection units; any change in Nvidia/compute access under US export policy; disclosed enforcement or compelled-data-access events under the National Intelligence or Cybersecurity Laws; and departure of a key founder or chief scientist. The thesis-break (kill) criteria follow directly: a credible failure to verify core benchmarks, a durable loss of frontier compute access, a state-driven data-access event that poisons international demand, or a down-round that resets the valuation thesis. The mitigation-and-kill-criteria table below pairs each major risk with a monitorable trigger, threshold, and action implication, and this chapter''s diligence asks — audited financials, named production references, a related-party schedule, a component bill of materials, and litigation/enforcement history — are the fastest route to resolving the residual uncertainty.'
  claimRefs:
