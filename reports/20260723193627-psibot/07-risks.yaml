chapter:
  number: 7
  title: Risks
  summary: 'Psibot''s risk profile is dominated by two clusters that a diligence reader must weigh against its strong strategic backing: (1) China-specific regulatory/legal exposure and (2) commercial-proof and hype exposure common to the whole embodied-AI cohort. On regulation, Psibot as a Chinese company sits under the National Intelligence Law (2017), whose Article 7 obligates organizations to support and cooperate with national intelligence work; independent legal analysis argues the provision is narrower and less novel than often portrayed and lacks a direct enforcement mechanism, but also concedes that a Chinese company could not meaningfully resist a lawful state security request and that courts offer no reliable remedy — a material, if hard-to-quantify, risk for any foreign customer or investor handling data through Psibot. That exposure is compounded by the amended Cybersecurity Law effective 1 January 2026, which raises administrative fines tenfold (to RMB 10 million), integrates AI-governance/ethics obligations, and broadens extraterritorial reach, layered on top of the Data Security Law and PIPL cross-border-transfer regime — all acutely relevant because Psibot''s entire moat is a proprietary data flywheel (targeting one million hours of manipulation data in 2026). A US Department of Homeland Security business advisory formalizes the Western view that data handled by Chinese firms carries compelled-access risk, which — together with US export-control and foreign-listing scrutiny — caps international customer reach. On the operational/commercial side, more than 85% of 2025 humanoid deployments were non-productive (IDC), MERICS judges Chinese embodied-AI deployments site-specific and too expensive, Psibot''s headline benchmarks (30-minute autonomous Mahjong, one-tenth data cost) are company-reported and not independently verified, and the sector shows classic bubble signals (a Morgan Stanley survey found only 23% of prospective industrial buyers satisfied; roughly 22 embodied-AI unicorns minted in 2026). Dependency risk runs through Nvidia (Jetson compute / Isaac tooling, exposed to US export policy) and precision components (Schaeffler, THK, NSK supply roughly 90% of the special ball screws), partly offset by China''s 63–70% control of the humanoid supply chain. Financially, Psibot discloses no revenue, ARR, margin, burn, or runway, so a $1.48B valuation rests on team, data, and strategic backers rather than fundamentals, creating down-round risk if benchmarks disappoint or capital tightens. Key-person dependence on a small group of founders and academics, and its founding only in 2024, add execution risk. Net residual risk is elevated; the strongest mitigants are marquee strategic/state-linked backers that de-risk capital and manufacturing, but they do not resolve the regulatory-access, commercial-proof, or valuation questions, which are the thesis-break triggers diligence must monitor.'
sections:
- id: risk-overview
  title: Severity-Ranked Risk Overview
  body: 'Psibot''s risks resolve into a clear severity ranking. The highest-severity, hardest-to-mitigate cluster is China-specific regulatory and legal exposure — the National Intelligence Law, the amended Cybersecurity Law, and the Data Security Law/PIPL cross-border regime — because it is structural (it attaches to Psibot''s nationality and its data-centric model), it directly caps the reachable international customer and investor base, and no amount of company action fully neutralizes it. The second-highest cluster is commercial-proof and hype risk: unverified benchmarks, pilot-stage reliability, sector-wide over-promising, and a valuation with no revenue anchor. Dependency risk (Nvidia compute, precision components) and people/execution risk (key-person concentration, a company founded only in 2024) sit at material but partially mitigable levels.


    The transmission mechanism matters for the investment thesis. Regulatory risk transmits into constrained international demand and financing optionality; commercial-proof risk transmits into slower pilot-to-production conversion and therefore into revenue and, ultimately, valuation; dependency risk transmits into cost, gross margin, and supply continuity; people risk transmits into execution and roadmap delivery. Because Psibot has no disclosed revenue, every downstream risk lands hardest on valuation, which is presently underwritten by team quality, the data flywheel, and strategic backers rather than by fundamentals. The heatmap and transmission map that follow rank these exposures by likelihood and residual severity and trace how each flows into the financial model.'
