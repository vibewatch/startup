companyProfile:
  summary: Psibot (Lingchu Intelligence / 灵初智能) is a Chinese embodied-AI startup founded in 2024 and headquartered in Beijing and Shanghai. It develops a Vision-Language-Action (VLA) model platform for dexterous robotic manipulation, with a flagship Psi R1 system that has demonstrated L3-level autonomous manipulation (a 30-minute autonomous Mahjong session). Rather than building its own robots, Psibot licenses its AI "brain" — the intelligence layer — to robotics manufacturers, and aims to build China's largest dexterous-hand dataset as a compounding data flywheel. It has been deployed in logistics warehouses for sorting.
  foundedDate: '2024-01-01'
  founders:
    - name: Viktor Wang
      role: Co-founder, CEO
      background: Chief executive leading Psibot's platform-licensing strategy and commercial partnerships.
      claimRefs: []
    - name: Xiaojie Chai
      role: Co-founder
      background: Robotics veteran with experience across Alibaba and Tencent robotics efforts.
      claimRefs: []
    - name: Yaodong Yang
      role: Co-founder
      background: Peking University researcher contributing embodied-AI and reinforcement-learning expertise.
      claimRefs: []
    - name: Yuanpei Chen
      role: Co-founder
      background: Researcher with a Stanford / Fei-Fei Li lab lineage focused on dexterous manipulation.
      claimRefs: []
  foundingLocation: Beijing and Shanghai, China
  headquarters: Beijing and Shanghai, China
  productSummary: Psibot's product is a VLA model platform (Psi R1) for dexterous manipulation, paired with a data-generation and simulation pipeline, licensed to robotics OEMs as the intelligence layer of their hardware. The strategy targets software-like economics across many hardware partners without carrying hardware capital intensity.
  customerFocus: Robotics manufacturers and OEMs adopting Psibot's model and data tools, with early deployment in logistics-warehouse sorting and manufacturing automation.
  businessModel: Platform / intelligence-layer licensing — Psibot licenses its VLA "brain" and sells data and simulation services to hardware makers rather than selling robots directly.
  stage: Series B / Unicorn
  fundingStatus: More than US$300M raised to date, including a roughly US$100M round in July 2026 led by Chery Automobile and Lens Technology at a US$1.48B post-money valuation, preceded by an approximately RMB 2 billion (about US$280M) financing. Public sources disclose no revenue, ARR, margin, burn, runway, headcount, or preference stack.
