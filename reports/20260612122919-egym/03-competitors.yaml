  - id: TP004
    title: Moat Durability / Competitive Risk Register
    columns:
      - Moat Claim
      - Threat
      - Severity
      - Evidence / Signal
      - Mitigation / Diligence Ask
    rows:
      - - Hardware-embedded switching cost (EGYM equipment in gym floor)
        - Technogym or Life Fitness offers subsidized replacement circuits on contract expiry
        - High
        - "7–10 year equipment cycles; keedia.com analysis notes 15–30% price increase risk post-merger for gym operators on renewal"
        - Validate EGYM's average remaining contract term length and churn rate at renewal; assess renewal pricing strategy
      - - Data network effect (7B workout data points, 410M assessments)
        - Technogym's Google AI partnership closes AI training gap without equivalent hardware install base
        - Medium
        - "Technogym Google partnership announced Q1 2026; Mywellness ecosystem covering 100K+ centers"
        - Monitor Technogym AI parity timeline; assess whether EGYM's proprietary data remains differentiated or becomes commoditized
      - - Wellpass employer network depth (24,000+ employers in DACH/Europe)
        - Wellhub+USC offers comparable or superior European gym access after $600M acquisition
        - High
        - "Wellhub USC deal Feb 2025; combined 39,000 corporate clients across 18 countries including strong European presence"
        - Obtain EGYM Wellpass net retention by geography; assess DACH employer renewal rates post-USC integration
      - - Playlist merger cross-sell (ClassPass + Mindbody + Wellpass)
        - Integration complexity delays cross-sell realization; gym operators face pricing power concern
        - Medium
        - "keedia.com analysis (2026): facilities warned to audit vendor dependency and negotiate data portability now; Wellhub CFO cites 30–50% employee engagement rates as countervailing stickiness argument"
        - Track Playlist integration milestones and first cross-sell revenue cohort results in H2 2026
      - - EGYM Wellpass user experience / NPS
        - Persistent low ratings enable Wellhub churn or new-logo competitive win
        - Medium
        - "EGYM Wellpass Trustpilot ~2.9–3.0 stars (as of mid-2026); complaints on studio availability, pricing transparency, Plus1 restrictions"
        - Request NPS trends and employer churn rate; assess product roadmap for end-user experience improvements
      - - Employer multi-homing risk
        - Employers run Wellhub alongside Wellpass or switch entirely on contract renewal
        - Medium
        - "Wellhub pricing promotional offers (50% off for new clients) create incentive to dual-source"
        - Assess exclusivity terms in EGYM employer contracts; measure multi-homing rate in key accounts
      - - Commoditization of physical equipment layer
        - AI training logic moves into software; gym operators accept lower-cost OEM hardware
        - Low-medium (5-year horizon)
        - "Tonal and Vitruvian expanding into commercial settings; AI coaching becoming standard"
        - Monitor commercial gym capex behavior and OEM pricing trends for circuit training equipment
    notes: >-
      Severity ratings (High/Medium/Low) are analyst judgments based on evidence strength and competitive
      timeline. "High" denotes a risk with evidence of active competitive response within 12 months;
      "Medium" denotes risk within 12–36 months or with partial evidence; "Low-medium" denotes structural
      risk beyond 3 years. Evidence citations are qualitative; no proprietary renewal data is available.
