callouts:
  - calloutType: risk
    title: Wellhub + Urban Sports Club Creates a Head-to-Head European Threat
    body: >-
      Wellhub's $600M acquisition of Urban Sports Club in 2025 gives it the deepest European gym partner
      network outside EGYM, directly challenging Wellpass's home-market advantage in Germany, Austria, and
      Benelux. With 39,000 corporate clients and 97,000 wellness partners post-merger, Wellhub now offers
      a comparable breadth pitch to large European employers at renewal. EGYM's differentiated response
      must rest on the hardware-data-network flywheel that Wellhub cannot replicate without a major
      equipment acquisition.
    claimRefs:
      - CP002
      - CP003
      - CP009
      - CP024

  - calloutType: risk
    title: EGYM Wellpass Adverse User Reviews Represent a Churn-Risk Signal
    body: >-
      EGYM Wellpass holds a Trustpilot rating of approximately 2.9–3.0 stars across English and German
      reviews as of mid-2026. Recurring complaints center on studio network gaps versus Urban Sports Club,
      pricing transparency, and restrictive Plus1 guest policies. These are product-addressable issues,
      but if left unresolved, they create churn-risk at employer contract renewals where HR buyers can
      compare engagement rates directly. This is an adverse, confirming signal for a diligence focus on
      Wellpass NPS and employer-side renewal rates.
    claimRefs:
      - CP025
      - CP028

  - calloutType: strength
    title: Post-Playlist Full-Stack Position Is Structurally Unique
    body: >-
      No single competitor in 2026 combines proprietary connected gym hardware, AI training personalization
      at scale, a 24,000-employer wellness network, a consumer booking app covering 88,000+ venues, and
      club management SaaS serving 40,000+ businesses. This full-stack position creates multiple revenue
      streams, cross-sell leverage, and a data flywheel that reinforces switching costs across every layer
      of the fitness industry. The nearest competitor, Wellhub, has breadth but no hardware; Technogym has
      hardware but no employer network or consumer booking layer.
    claimRefs:
      - CP004
      - CP005
      - CP006
      - CP021

  - calloutType: insight
    title: Technogym's Google AI Partnership Signals Long-Term Convergence Risk
    body: >-
      Technogym announced a partnership with Google in Q1 2026 to expand AI capabilities within its
      Mywellness ecosystem. If Technogym can match EGYM Genius's training personalization quality by
      leveraging Google's AI infrastructure rather than building a proprietary data moat, the hardware
      differentiation layer of EGYM's moat narrows. This risk is 3–5 years out given Technogym's current
      lack of employer network depth, but warrants monitoring as a potential convergence trajectory.
    claimRefs:
      - CP013
      - CP017
      - CP029

