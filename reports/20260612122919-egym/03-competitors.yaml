chapter:
  number: 3
  title: Competitors
  summary: >-
    EGYM's competitive position has been structurally transformed by two landmark 2025–2026 events: its own
    $7.5B merger with Playlist (Mindbody, ClassPass, Booker) and rival Wellhub's $600M acquisition of Urban
    Sports Club. On the corporate wellness aggregator side, EGYM Wellpass now competes head-to-head with a
    much-enlarged Wellhub (39,000 corporate clients, $4.2B valuation, $319M ARR), while on the connected
    gym equipment side, publicly-listed Technogym (€1.02B 2025 revenue) remains the principal incumbent
    across premium hardware. EGYM's integrated hardware-software-data stack creates durable switching costs
    for gym operators, but the post-merger pricing power concern, 2.9-star Trustpilot ratings for Wellpass,
    and Technogym's growing AI ecosystem represent material displacement risks that merit ongoing monitoring.

sections:
  - id: section-landscape
    title: Competitive Landscape — Direct Peers, Incumbents, Adjacents, and Substitutes
    body: >-
      EGYM operates across two structurally distinct competitive arenas that must be assessed separately:
      (1) connected gym equipment and AI training software sold to fitness operators, and (2) employer-sponsored
      corporate wellness subscriptions through EGYM Wellpass. These markets attract different competitor sets
      and have very different switching-cost profiles.


      In the corporate wellness aggregator segment, Wellhub (formerly Gympass) is the principal direct
      competitor. After acquiring Urban Sports Club in a $600M deal in 2025, Wellhub now operates in 18
      countries, serves 39,000 corporate clients, and connects five million employee subscribers to 97,000
      wellness partners. This acquisition combined Wellhub's Latin American and North American strength with
      Urban Sports Club's European depth, directly challenging EGYM Wellpass's home-market advantage in
      Germany and the DACH region. FitOn Health, having acquired the Peerfit corporate gym-access network,
      also competes in the US employer market, albeit at substantially smaller scale ($12M ARR, 13,000 employers).
      Benefits platforms such as Benify (total rewards and employee benefits) and Benefitfocus (benefits
      administration) represent adjacent competitors that bundle fitness access as one of many employee perks
      rather than as a dedicated network.


      In the connected gym equipment and AI training segment, Technogym (TGYM.MI, publicly listed) is the
      primary incumbent challenger. With €1.02B in 2025 revenue (+13% YoY), 100,000+ wellness centers
      globally, and a newly launched AI Ecosystem in partnership with Google, Technogym is aggressively
      expanding its digital and software capabilities. Life Fitness / Hammer Strength (independent) and
      Matrix (Johnson Health Tech) compete on commercial equipment price-to-performance ratios with some
      digital connectivity, but without Technogym's or EGYM's depth in AI training personalization.


      Status-quo and substitute alternatives include: for employers, cash wellness allowances or single-gym
      corporate memberships (no network overhead); for gym operators, analog circuit training equipment from
      any tier-1 OEM, non-EGYM club management software (Jonas, Perfect Gym), or an internal digital
      build-out project. The internal-build substitute is real but rare; most mid-size gym operators lack
      the engineering resources to replicate EGYM's training-data pipeline. Likely future entrants include
      AI-driven home fitness platforms (Tonal, Vitruvian) expanding into commercial settings, and large
      health insurers building or acquiring gym-access benefits networks to compete directly in the
      employer-funded wellness channel.
