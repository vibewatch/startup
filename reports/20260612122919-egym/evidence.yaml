evidenceGaps:
  - type: missing-source
    severity: material
    topic: founders
    missingEvidence: >-
      No primary EGYM-issued document reviewed (egym.com, official announcements, press releases) publicly names a
      co-founder other than Philipp Roesch-Schlanderer by name; third-party synthesis sources cite "Florian Sauter" but
      no fetched primary source corroborates this.
    whyItMatters: >-
      Co-founder identity and equity splits are material for governance diligence, understanding founder dilution at
      each round, and assessing key-person risk beyond Roesch-Schlanderer.
    diligencePath: >-
      Request EGYM's shareholder register, cap table, and founding documents from Playlist IR post-merger; review any
      German Handelsregister filings for eGym GmbH to identify registered founders.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: >-
      EGYM has not published a verified employee count in any primary document reviewed; estimates of 700–880 are
      derived from secondary aggregators and CEO references at Series G. Post-merger headcount attribution for the EGYM
      subsidiary vs. Playlist is not publicly disclosed.
    whyItMatters: >-
      Headcount is a key organizational capacity indicator; without it, per-employee productivity and the depth of
      engineering, sales, and operational teams cannot be independently assessed.
    diligencePath: >-
      Request current employee roster breakdown by function from Playlist/EGYM management; review LinkedIn headcount
      trends and any Handelsregister or employment disclosure filings.
    relatedQuestionRefs:
      - QO011
  - type: missing-source
    severity: minor
    topic: competitive-positioning
    missingEvidence: >-
      No independent competitive analysis quantifying EGYM's relative market share versus Tonal, OxeFit, Vitruvian, or
      other connected strength equipment players was identified in reviewed sources; comparison data relies on secondary
      market commentary.
    whyItMatters: >-
      Without a structured competitor comparison, it is difficult to assess whether EGYM's valuation multiple reflects
      sustainable competitive advantage or is vulnerable to erosion by well-funded alternatives.
    diligencePath: >-
      Commission primary market research on connected gym equipment installation base; review HFA and IHRSA industry
      reports for equipment market share data.
    relatedQuestionRefs:
      - QO022
  - type: private-evidence-only
    severity: material
    topic: data-privacy
    missingEvidence: >-
      EGYM's data processing agreements, GDPR compliance posture, data retention policies, and any regulatory inquiries
      related to biometric data collection from 7.5M+ monthly active exercisers are not publicly disclosed.
    whyItMatters: >-
      EGYM handles sensitive biometric and health-adjacent data at scale across multiple EU jurisdictions; a data
      incident or GDPR enforcement action would be materially adverse and is not addressable from public sources.
    diligencePath: >-
      Request EGYM's GDPR Data Protection Impact Assessments, DPA agreements with employers and facility partners, and
      any correspondence with German or EU data protection authorities (CNIL, ICO, BfDI).
