      disclosed; the investor map (TO003) provides round-level participation but no ownership stakes.
    whyItMatters: >-
      Investor ownership concentration, information rights, and any governance protections from early-stage investors
      are material to understanding control dynamics in the combined Playlist entity.
    diligencePath: >-
      Request the full cap table and shareholder agreements from Playlist IR; review any investor rights agreements
      filed with German or US authorities.
    relatedTableRefs:
