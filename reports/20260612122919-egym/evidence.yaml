    severity: minor
    topic: insurer-payer-channel
    missingEvidence: >-
      No confirmed health insurer or occupational health partnership with EGYM has been identified in reviewed public
      sources. EGYM's narrative around prevention-to-healthcare bridges implies insurer partnerships are strategic
      intent, but no contractual evidence (AOK, TK, Barmer, or equivalent) was found.
