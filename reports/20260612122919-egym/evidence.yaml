  - type: enumeration-incomplete
    severity: minor
    topic: vertical-integration-market-dynamics
    missingEvidence: >-
      No independent market analysis has been identified that quantifies whether EGYM's vertically integrated
      hardware-software-network model materially accelerates or inhibits market penetration relative to single-product
      competitors (Wellhub, Technogym, Mindbody). The mechanism is analytically plausible but unvalidated by comparative
      win/loss or market share data.
    whyItMatters: >-
      The vertical integration thesis is central to EGYM's enterprise value and merger rationale. If it primarily
      creates switching costs (lock-in) rather than faster market penetration (compounding), the valuation multiple and
      TAM conversion timeline would require reassessment.
    diligencePath: >-
      Request EGYM win/loss analysis comparing deals where EGYM competed against single-product solutions vs. integrated
      platforms; obtain EGYM customer case studies quantifying both adoption velocity and switching cost evidence;
      compare average contract values at vertically integrated accounts vs. equipment-only or Wellpass-only accounts.
