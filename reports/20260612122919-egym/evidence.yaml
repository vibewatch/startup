    severity: material
    topic: German-market-saturation
    missingEvidence: >-
      No primary research has been identified that quantifies competitive density or market saturation in the German
      corporate wellness benefit market specifically. The existence of Wellhub (now with Urban Sports Club), EGYM
      Wellpass, Machtfit, and other providers in the same market suggests increasing competitive pressure, but market
      share or employer churn data is not publicly available.
    whyItMatters: >-
      Germany is EGYM Wellpass's oldest and likely largest revenue market. If saturation is occurring, growth
      projections must be restated toward international expansion rather than domestic deepening, altering the valuation
      calculus.
    diligencePath: >-
      Commission primary market research on German HR benefit buyer intentions and competitive landscape; request EGYM
      Wellpass new employer win rate vs. Wellhub in Germany specifically; review any Bundesministerium für Gesundheit
