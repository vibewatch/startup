    severity: material
    topic: EGYM-SAM-SOM-sizing
    missingEvidence: >-
      No independent analyst firm has published a market size for the fitness-as-a-benefit network sub-segment that EGYM
      Wellpass occupies, nor has EGYM disclosed audited ARR, NRR, or employer churn figures that would allow independent
