  - id: section-growth-drivers
    title: Growth Drivers and Adoption Constraints
    body: >-
      The primary growth drivers for EGYM's market position are structural and reinforcing. Talent competition
      is intensifying in Germany and across Europe: Wellhub's 2026 survey of 5,000+ employees across nine
      countries found that 93% of workers consider well-being as important as salary when evaluating a job offer,
      up from 83% in 2022. Employees with access to employer wellness benefits are 4.5 times less likely to
      report intent to quit within 12 months—a retention signal that directly translates into HR budget
      justification. The shift in healthcare spending toward prevention rather than treatment is backed by
      insurers and governments: EuropeActive notes that GLP-1 medication adoption is bringing new cohorts into
      exercise, creating additional membership demand for gym operators.


      However, the market faces material adoption constraints that limit the pace of penetration. Academic
      evidence on wellness program ROI is contested: MIT Sloan's corporate wellness evidence review states that
      "rigorous evidence on what works remains surprisingly limited — and often contradicts widely cited claims,"
      and a 2024 Harvard Business Review analysis found that despite global corporate wellness spending set to top
      $94.6 billion by 2026, "anticipated improvements in well-being are not being realized." Wellhub's own
      2026 survey found a 36-point gap: 67% of employees say their company offers wellness benefits but only 31%
      say those benefits actually meet their needs. These contradictory signals create budget-holder skepticism
      that EGYM must overcome through demonstrated outcomes data.


      Regulatory constraints are primarily GDPR-driven: EGYM's collection of biometric and workout data at scale
      across 7.5 million+ monthly active exercisers in multiple EU jurisdictions creates ongoing compliance
      obligations and potential data protection authority scrutiny. Switching costs cut both ways—they protect
      EGYM's installed base from churn but slow new adoption when incumbents are entrenched. HR benefit programs
      have 12–24 month procurement cycles in large enterprises; gym equipment refreshes have 7–10 year windows.
      Capital intensity in the Technology segment limits adoption velocity in cost-constrained gym operators,
      particularly independent studios and emerging market operators. These constraints together suggest that
      EGYM's near-term growth will remain concentrated in existing geographies and enterprise segments.
