  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: EGYM-SAM-SOM-sizing
      missingEvidence: >-
        No independent analyst firm has published a market size for the fitness-as-a-benefit network sub-segment
        that EGYM Wellpass occupies, nor has EGYM disclosed audited ARR, NRR, or employer churn figures that
        would allow independent SAM/SOM construction. The CEO's $500M 2025 revenue projection was company-stated
        at Series G close (September 2024) and has not been independently verified post-merger.
      whyItMatters: >-
        Without a credible, independently verified SAM/SOM, EGYM's $7.5B combined enterprise valuation cannot
        be evaluated against a market penetration multiple or compared rigorously to Wellhub's valuation.
      diligencePath: >-
        Request audited 2025 standalone EGYM financials from Playlist IR; request Wellpass-specific ARR, NRR,
        employer churn, and average contract value; commission independent sizing of fitness-as-a-benefit
        network spend in Germany, France, UK, and US.
      relatedQuestionRefs:
        - QM002
      relatedTableRefs:
        - TM002

    - type: missing-source
      severity: material
      topic: German-market-saturation
      missingEvidence: >-
        No primary research has been identified that quantifies competitive density or market saturation in the
        German corporate wellness benefit market specifically. The existence of Wellhub (now with Urban Sports
        Club), EGYM Wellpass, Machtfit, and other providers in the same market suggests increasing competitive
        pressure, but market share or employer churn data is not publicly available.
      whyItMatters: >-
        Germany is EGYM Wellpass's oldest and likely largest revenue market. If saturation is occurring, growth
        projections must be restated toward international expansion rather than domestic deepening, altering
        the valuation calculus.
      diligencePath: >-
        Commission primary market research on German HR benefit buyer intentions and competitive landscape; request
        EGYM Wellpass new employer win rate vs. Wellhub in Germany specifically; review any Bundesministerium für
        Gesundheit statistics on corporate wellness adoption rates.
      relatedQuestionRefs:
        - QM026
      relatedTableRefs:
        - TM004

    - type: enumeration-incomplete
      severity: minor
      topic: vertical-integration-market-dynamics
      missingEvidence: >-
        No independent market analysis has been identified that quantifies whether EGYM's vertically integrated
        hardware-software-network model materially accelerates or inhibits market penetration relative to
        single-product competitors (Wellhub, Technogym, Mindbody). The mechanism is analytically plausible but
        unvalidated by comparative win/loss or market share data.
      whyItMatters: >-
        The vertical integration thesis is central to EGYM's enterprise value and merger rationale. If it
        primarily creates switching costs (lock-in) rather than faster market penetration (compounding), the
        valuation multiple and TAM conversion timeline would require reassessment.
      diligencePath: >-
        Request EGYM win/loss analysis comparing deals where EGYM competed against single-product solutions
        vs. integrated platforms; obtain EGYM customer case studies quantifying both adoption velocity and
        switching cost evidence; compare average contract values at vertically integrated accounts vs.
        equipment-only or Wellpass-only accounts.
      relatedQuestionRefs:
        - QM023

    - type: enumeration-incomplete
      severity: minor
      topic: insurer-payer-channel
      missingEvidence: >-
        No confirmed health insurer or occupational health partnership with EGYM has been identified in reviewed
        public sources. EGYM's narrative around prevention-to-healthcare bridges implies insurer partnerships are
        strategic intent, but no contractual evidence (AOK, TK, Barmer, or equivalent) was found.
      whyItMatters: >-
        If insurer reimbursement becomes a payer channel for EGYM Wellpass, it would expand the SAM significantly
