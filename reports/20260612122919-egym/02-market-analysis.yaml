  - id: section-buyer-segmentation
    title: Buyer, User, and Payer Segmentation
    body: >-
      EGYM's B2B2C model involves distinct buyer, user, and payer roles across its two product lines, requiring
      separate segmentation logic. For EGYM Wellpass, the primary buyer is the employer HR manager or Head of
      Benefits (typically in companies with 50–10,000 employees), who controls the HR budget line for employee
      wellness benefits. The payer structure is a co-payment split: employers typically bear €40–45/employee/month
      while employees contribute €25–30/employee/month in Germany, yielding a blended ~€70/month total per
      enrolled employee. A one-time activation fee of approximately €44/employee is standard. This pricing is
      confirmed by German public sector procurement documents (Biberach, Knoll GmbH) reviewed for this chapter.


      For EGYM Technology, the buyer is the gym operator's purchasing manager or owner-operator, with purchasing
      decisions driven by competitive differentiation, member experience, and equipment refresh cycles (typically
      every 7–10 years). CapEx intensity creates a distinct adoption friction: a full EGYM strength circuit
      installation is a multi-hundred-thousand-euro commitment with 5–7 year payback horizons. This is
      categorically different from the Wellpass SaaS subscription model and makes the Technology segment slower
      to penetrate and more capital-constrained.


      Key buyer segments by size and type: large enterprises (1,000+ employees) adopt fitness benefits as talent
      strategy and prefer managed, measurable programs; SME employers (50–999 employees) are more price-sensitive
      and adoption is often triggered by HR benchmarking surveys or competitor benefit offerings; public sector
      employers adopt through procurement processes with longer cycles and price caps. Gym operators segment by
      type: large chains (e.g., EoS Fitness, RSG Group) gain differentiation value from branded connected
      circuits; independent operators face budget constraints but use EGYM to compete against chains. Wellness
      network operators (health insurers, occupational health providers) represent an emerging payer channel as
      prevention-focused insurance models expand.
