company:
  name: EGYM
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    EGYM operates at the intersection of three converging markets: a global corporate wellness market estimated
    at $72–82 billion in 2026 (6–9% CAGR), a European fitness industry generating €39.1 billion in 2025 revenue,
    and an emerging connected gym equipment market of $2–4 billion globally. The serviceable market for EGYM
    Wellpass is concentrated in employer-sponsored fitness-as-a-benefit subscriptions across Germany, Europe, and
    the US, where employers pay approximately €70/employee/month. Growth is driven by talent retention pressures,
    GLP-1-driven new entrants to fitness, and the shift from healthcare repair to prevention—but constrained by
    well-documented academic skepticism about wellness program ROI, GDPR data privacy compliance, and high
    switching costs in both hardware and corporate HR-benefits workflows.

sections:
  - id: section-market-boundary
    title: Market Boundary, Adjacencies, and Status-Quo Substitutes
    body: >-
      EGYM's revenue base spans two structurally distinct but complementary markets: (1) connected gym equipment
      and AI training software sold to fitness operators (B2B hardware and SaaS), and (2) employer-sponsored
      corporate wellness subscriptions through EGYM Wellpass (B2B2C fitness-as-a-benefit). These markets have
      different buyers, budget owners, competitive dynamics, and sizing conventions, and conflating them into a
      single TAM understates the boundary logic needed for valuation.


      The corporate wellness TAM broadly includes employer spend on health risk assessments, EAP programs, mental
      health platforms, fitness/gym benefit networks, nutrition programs, digital wellness apps, and onsite health
      facilities. EGYM Wellpass competes specifically within the fitness-as-a-benefit and gym-network-access
      sub-segment—a structurally narrower slice than the headline corporate wellness TAM. Excluded from EGYM's
      direct SAM are spend on clinical EAP therapy, traditional group health insurance premiums, occupational
      health mandates, onsite cafeteria nutrition programs, and consumer-direct D2C fitness apps. Adjacent spend
      categories include health insurer supplemental benefits, occupational rehabilitation, and corporate mental
      health platforms, which represent medium-term partnership and upsell opportunities rather than core
      addressable market.


      Status-quo substitutes for employers include: cash wellness allowances (no network), direct single-gym
      employer partnerships, Wellhub/Gympass corporate subscriptions (the primary like-for-like competitor), Urban
      Sports Club (acquired by Wellhub, 2025), benefits platforms bundling fitness as one of many perks (e.g.,
      Benify, Benefitfocus), and the do-nothing/no-benefit baseline. For gym operators, substitutes for EGYM
      Technology include traditional analog circuit training equipment (Technogym, Life Fitness, Precor), non-EGYM
      club management software (Mindbody, Jonas, Perfect Gym), and internal digital projects. The status-quo
      baseline—non-digitized gyms with standard equipment—remains the most common case globally even in 2026,
      representing the largest untapped opportunity.
    claimRefs:
      - CM027
      - CM028
      - CM029
      - CM030
    tableRefs:
      - TM001

  - id: section-market-sizing
    title: Market Sizing — TAM, SAM, and SOM with Multiple Lenses
    body: >-
      The global corporate wellness market is consistently estimated in the $72–82 billion range for 2026, with
      CAGR forecasts of 6–9% through 2030–2035, depending on the analyst firm and methodology. Fortune Business
      Insights places the 2026 figure at $71.89 billion (6.41% CAGR through 2034), Precedence Research at $72.73
      billion (7.36% CAGR through 2035), and The Business Research Company at $81.6 billion (9.1% CAGR to 2030).
      The $10-billion spread across these estimates primarily reflects disagreements on the inclusion boundary—
      specifically whether occupational health mandates, EAP clinical services, and onsite programs are counted
      alongside fitness-network subscriptions. These are genuinely distinct spend categories and the headline
      numbers should not be used interchangeably.


      The European corporate wellness sub-market is estimated at $20.43 billion in 2025 (Statifacts), and the
      German market alone at approximately $5.3 billion for 2026 (Knowledge Sourcing), growing to $7.1 billion
      by 2031. These geographies represent EGYM Wellpass's strongest existing markets. The fitness-as-a-benefit
      network sub-segment (the narrow slice where EGYM Wellpass directly competes) is not separately quantified
      by any reviewed analyst; the most credible available proxy is employer per-employee spend at approximately
      €70/month × addressable employee population. Germany alone has approximately 46 million employed workers;
      at even 5% penetration into large-employer fitness benefit programs, the implied annual employer spend is
      ~€1.9 billion—consistent with EGYM Wellpass's reported 24,000 employer-partner scale.


      The connected gym equipment and software markets are separately sized. Research and Markets estimates the
      connected gym equipment market at around $2.1 billion in 2026 growing to $4.66 billion by 2032 (14% CAGR),
      while Fortune Business Insights estimates $4.12 billion in 2026 reaching $19.41 billion by 2034 (21.4%
      CAGR)—a near-doubling in the base estimate reflecting whether AI software, cloud subscriptions, and
      content platforms are included alongside the hardware. Gym management software globally is projected at
      $2.23 billion in 2026, with AI-in-fitness growing faster at $10.68 billion in 2025 and $57.80 billion by
      2035 (19.3% CAGR). EGYM's SOM across both its equipment and Wellpass products is an evidence-constrained
      estimate: at 33,000+ gym locations and 24,000+ employer partners at current pricing, implied ARR is in the
      $400–600 million range, consistent with the CEO's $500 million 2025 revenue projection but without
      independent corroboration.
