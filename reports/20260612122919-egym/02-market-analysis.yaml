callouts:
  - calloutType: risk
    title: Wellness ROI skepticism is a persistent CFO barrier
    body: >-
      Despite $94.6 billion in projected global corporate wellness spend by 2026, Harvard Business Review (2024)
      and MIT Sloan's evidence review both conclude that anticipated well-being improvements are not materializing
      and that rigorous ROI evidence is "surprisingly limited." Wellhub's own 2026 data shows a 36-point gap
      between wellness benefit availability and relevance. EGYM must provide independently verifiable outcome
      data—beyond self-reported surveys—to overcome CFO resistance in enterprise accounts, particularly as
      program budgets face post-pandemic normalization pressure.
    claimRefs:
      - CM025
      - CM026
      - CM033

  - calloutType: insight
    title: Fitness-as-a-benefit is market-expanding, not just market-share
    body: >-
      Wellhub's 2025 operator data shows 90% of employees accessing gyms through corporate wellness platforms
      are new customers to those facilities. This indicates the corporate wellness channel is genuinely expanding
      the fitness market rather than redistributing existing gym members. For EGYM Wellpass, this dynamic means
      employer-partner networks do not cannibalize EGYM Technology gym operator relationships but instead grow
      the overall addressable membership pool, supporting a dual-sided flywheel thesis.
    claimRefs:
      - CM023
      - CM024
      - CM032

  - calloutType: assumption
    title: SAM/SOM sizing relies on analyst derivation — no independent estimate published
    body: >-
      No reviewed analyst firm has independently published a market size for the fitness-as-a-benefit network
      sub-segment or for EGYM's specific SAM. All SAM/SOM figures in this chapter are derived from employer
      count × pricing × penetration proxies or from the CEO's $500M 2025 revenue projection. Diligence buyers
      should treat these numbers as plausible order-of-magnitude estimates pending audited financials, not as
      market-validated sizing.
    claimRefs:
      - CM034
      - CM040

