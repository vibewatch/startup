  - id: section-scale-metrics
    title: Scale, Metrics, and Network Reach
    body: >-
      As of the January 2026 merger announcement, EGYM's Wellpass corporate wellness network had grown to
      more than 20,000 employer partners with access to fitness and wellness facilities across Germany,
      Austria, France, Belgium, UK, and the US. This represented meaningful growth from the September 2024
      baseline of 14,000 corporate customers and 17,000 sports-partner venues serving 3 million eligible
      employees. The Wellpass US footprint crossed 4,000 participating gyms and studios by December 2025
      following the FitReserve acquisition. Globally, the EGYM Technology product line connects 33,000+
      fitness locations, and the platform reports 7.5 million+ monthly active exercisers as of 2026,
      up from 6 million in September 2024.


      Revenue metrics are partly public through merger disclosures. In 2025, Playlist and EGYM combined
      generated more than $800 million in net revenue while maintaining strong profitability. EGYM's CEO
      stated in September 2024 that the company was profitable on an EBITDA basis and projected standalone
      revenues of $500 million for 2025, though the standalone 2025 figure was not separately confirmed
      after the merger. Headcount was approximately 700 at the Series G close (September 2024) and an
      estimated 880+ employees by late 2025 before the merger. The combined Playlist-EGYM entity has over
      3,000 employees globally. Gross margin, NRR, and precise ARR figures are not publicly disclosed.
