  - id: section-funding
    title: Funding History and Capital Structure
    body: >-
      EGYM has raised approximately $580 million or more in total capital across at least eight distinct
      financing rounds from founding through 2024. The company completed a Series B ($15M, July 2014) led
      by Highland Capital Partners alongside Bayern Kapital and HTGF, followed by a Series C ($45M, March
      2016) led by HPE Growth and Highland Europe. In 2018, EGYM secured a €30.1M loan from the European
      Investment Bank (non-dilutive debt), and in 2021 received an additional €2.57M EIB grant. The Series
      E in 2021 comprised two tranches totaling approximately $75M and introduced Mayfair Equity Partners,
      which led the $41M portion.


      The Series F (approximately $225M, July 2023), led by Affinity Equity Partners alongside Bayern
      Kapital and Mayfair Equity Partners, was the largest round prior to unicorn status. The Series G
      ($200M, September 2024) was led by L Catterton and Meritech Capital, both new investors, and
      carried a post-money valuation confirmed by CEO Roesch-Schlanderer at over $1.2 billion—EGYM's
      unicorn milestone. The January 2026 Playlist-EGYM merger included $785M in new equity led by
      Affinity Partners (Jared Kushner's firm), with Vista Equity Partners, Temasek, and L Catterton
      also participating, at a combined enterprise value of $7.5 billion. Mayfair Equity Partners reinvested
      the majority of its EGYM stake into the new entity, reflecting confidence in the combined platform.
    claimRefs:
      - CO004
