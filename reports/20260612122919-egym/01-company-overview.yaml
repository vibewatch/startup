callouts:
  - calloutType: strength
    title: EBITDA profitability with unicorn scale
    body: >-
      EGYM achieved EBITDA profitability and unicorn valuation simultaneously at Series G close in September 2024,
      a rare combination in fitness technology. CEO Roesch-Schlanderer confirmed profitability while projecting
      $500M in standalone revenues for 2025—suggesting genuine business durability rather than growth-at-all-costs.
    claimRefs:
      - CO005
      - CO018
      - CO028

  - calloutType: strength
    title: Vertically integrated wellness operating system at global scale
    body: >-
      EGYM's combination of smart hardware (33,000+ locations), AI training software (Genius, 7B+ workout data
      points), and the Wellpass corporate employer network (20,000+ partners, 7.5M+ MAU) creates defensible
      switching costs and data network effects. No direct competitor has replicated this hardware-software-employer
      vertical integration at comparable scale.
    claimRefs:
      - CO019
      - CO029
      - CO033
      - CO034
      - CO035
      - CO036

  - calloutType: risk
    title: Post-merger vendor lock-in and pricing power risk for gym operators
    body: >-
      The Playlist-EGYM merger creates a single entity controlling gym equipment, software, and corporate wellness
      aggregation. Industry analysis warns gym operators face materially reduced negotiating leverage at contract
      renewal, with post-merger pricing potentially 15–30% above pre-merger benchmarks. This concentration risk
      could dampen future hardware and SaaS sales if operators resist renewal or seek alternative ecosystems.
    claimRefs:
      - CO031
      - CO032

  - calloutType: insight
    title: Merger represents a 5x valuation step-up from Series G in under 18 months
    body: >-
      EGYM's $1.2B+ standalone valuation (September 2024) became part of a $7.5B combined enterprise in March 2026—
      roughly a 5x implied step-up in 18 months, driven by strategic combination rather than organic value creation
      alone. Diligence should separate the EGYM-specific contribution from the Playlist synergy assumptions embedded
      in the combined EV.
    claimRefs:
      - CO005
      - CO012
      - CO013

