company:
  name: EGYM
chapter:
  number: 1
  title: Company Overview
  summary: >-
    EGYM is a Munich-based connected fitness and corporate wellness technology company founded in 2010 that
    achieved unicorn status in September 2024 with a $200M Series G at a $1.2B+ valuation, then merged with
    Playlist (Mindbody, ClassPass, Booker) in a $785M transaction closing March 2026 at a $7.5B combined
    enterprise value. The company operates EGYM Technology (smart gym equipment and AI training) and EGYM
    Wellpass (20,000+ employer-partner corporate wellness network), with strong EBITDA profitability, 7.5M+
    monthly active exercisers, and $800M+ combined 2025 net revenue—though vendor lock-in concerns and
    mixed customer support reviews represent material diligence items.

sections:
  - id: section-identity-products
    title: Identity, Business Model, and Products
    body: >-
      EGYM is a Munich, Germany-based fitness technology company founded in 2010 with the stated mission of
      transforming healthcare "from repair to prevention." The company operates as a vertically integrated
      fitness and wellness platform built around two core product lines: EGYM Technology and EGYM Wellpass.
      EGYM Technology encompasses connected smart strength equipment, cloud-based software, and the EGYM
      Genius AI training platform. EGYM Wellpass is a B2B corporate wellness subscription network that
      connects employers with a curated network of fitness and wellness facilities.


      The business model is B2B2C: EGYM sells connected gym equipment and software to fitness operators
      (B2B), enabling those operators to deliver better member experiences (B2C), while simultaneously
      connecting gyms and corporate employers through the Wellpass network. As of September 2024, approximately
      75% of EGYM's revenue was subscription-based and 25% hardware-driven, a structure the CEO described
      as core to the long-term value proposition. EGYM Genius, the AI-powered training platform launched in
      2024, uses machine learning models trained on over 7 billion workout data points and 410 million
      assessments, integrating with 200+ equipment and software partners to deliver personalized training
      plans across connected and analog equipment. As of 2026, the EGYM ecosystem powers 33,000+ fitness
      locations globally and serves 7.5 million+ monthly active exercisers. The company is headquartered
      in Munich with a significant US presence in Denver, Colorado, and operates across Germany, Austria,
      France, Belgium, UK, and US.
    claimRefs:
      - CO001
      - CO022
      - CO032
      - CO033
      - CO034
      - CO035
      - CO036
    figureRefs:
      - FO002

  - id: section-founders-leadership
    title: Founders, Leadership, and Governance
    body: >-
      EGYM was founded by Philipp Roesch-Schlanderer, who serves as CEO and co-founder. Roesch-Schlanderer
      conceived the idea while a student at Columbia Business School, where he observed that traditional gym
      experiences lacked personalization and continuity. He holds degrees in Business Administration and
      Technology Management from Ludwig Maximilian University Munich (LMU), Aarhus University, Columbia
      Business School, and the Technical University of Munich (TUM). In 2025, he received the Rainer Schaller
      Entrepreneurship Award from EuropeActive. Following the January 2026 Playlist-EGYM merger announcement,
      Roesch-Schlanderer was named Co-Founder of the combined Playlist organization and Co-Chairman alongside
      Monti Saroya (Co-Head of Vista Equity Partners' Flagship Fund).


      The executive team includes Patrick Meininger as CFO, Nicolas Stadtelmeyer as Managing Director of
      EGYM Wellpass, and John Ford as Chief Product Officer. The board was expanded at the Series G close
      in September 2024 when Paul Madera (co-founder and partner at Meritech Capital) and Marc Magliacano
      (managing partner at L Catterton) joined. EGYM's governance is concentrated around Roesch-Schlanderer,
      representing meaningful key-person dependence; however, his retention as Co-Chairman and CEO of EGYM
      within the Playlist structure provides continuity. The identity of any additional co-founders has not
      been verified in primary EGYM-issued materials reviewed during this research cycle.
    claimRefs:
      - CO002
      - CO023
      - CO024
      - CO025
      - CO026
