  - id: section-retention-satisfaction
    title: Retention, Satisfaction, and Contract Durability
    body: >-
      EGYM's most robust retention evidence is a company-published study based on 210,000 members showing
      that gym-goers who began their fitness journey using EGYM from the first session had 19% higher
      overall retention and 24% lower cancellation risk compared to non-EGYM members. The mechanism is
      structured, personalized onboarding: EGYM's guided first session creates habit formation that is
      statistically observable at scale. This study underlies the company's core operator value proposition
      and is the basis for EGYM's marketing claim that it reduces gym member acquisition costs by lowering
      churn. The Vivacity Premier Fitness 85% retention rate (six-month snapshot) corroborates this at
      the site level for a specific over-50 cohort. EGYM's operator contracts average 3–5 years with
      bundled hardware-software pricing, creating multi-year recurring revenue predictability and high
      switching costs for gym operators.


      The EGYM Wellpass employer billing model—per-active-user monthly billing—creates a structurally
      different retention profile. Because employers pay only for activated employees, enrollment activation
      rates directly affect Wellpass revenue. EGYM has invested in HRIS integrations (via Kombo's unified
      API covering SAP, Workday, Personio, Payfit) to automate employee onboarding and offboarding, which
      reduces administrative churn and improves activation rates—but the underlying activation rate (what
      share of eligible employees actually activate a Wellpass membership) remains undisclosed. NRR, GRR,
      and employer churn metrics are not publicly available from EGYM; these are the most critical gaps
      for investor diligence on the Wellpass segment.


      Adverse satisfaction signals are material. EGYM Wellpass GmbH's Trustpilot score is 3.2/5 (rated
      "Average") from 169+ reviews, down from a previously cited 2.9/5. The dominant complaint theme in
      reviews is app-only access requiring a charged smartphone for gym check-in, framing it as a security
      and convenience risk. A February 2025 review stated explicitly: "I am a paying customer. This is
      deceiving customers," in reference to the chatbot-only support loop. The EGYM Wellpass app on Google
      Play (formerly Gymlib in France) rates approximately 3.8/5 from 5,200+ reviews, with early-phase
      bug reports partially resolved by subsequent updates. These scores are below top-tier B2B SaaS
      benchmarks and represent a reputational risk in the employer HR buyer market where employee
      satisfaction with benefits is itself a buyer metric.
