  - id: section-expansion-concentration
    title: Expansion Loops, Concentration Risk, and Channel Dependence
    body: >-
      EGYM's land-and-expand motion operates on two axes. Within the gym operator channel, initial
      deployments of a Smart Strength circuit (typically 8–12 units plus Fitness Hub) serve as an entry
      point for incremental software add-ons including Genius AI, the Business Suite 2.0, advanced
      biometric analytics, and deeper Wellpass integration. Within the employer channel, Wellpass
      contracted employers can expand seat counts as head-count grows, and EGYM cross-sells Wellpass to
      employers whose workforce already uses EGYM-equipped partner gyms, creating a supply-side-to-
      demand-side loop. The EGYM–Playlist merger amplifies this by integrating Mindbody booking infrastructure
      and ClassPass's 88,000+ venue network, creating additional onramps for both operator discovery
      and employee activation.


      Concentration risk is meaningful on multiple dimensions. Geography: EGYM Wellpass is heavily
      penetrated in DACH (Germany, Austria, Switzerland), France, Belgium, and the UK; North American
      Wellpass revenues are nascent (FitReserve acquired September 2024, US network of ~3,800 partners
      still building at merger date). EGYM Technology's operator base, by contrast, includes US
      deployments through EoS Fitness and others, but the company does not disclose a geographic
      revenue split. Channel: Wellpass is exclusively employer-intermediated; any structural shift in
      employer willingness to fund fitness benefits—regulatory change, macro cost-cutting cycle—would
      directly impair Wellpass revenues with no DTC fallback. Post-merger vendor concentration: the
      Keedia analysis (May 2026) warns that Playlist-EGYM's vertical integration of equipment, content,
      and member management software into a single entity removes competitive tension from operator
      procurement. Facilities spending ~$3,500 per month on EGYM hardware and software pre-merger could
      face 15–30% pricing uplift on renewal within the 2026–2027 contract cycle. For operators on
      expiring agreements, this materially increases switching-cost calculus and procurement risk.
