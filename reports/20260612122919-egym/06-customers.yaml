callouts:
  - calloutType: strength
    title: Proven Member Retention Uplift at Operator Scale
    body: >-
      EGYM's 210,000-member retention study showing a 19% retention improvement and 24% lower
      cancellation risk is the most statistically robust public evidence of customer value creation
      in the connected fitness equipment sector. Combined with Vivacity's 85% six-month retention
      rate, this data set anchors the operator value proposition and de-risks renewal risk.
    claimRefs:
      - CU009
      - CU010
      - CU007

  - calloutType: strength
    title: Enterprise Employer Penetration with Blue-Chip Named References
    body: >-
      Allianz, McKinsey & Company, and Boston Consulting Group as named Wellpass employer clients
      signal enterprise credibility and broad sector penetration beyond fitness-native buyers. AXA
      Health and Bupa as UK insurance partners further validate the payor-adjacency of the Wellpass
      model, which supports premium pricing and lower churn than SMB-only wellness platforms.
    claimRefs:
      - CU011
      - CU028

  - calloutType: risk
    title: Adverse Review Signal — 3.2/5 Trustpilot and App-Only Access Complaints
    body: >-
      EGYM Wellpass GmbH's 3.2/5 Trustpilot rating and complaints of chatbot-only support with
      no direct human escalation path represent a material employee satisfaction risk. Since employer
      HR buyers evaluate Wellpass in part on employee satisfaction with the benefit, sustained poor
      consumer sentiment could directly erode new employer sales and hamper renewal rates. The
      app-only access model (no physical card or web check-in) is the single most cited friction point.
    claimRefs:
      - CU015
      - CU016
      - CU045

  - calloutType: risk
    title: Post-Merger Vendor Lock-In and Operator Pricing Risk
    body: >-
      Keedia's May 2026 independent analysis warns that EGYM-operator contracts expiring in 2026–2027
      face potential 15–30% pricing increases as Playlist-EGYM rolls out unified pricing across a
      now vertically integrated equipment-content-software stack. Operators that cannot absorb this
      increase may churn to Technogym or delay renewals, creating near-term retention risk for
      EGYM's operator revenue base.
    claimRefs:
      - CU014
      - CU019
      - CU035

  - calloutType: insight
    title: Wellpass Activation Rate is the Undisclosed Critical Lever
    body: >-
      EGYM bills Wellpass employers per-active-user, not per-enrolled employee. The gap between
      eligible employees and activated monthly users determines actual Wellpass revenue and ARR.
      EGYM's investment in HRIS integrations (Kombo, SAP, Workday, Personio) suggests activation
      rate improvement is a strategic priority—but the activation rate itself remains the most
      important undisclosed investor metric for the Wellpass business.
    claimRefs:
      - CU020
      - CU022
      - CU040

