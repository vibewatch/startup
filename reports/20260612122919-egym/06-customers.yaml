  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: retention-financials
      missingEvidence: >-
        EGYM NRR (Net Revenue Retention) and GRR (Gross Revenue Retention) for both the operator SaaS
        segment and the Wellpass employer segment — neither metric is publicly disclosed.
      whyItMatters: >-
        Without NRR and GRR, it is impossible to assess the true revenue durability of EGYM's subscription
        base; a high headline customer count could mask significant churn if net dollar retention is below 100%.
      diligencePath: >-
        Request NRR and GRR by segment in any data room process; benchmark against SaaS peers (top-quartile
        B2B SaaS NRR is typically 115–125%).
      relatedQuestionRefs: [QU007, QU017]

    - type: private-evidence-only
      severity: material
      topic: activation-rate
      missingEvidence: >-
        EGYM Wellpass employee activation rate — the share of eligible enrolled employees who actually
        activate a Wellpass membership and generate monthly revenue.
      whyItMatters: >-
        The per-active-user billing model means Wellpass ARR is heavily dependent on activation rates.
        A 20% activation rate on 3 million eligible employees produces far lower ARR than a 60% rate.
        This metric is the single most important undisclosed Wellpass revenue health indicator.
      diligencePath: >-
        Request activation rate by employer cohort vintage and by geography (DACH vs. France vs. UK vs. US)
        in any data room; compare against Wellhub/Gympass reported activation benchmarks.
      relatedQuestionRefs: [QU018, QU027]

    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof
      missingEvidence: >-
        A complete list of EGYM Technology operator clients with production deployments; EGYM does not
        publish a public operator registry and most corporate Wellpass employer names are confidential.
      whyItMatters: >-
        The current named customer list (EoS, Vivacity, Places Leisure on operator side; Allianz, McKinsey,
        BCG on Wellpass side) may not be representative of the full 33,000-location operator base or the
        20,000-employer Wellpass base.
      diligencePath: >-
        Request a complete customer list (with revenue bands and deployment dates) in any data room
        process; prioritize top-20 operator clients by revenue contribution.
      relatedQuestionRefs: [QU002, QU003]
      relatedTableRefs: [TU003]

    - type: private-evidence-only
      severity: material
      topic: geographic-concentration
      missingEvidence: >-
        EGYM's geographic revenue split between DACH, rest-of-Europe, UK, and North America for both
        EGYM Technology and Wellpass segments.
      whyItMatters: >-
        EGYM Wellpass is believed to be heavily concentrated in DACH, where the product originated.
        Geographic concentration in a single regulatory and economic zone represents a correlated macro
        risk; the degree of this concentration is unconfirmed and material to risk assessment.
      diligencePath: >-
        Request geographic revenue split by country and segment in any data room; cross-reference with
        FitReserve US buildout progress metrics to assess North America diversification timeline.
      relatedQuestionRefs: [QU020, QU027]

