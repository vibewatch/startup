callouts:
  - calloutType: strength
    title: EBITDA Profitability at $500M Scale
    body: >-
      EGYM is one of the few European fitness-tech companies to achieve EBITDA profitability at scale
      ($500M+ revenue target for 2025) while maintaining over 56% compound annual revenue growth across
      three years. This positions EGYM favorably relative to many VC-backed fitness peers that are still
      burning cash. The 75/25 subscription-to-hardware revenue mix structurally supports high blended
      margins as Wellpass continues to grow faster than the equipment business.
    claimRefs:
      - CI001
      - CI002
      - CI005

  - calloutType: risk
    title: Unaudited Profitability Claims and Zero Segment Transparency
    body: >-
      EGYM's EBITDA profitability claim is entirely company-stated and has never been validated by an
      independent auditor or public filing. No gross margin, net income, adjusted EBITDA margin, NRR,
      or CAC figure has been publicly disclosed. Post-merger integration into Playlist further obscures
      EGYM-specific financials with no obligation to report EGYM as a separate segment. This represents
      the primary diligence blocker: the financial quality thesis rests on CEO assertions alone.
    claimRefs:
      - CI028
      - CI031
      - CI037

  - calloutType: risk
    title: Post-Merger Pricing Power and Operator Lock-In
    body: >-
      The Playlist-EGYM vertical integration concentrates hardware, software, content, and booking under
      one entity, eliminating the competitive pricing pressure that historically governed EGYM equipment
      contracts. Independent operator analysis projects 15–30% renewal price increases post-merger.
      While this may improve EGYM's own economics, it creates a churn risk if operators seek alternatives
      at renewal, and makes EGYM's customer satisfaction scores a leading indicator of revenue durability.
    claimRefs:
      - CI017
      - CI026

  - calloutType: recommendation
    title: Priority Diligence Items Before Underwriting
    body: >-
      Request the following from Playlist management before any underwriting decision: (1) EGYM-segment
      P&L with audited gross margin by hardware vs. software vs. Wellpass for FY2023–2025; (2) Wellpass
      NRR cohort analysis by employer vintage and geography; (3) CAC and payback period by customer
      segment; (4) combined Playlist-EGYM cash position, debt schedule, and monthly burn as of Q1 2026;
      (5) post-merger pricing model for gym operator renewals and evidence of churn experience to date.
    claimRefs:
      - CI028
      - CI030
      - CI031

