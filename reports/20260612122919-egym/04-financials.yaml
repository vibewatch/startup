  - id: section-performance
    title: Financial Performance and Growth Trajectory
    body: >-
      EGYM disclosed revenue milestones across multiple funding rounds, providing an unusually clear growth
      picture for a private European technology company. In 2022 the company generated $130 million in
      revenues, growing approximately 70% year-over-year; EGYM Wellpass specifically exceeded 100% growth
      in the same period. At the Series F close in July 2023, management projected revenues would roughly
      double to approximately $260 million in 2023 while reaching profitability for the first time. At the
      September 2024 Series G close, the CEO stated to TechCrunch an expectation of "$500 million in revenues
      in 2025"—consistent with the prior compound trajectory. Third-party data aggregator Latka separately
      measured EGYM US at $80.2 million ARR as of September 2025, suggesting material North American
      traction alongside the primary European base.


      The January 2026 Playlist-EGYM merger announcement provided the most comprehensive revenue disclosure:
      the combined entity confirmed more than $800 million in combined net revenue for 2025 while "maintaining
      high-growth momentum and strong profitability." Because EGYM now operates as a Playlist subsidiary
      alongside Mindbody, ClassPass, and Booker, standalone EGYM revenue will not be separately reported
      going forward, creating a permanent gap in EGYM-specific financial visibility. The CEO confirmed EBITDA
      profitability, but margin level, net income, free cash flow, and the adjusted vs. reported EBITDA
      distinction have never been publicly disclosed.


      The implied three-year CAGR from $130M (2022) to ~$500M (2025 target) is approximately 56%—exceptional
      for a hardware-plus-subscription hybrid. Affinity Partners characterized EGYM in 2023 as "close to
      doubling in size year-over-year," corroborating the growth narrative. However, the absence of audited
      disclosures means the profitability claim and revenue trajectory both rest on company-issued statements
      rather than independently verified financials, which is a standard private-company limitation but a
      material constraint for any underwriting analysis.
