chapter:
  number: 4
  title: Financials
  summary: >-
    EGYM entered 2026 as an EBITDA-profitable growth company with a CEO-stated $500M standalone 2025 revenue
    target, a 75/25 subscription-to-hardware revenue split, and over $573M in lifetime capital raised. The
    Playlist-EGYM merger closed March 2026 at a $7.5B combined enterprise value with $785M in new equity,
    producing $800M+ combined 2025 net revenue—though EGYM standalone financials are no longer reported
    separately. Adverse signals include a 2.9/5 Trustpilot rating for EGYM Wellpass, operator warnings of
    15–30% post-merger pricing increases, and fully illiquid EGYM shareholder equity in the private Playlist
    entity; gross margin, NRR, CAC, and cash position remain undisclosed private metrics.

sections:
  - id: section-revenue-model
    title: Revenue Model and Segment Mix
    body: >-
      EGYM's revenue architecture rests on two structurally distinct but mutually reinforcing streams: EGYM
      Technology (connected smart strength equipment and cloud software sold to fitness operators) and EGYM
      Wellpass (employer-sponsored corporate wellness subscriptions). As of the September 2024 Series G close,
      CEO Philipp Roesch-Schlanderer confirmed to TechCrunch that approximately 75% of EGYM's revenue was
      subscription-based and the remaining 25% hardware-driven—a material shift from the company's original
      equipment-first model. "The corporate subscription market is bigger than gym tech but the gym tech is
      what creates the value," Roesch-Schlanderer stated directly.


      The EGYM Technology arm generates revenue through tightly bundled mechanisms: hardware sales or
      multi-year leasing of connected smart strength circuits to gym operators, plus per-facility SaaS
      subscriptions delivering training data management, member engagement, and EGYM Genius AI training plans.
      Industry analysis suggests operator bundles of 8–12 units plus software are leased at approximately
      $3,500 per month under pre-merger contracts, with individual smart strength units priced at roughly
      $6,000–$12,000 for outright purchase—though outright purchases are rare because EGYM pushes multi-year
      bundled contracts averaging 3–5 years. Following the Playlist merger in March 2026, independent
      operator analysis warns that unified pricing may lift renewal rates 15–30% above pre-merger benchmarks
      as vertical integration removes competitive tension from equipment procurement.


      EGYM Wellpass operates a pure active-user subscription model in which employers pay a monthly per-user
      fee covering access to 17,000+ gym and wellness partners. Only employees who actively use the network
      are billed, reducing passive-enrollment cost for the employer while potentially creating revenue
      volatility if activation rates fall. Pricing is not publicly listed; tailored per employer. Industry
      estimates indicate €20–€40 per active user per month in Europe and $30–$70 in the US, shared between
      employer subsidy and employee co-payment. Wellpass is available exclusively through employers, which
      concentrates revenue risk on enterprise contract retention and precludes a direct-to-consumer fallback.
