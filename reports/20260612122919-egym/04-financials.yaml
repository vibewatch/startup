  - id: section-unit-economics
    title: Unit Economics and Profitability Drivers
    body: >-
      EGYM's blended margin profile is structurally favorable given the 75/25 subscription-hardware split,
      but exact gross margins by segment have not been publicly disclosed. Hardware-manufacturing businesses
      at comparable scale (connected fitness equipment, commercial gym hardware) typically carry gross margins
      of 40–55%; B2B SaaS and subscription wellness networks typically achieve 70–85%. A blended 75%
      subscription / 25% hardware mix would imply a theoretical blended gross margin of roughly 60–70%,
      broadly consistent with EBITDA profitability at EGYM's reported scale. The high subscription share
      insulates overall economics from hardware margin compression caused by component costs or competitive
      pricing pressure—a structural advantage that the Playlist merger is intended to extend through a
      larger recurring-revenue base.


      Unit economics transparency is significantly below investment-grade across both segments. Key missing
      metrics include: customer acquisition cost (CAC) per gym operator and per Wellpass employer; net revenue
      retention (NRR) or annual churn for employer subscriptions; average contract value (ACV) by segment;
      employee activation rate (what percentage of eligible employees actively use Wellpass); and operating
      leverage ratios. The 3–5 year average operator contract provides contractual stability, but without
      NRR data the quality of Wellpass employer retention cannot be independently assessed.


      The adverse signal from Trustpilot—a 2.9/5 average rating across 169 reviews with recurring themes of
      confusing cancellations, unhelpful customer support, and declining partner network coverage—raises a
      plausible churn risk. Critically, those reviews are predominantly from individual employees rather than
      employer HR decision-makers; employer-level NRR, not employee satisfaction, governs financial quality.
      The disconnect is a material diligence item: if employers retain Wellpass despite low employee
      satisfaction, switching costs and HR procurement inertia dominate; if employee dissatisfaction begins
      triggering employer non-renewals, NRR could be at risk. Neither resolution is supportable from public
      sources alone. A primary diligence session with management should prioritize cohort NRR by contract
      vintage and channel, activation-rate benchmarks, and CAC-to-ACV payback periods.
    claimRefs:
      - CI004
      - CI022
      - CI025
      - CI026
