  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: cac
      missingEvidence: >-
        Customer acquisition cost (CAC) by segment for gym technology operators and EGYM Wellpass employers,
        including ACV, payback period, and LTV/CAC ratios.
      whyItMatters: >-
        Without CAC data, it is impossible to evaluate whether the Wellpass and gym-tech growth is
        economically efficient or fueled by unsustainably high sales spend; a high CAC relative to ACV
        would materially reduce underwriting confidence.
      diligencePath: >-
        Request management-provided CAC breakdown by channel (direct sales, partner, digital) and segment
        (gym tech vs. Wellpass) for at least the last three fiscal years.
      relatedQuestionRefs:
        - QI010

    - type: private-evidence-only
      severity: blocking
      topic: cash
      missingEvidence: >-
        Combined Playlist-EGYM cash on hand, debt obligations, debt maturity schedule, and monthly or
        quarterly operating cash flow and free cash flow as of Q1 2026 post-merger close.
      whyItMatters: >-
        The $785M new equity injection may mask a significant ongoing burn rate in the combined entity,
        particularly as North America and Asia expansion accelerates; without cash and burn data, capital
        adequacy cannot be confirmed beyond the existence of fresh equity.
      diligencePath: >-
        Request the Playlist-EGYM combined Q1 2026 balance sheet, quarterly cash flow statement, and
        CFO commentary on expected cash consumption over 12–24 months.
      relatedQuestionRefs:
        - QI013

    - type: private-evidence-only
      severity: material
      topic: gross-margin
      missingEvidence: >-
        Audited gross margin by segment (hardware, software/SaaS, Wellpass employer subscriptions) for
        EGYM on a standalone basis for at least FY2023 and FY2024.
      whyItMatters: >-
        The entire profitability thesis depends on the margin structure of the subscription segment
        relative to hardware; without segment gross margins, the EBITDA claim cannot be decomposed or
        stress-tested.
      diligencePath: >-
        Request audited segment P&L; at minimum, a management account showing gross margin by revenue
        stream with a clear definition of what costs are included.
      relatedQuestionRefs:
        - QI007

    - type: private-evidence-only
      severity: material
      topic: nrr
      missingEvidence: >-
        Wellpass employer-level net revenue retention (NRR) by vintage cohort and geography, annual churn
        rate, and expansion revenue split for at least FY2023 and FY2024.
      whyItMatters: >-
        NRR is the primary subscription quality indicator. The adverse Trustpilot signal (2.9/5) and
        Keedia's post-merger pricing analysis both point toward potential churn risk that cannot be
        assessed without cohort retention data.
      diligencePath: >-
        Request Wellpass NRR by employer cohort (year of contract start) and geography; also request
        activation rates by employer segment to understand billed vs. eligible ratio.
      relatedQuestionRefs:
        - QI014

    - type: private-evidence-only
      severity: material
      topic: revenue
      missingEvidence: >-
        EGYM standalone revenue for FY2025 and post-merger financial reporting for EGYM as a distinct
        Playlist segment, separate from Mindbody, ClassPass, and Booker contributions.
      whyItMatters: >-
        The combined $800M+ figure obscures EGYM-specific growth; without segment revenue, it is
        impossible to track whether EGYM reached the CEO's $500M 2025 target or whether the combined
        figure is dominated by the legacy Playlist businesses.
      diligencePath: >-
        Request Playlist management to provide EGYM-segment revenue for FY2025 and Q1 2026 alongside
        segment-level EBITDA and growth rates.
      relatedQuestionRefs:
        - QI015

