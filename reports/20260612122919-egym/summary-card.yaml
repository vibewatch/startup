summary:
  headline: >-
    EGYM is an EBITDA-profitable global fitness-technology platform with $800M+ combined 2025 revenue, 75% subscription
    mix, and genuine network effects, but the 9.4× combined EV/revenue multiple is stretched versus public comps, and
    key underwriting drivers—NRR, gross margin, and post-integration unit economics—remain undisclosed in a fully
    illiquid private vehicle.
