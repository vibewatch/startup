  topStrengths:
    - >-
      Platform scale and recurring revenue moat: $800M+ combined 2025 revenue with 75% subscription share, 33,000+
      EGYM-equipped locations, and 20,000+ Wellpass employer partners delivering durable multi-year contractual
      visibility
    - >-
      EBITDA profitability at scale: CEO-confirmed positive EBITDA distinguishes EGYM from distressed connected-fitness
      peers and removes near-term capital adequacy risk, reinforced by $785M in fresh merger equity
    - >-
      Proprietary AI platform with compounding data advantage: EGYM Genius trained on 7B+ workout data points and 410M+
      assessments across 200+ equipment integrations creates a defensible moat
    - >-
      International network effects across DACH, France, UK, and US with Wellpass corporate wellness benefits embedded
      in enterprise HR procurement cycles
    - >-
      Top-tier institutional backing: Vista Equity, L Catterton, Temasek, and Meritech provide financial credibility and
      long-duration capital for the $7.5B combined platform
  topRisks:
    - >-
      Opaque financials prevent underwriting at $7.5B: NRR by employer cohort, segment gross margins, CAC, and audited
      EBITDA remain undisclosed; revenue trajectory rests on company-issued statements only
    - >-
      Post-merger pricing power creates operator churn risk: independent analysis projects 15–30% renewal rate increases
      on pre-merger $3,500/month bundles, potentially driving gym operator defections
    - >-
      Wellhub DACH competitive displacement: $600M acquisition of Urban Sports Club in 2025 penetrates EGYM's German
      home market with 39,000 corporate clients and a broader holistic wellness offer
    - >-
      Illiquid equity with no disclosed exit timeline: EGYM shareholders hold fully private Playlist equity; IPO plans
      were shelved and Vista Equity typically holds 4–7 years before exit
    - >-
      GDPR and EU AI Act compliance exposure: EGYM processes special-category health data at scale; EGYM Genius faces
      high-risk AI designation with fines up to 7% of global annual turnover
  unresolvedGaps:
    - >-
      Employer NRR by cohort vintage is undisclosed; cannot independently verify whether Wellpass renewal economics
      justify the recurring revenue premium in the $7.5B valuation
    - >-
      Segment gross margins for EGYM Technology vs. EGYM Wellpass are not public; blended 60–70% estimate is inferred
      from segment mix, not verified from audited financials
    - >-
      EGYM standalone revenue post-merger is no longer separately reported; the $500M 2025 CEO guidance cannot be
      confirmed and EGYM's share of the $800M+ combined figure is unknown
    - >-
      Post-merger operator pricing impact on churn: no public data on gym operator non-renewal rates or pricing
      acceptance in the first post-merger contract cycle (H2 2026–2027)
    - >-
      Combined cash position, monthly burn, debt schedule, and free cash flow are undisclosed for both the EGYM entity
      and the combined Playlist-EGYM vehicle
