companyProfile:
  summary: >-
    EGYM is a Munich-based fitness technology company founded in 2010 with the mission of
    transforming healthcare "from repair to prevention." The company operates two core business
    lines: EGYM Technology (connected smart strength equipment, cloud software, and the EGYM
    Genius AI training platform) and EGYM Wellpass (a B2B corporate wellness subscription network
    connecting employers with 20,000+ fitness and wellness facilities). As of January 2026, EGYM
    powered 33,000+ fitness locations globally, served 7.5 million+ monthly active exercisers,
    and partnered with 20,000+ employers. In March 2026 EGYM merged with Playlist (Mindbody,
    ClassPass, Booker) at a combined $7.5B enterprise value with $785M in fresh equity, becoming
    a Playlist subsidiary. Pre-merger, EGYM raised approximately $580M+ across eight rounds and
    confirmed EBITDA profitability at the September 2024 Series G close.
  foundedDate: "2010-01-01"
  founders:
    - name: Philipp Roesch-Schlanderer
      role: Co-founder & CEO (Co-Chairman of Playlist post-merger)
      background: Conceived EGYM while studying at Columbia Business School; holds degrees from LMU Munich, Aarhus University, Columbia Business School, and TUM.
      claimRefs: [CO002, CO024]
  foundingLocation: Munich, Germany
  headquarters: Munich, Germany
  productSummary: >-
    Connected smart strength equipment circuits sold or leased to gym operators under multi-year
    bundled contracts; EGYM Genius AI training platform trained on 7B+ workout data points and
    integrating with 200+ equipment and software partners; EGYM Wellpass employer-sponsored
    corporate wellness subscription network providing access to 20,000+ gym and wellness partners.
  customerFocus: "Fitness operators (gym chains, independent gyms) and enterprise employers procuring corporate wellness benefits"
  businessModel: >-
    B2B2C: hardware sales or multi-year leasing of smart strength equipment bundled with per-facility
    SaaS subscriptions to gym operators; per-active-user employer billing for Wellpass corporate
    wellness network. Approximately 75% subscription revenue and 25% hardware revenue as of
    September 2024.
  stage: "Series G / Playlist subsidiary (post-March 2026)"
  fundingStatus: >-
    Raised approximately $580M+ standalone across at least eight rounds (Series B through Series G).
    Series G ($200M, September 2024) led by L Catterton and Meritech Capital at $1.2B+ post-money
    valuation. January 2026 Playlist-EGYM merger added $785M in equity led by Affinity Partners
    with Vista Equity, Temasek, and L Catterton at a $7.5B combined enterprise value.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO007, CO010, CO017, CO018, CO022, CO027, CI004]
summary:
  headline: >-
    EGYM is an EBITDA-profitable global fitness-technology platform with $800M+ combined 2025
    revenue, 75% subscription mix, and genuine network effects, but the 9.4× combined EV/revenue
    multiple is stretched versus public comps, and key underwriting drivers—NRR, gross margin, and
    post-integration unit economics—remain undisclosed in a fully illiquid private vehicle.
