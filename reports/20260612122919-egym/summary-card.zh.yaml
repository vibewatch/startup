summary:
  headline: >-
    EGYM 已实现 EBITDA 盈利，是一家全球健身科技平台，2025 年合并收入超过 $800M，订阅收入占 75%，也有真实网络效应；但合并 EV/收入 9.4×
    高于上市可比公司，NRR、毛利率、整合后单位经济等关键承销变量仍未披露，且股权完全困在非流动私募载体里。
