callouts:
  - calloutType: risk
    title: "Stretched Multiple Without NRR Confirmation"
    body: >-
      The $7.5 billion combined enterprise value implies 9.4× EV/revenue—50% above the June 2026 public
      SaaS median of 6–7× and 3.1× above Technogym's liquid public comparable. This premium is only
      justified if Wellpass employer NRR exceeds 110% and blended gross margin exceeds 65%. Neither has
      been publicly disclosed, creating a valuation gap that cannot be closed from public sources alone.
    claimRefs:
      - CV006
      - CV018
      - CV020
      - CV044

  - calloutType: risk
    title: "Equity Illiquidity Is a First-Order Risk"
    body: >-
      EGYM shareholders hold equity in a wholly private Playlist entity with no disclosed IPO timeline,
      no secondary market mechanism, and a merger that explicitly terminated the earlier Mindbody-ClassPass
      IPO plan. AInvest characterizes the Playlist-EGYM merger as an "illiquid bet" where returns depend
      entirely on future exit execution. Vista Equity Partners' typical four-to-seven-year hold period
      suggests a 2030–2033 exit window at earliest.
    claimRefs:
      - CV025
      - CV036
      - CV039
      - CV043

  - calloutType: assumption
    title: "Post-Merger Multiple Assumes Platform Synergies Not Yet Demonstrated"
    body: >-
      The step from EGYM's conservatively priced 2.4× Series G multiple to the 9.4× combined merger
      multiple is bridged by the untested assumption that unifying hardware, SaaS, ClassPass consumer,
      and Wellpass employer into a single entity produces multiplied rather than additive value. This
      platform-of-platforms premium has no directly comparable precedent in fitness technology at this
      scale, and execution risk from integrating four distinct product lines across three geographies
      is material.
    claimRefs:
      - CV003
      - CV006
      - CV007
      - CV042

  - calloutType: strength
    title: "Series G Was Conservatively Marked; Merger Premium Reflects Real Strategic Value"
    body: >-
      At 2.4× target revenue, EGYM's $1.2 billion Series G valuation was substantially below both the
      Wellhub ARR multiple (~13.2×) and the public SaaS median (6–7×). The merger's 9.4× combined
      revenue multiple, while aggressive on an absolute basis, represents a rational convergence toward
      market pricing for a 75%-recurring-revenue, EBITDA-profitable platform. The $785 million fresh
      equity from world-class investors (Vista, Temasek, L Catterton) is itself a high-conviction signal
      that sophisticated institutional capital underwrote the valuation.
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV018
      - CV021

