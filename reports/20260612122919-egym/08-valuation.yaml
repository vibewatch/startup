  - id: section-comparable-analysis
    title: Comparable Set and Multiple Analysis
    body: >-
      No single comparable precisely mirrors EGYM's B2B2C blended hardware-software-wellness model, so the
      comp set must span four categories: public connected fitness equipment, public and private corporate
      wellness platforms, public SaaS sector medians, and private late-stage fitness technology transactions.


      On the corporate wellness side, Wellhub (formerly Gympass) is the most direct comparable. PremierAlts
      marks Wellhub at $4.2 billion as of December 2024, while Latka independently measured $319 million in
      ARR as of September 2025. The implied multiple of approximately 13.2× ARR is substantially higher than
      EGYM's own implied ARR multiple at both the $1.2 billion standalone mark and the $7.5 billion combined
      mark. Wellhub's total capital raised ($867.5 million; $2.4 billion valuation at 2023 Series F) reflects
      a still-private scale-up with demonstrated growth, but its last primary round was 2023—making the $4.2
      billion mark a secondary-market estimate rather than a negotiated primary-round price.


      On the connected fitness equipment side, Technogym (listed on Borsa Italiana) provides the only
      liquid public comparable. Technogym generated €1.02 billion in revenue and €220 million in adjusted
      EBITDA in 2025, with market-implied EV/revenue of approximately 3.0× and EV/EBITDA of approximately
      13.9× as of 2025. Q1 2026 revenue advanced 10.1% year-over-year to €236.8 million. By this pure
      hardware-and-software equipment standard, EGYM's 9.4× combined multiple is a ~3× premium—partially
      justified by EGYM's 75% subscription revenue mix versus Technogym's predominantly equipment-driven model.


      Peloton provides a cautionary public comp from the distressed end of connected fitness. Peloton's
      enterprise value of approximately $3 billion against last-twelve-months revenue of ~$2.4 billion implies
      an EV/revenue of ~1.2×. Q3 FY2026 earnings (May 7, 2026) showed 1% revenue growth year-over-year and
      an 8.6% decline in paid connected fitness subscriptions, with full-year FY26 revenue guidance of $2.42–2.44
      billion. Peloton's trajectory—declining subscriber count, near-flat revenue, but improving EBITDA—is
      effectively the anti-thesis scenario for EGYM if post-merger integration fails and corporate wellness
      churn accelerates.


      The June 2026 public SaaS sector median EV/revenue stands at 6–7×, with top-quartile SaaS at 13–14×
      and the overall software landscape showing significant AI-driven dispersion (pure-play AI SaaS at ~8.9×
      median). Private SaaS lower-middle-market transactions in 2025–2026 transact at a median of ~4.2× ARR
      (Windsor Drake / Aventis Advisors), with HR and corporate wellness SaaS at the upper end (6–9× for
      large, high-performing platforms). High-growth profitable SaaS with NRR exceeding 120% commands
      7× and above—the threshold EGYM's subscription arm must demonstrate to justify a premium multiple.
