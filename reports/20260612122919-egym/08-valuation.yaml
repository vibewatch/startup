chapter:
  number: 8
  title: Valuation
  summary: >-
    The $7.5B Playlist-EGYM combined enterprise value (March 2026) implies a ~9.4× EV/revenue multiple on
    $800M+ combined 2025 net revenue—aggressive versus the June 2026 public SaaS median of 6–7×, the
    Technogym public comp at ~3×, and the Peloton distressed comp at ~1.2×, but directionally defensible
    given EGYM's 75% recurring revenue, EBITDA profitability, and platform network effects.
    The standalone Series G valuation ($1.2B+ at ~2.4× target revenue) was conservatively marked, while the
    merger premium reflects strategic optionality and multi-sided platform value. The primary valuation
    risk is equity illiquidity in a long-duration private vehicle with no disclosed exit timeline; adverse
    operator analysis projects 15–30% post-merger pricing increases, elevating churn risk and threatening the
    growth assumptions that justify the current multiple. Recommendation: track with medium confidence
    pending disclosure of NRR cohorts, segment gross margins, and integration milestones.

sections:
  - id: section-valuation-context
    title: Valuation Context and Capital Structure
    body: >-
      EGYM's valuation has moved through three distinct inflection points across 2023–2026, each anchored by
      a new syndicate of sophisticated institutional investors and a rising revenue base. The July 2023 Series F
      ($225 million, led by Affinity Partners at an implied ~$680 million pre-money) valued EGYM at roughly
      2.6× its then-estimated $130 million 2022 revenue run-rate—a premium consistent with its double-digit
      growth trajectory at that stage. The September 2024 Series G ($200 million, led by L Catterton and
      Meritech Capital) was the defining mark: CEO Philipp Roesch-Schlanderer confirmed a post-money valuation
      exceeding $1.2 billion, establishing EGYM's unicorn status. At the stated $500 million 2025 revenue
      target, the Series G implies an ~2.4× EV/revenue multiple—below the public SaaS median of 6–7× and
      even below the Technogym public-comp comparable of ~3×, suggesting the Series G was conservatively
      priced relative to EGYM's software-heavy profile and growth rate.


      The January 2026 merger announcement and March 2026 close created a step-change in scale and valuation.
      The combined Playlist-EGYM enterprise was capitalized at $7.5 billion in enterprise value, supported
      by $785 million in fresh equity led by Affinity Partners with participation from Vista Equity Partners,
      Temasek, and L Catterton. Implied on the $800 million-plus combined 2025 net revenue, this translates
      to approximately 9.4× EV/revenue—a strategic merger premium well above the public SaaS median and the
      connected fitness public comps. The premium reflects the multi-sided platform thesis: unifying hardware,
      SaaS, corporate wellness aggregation, consumer marketplace, and AI coaching into a single entity that
      no individual competitor yet replicates at scale.


      EGYM's total lifetime capital raised prior to the merger was approximately $580 million across at least
      eight rounds; the $200 million Series G was the largest equity tranche on a standalone basis. The merger
      added $785 million in a single raise, making the effective post-merger capital stack one of the largest
      in global fitness technology history. EGYM now operates as a wholly owned Playlist subsidiary, and
      existing EGYM shareholders hold illiquid private equity with no publicly disclosed exit timeline.
