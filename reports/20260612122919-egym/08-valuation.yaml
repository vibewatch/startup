  - id: section-scenario-analysis
    title: Bull / Base / Bear Scenario Analysis
    body: >-
      Three scenarios bound the Playlist-EGYM valuation space, each resting on distinct assumptions about
      platform integration success, revenue multiple trajectory, and Wellhub competitive response. Because
      EGYM is now a Playlist subsidiary with no separately reported financials, scenario analysis must
      operate at the combined entity level.


      The bull case assumes successful AI platform integration (EGYM Genius + Mindbody Messenger AI) drives
      25%+ compound revenue growth, reaching approximately $1.6 billion combined by 2027. At a forward EV/revenue
      multiple of 10× on $1.6 billion—justified by platform network effects, AI-driven margin expansion, and
      growing North American EGYM footprint—the implied combined valuation reaches $16 billion by 2027 exit
      or mark-to-market. EGYM's standalone contribution at ~50% of combined revenue implies a $5–6 billion
      attributed value. This scenario requires NRR to exceed 110%, integration costs to remain below guidance,
      and the Wellhub competitive response to remain manageable. Probability signal: lower; contingent on
      execution across four distinct business lines in three geographies.


      The base case holds the current $7.5 billion combined enterprise value as roughly fair at 9.4× combined
      2025 revenue, with the multiple gradually compressing toward 7× as growth moderates and the platform
      demonstrates two-to-three annual NRR cohorts. A $1.1 billion combined revenue by 2026 at 8× multiple
      would imply an $8.8 billion combined valuation—a modest premium to entry. EGYM's standalone implied
      value would be approximately $3.5–4 billion. This requires stable Wellpass employer renewal rates,
      no significant operator churn from pricing increases, and clean integration with Mindbody's SaaS platform.


      The bear case envisions multiple compression triggered by operator churn (pricing increases of 15–30%),
      Wellhub competitive displacement in DACH, and integration execution failure. At 5× $800 million
      combined revenue, the implied combined valuation falls to $4 billion—a 47% markdown from entry.
      EGYM's standalone attributed value would be approximately $2 billion, below its Series G standalone mark.
      This scenario is consistent with the post-merger pricing concerns raised by independent operator analysis
      and with Peloton's trajectory as a cautionary precedent. Probability signal: meaningful given the
      illiquidity structure and absence of independently verified NRR data.
