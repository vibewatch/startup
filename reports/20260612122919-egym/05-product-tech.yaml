  - id: section-trust-privacy-ip
    title: Trust, Privacy, Compliance, and IP
    body: >-
      EGYM's data governance framework distinguishes between "Gym Data" (processed on behalf of the gym operator,
      e.g. member records synced from the MMS) and "Workout Data" (controlled by the end user, e.g. training
      history, health measurements, BioAge). This dual-role structure—EGYM as data processor for the gym and data
      controller for the user—supports GDPR's data minimization and consent requirements without requiring per-user
      gym-side consent for operational data flows. EGYM's official data protection documentation states that all
      third-party cloud and software processors must comply with GDPR irrespective of geographic location and must
      hold recognized certifications for data processing and security. Sensitive biometric features (BioAge,
      strength-test results, flexibility scores) require explicit member consent before activation. On the IP side,
      EGYM GmbH holds granted US patents 12383793 (August 12, 2025) and 12109457 (October 8, 2024) covering
      training machine assemblies with smart resistance controls, actuators, and camera-based user monitoring. Patent
      12383793 specifically includes camera technology for monitoring user form, a differentiated hardware capability
      not commonly found in competitor equipment. Material gaps include: no independently confirmed SOC 2 or ISO
      27001 certification surfaced in public documentation; no published penetration-test report; and the full
      international patent portfolio count is unverified from public sources alone. EGYM's security posture is
      primarily self-attested; independent audit confirmation is a diligence ask.
    claimRefs:
      - CE013
      - CE014
