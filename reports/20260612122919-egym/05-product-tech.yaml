  name: EGYM
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    EGYM has repositioned from a connected-equipment vendor to the operator of a full "fitness operating
    system," anchored by the Smart Strength Series 3 hardware (premiered HFA 2026), EGYM Genius AI (11 billion
    workout data points, 700 million assessments), and a 200+ brand integration ecosystem spanning cardio,
    strength, wearables, and club management software. The data flywheel and multi-layer API platform represent
    durable competitive moats, though hardware calibration issues, incomplete analog-equipment fidelity, vendor
    lock-in dynamics, and a thin independent security-certification record are material diligence items.

sections:
  - id: section-product-portfolio
    title: Product Portfolio and Module Architecture
    body: >-
      EGYM's product set is organized around five interlocking layers it describes collectively as the "operating
      system for fitness and wellbeing." At the physical layer sit the Smart Strength equipment family—now entering
      its third generation with the Smart Strength Series 3 announced at HFA 2026—plus the Fitness Hub assessment
      station. Smart Strength machines electronically control resistance, automatically adjust grips, foot rests, and
      seat positions to each user within approximately four seconds of NFC or RFID login, and capture granular
      performance data (sets, reps, weight, range of motion, speed) for cloud upload. The Series 3 generation
      introduces 18.5-inch eye-level displays, LED lighting, 3D-molded ergonomic padding, and embedded support for
      advanced training methods including negative loading, adaptive resistance, and isokinetic protocols—
      administered automatically by the on-machine software without manual trainer intervention. The Fitness Hub
      seca edition, released in Q4 2025, adds medical-grade BIA body composition analysis to the onboarding
      workflow, extending the biometric data set available to Genius AI. Smart cardio integration is handled
      through third-party partnerships rather than EGYM-manufactured cardio equipment: EGYM's platform connects
      partner cardio devices via its open API, enabling heart-rate and duration data to flow into the unified
      training profile. The Wellpass corporate wellness network and the Branded Member App (formerly Netpulse)
      round out the portfolio, serving corporate HR buyers and gym operators respectively. EGYM SE Munich is the
      group parent, encompassing the Qualitrain corporate sports network as a distinct entity.
