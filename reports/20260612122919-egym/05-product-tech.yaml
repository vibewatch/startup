  - id: section-integration-ecosystem
    title: Integration Ecosystem and Technical Architecture
    body: >-
      EGYM's open ecosystem connects 200+ fitness and health brands across cardio hardware, strength equipment,
      body composition devices, wearables, and club management software. The technical foundation is the EGYM Cloud,
      which aggregates real-time data from all connected devices and services as the single source of truth for
      member training records. The EGYM Developer Portal (last updated June 10, 2026) exposes three classes of
      API: (1) Member Management System (MMS) APIs for gym software vendors to synchronize member records and
      enable self-service features, currently migrating from v1 to v2; (2) Equipment Integration APIs for device-
      to-server (real-time) and server-to-server (asynchronous) communication for third-party hardware; and
      (3) EGYM Web Login API for websites and mobile apps using EGYM ID as a single sign-on provider. GitHub
      organization activity (as of June 2026) confirms ongoing platform development: test-reporter (293 stars),
      action-junit-report (160 stars), and micro web app (MWA) reference libraries for iOS, Android, and
      JavaScript—all with commits within the prior two weeks. Strategic hardware partners Matrix, Precor, and
      Pulse Fitness issued a joint interoperability statement in June 2025 reaffirming shared commitment to
      "open, secure, and future-ready" cloud connectivity. Precor's tenure as an EGYM partner stretches back to
      2011, with hundreds of joint installations, underscoring the longevity of the integration relationships.
      Machine-level connectivity uses Wi-Fi or LAN for real-time session data upload.
