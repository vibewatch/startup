  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: hardware manufacturing
      missingEvidence: >-
        Identity of EGYM's contract OEM manufacturer(s) and manufacturing locations for Smart Strength hardware.
      whyItMatters: >-
        OEM dependency and geographic manufacturing concentration create supply-chain risk; undisclosed
        manufacturer makes vendor-risk assessment impossible.
      diligencePath: >-
        Request hardware supply-chain disclosure in vendor due diligence; check public customs/import records
        and hardware FCC filings for component manufacturers.
      relatedQuestionRefs:
        - QE027

    - type: missing-source
      severity: material
      topic: security certification
      missingEvidence: >-
        No SOC 2 Type II, ISO 27001, or equivalent independent security audit certificate found in public
        EGYM documentation or their official trust/security page.
      whyItMatters: >-
        For institutional and corporate wellness buyers handling sensitive health data for thousands of
        employees, independent security certification is a procurement requirement; its absence is a
        negotiating blocker.
      diligencePath: >-
        Request current SOC 2 Type II report and any ISO 27001 certificate from EGYM in the data room;
        verify scope covers EGYM Cloud and production data environments.
      relatedQuestionRefs:
        - QE017
        - QE018

    - type: private-evidence-only
      severity: material
      topic: IP portfolio
      missingEvidence: >-
        Complete count of EGYM's international patent portfolio (EPO, WIPO, German Patent Office); only US
        patents traceable via Justia; German and European filings not verified.
      whyItMatters: >-
        For a Munich-based company, the core IP value may be in German/European patents; assessing competitive
        moat requires the full portfolio, not just US filings.
      diligencePath: >-
        Search EPO Espacenet and German Patent Office (DPMA) under assignee EGYM GmbH; request complete
        IP schedule in data room.
      relatedQuestionRefs:
        - QE007

    - type: missing-source
      severity: minor
      topic: AI model architecture
      missingEvidence: >-
        EGYM has not published technical documentation on the ML architecture, training methodology, or model
        evaluation metrics behind Genius AI; claims of "self-learning AI" are unverified by independent
        technical review.
      whyItMatters: >-
        Without technical documentation, it is not possible to assess whether the AI differentiation is
        architecturally defensible or replicable by well-resourced competitors with alternative datasets.
      diligencePath: >-
        Request AI/ML technical white paper in data room; consider third-party AI model audit or independent
        code review of Genius inference pipeline as part of technical due diligence.
      relatedQuestionRefs:
        - QE024
        - QE022
        - QE023

    - type: enumeration-incomplete
      severity: minor
      topic: MMS API v1 deprecation
      missingEvidence: >-
        Timeline and progress of MMS API v1 to v2 migration not publicly disclosed; proportion of 200+ MMS
        partners still on v1 unknown.
      whyItMatters: >-
        Legacy v1 integrations may create data synchronization inconsistencies or create operational risk
        if v1 is deprecated before partners fully migrate.
      diligencePath: >-
        Ask EGYM for v1/v2 adoption ratio across MMS partners and committed v1 sunset date; review any
        deprecation notices on developer portal.
      relatedQuestionRefs:
        - QE002
        - QE016

    - type: missing-source
      severity: minor
      topic: BioAge calculation
      missingEvidence: >-
        The technical methodology behind EGYM's BioAge calculation—specific physiological inputs, normative
        database, and validation methodology—is not publicly documented.
      whyItMatters: >-
        BioAge is a core user engagement hook and a claim that could be subject to regulatory scrutiny in
        some jurisdictions if presented as a health metric without clinical validation.
      diligencePath: >-
        Request BioAge methodology white paper; check whether EGYM has obtained any regulatory clearance or
        clinical validation for BioAge as a health indicator in the EU or US.
      relatedQuestionRefs:
        - QE026

