  - id: section-genius-ai
    title: EGYM Genius AI and Data Advantage
    body: >-
      EGYM Genius AI is the central differentiator of the EGYM platform. First announced March 21, 2024 and
      commercially launched in fall 2024, Genius generates fully automated, hyper-personalized training plans
      by drawing on a proprietary database that had grown to over 11 billion workout data points and 700 million
      assessment data points as of June 2026—up from 7 billion workout data points and 340 million assessments at
      initial launch. The AI is notable for bridging digital and analog equipment: it creates actionable plans not
      only for EGYM Smart Strength machines but also for selectorized equipment, cable pulls, and free weights,
      addressing a persistent gap in competitor offerings that required members to use EGYM hardware exclusively
      to benefit from AI guidance. Plans adapt dynamically after each completed session, resolving the "fixed
      plan problem" where missed workouts or changing schedules render traditional prescribed programs obsolete.
      EGYM's internal retention study across 210,000 members found 19% higher retention and 24% lower cancellation
      risk for members who enrolled in Genius at gym entry. EōS Fitness became the first US gym chain to deploy
      Genius on October 1, 2025, with plans to roll out to all US locations equipped with EGYM Smart Strength.
      The Q4 2025 update improved plan quality further by distributing weekly training volume more effectively,
      introducing greater exercise variety, and adding Flexibility BioAge operator dashboards. EGYM CPO John Ford
      characterized the data moat directly: "Dynamic plans are only possible with a product like Genius, which takes
      into account everything we've tracked up until the moment you press start."
