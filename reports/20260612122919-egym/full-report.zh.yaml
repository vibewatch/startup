      - number: '6.4'
        title: 扩张循环、集中风险与渠道依赖
        blocks:
          - type: paragraph
            body: >-
              EGYM 的“先落地、再扩张”动作沿两条轴线展开。在健身房运营商渠道，Smart Strength 循环训练设备的初始部署（通常 8–12 台加 Fitness Hub）是切入点，随后可增购 Genius
              AI、Business Suite 2.0、高级生物识别分析和更深层 Wellpass 整合等软件模块。在雇主渠道，签约 Wellpass 的雇主可随着员工数增长扩大席位；EGYM 还向员工已在使用 EGYM
              设备合作健身房的雇主交叉销售 Wellpass，形成从供给侧到需求侧的循环。EGYM–Playlist 合并通过整合 Mindbody 预订基础设施和 ClassPass 的 88,000+
              场馆网络放大这一循环，为运营商发现和员工激活都增加入口。


              集中风险在多个维度上都很明显。地域：EGYM Wellpass 在 DACH（德国、奥地利、瑞士）、法国、比利时和英国渗透很深；北美 Wellpass 收入仍处早期（2024 年 9 月收购
              FitReserve，合并时美国网络约 ~3,800 家伙伴仍在建设）。相比之下，EGYM Technology 的运营商基础包括 EoS Fitness
              等美国部署，但公司不披露地域收入拆分。渠道：Wellpass 完全由雇主中介分发；如果雇主资助健身福利的意愿发生结构性变化——监管变化、宏观成本削减周期——Wellpass 收入会直接受损，且没有 DTC
              兜底。合并后供应商集中：Keedia 分析（2026 年 5 月）警告，Playlist-EGYM 把设备、内容和会员管理软件垂直整合进单一实体后，移除了运营商采购中的竞争张力。合并前每月在 EGYM
              硬件和软件上花费约 $3,500 的设施，可能在 2026–2027 合同周期续约时面对 15–30% 的提价。对于协议即将到期的运营商，这会实质性提高切换成本测算和采购风险。
