      - number: '2.3'
        title: 买方、用户与付款方细分
        blocks:
          - type: paragraph
            body: >-
              EGYM 的 B2B2C 模式在两条产品线中涉及不同的买方、用户和付款方角色，因此需要分别切分。对 EGYM Wellpass 来说，主要买方是雇主侧 HR 经理或福利负责人（通常在 50–10,000
              名员工的公司），他们掌握员工健康福利的 HR 预算项。付款结构是共同支付：在德国，雇主通常承担 €40–45/员工/月，员工承担 €25–30/员工/月，混合后每名注册员工约 ~€70/月。一次性激活费通常约
              €44/员工。本章审阅的德国公共部门采购文件（Biberach、Knoll GmbH）确认了这一价格。


              对 EGYM Technology 来说，买方是健身房运营商的采购经理或业主运营者，采购决策由竞争差异化、会员体验和设备更新周期驱动（通常每 7–10 年一次）。资本开支强度形成了独特的采用摩擦：完整安装一套
              EGYM 力量训练循环设备，需要投入数十万欧元，回本周期 5–7 年。这与 Wellpass 的 SaaS 订阅模式完全不同，也让 Technology 分部渗透更慢、更受资本约束。


              按规模和类型看，关键买方细分为：大型企业（1,000+ 名员工）把健身福利作为人才战略，偏好可管理、可衡量的项目；SME 雇主（50–999 名员工）价格更敏感，采用通常由 HR
              基准调研或竞争对手福利配置触发；公共部门雇主通过采购流程采用，周期更长且有价格上限。健身房运营商按类型切分：大型连锁（如 EoS Fitness、RSG
              Group）从品牌化联网循环设备中获得差异化价值；独立运营商预算受限，但用 EGYM 对抗连锁。随着以预防为导向的保险模式扩张，健康保险公司、职业健康服务商等健康网络运营商正成为新兴付款渠道。
