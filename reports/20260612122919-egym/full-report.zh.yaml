  - id: FV004
    title: 投资 KPI — 投委会可用的关键维度评分
    type: kpi
    layout: standard
    summary: 投资委员会评分卡覆盖七个维度：市场机会、产品与护城河、客户证明、财务质量、估值、退出可见性和证据质量。
    data:
      items:
        - label: 市场机会
          value: Strong
          detail: $72–82B 全球健身市场（2026 年）；欧洲健身收入 €39.1B；企业健康福利高增长
          tone: positive
        - label: 产品护城河
          value: Differentiated
          detail: AI Genius 建在 7B 数据点上；33K+ 硬件装机基础；多边平台暂无单一竞争对手能复刻
          tone: positive
        - label: 客户证明
          value: Partial
          detail: 20K+ Wellpass 雇主；88K+ ClassPass 场馆；但 NRR 和激活率未披露
          tone: neutral
        - label: 财务质量
          value: Uncertain
          detail: EBITDA 盈利（公司自报）；75% 经常性收入；毛利率估计约 60–70%；无可用审计
          tone: neutral
        - label: 相对可比公司的估值
          value: Stretched
          detail: 合并 EV/收入 9.4×，对比 SaaS 中位数 6–7× 和 Technogym 3×；溢价需要 NRR 确认
          tone: negative
        - label: 退出可见性
          value: Low
          detail: 私募股权载体；IPO 计划搁置；Vista 通常持有 4–7 年；未披露退出时间表
          tone: negative
        - label: 证据质量
          value: Medium
          detail: 收入轨迹有充分相互印证；NRR、利润率和并购后流失未验证
          tone: neutral
