      - number: '4.4'
        title: 资本结构与资本充足性
        blocks:
          - type: paragraph
            body: >-
              EGYM 的融资史跨越十多年，七轮以上股权融资累计超过 $573 million，2017 年还拿到欧洲战略投资基金项下 €25 million EIB 债务融资。2021 年之后融资节奏明显加快：Series
              E（$41M，2021）、Series F（$225M，2023）和 Series G（$200M，2024 年 9 月）三年内合计贡献大约 $466 million——约占合并前全部资本的 80%。Series
              F 首笔交割对应投后估值 €600 million（约 $653M），Series G 将投后估值推高至 $1.2B+，确认独角兽地位。Affinity Partners 在 Series F 交割时明确提到
              IPO 路径；Playlist 合并后来取代了这一路径。


              2026 年 1 月 Playlist-EGYM 合并带来 EGYM 史上最大单笔资本注入：由 Affinity Partners 领投，Vista Equity Partners、Temasek 和 L
              Catterton 参与的新股融资 $785M，规模超过此前所有轮次总和。资金将主要投向 AI 投资，以及 EGYM 向北美和亚洲扩张。合并完成前后，EGYM 实体累计融资超过 $1.35
              billion；合并后的 Playlist-EGYM 实体总体资本基础还要高得多。合并公司目前全球员工超过 3,000 人。


              短期资本充足度看起来较强：面对 $800M+ 的合并收入基数，新注入的 $785M 股权资金约等于一年收入，远高于一家 EBITDA
              盈利企业的常规现金跑道门槛。不过，合并后手头现金、债务义务和自由现金流均未公开披露。EGYM UK Limited 在 Companies House 的备案（2025 年 6 月提交的 FY2024
              年度账目）确认英国子公司存在，但只反映全球 EGYM 业务的极小一部分。EGYM 股东持有的是 Playlist 中完全缺乏流动性的私募股权；未来任何退出——无论 IPO、老股交易，还是 Playlist
              战略出售——都完全取决于包括 Vista Equity Partners 在内的 Playlist 控股股东。
