      - number: '8.2'
        title: 可比公司与倍数分析
        blocks:
          - type: paragraph
            body: >-
              没有一家可比公司能精确对应 EGYM 这种 B2B2C、硬件-软件-健康福利混合模式，因此可比组必须覆盖四类：上市联网健身设备公司、上市和私有企业健康福利平台、上市 SaaS
              板块中位数，以及私有后期健身科技交易。


              企业健康福利侧，Wellhub（原 Gympass）是最直接的可比对象。PremierAlts 截至 2024 年 12 月给 Wellhub 标记的估值为 $4.2 billion；Latka 独立测算其
              2025 年 9 月 ARR 为 $319 million。由此隐含约 13.2× ARR，显著高于 EGYM 在 $1.2 billion 独立估值和 $7.5 billion 合并估值下的隐含 ARR
              倍数。Wellhub 累计融资 $867.5 million，2023 年 Series F 估值 $2.4 billion，说明其仍是具备增长证明的私有扩张期公司；但上一轮主融资发生在 2023 年，因此
              $4.2 billion 更像二级市场标记，而不是谈判形成的新股轮价格。


              联网健身设备侧，Technogym（Borsa Italiana 上市）提供唯一具流动性的上市可比。Technogym 2025 年收入 €1.02 billion，调整后 EBITDA €220
              million；截至 2025 年，市场隐含 EV/revenue 约 3.0×、EV/EBITDA 约 13.9×。2026 年 Q1 收入同比增长 10.1%，至 €236.8
              million。按这种纯硬件加软件设备标准看，EGYM 合并后 9.4× 倍数约有 3× 溢价；其中一部分可由 EGYM 75% 的订阅收入占比解释，而 Technogym 仍主要由设备收入驱动。


              Peloton 则提供了联网健身困境端的上市警示样本。Peloton 企业价值约 $3 billion，过去十二个月收入约 $2.4 billion，隐含 EV/revenue 约 1.2×。FY2026 Q3
              业绩（2026 年 5 月 7 日）显示收入同比增长 1%，付费联网健身订阅下降 8.6%，FY26 全年收入指引为 $2.42–2.44 billion。若合并后整合失败、企业健康福利流失加速，Peloton
              的路径——订阅人数下滑、收入几乎持平、但 EBITDA 改善——基本就是 EGYM 的反面情景。


              2026 年 6 月，上市 SaaS 板块 EV/revenue 中位数为 6–7×，上四分位 SaaS 为 13–14×；整个软件市场因 AI 驱动出现显著分化，纯 AI SaaS 中位数约
              8.9×。2025–2026 年，私有 SaaS 中低端市场交易的 ARR 中位数约 4.2×（Windsor Drake / Aventis Advisors）；HR 与企业健康福利 SaaS
              处于高端，大型、高绩效平台约 6–9×。高增长且盈利、NRR 超过 120% 的 SaaS 可获得 7× 以上倍数；EGYM 的订阅业务必须证明自己跨过这一门槛，才能支撑溢价倍数。
