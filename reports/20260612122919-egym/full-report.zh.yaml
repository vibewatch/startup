  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              EGYM 的收入基础跨越两个结构不同但互补的市场：（1）卖给健身运营商的联网健身设备和 AI 训练软件（B2B 硬件与 SaaS）；（2）通过 EGYM Wellpass 提供的雇主赞助企业健康订阅（B2B2C
              健身福利）。两个市场的买方、预算负责人、竞争动态和规模口径都不同；把它们混成一个 TAM，会低估估值所需的边界逻辑。


              企业健康 TAM 大体包括雇主在健康风险评估、EAP 项目、心理健康平台、健身房福利网络、营养项目、数字健康应用和现场健康设施上的支出。EGYM Wellpass
              具体竞争的是健身即福利和健身房网络接入这一子分部——比企业健康 TAM 的头部数字窄得多。EGYM 直接 SAM 不包括临床 EAP
              治疗、传统团体健康保险保费、职业健康强制支出、现场食堂营养项目，以及面向消费者的 D2C 健身应用。相邻支出类别包括健康保险补充福利、职业康复和企业心理健康平台；这些更像中期合作和增购机会，而不是核心可触达市场。


              雇主的现状替代方案包括：现金健康津贴（无网络）、直接与单一健身房合作、Wellhub/Gympass 企业订阅（主要同类竞争者）、Urban Sports Club（2025 年被 Wellhub
              收购）、把健身作为多项福利之一打包的福利平台（如 Benify、Benefitfocus），以及什么都不做 / 不提供福利的基线。对健身房运营商来说，EGYM Technology
              的替代方案包括传统模拟循环训练设备（Technogym、Life Fitness、Precor）、非 EGYM 俱乐部管理软件（Mindbody、Jonas、Perfect Gym）和内部数字化项目。即便到
              2026 年，现状基线——未数字化、使用标准设备的健身房——仍是全球最常见形态，也代表最大未开发机会。
            claimRefs:
              - CM027
              - CM028
              - CM029
              - CM030
