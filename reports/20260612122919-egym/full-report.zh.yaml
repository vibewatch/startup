      - number: '8.4'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              投资逻辑由五个相互咬合的论点支撑：（1）规模与网络防御性——合并收入 $800 million、33,000+ 个配备 EGYM 的场馆、20,000+ 个 Wellpass 雇主合作伙伴、88,000+ 个
              ClassPass 场馆，使合并后的 Playlist-EGYM 实体拼出了全球最完整的健身科技栈，并拥有相互强化的获客循环；（2）经常性收入质量——EGYM 75%
              的订阅收入占比、三到五年硬件捆绑包、按活跃用户计费的雇主模式，带来多年合同可见度，足以相对于 Technogym 以设备为中心的倍数获得软件式溢价；（3）规模化 EBITDA 盈利——CEO 确认 EBITDA
              为正（尽管利润率未披露），使 EGYM 区别于 Peloton 的利润率修复阶段，也消除了短期资本充足性风险；（4）AI 平台可选性——EGYM Genius 基于 7 billion
              个训练数据点训练，形成会随规模复利的自研 AI 护城河，并可能推动雇主福利合同获得溢价定价；（5）战略必然性——疫情后的估值重置加速了健身科技整合，Playlist-EGYM
              已站到其他玩家必须接入或对抗的平台位置。


              反向逻辑同样有五个结构性论点：（1）财务不透明——EGYM 的 EBITDA 盈利由公司自报，缺乏审计财务，毛利率、NRR 和 CAC 仍未披露；（2）股权缺乏流动性且没有退出机制——股东持有的是
              Affinity Partners（Kushner 旗下公司）、Vista Equity 和 Temasek 控制公司中的私募股权，没有 IPO 日期、没有二级市场，且合并明确终止了此前的 IPO
              计划；（3）倍数激进——9.4× 合并收入比 2026 年 6 月上市 SaaS 中位数高 3.4×，比 Technogym 上市倍数高
              3.1×，并假设尚未证明的整合协同；（4）合并后定价权带来流失风险——Keedia 的运营商分析预计续约费率将上调 15–30%，可能促使运营商转向 Technogym
              或集成度较低的替代方案；（5）Wellhub 2025 年以 $600 million 收购 Urban Sports Club，直接切入 EGYM Wellpass 的德国和 DACH
              堡垒，而此时合并整合恰恰需要管理层把精力放在内部。
