              - CR043
              - CR005
          - type: callout
            title: Wellhub 已补上本土市场差距——DACH 优势不再足够
            body: >-
              2025 年 9 月，Wellhub 以 $600M 收购 Urban Sports Club，直接瞄准 EGYM Wellpass 在德国和 DACH 本土市场的护城河。Wellhub 现在拥有 39,000
              家企业客户，而 Wellpass 为 20,000+，并把心理健康、营养和健身打成一体化福利包，更像一套完整的雇主福利。EGYM Wellpass 必须靠更强的网络覆盖、EGYM Technology 集成和
              AI 个性化来拉开差距，而不能再靠地理先发；这一点已被竞争者打穿。
