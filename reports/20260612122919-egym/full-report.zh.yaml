      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              从创立到 2024 年，EGYM 在至少八轮不同融资中累计募集约 $580 million 或更多资本。公司完成了由 Highland Capital Partners 领投、Bayern Kapital 和
              HTGF 参投的 Series B（$15M，2014 年 7 月），随后完成由 HPE Growth 和 Highland Europe 领投的 Series C（$45M，2016 年 3 月）。2018
              年，EGYM 获得 European Investment Bank 提供的 €30.1M 贷款（非稀释性债务），并在 2021 年获得 EIB 额外 €2.57M 补助。2021 年 Series E
              分两批，总额约 $75M，并引入 Mayfair Equity Partners，由其领投 $41M 部分。


              Series F（约 $225M，2023 年 7 月）由 Affinity Equity Partners 领投，Bayern Kapital 和 Mayfair Equity Partners 参投，是
              EGYM 迈入独角兽前最大一轮融资。Series G（$200M，2024 年 9 月）由新投资者 L Catterton 和 Meritech Capital 领投，CEO Roesch-Schlanderer
              确认投后估值超过 $1.2 billion——这是 EGYM 的独角兽里程碑。2026 年 1 月 Playlist-EGYM 合并包括 $785M 新股权资金，由 Affinity Partners（Jared
              Kushner 的公司）领投，Vista Equity Partners、Temasek 和 L Catterton 也参与，合并后企业价值 $7.5 billion。Mayfair Equity
              Partners 将其 EGYM 持股的大部分再投入新实体，反映出对合并平台的信心。
