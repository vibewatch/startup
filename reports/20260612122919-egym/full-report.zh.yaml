        - from: plan_gen
          to: workout
        - from: workout
          to: data_capture
        - from: data_capture
          to: adapt
        - from: adapt
          to: workout
        - from: data_capture
          to: trainer_loop
        - from: adapt
          to: retention
    approximationNotes: null
    claimRefs:
