  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与分部组合
        blocks:
          - type: paragraph
            body: >-
              EGYM 的收入架构建立在两条结构不同但相互强化的流上：EGYM Technology（卖给健身运营商的联网智能力量训练设备和云软件）与 EGYM Wellpass（雇主赞助的企业健康订阅）。截至 2024 年
              9 月 Series G 交割，CEO Philipp Roesch-Schlanderer 向 TechCrunch 确认，EGYM 约 75% 的收入来自订阅，剩余 25%
              来自硬件——这已明显偏离公司最初的设备优先模式。Roesch-Schlanderer 直言：「企业订阅市场比健身房技术更大，但健身房技术才是创造价值的东西。」


              EGYM Technology 通过紧密打包的机制产生收入：向健身房运营商销售硬件或多年期租赁联网智能力量训练循环设备，外加按场馆收费的 SaaS 订阅，提供训练数据管理、会员互动和 EGYM Genius AI
              训练计划。行业分析显示，在合并前合同下，运营商 8–12 台设备加软件的组合租金约为每月 $3,500；单台智能力量设备若直接购买，价格约 $6,000–$12,000——但直接购买并不常见，因为 EGYM
              推动平均 3–5 年的多年期绑定合同。2026 年 3 月 Playlist 合并后，独立运营商分析警告，垂直整合消除了设备采购中的竞争张力，统一定价可能把续约费率抬高到合并前基准之上 15–30%。


              EGYM Wellpass 采用纯活跃用户订阅模式，雇主按月按用户付费，覆盖对 17,000+
              家健身房和健康合作伙伴的接入。只有实际使用网络的员工才会被计费，这降低了雇主的被动注册成本，但如果激活率下降，也可能造成收入波动。价格未公开列示，而是按雇主定制。行业估计显示，欧洲每名活跃用户每月
              €20–€40，美国为 $30–$70，由雇主补贴和员工共同支付分担。Wellpass 只能通过雇主获得，这把收入风险集中在企业合同留存上，也排除了直接面向消费者的兜底路径。
