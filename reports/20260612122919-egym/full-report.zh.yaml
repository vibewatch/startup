      - number: '2.5'
        title: 图表要点
        blocks:
          - type: callout
            title: 健康项目 ROI 怀疑是持续存在的 CFO 障碍
            body: >-
              尽管预计到 2026 年全球企业健康支出将达到 $94.6 billion，Harvard Business Review（2024）和 MIT Sloan 的证据综述都认为，预期的身心健康改善没有兑现，严格
              ROI 证据「出人意料地有限」。Wellhub 自己的 2026 年数据显示，健康福利可得性与相关性之间存在 36 个百分点落差。EGYM 必须提供可独立验证的结果数据——不能只靠自报调研——才能打消企业客户中
              CFO 的阻力，尤其是在项目预算面临疫情后正常化压力时。
            calloutType: risk
            claimRefs:
              - CM025
              - CM026
              - CM033
          - type: callout
            title: 健身即福利在扩大市场，而不只是争夺份额
            body: >-
              Wellhub 的 2025 年运营商数据显示，通过企业健康平台进入健身房的员工中，90% 是这些场馆的新客户。这说明企业健康渠道确实在扩大健身市场，而不是重新分配既有健身房会员。对 EGYM Wellpass
              来说，这一动态意味着雇主合作网络不会蚕食 EGYM Technology 与健身房运营商的关系，反而会扩大整体可触达会员池，支撑双边飞轮逻辑。
