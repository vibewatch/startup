      - number: '4.3'
        title: 单位经济与盈利驱动因素
        blocks:
          - type: paragraph
            body: >-
              鉴于 75/25 的订阅-硬件收入结构，EGYM 的混合利润率画像在结构上有利，但各分部精确毛利率未公开披露。类似规模的硬件制造业务（联网健身设备、商用健身房硬件）通常毛利率为 40–55%；B2B SaaS
              和订阅型健康网络通常可达 70–85%。75% 订阅 / 25% 硬件的混合结构，理论上隐含约 60–70% 的混合毛利率，大体符合 EGYM 披露规模下的 EBITDA
              盈利。高订阅占比让整体经济性不易受组件成本或竞争定价压力造成的硬件毛利压缩影响——这是 Playlist 合并希望通过更大经常性收入基础继续放大的结构优势。


              两个分部的单位经济透明度都显著低于投资级。缺失的关键指标包括：每个健身房运营商和每个 Wellpass
              雇主的获客成本（CAC）；雇主订阅的净留存率（NRR）或年度流失；各分部平均合同价值（ACV）；员工激活率（符合资格员工中实际使用 Wellpass 的比例）；以及经营杠杆比率。运营商平均 3–5
              年合同提供了合同稳定性，但没有 NRR 数据，就无法独立评估 Wellpass 雇主留存质量。


              Trustpilot 反向信号——169 条评论平均 2.9/5，反复提到取消流程混乱、客服不给力、合作伙伴网络覆盖下降——提出了合理的流失风险。关键是，这些评论主要来自个人员工，而不是雇主 HR
              决策者；决定财务质量的是雇主级 NRR，而不是员工满意度。这一脱节是实质尽调项：如果雇主即便在员工满意度低的情况下仍留用 Wellpass，说明切换成本和 HR
              采购惯性占主导；如果员工不满开始触发雇主不续约，NRR 可能承压。仅凭公开来源无法支持任一结论。与管理层的一手尽调应优先追问按合同年份和渠道切分的队列 NRR、激活率基准，以及 CAC 到 ACV 的回本周期。
