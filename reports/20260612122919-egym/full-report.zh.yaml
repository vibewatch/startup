      - number: '4.6'
        title: 附录
        blocks:
          - type: callout
            title: $500M 规模下实现 EBITDA 盈利
            body: >-
              EGYM 是少数在规模化阶段实现 EBITDA 盈利的欧洲健身科技公司之一（2025 年收入目标 $500M+），同时过去三年收入复合年增长率超过 56%。相较许多仍在烧钱的 VC 支持健身同行，EGYM
              位置更有利。75/25 的订阅 / 硬件收入组合在结构上支撑较高的混合利润率，因为 Wellpass 增速持续快于设备业务。
            calloutType: strength
            claimRefs:
              - CI001
              - CI002
              - CI005
          - type: callout
            title: 未经审计的盈利说法与零分部透明度
            body: >-
              EGYM 的 EBITDA 盈利说法完全来自公司自述，从未得到独立审计师或公开备案验证。公司没有公开披露毛利率、净利润、调整后 EBITDA 利润率、NRR 或 CAC。合并后并入 Playlist 进一步遮蔽了
              EGYM 专属财务数据，且没有义务把 EGYM 作为单独分部报告。这构成首要尽调阻断点：财务质量逻辑只建立在 CEO 表述之上。
            calloutType: risk
            claimRefs:
              - CI028
              - CI031
              - CI037
          - type: callout
            title: 合并后定价权与运营商锁定
            body: >-
              Playlist-EGYM 的垂直整合把硬件、软件、内容和预订集中到同一实体，消除了过去约束 EGYM 设备合同的竞争性定价压力。独立运营商分析预计，合并后续约价格会上涨 15–30%。这可能改善 EGYM
              自身经济性，但如果运营商在续约时寻找替代方案，就会带来流失风险，也让 EGYM 的客户满意度评分成为收入韧性的领先指标。
            calloutType: risk
            claimRefs:
              - CI017
              - CI026
          - type: callout
            title: 承销前优先尽调事项
            body: >-
              任何承销决策前，应向 Playlist 管理层索取以下材料：（1）EGYM 分部 P&L，并按硬件、软件、Wellpass 拆分 FY2023–2025 经审计毛利率；（2）按雇主年份和地区拆分的
              Wellpass NRR 队列分析；（3）按客户分部拆分的 CAC 和回本周期；（4）截至 2026 年 Q1 的 Playlist-EGYM
              合并现金头寸、债务明细和月度烧钱；（5）健身房运营商续约的合并后定价模型，以及截至目前的流失经验凭证。
            calloutType: recommendation
            claimRefs:
              - CI028
              - CI030
              - CI031
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与模块架构
        blocks:
          - type: paragraph
            body: >-
              EGYM 的产品组合围绕五个互相咬合的层级展开，公司把它们合称为“健身与健康的操作系统”。物理层包括 Smart Strength 设备家族——HFA 2026 发布的 Smart Strength Series
              3 标志着第三代即将上市——以及 Fitness Hub 评估站。Smart Strength 机器用电子方式控制阻力，用户通过 NFC 或 RFID
              登录后，约四秒内自动调整握把、脚托和座椅位置，并采集细粒度表现数据（组数、次数、重量、活动范围、速度）上传云端。Series 3 引入 18.5 英寸视线高度显示屏、LED 灯光、3D
              模压人体工学衬垫，并内置高级训练方法支持，包括负荷离心、自适应阻力和等速训练协议——这些都由机载软件自动执行，无需教练手动干预。2025 年 Q4 发布的 Fitness Hub seca edition
              在入会流程中加入医疗级 BIA 身体成分分析，扩展 Genius AI 可用的生物识别数据集。智能有氧整合不是靠 EGYM 自产有氧设备，而是通过第三方合作完成：EGYM 平台通过开放 API
              连接合作伙伴有氧设备，让心率和时长数据流入统一训练档案。Wellpass 企业健康网络和 Branded Member App（前 Netpulse）补齐产品组合，分别服务企业 HR 买家和健身房运营商。EGYM
              SE Munich 是集团母公司，旗下还包含作为独立实体运营的 Qualitrain 企业运动网络。
