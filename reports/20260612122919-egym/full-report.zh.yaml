  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图——直接同业、既有巨头、相邻玩家与替代方案
        blocks:
          - type: paragraph
            body: >-
              EGYM 横跨两个结构不同的竞争场域，必须分开评估：（1）卖给健身运营商的联网健身设备和 AI 训练软件；（2）通过 EGYM Wellpass
              提供的雇主赞助企业健康订阅。两个市场吸引的竞争者集合不同，切换成本形态也完全不同。


              在企业健康聚合器分部，Wellhub（原 Gympass）是主要直接竞争对手。2025 年以 $600M 收购 Urban Sports Club 后，Wellhub 现已在 18 个国家运营，服务 39,000
              家企业客户，并把 5 million 名员工订阅者连接到 97,000 家健康合作伙伴。这笔收购把 Wellhub 在拉美和北美的强势，与 Urban Sports Club 在欧洲的深度结合起来，直接挑战
              EGYM Wellpass 在德国和 DACH 地区的本土市场优势。FitOn Health 收购 Peerfit 企业健身房接入网络后，也在美国雇主市场竞争，尽管规模明显更小（$12M ARR、13,000
              家雇主）。Benify（全面薪酬与员工福利）和 Benefitfocus（福利管理）等福利平台，是相邻竞争者；它们把健身接入打包成众多员工福利之一，而不是专门网络。


              在联网健身设备和 AI 训练分部，Technogym（TGYM.MI，上市公司）是主要既有挑战者。Technogym 2025 年收入 €1.02B（同比 +13%），全球服务 100,000+ 家健康中心，并与
              Google 合作新推出 AI Ecosystem，正积极扩展数字和软件能力。Life Fitness / Hammer Strength（独立公司）和 Matrix（Johnson Health
              Tech）以商用设备性价比和部分数字连接能力竞争，但在 AI 训练个性化深度上不及 Technogym 或 EGYM。


              现状和替代方案包括：对雇主来说，现金健康津贴或单一健身房企业会员（没有网络开销）；对健身房运营商来说，任何 tier-1 OEM 的模拟循环训练设备、非 EGYM 俱乐部管理软件（Jonas、Perfect
              Gym），或内部数字化建设项目。内部自建替代确实存在，但并不常见；多数中型健身房运营商缺少复制 EGYM 训练数据管线所需的工程资源。未来可能进入者包括 AI
              驱动的家庭健身平台（Tonal、Vitruvian）向商用场景扩张，以及大型健康保险公司自建或收购健身房接入福利网络，直接在雇主资助健康渠道竞争。
