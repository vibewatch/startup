      - number: '6.2'
        title: 具名客户证明与铺开动态
        blocks:
          - type: paragraph
            body: >-
              截至 2025–2026 年，EoS Fitness 是 EGYM 在美国最有分量的客户背书。2025 年 10 月，EoS 成为美国首家在全网络商业化上线 EGYM Genius AI 的大型健身房连锁。EoS
              在 Arizona、Florida、Georgia、Nevada、Southern California、Texas 和 Utah 拥有 200+ 门店，会员费起价为每月 $9.99，代表 HVLP（High
              Value, Low Price）大众市场运营商分部。EoS 健身执行副总裁 Rowdy Yates 表示：“EGYM Genius 让私人教练能专注于最重要的事——会员进步。”铺开从 Plano, Texas
              和 Port St. Lucie, Florida 等精选门店开始，再扩展至所有配备 EGYM Smart Strength 设备的 EoS 门店。EGYM CPO John Ford 确认，EoS
              会员受益于“超过七十亿个 EGYM Genius 数据点提供的洞察”。


              在英国，Places Leisure（101 个休闲设施、年访问量 30 million+）于 2025 年 3 月正式建立 EGYM 战略合作，并在 2025 年晚春前把 Fitness Hub
              部署到全部物业，同时在精选地点上线 Genius AI。Places Leisure 健身负责人 Sarah Roberts 称 EGYM 的 Fitness Hub
              是“我们健身房留存路线图的金线”。英国还提供了 Vivacity Premier Fitness 案例：Peterborough 的 Vivacity Premier Fitness 于 2023 年 12
              月上线 EGYM，六个月内实现创纪录留存；EGYM 英国团队确认导入 1,200+ 名会员（50%+ 超过 50 岁），留存率 85%，力量提升 18.2%，50 岁以上队列 BioAge 平均降低 8.7
              年。Vivacity 客户与销售负责人 Ian Rowe 将其影响描述为“对俱乐部财务表现前所未有”。


              雇主端，EGYM Wellpass 的 Kombo HRIS 案例研究披露了一家大型法国零售公司（未具名，法国最大零售公司之一），因内部安全政策要求，通过安全 SFTP 整合完成导入。一位使用 Workday 的
              HR 经理表示：“会员管理以前每个月都要花我好几个小时，但现在一切都自动化了，我再也不用担心。”Hussle 收购（2024 年 3 月，英国）带来包括 AXA Health、Bupa 和
              IWG（全球最大服务式办公室提供商）在内的企业客户。这些具名雇主背书横跨保险、咨询和房地产，验证了 Wellpass
              的多行业渗透。所有列出的部署均为生产环境（不是试点），证据包括活跃计费、具名引语和多年合同承诺。
