      - number: '3.3'
        title: 护城河耐久性、切换成本与替代风险
        blocks:
          - type: paragraph
            body: >-
              EGYM 的主要护城河是嵌入硬件的切换成本、数据网络效应，以及 Playlist 合并带来的分销力量。EGYM Ecosystem 通过自有固件、会员凭证系统（EGYM chip/RFID），以及基于 7
              billion 个训练数据点和 410 million 次评估校准的 AI 训练个性化，把健身房运营商锁住。替换 EGYM
              意味着同时更换硬件、会员管理软件和训练数据管线——对典型健身房而言，这是数十万美元级投入。七到十年的设备升级周期进一步拉长了嵌入期限。行业观察者指出，距离 EGYM 合同续约还有 12–18
              个月的场馆，在合并后谈判杠杆会明显下降，集成合同价格可能上涨 15–30%。


              Playlist 合并增加了一层分销护城河：88,000+ 个 ClassPass 场馆、40,000+ 家 Mindbody 商户，以及 Playlist 的 AI 工具（Messenger
              AI、SmartTools、EGYM Genius）现在共用基础设施。健身房运营商选择 EGYM Technology，就间接获得 ClassPass 消费者发现和 Mindbody
              排课能力——形成任何单一竞争对手都给不了的交叉销售价值。


              替代风险真实存在，不应忽视。在 Wellpass 侧，Wellhub 收购 Urban Sports Club 后，欧洲健身房网络深度更强，可能侵蚀 EGYM Wellpass 在 DACH、Benelux
              和英国的本土市场优势，尤其是如果 Wellhub 补贴健身房合作伙伴费用来抢份额。EGYM Wellpass 在 Trustpilot 的评分约 2.9–3.0 星（截至 2026
              年中），反映了消费者对工作室可用性缺口、定价不透明和 Plus1 访客限制的抱怨——这些都是产品可解决的问题，但也显示其用户体验相对 Wellhub 扩张后的网络存在差距。设备侧，Technogym 的
              Google AI 合作和自有 Mywellness SaaS 生态构成可信的长期数字融合威胁，即便 Technogym 当前缺少平行的雇主网络。实体设备层的商品化风险升高：随着 AI
              训练逻辑迁移到软件，硬件差异化下降，低成本 OEM 替代品更容易被替换进来。


              企业买方的多归属风险为中等（雇主可以同时运行 Wellpass、Wellhub 或 FitOn），健身房运营商则较低（EGYM 硬件实际占据健身房地面空间，无法在同一地点与 Technogym
              循环设备双部署，除非资本开支翻倍）。EGYM 设备分部的合作伙伴接入和供应链护城河为平均水平：公司依赖外部制造合作伙伴，一旦中断，需要 12–18 个月通过替代供应商解决。
