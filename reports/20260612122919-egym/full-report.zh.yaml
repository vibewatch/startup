  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础分层——运营商、雇主与终端用户
        blocks:
          - type: paragraph
            body: >-
              EGYM 的客户基础分为三个结构上不同、并通过公司 B2B2C 飞轮相互作用的层级。第一层是健身运营商：商业健身房、休闲信托机构、精品工作室和健康俱乐部，它们购买或租赁 EGYM 智能力量设备，并订阅 SaaS
              平台。截至 2026 年 3 月 Playlist 合并完成，EGYM Technology 已服务全球超过 33,000 个健身场所，高于 2024 年 9 月 Series G 时的约 18,000
              个。这些运营商从 EoS Fitness（200+ 门店）等大型美国连锁，到 Places Leisure（101 个设施）等英国休闲信托机构，通常签署多年捆绑合同，同时覆盖硬件和云软件，单设施每月约
              $3,500。它们是 EGYM Technology 硬件和 SaaS 收入的主要驱动。


              第二层是订阅 EGYM Wellpass 的企业雇主。截至合并公告，EGYM Wellpass 服务超过 20,000 家雇主伙伴，高于 2024 年 9 月 Series G 时的 14,000
              家企业客户和超过三百万名符合资格员工。CB Insights 验证的具名企业客户包括 Allianz、McKinsey & Company 和 Boston Consulting Group。EGYM
              Wellpass 只能通过雇主渠道获取——没有直接面向消费者的注册路径——这让获客风险集中在企业销售动作和年度 HR
              福利周期上。在雇主与员工共同出资的模式下，雇主每月只为活跃用户付费，减少被动注册浪费，但如果激活率下降，收入波动会被放大。HRIS 整合（SAP
              SuccessFactors、Workday、Personio、Payfit）自动化员工生命周期管理，是关键企业留存抓手。


              第三层是终端锻炼者——实际使用平台的个人员工和健身房会员。2026 年 3 月，合并后的 Playlist-EGYM 生态在 30+ 个国家拥有数百万月活用户；EGYM Technology 在 Series G
              时单独报告六百万名月活锻炼者。用户人口结构集中在 30–55 岁职业人群（高学历、时间紧），另有约 22% 欧洲活跃用户年龄在 60 岁或以上，构成 Silver Economy
              队列。性别分布大致均衡。Vivacity Premier Fitness 案例研究——第一年导入 1,200 名会员且留存率 85%，其中一半超过 50 岁——说明 EGYM 用来面向健身房运营商差异化获客的
              50 岁以上参与逻辑。
