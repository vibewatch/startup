      - number: '6.3'
        title: 留存、满意度与合同耐久性
        blocks:
          - type: paragraph
            body: >-
              EGYM 最扎实的留存证据，是公司发布的一项基于 210,000 名会员的研究：从第一次训练就使用 EGYM 开始健身旅程的健身房用户，整体留存比非 EGYM 会员高 19%，取消风险低
              24%。机制在于结构化、个性化入会：EGYM 的引导式首次训练能在规模上形成可统计观察的习惯养成。这项研究支撑公司核心运营商价值主张，也是 EGYM
              宣称可通过降低流失来降低健身房会员获客成本的依据。Vivacity Premier Fitness 85% 留存率（六个月快照）在单站点层面、针对特定 50 岁以上队列印证了这一点。EGYM 的运营商合同平均
              3–5 年，并采用硬件-软件捆绑定价，为健身房运营商创造多年经常性收入可预测性和高切换成本。


              EGYM Wellpass 的雇主计费模式——按月为每名活跃用户计费——形成了结构上不同的留存画像。由于雇主只为已激活员工付费，注册激活率直接影响 Wellpass 收入。EGYM 投资 HRIS 整合（通过
              Kombo 覆盖 SAP、Workday、Personio、Payfit 的统一 API），以自动化员工入职和离职流程，从而降低行政性流失并提升激活率——但底层激活率（符合资格员工中实际激活 Wellpass
              会员的比例）仍未披露。EGYM 没有公开 NRR、GRR 和雇主流失指标；这些是投资人尽调 Wellpass 分部最关键的缺口。


              反向满意度信号具有实质性。EGYM Wellpass GmbH 的 Trustpilot 评分为 3.2/5（评级为“Average”），来自 169+ 条评论，低于此前引用的
              2.9/5。评论中最主要的投诉主题是只能通过 app 进入场馆，健身房签到需要手机有电，用户把它视为安全和便利风险。一条 2025 年 2 月评论明确写道：“I am a paying customer.
              This is deceiving customers,” 指向仅有聊天机器人支持的闭环。EGYM Wellpass 在 Google Play 的 app（法国原 Gymlib）评分约 3.8/5，来自
              5,200+ 条评论，早期 bug 报告已被后续更新部分解决。这些评分低于顶级 B2B SaaS 基准，在雇主 HR 买家市场构成声誉风险，因为员工对福利的满意度本身就是买方指标。
