      - number: '5.5'
        title: 信任、隐私、合规与知识产权
        blocks:
          - type: paragraph
            body: >-
              EGYM 的数据治理框架区分“Gym Data”（代表健身房运营商处理，例如从 MMS 同步的会员记录）和“Workout
              Data”（由终端用户控制，例如训练历史、健康测量、BioAge）。这种双重角色结构——EGYM 对健身房是数据处理者，对用户是数据控制者——支持 GDPR
              的数据最小化和同意要求，同时不要求每个用户为运营数据流在健身房侧逐一授权。EGYM 官方数据保护文件称，所有第三方云和软件处理方无论地理位置如何，都必须遵守
              GDPR，并持有公认的数据处理和安全认证。敏感生物识别功能（BioAge、力量测试结果、柔韧性评分）启用前需要会员明确同意。知识产权方面，EGYM GmbH 持有已授权美国专利 12383793（2025 年 8
              月 12 日）和 12109457（2024 年 10 月 8 日），覆盖带智能阻力控制、执行器和基于摄像头用户监测的训练机器组件。专利 12383793
              明确包含用于监测用户动作形态的摄像头技术，这是竞品设备中并不常见的差异化硬件能力。重大缺口包括：公开文件中未出现独立确认的 SOC 2 或 ISO 27001
              认证；没有公开渗透测试报告；仅凭公开来源无法验证完整国际专利组合数量。EGYM 的安全姿态主要依赖自我证明；独立审计确认应列入尽调要求。
