      - number: '7.4'
        title: 运营、供应链与客户集中风险
        blocks:
          - type: paragraph
            body: >-
              EGYM 的 Smart Strength 硬件在德国生产，电子组件包括传感器、电机控制器、显示硬件和嵌入式计算，因此暴露于全球半导体供应链。Moody's 2026 年半导体供应链分析记录了结构性瓶颈：TSMC
              控制约 70% 的先进制程芯片制造，特种化学品和基板供应商高度集中且冗余极少，光刻设备交期仍然很长。美中贸易政策中的地缘政治升级可能在几乎没有预警的情况下扰乱组件可得性，并快速推高成本。对 EGYM
              而言，公司与健身房运营商签署 3–5 年硬件租赁合同；如果新设备周期中出现重大组件成本通胀或供应中断，将直接压迫硬件利润率，而硬件利润率相较 75% 订阅收入目标本已偏薄。EGYM
              没有公开披露半导体采购策略或供应商集中度，使其成为重要未验证缺口。


              客户服务质量是已有记录的反向信号。EGYM Wellpass Trustpilot 评分为 2.9–3.2/5（82+
              条评论），主要由反复出现的投诉驱动：付费客户联系不到人工支持，被困在聊天机器人循环中，也收不到回电。EGYM North America 设备品牌在 Birdeye 上评分
              2.3/5。这些信号不利于雇主合同续约，因为 HR 福利管理员把支持质量列为关键续约标准。仅聊天机器人支持模式可能反映合并后的成本优化，但在面向雇主的 Wellpass
              产品中会引入系统性流失风险，因为企业买家期待人工关系管理。


              两个业务单元都存在客户和渠道集中风险。EGYM Technology 的设备 rollout 量不成比例地依赖少数大型多门店健身房连锁（EoS Fitness 200+ 门店；Places Leisure 101
              个设施）；失去此类锚定运营商之一，会实质性降低部署速度。EGYM Wellpass 完全通过雇主 HR 福利渠道分发，没有 DTC 兜底。如果企业健康预算在宏观下行中收缩——Wellhub 和 Gallup
              数据均显示这是一项风险，且只有 22% 员工福祉参与度——渠道集中不会提供多元化缓冲。医疗成本上升（预计年增 7%）提供有利长期顺风，但短周期 HR 预算决策可能暂时压制 EGYM Wellpass
              收入增长，且与产品质量无关。
            claimRefs:
