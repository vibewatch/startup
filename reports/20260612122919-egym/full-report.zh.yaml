  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 竞争与市场替代风险
        blocks:
          - type: paragraph
            body: >-
              EGYM 最重要的短期竞争风险，是 Wellhub 在 2025 年 9 月以 $600M 收购 Urban Sports Club 后，成为资金充足的直接对手。合并后的 Wellhub 现服务 18 个国家的
              39,000 家企业客户，把五百万名员工订阅者连接到 97,000 家健康伙伴——客户数几乎是 EGYM Wellpass（超过 20,000 家雇主伙伴）的两倍。关键在于，收购 Urban Sports
              Club 让 Wellhub 深入 EGYM 的德国和 DACH 本土市场，消除了 EGYM 自慕尼黑创立以来享有的关键地域缓冲。Wellhub
              向整体健康福利转向，把心理健康、营养、治疗和睡眠与健身一起整合，定位上比 EGYM Wellpass 的健身优先网络更完整，威胁 EGYM 在年度 HR 福利采购周期中的雇主续约率。


              第二个系统性风险来自 Playlist-EGYM 合并本身。整合把原本分开采购的三层技术（硬件、内容平台、会员互动软件）压缩进单一实体，消除了过去约束 EGYM 对运营商定价权的竞争张力。Keedia
              的独立运营商分析（2026 年 5 月）预计，目前每月为 EGYM 硬件和软件捆绑支付 $3,500 的设施，在统一 Playlist-EGYM 定价铺开后，续约月费可能升至
              $4,000–$4,500，比合并前基准高 15–30%。HFA Show 2026 有超过 10,000 名健身行业专业人士参会，其识别出的运营商主要焦虑类别是 AI
              整合和技术整合。更广泛的整合浪潮（Zwift/ROUVY；MyFitnessPal/Cal AI）也在同时压缩运营商采用多元化同类最佳供应商栈的选择，放大锁定风险。


              员工参与度逆风是 EGYM Wellpass 的第三个结构性风险。Wellhub 2025 年 9 月新闻稿引用的 Gallup 研究显示，只有 22% 的员工强烈认同雇主关心他们的身心健康，较 2020 年的
              49% 大幅下降。低激活率会直接侵蚀 EGYM Wellpass 所依赖的按活跃用户计费收入模型，因为雇主只为月活用户付费。如果宏观压力导致雇主削减健康福利预算，或员工降低使用频次，EGYM Wellpass
              收入会直接暴露。
