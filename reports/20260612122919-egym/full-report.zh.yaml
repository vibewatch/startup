        - 估值 $4.2B；累计融资 $867.5M；$319M ARR（2025）；39,000 家企业客户；以 $600M 收购 Urban Sports Club（2025）
        - 全球中大型雇主
        - 最广的健身房 / 健康福利合作网络（97,000 个合作伙伴，18 个国家）；SaaS 合同模式；USC 在欧洲有深度
        - 没有自研健身房硬件；纯聚合模式相比 EGYM 限制数据深度
      - - Technogym
        - 联网健身房设备 + 数字平台
        - 上市公司（TGYM.MI）；2025 年收入 €1.02B；调整后 EBITDA €220M；全球 100,000+ 个中心
        - 高端健身房、酒店、企业健身中心、高端消费者
        - 奥运级品牌；€1B+ 收入；Google AI 合作；Mywellness SaaS 生态
        - 没有雇主健康福利网络；自有硬件集成限制开放性；定价高端
      - - Life Fitness / Hammer Strength
        - 商业健身房设备
        - 私营；估计收入 >$800M；全球运营；HFA 2026 参展商
        - 商业健身房、健身俱乐部、酒店业
        - 耐用性口碑；残值最高；有广泛的有氧和力量产品线
        - AI 训练个性化深度有限；没有雇主网络；数据护城河弱于 EGYM
      - - Matrix（Johnson Health Tech）
        - 商业健身房设备
        - 私营；估计 Johnson Health Tech 收入 ~$1B；垂直整合 OEM
        - 大型健身连锁、企业设施、酒店业
        - 垂直整合优势（制造 + 软件）；性价比
        - 品牌声望低于 Technogym；数字生态深度不及 EGYM
      - - FitOn Health（含 Peerfit）
        - 数字企业健康福利（美国）
        - 累计融资 $124M；$48.7M Series D 轮（2025 年 1 月）；$12M ARR；20M+ 消费者用户；13,000 家雇主
        - 美国雇主和医保计划
        - 大型消费者内容库；接入医保计划；收购 Peerfit 健身房准入网络
        - 规模小于 Wellhub/EGYM；欧洲布局有限；硬件能力很弱
      - - Benify
        - 员工福利 / 全面薪酬平台
        - 私营；聚焦全球企业；定制定价
        - 全球大型企业；HR / 全面薪酬买方
        - 综合福利平台（折扣、奖励、健康福利）；对跨国公司本地化能力强
        - 健身网络只是众多福利之一；不是专门的健身房准入聚合平台
      - - Tonal / Vitruvian / OxeFit
        - AI 驱动的智能力量训练（D2C/商业）
        - Tonal：累计融资 ~$450M；Vitruvian 和 OxeFit：更早期
        - 精品健身房、家庭用户、企业创新试点
        - AI 阻力平台；占地小；无需传统配重块即可个性化训练
        - 商业健身房规模下尚未验证；企业健康福利网络集成有限；没有雇主网络
      - - 现状 / 现金健康福利津贴
        - 替代方案（无供应商）
        - N/A
        - 较小雇主；成本敏感型 HR 买方
        - 采购复杂度为零；员工使用灵活
        - 没有网络、没有数据、没有参与度报告；员工使用率低
    notes: >-
      规模和融资数据来自最新可得公开来源（2025–2026）；私营公司的收入和估值数字为第三方估计。Wellhub（$319M）和 FitOn（$12M）的 ARR 数字来自第三方数据聚合商，可能与官方披露不一致。Life
