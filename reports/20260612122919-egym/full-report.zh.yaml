chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、商业模式与产品
        blocks:
          - type: paragraph
            body: >-
              EGYM 是一家总部位于德国慕尼黑的健身科技公司，成立于 2010 年，对外使命是把医疗健康「从修复转向预防」。公司围绕两条核心产品线，搭出垂直整合的健身与健康平台：EGYM Technology 和 EGYM
              Wellpass。EGYM Technology 覆盖联网智能力量训练设备、云软件和 EGYM Genius AI 训练平台。EGYM Wellpass 是 B2B
              企业健康订阅网络，把雇主连接到经过筛选的健身与健康设施网络。


              商业模式是 B2B2C：EGYM 向健身运营商出售联网健身设备和软件（B2B），让运营商改善会员体验（B2C），同时通过 Wellpass 网络连接健身房与企业雇主。截至 2024 年 9 月，EGYM 约
              75% 的收入来自订阅，25% 来自硬件，CEO 称这种结构是长期价值主张的核心。2024 年推出的 AI 训练平台 EGYM Genius，使用基于超过 7 billion 个训练数据点和 410
              million 次评估训练的机器学习模型，并接入 200+ 家设备和软件合作伙伴，在联网设备和模拟设备上生成个性化训练计划。截至 2026 年，EGYM 生态在全球连接 33,000+ 个健身场所，服务 7.5
              million+ 月活锻炼者。公司总部在慕尼黑，在美国科罗拉多州丹佛有重要布局，业务覆盖德国、奥地利、法国、比利时、英国和美国。
