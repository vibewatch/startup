          - type: callout
            title: SAM/SOM 规模依赖分析推导——没有独立估算发布
            body: >-
              已审阅的分析机构都没有独立发布健身即福利网络子分部或 EGYM 特定 SAM 的市场规模。本章所有 SAM/SOM 数字，均由雇主数量 × 定价 × 渗透率代理推导，或来自 CEO 对 2025 年 $500M
              收入的预测。尽调买方应把这些数字视作合理的数量级估计，在经审计财务数据出现前，不应当作市场验证过的规模。
