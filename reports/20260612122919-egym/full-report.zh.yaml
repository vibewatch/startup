        - 法律数据室；经审计财务报表或经确认的管理层陈述
      - - 并购后定价影响和运营商流失
        - 2026 年 3 月并购交割后，EGYM 硬件 / SaaS 捆绑的首轮续约率
        - 预计 15–30% 涨价可能促使运营商转向 Technogym 或其他替代方案
        - 运营商渠道访谈；访谈 5–10 家健身设施运营商，了解续约体验
      - - EGYM 从 Playlist 合并收入中拆出的独立收入
        - EGYM Technology + Wellpass 2025 实际独立数据，剔除 Mindbody/ClassPass 收入
        - 并购后合并报表使 EGYM 具体业绩无法跟踪
        - 数据室；合同性剥离 EGYM 历史分部财务
      - - 按渠道拆分的 CAC 和回本周期
        - 每个健身房运营商和每个 Wellpass 雇主的获客成本；ACV 和回本周期
        - 没有 CAC 数据，Rule of 40 和增长可持续性无法独立评估
        - CFO 数据室；Wellhub 或 Mindbody 已披露指标中的可比 CAC 基准
    notes: 这五项尽调要求，是按当前估值从观察转向买入建议所需的最低条件。
    claimRefs:
