      - number: '7.5'
        title: 附录
        blocks:
          - type: callout
            title: 合并后定价权——运营商锁定是最大短期风险
            body: >-
              Playlist-EGYM 合并已从 EGYM 硬件和软件定价中消除竞争张力。独立运营商分析预计，首个续约周期（2026–2027）价格上涨 15–30%，每月支付 $3,500 的设施可能面对
              $4,000–$4,500 的月度续约价。未来 18 个月内多年合同到期的运营商，在统一定价铺开后议价能力有限。这是最可操作的短期投资逻辑风险，需要直接尽调续约经济性。
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR007
          - type: callout
            title: EU AI Act 合规期限——Genius AI 很可能属于高风险
            body: >-
              EGYM Genius 处理健康和生物识别数据，以生成自动训练建议和 BioAge 评估，使其接近或落入 EU AI Act 的高风险类别。按现行文本，法定期限为 2026 年 8 月 2 日；推迟至 2027
              年 12 月仍待正式通过。公司未公开披露独立 AI Act 合规认证。罚款最高达 €35M 或全球年营业额 7%——对于收入 $800M+ 的合并实体，这是实质性敞口。
            calloutType: risk
            claimRefs:
              - CR011
              - CR012
              - CR010
          - type: callout
            title: 下次投资决策前的尽调优先事项
            body: >-
              三个尽调问题最关键：（1）索取 EGYM Genius 的 EU AI Act 准备度评估和 AI 分类备忘录；（2）获取独立的 EGYM 财务数据，或 Playlist
              合并后的分部拆分，以验证单位经济性；（3）独立访谈运营商续约情况，确认 15–30% 的提价是否正在落地，还是遭到挑战。截至 2026 年 6 月，AI
              合规、财务透明度和运营商留存这三项缺口，是承销判断中的主要不确定性。
            calloutType: recommendation
            claimRefs:
