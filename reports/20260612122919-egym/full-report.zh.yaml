  - id: FE002
    title: 会员训练工作流 — 从入会到留存循环
    type: flow
    layout: standard
    summary: 健身房会员如何穿过 EGYM 互联生态系统，从首次接触走向习惯性参与。
    data:
      nodes:
        - id: onboard
          label: Fitness Hub 入会引导
          description: 身体扫描、力量测试、BioAge 基线；发放 NFC 腕带（全套循环约 30 分钟）
        - id: plan_gen
          label: Genius AI 计划生成
          description: AI 调用 11B 数据点和会员画像，生成首日个性化计划
        - id: workout
          label: 机器引导训练
          description: NFC 登录自动调节器械（<4 秒）；18.5 英寸屏幕实时反馈 ROM / 速度 / 次数
        - id: data_capture
          label: 实时数据捕获
          description: 组数、次数、重量、节奏、活动范围在训练期间上传至 EGYM Cloud
        - id: adapt
          label: AI 计划自适应
          description: Genius 重新校准下一次训练；根据缺席训练、疲劳信号和目标进展调整
        - id: trainer_loop
          label: 教练监督（可选）
          description: Trainer App 显示会员计划和进展；一键下发计划；每个计划节省 >15 分钟
        - id: retention
          label: 留存与游戏化
          description: BioAge 进展展示、Gameday 挑战、排行榜推动会员回访（留存 +19%）
      edges:
