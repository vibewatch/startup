      - number: '5.4'
        title: 部署、可靠性与路线图
        blocks:
          - type: paragraph
            body: >-
              EGYM 的部署模式走企业对企业对消费者（B2B2C）路径：健身房运营商购买并安装 EGYM Smart Strength 循环训练设备和云软件订阅，个人会员再使用硬件和应用。新会员完成 11
              台机器循环的入会流程约需 30 分钟，包括力量测试和首次指导训练。EGYM 通过专门支持门户服务运营商，分别为运营商和会员设置升级路径，并提供按国家划分的联系人。平台基础设施状态通过 Atlassian
              Statuspage 页面公开。路线图承诺通过定期产品更新通讯和新闻稿披露，最近一次是 2026 年 1 月 28 日的 2025 年 Q4 更新，以及 2026 年 3 月 HFA 上 Series 3
              首秀。近期关键里程碑包括 Smart Strength Series 3 正式上市（2026 年 7 月 1 日）、Longevity Training Program（2026 年 7 月），以及 Max
              Out 和 Genius 在美国门店继续扩张。一条来自独立用户评论（2025 年 1 月）的反向信号记录称，EGYM Fitness Hub 在多次入会流程中系统性低估身高约 ~0.5
              inches，需要员工校正。同一评论还指出有氧测试 UX 不完整：在 EGYM 整合的第三方有氧硬件上中途放弃测试，会留下损坏的 BioAge
              分数，且没有公开的自助重置路径，显示混合硬件流程存在可靠性缺口。CEO Roesch-Schlanderer 的表述概括了战略框架：“产品可以复制。多年数据堆出来的整合式学习系统无法复制。”
