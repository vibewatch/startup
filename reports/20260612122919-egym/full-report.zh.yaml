      - number: '1.5'
        title: 里程碑、收购与反向信号
        blocks:
          - type: paragraph
            body: >-
              从创立到 2026 年合并，EGYM 的路径是一系列克制推进的融资、产品和收购里程碑。关键收购扩张了 Wellpass 网络：Gymlib（法国，2022 年 3 月）、Hussle（英国，2024 年 3
              月，1,500+ 家健身房，覆盖 96% 英国邮编），以及 FitReserve（美国，2024 年 9 月，60+ 个市场中的 2,000 家工作室和健身房合作伙伴）。2024 年推出 EGYM Genius
              AI，以及在 HFA 2026 发布 Smart Strength Series 3，标记了公司的产品创新轨迹。2025 年 9 月，EoS Fitness 成为第一家全链路铺开 EGYM Genius
              的美国大型健身连锁。


              反向一面，截至 2026 年初，EGYM Wellpass 在 Trustpilot 的评分为 3.2/5，评论者提到难以联系到人工客服，并在自动聊天机器人中反复循环。Playlist-EGYM
              合并引发了行业对供应商锁定的担忧：分析师评论指出，签有 EGYM 设备合同的健身房运营商在硬件、软件和数据管线三层同时面临切换成本，合并后续约价格可能比合并前基准高出 15–30%。这种整合风险并非 EGYM
              独有，但 EGYM 的垂直整合技术栈和合并后实体的市场位置放大了风险。EGYM 大规模收集生物识别和训练数据带来数据隐私暴露；截至目前尚无已披露的数据泄露，但作为行业层面风险值得持续跟踪。
