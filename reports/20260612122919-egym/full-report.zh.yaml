      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: NRR 未确认，倍数偏高
            body: >-
              $7.5 billion 合并企业价值隐含 9.4× EV/revenue，比 2026 年 6 月上市 SaaS 6–7× 的中位数高 50%，比 Technogym 这一具流动性的上市可比高 3.1×。只有当
              Wellpass 雇主 NRR 超过 110%、混合毛利率超过 65% 时，这一溢价才有支撑。两项指标都未公开披露，形成了仅靠公开来源无法闭合的估值缺口。
            calloutType: risk
            claimRefs:
              - CV006
              - CV018
              - CV020
              - CV044
          - type: callout
            title: 股权流动性是一阶风险
            body: >-
              EGYM 股东持有的是全私有 Playlist 实体的股权；该实体没有披露 IPO 时间表，没有二级市场机制，且合并明确终止了此前 Mindbody-ClassPass 的 IPO 计划。AInvest 将
              Playlist-EGYM 合并称为一笔“缺乏流动性的赌注”，其回报完全取决于未来退出执行。Vista Equity Partners 通常持有四到七年，意味着最早退出窗口大约在 2030–2033 年。
            calloutType: risk
            claimRefs:
              - CV025
              - CV036
              - CV039
              - CV043
          - type: callout
            title: 合并后倍数假设的平台协同尚未证明
            body: >-
              EGYM 保守定价的 2.4× Series G 倍数跃升到 9.4× 合并倍数，桥梁是一个未经检验的假设：把硬件、SaaS、ClassPass 消费者端和 Wellpass
              雇主端统一到同一实体后，价值会相乘，而不只是相加。这种“平台之上的平台”溢价，在同等规模的健身科技领域没有直接可比先例；在三大地理市场整合四条不同产品线，执行风险很高。
            calloutType: assumption
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV042
          - type: callout
            title: Series G 定价保守；合并溢价反映真实战略价值
            body: >-
              按目标收入 2.4× 计算，EGYM $1.2 billion 的 Series G 估值显著低于 Wellhub ARR 倍数（~13.2×）和上市 SaaS 中位数（6–7×）。合并后的 9.4×
              合并收入倍数绝对值偏激进，但也代表一家 75% 经常性收入、EBITDA 盈利平台向市场定价收敛。来自世界级投资者（Vista、Temasek、L Catterton）的 $785 million
              新股资金，本身就是高置信信号：成熟机构资本已经承销了这一估值。
            calloutType: strength
            claimRefs:
              - CV001
