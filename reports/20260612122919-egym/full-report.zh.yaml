      - number: '2.2'
        title: 市场规模——用多重视角看 TAM、SAM 和 SOM
        blocks:
          - type: paragraph
            body: >-
              全球企业健康市场在 2026 年的估算稳定落在 $72–82 billion 区间，2030–2035 年前 CAGR 预测为 6–9%，取决于分析机构和方法。Fortune Business Insights
              给出的 2026 年数字为 $71.89 billion（至 2034 年 CAGR 6.41%），Precedence Research 为 $72.73 billion（至 2035 年 CAGR
              7.36%），The Business Research Company 为 $81.6 billion（至 2030 年 CAGR 9.1%）。这些估算之间 $10-billion
              的差距，主要来自纳入口径分歧——尤其是是否把职业健康强制支出、EAP 临床服务和现场项目与健身网络订阅一起计入。上述支出类别本质不同，头部数字不应互换使用。


              欧洲企业健康子市场在 2025 年估计为 $20.43 billion（Statifacts），仅德国市场 2026 年约 $5.3 billion（Knowledge Sourcing），到 2031 年增长至
              $7.1 billion。这些地区是 EGYM Wellpass 当前最强的既有市场。健身即福利网络子分部（EGYM Wellpass
              直接竞争的窄切片）没有任何已审阅分析机构单独量化；目前最可信的可用代理，是雇主按员工支出约 €70/月 × 可触达员工人口。仅德国就有约 46 million 就业人员；即便大型雇主健身福利项目渗透率只有
              5%，隐含年度雇主支出也约为 ~€1.9 billion——与 EGYM Wellpass 披露的 24,000 家雇主合作伙伴规模相符。


              联网健身设备和软件市场需要分开计量。Research and Markets 估计，联网健身设备市场 2026 年约 $2.1 billion，到 2032 年增长至 $4.66 billion（CAGR
              14%）；Fortune Business Insights 估计 2026 年为 $4.12 billion，到 2034 年达到 $19.41 billion（CAGR
              21.4%）——基准估计几乎翻倍，原因在于是否把 AI 软件、云订阅和内容平台与硬件一起计入。全球健身房管理软件预计 2026 年为 $2.23 billion；健身 AI 增速更快，2025 年为 $10.68
              billion，到 2035 年为 $57.80 billion（CAGR 19.3%）。EGYM 在设备和 Wellpass 两类产品上的 SOM 是受证据约束的估算：按当前定价、33,000+ 个健身场所和
              24,000+ 家雇主合作伙伴推算，隐含 ARR 约在 $400–600 million 区间，与 CEO 对 2025 年 $500 million 收入的预测一致，但缺少独立佐证。
