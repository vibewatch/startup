  - id: FV001
    title: 推荐逻辑 — 从证据到观察决定
    type: flow
    layout: standard
    summary: 从 EGYM 的规模、财务证明、风险画像和估值分析，推导到中等置信度的观察 / 继续研究建议。
    data:
      nodes:
        - id: scale-proof
          label: 规模与平台证明
          description: $800M+ 合并收入；33K+ 个场馆；7.5M MAU；EBITDA 盈利
        - id: recurring-moat
          label: 经常性收入护城河
          description: 75% 订阅；3–5yr 设备合同；20K+ 雇主伙伴
        - id: valuation-mark
          label: 估值：合并 EV $7.5B
          description: 2025 年合并收入的 9.4×；Series G 独立估值 $1.2B+；新增股权 $785M
        - id: comp-gap
          label: 可比差距：9.4× 对比 SaaS 中位数 6–7×
          description: Technogym 为 3×；Peloton 为 1.2×；溢价需要平台协同证明
        - id: evidence-gaps
          label: 关键证据缺口
          description: NRR 未披露；毛利率未经审计；并购后定价影响未知
        - id: risk-profile
          label: 风险画像：高
          description: 股权流动性不足；Wellhub DACH；运营商定价权；GDPR/AI Act
        - id: recommendation
          label: 建议：观察
          description: 继续研究 — NRR 和利润率尽调闭环后再回看
      edges:
        - from: scale-proof
          to: valuation-mark
          label: 支撑平台溢价
        - from: recurring-moat
          to: valuation-mark
          label: 支撑类 SaaS 倍数
        - from: valuation-mark
          to: comp-gap
          label: 对比上市可比公司
        - from: comp-gap
          to: evidence-gaps
          label: 没有它，溢价无法验证
        - from: evidence-gaps
          to: recommendation
          label: 推动观察而非买入
        - from: risk-profile
          to: recommendation
          label: 抬高谨慎度
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV018
      - CV025
      - CV044
  - id: FV002
    title: 估值敏感性 — 在 $800M 合并收入上，不同收入倍数隐含的 EV
    type: bar
    layout: wide
    summary: 合并后的 Playlist-EGYM 企业价值对 EV/收入倍数的敏感性，范围从 Peloton 困境可比公司（1.2×）到 SaaS 前四分位倍数（14×），并突出当前交易价格（9.4×）。
    data:
      items:
        - label: Peloton 困境可比：1.2×
          value: 960
          detail: Peloton 在 $2.4B 收入上的 EV/收入约 1.2×；适用于互联健身困境情景
        - label: Technogym 上市可比：3.0×
          value: 2400
          detail: Technogym 偏硬件倍数；设备 + 软件混合业务的下限
        - label: 私有 SaaS 中位数：4.2×
          value: 3360
          detail: Windsor Drake / Aventis 2025–2026 年私有 SaaS 中低端市场中位数
        - label: 上市 SaaS 中位数：6.5×
          value: 5200
          detail: 2026 年 6 月上市 SaaS 中位数（6–7× 区间中点）；包含 AI 原生公司的离散度
        - label: 当前交易：9.4×
          value: 7500
          detail: Playlist-EGYM 2026 年 3 月交易价格；$785M 新增股权锚定该估值
        - label: Wellhub ARR 可比：13.2×
          value: 10560
          detail: Wellhub 隐含倍数（$4.2B / $319M ARR 按 EGYM 收入放大）；作为上限
        - label: SaaS 前四分位：14×
          value: 11200
          detail: 上市 SaaS 前四分位（CrowdStrike 档位）；需要 NRR >120% 且 Rule of 40 >50%
    approximationNotes: >-
      所有 EV 数值均以百万美元计，套用于 $800M 的 2025 年合并收入。Wellhub 倍数来自二级市场标记隐含值，不能与一级轮定价直接比较。Technogym 和 Peloton 倍数为截至 2026 年 H1 的
      LTM 公开市场数据。
    claimRefs:
      - CV006
      - CV008
      - CV010
      - CV012
      - CV015
      - CV018
      - CV019
  - id: FV003
    title: 估值与回报区间 — 乐观 / 基准 / 悲观结果
    type: range
    layout: standard
    summary: 展示乐观、基准和悲观情景下 Playlist-EGYM 合并企业价值区间，以及各情景中归属于 EGYM 的独立价值。
    data:
      items:
        - label: 合并 EV — 悲观（USD B）
          low: 3.5
          high: 4.5
          note: $800M 收入的 5×；整合失败 + 运营商流失 + Wellhub DACH 替代
        - label: 合并 EV — 基准（USD B）
          low: 7.5
          high: 9
          note: 收入的 9–11×；整合中度成功；NRR 稳定；收入 CAGR 15%
        - label: 合并 EV — 乐观（USD B）
          low: 12
          high: 18
          note: 基于 2027E $1.4–1.6B 收入给 12–15× 远期收入倍数；AI 平台协同完全兑现
        - label: EGYM 独立归属价值 — 悲观（USD B）
          low: 1.5
          high: 2.5
          note: 低于 Series G 独立 $1.2B+ 标记；整合失败摧毁溢价
        - label: EGYM 独立归属价值 — 基准（USD B）
          low: 3
          high: 4.5
          note: 约 50% 收入归属，隐含 9–11×；符合战略价值
        - label: EGYM 独立归属价值 — 乐观（USD B）
          low: 5
          high: 7
          note: AI 平台溢价完全兑现；EGYM Genius 撬动雇主和运营商高端定价
    approximationNotes: 区间是使用可比倍数和已披露收入数据作出的分析估计。EGYM 独立归属价值假设约 50% 的合并收入来自 EGYM。并非经审计财务预测。
