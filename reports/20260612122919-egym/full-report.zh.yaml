      - number: '7.2'
        title: 监管、隐私与 AI 合规风险
        blocks:
          - type: paragraph
            body: >-
              EGYM 在完整产品栈中处理 GDPR 第 9 条定义的特殊类别数据：会员健康问卷（PAR-Q 等价物）、由身体成分分析生成的 BioAge 生物识别健身分数、细粒度训练表现历史，以及用于训练 Genius AI
              的 11 billion+ 个训练数据点和 700 million 条评估记录。按 GDPR，处理这些数据既需要合法的第 6 条基础，也需要特定第 9
              条条件——健身场景通常是明确同意；违规罚款最高可达全球年营业额的 4%。欧洲数据保护机构已对错误实施生物识别访问控制的健身房运营商采取行动（一家波兰运营商明确被罚），说明该行业处于监管范围内。EGYM
              的跨境架构——通过第三方承包商在欧盟以及潜在美国托管会员数据——要求每个司法辖区都具备有效传输机制，从而引入多套 DPA 制度下的合规面。


              EU AI Act 带来额外的前瞻性合规期限，直接指向 EGYM Genius。EGYM Genius 作为使用生物识别和健康数据生成个性化健康训练计划的通用 AI 系统，几乎肯定落入或接近 Annex III
              下的高风险 AI 类别（健康、安全和福祉领域 AI 系统）。按现行法规文本，高风险 AI 系统义务——包括风险管理、数据质量治理、偏差测试、人工监督、稳健性要求和 CE 标识——自 2026 年 8 月 2
              日起适用。2026 年 5 月，议会和理事会就暂时推迟至 2027 年 12 月达成一致，但尚未正式入法。罚款最高达 €35M 或全球年营业额的 7%。EGYM 已披露与健身房运营商相关的数据保护政策和 DPA
              框架，但未公开独立 AI Act 合规认证，造成尽调不透明。Latham & Watkins 在合并法律团队中负责数据隐私和监管事项，说明相关义务已被注意到；但认证证据并未公开。


              正面看，截至 2026 年 6 月，公开记录中未发现 EGYM 已确认的网络安全泄露或数据事件，公开泄露追踪器也未列出 EGYM。EGYM
              服务条款包含强制仲裁条款，限制会员纠纷中的集体诉讼敞口。公司公开披露数据保护官联系方式（datenschutz@egym.de），并与健身房伙伴签署正式
              DPA，同时作为数据控制者和数据处理者运营。鉴于所处理健康数据的敏感性和规模，这些缓释因素降低但不能消除剩余监管敞口。
