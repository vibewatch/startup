      - number: '5.6'
        title: 附录
        blocks:
          - type: callout
            title: 数据飞轮优势具备结构性耐久性
            body: >-
              凭借 14 年硬件部署积累的 11 billion 个训练数据点和 700 million 个评估数据点，EGYM 的 Genius AI
              训练语料对任何新进入者而言几乎不可匹敌。每新增一个健身房部署、每新增一次会员训练，这项数据资产都会继续增长，并不断拉大相对竞品的个性化质量差距。EGYM CEO
              关于“多年数据堆出来的整合式学习系统无法复制”的说法，有数据规模和多年先发优势支撑。
            calloutType: strength
            claimRefs:
              - CE002
              - CE019
              - CE031
          - type: callout
            title: 硬件校准与混合设备 UX 可靠性缺口
            body: >-
              一篇独立用户评论记录称，EGYM Fitness Hub 在多次入会流程中存在系统性 ~0.5-inch 身高测量误差，需要员工手动校正。更重要的是，在第三方 EGYM 整合设备上中途放弃有氧测试后，会留下损坏的
              BioAge 分数（一名 51 岁用户得到相当于 85 岁的结果），且没有公开的自助重置路径。两项问题都指向混合硬件流程中的校准和错误恢复缺口，可能削弱会员对 AI 生成评分的信任——鉴于 BioAge
              和评估数据是所有 Genius 计划输出的基础，这构成尽调风险。
            calloutType: risk
            claimRefs:
              - CE033
              - CE034
              - CE037
          - type: callout
            title: 公开文件缺少独立安全认证
            body: >-
              EGYM 的数据隐私姿态依赖自我证明：官方文件提到 GDPR 合规以及对处理方认证的合同要求，但 EGYM 面向公众的材料中没有 SOC 2 Type II、ISO 27001
              或同等第三方审计证书。对于处理数千名员工敏感健康数据的机构型健身房运营商或企业健康买家，缺少独立认证是实质性尽调缺口；尤其是 EGYM 还是用户训练和生物识别记录的中央数据控制者。
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
              - CE028
          - type: callout
            title: Series 3 OS 定位代表商业模式拐点
            body: >-
              Smart Strength Series 3 与同步提出的“健身操作系统”叙事，标志着 EGYM 有意从硬件供应商转向关键基础设施提供商。战略意义在于：EGYM 把健身房完整的数据和运营流程都描述为运行在
              EGYM OS 上，大幅提高切换成本，范围远超单台机器——生态黏性也强于任何单一设备线。运营商一旦把 Genius、Business Suite 和 Wellpass 接入自身工作流，若要离开 EGYM
              硬件，就要承担全栈迁移成本。
            calloutType: insight
            claimRefs:
              - CE001
