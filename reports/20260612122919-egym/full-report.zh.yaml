companyProfile:
  summary: >-
    EGYM 是一家总部位于慕尼黑的健身科技公司，成立于 2010 年，使命是把医疗健康「从修复转向预防」。公司有两条核心业务线：EGYM Technology（联网智能力量训练设备、云软件和 EGYM Genius AI
    训练平台）以及 EGYM Wellpass（B2B 企业健康订阅网络，把雇主连接到 20,000+ 家健身与健康设施）。截至 2026 年 1 月，EGYM 在全球连接 33,000+ 个健身场所，服务 7.5 million+
    月活锻炼者，并与 20,000+ 家雇主合作。2026 年 3 月，EGYM 与 Playlist（Mindbody、ClassPass、Booker）合并，合并后企业价值 $7.5B，并获得 $785M 新股权资金，EGYM 成为
    Playlist 子公司。合并前，EGYM 在八轮融资中累计融资约 $580M+，并在 2024 年 9 月 Series G 交割时确认 EBITDA 盈利。
