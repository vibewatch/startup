      - number: '3.2'
        title: 竞争者画像与能力对比
        blocks:
          - type: paragraph
            body: >-
              Wellhub 是 EGYM 在企业健康分部最强的直接竞争对手。公司累计融资 $867.5M（最新一轮：2024 年 12 月 $149M 后期 VC 轮），估值约 $4.2B，并报告 2025 年 ARR 为
              $319M。其 CFO 明确把公司定位为 B2B SaaS 业务，核心是年度合同、固定平台费和净收入留存。员工定价从免费数字层，到 Diamond 级健身房接入 $344.99/月不等，雇主 PEPM
              费用另行谈判。收购 Urban Sports Club 后，Wellhub 声称按网络广度计算，自己是全球最大的企业健康平台。战略弱点在于没有自有健身房硬件，这让 EGYM 能向健身房运营商提出差异化的「智能设备
              + 网络」主张：运营商既可以成为 Wellpass 目的地，也可以获得技术。


              Technogym 是 EGYM 在健身设备侧最强的竞争对手。它在米兰证券交易所上市，2025 年收入 €1.02B，调整后 EBITDA €220M，净利润 €120M（同比 +33%）。2026 年
              Q1，收入再增长 10.1% 至 €236.8M，其中 B2B 分部为 €185.8M（占总额 78.5%）。Technogym 服务 100,000+ 家健康中心，并为 Milano Cortina 2026
              Winter Olympics 配备设备——这是它连续第十次服务奥运会。公司近期宣布与 Google 合作，在 Mywellness 生态内扩展 AI 服务。不过，Technogym
              不运营面向雇主的健康网络，因此不直接与 EGYM Wellpass 竞争。它的高端定价（定制报价，无公开价目表）、奢侈品牌定位和偏好自有设备集成，形成部分锁定效应，但生态深度不及 EGYM
              的自有硬件-软件技术栈和 7 billion 个已存储训练数据点。


              Life Fitness / Hammer Strength 是一家独立商用设备公司，在 HFA 2026 展示新的联网有氧创新。它靠耐用性和残值竞争。Matrix（Johnson Health
              Tech）受益于垂直整合（制造、软件、分销在同一所有权下），为大型网络和酒店场景提供较强性价比。Life Fitness 和 Matrix 都没有部署类似 Wellpass
              的雇主网络，因此更像单层设备竞争者，而不是全栈健康 OS 对手。


              FitOn Health（此前在雇主健身房接入渠道使用 Peerfit）运营数字优先模式，拥有 20M+ 消费者用户和 13,000 家雇主客户。2025 年 1 月 $48.7M Series D
              为其扩张提供资金，但 $12M ARR 相比 EGYM $800M+ 合并收入，规模差距很大。FitOn 的护城河是内容广度和健康计划集成，而不是实体健身房设备或欧洲网络密度。
