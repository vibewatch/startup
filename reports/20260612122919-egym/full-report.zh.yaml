      - number: '4.2'
        title: 财务表现与增长轨迹
        blocks:
          - type: paragraph
            body: >-
              EGYM 在多轮融资中披露了收入里程碑，为一家欧洲私营科技公司提供了少见的清晰增长图景。2022 年，公司收入为 $130 million，同比增长约 70%；EGYM Wellpass 同期增长超过
              100%。2023 年 7 月 Series F 交割时，管理层预计 2023 年收入将大约翻倍至约 $260 million，并首次实现盈利。2024 年 9 月 Series G 交割时，CEO 向
              TechCrunch 表示预期「2025 年收入为 $500 million」——与此前复合增长轨迹一致。第三方数据聚合商 Latka 另行测得，截至 2025 年 9 月，EGYM US 的 ARR 为
              $80.2 million，说明除主要欧洲基础外，北美也已有实质牵引。


              2026 年 1 月 Playlist-EGYM 合并公告给出了最完整的收入披露：合并实体确认 2025 年合并净收入超过 $800 million，同时「保持高增长势头和强盈利能力」。由于 EGYM 现在与
              Mindbody、ClassPass 和 Booker 一起作为 Playlist 子公司运营，未来不会单独报告 EGYM 独立收入，EGYM 特定财务可见性因此出现永久缺口。CEO 确认 EBITDA
              盈利，但利润率水平、净利润、自由现金流，以及调整后 EBITDA 与报告 EBITDA 的区别，从未公开披露。


              从 $130M（2022）到 ~$500M（2025 目标）的隐含三年 CAGR 约为 56%——对硬件加订阅混合模式来说很突出。Affinity Partners 在 2023 年把 EGYM
              描述为「接近同比翻倍」，印证了增长叙事。不过，缺少经审计披露意味着盈利主张和收入轨迹都依赖公司自发声明，而非独立验证财务数据；这对私营公司来说常见，但对任何承销分析都是实质约束。
