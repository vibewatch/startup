figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: EGYM 从 2010 年创立到 2026 年并入 Playlist 的历程，体现了有纪律的资本节奏、由收购推动的 Wellpass 扩张， 以及 AI 产品投入，最终汇入一次重大整合事件。
    data:
      items:
        - date: '2010'
          label: 在慕尼黑创立
          detail: Philipp Roesch-Schlanderer 创立 EGYM，愿景是把医疗健康从修复转向预防。
          tone: positive
        - date: 2014-07
          label: Series B — $15M
          detail: Highland Capital、Bayern Kapital、HTGF 提供首笔机构资本。
          tone: positive
        - date: 2016-03
          label: Series C — $45M
          detail: HPE Growth 和 Highland Europe 推动欧洲健身房设备与软件业务扩张。
          tone: positive
        - date: '2018'
          label: EIB 债务 — €30.1M
          detail: European Investment Bank 非稀释性贷款支持扩张，不稀释股权。
          tone: neutral
        - date: '2021'
          label: Series E — ~$75M
          detail: Mayfair Equity Partners 领投增长融资；疫情后复苏加速。
          tone: positive
        - date: 2022-03
          label: 收购 Gymlib（法国）
          detail: EGYM 进入法国企业健康福利市场；Wellpass 欧洲版图扩张。
          tone: positive
        - date: 2023-07
          label: Series F — ~$225M
          detail: Affinity Equity Partners 领投独角兽前最大一轮融资；Wellpass 扩至 2.5M 用户。
          tone: positive
        - date: 2024-03
          label: 收购 Hussle（英国）
          detail: 新增 1,500+ 英国健身房 / 泳池 / 水疗合作伙伴；覆盖英国 96% 邮编。
          tone: positive
        - date: 2024-09
          label: Series G — $200M，估值 $1.2B+
          detail: L Catterton 和 Meritech 领投；EGYM 成为独角兽；FitReserve 同步被收购。
          tone: positive
        - date: '2024'
          label: EGYM Genius AI 发布
          detail: AI 训练平台使用 7B+ 训练数据点；集成 200+ 设备。
          tone: positive
        - date: 2025-09
          label: EoS Fitness——首个美国连锁铺开
          detail: 首个美国大型健身连锁全链部署 EGYM Genius AI；美国企业端牵引得到验证。
          tone: positive
        - date: 2026-01
          label: 宣布 Playlist 并购
          detail: $785M 股权、$7.5B 合并 EV；Affinity Partners、Vista、Temasek、L Catterton 投资。
          tone: positive
        - date: '2026-03-31'
          label: 并购交割
          detail: EGYM 与 Mindbody、ClassPass、Booker 一同进入 Playlist；形成覆盖 30+ 国家 / 地区的全球平台。
          tone: neutral
    approximationNotes: Series E 总额来自多个二手来源。并购 EV 和股权数字来自官方公告。2014 年前创立细节依赖 CEO 传记来源。
