  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与资本结构
        blocks:
          - type: paragraph
            body: >-
              2023–2026 年，EGYM 的估值经历了三个清晰拐点；每个拐点都由一批更成熟的机构投资者入场，并以不断抬升的收入基数为支撑。2023 年 7 月的 Series F（$225
              million，Affinity Partners 领投，隐含投前约 $680 million）给 EGYM 的定价约为当时估计 $130 million 2022 年收入运行率的
              2.6×，这一溢价与当时两位数增长轨迹相匹配。2024 年 9 月的 Series G（$200 million，L Catterton 与 Meritech Capital 领投）是关键定价点：CEO
              Philipp Roesch-Schlanderer 确认投后估值超过 $1.2 billion，EGYM 由此成为独角兽。按公司提出的 $500 million 2025 年收入目标计算，Series G
              隐含约 2.4× EV/revenue，低于上市 SaaS 6–7× 的中位数，也低于 Technogym 约 3× 的上市可比倍数；相对于 EGYM 偏软件的收入结构和增速，Series G 定价偏保守。


              2026 年 1 月宣布合并、3 月完成交割后，公司规模和估值都发生阶跃。合并后的 Playlist-EGYM 企业价值定为 $7.5 billion，并获得 $785 million 新股融资，由
              Affinity Partners 领投，Vista Equity Partners、Temasek 和 L Catterton 参投。按合并后 2025 年超过 $800 million 的净收入计算，约为
              9.4× EV/revenue，明显高于上市 SaaS 中位数和联网健身上市可比公司。这一溢价反映的是多边平台逻辑：把硬件、SaaS、企业健康福利聚合、消费者市场和 AI
              教练统一到一个实体内，目前还没有单一竞争对手能在同等规模复制。


              合并前，EGYM 累计融资约 $580 million，至少经历八轮；独立口径下，$200 million 的 Series G 是最大一笔股权融资。合并一次性加入 $785
              million，使合并后资本结构成为全球健身科技史上规模最大的之一。EGYM 现在作为 Playlist 的全资子公司运营，原 EGYM 股东持有的是缺乏流动性的私募股权，且没有公开披露退出时间表。
