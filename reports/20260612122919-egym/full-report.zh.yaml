      - number: '1.4'
        title: 规模、指标与网络覆盖
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 1 月合并公告，EGYM 的 Wellpass 企业健康网络已增长到 20,000 多家雇主合作伙伴，可接入德国、奥地利、法国、比利时、英国和美国的健身与健康设施。相比 2024 年 9
              月基线，增长明显：当时为 14,000 家企业客户、17,000 个运动合作伙伴场馆，覆盖 3 million 名符合资格员工。收购 FitReserve 后，Wellpass 在美国的覆盖到 2025 年 12
              月已跨过 4,000 家参与健身房和工作室。全球范围内，EGYM Technology 产品线连接 33,000+ 个健身场所；截至 2026 年，平台报告 7.5 million+ 月活锻炼者，高于 2024
              年 9 月的 6 million。


              合并披露让部分收入指标可见。2025 年，Playlist 和 EGYM 合并净收入超过 $800 million，同时保持强盈利能力。EGYM CEO 在 2024 年 9 月表示，公司按 EBITDA
              口径盈利，并预计 2025 年独立收入为 $500 million；但合并后并未单独确认 2025 年独立口径数据。Series G 交割时（2024 年 9 月）员工约 700 人，合并前 2025 年末估计为
              880+ 人。合并后的 Playlist-EGYM 实体在全球有 3,000 多名员工。毛利率、NRR 和精确 ARR 数据未公开披露。
