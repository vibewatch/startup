      - number: '8.3'
        title: 乐观 / 基准 / 悲观情景分析
        blocks:
          - type: paragraph
            body: >-
              三种情景框定 Playlist-EGYM 的估值区间；每种情景都建立在平台整合成败、收入倍数走势和 Wellhub 竞争反应的不同假设上。EGYM 现在是 Playlist
              子公司，且不再单独披露财务数据，因此情景分析只能在合并实体层面展开。


              乐观情景假设 AI 平台整合成功（EGYM Genius + Mindbody Messenger AI），带动收入复合增长 25%+，到 2027 年合并收入约 $1.6 billion。按 $1.6
              billion 给予 10× 前瞻 EV/revenue——理由是平台网络效应、AI 驱动的利润率扩张以及 EGYM 在北美的覆盖扩大——2027 年退出或按市值重估时，合并估值可达 $16
              billion。EGYM 独立贡献约为合并收入的 ~50%，归属价值约 $5–6 billion。该情景要求 NRR 超过 110%，整合成本低于指引，Wellhub
              的竞争反应仍可控。概率信号：较低；取决于三大地理市场、四条不同业务线的执行。


              基准情景认为当前 $7.5 billion 合并企业价值大致合理，对应 2025 年合并收入 9.4×；随着增长放缓，且平台展示两到三个年度 NRR 队列，倍数逐步压缩至 7×。若 2026 年合并收入达到
              $1.1 billion、倍数为 8×，则合并估值为 $8.8 billion，较入场价只有温和溢价。EGYM 独立隐含价值约 $3.5–4 billion。该情景需要 Wellpass
              雇主续约率稳定，提价没有引发明显运营商流失，并且与 Mindbody 的 SaaS 平台完成干净整合。


              悲观情景假设运营商流失触发倍数压缩，诱因包括 15–30% 的提价、Wellhub 在 DACH 的竞争替代，以及整合执行失败。按 $800 million 合并收入给予 5×，隐含合并估值降至 $4
              billion，较入场价减记 47%。EGYM 归属独立价值约 $2 billion，低于其 Series G 独立估值。该情景与独立运营商分析提出的合并后定价担忧一致，也与 Peloton
              路径这一警示先例相符。概率信号：有意义；原因是股权缺乏流动性，且没有独立验证的 NRR 数据。
