      - number: '5.2'
        title: EGYM Genius AI 与数据优势
        blocks:
          - type: paragraph
            body: >-
              EGYM Genius AI 是 EGYM 平台的核心差异化。Genius 于 2024 年 3 月 21 日首次发布，并在 2024 年秋季商业化上线；它基于自研数据库生成全自动、超个性化训练计划。到 2026
              年 6 月，该数据库已增长到超过 11 billion 个训练数据点和 700 million 个评估数据点，高于最初上线时的 7 billion 训练数据点和 340 million 次评估。Genius
              的突出之处在于打通数字设备和模拟设备：它不仅为 EGYM Smart Strength 机器生成可执行计划，也覆盖配重片设备、绳索拉力器和自由重量，补上竞品长期存在的缺口——过去会员必须只用 EGYM
              硬件，才能获得 AI 指导收益。每次训练完成后，计划会动态调整，解决“固定计划问题”：错过训练或日程变化会让传统处方计划很快失效。EGYM 对 210,000 名会员开展的内部留存研究显示，入会时使用
              Genius 的会员留存高出 19%，取消风险低 24%。EōS Fitness 于 2025 年 10 月 1 日成为首家部署 Genius 的美国健身房连锁，并计划推广到所有配备 EGYM Smart
              Strength 的美国门店。2025 年 Q4 更新进一步提升计划质量：更有效分配每周训练量，引入更多运动变化，并新增 Flexibility BioAge 运营商仪表盘。EGYM CPO John Ford
              直接概括了数据护城河：“动态计划只有 Genius 这样的产品才可能做到，它会把我们追踪到你按下开始那一刻之前的所有数据都纳入考虑。”
