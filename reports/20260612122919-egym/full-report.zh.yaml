      - number: '8.5'
        title: 建议、退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              基于八章证据，整体建议是观察（继续研究），置信度中等，风险评级高，估值立场偏高。规模、增长轨迹和平台网络效应真实存在，且证据充分。但 9.4×
              合并收入倍数还没有得到公开证据的充分支撑；关键原因是主要价值驱动因素——雇主 NRR、分部毛利率、整合后 EBITDA 质量——仍未披露。若要按 $7.5 billion
              承销估值，至少需要对五个核心证据缺口中的三个形成高置信尽调：按雇主队列年份拆分的 NRR、经审计 EBITDA 和分部毛利率、CAC-to-ACV 回本周期、从 Playlist 拆分后的 EGYM
              独立收入，以及合并后定价对运营商流失率的影响。


              退出准备度受结构性流动性限制。Playlist-EGYM 是一家私募股权支持的私有载体；Vista Equity Partners 通常持有组合公司四到七年，并通过 IPO 或二级出售退出。此前
              Mindbody-ClassPass 的 IPO 计划因 2026 年合并而搁置，使退出时间表更不确定。Temasek（新加坡主权财富基金）、Affinity Partners 和 L Catterton
              都持有多元化、长久期组合，进一步降低了近期被迫退出事件的概率。


              需要监测四类会打破投资逻辑的触发器：Wellpass NRR（若雇主队列数据低于 90% NRR，经常性收入溢价就不成立）；运营商定价反应（若合并后首个合同周期中，健身房运营商不续约率跃升至 15%
              以上，整合逻辑会受到挑战）；Wellhub 在 DACH 的替代（若 Wellhub 在 2026 年新增超过 5,000 家德国企业客户净额，EGYM Wellpass
              的本土市场缓冲将被明显侵蚀）；以及监管环境（若 EGYM Genius 被 EU AI Act 认定为高风险，将触发 $785 million 新股预算中未预测的合规成本）。单一触发器不会击穿投资逻辑；若
              2026–2027 年同时出现两个，基准情景将受到实质损害。
            claimRefs:
