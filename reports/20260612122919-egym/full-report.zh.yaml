      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >-
              EGYM 由 Philipp Roesch-Schlanderer 创立，他现任 CEO 兼联合创始人。Roesch-Schlanderer 在 Columbia Business School
              就读时萌生这一想法，当时他观察到传统健身房体验缺少个性化和连续性。他拥有 Ludwig Maximilian University Munich（LMU）、Aarhus University、Columbia
              Business School 和 Technical University of Munich（TUM）的工商管理与技术管理相关学位。2025 年，他获得 EuropeActive 颁发的 Rainer
              Schaller Entrepreneurship Award。2026 年 1 月 Playlist-EGYM 合并公告发布后，Roesch-Schlanderer 被任命为合并后 Playlist
              组织的联合创始人，并与 Monti Saroya（Vista Equity Partners Flagship Fund 联席负责人）共同担任联席董事长。


              高管团队包括 CFO Patrick Meininger、EGYM Wellpass 董事总经理 Nicolas Stadtelmeyer，以及首席产品官 John Ford。2024 年 9 月 Series
              G 交割时，董事会扩容，Paul Madera（Meritech Capital 联合创始人兼合伙人）和 Marc Magliacano（L Catterton 管理合伙人）加入。EGYM 的治理围绕
              Roesch-Schlanderer 高度集中，存在有意义的关键人依赖；不过，他在 Playlist 架构内继续担任 EGYM 的联席董事长和 CEO，为公司延续性提供支撑。本轮研究审阅的 EGYM
              一手材料中，尚未验证任何其他联合创始人的身份。
