      - number: '5.4'
        title: Deployment, Reliability, and Roadmap
        blocks:
          - type: paragraph
            body: >-
              EGYM's deployment model follows a business-to-business-to-consumer (B2B2C) path: gym operators purchase
              and install EGYM Smart Strength circuits and cloud software subscriptions; individual members then use the
              hardware and apps. Onboarding a new member takes approximately 30 minutes for an 11-machine circuit,
              including the strength test and first guided session. EGYM supports operators through a dedicated support
              portal offering separate escalation tracks for operators and members, with country-specific contacts. The
              platform's infrastructure status is published via an Atlassian Statuspage page. Roadmap commitments are
              disclosed through regular product update newsletters and press releases, most recently the January 28,
              2026 Q4 2025 update and the March 2026 HFA debut of Series 3. Key near-term milestones include the Smart
              Strength Series 3 general availability (July 1, 2026), the Longevity Training Program (July 2026), and
              continued expansion of Max Out and Genius across US locations. One adverse signal from an independent user
              review (January 2025) documented that the EGYM Fitness Hub height measurement was systematically ~0.5
              inches too short across multiple onboarding sessions, requiring staff correction. The same review
              identified an incomplete cardio test UX issue: abandoning a mid-session test on EGYM-integrated
              third-party cardio hardware left a corrupted BioAge score with no documented self-service reset path,
              representing a reliability gap in hybrid hardware workflows. CEO Roesch-Schlanderer's statement captures
              the strategic framing: "Products can be copied. An integrated, learning system built over years of data
              cannot."
