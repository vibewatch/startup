      - number: '3.2'
        title: Competitor Profiles and Capability Comparison
        blocks:
          - type: paragraph
            body: >-
              Wellhub is EGYM's most formidable direct competitor in the corporate wellness segment. The company raised
              $867.5M in total funding (latest: $149M later-stage VC round in December 2024), is valued at approximately
              $4.2B, and reported $319M in ARR for 2025. Its CFO has positioned the company explicitly as a B2B SaaS
              business with annual contracts, fixed platform fees, and net revenue retention as the core metric.
              Employee pricing ranges from a free digital tier up to $344.99/month for Diamond-tier gym access, with
              employer PEPM fees negotiated separately. After the Urban Sports Club acquisition, Wellhub claims the
              world's largest corporate wellness platform by network breadth. Its strategic weakness is that it offers
              no proprietary gym hardware, giving EGYM a differentiated "smart equipment plus network" pitch to gym
              operators who want to be both Wellpass destination sites and technology recipients.


              Technogym is EGYM's most formidable competitor on the gym equipment side. It is publicly listed on the
              Milan stock exchange, generated €1.02B in 2025 revenue with €220M adjusted EBITDA and €120M net profit
              (+33% YoY). In Q1 2026, revenue advanced another 10.1% to €236.8M with B2B segment at €185.8M (78.5% of
              total). Technogym serves 100,000+ wellness centers and equipped the Milano Cortina 2026 Winter
              Olympics—its tenth consecutive Olympic engagement. It recently announced a Google partnership to expand AI
              services within its Mywellness ecosystem. However, Technogym does not operate an employer-facing wellness
              network, so it does not compete with EGYM Wellpass directly. Its premium pricing (custom-quoted; no public
              list), luxury brand positioning, and preference for own-equipment integration create partial lock-in but
              less ecosystem depth than EGYM's proprietary hardware-software stack with 7 billion stored workout data
              points.


              Life Fitness / Hammer Strength is an independent commercial equipment company exhibiting at HFA 2026 with
              new connected cardio innovations. It competes on durability and residual value. Matrix (Johnson Health
              Tech) benefits from vertical integration (manufacturing, software, distribution under one ownership),
              offering strong value-to-performance ratios for large networks and hospitality. Neither Life Fitness nor
              Matrix has deployed a Wellpass-equivalent employer network, positioning them as single-layer equipment
              competitors rather than full-stack wellness OS rivals.


              FitOn Health (previously Peerfit for the employer gym-access channel) operates a digital-first model with
              20M+ consumer users and 13,000 employer clients. Its $48.7M Series D (January 2025) funds expansion, but
              $12M ARR against EGYM's $800M+ combined revenue marks a large scale gap. FitOn's moat is content breadth
              and health-plan integrations rather than physical gym equipment or European network density.
