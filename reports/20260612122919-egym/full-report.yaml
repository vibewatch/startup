      - number: '7.3'
        title: Merger Integration, Financial Disclosure, and Governance Risks
        blocks:
          - type: paragraph
            body: >-
              The March 2026 close of the Playlist-EGYM merger is both a value-creation event and a complex integration
              risk. The combined Playlist entity now manages five distinct brands—Mindbody, Booker, ClassPass, EGYM
              Technology, and EGYM Wellpass—each with independent product stacks, customer relationships, pricing
              structures, geographic footprints, and organizational cultures. With 3,000+ combined employees spanning
              Munich, Denver, and multiple US/European offices, the integration program is running across hardware,
              SaaS, AI platforms, and corporate wellness simultaneously. Post-merger platform rationalization,
              product-roadmap alignment, and support model consolidation each carry execution risk; failure to deliver
              on integration synergies within the expected timeline could impair operator and employer retention during
              the critical 2026–2027 contract renewal window.


              Financial disclosure is a material diligence risk. EGYM's standalone financials—revenue by segment, gross
              margin, operating cost structure, cash burn, and working capital—are no longer reported separately as a
              Playlist subsidiary. The combined entity confirmed $800M+ combined 2025 net revenue, but has not disclosed
              gross margins, segment-level performance, or cash position. This opacity prevents external investors from
              tracking EGYM-specific unit economics post-merger or verifying that the EGYM Technology hardware margin
              has improved from the historically thin levels of a hardware-plus-SaaS bundled model. No IPO pathway has
              been publicly announced; EGYM shareholders hold fully illiquid private equity with realization dependent
              on a future exit event (IPO or trade sale) that has no disclosed timeline.


              Governance concentration is a related risk. Philipp Roesch-Schlanderer serves simultaneously as EGYM CEO,
              Playlist Co-Founder, and Playlist Co-Chairman—creating meaningful key-person dependency for the EGYM
              operating entity within a multi-brand holding company managed by Vista Equity Partners and Affinity
              Partners. Affinity Partners (founded by Jared Kushner) led the $785M equity raise, introducing an investor
              whose political profile and regulatory relationships may generate reputational headline risk or future
              political scrutiny, particularly in regulated European markets. Monti Saroya of Vista Equity Partners
              serves as co-chairman alongside Roesch-Schlanderer, providing operational oversight continuity—but Vista's
              ownership and value-creation playbook (cost discipline, pricing power, roll-up consolidation) is itself a
              driver of the operator pricing increase risk documented above.
