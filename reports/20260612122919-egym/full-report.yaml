      - number: '8.5'
        title: Recommendation, Exit Readiness, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Based on the evidence assembled across all eight chapters, the overall recommendation is track (research
              more) at medium confidence with a high risk rating and a stretched valuation stance. The scale, growth
              trajectory, and platform network effects are real and well-documented. The 9.4× combined revenue multiple,
              however, is not sufficiently supported by publicly available evidence—specifically because the key
              value-drivers (employer NRR, segment gross margins, post-integration EBITDA quality) remain undisclosed. A
              valuation underwrite at $7.5 billion requires high-confidence diligence on at least three of the five
              primary evidence gaps: NRR by employer cohort vintage, audited EBITDA and gross margin by segment,
              CAC-to-ACV payback, EGYM standalone revenue post-split from Playlist, and the post-merger pricing impact
              on operator churn rates.


              Exit readiness is limited by structural illiquidity. The Playlist-EGYM entity is a private PE-backed
              vehicle; Vista Equity Partners typically holds portfolio companies four to seven years and exits via IPO
              or secondary sale. The earlier Mindbody-ClassPass IPO plan was shelved in favor of the 2026 merger, adding
              uncertainty about the exit timeline. Temasek (Singapore sovereign wealth), Affinity Partners, and L
              Catterton all hold diversified portfolios with long duration tolerance, further reducing the probability
              of a near-term forced exit event.


              Thesis-break triggers require monitoring across four dimensions: Wellpass NRR (if employer cohort data
              shows below-90% NRR, the recurring revenue premium is unjustified); operator pricing response (if gym
              operator non-renewal rates spike above 15% in the first post-merger contract cycle, the integration thesis
              is challenged); Wellhub DACH displacement (if Wellhub gains more than 5,000 net new German corporate
              clients in 2026, EGYM Wellpass's home-market buffer erodes materially); and the regulatory environment (EU
              AI Act high-risk designation for EGYM Genius triggers compliance costs unforecasted in the $785 million
              fresh equity budget). Any one of these triggers alone does not break the thesis; two concurrent triggers
              in 2026–2027 would materially impair the base case.
            claimRefs:
              - CV022
              - CV025
              - CV028
              - CV036
              - CV039
              - CV040
              - CV043
              - CV044
              - CV049
              - CV050
