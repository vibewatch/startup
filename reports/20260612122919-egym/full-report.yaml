    title: Valuation Sensitivity — Implied EV at Varying Revenue Multiples on $800M Combined Revenue
    type: bar
    layout: wide
    summary: >-
      Sensitivity of the combined Playlist-EGYM enterprise value to EV/revenue multiples ranging from the Peloton
      distressed comp (1.2×) to the top-quartile SaaS multiple (14×), with the current deal price (9.4×) highlighted.
    data:
      items:
        - label: 'Peloton distressed comp: 1.2×'
          value: 960
          detail: Peloton EV/Revenue ~1.2× on $2.4B revenue; applies to distressed connected fitness scenario
        - label: 'Technogym public comp: 3.0×'
          value: 2400
          detail: Technogym hardware-heavy multiple; floor for equipment-software blended business
        - label: 'Private SaaS median: 4.2×'
          value: 3360
          detail: Windsor Drake / Aventis private SaaS lower-middle market 2025–2026 median
        - label: 'Public SaaS median: 6.5×'
          value: 5200
          detail: June 2026 public SaaS median (6–7× range midpoint); includes AI-native dispersion
        - label: 'Current deal: 9.4×'
          value: 7500
          detail: Playlist-EGYM March 2026 transaction price; $785M new equity anchoring the mark
        - label: 'Wellhub ARR comp: 13.2×'
          value: 10560
          detail: Wellhub implied multiple ($4.2B / $319M ARR scaled to EGYM revenue); upper bound
        - label: 'Top-quartile SaaS: 14×'
          value: 11200
          detail: Top-quartile public SaaS (CrowdStrike-tier); requires NRR >120% and Rule of 40 >50%
    approximationNotes: >-
      All EV values are in USD millions applied to $800M combined 2025 revenue. Wellhub multiple is implied from
      secondary-market mark; not directly comparable to primary-round pricing. Technogym and Peloton multiples are LTM
      public market data as of H1 2026.
