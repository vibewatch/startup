      - number: '4.5'
        title: Financial Gaps, Adverse Signals, and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              EGYM's public financial disclosure is unusually strong for a private European technology company, with
              revenue milestones, funding terms, and profitability signals confirmed across multiple independent media
              sources (TechCrunch, HTGF, Club Solutions Magazine) and official press releases. The combination of 75%+
              recurring revenue, self-reported EBITDA profitability, rapid Wellpass employer growth, and a deep-pocketed
              investor base (L Catterton, Meritech, Affinity, Vista, Temasek) presents a credible financial foundation.
              The $800M+ combined 2025 revenue figure is corroborated by at least five independent sources and
              represents the strongest single financial anchor in this chapter.


              Against this, three adverse signals require explicit weighting. First, the EBITDA profitability claim is
              self-reported and unaudited: the CEO stated "profitable on an EBITDA basis" but has never disclosed margin
              levels, net income, or free cash flow; the distinction between adjusted and unadjusted EBITDA, and whether
              hardware manufacturing and Wellpass partner pay-outs are fully absorbed, cannot be verified. Second, EGYM
              Wellpass's 2.9/5 Trustpilot rating with recurring complaints about cancellations and coverage gaps raises
              plausible churn risk even if employer-level retention is stronger. Third, independent operator analysis
              (Keedia, May 2026) documents post-merger pricing power concentration risk—the vertical integration of
              hardware, software, and booking under Playlist removes the competitive tension that historically kept EGYM
              contract terms favorable for gym operators.


              The critical unresolved gaps—gross margin by segment, CAC, NRR, burn rate, and post-merger cash
              position—cannot be bridged from public sources. Any underwriting decision should require management
              segment P&L, audited EBITDA figures, Wellpass NRR cohorts by vintage, and the Playlist-EGYM post-merger
              debt and liquidity schedule. At the pre-merger $1.2B standalone valuation, the implied revenue multiple of
              approximately 2.4× on the $500M 2025 target is reasonable for a high-growth EBITDA-profitable
              SaaS-hardware hybrid. The $7.5B combined enterprise value at approximately 9.4× the $800M combined 2025
              revenue is a strategic premium that is justifiable for a platform with multi-sided network effects but
              aggressive under a standalone financial multiple lens.
