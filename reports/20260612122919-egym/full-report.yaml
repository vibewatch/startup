      - number: '7.4'
        title: Operational, Supply Chain, and Customer Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              EGYM's Smart Strength hardware—produced in Germany with electronic components including sensors, motor
              controllers, display hardware, and embedded computing—is exposed to the global semiconductor supply chain.
              Moody's 2026 analysis of semiconductor supply chains documents structural bottlenecks: TSMC controls
              approximately 70% of advanced chipmaking, specialty chemical and substrate suppliers are concentrated with
              minimal redundancy, and lead times for lithography equipment remain long. Geopolitical escalation in
              US-China trade policy can disrupt component availability with little warning and impose rapid cost
              increases. For EGYM, which operates 3–5 year hardware lease contracts with gym operators, any significant
              component cost inflation or supply disruption during a new equipment cycle would directly pressure
              hardware margins that are already thin relative to the 75% subscription revenue target. EGYM does not
              publicly disclose its semiconductor sourcing strategy or supplier concentration, leaving this a material
              unverified gap.


              Customer service quality is a documented adverse signal. EGYM Wellpass holds a 2.9–3.2/5 Trustpilot score
              (with 82+ reviews), driven by a recurring complaint pattern: paying customers cannot reach human support,
              are trapped in chatbot loops, and receive no callback. The EGYM North America equipment brand scores 2.3/5
              on Birdeye. These signals are adverse for employer contract renewal, since HR benefit administrators cite
              support quality as a key renewal criterion. The chatbot-only support model may reflect cost optimization
              post-merger, but it introduces systematic churn risk in the employer-facing Wellpass product where human
              relationship management is expected by enterprise buyers.


              Customer and channel concentration risk is present across both business units. EGYM Technology depends on
              a relatively small number of large multi-location gym chains (EoS Fitness at 200+ locations; Places
              Leisure at 101 facilities) for disproportionate equipment rollout volume; losing one such anchor operator
              would materially reduce deployment pace. EGYM Wellpass is exclusively distributed through employer HR
              benefit channels, with no direct-to-consumer fallback. If enterprise wellness budgets contract in a
              macroeconomic downturn—as Wellhub and Gallup data both document is a risk with only 22% employee wellbeing
              engagement—the channel concentration provides no diversification buffer. Rising healthcare costs
              (projected 7% annual growth) provide a favorable long-term tailwind, but short-cycle HR budget decisions
              could temporarily suppress EGYM Wellpass revenue growth independent of product quality.
