          - type: callout
            title: Post-Merger Pricing Power and Operator Lock-In
            body: >-
              The Playlist-EGYM vertical integration concentrates hardware, software, content, and booking under one
              entity, eliminating the competitive pricing pressure that historically governed EGYM equipment contracts.
              Independent operator analysis projects 15–30% renewal price increases post-merger. While this may improve
              EGYM's own economics, it creates a churn risk if operators seek alternatives at renewal, and makes EGYM's
              customer satisfaction scores a leading indicator of revenue durability.
            calloutType: risk
            claimRefs:
              - CI017
              - CI026
          - type: callout
            title: Priority Diligence Items Before Underwriting
            body: >-
              Request the following from Playlist management before any underwriting decision: (1) EGYM-segment P&L with
              audited gross margin by hardware vs. software vs. Wellpass for FY2023–2025; (2) Wellpass NRR cohort
              analysis by employer vintage and geography; (3) CAC and payback period by customer segment; (4) combined
              Playlist-EGYM cash position, debt schedule, and monthly burn as of Q1 2026; (5) post-merger pricing model
              for gym operator renewals and evidence of churn experience to date.
            calloutType: recommendation
            claimRefs:
              - CI028
              - CI030
              - CI031
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Module Architecture
        blocks:
          - type: paragraph
            body: >-
              EGYM's product set is organized around five interlocking layers it describes collectively as the
              "operating system for fitness and wellbeing." At the physical layer sit the Smart Strength equipment
              family—now entering its third generation with the Smart Strength Series 3 announced at HFA 2026—plus the
              Fitness Hub assessment station. Smart Strength machines electronically control resistance, automatically
              adjust grips, foot rests, and seat positions to each user within approximately four seconds of NFC or RFID
              login, and capture granular performance data (sets, reps, weight, range of motion, speed) for cloud
              upload. The Series 3 generation introduces 18.5-inch eye-level displays, LED lighting, 3D-molded ergonomic
              padding, and embedded support for advanced training methods including negative loading, adaptive
              resistance, and isokinetic protocols— administered automatically by the on-machine software without manual
              trainer intervention. The Fitness Hub seca edition, released in Q4 2025, adds medical-grade BIA body
              composition analysis to the onboarding workflow, extending the biometric data set available to Genius AI.
              Smart cardio integration is handled through third-party partnerships rather than EGYM-manufactured cardio
              equipment: EGYM's platform connects partner cardio devices via its open API, enabling heart-rate and
              duration data to flow into the unified training profile. The Wellpass corporate wellness network and the
              Branded Member App (formerly Netpulse) round out the portfolio, serving corporate HR buyers and gym
              operators respectively. EGYM SE Munich is the group parent, encompassing the Qualitrain corporate sports
              network as a distinct entity.
