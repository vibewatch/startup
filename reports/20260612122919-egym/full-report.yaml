      - number: '4.4'
        title: Capital Structure and Capital Adequacy
        blocks:
          - type: paragraph
            body: >-
              EGYM's capital formation history spans over a decade and more than $573 million in equity across
              seven-plus rounds, complemented by a €25 million EIB debt facility in 2017 under the European Fund for
              Strategic Investments. The funding cadence accelerated sharply after 2021: Series E ($41M, 2021), Series F
              ($225M, 2023), and Series G ($200M, September 2024) contributed roughly $466 million—about 80% of all
              pre-merger capital—in just three years. The Series F first tranche came in at a post-money valuation of
              €600 million (~$653M), and Series G lifted the post-money to $1.2B+, confirming unicorn status. Affinity
              Partners referenced an IPO trajectory explicitly at Series F close; that path was superseded by the
              Playlist merger.


              The January 2026 Playlist-EGYM merger—backed by $785M in new equity led by Affinity Partners with Vista
              Equity Partners, Temasek, and L Catterton participating—is the single largest capital injection in EGYM's
              history, exceeding the sum of all prior rounds. It will be deployed primarily for AI investment and EGYM
              expansion into North America and Asia. Cumulative EGYM-entity capital raised through the merger exceeds
              $1.35 billion; the combined Playlist-EGYM entity's aggregate capital base is substantially higher. The
              combined company now has over 3,000 employees globally.


              Near-term capital adequacy appears strong: $785M in fresh equity against an $800M+ combined revenue base
              gives the entity roughly one year of revenue-equivalent capital—well above standard runway thresholds for
              an EBITDA-profitable business. However, neither the combined cash on hand, debt obligations, nor
              post-merger free cash flow have been publicly disclosed. EGYM UK Limited's Companies House filings (annual
              accounts filed June 2025 for FY2024) confirm the UK subsidiary's existence but reflect only a marginal
              fraction of global EGYM operations. The EGYM shareholder equity position is fully illiquid private equity
              in Playlist, and any future exit—whether IPO, secondary sale, or strategic acquisition of Playlist—is
              entirely at the discretion of Playlist's controlling shareholders including Vista Equity Partners.
