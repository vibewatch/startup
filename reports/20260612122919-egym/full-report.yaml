      - number: '1.5'
        title: Milestones, Acquisitions, and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              EGYM's trajectory reflects a disciplined series of financing, product, and acquisition milestones from
              founding through the 2026 merger. Key acquisitions expanded the Wellpass network: Gymlib (France, March
              2022), Hussle (UK, March 2024, 1,500+ gyms covering 96% of UK postcodes), and FitReserve (US, September
              2024, 2,000 studio and gym partners in 60+ markets). The launch of EGYM Genius AI in 2024 and Smart
              Strength Series 3 at HFA 2026 mark the company's product innovation trajectory. EoS Fitness became the
              first large US gym chain to roll out EGYM Genius chain-wide in September 2025.


              On the adverse side, EGYM Wellpass holds a Trustpilot rating of 3.2/5 as of early 2026, with reviewers
              citing difficulty reaching human customer support and looping through automated chatbots. The
              Playlist-EGYM merger has generated industry concern about vendor lock-in: analyst commentary identifies
              that gym operators with EGYM equipment contracts face switching costs that span hardware, software, and
              data pipelines simultaneously, with post-merger contract renewals potentially running 15–30% above
              pre-merger benchmarks. This consolidation risk is not unique to EGYM but it is amplified by EGYM's
              vertically integrated stack and the combined entity's market position. Data privacy exposure from EGYM's
              collection of biometric and workout data at scale has not produced a disclosed breach to date but warrants
              monitoring as a sector-level risk.
