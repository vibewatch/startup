            title: EBITDA Profitability at $500M Scale
            body: >-
              EGYM is one of the few European fitness-tech companies to achieve EBITDA profitability at scale ($500M+
              revenue target for 2025) while maintaining over 56% compound annual revenue growth across three years.
              This positions EGYM favorably relative to many VC-backed fitness peers that are still burning cash. The
              75/25 subscription-to-hardware revenue mix structurally supports high blended margins as Wellpass
              continues to grow faster than the equipment business.
            calloutType: strength
