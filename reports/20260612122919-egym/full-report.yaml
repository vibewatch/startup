      - number: '7.2'
        title: Regulatory, Privacy, and AI Compliance Risks
        blocks:
          - type: paragraph
            body: >-
              EGYM processes what GDPR Article 9 classifies as special category data across its full product stack:
              member health questionnaires (PAR-Q equivalents), BioAge biometric fitness scores derived from body
              composition analysis, granular workout performance history, and 11 billion+ workout data points and 700
              million assessment records used to train Genius AI. Under GDPR, processing this data requires both a
              lawful Article 6 basis and a specific Article 9 condition—typically explicit consent for fitness use
              cases—with fines for violations reaching up to 4% of global annual turnover. European data protection
              authorities have acted against gym operators for improperly implemented biometric access control (a Polish
              operator was specifically fined), establishing that the sector is within regulatory scope. EGYM's
              cross-border architecture—cloud-hosting member data via third-party contractors across the EU and
              potentially the US—requires valid transfer mechanisms for each jurisdiction, introducing compliance
              surface across multiple DPA regimes.


              The EU AI Act creates an additional forward-looking compliance deadline that directly targets EGYM Genius.
              As a general-purpose AI system that generates personalized health training plans using biometric and
              health data, EGYM Genius almost certainly falls within or near the high-risk AI category under Annex III
              (AI systems in health, safety, and wellbeing). Under the regulation's current text, high-risk AI system
              obligations—including risk management, data quality governance, bias testing, human oversight, robustness
              requirements, and CE-marking—apply from 2 August 2026. A provisional postponement to December 2027 was
              agreed in Parliament and Council in May 2026 but has not yet been formally adopted into law. Penalties
              reach €35M or 7% of global annual turnover. EGYM has disclosed data protection policies and DPA frameworks
              with gym operators, but has not published an independent AI Act compliance certification, creating
              diligence opacity. Latham & Watkins covered data privacy and regulatory matters in the merger legal team,
              suggesting awareness of these obligations; but certification evidence is not public.


              On the positive side, no confirmed cybersecurity breach or data incident for EGYM has been identified in
              public records as of June 2026, and public breach trackers do not list EGYM. EGYM's Terms of Service
              include a mandatory arbitration clause that limits class-action exposure for member disputes. The
              company's data protection officer contact is publicly disclosed (datenschutz@egym.de), and the company
              operates as both data controller and data processor with formal DPAs in place with gym partners. These
              mitigations reduce but do not eliminate the residual regulatory exposure given the sensitivity and scale
              of the health data processed.
