          - type: callout
            title: Unaudited Profitability Claims and Zero Segment Transparency
            body: >-
              EGYM's EBITDA profitability claim is entirely company-stated and has never been validated by an
              independent auditor or public filing. No gross margin, net income, adjusted EBITDA margin, NRR, or CAC
              figure has been publicly disclosed. Post-merger integration into Playlist further obscures EGYM-specific
              financials with no obligation to report EGYM as a separate segment. This represents the primary diligence
              blocker: the financial quality thesis rests on CEO assertions alone.
            calloutType: risk
            claimRefs:
              - CI028
              - CI031
