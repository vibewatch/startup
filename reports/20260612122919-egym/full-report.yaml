            title: Adverse Review Signal — 3.2/5 Trustpilot and App-Only Access Complaints
            body: >-
              EGYM Wellpass GmbH's 3.2/5 Trustpilot rating and complaints of chatbot-only support with no direct human
              escalation path represent a material employee satisfaction risk. Since employer HR buyers evaluate
              Wellpass in part on employee satisfaction with the benefit, sustained poor consumer sentiment could
              directly erode new employer sales and hamper renewal rates. The app-only access model (no physical card or
              web check-in) is the single most cited friction point.
            calloutType: risk
            claimRefs:
              - CU015
              - CU016
