            body: >-
              EoS Fitness is EGYM's highest-profile US customer reference as of 2025–2026. In October 2025, EoS became
              the first large gym chain in the United States to commercially launch EGYM Genius AI across its network.
              With 200+ locations across Arizona, Florida, Georgia, Nevada, Southern California, Texas, and Utah—and a
              membership price starting at $9.99 per month—EoS represents the HVLP (High Value, Low Price) mass-market
              operator segment. Rowdy Yates, EVP of Fitness at EoS, stated: "EGYM Genius empowers personal trainers to
              focus on what matters most—the members' progress." The rollout began at select locations including Plano,
              Texas, and Port St. Lucie, Florida, before expanding to all EoS sites equipped with EGYM Smart Strength
              equipment. EGYM CPO John Ford confirmed that EoS members benefit from "insights from over seven billion
              EGYM Genius data points."


              In the UK, Places Leisure (101 leisure facilities, 30 million+ annual visits) formalized a strategic EGYM
              partnership in March 2025, deploying Fitness Hubs across its entire estate by late spring 2025 and rolling
              out Genius AI at select locations. Sarah Roberts, Head of Fitness at Places Leisure, called EGYM's Fitness
              Hub "the golden thread of our gym retention roadmap." The UK also provides the Vivacity Premier Fitness
              case study: Vivacity Premier Fitness in Peterborough launched EGYM in December 2023 and within six months
              achieved record retention, with EGYM's UK team confirming 1,200+ members onboarded (50%+ over age 50), an
              85% retention rate, an 18.2% strength improvement, and an average 8.7-year BioAge reduction for the
              over-50 cohort. Ian Rowe, Head of Customers and Sales at Vivacity, described the impact as "unprecedented
              on the club's financial performance."


              On the employer side, EGYM Wellpass's Kombo HRIS case study reveals a large French retail company
              (unnamed, one of France's largest) that onboarded through a secure SFTP integration due to internal
              security policies. One HR manager using Workday stated: "Member management used to take me hours every
              month, but now everything is automated and I don't have to worry about it anymore." The Hussle acquisition
              (March 2024, UK) brought corporate clients including AXA Health, Bupa, and IWG (the world's largest
              provider of serviced offices). These named employer references span insurance, consulting, and real
