      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Wellness ROI skepticism is a persistent CFO barrier
            body: >-
              Despite $94.6 billion in projected global corporate wellness spend by 2026, Harvard Business Review (2024)
              and MIT Sloan's evidence review both conclude that anticipated well-being improvements are not
              materializing and that rigorous ROI evidence is "surprisingly limited." Wellhub's own 2026 data shows a
              36-point gap between wellness benefit availability and relevance. EGYM must provide independently
              verifiable outcome data—beyond self-reported surveys—to overcome CFO resistance in enterprise accounts,
              particularly as program budgets face post-pandemic normalization pressure.
            calloutType: risk
            claimRefs:
              - CM025
              - CM026
              - CM033
          - type: callout
            title: Fitness-as-a-benefit is market-expanding, not just market-share
            body: >-
              Wellhub's 2025 operator data shows 90% of employees accessing gyms through corporate wellness platforms
              are new customers to those facilities. This indicates the corporate wellness channel is genuinely
              expanding the fitness market rather than redistributing existing gym members. For EGYM Wellpass, this
              dynamic means employer-partner networks do not cannibalize EGYM Technology gym operator relationships but
              instead grow the overall addressable membership pool, supporting a dual-sided flywheel thesis.
            calloutType: insight
            claimRefs:
              - CM023
              - CM024
              - CM032
