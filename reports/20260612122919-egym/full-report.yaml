      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              EGYM was founded by Philipp Roesch-Schlanderer, who serves as CEO and co-founder. Roesch-Schlanderer
              conceived the idea while a student at Columbia Business School, where he observed that traditional gym
              experiences lacked personalization and continuity. He holds degrees in Business Administration and
              Technology Management from Ludwig Maximilian University Munich (LMU), Aarhus University, Columbia Business
              School, and the Technical University of Munich (TUM). In 2025, he received the Rainer Schaller
              Entrepreneurship Award from EuropeActive. Following the January 2026 Playlist-EGYM merger announcement,
              Roesch-Schlanderer was named Co-Founder of the combined Playlist organization and Co-Chairman alongside
              Monti Saroya (Co-Head of Vista Equity Partners' Flagship Fund).


              The executive team includes Patrick Meininger as CFO, Nicolas Stadtelmeyer as Managing Director of EGYM
              Wellpass, and John Ford as Chief Product Officer. The board was expanded at the Series G close in
              September 2024 when Paul Madera (co-founder and partner at Meritech Capital) and Marc Magliacano (managing
              partner at L Catterton) joined. EGYM's governance is concentrated around Roesch-Schlanderer, representing
              meaningful key-person dependence; however, his retention as Co-Chairman and CEO of EGYM within the
              Playlist structure provides continuity. The identity of any additional co-founders has not been verified
              in primary EGYM-issued materials reviewed during this research cycle.
