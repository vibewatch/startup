  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Adjacencies, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              EGYM's revenue base spans two structurally distinct but complementary markets: (1) connected gym equipment
              and AI training software sold to fitness operators (B2B hardware and SaaS), and (2) employer-sponsored
              corporate wellness subscriptions through EGYM Wellpass (B2B2C fitness-as-a-benefit). These markets have
              different buyers, budget owners, competitive dynamics, and sizing conventions, and conflating them into a
              single TAM understates the boundary logic needed for valuation.


              The corporate wellness TAM broadly includes employer spend on health risk assessments, EAP programs,
              mental health platforms, fitness/gym benefit networks, nutrition programs, digital wellness apps, and
              onsite health facilities. EGYM Wellpass competes specifically within the fitness-as-a-benefit and
              gym-network-access sub-segment—a structurally narrower slice than the headline corporate wellness TAM.
              Excluded from EGYM's direct SAM are spend on clinical EAP therapy, traditional group health insurance
              premiums, occupational health mandates, onsite cafeteria nutrition programs, and consumer-direct D2C
              fitness apps. Adjacent spend categories include health insurer supplemental benefits, occupational
              rehabilitation, and corporate mental health platforms, which represent medium-term partnership and upsell
              opportunities rather than core addressable market.


              Status-quo substitutes for employers include: cash wellness allowances (no network), direct single-gym
              employer partnerships, Wellhub/Gympass corporate subscriptions (the primary like-for-like competitor),
              Urban Sports Club (acquired by Wellhub, 2025), benefits platforms bundling fitness as one of many perks
              (e.g., Benify, Benefitfocus), and the do-nothing/no-benefit baseline. For gym operators, substitutes for
              EGYM Technology include traditional analog circuit training equipment (Technogym, Life Fitness, Precor),
              non-EGYM club management software (Mindbody, Jonas, Perfect Gym), and internal digital projects. The
              status-quo baseline—non-digitized gyms with standard equipment—remains the most common case globally even
              in 2026, representing the largest untapped opportunity.
            claimRefs:
              - CM027
              - CM028
              - CM029
              - CM030
