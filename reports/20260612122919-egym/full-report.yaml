chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Business Model, and Products
        blocks:
          - type: paragraph
            body: >-
              EGYM is a Munich, Germany-based fitness technology company founded in 2010 with the stated mission of
              transforming healthcare "from repair to prevention." The company operates as a vertically integrated
              fitness and wellness platform built around two core product lines: EGYM Technology and EGYM Wellpass. EGYM
              Technology encompasses connected smart strength equipment, cloud-based software, and the EGYM Genius AI
              training platform. EGYM Wellpass is a B2B corporate wellness subscription network that connects employers
              with a curated network of fitness and wellness facilities.


              The business model is B2B2C: EGYM sells connected gym equipment and software to fitness operators (B2B),
              enabling those operators to deliver better member experiences (B2C), while simultaneously connecting gyms
              and corporate employers through the Wellpass network. As of September 2024, approximately 75% of EGYM's
              revenue was subscription-based and 25% hardware-driven, a structure the CEO described as core to the
              long-term value proposition. EGYM Genius, the AI-powered training platform launched in 2024, uses machine
              learning models trained on over 7 billion workout data points and 410 million assessments, integrating
              with 200+ equipment and software partners to deliver personalized training plans across connected and
              analog equipment. As of 2026, the EGYM ecosystem powers 33,000+ fitness locations globally and serves 7.5
              million+ monthly active exercisers. The company is headquartered in Munich with a significant US presence
              in Denver, Colorado, and operates across Germany, Austria, France, Belgium, UK, and US.
