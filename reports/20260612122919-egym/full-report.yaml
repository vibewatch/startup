  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation — Operators, Employers, and End-Users
        blocks:
          - type: paragraph
            body: >-
              EGYM's customer base operates across three structurally distinct tiers that interact through the company's
              B2B2C flywheel. The first tier is fitness operators: commercial gyms, leisure trusts, boutique studios,
              and health clubs that purchase or lease EGYM smart strength equipment and subscribe to the SaaS platform.
              As of the March 2026 Playlist merger close, EGYM Technology powered over 33,000 fitness locations
              globally, up from approximately 18,000 at the September 2024 Series G. These operators—ranging from large
              US chains like EoS Fitness (200+ locations) to UK leisure trusts like Places Leisure (101 facilities)—sign
              multi-year bundled contracts covering both hardware and cloud software at approximately $3,500 per month
              per facility. They are the primary hardware and SaaS revenue driver for EGYM Technology.


              The second tier is corporate employers who subscribe to EGYM Wellpass. As of the merger announcement, EGYM
              Wellpass served over 20,000 employer partners, up from 14,000 corporate customers with over three million
              eligible employees at the Series G in September 2024. Named corporate clients verified by CB Insights
              include Allianz, McKinsey & Company, and Boston Consulting Group. EGYM Wellpass is available exclusively
              through employer channels—there is no direct-to-consumer enrollment path— which concentrates acquisition
              risk on the enterprise sales motion and annual HR benefit cycle. Employers are billed only for active
              users each month under a co-financed model where the employer and employee split contributions, reducing
              passive-enrollment waste but creating revenue volatility if activation rates decline. HRIS integration
              (SAP SuccessFactors, Workday, Personio, Payfit) automates employee lifecycle management, a key enterprise
              retention lever.


              The third tier is end-user exercisers—the individual employees and gym members who actually use the
              platform. The combined Playlist-EGYM ecosystem counted millions of monthly active users across 30+
              countries at March 2026; EGYM Technology alone reported six million monthly active exercisers at the
              Series G. User demographics concentrate in the age 30–55 professional cohort (high education,
              time-constrained), with a Silver Economy cohort of approximately 22% of European active users aged 60 or
              older. Gender split is roughly equal. The Vivacity Premier Fitness case study—1,200 members onboarded in
              the first year with 85% retention, half of them over age 50—illustrates the over-50 engagement thesis that
              EGYM uses as a go-to-market differentiator with gym operators.
