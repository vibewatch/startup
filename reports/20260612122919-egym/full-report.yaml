          - type: callout
            title: Post-Merger Vendor Lock-In and Operator Pricing Risk
            body: >-
              Keedia's May 2026 independent analysis warns that EGYM-operator contracts expiring in 2026–2027 face
              potential 15–30% pricing increases as Playlist-EGYM rolls out unified pricing across a now vertically
              integrated equipment-content-software stack. Operators that cannot absorb this increase may churn to
              Technogym or delay renewals, creating near-term retention risk for EGYM's operator revenue base.
            calloutType: risk
            claimRefs:
              - CU014
              - CU019
              - CU035
          - type: callout
            title: Wellpass Activation Rate is the Undisclosed Critical Lever
            body: >-
              EGYM bills Wellpass employers per-active-user, not per-enrolled employee. The gap between eligible
              employees and activated monthly users determines actual Wellpass revenue and ARR. EGYM's investment in
              HRIS integrations (Kombo, SAP, Workday, Personio) suggests activation rate improvement is a strategic
              priority—but the activation rate itself remains the most important undisclosed investor metric for the
              Wellpass business.
            calloutType: insight
            claimRefs:
              - CU020
              - CU022
              - CU040
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Competitive and Market Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              The most material near-term competitive risk for EGYM is the emergence of Wellhub as a well-capitalized
              direct rival following its $600M acquisition of Urban Sports Club in September 2025. The combined Wellhub
              entity now serves 39,000 corporate clients across 18 countries, connecting five million employee
              subscribers to 97,000 wellness partners—nearly doubling the client count EGYM Wellpass holds (over 20,000
              employer partners). Critically, the Urban Sports Club acquisition gave Wellhub deep penetration into
              EGYM's German and DACH home market, eliminating a key geographic buffer that EGYM had enjoyed since its
              Munich founding. Wellhub's holistic wellness pivot—integrating mental health, nutrition, therapy, and
              sleep alongside fitness—positions it as a more complete employee benefit bundle than EGYM Wellpass's
              fitness-first network, threatening EGYM's employer renewal rate in annual HR benefit procurement cycles.


              A second systemic risk stems from the Playlist-EGYM merger itself. The consolidation collapses three
              separately sourced technology layers (hardware, content platform, member engagement software) into a
              single entity, eliminating the competitive tension that historically restrained EGYM's pricing power over
              operators. Independent operator analysis by Keedia (May 2026) projects that facilities currently paying
              $3,500 per month for EGYM hardware and software bundles could face renewals of $4,000–$4,500 per month as
              unified Playlist-EGYM pricing rolls out—a 15–30% increase above pre-merger benchmarks. HFA Show 2026,
              attended by over 10,000 fitness industry professionals, identified AI integration and technology
              consolidation as the dominant operator anxiety categories. The broader consolidation wave (Zwift/ROUVY;
              MyFitnessPal/Cal AI) is simultaneously closing operator options for diversified best-of-breed vendor
              stacks, amplifying the lock-in risk.


              Employee engagement headwinds represent a third structural risk for EGYM Wellpass. Gallup research
              embedded in Wellhub's September 2025 press release reports only 22% of employees strongly agree their
              employer cares about their wellbeing—down sharply from 49% in 2020. Low activation rates directly erode
              the per-active-user revenue model that underpins EGYM Wellpass, since employers are billed only for active
              monthly users. If macroeconomic pressure leads employers to reduce wellness benefit budgets or employees
              reduce utilization, EGYM Wellpass revenue is directly exposed.
