callouts:
  - calloutType: risk
    title: "Post-Merger Pricing Power — Operator Lock-In Is the Largest Near-Term Risk"
    body: >-
      The Playlist-EGYM merger has eliminated competitive tension from EGYM's hardware and software
      pricing. Independent operator analysis projects 15–30% price increases at first renewal cycle
      (2026–2027), with a facility paying $3,500/month potentially facing $4,000–$4,500/month renewals.
      Operators with multi-year contracts expiring in the next 18 months have limited leverage once
      unified pricing rolls out. This is the most actionable near-term thesis risk requiring
      direct diligence on renewal economics.
    claimRefs:
      - CR005
      - CR006
      - CR007

  - calloutType: risk
    title: "EU AI Act Compliance Deadline — Genius AI Is Likely High-Risk"
    body: >-
      EGYM Genius processes health and biometric data to generate automated training recommendations
      and BioAge assessments, placing it near or within the EU AI Act's high-risk category. The
      legal deadline is 2 August 2026 under current text, with a postponement to December 2027
      pending formal adoption. No independent AI Act compliance certification has been publicly
      disclosed. Fines reach €35M or 7% of global annual turnover—a material exposure for a
      $800M+ revenue combined entity.
    claimRefs:
      - CR011
      - CR012
      - CR010

  - calloutType: recommendation
    title: "Diligence Priorities Before Next Investment Decision"
    body: >-
      Three diligence asks stand above all others: (1) Request the EU AI Act readiness assessment
      and AI classification memo for EGYM Genius; (2) obtain standalone EGYM financials or a
      segment breakdown from Playlist post-merger to verify unit economics; (3) conduct operator
      renewal conversations independently to confirm whether 15–30% pricing increases are
      materializing or being challenged. These three gaps—AI compliance, financial transparency,
      and operator retention—are the primary underwriting uncertainties as of June 2026.
    claimRefs:
      - CR011
      - CR042
      - CR043
      - CR005

  - calloutType: insight
    title: "Wellhub Has Closed the Home-Market Gap — DACH Advantage No Longer Sufficient"
    body: >-
      Urban Sports Club's $600M acquisition by Wellhub in September 2025 directly targeted EGYM
      Wellpass's German and DACH home-market moat. Wellhub now fields 39,000 corporate clients
      (versus Wellpass's 20,000+) and a holistic mental-health/nutrition/fitness bundle that
      positions it as a more complete employer benefit. EGYM Wellpass must differentiate through
      superior network coverage, EGYM Technology integration, and AI-personalization—not geographic
      incumbency, which is now contested.
    claimRefs:
      - CR001
      - CR002
      - CR040
      - CR044

