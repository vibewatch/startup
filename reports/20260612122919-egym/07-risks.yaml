    reason: >-
      SR003 (AInvest) returned a 202 status with empty body content (js-only); the claim it
      supports (CR019 on illiquid equity) is corroborated by SR016 (TechCrunch, high reputation)
      and the factual conclusion is independently verifiable from the merger terms themselves.
