  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: regulatory-risk
      missingEvidence: >-
        National DPA enforcement records, employment law dispute history, and IP litigation
        filings in EGYM's operating jurisdictions beyond the EU and US (UK, DACH, France,
        Belgium) needed to fully populate the regulatory/legal risk register.
      whyItMatters: >-
        EGYM operates in 30+ countries across multiple regulatory regimes. The regulatory/legal
        risk register covers only the principal EU and US dimensions; sector-specific rules
        (UK ICO, French CNIL, Belgian DPA) and IP disputes in expansion markets cannot be
        verified through public sources and may introduce incremental enforcement exposure.
      diligencePath: >-
        Request disclosure of all regulatory inquiries, DPA correspondence, IP filings, and
        employment disputes from EGYM management during legal due diligence; engage local counsel
        in UK, Germany, France, and Belgium to confirm no open investigations.
      relatedQuestionRefs:
        - QR019
      relatedTableRefs:
        - TR001

    - type: missing-source
      severity: blocking
      topic: cybersecurity
      missingEvidence: >-
        Independent security audit confirming ISO 27001 or SOC 2 Type II certification for EGYM's
        health data processing infrastructure and AI training systems.
      whyItMatters: >-
        EGYM processes 11 billion+ workout data points and special category health/biometric data
        at scale. Without independent security certification, investors cannot assess whether
        controls are adequate against breach risk, and the company's GDPR Article 32 obligation
        to implement "appropriate technical measures" cannot be independently verified.
      diligencePath: >-
        Request EGYM's security certification status (ISO 27001, SOC 2 Type II, or equivalent),
        most recent penetration test results, and incident response plan from management during
        confirmatory due diligence.
      relatedQuestionRefs:
        - QR031

    - type: private-evidence-only
      severity: material
      topic: supply-chain-risk
      missingEvidence: >-
        EGYM's semiconductor sourcing strategy, key component supplier list, inventory buffer policy,
        and contractual protections for Smart Strength hardware production continuity.
      whyItMatters: >-
        EGYM's hardware business (25% of revenue) depends on electronic components produced in
        TSMC-concentrated supply chains exposed to geopolitical disruption. Without visibility
        into EGYM's sourcing posture, investors cannot assess the probability or financial impact
        of a hardware production disruption on multi-year operator lease contracts.
      diligencePath: >-
        Request list of primary hardware component suppliers, strategic inventory levels, and
        contractual protections (e.g., fixed-price supply agreements, alternative vendor
        qualification programs) from EGYM management.
      relatedQuestionRefs:
        - QR032

    - type: private-evidence-only
      severity: material
      topic: financial-disclosure-risk
      missingEvidence: >-
        Standalone EGYM segment financials post-merger including EGYM Technology and EGYM Wellpass
        revenue, gross margin, customer acquisition cost, and NRR.
      whyItMatters: >-
        Following the Playlist merger, EGYM financials are consolidated into the combined entity
        with no separate segment disclosure. Investors cannot verify that EGYM-specific unit
        economics, margins, or churn rates have held through the integration period without
        separate reporting.
      diligencePath: >-
        Negotiate segment-level financial reporting from Playlist management covering EGYM
        Technology and EGYM Wellpass separately; obtain trailing four quarters of revenue and
        gross margin at minimum.
      relatedQuestionRefs:
        - QR030

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      TR001 regulatory/legal risk register notes are provided; TR002–TR005 notes are provided.
      All tables include source, estimation, and scope caveats as required. No pure-factual
      snapshot tables without qualifiers exist in this chapter.
