      - number: '1.4'
        title: 公开概览仍缺少什么
        blocks:
          - type: paragraph
            body: >-
              本章可以确认公司的身份和规模，但依据现有公开证据，仍无法回答若干投资级概览问题。公开记录没有披露收入、收入运行率、毛利率以及董事会和控制权条款。融资 headline 也需谨慎，因为 Series E
              同时包含新发和老股转让，宣布的轮次规模不等于新增运营现金。最后，留存来源对成立年份存在分歧；这虽是运营层面的细节，却提醒我们，即使是基本公司事实也需要逐份文件核验。综合来看，这些缺口没有抹去规模故事，但限制了后续章节将运营势头转化为治理和估值判断的把握。
            claimRefs:
              - CO003
