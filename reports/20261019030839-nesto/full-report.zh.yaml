              最强的论点破坏触发器是可衡量的：与 AI 承保有关的监管或隐私干预、伙伴接入速度慢于资本部署所暗示的水平，或 CMLS 整合期间服务质量恶化，都会削弱 nesto
              同时作为贷款机构和基础设施供应商持续增长的逻辑。财务透明度是第二道门槛：管理层和投资人已提供估值及盈利说法，但公开报道仍未覆盖收入、仓储融资条款、未披露的 Series D 以及 CMLS
              收购经济性。在形成判断前，尽调应从叙事转向材料：牌照清单、模型治理文件、伙伴集中度、服务质量 KPI 和资本结构细节。
            claimRefs:
              - CR002
              - CR008
              - CR011
              - CR013
              - CR014
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 形成判断前需监控的止损条件
            body: 将三类事件视为论点破坏触发器：监管挑战 AI 辅助承保或隐私控制；CMLS 之后伙伴接入或服务整合出现重大拖延；新的披露显示，在资本和仓储依赖完全正常化后，盈利能力弱于公司声称。
            calloutType: risk
            claimRefs:
              - CR006
              - CR008
              - CR011
              - CR012
              - CR014
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              nesto 最近一次公开融资为价格讨论提供了锚点：多份 2026 年来源交叉确认 C$302M Series E、C$1.47B
              估值；对于一家仍属私营的加拿大抵押贷款平台，这样的运营规模信号并不寻常。同一证据基础也说明了为何建议应保持“继续跟踪”而非“买入”。规模、盈利说法、机构支持和白标分销都是真实的，但公开材料仍未披露收入构成、利润率的持久性或优先股堆叠，投资人无法检验轮次价格在稀释和执行风险之后是否仍留下足够上行空间。这让公司更容易令人欣赏，而不是容易定价。正确的纪律是将
              nesto 留在漏斗中，但把买入决定留给一个能将运营证明转化为承保后的回报计算、而不是叙事信心的尽调阶段。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
