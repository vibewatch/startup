      - number: '1.2'
        title: 创始人、具名管理层与治理透明度
        blocks:
          - type: paragraph
            body: >-
              运营核心比治理层清晰。独立长篇报道将创立归于 Malik Yacoubi、Karim Benabdallah、Damien Charbonneau 和 Chase Belair；Diagram
              参与塑造早期方向，Belair 则带来持牌抵押贷款市场的可信度。当前集团网站还列出服务、合作、营销和运营负责人，说明 CMLS
              合并后职能覆盖更广。薄弱之处在于控制权的公开透明度：现有来源列出管理者并提到董事会，却没有董事会名单、投资人控制权或其他治理机制，而这些对于一家规模扩大且刚完成资本重组的私营公司都很重要。
