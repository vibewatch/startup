  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 序数定位显示，nesto 在分销触达与工作流控制交汇处最强；在指定证据中，替代方案通常只具备其中一项，很少两者兼具。
    data:
      xAxis:
        label: 分销杠杆
        min: 1
        max: 5
        lowLabel: Niche / self-serve
        highLabel: Institutional / channel power
        description: Ordinal 1-5 scoring synthesized from the assigned evidence.
        scale: ordinal-1-5
      yAxis:
        label: 工作流控制
        min: 1
        max: 5
        lowLabel: Lead generation only
        highLabel: Origination-to-servicing control
        description: Ordinal 1-5 scoring synthesized from the assigned evidence.
        scale: ordinal-1-5
      points:
        - label: nesto
          name: nesto
          x: 4
          'y': 5
          detail: 结合 D2C 获客、经纪渠道、服务能力和白标平台主张。
          note: 定位反映 Nesto Cloud、CMLS 和 M3 证据所描述的整合栈。
        - label: 传统银行
          name: Traditional banks
          x: 5
          'y': 3
          detail: 分销和信任优势强，但指定证据未记录相当的平台广度。
          note: x 轴高分反映指定来源讨论的既有关系和监管信任。
        - label: 非银行放贷方
          name: Non-bank lenders
          x: 3
          'y': 3
          detail: 被列为贷款竞争者，但指定资料池中的工作流细节较少。
          note: 代表 Yespress 资料中提到的 First National、Equitable、MCAP 及类似放贷方。
        - label: 数字挑战者
          name: Digital challengers
          x: 3
          'y': 2
          detail: 在服务和基础设施深度显现前，争夺数字注意力。
          note: 代表被列为漏斗前端替代方案的 Pine、Ratehub 和 True North。
        - label: 经纪渠道
          name: Broker channel
          x: 4
          'y': 2
          detail: 通过顾问实现广泛分销，但指定证据未显示同等的端到端控制栈。
          note: 定位反映指定来源讨论的 M3 规模和现状经纪模式。
        - label: 内部自建
          name: Internal build
          x: 2
          'y': 4
          detail: 可以保留工作流控制，但分销收益只能通过机构自身取得。
          note: 这一替代类别与 B2B 销售有关，因为机构可以把抵押贷款运营留在内部。
    approximationNotes: 坐标轴使用有证据支持的序数分数，而非来源报告的基准；目的是展示各竞争者类别的优势集中在哪里，而不是推断百分比差距。
