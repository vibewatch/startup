      - number: '2.3'
        title: 买方、用户与付款方地图
        blocks:
          - type: paragraph
            body: >-
              买方地图是多边的。YesPress 称合并后的集团服务房主、经纪人、商业地产客户，以及宁愿租用现代抵押贷款运营能力而不愿自建的机构。FinTech Futures 和 BetaKit 也都将 nesto
              描述为同时提供面向消费者的数字放贷，以及向金融机构销售白标软件或基础设施。实际而言，终端借款人是消费者流程中的用户，经纪人是关注可融资性和流程速度的渠道伙伴，机构买方则是
              SaaS、服务或外包运营部署的经济决策者。不同细分市场的采用路径也不同：D2C 和经纪渠道靠利率与流程竞争力扩张，而机构业务取决于接入具名伙伴，并赢得高风险信贷运营的信任。
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM010
              - CM012
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM010
              - CM012
              - CM016
      - number: '2.4'
        title: 增长驱动、采用约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              现有来源中最强的公开需求驱动，是一个运营痛点明显的品类正在改善流程。Mortgage Professional America 引用的 2025
              年经纪人调查显示，更快的门户、更顺畅的流程、承保人接入和灵活的信贷政策能够赢得业务，这直接支持 nesto 关于加快承保、提升流程质量的定位。BetaKit 和 YesPress
              补充了第二个驱动：相较早期，现有银行和保险公司如今更愿意与金融科技基础设施供应商合作，扩大了白标分销可触达的买方范围。对估值而言，约束同样重要。公开 ROI 证据仍主要来自供应商自述，MPA 和 BetaKit
              都强调可审计决策、人工监督和监管信任是基本门槛。YesPress
              还指出，纵向整合需要耐心资本、牌照、安全控制、机构信誉，以及足够的交易量来消化合规和服务成本。这些依赖让市场机会变得真实，却也意味着其变现难度高于泛泛的“巨大抵押贷款 TAM”叙事。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 软件业务的公开市场测算仍有断层
            body: >-
              现有证据支持一个真实市场和真实运营规模，却没有 Nesto Cloud 或渠道层面经济性的清晰公开 SAM/SOM。这一点很重要，因为估值上行取决于 nesto
              能否以有吸引力的利润率捕获抵押贷款余额、服务收入或类似软件合同价值；公开记录仍把这些差异很大的价值池压缩成一个生态系统故事。
            calloutType: risk
            claimRefs:
              - CM011
              - CM014
              - CM015
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局如今横跨四个“房间”
        blocks:
          - type: paragraph
            body: >-
              现有证据表明，nesto 的竞争范围比普通数字抵押贷款比价页面暗示的更宽。Yespress
              称公司同时服务四类对象——房主、经纪人、商业地产客户，以及宁愿租用现代抵押贷款运营能力而不愿自建的机构——并指出不同“房间”的竞争者不同。在这一框架下，银行以及 First
              National、Equitable、MCAP 等非银行贷款机构争夺已融资抵押贷款量；Pine、Ratehub 和 True North
              争夺数字注意力；企业软件供应商或银行技术团队争夺基础设施预算。因此，现有流程、内部自建和面向合作的现有机构，与面向消费者的金融科技同业同样相关。
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP001
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP013
              - CP016
      - number: '3.2'
        title: 竞争者画像：nesto 与贷款机构、渠道和软件供应商重叠
        blocks:
          - type: paragraph
            body: >-
              nesto 自身的演进解释了为何多个竞争者类别都重要。公司从数字经纪起步，随后进入放贷和服务，以控制承保、融资和贷后运营；之后又将这套运营系统包装成面向机构的 Nesto Cloud。独立报道称 IG
              Wealth 集成了 nesto 的白标工具，Canada Life 选择该集团提供服务支持，Alterna Savings 选择 Intellifi 处理贷款，M3
              联盟则扩大了经纪人触达。这些关系没有消除竞争，而是重新定位了竞争。公司向机构销售软件和外包运营，而这些机构也可能在直接放贷领域成为竞争者；同时，公司仍争夺消费者获客和已融资贷款量。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP009
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
