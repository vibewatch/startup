    columns:
      - 论点
      - 观点
      - 哪些情况会改变观点
    rows:
      - - 规模证据
        - 超过 C$80B 的 MUA、超过 C$37B 的 2026 年发放额，以及多次盈利相关表述，说明公司确有经营实质。
        - 相反，若经审计的业绩、发放质量或服务经济性走弱，信心就会下降。
      - - 机构验证
        - La Caisse、Fidelity 及其他投资者验证了市场对 nesto 平台和 AI 论点的战略兴趣。
        - 只有这些关系转化为持久的软件、服务或资产负债表经济性，观点才会改善。
      - - 证券 / 稀释悬置
        - 发行新股加老股出售的结构，以及收购资金用途，使对外公布的轮次规模大于真正进入资产负债表的新现金。
        - 准确的资本结构表、优先权和老股出售结算披露，可以显著消除这一悬置。
      - - AI / B2B 执行风险
        - 白标和 AI 扩张可以加深护城河，但前提是可解释性、合规和合作伙伴接入都能在规模化后站稳。
        - 有记录的企业部署、监管者认可证据和可复现的转化数据，将支持更强的投资判断。
    notes: 反论点针对证券而非否定公司：nesto 可能运营能力很强，但对于在上一轮价格入场的新投资者，披露仍然不足。
    claimRefs:
      - CV002
      - CV006
      - CV007
      - CV008
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 盈利规模转化为可见的经常性软件、服务和放贷经济性；AI 采用提高处理效率，且没有监管摩擦。
        - 估值达到或高于最近披露的 C$1.47B，因为隐藏的经济性证明其优于市场目前所能观察到的水平。
        - 需要经审计的分部经济性、清晰的优先权条款和重复的企业采用。
        - AI 可解释性、合作伙伴采纳或服务经济性无法验证商业化叙事。
      - - 基准
        - 当前规模和投资者支持真实存在，但公开披露仍不完整，上行空间比经营故事更难量化。
        - 大致接近最近披露的估值；估值合理，但错价不足以支持高信念买入。
        - 与今天的证据集最匹配：经营证据强，但承销细节不完整。
        - 新信息显示盈利范围狭窄、具有一次性，或依赖脆弱的资本市场条件。
      - - 悲观
        - 以老股出售为主的融资、未披露的优先权和有限的可比证据，掩盖了弱于暗示水平的单位经济性或更慢的 B2B 变现。
        - 充分评估证券条款和现金生成质量后，估值低于最近披露的轮次。
        - 如果尽调发现激进的优先权、疲软的企业转化或利润率走弱，悲观情景更可能出现。
        - 任何降价轮信号、不利的条款清单结构或重大的商业化失误，都会使案例转入这一情景。
    notes: 区间以最近披露轮次为参照，因为指定证据池没有指标口径足够可比的公开 / 私有公司集合，无法精确计算倍数。
    claimRefs:
      - CV001
      - CV005
      - CV007
      - CV009
      - CV010
      - CV014
      - CV015
      - CV016
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 公开里程碑显示，nesto 正从数字经纪业务扩展为更完整的抵押贷款运营栈。
    data:
      items:
        - year: '2018'
          label: 创立与初始经纪模式
          detail: 独立报道称，公司于 2018 年由四位创始人与 Diagram 共同创立，起步于数字经纪业务。
          tone: neutral
        - year: '2020'
          label: A 轮与纵向整合推进
          detail: YesPress 报道了一轮 C$11.5 million 的 A 轮融资，并称公司开始转向掌控承销、放贷和服务。
          tone: opportunity
        - year: '2021'
          label: B 轮披露
          detail: YesPress 将 C$76 million 的 B 轮列入公司融资历史。
          tone: opportunity
        - year: '2022'
          label: 与 IG Wealth Management 共同推出 B2B
          detail: 公开报道称，Nesto 在完成 C 轮融资时，与 IG Wealth Management 一起推出了 B2B 产品。
          tone: opportunity
        - date: '2024-06-01'
          label: 收购 CMLS
          detail: Nesto 收购 CMLS Group，增加了服务、商业贷款和经纪渠道能力。
          tone: opportunity
        - year: '2024'
          label: Canada Life 服务委托开始
          detail: YesPress 称，Canada Life 选择 Nesto 从 2024 年起接管其住宅抵押贷款组合的服务和支持。
          tone: opportunity
        - period: 2025-09
          label: Nesto Cloud 全面推出
          detail: BetaKit 报道称，Nesto 在整合 CMLS 管理层和技术后，已向金融机构全面推出 Nesto Cloud。
          tone: opportunity
        - date: '2026-06-11'
          label: E 轮与 Maestro AI 发布
          detail: 公开报道将 CAD 302 million 的 E 轮融资和 CAD 1.47 billion 的估值，与 Maestro AI 发布及公司自报盈利联系起来。
          tone: opportunity
    approximationNotes: 日期采用保留公开来源所能提供的精度；部分里程碑仅精确到年份或时期。
