      - number: '1.3'
        title: 融资历史、平台扩张与规模拐点
        blocks:
          - type: paragraph
            body: >-
              现有证据最清楚地展示了 nesto 的战略扩张路径。公开报道将 2022 年 B2B 业务的起步与 IG Wealth Management 联系起来，随后公司通过收购和合作扩大覆盖：Canada Life 从
              2024 年起选择 Nesto 提供抵押贷款组合服务，2024 年 6 月的 CMLS 交易增加了商业贷款和服务能力，YesPress 则称 M3 关系带来了超过 8,500
              名经纪人的接入，并通过利率平价机制降低渠道冲突。融资最终在 2026 年 6 月达到 Series E、CAD 1.47 billion
              估值。该轮的重要性不在于炫目的数字，而在于它佐证了大型机构愿意支持更完整的抵押贷款运营体系，而不只是直接渠道。
