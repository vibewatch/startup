  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              现有公开证据已不支持把 nesto
              仅视为数字抵押贷款经纪。独立报道和公司材料一致描述了一个纵向整合的业务栈，覆盖消费者贷款发起、融资、服务、商业抵押贷款活动，以及面向金融机构销售的白标抵押贷款基础设施。这实质上改变了市场边界：相关支出不只是借款人获客或比价，还包括银行、信用合作社、保险公司、经纪网络和商业地产贷款机构在贷款发起、承保、服务和合规流程上的运营预算；这些机构可能采购或外包相关流程。替代方案也相应更宽。YesPress
              描述的竞争者包括银行、非银行贷款机构、数字抵押贷款品牌和银行内部技术团队，因此默认替代方案往往是现有流程或内部自建，而不是另一款金融科技应用。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM009
              - CM013
      - number: '2.2'
        title: 市场规模视角：广义抵押贷款存量与公开运营规模代理指标
        blocks:
          - type: paragraph
            body: >-
              现有来源包含一个自上而下的广义市场数字和若干运营规模数据点，但没有清晰的公开 SAM 或 SOM。最宽的视角是 nesto 称其正在帮助改变加拿大 C$2.1T 的抵押贷款行业，该数字在公司新闻稿中归因于
              CMHC。它界定了外部边界，但单独看过于宽泛，不能作为软件或渠道市场规模估计。更具体的公开信号是自内向外的代理指标：公司称其管理着超过 C$80B 的住宅和商业抵押贷款，并在 2026 年迄今发放超过
              C$37B。它们显示当前规模和流程份额，却无法拆分机会中属于 D2C 放贷、经纪渠道交易量、服务收入或 Nesto Cloud 软件支出的部分。因此，市场规模应被理解为一组受约束的视角，而不是完整的
              TAM/SAM/SOM 级联。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM014
              - CM016
