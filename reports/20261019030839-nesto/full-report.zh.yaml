    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、覆盖范围与运营模式
        blocks:
          - type: paragraph
            body: >-
              当前第三方报道将 nesto
              描述为总部位于蒙特利尔的抵押贷款科技公司，而不只是消费者获客网站。现有来源支持双重模式：一端是面向消费者的数字化抵押贷款，另一端是面向金融机构的白标软件或服务基础设施。公司自有页面也显示，平台如今覆盖贷款发起、融资和服务，而不只是经纪层。公开记录还支持其拥有可观的消费者触达，但公司表述仍较宽泛：首页称
              nesto 已帮助超过 450,000 名加拿大人，而现有来源没有给出更严格的活跃客户定义。即便成立年份也不完全一致，留存来源同时出现 2018 年和 2019 年。
