              - CV007
              - CV008
              - CV010
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.2'
        title: 融资质量、反论点与可能改变判断的因素
        blocks:
          - type: paragraph
            body: >-
              投资论点最适合被表述为“证据质量问题”，而不是简单的增长问题。积极的一面是，公司正将运营规模与更广的分销模式结合起来，覆盖直接放贷、经纪渠道、服务和 B2B
              软件。谨慎的一面是，融资本身存在歧义：宣布的轮次混合了新发和老股转让，部分资金用于买出早期持有人，且至少一个留存来源报告了具体拆分，但更广泛的独立来源没有公司确认。这很重要，因为知名投资人的价格支持不等于新增资产负债表资本，也不等于对稀释、清算优先权或老股转让价格有清晰信息。因此，反论点不是“公司很弱”，而是“公司很强，但证券披露仍不足”。如果
              nesto 披露经常性收入质量、单位经济性和证券条款，证明上一轮价格不仅合理而且有吸引力，判断会明显改善。
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: 情景框架
        blocks:
          - type: paragraph
            body: >-
              情景区间应锚定最近披露的轮次，而不是合成的公开可比公司，因为现有证据没有足够可比、且拥有可用收入或盈利基准的同行集合。乐观情景下，nesto
              的运营规模、盈利状态和机构分销将成为软件加服务平台的基础，变现能力强于市场当前所见。基准情景下，这些优势真实存在，但只足以守住上一轮估值，不能让其显得明显便宜。悲观情景下，目前阻碍买入的同一层不透明性，之后可能暴露出更弱的单位经济性、更重的优先权负担，或比融资叙事暗示的更慢的机构商业化。由于公开证据尚未填补这些缺口，估值区间最好相对于上一轮表达，而不是给出绝对企业价值的虚假精确度。
            claimRefs:
              - CV001
              - CV005
              - CV009
              - CV010
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV009
              - CV010
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 最终尽调问题与论点破坏触发器
        blocks:
          - type: paragraph
            body: >-
              即使相关信息尚未公开，剩余工作也很容易定义。第一，nesto
              需要按业务分部展示经审计或董事会级别的收入、毛利率、损失表现以及仓储或融资额度经济性，让投资人能把交易量和盈利说法转化为持久的现金创造质量。第二，投资人必须了解准确的资本结构：Series E
              中多少是真正的新发资本、授予了哪些权利、老股转让价格是多少、早期轮次在结构中的位置如何。第三，AI
              和白标论点需要超越发布语言和管理层野心的客户证明，尤其是对于可解释性和合规本身就是产品组成部分的受监管承保流程。如果无法解决这些问题，任何近期买入决定都应放弃该论点，因为市场规模故事已经反映在价格中，而承保细节尚未进入公开文件。
            claimRefs:
              - CV007
              - CV009
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 公开证据支持继续跟踪，而非买入
            body: nesto 已凭规模和战略支持赢得认可；缺少的是足够的公开财务和证券细节，以证明上一轮仍提供有吸引力的上行空间。
            calloutType: recommendation
            claimRefs:
              - CV001
