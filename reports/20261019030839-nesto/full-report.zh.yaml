              - CP013
      - number: '3.3'
        title: 定价、产品包装与渠道经济性仍仅部分透明
        blocks:
          - type: paragraph
            body: >-
              面向消费者的定位比企业定位清晰。nesto 官方页面把受薪顾问、较低的公开抵押贷款利率和数字优先流程，放在协商式银行报价与佣金驱动经纪的对立面。指定资料池对竞争者定价的证据薄得多：Nesto Cloud
              没有公开合同价格，银行、First National、Equitable、MCAP、Pine、Ratehub 和 True North 也没有可比价目表。经纪渠道又增加了一层复杂性。Yespress 称，M3
              arrangement（合作安排）让经纪与直销渠道保持利率一致，以管理渠道冲突；这能守住分销入口，也说明 nesto 必须在增长与伙伴信任之间拿捏分寸。
            claimRefs:
              - CP006
              - CP010
              - CP011
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
