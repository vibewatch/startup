              - CV004
              - CV007
              - CV015
              - CV016
          - type: callout
            title: 估值风险在证券，而不只在业务
            body: 新发与老股转让的构成、未披露的优先权以及缺失的分部经济性，意味着 headline 估值可能高估了新投资人实际买到的东西。
            calloutType: risk
            claimRefs:
              - CV007
