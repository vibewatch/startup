      - number: '3.4'
        title: 持久性更多取决于执行，而不是新奇性
        blocks:
          - type: paragraph
            body: >-
              现有证据中最可信的护城河不是某个单一消费者功能，而是公司从经纪商转向贷款机构、再到服务商，并将这套能力卖回机构后形成的控制栈。数据反馈回路、嵌入式服务和伙伴流程可以加深切换成本。但同样的证据也说明，商品化和现有机构反击仍是真实风险。BetaKit
              引述一位金融科技运营者称，消费者期待许多金融科技公司无法保证的合规与监管信任；Yespress 也警告，这套打法需要耐心资本、牌照、安全控制、机构信誉和足够交易量来吸收合规成本。实际上，nesto
              必须持续证明其整合模式不只是更快的前端，同时还要与更大的资产负债表和分销网络竞争。
            claimRefs:
