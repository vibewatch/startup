      - number: '3.2'
        title: 'Profiles: nesto overlaps with lenders, channels, and software vendors'
        blocks:
          - type: paragraph
            body: >-
              nesto's own evolution explains why so many competitor classes matter. The company started as a digital
              broker, then moved into lending and servicing so it could control underwriting, funding, and post-close
              operations; it later packaged that operating system as Nesto Cloud for institutions. Independent reporting
              says IG Wealth integrated nesto's white-label tools, Canada Life selected the group for servicing support,
              Alterna Savings chose Intellifi for loan processing, and the M3 alliance added broker reach. Those
              relationships do not remove competition; they reposition it. The company is selling software and
              outsourced operations to institutions that may also be competitors in direct lending, while still
              competing for consumer acquisition and funded loan volume.
            claimRefs:
              - CP001
              - CP002
              - CP003
