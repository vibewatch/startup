  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Public evidence in the assigned pool no longer supports treating nesto as only a digital mortgage broker.
              Independent reporting and company materials consistently describe a vertically integrated stack that spans
              consumer origination, funding, servicing, commercial mortgage activity, and white-label mortgage
              infrastructure sold to financial institutions. That materially changes the market boundary: the relevant
              spend is not just borrower acquisition or comparison-shopping, but also the mortgage operations budgets of
              banks, credit unions, insurers, broker networks, and commercial real estate lenders that may buy or
              outsource origination, underwriting, servicing, and compliance workflows. The substitute set is
              correspondingly wider. YesPress describes competition from banks, non-bank lenders, digital mortgage
              brands, and internal bank technology teams, which means the default alternative is often an incumbent
              workflow or internal build rather than another fintech app.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM009
              - CM013
      - number: '2.2'
        title: 'Sizing lenses: broad mortgage stock versus public operating-scale proxies'
        blocks:
          - type: paragraph
            body: >-
              The pool contains one broad top-down market number and several operating-scale datapoints, but not a clean
              public SAM or SOM. The broadest lens is nesto's statement that it is helping transform Canada's C$2.1T
              mortgage industry, a figure attributed to CMHC in the company release. That defines the outer boundary,
              but it is too broad to use as a software or channel-specific market estimate on its own. The more concrete
              public signals are inside-out proxies: the company says it manages over C$80B in residential and
              commercial mortgages under administration and has originated more than C$37B so far in 2026. Those numbers
              show current scale and share of workflow, but they do not isolate how much of the opportunity is D2C
              lending, broker-channel volume, servicing revenue, or Nesto Cloud software spend. Accordingly, the sizing
              view should be read as a set of constrained lenses rather than as a complete TAM/SAM/SOM cascade.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM014
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM011
              - CM014
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM014
              - CM016
      - number: '2.3'
        title: Buyer, user, and payer map
        blocks:
          - type: paragraph
            body: >-
              The buyer map is multi-sided. YesPress says the combined group now serves homeowners, brokers, commercial
              real estate clients, and institutions that would rather rent a modern mortgage operation than build one.
              That framing aligns with FinTech Futures and BetaKit, both of which describe nesto as offering
              direct-to-consumer digital lending while also selling white-label software or infrastructure to financial
              institutions. In practice, that means end borrowers are users in the consumer flow, brokers are channel
              partners who care about fundability and workflow speed, and institutional buyers are the economic decision
              makers for SaaS, servicing, or outsourced-operations deployments. The adoption path also differs by
              segment: D2C and broker channels scale through rate and workflow competitiveness, while institutional
              expansion depends on onboarding named partners and winning trust for high-stakes credit operations.
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM010
              - CM012
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM010
              - CM012
              - CM016
      - number: '2.4'
        title: Growth drivers, adoption constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The strongest public demand driver in the pool is workflow improvement in an operationally painful
              category. Mortgage Professional America cites a 2025 broker survey where faster portals, cleaner
              workflows, underwriter access, and adaptable credit policies won volume, directly supporting nesto's pitch
              around underwriting speed and better process quality. BetaKit and YesPress add a second driver: incumbent
              banks and insurers are now more open to partnering with fintech infrastructure providers than in earlier
              periods, which expands the reachable buyer set for white-label distribution. The constraints are equally
              important for valuation. Public proof of ROI still rests mostly on vendor claims, and both MPA and BetaKit
              emphasize auditable decisions, human oversight, and regulatory trust as table stakes. YesPress also notes
              that vertical integration required patient capital, licences, security controls, institutional
              credibility, and enough volume to absorb compliance and servicing costs. Those dependencies make the
              market opportunity real, but harder to monetize than a generic "large mortgage TAM" narrative would
              suggest.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public sizing still breaks at the software layer
            body: >-
              The assigned evidence supports a real market and real operating scale, but not a clean public SAM/SOM for
              Nesto Cloud or for channel-level economics. That matters because valuation upside depends on whether nesto
              captures mortgage balances, servicing revenues, or software-like contract value at attractive margins; the
              public record still compresses those very different value pools into one ecosystem narrative.
            calloutType: risk
            claimRefs:
              - CM011
              - CM014
