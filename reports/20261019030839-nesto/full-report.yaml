  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: competition now spans four rooms'
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence suggests that nesto's competitive set is wider than a normal digital mortgage
              comparison page would imply. Yespress describes the company as serving four constituencies at once —
              homeowners, brokers, commercial real estate clients, and institutions that would rather rent a modern
              mortgage operation than build one — and then states that the competition changes by room. In that framing,
              banks plus First National, Equitable, MCAP, and other non-bank lenders compete for funded mortgage volume;
              Pine, Ratehub, and True North compete for digital attention; and enterprise software vendors or bank
              technology teams compete for infrastructure budget. That mix makes status quo processes, internal build,
              and partnership-oriented incumbents as relevant as consumer-facing fintech peers.
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP009
