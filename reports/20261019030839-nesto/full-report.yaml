  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface now spans consumer lending, institutional software, and operating assets
        blocks:
          - type: paragraph
            body: >-
              The clearest product change since nesto's early consumer-lending story is scope: official group materials
              now present nesto, CMLS, and Nesto Cloud as one mortgage ecosystem that can reach borrowers through
              direct, broker, institutional, and commercial channels. That matters because the underwriting case is no
              longer just "better mortgage shopping UX." The company's product thesis is that a shared mortgage
              operating layer can support both a consumer journey and a white-label institutional workflow, while CMLS
              contributes servicing and commercial depth that a pure D2C app would not have. The workflow remains hybrid
              rather than fully self-service: nesto still markets salaried advisors and transparent rate shopping as
              part of the customer experience, while Nesto Cloud is sold as a lender-facing system that can also be
              delivered with outsourced operations.
