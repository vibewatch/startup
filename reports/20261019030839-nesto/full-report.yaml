              - CE008
              - CE012
      - number: '5.3'
        title: Differentiation comes from verticalization and institutional embed, not AI copy alone
        blocks:
          - type: paragraph
            body: >-
              nesto's product differentiation is strongest where technology and asset ownership intersect. Independent
              coverage and official pages both frame the company as moving from direct-to-consumer lender toward a
              broader mortgage ecosystem builder, with Nesto Cloud positioned for financial institutions and CMLS adding
              scale in servicing and commercial lending. The June 2026 financing round reinforces that direction:
              third-party reports tie the new capital to further AI and platform buildout, while Maestro AI was launched
              as an underwriting and orchestration layer meant to speed decisions and partner onboarding. In practice,
              the moat is not the phrase "AI-driven" but whether nesto can repeatedly turn its own underwriting,
              servicing, and BPO tooling into software and operating leverage that institutions keep buying.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Trust and control posture remain less public than product capability
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence gives enough detail to believe there is a real software platform and an active
              platform-engineering function, but it is still thin on externally verifiable control proof. Public
              materials speak in terms of compliance, security remediation, and AI-enabled automation, yet the pool does
              not include third-party attestations, public uptime reporting, incident history, or model-governance
              disclosures that would let an investor evaluate operational resilience the same way a regulated partner
              would. That does not disprove the controls; it means the product chapter should treat trust, reliability,
              and AI governance as live diligence items rather than as confirmed strengths.
            claimRefs:
              - CE006
              - CE008
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Verticalization is the actual product story
            body: >-
              nesto looks more defensible when framed as a mortgage operating system spanning software, servicing, and
              distribution rather than as a rate-comparison front end with AI branding layered on top.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE009
              - CE012
          - type: callout
            title: Public control evidence still trails platform ambition
            body: >-
              The company discloses meaningful architecture detail, but investors still need third-party proof on
              uptime, security controls, and AI governance before treating the trust layer as a validated competitive
              advantage.
            calloutType: risk
            claimRefs:
              - CE005
              - CE006
              - CE008
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segment mix has widened beyond direct borrowers
        blocks:
          - type: paragraph
            body: >-
              nesto's customer base is no longer a single retail-borrower cohort. The direct-to-consumer business still
              targets homeowners shopping for purchase, renewal, and refinance mortgages, with the company positioning
              salaried advisors and a digital workflow as the core experience. Public 2026 sources also show a broader
              institutional surface: Nesto Cloud is marketed to financial institutions, credit unions, and commercial
              real estate lenders, while the broader group now includes CMLS and Intellifi. That means the relevant
              "customer" can be a homeowner, a broker-facing lending channel, a wealth or insurance distributor, or an
              institution outsourcing mortgage operations. The customer journey figure matters because nesto's expansion
              logic is sequential: direct lending generated underwriting and servicing know-how, then that workflow was
              resold into white-label and outsourced institutional use cases.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU007
          - type: table
            tableRef: TU001
            claimRefs:
