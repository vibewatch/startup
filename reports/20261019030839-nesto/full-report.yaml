              - CU002
              - CU003
              - CU010
              - CU012
              - CU013
      - number: '6.2'
        title: Named institutional proof is stronger than logo-only evidence
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption evidence in the assigned pool is not generic logo placement but named workflow
              responsibility. YesPress describes IG Wealth Management as a defining customer and partner that integrated
              nesto's white-label tooling into adviser workflows; the same piece says Canada Life selected nesto to take
              over servicing and support for an existing residential mortgage portfolio and that Alterna Savings chose
              Intellifi for loan processing and technology. Independent press also supports scale milestones around the
              pivot: Business Blab reported more than 450,000 Canadians served by June 2026, while company and press
              materials repeat C$80B+ mortgages under administration. Those are meaningful adoption signals, but they
              remain deployment and volume indicators rather than proof of long-term retention or expansion economics.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU008
              - CU009
              - CU012
              - CU014
          - type: table
            tableRef: TU002
