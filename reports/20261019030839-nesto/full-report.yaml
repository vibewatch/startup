      - number: '4.2'
        title: Public pricing is limited to borrower rates, not realized economics
        blocks:
          - type: paragraph
            body: >-
              The accessible consumer surface displayed four mortgage rates on the access date, while nesto says its
              advisors are salaried and rewarded on customer satisfaction rather than commission. That compensation
              design may reduce transaction-level sales incentives, but it is not evidence of customer acquisition cost,
              advisor productivity, approval conversion, or payback. No assigned source discloses Nesto Cloud
              subscription prices, usage fees, minimum commitments, implementation charges, discounts, renewal terms, or
              BPO pricing. The public mortgage rates are customer offers, not revenue yields or realized margins, and
              borrower eligibility and funding costs remain necessary to interpret their economics.
