  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - View
      - What would change the view
    rows:
      - - Scale proof
        - >-
          More than C$80B MUA, more than C$37B 2026 originations, and multiple profitability references support real
          operating substance.
        - >-
          Contrary audited performance, slowing origination quality, or weak servicing economics would reduce
          conviction.
      - - Institutional validation
        - La Caisse, Fidelity, and other investors validate strategic interest in nesto’s platform and AI thesis.
        - >-
          The view improves only if those relationships translate into durable software, servicing, or balance-sheet
          economics.
      - - Security / dilution overhang
        - Primary-plus-secondary structure and buyout use make the headline round larger than fresh balance-sheet cash.
        - Exact cap-table, preference, and secondary-clearing disclosures could reduce this overhang materially.
      - - AI / B2B execution risk
        - >-
          White-label and AI expansion can deepen the moat, but only if explainability, compliance, and partner
          onboarding hold up at scale.
        - >-
          Documented enterprise deployments, regulator-comfort evidence, and repeatable conversion data would support a
          stronger call.
    notes: >-
      The anti-thesis is security-specific rather than company-denial: nesto may be strong operationally while still
      being under-disclosed for a new investor at the last round price.
