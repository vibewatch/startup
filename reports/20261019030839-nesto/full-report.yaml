      - number: '3.3'
        title: Pricing, packaging, and channel economics remain only partly transparent
        blocks:
          - type: paragraph
            body: >-
              The consumer proposition is clearer than the enterprise one. nesto's official pages position salaried
              advisors, low published mortgage rates, and a digital-first process as the alternative to negotiated bank
              offers and commission-led brokerage. Public evidence for competitor pricing is much thinner in the
              assigned pool: there is no disclosed Nesto Cloud contract pricing, and the evidence does not provide
              comparable public price sheets for banks, First National, Equitable, MCAP, Pine, Ratehub, or True North.
              The broker channel adds another wrinkle. Yespress says the M3 arrangement uses rate parity between broker
              and direct channels to manage channel conflict, which helps preserve distribution access but also shows
              how carefully nesto must balance growth with partner trust.
            claimRefs:
              - CP006
              - CP010
              - CP011
              - CP013
          - type: table
