              - CP010
              - CP011
              - CP013
              - CP014
      - number: '3.4'
        title: Durability depends on execution more than novelty
        blocks:
          - type: paragraph
            body: >-
              The most credible moat in the assigned evidence is not a single consumer feature; it is the control stack
              created by moving from broker to lender to servicer and then selling that stack back to institutions. That
              structure can deepen switching costs through data feedback loops, embedded servicing, and partner
              workflows. But the same evidence also shows why commoditization and incumbent response remain real.
              BetaKit quotes a fintech operator saying consumers expect compliance and regulatory trust that many
              fintechs cannot guarantee, and Yespress warns that this playbook required patient capital, licences,
              security controls, institutional credibility, and enough volume to absorb compliance costs. In practice,
              nesto must keep proving that its integrated model is more than a faster front end while competing with
              bigger balance sheets and distribution networks.
