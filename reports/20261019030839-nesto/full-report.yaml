      - number: '4.3'
        title: Scale signals are material, but cash conversion is not visible
        blocks:
          - type: paragraph
            body: >-
              Fintech.ca reports that nesto claims profitability and more than C$80 billion of mortgages under
              administration, while separate coverage reports more than C$37 billion of 2026 originations. These are
              operating scale indicators, not revenue, ARR, cash, or gross profit. The June 2026 financing is similarly
              easy to overstate: the C$302 million transaction was reported as C$107 million of primary capital and
              C$195 million of secondary capital, so only the primary portion is described as new company capital.
              Public coverage says proceeds support technology, AI, and faster partner onboarding, but provides no
              opening cash, burn, runway, debt, warehouse capacity, covenants, or next-round trigger.
            claimRefs:
