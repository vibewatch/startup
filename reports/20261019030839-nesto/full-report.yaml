chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and operating model
        blocks:
          - type: paragraph
            body: >-
              nesto is publicly described in current third-party coverage as a Montreal-based mortgage technology
              company, not just a consumer lead-generation site. The retained source set supports a dual model:
              direct-to-consumer digital mortgage lending on one side and white-label software or servicing
              infrastructure for financial institutions on the other. Company-controlled pages reinforce that the
              platform now spans origination, funding, and servicing rather than a pure brokerage layer. The public
              record also supports meaningful consumer reach, but only in broad company language: the homepage says
              nesto has helped 450,000+ Canadians, while the assigned pool does not provide a tighter active-customer
              definition. Even the founding date is not perfectly clean, with 2018 and 2019 both appearing in retained
              sources.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
