      - number: '1.3'
        title: Funding history, platform expansion, and scale inflection points
        blocks:
          - type: paragraph
            body: >-
              The evidence is strongest on nesto's strategic expansion path. Public reporting ties the 2022 B2B debut to
              IG Wealth Management, then shows the company using acquisition and partnership moves to widen its
              footprint: Canada Life selected Nesto for mortgage-portfolio servicing starting in 2024, the June 2024
              CMLS deal added commercial and servicing capabilities, and YesPress reports the M3 relationship added
              access to more than 8,500 brokers with rate-parity mechanics intended to reduce channel conflict.
              Financing culminated in the June 2026 Series E at a CAD 1.47 billion valuation. That round matters less as
              a vanity number than as corroborated evidence that large institutions were willing to back a broader
              mortgage operating stack, not only a direct channel.
