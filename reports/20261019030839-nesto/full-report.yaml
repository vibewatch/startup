      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              Revenue quality could improve if enterprise software, BPO, and servicing become a larger recurring
              component, while automation could lower processing cost. Neither proposition is quantified in the assigned
              public evidence. The strongest disclosed facts are platform scale, a company-claimed profitability status,
              and C$107 million of primary financing; they do not establish sustainable margins or capital adequacy.
              Round nomenclature also conflicts, with one outlet calling the transaction Series E and another Series F.
              Independent coverage flags regulatory, privacy, competitive, and scaling execution risks, and the company
              media page lists CMLS servicer ratings without the underlying reports. Underwriting therefore requires
              segment financials, cohort unit economics, cash and debt schedules, warehouse terms, and audited
              statements.
            claimRefs:
              - CI003
              - CI007
              - CI008
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
