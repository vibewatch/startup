  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture is broader than a digital brokerage
        blocks:
          - type: paragraph
            body: >-
              nesto now describes an end-to-end mortgage platform spanning origination, funding, and servicing, while a
              company-hosted interview says management diversified into a B2B Mortgage Cloud line for financial
              institutions. Third-party coverage adds two possible monetization mechanisms: direct lending income and
              enterprise software licensing. A current company job repost also describes business-process outsourcing
              and a high-growth B2B or SaaS operating context. Together, the evidence supports a multi-line model rather
              than a single broker commission stream, but it does not quantify revenue by line, contract structure, take
              rate, recurring mix, or revenue-recognition policy. Commercial mortgage lending and servicing add scale,
              yet the assigned evidence does not isolate their contribution.
