  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          Profitable scale converts into visible recurring software, servicing, and lending economics; AI adoption
          improves throughput without regulatory friction.
        - >-
          At or above the last disclosed C$1.47B valuation because hidden economics prove better than the market can
          currently observe.
        - Requires audited segment economics, clean preference terms, and repeat enterprise adoption.
        - AI explainability, partner uptake, or servicing economics fail to validate the commercialization story.
      - - Base
        - >-
          Current scale and investor support are real, but public disclosure stays incomplete and upside remains harder
          to quantify than the operating story.
        - Approximately around the last disclosed valuation; fair, but not sufficiently mispriced for a conviction buy.
        - 'Best fit with today’s evidence set: strong operating proof, incomplete underwriting detail.'
        - New information shows profitability is narrow, one-time, or dependent on fragile capital-market conditions.
      - - Bear
        - >-
          Secondary-heavy financing, undisclosed preferences, and limited comp evidence mask weaker unit economics or
          slower B2B monetization than implied.
        - Below the last disclosed round once security terms and cash-generation quality are fully underwritten.
        - >-
          Becomes more likely if diligence surfaces aggressive preferences, soft enterprise conversion, or margin
          weakness.
        - >-
          Any down-round signal, adverse term-sheet structure, or material commercialization miss would move the case
          here.
    notes: >-
      Ranges are expressed relative to the last disclosed round because the assigned evidence pool does not contain a
      comparable public/private set with sufficient metric parity for precise multiple work.
