        title: Public engineering evidence points to a modern cloud stack, not a thin brokerage layer
        blocks:
          - type: paragraph
            body: >-
              The most concrete technical proof in the assigned pool is the platform hiring surface. nesto describes a
              Google Cloud deployment with a TypeScript/React front end, Go microservices, REST APIs, pub-sub queues,
              Kubernetes orchestration, Datadog monitoring, and infrastructure automation through GitHub Actions,
              ArgoCD, Pulumi, and Crossplane. That is materially more specific than generic "AI-powered platform"
              marketing language and supports the view that Nesto Cloud is built as an operating system for lending
              workflows rather than a rate-comparison shell. The tradeoff is execution complexity: distributed services,
              multiple gateways, and an internal developer platform create real scale advantages if they work, but they
              also increase the burden on observability, secure change management, and human exception handling.
