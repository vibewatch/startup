            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU010
              - CU014
      - number: '6.3'
        title: Durability and concentration remain under-disclosed
        blocks:
          - type: paragraph
            body: >-
              Public evidence is much thinner on retention, renewal behavior, and partner concentration than on top-line
              adoption. The consumer-facing about-us page offers curated testimonials and savings anecdotes, but no
              churn, renewal, cohort, NPS, NRR, or GRR disclosure. For institutional customers, the public record names
              partners and product scope but not contract length, implementation timelines, active-user counts,
              origination contribution, or revenue concentration by IG Wealth Management, Canada Life, M3, or the
              broker/CMLS channel. BetaKit adds a useful cautionary lens: nesto is collaborating with the same banks it
              competes against, and the category still depends on counterparties trusting fintech compliance and
              execution. The result is a chapter that can verify breadth of customer surfaces and named workflow wins,
              but not durability or concentration quality.
            claimRefs:
              - CU010
              - CU011
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Named workflow owners matter more than logo presence
            body: >-
              IG Wealth Management, Canada Life, Alterna Savings, and the M3/CMLS channel give nesto public customer
              proof that extends beyond a consumer logo wall into adviser, servicing, processing, and
              broker-distribution workflows.
            calloutType: strength
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU010
          - type: callout
            title: Durability is inferred, not measured
            body: >-
              The assigned sources do not disclose churn, renewal rates, NRR/GRR, contract length, or customer
              concentration, so the current customer story is better evidenced on breadth of deployment than on
              persistence or quality of revenue.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The central risk is that nesto is no longer a narrow online mortgage broker. Its own materials say it has
              become a full end-to-end platform that now originates billions annually, while independent coverage says
              the CMLS acquisition expanded the business from a 350-person startup to a 1,100-person organization with
              large servicing and origination responsibilities. At the same time, management is pushing white-label
              infrastructure for financial institutions and launching Maestro AI as a faster underwriting layer. That
              combination creates a stacked execution burden: management has to integrate a much larger acquired
              business, maintain credit and conduct controls across multiple provinces, prove AI-assisted decisioning is
              governable, and avoid over-reliance on a small set of banks and capital partners.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR007
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR012
              - CR013
              - CR014
      - number: '7.2'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a real compliance posture, but not yet a diligence-grade one. The company states
              that it is licensed by the provincial regulator in each province where it operates and that its mortgage
              experts are licensed professionals, which is a necessary baseline for online origination. The sharper risk
              comes from scope creep: Maestro AI is being marketed as a mortgage-underwriting acceleration tool, and the
              platform is now positioned for partner onboarding at scale, yet the assigned public evidence does not
              enumerate province-by-province licenses, complaint metrics, privacy controls, or regulator-reviewed
              model-governance artifacts. For an investor, the issue is less whether nesto has no controls and more
              whether the available record is too thin to validate those controls against the company's broader
              ambitions.
            claimRefs:
              - CR003
              - CR010
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR008
              - CR010
              - CR012
              - CR013
      - number: '7.3'
        title: Operating and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk is elevated because growth has come through both platform expansion and acquisition.
              BetaKit reports that nesto spent the year after the CMLS acquisition integrating executives and
              technology, while independent reports tie the June 2026 financing to faster partner onboarding and more AI
              development. That means the company is scaling product surface area and counterparty dependence at the
              same time. The B2B thesis depends on financial institutions adopting Nesto Cloud, on partner underwriters
              feeding useful data back into the system, and on external data rails such as a CRA API eventually
              improving income validation. Any delay in integration, partner adoption, or credit-quality feedback loops
              would directly weaken the operating case.
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR009
              - CR012
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR010
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR011
              - CR013
              - CR014
      - number: '7.4'
        title: Monitoring and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The strongest thesis-break triggers are measurable. A regulatory or privacy intervention tied to AI-led
              underwriting, evidence that partner onboarding is slower than capital deployment implies, or
              servicing-quality deterioration during CMLS integration would all undermine the idea that nesto can
              compound as both lender and infrastructure provider. Financial transparency is a second gating issue:
              management and investors have supplied valuation and profitability claims, but public reporting still
              leaves revenue, warehouse-facility terms, the undisclosed Series D, and the CMLS purchase economics
              outside the public record. Before conviction, diligence should move from narrative to artifacts: licensing
              schedules, model-governance documentation, partner concentration, servicing-quality KPIs, and
              capital-structure detail.
            claimRefs:
              - CR002
              - CR008
              - CR011
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Kill criteria to monitor before conviction
            body: >-
              Treat three events as thesis-break triggers: a regulatory challenge to AI-assisted underwriting or privacy
              controls, material slippage in partner onboarding or servicing integration after CMLS, or new disclosure
              showing weaker-than-claimed profitability once capital and warehouse dependence are fully normalized.
            calloutType: risk
            claimRefs:
              - CR006
              - CR008
              - CR011
              - CR012
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: |-
              nesto’s latest public financing anchors the price discussion: multiple 2026 sources corroborate a
              C$302 million Series E at a C$1.47 billion valuation, alongside operating-scale signals that are
              unusual for a still-private Canadian mortgage platform. The same evidence base also shows why the
              call should remain track rather than buy. Scale, profitability claims, institutional sponsorship,
              and white-label distribution are all real, but public materials still do not disclose the revenue
              composition, margin durability, or preference stack that would let an investor test whether the
              round price leaves adequate upside after dilution and execution risk. That makes the company easier
              to admire than to price. The right discipline is to keep nesto in the funnel, but reserve any buy
              decision for a diligence phase that converts the company’s operating proof into underwritten return
              math rather than narrative confidence.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV010
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.2'
        title: Financing quality, anti-thesis, and what could change the call
        blocks:
          - type: paragraph
            body: |-
              The investment case is strongest when framed as a quality-of-proof question rather than a simple
              growth question. On the positive side, the company is pairing operating scale with a broadened
              distribution model that now spans direct lending, broker channels, servicing, and B2B software.
              On the cautionary side, the financing itself carries ambiguity: the announced round combined primary
              and secondary capital, some proceeds were used to buy out earlier holders, and at least one
              retained source reports a specific split without company confirmation in the broader independent
              set. That matters because price support from marquee investors is not the same as fresh balance-sheet
              capital or clean information about dilution, liquidation preferences, or secondary-clearing price.
              The anti-thesis is therefore not “weak company”; it is “strong company, still under-disclosed
              security.” The call would improve materially if nesto disclosed recurring revenue quality, unit
              economics, and security terms that show the last round is not merely defensible but attractive.
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: Scenario framing
        blocks:
          - type: paragraph
            body: |-
              The scenario range should be anchored to the last disclosed round rather than to synthetic public
              comps, because the assigned evidence pool does not contain a sufficiently comparable peer set with
              usable revenue or earnings benchmarks. In the bull case, nesto’s operating scale, profitable status,
              and institutional distribution prove to be the foundation for a software-plus-servicing platform
              with stronger monetization than the market currently sees. In the base case, those strengths are
              real but only enough to defend the last round, not to make it look obviously cheap. In the bear
              case, the same opacity that currently blocks a buy could later reveal weaker unit economics,
              heavier preference overhang, or slower institutional commercialization than the financing narrative
              implies. Because the public evidence does not yet close those gaps, the valuation range is best
              expressed relative to the last round rather than as false precision in absolute enterprise-value
              terms.
            claimRefs:
              - CV001
              - CV005
              - CV009
              - CV010
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV009
              - CV010
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: |-
              The remaining work is straightforward to define even if it is not yet public. First, nesto needs to
              show audited or board-grade revenue by segment, gross margin, loss performance, and warehouse or
              funding-facility economics so an investor can translate volume and profitability claims into durable
              cash-generation quality. Second, the investor must understand the exact capital structure: what share
              of the Series E was true primary capital, what rights were granted, what secondary clearing price was
              paid, and where earlier rounds sit in the stack. Third, the AI and white-label thesis needs customer
              proof that goes beyond launch language and management ambition, especially for regulated underwriting
              workflows where explainability and compliance are part of the product. Failure to clear those items
              should break the thesis for any near-term buy decision, because the market-scale story is already in
              the price while the underwriting detail is not yet in the public file.
            claimRefs:
              - CV007
              - CV009
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public evidence supports track, not buy
            body: >-
              nesto has already earned credit for scale and strategic backing; what is missing is enough public
              financial and security detail to prove that the last round still offers attractive upside.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV015
              - CV016
          - type: callout
            title: The valuation risk is in the security, not just the business
            body: >-
              Primary-versus-secondary mix, undisclosed preferences, and missing segment economics mean the headline
              valuation may overstate what a new investor is actually buying.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV010
              - CV012
              - CV013
