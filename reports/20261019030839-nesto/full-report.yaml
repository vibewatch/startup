        title: What is still missing from the public overview
        blocks:
          - type: paragraph
            body: >-
              The chapter can establish identity and scale, but it cannot close several investor-grade overview
              questions with the assigned public evidence. The public record still leaves revenue, run-rate, gross
              margin, and board/control rights undisclosed. The funding headline also needs care because the Series E
              combined primary and secondary capital, so the announced round size is not the same as new operating cash.
              Finally, the retained sources disagree on the founding year, which is a small issue operationally but a
              reminder that even basic company facts require document-level verification. Taken together, these gaps do
              not erase the scale story, but they do limit how confidently later chapters can translate operational
