            title: Primary capital is the relevant financing numerator
            body: >-
              The reported C$302 million transaction included C$195 million of secondary capital. Public evidence
              therefore supports C$107 million of new primary capital, before fees and uses, rather than C$302 million
              of cash available to nesto.
            calloutType: insight
            claimRefs:
