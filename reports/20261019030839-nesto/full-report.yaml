      - number: '1.2'
        title: Founders, named leadership, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The operating core is clearer than the governance layer. Independent long-form coverage attributes the
              launch to Malik Yacoubi, Karim Benabdallah, Damien Charbonneau, and Chase Belair, with Diagram shaping the
              early direction and Belair supplying licensed mortgage-market credibility. The current group site also
              surfaces named executives for servicing, partnerships, marketing, and operations, which supports
              functional breadth after the CMLS combination. What remains thin is public control visibility: the
              assigned pool names leaders and alludes to a board, but it does not provide a board roster, investor
              control rights, or other governance mechanics that matter for diligence on a scaled, recently
              recapitalized private company.
