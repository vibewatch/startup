      - [Servicing / administration, "Portfolio servicing, administration, and process outsourcing", "Payments or collections products not tied to mortgage servicing", "Institutional mortgage owners and servicers", "Creates recurring operational share even when nesto is not the consumer brand"]
    notes: >-
      Boundary logic combines company and independent descriptions; included spend is directional
      because public sources do not disclose product-level revenue or contract values.
    claimRefs: [CM001, CM002, CM003, CM008, CM009, CM013]
  - id: TM002
    title: TAM / SAM / SOM or sizing lens table
    columns:
      - Publisher
      - Year
      - Geography
      - Value
      - CAGR
      - Methodology / lens
      - Confidence
      - Limitation
    rows:
      - ["nesto (citing CMHC)", 2026, Canada, "C$2.1T mortgage industry", n/a, "Broad top-down market boundary from company release", medium, "Not a clean software TAM or segment-level SAM"]
      - [nesto / FinTech Futures / Fintech.ca / MPA, 2026, Canada, ">C$80B mortgages under administration", n/a, "Current stock-of-book operating-scale proxy", high, "Company scale metric, not addressable spend"]
      - [nesto / FinTech Futures / Fintech.ca / MPA, 2026, Canada, ">C$37B originations in 2026", n/a, "Current flow-of-volume operating-scale proxy", high, "One-year originations are not recurring revenue or market size"]
      - [YesPress, 2026, Canada, ">8,500 M3 brokers", n/a, "Distribution-capacity lens for broker channel reach", medium, "Broker count is not mortgage dollar volume"]
      - [business.blab cited by assigned pool, 2026, Canada, ">450,000 Canadians served", n/a, "Installed-user lens reported by an independent recap", low, "User count is not directly comparable with mortgage balances or software spend"]
    notes: >-
      This is a heterogeneous lens table, not a strict TAM/SAM/SOM stack. It preserves the public
      numbers available in the assigned pool while flagging that stock, flow, user, and channel
      counts are not directly comparable.
    claimRefs: [CM004, CM005, CM006, CM011, CM014, CM016]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - [Homeowners, Borrower choosing a mortgage, Borrower and nesto adviser, "Borrower via mortgage economics", "Application, advice, underwriting, funding, servicing", "Consumer mortgage economics rather than explicit software budget", "Lower rates, less paperwork, faster approvals"]
      - [Mortgage brokers, Brokerage principal / individual broker, Broker and underwriter, "Lender economics and broker compensation", "File submission, adjudication, fundability, channel conflict management", "Distribution budget and lender relationship economics", "Cleaner workflows, turnaround time, rate parity, adaptable credit policy"]
      - [Financial institutions, Bank / credit union / insurer executive sponsor, "Operations, underwriting, servicing, and branch teams", "Institutional technology or operations budget", "White-label origination, underwriting, compliance, servicing, BPO", "Mortgage operations, digital transformation, or line-of-business budget", "Need to modernize lending without rebuilding the stack internally"]
      - [Commercial real estate lenders, Lending leadership or servicing owner, "Credit, servicing, and relationship teams", "Commercial lending and servicing budget", "Commercial mortgage origination, servicing, and advice", "Commercial lending P&L / operations", "Need scale, workflow consistency, and servicing capability"]
    notes: >-
      Buyer, user, and payer can differ by segment; institutional deployments are the clearest
      case where the end borrower is the user but not the direct economic buyer.
    claimRefs: [CM002, CM008, CM009, CM010, CM012, CM016]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Public sizing is best read as a narrowing set of market lenses rather than as a fully
      disclosed TAM/SAM/SOM stack.
    data:
      items:
        - label: Canada mortgage industry
          displayValue: C$2.1T
          valueNote: "Broad market boundary cited by nesto from CMHC; not a software TAM."
        - label: Direct-to-consumer residential mortgages
          displayValue: Included segment
          valueNote: "Core consumer motion; standalone public spend not isolated in the assigned pool."
        - label: Broker-channel originations
          displayValue: Included segment
          valueNote: "Broker pathway is material, including M3 distribution, but public spend is not isolated."
        - label: Multifamily and commercial lending
          displayValue: Included segment
          valueNote: "CMLS expands the boundary into commercial and multifamily workflows."
        - label: Mortgages under administration
          displayValue: ">C$80B"
          valueNote: "Current stock-of-book scale across residential and commercial mortgages."
        - label: 2026 originations
          displayValue: ">C$37B"
          valueNote: "Current-year flow lens, not recurring revenue or software contract value."
    approximationNotes: >-
      Only the outer boundary and the two innermost operating-scale layers are publicly quantified
      in this pool; the middle layers are categorical inclusion boundaries rather than disclosed
      SAM or SOM values.
    claimRefs: [CM004, CM005, CM006, CM007, CM014, CM016]
callouts:
  - calloutType: risk
    title: Public sizing still breaks at the software layer
    body: >-
      The assigned evidence supports a real market and real operating scale, but not a clean public
      SAM/SOM for Nesto Cloud or for channel-level economics. That matters because valuation upside
      depends on whether nesto captures mortgage balances, servicing revenues, or software-like
      contract value at attractive margins; the public record still compresses those very different
      value pools into one ecosystem narrative.
    claimRefs: [CM011, CM014, CM015]
