    diligencePath: Review channel cohorts and segment contribution margins reconciled to audited consolidated results.
    relatedQuestionRefs:
      - QI003
      - QI004
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
