    whyItMatters: >-
      Integration risk is only manageable if management can show service consistency while the platform broadens across
      origination, servicing, and B2B infrastructure.
    diligencePath: >-
      Request monthly servicing and underwriting operations dashboards, customer complaint trends, incident logs, and
      concentration reporting by partner and channel.
  - type: missing-source
    severity: material
    topic: comparable-benchmarks
    missingEvidence: >-
      A model-appropriate comparable set covering public peers, private rounds, secondary marks, or M&A references with
