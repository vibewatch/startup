evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding-date
    missingEvidence: The precise legal formation and operating launch date for nesto.
    whyItMatters: A basic company fact is still inconsistent across retained public reporting.
    diligencePath: Check incorporation records, the earliest financing documents, and management-confirmed corporate history.
    relatedQuestionRefs:
      - QO004
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: Board roster, control-rights summary, and investor governance terms.
    whyItMatters: Governance concentration and control mechanics affect both diligence risk and valuation interpretation.
    diligencePath: Request the board list, shareholder-rights summary, and the latest financing documents from management.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: economics-disclosure
    missingEvidence: Revenue, revenue run-rate, gross margin, and segment economics.
    whyItMatters: The overview can verify scale and valuation, but not unit economics or quality of growth.
    diligencePath: Request audited financials, management reporting packs, and segment-level revenue/margin bridges.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder or investor map
    missingEvidence: Full ownership percentages, commercial contract terms, and the complete stakeholder list.
    whyItMatters: The public map identifies named counterparties but cannot quantify dependence or control from names alone.
    diligencePath: Reconcile the cap table, material contracts, and commercial concentration schedule in diligence.
    relatedQuestionRefs:
      - QO005
      - QO007
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: Product-level revenue, servicing fees, software pricing, and segment volume splits needed to build a real SAM/SOM.
    whyItMatters: The current public record shows scale but not which value pool drives margins or valuation.
    diligencePath: Request management reporting that breaks out D2C, broker, servicing, commercial, and Nesto Cloud economics.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: ai-roi
    missingEvidence: >-
      Independent benchmark or customer case study quantifying underwriting time, pull-through, loss-rate, or cost
      improvement from Nesto Cloud or Maestro AI.
    whyItMatters: >-
      Without external proof, workflow-speed claims support narrative momentum but not durable pricing power or adoption
      certainty.
    diligencePath: >-
      Obtain signed partner case studies or operational cohort data from IG, Canada Life, Alterna, or other live
      institutional deployments.
    relatedQuestionRefs:
      - QM005
      - QM006
      - QM008
  - type: private-evidence-only
    severity: minor
    topic: institutional-market
    missingEvidence: Public contract values or disclosed mortgage-operations software budgets from partner institutions.
    whyItMatters: The buyer map is clear, but the reachable wallet share per institutional customer is still opaque.
    diligencePath: >-
      Review procurement disclosures, implementation statements of work, or confidential pricing materials for
      white-label deployments.
    relatedQuestionRefs:
      - QM003
      - QM004
  - type: missing-source
    severity: material
    topic: competitor-pricing
    missingEvidence: >-
      Public rate sheets, fee schedules, or enterprise contract models for First National, Equitable, MCAP, Pine,
      Ratehub, True North, and Nesto Cloud.
    whyItMatters: >-
      Without directly comparable pricing or contract structure, this chapter can describe positioning but cannot
      quantify whether nesto wins on price, margin, or bundling versus alternatives.
    diligencePath: >-
      Collect archived public rate pages, enterprise pricing disclosures, or customer procurement documents for the
      named alternatives and nesto's B2B offer.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: partner-economics
    missingEvidence: >-
      Implementation timelines, retention, conversion lift, SLA outcomes, and revenue-share or servicing economics for
      IG Wealth, Canada Life, Alterna, and M3.
    whyItMatters: >-
      Partner logos show distribution and trust, but not whether those relationships create durable switching costs or
      attractive economics.
    diligencePath: >-
      Request customer case studies, partner contracts, or cohort reporting that quantifies adoption, renewal, and unit
      economics by channel.
    relatedQuestionRefs:
      - QP004
      - QP006
    relatedTableRefs:
      - TP001
      - TP002
  - type: missing-source
    severity: material
    topic: independent-benchmarking
    missingEvidence: >-
      Independent benchmarks for Maestro AI or Nesto Cloud on underwriting accuracy, exception handling, compliance
      outcomes, and servicing quality versus bank or manual workflows.
    whyItMatters: >-
      Absent external performance evidence, the strongest moat claims remain product narratives rather than
      independently verified operational superiority.
    diligencePath: >-
      Obtain third-party benchmark studies, regulator-reviewed model validation material, or customer audit results
      comparing nesto's stack with incumbent processes.
    relatedQuestionRefs:
      - QP005
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: revenue-model
    missingEvidence: >-
      Audited revenue by segment, revenue-recognition policies, recurring-revenue mix, contract values, and customer
      concentration.
    whyItMatters: Platform breadth and mortgage volume cannot establish revenue quality or predictability without a segment bridge.
    diligencePath: >-
      Obtain audited statements, segment schedules, top-customer concentration, and contract-level recurring-revenue
      cohort data.
    relatedQuestionRefs:
      - QI001
      - QI003
      - QI008
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin, CAC, payback, approval conversion, servicing cost, funding cost, credit losses, cloud margin, and
