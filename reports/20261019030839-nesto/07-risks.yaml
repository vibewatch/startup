  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / system
      - Role
      - Concentration signal
      - Failure scenario
      - Severity
      - Mitigation evidence
      - Residual exposure
    rows:
      - - Financial-institution adoption of Nesto Cloud
        - Banks, credit unions, and other institutional lenders
        - Drives the B2B expansion thesis and partner-onboarding narrative
        - Public references name only a limited set of enterprise relationships in the assigned pool.
        - Pipeline slows, partner onboarding lags, or institutions keep nesto as a narrow vendor instead of a scaled platform layer.
        - High
        - Product is fully rolled out and positioned as end-to-end mortgage infrastructure.
        - High
      - - Underwriter and data-partner feedback loops
        - Partner underwriters and external income-verification data
        - Improve underwriting accuracy and AI-model usefulness
        - CEO says the company is investing heavily in a data feedback loop and still wants a CRA API for income validation.
        - Missing or delayed data access weakens automation gains and credit-quality learning loops.
        - High
        - Existing underwriting partnerships and internal investment in data integration.
        - Medium
      - - Capital providers and opaque funding structure
        - Equity investors, warehouse lenders, and secondary-market backers
        - Fund expansion, support lending capacity, and influence governance
        - Public reporting shows a C$302 million round with a large secondary component, while earlier financing and acquisition economics remain undisclosed.
        - Funding terms or dilution prove less favorable than headline valuation implies, limiting flexibility.
        - High
        - Strong investor roster and management's profitability claim.
        - Medium
    notes: Dependency risk is ranked from public evidence only; partner concentration and warehouse-facility terms remain unverified because the assigned sources do not disclose them.
    claimRefs: [CR007, CR008, CR009, CR011, CR013, CR014]
