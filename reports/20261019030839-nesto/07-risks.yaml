  evidenceGaps:
    - type: missing-source
      severity: material
      topic: ai-governance
      missingEvidence: Public or diligence-room evidence showing regulator-reviewed model-risk governance, privacy controls, override rates, and fairness testing for Maestro AI.
      whyItMatters: AI-assisted underwriting is part of the scale thesis, so missing control evidence makes the regulatory and conduct risk impossible to size confidently.
      diligencePath: Request model-governance documentation, privacy impact assessments, and any OSFI or provincial regulator correspondence tied to automated underwriting.
      relatedQuestionRefs: [QR003]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: capital-structure
      missingEvidence: The undisclosed Series D amount, CMLS purchase price, warehouse-facility terms, and detailed dilution from the large secondary component of the Series E.
      whyItMatters: Headline valuation and profitability claims can overstate underwriting quality if the true funding stack, liquidity dependence, or governance rights are not visible.
      diligencePath: Review the cap table, financing documents, warehouse agreements, and acquisition agreements before treating the valuation as decision-grade.
    - type: missing-source
      severity: material
      topic: service-quality
      missingEvidence: Post-acquisition servicing-quality KPIs, complaint ratios, outage history, remediation statistics, and partner concentration by volume.
      whyItMatters: Integration risk is only manageable if management can show service consistency while the platform broadens across origination, servicing, and B2B infrastructure.
      diligencePath: Request monthly servicing and underwriting operations dashboards, customer complaint trends, incident logs, and concentration reporting by partner and channel.
