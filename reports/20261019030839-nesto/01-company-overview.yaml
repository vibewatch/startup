artifact: company-overview
slug: nesto
runDate: 2026-10-19
company:
  name: nesto
chapter:
  number: 1
  title: Company Overview
  summary: >-
    The current public record supports nesto as a Montreal-based mortgage technology
    platform that has expanded from direct-to-consumer origination into servicing,
    white-label infrastructure, and post-acquisition mortgage administration at
    institutional scale. The strongest verified anchors are the June 2026 Series E
    (CAD 302 million at a CAD 1.47 billion valuation), the June 2024 CMLS acquisition,
    and company-reported operating scale of more than CAD 80 billion under administration.
    Conviction is capped by unresolved public-data gaps on revenue, board/control rights,
    and even a contested founding year.
sections:
  - id: identity-and-model
    title: Identity, footprint, and operating model
    body: >-
      nesto is publicly described in current third-party coverage as a Montreal-based
      mortgage technology company, not just a consumer lead-generation site. The
      retained source set supports a dual model: direct-to-consumer digital mortgage
      lending on one side and white-label software or servicing infrastructure for
      financial institutions on the other. Company-controlled pages reinforce that
      the platform now spans origination, funding, and servicing rather than a pure
      brokerage layer. The public record also supports meaningful consumer reach, but
      only in broad company language: the homepage says nesto has helped 450,000+
      Canadians, while the assigned pool does not provide a tighter active-customer
      definition. Even the founding date is not perfectly clean, with 2018 and 2019
      both appearing in retained sources.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Founders, named leadership, and governance visibility
    body: >-
      The operating core is clearer than the governance layer. Independent long-form
      coverage attributes the launch to Malik Yacoubi, Karim Benabdallah, Damien
      Charbonneau, and Chase Belair, with Diagram shaping the early direction and
      Belair supplying licensed mortgage-market credibility. The current group site
      also surfaces named executives for servicing, partnerships, marketing, and
      operations, which supports functional breadth after the CMLS combination. What
      remains thin is public control visibility: the assigned pool names leaders and
      alludes to a board, but it does not provide a board roster, investor control
      rights, or other governance mechanics that matter for diligence on a scaled,
      recently recapitalized private company.
    claimRefs: [CO004, CO007, CO008, CO014, CO016]
    tableRefs: [TO002]
  - id: capital-scale-and-milestones
    title: Funding history, platform expansion, and scale inflection points
    body: >-
      The evidence is strongest on nesto's strategic expansion path. Public reporting
      ties the 2022 B2B debut to IG Wealth Management, then shows the company using
      acquisition and partnership moves to widen its footprint: Canada Life selected
      Nesto for mortgage-portfolio servicing starting in 2024, the June 2024 CMLS
      deal added commercial and servicing capabilities, and YesPress reports the M3
      relationship added access to more than 8,500 brokers with rate-parity mechanics
      intended to reduce channel conflict. Financing culminated in the June 2026
      Series E at a CAD 1.47 billion valuation. That round matters less as a vanity
      number than as corroborated evidence that large institutions were willing to
      back a broader mortgage operating stack, not only a direct channel.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012, CO013, CO015]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: diligence-gaps-and-implications
    title: What is still missing from the public overview
    body: >-
      The chapter can establish identity and scale, but it cannot close several
      investor-grade overview questions with the assigned public evidence. The public
      record still leaves revenue, run-rate, gross margin, and board/control rights
      undisclosed. The funding headline also needs care because the Series E combined
      primary and secondary capital, so the announced round size is not the same as
      new operating cash. Finally, the retained sources disagree on the founding year,
      which is a small issue operationally but a reminder that even basic company
      facts require document-level verification. Taken together, these gaps do not
      erase the scale story, but they do limit how confidently later chapters can
      translate operational momentum into governance and valuation conviction.
    claimRefs: [CO003, CO005, CO010, CO011, CO016]
