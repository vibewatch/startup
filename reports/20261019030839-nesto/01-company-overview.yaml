figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: Public milestones show nesto expanding from digital brokerage into a broader mortgage operating stack.
    data:
      items:
        - year: "2018"
          label: Founding and initial brokerage model
          detail: Independent coverage says the company was founded in 2018 by four founders with Diagram and started as a digital broker.
          tone: neutral
        - year: "2020"
          label: Series A and verticalization push
          detail: YesPress reports a C$11.5 million Series A and describes a shift toward controlling underwriting, lending, and servicing.
          tone: opportunity
        - year: "2021"
          label: Series B disclosed
          detail: YesPress lists a C$76 million Series B as part of the company's funding history.
          tone: opportunity
        - year: "2022"
          label: B2B launch with IG Wealth Management
          detail: Public reporting says Nesto debuted its B2B product with IG Wealth Management when it raised a Series C round.
          tone: opportunity
        - date: "2024-06-01"
          label: CMLS acquisition
          detail: Nesto acquired CMLS Group, adding servicing, commercial, and broker-channel capabilities.
          tone: opportunity
        - year: "2024"
          label: Canada Life servicing mandate begins
          detail: YesPress says Canada Life selected Nesto to take over servicing and support for its residential mortgage portfolio starting in 2024.
          tone: opportunity
        - period: "2025-09"
          label: Nesto Cloud fully rolled out
          detail: BetaKit reported Nesto had fully rolled out Nesto Cloud to financial institutions after integrating CMLS executives and technology.
          tone: opportunity
        - date: "2026-06-11"
          label: Series E and Maestro AI launch
          detail: Public reporting ties a CAD 302 million Series E and CAD 1.47 billion valuation to the Maestro AI launch and company-reported profitability.
          tone: opportunity
    approximationNotes: "Dates use the precision available in the retained public sources; some milestones are year-only or period-only."
    claimRefs: [CO004, CO007, CO008, CO009, CO010, CO013, CO015]
callouts:
  - calloutType: strength
    title: Scale is operational, not just marketing
    body: >-
      The retained evidence supports nesto as a scaled mortgage operator with
      institutional workflows, not merely a consumer-acquisition surface: the
      CMLS acquisition, Canada Life servicing mandate, and June 2026 operating
      metrics all point to a broader stack.
    claimRefs: [CO008, CO009, CO013, CO014]
  - calloutType: risk
    title: Public disclosure still leaves core diligence blind spots
    body: >-
      The overview can verify valuation, named backers, and mortgage-platform
      breadth, but it cannot verify revenue, board/control terms, or an
      uncontested founding date from the assigned public evidence alone.
    claimRefs: [CO005, CO011, CO016]
