  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-proof
      missingEvidence: Renewal rates, churn, NRR/GRR, cohort retention, or repeat-usage metrics by consumer and institutional segment.
      whyItMatters: Durability is central to the customer thesis, but the public record mostly proves adoption breadth rather than persistence.
      diligencePath: Request segment-level retention dashboards or board materials covering renewals, churn, NPS, and cohort behavior.
      relatedQuestionRefs: [QU004]
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: Revenue, origination, servicing, or software volume split by direct channel, IG Wealth Management, Canada Life, M3/CMLS, and other institutional partners.
      whyItMatters: Without concentration data, investors cannot gauge how much of nesto's growth depends on a few counterparties or channels.
      diligencePath: Request customer concentration schedules, top-account exposure, and channel mix by revenue and funded volume.
      relatedQuestionRefs: [QU008]
      relatedTableRefs: [TU001, TU003]
    - type: missing-source
      severity: minor
      topic: deployment-outcomes
      missingEvidence: Public or diligence-room metrics on implementation depth, active users, SLA performance, and realized cost or conversion outcomes for IG, Canada Life, Alterna, and M3-related workflows.
      whyItMatters: Named logos prove relationship existence, but not whether deployments are deep, sticky, or economically material.
      diligencePath: Request partner case studies, implementation scorecards, and quarterly operating reviews for named institutional accounts.
      relatedQuestionRefs: [QU003, QU006]
      relatedTableRefs: [TU002, TU003]
