schemaVersion: report-v2
artifact: customers
slug: nesto
runDate: 2026-10-19
company:
  name: nesto
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence supports a real multi-sided customer base: nesto still serves
    retail homeowners directly, but named institutional relationships with IG
    Wealth Management, Canada Life, Alterna Savings, and the M3/CMLS ecosystem
    show the company has moved beyond a pure direct-to-consumer funnel into
    embedded mortgage workflows. The weakness is durability proof: the assigned
    sources show breadth of adoption and partner onboarding, but they do not
    disclose retention, contract length, concentration, or cohort economics.
sections:
  - id: segment-mix
    title: Segment mix has widened beyond direct borrowers
    body: >-
      nesto's customer base is no longer a single retail-borrower cohort. The
      direct-to-consumer business still targets homeowners shopping for purchase,
      renewal, and refinance mortgages, with the company positioning salaried
      advisors and a digital workflow as the core experience. Public 2026 sources
      also show a broader institutional surface: Nesto Cloud is marketed to
      financial institutions, credit unions, and commercial real estate lenders,
      while the broader group now includes CMLS and Intellifi. That means the
      relevant "customer" can be a homeowner, a broker-facing lending channel, a
      wealth or insurance distributor, or an institution outsourcing mortgage
      operations. The customer journey figure matters because nesto's expansion
      logic is sequential: direct lending generated underwriting and servicing
      know-how, then that workflow was resold into white-label and outsourced
      institutional use cases.
    claimRefs: [CU001, CU002, CU003, CU007]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Named institutional proof is stronger than logo-only evidence
    body: >-
      The strongest adoption evidence in the assigned pool is not generic logo
      placement but named workflow responsibility. YesPress describes IG Wealth
      Management as a defining customer and partner that integrated nesto's
      white-label tooling into adviser workflows; the same piece says Canada Life
      selected nesto to take over servicing and support for an existing
      residential mortgage portfolio and that Alterna Savings chose Intellifi for
      loan processing and technology. Independent press also supports scale
      milestones around the pivot: Business Blab reported more than 450,000
      Canadians served by June 2026, while company and press materials repeat
      C$80B+ mortgages under administration. Those are meaningful adoption
      signals, but they remain deployment and volume indicators rather than proof
      of long-term retention or expansion economics.
    claimRefs: [CU004, CU005, CU006, CU008, CU009, CU012, CU014]
    tableRefs: [TU002, TU003]
  - id: durability-and-concentration
    title: Durability and concentration remain under-disclosed
    body: >-
      Public evidence is much thinner on retention, renewal behavior, and partner
      concentration than on top-line adoption. The consumer-facing about-us page
      offers curated testimonials and savings anecdotes, but no churn, renewal,
      cohort, NPS, NRR, or GRR disclosure. For institutional customers, the
      public record names partners and product scope but not contract length,
      implementation timelines, active-user counts, origination contribution, or
      revenue concentration by IG Wealth Management, Canada Life, M3, or the
      broker/CMLS channel. BetaKit adds a useful cautionary lens: nesto is
      collaborating with the same banks it competes against, and the category
      still depends on counterparties trusting fintech compliance and execution.
      The result is a chapter that can verify breadth of customer surfaces and
      named workflow wins, but not durability or concentration quality.
    claimRefs: [CU010, CU011, CU013]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Evidence of scale
      - Revenue / strategic value
      - Gap
    rows:
      - - Homeowners
        - Borrower is buyer, user, and payer
        - Purchase, renewal, and refinance mortgages through nesto's direct channel
        - Retail testimonials and the direct digital mortgage positioning on nesto's site
        - Original customer wedge and source of first-party workflow data
        - No public active-customer count, renewal rate, or contribution margin by consumer cohort
      - - Financial institutions / wealth networks
        - Institutional buyer; advisers/ops teams are users; institution pays
        - White-label mortgage technology, underwriting, and outsourced operations
        - Nesto Cloud targets financial institutions and IG Wealth Management is named as an integrated partner
        - Highest-leverage expansion path because one partner can route many end borrowers
        - Contract values, live-user counts, and production volumes are undisclosed
      - - Broker / channel partners
        - Broker network distributes; borrowers are end users; economics shared across channel
        - Broker-originated lending and channel expansion through CMLS and M3
        - YesPress says the M3 relationship reached a network of 8,500+ brokers
        - Expands reach faster than direct acquisition alone
        - No public funded-volume split or broker retention by channel
      - - Commercial / CRE clients
        - Commercial borrowers or property operators; lending teams are users; institution/client pays
        - Commercial mortgage financing, servicing, and lending workflows
        - Nesto Cloud says it is built for commercial lending and YesPress says CMLS added commercial and multifamily expertise
        - Broadens TAM beyond residential direct lending
        - No public customer roster or segment economics for commercial workflows
    notes: >-
      Mix is inferred from public positioning and named relationships; no assigned
      source discloses revenue, origination, or margin by segment, so strategic
      value remains qualitative.
    claimRefs: [CU001, CU002, CU003, CU007, CU010]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Mortgage-provider network
        - 11 providers, including Toronto-Dominion Bank
        - 2021-06
        - Wikipedia company entry
        - Low
        - Early proof that nesto was building lender-side distribution before the later platform pivot
        - No current provider count or funded-loan share by provider
      - - Canadians served
        - More than 450,000 Canadians
        - 2026-06
        - Business Blab
        - Medium
        - Public evidence of broad customer reach
        - Not defined as active, retained, paying, or current customers
      - - Mortgages under administration
        - Over C$80B
        - 2026
        - Nesto Cloud, Fintech.ca, YesPress
        - High
        - Shows nesto is operating at national mortgage-platform scale
        - AUA/MUA is not the same as recurring software revenue, active users, or retention
      - - Broker-channel reach
        - More than 8,500 brokers in the M3 network
        - 2024-2026 context
        - YesPress
        - Medium
        - Material distribution expansion beyond direct acquisition
        - No disclosed funded volume, activation rate, or exclusivity economics
    notes: >-
      These are public milestones, not audited cohort metrics; several values are
      company-reported through press or company sites, and the missing
      denominator column marks what would be needed to convert scale into durable
      customer quality.
    claimRefs: [CU008, CU009, CU010, CU012]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / segment
      - Deployment / use case
      - Production vs pilot
      - Outcome / proof
      - Evidence freshness
      - Limitation
    rows:
      - - IG Wealth Management / wealth-advice network
        - White-label mortgage tools integrated into adviser workflows
        - Production relationship is strongly suggested, but public detail is limited
        - YesPress calls IG Wealth Management a defining customer and partner; BetaKit says the first B2B product debuted with IG Wealth Management in 2022
        - 2022 origin, still relevant in 2026 strategy sources
        - No public volume, retention, or contract-length disclosure
      - - Canada Life / insurer
        - Servicing and support for an existing residential mortgage portfolio
        - Production transition/outsourcing appears intended from the named portfolio takeover
        - YesPress says Canada Life selected nesto to take over servicing and support starting in 2024; Wikipedia also records a residential mortgage partnership
        - Publicly referenced through 2024-2026 materials
        - No SLA, portfolio size, or renewal economics disclosed
      - - Alterna Savings / credit union
        - Intellifi loan processing and technology
        - Production is plausible, but public proof is still partnership-level
        - YesPress names Alterna Savings as having chosen Intellifi for loan processing and technology
        - Referenced in the 2026 profile
        - Single-source proof in the assigned pool and no live-usage metrics
      - - M3 Mortgage Group / broker channel
        - Distribution alliance with broker-channel rate parity
        - Channel partnership, not an end-customer deployment
        - YesPress says the network counted 8,500+ brokers and highlights rate-parity design to manage channel conflict
        - 2024-2026 context
        - Strong reach signal, but not a disclosed revenue-producing customer contract
    notes: >-
      Public proof is strongest for named institutional and channel relationships,
      but most entries still lack contract value, implementation depth, and
      measurable outcome disclosure.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly named institutional and channel relationships in the assigned
        source pool; excludes undisclosed retail customers, private contracts,
        and nonpublic production metrics.
    claimRefs: [CU004, CU005, CU006, CU010, CU014]
figures:
  - id: FU001
    title: Customer journey and expansion loop
    type: journey-map
    summary: >-
      nesto's customer expansion path runs from direct borrowers to partner-led,
      broker-led, and outsourced institutional mortgage workflows.
    data:
      items:
        - label: Direct borrower acquisition
          actor: Homeowner
          stage: Direct-to-consumer
          touchpoints:
            - Purchase
            - Renewal
            - Refinance
          tone: positive
        - label: Underwriting and file preparation
          actor: nesto operations
          stage: Operational control
          touchpoints:
            - Digital application
            - Salaried advisers
            - Underwriter review
          tone: neutral
        - label: Servicing and lifecycle ownership
          actor: Borrower plus servicer
          stage: Verticalization
          touchpoints:
            - Funding
            - Servicing
            - Portfolio support
          tone: neutral
        - label: White-label institutional deployment
          actor: Financial institution or insurer
          stage: B2B platform
          touchpoints:
            - IG Wealth Management
            - Canada Life
            - Alterna / Intellifi
          tone: positive
        - label: Broker-channel distribution
          actor: Broker network
          stage: Channel expansion
          touchpoints:
            - CMLS
            - M3
            - Rate parity
          tone: warning
        - label: Partner onboarding and expansion
          actor: Institutional partner
          stage: Growth loop
          touchpoints:
            - Partner onboarding
            - AI-enabled workflows
            - Cross-sell into more mortgage operations
          tone: warning
    approximationNotes: >-
      Sequence is synthesized from public workflow descriptions; no assigned
      source provides conversion rates or stage-by-stage cohort counts.
    claimRefs: [CU001, CU002, CU003, CU010, CU012, CU013]
callouts:
  - calloutType: strength
    title: Named workflow owners matter more than logo presence
    body: >-
      IG Wealth Management, Canada Life, Alterna Savings, and the M3/CMLS channel
      give nesto public customer proof that extends beyond a consumer logo wall
      into adviser, servicing, processing, and broker-distribution workflows.
    claimRefs: [CU004, CU005, CU006, CU010]
  - calloutType: risk
    title: Durability is inferred, not measured
    body: >-
      The assigned sources do not disclose churn, renewal rates, NRR/GRR,
      contract length, or customer concentration, so the current customer story
      is better evidenced on breadth of deployment than on persistence or quality
      of revenue.
    claimRefs: [CU011, CU012, CU013]
