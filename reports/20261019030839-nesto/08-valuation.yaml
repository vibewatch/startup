          detail: "Missing comp, unit-economics, and cap-table detail blocks precise return underwriting."
          claimRefs: [CV010, CV013, CV014]
        - label: "Outcome"
          value: "Track / Fair / High risk"
          detail: "Strong company, but public evidence still under-supports a buy at the disclosed round price."
          claimRefs: [CV015, CV016]
    approximationNotes: null
    claimRefs: [CV002, CV003, CV004, CV007, CV008, CV010, CV012, CV013, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Public evidence supports track, not buy
    body: >-
      nesto has already earned credit for scale and strategic backing; what is missing is enough public
      financial and security detail to prove that the last round still offers attractive upside.
    claimRefs: [CV001, CV003, CV004, CV007, CV015, CV016]
  - calloutType: risk
    title: The valuation risk is in the security, not just the business
    body: >-
      Primary-versus-secondary mix, undisclosed preferences, and missing segment economics mean the
      headline valuation may overstate what a new investor is actually buying.
    claimRefs: [CV007, CV008, CV010, CV012, CV013]
