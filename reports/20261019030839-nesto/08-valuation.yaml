      severity: blocking
      topic: capital-structure
      missingEvidence: Exact Series E security terms, preference stack, secondary-clearing mechanics, and updated cap table.
      whyItMatters: A new investor cannot translate the headline valuation into actual entry economics, downside protection, or dilution without the security details.
      diligencePath: Review the term sheet, cap table, side letters, and board materials covering the Series E and any associated secondary transaction.
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Segment revenue, gross margin, warehouse or funding-facility economics, servicing profitability, and cohort economics for the B2B products.
      whyItMatters: Volume and profitability claims alone do not prove the durability or quality of cash generation that should anchor a valuation call.
      diligencePath: Request audited financial statements, lender-facility summaries, servicing metrics, and management reporting by business line.
