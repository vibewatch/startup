      - ["Confidence", "Medium", "Scale and financing facts are corroborated, but price-validation inputs remain incomplete."]
      - ["Risk rating", "High", "Capital-structure opacity, commercialization execution, and regulated-AI burden can all compress upside."]
      - ["Valuation stance", "Fair", "The last round looks supportable, but not obviously cheap, without cleaner revenue and dilution data."]
      - ["Entry discipline", "Price-sensitive diligence only", "A buy requires audited operating detail and exact security terms."]
    notes: >-
      Public-evidence snapshot only; assessments synthesize retained 2026 sources and treat undisclosed
      revenue quality, preferences, and comp benchmarks as unresolved.
    claimRefs: [CV001, CV003, CV004, CV005, CV007, CV008, CV015, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: ["Argument", "View", "What would change the view"]
    rows:
      - ["Scale proof", "More than C$80B MUA, more than C$37B 2026 originations, and multiple profitability references support real operating substance.", "Contrary audited performance, slowing origination quality, or weak servicing economics would reduce conviction."]
      - ["Institutional validation", "La Caisse, Fidelity, and other investors validate strategic interest in nesto’s platform and AI thesis.", "The view improves only if those relationships translate into durable software, servicing, or balance-sheet economics."]
      - ["Security / dilution overhang", "Primary-plus-secondary structure and buyout use make the headline round larger than fresh balance-sheet cash.", "Exact cap-table, preference, and secondary-clearing disclosures could reduce this overhang materially."]
      - ["AI / B2B execution risk", "White-label and AI expansion can deepen the moat, but only if explainability, compliance, and partner onboarding hold up at scale.", "Documented enterprise deployments, regulator-comfort evidence, and repeatable conversion data would support a stronger call."]
    notes: >-
      The anti-thesis is security-specific rather than company-denial: nesto may be strong operationally
      while still being under-disclosed for a new investor at the last round price.
    claimRefs: [CV002, CV006, CV007, CV008, CV010, CV011, CV012, CV013, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: ["Scenario", "Assumptions", "Valuation / return logic", "Probability signal", "Downside trigger"]
    rows:
      - ["Bull", "Profitable scale converts into visible recurring software, servicing, and lending economics; AI adoption improves throughput without regulatory friction.", "At or above the last disclosed C$1.47B valuation because hidden economics prove better than the market can currently observe.", "Requires audited segment economics, clean preference terms, and repeat enterprise adoption.", "AI explainability, partner uptake, or servicing economics fail to validate the commercialization story."]
      - ["Base", "Current scale and investor support are real, but public disclosure stays incomplete and upside remains harder to quantify than the operating story.", "Approximately around the last disclosed valuation; fair, but not sufficiently mispriced for a conviction buy.", "Best fit with today’s evidence set: strong operating proof, incomplete underwriting detail.", "New information shows profitability is narrow, one-time, or dependent on fragile capital-market conditions."]
      - ["Bear", "Secondary-heavy financing, undisclosed preferences, and limited comp evidence mask weaker unit economics or slower B2B monetization than implied.", "Below the last disclosed round once security terms and cash-generation quality are fully underwritten.", "Becomes more likely if diligence surfaces aggressive preferences, soft enterprise conversion, or margin weakness.", "Any down-round signal, adverse term-sheet structure, or material commercialization miss would move the case here."]
    notes: >-
      Ranges are expressed relative to the last disclosed round because the assigned evidence pool does
      not contain a comparable public/private set with sufficient metric parity for precise multiple work.
    claimRefs: [CV001, CV005, CV007, CV009, CV010, CV014, CV015, CV016]
