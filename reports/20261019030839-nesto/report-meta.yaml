  topStrengths:
    - >-
      Large operating scale in Canadian mortgages, with public evidence of C$80B+ under administration and C$37B+ 2026
      originations.
    - Institutional support and a disclosed C$302 million Series E at a C$1.47 billion valuation.
    - Broadened distribution across direct lending, broker channels, servicing, and B2B white-label software.
  topRisks:
    - Revenue quality, margins, and balance-sheet economics remain undisclosed.
    - Security terms, secondary-capital mechanics, and cap-table detail remain opaque.
    - >-
      AI underwriting and regulatory validation are not publicly documented in a way that supports conviction
      underwriting.
  unresolvedGaps:
    - >-
      Revenue by segment, gross margin, unit economics, warehouse facility terms, and audited balance-sheet data remain
      undisclosed.
    - >-
      The undisclosed Series D amount and the CMLS acquisition price leave cumulative capital raised and dilution
      uncertain.
    - >-
      Cap-table mechanics, board composition, investor control rights, and the secondary-capital mechanics of the Series
      E remain unquantified.
    - Maestro AI regulatory compliance posture is unconfirmed; public disclosure on model-risk validation remains thin.
    - >-
      Customer-experience quality gaps documented in June 2026 reviews require monitoring as the company scales broker
      and AI automation channels.
