        - from: institutional-demand
          to: cloud-bpo
          label: enterprise contracts
        - from: d2c-origination
          to: servicing-administration
          label: funded mortgages
        - from: commercial-lending
          to: servicing-administration
          label: commercial mortgages
        - from: cloud-bpo
          to: economic-output
          label: software and service economics
        - from: servicing-administration
          to: economic-output
          label: servicing economics
        - from: d2c-origination
          to: economic-output
