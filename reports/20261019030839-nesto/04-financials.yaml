  - id: TI002
    title: Public pricing and compensation snapshot
    columns:
      - Offer or channel
      - Public value / model
      - Unit or contract basis
      - Interpretation limit
      - Diligence ask
    rows:
      - ["D2C 3-year fixed mortgage", "4.54%", "Posted borrower rate", "Access-date display; not realized portfolio yield or margin", "Qualified-borrower distribution, funded rate, funding cost, and spread"]
      - ["D2C 5-year fixed mortgage", "4.59%", "Posted borrower rate", "Access-date display; borrower terms and discounts not disclosed", "Funded rate, renewal margin, prepayment behavior, and hedge cost"]
      - ["D2C 3-year variable mortgage", "3.60%", "Posted borrower rate", "Access-date display; benchmark and borrower eligibility not disclosed", "Benchmark spread, funded mix, repricing behavior, and credit performance"]
      - ["D2C 5-year variable mortgage", "3.41%", "Posted borrower rate", "Access-date display; not evidence of revenue recognition", "Benchmark spread, realized yield, funding cost, and contribution margin"]
      - ["Mortgage advisors", "Salaried; satisfaction-linked rewards", "Employee compensation model", "Does not disclose fully loaded sales cost or productivity", "Advisor cost, leads per advisor, close rate, cycle time, and CAC"]
      - ["Nesto Cloud / BPO", null, "Enterprise contract basis not public", "No list or realized pricing in assigned evidence", "ACV, setup fees, usage tiers, discounting, term, renewal, and services attach"]
    notes: "Rates are the values displayed by the company-hosted page on 2026-10-19; they are volatile borrower offers, not realized revenue, portfolio yield, or margin."
    claimRefs: [CI005, CI006]
  - id: TI003
    title: Unit economics and capital adequacy ledger
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Revenue / ARR", null, "Unavailable", "Required to translate platform scale into enterprise value support", "Audited revenue by D2C, broker, commercial, servicing, software, and BPO; recurring-revenue bridge"]
      - ["Gross margin", null, "Unavailable", "Determines whether software mix offsets lending and service-delivery costs", "Segment gross margin with funding, servicing, cloud, labor, and AI compute allocation"]
      - ["CAC / payback", null, "Unavailable", "Tests efficiency of consumer and institutional acquisition", "CAC by channel, sales cycle, implementation cost, activation, conversion, and payback"]
      - ["Mortgage originations", ">C$37B in 2026", "Medium; company figure repeated by third-party coverage", "Shows transaction scale but not revenue or margin", "Monthly funded originations by channel, take rate, fallout, and gain-on-sale or spread economics"]
      - ["Mortgages under administration", ">C$80B", "Medium; company figure repeated by multiple sources", "Potential servicing base and operating-scale proxy", "Residential/commercial split, fee rate, retention, arrears, and contribution margin"]
      - ["Profitability", "Company claims profitability", "Medium; no statements supplied", "Could reduce financing dependency if defined consistently", "Audited EBITDA, net income, operating cash flow, normalization, and segment reconciliation"]
      - ["June 2026 primary capital", "C$107M", "Medium; third-party reported transaction split", "Primary proceeds can fund operations; secondary proceeds cannot be treated as company cash", "Closing balance sheet, fees, use-of-funds ledger, and cash reconciliation"]
      - ["Cash / burn / runway", null, "Unavailable", "Core capital-adequacy test", "Monthly cash, unrestricted cash, operating and free-cash-flow burn, minimum liquidity, and downside runway"]
      - ["Debt / warehouse facilities", null, "Unavailable", "Mortgage funding capacity and covenants can constrain growth", "Lender, committed and drawn amount, advance rate, pricing, collateral, maturity, covenants, and recourse"]
      - ["Servicer ratings", "CMLS ratings listed by company; underlying reports not retained", "Low for underwriting detail", "Servicing quality can affect funding access and operating risk", "Morningstar DBRS and Fitch reports, scope, surveillance history, exceptions, and remediation"]
    notes: "Currency is Canadian dollars where shown; volume, assets under administration, profitability claims, and financing proceeds are not treated as revenue, gross profit, or cash available."
    claimRefs: [CI007, CI008, CI009, CI011, CI013, CI014, CI016]
