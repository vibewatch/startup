    approximationNotes: "Conceptual flow only; no conversion rate, take rate, revenue mix, or margin is inferred from mortgage volumes."
    claimRefs: [CI001, CI002, CI003, CI004, CI008]
callouts:
  - calloutType: insight
    title: Primary capital is the relevant financing numerator
    body: >-
      The reported C$302 million transaction included C$195 million of secondary
      capital. Public evidence therefore supports C$107 million of new primary
      capital, before fees and uses, rather than C$302 million of cash available
      to nesto.
    claimRefs: [CI011, CI013]
  - calloutType: risk
    title: Scale metrics do not close the financial case
    body: >-
      Originations and mortgages under administration establish operating scale,
      but without revenue, margin, cash-flow, facility, and credit-loss data they
      cannot establish revenue quality, runway, or risk-adjusted returns.
    claimRefs: [CI007, CI008, CI009, CI014, CI015]
