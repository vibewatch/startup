      - ["Nesto Cloud", "White-label mortgage technology for financial institutions", "Contract, institution, loan, or usage unit not disclosed", "Management says the B2B line is active", "Potential recurring software revenue; ARR and retention undisclosed", "ARR, implementation revenue, pricing metric, gross retention, NRR, and gross margin"]
      - ["Business-process outsourcing", "Mortgage operations delivered alongside cloud technology", "Staffed process, application, or loan unit not disclosed", "Listed in a current company job repost", "Services mix may dilute software margins", "Contract scope, labor intensity, utilization, contribution margin, and renewal terms"]
      - ["Commercial mortgage lending", "CMLS-originated commercial financing", "Loan originated / balance", "Part of the combined platform; contribution undisclosed", "Potential interest and fee income with credit and funding exposure", "Originations, portfolio balance, yield, funding source, losses, and risk-adjusted return"]
