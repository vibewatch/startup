company:
  name: Collate
chapter:
  number: 8
  title: Valuation
  summary: >-
    A reported $95 million Series B placed Collate near a $1 billion valuation,
    but the retained evidence does not disclose current revenue, ARR, margins,
    retention, customer concentration, or financing preferences. The defensible
    stance is research-more with high risk and strict entry discipline rather
    than a precise valuation range unsupported by current operating denominators.
sections:
  - id: recommendation
    title: Recommendation and price discipline
    body: >-
      Independent coverage reports a $95 million Series B led by Redpoint
      Ventures, a valuation near $1 billion, and $125 million of total capital
      raised. That financing validates investor appetite, not the economic value
      of the common equity. The retained financing coverage also reports roughly
      50 enterprise customers, while Collate describes a broad workflow spanning
      diagnostic, medical-device, and drug-development paperwork. Those are
      meaningful adoption and scope signals, but the evidence set supplies no
      current ARR, revenue run rate, gross margin, retention, ACV distribution,
      customer concentration, or preference schedule. The resulting recommendation
      is research-more, with medium confidence, high risk, and a stretched
      valuation stance. Entry should be conditioned on a verified operating-data
      room and executed financing documents rather than on the headline round.
    claimRefs: [CV001, CV002, CV003, CV004, CV006, CV014, CV015, CV016]
    tableRefs: [TV001]
  - id: thesis-and-antithesis
    title: Investment thesis and anti-thesis
    body: >-
      The thesis is that Collate is applying AI to regulated documentation where
      long workflows and review requirements can create material customer pain.
      Third-party coverage reports 50% to 90% time savings, and the MantleBio
      acquisition adds a life-sciences data-engineering capability that could
      broaden the platform beyond document creation. The anti-thesis is financial:
      Forbes estimated zero revenue for 2024 and expected only $1 million in 2025,
      whereas 2026 coverage reports a near-$1 billion valuation. Dividing those
      cross-vintage figures produces an illustrative roughly 1,000x ratio, not a
      current revenue multiple; it highlights how little contemporaneous pricing
      support is public. A favorable decision therefore requires evidence that
      enterprise adoption converts into durable recurring revenue without a
      services-heavy implementation burden.
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV009, CV010, CV015, CV016]
    tableRefs: [TV002]
  - id: scenarios-and-comparables
    title: Scenario framework and comparable context
    body: >-
      Public-company references establish scale, not a direct private-company
      multiple. IQVIA reported $4.368 billion of second-quarter 2026 revenue and
      $994 million of adjusted EBITDA, while CompaniesMarketCap reported Veeva
      Systems at $52.30 billion on October 25, 2026. Both businesses are far more
      mature and diversified than the evidence available for Collate, so applying
      their valuation ratios would create false precision. The bull case requires
      verified expansion, retention, and software-like margins that make the
      reported mark supportable. The base case keeps the company on a watchlist
      while operating proof remains private. The bear case is a financing reset
      or impaired common return if commercialization slows, implementation costs
      stay high, or preferences absorb exit value. Probability signals remain
      qualitative because the required denominators are missing.
    claimRefs: [CV011, CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: exit-and-diligence
    title: Exit readiness, diligence asks, and thesis breaks
    body: >-
      Collate's workflow breadth and MantleBio acquisition create a plausible
      strategic-acquisition narrative, but public evidence does not demonstrate
      exit readiness. A buyer or growth investor would need a cohort bridge from
      the first commercial customers through the current period, contract-level
      renewals and expansion, implementation labor, gross margin, customer
      concentration, and evidence that product controls transfer under diligence.
      The financing package must also show liquidation preferences, seniority,
      option-pool treatment, debt, and pro forma dilution. Thesis-break triggers
      are failed renewals, a services burden inconsistent with software margins,
      a material regulatory or security failure, customer concentration that
      weakens bargaining power, or a financing reset below the reported mark.
      Conversely, verified recurring economics and clean terms would justify
      reopening price discussions; neither is established by the assigned evidence.
    claimRefs: [CV006, CV007, CV014, CV015, CV016]
    figureRefs: [FV001]
