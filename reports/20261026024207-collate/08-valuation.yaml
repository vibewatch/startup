      - [Risk rating, "High", "Early commercialization, implementation, competition, and financing opacity remain material", "Require downside protection and thesis-break monitoring"]
      - [Valuation stance, "Stretched", "Near-$1B reported mark lacks a current public revenue or margin denominator", "Use price discipline rather than a headline-round anchor"]
      - [Entry condition, "Unmet", "ARR, growth, retention, margin, concentration, and preference data are missing", "Reassess only after a reconciled data room"]
    notes: "Assessments are evidence-sensitive judgments; no current revenue multiple or point valuation is asserted because operating and capitalization inputs are unavailable."
    claimRefs: [CV001, CV002, CV003, CV004, CV014, CV015, CV016]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Side, Argument, Evidence, What would change the view]
    rows:
      - [Thesis, "Regulated-workflow wedge", "Collate targets life-sciences paperwork across product development", "Independent production outcomes and customer references"]
      - [Thesis, "Potential efficiency value", "Third-party coverage reports 50%-90% time savings", "Measured before-and-after cycle time across retained customers"]
      - [Thesis, "Platform expansion", "MantleBio adds life-sciences data-engineering capability", "Integration milestones, cross-sell, and lower delivery cost"]
      - [Anti-thesis, "Price outruns disclosed proof", "Cross-vintage public figures imply an illustrative roughly 1,000x ratio", "Current audited revenue, growth, retention, and margin support"]
    notes: "The roughly 1,000x ratio compares a reported near-$1B 2026 valuation with Forbes's $1M 2025 revenue expectation; it is deliberately not presented as a current revenue multiple."
    claimRefs: [CV002, CV005, CV006, CV007, CV008, CV009, CV010, CV015]
  - id: TV003
    title: Bull / base / bear scenarios
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Strong renewals and expansion, software-like gross margin, and successful MantleBio integration", "Near-$1B mark becomes discussable only after KPI verification; no public range is supportable", "Conditional upside", "Retention, margin, or integration evidence fails diligence"]
      - [Base, "Customer adoption continues but recurring economics and financing terms remain private", "Research-more and defer price formation; no public range is supportable", "Most evidence-consistent", "No timely KPI disclosure or weak cohort conversion"]
      - [Bear, "Commercialization slows, implementation is services-heavy, or preferences impair common equity", "Down-round or low common-equity recovery becomes plausible; no public range is supportable", "Material downside", "Financing reset, failed renewals, or material regulatory/security event"]
    notes: "Probability signals are qualitative, not statistical forecasts; public-company scale references are context only and are not used as direct Collate valuation multiples."
    claimRefs: [CV007, CV011, CV012, CV013, CV014, CV015, CV016]
