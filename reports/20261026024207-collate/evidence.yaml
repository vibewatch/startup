evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board composition, voting control, ownership, succession planning, and material leadership-change records.
    whyItMatters: Governance rights and key-person dependence determine investor protection and execution continuity.
    diligencePath: >-
      Request the charter, board minutes, current cap table, voting agreements, option plan, executive roster history,
      and succession plan.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Current ARR or revenue, growth, gross margin, cash balance, burn, runway, headcount, customer concentration, and
      retention.
    whyItMatters: Funding and customer counts do not establish commercial quality, capital efficiency, or financing durability.
    diligencePath: >-
      Obtain monthly management accounts, bank statements, payroll records, customer-level ARR, cohort retention,
      pipeline, and board-approved forecast.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: >-
      A complete current leadership roster with start dates, departures, reporting lines, and corroboration beyond
      company biographies.
    whyItMatters: The public roster cannot establish leadership completeness, churn, or depth below the named executives.
    diligencePath: Reconcile HRIS exports, organization charts, executive employment agreements, and board-approved officer lists.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholders
    missingEvidence: A complete investor, board, debt, option, secondary, and preference-rights map.
    whyItMatters: Named investors do not reveal ownership, control, liquidation economics, or future financing constraints.
    diligencePath: >-
      Review the fully diluted cap table, financing documents, side letters, debt agreements, secondary records, and
      board observer rights.
    relatedQuestionRefs:
      - QO004
      - QO007
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: Collate-specific serviceable market, pricing, buyer budget, and obtainable share evidence.
    whyItMatters: Broad RIM estimates do not establish Collate's revenue opportunity or valuation support.
    diligencePath: >-
      Obtain segmentation by workflow, geography, customer size, ACV, win rate, and expansion from management and
      customer references.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A reconciled definition and methodology bridge between the Grand View Research and Dimension Market Research
      estimates.
    whyItMatters: The different base values and forecasts can materially change any top-down market conclusion.
    diligencePath: >-
      Request full publisher definitions and reconcile included software, services, geographies, and end uses before
      using a single number.
    relatedQuestionRefs:
      - QM002
      - QM007
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-segmentation
    missingEvidence: Public evidence of Collate's actual buyer, payer, sales cycle, implementation effort, and renewal behavior.
    whyItMatters: Adoption timing and services intensity determine whether market demand converts to durable software economics.
    diligencePath: Review anonymized pipeline, ACV cohorts, implementation hours, renewal data, and customer references.
    relatedQuestionRefs:
      - QM003
      - QM006
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Comparable vendor quotes and implementation fees for a fixed regulatory-document workflow.
    whyItMatters: Custom pricing and unreported services mix prevent a reliable view of buyer economics or switching friction.
    diligencePath: Request scoped quotes from Collate, one RIM incumbent, and one quality-management platform.
    relatedQuestionRefs:
      - QP004
      - QP007
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: proof-gaps
    missingEvidence: Independent benchmark results for document accuracy, review-cycle reduction, and human escalation.
    whyItMatters: The product wedge depends on regulated-workflow outcomes that public descriptions do not validate.
    diligencePath: Run a blinded benchmark using representative submission and quality documents.
    relatedQuestionRefs:
      - QP006
      - QP007
  - type: missing-source
    severity: material
    topic: switching-costs
    missingEvidence: Customer retention, expansion, migration, and multi-homing evidence.
    whyItMatters: A specialized product can still be displaced if incumbents own the system of record or implementation channel.
    diligencePath: Obtain cohort, renewal, win/loss, and implementation references under NDA.
    relatedQuestionRefs:
      - QP005
      - QP006
  - type: private-evidence-only
    severity: blocking
    topic: pricing
    missingEvidence: Realized pricing, billing units, contract duration, discounting, renewal terms, and revenue-recognition policy.
    whyItMatters: The public product and GTM narrative cannot establish revenue quality or recurring economics.
    diligencePath: >-
      Request anonymized order forms, pricing schedules, contract cohorts, discount approvals, and the
      revenue-recognition memorandum.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Revenue, ARR, bookings, gross margin, services mix, CAC, payback, retention, concentration, and working-capital
      detail.
    whyItMatters: >-
      These metrics determine whether the enterprise model scales and whether the reported valuation is supported by
      operating performance.
    diligencePath: >-
      Request current management accounts, an ARR bridge, cohort economics, gross-margin waterfall, customer
      concentration, and working-capital schedules.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Cash on hand, monthly burn, runway, debt, preference stack, acquisition consideration, planned use of funds, and
      next-round trigger.
    whyItMatters: Funding raised is not cash available and cannot establish the duration or terms of financial capacity.
    diligencePath: >-
      Request the latest balance sheet, cash-flow statement, debt and cap-table schedules, board budget, and downside
      runway case.
    relatedQuestionRefs:
      - QI007
      - QI008
      - QI010
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: traction
    missingEvidence: >-
      A primary customer list or management schedule reconciling active customers, deployments, ACV, renewals, and
      concentration.
    whyItMatters: >-
      The only current customer count is an AI-generated third-party statement without a disclosed denominator or
      primary corroboration.
    diligencePath: >-
      Request a customer cohort export, signed-contract sample, deployment status, renewal history, and top-ten account
      concentration.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: security-controls
    missingEvidence: >-
      Named security and privacy certifications, independent audit reports, data-retention controls, incident history,
      and model-governance documentation.
    whyItMatters: Regulated customers need auditable controls beyond a general statement that the product is secure and reliable.
    diligencePath: >-
      Review the trust center, SOC 2 or equivalent reports, penetration-test summary, DPA, subprocessor list, retention
      policy, and model-risk controls.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: product-maturity
    missingEvidence: >-
      Customer-reproduced accuracy, time savings, document-level error taxonomy, uptime, support response, and
      implementation-duration benchmarks.
    whyItMatters: >-
      Company-reported aggregate performance does not establish reliability or implementation burden for each regulated
      workflow.
    diligencePath: >-
      Obtain production customer references and benchmark exports segmented by document type, workflow, deployment
      cohort, and review burden.
  - type: missing-source
    severity: material
    topic: architecture
    missingEvidence: >-
      Production topology, model and retrieval provenance, tenancy design, integration catalog, validation process, and
      the MantleBio migration roadmap.
    whyItMatters: >-
      Public descriptions support a conceptual stack but not scalability, isolation, maintainability, or
      post-acquisition integration.
    diligencePath: >-
      Conduct an architecture review with system diagrams, dependency inventory, change-control records, validation
      artifacts, and integration release status.
  - type: missing-source
    severity: minor
