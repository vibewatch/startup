      - [Preclinical and clinical documentation, Clinical and regulatory teams, Publicly marketed workflow, Document generation and review across validation stages, Validation evidence and document-level error rates are undisclosed]
      - [Quality management documentation, Quality and compliance teams, Publicly marketed workflow, Change-quality checks positioned inside the platform, GxP validation package and certification evidence are not public]
      - [MantleBio data platform capabilities, Research and data teams, Acquired capability described by MantleBio, Centralized biological data plus ELN instrument and database integrations, Current integration status inside Collate is not disclosed]
    notes: >-
      Partial public-surface inventory as of 2026-10-26; status reflects retained
      official and third-party descriptions, not independently verified production deployment.
    claimRefs: [CE001, CE002, CE003, CE004]
  - id: TE002
    title: Workflow and use-case evidence
    columns:
      - User job
      - Existing burden
      - Collate approach
      - Reported benefit
      - Limitation
    rows:
      - [Prepare regulatory submissions, Large regulated document sets and review cycles, AI-assisted document creation with human verification before export, 50% to 90% claimed time reduction depending on document type, Benchmark is company-reported through secondary coverage]
      - [Run clinical documentation workflows, Repetitive generation and review across trials, Pre-built life-science workflows, External coverage says less customer expert time is needed for AI training, No implementation-time or services-burden data]
      - [Manage quality documentation, Changes must meet quality standards, AI-assisted quality-management paperwork, Official site claims mistakes can be eliminated before they occur, No public validation protocol or false-negative rate]
      - [Organize research data for downstream work, Fragmented biological files and research tools, Centralized data platform with ELN instrument and database integrations, MantleBio reported more accessible and actionable research data, Post-acquisition product integration is not documented]
    notes: >-
      Reported benefits are vendor or secondary-source claims and are not comparable
      independent benchmarks; missing denominators and validation methods remain diligence items.
    claimRefs: [CE001, CE002, CE003, CE006, CE008, CE009]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or process
      - Role
      - Disclosed dependency
      - Principal risk
    rows:
      - [Research data intake, Connect complex biological data to documentation workflows, ELNs instruments databases and acquired MantleBio capabilities, Integration coverage and migration state are undisclosed]
      - [Domain workflow layer, Provide pre-built regulated life-science processes, Industry-expert workflow design and customer configuration, Workflow catalog and version validation are not public]
      - [AI document generation, Draft and streamline regulated paperwork, AI/ML systems and source life-science data, Model provenance retrieval controls and error taxonomy are undisclosed]
      - [Human verification and export, Preserve accountability before documents leave the platform, Qualified human reviewers and review workflow, Review completeness and audit-trail controls are not independently verified]
      - [Submission standards, Produce packages compatible with evolving eCTD requirements, ICH schemas vocabularies and regional implementation rules, Regional change control and forward-compatibility issues create maintenance risk]
    notes: >-
      Conceptual architecture assembled only from retained disclosures and standards
      sources; it does not assert an undisclosed production topology or certification.
    claimRefs: [CE003, CE008, CE009, CE010, CE011, CE012, CE013, CE014, CE015]
figures:
  - id: FE001
    title: Evidence-bounded product architecture map
    type: stack
    summary: >-
      A layered view of the disclosed workflow, control, and standards dependencies,
      with private implementation details explicitly excluded.
    data:
      layers:
        - label: Research data sources
          items:
            - Electronic lab notebooks
            - Instruments
            - Databases
          detail: MantleBio described these as integration surfaces.
        - label: Life-science data foundation
          items:
            - Centralized biological data
            - Multi-omics processing
            - Analysis workflows
          detail: Acquired capability; current Collate integration status is not public.
        - label: Domain workflow layer
          items:
            - R&D documentation
            - Clinical documentation
            - Quality management
          detail: Publicly described workflows without a disclosed SKU catalog.
        - label: AI document generation
          items:
            - Drafting
            - Review support
            - Workflow automation
          detail: Model and retrieval architecture are not publicly disclosed.
        - label: Human control
          items:
            - Mandatory verification
            - Pre-export review
            - Accountability
          detail: Reported by external coverage as a platform design choice.
        - label: Regulatory output boundary
          items:
            - ICH implementation guides
            - Regional validation rules
            - eCTD v4.0 submissions
          detail: Versioned external standards constrain output and roadmap.
    approximationNotes: >-
      Layer order is analytical rather than a disclosed system topology; no data flow,
      hosting model, or control certification is inferred.
    claimRefs: [CE001, CE003, CE008, CE011, CE012, CE014, CE015]
callouts:
  - calloutType: strength
    title: Domain workflow plus acquired data foundation
    body: >-
      MantleBio's data-engineering surface can extend Collate upstream from regulated
      paperwork into research data organization, if the acquired capabilities are
      integrated into the production platform.
    claimRefs: [CE003, CE004]
  - calloutType: risk
    title: Public controls evidence is incomplete
    body: >-
      Mandatory human verification is a useful safeguard, but security audits,
      certifications, reliability history, model governance, and independent
      document-level benchmarks remain unavailable in the retained evidence.
    claimRefs: [CE007, CE008, CE016]
