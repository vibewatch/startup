  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: security-controls
      missingEvidence: >-
        Named security and privacy certifications, independent audit reports,
        data-retention controls, incident history, and model-governance documentation.
      whyItMatters: >-
        Regulated customers need auditable controls beyond a general statement that
        the product is secure and reliable.
      diligencePath: >-
        Review the trust center, SOC 2 or equivalent reports, penetration-test
        summary, DPA, subprocessor list, retention policy, and model-risk controls.
      relatedQuestionRefs: [QE006]
    - type: missing-source
      severity: material
      topic: product-maturity
      missingEvidence: >-
        Customer-reproduced accuracy, time savings, document-level error taxonomy,
        uptime, support response, and implementation-duration benchmarks.
      whyItMatters: >-
        Company-reported aggregate performance does not establish reliability or
        implementation burden for each regulated workflow.
      diligencePath: >-
        Obtain production customer references and benchmark exports segmented by
        document type, workflow, deployment cohort, and review burden.
    - type: missing-source
      severity: material
      topic: architecture
      missingEvidence: >-
        Production topology, model and retrieval provenance, tenancy design,
        integration catalog, validation process, and the MantleBio migration roadmap.
      whyItMatters: >-
        Public descriptions support a conceptual stack but not scalability,
        isolation, maintainability, or post-acquisition integration.
      diligencePath: >-
        Conduct an architecture review with system diagrams, dependency inventory,
        change-control records, validation artifacts, and integration release status.
    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: >-
        A public repository, package registry, API forum, practitioner-community
        discussion, or equivalent independent developer adoption signal.
      whyItMatters: >-
        The assigned pool contains no public developer surface or practitioner proxy
        for evaluating implementation quality and ecosystem traction.
      diligencePath: >-
        Request API documentation and integration-partner references, then review
        public engineering talks, package activity, and practitioner discussions.
