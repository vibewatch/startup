    notes: "Segments and roles are analytical mappings from retained source descriptions; public sources do not disclose Collate's actual customer budget ownership, ACV, or conversion rates."
    claimRefs: [CM003, CM004, CM006, CM011, CM012, CM013, CM014, CM015, CM016]
