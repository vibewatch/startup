    columns: [Competitor or alternative, Category, Public scale or scope, Target segment, Differentiation, Limitation or open question]
    rows:
      - [Veeva Vault RIM, Direct incumbent, "Used by 150+ firms (secondary technical review)", Pharma and biotech, "End-to-end RIM, central dossier, workflows, dashboards, eCTD publishing", "Customer economics and switching friction for Collate are not public"]
      - [IQVIA RIM Smart, Direct incumbent, "Named among leading RIM providers", Pharma and biotech, "Regulatory expertise and analytics", "Product-level pricing and feature parity are not public"]
      - [Oracle, Direct incumbent, "Named among leading RIM providers", Enterprise life sciences, "Scalable enterprise software and IT integration", "Implementation burden and AI differentiation are not public"]
      - [ArisGlobal LifeSphere RIM, Direct incumbent, "Named among leading RIM providers", Global life sciences, "Automation and AI-enabled regulatory intelligence", "Relative deployment speed and realized outcomes are not public"]
      - [MasterControl RegEx, Adjacent incumbent, "Cloud or private-cloud deployment described in secondary review", Pharma and medical devices, "RIM integrated with quality management and eCTD assembly", "Comparative AI documentation performance is not public"]
      - [Microsoft Purview Data Governance, Adjacent data governance, "3.8/5 on PeerSpot page", Enterprise data teams, "Cataloging, classification, governance, and Azure integration", "Not a like-for-like regulated submission workflow"]
      - [Collibra Platform, Adjacent data governance, "4.0/5 on PeerSpot page", Enterprise data teams, "Stewardship, lineage, and data quality", "Setup cost and regulatory-document depth are not public"]
      - [Alation Data Catalog, Adjacent data governance, "4.0/5 on PeerSpot page", Enterprise data teams, "Business glossary, lineage, data quality, and integrations", "Lineage and interface limitations are reported on PeerSpot"]
      - [Internal build or services, Substitute/status quo, "No public comparable scale", Regulated teams with existing operations, "Control over process, systems, and domain staff", "Ongoing labor, validation, maintenance, and audit burden are unquantified"]
    notes: >-
      The map combines source-backed competitor listings with category-level analytical
      classification. Scale is included only where the retained source states it; blank
      economics and performance fields are intentionally not estimated.
    claimRefs: [CP001, CP002, CP003, CP010]
  - id: TP002
    title: Feature and capability comparison
    columns: [Buying criterion, Collate, RIM incumbents, Data-governance adjacencies, Internal build or services, Evidence implication]
    rows:
      - [Regulated-document generation, "AI paperwork generation is stated; validation details unknown", "Submission and lifecycle workflows; vendor-specific", "Not the primary job", "Manual or bespoke automation", "Test on controlled document sets"]
      - [Document review and quality validation, "Third-party directory reports automated review and quality validation", "Quality and review controls vary by suite", "Data quality controls are broader than document review", "Depends on staff and SOPs", "Require error and escalation metrics"]
      - [eCTD submission support, "Public support not established", "FDA standard is supported by incumbent ecosystems", "Not a primary differentiator", "Can use specialist tooling", "Verify supported versions and publishing workflow"]
      - [Data lineage and governance, "Company positions across product lifecycle; depth unknown", "RIM metadata and lifecycle controls", "Catalog, lineage, classification, and governance are explicit", "Depends on architecture", "Assess interoperability and provenance"]
      - [Human oversight and auditability, "Company stresses secure and reliable AI; controls not fully public", "Mature controls likely but vendor-specific", "Governance and access controls are explicit in some products", "Built through SOPs and controls", "Audit trail and approval evidence are diligence blockers"]
      - [Deployment and integration, "Public technical integrations not disclosed", "Cloud, private-cloud, or enterprise integration options vary", "getcollate.io lists SaaS, hybrid, and private-cloud options", "Customer owns integration", "Run an implementation and security review"]
      - [Global regulatory coverage, "Life-sciences domain focus is explicit", "Multi-region suites are established", "General governance products need domain configuration", "Requires local expertise", "Compare jurisdiction and product-type coverage"]
    notes: >-
      Cells summarize retained public evidence and mark unsupported comparisons as
      unknown rather than implying parity. The categories are not fully comparable.
    claimRefs: [CP004, CP005, CP007, CP009]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Offering, Published price or model, Included capabilities or scope, Discount or unknowns, Buyer implication]
    rows:
      - [Collate, "Custom pricing; contact vendor for a quote", "AI paperwork and regulated-life-sciences workflows", "Realized price, implementation fees, and services mix unknown", "Enterprise sale and budget qualification required"]
      - [Collate AI Platform alternatives, "PeerSpot describes Microsoft Purview as moderate and Collibra as moderate setup cost", "Catalog, governance, lineage, or AI-oriented features vary", "PeerSpot is not a controlled price sheet", "Use as directional positioning only"]
      - [getcollate.io Collate, "Tiered feature comparison; prices not visible in fetched text", "Users, data assets, connectors, lineage, quality, observability, deployment", "Exact prices and realized discounts unknown", "Shows packaging transparency available in an adjacent category"]
      - [RIM enterprise suites, "No comparable list prices retained", "Submission planning, lifecycle, compliance, and regional workflows", "Contract terms, implementation, and services unknown", "Benchmarking requires vendor quotes for a fixed scope"]
    notes: >-
      This is a public-packaging comparison, not a revenue or margin estimate. A null
      price means the retained source did not disclose a comparable figure.
    claimRefs: [CP005, CP006, CP007]
figures:
  - id: FP001
    title: Competitive positioning by domain specialization and enterprise breadth
    type: quadrant
    summary: >-
      An evidence-backed ordinal map places Collate toward high regulated-life-sciences
      specialization but lower publicly evidenced enterprise breadth than large RIM and
      governance incumbents.
    data:
      xAxis: Enterprise breadth (ordinal, evidence constrained)
      yAxis: Regulated life-sciences specialization (ordinal, evidence constrained)
      points:
        - {label: Collate, x: 2, y: 5, note: "Life-sciences focus is explicit; public breadth and customer proof are limited"}
        - {label: Veeva Vault RIM, x: 5, y: 5, note: "End-to-end RIM and 150+ firms cited in secondary technical review"}
        - {label: MasterControl RegEx, x: 4, y: 4, note: "RIM integrated with QMS and eCTD assembly in secondary review"}
        - {label: Microsoft Purview, x: 5, y: 2, note: "Broad governance and Azure integration; not a like-for-like submission tool"}
        - {label: Collibra, x: 4, y: 2, note: "Broad stewardship and lineage; regulatory-document depth not established"}
        - {label: Internal build or services, x: 2, y: 4, note: "Potentially specialized but dependent on internal staff and controls"}
    approximationNotes: >-
      Coordinates are ordinal analyst judgments anchored to retained descriptions, not
      market-share measurements or validated product scores. They should not be read as
      precise rankings.
    claimRefs: [CP001, CP003, CP004, CP010]
callouts:
  - calloutType: strength
    title: Domain-specific wedge
    body: Collate's clearest advantage is a focused workflow proposition for regulated life sciences rather than generic enterprise AI.
    claimRefs: [CP001, CP004]
  - calloutType: risk
    title: Proof and incumbent response
    body: Public evidence does not yet show pricing, validated accuracy, implementation economics, or customer retention, while incumbents have broader enterprise footprints.
    claimRefs: [CP006, CP010, CP013]
  - calloutType: recommendation
    title: Benchmark a fixed workflow
    body: The next diligence step is a controlled comparison against one RIM incumbent and one internal or services alternative using the same document, review, integration, and audit criteria.
    claimRefs: [CP012, CP014]
