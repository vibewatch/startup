        title: Funding, scale, and stakeholders
        blocks:
          - type: paragraph
            body: >-
              Forbes reported a $95 million June 2026 financing led by Redpoint Ventures, taking total funding to $125
              million at a valuation approaching $1 billion. Forbes also reported an earlier $30 million seed financing
              involving Redpoint, First Round, and Conviction. Customer scale is less complete: the company had signed
