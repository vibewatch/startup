      - number: '4.2'
        title: Pricing, GTM motion, and traction
        blocks:
          - type: paragraph
            body: >-
              The strongest public commercial evidence is directional. Forbes reported that Collate had no customers and
              no commercial product at its January 2025 launch, while a later AI-generated Life Sciences Digital article
              described roughly 50 enterprise customers. Because that customer count is not corroborated by a primary
              customer list or company filing, it should be treated as a low-confidence traction indicator.
              Founder-attributed claims of 50% to 90% documentation time savings create a potential value anchor for
              enterprise pricing, but they do not establish realized ACV, sales-cycle length, CAC, payback, bookings,
              retention, or customer concentration. Management evidence is needed to connect product value to repeatable
              sales efficiency.
            claimRefs:
              - CI003
              - CI004
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI004
              - CI007
              - CI008
              - CI016
      - number: '4.3'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              Collate reportedly requires human verification before documents are exported, a control that may improve
              safety while also creating an unquantified delivery cost. The MantleBio acquisition added life-sciences
              data-engineering capability, but neither consideration nor integration expense is public. These facts
              identify likely cost drivers without measuring software gross margin, implementation labor, model and
              cloud spend, support burden, or working capital. IQVIA's second-quarter 2026 R&D Solutions revenue and
              bookings demonstrate that established life-sciences workflows can support large commercial pools, but
              IQVIA is an incumbent with service-heavy operations and its figures are not a proxy for Collate's private
              economics.
            claimRefs:
              - CI009
              - CI010
              - CI013
              - CI014
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI009
              - CI013
              - CI014
              - CI016
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Multiple reports place Collate's June 2026 financing at $95 million and cumulative reported funding at
              $125 million, with a valuation approaching $1 billion. The SaaS News says the latest capital was intended
              to scale operations and meet demand, and Dealroom's workforce signals indicate active organizational
              expansion. None of those facts establishes cash currently available: funding raised is not cash on hand,
              valuation is not revenue, and hiring signals are not burn. The retained evidence provides no cash balance,
              monthly burn, runway, debt schedule, financing preferences, next-round trigger, or acquisition
              consideration. The verdict is financing-backed but financially unproven, with private accounts and cohort
              economics required before underwriting.
            claimRefs:
              - CI005
              - CI006
              - CI011
              - CI012
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
