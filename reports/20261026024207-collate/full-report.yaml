  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Collate positions the product as a workflow platform for creating and streamlining documentation across
              diagnostic, medical-device, and drug development, from concept through market. Its public surface names
              four operating zones: research and development, preclinical and clinical trials, quality management, and
              market delivery. This is broader than a single submission-writing tool, but the breadth is described at a
              category level; public materials do not enumerate stable SKUs, workflow-by-workflow release status, or
              deployment eligibility. An external article reports more than 50 clients since the first customer in May
              2025, which is an adoption signal rather than proof that every advertised workflow is in production.
            claimRefs:
              - CE001
              - CE002
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
