      - - Bear
        - Commercialization slows, implementation is services-heavy, or preferences impair common equity
        - Down-round or low common-equity recovery becomes plausible; no public range is supportable
        - Material downside
        - Financing reset, failed renewals, or material regulatory/security event
    notes: >-
      Probability signals are qualitative, not statistical forecasts; public-company scale references are context only
      and are not used as direct Collate valuation multiples.
    claimRefs:
      - CV007
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
