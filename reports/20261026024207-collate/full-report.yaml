  - id: FU001
    title: Customer adoption and expansion diligence journey
    type: journey-map
    summary: >-
      A six-stage analytical path from segment qualification to durable expansion, separating public evidence from the
      proof still required.
    data:
      items:
        - label: Segment qualification
          detail: Identify regulated pharmaceutical, biotech, medical-device, or diagnostic workflows.
          touchpoints:
            - Documentation burden
            - Submission requirements
        - label: Initial workflow selection
          detail: Choose a bounded validation, trial, quality, or regulatory documentation use case.
          touchpoints:
            - Buyer and user mapping
            - Baseline process evidence
        - label: Pilot or initial deployment
          detail: Validate accuracy, security, integration, and human-review requirements.
          touchpoints:
            - Production status
            - Implementation effort
        - label: Human verification
          detail: Review generated documents before export or regulatory use.
          touchpoints:
            - Quality controls
            - Regulatory accountability
        - label: Production adoption
          detail: Measure active usage and customer-attributed time, quality, or cycle-time outcomes.
          touchpoints:
            - Usage telemetry
            - Named customer proof
        - label: Durable expansion
          detail: Expand to additional teams or workflows only after renewal and outcome proof.
          touchpoints:
            - NRR and GRR
            - Concentration and contract evidence
    approximationNotes: >-
      Stage order is an analyst-created diligence framework based on described workflows and reported human review; no
      conversion rate, duration, or disclosed customer funnel is implied.
    claimRefs:
      - CU001
      - CU007
      - CU008
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Regulatory transition and AI quality carry the highest residual exposure because the consequences are severe while
      company-specific validation and incident evidence remain incomplete.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual exposure
      rows:
        - label: AI-generated documentation error
          values:
            - Medium
            - Critical
            - 'Partial: human review reported'
            - High
        - label: Regulatory standard transition
          values:
            - Medium
            - High
            - 'Partial: monitor pilots and validation'
            - High
        - label: Security or privacy incident
          values:
            - Medium
            - Critical
            - 'Unknown: public assurance incomplete'
            - Critical
        - label: Reliability or outage during filing
          values:
            - Medium
            - High
            - 'Unknown: no incident or recovery data'
            - High
        - label: Customer concentration and retention
          values:
            - Medium
            - High
            - 'Unknown: cohort data unavailable'
            - High
        - label: Acquisition and roadmap integration
          values:
            - Medium
            - High
            - 'Partial: strategic rationale disclosed'
            - Medium
    approximationNotes: >-
      Likelihood, impact, mitigation maturity, and residual exposure are qualitative assessments; they do not imply
      measured probabilities.
