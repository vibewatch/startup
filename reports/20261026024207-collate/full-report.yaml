      - number: '1.2'
        title: Leadership, founder-market fit, and governance
        blocks:
          - type: paragraph
            body: >-
              The disclosed founder team combines life-sciences operating experience with enterprise-software and
              infrastructure backgrounds. CEO Surbhi Sarna previously founded nVision Medical; Boston Scientific
              announced that acquisition with $150 million upfront and up to $125 million in milestones. CTO Nate Smith
              previously co-founded Lever, and Chief Architect and Security Officer Jigish Patel adds infrastructure
              experience. This history supports founder-market fit, but it also concentrates the public narrative around
              Sarna and Smith. The assigned sources do not identify a board, voting rights, ownership percentages,
              succession plan, or material leadership departures, so governance quality and key-person exposure cannot
              be concluded from the visible executive roster.
