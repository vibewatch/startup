              path to high-value contracts.
            calloutType: strength
            claimRefs:
              - CI001
              - CI003
              - CI008
          - type: callout
            title: Funding is not runway
            body: >-
              The reported $125M raised does not disclose current cash, burn, debt, financing preferences, or the next
              capital trigger.
            calloutType: risk
            claimRefs:
              - CI005
              - CI016
          - type: callout
            title: Condition underwriting on private evidence
            body: >-
              Require current accounts, customer cohorts, contracts, gross-margin detail, and a downside liquidity plan
              before assigning revenue quality or capital adequacy.
            calloutType: recommendation
            claimRefs:
              - CI007
              - CI009
              - CI012
