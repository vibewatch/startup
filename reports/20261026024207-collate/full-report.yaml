        title: Milestones and diligence implications
        blocks:
          - type: paragraph
            body: >-
              Collate's public chronology moves quickly from a 2024 founding to a first customer in May 2025, the
              acquisition of MantleBio in August 2025, and a large financing in June 2026. MantleBio adds life-sciences
              data-engineering capability to the documentation platform, but the acquisition announcement supplies no
              purchase price or integration metrics. Company-reported performance claims of 50% to 90%
