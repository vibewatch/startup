chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Collate positions itself as an AI platform for documentation across diagnostic, medical-device, and drug
              development, spanning research, trials, quality management, and market delivery. Forbes identifies the
              business as San Francisco-based, while a secondary funding profile dates its founding to 2024. The
              commercial model appears to be enterprise software sold into regulated life sciences organizations, but
              the assigned evidence does not disclose pricing, contract structure, revenue, or services mix. The product
              claim is therefore well grounded at the category level but not yet auditable as a recurring-revenue model.
              Public references to global enterprises and customer logos or counts should be treated as company-reported
              adoption signals rather than independently verified deployment depth.
            claimRefs:
              - CO001
              - CO002
              - CO003
