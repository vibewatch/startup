      - number: '5.3'
        title: Maturity, deployment, and regulatory dependencies
        blocks:
          - type: paragraph
            body: >-
              Product maturity is supported by reported client onboarding and claimed workflow outcomes, but not by
              independent benchmark data. Collate reports time reductions of 50% to 90%, accuracy above 90% and often
              near 97%, and mandatory human verification before export. These metrics should be treated as vendor
              benchmarks until customers reproduce them by document type. Deployment also inherits a moving standards
              boundary: FDA accepts new eCTD v4.0 applications, the EU is progressing from optional to mandatory use,
              and ICH continues versioning implementation guides and controlled vocabularies. EMA's
              forward-compatibility pilot has found technical challenges, making standards maintenance and regional
              validation concrete product dependencies.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
      - number: '5.4'
        title: Differentiation, controls, and diligence risks
        blocks:
          - type: paragraph
            body: >-
              The public differentiation case rests on domain-specific workflows, life-science data integration, founder
              and engineering experience, and a human-in-the-loop export control. Those features may reduce
              implementation work relative to a general-purpose model, but no retained source provides a controlled
              comparison, production error taxonomy, uptime record, or customer-validated accuracy benchmark. Collate
              says it delivers solutions securely and reliably, yet the assigned evidence contains no named audit,
              certification, data-retention policy, incident history, or model-governance documentation. The investment
              case therefore depends on private diligence confirming that the control environment and validation package
              match the regulated workflows the platform targets.
            claimRefs:
              - CE003
              - CE008
              - CE009
              - CE010
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Domain workflow plus acquired data foundation
            body: >-
              MantleBio's data-engineering surface can extend Collate upstream from regulated paperwork into research
              data organization, if the acquired capabilities are integrated into the production platform.
            calloutType: strength
            claimRefs:
              - CE003
              - CE004
          - type: callout
            title: Public controls evidence is incomplete
            body: >-
              Mandatory human verification is a useful safeguard, but security audits, certifications, reliability
              history, model governance, and independent document-level benchmarks remain unavailable in the retained
              evidence.
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and buying context
        blocks:
          - type: paragraph
            body: >-
              Collate positions its product for diagnostic, medical-device, and drug development companies, while an
              independent product directory also names biotechnology and pharmaceutical companies as intended users.
              Dealroom classifies the client focus as B2B. The common buyer context is therefore a regulated
              life-sciences organization with documentation obligations spanning research, validation, trials, quality,
              and regulatory submission work. This supports a broad enterprise segment thesis, not a granular customer
              profile: the public material does not identify payer roles, company-size bands, purchasing departments,
              geographic mix, or revenue by segment. The official phrase "Powering Global Enterprises" signals target
              scale but is not evidence of named production deployments.
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU008
              - CU010
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU008
              - CU010
              - CU016
      - number: '6.2'
        title: Adoption trajectory and outcome evidence
        blocks:
          - type: paragraph
            body: >-
              Startup Samadhan reports that Collate signed roughly 50 customers after launching its first commercial
              product in May 2025, and Life Sciences Digital separately describes a client base of around 50 enterprise
              customers. The same publications repeat claimed document-time reductions of 50% to 90% and describe human
              review before regulatory submission. These figures indicate rapid early selling and a potentially valuable
              workflow outcome, but they do not disclose the denominator, cohort, measurement protocol, deployment
              depth, or customer-level results. Accordingly, the customer count and efficiency range are useful adoption
              signals rather than audited proof of active seats, production volume, or realized return on investment.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU007
      - number: '6.3'
        title: Reference quality, retention, and durability
        blocks:
          - type: paragraph
            body: >-
              The allocated public evidence describes large pharmaceutical companies, major medical-device makers, and
              publicly traded biotechnology firms, but it does not name a customer or provide a customer-authored case
              study. It also omits NRR, GRR, churn, renewal rates, contract duration, expansion cohorts, satisfaction
              scores, and top-customer concentration. An independent directory additionally says pricing was not clearly
              available and advises buyers to confirm it with the vendor. This limits the ability to distinguish
              contracted logos from active production use or durable expansion. Investor commentary about growing within
              a large pharma account is an expansion thesis, not evidence that cross-team expansion has already
              occurred.
            claimRefs:
              - CU009
              - CU010
              - CU012
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU010
              - CU016
      - number: '6.4'
        title: Workflow breadth and expansion conditions
        blocks:
          - type: paragraph
            body: >-
              Collate can plausibly enter through a discrete documentation workflow and expand across validation,
              trials, quality, and regulatory work. The MantleBio acquisition adds a company-issued claim of
              data-engineering and biological-research workflow breadth, which may create another expansion surface.
              However, production adoption must operate within changing submission standards: FDA identifies eCTD as the
              standard format for key drug and biologic submissions, EMA reports technical challenges in an ongoing eCTD
              v4.0 pilot, and ICH shows different regional implementation dates. These requirements can strengthen
              demand for specialized tooling while also increasing implementation, validation, and procurement friction.
              The journey below is an analytical diligence sequence, not a disclosed customer funnel.
            claimRefs:
              - CU008
              - CU011
              - CU013
              - CU014
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
