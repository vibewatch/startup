      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The clearest disclosed architecture is a workflow layer over life-science documentation plus an acquired
              data foundation. MantleBio described a centralized platform for complex biological data with integrations
              to electronic lab notebooks, instruments, and databases; its acquisition gives Collate a plausible bridge
              from research data into downstream documentation. A separate report describes pre-built workflows
              developed by industry experts, suggesting configuration and domain templates are part of the value
              proposition. Collate's recruiting page names AI/ML, Python, Go, TypeScript, and React, but a hiring stack
              is not evidence of the production topology, model provenance, tenancy design, or validated integration
              architecture.
            claimRefs:
