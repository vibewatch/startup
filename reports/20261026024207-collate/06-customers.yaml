figures:
  - id: FU001
    title: Customer adoption and expansion diligence journey
    type: journey-map
    summary: >-
      A six-stage analytical path from segment qualification to durable expansion,
      separating public evidence from the proof still required.
    data:
      items:
        - label: Segment qualification
          detail: "Identify regulated pharmaceutical, biotech, medical-device, or diagnostic workflows."
          touchpoints:
            - "Documentation burden"
            - "Submission requirements"
        - label: Initial workflow selection
          detail: "Choose a bounded validation, trial, quality, or regulatory documentation use case."
          touchpoints:
            - "Buyer and user mapping"
            - "Baseline process evidence"
        - label: Pilot or initial deployment
          detail: "Validate accuracy, security, integration, and human-review requirements."
          touchpoints:
            - "Production status"
            - "Implementation effort"
        - label: Human verification
          detail: "Review generated documents before export or regulatory use."
          touchpoints:
            - "Quality controls"
            - "Regulatory accountability"
        - label: Production adoption
          detail: "Measure active usage and customer-attributed time, quality, or cycle-time outcomes."
          touchpoints:
            - "Usage telemetry"
            - "Named customer proof"
        - label: Durable expansion
          detail: "Expand to additional teams or workflows only after renewal and outcome proof."
          touchpoints:
            - "NRR and GRR"
            - "Concentration and contract evidence"
    approximationNotes: >-
      Stage order is an analyst-created diligence framework based on described
      workflows and reported human review; no conversion rate, duration, or
      disclosed customer funnel is implied.
    claimRefs: [CU001, CU007, CU008, CU011, CU012, CU013, CU014, CU015]
callouts:
  - calloutType: risk
    title: Customer count is not retention proof
    body: >-
      The reported approximately 50 customers are not broken out by active use,
      production deployment, contract value, renewal, or concentration. Obtain a
      customer cohort export and named references before treating early logo
      growth as durable recurring adoption.
    claimRefs: [CU003, CU004, CU016]
