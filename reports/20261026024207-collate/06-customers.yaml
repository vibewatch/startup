  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: >-
        Named customers with customer-authored confirmation, production status,
        deployment scope, and attributable outcomes.
      whyItMatters: >-
        Category-level customer descriptions cannot distinguish signed logos,
        pilots, and durable production adoption.
      diligencePath: >-
        Obtain at least three reference calls across pharmaceutical, medical-device,
        and biotechnology customers, plus contracts or usage extracts confirming
        deployment status.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: >-
        NRR, GRR, logo and revenue churn, renewal rates, contract duration,
        cohort retention, and satisfaction measures.
      whyItMatters: >-
        Without retention evidence, rapid initial customer acquisition does not
        establish recurring value or durable product-market fit.
      diligencePath: >-
        Review monthly customer and ARR cohorts, renewal schedules, churn reasons,
        and customer-health scores, reconciled to signed contracts and billing.
      relatedQuestionRefs: [QU005]
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: >-
        Top-one, top-five, and top-ten customer shares of revenue and ARR, plus
        segment and channel concentration.
      whyItMatters: >-
        Concentration could make reported customer growth economically fragile
