schemaVersion: "report-v2"
artifact: customers
slug: collate
runDate: 2026-10-26
company:
  name: Collate
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence indicates early enterprise adoption across pharmaceutical,
    biotechnology, medical-device, and diagnostic developers, with two current
    media sources reporting roughly 50 customers. The evidence does not identify
    those customers or disclose retention, contract, or concentration metrics,
    so durability remains the central customer diligence gap.
sections:
  - id: customer-base
    title: Customer base and buying context
    body: >-
      Collate positions its product for diagnostic, medical-device, and drug
      development companies, while an independent product directory also names
      biotechnology and pharmaceutical companies as intended users. Dealroom
      classifies the client focus as B2B. The common buyer context is therefore
      a regulated life-sciences organization with documentation obligations
      spanning research, validation, trials, quality, and regulatory submission
      work. This supports a broad enterprise segment thesis, not a granular
      customer profile: the public material does not identify payer roles,
      company-size bands, purchasing departments, geographic mix, or revenue by
      segment. The official phrase "Powering Global Enterprises" signals target
      scale but is not evidence of named production deployments.
    claimRefs: [CU001, CU002, CU005, CU008, CU010]
    tableRefs: [TU001]
  - id: adoption-and-outcomes
    title: Adoption trajectory and outcome evidence
    body: >-
      Startup Samadhan reports that Collate signed roughly 50 customers after
      launching its first commercial product in May 2025, and Life Sciences
      Digital separately describes a client base of around 50 enterprise
      customers. The same publications repeat claimed document-time reductions
      of 50% to 90% and describe human review before regulatory submission.
      These figures indicate rapid early selling and a potentially valuable
      workflow outcome, but they do not disclose the denominator, cohort,
      measurement protocol, deployment depth, or customer-level results.
      Accordingly, the customer count and efficiency range are useful adoption
      signals rather than audited proof of active seats, production volume, or
      realized return on investment.
    claimRefs: [CU003, CU004, CU005, CU006, CU007]
    tableRefs: [TU002]
  - id: proof-and-durability
    title: Reference quality, retention, and durability
    body: >-
      The allocated public evidence describes large pharmaceutical companies,
      major medical-device makers, and publicly traded biotechnology firms, but
      it does not name a customer or provide a customer-authored case study.
      It also omits NRR, GRR, churn, renewal rates, contract duration, expansion
      cohorts, satisfaction scores, and top-customer concentration. An
      independent directory additionally says pricing was not clearly available
      and advises buyers to confirm it with the vendor. This limits the ability
      to distinguish contracted logos from active production use or durable
      expansion. Investor commentary about growing within a large pharma account
      is an expansion thesis, not evidence that cross-team expansion has already
      occurred.
    claimRefs: [CU009, CU010, CU012, CU016]
    tableRefs: [TU003]
  - id: workflow-and-expansion
    title: Workflow breadth and expansion conditions
    body: >-
      Collate can plausibly enter through a discrete documentation workflow and
      expand across validation, trials, quality, and regulatory work. The
      MantleBio acquisition adds a company-issued claim of data-engineering and
      biological-research workflow breadth, which may create another expansion
      surface. However, production adoption must operate within changing
      submission standards: FDA identifies eCTD as the standard format for key
      drug and biologic submissions, EMA reports technical challenges in an
      ongoing eCTD v4.0 pilot, and ICH shows different regional implementation
      dates. These requirements can strengthen demand for specialized tooling
      while also increasing implementation, validation, and procurement
      friction. The journey below is an analytical diligence sequence, not a
      disclosed customer funnel.
    claimRefs: [CU008, CU011, CU013, CU014, CU015]
    figureRefs: [FU001]
