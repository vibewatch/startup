        - "Not disclosed"
        - "No customer-attributed outcome"
        - "No identity, contract, deployment, or renewal evidence"
    notes: >-
      This is a partial enumeration of the three customer categories reported by
      Startup Samadhan, cross-checked against other public positioning; it is not
      a list of named or independently verified customers.
    enumerationScope:
      coverage: partial
