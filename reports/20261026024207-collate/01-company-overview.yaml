company:
  name: Collate
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Collate is a San Francisco life-sciences software company founded in 2024 that
    automates regulated documentation from research through commercialization. Its
    June 2026 financing supplied the clearest public scale markers—$95 million raised
    in the round, $125 million raised in total, a valuation approaching $1 billion,
    and roughly 50 customers—but revenue, headcount, governance, and ownership remain
    material private-company gaps.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Collate positions itself as an AI platform for documentation across diagnostic,
      medical-device, and drug development, spanning research, trials, quality
      management, and market delivery. Forbes identifies the business as San
      Francisco-based, while a secondary funding profile dates its founding to 2024.
      The commercial model appears to be enterprise software sold into regulated life
      sciences organizations, but the assigned evidence does not disclose pricing,
      contract structure, revenue, or services mix. The product claim is therefore
      well grounded at the category level but not yet auditable as a recurring-revenue
      model. Public references to global enterprises and customer logos or counts
      should be treated as company-reported adoption signals rather than independently
      verified deployment depth.
    claimRefs: [CO001, CO002, CO003]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, founder-market fit, and governance
    body: >-
      The disclosed founder team combines life-sciences operating experience with
      enterprise-software and infrastructure backgrounds. CEO Surbhi Sarna previously
      founded nVision Medical; Boston Scientific announced that acquisition with $150
      million upfront and up to $125 million in milestones. CTO Nate Smith previously
      co-founded Lever, and Chief Architect and Security Officer Jigish Patel adds
      infrastructure experience. This history supports founder-market fit, but it also
      concentrates the public narrative around Sarna and Smith. The assigned sources
      do not identify a board, voting rights, ownership percentages, succession plan,
      or material leadership departures, so governance quality and key-person exposure
      cannot be concluded from the visible executive roster.
    claimRefs: [CO004, CO005, CO006]
    tableRefs: [TO002]
  - id: funding-scale-and-stakeholders
    title: Funding, scale, and stakeholders
    body: >-
      Forbes reported a $95 million June 2026 financing led by Redpoint Ventures,
      taking total funding to $125 million at a valuation approaching $1 billion.
      Forbes also reported an earlier $30 million seed financing involving Redpoint,
      First Round, and Conviction. Customer scale is less complete: the company had
      signed its first customer in May 2025 and about 50 more by June 2026, but the
      public figure is not a revenue metric and does not reveal active deployments,
      concentration, retention, or contract value. A secondary article labels the
      valuation as exactly $1 billion while listing another company's website, so the
      more precise formulation is not reliable enough to override Forbes's
      “approaching $1 billion” wording.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO013, CO014]
    tableRefs: [TO003]
  - id: milestones-and-diligence-implications
    title: Milestones and diligence implications
    body: >-
      Collate's public chronology moves quickly from a 2024 founding to a first
      customer in May 2025, the acquisition of MantleBio in August 2025, and a large
      financing in June 2026. MantleBio adds life-sciences data-engineering capability
      to the documentation platform, but the acquisition announcement supplies no
      purchase price or integration metrics. Company-reported performance claims of
      50% to 90% documentation-time savings are strategically important but remain
      unaudited. Forbes also records the core product-control risk: AI errors and
      hallucinations require human verification before documents leave the system.
      No assigned source substantiated a lawsuit, outage, or regulatory incident;
      that absence is an evidence limitation, not proof that no incident occurred.
    claimRefs: [CO012, CO015, CO016]
    figureRefs: [FO001]
