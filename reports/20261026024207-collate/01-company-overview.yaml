callouts:
  - calloutType: strength
    title: Founder-market fit is unusually visible
    body: >-
      Sarna's prior life-sciences company and Smith's enterprise-software history
      align directly with Collate's regulated workflow wedge, while Patel's
      infrastructure background broadens the founding team's technical coverage.
    claimRefs: [CO004, CO005, CO006]
  - calloutType: risk
    title: Public scale evidence stops before economics
    body: >-
      Funding and a company-reported customer count are visible, but neither establishes
      ARR, revenue growth, margins, retention, cash balance, or runway.
    claimRefs: [CO007, CO008, CO011]
