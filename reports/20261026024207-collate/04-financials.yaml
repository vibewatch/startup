          detail: "Diagnostic, medical-device, and drug-development companies."
        - id: workload
          label: "Documentation workload"
          detail: "Research, clinical, quality, manufacturing, and regulatory paperwork."
        - id: platform
          label: "Collate AI platform"
          detail: "Creation and streamlining of documents across the product lifecycle."
        - id: verification
          label: "Human verification"
          detail: "Founder-attributed safeguard before document export."
        - id: contract
          label: "Enterprise contract"
          detail: "Billing unit, price, duration, and services allocation are not public."
        - id: economics
          label: "Revenue and gross profit"
          detail: "ARR, recognized revenue, retention, and gross margin are unavailable."
      edges:
        - from: buyers
          to: workload
        - from: workload
          to: platform
        - from: platform
          to: verification
        - from: verification
          to: contract
        - from: contract
          to: economics
    approximationNotes: "This is a qualitative evidence bridge, not a funnel or forecast; it contains no inferred conversion rates or financial values."
    claimRefs: [CI001, CI003, CI008, CI009, CI016]

callouts:
  - calloutType: strength
    title: Enterprise value proposition is legible
    body: "Regulated documentation, a high-touch sales design, and founder-attributed time savings create a plausible path to high-value contracts."
    claimRefs: [CI001, CI003, CI008]
  - calloutType: risk
    title: Funding is not runway
    body: "The reported $125M raised does not disclose current cash, burn, debt, financing preferences, or the next capital trigger."
    claimRefs: [CI005, CI016]
  - calloutType: recommendation
    title: Condition underwriting on private evidence
    body: "Require current accounts, customer cohorts, contracts, gross-margin detail, and a downside liquidity plan before assigning revenue quality or capital adequacy."
    claimRefs: [CI007, CI009, CI012, CI016]

