schemaVersion: "report-v2"
artifact: financials
slug: collate
runDate: 2026-10-26
company:
  name: Collate
chapter:
  number: 4
  title: Financials
  summary: >-
    Collate has financing momentum and a plausible high-value enterprise software model, but
    public evidence does not disclose revenue, ARR, realized pricing, gross margin, burn, runway,
    or retention. The financial case is therefore not underwritable without private KPI,
    contract, cost-to-serve, and liquidity evidence.
sections:
  - id: revenue-architecture
    title: Revenue architecture and monetization
    body: >-
      Collate markets an AI platform for paperwork used by diagnostic, medical-device, and
      drug-development companies, while Dealroom classifies the business as B2B SaaS. Historical
      Forbes reporting described the intended motion as low-velocity, high-contract-value selling
      with expansion from project to project and department to department. Together, those
      sources support an enterprise software thesis, not a verified revenue mix. No retained
      source discloses a billing unit, list price, average contract value, contract duration,
      renewal structure, realized discount, implementation fee, or revenue-recognition policy.
      Potential platform, expansion, data, and service components must therefore remain evidence
      statuses rather than modeled revenue streams.
    claimRefs: [CI001, CI002, CI003, CI016]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-gtm
    title: Pricing, GTM motion, and traction
    body: >-
      The strongest public commercial evidence is directional. Forbes reported that Collate had
      no customers and no commercial product at its January 2025 launch, while a later
      AI-generated Life Sciences Digital article described roughly 50 enterprise customers.
      Because that customer count is not corroborated by a primary customer list or company
      filing, it should be treated as a low-confidence traction indicator. Founder-attributed
      claims of 50% to 90% documentation time savings create a potential value anchor for
      enterprise pricing, but they do not establish realized ACV, sales-cycle length, CAC,
      payback, bookings, retention, or customer concentration. Management evidence is needed to
      connect product value to repeatable sales efficiency.
    claimRefs: [CI003, CI004, CI007, CI008]
    tableRefs: [TI002]
  - id: cost-and-unit-economics
    title: Cost structure and unit economics
    body: >-
      Collate reportedly requires human verification before documents are exported, a control
      that may improve safety while also creating an unquantified delivery cost. The MantleBio
      acquisition added life-sciences data-engineering capability, but neither consideration nor
      integration expense is public. These facts identify likely cost drivers without measuring
      software gross margin, implementation labor, model and cloud spend, support burden, or
      working capital. IQVIA's second-quarter 2026 R&D Solutions revenue and bookings demonstrate
      that established life-sciences workflows can support large commercial pools, but IQVIA is
      an incumbent with service-heavy operations and its figures are not a proxy for Collate's
      private economics.
    claimRefs: [CI009, CI010, CI013, CI014, CI016]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and financial verdict
    body: >-
      Multiple reports place Collate's June 2026 financing at $95 million and cumulative reported
      funding at $125 million, with a valuation approaching $1 billion. The SaaS News says the
      latest capital was intended to scale operations and meet demand, and Dealroom's workforce
      signals indicate active organizational expansion. None of those facts establishes cash
      currently available: funding raised is not cash on hand, valuation is not revenue, and
      hiring signals are not burn. The retained evidence provides no cash balance, monthly burn,
      runway, debt schedule, financing preferences, next-round trigger, or acquisition
      consideration. The verdict is financing-backed but financially unproven, with private
      accounts and cohort economics required before underwriting.
    claimRefs: [CI005, CI006, CI011, CI012, CI015, CI016]

tables:
  - id: TI001
    title: Revenue streams and evidence status
    columns: [Stream, Mechanism, Unit, Public status, Revenue quality, Diligence ask]
    rows:
      - [Core documentation platform, "AI-assisted creation and streamlining of regulated paperwork", "Not disclosed", "Product scope verified; revenue unavailable", "Dealroom labels B2B SaaS, but recurring mix is unknown", "Obtain ARR, recognized revenue, billing unit, contract term, and renewal schedule"]
      - [Enterprise expansion, "Expansion from project to project and department to department", "Not disclosed", "Investor-described 2025 GTM thesis", "Expansion revenue and retention are unverified", "Obtain cohort expansion, GRR, NRR, and product-level bookings"]
      - [Data-platform capability, "MantleBio data engineering integrated with the broader workflow", "Not disclosed", "Acquisition and capability described", "Consideration and incremental revenue are unavailable", "Obtain purchase accounting, integration cost, and acquired-customer contribution"]
      - [Implementation and human review, "Deployment support and document verification before export", "Not disclosed", "Human review is reported; service monetization is not", "Could be revenue, cost of revenue, or both", "Obtain services mix, implementation hours, review staffing, and contribution margin"]
    notes: "Rows distinguish verified product mechanisms from unverified monetization; no unavailable value is converted into an estimate."
    claimRefs: [CI001, CI002, CI003, CI009, CI010, CI016]
  - id: TI002
    title: Pricing and GTM evidence
    columns: [Evidence, Public value, Period or basis, What it supports, What remains unknown]
    rows:
      - [List or contract price, null, "As of 2026-10-26", "No attributable public price was retained", "List price, realized ACV, discounts, duration, and payment terms"]
      - [Enterprise sales design, "Low velocity; high contract value", "Investor description published 2025-01-13", "A planned high-touch sales motion with account expansion", "Current cycle length, win rate, pipeline, CAC, and payback"]
      - [Customer traction, "Around 50 enterprise customers", "AI-generated third-party article fetched 2026-10-26", "Directional adoption signal only", "Named customer denominator, active status, concentration, and renewals"]
      - [Workflow value claim, "50%–90% time savings", "Founder-attributed report published 2026-06-05", "Potential value anchor for pricing conversations", "Independent measurement, realized price, and customer ROI"]
    notes: "Customer count and efficiency are third-party or founder-attributed claims, not audited commercial metrics; null means no attributable public evidence."
    claimRefs: [CI003, CI004, CI007, CI008, CI016]
  - id: TI003
    title: Unit economics and capital-adequacy evidence
    columns: [Metric, Collate value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue run rate or ARR, null, Low, "Links operating scale to the reported valuation", "Obtain monthly recognized revenue, ARR bridge, bookings, and revenue-recognition policy"]
      - [Gross margin and cost to serve, null, Low, "Tests scalability after human review, implementation, and AI infrastructure", "Obtain product and services gross margin plus labor, model, cloud, and support costs"]
      - ["CAC, payback, and sales cycle", null, Low, "Tests whether enterprise growth can be financed efficiently", "Obtain cohort CAC, ACV, pipeline conversion, cycle length, and payback"]
      - [Retention and concentration, null, Low, "Tests durability and exposure to a small regulated-account base", "Obtain GRR, NRR, renewal cohorts, churn reasons, and top-customer share"]
      - ["Cash, burn, runway, and debt", null, Low, "Determines financing dependency after the reported $95M round", "Obtain current cash, monthly burn, debt and preference schedule, downside runway, and next-round trigger"]
      - [Public incumbent context, "$2.575B Q2 2026 R&D Solutions revenue; $3.15B net new bookings", "Medium; IQVIA-reported and not comparable", "Shows the scale of established life-sciences workflow spending", "Do not apply incumbent service economics to Collate; obtain company-specific unit data"]
    notes: "All Collate operating values marked null are unavailable in the retained evidence; IQVIA is a contextual incumbent, not a valuation or margin proxy."
    claimRefs: [CI005, CI009, CI013, CI014, CI016]

