    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Nothing customer segments mapped across awareness, purchase, and ecosystem expansion touchpoints,
      showing how India urban youth, UK/Germany enthusiasts, and US audio buyers follow distinct paths.
    data:
      items:
        - label: "Awareness"
          description: "Social media, tech press reviews (GSMArena, 9to5Google, Android Authority), community investment signal; Nothing's transparent-back aesthetic drives organic shareability"
          segment: "All segments"
        - label: "Consideration"
          description: "Mid-range ($379 Phone 3a) or budget ($199 CMF Phone 1) evaluation vs Xiaomi, Samsung Galaxy A, Google Pixel; design differentiation and clean OS drive shortlisting; professional reviews and YouTube are primary decision inputs"
          segment: "India youth, UK/Germany enthusiasts"
        - label: "Purchase"
          description: "India: Flipkart/Amazon India online + 10,000 offline stores including flagship Bengaluru; UK/Germany: nothing.tech + local retail; US: nothing.com, Amazon, Best Buy (Phone 3 and 4a Pro)"
