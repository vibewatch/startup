  evidenceGaps:
    - type: missing-source
      severity: material
      topic: repeat-purchase-retention
      missingEvidence: >-
        Cohort-level repeat-purchase data showing what share of Nothing Phone (1) buyers upgraded to
        Phone (2) or (2a), and Phone (2) buyers upgrading to Phone (3) or (3a); device-generation
        upgrade rate is the primary consumer-electronics retention metric.
      whyItMatters: >-
        Without repeat-purchase rate or brand loyalty cohort data, it is impossible to assess whether
        Nothing's unit growth is driven by net new customers or a loyal upgrading base—a critical
        distinction for predicting sustainable revenue growth and customer lifetime value.
      diligencePath: >-
        Request anonymised device-registration cohort data from Nothing; alternatively survey the
        Nothing community investment-round participants on upgrade history; cross-reference community
        forum threads where users explicitly state their previous Nothing device.
      relatedQuestionRefs:
        - QU013
        - QU016

    - type: missing-source
      severity: material
      topic: NRR-churn-quantification
      missingEvidence: >-
        No disclosed NPS, CSAT, Trustpilot aggregate score trend over time, or internal customer
        satisfaction survey data is publicly available for Nothing. The only signals are self-selected
        complaint-biased Trustpilot reviews and mixed review-platform averages.
      whyItMatters: >-
        Customer satisfaction and churn quantification are essential to assessing brand durability
        as Nothing scales into new geographies and higher price points. The trust-erosion incidents
        documented by Android Authority and 9to5Google could accelerate churn among the core
        enthusiast segment if not measured and mitigated.
      diligencePath: >-
        Request internal NPS and CSAT data from Nothing management; obtain Trustpilot average rating
        over 2022–2026 trend; commission independent survey of recent Nothing buyers in India and UK.
      relatedQuestionRefs:
        - QU013
        - QU022

    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof
      missingEvidence: >-
        Formal named customer case studies or brand testimonials from identifiable repeat buyers or
        notable community members are not publicly available. The named customer proof table relies
        on professional reviewers and anonymous-username GSMArena users rather than verified
        individual buyer identities.
      whyItMatters: >-
        For due diligence purposes, stronger named customer proof would validate that real loyalty
        exists beyond review-platform sentiment. Community investment round participants are a
        potential source of named loyalists with documented purchase history.
      diligencePath: >-
        Engage Nothing to provide anonymised but attributable customer testimonials; identify
        community round investors willing to serve as named references; review Nothing's own
        social media for featured customer stories.
      relatedQuestionRefs:
        - QU006
      relatedTableRefs:
        - TU003

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      TU003 (Named customer proof table) is a factual snapshot of identified reviewers and named community
      users; all cells are directly sourced from cited review platforms. Notes are included nonetheless.
  - dimension: figureType
    reason: >-
      FU004 uses cohort type as specified in plannedFigures; all retention values are estimated proxies
      clearly labelled as approximations in approximationNotes, not fabricated metrics. The planned
      figure type cohort is the most appropriate available type for retention-over-time visualisation
      even when data is proxy-estimated.
