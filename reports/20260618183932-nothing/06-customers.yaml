callouts:
  - calloutType: strength
    title: India Market Dominance is a Structural Advantage
    body: >-
      Nothing has been the fastest-growing smartphone brand in India for six consecutive quarters through
      Q2 2025, achieving 146–229% YoY growth driven by CMF Phone 2 Pro and Phone 3a. The decision to move
      CMF's global headquarters to India, expand retail from 2,000 to 10,000 stores, and treat India as both
      a manufacturing and export hub reflects deep market commitment. India's young, digitally native, design-
      conscious consumer base is exactly Nothing's target demographic, and the brand's community-led marketing
      has strong resonance. This advantage is durable as long as Nothing maintains supply-chain agility and
      design differentiation against Xiaomi, realme, and Motorola.
    claimRefs:
      - CU012
      - CU013
      - CU014
      - CU016

  - calloutType: risk
    title: Trust Erosion and Software Quality Create Churn Risk
    body: >-
      A pattern of reputational incidents—Nothing Chats security breach (2023), community email data breach
      (2022), camera sample controversy (2025), lockscreen ads on Phone 3a Lite—combined with recurring
      software-bug reports after major OS updates, is eroding the brand trust among core enthusiast buyers.
      Android Authority's editorial (2025) documents this explicitly: "It's getting harder to fully trust"
      Nothing despite good hardware. The Nothing Phone 3 underperforming at $799 and 9to5Google's "make-or-
      break" framing suggest the brand is at an inflection point where repeat-purchase rates among early
      adopters could decline if the trend continues. No disclosed NPS or CSAT data makes this risk hard
      to size.
    claimRefs:
      - CU025
      - CU026
      - CU030
      - CU031
      - CU032

