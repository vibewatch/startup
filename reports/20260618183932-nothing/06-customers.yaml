company:
  name: Nothing
chapter:
  number: 6
  title: Customers
  summary: >-
    Nothing serves design-conscious, tech-enthusiast consumers primarily in India, UK, and Germany for smartphones
    and in the US, UK, Germany, and Japan for audio products, with over 7 million devices shipped by early 2025.
    India is its fastest-growing market (146–229% YoY Q2 2025) and the company reached $1 billion in lifetime sales
    in early 2025. Customer proof is solid for mid-range and budget segments; retention data is not publicly
    disclosed and adverse signals include quality-control incidents, software bugs, and eroding trust events.

sections:
  - id: customer-base-segmentation
    title: Customer Base & Segmentation
    body: >-
      Nothing sells directly to individual consumers (B2C) across three hardware lines: flagship Nothing Phones
      ($700–$800), mid-range Nothing Phone "a" series ($379–$459), and the budget CMF by Nothing sub-brand
      ($199–$279). The consumer base is defined primarily by age (Gen-Z and younger millennials), interest
      in distinctive design aesthetics, and willingness to pay a modest premium over commodity Android devices.
      Carl Pei has articulated the target as "the next generation—interested in tech, creativity, and design."

      Geographically, India is Nothing's dominant and fastest-growing smartphone market, followed by Germany
      and the UK. Audio products (earbuds, headphones) lead in the US, followed by the UK, Germany, and Japan.
      The US has historically had limited smartphone availability (Beta Program only for most models), but
      Nothing Phone (3) launched with full AT&T and T-Mobile support in mid-2025, marking the beginning of
      a formal US smartphone push. Distribution in India has expanded from 2,000 to 10,000 retail stores
      in 2025 and now includes a flagship store in Bengaluru (opened February 2026).

      The CMF sub-brand targets a lower-income and more price-sensitive consumer segment, particularly
      dominant in India and Southeast Asia. CMF Phone 2 Pro ($279) is positioned against Xiaomi, Realme,
      and Motorola budget devices. The brand identity is built around modularity, bold colours, and value
      rather than the premium transparent-back aesthetic of the main Nothing line. India is the CMF global
      headquarters location, and CMF's manufacturing base is primarily in India via the Optiemus joint venture.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
