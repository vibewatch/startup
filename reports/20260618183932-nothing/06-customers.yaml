  - id: adoption-trajectory
    title: Adoption Trajectory & Market Traction
    body: >-
      Nothing has achieved remarkable growth velocity from a small base. The company shipped over 7 million
      cumulative devices (phones and accessories) across all product categories by early 2025, and 2024 revenue
      doubled year-over-year to exceed $500 million. Lifetime sales crossed $1 billion in early 2025. Bloomberg's
      Mark Gurman reported these figures directly citing Nothing's investor disclosures.

      In India, Nothing has been the fastest-growing smartphone brand for six consecutive quarters through
      Q2 2025. Counterpoint Research documented 146% year-over-year shipment growth in Q2 2025, driven by the
      CMF Phone 2 Pro launch and retail expansion. Canalys (now part of Omdia) separately cited 229% YoY growth
      for the same period, attributing it to design-led innovation resonating with young urban consumers and
      volume contributions from CMF Phone 2 Pro, Phone 3a, and 3a Pro. Global Counterpoint data for full-year
      2025 recorded 31% YoY growth for Nothing globally, while Omdia's Jetstream report placed it at 86%
      YoY, the highest among tracked brands for 2025.

      Despite these growth rates, absolute scale remains limited: Nothing's global smartphone market share
      is under 1%, and in India its combined share (Nothing plus CMF) reached approximately 1.4–2% by Q2 2025.
      The company has about 600 employees and manufactures primarily in China and India. In India alone,
      over 1 million smartphones were shipped in Q2 2025. Nothing reached 10,000 retail touchpoints in India
      by end of 2025, up from 2,000 at the start of the year.
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU012
