  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >
              Nothing Technology Limited's regulatory and legal posture carries several distinct and concurrent risk
              vectors. The most structurally significant is the March 2026 First Gazette notice filed by UK Companies
              House for compulsory strike-off of Nothing Technology Limited (company number 12984564). Although the
              action was discontinued on 18 March 2026, its very filing indicates a lapse in compliance obligations—most
              commonly overdue accounts or confirmation statements—that reached regulatory escalation. Three outstanding
              charges are registered with Companies House in favor of Banco Santander as Security Agent, created in
              December 2024 as collateral for the £30 million debt facility. These secured creditor positions rank ahead
              of equity holders in any distress scenario.

              On the intellectual property front, CourtListener returns 15 cases and 78 docket entries referencing
              "nothing technology," indicating that the company has become a recurring defendant in US patent litigation
              rather than facing a one-off claim. The most notable active matter is Volteon LLC v. Nothing Technology
              Limited (E.D. Tex. 2:25-cv-00093), filed 31 January 2025, targeting wireless charging technology.
              Electronic Edison Transmission Technologies LLC filed a separate suit in September 2025. The Eastern
              District of Texas is a preferred filing venue for non-practicing entities, and serial presence in that
              jurisdiction is a material ongoing cost and management distraction risk. The company also faces GDPR
              obligations as a UK data controller collecting IMEI numbers, MAC addresses, payment data, voice data, and
              device diagnostics—fields whose scope creates regulatory exposure under UK ICO enforcement if breaches or
              consent failures occur.
            claimRefs:
