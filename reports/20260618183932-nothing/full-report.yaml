      - number: '5.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Glyph Matrix as a Defensible Design Moat
            body: >
              The Glyph Matrix (489 LEDs, Phone 3) represents a rare hardware differentiator in commodity Android
              smartphones. By pairing a programmable secondary micro-LED display with an open SDK and community
              Playground distribution, Nothing has created a platform flywheel: each new Glyph Toy increases the
              perceived value of owning a Nothing phone, while the GDK (675 GitHub stars, growing) deepens developer
              investment. No mass-market Android OEM — Samsung, OnePlus, Google — offers a comparable programmable rear
              display with an open developer ecosystem. This differentiation is difficult to replicate quickly because
              it requires tight hardware-software co-design and a community-seeding investment.
            calloutType: strength
            claimRefs:
