        - Nothing's 2023 and 2024 audited accounts (2024 accounts >6 months overdue at Companies House)
        - >-
          Gross margin, operating loss, debt covenants, and cash runway are unknowable without audited accounts; the
          January 2025 UK Tech News report of widening losses is unverifiable from public data alone
        - Request directly from management; obtain via investor data room; monitor Companies House for filing
      - - Cap table and preference stack
        - >-
          Full cap table including liquidation preferences, participating vs non-participating preferred, ratchets, and
          anti-dilution provisions for all $450M raised
        - >-
          Liquidation preference overhang could substantially impair common equity IRR at a $2-3B exit; critical for
          return modeling
        - Request via management; review shareholder agreements; consult counsel
      - - CMF spin-off valuation
        - >-
          Whether the $1.3B Series C valuation was set on a consolidated or parent-only basis, and how CMF India is
          treated post-spin-off
        - >-
          The $1.3B mark may or may not include CMF's India revenue base; ambiguity inflates or deflates the implied
          multiple significantly
        - Management confirmation; review term sheet definition of 'company' in Series C documents
      - - AI roadmap and product specs
        - >-
          Technical and commercial details for 2026 AI earbuds and 2027 AI glasses, including unit economics, BOM cost,
          and target ASP
        - >-
          Without product specs and margins, the AI device story is pure optionality; comparable AI hardware failures
          (Humane) were not evident pre-launch
        - Obtain product brief from management; review Qualcomm Ventures strategic rationale
      - - Nothing Chats remediation
        - >-
          Formal post-incident review, any regulatory correspondence from UK ICO or India DPDP authority, and
          remediation steps taken
        - >-
          The Nov 2023 incident involved publicly accessible user credentials and messages; unresolved regulatory
          exposure is a material liability at any exit
        - Request ICO correspondence; review DPA/privacy compliance documentation
    notes: >-
      Diligence asks are organized by materiality. Items 1-3 are blocking for a conviction buy at the current valuation.
      Items 4-5 are material but addressable with management access. The company has not made audited financials
      publicly available; this is normal for a private UK company at Series C but limits analytical precision.
