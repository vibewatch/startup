          - type: callout
            title: Hardware Revenue Quality — No Recurring Component, Thin Margins
            body: >
              Nothing's revenue model is entirely transactional hardware sales. There is no subscription revenue,
              platform fee, or recurring payment stream. Consumer hardware gross margins are structurally below software
              peers; hardware companies at comparable scale operate in the 25–40% range. Nothing's path to profitability
              therefore depends on significant volume scale, mix shift toward higher-ASP products (Phone 3 / Phone 4a
              Pro), audio accessory attach rates, and eventual software or AI-service monetization — none of which is
              yet funded by a recurring revenue base. The CMF spinoff in September 2025 may have transferred the
              highest-volume, lowest-margin segment to a separate entity, which could improve consolidated margins but
              also reduces total revenue in the Nothing Technology Limited UK entity. Until a filed P&L is available,
              this remains speculative.
