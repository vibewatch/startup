            title: UK Statutory Accounts Overdue — Corporate Governance Gap
            body: >
              Nothing Technology Limited's annual accounts for the year ending December 31, 2024 were due at Companies
              House by December 31, 2025 and remain unfiled as of June 18, 2026. A compulsory strike-off notice was
              issued March 10, 2026 (then discontinued March 18, 2026), likely triggered by the overdue filing. The last
              filed accounts (year to December 31, 2023) were submitted only in January 2025. Three registered debt
              charges dating from December 18, 2024 indicate drawn credit lines whose terms, covenants, and
              counterparties are undisclosed. Combined, these administrative and governance signals introduce meaningful
              diligence risk: the most recent financial year is entirely opaque to external parties. Any
              capital-allocation decision should require audited FY2024 and FY2025 accounts as a condition precedent.
            calloutType: risk
