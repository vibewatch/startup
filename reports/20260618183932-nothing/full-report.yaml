      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: AI Hardware Execution Risk Is the Single Biggest Valuation Driver
            body: >-
              Nothing's $1.3B valuation and its path to a $3-8B IPO rest almost entirely on the AI-native device pivot
              delivering commercial traction. The sector precedent is sobering: Humane, founded by ex-Apple veterans,
              raised $230M, was valued between $750M-$1B, yet sold its assets to HP for $116M in February 2025 after its
              AI Pin failed. Rabbit's R1 similarly struggled post-launch. Nothing has not yet shipped an AI-native
              product; it has announced AI features in its smartphone OS (Essential Search, Playground, AI dictation)
              but the step to a standalone AI device — earbuds or glasses — is a materially higher execution bar. For an
              investor at the current mark, every dollar of premium above the 2.6x trailing revenue multiple is an
              option on this execution. If it fails, the company reverts to a 0.9-1.5x hardware multiple, implying a
              valuation of $450M-$750M — a 40-65% markdown from the current $1.3B mark.
            calloutType: risk
            claimRefs:
              - CV037
              - CV024
              - CV025
              - CV043
          - type: callout
            title: India Concentration Is Strength and Fragility Simultaneously
            body: >-
              Nothing's fastest-growing brand status in India for five consecutive quarters (Q1 2025 through Q1 2026,
              with 47-156% YoY growth) is the primary commercial validation underlying the $1.3B valuation. India
              accounted for roughly 75% of Nothing's smartphone revenue in 2024. This concentration is both the
              company's greatest near-term asset and its most significant medium-term risk. India's overall smartphone
              market declined 3% YoY in Q1 2026, the weakest quarter in six years per Counterpoint Research. A sustained
              India market downturn, rupee depreciation relative to USD, or a competitive response from Samsung or Vivo
              with Nothing-like design differentiation could materially impair growth. At the same time, the CMF
              spin-off and $100M Optiemus JV create an India manufacturing and export base that — if successful — could
              fund global expansion and reduce concentration risk over a 3-5 year horizon.
            calloutType: insight
            claimRefs:
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
              - CV029
          - type: callout
            title: Valuation Assumes Combined Nothing + CMF Entity
            body: >-
              The $1.3B Series C valuation was set in September 2025, just before CMF was spun off as an independent
              India-based subsidiary in late September 2025. It is not public whether the Series C term sheet defined
              the company on a consolidated basis (including CMF) or as the parent Nothing entity alone. If the $1.3B
              mark excludes CMF India — which contributed a significant and growing share of unit volume in 2025 — the
              effective EV/Revenue multiple for the remaining parent entity would be materially higher. This is a
              first-order diligence question that should be resolved before any buy decision at the current price.
            calloutType: assumption
            claimRefs:
              - CV001
              - CV006
              - CV029
              - CV021
