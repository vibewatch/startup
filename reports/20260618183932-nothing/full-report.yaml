  - id: FV004
    title: Investment KPI Scorecard
    type: kpi
    layout: standard
    summary: >-
      IC-ready scoring across seven dimensions: market, commercial proof, moat, economics, risk, valuation, and evidence
      quality.
    data:
      items:
        - label: Market Opportunity
          value: 7
          unit: /10
          note: Global smartphone + AI wearable TAM is large; India alone is $50B+; AI hardware upside material
        - label: Commercial Proof
          value: 7
          unit: /10
          note: >-
            150% 2024 revenue growth; $500M+ revenue; 47% India Q1 2026 growth; IDC fastest-growing brand 5 consecutive
            quarters
        - label: Competitive Moat
          value: 5
          unit: /10
          note: Design differentiation real but replicable; software moat early-stage; no hardware IP defensibility evident
        - label: Unit Economics
          value: 4
          unit: /10
          note: >-
            Gross margin undisclosed; losses widened per 2023 accounts; hardware-first model typically 10-20% GM; no
            recurring revenue
        - label: Risk Profile
          value: 5
          unit: /10
          note: >-
            Multiple trust incidents; AI hardware category risk; India concentration; overdue accounts; strike-off
            notice
        - label: Valuation Attractiveness
          value: 6
          unit: /10
          note: >-
            2.6x trailing revenue is premium to sector (0.9x) but below high-growth software; fair for growth rate if
            margins improve
        - label: Evidence Quality
          value: 5
          unit: /10
          note: No audited 2024 accounts; cap table undisclosed; gross margin not public; CMF consolidation unclear
    approximationNotes: >-
      Scores are author judgments on a 1-10 scale based on evidence gathered as of runDate. Not a standardized
      investment scoring framework.
    claimRefs:
      - CV036
      - CV010
      - CV017
      - CV047
