      - number: '4.2'
        title: Unit Economics and Cost Structure
        blocks:
          - type: paragraph
            body: >
              Nothing's cost structure is typical of a capital-light hardware brand: product design and software
              development are retained in-house while manufacturing is fully outsourced to contract facilities in China
              and India. This approach minimises capital expenditure and inventory risk relative to vertically
              integrated competitors such as Samsung, but makes margin improvement contingent on volume scale,
              supply-chain leverage, and ASP management rather than internal manufacturing efficiency. Gross margins are
              described by Sacra as "consistent with those of hardware companies," which typically translates to a range
              of 25–40% for consumer electronics brands at this scale; however, no official margin figure has been filed
              or disclosed, and any third-party estimate remains unverified.

              Unit economics at the SKU level are entirely undisclosed. Customer acquisition cost, contribution margin
              per device, lifetime value, and payback period are unknown, constrained by the fact that Nothing is a
              private company with no public filing obligations in Singapore (where the parent entity may be domiciled)
              and overdue UK statutory accounts. The absence of repeat-purchase economics in a hardware business (where
              LTV is typically low) means the primary economic driver is gross margin at point of sale plus ecosystem
              attach rates for audio accessories. Nothing's headcount was approximately 600 as of early 2025 per
              independent reporting; growth in headcount for the Series C phase would increase fixed-cost base, but
              concrete burn-rate data is unavailable.

              The CMF spinoff (India entity) changes consolidated reporting in ways that are not yet transparent: audio
              and smartwatch revenue that previously contributed to Nothing Technology Limited's UK filings may now flow
              through a separate entity. This complicates any attempt to reconstruct consolidated financials from public
              data alone.
