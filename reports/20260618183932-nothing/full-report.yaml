      - number: '1.4'
        title: Milestone History and Adverse Events
        blocks:
          - type: paragraph
            body: >-
              Nothing's timeline from October 2020 to mid-2026 covers six years of consecutive product launches, funding
              events, geographic expansion, and a small but material set of adverse events. The company began as a
              hardware startup without a defined product, acquiring the Essential Products brand and IP in January 2021
              and partnering with Swedish design firm Teenage Engineering in February 2021 to establish its aesthetic
              direction. The ear (1) earbuds launched in July 2021 and sold over 100,000 units in the first two months,
              validating the design-led thesis before the company had shipped a phone.

              The product trajectory then moved through annual flagship cycles: Phone (1) in July 2022, Phone (2) in
              July 2023, Phone (3a) in March 2025, and Phone (3) in July 2025—each increasing in price, specification,
              and distribution reach. The CMF by Nothing sub-brand expanded the portfolio downmarket from September
              2023, with CMF Phone 1 selling 100,000 units in three hours at its July 2024 launch, confirming strong
              budget-tier demand.

              Two adverse events warrant diligence attention. In November 2023, Nothing pulled its Nothing Chats app—a
              partnership with Sunbird to enable iMessage on Android—from Google Play within 24 hours after security
              researchers discovered unencrypted user messages and media were being transmitted to third-party servers.
              In August 2025, Nothing was publicly criticized for using stock photographs in Phone (3) retail demo units
              rather than genuine camera samples. Two patent assertion entity (PAE) lawsuits were filed in Eastern
              District of Texas in 2025: Volteon LLC (January 2025, motion sensing patents, dismissed with prejudice
              September 2025) and Electronic Edison Transmission Technologies (September 2025, wireless charging patents
              against Phone 3, voluntarily dismissed without prejudice February 2026). Neither reached substantive
              rulings. In India, Nothing and CMF set new sales records ahead of the Bengaluru store opening in February
              2026, and the company reported approximately 2% smartphone market share in India, its largest market, as
              of mid-2025.
