      - number: '3.3'
        title: Mid-Range Portfolio and Sub-Brand Competition
        blocks:
          - type: paragraph
            body: >
              Beyond the flagship tier, Nothing's mid-range portfolio competes across two price brackets. The Phone (4a)
              (Snapdragon 7s Gen 4, ~$480, 3.5× periscope telephoto, 50W charging) targets the $450–$550 tier alongside
              Google Pixel 10a ($500, Tensor G4, 7-year updates) and OnePlus 15R ($700, Snapdragon 8 Gen 5, 7,400mAh
              battery). Google Pixel 10a is broadly ranked by Android Police as the best overall mid-range Android phone
              in 2026, driven by its computational photography advantage and 7-year software support—both areas where
              Nothing Phone (4a) concedes. OnePlus 15R offers more raw battery capacity and a faster chipset at $700 but
              lacks wireless charging and offers only 4-year OS updates.

              CMF by Nothing (sub-brand) launched the CMF Phone 2 Pro at approximately $279 (Rs 18,999), featuring a
              modular back design with swappable accessories, a triple-camera system with 2× telephoto, and Dimensity
              7300 Pro—unique customisation not offered by Realme, Poco, or Samsung A-series rivals. However, CMF Phone
              2 Pro carries an IP54 rating versus IP68/IP69 on Realme Narzo 80 Pro, and 33W charging versus 80W on
              Realme, representing material hardware disadvantages. Samsung Galaxy A26 5G's 6-year OS update guarantee
              significantly outpaces CMF's 3-year commitment, creating long-term value risk. In audio, CMF Buds 2 Plus
              competes in the sub-$50 tier alongside Anker Soundcore Liberty 4 NC and EarFun Air Pro 4, emphasising ANC
              and battery life at aggressive price points.
