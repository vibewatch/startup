      - number: '5.3'
        title: Hardware Architecture and Manufacturing
        blocks:
          - type: paragraph
            body: >
              The Phone (3)'s hardware architecture is anchored by the Qualcomm Snapdragon 8s Gen 4 (4nm) — an octa-core
              CPU (1×3.21 GHz Cortex-X4, 6×Cortex-A720 variants) with Adreno 825 GPU. The choice reflects a deliberate
              cost-performance tradeoff: the 8s Gen 4 delivers multi-year Qualcomm chipset support, enabling the 5-year
              OS commitment, at a lower BOM than the Snapdragon 8 Elite. RAM uses LPDDR5X (up to 16 GB), storage UFS 4.0
              (up to 512 GB), and connectivity includes Wi-Fi 7 and Bluetooth 6.0. The 5,150 mAh silicon-carbon battery
              (5,500 mAh in the Indian variant) supports 65 W wired and 15 W wireless charging. Gorilla Glass 7i (front)
              and Gorilla Glass Victus (rear) with aluminum mid-frame achieve IP68 — the brand's first full immersion
              rating. The Phone weighs 218 g and is 9 mm thick, which reviewers note is heavier and thicker than some
              rivals.

              For the mid-range, the CMF Phone 2 Pro uses MediaTek Dimensity 7300 Pro (4nm) with Mali-G615 GPU and 8 GB
              RAM, targeting competitive value. The Phone (4a) Pro steps to Qualcomm Snapdragon 7 Gen 4 with IP65 and
              144 Hz AMOLED for the upper mid-range at $479.

              Manufacturing for the Phone (3a) series is handled by BYD India at its Chennai facility. Nothing is
              exploring a ₹1,000 crore (approx. $120 million) joint venture with domestic Electronics Manufacturing
              Services partners to establish India as a global export hub, a strategic move reinforced by the
              appointment of co-founder Akis Evangelidis as President of India. This supply chain concentration in
              Indian contract manufacturing represents both a geopolitical risk mitigation (reducing China exposure) and
              an execution risk (scale-up capability, quality control, and talent depth).
