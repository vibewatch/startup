      - number: '6.3'
        title: Named Customer Proof & Review Quality
        blocks:
          - type: paragraph
            body: >-
              Nothing's customer proof base consists predominantly of product reviews by independent technology
              journalists and verified user reviews on enthusiast platforms such as GSMArena. Formal B2C case studies or
              named enterprise customers do not exist given the consumer electronics business model. The company
              operates a community investment programme that has attracted named repeat investors and loyalists.

              Professional reviewers have broadly validated Nothing Phone 3a as outstanding value at $379, with
              TrustedReviews calling it "stunning value" and 9to5Google's Ben Schoon identifying it as the clear winner
              in the 3a series over the $459 Pro variant. GSMArena's professional review highlighted "very loud
              speakers, unique software design, and great all-around camera performance" with zero thermal throttling.
              TechAdvisor praised battery life and clean software. These are independent arms-length third-party
              reviewers citing actual use of retail-grade devices.

              For the CMF sub-brand, Gadgets360's professional review of CMF Phone 1 concluded "excellent
              value-for-money proposition" with long battery life (25 hours 20 minutes in loop test). Android Authority
              reviewed CMF Phone 2 Pro at $279 as "a beautiful, forward-thinking phone far better than its low price
              would suggest" with primary, ultrawide, and telephoto cameras at a sub-$300 price.

              GSMArena user reviews show organic satisfaction signals. A user switching from Samsung Galaxy S22 to CMF
              Phone 1 wrote they were "impressed" by display and battery after one year of use. A separate user
              purchasing CMF Phone 1 reported "extremely satisfied" performance with AnTuTu score above 864k, calling
              the display and multimedia consumption "top notch." The Nothing community forum hosts verified buyer
              reviews of CMF phones with consistent positive sentiment around OS smoothness and value.

              Adverse signals in customer proof: Android Authority's editorial "I love Nothing's Android phones, but
              it's getting harder to trust them" cites four specific trust-eroding incidents—Nothing Chats security
              breach (app pulled within 48 hours of launch for privacy violations), NFT gallery on Phone 1, a 2022
              community email data breach, and a camera-samples controversy on Nothing Phone 3. The 9to5Google Nothing
              Phone 3 year-end review described the device as "pretty clearly not a hit" and "polarizing," with
              overhyping and a $799 price as key detractors.
