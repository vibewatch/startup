      - number: '7.3'
        title: Financial and Capital Risk
        blocks:
          - type: paragraph
            body: >
              Nothing's financial profile is characterized by rapid loss growth, extreme cash thinness ahead of debt and
              equity raises, and hardware-company economics that create structural dependency on continued external
              capital. UKTN reporting based on Companies House filings shows that Nothing posted a £59.4 million net
              loss in FY2023—a 60% year-over-year increase—while revenue grew only 12.1% to approximately £50 million.
              Year-end 2023 cash was approximately £1.4 million, down 70% from 2022, leaving the company operationally
              dependent on its December 2024 £30 million Santander debt raise for operational continuity. The debt
              facility is secured against company assets, meaning covenant breach or revenue shortfall could trigger
              acceleration of repayment obligations ahead of the equity stack.

              The September 2025 Series C ($200 million at $1.3 billion valuation, led by Tiger Global with Qualcomm
              Ventures participating) provides meaningful runway, but also signals that the company must demonstrate a
              path to hardware profitability or a revalued software/AI revenue model to justify that mark in subsequent
              rounds. Revenue growth lagging loss growth in FY2023 indicates scale has not yet generated margin
              improvement—a red flag for a capital-intensive hardware business that requires ongoing chip procurement,
              contract manufacturing, and distribution spend. IDC's market data shows global smartphone growth forecast
              at 1.5% for 2025 and component shortages that could disproportionately affect smaller OEMs' input costs in
              2026.
            claimRefs:
              - CR003
