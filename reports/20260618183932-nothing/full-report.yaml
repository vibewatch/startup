chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Product Lines
        blocks:
          - type: paragraph
            body: >-
              Nothing Technology Limited is a British consumer electronics company headquartered in London, England,
              incorporated on October 29, 2020. The company was founded by Carl Pei—previously co-founder of
              OnePlus—alongside Akis Evangelidis, David Sanmartín García, Steven Gao, and Levi Li. Nothing's declared
              mission is to remove barriers between people and technology, creating a seamless digital future where
              sufficiently advanced hardware fades into the background and feels like nothing. The company competes as a
              design-forward challenger brand, intentionally positioning itself against the commodity sameness it argues
              defines the broader Android smartphone market.

              Nothing's product portfolio spans smartphones, wireless earbuds, over-ear headphones, and smartwatches.
              Its smartphones run Nothing OS, a customized closed-source Android build developed in-house. The defining
              aesthetic feature across the flagship line is transparent or semi-transparent rear panels combined with
              the Glyph Interface, a system of LED lighting on the rear panel that serves as a notification surface. The
              Phone (1) established this design language in July 2022; subsequent generations including the Phone (2),
              Phone (3), and Phone (4a) iterated on it while gradually moving upmarket. The Phone (3), launched July
              2025 at £799, introduced the Glyph Matrix, a full dot-matrix LED display on the rear.

              The budget-facing CMF by Nothing sub-brand, launched in September 2023 and spun off as an independent
              India-headquartered entity in September 2025, extends the portfolio into the under-$300 price tier with
              phones, earbuds, and smartwatches. By March 2026, Nothing had expanded its flagship-adjacent lineup with
              the Phone (4a) and Phone (4a) Pro (from £349 and £499 respectively) and introduced Headphone (a) at £149.
              Bloomberg reported in March 2026 that Nothing is targeting AI-enhanced smart glasses for release in the
              first half of 2027, marking the first credible signal of category expansion beyond current form factors.
