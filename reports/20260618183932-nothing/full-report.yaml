      - number: '2.2'
        title: Market Sizing and Opportunity
        blocks:
          - type: paragraph
            body: >-
              Grand View Research pegs the global smartphone revenue pool at $520.45 billion for 2024 and projects it to
              reach $651.82 billion by 2030 on a 3.9% CAGR. The premium segment—devices priced above $600—now accounts
              for roughly 25% of that pool, or approximately $130 billion, and is growing at a faster CAGR than the
              overall market. Mordor Intelligence sizes the TWS earbuds market at approximately $64.7 billion in 2024,
              growing at roughly 15% annually to a projected $88 billion by 2025 and beyond.


              Nothing's SAM combines premium and upper-mid-range smartphones (roughly $130 billion) with the full TWS
              earbuds category ($64.7 billion), totalling approximately $195 billion. The European smartphone market—one
              of Nothing's core geographies—grew 5% in 2024 to approximately 130 million units, its first positive year
              after four consecutive declines. India's smartphone market reached all-time high revenue in 2024, with the
              premium segment expanding at approximately 15% year-on-year.


              Nothing's FY2024 annual revenue exceeded $500 million—doubling year-over-year—representing less than 0.1%
              of the combined smartphone and audio TAM. Crossing $1 billion in lifetime device sales and securing a $1.3
              billion Series C valuation (September 2025) signal investor conviction that the SAM penetration has room
              to grow materially. The range chart shows publisher-backed low/base/high estimates to communicate the
              uncertainty inherent in third-party market sizing.
