            body: >
              Nothing's transparent-back hardware design and Glyph Matrix interface are the most distinctive visual
              identity in the global smartphone market. No top-5 OEM has replicated this aesthetic. Among
              design-motivated buyers—a segment underserved by Samsung's minimalist rectangles and Apple's color-infused
              glass—Nothing occupies a unique perceptual position. This brand moat, though not IP-protected by hard
              patents, has been built across five phone generations and is reinforced by brand ambassador activations in
