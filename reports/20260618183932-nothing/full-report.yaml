      - number: '6.5'
        title: Expansion, Concentration & Channel Risk
        blocks:
          - type: paragraph
            body: >-
              Nothing's geographic concentration is a material risk: India dominates smartphone revenue and growth, and
              Germany/UK are the secondary markets. The top three markets represent the vast majority of smartphone
              volumes. This creates vulnerability to India-specific competitive dynamics (Xiaomi, realme, OnePlus),
              regulatory changes to the PLI manufacturing scheme, or a single-market slowdown. The US launch of Nothing
              Phone (3) in 2025 (officially with AT&T and T-Mobile support) and Phone (4a) Pro in 2026 is strategically
              important for diversification, but no major US carrier carries the device on installment plans, limiting
              mainstream reach and volume.

              Channel concentration risk is partially mitigated by India's retail expansion to 10,000 stores by end of
              2025 and the opening of a flagship store in Bengaluru (February 2026), with New York and Tokyo stores
              announced. However, Nothing's India sales remain heavily dependent on online channels and the
              Flipkart/Amazon India e-commerce ecosystem, and offline share is still maturing.

              The CMF sub-brand spin-off (TechCrunch, September 2025: CMF to become a separate India-incorporated entity
              with a $100M JV with Optiemus) introduces CMF customer portfolio and manufacturing concentration risk. If
              the India manufacturing joint venture experiences disruption, CMF production—which drives the majority of
              India volume—would be at risk. US tariff uncertainty on Indian exports was acknowledged by Nothing
              co-founder Akis Evangelidis as a consideration, though he stated it would not change plans.

              At the product segment level, the mid-range Phone "a" series ($379) and budget CMF tier ($199–$279)
              account for the majority of unit volume, while the flagship Phone (3) at $799 was described as "not a hit"
              commercially. This creates a structural challenge: the bulk of revenue and customer acquisition comes from
              lower-ASP devices where margin compression is a risk, while the premium segment underperforms
              expectations. Repeat-purchase expansion into higher ASPs is unproven.
