      - number: '8.3'
        title: Comparable Set and Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              Consumer electronics hardware companies trade at a median EV/Revenue of approximately 0.9x, per NYU Stern
              January 2026 data, reflecting their capital intensity and thin margins. Samsung trades at 2.7-4.0x
              EV/Revenue due to its semiconductor diversification and scale. Xiaomi, a closer revenue-stage comparable,
              trades at approximately 0.8-1.5x as an Asia-listed hardware company. Apple commands ~9.6x EV/Revenue, an
              outlier explained by high-margin services revenues and ecosystem lock-in that are far beyond Nothing's
              current mix.

              Private-market comparables suggest a premium is warranted for Nothing's growth rate. OnePlus, which
              followed a similar playbook of design differentiation and community building before being absorbed by
              BBK/Oppo, achieved scale but was ultimately taken private without a stand-alone premium exit. Humane, the
              most instructive negative comparable, raised $230M with a $750M-$1B valuation target and sold to HP for
              $116M — a 50%+ markdown — after its AI Pin product failed commercially in 2025. Oura, a smart wearable
              company with a meaningful hardware/software/subscription mix, achieved higher multiples (~$5.2B valuation
              vs. significantly lower hardware revenue) driven by recurring subscription revenues. Nothing today lacks
              recurring revenue streams.

              In the bull scenario, Nothing achieves $1.5-2B in revenue by 2027 driven by AI device launches, geographic
              expansion into the US, and CMF's India scale, justifying 3-4x forward revenue and a $4.5-8B valuation at
              IPO. In the base scenario, revenue grows to $1-1.2B by 2027 at declining growth rates, the company
              maintains 2-3x forward multiple, and an IPO occurs at $2-3.5B. In the bear scenario, AI device launches
              disappoint (as Humane and Rabbit did), growth slows to 20-30%, losses remain wide, and the company either
              flatlines at $1.3B or takes a down round, with exit below $1B. The base case supports the current entry
              price; the bear case is non-trivial given the sector's track record.
            claimRefs:
