      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Compulsory Strike-Off Notice: Governance Red Flag'
            body: >
              The March 2026 First Gazette notice for compulsory strike-off of Nothing Technology Limited— even though
              subsequently discontinued—is a material governance red flag. Such notices are issued by UK Companies House
              when a company fails to file required documents (typically annual confirmation statements or accounts on
              time). The fact that the company reached this threshold while simultaneously managing a $1.3 billion
              valuation and a $200 million Series C indicates compliance process gaps that investors should treat as a
              diligence priority. Outstanding secured charges in favor of Santander add to the concern: in a distress
              scenario, the debt-holder position ahead of equity could result in material value impairment for new
              investors.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR042
          - type: callout
            title: Serial Patent Litigation in Plaintiff-Friendly Venues
            body: >
              Nothing Technology faces at least three distinct US patent infringement suits since 2023, all originating
              from or passing through the Eastern District of Texas—a jurisdiction consistently ranked among the most
              plaintiff-friendly for non-practicing entity (NPE) claims. This pattern suggests Nothing's expanding
              device portfolio and rising brand visibility are attracting repeat NPE targeting. While the Volteon matter
              was voluntarily dismissed with prejudice, the Electronic Edison suit filed in September 2025 remains
              unresolved, and CourtListener's 15 cases / 78 docket entries suggest additional claims may follow.
              Cumulative legal costs, management distraction, and licensing demands represent an incremental cash
              outflow at a company already operating at material net losses.
            calloutType: risk
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR044
          - type: callout
            title: Nothing Chats Incident as Bellwether for Partner and Security Governance
            body: >
              The Nothing Chats episode—in which a high-visibility product built on a third-party iMessage bridge was
              pulled within 48 hours of launch after researchers exposed credential and message exposure—established a
              critical precedent: Nothing's pre-launch diligence process did not catch a partner whose core architecture
              was fundamentally insecure. The stock-photo demo-unit controversy in 2025 replicated the pattern at a
              lower severity level. Together, these incidents suggest that internal controls over partner vetting and
              product launch readiness need substantial reinforcement before the company scales into AI-native
              categories where security and data-handling failures carry regulatory and reputational consequences that
              are harder to contain.
            calloutType: insight
            claimRefs:
              - CR014
              - CR015
              - CR022
              - CR040
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Nothing's investment thesis centers on its position as the only new smartphone brand to achieve meaningful
              global scale in the past decade — reaching $500M+ in 2024 revenue with 150% YoY growth and 7 million
              cumulative units shipped. Founder Carl Pei's prior success co-founding OnePlus lends credibility, and the
              company's transparent design language and Nothing OS software have cultivated a loyal, design-conscious
              user base. The company is betting on a pivot from hardware maker to AI-native platform company, planning
              AI-focused earbuds in 2026 and smart glasses in H1 2027. With $450M raised at a $1.3B valuation,
              institutional backing from Tiger Global, GV, EQT, and strategic investors including Qualcomm Ventures, and
              a self-stated target of IPO readiness by approximately 2028, the company offers a plausible path to a
              liquidity event.

              The anti-thesis is equally compelling. Nothing operates in consumer hardware — one of the most
              capital-intensive, margin-thin, and competitively hostile sectors in technology. Its global smartphone
              market share is below 1%, with 80% of units sold in Asia. Two material trust incidents — the Nothing Chats
              privacy breach in November 2023 (all user messages and credentials publicly accessible) and the stock
              photo scandal in August 2025 (retail demo units using licensed stock images presented as user-shot camera
              samples) — have damaged brand credibility with the community it depends on. Gross margins are not
              disclosed, losses were reported to have widened per January 2025 UK Tech News reporting, and 2024 accounts
              are overdue at Companies House as of June 2026, limiting financial diligence. The AI hardware category has
              a weak track record: Humane sold its AI Pin assets to HP for $116M in February 2025 after previously
              seeking $750M-$1B, raising questions about AI hardware valuations more broadly.
            claimRefs:
              - CV039
              - CV040
              - CV041
              - CV044
              - CV033
