  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Design Language
        blocks:
          - type: paragraph
            body: >
              Nothing's product portfolio spans three distinct price tiers — flagship phones (Nothing Phone 3 at $799,
              Phone 4a Pro at $479), value CMF phones (CMF Phone 2 Pro at $299), and an audio line (Nothing Headphone
              (a) at $199, CMF Buds Pro 2 at ~$59). All hardware shares a transparent-back industrial aesthetic first
              established by the Phone (1) in 2022.

              The Nothing Phone (3), launched July 1 2025, is the brand's first self-described "true flagship." It
              introduced the Glyph Matrix — a dot-matrix monochrome micro-LED panel comprising 489 individually
              controllable micro-LEDs — replacing the linear Glyph Interface strips used on Phone (1) and Phone (2). The
              Glyph Matrix is controlled via a dedicated physical Glyph Button on the rear panel and supports custom
              notification icons, contact-specific pixelated avatars, a camera countdown timer, volume indicator, NFC
              animation, and a suite of interactive Glyph Toys (mini-games and tools). The asymmetric camera module
              placement and Glyph Matrix position deliberately create a design identity that reviewers describe as
              "immediately recognisable."

              The Phone (4a) Pro, launched March 2026, carries a 137-LED Glyph Matrix into the mid-range segment,
              confirming the matrix as Nothing's defining visual technology. The CMF Phone 2 Pro differentiates through
              a modular swappable back panel, IP54 protection, and MicroSD expansion — targeting a distinct user who
              prioritises customisation and cost over premium build. The Headphone (a) adopts Nothing's transparent
              industrial design vocabulary in over-ear form with physical roller and paddle controls, positioning it
              against Sony and Bose incumbents at a $100 premium discount.

              By June 2026, Nothing claims to have sold over seven million devices across all product lines, with India
              emerging as the primary growth market and the UK and Europe as the established home base.
