      - number: '1.3'
        title: Funding History and Investors
        blocks:
          - type: paragraph
            body: >-
              Nothing has raised approximately $456 million in total funding through seven institutional rounds and
              three community equity crowdfunding rounds since its founding in late 2020. The company's valuation
              trajectory reflects a sharp step-up from the $500M Series B valuation in March 2022 to the $1.3B unicorn
              status conferred by the September 2025 Series C—a 160% increase over three years driven by 7M devices
              shipped and a 150% revenue growth rate in 2024.

              The funding history begins with a $7M seed in December 2020, anchored by angel investors including Tony
              Fadell (iPod inventor), Kevin Lin (Twitch co-founder), Steve Huffman (Reddit CEO), and Casey Neistat. GV
              (formerly Google Ventures) led a $15M Series A in February 2021 and participated in a $50M extension in
              October 2021 alongside a strategic Qualcomm partnership. C Capital and EQT co-led the $70M Series B in
              March 2022 at a $500M post-money valuation. Highland Europe led the $96.8M Series B1 in June 2023 at a
              $600M valuation.

              The defining capital event is the September 2025 Series C: $200M led by Tiger Global, at a $1.3B
              post-money valuation, with participation from existing investors GV, Highland Europe, EQT, Latitude, I2BF,
              and Tapestry, plus new strategic backers Qualcomm Ventures and Nikhil Kamath. A December 2025 community
              equity round raised an additional $8M from approximately 13,000 investors across 80 countries. An early
              investor quoted in TechCrunch's Series C coverage described satisfaction with the company's growth
              trajectory and road to profitability, though no audited financial statements or confirmed profitability
              date have been publicly disclosed.
