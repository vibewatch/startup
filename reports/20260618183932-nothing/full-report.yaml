          - type: callout
            title: Unresolved Security Patch Delivery and CVE Exposure
            body: >
              CVE-2026-20435 (critical MediaTek boot-chain bypass, exploited in 45 seconds on CMF Phone 1) and
              CVE-2024-51440 (CVSS 7.8 NothingOS privilege escalation) represent concrete security risks where the patch
              delivery timeline to end-users is unconfirmed. MediaTek's January 2026 OEM patch distribution is a
              necessary but not sufficient step — Nothing must ship OTA updates that users install. Nothing's bi-monthly
              security patch cadence (vs. monthly for Pixel) and the absence of any public third-party security audit
              reduce enterprise buyer confidence. Until Nothing demonstrates prompt patch delivery with a monthly
              cadence and publishes security audit results, security-sensitive buyers should treat Nothing devices as
              consumer-grade only.
