      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Design-led challenger with proven demand and unicorn-scale capital
            body: >-
              Nothing has achieved what few independent consumer hardware companies have managed in the post-smartphone
              era: over 7 million devices sold, $500M+ annual revenue, and a $1.3B valuation—all without conglomerate
              backing. The combination of a recognizable design language, a community investor model, and a dual-brand
              architecture (flagship Nothing + budget CMF) gives the company structural advantages that are harder to
              replicate than a single product feature. Carl Pei's track record at OnePlus and the deep roster of
              investors including GV, Tiger Global, and Qualcomm Ventures increases the probability that AI-native
              device ambitions will receive continued capital support.
            calloutType: strength
            claimRefs:
              - CO030
              - CO031
              - CO032
              - CO045
              - CO027
          - type: callout
            title: Key-person concentration, security credibility, and unproven AI hardware ambition
            body: >-
              Three risk dimensions warrant diligence attention. First, Carl Pei's concentration as brand, strategy, and
              public-facing authority creates asymmetric key-person dependence unusual for a company of Nothing's scale.
              Second, the November 2023 Nothing Chats security incident—where user messages were sent unencrypted to a
              third-party server—remains a trust liability as Nothing moves toward deeper OS-level AI integration that
              will require users to grant broader device access. Third, the Series C explicitly funds AI-native devices
              (smart glasses, AI hardware) in a category where recent analogues (Humane's Ai Pin sold to HP; Rabbit R1
              performance failures) have underdelivered; Nothing has not yet shipped a successful AI hardware product.
            calloutType: risk
            claimRefs:
