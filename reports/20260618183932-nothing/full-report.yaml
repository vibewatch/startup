      - number: '5.2'
        title: Software Platform and Operating System
        blocks:
          - type: paragraph
            body: >
              NothingOS is Nothing's proprietary Android skin, shipping on both Nothing and CMF phones. It is positioned
              as "lightweight and bloat-free," with minimal pre-installed applications and deep customisation for
              launcher icon packs, widgets, and Glyph notification settings. The Phone (3) ships with NothingOS 3.5
              (Android 15), the Phone (4a) Pro with NothingOS 4.1 (Android 16), and the CMF Phone 2 Pro with NothingOS
              3.2 (Android 15).

              NothingOS 4.0, released in stable form for the Phone (3a) series in November 2025, introduced Essential
              Space as the flagship AI layer. Essential Space provides a dedicated side-button-triggered memory capture
              board — users can flip the phone to record voice memos, save images, set reminders, and access AI-powered
              transcription and summarisation. NothingOS 4.0 further adds an AI usage dashboard (under Settings >
              Intelligence toolkit > AI usage) for transparency around AI large-model consumption, a Playground (Alpha)
              portal for community-created Essential Apps and camera presets, and ChatGPT integration for screenshot
              analysis. Shared Widgets, Private Space, and enhanced pop-up multitasking are the other notable additions
              from the 3.x line.

              The NothingOS roadmap has accelerated meaningfully: from Android 11 on Phone (1) through Android 16 on
              Phone (4a) Pro in roughly four years. The Phone (3)'s 5-year OS update commitment (announced by co-founder
              Akis Evangelidis as the reason Snapdragon 8s Gen 4 was chosen over Snapdragon 8 Gen 3) is the strongest
              support lifecycle Nothing has offered to date, partially closing the gap with Samsung and Google. Security
              updates remain bi-monthly rather than monthly, lagging best-practice cadences.
