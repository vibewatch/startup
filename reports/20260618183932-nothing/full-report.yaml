  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              Nothing occupies two product verticals—premium mid-range smartphones (Phone series, CMF sub-brand) and TWS
              audio (Ear series)—where it competes against Apple, Samsung, Google, OnePlus, Xiaomi, Sony, and Bose. In
              smartphones, the global market contracted 2.9% YoY in Q1 2026 to 293.8 million units as memory supply
              constraints pushed average selling prices to a historical high of $465, per IDC data. Samsung (21.2%
              share) and Apple (21.0%) were the only top-5 vendors to grow; Xiaomi fell 19.1% YoY. Nothing is not among
              IDC's top-5 vendors and falls within the "Others" bucket (28.6% combined share), underscoring its
              challenger rather than incumbent status.

              Direct competitors for Nothing Phone (3) in the $700–$900 segment include Apple iPhone 16, Samsung Galaxy
              S25, and OnePlus 13. Adjacent competitors include Google Pixel 10 (AI camera focus), the OnePlus 15R ($700
              upper-midrange), and the Samsung Galaxy S25 FE ($600). In Nothing's own portfolio, the Phone (4a) (~$480)
              competes with Pixel 10a ($500) and OnePlus Nord series in the mid-range bracket. CMF Phone 2 Pro (~$279)
              faces Realme Narzo 80 Pro, Poco X7, and Samsung Galaxy A26 5G in the budget tier. In audio, Apple AirPods
              Pro 3, Samsung Galaxy Buds 4 Pro, and Sony WF-1000XM6 represent the dominant competitive forces Nothing
              Ear must overcome. Internal build (DIY from flagship brands) and status-quo non-consumption (using
