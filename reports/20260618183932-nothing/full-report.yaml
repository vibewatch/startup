  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Scope
        blocks:
          - type: paragraph
            body: >-
              Nothing's relevant market sits at the intersection of two distinct hardware categories: consumer
              smartphones and true wireless stereo (TWS) earbuds. The smartphone boundary relevant to Nothing spans the
              mid-range ($200–$599) and premium ($600+) tiers where the company's Phone lineup and CMF devices compete.
              Budget feature phones, carrier infrastructure, and operator services are excluded. The TWS earbuds
              boundary covers wireless in-ear consumer audio accessories and does not include wired earphones, over-ear
              cans, or medically classified hearing aids.


              The premium smartphone segment represented 25% of global smartphone revenue in 2024, growing faster than
              the overall market at roughly 6% CAGR. Grand View Research estimates the full smartphone market at $520.45
              billion in 2024, growing to $651.82 billion by 2030 at a 3.9% CAGR. The TWS earbuds segment adds a
              separate $64.7 billion opportunity growing at approximately 15% annually.


              Nothing's adjacency strategy extends this boundary further: the CMF brand targets an even broader base
              with sub-$250 devices in India, and the company's 2027 roadmap includes AI-native smart glasses that would
              open wearables as a third product category. Status-quo substitutes include flagship Samsung and Apple
              handsets in the premium tier, and Sony and JBL earbuds in audio. The combined TAM for Nothing's current
              and pipeline addressable markets is approximately $585 billion.
