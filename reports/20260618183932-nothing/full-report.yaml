      - number: '3.2'
        title: Flagship Smartphone Competition
        blocks:
          - type: paragraph
            body: >
              Nothing Phone (3) entered the flagship tier at $799 in July 2025, directly challenging the Samsung Galaxy
              S25 (from $719) and Apple iPhone 16 ($799). The Phone (3) uses a Qualcomm Snapdragon 8s Gen 4 (4nm), which
              is one tier below Qualcomm's top-end Snapdragon 8 Elite used in the Galaxy S25 and OnePlus 13. In
              Geekbench 6 single-core benchmarks, the Galaxy S25 scores approximately 2,473 versus 2,076 for Nothing
              Phone (3), a 19% performance gap. Nothing partially offsets this with competitive hardware: a larger
              5,150mAh silicon-carbon battery with 65W fast charging, versus the Galaxy S25's 4,000mAh at 25W, and a
              triple 50MP camera system versus iPhone 16's dual setup. The Glyph Matrix (489 LEDs) provides a unique
              design identity unmatched by any top-5 vendor.

              Key disadvantages are meaningful: the Phone (3) lacks mmWave 5G (limiting Verizon compatibility in the
              US), satellite connectivity (absent vs S25 and iPhone 16), and LTPO adaptive refresh (using fixed-range
              30–120Hz LTPS vs S25's 1–120Hz LTPO). Samsung and Apple offer 7-year OS update commitments versus
              Nothing's 5-year promise, a substantive difference for the long-term-ownership buyer. OnePlus 13 with
              Hasselblad camera tuning and IP69 dual-rating also presents a differentiated premium challenger at similar
              pricing.

              A material adverse finding: in August 2025, multiple technology outlets (DPReview, Android Authority,
              9to5Google, CNBC TV18) confirmed that Nothing used professional stock photographs as authentic Phone (3)
              camera samples on in-store demo units. Nothing acknowledged the practice. This scandal undermined the
              camera narrative at launch—the credibility of Nothing's camera claims remains in question relative to
              Samsung Galaxy and Apple iPhone, whose camera sample credibility was not similarly challenged.
