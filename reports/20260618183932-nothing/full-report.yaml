          sector 0.9x median
        - Exit / do not invest further; reassess at new valuation
      - - Down round below $1.3B
        - Any new institutional round priced below $1.3B
        - Confirms overvaluation at entry; liquidation preference stack may compound losses for common
        - Exit immediately; reassess cap table impact
      - - Margin evidence shows <15% gross margin at scale
        - 2024 accounts (when filed) show gross margin below 15% on $500M+ revenue
        - Insufficient margin to fund AI R&D, retail expansion, and IPO costs simultaneously
        - Downgrade to Avoid; trajectory to profitability implausible
      - - Privacy / security regulatory action
        - >-
          Formal regulatory investigation or enforcement by FCA, ICO, or equivalent arising from Nothing Chats 2023
          breach
        - Direct litigation cost and brand damage; India DPDP Act enforcement risk; community churn
        - Monitor closely; risk that cumulative trust incidents trigger community investor revolt
      - - Key executive departure
        - Carl Pei or Akis Evangelidis departure from operating roles
        - Founder risk is acute at a design-and-brand-first company at this stage
        - Place on watchlist; seek to understand succession and investor response
    notes: >-
