      - number: '5.4'
        title: Developer Ecosystem and Glyph SDK
        blocks:
          - type: paragraph
            body: >
              Nothing's developer strategy centres on the Glyph Developer Kit (GDK), an Android AAR library enabling
              third-party apps to control the Glyph Matrix and Glyph Interface. GDK v2 (July 2025) added full
              GlyphMatrix support for the Phone (3)'s 489-LED display and reduced integration friction: as of Android 16
              (Android B), the API key requirement is removed for new apps, making entry-level integration
              friction-free. The SDK operates via a system proxy service and restricts Glyph control to foreground
              applications for privacy and stability.

              The Glyph-Developer-Kit repository on GitHub had 675 stars and 41 forks as of June 2026, an active
              trajectory for a highly device-specific SDK. Nothing's GitHub organisation (Nothing-Developer-Programme)
              has no other public repositories, indicating a narrow but focused open-source presence. A dedicated
              Playground platform launched September 2025 as an in-device discovery hub for Glyph Toys — downloadable
              mini-apps authored by community members including a Magic 8 Ball, Leveler, Spin the Bottle, and Rock Paper
              Scissors. Community-made Essential Apps (AI-powered tools) supplement the phone SDK in NothingOS 4.0. The
              developer ecosystem is nascent but growing, supported by active Nothing community forum threads and
              co-creation events.
            claimRefs:
              - CE020
              - CE021
              - CE022
              - CE023
              - CE041
      - number: '5.5'
        title: Trust, Security, and Compliance
        blocks:
          - type: paragraph
            body: >
              Nothing devices carry standard Android security infrastructure: Google Play Protect, biometric in-display
              optical fingerprint sensing, and Private Space (an isolated PIN-protected profile area introduced in
              Android 15). The Privacy Policy (updated December 30 2025) discloses collection of device identifiers
              (IMEI, MAC address), IP address, location data, usage logs, crash diagnostics, and voice data from Nothing
              Services. Data is transferred internationally as necessary for service delivery.

              The most significant publicly disclosed security event is CVE-2026-20435, a critical MediaTek boot-chain
              vulnerability affecting MediaTek-powered devices including the Nothing CMF Phone 1. Researchers from
              Ledger's Donjon team demonstrated full security bypass in 45 seconds via USB access — extracting the PIN
              code, decrypting storage, and reading cryptocurrency wallet seeds — without device interaction. MediaTek
              distributed OEM patches on January 5, 2026; the timeline for Nothing's actual user-facing update rollout
              was not publicly confirmed as of the research date. Additionally, CVE-2024-51440, a high-severity local
              privilege escalation flaw (CVSS 7.8) in NothingOS, was disclosed in February 2025.

              IP ratings: Phone (3) = IP68; Phone (4a) Pro = IP65; CMF Phone 2 Pro = IP54. NothingOS has no publicly
              listed third-party security audit, SOC 2, or equivalent certification. The NothingOS developer kit
              restricts Glyph SDK access to foreground apps and enforces a 48-hour automatic debug-mode expiry.
              Nothing's privacy policy does not describe on-device vs. cloud AI processing boundaries for Essential
              Space AI features — a transparency gap for enterprise or privacy-sensitive buyers.
            claimRefs:
