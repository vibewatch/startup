  - id: recommendation-diligence
    title: "Recommendation and Final Diligence Asks"
    body: >-
      The recommendation is Track at the current $1.3B valuation. Nothing has demonstrated genuine
      commercial traction in a notoriously difficult category: 150% revenue growth, 47% India YoY
      growth in Q1 2026, 7M units shipped, and a coherent brand narrative that has attracted a
      tier-1 investor consortium. The valuation at ~2.6x trailing 2024 revenue is defensible for a
      fast-growing consumer brand with a credible platform pivot.

      However, conviction is constrained by three structural gaps. First, gross margin and profitability
      are not disclosed; the only financial signal from public UK filings is that losses widened in
      2023, and the 2024 accounts are overdue. Thin hardware margins with widening losses at $500M
      revenue would be a red flag for an investor expecting a near-term IPO. Second, the AI device
      strategy — earbuds in 2026, glasses in 2027 — is unproven; the category has killed better-funded
      competitors (Humane) in the past 12 months. Third, CMF's spin-off as an independent India entity
      complicates the consolidated revenue picture; it is unclear whether the $1.3B valuation reflects
      the combined Nothing + CMF entity or just the parent.

      For an investor at the current valuation, the entry discipline is: limit exposure until audited
      2024 accounts are available, the AI device launch in 2026 demonstrates consumer demand, and the
      CMF spin-off valuation and structure are clarified. Thesis-break triggers that would prompt
      exit include: a formal down-round below $1.3B, the 2026 AI device launch failing to gain
      material traction within 2 quarters, evidence that gross margin is below 15%, or a formal
      regulatory or privacy enforcement action following the Nothing Chats incident.

      Exit readiness for an IPO by 2028 requires: audited revenue of $1B+, demonstrated gross margin
      improvement toward 20%+, at least one successful AI product beyond smartphones, and resolution
      of the CMF consolidation question. Carl Pei's explicit IPO-readiness statement, combined with
      the company's adoption of public-company governance disciplines, signals seriousness about the
      timeline but does not guarantee it will be achieved at a premium to the current mark.
