  - id: financing-valuation
    title: "Financing Context and Valuation"
    body: >-
      Nothing has raised $456M across seven funding rounds since its December 2020 seed. The most recent
      institutional round — a $200M Series C closed in September 2025 and led by Tiger Global — set the
      $1.3B post-money valuation. A community round opened in December 2025 raised an additional $8M at
      the same price, allowing retail investors to buy shares at institutional-equivalent pricing via
      Wefunder and Crowdcube, reinforcing the brand's community-first narrative. Total equity raised
      is approximately $450M; prior to the Series C, Nothing also closed a debt facility: UK Tech News
      reported in January 2025 that the company had raised £30M in debt financing with losses widening,
      citing UK Companies House accounts filed for 2023.

      The valuation trajectory — $500M (Series B, March 2022), $600-700M (Series B extension, 2023-24),
      $1.3B (Series C, September 2025) — implies a 2.6x step-up from Series B at a pace broadly consistent
      with the revenue growth the company has reported. At the $1.3B mark, with estimated 2024 revenue of
      ~$500M, the implied trailing EV/Revenue is approximately 2.6x. If the company reached $750-900M in
      2025 revenue (implied by its growth trajectory and the $1B cumulative sales milestone crossed
      earlier in 2025), the forward multiple at the time of the Series C closes to approximately 1.4-1.7x,
      which appears fair for a hardware business at this growth rate.

      The preference overhang is unverifiable from public documents, as the cap table is not disclosed.
      With $450M raised across multiple rounds, investors likely hold participating preferred shares with
      liquidation preferences. A typical 1x non-participating preference on the $450M raised implies no
      meaningful overhang at a $1.3B valuation; however, participating preferences or multiples would
      eat into common equity returns. UK Companies House records show the 2024 accounts are overdue and
      that a compulsory strike-off notice was issued in March 2026 — later discontinued — suggesting
      administrative or compliance friction that warrants follow-up due diligence.
