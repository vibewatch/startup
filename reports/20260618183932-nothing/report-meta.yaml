companyProfile:
  summary: >-
    Nothing is a London-headquartered consumer electronics company founded in 2020 by Carl Pei and collaborators from the OnePlus ecosystem. It sells design-led Android smartphones, wireless audio products, and CMF-branded value accessories, with software differentiation through Nothing OS and hardware branding through transparent industrial design and the Glyph interface. Public reporting indicates the company crossed $500M in 2024 revenue, exceeded $1B in cumulative sales, and reached a $1.3B post-money valuation in September 2025, but it remains a private company with thin audited disclosure and visible execution risk as it expands into AI-adjacent devices.
