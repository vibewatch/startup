  customerFocus: Design-conscious smartphone buyers, India-focused upper-midrange Android upgraders, and consumer-audio buyers seeking branded alternatives to Apple and Samsung ecosystems
  businessModel: Direct and channel-led consumer hardware sales with recurring ecosystem engagement through software support, accessories, and future multi-device platform expansion
