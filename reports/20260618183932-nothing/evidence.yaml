evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: profitability
    missingEvidence: >-
      Nothing's audited financial statements, gross margin percentage, net income or loss, and operating cash flow are
      not publicly disclosed as a private company.
    whyItMatters: >-
      Without profitability data, the capital-efficiency ratio and runway duration cannot be assessed; the $1.3B
      valuation to $500M+ revenue multiple (~2.6x trailing revenue) appears reasonable but cannot be stress-tested
      against actual margin structure.
    diligencePath: >-
      Request audited accounts from Companies House (UK filing); engage via investor data room; reference any UK annual
      return filings submitted under Companies Act 2006.
