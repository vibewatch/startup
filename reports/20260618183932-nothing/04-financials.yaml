callouts:
  - calloutType: risk
    title: UK Statutory Accounts Overdue — Corporate Governance Gap
    body: >
      Nothing Technology Limited's annual accounts for the year ending December 31, 2024 were due at Companies House by December 31, 2025 and remain unfiled as of June 18, 2026. A compulsory strike-off notice was issued March 10, 2026 (then discontinued March 18, 2026), likely triggered by the overdue filing. The last filed accounts (year to December 31, 2023) were submitted only in January 2025. Three registered debt charges dating from December 18, 2024 indicate drawn credit lines whose terms, covenants, and counterparties are undisclosed. Combined, these administrative and governance signals introduce meaningful diligence risk: the most recent financial year is entirely opaque to external parties. Any capital-allocation decision should require audited FY2024 and FY2025 accounts as a condition precedent.
    claimRefs:
      - CI017
      - CI018
      - CI019

  - calloutType: risk
    title: Hardware Revenue Quality — No Recurring Component, Thin Margins
    body: >
      Nothing's revenue model is entirely transactional hardware sales. There is no subscription revenue, platform fee, or recurring payment stream. Consumer hardware gross margins are structurally below software peers; hardware companies at comparable scale operate in the 25–40% range. Nothing's path to profitability therefore depends on significant volume scale, mix shift toward higher-ASP products (Phone 3 / Phone 4a Pro), audio accessory attach rates, and eventual software or AI-service monetization — none of which is yet funded by a recurring revenue base. The CMF spinoff in September 2025 may have transferred the highest-volume, lowest-margin segment to a separate entity, which could improve consolidated margins but also reduces total revenue in the Nothing Technology Limited UK entity. Until a filed P&L is available, this remains speculative.
    claimRefs:
      - CI003
      - CI013
      - CI012
      - CI032

