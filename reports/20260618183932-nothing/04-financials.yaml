  - id: capital-structure
    title: Capital Structure and Runway
    body: >
      Nothing Technology has raised over $450M in total external financing since its December 2020 founding, including the $200M Series C closed in September 2025 at a $1.3B post-money valuation led by Tiger Global. A supplementary $8M community equity crowdfunding round closed in December 2025, extending the capital base marginally. Strategic participation from Qualcomm Ventures and Nikhil Kamath alongside institutional backers GV (Google Ventures), Highland Europe, EQT, Latitude, I2BF, and Tapestry strengthens ecosystem partnerships and signals broad investor conviction.

      The prior round — $96.8M in June 2023 at a $600M valuation — valued the business at approximately 8x revenue at the time. The current $1.3B valuation at a significantly higher revenue base implies compression in the revenue multiple to roughly 2–3x (using the $500M 2024 revenue figure as a proxy for forward bookings), positioning the company at a meaningful discount to pure-software peers but consistent with premium consumer hardware comparables.

      Three debt charges registered at Companies House on December 18, 2024 (charge registration numbers 129845640001, 129845640002, 129845640003) indicate Nothing has drawn on a credit facility or project-finance arrangement. The exact counterparty, principal amount, and covenants are not publicly disclosed, but the contemporaneous timing with the Series C capital deployment period suggests these may be related to inventory or manufacturing lines of credit. Nothing's annual accounts for the year ending December 31, 2024 were due at Companies House by December 31, 2025 but had not been filed as of the run date (June 18, 2026); accounts for the year ending December 31, 2023 were filed in January 2025. A Gazette notice for compulsory strike-off was issued on March 10, 2026 and discontinued on March 18, 2026, likely triggered by the overdue filing. These UK governance signals are material: they limit the ability of external analysts to verify revenue quality, margin trajectory, and leverage ratios for the most recent operating year.
