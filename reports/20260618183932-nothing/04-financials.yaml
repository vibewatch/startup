  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: gross-margin
      missingEvidence: Audited or management-account gross margin figures by product line (smartphones vs audio vs accessories), together with COGS breakdown and contribution margin per SKU.
      whyItMatters: Without margin data it is impossible to assess whether Nothing's hardware business can reach sustainable profitability at current or projected scale; the entire financial underwriting hinges on this figure.
      diligencePath: Request data-room access to audited statutory accounts for FY2024 and FY2025, or management accounts showing gross profit by SKU segment; cross-check against filed Companies House accounts when FY2024 filing occurs.
      relatedQuestionRefs: [QI007]

    - type: private-evidence-only
      severity: blocking
      topic: cash-burn-runway
      missingEvidence: Verified monthly cash burn rate, opening and closing cash balances by quarter post-Series C close (Sep 2025), and remaining runway as of June 2026.
      whyItMatters: Without verified cash position and burn rate, runway estimates are speculation; an investor cannot assess whether Nothing will require a Series D before reaching break-even or whether the company faces a near-term liquidity event.
      diligencePath: CFO bridge letter or treasurer's certificate with quarterly cash-flow summary; review bank statements or auditor confirmation; request board-approved budget with burn-rate assumptions.
      relatedQuestionRefs: [QI008]

    - type: private-evidence-only
      severity: material
      topic: CMF-consolidated-financials
      missingEvidence: Consolidated group financial statements incorporating CMF India entity following the September 2025 spinoff; intercompany transfer pricing policy; revenue and margin attributable to CMF versus Nothing-branded products.
      whyItMatters: The CMF spinoff may have moved the highest-volume, lowest-margin revenue stream into a separate entity not consolidated in Nothing Technology Limited UK accounts; the true financial picture of the group depends on knowing the consolidated scope.
      diligencePath: Request consolidated group accounts or a management-prepared consolidation memo; review intercompany agreements and pricing between the UK entity and CMF India.
      relatedQuestionRefs: [QI016, QI026]

    - type: stale
      severity: material
      topic: revenue-filing-2024
      missingEvidence: Statutory accounts for the year ending December 31, 2024 filed at UK Companies House; these are legally required and overdue, preventing any independent verification of 2024 revenue or 2025 opening balance sheet.
      whyItMatters: The most recent period for which company-claimed revenue (~$500M+ 2024) exists is entirely unaudited and publicly unverifiable; investors relying on these numbers have no independent corroboration.
      diligencePath: Monitor Companies House for the FY2024 filing (overdue as of June 2026); pressure company for certified management accounts as interim alternative; confirm auditor engagement and timeline.
      relatedQuestionRefs: [QI002, QI023]

