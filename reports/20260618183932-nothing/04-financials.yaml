company:
  name: Nothing

chapter:
  number: 4
  title: Financials
  summary: >
    Nothing Technology is a fast-growing consumer electronics company that crossed $500M in 2024 annual revenue with 150% year-on-year growth, having surpassed $1B in cumulative sales by early 2025. Its revenue is almost entirely hardware-driven across a tiered product portfolio spanning premium smartphones (Phone 3 at $799, Phone 4a Pro at $499), over-ear headphones ($199–$299), and CMF sub-brand audio at $49–$69. Series C proceeds of $200M (Sep 2025, Tiger Global-led at $1.3B valuation) extend runway for AI-native hardware development, but gross margin, EBITDA, and unit-level economics remain private. Three debt charges registered at Companies House in December 2024 and overdue 2024 statutory accounts introduce additional corporate governance risk.

sections:
  - id: revenue-model
    title: Revenue Model and Pricing Architecture
    body: >
      Nothing's revenue is derived almost entirely from direct and retail hardware device sales across three product families: smartphones (Nothing-branded flagship and mid-range), audio (earbuds and over-ear headphones under both Nothing and CMF brands), and wearables (CMF smartwatches). The company operates a two-tier brand architecture: the flagship Nothing line targets premium and upper-mid-range price points (Phone 3 at $799, Phone 4a Pro at $499 in the US), while the CMF sub-brand — which was spun off as a standalone India-headquartered company in September 2025 — targets the budget segment with products priced between $25 and $69 for audio and $149–$199 for phones. Revenue from accessories (cases, chargers, ear cushions) exists but is not disclosed separately.

      Nothing's pricing model is purely transactional hardware sales; there is no subscription, SaaS, or platform-fee layer as of the run date. However, Nothing OS — built on Android — and the Nothing X companion app represent the software layer through which Nothing could theoretically monetize AI services in future product cycles. Carl Pei has publicly articulated a strategic ambition to convert the hardware distribution platform into an AI-native operating system with personalization and context-aware features, funded by the Series C proceeds. This represents a potential future monetization wedge, but is not a current revenue stream.

      Nothing's geographic revenue base is heavily Asia-concentrated: approximately 80% of unit shipments occur in Asia, with India as the single largest market and 2% smartphone market share (up from a lower base). Germany and the UK are secondary markets for smartphones; the US leads in audio gear sales. The US received its first Nothing smartphone for general distribution (Phone 3, July 2025) and the Phone 4a Pro in March 2026, suggesting a gradual but deliberate push into the highest-ASP market globally. India retail presence expanded from 2,000 to 7,000 stores, reflecting deepened offline distribution.
