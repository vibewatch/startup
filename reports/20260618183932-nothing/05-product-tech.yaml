  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: patent-IP-protection
      missingEvidence: "No filed patent data or proprietary IP registration records for the Glyph Matrix design, transparent back, or LED controller technology are publicly accessible from patent databases (USPTO, EPO) for Nothing Technology."
      whyItMatters: "Without patent protection, Nothing's most visible differentiators (Glyph Matrix micro-LED array, transparent back) are replicable by better-resourced OEMs; competitive moat relies primarily on brand and community, not IP."
      diligencePath: "Request Nothing's patent portfolio list in due diligence; search USPTO, EPO, and WIPO patent databases for 'Nothing Technology Limited'; check UK Intellectual Property Office filings."
      relatedQuestionRefs: [QE020]

    - type: missing-source
      severity: material
      topic: security-audit-compliance
      missingEvidence: "No public third-party security audit report, SOC 2 attestation, Common Criteria evaluation, or equivalent enterprise security certification for NothingOS or Nothing hardware is available."
      whyItMatters: "Without a third-party security audit, the scope and remediation status of CVE-2026-20435 and CVE-2024-51440 for end-users cannot be independently verified; enterprise deployment is materially harder to justify."
      diligencePath: "Request Nothing's security audit history and CVE remediation status documentation under NDA; check BIS (India Bureau of Indian Standards) and FCC filings for device-level compliance records."
      relatedQuestionRefs: [QE023]

    - type: private-evidence-only
      severity: minor
      topic: AI-processing-transparency
      missingEvidence: "Nothing's published Privacy Policy and NothingOS documentation do not specify which Essential Space AI features run on-device vs. cloud, or which cloud AI providers are engaged."
      whyItMatters: "Privacy-conscious users and enterprise buyers cannot assess data residency or cloud dependency risks for AI features (transcription, summarisation, screenshot analysis) without this information."
      diligencePath: "Review Nothing's detailed privacy disclosures and data processing addenda; verify whether Essential Space AI uses on-device ML (e.g., Android ML Kit) or calls external APIs (e.g., Google, OpenAI)."
      relatedQuestionRefs: [QE008]

    - type: missing-source
      severity: minor
      topic: flagship-phone-assembler
      missingEvidence: "The contract manufacturer(s) responsible for assembling the Nothing Phone (3) flagship — as distinct from the Phone (3a) series assembled by BYD India — are not publicly disclosed."
      whyItMatters: "Supply chain concentration, quality control, and geopolitical risk assessment for the flagship product line require knowing the assembly partner."
      diligencePath: "Review Nothing's supply chain disclosures, EICC/RBA audit reports, or request manufacturer list in due diligence; check product import records (US CBP or Indian customs data) for manufacturer identifiers."
      relatedQuestionRefs: [QE024]

