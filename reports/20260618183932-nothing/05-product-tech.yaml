callouts:
  - calloutType: strength
    title: "Glyph Matrix as a Defensible Design Moat"
    body: >
      The Glyph Matrix (489 LEDs, Phone 3) represents a rare hardware differentiator in commodity Android
      smartphones. By pairing a programmable secondary micro-LED display with an open SDK and community
      Playground distribution, Nothing has created a platform flywheel: each new Glyph Toy increases the
      perceived value of owning a Nothing phone, while the GDK (675 GitHub stars, growing) deepens developer
      investment. No mass-market Android OEM — Samsung, OnePlus, Google — offers a comparable programmable
      rear display with an open developer ecosystem. This differentiation is difficult to replicate quickly
      because it requires tight hardware-software co-design and a community-seeding investment.
    claimRefs: [CE003, CE020, CE021, CE022, CE038, CE039, CE040]

  - calloutType: risk
    title: "Unresolved Security Patch Delivery and CVE Exposure"
    body: >
      CVE-2026-20435 (critical MediaTek boot-chain bypass, exploited in 45 seconds on CMF Phone 1) and
      CVE-2024-51440 (CVSS 7.8 NothingOS privilege escalation) represent concrete security risks where the
      patch delivery timeline to end-users is unconfirmed. MediaTek's January 2026 OEM patch distribution
      is a necessary but not sufficient step — Nothing must ship OTA updates that users install. Nothing's
      bi-monthly security patch cadence (vs. monthly for Pixel) and the absence of any public third-party
      security audit reduce enterprise buyer confidence. Until Nothing demonstrates prompt patch delivery with
      a monthly cadence and publishes security audit results, security-sensitive buyers should treat Nothing
      devices as consumer-grade only.
    claimRefs: [CE027, CE028, CE029, CE030]

