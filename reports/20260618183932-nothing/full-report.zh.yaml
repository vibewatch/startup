      - number: '3.2'
        title: 旗舰智能手机竞争
        blocks:
          - type: paragraph
            body: >
              Nothing Phone (3) 于 2025 年 7 月以 $799 进入旗舰价位，直接挑战 Samsung Galaxy S25（$719 起）和 Apple iPhone 16（$799）。Phone
              (3) 采用 Qualcomm Snapdragon 8s Gen 4（4nm），比 Galaxy S25 和 OnePlus 13 使用的 Qualcomm 顶级 Snapdragon 8 Elite
              低一档。Geekbench 6 单核基准中，Galaxy S25 约 2,473 分，Nothing Phone (3) 为 2,076 分，性能差距 19%。Nothing 用有竞争力的硬件部分抵消：更大的
              5,150mAh 硅碳电池和 65W 快充，对比 Galaxy S25 的 4,000mAh、25W；以及三颗 50MP 相机，对比 iPhone 16 的双摄。Glyph Matrix（489 个
              LED）提供前五大厂商都没有的独特设计身份。

              关键劣势也很实在：Phone (3) 缺少 mmWave 5G（限制其在美国与 Verizon 的兼容性）、卫星连接（相对 S25 和 iPhone 16 缺席）和 LTPO 自适应刷新（使用固定范围
              30–120Hz LTPS，而 S25 为 1–120Hz LTPO）。Samsung 和 Apple 提供 7 年 OS 更新承诺，Nothing 承诺 5 年；对长期持有买方来说，这是实质差异。OnePlus
              13 凭 Hasselblad 相机调校和 IP69 双评级，也在类似价格上构成差异化高端挑战者。

              一项实质性负面发现：2025 年 8 月，多家科技媒体（DPReview、Android Authority、9to5Google、CNBC TV18）确认，Nothing 在店内演示机上把专业图库照片展示为
              Phone (3) 真实相机样张。Nothing 承认了这一做法。这场风波削弱了发布期的相机叙事；相较 Samsung Galaxy 和 Apple
              iPhone，后两者的相机样张可信度未受到类似挑战，Nothing 相机主张的可信度仍存疑。
