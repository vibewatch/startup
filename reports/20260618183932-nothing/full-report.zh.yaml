      - number: '1.4'
        title: 里程碑历史与负面事件
        blocks:
          - type: paragraph
            body: >-
              从 2020 年 10 月到 2026 年中，Nothing 的时间线覆盖了连续六年的产品发布、融资事件、地域扩张，以及少量但实质性的负面事件。公司起步时是一家尚无明确产品的硬件创业公司，2021 年 1 月收购
              Essential Products 品牌和 IP，2021 年 2 月与瑞典设计公司 Teenage Engineering 合作，确立美学方向。ear (1) 耳机于 2021 年 7
              月发布，前两个月销量超过 100,000 台；在公司还没交付手机前，设计驱动论已被验证。

              随后产品进入年度旗舰周期：2022 年 7 月 Phone (1)、2023 年 7 月 Phone (2)、2025 年 3 月 Phone (3a)、2025 年 7 月 Phone
              (3)。每一代都在价格、配置和分销覆盖上上探。CMF by Nothing 子品牌从 2023 年 9 月起向下扩展产品组合；CMF Phone 1 在 2024 年 7 月发布时三小时售出 100,000
              台，确认预算价位需求强劲。

              两起负面事件需要尽调关注。2023 年 11 月，安全研究人员发现，Nothing Chats 这款与 Sunbird 合作、用于在 Android 上启用 iMessage
              的应用，会把未加密的用户消息和媒体传输到第三方服务器；Nothing 在 24 小时内将其从 Google Play 下架。2025 年 8 月，Nothing 因在 Phone (3)
              零售演示机上使用图库照片而非真实相机样张受到公开批评。2025 年，美国德州东区还出现两起专利主张实体（PAE）诉讼：Volteon LLC（2025 年 1 月，运动感知专利，2025 年 9
              月带既判力驳回）和 Electronic Edison Transmission Technologies（2025 年 9 月，针对 Phone 3 的无线充电专利，2026 年 2
              月不妨碍再诉自愿撤诉）。两案均未进入实质性裁判。在印度，Nothing 和 CMF 在 2026 年 2 月 Bengaluru 门店开业前创下新的销售纪录；截至 2025
              年中，公司称其在最大市场印度的智能手机市场份额约为 2%。
