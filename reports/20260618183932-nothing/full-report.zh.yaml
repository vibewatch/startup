      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: AI 硬件执行风险是最大估值驱动因素
            body: >-
              Nothing 的 $1.3B 估值，以及通往 $3-8B IPO 的路径，几乎完全押在 AI-native 设备转向能够拿到商业牵引。行业先例令人警醒：由前 Apple 资深人士创办的 Humane 融资
              $230M、估值一度在 $750M-$1B 之间，但 AI Pin 失败后，于 2025 年 2 月以 $116M 将资产出售给 HP。Rabbit 的 R1 上市后同样挣扎。Nothing 尚未出货
              AI-native 产品；它已在智能手机 OS 中宣布 AI 功能（Essential Search、Playground、AI dictation），但迈向独立 AI
              设备——耳塞或眼镜——执行门槛明显更高。对当前估值进入的投资者而言，高于 2.6 倍过去 12 个月收入倍数的每一美元溢价，都是押在这次执行上的期权。如果失败，公司会回到 0.9-1.5 倍硬件倍数，意味着估值
              $450M-$750M——较当前 $1.3B 估值折价 40-65%。
            calloutType: risk
            claimRefs:
              - CV037
              - CV024
              - CV025
              - CV043
          - type: callout
            title: 印度集中度同时是强项与脆弱点
            body: >-
              Nothing 在印度连续五个季度（2025 年第一季度至 2026 年第一季度，47-156% 同比增长）成为增长最快品牌，是支撑 $1.3B 估值的主要商业验证。2024 年，印度约占 Nothing
              智能手机收入的 75%。这种集中度既是公司最大的近端资产，也是最重要的中期风险。Counterpoint Research 称，印度整体智能手机市场在 2026 年第一季度同比下滑
              3%，为六年来最弱季度。印度市场若持续下行、卢比兑美元贬值，或 Samsung、Vivo 以类似 Nothing 的设计差异化反击，都可能实质损害增长。同时，CMF 拆分和 $100M Optiemus JV
              建立了印度制造和出口基地；如果成功，未来 3-5 年它可能为全球扩张提供资金并降低集中度风险。
            calloutType: insight
            claimRefs:
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
              - CV029
          - type: callout
            title: 估值假设 Nothing + CMF 合并实体
            body: >-
              $1.3B Series C 估值确定于 2025 年 9 月，时间上紧邻 CMF 于 2025 年 9 月末拆分为印度独立子公司之前。Series C term sheet
              公开信息没有说明，公司定义是合并口径（包括 CMF），还是仅母公司 Nothing 实体。如果 $1.3B 估值排除了 CMF India——后者在 2025 年贡献了显著且不断增长的出货份额——剩余母公司的有效
              EV/Revenue 倍数会明显更高。这是当前价格下任何买入决定前都应解决的一阶尽调问题。
            calloutType: assumption
            claimRefs:
              - CV001
              - CV006
              - CV029
              - CV021
