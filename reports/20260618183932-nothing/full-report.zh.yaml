      - number: '1.5'
        title: 图表
        blocks:
          - type: callout
            title: 设计驱动的挑战者，需求已验证，资本达到独角兽规模
            body: >-
              Nothing 做到了后智能手机时代少数独立消费硬件公司才做到的事：设备销量超过 7M 台，年收入 $500M+，估值 $1.3B，而且没有集团背书。可识别的设计语言、社区投资者模式和双品牌架构（旗舰
              Nothing + 预算 CMF）叠加，给公司带来比单一产品功能更难复制的结构性优势。Carl Pei 在 OnePlus 的履历，以及 GV、Tiger Global、Qualcomm Ventures
              等深厚投资人阵容，提高了 AI 原生设备野心继续获得资本支持的概率。
            calloutType: strength
