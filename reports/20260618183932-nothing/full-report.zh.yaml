      - number: '4.2'
        title: 单位经济与成本结构
        blocks:
          - type: paragraph
            body: >
              Nothing 的成本结构是典型的轻资本硬件品牌：产品设计和软件开发留在内部，制造完全外包给中国和印度的合同工厂。相较 Samsung
              等垂直整合竞争对手，这种做法降低资本开支和库存风险；但利润率改善取决于销量规模、供应链杠杆和 ASP 管理，而不是内部制造效率。Sacra 将其毛利率描述为「与硬件公司一致」，对这一规模的消费电子品牌通常意味着
              25–40% 区间；不过，公司没有提交或披露官方利润率，任何第三方估算仍未经验证。

              SKU 层面的单位经济完全未披露。获客成本、单设备贡献毛利、生命周期价值和回本周期均未知；约束来自 Nothing
              是私营公司，在新加坡（母实体可能注册地）没有公开申报义务，且英国法定账目逾期。硬件业务缺少复购经济性（LTV 通常较低），因此主要经济驱动是销售时点毛利，加上音频配件的生态附加率。独立报道显示，Nothing
              截至 2025 年初约有 600 名员工；Series C 阶段员工增长会抬高固定成本基础，但具体消耗率数据不可得。

              CMF 拆分（印度实体）以尚不透明的方式改变合并报表：此前贡献给 Nothing Technology Limited 英国申报的音频和智能手表收入，现在可能流经单独实体。这让仅凭公开数据重建合并财务变得更复杂。
