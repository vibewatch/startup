  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资主线与反向主线
        blocks:
          - type: paragraph
            body: >-
              Nothing 的投资主线，是它作为过去十年唯一实现有意义全球规模的新智能手机品牌，已经在 2024 年达到 $500M+ 收入、150% 同比增长和 700 万台累计出货。创始人 Carl Pei 曾联合创办
              OnePlus，给公司增添可信度；透明设计语言和 Nothing OS 软件也培养了一批忠诚、重视设计的用户。公司正押注从硬件制造商转向 AI-native 平台公司，计划在 2026 年推出 AI 耳塞，并在
              2027 年上半年推出智能眼镜。公司累计融资 $450M、估值 $1.3B，获得 Tiger Global、GV、EQT 以及 Qualcomm Ventures 等战略投资者支持，并自称目标是在约 2028
              年具备 IPO 准备度，因此存在一条可信的流动性事件路径。

              反向主线同样有力。Nothing 所处的消费硬件，是科技行业资本最密集、毛利最薄、竞争最恶劣的板块之一。其全球智能手机份额低于 1%，80% 出货在亚洲。两起重大信任事件——2023 年 11 月 Nothing
              Chats 隐私漏洞（所有用户消息和凭据可被公开访问）以及 2025 年 8 月库存照片丑闻（零售演示机把授权图库图片呈现为用户拍摄样张）——已经伤害其依赖的社区品牌信誉。公司未披露毛利率；据 2025 年 1
              月 UK Tech News 报道，亏损扩大；截至 2026 年 6 月，2024 年账目在 Companies House 逾期，限制了财务尽调。AI 硬件品类过往记录较弱：Humane 在 2025 年 2
              月以 $116M 将 AI Pin 资产出售给 HP，此前曾寻求 $750M-$1B 估值，这让更广泛的 AI 硬件估值受到质疑。
