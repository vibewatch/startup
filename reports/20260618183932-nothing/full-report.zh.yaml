      - number: '8.4'
        title: 建议与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              建议是在当前 $1.3B 估值下跟踪。Nothing 已在一个出了名困难的品类里证明真实商业牵引：150% 收入增长、2026 年第一季度印度同比增长 47%、700
              万台出货，以及吸引一线投资者联盟的连贯品牌叙事。按 2024 年过去 12 个月收入约 2.6 倍计算，该估值对一个快速增长、且具备可信平台转向叙事的消费品牌而言可以辩护。

              但 conviction 受三项结构性缺口限制。第一，毛利率和盈利能力未披露；公开 UK 文件中唯一财务信号是 2023 年亏损扩大，2024 年账目逾期。若 $500M
              收入规模下硬件毛利薄且亏损扩大，对期待近期 IPO 的投资者是红旗。第二，AI 设备策略——2026 年耳塞、2027 年眼镜——尚未被证明；过去 12
              个月里，这个品类已经让资金更充足的竞争者（Humane）失败。第三，CMF 拆分为独立印度实体，使合并收入图景更复杂；目前不清楚 $1.3B 估值反映的是 Nothing + CMF 合并实体，还是仅母公司。

              对当前估值下的投资者，进入纪律是：在经审计 2024 年账目可得、2026 年 AI 设备发布证明消费者需求、CMF 拆分估值和结构厘清之前，控制敞口。触发退出的投资主线破裂信号包括：正式 down-round
              低于 $1.3B、2026 年 AI 设备发布后 2 个季度内未获得实质牵引、证据显示毛利率低于 15%，或 Nothing Chats 事件后出现正式监管或隐私执法行动。

              到 2028 年具备 IPO 退出准备度，需要满足：经审计收入 $1B+、毛利率朝 20%+ 明显改善、至少一个智能手机之外的 AI 产品成功，以及 CMF 合并问题解决。Carl Pei 明确提到 IPO
              准备度，加上公司开始采用上市公司治理纪律，显示其认真对待时间线，但不保证能以高于当前估值的溢价实现。
            claimRefs:
