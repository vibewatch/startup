      - number: '5.3'
        title: 硬件架构与制造
        blocks:
          - type: paragraph
            body: >
              Phone (3) 的硬件架构以 Qualcomm Snapdragon 8s Gen 4（4nm）为核心——八核 CPU（1×3.21 GHz Cortex-X4、6×Cortex-A720 变体）搭配
              Adreno 825 GPU。这个选择体现了明确的成本 / 性能取舍：8s Gen 4 能提供多年 Qualcomm 芯片支持，支撑 5 年 OS 承诺，同时 BOM 低于 Snapdragon 8
              Elite。内存采用 LPDDR5X（最高 16 GB），存储为 UFS 4.0（最高 512 GB），连接能力包括 Wi-Fi 7 和 Bluetooth 6.0。5,150 mAh 硅碳电池（印度版本为
              5,500 mAh）支持 65 W 有线和 15 W 无线充电。正面 Gorilla Glass 7i、背面 Gorilla Glass Victus 加铝合金中框，达到
              IP68——这是该品牌首次获得完整浸没等级。Phone 重 218 g、厚 9 mm，评测者指出它比部分竞品更重、更厚。

              中端产品线上，CMF Phone 2 Pro 采用 MediaTek Dimensity 7300 Pro（4nm）和 Mali-G615 GPU，配 8 GB RAM，主打有竞争力的性价比。Phone (4a)
              Pro 则上探到 Qualcomm Snapdragon 7 Gen 4，配 IP65 和 144 Hz AMOLED，以 $479 覆盖中高端。

              Phone (3a) 系列由 BYD India 在 Chennai 工厂制造。Nothing 正在探索与印度本土 Electronics Manufacturing Services 伙伴成立 ₹1,000
              crore（约 $120 million）合资公司，把印度打造成全球出口枢纽；任命联合创始人 Akis Evangelidis
              出任印度总裁，也强化了这一步。供应链集中在印度合同制造，一方面缓释地缘政治风险（降低中国敞口），另一方面带来执行风险（爬坡能力、质量控制和人才厚度）。
