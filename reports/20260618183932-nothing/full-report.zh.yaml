      - number: '5.7'
        title: 图表
        blocks:
          - type: callout
            title: Glyph Matrix 是可防守的设计护城河
            body: >
              Glyph Matrix（489 颗 LED，Phone 3）是在同质化 Android 智能手机里罕见的硬件差异点。Nothing 把可编程副 micro-LED 显示、开放 SDK 和社区
              Playground 分发配在一起，做出了一个平台飞轮：每新增一个 Glyph Toy，拥有 Nothing 手机的感知价值就提高一分；GDK（675 个 GitHub
              star，仍在增长）也加深开发者投入。没有一个大众 Android
              OEM——Samsung、OnePlus、Google——提供可比的可编程背部显示和开放开发者生态。这个差异化很难快速复制，因为它需要紧密的软硬件协同设计，也需要前期播种社区的投入。
