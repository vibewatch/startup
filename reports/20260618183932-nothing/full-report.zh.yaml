            body: >
              Nothing 的收入模式完全是交易型硬件销售。没有订阅收入、平台费或经常性付款流。消费硬件毛利率在结构上低于软件同行；同等规模硬件公司通常处于 25–40% 区间。因此，Nothing
              的盈利路径取决于显著销量规模、产品组合转向更高 ASP 产品（Phone 3 / Phone 4a Pro）、音频配件附加率，以及最终的软件或 AI 服务变现；这些都尚未由经常性收入基础支撑。2025 年 9 月
