      - number: '6.5'
        title: 扩张、集中度与渠道风险
        blocks:
          - type: paragraph
            body: >-
              Nothing 的地域集中度是重大风险：印度主导智能手机收入和增长，德国 /
              英国是第二梯队市场。前三大市场贡献了绝大部分智能手机销量。这让公司容易受到印度特定竞争格局（Xiaomi、realme、OnePlus）、PLI 制造计划监管变化，或单一市场放缓的影响。Nothing Phone
              (3) 于 2025 年在美国上市（官方支持 AT&T 和 T-Mobile）以及 Phone (4a) Pro 于 2026
              年推出，对分散风险具有战略意义；但美国主要运营商没有以分期付款计划销售该设备，限制了主流覆盖和销量。

              渠道集中风险被部分缓释：印度零售到 2025 年底扩至 10,000 家门店，Bengaluru 旗舰店（2026 年 2 月）开业，纽约和东京门店也已宣布。但 Nothing 印度销售仍高度依赖线上渠道，以及
              Flipkart / Amazon India 电商生态，线下份额仍在成熟。

              CMF 子品牌拆分（TechCrunch，2025 年 9 月：CMF 将成为在印度注册的独立实体，并与 Optiemus 成立 $100M 合资公司）引入了 CMF
              客户组合和制造集中风险。如果印度制造合资公司出现中断，贡献印度大部分销量的 CMF 生产会面临风险。Nothing 联合创始人 Akis Evangelidis
              承认，美国对印度出口的关税不确定性是一个考虑因素，但表示不会改变计划。

              从产品分层看，中端 Phone「a」系列（$379）和预算 CMF 档（$199–$279）贡献了大部分出货量，而 $799 的旗舰 Phone (3) 被形容为商业上「not a
              hit」。这形成结构性挑战：收入和获客主体来自低 ASP 设备，存在毛利压缩风险；高端段表现低于预期。向更高 ASP 的复购扩张尚未被证明。
