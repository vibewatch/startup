      - number: '7.5'
        title: 人员、执行与竞争风险
        blocks:
          - type: paragraph
            body: >
              Nothing 的治理高度集中在 Carl Pei 身上。UK Companies House 登记显示，他是唯一对公司具有重大影响或控制权的 person with significant control。董事
              Timothy Bruce Warren Holbrow 于 2025 年 10 月辞任，这是 2023
              年以来第二位董事离职，使高管基础相对偏小，也强化了对创始人的关键人物依赖。这种创始人集中度对早期硬件公司很典型，但如果 Carl Pei 的参与发生实质变化，会带来继任、投资者信心和内部治理风险。

              从执行看，Nothing 宣布扩张到 AI-native 设备——智能眼镜、AI 耳塞和 2026 年 AI 软件平台——需要同时具备光学、传感器、语音 AI
              和云基础设施能力，而公司尚未公开证明这些能力。2025 年库存照片争议和 Nothing Chats 事件共同显示出一种模式：营销野心跑在内部控制之前。竞争压力尖锐：$799 的 Nothing Phone 3
              要与 Samsung Galaxy S-series 和 Pixel 9 设备竞争，而后者生态集成和服务网络明显更强。9to5Google 称 Phone 3 是「2025
              年最两极分化的手机」，并指出其上市时点与 Samsung 竞争周期错位。Trusted Reviews 认为该设备不是旗舰杀手，理由是更便宜手机拥有更强处理器。IDC 数据显示 Nothing
              不在全球前五大智能手机厂商之列，强化了其在一个销量驱动行业边缘竞争的事实。
