      - number: '4.4'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >
              Nothing 的财务画像，是一家已达到商业规模的高增长消费硬件创业公司（2024 年收入 $500M+，同比增长 150%），但盈利端几乎完全不透明。如果公司维持增长轨迹，并成功转向利润率更高的产品或软件 /
              AI 服务，$1.3B 估值可由前瞻增长支撑。不过，2024 年经审计账目缺失、存在未披露债务押记、以及 CMF 拆分，都会显著降低尽调信心。

              按机构标准看，收入质量偏低：主导指标是设备销售收入，毛利率像硬件，没有经常性收入组成。Nothing 的正面信号——投资人认可「盈利路径」、向高 ASP 的美国市场做地域多元化、以及 AI
              原生平台策略——有吸引力，但公开数据验证不足。公司 2025 年 8 月 Phone 3 演示机图库照片争议，虽然运营层面较小，却暴露出治理和流程控制缺口，需要在尽调中审视。

              核心尽调阻断项包括：（1）没有 2024 或 2025 年经审计账目；（2）信贷额度条款未披露；（3）没有单 SKU 利润率披露；（4）CMF 拆分后合并范围含糊；（5）没有经验证的 ARR、NRR 或客户层面
              cohort 数据。在这些事项通过资料室披露解决前，本财务章节对利润率可持续性，以及 Series C 跑道之后的资本充足性，信心为中低。
