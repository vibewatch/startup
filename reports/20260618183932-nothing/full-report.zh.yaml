  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >-
              Nothing 的相关市场位于两个硬件品类的交叉处：消费智能手机和真无线立体声（TWS）耳机。与 Nothing 有关的智能手机边界，覆盖其 Phone 系列和 CMF
              设备参与竞争的中端（$200–$599）与高端（$600+）价位。预算功能机、运营商基础设施和运营商服务不在范围内。TWS 耳机边界覆盖无线入耳式消费音频配件，不包括有线耳机、头戴式耳机或按医疗器械分类的助听器。


              2024 年，高端智能手机板块占全球智能手机收入 25%，增速快于整体市场，CAGR 约 6%。Grand View Research 估计，2024 年整个智能手机市场规模为 $520.45B，到 2030
              年将以 3.9% CAGR 增至 $651.82B。TWS 耳机板块另提供 $64.7B 机会，年增速约 15%。


              Nothing 的邻近扩张策略进一步拉宽边界：CMF 品牌在印度以 $250 以下设备触达更广泛人群；公司 2027 年路线图包括 AI
              原生智能眼镜，可能把可穿戴设备打开为第三个产品品类。现状替代品包括高端价位的 Samsung 和 Apple 旗舰手机，以及音频领域的 Sony 和 JBL 耳机。Nothing 当前和管线可触达市场合计 TAM
              约为 $585B。
