  - id: FV001
    title: 建议逻辑流
    type: flow
    layout: standard
    summary: 从关键证据点和风险出发，推导出在 $1.3B 估值下给予 Track 建议的证据链。
    data:
      nodes:
        - id: growth
          label: 2024 年收入增长 150% + 印度 2026 年 Q1 增长 47%
        - id: brand
          label: 设计驱动品牌 + 700 万部 + 社区忠诚度
        - id: funding
          label: $1.3B Series C（Tiger Global、GV、Qualcomm Ventures 参与）
        - id: multiples
          label: 过去 EV/Revenue 2.6x，对比行业中位数 0.9x
        - id: ai_risk
          label: AI 硬件风险（Humane $116M 退出；Rabbit 失败）
        - id: finance_gap
          label: 无经审计财务；亏损扩大；账目逾期
        - id: trust
          label: Nothing Chats 泄露 + 库存照片争议
        - id: upside
          label: 牛市情景：到 2028 年 $4.5-8B IPO（AI 平台溢价）
        - id: downside
          label: 熊市情景：$1.0-1.5B 持平至下行轮（硬件倍数）
        - id: recommendation
          label: TRACK：升级前监控 AI 发布 + 2024 年账目
    approximationNotes: 流程图是概念性的；节点权重反映作者判断，不是量化评分模型。
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV043
  - id: FV002
    title: 收入与倍数下的估值敏感性
    type: bar
    layout: wide
    summary: 在不同收入情景和 EV/Revenue 倍数下测算 Nothing 的隐含估值，并与当前 $1.3B 标记估值对比。
    data:
      items:
        - label: 行业中位数（0.9x × $500M 收入）
          value: 450
        - label: Xiaomi 对等（1.2x × $500M 收入）
          value: 600
        - label: 当前标记估值（$1.3B Series C）
          value: 1300
        - label: 基准 2025E（2.0x × $750M 收入）
          value: 1500
        - label: 基准 2027E（2.5x × $1.2B 收入）
          value: 3000
        - label: 牛市 2027E（3.5x × $2.0B 收入）
          value: 7000
        - label: 熊市 2027E（1.5x × $800M 收入）
          value: 1200
    approximationNotes: 2025E 和 2027E 收入数字为作者根据已发布增长率得出的估算。倍数参照 Samsung、Xiaomi 和 NYU Stern 行业数据校准。数值单位为百万美元。
    claimRefs:
      - CV026
      - CV028
      - CV022
  - id: FV003
    title: 分情景估值 / 回报区间
    type: range
    layout: standard
    summary: 在熊市、基准和牛市假设下，Nothing IPO（约 2028 年）时的低 / 中 / 高退出估值区间。
    data:
      items:
        - label: 熊市情景退出（约 2028-2029 年）
          low: 800
          high: 1500
          point: 1200
        - label: 基准情景 IPO（约 2028 年）
          low: 2000
          high: 4500
          point: 3000
        - label: 牛市情景 IPO（约 2027-2028 年）
          low: 4500
          high: 10000
          point: 7000
        - label: 当前 Series C 标记估值（2026 年 6 月）
          low: 1300
          high: 1300
          point: 1300
    approximationNotes: 所有数字单位均为百万美元。区间上下限代表作者基于可比公司退出和收入增长假设作出的概率估算，不构成财务预测。
    claimRefs:
      - CV046
      - CV041
      - CV042
      - CV043
  - id: FV004
    title: 投资 KPI 计分卡
    type: kpi
    layout: standard
    summary: 面向投委会的七维度评分：市场、商业验证、护城河、经济性、风险、估值和证据质量。
    data:
      items:
        - label: 市场机会
          value: 7
          unit: /10
          note: 全球智能手机 + AI 可穿戴 TAM 很大；仅印度就超过 $50B；AI 硬件上行空间可观
        - label: 商业验证
          value: 7
          unit: /10
          note: 2024 年收入增长 150%；收入超过 $500M；印度 2026 年 Q1 增长 47%；IDC 口径连续 5 个季度增长最快品牌
        - label: 竞争护城河
          value: 5
          unit: /10
          note: 设计差异化真实存在但可复制；软件护城河仍早期；未看到硬件 IP 防御性
        - label: 单位经济性
          value: 4
          unit: /10
          note: 毛利率未披露；2023 年账目显示亏损扩大；硬件优先模式通常 10-20% GM；无经常性收入
        - label: 风险画像
          value: 5
          unit: /10
          note: 多起信任事件；AI 硬件品类风险；印度集中度；账目逾期；除名通知
        - label: 估值吸引力
          value: 6
          unit: /10
          note: 过去收入 2.6x 高于行业（0.9x），但低于高增长软件；若利润率改善，以其增长率看尚属合理
        - label: 证据质量
          value: 5
          unit: /10
          note: 无经审计 2024 年账目；股权结构未披露；毛利率未公开；CMF 合并口径不清
    approximationNotes: 分数是作者基于截至 runDate 所收集证据，按 1-10 分作出的判断，不是标准化投资评分框架。
    claimRefs:
      - CV036
      - CV010
      - CV017
      - CV047
