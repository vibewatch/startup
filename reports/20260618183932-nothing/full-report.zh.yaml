      - number: '6.2'
        title: 采用轨迹与市场牵引
        blocks:
          - type: paragraph
            body: >-
              Nothing 从小基数跑出了显著增长速度。到 2025 年初，公司跨所有产品品类（手机和配件）累计出货超过 700 万台；2024 年收入同比翻倍，超过 $500 million。生命周期销售额在 2025
              年初越过 $1 billion。Bloomberg 的 Mark Gurman 直接引用 Nothing 投资者披露报道了这些数字。

              在印度，截至 2025 年第二季度，Nothing 已连续六个季度成为增长最快的智能手机品牌。Counterpoint Research 记录，2025 年第二季度出货量同比增长 146%，由 CMF Phone
              2 Pro 发布和零售扩张驱动。Canalys（现为 Omdia 一部分）另称同期同比增长 229%，归因于设计驱动创新触达年轻城市消费者，以及 CMF Phone 2 Pro、Phone 3a 和 3a Pro
              贡献销量。全球 Counterpoint 全年 2025 年数据显示，Nothing 全球同比增长 31%；Omdia 的 Jetstream 报告则给出 86% 同比增速，为 2025 年其追踪品牌中最高。

              尽管增速很高，绝对规模仍有限：Nothing 全球智能手机市场份额低于 1%，在印度 Nothing 加 CMF 的合计份额到 2025 年第二季度约为 1.4–2%。公司约有 600
              名员工，制造主要在中国和印度。仅印度一地，2025 年第二季度智能手机出货超过 100 万台。到 2025 年底，Nothing 在印度达到 10,000 个零售触点，年初为 2,000 个。
