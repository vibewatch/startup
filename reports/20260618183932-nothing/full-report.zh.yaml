  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Nothing 占据两个产品垂直：高端中端智能手机（Phone 系列、CMF 子品牌）和 TWS 音频（Ear 系列），竞争对手包括
              Apple、Samsung、Google、OnePlus、Xiaomi、Sony 和 Bose。智能手机方面，IDC 数据显示，2026 年 Q1 全球市场同比收缩 2.9% 至 293.8M
              台，内存供应约束把平均售价推到 $465 的历史高位。Samsung（21.2% 份额）和 Apple（21.0%）是前五大厂商中唯二增长者；Xiaomi 同比下降 19.1%。Nothing 未进入 IDC
              前五大厂商，落在「Others」桶内（合计 28.6% 份额），凸显其挑战者而非在位者地位。

              在 $700–$900 区间，Nothing Phone (3) 的直接竞争对手包括 Apple iPhone 16、Samsung Galaxy S25 和 OnePlus 13。邻近竞争对手包括 Google
              Pixel 10（AI 相机重点）、OnePlus 15R（$700 中高端）和 Samsung Galaxy S25 FE（$600）。Nothing 自有组合中，Phone (4a)（约
              $480）在中端价位对标 Pixel 10a（$500）和 OnePlus Nord 系列。CMF Phone 2 Pro（约 $279）在预算价位面对 Realme Narzo 80 Pro、Poco X7 和
              Samsung Galaxy A26 5G。音频方面，Apple AirPods Pro 3、Samsung Galaxy Buds 4 Pro 和 Sony WF-1000XM6 是 Nothing Ear
              必须跨过的主导竞争力量。2026 年受约束的市场环境里，内部自建（从旗舰品牌 DIY）和维持现状的不消费（因 ASP 上升而更久使用现有旧手机）也是额外替代品。
