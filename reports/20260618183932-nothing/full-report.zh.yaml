      - number: '7.3'
        title: 财务与资本风险
        blocks:
          - type: paragraph
            body: >
              Nothing 的财务画像是亏损快速扩大、在债务和股权融资前现金极薄，以及硬件公司经济性造成对持续外部资本的结构性依赖。UKTN 基于 Companies House 文件的报道显示，Nothing 在
              FY2023 录得 £59.4 million 净亏损——同比增加 60%——而收入只增长 12.1%，至约 £50 million。2023 年末现金约 £1.4 million，较 2022 年下降
              70%，使公司运营连续性依赖 2024 年 12 月从 Santander 获得的 £30 million 债务融资。该债务融资以公司资产作抵押，意味着 covenant
              违约或收入不及预期可能触发还款义务提前到期，顺位在股权结构之前。

              2025 年 9 月的 Series C（Tiger Global 领投，Qualcomm Ventures 参与，$200 million、估值 $1.3 billion）提供了有意义的
              runway，但也意味着公司必须证明硬件盈利路径，或证明被重估的软件 / AI 收入模型，才能在后续轮次支撑该估值。FY2023
              收入增长落后于亏损增长，说明规模尚未带来毛利改善——对一家需要持续芯片采购、合同制造和分销支出的资本密集型硬件公司而言，这是红旗。IDC 市场数据显示，2025 年全球智能手机增速预测为 1.5%，且组件短缺在
              2026 年可能不成比例地推高小型 OEM 的投入成本。
            claimRefs:
              - CR003
