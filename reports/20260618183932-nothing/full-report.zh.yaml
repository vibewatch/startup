  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与分群
        blocks:
          - type: paragraph
            body: >-
              Nothing 直接面向个人消费者（B2C）销售，硬件分三条线：旗舰 Nothing Phone（$700–$800）、中端 Nothing Phone「a」系列（$379–$459），以及预算价位的子品牌
              CMF by Nothing（$199–$279）。消费者基础主要由年龄（Gen-Z 和年轻千禧一代）、对独特设计审美的兴趣，以及愿意比同质化 Android 设备支付小幅溢价来界定。Carl Pei
              将目标用户概括为「下一代——对科技、创意和设计感兴趣的人」。

              从地域看，印度是 Nothing 最大且增长最快的智能手机市场，其后是德国和英国。音频产品（耳塞、耳机）在美国领先，其后是英国、德国和日本。美国过去智能手机供应有限（多数机型只通过 Beta Program），但
              Nothing Phone (3) 于 2025 年中上市时完整支持 AT&T 和 T-Mobile，标志着正式进军美国智能手机市场的开始。印度分销在 2025 年从 2,000 家门店扩到 10,000
              家门店，并已包括一家 Bengaluru 旗舰店（2026 年 2 月开业）。

              CMF 子品牌瞄准收入更低、价格更敏感的消费者群体，在印度和东南亚尤其占主导。CMF Phone 2 Pro（$279）对标 Xiaomi、Realme 和 Motorola
              的预算机型。品牌身份围绕模块化、大胆配色和价值感，而不是 Nothing 主线的高端透明后盖审美。印度是 CMF 全球总部所在地，CMF 制造基地主要通过 Optiemus 合资公司落在印度。
