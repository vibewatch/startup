      - number: '2.3'
        title: 买方分层与动态
        blocks:
          - type: paragraph
            body: >-
              Nothing 的买方地图覆盖五个清晰分层，每一层的预算负责人、采用触发点和产品匹配度都不同。核心人群是重视设计的城市爱好者，通常 18–35 岁、懂技术，愿意为一台区别于 Samsung / Apple
              主流双寡头的手机支付 $400–$800。这类买方把 Glyph Interface、透明美学和 Nothing OS 视为生活方式信号，自然承接 $799 的 Phone 3。


              第二个、也是增长最快的分层，是印度大众富裕升级用户：有消费愿望的城市消费者，购买第一台 $200–$400 区间的高端 Android 设备。Nothing 2024 年在印度增长
              577%，并连续六个季度成为增长最快品牌，验证了该人群的接受度。CMF Phone 以 $250 以下定价直接服务这组用户。


              西方音频发烧友分层推动美国、英国、德国和日本的 TWS 收入；在这些市场，Nothing 音频产品靠设计和性价比对抗 Sony、JBL 和 Apple AirPods。CMF
              服务的预算价值型买方在新兴市场对应极高销量，但 ASP 更低。早期企业 / SMB 分层尚处萌芽，探索 Android 替代方案的企业 IT 团队可能会看重 Phone 3 的高端配置。


              Samsung 和 Apple 主导全球高端价位；在 Nothing 所处价格带，OnePlus、Motorola 和 Google Pixel 是最直接可比的 Android 替代品牌。欧洲出货量前五为
              Samsung（46.4M 台）、Apple、Xiaomi（22.2M）、Motorola（+26%）和 OPPO。Nothing 尚未进入任何单一欧洲市场前五，但在德国和英国均在增长。
