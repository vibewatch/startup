      - number: '4.3'
        title: 资本结构与跑道
        blocks:
          - type: paragraph
            body: >
              Nothing Technology 自 2020 年 12 月成立以来，外部融资总额超过 $450M，其中包括 2025 年 9 月完成、由 Tiger Global 领投的 $200M Series
              C，投后估值 $1.3B。2025 年 12 月，公司又完成补充性的 $8M 社区股权众筹，小幅扩充资本基础。Qualcomm Ventures 和 Nikhil Kamath 的战略参与，加上
              GV（Google Ventures）、Highland Europe、EQT、Latitude、I2BF 和 Tapestry 等机构支持方，强化了生态伙伴关系，也传递出广泛的投资人信心。

              上一轮融资是 2023 年 6 月的 $96.8M，估值 $600M，当时约为收入的 8x。当前 $1.3B 估值建立在显著更高的收入基础上，意味着收入倍数压缩至约 2–3x（以 2024 年 $500M
              收入作为前瞻订单代理），公司相对纯软件同行有明显折价，但与高端消费硬件可比公司一致。

              2024 年 12 月 18 日在 Companies House 登记的三项债务押记（押记登记号 129845640001、129845640002、129845640003）显示，Nothing
              已动用信贷额度或项目融资安排。确切交易对手、本金金额和契约未公开披露，但其时间点与 Series C 资本部署期同步，说明这些安排可能与库存或制造信贷额度有关。Nothing 截至 2024 年 12 月 31
              日年度账目本应在 2025 年 12 月 31 日前提交 Companies House，但截至运行日（2026 年 6 月 18 日）仍未提交；截至 2023 年 12 月 31 日年度账目于 2025 年 1
              月提交。Gazette 于 2026 年 3 月 10 日发出强制除名通知，并在 2026 年 3 月 18
              日终止，很可能由逾期申报触发。这些英国治理信号很重要：它们限制外部分析师核验最近运营年度收入质量、利润率轨迹和杠杆率的能力。
