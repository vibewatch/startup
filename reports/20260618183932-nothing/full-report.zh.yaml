      - number: '5.4'
        title: 开发者生态与 Glyph SDK
        blocks:
          - type: paragraph
            body: >
              Nothing 的开发者策略围绕 Glyph Developer Kit（GDK）展开。GDK 是一个 Android AAR 库，让第三方应用可以控制 Glyph Matrix 和 Glyph
              Interface。GDK v2（2025 年 7 月）为 Phone (3) 的 489 颗 LED 显示加入完整 GlyphMatrix 支持，并降低集成摩擦：从 Android 16（Android
              B）起，新应用不再需要 API key，入门集成基本零摩擦。SDK 依托系统代理服务运行，并把 Glyph 控制限制在前台应用，以保障隐私和稳定性。

              截至 2026 年 6 月，Glyph-Developer-Kit 在 GitHub 上有 675 个 star、41 个 fork；对一个高度绑定特定设备的 SDK 而言，增长轨迹算活跃。Nothing 的
              GitHub 组织（Nothing-Developer-Programme）没有其他公开仓库，说明其开源存在面窄但聚焦。2025 年 9 月上线的专门 Playground 平台，成为设备内发现 Glyph
              Toys 的入口——这些可下载小应用由社区成员创作，包括 Magic 8 Ball、Leveler、Spin the Bottle 和 Rock Paper Scissors。社区制作的 Essential
              Apps（AI 工具）在 NothingOS 4.0 中补充了手机 SDK。开发者生态仍早期，但在活跃的 Nothing 社区论坛帖子和共创活动支撑下继续增长。
            claimRefs:
              - CE020
              - CE021
              - CE022
              - CE023
              - CE041
      - number: '5.5'
        title: 信任、安全与合规
        blocks:
          - type: paragraph
            body: >
              Nothing 设备搭载标准 Android 安全基础设施：Google Play Protect、屏下光学指纹识别，以及 Private Space（Android 15 引入的隔离 PIN
              保护资料区）。隐私政策（2025 年 12 月 30 日更新）披露，公司会收集设备标识符（IMEI、MAC address）、IP 地址、位置数据、使用日志、崩溃诊断，以及来自 Nothing Services
              的语音数据。为交付服务，数据会按需跨境传输。

              公开披露的最重要安全事件是 CVE-2026-20435，这是一个影响 MediaTek 设备的关键级 MediaTek 启动链漏洞，受影响设备包括 Nothing CMF Phone 1。Ledger
              Donjon 团队研究人员展示，攻击者只需 USB 访问、无需设备交互，就能在 45 秒内完全绕过安全机制——提取 PIN code、解密存储并读取加密货币钱包 seed。MediaTek 于 2026 年 1
              月 5 日向 OEM 分发补丁；截至研究日期，Nothing 面向用户的实际更新推出时间线尚未公开确认。此外，NothingOS 中一个高严重性本地提权漏洞 CVE-2024-51440（CVSS 7.8）于
              2025 年 2 月披露。

              IP 等级：Phone (3) = IP68；Phone (4a) Pro = IP65；CMF Phone 2 Pro = IP54。NothingOS 没有公开列出的第三方安全审计、SOC 2
              或同等认证。NothingOS 开发者工具包把 Glyph SDK 访问限制在前台应用，并强制 debug 模式 48 小时后自动过期。Nothing 的隐私政策没有说明 Essential Space AI
              功能在端侧与云端处理之间的边界——这对企业买家或隐私敏感买家是一个透明度缺口。
