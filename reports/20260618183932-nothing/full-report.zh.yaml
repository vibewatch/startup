            title: 关键人物集中、安全可信度和未经验证的 AI 硬件野心
            body: >-
              三个风险维度需要尽调关注。第一，Carl Pei 同时承载品牌、战略和面向公众的权威，形成不对称的关键人物依赖；以 Nothing 的规模看，这并不常见。第二，2023 年 11 月 Nothing Chats
              安全事件——用户消息未加密发送至第三方服务器——仍是信任负债；Nothing 若推进更深的 OS 级 AI 集成，用户需要授予更广泛的设备访问权限。第三，Series C 明确为 AI 原生设备（智能眼镜、AI
              硬件）提供资金，但该品类近期类比案例表现不佳（Humane 的 Ai Pin 出售给 HP；Rabbit R1 表现失败）；Nothing 尚未交付成功的 AI 硬件产品。
