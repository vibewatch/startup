      - number: '6.3'
        title: 具名客户证明与评测质量
        blocks:
          - type: paragraph
            body: >-
              Nothing 的客户证明基础主要由独立科技记者的产品评测，以及 GSMArena 等发烧友平台上的已验证用户评测构成。鉴于消费电子商业模式，正式 B2C
              案例研究或具名企业客户并不存在。公司运营社区投资计划，吸引了具名复投投资者和忠实用户。

              专业评测者普遍认可 Nothing Phone 3a 在 $379 价位上的突出价值。TrustedReviews 称其「价值惊艳」，9to5Google 的 Ben Schoon 认为它在 3a 系列中明显胜过
              $459 的 Pro 版本。GSMArena 专业评测强调其「扬声器非常响亮、软件设计独特、整体相机表现出色」，且没有热降频。TechAdvisor
              称赞电池续航和干净的软件。这些都是独立、保持距离的第三方评测者，基于零售级设备实际使用给出的评价。

              对 CMF 子品牌，Gadgets360 对 CMF Phone 1 的专业评测认为它「性价比极佳」，并称其电池续航长（循环测试 25 小时 20 分钟）。Android Authority 评测 $279 的
              CMF Phone 2 Pro 时称其「漂亮、前瞻，远比低价所暗示的更好」，并在低于 $300 价位提供主摄、超广角和长焦相机。

              GSMArena 用户评测显示自然满意度信号。一名从 Samsung Galaxy S22 换到 CMF Phone 1 的用户写道，使用一年后对显示和电池感到「印象深刻」。另一名购买 CMF Phone 1
              的用户称对性能「极其满意」，AnTuTu 分数超过 864k，并称显示和多媒体体验「一流」。Nothing 社区论坛托管了 CMF 手机的已验证买家评测，对 OS 顺滑度和性价比的情绪持续正面。

              客户证明中的负面信号：Android Authority 社论《我喜欢 Nothing 的 Android 手机，但越来越难信任它们》列举四个具体侵蚀信任的事件——Nothing Chats
              安全漏洞（应用因隐私违规，发布后 48 小时内下架）、Phone 1 上的 NFT gallery、2022 年社区邮件数据泄露，以及 Nothing Phone 3 相机样张争议。9to5Google 对
              Nothing Phone 3 的年终评测称该设备「显然不算成功」且「两极分化」，主要负面因素是过度宣传和 $799 定价。
