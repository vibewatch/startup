      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Carl Pei 担任 Nothing 创始人兼 CEO，公司的品牌、投资人关系、产品愿景和公开叙事仍高度集中在他个人身上。据媒体报道，Pei 在一次内部权力斗争后于 2020 年 10 月离开
              OnePlus，随后创立 Nothing；他的设计驱动论，来自十年间把 OnePlus 做成知名挑战者品牌的经验。关键人物依赖是实质性的：产品战略、招聘决策和融资叙事，都直接经由 Pei 的公开沟通流出。

              2026 年初，Pei 确认任命奢侈时尚品牌 Loewe 前首席营销官 Charlie Smith 出任 Nothing
              新任首席品牌官。公司越过核心科技爱好者人群继续放量时，这一任命显示其有意转向主流消费者定位。Nothing 在伦敦 King's Cross 区启用新的全球总部，办公楼此前由 Heatherwick Studio
              使用，目标 2026 年 Q1 入驻。2026 年 2 月 14 日，Bengaluru 旗舰店开业，这是公司在其最主要智能手机市场印度的首家零售门店。

              截至 2026 年初，Nothing 全球约有 3,200 名员工，除伦敦外，在亚洲也有重要布局。公司治理结构仍完全私有，未披露独立董事会构成、审计委员会或正式治理文件。Nothing 连续三次在
              Crowdcube 进行股权众筹，建立了一个不同寻常的社区投资者基础：约 13,000 名个人股东，分布在 80 个国家。这给一家如此规模的私营消费硬件公司增加了少见的利益相关者维度。截至 2026 年 6
              月，公开报道未显示重大高管离职或治理纠纷。
