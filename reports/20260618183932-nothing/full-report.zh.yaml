      - number: '7.4'
        title: 伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >
              Nothing 的商业模式把关键依赖集中在少数外部交易对手上，每一层冗余都有限。旗舰 Nothing Phone 3 唯一芯片供应商是 Qualcomm Snapdragon 8s Gen 4；任何影响
              Qualcomm 服务中国或印度合同制造商能力的供应约束、涨价或美国出口许可变化，都会让公司收入最高的 SKU 停产。CMF 子品牌设备依赖与 MediaTek 共同开发的 MediaTek Dimensity
              7200 Pro，为价值产品线形成另一类同样集中的芯片依赖。Sacra 报告称，所有制造都外包给中国和印度的合同工厂，公司没有自有生产能力——这种轻资产模式降低资本开支，但把质量控制和交期风险转嫁给第三方。

              在美国市场，Nothing 上市时的运营商支持仅限 T-Mobile 和 AT&T，Verizon 兼容性未确认。PCMag 指出，Phone 2a
              在美国运营商测试中移动性能慢于预期，且需要通过开发者计划购买流程，限制了主流可触达市场。对 Santander 债务融资的财务依赖（2024 年 12 月登记三项未结清押记），以及持续依赖 Tiger
              Global、GV、EQT 和 Qualcomm Ventures 等股权投资者，意味着公司资本获取暴露在消费硬件融资环境中，而该环境历来波动较大。Qualcomm Ventures
              同时是芯片供应商和股权投资者，构成结构性利益冲突，值得单独披露和尽调。
