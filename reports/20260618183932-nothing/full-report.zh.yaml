      - number: '5.2'
        title: 软件平台与操作系统
        blocks:
          - type: paragraph
            body: >
              NothingOS 是 Nothing 的专有 Android 皮肤，搭载于 Nothing 和 CMF 手机。它定位为「轻量、无臃肿软件」，预装应用很少，并为启动器图标包、小组件和 Glyph
              通知设置提供深度定制。Phone (3) 出厂搭载 NothingOS 3.5（Android 15），Phone (4a) Pro 搭载 NothingOS 4.1（Android 16），CMF Phone
              2 Pro 搭载 NothingOS 3.2（Android 15）。

              NothingOS 4.0 于 2025 年 11 月以稳定版发布给 Phone (3a) 系列，引入 Essential Space 作为旗舰 AI 层。Essential Space
              提供由专用侧键触发的记忆捕捉板——用户可以翻转手机录制语音备忘、保存图片、设置提醒，并使用 AI 驱动的转写和摘要。NothingOS 4.0 还新增 AI 使用仪表盘（位于 Settings >
              Intelligence toolkit > AI usage），提高 AI 大模型消耗透明度；新增 Playground（Alpha）入口，用于社区创建的 Essential Apps 和相机预设；并集成
              ChatGPT 做截图分析。Shared Widgets、Private Space 和增强弹窗多任务，是 3.x 线之外的其他重要新增功能。

              NothingOS 路线图明显加速：约四年内，从 Phone (1) 的 Android 11 推进到 Phone (4a) Pro 的 Android 16。Phone (3) 承诺 5 年 OS
              更新；联合创始人 Akis Evangelidis 称，这也是选择 Snapdragon 8s Gen 4 而非 Snapdragon 8 Gen 3 的原因。这是 Nothing
              迄今提供的最强支持生命周期，部分缩小了与 Samsung 和 Google 的差距。安全更新仍为双月，而非每月，落后于最佳实践节奏。
