        - FCA、ICO 或同等机构因 2023 年 Nothing Chats 泄露发起正式监管调查或执法
        - 直接诉讼成本和品牌损害；印度 DPDP Act 执法风险；社区流失
        - 密切监测；累计信任事件可能触发社区投资者反弹
      - - 关键高管离任
        - Carl Pei 或 Akis Evangelidis 离开运营岗位
        - 现阶段设计和品牌优先的公司，创始人风险突出
        - 放入观察名单；重点弄清接班安排和投资人反应
    notes: >-
      淘汰标准是基于章节分析提炼出的定性阈值。监测需要拿到产品出货数据（IDC / Counterpoint）、英国 Companies House 账户，以及持续的媒体报道。监管触发点专指英国 ICO（数据保护）、印度 DPDP
      Act，以及 2023 年 Nothing Chats 安全事件引发的任何跨境执法。
    claimRefs:
      - CV033
      - CV034
      - CV037
      - CV038
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计财务报表
        - Nothing 2023 年和 2024 年经审计账目（2024 年账目在 Companies House 已逾期超过 6 个月）
        - 没有审计账目，就无法判断毛利率、经营亏损、债务契约和现金跑道；UK Tech News 2025 年 1 月关于亏损扩大的报道，仅靠公开数据无法核验
        - 直接向管理层索取；通过投资人数据室取得；监测 Companies House 申报
      - - 股权结构和优先权栈
        - 完整股权结构，包括全部 $450M 融资的清算优先权、参与型与非参与型优先股、棘轮条款和反稀释条款
        - 清算优先权积压可能在 $2-3B 退出时大幅压低普通股 IRR；回报建模必须先厘清
        - 通过管理层索取；审阅股东协议；咨询律师
      - - CMF 拆分估值
        - $1.3B Series C 估值到底按合并口径还是仅母公司口径确定，以及 CMF India 拆分后如何处理
        - $1.3B 标记可能包含也可能不包含 CMF 的印度收入基底；这一含糊会显著放大或压低隐含倍数
        - 管理层确认；审阅 Series C 文件中对「company」的定义
      - - AI 路线图和产品规格
        - 2026 年 AI 耳机和 2027 年 AI 眼镜的技术与商业细节，包括单位经济、BOM 成本和目标 ASP
        - 没有产品规格和利润率，AI 设备故事只是期权；Humane 等 AI 硬件失败案例在发布前并不明显
        - 向管理层取得产品简报；审阅 Qualcomm Ventures 的战略投资理由
      - - Nothing Chats 整改
        - 正式事故复盘、来自英国 ICO 或印度 DPDP 主管机构的任何监管函件，以及已采取的整改步骤
        - 2023 年 11 月事件涉及公开可访问的用户凭据和消息；未解决的监管敞口在任何退出时都是重大负债
        - 索取 ICO 函件；审阅 DPA / 隐私合规文件
    notes: 尽调问题按重要性排序。第 1-3 项会决定能否在当前估值下形成高信心买入判断。第 4-5 项同样重要，但拿到管理层权限后可以解决。公司尚未公开经审计财务报表；这对 Series C 阶段的英国私人公司很正常，但会限制分析精度。
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV038
