        - 任何新的机构轮融资定价低于 $1.3B
        - 确认进入估值过高；清算优先权叠加可能放大普通股损失
        - 立即退出；重新评估 cap table 影响
      - - 利润率证据显示规模化后毛利率 <15%
        - 2024 年账目（提交后）显示 $500M+ 收入下毛利率低于 15%
        - 利润率不足以同时支撑 AI 研发、零售扩张和 IPO 成本
        - 下调至回避；通往盈利的轨迹不可信
