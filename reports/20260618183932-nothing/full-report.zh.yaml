      - number: '5.6'
        title: 路线图、集成与可靠性
        blocks:
          - type: paragraph
            body: >
              Nothing 的近端路线图是多线推进。音频方面，Headphone (a)（2026 年 3 月）以低于 $200 的价格切入头戴式耳机，显示公司会继续投入这个品类。新的 AI 耳塞据称在开发中，预计 2026
              年末推出。最关键的是，Nothing 已确认在开发 AI 智能眼镜，目标 2027 年上半年发布——眼镜会集成摄像头、麦克风和定向扬声器，但没有显示屏，依赖配对智能手机和云端处理 AI。CEO Carl Pei
              把这视为「fully AI-native」多设备生态策略的开局：由 AI agent 自动完成任务、减少屏幕时间，也把 Nothing 放到 Meta Ray-Ban 以及预期中的 Google /
              Samsung Android XR 设备对面。

              2026 年已确认的软件路线图包括 NothingOS 4.1（随 Phone 4a Pro 出货）和更多 Playground 内容。Phone (3) 上市时，部分 Glyph Toys（Caller
              ID、Voice Recorder 集成）是在上市后通过 2025 年 7 月和 8 月的 OTA 更新交付，说明其模式是上市当天存在缺口，再靠快速软件更新补齐。安全更新节奏仍为双月一次，慢于 Google
              Pixel 的月度节奏，在补丁窗口之间留下漏洞暴露缺口。

              可靠性信号好坏参半：可信评测社区称赞 NothingOS 的响应速度和一致性，同时指出 Phone (3) 的变焦相机在不同光线下表现不稳定，且缺少 LTPO 显示技术（导致 60 到 120 Hz
              切换时偶发卡顿）。截至 2026 年 6 月，没有 Nothing 产品出现在主要可靠性观察名单或产品召回通知中。
