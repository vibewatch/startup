  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              Nothing Technology Limited 的监管与法律状态同时带有几类清晰风险向量。结构上最重要的是，UK Companies House 于 2026 年 3 月对 Nothing
              Technology Limited（公司编号 12984564）发出的强制注销 First Gazette 通知。虽然该行动已于 2026 年 3 月 18
              日终止，但通知本身意味着合规义务出现疏漏——最常见是账目或确认声明逾期——并已升级到监管层面。Companies House 还登记了三项未结清押记，受益人为 Banco Santander（Security
              Agent），创建于 2024 年 12 月，作为 £30 million 债务融资的抵押。在任何困境情形中，这些有担保债权人的顺位都高于股权持有人。

              知识产权方面，CourtListener 返回了 15 起案件和 78 条 docket entry 提及「nothing
              technology」，说明公司已经成为美国专利诉讼中的重复被告，而不是只面对一次性索赔。最值得注意的未决案件是 Volteon LLC v. Nothing Technology Limited（E.D.
              Tex. 2:25-cv-00093），2025 年 1 月 31 日提交，针对无线充电技术。Electronic Edison Transmission Technologies LLC 于 2025 年 9
              月另行提起诉讼。Eastern District of Texas 是 non-practicing entity 偏好的起诉地点，Nothing
              在该辖区反复出现，意味着持续成本和管理层分心风险。公司作为英国数据控制者，还承担 GDPR 义务，收集 IMEI numbers、MAC
              addresses、支付数据、语音数据和设备诊断；这些字段范围一旦发生泄露或同意机制失败，会带来 UK ICO 执法风险。
