      - number: '1.3'
        title: 融资历史与投资人
        blocks:
          - type: paragraph
            body: >-
              自 2020 年底成立以来，Nothing 通过七轮机构融资和三轮社区股权众筹累计融资约 $456M。公司估值曲线陡峭上行：从 2022 年 3 月 Series B 的 $500M 估值，跃升到 2025 年
              9 月 Series C 赋予的 $1.3B 独角兽地位。三年增长 160%，背后是 7M 台设备出货和 2024 年 150% 的收入增速。

              融资历史始于 2020 年 12 月的 $7M 种子轮，核心天使包括 Tony Fadell（iPod 发明者）、Kevin Lin（Twitch 联合创始人）、Steve Huffman（Reddit
              CEO）和 Casey Neistat。GV（原 Google Ventures）在 2021 年 2 月领投 $15M Series A，并在 2021 年 10 月与 Qualcomm 战略合作一同参与
              $50M 扩展轮。C Capital 和 EQT 于 2022 年 3 月共同领投 $70M Series B，投后估值 $500M。Highland Europe 于 2023 年 6 月领投 $96.8M
              Series B1，估值 $600M。

              关键融资事件是 2025 年 9 月的 Series C：Tiger Global 领投 $200M，投后估值 $1.3B；老股东 GV、Highland
              Europe、EQT、Latitude、I2BF、Tapestry 参投，新战略支持方 Qualcomm Ventures 和 Nikhil Kamath 加入。2025 年 12 月，社区股权轮又从 80
              个国家约 13,000 名投资者处融资 $8M。TechCrunch 在 Series C 报道中引用一位早期投资人的说法，称其对公司增长轨迹和盈利路径满意；但公司没有公开披露经审计财务报表或确认的盈利日期。
