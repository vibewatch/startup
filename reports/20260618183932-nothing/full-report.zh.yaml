      - number: '7.2'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >
              Nothing 经历了一系列运营质量和安全事件，单独看或许可控，但合在一起指向系统性流程缺口。2023 年 11 月的 Nothing Chats 事件伤害最大：这款桥接 iMessage 的应用在发布约 48
              小时内就从 Google Play Store 下架，原因是安全研究人员发现底层 Sunbird 集成把用户凭据存储在第三方服务器，且加密不足，使消息和媒体面临被拦截风险。AppleInsider 和 Ars
              Technica 分别报道称，该架构「profoundly violated user privacy and security」。Nothing
              未经充分第三方安全审查就发布产品，随后在公众压力下立即下架，建立了上市前审查不足的先例。

              硬件质量也受到审视。Android Authority 报道，部分 Nothing Phone 3a 设备透过透明后盖可见灰尘和划痕——这个缺陷直接伤及 Nothing
              的标志性设计元素。软件更新可靠性是另一个反复出现的问题：Nothing OS 4.0（Android 16）在 2025 年 12 月因用户抱怨内存泄漏和稳定性倒退而暂停推送。Cybernews 研究人员测试
              Phone 3a 时发现，即便关闭数据收集开关，设备仍持续向 Google、Nothing 和 Qualcomm 发送遥测；Qualcomm MDM 通信采用弱 MD5 认证；还存在可被滥用来耗尽配额的硬编码
              AccuWeather API key。Trustpilot 基于用户评价给 Nothing 2.3/5（「Poor」），评论提到耳塞缺陷、更新后软件 bug、保修僵硬和退款摩擦。库存照片争议——Nothing
              把非设备拍摄图片展示成 Phone 3 演示机样张——进一步伤害营销可信度。Ars Technica 指出，Essential Space AI 功能默认把截图上传到远程服务器，而这个披露没有醒目告知买家。
