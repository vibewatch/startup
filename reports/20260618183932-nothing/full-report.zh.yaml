      - number: '7.6'
        title: 图表
        blocks:
          - type: callout
            title: 强制注销通知：治理红旗
            body: >
              2026 年 3 月针对 Nothing Technology Limited 的强制注销 First Gazette 通知——即便随后已终止——仍是重大治理红旗。UK Companies House
              会在公司未按时提交必需文件（通常是年度确认声明或账目）时发出这类通知。公司在管理 $1.3 billion 估值和 $200 million Series C
              的同时触及这一门槛，说明合规流程存在缺口，投资者应把它作为尽调优先事项。Santander 的未结清有担保押记加重了担忧：在困境情形中，债权人排在股权之前，可能导致新投资者承受重大价值减损。
            calloutType: risk
