    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与产品线
        blocks:
          - type: paragraph
            body: >-
              Nothing Technology Limited 是一家英国消费电子公司，总部位于英格兰伦敦，2020 年 10 月 29 日注册成立。公司由 OnePlus 前联合创始人 Carl Pei 与 Akis
              Evangelidis、David Sanmartín García、Steven Gao、Levi Li 共同创立。Nothing
              宣称的使命是消除人与技术之间的隔阂，创造无缝的数字未来：足够先进的硬件退到背景里，感觉像不存在。公司以设计优先的挑战者品牌参与竞争，刻意站到它认为定义了更广泛 Android 智能手机市场的商品化同质性对面。

              Nothing 的产品组合覆盖智能手机、无线耳机、头戴式耳机和智能手表。其智能手机运行 Nothing OS，这是公司自研的定制闭源 Android 版本。旗舰线最鲜明的美学特征，是透明或半透明背板叠加
              Glyph Interface：背板上的 LED 灯光系统可作为通知界面。Phone (1) 在 2022 年 7 月确立了这套设计语言；后续 Phone (2)、Phone (3)、Phone (4a)
              继续迭代，同时逐步上探价格带。Phone (3) 于 2025 年 7 月发布，售价 £799，引入 Glyph Matrix，即背部完整点阵 LED 显示屏。

              面向预算市场的子品牌 CMF by Nothing 于 2023 年 9 月推出，并在 2025 年 9 月拆分为一家总部位于印度的独立实体；它用手机、耳机和智能手表把组合延伸到 $300 以下价位。到 2026
              年 3 月，Nothing 以 Phone (4a) 和 Phone (4a) Pro（起售价分别为 £349 和 £499）扩展准旗舰产品线，并以 £149 推出 Headphone (a)。Bloomberg
              2026 年 3 月报道称，Nothing 计划在 2027 年上半年发布 AI 增强智能眼镜，这是公司走出现有设备形态、扩品类的第一个可信信号。
