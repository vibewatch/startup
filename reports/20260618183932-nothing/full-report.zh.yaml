      - number: '8.3'
        title: 可比公司与情景分析
        blocks:
          - type: paragraph
            body: >-
              根据 NYU Stern 2026 年 1 月数据，消费电子硬件公司的 EV/Revenue 中位数约为 0.9 倍，反映其资本密集和薄毛利。Samsung 因半导体多元化和规模，EV/Revenue 为
              2.7-4.0 倍。Xiaomi 是更接近的收入阶段可比公司，作为亚洲上市硬件公司，交易区间约为 0.8-1.5 倍。Apple 的 EV/Revenue 约为 9.6
              倍，是异常值，原因是高毛利服务收入和生态锁定，这些远超 Nothing 当前业务组合。

              私募市场可比公司显示，Nothing 的增长率应获得溢价。OnePlus 走过类似路径，靠设计差异化和社区建设起步，后被 BBK/Oppo 吸收；它实现了规模，但最终私有化，未出现独立高溢价退出。Humane
              是最有启发性的负面可比：该公司融资 $230M，目标估值 $750M-$1B，但在 AI Pin 2025 年商业失败后以 $116M 出售给 HP——估值折价超过 50%。Oura 是一家拥有有意义硬件 /
              软件 / 订阅组合的智能可穿戴公司，靠经常性订阅收入获得更高倍数（约 $5.2B 估值，而硬件收入明显更低）。Nothing 目前缺少经常性收入流。

              牛市情景下，Nothing 到 2027 年靠 AI 设备发布、美国地域扩张和 CMF 印度规模，把收入做到 $1.5-2B，支撑 3-4 倍前瞻收入和 $4.5-8B IPO 估值。基准情景下，收入到 2027
              年增至 $1-1.2B，增速下行，公司维持 2-3 倍前瞻倍数，并以 $2-3.5B 完成 IPO。熊市情景下，AI 设备发布令人失望（如 Humane 和 Rabbit），增长放缓至
              20-30%，亏损仍大，公司估值要么停在 $1.3B，要么接受 down round，退出低于 $1B。基准情景支持当前进入价格；考虑到该行业记录，熊市情景并非小概率。
