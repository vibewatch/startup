      - number: '6.4'
        title: 留存、满意度与耐用性信号
        blocks:
          - type: paragraph
            body: >-
              Nothing 未公开披露 NRR、GRR、流失率、复购率或 cohort 级留存数据。作为消费电子公司，核心留存问题是设备升级忠诚度——客户是否会购买下一代 Nothing，而不是转向
              Samsung、Apple 或中国竞争对手。公开可得信号都是间接的。

              客户满意度指标好坏参半。Nothing Phone 3a 的专业评测分数较高（TrustedReviews：相当于 8.5/10；TechAdvisor：强正面）。GSMArena 社区对 CMF Phone 1
              的评价为正面，数百名用户评分平均 4.4/5。但 nothing.tech 的 Trustpilot 评价反复抱怨客服响应慢、保修理赔困难和设备缺陷（电池衰减、更新后软件
              bug、相机镜头下进灰）。Cybernews 对 Nothing Phone 3a 的安全评测未发现关键级安全漏洞，但记录了一个暴露的 AccuWeather API key，Nothing 没有回应披露。

              软件耐用性值得担忧：多名评测者提到 Nothing OS 3.x 重大更新后的 bug，包括电池耗电激增和连接问题。Nothing Phone 3a 提供 3 年 Android OS 更新，低于 Samsung
              和 Google Pixel 提供的 4–7 年，这会限制更新敏感用户的长期留存。phandroid.com 报道称，Nothing OS 4.0 更新因用户报告 bug 而暂停，这是设备寿命的负面信号。

              Nothing 的社区投资模式（社区轮融资超过 $11.5 million）创造了一个受忠诚度激励的客户群体。但 Nothing Phone 3 反响平淡，以及 Phone 3a Lite
              锁屏广告争议之后，社区投资者情绪给核心受众带来流失风险。Carl Pei 承认，2026 年是证明产品成熟度的关键年份。
