  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >
              Nothing 的收入几乎全部来自三类硬件设备的直销和零售销售：智能手机（Nothing 品牌旗舰和中端）、音频（Nothing 和 CMF 双品牌耳机及头戴式耳机）和可穿戴设备（CMF
              智能手表）。公司采用双层品牌架构：旗舰 Nothing 线瞄准高端和中高端价位（Phone 3 售价 $799，Phone 4a Pro 在美国售价 $499），CMF 子品牌则瞄准预算市场；后者已在 2025
              年 9 月拆分为一家总部位于印度的独立公司，音频产品定价 $25–$69，手机定价 $149–$199。配件（保护壳、充电器、耳垫）有收入，但未单独披露。

              Nothing 的定价模式是纯交易型硬件销售；截至运行日，没有订阅、SaaS 或平台费层。不过，基于 Android 的 Nothing OS 和配套应用 Nothing X
              构成软件层，理论上可在未来产品周期中变现 AI 服务。Carl Pei 已公开阐述战略野心：用 Series C 资金把硬件分发平台转成具备个性化和情境感知功能的 AI
              原生操作系统。这是潜在的未来变现切口，但不是当前收入流。

              Nothing 的地域收入基础高度集中在亚洲：约 80% 出货发生在亚洲，印度是最大单一市场，智能手机市场份额为 2%（从较低基数上升）。德国和英国是智能手机次级市场；美国在音频设备销售上领先。美国在 2025
              年 7 月获得首款面向大众分销的 Nothing 智能手机 Phone 3，并在 2026 年 3 月获得 Phone 4a Pro，显示公司正渐进但有意地进入全球 ASP 最高的市场。印度零售覆盖从 2,000
              家扩至 7,000 家门店，反映线下分销加深。
