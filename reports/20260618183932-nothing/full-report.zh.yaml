      - number: '3.3'
        title: 中端组合与子品牌竞争
        blocks:
          - type: paragraph
            body: >
              旗舰价位之外，Nothing 的中端组合横跨两个价格带竞争。Phone (4a)（Snapdragon 7s Gen 4、约 $480、3.5× 潜望长焦、50W 充电）瞄准 $450–$550 价位，同场还有
              Google Pixel 10a（$500、Tensor G4、7 年更新）和 OnePlus 15R（$700、Snapdragon 8 Gen 5、7,400mAh 电池）。Android Police
              普遍将 Google Pixel 10a 评为 2026 年综合最佳中端 Android 手机，靠的是计算摄影优势和 7 年软件支持；这两项恰是 Nothing Phone (4a) 让步之处。OnePlus
              15R 在 $700 价位提供更大的原始电池容量和更快芯片组，但缺少无线充电，且只提供 4 年 OS 更新。

              CMF by Nothing（子品牌）推出的 CMF Phone 2 Pro 约 $279（Rs 18,999），具备可更换配件的模块化背板、带 2× 长焦的三摄系统和 Dimensity 7300
              Pro；这种定制化是 Realme、Poco 或 Samsung A 系列对手没有提供的。不过，CMF Phone 2 Pro 仅 IP54，而 Realme Narzo 80 Pro 为
              IP68/IP69；充电 33W，对比 Realme 的 80W，形成实质硬件劣势。Samsung Galaxy A26 5G 的 6 年 OS 更新保证大幅超过 CMF 的 3
              年承诺，带来长期价值风险。音频方面，CMF Buds 2 Plus 在 $50 以下价位与 Anker Soundcore Liberty 4 NC 和 EarFun Air Pro 4 竞争，以激进价格强调
              ANC 和续航。
