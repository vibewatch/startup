      所有数值都是根据专业评测分数、GSMArena 用户平均评分和社区论坛情绪分析推导的代理估算。Nothing 不披露队列层面的留存数据。Phone 3a 的 24 个月以上数值因时间不足为
      null。这些数字仅作示意，不应视为核心证据。
    claimRefs:
      - CU028
      - CU029
      - CU033
      - CU034
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: |
      截至 2026 年 6 月，Nothing 十大主要风险类别的发生可能性与残余严重度映射。财务依赖和 AI 扩张的综合分最高。
    data:
      columns:
        - 可能性（1=低，5=高）
        - 影响（1=低，5=高）
        - 残余严重度
        - 投资信号
      rows:
        - label: 美国连续专利诉讼
          values:
            - '3'
            - '3'
            - 中
            - 密切监控
        - label: 现金 / 融资依赖
          values:
            - '3'
            - '5'
            - 高
            - 下一轮融资若延迟就是红旗
        - label: 软件更新不稳定
          values:
            - '4'
            - '3'
            - 中高
            - 关注 NPS 和流失率
        - label: 硬件质量缺陷
          values:
            - '3'
            - '3'
            - 中
            - 跟踪保修索赔率
        - label: Nothing Chats 式安全失败
          values:
            - '2'
            - '4'
            - 中高
            - 要求发布前安全审计
        - label: 单一 Qualcomm 供应商依赖
          values:
            - '2'
            - '4'
            - 中高
            - 监控美中芯片政策
        - label: 美国运营商支持有限（无 Verizon）
          values:
            - '2'
            - '3'
            - 中
            - 关注 Verizon 兼容进展
        - label: 创始人关键人集中
          values:
            - '1'
            - '4'
            - 低中
            - 梳理继任计划
        - label: AI 产品扩张执行
          values:
            - '3'
            - '4'
            - 高
            - 尽调招聘计划和 IP 位置
        - label: 声誉性营销错误
          values:
            - '3'
            - '3'
            - 中
            - 跟踪品牌信任指标
    approximationNotes: |
      可能性和影响分数是基于截至 2026 年 6 月 18 日所收集证据的定性判断；未使用精算模型。
    claimRefs:
      - CR045
  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: |
      有向无环图展示主要运营和安全风险事件如何层层传导，最终影响 Nothing Technology 的财务结果。
    data:
      nodes:
        - id: HW_Defects
          label: 硬件质量缺陷
          group: operational
        - id: SW_Bugs
          label: 软件更新失败
          group: operational
        - id: Security_Incident
          label: 隐私 / 安全漏洞
          group: security
        - id: Mktg_Integrity
          label: 营销诚信失败
          group: reputational
        - id: Cust_Trust
          label: 客户信任受损
          group: customer
        - id: Litigation
          label: 专利诉讼成本
          group: legal
        - id: Revenue_Gap
          label: 收入不及预期
          group: financial
        - id: Cash_Burn
          label: 现金消耗加速
          group: financial
        - id: Fund_Depend
          label: 外部融资依赖
          group: financial
        - id: Val_Risk
          label: 估值压缩
          group: financial
      edges:
        - from: HW_Defects
          to: Cust_Trust
          label: 侵蚀
        - from: SW_Bugs
          to: Cust_Trust
          label: 侵蚀
        - from: Security_Incident
          to: Cust_Trust
          label: 摧毁
        - from: Mktg_Integrity
          to: Cust_Trust
          label: 削弱
        - from: Security_Incident
          to: Litigation
          label: 触发
        - from: Cust_Trust
          to: Revenue_Gap
          label: 降低销量
        - from: Litigation
          to: Cash_Burn
          label: 加速
        - from: Revenue_Gap
          to: Cash_Burn
          label: 恶化
        - from: Cash_Burn
          to: Fund_Depend
          label: 增加需求
        - from: Fund_Depend
          to: Val_Risk
          label: 稀释或阻断
    approximationNotes: null
    claimRefs:
      - CR046
  - id: FR003
    title: 依赖图
    type: dag
