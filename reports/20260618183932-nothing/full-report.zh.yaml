      - number: '8.2'
        title: 融资背景与估值
        blocks:
          - type: paragraph
            body: >-
              自 2020 年 12 月种子轮以来，Nothing 已在七轮融资中筹集 $456M。最近一轮机构融资是 2025 年 9 月完成、Tiger Global 领投的 $200M Series C，确定了
              $1.3B 投后估值。2025 年 12 月开启的社区轮又以相同价格筹集 $8M，允许散户投资者通过 Wefunder 和 Crowdcube 以等同机构的价格买入股份，强化了品牌「社区优先」叙事。股权融资总额约
              $450M；在 Series C 之前，Nothing 还完成了一笔债务融资：UK Tech News 于 2025 年 1 月报道，公司在亏损扩大的情况下筹集 £30M 债务融资，报道引用的是提交给 UK
              Companies House 的 2023 年账目。

              估值轨迹——$500M（Series B，2022 年 3 月）、$600-700M（Series B extension，2023-24）、$1.3B（Series C，2025 年 9 月）——意味着相较
              Series B 提升 2.6 倍，节奏大体符合公司报告的收入增长。以 $1.3B 估值和估计 2024 年收入约 $500M 计算，隐含过去 12 个月 EV/Revenue 约为 2.6 倍。如果公司
              2025 年收入达到 $750-900M（由其增长轨迹和 2025 年早些时候跨过 $1B 累计销售额里程碑推断），Series C 当时的前瞻倍数会收敛到约 1.4-1.7
              倍；对这个增长率的硬件公司而言，看起来公平。

              公开文件无法验证优先权悬置，因为 cap table 未披露。多轮累计融资 $450M，投资者很可能持有带清算优先权的参与型优先股。若 $450M 融资采用典型 1x 非参与型清算优先权，在 $1.3B
              估值下不会造成有意义的悬置；但参与型优先权或倍数条款会侵蚀普通股回报。UK Companies House 记录显示，2024 年账目逾期，且 2026 年 3
              月曾发出强制注销通知——之后终止——提示存在行政或合规摩擦，值得后续尽调。
