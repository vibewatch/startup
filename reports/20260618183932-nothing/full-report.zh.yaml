  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与设计语言
        blocks:
          - type: paragraph
            body: >
              Nothing 的产品组合横跨三个清晰价位层：旗舰手机（Nothing Phone 3 售价 $799、Phone 4a Pro 售价 $479）、高性价比 CMF 手机（CMF Phone 2 Pro 售价
              $299）和音频线（Nothing Headphone (a) 售价 $199、CMF Buds Pro 2 约 $59）。所有硬件都沿用 Phone (1) 于 2022 年率先确立的透明背板工业美学。

              Nothing Phone (3) 于 2025 年 7 月 1 日发布，是品牌自称的首款「真正旗舰」。它引入 Glyph Matrix——一块点阵单色 micro-LED 面板，由 489 个可单独控制的
              micro-LED 组成——替代 Phone (1) 和 Phone (2) 上的线性 Glyph Interface 灯带。Glyph Matrix 通过背板上的专用实体 Glyph Button
              控制，支持自定义通知图标、按联系人区分的像素化头像、相机倒计时、音量指示、NFC 动画，以及一组交互式 Glyph Toys（小游戏和工具）。非对称相机模组位置和 Glyph Matrix
              位置有意造出评测者所称的「一眼可识别」设计身份。

              2026 年 3 月发布的 Phone (4a) Pro 把 137-LED Glyph Matrix 带入中端市场，确认矩阵是 Nothing 的标志性视觉技术。CMF Phone 2 Pro
              靠模块化可更换背板、IP54 防护和 MicroSD 扩展做差异化，瞄准更重视定制和成本、而非高端做工的独特用户。Headphone (a) 以头戴形态采用 Nothing
              的透明工业设计词汇，配实体滚轮和拨杆控制，以低 $100 的高端折价对标 Sony 和 Bose 在位者。

              到 2026 年 6 月，Nothing 称其全产品线设备销量超过 7M 台；印度成为主要增长市场，英国和欧洲则是已建立的主场。
