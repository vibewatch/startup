      - number: '2.2'
        title: 市场规模与机会
        blocks:
          - type: paragraph
            body: >-
              Grand View Research 将 2024 年全球智能手机收入池估为 $520.45B，并预计到 2030 年以 3.9% CAGR 增至 $651.82B。高端板块——售价高于 $600
              的设备——目前约占该收入池 25%，即约 $130B，且 CAGR 快于整体市场。Mordor Intelligence 估算，2024 年 TWS 耳机市场约为 $64.7B，年增速约 15%，预计 2025
              年及以后达到 $88B。


              Nothing 的 SAM 由高端和中高端智能手机（约 $130B）叠加完整 TWS 耳机品类（$64.7B）构成，合计约 $195B。欧洲智能手机市场是 Nothing 的核心地域之一，2024 年增长 5%
              至约 130M 台，这是连续四年下滑后的首个正增长年份。印度智能手机市场 2024 年收入创历史新高，高端板块同比扩张约 15%。


              Nothing FY2024 年收入超过 $500M，同比翻倍，占智能手机和音频合计 TAM 不到 0.1%。累计设备销售额突破 $1B，并在 2025 年 9 月拿到 $1.3B Series C
              估值，显示投资人相信其 SAM 渗透率仍有实质提升空间。区间图展示由发布方支持的低 / 基准 / 高估算，用于传达第三方市场测算固有的不确定性。
