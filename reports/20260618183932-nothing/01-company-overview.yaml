  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: profitability
      missingEvidence: >-
        Nothing's audited financial statements, gross margin percentage, net income or loss, and operating cash flow
        are not publicly disclosed as a private company.
      whyItMatters: >-
        Without profitability data, the capital-efficiency ratio and runway duration cannot be assessed; the
        $1.3B valuation to $500M+ revenue multiple (~2.6x trailing revenue) appears reasonable but cannot be
        stress-tested against actual margin structure.
      diligencePath: >-
        Request audited accounts from Companies House (UK filing); engage via investor data room; reference any
        UK annual return filings submitted under Companies Act 2006.
      relatedQuestionRefs:
        - QO012

    - type: enumeration-incomplete
      severity: material
      topic: leadership and founder table
      missingEvidence: >-
        Full board of directors composition, independent directors, audit committee members, and C-suite roles beyond CEO
        and Chief Brand Officer are not publicly disclosed for Nothing Technology Limited.
      whyItMatters: >-
        Governance structure and board composition are material for assessing oversight quality, related-party
        conflict risks, and investor protections as the company approaches potential IPO at the ~$1.3B unicorn scale.
      diligencePath: >-
        Review UK Companies House filings for director register; request governance term sheet from investors;
        review board composition in any Series C term sheet or shareholder agreement.
      relatedTableRefs:
        - TO002

    - type: enumeration-incomplete
      severity: minor
      topic: stakeholder or investor map
      missingEvidence: >-
        Exact shareholding percentages, governance rights, board representation, and anti-dilution provisions for
        each institutional investor are not publicly disclosed.
      whyItMatters: >-
        Cap table structure affects downside protection, liquidation preference ordering, and drag-along rights
        that would govern any acquisition or IPO scenario.
      diligencePath: >-
        Request cap table and investor rights agreement from management; cross-reference any disclosed terms in
        community investor prospectus documents on Crowdcube.
      relatedTableRefs:
        - TO003

    - type: enumeration-incomplete
      severity: minor
      topic: milestone table
      missingEvidence: >-
        Minor product variants, regional distribution agreements, undisclosed partnerships, and internal operational
        milestones (supply chain contracts, manufacturing transitions, software platform launches) are not captured
        in public coverage.
      whyItMatters: >-
        A complete operational milestone record would improve the continuity narrative and expose any undisclosed
        setbacks, pivots, or partnership dissolutions that did not receive press attention.
      diligencePath: >-
        Review Nothing's official newsroom and UK regulatory filings; cross-reference community forum announcements
        on nothing.community; request management presentation timeline for due diligence.
      relatedTableRefs:
        - TO004

