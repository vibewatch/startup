  - id: leadership-and-governance
    title: Leadership and Governance
    body: >-
      Carl Pei serves as founder and CEO of Nothing, and the company's brand, investor relationships, product vision, and
      public narrative remain tightly concentrated in his persona. Pei left OnePlus in October 2020 after what press
      reports described as an internal power struggle, and founded Nothing with a specific design-led thesis informed
      by his decade building OnePlus into a recognized challenger brand. The key-person dependence is material: product
      strategy, hiring decisions, and capital-raise narratives have all flowed directly through Pei's public communications.

      In early 2026, Pei confirmed the appointment of Charlie Smith—formerly chief marketing officer at luxury fashion
      brand Loewe—as Nothing's new Chief Brand Officer. The move signals a deliberate push toward mainstream consumer
      positioning as the company scales past the core technology-enthusiast audience. The company operates out of a
      new global headquarters in London's King's Cross area, in a building previously occupied by Heatherwick Studio,
      with a move-in targeted for Q1 2026. A Bengaluru flagship store opened February 14, 2026, marking the company's
      first India retail location in its primary smartphone market.

      As of early 2026, Nothing has approximately 3,200 employees globally, with significant presence in Asia alongside
      London. The company's governance structure remains entirely private with no disclosed independent board composition,
      audit committee, or formal governance disclosures. Nothing has built an unusual community investor base of
      approximately 13,000 individual shareholders across 80 countries through three successive equity crowdfunding
      rounds on Crowdcube, adding a stakeholder dimension uncommon for a private consumer hardware company at its scale.
      No material executive departures or governance disputes have been publicly reported as of June 2026.
