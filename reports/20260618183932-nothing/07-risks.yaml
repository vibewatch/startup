  - id: partner-dependency-risk
    title: Partner and Dependency Risk
    body: >
      Nothing's business model concentrates critical dependencies in a small number of external
      counterparties, with limited redundancy at each tier. The flagship Nothing Phone 3 relies on
      Qualcomm Snapdragon 8s Gen 4 as its sole chipset vendor; any supply constraint, price increase,
      or US export licensing change affecting Qualcomm's ability to serve Chinese or Indian contract
      manufacturers would halt production of the company's highest-revenue SKU. The CMF sub-brand
      devices depend on MediaTek Dimensity 7200 Pro, co-developed with MediaTek, creating a separate
      but similarly concentrated chipset dependency for the value product line. Sacra reports that all
      manufacturing is outsourced to contract facilities in China and India, with no owned production
      capability—an asset-light model that reduces capital expenditure but transfers quality control and
      lead-time risk to third parties.

      In the US market, Nothing's carrier support at launch was limited to T-Mobile and AT&T, with
      Verizon compatibility unconfirmed. PCMag noted that the Phone 2a achieved slower-than-expected
      mobile performance in US carrier tests and required a developer-program purchase flow, constraining
      mainstream addressability. Financial dependency on Santander's debt facility (three outstanding
      charges registered December 2024) and ongoing equity reliance on Tiger Global, GV, EQT, and
      Qualcomm Ventures means the company's capital access is exposed to investor sentiment in a
      historically volatile consumer-hardware funding environment. Qualcomm Ventures being both a
      chipset supplier and an equity investor creates a structural conflict of interest that warrants
      separate disclosure and diligence.
    claimRefs:
      - CR011
      - CR023
      - CR024
      - CR025
      - CR028
      - CR036
