  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Nothing quarterly revenue by geography
      missingEvidence: >-
        Nothing has not publicly disclosed quarterly or geographic revenue splits for 2025–2026.
        Without this data it is impossible to verify whether India growth has sustained or
        decelerated relative to Europe and the US.
      whyItMatters: >-
        Geographic revenue concentration is a key underwriting risk; a single-market exposure
        above 50% would materially change the risk profile of the company.
      diligencePath: >-
        Request management accounts or investor-room data tables breaking out quarterly revenue
        by geography; alternatively seek analyst-day slides or investor letters that provide
        regional splits.
      relatedQuestionRefs:
        - QM018
        - QM024
      relatedTableRefs: []
    - type: missing-source
      severity: material
      topic: Nothing competitive market share Europe
      missingEvidence: >-
        No independent market-share estimate for Nothing in specific European sub-markets such
        as Germany and the UK is publicly available. Canalys top-five rankings do not include Nothing.
      whyItMatters: >-
        Without a market-share anchor in its core European markets it is difficult to assess
        whether Nothing has enough channel depth to sustain or accelerate growth there.
      diligencePath: >-
        Request Canalys or IDC custom cut for Nothing's Germany and UK shipment share; or obtain
        retail channel sell-through data from key European distributors.
      relatedQuestionRefs:
        - QM006
      relatedTableRefs: []
    - type: private-evidence-only
      severity: minor
      topic: Nothing unit economics and gross margin
      missingEvidence: >-
        Nothing's gross margin, manufacturing cost, and per-unit economics are not publicly
        disclosed in any filing reviewed. The UK holding company reports revenue of ~£50M against
        £59.4M losses but this reflects the R&D/HQ entity, not the consolidated group.
      whyItMatters: >-
        Hardware gross margin is a critical driver of long-term profitability and capital efficiency.
        Without knowing margin profiles, it is difficult to model the path to operating break-even.
      diligencePath: >-
        Request consolidated management accounts for Nothing group including device-level gross
        margin; benchmark against Sacra's note that margins are consistent with hardware peers.
      relatedQuestionRefs:
        - QM005
        - QM021
      relatedTableRefs: []
