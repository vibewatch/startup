evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: commercial-revenues-and-arr
    missingEvidence: Audited revenue disclosures, ARR run-rate figures, gross margin metrics, and customer renewal data.
    whyItMatters: >-
      Public valuation claims of $1.5B cannot be benchmarked or defended against market comparables without signed
      revenue metrics.
    diligencePath: >-
      Request signed customer contracts, trial conversion rates, and historical GAAP income statements directly from
      SpreeAI management.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: founding-date-and-domicile-signals
    missingEvidence: Clarification on operational founding timeline and primary corporate headquarters versus operational office.
    whyItMatters: >-
      SEC Form D records state 2020 incorporation in Incline Village, Nevada, while commercial marketing cites a 2023
      launch and Los Angeles headquarters.
    diligencePath: >-
      Review state corporate registry filings and request lease/operating location confirmations during management
      diligence.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: market-sizing-and-revenue-traction
    missingEvidence: >-
      Audited commercial ARR, software licensing contract values, customer-level return reduction data, and retention
      metrics are omitted from the public record.
    whyItMatters: >-
      Without verified commercial revenue or customer contract size, addressable market capture and unit economics
      cannot be substantiated against the reported $1.5 billion private valuation.
    diligencePath: >-
      Request customer billing schedules, net revenue retention cohorts, and pre-and-post return rate telemetry from
      pilot retail partners under NDA.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: independent-sizing-benchmarks
    missingEvidence: >-
      Independent third-party sizing studies specifically disaggregating fashion virtual try-on software from broader
      retail computer vision and 3D CAD.
    whyItMatters: >-
      Market sizing relies on vendor-reported pain points (such as retail returns burning margins) rather than audited
      segment-specific transaction data.
    diligencePath: >-
      Review syndicated retail tech analyst market reports (Gartner, IDC, Forrester) covering digital apparel
      merchandising and sizing software.
    relatedQuestionRefs: []
  - type: private-evidence-only
    severity: material
    topic: pricing-and-contract-terms
    missingEvidence: >-
      Public disclosure of SpreeAI's standard enterprise SaaS license fees, per-try-on transaction charges,
      implementation costs, and multi-year contract commitments.
    whyItMatters: >-
      Without public or verifiable pricing disclosures, prospective buyers and investors cannot model ROI, gross margin
      sustainability, or software gross retention rates against competing platforms.
    diligencePath: >-
      Request customer contract schedules, average contract value (ACV) figures, and pricing tiers directly from SpreeAI
      management during commercial diligence.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: sizing-accuracy-methodology
    missingEvidence: >-
      Independent laboratory or university audit reports detailing the methodology, error margins, and sample sizes
      supporting the claimed 99% sizing accuracy.
    whyItMatters: >-
      If the 99% precision claim is based on selective studio conditions or customer self-reporting rather than rigorous
      double-blind trials, real-world return reduction may fall significantly short of marketing expectations.
    diligencePath: >-
      Obtain technical validation documentation and white papers prepared under the MIT and Carnegie Mellon academic
      partnerships.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: commercial-traction
    missingEvidence: Audited contract ARR, recognized software revenue, customer count, and Net Retention Rate (NRR) schedules.
    whyItMatters: >-
      Without signed ARR or realized contract values, underwriting cannot verify whether the $1.5B valuation is
      supported by scalable enterprise software revenue or speculative forward multiples.
    diligencePath: >-
      Request confidential management financial package including trailing twelve-month income statement, customer-level
      billing run-rate, and renewal cohorts.
    relatedQuestionRefs:
