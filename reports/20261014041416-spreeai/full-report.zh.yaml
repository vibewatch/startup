  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、类别划分与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              数字服装试穿软件属于零售计算机视觉与电商体验技术的细分市场。过去，数字服装可视化要依赖昂贵的 3D CAD 资产制作、专用人体扫描设备，或会扭曲服装垂坠和面料纹理的笨重 AR 覆盖层。SpreeAI
              将市场边界定义为逼真的二维生成式 AI：消费者只需上传一张个人照片，或选择代表性的数字分身，就能在现有商品目录中即时预览服装。它省去了专有 3D 服装渲染和人体扫描，把采购类别从专业 3D
              工作室工具转成开箱即用的电商基础设施。当前替代方案包括真人模特摄影、静态平铺图和被动式尺码表。传统电商制作要持续支付摄影棚和模特费用，却仍无法解决消费者对合体、垂坠和个人搭配的不确定性。Always On
              试图把平面商品图变成覆盖桌面端、移动网页和店内互动屏幕的个性化虚拟试衣体验。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM016
      - number: '2.2'
        title: 可服务市场规模视角与经济框架
        blocks:
          - type: paragraph
            body: >-
              生成式零售试衣软件的可服务市场不能只看一个笼统的 TAM 数字，而要拆分不同经济层次。宏观上，全球线上服装零售每年产生数千亿美元 GMV，却被消费者退货严重拖累；数字时尚退货率通常在 20% 至 30%
              之间，带来数十亿美元的逆向物流、库存贬值和利润侵蚀成本，因此零售商需要能压低退货量并提升购买转化的软件。软件层面的市场覆盖企业服装品牌和 DTC 商户，它们寻求自动化合体智能与互动视觉陈列。SpreeAI 在
              The Davidson Group 领投且未披露细节的融资后，获得据报道 $1.5 billion 的私人估值；SEC 记录则显示公司在 2020 至 2023 年三次 Form D 融资合计 $13.0
              million。关键尽调缺口仍在：公司没有披露经审计 ARR、净收入留存或商业客户数。因此，评估其实际市场份额，必须在零售退货的巨大运营规模与早期企业收入基础未经验证之间取得平衡。
            claimRefs:
              - CM004
              - CM005
              - CM011
              - CM012
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM010
              - CM011
              - CM012
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
