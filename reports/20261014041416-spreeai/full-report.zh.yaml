        blocks:
          - type: paragraph
            body: >-
              公司治理把硅谷产品领导力与高级时尚及机构家族办公室资本结合起来。CEO John Imah 曾在 Samsung、Twitch、Meta 和 Snap
              等消费科技平台推动合作与产品规模化。董事会阵容显赫，包括全球时尚偶像 Naomi Campbell、内华达州商人及投资人 Larry Ruvo，以及 The Davidson Group 的 Robert
              Davidson。Campbell 的加入带来文化影响力和设计师直接关系，帮助 SpreeAI 获得奢侈品牌合作。工程负责人 Mrinal Shukla 与产品负责人 Banu Jafarli 牵头技术执行，并与
