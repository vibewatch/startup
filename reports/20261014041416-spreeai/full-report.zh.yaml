              - CP011
              - CP012
      - number: '3.3'
        title: 定价不透明、渠道分销与平台接入
        blocks:
          - type: paragraph
            body: >-
              零售科技的商业采用取决于分销速度和电商平台可接入性。SpreeAI 在 Shopify App Store 发布官方应用，并提供 SDK 和
              API，支持企业网站及移动端定制集成。公司还推广店内数字屏幕和店员辅助的 VIC
              造型模式，试图覆盖实体精品店与数字旗舰店的全渠道预算。尽管分销渠道已接入，公司仍完全不公开商业定价、合同结构和年度最低承诺。Always On
              需要定制企业合作，不像自助软件供应商那样公布分层价格。这会让中端时装商户在不可预测的集成费用与不确定的退货下降收益之间权衡。主流平台又提供免费或捆绑的商品发现功能，买家必须严格验证试点 ROI 后才会签订长期
              SaaS 订阅。
            claimRefs:
              - CP001
              - CP003
              - CP008
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP003
              - CP009
              - CP010
      - number: '3.4'
        title: 护城河持久性、超大规模平台商品化与尽调风险
        blocks:
          - type: paragraph
            body: >-
              SpreeAI 的长期竞争护城河受到平台商品化、开源生成视觉模型快速进步和零售商切换成本低的严重冲击。Google 等超大规模搜索与电商巨头已把原生虚拟试穿直接嵌入 Google Shopping
              搜索结果，商户无需增加成本。若消费者越来越通过搜索引擎或 Instagram、TikTok 等自带 AR 试穿工具的社交平台发现服装，品牌独立试穿组件可能沦为多余的单点方案。SpreeAI 主要通过标准
              Shopify 连接器或 API 接入前端商品页和目录层，企业零售商可替换试穿或尺码软件，而不必改动后端 ERP 或订单管理系统。4 项授权专利和 Naomi Campbell
              等品牌大使对抗商品化的作用有限；一旦基础文生图和服装迁移扩散模型达到同等水平，估值倍数会很脆弱。若没有独家数据飞轮或专有目录锁定，SpreeAI 的溢价估值容易受到在位者竞争和企业利润率压缩的冲击。
            claimRefs:
              - CP004
              - CP006
              - CP009
              - CP012
              - CP013
