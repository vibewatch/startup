      - number: '4.3'
        title: 资本化历史、Form D 文件与估值判断
        blocks:
          - type: paragraph
            body: >-
              SpreeAI 的资本历史与公开估值公告和可验证监管文件明显分离。SEC Form D 追踪显示，SpreeAI Corp（CIK 0001827368）在 2020 年 10 月、2022 年 11 月和
              2023 年 12 月披露三轮私募：$500,000 种子轮、$7,000,000 中期轮和 2023 年末 $5,000,000 融资。公司上一次监管 Form D 已过去近 34
              个月。相比这笔有限的已记录股权资本，公司却宣布在 The Davidson Group 领投的未披露融资后达到 $1.5 billion 投后估值，并有 Naomi Campbell、Bob Davidson 和
              Larry Ruvo 参与董事会或战略投资。这种仅凭 $12.5M SEC 股权资本就达到独角兽估值的巨大溢价，使投资判断复杂化。估计 11 至 50
              名员工的轻资产团队说明人力开支可能相对受控；但公开专利数据库没有 SpreeAI Corp 名下的已公布专利，与媒体声称的 4 项授权、23 项待审专利形成反差。在公司不透明披露 2025
              年融资现金到账、当前现金储备和月度烧钱前，承销方无法确认公司是否有足够 runway 在不继续稀释融资的情况下达到自我造血。
            claimRefs:
              - CI001
              - CI002
              - CI009
              - CI010
              - CI014
      - number: '4.4'
        title: 财务结论与关键尽调重点
        blocks:
          - type: paragraph
            body: >-
              总的来看，SpreeAI 处在生成式 AI 与全球时尚零售交叉点，商业叙事很有吸引力，但财务基础尚未达到机构投资判断所需的验证程度。公司拥有显著品牌声望和战略支持，拿到知名设计师合作、Shopify 应用入口及
              $1.5 billion
              估值。然而从财务尽调角度，公司几乎没有可验证的公开商业数据。商业管线仍以早期沙盒评估为主，而不是已有稳定经常性收入的规模化长期企业软件合同。在投入资本或接受这一估值作为判断基准前，尽调团队必须把未经验证的财务口径视为重大分析缺口，重点取得经审计的过去
              12 个月收入表、客户级账单 cohort、合同续约条款和细分云托管支出。没有公开 ARR 和单位级毛利贡献时，$1.5 billion 估值更像没有锚定的远期倍数，而不是经验证的商业软件基本面。
            claimRefs:
              - CI001
              - CI002
              - CI006
              - CI010
              - CI011
