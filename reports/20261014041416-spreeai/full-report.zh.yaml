    notes: 建议和风险评级综合了公开二级市场申报文件、已提交的公司注册证书及未经核实的公司新闻声明。
    claimRefs:
      - CV001
      - CV002
      - CV007
      - CV008
  - id: TV002
    title: 正 / 反论点表
    columns:
      - 核心论点
      - 证据与支持逻辑
      - 论点失效 / 证伪触发因素
    rows:
      - - 正面论点：高价值 ROI
        - 虚拟试衣软件宣称 99% 的尺码准确率，能够显著减少数十亿美元服装退货，同时提升线上结账转化
        - 试点取消、零售商流失，或无法将免费试用转为签署多年期 SaaS 合同
      - - 正面论点：分销杠杆
        - Shopify 商户应用和计划中的 Amazon Partner Network 集成，可快速自助获客
        - 平台商品化、Shopify 或 Amazon 推出原生竞品 AI 试衣工具，或商户采用疲弱
      - - 反面论点：估值脱节
        - 已提交的 A-1 轮投后估值（$76.18M）与公开独角兽表述（$1.5B）之间相差 20 倍
        - 经过审计的 GAAP 财务报表证明 ARR 超过 $100M，从而支撑 $1.5B 估值
      - - 反面论点：信息不对称
        - 完全缺乏公开签约 ARR、客户留存或毛利率数据，只能依赖新闻引述
        - 独立发布经审计的经常性收入、客户案例研究和透明的单位经济性
    notes: 论点驱动因素将已报道的企业 ROI 主张与经核实的二级市场申报差异及未披露财务数据进行比较。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV006
      - CV007
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 隐含收入 / ARR
      - 估值倍数
      - 估计企业价值
      - 概率信号与下行风险
    rows:
      - - 乐观情景
        - $50M - $75M ARR
        - 12 倍 - 15 倍 ARR
        - $600M - $1,125M
        - 15% 概率；假设全球奢侈品牌和零售品牌快速采用，且净扩张率高
      - - 基准情景
        - $15M - $25M ARR
        - 8 倍 - 10 倍 ARR
        - $120M - $250M
        - 55% 概率；假设 Shopify 商户稳步渗透、企业试点适度推进，软件 SaaS 倍数保持现实水平
      - - 悲观情景
        - <$5M ARR
        - 4 倍 - 6 倍 ARR
        - $20M - $30M
        - 30% 概率；试点流失、生成式 AI 视觉模型商品化，以及估值下轮重定价至清算优先权水平
    notes: 情景基于当前 SaaS 零售技术估值倍数（远期 ARR 的 4x 至 15x），并以已申报的 $22M 累计融资和 $76.18M A-1 轮为基准，模拟远期企业价值。
    claimRefs:
      - CV002
      - CV003
      - CV009
      - CV010
      - CV011
