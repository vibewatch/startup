              目前公开验证的企业采用，主要来自与知名独立时装设计师的展示型合作。Sergio Hudson 宣布把 SpreeAI 虚拟试穿嵌入其 DTC 数字店铺，目标是用个性化造型提升整体销售转化；伦敦当代女装品牌 Kai
              Collective 则与 SpreeAI 探索生成式 AI 可视化如何提升消费者品牌互动。Protea
              是内部伙伴集成沙盒，潜在零售品牌可在受控环境中测试服装垂坠模型、尺码估算算法和目录数据管线。标准接入先从聚焦的目录子集和预设成功指标开始，再扩展到全目录。除这些设计师合作和 Shopify
              自助服务外，公开记录仍未确认其已在主要全国百货或大众服装连锁实现广泛企业采用。
            claimRefs:
              - CU003
              - CU011
              - CU012
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: 留存韧性、单位经济与集中度风险
        blocks:
          - type: paragraph
            body: >-
              SpreeAI
              商业模式能否持续，取决于软件是否通过减少退货并提高购买转化带来可证明的利润扩张。虚拟试穿历来遭零售买家怀疑：早期方案在精心挑选的供应商演示中表现不错，却常在面对不同体型和光线条件的真实消费者时失灵。独立行业分析指出，退货率是否真的下降两位数，只能由零售商分析自身长期流量来确定，不能靠供应商营销材料。SpreeAI
              也没有在公开渠道或监管文件中披露经审计的客户留存、NRR、GRR 或客户生命周期价值。当前增长阶段还存在客户集中风险，收入似乎高度依赖早期展示型设计师协议和 Shopify
              早期采用商户。没有第三方验证、覆盖多类商户 cohort 的持续退货下降案例，长期软件韧性仍是首要尽调问题。
            claimRefs:
              - CU005
              - CU006
              - CU008
              - CU009
              - CU010
              - CU015
      - number: '6.5'
        title: 案例材料
        blocks:
          - type: callout
            title: 展示型合作与规模化企业部署
            body: >-
              SpreeAI 通过 Sergio Hudson、Kai Collective 的设计师合作和 Met Gala
              曝光建立了显著文化信誉。但高级时尚展示合作不能替代广泛企业零售部署；后者的单位经济依赖自动化目录接入，以及在高流量商户中已验证的两位数退货率下降。
            calloutType: insight
            claimRefs:
              - CU005
              - CU008
              - CU010
              - CU011
              - CU012
          - type: callout
            title: 未经验证的商户经济与品类可信度摩擦
            body: >-
              尽管 SpreeAI 声称尺码识别准确率达 99%
              且具备商业化扩展能力，独立行业分析显示，虚拟试衣供应商在精选演示之外的实际表现仍普遍受到零售商质疑。由于缺少包含部署前后经审计退货指标的公开案例研究，商户合作的持续性仍是待尽调的问题。
            calloutType: risk
            claimRefs:
              - CU006
              - CU009
              - CU010
              - CU015
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与生物识别合规风险
        blocks:
          - type: paragraph
            body: >-
              SpreeAI 处于消费者计算机视觉与企业零售软件的敏感交界处，因此面临复杂的监管和法定风险。公司记录证实，SpreeAI Corp 以 CIK 0001827368 注册于内华达州 Incline
              Village，但商业运营位于加利福尼亚州 Los Angeles。构建虚拟试衣形象需要采集消费者照片，这构成主要法律脆弱点。根据 Illinois Biometric Information Privacy
              Act（BIPA）和 California Consumer Privacy
              Act（CCPA）等严格的生物识别法规，若缺少事先明确的书面同意和清晰的数据留存期限，采集和处理面部及身体图像可能引发严重的私人诉权和法定赔偿。此外，尽管 SpreeAI
              公开声称其专利保护虚拟试衣算法，公开监管数据库显示 SpreeAI Corp 名下没有已公开授权或申请的专利，使其缺乏对抗竞争者的正式法定知识产权护城河。
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR009
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR009
              - CR013
      - number: '7.2'
        title: 运营失效模式与尺码精准度风险
        blocks:
          - type: paragraph
            body: >-
              SpreeAI 的核心商业主张是消除服装退货带来的物流和财务负担，而退货会大幅侵蚀零售运营利润率。SpreeAI 宣称其尺码技术在多样化服装目录中的精准率达
              99%。但未经验证的尺码算法带来严重运营风险：如果虚拟试衣推荐与实际合身度不符，退货率可能上升而非下降，立即引发客户反弹和合同取消。运营上，SpreeAI 覆盖三个不同商业触点：在线电商店铺、实体店零售店员和
              VIP 客户关系服务。在这些分散的零售场景中保持低延迟图像渲染和目录 SKU 实时同步，会持续带来基础设施可靠性挑战；目录数据摄取延迟会直接损害消费者购物体验。
            claimRefs:
              - CR007
              - CR008
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR008
              - CR010
      - number: '7.3'
        title: 生态合作方依赖与竞争压力
        blocks:
          - type: paragraph
            body: >-
              SpreeAI 面临极度拥挤的竞争，同时存在结构性的交易对手依赖。市场情报报告显示，虚拟试衣与服装 AI 细分市场有 425 家活跃竞争者，其中包括 64 家获得机构风险投资的公司和 17
              家成熟收购方。激烈竞争限制定价能力，也迫使公司在销售周期上投入大量资源。与此同时，SpreeAI
              高度依赖一级时尚品牌合作来验证技术并带动消费者参与。由于商业进展主要停留在试点公告，而非多年期企业生产部署，任何客户流失或试点终止都会实质性威胁收入持续性。此外，SpreeAI
              依靠外部云图形处理器（GPU）进行逼真推理，毛利率因此暴露于云基础设施价格变化和第三方托管可用性风险。
            claimRefs:
              - CR005
              - CR006
              - CR010
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR010
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR005
              - CR009
              - CR011
              - CR014
      - number: '7.4'
        title: 资本结构脱节与投资论点失效触发因素
        blocks:
          - type: paragraph
            body: >-
              SpreeAI 的公开市场宣传与监管备案之间有着巨大落差。公司将 $1.5 billion headline 估值归因于 The Davidson Group 领投的一轮股权融资，但公开 SEC Form D
              文件显示，三轮私募合计仅筹得 $13 million，最近一轮申报于 2023 年 12 月完成。也就是说，超过 $1.48 billion
              的估值没有透明的公开资本记录支撑，背后可能存在清算优先权压力或非标准结构化融资机制。投资论点可能失效的触发因素包括：（1）州监管机构就面部扫描存储采取执法行动，或出现 BIPA
              私人集体诉讼；（2）旗舰服装品牌经核实取消客户试点；（3）独立基准测试证明尺码精度显著低于公司宣称的水平；（4）公司无法按支持 $1.5 billion 基准的条款完成股权融资。
            claimRefs:
              - CR002
              - CR006
              - CR011
              - CR014
      - number: '7.5'
        title: 证据展品
        blocks:
          - type: callout
            title: 生物识别合规与集体诉讼风险
            body: 虚拟试衣流程若在未取得符合司法辖区要求的明确生物识别同意的情况下采集消费者原始照片，可能依据 Illinois BIPA 等法规面临严厉法定处罚。
            calloutType: risk
            claimRefs:
              - CR009
              - CR013
          - type: callout
            title: 估值基准脱节
            body: 公开宣称估值 $1.5 billion、而 SEC Form D 文件仅记录 $13 million 股权融资，这一鲜明反差要求在投资承诺前严格核验股权结构表。
            calloutType: insight
            claimRefs:
              - CR002
              - CR006
              - CR011
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资历史与头部估值脱节
        blocks:
          - type: paragraph
            body: >-
              SpreeAI 在 2025 年和 2026 年公开宣布，公司在知名家族办公室 The Davidson Group 领投的一轮未披露融资后，以 $1.5 billion 估值跻身独角兽。可是，Forge
              Global 汇总的二级市场记录和公司注册证书显示，资本化情况截然不同。按 Forge Global 的记录，SpreeAI 两轮优先股融资累计筹得 $22 million：2022 年 10 月完成 $7
              million A 轮，投后估值为 $35 million；2024 年 7 月完成 $15 million A-1 轮，投后估值为 $76.18 million（14,705,882 股，每股
              $1.02）。Forge Global 还显示，二级市场交易有限，截至 2026 年 8 月尚未形成撮合交易价格。备案优先股估值与媒体公开说法之间相差接近二十倍。由于 $1.5 billion headline
              数字完全没有独立验证，该投资立场被评为估值偏高、风险高，因而建议保持克制并继续研究。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV008
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: 投资论点与商业反论点
        blocks:
          - type: paragraph
            body: >-
              SpreeAI 的核心投资论点是解决时尚电商最严重的利润侵蚀：产品退货率高、线上购买转化差。行业资料和媒体报道强调，SpreeAI 提供逼真的虚拟试衣软件，并结合接近 99%
              准确率的尺码智能。如果有效部署到全球时尚品牌，这项技术可通过压缩逆向物流费用、减少库存运输和提升消费者购物篮完成率，带来可观回报。相反，投资反论点指出，公开证据没有提供任何已签署的年度经常性收入（ARR）、客户留存率或经审计毛利率，无法支撑接近
              $1.5 billion 的企业价值。与精品奢侈品牌的早期展示试点并不能证明可规模化的数百万美元年度软件合同。在没有经审计财务数据确认经常性企业收入的情况下，将未经验证的 $1.5 billion
              估值计入投资判断，会使投资者面临估值倍数大幅压缩。
            claimRefs:
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV007
      - number: '8.3'
        title: 情景分析、可比倍数与下行触发因素
        blocks:
          - type: paragraph
            body: >-
              将 SpreeAI 放入概率加权情景中评估，可以看出回报对未经验证的入场定价高度敏感。在公开 SaaS 和垂直零售科技市场，高增长优质平台的交易倍数通常为远期收入的 6x 至 10x。基准情景假设 SpreeAI
              借助 Shopify 应用合作和企业试点，创造 $15 million 至 $25 million 的经验证软件收入，对应合理企业价值 $120 million 至 $250
              million。上行乐观情景中，一级零售商快速采用，推动 ARR 达到 $50 million 至 $75 million，按 12x 至 15x 的高端倍数计算，企业价值可能达到 $600 million 至
              $1.125 billion。然而在悲观情景中，试点无法转化为全企业部署且增长放缓，企业价值将回落至约 $20 million 至 $30
              million。此时，普通股股东和后期二级买家将面临向底层优先股清算优先权底线大幅重定价的风险。
            claimRefs:
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV009
              - CV010
              - CV011
      - number: '8.4'
        title: 治理结构、退出准备度与尽调要求
        blocks:
          - type: paragraph
            body: >-
              SpreeAI 的治理框架融合了时尚行业影响力与家族办公室资本，较为少见。董事会由联合创始人兼 CEO John Imah 主持，成员还包括 The Davidson Group 的 Bob
              Davidson、Larry Ruvo 和超模 Naomi Campbell。这个高知名度董事会能带来文化资源和奢侈品牌曝光，但机构尽调仍要求常规公司治理保障。监管与合规上，SpreeAI
              官方隐私政策显示其按结构化流程遵守包括 Illinois Biometric Information Privacy
              Act（BIPA）在内的生物识别法规，并确认头像图像和身体比例数据均在严格同意机制下处理，不会出售给数据经纪商。从退出角度看，SpreeAI 当前的软件分发高度依赖 Shopify 商户集成，未来计划扩展到
              Amazon Partner Network。在考虑任何资本承诺前，机构投资者必须要求核实经审计 GAAP 财务报表、股权结构表优先级和已签署客户合同金额。
            claimRefs:
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: 证据展品
        blocks:
          - type: callout
            title: 资本纪律要求
            body: >-
              机构投资者在评估 SpreeAI 的二级或一级发行前，必须要求核实数据室访问权限，尤其是已签署的软件合同和股权结构表优先权。若在未经验证的 $1.5 billion headline 估值下参与、且没有经审计
              ARR，资本将暴露于严重下轮融资风险。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV008
          - type: callout
            title: 优先权悬置与下轮融资风险
            body: >-
              备案的公司注册证书确认 Series A-1 估值为 $76.18 million，非参与型优先股回报为 1.0x。因此，任何超过 $1 billion
              的未经验证融资都会造成不对称的优先权悬置，在下行退出时可能严重稀释普通股股东。
            calloutType: risk
            claimRefs:
              - CV002
              - CV003
              - CV010
