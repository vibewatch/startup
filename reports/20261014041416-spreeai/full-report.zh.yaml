            body: >-
              Google、Amazon 等超大规模平台把免费的生成式试穿接入搜索界面，给 SpreeAI
              带来强烈结构压力。除非公司能在多样化企业目录上证明可验证、专有的转化提升和合体准确率，否则独立单点方案的定价能力会受到威胁。
