    sections:
      - number: '1.1'
        title: 公司身份、起源与运营模式
        blocks:
          - type: paragraph
            body: >-
              SpreeAI（法定注册名为 SpreeAI Corp，CIK 0001827368）是一家获风险资本支持的时尚科技公司，提供逼真的虚拟试穿和合体智能软件。技术与产品负责人 John Imah
              创立公司后，将旗舰平台 Always On 定位为企业级零售方案，用互动且贴近真人模特的服装预览替代繁琐试衣间和静态商品摄影。公司法定总部位于内华达州 Incline Village，同时在洛杉矶及
              Silicon Beach 创意产业带开展商业和设计业务。SpreeAI 声称其核心尺码引擎的预测准确率最高可达
              99%，瞄准线上服装退货侵蚀商户单位经济的数十亿美元难题。尽管商业营销力度很大，经审计收入、年度经常性收入（ARR）和已验证的商户合同金额仍完全未公开。
