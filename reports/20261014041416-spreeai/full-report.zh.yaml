  - id: FV001
    title: 建议推导逻辑
    type: flow
    summary: 这条分析链依次从技术验证、估值脱节推导至最终的“继续研究”建议。
    data:
      nodes:
        - id: step-1
          label: 技术与产品验证
          detail: 媒体报道和产品演示均验证了逼真试穿软件及 99% 精度的尺码判断说法
        - id: step-2
          label: 分销与商业覆盖
          detail: Shopify 商家合作已上线；公司已与奢侈时装设计师建立试点关系
        - id: step-3
          label: 财务与运营不透明
          detail: 没有任何经验证的已签约 ARR、收入运行率、客户数或毛利率披露
        - id: step-4
          label: 估值差异
          detail: 公开的 $1.5B 独角兽说法，与申报文件中的 $76.18M A-1 轮投后估值形成鲜明对比
        - id: step-5
          label: 下行与稀释评估
          detail: 高概率降轮融资，加上 Forge Global 缺乏二级流动性，造成严重的入场风险
        - id: step-6
          label: 尽调决定
          detail: 最终建议为“继续研究”；风险评级高，估值姿态偏高
    approximationNotes: null
    claimRefs:
