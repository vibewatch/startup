      - number: '4.2'
        title: 单位经济、毛利率驱动因素与云计算成本
        blocks:
          - type: paragraph
            body: >-
              SpreeAI 的核心经济逻辑是扩大服装零售利润。线上服装退货率经常超过 30%，出库运输、逆向配送、仓库重新入库和库存降价由此产生数十亿美元浪费。SpreeAI 声称其人体几何算法与机器学习模拟可达到 99%
              尺码精度，公司进一步声称这能让商户退货率下降两位数。公司把软件包装成利润回收引擎，而不是可有可无的营销组件，希望通过许可费或按使用量计费的交易抽成分享零售商的物流节省。问题在于，逼真的超个性化 3D
              服装垂坠需要大量云端
              GPU，包括扩散模型和复杂神经渲染流程；公开资料没有服务器托管费用、推理延迟基准或单次会话成本。若单次推理成本超过从商户取得的软件费，毛利率压缩会严重限制经营现金流。软件实际毛利、CAC、回本周期和 NRR
              等关键投资判断指标，公开记录均未披露，必须用管理层账目直接核验。
            claimRefs:
              - CI003
              - CI007
              - CI011
              - CI012
