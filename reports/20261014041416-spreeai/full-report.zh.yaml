      - number: '2.3'
        title: 买家分层、预算归属与集成路径
        blocks:
          - type: paragraph
            body: >-
              SpreeAI 的软件面向不同企业买家，各自拥有不同预算权限、技术要求和战略动机。中端市场和 DTC 商户的主要买家是电商副总裁或数字陈列负责人，他们关注购物车转化速度、会话参与度和退货控制。SpreeAI 与
              Shopify 的合作是重要分销渠道，可用很少定制工程工作快速装入店铺。奢侈时装屋和高端百货则由首席营销官、创意总监和客户关系负责人参与。Sergio Hudson 与 Kai Collective
              的早期试点显示，高级时尚品牌把 SpreeAI 用于定制化叙事、VIP 客户互动及 2025 年 Met Gala 等高曝光文化活动。针对全渠道企业，SpreeAI 提供 SDK、API 和 Protea
              测试平台，让零售商把 Always On 部署到实体试衣间屏幕、店员平板和高触达 VIC 服务中；品牌因此可从全渠道运营或奢侈品客户关系预算支付软件，而不只是 IT 预算。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
      - number: '2.4'
        title: 采用驱动因素、结构性约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              AI 虚拟试穿软件的商业扩张受强劲经济动因推动，但也受到结构性约束和评估障碍影响。最主要的增长动力是单位经济利润扩张：零售商希望借助 99%
              准确的尺码建议和逼真预览，避免毁掉服装利润的“购买—退货”循环；数字搭配和虚拟衣橱还能延长会话并提高客户忠诚度。企业采购则要把软件价格（B12
              表示价格按商户规模分层）与总拥有成本比较，后者包括商品目录接入、边缘延迟和客户照片隐私合规。零售行业还存在试点疲劳：新工具往往先引发好奇，若推荐尺码与真实合体效果不符，长期使用便会下滑。最重要的是，公开资料没有经验证的客户流失、合同总额或第三方验证的转化率提升。在
              SpreeAI 用经审计合同数据和可复用案例证明 $1.5 billion 估值前，市场渗透仍是有吸引力的假设，而非已证实的确定性。
            claimRefs:
              - CM004
              - CM010
              - CM013
              - CM015
      - number: '2.5'
        title: 案例材料
        blocks:
          - type: callout
            title: 降低退货推动利润扩张，带来企业 ROI
            body: 时尚服装电商的商品退货率经常超过 30%，逆向物流、重新入库和折价销售会侵蚀毛利。SpreeAI 把虚拟试穿定位成降低运营成本的引擎，目标是把退货率削减两位数，而不只是吸引眼球的新鲜功能。
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
          - type: callout
            title: 商业信息不透明掩盖单位经济进展
            body: >-
              SpreeAI 据报道达到 $1.5 billion 估值，并获得显赫董事会任命和学术合作支持，但公开足迹没有经审计的软件收入、ARR
              里程碑或客户合同数量。投资人必须核实，试点部署是否真正转化为多年期、可重复的软件许可合同。
            calloutType: risk
            claimRefs:
              - CM011
              - CM013
              - CM015
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局分类与结构性替代方案
        blocks:
          - type: paragraph
            body: >-
              时尚电商优化的竞争涵盖多种技术路线，从人口统计尺码算法到前沿生成式计算机视觉。SpreeAI 直接竞争 AI
              虚拟试穿（VTO）这一新兴类别，让消费者把商品服装渲染到自身形象或数字化身上。竞争者可分五层：3DLOOK、Astra AI、Fit:match 等直接 VTO 同行；True Fit
              等数据驱动尺码网络；Google、Amazon 等平台级科技巨头；Walmart 收购的 Zeekit 等零售商自有方案；以及人工尺码表加高退货量这一现状。SpreeAI 声称凭未披露的 2025 年融资获得
              $1.5 billion 私人估值，但公开资本历史显示 2020 年至 2023 年末三次 Form D 合计仅融资 $13 million。True Fit 依靠跨商户尺码档案和交易历史，而 SpreeAI
              专注单照片逼真渲染。由于企业零售商常同时采购多家方案或评估自研扩散流程，SpreeAI 必须证明视觉保真度能带来相对低成本基线工具的可防御转化提升。
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP011
      - number: '3.2'
        title: 能力差异化、专利护城河与技术定位
        blocks:
          - type: paragraph
            body: >-
              据公司声称，Always On 架构支持单照片接入：无需下载外部移动应用或进行人体扫描，即可生成个性化逼真试穿预览。公司还声称尺码精度达
              99%，将产品定位为视觉发现引擎和降低零售退货成本的运营工具。为支撑这一路线，SpreeAI 宣传 4 项授权专利、23 项待审申请，并与 MIT EECS Alliance 和 Carnegie Mellon
              University Robotics Institute 开展学术研究合作。但 99% 准确率尚未得到独立第三方基准或同行评议论文证实，公开专利数据库也没有以 SpreeAI Corp
              名义直接公布的专利转让记录，知识产权可能在关联实体，或仍处申请审查阶段。3D 扫描供应商可捕捉体积测量，而二维生成式扩散模型在不同光线下可能出现面料垂坠失真或尺码误判。Protea
              让品牌试点流程，但真正差异化取决于渲染流程能否避免通用扩散模型常见的幻觉和面料变形。
            claimRefs:
              - CP002
              - CP004
              - CP007
              - CP008
              - CP013
              - CP014
