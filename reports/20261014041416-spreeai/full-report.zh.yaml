  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 面向 AI 时尚虚拟试衣和合身度智能软件的分层市场规模与经济价值捕获框架。
    data:
      items:
        - label: 服装电商总体可服务市场
          value: Macro Addressable GMV
          detail: 受尺码摩擦和高退货率影响的全球线上时尚零售交易
        - label: 虚拟陈列与尺码软件 TAM
          value: Software Spend Layer
          detail: 企业为 2D/3D 可视化、尺码推荐和数字展厅技术分配的软件预算
        - label: AI 照片级试衣 SAM
          value: Direct Addressable Segment
          detail: 在网页和移动端店铺采用零硬件、单照片生成式试衣的零售商
        - label: 目标多渠道奢侈品与 SMB 足迹 SOM
          value: Initial Addressable Beachhead
          detail: 采用 Always On 的 Shopify 中端商户、独立设计师品牌和奢侈品牌
        - label: SpreeAI 商业里程碑基准
          value: $1.5B Reported Valuation
          detail: 由领投方 The Davidson Group 支持的投后私募估值里程碑
