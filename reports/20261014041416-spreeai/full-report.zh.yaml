  - id: FE001
    title: SpreeAI 产品与运营架构栈
    type: stack
    summary: 六层架构视图展示从商户展示渠道，经生成式模拟和尺码预测，再到商业基础设施的数据流。
    data:
      layers:
        - label: 展示与全渠道接入层
          detail: 可嵌入的 Web SDK 小组件、开箱即用的 Shopify 应用和门店 VIC 客户顾问界面。
          modules:
            - Web SDK 小组件
            - Shopify 主题嵌入
            - VIC 客户顾问应用
        - label: 客户上下文与身份接入
          detail: 处理单张经同意上传的照片，并选择预渲染的人口属性 Twin 目录。
          modules:
            - 经同意的照片接入
            - 精选 Twin 库
            - 隐私与同意控制器
        - label: 服装数字化与接入流水线
          detail: 自动解析标准 2D 目录照片，无需 3D / 体积照片拍摄。
          modules:
            - Ghost-mannequin 接入
            - 服装属性解析器
            - 商品陈列关系映射器
        - label: 生成式渲染与合身度模拟引擎
          detail: 进行照片级服装变形和专有尺码预测，宣称准确率达 99%。
          modules:
            - 生成式服装变形
            - 99% 合身度预测模型
            - 姿态适配引擎
        - label: 合作伙伴集成与验证层（Protea）
          detail: 提供预发布沙盒和开发者 API，让企业零售商验证渲染与尺码效果。
          modules:
            - Protea 测试工作区
            - Headless REST API
            - 合作伙伴 Webhooks
        - label: 商业基础设施与归因
          detail: Shopify 商业同步，以及计划中的 Amazon Partner Network 连接。
          modules:
            - Shopify 商业同步
            - 归因与退货遥测
            - Amazon Partner Gateway（路线图）
    approximationNotes: 架构层概括了已记录的产品能力和 SDK 接口；专有机器学习权重及服务器基础设施细节仍属机密。
    claimRefs:
      - CE001
      - CE003
      - CE005
      - CE007
