      - number: '1.3'
        title: 资本化历史、Form D 披露与估值偏差
        blocks:
          - type: paragraph
            body: >-
              SpreeAI 在 2025 年 5 月因广泛传播的 $1.5 billion 投后估值公告而进入独角兽行列。但公共监管记录与媒体头条存在明显偏差。SEC Form D 显示 SpreeAI Corp
              恰好完成三次私募股权融资：2020 年 10 月 $500,000 种子轮、2022 年 11 月 $7,000,000 轮，以及 2023 年 12 月 $5,000,000 轮，文件记录的股权资本合计为
              $12.5 million 至 $13.0 million。The Davidson Group 领投的 2025 年融资，其现金到账、股价、清算优先权和二级交易股份均未披露。营销材料还声称已有 4 项授权专利和
              23 项待审申请，但以公司实体名义检索联邦专利登记却没有公开记录，知识产权可能尚未转让，或由个人及外部关联实体持有。
