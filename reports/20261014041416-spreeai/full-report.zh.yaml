      - CM011
      - CM012
      - CM015
  - id: FP001
    title: 竞争定位图：视觉逼真度 vs. 集成与尺码深度
    type: quadrant
    summary: 将时尚零售技术供应商按视觉照片级逼真度及集成 / 尺码深度进行战略定位。
    data:
      points:
        - label: SpreeAI (Always On)
          x: 8.5
          'y': 8
          detail: 视觉照片级逼真度高，并支持多渠道嵌入；宣称尺码精度达 99%，但未经独立审计佐证。
        - label: True Fit
          x: 2
          'y': 7.5
          detail: 虚拟试衣能力低；数据网络深度高，零售集成成熟。
        - label: Google Virtual Try-On
          x: 8
          'y': 3.5
          detail: 生成式视觉质量高；白标嵌入灵活性低，不适合定制品牌体验。
        - label: 3DLOOK (Mobile Scanning)
          x: 5.5
          'y': 5
          detail: 视觉照片级逼真度中等；高度重视生物识别扫描测量。
        - label: Zeekit (Walmart In-House)
          x: 7
          'y': 2
          detail: 专有部署规模大；封闭的自有平台，第三方品牌无法使用。
        - label: 内部开源构建
          x: 6
          'y': 4
          detail: 借助开放模型实现中等生成逼真度；需要较高的内部维护投入和 GPU 成本。
        - label: 现状（尺码表）
          x: 1
          'y': 1
          detail: 没有视觉预览；依赖客户自行判断尺码区间，并承担高昂的逆向物流成本。
    approximationNotes: 评分基于供应商披露、已记录的平台能力和截至 2026-10 的集成深度，采用 0–10 的序数尺度。
    claimRefs:
      - CP007
      - CP011
      - CP012
  - id: FI001
    title: 从造型到毛利的收入与利润率桥接
    type: waterfall
    summary: 示意性瀑布图展示每 100 次目录浏览会话中，互动虚拟试衣如何转化为软件收入和净毛利率贡献。
