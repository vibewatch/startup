callouts:
  - calloutType: recommendation
    title: Capital Discipline Mandate
    body: Institutional investors must demand verified data room access—specifically signed software contracts and cap table preferences—prior to evaluating secondary or primary offerings in SpreeAI. Participating at unverified $1.5 billion headline valuations without audited ARR exposes capital to severe down-round risk.
    claimRefs:
      - CV001
      - CV002
      - CV008
  - calloutType: risk
    title: Preference Overhang and Down-Round Exposure
    body: Because filed Certificates of Incorporation confirm a $76.18 million Series A-1 valuation with 1.0x non-participating preferred returns, any unverified financing above $1 billion creates an asymmetric preference overhang that could heavily dilute common shareholders in a downside exit.
    claimRefs:
      - CV002
      - CV003
      - CV010
