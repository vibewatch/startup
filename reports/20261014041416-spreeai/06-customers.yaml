callouts:
  - calloutType: insight
    title: "Showcase Collaborations Versus Scaled Enterprise Deployments"
    body: "SpreeAI has successfully established marquee cultural credibility through designer partnerships with Sergio Hudson and Kai Collective, alongside Met Gala visibility. However, high-fashion showcase collaborations do not substitute for broad enterprise retail deployment, where unit economics depend on automated catalogue ingestion and verified double-digit return rate reductions across high-volume merchant traffic."
    claimRefs:
      - CU005
      - CU008
      - CU010
      - CU011
      - CU012
  - calloutType: risk
    title: "Unverified Merchant Economics and Category Credibility Friction"
    body: "While SpreeAI claims 99% sizing detection accuracy and commercial scalability, independent industry analysis indicates that virtual try-on vendors face systemic retail skepticism regarding real-world performance outside curated demos. In the absence of published case studies with audited pre- and post-deployment return metrics, merchant durability remains an open diligence question."
    claimRefs:
      - CU006
      - CU009
      - CU010
      - CU015
