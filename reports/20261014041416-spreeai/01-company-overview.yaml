company:
  name: SpreeAI
chapter:
  number: 1
  title: Company Overview
  summary: SpreeAI is an AI fashion-commerce company offering virtual try-on and sizing intelligence, reaching a reported
    $1.5B valuation in 2025 backed by The Davidson Group and Naomi Campbell. However, public SEC filings reveal only $13M
    in disclosed equity through late 2023, while core operating metrics, confirmed revenues, and patent records remain unverified.
sections:
- id: company-identity-and-operating-model
  title: Company Identity, Origins, and Operating Model
  body: SpreeAI (incorporated legally as SpreeAI Corp, CIK 0001827368) is a venture-backed fashion-technology enterprise delivering
    photorealistic virtual try-on and fit intelligence software. Founded by technologist and product executive John Imah,
    the company positions its flagship platform, Always On, as an enterprise retail solution that replaces cumbersome dressing
    rooms and static product photography with interactive, model-accurate garment previews. The company is legally headquartered
    in Incline Village, Nevada, while maintaining active commercial and design operations connected to the Los Angeles and
    Silicon Beach creative corridors. SpreeAI claims its core sizing engine achieves up to 99% sizing prediction accuracy,
    targeting the multi-billion-dollar retail return dilemma where online apparel returns destroy merchant unit economics.
    Despite aggressive commercial marketing, audited revenue figures, annual recurring revenue (ARR), and verified merchant
    contract values remain entirely private.
  claimRefs:
  - CO001
  - CO005
  - CO006
  - CO007
  - CO008
  - CO014
  tableRefs:
  - TO001
- id: leadership-and-governance
  title: Executive Leadership, Governance, and Key-Person Exposure
  body: The company's corporate governance structure pairs Silicon Valley product leadership with high-fashion and institutional
    family-office capital. Chief Executive Officer John Imah brings a distinguished track record across consumer tech platforms,
    having previously driven partnership and product scale at Samsung, Twitch, Meta, and Snap. Governance is reinforced by
    a high-profile board of directors featuring global fashion icon Naomi Campbell, prominent Nevada businessman and investor
    Larry Ruvo, and Robert Davidson of The Davidson Group. The addition of Campbell establishes cultural authority and direct
    designer relationships, enabling SpreeAI to secure partnerships across luxury brands. Key technical execution is led by
    Head of Engineering Mrinal Shukla and Head of Product Banu Jafarli, who coordinate academic and technical initiatives
    with institutions such as Carnegie Mellon University and the Massachusetts Institute of Technology. Key-person dependence
    on John Imah is acute, as he serves as the primary external representative, strategic architect, and fundraising catalyst.
  claimRefs:
  - CO001
  - CO003
  - CO010
  tableRefs:
  - TO002
- id: capitalization-and-valuation-analysis
  title: Capitalization History, Form D Disclosures, and Valuation Divergence
  body: 'SpreeAI entered unicorn status in May 2025 following widespread announcements of a $1.5 billion post-money valuation.
    However, an analysis of public regulatory records presents a substantial divergence from headline press narratives. SEC
    Form D filings for SpreeAI Corp record exactly three private equity raises: a $500,000 seed tranche in October 2020, followed
    by a $7,000,000 round in November 2022, and a $5,000,000 round in December 2023, totaling $12.5 million to $13.0 million
    in documented equity capital. The subsequent 2025 funding round led by The Davidson Group remains entirely undisclosed
    regarding cash proceeds, share price, liquidation preferences, and secondary transaction shares. Furthermore, while marketing
    statements claim four issued patents and 23 pending applications, federal patent registries under the corporate entity
    name display zero published records, indicating intellectual property may remain unassigned or held under personal or
    external affiliate entities.'
  claimRefs:
  - CO002
  - CO004
  - CO009
  - CO014
  tableRefs:
  - TO003
- id: milestones-and-commercial-scale
  title: Corporate Milestones, Technology Alliances, and Diligence Realities
  body: SpreeAI has established steady external visibility through targeted cultural events, academic alliances, and technical
    infrastructure partnerships. Commercial milestones began with entity formation in 2020 and private capital expansion through
    2023, leading to public commercial launch in May 2024. In 2025, the company capitalized on high-profile collaborations
    with luxury designers Sergio Hudson and Kai Collective surrounding the Met Gala. On the technical infrastructure front,
    SpreeAI forged research alliances with the Robotics Institute at Carnegie Mellon University and MIT to advance photorealistic
    rendering pipelines, followed by a GPU compute alliance with Lambda in September 2026. The company was also recognized
    globally at the World Artificial Intelligence Conference (WAIC) 2026 in Shanghai as one of five featured startup presenters.
    Nevertheless, commercial deployment beyond showcase capsule collections and pilot trials remains unverified in the public
    record.
  claimRefs:
  - CO004
  - CO010
  - CO011
  - CO012
  - CO013
