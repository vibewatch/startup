  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Taxonomy, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The commercial market for digital apparel try-on software represents a specialized subsector of retail
              computer vision and e-commerce experience technology. Historically, digital apparel visualization required
              expensive 3D computer-aided design (CAD) asset creation, specialized body-scanning hardware booths, or
              clunky augmented-reality overlays that distorted garment drape and fabric texture. SpreeAI defines its
              market boundary around photorealistic, two-dimensional generative artificial intelligence, allowing retail
              shoppers to upload a single personal photograph or select a representative digital twin to instantly
              preview clothing items directly within an existing catalog.


              By eliminating the requirement for proprietary 3D garment rendering or customer body scanning, SpreeAI
              shifts the software purchase category from specialized 3D studio tooling into turnkey e-commerce
              infrastructure. The primary status-quo substitutes in this market are traditional photo shoots featuring
              live agency models, static garment flat-lays, and passive sizing lookup tables. While conventional
              e-commerce production imposes substantial recurring costs for studio photography and talent, it fails to
              resolve individual consumer uncertainty regarding fit, drape, and personal styling. SpreeAI positions its
              Always On software suite to displace these static assets by transforming standard flat catalog imagery
              into interactive, personalized dressing room experiences across desktop, mobile web, and in-store
              interactive displays.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM016
      - number: '2.2'
        title: Addressable Market Sizing Lenses and Economic Framework
        blocks:
          - type: paragraph
            body: >-
              Sizing the addressable market for generative retail fitting software requires triangulating across
              distinct economic layers rather than relying on an undifferentiated total addressable market headline. At
              the macro layer, global online apparel retail generates hundreds of billions of dollars in annual gross
              merchandise volume, yet remains severely burdened by consumer returns. Return rates in digital fashion
              frequently hover between 20% and 30%, creating billions of dollars in reverse logistics costs, inventory
              depreciation, and margin erosion. Retailers are consequently compelled to evaluate software solutions that
              directly compress return volumes and improve purchase conversion rates.


              At the intermediate software layer, the service addressable market spans enterprise apparel brands and
              direct-to-consumer merchants seeking automated fit intelligence and interactive visual merchandising.
              SpreeAI achieved a prominent milestone with a reported $1.5 billion private valuation following an
              undisclosed funding round led by The Davidson Group. Prior regulatory filings with the SEC reveal an
              established operating history, with SpreeAI Corp raising $13.0 million across three Form D equity filings
              between 2020 and 2023. However, an acute diligence gap persists: SpreeAI has not disclosed audited annual
              recurring revenue (ARR), net revenue retention, or commercial customer counts. Consequently, sizing
              SpreeAI's realistic market capture requires balancing the immense operational scale of retail returns
              against the unverified nature of its early enterprise revenue base.
            claimRefs:
              - CM004
              - CM005
              - CM011
              - CM012
              - CM015
