            title: Hyperscaler Commoditization and Single-Feature Risk
            body: >-
              SpreeAI faces intense structural pressure from hyperscalers like Google and Amazon integrating free
              generative try-on into search surfaces, threatening standalone point-solution pricing power unless SpreeAI
              demonstrates verifiable, proprietary conversion lift and fit accuracy across diverse enterprise catalogs.
            calloutType: risk
            claimRefs:
              - CP009
