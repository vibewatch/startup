            body: >-
              SpreeAI segments its target customer base primarily into three distinct commercial tiers within the
              fashion and apparel ecosystem: independent direct-to-consumer (DTC) brands, luxury designer fashion
              houses, and enterprise retail marketplaces. For independent DTC apparel brands, the primary buyer is
