      - number: '3.2'
        title: Capability Differentiation, Patent Moats, and Technical Positioning
        blocks:
          - type: paragraph
            body: >-
              SpreeAI differentiates its Always On architecture through a claimed single-photo ingestion flow that
              generates personalized photorealistic try-on previews without requiring shoppers to download external
              mobile apps or perform physical body scans. The company emphasizes a headline sizing precision rate of
              99%, positioning the tool as both a visual discovery engine and an operational solution to reduce costly
              retail return rates. To defend this technological approach, SpreeAI highlights four issued patents and
              twenty-three pending applications, alongside academic research alliances with the EECS Alliance at the
              Massachusetts Institute of Technology and the Robotics Institute at Carnegie Mellon University.
              Nevertheless, significant technical diligence gaps persist. The 99% accuracy claim has not been
              corroborated by independent third-party benchmarks or peer-reviewed academic publications, and public
              patent databases show zero patent assignments published directly under SpreeAI Corp's name, suggesting
              intellectual property may reside in affiliated entities or remain unexamined in application stages.
              Furthermore, competing 3D scanning vendors capture volumetric measurements, whereas 2D generative
              diffusion models risk subtle fabric drape distortions or sizing mispredictions under varied consumer
              lighting. SpreeAI's internal testbed, Protea, allows brands to pilot workflows, but true differentiation
              hinges on whether its rendering pipeline avoids the hallucination and fabric deformation common to generic
              diffusion models.
            claimRefs:
              - CP002
              - CP004
              - CP007
              - CP008
              - CP013
              - CP014
