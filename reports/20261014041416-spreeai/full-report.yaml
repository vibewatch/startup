              unverified entry pricing. In public SaaS and vertical retail-tech markets, premium high-growth platforms
              typically trade at enterprise value multiples between 6x and 10x forward revenue. Under our base-case
              scenario, assuming SpreeAI leverages its Shopify app partnership and enterprise pilots to generate $15
