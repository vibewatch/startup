      - number: '3.3'
        title: Pricing Opacity, Channel Distribution, and Platform Access
        blocks:
          - type: paragraph
            body: >-
              Distribution velocity and e-commerce platform accessibility serve as critical determinants of commercial
              adoption in retail technology. SpreeAI has prioritized channel access by releasing an official app on the
              Shopify App Store, while offering software development kits (SDKs) and application programming interfaces
              (APIs) for custom enterprise web and mobile integrations. The company also markets in-store digital
              display and associate-assisted private client (VIC) styling modes, attempting to capture unified
              omnichannel spend across physical boutiques and digital flagships. Despite these distribution
              integrations, SpreeAI maintains complete opacity regarding its commercial pricing models, contract
              structures, and minimum annual commitments. Unlike self-serve software vendors that publish transparent
              tiered pricing, SpreeAI requires custom enterprise engagements for its Always On suite. This lack of
              transparent pricing creates commercial friction for mid-tier fashion merchants, who must weigh
              unpredictable integration expenses against uncertain returns reduction. Meanwhile, merchant risk is
              compounded by the availability of free or bundled discovery features across dominant marketplace
              platforms, forcing buyers to conduct rigorous pilot ROI validations before committing to long-term SaaS
              subscriptions.
            claimRefs:
              - CP001
              - CP003
              - CP008
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP003
              - CP009
              - CP010
      - number: '3.4'
        title: Moat Durability, Hyperscaler Commoditization, and Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              The long-term durability of SpreeAI's competitive moat faces severe headwinds from platform
              commoditization, rapid advancements in open-source generative vision models, and inherently low retailer
              switching costs. Hyperscale search and e-commerce giants, most notably Google, have launched native
              virtual try-on features embedded directly within Google Shopping search results at zero incremental
              merchant cost. If consumer garment discovery increasingly originates on search engines or social platforms
              like Instagram and TikTok that supply native AR try-on tools, standalone brand-level try-on widgets risk
              becoming redundant point solutions. Furthermore, retailer switching costs remain structurally low. Because
              SpreeAI's software integrates primarily at the frontend product display page and catalog layer via
              standard Shopify connectors or APIs, an enterprise retailer can substitute alternative try-on or sizing
              software without disrupting backend enterprise resource planning (ERP) or order management systems. While
              SpreeAI points to four issued patents and high-profile brand ambassadors like Naomi Campbell to secure
              luxury fashion mindshare, these assets provide limited defense against commoditization if foundational
              text-to-image and garment-transfer diffusion models achieve parity. Investors must recognize that absent
              exclusive data flywheels or proprietary catalog lock-in, SpreeAI's premium valuation multiple remains
              highly vulnerable to aggressive incumbent competition and enterprise margin compression.
            claimRefs:
              - CP004
              - CP006
              - CP009
              - CP012
              - CP013
