      - number: '4.3'
        title: Capitalization History, Form D Filings, and Valuation Underwriting
        blocks:
          - type: paragraph
            body: >-
              SpreeAI's capital history presents a striking divergence between verifiable regulatory filings and public
              valuation announcements. According to regulatory tracking of SEC Form D filings, SpreeAI Corp (CIK
              0001827368) has disclosed three private equity rounds spanning October 2020, November 2022, and December
              2023, including a $500,000 seed filing, a $7,000,000 mid-stage round, and a $5,000,000 late-2023 raise.
              Nearly 34 months have elapsed since the company's last regulatory Form D filing. In contrast to this
              modest documented equity base, SpreeAI announced that it reached a $1.5 billion post-money valuation
              following an undisclosed funding round led by The Davidson Group, alongside board participation from
              fashion icon Naomi Campbell and strategic investors Bob Davidson and Larry Ruvo.


              This dramatic valuation markup—surpassing unicorn status with only $12.5M in documented SEC equity
              capital—presents substantial underwriting complexity. An asset-light team of an estimated 11 to 50
