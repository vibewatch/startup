      - number: '1.3'
        title: Capitalization History, Form D Disclosures, and Valuation Divergence
        blocks:
          - type: paragraph
            body: >-
              SpreeAI entered unicorn status in May 2025 following widespread announcements of a $1.5 billion post-money
              valuation. However, an analysis of public regulatory records presents a substantial divergence from
              headline press narratives. SEC Form D filings for SpreeAI Corp record exactly three private equity raises:
              a $500,000 seed tranche in October 2020, followed by a $7,000,000 round in November 2022, and a $5,000,000
              round in December 2023, totaling $12.5 million to $13.0 million in documented equity capital. The
              subsequent 2025 funding round led by The Davidson Group remains entirely undisclosed regarding cash
              proceeds, share price, liquidation preferences, and secondary transaction shares. Furthermore, while
              marketing statements claim four issued patents and 23 pending applications, federal patent registries
              under the corporate entity name display zero published records, indicating intellectual property may
              remain unassigned or held under personal or external affiliate entities.
