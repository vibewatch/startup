  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing Architecture, and Channel Monetization
        blocks:
          - type: paragraph
            body: >-
              SpreeAI monetizes its virtual fitting room technology primarily through its core product platform branded
              Always On. The platform delivers photorealistic virtual try-ons and personal sizing intelligence across
              three primary touchpoints: online e-commerce storefronts, in-store retail associate displays, and
              high-touch private clienteling services for luxury fashion houses. Rather than functioning as a
              direct-to-consumer mobile application, SpreeAI operates as a business-to-business enterprise software
              provider, offering integrations through a self-serve Shopify application, custom developer SDKs and REST
              APIs, and an upcoming channel partnership within the Amazon Partner Network.


              Commercial distribution is augmented by an internal onboarding and testing infrastructure named Protea,
              which assists retail partners with catalog ingestion and simulation calibration. However, commercial
              contract realization remains at an early developmental stage. CEO John Imah publicly acknowledged that
              retail partners have predominantly operated within a sandbox-less testing environment—termed a 'college
              phase'—where brands evaluate workflows before full commercial commitment. Showcase partnerships with
              luxury designers Sergio Hudson and Kai Collective establish market visibility and brand cachet, but
              realized contract values, software licensing tiers, and public list pricing remain undisclosed. For
              investment underwriting, the absence of public contract minimums or platform take-rates leaves baseline
              software revenue quality unverified.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI008
