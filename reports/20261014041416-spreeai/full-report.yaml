              While SpreeAI claims four issued and twenty-three pending patents alongside academic partnerships to
              defend its photorealistic pipeline, public SEC Form D filings show only $13M in cumulative equity raised
              through late 2023, creating a stark divergence between its intellectual property positioning and the
              massive compute capital deployed by incumbent platforms.
