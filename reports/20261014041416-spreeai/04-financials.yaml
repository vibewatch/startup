    - type: private-evidence-only
      severity: material
      topic: commercial-traction
      missingEvidence: Audited contract ARR, recognized software revenue, customer count, and Net Retention Rate (NRR) schedules.
      whyItMatters: Without signed ARR or realized contract values, underwriting cannot verify whether the $1.5B valuation is supported by scalable enterprise software revenue or speculative forward multiples.
      diligencePath: Request confidential management financial package including trailing twelve-month income statement, customer-level billing run-rate, and renewal cohorts.
      relatedQuestionRefs:
