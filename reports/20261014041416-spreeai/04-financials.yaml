callouts:
  - calloutType: risk
    title: Severe Disconnect Between Disclosed SEC Capital and Unicorn Valuation
    body: SpreeAI's public regulatory record reflects three disclosed SEC Form D rounds through December 2023, with no subsequent filings in 34 months. Reconciling this filed capitalization cadence with the announced $1.5 billion valuation led by The Davidson Group requires verifying whether the valuation reflects speculative forward pricing, complex structured equity preferences, or aggressive press-release post-money framing.
    claimRefs:
      - CI001
      - CI002
      - CI010
  - calloutType: insight
    title: Commercial Traction Remains Concentrated in Pilot Learning Phase
    body: While SpreeAI claims partnerships with high-profile fashion designers like Sergio Hudson and Kai Collective alongside a Shopify integration, CEO John Imah confirmed that partners have primarily operated in non-production sandbox environments. Without verified production deployments at major retail scale, contracted ARR and realized recurring revenue cannot be established from public data.
    claimRefs:
      - CI003
      - CI006
      - CI008
      - CI011
  - calloutType: recommendation
    title: Underwriting Blockers Require Audited Unit Economics and Inference COGS
    body: Prospective investors and underwriting teams must not accept company-claimed 99% sizing precision or list-pricing proxies as proof of commercial unit economics. Due diligence must explicitly demand audited customer-level retention, realized software take-rates, and actual cloud GPU inference expenditures to determine whether SpreeAI operates as an 80%+ gross margin SaaS platform or a margin-constrained compute utility.
    claimRefs:
      - CI007
      - CI011
      - CI012
