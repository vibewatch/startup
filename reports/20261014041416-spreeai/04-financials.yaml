        - 99% claimed precision rate
        - Medium
        - Core value driver to reduce retailer return logistics costs
        - Request third-party audited fit test results across standardized body types.
      - - Return Rate Reduction Impact
        - Double-digit reduction claimed
        - Medium
        - Justifies merchant willingness to pay software take-rate
        - Provide pre- and post-deployment return rate data from live merchant pilots.
      - - Gross Margin Contribution
        - null
        - Low
        - Critical for SaaS vs tech-enabled services valuation multiple
        - Supply detailed COGS breakdown distinguishing software hosting from manual 3D modeling.
      - - Per-Session Cloud Inference Cost
        - null
        - Low
        - Determines unit-level profitability of Always On browsing
        - Disclose GPU infrastructure bills (AWS/GCP) normalized by try-on sessions.
      - - Net Revenue Retention (NRR)
        - null
        - Low
        - Validates expansion within retail partner brands and catalogs
        - Provide historical cohort expansion data for early enterprise design partners.
    notes: Precision accuracy and return reductions reflect vendor claims; financial unit economics (gross margin, COGS, NRR) are completely omitted from public disclosures.
