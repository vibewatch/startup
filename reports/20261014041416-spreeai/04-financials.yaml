    - type: missing-source
      severity: material
      topic: unit-economics
      missingEvidence: Detailed cloud compute hosting expenditures, per-session GPU inference costs for Always On 3D rendering, and gross margin waterfalls.
      whyItMatters: Generative AI virtual try-on software can face severe gross margin compression if per-query inference costs exceed retail software take-rates.
      diligencePath: Review vendor cloud infrastructure invoices (AWS/GCP/CoreWeave), model inference latency and cost-per-call metrics under pilot load.
      relatedQuestionRefs:
        - QI008
    - type: conflicting-data
      severity: material
      topic: financing-history
      missingEvidence: Full capitalization table and term sheet disclosures reconciling the cumulative $12.5M in SEC Form D filings with the $1.5B valuation round led by The Davidson Group.
      whyItMatters: The massive gulf between $12.5M in filed Form D equity rounds and a $1.5B valuation implies either substantial undisclosed capital structure mechanics or high valuation inflation.
      diligencePath: Examine the latest cap table, Series A/B investment agreements, liquidation preference terms, and board consent documentation.
