callouts:
  - calloutType: "insight"
    title: "Pragmatic Architecture: 2D Catalogue Ingestion Over Bespoke 3D Capture"
    body: "SpreeAI's core architectural differentiation lies in its decision to ingest existing 2D retailer catalogue imagery rather than mandating expensive multi-camera photoshoots or volumetric 3D scans. By combining generative AI garment warping with client-side photo or Twin selection, the platform lowers technical onboarding friction for apparel brands. However, this pragmatic approach places immense burden on 2D fit prediction models to infer depth and drape accurately."
    claimRefs:
      - "CE001"
      - "CE003"
      - "CE006"
      - "CE014"
  - calloutType: "risk"
    title: "Intellectual Property Ownership and Assignment Verification Gap"
    body: "While SpreeAI leadership publicizes 4 issued patents and 23 pending applications protecting its photorealistic try-on and 99% sizing algorithms, independent corporate registry databases indicate zero published patents assigned directly to SpreeAI Corp. Diligence underwriters must verify whether patent assets reside in parent entities, founder holding vehicles, or academic research partner assignees (such as MIT or CMU) to ensure clear corporate IP title."
    claimRefs:
      - "CE010"
      - "CE011"
