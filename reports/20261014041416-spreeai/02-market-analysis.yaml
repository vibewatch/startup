callouts:
  - calloutType: insight
    title: Margin Expansion via Return Mitigation Drives Enterprise ROI
    body: For fashion apparel e-commerce, product return rates frequently exceed 20 to 30 percent, eroding gross margins through reverse logistics, restocking, and discounting. SpreeAI positions its virtual try-on software not merely as an engaging novelty, but as an operational cost-reduction engine targeting double-digit return rate reductions.
    claimRefs:
      - CM004
      - CM005
  - calloutType: risk
    title: Private Commercial Opacity Obscures Unit Economic Traction
    body: While SpreeAI achieved a reported $1.5 billion valuation headline supported by prominent board appointments and academic partnerships, its public footprint lacks audited software revenue, ARR milestones, and customer contract counts. Investors must verify whether pilot deployments translate into recurring multi-year software licensing contracts.
    claimRefs:
      - CM011
      - CM013
      - CM015
