- id: durability-and-servicing
  title: Durability, repeat usage, and servicing
  body: 'The reviewed sources do show why cardholders might keep using these programs after onboarding: H-E-B and Central Market anchor rewards to everyday grocery baskets, Rakuten layers cash back onto an existing shopping marketplace, Fetch links swipe activity into its points and Spin & Win ecosystem, travel programs pay back in miles or travel credits, and resort cards reward on-property or mortgage spend. Support surfaces also exist after launch: Brooks Brothers and Central Market expose help-center structures for payments, account management, and card use, while Horizon Hobby explains wallet provisioning, virtual card numbers, and payment handling through the Imprint app. That said, durability is still the weakest evidentiary area in the chapter. No reviewed public source disclosed NRR, GRR, churn, contract renewals, partner satisfaction, or average account tenure. BBB complaints provide a modest adverse signal on servicing visibility, but without normalization by account base or resolution
    SLA.'
  claimRefs:
  - CU015
  - CU023
  - CU024
  - CU028
  - CU032
  - CU033
  - CU038
  - CU040
  tableRefs:
  - TU004
  - TU006
- id: expansion-migration-and-concentration
  title: Expansion, migration, and concentration risk
  body: 'Imprint''s expansion case is easy to explain publicly: marquee brands are willing to launch or migrate to a program architecture that promises faster launches, more control over rewards, and a better digital customer experience than legacy bank stacks. CNBC''s Rakuten reporting and Finextra''s funding coverage both frame the company as a replacement path for older bank-issued programs, not just a vendor for greenfield launches. But the concentration question is still unresolved. Public proof skews heavily toward consumer-facing brands in travel, grocery, retail, and vacation categories, and most visible programs still point to First Electronic Bank as issuer. That means partner concentration, issuer concentration, and vertical concentration all remain plausible risks even though public sources do not quantify them. In effect, launch proof and category breadth are solid; measured concentration, contract economics, and renewal durability are not. Those missing disclosures should be
    treated as diligence blockers rather than hand-waved away with logo count.'
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU009
  - CU037
  - CU039
  - CU042
  tableRefs:
  - TU005
