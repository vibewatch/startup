schemaVersion: report-v2
artifact: customers
slug: imprint
runDate: '2026-05-21'
company:
  name: Imprint
chapter:
  number: 6
  title: Customers
  summary: 'Imprint has unusually strong public proof that real consumer-facing card programs are live across grocery, travel, retail, resort, and hobby brands, with partner-owned application pages, support centers, and rewards terms showing production deployment rather than logo-only marketing. The main weakness is durability: public sources support launch momentum and some platform-level growth, but not partner-level active accounts, renewals, retention, or concentration, so customer quality is easier to verify than customer economics.'
sections:
- id: roster-and-segmentation
  title: Roster and customer segmentation
  body: 'Imprint''s visible customers are consumer brands, but the practical users and payers in every public program are end-cardholders spending inside a brand-owned loyalty loop. The roster that Imprint publishes publicly spans grocery banners such as H-E-B and Central Market; travel programs such as Booking.com and Turkish Airlines; cashback and rewards ecosystems such as Rakuten and Fetch; specialty retail brands such as Brooks Brothers, CB2, and Crate & Barrel; resort and vacation brands such as Westgate and Holiday Inn Club Vacations; and niche enthusiast commerce through Horizon Hobby. That mix indicates broad vertical coverage, but also a very specific go-to-market model: brand partners distribute the card, while consumers remain the spending customer. The reviewed set did not surface public SMB, enterprise, or standalone software buyers, so the customer story here is overwhelmingly co-brand consumer distribution rather than direct SaaS sales. Public materials also show a narrow
    issuer base, which matters for concentration analysis.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU041
  tableRefs:
  - TU001
- id: named-customer-proof
  title: Named customer proof and production status
  body: The strongest evidence in this chapter is not generic brand-logo placement but partner-owned pages that support real acquisition or servicing flows. H-E-B and Central Market publish launch details, application routes, and immediate-virtual-card language. Rakuten and Fetch both launched U.S. American Express products with explicit issuer and program-manager disclosures. Booking.com, Turkish Airlines, Brooks Brothers, Westgate, Holiday Inn Club Vacations, and Horizon Hobby all maintain product or support pages describing card benefits, signup mechanics, or post-approval servicing. Imprint's own help center ties those programs together with issuer disclosures, which corroborates that the public roster is not confined to a single marketing page. That is enough to call these programs live production proof. What remains missing is partner-by-partner funded-account scale, monthly active cards, and any retention disclosures, so proof of existence is much stronger than proof of depth.
