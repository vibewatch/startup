- id: adoption-and-usage-signals
  title: Adoption and usage signals
  body: Public adoption evidence exists, but it is mostly top-of-funnel or platform-level rather than partner-level. Two independent 2025 funding articles say Imprint's cardholder base grew about 200% year over year, which supports momentum without revealing the base or current total. Rakuten brings a large pre-existing commerce audience, with more than 3,500 stores and a long-standing cash-back habit, while Fetch enters cards from an even larger rewards funnel that claims 11 million receipts per day and more than 6 million five-star reviews. H-E-B and Central Market launched with explicit mass-market acquisition incentives, and multiple partner pages promise immediate virtual-card use after acceptance, showing that onboarding is digital and activation can be instant. The common pattern is brand discovery, digital eligibility check, acceptance, immediate use, and a brand-specific rewards loop. What public sources do not show is conversion from brand member to funded account, spend per active
    card, or utilization by cohort.
  claimRefs:
  - CU008
  - CU011
  - CU012
  - CU015
  - CU016
  - CU018
