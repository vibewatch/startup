- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Representative public programs
  - Primary use case
  - Public scale / strategic value
  - Evidence gap
  rows:
  - - Grocery households
    - Brand buyer = H-E-B or Central Market; user and payer = same consumer household
    - H-E-B; Central Market
    - Everyday grocery basket, brand-product spend, Favor delivery
    - High-frequency spend and mass-market Texas retail distribution
    - No public funded-account count, spend share, or renewal data
  - - Travel loyalty members
    - Brand buyer = airline / OTA; user and payer = traveler
    - Turkish Airlines; Booking.com
    - Miles or travel-credit earning tied to trips and trip-adjacent spend
    - Visible cross-sell into existing travel loyalty ecosystems
    - No public active-card count or partner revenue contribution
  - - Cash-back ecosystem users
    - Brand buyer = Rakuten or Fetch; user and payer = app or marketplace member
    - Rakuten; Fetch
    - Everyday spend routed into cashback or points programs
    - Large pre-existing member funnels make these strategic launch partners
    - No public conversion rate from member base to funded cardholder
  - - Home and apparel retail shoppers
    - Brand buyer = retail brand; user and payer = same shopper
    - Brooks Brothers; CB2; Crate & Barrel; Eddie Bauer
    - Repeat retail spend, financing, and membership-linked rewards
    - Shows Imprint can support specialty retail across multiple brands
    - No public cardholder or receivables split by brand
  - - Resort and vacation owners / guests
    - Brand buyer = resort operator; user and payer = vacation owner or guest
    - World of Westgate; Holiday Inn Club Vacations
    - On-property spend, mortgages, travel, and stay-linked rewards
    - Useful for higher-ticket, brand-contained recurring spend
    - No public disclosure of account size or loss performance by program
  - - Hobby enthusiasts
    - Brand buyer = merchant; user and payer = same hobbyist consumer
    - Horizon Hobby
    - Ecommerce spend plus rewards-partner-store activity
    - Proof that Imprint can serve niche enthusiast communities, not only mass retail
    - No public adoption or repeat-purchase metrics disclosed
  notes: Rows summarize visible public customer segments and strategic value; they do not imply disclosed revenue contribution or active-account counts.
