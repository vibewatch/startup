  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: public-program-roster
    missingEvidence: A complete current roster of active, inactive, and private-label partner programs with launch dates and current status.
    whyItMatters: The named-customer table is only a partial public roster, so concentration and breadth can still be distorted by unseen programs or recently ended contracts.
    diligencePath: Request an internal customer roster with program start dates, current status, and sector tags; reconcile it against the public roster and support-center inventory.
    relatedQuestionRefs:
    - QU001
    - QU025
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: blocking
    topic: program-usage
    missingEvidence: Partner-level active accounts, funded accounts, spend volume, activation rates, and utilization by brand.
    whyItMatters: Platform-level growth does not reveal whether adoption is broad-based or concentrated in one or two marquee programs.
    diligencePath: Ask for a partner dashboard with approved accounts, funded accounts, monthly active cards, and spend per active account for the top programs.
    relatedQuestionRefs:
    - QU018
    relatedTableRefs:
    - TU002
  - type: missing-source
    severity: blocking
    topic: retention-durability
    missingEvidence: Retention, churn, NRR, GRR, renewal, and satisfaction metrics by program or cohort.
    whyItMatters: The chapter can verify launch proof and usage incentives, but not whether cardholders or partners stay engaged over time.
    diligencePath: Request cohort retention, monthly active-card decay, partner renewal history, and any NPS or satisfaction reporting by program.
    relatedQuestionRefs:
    - QU020
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: migration-economics
    missingEvidence: Contract length, migration timeline, commercial terms, and revenue share for partners switching from legacy issuers.
    whyItMatters: Without win-loss economics and contract duration, it is hard to determine whether migrations create durable value or just headline logos.
    diligencePath: Ask for one recent migration case study showing prior issuer, implementation timeline, economics, and measurable performance after launch.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: complaints-benchmarking
    missingEvidence: Complaint counts normalized by active-account base plus response and resolution rates by program.
    whyItMatters: A public complaints page is directionally adverse, but it cannot be translated into servicing quality without denominator and resolution data.
    diligencePath: Request internal complaint dashboards, CFPB or BBB tracking, first-response SLA, and resolution-time metrics broken out by major program.
    relatedQuestionRefs:
    - QU024
  - type: missing-source
    severity: material
    topic: partner-concentration
    missingEvidence: Top-partner share of revenue, receivables, cardholders, and spend, plus average contract term and renewal calendar.
    whyItMatters: The visible roster is broad enough to tell a growth story, but not precise enough to assess whether one partner could impair the business if it churned.
    diligencePath: Ask management for top-5 partner concentration metrics, issuer split, and the next 24 months of renewal dates.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU005
