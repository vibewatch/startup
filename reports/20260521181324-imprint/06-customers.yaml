- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Driver / risk
  - Public evidence
  - Impact
  - Why it matters
  - Diligence path
  rows:
  - - Legacy-issuer replacement opportunity
    - CNBC says Imprint won Rakuten over large-bank competitors; Finextra says brands are replacing legacy bank-issued programs
    - Opportunity
    - Supports continued logo growth through migrations, not only new-card creation
    - Request win/loss memos and migration timelines by partner
  - - Brand-embedded distribution
    - Partner-owned landing pages, applications, and support centers are public across multiple brands
    - Opportunity
    - Brand channels may lower acquisition cost and improve fit with existing loyalty audiences
    - Request partner-by-partner application funnel and CAC data
  - - Issuer concentration
    - Most visible programs use First Electronic Bank, with Shell and Crate & Barrel on First Bank & Trust
    - Risk
    - Scaling, compliance, and continuity still depend on a narrow external-bank set
    - Request issuer split of receivables, limits, and contingency plans
  - - Partner concentration uncertainty
    - Public sources disclose logos but not top-partner revenue or receivables concentration
    - Risk
    - One or two marquee partners could dominate economics without being publicly visible
    - Request top-5 partner share of cards, spend, receivables, and revenue
  - - Vertical concentration
    - Visible roster is concentrated in consumer travel, grocery, retail, and vacation categories
    - Risk
    - Category downturns or weak consumer spending could affect multiple programs at once
    - Request pipeline and revenue mix by vertical
  - - Durability blind spot
    - No public renewal, churn, contract-length, or satisfaction metrics surfaced in the reviewed set
    - Risk
    - Launch momentum can be mistaken for durable customer quality without renewal evidence
    - Request renewal cohorts, average contract term, and partner NPS / satisfaction data
  notes: This table separates visible growth drivers from still-unquantified concentration risks; public sources support the narrative, not the exact exposure percentages.
