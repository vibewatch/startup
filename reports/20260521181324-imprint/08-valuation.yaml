- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - direction
  - what would change the view
  rows:
  - - Brand replacement is happening
    - thesis
    - If Rakuten and Shell prove repeatable rather than episodic, Imprint deserves a real premium to slower incumbent issuers.
  - - Capital markets are opening
    - thesis
    - If warehouse and ABS performance keeps improving while funding costs compress, the discount for capital intensity can narrow.
  - - The model is lender-like, not pure software
    - anti-thesis
    - If current revenue and margins are much cleaner than the public mix suggests, the lender discount could be overstated.
  - - Disclosure quality is weak
    - anti-thesis
    - Publishing current recognized revenue, margin, and preference terms would move the debate from narrative to underwriting.
  - - Consumer-credit stress still matters
    - anti-thesis
    - If loss, payment, and delinquency metrics remain resilient through a noisier cycle, downside multiple pressure would ease.
  notes: The table is framed around what the current price already assumes, not around whether Imprint is a compelling product company in the abstract.
