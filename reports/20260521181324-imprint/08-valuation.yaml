- id: diligence-and-thesis-breaks
  title: 'Final diligence asks: the next move is to close revenue, term, and credit-structure gaps—not to admire one more logo win'
  body: 'Imprint’s exit path is conceptually visible because the company has already shown it can raise equity, secure warehouse financing, and place rated ABS. But it is not yet IPO-grade from a disclosure perspective. The decisive asks are straightforward. First, investors need a current revenue-quality bridge: recognized revenue, gross margin, NRR, cohort retention, and how much of economics are interest versus interchange versus servicing. Second, they need the financing stack itself: loss-sharing with partner banks, advance rates, reserve structures, and the cost of funds as the portfolio seasons. Third, they need the actual cap-table and preference stack, because a headline unicorn valuation can conceal economics that are much less attractive to new money. Until that evidence exists, the correct discipline is to stay engaged, keep the diligence list explicit, and treat any claim that the round is already “fair” as unproven rather than inevitable.'
