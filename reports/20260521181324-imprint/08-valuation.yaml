  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-revenue-quality
    missingEvidence: Current recognized revenue, gross margin, retention, and cohort performance by partner program.
    whyItMatters: The valuation call currently rests on a stale public revenue estimate rather than a current operating bridge.
    diligencePath: Obtain the current board deck, monthly KPI pack, and an auditor-ready revenue-recognition bridge.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: financing-terms
    missingEvidence: Preference stack, liquidation rights, ratchets, secondaries, and any investor-specific side-letter economics.
    whyItMatters: Headline valuation can materially overstate the actual economics available to new money.
    diligencePath: Review the Series D financing documents, capitalization table, and any side letters with counsel.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: loss-sharing-and-funding-cost
    missingEvidence: Warehouse advance rates, reserve accounts, partner-bank loss waterfalls, and the current all-in cost of funds.
    whyItMatters: Without the funding and risk-sharing structure, investors cannot tell how much of the lender discount should apply to value.
    diligencePath: Run treasury and structured-finance diligence with partner-bank and securitization documentation.
    relatedQuestionRefs:
    - QV026
    relatedTableRefs:
    - TV005
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: private-valuation-comps
    missingEvidence: Recent private secondary marks, exact late-stage co-brand fintech rounds, and comparable financing terms.
    whyItMatters: The public comp set is useful for bounds, but a tighter private-market comparison would sharpen the stretched-versus-fair debate.
    diligencePath: Collect secondary quotes, private financing documents, and banker color on comparable co-brand or embedded-card financings.
    relatedQuestionRefs:
    - QV023
    - QV030
    relatedTableRefs:
    - TV004
