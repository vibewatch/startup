- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  rows:
  - - Imprint (subject)
    - Last private valuation vs. Sacra 2024 revenue estimate
    - About 17.1x trailing revenue on $1.2B and $70M
    - Shows what the current mark implies on the cleanest public revenue anchor.
    - Revenue is a third-party estimate and may understate current scale.
  - - Synchrony
    - Public market cap / trailing revenue
    - 2.41x sales
    - Best large-scale private-label / co-brand issuer reference with deposit funding and deep disclosure.
    - Far larger, deposit-funded, and much more mature than Imprint.
  - - Bread Financial
    - Public market cap / trailing revenue
    - 1.32x sales
    - Useful lower-multiple comp for store-card and co-brand economics.
    - Legacy issuer with different growth and technology profile.
  - - Capital One
    - Public market cap / trailing revenue
    - 3.14x sales
    - Large bank issuer with visible partner-card economics and diversified funding.
    - Diversified bank earnings make it an imperfect pure-play co-brand comp.
  - - American Express
    - Public market cap / trailing revenue
    - 3.07x sales
    - Premium network / issuer reference for branded rewards and merchant relationships.
    - Network scale and brand mix are much broader than Imprint’s.
  - - Marqeta
    - Public market cap / trailing revenue
    - 2.54x sales
    - Capital-lightish embedded-card infrastructure substitute for brands seeking modern issuance rails.
    - Processor economics are structurally cleaner than a receivables-heavy lender.
  - - Affirm
    - Public market cap / trailing revenue
    - 5.67x sales
    - Growth fintech substitute for merchant finance and checkout-driven monetization.
    - Different product and duration mix, but still a useful upper public reference.
  notes: This comparable set intentionally mixes issuer and substitute models because Imprint combines loyalty software language with real credit exposure.
