- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Verified revenue is still too low
    - Current recognized revenue is not dramatically above the public 2024 estimate
    - The multiple premium keeps looking narrative-led rather than underwriting-led.
    - Do not invest at the Series D headline price.
  - - Funding cost or loss terms deteriorate
    - Warehouse / ABS economics, reserves, or partner-bank sharing worsen
    - Capital intensity matters more than the loyalty-software story.
    - Re-cut the valuation with a harsher lender discount.
  - - Credit metrics weaken
    - Delinquencies, charge-offs, or minimum-payment behavior trend worse than currently visible
    - Downside risk moves from abstract to immediate.
    - Treat the current mark as expensive.
  - - Partner concentration persists
    - A single program still drives too much volume or economics
    - Logo wins stop translating into diversified platform value.
    - Lower confidence and demand tighter terms.
  - - Preference stack is unfriendly
    - Ratchets, senior preferences, or dilution overhang materially reduce new-money economics
    - Headline valuation stops matching investable value.
    - Pause until price or terms improve.
  notes: These triggers are about valuation ownership, not generic operating risks. Each one asks when the current entry would stop being defendable.
