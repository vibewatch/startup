- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - assumptions
  - valuation / return logic
  - key risks
  - probability signal
  rows:
  - - Bull
    - Current recognized revenue is materially above the public 2024 estimate, partner concentration eases, and credit performance stays within an acceptable securitization band.
    - The Series D can migrate from stretched toward fair, and prior investors could still have a strong mark-up path.
    - Needs both growth continuation and cleaner economics than public evidence shows today.
    - Possible, but dependent on private data not yet in the public file.
  - - Base
    - 'Public evidence remains roughly where it is now: strong partner proof, real funding progress, but no clean 2026 revenue and term bridge.'
    - The current mark remains stretched for new money even if the company itself keeps executing.
    - A premium can persist privately for some time, but public comp support still does not meet it.
    - Most supportable public-only read.
  - - Bear
    - Credit conditions worsen, concentration persists, or funding and servicing friction rise faster than revenue.
    - The Series D starts to look expensive and increasingly vulnerable to down-round or weak-return risk.
    - The business does not need to fail; it only needs the capital stack and credit cycle to matter more than the narrative.
    - Sector and disclosure data already show the channels through which this can happen.
  notes: These scenarios are qualitative entry-discipline lenses anchored to public evidence, not management forecasts or a full valuation model.
