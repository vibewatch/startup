  title: Recommendation summary table
  columns:
  - dimension
  - value
  - rationale
  rows:
  - - Recommendation
    - research-more
    - Public evidence proves the company is real but does not yet close the revenue, economics, and term bridge needed to underwrite new money at the Series D price.
  - - Confidence
    - medium
    - The direction of the call is clear, but the exact distance between stretched and fair depends on private metrics that are still missing.
  - - Risk rating
    - high
    - The business carries real consumer-credit, funding, concentration, and disclosure risk rather than clean software-style downside.
  - - Valuation stance
    - stretched
    - The cleanest public revenue bridge implies about 17.1x trailing sales, well above issuer and substitute public comps.
  - - Decision implication
    - stay close, but price-sensitive
    - Deeper private diligence could improve the view; accepting the last round price from public evidence alone is not justified.
  notes: 'This recommendation is explicitly price-sensitive: the company can be strong while the current entry still lacks public-only support.'
