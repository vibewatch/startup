evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding-total
    missingEvidence: A current company-approved funding ledger reconciling equity raised, debt facilities, and securitization proceeds.
    whyItMatters: >-
      Later valuation and dilution analysis can be distorted if the report mixes equity-only, debt-inclusive, and stale
      marketing totals.
    diligencePath: >-
      Request a cap-table summary and financing timeline from management or an investor data room, including whether
      warehouse and ABS capital are counted in “total funding.”
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A dated current employee count with the same definition across trackers and company disclosures.
    whyItMatters: Headcount is being used as a proxy for operating leverage and maturity, but public sources currently conflict.
    diligencePath: Ask management for current FTE count by function and compare against payroll or insurance census data.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance-gap
    missingEvidence: Board roster, ownership percentages, voting rights, and any founder or investor protective provisions.
    whyItMatters: >-
      Control rights and succession risk materially affect downside protection, refresh cadence, and any IPO-readiness
      judgment.
    diligencePath: Request board observer list, latest cap table, and governance documents under NDA.
    relatedQuestionRefs:
      - QO010
      - QO023
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure-gap
    missingEvidence: Primary-source disclosure of 2025 revenue, current run-rate, and target or achieved GAAP profitability timing.
    whyItMatters: >-
      Public valuation and later financial analysis become too estimate-heavy without a management-backed revenue and
      profitability bridge.
    diligencePath: >-
      Request monthly revenue bridge, cohort margin view, and board or lender materials that disclose current
      profitability trajectory.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table chronology coverage
    missingEvidence: >-
      A fully reconciled dated chronology for every internal launch, exact Series B date, and all partnership go-live
      dates.
    whyItMatters: >-
      The milestone table is intentionally partial because several company milestones are only visible through summary
      pages and tracker narratives, which weakens precise sequencing.
    diligencePath: >-
      Request an internal company timeline or press archive export with exact dates for every financing, partnership
      launch, and governance change.
    relatedQuestionRefs:
      - QO019
      - QO024
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: standalone-tam
    missingEvidence: >-
      A public source that isolates a TAM, SAM, or SOM specifically for third-party co-brand card platforms rather than
      the broader US credit-card or embedded-finance market.
    whyItMatters: >-
      Without a direct category total, valuation work must rely on proxy lenses and more conservative penetration
      assumptions.
    diligencePath: >-
      Request category studies or internal market-sizing decks from management and compare them against issuer portfolio
      data and partner-category spend.
    relatedQuestionRefs:
      - QM010
  - type: private-evidence-only
    severity: material
    topic: brand-unit-economics
    missingEvidence: >-
      Program-level disclosure on interchange sharing, revenue share, marketing subsidy, and partner-funded rewards
      economics.
    whyItMatters: >-
      These terms determine whether a co-brand platform creates durable margin for the issuer, the brand, and the
      platform at the same time.
    diligencePath: Ask for anonymized partner economics, launch cohorts, and a sample program P&L in management diligence.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: serviceable-share
    missingEvidence: >-
      Evidence on how much share Imprint can realistically win from incumbent issuer-processors, in-house brand stacks,
      and non-card substitutes by segment.
    whyItMatters: >-
      Serviceable share drives the difference between a large narrative market and a credible valuation underwriting
      case.
    diligencePath: >-
      Obtain pipeline conversion data, win-loss notes versus incumbent issuers, and cohort data on program migrations or
      relaunches.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: merchant-economics
    missingEvidence: >-
      Partner-level revenue share, interchange split, loss-sharing, setup fees, and underwriting waterfall terms for
      Imprint, Cardless, and major incumbent issuer programs.
    whyItMatters: >-
      Competitive durability depends as much on partner economics as on rewards design, but those economics are mostly
      invisible in public materials.
    diligencePath: >-
      Request partner contracts, renewal decks, or reference-call evidence that compares brand economics across
      incumbent, challenger, and infrastructure-led options.
    relatedQuestionRefs:
      - QP019
      - QP027
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Comparable benchmarks for implementation timeline, migration cost, conversion lift, and operational pain when
      brands switch card operators or issuers.
    whyItMatters: >-
      The chapter can show that switching happens, but not yet quantify how hard it is or how often incumbents versus
      challengers actually win rebids.
    diligencePath: >-
      Collect RFPs, migration case studies, or partner reference calls that compare launch speed and replatforming
      effort across providers.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: minor
    topic: deserve-status
    missingEvidence: >-
      Current standalone Deserve customer roster, product scope, and go-to-market materials that resolve its role beyond
      the Marqeta-linked platform narrative.
    whyItMatters: >-
      Deserve is relevant as an infrastructure-side substitute, but the public evidence set is too thin to rank it
      confidently against Cardless, Marqeta, or Stripe.
    diligencePath: >-
      Obtain direct company confirmation, current partner announcements, or verifiable press coverage that shows
      Deserve's active 2026 positioning.
    relatedQuestionRefs:
      - QP028
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current cash balance, monthly burn, and management runway scenarios.
    whyItMatters: >-
      Without liquidity and burn data, the chapter cannot determine how long Imprint can self-fund growth or when a new
      financing event becomes mandatory.
    diligencePath: >-
      Request current board package or monthly finance dashboard showing unrestricted cash, covenant headroom, and base
      / bear runway.
    relatedQuestionRefs:
      - QI014
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: A revenue bridge splitting interest income, interchange, fee income, and program-management revenue.
    whyItMatters: Revenue quality and regulatory sensitivity depend on how much of gross economics comes from each stream.
    diligencePath: Obtain a management revenue bridge by partner and stream for 2024, 2025 actuals, and 2026 budget.
    relatedQuestionRefs:
      - QI003
      - QI009
    relatedTableRefs:
      - TI001
      - TI005
  - type: private-evidence-only
    severity: material
    topic: margin-bridge
    missingEvidence: Gross margin, contribution margin, rewards expense, servicing cost, fraud losses, and net charge-offs by cohort.
    whyItMatters: >-
      The public record shows gross yield and charge-off proxies but not whether the remaining economics are attractive
      after rewards and servicing.
    diligencePath: >-
      Request internal cohort economics by major partner showing spend, revolve, rewards cost, servicing cost, and net
      contribution.
    relatedQuestionRefs:
      - QI010
      - QI011
    relatedTableRefs:
      - TI003
      - TI005
  - type: missing-source
    severity: material
    topic: partner-concentration
    missingEvidence: Top-partner concentration for receivables, revenue, and originations plus current issuer-bank mix.
    whyItMatters: >-
      A few large partners or a single issuing-bank channel could make the model more brittle than the marquee partner
      roster implies.
    diligencePath: >-
      Request a concentration table covering top-5 partners, receivables by issuer bank, and monthly originations by
      partner.
    relatedQuestionRefs:
      - QI016
      - QI017
      - QI018
    relatedTableRefs:
      - TI004
      - TI005
  - type: missing-source
    severity: material
    topic: trust-performance-detail
    missingEvidence: >-
      Monthly trust reporting with excess-spread history, reserve status, static-pool curves, and any downgrade or
      covenant thresholds.
    whyItMatters: Fitch provides a snapshot, but underwriting ABS dependence requires ongoing trigger and vintage visibility.
    diligencePath: >-
      Collect investor reporting packs for 2025-A and any warehouse-monitoring packages covering collateral performance
      and reserve tests.
    relatedQuestionRefs:
      - QI012
      - QI013
    relatedTableRefs:
      - TI004
  - type: missing-source
    severity: minor
    topic: complaint-disposition
    missingEvidence: A quantified complaint count and disposition trend from BBB, CFPB, or internal customer-support data.
    whyItMatters: >-
      The adverse surface exists publicly, but the current excerpt does not show whether it is small noise or a scaling
      issue.
    diligencePath: Review complaint database exports, regulator complaints, and internal support SLAs / backlog trends.
    relatedQuestionRefs:
      - QI020
    relatedTableRefs:
      - TI005
  - type: private-evidence-only
    severity: material
    topic: underwriting-governance
    missingEvidence: >-
      Fair-lending governance, model-risk controls, approval-rate calibration, and credit-line assignment policy for
      Imprint underwriting.
    whyItMatters: >-
      Public sources show richer inputs and better UX, but they do not prove that the decisioning system is governed in
      a way that will scale safely across issuer, partner, and regulatory boundaries.
    diligencePath: >-
      Request model-governance memos, fair-lending review materials, approval / decline reason distributions, and
      line-assignment policy documents by issuer and program.
    relatedQuestionRefs:
      - QE004
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: reliability-history
    missingEvidence: >-
      Readable uptime history, incident archive, postmortems, and explicit service-level targets for partner APIs and
      cardholder servicing surfaces.
    whyItMatters: >-
      A modern card-management experience is only durable if the underlying application, eventing, and servicing layers
      have measurable reliability. That evidence was not recoverable from the public status surface in this run.
    diligencePath: >-
      Collect internal uptime dashboards, status-page archives, webhook delivery SLOs, and recent incident reviews
      covering application, payment, and wallet surfaces.
    relatedQuestionRefs:
      - QE015
    relatedTableRefs:
      - TE004
  - type: missing-source
    severity: material
    topic: security-attestations
    missingEvidence: >-
      Third-party security attestations or audit outputs beyond PCI and app-store claims, such as SOC 2, ISO 27001,
      penetration-test summaries, or red-team findings.
    whyItMatters: >-
      PCI-gated access and mobile-security claims are useful, but they do not substitute for broader evidence that the
      platform's data, software-delivery, and infrastructure controls have been independently tested.
    diligencePath: >-
      Request current security-certification letters, latest penetration-test executive summary, vulnerability-SLA
      policy, and any board-level security reporting package.
    relatedQuestionRefs:
      - QE025
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: issuer-processor-and-funding-mix
    missingEvidence: >-
      Current program mix by issuing bank, network, processor, receivables owner, and external funding line or trust
      structure.
    whyItMatters: >-
      The public record proves that these dependencies exist, but not how concentrated they are. Concentration or
      brittle counterparties could make product delivery riskier than the polished UX suggests.
    diligencePath: >-
      Request an architecture and program-operations matrix showing each live program's issuer bank, network, processor,
      wallet dependencies, and associated warehouse or ABS funding path.
    relatedQuestionRefs:
      - QE012
      - QE013
      - QE014
      - QE023
    relatedTableRefs:
      - TE003
      - TE005
  - type: stale
    severity: minor
    topic: beyond-credit-roadmap-specificity
    missingEvidence: >-
      Customer names, GA dates, operational requirements, and unit economics for announced debit, secured-card,
      flexible-financing, and rewards-network modules.
    whyItMatters: >-
      The roadmap is strategically important, but the current public disclosures are directional rather than
      operational. Without timing and customer proof, the beyond-credit story should not be underwritten as live product
      breadth.
    diligencePath: >-
      Request product roadmaps, pilot customer names, launch milestones, and capital / compliance requirements for each
      beyond-credit module.
    relatedQuestionRefs:
      - QE020
      - QE024
    relatedTableRefs:
      - TE005
  - type: enumeration-incomplete
    severity: material
    topic: public-program-roster
    missingEvidence: >-
      A complete current roster of active, inactive, and private-label partner programs with launch dates and current
      status.
    whyItMatters: >-
      The named-customer table is only a partial public roster, so concentration and breadth can still be distorted by
      unseen programs or recently ended contracts.
    diligencePath: >-
      Request an internal customer roster with program start dates, current status, and sector tags; reconcile it
      against the public roster and support-center inventory.
    relatedQuestionRefs:
      - QU001
      - QU025
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: blocking
    topic: program-usage
    missingEvidence: Partner-level active accounts, funded accounts, spend volume, activation rates, and utilization by brand.
    whyItMatters: >-
      Platform-level growth does not reveal whether adoption is broad-based or concentrated in one or two marquee
      programs.
    diligencePath: >-
      Ask for a partner dashboard with approved accounts, funded accounts, monthly active cards, and spend per active
      account for the top programs.
    relatedQuestionRefs:
      - QU018
    relatedTableRefs:
      - TU002
  - type: missing-source
    severity: blocking
    topic: retention-durability
    missingEvidence: Retention, churn, NRR, GRR, renewal, and satisfaction metrics by program or cohort.
    whyItMatters: >-
      The chapter can verify launch proof and usage incentives, but not whether cardholders or partners stay engaged
      over time.
    diligencePath: >-
      Request cohort retention, monthly active-card decay, partner renewal history, and any NPS or satisfaction
      reporting by program.
    relatedQuestionRefs:
      - QU020
    relatedTableRefs:
      - TU004
  - type: private-evidence-only
    severity: material
    topic: migration-economics
    missingEvidence: >-
      Contract length, migration timeline, commercial terms, and revenue share for partners switching from legacy
      issuers.
    whyItMatters: >-
      Without win-loss economics and contract duration, it is hard to determine whether migrations create durable value
      or just headline logos.
    diligencePath: >-
      Ask for one recent migration case study showing prior issuer, implementation timeline, economics, and measurable
      performance after launch.
    relatedQuestionRefs:
      - QU021
    relatedTableRefs:
      - TU005
  - type: missing-source
    severity: material
    topic: complaints-benchmarking
    missingEvidence: Complaint counts normalized by active-account base plus response and resolution rates by program.
    whyItMatters: >-
      A public complaints page is directionally adverse, but it cannot be translated into servicing quality without
      denominator and resolution data.
    diligencePath: >-
      Request internal complaint dashboards, CFPB or BBB tracking, first-response SLA, and resolution-time metrics
      broken out by major program.
    relatedQuestionRefs:
      - QU024
  - type: missing-source
    severity: material
    topic: partner-concentration
    missingEvidence: >-
      Top-partner share of revenue, receivables, cardholders, and spend, plus average contract term and renewal
      calendar.
    whyItMatters: >-
      The visible roster is broad enough to tell a growth story, but not precise enough to assess whether one partner
      could impair the business if it churned.
    diligencePath: Ask management for top-5 partner concentration metrics, issuer split, and the next 24 months of renewal dates.
    relatedQuestionRefs:
      - QU025
    relatedTableRefs:
      - TU005
  - type: missing-source
    severity: material
    topic: enforcement-and-litigation
    missingEvidence: >-
      A current legal docket and regulator-inquiry schedule specific to Imprint, its issuer-bank partners, and major
      card programs.
    whyItMatters: >-
      The public record did not surface a current enforcement or litigation matter, but absence from the reviewed pages
      is not strong evidence that no such matter exists.
    diligencePath: Request outside-counsel litigation summary, regulator correspondence log, and any threatened-claim schedule.
    relatedQuestionRefs:
      - QR015
  - type: private-evidence-only
    severity: material
    topic: uptime-and-incidents
    missingEvidence: Historical uptime, incident frequency, severity, and customer-impact metrics for the app and core servicing stack.
    whyItMatters: >-
      Policy disclosures are useful, but investors still need operational history to judge whether service risk is de
      minimis or simply undisclosed.
    diligencePath: Request incident log extracts, SLA history, postmortems, and partner-facing service credits or penalties.
    relatedQuestionRefs:
      - QR017
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: partner-renewals-and-concentration
    missingEvidence: >-
      Revenue, receivables, and cardholder concentration by partner plus contract terms, renewal dates, termination
      rights, and migration economics.
    whyItMatters: >-
      Logo breadth does not answer whether one or two partners dominate the economics or whether marquee programs are
      near renewal cliffs.
    diligencePath: Obtain top-partner concentration schedule, renewal calendar, and partner-NPS or scorecard data.
    relatedQuestionRefs:
      - QR023
      - QR028
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: funding-covenants-and-bank-oversight
    missingEvidence: >-
      Warehouse covenant package, ABS trigger pack beyond public reserve language, and issuer-bank exam findings or
      remediation items.
    whyItMatters: >-
      Public funding headlines show access, but they do not show how close Imprint might be to structural limits under
      stress.
    diligencePath: >-
      Request lender deck, covenant model, securitization trustee reports, and partner-bank compliance committee
      materials.
    relatedQuestionRefs:
      - QR029
    relatedTableRefs:
      - TR001
      - TR003
  - type: private-evidence-only
    severity: blocking
    topic: current-revenue-quality
    missingEvidence: Current recognized revenue, gross margin, retention, and cohort performance by partner program.
    whyItMatters: The valuation call currently rests on a stale public revenue estimate rather than a current operating bridge.
    diligencePath: Obtain the current board deck, monthly KPI pack, and an auditor-ready revenue-recognition bridge.
    relatedQuestionRefs:
      - QV028
    relatedTableRefs:
      - TV006
  - type: private-evidence-only
    severity: blocking
    topic: financing-terms
    missingEvidence: Preference stack, liquidation rights, ratchets, secondaries, and any investor-specific side-letter economics.
    whyItMatters: Headline valuation can materially overstate the actual economics available to new money.
    diligencePath: Review the Series D financing documents, capitalization table, and any side letters with counsel.
    relatedQuestionRefs:
      - QV029
    relatedTableRefs:
      - TV006
  - type: private-evidence-only
    severity: material
    topic: loss-sharing-and-funding-cost
    missingEvidence: Warehouse advance rates, reserve accounts, partner-bank loss waterfalls, and the current all-in cost of funds.
    whyItMatters: >-
      Without the funding and risk-sharing structure, investors cannot tell how much of the lender discount should apply
      to value.
    diligencePath: Run treasury and structured-finance diligence with partner-bank and securitization documentation.
    relatedQuestionRefs:
      - QV026
    relatedTableRefs:
      - TV005
      - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: private-valuation-comps
    missingEvidence: Recent private secondary marks, exact late-stage co-brand fintech rounds, and comparable financing terms.
    whyItMatters: >-
      The public comp set is useful for bounds, but a tighter private-market comparison would sharpen the
      stretched-versus-fair debate.
    diligencePath: >-
      Collect secondary quotes, private financing documents, and banker color on comparable co-brand or embedded-card
      financings.
    relatedQuestionRefs:
      - QV023
      - QV030
    relatedTableRefs:
      - TV004
