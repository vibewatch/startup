company:
  name: Imprint
chapter:
  number: 2
  title: Market Analysis
  summary: Imprint sits in a large but not cleanly isolated market at the intersection of US co-branded general-purpose cards, private-label/store-card migration, and the broader brand-embedded-finance toolchain. Public evidence supports meaningful demand and clear buyer logic, but no reviewed source isolates a standalone TAM or serviceable share for third-party co-brand platforms, so sizing should rely on constrained proxy lenses rather than a single top-down market claim.
sections:
- id: market-boundary-and-adjacencies
  title: Market boundary, adjacencies, and status-quo substitutes
  body: 'Imprint''s market is narrower than generic "embedded finance" and broader than legacy store cards alone. CFPB defines co-brand cards as general-purpose cards that carry both a network badge and a merchant brand, while private-label cards lack network branding and remain limited to one merchant or a closely related merchant group. The same CFPB report also makes clear that retail cards span both private-label and retail co-brand products, and that some dual-network merchant cards behave like general-purpose cards when used outside the merchant. Bain is useful as an adjacency lens rather than a direct market definition: it explicitly excludes cobranded credit cards from embedded finance because they are not embedded into the native digital journey, but it still shows why platforms that own the customer relationship can capture more of the value chain. Imprint''s own positioning sits in that intersection. Its site says brands were historically stuck with legacy stacks or inflexible
    financial institutions, and it markets a platform that can run credit cards, deposits, installment loans, underwriting, and rewards in one brand-controlled experience. For this chapter, the core market is US co-branded general-purpose cards and the migration pool around private-label/store cards; the broader brand-embedded finance toolchain is treated as a relevant adjacency, not a substitute TAM.'
  claimRefs:
  - CM001
