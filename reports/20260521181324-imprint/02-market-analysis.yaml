- calloutType: risk
  title: Private-label pain points explain the opportunity and the downside
  body: The same evidence that shows room for co-brand modernization also shows why underwriting and program economics matter. High APRs, minimum-payment growth, deferred-interest usage, and BNPL substitution can all make merchant-card economics fragile if a partner treats the card as a blunt acquisition tool instead of a carefully designed loyalty product.
