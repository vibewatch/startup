- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Shift from private label toward broader-use co-brand products
    - positive
    - Current
    - Creates a migration pool for platforms promising better loyalty and everyday relevance
    - Which categories are still converting from store-card models to open-loop co-brand?
  - - Cash-back and loyalty-linked rewards dominate current offers
    - positive
    - Current
    - Brands need differentiated rewards funding and redemption design rather than generic financing only
    - Which partner sectors can economically support richer rewards?
  - - Platforms that own customer relationships gain embedded-finance leverage
    - positive
    - Medium-term
    - Supports Imprint's brand-native software thesis
    - How much control do brands really demand over UX, data, and underwriting?
  - - Large incumbents such as Synchrony prove scale but intensify competition
    - mixed
    - Current
    - Opportunity is real, but incumbents already operate large partner ecosystems
    - Where can Imprint win against incumbent issuers on speed, economics, or UX?
  - - APR, minimum-payment, and fee burdens raise consumer and regulatory risk
    - negative
    - Current
    - Aggressive economics can damage brand trust and regulatory posture
    - What guardrails do brand partners require on pricing and repayment behavior?
  - - Deferred-interest financing remains useful but controversial
    - mixed
    - Current
    - Helps high-ticket merchants convert sales but raises replay and regulatory issues
    - Will Imprint lean toward installment products instead of classic deferred-interest structures?
  - - BNPL competes directly at checkout for many retail financing use cases
    - negative
    - Current
    - Some merchant categories may prefer lighter-weight financing than a revolving card
    - Which verticals still need a full card versus BNPL or installment-only products?
  - - Partnership execution demands aligned economics and underwriting discipline
    - negative
    - Current
    - Programs can fail if declines are too high or rewards economics are misaligned
    - How are partner approvals, decline rates, and risk thresholds negotiated?
  - - Merchant programs are still being relaunched in 2026
    - positive
    - Current
    - Switching and refresh activity means the category is not frozen
    - How many mature brands are actively reviewing card-platform vendors now?
  notes: This table mixes growth drivers with constraints because the same categories that produce strong loyalty economics can also carry underwriting, pricing, and regulatory downside.
