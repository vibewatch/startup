- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Budget owner
  - Adoption trigger
  rows:
  - - General merchandise retail
    - Loyalty, merchandising, or payments leader
    - Frequent shopper seeking instant savings
    - Issuer funds credit; brand funds rewards; consumer may pay interest if revolving
    - App or checkout offer -> wallet use -> repeat baskets -> rewards redemption
    - Marketing, CRM, or loyalty budget
    - High shopping frequency plus visible savings
  - - Travel loyalty (airline / hotel)
    - Loyalty and ancillary-revenue team
    - Traveler seeking points, miles, or status
    - Issuer funds credit; brand funds loyalty value; consumer may pay annual fee
    - Enrollment -> everyday spend -> points accrual -> travel redemption or tier progress
    - Loyalty and ancillary-revenue budget
    - Frequent travel or elite-status aspiration
  - - Fuel and mobility
    - Fuel rewards or payments team
    - Driver seeking category rewards and app-linked savings
    - Issuer funds receivables; brand funds statement credits or loyalty stack
    - Forecourt acquisition -> app or wallet link -> broader everyday spend -> pump redemption
    - Fuel rewards and retention budget
    - Routine mobility spend and simple wallet integration
  - - Digital commerce / membership
    - Growth, subscriptions, or marketplace team
    - Member seeking category cash back and fast redemption
    - Issuer funds credit; merchant funds elevated category rewards
    - Stored credential -> online checkout -> category cash back -> next-purchase redemption
    - Membership and LTV owner
    - High-frequency ecommerce behavior
  - - High-ticket retail financing
    - Credit or merchandising team
    - Shopper financing a larger purchase
    - Issuer relies on promotional financing economics; consumer bears repayment risk
    - Point-of-sale offer -> promotional period -> revolve or repay -> intermittent reuse
    - Retail credit or promo budget
    - Need for financing on larger baskets
  - - Legacy private-label store cards
    - Retail credit partner and merchant operations
    - Price-sensitive shopper with merchant attachment
    - Consumer interest economics and merchant promotions matter more than off-merchant spend
    - Checkout offer -> single-merchant use -> repeat only if shopping cadence stays high
    - Retail credit and store-ops budget
    - When BNPL or a general-purpose card is less attractive
  notes: Rows map the buyer-user-payer structure that current public card offers imply; they do not disclose private commercial terms such as interchange sharing or marketing subsidy rates.
