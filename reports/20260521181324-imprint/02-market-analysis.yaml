- id: growth-drivers-constraints-and-gaps
  title: Growth drivers, adoption constraints, and the remaining diligence gaps
  body: 'The adoption case for modern co-brand platforms is real, but so are the brakes. On the positive side, Bain argues that platforms owning the customer relationship sit in the strongest position as commerce and financial services converge, and Imprint explicitly sells underwriting, rewards, and program control as one stack. CFPB also shows that cash-back cards have become the leading general-purpose format, while private-label applications and originations have declined materially over time, partly because issuers and merchants have shifted toward broader-use co-brand products. PaymentsJournal adds that private label has been losing traction while co-brand opportunities remain open for smaller or niche issuers. The negative side is equally important. CFPB says general-purpose APRs averaged 25.2 percent in 2024 and private-label APRs 31.3 percent, minimum-payment behavior worsened, and over $70 billion of purchases ran through deferred-interest plans that are closely tied to private-label
    and retail co-brand cards. Roundtables then adds BNPL as a direct checkout substitute and flags possible APR-cap or interchange-rule changes as profitability threats. Finally, one of the biggest chapter-level diligence gaps is not demand but disclosure: public sources still do not reveal exact brand revenue share, interchange allocation, or the serviceable share a player like Imprint can take from incumbent issuers and in-house brand stacks. Those missing economics matter more than any generic top-down TAM slide.'
