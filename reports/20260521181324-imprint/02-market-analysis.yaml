  evidenceGaps:
  - type: missing-source
    severity: material
    topic: standalone-tam
    missingEvidence: A public source that isolates a TAM, SAM, or SOM specifically for third-party co-brand card platforms rather than the broader US credit-card or embedded-finance market.
    whyItMatters: Without a direct category total, valuation work must rely on proxy lenses and more conservative penetration assumptions.
    diligencePath: Request category studies or internal market-sizing decks from management and compare them against issuer portfolio data and partner-category spend.
    relatedQuestionRefs:
    - QM010
  - type: private-evidence-only
    severity: material
    topic: brand-unit-economics
    missingEvidence: Program-level disclosure on interchange sharing, revenue share, marketing subsidy, and partner-funded rewards economics.
    whyItMatters: These terms determine whether a co-brand platform creates durable margin for the issuer, the brand, and the platform at the same time.
    diligencePath: Ask for anonymized partner economics, launch cohorts, and a sample program P&L in management diligence.
    relatedQuestionRefs:
    - QM024
  - type: private-evidence-only
    severity: material
    topic: serviceable-share
    missingEvidence: Evidence on how much share Imprint can realistically win from incumbent issuer-processors, in-house brand stacks, and non-card substitutes by segment.
    whyItMatters: Serviceable share drives the difference between a large narrative market and a credible valuation underwriting case.
    diligencePath: Obtain pipeline conversion data, win-loss notes versus incumbent issuers, and cohort data on program migrations or relaunches.
    relatedQuestionRefs:
    - QM025
