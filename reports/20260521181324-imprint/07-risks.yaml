callouts:
  - calloutType: risk
    title: Bank and capital dependency remain the core residual risk
    body: The public evidence is strongest on funding access and program wins, but the same evidence shows that Imprint still depends heavily on issuer banks, warehouse lenders, ABS investors, and external network rails to keep the engine running.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR011
      - CR014
      - CR021
  - calloutType: insight
    title: Control visibility is better than performance visibility
    body: Imprint publishes meaningful security and resilience controls, yet the public record is still thin on hard uptime statistics, complaint-resolution SLAs, covenant headroom, and renewal economics.
    claimRefs:
      - CR027
      - CR028
      - CR033
      - CR034
      - CR049
  - calloutType: assumption
    title: Treat migration proof as necessary but not sufficient
    body: New wins like Shell and Rakuten reduce the fear that Imprint cannot win enterprise programs, but they do not by themselves prove low concentration, smooth execution, or stable margins through a downturn.
    claimRefs:
      - CR035
      - CR038
      - CR040
      - CR044
      - CR048
