  evidenceGaps:
    - type: missing-source
      severity: material
      topic: enforcement-and-litigation
      missingEvidence: A current legal docket and regulator-inquiry schedule specific to Imprint, its issuer-bank partners, and major card programs.
      whyItMatters: The public record did not surface a current enforcement or litigation matter, but absence from the reviewed pages is not strong evidence that no such matter exists.
      diligencePath: Request outside-counsel litigation summary, regulator correspondence log, and any threatened-claim schedule.
      relatedQuestionRefs:
        - QR015
    - type: private-evidence-only
      severity: material
      topic: uptime-and-incidents
      missingEvidence: Historical uptime, incident frequency, severity, and customer-impact metrics for the app and core servicing stack.
      whyItMatters: Policy disclosures are useful, but investors still need operational history to judge whether service risk is de minimis or simply undisclosed.
      diligencePath: Request incident log extracts, SLA history, postmortems, and partner-facing service credits or penalties.
      relatedQuestionRefs:
        - QR017
      relatedTableRefs:
        - TR002
    - type: private-evidence-only
      severity: material
      topic: partner-renewals-and-concentration
      missingEvidence: Revenue, receivables, and cardholder concentration by partner plus contract terms, renewal dates, termination rights, and migration economics.
      whyItMatters: Logo breadth does not answer whether one or two partners dominate the economics or whether marquee programs are near renewal cliffs.
      diligencePath: Obtain top-partner concentration schedule, renewal calendar, and partner-NPS or scorecard data.
      relatedQuestionRefs:
        - QR023
        - QR028
      relatedTableRefs:
        - TR003
    - type: private-evidence-only
      severity: material
      topic: funding-covenants-and-bank-oversight
      missingEvidence: Warehouse covenant package, ABS trigger pack beyond public reserve language, and issuer-bank exam findings or remediation items.
      whyItMatters: Public funding headlines show access, but they do not show how close Imprint might be to structural limits under stress.
      diligencePath: Request lender deck, covenant model, securitization trustee reports, and partner-bank compliance committee materials.
      relatedQuestionRefs:
        - QR029
      relatedTableRefs:
        - TR001
        - TR003
