      - CR049
    tableRefs:
      - TR003
    figureRefs:
      - FR001
      - FR002
  - id: issuer-regulatory-and-compliance-dependency
    title: Issuer, regulatory, and compliance dependency
    body: >-
      Imprint's operating model still rides on bank and regulatory scaffolding that it does not fully control. Public help pages, partner pages, and the CFPB agreement database show that many visible programs sit under First Electronic Bank, while Shell and some other examples use First Bank & Trust. That is better than pure single-bank dependence, but the structure still concentrates key compliance, origination, and sponsorship functions at a small number of banks. The interagency Federal Reserve, FDIC, and OCC guidance makes the implication clear: banks do not outsource away safe-and-sound or legal responsibilities by using fintech partners, and higher-risk relationships warrant deeper due diligence on complaints, information security, financial condition, and contingency planning. Imprint's own materials reinforce how close it sits to the regulated perimeter. H-E-B says Imprint handles origination, cardholder experience, rewards, technology, compliance, and ongoing program
      management, while management is quoted saying the company is effectively building a bank. That combination raises regulatory dependency risk even without a specific public enforcement action in hand.
    claimRefs:
      - CR014
