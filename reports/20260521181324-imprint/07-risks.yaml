  - id: partner-concentration-renewals-and-competition
    title: Partner concentration, renewals, and competition
    body: >-
      Imprint has enough public wins to prove that it can matter in co-brand cards, but not enough disclosure to prove that those wins are diversified or durable. The company and its partners show live or launching programs across H-E-B, Rakuten, Turkish Airlines, Holiday Inn Club Vacations, Shell, Westgate, Booking.com, and others, and Shell's 2026 migration is especially important because it shows Imprint still taking share from legacy issuer setups. PYMNTS also reports that the Rakuten mandate was won against incumbent issuers such as JPMorgan, Capital One, Synchrony, Barclays, and U.S. Bank, which confirms the competitive set is formidable. Series D materials strengthen the narrative by claiming 200% cardholder growth, more new partner wins, AAA validation on the inaugural securitization, and better migrated-program wallet share and spend. Even so, public evidence still does not disclose revenue concentration by brand, contract durations, renewal dates, or partner-level economics.
      That means logo breadth should be treated as evidence of demand, not evidence that concentration and renewal risk are small.
