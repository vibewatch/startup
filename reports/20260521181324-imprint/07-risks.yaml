company:
  name: Imprint
chapter:
  number: 7
  title: Risks
  summary: Imprint's highest residual risks are concentrated in credit and funding dependence, issuer-bank and regulatory dependency, and partner concentration under a still-opaque renewal and covenant picture. Public sources also show meaningful mitigants — ABS execution, fresh equity, multiple issuer banks, and published security controls — but service-quality complaints, fee-rule uncertainty, and limited disclosure on burn, renewals, and bank oversight keep the chapter firmly risk-first.
sections:
  - id: credit-funding-and-macro-sensitivity
    title: Credit, funding, and macro sensitivity
    body: >-
      The financing stack looks real, but it is not yet low-risk. Imprint has public proof of a March 2025 $500 million warehouse facility and says that lifted total lending capacity to about $1 billion, while Fitch's 2025 presale confirms that an inaugural credit-card ABS trust is already in market. That is stronger funding evidence than most private fintechs offer. The flip side is that Fitch also frames the portfolio as relatively unseasoned and concentrated, with rising 60+ day delinquencies from May to August 2025 and a 9.50% steady-state charge-off assumption. Public support for margin resilience is therefore conditional rather than absolute. The transaction also carries interest-rate mismatch and a reserve-account trigger tied to excess spread, so liquidity flexibility can narrow exactly when credit stress rises. Fresh Series D equity helps, but public sources still do not disclose burn, runway, or covenant headroom, so macro weakness and funding repricing remain core thesis
      risks rather than solved problems.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR009
      - CR010
