  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner or diligence path
    rows:
      - - 2026 revenue-quality bridge
        - Recognized revenue, gross margin, NRR, cohort retention, and mix between interest, interchange, and servicing
        - The recommendation turns on denominator quality more than on brand proof.
        - Finance data room, board deck, and auditor-ready KPI bridge.
      - - Funding stack and loss-sharing
        - Warehouse advance rates, reserve structures, ABS economics, and bank-partner loss waterfalls
        - Capital intensity cannot be priced correctly without knowing who absorbs losses and at what cost.
        - Treasury and capital-markets diligence plus partner-bank legal review.
      - - Cap table and preferences
        - Liquidation preferences, MFN clauses, ratchets, secondaries, and dilution waterfall
        - Headline valuation can overstate investable economics for new money.
        - Counsel review of financing documents and side letters.
      - - Partner concentration and renewals
        - Revenue, receivables, and renewal dates by partner program
        - A platform narrative is weaker if one or two logos still dominate outcomes.
        - Commercial diligence and program-level portfolio cuts.
      - - Customer-service quality
        - Complaint trends, SLA data, servicing staffing, and remediation metrics by program
        - Service failures can damage brand renewals and compress value before financials catch up.
        - Operations diligence and complaint / QA review.
    notes: >-
      The diligence asks are intentionally geared to the variables that can move the valuation call, not to general
      company-curiosity questions.
