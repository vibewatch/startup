  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend or usage
      - Excluded spend or usage
      - Buyer / payer logic
      - Relevance to Imprint
    rows:
      - - General-purpose co-brand cards
        - Network-branded cards carrying a merchant or loyalty brand and usable across many merchants
        - Generic issuer cash-back cards without a merchant brand
        - Brand sponsors the program; issuer funds receivables; consumers pay interest or fees when they revolve
        - Core market
      - - Private-label or store cards
        - Cards usable only at one merchant or a related merchant group on a private network
        - Open-loop co-brand cards usable broadly off-merchant
        - Merchant promotion and consumer financing economics dominate
        - Direct substitute and migration pool
      - - Dual-network retail cards
        - Merchant-branded cards that route privately in-store but over a general-purpose network elsewhere
        - Pure closed-loop store cards
        - Brand wants merchant relevance plus broader everyday utility
        - Bridge format between private label and co-brand
      - - Embedded-finance adjacency
        - Brand-linked payments, lending, or account products delivered through nonfinancial platforms
        - Standalone fintech or bank products that are financial institutions at the core
        - Platform owns customer relationship while regulated entities provide rails
        - Important adjacency, not a one-for-one TAM substitute
      - - Status-quo substitutes
        - Generic cash-back cards, BNPL at checkout, and legacy issuer-led loyalty cards
        - Merchant-branded programs with explicit sponsor control
        - Brands compare against default consumer wallet behaviors and checkout financing tools
        - Competes for the same loyalty and payment budget
    notes: >-
      The chapter treats US general-purpose co-brand cards as the core market, private-label/store cards as the main
      substitute and migration pool, and embedded finance as an adjacent value-chain lens rather than a direct TAM
      replacement.
