  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitor classes
        blocks:
          - type: paragraph
            body: >-
              Imprint is not competing in a single lane. The closest direct peer in the reviewed source set is Cardless,
              because both companies sell embedded co-branded card experiences that live inside the brand's own app or
              website rather than redirecting the customer to a bank-owned interface. Marqeta and Stripe matter
              differently: they are not fully formed loyalty operators in the same way, but they let a bank, fintech, or
              brand assemble much of the issuing stack in-house and therefore shrink the distance between a
              processor-first build and a full-stack provider. At the other end of the market sit legacy issuers and
              merchant-finance incumbents such as Synchrony, Bread Financial, Citi, Barclays, Chase, and Capital One,
              which bring balance sheets, compliance muscle, acquisition channels, and existing partner portfolios. BNPL
              is also a real substitute. Affirm does not replicate open-loop co-brand economics, but it competes for the
              merchant use case where the brand mainly wants checkout conversion and pay-over-time rather than a
              long-lived card relationship. The practical takeaway is that Imprint must beat fintech challengers on UX
              and speed while also prying relationships away from institutions that already own scale, funding, and
              trust.
