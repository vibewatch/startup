  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation stays cautious because genuine traction and funding proof are outweighed by disclosure and
      multiple-support gaps at the current price.
    data:
      nodes:
        - id: traction
          label: Traction proof
          detail: Series D, 200% cardholder growth, and Rakuten / Shell style wins show the platform is real.
          tone: positive
        - id: capital
          label: Capital-markets proof
          detail: Warehouse lines and an upsized AAA ABS show outside funding access.
          tone: positive
        - id: multiple
          label: Public multiple gap
          detail: The public revenue bridge implies roughly 17.1x sales, far above issuer and substitute comps.
          tone: warning
        - id: disclosure
          label: Disclosure gap
          detail: Current recognized revenue, margin, loss-sharing, and preference terms are still missing publicly.
          tone: warning
        - id: credit
          label: Credit-cycle burden
          detail: The business carries real loan losses, funding costs, and complaint risk rather than pure software margins.
          tone: warning
        - id: decision
          label: Decision
          detail: Research-more with a stretched stance until the revenue and terms bridge becomes visible.
          tone: neutral
      edges:
        - from: traction
          to: decision
        - from: capital
          to: decision
        - from: multiple
          to: decision
        - from: disclosure
          to: decision
        - from: credit
          to: decision
