        title: Expansion, migration, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Imprint's expansion case is easy to explain publicly: marquee brands are willing to launch or migrate to a
              program architecture that promises faster launches, more control over rewards, and a better digital
              customer experience than legacy bank stacks. CNBC's Rakuten reporting and Finextra's funding coverage both
              frame the company as a replacement path for older bank-issued programs, not just a vendor for greenfield
              launches. But the concentration question is still unresolved. Public proof skews heavily toward
              consumer-facing brands in travel, grocery, retail, and vacation categories, and most visible programs
              still point to First Electronic Bank as issuer. That means partner concentration, issuer concentration,
              and vertical concentration all remain plausible risks even though public sources do not quantify them. In
              effect, launch proof and category breadth are solid; measured concentration, contract economics, and
              renewal durability are not. Those missing disclosures should be treated as diligence blockers rather than
