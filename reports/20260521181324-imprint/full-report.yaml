companyProfile:
  summary: >-
    Imprint is a private New York fintech founded in 2020 that sells a brand- native platform for co-branded cards,
    loyalty experiences, and adjacent financial products. Public sources support a model centered on ImprintCore,
    partner-brand distribution, issuer-bank relationships, and warehouse plus securitization funding rather than on a
    pure software subscription model. The company has moved from early-stage financing into a $1.2 billion Series D
    valuation with live programs across travel, grocery, fuel, retail, and rewards brands, but current board, cap-table,
    headcount, and profit disclosure remain incomplete.
