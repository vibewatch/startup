      - number: '4.2'
        title: Traction and unit-economics signals
        blocks:
          - type: paragraph
            body: >-
              The best public unit-economics evidence is indirect but still useful. Imprint's own products page
              highlights one-week launch speed for Holiday Inn Club Vacations, a 60% active rate for Turkish Airlines
              cardholders, and 41% higher resort spend among cardholders than non-cardholders at Westgate Resorts. The
              Series D announcement adds broader portfolio-level proof points: 200% year-over-year cardholder growth, 2x
              higher wallet share, 8x higher lifetime value, and 20% more spend than prior programs for migrated brands.
              Those are company-claimed metrics, so they cannot stand in for audited revenue or margin, but they matter
              because they point to why enterprise partners might renew and expand. Fitch provides the closest public
              look at receivable-level economics: August 2025 trust metrics show 29.79% gross yield, 6.73% gross
              charge-offs, and a 34.26% monthly payment rate. In other words, Imprint's economics are not just SaaS-like
              software fees; they are deeply tied to credit performance, reward design, servicing, and funding. The gap
              is that no reviewed public source discloses CAC, payback, contribution margin, or net revenue after
              rewards and credit costs, so the chapter can frame the margin path but cannot prove it.
