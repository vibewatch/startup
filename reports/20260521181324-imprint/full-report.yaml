  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Roster and customer segmentation
        blocks:
          - type: paragraph
            body: >-
              Imprint's visible customers are consumer brands, but the practical users and payers in every public
              program are end-cardholders spending inside a brand-owned loyalty loop. The roster that Imprint publishes
              publicly spans grocery banners such as H-E-B and Central Market; travel programs such as Booking.com and
              Turkish Airlines; cashback and rewards ecosystems such as Rakuten and Fetch; specialty retail brands such
              as Brooks Brothers, CB2, and Crate & Barrel; resort and vacation brands such as Westgate and Holiday Inn
              Club Vacations; and niche enthusiast commerce through Horizon Hobby. That mix indicates broad vertical
              coverage, but also a very specific go-to-market model: brand partners distribute the card, while consumers
              remain the spending customer. The reviewed set did not surface public SMB, enterprise, or standalone
              software buyers, so the customer story here is overwhelmingly co-brand consumer distribution rather than
              direct SaaS sales. Public materials also show a narrow issuer base, which matters for concentration
              analysis.
