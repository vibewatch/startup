      - number: '2.2'
        title: Evidence-constrained sizing and observable demand signals
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports large demand signals, but not a clean standalone TAM for third-party co-brand
              platforms. CFPB says US consumer credit card purchase volume reached $3.6 trillion in 2024 and card
              balances exceeded $1.2 trillion, while Federal Reserve G.19 shows $1.327 trillion of revolving consumer
              credit outstanding as of March 2026. CFPB also reports about 195 million consumers with general-purpose
              cards and 105 million with private-label cards, which frames the user base and migration pool better than
              any single consultant TAM. A more relevant vertical proxy comes from Synchrony, the clearest public
              incumbent benchmark in merchant cards: it financed more than $182 billion of purchase volume in 2024,
              ended the year with $104.7 billion of receivables, and reported 71.5 million active accounts. Bain's
              embedded-finance work broadens the adjacency lens further, estimating $22 billion of US
              platform-and-enabler revenue in 2021 and $51 billion by 2026, alongside transaction value moving from $2.6
              trillion to more than $7 trillion. But Bain simultaneously excludes cobrand cards from the core
              embedded-finance definition. The right read for valuation is therefore not a single generic TAM number.
              Imprint participates in a large card-and-loyalty demand pool with a meaningful embedded-finance adjacency,
              yet public sources still force the chapter to use multiple constrained sizing lenses instead of a clean
              TAM/SAM/SOM stack.
            claimRefs:
