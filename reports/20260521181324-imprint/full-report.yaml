      - number: '4.3'
        title: Funding structure and capital dependency
        blocks:
          - type: paragraph
            body: >-
              Imprint's capital stack is much easier to verify than its current P&L. Public announcements and Fitch
              materials show a three-layer funding model: equity capital for platform and product expansion, warehouse
              lending to grow card receivables, and securitization to recycle those receivables into a repeatable
              capital-markets program. The March 2025 warehouse facility added $500 million and took total lending
              capacity to about $1 billion. Seven months later, the company placed a $300 million inaugural ABS deal
              that was upsized from a $200 million target, complementing warehouses rather than replacing them. Fitch's
              presale and final rating reports matter because they show what the public press releases leave out: the
              trust structure was created in October 2023, the collateral pool includes co-branded Visa, Mastercard, and
              American Express receivables, receivables are originated through partner banks, and reserve,
              overcollateralization, and excess-spread triggers matter to ongoing funding flexibility. This is
              meaningful progress, but it still leaves Imprint more funding-dependent than deposit-funded incumbents
              such as Synchrony, which finance most of their book with deposits rather than warehouse lines and term
              ABS.
