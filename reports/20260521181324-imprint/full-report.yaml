      - number: '1.2'
        title: Founders, leadership bench, and geographic footprint
        blocks:
          - type: paragraph
            body: >-
              The reviewed source set supports a clear founder anchor but a thinner governance picture. Daragh Murphy is
              consistently identified as founder and CEO, and McKinsey’s interview with him ties the company’s origin to
              an explicit thesis that legacy co-brand card technology was outdated. Gaurav Ahuja appears both as
              cofounder and chair, with McKinsey describing Thrive Capital as the original incubation partner and Tracxn
              also naming Michael Pechman as a cofounder. On the current management bench, the official about page lists
              a fairly complete senior functional roster across business, capital markets, revenue, technology, risk,
              compliance, and product. That is a positive coverage signal because this company touches underwriting,
              issuance, partner sales, and regulated credit operations at the same time. The location footprint is more
              concentrated than the national brand list might imply: Imprint publicly names New York, San Francisco, and
              Seattle, while most current financing coverage simply calls the company New York-based. The gap is
              governance disclosure. The public materials reviewed here do not provide a full board roster, ownership
              breakdown, voting rights map, or key-man succession framework, so key-person dependency is still centered
              heavily on Murphy and the founder-investor relationship with Ahuja.
