      - number: '8.3'
        title: >-
          Scenario logic: stretched is the default public read, while fair requires a revenue and terms bridge that is
          still missing
        blocks:
          - type: paragraph
            body: >-
              The upside case for Imprint is not fantasy. If partner additions continue, the Shell transition sticks,
              and current revenue has already scaled far beyond the public $70 million 2024 estimate while trust metrics
              remain inside a healthy range, the Series D could eventually look merely demanding. The problem is that
              none of those underwriting-critical bridges is yet visible in public evidence. The base case therefore has
              to stay close to the currently observable file: real brand wins, real capital-markets progress, genuine
              credit exposure, high sector APRs, and thin company disclosure. On that lens the $1.2 billion mark looks
              stretched. The bear case does not require brand demand to collapse; it only requires consumer-credit
              conditions to worsen, concentration to persist, or funding and servicing friction to rise faster than
              revenue. That is why entry discipline matters more than simple company quality. A good company can still
              be a poor public-only entry if the denominator, the loss waterfall, and the preference stack remain
              opaque.
