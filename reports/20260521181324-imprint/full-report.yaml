      - number: '2.3'
        title: Buyer, user, payer, and adoption mechanics
        blocks:
          - type: paragraph
            body: >-
              The consistent pattern across live card programs is that the buyer is usually a brand or loyalty owner,
              the user is the consumer, and the payer is shared across issuer funding, brand-funded rewards, and
              consumer interest economics. What changes by segment is the consumer hook and the repeat-use logic. Target
              and Amazon lean on immediate savings or cash back for everyday retail behavior. Hyatt, Hilton, Delta, and
              Marriott tie card use to points, miles, free nights, or status progression, making the card part of a
              broader loyalty ladder rather than just a checkout discount. Shell's 2026 relaunch is especially relevant
              for Imprint because it shows a fuel program moving beyond fuel-only savings into broader grocery and
              dining rewards while still keeping the merchant identity at the center. Deloitte's framework explains why
              this matters: partnership cards work better when they reinforce recurring spend and personalized
              redemption instead of only a one-time financing offer. That logic makes frequent-spend categories with
              strong membership or loyalty data far more attractive than occasional big-ticket purchases that only need
              promotional credit. The result is a buyer map where retail, travel, fuel, and high-frequency digital
              commerce appear better aligned with Imprint's brand-native value proposition than purely transactional or
              infrequent purchase categories.
