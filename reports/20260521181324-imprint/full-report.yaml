  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Credit deterioration
        - Trust delinquencies, charge-offs, and reserve funding
        - >-
          Delinquencies keep climbing, charge-offs move above Fitch's base case, or the reserve funds after excess
          spread drops below 2%.
        - Re-cut downside economics, tighten valuation, and demand updated performance tapes before adding exposure.
      - - Funding pressure
        - Warehouse renewals, ABS issuance cadence, and disclosed credit lines
        - A major facility is not renewed, securitization access slips, or disclosed credit capacity stops growing.
        - Treat as a thesis-break unless private liquidity data show replacement funding.
      - - Issuer or regulatory stress
        - Bank guidance, late-fee rule status, or issuer-bank posture
        - A partner bank pauses originations, pricing changes materially, or regulatory findings hit the program.
        - Pause underwriting until economics, oversight, and remediation plans are re-understood.
      - - Partner concentration or renewal break
        - Migration milestones and marquee-program continuity
        - Shell or another top visible brand experiences a failed migration, delayed launch, or non-renewal.
        - Assume weaker distribution durability and cut growth expectations sharply.
      - - Service and reputation drift
        - BBB complaints and app-review friction
        - Complaint volume rises, statement errors recur, or onboarding and identity checks stay visibly broken.
        - Demand complaint-SLA evidence and treat customer-experience deterioration as a material quality signal.
    notes: >-
      These triggers are public-monitoring proxies; they do not replace private covenant packs, partner scorecards, or
      complaint dashboards.
