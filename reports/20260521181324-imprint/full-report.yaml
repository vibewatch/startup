      - number: '7.4'
        title: Service, operational, and reputational risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, the public picture is mixed rather than weak. Imprint's trust center describes monitoring,
              business-continuity testing, backup restoration, and formal incident-response processes, while Google Play
              says the consumer app supports PCI DSS controls, two-factor authentication, biometrics, and wallet
              provisioning. Those are useful mitigants. Yet the strongest independent evidence on day-to-day service
              quality is not the trust center but the customer channel. Apple's App Store still shows a very high
              aggregate rating, but the review text includes recurring complaints about onboarding loops,
              identity-verification friction, budgeting-app limitations, migration-induced statement issues, and
              account-closure frustration. BBB also shows a nontrivial complaints surface, with 56 complaints closed in
              the last 12 months. None of that proves a structural failure rate, because public sources do not provide
              normalization by active accounts or resolution speed. It does, however, mean service and reputational risk
              should be treated as real residual exposure until private diligence can show stable migration quality,
              complaint closure discipline, and incident history.
