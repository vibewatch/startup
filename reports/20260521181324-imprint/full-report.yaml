      - number: '8.2'
        title: >-
          Price context: the public multiple gap is large, and the business deserves a capital-intensity discount until
          disclosure improves
        blocks:
          - type: paragraph
            body: >-
              Using the $1.2 billion Series D anchor against Sacra’s $70 million 2024 revenue estimate yields an implied
              trailing revenue multiple of about 17.1x. That is difficult to defend on a public-only basis. Public
              issuer comps with clearer funding and disclosure profiles screen far lower: Bread Financial at 1.32x
              sales, Synchrony at 2.41x, Capital One at 3.14x, and American Express at 3.07x. Even substitute fintech
              models with more software-like or growth-heavy narratives screen below Imprint’s public bridge: Marqeta at
              2.54x, Block at 1.69x, and Affirm at 5.67x. The qualitative reason the gap matters is that Imprint looks
              more like a lender-plus-loyalty platform than a pure SaaS asset. Fitch’s trust data, the warehouse
              facility, and Murphy’s comments about bank ownership all point to a business where funding mix, credit
              losses, and regulation matter to value. Until the company discloses current recognized revenue and cleaner
              economics, the price is easier to explain as private scarcity than as publicly supported fair value.
