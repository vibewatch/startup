  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation: real traction, real capital access, but still a research-more call at the Series D price'
        blocks:
          - type: paragraph
            body: >-
              Imprint is no longer a speculative slideware story. Public sources show a $150 million Series D at a $1.2
              billion valuation, 200% year-over-year cardholder growth, new Rakuten, Booking.com, Crate & Barrel, and
              Fetch launches, a $500 million warehouse facility that lifted lending capacity to about $1 billion, and an
              inaugural ABS that was upsized from $200 million to $300 million. CNBC and Shell add useful outside proof
              that brands are willing to move high-profile programs away from incumbent banks. That is the core thesis:
              Imprint appears to be winning real brands with a modern, brand-native co-brand stack. The anti-thesis is
              price support. The best public revenue anchor remains Sacra’s $70 million 2024 estimate, the about page
              still shows stale funding language, and the public record still lacks current recognized revenue, gross
              margin, loss-sharing, and cap-table terms. That combination supports research-more with medium confidence,
              high risk, and a stretched valuation stance rather than buy.
            claimRefs:
