      - number: '3.4'
        title: Switching cost, moat durability, and competitive risk
        blocks:
          - type: paragraph
            body: >-
              Imprint's moat is strongest where a brand wants one operator to own application flow, servicing
              experience, rewards logic, and adjacent products in a brand-native surface. On that axis it looks closer
              to Cardless than to a processor-first vendor, and it can argue for more finished product ownership than
              Marqeta or Stripe. But the moat is not unassailable. Shell shows a brand is willing to replatform when a
              new operator promises broader everyday relevance and better digital account management, while American
              Airlines shows incumbents can also use renewal cycles to consolidate portfolios and reclaim share. In
              other words, switching costs are material but episodic: hard to overcome mid-contract, very real at rebid.
              The other risk is commoditization. Infrastructure vendors keep pulling more issuing and compliance
              capability into configurable stacks, which could narrow the gap between a full-stack provider and a brand
              with enough engineering or bank support. Finally, the regulatory burden does not disappear on either side.
              CFPB enforcement and complaint data show large incumbents still face scrutiny, while high private-label
              APRs and cardholder pressure keep the category exposed to policy and reputational risk.
