      - number: '6.2'
        title: Named customer proof and production status
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence in this chapter is not generic brand-logo placement but partner-owned pages that
              support real acquisition or servicing flows. H-E-B and Central Market publish launch details, application
              routes, and immediate-virtual-card language. Rakuten and Fetch both launched U.S. American Express
              products with explicit issuer and program-manager disclosures. Booking.com, Turkish Airlines, Brooks
              Brothers, Westgate, Holiday Inn Club Vacations, and Horizon Hobby all maintain product or support pages
              describing card benefits, signup mechanics, or post-approval servicing. Imprint's own help center ties
