        title: Milestones, caution flags, and the remaining diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a company moving quickly from startup funding into institutionally financed
              credit operations. Early rounds in 2021 and 2023 set up the platform build, 2024 brought the first clearly
              disclosed late-stage valuation anchor, and 2025 added both warehouse and securitization capacity alongside
              a new partnership wave. The partner pages for Shell, Booking.com, Rakuten, and Fetch support the argument
              that Imprint is not just selling a processor but trying to tailor rewards logic and application flows
              around each brand’s loyalty proposition. The adverse side is weaker than the growth story but still real.
              BBB maintains a public complaints surface for Imprint Payments, Inc., and the more important caution
              signal is not scandal but disclosure quality: the reviewed public materials still do not reconcile total
              funding, current headcount, board composition, or exact 2026 revenue and profitability. Those are not
              reasons to reject the company outright, but they do mean later financial and valuation chapters should
