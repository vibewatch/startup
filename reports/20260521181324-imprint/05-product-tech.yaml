- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Public role
  - Key disclosed details
  - External dependency
  - Main risk
  rows:
  - - Partner channel layer
    - Hosts brand-native discovery and application entry points
    - Turkish Airlines, Crate & Barrel, and CB2 all describe embedded site/app/store experiences.
    - Partner web, mobile, and store implementation quality.
    - Fragmented partner implementation could degrade a supposedly unified product.
  - - Embedded application layer
    - Launches the credit application experience inside partner surfaces
    - Web SDK mounts into a selector, consumes client_secret, and emits accepted / rejected / in-progress / error callbacks.
    - Browser runtime and partner front-end integration.
    - No public documentation on edge-case recovery or UX fallback flows.
  - - Session and auth layer
    - Authenticates partner calls and scopes them to products
    - Sandbox + production, Basic Auth, bearer auth, and x-imprint-merchant-key routing are documented.
    - Partner key handling and internal IAM.
    - No public rate-limit, tenant-isolation, or monitoring disclosures.
  - - Decisioning input layer
    - Accepts context for underwriting and offer construction
    - Customer-session payload supports transaction amount, loyalty tier, tenure, account_created_at, and store metadata.
    - Partner data completeness and freshness.
    - Public docs do not explain model governance or fairness controls.
  - - Card / account object layer
    - Represents cards, tokens, PCI details, and related account objects
    - Payment-method APIs expose last4, card_design_id, tokens, bank-account, and loan fields.
    - Issuer-bank and processor plumbing.
    - Public sources do not name the processor or object lifecycle guarantees.
  - - Event and servicing layer
    - Pushes operational updates to partner systems
    - Application and payment-method webhooks are signed and return object/status payloads.
    - Partner back-end endpoints and secret handling.
    - No public retry policy, delivery SLA, or incident history.
  - - Consumer management layer
    - Delivers ongoing payments, rewards, statements, and wallet controls
    - App listings plus Shell/H-E-B pages show virtual card, wallet, payment, AutoPay, and authorized-user functionality.
    - Apple / Google wallet rails plus mobile distribution.
    - Public materials show features, not reliability or support-depth metrics.
  notes: The architecture is constrained to what docs and partner pages explicitly show; no internal processor, cloud, or model-serving topology is inferred beyond those public interfaces.
