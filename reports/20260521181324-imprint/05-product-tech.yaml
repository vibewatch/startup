- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow / brand need
  - Imprint solution
  - Public benefit signal
  - Limitation
  rows:
  - - Acquire applicant inside brand channel
    - Avoid sending users to a generic bank microsite
    - Partner can embed Imprint flow through Web SDK and customer-session setup; Turkish Airlines keeps sign-up on its own site/app.
    - Brand-native acquisition is explicitly part of the product pitch.
    - No public funnel-conversion or abandonment data.
  - - Pass richer context into a credit decision
    - Brand wants more than a thin application payload
    - Create Customer Session can pass transaction context, loyalty tier, tenure, and partner metadata.
    - Public docs show a richer partner-data contract than a basic card app form.
    - Public sources do not disclose how those fields change approval or credit-line outcomes.
  - - Start spending immediately after approval
    - Physical-card wait time hurts activation
    - Virtual-card access plus wallet provisioning via the mobile app and partner pages.
    - H-E-B promises immediate virtual-card access; app listings show Apple Pay / Google Pay support.
    - No public measure of provisioning success or time-to-first-spend.
  - - Manage account after approval
    - Cardholders need servicing without separate issuer portals
    - Single app for activity, statements, payments, rewards, and more; Shell adds AutoPay and authorized users.
    - The account-management surface is the strongest recurring UX proof in public materials.
    - No public retention or support-SLA metrics for these tools.
  - - Redeem partner-specific value
    - Generic points systems create weak brand affinity
    - Westgate uses instant digital redemption; CB2 / Crate & Barrel combine rewards with flexible financing.
    - Public examples show the platform can blend card rails with brand economics.
    - Reward funding split and redemption liability are not disclosed.
  - - Feed partner systems in real time
    - Partners need operational updates after application or card changes
    - Signed application and payment-method webhooks plus merchant-key routing.
    - Docs show a real event-driven integration surface, not just static iframes.
    - No public retry policy, monitoring detail, or uptime history.
  notes: This table maps the best-supported user jobs from official docs, partner pages, and app listings; quantitative conversion and servicing outcomes remain sparse.
