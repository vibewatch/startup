- id: embedded-workflow-and-operating-architecture
  title: Embedded workflow and operating architecture
  body: 'The documentation surface is the strongest proof that Imprint has a real operating stack behind the marketing site. The published docs walk partners through requesting sandbox access and API keys, creating customer sessions, embedding the web experience, authenticating with Basic Auth or bearer tokens, routing multi-product requests with merchant keys, and receiving signed webhook events for applications and payment methods. The data contract is also specific enough to matter: Create Customer Session accepts transaction context, loyalty tier, account tenure, and partner metadata, while payment-method objects expose tokens, PCI details, and related account objects. That is enough to conclude that Imprint offers partner-facing APIs plus a web SDK rather than a pure issuer-hosted microsite. Still, the public operating model remains boundary-limited. The docs do not name a third-party processor, publish uptime or retry guarantees, or explain how underwriting features are weighted, audited,
    or governed in production.'
