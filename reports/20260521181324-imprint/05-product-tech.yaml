company:
  name: Imprint
chapter:
  number: 5
  title: Product & Technology
  summary: 'Imprint has unusually strong public proof that its product is more than a co-brand marketing shell: official partner pages, developer docs, app listings, and partner-domain card pages show brand-native onboarding, a real integration surface, and wallet-ready card-management UX across multiple verticals. The main caveat is boundary risk: issuance, PCI-gated data access, lending capacity, and much of the compliance and resilience posture still depend on banks, networks, and undisclosed internal controls, so product breadth is easier to verify than underwriting governance or platform durability.'
sections:
- id: product-surface-and-partner-configuration
  title: Product surface and partner configuration
  body: 'Public evidence supports a broad but coherent product surface. Imprint is not presenting one generic card with different logos; it is showing a configurable co-brand platform that adapts rewards, financing, onboarding, and account-management flows to the needs of specific brands. Its own products and technology pages frame Imprint Core as the configurable control plane, while partner pages show concrete variations: Turkish Airlines keeps sign-up inside the airline site and links approved cards to Miles&Smiles, Westgate emphasizes instant digital redemption against resort charges, and Crate & Barrel and CB2 blend omni-channel rewards with flexible financing. Programs and partner rosters span travel, fuel, grocery, home retail, and loyalty-heavy consumer categories, which is real evidence of configuration breadth. The most important limitation is that public sources describe experience design and partner outcomes far better than they disclose program volumes, economics, or how much
    of each configuration is owned by Imprint versus bank or network constraints.'
