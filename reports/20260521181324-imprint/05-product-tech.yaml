  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: underwriting-governance
    missingEvidence: Fair-lending governance, model-risk controls, approval-rate calibration, and credit-line assignment policy for Imprint underwriting.
    whyItMatters: Public sources show richer inputs and better UX, but they do not prove that the decisioning system is governed in a way that will scale safely across issuer, partner, and regulatory boundaries.
    diligencePath: Request model-governance memos, fair-lending review materials, approval / decline reason distributions, and line-assignment policy documents by issuer and program.
    relatedQuestionRefs:
    - QE004
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: reliability-history
    missingEvidence: Readable uptime history, incident archive, postmortems, and explicit service-level targets for partner APIs and cardholder servicing surfaces.
    whyItMatters: A modern card-management experience is only durable if the underlying application, eventing, and servicing layers have measurable reliability. That evidence was not recoverable from the public status surface in this run.
    diligencePath: Collect internal uptime dashboards, status-page archives, webhook delivery SLOs, and recent incident reviews covering application, payment, and wallet surfaces.
    relatedQuestionRefs:
    - QE015
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: security-attestations
    missingEvidence: Third-party security attestations or audit outputs beyond PCI and app-store claims, such as SOC 2, ISO 27001, penetration-test summaries, or red-team findings.
    whyItMatters: PCI-gated access and mobile-security claims are useful, but they do not substitute for broader evidence that the platform's data, software-delivery, and infrastructure controls have been independently tested.
    diligencePath: Request current security-certification letters, latest penetration-test executive summary, vulnerability-SLA policy, and any board-level security reporting package.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: issuer-processor-and-funding-mix
    missingEvidence: Current program mix by issuing bank, network, processor, receivables owner, and external funding line or trust structure.
    whyItMatters: The public record proves that these dependencies exist, but not how concentrated they are. Concentration or brittle counterparties could make product delivery riskier than the polished UX suggests.
    diligencePath: Request an architecture and program-operations matrix showing each live program's issuer bank, network, processor, wallet dependencies, and associated warehouse or ABS funding path.
    relatedQuestionRefs:
    - QE012
    - QE013
    - QE014
    - QE023
    relatedTableRefs:
    - TE003
    - TE005
  - type: stale
    severity: minor
    topic: beyond-credit-roadmap-specificity
    missingEvidence: Customer names, GA dates, operational requirements, and unit economics for announced debit, secured-card, flexible-financing, and rewards-network modules.
    whyItMatters: The roadmap is strategically important, but the current public disclosures are directional rather than operational. Without timing and customer proof, the beyond-credit story should not be underwritten as live product breadth.
    diligencePath: Request product roadmaps, pilot customer names, launch milestones, and capital / compliance requirements for each beyond-credit module.
    relatedQuestionRefs:
    - QE020
    - QE024
    relatedTableRefs:
    - TE005
