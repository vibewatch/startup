- id: trust-security-and-product-maturity
  title: Trust, security, maturity, and remaining gaps
  body: Trust and control signals are present, but they are uneven. On the positive side, the API docs require HTTPS, published authentication flows are explicit, API-key rotation is documented, PCI data access is restricted to vetted PCI-compliant partners, and the mobile app listings claim PCI DSS encryption plus 2FA, biometrics, and PIN support. The issuing bank's privacy notice also makes clear that the program touches regulated credit data and can share information with co-brand companies under specified conditions. Product maturity looks highest in embedded onboarding, account management, and partner-configurable rewards, because those surfaces are backed by docs, partner pages, and app-store listings. The weakest areas are resilience and governance. This run did not recover usable uptime history from the public status URL, and reviewed public sources did not expose SOC-style attestations, fair-lending controls, model-risk governance, or processor-level operating responsibilities.
    Those are not cosmetic gaps; they are the core diligence blockers for underwriting whether the product can scale safely and durably.
