- id: issuer-network-and-funding-dependencies
  title: Issuer, network, and funding dependencies
  body: 'Imprint''s product is modern at the UX layer but still sits on traditional financial rails. Public pages show repeated dependence on partner banks: First Electronic Bank issues most visible programs, while First Bank & Trust appears on Shell and Crate & Barrel. The portfolio also spans Visa, Mastercard, and American Express, which broadens product flexibility but ties launch timing and card economics to multiple external counterparties. The most important dependency is balance-sheet rather than frontend: PYMNTS reports roughly $1.5 billion in bank credit lines, and the same coverage plus the Series D announcement frame Imprint as a company that must pair product software with capital-markets, compliance, and risk capabilities. That does not invalidate the platform story; it clarifies the product boundary. ImprintCore may control onboarding, data, and partner experience, but issuance, lending capacity, and at least part of the regulatory perimeter remain outside Imprint''s sole control.'
