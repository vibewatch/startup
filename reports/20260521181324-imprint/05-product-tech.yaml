callouts:
- calloutType: strength
  title: Embedded distribution is the clearest public differentiation
  body: The strongest product proof is not the marketing language about ImprintCore; it is the repeated evidence that partners can keep acquisition and servicing inside their own surfaces. Turkish Airlines keeps applications on its own site/app, Crate & Barrel and CB2 describe fully integrated omnichannel experiences, and the mobile app plus Shell/H-E-B pages show wallet-ready post-approval servicing.
  claimRefs:
  - CE011
  - CE014
  - CE015
  - CE021
  - CE033
  - CE034
  - CE040
  - CE041
- calloutType: risk
  title: ImprintCore still sits on outside issuance and capital rails
  body: Product control does not equal end-to-end autonomy. Public materials repeatedly route issuance through First Electronic Bank or First Bank & Trust, run on Visa / Mastercard / AmEx networks, and rely on large external credit lines and capital-markets support. That makes bank, network, and funding counterparties part of the product boundary, not just a financial footnote.
  claimRefs:
  - CE009
  - CE036
  - CE038
  - CE039
  - CE044
  - CE045
  - CE046
  - CE050
- calloutType: insight
  title: Public evidence is strongest on UX and integration, weakest on governance and resilience
  body: This run verified a real API surface, web SDK, mobile app, wallet support, and PCI-gated data controls. It did not verify processor identity, readable uptime history, fair-lending governance, or broader third-party security attestations. The result is a product thesis with credible front-end maturity but incomplete operating-risk evidence.
  claimRefs:
  - CE018
  - CE027
  - CE035
  - CE052
  - CE053
