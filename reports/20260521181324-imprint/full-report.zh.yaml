        - 信托逾期、核销和准备金补足
        - 逾期继续攀升，核销高于 Fitch 基准情景，或超额利差后的准备金补足低于 2%。
        - 重新测算下行情景经济性，压低估值；增加敞口前要求更新后的资产表现数据包。
      - - 融资压力
        - 仓储贷款续期、ABS 发行节奏和已披露授信额度
        - 主要授信安排未续期，证券化通道变差，或已披露信贷容量停止增长。
