      - number: '4.2'
        title: 牵引力和单位经济信号
        blocks:
          - type: paragraph
            body: >-
              最好的公开单位经济证据是间接的，但仍有用。Imprint 自己的产品页面强调 Holiday Inn Club Vacations 一周上线速度、Turkish Airlines 持卡人 60% 活跃率，以及
              Westgate Resorts 持卡人比非持卡人高 41% 的 resort 消费。Series D 公告加入了更广的组合层证明点：持卡人同比增长 200%、钱包份额高 2x、终身价值高
              8x、迁移品牌的消费比此前项目高 20%。这些都是公司声称的指标，不能替代经审计收入或利润率，但它们重要，因为它们指出企业合作伙伴为什么可能续约和扩张。Fitch 提供了最接近公开应收账款层经济性的窗口：2025
              年 8 月信托指标显示，毛收益率 29.79%、毛核销率 6.73%、月还款率 34.26%。换句话说，Imprint 的经济性不只是类 SaaS
              软件费；它与信贷表现、奖励设计、服务和资金深度绑定。缺口在于，已审阅公开来源没有披露 CAC、回本周期、贡献利润率，或扣除奖励和信贷成本后的净收入，因此本章能勾勒利润率路径，但不能证明它。
