      - 用户
      - 付款方
      - 工作流
      - 预算归属方
      - 采用触发点
    rows:
      - - 综合商品零售
        - 会员忠诚、选品或支付负责人
        - 想即时省钱的高频购物者
        - 发卡方承担授信成本；品牌出奖励成本；消费者若循环欠款，可能支付利息
        - App 或结账优惠 -> 钱包使用 -> 复购篮子 -> 奖励兑换
        - 营销、CRM 或会员忠诚预算
        - 高购物频次叠加清晰可见的省钱感
      - - 旅行忠诚计划（航空 / 酒店）
        - 会员忠诚和附加收入团队
        - 想拿积分、里程或等级的旅客
        - 发卡方承担授信成本；品牌出忠诚价值；消费者可能支付年费
        - 注册 -> 日常消费 -> 积分累积 -> 旅行兑换或等级进度
        - 会员忠诚和附加收入预算
        - 高频旅行或精英等级诉求
      - - 燃油和出行
        - 燃油奖励或支付团队
        - 想拿品类奖励和 App 绑定优惠的司机
        - 发卡方承担应收账款；品牌出账单抵扣或忠诚叠加奖励
        - 加油站获客 -> App 或钱包绑定 -> 更广泛日常消费 -> 加油兑换
        - 燃油奖励和留存预算
        - 常规出行消费和简单钱包集成
      - - 数字商务 / 会员制
        - 增长、订阅或市场平台团队
        - 想拿品类返现并快速兑换的会员
        - 发卡方承担授信成本；商户出更高品类奖励
        - 存储凭证 -> 在线结账 -> 品类返现 -> 下次购买兑换
        - 会员制和 LTV 负责人
        - 高频电商行为
      - - 高客单零售融资
        - 信贷或选品团队
        - 为大额购买融资的购物者
        - 发卡方依赖促销融资经济模型；消费者承担还款风险
        - POS 优惠 -> 促销期 -> 循环欠款或还清 -> 间歇性复用
        - 零售信贷或促销预算
        - 大额篮子需要融资
      - - 传统自有品牌店铺卡
        - 零售信贷合作伙伴和商户运营
        - 对价格敏感、黏着某商户的购物者
        - 消费者利息经济模型和商户促销，比店外消费更关键
        - 结账优惠 -> 单一商户使用 -> 只有购物节奏够高才会复购
