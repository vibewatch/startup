  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 真实牵引力和融资证据已经出现，但以当前价格看，披露缺口和估值倍数支撑不足压过了这些利好，因此建议仍偏谨慎。
    data:
      nodes:
        - id: traction
          label: 牵引力证据
          detail: Series D 轮、持卡人增长 200%，以及 Rakuten / Shell 这类赢单，说明平台确实跑通了。
          tone: positive
        - id: capital
          label: 资本市场证据
          detail: 仓储授信和扩容后的 AAA ABS 表明，公司能拿到外部资金。
          tone: positive
        - id: multiple
          label: 公开市场倍数缺口
          detail: 基于公开收入估算的桥接显示销售倍数约 17.1x，远高于发卡方和替代标的可比公司。
          tone: warning
        - id: disclosure
          label: 披露缺口
          detail: 当前确认收入、利润率、亏损分担和优先权条款仍未公开。
          tone: warning
        - id: credit
          label: 信用周期负担
          detail: 这门生意要扛真实贷款损失、资金成本和投诉风险，不是纯软件毛利。
          tone: warning
        - id: decision
          label: 决策
          detail: 在收入和条款桥接透明之前，结论是继续研究，且估值判断偏高。
          tone: neutral
      edges:
        - from: traction
          to: decision
        - from: capital
          to: decision
        - from: multiple
          to: decision
        - from: disclosure
          to: decision
        - from: credit
          to: decision
