  - id: TV005
    title: 投资逻辑破裂与终止触发器表
    columns:
      - 触发器
      - 阈值
      - 对投资逻辑的传导
      - 动作含义
    rows:
      - - 经验证收入仍过低
        - 当前确认收入没有显著高于公开的 2024 年估计
        - 倍数溢价继续显得由叙事驱动，而非承销基础驱动。
        - 不要按 Series D 名义价格投资。
      - - 资金成本或亏损条款恶化
        - 仓储融资 / ABS 经济性、准备金或合作银行分成恶化
        - 资本强度比忠诚度软件故事更重要。
        - 用更严厉的贷款方折价重新切估值。
      - - 信用指标走弱
        - 逾期、核销或最低还款行为的趋势比当前可见情况更差
        - 下行风险从抽象变成立即问题。
        - 把当前估值视为昂贵。
      - - 合作伙伴集中度延续
        - 单一项目仍贡献过多交易量或经济收益
        - 新增品牌客户不再转化为多元化平台价值。
        - 降低信心，并要求更紧条款。
      - - 优先股堆叠不友好
        - 棘轮条款、优先清算权或稀释压力显著压低新钱经济性
        - 名义估值不再匹配可投资价值。
        - 暂停，直到价格或条款改善。
    notes: 这些触发器盯的是估值能不能买，而不是泛泛运营风险。每一项都在问：当前进场价格何时不再站得住脚。
