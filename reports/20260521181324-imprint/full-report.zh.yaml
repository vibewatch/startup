        - 研究设计、对照组，以及提升是否为未扣除奖励成本的口径。
      - - 组合增长信号
        - Series D 公告报告持卡人基数同比增长 200%。
        - 中
        - 规模可吸收平台固定成本，但也会增加融资需求。
        - 绝对持卡人数、活跃占比，以及每新增持卡人的获客成本。
      - - 合作伙伴 ROI 主张
        - 钱包份额 2x、客户终身价值 8x，相比旧项目消费增加 20%。
        - 低
        - 这是品牌接受溢价经济条款或迁移工作的最清晰公开理由。
        - 方法论、合作伙伴样本，以及结果是否已扣除奖励和信用损失。
      - - 组合信贷表现
        - Fitch 观察到 Aug-2025 的总收益率 29.79%、总核销率 6.73%、月付款率 34.26%。
        - 中
        - 最接近公开代理指标，可衡量应收款账本的收入收益、损失拖累和现金回收。
        - 净核销、欺诈损失、准备金计提，以及合作伙伴级批次曲线。
