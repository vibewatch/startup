            body: >-
              Imprint 已经有足够公开胜仗，证明它能在联名卡里占一席之地；但披露还不足以证明这些胜仗足够分散、足够耐久。公司和合作伙伴展示了 H-E-B、Rakuten、Turkish Airlines、Holiday
              Inn Club Vacations、Shell、Westgate、Booking.com 等已上线或将上线项目；Shell 2026 年迁移尤其重要，因为它说明 Imprint
              仍能从传统发卡方方案中拿份额。PYMNTS 还报道称，Rakuten 项目是从 JPMorgan、Capital One、Synchrony、Barclays、U.S. Bank
              等在位发卡方手中赢下来的，这也确认竞争阵容很强。Series D 材料进一步强化了这个叙事：持卡人增长 200%、新增合作伙伴更多、首单证券化获得 AAA
              评级背书，迁移项目的钱包份额和消费额也更好。即便如此，公开证据仍没有披露按品牌划分的收入集中度、合同期限、续约日期或合作伙伴层面的经济性。因此，合作品牌广度应被视为需求证据，而不是集中度和续约风险很小的证据。
