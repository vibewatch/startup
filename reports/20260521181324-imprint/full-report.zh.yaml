  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 信贷、资金和宏观敏感性
        blocks:
          - type: paragraph
            body: >-
              融资栈看起来真实，但还不是低风险。Imprint 已公开证明 2025 年 3 月获得 $500 million 仓储额度，并称这把总放贷能力提升到约 $1 billion；Fitch 2025
              年预售报告也确认，首单信用卡 ABS 信托已经进入市场。这比多数私营金融科技公司 提供的资金证据更强。另一面是，Fitch 同时把组合描述为相对未成熟且集中，60 天以上逾期率从 2025 年 5 月到 8
              月上升，并给出 9.50% 的稳态核销假设。因此，公开材料对利润率韧性的支持是有条件的，而非绝对的。这笔交易还带有利率错配，以及与超额利差绑定的准备金账户触发器，所以信贷压力上升时，流动性灵活性可能恰好收窄。新的
              Series D 股权有帮助，但公开来源仍未披露烧钱速度、现金跑道或契约余量，因此宏观走弱和资金重定价仍是核心投资逻辑风险， 而不是已经解决的问题。
