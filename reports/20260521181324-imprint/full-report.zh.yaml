      - number: '7.2'
        title: 发卡方、监管和合规依赖
        blocks:
          - type: paragraph
            body: >-
              Imprint 的运营模式仍架在银行和监管脚手架上，而这些支撑并不完全由它掌控。公开帮助页、合作伙伴页面和 CFPB 协议数据库显示，许多可见项目由 First Electronic Bank 托底，Shell
              和部分其他案例则使用 First Bank & Trust。这比纯粹依赖单一银行更好，但关键的合规、发起和赞助职能仍集中在少数银行手里。美联储、FDIC 和 OCC
              的跨机构指引把含义说得很清楚：银行使用金融科技合作伙伴，并不意味着可以把安全稳健或法律责任外包掉；风险更高的合作关系，需要对投诉、信息安全、财务状况和应急计划做更深尽调。Imprint
              自己的材料也说明它离监管边界很近。H-E-B 称 Imprint
              负责发起、持卡人体验、奖励、技术、合规和持续项目管理，管理层也被引述称公司实际上在打造一家银行。即便目前没有具体公开执法行动，上述组合仍抬高了监管依赖风险。
