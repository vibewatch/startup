            body: 这门生意更像现代信用平台，而不是纯软件，因此资金组合、信用损失和缺失的条款披露都会直接影响估值。
            calloutType: risk
            claimRefs:
              - CV046
              - CV047
              - CV048
              - CV050
          - type: callout
            title: 什么会改变判断
            body: 如果经核实的 2026 年收入基础明显更高，且优先权条款干净，当前估值标记可能从偏高走向合理。
            calloutType: assumption
            claimRefs:
              - CV041
