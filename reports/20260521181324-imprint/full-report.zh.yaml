      - number: '2.3'
        title: 买方、用户、付款方和采用机制
        blocks:
          - type: paragraph
            body: >-
              现有卡项目呈现出一致模式：买方通常是品牌或忠诚度负责人，用户是消费者，付款方则在发卡方资金、品牌出资奖励和消费者利息经济之间共享。不同细分市场变化的是消费者钩子和复用逻辑。Target 和 Amazon
              靠日常零售行为中的即时节省或现金返还。Hyatt、Hilton、Delta 和 Marriott 将用卡与积分、里程、免费住宿或等级进阶绑定，让卡成为更大忠诚度阶梯的一部分，而不只是结账折扣。Shell 2026
              年重启尤其适合观察 Imprint，因为它展示了燃油项目如何从只省油费走向更广的生鲜和餐饮奖励，同时仍把商户身份放在中心。Deloitte
              的框架解释了这件事为什么重要：合作卡在强化经常性消费和个性化兑换时效果更好，而不是只提供一次性融资。按这个逻辑，拥有强会员或忠诚度数据的高频消费品类，远比只需要促销信贷的偶发大额购买更有吸引力。由此形成的买方地图是：零售、旅行、燃油和高频数字电商
              比纯交易型或低频购买品类更贴合 Imprint 的品牌原生价值主张。
