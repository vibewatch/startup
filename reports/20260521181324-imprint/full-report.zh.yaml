      - 已披露关键细节
      - 外部依赖
      - 主要风险
    rows:
      - - 合作伙伴渠道层
        - 承载品牌原生发现和申请入口
        - Turkish Airlines、Crate & Barrel 和 CB2 都描述了嵌入式站点 / app / 门店体验。
        - 合作伙伴 web、移动端和门店实施质量。
        - 合作伙伴实施碎片化，可能削弱所谓统一产品。
      - - 嵌入式申请层
        - 在合作伙伴界面内启动信用申请体验
        - Web SDK 挂载到 selector，消费 client_secret，并发出 accepted / rejected / in-progress / error 回调。
        - 浏览器运行时和合作伙伴前端集成。
        - 没有关于边缘场景恢复或 UX 兜底流程的公开文档。
      - - 会话和认证层
        - 认证合作伙伴调用，并把调用限定到产品范围
        - Sandbox + production、Basic Auth、bearer auth 和 x-imprint-merchant-key 路由均有文档。
        - 合作伙伴密钥处理和内部 IAM。
        - 没有公开速率限制、租户隔离或监控披露。
      - - 决策输入层
        - 接收用于承销和构建报价的上下文
        - Customer-session payload 支持交易金额、忠诚度等级、存续期、account_created_at 和门店元数据。
        - 合作伙伴数据完整性和新鲜度。
        - 公开文档没有解释模型治理或公平性控制。
      - - 卡 / 账户对象层
        - 表示卡、token、PCI 细节和关联账户对象
        - Payment-method API 暴露 last4、card_design_id、token、bank-account 和 loan 字段。
        - 发卡银行和处理器管线。
        - 公开来源没有点名处理器，也没有说明对象生命周期保证。
      - - 事件和服务层
        - 向合作伙伴系统推送运营更新
        - Application 和 payment-method webhook 有签名，并返回对象 / 状态 payload。
        - 合作伙伴后端端点和密钥处理。
        - 没有公开重试政策、交付 SLA 或事故历史。
      - - 消费者管理层
        - 承载持续付款、奖励、账单和钱包控制
        - 应用商店页面以及 Shell/H-E-B 页面展示了虚拟卡、钱包、付款、AutoPay 和授权用户功能。
        - Apple / Google 钱包通道叠加移动端分发。
        - 公开材料展示功能，但没有可靠性或支持深度指标。
    notes: 架构仅限文档和合作伙伴页面明示的内容；除这些公开接口外，不推断内部处理商、云或模型服务拓扑。
