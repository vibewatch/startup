  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 2026 年收入质量桥接
        - 确认收入、毛利率、NRR、队列留存，以及利息、交换费和服务收入结构
        - 推荐结论更多取决于估值分母质量，而不是品牌验证。
        - 财务资料室、董事会材料和可供审计师使用的 KPI 桥接。
      - - 资金堆叠和亏损分担
        - 仓储融资垫款率、准备金结构、ABS 经济性和银行合作伙伴亏损分配瀑布
        - 不知道谁以什么成本吸收亏损，就无法正确给资本强度定价。
        - 司库和资本市场尽调，加上合作银行法律审查。
      - - 股权结构表和优先权
        - 清算优先权、MFN 条款、棘轮条款、老股交易和稀释瀑布
        - 名义估值可能高估新钱可投资经济性。
        - 融资文件和附函的律师审查。
      - - 合作伙伴集中度和续约
        - 按合作伙伴项目拆分的收入、应收账款和续约日期
        - 如果一两个品牌客户仍主导结果，平台叙事就更弱。
        - 商业尽调和项目级组合切片。
      - - 客户服务质量
        - 按项目拆分的投诉趋势、SLA 数据、服务人员配置和整改指标
        - 服务失败可能损害品牌续约，并在财务追上前压缩价值。
        - 运营尽调和投诉 / QA 审查。
    notes: 这些尽调问题刻意对准能改变估值判断的变量，而不是泛泛的公司好奇心问题。
    claimRefs:
