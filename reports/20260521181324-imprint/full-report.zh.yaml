      - number: '3.2'
        title: 在位者组合和分发能力
        blocks:
          - type: paragraph
            body: >-
              传统发卡方最有证据支撑的优势不是更顺滑的用户体验，而是分发深度。Synchrony 是商户卡中最清晰的公开基准：其 2024 年年报显示，购买额超过 $182 billion，应收账款为 $104.7
              billion，活跃账户为 71.5 million，全年新增合作伙伴超过 45 个，并续约超过 45 个项目。Bread Financial
              在已审阅页面上没有披露同样的商户卡细节，但仍描述了一项覆盖联名卡、自有品牌卡和分期付款 的广泛业务，为多个行业的数百万美国消费者服务。Citi 称其美国 Consumer Cards 业务服务 70
              million 客户，如今位列该行五大核心业务之一；American Airlines 公告则显示，Citi 有意愿也有能力接手 Barclays 的 AAdvantage 组合和全部获客渠道。Barclays
              仍覆盖旅行和零售品牌，Chase 与 Capital One 各自也展现出足够的品牌卡广度，即使它们不把自己营销成纯联名卡专家。对 Imprint
              来说，真正的在位者护城河是续约杠杆、资金深度和长期合作伙伴历史，而不是银行已经比挑战者更好地解决了品牌原生产品设计。
