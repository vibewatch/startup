  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Imprint（标的）
        - 最近一轮私募估值对比 Sacra 2024 年收入估计
        - 按 $1.2B 估值和 $70M 收入算，约为过去收入的 17.1x
        - 用最干净的公开收入锚看，当前估值隐含的倍数一目了然。
        - 收入来自第三方估计，可能低估当前规模。
      - - Synchrony
        - 公开市值 / 过去收入
        - 2.41x 销售额
        - 最好的大规模店铺专用卡 / 联名卡发卡方参照，具备存款融资和深度披露。
        - 规模远大、靠存款融资，成熟度也远高于 Imprint。
      - - Bread Financial
        - 公开市值 / 过去收入
        - 1.32x 销售额
        - 有用的低倍数可比对象，覆盖店铺卡和联名卡经济模型。
        - 传统发卡方，增长和技术画像不同。
      - - Capital One
        - 公开市值 / 过去收入
        - 3.14x 销售额
        - 大型银行发卡方，合作伙伴卡经济模型可见，资金来源也更多元。
        - 多元化银行收益让它不是纯粹的联名卡可比对象。
      - - American Express
        - 公开市值 / 过去收入
        - 3.07x 销售额
        - 高端网络 / 发卡方参照，覆盖品牌化奖励和商户关系。
        - 网络规模和品牌组合比 Imprint 广得多。
      - - Marqeta
        - 公开市值 / 过去收入
        - 2.54x 销售额
        - 对寻求现代发卡基础设施的品牌而言，是偏轻资本的嵌入式卡替代方案。
        - 处理器经济模型比依赖应收账款的放贷方结构上更干净。
      - - Affirm
        - 公开市值 / 过去收入
        - 5.67x 销售额
        - 增长型金融科技替代对象，覆盖商户金融和结账驱动的货币化。
        - 产品和期限组合不同，但仍是有用的公开市场上限参照。
    notes: 这组可比对象刻意混合发卡方和替代模型，因为 Imprint 一边讲忠诚度软件，一边承担真实信用敞口。
