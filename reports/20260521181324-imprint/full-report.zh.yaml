      - number: '8.2'
        title: 价格语境：公开倍数差距很大；披露改善前，业务应承担资本强度折价
        blocks:
          - type: paragraph
            body: >-
              用 $1.2B Series D 估值锚点对比 Sacra 对 2024 年收入 $70M 的估计，隐含过去收入倍数约为
              17.1x。仅靠公开资料很难为这一数字辩护。披露和融资结构更清楚的公开发卡方可比公司筛出来低得多：Bread Financial 为 1.32x 销售额，Synchrony 为 2.41x，Capital One
              为 3.14x，American Express 为 3.07x。即便换成更偏软件或更偏增长叙事的金融科技模型，也低于公开资料为 Imprint 支撑出的水平：Marqeta 为 2.54x，Block 为
              1.69x，Affirm 为 5.67x。这个差距重要，是因为 Imprint 看起来更像贷款 + 忠诚度平台，而不是纯 SaaS 资产。Fitch 的信托数据、仓储授信，以及 Murphy
              关于拥有银行的评论，都指向同一个业务：资金组合、信用损失和监管都会影响价值。公司披露当前确认收入和更干净的经济性之前，这个价格更像是私募稀缺性的结果，而不是公开证据支撑的公允价值。
