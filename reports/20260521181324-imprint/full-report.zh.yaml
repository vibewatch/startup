              Imprint 的可见客户是消费品牌，但每个公开项目里的实际用户和付款方，都是在品牌自有忠诚度循环中消费的终端持卡人。Imprint 公开发布的名单覆盖 H-E-B 和 Central Market
              等生鲜品牌；Booking.com 和 Turkish Airlines 等旅行项目；Rakuten 和 Fetch 等返现与奖励生态；Brooks Brothers、CB2 和 Crate & Barrel
              等特色零售品牌；Westgate 和 Holiday Inn Club Vacations 等度假村和度假品牌；以及 Horizon Hobby 代表的小众爱好者电商。这个组合说明垂直覆盖广，但市场进入
              模式也很具体：品牌伙伴分发卡片，消费者才是消费客户。已审阅材料没有呈现公开 SMB、企业或独立软件买方，因此这里的客户故事压倒性地是联名卡消费者分发，而不是直接 SaaS
              销售。公开材料还显示发卡方基础较窄，这对集中度分析很重要。
