chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、产品姿态和运营模式
        blocks:
          - type: paragraph
            body: >-
              Imprint 把自己定位为现代联名金融平台，而不是通用发卡处理商。官网、关于页面和 2025
              年末融资材料都描述了同一门生意：帮助品牌在自己的数字环境里设计、上线并运营金融产品和忠诚度体验。当前产品集已明显不止单一信用卡 SKU：官网展示信用卡、存款账户和分期贷款，Series D
              公告称路线图已延伸到借记卡、担保信用卡、灵活融资、AI 驱动自动化和忠诚度广告。贯穿这些表面的战略主线是品牌原生控制。Imprint
              认为，传统发卡银行和老旧处理商堆栈让联名卡项目太慢、太僵硬，也太脱离商户自己的应用 或网站，因此公司打造 ImprintCore，用一个堆栈承接注册、承销、卡片管理、奖励和数据管线。更准确的理解是：Imprint
              是一家 B2B2C 嵌入式金融提供商，真正客户是品牌，持卡人体验则是提升忠诚度、消费和终身价值的抓手。
