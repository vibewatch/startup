      - number: '8.4'
        title: 最终尽调问题：下一步是补齐收入、条款和信用结构缺口，而不是再多看一个客户胜利
        blocks:
          - type: paragraph
            body: >-
              Imprint 的退出路径在概念上看得见，因为公司已经证明自己能融资、拿到仓储融资，并发行有评级的 ABS。但从披露角度看，它还没到 IPO
              级别。关键问题很直接。第一，投资者需要一座当前收入质量桥：确认收入、毛利率、NRR、分群留存，以及经济性中有多少来自利息、交换费和服务收入。第二，他们需要融资结构本身：与合作银行的损失分担、预支率、准备金结构，以及资产组合成熟后的资金成本。第三，他们需要实际股权结构表和优先权结构，因为头部独角兽估值可能遮住对新钱并不那么有吸引力的经济性。在这些证据出现之前，正确纪律是保持跟进，把尽调清单写清楚，并把任何“本轮已经合理”的说法视为尚未证明，而不是必然结论。
