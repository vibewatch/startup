      - number: '4.3'
        title: 融资结构和资本依赖
        blocks:
          - type: paragraph
            body: >-
              Imprint 的资本栈比当前 P&L 更容易验证。公开公告和 Fitch
              材料显示了三层融资模式：用股权资本支撑平台和产品扩张，用仓储贷款扩大卡应收账款，再用证券化把这些应收账款回收到可重复的资本市场项目中。2025 年 3 月仓储额度新增 $500 million，将总放贷能力带到约
              $1 billion。七个月后，公司落地首单 $300 million ABS，较 $200 million 目标扩容，补充仓储而非替代仓储。Fitch
              的预售和最终评级报告重要，因为它们揭示了公开新闻稿没有写出的内容：信托结构创建于 2023 年 10 月，抵押池包括联名 Visa、Mastercard 和 American Express
              应收账款，应收账款通过合作银行发放，准备金、超额抵押和超额利差触发器会影响持续融资灵活性。这是有意义的进展，但也意味着 Imprint 比 Synchrony
              这类存款融资的在位机构更依赖外部资金；后者用存款而不是仓储额度和定期 ABS 为大部分账簿融资。
