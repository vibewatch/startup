      - number: '2.4'
        title: 增长驱动、采用约束和剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              现代联名卡平台的采用逻辑真实存在，阻力也同样真实。正向看，Bain 认为，在商业和金融服务融合时，掌握客户关系的平台处在最强位置；Imprint 也明确把承销、奖励和项目控制作为一个堆栈来销售。CFPB
              还显示，现金返还卡已成为领先的通用卡形态，而自有品牌卡 申请和发放随时间显著下滑，部分原因是发卡方和商户转向用途更广的联名产品。PaymentsJournal 补充称，自有品牌卡
              正失去牵引，而中小或细分发卡方的联名机会仍然存在。负面同样重要。CFPB 称，2024 年通用卡平均 APR 为 25.2%，自有品牌卡 APR 为 31.3%，最低还款行为恶化，超过 $70 billion
              的购买额流经与自有品牌卡和零售联名卡高度相关的延期付息计划。Roundtables 又把 BNPL 列为直接结账替代方案，并提示潜在 APR
              上限或交换费规则变化会威胁盈利能力。最后，本章最大的尽调缺口之一不是需求，而是披露：公开来源仍未揭示精确的品牌收入分成、交换费分配，或像 Imprint
              这样的玩家能从在位发卡方和品牌自建堆栈中拿下多少可服务份额。相比任何泛化的自上而下 TAM 幻灯片，这些缺失的经济性更关键。
