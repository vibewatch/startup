        title: 建议：真实牵引、真实资本通道，但 Series D 价格下仍应继续研究
        blocks:
          - type: paragraph
            body: >-
              Imprint 已经不再是投影片里的猜想。公开来源显示，公司完成了 $150M Series D，估值 $1.2B，持卡人同比增长 200%，新上线 Rakuten、Booking.com、Crate &
              Barrel 和 Fetch，拿到 $500M 仓储授信，把放贷能力提高到约 $1B，并完成首单 ABS，规模从 $200M 扩大到 $300M。CNBC 和 Shell
              还提供了有用的外部佐证：品牌愿意把高曝光项目从在位银行迁走。这就是核心论点：Imprint 似乎正靠一套现代、贴合品牌体验的联名卡产品栈赢下真实品牌。反论点在于价格支撑。最佳公开收入锚点仍是 Sacra 对
              2024 年 $70M 的估计，关于页面仍保留过时融资表述，公开记录仍缺少当前确认收入、毛利率、损失分担和股权结构条款。这组证据支持以中等置信度、较高风险和估值偏高的立场继续研究，而不是买入。
