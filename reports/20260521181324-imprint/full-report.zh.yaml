        - 私募市场的溢价还能维持一段时间，但公开可比公司的支撑仍跟不上。
        - 最能由公开资料支撑的解读。
      - - 悲观情景
        - 信贷环境恶化、集中度延续，或融资和服务摩擦上升快过收入。
        - Series D 开始显得昂贵，并越来越容易暴露在降估值融资或低回报风险下。
        - 业务不必失败；只要资本结构和信贷周期比叙事更重要，投资逻辑就会承压。
        - 行业和披露数据已经显示这些路径可能如何发生。
    notes: 这些情景是以公开证据锚定的定性进场纪律视角，不是管理层预测，也不是完整估值模型。
