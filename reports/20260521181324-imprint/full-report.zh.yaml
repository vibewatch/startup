  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域和现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Imprint 的市场比泛化的“嵌入式金融”更窄，但又不只限于传统店铺卡。CFPB 将联名卡定义为同时带有网络标识和商户品牌的通用卡，而自有品牌卡 没有网络品牌，并且只能在单一商户或紧密相关的商户群中使用。同一份
              CFPB 报告还明确，零售卡同时包括自有品牌卡和零售联名产品，某些双网络商户卡在商户之外使用时也像通用卡。Bain
              更适合作为相邻视角，而不是直接市场定义：它明确把联名信用卡排除在嵌入式金融之外，因为它们没有嵌入原生数字旅程，但仍说明了为什么掌握客户关系的平台能捕获更多价值链。Imprint
              自身定位就落在这个交叉点。公司网站称，品牌过去被老旧堆栈或僵硬金融机构卡住；它销售的平台则能在一个品牌可控体验里运行信用卡、存款、分期贷款、承销和奖励。本章将核心市场定义为美国联名通用卡，以及自有品牌卡 /
              店铺卡周边的迁移池；更广义的品牌嵌入式金融工具链是相关相邻市场，不是可替代 TAM。
