  - id: TI001
    title: 收入来源表
    columns:
      - 来源
      - 公开证实的机制
      - 当前证据
      - 收入质量 / 风险
      - 尽调要求
    rows:
      - - 利息收入
        - 循环联名卡余额有披露的 APR，最终体现在信托收益率里。
        - Shell 购买 APR 20.99%-35.99%；H-E-B 购买 APR 17.24%-35.99%；Fitch 观察到 29.79% 总收益率。
        - 如果应收款按批次表现稳定，收入可重复、可扩展；但直接暴露在核销和融资成本下。
        - 提供 2025-2026 年按合作伙伴 / 发卡机构拆分的净利息收入，以及按批次拆分的循环率。
      - - 交换费
        - 开放式 Mastercard、Visa 和 American Express 卡靠持续购买额变现。
        - Shell、H-E-B、Booking、Rakuten 和 Fetch 都强调日常消费和广泛受理。
        - 可能随消费额扩大而更分散，但总交换费可能会被合作伙伴经济条款和奖励部分抵消。
        - 披露总交换费 bps、网络组合和合作伙伴收入分成结构。
      - - 费用收入
        - 消费者卡协议披露滞纳金、外币交易费和现金预借费用。
        - Shell 滞纳金最高 $41，FX 费 3%；H-E-B 滞纳金最高 $35；两者都有循环卡协议。
        - 真实存在，但可能小于利息加交换费；监管敏感度也更高。
        - 展示费用收入占营收比例，以及任何费用减免或困难客户政策。
      - - 项目管理 / 服务经济性
        - Imprint 公开称，其为品牌设计、上线、管理和服务卡项目及奖励流程。
        - Shell 奖励条款和 Fetch 发布稿都把 Imprint 描述为管理方 / 管理员，合作银行负责发卡。
        - 可能形成粘性 B2B 收入，但定价和确认口径没有披露。
