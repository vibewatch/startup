            body: >-
              Imprint 的上行情景并非幻想。如果合作伙伴继续增加，Shell 迁移站稳，当前收入已经远超公开的 2024 年 $70M 估计，同时信托指标仍保持在健康区间，Series D
              最终可能只是显得要求很高。问题在于，这些对投资判断至关重要的桥，目前都还没有出现在公开证据中。因此，基准情景必须贴近当前可观察材料：真实品牌胜利、真实资本市场进展、实质信用敞口、较高行业
              APR，以及公司披露很薄。按这个视角，$1.2B
