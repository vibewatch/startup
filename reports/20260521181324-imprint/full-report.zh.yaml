      - number: '2.2'
        title: 受证据约束的市场测算和可观察需求信号
        blocks:
          - type: paragraph
            body: >-
              公开证据支撑了庞大的需求信号，但没有给出第三方联名卡平台的干净独立 TAM。CFPB 称，美国消费者信用卡购买额在 2024 年达到 $3.6 trillion，卡余额超过 $1.2
              trillion；Federal Reserve G.19 显示，截至 2026 年 3 月，循环消费者信贷余额为 $1.327 trillion。CFPB 还报告约 195 million
              消费者持有通用卡、105 million 消费者持有自有品牌卡， 这比任何单一咨询 TAM 更能界定用户基数和迁移池。更相关的垂直代理来自 Synchrony，这是商户卡领域最清晰的公开在位者 基准：它在
              2024 年融资的购买额超过 $182 billion，年末应收账款为 $104.7 billion，活跃账户为 71.5 million。Bain 的嵌入式金融研究进一步拉宽相邻视角，估计美国平台及赋能方收入从
              2021 年的 $22 billion 增至 2026 年的 $51 billion，交易价值则从 $2.6 trillion 增至超过 $7 trillion。但 Bain
              同时把联名卡排除在核心嵌入式金融定义之外。因此，估值上正确的读法不是给一个泛化 TAM 数字。Imprint
              参与的是一个庞大的卡片与忠诚度需求池，并带有有意义的嵌入式金融相邻性；但公开来源仍迫使本章使用多个受约束的测算镜头，而不是干净的 TAM / SAM / SOM 堆栈。
