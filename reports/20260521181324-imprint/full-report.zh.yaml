companyProfile:
  summary: >-
    Imprint 是一家 2020 年成立、总部位于纽约的私营金融科技公司，为联名卡、忠诚度体验和相邻金融产品提供品牌原生平台。公开来源支撑的模式核心不是纯软件订阅，而是
    ImprintCore、合作品牌分发、发卡银行关系，以及仓储加证券化融资。公司已从早期融资推进到估值 $1.2 billion 的 Series
    D，项目覆盖旅行、生鲜、燃油、零售和奖励品牌，但当前董事会、股权结构、员工数和盈利披露仍不完整。
