            body: >-
              里程碑记录显示，公司正从创业融资快速走向机构化融资的信贷运营。2021 年和 2023 年的早期轮次支撑平台建设，2024 年给出首个清晰披露的后期估值锚，2025
              年在新一波合作伙伴之外又加入仓储和证券化能力。Shell、Booking.com、Rakuten 和 Fetch 的合作伙伴页面支撑了一个判断：Imprint
              不只是在销售处理商，而是在围绕每个品牌的忠诚度主张定制奖励逻辑和申请流程。反向面弱于增长故事，但依然真实。BBB 为 Imprint Payments, Inc.
