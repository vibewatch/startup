              Imprint 的扩张逻辑很容易公开解释：标杆品牌愿意上线或迁移到一种项目架构，承诺比传统银行堆栈更快上线、更强奖励控制和更好的数字客户体验。CNBC 关于 Rakuten 的报道和 Finextra
              融资报道都把公司描述为老旧银行发行项目的替代路径，而不只是全新项目的上线供应商。但集中度问题仍未解决。公开证明明显偏向旅行、生鲜、零售和度假等面向消费者的品牌，多数可见项目仍指向 First Electronic
              Bank
              作为发卡方。这意味着合作伙伴集中度、发卡方集中度和垂直集中度都仍是合理风险，即使公开来源没有量化它们。实际上，上线证明和品类广度扎实；经量化的集中度、合同经济性和续约耐久度并不扎实。应把这些缺失披露视为尽调阻断项，
              而不是用品牌标识数量一笔带过。
