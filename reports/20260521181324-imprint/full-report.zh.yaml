  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局和竞争者类型
        blocks:
          - type: paragraph
            body: >-
              Imprint 并不只在一条赛道竞争。已审阅来源中最接近的直接同行是 Cardless，因为两家公司都销售嵌入式联名卡体验，并让体验存在于品牌自己的应用 或网站中，而不是把客户导向银行拥有的界面。Marqeta
              和 Stripe 的重要性不同：它们不是同样完整的忠诚度运营商，但能让银行、金融科技公司
              或品牌在内部拼出大部分发卡堆栈，从而缩短处理商优先的自建方案与全栈提供商之间的距离。市场另一端是传统发卡方和商户金融在位者，例如 Synchrony、Bread
              Financial、Citi、Barclays、Chase 和 Capital One；它们带来资产负债表、合规肌肉、获客渠道和既有合作伙伴组合。BNPL 也是现实替代。Affirm
              并不复制开放式联名卡经济性，但在品牌主要想要结账转化和分期付款、而非长期卡关系的商户场景中，它会竞争。实际结论是：Imprint
              必须在用户体验和速度上打赢金融科技挑战者，同时还要从已经掌握规模、资金和信任的机构手里撬走关系。
