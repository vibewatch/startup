      - number: '3.4'
        title: 切换成本、护城河耐久度和竞争风险
        blocks:
          - type: paragraph
            body: >-
              当品牌想让一个运营商在品牌原生界面里掌握申请流程、服务体验、奖励逻辑和相邻产品时，Imprint 的护城河最强。沿这条轴线看，它更像 Cardless，而不是处理商优先供应商；相比 Marqeta 或
              Stripe，它也能主张更完整的产品掌控权。但护城河并非不可攻破。Shell 显示，只要新运营商承诺更广的日常相关性和更好的数字账户管理，品牌愿意重构平台；American Airlines 则显示，在位者
              也能利用续约周期整合组合、夺回份额。换句话说，切换成本高但具有周期性：合同中期很难突破，重新招标时非常真实。另一个风险是商品化。基础设施供应商持续把更多发卡和合规能力拉进可配置堆栈，可能缩小全栈提供商与拥有足够工程或银行支持的品牌之间的差距。最后，监管负担不会在任一侧消失。CFPB
              执法和投诉数据表明，大型在位者仍受审视，而自有品牌卡高 APR 和持卡人压力让整个品类暴露在政策和声誉风险下。
