      - number: '3.3'
        title: 定价、打包和替代模式
        blocks:
          - type: paragraph
            body: >-
              消费者侧公开定价证据很丰富，商户侧则很薄。本章可见的标杆项目靠奖励密度、年费决策、旅行或等级权益、费用豁免来竞争：Amazon Prime Visa 在 Amazon 和 Whole Foods 给出 5%
              且无年费，Hyatt 主打高奖励和等级权益，REI 与 Target 靠简单店内价值经济性，JetBlue 通过年费旅行权益包变现，Shell 2026
              年重启则把燃油相关性与日常奖励结合。这些套餐重要，因为它们为任何新品牌卡设定了客户预期，即便品牌侧商业条款私下谈判。披露在这里开始变薄。Cardless 通过 Sacra
              对融资、嵌入式用户体验、多网络支持，甚至设置费和持续项目管理费的存在都异常透明，但精确品牌经济性仍未公开。Stripe 和 Marqeta
              提供可配置发卡底层能力、银行伙伴支持和模块化处理，让自建还是购买的取舍更尖锐。Affirm 是促销融资或结账转化场景下最干净的替代品，尤其适用于商户不需要长期开放式卡和忠诚度项目的情况。
