        title: 创始人、管理梯队和地域布局
        blocks:
          - type: paragraph
            body: >-
              已审阅来源能清楚锚定创始人，但治理图景较薄。Daragh Murphy 一直被标识为创始人兼 CEO，McKinsey 对他的访谈把公司起点连到一个明确判断：传统联名卡技术已经过时。Gaurav Ahuja
              同时以联合创始人和董事长身份出现，McKinsey 将 Thrive Capital 描述为最早的孵化伙伴，Tracxn 也把 Michael Pechman
              列为联合创始人。当前管理层方面，官方关于页面列出了相当完整的高级职能团队，覆盖业务、资本市场、收入、技术、风险、合规和产品。这是正向覆盖信号，因为公司同时触及承销、发行、合作伙伴销售和受监管信贷运营。地域布局
              比全国性品牌名单暗示的更集中：Imprint 公开列出 New York、San Francisco 和 Seattle，而多数当前融资报道只称公司总部在 New
              York。缺口在治理披露。这里审阅的公开材料没有给出完整董事会名单、所有权拆分、投票权地图或关键人物继任框架，因此关键人依赖仍高度集中在 Murphy 以及他与 Ahuja 的创始人—投资人关系上。
