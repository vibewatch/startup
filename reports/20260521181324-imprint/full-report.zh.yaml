    rows:
      - - 通用联名卡
        - 带有商户或忠诚度品牌、并可在许多商户使用的卡组织品牌卡
        - 没有商户品牌的通用发卡方返现卡
        - 品牌赞助项目；发卡方为应收款供资；消费者循环借款时支付利息或费用
        - 核心市场
      - - 自有品牌卡或商店卡
        - 只能在一个商户或相关商户集团的私有网络内使用的卡
        - 可在商户外广泛使用的开放式联名卡
        - 商户促销和消费者融资经济性占主导
        - 直接替代品和迁移池
      - - 双网络零售卡
        - 商户品牌卡，店内走私有网络，其他场景走通用网络
        - 纯封闭式商店卡
        - 品牌既要商户相关性，也要更广泛的日常使用价值
        - 自有品牌与联名卡之间的桥接形态
      - - 嵌入式金融邻近领域
        - 通过非金融平台交付、与品牌相关的支付、贷款或账户产品
        - 以金融机构为核心的独立金融科技或银行产品
        - 平台拥有客户关系，受监管实体提供底层通道
        - 重要邻近项，但不是一一对应的 TAM 替代
      - - 现状替代项
        - 通用返现卡、结账 BNPL，以及传统发卡方主导的忠诚度卡
        - 有明确赞助方控制的商户品牌项目
        - 品牌会与默认消费者钱包行为和结账融资工具比较
        - 争夺同一忠诚度和支付预算
    notes: 本章把美国通用联名卡视为核心市场，把自有品牌 / 商店卡视为主要替代品和迁移池，并把嵌入式金融作为邻近价值链视角，而不是直接 TAM 替代。
