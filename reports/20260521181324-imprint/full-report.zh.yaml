  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式和公开可见价格表面
        blocks:
          - type: paragraph
            body: >-
              Imprint 的公开财务故事起点，不是经审计的收入披露，而是其卡片和合作项目可见的收费与奖励。已审阅官方页面显示，公司设计并管理为日常消费打造的联名卡，再叠加合作伙伴专属奖励机制。Shell
              升级卡把开放式受理、账单抵扣奖励，以及明确的 APR、费用和境外交易定价结合起来。H-E-B 加入单品级和商户专属奖励，包括自有品牌和 Favor 配送 5% 返现，同时仍披露标准循环信用 APR
              区间和滞纳金经济性。Fetch 将同一模式延伸到由 Imprint 管理、First Electronic Bank 发行的 American Express
              产品。合并来看，这些披露支撑了四个足以方向性承保的变现表面：购买额上的交换费、循环余额上的利息收入、罚金和附加费用带来的手续费收入，以及面向品牌和合作银行的 B2B
              项目管理或服务经济性。它们没有披露的是这些收入流当前的结构、合作伙伴收入分成，或奖励资金到底由品牌、发卡方、Imprint 还是某种谈判组合承担。
