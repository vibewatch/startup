      - number: '1.3'
        title: 融资历史、资本栈和规模信号
        blocks:
          - type: paragraph
            body: >-
              Imprint 的资本故事足以支撑后续尽调，但还不够干净，不能把每个摘要指标都当成定论。最可验证的里程碑包括：2024 年 10 月 Series C 将估值抬到 $600 million；2025 年 3
              月仓储额度把放贷能力推到约 $1 billion；2025 年 10 月完成 Fitch 评级的首单资产支持证券化；2025 年 12 月 Series D 将估值翻倍至 $1.2
              billion。这些节点同时显示股权支持，以及平台背后贷款账簿在资本市场中的可信度上升。更难的是量化当前规模。Forbes 称累计融资为 $433 million，Tracxn 称为 $353
              million，官方关于页面仍只写 Imprint 已融资超过 $200 million，说明营销页面尚未完全更新到后续融资。公开运营指标同样混杂。Sacra 估计 2024 年收入为 $70 million
              且增长曲线陡峭，Tech Company News 报道约 160 名员工，Tracxn 列出 245 人。因此，报告应把融资事件视为已验证事实，但把当前员工数、累计股权融资和 2026 年收入 /
              盈利能力视为尽调项，而不是封面事实。
