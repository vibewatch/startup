  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - Moat claim
      - Threat
      - Severity
      - Mitigation / diligence ask
    rows:
      - - Brand-native UX is the core differentiator
        - Cardless offers a very similar embedded brand-control pitch
        - High
        - Request win/loss examples that show why partners chose Imprint over Cardless or legacy issuers
      - - Speed to launch creates a sales edge
        - Marqeta and Stripe keep absorbing more issuing and compliance capability into configurable stacks
        - High
        - Benchmark implementation timelines, engineering lift, and launch conversion across providers
      - - Full-stack ownership can defend against bank UX inertia
        - Incumbents can use funding scale, renewal leverage, and acquisition channels to keep or reclaim portfolios
        - High
        - Review contract terms, renewal protections, and migration costs on major partner programs
      - - Partner wins can compound into cross-category proof
        - A smaller installed base gives less room for error if one major portfolio is lost at rebid
        - Medium
        - Stress-test concentration by partner, sector, and issuing-bank relationship
      - - Regulatory trust should favor large banks
        - CFPB actions show big issuers are not immune, while high APRs keep the category politically exposed
        - Medium
        - Audit complaint operations, exam history, and consumer-remediation procedures across bank partners
      - - Consumer-facing packages show the market can bear rich rewards
        - Merchant-side economics are private, raising the risk of hidden price competition and margin compression
        - High
        - >-
          Obtain partner-level revenue share, loss-sharing, subsidy, and setup-fee detail before underwriting moat
          durability
      - - Primary programs are sticky once live
        - Shell and American Airlines show that portfolios can still move at renewal or strategic reset
        - High
        - Model the business as renewal-cycle competitive, not permanently locked in after launch
    notes: >-
      Risk levels reflect the combination of public evidence strength and the likely impact on Imprint's ability to
      retain or win enterprise partner programs.
