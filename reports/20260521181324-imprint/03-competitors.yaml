  - id: pricing-packaging-and-substitutes
    title: Pricing, packaging, and substitute models
    body: >-
      Public pricing evidence is abundant on the consumer side and thin on the merchant side. The visible benchmark
      programs in this chapter compete through rewards density, annual-fee decisions, travel or status perks, and fee
      waivers: Amazon Prime Visa pushes 5% at Amazon and Whole Foods with no annual fee, Hyatt trades on high rewards
      and status-linked perks, REI and Target lean on simple store-value economics, JetBlue monetizes through an
      annual-fee travel package, and Shell's 2026 relaunch combines fuel relevance with everyday rewards. Those packages
      matter because they set customer expectations for any new brand card, even if the brand-side commercial terms are
      negotiated privately. That is where disclosure thins out. Cardless is unusually transparent through Sacra on
      funding, embedded UX, multi-network support, and even the presence of setup and ongoing program-management fees,
      but exact brand economics still are not public. Stripe and Marqeta make the build-versus-buy trade-off more acute
      by offering configurable issuance rails, bank-partner support, and modular processing. Affirm is the cleanest
      substitute for promotional-finance or checkout-conversion use cases, especially where a merchant does not need a
      durable open-loop card and loyalty program.
    claimRefs:
      - CP021
      - CP022
      - CP023
      - CP024
      - CP025
      - CP026
      - CP029
