      - TP001
    figureRefs:
      - FP001
  - id: incumbent-portfolios-and-distribution
    title: Incumbent portfolios and distribution power
    body: >-
      The strongest evidence-backed advantage of legacy issuers is not cleaner UX but distribution depth. Synchrony is
      the clearest public benchmark in merchant cards: its 2024 annual report shows more than $182 billion of purchase
      volume, $104.7 billion of receivables, 71.5 million active accounts, over 45 new partners added in the year, and
      over 45 program renewals. Bread Financial does not disclose the same merchant-card detail on the reviewed pages,
      but it still describes a broad co-brand, private-label, and pay-over-time business serving millions of U.S.
      consumers across multiple sectors. Citi says its U.S. Consumer Cards unit serves 70 million customers and now sits
      among the bank's five core businesses, while the American Airlines release shows Citi was willing and able to take
      Barclays' AAdvantage portfolio and all acquisition channels. Barclays still spans travel and retail brands, and
      Chase and Capital One each show enough branded-card breadth to matter even when they do not market themselves as
      pure co-brand specialists. For Imprint, that means the real incumbent moat is renewal leverage, funding depth, and
      long partner history—not that the banks have solved brand-native product design better than challengers.
    claimRefs:
      - CP004
      - CP005
      - CP006
      - CP007
