  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Program
      - Observable pricing / economics
      - Included capabilities / rewards
      - Public unknowns
      - Implication
    rows:
      - - Amazon Prime Visa (Chase)
        - 5% Amazon / Whole Foods / Chase Travel; 2% gas, restaurants, local transit; 1% elsewhere; no annual fee
        - Everyday ecommerce value plus travel and protection benefits
        - Prime-membership economics and merchant-side partner terms are not public
        - Large issuers can still deliver rich everyday value without an annual fee
      - - World of Hyatt (Chase)
        - Up to 9X at Hyatt; 19.24%-27.74% variable APR; annual free-night benefit
        - Travel-status ladder and free-night retention mechanic
        - Annual fee did not surface in the fetched text; merchant economics are private
        - Travel co-brands compete on status and loyalty depth, not only APR
      - - JetBlue Plus (Barclays)
        - $99 annual fee; 19.49%-29.49% purchase APR; 0% intro on early balance transfers
        - Airline rewards, statement credits, and checked-bag perks
        - Underlying airline revenue-share structure is private
        - Incumbents still package high-fee travel cards around rich loyalty benefits
      - - REI Co-op Mastercard (Capital One)
        - 5% at REI; 1.5% elsewhere; no annual fee or FX fees; 17.49% / 24.49% / 28.49% APR tiers
        - Member-centric rewards with fast redemption
        - Capital One's merchant economics with REI are not public
        - Partner cards can blend niche-brand affinity with mainstream issuer economics
      - - Target Circle Card / Mastercard
        - 5% at Target; no monthly or annual fees; Mastercard adds 2% dining and gas and 1% elsewhere
        - Discount-led everyday value with optional open-loop utility
        - Exact underwriting and subsidy economics are private
        - Retail cards are still forced to compete with richer open-loop value propositions
      - - Shell Performance Elite World Mastercard (Imprint)
        - 4% at Shell; 3% dining and groceries; 2% elsewhere; no annual fee
        - Fuel relevance plus broader everyday rewards and app-based servicing
        - Exact migration economics from prior issuer and ongoing partner terms are private
        - Imprint is using broader everyday value to dislodge a legacy card format
      - - Cardless (Sacra evidence)
        - >-
          Bilt tiers cited at $0 / $95 / $495; Sacra also reports setup fees and ongoing program-management fees for
          brands
        - Native app embedding, multiple networks, configurable rewards, analytics
        - Most brand-specific commercial terms remain private
        - Cardless is unusually close to Imprint on model, but public pricing still only partially visible
      - - Stripe Issuing / internal build
        - >-
          Flexible pricing and interchange-share model are described, but numeric commercial terms did not surface on
          the fetched page
        - Comprehensive program management or modular issuer processing with bank-partner support
        - Exact list pricing, implementation cost, and brand economics remain private
        - Infrastructure substitutes make build-versus-buy comparison unavoidable even when pricing is opaque
    notes: >-
      This table compares what a public diligence process can actually observe today: mostly consumer-facing rewards,
      APRs, and fee structures, with merchant-side economics still largely private.
