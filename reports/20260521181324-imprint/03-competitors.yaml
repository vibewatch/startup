      - - Synchrony
        - Legacy issuer / merchant-finance incumbent
        - $182B+ 2024 purchase volume; $104.7B receivables; 71.5M active accounts
        - Retailers, SMBs, healthcare, home, auto, and other merchant-finance verticals
        - Balance sheet, renewal leverage, private-label depth, cards plus loans
        - Brand-native UX appears weaker than challenger positioning
      - - Bread Financial
        - Legacy issuer / private-label and co-brand incumbent
        - Public company serving millions of U.S. consumers across many verticals
        - Travel, beauty, technology, electronics, jewelry, home, apparel
        - Co-brand, private-label, and pay-over-time in one payments stack
        - Public merchant-segment economics are thin versus Synchrony
      - - Citi
        - Legacy bank issuer
        - U.S. Consumer Cards says it serves 70M customers and is a core Citi business
        - Large airline, retail, and branded-card partnerships
        - Branded, co-branded, private-label, and installment lending with large acquisition channels
        - Digital-first strategy is public; merchant-specific implementation detail is not
      - - Barclays US
        - Legacy co-brand issuer
        - Top-tier issuer with active travel, retail, entertainment, and business-expense card lineup
        - Airlines, apparel, entertainment, and retail partners
        - Breadth across many live co-brand programs
        - Less public disclosure on merchant-finance depth than Synchrony or Citi
      - - Chase
        - Large universal-bank issuer
        - Broad travel, rewards, and business-card portfolio
        - Airline, hotel, ecommerce, and consumer-loyalty programs
        - Deep category reach with strong branded-card offers such as Amazon and Hyatt
        - Public partner-issuer pitch is less explicit than fintech challengers
      - - Capital One
        - Large bank issuer with partner-card presence
        - Mainstream portfolio plus partner-card evidence such as REI, Kohl's, and T-Mobile economics on public pages
        - Retail, telecom, and outdoor/specialty loyalty programs
        - Known consumer brand and marketing scale
        - Partner-card breadth is less clearly merchandised than the largest co-brand specialists
      - - Cardless
        - Direct fintech challenger
        - '>$170M total funding after Sep. 2025 Series C'
        - Brands that want a native app or web card experience
        - Embedded UX, multi-network support, configurable rewards, and program-management layer
        - Still depends on issuing-bank partners and faces interchange / saturation risk
      - - Marqeta
        - Issuing infrastructure substitute
        - Public card-infrastructure platform; no merchant-card balance sheet of its own in reviewed sources
        - Brands, fintechs, and commercial-card builders
        - Embedded co-brand credit, instant issuance, and customizable rewards primitives
        - More infrastructure than finished loyalty operator
      - - Stripe Issuing
        - Modular issuing and program-management substitute
        - 275M+ cards created
        - Software platforms, enterprises, travel, fuel, expense, and loyalty builders
        - Comprehensive or modular model, bank-partner support, and broad configurable controls
        - Requires the brand or partner stack to assemble more of the finished consumer proposition
    notes: >-
      Covers the highest-relevance incumbents, challengers, and substitutes surfaced in this run; scale cells use only
