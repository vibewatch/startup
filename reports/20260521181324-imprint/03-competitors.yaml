          Private operator; Shell says Imprint also manages Crate & Barrel, Rakuten, H-E-B, and Turkish Airlines
          programs
        - Consumer brands that want a brand-native card and loyalty stack
        - Owns application, servicing, rewards, and adjacent product surface inside the brand experience
