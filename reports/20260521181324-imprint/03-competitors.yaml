  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: merchant-economics
      missingEvidence: >-
        Partner-level revenue share, interchange split, loss-sharing, setup fees, and underwriting waterfall terms for
        Imprint, Cardless, and major incumbent issuer programs.
      whyItMatters: >-
        Competitive durability depends as much on partner economics as on rewards design, but those economics are mostly
        invisible in public materials.
      diligencePath: >-
        Request partner contracts, renewal decks, or reference-call evidence that compares brand economics across
        incumbent, challenger, and infrastructure-led options.
      relatedQuestionRefs:
        - QP019
        - QP027
      relatedTableRefs:
        - TP003
    - type: missing-source
      severity: material
      topic: switching-costs
      missingEvidence: >-
        Comparable benchmarks for implementation timeline, migration cost, conversion lift, and operational pain when
        brands switch card operators or issuers.
      whyItMatters: >-
        The chapter can show that switching happens, but not yet quantify how hard it is or how often incumbents versus
        challengers actually win rebids.
      diligencePath: >-
        Collect RFPs, migration case studies, or partner reference calls that compare launch speed and replatforming
        effort across providers.
      relatedQuestionRefs:
        - QP026
      relatedTableRefs:
        - TP004
    - type: missing-source
      severity: minor
      topic: deserve-status
      missingEvidence: >-
        Current standalone Deserve customer roster, product scope, and go-to-market materials that resolve its role
        beyond the Marqeta-linked platform narrative.
      whyItMatters: >-
        Deserve is relevant as an infrastructure-side substitute, but the public evidence set is too thin to rank it
        confidently against Cardless, Marqeta, or Stripe.
      diligencePath: >-
        Obtain direct company confirmation, current partner announcements, or verifiable press coverage that shows
        Deserve's active 2026 positioning.
      relatedQuestionRefs:
        - QP028
