tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Publicly evidenced mechanism
  - Evidence today
  - Revenue quality / risk
  - Diligence ask
  rows:
  - - Interest income
    - Revolving co-branded card balances carry disclosed APRs and show up in trust yield.
    - Shell purchase APR 20.99%-35.99%; H-E-B purchase APR 17.24%-35.99%; Fitch observed 29.79% gross yield.
    - Recurring and scalable if receivables season well, but directly exposed to charge-offs and funding cost.
    - Provide 2025-2026 net interest income by partner / issuer and revolve rate by vintage.
  - - Interchange
    - Open-loop Mastercard, Visa, and American Express cards monetize ongoing purchase volume.
    - Shell, H-E-B, Booking, Rakuten, and Fetch all emphasize everyday spend and broad acceptance.
    - Potentially diversified with spend volume, but gross interchange may be partly offset by partner economics and rewards.
    - Disclose gross interchange bps, network mix, and partner revenue-share structure.
  - - Fee income
    - Consumer card agreements disclose late fees, foreign transaction fees, and cash-advance charges.
    - Shell late fee up to $41 and 3% FX fee; H-E-B late fee up to $35; both have revolving-card agreements.
    - Real but probably smaller than interest plus interchange; also more regulation-sensitive.
    - Show fee income as a share of revenue and any fee-waiver or hardship policy.
  - - Program-management / servicing economics
    - Imprint publicly says it designs, launches, manages, and services card programs and rewards flows for brands.
    - Shell rewards terms and Fetch launch describe Imprint as manager / administrator while partner banks issue cards.
    - Could create sticky B2B revenue, but pricing and recognition basis are not disclosed.
    - Provide setup fees, servicing fees, and whether revenue is recorded gross or net of partner-funded rewards.
  - - Loyalty / advertising expansion
    - Series D memo says Imprint will invest in loyalty, advertising, and an Imprint Rewards Network beyond core credit.
    - Clear strategic direction, but no current standalone revenue line is disclosed.
    - Optional upside rather than underwritten base-case revenue today.
    - Quantify 2026 contribution margin and adoption of non-card products.
  notes: Rows mix disclosed consumer price surfaces with inferred monetization modes; no reviewed primary source breaks current revenue into interest, interchange, fee, and service components.
