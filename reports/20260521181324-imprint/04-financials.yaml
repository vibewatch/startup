- id: TI002
  title: Pricing / monetization table
  columns:
  - Program / surface
  - Public cardholder economics
  - What the brand sees
  - Implied monetization surface
  - Caveat
  rows:
  - - Shell Performance Elite World Mastercard
    - 4% Shell, 3% dining / grocery, 2% other; APR 20.99%-35.99%; no annual fee.
    - Shell sponsors rewards while Imprint administers them and manages the upgraded digital card experience.
    - Interest income, interchange, late / FX fees, and admin / servicing economics.
    - Public terms do not disclose Shell-Imprint-bank economics or reward subsidy split.
  - - H-E-B Visa Signature
    - 5% on H-E-B brands, 5% on Favor delivery, 1.5% elsewhere; APR 17.24%-35.99%; no annual fee.
    - Imprint and H-E-B can tune item-level rewards and real-time promotions.
    - Interest income, interchange, and rewards-admin economics tied to grocery basket behavior.
    - No public data on partner subsidy, brand-margin sharing, or realized take rate.
  - - Fetch American Express
    - 10 points / $ on grocery and retail, 5 points / $ on all other purchases; launch release reviewed, not full agreement.
    - Card is meant to deepen the Fetch rewards ecosystem and extend loyalty into payments.
    - Spend-linked interchange and program-management revenue, partly shaped by AmEx / issuer economics.
    - APR, fees, and exact revenue split were not public in the reviewed launch release.
  - - Program launch speed
    - Imprint cites a one-week Holiday Inn Club Vacations launch proof point and says launches can happen in as little as 3 months.
    - Faster implementation can lower partner switching friction and improve enterprise sales conversion.
    - Setup and servicing revenue become more valuable when deployment is faster and less disruptive.
    - No public contract pricing or implementation-cost disclosure.
  - - Everyday-spend positioning
    - Shell, Fetch, Rakuten, and Booking all emphasize everyday or broad-use spending rather than single-ticket financing.
    - Brand value is framed as repeat spend, higher wallet share, and better loyalty loops.
    - Recurring spend can support both interchange and revolving-balance revenue quality.
    - Public sources do not break spend mix or active-rate performance by partner.
  notes: This table captures list economics visible to cardholders and partners, not realized net revenue or gross margin.
