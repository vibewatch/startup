  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current cash balance, monthly burn, and management runway scenarios.
    whyItMatters: Without liquidity and burn data, the chapter cannot determine how long Imprint can self-fund growth or when a new financing event becomes mandatory.
    diligencePath: Request current board package or monthly finance dashboard showing unrestricted cash, covenant headroom, and base / bear runway.
    relatedQuestionRefs:
    - QI014
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: A revenue bridge splitting interest income, interchange, fee income, and program-management revenue.
    whyItMatters: Revenue quality and regulatory sensitivity depend on how much of gross economics comes from each stream.
    diligencePath: Obtain a management revenue bridge by partner and stream for 2024, 2025 actuals, and 2026 budget.
    relatedQuestionRefs:
    - QI003
    - QI009
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: material
    topic: margin-bridge
    missingEvidence: Gross margin, contribution margin, rewards expense, servicing cost, fraud losses, and net charge-offs by cohort.
    whyItMatters: The public record shows gross yield and charge-off proxies but not whether the remaining economics are attractive after rewards and servicing.
    diligencePath: Request internal cohort economics by major partner showing spend, revolve, rewards cost, servicing cost, and net contribution.
    relatedQuestionRefs:
    - QI010
    - QI011
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: partner-concentration
    missingEvidence: Top-partner concentration for receivables, revenue, and originations plus current issuer-bank mix.
    whyItMatters: A few large partners or a single issuing-bank channel could make the model more brittle than the marquee partner roster implies.
    diligencePath: Request a concentration table covering top-5 partners, receivables by issuer bank, and monthly originations by partner.
    relatedQuestionRefs:
    - QI016
    - QI017
    - QI018
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: trust-performance-detail
    missingEvidence: Monthly trust reporting with excess-spread history, reserve status, static-pool curves, and any downgrade or covenant thresholds.
    whyItMatters: Fitch provides a snapshot, but underwriting ABS dependence requires ongoing trigger and vintage visibility.
    diligencePath: Collect investor reporting packs for 2025-A and any warehouse-monitoring packages covering collateral performance and reserve tests.
    relatedQuestionRefs:
    - QI012
    - QI013
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: minor
    topic: complaint-disposition
    missingEvidence: A quantified complaint count and disposition trend from BBB, CFPB, or internal customer-support data.
    whyItMatters: The adverse surface exists publicly, but the current excerpt does not show whether it is small noise or a scaling issue.
    diligencePath: Review complaint database exports, regulator complaints, and internal support SLAs / backlog trends.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI005
