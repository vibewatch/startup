- id: TI004
  title: Capital adequacy table
  columns:
  - Metric
  - Public value / status
  - Evidence
  - Assessment
  - Diligence ask
  rows:
  - - Cash on hand
    - null
    - No reviewed source states ending cash balance.
    - Key underwriting input is missing.
    - Provide latest unrestricted cash and minimum-liquidity covenant schedule.
  - - Monthly burn
    - null
    - No public operating-expense or EBITDA bridge was found.
    - Cannot assess self-funded runway or downside resilience.
    - Provide monthly burn by platform, servicing, and new-product initiatives.
  - - Runway months
    - null
    - Cash and burn are both undisclosed.
    - Public runway cannot be computed responsibly.
    - Share board-approved liquidity plan and downside runway scenario.
  - - Planned use of funds
    - Core platform, more financial products, AI / automation, and loyalty / advertising.
    - Series D announcement describes forward investment areas.
    - Capital appears aimed at expansion as well as software / product leverage, not just a balance-sheet plug.
    - Map each budget line to a 24-month spend plan and expected payback.
  - - Next-round trigger
    - Not publicly disclosed.
    - Company highlights growth, lending capacity, and ABS repeatability, but not a formal trigger.
    - Future dilution / refinancing timing remains opaque.
    - Disclose board thresholds for another equity raise or additional term funding.
  - - Warehouse / lending capacity
    - ~$1B total lending capacity after March 2025 $500M warehouse facility.
    - BusinessWire warehouse announcement.
    - Strong external debt support, but growth is still tied to lender appetite and facility terms.
    - Provide advance rates, covenants, collateral eligibility, and unused headroom.
  - - ABS program
    - $300M inaugural ABS upsized from $200M; reserve funds only if 3-month average excess spread falls below 2% from Feb-2026.
    - ABS announcement plus Fitch rating reports.
    - Diversifies funding and validates receivables performance, but adds market-access and trigger dependence.
    - Provide monthly trust reports, reserve test history, and planned issuance cadence.
  - - Debt / credit obligations
    - Receivables trust uses subordination, overcollateralization, reserve mechanics, and partner-bank origination.
    - Fitch presale and final rating reports.
    - Capital intensity is driven by credit exposure and funding structure rather than hardware capex.
    - Provide receivables by issuer / partner, hedging policy, and rate-mismatch management.
  notes: The mandatory cash, burn, and runway fields remain intentionally null because reviewed public sources do not disclose them; financing rows focus on verified warehouse, ABS, and equity support.
