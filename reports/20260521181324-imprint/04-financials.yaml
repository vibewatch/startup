company:
  name: Imprint
chapter:
  number: 4
  title: Financials
  summary: Imprint has credible public proof of how money can be made and how receivables are funded, but not of a fully disclosed income statement. Official card terms, partner pages, warehouse and ABS announcements, and Fitch trust data support a model driven by interchange, finance charges, fee income, and program-management economics, while current revenue mix, gross margin, burn, and runway remain nonpublic diligence blockers.
sections:
- id: revenue-model-and-price-surfaces
  title: Revenue model and publicly visible price surfaces
  body: 'Imprint''s public financial story starts with what its cards and partner programs visibly charge and reward, not with audited revenue disclosure. The reviewed official pages show a company that designs and manages co-branded cards built for everyday spend, then layers partner-specific reward mechanics on top. Shell''s upgraded card combines open-loop acceptance with statement-credit rewards and explicit APR, fee, and foreign-transaction pricing. H-E-B adds item-level and merchant-specific rewards, including 5% cash back on house brands and Favor delivery, while still disclosing a standard revolving-credit APR band and late-fee economics. Fetch extends the same pattern into an American Express product managed by Imprint and issued by First Electronic Bank. Taken together, those disclosures support four monetization surfaces that are real enough to underwrite directionally: interchange on purchase volume, finance charges on revolving balances, fee income on penalty and ancillary charges,
    and B2B program-management or servicing economics for brands and partner banks. What they do not disclose is the current mix across those streams, the partner revenue split, or whether rewards funding is carried by the brand, issuer, Imprint, or some negotiated combination.'
