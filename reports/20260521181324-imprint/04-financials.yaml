- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Public status
  - Exact diligence path
  rows:
  - - Current revenue / ARR
    - Needed to anchor valuation and margin path.
    - Only external estimate references are public; no reviewed primary source publishes current revenue.
    - Request 2024 audited revenue, 2025 actuals, and 2026 budget with partner / product split.
  - - Revenue mix by interest / interchange / fees / service
    - Determines quality, cyclicality, and sensitivity to regulation or loss rates.
    - Not publicly disclosed in reviewed primary materials.
    - Request management bridge from gross purchase volume to net revenue by stream.
  - - Gross margin and contribution margin
    - Separates software leverage from credit-risk and rewards drag.
    - Not disclosed publicly.
    - Request gross profit, servicing cost, fraud loss, rewards expense, and contribution margin by partner cohort.
  - - Cash balance, burn, and runway
    - Core solvency and dilution questions.
    - Not disclosed publicly.
    - Request current liquidity, monthly burn, base / bear runway, and covenant headroom.
  - - Partner concentration
    - Determines whether growth and risk are diversified or concentrated in a few brands.
    - Public partner list is visible, but receivables and revenue concentration are not.
    - Request top-5 partner share of receivables, revenue, and originations.
  - - Issuer-bank and trust mix
    - Important for funding dependency and operational risk.
    - Public sources show multiple issuing-bank relationships but not current mix by receivables.
    - Request receivables and originations by First Electronic Bank, First Bank & Trust, and any acquired portfolios.
  - - Vintage loss and yield curves
    - Needed to judge whether current trust metrics are durable or still immature.
    - Only headline trust metrics are public.
    - Request monthly static-pool data, delinquency migration, and recovery assumptions.
  - - Rewards funding split
    - Rewards can either support growth or compress margin depending on who pays.
    - Public terms describe rewards but not economic burden-sharing.
    - Request contract summary showing partner-funded vs issuer-funded vs Imprint-funded rewards.
  notes: These are the minimum missing data points required to move from directional underwriting to a credible operating model and runway view.
