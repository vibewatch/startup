- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Launch speed proof point
    - 1 week for Holiday Inn Club Vacations; company also says some launches can happen in as little as 3 months.
    - medium
    - Fast deployment can shorten sales cycles and reduce partner switching pain.
    - Median enterprise sales cycle, implementation headcount, and launch cost per program.
  - - Activation / usage proxy
    - 60% active rate for Turkish Airlines cardholders (company-claimed).
    - low
    - Suggests top-of-wallet potential if the metric is measured on a comparable basis.
    - Definition of active, sample size, and active rate by partner / vintage.
  - - Merchant spend-lift proxy
    - 41% more resort spend among cardholders than non-cardholders at Westgate Resorts (company-claimed).
    - low
    - Higher spend lift can justify better brand economics and renewals.
    - Study design, control group, and whether lift is gross of rewards cost.
  - - Portfolio growth signal
    - 200% YoY cardholder base growth reported in Series D announcement.
    - medium
    - Scale can absorb platform fixed costs, but also increases funding needs.
    - Absolute cardholder count, active share, and acquisition cost per new cardholder.
  - - Partner ROI claims
    - 2x wallet share, 8x lifetime value, and 20% spend increase versus prior program.
    - low
    - These are the clearest public reasons a brand would accept premium economics or migration effort.
    - Methodology, partner sample, and whether outcomes are net of rewards and credit losses.
  - - Portfolio credit performance
    - Fitch observed 29.79% gross yield, 6.73% gross charge-offs, and 34.26% monthly payment rate in Aug-2025.
    - medium
    - Closest public proxy for revenue yield, loss drag, and cash recycling on the receivables book.
    - Net charge-offs, fraud losses, reserve build, and partner-level vintage curves.
  - - Revenue disclosure quality
    - External estimate exists, but reviewed company sources still do not publish current audited revenue, ARR, or gross profit.
    - low
    - Limits any attempt to underwrite margin path from public materials alone.
    - Provide 2025 revenue, gross profit, and a 2026 operating plan.
  - - Funding-cost benchmark
    - Synchrony funded 84% of 2024 funding with deposits while financing >$182B of purchase volume.
    - medium
    - Shows why deposit-funded incumbents likely enjoy cheaper funding than warehouse / ABS-backed challengers.
    - Imprint weighted-average funding cost and rate sensitivity versus partner-bank / warehouse structures.
  notes: Values mix official company claims, partner-proof points, rating-agency trust data, and public-company benchmark context; they are not a substitute for an internal contribution-margin model.
