summary:
  headline: >-
    Imprint appears strategically credible and commercially real, but incomplete disclosure, credit-and-funding
    intensity, and a stretched public valuation bridge support a research-more recommendation rather than a buy call.
  overallScore: 5.9
  recommendation: research-more
