  topStrengths:
    - >-
      Imprint has verified live programs with recognizable brands across travel, grocery, fuel, retail, and rewards
      ecosystems.
    - >-
      The company has shown real capital access through a late-stage equity round, a large warehouse facility, and a
      Fitch-rated ABS transaction.
    - >-
      ImprintCore and partner pages support a genuinely brand-native product proposition rather than a logo-only bank
      white label.
    - Public sources support strong recent cardholder growth and partner momentum entering 2026.
  topRisks:
    - >-
      Current public disclosure is too thin on revenue, margins, burn, runway, cap-table terms, and board control to
      underwrite the business cleanly.
    - >-
      The model depends on credit performance, lender appetite, securitization access, and issuer-bank relationships,
      not just software adoption.
    - >-
      Public sources do not disclose partner concentration, contract durations, renewal dates, or partner-level
      economics.
    - >-
      Headcount and total funding totals conflict across public sources, weakening confidence in simple maturity
      narratives.
    - >-
      At the $1.2 billion mark, the visible valuation bridge still looks stretched relative to the cleanest public
      revenue anchor.
  unresolvedGaps:
    - Current recognized revenue, contribution margin, gross margin, and GAAP profitability timing.
    - Board composition, ownership percentages, preference stack, and investor control rights.
    - Partner concentration by revenue, renewal timing, churn, and contract economics.
    - Warehouse covenants, ABS performance trend, and any loss-sharing or reserve obligations with issuer banks.
    - A reconciled current employee count and a reconciled total equity-versus-debt funding ledger.
