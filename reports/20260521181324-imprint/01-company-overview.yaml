  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding-total
    missingEvidence: A current company-approved funding ledger reconciling equity raised, debt facilities, and securitization proceeds.
    whyItMatters: Later valuation and dilution analysis can be distorted if the report mixes equity-only, debt-inclusive, and stale marketing totals.
    diligencePath: Request a cap-table summary and financing timeline from management or an investor data room, including whether warehouse and ABS capital are counted in “total funding.”
    relatedQuestionRefs:
    - QO016
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A dated current employee count with the same definition across trackers and company disclosures.
    whyItMatters: Headcount is being used as a proxy for operating leverage and maturity, but public sources currently conflict.
    diligencePath: Ask management for current FTE count by function and compare against payroll or insurance census data.
    relatedQuestionRefs:
    - QO018
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: governance-gap
    missingEvidence: Board roster, ownership percentages, voting rights, and any founder or investor protective provisions.
    whyItMatters: Control rights and succession risk materially affect downside protection, refresh cadence, and any IPO-readiness judgment.
    diligencePath: Request board observer list, latest cap table, and governance documents under NDA.
    relatedQuestionRefs:
    - QO010
    - QO023
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure-gap
    missingEvidence: Primary-source disclosure of 2025 revenue, current run-rate, and target or achieved GAAP profitability timing.
    whyItMatters: Public valuation and later financial analysis become too estimate-heavy without a management-backed revenue and profitability bridge.
    diligencePath: Request monthly revenue bridge, cohort margin view, and board or lender materials that disclose current profitability trajectory.
    relatedQuestionRefs:
    - QO026
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table chronology coverage
    missingEvidence: A fully reconciled dated chronology for every internal launch, exact Series B date, and all partnership go-live dates.
    whyItMatters: The milestone table is intentionally partial because several company milestones are only visible through summary pages and tracker narratives, which weakens precise sequencing.
    diligencePath: Request an internal company timeline or press archive export with exact dates for every financing, partnership launch, and governance change.
    relatedQuestionRefs:
    - QO019
    - QO024
    relatedTableRefs:
    - TO004
