company:
  name: Imprint
chapter:
  number: 1
  title: Company Overview
  summary: Imprint is a New York-based co-branded card and loyalty platform founded in 2020 that positions its ImprintCore stack as a faster, more brand-native alternative to legacy bank issuers. Public evidence supports a sharp capital step-up from a $75 million Series C in October 2024 to a $150 million Series D at a $1.2 billion valuation in December 2025, plus warehouse and securitization funding, but current board, cap-table, headcount, and 2026 revenue disclosure remain incomplete or internally inconsistent.
sections:
- id: identity-and-platform
  title: Identity, product posture, and operating model
  body: 'Imprint presents itself as a modern co-branded financial platform rather than a generic issuer processor. Its homepage, about page, and late-2025 financing materials all describe a business that helps brands design, launch, and operate financial products and loyalty experiences inside the brand’s own digital environment. The current product set clearly extends beyond a single credit-card SKU: the homepage advertises credit cards, deposit accounts, and installment loans, while the Series D announcement says the roadmap now extends into debit, secured cards, flexible financing, AI-enabled automation, and loyalty advertising. The strategic thread across all of those surfaces is brand-native control. Imprint argues that legacy bank issuers and old processor stacks make co-brand programs too slow, too rigid, and too detached from the merchant’s app or website, so it built ImprintCore to own sign-up, underwriting, card management, rewards, and data plumbing in one stack. That makes the
    company best understood as a B2B2C embedded-finance provider whose real customer is the brand, with the cardholder experience used as the mechanism for improving loyalty, spend, and lifetime value.'
  claimRefs:
