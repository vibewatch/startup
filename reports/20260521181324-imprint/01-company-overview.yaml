- id: capital-stack-and-scale-signals
  title: Funding history, capital stack, and scale signals
  body: Imprint’s capital story is strong enough to anchor later diligence, but not clean enough to treat every summary metric as settled fact. The most verifiable milestones are the October 2024 Series C, which lifted valuation to $600 million, the March 2025 warehouse facility that brought lending capacity to roughly $1 billion, the October 2025 Fitch-rated inaugural asset-backed securitization, and the December 2025 Series D that doubled valuation to $1.2 billion. Those milestones show both equity support and increasing capital-markets credibility for the loan book behind the platform. The harder part is current scale quantification. Forbes says cumulative funding is $433 million, Tracxn says $353 million, and the official about page still says only that Imprint has raised over $200 million, which suggests marketing surfaces have not been fully updated to match later financings. Public operating metrics are similarly mixed. Sacra estimates $70 million of 2024 revenue and a sharp growth
    curve, while Tech Company News reports roughly 160 employees and Tracxn lists 245. The report should therefore treat financing events as verified, but current headcount, total equity raised, and 2026 revenue/profitability as diligence items rather than settled cover facts.
