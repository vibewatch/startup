callouts:
- calloutType: strength
  title: Imprint’s strongest asset is the combination of brand-native UX and growing capital-markets credibility
  body: 'The reviewed source set supports a clear pattern: Imprint is winning partners by offering more customization and tighter embedding than legacy bank programs, while simultaneously proving it can fund receivables through warehouse lenders and a Fitch-rated ABS. That combination is more durable than a simple rewards-card feature claim.'
  claimRefs:
  - CO006
  - CO007
  - CO020
  - CO022
  - CO023
  - CO025
  - CO042
- calloutType: risk
  title: Disclosure quality is still behind the financing story
  body: The company’s headline milestones are easy to verify, but current operating scale is not. Public sources disagree on total capital raised and employee count, the official about page still carries an older funding total, and board or ownership details are not publicly surfaced. That weakens confidence in any simple “unicorn therefore mature” narrative.
  claimRefs:
  - CO018
  - CO027
  - CO028
  - CO031
  - CO032
  - CO033
  - CO043
  - CO044
  - CO045
- calloutType: assumption
  title: Treat public revenue and profitability figures as model inputs, not audited facts
  body: Sacra provides a useful model of 2024 revenue and monetization mix, but that is still a third-party estimate. Until Imprint itself discloses current run-rate, margin, and GAAP timing in a durable primary source, later chapters should distinguish between verified round data and estimated financial performance.
  claimRefs:
  - CO029
  - CO030
  - CO045
