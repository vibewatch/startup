    rows:
      - - Industrial production and qualification base
        - Manufacturing, assembly, integration, and environmental test backbone across vehicles, satellites, and subsystems
        - Sierra says it has more than 100,000 square feet for production and test plus environmental, TVAC, propulsion, and spacecraft integration work
        - Sierra facilities and hiring pipeline
        - Public evidence proves test capacity better than serialized operational throughput
      - - Dream Chaser plus Shooting Star transport layer
        - Integrated vehicle and cargo-module stack for launch, orbit operations, and runway-return workflow
