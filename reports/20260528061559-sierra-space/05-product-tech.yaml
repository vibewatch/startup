  - id: maturity-roadmap-and-dependencies
    title: Verified maturity versus roadmap claims
    body: |-
      Sierra’s product maturity is uneven and the distinction between “tested,” “qualified,” and “operationally proven” is the chapter’s central judgment. LIFE has meaningful public test evidence: Sierra has published both ultimate burst-pressure and extended-duration stress milestones. Shooting Star and Dream Chaser also show a credible qualification path through NASA Armstrong and Kennedy campaigns, including stacked system tests for vibration, acoustic, and thermal-vacuum conditions. Defense-satellite work shows the clearest production proof, because Sierra disclosed that the first nine SDA tracking-layer structures were completed three months ahead of schedule.

      The problem is that the flagship programs are still not operating revenue products. By late 2025 Sierra and NASA had moved Dream Chaser’s first mission to a late-2026 free-flyer demonstration and removed NASA’s prior minimum-flight commitment. That pushes Sierra’s most differentiated transport asset back from “about to start service” into “must prove itself again.” LIFE and Orbital Reef remain even earlier on the commercialization curve: their public record shows tests, partner architecture, and broad use cases, but not deployed operations or disclosed nongovernment demand. The maturity conclusion is therefore not that Sierra lacks technology. It is that the company has more verified technical capability than verified commercial service readiness for its marquee platforms.
