  - id: architecture-and-operating-model
    title: Architecture, industrial base, and how the stack is delivered
    body: |-
      The architecture is more specific than a generic “space platform” story. At the vehicle level, Dream Chaser and Shooting Star form a two-part cargo stack that is tested together, launched together, and then separated into transportation and logistics functions. At the habitat layer, LIFE is tied to environmental-control and life-support systems that Sierra also sells as standalone hardware. At the satellite layer, the Eclipse bus family sits on top of Sierra’s subsystem bench in power, mechanisms, propulsion, thermal control, and servicing technologies. This is why Sierra can market one integrated story across cargo, stations, and defense missions: the cross-program logic is shared hardware and test capability, not only brand adjacency.

      Public evidence for the operating model is strongest in manufacturing and qualification. Sierra says it has more than 100,000 square feet of production and test space for subsystem assembly, satellite production, Dream Chaser fabrication, and environmental, thermal-vacuum, propulsion, and integration work. Public recruiting still emphasizes engineers who design, test, and certify payloads and electronics, reinforcing that the operating model is qualification-led. That is a strength, because it points to a real industrial base. It is also a limit, because the public record is far better at proving test readiness and component capability than at proving recurring service cadence, refurbishment throughput, or software-assurance maturity.
