chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Sierra Space does deliver a real multi-product space hardware stack, but the maturity is uneven.
    Subsystems, test infrastructure, and defense-satellite structures show repeatable industrial evidence,
    while Dream Chaser and the LIFE/Orbital Reef platform remain differentiated but still contingent on
    launch, licensing, and customer-demand milestones that Sierra does not fully control.
sections:
  - id: product-portfolio-and-user-jobs
    title: What Sierra Space actually delivers today
    body: |-
      Sierra Space should not be analyzed as a single-vehicle story. Its current product surface spans Dream Chaser transportation, the Shooting Star cargo module, LIFE habitat infrastructure, Orbital Reef station concepts, Eclipse satellite buses, and a wider subsystem catalog across power, life support, propulsion, servicing, and thermal control. That breadth matters because public evidence shows two different businesses living under one brand. One is a highly differentiated flagship layer built around Dream Chaser and future habitats. The other is a more conventional but more industrialized hardware business that sells buses, components, structures, and engineering services into government, civil, and commercial missions.

      In customer-workflow terms, Dream Chaser is not just a launch payload. Sierra markets it as a reusable runway-landing cargo system paired with Shooting Star, which expands upmass, disposal, and future free-flyer options. LIFE and Orbital Reef are sold as habitat and station infrastructure rather than a current recurring service. Eclipse and the heritage subsystem lines widen the product map further by letting Sierra monetize national-security and satellite demand without waiting for the station market to mature. The product conclusion is therefore straightforward: Sierra has a real portfolio, but only part of it is already behaving like an operational product family rather than a roadmap asset.
