        - ULA Vulcan launch, NASA mission demand, FAA reentry path
        - First mission reset means architecture is technically real but not yet operationally proven
      - - Habitat and life-support layer
        - LIFE pressure vessel plus ECLSS hardware for long-duration station living and operations
        - LIFE structural tests and ECLSS page showing short- and long-duration support hardware
        - Orbital Reef partner architecture and commercial-station demand
        - Habitat commercialization still depends on external station economics and partner timing
      - - Satellite bus and mobility layer
        - Eclipse family provides configurable bus classes for defense and commercial missions
        - Sierra satellite pages and bus launch materials describe Horizon, Velocity, and Titan classes
        - Government buyers, integration requirements, and launch availability
        - Public evidence on bus heritage is weaker than on structure production milestones
      - - Subsystem catalog layer
        - Power, propulsion, servicing, thermal-control, and mechanism components that can ship independently of flagship platforms
        - Power-system and propulsion pages plus catalog PDFs show sellable hardware families
        - Export controls, customer qualification, and integration into third-party missions
        - Public sources emphasize capability breadth more than installed base by mission
      - - Operations and support loop
        - Kennedy launch processing, Florida reprocessing, runway reentry planning, and future mission sustainment
        - Sierra named All Points Logistics for long-term reprocessing; FAA tracks Huntsville reentry licensing
        - NASA processing flow, All Points, Huntsville approval path
        - Refurbishment cadence and cost remain undisclosed
    notes: Architecture is stated in product and operations terms rather than software-diagram terms because Sierra’s public evidence is dominated by hardware, facilities, and mission workflow.
