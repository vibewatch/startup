tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - module or asset
      - primary user or buyer
      - delivered job
      - maturity or status
      - differentiation
      - diligence gap
    rows:
      - - Dream Chaser Tenacity
        - NASA cargo customer today; future national-security or commercial users if demo succeeds
        - Reusable transport with runway return for orbital cargo and sensitive payloads
        - Integrated vehicle tested and mission reset to late-2026 free-flyer demo
        - Lifting-body runway landing, low-g return, and reusable flight article concept
        - No public proof yet on turnaround cadence, per-mission economics, or successful on-orbit service
      - - Shooting Star cargo module
        - NASA cargo logistics; future free-flyer or hosted-payload users in Sierra roadmap
        - Adds pressurized cargo, disposal, and payload power/volume to Dream Chaser missions
        - Standalone module has completed NASA-led environmental test campaign but has not flown
        - 7K-pound internal cargo capacity, external mounting points, and stated launch-vehicle flexibility
        - Public evidence does not show free-flyer commercialization or non-NASA users
      - - LIFE habitat
        - Future station operators, sovereign crews, research users, and NASA-style anchor tenants
        - Inflatable large-volume habitat and life-support-enabled living or laboratory space
        - Subscale and one-third-scale structural tests completed; commercial service remains roadmap
        - Conventional-rocket launch plus on-orbit inflation gives volume beyond rigid modules
        - No disclosed operating module, signed commercial tenant stack, or unit economics
      - - Orbital Reef platform role
        - Blue Origin-led station ecosystem with mixed research, commerce, and tourism users
        - Station architecture and destination concept using LIFE and modular partner systems
        - Partner architecture and concept marketing remain ahead of deployed infrastructure
        - Mixed-use station framing with modular design and Sierra habitat contribution
        - Market timing and demand are still exposed to ISS transition and anchor-tenant uncertainty
      - - Eclipse satellite bus line
        - Defense, civil, and commercial mission buyers needing mobility, servicing, or observation buses
        - Full satellite platform across Horizon, Velocity, and Titan classes
        - Formal bus-family launch completed; SDA structure delivery is strongest public production proof
        - Servicing, rendezvous, proximity operations, edge compute, and propulsion-oriented mission design
        - No public on-orbit heritage or named bus customers in the reviewed set
      - - Heritage subsystems and hardware
        - Prime contractors, government missions, and Sierra’s own platforms
        - Power, life support, mechanisms, thermal control, servicing, and propulsion hardware
        - Most mature part of the portfolio based on production, qualification, and catalog breadth
        - Cross-program subsystem reuse reduces dependence on any single flagship platform
        - Public mix by revenue, margin, and customer program is undisclosed
    notes: This matrix separates verified test or production evidence from roadmap positioning; “maturity” reflects public evidence only, not internal TRL claims.
