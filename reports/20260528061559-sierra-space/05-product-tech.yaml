  evidenceGaps:
    - type: missing-source
      severity: material
      topic: cybersecurity
      missingEvidence: Named cyber certifications, secure-software development controls, mission-assurance KPIs, or product-specific security architecture for Dream Chaser, Orbital Reef, and Eclipse.
      whyItMatters: Public diligence can verify physical qualification, but cannot verify whether Sierra's software and cyber controls are adequate for safety-critical and national-security missions.
      diligencePath: Request Sierra's secure-development policy, cyber certification list, mission-assurance framework, and any customer audit or accreditation evidence.
      relatedQuestionRefs:
        - QE024
      relatedTableRefs:
        - TE004
    - type: private-evidence-only
      severity: material
      topic: dream-chaser-economics
      missingEvidence: Turnaround time, refurbishment labor, reusability cost curve, and per-mission economics for Dream Chaser after landing.
      whyItMatters: Without recurring-operations economics, investors cannot tell whether Dream Chaser's technical differentiation will translate into a scalable service business.
      diligencePath: Request program-level operating model, refurbishment plan, target turnaround time, and pro forma mission economics for the first three post-demo flights.
      relatedQuestionRefs:
        - QE025
      relatedTableRefs:
        - TE005
    - type: missing-source
      severity: material
      topic: orbital-reef-demand
      missingEvidence: Signed nongovernment customers, utilization commitments, pricing assumptions, or booked demand for Orbital Reef and LIFE-enabled services.
      whyItMatters: Habitat technology maturity does not by itself prove station-level commercialization or revenue durability once ISS demand shifts.
      diligencePath: Request partner pipeline, anchor-tenant mix, commercial LOIs, and any disclosed customer economics for LIFE or Orbital Reef capacity.
      relatedQuestionRefs:
        - QE026
      relatedTableRefs:
        - TE005
    - type: missing-source
      severity: material
      topic: eclipse-bus-heritage
      missingEvidence: Named external bus customers, on-orbit mission history, or delivered spacecraft performance data for the Eclipse line.
      whyItMatters: Sierra's defense-space production case is stronger than its bus-heritage disclosure, which limits confidence in recurring platform demand beyond structures and components.
      diligencePath: Request customer references, launch manifests, and post-deployment performance data for Horizon, Velocity, and Titan missions.
      relatedQuestionRefs:
        - QE027
      relatedTableRefs:
        - TE001
