  - id: TE002
    title: Workflow / use-case table
    columns:
      - user job
      - current workflow or problem
      - Sierra solution
      - measurable benefit or evidence
      - limitation
    rows:
      - - NASA cargo delivery and return
        - Cargo providers must survive launch, berth or free-fly operations, and safely bring back sensitive payloads
        - Dream Chaser plus Shooting Star integrated cargo system
        - Public sources cite more than six tons of payload capacity and runway landing for low-g return
        - First mission no longer begins as ISS docking service and future task orders depend on demo success
      - - Cargo disposal and expandable logistics volume
        - Single vehicle often cannot optimize upmass, disposal, and future hosted-payload flexibility at once
        - Shooting Star augments Dream Chaser with internal cargo, external mounts, and future free-flyer path
        - Sierra advertises 7K-pound internal capacity plus three external mounting points
        - Public evidence still shows NASA-focused use and no disclosed commercial hosted-payload customers
      - - Long-duration habitat deployment
        - Station developers need large habitable volume without launching a rigid large-diameter module
        - LIFE launches compactly and inflates on orbit for a multi-story habitat
        - Public page cites a 27-foot-diameter, three-story habitat for four astronauts
        - Customer commitments and deployed service timelines remain undisclosed
      - - Defense or servicing satellite mission deployment
        - Buyers need configurable buses and mission hardware without building an entire platform from scratch
        - Eclipse bus family and heritage subsystem catalog
        - Sierra has named three bus classes and disclosed early SDA structure production progress
        - Public record does not yet show on-orbit bus performance or named external bus operators
      - - Prime integrator subsystem sourcing
        - Programs need qualified power, life-support, propulsion, thermal, and servicing hardware faster than greenfield development
        - Sierra sells catalogs of EPS, ECLSS, propulsion, and servicing technologies
        - Public ECLSS page cites 200+ delivered products and power pages describe fully assembled tested systems
        - Public sources do not disaggregate which subsystems dominate revenue or flight heritage by customer
    notes: Benefit cells mix direct metrics and concrete public evidence; limitation cells mark the boundary between shipped capability and still-unproven operating scale.
