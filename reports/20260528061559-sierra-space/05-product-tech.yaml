  - id: trust-quality-and-compliance
    title: Trust, safety, security, compliance, and product risk
    body: |-
      Sierra’s strongest public trust signal is physical mission assurance, not software transparency. The reviewed source set is rich on structural testing, environmental qualification, pressure-vessel testing, thermal-vacuum work, launch-processing readiness, and regulated reentry planning. FAA materials around Huntsville make clear that Dream Chaser operations depend on a formal environmental and licensing stack in which both the airport authority and Sierra need separate approvals. Sierra’s public hardware catalog also explicitly marks export-control boundaries by stating that some documents exclude ITAR/EAR technical data. Those are real controls, not marketing slogans.

      What the public record does not show as clearly is cybersecurity or secure-software assurance. The chapter found no named cyber certifications, secure-development framework, or mission-assurance KPI set for Dream Chaser, Orbital Reef, or Eclipse in the retained sources. That does not prove such controls are absent, but it does mean public diligence should treat them as open asks rather than verified strengths. The resulting risk picture is balanced: Sierra appears strong on hardware qualification, testing, and regulated operations, but weaker on publicly evidenced software, security, and recurring-operations disclosure. For a company selling safety-critical space infrastructure, that difference matters.
