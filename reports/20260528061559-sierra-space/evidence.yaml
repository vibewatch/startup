      incumbent cargo alternatives.
    whyItMatters: >-
      Without real contract economics, the chapter can compare packaging structures but cannot prove Sierra wins on
      total cost or margin durability.
    diligencePath: >-
      Request Sierra customer contracts, NASA task-order economics, and modeled refurbishment / utilization assumptions
      for Dream Chaser and any Reef-linked logistics services.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP003
