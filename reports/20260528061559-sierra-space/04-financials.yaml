  - - Backlog conversion certainty
    - Weakened after NASA removed the specific-flight obligation and tied follow-on orders to a successful free flight
    - Medium
    - Backlog quality matters more than headline contract ceiling when timing is uncertain.
    - Provide updated Dream Chaser backlog waterfall, milestone schedule, and downside case if demo slips again.
  - - Execution burden
    - High implied burden from large workforce expansion, continued vehicle development, and parallel defense programs
    - Medium
    - Simultaneous platform, vehicle, and satellite work can compress cash efficiency.
    - Provide program staffing, fixed-cost base, and capitalized versus expensed development mix.
