  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-mix-and-recognition
    missingEvidence: Audited revenue by business line, booked-versus-recognized revenue bridge, and program-level revenue-recognition policy.
    whyItMatters: Without real revenue mix and recognition detail, contract headlines can overstate the amount of business that is actually turning into income.
    diligencePath: Request audited financial statements, monthly revenue bridge, and segment reporting for Dream Chaser, national security, station work, and subsystems.
    relatedQuestionRefs:
    - QI003
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency-and-capture
    missingEvidence: Business-development spend, proposal pipeline, win rates, capture-cycle duration, and customer-acquisition efficiency by program type.
    whyItMatters: Sierra sells into long-cycle procurement channels, so sales efficiency is about capture cost and conversion, not SaaS CAC formulas.
    diligencePath: Request CRM pipeline by stage, bid-cost history, win-rate trend, and average cycle time for Dream Chaser, defense, and station-related opportunities.
    relatedQuestionRefs:
    - QI007
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-position
    missingEvidence: Current unrestricted and restricted cash, liquidity sources, and minimum operating-cash thresholds.
    whyItMatters: Historical fundraising does not prove that Sierra has enough liquidity left to fund Dream Chaser, defense expansion, and habitat exposure simultaneously.
    diligencePath: Request current balance sheet, treasury summary, debt headroom, and board-approved minimum-cash policy.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: burn-and-runway
    missingEvidence: Trailing 12-month monthly burn, burn multiple, capex schedule, and base/downside runway model.
    whyItMatters: Dream Chaser delays and simultaneous manufacturing expansion make runway the key test of whether Sierra's capital stack is adequate.
    diligencePath: Request monthly cash-flow statement, capital-expenditure plan, and management runway model under slip and downside scenarios.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: debt-and-obligations
    missingEvidence: Debt schedule, lease obligations, project-finance structures, customer advances, and any equipment-financing or revolver package.
    whyItMatters: Peer financings explicitly included debt components, so Sierra's lack of public debt disclosure could hide leverage or covenant risk.
    diligencePath: Request debt memo, covenant package, lease schedule, customer-advance detail, and any off-balance-sheet obligations tied to facilities or programs.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI004
    - TI005
