- id: capital-base-and-contract-proxies
  title: Capital raised, valuation path, and contract proxies
  body: |-
    Public capital disclosure is unusually large for a private space company. Sierra disclosed a $1.4 billion Series A at a $4.5 billion valuation in 2021, a $290 million Series B at a $5.3 billion valuation in 2023, and a $550 million Series C at an $8 billion post-money valuation in 2026. The 2021 and 2026 Form D notices broadly corroborate the outer bounds of the financing story, while the 2026 filing also shows that the latest round carried real transaction costs through estimated sales commissions. The use-of-funds language also evolved over time: first around Dream Chaser and LIFE, then around Dream Chaser operations plus commercial-station development, and most recently around national-security production capacity and differentiated defense programs.

    Contract indicators are the strongest public substitute for missing financial statements. Sierra's launch announcement said the spinout began with more than $3 billion in active contracts and even floated a decade-scale revenue aspiration. The 2023 round pointed to $3.4 billion in active or customer contracts, and the 2026 round highlighted a $450 million national-security award plus an SDA Tranche 2 contract with up to $740 million of value. Those are meaningful indicators of demand and institutional relevance, but they do not by themselves reveal recognized revenue, cash conversion, or margin quality.
