- id: financial-verdict-and-blockers
  title: Financial verdict and diligence blockers
  body: |-
    The financial bull case is straightforward. Sierra has repeatedly shown it can attract capital at escalating valuations, secure large government-linked contract proxies, and reposition itself toward defense programs that may be easier to fund than pure commercial-station dreams. Those facts argue against immediate funding distress. The negative case is what matters for underwriting. Nearly every input that would convert the strategic narrative into a real financial model remains private: no audited revenue, no current segment mix, no current headcount, no public gross-margin bridge, no current cash balance, no monthly burn, no runway model, and no debt schedule.

    That gap is not a cosmetic disclosure issue; it is the chapter's conclusion. Sierra's public financial story is a capital-access story and a program-opportunity story, not yet a revenue-quality story. Any serious diligence process has to request the actual management package: monthly cash flows, backlog waterfall, mission-level economics, program-margin bridges, customer concentration, and a financing plan that explains whether Dream Chaser, LIFE or Orbital Reef exposure, and defense expansion can all coexist inside the current capital base. Until that package is produced, Sierra's public valuation looks plausible but materially under-evidenced.
