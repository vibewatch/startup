- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - impact on underwriting
  - exact diligence path
  rows:
  - - Audited revenue and segment mix
    - Without real top-line data, valuation and capital-raise headlines cannot be tied to operating output.
    - Request audited annual revenue, current run rate, segment mix, and booked-to-recognized revenue bridge.
  - - Gross margin by program
    - Large contract ceilings can mask low or negative margins on development-heavy programs.
    - Request gross-margin bridge by Dream Chaser, defense satellites, subsystems, and station-related work.
  - - Cash, burn, and runway
    - Capital adequacy cannot be judged from fundraising size alone.
    - Request current balance sheet, monthly cash-flow statement, and base/downside runway model.
  - - Current headcount and labor allocation
    - Labor intensity is central to cost structure and program-execution capacity.
    - Request current org chart, headcount by function, and labor-allocation model across major programs.
  - - Debt, leases, and project-finance obligations
    - Peers explicitly disclose debt components; Sierra does not, so downside leverage is unknown.
    - Request debt schedule, covenant package, lease obligations, and any project-finance or customer-advance structures.
  - - Backlog conversion and contract terms
    - Backlog quality depends on options, milestones, cancellation rights, and demonstration gates.
    - Request backlog waterfall, option structure, milestone triggers, and customer concentration by program.
  notes: These are the highest-value missing metrics for a real underwriting process. They are absent from the reviewed public record, not merely hard to find.
  enumerationScope:
    coverage: partial
    basis: Rows prioritize the disclosure gaps that most directly change judgments on revenue quality, capital sufficiency, and downside risk.
