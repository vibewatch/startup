- id: TI004
  title: Capital adequacy table
  columns:
  - metric
  - public value/status
  - confidence
  - why it matters
  - diligence ask
  rows:
  - - Disclosed cumulative financing since 2021
    - About $2.24B implied by $1.4B Series A + $290M Series B + $550M Series C; company frames total as $2B+
    - High
    - This is the clearest public capital buffer supporting long-cycle development.
    - Confirm full financing chronology, security types, and any bridge instruments not visible in press releases.
  - - 2021 Series A filing detail
    - $1.412B Form D offering amount, 31 investors, and $19M finder's fee
    - Medium
    - The filing shows both scale and transaction friction on the launch-era financing.
    - Provide final closing amount, investor ownership, and net proceeds after fees.
  - - 2026 Series C filing detail
    - $550M Form D offering amount, estimated $9.125M sales commissions, and two investors already invested at filing
    - Medium
    - The filing corroborates the size of the latest round and shows that raising capital still carries material issuance cost.
    - Provide fully diluted cap table, closing schedule, and net cash proceeds from Series C.
  - - Use of funds
    - '2021: Dream Chaser + LIFE; 2023: Dream Chaser operations, station buildout, national security, components; 2026: production capacity + national security growth'
    - Medium
    - Shifts in capital deployment show what management is prioritizing and what remains cash-intensive.
    - Provide board-approved cash deployment plan and explicit budget by business line.
  - - Cash on hand
    - 'Null'
    - Low
    - Historical fundraising is not the same as current liquidity.
    - Provide current cash, restricted cash, and minimum operating-cash thresholds.
  - - Monthly burn and runway
    - 'Null'
    - Low
    - Runway cannot be judged from financing headlines alone.
    - Provide trailing 12-month monthly burn, burn-multiple history, and base/downside runway model.
  - - Debt or project finance obligations
    - No public Sierra revolver, debt facility, or project-finance schedule found in reviewed sources
    - Low
    - A hidden debt stack could materially change downside risk.
    - Provide debt schedule, covenants, equipment leases, and any off-balance-sheet project obligations.
  - - Dream Chaser revenue support
    - NASA support is now minimal until the late-2026 free-flight demonstration is complete
    - Medium
    - Capital adequacy depends on whether anchor-customer support persists during continued development.
    - Provide updated NASA support assumptions, demo budget, and cash needs if operational orders are delayed.
  notes: The table separates disclosed fundraising facts from undisclosed liquidity facts. Public financing scale is visible; public cash sufficiency is not.
