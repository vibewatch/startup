- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Dream Chaser schedule / conversion risk
    - Sierra or NASA flight-date update
    - First demo slips beyond 1H27 or completes without a clear NASA certification path
    - Treat the ISS-cargo thesis as broken and re-underwrite Dream Chaser only as an optional defense / testbed asset
  - - NASA contract optionality
    - NASA ordering language or post-demo statements
    - No follow-on ordering intent within 6 months of a successful demo
    - Assume the Dream Chaser revenue model needs a non-NASA replacement or major downscope
  - - Vulcan dependency
    - ULA anomaly-investigation updates and return-to-flight cadence
    - Another material Vulcan anomaly or launch backlog that crowds out Dream Chaser for >2 quarters
    - Escalate partner-risk discount and demand an alternate-launch contingency review
  - - Orbital Reef budget / business-case risk
    - NASA FY27-FY28 appropriations and C3DO provider count
    - NASA funds only one provider without Sierra-aligned pathway or pushes CLD requirements again
    - Cut station-option value materially and separate LIFE technology value from Orbital Reef platform value
  - - Capital intensity / scope stretch
    - New financing, restructuring, or program reprioritization disclosures
    - Fresh equity needed before Dream Chaser demo or before critical Orbital Reef / SDA milestones
    - Assume current scope is not self-funding and pressure-test dilution or strategic narrowing scenarios
  - - Leadership / governance risk
    - Executive departures or board-control changes
    - Second major C-suite disruption before Dream Chaser demo or no clear succession for another transition
    - Raise governance discount and require direct board-level diligence before underwriting scale-up
  - - Government diversification risk
    - SDA / SSC / NRO schedule resets or appropriations cuts
    - Meaningful tranche delay, de-scope, or procurement pause affecting Sierra-linked defense work
    - Remove diversification credit from the thesis and revisit burn versus backlog assumptions
  notes: Thresholds are investor-defined kill criteria tied to externally monitorable events rather than internal aspirations; they are designed to force a view change when the evidence moves, not to predict exact cash outcomes.
