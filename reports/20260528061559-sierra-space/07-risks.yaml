- id: launch-licensing-and-partner-dependencies
  title: Launch, licensing, and partner dependencies
  body: 'The next risk cluster is dependency risk: Sierra does not control the key external gates that now determine whether Dream Chaser and Orbital Reef become revenue programs. Dream Chaser still depends on ULA''s Vulcan, and Vulcan itself has had to work through solid-rocket-booster nozzle anomalies, certification review, and return-to-flight work. Even if Sierra finishes vehicle closeout, launch timing is still exposed to ULA cadence, supplier performance on BE-4 engines and GEM 63XL boosters, and broader range congestion. On the regulatory side, FAA makes clear that Dream Chaser''s landing and reentry path requires more than environmental paperwork: Sierra still has to satisfy licensing, safety, risk, and indemnification requirements under the commercial launch and reentry regime. Orbital Reef adds another dependency stack. NASA has funded risk-reduction milestones and kept C3DO alive, but the commercial-station follow-on remains shaped by procurement ambiguity, one-provider budget
    pressure, and an anchor-customer model that independent analysts think is still underfunded. This is the chapter''s transmission core: Sierra''s top programs rely on NASA, FAA, ULA, Blue Origin, and government budget holders all clearing on time.'
