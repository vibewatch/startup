- id: leadership-mitigations-and-kill-criteria
  title: Leadership, mitigation maturity, and kill criteria
  body: 'Execution and governance risk remain material because Sierra has not yet taken its flagship vehicle to orbit but has already gone through a visible CEO transition. Tom Vice''s January 2025 departure came after Dream Chaser delays, layoffs, and executive turnover had become part of the public narrative. The Ozmen family then resumed direct operating control before handing the company to Dan Jablonsky, whose mandate is explicitly about scaling execution and disciplined growth. That is helpful, but it also signals the board knows Sierra''s problem is not only technology ambition; it is program control across several capital-intensive bets. Public governance still looks concentrated around the founders and a small set of core investors, while crucial diligence items — board rights, SNC dependencies, Dream Chaser demo success criteria, capital runway, and Orbital Reef customer commitments — remain private. For investors, the right posture is not to dismiss Sierra''s upside, but to pair
    every optimistic milestone with a measurable kill criterion: another material Dream Chaser slip, a failed or delayed Vulcan return-to-flight, CLD budget contraction, or fresh evidence that Sierra needs more capital before its anchor programs mature.'
