  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: dream-chaser-flight-readiness
    missingEvidence: Current integrated test completion, NASA post-demo certification criteria, and the specific technical exit criteria for Dream Chaser's first free-flyer mission.
    whyItMatters: These details determine whether a successful launch actually converts into cargo or CLD revenue rather than only a symbolic milestone.
    diligencePath: Request the latest vehicle qualification matrix, mission success criteria, and NASA certification workplan.
    relatedQuestionRefs:
    - QR005
    - QR008
    - QR011
  - type: private-evidence-only
    severity: material
    topic: orbital-reef-demand-economics
    missingEvidence: Signed customer commitments, utilization assumptions, module pricing logic, partner capex responsibilities, and a clear non-NASA demand pipeline for Orbital Reef.
    whyItMatters: The public case still leans on NASA as anchor customer, so the station business case cannot be underwritten confidently without economics and customer proof.
    diligencePath: Request the current Orbital Reef financial model, customer pipeline, and Sierra-versus-Blue-Origin responsibility matrix.
    relatedQuestionRefs:
    - QR012
    - QR015
    - QR016
    - QR018
  - type: private-evidence-only
    severity: material
    topic: capital-runway
    missingEvidence: Current cash burn, project-level capex by Dream Chaser / defense / station workstream, and management's internal threshold for needing another financing event.
    whyItMatters: Without a runway view, investors cannot tell whether the Series C really closes the scope or only buys time until another raise or reprioritization.
    diligencePath: Review board materials on liquidity runway, scenario plans, and any financing or covenant discussions.
    relatedQuestionRefs:
    - QR017
    - QR018
    - QR030
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-and-procurement-gates
    missingEvidence: Full register of open FAA findings, NASA contract amendments, CLD/C3DO solicitation documents, and any unpublicized conditions on launch or reentry approvals.
    whyItMatters: The chapter can rank the visible gates, but not every condition that could still delay Dream Chaser or reduce Sierra's role in Orbital Reef is public.
    diligencePath: Obtain outside counsel and program-management gate trackers, plus the final procurement documents once released.
    relatedTableRefs:
    - TR001
    relatedQuestionRefs:
    - QR011
    - QR014
    - QR030
  - type: private-evidence-only
    severity: minor
    topic: governance-and-related-party-dependencies
    missingEvidence: Current cap table, board-control rights, any SNC shared-services or IP dependencies, and a formal succession framework beyond the recent CEO handoff.
    whyItMatters: Governance concentration can be a manageable feature or a material risk depending on rights, conflicts, and escalation rules that are not visible publicly.
    diligencePath: Request the latest board deck, investor rights summary, and related-party agreement schedule.
    relatedQuestionRefs:
    - QR024
    - QR026
    - QR030
