chapter:
  number: 7
  title: Risks
  summary: Sierra Space's biggest risk is no longer simply whether Dream Chaser reaches orbit; it is whether a late-2026 demo, an optional NASA contract, Vulcan dependency, and Orbital Reef's NASA-dependent economics can still turn into durable revenue before capital intensity and leadership churn force a narrower strategy. Public mitigations exist — more than $2 billion of disclosed capital since 2021, a sharper national-security pivot, active FAA licensing work, and a new CEO hired to scale execution — but the residual exposure remains high until Sierra converts demonstrations and government programs into contracted demand.
sections:
- id: contract-reset-and-top-risk
  title: Contract reset and the top-ranked risk cluster
  body: 'Sierra Space''s highest-severity risk is that Dream Chaser no longer has the commercial profile investors were once underwriting. NASA''s September 2025 modification removed the agency''s obligation to buy a specific number of flights and replaced the near-term ISS cargo thesis with a late-2026 free-flyer demonstration that still must prove out before NASA may order missions. That contract reset matters more than any single test milestone because it converts the vehicle from a partially booked logistics program into an option on future certification and customer demand. The May 2026 ISS traffic plan reinforces the point: active cargo windows are still going to SpaceX and Northrop, not Dream Chaser. Sierra is trying to mitigate the reset by repositioning Dream Chaser as a flexible national-security and commercial platform, and that optionality is real enough to keep the program alive. But optionality is not backlog. Until a free-flyer succeeds and converts into orders, the market
    must assume a longer path to cash generation, more execution pressure on the first mission, and a narrower window before ISS demand shrinks again.'
  claimRefs:
