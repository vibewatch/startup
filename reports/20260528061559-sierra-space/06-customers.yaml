- id: expansion-and-concentration
  title: Expansion Paths and Concentration Risk
  body: 'Sierra’s expansion logic is credible, but concentration risk still dominates. Dream Chaser’s public customer narrative remains heavily tied to NASA and the ISS transition, so the 2025 contract reset matters more than a normal schedule slip: it removed guaranteed mission volume just as ISS retirement timing compresses the remaining window for cargo services. The procurement path explains why conversion is slow: NASA demand must clear demo success and future cargo or station-service orders, defense demand comes in lumpy tranche awards and recompetes, and commercial-station demand still depends on partner execution plus tenant bookings that are not yet public. Orbital Reef gives Sierra a route into a wider research, tourism, and sovereign-agency market, and ESA’s 2025 MoU shows that route is not purely hypothetical. Yet CLD coverage from Payload and CSIS makes the counterpoint unavoidable: NASA itself is still the anchor customer for future commercial stations, and 2026 policy changes indicate the private market is not mature enough to stand alone. Defense work reduces pure NASA-cargo dependence, but that diversification still sits inside government budget cycles and a narrow set of named contracts. The result is a customer story with real strategic value but thin breadth: Sierra has
    meaningful government proof and a plausible expansion path, but public sources do not yet demonstrate a deep commercial customer base that would offset NASA concentration on their own.'
