  rows:
  - - NASA CRS / ISS cargo
    - 'Buyer+payer: NASA; users: ISS crew, station logistics teams, science payload owners'
    - Cargo upmass, disposal, runway-return of sensitive payloads
    - Historically a minimum seven-mission anchor program before reset
    - Historically Sierra’s clearest civil revenue anchor and mission validator
    - Specific future mission count is no longer guaranteed after the 2025 modification
  - - Dream Chaser payload customers
    - 'Buyer: payload integrator or NASA payload manager; users: experiment owners such as Space Tango and Polar teams; payer: mission sponsor'
    - Powered payload delivery and gentle-return science logistics
    - Named payload proofs exist, but only at first-flight candidate scale
    - Shows Dream Chaser can serve third-party science users beyond NASA cargo manifests
    - Payload users do not equal a broad transportation customer base
  - - SDA / DoD tracking satellites
    - 'Buyer+payer: Space Development Agency / DoD; users: warfighter and missile-defense mission partners'
    - Missile-warning and missile-tracking spacecraft production
    - 18 satellites across two planes in Tranche 2
    - Strongest current production-style customer proof outside NASA cargo
    - No public evidence yet of repeat awards beyond the current tranche
  - - Orbital Reef sovereign / institutional users
    - 'Buyer+payer: NASA or other agencies; users: astronauts, researchers, national programs'
    - Crew, cargo, payload, and microgravity research services on a future station
    - NASA-backed development plus ESA exploratory access interest
    - Creates a path beyond ISS logistics toward post-2030 station services
    - Still mostly policy-backed demand rather than booked recurring revenue
  - - Orbital Reef commercial users
    - 'Buyer: enterprise R&D or tourism operator; users: researchers, industrial teams, private astronauts; payer: commercial tenant budgets'
    - Biopharma, advanced manufacturing, science, tourism
    - Target market only; no named paying tenant count disclosed
    - Would diversify Sierra away from government-only demand if converted
    - No public deposits, pricing, or customer-count denominator
  notes: Rows distinguish active government procurement and payload usage from partner-led station demand. Public sources support the buyer/user/payer pattern but not total customer counts.
