- id: named-customer-proof
  title: 'Named Customer Proof: Production, Development, and Pipeline Demand'
  body: Public proof quality differs sharply by customer. NASA remains the strongest named proof because it combines contract history, joint reviews, processing activity at Kennedy, and explicit agency statements about Dream Chaser’s role in ISS logistics. Even so, that proof is development-stage and customer-specific rather than evidence of already-recurring service. SDA is the strongest non-NASA proof because the relationship includes disclosed economics, fixed spacecraft counts, and manufacturing execution underway; that looks much closer to production procurement than to a logo slide. Below those two, the evidence drops quickly into narrower categories. Space Tango and the Polar payload stack show that Dream Chaser can attract third-party science users, but those are payload-level demand signals, not anchor transportation contracts. ESA’s Orbital Reef MoU is also meaningful, because it comes from a potential sovereign buyer, but it is clearly an exploratory access agreement rather than
    a firm booking. The right analytic split is therefore not “customers versus no customers”; it is “customers with active funded execution” versus “named demand signals still waiting to convert.”
