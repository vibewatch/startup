  evidenceGaps:
  - type: missing-source
    severity: material
    topic: customer-count-disclosure
    missingEvidence: Active customer counts by program, geography, and payer type for Dream Chaser, defense, and Orbital Reef.
    whyItMatters: Without a denominator the chapter can only evaluate logos and milestones, not breadth of real adoption.
    diligencePath: Request a customer bridge that separates contracted buyers, payload users, station prospects, and funded government programs.
    relatedQuestionRefs:
    - QU015
    - QU025
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, renewal rates, contract lengths, and customer-satisfaction data by segment.
    whyItMatters: Durability cannot be underwritten from public proofs alone when the clearest anchor contract was reset.
    diligencePath: Obtain cohort, renewal, and contract-duration data for NASA-linked programs, defense work, and any commercial pipeline.
    relatedQuestionRefs:
    - QU016
    - QU017
    - QU018
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table coverage
    missingEvidence: Additional named commercial Dream Chaser users, Orbital Reef tenants, and defense agencies beyond the currently public roster.
    whyItMatters: The named-customer table is necessarily partial and may understate or overstate concentration depending on undisclosed customers.
    diligencePath: Request a full customer and prospect roster with status labels (contracted, payload user, pilot, MoU, prospect) and permissions for reference calls.
    relatedQuestionRefs:
    - QU020
