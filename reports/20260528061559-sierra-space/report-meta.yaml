companyProfile:
  summary: >-
    Sierra Space is best understood as a 2021 Sierra Nevada Corporation spinout,
    not a conventional founder-led startup. The business launched around Dream
    Chaser transportation and LIFE habitat infrastructure, but by 2026 it was
    presenting itself more broadly as a Colorado-headquartered defense-tech space
    company serving national-security, civil, and commercial customers. The most
    supportable founding-control narrative is sponsor-led: SNC owners Fatih and
    Eren Ozmen remained strategically linked to Sierra Space through board control
    and interim executive roles, while Tom Vice served as the founding CEO who
    launched the company before Dan Jablonsky took over in March 2026. Across the
    disclosed post-spinout rounds Sierra Space raised about $2.24 billion and
    reached an $8 billion post-money valuation, yet the central underwriting
    tension remains unchanged: capital support and platform breadth are visible,
    while current revenue, margin, and demand conversion remain largely private
    and Dream Chaser's first mission has slipped to a late-2026 free-flyer.
  foundedDate: '2021-04-21'
  founders:
    - name: Fatih Ozmen
      role: Founding sponsor / board chair / interim CEO during transition
      background: >-
        Engineer and long-time SNC owner-operator who remained strategically linked
        to Sierra Space after the spinout and later stepped in as interim CEO.
      claimRefs: [CO010, CO012]
    - name: Eren Ozmen
      role: Founding sponsor / interim president
      background: >-
        SNC chairwoman and owner who remained part of Sierra Space's control center
        after the spinout and served as interim president during the leadership transition.
      claimRefs: [CO010, CO013]
    - name: Tom Vice
      role: Founding CEO (2021 launch)
      background: >-
        Former Aerion CEO and former Northrop Grumman Aerospace Systems president
        recruited to launch Sierra Space as a standalone company in 2021.
      claimRefs: [CO009, CO034]
  foundingLocation: Louisville, Colorado
  headquarters: Louisville, Colorado
  productSummary: >-
    Sierra Space sells a portfolio centered on Dream Chaser reusable cargo transport,
    the attached Shooting Star cargo module, LIFE expandable habitat infrastructure,
    Orbital Reef-related station systems, and a broader defense-space hardware stack
    spanning satellites, spacecraft subsystems, propulsion, and related national-security
    programs.
  customerFocus: >-
    Target customers span U.S. national-security and defense programs, civil-space
    agencies such as NASA, and commercial in-orbit infrastructure and mission customers
    that may use cargo transport, habitat systems, spacecraft buses, or other space hardware.
  businessModel: >-
    Sierra Space appears to monetize through large program contracts, milestone-based
    government and partner awards, mission transport services, and hardware or subsystem
    sales rather than through software-style recurring revenue. The public evidence supports
    a capital-intensive aerospace contractor model with multiple long-cycle revenue surfaces,
    but not a clean current revenue bridge.
  stage: Series C private unicorn
  fundingStatus: >-
    Disclosed post-spinout financing totals about $2.24 billion: a $1.4 billion Series A
    in 2021, a $290 million Series B in 2023, and a $550 million Series C in March 2026,
    when Sierra Space reached an $8 billion post-money valuation.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO004, CO007, CO008, CO009, CO010, CO012, CO013, CO014, CO016, CO019, CO022, CO036, CO038, CO046, CO047]
summary:
  headline: >-
    Sierra Space is a well-capitalized but still under-disclosed space-and-defense
    platform whose $8 billion March 2026 valuation looks stretched until Dream Chaser
    converts its late-2026 demo into contracted demand and management opens the revenue,
    margin, and term-sheet denominator.
