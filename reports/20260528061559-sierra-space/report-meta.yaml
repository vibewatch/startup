  topStrengths:
    - >-
      Sierra Space has raised about $2.24 billion across disclosed post-spinout rounds,
      including a fresh $550 million Series C in March 2026, showing continued sponsor
      appetite and giving the company unusual capital access for a private space platform.
    - >-
      Dream Chaser and LIFE remain genuinely differentiated strategic assets: one is a
      reusable runway-landing cargo vehicle and the other is a tested expandable-habitat
      platform with a NASA-backed commercial-station pathfinder role.
    - >-
      The defense pivot is evidence-backed rather than purely rhetorical; Sierra publicly
      cites $1.5 billion of national-security and defense contracts since 2023, including
      a large SDA-linked satellite program.
    - >-
      Sierra retains strategic relevance across NASA, national-security, and commercial-space
      ecosystems, which helps explain why investors still fund the broader platform story.
  topRisks:
    - >-
      Dream Chaser no longer has a minimum NASA flight commitment; the next step is only a
      late-2026 free-flyer demonstration, so the flagship program's revenue path is now more
      optional than contracted.
    - >-
      Sierra does not control key external gates: Dream Chaser remains exposed to Vulcan launch
      readiness, FAA landing and reentry licensing, and broader range or supplier bottlenecks.
    - >-
      Orbital Reef and the broader habitat thesis still depend heavily on NASA budget continuity,
      procurement clarity, and a market structure that outside analysts argue does not yet close
      without government support.
    - >-
      Public operating visibility remains weak: current revenue, margins, customer concentration,
      and full Series C preference terms are not disclosed, making the $8 billion mark difficult
      to underwrite with precision.
    - >-
      Governance and execution risk remain material because effective control stayed concentrated
      around the Ozmens through a visible CEO transition after Dream Chaser delays, layoffs, and
      broader program strain.
  unresolvedGaps:
    - Segment revenue bridge across defense, Dream Chaser, and station-related programs.
    - Contract-margin waterfall, burn profile, and cash-conversion quality for the defense backlog.
    - Full Series C terms, including liquidation preferences, ratchets, consent rights, and any structured-capital features.
    - Dream Chaser demo readiness, post-demo NASA demand path, and backup commercialization routes.
    - Proof of customer diversification and whether non-NASA demand exists for habitat- or Orbital Reef-linked services.
