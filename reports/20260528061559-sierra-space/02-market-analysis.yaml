callouts:
  - calloutType: insight
    title: Sierra Space sits inside three procurement systems, not one TAM
    body: >-
      Sierra's real market is governed by three different institutional buying motions: NASA cargo,
      NASA-backed commercial-station services, and defense-space acquisition. That is strategically
      helpful because the company is not wholly dependent on one budget line, but it also means each
      market has a different readiness gate, contract form, and adoption clock.
    claimRefs:
      - CM006
      - CM027
      - CM028
      - CM030
      - CM033
  - calloutType: risk
    title: Dream Chaser timing is the highest-leverage adoption bottleneck
    body: >-
      Dream Chaser is still the most visible path to near-term revenue and market credibility, yet
      NASA no longer owes Sierra a minimum number of ISS flights and ULA cadence remains a live
      dependency. A successful late-2026 demo could reopen both civil and defense opportunities; a
      further slip would weaken the strongest proof point behind Sierra's broader platform story.
    claimRefs:
      - CM015
      - CM016
      - CM037
      - CM038
      - CM044
  - calloutType: strength
    title: Defense adjacency lowers reliance on post-ISS station timing alone
    body: >-
      Sierra's portfolio breadth matters because buses, subsystems, and mobility-oriented hardware let
      it target resilient national-security architectures even while Orbital Reef economics and Dream
      Chaser cargo timing remain uncertain. That does not eliminate execution risk, but it broadens the
      set of budgets Sierra can pursue before commercial-station demand is fully proven.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM035
      - CM036
