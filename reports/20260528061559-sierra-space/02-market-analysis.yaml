  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: evidence-gap-offtake
      missingEvidence: Signed nongovernment tenant commitments, LOIs, or multi-year service contracts for Orbital Reef or Sierra habitat infrastructure.
      whyItMatters: Without non-NASA demand proof, commercial-station sizing remains anchored to government support and the private demand case stays speculative.
      diligencePath: Request Sierra or Blue Origin pipeline detail by tenant type, contract stage, annual value, and expected first-use date.
      relatedQuestionRefs:
        - QM027
    - type: private-evidence-only
      severity: material
      topic: evidence-gap-defense-backlog
      missingEvidence: Sierra's direct contracted backlog, revenue mix, or awarded program value for defense-market buses, subsystems, and mobility offerings.
      whyItMatters: The defense-tech repositioning may be strategically important, but valuation needs proof of monetized demand rather than only adjacent-budget growth.
      diligencePath: Ask management for booked awards, active bids, program concentration, and direct versus subcontractor revenue by defense customer.
      relatedQuestionRefs:
        - QM028
    - type: private-evidence-only
      severity: material
      topic: evidence-gap-economics
      missingEvidence: Public capex, module pricing, utilization, and recurring-operating-cost assumptions for Orbital Reef or LIFE station economics.
      whyItMatters: Market size is not the same as profitable revenue; without unit economics, it is impossible to test whether station demand closes Sierra's return thresholds.
      diligencePath: Request the station financial model, module pricing assumptions, expected tenant mix, and sensitivity to NASA versus nongovernment utilization.
      relatedQuestionRefs:
        - QM030
        - QM027
    - type: conflicting-data
      severity: minor
      topic: sizing-approach
      missingEvidence: A consistent, apples-to-apples 2026 market model covering only the cargo, habitat, and orbital-systems categories Sierra can actually address.
      whyItMatters: Public analyst previews use different scopes and methodologies, so a single headline TAM would overstate precision.
      diligencePath: Build a bottoms-up market model from NASA budgets, target mission counts, station modules, and reachable defense-space programs rather than vendor previews alone.
      relatedQuestionRefs:
        - QM010
        - QM011
      relatedTableRefs:
        - TM002
