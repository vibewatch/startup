  - id: diligence-gaps
    title: Diligence gaps that still matter for sizing
    body: |
      The unresolved issue is not whether Sierra Space participates in real markets; it clearly does.
      The unresolved issue is which of those markets converts into contracted, recurring demand on a
      timeframe relevant to valuation. None of the reviewed sources disclosed firm nongovernment off-take
      commitments for Orbital Reef or Sierra's LIFE-related infrastructure, so the non-NASA station case
      is still more thesis than backlog. Likewise, no reviewed source disclosed Sierra's direct booked
      DoD or USSF revenue by bus, subsystem, or mobility program, which makes it impossible to tell how
      much of the defense-tech repositioning is already monetized versus merely strategic intent.

      The same opacity applies to station economics. Public material shows NASA funding, partner progress,
      and high-level market estimates, but not the capex, module pricing, utilization assumptions, or
      unit economics needed to model profitability for an orbital-infrastructure platform. Until those
      gaps close, the correct market conclusion is that Sierra has credible exposure to several growing
      and strategically important budget pools, but not yet enough public disclosure to convert those
      pools into a clean, bottoms-up revenue forecast.
