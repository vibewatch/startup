  - id: sizing-lenses
    title: Multiple sizing lenses and why one TAM is misleading
    body: |
      Sierra Space's opportunity has to be sized with several non-additive lenses. The most concrete
      near-term lens is official NASA program spend. NASA's 2021 Commercial LEO Destinations awards
      totaled $415.6 million, including $130 million for the Blue Origin-led Orbital Reef team that
      includes Sierra Space, and NASA later increased Orbital Reef's award to $172 million. NASA also
      says its future LEO needs require continuous accommodations and training for at least two crew
      members and roughly 200 investigations each year. Those figures do not equal Sierra's revenue,
      but they do define the minimum buyer-side demand that must exist if Orbital Reef and related
      habitat infrastructure are to matter.

      The second lens is Dream Chaser's cargo and logistics path. NASA's September 2025 contract
      modification removed the agency's obligation to buy a specific number of Dream Chaser resupply
      flights and moved the first mission to a late-2026 free-flight demonstration. That sharply cuts
      the certainty of the old ISS-cargo lens, but NASA simultaneously says future commercial stations
      will still need a competitive industrial base for cargo services in low Earth orbit. The third
      lens is the adjacent orbital-systems market: third-party previews place the 2026 commercial LEO
      satellite market at $18.7 billion and the broader 2026 LEO satellite market at $32.59 billion,
      while a commercial-space-station preview pegs that niche at $6.96 billion in 2026. Those third-
      party numbers are methodologically inconsistent and should not be added together. They are best
      read as directional proof that Sierra's addressable market extends well beyond ISS cargo into a
      larger orbital-infrastructure and national-security budget pool. A fourth lens, capital-market
      intensity, reinforces that point: Space Capital says Q1 2026 alone saw $36 billion invested
      across 148 companies, showing both how much capital is chasing orbital infrastructure and how
      expensive it is to compete in it.
