- id: flagship-programs-milestones-and-adverse-context
  title: Dream Chaser, LIFE, milestones, and adverse context
  body: 'Dream Chaser and LIFE still carry most of Sierra Space''s brand equity, but they now do so against a more mixed execution record. Dream Chaser remains differentiated on paper: a partially reusable runway-landing cargo vehicle with low-g return capability and a flexible mission profile. LIFE still gives Sierra Space a credible expandable-habitat story backed by repeated subscale and full-scale testing milestones and a NASA-backed pathfinder role for commercial stations. The problem is timing. Sierra Space and NASA were still speaking in late 2023 and mid-2024 as if an ISS cargo mission were close, and even in January 2025 the company was highlighting powered-payload integration for the first official flight. By September 2025, independent coverage said the inaugural mission had slipped again to no earlier than late 2026, shifted to a free-flyer demonstration, and lost NASA''s minimum-flight commitment under the modified CRS-2 arrangement. That change is the chapter''s central adverse
    event: it weakens near-term revenue certainty for Sierra Space''s signature vehicle just as the company is reorienting toward defense-tech growth and still asking investors to underwrite a broader platform vision built around Dream Chaser, LIFE, and Orbital Reef.'
