company:
  name: Sierra Space
chapter:
  number: 1
  title: Company Overview
  summary: Sierra Space was spun out of SNC in 2021 around Dream Chaser and LIFE, raised $1.4 billion Series A, $290 million Series B, and $550 million Series C, and reached an $8 billion post-money valuation in March 2026. By mid-2026 the company was presenting as a Colorado-based defense-tech prime under CEO Dan Jablonsky, but Dream Chaser's first mission had slipped to a late-2026 free-flyer and NASA no longer owed a minimum number of CRS flights, making execution and governance concentration the key overview risks.
sections:
- id: identity-and-platform
  title: Identity, headquarters, and platform scope
  body: Sierra Space is a 2021 spinout from Sierra Nevada Corporation that began life as a dedicated commercial-space vehicle around Dream Chaser transportation and LIFE habitat infrastructure. The original launch framing emphasized an end-to-end space-as-a-service model, more than $3 billion of inherited active contracts, and the ability to pursue partnerships more aggressively than SNC could from inside a broader aerospace and defense conglomerate. Public materials still anchor the company in Louisville, Colorado and list other facilities in Wisconsin, Virginia, and North Carolina, but the self-description has shifted. Instead of calling itself mainly a pureplay commercial-space company, Sierra Space now describes itself as a Colorado-headquartered defense-tech space company serving national-security, civil, and commercial customers. That reframing matters because the company overview is no longer just about one reusable cargo spaceplane and one future station module. Sierra Space now
    sells a portfolio that includes satellites, spacecraft subsystems, propulsion, hypersonics, and orbital infrastructure, while continuing to market Dream Chaser and LIFE as the brand-defining assets that differentiate the platform story.
