  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-financials
    missingEvidence: Current 2025 or 2026 revenue, run-rate, and margin disclosures from management, lenders, or audited statements.
    whyItMatters: Without current operating metrics, capital raised and contract wins can overstate commercial maturity and understate burn or dependency risk.
    diligencePath: Request investor deck, lender materials, or management reporting package covering 2024-2026 revenue, backlog conversion, and margins.
    relatedQuestionRefs:
    - QO014
  - type: private-evidence-only
    severity: material
    topic: current-headcount
    missingEvidence: A current employee count and site-by-site labor distribution after the 2022 hiring push and 2025 leadership change.
    whyItMatters: Execution risk on Dream Chaser, satellites, and defense programs depends on whether the workforce actually scaled or later contracted.
    diligencePath: Request HR dashboard, current org chart, and location-level headcount reconciliation for Colorado, Florida, Wisconsin, North Carolina, and any classified sites.
    relatedQuestionRefs:
    - QO015
  - type: private-evidence-only
    severity: material
    topic: orbital-reef-economics
    missingEvidence: Committed customer demand, capital plan, and Sierra Space funding obligations for Orbital Reef and the LIFE station roadmap.
    whyItMatters: Orbital Reef remains central to the brand story, but its economics are difficult to underwrite if management has shifted capital toward defense programs.
    diligencePath: Request Orbital Reef program budget, partner funding split, customer LOIs, and management view of station milestones after the 2026 Series C raise.
    relatedQuestionRefs:
    - QO026
  - type: private-evidence-only
    severity: material
    topic: cap-table-control
    missingEvidence: Detailed post-Series-C cap table, voting rights, board consent rights, and any investor protections or liquidation preferences.
    whyItMatters: Public evidence shows concentrated founder influence and multiple outside investors, but not the real control mechanics that govern strategy or liquidity.
    diligencePath: Request latest cap table, shareholder agreement, board rights agreement, and Series C term sheet or board minutes summarizing governance changes.
    relatedQuestionRefs:
    - QO027
    relatedTableRefs:
    - TO003
  - type: stale
    severity: material
    topic: dream-chaser-post-demo-orders
    missingEvidence: A firm launch date, completed certification milestones, and any binding NASA post-demo CRS task orders after the late-2026 free-flyer mission.
    whyItMatters: Dream Chaser remains strategically central, but the cash value of the program depends on timing, certification, and whether NASA actually orders operational flights.
    diligencePath: Request the latest integrated master schedule, NASA certification tracker, ULA launch manifest slot, and any executed CRS task orders or option notices.
    relatedQuestionRefs:
    - QO028
    relatedTableRefs:
    - TO004
  - type: missing-source
    severity: minor
    topic: leadership-table-coverage
    missingEvidence: A complete current executive roster and board-committee disclosure that would make the leadership table exhaustive rather than partial.
    whyItMatters: Public governance risk is easier to assess when the full operating team, committee structure, and director independence are visible instead of inferred from a subset.
    diligencePath: Request the current management roster, board committee charter summary, and any board observer rights tied to major investors.
    relatedTableRefs:
    - TO002
