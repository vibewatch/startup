          note: Dream Chaser 开始重建可变现可信度
        - label: 防务规模放大，空间站需求风险下降
          value: 13000
          note: 公开市场风格的最佳上行情景
    approximationNotes: 这些不是公允价值；只是说明哪些变量最能推动当前估值上行或下行。
    claimRefs:
      - CV021
      - CV022
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
      - CV036
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 列出 Sierra 在悲观、基准、乐观结果下的估值和入场总回报区间，凸显当前价格下安全边际很薄。
    data:
      items:
        - label: 退出估值（USD M）
          low: 4500
          mid: 8250
          high: 13000
          note: 悲观 / 基准 / 乐观估值区间
        - label: 8.0B 入场价下的总 MOIC（x）
          low: 0.56
          mid: 1.03
          high: 1.63
          note: 未计稀释和优先权
        - label: 6.4B 入场价下的总 MOIC（x）
          low: 0.7
          mid: 1.29
          high: 2.03
          note: 体现入场纪律的价值
        - label: 退出所需时间（年）
          low: 4
          mid: 5
          high: 7
          note: 防务规模兑现则路径更短；商业化仍不稳定则更长
    approximationNotes: 回报区间仅作方向参考，因为 Sierra 没有披露当前运营基数、融资条款或预期稀释路径。
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV031
      - CV032
      - CV033
      - CV036
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 按 IC 口径从资本支持、防务可选性、产品验证、执行、经济性可见度、退出准备度和估值纪律等维度给 Sierra Space 打分。
    data:
      items:
        - label: 资本支持
          value: 4.5
          note: Series A、B、C 轮带来私营航天公司少见的融资深度
        - label: 防务可选性
          value: 4
          note: 公开合同证据和独立防务业务是有分量的利好
        - label: 产品差异化
          value: 3
          note: Dream Chaser 仍然重要，但价值现在取决于 2026 年末演示
        - label: 执行信心
          value: 2
          note: 项目节奏和商业化验证仍然脆弱
        - label: 经济性可见度
          value: 1
          note: 收入、利润率、条款和集中度仍未公开
        - label: 退出准备度
          value: 2
          note: 战略交易或老股结果比近期 IPO 更可信
        - label: 估值纪律
          value: 1.5
          note: 没有更好披露前，当前价格几乎不给犯错空间
        - label: 证据质量
          value: 2.5
          note: 融资和合同事实很扎实；投资判断所需数据还不够
    approximationNotes: 这些分数只是判断辅助，不是机械模型；低分主要反映当前价格下的披露缺口和商业化风险。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
      - CV041
      - CV042
      - CV050
