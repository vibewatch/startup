      - number: '1.3'
        title: 融资历史、投资者图谱与运营规模信号
        blocks:
          - type: paragraph
            body: >-
              Sierra Space 已经搭起私营航天领域披露规模最大的资本栈之一。公司 2021 年以 $4.5 billion 估值完成 $1.4 billion Series A 轮，2023 年以 $5.3
              billion 估值完成 $290 million Series B 轮，随后在 2026 年 3 月以 $8 billion 估值完成 $550 million Series C
              轮。几轮融资中反复出现的投资者——General Atlantic、Coatue、Moore Strategic Ventures——说明发起方支持有持续性；Series B 的日本财团和 Series C 的
              LuminArx 则显示 Sierra Space 仍能拓宽资本底座。公开可见的规模，最强证据来自已融资本、合同储备信号和防务合同授予，而不是典型私人公司 KPI。Sierra Space
              提到过数十亿美元客户合同、超过 500 次任务传承和大型国家安全合同，但所审阅资料没有给出当前 2026
              年收入，也没有干净的当前员工数。因此，融资故事支撑了公司的相关性和续航力，却不能单独回答公司是否已经把资本转化为可预测的经营杠杆。
