  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 合同重置与首要风险集群
        blocks:
          - type: paragraph
            body: >-
              Sierra Space 最严重的风险，是 Dream Chaser 已不再具备投资人当初承销时看到的商业轮廓。NASA 2025 年 9 月的修改取消了购买特定飞行次数的义务，并把近端 ISS 货运逻辑替换为
              2026 年底的自由飞行器演示；演示仍必须先跑通，NASA 才可能下达任务订单。合同重置比任何单项测试里程碑都重要，因为它把这架飞行器从一个部分预订的物流项目，变成了押注未来认证和客户需求的期权。2026 年 5
              月 ISS 交通计划进一步强化了这一点：活跃货运窗口仍给了 SpaceX 和 Northrop，而不是 Dream Chaser。Sierra 正试图把 Dream Chaser
              重新定位成灵活的国家安全和商业平台，以缓释这次重置；这种可选性足够真实，能让项目继续存在。但可选性不是在手订单。在自由飞行器成功并转化为订单之前，市场必须假设现金生成路径更长、首个任务执行压力更大，而且 ISS
              需求再次收缩前的窗口更窄。
