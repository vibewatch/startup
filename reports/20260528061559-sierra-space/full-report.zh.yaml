        - 获取 NASA 最新服务购买假设、最低服务量和竞争结构
      - - FY2026 防务航天预算转向 Golden Dome 和韧性架构
        - 驱动因素
        - 立即
        - 扩大对卫星平台、机动能力、跟踪和任务硬件的相邻需求
        - 识别 FY26-FY28 哪些项目 Sierra 能直接投标或作为供应商参与
      - - Sierra 多元化产品组合
        - 驱动因素
        - 立即
        - 让公司能同时追逐防务、货运和基础设施预算
        - 按 Dream Chaser、舱段、卫星平台和子系统拆分当前收入
      - - ULA 发射节奏和任务清单压力
        - 约束
        - 2026-2027
        - 发射可用性会拖延 Dream Chaser 和下游空间站物流
        - 跟踪 2026 年 Vulcan 实际发射节奏与目标的差距，以及 Sierra 已预订发射窗口的确定性
      - - 运载火箭认证历史
        - 约束
        - 立即
        - 即使 Sierra 硬件就绪，异常和重新认证也会推迟货运和防务排期
        - 梳理 Sierra 哪些项目依赖 Vulcan，哪些依赖替代运载火箭
      - - FAA 许可和再入监管
        - 约束
        - 持续
        - 给运输系统和支撑场站增加合规、文档和进度负担
        - 确认 Sierra 剩余许可、再入和场站就绪里程碑
      - - 商业空间站商业模型依赖政府支持
