      - - SpaceX Dragon
        - 货运既有玩家
        - ISS 货运运营方已在服务，整合 Falcon 9，并具备返回地球能力
        - NASA 货运和更广义 LEO 运输需求
        - 运营履历加垂直整合的发射与运输栈
        - 没有 Sierra 式跑道回收；受评证据集中在胶囊物流，而不是空间站开发广度
      - - Northrop Grumman Cygnus
        - 货运既有玩家
        - ISS 货运运营方已在服务；NASA 提到 2025 年更大运货能力版本
        - NASA 货运和 LEO 物流
        - 自主货物交付，拥有 NASA 认可运营和更广泛 Northrop 任务信誉
        - 货运以处置为导向，不是跑道返回，产品也比 Sierra 平台叙事更窄
      - - Boeing Starliner
        - 相邻载人运输既有玩家
        - NASA 商业载人航天器，可复用最多 10 次任务
        - 载人运输和低地球轨道紧急准入
        - NASA 机构信任和已认证载人项目
        - 不是直接货运返回同类，也不能解决后 ISS 舱段问题
      - - Axiom Station
        - 直接空间站对手
        - $350M 融资于 2026 年公布；已完成 4 次私人宇航员任务；首个舱段在制造中
        - 政府和私人宇航员、微重力研究、制造
        - 挂靠 ISS 的路径降低过渡风险，并在自由飞行前积累运营学习
        - 空间站经济性和最终自由飞行器时间仍重度依赖 NASA 与 ISS 连续性
      - - Vast Haven-1 / Haven-2
        - 直接空间站对手
        - 2027 年 Haven-1 目标；45 m³ 可居住体积；2027 年私人宇航员任务已获授标
        - 私人宇航员、政府任务、最终更大空间站路线图
        - 硬件里程碑推进快，且明确先走单舱第一步
        - 履历远少于 Axiom，尚无长期空间站运营验证
      - - Starlab
        - 潜在进入者 / 空间站对手
        - $217M+ NASA SAA 基础支持，加 2026 年战略投资；大型财团包括 Airbus 和 Voyager
        - 科研、制造和机构客户
        - 研究优先定位、广泛伙伴组合、单次发射架构
        - 仍未运营，且与 Orbital Reef 争夺同一个依赖 NASA 的需求池
      - - ISS + NASA 自有过渡路径
        - 现状 / 内部自建替代
        - 政府空间站按计划运行至 2030 年脱轨；NASA 正评估修订后的核心舱路径
        - 现有 ISS 研究、宇航员运营和采购连续性
        - 近期需求零过渡摩擦，既有安装基础最强
        - 不是可扩展的私人市场答案，且受老化空间站和政策约束影响
      - - Lockheed / L3Harris / Northrop 卫星平台既有玩家
        - 防务 / 轨道系统既有玩家
        - Lockheed LM400/2100 系列、L3Harris 广泛防务航天组合、Northrop 模块化航天器平台
        - 导弹预警、ISR、通信和其他高价值航天任务
        - 飞行履历、采购入口和比 Sierra 新 Eclipse 线更广的产品组合
        - 在可复用运输或商业空间站生态上的差异化较弱
    notes: 本表混合直接同类、既有玩家、空间站新进入者、现状替代方案和防务卫星平台既有玩家，因为 Sierra Space 同时竞争这些采购路径。规模栏使用最强公开信号，而不是单一标准化收入指标。
