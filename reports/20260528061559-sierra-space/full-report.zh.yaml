      - number: '8.2'
        title: 投资逻辑、反向逻辑与可比公司组
        blocks:
          - type: paragraph
            body: >
              Sierra Space 的正向逻辑有证据支撑。公司自 2021 年以来已融资超过 $2 billion，围绕国家安全业务重新定位，并公开声称国防合同基础已经大到足以影响估值。Dream Chaser
              在纸面上仍是差异化资产：它是一架可重复使用的货运航天飞机，具备温和返回和多任务特征，少数同业才能复制。更广义地看，公开市场并不存在一个简单的“航天倍数”。可比公司覆盖面很宽，从成熟卫星通信公司约低个位数销售倍数，到高动能航天公司数十倍销售额。这样的分散度说明，当投资人相信增长路径和披露组合时，市场愿意为被选中的航天平台支付溢价。


              反向逻辑同样重要。Sierra 的旗舰项目失去了 NASA 的最低飞行承诺，并转向 2026 年底自由飞行演示；同时，CSIS 在 2026 年指出，如果没有更强的 NASA
              支持，商业空间站商业案例目前并不闭合。这两个事实重要，因为 Sierra 仍需要 Dream Chaser 和空间站相关可选性，才能支撑其平台故事的宽度。可比分析能帮助框定争论，但不能替代答案。Rocket
              Lab、Redwire、Intuitive Machines、Viasat 和 Planet 披露的运营数据都比 Sierra 多，它们的业务组合也与 Sierra
              的国防卫星、货运运输和未来栖居基础设施组合显著不同。
