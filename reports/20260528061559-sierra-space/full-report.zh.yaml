            body: >-
              对一家私营航天公司而言，公开融资披露规模异常大。Sierra 披露，2021 年以 $4.5 billion 估值完成 $1.4 billion Series A 轮，2023 年以 $5.3 billion
              估值完成 $290 million Series B 轮，2026 年以 $8 billion 投后估值完成 $550 million Series C 轮。2021 年和 2026 年 Form D
              通知大体印证了融资故事的外边界，2026 年文件也显示，最新一轮通过估计销售佣金产生了真实交易成本。资金用途表述也在随时间演变：最早围绕 Dream Chaser 和 LIFE，后来围绕 Dream Chaser
              运营加商业空间站开发，最近则围绕国家安全生产能力和差异化防务项目。


              在缺少财务报表时，合同指标是最强的公开替代物。Sierra 启动公告称，拆分时已有超过 $3 billion 在执行合同，甚至提出了十年尺度的收入愿景。2023 年融资指向 $3.4 billion
              在执行或客户合同，2026 年融资则强调 $450 million 国家安全合同，以及价值最高可达 $740 million 的 SDA Tranche 2
              合同。这些都是需求和机构相关性的有意义信号，但它们本身不揭示已确认收入、现金转化或利润率质量。
