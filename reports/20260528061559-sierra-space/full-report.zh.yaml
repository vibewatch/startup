  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 悲观
        - Dream Chaser 再次延期，NASA 需求保持可选，国防积压订单转化缓慢或毛利率偏薄
        - 指示性价值 $4.5B-$6.0B；按 $8B 入场、稀释前，毛 MOIC 约 0.6x-0.75x
        - 项目延误、积压订单质量偏弱或结构化条款推动降价融资
        - ~30%：合理，因为旗舰项目仍需要 2026 年末验证点
      - - 基准
        - 国防合同转化为可见收入，Dream Chaser 通过自由飞行演示，空间站经济性仍主要由 NASA 牵引
        - 指示性价值 $7.5B-$9.0B；按 $8B 入场、稀释前，毛 MOIC 约 0.9x-1.1x
        - 任何新的 Dream Chaser 重置，或积压订单质量弱于预期的证据，都会削弱该情景
        - ~45%：如果执行改善但披露仍有限，与当前证据最一致
      - - 乐观
        - 国防生产放量，Dream Chaser 演示后具备商业变现能力，空间站需求去风险程度超过当前证据所能支撑
        - 指示性价值 $10.5B-$13.0B；按 $8B 入场、稀释前，毛 MOIC 约 1.3x-1.6x
        - 需要多件事同时走对，包括更好披露和更干净的商业化证明
        - ~25%：有可能，但要求今天的投资者提前为多个未验证里程碑买单
    notes: 这些区间是情景工具，不是点估计；锚点是已披露融资、公开同业估值离散度，以及 Dream Chaser 2026 年末里程碑，而不是 Sierra 已披露收入基数。
