      - number: '8.4'
        title: 建议、投资逻辑破裂触发点与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              公开记录支持“继续研究”建议，置信度中等、风险高、估值偏高。这个结论有意对价格敏感，而不是对叙事敏感。Sierra 有真实优势：投资人支持、可见的国防需求、仍有差异化的运输资产，以及对 NASA
              和美国国家安全体系仍具战略重要性的品类。这些优势足以让 Sierra 留在桌面上，但不足以仅凭公开证据就证明应按 2026 年 3 月估值付款。


              核心问题是证据质量。公开材料能告诉投资人 Sierra 融了多少钱、管理层希望公司被如何看待；但还不能告诉投资人，国防在手订单 能否转化为有吸引力的毛利，Dream Chaser 2026
              年底演示能否带来经常性需求，客户集中度是否可接受，或 Series C
              是否包含下行保护，使真实入场经济价格明显差于标题估值。这些变量恰恰决定了今天的价格只是偏满，还是已经脆弱。实际含义很简单：在收入桥、利润率包、股权结构条款和演示后商业化路径可见之前，不要在估值上拉伸。如果这些尽调问题过关，Sierra
              仍可能赚回当前估值；如果过不了，投资逻辑应快速破裂，而不是被合理化。
