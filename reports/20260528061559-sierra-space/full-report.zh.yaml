      - number: '2.2'
        title: 多重测算口径，以及为何单一 TAM 会误导
        blocks:
          - type: paragraph
            body: >
              Sierra Space 的机会必须用几个不可相加的口径来测算。近期最具体的口径是 NASA 官方项目支出。NASA 2021 年 Commercial LEO Destinations 授予总额为 $415.6
              million，其中包括给 Blue Origin 牵头、Sierra Space 参与的 Orbital Reef 团队 $130 million；NASA 后来又把 Orbital Reef 的拨款提高到
              $172 million。NASA 还表示，未来 LEO 需求要求持续容纳并训练至少两名机组成员，每年还要支持约 200 项研究。这些数字不等于 Sierra 的收入，但如果 Orbital Reef
              和相关居住舱基础设施要有意义，买方需求至少必须达到这个下限。


              第二个口径是 Dream Chaser 的货运和物流路径。NASA 2025 年 9 月的合同修改取消了该机构购买特定数量 Dream Chaser 补给飞行的义务，并把首次任务改为 2026
              年末自由飞行演示。这大幅削弱了旧 ISS 货运口径的确定性，但 NASA 同时表示，未来商业空间站仍需要低地球轨道货运服务具备有竞争力的产业基础。第三个口径是邻近轨道系统市场：第三方预测把 2026 年商业
              LEO 卫星市场放在 $18.7 billion，更宽的 2026 年 LEO 卫星市场放在 $32.59 billion；另一个商业空间站预测则把该细分市场定在 2026 年 $6.96
              billion。这些第三方数字口径不一致，不能相加。更好的读法是把它们视为方向性证据：Sierra 的可服务市场远不止 ISS
              货运，而是延伸到更大的轨道基础设施和国家安全预算池。第四个口径是资本市场强度，这一点进一步印证上述判断：Space Capital 称，仅 2026 年 Q1 就有 $36 billion 投向 148
              家公司，既说明有多少资本在追逐轨道基础设施，也说明进入竞争有多昂贵。
