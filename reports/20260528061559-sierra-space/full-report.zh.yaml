  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Covers Sierra Space plus five public space and satcom peers with current market and financial data; direct
        private comps with comparable disclosure are still scarce.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Sierra Space
        - 2026 年 3 月私募融资
        - 投后估值 8.0B USD；收入和利润率未披露，因此没有干净的公开市销率
        - 本报告直接分析对象，确有投资方支持和国防可选性
        - 表面估值可能掩盖优先权或结构化下行保护
      - - Rocket Lab
        - 市值 86.96B USD，过去 12 个月收入 679.58M USD
        - ~128.0x 市销率
        - 显示行情火热时，公开市场能给受追捧航天平台多激进的定价
        - 流动性充足的上市股票，披露完整得多，业务组合也不同
      - - Redwire
        - 市值 4.75B USD，过去 12 个月收入 370.96M USD
        - ~12.8x 市销率
        - 比纯软件或卫星通信可比公司更接近硬件与基础设施筛选口径
        - 规模更小、盈利能力更弱，资产组合仍不同
      - - Intuitive Machines
        - 市值 8.75B USD，过去 12 个月收入 334.27M USD
        - ~26.2x 市销率
        - 可参考相近表面估值区间下、政府锚定航天项目的可选性
        - 月球服务敞口与 Sierra 的组合有重大差异
      - - Viasat
        - 市值 11.62B USD，过去 12 个月收入 4.62B USD
        - ~2.5x 市销率
        - 提供卫星通信和防务相邻业务的公开市场倍数下限
        - 公司更成熟、带杠杆、增长更慢，收入基数也稳得多
      - - Planet Labs
        - 市值 17.99B USD，过去 12 个月收入 307.73M USD
        - ~58.5x 市销率
        - 显示市场愿意为一家披露当前财务、积压订单可见的航天公司支付什么倍数
        - 地球观测数据经济性与 Sierra 的运输和防务组合差异很大
    notes: 这张表是筛选工具，不是公允价值计算器。上市航天公司倍数离散度异常高，而 Sierra 缺少公开经营分母，无法干净映射到任一行。
