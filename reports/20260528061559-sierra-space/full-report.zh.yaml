      - - 货物处置和可扩展物流体积
        - 单一飞行器往往无法同时优化上行质量、处置和未来托管载荷灵活性
        - Shooting Star 通过内部货运、外部挂点和未来自由飞行器路径增强 Dream Chaser
        - Sierra 宣称有 7K-pound 内部容量和 3 个外部挂点
        - 公开证据仍显示用途集中在 NASA，未披露商业托管载荷客户
      - - 长期栖息舱部署
        - 空间站开发商需要大可居住体积，但不想发射刚性大直径舱段
        - LIFE 以紧凑形态发射，在轨充气后形成多层栖息舱
        - 公开页面提到一个直径 27-foot、三层、可容纳 4 名宇航员的栖息舱
        - 客户承诺和已部署服务时间表仍未披露
      - - 防务或在轨服务卫星任务部署
        - 买家需要可配置卫星平台和任务硬件，不必从零搭建整个平台
        - Eclipse 卫星平台家族和传统子系统目录
        - Sierra 已命名三个卫星平台等级，并披露早期 SDA 结构生产进展
        - 公开记录尚未显示在轨卫星平台性能或具名外部卫星平台运营商
      - - 主集成商子系统采购
        - 项目需要合格的电力、生命支持、推进、热控和在轨服务硬件，速度要快于从零开发
        - Sierra 销售 EPS、ECLSS、推进和在轨服务技术目录
        - 公开 ECLSS 页面提到已交付 200+ 产品，电力页面描述了已完成组装和测试的系统
        - 公开来源未拆分哪些子系统主导收入，也未按客户拆分飞行履历
    notes: 收益单元格混合直接指标和具体公开证据；限制单元格标出已交付能力与仍未验证运营规模之间的边界。
