    rows:
      - - 货物运输与返回物流
        - Dream Chaser 和 Shooting Star 开发、货物交付、货物处置、跑道返回物流、任务集成
        - 运载火箭制造、未绑定 Sierra 飞行器的通用发射服务
        - 当前为 NASA；未来为商业空间站运营方
        - Dream Chaser 仍是 Sierra 最可见的运输切入点，但现在取决于 2026 年底演示和后续任务订单。
      - - 商业空间站和栖居舱
        - Orbital Reef 空间站开发、栖居舱模块、生命保障、空间站公用系统、对接兼容基础设施
        - 独立旅游运营、未使用 Sierra 栖居舱或基础设施的空间站
        - NASA 作为锚定租户，Blue Origin 或其他运营方，后续研究和工业租户
        - 这是 Sierra 最清晰的长周期基础设施市场，也是公司不能只按货运提供商分析的主要原因。
      - - 国家安全航天器和机动系统
        - 卫星平台、导弹预警相关的机动 / 物流、弹性通信、具备轨道服务能力的卫星平台
        - 纯发射服务、无关的地面国防项目
        - USSF、SDA、NRO、主承包商、盟友政府买方
        - Sierra 的卫星和国防导向材料把服务市场扩展到民用载人航天之外。
      - - 航天器子系统和轨道硬件
        - 精密机构、高 TRL 组件、航天器硬件、面向政府 / 民用 / 商业任务的支持设备
        - 大宗地面电子产品和非航天工业硬件
        - 政府机构、主承包商、民用航天项目、商业航天器制造商
        - 即使 Sierra 不是任务主承包商，子系统和硬件销售也能变现需求。
      - - 相邻轨道物流与服务
        - 自由飞行货运模块、具备服务能力的卫星平台、在轨物流载荷、对接和近距操作硬件
        - 通用卫星宽带服务收入或下游应用
        - 商业空间站运营方、国防买方、主权客户
        - 这些相邻市场重要，因为 Sierra 公开页面反复把物流、服务、机动和通信放在一起定位。
