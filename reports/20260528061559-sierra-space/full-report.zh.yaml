            body: >-
              不同客户的公开证据质量差异很大。NASA 仍是最强的具名证据，因为它同时包含合同历史、联合评审、Kennedy 的处理活动，以及 NASA 对 Dream Chaser 在 ISS
              物流中角色的明确表述。即便如此，这份证据仍处在开发阶段、且高度绑定单一客户，并不能证明服务已经经常性发生。SDA 是 NASA
              之外最强的证据，因为这段关系披露了经济规模、固定航天器数量和正在推进的制造执行；它更像生产采购，而不是一页客户标识展示。再往下，证据很快落入更窄的类别。Space Tango 和 Polar 载荷组合说明
              Dream Chaser 能吸引第三方科研用户，但这只是载荷层面的需求信号，不是锚定运输合同。ESA 的 Orbital Reef MoU
              也有意义，因为它来自潜在主权买方，但它显然是探索性准入协议，而不是确定预订。因此，正确的分析切分不是“有客户还是没有客户”，而是“有资金支持、正在执行的客户”与“仍待转化的具名需求信号”。
