      - number: '3.4'
        title: 护城河耐久性有希望，但仍更像叙事而非锁定
        blocks:
          - type: paragraph
            body: >
              Sierra 最好的战略论点是，竞争对手通常只提供栈中的一块。Dream Chaser 提供货运返回差异化，Orbital Reef 和 LIFE 提供居住舱路径，Eclipse / SDA
              工作打开防务邻近制造和卫星平台业务。如果这些项目都成熟，Sierra 就能向客户和政府买方推介一个比纯货运舱、纯空间站公司或纯卫星平台供应商更宽的平台。这确实有可能，尤其是 Sierra 已经赢得一个 $740
              million SDA Tracking Layer 合同，并展示了看得见的制造进展。


              但今天的切换成本仍偏向在位者。NASA 合同、既有 ISS 运营、SpaceX 发射集成、Northrop 的运营货运履历，以及防务主承包商长期采购关系，都会降低市场围绕 Sierra
              整合的紧迫性。多供应商并用也是默认市场行为：买方可以用一家做运输，另一家获得空间站准入，第三家承担轨道或国家安全任务。因此，主要反向证据不是 Sierra 缺乏差异化技术；而是排期滑坡、合同变化和 NASA
              尚未稳定的空间站战略，可能让这种差异化在竞争对手回应前无法转化为耐久的分发能力。
