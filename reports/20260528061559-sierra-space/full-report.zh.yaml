      - number: '7.4'
        title: 领导层、缓释成熟度与否决标准
        blocks:
          - type: paragraph
            body: >-
              执行和治理风险仍然重要，因为 Sierra 还没有把旗舰飞行器送入轨道，却已经经历了一次可见的 CEO 更替。Tom Vice 2025 年 1 月离任时，Dream Chaser
              延误、裁员和高管流动已经成为公开叙事的一部分。随后 Ozmen 家族重新直接掌管运营，再把公司交给 Dan Jablonsky；他的任务明确指向扩大执行能力和有纪律的增长。这是正面信号，但也说明董事会知道
              Sierra 的问题不只是技术雄心，而是要在数个资本密集型押注之间做好项目控制。公开治理仍集中在创始人和少数核心投资人周围；与此同时，董事会权利、SNC 依赖、Dream Chaser 演示成功标准、现金跑道和
              Orbital Reef 客户承诺等关键尽调项仍未公开。对投资人来说，正确姿态不是否认 Sierra 的上行空间，而是把每个乐观里程碑都配上一条可衡量的否决标准：Dream Chaser
              再次出现重大延期、Vulcan 复飞失败或推迟、CLD 预算收缩，或出现新的证据显示 Sierra 在锚定项目成熟前需要更多资本。
