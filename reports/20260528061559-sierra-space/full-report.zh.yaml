      - number: '5.3'
        title: 已验证成熟度与路线图主张
        blocks:
          - type: paragraph
            body: >-
              Sierra 的产品成熟度并不均匀，而「已测试」「已认证」「已运营证明」之间的区别，是本章的核心判断。LIFE 有扎实的公开测试证据：Sierra 已发布极限爆破压力和延长时长应力里程碑。Shooting
              Star 和 Dream Chaser 也通过 NASA Armstrong 和 Kennedy
              的活动展示了可信的资质认证路径，包括针对振动、声学和热真空条件的堆叠系统测试。防务卫星工作给出了最清晰的生产证明，因为 Sierra 披露，首批 9 个 SDA Tracking Layer 结构件提前 3
              个月完成。


              问题在于旗舰项目仍不是运营中的收入产品。到 2025 年底，Sierra 和 NASA 已把 Dream Chaser 的首次任务移到 2026 年末自由飞行演示，并取消了 NASA 此前的最低飞行承诺。这让
              Sierra 最有差异化的运输资产，从「即将开始服务」退回到「必须再次证明自己」。LIFE 和 Orbital Reef
              在商业化曲线上更早：公开记录显示测试、合作伙伴架构和宽泛用例，但没有已部署运营，也没有披露的非政府需求。因此，成熟度结论不是 Sierra
              缺技术，而是相较于旗舰平台已验证的商业服务准备度，公司拥有更多已验证的技术能力。
