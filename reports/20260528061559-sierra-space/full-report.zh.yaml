      - number: '6.5'
        title: 扩张路径与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Sierra 的扩张逻辑可信，但集中度风险仍占主导。Dream Chaser 的公开客户叙事仍高度绑定 NASA 和 ISS 过渡，因此 2025 年合同重置不只是普通延期：它在 ISS
              退役时间表压缩货运服务剩余窗口时，拿掉了有保障的任务量。采购路径解释了转化为什么慢：NASA
              需求必须先通过演示成功，再等未来货运或空间站服务订单；国防需求以不连续的批次授予和重新竞标出现；商业空间站需求仍取决于合作方执行，以及尚未公开的租户预订。Orbital Reef 给 Sierra
              提供了进入更广泛科研、旅游和主权机构市场的路径，ESA 2025 年 MoU 说明这条路并非纯假设。但 Payload 和 CSIS 对 CLD 的报道让反面证据绕不开：NASA
              本身仍是未来商业空间站的锚定客户，2026 年政策变化也表明私人市场还不成熟，无法独立支撑。国防业务降低了对单一 NASA
              货运项目的依赖，但这种多元化仍在政府预算周期和少数具名合同之内。结果是一个有真实战略价值、但宽度很薄的客户故事：Sierra
              有有意义的政府端证据和合理的扩张路径，但公开来源还没有证明它拥有足够深的商业客户基础，可以自行抵消 NASA 集中度。
