      - number: '3.2'
        title: Dream Chaser 飞起来前，货运物流竞争仍偏向在位者
        blocks:
          - type: paragraph
            body: >
              Dream Chaser 最有差异的主张不只是能运货，而是能把货物上行运力、通过 Shooting Star 处置废弃物，以及面向时效敏感载荷的低 g 跑道返回结合起来。这与 Dragon 的溅落路径和
              Cygnus 偏处置的模式有实质差异，对关心研究样本、精密硬件或着陆后快速取用的客户很重要。Sierra 也仍在展示技术进展：NASA 和 Sierra
              已公开带电载荷支持、自主操作和最终资质认证工作等测试里程碑。


              商业问题在于时间。NASA 2025 年 9 月的合同修改把首次任务重置为 2026 年末自由飞行演示，而不是 ISS 交付；取消了 NASA 购买特定数量 Dream Chaser
              补给任务的义务，并让未来订单取决于演示成功。这意味着，在 Sierra 证明飞行器能入轨之前，Dragon 和 Cygnus 保住在位优势。Boeing 的 Starliner
              不是直接货运对手，但仍然重要，因为它代表另一个 NASA 认证的运输项目，在低地球轨道争夺信任和预算注意力。Dream Chaser 真正飞起来之前，Sierra
              的货运优势大多还是功能层面的故事，对手则已经有运营履历、活跃客户关系，以及 SpaceX 这种垂直整合的发射栈。
