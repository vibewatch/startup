  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >
              Sierra Space 的服务市场应该从它今天公开销售的产品定义，而不是套用泛泛的「太空经济」标题。公司 2025 年末和 2026 年的材料把 Sierra
              定位为防务科技供应商，覆盖卫星平台、关键子系统、可重复使用航天飞机、推进和轨道基础设施。实际看，第二章有四个市场篮子：以 Dream Chaser 和 Shooting Star 为中心的货物运输与返回物流；以
              Orbital Reef
              及相关生命保障和舱段需求为中心的商业空间站与居住舱基础设施；以卫星平台、子系统、导弹预警邻近物流和机动任务为中心的国家安全航天器系统；以及邻近轨道基础设施，如服务、通信和面向政府、民用、商业任务的高可靠硬件。


              因此，纳入支出包括航天器采购、货运物流合同、空间站舱段和生命保障开发、锚定租户购买的空间站服务、卫星平台、航天级组件，以及当 Sierra
              的飞行器或硬件构成差异化层时，与发射绑定的任务集成。排除支出同样重要。Sierra 不是运载火箭主承包商，目前也没有独自拥有并运营商业空间站，更不销售纯消费者太空旅游体验。既有替代方案也因市场而异：货运侧是
              Dragon 和 Cygnus，居住侧是 ISS 和竞争商业空间站，国家安全侧是在位卫星平台或子系统供应商。这个边界把本章锁定在 Sierra 有可能赢下的预算，而不是所有曾经花在太空上的钱。
