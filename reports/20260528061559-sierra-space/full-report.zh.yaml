      - number: '4.3'
        title: 订单储备质量、执行负担与时点风险
        blocks:
          - type: paragraph
            body: >-
              财务弱点在于 Dream Chaser 订单储备质量。NASA 称，Sierra 最初在 CRS-2 下至少有 7 次 Dream Chaser 飞行和 4 个固定总价任务订单。2025 年 9 月，NASA 与
              Sierra 修改合同，Dream Chaser 现在需要先在 2026 年末完成自由飞行演示，NASA 才可能订购更多任务；NASA 也不再有义务购买特定数量的补给飞行。Sierra 自己当前的 Dream
              Chaser 页面也反映了这一现实，把首次 CRS-2 飞行描述为模拟 ISS 停靠的自由飞行器。从经济上看，这让 Dream Chaser
              从一个有锚的物流项目，变成一个收入时点取决于技术证明和演示后需求的条件性期权。


              这个变化很重要，因为 Sierra 显然背着不小的成本底座。公司 2022 年初称有 1,100 名员工，并计划再增加 1,000 人。后续报道提到 Tom Vice 时期的高管更替和裁员，Payload
              也明确质疑，如果不再融资，Sierra 能否同时执行 Dream Chaser、Orbital Reef 居住舱工作和 SDA 卫星项目。新 CEO Dan Jablonsky 在 2026
              年上任，以及公司强调运营扩张，更像是在主动重排执行优先级，而不是一家已经顺利走向自我造血成熟的公司。
