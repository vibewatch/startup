      - number: '1.4'
        title: Dream Chaser、LIFE、里程碑与反向背景
        blocks:
          - type: paragraph
            body: >-
              Dream Chaser 和 LIFE 仍承载 Sierra Space 大部分品牌资产，但现在背后是一份更混杂的执行记录。Dream Chaser
              在纸面上仍有差异化：部分可重复使用、跑道着陆的货运飞行器，具备低 g 返回能力，任务形态也灵活。LIFE 仍给 Sierra Space 一个可信的可展开居住舱故事，背后有多次缩比和全尺寸测试里程碑，也有
              NASA 支持的商业空间站探路角色。问题在于时间。2023 年底和 2024 年中，Sierra Space 与 NASA 的口径仍像是 ISS 货运任务临近；即便到 2025 年 1
              月，公司还在强调首次正式飞行的带电载荷集成。到 2025 年 9 月，独立报道称首飞再次滑到不早于 2026 年末，改为自由飞行演示，并且在修订后的 CRS-2 安排下失去了 NASA
              的最低飞行承诺。这一变化是本章的核心反向事件：它削弱了 Sierra Space 标志性飞行器的近期收入确定性，而公司正转向防务科技增长，并仍要求投资者为围绕 Dream Chaser、LIFE 和
              Orbital Reef 搭建的更宽平台愿景买单。
