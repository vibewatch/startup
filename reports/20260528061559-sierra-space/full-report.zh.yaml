  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 货运、空间站与轨道系统的竞争格局
        blocks:
          - type: paragraph
            body: >
              Sierra Space 的竞争集合异常分散，因为公司想卖的是平台故事，而不是单一航天器。在一条赛道上，它是货运物流挑战者：Dream Chaser
              试图靠跑道返回、温和再入，以及一款可重复使用的升力体飞行器来赢得 NASA 和未来商业需求，这款飞行器能把敏感载荷快速带回。在第二条赛道上，它是空间站和居住舱挑战者：Orbital Reef 和 LIFE
              必须面对 Axiom 先挂靠 ISS 的路径、Vast 的 Haven 路线图、Starlab 研究优先的联盟，以及尽可能久地继续使用 ISS 这一简单现状。在第三条赛道上，Sierra 正通过 Eclipse
              卫星平台线和 SDA 合同授予扩展到国家安全与轨道系统业务，在这里它面对的是采购历史和飞行履历都宽得多的主承包商。


              因此，最重要的替代方案不只是「其他商业空间站」或「其他货运飞行器」。买方可以继续使用在位货运供应商，等待 Axiom / Vast / Starlab
              式目的地，坚持政府拥有的基础设施，或把采购拆给不同的运输、居住舱和卫星供应商。Sierra
              的强项是能讲一个横跨运输、居住舱，以及如今防务邻近卫星平台的端到端故事。弱项是，只有这些组件赶在在位者和邻近进入者关窗前真正投入服务，这个故事才会变得耐用。
