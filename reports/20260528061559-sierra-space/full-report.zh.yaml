        - 没有公开空间站标价；2027 年 PAM 和 Haven 路线图是主要公开商业信号
        - 短期任务、45 m³ 单舱空间站、通往更大 Haven 系统的路径
        - 客户定价、入住假设和资金厚度仍不透明
