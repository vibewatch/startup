      - number: '6.4'
        title: 留存、重复使用与持久性缺口
        blocks:
          - type: paragraph
            body: >-
              Sierra 的公开客户记录里程碑证据很多，持久性指标很少。保留资料中没有任何公开来源披露客户数、净留存率（NRR）、总留存率（GRR）、流失率、续约率、合同长度或满意度得分。Dream Chaser
              曾经最好的持久性代理指标，是 NASA 预期的多任务货运计划；但合同被重置为没有具体任务义务的自由飞行演示后，这个指标明显变弱。Sierra
              的跑道返回设计和佛罗里达再处理计划说明重复任务在运营上如何成立，但还没有完成过一个周期来证明真实复用或周转经济性。国防侧的持久性更强一些，因为 SDA 当前批次已经覆盖 18
              颗卫星和两个制造平面；即便如此，公开记录也没有显示 Sierra 拿到后续批次授予。Orbital Reef 的重复可见性最弱：ESA 和 NASA
              提供了未来需求逻辑，但没有披露租户名单或经常性空间站服务合同，投资人无法据此建模留存。实际来看，本章能记录的是代理指标和缺口，而不是真正的付费客户队列。
