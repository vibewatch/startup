  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价可见度
        blocks:
          - type: paragraph
            body: >-
              Sierra Space 不是单产品初创公司。当前官方材料把公司描述为防务科技太空平台，销售可重复使用货运、充气式居住舱基础设施、卫星平台和太空子系统。这意味着理论收入面很宽：Dream Chaser 和
              Shooting Star 面向按任务计费的运输，LIFE 面向空间站和居住舱经济性，Eclipse
              卫星平台面向航天器项目，更宽的硬件组合则面向政府或主承包商工作。多元化是真实的，但公开的变现可见度仍然偏薄。所审阅的 Sierra
              页面解释了货运能力、跑道返回优势、居住舱能力和卫星任务适配，却没有公布标价、舱段定价或标准单元经济。


              这个缺口很重要，因为 Sierra
              的业务更像长周期政府和基础设施承包商，而不是价格点透明的软件公司。公开证据显示，收入更可能通过固定价格项目、里程碑付款、任务订单和任务运营确认，而不是经常性座位费或容易建模的使用量定价。读者能看到产品和技术角色，却看不到实际定价、折扣或项目层面收益率。因此，收入面可信，但收入模式只能从公开证据中得到部分承销。
