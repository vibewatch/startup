              验证采用情况，更适合按项目里程碑串起来，而不是看经常性客户使用。Dream Chaser 的公开轨迹从 2023 年 NASA 支持的任务规划，推进到 2024 年交付飞行器并准备发射，再到 2025
              年做载荷就绪测试。但同一组证据也暴露出转化为实际服务的上限：到 2026 年 5 月，NASA 的 ISS 飞行计划仍列出 SpaceX 和 Northrop 的货运飞行，而不是 Dream
              Chaser；2025 年的合同修改也把首飞重置为自由飞行演示，而非对接停靠任务。也就是说，Sierra 已做了大量运营准备，但还没有跑出真实、重复的货运节奏。国防采用看起来更实。2024 年初，SDA 授予
              Sierra 一份 18 颗卫星的 Tranche 2 合同；到 2026 年 1 月，Sierra 已提前完成首批 9 个结构件。Orbital Reef 介于两者之间：NASA
