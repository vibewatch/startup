              Dream Chaser 仍是最清晰的近期收入和市场可信度路径，但 NASA 不再承诺向 Sierra 采购最低数量的 ISS 飞行，ULA 发射节奏也仍是现实依赖。一次成功的 2026
              年末演示可能同时重启民用和防务机会；如果继续延期，Sierra 更宽平台故事背后最强的证明点会被削弱。
