      - number: '1.2'
        title: 领导层变动、董事会构成与治理集中度
        blocks:
          - type: paragraph
            body: >-
              领导层是 Sierra Space 公司概况里最重要的变量之一，因为公司已经经历了一个完整 CEO 周期，锚定项目却仍未入轨。Tom Vice 从 Aerion 和 Northrop Grumman 被招来，在
              2021 年启动公司，并帮助完成前两轮融资；但第三方报道显示，在 Dream Chaser 排期滑坡、裁员和高管更替交织的一段时期后，他于 2024 年底离职。Fatih Ozmen 接任临时 CEO，Eren
              Ozmen 继续担任临时总裁，进一步说明 Sierra Space 的实际控制权仍有多大程度掌握在创始 SNC 所有者手中。公开董事会名单增加了外部分量——Coatue 和 General Atlantic
              都有可见席位，退役中将 John Shaw 现在担任安全委员会主席——但没有冲淡一个印象：治理仍集中在 Ozmen 家族周围的小圈子里。Dan Jablonsky 于 2026 年 3 月出任
              CEO，引入了更成规模的防务和航天运营履历；但董事会和临时过渡路径显示，Sierra Space 仍高度依赖创始发起方掌舵，领导梯队也偏窄。
