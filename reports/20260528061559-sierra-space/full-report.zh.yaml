        - NASA SAA 支持加战略投资，而不是公开终端客户定价
        - 研究导向空间站、载荷实验室、宇航员服务、单次发射架构
        - 需求有多少来自 NASA、有多少来自私人研究客户仍不清楚
        - Starlab 竞争靠财团可信度和研究叙事，而不是透明价格
      - - SDA 卫星平台市场
        - 公开 OTA 金额：Sierra $740M、Lockheed $890M、L3Harris $919M，各 18 颗卫星
        - 导弹预警 / 跟踪和导弹防御卫星，发射期限为 2027 年 4 月前
        - 单星成本质量和长期后续经济性仍取决于执行
        - 防务多元化给 Sierra 一条舱段之外的资金通道，但不是定价护城河
