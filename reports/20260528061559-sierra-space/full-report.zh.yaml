  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >
              Sierra Space 进入估值讨论时，有一个非常强的公开事实，也有几项非常重要的缺口。强事实是：公司确实在 2026 年 3 月完成了 $550 million 的 Series C，投后估值 $8
              billion；此前它已在 2021 年完成 $1.4 billion 的 Series A，并在 2023 年完成 $290 million 的 Series
              B。因此，当前估值不是传闻、数据库噪音，也不是过期融资轮的旧标题，而是一轮有公司官方披露和多家独立报道支撑的新融资。第二个支撑点是市场背景：Space Capital 将 2026
              年一季度描述为航天投资的创纪录季度，说明 Sierra 融资面对的是愿意接盘的资本市场，而不是冻结市场。


              缺口在于，公开证据仍集中在融资和合同标题上，而不是承销级运营指标上。已审阅来源仍未披露当前收入、毛利率、客户集中度，或支撑 Series C 估值的经济条款。因此，正确姿态是入场纪律，而不是本能兴奋。在 $8
              billion 估值下，如果国防在手订单 质量高、Dream Chaser 演示成功、股权结构表干净，Sierra
              仍可能是一笔可做的投资。没有这些证明，标题价格就是要求投资人为可选性付费，而公开证据还没有把可选性转化成可靠分母。
