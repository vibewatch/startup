      - number: '5.4'
        title: 信任、安全、安保、合规与产品风险
        blocks:
          - type: paragraph
            body: >-
              Sierra 最强的公开信任信号是物理任务保障，而不是软件透明度。所审阅资料对结构测试、环境资质认证、压力容器测试、热真空工作、发射处理准备度和受监管再入规划着墨很多。围绕 Huntsville 的 FAA
              材料清楚表明，Dream Chaser 运营依赖正式的环境和许可栈，机场管理方和 Sierra 都需要分别获批。Sierra 的公开硬件目录也明确标出出口管制边界，说明部分文件排除了 ITAR/EAR
              技术数据。这些是真控制，不是营销口号。


              公开记录没有同样清楚地展示网络安全或安全软件保障。本章在留存来源中没有找到 Dream Chaser、Orbital Reef 或 Eclipse 的具名网络认证、安全开发框架，或任务保障 KPI
              集。这不证明这些控制不存在，但意味着公开尽调应把它们当作待回答问题，而不是已验证强项。最终风险图景是平衡的：Sierra
              在硬件资质认证、测试和受监管运营上看起来强，但公开证据支持的软件、安全和经常性运营披露较弱。对一家销售安全关键型太空基础设施的公司，这个差异很重要。
