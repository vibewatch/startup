      - number: '7.2'
        title: 发射、许可与合作方依赖
        blocks:
          - type: paragraph
            body: >-
              下一组风险是依赖风险：决定 Dream Chaser 和 Orbital Reef 能否变成收入项目的关键外部门槛，并不由 Sierra 控制。Dream Chaser 仍依赖 ULA 的 Vulcan，而
              Vulcan 自身也必须处理固体火箭助推器喷管异常、认证评审和复飞工作。即使 Sierra 完成飞行器收尾，发射时间仍暴露在 ULA 节奏、BE-4 发动机和 GEM 63XL
              助推器供应商表现，以及更广泛靶场拥堵之下。监管侧，FAA 明确表明 Dream Chaser 的着陆和再入路径不只是环境文件：Sierra
              仍必须满足商业发射和再入制度下的许可、安全、风险和赔偿要求。Orbital Reef 又叠加一层依赖。NASA 已为降风险里程碑出资，并让 C3DO
              继续存在，但商业空间站后续仍受采购不确定性、单一供应商预算压力和锚定客户模型影响；独立分析人士认为这个模型仍资金不足。本章的传导核心是：Sierra 顶层项目要依赖 NASA、FAA、ULA、Blue
              Origin 和政府预算持有人全部按时放行。
