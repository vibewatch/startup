        - 整合型挑战者
        - Dream Chaser 目标是 15+ 次可复用任务；Orbital Reef 获 NASA CLD 资金支持；Sierra 还持有一项 $740M SDA 授标
        - NASA 货运、未来商业空间站，以及国家安全 / 轨道系统
        - 受评玩家里，只有 Sierra 同时押注跑道返回货运、充气舱段和新的防务卫星平台
