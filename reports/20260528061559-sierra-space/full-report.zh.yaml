      - number: '7.3'
        title: 空间站经济性、资本强度与政府预算依赖
        blocks:
          - type: paragraph
            body: >-
              从财务上看，Sierra 融到的资本足以让公司保持相关性，但公开证据还不足以假设当前计划已经闭合、风险已经解除。2026 年 3 月的 Series C 给公司又带来 $550 million，并把 2021
              年以来披露资本推高到 $2 billion 以上；但 Sierra 自己的表述称，这笔现金用于扩大国家安全生产，并同时推动多个项目。独立报道更谨慎：观察者公开追问，Sierra
              能否在不追加资本或不做战略收窄的情况下，完成 Dream Chaser、向 Orbital Reef 贡献 LIFE 基础设施、执行 SDA 卫星工作，并推进再入野心。这一担忧被 Sierra
              多元化的性质进一步放大。国防转向是真实缓释，背后有 SDA 相关大额授予和更宽的国防科技身份；但这些收入本身仍绑定政府采购节奏、发射基础设施，以及 GAO 所称仍存在进度和成本现实性问题的项目。因此，Sierra
              并没有摆脱政府依赖；它只是把依赖的形态从一个 NASA 货运项目，换成了更广的一组由预算和里程碑驱动的项目。
