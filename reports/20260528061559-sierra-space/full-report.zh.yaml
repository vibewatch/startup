        - Series A、B、C 合计为公司注入超过 $2 billion，Series C 又赶上 2026 年强劲资本市场
        - 下一轮融资失败，或出现资本高度结构化的证据，会削弱这一支撑
      - - 正方：国防可选性真实存在，不只是叙事
        - Sierra 称 2023 年以来已拿下 $1.5 billion 国防合同，并围绕该需求搭建专门国防业务
        - 如果公司披露积压订单转化、毛利率和客户多元化，观点会上修
      - - 正方：Dream Chaser 仍是差异化资产
        - Sierra 仍在推广可重复使用货运航天飞机，主打温和返回和多任务能力
        - 只有 2026 年末演示成功并催生经常性需求，论点才会改善
      - - 反方：NASA 取消了 Dream Chaser 最低飞行承诺
        - NASA 已不再承担特定数量补给任务义务，下一里程碑只是自由飞行演示
        - 只有演示成功且后续任务需求可见，风险才会缓解
      - - 反方：商业空间站经济性仍依赖 NASA
        - NASA 仍是锚定客户，CSIS 认为没有更多 NASA 支持，市场闭环跑不通
        - 如果非 NASA 购买量或有资金支持的长期服务合同变得可见，风险会缓解
      - - 反方：公开分母缺失
        - Series C 来源仍未披露当前收入、毛利率、客户集中度或优先权条款
        - 如果管理层开放收入桥、毛利材料包和股权结构条款，建议会很快上修
    notes: 反方论点不是做空论点；它是一组有证据支撑的理由，说明当前公开记录不足以在现价给出更干净的建议。
