      - number: '2.5'
        title: 仍影响市场测算的尽调缺口
        blocks:
          - type: paragraph
            body: >
              未解的问题不是 Sierra Space 是否参与真实市场；答案显然是参与。未解的问题是，哪些市场会在与估值相关的时间框架内转化为已签约、可重复的需求。所审阅资料都没有披露 Orbital Reef 或
              Sierra 的 LIFE 相关基础设施已有确定的非政府承购承诺，因此非 NASA 空间站案例仍更像投资假设，而不是订单储备。同样，所审阅资料没有披露 Sierra 按卫星平台、子系统或机动项目直接确认的 DoD
              或 USSF 收入，因此无法判断防务科技再定位有多少已经变现，多少只是战略意图。


              空间站经济性同样不透明。公开材料显示 NASA
              资金、合作伙伴进展和高层级市场估算，但没有资本开支、舱段定价、利用率假设或单元经济，而这些才是建模轨道基础设施平台盈利能力所需的输入。在这些缺口补上之前，正确的市场结论是：Sierra
              确实暴露于几个正在增长且具有战略意义的预算池，但公开披露还不足以把这些预算池转化为一份清晰的自下而上收入预测。
            claimRefs:
              - CM018
              - CM019
              - CM042
              - CM046
              - CM047
      - number: '2.6'
        title: 图表
        blocks:
          - type: callout
            title: Sierra Space 身处三个采购体系，而不是一个 TAM
            body: >-
              Sierra 的真实市场由三套不同的机构购买动作支配：NASA 货运、NASA
              支持的商业空间站服务，以及防务航天采购。战略上这有好处，因为公司并不完全依赖一条预算线；但这也意味着每个市场都有不同的准备关口、合同形式和采用时钟。
