          description: 客户货物或任务载荷集成进 Dream Chaser 和 Shooting Star 货运舱。
        - id: qualification
          label: 鉴定与处理
          description: 发射前，集成后的组合体先经过 NASA 主导的环境与发射准备活动，再进入佛罗里达发射处理。
        - id: launch
          label: 搭乘 Vulcan 发射
          description: ULA Vulcan 为 Dream Chaser 任务提供发射通道。
        - id: in-space-mission
          label: 在轨任务执行
          description: 现在的任务剖面先从自由飞行器演示开始，然后才有后续货运服务任务订单。
        - id: runway-return
          label: 跑道返回
          description: Dream Chaser 设计为在跑道着陆，以低于胶囊海上溅落的 g 载荷返还敏感载荷。
        - id: refurbishment
          label: 再处理与持续保障
          description: 要形成经常性任务，需要佛罗里达再处理支持和受 FAA 监管的跑道运营。
