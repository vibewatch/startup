      - number: '4.4'
        title: 同行资本强度与披露反差
        blocks:
          - type: paragraph
            body: >-
              最好的公开可比组进一步说明这个类别有多昂贵。Vast 披露 2026 年 3 月获得 $500 million 新融资，明确拆分为 $300 million Series A 股权和 $200 million
              债务，并称其空间站技术和设施已经投入超过 $1 billion。Axiom 披露一轮 $350 million 融资，同样包括股权和债务，用于支持 Axiom Station 和 AxEMU
              航天服。Starlab 背后的上市母公司 Voyager 提供了最清晰的基准，因为它披露实际运营数字：订单储备 $275.3 million、现金 $429.4 million、包含循环信贷在内的流动性
              $641.4 million，以及 $44.0 million 季度净亏损。Voyager 还表示，尽管 NASA 里程碑资金正在流入，Starlab 本身今天不产生收入，近期也预计不会产生收入。


              在这个背景下，Sierra 的不透明就成为关键分析问题。Sierra 可能已经融到不低于任何直接同行的股权资本，但不同于 Voyager，它不披露现金、亏损或流动性指标；也不同于 Vast 或 Axiom，它的
              2026 年公开融资材料没有说明任何债务组成。这并不能证明 Sierra 弱于同行。它确实意味着，市场掌握的证据远不足以判断 Sierra 更大的资本池是否足以同时支撑 Dream
              Chaser、居住舱敞口和国家安全制造。
