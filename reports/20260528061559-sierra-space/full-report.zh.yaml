      - number: '2.3'
        title: 买方、用户、付款方与采购路径
        blocks:
          - type: paragraph
            body: >
              买方图谱是机构端，不是消费者端。ISS 货运和后续任何 NASA 物流订单里，NASA
              既是买方也是付款方，空间站机组、项目运营方和研究载荷所有者才是终端用户。商业空间站里，买方可以是空间站运营方或主集成商，但用户组合会延伸到研究机构、工业制造商、主权航天机构和商业租户。NASA
              自己的政策文本说得很明确：它希望成为商业目的地的众多客户之一，而不是唯一所有者；也就是说，只有非 NASA 用户也出现，商业空间站市场才算成熟。


              国家安全和轨道系统采购又是另一套逻辑。终端用户是作战人员、任务运营方和情报客户，但预算掌握在 U.S. Space Force、Space Development
              Agency、NRO，或负责整合航天器、载荷和发射的主承包商手里。Sierra 的卫星和子系统页面在这里很重要，因为它们显示公司正在销售卫星平台、机构、物流和机动需求，而这些需求不要求 Sierra
              拥有整个任务。每个篮子的采购都受里程碑驱动：Dream Chaser 现在需要先完成成功的自由飞行，NASA 任务订单才可能出现；CLD Phase 2 仍在 NASA 的 C3DO
              流程中推进；国家安全需求则通过按赛道的任务订单、分批合同授予和架构资金体现出来。这意味着，Sierra 的采用路径更多受公共采购关口、资质里程碑和锚定租户预算支配，而不是由消费者拉动。
