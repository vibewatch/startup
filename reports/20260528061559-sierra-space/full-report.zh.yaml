            - C3DO / CLD 流程 -> 认证 -> 服务采购
            - ISS 退役前空间站准备就绪
        - label: 空间站运营方采购
          values:
            - Blue Origin 或其他运营方 / 伙伴资金
            - 乘组和租户运营方
            - 伙伴集成和舱段采购
            - 技术集成 + 租户需求验证
        - label: 科研 / 工业租户
          values:
            - 科研机构、制药公司、主权赞助方
            - 科学家和制造团队
            - 载荷预订 -> 集成 -> 在轨使用
            - 可靠的空间站可用时间和定价
        - label: USSF / SDA / NRO
          values:
            - 防务航天项目办公室
            - 作战人员和任务运营方
            - 批次或任务订单采购
            - 任务就绪、韧性和进度合规
        - label: 盟国 / 主权政府
          values:
            - 民用或防务机构
            - 国家任务团队
            - 政府采购，通常经由主承包商
            - 信任、互操作性和出口合规
