companyProfile:
  summary: >-
    理解 Sierra Space，最好把它看作 2021 年从 Sierra Nevada Corporation 拆出的公司，而不是传统创始人主导的初创公司。公司起步围绕 Dream Chaser 运输和 LIFE
    居住舱基础设施展开，但到 2026 年，对外定位已经更宽：一家总部位于 Colorado 的防务科技太空公司，服务国家安全、民用和商业客户。最站得住脚的创始控制叙事是发起方主导：SNC 所有者 Fatih Ozmen 和 Eren
    Ozmen 通过董事会控制和过渡期高管角色继续与 Sierra Space 保持战略绑定；Tom Vice 则是创始 CEO，负责在 2021 年启动公司，直到 Dan Jablonsky 于 2026 年 3
    月接任。披露的拆分后融资轮次里，Sierra Space 融资约 $2.24 billion，投后估值达到 $8 billion，但核心承销矛盾没有变：资本支持和平台宽度看得见，当前收入、利润率和需求转化仍基本不公开，Dream
    Chaser 首次任务也已滑到 2026 年末的自由飞行任务。
