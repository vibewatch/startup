  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 按买方、用户和付款方划分客户
        blocks:
          - type: paragraph
            body: >-
              Sierra Space 的客户图谱不是宽泛的软件式账户基础，而是围绕少数高价值机构买方的项目组合。NASA 是 Dream Chaser 货运服务最清晰的买方和付款方，ISS
              机组、空间站研究人员和载荷所有者是终端用户。Space Development Agency 扮演不同角色：它是防务采购客户，购买导弹预警和跟踪卫星，服务作战任务，而不是购买太空运输服务。Orbital Reef
              引入第三类需求——合作伙伴主导的空间站需求——Sierra 提供空间站和运输构件，未来用户预计横跨政府机构、研究人员、工业客户和游客。ESA 的 MoU
              很重要，因为它来自潜在主权客户，但仍是探索性需求，而不是已签约需求。因此，隐含的市场进入路径按细分市场而异：货运需求通过政府任务订单转化，防务需求通过离散批次采购转化，空间站需求则通过 NASA
              支持的商业化加后续租户销售转化。Space Tango 和 Polar 低温系统等载荷侧名称证明 Dream Chaser 能服务第三方用户，但它们没有解决更大的承销缺口：Sierra
              仍没有提供汇总客户数或分部结构，无法显示公开标识背后到底有多少买方。
