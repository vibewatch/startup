chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与平台边界
        blocks:
          - type: paragraph
            body: >-
              Sierra Space 是 2021 年从 Sierra Nevada Corporation 拆出的公司，最初围绕 Dream Chaser 运输和 LIFE
              居住舱基础设施，定位为专门的商业航天载体。最早的启动叙事强调端到端「太空即服务」模式、继承超过 $3 billion 的在执行合同，以及相比留在更宽泛的航空航天和防务集团 SNC
              内部，更积极争取合作伙伴的能力。公开材料仍把公司锚定在 Colorado 的 Louisville，并列出 Wisconsin、Virginia、North Carolina
              等其他设施，但自我描述已经变化。Sierra Space 不再主要称自己是纯商业航天公司，而是称自己为总部位于 Colorado
              的防务科技太空公司，服务国家安全、民用和商业客户。这次重塑很重要，因为公司概况不再只围绕一架可重复使用货运航天飞机和一个未来空间站舱段。Sierra Space
              现在销售的组合包括卫星、航天器子系统、推进、高超音速和轨道基础设施，同时继续把 Dream Chaser 和 LIFE 作为定义品牌、拉开平台叙事差异的资产来营销。
