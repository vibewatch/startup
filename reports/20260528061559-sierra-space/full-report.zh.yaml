      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              最强增长驱动是结构性替代需求。NASA 仍需要一条 ISS 之后的路径，在低地球轨道维持连续载人存在、研究和物流；该机构自己的材料也说，一个或多个商业空间站必须可用，这样 NASA
              才能购买服务，而不是拥有整个平台。第二个驱动来自防务侧：FY2026 防务航天预算重置和 SSC 任务订单显示，导弹预警、跟踪、韧性星座和其他太空控制架构正在吸引更大的机构预算。Sierra
              公开组合足够多元，这一点很关键，因为即使 Dream Chaser 货运时点再次滑坡，公司仍能追逐这些邻近预算。


              主要约束是时点、经济性和认证。ULA 希望 2026 年把发射量提升到 18-22 次，而 2024 年只有 5 次、2025 年只有 6 次；这说明不能想当然地假设发射节奏。Vulcan
              此前的异常和认证延迟也说明，火箭问题可以同时拖住货运和防务任务。FAA 许可和再入监管又增加了一层排期和合规负担。空间站侧，CSIS 和 Aerospace Corporation
              都直截了当地指出，如果没有持续的政府支持，商业空间站商业模式仍然偏弱；NASA 仍是锚定客户，而不只是众多买方之一。防务侧，GAO 称 SDA
              仍在高估航天器准备度，也缺乏可靠的架构级成本和进度控制。合在一起，这些约束说明 Sierra 所处市场确有需求驱动，但执行门槛极高。
