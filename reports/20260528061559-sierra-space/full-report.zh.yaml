  - id: TV005
    title: 投资逻辑破裂与触发表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - Dream Chaser 演示延误或失败
        - 2026 年末自由飞行明显后移，或未能验证飞行器
        - 旗舰运输资产失去可信度，商业化时钟再次重置
        - 投资逻辑破裂；按低于当前估值重新承销，或直接退出
      - - NASA 支持进一步弱化
        - 演示后订单没有可见路径，空间站资金支持恶化
        - 平台故事失去最重要的锚定客户
        - 转为回避，除非估值大幅重置
      - - 防务积压订单经济性不及预期
        - 收入转化、利润率质量或合同期限显著弱于标题口径
        - 商业航天风险的主要对冲消失
        - 没有新证据时，不要支付溢价倍数
      - - Series C 轮条款偏保护投资人
        - 优先权、棘轮条款、优先级或治理权，使有效入场价格比 8.0B 名义估值更差
        - 这一轮比表面看更贵，新资金的上行空间被压缩
        - 暂停尽调，或重新定价机会
      - - 运营指标到 2027 年仍不透明
        - Dream Chaser 演示窗口之后，仍没有分部收入桥、利润率材料包或集中度数据
        - 证据质量仍太弱，无法明确上调建议
        - 继续放在观察名单，不进入批准流程
    notes: 这些是可监测的投资逻辑破裂触发项，不是泛泛风险；每一项都会改变当前估值的经济性，而不只是改变业务叙事质量。
