      - - 防务星座的技术就绪度和成本估算风险
        - 约束（反向）
        - 2026 年起
        - 即便防务需求资金充足，如果航天器就绪度和架构排期薄弱，仍会滑期
        - 询问 Sierra 在目标防务项目中的 TRL 位置、集成角色和成本可见度
      - - 靶场和基础设施成本回收
        - 约束
        - 持续
        - 更高发射需求挤压靶场、场站和常态化太空准入经济性
        - 量化靶场瓶颈或共享基础设施成本如何传导到 Sierra 任务经济性
