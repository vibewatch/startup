  - id: FM004
    title: 采用与采购流程
    type: flow
    layout: standard
    summary: Sierra 的可触达需求不是走简单商业销售漏斗，而是经过里程碑卡点的机构流程转化。
    data:
      nodes:
        - id: need
          label: 任务需求出现
          detail: NASA 替代需求、空间站运营方建设计划或防务航天要求，创造最初购买触发点。
        - id: procurement
          label: 采购路径开启
          detail: CLD/C3DO 招标、CRS 合同行动，或批次和任务订单竞标，定义买方路径。
        - id: qualification
          label: 资格与设计验证
          detail: Dream Chaser 飞行测试、空间站里程碑评审、硬件认证和监管批准必须先通过，收入才能放量。
        - id: award
          label: 纳入预算的授奖或任务订单
          detail: 机构买方只有在进度、安全和任务就绪门槛达标后，才会承诺资金。
        - id: mission-use
          label: 任务部署
          detail: 货物发射，空间站舱段承载租户，或防务航天器和硬件投入使用。
        - id: repeat
          label: 后续需求
          detail: 成功运营带来重复货运订单、额外租户需求，或后续防务批次。
      edges:
        - from: need
          to: procurement
          label: 政策或任务要求变成有资金的采购流程
        - from: procurement
          to: qualification
          label: Sierra 和伙伴必须证明技术就绪和合规
        - from: qualification
          to: award
          label: 只有里程碑通过后，买方才把就绪度转成有资金的工作
        - from: award
          to: mission-use
          label: 硬件、飞行器或服务完成集成并飞行
        - from: mission-use
          to: repeat
          label: 性能数据决定预算是否续接
    claimRefs:
      - CM015
      - CM020
      - CM027
      - CM031
      - CM037
      - CM042
