      - number: '8.3'
        title: 情景区间与退出准备度
        blocks:
          - type: paragraph
            body: >
              由于 Sierra 不披露当前收入或利润率，情景分析必须明确哪些是证据、哪些是假设。证据锚点包括 2026 年 3 月 $8 billion 融资、可见的国防合同叙事、2026 年底 Dream Chaser
              演示里程碑，以及倍数极度分散的公开可比公司组。悲观情景下，Dream Chaser 再次延期，NASA
              仍只是可自由裁量的货运买方，国防在手订单的质量或利润率低于标题暗示。在这个结果中，当前估值可能压缩到远低于入场价，并带来真实的下轮降价风险。基准情景下，Sierra
              将足够多国防业务转化为收入，并在没有新项目重置的情况下成功通过 Dream Chaser 演示；这足以守住当前估值附近的位置，但不足以承诺强劲的、仅靠公开证据可支撑的回报。乐观情景下，国防生产放量，Dream
              Chaser 变得可变现，空间站需求去风险程度超过当前证据支持。


              退出含义与估值区间同样重要。公开证据更支持战略出售或结构化老股交易，而不是近期 IPO，因为 Sierra 仍没有提供公开投资人或 IPO
              买方预期的那类经常性、经审计运营披露。这不是否定公司的理由，但足以成为理由，让投资人在当前价格下把预期回报和持有期假设设得保守。
