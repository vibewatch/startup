  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Sierra 的产品栈从工业测试基础设施往上分层，叠到可重复使用飞行器、空间站资产和国防航天平台。
    data:
      layers:
        - label: 工业基础与鉴定基础设施
          detail: 包括 100K+ 平方英尺的生产和测试产能、环境与热真空测试、推进测试，以及航天器集成能力。
        - label: 共享子系统层
          detail: ECLSS、发电、机构、推进、服务技术和热控组件，可在多个项目复用。
        - label: 飞行器与卫星总线平台
          detail: Dream Chaser 加 Shooting Star 运输栈，以及 Eclipse Horizon/Velocity/Titan 卫星总线，都架在共享硬件底座之上。
        - label: 任务解决方案
          detail: 货物返回、自由飞行器演示、栖息舱基础设施、Orbital Reef 空间站概念和国家安全卫星任务，是公开的解决方案表层。
        - label: 外部运营与合规层
          detail: 能否把产品栈转成经常性运营，取决于 ULA Vulcan 发射、NASA 客户集成、FAA 再入许可，以及合作伙伴空间站需求。
