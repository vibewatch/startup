  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Sierra Space 今天实际交付什么
        blocks:
          - type: paragraph
            body: >-
              不应把 Sierra Space 分析成单一飞行器故事。它当前的产品面横跨 Dream Chaser 运输、Shooting Star 货运舱、LIFE 居住舱基础设施、Orbital Reef
              空间站概念、Eclipse 卫星平台，以及更宽的子系统目录，覆盖电源、生命保障、推进、在轨服务和热控。这种宽度很重要，因为公开证据显示，同一个品牌下住着两门不同业务。一门是围绕 Dream Chaser
              和未来居住舱打造的高度差异化旗舰层。另一门则是更传统但工业化程度更高的硬件业务，向政府、民用和商业任务销售卫星平台、组件、结构和工程服务。


              从客户工作流看，Dream Chaser 不只是一个发射载荷。Sierra 把它营销为一套可重复使用、跑道着陆的货运系统，并与 Shooting Star
              搭配，从而扩大上行运力、处置能力和未来自由飞行器选项。LIFE 和 Orbital Reef 销售的是居住舱和空间站基础设施，而不是当前经常性服务。Eclipse 和传承子系统线进一步拉宽产品图谱，让
              Sierra 不必等空间站市场成熟，就能变现国家安全和卫星需求。因此，产品结论很直接：Sierra 有真实产品组合，但只有一部分已经像运营中的产品家族，而不是路线图资产。
