      - number: '4.5'
        title: 财务判断与尽调卡点
        blocks:
          - type: paragraph
            body: >-
              财务乐观情景很直接。Sierra
              已多次证明，它能在估值抬升时吸引资本，拿到大型政府关联合同代理指标，并把自己转向可能比纯商业空间站梦想更容易获得资金支持的防务项目。这些事实不支持眼下存在资金困境。真正影响承销的是负面情景。几乎所有能把战略叙事转化为真实财务模型的输入仍不公开：没有审计收入，没有当前分部结构，没有当前员工数，没有公开毛利率桥，没有当前现金余额，没有月度烧钱速度，没有现金跑道模型，也没有债务期限表。


              这个缺口不是表面披露问题，而是本章结论。Sierra
              的公开财务故事是资本获取故事和项目机会故事，还不是收入质量故事。任何严肃尽调都必须索取真实管理层材料包：月度现金流、订单储备瀑布、任务层面经济性、项目利润率桥、客户集中度，以及一份融资计划，解释 Dream
              Chaser、LIFE 或 Orbital Reef 敞口和防务扩张能否都容纳在当前资本底座内。在这套材料拿出来之前，Sierra 的公开估值看起来可以成立，但关键证据明显不足。
