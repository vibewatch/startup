      - number: '5.2'
        title: 架构、工业基础与技术栈交付方式
        blocks:
          - type: paragraph
            body: >-
              这套架构比泛泛的「太空平台」故事更具体。在飞行器层面，Dream Chaser 和 Shooting Star 组成两段式货运栈，一起测试、一起发射，然后拆分成运输和物流功能。在居住舱层面，LIFE
              绑定环境控制和生命保障系统，而 Sierra 也把这些系统作为独立硬件销售。在卫星层面，Eclipse 卫星平台家族建立在 Sierra 的子系统底座之上，底座包括电源、机构、推进、热控和在轨服务技术。这就是
              Sierra 能在货运、空间站和防务任务之间营销一个整合故事的原因：跨项目逻辑来自共享硬件和测试能力，而不只是品牌邻近。


              公开证据对运营模式的证明，在制造和资质认证上最强。Sierra 称其拥有超过 100,000 square feet 生产和测试空间，用于子系统装配、卫星生产、Dream Chaser
              制造，以及环境、热真空、推进和集成工作。公开招聘仍强调设计、测试和认证载荷与电子设备的工程师，进一步说明运营模式由资质认证牵引。这是优势，因为它指向真实工业基础。它也是限制，因为公开记录更能证明测试准备度和组件能力，而不是经常性服务节奏、翻修吞吐或软件保障成熟度。
