  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 分部收入桥
        - 按防务、Dream Chaser 和空间站相关项目拆分的当前收入
        - 没有分母，8.0B 估值就无法转成有纪律的入场倍数
        - 管理层资料室，CFO 或 FP&A 逐项讲解
      - - 合同利润率材料包
        - 防务积压订单的毛利率、现金转化和烧钱画像
        - 只有积压订单能转化出有吸引力的经济性，防务可选性才有意义
        - 项目财务审查 + 合同样本尽调
      - - Series C 轮条款
        - 清算优先权、棘轮条款、同意权，以及任何结构化资本特征
        - 标题估值可能高估真实经济入场价值
        - 律师审阅融资文件和股权结构表
      - - Dream Chaser 商业化路径
        - 演示就绪度、演示后 NASA 需求路径，以及 ISS 需求持续有限时的非 NASA 用途
        - 旗舰项目仍贡献大部分叙事上行
        - 结合里程碑证据和客户管线做项目审查
      - - 客户集中度
        - NASA、防务和商业类别中，按客户、项目和合同续约时点拆分的风险敞口
        - 当前价格下，集中度决定下行韧性
        - 收入质量尽调和客户访谈
      - - Orbital Reef 或空间站需求
        - 真实承购、已获资金的 NASA 支持，以及非 NASA 需求证据
        - 只有商业闭环能走出概念阶段，空间站可选性才有价值
        - NASA 伙伴尽调和商业管线审查
    notes: 这些问题按其对 2026 年 3 月估值下投资建议的直接影响排序，而不是按获取难度排序。
