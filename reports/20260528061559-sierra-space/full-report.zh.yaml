      - number: '3.3'
        title: Orbital Reef 在拥挤的 ISS 后空间站竞赛中竞争
        blocks:
          - type: paragraph
            body: >
              Orbital Reef 和 LIFE 不是只在和另一家初创公司竞争。它们面对的是 Axiom 先挂靠再分离的架构、Vast 快速推进的单舱 Haven 项目、Starlab
              研究驱动的联盟，以及如果商业空间站滞后，NASA 仍可继续依赖 ISS 并再次修订过渡架构这一现实。NASA 2021 年商业目的地拨款给了 Orbital Reef 团队一个有意义的早期立足点，NASA
              后来还报告了 Orbital Reef 设计工作进展。但 Axiom 有结构性优势，因为它的首批舱段计划先停靠 ISS，再分离成自由飞行空间站，从而获得更清晰的运营连续性和政府接触路径。Vast
              没有装机基础，但它展示了带有硬件里程碑的具体 2027 年 Haven-1 路线图，也赢得了 2027 年私人宇航员任务。Starlab 则在营销一个研究优先、AI 赋能，并拥有广泛股东和合作伙伴网络的空间站。


              更宽的反向解读是，这个市场仍不明显能自我维持。NASA 自己的资料中心描述的是分阶段采购和认证路径，外部分析则认为 NASA 仍是真正的锚定客户，而且不断变化的需求让商业空间站商业模式更难闭合。对 Sierra
              而言，这意味着 Orbital Reef 不只是在居住舱设计上竞争，也在融资深度、排期可信度，以及 NASA 究竟愿意承销多少 ISS 后需求曲线上竞争。
