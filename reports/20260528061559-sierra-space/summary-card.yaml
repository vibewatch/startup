summary:
  headline: >-
    Sierra Space is a well-capitalized but still under-disclosed space-and-defense platform whose $8 billion March 2026
    valuation looks stretched until Dream Chaser converts its late-2026 demo into contracted demand and management opens
    the revenue, margin, and term-sheet denominator.
