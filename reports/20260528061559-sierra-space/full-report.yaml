      - number: '6.2'
        title: Adoption Trajectory and Execution Milestones
        blocks:
          - type: paragraph
            body: >-
              The adoption story is easier to verify as a sequence of program milestones than as recurring customer
              usage. Dream Chaser’s public trajectory moved from NASA-backed mission planning in 2023 to vehicle
              delivery and launch preparation in 2024, then to payload-readiness testing in 2025. But the same evidence
              also shows the limits of conversion into active service: by May 2026 NASA’s ISS flight plan still listed
              SpaceX and Northrop cargo flights, not Dream Chaser, and the 2025 contract modification reset the first
              flight to a free-fly demonstration rather than a berthing mission. That means Sierra has substantial
              operational preparation but not yet a live recurring cargo cadence. Defense adoption looks more concrete.
              SDA awarded Sierra an 18-satellite Tranche 2 contract in early 2024, and by January 2026 Sierra had
              finished the first nine structures ahead of schedule. Orbital Reef sits between those poles: real
              NASA-backed design work exists, but customer adoption is still best understood as market formation rather
              than delivered service.
            claimRefs:
