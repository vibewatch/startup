              detail: Vast disclosed $300M of equity and $200M of debt in 2026.
            - label: partial visibility
              tone: warning
              detail: Capital intensity is explicit, but full cash and loss statements remain private.
            - label: pre-revenue station buildout
              tone: warning
              detail: Station roadmap is funded ahead of large-scale commercial revenue.
            - label: capital-heavy benchmark
              tone: neutral
              detail: Shows that station developers are still using large external financing packages.
        - label: Axiom
          values:
            - label: equity + debt
              tone: neutral
              detail: Axiom explicitly said its $350M round included both equity and debt.
            - label: partial visibility
              tone: warning
              detail: Reviewed sources disclose financing structure but not cash or losses.
            - label: dual-program burden
              tone: warning
              detail: Capital is supporting both station development and NASA spacesuits.
            - label: still capital intensive
              tone: neutral
              detail: Mixed financing confirms that successor-station programs remain expensive.
        - label: Voyager / Starlab
          values:
            - label: public-company funding base
              tone: positive
              detail: Voyager publishes backlog, liquidity, and loss data publicly.
            - label: high visibility
              tone: positive
              detail: Q1 2026 results disclosed cash, liquidity, backlog, and quarterly loss.
            - label: no near-term station revenue
              tone: warning
              detail: Voyager said Starlab does not generate revenue today and is not expected to in the near term.
            - label: best disclosure comparator
              tone: positive
              detail: Reveals how much more public data a station-adjacent peer can provide than Sierra.
    approximationNotes: >-
      This matrix is synthetic. It separates financing structure from disclosure quality so Sierra is compared on
      evidence visibility, not only on headline round size.
