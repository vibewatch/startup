        - NASA task-order style procurement rather than public list pricing
        - Operational ISS cargo service and established mission cadence
        - Per-mission pricing is not public in reviewed sources
        - Incumbents benefit from qualification and procurement familiarity more than brochure economics
      - - Axiom Station
        - No public station service price; 2026 financing adds funding depth
        - ISS-attached modules, private astronaut missions, future free-flyer station
        - Long-term utilization pricing and margin profile are private
        - Packaging is strongest where buyers value near-term continuity with ISS operations
      - - Vast Haven-1
        - No public station list price; 2027 PAM and Haven roadmap are the main public commercial signals
        - Short-duration missions, 45 m³ single-module station, path toward larger Haven system
        - Customer pricing, occupancy assumptions, and funding depth remain opaque
        - Vast competes on speed and clarity of roadmap more than disclosed economics
      - - Starlab
        - NASA SAA support plus strategic investment rather than public end-customer pricing
        - Research-focused station, payload labs, astronaut services, single-launch architecture
        - How much demand comes from NASA versus private research customers is still unclear
        - Starlab competes on consortium credibility and research framing, not on transparent price
