  - id: TV005
    title: Thesis-break and trigger table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Dream Chaser demo slips or fails
        - Late-2026 free-flight moves materially right or does not validate the vehicle
        - The flagship transport asset loses credibility and the commercialization clock resets again
        - Thesis break re-underwrite below the current mark or step away
      - - NASA support weakens further
        - No visible path to post-demo orders and station funding support deteriorates
        - The platform story loses its most important anchor customer
        - Move to avoid unless valuation resets sharply
      - - Defense backlog disappoints economically
        - Revenue conversion margin quality or contract duration prove materially weaker than headlines imply
        - The main offset to commercial-space risk disappears
        - Do not pay a premium multiple without fresh evidence
      - - Series C terms are investor-protective
        - >-
          Preferences ratchets seniority or governance rights make the effective entry price worse than 8.0B headline
          value
        - The round becomes more expensive than it looks and upside to new money compresses
        - Pause diligence or reprice the opportunity
      - - Operating metrics remain hidden into 2027
        - No segment revenue bridge margin pack or concentration data emerges after the Dream Chaser demo window
        - Evidence quality stays too weak for a clean upgrade in recommendation
        - Keep the company on watch not in approval
    notes: >-
      These are monitorable thesis-break triggers rather than generic risks; each one changes the economics of the
      current valuation rather than just the narrative quality of the business.
    claimRefs:
      - CV008
      - CV009
      - CV012
      - CV013
      - CV028
      - CV030
      - CV034
      - CV045
      - CV046
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Segment revenue bridge
        - Current revenue by defense Dream Chaser and station-related programs
        - Without a denominator the 8.0B mark cannot be turned into a disciplined entry multiple
        - Management data room and CFO or FP&A walk-through
      - - Contract margin pack
        - Gross margin cash conversion and burn profile on the defense backlog
        - Defense optionality only matters if the backlog converts into attractive economics
        - Program-finance review plus contract-sample diligence
      - - Series C terms
        - Liquidation preferences ratchets consent rights and any structured capital features
        - Headline valuation can overstate real economic entry value
        - Counsel review of financing docs and cap table
      - - Dream Chaser commercialization path
        - Demo readiness post-demo NASA demand path and non-NASA uses if ISS demand stays limited
        - The flagship program still drives a large share of narrative upside
        - Program review with milestone evidence and customer pipeline
      - - Customer concentration
        - Exposure by customer program and contract renewal timing across NASA defense and commercial buckets
        - Concentration determines downside resilience at the current price
        - Revenue-quality diligence and customer references
      - - Orbital Reef or station demand
        - Real off-take funded NASA support and non-NASA demand evidence
        - Station optionality is valuable only if the business case closes beyond concept level
        - NASA partner diligence and commercial-pipeline review
    notes: >-
      These asks are ordered by how directly they would change the recommendation at the March 2026 valuation not by how
      easy they are to obtain.
    claimRefs:
      - CV023
      - CV024
      - CV043
      - CV044
