      - number: '2.3'
        title: Buyer, user, payer, and procurement path
        blocks:
          - type: paragraph
            body: |
              The buyer map is institutional, not consumer. For ISS cargo and any later NASA logistics orders,
              NASA is both the buyer and payer, while station crews, program operators, and research payload
              owners are the end users. For commercial stations, the buyer can be the station operator or prime
              integrator, but the user mix extends across research institutions, industrial manufacturers,
              sovereign space agencies, and commercial tenants. NASA's own policy language is explicit that it
              wants to become one of many customers for commercial destinations rather than their sole owner,
              which means the commercial-station market only matures if non-NASA users also show up.

              National-security and orbital-systems procurement is different again. The end users are warfighters,
              mission operators, and intelligence customers, but budgets sit with organizations such as the U.S.
              Space Force, the Space Development Agency, the NRO, or prime contractors that integrate spacecraft,
              payloads, and launch. Sierra's satellite and subsystem pages matter here because they show the
              company is selling into bus, mechanism, logistics, and mobility requirements that do not require
              Sierra to own the whole mission. Procurement is milestone-driven in every bucket: Dream Chaser now
              needs a successful free-flight before NASA task orders become likely; CLD Phase 2 is still moving
              through NASA's C3DO process; and national-security demand shows up through lane-based task orders,
              tranche awards, and architecture funding. That means Sierra's adoption path is governed by public-
              procurement gates, qualification milestones, and anchor-tenant budgets more than by consumer pull.
            claimRefs:
              - CM027
              - CM028
              - CM029
              - CM030
              - CM031
              - CM032
