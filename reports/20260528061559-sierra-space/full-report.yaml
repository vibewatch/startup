  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation by Buyer, User, and Payer
        blocks:
          - type: paragraph
            body: >-
              Sierra Space’s customer map is not a broad software-style account base; it is a program portfolio centered
              on a few high-value institutional buyers. NASA is the clearest buyer and payer for Dream Chaser cargo
              services, with ISS crews, station researchers, and payload owners as the end users. The Space Development
              Agency fills a different role: it is a defense procurement customer buying missile-warning and tracking
              satellites for warfighter missions rather than space-transport services. Orbital Reef introduces a third
              category — partner-led station demand — where Sierra provides the station and transport building blocks
              while future users are expected to span government agencies, researchers, industrial customers, and
              tourists. ESA’s MoU is important because it comes from a prospective sovereign customer, but it remains
              exploratory rather than contracted demand. The implied go-to-market path therefore differs by segment:
              cargo demand converts through government mission orders, defense demand through discrete tranche
              procurements, and station demand through NASA-backed commercialization plus later tenant sales.
              Payload-side names such as Space Tango and the Polar cryogenic system prove Dream Chaser can serve
              third-party users, yet they do not solve the bigger underwriting gap: Sierra still provides no aggregate
              customer count or segment mix that would show how many buyers sit behind the public logos.
