chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and platform scope
        blocks:
          - type: paragraph
            body: >-
              Sierra Space is a 2021 spinout from Sierra Nevada Corporation that began life as a dedicated
              commercial-space vehicle around Dream Chaser transportation and LIFE habitat infrastructure. The original
              launch framing emphasized an end-to-end space-as-a-service model, more than $3 billion of inherited active
              contracts, and the ability to pursue partnerships more aggressively than SNC could from inside a broader
              aerospace and defense conglomerate. Public materials still anchor the company in Louisville, Colorado and
              list other facilities in Wisconsin, Virginia, and North Carolina, but the self-description has shifted.
              Instead of calling itself mainly a pureplay commercial-space company, Sierra Space now describes itself as
              a Colorado-headquartered defense-tech space company serving national-security, civil, and commercial
              customers. That reframing matters because the company overview is no longer just about one reusable cargo
              spaceplane and one future station module. Sierra Space now sells a portfolio that includes satellites,
              spacecraft subsystems, propulsion, hypersonics, and orbital infrastructure, while continuing to market
              Dream Chaser and LIFE as the brand-defining assets that differentiate the platform story.
