  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Sierra’s product stack is layered from industrial test infrastructure up through reusable vehicles, station
      assets, and defense-space platforms.
    data:
      layers:
        - label: Industrial base and qualification infrastructure
          detail: >-
            100K+ square feet of production and test capacity, environmental and thermal-vacuum testing, propulsion test
            work, and spacecraft integration functions.
        - label: Shared subsystem layer
          detail: >-
            ECLSS, power generation, mechanisms, propulsion, servicing technologies, and thermal-control components
            reused across multiple programs.
        - label: Vehicle and bus platforms
          detail: >-
            Dream Chaser plus Shooting Star transport stack and Eclipse Horizon/Velocity/Titan satellite buses sit on
            top of the shared hardware bench.
        - label: Mission solutions
          detail: >-
            Cargo return, free-flyer demonstrations, habitat infrastructure, Orbital Reef station concepts, and
            national-security satellite missions are the public solution surfaces.
        - label: External operations and compliance layer
          detail: >-
            ULA Vulcan launch, NASA customer integration, FAA reentry licensing, and partner station demand determine
            whether the product stack turns into recurring operations.
    approximationNotes: >-
      The layering is synthesized from product pages, technical pages, and operations sources; Sierra has not published
      one integrated architecture diagram with these exact layers.
