      - number: '4.3'
        title: Backlog quality, execution burden, and timing risk
        blocks:
          - type: paragraph
            body: >-
              The financial weak point is Dream Chaser backlog quality. NASA said Sierra originally had a minimum of
              seven Dream Chaser flights and four firm-fixed-price task orders under CRS-2. In September 2025, NASA and
              Sierra modified the contract so Dream Chaser now needs a late-2026 free-flight demonstration before NASA
              may order additional missions, and NASA is no longer obligated to buy a specific number of resupply
              flights. Sierra's own current Dream Chaser page reflects that reality by describing the first CRS-2 flight
              as a free-flyer that simulates ISS berthing. Economically, that moves Dream Chaser from an anchored
              logistics program toward a contingent option whose revenue timing depends on technical proof and post-demo
              demand.


              That shift matters because Sierra is clearly carrying a nontrivial cost base. The company said in early
              2022 that it had 1,100 employees and planned to add another 1,000. Later coverage reported executive
              turnover and layoffs during the Tom Vice era, and Payload explicitly questioned whether Sierra could
              execute Dream Chaser, Orbital Reef habitat work, and its SDA satellite programs without raising more
              capital. New CEO Dan Jablonsky's 2026 appointment and the emphasis on operational scaling suggest active
              execution triage rather than a company already cruising toward self-funded maturity.
