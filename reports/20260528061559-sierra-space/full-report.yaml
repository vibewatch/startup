      - number: '6.4'
        title: Retention, Repeat Usage, and Durability Gaps
        blocks:
          - type: paragraph
            body: >-
              Sierra’s public customer record is long on milestone evidence and short on durability metrics. No public
              source in the retained set discloses customer count, NRR, GRR, churn, renewal rates, contract length, or
              satisfaction scores. The best durability proxy Dream Chaser once had was NASA’s expected multi-mission
              cargo campaign, but that weakened materially when the contract was reset to a free-fly demonstration with
              no specific mission obligation. Sierra’s runway-return design and Florida reprocessing plan show how
              repeat missions could work operationally, yet no completed cycle proves actual reuse or turnaround
              economics. Defense looks stronger on durability because SDA’s current tranche already spans 18 satellites
              and two manufacturing planes, but even there the public record does not show a follow-on tranche award to
              Sierra. Orbital Reef is the weakest on repeat visibility: ESA and NASA provide future-demand logic, but no
              disclosed tenant roster or recurring station-services contract lets an investor model retention. In
              practice, this chapter can document proxies and gaps, not a true cohort of paying customers.
            claimRefs:
              - CU025
