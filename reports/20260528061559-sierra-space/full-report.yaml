      - number: '1.2'
        title: Leadership changes, board composition, and governance concentration
        blocks:
          - type: paragraph
            body: >-
              Leadership is one of the most important moving parts in Sierra Space's company overview because the firm
              has now lived through a full CEO cycle without taking its anchor program to orbit. Tom Vice was recruited
              from Aerion and Northrop Grumman to launch the company in 2021 and helped close the first two financing
              rounds, but third-party reporting says he left at the end of 2024 after a period marked by Dream Chaser
              schedule slippage, layoffs, and executive turnover. Fatih Ozmen stepped in as interim CEO while Eren Ozmen
              remained interim president, reinforcing how much of Sierra Space's practical control still sits with the
              founding SNC owners. The public board roster adds outside weight—Coatue and General Atlantic both have
              visible representation, and retired Lt. Gen. John Shaw now chairs a security committee—but it does not
              dilute the impression that governance remains concentrated in a small circle around the Ozmens. Dan
              Jablonsky's appointment as CEO in March 2026 introduces a more scaled defense-and-space operating profile,
              yet the board and interim transition path show that Sierra Space remains highly dependent on founder
              stewardship and a narrow leadership bench.
