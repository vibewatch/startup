  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What Sierra Space actually delivers today
        blocks:
          - type: paragraph
            body: >-
              Sierra Space should not be analyzed as a single-vehicle story. Its current product surface spans Dream
              Chaser transportation, the Shooting Star cargo module, LIFE habitat infrastructure, Orbital Reef station
              concepts, Eclipse satellite buses, and a wider subsystem catalog across power, life support, propulsion,
              servicing, and thermal control. That breadth matters because public evidence shows two different
              businesses living under one brand. One is a highly differentiated flagship layer built around Dream Chaser
              and future habitats. The other is a more conventional but more industrialized hardware business that sells
              buses, components, structures, and engineering services into government, civil, and commercial missions.


              In customer-workflow terms, Dream Chaser is not just a launch payload. Sierra markets it as a reusable
              runway-landing cargo system paired with Shooting Star, which expands upmass, disposal, and future
              free-flyer options. LIFE and Orbital Reef are sold as habitat and station infrastructure rather than a
              current recurring service. Eclipse and the heritage subsystem lines widen the product map further by
              letting Sierra monetize national-security and satellite demand without waiting for the station market to
              mature. The product conclusion is therefore straightforward: Sierra has a real portfolio, but only part of
              it is already behaving like an operational product family rather than a roadmap asset.
