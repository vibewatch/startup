        - Defense diversification gives Sierra a funding lane outside habitats, but not a pricing moat
      - - ISS + NASA-owned transition path
        - Appropriated government program spending rather than commercial list pricing
        - Continuous crewed platform, existing logistics and research infrastructure
        - True comparable commercial service cost is obscured by government ownership
        - Status quo competes by lowering transition risk, not by publishing cleaner economics
