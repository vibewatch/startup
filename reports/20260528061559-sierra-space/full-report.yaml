      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: |
              The strongest growth driver is structural replacement demand. NASA still needs a post-ISS pathway
              for continuous human presence, research, and logistics in low Earth orbit, and the agency's own
              materials say one or more commercial stations need to be available so it can buy services instead
              of owning the whole platform. A second driver is the defense side: the FY2026 defense-space budget
              reset and SSC task orders show that missile warning, tracking, resilient constellations, and other
              space-control architectures are drawing larger institutional budgets. Sierra's diversified public
              portfolio matters because it lets the company pursue these adjacent budgets even if Dream Chaser's
              cargo timing slips again.

              The main constraints are timing, economics, and certification. ULA wants to ramp to 18-22 launches
              in 2026 after only five launches in 2024 and six in 2025, which shows why launch cadence cannot be
              assumed. Vulcan's prior anomaly and delayed certification show how launcher issues can stall cargo
              and defense missions alike. FAA licensing and reentry regulation add another layer of schedule and
              compliance burden. On the station side, CSIS and the Aerospace Corporation are both blunt that the
              commercial-station business case remains weak without durable government support; NASA is still the
              anchor customer, not merely one buyer among many. On the defense side, GAO says SDA is still
              overestimating spacecraft readiness and lacks reliable architecture-level cost and schedule control.
              Together those constraints mean Sierra is operating in markets with real demand drivers but very
              high execution thresholds.
            claimRefs:
              - CM034
              - CM035
              - CM036
