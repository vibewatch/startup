  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              Sierra Space is not a one-product startup. Current official material frames the company as a defense-tech
              space platform selling reusable cargo transportation, inflatable habitat infrastructure, satellite buses,
              and space subsystems. That means the theoretical revenue surface is broad: Dream Chaser and Shooting Star
              for mission-based transport, LIFE for station and habitat economics, Eclipse buses for spacecraft
              programs, and a wider hardware portfolio for government or prime-contractor work. The diversification is
              real, but public monetization visibility remains thin. Sierra's reviewed pages explain cargo capacity,
              runway-return advantages, habitat capabilities, and satellite mission fit, yet they do not publish list
              prices, module pricing, or standard unit economics.


              That omission matters because Sierra's business reads like a long-cycle government and infrastructure
              contractor, not a software company with transparent price points. Public evidence suggests revenue would
              be recognized through fixed-price programs, milestone payments, task orders, and mission operations rather
              than recurring seat fees or easily modeled usage pricing. The reader can see products and technical roles,
              but not realized pricing, discounts, or program-level yields. As a result, the revenue surface is credible
              while the revenue model remains only partially underwritten from public evidence.
