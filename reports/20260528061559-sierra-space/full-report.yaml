  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape across cargo, stations, and orbital systems
        blocks:
          - type: paragraph
            body: >
              Sierra Space's competitive set is unusually fragmented because the company is trying to sell a platform
              story, not a single spacecraft. In one lane it is a cargo-logistics challenger: Dream Chaser is meant to
              win NASA and future commercial demand by offering runway return, gentle re-entry, and a reusable
              lifting-body vehicle that can bring sensitive payloads back quickly. In a second lane it is a station and
              habitat challenger: Orbital Reef and LIFE must compete with Axiom's ISS-attached path, Vast's Haven
              roadmap, Starlab's research-first consortium, and the simple status quo of continuing to use the ISS as
              long as possible. In a third lane Sierra is trying to expand into national-security and orbital-systems
              work through its Eclipse bus line and SDA awards, where it faces primes with much broader procurement
              history and flight heritage.


              That makes the most important alternatives broader than "other commercial stations" or "other cargo
              vehicles" alone. Buyers can keep using incumbent cargo providers, wait for an Axiom/Vast/Starlab style
              destination, stick with government-owned infrastructure, or split purchases across separate transport,
              habitat, and satellite vendors. Sierra's strength is that it can tell an end-to-end story across
              transport, habitats, and now defense-adjacent buses. Its weakness is that the story only becomes durable
              if the components actually enter service before incumbents and adjacent entrants close the window.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
