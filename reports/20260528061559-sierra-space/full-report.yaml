      - number: '3.3'
        title: Orbital Reef competes in a crowded post-ISS station race
        blocks:
          - type: paragraph
            body: >
              Orbital Reef and LIFE are not just competing with one other startup. They are competing with Axiom's
              attach-then-detach architecture, Vast's fast-moving single-module Haven program, Starlab's research-led
              consortium, and the ongoing reality that NASA can keep leaning on the ISS and revise its transition
              architecture again if commercial stations lag. NASA's 2021 commercial-destination awards gave the Orbital
              Reef team a meaningful early foothold, and NASA later reported progress on Orbital Reef design work. But
              Axiom has a structural advantage because its first modules are meant to berth to the ISS before separating
              into a free-flying station, giving it a clearer path to operational continuity and government touchpoints.
              Vast has no installed base, yet it is showing a specific 2027 Haven-1 roadmap with hardware milestones and
              also won a 2027 private astronaut mission. Starlab is marketing a research-first, AI-enabled station with
              a broad shareholder and partner network.


              The broader adverse read is that this market is still not obviously self-sustaining. NASA's own hub
              describes a phased procurement-and-certification approach, while outside analysis argues NASA remains the
              real anchor customer and that shifting requirements have made commercial station business cases harder to
              close. For Sierra, that means Orbital Reef is competing not only on habitat design, but on financing
              depth, schedule credibility, and how much of the post-ISS demand curve NASA is actually willing to
              underwrite.
