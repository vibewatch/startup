  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: standard
    summary: >-
      The Dream Chaser workflow links cargo integration, stacked testing, launch, orbital operations, runway return, and
      future reprocessing.
    data:
      nodes:
        - id: payload-integration
          label: Payload integration
          description: Customer cargo or mission payloads are integrated into Dream Chaser and the Shooting Star cargo module.
        - id: qualification
          label: Qualification and processing
          description: >-
            The integrated stack moves through NASA-led environmental and launch-readiness campaigns before launch
            processing in Florida.
        - id: launch
          label: Launch on Vulcan
          description: ULA Vulcan provides launch access for Dream Chaser missions.
        - id: in-space-mission
          label: In-space mission execution
          description: Mission profile now begins with a free-flyer demonstration before any later cargo-service task orders.
        - id: runway-return
          label: Runway return
          description: >-
            Dream Chaser is designed to land on a runway and return sensitive payloads under lower g-loads than capsule
            splashdown.
        - id: refurbishment
          label: Reprocessing and sustainment
          description: Florida reprocessing support and FAA-regulated runway operations are required for recurring missions.
      edges:
        - from: payload-integration
          to: qualification
        - from: qualification
          to: launch
        - from: launch
          to: in-space-mission
        - from: in-space-mission
          to: runway-return
        - from: runway-return
          to: refurbishment
    approximationNotes: >-
      The flow is Dream Chaser-centric because that is where Sierra’s public deployment and support disclosures are
      richest; station and satellite workflows are less fully disclosed.
    claimRefs:
      - CE002
