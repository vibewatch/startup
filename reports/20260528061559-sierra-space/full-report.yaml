      - number: '7.3'
        title: Station economics, capital intensity, and government-budget dependence
        blocks:
          - type: paragraph
            body: >-
              Financially, Sierra has raised enough capital to remain relevant but not enough public evidence to assume
              the current plan is closed and de-risked. The March 2026 Series C gives the company another $550 million
              and pushes disclosed capital since 2021 above $2 billion, yet Sierra's own messaging says that cash is
              meant to scale national-security production and keep multiple programs moving at once. Independent
              coverage is more skeptical: observers openly ask whether Sierra can finish Dream Chaser, contribute LIFE
              infrastructure to Orbital Reef, execute SDA satellite work, and pursue reentry ambitions without more
              capital or strategic narrowing. That concern is amplified by the character of Sierra's diversification.
              The defense pivot is a real mitigation, with large SDA-linked awards and a broader defense-tech identity,
              but those revenues are themselves tied to government procurement cadence, launch infrastructure, and
              programs that GAO says still suffer schedule and cost realism problems. Sierra is therefore not escaping
              government dependence; it is changing the flavor of that dependence from one NASA cargo program to a wider
              set of budget- and milestone-driven programs.
