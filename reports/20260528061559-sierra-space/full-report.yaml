      - number: '4.4'
        title: Peer capital intensity and disclosure contrast
        blocks:
          - type: paragraph
            body: >-
              The best public comparison set reinforces how expensive this category is. Vast disclosed $500 million of
              fresh financing in March 2026, explicitly split between $300 million of Series A equity and $200 million
              of debt, and said more than $1 billion has already been invested in its station technologies and
              facilities. Axiom disclosed a $350 million round that also included both equity and debt to support Axiom
              Station and AxEMU spacesuits. Voyager, the public parent behind Starlab, provides the clearest benchmark
              because it publishes actual operating numbers: backlog of $275.3 million, cash of $429.4 million,
              liquidity of $641.4 million including a revolver, and a $44.0 million quarterly net loss. Voyager also
              said Starlab itself does not generate revenue today and is not expected to in the near term even though
              NASA milestone funding is flowing.


              Against that backdrop, Sierra's opacity becomes the key analytical issue. Sierra has likely raised as much
              or more equity than any direct peer, but unlike Voyager it does not disclose cash, loss, or liquidity
              metrics, and unlike Vast or Axiom its public 2026 financing materials did not spell out any debt
              component. That does not prove Sierra is weaker than peers. It does mean the market has far less evidence
              on whether Sierra's larger capital pool is sufficient for Dream Chaser, habitat exposure, and
              national-security manufacturing simultaneously.
