      - number: '2.5'
        title: Diligence gaps that still matter for sizing
        blocks:
          - type: paragraph
            body: |
              The unresolved issue is not whether Sierra Space participates in real markets; it clearly does.
              The unresolved issue is which of those markets converts into contracted, recurring demand on a
              timeframe relevant to valuation. None of the reviewed sources disclosed firm nongovernment off-take
              commitments for Orbital Reef or Sierra's LIFE-related infrastructure, so the non-NASA station case
              is still more thesis than backlog. Likewise, no reviewed source disclosed Sierra's direct booked
              DoD or USSF revenue by bus, subsystem, or mobility program, which makes it impossible to tell how
              much of the defense-tech repositioning is already monetized versus merely strategic intent.

              The same opacity applies to station economics. Public material shows NASA funding, partner progress,
              and high-level market estimates, but not the capex, module pricing, utilization assumptions, or
              unit economics needed to model profitability for an orbital-infrastructure platform. Until those
              gaps close, the correct market conclusion is that Sierra has credible exposure to several growing
              and strategically important budget pools, but not yet enough public disclosure to convert those
              pools into a clean, bottoms-up revenue forecast.
            claimRefs:
              - CM018
              - CM019
              - CM042
              - CM046
              - CM047
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Sierra Space sits inside three procurement systems, not one TAM
            body: >-
              Sierra's real market is governed by three different institutional buying motions: NASA cargo, NASA-backed
              commercial-station services, and defense-space acquisition. That is strategically helpful because the
              company is not wholly dependent on one budget line, but it also means each market has a different
              readiness gate, contract form, and adoption clock.
            calloutType: insight
            claimRefs:
              - CM006
              - CM027
              - CM028
              - CM030
              - CM033
          - type: callout
            title: Dream Chaser timing is the highest-leverage adoption bottleneck
            body: >-
              Dream Chaser is still the most visible path to near-term revenue and market credibility, yet NASA no
              longer owes Sierra a minimum number of ISS flights and ULA cadence remains a live dependency. A successful
              late-2026 demo could reopen both civil and defense opportunities; a further slip would weaken the
              strongest proof point behind Sierra's broader platform story.
            calloutType: risk
            claimRefs:
              - CM015
              - CM016
              - CM037
              - CM038
              - CM044
          - type: callout
            title: Defense adjacency lowers reliance on post-ISS station timing alone
            body: >-
              Sierra's portfolio breadth matters because buses, subsystems, and mobility-oriented hardware let it target
              resilient national-security architectures even while Orbital Reef economics and Dream Chaser cargo timing
              remain uncertain. That does not eliminate execution risk, but it broadens the set of budgets Sierra can
              pursue before commercial-station demand is fully proven.
            calloutType: strength
            claimRefs:
