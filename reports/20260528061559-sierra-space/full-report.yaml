companyProfile:
  summary: >-
    Sierra Space is best understood as a 2021 Sierra Nevada Corporation spinout, not a conventional founder-led startup.
    The business launched around Dream Chaser transportation and LIFE habitat infrastructure, but by 2026 it was
    presenting itself more broadly as a Colorado-headquartered defense-tech space company serving national-security,
    civil, and commercial customers. The most supportable founding-control narrative is sponsor-led: SNC owners Fatih
    and Eren Ozmen remained strategically linked to Sierra Space through board control and interim executive roles,
    while Tom Vice served as the founding CEO who launched the company before Dan Jablonsky took over in March 2026.
    Across the disclosed post-spinout rounds Sierra Space raised about $2.24 billion and reached an $8 billion
    post-money valuation, yet the central underwriting tension remains unchanged: capital support and platform breadth
    are visible, while current revenue, margin, and demand conversion remain largely private and Dream Chaser's first
    mission has slipped to a late-2026 free-flyer.
