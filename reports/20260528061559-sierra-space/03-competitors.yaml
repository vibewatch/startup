  - id: "durability-switching-costs-and-defense-adjacency"
    title: "Moat durability is promising but still more narrative than lock-in"
    body: |
      Sierra's best strategic argument is that competitors usually offer only one piece of the stack. Dream Chaser offers cargo-return differentiation, Orbital Reef and LIFE offer a habitat path, and Eclipse/SDA work opens a defense-adjacent manufacturing and bus business. If those programs all mature, Sierra can pitch customers and government buyers a broader platform than a pure cargo capsule, a pure station company, or a pure bus vendor. That is a real possibility, especially because Sierra has already won a $740 million SDA Tracking Layer award and is showing tangible manufacturing progress.

      But today's switching costs still favor incumbents. NASA contracts, existing ISS operations, SpaceX launch integration, Northrop's operational cargo heritage, and defense primes' long procurement relationships all reduce the urgency to consolidate around Sierra. Multi-homing is also the default market behavior: a buyer can use one provider for transport, another for station access, and a third for orbital or national-security missions. The main adverse evidence is therefore not that Sierra lacks differentiated technology; it is that schedule slips, contract changes, and NASA's unsettled station strategy could keep that differentiation from turning into durable distribution power before competitors respond.
