  claims:
    - id: "CP001"
      statement: "Sierra Space competes across three linked lanes: cargo logistics, commercial stations, and defense-adjacent orbital systems."
      type: "inferred"
      topic: "competitive-scope"
      sourceRefs: [SP001, SP003, SP023]
      confidence: "medium"
      freshness: "current"
      answersQuestionRefs: [QP001]
    - id: "CP002"
      statement: "In cargo logistics, Dream Chaser's most direct operational comparators are Dragon and Cygnus, while Starliner overlaps more indirectly through NASA transport trust and low-Earth-orbit budget adjacency."
      type: "inferred"
      topic: "cargo-competition"
      sourceRefs: [SP004, SP008, SP009]
      confidence: "medium"
      freshness: "current"
      answersQuestionRefs: [QP002]
    - id: "CP003"
      statement: "Orbital Reef and LIFE compete against Axiom Station, Vast's Haven roadmap, Starlab, and continued ISS usage in the post-ISS commercial-station market."
      type: "inferred"
      topic: "station-competition"
      sourceRefs: [SP003, SP013, SP014, SP015, SP016, SP018, SP021]
      confidence: "medium"
      freshness: "current"
      answersQuestionRefs: [QP003]
    - id: "CP004"
      statement: "The ISS and NASA-led transition architectures remain powerful substitutes because they preserve the incumbent operating environment while commercial successors are still being certified."
      type: "inferred"
      topic: "status-quo-substitute"
      sourceRefs: [SP013, SP020]
      confidence: "medium"
      freshness: "current"
      answersQuestionRefs: [QP004]
    - id: "CP005"
      statement: "NASA's 2026 station rethink included a concept in which NASA would own and operate a core module initially attached to the ISS before eventual detachment, creating an internal-build style alternative to today's free-flyer plans."
      type: "third-party-reported"
      topic: "status-quo-substitute"
      sourceRefs: [SP020]
      confidence: "medium"
      freshness: "current"
    - id: "CP006"
      statement: "Sierra's Eclipse bus line and SDA work put it into competition with Lockheed Martin, L3Harris, and Northrop in orbital and defense systems as well as with cargo and habitat providers."
      type: "inferred"
      topic: "defense-competition"
      sourceRefs: [SP023, SP025, SP026, SP027, SP028]
      confidence: "medium"
      freshness: "current"
      answersQuestionRefs: [QP005, QP022]
    - id: "CP007"
      statement: "Dream Chaser's clearest transport differentiation is low-g runway recovery of sensitive cargo, a profile not matched by the capsule-based alternatives in the reviewed source pack."
      type: "inferred"
      topic: "transport-differentiation"
      sourceRefs: [SP001, SP007, SP008]
      confidence: "medium"
      freshness: "current"
      answersQuestionRefs: [QP006]
    - id: "CP008"
      statement: "Sierra's platform story depends on linking Dream Chaser transport, Orbital Reef/LIFE habitats, and broader orbital-services or defense programs into one customer narrative."
      type: "inferred"
      topic: "platform-story"
      sourceRefs: [SP001, SP003, SP023]
      confidence: "medium"
      freshness: "current"
    - id: "CP009"
      statement: "SpaceX and Northrop enter the cargo contest with existing operational heritage that Sierra does not yet have in orbit."
      type: "inferred"
      topic: "incumbent-heritage"
      sourceRefs: [SP005, SP007, SP008, SP010]
      confidence: "medium"
      freshness: "current"
    - id: "CP010"
      statement: "Dream Chaser's timing is partially constrained by external launch-provider readiness, whereas SpaceX controls both Dragon and its launch system."
      type: "inferred"
      topic: "launch-dependence"
      sourceRefs: [SP004, SP010, SP011]
      confidence: "medium"
      freshness: "current"
    - id: "CP011"
      statement: "Dream Chaser and Shooting Star are designed to deliver more than 6 tons of pressurized and unpressurized cargo and support runway return of critical payloads."
      type: "company-claimed"
      topic: "dream-chaser-capability"
      sourceRefs: [SP001, SP004]
      confidence: "medium"
      freshness: "current"
      answersQuestionRefs: [QP006, QP011]
    - id: "CP012"
