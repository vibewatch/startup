  - id: "cargo-logistics-competition"
    title: "Cargo logistics competition favors incumbents until Dream Chaser flies"
    body: |
      Dream Chaser's most distinctive claim is not merely that it can haul cargo, but that it can combine cargo upmass, waste disposal through Shooting Star, and low-g runway return for time-sensitive payloads. That is materially different from Dragon's splashdown profile and Cygnus's disposal-focused model, and it matters for customers who care about research samples, delicate hardware, or fast post-landing access. Sierra also continues to show technical progress: NASA and Sierra have publicized testing milestones around powered payload support, autonomous operations, and final qualification work.

      The commercial problem is timing. NASA's September 2025 contract modification reset the first mission into a late-2026 free-flight demonstration rather than an ISS delivery, removed NASA's obligation to buy a specific number of Dream Chaser resupply missions, and made future orders contingent on a successful demo. That means Dragon and Cygnus keep their incumbency while Sierra proves the vehicle in orbit. Boeing's Starliner is not a direct cargo peer, but it still matters because it represents another NASA-certified transport program competing for trust and budget attention in low Earth orbit. Until Dream Chaser actually flies, Sierra's cargo advantage is mostly a feature-level story competing against incumbents that already have operational heritage, active customer relationships, and in SpaceX's case a vertically integrated launch stack.
