  - id: thesis-antithesis-and-comparable-set
    title: Thesis, anti-thesis, and comparable set
    body: |
      The positive case for Sierra Space is evidence-backed. The company has raised more than $2 billion since 2021, repositioned around national-security work, and publicly claims a defense contract base large enough to matter at valuation time. Dream Chaser is still a differentiated asset on paper: a reusable cargo spaceplane with gentle-return and multi-mission characteristics that few peers can replicate. More broadly, the public market is not offering one simple “space multiple.” The peer set spans everything from mature satcom at roughly low-single-digit sales multiples to high-momentum space names trading at many tens of times sales. That dispersion means the market is willing to pay up for selected space platforms when investors believe the growth path and disclosure set.

      The anti-thesis is just as important. Sierra’s flagship program lost NASA’s minimum-flight commitment and moved to a late-2026 free-flight demonstration, while CSIS argued in 2026 that commercial-station business cases do not currently close without stronger NASA support. Those two facts matter because Sierra still needs Dream Chaser and station-related optionality to justify the breadth of the platform story. Comparable analysis helps frame the debate, but it cannot solve it. Rocket Lab, Redwire, Intuitive Machines, Viasat, and Planet all disclose more operating data than Sierra does, and their business mixes differ materially from Sierra’s blend of defense satellites, cargo transport, and future habitat infrastructure.
