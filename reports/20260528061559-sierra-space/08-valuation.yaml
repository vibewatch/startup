  - id: recommendation-triggers-and-final-diligence
    title: Recommendation, thesis-break triggers, and final diligence asks
    body: |
      The public record supports a research-more recommendation with medium confidence, high risk, and a stretched valuation stance. That conclusion is intentionally price-sensitive rather than narrative-sensitive. Sierra has real strengths: sponsor support, visible defense demand, a still differentiated transport asset, and a category that remains strategically important to NASA and the U.S. national-security apparatus. Those strengths are enough to keep Sierra on the table. They are not enough to justify paying the March 2026 mark on public evidence alone.

      The core problem is evidence quality. Public materials can tell an investor what Sierra has raised and how management wants the company to be perceived. They cannot yet tell an investor whether the defense backlog converts into attractive gross profit, whether Dream Chaser’s late-2026 demo leads to recurring demand, whether customer concentration is tolerable, or whether the Series C includes downside protections that make the economic entry price meaningfully worse than the headline valuation. Those are exactly the variables that determine whether today’s price is merely full or actually fragile. The practical implication is simple: do not stretch on valuation until the revenue bridge, margin pack, cap-table terms, and post-demo commercialization path are visible. If those diligence asks clear, Sierra could still earn back the current mark. If they do not, the thesis should be broken quickly rather than rationalized.
