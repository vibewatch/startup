company:
  name: Sierra Space
chapter:
  number: 8
  title: Valuation
  summary: "Sierra Space’s March 2026 Series C at an $8 billion post-money valuation is real and is supported by visible sponsor appetite, strong space-capital-market momentum, and meaningful defense-contract optionality. The problem is not whether investors believe in the company; it is that public evidence still does not disclose current revenue, margin, customer mix, or deal terms, while Dream Chaser’s NASA path has reset to a late-2026 free-flight demonstration and commercial-station economics remain heavily NASA-dependent. The chapter therefore supports a research-more recommendation with medium confidence, high risk, and a stretched valuation stance unless a lower entry or materially fuller primary diligence becomes available."
sections:
  - id: financing-context-and-entry-discipline
    title: Financing context and entry discipline
    body: |
      Sierra Space enters valuation with one very strong public fact and several very important omissions. The strong fact is that the company really did close a $550 million Series C in March 2026 at an $8 billion post-money valuation, after already raising a $1.4 billion Series A in 2021 and a $290 million Series B in 2023. The current mark is therefore not a rumor, database artifact, or recycled headline from a stale venture round. It is a fresh financing supported by official company disclosure and multiple independent reports. The second support point is market context: Space Capital described Q1 2026 as a record quarter for space investing, which means Sierra raised into a receptive capital market rather than a frozen one.

      The omission is that public evidence remains concentrated in financing and contract headlines, not in underwriting-grade operating metrics. The reviewed sources still do not disclose current revenue, gross margin, customer concentration, or the economic terms behind the Series C valuation. That means the right posture is entry discipline, not reflexive enthusiasm. At $8 billion, Sierra may still work as an investment if defense backlog quality is high, Dream Chaser’s demo succeeds, and the cap table is clean. Without those proofs, the headline price asks investors to pay for optionality that public evidence has not yet translated into a reliable denominator.
