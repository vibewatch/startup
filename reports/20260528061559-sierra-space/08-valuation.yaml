  - id: scenario-range-and-exit-readiness
    title: Scenario range and exit readiness
    body: |
      Because Sierra does not disclose current revenue or margin, the scenario work has to be explicit about what is evidence and what is assumption. The evidence anchors are the $8 billion March 2026 financing, the visible defense-contract narrative, the late-2026 Dream Chaser demo milestone, and a public peer set whose multiples are extremely dispersed. In the bear case, Dream Chaser slips again, NASA remains only a discretionary cargo buyer, and the defense backlog proves lower quality or lower margin than the headlines suggest. In that outcome, the current mark could compress to well below entry and create real down-round risk. In the base case, Sierra converts enough defense work into revenue and successfully clears the Dream Chaser demo without a new program reset, which is enough to defend something around the current valuation but not enough to promise strong public-only returns. In the bull case, defense production scales, Dream Chaser becomes monetizable, and station demand de-risks more than current evidence supports.

      The exit implications are just as important as the valuation range. Public evidence supports a strategic sale or structured secondary more than a near-term IPO because Sierra still does not provide the kind of recurring, audited operating disclosure that public investors or IPO buyers expect. That is not a reason to dismiss the company, but it is a reason to keep expected returns and hold-period assumptions conservative at the current price.
