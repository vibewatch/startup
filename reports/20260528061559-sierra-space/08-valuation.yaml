  claims:
    - {id: CV001, statement: "The March 2026 Series C is Sierra Space's freshest disclosed price-setting event and is therefore the correct public anchor for this chapter's valuation analysis.", type: inferred, topic: valuation-anchor, sourceRefs: [SV003, SV004, SV005], confidence: medium, freshness: recent, answersQuestionRefs: [QV001]}
    - {id: CV002, statement: "Sierra Space said the Series C brought total capital raised since 2021 to more than $2 billion.", type: company-claimed, topic: capital-raised, sourceRefs: [SV003, SV007], confidence: high, freshness: recent}
    - {id: CV003, statement: "Sierra Space announced a $1.4 billion Series A in November 2021 at a $4.5 billion valuation.", type: observed, topic: series-a, sourceRefs: [SV001], confidence: medium, freshness: historical, answersQuestionRefs: [QV003]}
    - {id: CV004, statement: "Sierra Space announced a $290 million Series B in September 2023 lifting total capital raised to $1.7 billion and valuation to $5.3 billion.", type: observed, topic: series-b, sourceRefs: [SV002], confidence: medium, freshness: historical, answersQuestionRefs: [QV002]}
    - {id: CV005, statement: "By early 2026 Sierra Space was presenting itself to investors and customers as a defense-tech space company rather than only a commercial-space-station story.", type: company-claimed, topic: positioning, sourceRefs: [SV003, SV008, SV010], confidence: medium, freshness: recent, answersQuestionRefs: [QV005]}
    - {id: CV006, statement: "Sierra Space said in June 2025 that since 2023 it had secured $1.5 billion in national-security and defense contracts for production on 30 satellites including an SDA-linked $740 million prime contract for 18 missile-warning and defense satellites.", type: company-claimed, topic: defense-contracts, sourceRefs: [SV008, SV009], confidence: high, freshness: recent, answersQuestionRefs: [QV006]}
    - {id: CV007, statement: "Space Capital said Q1 2026 delivered $36 billion invested across 148 space companies signaling unusually strong capital-market appetite for space assets.", type: third-party-reported, topic: capital-markets, sourceRefs: [SV018], confidence: medium, freshness: recent, answersQuestionRefs: [QV004]}
    - {id: CV008, statement: "NASA said in September 2025 that it was no longer obligated for a specific number of Dream Chaser resupply missions under the modified CRS-2 contract.", type: observed, topic: dream-chaser-contract, sourceRefs: [SV012, SV013, SV014], confidence: high, freshness: recent, answersQuestionRefs: [QV007]}
    - {id: CV009, statement: "NASA and Sierra Space shifted Dream Chaser’s next milestone to a free-flight demonstration targeted in late 2026 rather than an ISS berthing mission.", type: observed, topic: dream-chaser-demo, sourceRefs: [SV011, SV012, SV013], confidence: high, freshness: recent, answersQuestionRefs: [QV008]}
    - {id: CV010, statement: "Sierra continues to market Dream Chaser Tenacity as a reusable cargo vehicle capable of more than 6 tons of cargo and more than 15 reusable missions.", type: company-claimed, topic: dream-chaser-product, sourceRefs: [SV011], confidence: medium, freshness: current, answersQuestionRefs: [QV009]}
    - {id: CV011, statement: "NASA says its commercial-station approach remains phased from design and demonstration into certification and eventual service procurement.", type: observed, topic: cld-procurement, sourceRefs: [SV015], confidence: medium, freshness: current, answersQuestionRefs: [QV012]}
    - {id: CV012, statement: "CSIS wrote in March 2026 that NASA now says the business case for companies building commercial space stations does not make sense and that these companies cannot deliver an operational capability anytime soon.", type: third-party-reported, topic: station-business-case, sourceRefs: [SV016], confidence: medium, freshness: recent, answersQuestionRefs: [QV011]}
    - {id: CV013, statement: "CSIS also argued that NASA is effectively the market for commercial space stations today and that without NASA money there is no real market.", type: third-party-reported, topic: nasa-anchor-customer, sourceRefs: [SV016, SV017], confidence: high, freshness: recent, answersQuestionRefs: [QV010]}
    - {id: CV014, statement: "Space Systems Command’s October 2025 launch awards show ongoing missile-warning and tracking demand around SDA Tranche 2 supporting the broader defense-demand backdrop behind Sierra’s national-security pitch.", type: observed, topic: defense-demand, sourceRefs: [SV019, SV008], confidence: medium, freshness: recent}
    - {id: CV015, statement: "The public-peer set is usable as a valuation screen because Rocket Lab Redwire Intuitive Machines Viasat and Planet all publish current market and financial metrics and maintain SEC disclosure paths unlike Sierra Space.", type: inferred, topic: peer-set-quality, sourceRefs: [SV020, SV021, SV022, SV023, SV024, SV025, SV026, SV027, SV028, SV029], confidence: medium, freshness: current, answersQuestionRefs: [QV013]}
    - {id: CV016, statement: "As of May 27 2026 Rocket Lab screened at about $86.96 billion market cap $679.58 million trailing revenue and roughly 128.0x price-to-sales.", type: third-party-reported, topic: peer-rklb, sourceRefs: [SV020, SV021], confidence: medium, freshness: current, answersQuestionRefs: [QV014]}
    - {id: CV017, statement: "As of May 27 2026 Redwire screened at about $4.75 billion market cap $370.96 million trailing revenue and roughly 12.8x price-to-sales.", type: third-party-reported, topic: peer-rdw, sourceRefs: [SV022, SV023], confidence: medium, freshness: current, answersQuestionRefs: [QV015]}
    - {id: CV018, statement: "As of May 27 2026 Intuitive Machines screened at about $8.75 billion market cap $334.27 million trailing revenue and roughly 26.2x price-to-sales.", type: third-party-reported, topic: peer-lunr, sourceRefs: [SV024, SV025], confidence: medium, freshness: current, answersQuestionRefs: [QV016]}
    - {id: CV019, statement: "As of May 27 2026 Viasat screened at about $11.62 billion market cap $4.62 billion trailing revenue and roughly 2.5x price-to-sales.", type: third-party-reported, topic: peer-vsat, sourceRefs: [SV026, SV027], confidence: medium, freshness: current, answersQuestionRefs: [QV017]}
    - {id: CV020, statement: "As of May 27 2026 Planet screened at about $17.99 billion market cap $307.73 million trailing revenue and roughly 58.5x price-to-sales while the company separately reported record FY2026 revenue of about $308 million and backlog above $900 million.", type: third-party-reported, topic: peer-planet, sourceRefs: [SV028, SV030], confidence: medium, freshness: current, answersQuestionRefs: [QV018]}
    - {id: CV021, statement: "The public-peer set spans roughly 2.5x to 128x price-to-sales making single-multiple valuation arguments for Sierra inherently weak.", type: inferred, topic: peer-dispersion, sourceRefs: [SV020, SV022, SV024, SV026, SV028], confidence: medium, freshness: current, answersQuestionRefs: [QV019]}
    - {id: CV022, statement: "That dispersion means Sierra’s $8 billion mark is not automatically extreme relative to the hottest public space names but it still looks full without a public revenue denominator or margin profile.", type: inferred, topic: valuation-screen, sourceRefs: [SV003, SV020, SV022, SV024, SV026, SV028], confidence: medium, freshness: current, answersQuestionRefs: [QV020]}
    - {id: CV023, statement: "Public 2026 sources reviewed for the Series C did not disclose liquidation preferences governance rights or share-class terms so the headline valuation may not equal economically clean entry pricing.", type: inferred, topic: series-c-terms, sourceRefs: [SV003, SV004, SV005, SV006, SV007], confidence: medium, freshness: current}
    - {id: CV024, statement: "Public sources also do not disclose current revenue gross margins or customer concentration across NASA defense and commercial programs.", type: inferred, topic: operating-opacity, sourceRefs: [SV003, SV005, SV008, SV010], confidence: medium, freshness: current}
    - {id: CV025, statement: "At the current public evidence set the right recommendation is research-more rather than buy because the $8 billion price cannot be underwritten with enough precision.", type: inferred, topic: recommendation, sourceRefs: [SV003, SV008, SV012, SV016, SV020, SV022, SV024, SV026, SV028], confidence: medium, freshness: current, answersQuestionRefs: [QV025]}
    - {id: CV026, statement: "The right public-only valuation stance is stretched not outright absurd because sponsor appetite and defense optionality are real but the missing operating denominator is crucial.", type: inferred, topic: valuation-stance, sourceRefs: [SV003, SV007, SV018, SV020, SV022, SV024, SV026, SV028], confidence: medium, freshness: current, answersQuestionRefs: [QV026]}
    - {id: CV027, statement: "A strategic sale or structured secondary is more supportable than a near-term IPO because Sierra still does not publish audited recurring financial disclosure or a public-company reporting cadence.", type: inferred, topic: exit-path, sourceRefs: [SV003, SV010, SV020, SV021, SV022, SV023, SV024, SV025, SV026, SV027, SV028, SV029], confidence: low, freshness: current, answersQuestionRefs: [QV029]}
    - {id: CV028, statement: "In a bear case where Dream Chaser slips again NASA demand remains discretionary and defense backlog monetizes slowly Sierra could face a down-round or structurally impaired exit below the current mark.", type: inferred, topic: bear-case, sourceRefs: [SV012, SV013, SV014, SV016, SV017], confidence: medium, freshness: current, answersQuestionRefs: [QV028]}
    - {id: CV029, statement: "In a bull case where defense production scales Dream Chaser’s late-2026 demo succeeds and Sierra turns that proof into recurring demand the company could grow into a materially higher valuation than $8 billion.", type: inferred, topic: bull-case, sourceRefs: [SV003, SV008, SV011, SV012, SV019], confidence: low, freshness: current, answersQuestionRefs: [QV027]}
    - {id: CV030, statement: "The current mark can be defended only in a base case where defense contracts convert into revenue and Dream Chaser clears its demonstration milestone without another major reset.", type: inferred, topic: base-case, sourceRefs: [SV003, SV008, SV012], confidence: medium, freshness: current, answersQuestionRefs: [QV025]}
    - {id: CV031, statement: "A bear valuation range of roughly $4.5 billion to $6.0 billion implies only about 0.6x to 0.75x gross MOIC at an $8 billion entry before dilution.", type: estimated, topic: bear-range, sourceRefs: [SV003, SV012, SV016, SV020, SV022, SV026], confidence: low, freshness: current, answersQuestionRefs: [QV028]}
    - {id: CV032, statement: "A base valuation range of roughly $7.5 billion to $9.0 billion implies only about 0.9x to 1.1x gross MOIC at an $8 billion entry before dilution.", type: estimated, topic: base-range, sourceRefs: [SV003, SV008, SV012, SV020, SV022, SV026], confidence: low, freshness: current, answersQuestionRefs: [QV025]}
    - {id: CV033, statement: "A bull valuation range of roughly $10.5 billion to $13.0 billion implies about 1.3x to 1.6x gross MOIC at an $8 billion entry before dilution.", type: estimated, topic: bull-range, sourceRefs: [SV003, SV008, SV011, SV019, SV024, SV028], confidence: low, freshness: current, answersQuestionRefs: [QV027]}
    - {id: CV034, statement: "Sensitivity is greatest to three variables: disclosed revenue scale Dream Chaser commercialization after the free-flight demo and the margin quality of defense backlog.", type: inferred, topic: valuation-sensitivity, sourceRefs: [SV003, SV008, SV012, SV016], confidence: medium, freshness: current}
    - {id: CV035, statement: "The missing revenue denominator matters more than the exact peer chosen because Sierra’s public comp set already shows extreme multiple dispersion.", type: inferred, topic: valuation-sensitivity, sourceRefs: [SV020, SV022, SV024, SV026, SV028], confidence: medium, freshness: current}
    - {id: CV036, statement: "A 20% lower entry price around $6.4 billion would materially improve risk-adjusted returns by turning the base case into roughly 1.3x gross MOIC and the bull case into about 2.0x gross MOIC.", type: estimated, topic: entry-discipline, sourceRefs: [SV003, SV008, SV012, SV020, SV022, SV024, SV026, SV028], confidence: low, freshness: current}
    - {id: CV037, statement: "Capital support scores high because Sierra has raised more than $2 billion since 2021 and still attracts new lead investors.", type: inferred, topic: kpi-capital-support, sourceRefs: [SV001, SV002, SV003], confidence: medium, freshness: current}
    - {id: CV038, statement: "Defense optionality scores high because Sierra has public evidence of sizable national-security awards and a dedicated defense business buildout.", type: inferred, topic: kpi-defense-optionality, sourceRefs: [SV008, SV009, SV019], confidence: medium, freshness: current}
    - {id: CV039, statement: "Product differentiation scores mid because Dream Chaser still offers unique reusable cargo-spaceplane features but its business case weakened after NASA removed minimum missions.", type: inferred, topic: kpi-product-proof, sourceRefs: [SV011, SV012, SV013], confidence: medium, freshness: current}
    - {id: CV040, statement: "Execution confidence scores low to mid because the company’s flagship transport program still has not flown operationally and the station transition remains unsettled.", type: inferred, topic: kpi-execution-risk, sourceRefs: [SV012, SV013, SV016, SV017], confidence: medium, freshness: current}
    - {id: CV041, statement: "Economics visibility scores low because public sources do not disclose current revenue margin or preference terms.", type: inferred, topic: kpi-economics-visibility, sourceRefs: [SV003, SV004, SV005, SV006, SV007, SV023, SV024], confidence: medium, freshness: current}
    - {id: CV042, statement: "Exit readiness scores low to mid because Sierra remains too opaque for IPO-style underwriting despite strategic relevance and sponsor backing.", type: inferred, topic: kpi-exit-readiness, sourceRefs: [SV003, SV010, SV020, SV022, SV024, SV026, SV028], confidence: low, freshness: current}
    - {id: CV043, statement: "The first diligence ask should be a segment revenue bridge across defense Dream Chaser and station-related programs.", type: inferred, topic: diligence-asks, sourceRefs: [SV003, SV008, SV024], confidence: medium, freshness: current, answersQuestionRefs: [QV030]}
    - {id: CV044, statement: "The second diligence ask should be a contract-margin waterfall and burn profile for the defense backlog.", type: inferred, topic: diligence-asks, sourceRefs: [SV008, SV009, SV014, SV024], confidence: medium, freshness: current, answersQuestionRefs: [QV030]}
    - {id: CV045, statement: "The third diligence ask should be full Series C terms including preferences ratchets consent rights and any structured-capital features.", type: inferred, topic: diligence-asks, sourceRefs: [SV003, SV004, SV005, SV006, SV007], confidence: medium, freshness: current, answersQuestionRefs: [QV030]}
    - {id: CV046, statement: "The fourth diligence ask should be late-2026 Dream Chaser demo readiness post-demo NASA demand and backup commercialization routes.", type: inferred, topic: diligence-asks, sourceRefs: [SV011, SV012, SV013, SV014], confidence: medium, freshness: current, answersQuestionRefs: [QV030]}
    - {id: CV047, statement: "The fifth diligence ask should be proof of customer diversification and whether non-NASA demand exists for Orbital Reef- or habitat-linked services.", type: inferred, topic: diligence-asks, sourceRefs: [SV015, SV016, SV017, SV024], confidence: medium, freshness: current, answersQuestionRefs: [QV030]}
    - {id: CV048, statement: "Public peers are only directional comparables because their mixes of launch satcom lunar services and Earth-observation data differ materially from Sierra’s combination of defense satellites cargo transport and future station infrastructure.", type: inferred, topic: comp-limitations, sourceRefs: [SV015, SV016, SV017, SV020, SV022, SV024, SV026, SV028], confidence: medium, freshness: current}
    - {id: CV049, statement: "Planet’s official FY2026 result shows record revenue and backlog disclosure underscoring how much better-informed public-market underwriting is when a space company provides current financial detail.", type: inferred, topic: disclosure-standard, sourceRefs: [SV028, SV030], confidence: medium, freshness: current}
