evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: insurance-performance
    missingEvidence: >-
      Audited financial statements, loss ratio, combined ratio, reserves, and claims-development data for the
      risk-bearing entities.
    whyItMatters: >-
      Reported ARR and customer growth do not establish underwriting profitability, solvency, or the quality of risk
      selection.
    diligencePath: >-
      Obtain audited statements, statutory filings, actuarial reports, loss triangles, and reinsurance schedules for
      each carrier named on the policy.
    relatedQuestionRefs:
      - QO005
      - QO009
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Complete board, investor-rights, executive, and succession disclosures.
    whyItMatters: >-
      The company is founder-led and operating in a regulated industry, so oversight and key-person concentration affect
      execution and control risk.
    diligencePath: >-
      Request the current cap table, board roster, committee charters, investor rights, and succession or key-person
      plan.
    relatedQuestionRefs:
      - QO002
      - QO006
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: >-
      Executed financing documents reconciling the $1.3B, $2.6B, and reported $4B valuation points and identifying
      primary versus secondary proceeds.
    whyItMatters: >-
      Headline valuation changes can reflect different security terms or transaction structures and should not be
      treated as directly comparable enterprise values.
    diligencePath: Collect term sheets, preferred-stock capitalization schedules, and closing statements for each 2026 financing.
    relatedQuestionRefs:
      - QO004
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: policyholder-protection
    missingEvidence: >-
      Policy-level identification of the carrier, guaranty-fund status, AM Best status, and reinsurance protections for
      the intended customer.
    whyItMatters: >-
      The customer-facing producer may not be the risk-bearing entity, and protection differs between
      risk-retention-group and admitted-carrier paper.
    diligencePath: >-
      Inspect specimen and actual declarations pages, carrier licenses, regulatory filings, and reinsurance
      confirmations before binding.
    relatedQuestionRefs:
      - QO001
      - QO007
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map
    missingEvidence: Complete investor, board, carrier, reinsurer, and executive enumeration.
    whyItMatters: The partial public map cannot fully assess control, dilution, counterparty concentration, or governance.
    diligencePath: Request a current legal-entity chart, cap table, board roster, and material counterparty schedule.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing
    missingEvidence: >-
      A comparable, independently sourced U.S. startup commercial-insurance premium pool with a defined denominator and
      current geography.
    whyItMatters: >-
      Without a common denominator, reported customers and run rate cannot support TAM, SAM, SOM, or market-share
      conclusions.
    diligencePath: >-
      Obtain a current analyst, regulator, or trade-association dataset that separates startup technology commercial
      premiums from broader small-business and specialty lines.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: segmentation
    missingEvidence: Segment-level customer counts, premium, conversion, retention cohorts, and budget-owner mix by stage and vertical.
    whyItMatters: >-
      The adoption map is plausible but cannot show which buyer segment drives durable economics or whether adjacency
      demand is incremental.
    diligencePath: Request a cohort and segment pack covering direct, agent, startup-stage, and adjacent-vertical production.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM005
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: adoption-constraints
    missingEvidence: Audited underwriting, claims, loss-ratio, capital, reinsurance, and policy-level carrier data.
    whyItMatters: >-
      The risk-bearing structure and limited claims history can change buyer adoption and valuation even when quote
      speed is attractive.
    diligencePath: >-
      Review statutory filings, actuarial reports, reinsurance arrangements, claims triangles, and the exact
      underwriting entity for representative policies.
    relatedQuestionRefs:
      - QM006
      - QM008
  - type: conflicting-data
    severity: minor
    topic: geography
    missingEvidence: A reconciled state and jurisdiction licensing list.
    whyItMatters: >-
      Retained sources describe different licensing counts, so the serviceable U.S. footprint cannot be treated as
      precise.
    diligencePath: >-
      Reconcile the current producer, admitted-carrier, and risk-retention-group licensing records by state before
      sizing geographic expansion.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Comparable quote prices, realized premiums, discounts, and renewal pricing for Corgi and relevant alternatives.
    whyItMatters: A faster quote is not a durable advantage if customers pay more or competitors match the workflow.
    diligencePath: >-
      Obtain matched-limit quotes and renewal histories from Corgi, brokers, Next, and an admitted incumbent for
      representative startup profiles.
    relatedQuestionRefs:
      - QP008
      - QP009
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: Cohort retention, policy renewal, churn, CAC, and claims frequency by customer segment and product line.
    whyItMatters: These measures determine whether workflow familiarity becomes a moat or merely a convenient first purchase.
    diligencePath: >-
      Request cohort retention, renewal, and claims-performance schedules under confidentiality, segmented by startup
      stage and policy type.
    relatedQuestionRefs:
      - QP005
      - QP009
