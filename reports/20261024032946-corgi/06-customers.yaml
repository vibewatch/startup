chapter:
  number: 6
  title: Customers
  summary: Corgi's public evidence points to a focused early-stage technology-company customer base served through a fast, self-serve insurance workflow, with expansion into trucking and broker distribution in 2026. Adoption and speed claims are commercially encouraging, but retention, production deployment depth, customer concentration, and claims outcomes remain largely unaudited or undisclosed.
sections:
  - id: customer-segments
    title: Customer segments and buying motion
    body: >-
      Corgi is positioned first for venture-backed startups and technology companies, with coverage packaged by funding stage from pre-seed and seed through Series A and growth. The product is sold to a business buyer, but the workflow is designed around founders and operators who need insurance for fundraising, hiring, leases, and enterprise-contract requirements. Public descriptions also identify a broader 2026 appetite: trucking, property management, payroll, small business, and liquor-liability programs for eligible lodges. A direct online route is complemented by a broker channel, so Corgi is no longer only a founder self-service product. This creates a coherent initial segment but also raises a diligence question about whether the underwriting model transfers across materially different risks.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-proof
    title: Adoption trajectory and named proof
    body: >-
      The strongest public adoption signal is scale rather than independently verified deployment detail. Sacra reports over 40,000 active startup customers across 49 U.S. states and sub-1% churn, while other reviews repeat customer and ARR figures as company or analyst estimates. Those figures are not accompanied by a public denominator, cohort table, renewal schedule, premium volume, or audited customer ledger. Forbes identifies Deel as a startup customer and describes Corgi as providing insurance for startups such as Deel, which is stronger than an unqualified logo but does not establish policy size, duration, renewal, or outcome. The January 2026 Startup Program release describes a repeatable quote-to-bind workflow and certificate issuance, yet explicitly says not every applicant qualifies for instant quoting. Customer proof therefore supports product-market traction, not yet durable retention or claims performance.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: retention-expansion
    title: Durability, expansion, and concentration
    body: >-
      Corgi's expansion logic is visible in both product design and channel strategy: modular coverages can be adjusted as a startup grows, while the company is adding trucking and other verticals and enabling independent agents to submit applications, bind coverage, and issue certificates in one workspace. That can increase wallet share and lower acquisition friction, but the public record does not disclose net retention, gross retention, renewal rates, contract length, customer acquisition cost, or revenue concentration. Startup concentration is a structural exposure because a large share of the initial audience depends on venture formation and technology-sector spending. The trucking launch is an especially important test: it extends the proposition beyond the initial startup cohort, but the assigned evidence describes an expansion and pilot ambition rather than a mature book with published loss or retention outcomes.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
  - id: exhibits
    title: Buyer friction and diligence interpretation
    body: >-
      The exhibits distinguish customer segment claims, operating adoption signals, named proof, and expansion hypotheses. Values labelled company-reported, analyst-estimated, or reported by a publication should not be read as audited customer metrics. QuoteSweep identifies a further buyer-side diligence issue: policies primarily underwritten by Technology Risk Retention Group do not have a state guaranty-fund backstop, and the underwriting entity is not rated by AM Best. That does not establish financial weakness, but it may matter when a landlord, lender, or enterprise customer requires admitted, rated paper. Nulls and limitations are intentional because public sources do not establish customer-level premium contribution, cohort retention, policy renewal, claims satisfaction, or account concentration. The customer journey is an operating hypothesis, not a measured conversion funnel.
    claimRefs: [CU005, CU008, CU011, CU012, CU013]
