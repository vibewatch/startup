    title: Customer growth and adoption trajectory
    columns: [Metric, Value, Date / period, Source and confidence, Implication, Missing denominator]
    rows:
      - ["Active startup customers", "Over 40,000", "Reported for 2025 / 2026 profile", "Sacra; medium confidence, analyst estimate", "Indicates broad initial distribution among startups", "Active-account definition, paid-account share, and policy count"]
      - ["Reported churn", "Below 1%", "Reported for 2025 / 2026 profile", "Sacra; medium confidence, not independently audited", "Suggests potential durability if the denominator and period are verified", "Logo vs. policy churn, cohort window, cancellations and renewals"]
      - ["Quote workflow", "Instant quote where eligible; underwriting review otherwise", "January 2026 Startup Program launch", "PRNewswire company release; medium confidence, company-issued", "Supports a low-friction acquisition and binding motion", "Eligibility rate, conversion rate and time from quote to bind"]
      - ["Customer reference", "Deel named as a startup customer", "May 2026 Forbes report", "Forbes; high confidence that the article made the attribution", "Provides named-customer proof beyond an unqualified logo", "Policy scope, premium, renewal, outcomes and permission to reference"]
    notes: "Dates and values preserve the source framing; the table does not convert customer counts into revenue, ARR, retention, or market share."
    claimRefs: [CU005, CU006, CU007, CU008]
  - id: TU003
    title: Named customer proof table
    columns: [Customer / proof surface, Segment, Deployment or use case, Production vs pilot, Outcome, Limitation]
    enumerationScope:
      coverage: partial
      basis: "Publicly named customer and deployment references returned by the assigned 2026 search pool; not a complete customer enumeration"
    rows:
      - [Deel, "HR / payroll technology company", "Corgi provides insurance for startups such as Deel", "Production status is not specified in the article", "Named customer reference supports commercial relevance", "No policy line, term, premium, renewal or outcome disclosed"]
      - [Startup Program customers, "Technology startups needing core commercial lines", "Online intake, instant quote when eligible, coverage selection, bind and certificate access", "Operational workflow launched; individual customer deployments are not enumerated", "Repeatable path from intake to quote to bind", "No conversion, active-use, claims or satisfaction dataset"]
      - [Trucking operators, "Commercial trucking / fleet", "New trucking vertical with auto liability and per-load cargo", "Expansion / pilot-stage evidence rather than established cohort proof", "Tests whether startup-oriented AI quoting transfers to trucking", "No named operator, policy count, premium, loss or retention result"]
    notes: "This is a partial public-proof enumeration. A named customer reference is not treated as proof of renewal, production depth, outcome, or concentration."
    claimRefs: [CU003, CU007, CU008, CU012]
figures:
  - id: FU001
    title: Customer journey from founder need to expansion
    type: journey-map
    summary: "Corgi's public customer motion runs from a startup coverage trigger through self-service binding and possible modular or channel-led expansion."
    data:
      nodes:
        - id: need
          label: Coverage trigger
          detail: "Fundraising, hiring, lease, or enterprise contract creates an insurance requirement."
          touchpoints: ["Founder or operator identifies a required coverage line", "Buyer is the company; user is often the founder or finance lead"]
        - id: intake
          label: Digital intake
          detail: "Applicant answers a short set of startup and risk questions online."
          touchpoints: ["Company email or startup information", "Complex cases may route to human underwriting"]
        - id: quote
          label: Quote and selection
          detail: "Eligible applicants receive an instant quote and select coverages and limits."
          touchpoints: ["D&O, cyber, Tech E&O, EPLI and other modular lines", "Not every applicant qualifies for instant quoting"]
        - id: bind
          label: Bind and certificate
          detail: "Customer binds coverage and accesses policy documents and certificates."
          touchpoints: ["Same-day binding is described publicly", "Public sources do not disclose conversion or issuance rates"]
        - id: operate
          label: Manage and claim
          detail: "Customer manages policy needs through the dashboard and submits claims when required."
          touchpoints: ["Coverage can be adjusted as the company grows", "Claims outcomes and satisfaction are not publicly quantified"]
        - id: expand
          label: Expansion loop
          detail: "Growth-stage needs, new verticals, or broker referrals can create additional distribution and coverage surfaces."
          touchpoints: ["Stage-based additions and agent workspace", "Trucking expansion remains an unproven durability test"]
    approximationNotes: "Qualitative operating sequence only; no conversion rates, stage populations, or proportional values are inferred."
    claimRefs: [CU002, CU007, CU009, CU013]
