callouts:
  - calloutType: strength
    title: Full-stack carrier ambition is materially differentiated
    body: "Corgi combines a founder-focused digital buying flow with underwriting and policy operations rather than presenting only as a broker or software vendor."
    claimRefs: [CO002, CO004]
  - calloutType: risk
    title: Risk-bearing entity and claims evidence require primary diligence
    body: "The assigned evidence does not verify audited insurance performance, and QuoteSweep reports that the primary risk-retention-group structure may lack an AM Best rating and state guaranty-fund protection."
    claimRefs: [CO015, CO016, CO017]
  - calloutType: recommendation
    title: Treat rapid financing as a diligence catalyst, not proof of underwriting quality
    body: "The next diligence step is to reconcile financing documents, carrier identity, capital and reinsurance filings, and claims metrics before relying on the reported growth trajectory."
    claimRefs: [CO011, CO012, CO014, CO017]

