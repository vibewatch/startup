company:
  name: Corgi
chapter:
  number: 1
  title: Company Overview
  summary: Corgi is a 2024-founded San Francisco insurance company pursuing a vertically integrated, AI-native model for startup and technology coverage. Its 2026 financing and product expansion show unusually fast scaling, but the public record remains incomplete on audited financials, claims experience, and the capital structure of its risk-bearing entities.
sections:
  - id: identity-and-model
    title: Identity, product, and operating model
    body: >-
      Corgi is described by Y Combinator as a "full-stack insurance carrier" building
      products for startups, while its founder and executive profile identifies Nico
      Laqua as founder and CEO and Emily Yuan as founder and COO. The company’s public
      positioning is not simply a software layer: the model is to combine an online
      producer experience with underwriting, policy issuance, and claims operations.
      QuoteSweep’s independent profile adds an important structural qualification: the
      buyer-facing producer is not necessarily the entity carrying the risk, and the
      specific carrier appears in policy documents. This distinction matters for
      diligence because the customer relationship, regulated carrier, and claims
      counterparty may not be the same legal entity. The company’s initial focus is
      venture-backed startups and technology companies, with modular coverage spanning
      liability and management risks; 2026 reporting also describes expansion toward
      trucking and other verticals.
    claimRefs: [CO001, CO002, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      The named leadership team is compact and founder-led. Y Combinator lists Nico
      Laqua as founder and CEO/CTO and Emily Yuan as founder and COO, while The Next
      Web reports that Yuan previously worked as a product manager at OpenAI and that
      Laqua came from fintech and underwriting roles. That combination is directionally
      relevant to a regulated insurance build: product and operations leadership are
      paired with underwriting and commercial experience, but the public assigned
      sources do not provide a board roster, independent directors, committee
      structure, succession plan, or key-person mitigation. Forbes reports that Laqua
      described the company as needing financial strength as a financial institution,
      reinforcing that governance should be evaluated alongside startup velocity rather
      than inferred from the fundraising headline. The absence of a disclosed board
      structure is an evidence gap, not evidence that governance is weak.
    claimRefs: [CO005, CO006, CO008]
    tableRefs: [TO002]
  - id: financing-scale-and-milestones
    title: Financing, scale, and milestones
    body: >-
      Corgi’s financing record accelerated sharply during 2026. Insurtech Digital
      reports a combined seed and Series A total of $108 million and says annual
      recurring revenue surpassed $40 million after regulatory approval in July 2025.
      The Next Web reports a $160 million Series B at a $1.3 billion valuation on May
      7, 2026, while Forbes reports a further $106 million Series B1 at a $2.6 billion
      valuation on May 28, 2026. Inc later reports that Forbes put Corgi at a reported
      $4 billion valuation in July 2026, but notes that details of the more recent
      round were not disclosed. Sacra estimates $40 million of annual run rate in
      December 2025 and more than 40,000 active startup customers; those are analyst
      estimates, not audited company disclosures. The evidence therefore supports
      rapid financing and reported commercial traction, but not a verified total
      raised, profitability, loss ratio, or cash runway.
    claimRefs: [CO007, CO009, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: exhibits
    title: Evidence-based milestones and open diligence
    body: >-
      The milestone record is strongest for incorporation-era identity, regulatory
      approval, financing, and announced product expansion. It is weaker for operating
      outcomes: the assigned evidence does not establish audited revenue, retention
      cohorts, claims severity, loss ratios, combined ratios, reinsurance terms, or a
      complete investor and board register. QuoteSweep also reports that the primary
      underwriting entity is not AM Best rated and that policies issued by a risk
      retention group do not receive state guaranty-fund protection, claims that should
      be checked against the policy and carrier named for any prospective customer.
      These limitations make the company’s rapid growth investable as a diligence
      hypothesis rather than a fully verified operating conclusion.
    claimRefs: [CO015, CO016, CO017]

