      - number: '5.2'
        title: Architecture, operating model, and maturity
        blocks:
          - type: paragraph
            body: >-
              The architecture is best understood as an insurance operating workflow, not a disclosed software stack.
              Secondary sources describe intake of business data and documents, a proprietary risk engine, quote
              generation, policy administration, certificate issuance, API-oriented distribution, and claims triage with
              human escalation. Corgi-linked material describes AI support across underwriting, claims, and policy
              administration, while the retained TCV page expressly says its information was not independently verified.
              Together, these sources support the existence of a production-oriented workflow but not its implementation
              quality. No retained evidence discloses uptime, model validation, audit logs, override rates, security
              certification, incident history, or quantified automation. Product maturity is therefore commercially
              credible at the workflow level and technically under-disclosed.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE012
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE009
              - CE013
              - CE014
      - number: '5.3'
        title: Differentiation, controls, and expansion risk
        blocks:
          - type: paragraph
            body: >-
              Corgi's differentiation is structural: startup-focused distribution is combined with affiliated
              underwriting, carrier, and claims capabilities. That can reduce handoffs and make coverage changes or
              certificates easier to deliver, but the legal entity and paper behind each policy still matter. QuoteSweep
              reports that Corgi Insurance Services is a producer and program administrator, while risk may sit with
              Technology Risk Retention Group, an affiliated admitted carrier, or partner paper; it also flags that TRRG
              is not AM Best rated and its policies lack state guaranty-fund protection. Expansion into trucking tests a
              second dimension of the thesis because fleet risk, loss data, regulation, and claims operations differ
              from technology-startup liability. The assigned evidence does not establish whether Corgi's risk engine or
              controls transfer successfully to that vertical.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural product advantage
            body: >-
              Controlling more of intake, underwriting, policy administration, and claims can reduce handoffs and
              support a faster buying workflow if controls scale with volume.
            calloutType: strength
            claimRefs:
              - CE002
              - CE005
              - CE009
          - type: callout
            title: Technical evidence gap
            body: >-
              Public sources describe the workflow but do not verify model accuracy, reliability, security, or
              claims-performance outcomes.
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying motion
        blocks:
          - type: paragraph
            body: >-
              Corgi is positioned first for venture-backed startups and technology companies, with coverage packaged by
              funding stage from pre-seed and seed through Series A and growth. The product is sold to a business buyer,
              but the workflow is designed around founders and operators who need insurance for fundraising, hiring,
              leases, and enterprise-contract requirements. Public descriptions also identify a broader 2026 appetite:
              trucking, property management, payroll, small business, and liquor-liability programs for eligible lodges.
              A direct online route is complemented by a broker channel, so Corgi is no longer only a founder
              self-service product. This creates a coherent initial segment but also raises a diligence question about
              whether the underwriting model transfers across materially different risks.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU009
      - number: '6.2'
        title: Adoption trajectory and named proof
        blocks:
          - type: paragraph
            body: >-
              The strongest public adoption signal is scale rather than independently verified deployment detail. Sacra
              reports over 40,000 active startup customers across 49 U.S. states and sub-1% churn, while other reviews
              repeat customer and ARR figures as company or analyst estimates. Those figures are not accompanied by a
              public denominator, cohort table, renewal schedule, premium volume, or audited customer ledger. Forbes
              identifies Deel as a startup customer and describes Corgi as providing insurance for startups such as
              Deel, which is stronger than an unqualified logo but does not establish policy size, duration, renewal, or
              outcome. The January 2026 Startup Program release describes a repeatable quote-to-bind workflow and
              certificate issuance, yet explicitly says not every applicant qualifies for instant quoting. Customer
              proof therefore supports product-market traction, not yet durable retention or claims performance.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU007
              - CU009
              - CU013
      - number: '6.3'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Corgi's expansion logic is visible in both product design and channel strategy: modular coverages can be
              adjusted as a startup grows, while the company is adding trucking and other verticals and enabling
              independent agents to submit applications, bind coverage, and issue certificates in one workspace. That
              can increase wallet share and lower acquisition friction, but the public record does not disclose net
              retention, gross retention, renewal rates, contract length, customer acquisition cost, or revenue
              concentration. Startup concentration is a structural exposure because a large share of the initial
              audience depends on venture formation and technology-sector spending. The trucking launch is an especially
              important test: it extends the proposition beyond the initial startup cohort, but the assigned evidence
              describes an expansion and pilot ambition rather than a mature book with published loss or retention
              outcomes.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU007
              - CU008
              - CU012
      - number: '6.4'
        title: Buyer friction and diligence interpretation
        blocks:
          - type: paragraph
            body: >-
              The exhibits distinguish customer segment claims, operating adoption signals, named proof, and expansion
              hypotheses. Values labelled company-reported, analyst-estimated, or reported by a publication should not
              be read as audited customer metrics. QuoteSweep identifies a further buyer-side diligence issue: policies
              primarily underwritten by Technology Risk Retention Group do not have a state guaranty-fund backstop, and
              the underwriting entity is not rated by AM Best. That does not establish financial weakness, but it may
              matter when a landlord, lender, or enterprise customer requires admitted, rated paper. Nulls and
              limitations are intentional because public sources do not establish customer-level premium contribution,
              cohort retention, policy renewal, claims satisfaction, or account concentration. The customer journey is
              an operating hypothesis, not a measured conversion funnel.
            claimRefs:
              - CU005
              - CU008
              - CU011
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk assessment
        blocks:
          - type: paragraph
            body: >-
              Corgi controls more of the underwriting and claims workflow than a conventional broker, but that
              integration also concentrates operational and balance-sheet responsibility inside a young insurance group.
              Independent and industry-facing profiles identify reinsurance dependency and dependence on venture-backed
              startup formation as material exposures, while Corgi's own structure includes a risk retention group, an
              admitted carrier, a producer, and claims operations. The strongest public evidence therefore supports a
              high residual-risk posture rather than a conclusion that the model is unsafe. The most decision-relevant
              missing evidence is quantitative: no retained source supplies audited financial statements, loss ratio,
              combined ratio, reserve development, claims severity, reinsurance attachment points, or capital adequacy.
              Those omissions make reported growth and speed poor substitutes for proof of underwriting resilience.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
              - CR007
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR009
              - CR013
      - number: '7.2'
        title: Legal, regulatory, and policyholder protection
        blocks:
          - type: paragraph
            body: >-
              Corgi's regulatory risk is not simply whether it holds a license. The entity named on a policy determines
              the applicable regulatory perimeter, insolvency backstop, and independent financial-strength signal.
              QuoteSweep reports that Corgi Insurance Services is a licensed producer and program administrator, while
              Technology Risk Retention Group is the primary underwriting entity; the same profile says Corgi Insurance
              Company is an admitted carrier and that some risks use A-rated partner carriers. It also quotes Corgi's
              disclosure that state insolvency guaranty funds are unavailable for risk-retention-group policies.
              California's insurance department provides a license-status search service, but the assigned evidence does
              not verify Corgi's individual license record. The diligence conclusion is consequently conditional: verify
              the carrier and jurisdiction on each declarations page, licensing footprint, rating, and guaranty-fund
              treatment before relying on coverage.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Operating, technology, partner, and expansion risk
        blocks:
          - type: paragraph
            body: >-
              Corgi's speed depends on automated underwriting, policy administration, and claims workflows that process
              heterogeneous risk information. SiliconANGLE reports that Corgi analyzes thousands of company and risk
              data points, typically binds policies the same day, and is expanding from startups into trucking, payroll,
              and small business. Insurance Business describes the admitted-carrier launch as targeting materially
              different classes such as salons, restaurants, self-storage, and residential rental properties, and
              explicitly notes that whether startup-oriented technology transfers to businesses with less digital data
              remains an open question. The operational risk is therefore model transfer and control quality, not merely
              software uptime. Expansion also increases dependency on licensing, reinsurance, distribution partners, and
              the quality of human escalation for complex cases. Public sources do not provide incident, outage,
              model-validation, vendor-concentration, or claims-performance data.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Monitoring, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The available mitigations are structural rather than quantitatively demonstrated: Corgi says it owns core
              underwriting and claims workflows; its group includes an admitted carrier for some business; and it can
              route complex cases to human underwriters or adjusters. These controls should be tested against measurable
              thresholds. A thesis break would be a regulator restricting a material product or jurisdiction, a policy
              being issued by an unrated risk-bearing entity when an admitted rated carrier is required, a deterioration
              in loss or reserve metrics, a material reinsurance-capacity reduction, a confirmed security or
              claims-processing incident, or an expansion vertical lacking validated underwriting performance. Until
              Corgi discloses the relevant denominators and trend data, the prudent stance is to treat growth, customer
              counts, and quoted speed as company or third-party reported indicators rather than evidence of profitable
              or durable risk selection.
            claimRefs:
              - CR013
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-priority diligence gap
            body: >-
              Obtain policy-level carrier identity, AM Best or equivalent rating evidence, guaranty-fund treatment,
              audited financials, statutory capital, reinsurance structure, loss ratio, combined ratio, reserve
              development, and claims cohorts before underwriting Corgi's reported growth as durable.
            calloutType: risk
            claimRefs:
              - CR006
              - CR013
              - CR014
          - type: callout
            title: Practical control
            body: >-
              Require a declarations-page review and state-by-state licensing confirmation for every new product or
              vertical, with an explicit escalation path for risks outside automated binding limits.
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR009
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investment case is a potentially differentiated insurance operating system rather than a thin
              distribution layer. Corgi describes a full-stack model spanning underwriting, claims, and policy
              operations, while Sacra reports a browser-based workflow that can produce pricing in about 30 seconds and
              issue certificates immediately. Forbes reports that existing investors sought a follow-on round, and the
              January financing release says ARR surpassed $40 million after July 2025 carrier approval. Those signals
              support product velocity and investor appetite, but they remain largely company-reported or
              secondary-source observations rather than audited underwriting evidence. The anti-thesis is that a young
              carrier can grow written premium or reported run rate faster than it can prove durable loss ratios,
              reinsurance resilience, and regulatory capital discipline. The valuation call must therefore separate
              distribution traction from risk-adjusted earnings power.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV015
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Corgi's financing sequence is unusually compressed. Forbes reports a $160 million Series B at a $1.3
              billion valuation followed by a $106 million Series B1 at $2.6 billion, while Inc. reports a later
              reported $4 billion valuation but says the round's amount and investors were not disclosed. These are
              private marks, not public-market prices, and the sources do not disclose preferred rights, liquidation
              preferences, option-pool treatment, secondary liquidity, or dilution. The January release reports $108
              million of combined seed and Series A funding, while later secondary summaries report more than $378
              million raised. Because the capital raised is not cash available to common shareholders and no audited
              revenue, margin, or loss data is public, a precise multiple is not supportable. Entry discipline should
              require current cap-table terms, fully diluted share count, policy-level economics, and a valuation bridge
              from the latest priced round.
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.3'
        title: Scenarios, comparables, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more defensible than a single target price because the public record contains a
              reported $40 million ARR or run-rate figure, a $45 million run-rate reference, and a $450 million end-2026
              target without a consistent audited denominator. The bull case requires conversion of product speed into
              profitable, diversified underwriting while maintaining capital access and reinsurance. The base case
              assumes continued demand but slower valuation growth as investors test carrier economics. The bear case
              assumes loss volatility, funding-market compression, or a regulatory and counterparty event exposes the
              difference between an affiliated risk-retention group and an admitted, rated carrier. Publicly described
              comparables are directional only: Sacra contrasts vertically integrated carriers with brokers and
              incumbents but does not provide a transaction set or normalized multiples. Diligence should use
              model-appropriate insurance metrics, not software revenue multiples alone.
            claimRefs:
              - CV002
              - CV004
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV012
              - CV016
      - number: '8.4'
        title: Recommendation and final diligence
        blocks:
          - type: paragraph
            body: >-
              The recommendation is track rather than buy. Corgi has evidence of customer-facing product velocity,
              multiple financings, and a strategic opportunity in startup insurance, but the public evidence does not
              establish that the $2.6 billion or reported $4 billion marks are supported by sustainable risk-adjusted
              earnings. The next decision gate should be evidence-led: obtain audited financial statements, statutory
              filings, loss and combined ratios, reserve development, reinsurance treaties, TRRG capital and
              guaranty-fund exposure, policy retention, customer concentration, and the complete preferred-security
              stack. A price change could move the call: a materially lower entry price, transparent terms, and
              independently verified profitable growth would improve the stance; a down round, adverse reserve
              development, inability to secure reinsurance, or regulatory limitation would be thesis-break events. Exit
              readiness is not demonstrated by private valuation alone, and no public evidence establishes a near-term
              IPO or strategic sale path.
            claimRefs:
              - CV005
              - CV006
              - CV012
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, do not buy at the reported mark
            body: >-
              Corgi has credible traction signals, but public evidence does not support a risk-adjusted valuation
              conclusion at $2.6B or the later reported $4B mark.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV012
              - CV016
          - type: callout
            title: Carrier economics are the gating evidence
            body: >-
              The underwriting entity, capital position, reinsurance, reserve development and claims experience matter
              more than headline funding totals.
            calloutType: risk
            claimRefs:
              - CV005
              - CV006
              - CV015
          - type: callout
            title: Scenario outputs are deliberately non-numeric
            body: >-
              A numeric target return would invent precision because public sources do not disclose a consistent audited
              denominator, security terms or loss history.
            calloutType: assumption
            claimRefs:
              - CV012
              - CV013
              - CV014
