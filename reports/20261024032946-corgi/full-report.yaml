  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              Corgi's relevant market is commercial insurance for venture-backed startups and technology companies,
              initially sold through a self-serve, direct digital workflow. The included spend is the premium paid for
              startup-relevant lines such as general liability, cyber, technology errors and omissions, directors and
              officers, employment practices, fiduciary, media, and AI liability coverage. The market excludes personal
              lines, pet insurance, and unrelated home-cover brands, as well as general small-business insurance that
              Corgi has not yet demonstrated at scale. The status quo is a broker-mediated process in which a founder
              explains the risk, waits for carrier quotes, negotiates terms, and receives a certificate later. Corgi's
              direct workflow targets that time and handoff cost, but assigned evidence describes a producer and
              affiliated risk-bearing entities rather than one carrier. A broker remains a substitute when a buyer needs
              unusual risks or access to multiple carriers. One low-tier source instead characterizes Corgi as an
              embedded-insurance middleware layer, a conflict that prevents broadening the market boundary on that
              basis.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM010
              - CM016
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a bottom-up operating footprint, not a single reliable TAM/SAM/SOM chain. Sacra
              reports more than 40,000 active startup customers across 49 U.S. states and estimates approximately $40
              million of annual run rate in December 2025; its estimate is an analyst view and is not audited. The same
              source describes a further international opportunity of approximately 25,000 to 30,000 venture-backed
              companies, but this is an estimate rather than a measured serviceable market. Corgi's own expansion
              signals include trucking, property management, small business, and agent distribution, while coverage
              across 49 states leaves a stated geographic gap. These lenses show expansion vectors, but they do not
              establish premium volume, conversion, share, or a defensible dollar TAM.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
