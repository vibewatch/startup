              - CO015
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              The named leadership team is compact and founder-led. Y Combinator lists Nico Laqua as founder and CEO/CTO
              and Emily Yuan as founder and COO, while The Next Web reports that Yuan previously worked as a product
              manager at OpenAI and that Laqua came from fintech and underwriting roles. That combination is
              directionally relevant to a regulated insurance build: product and operations leadership are paired with
              underwriting and commercial experience, but the public assigned sources do not provide a board roster,
              independent directors, committee structure, succession plan, or key-person mitigation. Forbes reports that
              Laqua described the company as needing financial strength as a financial institution, reinforcing that
              governance should be evaluated alongside startup velocity rather than inferred from the fundraising
              headline. The absence of a disclosed board structure is an evidence gap, not evidence that governance is
              weak.
            claimRefs:
              - CO005
              - CO006
              - CO008
