  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Corgi's reported product workflow spans digital intake, risk decisioning, policy administration, claims
      operations, regulated entities, and integration surfaces.
    data:
      layers:
        - label: Customer experience
          detail: Digital application and coverage-selection surfaces.
          items:
            - label: Application
              detail: Applicant submits company information and risk materials.
            - label: Coverage selection
              detail: Startup-oriented liability modules and stage-based packages are described.
        - label: Decisioning
          detail: Automated and human underwriting pathways.
          items:
            - label: Risk analysis and quote
              detail: A proprietary engine is reported to generate rapid pricing.
            - label: Human review
              detail: Complex cases are reported to route to human underwriters.
        - label: Policy operations
          detail: Binding, policy administration, and certificate generation.
          items:
            - label: Policy administration
              detail: Policy records and certificate delivery are part of the described workflow.
        - label: Claims operations
          detail: Loss intake, document requests, classification, and escalation.
          items:
            - label: Claims triage
              detail: Automated triage and human-adjuster escalation are reported.
        - label: Regulated infrastructure
          detail: Producer, risk-bearing, admitted-carrier, and partner-paper dependencies.
          items:
            - label: Legal entities and paper
              detail: The entity carrying risk may vary by policy and jurisdiction.
        - label: Integration and controls
          detail: Partner data exchange and assurance requirements.
          items:
            - label: API distribution
              detail: Analyst material describes API-oriented distribution and GraphQL policy metadata.
            - label: Assurance evidence
              detail: Security, validation, reliability, and claims-quality evidence remain diligence requests.
    approximationNotes: Workflow-level synthesis only; no implementation metric, performance rate, or control effectiveness is inferred.
    claimRefs:
      - CE002
      - CE005
      - CE006
      - CE007
      - CE014
  - id: FU001
    title: Customer journey from founder need to expansion
    type: journey-map
    summary: >-
      Corgi's public customer motion runs from a startup coverage trigger through self-service binding and possible
      modular or channel-led expansion.
    data:
      nodes:
        - id: need
          label: Coverage trigger
          detail: Fundraising, hiring, lease, or enterprise contract creates an insurance requirement.
          touchpoints:
            - Founder or operator identifies a required coverage line
            - Buyer is the company; user is often the founder or finance lead
        - id: intake
          label: Digital intake
          detail: Applicant answers a short set of startup and risk questions online.
          touchpoints:
            - Company email or startup information
            - Complex cases may route to human underwriting
        - id: quote
          label: Quote and selection
          detail: Eligible applicants receive an instant quote and select coverages and limits.
          touchpoints:
            - D&O, cyber, Tech E&O, EPLI and other modular lines
            - Not every applicant qualifies for instant quoting
        - id: bind
          label: Bind and certificate
          detail: Customer binds coverage and accesses policy documents and certificates.
          touchpoints:
            - Same-day binding is described publicly
            - Public sources do not disclose conversion or issuance rates
        - id: operate
          label: Manage and claim
          detail: Customer manages policy needs through the dashboard and submits claims when required.
          touchpoints:
            - Coverage can be adjusted as the company grows
            - Claims outcomes and satisfaction are not publicly quantified
        - id: expand
          label: Expansion loop
          detail: >-
            Growth-stage needs, new verticals, or broker referrals can create additional distribution and coverage
            surfaces.
          touchpoints:
            - Stage-based additions and agent workspace
            - Trucking expansion remains an unproven durability test
    approximationNotes: Qualitative operating sequence only; no conversion rates, stage populations, or proportional values are inferred.
    claimRefs:
      - CU002
      - CU007
      - CU009
      - CU013
