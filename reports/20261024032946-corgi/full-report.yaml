  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Premium collection and embedded distribution feed underwriting economics, with claims and capital requirements
      determining realized carrier returns.
    data:
      nodes:
        - id: customer-application
          label: Customer application
          detail: Startup or trucking operator supplies risk and operating information.
        - id: risk-pricing
          label: Risk pricing
          detail: Automated pricing and human review for complex cases.
        - id: policy-premium
          label: Policy premium
          detail: Annual or per-load coverage creates premium revenue; realized price is undisclosed.
        - id: float
          label: Invested float
          detail: Premiums may generate investment income before claims are paid.
        - id: claims-reserves
          label: Claims and reserves
          detail: Losses, reserves, and reinsurance determine underwriting outcome.
        - id: carrier-return
