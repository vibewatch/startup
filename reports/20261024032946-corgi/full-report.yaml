        title: Financing, scale, and milestones
        blocks:
          - type: paragraph
            body: >-
              Corgi’s financing record accelerated sharply during 2026. Insurtech Digital reports a combined seed and
              Series A total of $108 million and says annual recurring revenue surpassed $40 million after regulatory
              approval in July 2025. The Next Web reports a $160 million Series B at a $1.3 billion valuation on May 7,
