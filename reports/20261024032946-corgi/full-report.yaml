chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating model
        blocks:
          - type: paragraph
            body: >-
              Corgi is described by Y Combinator as a "full-stack insurance carrier" building products for startups,
              while its founder and executive profile identifies Nico Laqua as founder and CEO and Emily Yuan as founder
              and COO. The company’s public positioning is not simply a software layer: the model is to combine an
              online producer experience with underwriting, policy issuance, and claims operations. QuoteSweep’s
              independent profile adds an important structural qualification: the buyer-facing producer is not
              necessarily the entity carrying the risk, and the specific carrier appears in policy documents. This
              distinction matters for diligence because the customer relationship, regulated carrier, and claims
              counterparty may not be the same legal entity. The company’s initial focus is venture-backed startups and
              technology companies, with modular coverage spanning liability and management risks; 2026 reporting also
              describes expansion toward trucking and other verticals.
            claimRefs:
              - CO001
              - CO002
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO007
