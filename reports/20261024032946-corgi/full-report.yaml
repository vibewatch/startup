      - number: '2.3'
        title: Buyer, user, and payer map
        blocks:
          - type: paragraph
            body: >-
              The initial buyer is usually a founder, operator, or finance/legal owner at a venture-backed startup; the
              user is the person completing the application and managing certificates and policy changes; and the payer
              is the company. The adoption trigger is often operational rather than discretionary: an enterprise
              customer, landlord, investor, or hiring milestone requires proof of insurance. Corgi's stage-based
              packages align coverage with company maturity, while instant quoting and certificate issuance reduce the
              time cost of the purchase. A second route is an independent agent using Corgi's workspace. Later-stage or
              complex-risk buyers may instead choose a broker because broader carrier access can outweigh speed. Budget
              ownership therefore shifts from founder-led general spend toward finance, legal, risk, or procurement as
              limits and policy complexity increase.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Adoption drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption driver is workflow compression: independent reviews describe applications completed
              in minutes and same-day coverage, which is valuable when insurance is a gating item for a commercial
              contract. A second driver is product specificity, including AI liability and modular coverage for
              technology companies. Agent distribution could add partner-led demand beyond direct founder acquisition.
              Constraints are material. QuoteSweep reports that the primary risk-bearing entity is an unrated risk
              retention group and that state guaranty funds are unavailable for policies issued by that entity; the
              source also notes inconsistent public licensing counts. Corgi's startup concentration exposes demand to
              venture-funding cycles, while international availability and complex later-stage coverage remain limited.
              The valuation implication is a tradeoff between faster distribution and retention potential versus
              concentration, regulatory, capital, and claims-history risk.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The investable market question is retention, not headline TAM
            body: >-
              Corgi has a clear initial wedge and multiple adjacency signals, but public evidence does not isolate
              premium volume, segment conversion, or loss-adjusted economics. Diligence should test whether fast startup
              acquisition persists through later-stage complexity and whether adjacent verticals can scale without
              weakening underwriting discipline.
            calloutType: insight
            claimRefs:
              - CM004
              - CM007
              - CM014
              - CM015
          - type: callout
            title: Coverage paper and concentration constrain adoption
            body: >-
              A buyer's willingness to switch depends on the exact underwriting entity, ratings, guaranty-fund
              treatment, state availability, and claims record. Startup concentration also makes demand sensitive to
              venture funding cycles, so customer growth should not be treated as a durable market proxy without cohort
              and retention evidence.
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and strategic position
        blocks:
          - type: paragraph
            body: >-
              Corgi's alternatives span digital small-business insurers, startup-focused hybrid platforms, brokers,
              traditional commercial carriers, broker-assisted placement, and internal risk administration. Corgi
              describes itself as a direct carrier, while QuoteSweep describes a group structure in which a producer,
              affiliated risk-bearing entities, and partner carriers perform different functions. That makes the
              customer workflow more integrated than a conventional broker without establishing that one Corgi entity
              carries every policy. NEXT Insurance is the clearest scaled benchmark in the assigned evidence: ERGO and
              TechCrunch report $548 million of 2024 top line, more than 600,000 customers, and roughly 700 employees.
              Vouch and Embroker address the same startup buying job through hybrid or broker models, while Panta is an
              adjacent AI-native brokerage. The comparison favors Corgi on specialization and speed, but favors scaled
              carriers on operating history and balance-sheet resources.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP015
              - CP016
          - type: table
            tableRef: TP001
