        title: Evidence-based milestones and open diligence
        blocks:
          - type: paragraph
            body: >-
              The milestone record is strongest for incorporation-era identity, regulatory approval, financing, and
              announced product expansion. It is weaker for operating outcomes: the assigned evidence does not establish
              audited revenue, retention cohorts, claims severity, loss ratios, combined ratios, reinsurance terms, or a
