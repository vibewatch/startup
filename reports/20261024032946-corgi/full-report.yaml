  - id: FP001
    title: Competitive positioning by speed and carrier-control model
    type: quadrant
    summary: >-
      Evidence-backed ordinal positioning places Corgi high on workflow speed and carrier-stack control, while noting
      that positions are analytical assessments rather than measured benchmarks.
    data:
      xAxis:
        label: Workflow speed and self-service
        min: 1
        max: 5
        low: Slower or broker-mediated
        high: Faster self-service
        scale: Evidence-backed ordinal assessment, not a measured benchmark
      yAxis:
        label: Control of underwriting and policy stack
        min: 1
        max: 5
        low: External carrier placement
        high: Direct risk-bearing control
        scale: Evidence-backed ordinal assessment, not a measured benchmark
      points:
        - label: Corgi
          x: 5
          'y': 4
          note: Sources support quotes in minutes and an integrated group; legal entities vary by policy
        - label: NEXT
          x: 4
          'y': 5
          note: Digital automated underwriting with direct insurer control and scaled incumbent ownership
        - label: Vouch
          x: 3
          'y': 2
          note: Hybrid direct-underwriting and broker-placement model; exact speed is unmeasured
        - label: Embroker
          x: 3
          'y': 1
          note: Digital broker model provides carrier choice without direct risk-bearing control
        - label: Panta
          x: 3
          'y': 1
          note: AI-native brokerage places complex risks across carriers; exact speed is unmeasured
        - label: Traditional admitted carrier
          x: 1
          'y': 5
          note: Direct carrier control and admitted paper, with slower workflows described qualitatively
    approximationNotes: >-
      Coordinates are 1-5 ordinal judgments from the retained structural evidence; they are not measured speed, quality,
      or financial-strength scores.
