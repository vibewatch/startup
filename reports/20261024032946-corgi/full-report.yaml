  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Corgi's product is commercial insurance for startups and technology companies, with a digital workflow
              intended to shorten the path from application to coverage. Public descriptions combine rapid intake,
              modular coverage selection, automated pricing, digital binding for eligible risks, and policy-certificate
              delivery. The coverage menu includes core startup needs such as general liability, directors and officers,
              technology errors and omissions, cyber, fiduciary, hired and non-owned auto, and AI liability. The
              evidence supports a digitally distributed insurance product and a vertically integrated group, rather than
              a conventional broker-only model. It does not prove that every submission is automated, that quoted speed
              applies to complex risks, or that policy terms are superior to incumbent alternatives.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
