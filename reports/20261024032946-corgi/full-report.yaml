              - CP004
              - CP005
              - CP015
              - CP016
      - number: '3.2'
        title: Capability, product, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              Corgi's buying proposition is speed and modularity: assigned sources describe quotes in minutes, same-day
              binding, stage-based packages, and startup-focused coverage. The AI liability product adds a wedge for
              companies exposed to model, data, synthetic-media, or autonomous-system risks, but the independent product
              description says it requires an existing Tech E&O policy rather than standing alone. A broker can counter
              with carrier choice, while an admitted carrier can offer rated paper and state guaranty-fund protection.
              The assigned evidence does not disclose comparable realized premiums, discounts, renewals, loss ratios, or
              claims outcomes, so the pricing table preserves unknowns rather than converting list-positioning language
              into price claims. Corgi appears strongest when a buyer values self-service and an integrated workflow;
              its advantage is less certain when a contract requires admitted, rated paper or specialized placement.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP012
              - CP013
              - CP015
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP012
              - CP013
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP012
              - CP013
              - CP015
              - CP016
      - number: '3.3'
        title: Switching costs, distribution power, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Corgi's potential moat is workflow and data accumulation rather than a visibly exclusive distribution
              asset. A self-serve application, automated risk assessment, policy records, and dashboard claims handling
              can lower friction and create process familiarity, but the assigned evidence does not quantify cohort
              retention, realized acquisition cost, or underwriting performance. Reported expansion into trucking, small
              business, and sports may widen the addressable market, yet it also increases the need for domain-specific
              underwriting evidence. Munich Re and ERGO's acquisition of NEXT shows that a technology-first insurer can
              become strategically valuable to a large incumbent; it also demonstrates that incumbents can buy digital
              capabilities and add capital, distribution, and insurance expertise. Corgi's moat therefore depends on
              superior risk selection and renewal economics, not on front-end speed alone.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP006
              - CP010
              - CP015
              - CP016
      - number: '3.4'
        title: Displacement and commoditization risks
        blocks:
          - type: paragraph
            body: >-
              The strongest adverse evidence is structural. QuoteSweep reports that Corgi's primary risk-retention-group
              underwriting entity is not AM Best rated and that state insolvency guaranty funds are unavailable for
              policies it issues. Those are buyer-level trust tradeoffs, although absence of a rating is not evidence of
              weak financial condition. AI-liability pricing also faces immature actuarial data, and the product's
              dependence on an underlying Tech E&O policy limits its standalone reach. At the other end of the market,
              NEXT's 2024 scale and Munich Re ownership show how a scaled incumbent can combine digital underwriting
              with balance-sheet resources. Corgi's differentiation is durable only if speed, startup-specific data, and
              product iteration produce better loss selection, renewal economics, and claims outcomes; none of those
              outcomes is established by the assigned public evidence.
            claimRefs:
              - CP007
              - CP008
              - CP010
              - CP012
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The defensible wedge is operational, not merely “AI”
            body: >-
              Corgi's clearest differentiation is the combination of startup-specific underwriting, direct workflow, and
              modular policy administration. AI branding alone is less defensible because incumbents can add automation
              or acquire technology-first peers.
            calloutType: insight
            claimRefs:
              - CP006
              - CP009
              - CP010
              - CP011
          - type: callout
            title: Buyer trust depends on the policy entity
            body: >-
              Policy-level diligence should identify the actual underwriting entity, whether it is rated, and whether
              state guaranty-fund protection applies; these terms can matter more to a buyer than the front-end quote
              experience.
            calloutType: risk
            claimRefs:
              - CP012
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Corgi's monetization is insurance-premium based rather than software subscription based. Sacra describes
              annual policies with premiums collected upfront, while also describing investment returns on float; that
              structure makes written premium, earned premium, loss ratio, and investment income economically distinct
              measures. Public descriptions also indicate modular coverage across general liability, cyber, technology
              and AI errors and omissions, directors and officers, employment practices, media, fiduciary, and related
              lines. QuoteSweep describes a producer/program-administrator entity, affiliated risk-bearing entities, and
              partner carriers, so the policy-level carrier and allocation of premium must be checked before treating
              reported revenue as carrier economics. Official and independent sources support fast quoting and same-day
              binding, but they do not disclose realized pricing, discounting, commission expense, or renewal cohorts.
              The revenue-stream table therefore separates public operating descriptions from underwriting metrics that
              remain unavailable.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI015
              - CI016
      - number: '4.2'
        title: Traction, pricing, and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Public traction is strong but unevenly verified. Sacra estimates $40 million of annual run rate in
              December 2025, more than 40,000 active startup customers, sub-1% churn, and approximately $1,000 of annual
              revenue per customer; Icon Polls reports similar $40 million ARR and customer claims, while explicitly
              presenting a review rather than audited financial statements. These figures are not interchangeable with
              audited revenue, gross profit, or cash receipts, and the customer denominator and policy mix are not
              disclosed. The product workflow provides a useful efficiency proxy: Sacra says pricing can be generated
              within 30 seconds and complex cases route to human underwriters, while TruckNews reports that trucking
              policies are often issued the same day. No source provides CAC, payback, conversion, renewal expansion,
              loss ratio, or gross margin. The underwriting ask is to reconcile customer counts, policy count, written
              and earned premium, and retention by cohort and product.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI002
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
      - number: '4.3'
        title: Capital adequacy and financial underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              Corgi's financing has accelerated alongside vertical expansion, but financing raised is not cash available
              for claims or operating runway. The Next Web reports a $160 million Series B at a $1.3 billion valuation
              in May 2026; Forbes reports a later $106 million round at a $2.6 billion valuation, and Inc reports a
              further reported $4 billion valuation while noting that details were unavailable. These are financing and
              valuation markers, not evidence of solvency or profitability. QuoteSweep's review says the primary
              underwriting entity is Technology Risk Retention Group, that it is not AM Best rated, and that state
              insolvency guaranty funds are unavailable for policies issued by an RRG. Sacra identifies reinsurance
              dependency as a profitability and growth risk. Insurance practitioner Fabio Faschi warns that early
              combined ratios in a fast-growing book can conceal selection problems and that scaled loss performance
              will take years to observe. The central diligence blocker is a current entity-level capital and liquidity
              package: cash and restricted cash, burn, runway, statutory surplus, reinsurance attachment and limits,
              reserve development, loss and combined ratios, debt, and planned use of financing.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              Corgi has a credible monetization engine and visible demand signals, but the public record does not yet
              support underwriting carrier economics. Reported run rate and customer metrics indicate commercial
              traction; they do not establish realized premium quality, retention profitability, margin, or cash
              generation. The full-stack and embedded-distribution model may improve quote speed and acquisition
              efficiency, but it also leaves Corgi exposed to claims volatility, reinsurance pricing, regulatory capital
              requirements, and startup-cycle concentration. The trucking launch expands the addressable premium pool
              but has no disclosed loss history, so it should be treated as an unproven underwriting vertical. A prudent
              financial stance is track/research-more until management supplies audited or regulator-reconciled
              financials, policy-level economics, and capital adequacy evidence.
            claimRefs:
              - CI006
              - CI010
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Demand and distribution signal
            body: >-
              Reported customer and run-rate metrics, plus sub-minute pricing and same-day binding claims, indicate a
              potentially efficient acquisition and servicing model, subject to reconciliation against policy and
              premium records.
            calloutType: strength
            claimRefs:
              - CI006
              - CI007
              - CI008
