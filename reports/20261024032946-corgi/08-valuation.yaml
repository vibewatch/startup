callouts:
  - calloutType: recommendation
    title: Track, do not buy at the reported mark
    body: "Corgi has credible traction signals, but public evidence does not support a risk-adjusted valuation conclusion at $2.6B or the later reported $4B mark."
    claimRefs: [CV003, CV012, CV016]
  - calloutType: risk
    title: Carrier economics are the gating evidence
    body: "The underwriting entity, capital position, reinsurance, reserve development and claims experience matter more than headline funding totals."
    claimRefs: [CV005, CV006, CV015]
  - calloutType: assumption
    title: Scenario outputs are deliberately non-numeric
    body: "A numeric target return would invent precision because public sources do not disclose a consistent audited denominator, security terms or loss history."
    claimRefs: [CV012, CV013, CV014]
