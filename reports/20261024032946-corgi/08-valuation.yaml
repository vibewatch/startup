runDate: 2026-10-24
company:
  name: Corgi
chapter:
  number: 8
  title: Valuation
  summary: Corgi has paired rapid reported premium or revenue growth with successive private financings, but public evidence does not establish audited carrier profitability, loss performance, capital adequacy, or the terms behind the latest valuation. The evidence therefore supports tracking the company and demanding price, capitalization, and underwriting diligence before committing capital.
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      The investment case is a potentially differentiated insurance operating system rather than a thin distribution layer. Corgi describes a full-stack model spanning underwriting, claims, and policy operations, while Sacra reports a browser-based workflow that can produce pricing in about 30 seconds and issue certificates immediately. Forbes reports that existing investors sought a follow-on round, and the January financing release says ARR surpassed $40 million after July 2025 carrier approval. Those signals support product velocity and investor appetite, but they remain largely company-reported or secondary-source observations rather than audited underwriting evidence. The anti-thesis is that a young carrier can grow written premium or reported run rate faster than it can prove durable loss ratios, reinsurance resilience, and regulatory capital discipline. The valuation call must therefore separate distribution traction from risk-adjusted earnings power.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006]
    tableRefs: [TV001, TV002]
  - id: price-and-financing
    title: Financing context and entry discipline
    body: >-
      Corgi's financing sequence is unusually compressed. Forbes reports a $160 million Series B at a $1.3 billion valuation followed by a $106 million Series B1 at $2.6 billion, while Inc. reports a later reported $4 billion valuation but says the round's amount and investors were not disclosed. These are private marks, not public-market prices, and the sources do not disclose preferred rights, liquidation preferences, option-pool treatment, secondary liquidity, or dilution. The January release reports $108 million of combined seed and Series A funding, while later secondary summaries report more than $378 million raised. Because the capital raised is not cash available to common shareholders and no audited revenue, margin, or loss data is public, a precise multiple is not supportable. Entry discipline should require current cap-table terms, fully diluted share count, policy-level economics, and a valuation bridge from the latest priced round.
    claimRefs: [CV003, CV007, CV008, CV009, CV010, CV011]
    tableRefs: [TV003]
  - id: scenarios-and-triggers
    title: Scenarios, comparables, and thesis-break triggers
    body: >-
      A scenario framework is more defensible than a single target price because the public record contains a reported $40 million ARR or run-rate figure, a $45 million run-rate reference, and a $450 million end-2026 target without a consistent audited denominator. The bull case requires conversion of product speed into profitable, diversified underwriting while maintaining capital access and reinsurance. The base case assumes continued demand but slower valuation growth as investors test carrier economics. The bear case assumes loss volatility, funding-market compression, or a regulatory and counterparty event exposes the difference between an affiliated risk-retention group and an admitted, rated carrier. Publicly described comparables are directional only: Sacra contrasts vertically integrated carriers with brokers and incumbents but does not provide a transaction set or normalized multiples. Diligence should use model-appropriate insurance metrics, not software revenue multiples alone.
    claimRefs: [CV002, CV004, CV012, CV013, CV014]
    figureRefs: [FV001]
  - id: decision-and-diligence
    title: Recommendation and final diligence
    body: >-
      The recommendation is track rather than buy. Corgi has evidence of customer-facing product velocity, multiple financings, and a strategic opportunity in startup insurance, but the public evidence does not establish that the $2.6 billion or reported $4 billion marks are supported by sustainable risk-adjusted earnings. The next decision gate should be evidence-led: obtain audited financial statements, statutory filings, loss and combined ratios, reserve development, reinsurance treaties, TRRG capital and guaranty-fund exposure, policy retention, customer concentration, and the complete preferred-security stack. A price change could move the call: a materially lower entry price, transparent terms, and independently verified profitable growth would improve the stance; a down round, adverse reserve development, inability to secure reinsurance, or regulatory limitation would be thesis-break events. Exit readiness is not demonstrated by private valuation alone, and no public evidence establishes a near-term IPO or strategic sale path.
    claimRefs: [CV005, CV006, CV012, CV015, CV016]
    tableRefs: []
