  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Evidence basis, Decision implication]
    rows:
      - [Recommendation, track, "Reported growth and financing momentum, but no audited carrier earnings", "Do not underwrite a buy at the latest private mark"]
      - [Confidence, medium, "Multiple sources corroborate financing chronology; core economics remain undisclosed", "Require primary financial and statutory evidence"]
      - [Risk rating, high, "Young carrier, RRG structure, limited public claims history", "Size cautiously and monitor solvency and loss metrics"]
      - [Valuation stance, stretched, "Reported $2.6B mark and later $4B report against $40M-$45M run-rate references", "Demand a valuation bridge and preference terms"]
    notes: "Public and secondary-source figures are not a normalized audited dataset; run rate, ARR, valuation and funding are distinct metrics."
    claimRefs: [CV003, CV004, CV007, CV012]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view, Current implication]
    rows:
      - ["Full-stack carrier can reduce friction", "Corgi describes integrated underwriting, claims and policy operations; Sacra describes fast quotes and immediate certificates", "Independent retention, conversion, expense and loss data", "Positive product signal, not proof of economic moat"]
      - ["Investor demand validates financing access", "Forbes reports existing investors sought the $106M B1 round", "Independent terms, lead-investor confirmation and capital-use evidence", "Supports funding access but not intrinsic value"]
      - ["Growth can justify a premium", "January release says ARR surpassed $40M; Sacra reports $40M run rate", "Audited revenue recognition, margin, loss and reserve data", "Potentially attractive, currently unverified"]
      - ["Carrier structure creates downside", "QuoteSweep describes TRRG as unrated and outside state guaranty funds", "Policy-level carrier mix, capital, reinsurance and claims-payment evidence", "Material diligence risk"]
    notes: "Issuer and hosting relationships are distinguished: company-issued claims remain company claims even when syndicated; QuoteSweep is treated as an independent profile but its reporting still requires verification."
    claimRefs: [CV001, CV002, CV005, CV006, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Probability signal, Key trigger]
    rows:
      - [Bull, "Audited growth converts into durable underwriting profit; capital and reinsurance scale with exposure", "A premium to the latest mark could be justified by risk-adjusted earnings, but no public target is supportable", "Low-to-medium", "Verified combined ratio and capital adequacy improve"]
      - [Base, "Demand grows, but valuation normalizes while Corgi proves loss history and carrier economics", "Track and wait for terms or a lower entry price; avoid applying SaaS multiples to premiums", "Medium", "Audited statements and policy-level cohort data arrive"]
      - [Bear, "Loss volatility, reserve pressure, reinsurance tightening, or private-market multiple compression", "Downside can exceed the private-mark step-up because liquidity and preferences are unknown", "Medium", "Down round, adverse reserve development, or regulatory restriction"]
      - [Decision gate, "No commitment until missing underwriting and capitalization evidence is closed", "Return target is intentionally unresolved rather than fabricated", "High confidence in process, not outcome", "Complete independent diligence package"]
    notes: "Scenarios are qualitative because public sources do not provide a consistent audited revenue denominator, share count, preferred terms, loss ratio, or probability model."
    claimRefs: [CV003, CV004, CV012, CV013, CV014, CV016]
