company:
  name: Corgi
chapter:
  number: 5
  title: Product & Technology
  summary: Corgi presents a vertically integrated, AI-enabled commercial insurance workflow for startups, spanning digital intake, underwriting, policy administration, affiliated risk-bearing entities, and claims operations. The public evidence supports that operating thesis and a move into trucking, but does not establish model performance, reliability, security controls, or claims outcomes.
sections:
  - id: product-and-workflow
    title: Product and customer workflow
    body: >-
      Corgi's product is commercial insurance for startups and technology companies, with a digital workflow intended to shorten the path from application to coverage. Public descriptions combine rapid intake, modular coverage selection, automated pricing, digital binding for eligible risks, and policy-certificate delivery. The coverage menu includes core startup needs such as general liability, directors and officers, technology errors and omissions, cyber, fiduciary, hired and non-owned auto, and AI liability. The evidence supports a digitally distributed insurance product and a vertically integrated group, rather than a conventional broker-only model. It does not prove that every submission is automated, that quoted speed applies to complex risks, or that policy terms are superior to incumbent alternatives.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
    figureRefs: [FE001]
  - id: architecture-and-maturity
    title: Architecture, operating model, and maturity
    body: >-
      The architecture is best understood as an insurance operating workflow, not a disclosed software stack. Secondary sources describe intake of business data and documents, a proprietary risk engine, quote generation, policy administration, certificate issuance, API-oriented distribution, and claims triage with human escalation. Corgi-linked material describes AI support across underwriting, claims, and policy administration, while the retained TCV page expressly says its information was not independently verified. Together, these sources support the existence of a production-oriented workflow but not its implementation quality. No retained evidence discloses uptime, model validation, audit logs, override rates, security certification, incident history, or quantified automation. Product maturity is therefore commercially credible at the workflow level and technically under-disclosed.
    claimRefs: [CE005, CE006, CE007, CE008, CE012, CE013]
    tableRefs: [TE003]
  - id: differentiation-and-controls
    title: Differentiation, controls, and expansion risk
    body: >-
      Corgi's differentiation is structural: startup-focused distribution is combined with affiliated underwriting, carrier, and claims capabilities. That can reduce handoffs and make coverage changes or certificates easier to deliver, but the legal entity and paper behind each policy still matter. QuoteSweep reports that Corgi Insurance Services is a producer and program administrator, while risk may sit with Technology Risk Retention Group, an affiliated admitted carrier, or partner paper; it also flags that TRRG is not AM Best rated and its policies lack state guaranty-fund protection. Expansion into trucking tests a second dimension of the thesis because fleet risk, loss data, regulation, and claims operations differ from technology-startup liability. The assigned evidence does not establish whether Corgi's risk engine or controls transfer successfully to that vertical.
    claimRefs: [CE009, CE010, CE011, CE014]
