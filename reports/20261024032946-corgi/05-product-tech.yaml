    title: Structural product advantage
    body: Controlling more of intake, underwriting, policy administration, and claims can reduce handoffs and support a faster buying workflow if controls scale with volume.
    claimRefs: [CE002, CE005, CE009]
  - calloutType: risk
    title: Technical evidence gap
    body: Public sources describe the workflow but do not verify model accuracy, reliability, security, or claims-performance outcomes.
    claimRefs: [CE012, CE013]
