      - [Primary underwriting paper, Technology Risk Retention Group, Risk-bearing entity, High for reported primary paper, Capital weakness or contractual rejection of unrated paper, High, Use rated admitted paper where required, High]
      - [Startup demand base, Venture-backed company ecosystem, Premium and customer formation, Historically concentrated, Funding slowdown reduces formation and coverage demand, Medium-high, Diversify only with validated underwriting cohorts, Medium-high]
      - [Automated core workflow, Corgi-controlled systems, Underwriting policy and claims operations, High integration, Model or platform failure affects several control points, High, Human escalation and tested continuity controls, High]
    notes: Dependency and severity assessments are qualitative; the assigned evidence does not disclose counterparty shares, treaty terms, capital ratios, or system-control test results.
    claimRefs: [CR001, CR002, CR003, CR005, CR006, CR007, CR013, CR014]
  - id: TR002
    title: "Regulatory / legal risk register"
    columns: [Rule/license/case, Jurisdiction, Status in assigned evidence, Severity, Mitigation, Residual exposure, Diligence path]
    rows:
      - ["Risk-retention-group regulatory perimeter and guaranty-fund exclusion", "United States", "Corgi disclosure quoted by QuoteSweep; policy-level applicability unverified", "High", "Disclose issuing entity and use admitted paper where required", "High", "Review declarations page and state insolvency-guaranty treatment"]
      - ["Producer and carrier licensing footprint", "United States / state-specific", "California department provides a license search; Corgi-specific record not verified", "High", "Maintain state license controls", "Medium-high", "Verify producer and carrier records in every target state"]
      - ["Admitted-carrier product filings for new small-business classes", "State-specific", "Insurance Business reports first products filed; approval details and scope not fully shown", "High", "Use admitted carrier and filing process", "Medium-high", "Obtain filing approvals, forms, rates, and effective jurisdictions"]
      - ["AM Best or equivalent financial-strength status", "Counterparty-specific", "Primary TRRG described as unrated; partner carriers described as A- or better", "High", "Match policy to rated admitted paper when required", "High", "Obtain current rating evidence and capital disclosures"]
    enumerationScope:
      coverage: partial
      basis: "Four principal regulatory and counterparty risk categories identified from assigned source disclosures and licensing evidence."
    notes: The California Department of Insurance page is a government licensing-service source, not evidence that Corgi holds any particular license; null or unverified status is intentional.
    claimRefs: [CR005, CR006, CR007, CR008]
  - id: TR003
    title: Operational, quality, security, and dependency risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Automated underwriting misprices unfamiliar commercial risks", "Medium", "High", "Early", "High", "No public model-validation or loss-performance evidence by new vertical"]
      - ["Claims automation mishandles complex or disputed losses", "Medium", "High", "Unverified", "High", "No public claims cycle-time, denial, escalation, or reserve data"]
      - ["Reinsurance capacity or pricing tightens", "Medium", "High", "Unverified", "High", "Reinsurance counterparties, attachment points, and limits are undisclosed"]
      - ["Platform, data, or security incident interrupts binding or claims", "Medium", "High", "Unverified", "High", "No assigned evidence verifies incident history or resilience controls"]
      - ["Venture-backed startup demand contracts", "Medium", "Medium-high", "Unverified", "Medium-high", "Sacra identifies dependence on startup formation and funding cycles"]
      - ["Expansion creates licensing or distribution execution friction", "Medium", "Medium-high", "Partial", "Medium-high", "New jurisdictions, partners, and product forms require validation"]
    notes: Risk levels are qualitative; the assigned evidence does not provide a complete incident register, vendor inventory, reinsurance program, or claims denominator.
    claimRefs: [CR001, CR002, CR009, CR010, CR011, CR012]
