        - label: Medium impact
          values: [0, 1, 3, 4]
        - label: Low impact
          values: [0, 0, 1, 2]
        - label: Counterparty protection
          values: [0, 1, 4, 5]
        - label: Capital resilience
          values: [0, 2, 4, 5]
        - label: Underwriting transfer
          values: [0, 1, 3, 4]
    approximationNotes: Placement is a qualitative synthesis of assigned source evidence and unresolved denominators; it is not a probability model or actuarial heatmap.
    claimRefs: [CR001, CR005, CR009, CR013]
