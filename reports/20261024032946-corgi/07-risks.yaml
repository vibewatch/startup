company:
  name: Corgi
chapter:
  number: 7
  title: Risks
  summary: Corgi's principal risks arise from insurance-balance-sheet exposure, an uneven regulatory and carrier structure, and rapid expansion beyond its startup underwriting niche. Public evidence identifies meaningful mitigations, but does not establish loss ratios, capital adequacy, claims experience, or the performance of newer verticals.
sections:
  - id: risk-ranking
    title: Ranked risk assessment
    body: >-
      Corgi controls more of the underwriting and claims workflow than a conventional broker, but that integration also concentrates operational and balance-sheet responsibility inside a young insurance group. Independent and industry-facing profiles identify reinsurance dependency and dependence on venture-backed startup formation as material exposures, while Corgi's own structure includes a risk retention group, an admitted carrier, a producer, and claims operations. The strongest public evidence therefore supports a high residual-risk posture rather than a conclusion that the model is unsafe. The most decision-relevant missing evidence is quantitative: no retained source supplies audited financial statements, loss ratio, combined ratio, reserve development, claims severity, reinsurance attachment points, or capital adequacy. Those omissions make reported growth and speed poor substitutes for proof of underwriting resilience.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: legal-regulatory
    title: Legal, regulatory, and policyholder protection
    body: >-
      Corgi's regulatory risk is not simply whether it holds a license. The entity named on a policy determines the applicable regulatory perimeter, insolvency backstop, and independent financial-strength signal. QuoteSweep reports that Corgi Insurance Services is a licensed producer and program administrator, while Technology Risk Retention Group is the primary underwriting entity; the same profile says Corgi Insurance Company is an admitted carrier and that some risks use A-rated partner carriers. It also quotes Corgi's disclosure that state insolvency guaranty funds are unavailable for risk-retention-group policies. California's insurance department provides a license-status search service, but the assigned evidence does not verify Corgi's individual license record. The diligence conclusion is consequently conditional: verify the carrier and jurisdiction on each declarations page, licensing footprint, rating, and guaranty-fund treatment before relying on coverage.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
  - id: operating-and-dependency
    title: Operating, technology, partner, and expansion risk
    body: >-
      Corgi's speed depends on automated underwriting, policy administration, and claims workflows that process heterogeneous risk information. SiliconANGLE reports that Corgi analyzes thousands of company and risk data points, typically binds policies the same day, and is expanding from startups into trucking, payroll, and small business. Insurance Business describes the admitted-carrier launch as targeting materially different classes such as salons, restaurants, self-storage, and residential rental properties, and explicitly notes that whether startup-oriented technology transfers to businesses with less digital data remains an open question. The operational risk is therefore model transfer and control quality, not merely software uptime. Expansion also increases dependency on licensing, reinsurance, distribution partners, and the quality of human escalation for complex cases. Public sources do not provide incident, outage, model-validation, vendor-concentration, or claims-performance data.
    claimRefs: [CR009, CR010, CR011, CR012]
    tableRefs: [TR003]
  - id: monitoring-and-kill-criteria
    title: Monitoring, mitigations, and thesis-break triggers
    body: >-
      The available mitigations are structural rather than quantitatively demonstrated: Corgi says it owns core underwriting and claims workflows; its group includes an admitted carrier for some business; and it can route complex cases to human underwriters or adjusters. These controls should be tested against measurable thresholds. A thesis break would be a regulator restricting a material product or jurisdiction, a policy being issued by an unrated risk-bearing entity when an admitted rated carrier is required, a deterioration in loss or reserve metrics, a material reinsurance-capacity reduction, a confirmed security or claims-processing incident, or an expansion vertical lacking validated underwriting performance. Until Corgi discloses the relevant denominators and trend data, the prudent stance is to treat growth, customer counts, and quoted speed as company or third-party reported indicators rather than evidence of profitable or durable risk selection.
    claimRefs: [CR013, CR014, CR015]
    tableRefs: []
callouts:
  - calloutType: risk
    title: Highest-priority diligence gap
    body: Obtain policy-level carrier identity, AM Best or equivalent rating evidence, guaranty-fund treatment, audited financials, statutory capital, reinsurance structure, loss ratio, combined ratio, reserve development, and claims cohorts before underwriting Corgi's reported growth as durable.
    claimRefs: [CR006, CR013, CR014]
  - calloutType: recommendation
    title: Practical control
    body: Require a declarations-page review and state-by-state licensing confirmation for every new product or vertical, with an explicit escalation path for risks outside automated binding limits.
    claimRefs: [CR005, CR009, CR010]
