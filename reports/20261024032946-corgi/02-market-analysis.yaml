callouts:
  - calloutType: insight
    title: The investable market question is retention, not headline TAM
    body: "Corgi has a clear initial wedge and multiple adjacency signals, but public evidence does not isolate premium volume, segment conversion, or loss-adjusted economics. Diligence should test whether fast startup acquisition persists through later-stage complexity and whether adjacent verticals can scale without weakening underwriting discipline."
    claimRefs: [CM004, CM007, CM014, CM015]
  - calloutType: risk
    title: Coverage paper and concentration constrain adoption
    body: "A buyer's willingness to switch depends on the exact underwriting entity, ratings, guaranty-fund treatment, state availability, and claims record. Startup concentration also makes demand sensitive to venture funding cycles, so customer growth should not be treated as a durable market proxy without cohort and retention evidence."
    claimRefs: [CM012, CM013, CM014]
