company:
  name: Corgi
chapter:
  number: 2
  title: Market Analysis
  summary: Corgi addresses a defined U.S. commercial-insurance workflow for venture-backed startups and technology companies, where speed, modular coverage, and digital distribution are the primary buying wedge. The evidence supports meaningful adjacent expansion, but not a defensible top-down TAM or a fully independent estimate of market share.
sections:
  - id: market-boundary
    title: Market boundary and status quo
    body: >-
      Corgi's relevant market is commercial insurance for venture-backed startups and
      technology companies, initially sold through a self-serve, direct digital workflow.
      The included spend is the premium paid for startup-relevant lines such as general
      liability, cyber, technology errors and omissions, directors and officers,
      employment practices, fiduciary, media, and AI liability coverage. The market
      excludes personal lines, pet insurance, and unrelated home-cover brands, as well
      as general small-business insurance that Corgi has not yet demonstrated at scale.
      The status quo is a broker-mediated process in which a founder explains the risk,
      waits for carrier quotes, negotiates terms, and receives a certificate later.
      Corgi's direct workflow targets that time and handoff cost, but assigned evidence
      describes a producer and affiliated risk-bearing entities rather than one carrier.
      A broker remains a substitute when a buyer needs unusual risks or access to multiple
      carriers. One low-tier source instead characterizes Corgi as an embedded-insurance
      middleware layer, a conflict that prevents broadening the market boundary on that basis.
    claimRefs: [CM001, CM002, CM003, CM012, CM016]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Evidence-constrained sizing
    body: >-
      Public evidence supports a bottom-up operating footprint, not a single reliable
      TAM/SAM/SOM chain. Sacra reports more than 40,000 active startup customers across
      49 U.S. states and estimates approximately $40 million of annual run rate in
      December 2025; its estimate is an analyst view and is not audited. The same source
      describes a further international opportunity of approximately 25,000 to 30,000
      venture-backed companies, but this is an estimate rather than a measured serviceable
      market. Corgi's own expansion signals include trucking, property management, small
      business, and agent distribution, while coverage across 49 states leaves a stated
      geographic gap. These lenses show expansion vectors, but they do not establish
      premium volume, conversion, share, or a defensible dollar TAM.
    claimRefs: [CM004, CM005, CM006, CM007]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-segments
    title: Buyer, user, and payer map
    body: >-
      The initial buyer is usually a founder, operator, or finance/legal owner at a
      venture-backed startup; the user is the person completing the application and
      managing certificates and policy changes; and the payer is the company. The
      adoption trigger is often operational rather than discretionary: an enterprise
      customer, landlord, investor, or hiring milestone requires proof of insurance.
      Corgi's stage-based packages align coverage with company maturity, while instant
      quoting and certificate issuance reduce the time cost of the purchase. A second
      route is an independent agent using Corgi's workspace. Later-stage or complex-risk
      buyers may instead choose a broker because broader carrier access can outweigh
      speed. Budget ownership therefore shifts from founder-led general spend toward
      finance, legal, risk, or procurement as limits and policy complexity increase.
    claimRefs: [CM008, CM009, CM010, CM011]
    tableRefs: [TM003]
  - id: drivers-and-constraints
    title: Adoption drivers, constraints, and valuation relevance
    body: >-
      The strongest adoption driver is workflow compression: independent reviews describe
      applications completed in minutes and same-day coverage, which is valuable when
      insurance is a gating item for a commercial contract. A second driver is product
      specificity, including AI liability and modular coverage for technology companies.
      Agent distribution could add partner-led demand beyond direct founder acquisition.
      Constraints are material. QuoteSweep reports that the primary risk-bearing entity is
      an unrated risk retention group and that state guaranty funds are unavailable for
      policies issued by that entity; the source also notes inconsistent public licensing
      counts. Corgi's startup concentration exposes demand to venture-funding cycles,
      while international availability and complex later-stage coverage remain limited.
      The valuation implication is a tradeoff between faster distribution and retention
      potential versus concentration, regulatory, capital, and claims-history risk.
    claimRefs: [CM012, CM013, CM014, CM015]
