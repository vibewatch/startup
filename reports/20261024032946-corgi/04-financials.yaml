      - [Trucking coverage, "Auto liability, cargo, and physical damage", "Policy or flexible per-load coverage", "Launched in 2026; same-day policies often claimed", "Company release syndicated by trade press", "Provide bind volume, rate adequacy, and early loss experience"]
      - [Float and investment income, Investment returns between premium collection and claims payment, Invested float, "Economic mechanism described; amount and income undisclosed", "Analyst description", "Obtain investment policy, yield, liquidity, and restrictions"]
    notes: "Sources describe mechanisms and product lines, but do not provide audited revenue recognition, realized pricing, premium volume, or income by stream; null or undisclosed fields are not zero."
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
  - id: TI002
    title: Traction and monetization proxies
    columns: [Metric, Value or status, Period, Confidence, Why it matters, Diligence ask]
    rows:
      - [Annual run rate, "$40M estimated", "December 2025", "Medium; Sacra estimate", "Indicates early commercial scale but is not audited revenue", "Reconcile to earned premium and statutory filings"]
      - [Active startup customers, "Over 40,000", "Reported in 2025/2026 coverage", "Medium; third-party report of company information", "Signals distribution and installed base", "Define active, policy, account, and multi-policy denominators"]
      - [Churn, "Below 1% reported", "Period not specified", "Low-to-medium; denominator and cohort absent", "Could indicate retention, but cannot establish net retention or profitability", "Provide logo and premium retention cohorts"]
      - [Average revenue per customer, "Approximately $1,000 annually", "Period not specified", "Medium; Sacra estimate", "Provides a rough monetization proxy", "Split by coverage line, customer stage, and realized premium"]
      - [Quote generation, "Within 30 seconds described", "Current product description", "Medium; Sacra report", "Proxy for sales and service efficiency", "Measure conversion, human-review rate, and bind rate"]
    notes: "Values are reported or estimated public proxies, not a consistent audited time series; customer count, churn, and revenue-per-customer denominators are not fully defined."
    claimRefs: [CI006, CI007, CI008, CI009, CI010]
  - id: TI003
    title: Capital and underwriting data availability
    columns: [Input, Public evidence, Financial interpretation, Status, Diligence ask]
    rows:
      - [External financing, "$160M Series B at $1.3B valuation; later $106M round at $2.6B reported", "Capital raised and valuation support expansion, not cash available or solvency", "Partially disclosed", "Obtain cap table, cash balance, restricted cash, and use of funds"]
      - [Risk-bearing entity, "Primary underwriting entity described as TRRG; admitted and partner carriers may also write risk", "Entity determines capital, guaranty-fund, and rating exposure", "Disclosed structure; financials unavailable", "Map every product and state to the carrier on the policy"]
      - [Financial-strength signal, "TRRG described as not AM Best rated; RRG guaranty funds unavailable", "No independent rating or state guaranty backstop for TRRG-issued policies", "Adverse structural risk", "Obtain statutory surplus, actuarial opinion, and regulator filings"]
      - [Reinsurance, "Dependence identified; terms not disclosed", "Catastrophe protection and earnings volatility cannot be assessed", "Unavailable", "Obtain attachment points, limits, counterparties, and renewals"]
      - [Cash burn and runway, "No public cash, burn, or runway figure found in assigned sources", "Financing dependency cannot be modeled", "Gap", "Request 24-month cash bridge and downside runway"]
    notes: "Financing, valuation, and structural disclosures are not substitutes for audited accounts, statutory capital, reserve adequacy, or cash-flow evidence."
    claimRefs: [CI011, CI012, CI013, CI014, CI015, CI016]
