company:
  name: Corgi
chapter:
  number: 4
  title: Financials
  summary: Corgi's public financial picture combines rapid premium-linked growth claims with limited disclosure of carrier profitability, capital adequacy, and realized unit economics. The underwriting case is therefore attractive on reported demand and automation, but remains dependent on verification of loss performance, risk-retention-group capital, reinsurance, and cash runway.
sections:
  - id: revenue-and-monetization
    title: Revenue model and monetization
    body: >-
      Corgi's monetization is insurance-premium based rather than software subscription based. Sacra describes annual policies with premiums collected upfront, while also describing investment returns on float; that structure makes written premium, earned premium, loss ratio, and investment income economically distinct measures. Public descriptions also indicate modular coverage across general liability, cyber, technology and AI errors and omissions, directors and officers, employment practices, media, fiduciary, and related lines. QuoteSweep describes a producer/program-administrator entity, affiliated risk-bearing entities, and partner carriers, so the policy-level carrier and allocation of premium must be checked before treating reported revenue as carrier economics. Official and independent sources support fast quoting and same-day binding, but they do not disclose realized pricing, discounting, commission expense, or renewal cohorts. The revenue-stream table therefore separates public operating descriptions from underwriting metrics that remain unavailable.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: traction-and-efficiency
    title: Traction, pricing, and sales-efficiency proxies
    body: >-
      Public traction is strong but unevenly verified. Sacra estimates $40 million of annual run rate in December 2025, more than 40,000 active startup customers, sub-1% churn, and approximately $1,000 of annual revenue per customer; Icon Polls reports similar $40 million ARR and customer claims, while explicitly presenting a review rather than audited financial statements. These figures are not interchangeable with audited revenue, gross profit, or cash receipts, and the customer denominator and policy mix are not disclosed. The product workflow provides a useful efficiency proxy: Sacra says pricing can be generated within 30 seconds and complex cases route to human underwriters, while TruckNews reports that trucking policies are often issued the same day. No source provides CAC, payback, conversion, renewal expansion, loss ratio, or gross margin. The underwriting ask is to reconcile customer counts, policy count, written and earned premium, and retention by cohort and product.
    claimRefs: [CI006, CI007, CI008, CI009, CI010]
    tableRefs: [TI002]
  - id: capital-and-underwriting-risk
    title: Capital adequacy and financial underwriting blockers
    body: >-
      Corgi's financing has accelerated alongside vertical expansion, but financing raised is not cash available for claims or operating runway. The Next Web reports a $160 million Series B at a $1.3 billion valuation in May 2026; Forbes reports a later $106 million round at a $2.6 billion valuation, and Inc reports a further reported $4 billion valuation while noting that details were unavailable. These are financing and valuation markers, not evidence of solvency or profitability. QuoteSweep's review says the primary underwriting entity is Technology Risk Retention Group, that it is not AM Best rated, and that state insolvency guaranty funds are unavailable for policies issued by an RRG. Sacra identifies reinsurance dependency as a profitability and growth risk. Insurance practitioner Fabio Faschi warns that early combined ratios in a fast-growing book can conceal selection problems and that scaled loss performance will take years to observe. The central diligence blocker is a current entity-level capital and liquidity package: cash and restricted cash, burn, runway, statutory surplus, reinsurance attachment and limits, reserve development, loss and combined ratios, debt, and planned use of financing.
    claimRefs: [CI011, CI012, CI013, CI014, CI015, CI016]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict
    body: >-
      Corgi has a credible monetization engine and visible demand signals, but the public record does not yet support underwriting carrier economics. Reported run rate and customer metrics indicate commercial traction; they do not establish realized premium quality, retention profitability, margin, or cash generation. The full-stack and embedded-distribution model may improve quote speed and acquisition efficiency, but it also leaves Corgi exposed to claims volatility, reinsurance pricing, regulatory capital requirements, and startup-cycle concentration. The trucking launch expands the addressable premium pool but has no disclosed loss history, so it should be treated as an unproven underwriting vertical. A prudent financial stance is track/research-more until management supplies audited or regulator-reconciled financials, policy-level economics, and capital adequacy evidence.
    claimRefs: [CI006, CI010, CI014, CI015, CI016]
callouts:
  - calloutType: strength
    title: Demand and distribution signal
    body: Reported customer and run-rate metrics, plus sub-minute pricing and same-day binding claims, indicate a potentially efficient acquisition and servicing model, subject to reconciliation against policy and premium records.
    claimRefs: [CI006, CI007, CI008, CI009]
  - calloutType: risk
    title: Underwriting capital remains unproven
    body: The public record does not disclose loss ratio, combined ratio, statutory surplus, cash runway, or reinsurance terms; the absence of these metrics prevents a confident view of carrier profitability or solvency.
    claimRefs: [CI014, CI015, CI016]
