      - [Distribution, "Direct self-serve plus broker channel evidence", "Broker placement and carrier choice", "Broker-centered distribution common", "Supported for Corgi; comparator cells qualitative"]
      - [Product modularity, "Stage-based bundles and add-on modules", "Unknown in assigned evidence", "Broad products but less startup-specific", "Partially supported"]
      - [AI-specific liability, "Dedicated module integrated with Tech E&O", "Unknown in assigned evidence", "Generic technology coverage may not address all AI scenarios", "Supported for Corgi; comparator cells not fully evidenced"]
      - [Rated paper and guaranty-fund protection, "Depends on policy entity; RRG lacks state guaranty fund", "Unknown", "Admitted paper may provide these protections", "Material trust tradeoff; policy-specific"]
    notes: "This is an evidence-bounded comparison, not a vendor scorecard; unknown cells are intentionally not inferred from category labels."
    claimRefs: [CP002, CP006, CP007, CP012, CP013, CP015, CP016]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Alternative, Price or contract model, Included capability, Public discount or realized price, Buyer implication]
    rows:
      - [Corgi stage bundles, "Annual policy premium; exact list and realized prices unavailable", "Stage-based startup coverage modules", Unknown, "Fast packaging is visible, but price competitiveness is unverified"]
      - [Corgi AI liability, "Add-on to an existing Tech E&O policy", "AI-specific liability scenarios", Unknown, "Not a standalone substitute for base Tech E&O"]
      - [Vouch hybrid model, "Direct underwriting plus broker placement; price unavailable", "Startup-focused placement", Unknown, "May combine own underwriting with external market access"]
      - [Embroker broker model, "Broker-negotiated placement; price unavailable", "Access to multiple underwriting options", Unknown, "Carrier choice may help complex risks but adds handoffs"]
      - [Traditional admitted carrier, "Underwritten annual policy; price unavailable", "Admitted paper and established carrier infrastructure", Unknown, "Trust attributes may outweigh workflow speed for some contracts"]
    notes: "No assigned source provides matched-limit quotes, realized premiums, discounts, or renewal pricing; every price cell is therefore explicitly unknown."
    claimRefs: [CP007, CP008, CP012, CP013, CP015, CP016]
figures:
  - id: FP001
    title: Competitive positioning by speed and carrier-control model
    type: quadrant
    summary: "Evidence-backed ordinal positioning places Corgi high on workflow speed and carrier-stack control, while noting that positions are analytical assessments rather than measured benchmarks."
    data:
      xAxis:
        label: Workflow speed and self-service
        min: 1
        max: 5
        low: Slower or broker-mediated
        high: Faster self-service
        scale: Evidence-backed ordinal assessment, not a measured benchmark
      yAxis:
        label: Control of underwriting and policy stack
        min: 1
        max: 5
        low: External carrier placement
        high: Direct risk-bearing control
        scale: Evidence-backed ordinal assessment, not a measured benchmark
      points:
        - {label: Corgi, x: 5, y: 4, note: "Sources support quotes in minutes and an integrated group; legal entities vary by policy"}
        - {label: NEXT, x: 4, y: 5, note: "Digital automated underwriting with direct insurer control and scaled incumbent ownership"}
        - {label: Vouch, x: 3, y: 2, note: "Hybrid direct-underwriting and broker-placement model; exact speed is unmeasured"}
        - {label: Embroker, x: 3, y: 1, note: "Digital broker model provides carrier choice without direct risk-bearing control"}
        - {label: Panta, x: 3, y: 1, note: "AI-native brokerage places complex risks across carriers; exact speed is unmeasured"}
        - {label: Traditional admitted carrier, x: 1, y: 5, note: "Direct carrier control and admitted paper, with slower workflows described qualitatively"}
    approximationNotes: "Coordinates are 1-5 ordinal judgments from the retained structural evidence; they are not measured speed, quality, or financial-strength scores."
    claimRefs: [CP002, CP006, CP010, CP015, CP016]
callouts:
  - calloutType: insight
    title: The defensible wedge is operational, not merely “AI”
    body: >-
      Corgi's clearest differentiation is the combination of startup-specific underwriting, direct workflow, and modular policy administration. AI branding alone is less defensible because incumbents can add automation or acquire technology-first peers.
    claimRefs: [CP006, CP009, CP010, CP011]
  - calloutType: risk
    title: Buyer trust depends on the policy entity
    body: >-
      Policy-level diligence should identify the actual underwriting entity, whether it is rated, and whether state guaranty-fund protection applies; these terms can matter more to a buyer than the front-end quote experience.
    claimRefs: [CP012, CP013]
