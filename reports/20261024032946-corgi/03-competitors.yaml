company:
  name: Corgi
chapter:
  number: 3
  title: Competitors
  summary: Corgi competes through a vertically integrated, startup-focused insurance model that combines self-serve distribution, automated underwriting, and modular coverage. The model is differentiated from brokers and legacy carriers, but incumbent scale, rated paper, customer breadth, and mature loss data remain material counterweights.
sections:
  - id: landscape
    title: Competitive landscape and strategic position
    body: >-
      Corgi's alternatives span digital small-business insurers, startup-focused hybrid platforms, brokers, traditional commercial carriers, broker-assisted placement, and internal risk administration. Corgi describes itself as a direct carrier, while QuoteSweep describes a group structure in which a producer, affiliated risk-bearing entities, and partner carriers perform different functions. That makes the customer workflow more integrated than a conventional broker without establishing that one Corgi entity carries every policy. NEXT Insurance is the clearest scaled benchmark in the assigned evidence: ERGO and TechCrunch report $548 million of 2024 top line, more than 600,000 customers, and roughly 700 employees. Vouch and Embroker address the same startup buying job through hybrid or broker models, while Panta is an adjacent AI-native brokerage. The comparison favors Corgi on specialization and speed, but favors scaled carriers on operating history and balance-sheet resources.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP015, CP016]
    tableRefs: [TP001]
  - id: capability-comparison
    title: Capability, product, and trust comparison
    body: >-
      Corgi's buying proposition is speed and modularity: assigned sources describe quotes in minutes, same-day binding, stage-based packages, and startup-focused coverage. The AI liability product adds a wedge for companies exposed to model, data, synthetic-media, or autonomous-system risks, but the independent product description says it requires an existing Tech E&O policy rather than standing alone. A broker can counter with carrier choice, while an admitted carrier can offer rated paper and state guaranty-fund protection. The assigned evidence does not disclose comparable realized premiums, discounts, renewals, loss ratios, or claims outcomes, so the pricing table preserves unknowns rather than converting list-positioning language into price claims. Corgi appears strongest when a buyer values self-service and an integrated workflow; its advantage is less certain when a contract requires admitted, rated paper or specialized placement.
    claimRefs: [CP006, CP007, CP008, CP012, CP013, CP015, CP016]
    tableRefs: [TP002, TP003]
  - id: durability-and-switching
    title: Switching costs, distribution power, and moat durability
    body: >-
      Corgi's potential moat is workflow and data accumulation rather than a visibly exclusive distribution asset. A self-serve application, automated risk assessment, policy records, and dashboard claims handling can lower friction and create process familiarity, but the assigned evidence does not quantify cohort retention, realized acquisition cost, or underwriting performance. Reported expansion into trucking, small business, and sports may widen the addressable market, yet it also increases the need for domain-specific underwriting evidence. Munich Re and ERGO's acquisition of NEXT shows that a technology-first insurer can become strategically valuable to a large incumbent; it also demonstrates that incumbents can buy digital capabilities and add capital, distribution, and insurance expertise. Corgi's moat therefore depends on superior risk selection and renewal economics, not on front-end speed alone.
    claimRefs: [CP008, CP009, CP010, CP011]
    figureRefs: [FP001]
  - id: adverse-evidence
    title: Displacement and commoditization risks
    body: >-
      The strongest adverse evidence is structural. QuoteSweep reports that Corgi's primary risk-retention-group underwriting entity is not AM Best rated and that state insolvency guaranty funds are unavailable for policies it issues. Those are buyer-level trust tradeoffs, although absence of a rating is not evidence of weak financial condition. AI-liability pricing also faces immature actuarial data, and the product's dependence on an underlying Tech E&O policy limits its standalone reach. At the other end of the market, NEXT's 2024 scale and Munich Re ownership show how a scaled incumbent can combine digital underwriting with balance-sheet resources. Corgi's differentiation is durable only if speed, startup-specific data, and product iteration produce better loss selection, renewal economics, and claims outcomes; none of those outcomes is established by the assigned public evidence.
    claimRefs: [CP007, CP008, CP010, CP012, CP013, CP014]
    tableRefs: []
