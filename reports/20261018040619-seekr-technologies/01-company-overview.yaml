    rows:
      - ["Pat Condo", "Founder and CEO", "Founded six search companies, including two NASDAQ-listed exits above $1B, per company biography.", "Strong founder-market fit in search, AI, and mission-oriented data systems.", "High: company narrative and founder credibility are concentrated here."]
      - ["Rob Clark", "President", "20+ years in AI and web-scale technologies; quoted repeatedly on Army and product announcements.", "Bridges product vision to defense and enterprise go-to-market.", "High: visible external spokesperson for commercial and government traction."]
      - ["Stefanos Poulis, PhD", "Chief Technology and AI Officer", "AI scientist/engineer with search, NLP, conversational AI, and recommendation background.", "Technical ownership over model strategy and explainability tooling.", "Medium: technical differentiation appears tied to senior scientific leadership."]
      - ["Matt Jones", "Chief Financial Officer", "Senior finance executive with prior software and technology-company leadership roles.", "Covers fundraising, finance operations, and reporting discipline.", "Medium: crucial for turning company-reported scale claims into diligence-grade financial disclosure."]
      - ["Lloyd Cope", "Chief Revenue Officer", "Former Palantir and Altana AI sales leader, according to company bio.", "Supports defense/enterprise sales scaling in regulated markets.", "Medium: important to monetization but not sole technical dependency."]
      - ["Colby Proffitt", "Chief Marketing Officer", "B2B/B2G marketing executive across mission-critical technology and cybersecurity categories.", "Reinforces category creation in defense and regulated enterprise.", "Medium: supports messaging and demand generation rather than single-threaded company control."]
    notes: >-
      This table covers the founder and the named senior executives visible on the current public
      company pages. It does not establish full board composition or ownership control.
    enumerationScope:
