  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control or economic importance
      - Evidence of current relationship
      - Diligence ask
    rows:
      - ["Danu Venture Group", "Lead investor in announced 2025 financing", "Potentially influential in governance if the planned round closes on the announced terms.", "Named with AMD Ventures as leading the planned $100M round at a $1.2B valuation.", "Request final close amount, board rights, pro rata structure, and any liquidation preferences."]
      - ["AMD Ventures", "Strategic investor and infrastructure-aligned backer", "Signals hardware and ecosystem relevance in addition to capital support.", "Named as round co-lead; partner page also highlights AMD infrastructure collaboration.", "Confirm whether AMD support is purely commercial, financially strategic, or both."]
      - ["U.S. Army / Project Linchpin / DEVCOM AvMC", "Government program sponsor and traction anchor", "Material proof point for defense adoption, but possibly a concentration risk if scaled revenue depends on pilot-like awards.", "ExecutiveBiz and Inside Defense both describe Army awards or contracts spanning AI/ML and cyber-vulnerability use cases.", "Quantify contract values, renewal paths, and conversion from awards to recurring revenue."]
      - ["Oracle Cloud Infrastructure", "Infrastructure and go-to-market partner", "Important for deployment credibility in enterprise and government cloud workloads.", "Investor materials date a multi-year OCI agreement to June 2025; partner page describes joint go-to-market acceleration.", "Clarify revenue dependence, exclusivity, and whether OCI is a channel or only infrastructure."]
      - ["AWS Marketplace / AWS GovCloud", "Distribution and deployment channel", "Supports procurement ease and regulated deployment rather than direct equity control.", "SeekrFlow product and partner pages say the platform is available in AWS Marketplace and AWS GovCloud.", "Measure procurement conversion and attach rates versus direct sales."]
      - ["GDIT and Enabled Intelligence", "Defense ecosystem collaborators", "Could expand access to government programs and adjacent workflows without representing direct ownership.", "AI-information and investor pages list a March 2026 GDIT collaboration and July 2026 Enabled Intelligence partnership.", "Test whether these relationships have produced booked revenue, reference accounts, or joint bids."]
    notes: >-
      The map captures stakeholders disclosed in the assigned pool, not a full cap table or
      revenue-concentration schedule.
    enumerationScope:
      coverage: partial
      basis: >-
        Rows reflect investors, infrastructure partners, and government programs explicitly named
        in the assigned evidence; undisclosed holders and customers are out of scope.
    claimRefs: [CO005, CO009, CO010, CO013, CO014, CO015]
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Publicly disclosed milestones show Seekr moving from product launch into defense awards,
      infrastructure alliances, compliance milestones, and international expansion.
    data:
      items:
        - date: "2024-06"
          label: SeekrFlow launches
          details: Investor materials date the flagship platform launch to June 2024.
          tone: positive
        - date: "2025-05"
          label: Army SBIR awards
          details: ExecutiveBiz reported two Army SBIR awards spanning Project Linchpin and edge or austere-environment AI/ML work.
          tone: positive
        - date: "2025-06"
          label: OCI agreement and announced funding round
          details: Investor materials cite a multi-year OCI agreement, while Seekr announced a planned $100M round at a $1.2B valuation with first closing completed.
          tone: positive
        - date: "2025-09"
          label: SeekrFlow product update
          details: Seekr announced Structured Outputs, Custom Tools, and GRPO Fine-Tuning to simplify enterprise deployment.
          tone: positive
        - date: "2025-12"
          label: SeekrGuard launch and SOC 2 Type II
          details: Company materials say Seekr launched SeekrGuard and achieved SOC 2 Type II compliance in December 2025.
          tone: positive
        - date: "2026-01"
          label: Army cyber-vulnerability contract
          details: Inside Defense reported a separate Army contract for agentic AI to identify cyber, system, and mission vulnerabilities, but said its value was not disclosed.
          tone: risk
        - date: "2026-03"
          label: GDIT collaboration
          details: Seekr says it began collaborating with GDIT on agentic AI solutions for government missions.
          tone: positive
        - date: "2026-07"
          label: CMMC Level 2 and Enabled Intelligence
          details: Company materials say Seekr earned CMMC Level 2 certification and partnered with Enabled Intelligence in July 2026.
          tone: positive
        - date: "2026-10"
          label: London office visibility
          details: The investor page highlights October 2026 press coverage of a London office opening, consistent with current company materials listing London as an additional office.
          tone: positive
    approximationNotes: null
    claimRefs: [CO005, CO008, CO009, CO010, CO011, CO012, CO013, CO014, CO015]
callouts:
  - calloutType: strength
    title: Real momentum is visible even through company-controlled evidence
    body: >-
      The assigned pool supports a consistent cadence of product, compliance, and defense
      milestones across 2024-2026, and two independent publications corroborate Army-related
      traction rather than leaving every commercial claim confined to Seekr-owned pages.
    claimRefs: [CO009, CO012, CO013]
  - calloutType: risk
    title: Scale and governance still rely too heavily on self-reporting
    body: >-
      Funding terms, board composition, headcount, customer concentration, and margin quality are
      not independently disclosed in the assigned pool, so the headline valuation and traction
      narrative should be treated as promising but not yet diligence-complete.
    claimRefs: [CO004, CO005, CO006, CO007]
