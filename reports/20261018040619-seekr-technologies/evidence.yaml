evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount and efficiency metrics
    missingEvidence: A current employee count plus basic unit-economics disclosure such as gross margin, burn, and runway.
    whyItMatters: >-
      These metrics determine whether the valuation reflects durable software economics or mostly narrative and pilot
      traction.
    diligencePath: Request current org chart, department headcount, board package KPIs, and monthly management accounts.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership and founder table coverage
    missingEvidence: Formal board roster, independent director count, committee assignments, and voting-control disclosures.
    whyItMatters: >-
      Management quality alone is not governance quality; board composition and control rights shape downside protection
      and decision authority.
    diligencePath: Request cap table, board deck materials, charter documents, and biographies for all directors and board observers.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder and investor map completeness
    missingEvidence: >-
      Final round size, liquidation preferences, debt facilities, secondaries, top-customer concentration, and
      program-level revenue mix.
    whyItMatters: >-
      The current map shows who is important, but not who controls the company economically or whether defense traction
      is broad or concentrated.
    diligencePath: >-
      Request financing documents, the latest cap table, debt schedules, and revenue concentration by customer and
      program.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: adverse or regulatory record
    missingEvidence: Independent legal, regulatory, outage, or litigation reporting directly tied to Seekr if any exists.
    whyItMatters: >-
      The assigned pool's zero-hit adverse queries do not prove clean legal or regulatory history, and absence of
      evidence is not evidence of absence.
    diligencePath: >-
      Run dedicated litigation, sanctions, enforcement, outage, and complaint searches plus PACER and procurement-risk
      checks outside this constrained worker pool.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: sam-som
    missingEvidence: Segmented revenue, bookings, pipeline, or ACV by government versus commercial, geography, and workflow category.
    whyItMatters: >-
      Without that bridge, adjacent-market growth cannot be converted into a source-backed serviceable or obtainable
      market for Seekr.
    diligencePath: >-
      Request management data-room exports or board materials showing customer count, revenue mix, and pipeline by
      segment and region.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: >-
      Win-rate, sales-cycle, and procurement-route data showing which budget owner actually pays across federal and
      regulated-enterprise deals.
    whyItMatters: >-
      Valuation sensitivity depends on whether Seekr sells as a central platform, a compliance layer, or a
      workflow-specific application budget.
    diligencePath: >-
      Request representative deal memos, procurement documents, and customer references that show buyer role, budget
      source, and deployment path.
    relatedQuestionRefs:
      - QM004
      - QM005
      - QM006
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Public list pricing, typical contract size, and recent competitive win-loss data against Palantir, Databricks,
      Snowflake, and Microsoft Fabric.
    whyItMatters: >-
      Without price realization and battle-card evidence, the chapter can compare positioning but cannot prove whether
      Seekr wins on cost, procurement speed, or ROI.
    diligencePath: Request current pricing sheets, recent bake-off summaries, and CRM-coded reasons for wins and losses by segment.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitor-scale-comparability
    missingEvidence: >-
      Like-for-like public scale, funding, deployment-count, or revenue comparables for the alternatives targeting the
      same regulated buyer segments.
    whyItMatters: >-
      Without normalized comparables, the profile table can rank positioning but not fully underwrite installed-base
      advantage or staying power.
    diligencePath: >-
      Collect current competitor disclosures, customer-count evidence, and public filings or decks that separate
      regulated-segment traction from broader platform scale.
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: >-
      Product-level and segment-level revenue split across software subscriptions, implementation services, appliance or
      edge deployments, and public-sector work.
    whyItMatters: >-
      Revenue quality cannot be underwritten without knowing how much top line is recurring software versus lower-margin
      or nonrepeatable project revenue.
    diligencePath: Request a 2024-to-LTM revenue bridge by product line customer segment and delivery model.
    relatedQuestionRefs:
      - QI001
      - QI003
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: List versus realized pricing, contract length, discounting behavior, services attach rate, and channel economics.
    whyItMatters: Missing pricing data blocks ACV, gross-margin, and payback analysis even when demand appears real.
    diligencePath: Obtain standard order forms sample SOWs and cohort-level realized pricing by customer type.
    relatedQuestionRefs:
      - QI004
      - QI005
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: margin-structure
    missingEvidence: Gross margin by software, services, and hardware or edge deployment plus cloud or GPU cost burden.
    whyItMatters: Margin structure determines whether the business scales like software or absorbs service and infrastructure drag.
    diligencePath: Request gross-margin waterfalls and cost-of-revenue allocation by offering.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: >-
      Cash balance, monthly burn, debt or project-finance obligations, option-pool dilution, and liquidation-preference
      terms for the current round.
    whyItMatters: A breakeven target cannot be tested without starting liquidity, burn, and financing-stack detail.
    diligencePath: Review cash forecast board materials debt schedules and the current term sheet or definitive financing documents.
    relatedQuestionRefs:
      - QI006
  - type: missing-source
    severity: material
    topic: contract-value
    missingEvidence: >-
      Awarded dollars, obligated amounts, and multi-year production conversion status for the Army-linked work
      highlighted in the retained pool.
    whyItMatters: >-
      Prototype or SBIR wins can validate demand without contributing material recurring revenue, so contract value
      matters for capital planning.
    diligencePath: Pull complete award records and reconcile them against booked revenue and forward pipeline.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: implementation-depth
    missingEvidence: >-
      Public API references, integration matrices, pricing or packaging detail, and architecture documentation that goes
      beyond marketing-level workflow claims.
    whyItMatters: >-
      Without implementation-depth evidence, it is hard to judge deployment friction, integration effort, and whether
      the product is repeatable across customer environments.
    diligencePath: >-
      Request technical documentation, sample architecture diagrams, reference implementation material, and a current
      integration catalog from Seekr.
    relatedQuestionRefs:
      - QE002
      - QE003
      - QE004
  - type: private-evidence-only
    severity: material
    topic: reliability-and-governance-proof
    missingEvidence: >-
      Independent benchmark results, uptime or incident history, security and compliance attestations, and customer
      audit evidence for the explainability layer.
    whyItMatters: >-
      Seekr's core differentiation is governance and trustworthiness, so lack of third-party operating proof directly
      limits confidence in the platform's defensibility.
    diligencePath: >-
      Obtain security and compliance documentation, customer references, validation reports, and any status-history or
      SLA materials.
    relatedQuestionRefs:
      - QE006
      - QE008
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Public code repositories, package telemetry, active model or dataset artifacts, or practitioner-community evidence
      beyond the sparse Hugging Face organization page.
    whyItMatters: >-
      A thin public developer surface does not disprove product maturity, but it reduces outside evidence on adoption
      velocity, ecosystem traction, and implementation depth.
    diligencePath: >-
      Request GitHub or package-registry references, community participation metrics, and named technical talks or
      practitioner integrations.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: >-
      Public or diligence-room disclosure of NRR, GRR, churn, contract length, deployment utilization, and top-customer
      concentration by public-sector versus commercial segment.
    whyItMatters: >-
      Without durability and concentration data, the refreshed customer story can show adoption motion but cannot show
      revenue resilience or expansion quality.
    diligencePath: >-
      Request cohort retention tables, renewal schedules, customer concentration by ARR/revenue, and segment-level gross
      retention from management.
