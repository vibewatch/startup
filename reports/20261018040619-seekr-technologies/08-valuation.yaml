      Seekr looks real enough to keep diligencing, but the public evidence does not justify paying a $1.2
      billion valuation that already implies more than 66x disclosed 2024 revenue before audited economics
      and financing terms are available.
    claimRefs: [CV001, CV002, CV011, CV012, CV016]
