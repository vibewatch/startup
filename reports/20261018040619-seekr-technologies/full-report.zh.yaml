        - 倍数压缩、稀释、清算优先权，或试点转为持久部署的转化乏力。
        - 未达到盈亏平衡指引、合同转化乏力，或条款经济性偏向新资本而非现有普通股股东。
    notes: 情景结果有意保持定性，因为保留的公开证据没有披露经审计的单位经济性、股权结构条款，也没有足够数据支持精确估值区间。
