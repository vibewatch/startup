        title: 融资状况、已披露规模与利益相关方依赖
        blocks:
          - type: paragraph
            body: >-
              指定来源池中最清晰的融资数据点，是公司于 2025 年 6 月宣布计划募资 $100M，由 Danu Venture Group 和 AMD Ventures 领投，估值 $1.2B；管理层称首笔交割已于
              2025 年 6 月 17 日完成。同一公告还给出后续章节会谨慎引用的经营指标：2024 年收入超过 $18M、客户超过 30 家、终端用户超过 100,000
              人。这些数字有参考价值，但仍是公司自报。得到更好交叉验证的是利益相关方结构：指定来源池反复把 Seekr 与 OCI、AWS 分销、政府项目、GDIT 和 Enabled Intelligence
              联系起来，说明生态杠杆和防务采购是其进入市场的核心，而非边缘试验。缺失部分包括最终募资规模、股权结构及其经济条款、债务，以及按客户或项目划分的集中度。
