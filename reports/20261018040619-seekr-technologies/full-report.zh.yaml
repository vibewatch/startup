      - number: '8.3'
        title: 为什么当前价格仍没有公开证据支撑
        blocks:
          - type: paragraph
            body: >-
              反方论点不在于 Seekr 是否有动能，而在于没有私下尽调时，投资者能否为今天的已披露价格辩护。保留的几乎所有运营证明都由公司控制，包括收入、客户、现金流、产品、专利和商业化披露。保留来源池中唯一公开估值基准是
              Palantir；其倍数从 2024 年年中 24.13x 的市销率，先升至 2025 年年中 99.47x，随后在 2026 年 8 月下旬回到约 72.72x。以已经接近这一公开基准的 Seekr
              价格买入，几乎不给执行失误、倍数压缩或融资条款不利变化留下空间。管理层关于盈亏平衡的指引方向上令人鼓舞，但不能替代经审计收入质量、利润率、消耗率或集中度披露。
            claimRefs:
              - CV005
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: 情景闸门、尽调要求与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              乐观情景是，Seekr 的可信 AI
              定位、防务牵引和商业扩张持续快速复利，足以支撑或兑现已披露估值。基准情景是，平台可信，但在投资者能够判断目标回报之前，仍需要经审计的收入质量、现金创造能力和融资文件支持。悲观情景是，商业化转化较弱、试点向持久项目推进较慢，或融资条款稀释普通股上行空间，从而触发估值重置。在判断是否入场前，投资者应索取经审计财务数据、详细管理账目、主要政府和商业项目的合同金额及期限，以及
              2025 年融资的已签署条款清单和股权结构表。若无法通过这些闸门，应将该标的留在观察名单，而不是纳入已出资组合。
