  - id: FI001
    title: 公开收入模式链路图
    type: flow
    summary: 现有来源展示了 SeekrFlow 如何从客户数据和部署工作流走向商业收入，但没有披露各环节的价格点或毛利获取。
    data:
      nodes:
        - id: customer-data
          label: 客户数据与任务工作流
          detail: 企业和政府客户带来专有数据或任务数据，以及高风险工作流。
          claimRefs:
            - CI007
            - CI011
        - id: data-prep
          label: 数据准备与验证
          detail: SeekrFlow 的定位是在一个系统中处理数据准备、模型训练、验证和可解释性。
          claimRefs:
            - CI006
            - CI012
        - id: model-stack
          label: 模型调优、检索与编排
          detail: 该平台支持微调、检索、BYO 模型和智能体编排，不依赖单一黑箱模型。
          claimRefs:
            - CI006
            - CI007
            - CI012
        - id: deployment
          label: 生产环境部署
          detail: 产品面向云端、本地、边缘和物理隔离环境部署，并配有监控和运营控制。
          claimRefs:
            - CI007
            - CI009
            - CI014
        - id: use-cases
          label: 企业与国防使用场景
          detail: 收入需求似乎来自企业应用、与陆军相关的试点，以及受监管或主权 AI 工作负载。
          claimRefs:
            - CI010
            - CI013
            - CI014
        - id: monetization
          label: 变现与毛利获取
          detail: 公开来源确认了收入和牵引力，但定价组合、合同金额和毛利率获取仍未披露。
          claimRefs:
            - CI003
            - CI004
            - CI008
            - CI016
      edges:
        - from: customer-data
          to: data-prep
          label: 摄入并结构化
          claimRefs:
            - CI006
        - from: data-prep
          to: model-stack
          label: 训练并编排
          claimRefs:
            - CI006
            - CI012
        - from: model-stack
          to: deployment
          label: 部署并监控
          claimRefs:
            - CI007
            - CI009
        - from: deployment
          to: use-cases
          label: 驱动客户工作负载
          claimRefs:
            - CI010
            - CI013
            - CI014
        - from: use-cases
          to: monetization
          label: 把使用转成合同
          claimRefs:
            - CI003
            - CI004
            - CI008
            - CI016
    approximationNotes: 工作流阶段都有来源支撑，但各阶段如何转化为定价和毛利，公开资料没有量化。
    claimRefs:
