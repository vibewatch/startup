figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 公开披露的里程碑显示，Seekr 从产品发布一路推进到国防奖项、基础设施合作、合规里程碑和国际扩张。
    data:
      items:
        - date: 2024-06
          label: SeekrFlow 发布
          details: 投资者材料将旗舰平台的发布时间定为 2024 年 6 月。
          tone: positive
        - date: 2025-05
          label: 陆军 SBIR 奖项
          details: ExecutiveBiz 报道了两项陆军 SBIR 奖项，涵盖 Project Linchpin 以及边缘或严苛环境下的 AI/ML 工作。
          tone: positive
        - date: 2025-06
          label: OCI 协议与已宣布的融资轮
          details: 投资者材料提到一项多年期 OCI 协议；Seekr 宣布计划按 $1.2B 估值融资 $100M，且已完成首次交割。
          tone: positive
        - date: 2025-09
          label: SeekrFlow 产品更新
          details: Seekr 宣布 Structured Outputs、Custom Tools 和 GRPO Fine-Tuning，以简化企业部署。
          tone: positive
        - date: 2025-12
          label: SeekrGuard 发布与 SOC 2 Type II
          details: 公司材料称 Seekr 发布了 SeekrGuard，并于 2025 年 12 月达到 SOC 2 Type II 合规。
          tone: positive
        - date: 2026-01
          label: 陆军网络漏洞合同
          details: Inside Defense 报道了另一份陆军智能体 AI 合同，用于识别网络、系统和任务漏洞，但称合同金额未披露。
          tone: risk
        - date: 2026-03
          label: GDIT 合作
          details: Seekr 称已开始与 GDIT 合作，为政府任务提供智能体 AI 解决方案。
          tone: positive
        - date: 2026-07
          label: CMMC Level 2 与 Enabled Intelligence
          details: 公司材料称 Seekr 于 2026 年 7 月取得 CMMC Level 2 认证，并与 Enabled Intelligence 建立合作。
          tone: positive
        - date: 2026-10
