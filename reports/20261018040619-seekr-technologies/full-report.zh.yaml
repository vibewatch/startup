      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 建议：在当前已披露估值下继续研究
            body: Seekr 足够真实，值得继续尽调；但在经审计经济性和融资条款尚不可得之前，公开证据不足以支持支付 $1.2B 估值，而这一估值已经对应超过 66x 的已披露 2024 年收入。
