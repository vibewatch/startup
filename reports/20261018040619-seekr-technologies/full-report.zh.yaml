  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 现有公开证据先把 Seekr 放在宽泛的生成式 AI 市场与狭窄的治理细分市场之间，再进一步收窄到 Seekr 披露的商业化切入口。
    data:
      items:
        - label: 宽口径邻近市场：全球生成式 AI（2026）
          displayValue: USD 55.51bn
          note: Precedence Research 的宽口径市场估算。
          claimRefs:
            - CM005
        - label: 预计宽口径邻近市场（2035）
          displayValue: USD 1,206.24bn
          note: Precedence Research 的长期预测。
          claimRefs:
            - CM005
        - label: 窄邻近市场：AI 治理（2026）
          displayValue: USD 610.5m
          note: Coherent Market Insights 的治理专属细分市场。
          claimRefs:
            - CM006
        - label: 预计 AI 治理市场（2033）
          displayValue: USD 8,970.1m
          note: Coherent Market Insights 的长期预测。
          claimRefs:
            - CM006
        - label: Seekr 披露的客户切入口
