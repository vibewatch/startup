        - 商业和政府项目持续增加，产品覆盖面继续扩大，经审计的经济性显示增长能在 2024 年基线上延续。
        - 只有收入规模明显高于当前公开基数、且利润率证明具有吸引力，披露的 $1.2B 估值才守得住或能被超越。
        - 试点转项目延期、商业转化变慢，或利润率弱于隐含水平。
        - 经审计的 2025/2026 年收入加速、已披露合同金额，以及达到盈亏平衡指引的证据。
      - - 基准
        - 平台和牵引力确实存在，但公开证据对经济性和融资条款的披露仍太浅。
        - 当前价格尚不足以作投资判断；预期回报取决于尽调能否证明收入质量、集中度和下行保护。
        - 在审计数据或条款清单审阅前就付出过高价格。
        - 管理层分享经审计财务数据、客户构成和 2025 年融资文件，且没有不利意外。
      - - 悲观
        - 收入质量令人失望，商业化范围窄于营销节奏所暗示的水平，或融资条款让普通股上行空间居于次位。
