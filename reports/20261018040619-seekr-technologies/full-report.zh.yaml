      - number: '1.4'
        title: 里程碑节奏与现有证据仍无法证明的事项
        blocks:
          - type: paragraph
            body: >-
              Seekr 的里程碑节奏是真实的：来源池支持其在 2024 年年中至 2026
              年末持续推进产品发布和更新、防务奖项、基础设施合作及合规里程碑。这很重要，因为它说明公司在估值上调后仍在增加分销和合规层，而不是只靠一条融资新闻。谨慎也同样重要。几项会直接影响投资判断的核心事实仍不可得或缺乏充分交叉验证，包括员工人数、董事会结构、客户集中度、利润率、2025
              年融资的最终经济条件，以及公开可见的防务合同是否已从高信号但有限的试点扩展为持久的多年期收入。Inside Defense 报道称 2026 年 1
              月合同金额未披露，这是一个狭窄的不利披露点，但不能据此推导出更广泛的不利记录。因此，本章没有出现诉讼或监管处罚，应视为信息缺口，而非已获清除的风险。
