      - CI014
      - CI016
  - id: FE001
    title: SeekrFlow 产品架构图
    type: stack
    summary: 公开披露的架构层从企业数据准备一路延伸到模型适配、可解释性、部署和生产运营监督。
    data:
      layers:
        - label: 企业与任务数据
          detail: 非结构化内部数据和任务数据是这套架构的起点。
          items:
            - 文档
            - 传感器与图像数据
            - 企业上下文
          modules:
            - AI-Ready Data Engine
            - 智能体数据准备
          outputs:
            - 可供微调和检索的 LLM 就绪数据集
        - label: 模型适配
          detail: Seekr 称团队可以带入自有模型，也可以使用领先的开源选项。
          items:
            - 开源模型
            - 客户选择的模型
          modules:
            - 微调
            - 增强检索
            - 支持 RAG 和非 RAG
          outputs:
            - 领域专用应用和智能体
        - label: 可解释性与验证
          detail: 治理控制被定位为核心层，而不是附加功能。
          items:
            - 数据归因
            - 置信度评分
          modules:
            - 提示词对比
            - 错误根因分析
          outputs:
            - 可提出质疑且可审计的输出
        - label: 部署与推理
          detail: 部署路径面向控制要求高的企业和政府环境设计。
          items:
            - SaaS
            - 私有云
            - 本地部署
          modules:
            - 边缘部署
            - 物理隔离部署
            - 优化推理
          outputs:
            - 生产模型上线
        - label: 监控与运营
          detail: 部署后持续监控生产环境，运营回路由此闭合。
          items:
            - 实时仪表盘
            - 生产监控
          modules:
            - 部署跟踪
            - 兼容性与自动扩缩容
          outputs:
            - 运营可见性与控制
        - label: 任务与企业使用场景
          detail: 最外层是一组受监管且任务关键型的工作流，而不是单一应用。
          items:
            - 国防与情报
            - 银行与合规
            - 制造运营
          modules:
            - 偏差降低
            - 漏洞分析
            - 文档审查
          outputs:
            - 决策支持与可信 AI 工作流
    approximationNotes: 这套架构综合产品页面、资源中心内容和陆军 / SBIR 描述；它是已披露层级的概念图，不是代码级或网络级架构图。
    claimRefs:
      - CE002
      - CE004
      - CE005
      - CE006
      - CE010
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Seekr 的公开客户路径从受监管需求和采购主导的验证开始，随后扩展到商业市场，但尚未披露留存经济性。
    data:
      items:
        - label: 受监管需求触发
          summary: >-
            Buyers come from high-stakes sectors where explainability, auditability, and control are part of the
            purchase decision.
          touchpoints:
            - 行业重点：国防、电信、金融、关键基础设施
            - 部署需求：云端、本地、边缘和物理隔离选项
        - label: 治理要求较重的评估
          summary: >-
            The retained 2026 material frames governance, explainability, and audit readiness as the gatekeepers for
            moving beyond pilots.
          touchpoints:
            - 大多数组织仍无法走出试点阶段
            - 合规审查和审计准备主导评估
        - label: 原型或采购验证
          summary: >-
            The deepest public evidence is the Army book of business, which is specific and paid for but still
            procurement-shaped.
          touchpoints:
            - 2 个 Phase I 奖项；1 个 Phase II 奖项
            - $2,496,719 在 SBIR.gov 上公布的总授予金额
        - label: 工作流集成
          summary: Product updates are aimed at embedding Seekr into customer systems rather than staying at a demo layer.
          touchpoints:
            - 用 Structured Outputs 对接 schema、API、仪表盘和数据库
            - Custom Tools 将智能体接入专有系统
        - label: 生产环境部署
          summary: Seekr markets fast deployment and monitoring as the bridge from prototype to governed production.
          touchpoints:
            - 30 分钟或更短时间上线生产 LLM
            - 五次点击完成部署，并实时监控生产环境
        - label: 扩张验证缺口
          summary: >-
            Commercial references now span logistics and retail, but the retained set still lacks renewal, cohort, and
            concentration evidence.
          touchpoints:
            - Murex 和 Anderson 仅有公告层面的证明
            - 没有公开的 NRR、GRR、流失率或头部客户指标
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU006
      - CU010
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 只要估值预期依赖公司自述证据而非外部运营数据，剩余风险严重度就仍处于最高水平。
    data:
      columns:
        - label: 可能性
          note: 未来 12 至 24 个月内的概率。
        - label: 剩余风险严重度
          note: 扣除当前公开缓释措施后的剩余严重度。
      rows:
        - label: 模型可靠性与可审计性证明
          values:
            - label: 高
            - label: 高
        - label: 安全与合规证据深度
          values:
            - label: 中
            - label: 高
        - label: 政府与合作伙伴集中度
          values:
            - label: 中高
            - label: 高
        - label: 客户集中度披露
          values:
            - label: 中
            - label: 高
        - label: 采购与主权阻力
          values:
            - label: 中
            - label: 中高
        - label: 融资与估值执行
          values:
            - label: 高
            - label: 高
    claimRefs:
      - CR013
      - CR014
      - CR015
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 产品广度和牵引力让 Seekr 仍值得继续评估，但估值支撑仍未通过公开证据检验。
    data:
      nodes:
        - id: product
          label: 产品 / 部署证明
          detail: 在云端、本地、边缘和物理隔离环境中集成数据准备、可解释性和部署。
          tone: positive
        - id: traction
          label: 牵引力证明
          detail: 30+ 个客户、100,000+ 名终端用户、两项陆军 SBIR 奖项，以及 2026 年持续发布的商业公告。
          tone: positive
        - id: financing
          label: 融资信号
          detail: $1.2B 估值和计划融资 $100M 的首次交割显示投资者对公司有兴趣。
          tone: neutral
        - id: benchmark
          label: 公开可比基准
          detail: Palantir 经历历史倍数大幅波动后，目前交易倍数接近销售额的 72.72 倍。
          tone: neutral
        - id: gaps
          label: 未闭合的尽调缺口
          detail: 现有公开证据中，经审计的单位经济性、集中度和融资条款仍是未解问题。
          tone: risk
        - id: recommendation
          label: 建议：research-more
          detail: 在经济性和本轮条款得到证明前，不要对当前披露价格作投资判断。
          tone: risk
      edges:
        - from: product
          to: traction
          label: 支持
        - from: traction
          to: financing
          label: 有助于解释
        - from: financing
          to: benchmark
          label: 必须跨过
        - from: benchmark
          to: gaps
          label: 受……收紧
        - from: gaps
          to: recommendation
          label: 导向
    claimRefs:
      - CV003
      - CV004
      - CV006
      - CV008
      - CV010
      - CV011
      - CV013
      - CV016
