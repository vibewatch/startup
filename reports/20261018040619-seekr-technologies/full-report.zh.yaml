            body: >-
              资本充足性仍是公开记录中最薄弱的部分。当前刷新来源池支持以下事实：Seekr 发起由 Danu Venture Group 和 AMD Ventures 领投的计划募资
              $100M，完成了首笔交割，二手报道给出的估值约为 $1.2B。管理层还称预计在 12
              个月内达到现金流盈亏平衡。但同一证据池仍缺少检验这一说法所需的资产负债表事实：没有公开现金余额、消耗率、债务负担、优先股堆叠，也没有公开材料中所强调联邦业务的经验证项目价值披露。因此，公司可能确有真实需求，但在能够负责任地判断下行空间之前，仍需要私下融资披露。
