              - CO016
      - number: '1.2'
        title: 管理层梯队、治理透明度与关键人物集中度
        blocks:
          - type: paragraph
            body: >-
              当前公开披露的管理层阵容已明显超出早期种子公司常见水平：Seekr 列出创始人兼 CEO、总裁、首席技术与 AI 官、COO、CFO、CRO 和
              CMO，顾问委员会成员也包括国家安全、金融和法律人士。这种职能覆盖说明公司具备面向企业、防务和受监管市场销售所需的基础。更大的尽调问题不在职位是否齐全，而在治理是否透明。在指定来源池内，Seekr
              提供了顾问委员会简介和高管履历，却没有披露正式董事会、委员会架构、投票控制权或股权集中度。叙事也明显由创始人和总裁主导；若下一轮融资或政府交付节奏依赖少数外部关系掌握者，关键人物风险会更高。
