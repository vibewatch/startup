  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与治理证明仍是故事中独立验证最少的部分
        blocks:
          - type: paragraph
            body: >-
              Seekr 围绕面向企业、政府及其他受监管用例的可信 AI
              打造公开定位；其产品材料明确表示，可解释性、来源追溯、置信度评分和可追踪性是平台的核心组成。这些不是泛泛的营销语言：公司称用户可以把输出追溯到有影响力的训练样本和原始文档片段，查看完整智能体轨迹，并将系统部署到包括物理隔离环境在内的敏感环境。风险在于，这些控制大多仍只出现在公司控制的材料中，而指定来源池没有提供事故历史、诉讼、执法活动或底层认证文件的独立验证，只有一项关于
              SOC 2 Type II 合规的公开公司主张。对于一家面向防务和受监管企业销售的公司，尽调重点因此不是控制语言是否存在，而是客户、审计师和采购团队是否已在生产环境中验证这些控制。
