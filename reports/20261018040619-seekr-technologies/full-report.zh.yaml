    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与运营版图
        blocks:
          - type: paragraph
            body: >-
              Seekr 将自己描述为一家成立于 2021 年、总部位于弗吉尼亚州 Reston 的私营人工智能公司，专注于为关键基础设施、政府和企业部署提供可信、可解释的 AI。在其 AI
              信息页、产品页和投资者材料中，公司始终把 SeekrFlow 定位为一套操作系统，用于在云端、本地、边缘和物理隔离环境中构建、验证、部署并治理模型或智能体。同一批材料把 Seekr
              描绘成平台型厂商，而非单点解决方案初创公司；当前投资者页面还披露其拥有 36 项已授权和待授权专利。公开材料也显示其版图不止一个美国办公室：总部在 Reston，另列有 Austin、Palm Beach
              Gardens 和 London 等地点。
            claimRefs:
              - CO001
              - CO002
              - CO016
