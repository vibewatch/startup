  - id: FP001
    title: 定位取舍：控制力与采用便利性
    type: quadrant
    xAxisLabel: 部署控制力 / 受监管环境适配度（1=低，5=高）
    yAxisLabel: 分销 / 采用便利性（1=低，5=高）
    summary: 1-5 的序数定位综合指定证据，展示主要替代类别如何在部署控制力与生态便利性之间取舍。
    data:
      points:
        - label: Seekr
          x: 5
          'y': 2
          note: 明确支持物理隔离和本地部署；但没有公开价格信号。
          claimRefs:
            - CP002
            - CP015
            - CP016
        - label: Palantir 式平台
          x: 5
          'y': 3
          note: 高安全性和任务关键型能力依然突出，但实施和签约阻力更大。
          claimRefs:
            - CP007
            - CP011
        - label: Databricks
          x: 3
          'y': 4
          note: Lakehouse、治理以及混合云或多云支持，配合更低摩擦的商业方案。
          claimRefs:
            - CP008
            - CP011
        - label: Snowflake
          x: 3
          'y': 4
          note: 强大的数据共享与治理替代方案，采用按量计费的商业模式。
          claimRefs:
            - CP009
            - CP011
        - label: Microsoft Fabric
          x: 3
          'y': 5
