      - number: '3.3'
        title: 既有厂商可以靠分销和打包能力赢得默认路径
        blocks:
          - type: paragraph
            body: >-
              支持 Seekr 细分市场的同一批证据也说明，大型替代方案不必在每个技术维度都胜过 Seekr，就能赢下客户。独立竞争报道认为 Palantir 仍在任务关键、高安全环境中领先，而
              Databricks、Snowflake 和 Microsoft Fabric 则凭借更低摩擦的定价、更容易的采用以及与现有企业资产更紧密的结合展开竞争。Seekr
              自有材料显示合作伙伴和渠道在扩张，但公开定价和实际竞争胜率证据仍有限，因此公开材料尚不足以证明 Seekr 能在规模化情况下稳定替换打包式既有厂商。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
