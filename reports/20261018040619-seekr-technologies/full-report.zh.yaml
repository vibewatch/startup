      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              从财务角度看，Seekr 更像“可信但披露不足”，而非已被明确证明。正面证据真实存在：已披露的 2024 年收入超过 $18M、客户和用户规模、与 Army 相关的原型项目，以及围绕高风险 AI
              部署的治理、可解释性和成本控制产品叙事。负面证据同样真实：没有公开价目表、收入结构、毛利桥、回款或营运资金细节、CAC
              或回本期披露，也没有保留来源集合中公共部门项目的经验证合同金额。综合来看，收入质量可评为可信但未经证明，利润路径可评为可能但未经验证；在拿到管理层材料前，资本需求还不足以纳入投资判断。
