  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >
              保留来源始终把 Seekr 定位在原始模型访问之上、完整业务工作流之下。SeekrFlow 被描述为一套用于构建、验证、部署和扩展可信 AI
              的完整操作系统，因此相关支出包括数据准备、检索或微调、部署自动化、可解释性和生产监控，而不只是基础模型推理。这一边界排除了广泛的消费者 AI 使用，也排除了 Seekr 已拥有完整生成式 AI TAM
              的任何说法。实际替代方案是把模型供应商、检索层、治理工具和部署运维分别拼接起来的内部技术栈；Seekr 的卖点是，统一且能感知来源的技术栈可以为生产环境买家减轻整合负担。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM010
              - CM012
      - number: '2.2'
        title: 公开市场规模口径界定机会，但不能直接推出 TAM
        blocks:
          - type: paragraph
            body: >
              本章来源池提供了两个可信但不相同的市场口径。Precedence Research 给出宽口径：全球生成式 AI 规模在 2026 年为 USD 55.51 billion，2035 年升至 USD
              1,206.24 billion。Coherent Market Insights 给出窄口径：AI 治理规模在 2026 年为 USD 610.5 million，2033 年升至 USD 8,970.1
              million。Seekr 的产品覆盖两类，因为它既销售工作流基础设施，也销售可解释性和治理控制，因此两项公开估算都不是 Seekr 的直接 TAM。正确解读是，宽口径说明企业 AI
              现代化的需求引力，窄口径则说明在 Seekr 瞄准的具体环境中，治理、可审计性和控制能力为何能获得预算。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM009
      - number: '2.3'
        title: 买方、用户与付费方图谱
        blocks:
          - type: paragraph
            body: >
              保留证据指向多方参与的采购流程。Seekr
              自有产品页和思想领导力页面把企业平台团队、受监管行业运营方和政府项目列为真正买家，因为他们在批准上线前需要部署控制、可解释性和可审计输出。用户是构建或监督智能体工作流的运营团队；付费预算更可能来自中央平台、任务、安全或数字化转型预算，而不是可自由支配的试验经费。Seekr
              已披露的客户数和终端用户数显示出一定商业牵引，但同一批来源也表明，采用通常从具体工作流或任务痛点开始，而不是一次性由一个自上而下的预算覆盖所有用例。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM009
              - CM010
              - CM011
              - CM013
              - CM014
      - number: '2.4'
        title: 采用约束、估值相关性与证据缺口
        blocks:
          - type: paragraph
            body: >
              来源池中最重要的约束不是 AI 需求是否存在，而是企业能否足够信任输出，从试点转入持久的生产预算。Seekr
              自有材料和保留的市场报告反复指出，幻觉风险、可审计性要求、数据责任、技能短缺和更严格的治理预期都会刹住采用。它们与估值直接相关，因为这些摩擦会拉长销售周期，并把可服务切口收窄到真正面临合规或任务痛点的买家。更重要的是，公开证据没有按地域、垂直行业或预算负责人拆分
              Seekr 自己可获取的市场。相邻市场增长与公司实际捕获之间缺少这座桥，是本章的核心尽调缺口。
            claimRefs:
              - CM007
              - CM009
              - CM010
              - CM012
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: Seekr 最合适的市场定位是防御型 AI 基础设施
            body: 保留证据支持一个比“所有生成式 AI”更窄的框架：Seekr 位于部署、可解释性、治理和生产控制的交叉点，服务企业和政府买家。
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM007
          - type: callout
            title: 公开 TAM 尚不能证明 Seekr 的直接 SAM/SOM
            body: 相邻市场增长清晰，但现有来源池没有按地域和采购路径拆分收入结构、细分市场转化率或可获取份额。
            calloutType: risk
            claimRefs:
              - CM007
              - CM009
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：买家可以用多种方式解决同一任务
        blocks:
          - type: paragraph
            body: >-
              Seekr 的竞争对象不只是其他模型供应商。在指定证据中，买家至少有四条路径可以解决同一项受监管企业 AI 任务：Seekr 自有的可解释性优先操作系统、Palantir
              式本体和任务平台、Databricks、Snowflake 及 Microsoft Fabric 等云原生数据与 AI
              技术栈，或在买家现有云和数据资产上内部搭建。因此，真正的竞争集合混合了直接对手、既有厂商、替代方案和现状选项，而不是一个整齐的同类公司群。
            claimRefs:
