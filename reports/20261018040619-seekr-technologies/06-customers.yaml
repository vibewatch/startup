      - ["Logistics / manufacturing operations", Operations and knowledge-workflow owners, Auditable document intelligence and operational AI, "Murex announcement plus Fortune 500 secure-logistics case-study title", "Cross-vertical expansion beyond public sector", "Outcome metrics and production depth are not public in retained evidence"]
      - ["Retail / edge deployment", Field operations and retail execution teams, Edge AI in distributed environments, "Anderson Merchandisers announcement title on refreshed company page", "Shows Seekr can message outside defense-first wedge", "No public deployment scale, contract size, or retention proof"]
