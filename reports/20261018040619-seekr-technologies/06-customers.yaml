  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-gap
      missingEvidence: Public or diligence-room disclosure of NRR, GRR, churn, contract length, deployment utilization, and top-customer concentration by public-sector versus commercial segment.
      whyItMatters: Without durability and concentration data, the refreshed customer story can show adoption motion but cannot show revenue resilience or expansion quality.
      diligencePath: Request cohort retention tables, renewal schedules, customer concentration by ARR/revenue, and segment-level gross retention from management.
      relatedQuestionRefs: [QU007]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: Case-study detail showing whether Murex, Anderson Merchandisers, Enabled Intelligence, and the Fortune 500 logistics account are pilots, production deployments, or renewed accounts.
      whyItMatters: Title-level announcements do not establish deployment depth, ROI, or repeatability across logos.
      diligencePath: Ask for customer reference calls, signed case studies, deployment scopes, and live-production dates for each named logo.
      relatedQuestionRefs: [QU003, QU006]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: product-outcomes
      missingEvidence: Denominators, sample sizes, and customer contexts behind the claimed 3x accuracy improvement, 80% reduction in manual tasks, and 30-minute production deployment.
      whyItMatters: Without customer-specific baselines, it is unclear whether the marketed outcomes are repeatable procurement proof points or controlled internal benchmarks.
      diligencePath: Request the underlying customer studies, measurement methodology, and account-level before/after examples for the headline performance claims.
      relatedQuestionRefs: [QU004, QU005]
