      - [Army SBIR Phase I awards, 2, "2025", "SBIR.gov + Seekr Army announcement", High, "Shows multiple Army entry points", "No program-office spend beyond listed awards"]
      - [Army SBIR Phase II awards, 1, "2025", "SBIR.gov + Seekr Army announcement", High, "At least one Army relationship progressed beyond Phase I", "No evidence of multi-year program-of-record status"]
      - [Total Army SBIR dollars disclosed, "$2,496,719", "2025", SBIR.gov portfolio, Medium, "Concrete public adoption proof with dollar value", "No margin, revenue recognition, or renewal context"]
      - [Murex public customer announcement, "Listed on company surfaces", "2026-09-03", "Seekr about page + resource center", Medium, "Commercial logo breadth is expanding", "No deployment KPI or contract size disclosed"]
      - [Anderson Merchandisers public customer announcement, "Listed on company surface", "2026-07-21", "Seekr about page", Medium, "Retail / edge go-to-market is active", "No usage, rollout scope, or renewal proof disclosed"]
    notes: >-
      This is a public-proof trajectory, not a revenue bridge; titles and procurement data show motion, but they do not reveal active-user counts, ACV, or customer concentration.
    claimRefs: [CU006, CU009, CU010, CU011]
  - id: TU003
