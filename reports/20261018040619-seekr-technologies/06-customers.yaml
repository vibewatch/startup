      - [Murex, Logistics, "AI-powered operations with a flexible, model-agnostic approach", Unknown, "Named commercial announcement appears on refreshed company surfaces", "Public proof is title-level only; no KPI, budget, or production depth disclosed"]
      - ["Anderson Merchandisers", Retail / edge operations, "Edge AI deployment 'to the last 100 feet of retail across the US'", Unknown, "Named commercial announcement appears on refreshed company surface", "Public proof is title-level only; no rollout size, value, or retention evidence disclosed"]
    notes: >-
      Enumeration is partial and limited to named proofs retained in the assigned pool; rows distinguish real public references from verified production or renewal evidence.
    enumerationScope:
      coverage: partial
      basis: >-
        Limited to retained 2025-2026 public customer announcements and procurement records visible in the assigned source pool; excludes private references and inaccessible case materials.
    claimRefs: [CU007, CU008, CU009, CU010, CU011, CU015]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Seekr's public customer motion starts with regulated demand and procurement-led validation, then widens into commercial expansion without yet disclosing retention economics.
    data:
      items:
        - label: Regulated demand trigger
          summary: Buyers come from high-stakes sectors where explainability, auditability, and control are part of the purchase decision.
          touchpoints:
            - "Sector focus: defense, telecom, finance, critical infrastructure"
            - "Deployment needs: cloud, on-premises, edge, and air-gapped options"
        - label: Governance-heavy evaluation
          summary: The retained 2026 material frames governance, explainability, and audit readiness as the gatekeepers for moving beyond pilots.
          touchpoints:
            - "Most organizations still cannot get past pilots"
            - "Compliance review and audit readiness dominate evaluation"
        - label: Prototype or procurement proof
          summary: The deepest public evidence is the Army book of business, which is specific and paid for but still procurement-shaped.
          touchpoints:
            - "2 Phase I awards; 1 Phase II award"
            - "$2,496,719 total awarded on SBIR.gov"
        - label: Workflow integration
          summary: Product updates are aimed at embedding Seekr into customer systems rather than staying at a demo layer.
          touchpoints:
            - "Structured Outputs for schemas, APIs, dashboards, and databases"
            - "Custom Tools connect agents to proprietary systems"
        - label: Production deployment
          summary: Seekr markets fast deployment and monitoring as the bridge from prototype to governed production.
          touchpoints:
            - "30 minutes or less for a production LLM"
            - "Five-click deployment and real-time production monitoring"
        - label: Expansion proof gap
          summary: Commercial references now span logistics and retail, but the retained set still lacks renewal, cohort, and concentration evidence.
          touchpoints:
            - "Murex and Anderson are announcement-level proof"
            - "No public NRR, GRR, churn, or top-customer metrics"
    claimRefs: [CU002, CU003, CU004, CU006, CU010, CU014]
callouts:
  - calloutType: strength
    title: Real government sponsorship plus widening commercial logos
    body: >-
      The customer story is credible because it combines independent government procurement evidence with a
      growing list of named commercial and operational references in logistics, retail, and defense-intelligence.
    claimRefs: [CU007, CU010, CU011]
  - calloutType: risk
    title: Public proof is still ahead of public durability data
    body: >-
      Seekr has enough evidence to show adoption motion, but not enough to prove renewal quality, account
      expansion, or concentration risk, so customer quality still depends on diligence access to pipeline,
      contract, and cohort data.
    claimRefs: [CU008, CU011, CU013, CU014]
