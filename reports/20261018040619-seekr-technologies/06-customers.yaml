schemaVersion: report-v2
artifact: customers
slug: seekr-technologies
runDate: 2026-10-18
company:
  name: Seekr Technologies
chapter:
  number: 6
  title: Customers
  summary: >-
    Seekr's public customer proof is strongest in regulated and government use cases where explainability,
    deployment control, and procurement sponsorship matter most. The refreshed evidence shows real Army
    SBIR activity and a widening set of named commercial logos in logistics, retail, and defense-intelligence,
    but public durability evidence remains thin because renewals, concentration, and retention metrics are not disclosed.
sections:
  - id: buyer-segmentation
    title: Buyer segmentation is clearly regulated and deployment-sensitive
    body: >-
      Seekr's public positioning is not aimed at generic consumer AI adoption. Across its company, product,
      and recruiting surfaces, the company consistently frames the buyer set as government agencies and
      regulated enterprises that care about explainability, data sovereignty, deployment flexibility, and
      auditable workflows. The named sectors repeat across official surfaces: defense, telecom, finance,
      critical infrastructure, logistics, manufacturing, and retail-adjacent edge use cases. That consistency
      matters because it suggests Seekr is selling into a smaller but higher-value set of buyers that accept
      high-touch deployment and governance work rather than self-serve usage alone.
    claimRefs: [CU001, CU002, CU003, CU007]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: named-proof
    title: Adoption proof is strongest in Army procurement and fresh commercial announcements
    body: >-
      The best retained customer proof is not a broad customer-count disclosure; it is a mix of government
      procurement records and official announcement titles. The U.S. Army evidence is the deepest: Seekr's
      May 2025 announcement and the refreshed SBIR.gov portfolio both show 2025 Army work spanning two
      Phase I awards and one Phase II award. Commercial proof is broader but shallower. As of the refreshed
      2026 company surfaces, Seekr is publicly associating itself with Murex in logistics, Anderson
      Merchandisers in retail, Enabled Intelligence in defense/intelligence, and an unnamed Fortune 500
      secure-logistics case study, but most of those proofs are still title-level announcements rather than
      full deployment case studies with usage, budget, or renewal evidence.
    claimRefs: [CU004, CU005, CU006, CU007, CU009, CU010, CU011, CU015]
    tableRefs: [TU002, TU003]
  - id: durability-risks
    title: Durability, expansion, and concentration are still the key customer unknowns
    body: >-
      Seekr's customer narrative is credible on category fit and growing logo breadth, but it is still weak
      on the evidence investors need to underwrite durability. The retained sources do not disclose NRR, GRR,
      churn, contract duration, deployment utilization, or top-customer concentration, and the strongest
      public proof continues to sit inside procurement or launch-announcement surfaces. Even the 2026 hiring
      evidence points to ongoing manual QA, release validation, and requirements-hardening work around
      SeekrFlow. That is consistent with a company still investing materially in customer onboarding and
      production hardening rather than one already showing scaled, low-touch expansion economics at maturity.
    claimRefs: [CU003, CU008, CU012, CU013, CU014]
