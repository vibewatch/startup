  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Public assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Commercial and government wins keep compounding, product breadth continues to improve, and audited economics
          show durable growth beyond the 2024 baseline.
        - >-
          The disclosed $1.2B valuation can be defended or exceeded only if revenue scales materially above the current
          public base and margins prove attractive.
        - Pilot-to-program slippage, slower commercial conversion, or weaker margins than implied.
        - >-
          Audited 2025/2026 revenue acceleration, disclosed contract values, and evidence that breakeven guidance was
          achieved.
      - - Base
        - Platform and traction are real, but public evidence remains too shallow on economics and financing terms.
        - >-
          Current price is not yet underwritten; expected return depends on diligence proving revenue quality,
          concentration, and downside protections.
        - Overpaying before audited data or term-sheet review.
        - Management shares audited financials, customer mix, and the 2025 round documents without adverse surprises.
      - - Bear
        - >-
          Revenue quality disappoints, commercialization proves narrower than marketing cadence suggests, or financing
          terms subordinate common-equity upside.
        - >-
          A lower effective valuation or down-round risk emerges because the current disclosed price leaves minimal room
          for execution misses.
        - >-
          Multiple compression, dilution, liquidation preferences, or weak conversion from pilots to durable
          deployments.
        - >-
          Missed breakeven guidance, weak contract conversion, or term-sheet economics that favor new capital over
          existing common holders.
    notes: >-
      Scenario outputs are deliberately qualitative because the retained public evidence does not disclose audited unit
      economics, cap-table terms, or enough data to support precise valuation ranges.
    claimRefs:
      - CV003
      - CV005
      - CV008
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV016
