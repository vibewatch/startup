  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >
              The retained sources consistently position Seekr above raw model access and below finished business
              workflows. SeekrFlow is described as a complete operating system for building, validating, deploying, and
              scaling trusted AI, which means the relevant spend includes data preparation, retrieval or fine-tuning,
              deployment automation, explainability, and production monitoring rather than only foundation-model
              inference. That boundary matters because it excludes broad consumer AI usage and also excludes any claim
              that Seekr owns the full generative-AI TAM. The practical substitutes are stitched-together internal
              stacks that combine model providers, retrieval layers, governance tooling, and deployment operations
              separately; Seekr's pitch is that a unified, source-aware stack reduces that integration burden for
              production buyers.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM010
              - CM012
      - number: '2.2'
        title: Public sizing lenses bracket the opportunity but do not yield a direct TAM
        blocks:
          - type: paragraph
            body: >
              The chapter's pool provides two credible but non-identical market lenses. Precedence Research gives the
              broad lens: global generative AI at USD 55.51 billion in 2026, rising to USD 1,206.24 billion by 2035.
              Coherent Market Insights gives the narrow lens: AI governance at USD 610.5 million in 2026, rising to USD
              8,970.1 million by 2033. Seekr's product surface spans both categories because it sells workflow
              infrastructure plus explainability and governance controls, so neither published estimate is a direct
              Seekr TAM. The right read is that the broad figure shows demand gravity for enterprise AI modernization,
              while the narrow figure shows why governance, auditability, and control can command budget in the specific
              environments Seekr targets.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
