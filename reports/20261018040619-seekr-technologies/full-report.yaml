  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - - Thesis
        - >-
          SeekrFlow shows real platform breadth across data prep, explainability, deployment, and agent tooling for
          regulated or sovereign AI use cases.
        - >-
          Independent customer proof, audited margins, and repeatable deployment metrics would strengthen the upside
          case.
      - - Thesis
        - >-
          Army SBIR awards, 30+ customers, 100,000+ end users, and 2026 commercial announcements indicate non-trivial
          market traction.
        - >-
          Named contract values, renewal data, and conversion from pilots to recurring revenue would increase
          confidence.
      - - Anti-thesis
        - The disclosed $1.2B valuation already implies >66x 2024 revenue, leaving little public margin of safety.
        - A lower entry price or a materially higher audited revenue base would reduce valuation risk.
      - - Anti-thesis
        - >-
          Most retained proof is company-controlled, while audited financials, retention, burn, concentration, and
          financing terms remain undisclosed.
        - >-
          A diligence package with audited accounts, cohort data, and executed round documents would move the stance
          toward underwriteable.
    notes: >-
      Rows pair public upside signals with the minimum diligence evidence needed to convert them into an investable
      thesis.
