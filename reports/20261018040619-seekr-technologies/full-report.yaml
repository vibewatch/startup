      - number: '2.3'
        title: Buyer, user, and payer map
        blocks:
          - type: paragraph
            body: >
              The retained evidence points to a multi-stakeholder buying motion. Seekr's own product and
              thought-leadership pages frame enterprise platform teams, regulated-industry operators, and government
              programs as the real buyers because they need deployment control, explainability, and auditable outputs
              before production approval. Users are the operating teams building or supervising agentic workflows, while
              payers are more likely to sit in central platform, mission, security, or digital-transformation budgets
              than in a discretionary experimentation line item. Seekr's disclosed customer and end-user counts show
              some commercial traction, but the same sources suggest adoption starts with concrete workflow or mission
              problems rather than a single top-down budget covering every use case at once.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM009
              - CM010
              - CM011
              - CM013
              - CM014
      - number: '2.4'
        title: Adoption constraints, valuation relevance, and evidence gaps
        blocks:
          - type: paragraph
            body: >
              The most important constraint in the pool is not whether AI demand exists, but whether enterprises can
              trust outputs enough to move from pilots into durable production budgets. Seekr's own materials and the
              retained market reports repeatedly point to hallucination risk, auditability requirements, data
              responsibility, skills shortages, and tighter governance expectations as adoption brakes. Those frictions
              are valuation-relevant because they lengthen sales cycles and narrow the serviceable wedge to buyers with
              real compliance or mission pain. Just as importantly, the public evidence does not isolate Seekr's own
              obtainable market by geography, vertical, or budget owner. That missing bridge between adjacent-market
              growth and company-specific capture is the chapter's central diligence gap.
            claimRefs:
              - CM007
              - CM009
              - CM010
              - CM012
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Seekr's best-fit market frame is defensible AI infrastructure
            body: >-
              The retained evidence supports a narrower framing than 'all generative AI': Seekr sits where deployment,
              explainability, governance, and production control intersect for enterprise and government buyers.
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM007
          - type: callout
            title: Public TAMs do not yet prove a direct Seekr SAM/SOM
            body: >-
              Adjacent-market growth is clear, but the current pool does not isolate revenue mix, segment conversion, or
              obtainable share by geography and procurement route.
