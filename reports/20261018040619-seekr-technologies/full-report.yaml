      - - Recommendation
        - research-more
        - Public evidence proves traction but not valuation support.
        - Do not issue a buy call at the disclosed price.
      - - Confidence
        - medium
        - Core financing and revenue inputs are public, but most operating detail is company-controlled.
        - Keep underwriting assumptions conservative.
      - - Risk rating
        - high
        - Entry multiple is already aggressive and downside terms are undisclosed.
        - Require private diligence before sizing capital.
      - - Valuation stance
        - expensive
        - Disclosed price implies >66x 2024 revenue and sits near Palantir's current public-sales multiple.
        - Only engage if price or evidence improves.
      - - Entry discipline
        - wait for diligence package
        - Need audited financial bridge, concentration data, and financing terms.
        - Treat current valuation as an upper bound, not a validated fair value.
    notes: >-
      Assessment is based on company-controlled operating disclosures plus two public Palantir market-data pages;
      financing terms and audited unit economics remain undisclosed.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV011
      - CV012
