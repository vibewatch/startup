      - number: '4.3'
        title: Financing scale is public; runway math is not
        blocks:
          - type: paragraph
            body: >-
              Capital adequacy remains the weakest part of the public record. The current refresh pool supports that
              Seekr launched a planned $100 million round led by Danu Venture Group and AMD Ventures, completed a first
              close, and was described in secondary coverage at roughly a $1.2 billion valuation. Management also said
              it expects to be cash-flow breakeven within 12 months. But the same evidence pool still lacks the
              balance-sheet facts needed to test that statement: no public cash balance, burn rate, debt burden,
              liquidation-preference stack, or verified project-value disclosure for the federal work highlighted in
              public traction materials. The result is a company that may have real demand, but still requires private
              financing disclosure before downside can be underwritten responsibly.
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI013
              - CI015
              - CI016
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              Financially, Seekr reads as credible-but-under-disclosed rather than clearly proven. The positive evidence
              is real: disclosed 2024 revenue above $18 million, customer and user scale, Army-linked prototype work,
              and a product narrative centered on governance, explainability, and cost control for high-stakes AI
              deployments. The negative evidence is equally real: no public price book, no revenue mix, no gross-margin
              bridge, no collections or working-capital detail, no CAC or payback disclosure, and no verified contract
              values for public-sector wins in the retained source set. That combination supports a revenue-quality view
              of credible but unproven, a margin-path view of possible but unverified, and a capital-needs view of not
              yet underwritable without management materials.
