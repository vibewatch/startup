        title: Milestone cadence and what the current evidence still does not prove
        blocks:
          - type: paragraph
            body: >-
              Seekr’s milestone cadence is real: the pool supports product launch and update events, defense awards,
              infrastructure partnerships, and compliance milestones from mid-2024 through late 2026. That matters
              because it shows a company still adding distribution and compliance layers after the valuation step-up,
