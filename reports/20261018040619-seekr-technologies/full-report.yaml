        title: Funding posture, disclosed scale, and stakeholder dependencies
        blocks:
          - type: paragraph
            body: >-
              The clearest funding datapoint in the assigned pool is the June 2025 company announcement of a planned
              $100 million round led by Danu Venture Group and AMD Ventures at a $1.2 billion valuation, with management
              saying the first closing had completed on June 17, 2025. That same announcement supplied the headline
              operating metrics later chapters will reuse cautiously: over $18 million of 2024 revenue, more than 30
              customers, and more than 100,000 end users. Those figures are useful but still self-reported. What is
              better corroborated is stakeholder shape: the assigned pool repeatedly ties Seekr to OCI, AWS
              distribution, government programs, GDIT, and Enabled Intelligence, implying that ecosystem leverage and
              defense procurement are core parts of the go-to-market rather than peripheral experiments. The missing
              pieces are the final round size, cap-table economics, debt, and concentration by customer or program.
