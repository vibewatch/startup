            body: >-
              Seekr's public commercial surface looks like an enterprise and public-sector sales motion rather than
              transparent self-serve SaaS. The product page is demo-gated instead of publishing list prices, while the
              About page lists dedicated CFO, CRO, EVP Public Sector, and VP Enterprise Sales leadership roles. The
