      - number: '5.2'
        title: Architecture, deployment, and operating model
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports a six-layer architecture thesis: enterprise and mission data are prepared
              first; models are then tuned or paired with retrieval; explainability and validation sit in the middle of
              the stack; deployment packages those systems into SaaS, private-cloud, on-premises, edge, or air-gapped
              environments; and production monitoring closes the loop. Seekr repeatedly emphasizes model-agnostic
              operation and both RAG and non-RAG support, which matters for government and regulated buyers that may
              need hardware flexibility or disconnected deployment. The strongest external corroboration comes from
              SBIR.gov and Army-linked release text describing specific defense workflows, including bias reduction,
              multimodal fusion, vulnerability analysis, and austere-edge use cases. What is still missing is the deeper
              implementation layer: public evidence in this pool does not include detailed API references, integration
              matrices, SLA disclosures, or security-operating metrics.
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE006
              - CE010
              - CE011
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
