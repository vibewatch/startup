      - CE004
      - CE005
      - CE006
      - CE010
      - CE011
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Seekr's public customer motion starts with regulated demand and procurement-led validation, then widens into
      commercial expansion without yet disclosing retention economics.
    data:
      items:
        - label: Regulated demand trigger
          summary: >-
            Buyers come from high-stakes sectors where explainability, auditability, and control are part of the
            purchase decision.
          touchpoints:
            - 'Sector focus: defense, telecom, finance, critical infrastructure'
            - 'Deployment needs: cloud, on-premises, edge, and air-gapped options'
        - label: Governance-heavy evaluation
          summary: >-
            The retained 2026 material frames governance, explainability, and audit readiness as the gatekeepers for
            moving beyond pilots.
          touchpoints:
            - Most organizations still cannot get past pilots
            - Compliance review and audit readiness dominate evaluation
        - label: Prototype or procurement proof
          summary: >-
            The deepest public evidence is the Army book of business, which is specific and paid for but still
            procurement-shaped.
          touchpoints:
            - 2 Phase I awards; 1 Phase II award
            - $2,496,719 total awarded on SBIR.gov
        - label: Workflow integration
          summary: Product updates are aimed at embedding Seekr into customer systems rather than staying at a demo layer.
          touchpoints:
            - Structured Outputs for schemas, APIs, dashboards, and databases
            - Custom Tools connect agents to proprietary systems
        - label: Production deployment
          summary: Seekr markets fast deployment and monitoring as the bridge from prototype to governed production.
          touchpoints:
            - 30 minutes or less for a production LLM
            - Five-click deployment and real-time production monitoring
        - label: Expansion proof gap
          summary: >-
            Commercial references now span logistics and retail, but the retained set still lacks renewal, cohort, and
            concentration evidence.
          touchpoints:
            - Murex and Anderson are announcement-level proof
            - No public NRR, GRR, churn, or top-customer metrics
