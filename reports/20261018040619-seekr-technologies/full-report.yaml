chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Seekr describes itself as a private artificial-intelligence company founded in 2021 and headquartered in
              Reston, Virginia, focused on trusted, explainable AI for critical infrastructure, government, and
              enterprise deployments. Across its AI-information page, product pages, and investor materials, the company
              consistently centers SeekrFlow as the operating system through which it builds, validates, deploys, and
              governs models or agents across cloud, on-premises, edge, and air-gapped environments. The same materials
              frame Seekr as a platform vendor rather than a point-solution startup, and the current investor page adds
              IP density with 36 granted and pending patents. Public materials also indicate a footprint broader than a
              single U.S. office, with Reston headquarters plus additional listed locations in Austin, Palm Beach
              Gardens, and London.
            claimRefs:
              - CO001
              - CO002
              - CO016
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
              - CO007
              - CO016
      - number: '1.2'
        title: Leadership bench, governance visibility, and key-person concentration
        blocks:
          - type: paragraph
            body: >-
              The current public bench is deeper than an early-seed company: Seekr lists a founder-CEO, president, chief
              technology and AI officer, COO, CFO, CRO, and CMO, alongside an advisory board populated by
              national-security, finance, and legal figures. That breadth suggests credible functional coverage for
              enterprise, defense, and regulated-market selling. The bigger diligence issue is not title coverage but
              governance transparency. Within the assigned source pool, Seekr provides advisory-board biographies and
              executive resumes but does not disclose a formal board of directors, committee structure, voting control,
              or ownership concentration. The narrative is also visibly founder- and president-led, which increases
              key-person risk if the company’s next financing or government-delivery cadence depends on a small number
              of external relationship holders.
            claimRefs:
              - CO003
              - CO004
