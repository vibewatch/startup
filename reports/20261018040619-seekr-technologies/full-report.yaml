      - number: '3.4'
        title: Durability is real in a niche, but commoditization risk is high
        blocks:
          - type: paragraph
            body: >-
              The moat case is strongest where buyers need provenance, controllability, and flexible deployment
              boundaries in regulated settings, because those are the areas Seekr repeats most consistently across
              product, customer, and thought-leadership surfaces. The weak point is that large ecosystems are already
              adding governance, lakehouse, secure-exchange, and agent orchestration features that solve adjacent buyer
              jobs with far more distribution power. Without public pricing, recent bake-off results, or like-for-like
              commercial replacement data in the assigned pool, the durability conclusion remains "specialist wedge with
              meaningful commoditization risk" rather than broad platform inevitability.
