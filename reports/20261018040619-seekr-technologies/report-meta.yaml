companyProfile:
  summary: >-
    Seekr Technologies is a private, growth-stage trusted-AI company headquartered in Reston, Virginia. Its SeekrFlow
    platform is positioned as an operating system for building, validating, deploying, and monitoring explainable AI
    across enterprise, government, edge, and air-gapped environments. The current evidence base supports real traction
    in defense and regulated-industry use cases, but still leaves material gaps in audited financial disclosure,
    concentration, and financing economics.
