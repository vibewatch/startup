callouts:
  - calloutType: "strength"
    title: "Narrow but real wedge in regulated deployment control"
    body: >-
      Seekr's public evidence is strongest where buyers need explainability,
      provenance, and flexible deployment boundaries rather than just another
      general AI endpoint.
    claimRefs: ["CP002", "CP005", "CP012"]
  - calloutType: "risk"
    title: "Distribution and packaging asymmetry is the core threat"
    body: >-
      Databricks, Snowflake, Microsoft Fabric, and internal builds can win
      before a bake-off starts because they sit inside existing estates or
      enterprise agreements, while Seekr's public price and win-rate proof is
      limited.
    claimRefs: ["CP011", "CP013", "CP016"]
