    title: "Competitive alternatives and buyer fit"
    columns:
      - "Alternative"
      - "Category"
      - "Target segment"
      - "Product scope / strategic direction"
      - "Scale / traction signal in assigned evidence"
      - "Evidence-backed limitation"
    rows:
      - ["Seekr", "Regulated AI operating system", "Enterprise, government, defense, regulated teams", "Complete operating system for data prep, model training, explainability, deployment, and monitoring", "Company said it generated over $18M of 2024 revenue, had over 30 customers, served 100,000+ end users, and completed the first close of a planned $100M round at a $1.2B valuation", "Public evidence emphasizes positioning and partnerships more than disclosed pricing or win/loss data"]
      - ["Palantir-style mission platforms", "Incumbent direct substitute", "Defense, intelligence, and other high-security operators", "Ontology-grounded analytics and operational workflows for mission-critical use cases", "Independent competitor coverage still frames Palantir as dominant in big-data analytics and government AI platforms", "Implementations can involve significant upfront investment, customization, and complexity"]
      - ["Databricks", "Cloud data + AI incumbent", "Large enterprises building analytics and AI on lakehouse stack", "Lakehouse architecture plus governance and generative-AI deployment tools", "Independent competitor coverage calls Databricks the strongest overall Palantir alternative", "Assigned evidence does not give like-for-like proof of regulated edge or air-gapped deployment"]
      - ["Snowflake", "Cloud data platform substitute", "Data science and BI teams prioritizing governance and data sharing", "Cloud data platform with Snowpark, Cortex AI, and secure data exchange", "Independent competitor coverage highlights continued enterprise adoption across finance, healthcare, and retail", "Assigned evidence is stronger on data sharing and analytics than on classified or edge deployment"]
      - ["Microsoft Fabric", "Ecosystem incumbent", "Enterprises already standardized on Microsoft", "Unified analytics stack spanning OneLake, Power BI, Synapse, and Azure AI", "Independent competitor coverage says Fabric has gained traction among mid-to-large enterprises", "Explainability for regulated AI is part of a broader suite rather than the sole product wedge in this pool"]
      - ["Alteryx", "Low-code analytic substitute", "Business users and citizen data scientists", "Self-service analytics, spatial analytics, and automation workflows", "Independent coverage says buyers value quicker time-to-value and less engineering effort", "The same source places it in less sensitive commercial settings rather than the highest-security mission workflows"]
      - ["C3.ai", "Vertical enterprise AI competitor", "Energy, manufacturing, defense, and government teams", "Pre-built industry applications and data integration layers", "Independent coverage still treats it as a direct rival in several vertical use cases", "Assigned evidence does not show the same deployment-control emphasis Seekr highlights"]
    notes: >-
      Rows combine direct peers, incumbents, and substitutes because the
      assignment requires the full job-to-be-done landscape, not just named
      startups. Public scale or funding figures for most alternatives were not in
      the assigned pool, so cells preserve that limitation instead of inventing
      comparables.
    claimRefs: ["CP003", "CP006", "CP007", "CP008", "CP009", "CP010", "CP011"]
