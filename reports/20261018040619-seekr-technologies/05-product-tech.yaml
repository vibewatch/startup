  evidenceGaps:
    - type: missing-source
      severity: material
      topic: implementation-depth
      missingEvidence: Public API references, integration matrices, pricing or packaging detail, and architecture documentation that goes beyond marketing-level workflow claims.
      whyItMatters: Without implementation-depth evidence, it is hard to judge deployment friction, integration effort, and whether the product is repeatable across customer environments.
      diligencePath: Request technical documentation, sample architecture diagrams, reference implementation material, and a current integration catalog from Seekr.
      relatedQuestionRefs: [QE002, QE003, QE004]
    - type: private-evidence-only
      severity: material
      topic: reliability-and-governance-proof
      missingEvidence: Independent benchmark results, uptime or incident history, security and compliance attestations, and customer audit evidence for the explainability layer.
      whyItMatters: Seekr's core differentiation is governance and trustworthiness, so lack of third-party operating proof directly limits confidence in the platform's defensibility.
      diligencePath: Obtain security and compliance documentation, customer references, validation reports, and any status-history or SLA materials.
      relatedQuestionRefs: [QE006, QE008]
    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: Public code repositories, package telemetry, active model or dataset artifacts, or practitioner-community evidence beyond the sparse Hugging Face organization page.
      whyItMatters: A thin public developer surface does not disprove product maturity, but it reduces outside evidence on adoption velocity, ecosystem traction, and implementation depth.
