- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - New capital, the DoorDash package, and ongoing footprint growth translate into better marketplace liquidity and credible proof that Wonder can cross-sell across stores, Grubhub, and Blue Apron.
    - Participation near the latest $9 billion pre-money mark is only defensible if diligence shows attractive store cohorts, improving Grubhub profitability, and manageable senior claims on upside.
    - Execution complexity remains high even in the upside case.
    - Would require diligence packets that close the current economics and capital-stack gaps.
  - - Base
    - Wonder keeps growing and raising capital, but public evidence remains more persuasive on scale and optionality than on standalone margins.
    - The current evidence supports tracking the company or negotiating below the latest round rather than paying up for the headline valuation.
    - Missing unit economics and preference detail can erase apparent upside.
    - Best fit with the retained source set today.
  - - Bear
    - Owned stores prove capital intensive, Grubhub does not sustain profitable growth, or Blue Apron and other assets fail to raise blended customer value.
    - Downside would likely revisit or undercut the prior reported $7 billion valuation reference because the newest markup would lose its operating proof points.
    - Competitive pressure from delivery incumbents and integration drag could compress appetite quickly.
    - Triggered by weak cohort economics, weak marketplace KPIs, or a punitive capital stack.
  notes: Scenario bands are qualitative and anchored to disclosed private financing marks because the assigned public evidence does not supply enough operating detail for a precise model.
