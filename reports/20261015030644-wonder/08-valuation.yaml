- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Current read
  - What would change the view
  rows:
  - - Platform breadth thesis
    - Wonder has combined owned concepts, Grubhub-powered local restaurants, and Blue Apron meal kits in one app, with the footprint scaling sharply in 2025-2026.
    - Sustained disclosure of repeat rates, segment margins, and cross-sell economics would move this from strategic story to underwritten economic moat.
  - - Strategic optionality thesis
    - DoorDash’s $425 million package and IPO-readiness messaging suggest outside buyers and capital markets still see optionality in the platform.
    - A documented Grubhub turnaround plus evidence that monetized assets do not impair core demand would strengthen the case for underwriting nearer the latest round.
  - - Execution anti-thesis
    - The current mark still leans on integrating difficult businesses whose standalone categories already have harsh economics and strong incumbents.
    - Verified store payback, marketplace profitability, and cleaner capital-stack terms would reduce the need for a stretched-risk discount.
  notes: 'Qualitative comparable framing only: the assigned pool does not provide a clean public-multiple bridge across Wonder’s owned-store, marketplace, and meal-kit mix.'
