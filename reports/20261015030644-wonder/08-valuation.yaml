  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Store-level cohort economics, including contribution margin, labor burden, order density, and payback by vintage and market.
    whyItMatters: Without cohort economics, the current valuation can only be discussed relative to financing marks and strategic narrative, not underwritten on durable cash generation.
    diligencePath: Request store-level cohort decks and board reporting for at least the last four opening vintages, with same-store sales and contribution-margin walk-downs.
    relatedQuestionRefs:
    - QV008
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Current cash, debt, liquidation preferences, investor protections, and any senior claims created or amended around the 2026 Series D and DoorDash transactions.
    whyItMatters: A stretched headline valuation can still be unattractive if senior structure absorbs most of the upside or raises future-dilution risk.
    diligencePath: Obtain the current capitalization table, debt schedule, Series D term sheet, and any side letters linked to strategic investors or asset-sale proceeds.
    relatedQuestionRefs:
    - QV008
  - type: missing-source
    severity: material
    topic: grubhub-performance
    missingEvidence: Post-close Grubhub orders, active diners, merchant retention, and profitability under Wonder ownership.
    whyItMatters: The marketplace leg is central to the platform thesis and to any IPO or strategic-exit story, but the retained public evidence offers only directional optimism.
    diligencePath: Request monthly operating KPIs for Grubhub and the Wonder-app marketplace integration, plus churn and contribution data by cohort.
    relatedQuestionRefs:
    - QV008
