  - type: missing-source
    severity: material
    topic: trust-gap
    missingEvidence: >-
      Independent public evidence for Wonder's security, privacy, compliance, incident-response, or uptime controls
      across app, marketplace, and robotics operations.
    whyItMatters: >-
      Product risk cannot be underwritten cleanly without knowing how operational incidents are detected, disclosed, and
      contained across a multi-surface food platform.
    diligencePath: >-
      Request public trust-center materials, SOC or equivalent control documentation, uptime history, incident
      postmortems, and any regulator or auditor evidence tied to digital ordering or robotics operations.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Store-level throughput, order-accuracy, remote-intervention, and prep-to-delivery timing data by format and market
      cohort.
    whyItMatters: >-
      The architecture may be differentiated, but the underwriting question is whether it produces reliable and scalable
      service outcomes rather than just an interesting workflow design.
    diligencePath: >-
      Request cohort metrics for throughput, error rates, prep exceptions, labor hours, and delivery-time distributions
      across standard stores versus Walmart pilots and robotics-enabled lines.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: retention-durability
    missingEvidence: NRR, GRR, churn, renewal, cohort, or repeat-order disclosures across Wonder, Grubhub, and Blue Apron surfaces
    whyItMatters: >-
      Without retention evidence, the chapter can show convenience and footprint growth but not whether users stick,
      expand spend, or lapse.
    diligencePath: >-
      Request 12-month active-customer, order-frequency, and cohort retention data by first-party, Grubhub, and Blue
      Apron channels.
    relatedQuestionRefs:
