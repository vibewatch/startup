evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: economics
    missingEvidence: A consolidated revenue, margin, and cash-burn bridge across legacy Wonder, Grubhub, and Blue Apron.
    whyItMatters: >-
      Valuation and scale cannot be underwritten confidently without knowing what business mix is actually producing
      growth and gross profit.
    diligencePath: >-
      Request management reporting that reconciles segment revenue, gross margin, and operating losses for the combined
      platform.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Store-level contribution margins, payback periods, and cohort performance for new Wonder locations.
    whyItMatters: >-
      Reported location growth says little about durability if new stores are not profitable after fulfillment and
      marketing costs.
    diligencePath: Obtain cohort-level unit economics by market and compare mature versus newly opened locations.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: minor
    topic: leadership-roster
    missingEvidence: A complete current executive-team and board roster with role definitions.
    whyItMatters: Founder concentration and operating depth cannot be assessed cleanly from a partial public leadership set.
    diligencePath: >-
      Pull current board materials, financing documents, or investor presentations that list the full leadership and
      governance roster.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: ownership-map
    missingEvidence: Full post-Series D cap-table, board-rights, and any debt or preference-stack disclosures.
    whyItMatters: >-
      The named investor list does not show control rights, liquidation preferences, or whether crossover participation
      changes exit pressure.
    diligencePath: Review financing docs and board materials for ownership, governance rights, and senior claims on proceeds.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      A spend-based TAM, SAM, and SOM bridge that separates owned kitchens, marketplace orders, and meal-kit demand by
      geography and occasion.
    whyItMatters: >-
      Without a comparable spend model, channel and footprint counts cannot be converted into a valuation-grade market
      ceiling.
    diligencePath: >-
      Request management's internal market model with channel splits, geographic assumptions, and conversion logic, then
      reconcile it to public footprint and marketplace data.
    relatedQuestionRefs:
      - QM002
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Store-level contribution margins, cohort payback periods, delivery economics, take rates, and robotics ROI by
      market cohort.
    whyItMatters: >-
      These metrics determine whether Wonder can turn menu breadth and automation claims into durable adoption and
      defensible pricing.
    diligencePath: >-
      Request operating cohort data by location vintage and channel mix, including order frequency, labor intensity,
      delivery cost, and margin bridges.
    relatedQuestionRefs:
      - QM005
      - QM006
  - type: enumeration-incomplete
    severity: material
    topic: post-grubhub-integration
    missingEvidence: Current order mix, merchant retention, active-user trends, and Blue Apron attach rates after Grubhub integration.
    whyItMatters: >-
      The platform thesis depends on cross-surface usage, but public evidence does not show whether the combined app is
      deepening engagement or just widening assortment.
    diligencePath: >-
      Request post-close KPI dashboards for monthly active users, orders per user, merchant retention, attach rates, and
      channel migration behavior.
    relatedQuestionRefs:
      - QM003
      - QM005
      - QM008
  - type: private-evidence-only
    severity: material
    topic: profitability-risk
    missingEvidence: Store-level contribution margins, cohort payback, and consolidated profitability by market or channel.
    whyItMatters: >-
      Without disclosed unit economics, it is impossible to test whether Wonder's integrated model is a durable
      advantage or a subsidized land grab.
    diligencePath: >-
      Request management or lender materials showing mature-store margins, same-store economics, and channel-level
      contribution profit.
    relatedQuestionRefs:
      - QP009
  - type: missing-source
    severity: material
    topic: pricing-economics
    missingEvidence: >-
      Realized price, discounting, delivery-fee, and take-rate comparisons between Wonder, marketplaces, and meal-kit
      substitutes.
    whyItMatters: >-
      Public sources describe packaging and positioning, but they do not show whether Wonder wins on basket economics or
      only on convenience framing.
    diligencePath: >-
      Obtain app basket tests, merchant contracts, and internal pricing dashboards for matched geographies and menu
      sets.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: disclosure-gap
    missingEvidence: Current cash, debt, covenant, and preference-stack schedule after the July 2026 round.
    whyItMatters: >-
      Capital adequacy cannot be judged from valuation headlines alone when the operating model still requires rollout
      and integration spending.
    diligencePath: Request the latest board package or lender package with cash, debt, and preference-stack detail.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Mature-store contribution margins, CAC by channel, repeat frequency, and payback periods.
    whyItMatters: These inputs determine whether expansion creates value or simply converts financing into top-line growth.
    diligencePath: Request store cohort P&Ls, marketing channel reports, and retention curves by geography.
    relatedQuestionRefs:
      - QI007
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Channel mix between Wonder-owned concepts, Grubhub-powered marketplace activity, and Blue Apron meal kits.
    whyItMatters: >-
      Revenue quality and gross-profit potential depend on whether growth is concentrated in owned demand or
      lower-margin marketplace flows.
    diligencePath: Request GMV, net revenue, gross profit, and order count by channel for the last four quarters.
    relatedQuestionRefs:
