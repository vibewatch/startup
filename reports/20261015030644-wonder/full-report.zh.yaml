              自有或授权餐饮概念、由 Grubhub 支持的本地非 Wonder 餐厅，以及 Blue Apron 即食套装放进一个应用。Wonder
              自有网站上的客户证据也支持这一模式所需的行为：家庭可以跨多个餐饮概念下单并一次付款。这种广度在财务上很重要，因为它可以扩展下单场景和加购机会，但保留的公开证据仍未显示收入中有多少来自自营食品销售、市场服务费或即食套装经济性，也未说明这些渠道中是否有任何一个利润率明显更高。
