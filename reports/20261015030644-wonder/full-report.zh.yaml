      - number: '4.3'
        title: 单位经济性、现金状况和融资依赖仍是主要阻碍
        blocks:
          - type: paragraph
            body: >-
              本章的核心投资判断问题不是缺少战略叙事，而是缺少能证明故事是否转化为持久经济性的核心经营数字。保留的来源没有披露当前现金、总债务、契约负担、优先权条款、burn
              rate、获客成本、回本周期或成熟门店贡献利润率。因此，公开证据更清楚地解释了 Wonder
              打算把资本花在哪里，却没有说明资本多快能转化为盈利的重复需求。指定证据池中唯一偏负面的信号来自二手材料：Wikipedia 引用标题提到 7
              月融资后据报道新泽西裁员。在证据池没有原文的情况下，这只能作为需要直接核验的线索，而不是干净的下行数据点；但它再次说明劳动效率和融资后的成本纪律值得直接尽调。
            claimRefs:
