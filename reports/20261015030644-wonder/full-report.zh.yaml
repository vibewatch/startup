  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 新资本、DoorDash 方案和持续的覆盖范围增长转化为更好的市场流动性，并有可信证据证明 Wonder 能在门店、Grubhub 和 Blue Apron 之间交叉销售。
        - 只有当尽调显示门店队列有吸引力、Grubhub 盈利能力改善，且优先权方对上行空间的权利主张不至于吞噬上行空间时，才有理由接近最近一轮 $9 billion 投前估值参与。
        - 即使在上行情景中，执行复杂度仍然很高。
        - 需要尽调材料填补当前经济性和资本结构缺口。
      - - 基准
        - Wonder 继续增长并融资，但公开证据对规模和选择权的支持仍强于对独立利润率的支持。
        - 当前证据支持继续跟踪公司，或争取低于最近一轮的价格，而不是为表面估值溢价买单。
        - 缺失的单位经济性和优先权细节可能抹去表面上的上行空间。
        - 就当前保留的来源集合而言，最匹配。
      - - 看跌情景
        - 自营门店被证明资本投入过重，Grubhub 无法维持盈利增长，或 Blue Apron 及其他资产未能提升综合客户价值。
        - 下行情景可能重新触及甚至跌破此前报道的 70 亿美元估值参考值，因为最新估值上调将失去运营层面的证明依据。
        - 配送领域既有玩家的竞争压力与整合拖累，可能迅速压低市场兴趣。
        - 由疲弱的客户群经济性、疲弱的市场平台 KPI 或惩罚性的资本结构触发。
    notes: 情景区间是定性的，并锚定已披露的私募融资估值，因为分配到的公开证据不足以提供精确建模所需的运营细节。
    claimRefs:
      - CV001
