              Wonder 2026 年 7 月的融资规模足以让扩张继续，但资金用途说明这一模式仍需大量资本才能做大。              Wonder 表示以 $9B 投前估值融资
              $650M，资金将用于实体扩张、市场增长及持续投入技术、机器人和人工智能。公司及独立报道还称，自 2025 年 5 月融资公告以来，经营范围从 46 个地点增至 140 个；第三方报道则把公司与此前对
