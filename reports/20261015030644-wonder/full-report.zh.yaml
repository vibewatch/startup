              - CP006
              - CP014
      - number: '3.3'
        title: 传统巨头仍掌握广度，迫使 Wonder 证明经济性
        blocks:
          - type: paragraph
            body: >-
              Wonder 的整合程度高于 DoorDash 或 Uber
              Eats，但这些市场平台在品类丰富度和消费者习惯上仍更强。指定来源把二者描述为两大领先者，其库存范围已从餐饮延伸到杂货、便利店及其他本地商业类别。Wonder
              还需要比这些轻资产平台更密集的厨房覆盖，因为其配送半径围绕每个地点保持较小。这提高了资本效率门槛，尤其是公开报道仍未披露单个 Wonder 地点或合并平台是否盈利。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP008
              - CP009
      - number: '3.4'
        title: 持久性取决于信任、复购行为和品类验证
        blocks:
          - type: paragraph
            body: >-
              护城河逻辑确实存在，但仍有条件。相比市场平台，Wonder
              可以主张自己对烹饪质量、速度和菜单协调有更强控制；但现有证据池也说明这一优势可能脆弱：消费者信任问题仍未解决，数字美食广场这一品类有失败历史，本地经营者还可能把 Wonder
              视为资金充足的聚合商，而不是受欢迎的社区品牌。如果 Wonder 不能把整合转成复购、盈利的厨房集群和比早期共享厨房概念更强的品牌信任，这一模式可能变成昂贵的混合体，而不是持久的竞争平台。
            claimRefs:
              - CP010
              - CP011
              - CP013
              - CP014
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: Wonder 最好的切口是堆栈整合，而非独立餐饮品牌
            body: 与市场应用相比，Wonder 最强的地方在于掌握厨房、下单和配送体验，而不是单看菜单品牌认知度。
