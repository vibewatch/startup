      - number: '1.3'
        title: 融资、规模与里程碑
        blocks:
          - type: paragraph
            body: >-
              Wonder 当前最清晰的事实集中在资本、规模和平台建设里程碑上。2026 年 7 月 D 轮融资金额为 $650M，投前估值
              $9B，官方和独立报道对轮次金额、估值及投资人名单基本一致。管理层称新资本将用于实体扩张、市场增长，以及持续投入机器人和 AI；同时表示，自 2025 年 5 月上次融资公告以来，经营 footprint 已从
              46 个地点增至 140 个，规模扩大三倍。这一加速建立在一串里程碑之上，包括收购 Blue Apron、2025 年 1 月完成对 Grubhub 的收购、2025 年 9 月转型为更广泛的用餐平台，以及
              2026 年的董事会和 Zipline 公告。合在一起看，这条轨迹显示公司正从概念打造迈向分发广度、软件触点和物流杠杆。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO015
              - CO016
