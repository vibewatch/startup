chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与平台
        blocks:
          - type: paragraph
            body: >-
              Wonder 由 Marc Lore 于 2018 年创办，如今将自己定位为垂直整合的用餐平台，而非单一餐饮连锁。公司在自有 About
              页面、新闻稿和融资材料中反复强调同一套核心主张：把配方研发、厨房机器人、外送基础设施、自有餐饮概念、本地餐厅市场供给和居家用餐方案放进一个体验，让优质食物更容易获得。独立媒体在 2025
              年也以更直白的语言描述了同一转型：Wonder 从车道餐车走向多概念门店，再转为由应用驱动的平台，并把 Grubhub 餐厅和 Blue Apron 即食套装叠加进来。因此，最有力的身份判断不只是 Wonder
              在送餐，而是它试图在一个统一品牌系统内同时掌握多种用餐场景和履约方式。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO011
              - CO012
              - CO013
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO005
              - CO009
              - CO010
              - CO013
              - CO014
      - number: '1.2'
        title: 领导层、治理与控制
        blocks:
          - type: paragraph
            body: >-
              现有证据仍把 Marc Lore 放在关键战略位置：他既是创始人和 CEO，也是最常与 Wonder
              的产品野心、并购策略及融资活动联系在一起的人。当前证据池中可见的经营层信息明显少于这套战略叙事；Courtney Lawrie 代表了 2025 年 9 月品牌重塑和市场扩张的声音，而 Jack Hartung
              在 2026 年加入董事会则是最清晰的新治理信号。QSR 明确把 Hartung 的到任与 IPO 准备猜测联系起来，说明 Wonder
              正在一家仍由创始人主导的企业里建立上市公司纪律。不过，现有证据池没有完整董事名单、投票控制图或新一轮融资后的持股拆分，因此关键人物依赖和控制权集中仍是待尽调事项，而不是已经关闭的问题。
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO010
              - CO011
