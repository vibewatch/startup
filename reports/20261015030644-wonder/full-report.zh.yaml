  - id: TV002
    title: 正 / 反论点表
    columns:
      - 视角
      - 当前判断
      - 会改变判断的因素
    rows:
      - - 平台广度正论点
        - Wonder 已将自有餐饮概念、Grubhub 驱动的本地餐厅和 Blue Apron meal kit 放入一个应用，覆盖范围在 2025 至 2026 年快速扩大。
        - 如果持续披露复购率、细分利润率和交叉销售经济性，这就能从战略故事变成可纳入投资判断的经济护城河。
      - - 战略选择权正论点
        - DoorDash 的 $425 million 方案和 IPO 准备信息表明，外部买方和资本市场仍认为该平台有选择权。
        - 有记录的 Grubhub 扭转，加上变现资产不损害核心需求的证据，会强化按近期期次估值进行投资判断的理由。
      - - 执行反论点
        - 当前估值仍依赖整合困难业务，而这些业务的独立品类已经面临严峻经济性和强大在位者。
        - 经验证的门店回本、市场盈利能力和更清晰的资本结构条款，会降低对高风险折价的需求。
