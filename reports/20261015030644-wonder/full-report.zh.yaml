      - number: '3.2'
        title: 整合是当前最清晰的差异化
        blocks:
          - type: paragraph
            body: >-
              公开证据指向一个清晰的竞争切口：Wonder 试图掌握比纯市场平台更多的履约链条。单笔多餐厅体验与实体厨房、最后一公里配送和扩大的应用入口结合在一起，后者如今还包括本地非 Wonder 餐厅和 Blue
              Apron 即食套装。相比只负责导流的市场平台，这种设计让 Wonder 更有机会留住客户关系。它也解释了管理层为何持续把 Wonder 描绘成平台而非餐饮连锁，以及公司为何同时筹资扩建厨房、机器人和本地密度。
            claimRefs:
              - CP002
