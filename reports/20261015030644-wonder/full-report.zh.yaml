  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              公开记录支持的是价格敏感而非势头敏感的判断。Wonder 有多项相互印证的融资能力信号：公司宣布以 $9B 投前估值完成 $650M D 轮，独立行业报道将投后估值定为 $9.65B，TechCrunch 还报道
              DoorDash 有一笔价值 $425M 的独立交易，拆分为 Campus Dining 资产出售和 D
              轮投资。这些事实说明投资人仍愿意为平台愿景提供资金，但它们本身不能证明当前估值对新投资人有吸引力，除非公司能更清楚地披露门店层面贡献利润率、分部盈利能力和排在普通股之前的条款。基于这组证据，最稳妥的立场是继续研究，风险评级偏高；除非尽调填补这些缺口，或入场价格补偿这些缺口，否则估值立场偏紧。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV010
              - CV013
      - number: '8.2'
        title: 为什么平台故事仍有乐观情景
        blocks:
          - type: paragraph
            body: >-
              溢价定价背后确实有一套真实论点。Wonder 自己 2026 年 7 月的公告称，自 2025 年 5 月以来 footprint 已从 46 个地点增至 140 个；TechCrunch 则报道 9 月已有
              157 个地点，并计划在 2027 年初进入得州。Nation’s Restaurant News 称，截至 2025 年 9 月，应用已经把 Wonder 自有品牌、Grubhub 支持的本地餐厅和 Blue
              Apron 即食套装整合为一个体验，这是保留证据中最清晰的证明，说明管理层正在把多种用餐场景拼成一个入口。DoorDash 交易也具有战略意义，因为它把 Grubhub Campus Dining
              资产变现，同时带来新的股权资本。这一组合可以支撑围绕规模、分发和退出选择权的可信乐观情景，但它更多证明战略野心，而不是持久经济性。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV010
              - CV011
              - CV014
      - number: '8.3'
        title: 当前估值为何仍难以完成投资判断
        blocks:
          - type: paragraph
            body: >-
              反方论点不是 Wonder 没有增长，而是当前估值领先于公开经营证据。Restaurant Business 在 2025 年 9 月认为，Wonder
              的三个主要支柱都无法独立站稳：餐厅经营困难，外送仍高度依赖规模且竞争激烈，即食套装也有长期挣扎历史。同一篇文章指出，DoorDash 和 Uber Eats 已经更像超级应用，说明 Wonder
              进入的并不是没有传统巨头的品类。这一竞争背景很重要，因为保留的来源集没有披露覆盖自有地点、Grubhub、Blue Apron 和新资产的清晰收入与利润率桥接，也没有提供门店 cohort
              回本或融资后优先权结构细节。因此，合适的可比集合应以定性而非倍数为主：用超级应用衡量广度，用 Wonder 自己从 2025 年报道的 $7B 估值升至 2026 年 $9B 投前融资估值来衡量融资势头。
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
      - number: '8.4'
        title: 最终尽调要求与论点破坏条件
        blocks:
          - type: paragraph
            body: >-
              在接近最新私募估值出价前，尽调应要求四套具体材料：第一，包含贡献利润率、人工和回本周期的门店 cohort 经济性；第二，覆盖 Wonder 门店、Grubhub 市场、Blue Apron
              以及新增媒体或机器人资产的分部桥接；第三，Grubhub
              交割后的经营趋势，包括订单、活跃食客、商户留存和盈利能力；第四，当前现金、债务、清算优先权及任何排在新普通股之前的其他结构。如果材料显示自有门店增长资本饥渴且回本缓慢、Grubhub
              仍是价值陷阱而非分发飞轮，或资本结构吞噬了新进入者过多上行空间，论点就会失效。在此之前，最稳妥的做法是把 Wonder 留在主动工作清单上，而不是把当前融资标题转成明确的买入判断。
            claimRefs:
              - CV008
              - CV010
              - CV013
              - CV014
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 不要把融资势头与估值支撑混为一谈
            body: 指定证据池证明成熟资本仍可投向 Wonder，但没有证明新投资人应在缺乏明显更好经营和结构披露的情况下接受最新私募估值。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV013
          - type: callout
            title: 论点会在经济性或结构上失效，而非在愿景上失效
            body: 如果门店 cohort、Grubhub 盈利能力或高级资本结构最终明显差于融资标题所暗示的水平，估值压缩风险将远大于战略故事的上行空间。
            calloutType: risk
            claimRefs:
              - CV008
              - CV010
              - CV014
