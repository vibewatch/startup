      - number: '1.4'
        title: 证据缺口与观察点
        blocks:
          - type: paragraph
            body: >-
              让 Wonder 容易理解的公开叙事，同时也留下了重大的投资判断盲区。指定来源没有一个提供经核实的合并收入或 run-rate、当前员工数、活跃客户数、门店层面贡献利润率，或覆盖 Wonder
              传统业务、Grubhub 和 Blue Apron
              的分部桥接。这一点很重要，因为公司现在的融资估值已被独立餐饮行业报道置于许多上市餐饮同业之上，而当前证据池中最偏负面的材料仍未真正检验独立经营经济性。结果是：公司的身份、野心和融资势头证据充分，但真实经营质量和并购后的整合表现仍需直接尽调。
            claimRefs:
              - CO009
              - CO010
              - CO014
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 平台广度是核心战略主线
            body: 综合官方和独立来源，Wonder 最一致的优势主张只有一个：一个平台覆盖自有品牌、外部餐厅、即食套装和机器人赋能的履约，而不是押注单一业态。
            calloutType: strength
            claimRefs:
              - CO003
              - CO004
              - CO011
              - CO012
              - CO015
          - type: callout
            title: 经济性仍明显披露不足
            body: 当前公开证据支持融资、估值和扩张里程碑，但不足以清晰判断收入质量、客户规模、单位经济性或并购后的分部表现。
            calloutType: risk
            claimRefs:
              - CO005
              - CO009
              - CO014
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: Wonder 正在定义用餐入口，而不只是另一家餐饮连锁
        blocks:
          - type: paragraph
            body: >-
              公开记录把 Wonder 描绘成捆绑式用餐平台，而非单一业态餐饮经营者。公司围绕收购 Grubhub 的官方表述，描述了覆盖自营和第三方餐厅、杂货及即食套装的合并下单流程；2026
              年融资公告则把供给分成面向即时场景的“food for now”市场供给，以及服务之后场景的居家用餐方案。独立行业报道也指向同一方向：QSR
              说这是一个覆盖自有餐厅、授权品牌、本地餐厅外送和用餐方案的数字平台，NRN 报道该应用已经把 Wonder 自有品牌、通过 Grubhub 接入的非 Wonder 餐厅和 Blue Apron
              即食套装放在一起。相关市场边界因此涵盖多种点餐和用餐规划时刻；但广义餐饮外送或杂货支出不能自动算作可触达市场，必须先拆分 Wonder 真正服务好的场景。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM011
      - number: '2.2'
        title: 不同渠道的买方逻辑不同，家庭是核心，机构是延伸
        blocks:
          - type: paragraph
            body: >-
              当一个家庭想要多样选择、又不想协调多笔订单时，自有门店的价值主张最强。Wonder 自己的评论摘录强调，“五种不同口味需求”可以合并成一笔交易；其多餐厅下单功能则把这种便利正式化，让客户能在一笔订单中组合 30
              多个概念的商品。在机构端，Grubhub
              资产通过校园餐饮和企业账户把买方范围从消费者延伸到大学和雇主。因此，采用并非由一个统一预算所有者驱动：家庭食品预算支撑核心消费产品，采购或福利预算则支撑校园和企业延伸场景。Restaurant Business
              还报道，郊区、家庭导向市场的表现优于较老的城市门店，这有助于解释 Wonder 为何押注便利驱动的家庭需求，而不是纯粹依赖高密度城市的探索行为。
            claimRefs:
              - CM005
              - CM009
              - CM010
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.3'
        title: 公开规模证据更像渠道容量和 footprint 证明，而非支出市场数学
        blocks:
          - type: paragraph
            body: >-
              可公开核实的市场规模主要来自经营 footprint 和渠道触达。Wonder 的 2026 年 7 月融资公告称，自 2025 年 5 月以来，自有 footprint 已从 46 个地点增至 140
              个；Restaurant Business 独立报道 Wonder 在美国东海岸 10 个州及华盛顿特区拥有 140 个地点。Grubhub 收购则带来更宽的延伸视角：375,000 个商户、200,000
              名配送伙伴、超过 4,000 个美国城市、360 所大学和超过 10,000 家企业。得州扩张计划又提供了另一层期权价值，目标是到 2027 年在主要都会区开设 100
              多个地点。这些数据有助于说明可触达供给、地理范围和机构渠道，但它们不是可直接比较的单位，也不能单独构成有说服力的 TAM/SAM/SOM 体系。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM007
              - CM008
      - number: '2.4'
        title: 采用驱动因素清晰，但经济性和渠道组合仍限制判断
        blocks:
          - type: paragraph
            body: >-
              公开证据中的驱动因素很明确：一单多样选择、菜单密度、自有应用流量，以及由自动化支撑的可负担性，是管理层认为这一模式能走出小众城市外送场景的核心理由。Marc Lore 告诉 Restaurant
              Business，Wonder 目前 85% 的流量已经来自自有应用和网站；如果这一比例能够维持，公司在自有门店端就能更好地控制商品运营并减少佣金流失。他还称，自动化相较传统餐厅可以增加约 20
              个百分点的利润率，这一说法直接关系到定价权和市场扩张。问题在于无法验证：现有公开来源没有拆出门店贡献利润率、复购率、take rate 或 Grubhub
              收购后的订单组合，无法把这些驱动因素转成清晰的采用曲线或达到估值标准的 SAM/SOM。因此，市场潜力看起来合理，但仍未被充分界定。
            claimRefs:
              - CM010
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 平台广度扩大支出池，但也混合了不同购买动作
            body: Wonder 的可触达市场故事比餐饮外送更宽，因为它现在把自有厨房、本地市场供给和即食套装捆在一起；代价是每个触点都有不同的买方、单位经济性画像和转化路径。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: callout
            title: 公开规模仍是渠道形态证据，而非估值级市场模型
            body: footprint、商户和机构数量说明触达范围，但保留的公开证据仍不足以拆出复购行为、take rate 或门店层面利润率，无法把这些数量转成清晰的 SAM 或 SOM。
            calloutType: risk
            claimRefs:
              - CM005
              - CM007
              - CM010
              - CM014
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合不止外送应用
        blocks:
          - type: paragraph
            body: >-
              Wonder 的竞争版图比普通餐厅或外送应用可比集合更宽。公司如今覆盖自有餐厅、授权或收购品牌、通过 Grubhub 提供的本地餐厅外送，以及通过 Blue Apron
              提供的居家即食套装，因此真正的替代选择包括外送市场、数字美食广场、单一概念本地餐厅和计划在家吃的餐食。这种广度让 Wonder
              比单一菜系经营者更能解决“一单满足多种口味”的问题，但也意味着它要对抗多种既有消费习惯，而不是只面对一组直接同业。
            claimRefs:
              - CP001
              - CP003
              - CP012
          - type: table
            tableRef: TP001
