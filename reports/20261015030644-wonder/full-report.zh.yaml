        - label: 毛利与资金续航
          detail: 新资本将用于扩张、市场平台增长、机器人和 AI，但利润率、烧钱速度和回本周期仍未披露。
          tone: risk
      edges:
        - from: Customer meal occasion
          to: Unified ordering surfaces
          label: 更多用餐场景可进入同一平台
        - from: Unified ordering surfaces
          to: Basket aggregation
          label: 一笔交易可覆盖多个餐饮概念
        - from: Basket aggregation
          to: Fulfillment footprint
          label: 订单依赖门店、配送和市场平台物流
        - from: Fulfillment footprint
          to: Revenue capture
          label: 渠道经济性决定最终形成多少净收入
        - from: Revenue capture
          to: Gross profit and runway
          label: 未披露的利润率决定增长能否自我造血
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI011
      - CI014
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Wonder 的公开产品栈以消费者订餐入口为上层，向下叠加市场平台扩张、内部编排、小型门店、中央厨房预制和机器人。
    data:
      layers:
        - label: 客户界面
          detail: Wonder 将应用和网站定位为即时餐食、自取和配送的主要入口。
          modules:
            - Wonder 应用
            - Wonder.com 订餐
            - 多品牌购物篮
          outputs:
            - 统一捕获消费者需求
        - label: 市场平台扩张
          detail: Grubhub 库存让用户能在同一应用入口发现更多餐厅。
          modules:
            - 本地偏好餐厅信息流
            - 可搜索的第三方餐厅库存
          outputs:
            - 无需新增 Wonder 厨房品牌即可扩大品类
        - label: 订单编排
          detail: 行业报道称，Wonder 在内部搭建了这一层，用于分派订单、下发烹饪指令和协调配送物流。
          modules:
            - 订单路由
            - 烹饪指令
            - 远程设备控制
          outputs:
            - 同步的备餐与履约流程
        - label: 门店执行
          detail: 小型门店用一组精简的电气设备完成餐食，而不是配备完整的从零烹饪厨房。
          modules:
            - 烤箱
            - 水浴设备
            - 油炸机
            - 定制容器和设置
          outputs:
            - 在客户附近完成餐食制作
        - label: 中央厨房与规划
          detail: 中央预制和逐店供需映射，降低了后厨所需的占地。
          modules:
            - 新泽西中央厨房
            - 供需映射
            - 门店存储规划
          outputs:
            - 预制组件和更紧凑的门店布局
        - label: 自动化与履约扩张
          detail: Wonder 将机器人与市场平台和配送扩张结合，而不是把自动化当作独立产品。
          modules:
            - Infinite Kitchen 碗餐自动化
            - 配送物流
            - 未来自主配送试点
          outputs:
            - 提升吞吐量的目标和更广的非堂食触达
    claimRefs:
      - CE004
      - CE006
      - CE008
      - CE009
      - CE010
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Wonder 当前呈现的旅程覆盖发现、自营订餐、市场平台扩张和预制餐包邻接，但留存闭环仍未披露。
    data:
      nodes:
        - label: 发现
          detail: 品牌活动和平台叙事聚焦选择、速度与便利。
          touchpoints:
            - 2025 rebrand campaign
            - Selection and no-compromise messaging
        - label: 浏览 Wonder 自有选项
          detail: 家庭用户在应用中浏览 Wonder 自有品牌以及厨师创制或授权品牌。
          touchpoints:
            - More than 25 concepts under one roof
            - One app for delivery, takeout, and dine-in
        - label: 组合一笔订单
          detail: 差异化体验在于把多家 Wonder 餐厅放进同一个购物篮。
          touchpoints:
            - Multi-restaurant ordering
            - One order and one payment
        - label: 快速履约
          detail: 消费者证据强调准备速度，而不是披露的复购行为。
          touchpoints:
            - Four restaurants ready in 15 to 20 minutes
            - Delivery, pickup, or dine-in
        - label: 扩大广度
          detail: Grubhub 本地餐厅和 Blue Apron 将覆盖扩展到更多用餐场景。
          touchpoints:
            - Local favorites inside Wonder app
            - Food for now plus food for later
        - label: 证明持久性
          detail: 公开证据仍未展示客户群留存、渠道构成或集中度。
          touchpoints:
            - No NRR or GRR disclosure
            - No active-user or merchant-retention disclosure
    approximationNotes: 阶段描述呈现出来的客户旅程和扩张循环；它们不是转化率，也不是按交易量加权的漏斗阶段。
    claimRefs:
      - CU001
      - CU003
      - CU006
      - CU008
      - CU009
      - CU010
      - CU011
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险集中在整合广度、资本密集度以及 Wonder 无法完全控制的交易对手上。
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 缓释成熟度
        - label: 剩余敞口
      rows:
        - label: 并购整合
          note: Blue Apron、Grubhub、自有厨房和市场平台都必须在同一运营闭环中运转。
          values:
            - label: 高
              tone: high
              note: 多项收购和运营入口已经合并到面向客户的工作流中。
            - label: 高
              tone: critical
              note: 任何失误都会同时影响客户体验、商户质量和经济性。
            - label: 中
              tone: medium
              note: 公司拥有实质控制力，但公开 KPI 证据很少。
            - label: 高
              tone: high
              note: 收购完成后的业绩证据仍是尽调缺口。
        - label: 门店版图与自动化扩张
          note: 自 2025 年 5 月以来，门店版图扩大至原来的三倍，同时 Wonder 增加了机器人和 AI 投资。
          values:
            - label: 高
              tone: high
              note: 保留证据显示，当前推广速度本身已经很激进。
            - label: 高
              tone: high
              note: 表现不佳会打击吞吐量、服务质量和新店回本。
            - label: 中
              tone: medium
              note: 资金和自营运营有所帮助，但此处没有公开实时部署指标。
            - label: 高
              tone: high
              note: 在展示客户群经济性和正常运行时间之前，剩余敞口仍处高位。
        - label: 市场平台合作伙伴持久性
          note: 外部餐厅品类依赖 Grubhub 式路由和合作伙伴参与。
          values:
            - label: 中
              tone: medium
              note: 该渠道仍在运转，但退出权意味着供给基础并非完全被锁定。
            - label: 高
              tone: high
              note: 品类或商户疲弱会削弱便利性主张。
            - label: 中
              tone: medium
              note: 自有品牌降低了整体依赖，但无法兑现完整的市场平台承诺。
            - label: 高
              tone: high
              note: 商户留存和经济性仍未得到公开验证。
        - label: 合规与控制证据缺口
          note: 分配到的来源池没有保留直接的诉讼、监管、隐私或事件披露。
          values:
            - label: 中
              tone: medium
              note: 这里不是已知事件，而是广泛运营模式缺少外部证明。
            - label: 高
              tone: high
              note: 任何隐藏的合规弱点都会影响食品运营、劳工、数据和配送。
            - label: 低
              tone: warning
              note: 保留来源池中的公开缓释证据有限。
            - label: 高
              tone: high
              note: 在尽调补齐控制材料之前，剩余敞口仍处高位。
        - label: 资本市场与估值证明
          note: 新资本是一项缓释因素，但本轮融资也抬高了经济性和 IPO 准备度的证明门槛。
          values:
            - label: 中
              tone: medium
              note: Wonder 已多次获得融资，但下一项证明责任取决于运营交付。
            - label: 高
              tone: high
              note: 表现不及预期会影响融资灵活性，而不只是观感。
            - label: 中
              tone: medium
              note: 最新一轮融资争取到了时间，但不会自动证明杠杆能力。
            - label: 高
              tone: high
              note: 在经济性和整合质量得到证明之前，剩余敞口仍处高位。
        - label: 客户体验一致性
          note: 当前可见的客户证据是正面的，但其中很大一部分由公司筛选，而非经过独立基准比较。
          values:
            - label: 中
              tone: medium
              note: 这一主张看起来有吸引力，但保留证据没有展示投诉或退款分布。
            - label: 中高
              tone: high
              note: 体验失误会损害复用率和应用的便利性承诺。
            - label: 中
              tone: medium
              note: 内部控制力较强，但此处的独立服务质量验证有限。
            - label: 中高
              tone: high
              note: 在审阅外部质量数据之前，剩余敞口仍高于舒适水平。
    claimRefs:
      - CR003
      - CR004
      - CR008
      - CR009
      - CR013
      - CR016
      - CR017
      - CR018
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 融资能力和平台广度值得关注，但未解决的经济性问题仍主导可投资性判断。
    data:
      nodes:
        - label: 新资本
          detail: $650M D 轮融资，投前估值 $9B，另有 DoorDash 单独投资的 $125M。
        - label: 规模信号
          detail: 截至 2026 年 7 月，门店版图从 46 个地点扩展至 140 个；TechCrunch 后来援引的数字为 157 个地点。
        - label: 平台广度
          detail: Wonder、由 Grubhub 支持的本地餐厅和 Blue Apron 已经处于同一应用体验中。
        - label: 战略选择权
          detail: DoorDash 也在收购 Campus Dining，管理层则在讨论实现 IPO 就绪。
        - label: 未解决的经济性
          detail: 公开来源仍未披露门店回本、分部盈利能力或本轮融资后的优先权悬置。
        - label: 建议
          detail: 继续研究 / 高风险 / 估值偏高，除非尽调改善证据或价格。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV007
      - CV010
      - CV013
