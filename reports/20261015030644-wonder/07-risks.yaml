figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual risk clusters around integration breadth, capital intensity, and
      counterparties Wonder does not fully control.
    data:
      columns:
        - label: Likelihood
        - label: Impact
        - label: Mitigation maturity
        - label: Residual exposure
      rows:
        - label: Roll-up integration
          note: Blue Apron, Grubhub, owned kitchens, and marketplace all have to work in one operating loop.
          values:
            - label: High
              tone: high
              note: Multiple acquisitions and operating surfaces are already combined in customer-facing workflows.
            - label: High
              tone: critical
              note: Misses would affect customer experience, merchant quality, and economics simultaneously.
            - label: Medium
              tone: medium
              note: Company control is meaningful, but public KPI proof is thin.
            - label: High
              tone: high
              note: Post-close performance evidence is still a diligence gap.
        - label: Footprint and automation scale-up
          note: Footprint tripled since May 2025 while Wonder increased robotics and AI investment.
          values:
            - label: High
              tone: high
              note: The rollout pace itself is already aggressive in the retained evidence.
            - label: High
              tone: high
              note: Underperformance would hit throughput, service quality, and new-site payback.
            - label: Medium
              tone: medium
              note: Funding and owned operations help, but live deployment metrics are not public here.
            - label: High
              tone: high
              note: Residual exposure stays elevated until cohort economics and uptime are shown.
        - label: Marketplace partner durability
          note: External restaurant assortment depends on Grubhub-style routing and partner participation.
          values:
            - label: Medium
              tone: medium
              note: The channel is active, but opt-out rights mean the supply base is not fully captive.
            - label: High
              tone: high
              note: Assortment or merchant weakness would undercut the convenience proposition.
            - label: Medium
              tone: medium
              note: Owned brands reduce total dependence, but not the full marketplace promise.
            - label: High
              tone: high
              note: Merchant retention and economics remain unverified publicly.
        - label: Compliance and controls evidence gap
          note: The assigned pool did not retain direct litigation, regulator, privacy, or incident disclosures.
          values:
            - label: Medium
              tone: medium
              note: The issue is not a known event here; it is the absence of external proof for a broad operating model.
            - label: High
              tone: high
              note: Any hidden compliance weakness would matter across food ops, labor, data, and delivery.
            - label: Low
              tone: warning
              note: Public mitigation evidence is limited in the retained pool.
            - label: High
              tone: high
              note: Residual exposure stays high until diligence closes the control pack.
        - label: Capital markets and valuation proof
          note: Fresh capital is a mitigation, but the round also raises the proof bar for economics and IPO readiness.
          values:
            - label: Medium
              tone: medium
              note: Wonder has shown repeated fundraising access, but the next proof burden depends on operating delivery.
            - label: High
              tone: high
              note: A miss would affect financing flexibility, not just optics.
            - label: Medium
              tone: medium
              note: The latest round buys time, but not automatic evidence of leverage.
            - label: High
              tone: high
              note: Residual exposure stays elevated until economics and integration quality are evidenced.
        - label: Customer experience consistency
          note: Current visible customer proof is positive, but much of it is company-curated rather than independently benchmarked.
          values:
            - label: Medium
              tone: medium
              note: The proposition appears resonant, but the retained evidence does not show complaint or refund distributions.
            - label: Medium-high
              tone: high
              note: Experience misses would hurt repeat usage and the app's convenience promise.
            - label: Medium
              tone: medium
              note: Internal control is meaningful, but independent service-quality validation is limited here.
            - label: Medium-high
              tone: high
              note: Residual exposure remains above comfort until outside quality data is reviewed.
    claimRefs: [CR003, CR004, CR008, CR009, CR013, CR016, CR017, CR018]
callouts:
  - calloutType: risk
    title: Kill criterion
    body: >-
      If management cannot produce location-cohort economics, post-close
      Grubhub and Blue Apron retention metrics, and a documented compliance /
      incident pack, the current valuation narrative should be treated as ahead
      of proof.
    claimRefs: [CR003, CR007, CR017, CR018]
  - calloutType: insight
    title: What the latest round does and does not solve
    body: >-
      The Series D lowers immediate liquidity stress and supports continued
      expansion, but it does not independently validate operating leverage,
      partner durability, or integration quality.
    claimRefs: [CR001, CR002, CR004, CR017]
