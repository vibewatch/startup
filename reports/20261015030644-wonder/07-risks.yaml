  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration signal
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Marketplace restaurant supply
        - Local non-Wonder restaurants and Grubhub routing
        - Expands selection inside the Wonder app
        - Restaurants are added based on proximity and can opt out; non-Wonder orders are handled like Grubhub orders
        - Selection breadth or unit economics weaken if opt-out rates or merchant retention disappoint
        - High
        - Wonder still controls its owned brands and Blue Apron surfaces
        - High
      - - Blue Apron integration
        - Blue Apron as a wholly owned subsidiary
        - Extends Wonder into meal kits and at-home delivery
        - Wonder assumed direct delivery obligations for subscribers in its zones and added Blue Apron offers into the app and stores
        - Meal-kit retention or fulfillment friction creates churn or working-capital drag
        - Medium-high
        - Ownership gives Wonder distribution control and product flexibility
        - Medium-high
      - - Capital providers and public-market window
        - Existing investors plus new Series D backers
        - Funds expansion and supports the IPO-readiness narrative
        - Reported capital raised exceeds $3 billion since 2021 and the latest round stepped valuation to $9 billion pre-money
        - If growth or economics lag, future capital could be slower, more dilutive, or more conditional
        - High
        - Fresh funding reduces near-term liquidity pressure
        - High
    notes: >-
      Dependency severity is driven by counterparties that affect assortment,
      fulfillment, and financing, not by an observed failure event in the
