company:
  name: Wonder
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Wonder has evolved from a 2018 Marc Lore startup into a late-private mealtime
    platform that combines owned restaurant concepts, marketplace delivery, meal kits,
    and robotics under one brand. Current assigned evidence strongly supports the July
    2026 $650 million Series D at a $9 billion pre-money valuation and Wonder's rapid
    footprint expansion, but it still leaves core economics, customer scale, and a clean
    post-acquisition performance bridge unresolved.
sections:
  - id: identity-and-platform
    title: Identity and platform
    body: >-
      Wonder was founded by Marc Lore in 2018 and now presents itself as a vertically
      integrated mealtime platform rather than a single restaurant chain. Across its own
      About, newsroom, and financing materials, the company repeats the same core
      proposition: it wants to make great food more accessible by combining recipe
      development, kitchen robotics, delivery infrastructure, owned concepts, local
      restaurant marketplace supply, and at-home meal solutions in one experience.
      Independent 2025 coverage shows the same transition in plainer language, describing
      Wonder's shift from driveway food trucks to multi-concept storefronts and then to an
      app-led platform with Grubhub restaurants and Blue Apron meal kits layered in. The
      strongest identity conclusion is therefore not just that Wonder delivers food, but
      that it is trying to own multiple meal occasions and fulfillment modes inside a
      single branded system.
    claimRefs: [CO001, CO002, CO003, CO004, CO011, CO012, CO013, CO015]
    tableRefs: [TO001]
  - id: leadership-governance-and-control
    title: Leadership, governance, and control
    body: >-
      The assigned evidence still centers Marc Lore as the key strategic actor: founder,
      chief executive, and the person most consistently associated with Wonder's product
      ambition, acquisition strategy, and capital formation. Publicly visible operating
      leadership in the current pool is thinner than that strategic narrative, with
      Courtney Lawrie appearing as the voice of the September 2025 rebrand and marketplace
      expansion while Jack Hartung's 2026 board appointment stands out as the clearest new
      governance signal. QSR explicitly connected Hartung's arrival to IPO-readiness
      speculation, which suggests Wonder is building public-company discipline around a
      still founder-led business. Even so, the current pool does not provide a full board
      roster, voting-control map, or post-round ownership breakdown, so key-person and
      control concentration remain diligence areas rather than closed questions.
    claimRefs: [CO001, CO006, CO007, CO010, CO011]
    tableRefs: [TO002, TO003]
  - id: funding-scale-and-milestones
    title: Funding, scale, and milestones
    body: >-
      Wonder's clearest current facts are around capital, scale, and platform-building
      milestones. The July 2026 Series D brought in $650 million at a $9 billion
      pre-money valuation, with both official and independent reporting aligning on the
      round size, valuation, and investor list. Management said the new capital would fund
      physical expansion, marketplace growth, and continued investment in robotics and AI,
      while also stating that the operating footprint had tripled from 46 to 140
      locations since the prior May 2025 funding announcement. That acceleration sits on
      top of a milestone chain that includes the Blue Apron acquisition, the January 2025
      Grubhub close, the September 2025 rebrand into a broader mealtime platform, and the
      2026 board and Zipline announcements. Taken together, the milestone pattern shows a
      company moving beyond concept creation toward distribution breadth, software surface
      area, and logistics leverage.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010, CO011, CO015, CO016]
    figureRefs: [FO001]
  - id: evidence-gaps-and-watchpoints
    title: Evidence gaps and watchpoints
    body: >-
      The same public narrative that makes Wonder legible also leaves major underwriting
      blind spots. None of the assigned sources provides a verified consolidated revenue or
      run-rate, current headcount, active-customer count, store-level contribution margin,
      or a segment bridge across Wonder's legacy operations, Grubhub, and Blue Apron.
      That matters because the company is now raising at a valuation that independent
      restaurant trade coverage already contextualized as larger than many public
      restaurant peers, while the best adverse-toned item in the current pool still stops
      short of testing standalone economics. The result is a company whose identity,
      ambition, and fundraising momentum are well evidenced, but whose true operating
      quality and post-acquisition integration performance still need direct diligence.
    claimRefs: [CO009, CO010, CO014]
callouts:
  - calloutType: strength
    title: Platform breadth is the core strategic through-line
    body: >-
      Across official and independent sources, Wonder's most consistent strength claim is
      the same: one platform that spans owned brands, outside restaurants, meal kits, and
      robotics-enabled fulfillment rather than a single format bet.
    claimRefs: [CO003, CO004, CO011, CO012, CO015]
  - calloutType: risk
    title: Economics remain materially under-disclosed
    body: >-
      Current public evidence supports funding, valuation, and expansion milestones, but it
      does not support a clean read on revenue quality, customer scale, unit economics, or
      post-acquisition segment performance.
    claimRefs: [CO005, CO009, CO014]
