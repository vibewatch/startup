            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO010
      - number: '1.3'
        title: Funding, scale, and milestones
        blocks:
          - type: paragraph
            body: >-
              Wonder's clearest current facts are around capital, scale, and platform-building milestones. The July 2026
              Series D brought in $650 million at a $9 billion pre-money valuation, with both official and independent
              reporting aligning on the round size, valuation, and investor list. Management said the new capital would
              fund physical expansion, marketplace growth, and continued investment in robotics and AI, while also
              stating that the operating footprint had tripled from 46 to 140 locations since the prior May 2025 funding
              announcement. That acceleration sits on top of a milestone chain that includes the Blue Apron acquisition,
              the January 2025 Grubhub close, the September 2025 rebrand into a broader mealtime platform, and the 2026
              board and Zipline announcements. Taken together, the milestone pattern shows a company moving beyond
              concept creation toward distribution breadth, software surface area, and logistics leverage.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO015
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO005
              - CO009
              - CO010
              - CO011
              - CO015
              - CO016
      - number: '1.4'
        title: Evidence gaps and watchpoints
        blocks:
          - type: paragraph
            body: >-
              The same public narrative that makes Wonder legible also leaves major underwriting blind spots. None of
              the assigned sources provides a verified consolidated revenue or run-rate, current headcount,
              active-customer count, store-level contribution margin, or a segment bridge across Wonder's legacy
              operations, Grubhub, and Blue Apron. That matters because the company is now raising at a valuation that
              independent restaurant trade coverage already contextualized as larger than many public restaurant peers,
              while the best adverse-toned item in the current pool still stops short of testing standalone economics.
              The result is a company whose identity, ambition, and fundraising momentum are well evidenced, but whose
              true operating quality and post-acquisition integration performance still need direct diligence.
            claimRefs:
              - CO009
              - CO010
              - CO014
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Platform breadth is the core strategic through-line
            body: >-
              Across official and independent sources, Wonder's most consistent strength claim is the same: one platform
              that spans owned brands, outside restaurants, meal kits, and robotics-enabled fulfillment rather than a
              single format bet.
            calloutType: strength
            claimRefs:
              - CO003
              - CO004
              - CO011
