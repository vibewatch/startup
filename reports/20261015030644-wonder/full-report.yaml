      - number: '5.2'
        title: Operating architecture and deployment model
        blocks:
          - type: paragraph
            body: >-
              Wonder’s disclosed architecture is unusually specific for a private food platform. Official copy says the
              company owns the workflow from recipe development through delivery, and trade reporting adds useful
              operational detail: an in-house software stack reportedly handles order routing, cooking instructions, and
              delivery logistics, while some equipment can be controlled remotely. The physical system is also
              nonstandard. Retained sources describe stores using only three core electric devices—oven, water bath, and
              fryer—with custom settings and vessels to mimic traditional cooking methods, plus a centralized commissary
              that preps components for store finishing. That combination supports small-format deployment and easier
              site selection, but it also creates dependencies on central prep, software orchestration, and disciplined
              last-mile execution.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
