  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Wonder is defining a mealtime surface, not just another restaurant chain
        blocks:
          - type: paragraph
            body: >-
              The public record frames Wonder as a bundled mealtime platform rather than a single-format restaurant
              operator. Official company language around the Grubhub acquisition described a combined order flow
              spanning first-party and third-party restaurants, groceries, and meal kits, while the 2026 funding release
              split the offer between "food for now" marketplace supply and at-home meal solutions for later occasions.
              Independent trade coverage points in the same direction: QSR describes one digital platform spanning owned
              restaurants, licensed brands, local restaurant delivery, and meal solutions, and NRN reported that the app
              already combined Wonder originals, non-Wonder restaurants via Grubhub, and Blue Apron meal kits. That
              means the relevant market boundary includes multiple food-ordering and meal-planning moments, but it also
              means broad restaurant-delivery or grocery spend cannot be treated as automatically addressable without
              separating which occasions Wonder actually serves well.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM011
      - number: '2.2'
        title: Buyer logic differs by channel, with households at the core and institutions as adjacency
        blocks:
          - type: paragraph
            body: >-
              The owned-location value proposition appears strongest where a single household wants variety without
              coordinating multiple orders. Wonder's own review snippets emphasize that "five different cravings" can be
              consolidated into one transaction, and Wonder's multi-restaurant ordering feature formalizes that
              convenience by letting a customer combine items from more than 30 concepts in one order. On the
              institutional side, the Grubhub assets extend the buyer map beyond consumers to universities and employers
              through campus dining and corporate accounts. Adoption is therefore not driven by one universal budget
              owner: household food budgets matter for the core consumer product, while procurement or benefits budgets
              matter for campus and corporate adjacencies. Restaurant Business also reports that suburban,
              family-oriented markets are outperforming older urban locations, which helps explain why Wonder is leaning
              into convenience-led household demand rather than purely dense urban discovery behavior.
            claimRefs:
              - CM005
              - CM009
              - CM010
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.3'
        title: Public sizing is strongest as channel-capacity and footprint evidence, not spend-market math
        blocks:
          - type: paragraph
            body: >-
              Publicly verifiable market sizing is available mainly through operating-footprint and channel reach
              lenses. Wonder's July 2026 financing release said the company had tripled its owned footprint from 46 to
              140 locations since May 2025, while Restaurant Business independently put Wonder at 140 locations across
              10 East Coast states and Washington, D.C. The Grubhub acquisition adds a much broader adjacency lens:
              375,000 merchants, 200,000 delivery partners, over 4,000 U.S. cities, 360 universities, and more than
              10,000 companies. Texas expansion plans add another option-value lens, with a stated ambition for 100-plus
              locations across major metros by 2027. These data points are useful because they show reachable supply,
              geographies, and institutional channels, but they are not directly comparable units and they are not a
              defensible TAM/SAM/SOM stack on their own.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM007
              - CM008
      - number: '2.4'
        title: Adoption drivers are visible, but economics and channel mix still cap conviction
        blocks:
          - type: paragraph
            body: >-
              The drivers in public evidence are clear: variety in one order, dense menu breadth, owned-app traffic, and
              automation-funded affordability are the core reasons management thinks the format can widen beyond a niche
              urban delivery use case. Marc Lore told Restaurant Business that 85% of Wonder's traffic already comes
              through its own app and website, which, if durable, improves control over merchandising and commission
              leakage on the owned-location side. He also argued that automation can add roughly 20 points of profit
              margin versus traditional restaurants, a claim that matters directly to pricing power and market
              expansion. The problem is verification: none of the retained public sources breaks out store-level
              contribution margins, repeat rates, take rates, or post-Grubhub order mix in a way that would translate
              these drivers into a clean adoption curve or a valuation-grade SAM/SOM. That keeps market potential
              plausible but still under-specified.
            claimRefs:
              - CM010
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Platform breadth widens the spend pool, but also mixes different buying motions
            body: >-
              Wonder's addressable market story is broader than restaurant delivery because it now bundles owned
              kitchens, local marketplace supply, and meal kits; the tradeoff is that each surface has a different
              buyer, unit economics profile, and conversion path.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: callout
            title: Public sizing is still channel-shape evidence, not a valuation-grade market model
            body: >-
              Footprint, merchant, and institutional counts show reach, but the retained public evidence still does not
              isolate repeat behavior, take rates, or store-level margins strongly enough to convert those counts into a
              clean SAM or SOM.
            calloutType: risk
            claimRefs:
