chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and platform
        blocks:
          - type: paragraph
            body: >-
              Wonder was founded by Marc Lore in 2018 and now presents itself as a vertically integrated mealtime
              platform rather than a single restaurant chain. Across its own About, newsroom, and financing materials,
              the company repeats the same core proposition: it wants to make great food more accessible by combining
              recipe development, kitchen robotics, delivery infrastructure, owned concepts, local restaurant
              marketplace supply, and at-home meal solutions in one experience. Independent 2025 coverage shows the same
              transition in plainer language, describing Wonder's shift from driveway food trucks to multi-concept
              storefronts and then to an app-led platform with Grubhub restaurants and Blue Apron meal kits layered in.
              The strongest identity conclusion is therefore not just that Wonder delivers food, but that it is trying
              to own multiple meal occasions and fulfillment modes inside a single branded system.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO011
              - CO012
              - CO013
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO005
              - CO009
              - CO010
              - CO013
              - CO014
      - number: '1.2'
        title: Leadership, governance, and control
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence still centers Marc Lore as the key strategic actor: founder, chief executive, and
              the person most consistently associated with Wonder's product ambition, acquisition strategy, and capital
              formation. Publicly visible operating leadership in the current pool is thinner than that strategic
              narrative, with Courtney Lawrie appearing as the voice of the September 2025 rebrand and marketplace
              expansion while Jack Hartung's 2026 board appointment stands out as the clearest new governance signal.
              QSR explicitly connected Hartung's arrival to IPO-readiness speculation, which suggests Wonder is building
              public-company discipline around a still founder-led business. Even so, the current pool does not provide
              a full board roster, voting-control map, or post-round ownership breakdown, so key-person and control
              concentration remain diligence areas rather than closed questions.
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO010
              - CO011
