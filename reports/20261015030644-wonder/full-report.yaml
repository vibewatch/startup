  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set spans more than delivery apps
        blocks:
          - type: paragraph
            body: |-
              Wonder's landscape is broader than a normal restaurant or delivery-app comp set. The
              company's offer now stretches across owned restaurants, licensed or acquired brands,
              local restaurant delivery through Grubhub, and at-home meal kits through Blue Apron,
              which means the real alternatives include delivery marketplaces, digital food halls,
              single-concept local restaurants, and planned-at-home meals. That breadth helps
              Wonder solve the "mixed cravings in one order" problem better than a single cuisine
              operator, but it also means Wonder has to win against multiple incumbent behaviors
              rather than only one direct peer set.
            claimRefs:
              - CP001
              - CP003
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP007
              - CP011
              - CP012
              - CP016
      - number: '3.2'
        title: Integration is the clearest current differentiator
        blocks:
          - type: paragraph
            body: |-
              Public evidence points to one clear competitive wedge: Wonder is trying to own more
              of the fulfillment stack than a pure marketplace. The single-order, multi-restaurant
              experience is paired with physical kitchens, last-mile delivery, and a widened app
              surface that now includes local non-Wonder restaurants and Blue Apron meal kits.
              That design gives Wonder a better shot at keeping the customer relationship than a
              marketplace that only routes demand. It also explains why management keeps framing
              Wonder as a platform rather than a restaurant chain, and why the business keeps
              raising capital to expand kitchens, robotics, and local density simultaneously.
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP007
              - CP011
              - CP013
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP004
              - CP006
              - CP014
      - number: '3.3'
        title: Incumbents still own breadth and force Wonder to prove economics
        blocks:
          - type: paragraph
            body: |-
              Wonder is more integrated than DoorDash or Uber Eats, but the marketplaces remain
              stronger on assortment and consumer habit. Assigned sources describe them as the two
              dominant leaders, with inventory that extends beyond restaurant meals into grocery,
              convenience, and other local commerce categories. Wonder also needs much denser
              kitchen coverage than those lighter-asset platforms because its delivery radii stay
              tight around each site. That raises the bar for capital efficiency, especially
              because public reporting still does not disclose whether individual Wonder locations
              or the consolidated platform are profitable.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP008
              - CP009
      - number: '3.4'
        title: Durability depends on trust, repeat behavior, and category proof
        blocks:
          - type: paragraph
            body: |-
              The moat case is real but still conditional. Wonder can claim better control over
              cooking quality, speed, and menu coordination than a marketplace, yet the assigned
              pool also shows why that advantage may be fragile: consumer trust questions remain
              live, the digital food hall category has a history of failures, and local operators
              can frame Wonder as a well-funded aggregator rather than a beloved neighborhood
              brand. If Wonder cannot translate integration into repeat purchasing, profitable
              kitchen clusters, and stronger brand trust than earlier shared-kitchen concepts, the
              model risks becoming an expensive hybrid instead of a durable competitive platform.
            claimRefs:
              - CP010
              - CP011
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Wonder's best wedge is stack integration, not a standalone restaurant brand
            body: >-
              Wonder looks strongest when it is compared with marketplace apps on ownership of the kitchen, ordering,
              and delivery experience rather than on menu brand recognition alone.
            calloutType: strength
            claimRefs:
              - CP002
              - CP004
              - CP014
          - type: callout
            title: Broad incumbents can still outflank Wonder while economics stay opaque
            body: >-
              DoorDash and Uber Eats already win on assortment breadth, and Wonder has not yet published enough
              profitability data to prove that its denser, more integrated model is economically superior.
            calloutType: risk
            claimRefs:
              - CP008
              - CP009
              - CP011
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model breadth is visible, but monetization quality is not
        blocks:
          - type: paragraph
            body: >-
              The retained sources consistently describe Wonder as a multi-surface mealtime platform rather than a
              single-format restaurant operator. Wonder's own July 2026 financing release and a September 2025 NRN
              update describe a stack that combines Wonder-owned or licensed restaurant concepts, local non-Wonder
              restaurants powered by Grubhub, and Blue Apron meal kits in one app. Customer evidence on Wonder's own
              site also supports the behavior that matters for the model: households can place one order and one payment
              across multiple restaurant concepts. That breadth matters financially because it can widen order occasions
              and basket-building opportunities, but the retained public evidence still does not show what share of
              revenue comes from first-party food sales versus marketplace fees versus meal-kit economics, nor whether
              any of those channels carry materially better margins than the others.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI014
