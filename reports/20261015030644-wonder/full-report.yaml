      - number: '4.2'
        title: Fresh capital supports expansion, but it also underscores capital intensity
        blocks:
          - type: paragraph
            body: >-
              Wonder's July 2026 round was large enough to keep expansion moving, but the stated uses of proceeds point
              to a model that still needs substantial capital to scale. Wonder said it raised $650 million at a $9
              billion pre-money valuation and would use the money for physical expansion, marketplace growth, and
              continued investments in technology, robotics, and artificial intelligence. Company and independent
              coverage also say the footprint expanded from 46 to 140 locations since the May 2025 financing
              announcement, while third-party reporting ties the company to prior acquisitions including Grubhub, Blue
              Apron, and Sweetgreen's Infinite Kitchen business. A separate Texas expansion article adds that a future
              100-plus-location rollout would require storefront construction, kitchen buildouts, technology
              infrastructure, and professional services. That combination supports the growth story, but it also implies
              that growth is being financed through a capex-heavy and integration-heavy strategy, not yet through
              clearly disclosed self-funded unit economics.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI011
              - CI014
      - number: '4.3'
        title: Unit economics, cash position, and financing dependency remain the key blockers
        blocks:
          - type: paragraph
            body: >-
              The chapter's main underwriting problem is not a lack of strategy narrative; it is the absence of the core
              operating numbers that would show whether the story converts into durable economics. None of the retained
              sources discloses current cash, gross debt, covenant burden, preference-stack terms, burn rate, customer
              acquisition cost, payback period, or mature-store contribution margins. Public evidence therefore explains
              where Wonder intends to spend capital more clearly than it explains how quickly that capital converts into
              profitable repeat demand. The only adverse signal in the assigned pool is secondary rather than primary: a
              Wikipedia citation headline referencing reported New Jersey job cuts after the July fundraise. Without the
              underlying article text in the pool, that item is a prompt for direct verification rather than a clean
              downside datapoint, but it reinforces that labor efficiency and post-round cost discipline deserve direct
              diligence.
            claimRefs:
              - CI011
              - CI013
              - CI014
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              Wonder looks financeable in the near term because investors just supplied a very large round and
              management can point to visible expansion, distribution breadth, and acquisition-backed product surfaces.
              But the public record still does not separate list-pricing and convenience narratives from actual realized
              revenue quality, nor does it quantify store-level margins, channel economics, or remaining runway after
              aggressive rollout and integration spending. The resulting view is that Wonder's revenue model is
              understandable at a strategic level, while its margin path and capital adequacy are still not
              underwritable from public evidence alone.
            claimRefs:
              - CI001
              - CI003
              - CI005
              - CI011
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Fresh financing improves capacity, not transparency
            body: >-
              The July 2026 raise clearly extends Wonder's ability to expand, but public evidence still stops short of
              the cash, debt, burn, and margin disclosures that would show whether the business is self-funding or
              simply better financed.
            calloutType: insight
            claimRefs:
              - CI001
              - CI003
              - CI011
              - CI014
          - type: callout
            title: The underwriting gap is unit economics, not strategic narrative
            body: >-
              Retained sources make the platform story easy to follow, yet they do not reveal store contribution, CAC
              payback, or channel mix; that leaves the margin path and next-round dependency unresolved.
            calloutType: risk
            claimRefs:
              - CI005
              - CI011
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform scope and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Public evidence now frames Wonder less as a single restaurant concept and more as a mealtime platform that
              spans owned kitchen capacity, app-based ordering, marketplace inventory, and at-home meal solutions.
              Official materials describe one integrated customer experience across in-house and chef-created concepts,
              local restaurant delivery, and meal kits, while Restaurant Business Online reported that the company is
              shifting from “a restaurant with an app” to “an app with restaurants.” That matters because the product
              promise is not just menu variety inside a store; it is a single ordering workflow where households can
              combine multiple Wonder brands in one basket and, increasingly, discover non-Wonder restaurants through
              the same app. The limitation is that the strongest proof of service quality in the retained pool is still
              Wonder-controlled testimony rather than independent operating data.
            claimRefs:
              - CE001
