      - number: '5.3'
        title: Maturity, differentiation, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Wonder’s clearest technology differentiation claim is Infinite Kitchen, a robotics platform the company
              says already includes a fully automated bowl-making system in commercial use. That robotics and AI
              narrative is now paired with a materially larger footprint: official July 2026 funding materials said the
              company had expanded from 46 to 140 locations since May 2025 and would keep investing in marketplace
              growth, robotics, and AI. The combination of multibrand ordering, compact ventless kitchens, commissary
              support, and automation gives Wonder a plausible operating edge over a generic food hall or single-brand
              delivery app. The risk is that independent coverage still highlights the difficulty of coordinating
              multiple brands, multiple locations, and procurement flows at attractive unit economics, and the retained
              public materials do not provide strong trust or resilience disclosures to counterbalance that risk.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated mealtime stack is real, not just a branding claim
            body: >-
              The retained pool supports a specific workflow: Wonder owns kitchen capacity, app-based demand capture,
              commissary prep, store finishing, and a growing automation layer, with Grubhub extending assortment inside
              the same consumer surface.
            calloutType: strength
            claimRefs:
              - CE001
              - CE004
              - CE006
              - CE010
          - type: callout
            title: Scaling complexity is better evidenced than trust controls
            body: >-
              Independent reporting offers a concrete warning about multi-brand operational complexity, while the
              retained public materials do not provide equally concrete disclosure on security, privacy, compliance,
              status, or resilience controls.
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base mix centers on household meal occasions, with newer marketplace layers
        blocks:
          - type: paragraph
            body: >-
              Wonder's current customer proposition is still anchored in direct household ordering, but the company is
              trying to widen the user and payer surface beyond a single first-party restaurant experience. Official
              materials describe a platform that covers immediate delivery from Wonder restaurants, local restaurant
              delivery through Grubhub, and Blue Apron meal kits for later-planned meals. That broadens segment reach
              across spontaneous individual orders, family meal coordination, and pantry-planning occasions, but the
              evidence remains far better on what Wonder offers than on who spends most, repeats most, or expands across
              those surfaces, which is why the public customer story is still narrative-heavy rather than metrics-heavy.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU008
              - CU011
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
