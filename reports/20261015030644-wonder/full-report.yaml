              - CU002
              - CU003
              - CU008
              - CU011
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU006
              - CU008
              - CU009
              - CU010
              - CU011
      - number: '6.2'
        title: Adoption proof exists, but it is mostly supply growth plus consumer anecdotes
        blocks:
          - type: paragraph
            body: >-
              The strongest public adoption signals in the assigned pool are footprint growth and a small number of
              direct consumer testimonials. Wonder and QSR both say the footprint expanded from 46 locations to roughly
              140 between May 2025 and July 2026, while Restaurant Business described roughly 50 locations in September
              2025 and a pace of one new opening per week. That shows geographic reach increasing quickly, but it is
              still a supply-side growth proxy, not a disclosed demand cohort. The most concrete usage proof is a
              Wonder-hosted review feed with consumers describing one-order, multi-restaurant experiences and fast
              readiness times, which is useful but still far short of a disclosed customer funnel.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU013
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
