              - CU008
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
      - number: '6.3'
        title: Durability remains the key blind spot, and marketplace expansion has visible limits
        blocks:
          - type: paragraph
            body: >-
              Public sources support the thesis that Wonder is expanding customer choice, but they also show where the
              experience still fragments. Independent trade press says local Grubhub restaurants are now discoverable in
              the Wonder app, yet synchronized multi-restaurant ordering remains limited to Wonder's in-house brands and
              merchants can opt out of appearing in the marketplace. That means surface breadth is improving faster than
              the differentiated fulfillment loop that makes Wonder special. More importantly, the assigned sources
              disclose no active-user counts, repeat-order curves, merchant retention, NRR, GRR, or customer and channel
              concentration, so durability is still largely unproven from public evidence.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Cross-surface breadth is real
            body: >-
              By late 2025 and mid-2026, Wonder's public materials and trade coverage consistently frame the app as
              spanning Wonder-made meals, Grubhub marketplace supply, and Blue Apron meal kits, which is broader than a
              single-format delivery app or ghost-kitchen concept.
            calloutType: insight
            claimRefs:
              - CU001
              - CU008
              - CU011
          - type: callout
            title: Customer durability still lacks public proof
            body: >-
              The available evidence shows convenience and footprint growth, but not whether customers stay active,
              expand spend, or renew across the combined Wonder, Grubhub, and Blue Apron surfaces.
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Capital access is strong, but it raises the execution bar materially
        blocks:
          - type: paragraph
            body: >-
              The clearest current mitigation is access to capital: Wonder disclosed a $650 million Series D in July
              2026 at a $9 billion pre-money valuation, while Restaurant Dive reported that the company has raised more
              than $3 billion since 2021. That lowers immediate financing stress, but it does not remove model risk. The
              same evidence set also shows a footprint that tripled from 46 to 140 locations since May 2025 and a
              strategy that keeps adding acquisitions, robotics, and marketplace breadth. That combination means future
              underwriting depends less on whether Wonder can keep raising money and more on whether management can
              prove segment economics, integration quality, and repeatability fast enough to justify the higher
              valuation and IPO-readiness narrative now attached to the company.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR011
              - CR017
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR008
              - CR009
              - CR010
              - CR011
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR004
              - CR008
              - CR009
              - CR013
              - CR016
              - CR017
              - CR018
      - number: '7.2'
        title: The operating model is now a roll-up, not a single-format restaurant business
        blocks:
          - type: paragraph
            body: >-
              Wonder is no longer just opening owned sites; it is trying to run a mealtime platform that spans Wonder
              brands, Blue Apron meal solutions, Grubhub-powered marketplace supply, robotics, and planned drone
              delivery. The Blue Apron acquisition closed in 2023, the Grubhub acquisition was finalized in early 2025,
              and by late 2025 Wonder was already routing local non-Wonder restaurants through the Wonder app.
              Restaurant Business also notes that one-basket ordering across multiple restaurants works only for
              Wonder's in-house brands because those brands come from one location, which shows that the product promise
              still depends on operational boundaries. The risk is not demand creation; it is stitching together several
              different service models without visible public evidence on uptime, routing accuracy, merchant retention,
              or post-close cohort economics.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR008
              - CR009
              - CR013
              - CR017
      - number: '7.3'
        title: Compliance and partner durability remain under-disclosed
        blocks:
          - type: paragraph
            body: >-
              The assigned source pool supports a broad picture of strategic ambition, but it does not provide direct
              regulator, litigation, privacy, security, or incident disclosures that would let an investor clear the
              legal and operational control environment from public evidence alone. That matters more because Wonder's
              model combines company-operated food preparation, app ordering, delivery, meal kits, and marketplace
              distribution across a rapidly expanding footprint. Partner durability is also not settled: NRN and
              Restaurant Business show that local restaurants are being added to the Wonder marketplace through Grubhub
              and can opt out, which means part of the selection promise depends on counterparties Wonder does not fully
              control. The chapter therefore underwrites partner and compliance exposure as unresolved diligence work
              rather than as a cleared risk.
            claimRefs:
              - CR003
              - CR004
              - CR008
              - CR009
              - CR013
              - CR018
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR008
              - CR013
              - CR018
      - number: '7.4'
        title: Kill criteria should focus on economics, integration proof, and control evidence
        blocks:
          - type: paragraph
            body: >-
              The thesis breaks if management cannot show three things in diligence: first, a reconciled bridge for
              location-level payback and contribution margins after the rollout from 46 to 140 locations; second, hard
              post-close metrics for Grubhub and Blue Apron showing retention, routing quality, and economics rather
              than just distribution breadth; and third, a verifiable compliance and incident pack covering food safety,
              labor, privacy, and security controls. Fresh funding, board additions, and expansion momentum are
              meaningful mitigants, but they are not substitutes for audited operating proof. Until those materials are
              produced, the residual risk profile remains high enough that valuation discipline should stay tighter than
              the current fundraising narrative suggests.
            claimRefs:
              - CR001
              - CR003
              - CR007
              - CR008
              - CR011
              - CR017
              - CR018
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Kill criterion
            body: >-
              If management cannot produce location-cohort economics, post-close Grubhub and Blue Apron retention
              metrics, and a documented compliance / incident pack, the current valuation narrative should be treated as
              ahead of proof.
            calloutType: risk
            claimRefs:
              - CR003
              - CR007
              - CR017
              - CR018
          - type: callout
            title: What the latest round does and does not solve
            body: >-
              The Series D lowers immediate liquidity stress and supports continued expansion, but it does not
              independently validate operating leverage, partner durability, or integration quality.
            calloutType: insight
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR017
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The public record supports a price-sensitive, not momentum-sensitive, call. Wonder has multiple
              corroborated signals of capital access: the company announced a $650 million Series D at a $9 billion
              pre-money valuation, independent trade coverage put the post-money mark at $9.65 billion, and TechCrunch
              reported a separate DoorDash package worth $425 million split between a Campus Dining asset sale and a
              Series D investment. Those facts matter because they show investors still fund the platform vision. They
              do not, by themselves, prove that the current valuation is attractive for a new investor without cleaner
              evidence on store-level contribution margins, segment profitability, and the terms sitting ahead of common
              equity. The most supportable stance from this evidence set is research-more, with a high risk rating and a
              stretched valuation stance until diligence fills those gaps or the entry price compensates for them.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV010
              - CV013
      - number: '8.2'
        title: Why the platform story still has bull cases
        blocks:
          - type: paragraph
            body: >-
              There is a real thesis underneath the premium pricing. Wonder’s own July 2026 release said the footprint
              had tripled from 46 to 140 locations since May 2025, while TechCrunch reported 157 locations by September
              and described a planned Texas launch in early 2027. Nation’s Restaurant News said the app had already
              combined Wonder originals, Grubhub-powered local restaurants, and Blue Apron meal kits into one experience
              by September 2025, which is the clearest retained evidence that management is stitching multiple meal
              occasions into a single front door. The DoorDash transaction also matters strategically, because it
              monetizes the Grubhub Campus Dining asset while bringing in fresh equity capital. That combination can
              support a credible bull case around scale, distribution, and exit optionality, but it is still more a
              proof of strategic ambition than a proof of durable economics.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV010
              - CV011
              - CV014
      - number: '8.3'
        title: What keeps the current mark hard to underwrite
        blocks:
          - type: paragraph
            body: >-
              The anti-thesis is not that Wonder lacks growth; it is that the current valuation is ahead of the public
              operating evidence. Restaurant Business argued in September 2025 that none of Wonder’s three major legs
              was sturdy on its own, because restaurants are hard, delivery remains scale-intensive and competitive, and
              meal kits have a long history of struggling. The same article noted that DoorDash and Uber Eats were
              already acting more like super apps, which means Wonder is not buying a category without incumbents. That
              competitive backdrop matters because the retained source set does not disclose a clean revenue and margin
              bridge across owned locations, Grubhub, Blue Apron, and newer assets, nor does it provide store-cohort
              payback or post-round preference-stack detail. As a result, the right comparable set is qualitative rather
              than multiple-driven: delivery super apps for breadth, and Wonder’s own step-up from the reported $7
              billion mark in 2025 to the 2026 $9 billion pre-money round for financing momentum.
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
      - number: '8.4'
        title: Final diligence asks and thesis-breaks
        blocks:
          - type: paragraph
            body: >-
              Before paying anywhere near the latest private mark, diligence should demand four concrete packages:
              first, store-level cohort economics including contribution margin, labor, and payback; second, a segment
              bridge for Wonder stores, Grubhub marketplace, Blue Apron, and newer media or robotics assets; third,
              post-close Grubhub operating trends such as orders, active diners, merchant retention, and profitability;
              and fourth, the current cash, debt, liquidation preference, and any other structure senior to new common.
              The thesis breaks if those materials show that owned-store growth is capital hungry without fast payback,
              that Grubhub remains a value trap rather than a distribution flywheel, or that the capital stack absorbs
              too much upside for a new entrant. Until then, the most defensible posture is to keep Wonder on the active
              worklist rather than convert the current financing headline into an affirmative buy call.
            claimRefs:
              - CV008
              - CV010
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not confuse financing momentum with valuation support
            body: >-
              The assigned pool validates that sophisticated capital is still available to Wonder, but it does not
              validate that a new investor should accept the latest private mark without materially better operating and
              structural disclosure.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV013
          - type: callout
            title: The thesis breaks on economics or structure, not on vision
            body: >-
              If store cohorts, Grubhub profitability, or the senior capital stack turn out materially worse than
              implied by the financing headline, the valuation compression risk is much larger than the strategic-story
              upside.
            calloutType: risk
            claimRefs:
              - CV008
              - CV010
              - CV014
