  - id: FP001
    title: Wonder sits between marketplace breadth and restaurant-stack control
    type: quadrant
    summary: Ordinal scoring compares meal-occasion breadth with control of the ordering-to-fulfillment stack.
    data:
      xAxis:
        label: Meal-occasion breadth (1=narrow, 5=broad)
        min: 1
        max: 5
      yAxis:
        label: Control of ordering-to-fulfillment stack (1=marketplace only, 5=integrated)
        min: 1
        max: 5
      points:
        - label: Wonder
          x: 4
          'y': 5
          detail: Owned concepts, local marketplace inventory, meal kits, and integrated fulfillment layers.
        - label: DoorDash
          x: 5
          'y': 2
          detail: Very broad merchant assortment, but no owned kitchen layer in assigned sources.
        - label: Uber Eats
          x: 5
          'y': 2
          detail: Broad convenience coverage, with fulfillment remaining marketplace-led.
        - label: Digital food halls
          x: 3
          'y': 3
          detail: Shared-kitchen multi-brand format, but category scale and trust are weaker.
        - label: Local restaurants
          x: 2
          'y': 4
          detail: Strong kitchen control inside one concept, but limited breadth for mixed-group orders.
        - label: Meal kits
          x: 2
          'y': 1
          detail: Useful for planned later meals, not on-demand mixed-brand fulfillment.
    approximationNotes: Axes are evidence-backed ordinal scores rather than measured market-share, margin, or NPS benchmarks.
    claimRefs:
      - CP004
      - CP006
      - CP014
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence shows how demand can enter Wonder's platform, but not how much margin survives each step.
    approximationNotes: >-
      This flow summarizes public operating logic from retained sources; it is not an internal accounting bridge and
      does not imply disclosed conversion rates.
    data:
      nodes:
        - label: Customer meal occasion
          detail: Delivery, takeout, dine-in, and food-for-later demand appear across retained sources.
          tone: positive
        - label: Unified ordering surfaces
          detail: >-
            Wonder originals, local restaurants powered by Grubhub, and Blue Apron meal kits sit inside one customer
            relationship.
          tone: positive
        - label: Basket aggregation
          detail: Public customer proof says a household can place one order and one payment across multiple concepts.
          tone: positive
        - label: Fulfillment footprint
          detail: Wonder said its footprint grew from 46 to 140 locations while also expanding marketplace reach.
          tone: neutral
        - label: Revenue capture
          detail: >-
            Public evidence supports multiple monetization surfaces, but not the mix between first-party sales,
            marketplace fees, and meal kits.
          tone: neutral
        - label: Gross profit and runway
          detail: >-
            New capital is earmarked for expansion, marketplace growth, robotics, and AI, but margin, burn, and payback
            remain undisclosed.
          tone: risk
      edges:
        - from: Customer meal occasion
          to: Unified ordering surfaces
          label: More meal occasions can enter one platform
        - from: Unified ordering surfaces
          to: Basket aggregation
          label: One transaction can span multiple concepts
        - from: Basket aggregation
          to: Fulfillment footprint
          label: Orders rely on stores, delivery, and marketplace logistics
        - from: Fulfillment footprint
          to: Revenue capture
          label: Channel economics determine what becomes net revenue
        - from: Revenue capture
          to: Gross profit and runway
          label: Undisclosed margins determine whether growth funds itself
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI011
      - CI014
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Wonder’s public product stack layers a consumer ordering surface over marketplace expansion, in-house
      orchestration, compact stores, commissary prep, and robotics.
    data:
      layers:
        - label: Customer interface
          detail: Wonder positions the app and website as the primary entry point for immediate meals, pickup, and delivery.
          modules:
            - Wonder app
            - Wonder.com ordering
            - Multibrand cart
          outputs:
            - Unified consumer demand capture
        - label: Marketplace expansion
          detail: Grubhub inventory broadens restaurant discovery inside the same app surface.
          modules:
            - Local favorites feed
            - Searchable third-party restaurant inventory
          outputs:
            - Wider assortment without new Wonder kitchen brands
        - label: Order orchestration
          detail: >-
            Trade reporting says Wonder built this layer in-house to route orders, push cooking instructions, and
            coordinate delivery logistics.
          modules:
            - Order routing
            - Cooking instructions
            - Remote equipment control
          outputs:
            - Synchronized prep and fulfillment workflow
        - label: Store execution
          detail: Small-format sites finish food with a narrow set of electric equipment rather than a full scratch kitchen.
          modules:
            - Oven
            - Water bath
            - Fryer
            - Custom vessels and settings
          outputs:
            - Final meal production near the customer
        - label: Commissary and planning
          detail: Central prep and per-store supply-demand mapping reduce back-of-house footprint requirements.
          modules:
            - New Jersey commissary
            - Supply-demand mapping
            - Store storage planning
          outputs:
            - Prepped components and tighter site layouts
        - label: Automation and fulfillment expansion
          detail: >-
            Wonder pairs robotics with marketplace and delivery expansion rather than treating automation as a
            standalone product.
          modules:
            - Infinite Kitchen bowl automation
            - Delivery logistics
            - Future autonomous delivery pilots
          outputs:
            - Higher throughput ambition and broader off-premise reach
    claimRefs:
      - CE004
      - CE006
      - CE008
      - CE009
      - CE010
      - CE011
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Wonder's surfaced journey now spans discovery, first-party ordering, marketplace expansion, and meal-kit
      adjacency, but the retention loop is still undisclosed.
    data:
      nodes:
        - label: Discover
          detail: Brand campaign and platform story center on selection, speed, and convenience.
          touchpoints:
            - 2025 rebrand campaign
            - Selection and no-compromise messaging
        - label: Browse Wonder-made options
          detail: Households browse Wonder originals and chef-created or licensed brands in app.
          touchpoints:
            - More than 25 concepts under one roof
            - One app for delivery, takeout, and dine-in
        - label: Build one order
          detail: The differentiated moment is combining multiple Wonder restaurants in one basket.
          touchpoints:
            - Multi-restaurant ordering
            - One order and one payment
        - label: Fulfill quickly
          detail: Consumer proof highlights fast readiness rather than disclosed repeat behavior.
          touchpoints:
            - Four restaurants ready in 15 to 20 minutes
            - Delivery, pickup, or dine-in
        - label: Expand breadth
          detail: Grubhub local restaurants and Blue Apron widen coverage across more meal occasions.
          touchpoints:
            - Local favorites inside Wonder app
            - Food for now plus food for later
        - label: Prove durability
          detail: Public evidence still does not show cohort retention, channel mix, or concentration.
          touchpoints:
            - No NRR or GRR disclosure
            - No active-user or merchant-retention disclosure
    approximationNotes: >-
      Stages describe the surfaced customer journey and expansion loops; they are not conversion rates or
      volume-weighted funnel stages.
    claimRefs:
      - CU001
      - CU003
      - CU006
      - CU008
      - CU009
      - CU010
      - CU011
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual risk clusters around integration breadth, capital intensity, and counterparties Wonder does not fully
      control.
    data:
      columns:
        - label: Likelihood
        - label: Impact
        - label: Mitigation maturity
        - label: Residual exposure
      rows:
        - label: Roll-up integration
          note: Blue Apron, Grubhub, owned kitchens, and marketplace all have to work in one operating loop.
          values:
            - label: High
              tone: high
              note: Multiple acquisitions and operating surfaces are already combined in customer-facing workflows.
            - label: High
              tone: critical
              note: Misses would affect customer experience, merchant quality, and economics simultaneously.
            - label: Medium
              tone: medium
              note: Company control is meaningful, but public KPI proof is thin.
            - label: High
              tone: high
              note: Post-close performance evidence is still a diligence gap.
        - label: Footprint and automation scale-up
          note: Footprint tripled since May 2025 while Wonder increased robotics and AI investment.
          values:
            - label: High
              tone: high
              note: The rollout pace itself is already aggressive in the retained evidence.
            - label: High
              tone: high
              note: Underperformance would hit throughput, service quality, and new-site payback.
            - label: Medium
              tone: medium
              note: Funding and owned operations help, but live deployment metrics are not public here.
            - label: High
              tone: high
              note: Residual exposure stays elevated until cohort economics and uptime are shown.
        - label: Marketplace partner durability
          note: External restaurant assortment depends on Grubhub-style routing and partner participation.
          values:
            - label: Medium
              tone: medium
              note: The channel is active, but opt-out rights mean the supply base is not fully captive.
            - label: High
              tone: high
              note: Assortment or merchant weakness would undercut the convenience proposition.
            - label: Medium
              tone: medium
              note: Owned brands reduce total dependence, but not the full marketplace promise.
            - label: High
              tone: high
              note: Merchant retention and economics remain unverified publicly.
        - label: Compliance and controls evidence gap
          note: The assigned pool did not retain direct litigation, regulator, privacy, or incident disclosures.
          values:
            - label: Medium
              tone: medium
              note: The issue is not a known event here; it is the absence of external proof for a broad operating model.
            - label: High
              tone: high
              note: Any hidden compliance weakness would matter across food ops, labor, data, and delivery.
            - label: Low
              tone: warning
              note: Public mitigation evidence is limited in the retained pool.
            - label: High
              tone: high
              note: Residual exposure stays high until diligence closes the control pack.
        - label: Capital markets and valuation proof
          note: Fresh capital is a mitigation, but the round also raises the proof bar for economics and IPO readiness.
          values:
            - label: Medium
              tone: medium
              note: Wonder has shown repeated fundraising access, but the next proof burden depends on operating delivery.
            - label: High
              tone: high
              note: A miss would affect financing flexibility, not just optics.
            - label: Medium
              tone: medium
              note: The latest round buys time, but not automatic evidence of leverage.
            - label: High
              tone: high
              note: Residual exposure stays elevated until economics and integration quality are evidenced.
        - label: Customer experience consistency
          note: >-
            Current visible customer proof is positive, but much of it is company-curated rather than independently
            benchmarked.
          values:
            - label: Medium
              tone: medium
              note: >-
                The proposition appears resonant, but the retained evidence does not show complaint or refund
                distributions.
            - label: Medium-high
              tone: high
              note: Experience misses would hurt repeat usage and the app's convenience promise.
            - label: Medium
              tone: medium
              note: Internal control is meaningful, but independent service-quality validation is limited here.
            - label: Medium-high
              tone: high
              note: Residual exposure remains above comfort until outside quality data is reviewed.
    claimRefs:
      - CR003
      - CR004
      - CR008
      - CR009
      - CR013
      - CR016
      - CR017
      - CR018
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Capital access and platform breadth support attention, but unresolved economics still dominate the investability
      call.
    data:
      nodes:
        - label: Fresh capital
          detail: $650M Series D at $9B pre-money plus a separate $125M DoorDash investment.
        - label: Scale signal
          detail: Footprint moved from 46 to 140 locations by July 2026, with TechCrunch later citing 157 locations.
        - label: Platform breadth
          detail: Wonder, Grubhub-powered local restaurants, and Blue Apron already sit in one app experience.
        - label: Strategic optionality
          detail: DoorDash is also buying Campus Dining, and management is talking about becoming IPO-ready.
        - label: Unresolved economics
          detail: >-
            Public sources still do not disclose store payback, segment profitability, or post-round preference
            overhang.
        - label: Recommendation
          detail: research-more / high risk / stretched until diligence improves the evidence or price.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV007
      - CV010
      - CV013
