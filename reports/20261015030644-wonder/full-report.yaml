              - CO015
          - type: callout
            title: Economics remain materially under-disclosed
            body: >-
              Current public evidence supports funding, valuation, and expansion milestones, but it does not support a
              clean read on revenue quality, customer scale, unit economics, or post-acquisition segment performance.
            calloutType: risk
            claimRefs:
