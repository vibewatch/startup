  topStrengths:
    - Strong capital access and repeated investor support.
    - Broad mealtime platform spanning owned concepts, marketplace delivery, meal kits, and logistics.
    - Management keeps adding distribution and automation channels.
  topRisks:
    - Public evidence still lacks a consolidated revenue and margin bridge across segments.
    - Integration and control risk remains high across Grubhub, Blue Apron, and owned stores.
    - The current valuation remains ahead of disclosed operating evidence.
  unresolvedGaps:
    - A clean segment revenue and margin bridge across legacy Wonder, Grubhub, Blue Apron, WonderWorks, and Tastemade.
    - Post-close Grubhub trends for orders, active users, merchant retention, and profitability under Wonder ownership.
    - Store-level unit economics, payback periods, and contribution margins for new Wonder locations by market cohort.
    - >-
      Current cash, debt, preference-stack terms, and a reconciled lifetime-capital total after the 2024-2026 financing
      and acquisition sequence.
    - >-
      Direct customer repeat behavior and channel mix across owned locations, marketplace distribution, meal kits,
      campus, and B2B programs.
