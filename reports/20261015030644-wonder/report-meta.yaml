companyProfile:
  summary: >-
    Wonder is a late-private mealtime platform founded by Marc Lore in 2018 that combines owned restaurant concepts,
    delivery marketplace supply, meal kits, and supporting logistics and robotics into a single consumer brand. The
    current public record shows rapid expansion and major capital access, but it still leaves core operating economics,
    acquisition integration, and capital-stack detail insufficiently disclosed for a clean public-market style
    underwriting.
