figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Wonder's surfaced journey now spans discovery, first-party ordering, marketplace expansion,
      and meal-kit adjacency, but the retention loop is still undisclosed.
    data:
      nodes:
        - label: Discover
          detail: Brand campaign and platform story center on selection, speed, and convenience.
          touchpoints:
            - 2025 rebrand campaign
            - Selection and no-compromise messaging
        - label: Browse Wonder-made options
          detail: Households browse Wonder originals and chef-created or licensed brands in app.
          touchpoints:
            - More than 25 concepts under one roof
            - One app for delivery, takeout, and dine-in
        - label: Build one order
          detail: The differentiated moment is combining multiple Wonder restaurants in one basket.
          touchpoints:
            - Multi-restaurant ordering
            - One order and one payment
        - label: Fulfill quickly
          detail: Consumer proof highlights fast readiness rather than disclosed repeat behavior.
          touchpoints:
            - Four restaurants ready in 15 to 20 minutes
            - Delivery, pickup, or dine-in
        - label: Expand breadth
          detail: Grubhub local restaurants and Blue Apron widen coverage across more meal occasions.
          touchpoints:
            - Local favorites inside Wonder app
            - Food for now plus food for later
        - label: Prove durability
          detail: Public evidence still does not show cohort retention, channel mix, or concentration.
          touchpoints:
            - No NRR or GRR disclosure
            - No active-user or merchant-retention disclosure
    approximationNotes: >-
      Stages describe the surfaced customer journey and expansion loops; they are not conversion
      rates or volume-weighted funnel stages.
    claimRefs:
      - CU001
      - CU003
      - CU006
      - CU008
      - CU009
      - CU010
      - CU011
