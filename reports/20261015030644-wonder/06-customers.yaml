  - id: TU003
    title: Named customer proof table
    columns:
      - Customer proof item
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Apple App Store review on Wonder homepage (2025-07-26)
        - Household consumer
        - In-store or app order spanning four restaurant concepts
        - Production consumer use
        - Reviewer said items from four restaurants were ready in 15 or 20 minutes
        - Single anecdote on a company-controlled surface with no spend or repeat data
      - - Apple App Store review on Wonder homepage (2025-07-26)
        - Household or family meal order
        - One-order convenience across different preferences
        - Production consumer use
        - Reviewer said everyone in the family could get what they want in one order and one payment
        - Anonymous reviewer and no retention evidence
      - - Grubhub restaurant integration in Wonder app
        - Third-party merchant network and end consumers
        - Search and order local favorites alongside Wonder offerings
        - Live launch, not pilot
        - NRN and Restaurant Business say local non-Wonder restaurants were added directly to the app
        - Not a named reference account and mixed-basket ordering still stays inside Wonder-made brands
