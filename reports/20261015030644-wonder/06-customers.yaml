  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-durability
      missingEvidence: NRR, GRR, churn, renewal, cohort, or repeat-order disclosures across Wonder, Grubhub, and Blue Apron surfaces
      whyItMatters: Without retention evidence, the chapter can show convenience and footprint growth but not whether users stick, expand spend, or lapse.
      diligencePath: Request 12-month active-customer, order-frequency, and cohort retention data by first-party, Grubhub, and Blue Apron channels.
      relatedQuestionRefs:
        - QU008
    - type: missing-source
      severity: material
      topic: concentration-and-channel-mix
      missingEvidence: Customer concentration, merchant concentration, and channel mix across Wonder-made meals, Grubhub marketplace, and Blue Apron
      whyItMatters: Concentration can change valuation and operating risk even when topline growth and location count look strong.
      diligencePath: Request monthly order mix, top-merchant exposure, top-customer or cohort concentration, and share of GMV by surface.
      relatedQuestionRefs:
        - QU008
    - type: enumeration-incomplete
      severity: material
