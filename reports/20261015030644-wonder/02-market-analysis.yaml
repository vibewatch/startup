        - label: Corporate adjacency
          value: 10000
          unit: companies+
          valueNote: Grubhub corporate accounts
        - label: Campus adjacency
          value: 360
          unit: universities+
          valueNote: Grubhub campus dining endpoints
        - label: Current owned footprint
          value: 140
          unit: locations
          valueNote: Wonder locations as of July 2026
        - label: Texas option set
          value: 100
          unit: planned locations+
          valueNote: Texas expansion ambition by 2027
    approximationNotes: >-
      This is not a proportional TAM/SAM/SOM stack: the layers mix network, channel, and footprint
      counts from different units and should be read as nested access lenses.
    claimRefs: [CM005, CM007, CM008]
callouts:
  - calloutType: insight
    title: Platform breadth widens the spend pool, but also mixes different buying motions
    body: >-
      Wonder's addressable market story is broader than restaurant delivery because it now bundles
      owned kitchens, local marketplace supply, and meal kits; the tradeoff is that each surface has
      a different buyer, unit economics profile, and conversion path.
    claimRefs: [CM001, CM002, CM003, CM004]
  - calloutType: risk
    title: Public sizing is still channel-shape evidence, not a valuation-grade market model
    body: >-
      Footprint, merchant, and institutional counts show reach, but the retained public evidence
      still does not isolate repeat behavior, take rates, or store-level margins strongly enough to
      convert those counts into a clean SAM or SOM.
    claimRefs: [CM005, CM007, CM010, CM014, CM015]
