  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: byoc-pricing
    missingEvidence: Aiven's platform management fee for BYOC enterprise contracts — the amount charged on top of the customer's
      direct cloud infrastructure cost — has not been disclosed in any public source. The pricing mechanics and minimum commitment
      thresholds for BYOC contracts are confidential.
    whyItMatters: BYOC pricing directly affects Aiven's gross margin structure for this growing segment; if the platform fee
      is low (to win large cloud-cost-sensitive accounts), the incremental margin from BYOC may be substantially below the
      standard deployment margin, which already embeds cloud infrastructure as a cost pass-through.
    diligencePath: Request BYOC commercial term sheet and representative deal economics from Aiven CFO or Head of Enterprise
      Sales, under NDA.
    relatedQuestionRefs:
    - QE002
    - QE020
    relatedTableRefs:
    - TE002
  - type: private-evidence-only
    severity: material
    topic: inkless-production-status
    missingEvidence: No public customer case study, production post-mortem, or Aiven-issued statement confirming that Inkless
      Kafka has been deployed in a production high-stakes workload (e.g., financial services, e-commerce at scale) as of May
      2026. The "not yet production-hardened" characterisation from InfoQ (Q1 2025) has not been publicly rebutted or superseded
      by production evidence.
    whyItMatters: The commercial viability of the >94% cost reduction claim depends entirely on whether the latency and reliability
      trade-offs are acceptable in real production environments. Without production track record evidence, Inkless Kafka's
      addressable market remains speculative.
    diligencePath: Request customer references using Inkless Kafka in production, including workload type, throughput, SLA
      achieved, and latency experienced. Request internal Aiven reliability data for Inkless Kafka services from engineering
      leadership.
    relatedQuestionRefs:
    - QE008
    - QE026
  - type: private-evidence-only
    severity: minor
    topic: cmk-implementation-details
    missingEvidence: Aiven's Terraform provider v4.56.0 CMK/BYOK support is documented in the changelog but the full KMS provider
      compatibility list, key rotation procedure, key-revocation behaviour, and BYOC CMK applicability have not been publicly
      detailed as of the research date.
    whyItMatters: Data-sovereignty-sensitive customers (financial services, healthcare, government) require explicit confirmation
      that CMK supports their preferred KMS (AWS KMS, Google Cloud KMS, Azure Key Vault) and that key revocation results in
      immediate data inaccessibility before adopting the feature.
    diligencePath: Request Aiven CMK implementation documentation from product management; test CMK provisioning and revocation
      in a proof-of-concept environment using the Terraform provider.
    relatedQuestionRefs:
    - QE025
  - type: stale
    severity: minor
    topic: security-incident-history
    missingEvidence: No public record of security incidents, CVE disclosures, or breach notifications involving Aiven's platform
      infrastructure has been found in the sources reviewed; however, the absence of adverse findings may reflect limited
      public disclosure rather than absence of incidents.
    whyItMatters: Enterprise customers in regulated industries require a clean security incident history or full transparency
      about past incidents and remediation to satisfy their own vendor risk management requirements.
    diligencePath: Request Aiven's security incident register and any active CVE disclosures for the past 36 months from the
      CISO or security team under NDA.
    relatedQuestionRefs:
    - QE018
  - type: enumeration-incomplete
    severity: minor
    topic: eversql-integration-status
    missingEvidence: The EverSQL AI-powered query optimisation capability, acquired November 2023, does not appear with a
      discrete product listing in Aiven's Q2 2026 services documentation. It is unclear whether EverSQL has been fully integrated
      into the platform, remains as a standalone feature, or has been embedded into existing PostgreSQL or MySQL services.
    whyItMatters: The EverSQL acquisition was presented as a strategic AI-differentiation move; its current product status
      affects how the acquisition should be valued and whether it has delivered the stated integration synergies.
    diligencePath: Review Aiven's current product documentation for EverSQL or AI query optimisation features; request product
      roadmap update from CPO Cassio Sampaio.
    relatedQuestionRefs:
    - QE001
    relatedTableRefs:
    - TE001
