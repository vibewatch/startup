callouts:
- calloutType: strength
  title: KIP-1150 Acceptance Validates Aiven's Open-Source Architecture Strategy
  body: The March 2, 2026, acceptance of KIP-1150 (Diskless Topics) by the Apache Kafka PMC with 9 binding votes represents
    a rare instance of a commercial vendor successfully landing a fundamental architectural change into an Apache project.
    Aiven proposed, prototyped, and open-sourced the implementation before community acceptance, demonstrating technical depth
    and a genuine upstream-first approach. This positions Aiven to become the reference implementation of Inkless Kafka in
    the managed-service market, creating durable differentiation that is more defensible than feature parity or pricing. The
    >94% infrastructure cost reduction claim, while contingent on workload type, is the most compelling cost story in the
    managed Kafka market as of mid-2026.
  claimRefs:
  - CE023
  - CE024
  - CE025
- calloutType: risk
  title: Inkless Kafka P99 Latency and Production-Hardening Gap Limit Addressable Market
  body: Inkless Kafka's P99 end-to-end latency of approximately 1.5 seconds — confirmed in Aiven's own benchmarks and corroborated
    by independent InfoQ analysis — disqualifies the service from latency-sensitive production workloads including payment
    processing, real-time fraud detection, and interactive user-facing applications. The non-acceptance of KIP-1163 (segment
    lifecycle management) leaves an orphaned-segment risk after leader failover during log compaction that has not been formally
    resolved in the accepted design. Independent reviewers as of Q1 2025 characterised the implementation as not yet production-hardened.
    Aiven has not published a public statement contradicting this characterisation. Until Inkless Kafka achieves a verified
    production track record on high-stakes workloads, it will remain a cost-optimisation tool for a subset of Kafka use cases
    rather than a universal replacement for Classic Kafka.
  claimRefs:
  - CE026
  - CE037
  - CE038
  - CE039
- calloutType: recommendation
  title: CMK / BYOK Now GA; Validate Key Management Architecture in Due Diligence
  body: Terraform provider v4.56.0 (released May 2026) added Customer-Managed Key (CMK / BYOK) support across all Aiven services,
    closing a gap that had been a blocker for regulated financial-services and government customers who require control over
    encryption keys. Diligence teams evaluating Aiven for data-sovereignty-sensitive workloads should verify the key management
    architecture (which KMS providers are supported, whether keys can be rotated without service disruption, and whether key
    revocation results in immediate data inaccessibility) by requesting Aiven's CMK implementation documentation or testing
    it directly in a proof-of-concept environment. The CMK feature availability does not extend to BYOC in the same manner
    as standard deployments; confirm scope explicitly.
  claimRefs:
  - CE018
  - CE041
