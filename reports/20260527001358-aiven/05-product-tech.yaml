- id: devops-toolchain-and-integrations
  title: DevOps Toolchain and Integrations
  body: 'Aiven''s infrastructure-as-code and automation surface consists of five primary tools: a REST API, a Terraform provider,
    a Kubernetes operator, a Python CLI, and an MCP server for AI-agent integration. The REST API (api.aiven.io/v1) exposes
    all platform operations programmatically and is the foundation on which all other tools are built. The Terraform provider
    (github.com/aiven/terraform-provider-aiven) is written in Go under an MIT licence; version 4.56.0, released in May 2026,
    added Customer-Managed Key (CMK / BYOK) support across all services, a material security capability for enterprises with
    data-sovereignty requirements. At 131 GitHub stars and 79 forks, the provider is functional but commands a smaller open-source
    following than Confluent''s or Elastic''s analogous providers.


    The Kubernetes operator (github.com/aiven/aiven-operator) operates under the Apache 2.0 licence with the aiven.io/v1alpha1
    CRD group and is installable via Helm. Its Docker image (aivenoy/aiven-operator) has accumulated more than 10,000 pulls
    on Docker Hub, indicating meaningful production adoption despite 36 GitHub stars. The Python CLI (avn) is Apache 2.0 licensed
    with 92 stars. The MCP server enables AI agent frameworks to provision and manage Aiven services programmatically; the
    official documentation warns that some MCP operations are irreversible, a standard caution for agentic automation of infrastructure.'
