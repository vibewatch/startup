- id: security-compliance-and-reliability
  title: Security, Compliance, and Reliability
  body: 'Aiven''s compliance portfolio covers five principal frameworks — ISO 27001:2013, SOC 2 Type II, GDPR, HIPAA, and
    PCI-DSS — as confirmed in its ClickHouse product documentation and referenced across the platform security pages. ISO
    27001 and SOC 2 are applicable to all deployment models; HIPAA and PCI-DSS in the Standard tier require customer-side
    configuration of encryption and access controls, whereas ECE provides a controlled environment where Aiven takes operational
    responsibility for the compliance posture.


    At the infrastructure security layer, all customer deployments run in single-tenant VPCs with TLS encryption for in-transit
    data. Operator access to customer services is audit-logged through the control plane. Aiven publishes SBOM (Software Bill
    of Materials) reports via its CLI, enabling supply-chain security reviews — an increasingly important capability as enterprise
    procurement teams require SBOM evidence under CISA and EU Cyber Resilience Act frameworks. A GitHub secret-scanning partnership
    adds a credential-leak detection layer for customers who inadvertently commit Aiven API keys to source code repositories.
    Periodic penetration testing is documented in the platform security concepts page, though results are not published externally.


    The SLA tiers range from no uptime guarantee on Free and Developer plans to 99.99% Monthly Uptime on Startup, Business,
    and Premium plans, with a 30x service credit for verified downtime exceeding the SLA threshold. The May 2026 changelog
    confirms active platform development (Terraform v4.56.0, AMQP connector for Kafka Connect, Valkey 9 as default, OCI region
    expansion), and status.aiven.io reported fully operational across all regions as of the research date.'
