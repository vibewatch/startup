chapter:
  number: 5
  title: Product & Technology
  summary: Aiven's product architecture centres on a 12-service managed open-source data platform deployed across three progressively
    isolated models — Standard (Aiven-hosted VPCs), Enhanced Compliance Environment (ECE, for HIPAA/PCI-DSS), and Bring Your
    Own Cloud (BYOC, customer-owned infrastructure). The most differentiated technical initiative is Inkless Kafka, the commercial
    name for Aiven's implementation of Apache KIP-1150 (Diskless Topics), which stores Kafka data in object storage rather
    than disk and was accepted by the Apache PMC on March 2, 2026, with 9 binding votes. Benchmarks show greater than 94%
    infrastructure cost reduction at 1 GiB/s workload but a meaningful latency trade-off (P99 ≈ 1.5 s vs. sub-20 ms for classic
    Kafka), limiting production suitability to throughput-sensitive, latency-tolerant workloads. The DevOps toolchain — Terraform
    provider (v4.56.0, MIT), Kubernetes Operator (Apache 2.0), REST API, Python CLI, and MCP server — represents solid IaC
    coverage, though low GitHub star counts (131 / 36 / 92) relative to cloud-native peers signal a narrower developer community
    than Confluent or Elastic. Platform compliance (ISO 27001, SOC 2, HIPAA, PCI-DSS, GDPR) is well-documented, with ECE providing
    the highest assurance tier. The key product-risk flag is Inkless Kafka's production-hardening gap flagged by independent
    technical reviewers, together with the non-acceptance of KIP-1163 (segment lifecycle), which leaves orphaned-segment exposure
    in the current design.
sections:
- id: service-catalog-and-deployment-models
  title: Service Catalog and Deployment Models
  body: 'Aiven''s product catalogue spans twelve managed open-source data services organised across six functional categories:
    streaming and messaging (Apache Kafka Classic, Apache Kafka Inkless, Apache Flink), relational databases (PostgreSQL,
    MySQL), analytics (ClickHouse, OpenSearch), in-memory caching (Valkey, Dragonfly), observability (Grafana, Aiven for Metrics
    / Thanos), and NoSQL (Apache Cassandra). Every service shares a common control plane, consistent tooling surface (Terraform,
    Kubernetes Operator, REST API, CLI), and a unified support SLA structure — a deliberate multi-product strategy that enables
    customers to consolidate multiple managed-data vendors onto a single platform and reduces integration friction as workloads
    evolve.


    The three deployment models represent a capability staircase. Standard deployment places managed services in Aiven-owned,
    single-tenant VPCs on AWS, Google Cloud, or Azure; customers never share compute with other tenants. The Enhanced Compliance
    Environment (ECE) goes further by disabling all internet access from service nodes, requiring customer-approved cloud
    regions, and mandating Advanced or Premium support tier with a committed spend contract — satisfying HIPAA and PCI-DSS
    workloads that standard VPC isolation cannot accommodate. Bring Your Own Cloud (BYOC), launched May 2023, inverts the
    infrastructure ownership model: the customer''s cloud account hosts all service virtual machines and pays the underlying
    cloud bill directly, while Aiven charges a platform management fee for orchestration, upgrades, monitoring, and support.
    BYOC is available on AWS (private and public architecture variants) and GCP (private and public), with the bastion-host
    model used to give Aiven''s control plane a minimal, audited access channel into the customer''s environment. Early BYOC
    customers reportedly reduced overall cloud spend by an average of 30 percent versus standard hosted arrangements.'
