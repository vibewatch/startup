- id: platform-architecture-and-control-plane
  title: Platform Architecture and Control Plane
  body: 'Aiven''s control plane is a centralised orchestration layer that manages provisioning, configuration, patching, backups,
    failover, and monitoring for every managed service across all three deployment models. In standard and ECE deployments
    the control plane operates Aiven-owned VPCs in the customer-selected cloud and region; in BYOC, it reaches into the customer''s
    VPC exclusively through a bastion host with a static IP, ensuring that Aiven''s operational access is bounded, auditable,
    and revocable.


    VPC isolation is single-tenant by default. Customers can configure project-scoped VPCs (one VPC per cloud/region combination)
    or organisation-scoped VPCs shared across projects, with VPC peering linking the Aiven-managed VPC to the customer''s
    own application VPC for private connectivity. Service integrations allow cross-service metric and log routing within the
    platform — for example, routing PostgreSQL performance metrics into Aiven-hosted Grafana or into Aiven for Metrics (Thanos-based)
    for long-term storage and alerting.


    Maintenance windows are configurable by customers, and Aiven uses rolling upgrades for multi-node services (Kafka, OpenSearch)
    to achieve zero-downtime patching. Single-node services (PostgreSQL on Developer tier, MySQL) experience a brief, scheduled
    failover window. Service forking creates a full point-in-time copy of any service, including cross-region forks, supporting
    disaster-recovery rehearsals and data migration workflows without disrupting the production service.'
