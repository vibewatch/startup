      whyItMatters: "The only IPO statement available is from October 2021; the strategic context has changed materially after the 2023 restructuring and four-year funding gap."
      diligencePath: "Review any recent CEO interviews, investor conference appearances, or company blog posts for updated commentary on exit horizon."
      relatedQuestionRefs: [QI012, QI021]

