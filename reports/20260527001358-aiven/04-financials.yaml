    type: flow
    layout: standard
    summary: >-
      The subscription price bundles three stacked cost layers — cloud infrastructure pass-through,
      platform operations, and Aiven margin — with BYOC removing the infrastructure layer for enterprise
      customers and potentially improving blended gross margin.
