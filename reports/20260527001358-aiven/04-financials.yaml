    type: range
    insight: >-
      Aiven's estimated gross margin of 55–65% sits 10–20 percentage points below Confluent's and Elastic's
      74%+ FY2025 actuals, reflecting a structural cost gap at current scale driven by cloud infrastructure
      pass-through costs. Confluent's margin trajectory — from ~65% at $586M revenue (FY2022) to 74.3% at
      $1.167B (FY2025) — suggests Aiven has a credible path to margin expansion as ARR scales, but reaching
      parity with public peers requires approximately 5–10× more revenue than Aiven's current level.
    approximationNotes: >-
      Aiven gross margin is an analyst estimate; all other figures are from public financial disclosures
      (Confluent and Elastic annual reports via stockanalysis.com / macrotrends.net). Confluent FY2022
      figure is used to illustrate the margin trajectory at comparable revenue scale.
