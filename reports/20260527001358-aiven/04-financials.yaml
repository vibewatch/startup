  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: gross-margin
      missingEvidence: "Aiven's actual cost of revenue, gross profit, and gross margin — available only from audited financial statements or management accounts."
      whyItMatters: "Gross margin is the single most important metric for valuing an infrastructure SaaS company; without it, the $3B valuation cannot be meaningfully assessed and the all-important margin trajectory (toward Confluent-like 74%+) is purely speculative."
      diligencePath: "Request audited consolidated P&L for FY2022–FY2025 or management accounts including cost of revenue breakdown, from Aiven CFO or company counsel."
      relatedQuestionRefs: [QI003, QI024]
      relatedTableRefs: [TI003]

    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: "Current cash balance, monthly net burn rate, debt facilities, and expected runway to cash-flow breakeven or next capital event."
      whyItMatters: "Capital adequacy is a binary risk; if runway is exhausted before a new raise or breakeven, the company is in existential distress. A four-year funding gap cannot be assessed from public data alone."
      diligencePath: "Request most recent balance sheet, cash-flow statement, and management's internal cash runway model directly from Aiven CFO."
      relatedQuestionRefs: [QI011, QI018]
      relatedTableRefs: [TI004, TI005]

    - type: private-evidence-only
      severity: material
      topic: arr
      missingEvidence: "Precise ARR figure with definition (contracted vs. run-rate), ARR growth rate by quarter, NRR/GRR, and customer count by ARR band."
      whyItMatters: "Revenue quality (expansion vs. new logo vs. churn) drives terminal value and LTV/CAC ratios. Without NRR, it is impossible to differentiate high-quality recurring revenue from churn-masked ARR."
      diligencePath: "Request quarterly ARR waterfall, cohort retention analysis by vintage year, and customer segmentation by ARR tier from Aiven CRO or investor relations."
      relatedQuestionRefs: [QI001, QI013, QI014]
      relatedTableRefs: [TI003, TI005]

    - type: stale
      severity: material
      topic: valuation
      missingEvidence: "A refreshed primary-round valuation, secondary transaction, or formal 409A / board-approved mark between May 2022 and May 2026."
      whyItMatters: "The $3B May 2022 valuation was set at peak SaaS multiples and has not been refreshed publicly in four years. The implied 27–30× ARR multiple is unsupported by 2026 market conditions."
      diligencePath: "Review secondary market transaction records, obtain Eurazeo or Atomico's latest internal carry mark, or request most recent 409A valuation from company counsel."
      relatedQuestionRefs: [QI002, QI023]
      relatedTableRefs: [TI004, TI005]

    - type: conflicting-data
      severity: material
      topic: arr
      missingEvidence: "Explanation of the ~$48.7M GetLatka ARR estimate versus the $100M+ company-confirmed figure — reconciliation of vintage, ARR definition (contracted vs. annualized run rate vs. ACV), or confirmation that GetLatka data is simply stale."
      whyItMatters: "A $60M discrepancy in ARR estimates is material for valuation anchoring; if the GetLatka figure reflects a different ARR definition, the $100M+ figure may be on a different accounting basis than the SaaS industry standard."
      diligencePath: "Request management's ARR accounting policy document; ask directly whether ARR includes BYOC pass-through costs or reflects only Aiven-recognized subscription revenue."
      relatedQuestionRefs: [QI013, QI015]
      relatedTableRefs: [TI005]

    - type: missing-source
      severity: minor
      topic: exit
