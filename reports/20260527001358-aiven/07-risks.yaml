        Without retention metrics, an investor cannot determine whether Aiven's ARR growth reflects true
        expansion (NRR > 120%) or is partially offset by material churn — a distinction with large valuation
        implications at a 27–30× ARR multiple.
      diligencePath: >-
        Request: (1) trailing-12-month NRR and GRR by cohort (Standard vs BYOC), (2) current total logo
        count and trailing-12-month net logo change, (3) top-10 customer ARR as percentage of total,
        (4) any customer cohort retention data available internally.
      relatedQuestionRefs:
