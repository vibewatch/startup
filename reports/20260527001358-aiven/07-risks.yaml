  - id: security-compliance-and-technical-gaps
    title: Security, Compliance Opacity, and Technical Residual Risks
    body: >-
      Aiven's published security posture is credible in scope: all customer deployments run in single-tenant VPCs,
      TLS is enforced for all in-transit connections, operator access is audit-logged through the control plane, and
      periodic penetration testing is documented. The compliance portfolio spans ISO 27001:2013, SOC 2 Type II, GDPR,
      HIPAA (via ECE), and PCI-DSS (via ECE), covering the principal regulatory frameworks relevant to enterprise
      and regulated-industry buyers. The Aiven status page showed "We're fully operational — We're not aware of any
      issues affecting our systems" at the time of access (May 2026), and no publicly reported security incident,
      data breach, or service disruption was identified in any source reviewed.


      However, several residual gaps create diligence uncertainty. First, actual SOC 2 and ISO 27001 audit reports
      are not publicly available — customers must request them under NDA from Aiven. Without auditor-qualified
      certification details, the scope, carve-outs, and any qualified opinions in those audits are unverifiable from
      the outside. Second, HIPAA and PCI-DSS compliance is only available in the Enhanced Compliance Environment
      (ECE) and requires customer-side configuration; the standard deployment tier carries a materially lower assurance
      posture for healthcare and payments workloads. Third, BYOC deployments (AWS and GCP only as of May 2026 — Azure
      BYOC availability is not confirmed in public documentation) inherit the customer's cloud account compliance
      posture, not Aiven's, which creates a patchwork compliance picture for multi-cloud enterprise buyers.


      The most specific technical residual risk is Inkless Kafka's orphaned-segment exposure from KIP-1163. The
      Apache Kafka PMC accepted KIP-1150 (Diskless Topics) on 2 March 2026, providing community validation of the
      core Inkless architecture. However, KIP-1163 (segment lifecycle management), which would complete the production-hardening
      of the Inkless design, has not been accepted. Independent technical reviewers have flagged this gap as leaving
      orphaned log segments in cloud storage under failure-recovery scenarios — a correctness issue that is distinct
      from the latency trade-offs Aiven has benchmarked and disclosed. Until KIP-1163 is accepted and backported,
      enterprises running Inkless Kafka for durable event-streaming workloads carry unmitigated data-loss or
      cost-accumulation exposure from orphaned segments.
    claimRefs:
      - CR037
      - CR038
      - CR039
      - CR040
      - CR041
      - CR042
