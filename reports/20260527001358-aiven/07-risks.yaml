  - id: TR005
    title: Mitigation Status and Kill Criteria
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Capital adequacy and stale valuation
        - Funding announcement, IPO filing, or secondary transaction disclosure
        - No new primary round or S-1 announced by end of 2026; or new round priced below $1.5 B (~14× current ARR)
        - "Thesis break: implies either distress fundraising or material valuation reset; require full financial disclosure before any material commercial or investment commitment"
      - - Hyperscaler competitive encirclement
        - Aiven ARR growth rate deceleration below 20% YoY AND/OR hyperscaler publicly announces Aiven-compatible feature parity at lower price point
        - ARR growth below 15% YoY at any ARR Club check-in after $109M baseline; or AWS/GCP announces first-party AlloyDB managed service in direct competition with AlloyDB Omni
        - Reduce confidence in pricing power and growth durability; require management commentary on competitive win/loss data
      - - Customer concentration and retention opacity
        - NRR disclosure below 100% or top-10 customer representing >30% of ARR
        - Management provides NRR < 100% or logo churn > 15% in trailing 12 months; any single BYOC customer cancellation equivalent to >5% of ARR
        - Material adverse finding; re-underwrite revenue durability; likely reconsideration of investment thesis
      - - Open-source license change in core service
        - ASF or PostgreSQL Global Development Group announces license change for Kafka, Flink, or PostgreSQL
        - Any Apache 2.0 → SSPL/proprietary relicensing of Kafka, Flink, or PostgreSQL
        - Immediate thesis disruption; require product pivot timeline and cost assessment within 30 days
      - - Key-person departure
        - CEO Oskari Saarenmaa departure announcement
        - Any public announcement of CEO transition without an identified permanent successor in place
        - Pauses IPO process; requires board-level engagement before any new capital commitment
      - - Inkless Kafka production incident
        - Public disclosure of customer data loss or unrecoverable orphaned-segment accumulation attributed to Inkless Kafka
        - Any confirmed production data-loss event linked to KIP-1163 gap in an Inkless Kafka deployment
        - Reputational risk; likely customer compensation claims; pause Inkless Kafka adoption recommendation pending KIP-1163 resolution
    notes: Kill criteria are calibrated to observable public-market signals and management-disclosed metrics. Several triggers
      (NRR, customer concentration, ARR growth rate) require management disclosure that Aiven has not historically provided.
      Achieving visibility on these metrics is a prerequisite for removing the blocking nature of the capital-adequacy and
      retention-opacity risks.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR007
      - CR017
      - CR019
      - CR030
      - CR037

figures:
  - id: FR001
    title: Risk Heatmap — Aiven Enterprise Risk Landscape (May 2026)
    type: matrix
    layout: wide
    summary: >-
      Residual risk is concentrated in the high-impact column where capital-adequacy opacity, hyperscaler pricing power,
      and customer retention unknowns reinforce each other. Technical and regulatory risks are controllable near-term but
      elevate if the company delays disclosure or encounters a production Inkless Kafka incident.
    data:
      columns:
        - Low impact
        - Medium impact
        - High / critical impact
      rows:
        - label: Very likely (structural)
          values:
            - Competitive noise from hyperscaler marketing
            - BYOC absent on Azure limiting enterprise reach; compliance audit opacity
            - Capital-adequacy opacity — no public financial metrics for verification
        - label: Likely (plausible near-term)
          values:
            - Finnish corporate reporting limits external visibility
            - Open-source license change in non-core service (Grafana, Cassandra)
            - Customer concentration in BYOC enterprise accounts; NRR undisclosed
        - label: Possible (scenario-dependent)
          values:
            - EverSQL integration delay reducing AI differentiation
            - Inkless Kafka orphaned-segment production incident (KIP-1163 unresolved)
            - Hyperscaler billing integration displacing Aiven in AWS/GCP-committed accounts
        - label: Lower probability (tail risk)
          values:
            - Apache Kafka or PostgreSQL upstream license change
            - Cyber incident or SOC 2 qualified opinion becoming public
            - CEO key-person departure without successor in pre-IPO window
