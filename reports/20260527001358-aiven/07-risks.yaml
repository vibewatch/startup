        - Request most recent SOC 2 Type II report, scope boundaries, and GDPR Article 28 processor agreement; verify SCCs for US data flows
      - - EU Cyber Resilience Act (CRA) — software products with digital elements sold in EU market
        - EU (entered into force December 2024; main obligations from December 2027)
        - Aiven already publishes SBOMs; formal CRA compliance programme and CE marking process not publicly described
        - Medium (2027 deadline approaching)
        - Medium — compliance cost, CE marking, mandatory vulnerability reporting from September 2026; non-compliance risks market access
        - SBOM publication via CLI is a preparatory step; security team and penetration-test programme in place
        - Cost of full CRA compliance programme not quantified; open-source component classification under CRA still evolving
        - Request Aiven's CRA compliance roadmap, assigned budget, and counsel opinion on classification of managed open-source services under the Act
      - - Open-source upstream license changes — Redis/SSPL, Elasticsearch/ELv2 historical precedent; ClickHouse dual-license risk
        - Global (no specific jurisdiction — contractual/product risk)
        - Redis relicensed March 2024 (triggered Valkey fork); Elasticsearch relicensed January 2021 (triggered OpenSearch fork); ClickHouse Inc. controls proprietary cloud-tier features
        - Medium (periodic, correlated with VC pressure on OSS companies)
        - High — forced product pivots require engineering resources, customer communication, and can disrupt ARR in affected service lines
        - Valkey fork maintained; OpenSearch on Linux Foundation; ASF-hosted projects (Kafka, Flink) structurally lower risk
        - ClickHouse Inc. future license posture unresolved; MySQL Oracle commercial licensing adds complexity; no formal contractual protection against upstream relicensing
        - Request IP counsel memo on each service's license exposure; confirm whether Aiven has contractual commitments to customers regarding open-source license continuity
      - - Finnish corporate reporting — Aiven Oy limited financial disclosure obligations
        - Finland / Finnish Trade Register
        - Aiven Oy files with Finnish Trade Register; abbreviated financial format permissible; consolidated group accounts not publicly available
        - Certain
        - Low operational risk; high diligence opacity — gross margin, burn, NRR, and cash balance are entirely unverifiable from public sources
        - N/A (structural feature of Finnish private company regime)
        - No audited group financials, no segment reporting, no cash-flow statement available externally
        - Require full audited consolidated group financial statements (P&L, balance sheet, cash flow) for FY2023, FY2024, FY2025 as a precondition to any commitment
    notes: Rows ordered by combined severity and likelihood. No active litigation, regulatory enforcement action, sanctions exposure,
