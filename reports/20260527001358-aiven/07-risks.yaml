  evidenceGaps:
    - type: missing-source
      severity: informational
      topic: regulatory-legal-risk-register-coverage
      missingEvidence: >-
        The regulatory and legal risk register (TR001) captures active and anticipated regulatory obligations
        as of May 2026. Coverage is partial: enforcement actions, pending litigation, and country-specific
        data localisation requirements beyond GDPR and the EU CRA have not been independently verified.
        No third-party legal assessment, lawsuit filings, or regulator enforcement notices for Aiven Oy
        were identified in public sources reviewed.
      whyItMatters: >-
        A gap in regulatory coverage could mean that significant compliance obligations (e.g. UK GDPR post-Brexit,
        US state privacy laws, or pending enforcement actions) are not surfaced in this register, which would
        create unquantified legal exposure for enterprise buyers or acquirers.
      diligencePath: >-
        Request from Aiven: (1) legal department's current regulatory exposure list, (2) any pending or
        threatened regulatory investigations or enforcement actions, (3) US state privacy law compliance
        assessment, and (4) any litigation involving Aiven Oy or its subsidiaries.
      relatedQuestionRefs:
        - QR016
        - QR017
      relatedTableRefs:
        - TR001
    - type: private-evidence-only
      severity: blocking
      topic: cash-runway-and-financial-metrics
      missingEvidence: >-
        No public source confirms Aiven's current cash balance, monthly burn rate, trailing gross margin,
        NRR, or GRR. The directional runway analysis from public data is insufficient to confirm capital
        adequacy through to an IPO event.
      whyItMatters: >-
        Without financial disclosure, an investor cannot verify whether Aiven is self-funding its operations
        (low risk), coasting on Series D reserves (moderate risk), or in a distress fundraising situation
        (high risk). All three scenarios have materially different valuation and dilution implications.
      diligencePath: >-
        Require: (1) audited consolidated group P&L, balance sheet, and cash-flow statement for FY2023,
        FY2024, FY2025; (2) current cash balance and 18-month burn bridge; (3) management commentary on
        path to profitability or next financing event.
      relatedQuestionRefs:
        - QR001
        - QR024
      relatedTableRefs:
        - TR005
    - type: private-evidence-only
      severity: material
      topic: nrr-grr-concentration
      missingEvidence: >-
        NRR, GRR, logo churn, and top-10 customer revenue concentration have never been disclosed publicly.
        The "thousands" of customers descriptor is not quantified and 4.5 years stale from the last specific
        count of 700 (October 2021).
