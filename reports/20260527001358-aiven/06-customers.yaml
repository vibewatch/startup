- id: retention-expansion-satisfaction
  title: Retention, Expansion, and Customer Satisfaction
  body: 'Aiven does not disclose Net Revenue Retention (NRR), Gross Revenue Retention (GRR), logo churn, or any cohort-based
    retention metric. This is a material gap in the diligence record given Aiven''s $100 M ARR milestone and positioning
    as a platform company where land-and-expand is the expected growth engine. The absence of retention metrics prevents
    a direct assessment of whether ARR growth is driven by new customer acquisition, existing customer expansion, or both.


    Indirect evidence for expansion comes from case study narratives. Multiple customers describe a pattern of starting with
    one Aiven service and expanding to additional services over time: Hookdeck (one to six services), La Redoute (Kafka alone
    to Kafka + PostgreSQL + OpenSearch), NAV Norway (Kafka + OpenSearch + Valkey), and Katana (Kafka + ClickHouse). WalkMe
    explicitly notes that the 30% increase in data volume over the case study period was absorbed within the same contract
    structure, implying expansion revenue without churn. Sophos''s description of "5% monthly data volume growth" implies
    ongoing capacity expansion.


    The peer-review footprint is sparse relative to Aiven''s stated scale. As of June 2025, TrustRadius listed only three
    public reviews for Aiven — a substantially smaller corpus than comparably sized infrastructure vendors. This may reflect
    a structural factor (Aiven''s developer-led customer base is less likely to complete enterprise-software review surveys)
    rather than dissatisfaction, but it limits independent sentiment data available to third-party evaluators. The 2023 workforce
    reduction of approximately 20% of Aiven''s staff, reported by both Sifted and The Register, was characterised by the
    company as a "painful but necessary step" following a period of over-hiring. While workforce reductions are not direct
    evidence of customer attrition, they typically signal a period of demand shortfall and heightened churn risk, which
    Aiven has not addressed with retention disclosures.'
