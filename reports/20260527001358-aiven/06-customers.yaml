  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: retention-gap
    missingEvidence: Trailing-12-month NRR and GRR, broken down by Standard vs BYOC cohort; logo churn rate; net logo additions per quarter.
    whyItMatters: Without NRR/GRR, it is impossible to determine whether ARR growth is durable expansion-driven or partly masked by churn; this is the most important missing metric for a $100M ARR infrastructure vendor.
    diligencePath: Request management disclosure of trailing-12-month NRR and GRR in any formal diligence process; if unavailable, request monthly ARR cohort history going back 24 months.
    relatedQuestionRefs:
    - QU008
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: concentration-risk
    missingEvidence: Top-10 customer percentage of ARR; whether any single customer exceeds 5% of ARR; BYOC vs Standard tier ARR split.
    whyItMatters: Large BYOC deployments (Sophos 79 clusters, WalkMe, Claroty) may represent outsized ARR concentration; churn of 1-2 accounts could be material at $100M ARR scale.
    diligencePath: Request customer concentration schedule from management; verify no single customer exceeds 10% of ARR without contractual protections.
    relatedQuestionRefs:
    - QU011
    relatedTableRefs:
    - TU005
  - type: stale
    severity: material
    topic: customer-count
    missingEvidence: Current total customer count and net customer additions since 2022; breakdown by Standard vs BYOC, SMB vs enterprise.
    whyItMatters: The "thousands" descriptor has been static since mid-2022; implied ARPU and average deal size estimates are imprecise without a specific count, preventing accurate growth model construction.
    diligencePath: Request current customer count and trailing-4-quarter net new customer data from management; cross-check against sales capacity and ARR trajectory.
    relatedQuestionRefs:
    - QU001
    - QU020
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: Full customer list beyond 30 published case studies; case studies for ADEO, A1 Austria, and GoTo Financial with quantified outcomes comparable to WalkMe/Sophos/Claroty depth.
    whyItMatters: The 16 quantified case studies represent a small sample of "thousands" of customers; outcome distribution across the full customer base is unknown.
    diligencePath: Request customer reference list from Aiven sales for third-party verification calls; seek references outside the published case study library to reduce survivorship bias.
    relatedQuestionRefs:
    - QU017
    - QU019
    relatedTableRefs:
    - TU002
  - type: limited-public-data
    severity: minor
    topic: competitive-benchmarking
    missingEvidence: Systematic comparison of Aiven logo quality against Confluent Cloud and MongoDB Atlas enterprise customer lists; analyst buyer data across the same verticals.
    whyItMatters: Without a structured competitor logo comparison, assessment of Aiven's relative enterprise brand penetration is qualitative only; buyers may perceive Confluent or MongoDB as more enterprise-validated at similar ARR.
    diligencePath: Obtain analyst reference data (Gartner Peer Insights, Forrester Wave) to compare logo quality across managed data platform peers; request win/loss data from Aiven management.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU002
