callouts:
- calloutType: strength
  title: BYOC Case Studies Demonstrate Outsized Cost Impact at Enterprise Scale
  body: Aiven's BYOC deployment model, launched May 2023, has generated the strongest customer proof in its case study library.
    Claroty (72% Kafka TCO reduction), WalkMe (40%), and Sophos (30-40%) represent three independent data points confirming
    that BYOC's management-fee-only billing model materially outperforms the hosted Standard tier on total cost for large
    Kafka deployments. The La Redoute Azure BYOC result (projected 40% cost increase reduced to 14%) extends the proof to
    non-Kafka mixed workloads. If these outcomes can be replicated at new enterprise accounts, BYOC should be a durable growth
    driver as enterprise procurement scrutiny of cloud spend intensifies. The Google Cloud Partner of the Year 2025 award,
    citing Priceline, ADEO, and Mirakl as exemplary GCP customers, provides independent third-party validation of Aiven's
    enterprise delivery capability on the Google Cloud platform.
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  - CU031
- calloutType: risk
  title: Complete Absence of Retention Metrics Is the Dominant Diligence Gap
  body: Aiven has never disclosed NRR, GRR, customer logo churn, or any cohort retention metric. For a $100 M ARR company
    in a competitive infrastructure-as-a-service market, this gap prevents independent assessment of whether ARR growth is
    durable expansion-driven or partly offset by churn from the 2023 demand-shortfall period (evidenced by ~20% workforce
    reduction). The sparse TrustRadius review footprint (3 reviews as of June 2025 via Wayback Machine) provides only weak
    sentiment signal. Diligence should require management-level disclosure of trailing-12-month NRR and GRR, along with customer
    count and logo churn, before completing any material investment or commercial transaction.
  claimRefs:
  - CU033
  - CU034
  - CU039
  - CU040
  - CU042
- calloutType: risk
  title: Customer Count Opacity and Potential BYOC Concentration Risk
  body: Aiven's "thousands of customers" descriptor has not been refined since mid-2022. Without a specific count, implied
    ARPU at $100 M ARR ranges from roughly $100K (1,000 customers) to roughly $33K (3,000 customers), a range that carries
    very different implications for average deal size, sales motion, and concentration risk. The BYOC case studies — Sophos
    (79 clusters, 9 AWS regions), WalkMe, and Claroty — each suggest deployments that could represent $1–5 M+ ARR individually
    if priced on infrastructure scope. If 5-10 such accounts represent 30-50% of ARR, a single enterprise churn event could
    be material. Aiven has disclosed no concentration data to refute this scenario.
  claimRefs:
  - CU003
  - CU041
  - CU043
  - CU044
- calloutType: recommendation
  title: Request NRR, Customer Count, and Top-10 Customer Concentration Before Commitment
  body: Given the complete absence of retention and concentration disclosures, any diligence process for Aiven should request
    three specific data items from management before forming a view on valuation and growth durability. First, trailing-12-month
    NRR and GRR broken down by Standard vs BYOC cohort. Second, current total logo count and trailing-12-month net logo
    additions. Third, top-10 customer percentage of ARR and whether any single customer exceeds 5% of ARR. These disclosures
    are standard in late-stage growth-equity processes and should not require negotiation for a company at $100 M ARR targeting
    a future public market. Until they are available, the customer quality and durability story rests entirely on a self-selected
    sample of 16 quantified case studies, all of which are company-curated.
  claimRefs:
  - CU033
  - CU034
  - CU041
  - CU042
  - CU043
  - CU044
