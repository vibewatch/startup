company:
  name: Aiven
chapter:
  number: 6
  title: Customers
  summary: Aiven's customer base spans "thousands" of organisations across 60+ countries as of 2025, extending from venture-backed
    scale-ups to Fortune 500 enterprises and government agencies. The company publishes more than 30 case studies, 16 of which
    contain quantified outcomes; BYOC deployments produce the most dramatic reported savings, including a 72% Kafka TCO reduction
    at Claroty, 40% at WalkMe, and 30-40% at Sophos. Kafka is the dominant entry-point service, with customers frequently
    expanding into PostgreSQL, OpenSearch, ClickHouse, and Grafana over time. Geographic footprint spans North America, EMEA,
    and APAC, with AWS and Google Cloud as the dominant hyperscalers for BYOC workloads. The primary diligence gaps are the
    complete absence of disclosed retention metrics (NRR, GRR, churn) and the unknown customer count beyond the 700 figure
    cited at Series C in October 2021; the "thousands" descriptor used since mid-2022 has not been refined further. TrustRadius
    lists only three reviews for Aiven, a notably sparse peer-review footprint for a company at $100M ARR, and all published
    case studies are company-curated, introducing survivorship bias into outcome claims.
sections:
- id: customer-base-and-market-segments
  title: Customer Base and Market Segments
  body: 'Aiven''s self-described customer population is "thousands worldwide" spanning 60+ countries, a figure repeated in
    official company materials through 2025–2026. The company has not published a specific customer count since citing 700
    customers at its October 2021 Series C ($60 M, $2 B valuation); the jump to "thousands" was deployed by late 2022 and
    has remained the public descriptor through mid-2026. Aiven describes its served range as "startups to Fortune 500 enterprises",
    a broadly accurate characterisation corroborated by named logos at both ends of the market: Hookdeck (early-stage startup)
    and Avaya (Fortune-range enterprise with 6 M contact-centre seats) appear in the same case-study library.


    Five distinct customer segments are identifiable from the published case study corpus. Enterprise technology vendors (WalkMe,
    Sophos, Avaya, Claroty) account for the largest and most vocal case studies, with BYOC deployments enabling regulated-data
    compliance and cost accountability. B2C e-commerce and marketplace operators (La Redoute, Back Market, Mirakl, BLUME2000)
    constitute a second segment, typically using Kafka for event-driven inventory, order, and pricing pipelines. Payments
    and fintech companies (Dojo, GoTo Financial) represent a third segment, drawn by Aiven''s multi-cloud capability and
    Kafka''s throughput guarantees. Government and public-sector organisations (NAV Norway) form a fourth segment for whom
    BYOC''s data-residency and sovereignty assurances are the primary purchase driver. Developer platforms and SaaS infrastructure
    companies (Hookdeck, Katana, Simplilearn) constitute a fifth segment, typically using Aiven for rapid infrastructure
    consolidation rather than cost optimisation.


    Sector diversity is a strength relative to single-service peers: Aiven''s ability to offer Kafka, PostgreSQL, OpenSearch,
    ClickHouse, and Grafana on a single platform means it can grow with customers as their data architecture matures, rather
    than being displaced when needs expand beyond streaming.'
