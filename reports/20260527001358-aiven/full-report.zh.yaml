  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局分类
        blocks:
          - type: paragraph
            body: >-
              Aiven 在四个相互重叠的层级中竞争，买方采购托管开源数据库基础设施时会在这些层级之间权衡。理解每一层级，才能评估 Aiven 的定位和护城河耐久性。


              层级 1 —— 超大规模云厂商 DBaaS：AWS、Google Cloud 和 Microsoft Azure 都以第一方服务形式，提供 PostgreSQL、MySQL、Apache
              Kafka、OpenSearch/Elasticsearch 等开源引擎的托管版本。超大规模云厂商靠内嵌分发（工作负载已经跑在云上）和深度平台集成（IAM、VPC、计费）拿下那些优先做云整合的交易。仅 AWS
              就提供八种托管数据库引擎，并有多种部署模型。Google Cloud SQL 覆盖 MySQL、PostgreSQL 和 SQL Server，其 Enterprise Plus 版本提供 99.99%
              SLA；AlloyDB 服务被定位为可直接替代 PostgreSQL，至少一位客户称其计算成本降低了 40–50%。Azure Database for PostgreSQL 提供 99.99%
              SLA，并称相比本地部署 PostgreSQL 总拥有成本低 58%。Azure Event Hubs 提供 Kafka 协议兼容，并具备金融服务合规认证（CSA
              STAR、ISO、SOC、GxP、HIPAA、HITRUST、PCI）。超大规模云厂商的关键限制是单云锁定：在 AWS RDS for PostgreSQL 上的买方无法无缝迁移到 Google Cloud
              SQL，仍需重新开通和迁移数据；这正是 Aiven 多云可移植性切入的缺口。


              层级 2 —— OSS 原生托管厂商：越来越多专门打造的托管服务提供商聚焦单一数据库家族，并具备更深专长。Confluent（数据流 / Kafka）FY2025 收入达到 $1.167B，同比增长
              21%，并拥有专有 Kora 云原生引擎。MongoDB Atlas（文档 NoSQL）服务超过 50,000 家客户和 70% 的 Fortune 100。ClickHouse Cloud 截至 2024
              年估值为 $15B（Reuters 报道，并由 ClickHouse 新闻页面引用）。Neon 使用 copy-on-write 分支和即时缩容到零。CockroachDB 面向企业级分布式
              SQL，支持多区域数据属地。Redpanda（Kafka 兼容流处理）声称运行所需计算资源比 Apache Kafka 少 3x，分层存储节省
              8–9x。这些厂商通常在各自类别中占优，但要求买方为每个数据库家族维持单独供应商关系。


              层级 3 —— 自管理 Kubernetes Operators：许多平台工程团队使用 Kubernetes operators（例如 Kafka 的 Strimzi、PostgreSQL 的
              CloudNativePG、OpenSearch Operator）部署开源数据库。这种现状替代方案用运营负担换取零 SaaS 许可成本和最大配置灵活性。G2 DBaaS
              买方研究框架显示，支持可得性、高可用架构、合规标准和扩展能力，是买方在托管服务与自管理部署之间决策的首要标准——这些领域中，Aiven 的 24/7 专家支持和 99.99% SLA 主张对 DIY
              形成直接优势。


              层级 4 —— 单服务专家和数据库特定厂商：Instaclustr（现为 Spot by NetApp）提供托管 Kafka、Cassandra 和 OpenSearch，具备 GDPR/SOC 2/ISO
              27001/27018/PCI 合规，并是 OpenSearch Foundation 创始成员。Timescale 提供 TimescaleDB（用于时序的 PostgreSQL），拥有 22,000+
              GitHub stars 和 Kubernetes Helm chart 安装路径。Crunchy Bridge（Crunchy Data）提供托管 PostgreSQL，支持跨云复制、私有网络（VPC
              peering、private link、Tailscale）和 PostGIS/地理空间扩展。PlanetScale 提供 MySQL/Vitess 托管服务，支持 schema 分支，并在 AWS/GCP
              上提供 BYOC 企业选项。
