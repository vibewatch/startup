  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与分类
        blocks:
          - type: paragraph
            body: >
              Aiven 所进入的市场，更适合界定为多云托管开源数据服务——这是更广义云数据库和 DBaaS 类别的一个子集。TAM
              边界从任何满足两点的企业或开发团队开始：（a）运行开源数据库工作负载；（b）把这些工作负载的运营管理外包给第三方。该边界明确排除专有托管数据库（AWS Aurora 专有引擎、Azure Cosmos
              DB、Google Spanner），因为底层技术归超大规模云厂商所有；也排除本地部署数据库软件许可证和裸金属数据库设备。


              Gartner 对 DBaaS 的定义——一种抽象化托管服务，由供应商处理开通、补丁、备份和高可用——是判断 TAM 边界的合适视角。在这个边界内，Aiven
              的产品组合覆盖关系型（PostgreSQL、MySQL）、NoSQL（Apache Cassandra、OpenSearch）、时序（InfluxDB、M3）、事件流（Apache Kafka、Apache
              Flink）以及可观测性 / 搜索（OpenSearch、ClickHouse）。每个类别都有自己的需求画像：关系型由 PostgreSQL 主导（Stack Overflow 2024 调查显示开发者采用率
              49%），流处理锚定 Apache Kafka，可观测性则在受 Elastic ELv2 限制的 OpenSearch 与商业 Elastic Cloud 之间竞争。


              相邻但被排除的支出包括：无法作为可移植开源工作负载部署的超大规模云厂商原生托管数据库、企业数据仓库服务（Snowflake、BigQuery、Redshift），以及由企业自行处理数据库运营的自管理
              Kubernetes 部署。不选择 Aiven 的买家，通常采用的现状替代方案是单一云厂商 DBaaS（AWS RDS for PostgreSQL、Google Cloud SQL）或 Kubernetes
              上的自管理安装。从超大规模云厂商 DBaaS 切换到 Aiven 的成本中等：需要修改连接字符串、迁移数据，并按 Aiven 公开发布的 99.99% 可用性重新验证 SLA。


              开源许可事件形成了独特的市场位移机制：Redis 采用 SSPL、Elastic 转向 ELv2（明确禁止把 Elasticsearch
              作为托管服务提供）后，运行热门下载版本的企业不再能从超大规模云厂商获得托管服务支持，从而为 Aiven 这样的独立供应商打开 TAM 窗口。Aiven 提供托管 OpenSearch（Apache 2.0
              fork）和托管 Valkey（Redis SSPL fork 的替代方案）。
