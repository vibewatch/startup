      - number: '1.4'
        title: 里程碑、合作伙伴与负面事件
        blocks:
          - type: paragraph
            body: >-
              Aiven 的公开里程碑记录，清楚呈现了从芬兰基础设施初创公司成长为全球开源独角兽的路径。公司成立于 2016 年，并在 2017 年拿到 Lifeline Ventures 和 Business Finland
              的首笔种子资金后开始打开市场。推出托管 PostgreSQL 和 Kafka 服务后，2019–2021 年的快速采用把公司推至 700 家客户和 230+ 名员工；到 2021 年 10 月，Series C
              延伸轮确认其 $2B 独角兽地位。2022 年 5 月 $3B 估值的 Series D 是后疫情融资潮的高点，Aiven 随后把资本投入激进招聘——员工数较 2021 年 3 月水平增长 50%。


              2023 年 1 月裁员是 Aiven 公开记录中最重大的负面事件。CEO Saarenmaa 确认，公司在除产品团队之外的全部 25 个运营国家裁减 20% 员工（约 100
              人），理由包括宏观经济恶化、通胀、利率上升，以及公司承认年化收入运行率低于估计。Saarenmaa 的公开信直接向离职员工道歉，承认高管判断失误，并把结果描述为纠正「缺乏焦点和优先级」。The Register
              和 Sifted 都将该事件放在欧洲科技行业更广泛裁员潮中报道。离职员工获得 12 周薪酬，另按每工作一年增加一周。该事件对文化、执行纪律和管理层可信度尽调都有参考价值。


              裁员后的正面里程碑包括：2023 年 5 月推出 BYOC，给客户带来平均 30% 的云成本节省，并打开受监管行业的企业交易；2023 年 11 月收购 EverSQL，带来覆盖 90 个国家、超过
              100,000 名工程师使用的 AI 驱动 SQL 优化能力；2025 年 4 月获得 Google Cloud 数据库类别年度合作伙伴奖，Google Cloud 总裁 Kevin Ichhpurani
              称其体现了「为客户创造的超额价值」；2025 年 4 月发布 Aiven for AlloyDB Omni——Aiven 与 Google Cloud 首个联合工程产品，支持跨 AWS、Azure 和 GCP 的
              AI 驱动向量搜索；以及 2025 年 7 月宣布 $100M ARR 里程碑。ARR 里程碑中强调了 Priceline、Sophos、WalkMe、OVHcloud 和 La Redoute
              的客户证言，为公司在北美、欧洲和亚太的企业渗透提供证明。已审阅来源中没有发现公开诉讼、监管执法、制裁或领导层欺诈事件。
