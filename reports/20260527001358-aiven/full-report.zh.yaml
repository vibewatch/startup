      - number: '6.5'
        title: 集中度风险与披露缺口
        blocks:
          - type: paragraph
            body: >-
              客户收入集中度完全未披露。Aiven 没有发布头部客户收入占比、最大 logo ARR，或任何分段收入拆分。BYOC 收入相对 Standard 层收入的构成也未披露，尽管 BYOC 的管理费模型意味着毛利率低于
              Standard 托管部署。如果少数 BYOC 企业账户贡献了不成比例的 ARR——Sophos（79 个集群、9 个区域）、Claroty 和 WalkMe 部署规模显示这有合理可能——那么 BYOC 客户中的
              logo 流失可能对收入产生实质稀释。


              2023 年裁员事件提供了一个弱需求短缺信号，但没有量化。The Register 和 Sifted 都报道了裁员；The Register 将 Aiven 描述为 2023 年 1
              月科技行业裁员潮中「又一家为大规模裁员道歉」的公司。Aiven 当时没有发布客户影响声明或留存数据。


              还有三个披露缺口与尽调相关：（1）自 2022 年中以来，客户数没有从「数千家」更新为更具体数字；（2）ARR 的地理拆分未披露；（3）垂直市场 ARR 拆分未披露。这些缺口与 Aiven 作为尚未进入 IPO
              披露透明度阶段的私营公司身份一致，但也意味着关键估值输入（隐含 ARPU、NRR、地理组合、队列耐久性）只能从案例研究三角测量，而不是来自报告数据。
            claimRefs:
