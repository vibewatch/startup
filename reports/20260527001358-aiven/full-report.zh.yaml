        - 计算资源比 Kafka 少 3x；分层存储节省 8–9x；BYOC + Dedicated
        - 单品类（仅流处理）；没有 PostgreSQL/NoSQL/搜索
      - - Instaclustr（Spot by NetApp）托管服务
