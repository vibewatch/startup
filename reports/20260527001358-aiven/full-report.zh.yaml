      - number: '5.2'
        title: 平台架构与控制平面
        blocks:
          - type: paragraph
            body: >-
              Aiven 的控制平面是一个集中式编排层，负责所有三种部署模型下每项托管服务的开通、配置、补丁、备份、故障切换和监控。标准和 ECE 部署中，控制平面在客户选择的云和区域里运营 Aiven 拥有的
              VPC；BYOC 中，控制平面只通过带静态 IP 的 bastion host 进入客户 VPC，确保 Aiven 的运维访问有边界、可审计且可撤销。


              VPC 隔离默认是单租户。客户可以配置项目级 VPC（每个云 / 区域组合一个 VPC），也可以配置组织级 VPC 供多个项目共享；VPC peering 将 Aiven 管理的 VPC 连接到客户自有应用
              VPC，实现私有连接。服务集成支持在平台内跨服务路由指标和日志——例如，把 PostgreSQL 性能指标路由到 Aiven 托管的 Grafana，或路由到基于 Thanos 的 Aiven for
              Metrics 做长期存储和告警。


              维护窗口可由客户配置；Aiven 对多节点服务（Kafka、OpenSearch）采用滚动升级，以做到零停机打补丁。单节点服务（Developer 层的
              PostgreSQL、MySQL）会经历短暂且预定的故障切换窗口。服务分叉可以为任何服务创建完整的时间点副本，包括跨区域分叉，支持灾备演练和数据迁移流程，同时不打断生产服务。
