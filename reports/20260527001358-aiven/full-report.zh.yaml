  - id: FV004
    title: 投资评分卡——Aiven 关键维度 IC 可用评分（2026 年 5 月）
    type: kpi
    layout: standard
    summary: 八个维度的 IC 可用评分。市场和收入证明得分最高；估值纪律和证据质量得分最低，反映 $3B 陈旧标记，以及财务披露完全缺失。
    data:
      items:
        - label: 市场机会
          value: 3 / 5
          detail: 强劲的 $8–12B SAM、20–25% CAGR；超大规模云厂商借账单集成争夺；持久的多云需求验证了这一细分市场
          tone: neutral
        - label: 收入证明
          value: 4 / 5
          detail: $109M ARR（公司 2025 年 7 月确认 >$100M）；多服务扩张已确认；客户案例显示 BYOC 企业客户已有牵引
          tone: positive
        - label: 产品与技术护城河
          value: 3 / 5
          detail: 11 项服务的多云平台加 BYOC，形成独特的广度优势；EverSQL AI 是早期差异化；缺少自研引擎，难以锚定对专业厂商的防御力
          tone: neutral
        - label: 单位经济模型与利润率
          value: 2 / 5
          detail: 毛利率估计 55–65%；NRR 完全未披露；低于 71–80% 的公开可比区间；BYOC 改善路径合理但未核验
          tone: warning
        - label: 资本效率与现金跑道
          value: 2 / 5
          detail: 自 2022 年 5 月起已有 4 年融资空窗；无公开现金余额；粗略现金跑道分析显示近期可能需要融资；经营盈利能力未确认
          tone: warning
        - label: 竞争定位
          value: 2 / 5
          detail: IBM-Confluent 移除了最佳 M&A 可比交易；超大规模云厂商账单集成是结构性劣势；ClickHouse $15B 表明专业厂商拿到更高倍数；未披露胜率数据
          tone: warning
        - label: 估值纪律
          value: 1 / 5
          detail: 陈旧 $3B（27.5x ARR）在 2026 年公开或私人可比对象中毫无支撑；比可支撑区间高 3–9x；按当前标记进入，所有回报情景均为负
          tone: warning
        - label: 证据质量
          value: 2 / 5
          detail: 公开来源没有审计、财务披露、NRR 或股权结构表；ARR 来自第三方估计；估值标记已 4 年；尽调仅基于公开来源
          tone: warning
    approximationNotes: 评分为定性（1=很弱，5=很强）。所有维度仅基于公开来源证据。财务指标（毛利率、NRR、现金跑道）均为分析师估计；若能获得数据室访问，评分会有重大变化。
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV020
      - CV022
      - CV026
      - CV032
      - CV042
