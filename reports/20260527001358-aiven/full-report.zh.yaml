        - '$1.167B FY2025 收入（同比 21%）；NASDAQ: CFLT'
        - 企业 Kafka 用户；金融服务、零售、电信
        - Kora 引擎（扩容快 10x）；120+ 连接器；治理套件；$1B+ ARR 规模
