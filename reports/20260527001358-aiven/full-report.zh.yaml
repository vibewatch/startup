chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              Aiven Oy —— 对外品牌为「Aiven」—— 是一家全球数据平台公司，总部位于芬兰 Helsinki（Antinkatu 1, 6th floor, 00100 Helsinki）。公司自称是「面向 AI
              的开源数据平台」，并在德国、爱尔兰、以色列（EverSQL Ltd）、葡萄牙、英国和法国设有法律子公司，说明其全球运营并非名义化。版权声明确认公司自 2016 年起运营。


              Aiven 的核心产品是一套完全托管、多云的数据基础设施平台，全部搭在主流开源技术之上。Aiven 不是开发自研专有引擎，而是把社区拥有的软件——PostgreSQL、Apache
              Kafka、OpenSearch、ClickHouse、Apache Flink、Apache Cassandra、MySQL、Grafana、Valkey（Redis
              的继任者）等——交付成完整运维的企业级托管服务，提供 99.99% 可用性 SLA、自动备份、一键开通和 24/7 专家支持。客户覆盖 AWS、Google Cloud、Microsoft
              Azure、DigitalOcean 等云；Aiven 抽象掉基础设施复杂度，让开发者把精力放在应用开发，而不是数据库管理。2023 年 5 月，Aiven 推出 Bring Your Own
              Cloud（BYOC），允许企业客户直接在自己的 AWS、GCP 或 Azure 账户中部署由 Aiven 管理的服务，在利用既有云支出承诺的同时保留数据驻留和安全控制。早期 BYOC
              客户称，相比传统托管服务安排，云支出平均降低 30%。


              商业模式是 B2B SaaS。收入来自托管服务实例的月度或年度订阅费，价格取决于服务类型、云区域和资源层级。BYOC 增加了企业层级，要求企业支持合同和最低月度支出。2023 年 11 月收购
              EverSQL（一家以色列 AI 驱动数据库优化初创公司）后，平台补上了自动查询调优和索引建议能力；现有 Aiven PostgreSQL 和 MySQL
              订阅客户可免费使用。这个动作强化了落地后扩张飞轮：客户先采用一个核心服务，体验免费的 AI 优化增强，再扩展到更多服务。公司 2025 年 7 月达到 $100M ARR
              的里程碑，主要由四个旗舰服务支撑：Aiven for PostgreSQL、Aiven for Apache Kafka、Aiven for OpenSearch 和 Aiven for ClickHouse。
