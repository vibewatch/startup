        - 中–高：2023 年低于预期信号和不透明度构成基线风险
    notes: >-
      所有数字均为分析师基于上市可比公司倍数和估计 ARR 轨迹作出的预测。入场价 ~$654M = 6x ARR（$109M），作为示例老股 / 降估值入场。$3B 入场反映 2022 年 5 月 Series D
