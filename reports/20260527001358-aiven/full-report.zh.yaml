  - id: FI003
    title: 估值倍数对比——Aiven 与公开市场同行（2026）
    type: range
    insight: >-
      按 2026 年 3 月 $109M ARR 计算，Aiven 过时的 2022 年 5 月 $3B 估值意味着 27–30x 远期 ARR——超过 Confluent（约 5x）和 Elastic（约 4x）2026
      年公开市场倍数的 4 倍。即便套用 30–40% 的私营公司流动性折价，隐含倍数仍明显高于公开市场基准，说明公司要按参考价完成新的一级融资或老股交易，2022 年估值需要有实质性重置。
