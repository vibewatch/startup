    title: 投资逻辑与反向逻辑——Aiven（2026 年 5 月）
    columns:
      - 支柱
      - 投资逻辑（乐观视角）
      - 反向逻辑（悲观视角）
      - 何种证据会改变判断
    rows:
      - - 市场机会
        - 多云开源 DBaaS 的 SAM 为 $8–12B，增长 20–25%；Aiven 是唯一云中立的多服务托管平台；企业规避锁定的需求是长期驱动因素
        - 超大规模云厂商靠账单集成吃掉这块 TAM；已有 AWS/GCP 承诺消费的客户面对原生托管服务时摩擦为零；护城河收窄速度可能快过增长弥补
        - 到 2027 年，NRR 持续 >120%、ARR CAGR >28%，证实护城河耐久；或有清晰证据显示超大规模云厂商退出开源托管服务
