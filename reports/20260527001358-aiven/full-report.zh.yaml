  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 服务目录与部署模型
        blocks:
          - type: paragraph
            body: >-
              Aiven 的产品目录覆盖十二项托管开源数据服务，归入六个功能类别：流式与消息（Apache Kafka Classic、Apache Kafka Inkless、Apache
              Flink）、关系型数据库（PostgreSQL、MySQL）、分析（ClickHouse、OpenSearch）、内存缓存（Valkey、Dragonfly）、可观测性（Grafana、Aiven for
              Metrics / Thanos）和 NoSQL（Apache Cassandra）。所有服务共用同一控制平面、统一工具界面（Terraform、Kubernetes Operator、REST
              API、CLI）和一致的支持 SLA 结构。多产品策略是有意为之：客户可以把多个托管数据供应商整合到一个平台上，工作负载演进时也减少集成摩擦。


              三种部署模型构成一条能力阶梯。标准部署把托管服务放在 Aiven 拥有的单租户 VPC 中，底层云可选 AWS、Google Cloud 或 Azure；客户从不与其他租户共享计算资源。Enhanced
              Compliance Environment（ECE）更进一步：禁用服务节点的所有互联网访问，要求使用客户批准的云区域，并强制采用 Advanced 或 Premium 支持层级以及承诺消费合同，以满足
              HIPAA 和 PCI-DSS 工作负载，而标准 VPC 隔离无法覆盖这些要求。2023 年 5 月推出的 Bring Your Own
              Cloud（BYOC）则反转了基础设施所有权模型：客户的云账户托管所有服务虚拟机并直接支付底层云账单，Aiven 则为编排、升级、监控和支持收取平台管理费。BYOC 可用于 AWS（私有和公开架构变体）以及
              GCP（私有和公开）；bastion-host 模型为 Aiven 控制平面提供进入客户环境的最小、可审计访问通道。据报道，早期 BYOC 客户相较标准托管安排，整体云支出平均降低 30%。
