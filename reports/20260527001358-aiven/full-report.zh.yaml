      - number: '7.3'
        title: 留存不透明与客户集中风险
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 5 月，Aiven 没有披露任何留存指标。本报告六个章节审阅的所有公开来源里，都没有净留存率（NRR）、总留存率（GRR）、客户标识流失率，或按队列续约数据。对一家 ARR
              $109M、又明确把自己定位成「先落地再扩张」平台的公司来说，这是异常缺口：如果 NRR 高于 120%（基础设施 SaaS
              的常见基准），公司有很强动机把它作为营销资产公开。因此，不披露最好也只是中性信号（私营公司选择），最坏则是在 NRR 低于投资人预期时的反向信号。


              客户集中度会放大风险。Aiven 披露最细的案例研究集中在 BYOC 企业部署（Sophos：79 个 Kafka 集群、9 个区域、成本下降 30-40%；WalkMe：Kafka 成本下降
              40%；Claroty：Kafka TCO 下降 72%；La Redoute：云成本下降 14%），这些案例暗示绝对消费承诺很大。BYOC 是定制报价、最低消费门槛高的企业级安排（要求最低月度消费承诺）。如果
              5–10 个这类账户贡献总 ARR 的 30–50%，单个企业客户流失就会造成重大收入冲击。Aiven 没有披露前 10 大客户收入占比，也没有披露「数千家」之外的客户总数（上一项具体数字是 2021 年 10
              月的 700 家客户，已经滞后 4.5 年），更没有披露 BYOC 与 Standard 收入结构。


              2023 年 1 月裁员提供了一个弱反向信号。The Register 将 Aiven 描述为 2023 年 1 月科技行业裁员潮中「又一家因大规模裁员道歉的公司」，Sifted 则指出
              Aiven、Brainly、Clue 同一周裁员——这种集群更符合需求不足担忧，而不只是运营优化。CEO Saarenmaa 公开道歉时承认高管团队「犯了错误」。如果 2023 年 1
              月裁员由需求驱动（客户放慢部署或流失），那么 2023 年后的 ARR 增长轨迹可能反映的是从受流失冲击的低谷恢复，而不是纯扩张；这会改变单位经济性判断，但没有管理层访问无法确认。
            claimRefs:
