      - number: '7.6'
        title: 安全、合规不透明与技术残余风险
        blocks:
          - type: paragraph
            body: >-
              Aiven 公开披露的安全姿态覆盖面可信：所有客户部署都运行在单租户 VPC 中，所有传输中连接强制使用 TLS，操作员访问通过控制平面记录审计日志，并有定期渗透测试文档。合规组合覆盖 ISO
              27001:2013、SOC 2 Type II、GDPR、HIPAA（通过 ECE）和 PCI-DSS（通过 ECE），覆盖企业和受监管行业买家最相关的主要监管框架。访问时（2026 年 5 月），Aiven
              状态页显示「我们完全正常运行——尚未发现影响系统的问题」；在审阅的任何来源中，也没有发现公开报道的安全事件、数据泄露或服务中断。


              但若干残余缺口带来尽调不确定性。第一，实际 SOC 2 与 ISO 27001 审计报告并不公开——客户必须在 NDA 下向 Aiven
              申请。没有经审计师确认的认证细节，外部无法验证审计范围、排除项以及任何保留意见。第二，HIPAA 与 PCI-DSS 合规只在 Enhanced Compliance
              Environment（ECE）中可用，并要求客户侧配置；标准部署层级对医疗和支付工作负载的保障水平明显更低。第三，截至 2026 年 5 月，BYOC 部署只支持 AWS 和 GCP（公开文档未确认 Azure
              BYOC 可用性），并继承客户云账户的合规姿态，而不是 Aiven 的合规姿态；对多云企业买家来说，合规图景因此变得碎片化。


              最具体的技术残余风险是 Inkless Kafka 来自 KIP-1163 的孤儿片段暴露。Apache Kafka PMC 于 2026 年 3 月 2 日接受 KIP-1150（Diskless
              Topics），为 Inkless 核心架构提供了社区验证。但将完成 Inkless 设计生产级加固的
              KIP-1163（片段生命周期管理）尚未被接受。独立技术评审者指出，这个缺口会在故障恢复场景下让云存储中留下孤儿日志片段——这是正确性问题，不同于 Aiven 已经基准测试并披露的延迟权衡。在 KIP-1163
              被接受并回移之前，企业若将 Inkless Kafka 用于持久化事件流工作负载，就会承受尚未缓释的数据丢失或成本累积暴露。
            claimRefs:
              - CR037
              - CR038
              - CR039
              - CR040
              - CR041
              - CR042
      - number: '7.7'
        title: 附录
        blocks:
          - type: callout
            title: 资本充足性是最紧迫的单项尽调关口
            body: >-
              参考 2022 年 5 月 $3 B 估值、四年没有披露新股融资、且没有公开财务指标（毛利率、NRR、烧钱速度、现金余额），任何投资人或商业交易对手在判断 Aiven
              能否把路线图和销售能力支撑到流动性事件前，都处于盲飞状态。方向性现金跑道分析（显示现金可能在 2025 年初至 2026 年中耗尽）意味着这不是推测性担忧，而是有时间边界的尽调要求。应直接询问 Aiven CFO
              Kenneth Chen 和董事会：(1) 当前现金余额与月度烧钱；(2) 公司是否现金流为正；(3) 如果不是，正在推进哪些融资选项。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: callout
            title: 做出任何商业承诺前，必须要求 NRR、GRR 与 BYOC 集中度数据
            body: >-
              一家 ARR $109M、定位为「先落地再扩张」平台的公司不披露 NRR，这不是这个规模私营公司的常规披露规范，而是重大尽调缺口。上市同业 Confluent 与 Elastic 在可比规模时都把 NRR（分别为
              120%+ 与 114%）作为核心投资者指标披露。Aiven 拒绝披露，意味着 NRR 不利，或公司有意采取不披露政策。无论哪种情况，任何重大商业或投资承诺都应把交易完成条件设为披露以下数据：过去 12
              个月按部署队列（Standard vs BYOC）拆分的 NRR 和 GRR、当前客户标识数量，以及前 10 大客户收入占比。
