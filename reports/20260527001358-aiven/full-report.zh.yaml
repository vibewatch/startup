      - number: '2.2'
        title: 市场规模测算视角
        blocks:
          - type: paragraph
            body: >
              没有单一权威估计能单独测算多云托管开源数据服务市场；本报告使用三个独立视角来三角验证 2026 年 SAM。


              视角 1 —— 自上而下 TAM，再折减：全球云数据库和 DBaaS TAM 预计到 2026 年达到 $68.5 billion，CAGR 为 38.2%（Valuates Reports，经
              Datamation 转引）。MarketsandMarkets 另行估计同一类别到 2028 年达到 $57.5 billion，CAGR 为 22%。两个估计在范围和方法上不同；Valuates
              数字被引用更多，但可能包含更广泛的数据管理工具。若给多云、仅开源托管服务分配 15–18% 份额，可得到 2026 年约 $8–12 billion 的
              SAM。该推导是近似值；没有任何分析师报告干净切分出多云开源子集。


              视角 2 —— 自下而上的上市公司代理：Confluent（托管 Apache Kafka 和 Flink）报告 FY2025（自然年 2025）收入为 $1.167 billion，同比增长
              21%，自由现金流率 5.2%。Elastic（搜索 / 可观测性，邻近 Aiven 的 OpenSearch 产品）报告 FY2025（2025 年 4 月）收入为 $1.483 billion，同比增长
              17%，FCF 率 17.7%。仅这两个相邻开源托管服务厂商，在事件流和搜索子赛道每年就产生约 $2.65 billion 收入。Aiven 的产品组合覆盖这两个子赛道，加上关系型和 NoSQL
              数据库，因此多类别 SAM 明显高于仅由这两个代理隐含的 $3–4 billion。


              视角 3 —— 开发者采用代理：PostgreSQL 采用率从 2018 年开发者的 33% 上升到 2024 年的 49%（Stack Overflow Developer
              Survey），连续第二年成为最受欢迎数据库。DB-Engines 按使用分数将 PostgreSQL 排在全球前三（2026 年 5 月）。开发者偏好转向开源数据库，是托管服务需求的领先指标：越来越多开发者用
              PostgreSQL、Kafka 和 OpenSearch 编写新工作负载，托管版需求也随之增长。这个需求侧信号支持 SAM 到 2026 年保持每年 20–30% 增长，与 Confluent 观察到的 21%
              增长一致。


              2026 年 $8–12 billion 的 SAM 估计应按近似值处理。自上而下推导假设多云开源份额为 15–18%，尚无任何分析师报告验证。自下而上代理低估了完整类别，因为 Confluent 和
              Elastic 只覆盖 Aiven 六个数据库家族中的两个。两个视角的局限都在证据缺口部分保留。
