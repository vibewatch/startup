      - number: '6.4'
        title: 留存、扩张与客户满意度
        blocks:
          - type: paragraph
            body: >-
              Aiven 不披露净留存率（NRR）、总留存率（GRR）、客户 logo 流失或任何基于队列的留存指标。考虑 Aiven 已达到 $100 M ARR
              里程碑，并把自己定位为平台型公司，而「先落地、再扩张」应是预期增长引擎，这是尽调记录中的重大缺口。没有留存指标，就无法直接判断 ARR 增长来自新客户获取、存量客户扩张，还是两者都有。


              间接扩张证据来自案例研究叙事。多个客户描述了从一项 Aiven 服务起步、随后扩展到更多服务的模式：Hookdeck（从一项到六项服务）、La Redoute（从单独 Kafka 到 Kafka +
              PostgreSQL + OpenSearch）、NAV Norway（Kafka + OpenSearch + Valkey）和 Katana（Kafka + ClickHouse）。WalkMe
              明确提到，案例研究期间 30% 的数据量增长被同一合同结构吸收，暗示有扩张收入且未流失。Sophos 对「每月 5% 数据量增长」的描述则意味着持续容量扩张。


              相比 Aiven 所称规模，其同行评审足迹偏稀薄。截至 2025 年 6 月，TrustRadius 仅列出三条 Aiven 公开评论——远少于类似规模的基础设施供应商。这可能反映结构性因素（Aiven
              的开发者主导客户群更不愿填写企业软件评论问卷），而非不满意；但它限制了第三方评估者可获得的独立情绪数据。Sifted 和 The Register 均报道了 2023 年约 20%
              的员工缩减，公司称其为一段过度招聘后的「痛苦但必要的一步」。裁员不是客户流失的直接证据，但通常提示一段需求短缺和流失风险上升期；Aiven 没有用留存披露回应这一点。
            claimRefs:
