  - id: TV005
    title: 投资逻辑破坏与终止触发器——Aiven（2026 年 5 月）
    columns:
      - 触发器
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入增长减速
        - 2026 年后任意 12 个月窗口 ARR 增长 <15%
        - 将退出倍数上限压到类似 Elastic 的 3–5x ARR；若 ARR 为 $135M，退出价值为 $405–675M——$3B 入场全损，5–6x ARR 入场至多打平
        - 立即退出任何老股仓位；不再新增投资；任何进一步接触前，要求运营重组计划
      - - 新股轮降估值确认
        - 新股融资定价低于 $1.5B（较 $3B 过时估值折价 >50%）
        - 证实市场否定 $3B 逻辑；既有投资人面临大额按市值重估损失；优先权堆叠重置带来复杂稀释动态
        - 对按重置价格进入的新钱是正向信号；按降估值价格投入前，先分析新优先权条款、管理层激励和投资人财团
      - - 毛利率确认低于 50%
        - 数据室或管理层披露显示混合毛利率 <50%
        - 通向 3.4–10x 收入公开市场可比区间的路径消失；退出倍数上限被永久压住；BYOC 毛利率改善逻辑失效
        - 任何高于 2–3x ARR 的价格下投资逻辑都坍塌；唯一可行路径是作为困境并购标的，由基础设施买方吸收平台
      - - NRR 披露低于 100%
        - 首次 NRR 披露显示任一报告期净收入收缩
        - 说明结构性流失抵消新增客户；ARR 增长叙事误导；长期收入耐久性存疑
        - 投资逻辑破坏；以任何可得价格退出；任何新承诺前，要求管理层立即解释并提供完整队列数据
      - - IBM/Confluent 竞争性发布
        - IBM 完成 Confluent 集成并发布直接与 Aiven 竞争的托管 Kafka 产品（以 2026 年 3 月交割为起点）
        - IBM + Confluent 组合产品直接攻击 Aiven 最大服务品类（Kafka）；经 IBM 的并购退出不再可用；最强 Kafka 可比对象变成竞争对手
        - 重估竞争护城河；跟踪交割后 IBM Confluent 产品发布；重新审视基准模型中的 Kafka ARR 占比假设
      - - 现金耗尽 / 困境过桥
        - 可信报道或管理层承认，在没有新资本情况下运营现金跑道 <6 个月
        - 被迫接受惩罚性条款融资或困境并购出售；既有投资人的优先权可能被过桥贷款契约覆盖；普通股很可能归零
        - 只有作为困境买方、且折价足够深时才接触；预期大幅稀释，运营控制权转移给过桥贷款人
    notes: 终止触发器按可观察或可披露证据阈值定义。所有阈值来自公开可比公司分析，以及 2023 年 1 月裁员事件的历史模式。stockanalysis.com 新闻报道显示，IBM-Confluent 交易于 2026 年 3 月交割。
