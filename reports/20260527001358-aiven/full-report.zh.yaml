      - number: '3.3'
        title: OSS 原生托管厂商竞争
        blocks:
          - type: paragraph
            body: >-
              对 Aiven 来说，2026 年更具战术紧迫性的竞争战场，是一批在单个数据库类别中深度匹配或超过 Aiven 的专门托管服务厂商。这些厂商把深产品聚焦与强类别品牌结合起来，其中几家还拥有多年收入规模优势。


              事件流：Confluent Cloud 是托管 Apache Kafka 的主导力量。Confluent 的 Kora 云原生引擎声称扩展速度比传统 Kafka 快 10x，并节省 20–90%
              吞吐成本。Confluent 报告 FY2025（自然年 2025）收入 $1.167B，同比增长 21%，拥有 120+ 个预构建连接器、完整 SOC 2/ISO 27001/PCI DSS
              认证，并向开发者提供 $400 免费云额度。Confluent 的收入轨迹和财务规模远高于 Aiven 估计的 $109M ARR，说明 Confluent 已经在专用 Kafka 托管服务
              市场取得实质胜利。Aiven for Apache Kafka 的竞争点是多云可移植性和多服务便利性（一个控制台里同时有 Kafka、PostgreSQL 和 OpenSearch），而不是 Kafka
              专属深度或生态规模。Redpanda 定位为 Kafka 兼容替代方案，采用 Raft 原生架构，声称相比 Apache Kafka 所需计算资源少 3x，分层存储保留成本节省 8–9x；其在 AWS、GCP 和
              Azure 上可用，并支持 BYOC 与专属部署模型。


              分析与搜索：Elastic Cloud（搜索 / 可观测性）报告 FY2025 收入 $1.483B，增长率 17%，提供 Serverless 和 Hosted 部署选项，具备政府部署所需的 FedRAMP
              Moderate Impact 级别授权，并可在 AWS、Google Cloud 和 Azure Marketplace 使用。Elastic 与 Aiven for OpenSearch
              直接竞争。ClickHouse Cloud 面向实时分析，提供存算分离、自动缩容到零和按用量定价——Reuters 报道（由 clickhouse.com/company/news 引用）称该公司估值达到
              $15B，说明尽管与 Aiven 的 ClickHouse 托管服务竞争，ClickHouse Cloud 已围绕 OLAP 类别拿到强投资人信心。


              关系型 PostgreSQL：Neon 提供无服务器 PostgreSQL，支持类似 git 的分支、即时缩容到零，以及用于高效 fork-and-test 流程的 copy-on-write 存储。Neon
              定价包含 Free 层级和付费层级（Launch、Scale），计算可自动扩展至可配置上限，分支存储按 $1.50/额外 branch-month 收费。Neon 的无服务器模型（数据库闲置时自动暂停）直接挑战
              Aiven 总是在线的预置型 PostgreSQL 定价，尤其是开发和临时工作负载。Crunchy Bridge（Crunchy Data）提供完全托管 PostgreSQL，支持跨云复制、包括
              Tailscale mesh 支持在内的私有网络、VPC peering、private link、PostGIS 和 PL/Python 扩展，并提供一对一迁移协助。PlanetScale 提供
              MySQL/Vitess，支持 schema 分支、部署请求工作流、AWS/GCP 上的 BYOC，以及 PCI 认证企业选项。CockroachDB 定位为企业级分布式 SQL，Serverless 提供
              99.99% SLA、即时扩展、多区域数据属地和 SOC 2/ISO 27001 合规；它面向那些已经超出 PostgreSQL 垂直扩展上限的关键任务应用。


              文档 / NoSQL：MongoDB Atlas（文档模型）服务超过 50,000 家客户和 70% 的 Fortune 100，在单一平台上整合运营数据、搜索、实时分析、流处理（Atlas Stream
              Processing on Kafka）和 AI 驱动向量搜索。MongoDB 的统一架构通过把单独 Kafka、搜索和运营数据库服务的需求压缩到一家供应商，来与 Aiven 的多服务打包路径竞争。这对
              Aiven 的落地后扩张模型构成间接但战略性的竞争威胁。


              OSS 托管专家：Instaclustr（Spot by NetApp）提供托管 Kafka、Apache Cassandra 和 OpenSearch，具备 GDPR、SOC 2、ISO 27001、ISO
              27018 和 PCI 合规，并是 OpenSearch Foundation 创始成员。Timescale 提供 TimescaleDB（时序 PostgreSQL 扩展），拥有 22,000+ GitHub
              stars，在 Aiven 的 InfluxDB 产品同样瞄准的 IoT 和指标用例中定位强势。
