  - id: FE001
    title: Aiven BYOC 部署架构
    type: flow
    layout: wide
    summary: 该图展示 Bring Your Own Cloud 部署中的控制平面访问模型：Aiven 控制平面只通过带静态 IP 的堡垒机进入客户 VPC，所有数据服务都留在客户云账户边界内。
