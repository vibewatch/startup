  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与定价机制
        blocks:
          - type: paragraph
            body: >-
              Aiven 的收入引擎是云用量原生的订阅模型。客户按月或按年支付经常性费用，一个价格里打包三层成本：（1）底层云厂商为客户托管服务分配的计算、存储、网络资源成本；（2）Aiven
              的平台运营层，包括开通、监控、补丁、备份、故障切换和 24/7 专家支持；（3）Aiven 在上述成本上的加价。AWS 或 GCP 的托管服务通常把云成本和支持分开计费；Aiven
              则把三者折进可预测的单实例订阅价格，用简单性和云中立可迁移性竞争。


              定价分为五个命名层级（Free、Developer、Startup、Business、Premium），按服务、云区域设价，并按小时计费。定价页上 Apache Kafka®
              的代表性价格展示了清晰阶梯：Free（$0，最多 30
              天，单消费者，自动到期）、Developer（$35/month，$0.05/hr）、Startup（$200/month，$0.27/hr）、Business（$500/month，$0.69/hr）、Premium（$1,900/month，$2.60/hr）。这套结构走的是标准
              SaaS「先落地、再扩张」路径：开发者通过 Free 层发现 Aiven，在 Developer 或 Startup 方案上评估，数据基础设施长大后再放大支出。分层存储作为附加项单独定价，付费方案为
              $0.00012/GB/hour，给基础订阅叠加了一层用量驱动的增购。


              2023 年 5 月推出的 BYOC（Bring Your Own Cloud）层级，是结构上不同的收入模型。BYOC 下，客户自己的云账户承担底层基础设施成本，Aiven
              不再向这些客户转嫁云成本，而是收取平台管理费（金额未披露），外加带最低月度消费承诺的企业支持合同。公开披露的 BYOC 客户包括 La Redoute（法国零售商）和
              Supermetrics（营销分析）；Google Cloud 合作伙伴新闻稿还点名 Priceline、ADEO 和 Mirakl，称这些客户受益于 Aiven-Google Cloud 合作。公司称，早期
              BYOC 客户相较标准托管安排，整体云支出平均降低 30%——这既是销售证明点，也说明 BYOC 客户对云成本相对敏感。站在 Aiven 角度，BYOC 改写了这些客户的毛利结构：云基础设施成本不再流经
              Aiven 的 P&L，随着 BYOC 渗透率提高，混合毛利率有望改善。


              订阅层级的收入确认相对直接，按服务期摊销确认；BYOC 合同则可能带来时点差异。如果最低月度消费承诺按年收款，收入摊销可能更复杂。本次未审阅到外部审计、监管文件或管理层对收入确认政策的评论。
