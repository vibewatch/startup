      - number: '3.2'
        title: 超大规模云厂商竞争压力
        blocks:
          - type: paragraph
            body: >-
              三大超大规模云厂商是 Aiven 核心收入基础面临的最大单一竞争威胁。它们的托管数据库服务——AWS RDS/Aurora/MSK/OpenSearch、Google Cloud SQL/AlloyDB/Pub
              Sub、Azure Database/Event Hubs——把开源兼容引擎打包进买方已经在支付的计费框架中。一个有 AWS 承诺消费额度的客户，可以在没有增量合同谈判的情况下采用 Amazon RDS for
              PostgreSQL；这种结构性分发优势，Aiven 不能仅靠销售和获客来复制。


              AWS 在竞争压力维度居首。Amazon RDS 提供八种数据库引擎，并有按需和 Reserved Instance（1 年、3 年）定价选项。Amazon Aurora 被定位为旗舰 PostgreSQL 和
              MySQL 托管引擎，声称吞吐量达到 MySQL 的 5x、PostgreSQL 的 3x，并提供最高 99.999% 多区域可用性以及几乎无限水平扩展的 DSQL 分布式 SQL 选项。Amazon
              MSK（Managed Streaming for Apache Kafka）与 Aiven for Apache Kafka 直接竞争：MSK Express brokers 声称相较标准 Kafka
              brokers，每个 broker 吞吐量最高多 3x，扩展快 20x，恢复快 90%，分区多 5x，并声称对分区受限工作负载性价比提升 50%。Amazon OpenSearch Service 与 Aiven
              for OpenSearch 竞争，增加 RAG 和向量搜索能力、与 CloudWatch Logs、DynamoDB 和 Security Lake 的 zero-ETL 集成，并接入 Amazon
              Bedrock 和 SageMaker 做 AI 模型托管。


              Google Cloud 的威胁更微妙。Google Cloud SQL 覆盖 MySQL、PostgreSQL 和 SQL Server，Enterprise Plus 版本提供 99.99%
              SLA、近零停机维护和智能数据缓存。AlloyDB 被明确定位为 PostgreSQL 的直接替代品，提供 30 天免费试用和可下载的 AlloyDB Omni 版本（这是 Google
              混合云野心的关键信号）。Aiven 2025 年 4 月宣布 AlloyDB Omni 合作——成为基于 AlloyDB Omni 托管服务的授权提供商——是在借力而非抵抗这一竞争威胁。Azure
              Database for PostgreSQL 声称相比本地部署 PostgreSQL TCO 低 58%，提供 99.99% SLA、60+ 个区域和 450+ 个核心 PostgreSQL
              commits，显示 Microsoft 对开源可信度的投入。Azure Event Hubs 提供 Kafka 协议兼容，并覆盖 CSA STAR、ISO、SOC、GxP、HIPAA、HITRUST 和 PCI
              等企业合规认证。


              超大规模云厂商竞争动态让 Aiven 必须同时应对两类买方。已有 AWS/GCP/Azure 承诺消费的单云客户若采用
              Aiven，需要承担切换成本：他们获得多云可移植性，但失去计费整合和平台原生集成。多云或云主权买方——尤其是需要跨两个或更多云满足数据驻留要求的受监管行业——会直接认可 Aiven 的价值主张。Aiven 的
              BYOC 产品（服务运行在客户自己的云 VPC 内）解决驻留顾虑，同时保留 Aiven 管理平面，使客户能把既有云支出承诺与 Aiven 的托管运营层结合起来。
