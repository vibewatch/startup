      - - 状态页限制——没有可公开访问的历史事故日志；外部无法核验运营记录
        - 高（结构性）
        - 中——妨碍尽调核验 SLA 遵守情况、MTTR 历史和按服务划分的可靠性
        - 低（结构性）
        - 未披露的历史宕机可能构成潜在声誉和信用风险；99.99% SLA 声明未经审计
