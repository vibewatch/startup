      - CM035
    columns:
      - 驱动 / 约束
      - 方向
      - 时间
      - 对 Aiven 的影响
      - 尽调问题
    rows:
      - - PostgreSQL 开发者主导地位（49% 开发者）
        - 驱动
        - 持续至 2026 年
        - 每一个新的 PostgreSQL 工作负载，在被超大云厂商锁定前，都是 Aiven 的潜在买方
        - 量化 Aiven PostgreSQL ARR 占托管 PostgreSQL 总市场估算值的份额
      - - 多云采用（56% 组织，平均 2.3 家供应商）
        - 驱动
        - 持续至 2026 年
        - 多云买方天然适合 Aiven；单云买方需要迁移触发因素
        - Aiven 客户中有多大比例同时在 2+ 个云上运行工作负载？
      - - Kubernetes 生产采用（66% 组织）
        - 驱动 / 混合
        - 持续至 2026 年
        - 云原生运维常态化，但也让 DIY 数据库管理可行，成为 Aiven 的部分替代
        - 面对 Kubernetes 上基于 Helm chart 的自管数据库 operator，Aiven 如何拉开差异？
      - - 开源许可证限制（ELv2、Redis SSPL）
        - 驱动
        - 已经兑现；2026 年替换仍在继续
        - 托管服务买方持续被挤出；Aiven 默认开源的定位直接受益
        - 估算自 2021 年以来从 Elastic Cloud 和 Redis 托管服务流出的买方数量
      - - 超大云厂商托管数据库深度（AWS 7+ 类型，GCP 覆盖前 100 中 95%）
        - 约束
        - 结构性；2026 年及以后
        - 对单云买方占优；除非已被要求多云，否则切换成本高
        - Aiven 在对阵 AWS RDS 和 Google Cloud SQL 的竞争交易中胜率是多少？
      - - 开发者工具支出宏观逆风（2023 年裁员周期）
        - 约束
        - 2022–2024 年低谷；2026 年部分恢复
        - 核心细分市场买方形成速度放慢；Aiven 2023 年裁员反映了这一点
        - Aiven 净 ARR 增长是否正在从 2023 年低谷恢复？净收入留存率（NRR）是多少？
      - - 数据主权与 BYOC 需求（EU AI Act、GDPR 执法）
        - 驱动
        - 到 2026 年持续加速
        - 监管为 BYOC 提供顺风；在受监管企业买方面前，Aiven 借此区别于超大云厂商
        - Aiven 2026 年收入中有多少比例来自 BYOC 部署客户？
      - - AI 原生开发推动超大云厂商向量 DB 和 AI 集成存储采用
        - 约束 / 机会
        - 新兴；到 2026 年变得重要
        - AI 工作负载可能加深与超大云厂商的绑定；Aiven 的 AlloyDB Omni 和 ClickHouse 是部分对冲
        - Aiven 的托管服务是否提供向量数据库能力（pgvector、OpenSearch kNN）？
