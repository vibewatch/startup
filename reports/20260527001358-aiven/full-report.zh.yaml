      - number: '6.3'
        title: 采用、部署模式与云组合
        blocks:
          - type: paragraph
            body: >-
              Aiven 的客户获取遵循基础设施即服务厂商典型的自下而上、开发者主导模式。开发者通过文档、Terraform provider（github.com/aiven/aiven-examples），或
              AWS、GCP、Azure 上的云市场列表发现 Aiven。初始部署最常见的是在单一区域、标准层使用 Kafka 或 PostgreSQL；随着工作负载增长，通常在 6–18 个月内扩展到更多服务、区域和
              BYOC。多个案例研究印证了这一模式：Hookdeck 从 PostgreSQL 起步并扩展到六项服务；La Redoute 在 Azure 成本压力出现后从 Standard 迁移到 BYOC；Sophos 从
              Standard 转向 BYOC，以获得 9 个 AWS 区域的成本透明度。


              具名案例客户的云组合显示，AWS 是最常见的 BYOC 底座（Sophos、Claroty、Priceline 部分使用），GCP 第二（WalkMe、Simplilearn、Aiven 的 Google
              Cloud Partner 奖），Azure 第三（La Redoute、Avaya）。多云部署——客户在两个或更多超大规模云厂商上运行服务——有 Priceline（四个云区域）、Dojo（多云支付）和
              Back Market（跨云迁移且无停机）等案例记录。Back Market 迁移是一个值得注意的采用证据点：Back Market 在不中断服务的情况下跨云厂商迁移 13M+
              客户数据，这项运营复杂度很高，展示了 Aiven 的迁移工具能力。


              地理覆盖横跨所有主要区域。EMEA 案例包括 La Redoute（法国）、Sophos（总部英国）、BLUME2000（德国）、NAV（挪威）、A1 Austria 和 Mirakl（法国 / 全球）。北美
              logo 包括 Priceline、WalkMe、Claroty、Hookdeck（加拿大）和 Avaya。APAC 由 GoTo Financial（印尼 / APAC
              金融科技）、Simplilearn（印度）和 Katana（总部爱沙尼亚但服务 70 个国家）代表。这一地理广度与 Aiven 所称覆盖 60+ 个国家一致。
