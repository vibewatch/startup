      - number: '1.3'
        title: 股权结构与融资历史
        blocks:
          - type: paragraph
            body: >-
              截至 2022 年 5 月，Aiven 已通过六个披露融资批次累计融资约 $420M。融资序列从 2017 年 8 月的 $1M 种子轮开始，投资方为 Lifeline Ventures（Helsinki）和
              Business Finland；随后是 2019 年初由 Earlybird Venture Capital 领投、Lifeline 跟投的 $9–10M Series A。2020 年 1 月，公司完成
              $40M Series B，IVP 领投，Earlybird、Lifeline 和 Molten Ventures（原 Draper Esprit）参投。2021 年 3 月，Aiven 又完成由 Atomico
              领投、估值 $800M 的 $100M Series C，Salesforce Ventures 和 World Innovation Lab 参投。仅七个月后，2021 年 10 月，现有投资者 WiL 和
              IVP 共同领投 $60M Series C 延伸轮，估值 $2B——不到一年估值抬升 2.5x，反映出异常强劲的客户动能（50 个国家的 700 家公司）和超过 100% 的同比收入增长。累计 $160M 的
              Series C 使总融资达到 $210M。2022 年 5 月 10 日宣布的 Series D 再增加 $210M，投前估值 $3B，由 Eurazeo 领投，BlackRock 和 IVP
              参投，累计融资推至约 $420M。


              GetLatka 报告融资 $419.9M；Tracxn 报告 $421M——四舍五入差异并不重要，两者都确认融资弧线止于 2022 年 5 月 Series D 的六轮。2022 年 5 月至运行日期 2026
              年 5 月 27 日之间，没有任何融资轮公开宣布——对这个规模的公司而言，四年空窗值得注意。Aiven CEO 曾在 2021 年 10 月公开表示，IPO 是退出中「更可能的选择」，但截至运行日期没有提交
              S-1 或 IPO 注册文件。


              收入侧，Aiven 在 2025 年 7 月突破 $100M ARR，该信息由 CEO Saarenmaa 在公司自有博客中确认。ARR Club 的里程碑追踪器估计，到 2026 年 3 月 ARR 已达到
              $109M。GetLatka 另一个 $48.7M ARR 估计似乎反映更早的数据版本，或采用了不同收入定义（总合同价值而非纯订阅 ARR），此处给予较低置信度。$3B Series D 估值意味着当前 ARR
              倍数约 27–30x，高于 2026 年私募市场基础设施 SaaS 基准，且没有近期外部融资轮佐证。毛利率、NRR 和客户层面指标完全未披露。
