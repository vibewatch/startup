      - number: '6.6'
        title: 图表
        blocks:
          - type: callout
            title: BYOC 案例研究显示企业规模下的超额成本影响
            body: >-
              Aiven 的 BYOC 部署模型于 2023 年 5 月推出，已经在其案例库中形成最强客户证据。Claroty（Kafka TCO 降低 72%）、WalkMe（40%）和
              Sophos（30-40%）提供了三个独立数据点，确认 BYOC 的仅管理费计费模型，在大型 Kafka 部署总成本上显著优于托管 Standard 层。La Redoute 的 Azure BYOC
              结果（原预计 40% 成本增长降至 14%）把证明延伸到非 Kafka 的混合工作负载。如果这些结果能在新企业账户中复制，随着企业采购对云支出的审查加强，BYOC 应成为持久增长驱动。Google Cloud
              Partner of the Year 2025 奖点名 Priceline、ADEO 和 Mirakl 为示范 GCP 客户，为 Aiven 在 Google Cloud
              平台上的企业交付能力提供了独立第三方验证。
            calloutType: strength
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU031
          - type: callout
            title: 留存指标完全缺失，是最主要的尽调缺口
            body: >-
              Aiven 从未披露 NRR、GRR、客户 logo 流失或任何队列留存指标。对于一家处在竞争激烈的基础设施即服务市场、拥有 $100 M ARR 的公司，这个缺口使外部无法判断 ARR
              增长是由持久扩张驱动，还是部分被 2023 年需求短缺期（约 20% 裁员所显示）带来的流失抵消。TrustRadius 评论足迹稀少（截至 2025 年 6 月，Wayback Machine 显示 3
              条评论），只能提供很弱的情绪信号。在完成任何重大投资或商业交易前，尽调应要求管理层披露过去 12 个月 NRR 和 GRR，并给出客户数和 logo 流失。
            calloutType: risk
            claimRefs:
              - CU033
              - CU034
              - CU039
              - CU040
              - CU042
          - type: callout
            title: 客户数不透明与潜在 BYOC 集中度风险
            body: >-
              Aiven「数千家客户」的描述自 2022 年中以来没有细化。没有具体客户数，按 $100 M ARR 推算的隐含 ARPU 区间很宽：如果有 1,000 个客户，约 $100K；如果有 3,000 个客户，约
              $33K。两者对平均合同规模、销售动作和集中度风险的含义完全不同。BYOC 案例研究——Sophos（79 个集群、9 个 AWS 区域）、WalkMe 和
              Claroty——都指向大规模部署；若按基础设施范围定价，单个部署可能代表 $1–5 M+ ARR。如果 5-10 个此类账户贡献 30-50% ARR，单个企业客户流失就可能构成重大影响。Aiven
              没有披露任何集中度数据来反驳这一情景。
            calloutType: risk
            claimRefs:
              - CU003
              - CU041
              - CU043
              - CU044
          - type: callout
            title: 承诺前要求披露 NRR、客户数与 top-10 客户集中度
            body: >-
              鉴于留存和集中度披露完全缺失，任何 Aiven 尽调流程在形成估值和增长耐久性判断前，都应向管理层要求三项具体数据。第一，过去 12 个月 NRR 和 GRR，并按 Standard 与 BYOC
              队列拆分。第二，当前总 logo 数和过去 12 个月净新增 logo。第三，top-10 客户占 ARR 比例，以及是否有单一客户超过 ARR 的 5%。这些披露是后期成长股权流程的标准要求；一家 $100 M
              ARR、瞄准未来公开市场的公司不应需要为此谈判。在数据可得前，客户质量和耐久性叙事完全依赖 16 个量化案例研究的自选样本，且全部由公司筛选。
            calloutType: recommendation
            claimRefs:
              - CU033
              - CU034
              - CU041
