      - number: '8.3'
        title: 可比估值分析——公开市场、M&A 与私营可比公司
        blocks:
          - type: paragraph
            body: >-
              Aiven 适用的可比对象横跨四组：上市数据基础设施 SaaS（Confluent/IBM、MongoDB、Elastic、Datadog）、一笔已完成的战略 M&A
              交易（IBM-Confluent）、一家私营独角兽同业（ClickHouse），以及 Aiven 自身过时的估值标记。每组可比对象都从不同角度说明，在 Aiven
              的规模、增长和利润率画像下，哪些倍数范围可被防守。


              IBM-Confluent M&A 交易（$11B，2025 年 12 月宣布，2026 年 3 月完成）是最直接可比的数据点。Confluent 以每股 $31 的全现金交易被收购，价格约为其 FY2025
              收入 $1.167B 的 9.4x。关键在于，Confluent 早期阶段收入约 $388M（FY2021）时毛利率为 64.6%——这是最接近 Aiven 当前估计利润率画像（ARR
              $109M）的历史类比。Confluent 扩大到 $1.17B 后，毛利率提升至 74.3%。如果 Aiven 沿可比轨迹扩张毛利率，可能接近支撑 8–10x 以上 M&A 倍数所需的 70%+
              区间。不过，IBM 交易也让 IBM 不再可能成为 Aiven 的战略收购方，而下一个最可信的战略买家（AWS、Google
              Cloud、Oracle、ServiceNow）都没有公开表现出收购一家竞争性多云平台的兴趣。


              MongoDB（MDB）市值 $24.7B、FY2026 收入 $2.46B（增长 22.8%、毛利率 71.75%）代表可比平台溢价：MongoDB Atlas 是规模化托管数据库即服务，增长率与 Aiven
              估计轨迹一致。以约 10x NTM 收入计算，MongoDB 处于适用公开市场区间上端，对 Aiven 当前 ARR 隐含估值约 $1.09B——仍比过时的 $3B 标记低
              64%。Elastic（ESTC）LTM 收入 $1.68B、增长 17.3%、市值 $5.63B（约 3.4x），代表面对 AI 竞争压力的托管搜索 / 分析基础设施压缩底线；如果超大规模云替代品加速占领
              Aiven 所在细分市场，这是合理下行情景。Datadog（TTM 收入 $3.67B、市值 $79.61B、21.7x）纳入是为了完整性，但不是直接适用倍数——Datadog 的溢价来自 30%+ 增长、29%
              FCF 利润率和可观测性品类领导地位，而 Aiven 都无法证明。


              ClickHouse 的 $15B 私营估值（2024 年 9 月，Dragoneer 领投 $400M Series D）为 OLAP 分析细分市场倍数提供了一个数据点。不过，ClickHouse
              的估值隐含显著 AI 驱动 OLAP 溢价，未必能转移到 Aiven 更分散、增速更低的画像上。剔除 Datadog 后的混合可比区间，中位数约为 7–8x EV/revenue，对
              IBM-Confluent（9.4x）、MongoDB（10x）和 Elastic（3.4x）等权处理。按 7–8x 计算，Aiven 的公允价值为 $763–$872M——比过时的 $3B 标记低约
              71–75%。
