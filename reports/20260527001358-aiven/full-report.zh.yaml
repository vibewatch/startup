      Aiven 估计毛利率为 55–65%，比 Confluent 和 Elastic FY2025 74%+ 的实际毛利率低 10–20 个百分点，反映当前规模下由云基础设施转嫁成本带来的结构性成本差。Confluent 毛利率从
