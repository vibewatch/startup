        - 需要多区域 SQL 的企业关键任务应用
        - 分布式 SQL；99.99% SLA；多区域驻留；SOC 2 / ISO 27001
        - 兼容 PostgreSQL 但并不完全相同；单品类；没有流处理 / 搜索
