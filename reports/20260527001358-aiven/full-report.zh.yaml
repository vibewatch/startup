  - id: FI001
    title: Aiven 收入模型——成本层桥接
    type: flow
    layout: standard
    summary: 订阅价格打包三层叠加成本——云基础设施转嫁、平台运营和 Aiven 利润；BYOC 为企业客户移除基础设施层，可能改善混合毛利率。
    data:
      nodes:
        - id: subscription-fee
          label: 客户订阅付款
          detail: 按小时计费套餐：Free、Developer $35/mo、Startup $200/mo、Business $500/mo、Premium $1,900/mo
          tone: positive
        - id: cloud-infra
          label: 云基础设施成本（约占收入 35–45%）
          detail: Aiven 按企业费率购买 AWS / GCP / Azure 的计算、存储和网络，并把成本打包进价格转嫁给客户
          tone: neutral
        - id: platform-ops
          label: 平台运营与支持（约 10–15%）
          detail: 99.99% SLA 交付：开通、监控、补丁、备份、故障切换、7×24 专家支持团队
          tone: neutral
        - id: gross-margin
          label: 估计毛利率（约占收入 40–55%）
          detail: 扣除云基础设施和平台运营后的残余；估计为收入的 55–65%；随规模扩大和云采购议价能力提升而改善
          tone: positive
        - id: byoc-path
          label: BYOC 企业路径
          detail: 客户自己的云账户承担基础设施成本；Aiven 只收平台管理费——单客户利润率更高
          tone: positive
        - id: opex
          label: 研发、销售与市场、G&A
          detail: 估计年度薪酬约 $30–52M（300–350 名全职员工）；另有云研发和 G&A 支出
          tone: neutral
        - id: operating-result
          label: 经营利润 / 亏损（未披露）
          detail: 现金流收支平衡状态未确认；四年融资空窗说明现金可能充足，也可能正接近盈利
          tone: warning
      edges:
        - from: subscription-fee
          to: cloud-infra
          label: 覆盖
        - from: subscription-fee
          to: platform-ops
          label: 覆盖
        - from: subscription-fee
          to: gross-margin
          label: 剩余转为
        - from: byoc-path
          to: gross-margin
          label: 借此改善利润率
        - from: gross-margin
          to: opex
          label: 支撑
        - from: opex
          to: operating-result
          label: 决定
    approximationNotes: 成本层百分比是基于 Confluent 同行对比和结构推断得出的分析师估计。毛利率区间（55–65%）仅表示方向。BYOC 收费结构未公开；利润率改善是结构推断，不是披露数据。
    claimRefs:
      - CI011
      - CI013
      - CI014
      - CI028
      - CI030
      - CI032
      - CI033
