        - EU / EEA / UK GDPR
        - 现行义务；Aiven 可按请求提供 DPA；在标准部署和 BYOC 部署中担任数据处理者
        - 高（持续）
        - 中等——声誉和财务处罚暴露实质存在（最高可达全球营业额 4%）；合规姿态有所缓释
        - ISO 27001、SOC 2、DPA 发布、单租户 VPC、TLS 强制、SBOM 发布
        - 审计报告受 NDA 限制；BYOC 合规继承自客户云账户；非欧盟数据流的跨境 SCCs 未确认
        - 索取最新 SOC 2 Type II 报告、范围边界和 GDPR 第 28 条处理者协议；核验美国数据流的 SCCs
      - - 欧盟 Cyber Resilience Act（CRA）——在欧盟市场销售的含数字元素软件产品
        - 欧盟（2024 年 12 月生效；主要义务自 2027 年 12 月起）
        - Aiven 已发布 SBOM；正式 CRA 合规计划和 CE 标记流程未公开说明
        - 中（2027 截止期临近）
        - 中等——合规成本、CE 标记、2026 年 9 月起强制漏洞报告；不合规可能影响市场准入
        - 通过 CLI 发布 SBOM 是准备步骤；安全团队和渗透测试计划已就位
        - 完整 CRA 合规计划成本未量化；CRA 下开源组件分类仍在演进
        - 索取 Aiven 的 CRA 合规路线图、已分配预算，以及法律顾问对该法案下托管开源服务分类的意见
      - - 上游开源许可证变更——Redis/SSPL、Elasticsearch/ELv2 的历史先例；ClickHouse 双许可证风险
        - 全球（无特定司法辖区——合同 / 产品风险）
        - Redis 于 2024 年 3 月改证（触发 Valkey 分叉）；Elasticsearch 于 2021 年 1 月改证（触发 OpenSearch 分叉）；ClickHouse Inc. 控制专有云层功能
        - 中（周期性，且与 OSS 公司 VC 压力相关）
        - 高——被迫调整产品会消耗工程资源、需要客户沟通，并可能扰动受影响服务线的 ARR
        - Valkey 分叉已维护；OpenSearch 归 Linux Foundation；ASF 托管项目（Kafka、Flink）结构性风险较低
        - ClickHouse Inc. 未来许可证姿态未定；MySQL Oracle 商业许可增加复杂度；没有防范上游改证的正式合同保护
        - 索取知识产权律师关于每项服务许可证暴露的备忘录；确认 Aiven 是否向客户作出过开源许可证连续性的合同承诺
      - - 芬兰公司报告——Aiven Oy 有限财务披露义务
        - 芬兰 / Finnish Trade Register
        - Aiven Oy 向 Finnish Trade Register 备案；可使用简化财务格式；集团合并账目未公开
