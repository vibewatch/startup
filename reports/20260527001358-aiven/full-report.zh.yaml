      - number: '7.5'
        title: 开源许可变化与上游社区依赖
        blocks:
          - type: paragraph
            body: >-
              Aiven
              的整个产品组合建立在开源软件之上：公司负责打包、托管和支持，而不是从零开发。这带来一种自研专有厂商不面对的风险：上游许可证变化、社区分裂、基金会治理调整，都可能几乎没有预警地迫使产品转向、法律审查和客户沟通。


              这一风险最清晰的历史证据是 Elasticsearch → OpenSearch 分裂（2021 年 1 月）以及 Redis → Valkey 分叉（2024 年 3 月）。Elastic 决定把
              Elasticsearch 从 Apache 2.0 重新许可为 SSPL/ELv2 双许可证，推动 AWS 和 Aiven 创建 OpenSearch 分叉，并在 2024 年 1 月捐赠给 Linux
              Foundation。Aiven 不得不把客户从 Elasticsearch 迁移到 Aiven for OpenSearch，这带来显著运营和沟通负担。类似地，Redis Ltd 在 2024 年 3 月改用
              RSALv2/SSPL 许可，促成 Linux Foundation 支持的 Valkey 分叉。Aiven 现在提供 Aiven for Valkey™ 作为 Redis 后继产品，但 Valkey
              的品牌认知和社区动能弱于 Redis，可能制造客户体验摩擦。OpenSearch 项目迁移到 Linux Foundation 也进一步说明，关键项目的治理连续性不能被视为理所当然。


              在 Aiven 当前服务目录中，Apache Kafka 与 Apache Flink（Apache Software Foundation，Apache 2.0 许可证）以及
              PostgreSQL（PostgreSQL License，MIT 风格）的许可风险最低，因为它们没有单一企业所有者、也没有重新许可的利润动机。ClickHouse 的开源版本采用 Apache 2.0
              双许可，但 ClickHouse Inc. 控制区分 ClickHouse Cloud 的专有云功能——这带来一个风险：ClickHouse Inc. 未来可能逐步限制托管服务竞争者。Apache
              Cassandra、Grafana、MySQL 风险画像各不相同：Grafana Labs（专有插件）、Oracle（MySQL 商业许可）以及更广泛的 ASF 治理结构都会增加复杂性。


              欧盟 Cyber Resilience Act 已于 2024 年 12 月 10 日生效，主要义务自 2027 年 12 月 11 日起适用；它为销往欧盟、带有数字元素的软件产品增加了合规义务。Aiven
              已经通过 CLI 发布 SBOM 报告——这是相关的准备动作——但 CRA 合规还需要正式安全评估、对符合条件的产品加贴 CE 标志，并在产品生命周期内持续管理漏洞。相关合规成本尚未公开量化。
