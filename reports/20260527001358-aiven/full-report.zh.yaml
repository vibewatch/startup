  - id: FV001
    title: 推荐逻辑——从证据到投资决策的链条（Aiven，2026 年 5 月）
    type: flow
    layout: wide
    summary: 推荐逻辑从收入证明和市场机会（正向信号）出发，经过财务不透明和估值陈旧（负向信号），最后落到一个有条件结论：$3B 估值下放弃；若以 5–8x ARR 进入，并通过数据室核验，才可有条件推进。
    data:
      nodes:
        - id: revenue-proof
          label: 收入证明：$109M ARR（2026 年 3 月）
          detail: 公司 2025 年 7 月确认 >$100M；ARR Club 估计 $109M；11 项服务的多云平台；BYOC 企业客户已有牵引
          tone: positive
        - id: market-opportunity
          label: 市场机会：$8–12B SAM，20–25% CAGR
          detail: 多云开源 DBaaS；56% 的企业使用 2+ 个云；Aiven 是唯一云中立的多服务提供商
          tone: positive
        - id: product-moat
          label: 产品护城河：广度 + BYOC 可移植性
          detail: AWS / GCP / Azure 上 11 项托管服务；BYOC 去掉基础设施成本；EverSQL AI SQL 层；设计上天然可移植
          tone: positive
        - id: financial-opacity
          label: 财务不透明：未披露毛利率、NRR、审计或现金余额
          detail: 毛利率估计 55–65%；NRR 未核验；无经审计 P&L；4 年融资空窗；现金跑道未知
          tone: warning
        - id: valuation-staleness
          label: 估值陈旧：$3B = 27.5x ARR（2022 年 5 月）
          detail: 公开可比公司：Elastic 3.4x、Confluent M&A 9.4x、MongoDB 10x、Datadog 21.7x；陈旧标记没有 2026 年锚点
          tone: warning
        - id: competitive-pressure
          label: 竞争压力：超大规模云厂商 + IBM / Confluent
          detail: AWS MSK、Google AlloyDB、Azure Event Hubs 借账单集成施压；IBM-Confluent 移除了最佳 M&A 可比交易；ClickHouse $15B 表明聚焦型专家能拿到溢价
          tone: warning
        - id: exit-path
          label: 退出路径：2027–28 年 IPO 或战略 M&A
          detail: CEO 2021 年 10 月表示有 IPO 意图；尚未提交 S-1；CFO / CRO 招聘显示在做准备；潜在战略买家包括 AWS、Google、Oracle、ServiceNow
          tone: neutral
        - id: entry-at-3b
          label: 以 $3B 进入：所有情景均为负
          detail: 悲观：-73 至 -87% 亏损。基准：-33 至 -60% 亏损。乐观：接近持平到小幅收益。加权情景下预期回报为负。
          tone: warning
        - id: entry-at-5-8x
          label: 以 5–8x ARR 进入（约 $545–872M）：有条件通过
          detail: 悲观：0.6–1.2x（接近盈亏平衡）。基准：1.8–3.1x。乐观：4.3–6.9x。仍待数据室核验。
          tone: positive
        - id: recommendation
          label: 投资建议：不要在 $3B 估值投资；5–8x ARR 下有条件通过
          detail: 数据室必查：毛利率、NRR、现金跑道、股权结构表。最低入场价：$500–800M 老股交易，或下调估值的新股融资。
          tone: warning
      edges:
        - from: revenue-proof
          to: entry-at-5-8x
          label: 支持
        - from: market-opportunity
          to: entry-at-5-8x
          label: 支持
        - from: product-moat
          to: entry-at-5-8x
          label: 支持
        - from: financial-opacity
          to: entry-at-3b
          label: 推动负回报
        - from: valuation-staleness
          to: entry-at-3b
          label: 推动负回报
        - from: competitive-pressure
          to: entry-at-3b
          label: 放大风险
        - from: exit-path
          to: entry-at-5-8x
          label: 取决于
        - from: entry-at-3b
          to: recommendation
          label: 无法证成
        - from: entry-at-5-8x
          to: recommendation
          label: 有条件可行
    approximationNotes: 回报估计是分析师基于公开可比倍数和估计 ARR 轨迹做出的预测。由于情景概率不确定，未计算加权预期回报。
    claimRefs:
      - CV007
      - CV021
      - CV022
      - CV025
      - CV032
      - CV041
  - id: FV002
    title: 估值敏感性——不同 ARR 倍数下 Aiven 隐含企业价值（2026 年 5 月）
    type: bar
    layout: wide
    summary: >-
      柱状图显示，当 ARR 倍数从 3x（类似 Elastic 的悲观底部）到 27.5x（陈旧 $3B 标记）变化时，Aiven 对应的隐含企业价值；图中以 IBM-Confluent M&A 交易（9.4x）和 MongoDB
      公开市场（10x）作基准。$3B 陈旧标记比有支撑的区间高 3.4–9x。
    data:
      items:
        - label: 3x ARR（Elastic 悲观底部）
          value: 327
          note: Elastic EV / Revenue 约 3.4x；因 Aiven 规模和增长折价而压缩；USD M
        - label: 4x ARR（保守私人市场折价）
          value: 436
          note: 悲观情景上限；对 Elastic 可比倍数施加 15–25% 私人市场非流动性折价；USD M
        - label: 5x ARR（基准情景低端）
          value: 545
          note: 低端基准：低于公开市场中位数，符合未达规模化的私人公司；USD M
        - label: 7x ARR（基准情景中位）
          value: 763
          note: 中位基准：Confluent M&A（9.4x）、MongoDB（10x）、Elastic（3.4x）混合中位数，并施加私人市场折价；USD M
        - label: 8x ARR（基准情景高端）
          value: 872
          note: 基准上限；接近 20–25% 增长托管基础设施公司的 MongoDB 式倍数；USD M
        - label: 9.4x ARR（Confluent M&A 可比交易）
          value: 1025
          note: 直接套用 IBM-Confluent 交易倍数；战略退出情景的 M&A 底部；USD M
        - label: 10x ARR（MongoDB 公开市场）
          value: 1090
          note: 套用 MongoDB EV / NTM 倍数；代表 23% 增长下公开市场高端基准；USD M
        - label: 12x ARR（乐观战略溢价）
          value: 1308
          note: 乐观情景含竞争性 M&A 竞价溢价；需要 >30% 增长和 >70% 毛利率；USD M
        - label: $3B 陈旧标记（2022 年 5 月）
          value: 3000
          note: 当前 ARR 的 27.5x；2026 年公开或私人可比交易都不支撑 Aiven 这一画像拿到该倍数；USD M
    approximationNotes: >-
      所有数值均为百万美元。ARR 基数为 $109M（ARR Club 2026 年 3 月估计）。公开可比公司 EV / revenue 倍数来自 stockanalysis.com 2026 年 5 月市场数据。$3B
      陈旧标记来自 2022 年 5 月 Series D 新闻稿。施加 15–20% 私人市场折价系数，用公开可比水平推导 Aiven 专属区间。
    claimRefs:
      - CV007
      - CV011
      - CV013
      - CV015
      - CV017
      - CV021
      - CV022
      - CV023
      - CV024
  - id: FV003
    title: 估值与回报区间——悲观 / 基准 / 乐观 / 陈旧标记情景（Aiven，2026–2029）
    type: range
    layout: standard
    summary: 展示 Aiven 在悲观（3–5x ARR）、基准（5–10x ARR）、乐观战略 M&A（10–14x ARR）和陈旧 $3B 参考标记下的退出价值区间。陈旧标记已与所有前瞻情景脱节。
    data:
      items:
        - label: 悲观情景：3–5x ARR，增长 <15%，2027 年退出（USD M）
          low: 327
          mid: 436
          high: 545
        - label: 基准情景：5–10x ARR，20–25% 增长，2027–28 年 IPO（USD M）
          low: 545
          mid: 872
          high: 1308
        - label: 乐观情景：10–14x ARR，2028–29 年战略 M&A（USD M）
          low: 1090
          mid: 1750
          high: 2800
        - label: 陈旧 $3B 标记参考（2022 年 5 月锚点，USD M）
          low: 2800
          mid: 3000
          high: 3210
    approximationNotes: >-
      单位为百万美元。悲观情景基于当前 ARR（$109M）的 3–5x；基准情景把可比区间套用到增长后的 $170–200M 退出 ARR；乐观情景按 10–14x，把战略 M&A 可比倍数套用到 $250–320M 退出
      ARR。陈旧标记区间反映 2022 年 5 月 Series D 的 $3B 投前到 $3.21B 投后（GetLatka）。所有预测都是分析师估计，不确定性很高。
