    title: 增长驱动与约束表
    description: Structural growth drivers and adoption constraints for multi-cloud managed open-source data services in 2026.
    notes: 时间判断是定性评估；「持续至 2026 年」表示结构性趋势已经启动。「新兴」表示预计到 2026 年底会变得重要。
