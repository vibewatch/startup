        - 统一运营 + 搜索 + 分析 + 流处理平台；$1B+ 收入规模
        - 专有文档模型；不支持托管 PostgreSQL wire protocol；没有 Kafka/OpenSearch 广度
      - - Elastic Cloud
        - OSS 原生托管（搜索 / 可观测性）
        - '$1.483B FY2025 收入（同比 17%）；NYSE: ESTC'
        - 企业搜索、日志分析、安全；政府（FedRAMP）
        - FedRAMP Moderate；ELv2 许可相对超大云厂商形成护城河；Serverless + Hosted 选项
        - 单品类（Elastic/OpenSearch）；没有关系型 / 流处理托管服务
      - - ClickHouse Cloud
        - OSS 原生托管（实时分析）
        - $15B 估值（2024，Reuters via clickhouse.com）；私有公司
        - 分析 / OLAP 工作负载；产品分析；广告技术
        - 存算分离；缩至零；查询速度基准
        - 单品类（OLAP 分析）；与 Aiven for ClickHouse 产品重叠
      - - Neon
