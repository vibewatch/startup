      - number: '7.2'
        title: 超大规模云厂商定价权与专业供应商围堵
        blocks:
          - type: paragraph
            body: >-
              Aiven 同时承受两侧结构性竞争压力：超大规模云厂商不断扩充托管开源数据库组合，专注单一服务品类的 OSS 厂商也在加深各自护城河。这种双向挤压下，Aiven
              的多云可移植性成了主要可持续差异化；无论是云厂商账单集成，还是单服务专家的产品优势，只要削弱这道护城河，长期收入增长都会受威胁。


              在超大规模云厂商一侧，AWS MSK（Managed Streaming for Apache Kafka）是对 Aiven 最大收入服务最直接的竞争威胁。AWS 称，相比标准 Kafka broker，MSK
              Express broker 吞吐量高 3×、扩容快 20×、恢复快 90%、分区数多 5×。Amazon Aurora 这个旗舰 PostgreSQL 替代品宣称吞吐量达到标准 PostgreSQL 的
              3×。Aiven 在搜索 / 分析领域还要面对 Amazon OpenSearch Service，后者已经加入 RAG、向量搜索能力，并接入 Amazon Bedrock。Google AlloyDB 作为
              Aiven 首个联合解决方案（AlloyDB Omni）同时验证并复杂化了 Aiven 的位置：Google 自研 AlloyDB 宣称相对标准 PostgreSQL 可降低 40–50% 计算成本，为
              AlloyDB Omni 立下价格锚，压低了 Aiven 标准 PostgreSQL 层级的相对吸引力。Azure Event Hubs 支持 Kafka 协议兼容，并具备企业合规认证（CSA
              STAR、ISO、SOC、GxP、HIPAA、HITRUST、PCI），在许多大型企业已经使用的云里，合规姿态与 Aiven 相当。


              Aiven 的结构性劣势在账单集成。AWS 客户如果已有承诺消费，采购 Amazon RDS for PostgreSQL 或 Amazon MSK
              几乎没有新增采购摩擦，费用直接抵扣既有合同承诺的额度。Aiven 复制不了这种分发优势。AlloyDB Omni 合作让 Aiven 可以部署在 Google Cloud
              账户内，部分缓解了问题；但反向风险也存在：深度进入 Google Cloud 生态的客户，最终可能整合到 Google 原生服务，而不是继续维持 Aiven 关系。


              在专业厂商一侧，Confluent（FY2025 收入 $1.17B，同比增长 21%）正在打造自研云原生 Kafka 引擎 Kora；Aiven 若不放弃开源纯粹性逻辑，就无法复制。ClickHouse
              Cloud（2024 年估值 $15B）正在加深分析型数据库护城河。Neon（无服务器 PostgreSQL，$46M Series B）以即时缩容到零能力切入开发者优先的
              PostgreSQL。每个专业厂商都有更深的品类积累，对把单一数据库家族置于多云可移植性之上的买家，产品市场匹配更好。Aiven
              的逻辑要求多服务广度带来的切换成本超过专业厂商优势——这个假设合理，但尚未被已披露的 NRR 数据检验。
