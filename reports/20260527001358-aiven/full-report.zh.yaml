      - number: '6.2'
        title: 具名客户证据与量化结果
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 5 月，Aiven 发布了 30+ 个案例研究，其中 16 个包含具体量化结果。结果分布偏向 BYOC 部署，因为 BYOC 让客户在向 Aiven
              支付管理费的同时保留直接云账单可见性，因此一致报告了最大的成本下降。16 个量化案例中有 14 个以 Kafka 为核心服务，反映出 Kafka 既是 Aiven
              最成熟的托管服务，也是在规模化自管时运营负担最高的集群之一。


              最重要的量化结果包括：Claroty 在 BYOC AWS 上将 Kafka TCO 降低 72%，总基础设施成本降低 50%，同时四年内客户数增长 300%。WalkMe 在 BYOC GCP 上实现 40%
              Kafka TCO 降低、通过分层存储减少 80% Kafka 存储，并在不增加支出的情况下吸收 30% 数据量增长。Sophos 将 Kafka 支出降低 30-40%，并在 BYOC 上完成 9 个 AWS
              区域、79 个集群的零停机迁移。La Redoute 使用 Azure 上的 BYOC，把原本预计 40% 的基础设施成本增长压到只有 14%。Mirakl 在标准（非 BYOC）Kafka 上实现运营费用降低
              70%，处理每秒 9,000 条消息。Hookdeck 把六项服务（PostgreSQL、Kafka、ClickHouse、Grafana、OpenSearch）整合到 Aiven 上，并观察到
              ClickHouse 性能提升 30x、存储减少 53%。美国在线旅行社 Priceline 在四个云区域使用 Aiven Kafka，把客户数据洞察时间从数小时降到不到两分钟。制造业 SaaS 公司
              Katana 报告称，迁移到 Aiven 后，其客户的库存周转率改善 21%。


              所有案例研究都由 Aiven
              发布和筛选，存在幸存者偏差：只有成功部署且满意的客户才会产出公开引用。公司没有发布任何流失、降级或迁移失败的客户队列。独立佐证仅限于客户公司自己的公开存在，能确认组织存在和规模，但不能独立验证 Aiven
              归因的指标。
