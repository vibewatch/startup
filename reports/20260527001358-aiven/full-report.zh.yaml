      - number: '1.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 开源筛选模型带来持久开发者信任
            body: >-
              Aiven 管理的是最优秀的社区数据库，而不是 fork 或替代它们，因此避开了困扰 Confluent（BSL）、MongoDB（SSPL）和 Elastic（SSPL/ELv2）的许可争议风险。运行
              Aiven for PostgreSQL 的客户拿到的是原汁原味的上游引擎，没有供应商锁定；Aiven 对上游的活跃贡献（Karapace、pglookout、专职 committer
              团队）也强化了其在开发者社区中的地位。这一路径支撑了 $100M ARR 里程碑，并形成自然扩张通道：客户采用 Aiven for Kafka 后，之后采用 Aiven for PostgreSQL 或
              ClickHouse 的可能性更高，而且不必重新评估一套专有技术栈。
            calloutType: strength
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO031
          - type: callout
            title: $3B 估值已陈旧，SaaS 健康指标未披露
            body: >-
              2022 年 5 月 $3B Series D 估值设在 2021–2022 年 SaaS 倍数高点。2025 年 7 月确认 ARR 超过 $100M，且四年没有新融资轮，意味着隐含 ARR 倍数约
              27–30x——显著高于 2026 年基础设施 SaaS 私募市场基准。缺少毛利率、NRR
              和客户数披露，使外部无法判断单位经济是否支撑这个账面估值。老股交易或新的新股融资很可能重置预期；在那之前，尽调应显著折价看待 2022 年估值。
            calloutType: risk
            claimRefs:
              - CO028
              - CO029
              - CO030
              - CO043
          - type: callout
            title: 2023 年 1 月裁员暴露执行和文化风险
            body: >-
              CEO 公开承认高管团队「犯了错误」、年化运行率低于估计，以及员工数翻倍「导致缺乏焦点和优先级」，这是少见且重要的坦诚信号。它也说明 Aiven 领导层没能足够早地发现过度扩张，从而避免 20%
              的修正。对一家把自身定位为走向 IPO 的公司而言，这段经历会引发外界对前瞻性指引纪律、内部财务控制以及管理层穿越宏观周期能力的疑问。
            calloutType: risk
            claimRefs:
              - CO037
              - CO038
              - CO039
              - CO040
          - type: callout
            title: Google Cloud 合作加深战略护城河和获客触达
            body: >-
              Google Cloud 年度合作伙伴奖（2025 年 4 月）和联合工程的 AlloyDB Omni GA（2025 年 4 月），标志着 Aiven
              的合作层级出现质变——从市场列表升级为联合产品开发。Elena Zykova 称 AlloyDB Omni 让企业能够「去除复杂性并实现轻松扩展」，同时 Google Cloud 数据库副总裁 Andi
              Gutmans 将该合作称为「重要一步」，两者共同确认了双边战略意图。这一关系为 Aiven 带来一个差异化的多云向量搜索产品，MongoDB Atlas 和 Confluent 目前尚未匹配——这也是 AI
              原生数据库工作负载上的有意义产品楔子。
