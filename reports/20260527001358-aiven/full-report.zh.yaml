      - number: '5.5'
        title: 安全、合规与可靠性
        blocks:
          - type: paragraph
            body: >-
              Aiven 的合规组合覆盖五个主要框架——ISO 27001:2013、SOC 2 Type II、GDPR、HIPAA 和 PCI-DSS——这一点由其 ClickHouse
              产品文档确认，也在平台安全页面中反复出现。ISO 27001 和 SOC 2 适用于所有部署模型；标准层的 HIPAA 和 PCI-DSS 需要客户侧配置加密和访问控制，而 ECE 提供受控环境，由 Aiven
              承担合规态势的运营责任。


              在基础设施安全层，所有客户部署都运行在单租户 VPC 中，传输中数据使用 TLS 加密。操作员访问客户服务会通过控制平面记录审计日志。Aiven 通过 CLI 发布 SBOM（Software Bill of
              Materials）报告，支持供应链安全审查；随着企业采购团队在 CISA 和 EU Cyber Resilience Act 框架下要求 SBOM 证据，这项能力越来越重要。GitHub
              secret-scanning 合作则为不慎把 Aiven API keys 提交到源码仓库的客户，增加一层凭证泄露检测。平台安全概念页面记录了周期性渗透测试，但结果不对外发布。


              SLA 层级从 Free 和 Developer 方案没有正常运行时间保证，到 Startup、Business 和 Premium 方案提供 99.99% 月度正常运行时间；若经验证的停机超过 SLA
              阈值，服务积分为 30x。2026 年 5 月 changelog 确认平台仍在活跃开发（Terraform v4.56.0、Kafka Connect 的 AMQP connector、Valkey 9
              成为默认、OCI 区域扩展）；截至研究日，status.aiven.io 显示所有区域均正常运行。
