      - number: '1.2'
        title: 领导团队、治理与关键人风险
        blocks:
          - type: paragraph
            body: >-
              Aiven 由 Oskari Saarenmaa（CEO）、Heikki Nousiainen（联合创始人、现场 CTO）、Hannu Valtonen（联合创始人、前 CPO）和 Mika
              Eloranta（联合创始人、技术运营副总裁）共同创立。背景研究材料提到第五位联合创始人 Artur
              Tarkhanov，但在已审阅的任何一手公开来源中都无法核实——包括公司自己的关于页面、新闻稿、投资者档案或新闻报道——因此在公司直接确认前按未核实处理。从种子轮到 Series D
              的每次融资公告中，Saarenmaa 都是唯一持续公开代表公司发声的人，也是与领投方维系关系的主要负责人。


              截至 2026 年，Aiven 官方关于页面可见的现任高管包括 Cassio Sampaio（首席产品与技术官）、Kenneth Chen（首席财务官）、Conor Forde（首席营收官）、Katja
              Rantala（人力副总裁）、Ville Lehto（战略副总裁）和 Dimitri Casvigny（企业发展副总裁）。Salesforce Ventures 组合页面仍将 Heikki Nousiainen
              列为 CTO，将 Hannu Valtonen 列为 CPO，说明这些头衔在 2021 年 Series C 投资时更接近实际。Elena Zykova（合作伙伴副总裁）出现在 2025 年 4 月
              AlloyDB Omni 公告中。公司在 2022 年 11 月进行了一波高管任命——Katariina Korhonen（战略与运营副总裁）、Amy Krishnamohan（产品营销副总裁）、Ian
              Massingham（开发者关系副总裁）和 Jonah Kowall（产品管理副总裁）——说明 Series D 融资后公司有意补强管理梯队。


              治理细节符合一家私募风险投资支持的独角兽特征。Aiven 没有公开披露董事会构成、保留事项条款或清算优先权。投资者治理只能从参与模式推断：Eurazeo 领投 $3B Series D；Atomico 领投
              $100M Series C（其 Luca Eisenstecken 在 $100M ARR 博文中以董事会视角发声）；IVP 自 Series B 起共同领投或参与多轮融资。2023 年 1 月裁员伴随 CEO
              公开道歉，承认高管团队「犯了错误」——这是重要的坦诚信号，也说明 2021 至 2023 年间的战略资本配置把员工数推过了可持续水平。关键人风险偏高：所有一手来源中，Saarenmaa
              是唯一被点名的创始人，掌控公司叙事；若公司走向 2021 年公开讨论过的 IPO 路径，将高度依赖他的连续性。
