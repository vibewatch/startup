  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: >-
      Aiven 的公开记录显示，公司从 2016 年芬兰开源基础设施初创公司一路成长为 2022 年 5 月估值 $3B 的独角兽；2023 年经历裁员修正，随后在 2025 年 7 月达到 $100M ARR 里程碑，支撑点是
      BYOC、EverSQL AI 和 Google Cloud 合作伙伴关系。
    data:
      items:
        - date: '2016'
          label: 成立（Aiven Oy）
          detail: 赫尔辛基工程团队基于开源技术搭建托管云数据平台
          tone: positive
        - date: 2017-08
          label: 种子轮融资（$1M）
          detail: Lifeline Ventures 和 Business Finland 支持首个机构轮
          tone: positive
        - date: '2019'
          label: Series A 轮（~$10M，Earlybird）
          detail: Earlybird 领投；托管 PostgreSQL 和 Kafka 产品推进国际扩张
          tone: positive
        - date: 2020-01
          label: Series B 轮（~$40M，IVP）
          detail: IVP 领投；获得美国机构资本；团队在 COVID 时期云采用浪潮中扩张
          tone: positive
        - date: 2021-03
          label: Series C 轮（$100M，Atomico）— $800M 估值
          detail: Atomico 领投；Salesforce Ventures 和 WiL 跟投；公司称收入同比增长 100%+
          tone: positive
        - date: 2021-10
          label: Series C 延展轮（$60M）— $2B 独角兽
          detail: WiL 和 IVP 联合领投；700+ 客户；7 个月估值抬升 2.5x
          tone: positive
        - date: 2022-05
          label: Series D 轮（$210M，Eurazeo）— $3B 估值
          detail: Eurazeo 领投；BlackRock 加入；累计融资约 $420M；融资支持激进招聘
          tone: positive
        - date: 2023-01
          label: ~20% 员工裁减
          detail: CEO 道歉；裁撤约 100 名员工；收入运行率低于预期；高管团队承认判断失误
          tone: warning
        - date: 2023-05
          label: BYOC 发布
          detail: Bring Your Own Cloud；企业数据驻留；早期客户平均节省 30% 云成本
          tone: positive
        - date: 2023-11
          label: 收购 EverSQL
          detail: AI 驱动 SQL 优化；90 个国家 / 地区 100,000+ 用户；自举发展且盈利
          tone: positive
        - date: 2025-04
          label: Google Cloud 年度合作伙伴（数据库）
          detail: 因联合客户影响获认可；Priceline、ADEO、Mirakl 被列为胜利案例
          tone: positive
        - date: 2025-04
          label: Aiven for AlloyDB Omni GA 发布
          detail: 首个 Google Cloud 联合产品；PostgreSQL AI 向量搜索覆盖所有主要云
          tone: positive
        - date: 2025-07
          label: $100M ARR 里程碑
          detail: 公司公告；PostgreSQL、Kafka、OpenSearch、ClickHouse 为四大支柱服务
          tone: positive
        - date: 2026-03
          label: ~$109M ARR（ARR Club 估计）
