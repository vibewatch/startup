      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              Aiven CEO Oskari Saarenmaa 在 2023 年 1
              月把主要买方描述为「数字原生中端市场」——这些公司建立在云原生架构之上，需要开源数据库基础设施，但不愿全栈押注某一家超大规模云厂商。这个框架与结构性需求信号吻合：56% 的组织跨多个云厂商运行工作负载（CNCF
              2023），每个组织平均使用 2.3 家云厂商，66% 已在生产中使用 Kubernetes。中端市场工程团队选择
              Aiven，通常因为：（a）他们需要跨两个或更多云的可移植性；（b）他们希望保持与上游开源项目一致，而不是使用被超大规模云厂商修改过的 fork；（c）相较 DIY Kubernetes
              operators，他们更看重 Aiven 的开发者体验层（统一控制台、Terraform provider、可观测性）。


              这一分层中的预算负责人通常是工程副总裁或平台工程负责人，每年数据库支出在 $50,000–$500,000 区间。中端市场公司里，买方（评估并选择的人）和用户（日常运营的人）往往是同一个人——平台工程师或
              SRE。付款方是公司，合同通过云市场（AWS Marketplace、GCP Marketplace）或 Aiven 直接订阅完成。


              第二个结构上不同的分层，是寻求数据主权的受监管企业。Aiven 的 Bring Your Own Cloud（BYOC）模式于 2023 年推出，并在 Aiven 自有新闻稿中称可平均节省 30%
              云成本；该模式直接瞄准那些因监管或合同限制而无法让数据经过第三方云账户的企业。在 BYOC 中，Aiven 控制平面负责管理运营，数据留在客户自己的云账户中。该分层的预算负责人是 CTO 或
              CIO；采用触发点是合规审计、数据驻留审查失败，或一份与 Aiven 管理层叠加后能产生成本节省的已谈妥云合同。


              第三个分层，是使用 Aiven 免费层或开发者计划价格的开发者与早期初创公司。这个分层主要是漏斗：买方和用户是创始工程团队，价格敏感度高，采用触发点要么是 PostgreSQL 兼容性（Aiven
              最受欢迎的托管服务），要么是面向事件驱动架构的 Kafka 托管服务。Aiven 的开源可信度（通过「默认开源」定位展示）以及 2025 年 Google Cloud
              年度合作伙伴认可，强化了该分层中的开发者信任。
