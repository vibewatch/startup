        - 开发 / 测试；SaaS 平台；AI 原生应用构建者
        - Git 式 PostgreSQL 分支；缩至零；即时 fork/restore；开发者优先 UX
        - 仅 PostgreSQL；没有 Kafka/OpenSearch/ClickHouse；生产规模价格偏高
