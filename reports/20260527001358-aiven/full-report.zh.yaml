  - id: FM001
    title: 市场规模测算视角
    type: pyramid
    insight: >-
      Aiven 可触达机会只是更广义云数据库 TAM 中窄但快速增长的一块。$68.5B TAM 夸大了单一厂商机会；多云托管开源数据服务的 $8–12B SAM 才是可辩护边界。Aiven 2026 年 3 月估计 ARR 约
      $109M，不到 SAM 中点的 2%，说明市场渗透仍很早、上行空间可观。
    claimRefs:
      - CM001
      - CM003
      - CM007
      - CM031
    data:
      items:
        - label: 云数据库 TAM（2026）
          value: $68.5B
          detail: 全球云数据库和 DBaaS 市场（Valuates Reports，经 Datamation 引用）；包含全球所有超大规模云厂商原生、自研和开源托管数据库。
        - label: 多云开源 SAM（2026 年估计）
          value: $8–12B
          detail: 多云托管开源数据服务的估计可服务市场；按 TAM 的 15–18% 份额推导。未经独立分析师报告验证——仅为方向性估计。
        - label: Aiven 5 年可触达 SOM（~2026–2031）
          value: $0.3–0.5B
          detail: Aiven 5 年内可触达市场份额，基于当前 ~$109M ARR 轨迹，并假设 20–25% CAGR，与 Confluent 已观察增长率一致。
  - id: FM002
    title: 市场估计区间
    type: range
    insight: >-
      云数据库支出估计因口径和方法不同而差异很大：从 $57.5B（MarketsandMarkets，DBaaS 专项，2028）到 $68.5B（Valuates，更宽口径，2026）。多云开源数据服务 SAM 估计为
      $8–12B；由于份额假设未经验证，区间跨度达 $4B。这些区间应被理解为量级信号（个位数到低双位数十亿美元 SAM），而非精确数字。
