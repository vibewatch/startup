      - number: '5.3'
        title: DevOps 工具链与集成
        blocks:
          - type: paragraph
            body: >-
              Aiven 的基础设施即代码和自动化界面由五个主要工具组成：REST API、Terraform provider、Kubernetes operator、Python CLI，以及用于 AI agent 集成的
              MCP server。REST API（api.aiven.io/v1）以编程方式暴露所有平台操作，也是其他所有工具的基础。Terraform
              provider（github.com/aiven/terraform-provider-aiven）用 Go 编写，采用 MIT 许可证；2026 年 5 月发布的 4.56.0 版本为所有服务加入
              Customer-Managed Key（CMK / BYOK）支持。对于有数据主权要求的企业，这是重要安全能力。截至 131 个 GitHub stars 和 79 个 forks，该 provider
              功能可用，但开源关注度小于 Confluent 或 Elastic 的同类 provider。


              Kubernetes operator（github.com/aiven/aiven-operator）采用 Apache 2.0 许可证，使用 aiven.io/v1alpha1 CRD group，并可通过
              Helm 安装。其 Docker 镜像（aivenoy/aiven-operator）在 Docker Hub 上累计拉取超过 10,000 次；尽管 GitHub stars 只有 36
              个，这仍显示出有意义的生产采用。Python CLI（avn）采用 Apache 2.0 许可证，拥有 92 个 stars。MCP server 让 AI agent 框架能够以编程方式开通和管理 Aiven
              服务；官方文档警告部分 MCP 操作不可逆，这是对基础设施智能体自动化的标准提醒。
