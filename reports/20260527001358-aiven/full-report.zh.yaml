  - id: TV006
    title: 最终尽调要求——任何投资承诺前的最低条件
    columns:
      - 议题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 毛利率与单位经济
        - 按服务类型（Kafka、PostgreSQL、ClickHouse、BYOC 与标准模式）拆分的混合毛利率瀑布；收入成本拆解；BYOC 费用收入与平台成本
        - 没有毛利率，就无法确定估值上限；估计 55–65% 低于上市可比公司 10–20 个百分点，限制可实现退出倍数；BYOC 毛利率改善逻辑无法验证
        - 数据室：经审计 FY2023–FY2025 P&L，含收入成本明细；管理层材料；CFO 访谈
      - - NRR 与队列留存
        - 至少 6 个队列按季度列示净收入留存率和总收入留存率；客户数流失率；扩张 ARR 与新增 ARR 拆解
        - 110–125% 的 NRR 估计完全未验证；若 NRR 低于 100%，增长叙事坍塌；若 NRR 高于 120%，投资逻辑显著增强，可比公司更接近 MongoDB
        - 数据室：按季度 NRR 明细；队列瀑布；按客户批次导出的 CRM ARR
      - - 资本充足性与现金跑道
        - 截至 2025 年 12 月 / 2026 年 3 月的经审计或董事会批准现金余额；过去 6 个月烧钱速度；债务额度；EverSQL 收购价格与结构
        - 4 年融资空窗带来现金跑道不确定性；方向性分析显示 Series D 后可能剩余 $130–162M，但此后最长可能已烧钱 40 个月
        - 数据室：银行流水或董事会批准资产负债表；CFO 就现金跑道和融资选项访谈；确认没有未披露负债
      - - 股权结构表与优先权堆叠
        - 经认证股权结构表，列明所有股东、股份类别、各轮清算优先权、反稀释条款，以及管理层期权池已发行和已归属情况
        - $420M 累计融资造成复杂优先权悬顶；没有股权结构表，就无法建模退出瀑布回报；反稀释条款可能在降估值轮显著稀释新投资人
        - 公司法律顾问；数据室：经认证股权结构表，含优先权瀑布模型；投资人权利协议法律审查
      - - ARR 定义与对账
        - ARR 方法说明，解释纳入范围（BYOC 平台费？年化 MRR？合同 ARR 与运行率 ARR？）；$48.7M（GetLatka）、$109M（ARR Club）与公司「>$100M」的对账
        - GetLatka 与 ARR Club 的 $60M 差异代表 124% 差距；若 GetLatka 反映真实合同 ARR、ARR Club 反映运行率 ARR，底层业务质量将明显不同
        - 管理层访谈；数据室：ARR 方法文件；董事会报告指标，展示 ARR 定义和计算
      - - 战略退出管线
        - 是否已授予投行委任或启动并购对话；董事会层面的退出策略；已收到的任何 LOI 或条款清单
        - IBM-Confluent 交易已交割；剩余战略收购方范围更窄；不了解管线状态，就无法确定基准情景中的退出概率权重
        - 管理层访谈（保密）；董事会层面战略会；Eurazeo 或 IVP 投资者关系联系人
    notes: 尽调要求反映任何估值下作出投资承诺前所需的最低证据。其他要求（产品路线图、客户访谈、技术架构审查）同样有价值，但不直接阻断估值决策。
