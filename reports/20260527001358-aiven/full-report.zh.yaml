      - number: '5.4'
        title: Inkless Kafka 与技术差异化
        blocks:
          - type: paragraph
            body: >-
              Inkless Kafka 是 Aiven 迄今交付的最具技术野心功能，也是它最清晰的上游社区领导力主张。该架构用对象存储（S3-equivalent）取代 Kafka 传统基于磁盘的日志存储，完全去掉
              broker 磁盘。Aiven 通过 KIP-1150（Diskless Topics）提出这一设计，并在 GitHub 上名为「Inkless」的开放 fork 中实现。2026 年 3 月 2
              日，Apache Kafka PMC 以 9 张约束性赞成票接受 KIP-1150，正式把无磁盘模型纳入 Apache Kafka 路线图——这是上游社区对 Aiven 技术方向一次罕见且重要的验证。


              Aiven 发布的 1 GiB/s 工作负载基准显示，相较经典基于磁盘的 Kafka，基础设施成本降低超过 94%，吞吐量相当。延迟代价很实质：Inkless Kafka 的 P50 端到端延迟约 650
              milliseconds，P99 约 1.5 seconds——比经典 Kafka 低于 20 ms 的 P99
              高出一个数量级。对于大规模事件摄取、日志聚合、点击流分析等吞吐导向工作负载，这个取舍具备商业可行性。对于支付授权、实时欺诈检测等延迟敏感工作负载，则不可行。


              独立技术评审提出了三点进一步担忧。第一，KIP-1163（segment lifecycle management）尚未被接受；该提案原本要解决 compaction 期间 leader 故障后 orphaned
              segment 风险，当前设计仍留有边缘场景的数据可用性暴露。第二，事务 producer 路径中的 Exactly-Once Semantics（EOS）实现与经典 Kafka
              存在架构差异，评审者认为其在高吞吐事务工作负载下测试不足。第三，截至 2025 年 Q1，一位 InfoQ 技术分析师称该实现「尚未达到生产硬化」；到 2026 年 5 月这个标签可能已变化，但 Aiven
              文档没有公开反驳。
