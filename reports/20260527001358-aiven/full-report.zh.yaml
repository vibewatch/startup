      - number: '5.6'
        title: 图表
        blocks:
          - type: callout
            title: KIP-1150 被接受，验证 Aiven 的开源架构策略
            body: >-
              2026 年 3 月 2 日，Apache Kafka PMC 以 9 张约束性赞成票接受 KIP-1150（Diskless Topics），这是商业厂商成功把一项基础架构级改动推进 Apache
              项目的罕见案例。Aiven 在社区接受前提出方案、做出原型并开源实现，展示了技术深度和真正的上游优先路径。Aiven 因此有机会成为托管服务市场中 Inkless Kafka
              的参考实现，创造比功能平价或价格更难防守的持久差异化。>94% 的基础设施成本降低主张虽然取决于工作负载类型，但截至 2026 年中，这是托管 Kafka 市场最有说服力的成本故事。
            calloutType: strength
            claimRefs:
              - CE023
              - CE024
              - CE025
          - type: callout
            title: Inkless Kafka P99 延迟和生产硬化缺口限制可服务市场
            body: >-
              Aiven 自己的基准确认、独立 InfoQ 分析也佐证：Inkless Kafka 的 P99 端到端延迟约 1.5
              seconds。这使该服务无法承载支付处理、实时欺诈检测、交互式用户应用等延迟敏感生产工作负载。KIP-1163（segment lifecycle management）尚未被接受，意味着 log
              compaction 期间 leader failover 后的 orphaned-segment 风险，在已接受设计中仍没有正式解决。独立评审者截至 2025 年 Q1 认为该实现尚未完成生产硬化。Aiven
              没有发布公开声明反驳这一判断。除非 Inkless Kafka 在高风险工作负载上取得经验证的生产履历，否则它仍将是部分 Kafka 用例的成本优化工具，而非 Classic Kafka 的通用替代品。
            calloutType: risk
            claimRefs:
              - CE026
              - CE037
              - CE038
              - CE039
          - type: callout
            title: CMK / BYOK 已 GA；尽调中需验证密钥管理架构
            body: >-
              2026 年 5 月发布的 Terraform provider v4.56.0，为所有 Aiven 服务加入 Customer-Managed Key（CMK /
              BYOK）支持，补上了一个曾阻碍受监管金融服务和政府客户的缺口；这些客户要求掌控加密密钥。评估 Aiven 是否适合数据主权敏感工作负载的尽调团队，应验证密钥管理架构：支持哪些 KMS
              providers、密钥能否在不中断服务的情况下轮换、密钥吊销是否会立即导致数据不可访问。验证方式可以是要求 Aiven 提供 CMK 实现文档，或在概念验证环境中直接测试。CMK
              功能可用范围并不以同样方式延伸到 BYOC；需要明确确认适用范围。
            calloutType: recommendation
            claimRefs:
              - CE018
              - CE041
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与市场分段
        blocks:
          - type: paragraph
            body: >-
              Aiven 自称客户群体是覆盖 60+ 个国家的「全球数千家」，这一数字在 2025–2026 年官方材料中反复出现。公司自 2021 年 10 月 Series C（$60 M，估值 $2 B）时引用 700
              个客户后，就没有发布过具体客户数；到 2022 年末，「数千家」已被用于对外描述，并一直沿用到 2026 年中。Aiven 称其服务范围从「创业公司到 Fortune 500
              企业」，这一表述大体准确，且能被市场两端的具名 logo 佐证：Hookdeck（早期创业公司）和 Avaya（拥有 6 M 个联系中心席位的 Fortune 级企业）出现在同一个案例库中。


              从已发布案例库中可以识别出五类客户。企业技术供应商（WalkMe、Sophos、Avaya、Claroty）贡献了最大且最愿意发声的案例，BYOC 部署帮助这些客户满足受监管数据合规和成本归责。B2C
              电商与交易平台运营商（La Redoute、Back Market、Mirakl、BLUME2000）构成第二类，通常用 Kafka 跑事件驱动的库存、订单和定价管道。支付和金融科技公司（Dojo、GoTo
              Financial）构成第三类，被 Aiven 的多云能力和 Kafka 吞吐保障吸引。政府和公共部门组织（NAV Norway）构成第四类，BYOC 的数据驻留和主权保证是核心购买驱动。开发者平台和 SaaS
              基础设施公司（Hookdeck、Katana、Simplilearn）构成第五类，通常用 Aiven 快速整合基础设施，而非单纯做成本优化。


              行业多元性相较单一服务同行是优势：Aiven 能在一个平台上提供 Kafka、PostgreSQL、OpenSearch、ClickHouse 和
              Grafana，因此可以随着客户数据架构成熟而继续扩张，而不是在客户需求超出流式处理后被替换。
