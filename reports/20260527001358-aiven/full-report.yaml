      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: |
              Aiven CEO Oskari Saarenmaa characterized the primary buyer as the "digital native mid-market"
              in January 2023—companies built on cloud-native architectures that need open-source database
              infrastructure without the full-stack commitment of a hyperscaler. This framing matches the
              structural demand signal: 56% of organizations run workloads across multiple cloud providers
              (CNCF 2023), averaging 2.3 providers per organization, and 66% have Kubernetes in production.
              A mid-market engineering team choosing Aiven is typically doing so because (a) they need
              portability across two or more clouds, (b) they want fidelity to the upstream open-source
              project rather than a hyperscaler-modified fork, and (c) they value Aiven's developer
              experience layer (unified console, Terraform provider, observability) over DIY Kubernetes
              operators.

              The budget owner in this segment is typically the VP of Engineering or Platform Engineering
              lead, with a database spend in the $50,000–$500,000 per year range. The buyer (who evaluates
              and selects) and the user (who operates daily) are often the same person in mid-market
              companies—a platform engineer or SRE. The payer is the company through a cloud marketplace
              contract (AWS Marketplace, GCP Marketplace) or direct Aiven subscription.

              A second structurally distinct segment is the regulated enterprise seeking data sovereignty.
              Aiven's Bring Your Own Cloud (BYOC) model—launched in 2023 and reported by Aiven's own
              press release to yield an average of 30% cloud cost savings—directly targets enterprises
              that cannot route data through a third-party cloud account due to regulatory or contractual
              constraints. In BYOC, Aiven's control plane manages operations while data remains in the
              customer's own cloud account. The budget owner in this segment is the CTO or CIO; the
              adoption trigger is a compliance audit, a failed data-residency review, or a negotiated
              cloud contract that generates cost savings when paired with Aiven's management layer.

              A third segment is the developer or early-stage startup accessing Aiven's free tier or
              developer-plan pricing. This segment is primarily a funnel: the buyer and user are the
              founding engineering team, price sensitivity is high, and the adoption trigger is either
              PostgreSQL compatibility (Aiven's most popular managed service) or Kafka-as-a-service
              for event-driven architectures. Aiven's open-source credibility (demonstrated by its
              "Open Source by Default" positioning) and its recognition as 2025 Google Cloud Partner
              of the Year strengthen developer trust in this segment.
            claimRefs:
              - CM017
              - CM018
              - CM019
