    rows:
      - - AWS RDS / Aurora / MSK / OpenSearch
        - Hyperscaler managed DBaaS
        - AWS parent (public, ~$110B+ services revenue FY2025)
        - All segments, single-cloud AWS customers
        - Distribution lock-in, Aurora 99.999% multi-Region, MSK Express 3x throughput
        - Single-cloud; proprietary Aurora engine fork; no multi-cloud portability
      - - Google Cloud SQL / AlloyDB / Pub/Sub
        - Hyperscaler managed DBaaS
        - GCP parent (public)
        - GCP-first enterprises; AI workload seekers
        - AlloyDB drop-in PostgreSQL replacement; GCP AI integration (Vertex, BigQuery)
        - Single-cloud; no multi-cloud portability for AlloyDB
      - - Azure Database for PostgreSQL / Event Hubs
        - Hyperscaler managed DBaaS
        - Azure parent (public)
        - Enterprise Microsoft shops; regulated industries
        - 58% lower TCO vs on-prem; Event Hubs Kafka compatibility; 60+ regions; HIPAA/PCI/FedRAMP
        - Single-cloud; Microsoft ecosystem lock-in
      - - Confluent Cloud
        - OSS-native managed (event streaming)
        - '$1.167B FY2025 revenue (21% YoY); NASDAQ: CFLT'
        - Enterprise Kafka users; financial services, retail, telecom
        - Kora engine (10x faster scaling); 120+ connectors; governance suite; $1B+ ARR scale
        - Single-category (Kafka/Flink); no managed PostgreSQL/NoSQL/search
      - - MongoDB Atlas
        - OSS-native managed (document/NoSQL + search + analytics)
        - '50,000+ customers; 70% Fortune 100; NASDAQ: MDB'
        - App developers; enterprise builders; AI/ML teams
        - Unified operational+search+analytics+streaming platform; $1B+ revenue scale
        - Proprietary document model; no managed PostgreSQL wire protocol; no Kafka/OpenSearch breadth
      - - Elastic Cloud
        - OSS-native managed (search / observability)
        - '$1.483B FY2025 revenue (17% YoY); NYSE: ESTC'
