  - id: FV004
    title: Investment Scorecard — Aiven IC-Ready Scoring Across Key Dimensions (May 2026)
    type: kpi
    layout: standard
    summary: >-
      IC-ready scoring across eight dimensions. Market and revenue proof score highest; valuation discipline and
      evidence quality score lowest, reflecting the stale $3B mark and complete absence of financial disclosure.
    data:
      items:
        - label: Market Opportunity
          value: 3 / 5
          detail: >-
            Strong $8–12B SAM, 20–25% CAGR; contested by hyperscalers via billing integration; durable multi-cloud
            demand validates segment
          tone: neutral
        - label: Revenue Proof
          value: 4 / 5
          detail: >-
            $109M ARR (company-confirmed >$100M July 2025); multi-service expansion confirmed; BYOC enterprise traction
            demonstrated via customer case studies
          tone: positive
        - label: Product and Technology Moat
          value: 3 / 5
          detail: >-
            11-service multi-cloud platform with BYOC is unique breadth advantage; EverSQL AI early differentiator; no
            proprietary engine to anchor defensibility against specialists
          tone: neutral
        - label: Unit Economics and Margins
          value: 2 / 5
          detail: >-
            Gross margin estimated 55–65%; NRR entirely undisclosed; below public comp range of 71–80%; BYOC improvement
            path is plausible but unverified
          tone: warning
        - label: Capital Efficiency and Runway
          value: 2 / 5
          detail: >-
            4-year funding gap from May 2022; no public cash balance; rough runway analysis suggests possible near-term
            capital need; operating profitability unconfirmed
          tone: warning
        - label: Competitive Positioning
          value: 2 / 5
          detail: >-
            IBM-Confluent removes best M&A comp; hyperscaler billing integration is structural disadvantage; ClickHouse
            $15B shows specialists command higher multiples; no disclosed win-rate data
          tone: warning
        - label: Valuation Discipline
          value: 1 / 5
          detail: >-
            Stale $3B (27.5x ARR) has zero support in 2026 public or private comp set; 3–9x above defensible range; all
            return scenarios negative from current mark entry
          tone: warning
        - label: Evidence Quality
          value: 2 / 5
          detail: >-
            No audit, no financial disclosure, no NRR, no cap table available in public sources; ARR from third-party
            estimate; 4-year-old valuation mark; diligence from public sources only
          tone: warning
    approximationNotes: >-
      Scores are qualitative (1=very weak, 5=very strong). All dimensions based on public-source evidence only.
      Financial metrics (GM, NRR, runway) are analyst estimates; scores would change materially with data room access.
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV020
      - CV022
      - CV026
      - CV032
      - CV042
