      - number: '1.2'
        title: Leadership, Governance, and Key-Person Risk
        blocks:
          - type: paragraph
            body: >-
              Aiven was co-founded by Oskari Saarenmaa (CEO), Heikki Nousiainen (co-founder, field CTO), Hannu Valtonen
              (co-founder, former CPO), and Mika Eloranta (co-founder, VP Technical Operations). A fifth co-founder,
              Artur Tarkhanov, was cited in background research materials but could not be corroborated in any primary
              public source reviewed — including the company's own about page, press releases, investor profiles, or
              news coverage — and is treated as unverified pending direct company confirmation. Saarenmaa has been the
              sole consistent public face of the company across every funding announcement from seed through Series D
              and is the primary relationship holder with lead investors.


              As of 2026, the current executive team visible on Aiven's official about page includes Cassio Sampaio
              (Chief Product and Technology Officer), Kenneth Chen (Chief Financial Officer), Conor Forde (Chief Revenue
              Officer), Katja Rantala (VP People), Ville Lehto (VP Strategy), and Dimitri Casvigny (VP Corporate
              Development). The Salesforce Ventures portfolio page still lists Heikki Nousiainen as CTO and Hannu
              Valtonen as CPO, suggesting those titles were more current at the time of the Series C investment (2021).
              An Elena Zykova (VP Partnerships) appeared in the April 2025 AlloyDB Omni announcement. The company made a
              wave of senior appointments in November 2022 — Katariina Korhonen (VP Strategy & Operations), Amy
              Krishnamohan (VP Product Marketing), Ian Massingham (VP Developer Relations), and Jonah Kowall (VP Product
              Management) — indicating deliberate bench-building following the Series D capital raise.


              Governance details are consistent with a private venture-backed unicorn. Aiven has not disclosed board
              composition, reserved-matter provisions, or liquidation preferences publicly. Investor governance is
              inferred from participation patterns: Eurazeo led the $3B Series D, Atomico led the $100M Series C (and
              its Luca Eisenstecken cited a board-level perspective in the $100M ARR blog post), and IVP has co-led or
              participated in rounds since Series B. The January 2023 layoff event was accompanied by a public CEO
              apology acknowledging that the executive team had "made mistakes" — a material candor signal but also an
              indicator that strategic capital allocation between 2021 and 2023 overshot sustainable headcount.
              Key-person risk is elevated: Saarenmaa is the sole named founder across all primary sources, controls
              company narrative, and an IPO path (discussed publicly in 2021) would depend heavily on his continuity.
