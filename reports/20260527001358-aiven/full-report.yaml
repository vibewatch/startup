      - number: '4.2'
        title: Unit Economics, Cost Structure, and Gross Margin Proxies
        blocks:
          - type: paragraph
            body: >-
              Aiven does not disclose gross margin, cost of revenue, operating expenses, or any SaaS efficiency metric
              publicly. The company is a private Finnish corporation with no statutory obligation to publish
              consolidated financial statements at the group level (Finnish limited liability companies — Oy — file
              accounts with the Finnish Trade Register, but small and medium entities can file abbreviated formats).
              Accordingly, all cost and margin figures in this section are analyst estimates derived from public
              analogues and structural inference.


              The primary cost driver for Aiven's standard (non-BYOC) delivery model is cloud infrastructure. Aiven
              purchases compute, storage, and network capacity from AWS, Google Cloud, and Azure at enterprise rates,
              bundles in platform operations and support, and re-sells to customers at a markup. The markup determines
              gross margin. At Aiven's scale (~$109M ARR), the cloud infrastructure cost share is estimated at 35–45% of
              revenue. This estimate is derived by comparison with Confluent, which disclosed ~65% gross margin when it
              was at ~$586M revenue (FY2022); at comparable earlier scale (under $200M ARR), infrastructure-heavy
              managed-service providers typically show 50–60% gross margins, reflecting less purchasing leverage with
              cloud providers. As revenue scales and Aiven negotiates better committed-use discounts, margin improvement
              is structurally plausible — exactly the trajectory Confluent demonstrated (from the low-60s at $400M
              revenue toward 74%+ at $1.17B revenue in FY2025).


              Elastic's FY2025 gross margin of 74.4% ($1.103B gross profit on $1.483B revenue) provides a second data
              point for the upper end of the peer range, though Elastic's business is predominantly software licensing
              and SaaS with a lower infrastructure pass-through than Aiven's fully managed model. The appropriate gross
              margin benchmark for Aiven at current scale is likely Confluent's range circa FY2022–2023 (65–68%), with
              Aiven potentially at 55–65% given smaller scale and a higher proportion of hosting-intensive services like
              Apache Kafka® (which requires significant broker compute for high-throughput workloads).


              Headcount is the second major cost driver. At an estimated 300–350 full-time employees post-2023
              restructuring, and using an all-in fully-loaded cost of $100,000–$150,000 per employee per year
