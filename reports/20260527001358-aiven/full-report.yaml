      - number: '2.2'
        title: Market Sizing Lenses
        blocks:
          - type: paragraph
            body: |
              No single authoritative estimate sizes the multi-cloud managed open-source data services
              market in isolation; three independent lenses are used to triangulate the 2026 SAM.

              Lens 1 — Top-down TAM, then haircut: The global cloud database and DBaaS TAM is projected
              at $68.5 billion by 2026 at a CAGR of 38.2% (Valuates Reports via Datamation). MarketsandMarkets
              separately estimates the same category at $57.5 billion by 2028 at a CAGR of 22%. The two
              estimates differ in scope and methodology; the Valuates figure is the more cited but may include
              broader data-management tooling. Applying a 15–18% share for multi-cloud, open-source-only
              managed services yields a SAM of approximately $8–12 billion in 2026. This derivation is
              approximated; no analyst report cleanly isolates the multi-cloud open-source subset.

              Lens 2 — Bottom-up public-company proxy: Confluent (managed Apache Kafka and Flink) reported
              FY2025 (calendar year 2025) revenue of $1.167 billion, growing at 21% year-over-year, with
              a 5.2% free cash flow margin. Elastic (search/observability, adjacent to Aiven's OpenSearch
              offering) reported FY2025 (April 2025) revenue of $1.483 billion, growing at 17% year-over-year,
              with a 17.7% FCF margin. Together, just two adjacent open-source managed-service vendors
              generate approximately $2.65 billion annually in the event-streaming and search subsegments.
              Aiven's portfolio spans both subsegments plus relational and NoSQL databases, placing the
              multi-category SAM well above the $3–4 billion implied by these two proxies alone.

              Lens 3 — Developer-adoption proxy: PostgreSQL adoption rose from 33% of developers in 2018
              to 49% in 2024 (Stack Overflow Developer Survey), making it the most popular database for
              the second consecutive year. DB-Engines ranks PostgreSQL in the global top three by usage
              score (May 2026). The shift in developer preference toward open-source databases is a
              leading indicator of managed-service demand: as more developers write new workloads against
              PostgreSQL, Kafka, and OpenSearch, the demand for managed versions of those workloads grows.
              This demand-side signal supports a SAM growth rate of 20–30% annually through 2026,
              consistent with Confluent's observed 21% growth.

              The $8–12 billion SAM estimate for 2026 should be treated as approximate. The top-down
              derivation assumes 15–18% multi-cloud open-source share, which is unverified by any analyst
              report. The bottom-up proxy understates the full category because Confluent and Elastic
              address only two of Aiven's six database families. Both lenses are included with their
              limitations preserved in the evidence gaps section.
