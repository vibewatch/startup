      - number: '3.2'
        title: Hyperscaler Competitive Pressure
        blocks:
          - type: paragraph
            body: >-
              The three hyperscalers represent the single largest competitive threat to Aiven's core revenue base. Their
              managed database services — AWS RDS/Aurora/MSK/OpenSearch, Google Cloud SQL/AlloyDB/Pub Sub, Azure
              Database/Event Hubs — bundle open-source-compatible engines into billing frameworks that buyers are
              already paying. A customer on AWS with committed spend toward credits can adopt Amazon RDS for PostgreSQL
              with zero incremental contract negotiation, which is a structural distribution advantage Aiven cannot
              replicate through go-to-market alone.


              AWS leads the competitive pressure dimension. Amazon RDS offers eight database engines with on-demand and
              Reserved Instance (1- and 3-year) pricing options. Amazon Aurora — positioned as the flagship PostgreSQL
              and MySQL managed engine — claims 5x the throughput of MySQL and 3x of PostgreSQL, with up to 99.999%
              multi-Region availability and the DSQL distributed SQL option for virtually unlimited horizontal scale.
              Amazon MSK (Managed Streaming for Apache Kafka) competes directly with Aiven for Apache Kafka: MSK Express
              brokers offer up to 3x more throughput per broker, 20x faster scaling, 90% quicker recovery, and 5x more
              partitions versus standard Kafka brokers, with a claimed 50% improvement in price-performance for
              partition-bound workloads. Amazon OpenSearch Service competes with Aiven for OpenSearch, adding RAG and
              vector search capabilities, zero-ETL integrations with CloudWatch Logs, DynamoDB, and Security Lake, and
              integration with Amazon Bedrock and SageMaker for AI model hosting.


              Google Cloud presents a nuanced threat. Google Cloud SQL covers MySQL, PostgreSQL, and SQL Server with
              Enterprise Plus editions providing a 99.99% SLA, near-zero downtime maintenance, and intelligent data
              caching. AlloyDB is specifically positioned as a drop-in PostgreSQL replacement with a 30-day free trial
              and the AlloyDB Omni downloadable version (a key signal of Google's hybrid-cloud ambition). Aiven's April
              2025 AlloyDB Omni partnership announcement — becoming an authorized provider of AlloyDB Omni-based managed
              services — is an attempt to co-opt rather than resist this competitive threat. Azure Database for
              PostgreSQL claims 58% lower TCO versus on-premises PostgreSQL, 99.99% SLA, and 60+ regions with 450+ core
              PostgreSQL commits, signaling Microsoft's commitment to open-source credibility. Azure Event Hubs provides
              Kafka-protocol compatibility with enterprise compliance coverage across CSA STAR, ISO, SOC, GxP, HIPAA,
              HITRUST, and PCI certifications.


              The hyperscaler competitive dynamic creates two distinct buyer cohorts that Aiven must navigate.
              Single-cloud customers who already have AWS/GCP/Azure committed spend face a switching cost to adopt
              Aiven: they gain multi-cloud portability but lose billing consolidation and platform-native integrations.
              Multi-cloud or cloud-sovereign buyers — particularly in regulated industries requiring data residency
              across two or more clouds — find Aiven's value proposition directly compelling. Aiven's BYOC offering
              (services running inside the customer's own cloud VPC) addresses the residency concern while preserving
              Aiven's management plane, enabling customers to combine existing cloud spend commitments with Aiven's
              managed operations layer.
