              Terraform provider v4.56.0 (released May 2026) added Customer-Managed Key (CMK / BYOK) support across all
              Aiven services, closing a gap that had been a blocker for regulated financial-services and government
              customers who require control over encryption keys. Diligence teams evaluating Aiven for
              data-sovereignty-sensitive workloads should verify the key management architecture (which KMS providers
              are supported, whether keys can be rotated without service disruption, and whether key revocation results
              in immediate data inaccessibility) by requesting Aiven's CMK implementation documentation or testing it
