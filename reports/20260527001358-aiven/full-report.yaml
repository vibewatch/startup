  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Mechanics
        blocks:
          - type: paragraph
            body: >-
              Aiven's revenue engine is a cloud-consumption-native subscription model. Customers pay a recurring monthly
              or annual fee that bundles three cost layers into a single price: (1) the underlying cloud provider's
              compute, storage, and network costs for the resources allocated to the customer's managed service; (2)
              Aiven's platform operations layer — provisioning, monitoring, patching, backups, failover, and 24/7 expert
              support; and (3) Aiven's margin on top of those costs. Unlike AWS or GCP managed services — where cloud
              costs and support are billed separately — Aiven competes on simplicity and cloud-neutral portability by
              folding all three into a predictable per-instance subscription price.


              Pricing is structured in five named tiers (Free, Developer, Startup, Business, Premium) with prices set
              per service per cloud region and billed by the hour. Apache Kafka® representative pricing on the pricing
              page illustrates the staircase: Free ($0, limited to max 30 days, single consumer, auto-expires),
              Developer ($35/month, $0.05/hr), Startup ($200/month, $0.27/hr), Business ($500/month, $0.69/hr), and
              Premium ($1,900/month, $2.60/hr). The structure follows a standard SaaS land-and-expand motion: developers
              discover Aiven via the Free tier, evaluate on Developer or Startup plans, and scale spending as their data
              infrastructure grows. Tiered storage add-ons are priced separately at $0.00012/GB/hour for paid plans,
              providing a consumption-based upsell on top of the base subscription.


              The BYOC (Bring Your Own Cloud) tier, launched May 2023, represents a structurally different revenue
              model. In BYOC, the customer's cloud account absorbs the underlying infrastructure cost — eliminating the
              cloud cost pass-through for those customers — while Aiven charges a platform management fee (amounts
              undisclosed) plus an enterprise support contract with a minimum monthly spend commitment. BYOC customers
              publicly disclosed include La Redoute (French retailer) and Supermetrics (marketing analytics); the Google
              Cloud partner press release also names Priceline, ADEO, and Mirakl as customer logos that have benefited
              from the Aiven-Google Cloud partnership. The company reported that early BYOC customers reduced overall
              cloud spend by an average of 30% versus standard hosted arrangements — a claim that serves double duty as
              a sales proof point and a signal that BYOC customers are relatively cloud-cost sensitive. From Aiven's
              perspective, BYOC shifts the gross margin structure for those customers since cloud infra costs no longer
              run through Aiven's P&L, potentially improving blended gross margin as BYOC penetration grows.


              Revenue recognition is straightforward for the subscription tiers (ratably over the service period) but
              may present timing differences for BYOC contracts, where minimum monthly spend commitments could create
              ratable recognition challenges if payments are structured annually. No external audit, filing, or
              management commentary on revenue recognition policies has been reviewed.
