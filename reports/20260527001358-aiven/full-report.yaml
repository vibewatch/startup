      - number: '5.4'
        title: Inkless Kafka and Technical Differentiation
        blocks:
          - type: paragraph
            body: >-
              Inkless Kafka is the most technically ambitious feature Aiven has shipped to date and its single clearest
              claim to upstream-community leadership. The architecture replaces Kafka's traditional disk-based log
              storage with object storage (S3-equivalent), eliminating broker disks entirely. Aiven proposed this design
              through KIP-1150 (Diskless Topics) and implemented it in an open fork named "Inkless" on GitHub. On March
              2, 2026, the Apache Kafka PMC accepted KIP-1150 with 9 binding votes, formally admitting the diskless
              model into the Apache Kafka roadmap — a rare and significant validation of Aiven's technical direction by
              the upstream community.


              Aiven's published benchmarks at a 1 GiB/s workload demonstrate greater than 94 percent infrastructure cost
              reduction versus classic disk-based Kafka, with equivalent throughput. The latency trade-off is material:
              Inkless Kafka's P50 end-to-end latency is approximately 650 milliseconds and P99 approximately 1.5 seconds
              — an order-of-magnitude increase versus classic Kafka's sub-20 ms P99. For throughput-oriented workloads
              such as large-scale event ingestion, log aggregation, and clickstream analytics, this trade-off is
              commercially viable. For latency-sensitive workloads such as payment authorisation or real-time fraud
              detection, it is not.


              Independent technical review raises three further concerns. First, KIP-1163 (segment lifecycle
              management), which would address orphaned segment risk after leader failures during compaction, has not
              yet been accepted, leaving an edge-case data-availability exposure in the current design. Second, the
              Exactly-Once Semantics (EOS) implementation in the transactional producer path has architectural
              differences from classic Kafka that reviewers have flagged as under-tested for high-throughput
              transactional workloads. Third, as of Q1 2025, the implementation was characterised as "not yet
              production-hardened" by an InfoQ technical analyst — a label that may have changed by May 2026 but has not
              been publicly contradicted by Aiven documentation.
            claimRefs:
              - CE023
              - CE024
              - CE025
              - CE026
              - CE027
              - CE037
              - CE038
              - CE039
