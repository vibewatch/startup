      - Timing
      - Implication for Aiven
      - Diligence Ask
    rows:
      - - PostgreSQL developer dominance (49% of developers)
        - Driver
        - Ongoing through 2026
        - Every new PostgreSQL workload is a potential Aiven buyer before hyperscaler lock-in occurs
        - Quantify Aiven's PostgreSQL ARR share vs. estimated total managed PostgreSQL market
      - - Multi-cloud adoption (56% of orgs, avg 2.3 providers)
        - Driver
        - Ongoing through 2026
        - Multi-cloud buyers are natural Aiven customers; single-cloud buyers require a migration trigger
        - What share of Aiven's customer base runs workloads across 2+ clouds simultaneously?
      - - Kubernetes production adoption (66% of orgs)
        - Driver / mixed
        - Ongoing through 2026
        - Normalizes cloud-native ops but also enables DIY DB management—a partial substitute for Aiven
        - How does Aiven differentiate against Helm-chart-based self-managed database operators on Kubernetes?
      - - Open-source license restrictions (ELv2, Redis SSPL)
        - Driver
        - Already materialized; ongoing displacement in 2026
        - Recurring managed-service buyer displacement; Aiven's open-source-by-default positioning benefits directly
        - Estimate buyer count displaced from Elastic Cloud and Redis managed services since 2021
      - - Hyperscaler managed database depth (AWS 7+ types, GCP 95% of top 100)
        - Constraint
        - Structural; 2026 and beyond
        - Dominant for single-cloud buyers; high switching cost unless multi-cloud is already mandated
        - What is Aiven's win rate in competitive deals against AWS RDS and Google Cloud SQL?
      - - Macro headwinds in developer-tools spending (2023 layoff cycle)
        - Constraint
        - 2022–2024 trough; partially recovering in 2026
        - Reduced buyer formation rate in primary segment; Aiven's 2023 workforce reduction reflects this
        - Is Aiven's net ARR growth recovering from the 2023 trough? What is net revenue retention (NRR)?
      - - Data sovereignty and BYOC demand (EU AI Act, GDPR enforcement)
