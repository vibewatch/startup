chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Aiven Oy — publicly branded as "Aiven" — is a global data platform company headquartered in Helsinki,
              Finland (Antinkatu 1, 6th floor, 00100 Helsinki). The company describes itself as an "AI-ready open source
              data platform" and maintains legal subsidiaries in Germany, Ireland, Israel (EverSQL Ltd), Portugal, the
              United Kingdom, and France, reflecting genuine global operations. Its copyright notice confirms the
              company has been operating since 2016.


              Aiven's core product is a fully managed, multi-cloud data infrastructure platform built entirely on
              popular open-source technologies. Rather than developing proprietary engines, Aiven takes community-owned
              software — PostgreSQL, Apache Kafka, OpenSearch, ClickHouse, Apache Flink, Apache Cassandra, MySQL,
              Grafana, Valkey (successor to Redis), and others — and delivers them as fully operational,
              enterprise-grade managed services with a 99.99% uptime SLA, automated backups, one-click provisioning, and
              24/7 expert support. Customers span AWS, Google Cloud, Microsoft Azure, DigitalOcean, and other clouds,
              and Aiven abstracts infrastructure complexity so developers can focus on application development rather
              than database administration. In May 2023, Aiven launched Bring Your Own Cloud (BYOC), allowing enterprise
              customers to deploy Aiven-managed services directly within their own AWS, GCP, or Azure accounts,
              leveraging existing cloud spend commitments while retaining data residency and security control. Early
              BYOC customers reported an average 30% reduction in cloud spend versus traditional managed-service
              arrangements.


              The business model is B2B SaaS. Revenue comes from monthly or annual subscription fees for managed service
              instances, priced by service type, cloud region, and resource tier. BYOC adds an enterprise tier requiring
              an enterprise support contract and minimum monthly spend. The November 2023 acquisition of EverSQL (an
              Israeli AI-powered database optimization startup) extended the platform with automated query tuning and
              index recommendations, available at no extra charge to existing Aiven PostgreSQL and MySQL subscribers,
              reinforcing a land-and-expand flywheel: customers adopt a core service, experience free AI optimization
              enhancements, and broaden to additional services. The company's $100M ARR milestone (July 2025) was
              underwritten by four flagship services: Aiven for PostgreSQL, Aiven for Apache Kafka, Aiven for
              OpenSearch, and Aiven for ClickHouse.
