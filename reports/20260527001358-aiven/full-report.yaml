          - type: callout
            title: Inkless Kafka P99 Latency and Production-Hardening Gap Limit Addressable Market
            body: >-
              Inkless Kafka's P99 end-to-end latency of approximately 1.5 seconds — confirmed in Aiven's own benchmarks
              and corroborated by independent InfoQ analysis — disqualifies the service from latency-sensitive
              production workloads including payment processing, real-time fraud detection, and interactive user-facing
              applications. The non-acceptance of KIP-1163 (segment lifecycle management) leaves an orphaned-segment
              risk after leader failover during log compaction that has not been formally resolved in the accepted
              design. Independent reviewers as of Q1 2025 characterised the implementation as not yet
              production-hardened. Aiven has not published a public statement contradicting this characterisation. Until
              Inkless Kafka achieves a verified production track record on high-stakes workloads, it will remain a
              cost-optimisation tool for a subset of Kafka use cases rather than a universal replacement for Classic
              Kafka.
