      - number: '6.5'
        title: Concentration Risk and Disclosure Gaps
        blocks:
          - type: paragraph
            body: >-
              Customer revenue concentration is entirely undisclosed. Aiven has not published a top-customer revenue
              percentage, a largest-logo ARR figure, or any segment-level revenue split. The composition of BYOC revenue
              relative to Standard-tier revenue is also undisclosed, though BYOC's management-fee model implies lower
              gross margin than Standard hosted deployments. If a small number of BYOC enterprise accounts represent a
              disproportionate share of ARR — which the size of the Sophos (79 clusters, 9 regions), Claroty, and WalkMe
              deployments suggests is plausible — then logo churn among BYOC customers could be materially dilutive to
              revenue.


              The 2023 layoff event provides a weak signal of demand shortfall but no quantification. The Register and
              Sifted both covered the layoffs, with The Register characterising Aiven as "the latest to apologise for
              making mass redundancies" in the January 2023 wave of tech sector workforce reductions. Aiven did not
              publish a customer-impact statement or retention data at the time of the reduction.


              Three additional disclosure gaps are relevant for diligence: (1) the customer count has not been updated
              beyond "thousands" since mid-2022; (2) the geographic breakdown of ARR is not disclosed; (3)
              vertical-market ARR splits are not disclosed. These gaps are consistent with Aiven's status as a private
              company not yet preparing for IPO disclosure-level transparency, but they mean that key valuation inputs
              (implied ARPU, NRR, geographic mix, cohort durability) must be estimated from case study triangulation
              rather than reported data.
            claimRefs:
              - CU033
              - CU041
              - CU042
              - CU043
              - CU044
