      - number: '1.3'
        title: Capital Structure and Funding History
        blocks:
          - type: paragraph
            body: >-
              Aiven has raised approximately $420M in total across six disclosed funding tranches through May 2022. The
              sequence begins with a $1M seed round in August 2017 from Lifeline Ventures (Helsinki) and Business
              Finland, followed by a $9–10M Series A in early 2019 led by Earlybird Venture Capital with Lifeline
              co-investing. A $40M Series B closed in January 2020 with IVP as lead, alongside Earlybird, Lifeline, and
              Molten Ventures (formerly Draper Esprit). Aiven then raised a $100M Series C in March 2021 led by Atomico
              at an $800M valuation, with Salesforce Ventures and World Innovation Lab participating. Only seven months
              later, in October 2021, existing investors WiL and IVP co-led a $60M Series C extension at a $2B valuation
              — a 2.5x step-up in under a year that reflected exceptional customer momentum (700 companies across 50
              countries) and more than 100% year-on-year revenue growth. The cumulative $160M Series C brought total
              capital to $210M. The Series D, announced May 10, 2022, added $210M at a $3B pre-money valuation, led by
              Eurazeo with BlackRock and IVP participating, pushing total raised to approximately $420M.


              GetLatka reports $419.9M raised; Tracxn reports $421M — the rounding difference is immaterial and both
              confirm the six-round arc ending with the May 2022 Series D. No funding round has been publicly announced
              between May 2022 and the run date of May 27, 2026 — a four-year gap that is notable for a company at this
              scale. Aiven's CEO stated publicly in October 2021 that an IPO was "the more likely choice" for exit, but
              no S-1 or IPO registration has been filed as of the run date.


              On the revenue side, Aiven surpassed $100M ARR in July 2025, confirmed through the company's own blog post
              authored by CEO Saarenmaa. The ARR Club's milestone tracker estimates ARR reached $109M by March 2026.
              GetLatka's separate estimate of $48.7M ARR appears to reflect either an earlier data vintage or a
              different revenue definition (total contract value vs. pure subscription ARR) and is given lower
              confidence here. The $3B Series D valuation implies a current ARR multiple of approximately 27–30x, which
              is high for 2026 private-market benchmarks and has not been corroborated by a more recent external round.
              Gross margin, NRR, and customer-level metrics remain entirely undisclosed.
