  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Taxonomy
        blocks:
          - type: paragraph
            body: >-
              Aiven competes across four overlapping tiers that buyers navigate when sourcing managed open-source
              database infrastructure. Understanding each tier is essential to assessing Aiven's positioning and moat
              durability.


              Tier 1 — Hyperscaler DBaaS: AWS, Google Cloud, and Microsoft Azure each offer managed versions of
              PostgreSQL, MySQL, Apache Kafka, OpenSearch/Elasticsearch, and other open-source engines as first-party
              services. Hyperscalers leverage embedded distribution (workloads already running in cloud) and deep
              platform integration (IAM, VPC, billing) to win deals where cloud consolidation is the buyer's priority.
              AWS alone offers eight managed database engines with multiple deployment models. Google Cloud SQL covers
              MySQL, PostgreSQL, and SQL Server with a 99.99% SLA on its Enterprise Plus edition, and its AlloyDB
              service is a drop-in PostgreSQL replacement claimed by at least one customer to reduce compute costs by
              40–50%. Azure Database for PostgreSQL offers a 99.99% SLA and claims 58% lower total cost of ownership
              versus on-premises PostgreSQL deployments. Azure Event Hubs provides Kafka-protocol compatibility with
              financial-services compliance certifications (CSA STAR, ISO, SOC, GxP, HIPAA, HITRUST, PCI). Hyperscalers'
              key limitation is single-cloud lock-in: buyers on AWS RDS for PostgreSQL cannot migrate seamlessly to
              Google Cloud SQL without re-provisioning and data migration, which is precisely the opening Aiven's
              multi-cloud portability exploits.


              Tier 2 — OSS-Native Managed Vendors: A growing set of purpose-built managed service providers focus on a
              single database family with deeper expertise. Confluent (data streaming / Kafka) reached $1.167B in FY2025
              revenue growing 21% year-over-year with its proprietary Kora cloud-native engine. MongoDB Atlas (document
              NoSQL) serves over 50,000 customers and 70% of the Fortune 100. ClickHouse Cloud (real-time analytics) was
              valued at $15B as of 2024 (reported by Reuters and cited on ClickHouse's news page). Neon (serverless
              PostgreSQL) uses copy-on-write branching and instant scale-to-zero. CockroachDB targets enterprise-grade
              distributed SQL with multi-region data domiciling. Redpanda (Kafka-compatible streaming) claims to run on
              3x fewer compute resources than Apache Kafka with 8–9x tiered storage savings. These vendors typically
              dominate within their category but require buyers to maintain separate vendor relationships for each
              database family.


              Tier 3 — Self-Managed Kubernetes Operators: Many platform engineering teams deploy open-source databases
              using Kubernetes operators (e.g., Strimzi for Kafka, CloudNativePG for PostgreSQL, OpenSearch Operator).
              This status-quo substitute trades operational burden for zero SaaS license cost and maximum configuration
              flexibility. The G2 DBaaS buyer research framework identifies support availability, high-availability
              architecture, compliance standards, and scaling capability as the top criteria buyers use to decide
              between managed services and self-managed deployments — areas where Aiven's 24/7 expert support and 99.99%
              SLA claim direct advantages over DIY.


              Tier 4 — Single-Service Specialists and Database-Specific Vendors: Instaclustr (now Spot by NetApp) offers
              managed Kafka, Cassandra, and OpenSearch with GDPR/SOC 2/ISO 27001/27018/PCI compliance and founding
              membership in the OpenSearch Foundation. Timescale offers TimescaleDB (PostgreSQL for time-series) with
              22,000+ GitHub stars and a Kubernetes Helm chart install path. Crunchy Bridge (Crunchy Data) offers
              managed PostgreSQL with cross-cloud replication, private networking (VPC peering, private link,
              Tailscale), and PostGIS/geospatial extensions. PlanetScale offers MySQL/Vitess as a managed service with
              schema branching and a BYOC enterprise option on AWS/GCP.
