  - id: FI001
    title: Aiven revenue model — cost layer bridge
    type: flow
    layout: standard
    summary: >-
      The subscription price bundles three stacked cost layers — cloud infrastructure pass-through, platform operations,
      and Aiven margin — with BYOC removing the infrastructure layer for enterprise customers and potentially improving
      blended gross margin.
    data:
      nodes:
        - id: subscription-fee
          label: Customer subscription payment
          detail: 'Hourly-metered tiers: Free, Developer $35/mo, Startup $200/mo, Business $500/mo, Premium $1,900/mo'
          tone: positive
        - id: cloud-infra
          label: Cloud infrastructure cost (~35–45% of revenue)
          detail: >-
            Aiven purchases AWS / GCP / Azure compute, storage, network at enterprise rates and passes through to
            customers in bundled price
          tone: neutral
        - id: platform-ops
          label: Platform operations and support (~10–15%)
          detail: '99.99% SLA delivery: provisioning, monitoring, patching, backups, failover, 24/7 expert support team'
          tone: neutral
        - id: gross-margin
          label: Estimated gross margin (~40–55% of revenue)
          detail: >-
            Residual after cloud infra and platform ops; estimated 55–65% of revenue; improves with scale and cloud
            purchasing leverage
          tone: positive
        - id: byoc-path
          label: BYOC enterprise path
          detail: >-
            Customer's own cloud account absorbs infra cost; Aiven charges platform management fee only — higher margin
            per customer
          tone: positive
        - id: opex
          label: R&D, Sales & Marketing, G&A
          detail: Estimated ~$30–52M annual payroll (300–350 FTEs); plus cloud R&D and G&A spend
          tone: neutral
        - id: operating-result
          label: Operating income / loss (undisclosed)
          detail: >-
            Cash flow breakeven status is unconfirmed; four-year funding gap suggests cash adequacy or approach to
            profitability
          tone: warning
      edges:
        - from: subscription-fee
          to: cloud-infra
          label: covers
        - from: subscription-fee
          to: platform-ops
          label: covers
        - from: subscription-fee
          to: gross-margin
          label: remainder becomes
        - from: byoc-path
          to: gross-margin
          label: improves margin via
        - from: gross-margin
          to: opex
          label: funds
        - from: opex
          to: operating-result
          label: determines
    approximationNotes: >-
      Cost layer percentages are analyst estimates based on Confluent peer comparison and structural inference. Gross
      margin range (55–65%) is directional. BYOC fee structure is confidential; margin improvement is a structural
      inference, not a disclosed figure.
