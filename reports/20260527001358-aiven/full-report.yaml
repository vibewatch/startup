  - id: FR001
    title: Risk Heatmap — Aiven Enterprise Risk Landscape (May 2026)
    type: matrix
    layout: wide
    summary: >-
      Residual risk is concentrated in the high-impact column where capital-adequacy opacity, hyperscaler pricing power,
      and customer retention unknowns reinforce each other. Technical and regulatory risks are controllable near-term
      but elevate if the company delays disclosure or encounters a production Inkless Kafka incident.
    data:
      columns:
        - Low impact
        - Medium impact
        - High / critical impact
      rows:
        - label: Very likely (structural)
          values:
            - Competitive noise from hyperscaler marketing
            - BYOC absent on Azure limiting enterprise reach; compliance audit opacity
            - Capital-adequacy opacity — no public financial metrics for verification
        - label: Likely (plausible near-term)
          values:
            - Finnish corporate reporting limits external visibility
            - Open-source license change in non-core service (Grafana, Cassandra)
            - Customer concentration in BYOC enterprise accounts; NRR undisclosed
        - label: Possible (scenario-dependent)
          values:
            - EverSQL integration delay reducing AI differentiation
            - Inkless Kafka orphaned-segment production incident (KIP-1163 unresolved)
            - Hyperscaler billing integration displacing Aiven in AWS/GCP-committed accounts
        - label: Lower probability (tail risk)
          values:
            - Apache Kafka or PostgreSQL upstream license change
            - Cyber incident or SOC 2 qualified opinion becoming public
            - CEO key-person departure without successor in pre-IPO window
    claimRefs:
      - CR001
      - CR007
      - CR009
      - CR017
      - CR019
      - CR030
      - CR037
      - CR041
  - id: FR002
    title: Risk Transmission Map — How Risks Flow Into Revenue, Margin, and Valuation
    type: dag
    layout: wide
    summary: >-
      The main adverse chain originates in capital-adequacy opacity and valuation staleness, which amplify every
      downstream risk by removing the flexibility of new capital injection. Customer retention opacity prevents early
      detection of churn, which further delays corrective action. Hyperscaler pricing power constrains growth, while
      technical gaps and compliance opacity create enterprise-sales friction.
    data:
      nodes:
        - id: stale_valuation
          label: Stale $3B valuation (May 2022)
        - id: no_new_capital
          label: No primary round in 4 years
        - id: cash_uncertainty
          label: Cash runway unverifiable
        - id: ipo_delay
          label: IPO path uncertain
        - id: hyperscaler_pressure
          label: Hyperscaler pricing / bundling
        - id: nrr_opacity
          label: NRR/GRR entirely undisclosed
        - id: byoc_concentration
          label: BYOC enterprise concentration risk
        - id: churn_undetected
          label: Enterprise churn undetected
        - id: arr_growth_risk
          label: ARR growth slows
        - id: margin_pressure
          label: Gross margin pressure from cloud pass-through
        - id: valuation_reset
          label: Forced valuation reset at exit
        - id: technical_gap
          label: Inkless Kafka KIP-1163 gap
        - id: compliance_opacity
          label: Compliance audit opacity (NDA-gated)
      edges:
        - from: stale_valuation
          to: no_new_capital
        - from: no_new_capital
          to: cash_uncertainty
        - from: cash_uncertainty
          to: ipo_delay
        - from: hyperscaler_pressure
          to: arr_growth_risk
        - from: hyperscaler_pressure
          to: margin_pressure
        - from: nrr_opacity
          to: byoc_concentration
        - from: byoc_concentration
          to: churn_undetected
        - from: churn_undetected
          to: arr_growth_risk
        - from: arr_growth_risk
