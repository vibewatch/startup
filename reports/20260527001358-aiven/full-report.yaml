  - id: FM001
    title: Market sizing lens
    type: pyramid
    insight: >-
      Aiven's reachable opportunity is a narrow but fast-growing slice of the broader cloud database TAM. The $68.5B TAM
      overstates the opportunity for any single vendor; the $8–12B SAM for multi-cloud managed open-source data services
      is the defensible boundary. Aiven's ~$109M estimated ARR in March 2026 represents less than 2% of the SAM
      mid-point, indicating very early market penetration and substantial headroom.
    claimRefs:
      - CM001
      - CM003
      - CM007
      - CM031
    data:
      items:
        - label: Cloud Database TAM (2026)
          value: $68.5B
          detail: >-
            Global cloud database and DBaaS market (Valuates Reports via Datamation); includes all hyperscaler-native,
            proprietary, and open-source managed databases worldwide.
        - label: Multi-cloud Open-Source SAM (2026 est.)
          value: $8–12B
          detail: >-
            Estimated serviceable addressable market for multi-cloud managed open-source data services; derived by
            applying a 15–18% share to the TAM. Unverified by independent analyst report—directional estimate only.
        - label: Aiven Reachable 5-Year SOM (~2026–2031)
          value: $0.3–0.5B
          detail: >-
            Share of market reachable by Aiven over 5 years, based on current ~$109M ARR trajectory and assumed 20–25%
            CAGR in line with Confluent's observed growth rate.
  - id: FM002
    title: Market estimate range
    type: range
    insight: >-
      Market estimates for cloud database spend vary substantially depending on scope and methodology: from $57.5B
      (MarketsandMarkets, DBaaS-specific, 2028) to $68.5B (Valuates, broader scope, 2026). The SAM for multi-cloud
      open-source data services is estimated at $8–12B—a range that spans a $4B gap due to the unverified share
      assumption. These ranges should be read as indicating the order of magnitude (single-digit to low-double-digit
      billions SAM) rather than a precise figure.
