  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Taxonomy
        blocks:
          - type: paragraph
            body: |
              The market Aiven addresses is best framed as multi-cloud managed open-source data services—a
              subset of the broader cloud database and DBaaS category. The TAM boundary begins with any
              enterprise or developer team that (a) runs open-source database workloads and (b) outsources
              operational management of those workloads to a third party. It explicitly excludes proprietary
              managed databases (AWS Aurora proprietary engine, Azure Cosmos DB, Google Spanner) where the
              underlying technology is hyperscaler-owned, as well as on-premises database software licenses
              and bare-metal database appliances.

              The Gartner DBaaS definition—an abstracted managed service where the provider handles
              provisioning, patching, backup, and high availability—is the appropriate lens for the TAM
              boundary. Within this boundary, Aiven's product portfolio spans relational (PostgreSQL, MySQL),
              NoSQL (Apache Cassandra, OpenSearch), time-series (InfluxDB, M3), event streaming (Apache
              Kafka, Apache Flink), and observability/search (OpenSearch, ClickHouse). Each category has its
              own demand profile: relational is dominated by PostgreSQL (49% developer adoption as of the
              Stack Overflow 2024 survey), streaming is anchored by Apache Kafka, and observability is
              contested between Elastic ELv2-restricted OpenSearch and commercial Elastic Cloud.

              The adjacent but excluded spend includes hyperscaler-native managed databases not deployable
              as portable open-source workloads, enterprise data warehouse services (Snowflake, BigQuery,
              Redshift), and self-managed Kubernetes deployments where the enterprise handles its own
              database operations. The status-quo substitute for buyers who do not choose Aiven is
              typically a single-cloud hyperscaler DBaaS (AWS RDS for PostgreSQL, Google Cloud SQL) or
              a self-managed installation on Kubernetes. The switching cost from a hyperscaler DBaaS
              to Aiven is moderate: connection string changes, data migration, and revalidation of SLAs
              against the 99.99% uptime Aiven publishes publicly.

              Open-source license events create a distinctive market displacement mechanism: when Redis
              adopted the SSPL and Elastic shifted to ELv2 (which explicitly prohibits providing Elasticsearch
              as a managed service), enterprises running the popular download versions were no longer able
              to obtain managed service support from hyperscalers, opening a TAM window for independent
              providers such as Aiven, which offers managed OpenSearch (the Apache 2.0 fork) and managed
              Valkey (the Redis SSPL fork alternative).
