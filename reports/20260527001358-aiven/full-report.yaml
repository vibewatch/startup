  - id: TV005
    title: Thesis-Break and Kill Triggers — Aiven (May 2026)
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Revenue growth deceleration
        - ARR growth <15% in any 12-month window post-2026
        - >-
          Reduces exit multiple ceiling to Elastic-like 3–5x ARR; at $135M ARR, exit implies $405–675M — total loss from
          $3B entry, break-even at best from 5–6x ARR entry
        - >-
          Exit any secondary position immediately; no new investment; demand operational restructuring plan before any
          further engagement
      - - Primary down-round confirmation
        - New primary round priced below $1.5B (>50% discount to $3B stale mark)
        - >-
          Confirms market rejection of $3B thesis; existing investors face large mark-to-market losses; preference stack
          resets create complex dilution dynamics
        - >-
          Positive signal for new money at reset price; analyze new preference terms, management incentives, and
          investor syndicate before committing at down-round price
      - - Gross margin confirmed below 50%
        - Data room or management disclosure reveals blended GM <50%
        - >-
          Eliminates path to public market comp range of 3.4–10x revenue; exit multiple ceiling permanently limited;
          BYOC margin improvement thesis invalidated
        - >-
          Investment thesis collapses at any price above 2–3x ARR; only viable as distressed M&A target for
          infrastructure buyer absorbing the platform
      - - NRR disclosed below 100%
        - First-time NRR disclosure shows net revenue contraction in any reported period
        - >-
          Indicates structural churn offsetting gross new adds; ARR growth narrative is misleading; long-term revenue
          durability is in question
        - >-
          Thesis break; exit at any available price; demand immediate management explanation and full cohort data before
          any new commitment
      - - IBM/Confluent competitive launch
        - >-
          IBM completes Confluent integration and launches direct Aiven-competing managed Kafka offering (March 2026
          close as starting point)
        - >-
          IBM + Confluent combined offering directly attacks Aiven's largest service category (Kafka); M&A exit via IBM
          no longer available; strongest Kafka comp now a competitor
        - >-
          Revise competitive moat assessment; track IBM Confluent product releases post-close; reconsider Kafka ARR
          share assumptions in base-case model
      - - Cash exhaustion / distressed bridge
        - Credible reports or management acknowledgment of <6 months operational runway without new capital
        - >-
          Forced financing on punitive terms or distressed M&A sale; existing investors' preference rights may be
          overridden by bridge covenants; common equity likely wiped
        - >-
          Engage only as distressed buyer at steep discount; expect significant dilution and operational control
          transfer to bridge lenders
    notes: >-
      Kill triggers are defined against observable or disclosable evidence thresholds. All thresholds are informed by
      public comp analysis and historical patterns from the January 2023 layoff event. IBM-Confluent deal closed March
      2026 per stockanalysis.com news coverage.
