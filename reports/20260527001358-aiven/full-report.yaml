      - number: '8.6'
        title: Final Recommendation and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The recommendation for Aiven at the stale $3B valuation mark is DO NOT INVEST. The implied 27.5x ARR
              multiple has no support in the 2026 public or private market for data infrastructure companies of Aiven's
              scale, and the absence of financial disclosure prevents any credible independent validation of the
              assumptions that would be required to justify that multiple even speculatively. Every modeled exit
              scenario — including the strategic M&A bull case — produces a negative return from a $3B entry. This is
              not a marginal valuation call; it is a structurally impaired entry price that no reasonable forward
              scenario repairs.


              The recommendation at 5–8x ARR ($545–872M, implying a 71–82% haircut to the stale mark) is CONDITIONAL
              PASS with high-risk designation, subject to data room confirmation. At that entry price, the base-case IPO
              or secondary exit at $1.2–$2.0B produces 1.4–3.7x gross return — acceptable for high-risk infrastructure
              venture. The bull case at 3–5x gross return is competitive with sector benchmarks. A secondary market
              purchase at $500–700M, if available, would represent the most capital-efficient entry, as it avoids
              preference complexity from a new primary round and captures the full upside of any exit scenario above
              $700M.


              Minimum diligence before any capital commitment at any price: (1) audited or board-approved financial
              statements for FY2023–2025 showing gross margin waterfall, NRR by cohort, and cash burn rate; (2)
              certified cap table with preference stack, anti-dilution provisions, and management option pool; (3) ARR
              methodology note reconciling GetLatka ($48.7M), ARR Club ($109M), and company-disclosed (>$100M) — the
              $60M discrepancy must be explained; (4) management discussion of exit strategy, IPO timeline, and whether
              a primary round at revised valuation has been discussed with the board.


              Confidence in the recommendation is MEDIUM: the thesis direction (avoid at $3B; conditionally supportable
              at 5–8x ARR) is robustly supported by comparable evidence, but the depth of the discount and the
              probability of achieving the required entry price are both uncertain without knowing Aiven's actual
              financial position or whether a primary reset is forthcoming.
