  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Service Catalog and Deployment Models
        blocks:
          - type: paragraph
            body: >-
              Aiven's product catalogue spans twelve managed open-source data services organised across six functional
              categories: streaming and messaging (Apache Kafka Classic, Apache Kafka Inkless, Apache Flink), relational
              databases (PostgreSQL, MySQL), analytics (ClickHouse, OpenSearch), in-memory caching (Valkey, Dragonfly),
              observability (Grafana, Aiven for Metrics / Thanos), and NoSQL (Apache Cassandra). Every service shares a
              common control plane, consistent tooling surface (Terraform, Kubernetes Operator, REST API, CLI), and a
              unified support SLA structure — a deliberate multi-product strategy that enables customers to consolidate
              multiple managed-data vendors onto a single platform and reduces integration friction as workloads evolve.


              The three deployment models represent a capability staircase. Standard deployment places managed services
              in Aiven-owned, single-tenant VPCs on AWS, Google Cloud, or Azure; customers never share compute with
              other tenants. The Enhanced Compliance Environment (ECE) goes further by disabling all internet access
              from service nodes, requiring customer-approved cloud regions, and mandating Advanced or Premium support
              tier with a committed spend contract — satisfying HIPAA and PCI-DSS workloads that standard VPC isolation
              cannot accommodate. Bring Your Own Cloud (BYOC), launched May 2023, inverts the infrastructure ownership
              model: the customer's cloud account hosts all service virtual machines and pays the underlying cloud bill
              directly, while Aiven charges a platform management fee for orchestration, upgrades, monitoring, and
              support. BYOC is available on AWS (private and public architecture variants) and GCP (private and public),
              with the bastion-host model used to give Aiven's control plane a minimal, audited access channel into the
              customer's environment. Early BYOC customers reportedly reduced overall cloud spend by an average of 30
              percent versus standard hosted arrangements.
