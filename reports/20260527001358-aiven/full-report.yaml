      - number: '7.5'
        title: Open-Source Licensing Shifts and Upstream Community Dependency
        blocks:
          - type: paragraph
            body: >-
              Aiven's entire product portfolio is built on open-source software that it packages, manages, and supports
              rather than develops from scratch. This creates a category of risk that purpose-built proprietary vendors
              do not face: upstream license changes, community fragmentation, and foundation governance shifts can force
              product pivots, legal review, and customer communications at any time with little forewarning.


              The clearest historical evidence for this risk is the Elasticsearch → OpenSearch split (January 2021) and
              the Redis → Valkey fork (March 2024). Elastic's decision to relicense Elasticsearch from Apache 2.0 to a
              dual SSPL/ELv2 license drove AWS and Aiven to create the OpenSearch fork and donate it to the Linux
              Foundation (January 2024). Aiven had to migrate customers off Elasticsearch to Aiven for OpenSearch — a
              significant operational and communication burden. Similarly, Redis Ltd's relicensing to RSALv2/SSPL in
              March 2024 prompted the Linux Foundation-sponsored Valkey fork. Aiven now offers Aiven for Valkey™ as its
              Redis-successor product, but Valkey carries less brand recognition and community momentum than Redis,
              potentially creating customer-experience friction. The OpenSearch project's migration to the Linux
              Foundation further demonstrates that governance continuity for key projects cannot be assumed.


              Of Aiven's current service catalogue, Apache Kafka and Apache Flink (Apache Software Foundation, Apache
              2.0 license) and PostgreSQL (PostgreSQL License, MIT-style) are the lowest-risk licensing positions
              because they have no single corporate owner with a profit motive to relicense. ClickHouse is dual-licensed
              under Apache 2.0 for the open-source version, but ClickHouse Inc. controls the proprietary cloud features
              that differentiate ClickHouse Cloud — creating a risk that ClickHouse Inc. could restrict managed-service
              competitors over time. Apache Cassandra, Grafana, and MySQL all carry different risk profiles: Grafana
              Labs (proprietary plugins), Oracle (MySQL commercial licensing), and the broader ASF governance structure
              add complexity.


              The EU Cyber Resilience Act, which entered into force on 10 December 2024 with main obligations applying
              from 11 December 2027, creates an additional compliance obligation for software products with digital
              elements sold into the EU. Aiven already publishes SBOM reports via its CLI — a relevant preparatory step
              — but CRA compliance will require formal security assessment, CE marking for qualifying products, and
              sustained vulnerability management over product lifecycles. The compliance cost has not been quantified
              publicly.
