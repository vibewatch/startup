      - number: '7.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital Adequacy Is the Single Most Urgent Diligence Gate
            body: >-
              With a $3 B valuation reference from May 2022, no disclosed primary capital raise in four years, and no
              public financial metrics (gross margin, NRR, burn rate, cash balance), any investor or commercial
              counterparty is operating blind on the question of whether Aiven can fund its roadmap and sales capacity
              through to a liquidity event. The directional runway analysis (suggesting cash depletion between early
              2025 and mid-2026) means this is not a speculative concern but a time-bounded diligence requirement.
              Aiven's CFO Kenneth Chen and board should be asked directly: (1) current cash balance and monthly burn,
              (2) whether the company is cash-flow positive, (3) if not, what financing options are being pursued.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: callout
            title: Require NRR, GRR, and BYOC Concentration Data Before Any Commercial Commitment
            body: >-
              The absence of NRR disclosure from a $109M ARR company positioning as a land-and-expand platform is a
              material diligence gap, not a typical private-company disclosure norm at this scale. Public-company peers
              Confluent and Elastic disclosed NRR (120%+ and 114% respectively at comparable scale) as core investor
              metrics. Aiven's refusal to disclose suggests either unfavorable NRR or a deliberate non-disclosure
              policy. In either case, any material commercial or investment commitment should condition closing on
              disclosure of: trailing-12-month NRR and GRR by deployment cohort (Standard vs BYOC), current logo count,
              and top-10 customer revenue percentage.
            calloutType: risk
            claimRefs:
              - CR017
              - CR018
              - CR019
