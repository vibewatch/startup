      - number: '6.3'
        title: Adoption, Deployment Patterns, and Cloud Mix
        blocks:
          - type: paragraph
            body: >-
              Aiven's customer acquisition follows a bottoms-up developer-led pattern typical of
              infrastructure-as-a-service vendors. Developers discover Aiven through documentation, the Terraform
              provider (github.com/aiven/aiven-examples), or cloud-marketplace listings on AWS, GCP, and Azure. Initial
              deployments are most commonly Kafka or PostgreSQL on the Standard tier in a single region; expansion to
              additional services, regions, and BYOC typically follows within 6–18 months as workloads grow. This
              pattern is evidenced in multiple case studies: Hookdeck began with PostgreSQL and expanded to six
              services, La Redoute migrated from Standard to BYOC when Azure cost pressure emerged, and Sophos moved
              from Standard to BYOC to gain cost transparency across 9 AWS regions.


              Cloud mix among named case study customers shows AWS as the most common BYOC substrate (Sophos, Claroty,
              Priceline partly), GCP second (WalkMe, Simplilearn, Aiven's Google Cloud Partner award), and Azure third
              (La Redoute, Avaya). Multi-cloud deployments — where customers run services on two or more hyperscalers —
              are documented for Priceline (four cloud regions), Dojo (multi-cloud payments), and Back Market
              (cross-cloud migration completed without downtime). The back-market migration is a notable adoption proof
              point: Back Market moved 13M+ customers' data across cloud providers without service interruption, an
              operationally complex task that demonstrates Aiven's migration tooling capability.


              Geography spans all major regions: the EMEA case studies include La Redoute (France), Sophos
              (UK-headquartered), BLUME2000 (Germany), NAV (Norway), A1 Austria, and Mirakl (France/global). North
              American logos include Priceline, WalkMe, Claroty, Hookdeck (Canada), and Avaya. APAC is represented by
              GoTo Financial (Indonesia/APAC fintech), Simplilearn (India), and Katana (Estonia-based but serving 70
              countries). This geographic breadth is consistent with Aiven's stated presence in 60+ countries.
