        title: Exhibits
        blocks:
          - type: callout
            title: KIP-1150 Acceptance Validates Aiven's Open-Source Architecture Strategy
            body: >-
              The March 2, 2026, acceptance of KIP-1150 (Diskless Topics) by the Apache Kafka PMC with 9 binding votes
              represents a rare instance of a commercial vendor successfully landing a fundamental architectural change
              into an Apache project. Aiven proposed, prototyped, and open-sourced the implementation before community
              acceptance, demonstrating technical depth and a genuine upstream-first approach. This positions Aiven to
              become the reference implementation of Inkless Kafka in the managed-service market, creating durable
              differentiation that is more defensible than feature parity or pricing. The >94% infrastructure cost
              reduction claim, while contingent on workload type, is the most compelling cost story in the managed Kafka
              market as of mid-2026.
