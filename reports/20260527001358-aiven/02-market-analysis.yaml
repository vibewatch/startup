  researchQuestions:
    - id: QM001
      question: >-
        What is the best-supported estimate for the global cloud database and DBaaS market
        in 2026, and how do the Valuates ($68.5B) and MarketsandMarkets ($57.5B by 2028) figures
        differ in scope and methodology?
      type: quantification
      targets:
        - contentRequirements/1
      status: answered
      answer: >-
        Valuates (via Datamation) projects $68.5B by 2026 at a 38.2% CAGR from 2021; this is
        broader in scope, likely including data-management tooling beyond pure DBaaS. MarketsandMarkets
        separately estimates $57.5B by 2028 at 22% CAGR for a more narrowly defined cloud DB and DBaaS
        category. Both are in the same order of magnitude and confirm a rapidly growing market. Neither
        cleanly isolates the multi-cloud open-source subset relevant to Aiven.

    - id: QM002
      question: >-
        Is the $68.5B cloud database market estimate for 2026 based on a sound analyst
        methodology, or is it a synthetic top-down projection that overstates the serviceable
        opportunity for an independent vendor like Aiven?
      type: adverse
      targets:
        - contentRequirements/1
        - contentRequirements/4
      status: answered
      answer: >-
        The Valuates/Datamation estimate is a top-down projection with a 38.2% CAGR from 2021—a
        high rate that may overstate near-term growth. The figure includes hyperscaler-native databases
        that Aiven does not compete in. For Aiven, the relevant figure is the $8–12B SAM (multi-cloud,
        open-source only), which is itself an unverified approximation. The TAM should not be cited
        as Aiven's opportunity without the haircut logic explicitly stated.

    - id: QM003
      question: >-
        What is the serviceable addressable market (SAM) for multi-cloud managed open-source
        data services specifically in 2026, excluding hyperscaler-native DBaaS spend?
      type: quantification
      targets:
        - contentRequirements/1
        - contentRequirements/4
      status: answered
      answer: >-
        No published analyst report cleanly isolates this segment. This report estimates $8–12B by
        applying a 15–18% multi-cloud open-source share to the $68.5B TAM. The bottom-up proxy
        (Confluent + Elastic = $2.65B in two subsegments) implies a full-category SAM above $5B but
        below $15B, consistent with the $8–12B range. This should be treated as directional only.

    - id: QM004
      question: >-
        How large is the managed event-streaming (Apache Kafka) market in 2026, and how does
        Confluent's $1.167B revenue relate to the overall managed event-streaming segment?
      type: quantification
      targets:
        - contentRequirements/1
      status: answered
      answer: >-
        Confluent is the dominant independent managed Kafka vendor with $1.167B FY2025 revenue
        and 21% growth. This implies the overall managed event-streaming market (including AWS MSK,
        Aiven for Kafka, and others) likely exceeds $2B annually. Aiven for Apache Kafka competes
        directly in this subsegment, positioned below Confluent's price point with multi-cloud
        portability differentiation.

    - id: QM005
      question: >-
        What share of the $1,295 billion total cloud computing market in 2025 is attributable
        to database and data-processing services?
      type: quantification
      targets:
        - contentRequirements/1
      status: answered
      answer: >-
        Databases and data processing are typically estimated at 5–10% of total cloud infrastructure
        spend (industry rule of thumb). At $1.295T total cloud (MnM 2025), that implies $65–130B in
        data-related cloud services—broadly consistent with the $57–68B cloud DB TAM estimates from
        Valuates and MarketsandMarkets, which land near the midpoint of this range.

    - id: QM006
      question: >-
        Are there published analyst reports in 2026 specifically sizing the multi-cloud database
        portability segment (distinct from single-cloud DBaaS)?
      type: verification
      targets:
        - contentRequirements/1
        - contentRequirements/4
      status: answered
      answer: >-
        No published analyst report specifically sizes the "multi-cloud database portability"
        segment as a distinct market. This is a structural gap in the evidence base. The
        closest proxies are: CNCF survey data on multi-cloud organizational adoption (56%, 2.3
        providers), and Aiven's own ARR data. This remains an evidence gap and a diligence ask.

    - id: QM007
      question: >-
        How does AWS/GCP managed database revenue growth in 2026 compare with independent
        DBaaS vendors like Confluent and Aiven?
      type: comparison
      targets:
        - contentRequirements/1
      status: answered
      answer: >-
        AWS and GCP do not publicly disclose managed-database-specific revenue. Confluent
        (independent) grew at 21% YoY in FY2025. Elastic (adjacent) grew at 17% YoY.
        Aiven has not published standalone growth rates beyond the $100M ARR milestone. Hyperscalers
        typically disclose aggregate cloud revenue only; their database unit growth is estimated to
        be above 20% but is unconfirmed by segment filings.

    - id: QM008
      question: >-
        What is the OLTP, OLAP, and streaming breakdown of the $8–12B multi-cloud managed
        open-source SAM estimate in 2026?
      type: quantification
      targets:
        - contentRequirements/1
        - contentRequirements/4
      status: unresolved

    - id: QM009
      question: >-
        What proportion of enterprise database workloads remain on-premises in 2026, and what
        is the remaining lift-and-shift migration opportunity for managed DBaaS?
      type: mechanism
      targets:
        - contentRequirements/3
      status: answered
      answer: >-
        Gartner forecast in 2018 that 75% of databases would be cloud-hosted by 2022; actual
        cloud adoption is estimated at 60–70% by 2026. The remaining 30–40% on-premises workloads
        represent a long-cycle migration pipeline, particularly in regulated industries. This is
        relevant to Aiven's BYOC model for regulated enterprises.

    - id: QM010
      question: >-
        Why do digital-native companies in 2026 prefer independent DBaaS vendors over hyperscaler
        offerings—is the primary driver cost, portability, or developer experience?
      type: mechanism
      targets:
        - contentRequirements/2
      status: answered
      answer: >-
        Based on Aiven's own BYOC messaging (30% cost savings), SiliconAngle coverage, and the
        CEO's "digital native mid-market" framing, the primary drivers are multi-cloud portability
        (enabling workload movement across AWS/GCP/Azure), open-source fidelity (no hyperscaler
        proprietary engine modifications), and developer experience (unified console, Terraform
        provider). Cost is a secondary benefit via BYOC, not the primary acquisition reason
        for the mid-market segment.

    - id: QM011
      question: >-
        How many mid-market companies (100–999 employees) are running multi-cloud environments
        in 2026, representing Aiven's core buyer profile?
      type: quantification
      targets:
        - contentRequirements/2
      status: answered
      answer: >-
        No published data specifically sizes mid-market multi-cloud companies. Proxy: CNCF 2023
        reports 56% multi-cloud organizational adoption broadly; Gartner/IDC typically segment
        mid-market as $50M–$1B revenue companies. An estimated 200,000–500,000 mid-market
        technology companies globally with multi-cloud environments are potential Aiven buyers.
        This is a rough order-of-magnitude proxy, not a validated figure.

    - id: QM012
      question: >-
        What is the typical annual data infrastructure spend for a digital-native mid-market
        company in 2026, and what share goes to managed databases specifically?
      type: quantification
      targets:
        - contentRequirements/2
      status: unresolved

    - id: QM013
      question: >-
        How does Aiven's market position in multi-cloud managed PostgreSQL compare with Crunchy
        Data, Neon, and Tembo in 2026?
      type: comparison
      targets:
        - contentRequirements/2
      status: unresolved

    - id: QM014
      question: >-
        How does Aiven's pricing for managed Apache Kafka compare with Confluent Cloud for an
        equivalent throughput workload in 2026?
      type: comparison
      targets:
        - contentRequirements/3
      status: answered
      answer: >-
        Aiven's pricing is publicly available at aiven.io/pricing by instance type; Confluent
        Cloud pricing is publicly available by compute unit. A direct comparison for the same
        throughput workload is feasible from published pricing pages but requires a specific
        workload configuration. Aiven is generally positioned at a lower price point than Confluent
        Cloud for equivalent compute, with multi-cloud portability as the differentiating value
        rather than stream processing features (Confluent's KSQL/Flink integration is richer).

    - id: QM015
      question: >-
        How has the Elastic License v2 changed the competitive landscape for managed
        OpenSearch and Elasticsearch services in 2026?
      type: mechanism
      targets:
        - contentRequirements/3
      status: answered
      answer: >-
        ELv2 (2021) prohibits managed-service delivery of Elasticsearch/Kibana, blocking hyperscaler
        resale. AWS responded by forking OpenSearch (Apache 2.0), and Aiven offers managed OpenSearch.
        In 2026, the managed Elasticsearch ecosystem has effectively bifurcated: Elastic Cloud
        (commercial, Elastic-hosted) and OpenSearch ecosystem (AWS, Aiven, others). This creates a
        durable managed-service market for Aiven's OpenSearch offering with no hyperscaler overhang.

    - id: QM016
      question: >-
        What managed database types does AWS offer in 2026, and which types directly overlap
        with Aiven's core product portfolio?
      type: enumeration
      targets:
        - contentRequirements/3
      status: answered
      answer: >-
        AWS offers: Amazon RDS (PostgreSQL, MySQL, MariaDB, Oracle, SQL Server), Amazon Aurora
        (PostgreSQL-compatible, MySQL-compatible proprietary), Amazon DynamoDB (NoSQL), Amazon
        ElastiCache (Redis-compatible, Memcached), Amazon DocumentDB (MongoDB-compatible), Amazon
        Keyspaces (Cassandra-compatible), Amazon MemoryDB, Amazon Timestream (time-series), Amazon
        Neptune (graph), and Amazon OpenSearch Service. Direct overlap with Aiven: PostgreSQL (RDS
        vs. Aiven for PostgreSQL), Redis-compatible (ElastiCache vs. Aiven for Valkey), Cassandra
        (Keyspaces vs. Aiven for Cassandra), OpenSearch (OpenSearch Service vs. Aiven for OpenSearch),
        and Apache Kafka (MSK vs. Aiven for Kafka).

    - id: QM017
      question: >-
        How do AWS Outposts and GCP Distributed Cloud compare with Aiven BYOC in data
        residency capabilities for enterprise buyers in 2026?
      type: comparison
      targets:
        - contentRequirements/2
        - contentRequirements/3
      status: answered
      answer: >-
        AWS Outposts and GCP Distributed Cloud physically deploy hyperscaler hardware in
        customer data centers—achieving data residency but at significant capital cost and
        operational complexity. Aiven BYOC deploys the Aiven control plane while keeping
        data in the customer's existing cloud account (not on-prem). BYOC requires no
        additional hardware and leverages the customer's existing cloud contract pricing.
        For enterprises already in a public cloud, Aiven BYOC is operationally simpler and
        lower-cost than Outposts; for air-gapped or on-prem data residency requirements,
        Outposts is the only option.

    - id: QM018
      question: >-
        What is the risk that PostgreSQL community forks or BSL-like re-licensing events in
        2026 could disrupt Aiven's managed-PostgreSQL offering?
      type: adverse
      targets:
        - contentRequirements/3
        - contentRequirements/4
      status: answered
      answer: >-
        PostgreSQL is governed by the PostgreSQL Global Development Group and is released under
        the PostgreSQL License (permissive). No license risk is credible for PostgreSQL itself.
        The risk is derivative: if a major PostgreSQL extension (pgvector, TimescaleDB, Citus)
        re-licenses under a restrictive license, Aiven's ability to bundle that extension in its
        managed offering could be affected. This is an emerging risk to monitor but is not
        material in 2026 for the core PostgreSQL engine.

    - id: QM019
      question: >-
        How exposed is Aiven to continued slowdown in developer-tools spending in 2026,
        following the 2023 layoff cycle?
      type: adverse
      targets:
        - contentRequirements/3
      status: answered
      answer: >-
        Aiven's $100M ARR milestone (July 2025) and 2025 Google Cloud Partner of the Year award
        suggest the business has recovered from the 2023 layoff event. However, if digital-native
        startup formation slows again (e.g., due to rising interest rates or VC pullback), Aiven's
        primary buyer segment contracts. Aiven's BYOC expansion into regulated enterprise is a
        partial hedge against startup-formation cyclicality.

    - id: QM020
      question: >-
        What is the risk of hyperscaler managed database price cuts in 2026 undermining
        Aiven's cost-optimization value proposition?
      type: adverse
      targets:
        - contentRequirements/3
      status: answered
      answer: >-
        AWS and GCP have historically reduced cloud prices 5–20% annually in compute and storage;
        database managed services have seen occasional discounts. If hyperscalers significantly
        cut managed PostgreSQL or Kafka pricing, Aiven's cost parity argument weakens. However,
        Aiven's multi-cloud portability value proposition is not purely cost-based; BYOC's 30%
        savings come from using the enterprise's own cloud contracts, not from Aiven's pricing.
        Hyperscaler price cuts do not eliminate the portability or open-source fidelity premium.

    - id: QM021
      question: >-
        Does the 2026 macroeconomic environment support or constrain digital-native startup
        formation—Aiven's primary buyer segment?
      type: mechanism
      targets:
        - contentRequirements/3
      status: answered
      answer: >-
        Gartner's 2026 top technology trends (AI-native development, confidential computing,
        multiagent systems) indicate continued investment in developer infrastructure in 2026.
        The post-2023 VC recovery has resumed startup formation in AI-native companies (the new
        wave of digital-native companies), many of which are likely to use managed databases.
        However, the pace of traditional SaaS-model startup formation may be slower than the
        2020–2022 peak, tempering the buyer-formation rate for Aiven's core segment.

    - id: QM022
      question: >-
        What role does Aiven's open-source contribution strategy play in driving developer
        adoption and long-term SAM expansion in 2026?
      type: mechanism
      targets:
        - contentRequirements/2
        - contentRequirements/3
      status: answered
      answer: >-
        Aiven's "Open Source by Default" positioning—publishing code, contributing to upstream
        projects—functions as a developer acquisition channel. Developers who trust Aiven's
        open-source community participation are more likely to convert to paid managed service
        when they need SLA-backed infrastructure. The 2025 Google Cloud Partner of the Year
        award further validates Aiven's ecosystem positioning. Quantifying the conversion rate
        from open-source engagement to paid subscriber is a diligence ask.

    - id: QM023
      question: >-
        How does Aiven's BYOC model compare with hyperscaler dedicated/Outposts options in
        buyer acquisition potential in 2026?
      type: comparison
      targets:
        - contentRequirements/2
        - contentRequirements/3
      status: answered
      answer: >-
        Aiven BYOC is simpler to procure and operationally lighter than hyperscaler Outposts
        for enterprises already in a public cloud. The 30% average cost savings claim (from
        Aiven's own press release and DBTA coverage) is the primary acquisition argument.
        However, BYOC remains an enterprise-tier feature with a longer sales cycle. Hyperscaler
        dedicated instances (Reserved Instances, CUDs) offer cost savings without changing
        the management plane—which is a competing approach for cost-focused buyers who do
        not require multi-cloud portability.

    - id: QM024
      question: >-
        Is managed observability (Aiven for OpenSearch, ClickHouse) a natural SAM expansion
        path in 2026, or does it require a distinct market entry strategy?
      type: mechanism
      targets:
        - contentRequirements/2
        - contentRequirements/3
      status: answered
      answer: >-
        Aiven's acquisition of EverSQL (2023) and its managed OpenSearch and ClickHouse
        offerings indicate that observability/analytics is already part of the product
        portfolio, not a new entry. The buyer (platform engineering) and the sales motion
        (same unified Aiven console and Terraform provider) are identical to the relational
        and streaming segments. The SAM expansion from database to observability is natural
        within the existing buyer relationship. Quantifying the observability revenue share
        within Aiven's $100M ARR base is a diligence ask.

    - id: QM025
      question: >-
        Does hyperscaler dominance in managed databases—AWS 7+ types, GCP 95% of top-100
        customers using Cloud SQL—effectively foreclose meaningful market share for independent
        multi-cloud DBaaS vendors in 2026?
      type: adverse
      targets:
        - contentRequirements/3
        - contentRequirements/4
      status: answered
      answer: >-
        Hyperscaler dominance is real but not foreclosing. Confluent ($1.167B revenue) and Elastic
        ($1.483B revenue) demonstrate that independent open-source managed service vendors can
        build billion-dollar businesses within the hyperscaler era. The addressable buyer is the
        multi-cloud buyer (56% of orgs) rather than the single-cloud buyer (dominated by hyperscalers).
        The key risk is that hyperscaler database products continue to improve, narrowing the
        gap with open-source fidelity and portability—which is a valid ongoing risk but not a
        currently foreclosing one.

    - id: QM026
      question: >-
        Does the rapid growth of AI workloads in 2026 deepen hyperscaler database integration
        (via vector stores, AI-optimized storage) in ways that disadvantage Aiven's
        multi-cloud positioning?
      type: adverse
      targets:
        - contentRequirements/3
      status: answered
      answer: >-
        AI workloads do create new gravitational pull toward hyperscaler-native vector databases
        (pgvector on AWS Aurora, AlloyDB AI on GCP). However, PostgreSQL's native pgvector
        extension means that managed PostgreSQL providers (including Aiven) automatically benefit
        from AI workload adoption without requiring new product development. Aiven's AlloyDB Omni
        offering and ClickHouse (analytical) are additional hedges. The risk is real but partially
        mitigated by Aiven's broad portfolio.

