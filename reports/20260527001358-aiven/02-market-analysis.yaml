figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    insight: >-
      Aiven's reachable opportunity is a narrow but fast-growing slice of the broader cloud
      database TAM. The $68.5B TAM overstates the opportunity for any single vendor; the
      $8–12B SAM for multi-cloud managed open-source data services is the defensible boundary.
      Aiven's ~$109M estimated ARR in March 2026 represents less than 2% of the SAM mid-point,
      indicating very early market penetration and substantial headroom.
    claimRefs: [CM001, CM003, CM007, CM031]
    data:
      items:
        - label: Cloud Database TAM (2026)
          value: "$68.5B"
          detail: >-
            Global cloud database and DBaaS market (Valuates Reports via Datamation); includes
            all hyperscaler-native, proprietary, and open-source managed databases worldwide.
        - label: Multi-cloud Open-Source SAM (2026 est.)
          value: "$8–12B"
          detail: >-
            Estimated serviceable addressable market for multi-cloud managed open-source data
            services; derived by applying a 15–18% share to the TAM. Unverified by independent
            analyst report—directional estimate only.
        - label: Aiven Reachable 5-Year SOM (~2026–2031)
          value: "$0.3–0.5B"
          detail: >-
            Share of market reachable by Aiven over 5 years, based on current ~$109M ARR
            trajectory and assumed 20–25% CAGR in line with Confluent's observed growth rate.

  - id: FM002
    title: Market estimate range
    type: range
    insight: >-
      Market estimates for cloud database spend vary substantially depending on scope and
      methodology: from $57.5B (MarketsandMarkets, DBaaS-specific, 2028) to $68.5B
      (Valuates, broader scope, 2026). The SAM for multi-cloud open-source data services
      is estimated at $8–12B—a range that spans a $4B gap due to the unverified share
      assumption. These ranges should be read as indicating the order of magnitude
      (single-digit to low-double-digit billions SAM) rather than a precise figure.
    claimRefs: [CM001, CM003, CM004, CM007, CM009, CM011]
    approximationNotes: >-
      All values in $B (billion USD). The SAM range ($8–12B) and SOM range ($0.3–0.5B)
      are internal approximations derived from the TAM estimates and publicly observed
      peer-company revenue figures; they are not published analyst figures.
    data:
      items:
        - label: Cloud DB TAM — Valuates Reports (2026)
          low: 60
          mid: 68.5
          high: 75
        - label: Cloud DB TAM — MarketsandMarkets (2028)
          low: 50
          mid: 57.5
          high: 65
        - label: Multi-cloud Open-Source SAM (this report, 2026)
          low: 8
          mid: 10
          high: 12
        - label: Managed Event Streaming Proxy (Confluent FY2025 rev)
          low: 1.1
          mid: 1.2
          high: 1.5

  - id: FM003
    title: Buyer / segment map
    type: matrix
    insight: >-
      The digital-native mid-market segment provides the highest volume of buyer opportunities
      for Aiven with moderate budget authority and high multi-cloud maturity. The regulated
      enterprise BYOC segment offers higher deal values but longer sales cycles and tighter
      data sovereignty requirements. Startups are primarily a pipeline / acquisition funnel
      rather than a primary revenue segment.
    claimRefs: [CM017, CM018, CM020, CM021, CM022, CM024, CM041]
    data:
      columns:
        - Budget Authority
        - Multi-Cloud Maturity
        - Price Sensitivity
        - Aiven Fit
      rows:
        - label: Digital-native mid-market SaaS
          values:
            - label: VP Engineering / Platform Lead
            - label: High (avg 2.3 providers)
            - label: Medium
            - label: Primary—portability, open-source fidelity, developer UX
        - label: Regulated enterprise (BYOC)
          values:
            - label: CTO / CIO
            - label: Medium (multi-cloud mandated but compliance-gated)
            - label: Low (cost savings via BYOC 30% reduction)
            - label: High—BYOC unique fit; data sovereignty + cost optimization
        - label: Early-stage startup / developer
          values:
            - label: Founding engineer
            - label: Low (early single-cloud)
            - label: High (free-tier preference)
            - label: Pipeline—acquisition funnel; low near-term revenue
        - label: Global enterprise (multi-cloud mandate)
          values:
            - label: Platform Engineering director
            - label: Very high (board-level policy)
            - label: Low (cost is secondary to compliance and portability)
            - label: High—multi-cloud mandate aligns with Aiven's core proposition

  - id: FM004
    title: Adoption funnel or value-chain map
    type: funnel
    insight: >-
      The developer adoption funnel narrows significantly at each stage. Open-source PostgreSQL
      and Kafka usage is extremely broad (hundreds of millions of installations globally), but
      conversion to paid managed service requires developer awareness, organizational budget
      authority, and competitive selection over hyperscaler defaults. Aiven's SAM sits at the
      managed DBaaS consideration stage; the SOM requires winning against hyperscaler defaults
      in competitive selections.
    claimRefs: [CM013, CM018, CM037, CM040]
    data:
      items:
        - label: Open-source database installations (global, all workloads)
          value: 100
        - label: Cloud-hosted workloads (migrated or cloud-native, 2026)
          value: 60
        - label: Considering third-party managed DBaaS (not self-managed on IaaS)
          value: 30
        - label: Multi-cloud or open-source-fidelity requirement (Aiven's SAM)
          value: 12
        - label: Active Aiven consideration or current Aiven customer
          value: 2

