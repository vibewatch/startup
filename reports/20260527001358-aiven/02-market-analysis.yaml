  evidenceGaps:
    - type: missing-source
      topic: SAM methodology
      severity: material
      missingEvidence: >-
        No published analyst report isolates the multi-cloud managed open-source database SAM
        in 2026. An independent analyst study specifically sizing this segment (multi-cloud,
        open-source-only DBaaS) would replace the unverified 15–18% share assumption used in
        this report's $8–12B SAM estimate.
      whyItMatters: >-
        Without a validated SAM figure, Aiven's market sizing narrative relies on an internal
        derivation that investors or acquirers could challenge. The estimate affects the
        headline opportunity and the implied 5-year SOM calculation.
      diligencePath: >-
        Commission or identify an analyst report (Gartner, Forrester, IDC) specifically sizing
        the multi-cloud managed open-source data services market. Alternatively, Aiven can
        provide its own segment-level ARR data to build a bottom-up estimate.
      relatedQuestionRefs: [QM008, QM012]

    - type: missing-source
      topic: PostgreSQL managed-service conversion rate
      severity: material
      missingEvidence: >-
        The conversion rate from developer PostgreSQL adoption (49% of developers per Stack
        Overflow 2024) to paid managed DBaaS is unknown. Without this conversion rate, the
        bottom-up demand signal from developer surveys cannot be reliably translated into a
        SAM revenue estimate.
      whyItMatters: >-
        Overreliance on developer adoption data to size the market creates a risk of systematic
        overestimation if the conversion rate from OSS preference to paid managed service is
        materially below what is implied by TAM models.
      diligencePath: >-
        Request Aiven's internal data on what percentage of its customers were previously
        self-managing PostgreSQL vs. using a competing DBaaS. Alternatively, survey data from
        developer communities (e.g., PostgreSQL conference registrants) could estimate conversion.
      relatedQuestionRefs: [QM013]

    - type: private-evidence-only
      topic: Aiven competitive market share
      severity: material
      missingEvidence: >-
        No publicly available analyst report provides market share data for the independent
        managed PostgreSQL-as-a-service segment comparing Aiven with Crunchy Data, Neon,
        Tembo, Supabase, and similar vendors. Aiven does not publish segment-level revenue.
      whyItMatters: >-
        Without relative market share data, it is impossible to assess whether Aiven is a
        leader, a fast follower, or a niche player in its primary PostgreSQL product line,
        which is the most critical strategic positioning question for the company.
      diligencePath: >-
        Request Aiven's win/loss data in competitive PostgreSQL deals. Cross-reference with
        Crunchy Data and Neon fundraising announcements and estimated ARR. Review job posting
        volumes as a proxy for team scaling across the competitive set.
      relatedQuestionRefs: [QM013]
