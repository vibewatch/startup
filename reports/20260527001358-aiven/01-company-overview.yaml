      Aiven's public record traces a rise from Finnish open-source infrastructure start-up in 2016 through
      $3B unicorn status in May 2022, a 2023 downsizing correction, and a subsequent $100M ARR milestone
      in July 2025 anchored by BYOC, EverSQL AI, and Google Cloud partnerships.
