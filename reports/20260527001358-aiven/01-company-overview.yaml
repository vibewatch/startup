  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: governance
      missingEvidence: "Full board composition, director names, reserved-matter provisions, liquidation preferences, and anti-dilution terms."
      whyItMatters: "Board governance is a primary dimension of investment risk; without the cap table and board roster, it is impossible to assess control rights, drag-along provisions, or protective provisions."
      diligencePath: "Request capitalization table, shareholder agreement, and board minutes directly from Aiven management or counsel."
      relatedQuestionRefs: [QO008, QO009]
      relatedTableRefs: [TO003]

    - type: private-evidence-only
      severity: material
      topic: revenue
      missingEvidence: "Gross margin, net revenue retention (NRR), average contract value, and detailed customer count."
      whyItMatters: "Infrastructure SaaS valuation depends critically on gross margin (cloud cost structure) and NRR (expansion vs. churn); without these, the 27–30x ARR multiple cannot be validated."
      diligencePath: "Request audited financials, cohort retention analysis, and unit economics model from management."
      relatedQuestionRefs: [QO005, QO027]
      relatedTableRefs: [TO001, TO004]

    - type: enumeration-incomplete
      severity: material
      topic: leadership
      missingEvidence: "Confirmation of current roles for Heikki Nousiainen and Hannu Valtonen (founders whose titles are uncertain as of 2026); verification of Artur Tarkhanov's co-founder status."
      whyItMatters: "Co-founder continuity and role clarity are material for key-person risk assessment; conflicting information between investor profiles and current about page suggests possible evolution or departure."
      diligencePath: "Confirm current roles and employment status of all co-founders directly with Aiven HR or management."
      relatedQuestionRefs: [QO002, QO028]
      relatedTableRefs: [TO002]

    - type: stale
      severity: material
      topic: valuation
      missingEvidence: "A public funding round, secondary transaction, or formal valuation mark between May 2022 and May 2026 that would refresh the $3B enterprise value."
      whyItMatters: "The May 2022 $3B valuation was set at peak SaaS multiples. The absence of any refreshed public mark for four years creates meaningful uncertainty about current fair value, particularly given the 2023 cost reset."
      diligencePath: "Review any secondary transactions in the cap table, obtain Eurazeo or Atomico's latest internal carry marks, and request management's most recent 409A or board-approved valuation."
      relatedQuestionRefs: [QO015]
      relatedTableRefs: [TO001]

    - type: missing-source
      severity: minor
      topic: founding
      missingEvidence: "Primary-source documentation confirming the exact founding month/year (2015 vs 2016) and co-founder equity split at founding."
      whyItMatters: "Founding year is used in multiple secondary sources; minor discrepancy (2015 per CEO vs 2016 per formal incorporation) should be reconciled for an IPO-track company."
