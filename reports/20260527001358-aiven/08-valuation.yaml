  - id: TV006
    title: Final Diligence Asks — Minimum Requirements Before Any Investment Commitment
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - "Owner / Diligence Path"
    rows:
      - - Gross margin and unit economics
        - "Blended gross margin waterfall by service type (Kafka, PostgreSQL, ClickHouse, BYOC vs. standard); cost of revenue breakdown; BYOC fee revenue vs. platform cost"
        - "Without GM, valuation ceiling cannot be determined; estimated 55–65% is 10–20 ppts below public comps and limits achievable exit multiple; BYOC margin improvement thesis cannot be validated"
        - "Data room: audited FY2023–FY2025 P&L with cost-of-revenue detail; management presentation; CFO interview"
      - - NRR and cohort retention
        - "Net revenue retention and gross revenue retention rates by quarter for at least 6 cohorts; customer logo churn rate; expansion ARR vs. new ARR breakdown"
        - "NRR estimate of 110–125% is entirely unverified; if NRR is below 100%, growth narrative collapses; if NRR is above 120%, thesis is materially stronger and comps closer to MongoDB"
        - "Data room: NRR schedule by quarter; cohort waterfall; CRM export of ARR by customer vintage"
      - - Capital adequacy and runway
        - "Audited or board-approved cash balance as of December 2025 / March 2026; trailing 6-month burn rate; debt facilities; EverSQL acquisition price and structure"
        - "4-year funding gap creates runway uncertainty; directional analysis suggests $130–162M remaining post-Series D but up to 40 months of burn may have occurred since then"
        - "Data room: bank statement or board-approved balance sheet; CFO interview on runway and financing options; confirmation of no undisclosed liabilities"
      - - Cap table and preference stack
        - "Certified cap table showing all shareholders, share classes, liquidation preferences by series, anti-dilution provisions, and management option pool outstanding and vested"
        - "$420M cumulative raises create complex preference overhang; without cap table, cannot model waterfall returns at exit; anti-dilution provisions may significantly dilute new investors in a down-round"
        - "Company counsel; data room: certified cap table with preference waterfall model; legal review of investor rights agreements"
      - - ARR definition and reconciliation
        - "ARR methodology note explaining what is included (BYOC platform fees? annualized MRR? contracted vs. run-rate?); reconciliation of $48.7M (GetLatka) vs. $109M (ARR Club) vs. company '>$100M'"
        - "The $60M discrepancy between GetLatka and ARR Club represents a 124% difference; if GetLatka reflects true contracted ARR and ARR Club reflects run-rate, the underlying business quality is materially different"
        - "Management interview; data room: ARR methodology document; board reporting metrics showing ARR definition and calculation"
      - - Strategic exit pipeline
        - "Whether banker mandate has been awarded or M&A conversations initiated; board-level exit strategy; any LOIs or term sheets received"
        - "IBM-Confluent deal closed; remaining strategic acquirer landscape is narrower; without knowing pipeline status, exit probability weighting in base case is uncertain"
        - "Management interview (confidential); board-level strategy session; investor relations contact at Eurazeo or IVP"
    notes: >-
      Diligence asks reflect the minimum evidence required before any investment commitment at any
      valuation. Additional asks (product roadmap, customer references, technical architecture review)
      are also valuable but are not blocking for the valuation decision specifically.
    claimRefs:
      - CV003
