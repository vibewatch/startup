  - id: comparable-valuation-analysis
    title: Comparable Valuation Analysis — Public Market, M&A, and Private Comps
    body: >-
      The applicable comp set for Aiven spans four peer groups: public data infrastructure SaaS
      (Confluent/IBM, MongoDB, Elastic, Datadog), a closed strategic M&A transaction (IBM-Confluent),
      a private unicorn peer (ClickHouse), and Aiven's own stale mark. Each comp provides a lens on
      the range of defensible multiples given Aiven's scale, growth, and margin profile.


      The IBM-Confluent M&A transaction ($11B, December 2025 announcement, March 2026 close) is the
      most directly comparable data point. Confluent was acquired at $31/share in an all-cash deal at
      approximately 9.4x its FY2025 revenue of $1.167B. Critically, Confluent's revenue at an earlier
      stage (~$388M in FY2021) exhibited a gross margin of 64.6% — the closest historical analog to
      Aiven's current estimated margin profile at $109M ARR. As Confluent scaled to $1.17B, its gross
      margin expanded to 74.3%. If Aiven follows a comparable margin expansion trajectory, it could
      approach the 70%+ range needed to command M&A multiples above 8–10x. However, the IBM
      transaction removes IBM as a potential strategic acquirer for Aiven, and the next most credible
      strategic buyers (AWS, Google Cloud, Oracle, ServiceNow) have shown no public interest in
      acquiring a competing multi-cloud platform.


      MongoDB (MDB) at $24.7B market cap on $2.46B FY2026 revenue (22.8% growth, 71.75% gross margin)
      represents a comparable platform premium: MongoDB Atlas is a managed database-as-a-service at
      scale, growing at a rate consistent with Aiven's estimated trajectory. At ~10x NTM revenue,
      MongoDB is the upper end of the applicable public market range and would imply ~$1.09B for Aiven
      at current ARR — still 64% below the $3B stale mark. Elastic (ESTC), with $1.68B LTM revenue at
      17.3% growth and $5.63B market cap (~3.4x), represents the compression floor for managed
      search/analytics infrastructure facing AI competitive pressure — a plausible downside scenario if
      hyperscaler alternatives accelerate their capture of Aiven's segment. Datadog ($79.61B on $3.67B
      TTM revenue, 21.7x) is included for completeness but is not a directly applicable multiple —
      Datadog's premium reflects 30%+ growth, 29% FCF margin, and observability category leadership,
      none of which Aiven can demonstrate.


      ClickHouse's $15B private valuation (September 2024, $400M Series D led by Dragoneer) provides
      a data point for OLAP analytics segment multiples. However, ClickHouse's valuation implies a
      significant AI-driven OLAP premium that may not transfer to Aiven's more diversified,
      lower-growth profile. The blended comp range excluding Datadog yields approximately 7–8x
      EV/revenue as a median, applying equal weight to IBM-Confluent (9.4x), MongoDB (10x), and
      Elastic (3.4x). At 7–8x, Aiven's fair value is $763–$872M — approximately 71–75% below the
      $3B stale mark.
