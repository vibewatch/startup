  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: aiven-gross-margin
      missingEvidence: "Audited or board-approved gross margin waterfall for FY2023–FY2025, broken down by service type and delivery model (standard vs. BYOC)"
      whyItMatters: "Gross margin is the primary determinant of achievable exit multiple; without confirmation that GM is above 65%, the base-case exit at 7–10x ARR may be optimistic; if GM is below 50%, the entire investment thesis collapses"
      diligencePath: "Data room: audited P&L; management accounts; CFO interview on cost structure; BYOC fee contribution"
      relatedQuestionRefs:
        - QV012
        - QV020
      relatedTableRefs:
        - TV004

    - type: private-evidence-only
      severity: blocking
      topic: aiven-NRR
      missingEvidence: "Net revenue retention (NRR) and gross revenue retention (GRR) by cohort, by quarter, for at least 6 trailing cohorts; logo churn rate"
      whyItMatters: "NRR is the most important single metric for a subscription infrastructure business; without NRR, the ARR growth narrative cannot be assessed for quality; if NRR is below 100%, growth is not compounding and the valuation case weakens materially"
      diligencePath: "Data room: NRR/GRR schedule; CRM export of ARR by customer vintage; management interview"
      relatedQuestionRefs:
        - QV013

    - type: private-evidence-only
      severity: blocking
      topic: aiven-cash-runway
      missingEvidence: "Cash balance as of December 2025 or March 2026; trailing 6-month operating cash burn; any undisclosed debt or bridge facilities; EverSQL acquisition cost"
      whyItMatters: "4-year absence of disclosed financing creates binary risk: either Aiven is near breakeven (positive) or relying on a rapidly depleting Series D balance (negative); the difference is material to any investment thesis"
      diligencePath: "Data room: board-approved financial statements; CFO interview; bank statement confirmation; legal review for undisclosed liabilities"
      relatedQuestionRefs:
        - QV030

    - type: private-evidence-only
      severity: material
      topic: aiven-cap-table
      missingEvidence: "Certified cap table showing all share classes, liquidation preference amounts by series, anti-dilution provisions, and management option pool vested and outstanding"
      whyItMatters: "Without the cap table, waterfall analysis at exit cannot be modeled accurately; the preference stack from $420M of cumulative raises may consume the majority of proceeds at exit values below $1.5B"
      diligencePath: "Company counsel; data room: certified cap table and preference waterfall model; investor rights agreements review"
      relatedQuestionRefs:
        - QV021

