figures:
  - id: FV001
    title: Recommendation Logic — Chain from Evidence to Investment Decision (Aiven, May 2026)
    type: flow
    layout: wide
    summary: >-
      The recommendation logic flows from revenue proof and market opportunity (positive signals)
      through financial opacity and valuation staleness (negative signals) to a conditional outcome:
      pass at $3B, conditionally proceed at 5–8x ARR with data room confirmation.
    data:
      nodes:
        - id: revenue-proof
          label: "Revenue Proof: $109M ARR (Mar 2026)"
          detail: "Company confirmed >$100M July 2025; ARR Club $109M est.; 11-service multi-cloud platform; BYOC enterprise traction"
          tone: positive
        - id: market-opportunity
          label: "Market Opportunity: $8–12B SAM, 20–25% CAGR"
          detail: "Multi-cloud open-source DBaaS; 56% of enterprises use 2+ clouds; Aiven is the only cloud-neutral multi-service provider"
          tone: positive
        - id: product-moat
          label: "Product Moat: Breadth + BYOC Portability"
          detail: "11 managed services on AWS/GCP/Azure; BYOC removes infra cost; EverSQL AI SQL layer; portable by design"
          tone: positive
        - id: financial-opacity
          label: "Financial Opacity: No GM, NRR, Audit, or Cash Balance"
          detail: "Gross margin estimated 55–65%; NRR unverified; no audited P&L; 4-year funding gap; cash runway unknown"
          tone: warning
        - id: valuation-staleness
          label: "Valuation Staleness: $3B = 27.5x ARR (May 2022)"
          detail: "Public comps: Elastic 3.4x, Confluent M&A 9.4x, MongoDB 10x, Datadog 21.7x; stale mark has no 2026 anchor"
          tone: warning
        - id: competitive-pressure
          label: "Competitive Pressure: Hyperscalers + IBM/Confluent"
          detail: "AWS MSK, Google AlloyDB, Azure Event Hubs via billing integration; IBM-Confluent removes best M&A comp; ClickHouse at $15B signals focused specialists command premium"
          tone: warning
        - id: exit-path
          label: "Exit Path: IPO 2027–28 or M&A Strategic"
          detail: "CEO stated IPO intent Oct 2021; no S-1 filed; CFO/CRO hires suggest readiness; strategic acquirers include AWS, Google, Oracle, ServiceNow"
          tone: neutral
        - id: entry-at-3b
          label: "At $3B Entry: ALL SCENARIOS NEGATIVE"
          detail: "Bear: -73 to -87% loss. Base: -33 to -60% loss. Bull: near par to modest gain. Expected return negative across weighted scenarios."
          tone: warning
        - id: entry-at-5-8x
          label: "At 5–8x ARR Entry (~$545–872M): CONDITIONAL PASS"
          detail: "Bear: 0.6–1.2x (near break-even). Base: 1.8–3.1x. Bull: 4.3–6.9x. Pending data room confirmation."
          tone: positive
        - id: recommendation
          label: "RECOMMENDATION: DO NOT INVEST at $3B; CONDITIONAL PASS at 5–8x ARR"
          detail: "Data room required: GM, NRR, runway, cap table. Minimum entry: $500–800M secondary or primary down-round."
          tone: warning
      edges:
        - from: revenue-proof
          to: entry-at-5-8x
          label: supports
        - from: market-opportunity
          to: entry-at-5-8x
          label: supports
        - from: product-moat
          to: entry-at-5-8x
          label: supports
        - from: financial-opacity
          to: entry-at-3b
          label: drives negative return
        - from: valuation-staleness
          to: entry-at-3b
          label: drives negative return
        - from: competitive-pressure
          to: entry-at-3b
          label: amplifies risk
        - from: exit-path
          to: entry-at-5-8x
          label: conditioned on
        - from: entry-at-3b
          to: recommendation
          label: unjustifiable
        - from: entry-at-5-8x
          to: recommendation
          label: conditionally viable
    approximationNotes: >-
      Return estimates are analyst projections based on public comp multiples and estimated ARR
      trajectory. Weighted expected return is not calculated due to scenario probability uncertainty.
    claimRefs:
      - CV007
      - CV021
      - CV022
      - CV025
      - CV032
      - CV041

