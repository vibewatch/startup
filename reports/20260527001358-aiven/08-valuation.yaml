  - id: scenario-analysis
    title: Bull / Base / Bear Scenario Analysis and Return Profiles
    body: >-
      Scenario analysis is structured around three levers: ARR growth trajectory (through 2028–2029),
      exit gross margin (which determines the achievable multiple), and exit mechanism (IPO vs.
      strategic M&A vs. financial secondary). All scenarios assume Aiven's current ARR base of ~$109M
      (March 2026).


      In the base case, Aiven maintains approximately 20–25% CAGR through 2028, reaching $170–200M
      ARR at an IPO or strategic transaction. A comparable public market multiple at IPO — 7–10x NTM
      revenue for a profitable-trajectory managed data infrastructure company — implies a $1.2–$2.0B
      IPO valuation, with secondary entry at 5–8x ARR generating a 2–4x gross return over a 3–4 year
      hold. This scenario is achievable but requires: (a) no further revenue growth deceleration; (b)
      demonstrated gross margin improvement toward 65–70%; and (c) a favorable IPO window for data
      infrastructure companies, which remains uncertain as Elastic's compressed ~3.4x multiple
      demonstrates that the market is not uniformly rewarding infrastructure SaaS in 2026.


      The bull case requires growth re-acceleration to 28–35% CAGR, BYOC penetration improving
      blended gross margin to 68–72%, and a strategic M&A exit at 10–14x revenue (comparable to
      IBM-Confluent at 9.4x plus a competitive premium from 2–3 strategic bidders). At $250–$300M
      ARR in 2028–2029 and 10–14x NTM revenue, the exit valuation reaches $2.5–$4.2B. For an
      investor entering at 5–7x ARR (~$545–763M), this generates approximately 3–5x gross return —
      competitive with top-quartile infrastructure VC outcomes. The prerequisite conditions are
      individually plausible but collectively improbable under current competitive and capital market
      conditions.


      The bear case assumes growth slows to 10–15% — consistent with the 2023 revenue-below-estimates
      signal — and a primary raise is required at a significantly lower valuation. At 10–15% CAGR,
      Aiven reaches $130–155M ARR by 2027, but with compressed public market comparable multiples
      (3–5x for Elastic-like growth deceleration), the implied exit value is $390–775M. Investors at
      $3B face losses of 74–87%. Even for secondary investors at 5–7x ARR, a bear-case exit at 3–5x
      ARR produces at best a 1x return and likely a partial loss.


      Across all scenarios, the $3B stale entry mark generates negative expected returns. The
      investment framework is binary: either the company demonstrates a credible path to $200M+ ARR
      at 65%+ gross margin through a data room, or the valuation must be reset to 5–8x ARR before
      any new capital commitment makes financial sense.
