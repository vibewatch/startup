summary:
  headline: >-
    Aiven has credible product breadth, enterprise customer proof, and multi-cloud differentiation, but the stale $3B
    2022 mark is not investable in 2026 given opaque financials, heavy competitive pressure, and uncertain capital
    adequacy.
