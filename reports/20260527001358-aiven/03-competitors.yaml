        - "Unknown"
        - Monthly consumption or annual commitment with volume discounts
        - Scales to enterprise at $100M+ annual spend; competitive moat from connector ecosystem
      - - Neon (serverless PostgreSQL)
        - Compute-hours (autoscaled) + storage-GiB + branch storage ($1.50/branch-month overage)
        - Free tier (scale-to-zero, 0.5 CU max)
        - "No"
        - Free / Launch ($19/mo) / Scale ($69/mo) / custom enterprise
        - Scale-to-zero eliminates dev/test idle costs; challenges Aiven's always-on pricing for low-traffic workloads
      - - ClickHouse Cloud
        - Usage-based (compute-time + storage-bytes); autoscale up and down; scale-to-zero
