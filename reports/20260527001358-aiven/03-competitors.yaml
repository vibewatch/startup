callouts:
  - calloutType: risk
    title: Confluent's Category-Scale Revenue Lead Is Structural
    body: >-
      Confluent's $1.167B FY2025 revenue at 21% YoY growth represents a structural lead in managed Apache Kafka
      that Aiven for Apache Kafka is unlikely to overcome given Aiven's multi-service GTM model. Confluent's 120+
      connectors, Kora cloud-native engine, and $400M+ annual Kafka-specific product investment create a moat depth
      in event streaming that Aiven cannot replicate while simultaneously investing in 10+ other database services.
      Diligence should determine what percentage of Aiven's ARR is derived from Aiven for Kafka versus other services.
    claimRefs:
      - CP001
      - CP026
      - CP027
  - calloutType: strength
    title: OSS License Displacement Events Are a Recurring Structural Tailwind
    body: >-
      The Elastic ELv2 change and Redis SSPL adoption both closed hyperscaler managed-service paths and channeled
      customers to OSS-compatible forks (OpenSearch, Valkey). Aiven is structurally positioned to win these
      displacement events before hyperscalers can build compliant alternatives. If the PostgreSQL community or
      Apache Kafka project were to adopt a more restrictive license, Aiven's OSS-only fidelity policy and
      multi-cloud managed service platform would make it a primary beneficiary of the resulting displacement.
    claimRefs:
      - CP039
      - CP040
      - CP045

