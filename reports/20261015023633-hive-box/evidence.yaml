evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-and-cap-table
    missingEvidence: >-
      An updated valuation mark, debt or credit balances, round-by-round cap table, and any secondary or redemption cash
      obligations.
    whyItMatters: >-
      Without current valuation and capital-structure evidence, later valuation work cannot distinguish paper mark
      inflation from real downside protection or dilution.
    diligencePath: >-
      Request the latest financing documents, board materials, banker deck, and cap-table reconciliation that bridge the
      2021 round to the lapsed 2024-2025 IPO process.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: headquarters-and-governance
    missingEvidence: A primary record that confirms the legal headquarters, registered office, board composition, and voting structure.
    whyItMatters: >-
      Headquarters ambiguity and missing governance detail weaken jurisdiction, control, and related-party analysis in
      later chapters.
    diligencePath: >-
      Pull the full filed prospectus entity list, registry records, and current board roster rather than relying on
      secondary company-profile pages.
    relatedQuestionRefs:
      - QO002
      - QO003
      - QO008
    relatedTableRefs:
      - TO001
      - TO002
  - type: missing-source
    severity: material
    topic: asia-forge-litigation
    missingEvidence: >-
      The Hong Kong pleadings, timetable, settlement posture, and precise downside map for enforcing the redemption
      claim.
    whyItMatters: >-
      The redemption dispute appears to be the clearest direct blocker to IPO timing, ownership stability, and possibly
      liquidity.
    diligencePath: >-
      Obtain the share purchase agreement, court filings, and management counsel memo summarizing exposure, reserve
      accounting, and negotiation status.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing-gaps
    missingEvidence: >-
      A current third-party estimate of China's smart-locker and locker-software market in value terms, ideally
      separated into locker hardware, software, and service layers.
    whyItMatters: >-
      Without a value-based benchmark, the chapter can bound activity and reach but cannot defend a precise TAM, SAM, or
      SOM for valuation work.
    diligencePath: >-
      Obtain current analyst, trade-association, or prospectus sources that isolate smart-locker spend and
      software/services mix in China.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: >-
      Customer-level contract data showing who pays for deployments, software seats, community hosting, and any direct
      consumer fees.
    whyItMatters: >-
      Budget ownership drives adoption speed, gross-margin quality, and whether the payer can tolerate user-consent
      friction.
    diligencePath: >-
      Request sample commercial contracts, procurement documents, or disclosed case studies that specify payer, pricing
      unit, and renewal logic.
    relatedQuestionRefs:
      - QM003
      - QM004
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: channel-adoption
    missingEvidence: A consistent annual time series for parcel-locker adoption using the same denominator and methodology.
    whyItMatters: >-
      The 2018 parcel-volume lens and 2019 storage-box channel lens are directionally useful but not directly
      comparable.
    diligencePath: >-
      Pull State Post Bureau or equivalent time-series data that aligns parcel volume, locker penetration, and installed
      base by year.
    relatedQuestionRefs:
      - QM002
      - QM006
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: competitor-pricing
    missingEvidence: >-
      Current public pricing, contract structure, and published locker-network metrics for Cainiao, JD Logistics, and SF
      Express alternatives.
    whyItMatters: >-
      Without rival commercial disclosures, the chapter can test positioning logic but cannot quantify relative pricing
      power or discounting pressure.
    diligencePath: >-
      Review current product and pricing pages, enterprise sales decks, or customer procurement records for the named
      incumbents' locker and out-of-home delivery offerings.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Cohort retention, locker occupancy, repeat-usage, and community churn data that would quantify whether residents
      or couriers actually stick with the network after policy changes.
    whyItMatters: Competitive durability depends on real switching friction, not just installed hardware density.
    diligencePath: >-
      Request cohort usage data, contract-renewal rates with couriers or communities, and post-policy utilization
      changes from management or diligence materials.
    relatedQuestionRefs:
      - QP007
      - QP008
  - type: stale
    severity: minor
    topic: market-share
    missingEvidence: >-
      An independent, recent market-share study for China's smart-locker sector after the 2019 and 2024 datapoints in
      the assigned pool.
    whyItMatters: >-
      The chapter can show Hive Box's scale, but it cannot cleanly benchmark whether incumbent responses have materially
      narrowed the gap since those older disclosures.
    diligencePath: >-
      Obtain a recent industry report or regulator dataset that attributes current locker-footprint share across major
      operators.
    relatedQuestionRefs:
      - QP004
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Current cash balance, debt schedule, project-finance obligations, working-capital bridge, and management's runway
      view.
    whyItMatters: >-
      Without balance-sheet detail, the assigned evidence cannot show whether the 2024 profit inflection is enough to
      self-fund expansion or whether another financing event is required.
    diligencePath: >-
      Request the latest prospectus financial statements or management reporting package with cash, debt, capex, and
      monthly cash-flow detail.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Current courier fee cards, recipient-fee take-up, SaaS contract pricing, and discount/rebate policy by customer or
      courier cohort.
    whyItMatters: >-
      List pricing and historical tariffs do not show actual monetization quality or elasticity under competitive or
      regulatory pressure.
    diligencePath: Request current commercial schedules, sample customer contracts, and realized pricing waterfalls by stream.
    relatedQuestionRefs:
      - QI003
      - QI007
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin by stream, CAC, payback, churn or retention, advertiser repeat-spend, and customer concentration.
    whyItMatters: >-
      These metrics determine whether the recent profit improvement is operationally durable or still dependent on
      accounting, mix, or one-off factors.
    diligencePath: Request cohort-level operating KPIs, margin bridges, and customer concentration schedules tied to the IPO model.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public repository activity, package/download metrics, API forum traffic, or a practitioner-community proxy
      confirming external technical adoption of the API and SDK layer.
    whyItMatters: >-
      The chapter brief explicitly asks for developer-signal or a close practitioner proxy, and without it the
      integration story remains company-described rather than externally validated.
    diligencePath: >-
