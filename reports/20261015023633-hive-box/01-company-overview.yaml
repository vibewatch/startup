company:
  name: "Hive Box"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Hive Box is a 2015-founded smart parcel locker operator whose strongest public evidence shows nationwide Chinese network scale, late-stage private funding, and a still-unresolved Hong Kong IPO path. The current fact base is anchored by the 2024 IPO filing metrics, Yicai's 2025 litigation update, and earlier customer-trust and regulatory incidents, while valuation, legal-HQ attribution, board composition, and current customer/headcount metrics remain under-disclosed."
sections:
  - id: "identity-scale"
    title: "Identity and operating scale"
    body: "Hive Box's retained public record consistently points to the same core business even when legal-entity descriptors vary. Tracxn describes the company as a provider of tech-enabled parcel locker solutions and SaaS tools for last-mile pickup and drop-off management, while Hive Box's own product page describes modular smart parcel lockers that support courier drop-off and consumer pickup flows. The biggest unresolved identity issue is headquarters attribution rather than business model: Tracxn lists Hong Kong, China, but Yicai's IPO coverage calls the company Shenzhen-based. Operationally, the company had already reached national Chinese scale by mid-2024, and older public reporting shows meaningful parcel throughput years before the IPO attempt. That combination makes Hive Box large enough to matter in last-mile logistics, but later chapters should treat legal domicile, current customer count, and headcount as diligence gaps rather than settled facts."
    claimRefs: ["CO001", "CO002", "CO003", "CO004", "CO005", "CO006", "CO016"]
    tableRefs: ["TO001"]
  - id: "leadership-ownership-funding"
    title: "Leadership, ownership, and funding"
    body: "Leadership and control are concentrated around the founders and the SF ecosystem. Tracxn identifies Wei Wang and Yubin Xu as co-founders and lists Xu as the current chief executive, while Yicai's 2024 IPO article says SF founder Wang Wei was the largest shareholder with a 36.5 percent stake at filing. Public financing evidence is directionally rich but still incomplete on valuation and cap-table mechanics. Tracxn reports $1.08 billion of cumulative funding across three rounds, with the latest Series C dated January 2021, and Yicai adds that Hive Box raised $400 million in 2021 from several investors including Asia Forge Cayman. The company therefore looks like a late-stage private platform with real institutional backing, but not yet a transparently disclosed governance stack."
    claimRefs: ["CO007", "CO008", "CO009", "CO010"]
    tableRefs: ["TO002", "TO003"]
  - id: "ipo-path-and-adverse-overhang"
    title: "Milestones, IPO path, and adverse overhang"
    body: "The current investment story is defined less by launch novelty than by whether Hive Box can convert scale into a clean listing path. Yicai reported that Hive Box filed for a Hong Kong IPO in August 2024, then let the prospectus lapse in February 2025 without refiling by the time of its October 2025 follow-up. That same follow-up tied the delay to an Asia Forge redemption dispute and Hong Kong lawsuit, while also noting prior CSRC questions around VIE and compliance disclosures. Earlier public controversies show that governance and stakeholder management have been recurring execution themes: the 2020 storage-fee backlash forced a policy reversal around user consent, and MLex recorded a separate 2020 SAMR fine tied to deal-notification compliance. For this chapter, the net result is clear scale with a still-fragile governance and listing narrative."
    claimRefs: ["CO005", "CO006", "CO011", "CO012", "CO013", "CO014", "CO015"]
    figureRefs: ["FO001"]
