    notes: "This table separates visible public pricing from actual commercial realization; blanks reflect missing public evidence rather than zero pricing."
    claimRefs: [CI007, CI008, CI010, CI011]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / public status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["2023 revenue", "CNY3.8 billion", "Medium", "Confirms scale and a meaningful growth base before the IPO filing", "Obtain the prospectus financial statements and revenue split by stream / geography"]
      - ["2023 net income / loss", "Net loss of CNY541.5 million", "Medium", "Shows the business was still unprofitable on a full-year basis even after revenue growth", "Reconcile statutory loss to EBITDA, operating cash flow, and maintenance capex"]
      - ["5M 2024 profit inflection", "CNY71.6 million profit versus CNY313.8 million loss a year earlier", "Medium", "Signals operating leverage, but only on a partial-year basis", "Verify whether the improvement came from utilization, pricing, accounting changes, or one-offs"]
      - ["Current gross margin by stream", null, "Low", "Gross margin determines whether locker density and software expansion translate into durable earnings", "Provide gross margin for locker operations, storage fees, ads, and SaaS separately"]
      - ["CAC / payback / channel economics", null, "Low", "Sales efficiency matters if Hive Box is expanding overseas and into SaaS-led deployments", "Provide acquisition cost, sales cycle, payback, and partner commission data by channel"]
      - ["Current debt, working capital, and capex burden", null, "Low", "Balance-sheet pressure could reverse the reported profit improvement", "Provide cash balance, debt schedule, project-finance obligations, capex plan, and working-capital bridge"]
    notes: "Null values mark underwriting-critical data that the assigned public evidence does not disclose; they are diligence asks, not zeroes."
    claimRefs: [CI003, CI004, CI011, CI012, CI013, CI014]
