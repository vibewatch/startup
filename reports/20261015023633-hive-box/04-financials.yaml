callouts:
  - calloutType: insight
    title: Turnaround evidence is real, but still mostly top-line plus prospectus-summary level
    body: "Yicai's 2024 prospectus summary is enough to show sharp revenue growth and a partial-year move into profit, but the assigned public evidence does not yet disclose segment gross margin, cash conversion, or debt burden well enough for a full underwriting model."
    claimRefs: [CI003, CI004, CI013]
  - calloutType: risk
    title: Monetization is diversified, yet pricing power remains politically and operationally sensitive
    body: "Hive Box has more than one revenue lever, but the 2020 storage-fee backlash and historical inability of fees plus advertising to cover costs show that utilization and customer consent matter as much as nominal tariff design."
    claimRefs: [CI010, CI011, CI012]
