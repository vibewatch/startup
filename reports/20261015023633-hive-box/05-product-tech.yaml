      - ["Open IoT / API / SDK layer", "Enterprise integrators", "Publicly described capability", "Supports device connection, remote management, APIs, and SDK-based integration", "Need public API docs depth, versioning cadence, and external usage proof"]
      - ["Managed services and ads", "Enterprise operators and advertisers", "Live marketed service bundle", "One-stop hosting plus locker-body, full-screen, and banner ad inventory", "Need revenue mix and attach-rate evidence by service line"]
    notes: Official product pages and the 2022 expo release describe scope; maturity here means publicly marketed/live versus roadmap, not audited usage depth.
    claimRefs: [CE001, CE002, CE004, CE005]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Hive Box solution
      - Measurable benefit
      - Limitation
    rows:
      - ["Courier parcel drop-off", "Courier reaches recipient location and needs unattended handoff", "Locker login, waybill scan, recipient input, cell selection, drop-off", "Reduces failed doorstep attempts and compresses delivery time per stop", "No public queue-time or utilization data in this pool"]
      - ["Consumer parcel pickup", "Recipient must coordinate pickup after drop-off", "SMS notice plus pickup via code, Bluetooth, or remote door opening", "24/7 self-service pickup and lower missed-delivery friction", "No independent evidence on pickup latency or failed retrieval rates"]
      - ["Consumer send-from-locker", "User prepares parcel and waits for courier collection", "Sending code, payment, drop-off at any Hive Box locker, courier collects later", "Turns lockers into both inbound and outbound last-mile nodes", "No public proof of volume mix or repeat-usage rates"]
      - ["Enterprise locker operations", "Operator must manage devices, services, and monetization", "Hosted hardware/software stack plus ads and managed service layer", "Potential operating leverage from a shared control plane", "No public SLA, staffing, or gross-margin disclosure in this pool"]
    notes: Benefits are directional inferences from the documented workflow and should not be read as audited KPI outcomes.
    claimRefs: [CE003, CE004, CE013]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - ["Locker hardware modules", "Physical parcel storage and access interface", "Modular cabinet footprint, cell configuration, and field installation", "Hardware uptime, vandalism, and maintenance burden are not independently quantified"]
      - ["Embedded / endpoint software", "Coordinates locker behavior and pickup interactions", "Connectivity plus user-facing pickup methods across code, Bluetooth, and remote opening", "No public release cadence, defect history, or rollback evidence in this pool"]
      - ["IoT platform, APIs, and SDKs", "Connects devices and exposes management functions to enterprise applications", "Protocol/network support, API consumption, and developer implementation by operators", "Public API depth and external developer adoption are unverified here"]
      - ["Managed operations layer", "Wraps deployment guidance, services, and monetization around the stack", "Project management, support operations, and partner execution", "No public SLA, ticket-volume, or customer-success evidence in this pool"]
    notes: Architecture rows summarize only capabilities explicitly described in the assigned sources and flag where public operating proof is missing.
    claimRefs: [CE002, CE005, CE006]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Public materials describe Hive Box as a layered hardware, SaaS, IoT, and managed-service platform.
    data:
      layers:
        - label: End-user and courier touchpoints
          detail: Pickup, drop-off, and send-parcel interactions at the locker edge.
          modules:
            - Courier login and waybill scan
            - Recipient SMS notification
            - Pickup via code, Bluetooth, or remote door opening
            - User-entered sending code and payment flow
        - label: Locker hardware layer
          detail: Modular cabinet footprint with disclosed S, M, and L compartment sizes.
          modules:
            - Main module and column module
            - 20kg / 30kg / 40kg max-load compartments
            - Simple site-specific installation positioning
        - label: Software control plane
          detail: Hive Box Flexi spans the computer web, locker application, and mobile app.
          modules:
            - Web terminal
            - Locker application
            - Mobile app
          outputs:
            - Consumer pickup orchestration
            - Operator workflow control
        - label: Open IoT integration layer
          detail: Public pages describe device connection, communication, remote management, APIs, and SDKs.
          modules:
            - Device connection
            - Communication
            - Device management
            - API
            - SDK
        - label: Managed service and monetization layer
          detail: Hosted operations extend beyond cabinets into service operations and value-added inventory.
          modules:
            - Basic service
            - Value-added service
            - Third-party platform integration
            - Advertising inventory
          outputs:
            - Parcel collection and delivery
            - Storage and collection services
        - label: Expansion and deployment layer
          detail: Independent and company-issued sources tie the stack to lower-tier-city, overseas, and customized-project rollouts.
          modules:
            - Lower-tier city expansion
            - Overseas market expansion
            - Customized international projects
    approximationNotes: null
    claimRefs: [CE003, CE005, CE006, CE014]
callouts:
  - calloutType: strength
    title: Product breadth is broader than locker hardware alone
    body: >-
      The assigned pool consistently shows Hive Box selling an integrated stack of lockers,
      software, IoT interfaces, and managed operations, which can widen monetization and make
      deployments harder to displace than a single-SKU hardware vendor.
    claimRefs: [CE001, CE005, CE006]
  - calloutType: risk
    title: Public control proof lags product-scope claims
    body: >-
      The product surface is easy to observe, but the strongest non-company evidence in this
      pool is a consent and pricing backlash rather than technical reliability or security
      validation, leaving enterprise-control quality under-evidenced.
    claimRefs: [CE011, CE012]
