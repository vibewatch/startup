  evidenceGaps:
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Public repository activity, package/download metrics, API forum traffic, or a practitioner-community proxy confirming external technical adoption of the API and SDK layer.
      whyItMatters: The chapter brief explicitly asks for developer-signal or a close practitioner proxy, and without it the integration story remains company-described rather than externally validated.
      diligencePath: Request public repository/package metrics or customer integration references, or add practitioner-community evidence from public talks, forums, or partner engineering posts.
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: material
      topic: security-controls
      missingEvidence: Current security or privacy certifications, uptime/status history, incident disclosures, and contractual SLA evidence tied to the locker and IoT control plane.
      whyItMatters: Trust, safety, security, privacy, and quality controls are required chapter dimensions and directly affect enterprise deployment and property-owner acceptance risk.
      diligencePath: Collect trust-center materials, certification certificates, status-history evidence, and sample customer security/SLA schedules.
      relatedQuestionRefs: [QE006]
    - type: missing-source
      severity: material
      topic: deployment-reliability
      missingEvidence: Published uptime, maintenance KPIs, installation timelines, hardware failure rates, and support-operations evidence for live operator deployments.
      whyItMatters: Public product pages describe workflow breadth, but they do not prove whether the operating model performs reliably at fleet scale.
      diligencePath: Request fleet-operating reports, outage history, field-maintenance KPIs, and reference calls with deployed operators.
      relatedQuestionRefs: [QE004]
