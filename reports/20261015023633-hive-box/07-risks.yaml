callouts:
  - calloutType: risk
    title: Highest-consequence diligence priorities
    body: >-
      The fastest thesis-break checks are whether 2024 profitability survives audited review, whether
      consent controls are measurably enforced in courier operations, and whether any new regulatory,
      consumer-rights, or transaction-filing issue has emerged since the 2024 prospectus.
    claimRefs: [CR001, CR003, CR006, CR007, CR012, CR014]
  - calloutType: recommendation
    title: Near-term kill criteria
    body: >-
      Treat a renewed loss trajectory, fresh regulator action on consent or M&A process, or evidence
      of material site removals and partner friction as investment-negative until the company can
      show durable profit, compliant growth, and stable deployment density.
    claimRefs: [CR001, CR004, CR006, CR007, CR013]
