  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitute workflow
        blocks:
          - type: paragraph
            body: >
              Hive Box is not just a hardware vendor: its own materials frame the company as a provider of intelligent
              hardware, software, and cloud-sharing services for terminal express operations, which makes the relevant
              market broader than parcel lockers alone. The included spend appears to cover locker hardware deployment,
              operating software, mobile and cloud tooling, and related value-added logistics services for operators
              that want to run self-service pickup and drop-off networks. The excluded spend is traditional door-to-door
              delivery, general e-commerce logistics, and other last-mile workflows that never use a shared locker node.
              Status-quo substitutes therefore remain courier doorstep delivery and manual handoff, which independent
              reporting shows many residents still prefer when consent or pickup timing is mishandled.
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM010
              - CM011
      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >
              The public evidence supports sizing by activity and installed-base proxies rather than by a single
              revenue-market estimate. KR-Asia cited Hive Box's own 2018 disclosure that 2.5 billion parcels were picked
              up through its lockers, or about 5 percent of China's 50.71 billion courier parcels that year. People's
              Daily later cited State Post Bureau data saying around 406,000 storage boxes were installed nationally in
              2019 and about 10 percent of parcels went through storage boxes rather than direct handoff, while Yicai
              reported that Hive Box's 2024 prospectus showed 330,200 lockers, 29.9 million compartments, and service
              reach into 209,000 communities. Those are useful boundary markers, but they mix different years, units,
              and measurement methods, so they should be treated as constrained market lenses rather than a precise
              TAM/SAM/SOM bridge.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
