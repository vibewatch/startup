    title: Company milestone timeline
    type: timeline
    summary: Public milestones show fast domestic scale-up followed by consumer, regulatory, and IPO-friction events.
    data:
      items:
        - date: '2015-01-01'
          label: Company founded
          detail: Public retained sources date Hive Box's founding to 2015.
          tone: positive
          claimRefs:
            - CO001
        - date: '2017-01-06'
          label: First disclosed funding round
          detail: Tracxn dates the first funding round to January 6, 2017.
          tone: positive
          claimRefs:
            - CO007
        - date: '2018-01-01'
          label: Series B reported
          detail: Tracxn's round table shows a January 2018 Series B before the 2021 Series C.
          tone: positive
          claimRefs:
            - CO007
        - date: '2018-12-31'
          label: Early network usage milestone
          detail: >-
            KrASIA reported 2.5 billion parcel pickups in 100+ cities during 2018, equal to about 5% of national courier
            parcels.
          tone: positive
          claimRefs:
            - CO016
        - date: '2020-05-15'
          label: Fee backlash forces policy change
          detail: >-
            After a user boycott and consent complaints, Hive Box apologized and extended free storage from 12 to 18
            hours.
          tone: warning
          claimRefs:
            - CO014
        - date: '2020-12-14'
          label: SAMR fine recorded
          detail: MLex reported a 500,000 yuan SAMR fine over the unnotified China Post Smart Logistics deal.
          tone: risk
          claimRefs:
            - CO015
        - date: '2021-01-08'
          label: Series C / 2021 raise
          detail: Tracxn dates the latest round to January 8, 2021, and Yicai says Hive Box raised $400 million that year.
          tone: positive
          claimRefs:
            - CO007
            - CO008
        - date: '2024-05-31'
          label: National network reaches 330,200 lockers
          detail: By May 31, 2024, Yicai said Hive Box served 209,000 communities with 29.9 million compartments.
          tone: positive
          claimRefs:
            - CO005
        - date: '2024-08-30'
          label: Hong Kong IPO filing
          detail: Hive Box filed its Hong Kong IPO prospectus on Aug. 30, 2024.
          tone: positive
          claimRefs:
            - CO011
        - date: '2025-02-28'
          label: Prospectus lapse
          detail: Yicai's 2025 follow-up said the 2024 filing lapsed in February 2025 without a supplementary submission.
