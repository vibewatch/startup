      - number: '6.2'
        title: Named proof shows real usage, but much of the positive evidence is still company-led
        blocks:
          - type: paragraph
            body: >-
              The strongest named positive proof in the assigned pool is the Stasher relationship. Hive Box said the
              first UK luggage-storage lockers were already live in London, Manchester, and Edinburgh and that the
              program should scale materially from the initial batch, which is stronger than a mere logo slide. However,
              the rest of the chapter's named evidence is uneven: the official site describes the apartment workflow but
              does not identify reference customers, and public overseas expansion proof outside the Stasher release is
              still largely company-authored. Independent proof is stronger on the existence of customer usage than on
              monetization quality, because adverse community reactions, petitions, and threatened suspensions were
              easier to verify than renewals or satisfaction metrics.
            claimRefs:
              - CU003
