      - number: '4.2'
        title: Pricing and monetization evidence
        blocks:
          - type: paragraph
            body: >-
              Pricing evidence in the assigned pool is strongest for the controversial recipient-storage fee introduced
              in 2020, not for current realized commercial terms. China Daily and People's Daily both reported that Hive
              Box charged recipients 0.5 yuan for each additional 12-hour storage period after the free window, capped
              at 3 yuan, and China Daily also noted that deliverymen had already been paying for locker usage before the
              recipient fee was added. Those same China Daily reports are financially important because they say fees
              from deliverymen plus advertising income were still insufficient to cover operating and maintenance costs
              at that time. In other words, public pricing evidence shows that Hive Box can monetize several points in
              the flow, but it does not show that those prices reliably clear the network's fixed-cost burden.
            claimRefs:
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI002
            claimRefs:
              - CI007
              - CI008
              - CI010
              - CI011
      - number: '4.3'
        title: Margin signals and unit economics
        blocks:
          - type: paragraph
            body: >-
              The clearest public financial inflection comes from the 2024 IPO reporting summarized by Yicai. That
              article says revenue rose 52 percent to CNY3.8 billion in 2023, net loss narrowed to CNY541.5 million from
              CNY2.1 billion in 2021, and the first five months of 2024 turned from a CNY313.8 million loss to a CNY71.6
              million profit. Even so, the margin path is still hard to underwrite from this source set alone.
              Smartkarma explicitly warned that a depreciation-policy change 'muddies the waters,' while older press
              coverage shows large historical losses and sensitivity to pricing backlash. The public picture therefore
              supports a turnaround narrative, but not a clean explanation of gross margin by stream, utilization
              economics by locker cohort, or durable free-cash-flow conversion.
            claimRefs:
              - CI003
              - CI004
              - CI011
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI004
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Capital adequacy and underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              Capital need is easier to identify than capital adequacy. Tracxn says Hive Box raised $1.09 billion across
              three rounds, including a $400 million Series B at a $3 billion post-money valuation in January 2021, and
              Yicai says the 2024 Hong Kong IPO filing would fund lower-tier-city and overseas expansion, out-of-home
              logistics capabilities, R&D, and strategic investment. That is enough to conclude the business still
              expects external capital to accelerate growth and product breadth. It is not enough to answer whether the
              current balance sheet can absorb debt obligations, working-capital swings, or another period of pricing
              pressure. Without current cash, debt, capex, customer concentration, or CAC/payback disclosure in the
              assigned public evidence, the financial verdict is improving trajectory but incomplete underwritability.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI013
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Turnaround evidence is real, but still mostly top-line plus prospectus-summary level
            body: >-
              Yicai's 2024 prospectus summary is enough to show sharp revenue growth and a partial-year move into
              profit, but the assigned public evidence does not yet disclose segment gross margin, cash conversion, or
              debt burden well enough for a full underwriting model.
            calloutType: insight
            claimRefs:
              - CI003
              - CI004
              - CI013
          - type: callout
            title: Monetization is diversified, yet pricing power remains politically and operationally sensitive
            body: >-
              Hive Box has more than one revenue lever, but the 2020 storage-fee backlash and historical inability of
              fees plus advertising to cover costs show that utilization and customer consent matter as much as nominal
              tariff design.
            calloutType: risk
            claimRefs:
              - CI010
