      - number: '1.3'
        title: Milestones, IPO path, and adverse overhang
        blocks:
          - type: paragraph
            body: >-
              The current investment story is defined less by launch novelty than by whether Hive Box can convert scale
              into a clean listing path. Yicai reported that Hive Box filed for a Hong Kong IPO in August 2024, then let
              the prospectus lapse in February 2025 without refiling by the time of its October 2025 follow-up. That
              same follow-up tied the delay to an Asia Forge redemption dispute and Hong Kong lawsuit, while also noting
              prior CSRC questions around VIE and compliance disclosures. Earlier public controversies show that
              governance and stakeholder management have been recurring execution themes: the 2020 storage-fee backlash
              forced a policy reversal around user consent, and MLex recorded a separate 2020 SAMR fine tied to
              deal-notification compliance. For this chapter, the net result is clear scale with a still-fragile
              governance and listing narrative.
