      - number: '6.3'
        title: Durability, expansion economics, and concentration remain under-disclosed
        blocks:
          - type: paragraph
            body: >-
              The available sources support a clear adoption thesis but a weaker durability thesis. Public reporting and
              company releases document a network measured in hundreds of thousands of lockers and meaningful parcel
              throughput, and Yicai's prospectus summary suggests management still expects growth from lower-tier
              Chinese cities and overseas expansion. What remains missing is the revenue-quality layer: no source in the
              assigned pool discloses renewal rates, churn, contract length, net revenue retention, top-customer
              concentration, or advertiser repeat-spend. Even the 2025 Caproasia IPO-delay coverage focused on investor
              litigation and historical scale descriptors rather than fresh customer metrics. For diligence, that means
              the commercial case is still dependent on footprint and rollout narratives instead of verified cohort
              durability.
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU008
