chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating scale
        blocks:
          - type: paragraph
            body: >-
              Hive Box's retained public record consistently points to the same core business even when legal-entity
              descriptors vary. Tracxn describes the company as a provider of tech-enabled parcel locker solutions and
              SaaS tools for last-mile pickup and drop-off management, while Hive Box's own product page describes
              modular smart parcel lockers that support courier drop-off and consumer pickup flows. The biggest
              unresolved identity issue is headquarters attribution rather than business model: Tracxn lists Hong Kong,
              China, but Yicai's IPO coverage calls the company Shenzhen-based. Operationally, the company had already
              reached national Chinese scale by mid-2024, and older public reporting shows meaningful parcel throughput
              years before the IPO attempt. That combination makes Hive Box large enough to matter in last-mile
              logistics, but later chapters should treat legal domicile, current customer count, and headcount as
              diligence gaps rather than settled facts.
