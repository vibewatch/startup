          - type: callout
            title: Resident consent friction can erode a scaled network
            body: >-
              The 2020 fee backlash shows that a dense locker footprint and courier demand do not guarantee resident
              goodwill, so expansion proof should not be mistaken for retention proof.
            calloutType: risk
