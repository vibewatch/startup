  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >
      The market can be bounded with parcel-volume, channel-share, market-share, and installed-base layers, but the
      sources do not support a single comparable revenue bridge.
    data:
      items:
        - label: China courier parcel base
          displayValue: 50.71bn
          unit: courier parcels delivered in China (2018)
          note: Broadest demand base cited by KrASIA.
          claimRefs:
            - CM005
        - label: Locker-channel adoption
          displayValue: ~10%
          unit: of parcels put into storage boxes (2019)
          note: People's Daily cited State Post Bureau data; not directly comparable to 2018 company volume.
          claimRefs:
            - CM006
        - label: Domestic smart-box installed base
          displayValue: 406,000
          unit: smart storage boxes in 2019
          note: National installed-base lens rather than spend.
          claimRefs:
            - CM006
        - label: Hive Box domestic share
          displayValue: ~44%
          unit: of domestic smart locker market in 2019
          note: Category share, not category value.
          claimRefs:
            - CM007
        - label: Hive Box parcel volume
          displayValue: 2.5bn
          unit: parcels picked up via Hive Box lockers (2018)
          note: Company-reported activity quoted by KrASIA.
          claimRefs:
            - CM005
        - label: Current Hive Box footprint
          displayValue: 330,200 lockers
          unit: 29.9m compartments; 209,000 communities (2024/current)
          note: Current network scale helps bound serviceable reach.
          claimRefs:
            - CM003
            - CM004
    approximationNotes: >
      These layers intentionally mix parcels, market share, and installed-base metrics as directional sizing proxies
      because the public record does not isolate a current value-based TAM, SAM, or SOM for Hive Box.
    claimRefs:
      - CM003
      - CM005
      - CM006
      - CM007
      - CM013
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      This ordinal map uses the assigned evidence to compare last-mile control and locker-platform specialization; it is
      a positioning aid, not a source-published benchmark.
    data:
      points:
        - label: Hive Box
          x: 5
          'y': 5
          detail: >-
            Highest density and specialization in the assigned evidence: 330,200 lockers, 29.9 million compartments, and
            a parcel-locker-plus-SaaS stack.
          claimRefs:
            - CP002
            - CP003
        - label: Cainiao Network
          x: 4
          'y': 2
          detail: >-
            Named as a key competitor, but the assigned evidence does not disclose a comparable locker-footprint or
            pricing readout.
          claimRefs:
            - CP005
        - label: JD Logistics
          x: 4
          'y': 2
          detail: >-
            Named as a key competitor, but the assigned evidence does not disclose a comparable locker-footprint or
            pricing readout.
          claimRefs:
            - CP005
        - label: SF Express
          x: 4
          'y': 3
          detail: >-
            Broad courier-network relevance is visible in the assigned evidence because SF backed Hive Box at founding,
            but standalone locker economics are not disclosed here.
          claimRefs:
            - CP001
            - CP005
        - label: Direct doorstep delivery
          x: 2
          'y': 1
          detail: >-
            Lower locker specialization but still strong as a substitute because residents can prefer direct delivery
            and object to non-consensual locker use.
          claimRefs:
            - CP006
            - CP008
        - label: White-label / internal build
          x: 3
          'y': 4
          detail: >-
            Hive Box's own SaaS pitch shows operators can launch a locker network without buying servers or hiring
            in-house R&D staff, making build-vs-buy a live alternative path.
          claimRefs:
            - CP012
    approximationNotes: >-
      The axes are evidence-backed ordinal scores rather than published market metrics: higher X means more control over
      last-mile distribution density, and higher Y means greater specialization in locker-platform workflows.
    claimRefs:
      - CP002
      - CP003
      - CP005
      - CP006
