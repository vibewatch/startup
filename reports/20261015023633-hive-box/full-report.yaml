        - from: throughput
          to: recipient-fees
          label: Delayed pickup can create user fees
          claimRefs:
            - CI010
        - from: throughput
          to: software-services
          label: Network know-how packaged into SaaS
          claimRefs:
            - CI007
            - CI008
        - from: courier-fees
          to: cost-burden
          label: Fee revenue still must cover network opex
          claimRefs:
            - CI011
        - from: recipient-fees
          to: cost-burden
          label: Pricing pressure affects monetization durability
          claimRefs:
            - CI010
            - CI012
        - from: software-services
          to: profit-outcome
          label: Higher-margin upside is possible but unquantified
          claimRefs:
            - CI007
            - CI008
            - CI013
        - from: cost-burden
          to: profit-outcome
          label: Cost absorption determines conversion to profit
