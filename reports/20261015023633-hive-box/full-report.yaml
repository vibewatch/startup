        title: Operating architecture and integration model
        blocks:
          - type: paragraph
            body: >-
              The most concrete architecture evidence in the assigned pool is still company-authored. Hive Box says its
              locker software spans web, locker-resident, and mobile terminals, and it describes an open IoT layer for
              device connection, communications, device management, API exposure, and SDK-based integration. The product
              pitch also frames the stack as a managed platform that can connect both Hive Box and third-party lockers.
              This supports a view of the business as a control-plane and integration layer wrapped around owned or
              customer-operated hardware, although published implementation depth remains thin.
            claimRefs:
