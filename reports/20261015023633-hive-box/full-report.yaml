  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation stays at track because operating proof is real but valuation support and downside-protection
      detail lag the business evidence.
    data:
      nodes:
        - id: scale
          label: Scale proof
          detail: Largest-network framing plus 209,000 communities and 330,200 lockers.
        - id: growth
          label: Growth proof
          detail: Revenue rose to CNY3.812 billion in 2023 and 5M24 revenue grew 33.6% year on year.
        - id: leverage
          label: Profit inflection
          detail: 5M24 flipped from a prior-year loss to a reported CNY71.6 million profit.
        - id: optionality
          label: Expansion optionality
          detail: Filing-era use of proceeds and company statements emphasize lower-tier and overseas expansion.
        - id: friction
          label: Consumer or regulatory friction
          detail: 2020 fee backlash, consent pressure, and the SAMR fine constrain exit confidence.
        - id: pricing
          label: Price-discovery gap
          detail: Retained public evidence does not show a current round price, IPO range, or preference stack.
        - id: decision
          label: 'Recommendation: track'
          detail: Wait for updated terms and refreshed financial proof before underwriting an entry.
      edges:
        - from: scale
          to: growth
          label: Scale supports revenue relevance
        - from: growth
          to: leverage
          label: Revenue quality matters
        - from: leverage
          to: pricing
          label: Better performance still needs a price test
        - from: optionality
          to: pricing
          label: Optionality is not the same as priced value
        - from: friction
          to: pricing
          label: Risks widen discount needed
        - from: pricing
          to: decision
          label: No buy without terms
    approximationNotes: >-
      Qualitative decision flow only; the figure intentionally does not infer a numerical valuation bridge from
      non-comparable public inputs.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV006
      - CV007
      - CV009
      - CV012
      - CV014
