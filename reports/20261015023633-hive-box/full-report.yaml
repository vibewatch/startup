        title: Deployment maturity, scale, and roadmap
        blocks:
          - type: paragraph
            body: >-
              Independent and company-issued sources together indicate a mature operating footprint, but they do not
              validate every performance claim equally. Dealroom describes a large installed network across China, and
              KR-Asia captured Hive Box's historical claim of billions of parcel pickups and coverage in more than one
              hundred cities. Separately, Hive Box's 2022 expo release tied the product story to overseas customization
              projects, and a 2024 Shenzhen Daily report said the IPO plan would fund lower-tier-city expansion,
              overseas growth, stronger out-of-home capabilities, and additional R&D. Scale is therefore plausible, but
