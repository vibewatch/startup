  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows multiple monetization points from parcel throughput to software services, but cost
      absorption still determines whether scale converts into profit.
    data:
      nodes:
        - id: throughput
          label: Locker throughput
          value: 330.2k lockers / 29.9m compartments by May 2024; 2.5b parcels handled in 2018
          note: Scale proxy rather than revenue.
          claimRefs:
            - CI002
            - CI009
        - id: courier-fees
          label: Courier locker-service fees
          value: Existing revenue stream
          note: Current tariff undisclosed.
          claimRefs:
            - CI010
        - id: recipient-fees
          label: Recipient storage fees
          value: 0.5 yuan / 12h; 3 yuan cap in 2020
          note: Backlash forced policy concessions.
          claimRefs:
            - CI010
        - id: software-services
          label: SaaS and integration services
          value: Pay-on-demand software and implementation
          note: Commercial offer visible; adoption economics undisclosed.
          claimRefs:
            - CI007
            - CI008
        - id: cost-burden
          label: Operating and maintenance burden
          value: Historically heavy enough to keep the business loss-making
          note: Advertising plus fee income once failed to cover costs.
          claimRefs:
            - CI011
            - CI012
        - id: profit-outcome
          label: Reported revenue and profit outcome
          value: CNY3.8b 2023 revenue; 5M 2024 profit inflection
          note: Accounting comparability still flagged by outside analysts.
          claimRefs:
            - CI003
            - CI004
            - CI013
      edges:
        - from: throughput
          to: courier-fees
          label: Parcel deposits generate operator fees
          claimRefs:
