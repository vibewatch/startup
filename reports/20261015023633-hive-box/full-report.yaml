  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: |-
              The evidence supports a price-sensitive watchlist posture rather than a buy call. Third-party
              September 2024 coverage ties Hive Box to a Hong Kong IPO filing, presents the company as the
              largest smart-locker-network operator at filing, and shows a large installed base plus a clear
              revenue ramp from 2021 through 2024 year-to-date. Those points matter because they show that the
              business is not a concept-stage story: it has national network density, meaningful package volume,
              and an operating model that reached first-time profitability in the first five months of 2024.
              The problem is valuation support, not the existence of a business.

              The same public set is not enough to underwrite a 2026 entry price. The retained financing
              evidence establishes an IPO filing and ownership context, but it does not surface an offer range,
              a completed listing outcome, a new priced round, or current preference and debt terms. Without
              those facts, the prudent stance is track with medium confidence, high risk, and a stretched
              valuation view: the company may be improving operationally, yet the investor cannot tell whether
              that improvement is already fully priced or whether downside protections are weak.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
