        title: Leadership, ownership, and funding
        blocks:
          - type: paragraph
            body: >-
              Leadership and control are concentrated around the founders and the SF ecosystem. Tracxn identifies Wei
              Wang and Yubin Xu as co-founders and lists Xu as the current chief executive, while Yicai's 2024 IPO
              article says SF founder Wang Wei was the largest shareholder with a 36.5 percent stake at filing. Public
              financing evidence is directionally rich but still incomplete on valuation and cap-table mechanics. Tracxn
              reports $1.08 billion of cumulative funding across three rounds, with the latest Series C dated January
              2021, and Yicai adds that Hive Box raised $400 million in 2021 from several investors including Asia Forge
              Cayman. The company therefore looks like a late-stage private platform with real institutional backing,
