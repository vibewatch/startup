              - CM006
              - CM007
              - CM013
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >
              The sources point to a multi-sided buying process. On the operator side, Hive Box markets a SaaS stack,
              hardware access, and operational guidance to enterprises with terminal dispatch needs, while also naming
              carrier companies, national postal operators, and e-commerce partners as part of its connected ecosystem.
              On the user side, residents and parcel recipients are the practical users of the lockers, and their
              willingness to retrieve from a shared box affects turnover and network utility. The payer is more likely
              to be the network operator, logistics partner, or community deployment sponsor than the end consumer,
              because the company emphasizes pay-on-demand system deployment rather than consumer subscription. Adoption
              therefore runs through operator procurement first, then user acceptance at the community or building
              level.
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >
              The market drivers are clear: courier volume growth, households that are not home for daytime delivery,
              privacy-sensitive recipients, and operator demand for a lower-labor handoff point all favor shared locker
              infrastructure. Hive Box's current installed base and its international project references suggest the
              company can extend that logic into overseas postal and residential use cases. The constraints are equally
              material. Consumer-consent rules and backlash to late fees show that locker convenience does not
              automatically translate into pricing power, and the MLex-reported SAMR fine shows that market expansion
              can still trigger regulatory scrutiny. Combined with the absence of a public paid-volume or segment
              revenue split, those frictions matter to both adoption timing and valuation confidence.
            claimRefs:
              - CM006
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Installed density is the clearest proof point
            body: >
              The best-supported market evidence is not a generic TAM number but Hive Box's demonstrated locker
              footprint and parcel throughput, which show real adoption of out-of-home delivery in China at meaningful
              scale.
            calloutType: strength
            claimRefs:
              - CM003
              - CM004
              - CM005
          - type: callout
            title: Adoption is gated by consent and monetization
            body: >
              The same market that values convenience can still reject direct consumer monetization or forced locker
              usage, so consent rules and backlash matter as much as parcel-volume growth.
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
              - CM012
