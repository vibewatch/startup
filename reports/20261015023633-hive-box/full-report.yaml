            title: Near-term kill criteria
            body: >-
              Treat a renewed loss trajectory, fresh regulator action on consent or M&A process, or evidence of material
              site removals and partner friction as investment-negative until the company can show durable profit,
              compliant growth, and stable deployment density.
            calloutType: recommendation
