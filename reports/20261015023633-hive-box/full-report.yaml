      - number: '7.3'
        title: Site access, ecosystem control, and expansion complexity drive residual exposure
        blocks:
          - type: paragraph
            body: >-
              Hive Box depends on counterparties that can each constrain growth in different ways. Community committees
              and residents can challenge locker placement or suspend use when consent and price expectations break
              down, so deployment density is partly governed outside the company's direct control. Courier behavior is
              also a dependency because the recipient-consent issue emerges when couriers optimize their own workflow by
              defaulting parcels into lockers. At the ownership and strategy layer, Yicai's 2024 prospectus summary
              still places SF founder Wang Wei at 36.5 percent ownership, and the company's international push relies on
              partners such as Kerry Logistics while broadening the product set into SaaS and overseas projects. Those
              moves may expand optionality, but they also widen execution scope away from the core domestic locker
              network. The cleanest kill criteria are monitorable: failure to sustain audited profitability, renewed
              regulatory action on consent or transaction filing, or evidence that site losses and partner frictions are
              slowing network growth faster than new deployments can offset them.
            claimRefs:
              - CR008
              - CR010
              - CR011
              - CR013
              - CR014
