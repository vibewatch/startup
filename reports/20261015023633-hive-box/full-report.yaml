  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and customer-consent risk is already proven, not hypothetical
        blocks:
          - type: paragraph
            body: >-
              Hive Box already carries a documented enforcement history around transaction process and a separate public
              record of consent-driven consumer backlash. MLex reported that SAMR fined the company CNY500,000 for
              failing to notify its China Post Smart Logistics acquisition even though the regulator concluded the deal
              had no anticompetitive impact, which means legal execution discipline around strategic transactions is a
              live risk rather than a theoretical checklist item. In parallel, China Daily and People's Daily tied the
              2020 fee-policy backlash to express-delivery rules requiring recipient choice over locker use, while The
              China Project and People's Daily showed communities were willing to boycott or suspend lockers when they
              believed Hive Box or couriers were monetizing a service consumers had not affirmatively chosen. The
              mitigation evidence is real but reactive: Hive Box apologized, extended the free storage window, and
              promised consent-based locker deposits only after regulatory and public pressure. Underwriting should
              therefore treat any future pricing, exclusivity, or M&A move as requiring explicit evidence of filing
              discipline, courier-consent controls, and community acceptance before assuming revenue uplift is durable.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR012
