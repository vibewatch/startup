      - number: '5.4'
        title: Controls, trust, and key technical risks
        blocks:
          - type: paragraph
            body: >-
              The clearest public control-risk evidence in this pool comes from operating-policy backlash rather than
              from technical audit disclosures. China Daily reported that Hive Box had to apologize in 2020, extend its
              free pickup window, and require consumer consent before locker placement after fee and consent complaints
              triggered broad criticism. That matters because the product depends on user trust, courier behavior, and
              property-level acceptance. The assigned pool does not independently verify uptime, security
              certifications, privacy controls, or external developer adoption for the API and SDK layer, so
              enterprise-grade control quality remains a material diligence question.
            claimRefs:
              - CE011
              - CE012
