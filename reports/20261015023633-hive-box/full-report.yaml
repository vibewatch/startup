      - number: '8.2'
        title: Financing context, comparables, and scenario framing
        blocks:
          - type: paragraph
            body: |-
              Hive Box's strongest valuation support comes from commercialization proof rather than price
              discovery. Pandaily and Yicai both frame the 2024 filing around a market-leading locker network,
              while KrASIA and PR Newswire add older but still useful evidence that the model had significant
              parcel throughput and overseas expansion ambition before the filing. Office Snapshots' 2025
              headquarters profile is not valuation evidence by itself, but it does show visible operating
              continuity rather than obvious retrenchment after the filing window. In other words, the retained
              record supports the case that Hive Box remains a serious operating platform with expansion options.

              What the retained record does not provide is a clean comparable-based or transaction-based range
              for 2026. The worker therefore uses conditional scenarios instead of false precision. In the bull
              case, an updated prospectus or new round would need to show that the 2024 growth and profit
              inflection translated into durable margin and cleaner exit terms. In the base case, scale exists
              but public price discovery remains stale, so the correct action is still to monitor rather than
              underwrite. In the bear case, consumer-friction or regulatory issues interact with stale financing
              terms and push the next financing or listing step into down-round territory.
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV009
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: Diligence asks, downside triggers, and exit readiness
        blocks:
          - type: paragraph
            body: |-
              The biggest reason not to convert this file into a buy recommendation is that downside can be seen
              more clearly than entry valuation. The 2020 fee-policy backlash shows that monetization changes
              can trigger organized user resistance, and both China Daily coverage and legal commentary tie
              locker use to customer-consent expectations. MLex adds a separate governance and regulatory signal:
              SAMR fined Hive Box for failing to notify an acquisition. None of these items alone kills the case,
              but together they increase the chance that a future listing or financing must clear heavier
              diligence on compliance, governance, and customer practice than a clean SaaS-style growth story
              would face.

              The practical diligence path is therefore straightforward. Before paying up, investors need the
              current prospectus or round deck, audited post-2024 financials, a cap-table and preference-stack
              schedule, debt and redemption detail, and a cohort-quality read on customer concentration, repeat
              monetization, and consent-sensitive churn. Failure to produce those items should keep the company
              in track or research-more territory; a materially weaker growth or margin print, new regulatory
              action, or evidence of punitive financing terms would move the case toward avoid.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Track until new price discovery arrives
            body: >-
              Public evidence proves meaningful scale and better operating leverage, but it does not prove that a 2026
              investor can enter at a fair price or with acceptable downside protection.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
          - type: callout
            title: The underwriting gap is terms, not existence of demand
            body: >-
              The next diligence cycle has to resolve listing or round terms, cap-table overhang, and whether prior
              consent and governance issues are isolated or structural.
            calloutType: risk
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
