      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Installed base is proven; retention economics are not
            body: >-
              Hive Box's public footprint is large enough to show real customer adoption, but the chapter's strongest
              unresolved issue is the absence of disclosed renewal, churn, and concentration metrics.
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
