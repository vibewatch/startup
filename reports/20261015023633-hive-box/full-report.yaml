      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-consequence diligence priorities
            body: >-
              The fastest thesis-break checks are whether 2024 profitability survives audited review, whether consent
              controls are measurably enforced in courier operations, and whether any new regulatory, consumer-rights,
              or transaction-filing issue has emerged since the 2024 prospectus.
            calloutType: risk
            claimRefs:
