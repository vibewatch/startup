  - id: FE001
    title: Product architecture map
    type: stack
    summary: Public materials describe Hive Box as a layered hardware, SaaS, IoT, and managed-service platform.
    data:
      layers:
        - label: End-user and courier touchpoints
          detail: Pickup, drop-off, and send-parcel interactions at the locker edge.
          modules:
            - Courier login and waybill scan
            - Recipient SMS notification
            - Pickup via code, Bluetooth, or remote door opening
            - User-entered sending code and payment flow
        - label: Locker hardware layer
          detail: Modular cabinet footprint with disclosed S, M, and L compartment sizes.
          modules:
            - Main module and column module
            - 20kg / 30kg / 40kg max-load compartments
            - Simple site-specific installation positioning
        - label: Software control plane
          detail: Hive Box Flexi spans the computer web, locker application, and mobile app.
          modules:
            - Web terminal
            - Locker application
            - Mobile app
          outputs:
            - Consumer pickup orchestration
            - Operator workflow control
        - label: Open IoT integration layer
          detail: Public pages describe device connection, communication, remote management, APIs, and SDKs.
          modules:
            - Device connection
            - Communication
            - Device management
            - API
            - SDK
        - label: Managed service and monetization layer
          detail: Hosted operations extend beyond cabinets into service operations and value-added inventory.
          modules:
            - Basic service
            - Value-added service
            - Third-party platform integration
            - Advertising inventory
          outputs:
            - Parcel collection and delivery
            - Storage and collection services
        - label: Expansion and deployment layer
          detail: >-
            Independent and company-issued sources tie the stack to lower-tier-city, overseas, and customized-project
            rollouts.
          modules:
            - Lower-tier city expansion
            - Overseas market expansion
            - Customized international projects
    approximationNotes: null
    claimRefs:
      - CE003
      - CE005
      - CE006
      - CE014
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Hive Box sells into host operators and channels, then depends on resident or traveler usage to expand each
      deployment surface.
    data:
      items:
        - label: Courier and host placement
          actor: Courier networks and community or venue hosts
          touchpoints:
            - Locker site selection
            - Operational placement approval
          note: >-
            The domestic network is anchored in community parcel lockers, while overseas programs rely on local hosts
            and channels.
        - label: Resident or traveler onboarding
          actor: Residents or travelers
          touchpoints:
            - Delivery notification
            - QR code or access code retrieval
          note: The product workflow only works when end users accept locker pickup as a legitimate handoff method.
        - label: Enterprise workflow management
          actor: Property managers, apartment owners, or venue operators
          touchpoints:
            - Package inflow monitoring
            - Tracking and rerouting
            - Operational reporting
          note: >-
            Official materials position Hive Box as a software-plus-hardware operating tool, not just a locker
            manufacturer.
        - label: Traffic concentration and repeat use
          actor: High-frequency residential communities
          touchpoints:
            - Parcel drop-off
            - Pickup turnover
          note: >-
            Historic parcel-volume evidence suggests the installed base can drive meaningful throughput where density is
            high.
        - label: International channel expansion
          actor: Named partners such as Stasher
          touchpoints:
            - Venue sourcing
            - Local demand routing
            - Joint deployment
          note: >-
            The Stasher relationship turns a platform partner into both a route-to-market channel and a reference
            account.
        - label: Durability test
          actor: Residents, communities, and regulators
          touchpoints:
            - Consent to locker delivery
            - Storage-fee tolerance
            - Community petitions
          note: 2020 backlash shows the expansion loop can stall when end-user consent and pricing are mishandled.
    approximationNotes: The journey map reflects authored stage order and role transitions rather than a measured conversion funnel.
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU007
      - CU010
      - CU012
      - CU014
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      The highest residual exposure clusters around consent-driven site access and the still-fragile economics of a very
      large locker footprint.
    data:
      columns:
        - label: Likelihood
          note: Based on whether public evidence shows the risk has already materialized.
        - label: Impact
          note: Assesses downside to monetization, growth, or underwriting confidence.
        - label: Mitigation maturity
          note: High means public evidence shows a repeatable control, not a one-off concession.
        - label: Residual exposure
          note: Overall residual risk after observed mitigations in the assigned sources.
      rows:
        - label: Consent and site-access backlash
          note: Communities and regulators can directly affect locker placement and pricing acceptance.
          values:
            - label: High
              tone: warning
            - label: High
              tone: warning
            - label: Medium
              tone: neutral
            - label: High
              tone: warning
        - label: Operating economics and monetization durability
          note: Profitability improved, but the public record still shows a short operating-proof window.
          values:
            - label: Medium
              tone: neutral
            - label: High
              tone: warning
            - label: Medium
              tone: neutral
            - label: High
              tone: warning
        - label: Transaction and regulatory execution
          note: The verified SAMR penalty keeps filing discipline in scope for future deals and listings.
          values:
            - label: Medium
              tone: neutral
            - label: Medium
              tone: neutral
            - label: Medium
              tone: neutral
            - label: Medium
              tone: neutral
        - label: Partner and control dependence
          note: Expansion and governance still rely on ecosystem partners and a concentrated control structure.
          values:
            - label: Medium
              tone: neutral
            - label: Medium
              tone: neutral
            - label: Low
              tone: positive
            - label: Medium
              tone: neutral
        - label: Adoption and reporting visibility gap
          note: Independent utilization and retention evidence remains thinner than public scale claims.
          values:
            - label: Medium
              tone: neutral
            - label: Medium
              tone: neutral
            - label: Low
              tone: positive
            - label: Medium
              tone: neutral
        - label: International rollout complexity
          note: Overseas partnerships and product expansion broaden execution scope beyond the core China network.
          values:
            - label: Medium
              tone: neutral
            - label: Medium
              tone: neutral
            - label: Low
              tone: positive
            - label: Medium
              tone: neutral
    approximationNotes: Qualitative cells summarize the cited evidence rather than a numeric scoring model.
    claimRefs:
