      - number: '7.2'
        title: Operating leverage is improving, but the economics and independent verification are still fragile
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports progress, but not a fully derisked model. China Daily said Hive Box had been
              loss-making since 2016, while Yicai still reported a CNY541.5 million net loss in 2023 before a first
              reported profit in the first five months of 2024. That trajectory is encouraging, yet it also implies the
              operating model only recently crossed into public profitability after years of subsidy and maintenance
              burden. The 2020 pricing controversy matters because it shows one obvious monetization lever—charging
              recipients for storage—can trigger backlash severe enough to threaten locker access and brand trust.
              Independent measurement remains another weak point: KR Asia explicitly said there was no third-party data
              showing the full picture of adoption, so public investors still lack strong outside validation of current
              utilization, retention, and service quality. The immediate diligence implication is that management's 2024
              profit inflection should be tested against audited statements, machine utilization, site-removal rates,
              and complaint trends before treating scale as a durable moat.
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR009
              - CR012
              - CR015
