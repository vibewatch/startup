  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base spans courier networks, property operators, and new travel channels
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a multi-sided customer map rather than a single buyer profile. On the domestic
              parcel network, couriers and community hosts drive locker placement while residents are the end users who
              retrieve parcels; Yicai's 2024 prospectus coverage and older KR Asia reporting both indicate very large
              installed and usage bases. Hive Box's own site also markets apartment and property managers on a
              software-plus-hardware workflow, showing a B2B sale wrapped around a consumer pickup experience. The 2026
              Stasher announcement broadens the surface again: hotels, stations, airports, and tourist centers become
              deployment venues, while travelers become the user cohort and the named platform partner becomes the
              channel into those sites.
