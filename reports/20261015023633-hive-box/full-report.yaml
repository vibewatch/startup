        title: Product surface and workflow coverage
        blocks:
          - type: paragraph
            body: >-
              Official English-language materials show Hive Box positioning itself as a multi-sided logistics platform
              rather than a single hardware appliance. The disclosed offer combines modular parcel-locker hardware,
              Flexi SaaS, and enterprise operating services. Public workflow descriptions cover courier drop-off,
              consumer pickup, and user-initiated parcel sending, while the service catalog also extends to advertising
              inventory and hosted operations. That means the product should be diligence-tested as a bundled
              hardware-plus- software operating system for last-mile logistics, not merely as installed cabinets.
