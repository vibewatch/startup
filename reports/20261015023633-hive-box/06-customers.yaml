chapter:
  number: 6
  title: "Customers"
  summary: "Hive Box has clear evidence of scaled adoption and live international expansion: independent 2024 reporting cited 330,200 lockers across 209,000 Chinese communities, while a 2026 company release claimed more than 400,000 smart locker units worldwide and a live UK rollout with Stasher. The customer-quality problem is that public proof remains much stronger for deployment footprint than for retention or expansion economics, and 2020 backlash over user consent and storage fees shows resident goodwill can break even when courier-side efficiency is real."
sections:
  - id: "customer-base-and-installed-footprint"
    title: "Customer base spans courier networks, property operators, and new travel channels"
    body: "Public evidence points to a multi-sided customer map rather than a single buyer profile. On the domestic parcel network, couriers and community hosts drive locker placement while residents are the end users who retrieve parcels; Yicai's 2024 prospectus coverage and older KR Asia reporting both indicate very large installed and usage bases. Hive Box's own site also markets apartment and property managers on a software-plus-hardware workflow, showing a B2B sale wrapped around a consumer pickup experience. The 2026 Stasher announcement broadens the surface again: hotels, stations, airports, and tourist centers become deployment venues, while travelers become the user cohort and the named platform partner becomes the channel into those sites."
    claimRefs: ["CU001", "CU002", "CU004", "CU005", "CU006", "CU007", "CU008"]
    tableRefs: ["TU001", "TU002"]
    figureRefs: ["FU001"]
  - id: "named-proof-shows-real-usage-but-mostly-company-led-reference-quality"
    title: "Named proof shows real usage, but much of the positive evidence is still company-led"
    body: "The strongest named positive proof in the assigned pool is the Stasher relationship. Hive Box said the first UK luggage-storage lockers were already live in London, Manchester, and Edinburgh and that the program should scale materially from the initial batch, which is stronger than a mere logo slide. However, the rest of the chapter's named evidence is uneven: the official site describes the apartment workflow but does not identify reference customers, and public overseas expansion proof outside the Stasher release is still largely company-authored. Independent proof is stronger on the existence of customer usage than on monetization quality, because adverse community reactions, petitions, and threatened suspensions were easier to verify than renewals or satisfaction metrics."
    claimRefs: ["CU003", "CU004", "CU009", "CU010", "CU011", "CU012", "CU014"]
    tableRefs: ["TU003"]
  - id: "durability-expansion-and-concentration-remain-under-disclosed"
    title: "Durability, expansion economics, and concentration remain under-disclosed"
    body: "The available sources support a clear adoption thesis but a weaker durability thesis. Public reporting and company releases document a network measured in hundreds of thousands of lockers and meaningful parcel throughput, and Yicai's prospectus summary suggests management still expects growth from lower-tier Chinese cities and overseas expansion. What remains missing is the revenue-quality layer: no source in the assigned pool discloses renewal rates, churn, contract length, net revenue retention, top-customer concentration, or advertiser repeat-spend. Even the 2025 Caproasia IPO-delay coverage focused on investor litigation and historical scale descriptors rather than fresh customer metrics. For diligence, that means the commercial case is still dependent on footprint and rollout narratives instead of verified cohort durability."
    claimRefs: ["CU001", "CU002", "CU007", "CU008", "CU012", "CU013", "CU015"]
callouts:
  - calloutType: "insight"
    title: "Installed base is proven; retention economics are not"
    body: "Hive Box's public footprint is large enough to show real customer adoption, but the chapter's strongest unresolved issue is the absence of disclosed renewal, churn, and concentration metrics."
    claimRefs: ["CU001", "CU002", "CU007", "CU015"]
  - calloutType: "risk"
    title: "Resident consent friction can erode a scaled network"
    body: "The 2020 fee backlash shows that a dense locker footprint and courier demand do not guarantee resident goodwill, so expansion proof should not be mistaken for retention proof."
    claimRefs: ["CU009", "CU010", "CU011", "CU012"]
