    title: Competitive positioning map
    type: quadrant
    summary: >-
      This ordinal map uses the assigned evidence to compare last-mile control and locker-platform specialization; it is a positioning aid, not a source-published benchmark.
    data:
      points:
        - label: Hive Box
          x: 5
          y: 5
          detail: >-
            Highest density and specialization in the assigned evidence: 330,200 lockers, 29.9 million compartments, and a parcel-locker-plus-SaaS stack.
          claimRefs: [CP002, CP003]
        - label: Cainiao Network
          x: 4
          y: 2
          detail: >-
            Named as a key competitor, but the assigned evidence does not disclose a comparable locker-footprint or pricing readout.
          claimRefs: [CP005]
        - label: JD Logistics
          x: 4
          y: 2
          detail: >-
            Named as a key competitor, but the assigned evidence does not disclose a comparable locker-footprint or pricing readout.
          claimRefs: [CP005]
        - label: SF Express
          x: 4
          y: 3
          detail: >-
            Broad courier-network relevance is visible in the assigned evidence because SF backed Hive Box at founding, but standalone locker economics are not disclosed here.
          claimRefs: [CP001, CP005]
        - label: Direct doorstep delivery
          x: 2
          y: 1
          detail: >-
            Lower locker specialization but still strong as a substitute because residents can prefer direct delivery and object to non-consensual locker use.
          claimRefs: [CP006, CP008]
        - label: White-label / internal build
          x: 3
          y: 4
          detail: >-
            Hive Box's own SaaS pitch shows operators can launch a locker network without buying servers or hiring in-house R&D staff, making build-vs-buy a live alternative path.
          claimRefs: [CP012]
    approximationNotes: >-
      The axes are evidence-backed ordinal scores rather than published market metrics: higher X means more control over last-mile distribution density, and higher Y means greater specialization in locker-platform workflows.
    claimRefs: [CP002, CP003, CP005, CP006, CP008, CP012, CP013]
