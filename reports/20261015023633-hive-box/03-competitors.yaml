  evidenceGaps:
    - type: missing-source
      severity: material
      topic: competitor-pricing
      missingEvidence: Current public pricing, contract structure, and published locker-network metrics for Cainiao, JD Logistics, and SF Express alternatives.
      whyItMatters: Without rival commercial disclosures, the chapter can test positioning logic but cannot quantify relative pricing power or discounting pressure.
      diligencePath: Review current product and pricing pages, enterprise sales decks, or customer procurement records for the named incumbents' locker and out-of-home delivery offerings.
      relatedQuestionRefs: [QP003]
      relatedTableRefs: [TP003]
    - type: private-evidence-only
      severity: material
      topic: switching-costs
      missingEvidence: Cohort retention, locker occupancy, repeat-usage, and community churn data that would quantify whether residents or couriers actually stick with the network after policy changes.
      whyItMatters: Competitive durability depends on real switching friction, not just installed hardware density.
      diligencePath: Request cohort usage data, contract-renewal rates with couriers or communities, and post-policy utilization changes from management or diligence materials.
      relatedQuestionRefs: [QP007, QP008]
    - type: stale
      severity: minor
      topic: market-share
      missingEvidence: An independent, recent market-share study for China's smart-locker sector after the 2019 and 2024 datapoints in the assigned pool.
      whyItMatters: The chapter can show Hive Box's scale, but it cannot cleanly benchmark whether incumbent responses have materially narrowed the gap since those older disclosures.
      diligencePath: Obtain a recent industry report or regulator dataset that attributes current locker-footprint share across major operators.
      relatedQuestionRefs: [QP004]
