    columns:
      - 视角
      - 论点
      - 哪些变化会改变判断
    rows:
      - - 正论
        - 网络规模大且已获得商业验证，申报时管理层也如此定位，并覆盖全国广大地区。
        - 如果 2024 年之后的业务量或覆盖范围明显转弱，规模溢价就会受损。
      - - 正论
        - 收入增长和首次盈利表明运营杠杆可能兑现，而不只是停留在承诺上。
        - 如果更新后的经审计账目持续亏损，转折点论据就会失效。
      - - 反论
        - 保留的公开记录没有当前轮次价格、IPO 区间或清晰的优先股堆叠，因此无法检验入场纪律。
        - 如果更新后的招股书或轮次文件披露透明条款，判断可能迅速改善。
      - - 反论
        - 消费者同意反弹和此前的合并申报罚款，提高了治理和监管尽调拖延的可能性。
        - 如果证据表明控制、同意实践和法律遗留问题均已清理，风险会下降。
