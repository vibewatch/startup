  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开材料将 Hive Box 描述为分层的硬件、SaaS、IoT 和托管服务平台。
    data:
      layers:
        - label: 终端用户与快递员触点
          detail: 在柜机端完成取件、投件和寄件交互。
          modules:
            - 快递员登录与运单扫描
            - 收件人短信通知
            - 凭密码、蓝牙或远程开门取件
            - 用户输入寄件码并完成支付
        - label: 柜机硬件层
          detail: 模块化柜体，已披露 S、M、L 格口尺寸。
          modules:
            - 主模块与列模块
            - 20kg / 30kg / 40kg 最大载重格口
            - 简单的场地定制安装定位
        - label: 软件控制平面
          detail: Hive Box Flexi 覆盖电脑端网页、柜机应用和移动应用。
          modules:
            - 网页终端
            - 柜机应用
            - 移动应用
          outputs:
            - 消费者取件编排
            - 运营商工作流控制
        - label: 开放 IoT 集成层
          detail: 公开页面介绍设备连接、通信、远程管理、API 和 SDK。
          modules:
            - 设备连接
            - 通信
            - 设备管理
            - API
            - SDK
        - label: 托管服务与变现层
          detail: 托管运营不止覆盖柜体，也延伸到服务运营和增值库存。
          modules:
            - 基础服务
            - 增值服务
            - 第三方平台集成
            - 广告库存
          outputs:
            - 包裹收发
            - 存储与收取服务
        - label: 扩张与部署层
          detail: 独立来源和公司发布的来源都将该产品栈与低线城市、海外及定制项目的落地联系起来。
          modules:
            - 低线城市扩张
            - 海外市场扩张
            - 定制化国际项目
    approximationNotes: null
    claimRefs:
      - CE003
      - CE005
      - CE006
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Hive Box 面向托管运营商和渠道销售，随后依靠居民或旅客使用来扩大每个部署场景。
    data:
      items:
        - label: 快递员与场地方部署
          actor: 快递网络以及社区或场地主体
          touchpoints:
            - 柜机选址
            - 运营部署审批
          note: 国内网络以社区包裹柜为基础，海外项目则依赖当地场地方和渠道。
        - label: 居民或旅客入驻
          actor: 居民或旅客
          touchpoints:
            - 到货通知
            - 获取二维码或访问码
          note: 只有终端用户接受柜机取件这一合法交付方式，产品工作流才能运转。
        - label: 企业工作流管理
          actor: 物业经理、公寓业主或场地运营商
          touchpoints:
            - 包裹流入监控
            - 跟踪与改派
            - 运营报告
          note: 官方材料将 Hive Box 定位为软硬件结合的运营工具，而不只是柜机制造商。
        - label: 流量集中与重复使用
          actor: 高频住宅社区
          touchpoints:
            - 包裹投递
            - 取件周转
          note: 历史包裹量证据表明，在密度较高的地区，装机基数可以带来可观吞吐量。
        - label: 国际渠道扩张
          actor: Stasher 等具名合作伙伴
          touchpoints:
            - 场地搜寻
            - 本地需求分流
            - 联合部署
          note: Stasher 关系让平台合作伙伴同时成为市场进入渠道和标杆客户。
        - label: 持久性测试
          actor: 居民、社区和监管机构
          touchpoints:
            - 同意使用柜机配送
            - 对存储费的接受度
            - 社区请愿
          note: 2020 年的反弹表明，如果终端用户同意和定价处理不当，扩张循环可能停滞。
    approximationNotes: 旅程图反映作者设定的阶段顺序和角色转变，而非经过测量的转化漏斗。
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU007
      - CU010
      - CU012
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最高的剩余风险集中在由同意决定的场地准入，以及超大规模柜机网络仍较脆弱的经济性上。
    data:
      columns:
        - label: 可能性
          note: 根据公开证据判断风险是否已经发生。
        - label: 影响
          note: 评估对变现、增长或投资判断信心的下行影响。
        - label: 缓释成熟度
          note: 高表示公开证据显示已有可重复的控制措施，而非一次性让步。
        - label: 剩余风险
          note: 指定来源中观察到的缓释措施实施后，整体剩余风险水平。
      rows:
        - label: 同意与场地准入反弹
          note: 社区和监管机构可以直接影响柜机部署及对定价的接受度。
          values:
            - label: 高
              tone: warning
            - label: 高
              tone: warning
            - label: 中
              tone: neutral
            - label: 高
              tone: warning
        - label: 运营经济性与变现持久性
          note: 盈利能力有所改善，但公开记录显示运营证明窗口仍然很短。
          values:
            - label: 中
              tone: neutral
            - label: 高
              tone: warning
            - label: 中
              tone: neutral
            - label: 高
              tone: warning
        - label: 交易与监管执行
          note: 已核实的 SAMR 处罚意味着，未来交易和上市仍需关注申报纪律。
          values:
            - label: 中
              tone: neutral
            - label: 中
