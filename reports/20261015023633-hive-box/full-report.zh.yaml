              Hive Box 最强的估值支撑来自商业化证明，而非价格发现。Pandaily 和 Yicai 都将 2024 年申报描述为市场领先的柜机网络；KrASIA 和 PR Newswire
              则提供了更早但仍有用的证据，显示申报前模式已有显著包裹吞吐量和海外扩张意图。Office Snapshots 的 2025
              年总部资料本身不是估值证据，但确实显示申报窗口后仍在运营，没有明显收缩。换言之，保留记录支持 Hive Box 仍是有扩张选择的严肃运营平台。


              保留记录没有提供可用于 2026 年的干净可比公司或交易范围。因此，本报告采用条件情景而非虚假精确度。看涨情景要求更新后的招股书或新融资轮证明 2024
              年的增长和盈利拐点已转化为持久利润率和更清晰的退出条款。基准情景是规模存在，但公开价格发现仍陈旧，正确行动仍是观察而非做投资判断。悲观情景是消费者摩擦或监管问题与过时融资条款叠加，使下一次融资或上市步骤落入下轮融资区间。
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV009
