  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代流程
        blocks:
          - type: paragraph
            body: >
              Hive Box
              不只是硬件供应商：其自有材料将公司定位为面向末端快递运营的智能硬件、软件和云共享服务提供商，因此市场边界不只包括快递柜。纳入的支出似乎包括柜机部署、运营软件、移动及云工具，以及面向希望运营自助取寄网络的运营商的配套增值物流服务。排除项是传统送货上门、一般电商物流，以及完全不使用共享柜节点的其他末端流程。现状替代方案仍是快递员送货上门和人工交接；独立报道显示，当用户同意或取件时间处理不当时，许多居民仍偏好这些方式。
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM010
              - CM011
      - number: '2.2'
        title: 受证据约束的规模化视角
        blocks:
          - type: paragraph
            body: >
              公开证据支持用业务活动和存量部署代理指标估算，而不是采用单一收入市场规模。KR-Asia 引述 Hive Box 自己披露的 2018 年数据称，有 2.5B 件包裹通过其快递柜取出，约占中国当年 50.71B
              件快递的 5%。People's Daily 后来引用国家邮政局数据称，2019 年全国安装约 406,000 个存储柜，约 10% 的包裹经过存储柜而非直接交接；Yicai 则报道 Hive Box 的
              2024 年招股书显示其拥有 330,200 个柜机、29.9M 个格口，服务覆盖 209,000 个社区。这些数字可作为边界标记，但年份、单位和测量方法不同，应视为受约束的市场观察，而非精确的
              TAM/SAM/SOM 桥接。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM013
