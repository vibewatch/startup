      - number: '8.3'
        title: 尽调问题、下行触发因素与退出准备度
        blocks:
          - type: paragraph
            body: >-
              不把本文件转成买入建议，最大的原因是下行风险比入场估值更清晰。2020 年费用政策反弹表明变现变化可能引发有组织的用户抵制；China Daily 报道和法律评论都将柜机使用与客户同意预期联系起来。MLex
              还提供了独立的治理和监管信号：SAMR 因 Hive Box 未申报收购而罚款。这些事项单独看都不足以终结投资逻辑，但合在一起会提高未来上市或融资需经更严格的合规、治理和客户实践尽调的可能性。


              实际尽调路径很直接。在支付溢价前，投资者需要当前招股书或融资推介材料、2024
              年之后的经审计财务数据、股权结构表和优先股堆叠明细、债务及赎回细节，以及客户集中度、重复变现和对同意敏感的流失数据。若无法提供这些材料，公司应继续处于跟踪或继续研究状态；若增长或利润率显著走弱、出现新的监管行动，或融资条款带来惩罚性影响，则应转为回避。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 等待新的价格发现后再跟进
            body: 公开证据证明了有意义的规模和更好的运营杠杆，但不能证明 2026 年投资者能以公平价格或可接受的下行保护入场。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
          - type: callout
            title: 投资判断缺口在条款，而非需求是否存在
            body: 下一轮尽调必须解决上市或融资条款、股权结构表悬垂，以及既有同意和治理问题究竟是孤立事件还是结构性问题。
            calloutType: risk
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
