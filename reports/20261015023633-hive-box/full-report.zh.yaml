  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议仍为跟踪，因为运营证明确实存在，但估值依据和下行保护细节落后于业务证据。
    data:
      nodes:
        - id: scale
          label: 规模证明
          detail: 最大网络定位，加上 209,000 个社区和 330,200 个柜机。
        - id: growth
          label: 增长证明
          detail: 收入从 2023 年的 CNY3.812 billion 增长，5M24 收入同比增长 33.6%。
        - id: leverage
          label: 利润拐点
          detail: 5M24 从上年同期亏损转为披露的 CNY71.6 million 利润。
        - id: optionality
          label: 扩张期权
          detail: 申报期募资用途和公司表述都强调低线城市及海外扩张。
        - id: friction
          label: 消费者或监管阻力
          detail: 2020 年费用反弹、同意压力和 SAMR 罚款限制退出信心。
        - id: pricing
          label: 价格发现缺口
          detail: 留存公开证据没有显示当前轮次价格、IPO 区间或优先股堆叠。
        - id: decision
          label: 建议：跟踪
          detail: 等待条款更新和财务证明刷新后，再评估是否入场。
      edges:
        - from: scale
          to: growth
          label: 规模支撑收入逻辑
        - from: growth
          to: leverage
          label: 收入质量很重要
        - from: leverage
          to: pricing
          label: 表现改善仍需价格检验
        - from: optionality
          to: pricing
          label: 期权不等于已定价价值
        - from: friction
          to: pricing
          label: 风险扩大所需折价
        - from: pricing
          to: decision
          label: 没有条款就不买入
    approximationNotes: 仅为定性决策流程；该图有意不根据不可比的公开输入推导数值估值桥接。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV006
      - CV007
      - CV009
      - CV012
      - CV014
