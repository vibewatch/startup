      - number: '4.3'
        title: 利润信号与单位经济性
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开财务拐点来自 Yicai 总结的 2024 年 IPO 报道。文章称 2023 年收入增长 52% 至 CNY3.8B，净亏损从 2021 年的 CNY2.1B 收窄至 CNY541.5M；2024
              年前 5 个月则从 CNY313.8M 亏损转为 CNY71.6M 利润。即便如此，仅凭这组来源仍难以评估利润路径。Smartkarma
              明确警告，折旧政策变化“让情况变得模糊”；较早报道也显示历史亏损很大，并且对定价反弹敏感。因此，公开信息支持扭亏叙事，但不足以解释各收入流的毛利率、各柜机批次的利用率经济性，或可持续的自由现金流转化。
