        title: 定价与变现证据
        blocks:
          - type: paragraph
            body: >-
              证据池中最强的定价证据来自 2020 年有争议的收件人存储费，而不是当前实际商业条款。China Daily 和 People's Daily 都报道，免费期后 Hive Box 每增加 12 小时向收件人收取
              0.5 元，上限 3 元；China Daily
              还提到，在新增收件人费用前，快递员已经支付柜机使用费。同一组报道在财务上很重要，因为它们称当时快递员费用加广告收入仍不足以覆盖运营和维护成本。也就是说，公开定价证据表明 Hive Box
              可以在流程多个环节变现，但不能证明这些价格稳定覆盖网络的固定成本负担。
            claimRefs:
