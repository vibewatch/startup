      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >
              来源显示这是一个多方参与的采购流程。运营商侧，Hive Box 向有末端配送需求的企业销售 SaaS
              栈、硬件接入和运营指导，并将承运商、国家邮政运营商和电商伙伴列为其互联生态的一部分。用户侧，居民和包裹收件人是柜机的实际使用者，他们是否愿意从共享柜取件会影响周转和网络效用。付款方更可能是网络运营商、物流伙伴或社区部署赞助方，而不是终端消费者，因为公司强调按需付费的系统部署，而非消费者订阅。因此，采用路径先经过运营商采购，再取决于社区或楼宇用户是否接受。
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              市场驱动因素很明确：快递量增长、白天不在家的家庭、重视隐私的收件人，以及运营商对低人工交接点的需求，都有利于共享柜基础设施。Hive Box
              当前的部署基数和国际项目案例表明，公司可以把这一逻辑延伸到海外邮政和住宅场景。约束同样重要。消费者同意规则和对滞纳费的反弹表明，柜机便利性不会自动转化为定价权；MLex 报道的 SAMR
              罚款也说明扩张仍可能触发监管审查。再加上没有公开的付费量或分部收入拆分，这些摩擦会同时影响采用时点和估值信心。
            claimRefs:
              - CM006
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 部署密度是最清晰的证明点
            body: |
              最有支撑的市场证据不是泛泛的 TAM 数字，而是 Hive Box 已证明的柜机覆盖和包裹吞吐量，说明中国已在有意义的规模上采用离家配送。
            calloutType: strength
            claimRefs:
              - CM003
              - CM004
              - CM005
          - type: callout
            title: 采用受同意和变现约束
            body: |
              重视便利性的市场仍可能拒绝直接向消费者收费或强制使用柜机，因此同意规则和反弹与包裹量增长同样重要。
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与替代类别
        blocks:
          - type: paragraph
            body: >-
              现有证据支持的格局包括 Hive Box 自身、广泛的快递和物流既有运营商，以及直接送货上门这一现状替代方案。一份低置信度市场摘要将 Cainiao Network、JD Logistics 和 SF
              Express 列为主要竞争者；Yicai 的 IPO 报道也说明 Hive Box 为何属于这一集合：截至 2024 年 5 月 31 日，公司有 330,200 个柜机、29.9M 个格口，覆盖 31
              个省级地区的 209,000 个社区。这个规模很重要，因为它把 Hive Box 定义为全国性离家包裹网络，而非单点产品。但保留的公开记录对竞品柜机存量、定价或融资仍很薄弱，因此按类别看结论最清楚：Hive
              Box 是柜机专业厂商，主要快递生态是既有运营商替代方案，直接交给收件人则是长期存在的非柜机替代方案。
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP009
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
