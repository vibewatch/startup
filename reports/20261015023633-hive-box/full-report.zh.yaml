      - number: '3.3'
        title: 转换成本、替代压力与持久性边界
        blocks:
          - type: paragraph
            body: >-
              证据池中最明确的反向证据是，Hive Box 对用户关系的控制还不足以在没有反弹的情况下收取便利费。China Daily 和 People's Daily 都记录了 2020 年 5
              月的存储费争议，包括消费者反弹、社区抵制，以及包裹未经收件人同意不应进入柜机的质疑。China Daily 还报道称，在消费者权益机构和行业人士介入后，Hive Box
              调整政策，延长免费存储期，并承诺投件前取得同意。竞争含义很直接：柜机存量和快递关系是重要优势，但不能消除回到直接配送的多归属，也不能消除当柜机模式把过多成本或控制权转嫁给居民时的社区抵触。换言之，密度是护城河，但用户侧定价权和对同意敏感流程的掌控仍容易受到替代行为和监管审查影响。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP011
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP012
              - CP013
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与已披露进展
        blocks:
          - type: paragraph
            body: >-
              现有公开证据支持的是混合收入模型，而非纯 SaaS 或纯基础设施模式。Tracxn 将 Hive Box 描述为服务电商配送的柜机网络提供商；Hive Box 自有公关文案则补充了快递柜、住宅柜和 SaaS
              平台，并将基础、增值及第三方集成服务打包。公开进展信号有意义，但时效不一：Yicai 称截至 2024 年 5 月网络有 330,200 个柜机、29.9M 个格口和 209,000 个社区点位；KR Asia
              报道 Hive Box 曾称 2018 年有 2.5B 件包裹通过其柜机。这说明真实吞吐量和多个变现入口，但没有披露当前收入组合或分部贡献。
            claimRefs:
              - CI001
              - CI002
              - CI007
