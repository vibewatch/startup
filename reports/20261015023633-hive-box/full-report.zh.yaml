          note: 反弹迫使政策让步。
          claimRefs:
            - CI010
        - id: software-services
          label: SaaS 和集成服务
          value: Pay-on-demand software and implementation
          note: 商业方案可见；采用经济性未披露。
          claimRefs:
            - CI007
            - CI008
        - id: cost-burden
          label: 运营与维护负担
          value: Historically heavy enough to keep the business loss-making
          note: 广告加费用收入一度不足以覆盖成本。
          claimRefs:
            - CI011
            - CI012
        - id: profit-outcome
          label: 披露收入与利润结果
          value: CNY3.8b 2023 revenue; 5M 2024 profit inflection
          note: 外部分析师仍指出会计口径不可比。
          claimRefs:
            - CI003
            - CI004
            - CI013
      edges:
