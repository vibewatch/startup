    Hive Box 是一家 2015
    年成立、处于后期阶段的私有智能柜和末端物流平台，拥有覆盖中国社区的大型网络，提供软硬件组合产品，并开展海外及定制化部署。公司近期出现盈利拐点，但公开披露对法律注册地、当前融资条款、客户经济性和运营韧性的说明仍不完整。
