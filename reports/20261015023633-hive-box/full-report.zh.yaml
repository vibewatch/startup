  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值或回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 更新后的申报或融资轮次显示，2024 年的增长和盈利转折延续至 2025 年，且条款清晰。
        - 只有更新后的增长和利润率得到验证，且入场价格足够有吸引力，才可能支持买入。
        - 利润率证明减弱，或海外扩张消耗资本却没有回报。
        - 新的经审计账目、明确的价格区间，以及更清晰的股权结构披露。
      - - 基准
        - 规模和网络覆盖仍然真实，但公开定价条款继续过时，客户质量细节仍然不足。
        - 维持跟踪；基于当前公开证据，无法建立有说服力的估值区间。
        - 上市延迟、优先权悬置或变现质量平淡。
        - 没有明显恶化，但也没有更新的定价或条款透明度。
      - - 悲观情景
        - 监管或同意问题重演，盈利转折逆转，或下一轮融资以不利条款完成。
        - 如果下行保护薄弱或增长质量令人失望，则面临下轮融资或应避免入场。
        - 商业化失败、治理拖累，或带有惩罚性优先权的融资。
        - 不利法律消息、较弱的审计财报，或意味着大幅稀释的融资。
    notes: 情景表有意保持条件化，因为留存来源没有披露最新估值、公开发行价格区间或完整的下行保护安排。
