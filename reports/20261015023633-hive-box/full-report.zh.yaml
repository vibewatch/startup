            body: >-
              管理和控制权集中在创始人及 SF 生态周围。Tracxn 将 Wei Wang 和 Yubin Xu 列为联合创始人，并将 Xu 列为现任 CEO；Yicai 的 2024 年 IPO 文章称，SF 创始人
              Wang Wei 在申报时以 36.5% 持股成为最大股东。公开融资证据方向清晰，但估值和股权结构表机制仍不完整。Tracxn 报告三轮累计融资 $1.08B，最近一轮 Series C 日期为 2021 年 1
