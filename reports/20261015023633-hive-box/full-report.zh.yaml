chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营规模
        blocks:
          - type: paragraph
            body: >-
              即使法律实体描述不一，Hive Box 保留的公开记录仍持续指向同一项核心业务。Tracxn 将其描述为提供技术驱动快递柜解决方案和 SaaS 工具的公司，用于管理末端取件和寄件；Hive Box
              自有产品页则介绍了支持快递员投件和消费者取件流程的模块化智能快递柜。最大的身份未决问题是总部归属，而非商业模式：Tracxn 列为中国香港，Yicai 的 IPO 报道则称其总部位于深圳。到 2024
              年中，公司已达到中国全国规模，较早报道也显示 IPO 尝试前多年就有可观的包裹吞吐量。因此，Hive Box 的规模足以影响末端物流，但法律注册地、当前客户数和员工数仍应作为尽调缺口，而非既定事实。
