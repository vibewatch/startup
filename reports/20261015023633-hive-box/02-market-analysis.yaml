      - ["Community or office building deployment", "Property or site host influences deployment", "Residents, office workers, and couriers", "Usually operator-funded, but community acceptance determines viability", "Shared locker is placed in a compound or office setting with consent-sensitive usage", "Property operations plus logistics partner economics", "Convenience, privacy, and retrieval flexibility - if consent and pricing stay acceptable"]
    notes: >
      Buyer, user, and payer roles are inferred from company workflow descriptions and consent
      reporting; public sources do not disclose signed contract structures or current budget mix.
    claimRefs: ["CM002", "CM008", "CM009", "CM010", "CM011"]
figures:
  - id: "FM001"
    title: "Market sizing lens"
    type: "pyramid"
    summary: >
      The market can be bounded with parcel-volume, channel-share, market-share, and installed-base
      layers, but the sources do not support a single comparable revenue bridge.
    data:
      items:
        - label: "China courier parcel base"
          displayValue: "50.71bn"
          unit: "courier parcels delivered in China (2018)"
          note: "Broadest demand base cited by KrASIA."
          claimRefs: ["CM005"]
        - label: "Locker-channel adoption"
          displayValue: "~10%"
          unit: "of parcels put into storage boxes (2019)"
          note: "People's Daily cited State Post Bureau data; not directly comparable to 2018 company volume."
          claimRefs: ["CM006"]
        - label: "Domestic smart-box installed base"
          displayValue: "406,000"
          unit: "smart storage boxes in 2019"
          note: "National installed-base lens rather than spend."
          claimRefs: ["CM006"]
        - label: "Hive Box domestic share"
          displayValue: "~44%"
          unit: "of domestic smart locker market in 2019"
          note: "Category share, not category value."
          claimRefs: ["CM007"]
        - label: "Hive Box parcel volume"
          displayValue: "2.5bn"
          unit: "parcels picked up via Hive Box lockers (2018)"
          note: "Company-reported activity quoted by KrASIA."
          claimRefs: ["CM005"]
        - label: "Current Hive Box footprint"
          displayValue: "330,200 lockers"
          unit: "29.9m compartments; 209,000 communities (2024/current)"
          note: "Current network scale helps bound serviceable reach."
          claimRefs: ["CM003", "CM004"]
    approximationNotes: >
      These layers intentionally mix parcels, market share, and installed-base metrics as
      directional sizing proxies because the public record does not isolate a current value-based
      TAM, SAM, or SOM for Hive Box.
    claimRefs: ["CM003", "CM005", "CM006", "CM007", "CM013"]
callouts:
  - calloutType: "strength"
    title: "Installed density is the clearest proof point"
    body: >
      The best-supported market evidence is not a generic TAM number but Hive Box's demonstrated
      locker footprint and parcel throughput, which show real adoption of out-of-home delivery in
      China at meaningful scale.
    claimRefs: ["CM003", "CM004", "CM005"]
  - calloutType: "risk"
    title: "Adoption is gated by consent and monetization"
    body: >
      The same market that values convenience can still reject direct consumer monetization or
      forced locker usage, so consent rules and backlash matter as much as parcel-volume growth.
    claimRefs: ["CM010", "CM011", "CM012", "CM013"]
