  evidenceGaps:
    - type: missing-source
      severity: material
      topic: current-valuation-terms
      missingEvidence: Current IPO price range, completed listing outcome, or newer priced-round valuation marker after the September 2024 filing.
      whyItMatters: Recommendation is explicitly price-sensitive, so a stale filing without current terms cannot support a buy call or target-return math.
      diligencePath: Review the latest HKEX filing set, shareholder updates, or board-approved financing materials for current price and timing.
    - type: private-evidence-only
      severity: material
      topic: cap-table-and-downside
      missingEvidence: Current cap table, liquidation preferences, redemption rights, debt schedule, and any side-letter protections.
      whyItMatters: The severity of dilution and downside protection can change a track call into avoid even if operating performance is improving.
      diligencePath: Request the full cap table, financing agreements, debt schedule, and legal summary of investor rights from management or counsel.
    - type: missing-source
      severity: material
      topic: customer-quality
      missingEvidence: Current customer concentration, retention or churn, repeat monetization, and consent-related complaint rates.
      whyItMatters: Exit quality depends on whether scale converts into durable, non-coercive usage rather than one-off network density.
      diligencePath: Request customer cohort data, courier concentration, parcel repeat rates, and complaint-resolution metrics by channel.
