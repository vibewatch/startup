  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Price & Packaging Model
      - Flash Express
      - Kerry Express
      - J&T Express
      - Thailand Post
    rows:
      - - Entry Base Tariff (Small Parcel)
        - Promotional entry from ~25 THB; industry floor to ~19 THB
        - Historical ~60 THB; compressed to ~25-30 THB under price war
        - Competitive entry matched to ~20-25 THB
        - Segmented distance tariff from ~20-35 THB
      - - Pickup Service Fee
        - Zero surcharge (free door-to-door pickup)
        - Fee or volume minimum for scheduled pickup
        - Free pickup for active app/commercial accounts
        - Surcharge for home collection requests
      - - High-Volume Merchant Discounts
        - Tiered contract rates with Flash Home agent discounts
        - Corporate accounts with volume-based SLA tiers
        - Aggressive platform subsidies and tiered merchant rebates
        - Commercial postal contract discounts for bulk shippers
      - - Bulky / Heavy Parcel Service
        - Flash Logistics specialized oversized delivery
        - Kerry XL bulky freight network
        - J&T heavy parcel delivery
        - Logispost specialized freight service
    notes: Published entry pricing models reflecting market rate deflation from historical 60 THB levels to 19-25 THB during the peak courier price war; bespoke merchant contracts contain undisclosed volume rebates.
    claimRefs:
      - CP006
      - CP007
      - CP010
