    rows:
      - - Kerry Express Thailand (KEX)
        - Private Incumbent
        - Peak 15,000 branches; raised $270M IPO; posted 9.4B baht loss in 2024
        - Omnichannel, B2C, premium e-commerce
        - Established brand trust and retail branch ubiquity
        - High fixed-cost overhead and slow response to price deflation
      - - J&T Express Thailand
        - Regional Challenger
        - Raised $2B+ regionally; Thai unit 25.4B baht revenue and 819M baht profit in 2024
        - Social commerce, TikTok Shop, cross-border
        - Aggressive platform partnerships and live-commerce alignment
        - Attention divided across multiple Asian and global markets
      - - Thailand Post
        - State Incumbent
        - 10,000+ access points; nationwide postal monopoly; returned to profit in 2024
        - Universal service, rural C2C, government, general parcel
        - Unmatched rural delivery network and government backing
        - Historically rigid operating hours and slower digital UX
      - - Shopee Xpress (SPX)
        - Captive In-house Logistics
        - Captive arm of Sea Limited / Shopee platform ecosystem
        - Shopee marketplace transactions and captive merchants
        - Guaranteed internal package volume and platform checkout priority
        - Limited third-party market appeal outside parent marketplace
