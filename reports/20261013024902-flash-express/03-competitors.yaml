        - Primarily branch counter drop-off
      - - Operating Calendar
        - 365-day year-round delivery without holiday pause
        - Historical weekend / holiday limitations
        - 365-day delivery operations
        - Traditional business days with selected weekend hubs
      - - Platform Integration
        - Deep Lazada & TikTok Shop API alignment
        - Multi-platform independent courier integrations
        - Deep TikTok Shop and social seller integration
        - Broad domestic marketplace integrations
      - - Cash on Delivery (COD) & Fintech
        - Flash Pay / Flash Money with fast merchant settlement
        - Established COD with branch settlement
        - COD enabled with digital merchant wallet
        - Established postal COD with slower remittance cycle
