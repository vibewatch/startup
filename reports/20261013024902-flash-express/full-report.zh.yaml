  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: SME 和企业客户从端到端入驻、包裹寄送到业务扩张的循环。
    approximationNotes: 旅程阶段和触点转换反映运营标准流程与软件工作流；每个阶段的转化率尚未测量。
    claimRefs:
      - CU010
      - CU011
      - CU012
      - CU013
    data:
      items:
        - label: 商家发现与入驻
          touchpoints:
            - 移动应用注册与账户设置
            - 电商店铺在线组件集成
        - label: 按需寄件
          touchpoints:
            - 免费门到门包裹取件预约
            - 在本地 Flash Home 或网点网络投递
        - label: 自动分拣与运输
          touchpoints:
            - 条码扫描和专有路由算法
            - 经由 23 个区域配送枢纽运输
        - label: 末端配送与现金收款
          touchpoints:
            - 次日及周末快递员上门履约
            - 一体化货到付款现金处理
        - label: 财务结算与对账
          touchpoints:
            - Flash Money 数字钱包或银行拨款
            - 实时配送状态看板追踪
        - label: 账户扩张与企业升级
          touchpoints:
            - 专属重点客户（KA Service）物流门户
            - 拓展至 Flash Fulfillment 和跨境 Flash Laos 等多服务
