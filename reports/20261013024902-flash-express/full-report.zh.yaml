              - CI005
              - CI008
              - CI009
              - CI010
      - number: '4.4'
        title: 财务尽调结论、利润率走势与投资判断障碍
        blocks:
          - type: paragraph
            body: >-
              从投资判断角度看，Flash Express 是高包裹量、高市场份额的赢家，但持续承受结构性利润率压力。2022 年末 Series F 锚点收入达到 $414
              million；独立战略分析指出，激烈价格战削弱了服务一致性，并推高现金消耗。尽管早期运营报告显示公司 2024 年在泰国实现法定盈利，但 2024 年后的经核实审计财报、单位 EBITDA
              桥接、现金储备和债务安排均完全未披露。在缺少经审计毛利率披露和主要平台渠道合同续约数据的情况下，投资判断无法确认 Flash Express 是否已经实现可持续的自筹现金生成，还是仍依赖未来外部融资。
