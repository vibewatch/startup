      - number: '7.2'
        title: 平台自我偏好与监管反垄断风险
        blocks:
          - type: paragraph
            body: >-
              东盟监管环境不足以保护独立快递平台免受数字市场垄断。与欧盟《数字市场法》或印尼曾暂时干预 TikTok Shop 等个别国家限制相比，泰国监管反应仍然迟缓。尽管 Electronic Transactions
              Development Agency 和 Trade Competition Commission 于 2025 年年中起草反垄断框架，但截至 2025
              年末均未正式公布。若没有禁止算法导流的强制守门人规则，Flash Express 只能受平台对手摆布。尽调必须确认泰国竞争监管机构是否会在平台自有配送网络永久侵蚀独立快递量前，制定可执行的平等待遇规则。
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR007
              - CR009
      - number: '7.3'
        title: 运营波动与跨境收缩
        blocks:
          - type: paragraph
            body: >-
              Flash Express 在泰国运营庞大实体基础设施，包括 15,000 辆车、23 座每分钟可处理超过 100,000 件包裹的自动分拣中心，以及覆盖 77 个府的 2,500
              个配送点。该基础设施带来高吞吐量，也带来高固定运营成本和网络维护承诺。包裹量下降时，在每件 60 cents 起的基础定价下，单位经济会迅速恶化。即使投入 Series F 资金将员工扩大到 10,000
              人，马来西亚扩张仍然失败，说明跨境物流复制存在严重运营摩擦。Flash 与 AIF Group 的 Flash Laos 等跨境项目仍在推进，但区域增长仍暴露于伙伴执行和地缘政治运输障碍。
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR012
              - CR013
