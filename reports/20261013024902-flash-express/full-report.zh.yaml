          - type: paragraph
            body: >-
              评估 Flash Express 必须分析威胁其东南亚运营模式的结构性风险。最严重的风险是平台自我偏好：电商守门人通过算法将卖家流量导向自有或关联物流服务。2026 年初，这一动态造成灾难性后果：Flash
              Express 在包裹量被系统性抽走后，被迫终止全部马来西亚业务并裁员超过 10,000 人。对投资者而言，泰国若出现类似闭环路由，将触发核心论点失效；Shopee、Lazada 和 TikTok Shop
              在当地掌握 50% 至 75% 的市场份额。其他关键风险包括资本密集度高、激烈价格竞争下包裹利润薄，以及国际合资业务的执行尚未验证。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR008
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
