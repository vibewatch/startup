      - CP011
      - CP012
      - CP013
  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 追踪电商客户下单活动如何转化为快递收入、附加服务费和运营毛利润。
    data:
      nodes:
        - id: order-intake
          label: 电商订单预约
          description: 卖家通过 Flash Express 应用或重点客户 API 预约免费上门取件
        - id: first-mile
          label: 首公里取件与枢纽干线运输
          description: 本地快递员收取包裹，并将其运往省级配送中心
        - id: automated-sortation
          label: 自动分拣与路由
          description: 自动化枢纽利用专有路由算法，每分钟分拣大量包裹
        - id: last-mile-delivery
          label: 末端配送与货到付款收款
          description: 快递员全年 365 天配送包裹并收取货到付款款项
        - id: revenue-recognition
          label: 收入确认与附加服务费
          description: 运费与货到付款交易费及货物保险费一并确认收入
        - id: gross-margin-settlement
          label: 成本扣除与净毛利润
          description: 从收入中扣除快递员直接人工、车辆燃料和设施维护成本
    approximationNotes: 流程图展示运营配送阶段；具体单位转换率和利润率为非公开信息。
    claimRefs:
      - CI001
      - CI004
      - CI006
      - CI013
      - CI014
