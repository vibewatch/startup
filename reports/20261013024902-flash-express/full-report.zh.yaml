      - number: '7.4'
        title: 电商交易对手依赖与资本密集度
        blocks:
          - type: paragraph
            body: >-
              Flash Express 的商业持久性根本上取决于头部电商平台的交易对手集中度。由于个人社交卖家和小商户受平台物流要求约束，公司不能只依赖商户善意。为守住规模，公司部署了 Key Account 管理服务、通过
              Flash Fulfillment 提供一体化仓储，并通过 Flash Home 建立代理投递点。但在 2022 年末以 $2 billion 估值完成 $445M Series F
              后，公司面临越来越大压力，必须在不无限依赖股权融资的情况下实现可持续现金生成。若主要平台商业合同恶化，Flash Express 定价能力有限，闲置分拣中心还会造成严重现金消耗。
            claimRefs:
