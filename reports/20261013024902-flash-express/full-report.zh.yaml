        title: 收入来源、变现机制与商业费率结构
        blocks:
          - type: paragraph
            body: >-
              Flash Express 通过五项核心商业能力变现物流生态：标准快递包裹服务、Flash Logistics 大件货运、Flash Fulfillment 仓储、Flash Home 包裹收集代理加盟，以及
              Flash Money 数字支付和货到付款（COD）金融服务。商业规模的基础是上门快递包裹配送，公司以低至 60 cents 的超低入门价和无最低件数要求的免费上门取件政策打开市场。为摆脱低利润消费者和 C2C
              包裹费用，公司扩展到增值服务，包括最高 50,000 THB 的货物运输保障，以及面向企业电商商户的 Key
              Account（KA）管理工具。标准零售价可通过线上费率工具公开计算，但实际商户价格受未披露的批量折扣层级和平台主服务协议强烈影响，商业抽成率仍不透明。
