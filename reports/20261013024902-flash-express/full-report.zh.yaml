  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Flash Express 从 2017 年成立，到覆盖全国、成为独角兽并拓展区域业务的时间脉络。
    data:
      items:
        - label: 公司成立
          date: '2017'
          detail: Komsan Saelee 和 Di Weijie 在曼谷成立 Flash Express，经营电商包裹配送。
          tone: neutral
        - label: 覆盖全国
          date: '2019'
          detail: 建成覆盖泰国全部 77 个府的门到门配送网络。
          tone: positive
        - label: Series D 融资
          date: 2020-10
          detail: 融资 200m 美元，由 PTT Oil and Retail Business 领投，eWTP Capital 和 Krungsri Finnovate 参投。
          tone: positive
        - label: 成为独角兽
          date: 2021-06
          detail: 在 Series D+ 和 E 轮融资中获得 150m 美元（THB 4.6B），估值达到 1.0b 美元。
          tone: positive
        - label: 老挝合资企业成立
          date: 2021-09
          detail: 与 AIF Group 合作推出 Flash Laos，开始连接万象与泰国的跨境物流。
          tone: positive
