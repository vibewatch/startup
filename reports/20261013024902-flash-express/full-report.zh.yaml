      - number: '4.2'
        title: 单位经济、成本结构驱动与配送转化
        blocks:
          - type: paragraph
            body: >-
              Flash Express 的单位经济取决于包裹配送密度、自动分拣吞吐量和干线车辆利用率。电商物流每件 20 至 35 THB
              的配送价格几乎没有单位利润缓冲，必须依靠极高的日均包裹密度摊薄全国分拣中心和本地配送网点的固定成本。成本主要来自运输燃油、干线车队运营、设施分拣技术和配送人员薪酬。运营物流研究显示，订单处理准确率、运输路线效率和本地化库存实践直接决定组织生产率。为应对与资金充足的
              J&T Express 等对手直接价格战造成的严重利润率压缩，管理层正推动业务从纯规模转向利润率更高的履约、大件货运和区域跨境业务。
