          - type: paragraph
            body: >-
              指定证据池无法证明安全认证、隐私控制、安全流程、正式质量体系、事故历史、灾难恢复或服务水平承诺。这是公开证据有限的局限，不代表控制措施或事故不存在。最接近行业实践的材料是一篇 2024 年学生研究论文，讨论
              Flash Express Diversion Jaen 网点的物流实践；它不是开发者代码库、包注册表、API
              论坛、工程演讲或独立技术审计，因此不能保证架构。投资判断应把已证明的服务广度与未经核实的控制成熟度分开。管理层尽调应索取系统图、依赖清单、变更管理记录、在线率和事故日志、安全证明、隐私影响评估、包裹丢失与理赔数据（并非公司声称），以及按运营模块和国家划分的质量控制指标。
