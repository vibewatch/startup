      - number: '4.3'
        title: 历史增长规模、融资时间线与资本充足度
        blocks:
          - type: paragraph
            body: >-
              Flash Express 通过六轮融资累计投入超过 $780 million 股权资金，快速做大规模。2020 年末完成 $200 million Series D 后，日分拣能力超过 100 万件；2021
              年 6 月，公司以 $1.0 billion 估值完成 $150 million Series D+ 和 Series E，使 Flash Group 成为泰国首家私营科技独角兽。2021 年日包裹量达到 200
              万件，背后有 15,000 辆车、23 座分拣设施和遍布泰国 77 个府的数千个 Flash Home 网点。2022 年 12 月，公司完成机构投资者领投的 THB 15 billion Series F（约
              $431 million 至 $447 million），估值 $2.0 billion。该轮融资对应 $414 million 收入，即 4.8x 企业收入倍数，并为拓展老挝、柬埔寨和菲律宾提供资金。
            claimRefs:
