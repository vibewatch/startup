    title: 有公开证据支持的产品架构图
    type: stack
    summary: 概念分层区分已观察到的客户界面、已报道的数字编排、实体执行和相邻服务，不臆测未披露组件。
    data:
      items:
        - layer: customer-access
          label: 追踪与取件
          detail: 包裹追踪及免费取件预约
        - layer: customer-access
          label: 价格、网点与重点客户工具
          detail: 价格查询、网点搜索和重点客户管理
        - layer: digital-orchestration
          label: 数字化配送流程
          detail: 已公开报道的高层次自研技术和大数据
        - layer: physical-execution
          label: 自动分拣
          detail: TechCrunch 报道的历史公司吞吐量主张
        - layer: physical-execution
          label: 配送网络
          detail: 历史配送点和包裹量证据
        - layer: adjacent-services
          label: Flash Fulfillment
          detail: 货物仓储和履约
        - layer: adjacent-services
          label: Flash Logistics
          detail: 大件配送
        - layer: adjacent-services
          label: Flash Home 和 Flash Money
          detail: 配送代理和金融服务业务线
