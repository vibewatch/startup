      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 平台自我偏好威胁独立快递商生存
            body: 2026 年初全面退出马来西亚并终止超过 10,000 名员工，说明当主导平台强制通过算法将流量导向关联配送部门时，物流运营商会面临灾难性包裹量损失。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR006
          - type: callout
            title: 围绕平台集中度的论点失效触发器
            body: 以东盟区域扩张为基础的投资论点会因退出国家市场而受损；若泰国平台强制使用自有物流，或 Flash Express 未能获得长期合同最低包裹量，论点即告失效。
            calloutType: insight
            claimRefs:
