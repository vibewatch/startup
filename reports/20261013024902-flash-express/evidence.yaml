evidenceGaps:
  - type: missing-source
    severity: material
    topic: audited-financial-statements-2025
    missingEvidence: >-
      Audited financial statements for fiscal year 2025 detailing full-year revenue, operating margin, EBITDA, cash
      balance, and debt facilities.
    whyItMatters: >-
      Current company performance and cash burn cannot be verified against the 2022 valuation anchor without refreshed
      audited disclosures.
    diligencePath: >-
      Obtain statutory financial filings from the Department of Business Development (DBD) in Thailand or request
      dataroom financial statements.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: series-f-preference-stack
    missingEvidence: >-
      Detailed Series F shareholder agreement terms, liquidation preference multiples, senior redemption rights, and
      anti-dilution provisions.
    whyItMatters: >-
      Late-stage private venture rounds often embed seniority structures that heavily compress common share equity value
      in flat or downside exits.
    diligencePath: Review articles of association amendments and shareholder agreement filings during formal legal due diligence.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A current, methodology-disclosed Thailand parcel-delivery market value, comparable CAGR, and parcel-volume
      denominator segmented by e-commerce versus other delivery.
    whyItMatters: >-
      Without a common market denominator, company revenue, network coverage, and historical throughput cannot be
      converted into defensible TAM, SAM, SOM, or market share.
    diligencePath: >-
      Obtain current Thai regulator, postal, trade-association, or commissioned market data and reconcile revenue and
      parcel definitions before sizing.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: channel-concentration
    missingEvidence: >-
      Revenue, parcel volume, retention, pricing, and contribution margin by marketplace, direct merchant, C2C,
      fulfillment, and cross-border channel.
    whyItMatters: Channel economics determine whether demand growth creates durable margin or merely low-yield volume.
    diligencePath: >-
      Request management cohort data, major customer contracts, channel-level unit economics, and independently
      reconciled parcel invoices.
    relatedQuestionRefs:
      - QM005
      - QM007
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: marketplace-contract-concentration
    missingEvidence: >-
      Audited merchant delivery volume breakdown and contract renewal terms across TikTok Shop, Shopee, and Lazada in
      Thailand.
    whyItMatters: >-
      Independent couriers face acute volume volatility and pricing pressure if major marketplace platforms prioritize
      internal logistics networks.
    diligencePath: >-
      Request seller management shipment allocations and commercial merchant service agreements directly from company
      management during technical due diligence.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited post-2024 income statements, gross margin breakdowns, and balance-sheet cash and debt positions.
    whyItMatters: >-
      Without audited financial statements, underwriting cannot independently verify whether 2024 profitability was
      sustained or if ongoing price competition resumed operating cash burn.
    diligencePath: >-
      Request audited 2024-2025 Thai statutory financial filings (Department of Business Development), audited revenue
      bridge, and management EBITDA reconciliations.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: trust-and-controls
    missingEvidence: >-
      Current security certifications, privacy assessments, safety controls, quality systems, incident history, and
      disaster-recovery evidence.
    whyItMatters: >-
      The platform handles shipment, address, merchant, and payment-related workflows, so control failures could impair
      service and create regulatory or customer harm.
    diligencePath: >-
      Request current attestations, privacy impact assessments, penetration-test summaries, incident logs,
      disaster-recovery tests, and quality-control KPIs from management.
    relatedQuestionRefs:
      - QE006
  - type: stale
    severity: material
    topic: deployment-and-reliability
    missingEvidence: >-
      Current parcel volume, delivery-point definitions, tested sorting capacity, uptime, on-time delivery, parcel-loss,
      claims, and support-response metrics.
    whyItMatters: >-
      Historical scale demonstrates prior traction but does not establish current capacity, service quality, or
      resilience.
    diligencePath: >-
      Obtain monthly operating dashboards for 2025-2026 with metric definitions, country splits, incident annotations,
      and customer cohort comparisons.
    relatedQuestionRefs:
      - QE004
  - type: private-evidence-only
    severity: material
    topic: technical-architecture
    missingEvidence: >-
      System architecture, critical vendors, routing design, data models, interfaces, redundancy, change controls, and
      module ownership boundaries.
    whyItMatters: >-
      High-level references to in-house technology and Big Data do not establish maintainability, scalability, control
      maturity, or dependency risk.
    diligencePath: >-
      Run an engineering diligence session using current architecture diagrams, dependency inventories, API
      specifications, release records, and capacity tests.
    relatedQuestionRefs:
      - QE002
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      A credible public developer or practitioner surface such as repositories, packages, API documentation, technical
      talks, or integration-partner engineering material.
    whyItMatters: >-
      The available student paper is not technical proof of software quality, ecosystem adoption, or integration
      maturity.
    diligencePath: >-
      Request private API documentation and integration references, then interview an enterprise customer or integration
      partner's technical owner.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: Merchant Cohort Retention and Net Retention Rates
    missingEvidence: >-
      Audited cohort-level retention metrics, Gross Retention Rate (GRR), Net Retention Rate (NRR), and merchant churn
      percentages across SME and enterprise tiers.
    whyItMatters: >-
      Without disclosure of repeat shipping cadence and cohort retention, it is impossible to evaluate whether high
      parcel volumes reflect durable merchant lock-in or price-sensitive platform switching.
    diligencePath: >-
      Request seller retention cohort tables, average contract length, and customer concentration schedules in
      confidential diligence.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: material
    topic: Named customer proof table
    missingEvidence: >-
      Granular revenue and parcel volume contribution breakdowns for key platform partners including Shopee, Lazada, and
      TikTok Shop.
    whyItMatters: >-
      High reliance on third-party marketplace platforms exposes Flash Express to severe channel concentration risk and
      pricing pressure if platform operators shift parcel volume to in-house logistics fleets.
    diligencePath: >-
      Obtain customer concentration breakdown and master service agreement renewal dates for top five e-commerce
      platform accounts.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: platform-contracts
    missingEvidence: >-
      Disclosed contractual parcel volume allocation agreements and minimum volume guarantees with TikTok Shop, Shopee,
      and Lazada.
    whyItMatters: >-
      Platform self-preferencing can rapidly eliminate parcel volume, making commercial contract terms critical for
      underwriting durability.
    diligencePath: >-
      Request confidential commercial master service agreements and platform exclusivity terms during management
      diligence.
    relatedQuestionRefs:
      - QR008
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Comprehensive audit of all provincial transport permits and labor dispute filings following regional operational
      restructuring.
    whyItMatters: Determines potential severance liability or regulatory penalties across municipal labor boards.
    diligencePath: Review Department of Business Development and Thai Ministry of Labour compliance records with company counsel.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: audited-financials
    missingEvidence: >-
      Audited financial statements for 2024 and 2025 detailing gross margin, operating EBITDA, net debt, and free cash
      flow.
    whyItMatters: >-
      Without audited operating cash flow, determining whether Flash Express generates sustainable internal cash to
      support its $2.0B valuation is impossible.
    diligencePath: >-
      Obtain statutory audited accounts filed with Thailand Department of Business Development (DBD) or audited investor
      reports.
    relatedQuestionRefs:
      - QV008
  - type: private-evidence-only
    severity: material
    topic: cap-table-liquidation-preferences
    missingEvidence: >-
      Detailed capitalization table schedule showing Series F liquidation preference multiples, participating vs
      non-participating rights, and conversion price ratchet terms.
    whyItMatters: >-
      Senior liquidation preferences from the THB 15B Series F round could eliminate equity value for common and
      early-stage preference shareholders in a downside or modest exit scenario.
    diligencePath: >-
      Request the definitive Shareholders' Agreement and Articles of Association from Flash Group counsel during
      confirmatory diligence.
    relatedQuestionRefs:
      - QV006
      - QV008
