  topStrengths:
    - Nationwide Thai parcel network with strong delivery-point density.
    - Broad service mix spanning courier, fulfillment, agency, COD, and adjacent financial services.
    - Proven ability to attract major strategic and growth investors during the 2020-2022 funding cycle.
  topRisks:
    - Platform self-preferencing and customer concentration can reroute parcel volume away from independent couriers.
    - The 2022 valuation mark is stale relative to current private-market and public courier comparables.
    - Post-2024 audited financials, margin data, and preference-stack terms remain undisclosed.
  unresolvedGaps:
    - 2025 audited financial statements, including cash balance, debt facilities, EBITDA, and working capital.
    - Series F preference stack, liquidation rights, and anti-dilution protections.
    - Current parcel volume, customer concentration, and operating economics after the Malaysia exit.
    - Verified concentration across Shopee, Lazada, TikTok Shop, and other major platform channels.
