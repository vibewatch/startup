companyProfile:
  summary: >-
    Flash Express is Thailand's scaled express logistics platform, built around nationwide parcel delivery,
    cash-on-delivery settlement, free pickup, automated sorting, and adjacent fulfillment, bulky-freight, agency, and
    financial-service lines. The business was founded in 2017 by Komsan Saelee and Di Weijie, with Bangkok as its
    operating base, and it has expanded through Flash Fulfillment, Flash Logistics, Flash Home, and Flash Money while
    pursuing regional corridors in Laos and other ASEAN markets. The public evidence supports a strong domestic network,
    but the company remains privately held and sparsely disclosed on post-2024 financial performance, cap-table rights,
    and unit economics.
