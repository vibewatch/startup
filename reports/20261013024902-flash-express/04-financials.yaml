    title: Revenue model bridge
    type: flow
    summary: >-
      Conversion chain tracing e-commerce customer order activity into express delivery revenue, ancillary service fees,
      and operating gross profit.
    data:
      nodes:
        - id: order-intake
          label: E-Commerce Order Booking
          description: Seller schedules free doorstep pickup via Flash Express app or Key Account API
        - id: first-mile
          label: First-Mile Pickup & Hub Line-Haul
          description: Local couriers collect parcels and route to provincial distribution centers
        - id: automated-sortation
          label: Automated Sortation & Routing
          description: Automated hubs sort high volumes per minute using proprietary routing algorithms
        - id: last-mile-delivery
          label: Last-Mile Delivery & COD Collection
          description: Express courier delivers package 365 days a year and collects COD payments
        - id: revenue-recognition
          label: Revenue Recognition & Ancillary Fees
          description: Freight fees recognized alongside COD transaction charges and goods insurance
        - id: gross-margin-settlement
          label: Cost Deduction & Net Gross Profit
          description: Direct courier labor, vehicle fuel, and facility maintenance deducted from revenue
    approximationNotes: >-
      Process flow diagrams operational delivery stages; specific unit conversion rates and margin percentages are
      private.
    claimRefs:
      - CI001
      - CI004
      - CI006
      - CI013
      - CI014
callouts:
  - calloutType: risk
    title: Persistent Unit Economic Compression from Express Price Wars
    body: >-
      Flash Express built market share on aggressive low pricing starting at 60 cents per parcel with free doorstep
      pickup. While this fueled rapid growth to over 2 million daily parcels and a $2B valuation in late 2022, competing
      against similarly capital-rich operators such as J&T Express keeps gross margins thin and exposes operations to
      fuel and labor inflation.
    claimRefs:
      - CI003
      - CI011
      - CI012
  - calloutType: insight
    title: Monetization Opportunity in B2B Fulfillment and Ancillary Services
    body: >-
      To counter commodity parcel pricing pressure, Flash Group's strategic pivot relies on higher-margin ecosystem
      services including Flash Fulfillment warehousing, Flash Logistics bulky cargo, and Flash Money COD transactions.
      Capturing higher B2B wallet share represents the essential bridge to sustainable positive unit economics.
    claimRefs:
      - CI001
      - CI006
      - CI013
