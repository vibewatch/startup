callouts:
  - calloutType: "recommendation"
    title: "Diligence Prerequisites for Valuation Underwriting"
    body: "Prospective investors should treat the December 2022 $2.0B Series F valuation mark as unverified history rather than an actionable transaction price. Fresh equity commitments require three mandatory disclosures: (1) audited 2024-2025 financial statements confirming EBITDA and net cash from operations, (2) the definitive Series F senior liquidation preference structure and any cumulative dividend rights, and (3) platform volume concentration metrics across TikTok Shop, Shopee, and Lazada."
    claimRefs:
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV014"
      - "CV015"
  - calloutType: "risk"
    title: "Down-Round Vulnerability and Multiple Compression"
    body: "Public courier and logistics companies globally trade at enterprise value multiples between 0.8x and 1.5x revenue due to high operational gearing and commodity pricing pressure. With Flash Express priced at 4.8x revenue in late 2022 during peak venture liquidity, any future financing round or public exit without massive margin expansion risks significant multiple compression and down-round dilution for junior shareholders."
    claimRefs:
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV013"
