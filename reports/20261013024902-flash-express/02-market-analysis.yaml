callouts:
  - calloutType: insight
    title: Reach Is Evidence of Capability, Not Market Share
    body: The reported 77-province and 2,500-delivery-point footprint shows broad access, while the historical two-million-parcel daily figure shows that the network once handled substantial volume [CM005, CM012]. Neither measure identifies Thailand market revenue, total parcel volume, or Flash Express share.
    claimRefs:
      - CM005
      - CM012
      - CM015
  - calloutType: risk
    title: Volume Growth May Not Translate Into Margin
    body: Netfigo reports that intensified courier competition compressed industry margins and that Flash Express's aggressive pricing pressured profitability [CM010]. Without current yield, contribution-margin, customer-concentration, and retention evidence, market growth alone is insufficient to support a premium valuation.
    claimRefs:
      - CM010
      - CM016
