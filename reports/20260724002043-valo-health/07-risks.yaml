  - TR002
  figureRefs:
  - FR002
- id: capital-and-partner-risk
  title: Capital structure and partner dependency risk
  body: 'Capital risk remains elevated because the last clearly disclosed equity financing is the 2021 Series B, while the public-market SPAC route was terminated later that year. Strategic deals with Novo Nordisk and Merck KGaA help materially; they validate the company and can provide near-term or milestone-linked economics. But they do not eliminate financing risk. Instead, they transform it into dependence on a few counterparties, a few programs, and contingent future payments. If Novo or Merck changes priorities, slows program progression, or renegotiates scope, Valo could face both financial and reputational pressure. The company’s private-undisclosed profile amplifies the issue because outsiders cannot test current cash or runway. This means capital and dependency risk are inseparable: Valo is not just dependent on money, it is dependent on where that money comes from and what assumptions attach to it. The risk conclusion is therefore less about any single red flag and more about
    correlated exposure: once one part of the model weakens, several other parts can worsen quickly because the company is still proving both its platform and its financing resilience at the same time.'
  claimRefs:
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR032
  - CR033
  - CR035
  - CR039
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: people-governance-and-mitigants
  title: People, governance, and visible mitigants
  body: 'Leadership risk is real but nuanced. The 2024 transition away from David Berry and into a Schade/Bell bridge, followed by Brian Alexander’s appointment, clearly indicates a meaningful governance and operating reset. That can be destabilizing, especially in a private biotech with a platform-plus-pipeline model. On the other hand, the move may also improve discipline by adding a later-stage operator profile. Public mitigants exist elsewhere too: major-pharma relationships validate the science enough to keep counterparties engaged, the Charles River milestone suggests some workflow progression outside the internal pipeline, and the MJFF grant adds an independent neurology signal. Even with those offsets, the correct composite risk judgment remains high. Valo is not facing a single fatal flaw, but it is carrying several correlated risks that can transmit into each other quickly if execution slips. The risk conclusion is therefore less about any single red flag and more about correlated
    exposure: once one part of the model weakens, several other parts can worsen quickly because the company is still proving both its platform and its financing resilience at the same time.'
  claimRefs:
