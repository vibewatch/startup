- id: unit-economics-and-concentration
  title: Unit economics are directionally attractive but operationally opaque
  body: 'Directionally, Valo ought to have better economics than a traditional asset-only biotech because software, data, and discovery tooling can scale across multiple programs. But that argument only goes so far. The company also carries costly biology, chemistry, translational, and in at least one case clinical-development work. Without public financial statements, outside observers cannot tell whether partner programs are contribution-positive, whether internal programs absorb most platform value, or how much compute and data curation weigh on margins. Concentration adds another layer: a small number of large pharma collaborations likely represent the majority of visible value. That can be good when counterparties are blue-chip and contracts deepen; it can be dangerous when a few programs dominate timing, cash receipts, and credibility. That is why the most important financial judgment is not simply whether the headline economics are large, but whether they convert into durable operating
    flexibility without forcing an unattractive financing event before proof deepens.'
  claimRefs:
  - CI008
  - CI019
  - CI020
  - CI021
