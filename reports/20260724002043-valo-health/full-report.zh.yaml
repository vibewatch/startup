  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接对手、邻近玩家与替代方案
        blocks:
          - type: paragraph
            body: >-
              Valo 处在一个拥挤但仍在变形的 AI 赋能药物发现格局中。最接近的直接对手，是那些把自己定义为 AI
              原生发现平台的公司，并且至少拥有专有数据、湿实验整合、自有或合作管线经济中的一部分。Recursion、Isomorphic Labs、insitro、Insilico Medicine、Schrödinger
              和 BenevolentAI 都至少部分符合这一模式，尽管变现模型不同。Relay Therapeutics 和 Verily 更适合放在邻近玩家或替代方案里：Relay
              重要，是因为它提供了另一条精准药物发现路径，仍能吸引资本和合作方注意；Verily 重要，是因为数据、分析和基础设施入口会影响买方如何评估 AI 赋能项目。关键点在于，Valo
              不只是在模型质量上竞争。它竞争的是数据深度、转化可信度、合作方信任，以及把发现主张转成可重复经济结果的能力。竞争含义是，Valo 不能靠泛泛描述 AI
              取胜；它必须证明，纵向人体数据、转化工作流深度和账户级合作方信任这套特定组合，为什么能比同行补齐差距更快地复利增长。因此，护城河、工作流和证据的不同视角，比简单的知名度名单更重要。竞争框架需要证据，而不是口号。这就是
              Valo 仍必须在公开层面跨过的竞争门槛。公开证明在这里仍然关键。这一点明确。
