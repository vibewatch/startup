              年领导层重置，以及 2025 年合作和资助活动集中爆发。同一条时间线也包含迄今最重要的负面事件：2024 年 12 月 OPL-0401 在糖尿病视网膜病变 Phase 2
              中失败。该失败没有抹掉平台故事，但改变了证明责任。Valo 仍可以主张 Opal
              能在合作项目组合里创造期权价值，但投资者现在应要求更清晰的证据，证明平台生成的资产能跨过转化门槛，走向有临床意义的结果。因此，公司概览最终呈现的是一幅混合图景：外部兴趣强、战略验证真实，但可重复治疗执行仍然是开放问题。
