companyProfile:
  summary: >-
    Valo Health 是一家由 Flagship Pioneering 孵化的 AI 药物发现公司，借助 Opal 平台把人体生物学数据与机器学习结合，用于靶点识别、先导化合物优化和临床生物标志物预测。公司成立于 2019
    年，并于 2020 年 9 月公开亮相，已融资超过 $450M，并与 Novo Nordisk 和 Merck KGaA 建立了大型制药合作。
  foundedDate: '2019-01-01'
