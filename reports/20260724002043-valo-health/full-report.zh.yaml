  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与正确的测算方式
        blocks:
          - type: paragraph
            body: >-
              Valo 并不干净地落在一个简单的「AI 软件」盒子里。更合适的边界是 AI 赋能的药物发现与开发：平台把生物学洞察、专有数据、化学工作流和里程碑经济安排组合起来。这个区别很重要，因为宽泛的医疗 AI 或云 AI
              支出数字太大、噪声也太多，不能用来承销 Valo。当前市场报告仍有帮助：它们证明买方已经把真实预算投向 AI
              驱动的靶点识别、先导物生成、分子设计和临床前决策支持。但这些报告也说明纪律为什么重要。有些估算捕捉的是狭义发现软件和服务；另一些捕捉的是更宽的基础设施、工具和资产参与经济生态。对 Valo
              而言，正确框架是一种区间化市场视角，既尊重其混合模式，也承认多数公开价值池大于 Valo 未来几年能直接捕捉的支出。进一步看，投资者不应把 Valo 映射到整个医疗 AI
              宇宙。真实市场更窄、更集中，并受制于漫长的制药决策周期；这正是为什么宽泛 TAM 数字看起来很亮眼，却仍会高估 Valo 当前阶段近期可变现需求。更窄的定义让市场测算对投资者保持诚实。
