              2，随后在预定义主要人群中的主要终点和关键次要终点上失败。这个结果比公司早先的入组里程碑更重要，因为它是对产品系统能否创造一个具临床牵引力的内部推进资产最清晰的测试。答案不是彻底的「否」，但显然是「尚未证明」。因此，合作方背书的验证目前比内部项目成功拥有更高证据权重。这种雄心与部分证明的组合，正是产品尽调应聚焦实施细节、基准证据和真实转化指标，而不是停留在架构故事听起来是否有战略吸引力的原因。
