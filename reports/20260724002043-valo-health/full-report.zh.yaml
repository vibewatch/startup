      - number: '7.3'
        title: 资本结构与合作方依赖风险
        blocks:
          - type: paragraph
            body: >-
              资本风险仍然偏高，因为最后一次清晰披露的股权融资是 2021 年 Series B 轮，而公开市场 SPAC 路径已在同年晚些时候终止。与 Novo Nordisk 和 Merck KGaA
              的战略交易带来实质帮助；它们验证公司，也可能提供近期或与里程碑挂钩的经济利益。但这些交易没有消除融资风险。相反，它们把融资风险转成对少数交易对手、少数项目和未来或有付款的依赖。如果 Novo 或 Merck
              改变优先级、放慢项目推进，或重新谈判范围，Valo 可能同时承受财务和声誉压力。公司私营且披露有限的状态放大了这个问题，因为外部无法测试当前现金或 现金跑道。这意味着资本风险与依赖风险不可分：Valo
              不只是依赖资金，还依赖资金来自哪里，以及附着在资金上的假设。因此，风险结论不只是某一个红旗，而是相关暴露：一旦模型某一部分变弱，其他几部分可能迅速恶化，因为公司仍在同时证明平台能力和融资韧性。
