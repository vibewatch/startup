      - number: '8.3'
        title: 上市与私营可比公司框出很宽的区间
        blocks:
          - type: paragraph
            body: >-
              可比公司分析在这里有用，但前提是保持克制。Recursion 和 Schrödinger 是相关的公开可比公司，因为它们展示了计算驱动发现里的两种变现和验证路径。Isomorphic
              Labs、insitro、Insilico Medicine、Xaira 等私有同行说明，投资者仍愿意押注强 AI 生物科技
              故事，但这些同行提供的价格透明度有限。没有一个可比对象能完全对上。有人更像软件公司，有人是平台加管线，有人阶段更早，也有人背靠不同的战略生态。结论不是 Valo
              等于其中任何一家；结论是应使用估值区间，而不是单点估值。公开验证、伙伴背书、融资新鲜度和内部产品转化都要一起加权，不能硬套一个虚假的单一倍数。因此，该决策同时对价格和信息敏感：披露或结构更强时，同一家公司可能有吸引力；如果只能在更弱议价位置融资，吸引力会低得多。
            claimRefs:
              - CV013
