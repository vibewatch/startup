chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与运营框架
        blocks:
          - type: paragraph
            body: >-
              Valo 将自己定位为一家由人体数据驱动的药物发现公司，而不是狭窄的 AI 工具供应商。官方网站首页、方法论页面和 Flagship
              材料都把平台描述为一个运营闭环：把纵向患者数据、疾病生物学和分子设计接起来。这一点对尽调很关键，因为后续章节必须同时把 Valo 看作技术平台和能产出资产的生物技术公司。总部记录足够一致，可以锚定
              Boston；多份官方新闻稿也提到 Lexington 和其他运营地点。当前阶段最适合描述为后期私营、披露有限：Valo
              拥有大型一线合作伙伴、成熟管理层任命和公开估值参照，但没有通常伴随上市公司或高度透明公司出现的财务披露包。身份部分也影响信源交叉验证：公司很容易在公开渠道找到，却难以完整承销，因为管理层、合作伙伴和融资公告披露的信息多于运营披露。这种错配本身就是概览故事的一部分，也说明后续章节必须更多依靠合作证据，而不是传统上市公司指标。公开信息不对称推高了后续尽调负担。也就是说，Valo
              容易描述，却更难精准定价。
