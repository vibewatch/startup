        - date: '2020-09-24'
          label: 公开亮相
          detail: Valo 开始对外定位 Opal。
          tone: positive
        - date: '2021-03-09'
          label: B 轮达到 USD 300M
          detail: 首次交割加上 Koch 扩展，完成该轮融资。
          tone: positive
        - date: '2021-11-15'
          label: SPAC 终止
          detail: 公开市场路径取消。
          tone: warning
        - date: '2023-09-24'
          label: Novo 合作启动
          detail: 大药企对心血管代谢方向的验证开始。
          tone: positive
        - date: '2024-01-16'
          label: 领导层交接
          detail: Berry 离任后，Schade 和 Bell 接手。
          tone: warning
        - date: '2024-11-13'
          label: Brian Alexander 出任 CEO
          detail: 围绕执行的运营重置。
          tone: positive
        - date: '2024-12-31'
          label: OPL-0401 2 期未达标
          detail: 迄今最可见的内部管线挫折。
