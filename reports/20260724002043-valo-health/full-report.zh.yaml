      - number: '7.4'
        title: 人才、治理与可见缓释因素
        blocks:
          - type: paragraph
            body: >-
              领导层风险真实存在，但不是单线条。2024 年从 David Berry 转向 Schade/Bell 过渡架构，随后 Brian Alexander
              获任，清楚显示公司进行了有意义的治理和运营重置。对一家采用平台加管线模型的私营生物技术公司而言，这可能造成不稳定。另一方面，引入后期阶段运营者画像，也可能提升纪律。其他公开缓释因素也存在：大型制药关系对科学形成足够验证，让交易对手继续参与；Charles
              River 里程碑显示内部管线之外有一些工作流推进；MJFF 资助增加了一个独立的神经学信号。即便有这些抵消项，正确的综合风险判断仍然是高。Valo
              面对的不是单一致命缺陷，而是几项相互关联的风险；一旦执行滑坡，它们可能迅速互相传导。因此，风险结论不只是某一个红旗，而是相关暴露：一旦模型某一部分变弱，其他几部分可能迅速恶化，因为公司仍在同时证明平台能力和融资韧性。
