  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 2021 年 SPAC 锚点真实存在，但已经陈旧
        blocks:
          - type: paragraph
            body: >-
              Valo 确实有一个硬的公开估值参照点：2021 年 SPAC 公告中描述的约 $2.8 billion
              估值。这一点重要，因为它证明成熟投资者曾相信公司可以支撑一个大型公开市场故事。但同样重要的是，这笔交易从未完成。交易终止后，该数字不再是市场出清价格，而成了由另一种融资环境塑造的历史标记。把它当作今天的公允价值，会忽略此后发生的一切，包括生物科技市场重估、距离上一次披露股权融资的漫长缺口，以及公司自身好坏参半的产品证明记录。正确用法是把
              2021 年参照作为比较的上沿锚点，而不是盲目承销的数字。因此，这个决策对价格和信息都敏感：披露或结构更强时，同一家公司可能显得有吸引力；如果被迫从较弱的谈判位置融资，吸引力会低得多。
