      - number: '2.3'
        title: 增长驱动因素，以及品类为何现在扩张
        blocks:
          - type: paragraph
            body: >-
              多份当前报告都在描述一个市场：它正在从试点热情走向规模化战略采用。核心驱动很直观：药物发现仍然太慢、太贵、失败率太高，大型买方无法忽视可能改善 R&D
              前端的工具。与此同时，多组学数据、纵向真实世界数据集和更好的云基础设施，抬高了 AI 模型在生物学中能做到的上限。行业文献还强调了一个更细微、但对 Valo
              重要的驱动：经济结构正从纯软件授权，转向与里程碑挂钩、以产出为导向的合作模式。这个转向有利于那些能可信地把平台能力与转化科学结合起来的公司。它也解释了为什么 Valo 最重要的证明点来自 Novo Nordisk
              和 Merck KGaA，而不是经典的按用量计费软件漏斗。
