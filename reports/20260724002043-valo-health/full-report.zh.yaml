      - number: '5.4'
        title: 信任、合规与依赖结构
        blocks:
          - type: paragraph
            body: >-
              Valo 的产品架构还依赖一些在公开文件中只部分可见的因素。数据权利、质量控制、算力成本、合作方数据共享和实验验证闭环，都在平台承诺之下。留存来源在概念上支持这些依赖，尤其通过 nference、Charles
              River 和 KSM 关系体现，但它们没有完整说明治理或合规框架。临床注册证据显示，公司至少能把产品推进到正式试验基础设施中；但这不等于证明每个用例都有成熟的信任技术栈。实际承销结论是，Opal
              方向上看起来强、战略上相关，但投资者在给予完整技术护城河溢价前，应要求更多实施细节。这种雄心与部分证明的组合，正是产品尽调应聚焦实施细节、基准证据和真实转化指标，而不是停留在架构故事听起来是否有战略吸引力的原因。
