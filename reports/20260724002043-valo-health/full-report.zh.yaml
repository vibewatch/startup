      - number: '4.2'
        title: 资本历史、失败的 SPAC 与四年披露缺口
        blocks:
          - type: paragraph
            body: >-
              Valo 很早就建立了令人印象深刻的资本基础，但顺序很重要。2021 年 Series B 轮总共带来 $300 million，并把已披露融资额推高到 $450 million 以上。不久之后，公司试图通过
              SPAC 交易上市，该交易估值约 $2.8
              billion，且预期总现金流入可观。拟议交易最终没有完成，这一点很重要，因为它在生物科技情绪恶化的节点，移除了一个可见的公开市场桥梁。此后，留存的公开记录没有显示另一轮定价股权融资，在最后一次披露的私募融资与当前运营时点之间留下了漫长缺口。到
              2026 年 7
              月，这个缺口本身就是一个财务事实：投资者不知道交易预付款是否已经完全接上现金跑道，还是只是推迟了更艰难的融资讨论。因此，最重要的财务判断并不只是标题经济规模是否大，而是它们能否转化为持久运营灵活性，同时不在证明加深前迫使公司接受不具吸引力的融资事件。
