  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与转化执行风险
        blocks:
          - type: paragraph
            body: >-
              Valo 最大的结构性风险很简单：它尚未证明有获批疗法，公开记录也只提供了部分证据，说明平台产出能一路穿过临床和监管关口。因此 OPL-0401
              格外重要。它是留存来源中最清晰的正式测试案例，并且在预定义主要人群中的主要终点和关键次要终点上失败。这并不在概念上否定 Opal，但确实说明发现可信度不会自动变成临床成功。由于 Valo
              的估值仍部分取决于它把平台洞察转成资产的能力，监管和转化风险就位于风险栈中心。投资者应把公司承销为一个高不确定性的药物发现平台，而不是已去风险的开发阶段生物技术公司。因此，风险结论不只是某一个红旗，而是相关暴露：一旦模型某一部分变弱，其他几部分可能迅速恶化，因为公司仍在同时证明平台能力和融资韧性。
