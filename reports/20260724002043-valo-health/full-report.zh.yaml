      - number: '2.2'
        title: 买方分层、预算所有者与采用路径
        blocks:
          - type: paragraph
            body: >-
              市场证据指向大型制药研究组织，它们是 Valo 这类产品的主要经济买方。这是合理的，因为价值主张不是泛化的生产力层，而是主张更好的生物学根基和数据驱动的靶点选择能改善项目组合结果。生物技术公司、CRO
              和研究网络仍然重要，但它们通常通过更窄的合作、范围明确的服务或特定项目支持参与。市场看起来也由合作牵引。买方在扩大投入前，需要看到平台能提升靶点质量、缩短周期，或减少走不通的化学路径。因此，有名有姓的合作比标题式市场规模更重要。也因此，买方准备度取决于湿实验兼容性、数据治理和决策权，而不只是模型质量。Valo
              自己公开的商业路径几乎完全符合这一模式。
