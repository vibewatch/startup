      - number: '1.2'
        title: 创始人、领导层与治理依赖
        blocks:
          - type: paragraph
            body: >-
              领导层变化是 Valo 故事的核心。David Berry 从孵化到公开亮相一直领导公司，但 2024 年 1 月的董事会重置任命 Christian Schade 为执行董事长、Graeme Bell
              为临时首席执行官。这个转换很重要，因为它把 Valo 从创始人主导的叙事构建，转向更强调运营纪律。下一步发生在 2024 年 11 月，Brian Alexander
              接任首席执行官，公司也补强了运营和董事会厚度。公开材料现在显示，管理团队覆盖科学、人才、财务和平台能力，但公司似乎仍依赖相对小的一圈高级决策者。尽调中，这本身不打破投资假设；它只是意味着，执行质量和领导层连续性必须始终放在后续评估的中心。
