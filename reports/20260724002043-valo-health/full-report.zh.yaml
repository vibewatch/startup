        - 决定普通股价值
        - 索取融资文件
      - - 合同权利
        - 终止、排他和控制权条款
        - 决定伙伴依赖严重程度
        - 审阅重大协议
      - - 项目转化指标
        - 各阶段历史推进情况
        - 决定平台到资产的证明
        - 审阅内部 KPI 包
      - - 基准与数据治理证据
