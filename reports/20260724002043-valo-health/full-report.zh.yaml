            body: >-
              主要负面商业读穿来自 OPL-0401。平台公司通常能承受一个内部项目失败，但交易对手必然会问，这次失败是否更广泛地反映了靶点逻辑、转化纪律或内部执行。因此，2024
              年挫折之后合作活动继续增长才重要。公开证据显示，该失败没有造成外部关系的明显断裂，但几乎肯定抬高了 Valo 在销售新项目或要求现有合作方加深承诺时必须达到的标准。平衡判断是，Valo
