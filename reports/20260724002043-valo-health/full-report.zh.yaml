  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Opal 架构与人体数据的核心角色
        blocks:
          - type: paragraph
            body: >-
              Valo 的产品故事从 Opal 开始。公司把 Opal 描述为连接人体数据、因果生物学和化学的集成引擎。公开材料一贯强调，平台不是单一 AI
              模型，也不是孤立的软件模块。它被呈现为药物发现的操作系统：纵向患者信息、生物学推断、靶点逻辑和分子生成相互喂给。这一框架很重要，因为它说明 Valo
              试图解决的是系统问题，而不只是筛选问题。它也制造了尽调负担：投资者需要区分哪些已有清晰支撑——人体数据强调、合作方兴趣和宽广技术雄心——哪些仍披露较轻，例如内部模型架构、基础设施，以及相对于替代方案的实测表现。这种雄心与部分证明的组合，正是产品尽调应聚焦实施细节、基准证据和真实转化指标，而不是停留在架构故事听起来是否有战略吸引力的原因。
