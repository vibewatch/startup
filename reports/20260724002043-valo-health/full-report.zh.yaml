      - number: '2.4'
        title: 采用约束与真正的尽调问题
        blocks:
          - type: paragraph
            body: >-
              AI
              药物发现当前的热度没有消除买方犹豫的经典原因。市场报告反复提到，验证、可解释性、可重复性和监管不确定性都是真实约束。人才稀缺同样重要，因为只有当生物学、化学、数据工程和临床判断能一起运转时，这些平台才会创造价值。就
              Valo 而言，市场机会大到足以支撑上行，但还不够清晰，无法单独验证价格。最大的矛盾在于，市场规模报告很宽，而整个行业里持久变现的证据仍集中在少数战略交易中。这意味着尽调问题仍然很实际：Valo
              能否持续赢得大型交易对手？这些合作能否转化为被验证的资产或里程碑？公司能否在扩张时不丢掉科学可信度？这些问题远比任何单一 TAM 数字重要。
