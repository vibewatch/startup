              Valo 的融资路径很早就定下了雄心。2021 年 1 月首轮交割和 2021 年 3 月扩展合在一起，构成 $300 million 的 Series B 轮，并把已披露融资额推高到 $450 million
              以上。2021 年中，公司试图借 SPAC 交易把这股势能转成进入公开市场的路径，隐含估值约 $2.8 billion，并预计带来可观的总现金流入。该交易随后终止，同样是关键证据，因为它说明 2021–2022
              年生物科技重估期间，外部资本市场对这个故事的支持没能持续。更近的 Novo Nordisk 和 Merck KGaA
              合作显示，虽然股权市场验证变得不那么可见，战略制药验证反而增强。因此，利益相关方地图被分成几类：Flagship 和 PSP 这样的基础支持者，Novo 与 Merck KGaA
