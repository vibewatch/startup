      - number: '8.2'
        title: 战略交易信号支撑价值，但无法给出精确定价
        blocks:
          - type: paragraph
            body: >-
              2021 年以来最强的正面信号不是私募轮，而是战略合作。扩大的 Novo Nordisk 关系和后来的 Merck KGaA
              交易显示，成熟交易对手看到了足够的平台价值，愿意签下大额且经济意义重的协议。这些交易支撑了真实的企业价值案例，因为它们意味着外部需求、技术可信度，以及未来实现里程碑的可能性。不过，它们无法单独解决估值问题。标题交易价值不等于已入账收入、当前现金或投后股权价值。它们是期权含量高的信号，已实现价值取决于执行、项目节奏和合同结构。因此，投资者应把这些交易解读为
              Valo 不只是投机叙事的证据，同时抵制把全部潜在经济价值简单换算成股权标记的诱惑。因此，这个决策对价格和信息都敏感：披露或结构更强时，同一家公司可能显得有吸引力；如果被迫从较弱的谈判位置融资，吸引力会低得多。
