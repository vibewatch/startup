      - number: '3.2'
        title: 能力对比、定价逻辑与切换成本
        blocks:
          - type: paragraph
            body: >-
              横向比较这一格局，重点不是排出一个通用榜单，而是看每家公司能控制发现技术栈中的哪一环。Recursion 和 insitro 强调系统级整合；Isomorphic Labs 强调前沿预测科学；Insilico
              强调平台加管线的雄心；Schrödinger 强调计算化学和软件变现；Valo
              强调来自纵向人体数据的因果生物学。这些差异会影响定价和打包方式。偏软件的平台可以销售更广的访问权限和经常性使用；偏资产的平台通常依赖里程碑、共同开发、特许权使用费或其他与产出挂钩的结构。因此，买方切换成本并不均匀。纯工作流工具更容易多平台并用；但一旦一家公司在真实项目中贡献核心靶点逻辑或化合物推进，替换就困难得多。这就是承销竞争耐久性时，合作深度而不只是管线广度重要的原因。竞争含义是，Valo
              不能靠泛泛描述 AI 取胜；它必须证明，纵向人体数据、转化工作流深度和账户级合作方信任这套特定组合，为什么能比同行补齐差距更快地复利增长。因此，护城河、工作流和证据的不同视角，比简单的知名度名单更重要。
