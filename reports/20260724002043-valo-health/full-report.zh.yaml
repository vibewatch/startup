  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入架构：先有合作经济，再谈产品销售
        blocks:
          - type: paragraph
            body: >-
              Valo 可见的财务模型并不围绕已上市疗法或已披露的软件订阅构建。公开记录指向的是合作经济：预付款、研究经费、里程碑、特许权使用费，以及某些情况下来自制药合作方的战略股权部分。这个模型适合一家私营 AI
              生物技术平台：在证明内部商业化产品之前，先把发现能力变现。模型的强项是，它可以比药品销售更早带来有意义的非稀释或半稀释资本。弱点在于，这些经济安排集中、或有且不平滑。因此，投资者不应把大额标题交易价值等同于经常性收入或自由现金流。真正的承销任务，是把已入账或近期经济利益，与长期或有上行分开。因此，最重要的财务判断并不只是标题经济规模是否大，而是它们能否转化为持久运营灵活性，同时不在证明加深前迫使公司接受不具吸引力的融资事件。
