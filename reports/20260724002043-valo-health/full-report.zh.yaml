      - number: '7.2'
        title: 技术、数据与运营模型风险
        blocks:
          - type: paragraph
            body: >-
              Valo
              的技术主张本身也是风险来源，因为它要求多个复杂子系统同时工作。大规模人体数据、因果推断、化学、外部合作方整合和实验验证都在同一条链上。如果跑通，这套架构能形成强护城河；如果跑不通，也有很多失败方式。数据权利或质量问题会污染模型。模型逻辑薄弱会把化学带向错误方向。脆弱的实验室验证会在合作方价值实现前打断闭环。公开来源对隐私、安全或可重复性控制也缺乏直接可见度；对一家故事依赖敏感人体数据工作流的公司而言，这一点很重要。同时运营平台业务和内部管线，又增加一层运营复杂度和资本配置张力。因此，风险结论不只是某一个红旗，而是相关暴露：一旦模型某一部分变弱，其他几部分可能迅速恶化，因为公司仍在同时证明平台能力和融资韧性。
