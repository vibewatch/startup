      - number: '8.4'
        title: 牛市、基准和熊市情景指向继续研究
        blocks:
          - type: paragraph
            body: >-
              情景框架能把估值判断看得更清楚。牛市情景下，Valo 继续把大药企信心转成可见的里程碑兑现，避开融资压力，并推动更多项目进展，修复 OPL-0401
              之后平台的转化可信度。基准情景下，战略验证仍在，但资本不透明、临床证据不均衡，公司估值大致停留在或低于陈旧的 2021 年估值语境。熊市情景下，下一轮融资条款偏弱，合作伙伴收窄范围，或另一个重大项目挫折进一步放大
              OPL-0401
              的阴影。三条路径都仍然可能，而且公开记录对私营运营指标仍披露不足，因此正确建议是继续研究。公司获得的验证太多，不能直接否定；但透明度又太低，不能按表面信息激进承销。因此，该决策同时对价格和信息敏感：披露或结构更强时，同一家公司可能有吸引力；如果只能在更弱议价位置融资，吸引力会低得多。
