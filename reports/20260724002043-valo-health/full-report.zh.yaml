  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 谁算 Valo 的客户
        blocks:
          - type: paragraph
            body: >-
              对 Valo
              而言，「客户」不能只限于软件买方或医院标识。公司的公开模型由合作牵引，这意味着经济上重要的交易对手，是那些为发现产出、项目参与、数据赋能的工作流访问，或未来带里程碑权益付费的制药和生物技术组织。按这个标准，Novo
              Nordisk 和 Merck KGaA 显然是最重要的类客户关系。Charles River、nference 和 KSM
              也重要，但方式不同：它们更适合理解为工作流、生态或数据网络交易对手，而不是主要经济锚点。这个区分很重要，因为它改变了应如何判断牵引力。投资者应少看原始
              客户标识数量，多看账户深度、项目范围，以及关系是否扩展到更高价值阶段。商业上，这意味着 Valo 应被看作企业级合作销售者，而不是广席位软件供应商；相应重点也应放在账户深度、多年相关性和交易对手质量上。
