- id: capabilities
  title: Capability comparison, pricing logic, and switching costs
  body: Capability comparison across this landscape is less about one universal leaderboard and more about which component of the discovery stack each company can control. Recursion and insitro foreground system-level integration; Isomorphic Labs foregrounds frontier-prediction science; Insilico foregrounds platform-plus-pipeline ambition; Schrödinger foregrounds computational chemistry and software monetization; Valo foregrounds causal biology from longitudinal human data. Those differences influence pricing and packaging. Software-forward platforms can sell broader access and recurring usage, while asset-forward platforms typically rely on milestones, co-development, royalties, or other output-linked structures. Buyer switching costs are therefore uneven. Pure workflow tooling can be multi-homed more easily, but once a company contributes core target logic or compound progression inside a live program, replacement becomes much harder. This is why partnership depth, not just pipeline breadth,
    matters when underwriting competitive durability. The competitive implication is that Valo cannot win by describing AI broadly; it has to demonstrate why its specific combination of longitudinal human data, translational workflow depth, and account-level partner trust compounds faster than peers can close the gap. That is why distinct lenses on moat, workflow, and proof matter more than simple name-recognition lists.
  claimRefs:
  - CP010
  - CP011
  - CP012
  - CP013
  - CP014
  - CP015
