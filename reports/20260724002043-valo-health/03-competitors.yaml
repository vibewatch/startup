    severity: minor
    topic: pricing
    missingEvidence: More direct disclosures of commercial packaging across private peers.
    whyItMatters: Pricing comparison remains structurally limited because many private AI-biotech contracts are undisclosed.
    diligencePath: Use diligence calls and partner references to test real pricing and packaging differences.
