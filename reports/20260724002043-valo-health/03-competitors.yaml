  title: Competitors
  summary: Valo sits in a crowded AI-enabled drug discovery field where its strongest visible advantages are human-data emphasis and major-pharma validation, while its weakest area is public proof of repeated conversion.
sections:
- id: landscape
  title: 'Landscape: direct peers, adjacencies, and substitutes'
  body: 'Valo competes inside a crowded but still shape-shifting AI-enabled drug discovery landscape. The closest direct peers are companies that present themselves as AI-native discovery platforms with some combination of proprietary data, wet-lab integration, and owned or partnered pipeline economics. Recursion, Isomorphic Labs, insitro, Insilico Medicine, Schrödinger, and BenevolentAI all fit at least part of that pattern, even if their monetization models differ. Relay Therapeutics and Verily are better treated as adjacencies or substitutes: Relay matters because it offers a different precision-drug-discovery path that can still attract capital and partner attention, while Verily matters because data, analytics, and infrastructure access can shape how buyers evaluate AI-enabled programs. The important point is that Valo is not competing only on model quality. It is competing on data depth, translational credibility, partner trust, and the ability to convert discovery claims into repeatable
    economic outcomes. The competitive implication is that Valo cannot win by describing AI broadly; it has to demonstrate why its specific combination of longitudinal human data, translational workflow depth, and account-level partner trust compounds faster than peers can close the gap. That is why distinct lenses on moat, workflow, and proof matter more than simple name-recognition lists. Competitive framing therefore needs evidence, not slogans. That is the competitive bar Valo still must clear publicly. Public proof still matters here. Clear.'
