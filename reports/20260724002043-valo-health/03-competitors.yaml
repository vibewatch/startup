  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: competitive-proof
    missingEvidence: Customer renewal, pipeline-conversion, and benchmark-performance data versus direct peers.
    whyItMatters: Competitive positioning is currently inferred from narratives and public partnerships more than from like-for-like operating metrics.
    diligencePath: Request win/loss analyses, partner renewal evidence, and program progression benchmarks from management.
