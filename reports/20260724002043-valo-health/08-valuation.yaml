- id: comparable-set
  title: Public and private comparables frame a wide range
  body: 'Comparable analysis is helpful here, but only if used with humility. Recursion and Schrödinger are relevant public comparables because they show two different monetization and proof patterns inside computationally enabled discovery. Private peers like Isomorphic Labs, insitro, Insilico Medicine, and Xaira show that investors still fund strong AI-biotech stories, but those peers provide limited price transparency. None of these comps is a perfect match. Some are more software-like, some more platform-and-pipeline, some earlier, and some backed by different strategic ecosystems. The lesson is not that Valo equals any one of them. The lesson is that a value range, not a point estimate, is the right framework. Public proof, partner validation, financing freshness, and internal product conversion all need to be weighted together rather than forcing a false single multiple. That is why the decision is price-sensitive and information-sensitive: the same company could look attractive with
    stronger disclosure or structure, and much less attractive if forced to finance from a weaker bargaining position.'
  claimRefs:
  - CV013
  - CV014
  - CV015
  - CV016
  - CV017
  - CV018
  - CV034
  - CV035
  - CV036
  tableRefs:
  - TV004
  figureRefs: []
- id: scenarios-and-recommendation
  title: Bull, base, and bear scenarios lead to a research-more call
  body: 'A scenario framework makes the valuation judgment clearer. In the bull case, Valo continues converting major-pharma confidence into tangible milestone realization, avoids financing stress, and demonstrates additional program progression that rehabilitates the platform’s translational credibility after OPL-0401. In the base case, strategic validation persists but capital opacity and uneven clinical proof keep the company roughly around or below its stale 2021 valuation context. In the bear case, the next financing arrives on weak terms, partners narrow scope, or another material program setback compounds the OPL-0401 overhang. Because all three paths remain plausible and because the public record is still thin on private operating metrics, the right recommendation is research-more. The company is too validated to dismiss and too opaque to underwrite aggressively at face value. That is why the decision is price-sensitive and information-sensitive: the same company could look attractive
    with stronger disclosure or structure, and much less attractive if forced to finance from a weaker bargaining position.'
