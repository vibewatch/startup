chapter:
  number: 8
  title: Valuation
  summary: Valo’s valuation case is supported by unusually strong strategic-deal signals but constrained by stale price discovery, a long financing-disclosure gap, and unresolved translational proof, leading to a research-more recommendation.
sections:
- id: valuation-anchor
  title: The 2021 SPAC anchor is real but stale
  body: 'Valo does have a hard public valuation reference point: the roughly $2.8 billion valuation described in the 2021 SPAC announcement. That matters because it proves sophisticated investors once believed the company could support a large public-market story. But it matters just as much that the deal never closed. Once the transaction was terminated, the figure stopped being a market-clearing price and became a historical marker shaped by a different financing environment. Using it as a present-day fair value would ignore everything that happened afterward, including the biotech-market reset, the long gap since the last disclosed equity financing, and the company’s own mixed product proof record. The right way to use the 2021 reference is as an upper anchor for comparison, not as a number to underwrite blindly. That is why the decision is price-sensitive and information-sensitive: the same company could look attractive with stronger disclosure or structure, and much less attractive
    if forced to finance from a weaker bargaining position.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV012
  - CV030
  - CV035
  - CV039
  tableRefs: []
  figureRefs:
  - FV003
- id: strategic-deal-signals
  title: Strategic deal signals support value, but not precise price discovery
  body: 'The strongest positive signals since 2021 are not private rounds; they are strategic collaborations. The expanded Novo Nordisk relationship and the later Merck KGaA deal indicate that sophisticated counterparties see enough platform value to sign large, economically meaningful agreements. Those deals support a real enterprise-value case because they imply external demand, technical credibility, and the possibility of future milestone realization. However, they do not solve the valuation problem on their own. Headline deal values are not equivalent to booked revenue, current cash, or post-money equity value. They are option-rich signals whose realized value depends on execution, program timing, and contract structure. Investors should therefore read the deals as evidence that Valo is more than a speculative narrative, while resisting the temptation to convert the total potential economics into a simple equity mark. That is why the decision is price-sensitive and information-sensitive:
    the same company could look attractive with stronger disclosure or structure, and much less attractive if forced to finance from a weaker bargaining position.'
  claimRefs:
  - CV004
  - CV005
  - CV006
  - CV007
  - CV008
  - CV009
