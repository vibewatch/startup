  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and operating frame
        blocks:
          - type: paragraph
            body: >-
              Valo presents itself as a human-data-driven drug discovery company, not a narrow AI tooling vendor. The
              official homepage, approach page, and Flagship materials all describe a platform built to connect
              longitudinal patient data, disease biology, and molecule design in one operating loop. That matters for
              diligence because it means later chapters should evaluate Valo as both a technology platform and an
              asset-producing biotech company. The headquarters record is consistent enough to anchor on Boston, while
              several official releases also cite Lexington and other operating locations. The current stage is best
              described as late-stage private and private-undisclosed: Valo has major blue-chip partnerships, mature
              leadership hires, and public valuation references, but not the financial disclosure package that would
              normally accompany a public or fully transparent company. This identity section also matters for source
              triangulation: the company is easy to locate publicly, but hard to fully underwrite because leadership,
              partnerships, and financing announcements carry more detail than operating disclosures. That mismatch is
              itself part of the overview story and reinforces why later chapters must lean on partnership evidence
              rather than on classic public-company metrics. Those public asymmetries drive the later diligence burden.
              These facts make Valo easy to describe but harder to price precisely.
