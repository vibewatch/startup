      - number: '2.4'
        title: Adoption constraints and the real diligence questions
        blocks:
          - type: paragraph
            body: >-
              The current enthusiasm around AI drug discovery does not eliminate the classic reasons buyers hesitate.
              Market reports repeatedly surface validation, explainability, reproducibility, and regulatory uncertainty
              as real constraints. Talent scarcity also matters because these platforms only create value when biology,
              chemistry, data engineering, and clinical judgment can operate together. For Valo specifically, the market
              opportunity is large enough to support upside but not clear enough to validate price on its own. The
              biggest contradiction is that market-size reports are broad while evidence of durable monetization remains
              concentrated in a small set of strategic deals across the sector. That means the diligence questions
              remain practical: can Valo keep winning large counterparties, can those collaborations convert into
              validated assets or milestones, and can the company scale without losing scientific credibility? Those
              questions matter far more than any single TAM number.
