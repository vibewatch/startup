  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Opal architecture and the central role of human data
        blocks:
          - type: paragraph
            body: >-
              Valo’s product story starts with Opal, which the company describes as the integrated engine connecting
              human data, causal biology, and chemistry. Public materials consistently emphasize that the platform is
              not a single AI model or isolated software module. It is presented as an operating system for discovery,
              where longitudinal patient information, biological inference, target logic, and molecule generation feed
              each other. That framing is important because it suggests Valo is trying to solve a systems problem rather
              than only a screening problem. It also creates diligence burden: investors need to separate what is
              clearly supported—human-data emphasis, partner interest, and a broad technical ambition—from what remains
              lightly specified, such as internal model architecture, infrastructure, and measured performance against
              alternatives. That combination of ambition and partial proof is exactly why product diligence should focus
              on implementation specifics, benchmark evidence, and real conversion metrics rather than on whether the
              architectural story sounds strategically attractive.
