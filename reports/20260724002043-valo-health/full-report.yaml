        title: 'Financial judgment: real strategic monetization, limited public underwriteability'
        blocks:
          - type: paragraph
            body: >-
              The public financial picture supports neither a pessimistic “no monetization” view nor an optimistic
              “de-risked economic engine” view. Valo clearly has partner-backed economic credibility: Novo and Merck
              KGaA would not sign large multi-program relationships without some confidence in the platform. But the
              same disclosures leave crucial questions unanswered—cash balance, runway, recognized revenue, deferred
              revenue, margin profile, and the true timing or probability of milestones. OPL-0401’s failure also reminds
              investors that some economic narrative may never convert into durable product value. The right read is
              that Valo has assembled a potentially valuable financing architecture, but one that remains heavily
              reliant on strategic counterparties and internal execution. Management can narrow the gap quickly by
              disclosing private-room metrics, but public-room evidence remains insufficient for precise underwriting.
              That is why the most important financial judgment is not simply whether the headline economics are large,
