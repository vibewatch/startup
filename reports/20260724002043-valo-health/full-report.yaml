      - number: '2.3'
        title: Growth drivers and why the category is expanding now
        blocks:
          - type: paragraph
            body: >-
              Multiple current reports describe a market that is graduating from pilot enthusiasm into scaled strategic
              adoption. The core drivers are intuitive: drug discovery remains too slow, too expensive, and too
              failure-prone for large buyers to ignore tools that might improve the front end of R&D. At the same time,
              multi-omics data, longitudinal real-world datasets, and improved cloud infrastructure have raised the
              ceiling for what AI models can do in biology. Sector literature also highlights a more subtle driver that
              matters for Valo: economic structures are shifting from pure software licensing toward milestone-linked,
              output-oriented partnership models. That shift is favorable to companies that can credibly combine
              platform capability with translational science. It also explains why Valo’s biggest proof points come from
              Novo Nordisk and Merck KGaA, not from a classic usage-based software funnel.
