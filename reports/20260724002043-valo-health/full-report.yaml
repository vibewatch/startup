      - number: '1.3'
        title: Funding history, valuation context, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Valo’s funding path established ambition early. The January 2021 first close and March 2021 extension
              together created a $300 million Series B and pushed disclosed capital raised past $450 million. In
              mid-2021, the company attempted to convert that momentum into a public-market path through a SPAC
              transaction that implied a roughly $2.8 billion valuation and substantial gross cash proceeds. The
              transaction’s later termination is equally important evidence because it shows that external
              capital-market support for the story was not durable through the 2021–2022 biotech reset. More recently,
              the Novo Nordisk and Merck KGaA partnerships show that while equity-market validation became less visible,
              strategic-pharma validation increased. The stakeholder map is therefore split between foundational backers
              like Flagship and PSP, strategic partners such as Novo and Merck KGaA, and management that now has to
              convert milestone rhetoric into durable value creation.
