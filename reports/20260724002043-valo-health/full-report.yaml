      - number: '1.4'
        title: Milestones, platform proof, and adverse events
        blocks:
          - type: paragraph
            body: >-
              The milestone record is strong on partnership formation and weaker on clinical proof. Valo’s chronology
              moves from 2019 founding and 2020 public launch, through 2021 financing, a failed 2021 SPAC, a 2023 Novo
              entry point, a 2024 leadership reset, and a 2025 burst of partnership and grant activity. The same
              timeline also contains the most important adverse event to date: the December 2024 Phase 2 failure for
              OPL-0401 in diabetic retinopathy. That failure did not erase the platform story, but it did change the
              burden of proof. Valo can still argue that Opal creates option value across partnered programs, yet
              investors should now require clearer evidence that platform-generated assets can survive the translational
              jump into clinically meaningful outcomes. The company overview therefore ends with a mixed picture: strong
              external interest, real strategic validation, and a still-open question on repeatable therapeutic
              execution.
