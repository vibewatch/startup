      - number: '4.2'
        title: Capital history, the failed SPAC, and the four-year disclosure gap
        blocks:
          - type: paragraph
            body: >-
              Valo formed an impressive capital base early, but the sequence matters. The 2021 Series B brought in $300
              million total and took disclosed fundraising above $450 million. Soon after, the company attempted to go
              public through a SPAC transaction carrying a roughly $2.8 billion valuation and significant expected gross
              proceeds. That proposed deal never closed, which matters because it removed a visible public-market bridge
              at exactly the point biotech sentiment deteriorated. Since then, the retained public record does not show
              another priced equity round, creating a long gap between the last disclosed private financing and the
              current operating moment. By July 2026, that gap is itself a financial fact: investors do not know whether
              deal upfronts fully bridged runway or merely deferred the need for a harder financing conversation. That
              is why the most important financial judgment is not simply whether the headline economics are large, but
              whether they convert into durable operating flexibility without forcing an unattractive financing event
              before proof deepens.
