      - number: '3.3'
        title: Moat durability and where Valo wins or loses
        blocks:
          - type: paragraph
            body: >-
              Valo’s visible strengths are real. The company has a distinctive human-data narrative, a believable hybrid
              business model, and blue-chip partnership proof that many private peers cannot match publicly. Those
              features give Valo a credible place in the winner set if the broader category keeps expanding. But its
              weak spots are also clear. Public evidence still shows more about strategic interest than about repeated
              asset conversion, clinical durability, or broad customer lock-in. That leaves Valo in a middle position:
              stronger than generic AI-tool vendors because it has differentiated data and deal proof, but less proven
              than the most mature public comparables on repeatable monetization and durable operating metrics. The
              right diligence posture is therefore not to dismiss the moat, but to ask whether the company’s partnership
              wins are deepening into compounding advantages faster than competitors are improving their own data,
              models, and translational systems. The competitive implication is that Valo cannot win by describing AI
              broadly; it has to demonstrate why its specific combination of longitudinal human data, translational
              workflow depth, and account-level partner trust compounds faster than peers can close the gap. That is why
              distinct lenses on moat, workflow, and proof matter more than simple name-recognition lists.
