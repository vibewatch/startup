  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The 2021 SPAC anchor is real but stale
        blocks:
          - type: paragraph
            body: >-
              Valo does have a hard public valuation reference point: the roughly $2.8 billion valuation described in
              the 2021 SPAC announcement. That matters because it proves sophisticated investors once believed the
              company could support a large public-market story. But it matters just as much that the deal never closed.
              Once the transaction was terminated, the figure stopped being a market-clearing price and became a
              historical marker shaped by a different financing environment. Using it as a present-day fair value would
              ignore everything that happened afterward, including the biotech-market reset, the long gap since the last
              disclosed equity financing, and the company’s own mixed product proof record. The right way to use the
              2021 reference is as an upper anchor for comparison, not as a number to underwrite blindly. That is why
              the decision is price-sensitive and information-sensitive: the same company could look attractive with
              stronger disclosure or structure, and much less attractive if forced to finance from a weaker bargaining
              position.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV012
              - CV030
              - CV035
              - CV039
          - type: figure
            figureRef: FV003
