      - number: '8.2'
        title: Strategic deal signals support value, but not precise price discovery
        blocks:
          - type: paragraph
            body: >-
              The strongest positive signals since 2021 are not private rounds; they are strategic collaborations. The
              expanded Novo Nordisk relationship and the later Merck KGaA deal indicate that sophisticated
              counterparties see enough platform value to sign large, economically meaningful agreements. Those deals
              support a real enterprise-value case because they imply external demand, technical credibility, and the
              possibility of future milestone realization. However, they do not solve the valuation problem on their
              own. Headline deal values are not equivalent to booked revenue, current cash, or post-money equity value.
              They are option-rich signals whose realized value depends on execution, program timing, and contract
              structure. Investors should therefore read the deals as evidence that Valo is more than a speculative
              narrative, while resisting the temptation to convert the total potential economics into a simple equity
              mark. That is why the decision is price-sensitive and information-sensitive: the same company could look
              attractive with stronger disclosure or structure, and much less attractive if forced to finance from a
              weaker bargaining position.
            claimRefs:
