      - number: '7.4'
        title: People, governance, and visible mitigants
        blocks:
          - type: paragraph
            body: >-
              Leadership risk is real but nuanced. The 2024 transition away from David Berry and into a Schade/Bell
              bridge, followed by Brian Alexander’s appointment, clearly indicates a meaningful governance and operating
              reset. That can be destabilizing, especially in a private biotech with a platform-plus-pipeline model. On
              the other hand, the move may also improve discipline by adding a later-stage operator profile. Public
              mitigants exist elsewhere too: major-pharma relationships validate the science enough to keep
              counterparties engaged, the Charles River milestone suggests some workflow progression outside the
              internal pipeline, and the MJFF grant adds an independent neurology signal. Even with those offsets, the
              correct composite risk judgment remains high. Valo is not facing a single fatal flaw, but it is carrying
              several correlated risks that can transmit into each other quickly if execution slips. The risk conclusion
              is therefore less about any single red flag and more about correlated exposure: once one part of the model
              weakens, several other parts can worsen quickly because the company is still proving both its platform and
              its financing resilience at the same time.
