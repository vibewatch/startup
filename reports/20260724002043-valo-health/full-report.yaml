      - number: '8.4'
        title: Bull, base, and bear scenarios lead to a research-more call
        blocks:
          - type: paragraph
            body: >-
              A scenario framework makes the valuation judgment clearer. In the bull case, Valo continues converting
              major-pharma confidence into tangible milestone realization, avoids financing stress, and demonstrates
              additional program progression that rehabilitates the platform’s translational credibility after OPL-0401.
              In the base case, strategic validation persists but capital opacity and uneven clinical proof keep the
              company roughly around or below its stale 2021 valuation context. In the bear case, the next financing
              arrives on weak terms, partners narrow scope, or another material program setback compounds the OPL-0401
              overhang. Because all three paths remain plausible and because the public record is still thin on private
              operating metrics, the right recommendation is research-more. The company is too validated to dismiss and
              too opaque to underwrite aggressively at face value. That is why the decision is price-sensitive and
              information-sensitive: the same company could look attractive with stronger disclosure or structure, and
              much less attractive if forced to finance from a weaker bargaining position.
