      - number: '1.2'
        title: Founders, leadership, and governance dependence
        blocks:
          - type: paragraph
            body: >-
              Leadership changes are central to the Valo story. David Berry led the company from incubation through
              launch, but the board reset in January 2024 installed Christian Schade as executive chairman and Graeme
              Bell as interim chief executive. That transition matters because it reframed Valo from founder-led
              narrative building toward operating discipline. The next step came in November 2024, when Brian Alexander
              took over as chief executive and the company added additional operating and board depth. Public materials
              now show a leadership team with scientific, people, finance, and platform depth, but the company still
              appears dependent on a relatively small circle of senior decision-makers. For diligence, this is not a
              thesis-break by itself; it simply means execution quality and leadership continuity have to stay in the
              center of every downstream assessment.
