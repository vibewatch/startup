      - number: '8.3'
        title: Public and private comparables frame a wide range
        blocks:
          - type: paragraph
            body: >-
              Comparable analysis is helpful here, but only if used with humility. Recursion and Schrödinger are
              relevant public comparables because they show two different monetization and proof patterns inside
              computationally enabled discovery. Private peers like Isomorphic Labs, insitro, Insilico Medicine, and
              Xaira show that investors still fund strong AI-biotech stories, but those peers provide limited price
              transparency. None of these comps is a perfect match. Some are more software-like, some more
              platform-and-pipeline, some earlier, and some backed by different strategic ecosystems. The lesson is not
              that Valo equals any one of them. The lesson is that a value range, not a point estimate, is the right
              framework. Public proof, partner validation, financing freshness, and internal product conversion all need
              to be weighted together rather than forcing a false single multiple. That is why the decision is
              price-sensitive and information-sensitive: the same company could look attractive with stronger disclosure
              or structure, and much less attractive if forced to finance from a weaker bargaining position.
            claimRefs:
