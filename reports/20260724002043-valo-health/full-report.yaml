      - number: '5.2'
        title: Workflow from target discovery to translational output
        blocks:
          - type: paragraph
            body: >-
              The strongest read on Valo’s product workflow is that it aims to move from observational human data into
              mechanistic hypotheses, then into molecules or program decisions through closed-loop chemistry and
              experimental validation. That is a bigger claim than “AI helps rank targets.” It is also why the company
              highlights collaborations and cross-functional ecosystems rather than a broad self-serve product. The
              Charles River and Logica milestone is useful here because it offers a concrete example of the workflow
              progressing beyond theory. The Novo and Merck relationships reinforce the same point from a different
              angle: large pharmas appear willing to use the system across therapeutic areas. Still, the workflow
              remains only partially de-risked because the public record provides more examples of relationship
              expansion than of repeated, independently validated product-output success. That combination of ambition
              and partial proof is exactly why product diligence should focus on implementation specifics, benchmark
              evidence, and real conversion metrics rather than on whether the architectural story sounds strategically
