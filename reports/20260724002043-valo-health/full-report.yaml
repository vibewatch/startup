  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and the right way to size it
        blocks:
          - type: paragraph
            body: >-
              Valo does not sit cleanly inside a simple “AI software” box. The better boundary is AI-enabled drug
              discovery and development, where platforms combine biological insight, proprietary data, chemistry
              workflows, and milestone economics. That distinction matters because broad healthcare-AI or cloud-AI
              spending figures are too large and too noisy to underwrite Valo. The current market reports still help:
              they establish that buyers are already committing real budgets to AI-led target identification, lead
              generation, molecule design, and preclinical decision support. But they also show why discipline matters.
              Some estimates capture narrowly defined discovery software and services; others capture a wider ecosystem
              of infrastructure, tooling, and asset-participation economics. For Valo, the right framing is a
              range-based market lens that respects its hybrid model and the fact that most public value pools are
              larger than the spend Valo can directly capture in the next few years. A further implication is that
              investors should resist mapping Valo to the full healthcare-AI universe. The real market is narrower, more
              concentrated, and governed by long pharmaceutical decision cycles, which is precisely why broad TAM
              numbers can look impressive while still overstating near-term monetizable demand for a company at Valo's
              current stage. That narrower definition keeps market sizing honest for investors.
