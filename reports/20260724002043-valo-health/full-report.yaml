  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Who counts as a customer for Valo
        blocks:
          - type: paragraph
            body: >-
              For Valo, “customer” cannot be limited to a software buyer or a hospital logo. The company’s public model
              is collaboration-led, which means the economically relevant counterparties are pharma and biotech
              organizations that pay for discovery output, program participation, data-enabled workflow access, or
              future milestone-bearing rights. By that standard, Novo Nordisk and Merck KGaA are clearly the most
              important customer-like relationships. Charles River, nference, and KSM matter too, but in different ways:
              they are better understood as workflow, ecosystem, or data-network counterparts rather than the primary
              economic anchors. This distinction matters because it changes how traction should be judged. Investors
              should care less about raw logo count and more about account depth, program scope, and whether the
              relationship is expanding into higher-value stages. Commercially, that means Valo should be judged more
              like an enterprise partnership seller than like a broad-seat software vendor, with all the attendant
              emphasis on account depth, multi-year relevance, and counterparty quality.
