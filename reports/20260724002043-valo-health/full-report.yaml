              Capital risk remains elevated because the last clearly disclosed equity financing is the 2021 Series B,
              while the public-market SPAC route was terminated later that year. Strategic deals with Novo Nordisk and
              Merck KGaA help materially; they validate the company and can provide near-term or milestone-linked
              economics. But they do not eliminate financing risk. Instead, they transform it into dependence on a few
              counterparties, a few programs, and contingent future payments. If Novo or Merck changes priorities, slows
