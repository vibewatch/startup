      - number: '7.2'
        title: Technology, data, and operating-model risk
        blocks:
          - type: paragraph
            body: >-
              Valo’s technology proposition is also a source of risk because it requires several complex subsystems to
              work at the same time. Large-scale human data, causal inference, chemistry, external-partner integration,
              and experimental validation all sit in the same chain. That architecture can create a strong moat if it
              works; it can also create many ways to fail. Problems with data rights or quality can poison models. Weak
              model logic can send chemistry in the wrong direction. Fragile lab validation can break the loop before
              partner value is realized. Public sources also provide little direct visibility into privacy, security, or
              reproducibility controls, which is material for a company whose story depends on sensitive human-data
              workflows. Running both a platform business and an internal pipeline adds another layer of operational
              complexity and capital-allocation tension. The risk conclusion is therefore less about any single red flag
              and more about correlated exposure: once one part of the model weakens, several other parts can worsen
              quickly because the company is still proving both its platform and its financing resilience at the same
              time.
