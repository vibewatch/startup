  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-metrics
    missingEvidence: Customer count, renewal status, backlog, ACV, and partner-concentration data.
    whyItMatters: Public proof shows real traction but cannot measure breadth, stickiness, or downside exposure precisely.
    diligencePath: Request commercial dashboard and partner-by-partner revenue/concentration summary.
  - type: private-evidence-only
    severity: material
    topic: go-to-market
    missingEvidence: Win rates, sales-cycle length, and expansion triggers by customer archetype.
    whyItMatters: These determine whether traction can compound beyond a few flagship accounts.
    diligencePath: Review pipeline reports, deal-stage definitions, and postmortems for lost opportunities.
  - type: enumeration-incomplete
    severity: minor
    topic: TU003 named customer proof coverage
    missingEvidence: A fuller set of direct customer references and contract-level proofs beyond the named public partnerships.
    whyItMatters: The named-customer proof table is intentionally partial because public disclosures are concentrated in a small number of relationships.
    diligencePath: Request customer reference list and proof-of-use materials for additional counterparties.
    relatedTableRefs:
    - TU003
