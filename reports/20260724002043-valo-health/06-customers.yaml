- id: retention-and-concentration
  title: Retention, expansion, and concentration risk
  body: 'Valo’s customer story is stronger on expansion than on diversification. The Novo relationship is the clearest public retention signal because the account expanded in scope rather than remaining static. Merck KGaA demonstrates that the company can still win new anchor relationships, which partly offsets concentration. But the public record offers no customer count, no NRR, and no churn metrics, which forces analysts to infer retention from announcement sequences rather than direct cohort data. That is acceptable for a private biotech platform, but it leaves commercial confidence below what a software investor might want. Concentration remains the central issue: if Novo or Merck slows spending, reprioritizes the programs, or narrows field scope, Valo’s economic and reputational position could change quickly. In other words, commercial traction is real, but it is still narrow enough to be fragile. Commercially, that means Valo should be judged more like an enterprise partnership seller
    than like a broad-seat software vendor, with all the attendant emphasis on account depth, multi-year relevance, and counterparty quality.'
  claimRefs:
  - CU012
  - CU013
  - CU019
  - CU020
  - CU021
  - CU024
  - CU028
