evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, cash balance, burn, and current customer-count disclosure.
    whyItMatters: >-
      The company overview can show scale ambition but cannot convert that ambition into an underwritten operating
      baseline without core financial metrics.
    diligencePath: Request current board deck, audited financial statements, and partner concentration summary from management.
  - type: private-evidence-only
    severity: material
    topic: ownership
    missingEvidence: A current cap table showing post-2021 ownership, option pool, and any preference overhang.
    whyItMatters: The SPAC reference valuation is stale without current ownership, liquidation, and dilution context.
    diligencePath: Request latest cap table, financing documents, and any side-letter summaries from counsel.
  - type: missing-source
    severity: minor
    topic: locations
    missingEvidence: A current official operating-footprint page showing all offices and any site consolidations after 2024.
    whyItMatters: Location count is a visible scale marker but current public disclosures are fragmented across releases.
    diligencePath: Request corporate-factsheet or updated careers footprint page.
  - type: private-evidence-only
    severity: material
    topic: sam-definition
    missingEvidence: Management-level pipeline of target accounts, average collaboration size, and conversion assumptions.
    whyItMatters: >-
      Public TAM estimates cannot substitute for a real SAM or SOM without knowing who Valo is actively selling to and
      at what price.
    diligencePath: Request sales pipeline, account segmentation, and partnership funnel conversion metrics.
  - type: conflicting-data
    severity: minor
    topic: market-size
    missingEvidence: A harmonized methodology explaining why 2026 market estimates range from roughly USD 2.9B to USD 8.2B.
    whyItMatters: The spread is too large to use a single outside number as a valuation anchor.
    diligencePath: Reconcile vendor definitions by included spend, geography, and product scope before valuation modeling.
  - type: private-evidence-only
    severity: material
    topic: competitive-proof
    missingEvidence: Customer renewal, pipeline-conversion, and benchmark-performance data versus direct peers.
    whyItMatters: >-
      Competitive positioning is currently inferred from narratives and public partnerships more than from like-for-like
      operating metrics.
    diligencePath: Request win/loss analyses, partner renewal evidence, and program progression benchmarks from management.
  - type: missing-source
    severity: minor
    topic: pricing
    missingEvidence: More direct disclosures of commercial packaging across private peers.
    whyItMatters: Pricing comparison remains structurally limited because many private AI-biotech contracts are undisclosed.
    diligencePath: Use diligence calls and partner references to test real pricing and packaging differences.
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Current cash, burn, runway, and revenue-recognition schedules by major partner.
    whyItMatters: These are the core facts needed to distinguish strong strategic monetization from pending financing pressure.
    diligencePath: Request audited 2025 and latest-management-period financials with cash waterfall by partner deal.
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, contribution margin, and internal-program cost allocation data.
    whyItMatters: Valuation and durability depend on whether platform economics scale better than internal asset burn.
    diligencePath: Request management KPI pack with program-level cost buckets and margin bridge.
  - type: private-evidence-only
    severity: material
    topic: technical-benchmarks
    missingEvidence: Internal benchmark data on hit rates, cycle times, model accuracy, and program-conversion rates.
    whyItMatters: >-
      The public product story is credible, but moat strength depends on measurable technical performance versus
      alternatives.
    diligencePath: Request engineering and translational KPI dashboards plus case studies for partnered programs.
  - type: private-evidence-only
    severity: material
    topic: data-governance
    missingEvidence: Formal data-rights, privacy, security, and reproducibility documentation.
    whyItMatters: Data and compliance posture are central to the durability of a human-data discovery platform.
    diligencePath: Request data-governance policies, audit trails, and partner-rights summaries.
  - type: private-evidence-only
    severity: material
    topic: customer-metrics
    missingEvidence: Customer count, renewal status, backlog, ACV, and partner-concentration data.
    whyItMatters: Public proof shows real traction but cannot measure breadth, stickiness, or downside exposure precisely.
    diligencePath: Request commercial dashboard and partner-by-partner revenue/concentration summary.
  - type: private-evidence-only
    severity: material
    topic: go-to-market
    missingEvidence: Win rates, sales-cycle length, and expansion triggers by customer archetype.
    whyItMatters: These determine whether traction can compound beyond a few flagship accounts.
    diligencePath: Review pipeline reports, deal-stage definitions, and postmortems for lost opportunities.
  - type: enumeration-incomplete
    severity: minor
    topic: TU003 named customer proof coverage
    missingEvidence: A fuller set of direct customer references and contract-level proofs beyond the named public partnerships.
    whyItMatters: >-
      The named-customer proof table is intentionally partial because public disclosures are concentrated in a small
      number of relationships.
    diligencePath: Request customer reference list and proof-of-use materials for additional counterparties.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: runway-and-termination-rights
    missingEvidence: Current cash runway and full partner termination/exclusivity mechanics.
    whyItMatters: These facts determine how quickly partner or capital shocks could transmit into survival risk.
    diligencePath: Request latest cash forecast and key commercial contract summaries.
  - type: private-evidence-only
    severity: material
    topic: program-funnel
    missingEvidence: Full program-conversion history from discovery to partner or clinical outcomes.
    whyItMatters: Without this, execution risk can only be inferred from a small public sample.
    diligencePath: Review pipeline review materials, attrition stats, and internal postmortems.
  - type: enumeration-incomplete
    severity: minor
    topic: TR001 regulatory / legal risk register coverage
    missingEvidence: A complete, diligence-room view of material regulatory and legal risks beyond the public record.
    whyItMatters: >-
      The public regulatory and legal risk register is intentionally partial because private contract, compliance, and
      legal materials are not disclosed.
    diligencePath: Review legal, quality, and compliance memoranda with management and counsel.
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: current-price-discovery
    missingEvidence: Fresh priced equity round, secondary mark, or lender-style cash/runway package.
    whyItMatters: Without recent price discovery, valuation remains a scenario exercise rather than an investable mark.
    diligencePath: Request latest financing materials, board marks, and current investor-support view.
  - type: private-evidence-only
    severity: material
    topic: contract-and-cap-table
    missingEvidence: Partner-rights detail and current preference stack.
    whyItMatters: These govern both upside capture and downside impairment for new investors.
    diligencePath: Review contracts, charter, cap table, and side letters under NDA.
  - type: enumeration-incomplete
    severity: minor
    topic: TV004 comparable coverage
    missingEvidence: A fuller private-market comparable set with pricing transparency.
    whyItMatters: The comparable table is intentionally partial because many relevant peers lack clean price disclosure.
    diligencePath: Collect private financing and secondary references for the selected peer set.
    relatedTableRefs:
      - TV004
