  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sam-definition
    missingEvidence: Management-level pipeline of target accounts, average collaboration size, and conversion assumptions.
    whyItMatters: Public TAM estimates cannot substitute for a real SAM or SOM without knowing who Valo is actively selling to and at what price.
    diligencePath: Request sales pipeline, account segmentation, and partnership funnel conversion metrics.
  - type: conflicting-data
    severity: minor
    topic: market-size
    missingEvidence: A harmonized methodology explaining why 2026 market estimates range from roughly USD 2.9B to USD 8.2B.
    whyItMatters: The spread is too large to use a single outside number as a valuation anchor.
    diligencePath: Reconcile vendor definitions by included spend, geography, and product scope before valuation modeling.
