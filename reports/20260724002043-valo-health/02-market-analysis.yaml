- id: buyers
  title: Buyer segments, budget owners, and adoption path
  body: The market evidence points to large-pharma research organizations as the primary economic buyer for Valo-style offerings. That makes sense because the value proposition is not a generic productivity layer; it is a claim that better biological grounding and data-driven target selection can improve portfolio outcomes. Biotechs, CROs, and research networks still matter, but they typically engage through narrower collaborations, scoped services, or specific program support. The market also appears collaboration-led. Buyers want evidence that a platform can improve target quality, shorten cycle time, or reduce dead-end chemistry before they scale commitments. That is why named collaborations matter more than headline market size. It is also why buyer readiness depends on wet-lab compatibility, data governance, and decision rights, not just model quality. Valo’s own public commercial path fits this pattern almost perfectly.
  claimRefs:
  - CM012
  - CM013
  - CM014
  - CM015
  - CM025
  - CM026
  - CM032
