- id: drivers
  title: Growth drivers and why the category is expanding now
  body: 'Multiple current reports describe a market that is graduating from pilot enthusiasm into scaled strategic adoption. The core drivers are intuitive: drug discovery remains too slow, too expensive, and too failure-prone for large buyers to ignore tools that might improve the front end of R&D. At the same time, multi-omics data, longitudinal real-world datasets, and improved cloud infrastructure have raised the ceiling for what AI models can do in biology. Sector literature also highlights a more subtle driver that matters for Valo: economic structures are shifting from pure software licensing toward milestone-linked, output-oriented partnership models. That shift is favorable to companies that can credibly combine platform capability with translational science. It also explains why Valo’s biggest proof points come from Novo Nordisk and Merck KGaA, not from a classic usage-based software funnel.'
  claimRefs:
  - CM016
  - CM017
  - CM018
  - CM019
  - CM020
  - CM021
  - CM027
  - CM028
  - CM029
  tableRefs:
  - TM004
- id: constraints
  title: Adoption constraints and the real diligence questions
  body: 'The current enthusiasm around AI drug discovery does not eliminate the classic reasons buyers hesitate. Market reports repeatedly surface validation, explainability, reproducibility, and regulatory uncertainty as real constraints. Talent scarcity also matters because these platforms only create value when biology, chemistry, data engineering, and clinical judgment can operate together. For Valo specifically, the market opportunity is large enough to support upside but not clear enough to validate price on its own. The biggest contradiction is that market-size reports are broad while evidence of durable monetization remains concentrated in a small set of strategic deals across the sector. That means the diligence questions remain practical: can Valo keep winning large counterparties, can those collaborations convert into validated assets or milestones, and can the company scale without losing scientific credibility? Those questions matter far more than any single TAM number.'
  claimRefs:
  - CM022
  - CM023
  - CM024
