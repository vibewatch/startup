chapter:
  number: 3
  title: "Competitors"
  summary: "Agility's defensible near-term position is commercial readiness in a narrow material-handling workflow, not broad humanoid capability. Its 65,000-hour company claim and enterprise fleet layer separate Digit from less mature humanoid programs, but quote-only pricing, segregated operating areas, specialized automation substitutes, and unverified third-party economics limit confidence in moat durability."
sections:
  - id: "landscape-and-substitutes"
    title: "The competitive set extends beyond humanoids"
    body: |
      The direct humanoid set visible in the assigned evidence includes Tesla Optimus, Figure AI, Boston Dynamics Atlas, and Unitree alongside Agility Digit. These programs differ sharply in commercialization, financial backing, intended dexterity, and customer access, so a simple robot-to-robot feature ranking would obscure the buyer's actual choice. TechTimes describes Figure as much more highly valued than Agility, Boston Dynamics as allocating Atlas output to Hyundai, and Unitree as a lower-price entrant, while a March 2026 comparison says Tesla had not yet begun external Optimus sales. Those signals make entrant timing and capital resources important, but they are not independent performance benchmarks. [CP006] [CP007] [CP008] [CP009]

      The more immediate substitutes are fixed conveyors, autonomous mobile robots, mobile manipulators, and process redesign. Anton Robots argues that each can be superior when the job is stable horizontal movement or fixed-point manipulation; Agility's own FAQ also frames humanoids against fixed and flexible automation, AMRs, and AGVs. Internal build is therefore most credible as systems integration around proven automation rather than development of a proprietary humanoid. Digit earns consideration when walking and container transfer must bridge existing equipment in a brownfield facility, but it must beat these simpler options on accepted throughput and total deployment cost. [CP014] [CP016]
    claimRefs:
      - "CP006"
      - "CP007"
      - "CP008"
      - "CP009"
      - "CP014"
      - "CP016"
    tableRefs:
      - "TP001"
  - id: "capability-and-trust"
    title: "Commercial proof is real but workflow-bounded"
    body: |
      Agility's strongest comparative evidence is operational rather than speculative. The company says Digit and Arc have accumulated 65,000 hours of real production experience, and TechTimes repeats more than 65,000 hours at customer facilities. The independent buyer review is more qualified: the best-supported use case is repetitive tote and material transfer, the current public specification is a 35-pound carrying capacity with four hours of battery life, and a full-shift deployment requires charging, swapping, or fleet redundancy. This supports a readiness advantage for defined logistics workflows, not a claim that Digit can replace general labor. [CP001] [CP002] [CP003]

      Trust and safety remain a gating comparison. Anton Robots and TechTimes both state that current deployments use separated operating areas, while Digit v5 is designed to remove that constraint through cooperative-safety architecture. That distinction matters because a future design objective cannot be credited as a deployed capability. Tesla's broader dexterity thesis may create a larger task envelope, but the assigned comparison also says Optimus was not in material factory use in early 2026 and had not begun external sales by March. Buyers should therefore compare validated task success, intervention rates, and site approval for the exact hardware generation rather than demonstrations or roadmap breadth. [CP008] [CP009] [CP010] [CP011]
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP003"
      - "CP008"
      - "CP009"
      - "CP010"
      - "CP011"
    tableRefs:
      - "TP002"
    figureRefs:
      - "FP001"
  - id: "pricing-and-route-to-market"
    title: "Enterprise integration defines the sales motion"
    body: |
      Public pricing is not sufficiently transparent for a reliable head-to-head cost model. Anton Robots says Agility publishes neither a universal 2026 list price nor a monthly RaaS rate, although it describes RaaS and CapEx pathways. RoboZaps estimates Digit RaaS at $2,000-$4,000 per month, but labels the amount as an estimate; it is not disclosed contract pricing. A separate paywalled newsletter claims a 98% task-success rate and $10-$12 hourly operating cost after 18 months at Amazon's Sumner facility, yet the accessible page provides no visible methodology or denominator beyond that headline. These figures are diligence leads, not underwriting inputs. [CP004] [CP005] [CP015]

      The route to market is correspondingly consultative. Dataford's interview guide describes account executives securing pilots and full-scale deployments, partnering with solutions engineers on site assessments, negotiating contracts, and handing implementation to post-sales teams. That is consistent with a product whose value depends on workflow design, safety approval, integrations, and ongoing service rather than an off-the-shelf hardware sale. The motion can deepen customer relationships, but long deployments and custom qualification also give established automation vendors time to defend accounts and make sales efficiency sensitive to pilot conversion. [CP013]
    claimRefs:
      - "CP004"
      - "CP005"
      - "CP013"
      - "CP015"
    tableRefs:
      - "TP003"
  - id: "moat-durability"
    title: "The moat is deployment learning plus orchestration, not category ownership"
    body: |
      Arc may create switching friction because it runs fleets and connects workflows to warehouse and manufacturing systems, while physical deployments require process mapping, safety controls, and operational training. Those integrations can make replacement costly, but they also create vendor and cloud dependency; customers can multi-home by retaining AMRs, conveyors, and fixed cells for tasks where humanoid mobility is unnecessary. Agility's defensible wedge is thus a specific automation gap between existing systems, not exclusive ownership of a warehouse stack. [CP012] [CP014]

      Agility's careers page says the company created the category, but that is company positioning rather than independent moat evidence. The durability test is whether operational data and deployment practice improve reliability faster than rivals gain manufacturing scale, dexterity, or price advantage. Figure's reported valuation signals access to capital, Tesla's internal platform signals potential scale, and Unitree's lower-price positioning signals commoditization pressure. Meanwhile, Digit's v5 transition must prove cooperative safety without borrowing the prior generation's deployment record. The current lead is meaningful, but it remains vulnerable until buyers disclose repeatable economics, intervention rates, renewal behavior, and multi-site expansion. [CP007] [CP011] [CP016]
    claimRefs:
      - "CP007"
      - "CP011"
      - "CP012"
      - "CP014"
      - "CP016"
