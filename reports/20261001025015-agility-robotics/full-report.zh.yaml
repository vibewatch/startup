  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群体细分与典型部署范式
        blocks:
          - type: paragraph
            body: >-
              Agility Robotics 将商业化突破口集中在一个明确的作业阵地上：专为人工设计的物流与制造设施内的结构化物料搬运 [CU001,
              CU005]。公司并未在开放式操作任务中盲目追求通用灵巧度，而是瞄准企业用工缺口最严重、人员流动最频繁的重复性岗位，具体聚焦料箱（tote）与周转箱转运、输送线上料以及与自主移动机器人（AMR）接口装卸对接
              [CU002, CU005]。这一定位勾勒出了其核心买方画像：大型第三方物流服务商、大型汽车制造厂以及电商分销网络 [CU001,
              CU006]。此类企业大客户的商业决策人通常是供应链自动化、运营工程或厂区物流副总裁，他们评估 Digit 的首要考量是每小时综合运营成本与人工替代效率，而非理论层面的人形机器人灵活性 [CU003,
              CU006]。


              公司主要以机器人即服务（RaaS）订阅模式交付 Digit，将实体人形硬件、安全工位边界组件、Agility Arc 车队管理软件、日常维保及 OTA
              远程更新打包，计入客户的月度经营性支出（OpEx）[CU003, CU007]。尽管公司也携手 Ricoh USA 等商业合作伙伴支持硬件直接买断，但企业买方明显更倾向于 RaaS
              架构；因为该架构将硬件折旧与技术淘汰风险转移回 Agility，同时消除了前期大笔资本开支预算的门槛 [CU003, CU007]。依托结构化工位进行部署，Agility
              维系了“无需改造既有厂房”的核心商业价值主张，让企业客户无需大动干戈改造地面，即可在既有厂房中将 Digit 无缝嵌入输送线与移动设备之间 [CU002, CU005]。
