      - number: '1.3'
        title: 资本结构与公开市场过渡
        blocks:
          - type: paragraph
            body: >-
              2026 年 6 月 24 日，Agility 与 Churchill Capital Corp XI 宣布达成最终业务合并协议，拟以股票代码 AGLT 挂牌上市。公告设定了 $2.5 billion
              的投资前股权价值（pre-money equity value），预计交易募资总额超过 $620 million，其中包括约 $200 million 的 PIPE
              融资。上述数值仅代表交易条款与预期募资总额，并非 Agility 当前可动用的现金。后续有独立报道称，公司在 2026 年 7 月完成了一笔 $100 million 的 SAFE
              融资。现有评阅来源未提供直接审阅过的 S-4 注册文件、完整股权结构表、债务到期表、老股转让历史、赎回敏感性测算或净募资额变动调节表；本章尚无法厘清股权稀释程度与合并完成后的流动性状况。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO014
          - type: table
