chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与运营模式
        blocks:
          - type: paragraph
            body: >-
              Jonathan Hurst、Damion Shelton 与 Mikhail Jones 于 2015 年走出 Oregon State University 的 Dynamic Robotics
              Laboratory 创立 Agility Robotics，现总部位于 Salem, Oregon。公司主打软硬件一体化自动化方案：由 Digit 执行实体作业，Arc
              负责调度与管理机器人车队。商业化重心聚焦结构化的制造、分销与物流环境，短期内不涉足消费级人形机器人。公司披露在 9 处客户场地累计运行超过 65,000
              小时，但这仅代表部署网点数量，并非公开披露的付费客户数或机器人投放台数。商业模式结合了机器人即服务（RaaS）与硬件直售，全生命周期服务成本与硬件利用率因此成为决定单机经济模型的关键。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
