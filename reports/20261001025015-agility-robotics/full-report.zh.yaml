  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、作业流与替代动态
        blocks:
          - type: paragraph
            body: >-
              Agility Robotics 将初期目标市场界定为人工仓储环境下的物料搬运与料箱（tote）重复转运，而非消费级人形机器人。2021
              年，公司完成战略转型，由科研级步态研究转向商用工业设施，直击长期高用工流动率带来的运营瓶颈。Digit
              可在不大幅改造厂房结构的前提下与人工协同作业，定位为重资本固定输送机及专用自动化立体仓库（AS/RS）的灵活替代方案。不过，短期落地功能仍严格局限于结构化料箱搬运与产线边上下料机动协作（machine
              tending），精细操作与高速分拣仍超出当前作业范围。
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM009
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM014
      - number: '2.2'
        title: 多维市场空间测算与积压订单分析
        blocks:
          - type: paragraph
            body: >-
              测算人形机器人市场空间，必须将长期的理论性人工替代预测与近期的可触达物流支出区分开来。行业广泛预测估计全球人形机器人市场规模将从 2025 年的 $3 billion 增至 2035 年的近 $38
              billion，但当前实际商业化体量在整个工业自动化支出中占比极低。Agility 披露已锁定面向 1,000 台下一代 Digit v5 机器人的超 $300 million
              多年期承诺订单，但交易文件明确说明，该积压订单绑定单一未具名客户且附带里程碑前提，并不代表当前已确认的当期收入。行业观察人士指出，早期机器人采购合同通常赋予客户单方面取消权；在缺乏已验证交付里程碑的前提下，市场估值无法直接按全部积压订单价值线性外推。
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM011
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM008
              - CM011
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM007
              - CM008
              - CM013
              - CM015
      - number: '2.3'
        title: 买方画像、商业模式与单机经济模型
        blocks:
          - type: paragraph
            body: >-
              人形机器人的企业采购方主要集中在第三方物流服务商、大型汽车制造厂商以及面临结构性招工难的电商履约中心。Agility 主要以每小时 $30 的机器人即服务（RaaS）模式推广
              Digit，订阅费直接对标含福利的仓储综合人工作业成本，力求客户在两年内收回成本。在此架构下，Agility 在前期将机器人制造成本资本化，随后收取打包硬件、Agility Arc
              车队软件与维保支持的经常性服务收入。尽管管理层预计每小时运营成本将从 $10 到 $12 降至规模化后的每小时 $2 到 $3，但公开交易文件承认，RaaS
              模式的长期盈利能力尚未得到验证，且高度取决于零部件耐用度与客户续约率。
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM010
              - CM013
      - number: '2.4'
        title: 增长驱动力、安全认证与部署制约因素
        blocks:
          - type: paragraph
            body: >-
              北美地区超过 100 万个实体物料搬运岗位空缺，叠加企业端持续走高的用工成本，构成了人形仓储物流自动化的核心采纳驱动力。尽管如此，落地推广速度仍受制于显著的商业与监管壁垒。早期的 Digit
              部署受限于物理围栏工位内部，导致可适用的工作流仅限于愿意为安全隔离边界调整布局的仓储场地。Agility 要实现更大规模的市场扩张，取决于 Digit v5 能否取得符合 IEC 61508 SIL 3 与
              ISO 13849 标准的第三方协同安全认证，从而实现脱离物理围栏与人类员工并肩作业。在独立安全机构出具最终认证前，包括 Amazon
              在内的大型试点合作伙伴均暂缓大规模投运，这使得短期内的市场渗透率受制于严苛的合规审批，而非软件功能的更新迭代。
            claimRefs:
              - CM006
              - CM007
              - CM009
              - CM013
              - CM014
      - number: '2.5'
        title: 图表展示
        blocks:
          - type: callout
            title: 无围栏协同安全：商业化落地的核心门槛
            body: >-
              从受限围栏工位试点走向跨厂区车队部署，完全取决于能否取得 IEC 61508 SIL 3
              标准下的第三方协同安全认证。若无法取得无围栏认证，人形机器人就只能被圈禁在特定隔离区内，丧失无需改造厂房即可直接复用人类工作空间的核心价值主张。
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
          - type: callout
            title: 积压订单持续性与已确认收入的差异
            body: >-
              Agility 规模达 $300 million 的 Digit v5 订单反映了多年期 RaaS
              合作意向，但仍受制于合同交付里程碑及客户取消权条款。鉴于单机经济模型未经验证且持续烧钱，投资者必须将处于开发阶段机器人的合同积压金额与 GAAP 准则下已确认的实际收入严格区分开来。
            calloutType: risk
            claimRefs:
              - CM002
              - CM008
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争范畴不止于人形机器人
        blocks:
          - type: paragraph
            body: >
              现有评阅材料中呈现的直接人形机器人竞对包括 Tesla Optimus、Figure AI、Boston Dynamics Atlas 以及 Unitree，与 Agility Digit
              同台竞争。各家方案在商业化进程、资金储备、设计操作灵巧度以及客户获取渠道上差异巨大，机械罗列各款机器人的功能参数只会掩盖买方的真实决策考量。TechTimes 报道指出，Figure 估值远高于
              Agility；Boston Dynamics 将 Atlas 产能定向供应给 Hyundai；Unitree 主打低价切入；而 2026 年 3 月的一份对比指出 Tesla 尚未开启 Optimus
              的对外销售。上述动向凸显了入局时机与资本实力的重要性，但并非独立的性能基准。[CP006] [CP007] [CP008] [CP009]


              更为现实的替代方案是固定式输送机、自主移动机器人（AMR）、移动操作机以及产线流程再造。Anton Robots 认为，在平稳水平搬运或定点操作任务中，上述方案均具备更优表现；Agility 自身 FAQ
              也将人形机器人与固定/柔性自动化设备、AMR 及 AGV
              进行过对比。因此，企业自建自动化最可行的路径围绕成熟设备做系统集成，而非自研专用人形机器人。只有当既有厂房需要靠步态移动与料箱搬运串联既有设备时，Digit
              才具备入局考量价值；但面对更简单的自动化方案，它必须在被采纳的吞吐量与整体部署成本上证明自身优势。[CP014] [CP016]
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP014
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP009
              - CP014
      - number: '3.2'
        title: 商业化验证真实存在，但局限于特定作业流
        blocks:
          - type: paragraph
            body: >
              Agility 最有力的相对优势来自实际运行数据，而非纸面推测。公司称 Digit 与 Arc 已累计取得 65,000 小时的真实生产经验，TechTimes 也援引了在客户现场超过 65,000
              小时的运营数据。独立的买方评测则给出了更多限定条件：目前支撑最充分的用例仅为重复性的料箱及物料转运；公开规格显示负载能力为 35 磅（约 15.9 kg）、续航 4
              小时；若要支持整班次连续作业，必须依赖充电、换电或增加车队冗余备机。这仅能印证其在特定物流作业流上的就绪度优势，并不等于说 Digit 具备替代通用人工的能力。[CP001] [CP002] [CP003]


              安全与信任度仍是决定采购与否的核心门槛。Anton Robots 与 TechTimes 均指出，当前部署均采用物理隔离作业区；Digit v5
              则旨在借助协同安全架构打破这一限制。这一差异至关重要，因为未来的设计目标绝不能提前视同已落地的实际能力。Tesla 主打的泛化操作灵活性或许能涵盖更多任务范畴，但现有对比材料同样指出，Optimus 在 2026
              年初尚未在工厂中实质性使用，截至 3 月也仍未开启外部销售。因此，买方应紧扣具体硬件代次，对比经核实的任务成功率、人工干预率以及现场准入许可，而非紧盯演示视频或过于宏大的技术路线图。[CP008] [CP009]
              [CP010] [CP011]
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
