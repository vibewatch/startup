            - label: RaaS 资本密集型开销负担
            - label: 关联方收入依赖 (63.5%)
            - label: 单一客户积压订单集中度 ($300M)
        - label: 可能发生 / 中期 (1-2 yrs)
          values:
            - null
            - label: Arc 云端调度中断
            - label: 资金雄厚竞品替代威胁
            - label: 协作安全认证延期
        - label: 不太可能 / 低概率 (> 2 yrs)
          values:
            - label: 次要传感器元件短缺
            - label: 区域工会阻力
            - label: RoboFab 组装产线故障
