      - number: '5.4'
        title: 车队编排、工业网络与企业级系统集成
        blocks:
          - type: paragraph
            body: >-
              多机器人厂区作业由集约化云端平台 Agility Arc 统一编排，负责车队调度、运行状态监测与工作流协同。Arc 直接与客户的仓储管理系统（WMS）、仓储执行系统（WES）及制造执行系统（MES）对接，协调
              Digit 与既有自主移动机器人（AMR）或传送带之间的任务交接。针对金属货架林立、动态信号遮挡严重的射频密集型仓储环境，Digit 集成了 Doodle Labs RM-1700 Mesh Rider
              双频无线电模块以保障通信稳定性。该模块利用 900 MHz 频段实现非视距穿透，利用 2.4 GHz 频段传输高带宽遥测数据，将指令延迟控制在 10 毫秒以内。安全控制方面，所有云端传输均采用基于私有 CA
              证书的双向 TLS（mTLS）与 TLS 1.2+ 加密，辅以客户数据隔离机制，并在机载静态存储上实施 AES 硬件级加密。
            claimRefs:
              - CE013
              - CE014
