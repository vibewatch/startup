      - number: '6.2'
        title: 知名客户落地案例与实操运行记录
        blocks:
          - type: paragraph
            body: >-
              Agility 经公开验证的商业差异化优势，建立在标杆工业大客户生产线上的真实落地部署之上 [CU001, CU008]。在 GXO Logistics 位于佐治亚州 Flowery Branch（服务于
              Spanx）的设施中，Digit 自 2024 年 6 月部署以来跨多班次持续运转，负责为自主移动机器人卸货并给产线输送机上料，累计完成超过 100,000 次商业料箱搬运循环 [CU001,
              CU002]。这是企业级物流史上记录时间最长的双足人形机器人商业化运营案例，为真实仓储环境下的实际耐用性提供了关键验证 [CU001, CU004]。在分布于 9 处作业设施的全部客户中，Agility
              累计记录了超过 65,000 小时的实际运行时间 [CU004, CU008]。


              在汽车制造领域，Toyota Motor Manufacturing Canada（TMMC）在其安大略省 Woodstock 装配厂开展了为期一年的深入试点，分三个测试阶段对 3 台 Digit 进行了评估
              [CU006, CU008]。在验证了面向 RAV4 组装的生产零部件补给与牵引车装料作业后，TMMC 于 2026 年 2 月签署正式商业 RaaS 协议，将部署规模扩大至 7 到 10 台 Digit 机器人
              [CU006, CU008]。同样，拉美电商巨头 Mercado Libre 于 2025 年 12 月签署商业合同，在德克萨斯州 San Antonio 的设施中部署 Digit 负责履约作业
              [CU009]。战略投资方 Amazon 虽在其华盛顿州 Sumner 创新基地完成了初期物流试点，但后续的规模化商业推进仍取决于下一代安全里程碑的达成，目前尚未进入积极扩充车队阶段 [CU010]。
