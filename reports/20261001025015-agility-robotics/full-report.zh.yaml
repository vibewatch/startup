      - number: '3.3'
        title: 企业级集成决定销售模式
        blocks:
          - type: paragraph
            body: >
              公开定价缺乏足够透明度，难以支撑可靠的横向成本对标测算。Anton Robots 指出，虽然 Agility 列出了 RaaS 和 CapEx 两条采购路径，但并未公开 2026 年的通用官方指导价，也未公布
              RaaS 月费率。RoboZaps 估算 Digit 的 RaaS 费用约为每月 $2,000–$4,000，但明确标注该金额为估算值，并非披露的实际合同定价。另一份付费行业通讯声称，在 Amazon 的
              Sumner 设施运行 18 个月后，任务成功率达 98%，每小时综合运营成本为
              $10–$12；然而，可公开访问的页面除该标题外，未提供任何计算方法或分母口径。上述数据属于尽调线索，不可作为投资测算的底稿输入。[CP004] [CP005] [CP015]


              相应地，公司的商业化推广高度依赖顾问式销售。Dataford
              的面试指引显示，客户经理负责敲定试点及全面部署，联合方案工程师做现场评估、商务谈判，并将交付落地移交给售后团队。这与该产品的价值属性高度吻合：其商业价值取决于工作流重构、安全准入认证、系统集成与持续运维服务，绝非标准化硬件销售。这一模式能加深客户粘性，但漫长的部署周期与定制准入测试，也给传统自动化巨头留出了防守既有客户的时间，并使销售效率高度受制于试点转化率。[CP013]
            claimRefs:
              - CP004
              - CP005
              - CP013
              - CP015
