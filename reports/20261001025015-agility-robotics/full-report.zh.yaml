  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与产品定价
        blocks:
          - type: paragraph
            body: >-
              Agility 围绕 Digit 提供机器人即服务（RaaS）与直接采购两种模式。报道披露的 RaaS 收费方案约为每月 $8,500，另收取 $25,000
              部署费，涵盖机器人硬件、软件授权与维保服务；管理层按五年期推算，单台机器人可贡献 $535,000 收入。直接采购方案约为首期付款 $200,000，加收 $20,000 部署费，随后每年支付约 $36,000
              的软硬件维保费，五年总支出约 $400,000。上述口径仅为公布的收费标准，并不构成实际平均售价（ASP）、已确认收入结构、客户续约率或毛利率的客观证据。Arc 虽提供了经常性软件与车队管理能力，但公开资料并未将
              Arc 软件收入与硬件或服务收入拆分开来。
