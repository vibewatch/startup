      - number: '3.4'
        title: 护城河在于现场经验积累与协同调度，而非品类垄断
        blocks:
          - type: paragraph
            body: >
              Arc
              负责车队管理并将工作流接入仓储和制造系统，加之现场部署需要流程梳理、安全管控与实操培训，这可能构建起一定的切换阻力。此类深度集成让替换成本高昂，但也导致客户对特定厂商及云端产生依赖；对于无需人形移动能力的环节，客户完全可以继续沿用
              AMR、输送线和固定工位，采取混合采购策略。因此，Agility 真正立得住的业务切入点，是既有系统之间的特定自动化空白，而非全套仓储技术栈的独家垄断。[CP012] [CP014]


              Agility
              招聘页面称公司开创了该品类，但这仅是企业的市场定位宣称，并非独立的护城河证据。衡量其护城河持续性的关键，在于其实际运行数据与工程落地经验提升可靠性的速度，能否跑赢竞对在制造规模、操作灵活性或价格优势上的追赶步伐。Figure
              的报道估值反映出充沛的资本实力，Tesla 内部平台预示着潜在的规模效应，Unitree 的低价定位则带来了产品同质化降价压力。与此同时，Digit v5
              的迭代必须自行证实其协同安全性，无法直接套用上一代产品的实际部署记录。目前的领先优势固然可观，但在买方公开披露可复制的经济模型、人工干预率、续约表现及跨厂区规模化复制数据前，该优势依然脆弱。[CP007]
              [CP011] [CP016]
            claimRefs:
              - CP007
              - CP011
              - CP012
              - CP014
              - CP016
