            - label: SPAC 合并股东赎回
        - label: 极低概率 / 尾部风险
          values:
            - label: 知识产权侵权诉讼
            - null
            - label: OSHA 工伤调查
            - label: 灾难性人机协作安全事故
    approximationNotes: 风险定位基于对 2025 年经审计财报、SEC S-4/A 披露文件以及已发布安全标准的定性分析。
