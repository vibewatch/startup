              - CO009
              - CO010
              - CO011
      - number: '1.2'
        title: 领导团队、创始人与公司治理
        blocks:
          - type: paragraph
            body: >-
              Peggy Johnson 担任首席执行官执掌公司，联合创始人 Jonathan Hurst 担任首席机器人官。这一架构将职业化商业领导力与创始人级技术连贯性结合在一起，但也意味着留住 Hurst
              及其他专业机器人领军人才构成了关键依赖。已披露的高管团队覆盖业务、财务与运营、技术、硬件、法务及人力职能；招聘页面显示的员工结构则横跨工程、AI
              研究与制造领域。不过，现有评阅材料未提供完整的现任董事会名单、投票权控制权分析、股权明细表或管理层变动历史；治理质量与关键人物保障机制仍属待尽调事项，尚无法作为已获验证的优势。
            claimRefs:
