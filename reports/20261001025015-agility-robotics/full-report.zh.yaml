              核心投资逻辑立足于 Agility 的商业化部署先发优势，大幅领先风投背景与产业背景竞对。Figure AI 等同行虽拿下 $39 billion 的高额一级市场估值，却缺乏规模化工业部署；Digit 则已进驻
