          - type: callout
            title: 积压订单集中与关联方交易对手风险
            body: >-
              Agility 未来商业规划中超过 80% 的体量依赖单一未具名客户 1,000 台 Digit v5 机器人的合同，而经审计的 2025 年收入中亦有 63.5% 来自关联方交易。这种双重集中度使得
              Agility 在面对合作伙伴资本开支转向或里程碑交付延期时极其脆弱。
            calloutType: risk
