      - number: '7.3'
        title: 运营可扩展性、RoboFab 产能爬坡与部署可靠性
        blocks:
          - type: paragraph
            body: >-
              从低产能原型试制跨越至规模化批量生产，令其位于 Salem, Oregon 的 RoboFab 工厂面临巨大的执行风险。尽管该工厂宣称具备年产 10,000 台人形机器人的理论设计产能，但 Agility
              从未在商业化规模下真正运转过这一设施。人形机器人的量产涉及定制执行器、高扭矩关节电机、专用谐波减速机及一体化传感器舱等多环节复杂的供应链协同。产能爬坡既要求维持较高的初次装配良品率，又必须将物料清单（BOM）成本从最初投产时的每台约
              $150,000，降至 1,000 台规模时的 $75,000，并在大规模放量时压降至 $30,000 目标线。此外，机器人即服务（RaaS）的商业模式放大了制造端风险：Agility
              必须在前期全额垫付硬件制造成本，并依靠长达 3 到 5 年的客户合同分期收回资金。2026 年 9 月，Agility 宣布 Digit v5 的早期客户交付将推迟至 2027 年上半年，全面公开发售目标定在
              2027 年底，凸显了交付时间线上的巨大压力。至关重要的一点在于，平均无故障时间（MTBF）、零部件磨损率、现场驻派工程师干预工时等实际现场可靠性指标目前未见公开披露，导致长期的维保利润率未获验证。
            claimRefs:
              - CR010
              - CR012
              - CR013
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR010
              - CR013
              - CR015
      - number: '7.4'
        title: 客户集中度、关联方敞口与资本消耗
        blocks:
          - type: paragraph
            body: >-
              Agility 的收入走势暴露出了极高的交易对手方与客户集中度，极大动摇了未来财务预测的稳固性。2025 年经审计的财务报表显示，营业收入约为 $1.8 million，毛利率为
              -151%。值得注意的是，关联方商业伙伴占到了 2025 年总销售额的 63.5%，表明在遵循公平交易原则的独立第三方企业客户中，商业化采纳仍处于起步阶段。此外，被广泛引述的 $300 million
              多年期积压订单高度单一：主要绑定单一未具名客户为期三年、采购 1,000 台 Digit v5 的合同，且严格以达成各项技术与部署里程碑为前提。2026 年 5 月，Agility
              签署了一份关联方协议：若对方至少部署 1,000 台机器人，每台将获配 453 份认股权证；这带来了巨大的股权稀释风险与会计不确定性。与此同时，Agility 正面临来自资本实力更雄厚对手的白热化竞争，尤其是
              Figure AI（估值达 $39 billion）与 Tesla Optimus，二者在资金储备、制造基础设施及自建 AI
              算力集群上均占据压倒性优势。若不能将付费客户群从初期的试点伙伴进一步拓展，并按期完成里程碑交付，Agility 将面临利润率大幅受挤压与收入停滞的严峻风险。
