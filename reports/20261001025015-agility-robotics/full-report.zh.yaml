      - number: '4.2'
        title: 业务进展与收入质量
        blocks:
          - type: paragraph
            body: >-
              媒体报道的商业化热度远超公司实际确认的收入。Agility 在 2025 年仅实现 $1.8 million 净销售额；而多方报道指出，公司从单一未具名客户处获得了为期三年、涉及 1,000
              台机器人的订单，多年期 Digit v5 订单总额超过 $300 million。监管文件中的风险提示至关重要：该订单金额绝非当期收入，且高度挂钩里程碑考核、最终定价、交付节奏与开机利用率。在 9
              处客户场地累计超过 65,000
              小时的运行数据，固然是展示现场落地与市场拓展（GTM）的有效论据，但无法据此证实账单开具额、客户留存率、客户集中度、销售周期长度、获客成本（CAC）或回本周期。因此，在投资测算中，应将该订单规模视作附带前提的需求意向，而非
              ARR 或已确认的积压收入。
            claimRefs:
              - CI005
              - CI009
              - CI010
      - number: '4.3'
        title: 成本结构与单机经济模型
        blocks:
          - type: paragraph
            body: >-
              2025 年的成本基数依然大幅超出商业化营收规模：Agility 录得 $140 million 营业亏损；营业支出约 $111 million（2024 年为 $71 million）；现金消耗约 $100
              million。上述指标不可直接等同：会计亏损并不等同于现金消耗金额。此外，RaaS 模式要求 Agility
              自持机器人资产并收取服务费，因此前期制造资本开支、资产折旧、日常维保、现场技术支持以及营运资金垫付节奏，成为决定利润率的核心要素。公开渠道仅能证实收费标准，但并未披露物料清单（BOM）、单台制造成本、质保计提、单开机小时服务成本、资产利用率、使用寿命、实际已实现毛利率或车队级贡献利润率。此类关键数据的缺失，导致外界无法得出有充分依据的获客成本（CAC）/
              回本周期或单机经济模型结论。
