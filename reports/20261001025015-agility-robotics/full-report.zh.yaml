      - number: '7.5'
        title: 图表展示
        blocks:
          - type: callout
            title: 无围栏安全认证是商业落地的核心门槛
            body: >-
              若无法取得符合 IEC 61508 SIL 3 及 ISO 13849 标准的独立第三方功能安全认证，Agility Robotics 就无法将早期的市场接洽转化为高密度的仓储规模化落地。在 NVIDIA
              Halos 测试实验室开展的预评估仅提供了工程层面的验证，并不具备在受 OSHA 监管的设施中与人类无围栏并肩作业的法定监管许可。
            calloutType: risk
            claimRefs:
              - CR007
