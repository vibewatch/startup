      - number: '4.4'
        title: 资本充足度与财务综合研判
        blocks:
          - type: paragraph
            body: >-
              与 Churchill Capital Corp. XI 的合并预计将带来超过 $620 million 的募资总额，其中包括约 $420 million 的 SPAC 信托账户资金，以及约 $200
              million 由 Foxconn 领投的 PIPE 融资。募资总额绝非到账可用现金：信托资金基于零赎回假设；交易仍受制于交割条件；且交易中介费用、未来资本开支以及烧钱速度变化在此均未量化。EquityZen
              统计的 $641 million 累计融资总额同样不能视作当前手头现金余额。按 $2.5 billion 的交易估值计算，独立报道测算出其对应 2025 年净销售额的市销率倍数高达约
              1,400。因此财务综合研判为高度依赖外部资本且当前收入质量偏低：该模式固然具备创造经常性收入的潜力，但在缺乏现金、合同、成本与利用率真实数据的情况下，无法对其利润率持续性及现金跑道做出确切的投资判断。
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
