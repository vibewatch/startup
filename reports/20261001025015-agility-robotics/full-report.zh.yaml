            title: 分步参与公开市场的投资纪律
            body: >-
              投资者参与本次 $2.5 billion SPAC 交易时，需保持克制的入场节奏。虽然 Agility 在工业人形机器人赛道手握无可匹敌的 65,000 小时商业部署领跑优势，但高达 $111 million
              的经营亏损叠加尚未坐实的收入基础，预示上市初期难免出现 de-SPAC 交易典型的大幅波动。采取分步建仓，或在老股市场以低于标称估值的折扣拿份额，能有效缓冲近期稀释与烧钱压力。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV013
          - type: callout
            title: 积压订单集中度与里程碑交付风险
            body: >-
              标称 $300 million 的已签约在手订单带来了强大的叙事动力，却掩盖了极高的集中度风险。该订单全数来自单一未披露交易对手，约定在三年内采购 1,000 台 Digit
              v5。一旦出现硬件可靠性延误，或未能达到人机协作安全标准，都可能触发里程碑违约与订单取消，从而瓦解整体估值逻辑。
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
