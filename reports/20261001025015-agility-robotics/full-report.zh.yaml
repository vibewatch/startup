              Agility Robotics 凭借在真实仓储及制造设施中累计超过 65,000 小时的实际运行数据，成为新兴人形机器人赛道中最具标杆意义的商业化实证案例。公司于 2026 年 6
              月宣布与特殊目的收购公司（SPAC）Churchill Capital Corp XI 达成最终合并协议，对应企业股权估值为 $2.5 billion。尽管该交易预计将带来超过 $620 million
