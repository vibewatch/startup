      - number: '5.2'
        title: 协同安全架构、传感器监控与监管标准
        blocks:
          - type: paragraph
            body: >-
              历史上，人形机器人的工业化落地长期受限于物理围栏与安全联锁装置的要求，此类设施打破了现有的作业流布局。Digit 5
              采用协同安全架构突破了上述瓶颈，旨在拆除防护围栏，实现与人类员工并肩直接协作。该平台利用自研感知算法，融合摄像头、深度传感器与惯性测量单元（IMU）持续追踪人体距离；一旦突破安全间距，能自主在避让、减速或受控屈膝静止姿态之间切换。Agility
              作为 NVIDIA Halos for Robotics 安全框架的首发合作伙伴，将 NVIDIA IGX Thor 硬件与 Halos Core 功能安全底座相结合，提供经认证的实时监控能力。此前，Digit
              已在某客户生产线上通过了由 OSHA 监管的独立安全标准评估。此外，Agility 还积极牵头起草面向动态稳定移动机器人的 ANSI/A3 TR R15.108 标准，并参与制定 ISO 25785-1
              国际人形机器人安全标准。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
