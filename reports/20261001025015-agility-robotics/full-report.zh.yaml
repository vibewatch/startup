      - number: '5.3'
        title: 具身智能、基础模型与多物理场仿真基础设施
        blocks:
          - type: paragraph
            body: >-
              Agility 采用“仿真先行”的具身智能（Physical AI）训练管线开发软件运动控制中枢。团队在 NVIDIA Isaac Sim 中借助 OpenUSD 构建 Digit
              机械底盘的数字孪生模型，融入精确的关节几何形状、质量分布、接触动力学及客户 BIM 厂房模型。强化学习策略在 Isaac Lab
              中经历数十亿次仿真步数训练，让全身控制器经受不同地面摩擦力、通道构型、光照变化及物理扰动的考验，全面掌握步态恢复与动态平衡能力。为防止仿真环境过拟合并捕捉接触力学的极端边界情况，Agility
              在真机部署前，会利用容器化的 MuJoCo 管线交叉验证候选控制策略。高吞吐量的训练任务运行在 AWS 云基础设施之上，借助 EC2 G6 GPU 实例、用于作业调度与多租户隔离的 Amazon Elastic
              Kubernetes Service（EKS），以及存储 PB 级仿真日志的 Amazon S3。这套基础设施让 Digit
              能够在数小时内通过虚拟仿真快速适配全新任务与场地布局，免去了现场反复人工真机示教编程的繁琐流程。
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
