  - id: FI001
    title: 客户业务活动至毛利过桥图
    type: flow
    summary: 概念过桥框架把合同约定活动、账单开具、已确认收入与仍未公开的成本分离开来，而非直接将订单视作收入。
    data:
      nodes:
        - label: 客户部署
          detail: Digit 在客户设施中运转；据报道在 9 处站点累计运行超过 65,000 小时。
        - label: 合同路径
          detail: 客户按公开的商业价格表选择 RaaS 模式或直接购买硬件所有权。
        - label: 可开票对价
          detail: 月度使用费或前期硬件费用，与部署、软件及维保费用相匹配。
        - label: 收入确认
          detail: 仅已确认净销售额计入已报收入；附带条件的订单不属于当期收入。
        - label: 直接成本与资产成本
          detail: 必须扣除制造、折旧、维保、现场技术支持、质保以及部署成本。
        - label: 毛利贡献
          detail: 因缺失收入结构与直接成本披露，已实现毛利贡献仍无法获知。
    approximationNotes: 仅为概念流程；并不测算收入确认、成本、毛利率、转化率或时间节点。
    claimRefs:
      - CI001
      - CI003
      - CI005
      - CI009
      - CI010
      - CI015
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 六层技术架构涵盖物理执行机构、边缘安全计算、具身物理 AI 基础模型、工业无线网状通信、车队编排与云端仿真。
    data:
      layers:
        - label: 云端仿真与训练基础设施
          detail: AWS EC2 G6 GPU 实例、Amazon EKS 与 S3，集成 NVIDIA Omniverse 与 Isaac Sim 用于大规模合成数据生成。
          tone: neutral
        - label: 车队编排与企业系统集成
          detail: Agility Arc 云平台提供车队遥测、mTLS 加密通信，以及面向仓库 WMS/WES/MES 的 REST/API 桥接。
          tone: positive
        - label: 工业无线网状网通信
          detail: Doodle Labs RM-1700 双频无线电（900 MHz NLOS 与 2.4 GHz 高吞吐量）提供低延迟（<10ms）遥测与控制。
          tone: neutral
        - label: 物理 AI 与全身运动控制技术栈
          detail: 在 Isaac Lab 与容器化 MuJoCo 中开发的强化学习基础模型，用于平衡、踏步恢复与物体操作。
          tone: positive
        - label: 独立安全控制器与感知系统
          detail: 运行 Halos Core 安全算法的 NVIDIA IGX Thor 边缘计算设备、深度传感器、IMU 以及经过认证的停机与就座行为控制。
          tone: positive
        - label: 双足底盘与机电硬件
          detail: 支持 50 lb 负载的定制摆线腿部执行器、可更换 ISO 末端执行器以及 90 分钟快充电池。
          tone: neutral
    approximationNotes: 技术架构综合自 Agility Robotics 官方披露、NVIDIA 案例研究、AWS 架构简介以及 Doodle Labs 技术集成数据。
    claimRefs:
      - CE001
      - CE004
      - CE006
      - CE009
      - CE011
      - CE013
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 企业落地演进路径：从结构化工作站试点起步，推进至单场地多机扩容，最终迈向无物理隔离的机群集成。
    data:
      items:
        - label: 评估
          title: Discovery & Workflow Mapping
          phase: 阶段 1：评估
          touchpoints:
            - 评估既有厂房物料搬运瓶颈
            - 圈定受限周转箱 / 料箱搬运工作流
          details: Agility 评估场地节拍、输送带高度以及 AMR 兼容性，界定既有厂房部署范围。
          tone: neutral
        - label: 集成
          title: Hardware Integration & Workcell Setup
          phase: 阶段 2：集成
          touchpoints:
            - 划定物理作业边界并安装安全围栏
            - 对接 Agility Arc 软件与场地 WMS 及 WES
          details: 工作站搭建规范取放料点位，无需改动既有厂房即可打通输送带交接链路。
          tone: neutral
        - label: 验证
          title: Segregated Workcell Pilot
          phase: 阶段 3：验证
          touchpoints:
            - 在隔离安全单元内部署 1-3 台 Digit
            - 持续测试自主回充与循环作业可靠性
          details: 展开为期 6-12 个月严格评估，考核取放料稼动率、自主回充与故障恢复能力。
          tone: positive
        - label: 初步规模化
          title: Intra-Site Commercial RaaS
          phase: 阶段 4：初步规模化
          touchpoints:
            - 转为多年期 RaaS 订阅（单机基准 $250k）
            - 在首个场地内扩充至 7-10 台机器人
          details: 由 GXO 与 Toyota Canada 落地达成，建立起可复现的多班次作业吞吐能力。
          tone: positive
        - label: 免隔离作业
          title: Cooperative Safety Transition
          phase: 阶段 5：协作安全
          touchpoints:
            - 依据 OSHA 认可的 NRTL 标准接受现场检验
            - 过渡至无围栏 Digit v5 作业区
          details: 拆除物理防护围栏，支持 Digit 进入人机共用通道与暂存区协同作业。
          tone: warning
        - label: 机群铺开
          title: Network Fleet Expansion
          phase: 阶段 6：跨场地拓展
          touchpoints:
            - 在各区域配送中心签署并执行跨场地合同
            - 依托 Agility Arc 统一集中调度机群
          details: 有赖于 ISO 25785 与 OSHA 协作安全认证获批以撤除安全围栏，进而解锁全部 $300M+ 积压订单。
          tone: warning
    approximationNotes: 落地阶段参考 Toyota Canada 与 GXO Logistics 公开客户推进路径建模。
    claimRefs:
      - CU001
      - CU003
      - CU006
      - CU007
      - CU011
      - CU012
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 二维矩阵：依发生概率与影响严重程度，梳理 Agility Robotics 面临的运营、监管、财务及合作伙伴风险。
