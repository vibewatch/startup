              2.0x 高级清算优先权倍数，在承压情景下拥有凌驾于普通股之上的下行优先受偿权。老股交易平台上，每股 $71.00 的报价推导出 $2.28 billion 股权价值；私募买方紧贴并购价格对标，同时打入了
              SPAC 交割执行风险的折扣。
