  - id: FV001
    title: 投资建议逻辑
    type: flow
    summary: 逻辑推演路径：贯通运营验证点、资金储备、风险因素与估值约束，最终导出投资建议。
    data:
      nodes:
        - label: 1. 商业化验证
          detail: 在头部物流场地累计验证超过 65,000 小时真实生产作业工时
        - label: 2. 在手合同需求
          detail: 面向企业级客户锁定超过 $300M 的 Digit v5 多年期确定订单
        - label: 3. 资本注入
          detail: 推进中的 $2.5B SPAC 交易预计由 Churchill 与 Foxconn 注入 $620M+ 总资本
        - label: 4. 经营阻力
          detail: 年现金消耗 ~$100M，且未披露公开收入，同期运营支出达 $111M
        - label: 5. 估值对照
          detail: 表观估值倍数高于传统工业自动化行业，但较 Figure AI ($39B) 明显折价
        - label: 6. 投资判断
          detail: 给予买入建议，信心度中等；要求依里程碑分批建仓并恪守价格纪律
    approximationNotes: 逻辑推演流程：将运营实据与财务指标关联映射至最终投资结论。
    claimRefs:
      - CV002
      - CV006
      - CV007
      - CV010
      - CV013
