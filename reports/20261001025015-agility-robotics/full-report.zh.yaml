              自 2015 年从 Oregon State University 拆分设立以来，Agility Robotics 已累计筹集超 $390 million 股权资金。公司历经 2022 年获 Amazon 支持的
              $150 million Series B 轮，以及 2025 年以 $2.12 billion 投前估值完成的 $400 million Series C-3 轮。推进中的 $2.5 billion SPAC
