      - number: '1.4'
        title: 规模信号、里程碑与风险底线
        blocks:
          - type: paragraph
            body: >-
              Agility 称已获得超过 $300 million 的多年期 Digit v5 订单，但须满足合同约定的里程碑条件。独立报道指出，该订单高度集中于一份 1,000
              台机器人的单一客户协议中；积压订单仅能说明存在需求意向，既非已确认收入，也无法证明客户结构的多元化。另有基于 S-4 文件的报道称，公司 2025 年净销售额为 $1.8 million；亦有独立研报指出，公司
              2025 年经营现金流出达 $99.8
              million，若本次交易未能完成，将面临持续经营预警。各项口径不可混为一谈：订单不等于收入，经营现金流出不等于会计亏损，预期交易募资也不等于手头可用现金。要证实其规模具备持续性，仍有赖于直接审阅监管申报文件、单客户经济模型、最新员工规模及通过认证的部署就绪状态。
            claimRefs:
              - CO003
              - CO010
              - CO011
              - CO012
              - CO013
