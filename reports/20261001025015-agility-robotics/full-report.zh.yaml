  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Digit 5 硬件架构、摆线针轮驱动与物理性能
        blocks:
          - type: paragraph
            body: >-
              2026 年 9 月 15 日，Agility Robotics 正式发布 Digit 5，标志着从单一受限物料搬运试验迈向通用厂区自动化。该机器人搭载采用自研摆线针轮执行器（cycloidal
              actuator）技术的升级版双足腿部架构，有效载荷相较 Digit 4 提升 40%，可反复搬运 50 磅（22.7 kg）重的物料。这一负重指标完全覆盖了 OSHA 监管设施下的单人搬运作业上限。Digit
              5 身高 5 英尺 11 英寸（1.81 m）、体重 284 磅（129 kg），最高向上摸高可达 7.2 英尺（2.2
              m），尺寸设计确保其无需改造厂房即可自由穿行于人类工作区、标准仓储过道以及通行门框。为满足工厂与配送中心高利用率轮班需求，Agility 重新设计了储能系统：电池单次续航 90 分钟，自主回充仅需 9
              分钟，实现了 10:1 的运行充电比，单日可用运营时长超过 20 小时。标准化 ISO 安装法兰支持末端执行器快速更换，兼容料箱搬运、机床上下料以及巡检工具夹具。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
