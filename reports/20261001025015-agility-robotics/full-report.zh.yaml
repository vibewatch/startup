  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 核心风险梳理与威胁排序
        blocks:
          - type: paragraph
            body: >-
              Agility Robotics 风险极高，其实际工程落地的推进与财务层面的可持续性严重脱节。尽管公司在客户物流设施中累计记录了超过 65,000
              小时的商业运行时间，展现出先发优势，但其财务架构依然极其脆弱。决定 Agility 未来 12 到 24
              个月生死存亡的核心威胁来自四大环环相扣的风险维度：未获验证的机器人即服务（RaaS）模式下的流动性消耗、高度集中的客户积压订单、尚未解决的协同安全认证，以及拟推进的 SPAC 合并交易的执行风险。在 2026
              年提交给 SEC 的监管申报文件中，Agility 的独立审计师明确出具了持续经营预警，指出公司从未产生过正向现金流，且在 2025 年录得 $138.1 million 净亏损。尽管管理层在 2026 年 7
              月获得了 $100 million 的 SAFE 票据融资，但仅 2025 年一年公司就消耗了 $99.8 million 的经营现金；足见其流动性完全维系在能否顺利完成 Churchill Capital
              Corp XI 合并交易并拿到预期的 $620 million 募资款上。一旦资本市场环境导致合并交易延期或流产，Agility 的运营跑道将迅速收窄。
            claimRefs:
              - CR001
              - CR002
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR007
              - CR010
              - CR014
      - number: '7.2'
        title: 监管壁垒、协同安全认证与 S-4 审查
        blocks:
          - type: paragraph
            body: >-
              决定 Agility 商业化扩张的关键技术里程碑，在于能否通过无围栏作业的第三方工业安全认证。过往版本的 Digit（包括已实现商业化部署的 Digit
              v4）均在严格物理隔离的工位内运转，以防止人类员工发生机械碰撞。然而，Agility 的核心市场逻辑——服务专为人类工人设计的既有仓储设施——要求 Digit v5
              能够在没有防护围栏的情况下实现人机协作。依照美国 OSHA 职场安全标准及国际机器人安全框架，这要求必须获得 IEC 61508 功能安全（安全完整性等级 SIL 3）、ISO 13849 及 ISO/IEC
              TR 5469 的正式认证。尽管 Agility 携手 NVIDIA 在 Halos AI 系统测试实验室对 Digit v5
              进行了预评估，但实验室预评估不能替代具备资质的第三方权威认证。在独立安全主管机构出具最终认证之前，Digit v5 无法合法合规地在受 OSHA 监管的客户设施中实现无围栏部署。与此同时，走向公开市场的关键在于
              Churchill Capital Corp XI 提交的 Form S-4 注册声明能否获得监管核准；该文件已于 2026 年 9 月 30 日提交了修订案（S-4/A）。SEC
              审查周期的拉长或安全测试的受挫，都可能导致股东投票延期，从而加剧融资脆弱性。
            claimRefs:
              - CR007
              - CR008
              - CR009
