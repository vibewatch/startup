      - number: '6.3'
        title: 扩张路径、安全瓶颈与客户集中度风险
        blocks:
          - type: paragraph
            body: >-
              尽管先发优势显著，Agility 的客户拓展路径仍表现出高度的运营集中与采纳阻力 [CU011, CU012]。截至目前，已获确认的客户合作均停留在单一厂区的单点突破阶段；无论是 GXO、Toyota 还是
              Mercado Libre，均未从局部的工位部署走向跨多厂区的网络化推广 [CU001,
              CU011]。现有安全法规对商业扩张形成了硬性物理约束：由于当前批次缺乏能够与人类仓储员工并肩作业的认证协同安全系统，每台在役的 Digit 都必须圈禁在物理隔离区或防护围栏内部 [CU012,
              CU013]。虽然 Agility 达成了 OSHA 认可的国家认可测试实验室（NRTL）现场评估里程碑，但诸如 ISO 25785 等正式协同安全标准距离最终批准仍需数年时间，直接将 Digit
              的可用作业面积限制在拉有警戒线的仓储隔离单元之内 [CU012, CU013]。


              随着 Agility 走向公开市场，其客户合同的履约持续性正面临严苛的财务审视 [CU014, CU015]。公司宣布获得了面向第五代 Digit v5 平台、总额超过 $300 million
              的多年期有约束力订单 [CU014, CU015]。但交易披露显示，该积压订单高度集中在单一未具名客户的 1,000 台合同中，实际收入转化仍取决于严格性能与安全里程碑的达成 [CU014, CU015]。尽管
              Agility 将 Digit 按每小时 $30 对标含福利的综合人工成本，并将长期运营成本目标定在每小时 $2 到 $3，但当前的实际运营成本仍徘徊在每小时 $10 到 $25 之间 [CU003,
              CU016]。在协同安全彻底攻克且跨场地可复制性得到验证之前，随着资金雄厚的竞对相继推出同类产品，Agility 面临着企业客户暂缓车队扩充的重大风险 [CU011, CU012]。
            claimRefs:
              - CU001
              - CU003
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
