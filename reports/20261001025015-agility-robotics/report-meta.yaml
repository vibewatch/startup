  topStrengths:
    - Early commercial deployment lead with real production operating hours in customer facilities.
    - Broadening industrial use cases across logistics, manufacturing, and warehouse automation.
    - Public-market financing could fund manufacturing scale-up if the transaction closes.
  topRisks:
    - Public financial disclosures still show very low revenue relative to the announced valuation.
    - Liquidity and execution depend on a SPAC close and continued access to capital.
    - Contract concentration and unresolved cooperative safety certification limit near-term scale visibility.
  unresolvedGaps:
    - Audited financial statements and verified revenue figures remain limited.
    - RoboFab unit economics and manufacturing cost curve are still undisclosed.
    - Customer contract pricing, renewal terms, and expansion commitments remain opaque.
    - Cooperative safety certification and broader deployment timing are still not fully resolved.
