callouts:
  - calloutType: "insight"
    title: "The Fenceless Safety Gating Factor"
    body: "The transition from workcell-constrained pilots to multi-facility fleet adoption depends entirely on third-party cooperative safety certification under IEC 61508 SIL 3. Without fenceless certification, humanoid robots remain confined to specialized perimeters, surrendering their primary value proposition of operating in existing human workspaces without facility modifications."
    claimRefs:
      - "CM006"
      - "CM007"
  - calloutType: "risk"
    title: "Backlog Durability vs. Recognized Revenue"
    body: "Agility's $300 million Digit v5 order book represents committed multi-year RaaS interest but remains subject to contractual delivery milestones and customer cancellation rights. Investors must distinguish contracted backlog for a developmental robot from recognized GAAP revenue, particularly given unproven unit economics and cash burn."
    claimRefs:
      - "CM002"
      - "CM008"
      - "CM012"
