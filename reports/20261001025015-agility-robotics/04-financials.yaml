chapter:
  number: 4
  title: "Financials"
  summary: "Agility Robotics reported $1.8 million of 2025 net sales against a $140 million operating loss and about $100 million of cash burn, while the proposed SPAC is expected to provide more than $620 million of gross proceeds. Disclosed pricing establishes two monetization paths, but realized gross margin, manufacturing cost, cash on hand, and sales-efficiency metrics remain material underwriting gaps."
sections:
  - id: "revenue-model-and-pricing"
    title: "Revenue Model and Pricing"
    body: >-
      Agility offers Digit through Robots-as-a-Service (RaaS) and direct ownership. The
      reported RaaS schedule is about $8,500 per month plus a $25,000 deployment fee and
      includes access to the robot, software, and maintenance; management's five-year
      illustration produces $535,000 of revenue per robot. The direct-purchase schedule is
      about $200,000 upfront, a $20,000 deployment fee, and roughly $36,000 annually for
      software and maintenance, or $400,000 over five years. These are disclosed schedules,
      not evidence of realized average selling price, recognized revenue mix, renewal rates,
      or gross margin. Arc provides a recurring software and fleet-management layer, but the
      public evidence does not separate Arc revenue from hardware or service revenue.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI015"
      - "CI016"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "traction-and-revenue-quality"
    title: "Traction and Revenue Quality"
    body: >-
      Reported commercial activity is ahead of recognized revenue. Agility recorded only
      $1.8 million of net sales in 2025, while reporting points to more than $300 million of
      multi-year Digit v5 orders from one undisclosed customer under a three-year,
      1,000-robot contract. The filing caveat matters: the order figure is not current-period
      revenue and depends on milestones, pricing, deployment timing, and utilization. More
      than 65,000 operating hours across nine customer sites is a useful deployment and GTM
      proof point, but it does not establish billings, retention, customer concentration,
      sales-cycle duration, CAC, or payback. Underwriting should therefore treat the order
      figure as conditional demand evidence rather than ARR or recognized backlog revenue.
    claimRefs:
      - "CI005"
      - "CI009"
      - "CI010"
  - id: "cost-structure-and-unit-economics"
    title: "Cost Structure and Unit Economics"
    body: >-
      The 2025 cost base remains far ahead of the commercial base: Agility reported a
      $140 million operating loss, about $111 million of operating spending versus $71
      million in 2024, and approximately $100 million of cash burn. Those measures are not
      interchangeable: the accounting loss is not the cash-burn figure. RaaS also leaves
      Agility owning the robot while collecting service fees, so manufacturing capital,
      depreciation, maintenance, field support, and working-capital timing are central to
      margin formation. Public sources establish the fee schedule but not the bill of
      materials, unit production cost, warranty reserve, service cost per operating hour,
      utilization, asset life, realized gross margin, or fleet-level contribution margin.
      Those omissions prevent a defensible CAC/payback or unit-economics conclusion.
    claimRefs:
      - "CI001"
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI015"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-verdict"
    title: "Capital Adequacy and Financial Verdict"
    body: >-
      The Churchill Capital Corp. XI combination is expected to deliver more than $620
      million of gross proceeds, including about $420 million from the SPAC trust and a
      roughly $200 million Foxconn-led PIPE. Gross proceeds are not cash available: the
      trust component assumes no redemptions, the transaction remains subject to closing
      conditions, and transaction costs, future capex, and changes in burn are not quantified
      here. EquityZen's $641 million total-funding figure likewise cannot be treated as a
      current cash balance. At a $2.5 billion transaction value, independent reporting
      calculates a roughly 1,400-times multiple on 2025 net sales. The financial verdict is
      therefore high capital dependency with low present revenue quality: the model can
      create recurring revenue, but margin durability and runway cannot be underwritten
      without cash, contract, cost, and utilization data.
    claimRefs:
      - "CI011"
      - "CI012"
      - "CI013"
      - "CI014"
