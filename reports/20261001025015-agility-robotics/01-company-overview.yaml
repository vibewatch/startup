company:
  name: Agility Robotics
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Agility Robotics is a Salem, Oregon humanoid-robotics company founded in 2015 whose
    Digit robot and Arc fleet platform target repetitive work in manufacturing,
    distribution, and logistics. Its announced public-market transaction and reported
    commercial backlog provide scale signals, but the latest assigned evidence also
    exposes material liquidity, concentration, certification, and disclosure gaps.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Agility Robotics was established in 2015 by Jonathan Hurst, Damion Shelton, and
      Mikhail Jones from Oregon State University's Dynamic Robotics Laboratory and is
      now based in Salem, Oregon. The company sells an integrated automation proposition:
      Digit performs physical work, while Arc operates and manages robot fleets. Its
      commercial focus is structured manufacturing, distribution, and logistics
      environments rather than a near-term consumer robot. The company reports more than
      65,000 operating hours across nine customer facilities, but that footprint is a
      deployment-site count rather than a disclosed count of paying customers or robots.
      The business model combines Robot-as-a-Service with direct ownership, leaving
      lifecycle service cost and hardware utilization central to eventual unit economics.
    claimRefs: [CO001, CO002, CO003, CO004, CO015]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, founders, and governance
    body: >-
      Peggy Johnson leads the company as chief executive, while co-founder Jonathan Hurst
      remains chief robot officer. That pairing combines professional commercial
      leadership with founder-level technical continuity, but it also makes retention of
      Hurst and other specialized robotics leaders an important dependency. The disclosed
      executive roster covers business, finance and operations, technology, hardware,
      legal, and people functions, while the careers page describes a workforce spanning
      engineering, AI research, and manufacturing. The assigned evidence does not provide
      a complete current board roster, voting-control analysis, ownership schedule, or
      history of leadership changes, so governance quality and key-person protections
      remain diligence items rather than verified strengths.
    claimRefs: [CO001, CO005, CO006, CO016]
    tableRefs: [TO002]
  - id: capital-and-public-transition
    title: Capital structure and public-market transition
    body: >-
      On June 24, 2026, Agility and Churchill Capital Corp XI announced a definitive
      business combination intended to list the combined company under the ticker AGLT.
      The announcement set a $2.5 billion pre-money equity value and described more than
      $620 million of expected gross proceeds, including approximately $200 million from
      a PIPE. These are transaction terms and prospective gross proceeds, not cash
      currently available to Agility. A later independent account reported a $100 million
      SAFE financing in July 2026. The latest assigned sources do not provide a directly
      reviewed S-4, a complete capitalization table, debt schedule, secondary-sale
      history, redemption sensitivity, or net-proceeds bridge, so dilution and post-close
      liquidity cannot be resolved from this chapter.
    claimRefs: [CO007, CO008, CO009, CO014]
    tableRefs: [TO003]
  - id: scale-milestones-and-risk-baseline
    title: Scale signals, milestones, and risk baseline
    body: >-
      Agility says it has secured more than $300 million of multi-year Digit v5 orders,
      subject to contractual milestones. Independent reporting says those orders are
      concentrated in one 1,000-robot customer agreement, making the backlog a demand
      signal rather than recognized revenue or diversified proof. Another report based
      on the S-4 states that 2025 net sales were $1.8 million, while a separate critical
      review reports $99.8 million of operating cash use in 2025 and a going-concern
      warning absent the proposed transaction. These measures are not interchangeable:
      orders are not revenue, operating cash use is not accounting loss, and expected
      transaction proceeds are not available cash. Direct filing review, customer-level
      economics, current headcount, and certified deployment readiness remain necessary
      to establish durable scale.
    claimRefs: [CO003, CO010, CO011, CO012, CO013]
    figureRefs: [FO001]
