  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: >-
        Complete current board roster, executive biographies, leadership-change history,
        succession plans, key-person protections, ownership percentages, and voting rights.
      whyItMatters: >-
        Governance quality, founder dependence, control, and management readiness for a
        public listing cannot be assessed from an executive roster alone.
      diligencePath: >-
        Obtain the current board and officer register, employment and retention agreements,
        board minutes, committee charters, capitalization table, and post-close voting schedule.
      relatedQuestionRefs: [QO004, QO005]
      relatedTableRefs: [TO002, TO003]
    - type: missing-source
      severity: material
      topic: sec-filing
      missingEvidence: >-
        Directly reviewed SEC S-4 and amendments containing audited financial statements,
        capitalization, dilution, redemptions, debt, related parties, and risk factors.
      whyItMatters: >-
        Third-party descriptions cannot establish the exact audited figures, periods,
        accounting definitions, transaction conditions, or post-close liquidity.
      diligencePath: >-
        Retrieve the filed S-4 and amendments from SEC EDGAR, reconcile every financial
        metric to the audited statements, and model gross-to-net proceeds under redemptions.
      relatedQuestionRefs: [QO005, QO006, QO008]
      relatedTableRefs: [TO001, TO003]
    - type: private-evidence-only
      severity: material
      topic: cover-metrics
      missingEvidence: >-
