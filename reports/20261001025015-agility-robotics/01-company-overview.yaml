callouts:
  - calloutType: risk
    title: Orders, revenue, loss, and cash use are distinct
    body: >-
      The $300+ million order figure is milestone-dependent backlog; the $1.8 million
      figure is reported FY2025 net sales; the $99.8 million figure is reported operating
      cash use; and the $620+ million figure is expected gross transaction proceeds.
    claimRefs: [CO009, CO010, CO011, CO012]
  - calloutType: insight
    title: Public-market capital is the immediate company-stage inflection
    body: >-
      The transaction can materially expand financing capacity, but closing conditions,
      redemptions, dilution, safety milestones, and conversion of concentrated orders
      remain unresolved in the assigned evidence.
    claimRefs: [CO007, CO009, CO010, CO013]
