evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Complete current board roster, executive biographies, leadership-change history, succession plans, key-person
      protections, ownership percentages, and voting rights.
    whyItMatters: >-
      Governance quality, founder dependence, control, and management readiness for a public listing cannot be assessed
      from an executive roster alone.
    diligencePath: >-
      Obtain the current board and officer register, employment and retention agreements, board minutes, committee
      charters, capitalization table, and post-close voting schedule.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: sec-filing
    missingEvidence: >-
      Directly reviewed SEC S-4 and amendments containing audited financial statements, capitalization, dilution,
      redemptions, debt, related parties, and risk factors.
    whyItMatters: >-
      Third-party descriptions cannot establish the exact audited figures, periods, accounting definitions, transaction
      conditions, or post-close liquidity.
    diligencePath: >-
      Retrieve the filed S-4 and amendments from SEC EDGAR, reconcile every financial metric to the audited statements,
      and model gross-to-net proceeds under redemptions.
    relatedQuestionRefs:
      - QO005
      - QO006
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Current headcount, paying-customer count, deployed-robot count, customer-level revenue, recognized backlog
      schedule, gross margin, available cash, and locations.
    whyItMatters: >-
      Site count and operating hours do not provide the denominators needed to judge commercial breadth, productivity,
      concentration, or cash runway.
    diligencePath: >-
      Request a dated operating KPI pack reconciled to billing and the general ledger, with customer, site, robot,
      employee, revenue, backlog, margin, and cash definitions.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-history
    missingEvidence: >-
      A primary-source chronology of financing rounds, product generations, certifications, partnerships, recalls,
      incidents, and leadership changes before June 2026.
    whyItMatters: >-
      The assigned evidence supports eight dated timeline entries but is concentrated in financial periods and the 2026
      transaction rather than the full company history.
    diligencePath: >-
      Reconcile corporate records, archived newsroom releases, investor announcements, certification records, customer
      releases, and litigation or incident databases.
    relatedQuestionRefs:
      - QO007
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: financial-reporting
    missingEvidence: >-
      Audited historical income statements, segmented revenue by customer, and verified gross margin by fiscal year
      prior to Form S-4 effectiveness.
    whyItMatters: >-
      Current market sizing and valuation multiples benchmark against management-stated trailing revenue ($37M) and
      preliminary unaudited burn ($100M), preventing precise unit-margin validation.
    diligencePath: >-
      Review Churchill Capital Corp XI Form S-4 registration statement once declared effective by the SEC to inspect
      certified GAAP financials and contract terms.
    relatedQuestionRefs:
      - QM009
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Empirical commercial conversion rates from humanoid warehouse pilots into fenceless fleet deployments across
      non-automotive logistics facilities.
    whyItMatters: >-
      Broad TAM forecasts ($38B by 2035) extrapolate aggressive adoption that contrasts with industry expert warnings
      regarding customer contract cancellation rights and incumbent automation dominance.
    diligencePath: >-
      Track renewal, expansion, and robot delivery conversion milestones under Agility's 1,000-robot multi-year contract
      and GXO deployment.
    relatedQuestionRefs:
      - QM007
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Executed customer contracts showing robot count, RaaS or CapEx price, included service, utilization basis,
      discounts, renewal terms, and service-level credits.
    whyItMatters: >-
      Without realized pricing and productive-hour denominators, Digit cannot be compared economically with labor or
      specialized automation.
    diligencePath: >-
      Request redacted GXO, Toyota, and other multi-site contracts plus invoices and SLA performance reports in the data
      room.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: performance-economics
    missingEvidence: >-
      Customer-verified uptime, intervention frequency, accepted throughput, task-success denominator, and total
      productive-hour cost for a representative Digit fleet.
    whyItMatters: >-
      Company operating hours and paywalled headline economics do not establish reliability, payback, or performance
      across facilities.
    diligencePath: >-
      Obtain customer-authored scorecards and raw exception logs, then reconcile them to Arc telemetry and contracted
      acceptance criteria.
    relatedQuestionRefs:
      - QP003
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Realized manufacturing cost, gross margin, utilization, asset life, service cost, CAC, and payback by contract
      model.
    whyItMatters: >-
      Without these inputs, the disclosed price schedules cannot establish contribution margin, capital recovery, or
      sales efficiency.
    diligencePath: >-
      Review audited segment economics, robot-level cohorts, bills of materials, service logs, contract invoices, and
      customer-acquisition records.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, debt and project-finance obligations, transaction costs, redemption sensitivity, capex
      plan, and downside runway.
    whyItMatters: >-
      Gross transaction proceeds and cumulative funding do not establish liquidity available to finance the production
      ramp.
    diligencePath: >-
      Obtain the latest balance sheet, debt schedule, transaction sources-and-uses, monthly cash forecast, capex
      commitments, and downside financing plan.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Customer-level revenue concentration, recognized revenue mix, contract duration, renewal, cancellation, milestone,
      discount, and pilot-conversion data.
    whyItMatters: The public order and deployment metrics cannot establish recurring revenue quality or backlog conversion.
    diligencePath: >-
      Inspect executed customer agreements, revenue-recognition memos, invoices, renewal cohorts, pipeline conversion,
      and concentration schedules.
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: actuator-manufacturing-costs
    missingEvidence: >-
      Detailed bill-of-materials cost breakdown, supplier agreements, and volume manufacturing yields for proprietary
      cycloidal actuators.
    whyItMatters: >-
      Actuator unit economics and supply availability determine whether RoboFab can hit targeted volume production
      margins.
    diligencePath: Request audited component BOM breakdowns and supplier dual-sourcing contracts during technical diligence.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE001
  - type: missing-source
    severity: minor
    topic: developer-signal-and-apis
    missingEvidence: Public developer repository activity, SDK documentation, and open developer community interaction metrics.
    whyItMatters: >-
      Agility operates a closed-source hardware and software stack; third-party software extensibility cannot be
      benchmarked independently via developer activity.
    diligencePath: >-
