    keyQuote: >-
      Every previous generation of Digit operated inside a workcell — a physically fenced zone where workers and robots
      could not share space during normal production. Workcells solved a safety problem but created a commercial
      constraint: a robot that requires a custom fenced perimeter can only be deployed in facilities redesigned around
      that perimeter. Digit v4 effectively served a small slice of the addressable market.
