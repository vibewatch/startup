chapter:
  number: 5
  title: "Product & Technology"
  summary: "Agility Robotics designs, manufactures, and deploys Digit, an industrial bipedal humanoid robot paired with the Agility Arc cloud fleet management platform. Digit 5 introduces a 50-pound payload, proprietary cycloidal actuators, cooperative safety architecture via NVIDIA IGX Thor and Halos Core, and a 10:1 run-to-charge battery ratio to enable multi-workflow warehouse automation."
sections:
  - id: "digit5-hardware-and-actuation"
    title: "Digit 5 Hardware Architecture, Cycloidal Actuation, and Physical Capabilities"
    body: "Agility Robotics unveiled Digit 5 on September 15, 2026, marking the transition from task-constrained material-handling trials to general-purpose facility automation. The robot incorporates an upgraded bipedal leg architecture powered by proprietary cycloidal actuator technology, delivering a 40% payload increase over Digit 4 to repeatedly lift 50-pound (22.7 kg) loads. This threshold provides complete coverage of single-person lift tasks across OSHA-regulated facilities. Standing 5 feet 11 inches (1.81 m) tall, weighing 284 pounds (129 kg), and reaching overhead heights of up to 7.2 feet (2.2 m), Digit 5 is dimensioned to operate within human workspaces, standard warehouse aisles, and doorway clearances without structural modifications. To support high-utilization factory and distribution center shifts, Agility re-engineered the energy storage system with a 90-minute runtime battery that recharges autonomously in 9 minutes, establishing a 10:1 run-to-charge ratio and yielding over 20 hours of daily operating uptime. Standardized ISO mounting flanges allow rapid swaps between end-effectors, supporting tote handling, machine tending, and inspection tools."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
    tableRefs:
      - "TE001"
  - id: "cooperative-safety-and-compliance"
    title: "Cooperatively Safe Architecture, Sensor Supervision, and Regulatory Standards"
    body: "Industrial deployment of humanoid robots has historically been constrained by the requirement for physical cages and safety interlocks that disrupt existing workflow layouts. Digit 5 addresses this limitation through a cooperative safety architecture designed to eliminate protective barriers and enable direct collaboration alongside human associates. The platform utilizes proprietary perception algorithms combined with cameras, depth sensors, and inertial measurement units to continuously track human proximity, autonomously choosing between avoidance, deceleration, or controlled seated postures when clearances are breached. Agility serves as the inaugural launch partner for NVIDIA's Halos for Robotics safety framework, integrating NVIDIA IGX Thor hardware with Halos Core functional safety infrastructure to deliver certified real-time supervision. Digit previously achieved the distinction of passing an independent OSHA-administered safety standard evaluation on a customer production line. Furthermore, Agility actively leads drafting efforts for ANSI/A3 TR R15.108 for dynamically stable mobile robots and contributes to the ISO 25785-1 international humanoid safety standard."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
    tableRefs:
      - "TE002"
  - id: "physical-ai-and-simulation-stack"
    title: "Physical AI, Foundation Models, and Multi-Physics Simulation Infrastructure"
    body: "Agility develops its software motor cortex using a simulation-first physical AI training pipeline. Digital twins of Digit's mechanical chassis are constructed in NVIDIA Isaac Sim using OpenUSD, incorporating precise joint geometry, mass distribution, contact dynamics, and customer BIM facility models. Reinforcement learning policies are trained across billions of simulation steps in Isaac Lab, exposing the whole-body controller to diverse surface friction, aisle geometries, lighting variations, and physical disturbances to master step recovery and balance stability. To prevent simulator overfitting and identify edge cases in contact mechanics, Agility cross-validates candidate policies in a containerized MuJoCo pipeline before hardware deployment. The high-throughput training workload is executed on AWS cloud infrastructure, leveraging EC2 G6 GPU instances, Amazon Elastic Kubernetes Service (EKS) for job scheduling and multi-tenant isolation, and Amazon S3 for petabyte-scale simulation logs. This infrastructure allows Digit to adapt to novel tasks and layouts in simulation within hours rather than requiring iterative on-site physical programming."
    claimRefs:
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
    figureRefs:
      - "FE001"
  - id: "fleet-orchestration-and-connectivity"
    title: "Fleet Orchestration, Industrial Networking, and Enterprise Integration"
    body: "Multi-robot facility execution is orchestrated by Agility Arc, a centralized cloud platform managing fleet deployment, operational health, and workflow coordination. Arc interfaces directly with customer Warehouse Management Systems (WMS), Warehouse Execution Systems (WES), and Manufacturing Execution Systems (MES) to coordinate task handoffs between Digit and legacy autonomous mobile robots (AMRs) or conveyor belts. To ensure robust communications within RF-dense warehouses with metal racking and dynamic signal shadowing, Digit integrates Doodle Labs RM-1700 Mesh Rider dual-band radios. These radios leverage 900 MHz for non-line-of-sight penetration and 2.4 GHz for high-bandwidth telemetry, maintaining sub-10 millisecond command latency. Security controls incorporate mutual TLS (mTLS) and TLS 1.2+ encryption rooted to private certificate authorities for all cloud transit, customer data segregation, and AES hardware encryption for on-robot storage at rest."
    claimRefs:
      - "CE013"
      - "CE014"
    tableRefs:
      - "TE003"
