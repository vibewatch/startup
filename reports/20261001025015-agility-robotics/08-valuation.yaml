callouts:
  - calloutType: "recommendation"
    title: "Staged Public Market Entry Discipline"
    body: "Investors should maintain disciplined entry parameters around the $2.5 billion SPAC transaction. While Agility holds an unmatched 65,000-hour commercial deployment lead in industrial humanoids, operating losses of $111 million and an unconfirmed revenue base suggest initial trading may experience volatility typical of de-SPAC transactions. Staging exposure or targeting secondary allocations below headline valuation mitigates near-term dilution and cash burn overhang."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV005"
      - "CV006"
      - "CV013"
  - calloutType: "risk"
    title: "Backlog Concentration and Milestone Delivery Risk"
    body: "The headline $300 million committed order book provides substantial narrative momentum but masks acute concentration risk. With the entire commitment sourced from a single undisclosed counterparty for 1,000 Digit v5 units over three years, any hardware reliability delay or failure to achieve cooperative safety benchmarks could trigger milestone cancellations, impairing the valuation thesis."
    claimRefs:
      - "CV007"
      - "CV008"
