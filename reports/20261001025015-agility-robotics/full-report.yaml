        - date: '2015'
          label: Company established
          detail: >-
            Founded by Jonathan Hurst, Damion Shelton, and Mikhail Jones from Oregon State University's Dynamic Robotics
            Laboratory.
          tone: positive
        - date: '2024'
          label: Operating cash use baseline
          detail: A critical review of the filing reports $70.7 million of operating cash use for the year.
          tone: neutral
        - date: '2025'
          label: Cash use increased
          detail: The same review reports $99.8 million of operating cash use in 2025.
          tone: negative
        - date: '2025'
          label: Limited reported net sales
          detail: A third-party account of the S-4 reports $1.8 million in 2025 net sales.
          tone: negative
