              - CI009
              - CI010
              - CI015
      - number: '4.2'
        title: Traction and Revenue Quality
        blocks:
          - type: paragraph
            body: >-
              Reported commercial activity is ahead of recognized revenue. Agility recorded only $1.8 million of net
              sales in 2025, while reporting points to more than $300 million of multi-year Digit v5 orders from one
              undisclosed customer under a three-year, 1,000-robot contract. The filing caveat matters: the order figure
              is not current-period revenue and depends on milestones, pricing, deployment timing, and utilization. More
              than 65,000 operating hours across nine customer sites is a useful deployment and GTM proof point, but it
              does not establish billings, retention, customer concentration, sales-cycle duration, CAC, or payback.
              Underwriting should therefore treat the order figure as conditional demand evidence rather than ARR or
              recognized backlog revenue.
            claimRefs:
              - CI005
              - CI009
              - CI010
      - number: '4.3'
        title: Cost Structure and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              The 2025 cost base remains far ahead of the commercial base: Agility reported a $140 million operating
              loss, about $111 million of operating spending versus $71 million in 2024, and approximately $100 million
              of cash burn. Those measures are not interchangeable: the accounting loss is not the cash-burn figure.
              RaaS also leaves Agility owning the robot while collecting service fees, so manufacturing capital,
              depreciation, maintenance, field support, and working-capital timing are central to margin formation.
              Public sources establish the fee schedule but not the bill of materials, unit production cost, warranty
              reserve, service cost per operating hour, utilization, asset life, realized gross margin, or fleet-level
              contribution margin. Those omissions prevent a defensible CAC/payback or unit-economics conclusion.
            claimRefs:
              - CI001
              - CI006
              - CI007
              - CI008
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI011
              - CI014
      - number: '4.4'
        title: Capital Adequacy and Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              The Churchill Capital Corp. XI combination is expected to deliver more than $620 million of gross
              proceeds, including about $420 million from the SPAC trust and a roughly $200 million Foxconn-led PIPE.
              Gross proceeds are not cash available: the trust component assumes no redemptions, the transaction remains
              subject to closing conditions, and transaction costs, future capex, and changes in burn are not quantified
              here. EquityZen's $641 million total-funding figure likewise cannot be treated as a current cash balance.
              At a $2.5 billion transaction value, independent reporting calculates a roughly 1,400-times multiple on
              2025 net sales. The financial verdict is therefore high capital dependency with low present revenue
              quality: the model can create recurring revenue, but margin durability and runway cannot be underwritten
              without cash, contract, cost, and utilization data.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Orders are not current revenue
            body: >-
              The more than $300 million order figure is tied to one undisclosed customer, a three-year 1,000-robot
              contract, and milestone execution. It should not be treated as ARR, current-period revenue, or cash.
            calloutType: risk
            claimRefs:
              - CI009
          - type: callout
            title: Underwrite liquidity only after closing mechanics
            body: >-
              Model the trust, PIPE, redemptions, fees, capex, and downside burn separately. Expected gross proceeds and
              cumulative funding raised do not establish cash available or runway.
            calloutType: recommendation
            claimRefs:
              - CI011
              - CI013
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Digit 5 Hardware Architecture, Cycloidal Actuation, and Physical Capabilities
        blocks:
          - type: paragraph
            body: >-
              Agility Robotics unveiled Digit 5 on September 15, 2026, marking the transition from task-constrained
              material-handling trials to general-purpose facility automation. The robot incorporates an upgraded
              bipedal leg architecture powered by proprietary cycloidal actuator technology, delivering a 40% payload
              increase over Digit 4 to repeatedly lift 50-pound (22.7 kg) loads. This threshold provides complete
              coverage of single-person lift tasks across OSHA-regulated facilities. Standing 5 feet 11 inches (1.81 m)
              tall, weighing 284 pounds (129 kg), and reaching overhead heights of up to 7.2 feet (2.2 m), Digit 5 is
              dimensioned to operate within human workspaces, standard warehouse aisles, and doorway clearances without
              structural modifications. To support high-utilization factory and distribution center shifts, Agility
              re-engineered the energy storage system with a 90-minute runtime battery that recharges autonomously in 9
              minutes, establishing a 10:1 run-to-charge ratio and yielding over 20 hours of daily operating uptime.
              Standardized ISO mounting flanges allow rapid swaps between end-effectors, supporting tote handling,
              machine tending, and inspection tools.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
