      - number: '8.2'
        title: Thesis and Anti-Thesis Dynamics
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis rests on Agility's substantial commercial deployment head start over both
              venture-backed and industrial rivals. While peers such as Figure AI command massive private valuations
              ($39 billion) without scaled industrial installations, Digit is actively performing real-world logistics
              workflows across blue-chip customers including GXO Logistics and Schaeffler. However, the anti-thesis
              highlights critical structural vulnerabilities. Agility's operating expenses expanded to $111 million in
              2025, driven by capital-intensive hardware engineering and facility expansion in Salem, Oregon.
              Furthermore, the commercial order book remains heavily concentrated, with the headline $300 million
              backlog tied to a single undisclosed customer over three years. If milestone deliveries underperform or
              competitive humanoid platforms close the software capability gap, Agility faces liquidity compression
              before achieving manufacturing self-sufficiency.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV010
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV010
              - CV013
              - CV014
      - number: '8.3'
        title: Financing, Valuation, and Capital Structure Context
        blocks:
          - type: paragraph
            body: >-
              Agility Robotics has raised over $390 million in equity funding since its 2015 spin-off from Oregon State
              University, progressing through an Amazon-backed $150 million Series B in 2022 and a $400 million Series
              C-3 in 2025 priced at a $2.12 billion pre-money valuation. The pending $2.5 billion SPAC transaction
              reflects an incremental step-up rather than speculative multiple inflation, supported by committed anchor
              financing including $200 million from a consortium led by Foxconn. However, scrutiny of the capital
              structure reveals key preference overhangs. Series B-X shares carry a senior 2.0x liquidation preference
              multiplier, which establishes downside priority over common equity holders in distressed scenarios. On
              secondary markets, platform quotes at $71.00 per share imply an equity value of $2.28 billion,
              demonstrating that private buyers are benchmarking close to the merger price while accounting for SPAC
              closing execution risk.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV011
              - CV012
      - number: '8.4'
        title: Scenario Analysis, Exit Readiness, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Scenario modeling for Agility Robotics across a 24-month horizon emphasizes the asymmetry between
              commercial adoption speed and cash burn duration. In the bull case, smooth ramp of Digit v5 and full
              conversion of the $300 million order book justify equity appreciation toward $4.0 billion to $5.0 billion,
              drawing valuation parallels to high-margin warehouse automation pioneers like Symbotic. In the base case,
              the SPAC merger closes successfully, providing $620 million in liquidity that absorbs the $100 million
              burn rate while enterprise deployments expand steadily at fair value. In the bear case, SPAC share
              redemptions curtail proceeds, customer milestone cancellations halt backlog conversion, and severe
              dilution results from down-round recapitalizations. Crucial diligence priorities include reviewing the
              upcoming Form S-4 audited financials and verifying customer milestone delivery schedules.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV007
              - CV008
              - CV009
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Staged Public Market Entry Discipline
            body: >-
              Investors should maintain disciplined entry parameters around the $2.5 billion SPAC transaction. While
              Agility holds an unmatched 65,000-hour commercial deployment lead in industrial humanoids, operating
              losses of $111 million and an unconfirmed revenue base suggest initial trading may experience volatility
              typical of de-SPAC transactions. Staging exposure or targeting secondary allocations below headline
              valuation mitigates near-term dilution and cash burn overhang.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV013
          - type: callout
            title: Backlog Concentration and Milestone Delivery Risk
            body: >-
              The headline $300 million committed order book provides substantial narrative momentum but masks acute
              concentration risk. With the entire commitment sourced from a single undisclosed counterparty for 1,000
              Digit v5 units over three years, any hardware reliability delay or failure to achieve cooperative safety
              benchmarks could trigger milestone cancellations, impairing the valuation thesis.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
