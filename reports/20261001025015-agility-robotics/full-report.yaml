              - CE003
              - CE008
              - CE014
      - number: '5.3'
        title: Physical AI, Foundation Models, and Multi-Physics Simulation Infrastructure
        blocks:
          - type: paragraph
            body: >-
              Agility develops its software motor cortex using a simulation-first physical AI training pipeline. Digital
              twins of Digit's mechanical chassis are constructed in NVIDIA Isaac Sim using OpenUSD, incorporating
              precise joint geometry, mass distribution, contact dynamics, and customer BIM facility models.
              Reinforcement learning policies are trained across billions of simulation steps in Isaac Lab, exposing the
              whole-body controller to diverse surface friction, aisle geometries, lighting variations, and physical
              disturbances to master step recovery and balance stability. To prevent simulator overfitting and identify
              edge cases in contact mechanics, Agility cross-validates candidate policies in a containerized MuJoCo
              pipeline before hardware deployment. The high-throughput training workload is executed on AWS cloud
              infrastructure, leveraging EC2 G6 GPU instances, Amazon Elastic Kubernetes Service (EKS) for job
              scheduling and multi-tenant isolation, and Amazon S3 for petabyte-scale simulation logs. This
              infrastructure allows Digit to adapt to novel tasks and layouts in simulation within hours rather than
              requiring iterative on-site physical programming.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
