      - number: '5.2'
        title: Cooperatively Safe Architecture, Sensor Supervision, and Regulatory Standards
        blocks:
          - type: paragraph
            body: >-
              Industrial deployment of humanoid robots has historically been constrained by the requirement for physical
              cages and safety interlocks that disrupt existing workflow layouts. Digit 5 addresses this limitation
              through a cooperative safety architecture designed to eliminate protective barriers and enable direct
              collaboration alongside human associates. The platform utilizes proprietary perception algorithms combined
              with cameras, depth sensors, and inertial measurement units to continuously track human proximity,
              autonomously choosing between avoidance, deceleration, or controlled seated postures when clearances are
              breached. Agility serves as the inaugural launch partner for NVIDIA's Halos for Robotics safety framework,
              integrating NVIDIA IGX Thor hardware with Halos Core functional safety infrastructure to deliver certified
              real-time supervision. Digit previously achieved the distinction of passing an independent
              OSHA-administered safety standard evaluation on a customer production line. Furthermore, Agility actively
              leads drafting efforts for ANSI/A3 TR R15.108 for dynamically stable mobile robots and contributes to the
              ISO 25785-1 international humanoid safety standard.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
