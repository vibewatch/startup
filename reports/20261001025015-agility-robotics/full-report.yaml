            synthetic data generation.
          tone: neutral
        - label: Fleet Orchestration & Enterprise Integration
          detail: >-
            Agility Arc cloud platform providing fleet telemetry, mTLS-secured communication, and REST/API bridges to
            warehouse WMS/WES/MES.
          tone: positive
        - label: Industrial Wireless Mesh Communications
          detail: >-
            Doodle Labs RM-1700 dual-band radios (900 MHz NLOS and 2.4 GHz high-throughput) providing low-latency
            (<10ms) telemetry and control.
          tone: neutral
        - label: Physical AI & Whole-Body Control Stack
          detail: >-
            Reinforcement-learning foundation model developed in Isaac Lab and containerized MuJoCo for balance,
            step-recovery, and manipulation.
          tone: positive
