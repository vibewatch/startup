      - number: '6.2'
        title: Named Customer Deployments and Operational Track Record
        blocks:
          - type: paragraph
            body: >-
              Agility's public commercial differentiation rests on verified production deployments at marquee industrial
              accounts [CU001, CU008]. At GXO Logistics' facility supporting Spanx in Flowery Branch, Georgia, Digit has
              operated continuously across multiple shifts unloading autonomous mobile robots and feeding facility
              conveyors, accumulating over 100,000 commercial tote cycles since deployment in June 2024 [CU001, CU002].
              This operational run represents the longest documented commercial deployment of a bipedal humanoid robot
              in enterprise logistics history, providing critical validation of real-world endurance in active warehouse
              environments [CU001, CU004]. Across its total customer base of nine operating facilities, Agility has
              logged more than 65,000 cumulative operational runtime hours [CU004, CU008].


              In automotive manufacturing, Toyota Motor Manufacturing Canada (TMMC) conducted an extensive year-long
              pilot evaluating three Digit units across three testing phases at its Woodstock, Ontario assembly plant
              [CU006, CU008]. Following validation in production parts replenishment and tugger loading for RAV4
              assembly, TMMC signed a formal commercial RaaS agreement in February 2026 to expand the deployment to
              seven to ten Digit robots [CU006, CU008]. Similarly, Latin American e-commerce giant Mercado Libre signed
              a commercial contract in December 2025 to deploy Digit for fulfillment operations at its San Antonio,
              Texas facility [CU009]. Although strategic backer Amazon completed initial logistics pilots at its Sumner,
              Washington innovation site, ongoing commercial scaling with Amazon remains contingent on next-generation
              safety milestones rather than active fleet expansion [CU010].
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU006
              - CU008
