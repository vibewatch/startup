      - number: '1.3'
        title: Capital structure and public-market transition
        blocks:
          - type: paragraph
            body: >-
              On June 24, 2026, Agility and Churchill Capital Corp XI announced a definitive business combination
              intended to list the combined company under the ticker AGLT. The announcement set a $2.5 billion pre-money
              equity value and described more than $620 million of expected gross proceeds, including approximately $200
              million from a PIPE. These are transaction terms and prospective gross proceeds, not cash currently
              available to Agility. A later independent account reported a $100 million SAFE financing in July 2026. The
              latest assigned sources do not provide a directly reviewed S-4, a complete capitalization table, debt
              schedule, secondary-sale history, redemption sensitivity, or net-proceeds bridge, so dilution and
              post-close liquidity cannot be resolved from this chapter.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO007
              - CO008
              - CO009
              - CO010
      - number: '1.4'
        title: Scale signals, milestones, and risk baseline
        blocks:
          - type: paragraph
            body: >-
              Agility says it has secured more than $300 million of multi-year Digit v5 orders, subject to contractual
              milestones. Independent reporting says those orders are concentrated in one 1,000-robot customer
              agreement, making the backlog a demand signal rather than recognized revenue or diversified proof. Another
              report based on the S-4 states that 2025 net sales were $1.8 million, while a separate critical review
              reports $99.8 million of operating cash use in 2025 and a going-concern warning absent the proposed
              transaction. These measures are not interchangeable: orders are not revenue, operating cash use is not
              accounting loss, and expected transaction proceeds are not available cash. Direct filing review,
              customer-level economics, current headcount, and certified deployment readiness remain necessary to
              establish durable scale.
            claimRefs:
