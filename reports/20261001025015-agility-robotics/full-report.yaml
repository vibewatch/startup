chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Agility Robotics was established in 2015 by Jonathan Hurst, Damion Shelton, and Mikhail Jones from Oregon
              State University's Dynamic Robotics Laboratory and is now based in Salem, Oregon. The company sells an
              integrated automation proposition: Digit performs physical work, while Arc operates and manages robot
              fleets. Its commercial focus is structured manufacturing, distribution, and logistics environments rather
              than a near-term consumer robot. The company reports more than 65,000 operating hours across nine customer
              facilities, but that footprint is a deployment-site count rather than a disclosed count of paying
              customers or robots. The business model combines Robot-as-a-Service with direct ownership, leaving
              lifecycle service cost and hardware utilization central to eventual unit economics.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO008
              - CO009
              - CO010
              - CO011
      - number: '1.2'
        title: Leadership, founders, and governance
        blocks:
          - type: paragraph
            body: >-
              Peggy Johnson leads the company as chief executive, while co-founder Jonathan Hurst remains chief robot
              officer. That pairing combines professional commercial leadership with founder-level technical continuity,
              but it also makes retention of Hurst and other specialized robotics leaders an important dependency. The
              disclosed executive roster covers business, finance and operations, technology, hardware, legal, and
              people functions, while the careers page describes a workforce spanning engineering, AI research, and
              manufacturing. The assigned evidence does not provide a complete current board roster, voting-control
              analysis, ownership schedule, or history of leadership changes, so governance quality and key-person
              protections remain diligence items rather than verified strengths.
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO016
