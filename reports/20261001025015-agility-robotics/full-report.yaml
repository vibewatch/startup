      - number: '6.3'
        title: Expansion Trajectory, Safety Bottlenecks, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Despite substantial first-mover achievements, Agility's customer trajectory exhibits pronounced
              operational concentration and adoption friction [CU011, CU012]. To date, confirmed customer relationships
              remain single-facility beachheads; neither GXO, Toyota, nor Mercado Libre has transitioned from localized
              workcell deployments to multi-site network rollouts [CU001, CU011]. Commercial expansion is physically
              constrained by current safety regulations: every deployed Digit must operate inside a segregated zone or
              caging perimeter because current units lack certified cooperative safety systems to work directly
              alongside human warehouse personnel [CU012, CU013]. While Agility achieved an OSHA-recognized NRTL field
              evaluation milestone, formal cooperative safety standards such as ISO 25785 remain years from
              ratification, restricting Digit's addressable footprint to cordoned-off warehouse cells [CU012, CU013].


              Furthermore, customer contract durability faces severe financial scrutiny as Agility transitions to public
              markets [CU014, CU015]. The company has announced more than $300 million in multi-year binding orders for
              its fifth-generation Digit v5 platform [CU014, CU015]. However, deal disclosures reveal that this backlog
              is heavily concentrated in a single 1,000-unit contract with an undisclosed customer, and real revenue
              conversion remains subject to strict performance and safety milestone satisfaction [CU014, CU015]. While
              Agility benchmarks Digit at $30 per hour against loaded human wages and targets long-term operational
              costs of $2 to $3 per hour, current operating costs hover between $10 and $25 per hour [CU003, CU016].
              Until cooperative safety is fully resolved and multi-site replication is demonstrated, Agility faces
              significant risk that enterprise customers will pause fleet expansion as well-capitalized competitors
              introduce rival platforms [CU011, CU012].
            claimRefs:
              - CU001
              - CU003
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Brownfield Workcell Wedge
            body: >-
              Agility's primary commercial success stems from avoiding the trap of general-purpose humanoid promises. By
              restricting Digit to structured tote handling between AMRs and conveyors, Agility delivers immediate
              operational utility in brownfield facilities without requiring customers to re-engineer existing logistics
              infrastructure.
            calloutType: insight
            claimRefs:
              - CU002
              - CU005
              - CU007
          - type: callout
            title: The Segregation Ceiling and Backlog Concentration
            body: >-
              While Agility leads in documented deployments, the requirement for physical workcell caging limits
              intra-facility density. Furthermore, the $300M Digit v5 backlog is heavily tied to a single 1,000-robot
              contract contingent on milestone completion, making near-term revenue conversion highly vulnerable to
              safety and performance delays.
            calloutType: risk
            claimRefs:
