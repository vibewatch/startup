  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Workflows, and Substitution Dynamics
        blocks:
          - type: paragraph
            body: >-
              Agility Robotics defines its initial addressable market around bulk material handling and repetitive tote
              movement in human-engineered warehouse environments rather than consumer humanoid robotics. In 2021, the
              company executed a strategic pivot from research locomotion toward commercial industrial facilities where
              chronic labor turnover creates persistent operational bottlenecks. Digit operates alongside human
              workforces without requiring wholesale facility redesigns, positioning itself as a flexible alternative to
              capital-intensive fixed conveyors and specialized automated storage and retrieval systems. However,
              near-term deployment remains functionally bounded to structured tote transfer and line-side machine
              tending, with fine manipulation and high-speed sortation remaining outside current operational scope.
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM009
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM014
      - number: '2.2'
        title: Multi-Lens Market Sizing and Backlog Analysis
        blocks:
          - type: paragraph
            body: >-
              Market sizing for humanoid robotics requires distinguishing long-term theoretical labor substitution
              forecasts from near-term addressable logistics spend. While broad industry projections estimate the global
              humanoid market expanding from $3 billion in 2025 to nearly $38 billion by 2035, current commercial volume
              remains an extremely modest fraction of total industrial automation expenditure. Agility reports over $300
              million in committed multi-year orders for 1,000 next-generation Digit v5 robots, yet transaction filings
              explicitly clarify that this backlog is tied to an undisclosed customer under milestone-contingent terms
              and does not represent recognized current-period revenue. Industry observers emphasize that early robotics
              contracts typically grant customer cancellation rights, meaning market valuation cannot safely extrapolate
              full backlog value without verified delivery milestones.
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM011
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM008
              - CM011
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM007
              - CM008
              - CM013
              - CM015
      - number: '2.3'
        title: Buyer Segmentation, Commercial Model, and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              Enterprise procurement for humanoid robotics centers on third-party logistics providers, large automotive
              manufacturers, and e-commerce fulfillment hubs facing structural staffing deficits. Agility commercializes
              Digit primarily through a Robot-as-a-Service model priced at $30 per hour, directly benchmarking
              subscription fees against fully loaded human warehouse wages to target customer payback within two years.
              Under this structure, Agility capitalizes robot manufacturing costs upfront while collecting recurring
              service revenue that bundles hardware, Agility Arc fleet software, and maintenance support. While
              management projects robot operating costs declining from $10 to $12 per hour to $2 to $3 per hour at
              scale, public transaction filings concede that long-term RaaS profitability remains unproven and sensitive
              to component durability and contract renewal rates.
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM010
              - CM013
      - number: '2.4'
        title: Growth Drivers, Safety Certification, and Deployment Constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption momentum for humanoid logistics automation is fueled by more than one million unfilled physical
              material-handling roles across North America, coupled with rising enterprise wage pressures. Nevertheless,
              substantial commercial and regulatory barriers govern deployment speed. Early Digit deployments were
              confined to physically fenced workcells, restricting addressable workflows to facilities willing to modify
              floor plans for safety perimeters. Agility’s broader market expansion hinges on Digit v5 securing
              third-party cooperative safety certification under IEC 61508 SIL 3 and ISO 13849 standards to operate
              fenceless beside human personnel. Until independent safety bodies issue final certifications, major pilot
              partners including Amazon are withholding wide-scale operational rollouts, keeping near-term market
              penetration dependent on rigorous regulatory compliance rather than software feature releases.
            claimRefs:
              - CM006
              - CM007
              - CM009
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Fenceless Safety Gating Factor
            body: >-
              The transition from workcell-constrained pilots to multi-facility fleet adoption depends entirely on
              third-party cooperative safety certification under IEC 61508 SIL 3. Without fenceless certification,
              humanoid robots remain confined to specialized perimeters, surrendering their primary value proposition of
              operating in existing human workspaces without facility modifications.
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
          - type: callout
            title: Backlog Durability vs. Recognized Revenue
            body: >-
              Agility's $300 million Digit v5 order book represents committed multi-year RaaS interest but remains
              subject to contractual delivery milestones and customer cancellation rights. Investors must distinguish
              contracted backlog for a developmental robot from recognized GAAP revenue, particularly given unproven
              unit economics and cash burn.
            calloutType: risk
            claimRefs:
              - CM002
              - CM008
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive set extends beyond humanoids
        blocks:
          - type: paragraph
            body: >
              The direct humanoid set visible in the assigned evidence includes Tesla Optimus, Figure AI, Boston
              Dynamics Atlas, and Unitree alongside Agility Digit. These programs differ sharply in commercialization,
              financial backing, intended dexterity, and customer access, so a simple robot-to-robot feature ranking
              would obscure the buyer's actual choice. TechTimes describes Figure as much more highly valued than
              Agility, Boston Dynamics as allocating Atlas output to Hyundai, and Unitree as a lower-price entrant,
              while a March 2026 comparison says Tesla had not yet begun external Optimus sales. Those signals make
              entrant timing and capital resources important, but they are not independent performance benchmarks.
              [CP006] [CP007] [CP008] [CP009]


              The more immediate substitutes are fixed conveyors, autonomous mobile robots, mobile manipulators, and
              process redesign. Anton Robots argues that each can be superior when the job is stable horizontal movement
              or fixed-point manipulation; Agility's own FAQ also frames humanoids against fixed and flexible
              automation, AMRs, and AGVs. Internal build is therefore most credible as systems integration around proven
              automation rather than development of a proprietary humanoid. Digit earns consideration when walking and
              container transfer must bridge existing equipment in a brownfield facility, but it must beat these simpler
              options on accepted throughput and total deployment cost. [CP014] [CP016]
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP014
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP009
              - CP014
      - number: '3.2'
        title: Commercial proof is real but workflow-bounded
        blocks:
          - type: paragraph
            body: >
              Agility's strongest comparative evidence is operational rather than speculative. The company says Digit
              and Arc have accumulated 65,000 hours of real production experience, and TechTimes repeats more than
              65,000 hours at customer facilities. The independent buyer review is more qualified: the best-supported
              use case is repetitive tote and material transfer, the current public specification is a 35-pound carrying
              capacity with four hours of battery life, and a full-shift deployment requires charging, swapping, or
              fleet redundancy. This supports a readiness advantage for defined logistics workflows, not a claim that
              Digit can replace general labor. [CP001] [CP002] [CP003]


              Trust and safety remain a gating comparison. Anton Robots and TechTimes both state that current
              deployments use separated operating areas, while Digit v5 is designed to remove that constraint through
              cooperative-safety architecture. That distinction matters because a future design objective cannot be
              credited as a deployed capability. Tesla's broader dexterity thesis may create a larger task envelope, but
              the assigned comparison also says Optimus was not in material factory use in early 2026 and had not begun
              external sales by March. Buyers should therefore compare validated task success, intervention rates, and
              site approval for the exact hardware generation rather than demonstrations or roadmap breadth. [CP008]
              [CP009] [CP010] [CP011]
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP009
              - CP014
              - CP015
      - number: '3.3'
        title: Enterprise integration defines the sales motion
        blocks:
          - type: paragraph
            body: >
              Public pricing is not sufficiently transparent for a reliable head-to-head cost model. Anton Robots says
              Agility publishes neither a universal 2026 list price nor a monthly RaaS rate, although it describes RaaS
              and CapEx pathways. RoboZaps estimates Digit RaaS at $2,000-$4,000 per month, but labels the amount as an
              estimate; it is not disclosed contract pricing. A separate paywalled newsletter claims a 98% task-success
              rate and $10-$12 hourly operating cost after 18 months at Amazon's Sumner facility, yet the accessible
              page provides no visible methodology or denominator beyond that headline. These figures are diligence
              leads, not underwriting inputs. [CP004] [CP005] [CP015]


              The route to market is correspondingly consultative. Dataford's interview guide describes account
              executives securing pilots and full-scale deployments, partnering with solutions engineers on site
              assessments, negotiating contracts, and handing implementation to post-sales teams. That is consistent
              with a product whose value depends on workflow design, safety approval, integrations, and ongoing service
              rather than an off-the-shelf hardware sale. The motion can deepen customer relationships, but long
              deployments and custom qualification also give established automation vendors time to defend accounts and
              make sales efficiency sensitive to pilot conversion. [CP013]
            claimRefs:
              - CP004
              - CP005
              - CP013
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP005
              - CP009
              - CP014
              - CP015
      - number: '3.4'
        title: The moat is deployment learning plus orchestration, not category ownership
        blocks:
          - type: paragraph
            body: >
              Arc may create switching friction because it runs fleets and connects workflows to warehouse and
              manufacturing systems, while physical deployments require process mapping, safety controls, and
              operational training. Those integrations can make replacement costly, but they also create vendor and
              cloud dependency; customers can multi-home by retaining AMRs, conveyors, and fixed cells for tasks where
              humanoid mobility is unnecessary. Agility's defensible wedge is thus a specific automation gap between
              existing systems, not exclusive ownership of a warehouse stack. [CP012] [CP014]


              Agility's careers page says the company created the category, but that is company positioning rather than
              independent moat evidence. The durability test is whether operational data and deployment practice improve
              reliability faster than rivals gain manufacturing scale, dexterity, or price advantage. Figure's reported
              valuation signals access to capital, Tesla's internal platform signals potential scale, and Unitree's
              lower-price positioning signals commoditization pressure. Meanwhile, Digit's v5 transition must prove
              cooperative safety without borrowing the prior generation's deployment record. The current lead is
              meaningful, but it remains vulnerable until buyers disclose repeatable economics, intervention rates,
              renewal behavior, and multi-site expansion. [CP007] [CP011] [CP016]
            claimRefs:
              - CP007
              - CP011
              - CP012
              - CP014
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not underwrite headline economics
            body: >-
              The assigned pool contains a $2,000-$4,000 monthly RaaS estimate and a paywalled claim of 98% task success
              at $10-$12 per hour, but no disclosed contract, utilization denominator, intervention log, or visible
              methodology. These figures should frame diligence requests, not a return model.
            calloutType: risk
            claimRefs:
              - CP004
              - CP005
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing
        blocks:
          - type: paragraph
            body: >-
              Agility offers Digit through Robots-as-a-Service (RaaS) and direct ownership. The reported RaaS schedule
              is about $8,500 per month plus a $25,000 deployment fee and includes access to the robot, software, and
              maintenance; management's five-year illustration produces $535,000 of revenue per robot. The
              direct-purchase schedule is about $200,000 upfront, a $20,000 deployment fee, and roughly $36,000 annually
              for software and maintenance, or $400,000 over five years. These are disclosed schedules, not evidence of
              realized average selling price, recognized revenue mix, renewal rates, or gross margin. Arc provides a
              recurring software and fleet-management layer, but the public evidence does not separate Arc revenue from
              hardware or service revenue.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI015
              - CI016
