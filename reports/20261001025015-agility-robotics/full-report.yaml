              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Transition to Cooperative Safety as Commercial Bottleneck Resolver
            body: >-
              The departure from caged robotic cells to barrier-free human-robot collaboration via the NVIDIA Halos
              architecture represents Agility's core technical lever for warehouse density and workflow adoption.
            calloutType: insight
            claimRefs:
