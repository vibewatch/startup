              - CE014
      - number: '5.4'
        title: Fleet Orchestration, Industrial Networking, and Enterprise Integration
        blocks:
          - type: paragraph
            body: >-
              Multi-robot facility execution is orchestrated by Agility Arc, a centralized cloud platform managing fleet
              deployment, operational health, and workflow coordination. Arc interfaces directly with customer Warehouse
              Management Systems (WMS), Warehouse Execution Systems (WES), and Manufacturing Execution Systems (MES) to
              coordinate task handoffs between Digit and legacy autonomous mobile robots (AMRs) or conveyor belts. To
              ensure robust communications within RF-dense warehouses with metal racking and dynamic signal shadowing,
              Digit integrates Doodle Labs RM-1700 Mesh Rider dual-band radios. These radios leverage 900 MHz for
              non-line-of-sight penetration and 2.4 GHz for high-bandwidth telemetry, maintaining sub-10 millisecond
              command latency. Security controls incorporate mutual TLS (mTLS) and TLS 1.2+ encryption rooted to private
              certificate authorities for all cloud transit, customer data segregation, and AES hardware encryption for
              on-robot storage at rest.
            claimRefs:
              - CE013
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
              - CE010
