  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Deployment Archetype
        blocks:
          - type: paragraph
            body: >-
              Agility Robotics has organized its commercial traction around a focused operational beachhead: structured
              bulk material handling within human-built logistics and manufacturing facilities [CU001, CU005]. Rather
              than pursuing general-purpose dexterity across open-ended manipulation tasks, Agility targets
              high-turnover repetitive roles where enterprise labor shortages are most severe, specifically tote and bin
              transfer, conveyor induction, and automated mobile robot (AMR) interface loading [CU002, CU005]. This
              focus defines the primary buyer profile across enterprise third-party logistics providers, large-scale
              automotive manufacturing plants, and e-commerce distribution networks [CU001, CU006]. The primary economic
              decision-maker in these enterprise accounts is typically the vice president of supply chain automation,
              operations engineering, or plant logistics, who evaluates Digit primarily on hourly operational cost and
              labor displacement efficiency rather than theoretical robotic flexibility [CU003, CU006].


              The company delivers Digit predominantly via a Robot-as-a-Service (RaaS) subscription model, which bundles
              the physical humanoid hardware, safety workcell boundaries, Agility Arc fleet management software,
              maintenance, and over-the-air updates into a monthly operating expenditure [CU003, CU007]. While direct
              hardware purchases are supported through commercial partnerships such as Ricoh USA, enterprise buyers
              strongly prefer the RaaS structure because it transfers hardware depreciation and technological
              obsolescence risks back to Agility while eliminating major upfront capital budget hurdles [CU003, CU007].
              By structuring adoption around structured workcells, Agility preserves its core commercial value
              proposition of zero structural facility modifications, enabling enterprise customers to insert Digit into
              existing brownfield facilities alongside conveyors and mobile equipment without tearing up operational
              floors [CU002, CU005].
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU006
              - CU007
