  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Enterprise adoption progression from structured workcell pilots to multi-unit site expansion and future
      unsegregated fleet integration.
    data:
      items:
        - label: Assessment
          title: Discovery & Workflow Mapping
          phase: 'Stage 1: Assessment'
          touchpoints:
            - Facility assessment of brownfield material handling bottlenecks
            - Selection of bounded tote/bin transport workflows
          details: >-
            Agility evaluates facility cadence, conveyor heights, and AMR compatibility to define brownfield deployment
            scope.
          tone: neutral
        - label: Integration
          title: Hardware Integration & Workcell Setup
          phase: 'Stage 2: Integration'
          touchpoints:
            - Physical boundary definition and safety perimeter installation
            - Integration of Agility Arc software with facility WMS and WES
          details: >-
            Workcell setup standardizes pick-and-place pickup locations and establishes conveyor handoff mechanics
            without brownfield alterations.
          tone: neutral
        - label: Validation
          title: Segregated Workcell Pilot
          phase: 'Stage 3: Validation'
          touchpoints:
            - Deployment of 1-3 Digit units inside cordoned safety cell
            - Continuous testing of autonomous docking and cycle reliability
          details: Rigorous 6-12 month evaluation of pick-and-place uptime, autonomous docking, and error recovery.
          tone: positive
        - label: Initial Scale
          title: Intra-Site Commercial RaaS
          phase: 'Stage 4: Initial Scale'
          touchpoints:
            - Conversion to multi-year RaaS subscription ($250k unit basis)
            - Expansion to 7-10 robots within initial facility
          details: Achieved by GXO and Toyota Canada, establishing repeatable multi-shift operational throughput.
          tone: positive
        - label: Unsegregated Operation
          title: Cooperative Safety Transition
          phase: 'Stage 5: Cooperative Safety'
          touchpoints:
            - Field inspection under OSHA-recognized NRTL standards
            - Transition to barrier-free Digit v5 work zones
          details: >-
            Removes physical caging perimeters to enable Digit to operate in shared human-occupied aisles and staging
            zones.
          tone: warning
        - label: Fleet Rollout
          title: Network Fleet Expansion
          phase: 'Stage 6: Multi-Site Horizon'
          touchpoints:
            - Multi-site contract execution across regional distribution centers
            - Centralized fleet orchestration via Agility Arc
          details: >-
            Dependent on ISO 25785 and OSHA cooperative safety certification to remove safety barriers and unlock full
            $300M+ backlog.
          tone: warning
    approximationNotes: Journey stages modeled on documented customer paths at Toyota Canada and GXO Logistics.
