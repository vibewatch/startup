      - "CR008"
  - calloutType: "risk"
    title: "Backlog Concentration and Related-Party Counterparty Risk"
    body: "Over 80% of Agility's forward commercial pipeline relies on a single undisclosed customer contract for 1,000 Digit v5 robots, while 63.5% of audited 2025 revenue stemmed from related-party transactions. This dual concentration leaves Agility exceptionally vulnerable to partner-level capital allocation shifts or missed deployment milestones."
