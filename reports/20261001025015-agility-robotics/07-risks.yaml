    title: "Fenceless Safety Certification is the Core Commercial Gate"
    body: "Agility Robotics cannot convert its early market engagement into high-volume warehouse adoption without obtaining independent third-party functional safety certification under IEC 61508 SIL 3 and ISO 13849. Pre-assessment in NVIDIA's Halos Inspection Lab provides engineering validation but confers no regulatory authorization to operate fenceless beside humans in OSHA-regulated facilities."
    claimRefs:
