chapter:
  number: 7
  title: "Risks"
  summary: "Agility Robotics faces severe commercialization, safety, and liquidity gating factors despite its early commercial deployment lead. The company incurred a $138.1 million net loss in 2025 with gross margins of negative 151% and substantial-doubt going-concern warnings, relying on a proposed $2.5 billion SPAC merger and SAFE financing to bridge cash burn. Its headline $300 million order book is heavily concentrated in a single 1,000-robot customer agreement, while fenceless operational scaling in human-occupied facilities remains gated by third-party cooperative safety certification under IEC 61508 SIL 3 and ISO 13849."
sections:
  - id: "executive-risk-taxonomy"
    title: "Executive Risk Taxonomy and Threat Ranking"
    body: "Agility Robotics presents a high-risk profile characterized by an acute divergence between operational engineering progress and financial sustainability. While the company has demonstrated first-mover leadership by logging over 65,000 commercial operating hours across customer logistics facilities, its financial architecture remains highly fragile. Agility faces four interlocking threat vectors that determine its survival over the next 12 to 24 months: liquidity burn under an unproven Robots-as-a-Service model, severe customer backlog concentration, unresolved cooperative safety certification, and transaction execution risks surrounding its proposed SPAC merger. In its 2026 SEC filings, Agility's independent auditor issued an explicit going-concern warning, noting that the company has never generated positive cash flow and incurred a $138.1 million net loss in 2025. Although management secured $100 million in SAFE notes in July 2026, the company consumed $99.8 million in operating cash in 2025 alone, illustrating that liquidity is entirely contingent on successfully closing the Churchill Capital Corp XI transaction and accessing the anticipated $620 million in proceeds. If capital market conditions delay or derail the merger, Agility's operational runway will rapidly compress."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR011"
    figureRefs:
      - "FR001"
  - id: "regulatory-and-safety-compliance"
    title: "Regulatory Barriers, Cooperative Safety Certification, and S-4 Scrutiny"
    body: "The gating technological milestone for Agility's commercial expansion is achieving third-party industrial safety certification for fenceless operation. Previous iterations of Digit, including the commercially deployed Digit v4, operated exclusively inside physically segregated workcells to protect human personnel from mechanical collisions. However, Agility's core market thesis—servicing existing brownfield warehouse facilities designed for human workers—requires Digit v5 to operate collaboratively without protective fencing. Under U.S. OSHA workplace standards and international robotic safety frameworks, this requires formal certification under IEC 61508 Functional Safety (Safety Integrity Level 3), ISO 13849, and ISO/IEC TR 5469. While Agility partnered with NVIDIA to pre-assess Digit v5 within the Halos AI Systems Inspection Lab, this laboratory pre-assessment does not substitute for third-party accredited certification. Until an independent safety authority grants final certification, Digit v5 cannot be legally deployed fenceless in OSHA-regulated customer facilities. Concurrently, public market execution hinges on regulatory clearance of Churchill Capital Corp XI's Form S-4 registration statement, which saw an amendment (S-4/A) filed on September 30, 2026. Any prolonged SEC review or safety testing failure threatens to delay the shareholder vote and prolong financing vulnerability."
    claimRefs:
      - "CR007"
      - "CR008"
      - "CR009"
    tableRefs:
      - "TR001"
  - id: "operational-manufacturing-reliability"
    title: "Operational Scalability, RoboFab Ramp, and Deployment Reliability"
    body: "Agility's transition from low-volume prototype fabrication to serial manufacturing introduces formidable execution risks at its RoboFab plant in Salem, Oregon. Although the factory boasts a theoretical design capacity of 10,000 humanoid robots annually, Agility has never operated the facility at commercial scale. Serial humanoid production involves complex supply chain coordination across custom actuators, high-torque joint motors, specialized harmonic drives, and integrated sensor pods. Scaling production requires maintaining high first-pass assembly yields while driving bill-of-materials costs down from approximately $150,000 per robot at launch toward target thresholds of $75,000 at 1,000 units and $30,000 at volume. Furthermore, the company's Robots-as-a-Service commercial structure magnifies manufacturing risks by requiring Agility to fully capitalize the hardware upfront, recovering cash gradually over three- to five-year customer contracts. In September 2026, Agility announced that Digit v5 early customer access would shift to the first half of 2027 with general availability targeted for late 2027, highlighting delivery timeline pressures. Crucially, field reliability metrics—such as mean time between failures, component wear rates, and field technician intervention hours—remain undisclosed, leaving long-term maintenance margins unverified."
    claimRefs:
      - "CR010"
      - "CR012"
      - "CR013"
      - "CR015"
    tableRefs:
      - "TR002"
  - id: "partner-customer-financial-dependencies"
    title: "Customer Concentration, Related-Party Exposure, and Capital Burn"
    body: "Agility's revenue trajectory reveals severe counterparty and customer concentration that undermines the stability of its forward projections. In 2025, audited financial statements showed revenue of approximately $1.8 million with a gross margin of negative 151%. Remarkably, related-party commercial partners accounted for 63.5% of total 2025 sales, demonstrating that external commercial adoption across arms-length enterprise accounts remains in its infancy. Furthermore, Agility's widely cited $300 million multi-year order book is largely non-diversified: it is anchored by a single three-year contract for 1,000 Digit v5 units with an undisclosed customer, contingent on meeting stringent technical and deployment milestones. In May 2026, Agility entered into a related-party agreement providing 453 warrants per robot unit if the counterparty deploys at least 1,000 units, introducing substantial equity dilution and accounting uncertainty. Simultaneously, Agility faces escalating competition from well-capitalized rivals, notably Figure AI (valued at $39 billion) and Tesla Optimus, who possess vastly superior capital reserves, manufacturing infrastructure, and proprietary AI compute clusters. Without expanding its paying customer base beyond initial pilot partners and executing milestone deliveries, Agility risks acute margin compression and revenue stagnation."
    claimRefs:
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR014"
    tableRefs:
      - "TR003"
