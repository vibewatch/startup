company:
  name: "Agility Robotics"
chapter:
  number: 6
  title: "Customers"
  summary: "Agility Robotics holds a unique first-mover position as the only humanoid robotics company with paying enterprise customers deployed in live commercial operations, including GXO Logistics, Toyota Motor Manufacturing Canada, and Mercado Libre under a Robot-as-a-Service model. However, adoption remains concentrated in single-facility tote-handling workcells rather than network-wide multi-site fleets, and long-term customer economics remain sensitive to cooperative safety certification and unproven unit payback targets."
sections:
  - id: "customer-segmentation-and-commercial-archetype"
    title: "Customer Base Segmentation and Deployment Archetype"
    body: "Agility Robotics has organized its commercial traction around a focused operational beachhead: structured bulk material handling within human-built logistics and manufacturing facilities [CU001, CU005]. Rather than pursuing general-purpose dexterity across open-ended manipulation tasks, Agility targets high-turnover repetitive roles where enterprise labor shortages are most severe, specifically tote and bin transfer, conveyor induction, and automated mobile robot (AMR) interface loading [CU002, CU005]. This focus defines the primary buyer profile across enterprise third-party logistics providers, large-scale automotive manufacturing plants, and e-commerce distribution networks [CU001, CU006]. The primary economic decision-maker in these enterprise accounts is typically the vice president of supply chain automation, operations engineering, or plant logistics, who evaluates Digit primarily on hourly operational cost and labor displacement efficiency rather than theoretical robotic flexibility [CU003, CU006].\n\nThe company delivers Digit predominantly via a Robot-as-a-Service (RaaS) subscription model, which bundles the physical humanoid hardware, safety workcell boundaries, Agility Arc fleet management software, maintenance, and over-the-air updates into a monthly operating expenditure [CU003, CU007]. While direct hardware purchases are supported through commercial partnerships such as Ricoh USA, enterprise buyers strongly prefer the RaaS structure because it transfers hardware depreciation and technological obsolescence risks back to Agility while eliminating major upfront capital budget hurdles [CU003, CU007]. By structuring adoption around structured workcells, Agility preserves its core commercial value proposition of zero structural facility modifications, enabling enterprise customers to insert Digit into existing brownfield facilities alongside conveyors and mobile equipment without tearing up operational floors [CU002, CU005]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU005"
      - "CU006"
      - "CU007"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "production-proof-and-named-customer-evidence"
    title: "Named Customer Deployments and Operational Track Record"
    body: "Agility's public commercial differentiation rests on verified production deployments at marquee industrial accounts [CU001, CU008]. At GXO Logistics' facility supporting Spanx in Flowery Branch, Georgia, Digit has operated continuously across multiple shifts unloading autonomous mobile robots and feeding facility conveyors, accumulating over 100,000 commercial tote cycles since deployment in June 2024 [CU001, CU002]. This operational run represents the longest documented commercial deployment of a bipedal humanoid robot in enterprise logistics history, providing critical validation of real-world endurance in active warehouse environments [CU001, CU004]. Across its total customer base of nine operating facilities, Agility has logged more than 65,000 cumulative operational runtime hours [CU004, CU008].\n\nIn automotive manufacturing, Toyota Motor Manufacturing Canada (TMMC) conducted an extensive year-long pilot evaluating three Digit units across three testing phases at its Woodstock, Ontario assembly plant [CU006, CU008]. Following validation in production parts replenishment and tugger loading for RAV4 assembly, TMMC signed a formal commercial RaaS agreement in February 2026 to expand the deployment to seven to ten Digit robots [CU006, CU008]. Similarly, Latin American e-commerce giant Mercado Libre signed a commercial contract in December 2025 to deploy Digit for fulfillment operations at its San Antonio, Texas facility [CU009]. Although strategic backer Amazon completed initial logistics pilots at its Sumner, Washington innovation site, ongoing commercial scaling with Amazon remains contingent on next-generation safety milestones rather than active fleet expansion [CU010]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
      - "CU006"
      - "CU008"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "durability-expansion-and-concentration-vulnerabilities"
    title: "Expansion Trajectory, Safety Bottlenecks, and Concentration Risks"
    body: "Despite substantial first-mover achievements, Agility's customer trajectory exhibits pronounced operational concentration and adoption friction [CU011, CU012]. To date, confirmed customer relationships remain single-facility beachheads; neither GXO, Toyota, nor Mercado Libre has transitioned from localized workcell deployments to multi-site network rollouts [CU001, CU011]. Commercial expansion is physically constrained by current safety regulations: every deployed Digit must operate inside a segregated zone or caging perimeter because current units lack certified cooperative safety systems to work directly alongside human warehouse personnel [CU012, CU013]. While Agility achieved an OSHA-recognized NRTL field evaluation milestone, formal cooperative safety standards such as ISO 25785 remain years from ratification, restricting Digit's addressable footprint to cordoned-off warehouse cells [CU012, CU013].\n\nFurthermore, customer contract durability faces severe financial scrutiny as Agility transitions to public markets [CU014, CU015]. The company has announced more than $300 million in multi-year binding orders for its fifth-generation Digit v5 platform [CU014, CU015]. However, deal disclosures reveal that this backlog is heavily concentrated in a single 1,000-unit contract with an undisclosed customer, and real revenue conversion remains subject to strict performance and safety milestone satisfaction [CU014, CU015]. While Agility benchmarks Digit at $30 per hour against loaded human wages and targets long-term operational costs of $2 to $3 per hour, current operating costs hover between $10 and $25 per hour [CU003, CU016]. Until cooperative safety is fully resolved and multi-site replication is demonstrated, Agility faces significant risk that enterprise customers will pause fleet expansion as well-capitalized competitors introduce rival platforms [CU011, CU012]."
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
