callouts:
  - calloutType: "insight"
    title: "The Brownfield Workcell Wedge"
    body: "Agility's primary commercial success stems from avoiding the trap of general-purpose humanoid promises. By restricting Digit to structured tote handling between AMRs and conveyors, Agility delivers immediate operational utility in brownfield facilities without requiring customers to re-engineer existing logistics infrastructure."
    claimRefs:
      - "CU002"
      - "CU005"
      - "CU007"
  - calloutType: "risk"
    title: "The Segregation Ceiling and Backlog Concentration"
    body: "While Agility leads in documented deployments, the requirement for physical workcell caging limits intra-facility density. Furthermore, the $300M Digit v5 backlog is heavily tied to a single 1,000-robot contract contingent on milestone completion, making near-term revenue conversion highly vulnerable to safety and performance delays."
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
