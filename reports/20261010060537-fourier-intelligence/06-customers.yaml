company:
  name: "Fourier Intelligence"
chapter:
  number: 6
  title: "Customers"
  summary: "Fourier Intelligence operates a bifurcated commercial customer base anchored by its mature Fourier Rehab installed footprint of over 2,000 hospitals and clinical institutions across 40 countries, while its embodied humanoid programs (GR-1, GR-2, and GR-3) remain in pilot, academic research, and early ecosystem trial stages. While clinical partnerships with institutions such as Singapore's National Healthcare Group and Nagoya University provide validation, payer reimbursement pathways, commercial contract values, customer concentration, and paid humanoid fleet retention remain undisclosed."
sections:
  - id: "customer-segmentation-and-commercial-structure"
    title: "Institutional Healthcare Foundation vs. Emerging Embodied AI Piloting"
    body: "Fourier Intelligence's commercial revenue and customer relationships divide sharply between its mature clinical rehabilitation business and its emerging humanoid robotics operations. Under the Fourier Rehab brand, the company serves more than 2,000 healthcare institutions, rehabilitation centers, and specialized therapy clinics spanning over 40 countries and regions. The economic buyers within this primary segment are hospital procurement directors, rehabilitation clinic administrators, and clinical research department heads seeking robotic automation to alleviate therapist shortages in neurological, orthopedic, and post-stroke physical recovery. In contrast, Fourier's general-purpose humanoid robotics division targets a speculative mix of university research laboratories, embodied AI developers, and institutional eldercare providers. These newer customer engagements remain pre-commercial or exploratory, relying on demonstration units and evaluation pilots rather than multi-year recurring SaaS or equipment service contracts."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-deployment-scale"
    title: "Clinical Installed Base Trajectory and Humanoid Delivery Status"
    body: "Fourier's historical customer adoption trajectory began in 2015 with lower-limb rehabilitation exoskeletons, scaling through upper-limb therapy robots like the ArmMotus series and integrated clinic installations termed RehabHub. Independent industry registries document that Fourier's overall organizational stage sits at pilot delivery for its broader general-purpose humanoid systems, having progressed from the GR-1 release in 2023 to the GR-2 in 2024 and GR-3 demonstrations in 2025 and 2026. While the company reports over 2,000 clinical organizational deployments globally, tracking databases record zero disclosed recurring annual contract values, customer retention rates, or unit volume distributions across geographic territories. The adoption curve for the humanoid portfolio remains in developer-access and research-bench phases, where units are placed with university consortia and technical partners rather than driving high-volume enterprise rollouts."
    claimRefs:
      - "CU002"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-customer-evidence-and-ecosystem-partnerships"
    title: "Institutional Collaborations, Clinical Validation, and Ecosystem Ties"
    body: "Publicly verifiable customer deployments and strategic technical collaborations are concentrated in research and academic healthcare networks. In May 2026, Fourier formalized strategic agreements with Singapore's National Healthcare Group (NHG Health) and Japan's Nagoya University during the Global Summit on Rehabilitation and Assistive Technology. The partnership with NHG Health builds on joint work initiated in 2021, including a September 2025 clinical initiative with health startup injewelme evaluating GRx humanoids for contactless vital sign monitoring via remote photoplethysmography. At Nagoya University, Fourier's ArmMotus EMU upper-limb rehabilitation robot is deployed for clinical muscle synergy analysis. Beyond clinical trials, Fourier's 2026 'Technology + Ecosystem' initiative engages hardware and integration partners such as Singularity Intelligent Control, Shenzhen Yita Power Technology, Yihang Lingguang, and Shanghai Runke Juneng to test embodied AI models and industrial payloads. However, these technology showcases and joint research centers have not demonstrated enterprise-wide software subscription revenues or commercial production SLAs."
    claimRefs:
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
    tableRefs:
      - "TU003"
  - id: "customer-retention-procurement-and-concentration-risks"
    title: "Procurement Friction, Payer Dependency, and Commercial Opacity"
    body: "Evaluating the durability of Fourier's customer relationships reveals material institutional risks. Hospital and clinical procurement cycles for capital-intensive rehabilitation hardware typically require 9 to 18 months, subject to regional medical device certifications, hospital tender laws, and variable healthcare reimbursement schedules across municipal markets in China, Southeast Asia, and Europe. Third-party industry analyses explicitly highlight that Fourier has not demonstrated repeatable procurement economics, customer retention rates, net revenue retention (NRR), or maintenance contract renewal margins for humanoid deployments. Furthermore, because humanoid implementations in eldercare and hospital assistance interface directly with vulnerable populations, safety liability protocols, staff training burdens, and regulatory clearances introduce steep friction that prevents pilot projects from converting into permanent, multi-unit enterprise contracts. Lacking disclosed top-customer revenue concentration figures or distributor terms, Fourier's commercial base remains exposed to public healthcare capital expenditure budget volatility."
    claimRefs:
      - "CU004"
      - "CU007"
      - "CU015"
      - "CU016"
callouts:
  - calloutType: "insight"
    title: "Dual-Market Customer Bifurcation"
    body: "Fourier's commercial defensibility rests almost entirely on clinical institutional relationships built over a decade by Fourier Rehab, creating an installed base of 2,000+ facilities that prospective humanoid competitors cannot easily match. However, transferring these healthcare buyer relationships into paid humanoid adoption remains unproven, as hospital therapy budgets and IT/assistive robotics pilots operate under separate capital allocation committees."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
  - calloutType: "risk"
    title: "Unverified Humanoid Unit Economics and Pilot Stagnation"
    body: "Despite high-profile demonstrations of the GR-3 humanoid at WAIC 2026, WRC 2026, and CES 2026, public evidence confirms zero multi-unit commercial production deployments or recurring maintenance contracts in home care or eldercare. Fourier's humanoid customer traction remains confined to academic research grants, joint clinical testbeds, and hardware ecosystem co-development."
    claimRefs:
      - "CU005"
      - "CU008"
      - "CU013"
      - "CU015"
