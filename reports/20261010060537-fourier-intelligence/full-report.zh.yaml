      - number: '1.3'
        title: 资本结构与运营规模
        blocks:
          - type: paragraph
            body: >-
              公开规模数据差异过大，不能直接合并。Tracxn 报告七轮融资共筹得 $83 million；RobotHub 则报告 $229 million，并列出 2025 年 1 月 $114 million 的
              Series E 以及 2025 年 8 月 $43 million 的 Series E+。RobotHub 还将 $1.1 billion 的估值归于 2025 年 8
              月这轮融资。这些是第三方数据库数据，并非经审计的公司披露；指定证据无法用汇率转换、一级与二级资金所得或轮次命名来解释差距。规模数据也同样需要谨慎：独立资料重复了源自公司的“覆盖 40 多个国家、超过 2,000
              家机构和医院”说法，而 UpMarket 称其拥有超过 1,000 家机构医疗客户。Tracxn 报告截至 2026 年 5 月下旬有 48 名员工，但 Humanoid Index 报告截至 2026 年 2
              月有 800 多名员工。差异可能来自实体、业务单元或统计口径不同，但没有来源建立共同分母。收入、利润率、现金、现金 runway、客户集中度和付费 humanoid 部署情况，在指定资料中均未披露。
            claimRefs:
