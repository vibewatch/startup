  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、支出分类与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              评估 Fourier Intelligence，首先要把已建立的康复机器人业务与较新的具身 AI humanoid 项目清楚分开。在临床康复领域，可服务支出包括上下肢机器人治疗设备、外骨骼步态训练器，以及
              RehabHub 这类互联临床治疗管理软件。这一临床边界不包括非机器人矫形器、通用患者监护硬件和机器人手术系统。在核心领域，Fourier
              面对的是传统物理治疗方案、手动被动训练设备和既有康复机器人厂商。相反，Fourier 的 humanoid 项目以 GR-1、GR-2 和最近公布的 GR-3
              平台为支点，瞄准护理辅助、机构陪护和轻工业支持这一愿景型市场。这个次级细分市场试图缓解养老护理和医院病区的护理人员短缺，但必须面对专用医疗推车、固定式自动化设备和人工员工等现状替代方案。把两类运营业务混为一谈会掩盖商业现实：Fourier
              Rehab 是一家拥有监管许可、覆盖 40 个国家 2,000 家机构的成熟医疗设备供应商，而 humanoid 业务仍是寻找首个经验证付费客户部署的研发项目。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM010
      - number: '2.2'
        title: 康复与具身护理的可服务市场规模
        blocks:
          - type: paragraph
            body: >-
              衡量 Fourier 的可服务机会需要采用不同视角，不能只依赖一个宽泛的总可服务市场估计。全球医疗康复机器人市场规模约为 $2.5 billion 至 $3.8
              billion，是一个已形成的可服务市场，受卒中后护理需求和东亚、欧洲、北美人口老龄化推动，年增速约 18.5%。在这一范围内，Fourier
              的可服务市场集中在机构神经康复和物理治疗诊所，其自研柔性执行器和治疗设备对应住院及门诊的专项预算。相比之下，通用专业服务机器人市场估计为 $28.0 billion 至 $35.0
              billion，但其中绝大部分由仓储自动导引车和商业清洁机器人构成，而非 humanoid 形态。市场推广者经常引用中国国家 humanoid 政策目标，预测具身 AI 市场超过 RMB 20
              billion；但这些预测把国家补贴和推测性的制造部署加总在一起，并不等于经验证的商业收入。关键在于，虽然第三方估计 GR-2 等平台的标价为 $100,000 至 $150,000，公开证据确认 Fourier
              的 humanoid 设备没有付费客户。因而对 Fourier 进行投资判断时，应以可验证的康复设备市场份额作为近期估值锚点，把 humanoid 市场规模视为尚未验证的看涨期权。
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM011
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM008
              - CM011
              - CM013
              - CM014
      - number: '2.3'
        title: 机构买家、用户与支付方动态
        blocks:
          - type: paragraph
            body: >-
              Fourier
              的产品在不同客户群中的采购逻辑差异很大。在核心康复设备领域，买家通常是医院采购委员会或康复科负责人，日常使用者则是物理治疗师、康复医师和康复中的患者。支付方依靠国家医保、工伤赔偿基金或私人医疗保险，报销明确的物理治疗代码。马来西亚
              Sultan Nazrin Shah PERKESO 康复中心部署了数百万林吉特的设备，正是这种机构采购模式的例子：一家主权社会保障组织为一座占地 55 英亩、设计治疗能力达 700 名患者的设施采购
              Fourier 设备。这里的采用触发点是可验证的患者吞吐量、治疗师生产率提升和客观康复追踪。相反，在新兴的养老护理与陪护 humanoid
              市场，潜在买家是辅助生活运营商、市政养老院和研究医院。这些买家面对完全不同的预算约束，资金来自一般运营利润或研究创新拨款，而不是成熟的临床保险计费代码。在缺乏标准化报销或有记录的劳动力替代指标时，护理机构中的
              humanoid 采用仍局限于探索性试点和宣传展示。
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM007
              - CM012
      - number: '2.4'
        title: 商业催化剂与结构性部署瓶颈
        blocks:
          - type: paragraph
            body: >-
              Fourier 技术的采用受到强劲宏观力量推动，却被严格的运营约束拖慢。东亚和欧洲人口老龄化加速、全球合格物理治疗师严重短缺，以及推动中国具身 AI 的有利产业政策，都在支持增长。Fourier
              的双市场定位试图利用其临床康复积累、治疗师工作流关系和人机身体交互经验，加快护理 humanoid 的接受度。然而，面向患者的 humanoid
              应用仍面临严峻约束。临床环境要求严格的医疗设备安全标准和感染控制，并且人体与机器人接触的法律责任框架尚未解决。此外，包括每次充电续航三小时和未经验证的连续热插拔运行说法在内的硬件局限，妨碍其自主承担医院病区
              24/7 工作。尽管与新加坡 NHG Health、日本名古屋大学等机构的合作建立了研究对话，但它们并没有弥合自主商业部署的差距。在 Fourier 证明临床结果更优、并在生产环境中实现可衡量的经济回报之前，护理
              humanoid 的采用会遭遇严重的机构阻力。
            claimRefs:
              - CM007
              - CM008
              - CM010
              - CM012
              - CM013
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 双业务估值难题
            body: >-
              对 Fourier Intelligence 做投资判断，必须严格区分其商业化康复业务与 humanoid 研发项目。康复业务已在 2,000 多家临床机构实现真正的国际规模，但拿这份覆盖基础为 humanoid
              商业化背书，就等于假设医院采购周期和医疗设备监管路径同样适用于自主双足系统；这两点目前都尚未得到验证。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM013
          - type: callout
            title: 自主护理部署周期
            body: >-
              自主 humanoid 机器人的机构医疗采购面临漫长的验证门槛。即使 Fourier 已与新加坡 NHG Health、日本名古屋大学等顶尖机构签署研究协议，转化为产生收入的临床部署仍需多年，这让 Fourier
              面临资金充足的机器人同行实现技术跃迁的竞争风险。
            calloutType: risk
            claimRefs:
              - CM007
              - CM008
              - CM012
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与品类分层
        blocks:
          - type: paragraph
            body: >-
              Fourier Intelligence 周围的竞争格局分为两类：一边是既有康复和外骨骼厂商，另一边是新兴通用 humanoid 机器人平台。Otto Bock、Cyberdyne 和 Wandercraft
              等传统医疗同行专注于矫形、行动辅助和临床物理治疗，享有成熟的医院采购渠道和医疗设备监管许可。相比之下，Figure、Agility Robotics、1X Technologies 和 Apptronik 等知名
              humanoid 开发商正在为工业自动化、汽车装配和物流搬运优化双足机器人。Fourier 处于少见的中间位置：它依托成熟的机构医疗存在，同时通过 2024 年将公司拆分为 Fourier 与 Fourier
              Rehab 两个部门，延伸到双足 humanoid。这样的双重定位使 Fourier 在 Tracxn 跟踪的 158 家活跃机器人竞争者中排名第 19，累计融资排名第 3，仅次于规模更大的工业集团。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: 技术规格与临床差异化
        blocks:
          - type: paragraph
            body: >-
              Fourier 的技术差异化直接源于康复机器人积累，而非通用 humanoid 行走能力。临床治疗机器人需要高保真力反馈、柔顺的身体交互，以及在脆弱患者周围的绝对安全；Fourier 在
              ArmMotus、ExoMotus 和 CycleMotus 治疗产品线中积累了这些能力。它们被转化到 GR humanoid 系列，尤其是 GR-2：该型号具备 53 个自由度、380 Newton-meter
              最大关节扭矩和 12-DOF 柔性手；新公布的 GR-3 Care Bot 则具备 55 个自由度、31 个分布式触觉压力传感器、声源定位和汽车级泡沫填充。Fourier
              优先发展触觉敏感度和人机交互，而不是单纯追求负载能力，因此其硬件区别于工业同行：后者的刚性铝制机身和高扭矩执行器并不适合养老护理和患者接触。
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP011
