        blocks:
          - type: paragraph
            body: >-
              Fourier 的主要技术差异化来自内部掌握执行器设计，并拥有成熟的临床部署基础；这区别于缺乏硬件制造能力的纯软件 humanoid 新进入者。公司交付 53-DOF 机电系统和 380 Nm
              扭矩的能力，体现出重要的机械执行能力，并得到 SoftBank Vision Fund、Prosperity7
              等成长型股权合作伙伴的佐证。然而，重大技术和尽调风险仍然存在。公开文档既没有公布平均故障间隔时间（MTBF），也没有提供负载步态下的连续动态电池续航数据。此外，虽然康复机器人已在亚洲医院网络形成临床覆盖，Fourier
              对西方监管辖区的完整 II/III 类医疗设备许可路径（FDA 510(k)、EU MDR）、软件网络安全渗透审计或现场故障日志披露有限，因此企业级可靠性尚未得到验证。
