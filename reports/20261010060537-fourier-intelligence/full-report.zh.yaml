        - 缺少经审计现金、烧钱、债务、优先权及与里程碑挂钩的融资需求
      - - 算力、软件与研究生态
        - 半导体供应商及外部技术生态
        - 核心身体控制之外的算力供应和能力
        - 未披露
        - 供应限制或外部模型进展放缓会削弱产品交付
        - 取决于是否暴露于单一来源
        - 产品和开发者生态的广度或可提供替代方案
        - 未获得指定供应商、切换成本、合同保护及合格替代品信息
    notes: 依赖关系来自公开资料和分析；交易对手方或分母未披露时，不推断集中度数值。
    claimRefs:
      - CR005
      - CR006
      - CR008
      - CR011
