            body: >-
              Fourier 的产品定价体现出分层硬件策略，覆盖入门级研究设备到高端企业系统。根据 Robot Price Index 和 RobotSourced 的目录数据，轻量型 Fourier N1 的售价定位在
              $16,000 至 $40,000 之间，为学术机器人实验室和算法开发者提供了易于进入的平台。企业级 GR-2 的报价在 $125,000 至 $150,000
              或更高，反映出重载关节执行器和企业研究中心定制集成的要求。较新的 GR-3 Care Bot 公开价格区间很宽，为 $27,500 至
              $120,000，因区域分销商、传感器负载和支持套餐不同而显著变化。不过，经核实的商业披露仍不完整，未说明经常性维护费、软件许可和专项培训套餐；这些通常会占医疗机器人总拥有成本的相当部分。
