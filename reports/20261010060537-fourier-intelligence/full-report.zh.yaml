    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              指定来源一致将 Fourier Intelligence 的成立时间定在 2015 年、运营中心定在上海；UpMarket 确认截至 2026 年 3 月公司仍为私人持有。它的运营身份并不局限于单一
              humanoid 产品：公开资料描述了面向机构护理场景销售的康复机器人和外骨骼，以及 GR 系列通用 humanoid 平台。这段历史支持一种双线商业模式：康复设备及相关系统提供更近期开拓机构渠道的基础，而
              humanoid 则是较新的平台和研究命题。KÜRE 报道，公司在 2024 年将这两条线正式拆分为面向通用机器人和 AI 研究的 Fourier，以及专注康复技术的 Fourier
              Rehab。这个框架可以作为运营描述，但不能证明收入结构、经常性经济性或 humanoid 业务已经商业化规模运行。
