      - number: '5.2'
        title: 通用 humanoid 机器人：GRx 平台演进
        blocks:
          - type: paragraph
            body: >-
              Fourier 凭借近十年的临床执行器和运动控制工程积累，拓展到通用具身人工智能，推出 GRx humanoid 机器人系列。GR-1 于 2023 年推出，是 Fourier 首个量产双足 humanoid
              平台；身高 165 cm、体重 55 kg，使用 44 个关节电机，最大关节扭矩 230 Nm，工作行走速度 5 km/h。2024 年，Fourier 宣布第二代平台 GR-2，将物理性能提升至身高 175
              cm、体重 63 kg 的规格，配备 53 个关节电机、改进的内部布线布局，峰值关节扭矩达到 380 Nm。GR-2 引入 12 自由度柔性灵巧手和基于 VR
              的远程指令集成，以拓展触觉操作能力。官方开发者文档还提到下一代 GR-3 的早期开发。Fourier 将 GRx 系列定位于学术研究、医疗辅助和公共服务咨询，试图把临床机电技术连接到可规模化的具身自动化。
            claimRefs:
