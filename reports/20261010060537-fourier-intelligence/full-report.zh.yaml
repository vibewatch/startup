      - number: '6.4'
        title: 采购摩擦、支付方依赖与商业不透明
        blocks:
          - type: paragraph
            body: >-
              评估 Fourier 客户关系的持久性，会发现重要的机构风险。资本密集型康复硬件的医院和临床采购周期通常需要 9 至 18
              个月，还取决于区域医疗设备认证、医院招标法，以及中国、东南亚和欧洲各市级市场不同的医疗报销安排。第三方行业分析明确指出，Fourier 尚未证明 humanoid
              部署具有可重复的采购经济性、客户留存率、净收入留存率（NRR）或维护合同续约利润率。此外，养老护理和医院辅助中的 humanoid
              实施会直接接触脆弱人群，因此安全责任协议、员工培训负担和监管许可会造成很大摩擦，阻碍试点项目转化为永久性的多台设备企业合同。由于没有披露头部客户收入集中度或分销商条款，Fourier
              的商业基础仍暴露于公共医疗资本支出预算波动。
            claimRefs:
              - CU004
              - CU007
              - CU015
              - CU016
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 双市场客户分化
            body: >-
              Fourier 的商业防御力几乎全部建立在 Fourier Rehab 十年来积累的临床机构关系上，由此形成了潜在 humanoid 竞争者难以轻易匹敌的 2,000
              多家机构部署基础。然而，把这些医疗买家关系转化为付费 humanoid 采用仍尚未得到验证，因为医院治疗预算与 IT/辅助机器人试点由不同的资本配置委员会管理。
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU004
          - type: callout
            title: 未验证的 humanoid 单位经济性与停滞的试点
            body: >-
              尽管 GR-3 humanoid 在 WAIC 2026、WRC 2026 和 CES 2026
              上进行了高曝光展示，公开证据确认其在居家护理或养老护理领域没有多台商业生产部署，也没有经常性维护合同。Fourier 的 humanoid 客户牵引力仍局限于学术研究拨款、联合临床测试平台和硬件生态共同开发。
            calloutType: risk
            claimRefs:
              - CU005
              - CU008
              - CU013
              - CU015
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律、隐私与安全证据不完整
        blocks:
          - type: paragraph
            body: >-
              Fourier
              的官网同时展示康复系统和面向人类协作的机器人，独立资料则描述其从医疗康复向通用机器人扩张。这个范围带来合理的设备、工作场所安全、隐私和跨境合规义务，但指定证据没有提供型号级注册、认证、事故记录、召回历史或安全控制细节。官方落地页链接了伦理和个人信息声明，这只能证明公司公开了相关政策，不能证明运营控制已经过测试。指定的不利结果中没有记录诉讼或执法，因此不能从沉默推断发生概率。投资批准应要求提供原始监管记录，以及按司法辖区划分的产品分类图。
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR010
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR010
              - CR015
      - number: '7.2'
        title: 运营风险由披露缺口和外部依赖驱动
        blocks:
          - type: paragraph
            body: >-
              运营风险并不是已证实的现场故障事件，而是现有证据无法量化可靠性和供应商暴露。一项独立分析认为 Fourier
              的身体控制强于基础模型，称半导体主要依赖外部采购，并指出公司没有公开强调专门的网络安全差异化。这些观察指向尽调重点，而不是已验证的单一来源依赖。公开资料对 humanoid
              业务处于试点交付还是商业状态也存在冲突。在缺乏设备出货量、验收标准、平均故障间隔时间、保修成本、正常运行时间或关键组件采购信息的情况下，既无法有把握地评估生产准备度，也无法评估剩余安全暴露。
            claimRefs:
              - CR003
              - CR004
              - CR010
              - CR011
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR010
              - CR011
              - CR014
              - CR015
      - number: '7.3'
        title: 交易对手与融资风险尚未量化
        blocks:
          - type: paragraph
            body: >-
              两份二手资料重复了 Fourier 服务超过 40 个国家、2,000
              多家机构和医院的说法，但这一覆盖范围无法说明支付方组合、分销商依赖、续约、采购周期或头部客户集中度。融资证据同样不一致：公开资料报告累计融资分别为 $83 million、$229 million 和
              $234.88 million，且汇总口径未披露。这些是融资额，不是收入、现金可用性或
              runway。已报道的估值参考在币种、日期和方法上也不同，不能合并为一个估值点。因此，核心财务风险是缺乏经审计的分部经济性、却仍需持续投入资本，而不是一个已量化的消耗估计。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR011
              - CR013
              - CR015
              - CR016
      - number: '7.4'
        title: 监测重点与论点失效触发条件
        blocks:
          - type: paragraph
            body: >-
              最大的剩余暴露就是证据缺口本身。投资前，Fourier 应提供型号级监管批准、安全与网络安全评估、付费 humanoid
              部署记录、现场可靠性队列、经审计的分部财务、当前现金桥接表，以及客户和供应商集中度明细。论点失效触发条件应当可衡量：在目标市场部署前未能验证必要认证；无法用付费验收记录调和商业阶段说法；现场可靠性或安全表现超出合同阈值；现金
              runway 无法支持下一项独立验证的商业化里程碑；或者在没有可信第二来源或替代客户的情况下，集中度超过投资委员会批准的上限。在这些测试完成前，风险严重程度仍是有条件的，而非数值估计。
            claimRefs:
              - CR006
              - CR007
              - CR014
              - CR015
              - CR016
