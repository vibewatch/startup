        title: 产品定义与临床康复机器人
        blocks:
          - type: paragraph
            body: >-
              Fourier 将临床产品组合定义为患者身体康复和功能性运动恢复。公司 2015 年在上海成立，最初专注机器人外骨骼和矫形器；2024 年 7 月重组为两个专门运营部门：负责通用机器人和人工智能研究的
              Fourier，以及承载医疗康复技术的 Fourier Rehab。临床部门提供针对不同身体部位的专用机器人硬件，包括 ArmMotus M2 Pro、WristMotus M1W 等上肢治疗机械手，以及
              ExoMotus M4 等下肢机器人外骨骼。这些设备接入 RehabHub 统一临床平台，用于连接多设备训练套件、自动追踪生物反馈，并在住院和门诊护理环境中标准化治疗运动协议。除传统临床工作站外，Fourier
              还商业化平衡协调系统和 MetaMotus Galileo 虚拟现实环境，用日常生活活动模拟来评估生物力学稳定性。公司记录显示，这些康复平台服务于超过 40 个国家和地区的 2,000 多家医院及康复机构。
