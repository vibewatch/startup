  - id: FU001
    title: Fourier Intelligence 客户采用与扩张路径
    type: journey-map
    summary: 展示客户从采用临床治疗到潜在部署具身人形机器人的进程。
    data:
      items:
        - label: 临床发现与评估
          buyer: Hospital Rehab Directors
          action: Evaluates exoskeleton devices (ArmMotus, ExoMotus) against manual therapy staffing shortages.
          touchpoints:
            - 医学会议（MEDICA、RehabWeek）
            - 关于卒中康复的学术文献
          hurdle: Stringent medical device certification and clinical trial scrutiny.
        - label: 机构科室部署
          buyer: Clinical Operations & Therapy Leads
          action: Procures standalone therapy robots or installs integrated RehabHub clinic suites.
          touchpoints:
            - 医院采购招标流程
            - 治疗师员工培训协议
          hurdle: Capital budget availability and regional healthcare reimbursement approval.
        - label: 协作式临床创新
          buyer: University Hospitals & Research Consortia
          action: Establishes joint research centers for muscle synergy analysis and sensor integration.
          touchpoints:
            - 联合创新中心（如 NHG Health、Nagoya Univ）
            - 临床研究发表
          hurdle: Translation from grant-funded research to standard-of-care clinical practice.
        - label: 具身人形机器人试点探索
          buyer: Innovation Labs & Eldercare Groups
          action: Deploys GR-2 or GR-3 humanoid prototypes for contactless monitoring and companion testing.
          touchpoints:
            - WAIC 和 WRC 展会演示
            - 受控养老生活实验室试验
          hurdle: Safety liability, lack of proven caregiver ROI, and steep unit costs.
        - label: 可规模化的企业照护集成
          buyer: Healthcare Network Executives
          action: Prospective deployment of multi-robot fleets combining therapy devices and autonomous care assistants.
          touchpoints:
            - 企业车队管理软件
            - 长期维护与 SLA 合同
          hurdle: Unproven economic viability, zero public reference customers at fleet scale.
        - label: 持续照护数据优化
          buyer: Health System CIOs & Research Directors
          action: Aggregates multi-facility patient rehabilitation metrics and embodied interaction logs across care networks.
          touchpoints:
            - 云数据基础设施审阅
            - 定期临床疗效审计
          hurdle: Cross-border medical data privacy rules and EHR integration friction.
    approximationNotes: 阶段反映根据临床销售流程和 2026 年合作伙伴披露推导的机构采用阶段。
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU008
      - CU010
      - CU015
