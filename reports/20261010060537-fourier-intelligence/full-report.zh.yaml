  - id: FE001
    title: 产品架构图
    type: stack
    summary: Fourier 机器人生态的六层技术架构，从物理机电系统延伸到临床及具身 AI 工作流。
    data:
      layers:
        - label: 第 6 层：物理机电系统与执行
          detail: Fourier Smart Actuators（FSA）提供最高 380 Nm 峰值关节扭矩、12 自由度灵巧手、自定义电机驱动、多轴力传感器及模块化外骨骼结构框架。
        - label: 第 5 层：关节控制与底层 SDK
          detail: 嵌入式电机固件、闭环力和位置反馈算法，以及用于与灵巧操控器确定性通信的 DexHand SDK。
        - label: 第 4 层：操作系统与中间件（Aurora）
          detail: Fourier Aurora（Advanced Unified Robot Operation and Resource Architecture）操作系统、实时消息总线及 Docker 容器化开发环境。
        - label: 第 3 层：仿真与具身 AI 训练
          detail: NVIDIA Isaac Gym 和 Isaac Sim 虚拟训练环境、URDF 到 MJCF 的模型转换流水线，以及强化学习策略生成。
        - label: 第 2 层：交互与远程操控层
          detail: 基于 VR 的远程控制和指令系统、情感交互显示模块、环境声音识别及多模态感知栈。
        - label: 第 1 层：临床平台与应用（RehabHub 与 GRx）
          detail: RehabHub 多设备集中式临床康复协议、MetaMotus Galileo 生物力学 VR 仿真及通用服务工作流。
    claimRefs:
