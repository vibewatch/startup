      - number: '1.4'
        title: 里程碑与当前阶段
        blocks:
          - type: paragraph
            body: >-
              Fourier 的发展时间线显示，公司是从康复硬件逐步走向 humanoid 平台，而非一夜之间转向新赛道。KÜRE 将下肢外骨骼原型定在 2016 年、Fourier X1 发布定在 2017 年、双足
              humanoid 研究转型定在 2020 年、Gen-1 原型定在 2022 年、GR-1 定在 2023 年、GR-2 定在 2024 年。同一来源还将双部门品牌结构定在 2024 年；RobotHub 报告了
              2025 年 8 月后续的 Series E+ 融资。这一顺序支持技术连续性和真实的康复业务积累，但不能证明 humanoid 产品线已具备商业准备度。ChoZan 明确指出，CES 2026
              的展示并不能证明医院规模部署。因此，更稳妥的阶段判断是：这是一家拥有机构康复业务基础、但 humanoid 项目仍需验证部署、服务经济性、安全性和结果的私人机器人公司。
