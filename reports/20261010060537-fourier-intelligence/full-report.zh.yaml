  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 从已验证的临床装机基础，到人形机器人商业化缺口、估值倍数压制，再到“继续研究”的建议，构成一条逻辑链。
    data:
      nodes:
        - label: 1. 临床证据：康复领域的医院装机基础覆盖 40+ 个国家，超过 2,000 家医院
        - label: 2. 收入基础：真实的医疗硬件销售和国际联合研究实验室
        - label: 3. 人形机器人扩张：GR-1、GR-2 和 GR-3 护理机器人从原型走向试点
        - label: 4. 商业化缺口：客户合同金额、经常性 ARR 或毛利率的披露数量为 0
        - label: 5. 估值压制：$1.1B 私募估值在缺乏经审计经济数据的情况下仍要求溢价倍数
        - label: 6. 建议：在获得经审计财务数据和付费部署证明前，评级为继续研究
    approximationNotes: 该流程展示了投资决策的先后逻辑，以及投入资本所需满足的证据门槛。
    claimRefs:
      - CV002
      - CV005
      - CV006
      - CV012
