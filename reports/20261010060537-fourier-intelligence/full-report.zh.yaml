  - id: TV001
    title: 建议摘要表
    columns:
      - 指标／维度
      - 发现／状态
      - 估值立场
      - 决策含义
    rows:
      - - 建议
        - research-more
        - stretched
        - 持续密切跟踪；在单位利润率和付费照护部署经过审计前，暂缓直接增长股权投资。
      - - 置信度
        - medium
        - stretched
        - 对机构康复装机基础（2,000+ 家机构）有较高信心，但经常性现金创造的透明度低。
      - - 风险评级
        - high
        - stretched
        - 地缘政治双用途国防审查、以中国为中心的医疗采购上限，以及未经验证的人形机器人单位经济性。
      - - 估值锚点
        - $1.1B (RMB 8.0B)
        - stretched
        - 因此，相较于缺乏经常性收入证明的传统医疗科技硬件可比公司，远期软件／AI 倍数溢价很高。
    notes: 估值锚点反映 2025 年报道的非公开 Series E+ 融资轮；公司仍未披露收入运行率和现金利润率指标。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV006
  - id: TV002
    title: 正面论点／反论点表
    columns:
      - 支柱
      - 投资论点（乐观视角）
      - 反论点（尽调／悲观担忧）
      - 改变判断的触发因素
    rows:
      - - 商业基础
        - 覆盖 40+ 个国家、已在 2,000+ 家医院形成的装机基础，带来临床黏性和真实的康复硬件收入。
        - 医院采购分散、周期长且利润低；硬件收入并不能转化为高倍数 SaaS 经常性收入。
        - 披露经审计 ARR、较高的经常性服务附加率（>40%），以及持续高于 60% 的毛利率。
      - - 人形机器人扩张
        - GR 系列利用已验证的执行器、电机控制和康复治疗数据集，在养老照护和服务机器人领域领先。
        - 通用人形机器人仍处于早期试点和研发演示阶段，没有经核实的机构采购订单或 ROI 证明。
        - Tier-1 医院体系签署多台商业采购合同，并有经核实的持续维护收入。
      - - 资本与投资者联盟
        - 获得 SoftBank Vision Fund 2、Prosperity7 Ventures 及上海市政府支持基金等 Tier-1 机构支持。
        - 大额清算优先权、人形机器人硬件制造的资本密集度，以及估值倍数压制。
        - 清晰披露股权结构表，清算优先权不具惩罚性，且经审计现金跑道超过 24 个月。
      - - 地缘政治与监管
        - 在中国国内照护市场的双市场定位，切中人口老龄化和国家自动化补贴的急迫需求。
        - 军用级机器人宣称、国防业务敞口及跨境技术转移限制，可能引发出口管制并被排除在西方市场之外。
        - 独立审计确认医疗健康民用机器人与双用途军事应用严格隔离。
    notes: 评估基于已核实的公开医疗健康披露，与非公开估值倍数及风险投资者联盟构成的比较分析。
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV008
  - id: TV003
    title: 乐观／基准／悲观情景表
    columns:
      - 情景
      - 运营与增长假设
      - 目标倍数与隐含估值
      - 主要下行／上行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - 康复业务维持 30%+ 的年增长，同时 GR3 照护人形机器人实现医院商业化采用；毛利率扩大至 55%。
        - 8x-10x NTM 收入；通过上海科创板或香港 IPO 得到 $1.8B-$2.2B 隐含估值。
        - 国内养老补贴快速扩大、海外医院采用，以及高软件附加率。
        - 20% 概率；取决于中国养老预算释放和人形机器人商业化爬坡。
      - - 基准情景（当前判断）
        - 康复机器人带来稳定的 15-20% 收入增长；人形机器人项目仍处于试点／研发阶段，设备交付量有限；研发现金消耗高。
        - 4x-5x NTM 收入；隐含估值为 $700M-$900M，反映相对于非公开估值锚点的硬件倍数压缩。
        - 机构照护采用缓慢、公立医院预算上限、人形机器人变现延迟。
        - 55% 概率；反映当前市场现实及未披露经常性人形机器人收入。
      - - 悲观情景
        - 国内医疗健康定价压力加剧；人形机器人研发持续烧钱，却没有可规模化的商业部署；面临出口管制阻力。
        - 2x-3x NTM 收入；隐含估值为 $350M-$450M（下调轮重置或资本重组 50-70%）。
        - 西方监管／出口限制、中国人形机器人竞争加剧、流动性短缺。
        - 25% 概率；由高资本密集度及对地缘政治供应限制的脆弱性驱动。
    notes: 隐含估值区间假设预估收入基线为 $80M-$120M，依据是报告的 800+ 员工人数及历史 Series D/E 里程碑推导。
    claimRefs:
      - CV009
      - CV010
      - CV011
