        blocks:
          - type: paragraph
            body: >-
              创始人身份大致清楚，但当前职务归属并不明确。KÜRE 将 Alex Gu 列为创始人；Tracxn 则分别列出 Jie Gu 或 Gu Jie 为创始人兼 CEO，并将 Zen Koh 列为联合创始人兼
              CEO。这些记录可能反映译名差异、区域实体、共同领导或过时数据库条目；指定证据无法确定哪种解释正确。EquityZen 另列 Zhen-Hua Xu 为 CTO、Suyang Zhang
              为董事，但没有提供生效日期或汇报关系。Tracxn
              的董事会部分也难以内部核对：它称有两名在任成员，却同时显示了其他被遮蔽或格式异常的姓名。因此，投资人应将公开领导层名单视为待核实线索，而非完整治理图谱。当前董事会构成、决策权、继任保障和创始人关键人物依赖，都需要公司提供证据。
            claimRefs:
