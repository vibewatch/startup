      - number: '5.3'
        title: 硬件架构、Aurora OS 与开发者生态
        blocks:
          - type: paragraph
            body: >-
              Fourier 的底层技术栈建立在自研高扭矩机电系统与开源软件、仿真基础设施之上。在硬件底层，Fourier Smart
              Actuators（FSA）整合高功率密度电机、精密行星减速器和多轴力传感器，借助闭环反馈算法实现最高 380 Nm 扭矩。在软件层，Fourier 维护 Aurora（Advanced Unified
              Robot Operation and Resource Architecture）操作系统，提供标准化消息总线、硬件抽象和基于 Docker
              的容器化二次开发指引。开发者工具通过公开代码仓库分发，其中包括用于程序化通信的 DexHand SDK、URDF 到 MJCF 模型转换器，以及与 NVIDIA Isaac Gym 和 Isaac Sim
              集成的强化学习双足行走训练环境。这套统一技术栈让研究人员和临床合作伙伴能够开发自定义任务策略，同时隔离底层关节动力学。
