      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 不要把缺失记录误当成清白记录
            body: 不利查询没有保留结果，但指定资料池同样没有原始法院、监管机构、召回或事故数据库记录。正确结论是搜索和尽调仍存在未解决的缺口，而不是断言 Fourier 从未发生诉讼、召回、数据泄露、宕机或执法行动。
            calloutType: risk
            claimRefs:
              - CR014
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、商业根基与融资历史
        blocks:
          - type: paragraph
            body: >-
              Fourier Intelligence 于 2015 年在上海成立，目标是开发先进医疗康复机器人和外骨骼。在随后的十年中，公司成功商业化上下肢康复系统组合，最终形成覆盖 40 个国家、服务超过 2,000
              家医院和医疗机构的全球临床基础。这一临床硬件基础使 Fourier 区别于既没有商业收入、也没有受监管部署历史的纯 humanoid 机器人同行。2018 年至 2025 年间，Fourier
              通过多轮机构融资累计筹得超过 $200 million 股权资本。关键里程碑包括 2022 年 1 月由 SoftBank Vision Fund 2 领投、Prosperity7 Ventures 和
              Visionplus Capital 参与的 $62 million Series D 融资，随后是 2025 年建立约 $1.1 billion 据报道投后估值锚点的 Series
              E。虽然这一融资轨迹显示出持续的投资人需求，以及国际风险基金和地方投资工具的战略支持，但公司一直未披露经审计的年度收入、现金消耗率或毛利率，因此进入估值的投资判断异常依赖私人市场信号，而不是经审计基本面。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
      - number: '8.2'
        title: 建议、风险评估与估值立场
        blocks:
          - type: paragraph
            body: >-
              我们的结论是：Fourier Intelligence 应获“继续研究”建议，风险评级为高，估值立场偏高。投资逻辑取决于 Fourier
              的双市场路径：利用已经建立的康复渠道、临床信誉和高性能执行器技术，将通用型护理人形机器人商业化。2024 年，公司通过重组正式确立这一战略，拆分为两个独立运营部门：专注临床治疗机器人的 Fourier
              Rehab，以及专注具身人工智能和人形平台的 Fourier，后者包括 GR-1、GR-2 和 GR-3
              护理机器人。然而，反向逻辑同样分量很重。人形护理机器人仍处于早期试点阶段，尚无公开证据证明存在经常性年度合同、大客户批量采购订单或正向单体毛利。此外，强调国防和军用机器人应用的媒体报道带来严重的地缘政治与监管摩擦，可能阻碍其在北美和欧洲医疗体系中的跨境临床采购。按有效的
              $1.1 billion 私募估值锚点计算，在管理层提供可审计的商业化进展指标、并消除军民两用认知风险之前，资本配置缺乏充分依据。
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV008
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV012
      - number: '8.3'
        title: 同业可比、倍数压缩与情景建模
        blocks:
          - type: paragraph
            body: >-
              将 Fourier 与全球同业比较后，可以看到私人人形机器人倍数与商业硬件现实之间存在明显分化。在人形机器人领域，1X Technologies 等双足机器人开发商已获得超过 $125 million
              融资；Agility Robotics 和 Apptronik 则筹集了规模显著更大的资金池，瞄准高吞吐量工业和物流自动化。Fourier 累计融资超过 $200
              million，属于全球资金充足的挑战者，但其明确聚焦医疗护理互动，而非工业物料搬运，因此需要不同的运营经济模型。传统医疗器械和康复硬件可比公司由于采购周期摩擦，通常按未来十二个月收入的 2.5x 至 5.0x
              倍交易；相比之下，AI 驱动的机器人平台往往寻求超过 10x 收入的风险投资估值。在基准情景下，倍数压缩至收入的 4x 至 5x，对应内在估值 $700 million 至 $900 million，较
              Series E 轮公开估值锚点意味着 20% 至 35% 的下行空间。在国内医疗定价承压且出口管制收紧的悲观情景下，估值可能压缩至 $350 million 至 $450 million。反过来，$1.8
              billion 至 $2.2 billion 的乐观情景要求 GR3 护理机器人获得可验证的商业化采用，同时康复业务收入持续增长 30%+。
            claimRefs:
              - CV006
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
              - CV010
              - CV011
      - number: '8.4'
        title: 退出准备度、IPO 前流动性与尽调要求
        blocks:
          - type: paragraph
            body: >-
              Fourier Intelligence 的退出准备度仍受财务透明度不足、股权结构表复杂以及跨境监管因素制约。虽然 EquityZen 等平台已经出现 IPO
              前股份和老股交易流动性渠道，但缺乏标准化财务披露，导致机构级老股交易无法以透明价格完成。公司员工已扩张至 800+ 人，并在新加坡、芝加哥、菲尼克斯、苏黎世、墨尔本和马德里等城市建立 17
              个国际联合研究实验室，这证明了其运营规模，同时也意味着持续的运营支出和月度烧钱速度不低。若寻求在上海科创板或香港证券交易所上市，公司将需严格审查收入确认政策、客户集中度和对政府补贴的依赖。若要从“继续研究”转向“买入”建议，潜在投资者必须完成四项不可妥协的尽调要求：取得多年经审计的财务报表；核实康复部门的客户级合同金额和毛利；检查
              GR 系列人形机器人的已承诺采购协议；取得法律确认，证明其机器人 IP 严格与民用业务隔离。
            claimRefs:
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 当前估值下的尽调建议：继续研究
            body: >-
              Fourier Intelligence 拥有扎实的临床基础，已在 40 个国家部署超过 2,000 家机构和医院，这使其区别于纯概念型人形机器人同业。但 $1.1B（RMB
              8.0B）的私募市场估值反映了市场对人形护理商业化的激进预期，而这些预期尚未得到公开财务审计、付费单体部署合同或披露毛利的佐证。在可验证的单体经济性和经常性收入证据确立前，投资者应维持“继续研究”立场。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV005
              - CV006
          - type: callout
            title: 估值下行与军民两用地缘政治风险敞口
            body: >-
              人形机器人研发的高资本开支、未披露的烧钱速度，以及有关军用级机器人应用的新兴说法叠加，构成实质性下行风险。在基准情景的倍数压缩下，缺乏经常性软件收入可能迫使估值相对后期私募市场估值下调 20% 至
              40%；与此同时，国防相关认知也会威胁其在西方医疗市场的国际商业销售。
            calloutType: risk
            claimRefs:
              - CV004
              - CV007
              - CV010
