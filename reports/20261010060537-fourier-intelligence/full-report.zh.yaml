              可公开核实的客户部署和战略技术合作，集中在研究和学术医疗网络。2026 年 5 月，Fourier 在全球康复与辅助技术峰会期间，与新加坡 National Healthcare Group（NHG
              Health）和日本名古屋大学正式签署战略协议。NHG Health 合作建立在 2021 年启动的联合工作基础上，包括 2025 年 9 月与健康初创公司 injewelme 开展的临床项目，该项目评估 GRx
              humanoid 通过远程光电容积脉搏波实现非接触生命体征监测。在名古屋大学，Fourier 的 ArmMotus EMU 上肢康复机器人已用于临床肌肉协同分析。除临床试验外，Fourier 2026
              年的“Technology + Ecosystem”项目还与 Singularity Intelligent Control、Shenzhen Yita Power Technology、Yihang
              Lingguang 和 Shanghai Runke Juneng 等硬件及集成伙伴合作，测试具身 AI 模型和工业负载。然而，这些技术展示和联合研究中心尚未证明企业级软件订阅收入或商业生产 SLA。
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
