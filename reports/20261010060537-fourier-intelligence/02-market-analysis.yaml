callouts:
  - calloutType: "insight"
    title: "The Two-Business Valuation Conundrum"
    body: "Underwriting Fourier Intelligence requires strict separation between its commercial rehabilitation franchise and its humanoid R&D program. While the rehabilitation business has achieved genuine international scale across 2,000+ clinical institutions, using that footprint to justify humanoid commercialization assumes hospital procurement cycles and medical device regulatory pathways that have not yet been demonstrated for autonomous bipedal systems."
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM003"
      - "CM013"
  - calloutType: "risk"
    title: "Autonomous Care Deployment Timelines"
    body: "Institutional healthcare procurement for autonomous humanoid robots faces extended validation hurdles. Even with research agreements at premier institutions such as Singapore's NHG Health and Japan's Nagoya University, conversion to revenue-generating clinical deployments remains multi-year, exposing Fourier to competitive leapfrogging by well-capitalized robotics peers."
    claimRefs:
      - "CM007"
      - "CM008"
      - "CM012"
