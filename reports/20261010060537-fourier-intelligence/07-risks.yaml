company:
  name: Fourier Intelligence
chapter:
  number: 7
  title: Risks
  summary: Public evidence supports a real rehabilitation-robotics base and an expanding humanoid portfolio, but it does not establish the controls or economics needed to calibrate the largest risks. The investable risk case therefore turns on unresolved certification, reliability, commercial-stage, concentration, and cash-runway evidence rather than on a documented lawsuit, recall, breach, or outage.
sections:
  - id: regulatory-and-legal
    title: Regulatory, legal, privacy, and safety evidence is incomplete
    body: >-
      Fourier's public site presents both rehabilitation systems and robots intended for
      human collaboration, while independent profiles describe a broader move from medical
      rehabilitation into general-purpose robotics. That scope creates plausible device,
      workplace-safety, privacy, and cross-border compliance obligations, but the assigned
      evidence does not provide model-level registrations, certifications, incident records,
      recall history, or security-control detail. The official landing pages link ethics and
      personal-information statements, which is evidence of a policy surface rather than
      evidence that operating controls have been tested. No assigned adverse result documents
      litigation or enforcement, so likelihood cannot be inferred from silence. Investment
      approval should require primary regulatory records and a jurisdiction-by-jurisdiction
      product classification map.
    claimRefs:
      - CR001
      - CR002
      - CR009
      - CR010
      - CR015
    tableRefs:
      - TR001
  - id: operational-and-technical
    title: Operational risk is driven by disclosure gaps and external dependencies
    body: >-
      The operational risk is not a proven field-failure event; it is the inability to
      quantify reliability and supplier exposure from the available evidence. One independent
      analysis characterizes Fourier as stronger in body control than foundation models,
      describes semiconductors as primarily externally procured, and says specialized
      cybersecurity differentiation is not highlighted publicly. Those observations point to
      diligence priorities, not verified single-source dependencies. Public profiles also
      conflict on whether the humanoid business is at pilot delivery or commercial status.
      Without unit shipments, acceptance criteria, mean time between failures, warranty cost,
      uptime, or critical-component sourcing, neither production readiness nor residual safety
      exposure can be scored with confidence.
    claimRefs:
      - CR003
      - CR004
      - CR010
      - CR011
      - CR014
      - CR015
    tableRefs:
      - TR002
  - id: counterparties-and-financing
    title: Counterparty and financing risk remain unquantified
    body: >-
      Two secondary profiles repeat Fourier's claim of serving more than 2,000 institutions
      and hospitals across more than 40 countries, but that footprint does not reveal payer
      mix, distributor dependence, renewal, procurement duration, or top-customer
      concentration. Financing evidence is similarly inconsistent: public profiles report
      cumulative funding of $83 million, $229 million, and $234.88 million using undisclosed
      aggregation rules. These are funding-raised figures, not revenue, cash availability, or
      runway. Reported valuation references also differ in currency, date, and methodology and
      cannot be merged into one mark. The key financial risk is therefore continued capital
      intensity without audited segment economics, not a quantified burn estimate.
    claimRefs:
      - CR005
      - CR006
      - CR007
      - CR008
      - CR015
      - CR016
    tableRefs:
      - TR003
  - id: monitoring-and-kill-criteria
    title: Monitoring priorities and thesis-break triggers
    body: >-
      The highest residual exposures are the evidence gaps themselves. Before investment,
      Fourier should provide model-level regulatory approvals, safety and cybersecurity
      assessments, paid humanoid deployment records, field-reliability cohorts, audited
      segment financials, a current cash bridge, and customer and supplier concentration
      schedules. Thesis-break triggers should be measurable: failure to validate required
      certifications before target-market deployment; failure to reconcile commercial-stage
      claims with paid acceptance records; field reliability or safety performance outside
      contractual thresholds; a runway that cannot fund the next independently verified
      commercialization milestone; or concentration above the investment committee's approved
      limit without a credible second source or replacement customer. Until those tests are
      completed, risk severity remains conditional rather than numerically estimated.
    claimRefs:
      - CR006
      - CR007
      - CR014
      - CR015
      - CR016
    figureRefs:
      - FR001
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Rule / license / case
      - Jurisdiction
      - Public-evidence status
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Diligence path
    rows:
      - - Medical-device registration and clinical claims
        - Product- and market-specific
        - Model-level registrations and renewal status not present in assigned evidence
        - Not assessed
        - Potentially high if a marketed device lacks required approval
        - Not disclosed
        - Launch delay, restricted claims, or remediation cannot be ruled out
        - Obtain regulator-issued registrations, intended-use labels, quality-system certificates, and post-market files by model and country
      - - Privacy, cybersecurity, and human-interaction controls
        - China, Singapore, and each deployment market
        - Official site links ethics and personal-information statements; technical controls are not detailed
        - Not assessed
        - Potentially high in care settings
        - Policy surface visible; testing evidence unavailable
        - Data handling, access control, and incident-response effectiveness remain unverified
        - Review data maps, retention schedules, penetration tests, software bills of materials, and incident-response exercises
      - - Litigation, enforcement, recalls, and export controls
        - Global and cross-border
        - No primary legal or regulatory record was allocated; adverse search returned no retained result
        - Unknown
        - Unknown
        - Not evidenced
        - Absence of a retained result is not evidence that no matter exists
        - Run entity-name and product-name searches in court, regulator, recall, sanctions, and export-control databases
    notes: Partial public-evidence register as of 2026-10-10; null or unknown assessments mean the assigned source pool did not support a conclusion, not that the risk is absent.
    enumerationScope:
      coverage: sample
      basis: Three decision-relevant regulatory and legal categories visible from the assigned public source pool, not an exhaustive jurisdictional inventory.
    claimRefs:
      - CR001
      - CR002
      - CR009
      - CR010
      - CR015
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Evidence signal
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Pilot-to-commercial stage misclassification
        - RobotHub says Pilot Delivery; Humanoid Index says Commercial
        - Evidence conflict observed
        - High investment relevance
        - Not disclosed
        - Paid volume deployment and repeatability cannot be established
        - Units shipped, paid acceptance records, utilization, renewals, and cancellations
      - - Field reliability or safety failure
        - Product breadth is visible, but fleet uptime and failure cohorts are not
        - Not assessed
        - Potentially high for robots operating near people
        - Not disclosed
        - Warranty, recall, service-load, and deployment interruption exposure is unquantified
        - Mean time between failures, incident logs, warranty cost, and independent safety testing
      - - Critical-component supply interruption
        - One independent analysis describes semiconductors as primarily externally procured
        - Not assessed
        - Potentially high if single-sourced
        - No sourcing plan disclosed
        - Export controls, shortages, or supplier changes could affect production
        - Bill of materials, approved vendor list, geographic source map, buffer policy, and second-source qualification
      - - Cybersecurity weakness
        - Independent analysis says specialized differentiation is not highlighted publicly
        - Not assessed
        - Potentially high for connected care or enterprise systems
        - Public evidence insufficient
        - Architecture, vulnerability management, and fleet-update controls remain unverified
        - Security architecture review, penetration testing, disclosure policy, and signed-update evidence
    notes: Qualitative register based only on assigned public evidence; likelihood and severity are left unassessed unless the evidence supports the stated condition.
    claimRefs:
      - CR003
      - CR004
      - CR010
      - CR011
      - CR014
      - CR015
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Institutional rehabilitation demand
        - Hospitals and institutions across reported markets
        - Buyers, users, and clinical reference base
        - Not disclosed
        - Budget or tender delays reduce cash generation and reference activity
        - Potentially high if concentrated
        - Reported geographic breadth may diversify exposure, but payer mix is unknown
        - No customer-level revenue, renewal, or distributor schedule
      - - External growth capital
        - Investors named in public funding profiles
        - Finance product development and commercialization
        - Cap table and investor terms not disclosed
        - Financing delay or restrictive terms interrupt the next milestone
        - Potentially high if runway is short
        - Multiple historical rounds show access to capital, not current availability
        - Audited cash, burn, debt, preferences, and milestone-linked financing needs are missing
      - - Compute, software, and research ecosystem
        - Semiconductor vendors and external technical ecosystems
        - Compute supply and capabilities outside core body control
        - Not disclosed
        - Supply restrictions or slower external-model progress weaken product delivery
        - Conditional on single-source exposure
        - Product and developer ecosystem breadth may provide alternatives
        - Named vendors, switching cost, contractual protections, and qualified substitutes are unavailable
    notes: Dependencies are identified from public profiles and analysis; concentration values are not inferred where counterparties or denominators are undisclosed.
    claimRefs:
      - CR005
      - CR006
      - CR008
      - CR011
      - CR013
      - CR015
      - CR016
