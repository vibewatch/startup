  evidenceGaps:
    - type: missing-source
      severity: material
      topic: legal-and-incident-record
      missingEvidence: Primary court, regulator, recall, sanctions, breach, outage, and enforcement records for relevant Fourier entities and products.
      whyItMatters: The retained adverse search produced no result, which cannot establish that no legal, safety, security, or regulatory event exists.
      diligencePath: Search official databases by legal entity, product model, former company name, and jurisdiction; reconcile results with management's incident register.
      relatedQuestionRefs:
        - QR001
      relatedTableRefs:
        - TR001
    - type: missing-source
      severity: material
      topic: certification-and-security-controls
      missingEvidence: Model-level registrations, intended-use labels, quality-system certificates, privacy data maps, penetration tests, and software update controls.
      whyItMatters: Products used near patients or workers can face launch, liability, and remediation exposure if required controls are absent or ineffective.
      diligencePath: Obtain regulator-issued records and commission independent privacy, cybersecurity, and functional-safety reviews for each target-market configuration.
      relatedQuestionRefs:
        - QR002
