callouts:
  - calloutType: risk
    title: Do not mistake missing records for a clean record
    body: The adverse query retained no result, but the assigned pool also contains no primary court, regulator, recall, or incident database record. The correct conclusion is an unresolved search and diligence gap, not an assertion that Fourier has had no lawsuit, recall, breach, outage, or enforcement action.
    claimRefs:
      - CR014
      - CR015
