evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, gross margin, cash balance, cash flow, and runway by operating division.
    whyItMatters: Funding raised is not cash available, and product breadth does not establish sustainable economics.
    diligencePath: >-
      Request audited financial statements, current management accounts, bank statements, and a division-level operating
      plan.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: scale-reconciliation
    missingEvidence: >-
      A company-certified schedule reconciling funding, valuation, institutional accounts, and headcount to consistent
      entities and dates.
    whyItMatters: >-
      The public funding, customer, and workforce figures differ enough to change stage, capital-efficiency, and
      valuation conclusions.
    diligencePath: Reconcile the cap table, financing ledger, CRM account definitions, and payroll roster with named legal entities.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Current organization chart, board roster, founder identity mapping, voting rights, and succession plan.
    whyItMatters: Overlapping CEO labels and incomplete board records prevent assessment of control and key-person dependence.
    diligencePath: >-
      Obtain corporate registers, board minutes, employment titles, delegations of authority, and founder succession
      documentation.
    relatedQuestionRefs:
      - QO002
      - QO007
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: cap-table
    missingEvidence: >-
      Complete investor and stakeholder population, including security classes, preferences, dilution, board rights,
      debt, and secondary transactions.
    whyItMatters: Named investors do not establish ownership, control, liquidation economics, or the basis of the latest valuation.
    diligencePath: Request the fully diluted cap table, financing documents, debt schedule, and all secondary-transfer records.
    relatedQuestionRefs:
      - QO003
      - QO007
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: humanoid-commercialization
    missingEvidence: >-
      Named paid humanoid deployments with unit counts, contract value, safety evidence, service cost, KPIs, and
      renewals.
    whyItMatters: Demonstrations and product launches do not establish repeatable procurement or commercial deployment.
    diligencePath: >-
      Review signed customer contracts, deployment logs, incident records, service tickets, and renewal or expansion
      evidence.
    relatedQuestionRefs:
      - QO006
      - QO008
  - type: missing-source
    severity: material
    topic: humanoid-commercial-pricing-and-contracts
    missingEvidence: >-
      Audited commercial sales contracts, confirmed paying customer names, unit realized prices, and renewal metrics for
      GR-1, GR-2, and GR-3 humanoid platforms.
    whyItMatters: >-
      Without documented commercial pricing and paying customer validation, valuation models cannot determine whether
      humanoid shipments generate commercial software/hardware gross margins or represent subsidized research pilots.
    diligencePath: >-
      Request customer references, master service agreements, and unit revenue realizations for hospital or eldercare
      humanoid deployments under NDA.
    relatedQuestionRefs:
      - QM005
  - type: missing-source
    severity: material
    topic: pricing-packaging
    missingEvidence: Audited hospital procurement contracts and total cost of ownership disclosures for Fourier GR-3 care deployments.
    whyItMatters: >-
      Public list price ranges between $27,500 and $120,000 do not reveal realized net pricing, annual software and
      maintenance fees, or therapist integration costs necessary to evaluate unit economics.
    diligencePath: >-
      Request customer contract schedules and representative institutional invoices from Fourier's commercial sales
      organization.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: >-
      Audited financial statements including GAAP/IFRS revenue, COGS, gross margin, operating expenses, and net cash
      burn.
    whyItMatters: >-
      Without audited financial disclosures, company valuation cannot be grounded in realized revenue or operating cash
      flow.
    diligencePath: Request audited financial statements and management accounts under NDA during confirmatory diligence.
    relatedQuestionRefs:
      - QI003
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: humanoid-unit-economics
    missingEvidence: >-
      Commercial contract terms, ASPs, and customer renewal data for GR-1, GR-2, and GR3 humanoid robot pilot
      deployments.
    whyItMatters: >-
      Humanoid deployments are unproven as commercial revenue generators, creating risk of subsidizing unprofitable R&D
      hardware.
    diligencePath: Examine customer pilot agreements, acceptance certificates, and SLA maintenance fee schedules.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: technical-risks
    missingEvidence: >-
      Model-by-model regulatory clearance records (NMPA Class II/III, FDA 510(k), CE MDR), verified MTBF hardware
      reliability figures, and clinical cybersecurity or patient privacy audit documentation.
    whyItMatters: >-
      Without public disclosure of device certification boundaries, failure rates, and patient data security standards,
      underwriters cannot independently verify commercial readiness or institutional procurement compliance across
      international healthcare jurisdictions.
    diligencePath: >-
      Request comprehensive medical device registration certificates, certified factory audit reports, third-party
      penetration testing summaries, and field service incident logs from Fourier management.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-and-churn
    missingEvidence: >-
      Audited customer retention rates, annual recurring revenue (ARR), gross renewal rates, and cohort churn across the
      2,000+ hospital installed base.
    whyItMatters: >-
      Without retention and recurring service contract metrics, it is impossible to verify whether Fourier's clinical
      installed base produces dependable high-margin cash flows or one-off hardware sales.
    diligencePath: >-
      Request audited revenue breakdowns distinguishing one-off capital equipment shipments from annual maintenance and
      software subscription agreements during management diligence.
    relatedQuestionRefs:
      - QU004
  - type: missing-source
    severity: material
    topic: humanoid-commercial-contracts
    missingEvidence: >-
      Verified enterprise commercial contracts, paid unit shipment volumes, and SLA commitments for humanoid robot
      models (GR-1, GR-2, GR-3).
    whyItMatters: >-
      Humanoid deployments currently appear restricted to academic research institutions, PR showcases, and grant-funded
      pilot trials without demonstrated enterprise unit economics.
    diligencePath: >-
      Conduct commercial reference calls with named hospital and eldercare pilot leads to inspect contract pricing,
      uptime SLAs, and unit purchase orders.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: customer-concentration
    missingEvidence: Comprehensive enumeration of top 10 customer accounts and percentage share of total company revenue.
    whyItMatters: >-
