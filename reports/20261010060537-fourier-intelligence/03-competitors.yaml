callouts:
  - calloutType: "insight"
    title: "Clinical Moat Diverges From Industrial Humanoid Race"
    body: "While peers such as Figure and Agility compete on payload, speed, and warehouse navigation, Fourier's competitive moat is anchored in 2,000 hospital relationships and force-feedback rehabilitation data. This specialization insulates Fourier from direct factory-floor price wars but leaves its humanoid economics tethered to healthcare procurement cycles."
    claimRefs:
      - "CP003"
      - "CP004"
      - "CP011"
      - "CP012"
  - calloutType: "risk"
    title: "Displacement Risk From Generalized Embodied AI Platforms"
    body: "As general-purpose humanoid platforms mature, aggressive cost declines and modular soft-contact manipulators could enable well-funded industrial humanoid manufacturers to enter eldercare and clinical assistance, challenging Fourier's hardware pricing power."
    claimRefs:
      - "CP002"
      - "CP003"
      - "CP013"
      - "CP014"
