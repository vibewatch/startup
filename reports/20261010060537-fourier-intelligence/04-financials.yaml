callouts:
  - calloutType: risk
    title: Complete Opacity on Core Unit Economics and Gross Margins
    body: While Fourier Intelligence has established commercial distribution in over 2,000 healthcare institutions, the company publishes no audited revenue, gross margin, or bill-of-materials data. Without verified unit contribution margins or sales efficiency metrics, commercial scalability cannot be underwritten.
    claimRefs:
      - CI005
      - CI006
      - CI016
  - calloutType: insight
    title: Dual-Track Capital Allocation Creates Asymmetric R&D Burn
    body: Fourier's expansion from commercial rehabilitation robotics into humanoid platforms (GR-1, GR-2, GR3) introduces substantial capital intensity. Sustaining general-purpose embodied AI R&D and 53-DOF actuator development requires continuous capital market access beyond rehabilitation cash flows.
    claimRefs:
      - CI007
      - CI013
      - CI015
