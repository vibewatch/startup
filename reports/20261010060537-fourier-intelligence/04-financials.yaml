company:
  name: Fourier Intelligence
chapter:
  number: 4
  title: Financials
  summary: Fourier Intelligence operates an established rehabilitation robotics commercialization engine spanning over 2,000 healthcare institutions globally, alongside an emerging humanoid robotics development track. While cumulative equity funding of $229M provides significant capital runway, audited revenue, unit contribution margins, customer contract values, and cash burn metrics remain private and undisclosed, leaving forward underwriting dependent on confirmatory diligence.
sections:
  - id: revenue-streams-and-commercialization
    title: Revenue Streams and Commercial Monetization
    body: Fourier Intelligence generates commercial revenue primarily through the sale and clinical deployment of medical rehabilitation robotics, supported by its RehabHub software and clinical integration platforms. The company's established rehabilitation portfolio includes upper-limb devices such as the ArmMotus M2 Pro and lower-limb exoskeleton systems like the ExoMotus M4, which are marketed to hospitals, specialized neurorehabilitation clinics, and public care facilities across more than 40 countries. In recent years, Fourier has broadened its commercial scope by introducing general-purpose bipedal humanoid robots, beginning with the mass-produced GR-1 platform and expanding to the GR-2 and GR3 series. However, while rehabilitation devices represent an active clinical revenue stream, the humanoid robotics segment remains largely in pilot delivery and academic research development stages rather than producing scaled commercial recurring revenue.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: cost-structure-and-unit-economics
    title: Cost Structure, Unit Economics, and Margin Drivers
    body: The cost structure of Fourier's rehabilitation hardware is driven by multi-axis actuator components, sensor arrays, specialized medical-grade materials, and rigorous clinical assembly standards. For advanced humanoid robots such as GR-1 and GR-2, bill-of-materials costs escalate due to the inclusion of 44 to 53 joint motors, high-torque FSA actuators, 12-DOF flexible hands, and embedded perception compute modules. Selling into institutional healthcare systems introduces extended procurement timelines, distributor margin splits, and ongoing clinical training requirements that elevate effective customer acquisition and service-delivery costs. Because Fourier maintains a private disclosure profile, precise component-level bills of materials, realized gross margins, and field maintenance costs remain confidential, necessitating conservative margin assumptions for underwriting.
    claimRefs:
      - CI005
      - CI006
      - CI007
      - CI008
    tableRefs:
      - TI003
    figureRefs: []
  - id: commercial-traction-and-disclosure-gaps
    title: Commercial Traction Proxies and Metric Disclosures
    body: 'Public indicators of commercial traction reflect Fourier''s strong institutional presence in medical rehabilitation, where company statements report partnerships and service relationships with over 2,000 hospitals and rehabilitation centers worldwide. Tracking data across independent industry aggregators reveals significant divergence in operational scale: while specialized robotics indices estimate Fourier''s workforce at over 800 employees globally as of early 2026, corporate directory services like Owler record estimated annual revenues below $1M and employee counts under 10, and Tracxn reports 48 employees in its Singapore entity. These sharp discrepancies highlight the opacity of private Chinese robotics ventures where entity-level filings in Singapore or offshore holding structures capture only partial operational footprints. Detailed revenue figures and financial statements remain accessible only via private secondary platforms.'
    claimRefs:
      - CI002
      - CI009
      - CI010
      - CI011
      - CI012
    tableRefs: []
    figureRefs: []
  - id: capital-adequacy-and-underwriting-verdict
    title: Capital Adequacy, Cash Runway, and Underwriting Verdict
    body: Fourier Intelligence has demonstrated consistent fundraising capability, securing a reported $229M in cumulative equity capital across seven financing rounds since its 2015 founding. Recent capitalization includes an August 2025 Series E+ round of $43M led by Runyang Technology at an indicated $1.1B valuation, following a $114M Series E round in January 2025 backed by state-linked and institutional investors including Guoxin Investment and Prosperity7 Ventures. This capital influx provides substantial balance-sheet runway to sustain dual R&D tracks in embodied AI and medical robotics. Nevertheless, the commercial viability of humanoid robotics in unstructured healthcare and eldercare environments remains unproven at scale, with independent market analyses noting that repeatable procurement, maintenance operations, and service economics have yet to be validated. The absence of audited financials constitutes a key diligence blocker.
    claimRefs:
      - CI013
      - CI014
      - CI015
      - CI016
    tableRefs: []
    figureRefs: []
