      - "Probability Signal"
    rows:
      - - "Bull Case"
        - "Rehab division maintains 30%+ annual growth while GR3 care humanoids achieve commercial hospital adoption; gross margin expands to 55%."
        - "8x-10x NTM revenue; Implied valuation of $1.8B-$2.2B via Shanghai STAR Market or Hong Kong IPO."
        - "Rapid scale of domestic eldercare subsidies, foreign hospital uptake, and high software attachment."
        - "20% probability; contingent on China eldercare budget unlocking and commercial humanoid ramp."
      - - "Base Case (Current View)"
        - "Rehab robotics delivers steady 15-20% revenue growth; humanoid programs remain pilot/R&D stage with modest unit deliveries; high R&D cash burn."
        - "4x-5x NTM revenue; Implied valuation of $700M-$900M, reflecting hardware multiple compression against private anchor."
        - "Sluggish institutional care adoption, state hospital budget caps, delayed humanoid monetization."
        - "55% probability; reflects present market reality and lack of disclosed recurring humanoid revenue."
      - - "Bear Case"
        - "Domestic healthcare pricing pressure intensifies; humanoid R&D burns capital without scalable commercial deployments; export control headwinds."
        - "2x-3x NTM revenue; Implied valuation of $350M-$450M (50-70% down-round reset or recapitalization)."
        - "Western regulatory/export restrictions, intensified Chinese humanoid competition, liquidity shortfall."
        - "25% probability; driven by high capital intensity and vulnerability to geopolitical supply constraints."
    notes: "Implied valuation ranges assume an estimated revenue baseline of $80M-$120M derived from reported 800+ employee headcount and historical Series D/E milestones."
