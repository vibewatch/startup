callouts:
  - calloutType: "recommendation"
    title: "Diligence Recommendation: Research-More at Current Mark"
    body: "Fourier Intelligence presents a strong clinical foundation with more than 2,000 institutional hospital deployments across 40 countries, distinguishing it from purely conceptual humanoid robotics peers. However, the private market valuation mark of $1.1B (RMB 8.0B) reflects aggressive expectations for humanoid care commercialization that are not yet corroborated by public financial audits, paid unit deployment contracts, or disclosed gross margins. Investors should maintain a research-more stance until verifiable unit economics and recurring revenue proof are established."
    claimRefs:
      - "CV002"
      - "CV005"
      - "CV006"
  - calloutType: "risk"
    title: "Valuation Downside and Dual-Use Geopolitical Exposure"
    body: "The confluence of high capital expenditure in humanoid robotics R&D, undisclosed cash burn rates, and emerging claims regarding military-grade robotic applications poses material downside risk. In a base-case multiple compression scenario, lack of recurring software revenue could force a 20% to 40% valuation haircut against late-stage private marks, while defense-related perceptions threaten international commercial sales across Western healthcare markets."
    claimRefs:
      - "CV004"
      - "CV007"
      - "CV010"
