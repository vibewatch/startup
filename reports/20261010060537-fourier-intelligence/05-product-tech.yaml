callouts:
  - calloutType: "insight"
    title: "Strategic Dual-Track Transition from Clinical Rehabilitation to Embodied Humanoids"
    body: "Fourier's 2024 formal restructuring into Fourier (general-purpose robotics) and Fourier Rehab (clinical technologies) illustrates a capital-efficient technology transfer model. Core competencies developed over nearly a decade of commercial rehabilitation engineering—notably modular high-torque Fourier Smart Actuators (FSA), multi-axis force sensors, and closed-loop motor control algorithms—form the direct hardware and firmware foundation for the GR-1 and GR-2 humanoid bipedal platforms."
    claimRefs:
      - "CE001"
      - "CE004"
      - "CE005"
      - "CE006"
  - calloutType: "risk"
    title: "Under-Disclosed Hardware Reliability and Multi-Jurisdiction Certification Boundaries"
    body: "While Fourier documents significant mechanical milestones with 53 joint motors and 380 Nm peak torque on the GR-2, public disclosures omit standardized MTBF hardware reliability metrics, battery endurance benchmarks under continuous dynamic gait, and formal medical device compliance clearances outside baseline Asian hospital channels. For institutional healthcare buyers and industrial automation underwriters, independent verification of safety interlocks, component lifetime, and data governance standards remains an essential diligence prerequisite."
    claimRefs:
      - "CE004"
      - "CE011"
      - "CE014"
