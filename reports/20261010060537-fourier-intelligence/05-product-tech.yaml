company:
  name: "Fourier Intelligence"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Fourier operates a dual-track robotics architecture combining commercialized clinical rehabilitation systems deployed across more than 2,000 healthcare institutions with an advanced humanoid development program (GR-1, GR-2, and GR-3) powered by proprietary Fourier Smart Actuators and the Aurora operating system. While core mechatronics and force-control algorithms demonstrate substantial engineering maturity, public disclosures lack audited MTBF reliability figures, comprehensive multi-jurisdiction medical device certifications, and validated enterprise customer economics for bipedal service deployments."
sections:
  - id: "product-definition-and-clinical-rehab"
    title: "Product Definition and Clinical Rehabilitation Robotics"
    body: "Fourier defines its clinical product portfolio around patient physical rehabilitation and functional motor recovery. Originally founded in Shanghai in 2015 with a focus on robotic exoskeletons and orthoses, the company restructured in July 2024 into two dedicated operational divisions: Fourier, dedicated to general-purpose robotics and artificial intelligence research, and Fourier Rehab, housing its medical rehabilitation technologies. The clinical division delivers specialized robotic hardware targeting distinct anatomical zones, including upper-limb therapeutic manipulators such as the ArmMotus M2 Pro and WristMotus M1W, alongside lower-limb robotic exoskeletons such as the ExoMotus M4. These devices integrate into RehabHub, a unified clinical platform designed to connect multi-device training suites, automate biofeedback tracking, and standardize therapeutic exercise protocols across inpatient and outpatient care environments. Beyond conventional clinical stations, Fourier commercializes balance coordination systems and the MetaMotus Galileo virtual reality environment, which simulates activities of daily living to evaluate biomechanical stability. Company records indicate these rehabilitation platforms serve more than 2,000 hospitals and rehabilitation institutions across over 40 countries and regions."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE006"
      - "CE011"
      - "CE012"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "humanoid-robotics-and-embodied-ai"
    title: "General-Purpose Humanoid Robotics: GRx Platform Evolution"
    body: "Leveraging nearly a decade of clinical actuator and motor control engineering, Fourier expanded into general-purpose embodied artificial intelligence with the GRx humanoid robot series. Introduced in 2023 as Fourier's first mass-produced bipedal humanoid platform, the GR-1 stands 165 cm tall, weighs 55 kg, and utilizes 44 joint motors delivering a maximum joint torque of 230 Nm with an operational walking speed of 5 km/h. In 2024, Fourier announced its second-generation platform, the GR-2, scaling physical performance to a 175 cm, 63 kg form factor equipped with 53 joint motors, an improved internal cabling layout, and peak joint torque reaching 380 Nm. The GR-2 introduces 12-degree-of-freedom flexible dexterous hands and VR-based remote command integration to expand tactile manipulation. Official developer documentation has further referenced early development on the next-generation GR-3 platform. Across these iterations, Fourier positions the GRx series for academic research, medical assistance, and public service consultation, attempting to bridge clinical mechatronics into scalable embodied automation."
    claimRefs:
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE007"
      - "CE013"
  - id: "technology-architecture-and-developer-ecosystem"
    title: "Hardware Architecture, Aurora OS, and Developer Ecosystem"
    body: "Fourier's underlying technology stack rests upon proprietary high-torque mechatronics paired with an open-source software and simulation infrastructure. At the hardware foundation, Fourier Smart Actuators (FSA) integrate high-power density motors, precision planetary reducers, and multi-axis force sensors capable of delivering up to 380 Nm of torque with closed-loop feedback algorithms. On the software layer, Fourier maintains the Aurora (Advanced Unified Robot Operation and Resource Architecture) operating system, providing a standardized messaging bus, hardware abstraction, and Docker-based containerized secondary development guidance. Developer tooling is distributed through public code repositories that host the DexHand SDK for programmatic communication with 12-DOF dexterous manipulators, URDF-to-MJCF model converters, and training environments integrated with NVIDIA Isaac Gym and Isaac Sim for reinforcement learning-based bipedal locomotion. This unified stack enables researchers and clinical partners to develop custom task policies while isolating underlying joint dynamics."
    claimRefs:
      - "CE005"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "deployment-differentiation-and-technical-risks"
    title: "Deployment Reliability, Technical Differentiation, and Diligence Risks"
    body: "Fourier's primary technical differentiation stems from internalizing actuator design and possessing an established clinical deployment base, contrasting with pure-software humanoid entrants that lack hardware manufacturing know-how. The company's demonstrated ability to deliver 53-DOF mechatronics with 380 Nm torque reflects significant mechanical execution capabilities corroborated by growth equity partners like SoftBank Vision Fund and Prosperity7. However, substantial technical and diligence risks persist. Public documentation provides neither published mean time between failures (MTBF) figures nor continuous dynamic battery endurance data under loaded gait. Furthermore, while rehabilitation robots hold clinical footprints across Asian hospital networks, Fourier provides limited public disclosure regarding comprehensive Class II/III medical device clearance trajectories across Western regulatory jurisdictions (FDA 510(k), EU MDR), software cybersecurity penetration audits, or field failure logs, leaving enterprise reliability unverified."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE011"
      - "CE013"
      - "CE014"
