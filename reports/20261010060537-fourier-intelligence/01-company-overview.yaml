callouts:
  - calloutType: "risk"
    title: "Public scale data is not decision-grade"
    body: >-
      Funding differs by $146M across databases, institutional footprint differs by at
      least 1,000 accounts, and headcount differs by more than 16x. These values should
      remain ranges or conflicts until reconciled to company records with common entity,
      date, and denominator definitions.
    claimRefs: [CO009, CO010, CO012, CO013, CO014, CO015]
  - calloutType: "insight"
    title: "Rehabilitation heritage is the credible continuity"
    body: >-
      The strongest public identity is not a pure-play humanoid startup but a robotics
      company extending years of rehabilitation hardware and institutional workflow
      exposure into newer humanoid platforms.
    claimRefs: [CO003, CO004, CO016]
