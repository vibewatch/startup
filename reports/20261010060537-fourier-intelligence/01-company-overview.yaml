company:
  name: "Fourier Intelligence"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Fourier Intelligence is a private, Shanghai-based robotics company founded in 2015
    whose public identity spans an established rehabilitation portfolio and a newer
    general-purpose humanoid program. The strategic outline is consistent across the
    assigned evidence, but funding, customer footprint, headcount, leadership, and
    governance data remain too contradictory or incomplete to treat public scale
    figures as investment-grade ground truth.
sections:
  - id: "identity-and-business-model"
    title: "Identity and business model"
    body: >-
      The assigned sources consistently place Fourier Intelligence's founding in 2015
      and its operating center in Shanghai, while UpMarket confirms that it remained
      privately held as of March 2026. Its operating identity is broader than a single
      humanoid product: public profiles describe rehabilitation robots and exoskeletons
      sold into institutional care settings alongside the GR-series general-purpose
      humanoid platforms. That history supports a two-part business model in which
      rehabilitation equipment and related systems provide the nearer-term institutional
      channel, while humanoids serve as a newer platform and research proposition.
      KÜRE reports that the company formalized this split in 2024 as Fourier for
      general-purpose robotics and AI research and Fourier Rehab for rehabilitation
      technologies. This framing is credible as an operating description, not as proof
      of revenue mix, recurring economics, or a commercially scaled humanoid business.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: "leadership-and-governance"
    title: "Leadership and governance"
    body: >-
      Founder identity is directionally clear but current role attribution is not.
      KÜRE names Alex Gu as the founder, while Tracxn separately lists Jie Gu or Gu Jie
      as founder and CEO and Zen Koh as co-founder and CEO. The records may reflect
      translated names, regional entities, co-leadership, or stale database entries;
      the assigned evidence does not resolve which explanation is correct. EquityZen
      adds Zhen-Hua Xu as CTO and Suyang Zhang as a director, but provides no effective
      dates or reporting lines. Tracxn's board section is also internally difficult to
      reconcile: it says there are two active members while displaying additional
      obscured or malformed names. Investors should therefore treat public leadership
      lists as a lead for verification rather than a complete governance map. Current
      board composition, decision rights, succession coverage, and founder key-person
      dependence require company-supplied evidence.
    claimRefs: [CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: "capitalization-and-scale"
    title: "Capitalization and operating scale"
    body: >-
      Public scale figures diverge too widely to combine. Tracxn reports $83 million
      raised across seven rounds, whereas RobotHub reports $229 million and includes
      a $114 million Series E in January 2025 plus a $43 million Series E+ in August
      2025. RobotHub also attaches a $1.1 billion valuation to the August 2025 round.
      These are third-party database figures, not audited company disclosures, and the
      gap cannot be explained from the assigned evidence by currency conversion,
      primary-versus-secondary proceeds, or round labeling. The same caution applies
      to scale: independent profiles repeat a company-originated footprint of more than
      2,000 institutions and hospitals across more than 40 countries, while UpMarket
      says more than 1,000 institutional healthcare customers. Tracxn reports 48
      employees in late May 2026, but Humanoid Index reports 800-plus employees as of
      February 2026. The discrepancies may involve entity, business-unit, or methodology
      boundaries, but no source establishes a common denominator. Revenue, margins,
      cash, runway, customer concentration, and paid humanoid deployments remain
      undisclosed in the assigned pool.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014, CO015]
    tableRefs: [TO003]
  - id: "milestones-and-stage"
    title: "Milestones and current stage"
    body: >-
      Fourier's chronology shows a plausible progression from rehabilitation hardware
      toward humanoid platforms rather than an overnight category pivot. KÜRE dates a
      lower-limb exoskeleton prototype to 2016, the Fourier X1 launch to 2017, a bipedal
      humanoid-research transition to 2020, the Gen-1 prototype to 2022, GR-1 to 2023,
      and GR-2 to 2024. The same source dates the two-division brand structure to 2024,
      while RobotHub reports the later Series E+ financing in August 2025. The sequence
      supports technical continuity and a real rehabilitation heritage, but not
      commercial readiness of the humanoid line. ChoZan explicitly notes that CES 2026
      exposure did not prove hospital-scale deployment. Accordingly, the defensible
      stage characterization is a private robotics company with an institutional
      rehabilitation footprint and a humanoid program still requiring deployment,
      service-economics, safety, and outcome validation.
    claimRefs: [CO001, CO005, CO010, CO011, CO016]
    figureRefs: [FO001]
