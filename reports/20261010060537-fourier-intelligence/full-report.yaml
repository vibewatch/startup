      - number: '5.2'
        title: 'General-Purpose Humanoid Robotics: GRx Platform Evolution'
        blocks:
          - type: paragraph
            body: >-
              Leveraging nearly a decade of clinical actuator and motor control engineering, Fourier expanded into
              general-purpose embodied artificial intelligence with the GRx humanoid robot series. Introduced in 2023 as
              Fourier's first mass-produced bipedal humanoid platform, the GR-1 stands 165 cm tall, weighs 55 kg, and
              utilizes 44 joint motors delivering a maximum joint torque of 230 Nm with an operational walking speed of
              5 km/h. In 2024, Fourier announced its second-generation platform, the GR-2, scaling physical performance
              to a 175 cm, 63 kg form factor equipped with 53 joint motors, an improved internal cabling layout, and
              peak joint torque reaching 380 Nm. The GR-2 introduces 12-degree-of-freedom flexible dexterous hands and
              VR-based remote command integration to expand tactile manipulation. Official developer documentation has
              further referenced early development on the next-generation GR-3 platform. Across these iterations,
              Fourier positions the GRx series for academic research, medical assistance, and public service
              consultation, attempting to bridge clinical mechatronics into scalable embodied automation.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE007
              - CE013
      - number: '5.3'
        title: Hardware Architecture, Aurora OS, and Developer Ecosystem
        blocks:
          - type: paragraph
            body: >-
              Fourier's underlying technology stack rests upon proprietary high-torque mechatronics paired with an
              open-source software and simulation infrastructure. At the hardware foundation, Fourier Smart Actuators
              (FSA) integrate high-power density motors, precision planetary reducers, and multi-axis force sensors
              capable of delivering up to 380 Nm of torque with closed-loop feedback algorithms. On the software layer,
              Fourier maintains the Aurora (Advanced Unified Robot Operation and Resource Architecture) operating
              system, providing a standardized messaging bus, hardware abstraction, and Docker-based containerized
              secondary development guidance. Developer tooling is distributed through public code repositories that
              host the DexHand SDK for programmatic communication with 12-DOF dexterous manipulators, URDF-to-MJCF model
              converters, and training environments integrated with NVIDIA Isaac Gym and Isaac Sim for reinforcement
              learning-based bipedal locomotion. This unified stack enables researchers and clinical partners to develop
              custom task policies while isolating underlying joint dynamics.
            claimRefs:
              - CE005
              - CE007
              - CE008
              - CE009
              - CE010
