      - number: '5.4'
        title: Deployment Reliability, Technical Differentiation, and Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              Fourier's primary technical differentiation stems from internalizing actuator design and possessing an
              established clinical deployment base, contrasting with pure-software humanoid entrants that lack hardware
              manufacturing know-how. The company's demonstrated ability to deliver 53-DOF mechatronics with 380 Nm
              torque reflects significant mechanical execution capabilities corroborated by growth equity partners like
              SoftBank Vision Fund and Prosperity7. However, substantial technical and diligence risks persist. Public
              documentation provides neither published mean time between failures (MTBF) figures nor continuous dynamic
              battery endurance data under loaded gait. Furthermore, while rehabilitation robots hold clinical
              footprints across Asian hospital networks, Fourier provides limited public disclosure regarding
              comprehensive Class II/III medical device clearance trajectories across Western regulatory jurisdictions
              (FDA 510(k), EU MDR), software cybersecurity penetration audits, or field failure logs, leaving enterprise
              reliability unverified.
            claimRefs:
              - CE004
              - CE005
              - CE011
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Dual-Track Transition from Clinical Rehabilitation to Embodied Humanoids
            body: >-
              Fourier's 2024 formal restructuring into Fourier (general-purpose robotics) and Fourier Rehab (clinical
              technologies) illustrates a capital-efficient technology transfer model. Core competencies developed over
              nearly a decade of commercial rehabilitation engineering—notably modular high-torque Fourier Smart
              Actuators (FSA), multi-axis force sensors, and closed-loop motor control algorithms—form the direct
              hardware and firmware foundation for the GR-1 and GR-2 humanoid bipedal platforms.
            calloutType: insight
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE006
          - type: callout
            title: Under-Disclosed Hardware Reliability and Multi-Jurisdiction Certification Boundaries
            body: >-
              While Fourier documents significant mechanical milestones with 53 joint motors and 380 Nm peak torque on
              the GR-2, public disclosures omit standardized MTBF hardware reliability metrics, battery endurance
              benchmarks under continuous dynamic gait, and formal medical device compliance clearances outside baseline
              Asian hospital channels. For institutional healthcare buyers and industrial automation underwriters,
              independent verification of safety interlocks, component lifetime, and data governance standards remains
              an essential diligence prerequisite.
            calloutType: risk
            claimRefs:
              - CE004
              - CE011
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Institutional Healthcare Foundation vs. Emerging Embodied AI Piloting
        blocks:
          - type: paragraph
            body: >-
              Fourier Intelligence's commercial revenue and customer relationships divide sharply between its mature
              clinical rehabilitation business and its emerging humanoid robotics operations. Under the Fourier Rehab
              brand, the company serves more than 2,000 healthcare institutions, rehabilitation centers, and specialized
              therapy clinics spanning over 40 countries and regions. The economic buyers within this primary segment
              are hospital procurement directors, rehabilitation clinic administrators, and clinical research department
              heads seeking robotic automation to alleviate therapist shortages in neurological, orthopedic, and
              post-stroke physical recovery. In contrast, Fourier's general-purpose humanoid robotics division targets a
              speculative mix of university research laboratories, embodied AI developers, and institutional eldercare
              providers. These newer customer engagements remain pre-commercial or exploratory, relying on demonstration
              units and evaluation pilots rather than multi-year recurring SaaS or equipment service contracts.
            claimRefs:
              - CU001
              - CU002
