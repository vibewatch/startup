      - number: '6.2'
        title: Clinical Installed Base Trajectory and Humanoid Delivery Status
        blocks:
          - type: paragraph
            body: >-
              Fourier's historical customer adoption trajectory began in 2015 with lower-limb rehabilitation
              exoskeletons, scaling through upper-limb therapy robots like the ArmMotus series and integrated clinic
              installations termed RehabHub. Independent industry registries document that Fourier's overall
              organizational stage sits at pilot delivery for its broader general-purpose humanoid systems, having
              progressed from the GR-1 release in 2023 to the GR-2 in 2024 and GR-3 demonstrations in 2025 and 2026.
              While the company reports over 2,000 clinical organizational deployments globally, tracking databases
              record zero disclosed recurring annual contract values, customer retention rates, or unit volume
              distributions across geographic territories. The adoption curve for the humanoid portfolio remains in
              developer-access and research-bench phases, where units are placed with university consortia and technical
              partners rather than driving high-volume enterprise rollouts.
