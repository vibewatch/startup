  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Commercial Roots, and Financing History
        blocks:
          - type: paragraph
            body: >-
              Fourier Intelligence was founded in 2015 in Shanghai with the objective of developing advanced medical
              rehabilitation robotics and exoskeletons. Over the subsequent decade, the company successfully
              commercialized a portfolio of upper- and lower-limb rehabilitation systems, culminating in a global
              clinical footprint serving more than 2,000 hospitals and healthcare facilities across 40 countries. This
              clinical hardware foundation differentiates Fourier from pure-play humanoid robotics peers that possess
              neither commercial revenue nor regulated deployment history. Between 2018 and 2025, Fourier raised more
              than $200 million in cumulative equity financing across multiple institutional rounds. Crucial milestones
              included a $62 million Series D financing in January 2022 led by SoftBank Vision Fund 2 with participation
              from Prosperity7 Ventures and Visionplus Capital, followed by a 2025 Series E round that established a
              reported post-money valuation anchor of approximately $1.1 billion. While this funding trajectory
              demonstrates sustained investor demand and strategic support from both international venture funds and
              municipal investment vehicles, the company has operated without disclosing audited annual revenues, cash
              burn rates, or gross margin figures, making entry valuation underwriting unusually reliant on private
              market signaling rather than audited fundamentals.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
      - number: '8.2'
        title: Recommendation, Risk Assessment, and Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              We conclude that Fourier Intelligence warrants a research-more recommendation with a high risk rating and
              a stretched valuation stance. The investment thesis hinges on Fourier's dual-market sequence: using its
              established rehabilitation distribution channels, clinical credibility, and high-performance actuator
              technologies to commercialize general-purpose care humanoids. In 2024, the company formalized this
              strategy by restructuring into two distinct operating divisions: Fourier Rehab, dedicated to clinical
              therapy robotics, and Fourier, focused on embodied artificial intelligence and humanoid platforms
              including the GR-1, GR-2, and GR-3 care bots. However, the anti-thesis carries substantial weight.
              Humanoid care robotics remains in early pilot testing with zero public evidence of recurring annual
              contracts, volume customer purchase orders, or positive unit gross margins. Furthermore, media releases
              highlighting defense and military robotics applications present severe geopolitical and regulatory
              friction, creating potential barriers to international clinical procurement across North American and
              European healthcare systems. At an effective $1.1 billion private valuation anchor, capital allocation
              cannot be justified until management provides auditable commercial traction metrics and clears dual-use
              perception risks.
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV008
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV012
      - number: '8.3'
        title: Peer Comps, Multiple Compression, and Scenario Modeling
        blocks:
          - type: paragraph
            body: >-
              Evaluating Fourier against global peers reveals a stark divergence between private humanoid multiples and
              commercial hardware realities. In the humanoid sector, bipedal robotics developers such as 1X Technologies
              have secured over $125 million in funding, whereas Agility Robotics and Apptronik have raised
              substantially larger capital pools to target high-throughput industrial and logistics automation.
              Fourier's total equity raised of over $200 million places it among well-funded global challengers, yet its
              stated focus on healthcare care-interaction rather than industrial material handling demands different
              operating economics. Traditional medical device and rehabilitation hardware comps trade at modest
              multiples of 2.5x to 5.0x next-twelve-months revenue due to procurement cycle friction, whereas AI-driven
              robotics platforms frequently seek venture valuations exceeding 10x revenue. In our base-case scenario,
              multiple compression toward 4x to 5x revenue yields an intrinsic valuation of $700 million to $900
              million, indicating a 20% to 35% downside from the Series E headline anchor. In a bear-case scenario
              characterized by domestic medical pricing pressure and export-control restrictions, valuation could
              compress to $350 million to $450 million. Conversely, our bull case of $1.8 billion to $2.2 billion
              requires verifiable commercial adoption of the GR3 care bot alongside sustained 30%+ rehabilitation
              revenue expansion.
            claimRefs:
              - CV006
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
              - CV010
              - CV011
      - number: '8.4'
        title: Exit Readiness, Pre-IPO Liquidity, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Fourier Intelligence's exit readiness remains constrained by financial opacity, cap table complexity, and
              cross-border regulatory considerations. While pre-IPO shares and secondary market liquidity avenues have
              surfaced on platforms such as EquityZen, lack of standardized financial disclosures prevents institutional
              secondaries from clearing at transparent prices. The company's expansion to 800+ employees and
              establishment of 17 international joint research laboratories in cities such as Singapore, Chicago,
              Phoenix, Zurich, Melbourne, and Madrid demonstrate operational scale, but also imply substantial ongoing
              operational expenditures and monthly cash burn. Potential public listing paths on the Shanghai STAR Market
              or Hong Kong Stock Exchange will require rigorous scrutiny of revenue recognition policies, customer
              concentration, and state subsidy dependence. To transition from a research-more posture to a buy
              recommendation, prospective investors must execute four non-negotiable diligence asks: obtaining
              multi-year audited financial statements, verifying customer-level contract values and gross margins for
              the rehabilitation division, inspecting committed purchase agreements for GR series humanoids, and
              receiving legal confirmation regarding the strict civilian segregation of its robotics IP.
            claimRefs:
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Diligence Recommendation: Research-More at Current Mark'
            body: >-
              Fourier Intelligence presents a strong clinical foundation with more than 2,000 institutional hospital
              deployments across 40 countries, distinguishing it from purely conceptual humanoid robotics peers.
              However, the private market valuation mark of $1.1B (RMB 8.0B) reflects aggressive expectations for
              humanoid care commercialization that are not yet corroborated by public financial audits, paid unit
              deployment contracts, or disclosed gross margins. Investors should maintain a research-more stance until
              verifiable unit economics and recurring revenue proof are established.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV005
              - CV006
          - type: callout
            title: Valuation Downside and Dual-Use Geopolitical Exposure
            body: >-
              The confluence of high capital expenditure in humanoid robotics R&D, undisclosed cash burn rates, and
              emerging claims regarding military-grade robotic applications poses material downside risk. In a base-case
              multiple compression scenario, lack of recurring software revenue could force a 20% to 40% valuation
              haircut against late-stage private marks, while defense-related perceptions threaten international
              commercial sales across Western healthcare markets.
            calloutType: risk
            claimRefs:
              - CV004
              - CV007
              - CV010
