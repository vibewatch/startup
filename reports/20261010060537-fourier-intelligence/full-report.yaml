      - number: '6.3'
        title: Institutional Collaborations, Clinical Validation, and Ecosystem Ties
        blocks:
          - type: paragraph
            body: >-
              Publicly verifiable customer deployments and strategic technical collaborations are concentrated in
              research and academic healthcare networks. In May 2026, Fourier formalized strategic agreements with
              Singapore's National Healthcare Group (NHG Health) and Japan's Nagoya University during the Global Summit
              on Rehabilitation and Assistive Technology. The partnership with NHG Health builds on joint work initiated
              in 2021, including a September 2025 clinical initiative with health startup injewelme evaluating GRx
              humanoids for contactless vital sign monitoring via remote photoplethysmography. At Nagoya University,
              Fourier's ArmMotus EMU upper-limb rehabilitation robot is deployed for clinical muscle synergy analysis.
              Beyond clinical trials, Fourier's 2026 'Technology + Ecosystem' initiative engages hardware and
              integration partners such as Singularity Intelligent Control, Shenzhen Yita Power Technology, Yihang
              Lingguang, and Shanghai Runke Juneng to test embodied AI models and industrial payloads. However, these
              technology showcases and joint research centers have not demonstrated enterprise-wide software
              subscription revenues or commercial production SLAs.
            claimRefs:
              - CU010
