      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Founder identity is directionally clear but current role attribution is not. KÜRE names Alex Gu as the
              founder, while Tracxn separately lists Jie Gu or Gu Jie as founder and CEO and Zen Koh as co-founder and
              CEO. The records may reflect translated names, regional entities, co-leadership, or stale database
              entries; the assigned evidence does not resolve which explanation is correct. EquityZen adds Zhen-Hua Xu
              as CTO and Suyang Zhang as a director, but provides no effective dates or reporting lines. Tracxn's board
              section is also internally difficult to reconcile: it says there are two active members while displaying
              additional obscured or malformed names. Investors should therefore treat public leadership lists as a lead
              for verification rather than a complete governance map. Current board composition, decision rights,
              succession coverage, and founder key-person dependence require company-supplied evidence.
            claimRefs:
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
              - CO008
      - number: '1.3'
        title: Capitalization and operating scale
        blocks:
          - type: paragraph
            body: >-
              Public scale figures diverge too widely to combine. Tracxn reports $83 million raised across seven rounds,
              whereas RobotHub reports $229 million and includes a $114 million Series E in January 2025 plus a $43
              million Series E+ in August 2025. RobotHub also attaches a $1.1 billion valuation to the August 2025
              round. These are third-party database figures, not audited company disclosures, and the gap cannot be
              explained from the assigned evidence by currency conversion, primary-versus-secondary proceeds, or round
              labeling. The same caution applies to scale: independent profiles repeat a company-originated footprint of
              more than 2,000 institutions and hospitals across more than 40 countries, while UpMarket says more than
              1,000 institutional healthcare customers. Tracxn reports 48 employees in late May 2026, but Humanoid Index
              reports 800-plus employees as of February 2026. The discrepancies may involve entity, business-unit, or
              methodology boundaries, but no source establishes a common denominator. Revenue, margins, cash, runway,
              customer concentration, and paid humanoid deployments remain undisclosed in the assigned pool.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
