  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Institutional rehabilitation demand
        - Hospitals and institutions across reported markets
        - Buyers, users, and clinical reference base
        - Not disclosed
        - Budget or tender delays reduce cash generation and reference activity
        - Potentially high if concentrated
        - Reported geographic breadth may diversify exposure, but payer mix is unknown
        - No customer-level revenue, renewal, or distributor schedule
      - - External growth capital
        - Investors named in public funding profiles
        - Finance product development and commercialization
        - Cap table and investor terms not disclosed
        - Financing delay or restrictive terms interrupt the next milestone
        - Potentially high if runway is short
        - Multiple historical rounds show access to capital, not current availability
        - Audited cash, burn, debt, preferences, and milestone-linked financing needs are missing
      - - Compute, software, and research ecosystem
        - Semiconductor vendors and external technical ecosystems
        - Compute supply and capabilities outside core body control
        - Not disclosed
        - Supply restrictions or slower external-model progress weaken product delivery
        - Conditional on single-source exposure
        - Product and developer ecosystem breadth may provide alternatives
        - Named vendors, switching cost, contractual protections, and qualified substitutes are unavailable
