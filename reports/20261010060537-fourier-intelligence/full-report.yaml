      - number: '7.4'
        title: Monitoring priorities and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposures are the evidence gaps themselves. Before investment, Fourier should provide
              model-level regulatory approvals, safety and cybersecurity assessments, paid humanoid deployment records,
              field-reliability cohorts, audited segment financials, a current cash bridge, and customer and supplier
              concentration schedules. Thesis-break triggers should be measurable: failure to validate required
              certifications before target-market deployment; failure to reconcile commercial-stage claims with paid
              acceptance records; field reliability or safety performance outside contractual thresholds; a runway that
              cannot fund the next independently verified commercialization milestone; or concentration above the
              investment committee's approved limit without a credible second source or replacement customer. Until
              those tests are completed, risk severity remains conditional rather than numerically estimated.
