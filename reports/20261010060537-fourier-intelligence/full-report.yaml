      - number: '7.2'
        title: Operational risk is driven by disclosure gaps and external dependencies
        blocks:
          - type: paragraph
            body: >-
              The operational risk is not a proven field-failure event; it is the inability to quantify reliability and
              supplier exposure from the available evidence. One independent analysis characterizes Fourier as stronger
              in body control than foundation models, describes semiconductors as primarily externally procured, and
              says specialized cybersecurity differentiation is not highlighted publicly. Those observations point to
              diligence priorities, not verified single-source dependencies. Public profiles also conflict on whether
              the humanoid business is at pilot delivery or commercial status. Without unit shipments, acceptance
              criteria, mean time between failures, warranty cost, uptime, or critical-component sourcing, neither
              production readiness nor residual safety exposure can be scored with confidence.
            claimRefs:
