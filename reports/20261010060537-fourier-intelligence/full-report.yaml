      - number: '4.2'
        title: Cost Structure, Unit Economics, and Margin Drivers
        blocks:
          - type: paragraph
            body: >-
              The cost structure of Fourier's rehabilitation hardware is driven by multi-axis actuator components,
              sensor arrays, specialized medical-grade materials, and rigorous clinical assembly standards. For advanced
              humanoid robots such as GR-1 and GR-2, bill-of-materials costs escalate due to the inclusion of 44 to 53
              joint motors, high-torque FSA actuators, 12-DOF flexible hands, and embedded perception compute modules.
              Selling into institutional healthcare systems introduces extended procurement timelines, distributor
              margin splits, and ongoing clinical training requirements that elevate effective customer acquisition and
              service-delivery costs. Because Fourier maintains a private disclosure profile, precise component-level
              bills of materials, realized gross margins, and field maintenance costs remain confidential, necessitating
              conservative margin assumptions for underwriting.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI016
      - number: '4.3'
        title: Commercial Traction Proxies and Metric Disclosures
        blocks:
          - type: paragraph
            body: >-
              Public indicators of commercial traction reflect Fourier's strong institutional presence in medical
              rehabilitation, where company statements report partnerships and service relationships with over 2,000
              hospitals and rehabilitation centers worldwide. Tracking data across independent industry aggregators
              reveals significant divergence in operational scale: while specialized robotics indices estimate Fourier's
              workforce at over 800 employees globally as of early 2026, corporate directory services like Owler record
              estimated annual revenues below $1M and employee counts under 10, and Tracxn reports 48 employees in its
              Singapore entity. These sharp discrepancies highlight the opacity of private Chinese robotics ventures
              where entity-level filings in Singapore or offshore holding structures capture only partial operational
              footprints. Detailed revenue figures and financial statements remain accessible only via private secondary
              platforms.
            claimRefs:
              - CI002
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Capital Adequacy, Cash Runway, and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              Fourier Intelligence has demonstrated consistent fundraising capability, securing a reported $229M in
              cumulative equity capital across seven financing rounds since its 2015 founding. Recent capitalization
              includes an August 2025 Series E+ round of $43M led by Runyang Technology at an indicated $1.1B valuation,
              following a $114M Series E round in January 2025 backed by state-linked and institutional investors
              including Guoxin Investment and Prosperity7 Ventures. This capital influx provides substantial
              balance-sheet runway to sustain dual R&D tracks in embodied AI and medical robotics. Nevertheless, the
              commercial viability of humanoid robotics in unstructured healthcare and eldercare environments remains
              unproven at scale, with independent market analyses noting that repeatable procurement, maintenance
              operations, and service economics have yet to be validated. The absence of audited financials constitutes
              a key diligence blocker.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Complete Opacity on Core Unit Economics and Gross Margins
            body: >-
              While Fourier Intelligence has established commercial distribution in over 2,000 healthcare institutions,
              the company publishes no audited revenue, gross margin, or bill-of-materials data. Without verified unit
              contribution margins or sales efficiency metrics, commercial scalability cannot be underwritten.
            calloutType: risk
            claimRefs:
              - CI005
              - CI006
              - CI016
          - type: callout
            title: Dual-Track Capital Allocation Creates Asymmetric R&D Burn
            body: >-
              Fourier's expansion from commercial rehabilitation robotics into humanoid platforms (GR-1, GR-2, GR3)
              introduces substantial capital intensity. Sustaining general-purpose embodied AI R&D and 53-DOF actuator
              development requires continuous capital market access beyond rehabilitation cash flows.
            calloutType: insight
            claimRefs:
