              - CI013
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Clinical Rehabilitation Robotics
        blocks:
          - type: paragraph
            body: >-
              Fourier defines its clinical product portfolio around patient physical rehabilitation and functional motor
              recovery. Originally founded in Shanghai in 2015 with a focus on robotic exoskeletons and orthoses, the
              company restructured in July 2024 into two dedicated operational divisions: Fourier, dedicated to
              general-purpose robotics and artificial intelligence research, and Fourier Rehab, housing its medical
              rehabilitation technologies. The clinical division delivers specialized robotic hardware targeting
              distinct anatomical zones, including upper-limb therapeutic manipulators such as the ArmMotus M2 Pro and
              WristMotus M1W, alongside lower-limb robotic exoskeletons such as the ExoMotus M4. These devices integrate
              into RehabHub, a unified clinical platform designed to connect multi-device training suites, automate
              biofeedback tracking, and standardize therapeutic exercise protocols across inpatient and outpatient care
              environments. Beyond conventional clinical stations, Fourier commercializes balance coordination systems
              and the MetaMotus Galileo virtual reality environment, which simulates activities of daily living to
              evaluate biomechanical stability. Company records indicate these rehabilitation platforms serve more than
              2,000 hospitals and rehabilitation institutions across over 40 countries and regions.
            claimRefs:
