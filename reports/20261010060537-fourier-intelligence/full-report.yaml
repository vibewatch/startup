      - number: '1.4'
        title: Milestones and current stage
        blocks:
          - type: paragraph
            body: >-
              Fourier's chronology shows a plausible progression from rehabilitation hardware toward humanoid platforms
              rather than an overnight category pivot. KÜRE dates a lower-limb exoskeleton prototype to 2016, the
              Fourier X1 launch to 2017, a bipedal humanoid-research transition to 2020, the Gen-1 prototype to 2022,
              GR-1 to 2023, and GR-2 to 2024. The same source dates the two-division brand structure to 2024, while
              RobotHub reports the later Series E+ financing in August 2025. The sequence supports technical continuity
              and a real rehabilitation heritage, but not commercial readiness of the humanoid line. ChoZan explicitly
              notes that CES 2026 exposure did not prove hospital-scale deployment. Accordingly, the defensible stage
              characterization is a private robotics company with an institutional rehabilitation footprint and a
              humanoid program still requiring deployment, service-economics, safety, and outcome validation.
