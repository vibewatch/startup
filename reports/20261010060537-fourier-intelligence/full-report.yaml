  - id: FE001
    title: Product Architecture Map
    type: stack
    summary: >-
      Six-layer technological architecture of Fourier's robotics ecosystem from physical mechatronics to clinical and
      embodied AI workflows.
    data:
      layers:
        - label: 'Layer 6: Physical Mechatronics & Actuation'
          detail: >-
            Fourier Smart Actuators (FSA) delivering up to 380 Nm peak joint torque, 12-DOF dexterous hands, custom
            motor drives, multi-axis force sensors, and modular exoskeleton structural frames.
        - label: 'Layer 5: Joint Control & Low-Level SDK'
          detail: >-
            Embedded motor firmware, closed-loop force and position feedback algorithms, and the DexHand SDK for
            deterministic communication with dexterous manipulators.
        - label: 'Layer 4: Operating System & Middleware (Aurora)'
          detail: >-
            Fourier Aurora (Advanced Unified Robot Operation and Resource Architecture) operating system, real-time
            message bus, and Docker containerized development environments.
        - label: 'Layer 3: Simulation & Embodied AI Training'
          detail: >-
            NVIDIA Isaac Gym and Isaac Sim virtual training environments, URDF-to-MJCF model conversion pipelines, and
            reinforcement learning policy generation.
        - label: 'Layer 2: Interaction & Teleoperation Layer'
          detail: >-
            VR-based remote control and command systems, emotional interaction display modules, environmental sound
            recognition, and multimodal perception stacks.
        - label: 'Layer 1: Clinical Platform & Applications (RehabHub & GRx)'
          detail: >-
            RehabHub multi-device centralized clinical rehabilitation protocols, MetaMotus Galileo biomechanical VR
            simulations, and general-purpose service workflows.
    claimRefs:
      - CE002
      - CE005
      - CE007
      - CE008
      - CE009
      - CE010
  - id: FU001
    title: Fourier Intelligence Customer Adoption and Expansion Journey
    type: journey-map
    summary: Visualizes customer progression from clinical therapy adoption to prospective embodied humanoid deployment.
    data:
      items:
        - label: Clinical Discovery & Evaluation
          buyer: Hospital Rehab Directors
          action: Evaluates exoskeleton devices (ArmMotus, ExoMotus) against manual therapy staffing shortages.
          touchpoints:
            - Medical conferences (MEDICA, RehabWeek)
            - Academic literature on stroke recovery
          hurdle: Stringent medical device certification and clinical trial scrutiny.
        - label: Institutional Department Deployment
          buyer: Clinical Operations & Therapy Leads
          action: Procures standalone therapy robots or installs integrated RehabHub clinic suites.
          touchpoints:
            - Hospital procurement tender process
            - Staff therapist training protocols
          hurdle: Capital budget availability and regional healthcare reimbursement approval.
        - label: Collaborative Clinical Innovation
          buyer: University Hospitals & Research Consortia
          action: Establishes joint research centers for muscle synergy analysis and sensor integration.
          touchpoints:
            - Joint Innovation Centers (e.g. NHG Health, Nagoya Univ)
            - Clinical study publications
          hurdle: Translation from grant-funded research to standard-of-care clinical practice.
        - label: Embodied Humanoid Pilot Exploration
          buyer: Innovation Labs & Eldercare Groups
          action: Deploys GR-2 or GR-3 humanoid prototypes for contactless monitoring and companion testing.
          touchpoints:
            - WAIC and WRC exhibition demos
            - Controlled eldercare living lab trials
          hurdle: Safety liability, lack of proven caregiver ROI, and steep unit costs.
        - label: Scalable Enterprise Care Integration
          buyer: Healthcare Network Executives
          action: Prospective deployment of multi-robot fleets combining therapy devices and autonomous care assistants.
          touchpoints:
            - Enterprise fleet management software
            - Long-term maintenance and SLA contracts
          hurdle: Unproven economic viability, zero public reference customers at fleet scale.
        - label: Continuous Care Data Optimization
          buyer: Health System CIOs & Research Directors
          action: Aggregates multi-facility patient rehabilitation metrics and embodied interaction logs across care networks.
          touchpoints:
            - Cloud data infrastructure review
            - Periodic clinical efficacy audits
          hurdle: Cross-border medical data privacy rules and EHR integration friction.
    approximationNotes: Stages reflect institutional adoption phases derived from clinical sales processes and 2026 partner disclosures.
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU008
      - CU010
      - CU015
