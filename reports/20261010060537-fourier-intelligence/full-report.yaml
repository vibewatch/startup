  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Spend Taxonomy, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Evaluating Fourier Intelligence requires establishing clear boundaries between its established
              rehabilitation robotics business and its newer embodied AI humanoid initiative. In clinical
              rehabilitation, the addressable spend encompasses upper- and lower-limb robotic therapy devices,
              exoskeleton gait trainers, and connected clinical therapy management software such as RehabHub. This
              clinical boundary excludes non-robotic orthotics, general patient monitoring hardware, and robotic
              surgical systems. In this primary domain, Fourier competes against traditional physical therapy regimens,
              manual passive exercise equipment, and incumbent rehabilitation robotics manufacturers. Conversely,
              Fourier's humanoid program—anchored by the GR-1, GR-2, and recently unveiled GR-3 platforms—targets an
              aspirational market for care assistance, institutional companionship, and light industrial support. This
              secondary segment aims to address caregiver shortages in eldercare and hospital wards, yet it must contend
              with status-quo substitutes including specialized medical carts, fixed automation, and human staff.
              Conflating these two operational categories obscures commercial realities: Fourier Rehab operates as an
              established medical device provider with regulatory clearances and an installed base across 2,000
              institutions in 40 countries, whereas the humanoid business remains an R&D venture seeking its first
              validated paid customer deployment.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM010
      - number: '2.2'
        title: Addressable Market Sizing Across Rehabilitation and Embodied Care
        blocks:
          - type: paragraph
            body: >-
              Sizing Fourier's addressable opportunity requires distinct lenses rather than relying on a single broad
              total addressable market estimate. The global medical rehabilitation robotics market represents an
              established addressable market of $2.5 billion to $3.8 billion, expanding at approximately 18.5% annually
              driven by post-stroke care needs and expanding aging demographics across East Asia, Europe, and North
              America. Within this envelope, Fourier's serviceable addressable market centers on institutional
              neurorehabilitation and physical therapy clinics, where its proprietary compliant actuators and therapy
              devices address dedicated inpatient and outpatient budgets. In contrast, estimates for general
              professional service robotics span $28.0 billion to $35.0 billion, but this figure is overwhelmingly
              dominated by warehouse automated guided vehicles and commercial cleaning robots rather than humanoid
              embodiments. Promoters often cite China's national humanoid policy targets projecting an embodied AI
              market exceeding RMB 20 billion, yet these projections aggregate state subsidies and speculative
              manufacturing deployments rather than validated commercial revenues. Crucially, while third-party
              estimates suggest list prices for platforms like the GR-2 range from $100,000 to $150,000, public evidence
              confirms zero paying customers for Fourier's humanoid units. Underwriting Fourier therefore requires
              anchoring near-term valuation on verifiable rehabilitation equipment market share while treating humanoid
              market sizing as an unvalidated call option.
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM011
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM008
              - CM011
              - CM013
              - CM014
      - number: '2.3'
        title: Institutional Buyer, User, and Payer Dynamics
        blocks:
          - type: paragraph
            body: >-
              Purchasing dynamics for Fourier's products vary sharply across customer segments. In the core
              rehabilitation device segment, the buyer is typically a hospital procurement committee or rehabilitation
              department head, whereas the daily users are physical therapists, physiatrists, and recovering patients.
              Payer dynamics rely on national health insurance schemes, workers' compensation funds, or private medical
              insurers reimbursing defined physical therapy codes. The multi-million-yuan fleet installation at
              Malaysia's Sultan Nazrin Shah PERKESO Rehabilitation Center illustrates this institutional model, where a
              sovereign social security organization procured Fourier devices for a 55-acre facility designed to treat
              up to 700 patients. Here, adoption triggers center on verifiable patient throughput, therapist
              productivity gains, and objective recovery tracking. By contrast, in the emerging eldercare and
              care-companion humanoid market, prospective buyers are assisted living operators, municipal nursing homes,
              and research hospitals. These buyers face fundamentally different budget constraints, paying out of
              general operating margins or research innovation grants rather than established clinical insurance billing
              codes. Without standardized reimbursement or documented labor displacement metrics, humanoid adoption in
              care facilities remains confined to exploratory pilot programs and promotional demonstrations.
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM007
              - CM012
      - number: '2.4'
        title: Commercial Catalysts and Structural Deployment Bottlenecks
        blocks:
          - type: paragraph
            body: >-
              Adoption of Fourier's technology is driven by acute macroeconomic forces but throttled by stringent
              operational constraints. Growth is supported by accelerating demographic aging across East Asia and
              Europe, an acute global deficit of qualified physical therapists, and favorable industrial policies
              promoting embodied AI in China. Fourier's dual-market positioning attempts to leverage its clinical
              rehabilitation heritage, therapist workflow relationships, and human-robot physical interaction know-how
              to accelerate care humanoid acceptance. However, adoption constraints in patient-facing humanoid
              applications remain formidable. Clinical environments impose rigorous medical device safety standards,
              strict infection control requirements, and unresolved legal liability frameworks governing physical
              robot-patient contact. Furthermore, hardware limitations, including a three-hour battery duration per
              charge and unverified claims of continuous hot-swappable operation, impede autonomous 24/7 hospital ward
              staffing. While institutional partnerships with bodies such as Singapore's NHG Health and Japan's Nagoya
              University establish research dialogue, they do not bridge the gap to autonomous commercial deployment.
              Until Fourier demonstrates clinical outcome superiority and measurable economic returns in production
              settings, care humanoid adoption will encounter severe institutional resistance.
            claimRefs:
              - CM007
              - CM008
              - CM010
              - CM012
              - CM013
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Two-Business Valuation Conundrum
            body: >-
              Underwriting Fourier Intelligence requires strict separation between its commercial rehabilitation
              franchise and its humanoid R&D program. While the rehabilitation business has achieved genuine
              international scale across 2,000+ clinical institutions, using that footprint to justify humanoid
              commercialization assumes hospital procurement cycles and medical device regulatory pathways that have not
              yet been demonstrated for autonomous bipedal systems.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM013
          - type: callout
            title: Autonomous Care Deployment Timelines
            body: >-
              Institutional healthcare procurement for autonomous humanoid robots faces extended validation hurdles.
              Even with research agreements at premier institutions such as Singapore's NHG Health and Japan's Nagoya
              University, conversion to revenue-generating clinical deployments remains multi-year, exposing Fourier to
              competitive leapfrogging by well-capitalized robotics peers.
            calloutType: risk
            claimRefs:
              - CM007
              - CM008
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape & Category Segmentation
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape surrounding Fourier Intelligence divides into two distinct categories: incumbent
              rehabilitation and exoskeleton manufacturers on one side, and emerging general-purpose humanoid robotics
              platforms on the other. Traditional medical peers such as Otto Bock, Cyberdyne, and Wandercraft focus
              strictly on orthotics, mobility assistance, and clinical physical therapy, benefiting from established
              hospital procurement channels and regulatory medical device clearances. In contrast, prominent humanoid
              developers such as Figure, Agility Robotics, 1X Technologies, and Apptronik are optimizing bipedal robots
              for industrial automation, automotive assembly, and logistics payload transfer. Fourier occupies an
              uncommon intermediate position, leveraging its established institutional healthcare presence while
              extending into bipedal humanoids through its 2024 corporate split into Fourier and Fourier Rehab
              divisions. This dual positioning allows Fourier to rank 19th among 158 active robotics competitors tracked
              by Tracxn, placing 3rd in total funding raised behind larger industrial conglomerates.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: Technical Specifications & Clinical Differentiation
        blocks:
          - type: paragraph
            body: >-
              Fourier's technical differentiation stems directly from its rehabilitation robotics heritage rather than
              generic humanoid locomotion. Clinical therapy robots demand high-fidelity force feedback, compliant
              physical interaction, and absolute safety around vulnerable patients, capabilities that Fourier developed
              across its ArmMotus, ExoMotus, and CycleMotus therapy lines. These capabilities translate into the GR
              humanoid series, most notably in the GR-2, which features 53 degrees of freedom, 380 Newton-meter maximum
              joint torque, and 12-DOF flexible hands, and the newly unveiled GR-3 Care Bot. The GR-3 incorporates 55
              degrees of freedom, 31 distributed tactile pressure sensors, sound source localization, and
              automotive-grade foam padding. By prioritizing tactile sensitivity and human-robot interaction over raw
              payload capacity, Fourier differentiates its hardware from industrial peers whose rigid aluminum chassis
              and high-torque actuators are unsuitable for eldercare and patient contact.
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP011
              - CP013
      - number: '3.3'
        title: Commercial Pricing & Procurement Economics
        blocks:
          - type: paragraph
            body: >-
              Commercial pricing structures across Fourier's product catalog reflect a tiered hardware strategy spanning
              entry-level research units to high-end enterprise systems. According to Robot Price Index and RobotSourced
              catalog data, the lightweight Fourier N1 robot is positioned for sale between $16,000 and $40,000,
              creating an accessible entry platform for academic robotics labs and algorithm developers. The
              enterprise-grade GR-2 is quoted between $125,000 and $150,000 or higher, reflecting heavy-duty joint
              actuators and custom integration requirements for corporate research centers. The newer GR-3 Care Bot
              spans a wide published range from $27,500 to $120,000, varying significantly by regional distributor,
              sensor payload, and support package. However, verified commercial disclosures remain incomplete regarding
              recurring maintenance fees, software licensing, and specialized training packages, which typically
              represent a substantial portion of healthcare robotics total cost of ownership.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP014
      - number: '3.4'
        title: Moat Durability, Switching Costs & Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              Fourier's competitive durability is defended primarily by high institutional switching costs within its
              existing rehabilitation installed base of more than 2,000 hospitals across 40 countries. Hospitals that
              deploy Fourier's RehabHub interconnected therapy architecture invest heavily in therapist training,
              clinical protocol integration, and patient outcome tracking, creating friction against replacement by
              standalone devices. Furthermore, Fourier's commercial pivot toward the GR-3 Care Bot, highlighted at CES
              2026, establishes early mindshare in eldercare and hospital assistance before industrial humanoid makers
              develop clinical competencies. Nevertheless, Fourier faces serious displacement risks over a 3- to 5-year
              horizon. Well-capitalized humanoid competitors backed by global technology giants could commoditize
              bipedal locomotion hardware and develop compliant end-effectors, eroding Fourier's hardware margins if the
              company cannot establish proprietary software and clinical therapy workflows.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP011
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP011
              - CP012
              - CP013
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Clinical Moat Diverges From Industrial Humanoid Race
            body: >-
              While peers such as Figure and Agility compete on payload, speed, and warehouse navigation, Fourier's
              competitive moat is anchored in 2,000 hospital relationships and force-feedback rehabilitation data. This
              specialization insulates Fourier from direct factory-floor price wars but leaves its humanoid economics
              tethered to healthcare procurement cycles.
            calloutType: insight
            claimRefs:
              - CP003
              - CP004
              - CP011
              - CP012
          - type: callout
            title: Displacement Risk From Generalized Embodied AI Platforms
            body: >-
              As general-purpose humanoid platforms mature, aggressive cost declines and modular soft-contact
              manipulators could enable well-funded industrial humanoid manufacturers to enter eldercare and clinical
              assistance, challenging Fourier's hardware pricing power.
            calloutType: risk
            claimRefs:
              - CP002
              - CP003
              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Commercial Monetization
        blocks:
          - type: paragraph
            body: >-
              Fourier Intelligence generates commercial revenue primarily through the sale and clinical deployment of
              medical rehabilitation robotics, supported by its RehabHub software and clinical integration platforms.
              The company's established rehabilitation portfolio includes upper-limb devices such as the ArmMotus M2 Pro
              and lower-limb exoskeleton systems like the ExoMotus M4, which are marketed to hospitals, specialized
              neurorehabilitation clinics, and public care facilities across more than 40 countries. In recent years,
              Fourier has broadened its commercial scope by introducing general-purpose bipedal humanoid robots,
              beginning with the mass-produced GR-1 platform and expanding to the GR-2 and GR3 series. However, while
              rehabilitation devices represent an active clinical revenue stream, the humanoid robotics segment remains
              largely in pilot delivery and academic research development stages rather than producing scaled commercial
              recurring revenue.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
