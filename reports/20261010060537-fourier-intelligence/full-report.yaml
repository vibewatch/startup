chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              The assigned sources consistently place Fourier Intelligence's founding in 2015 and its operating center
              in Shanghai, while UpMarket confirms that it remained privately held as of March 2026. Its operating
              identity is broader than a single humanoid product: public profiles describe rehabilitation robots and
              exoskeletons sold into institutional care settings alongside the GR-series general-purpose humanoid
              platforms. That history supports a two-part business model in which rehabilitation equipment and related
              systems provide the nearer-term institutional channel, while humanoids serve as a newer platform and
              research proposition. KÜRE reports that the company formalized this split in 2024 as Fourier for
              general-purpose robotics and AI research and Fourier Rehab for rehabilitation technologies. This framing
              is credible as an operating description, not as proof of revenue mix, recurring economics, or a
              commercially scaled humanoid business.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
