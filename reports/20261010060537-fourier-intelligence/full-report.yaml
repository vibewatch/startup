  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Investment Thesis (Bull Perspective)
      - Anti-Thesis (Diligence / Bear Concern)
      - View-Changing Trigger
    rows:
      - - Commercial Foundation
        - >-
          Established installed base in 2,000+ hospitals across 40+ countries creates clinical stickiness and real rehab
          hardware revenues.
        - >-
          Hospital procurement is fragmented, long-cycle, and low-margin; hardware revenues do not translate to
          high-multiple SaaS recurring revenue.
        - >-
          Disclosure of audited ARR, high recurring service attachment rate (>40%), and sustained gross margins above
          60%.
      - - Humanoid Expansion
        - >-
          GR series leverage proven actuation, motor control, and rehab therapy datasets to lead in eldercare and
          service robotics.
        - >-
          General-purpose humanoids remain early-stage pilots and R&D demonstrators without verified institutional
          purchase orders or ROI proof.
        - Multi-unit commercial purchase contracts by Tier-1 hospital systems with verified ongoing maintenance revenue.
      - - Capital & Syndicate
        - >-
          Tier-1 institutional backing including SoftBank Vision Fund 2, Prosperity7 Ventures, and Shanghai municipal
          state-backed funds.
        - >-
          Substantial liquidation preferences, capital intensity of humanoid hardware manufacturing, and valuation
          multiple overhang.
        - >-
          Clean cap table disclosures with non-punitive liquidation preferences and audited multi-year runway >24
          months.
      - - Geopolitical & Regulatory
        - >-
          Dual-market positioning in China domestic care addresses acute demographic aging and state automation
          subsidies.
        - >-
          Military-grade robotics claims, defense exposure, and cross-border tech transfer restrictions risk export
          controls and Western market exclusion.
        - >-
          Independent audit confirming strict separation of healthcare civilian robotics from dual-use military
          applications.
    notes: >-
      Evaluations reflect comparative analysis of verified public healthcare disclosures against private valuation
      multiples and venture syndicate composition.
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV008
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operating & Growth Assumptions
      - Target Multiple & Implied Valuation
      - Key Downside / Upside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Rehab division maintains 30%+ annual growth while GR3 care humanoids achieve commercial hospital adoption;
          gross margin expands to 55%.
        - 8x-10x NTM revenue; Implied valuation of $1.8B-$2.2B via Shanghai STAR Market or Hong Kong IPO.
        - Rapid scale of domestic eldercare subsidies, foreign hospital uptake, and high software attachment.
        - 20% probability; contingent on China eldercare budget unlocking and commercial humanoid ramp.
      - - Base Case (Current View)
        - >-
          Rehab robotics delivers steady 15-20% revenue growth; humanoid programs remain pilot/R&D stage with modest
          unit deliveries; high R&D cash burn.
        - >-
          4x-5x NTM revenue; Implied valuation of $700M-$900M, reflecting hardware multiple compression against private
          anchor.
        - Sluggish institutional care adoption, state hospital budget caps, delayed humanoid monetization.
        - 55% probability; reflects present market reality and lack of disclosed recurring humanoid revenue.
      - - Bear Case
        - >-
          Domestic healthcare pricing pressure intensifies; humanoid R&D burns capital without scalable commercial
          deployments; export control headwinds.
        - 2x-3x NTM revenue; Implied valuation of $350M-$450M (50-70% down-round reset or recapitalization).
        - Western regulatory/export restrictions, intensified Chinese humanoid competition, liquidity shortfall.
        - 25% probability; driven by high capital intensity and vulnerability to geopolitical supply constraints.
    notes: >-
      Implied valuation ranges assume an estimated revenue baseline of $80M-$120M derived from reported 800+ employee
      headcount and historical Series D/E milestones.
    claimRefs:
      - CV009
      - CV010
      - CV011
