      - number: '6.4'
        title: Procurement Friction, Payer Dependency, and Commercial Opacity
        blocks:
          - type: paragraph
            body: >-
              Evaluating the durability of Fourier's customer relationships reveals material institutional risks.
              Hospital and clinical procurement cycles for capital-intensive rehabilitation hardware typically require 9
              to 18 months, subject to regional medical device certifications, hospital tender laws, and variable
              healthcare reimbursement schedules across municipal markets in China, Southeast Asia, and Europe.
              Third-party industry analyses explicitly highlight that Fourier has not demonstrated repeatable
              procurement economics, customer retention rates, net revenue retention (NRR), or maintenance contract
              renewal margins for humanoid deployments. Furthermore, because humanoid implementations in eldercare and
              hospital assistance interface directly with vulnerable populations, safety liability protocols, staff
              training burdens, and regulatory clearances introduce steep friction that prevents pilot projects from
              converting into permanent, multi-unit enterprise contracts. Lacking disclosed top-customer revenue
              concentration figures or distributor terms, Fourier's commercial base remains exposed to public healthcare
              capital expenditure budget volatility.
            claimRefs:
              - CU004
              - CU007
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Dual-Market Customer Bifurcation
            body: >-
              Fourier's commercial defensibility rests almost entirely on clinical institutional relationships built
              over a decade by Fourier Rehab, creating an installed base of 2,000+ facilities that prospective humanoid
              competitors cannot easily match. However, transferring these healthcare buyer relationships into paid
              humanoid adoption remains unproven, as hospital therapy budgets and IT/assistive robotics pilots operate
              under separate capital allocation committees.
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU004
          - type: callout
            title: Unverified Humanoid Unit Economics and Pilot Stagnation
            body: >-
              Despite high-profile demonstrations of the GR-3 humanoid at WAIC 2026, WRC 2026, and CES 2026, public
              evidence confirms zero multi-unit commercial production deployments or recurring maintenance contracts in
              home care or eldercare. Fourier's humanoid customer traction remains confined to academic research grants,
              joint clinical testbeds, and hardware ecosystem co-development.
            calloutType: risk
            claimRefs:
              - CU005
              - CU008
              - CU013
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, privacy, and safety evidence is incomplete
        blocks:
          - type: paragraph
            body: >-
              Fourier's public site presents both rehabilitation systems and robots intended for human collaboration,
              while independent profiles describe a broader move from medical rehabilitation into general-purpose
              robotics. That scope creates plausible device, workplace-safety, privacy, and cross-border compliance
              obligations, but the assigned evidence does not provide model-level registrations, certifications,
              incident records, recall history, or security-control detail. The official landing pages link ethics and
              personal-information statements, which is evidence of a policy surface rather than evidence that operating
              controls have been tested. No assigned adverse result documents litigation or enforcement, so likelihood
              cannot be inferred from silence. Investment approval should require primary regulatory records and a
              jurisdiction-by-jurisdiction product classification map.
            claimRefs:
