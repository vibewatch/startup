  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Evidence signal
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Pilot-to-commercial stage misclassification
        - RobotHub says Pilot Delivery; Humanoid Index says Commercial
        - Evidence conflict observed
        - High investment relevance
        - Not disclosed
        - Paid volume deployment and repeatability cannot be established
        - Units shipped, paid acceptance records, utilization, renewals, and cancellations
      - - Field reliability or safety failure
        - Product breadth is visible, but fleet uptime and failure cohorts are not
        - Not assessed
        - Potentially high for robots operating near people
        - Not disclosed
        - Warranty, recall, service-load, and deployment interruption exposure is unquantified
        - Mean time between failures, incident logs, warranty cost, and independent safety testing
      - - Critical-component supply interruption
        - One independent analysis describes semiconductors as primarily externally procured
        - Not assessed
        - Potentially high if single-sourced
        - No sourcing plan disclosed
        - Export controls, shortages, or supplier changes could affect production
        - Bill of materials, approved vendor list, geographic source map, buffer policy, and second-source qualification
      - - Cybersecurity weakness
        - Independent analysis says specialized differentiation is not highlighted publicly
        - Not assessed
        - Potentially high for connected care or enterprise systems
        - Public evidence insufficient
        - Architecture, vulnerability management, and fleet-update controls remain unverified
        - Security architecture review, penetration testing, disclosure policy, and signed-update evidence
    notes: >-
      Qualitative register based only on assigned public evidence; likelihood and severity are left unassessed unless
      the evidence supports the stated condition.
