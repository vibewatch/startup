      - number: '7.3'
        title: Counterparty and financing risk remain unquantified
        blocks:
          - type: paragraph
            body: >-
              Two secondary profiles repeat Fourier's claim of serving more than 2,000 institutions and hospitals across
              more than 40 countries, but that footprint does not reveal payer mix, distributor dependence, renewal,
              procurement duration, or top-customer concentration. Financing evidence is similarly inconsistent: public
              profiles report cumulative funding of $83 million, $229 million, and $234.88 million using undisclosed
              aggregation rules. These are funding-raised figures, not revenue, cash availability, or runway. Reported
              valuation references also differ in currency, date, and methodology and cannot be merged into one mark.
              The key financial risk is therefore continued capital intensity without audited segment economics, not a
              quantified burn estimate.
