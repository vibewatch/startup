    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Production Modalix and Palette adoption convert the partner network into auditable repeat revenue and improving margins.", "A strategic premium could be supportable, but no target return is calculable without a verified denominator.", "Execution, supply chain, and customer concentration.", "Low-to-medium: requires evidence not public in the pool."]
      - [Base, "Technical adoption grows while financial disclosure remains limited and design-in cycles remain long.", "Track or negotiate a lower entry price and information rights rather than accept the stated valuation at face value.", "Information asymmetry and multiple uncertainty.", "Medium: consistent with current evidence."]
      - [Bear, "Commercialization lags, capital needs remain high, or public/private AI multiples compress.", "Down-round, dilution, or impaired exit value becomes plausible; avoid a buy decision.", "Competition, burn, financing terms, and failed production conversion.", "Material downside: no audited cash or runway is disclosed."]
      - [Decision gate, "Obtain audited financials, Series C terms, cap table, customer revenue concentration, and independent performance evidence.", "Re-underwrite EV/revenue, cash runway, dilution, and exit scenarios only after the gate is met.", "Missing evidence itself blocks precision.", "Required diligence before investment."]
    notes: "Scenarios are qualitative because the retained sources do not provide a verified revenue, margin, cash, runway, dilution, or preference denominator; no probability percentages are invented."
    claimRefs: [CV012, CV013, CV014, CV015, CV016]
