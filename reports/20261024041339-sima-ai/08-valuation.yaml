chapter:
  number: 8
  title: Valuation
  summary: SiMa.ai's September 2026 financing establishes a company-reported $1.45 billion valuation and $500 million of cumulative capital, but the public record still lacks audited revenue, margins, cash, runway, and terms needed to underwrite that price. The evidence supports research-more at entry rather than a buy, with upside dependent on converting technical and partner validation into durable production revenue.
sections:
  - id: price-and-proof
    title: Price, financing, and operating proof
    body: >-
      SiMa.ai announced a $150 million Series C on September 28, 2026, bringing
      company-reported total capital raised to $500 million and the stated
      valuation to $1.45 billion. The release also says revenue growth quadrupled
      year over year between 2024 and 2025, but it gives no revenue base,
      revenue dollars, gross margin, cash balance, burn, or runway. The earlier
      The April 2024 release reported $270 million
      raised after an additional $70 million. These are financing and
      company-reported growth disclosures, not audited operating metrics.
      Caplight lists the September 28, 2026 round and comparable companies
      including Hailo, Axelera AI, and DEEPX, but its public page says filing
      records require access. The resulting price discipline is therefore
      evidence-sensitive: the valuation is observable, while the denominator
      required to calculate a defensible revenue multiple is not.
    claimRefs: [CV001, CV002, CV004, CV005]
    tableRefs: [TV001]
  - id: thesis-and-antithesis
    title: Investment thesis and anti-thesis
    body: >-
      The positive case is a differentiated hardware-software platform with
      current product evidence. SiMa.ai's 2026 Modalix brief describes a
      second-generation MLSoC delivering 50 TOPS in a 25mm by 25mm package and
      GenAI capability under 10 watts; its developer documentation describes the
      chip, accelerator, image signal processor, and computer-vision unit on one
      die. The company also reports production availability, customer and
      partner relationships, and a roadmap toward 1,000 dense TOPS hardware
      slated for the first half of 2028. The anti-thesis is that these
      disclosures remain largely company-controlled: technical specifications
      are not revenue, and partner or customer names do not establish dollar
      bookings, production timing, concentration, retention, or gross margin.
      Independent valuation material places AI funding valuations at a median
      24.2x revenue multiple but cautions that the sample is skewed toward large
      successful companies; a separate AI M&A dataset reports a 25.8x average
      revenue multiple while also describing the limits of applying EBITDA or
      DCF to early-stage AI companies. Neither benchmark can be applied to
      SiMa.ai without a verified revenue denominator.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV011]
    tableRefs: [TV002]
    figureRefs: [FV001]
  - id: scenarios-and-diligence
    title: Scenarios, exit readiness, and decision
    body: >-
      The scenario framework should be treated as a disciplined decision
      boundary rather than a fabricated point estimate. In the bull case,
      Modalix production, Palette adoption, and the named commercial network
      convert into auditable recurring or repeat product revenue, supporting a
      strategic premium and a credible path to an exit. In the base case,
      technical adoption continues but public evidence remains insufficient to
      distinguish shipments from material revenue, so the investor tracks
      milestones and seeks better price or terms. In the bear case, edge-AI
      competition, long design-in cycles, capital intensity, or multiple
      compression prevent the company from converting platform claims into
      profitable scale; the current valuation then carries meaningful
      down-round and dilution risk. A decision should wait for audited
      financials, the Series C term sheet and cap table, customer-level
      production evidence, unit economics, and independent benchmark results.
      Until those items are supplied, research-more is the supported
      recommendation, with no support for a target return or exit multiple.
    claimRefs: [CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
