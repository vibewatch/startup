callouts:
  - calloutType: strength
    title: Funding supports continued execution
    body: "The reported $150 million Series C and $500 million cumulative funding give SiMa.ai disclosed financing capacity for software, next-generation silicon, and expansion, though they do not establish runway."
    claimRefs: [CI009, CI010]
  - calloutType: risk
    title: The underwriting variables remain private
    body: "Audited revenue, gross margin, cash, burn, runway, realized pricing, customer concentration, and debt obligations are not disclosed in the assigned evidence, so valuation cannot be tested against operating performance."
    claimRefs: [CI002, CI006, CI011, CI013]
  - calloutType: recommendation
    title: Request an investor-grade financial pack
    body: "Before underwriting, request SKU-level revenue and margin, cash-flow and runway schedules, customer concentration, contract terms, design-win conversion, and the full Series C capitalization and preference package."
    claimRefs: [CI006, CI011, CI013]

