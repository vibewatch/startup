company:
  name: SiMa.ai
chapter:
  number: 4
  title: Financials
  summary: SiMa.ai has reported rapid revenue growth, a $150 million Series C, and production hardware with public list prices, but the available evidence does not disclose audited revenue, gross margin, cash, burn, runway, or realized unit economics. The underwriting case therefore depends on validating conversion from funded silicon and software development into repeatable production revenue.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and public traction
    body: >-
      SiMa.ai presents a combined hardware-and-software model: Modalix MLSoC products, system-on-modules, development kits, and a Palette software stack are sold as an integrated Physical AI platform. Public materials describe Modalix as shipping and show 8GB and 32GB SoM list prices of $349 and $599, plus a $1,499 DevKit price, but those are stated prices rather than realized revenue, gross margin, or contract economics. The September 2026 Series C release says revenue quadrupled year over year between 2024 and 2025 and that 2026 momentum remained strong; it does not give dollar revenue, ARR, bookings, backlog, renewal, or customer concentration. An independent September profile repeats the 4x growth statement but explicitly says dollar revenue and profit are not publicly disclosed. Financial diligence should therefore separate unit shipments and list prices from recognized revenue, recurring software revenue, and production design-win conversion.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: cost-structure-and-unit-economics
    title: Cost structure and unit-economics visibility
    body: >-
      The economics appear structurally more complex than a pure SaaS model. SiMa.ai designs silicon, integrates third-party IP, offers modules and development kits, and supports software tooling; each layer can carry different bill-of-materials, manufacturing, support, and go-to-market costs. Synopsys reports that SiMa.ai completed its own customer-owned tooling flow from RTL to tape-out in eighteen months and used Synopsys IP across interfaces and security, while the company says Modalix is built for low power and performance per watt. Those facts indicate an engineering and supply-chain burden, not a disclosed margin profile. A 2026 Ambarella earnings transcript is competitor-issued comparator evidence rather than independent proof about SiMa.ai; its warning that component price increases can pressure low-margin products makes DRAM, foundry, packaging, board, support, and warranty sensitivity relevant diligence questions. It cannot be used as a SiMa.ai margin estimate. No source in this pool discloses SiMa.ai CAC, sales cycle, payback, gross margin, support cost, inventory turns, or working-capital terms.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: capital-adequacy-and-underwriting-verdict
    title: Capital adequacy and underwriting verdict
    body: >-
      SiMa.ai announced a $150 million Series C on September 28, 2026, bringing company-reported total capital raised to $500 million and a reported $1.45 billion valuation. The release says the proceeds will fund Palette Neat, next-generation hardware, and expansion into drones, humanoid robotics, automotive ADAS, and AI cockpits; the 2025 financing release similarly allocated capital to software, go-to-market, customer success, and the automotive roadmap. This is financing capacity, not cash on hand or runway: neither release reports current cash, monthly burn, debt, covenants, liquidation preferences, or a next-round trigger. The planned 1,000-dense-TOPS generation targeted for H1 2028 and the stated global expansion imply continued R&D, tape-out, qualification, inventory, and field-support needs. The financial verdict is research-more: reported funding and commercial signals reduce near-term financing uncertainty, but valuation underwriting remains blocked until management supplies audited or investor-grade revenue, margin, cash-flow, customer-concentration, and capital-structure data.
    claimRefs: [CI009, CI010, CI011, CI012, CI013]

