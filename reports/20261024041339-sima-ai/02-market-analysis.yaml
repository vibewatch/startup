    title: Market sizing lenses
    type: pyramid
    summary: Separate published edge-AI, physical-AI, and device-unit lenses show market direction without implying a common denominator.
    data:
      nodes:
        - {label: "Edge AI, 2035", value: "USD 225.5B", valueNote: "Global Market Insights forecast; broad category"}
        - {label: "Edge AI, 2025", value: "USD 25.2B", valueNote: "Global Market Insights estimate; broad category"}
        - {label: "Physical AI, 2032", value: "USD 15.24B", valueNote: "MarketsandMarkets forecast; narrower category"}
        - {label: "Physical AI, 2025", value: "USD 0.89B", valueNote: "MarketsandMarkets estimate; narrower category"}
        - {label: "Physical-AI devices, 2035", value: "145M units", valueNote: "Shipment projection cited by SiMa.ai; not revenue"}
        - {label: "SiMa.ai opportunity claim", value: "USD 50T", valueNote: "CEO statement about downstream physical AI; not SAM"}
    approximationNotes: "Nodes are intentionally not mathematically comparable: they mix market revenue, device units, category scope, and a company opportunity claim. The pyramid orders lenses for readability only and does not derive conversion rates or a combined TAM."
    claimRefs: [CM014]
callouts:
  - calloutType: insight
    title: The investable wedge is narrower than the headline TAM
    body: SiMa.ai's likely wedge is power-constrained, repeatable edge inference where software portability and local responsiveness justify a purpose-built platform; broad physical-AI system revenue should not be counted as chip or software revenue.
    claimRefs: [CM001, CM003, CM015, CM018]
  - calloutType: risk
    title: Forecast dispersion is itself a diligence signal
    body: Published edge-AI and physical-AI estimates differ in scope and growth rates, while downstream unit forecasts do not reveal silicon content, pricing, or conversion. Valuation should therefore be stress-tested against capture rate and production conversion rather than headline market size.
    claimRefs: [CM014]
