              - CP007
              - CP008
              - CP009
              - CP015
      - number: '3.3'
        title: Switching cost, distribution, and buyer economics
        blocks:
          - type: paragraph
            body: >-
              Modalix can enter a design through chip-down integration, a system-on-module, a development kit, or a
              host-attached card. That packaging ladder broadens the route to adoption, while a common software and
              firmware workflow may reduce migration friction within SiMa.ai's own family. The same integration can
              create lock-in after a buyer qualifies boards, cameras, operating software, models, and production
              processes. This is an inference from the documented workflow, not a measured retention result: no retained
              source quantifies migration cost, renewal, multi-homing, channel share, or design-win conversion. Public
              list and realized pricing are also absent, preventing a defensible total-cost comparison with incumbents,
              specialists, or an internal build.
            claimRefs:
              - CP004
              - CP005
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
              - CP014
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The moat case depends on whether integrated hardware and software produce repeatable workload economics
              and durable production deployments. The company-issued under-10W recognition and 50-TOPS product
              specification are useful engineering signals, but they are not a common benchmark against the named
              alternatives. Ambarella's fiscal 2026 revenue and edge-AI growth show that SiMa.ai faces a scaled public
              competitor with resources to fund product development and channels. NVIDIA and Qualcomm add ecosystem
              pressure, while specialist vendors can narrow their products around dedicated inference. SiMa.ai's
              September 2026 financing extends its capacity to compete and fund a 2028 roadmap; it does not establish
              market leadership, pricing power, or a defensible share.
            claimRefs:
              - CP007
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integration is the clearest public differentiator
            body: >-
              Modalix combines application, acceleration, vision, I/O, security, and software workflows across several
              deployment form factors.
            calloutType: strength
            claimRefs:
              - CP004
              - CP005
              - CP015
          - type: callout
            title: Comparative proof remains thin
            body: >-
              The retained pool does not disclose matched pricing, market share, production win rates, or an independent
              Modalix-generation benchmark.
            calloutType: risk
            claimRefs:
              - CP009
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai presents a combined hardware-and-software model: Modalix MLSoC products, system-on-modules,
              development kits, and a Palette software stack are sold as an integrated Physical AI platform. Public
              materials describe Modalix as shipping and show 8GB and 32GB SoM list prices of $349 and $599, plus a
              $1,499 DevKit price, but those are stated prices rather than realized revenue, gross margin, or contract
              economics. The September 2026 Series C release says revenue quadrupled year over year between 2024 and
              2025 and that 2026 momentum remained strong; it does not give dollar revenue, ARR, bookings, backlog,
              renewal, or customer concentration. An independent September profile repeats the 4x growth statement but
              explicitly says dollar revenue and profit are not publicly disclosed. Financial diligence should therefore
              separate unit shipments and list prices from recognized revenue, recurring software revenue, and
              production design-win conversion.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI003
              - CI004
