  - id: FE001
    title: Modalix product and deployment architecture
    type: stack
    summary: >-
      SiMa.ai's public product path runs from model preparation through Palette and Modalix silicon to integrated edge
      hardware and customer applications.
    data:
      layers:
        - label: Application layer
          detail: Vision, Transformer, and GenAI workloads are prepared for edge inference.
          modules:
            - Model preparation
            - Edge application
        - label: Software layer
          detail: Palette ModelSDK and Edgematic provide quantization, compilation, deployment, and evaluation workflows.
          modules:
            - Palette ModelSDK
            - Edgematic
        - label: Silicon layer
          detail: Modalix integrates the MLA, Arm Cortex-A65 application cores, ISP, and CVU.
          modules:
            - MLA
            - Arm Cortex-A65
            - ISP and CVU
        - label: System layer
          detail: Modalix SoM, DevKit, and PCIe products expose memory, power, camera, network, storage, and host interfaces.
          modules:
            - Modalix SoM
            - Modalix DevKit
            - Modalix PCIe Card
        - label: Ingress layer
          detail: Camera and network inputs feed local inference through documented MIPI CSI and Ethernet paths.
          modules:
            - MIPI CSI
            - Ethernet
        - label: Operations layer
          detail: Firmware, board bring-up, model updates, and production testing remain part of deployment ownership.
          modules:
            - eLxr Linux
            - Board bring-up
            - Production testing
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
  - id: FU001
    title: Customer journey from design-in to scalable deployment
    type: journey-map
    summary: >-
      Public evidence supports a staged path from customer discovery and partner engineering to intended
      production-scale deployment, with conversion metrics undisclosed.
    data:
      nodes:
        - id: discovery
          label: Customer discovery
          description: SiMa.ai's CEO said the company met with over 30 customers to understand embedded-edge ML problems.
          touchpoints:
