        - id: design-in
          label: Design-in and evaluation
          description: Modalix hardware, Palette software, and DevKit or SoM paths provide an evaluation and integration surface.
          touchpoints:
            - Modalix and Palette
            - Standalone or PCIe deployment
            - Customer and partner engineering
        - id: partner-build
          label: Partner-led solution build
          description: STIGA and L&T describe concrete product or engineering collaborations.
          touchpoints:
            - Robotic lawn mowers
            - Joint use cases and support framework
        - id: production-scale
