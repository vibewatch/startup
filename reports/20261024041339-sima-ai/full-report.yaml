    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai presents itself as a software-centric embedded-edge machine-learning system-on-chip company. Its
              product stack combines Modalix silicon, modules and development kits with Palette software, while the
              hardware documentation describes a second-generation MLSoC integrating application compute,
              machine-learning acceleration, image-signal processing, and computer-vision processing on one die. The
              company says it was founded in 2018 and is headquartered in San Jose; its own story page lists offices in
              eight countries, but the assigned evidence does not independently verify employee count, revenue,
              active-customer count, or the proportion of production deployments. The platform is positioned for
              robotics, automotive, drones, industrial automation, aerospace and defense, smart vision, and healthcare,
              which broadens the opportunity but also increases the number of integration and go-to-market motions that
              must be executed.
