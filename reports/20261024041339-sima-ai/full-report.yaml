  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buying unit
        blocks:
          - type: paragraph
            body: >-
              The relevant market is edge AI compute and software for physical systems: inference performed on devices,
              gateways, or local servers near sensors and actuators. This includes silicon, modules, deployment
              software, and lifecycle tooling sold into industrial automation, robotics, automotive, drones, aerospace
              and defense, smart vision, and healthcare. It excludes centralized model training, general cloud AI
              services, and the full economic value of every end market that may eventually use physical AI. The
              boundary matters because SiMa.ai's product is an enabling layer, not the revenue of the robots or vehicles
              that incorporate it. Buyers therefore evaluate total deployment economics: compute density, thermal and
              power limits, integration effort, software portability, security, and support over a device fleet. Cloud
              inference, general-purpose GPUs, incumbent embedded processors, custom internal designs, and non-AI
              automation are status-quo substitutes.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Multiple sizing lenses, not one TAM
        blocks:
          - type: paragraph
            body: >-
              Published estimates are directionally bullish but not directly additive. Global Edge AI Market Insights
              estimates edge AI at USD 25.2 billion in 2025 and USD 225.5 billion in 2035, while MarketsandMarkets
              estimates the narrower physical-AI market at USD 0.89 billion in 2025 and USD 15.24 billion in 2032. The
              different bases, definitions, and forecast periods make these lenses useful for scenario bounds, not a
              reconciled SiMa.ai TAM. SiMa.ai's own September 2026 financing release cites 145 million cumulative
              physical-AI device shipments by 2035 and a much broader USD 50 trillion opportunity statement from its
              CEO; the former is a unit-demand signal, while the latter is a company claim about downstream value, not
              serviceable semiconductor revenue. A disciplined SAM must be narrowed to addressable edge inference
              deployments and the share of bill-of-materials or software value SiMa.ai can capture. No assigned source
              isolates that SAM or a defensible SOM.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM014
      - number: '2.3'
        title: Buyers, adoption path, and constraints
        blocks:
          - type: paragraph
            body: >-
              The buying unit is typically an OEM, platform integrator, or enterprise engineering team that owns a
              repeatable fleet or production workflow. The user may be a robotics, vision, or embedded engineer; the
              payer is usually the product, operations, or capital-equipment budget owner. Adoption starts with a proof
              of concept, then requires validated workload performance, thermal and power fit, software integration,
              supply assurance, security, and lifecycle support before a production design win. Edge-AI demand is
              supported by connected equipment, hybrid-cloud architectures, and the need to act locally when latency,
              bandwidth, or data handling make a cloud round trip unattractive. Constraints are equally material:
              interoperability and fleet-management complexity, security and compliance exposure, expensive
              re-engineering, and uncertain physical-AI capability maturity. BCG's framework distinguishes deployable
              perception and dexterity from more aspirational workflow reasoning, which limits how quickly humanoid and
              general-purpose robotics forecasts should translate into silicon demand.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Market implications and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai's Modalix brief describes a second-generation chip delivering 50 TOPS in a 25mm by 25mm package
              and under 10 watts, while its product announcement describes configurations from 25 to 200 TOPS and
              compatibility across CNNs, transformers, LLMs, and multimodal models. Those specifications support a
              differentiated value proposition where power and local responsiveness are binding constraints, but they do
              not prove market share, pricing, production volume, or customer ROI. The commercial opportunity is
              therefore strongest in repeatable, power-constrained deployments with a software migration path, and
              weakest where general-purpose accelerators are adequate or integration remains bespoke. Before
              underwriting a large valuation, diligence should obtain a dollar-weighted pipeline by vertical, production
              conversion rates from pilots, average selling price and software attach, design-win timelines, customer
              concentration, and independent workload benchmarks. The market-growth case is credible as a direction, but
              the capture-rate case remains unresolved.
            claimRefs:
              - CM015
              - CM016
              - CM017
              - CM018
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The investable wedge is narrower than the headline TAM
            body: >-
              SiMa.ai's likely wedge is power-constrained, repeatable edge inference where software portability and
              local responsiveness justify a purpose-built platform; broad physical-AI system revenue should not be
              counted as chip or software revenue.
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM015
              - CM018
          - type: callout
            title: Forecast dispersion is itself a diligence signal
            body: >-
              Published edge-AI and physical-AI estimates differ in scope and growth rates, while downstream unit
              forecasts do not reveal silicon content, pricing, or conversion. Valuation should therefore be
              stress-tested against capture rate and production conversion rather than headline market size.
            calloutType: risk
            claimRefs:
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and scale
        blocks:
          - type: paragraph
            body: >-
              The competitive boundary is broader than a list of like-for-like chips. Tracxn names Ambarella, Graphcore
              Systems, and EdgeCortix among SiMa.ai's leading competitors, while Tech Insider adds NVIDIA Jetson,
              Qualcomm, Hailo, Mythic, and adjacent cloud-inference vendor Groq. These companies address different
              combinations of embedded vision, general edge compute, dedicated inference, and software tooling, so a
              single rank would be misleading. Customer internal development and existing host-compute architectures
              remain status-quo substitutes even though the assigned pool does not quantify them. Public scale is also
              uneven: SiMa.ai discloses financing, Ambarella reports operating results, and several private peers expose
              only funding estimates.
