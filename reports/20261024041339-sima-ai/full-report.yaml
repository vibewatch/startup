      - number: '3.2'
        title: Capability and product-scope differentiation
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai's strongest documented distinction is system integration rather than a verified lead on one
              benchmark. Its hardware documentation spans a chip, module, development kit, and PCIe card. The Modalix
              materials describe Arm application processing, a machine-learning accelerator, image-signal and
              computer-vision processors, high-speed interfaces, video functions, security, and Palette software in one
              product family. This can reduce the number of components and software handoffs in a camera or robotics
              design. However, competitor capability cells remain deliberately unknown where the retained sources merely
              name a vendor. Data Center Dynamics also notes that the alternatives behind SiMa.ai's reported
              performance-per-watt comparison were not detailed.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP015
          - type: table
