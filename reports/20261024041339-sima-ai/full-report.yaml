              - CI004
              - CI006
              - CI011
              - CI012
      - number: '4.2'
        title: Cost structure and unit-economics visibility
        blocks:
          - type: paragraph
            body: >-
              The economics appear structurally more complex than a pure SaaS model. SiMa.ai designs silicon, integrates
              third-party IP, offers modules and development kits, and supports software tooling; each layer can carry
              different bill-of-materials, manufacturing, support, and go-to-market costs. Synopsys reports that SiMa.ai
              completed its own customer-owned tooling flow from RTL to tape-out in eighteen months and used Synopsys IP
              across interfaces and security, while the company says Modalix is built for low power and performance per
              watt. Those facts indicate an engineering and supply-chain burden, not a disclosed margin profile. A 2026
              Ambarella earnings transcript is competitor-issued comparator evidence rather than independent proof about
              SiMa.ai; its warning that component price increases can pressure low-margin products makes DRAM, foundry,
              packaging, board, support, and warranty sensitivity relevant diligence questions. It cannot be used as a
              SiMa.ai margin estimate. No source in this pool discloses SiMa.ai CAC, sales cycle, payback, gross margin,
              support cost, inventory turns, or working-capital terms.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI009
              - CI010
              - CI011
              - CI013
      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai announced a $150 million Series C on September 28, 2026, bringing company-reported total capital
              raised to $500 million and a reported $1.45 billion valuation. The release says the proceeds will fund
              Palette Neat, next-generation hardware, and expansion into drones, humanoid robotics, automotive ADAS, and
              AI cockpits; the 2025 financing release similarly allocated capital to software, go-to-market, customer
              success, and the automotive roadmap. This is financing capacity, not cash on hand or runway: neither
              release reports current cash, monthly burn, debt, covenants, liquidation preferences, or a next-round
              trigger. The planned 1,000-dense-TOPS generation targeted for H1 2028 and the stated global expansion
              imply continued R&D, tape-out, qualification, inventory, and field-support needs. The financial verdict is
              research-more: reported funding and commercial signals reduce near-term financing uncertainty, but
              valuation underwriting remains blocked until management supplies audited or investor-grade revenue,
              margin, cash-flow, customer-concentration, and capital-structure data.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding supports continued execution
            body: >-
              The reported $150 million Series C and $500 million cumulative funding give SiMa.ai disclosed financing
              capacity for software, next-generation silicon, and expansion, though they do not establish runway.
            calloutType: strength
            claimRefs:
              - CI009
              - CI010
          - type: callout
            title: The underwriting variables remain private
            body: >-
              Audited revenue, gross margin, cash, burn, runway, realized pricing, customer concentration, and debt
              obligations are not disclosed in the assigned evidence, so valuation cannot be tested against operating
              performance.
            calloutType: risk
            claimRefs:
              - CI002
              - CI006
              - CI011
              - CI013
          - type: callout
            title: Request an investor-grade financial pack
            body: >-
              Before underwriting, request SKU-level revenue and margin, cash-flow and runway schedules, customer
              concentration, contract terms, design-win conversion, and the full Series C capitalization and preference
              package.
            calloutType: recommendation
            claimRefs:
              - CI006
              - CI011
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai's product is a hardware/software edge-inference platform rather than a standalone model API. The
              company describes Modalix as a second-generation MLSoC family supporting CNNs, Transformers, LLMs, LMMs,
              and generative AI, with M25, M50, M100, and M200 configurations. The official hardware documentation
              exposes three integration levels: the Modalix chip for a customer-designed board, the Modalix SoM with
              LPDDR5 and power, and pre-integrated DevKit and PCIe products. This lets a buyer begin with evaluation
              hardware and later move toward a carrier-board or chip-down design, but it also creates hardware bring-up
              and lifecycle work that is not eliminated by the software compatibility promise.
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE012
      - number: '5.2'
        title: Architecture, software path, and integration
        blocks:
          - type: paragraph
            body: >-
              The documented architecture is a heterogeneous edge system: eight Arm Cortex-A65 application cores, a
              Machine Learning Accelerator, an image signal processor, and a computer-vision unit are combined on the
              Modalix die, with LPDDR5, camera interfaces, Ethernet, PCIe, and eLxr Linux appearing in the product
              documentation. Palette and Edgematic provide the model-preparation path: a developer trains or exports a
              model, performs graph surgery, quantization, and compilation, transfers compiled artifacts to Edgematic,
              and evaluates the result on edge hardware. AWS's worked example shows that this path can connect
              SageMaker, Docker/ECR, Palette, and an edge device, but it also introduces cloud-account, IAM, container,
              storage, and large-image operational dependencies.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE009
              - CE016
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
      - number: '5.3'
        title: Maturity, differentiation, and ecosystem proof
        blocks:
          - type: paragraph
            body: >-
              Public maturity evidence is strongest for the first-generation platform: SiMa.ai announced shipping in
              2022 and later described full characterization, production-grade silicon, boards, and Palette
              functionality in 2023. Modalix was announced in September 2024, with customer samples targeted for Q4
              2024, and a 2026 company release says the Modalix SoM launched in 2025. This is a coherent progression
              from silicon to modules and deployment tooling, while the exact current production volume, customer yield,
              and Modalix benchmark results remain undisclosed in the retained sources. The Arteris case study and AWS
              deployment walkthrough indicate partner support for SoC interconnect and model deployment, not independent
              proof of broad production scale.
            claimRefs:
              - CE006
              - CE007
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Trust, safety, security, and technical risks
        blocks:
          - type: paragraph
            body: >-
              The product is positioned for safety-sensitive settings such as factories, warehouses, robotics, mobility,
              healthcare, and aerospace, where local inference can reduce latency and keep data on-device. AWS's
              deployment example explicitly says the workflow can reduce latency, avoid continuous cloud connectivity,
              reduce security risks, and keep data in-house; those are workflow properties, not a certification or proof
              of secure operation. SiMa.ai's older production announcement records CE, FCC, and UL-related board
              testing, while the preliminary Modalix brief describes secure boot, authenticated boot images, eFuse key
              storage, and a security API. The retained evidence does not establish current third-party Modalix security
              certifications, vulnerability-response performance, uptime, thermal limits under customer workloads, or a
              qualified second-source manufacturing plan. A buyer should therefore treat integration control, field
              reliability, and security assurance as diligence gates rather than assume them from the architecture.
            claimRefs:
              - CE014
              - CE015
              - CE016
              - CE017
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated edge path
            body: >-
              The combination of documented hardware form factors, Palette compilation, model examples, and AWS
              deployment guidance gives SiMa.ai a more complete adoption path than a bare accelerator specification.
            calloutType: strength
            claimRefs:
              - CE001
              - CE006
              - CE007
              - CE009
          - type: callout
            title: Proof is stronger for architecture than outcomes
            body: >-
              Public material documents components, workflows, and historical production milestones, but does not
              establish current Modalix customer-scale reliability, independently reproduced performance, security
              assurance, or manufacturing redundancy.
            calloutType: risk
            claimRefs:
              - CE010
              - CE012
              - CE015
              - CE017
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and use-case segmentation
        blocks:
          - type: paragraph
            body: >-
              The evidence points to a broad embedded-edge customer profile rather than one concentrated vertical.
              SiMa.ai describes target applications across robotics, automotive, industrial automation, aerospace and
              defense, smart vision, healthcare, drones, and retail. Its 2025 financing release says customer demand
              spans those markets, while the 2026 Series C release names ARK Electronics, AVerMedia, Bosch, Emerson,
              Intrinsic, Kontron, L&T Technology Services, Micron, STIGA, Synopsys, TRUMPF SE, and Virya Autonomous
              Technologies as customers or partners. Those names establish commercial reach, not a verified count of
              paying accounts or revenue-weighted segmentation. The buyer is likely an equipment maker, systems
              integrator, or engineering organization embedding inference into a product; the end user is the operator
              of the resulting machine. The retained documents do not identify contract value, payer, deployment
              geography, or whether each named relationship is a customer, design partner, supplier, or ecosystem
              partner.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption trajectory and commercial signals
        blocks:
          - type: paragraph
            body: >-
              Adoption signals are strongest where a named counterpart describes a concrete integration objective. STIGA
              states that it intends to use SiMa.ai's low-power platform for real-time decision-making in domestic and
              commercial robotic lawn mowers, and describes a scalable solution architecture for its mower portfolio.
              L&T Technology Services describes a strategic partnership combining its engineering capabilities and
              client reach with SiMa.ai's MLSoC ONE platform, software SDK, joint use-case development, and a
              product-support framework. These are meaningful commercialization signals, but neither source establishes
              production shipment volume, paid deployment, renewal, utilization, or end-customer outcomes. SiMa.ai's own
              releases describe Modalix as shipping and in full-scale production, and report company-level revenue
              growth, but those statements are not customer-level adoption denominators. The result is a plausible
              design-in and ecosystem funnel with no independently verified conversion from evaluation to scaled
              production.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU007
              - CU009
              - CU010
              - CU013
      - number: '6.3'
        title: Named proof, durability, and concentration gaps
        blocks:
          - type: paragraph
            body: >-
              Named proof is uneven. STIGA is the clearest customer-side evidence because the partner announcement is
              issued by STIGA and describes a product family and operating objective, while the L&T announcement is
              issued by a listed engineering-services partner and describes joint go-to-market and support. By contrast,
              the longer list of brands in SiMa.ai's financing release is a company statement without customer quotes,
              contract scope, deployment status, or outcome metrics. A SiMa.ai executive interview says the company met
              with more than 30 customers during its early design process and later argued that it needed more than
              1,000 customers to scale, but those are historical management statements rather than a current
              active-customer count. No retained source reports NRR, GRR, churn, renewal rates, contract length, cohort
              behavior, top-account share, or dollar-weighted pipeline. Customer durability and concentration therefore
              remain material diligence gaps, particularly because a hardware-and-software platform may depend on a
              small number of design wins before volume production.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU005
              - CU007
              - CU008
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial signal is real but not yet revenue-grade
            body: >-
              Named STIGA and L&T relationships demonstrate concrete application and channel pathways; the evidence does
              not yet show how many relationships converted into paid production deployments or recurring software
              revenue.
            calloutType: insight
            claimRefs:
              - CU005
              - CU006
              - CU013
          - type: callout
            title: Retention and concentration are unobservable
            body: >-
              No retained source provides customer count, renewal, churn, net retention, contract duration, or revenue
              concentration, so customer quality cannot be scored from logos or partnership announcements alone.
            calloutType: risk
            claimRefs:
              - CU012
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Current US policy creates a potentially material route-to-market risk, but the assigned evidence does not
              establish whether Modalix falls within the cited advanced-computing thresholds. Mayer Brown and Baker
              McKenzie describe a January 2026 rule that permits case-by-case review for specified exports to China and
              Macau only with technical, supply, testing, end-user, and remote-access evidence. Baker McKenzie says
              reexports and in-country transfers remain presumptively denied in covered cases, while both firms describe
              a 25% tariff for certain covered chips routed through the United States for foreign customers. An
              independent ISO 26262 explainer also describes documentation, verification, and validation burdens that
              can extend time-to-market for smaller automotive suppliers. The investment implication is conditional
              rather than categorical: product classification, customer geography, channel design, and program-specific
              safety evidence must be verified before assigning revenue exposure.
            claimRefs:
              - CR006
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.2'
        title: Operational, quality, and security execution
        blocks:
          - type: paragraph
            body: >-
              Modalix customer deployment requires more than shipping a packaged accelerator. SiMa.ai's hardware
              documentation separates chip-down designs from carrier-board designs and identifies power sequencing,
              clocks, memory routing, high-speed layout, interfaces, and thermals as chip-down work. It also says
              important design collateral is available under NDA. The May 2025 product brief labels the document
              preliminary, states that specifications may change without notice, and describes secure boot, trusted
              execution, key storage, and image authentication. Those controls are relevant mitigations, but
              company-issued feature descriptions are not substitutes for independent penetration testing, field
              reliability data, defect rates, or customer qualification evidence.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR007
              - CR008
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.3'
        title: Financial, roadmap, and dependency risk
        blocks:
          - type: paragraph
            body: >-
              The financing record provides resources but not proof of cash available or runway. TechCrunch and SiMa.ai
              report a $150 million Series C at a $1.45 billion valuation; the company had also reported an $85 million
              financing in 2025 and now targets next-generation 1,000-dense-TOPS hardware for H1 2028. The company
              separately claims fourfold year-over-year revenue growth between 2024 and 2025, without disclosing the
              revenue baseline or audited statements in the assigned evidence. Comparable evidence is cautionary rather
              than directly predictive: competitor-issued Blaize results pair $38.632 million of 2025 revenue with a
              $206.904 million accounting net loss, while an independent Hailo report describes a valuation reset from a
              $1.2 billion peak to under $500 million. These are sector stress signals, not SiMa.ai financial results.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR005
              - CR009
              - CR010
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: Monitoring indicators and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Diligence should convert each residual risk into a dated operating test. Regulatory monitoring should
              track product-level export classifications, license outcomes, restricted-party screening, and
              tariff-bearing routes. Operational monitoring should track tape-out and production dates, qualification
              escapes, return rates, software regressions, foundry and OSAT concentration, and second-source milestones.
              Financial monitoring should reconcile funding proceeds to cash, quarterly operating cash use, gross
              margin, backlog conversion, and customer concentration. Thesis-break triggers are a material export
              blockage, repeated production or safety-qualification slippage, inability to document secure deployment
              controls, failure to qualify a credible supply alternative, or financing terms that materially worsen
              dilution or preference overhang before commercial evidence catches up with the roadmap.
            claimRefs:
              - CR005
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation and roadmap must be underwritten separately
            body: >-
              The $1.45 billion financing valuation is observable, but audited liquidity and the cost to deliver the H1
              2028 hardware roadmap are not available in the assigned evidence.
            calloutType: risk
            claimRefs:
              - CR002
              - CR005
          - type: callout
            title: Comparable stress is a monitoring signal, not a forecast
            body: >-
              Hailo's reported valuation reset and Blaize's accounting losses show that edge-AI technical relevance can
              coexist with financing and commercialization pressure.
            calloutType: insight
            claimRefs:
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price, financing, and operating proof
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai announced a $150 million Series C on September 28, 2026, bringing company-reported total capital
              raised to $500 million and the stated valuation to $1.45 billion. The release also says revenue growth
              quadrupled year over year between 2024 and 2025, but it gives no revenue base, revenue dollars, gross
              margin, cash balance, burn, or runway. The earlier The April 2024 release reported $270 million raised
              after an additional $70 million. These are financing and company-reported growth disclosures, not audited
              operating metrics. Caplight lists the September 28, 2026 round and comparable companies including Hailo,
              Axelera AI, and DEEPX, but its public page says filing records require access. The resulting price
              discipline is therefore evidence-sensitive: the valuation is observable, while the denominator required to
              calculate a defensible revenue multiple is not.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV012
              - CV016
      - number: '8.2'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is a differentiated hardware-software platform with current product evidence. SiMa.ai's
              2026 Modalix brief describes a second-generation MLSoC delivering 50 TOPS in a 25mm by 25mm package and
              GenAI capability under 10 watts; its developer documentation describes the chip, accelerator, image signal
              processor, and computer-vision unit on one die. The company also reports production availability, customer
              and partner relationships, and a roadmap toward 1,000 dense TOPS hardware slated for the first half of
              2028. The anti-thesis is that these disclosures remain largely company-controlled: technical
              specifications are not revenue, and partner or customer names do not establish dollar bookings, production
              timing, concentration, retention, or gross margin. Independent valuation material places AI funding
              valuations at a median 24.2x revenue multiple but cautions that the sample is skewed toward large
              successful companies; a separate AI M&A dataset reports a 25.8x average revenue multiple while also
              describing the limits of applying EBITDA or DCF to early-stage AI companies. Neither benchmark can be
              applied to SiMa.ai without a verified revenue denominator.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV012
              - CV015
              - CV016
      - number: '8.3'
        title: Scenarios, exit readiness, and decision
        blocks:
          - type: paragraph
            body: >-
              The scenario framework should be treated as a disciplined decision boundary rather than a fabricated point
              estimate. In the bull case, Modalix production, Palette adoption, and the named commercial network convert
              into auditable recurring or repeat product revenue, supporting a strategic premium and a credible path to
              an exit. In the base case, technical adoption continues but public evidence remains insufficient to
              distinguish shipments from material revenue, so the investor tracks milestones and seeks better price or
              terms. In the bear case, edge-AI competition, long design-in cycles, capital intensity, or multiple
              compression prevent the company from converting platform claims into profitable scale; the current
              valuation then carries meaningful down-round and dilution risk. A decision should wait for audited
              financials, the Series C term sheet and cap table, customer-level production evidence, unit economics, and
              independent benchmark results. Until those items are supplied, research-more is the supported
              recommendation, with no support for a target return or exit multiple.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more at entry
            body: >-
              The financing valuation is public, but the revenue and capitalization evidence needed to test price is
              not. Require audited financials, terms, and production-level customer evidence before investing.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV012
              - CV016
          - type: callout
            title: Do not confuse funding with operating scale
            body: >-
              The disclosed $500 million is cumulative capital raised, not cash available, revenue, or runway; the
              public pool does not establish any of those denominators.
            calloutType: risk
            claimRefs:
              - CV001
              - CV016
