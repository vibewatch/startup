          detail: Company reports named partners and quadrupled year-over-year revenue growth.
        - id: denominator
          label: Missing denominator
          detail: No audited revenue, margin, cash, runway, or cap-table terms.
        - id: downside
          label: Downside gate
          detail: Execution, dilution, design-in, and multiple-compression risk.
        - id: decision
          label: Decision
          detail: Research-more; re-underwrite after diligence.
