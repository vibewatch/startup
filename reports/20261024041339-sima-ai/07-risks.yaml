      - ["Board and system integration", "Customers, module users, and design partners", "Multiple design paths; customer mix not disclosed", "Bring-up or qualification effort extends sales conversion", "High", "Reference designs, NDA design collateral, acceptance gates, and escalation SLAs", "Medium-high"]
      - ["External capital", "Existing and new investors", "Two substantial rounds disclosed across 2025 and 2026", "Roadmap cost or commercialization timing forces unfavorable financing", "High", "Stage investment against tape-out, qualification, production, and cash milestones", "High until audited cash use and runway are reviewed"]
      - ["Toolchain and embedded ecosystem", "Arm, Synopsys, memory, interface, and software dependencies", "Substitutability not disclosed", "Component, licensing, or software change disrupts product delivery", "Medium-high", "Dependency inventory, version support, fallback architecture, and contractual continuity", "Medium-high"]
      - ["Export and distribution chain", "Distributors, integrators, ultimate consignees, and remote users", "Geographic and counterparty concentration not disclosed", "A restricted end user, denied route, or tariff raises cost or blocks delivery", "High", "End-user screening, route controls, testing records, and contractual audit rights", "High where controlled destinations are material"]
    notes: >-
      The evidence identifies integration and policy dependencies but does not quantify
      supplier concentration, partner revenue contribution, contractual protections,
      customer concentration, or alternate-source readiness.
    claimRefs: [CR001, CR005, CR009, CR010, CR012, CR013, CR014, CR015, CR016]
