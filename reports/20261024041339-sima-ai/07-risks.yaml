schemaVersion: "report-v2"
artifact: risks
slug: sima-ai
runDate: 2026-10-24
company:
  name: SiMa.ai
chapter:
  number: 7
  title: Risks
  summary: >-
    SiMa.ai's highest residual risks are execution against a long silicon roadmap,
    customer integration and qualification, policy-sensitive export routes, and financial
    opacity despite substantial funding. The assigned evidence supports concrete
    mitigations, but it does not establish audited liquidity, supplier redundancy,
    incident history, safety certifications, or customer concentration.
sections:
  - id: regulatory-and-legal
    title: Regulatory and legal exposure
    body: >-
      Current US policy creates a potentially material route-to-market risk, but the
      assigned evidence does not establish whether Modalix falls within the cited
      advanced-computing thresholds. Mayer Brown and Baker McKenzie describe a January
      2026 rule that permits case-by-case review for specified exports to China and
      Macau only with technical, supply, testing, end-user, and remote-access evidence.
      Baker McKenzie says reexports and in-country transfers remain presumptively denied
      in covered cases, while both firms describe a 25% tariff for certain covered chips
      routed through the United States for foreign customers. An independent ISO 26262
      explainer also describes documentation, verification, and validation burdens that
      can extend time-to-market for smaller automotive suppliers. The investment
      implication is conditional rather than categorical: product classification,
      customer geography, channel design, and program-specific safety evidence must be
      verified before assigning revenue exposure.
    claimRefs: [CR006, CR012, CR013, CR014]
    tableRefs: [TR001]
  - id: operational-and-security
    title: Operational, quality, and security execution
    body: >-
      Modalix customer deployment requires more than shipping a packaged accelerator.
      SiMa.ai's hardware documentation separates chip-down designs from carrier-board
      designs and identifies power sequencing, clocks, memory routing, high-speed layout,
      interfaces, and thermals as chip-down work. It also says important design collateral
      is available under NDA. The May 2025 product brief labels the document preliminary,
      states that specifications may change without notice, and describes secure boot,
      trusted execution, key storage, and image authentication. Those controls are
      relevant mitigations, but company-issued feature descriptions are not substitutes
      for independent penetration testing, field reliability data, defect rates, or
      customer qualification evidence.
    claimRefs: [CR007, CR008, CR009, CR010, CR011]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: financial-and-dependency
    title: Financial, roadmap, and dependency risk
    body: >-
      The financing record provides resources but not proof of cash available or runway.
      TechCrunch and SiMa.ai report a $150 million Series C at a $1.45 billion valuation;
      the company had also reported an $85 million financing in 2025 and now targets
      next-generation 1,000-dense-TOPS hardware for H1 2028. The company separately
      claims fourfold year-over-year revenue growth between 2024 and 2025, without
      disclosing the revenue baseline or audited statements in the assigned evidence.
      Comparable evidence is cautionary rather than directly predictive: competitor-issued
      Blaize results pair $38.632 million of 2025 revenue with a $206.904 million accounting
      net loss, while an independent Hailo report describes a valuation reset from a
      $1.2 billion peak to under $500 million. These are sector stress signals, not
      SiMa.ai financial results.
    claimRefs: [CR001, CR002, CR004, CR005, CR015, CR016]
    tableRefs: [TR003]
  - id: monitoring-and-kill-criteria
    title: Monitoring indicators and thesis-break triggers
    body: >-
      Diligence should convert each residual risk into a dated operating test. Regulatory
      monitoring should track product-level export classifications, license outcomes,
      restricted-party screening, and tariff-bearing routes. Operational monitoring
      should track tape-out and production dates, qualification escapes, return rates,
      software regressions, foundry and OSAT concentration, and second-source milestones.
      Financial monitoring should reconcile funding proceeds to cash, quarterly operating
      cash use, gross margin, backlog conversion, and customer concentration. Thesis-break
      triggers are a material export blockage, repeated production or safety-qualification
      slippage, inability to document secure deployment controls, failure to qualify a
      credible supply alternative, or financing terms that materially worsen dilution or
      preference overhang before commercial evidence catches up with the roadmap.
    claimRefs: [CR005, CR009, CR010, CR011, CR012, CR013, CR014, CR015, CR016]
callouts:
  - calloutType: risk
    title: Valuation and roadmap must be underwritten separately
    body: >-
      The $1.45 billion financing valuation is observable, but audited liquidity and the
      cost to deliver the H1 2028 hardware roadmap are not available in the assigned evidence.
    claimRefs: [CR002, CR005]
  - calloutType: insight
    title: Comparable stress is a monitoring signal, not a forecast
    body: >-
      Hailo's reported valuation reset and Blaize's accounting losses show that edge-AI
      technical relevance can coexist with financing and commercialization pressure.
    claimRefs: [CR015, CR016]
