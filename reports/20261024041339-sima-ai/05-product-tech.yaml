chapter:
  number: 5
  title: Product & Technology
  summary: SiMa.ai combines Modalix MLSoC hardware with the Palette software stack to run multimodal and vision inference at the edge, with a product surface spanning chip-down designs, modules, development kits, and PCIe cards. Public evidence supports a credible deployment workflow and mature first-generation production history, but independent performance, security-control, reliability, and second-source evidence remains limited.
sections:
  - id: product-surface
    title: Product surface and customer workflow
    body: >-
      SiMa.ai's product is a hardware/software edge-inference platform rather than
      a standalone model API. The company describes Modalix as a second-generation
      MLSoC family supporting CNNs, Transformers, LLMs, LMMs, and generative AI,
      with M25, M50, M100, and M200 configurations. The official hardware
      documentation exposes three integration levels: the Modalix chip for a
      customer-designed board, the Modalix SoM with LPDDR5 and power, and
      pre-integrated DevKit and PCIe products. This lets a buyer begin with
      evaluation hardware and later move toward a carrier-board or chip-down
      design, but it also creates hardware bring-up and lifecycle work that is
      not eliminated by the software compatibility promise.
    claimRefs: [CE001, CE002, CE003]
    tableRefs: [TE001]
  - id: architecture-and-workflow
    title: Architecture, software path, and integration
    body: >-
      The documented architecture is a heterogeneous edge system: eight Arm
      Cortex-A65 application cores, a Machine Learning Accelerator, an image
      signal processor, and a computer-vision unit are combined on the Modalix
      die, with LPDDR5, camera interfaces, Ethernet, PCIe, and eLxr Linux
      appearing in the product documentation. Palette and Edgematic provide the
      model-preparation path: a developer trains or exports a model, performs
      graph surgery, quantization, and compilation, transfers compiled artifacts
      to Edgematic, and evaluates the result on edge hardware. AWS's worked
      example shows that this path can connect SageMaker, Docker/ECR, Palette,
      and an edge device, but it also introduces cloud-account, IAM, container,
      storage, and large-image operational dependencies.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE002, TE003]
    figureRefs: [FE001]
  - id: maturity-and-differentiation
    title: Maturity, differentiation, and ecosystem proof
    body: >-
      Public maturity evidence is strongest for the first-generation platform:
      SiMa.ai announced shipping in 2022 and later described full
      characterization, production-grade silicon, boards, and Palette
      functionality in 2023. Modalix was announced in September 2024, with
      customer samples targeted for Q4 2024, and a 2026 company release says
      the Modalix SoM launched in 2025. This is a coherent progression from
      silicon to modules and deployment tooling, while the exact current
      production volume, customer yield, and Modalix benchmark results remain
      undisclosed in the retained sources. The Arteris case study and AWS
      deployment walkthrough indicate partner support for SoC interconnect and
      model deployment, not independent proof of broad production scale.
    claimRefs: [CE006, CE007, CE010, CE011, CE012, CE013]
  - id: trust-and-technical-risks
    title: Trust, safety, security, and technical risks
    body: >-
      The product is positioned for safety-sensitive settings such as factories,
      warehouses, robotics, mobility, healthcare, and aerospace, where local
      inference can reduce latency and keep data on-device. AWS's deployment
      example explicitly says the workflow can reduce latency, avoid continuous
      cloud connectivity, reduce security risks, and keep data in-house; those
      are workflow properties, not a certification or proof of secure operation.
      SiMa.ai's older production announcement records CE, FCC, and UL-related
      board testing, while the preliminary Modalix brief describes secure boot,
      authenticated boot images, eFuse key storage, and a security API. The
      retained evidence does not establish current third-party Modalix security
      certifications, vulnerability-response performance, uptime, thermal limits
      under customer workloads, or a qualified second-source manufacturing plan.
      A buyer should therefore treat integration control, field reliability, and
      security assurance as diligence gates rather than assume them from the
      architecture.
    claimRefs: [CE014, CE015, CE016, CE017]

