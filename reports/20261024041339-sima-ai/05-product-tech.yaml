    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - ["Application and models", "CNN, Transformer, LLM, LMM, and generative-AI workloads", "Framework exports, model weights, calibration data", "Model compatibility and accuracy can vary by graph and quantization settings"]
      - ["Palette software", "ModelSDK compilation, quantization, and performance preparation", "SiMa.ai developer portal and toolchain versions", "Version drift, proprietary compiler dependence, and opaque optimization behavior"]
      - ["MLSoC Modalix", "MLA plus Arm application complex, ISP, and CVU on one die", "SiMa.ai silicon design and third-party IP", "Thermal, silicon errata, and workload-specific performance require validation"]
      - ["Board, module, and I/O", "LPDDR5, MIPI CSI, Ethernet, PCIe, storage, and power delivery", "Carrier-board design, cameras, host systems, and firmware", "Bring-up, signal integrity, thermals, and component availability add OEM effort"]
      - ["Cloud-to-edge deployment", "SageMaker training/export connected to Edgematic edge evaluation", "AWS account, IAM, ECR, Docker, network and storage", "Large container image and cloud permissions increase operational complexity"]
    notes: "Architecture rows synthesize the official hardware documentation and retained deployment material; they describe documented roles and dependencies, not a complete internal block diagram or security threat model."
    claimRefs: [CE005, CE006, CE007, CE009, CE016]

