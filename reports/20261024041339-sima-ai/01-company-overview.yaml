company:
  name: SiMa.ai
chapter:
  number: 1
  title: Company Overview
  summary: SiMa.ai is a San Jose-based fabless edge-AI semiconductor company founded in 2018 that combines Modalix MLSoC hardware with Palette software for Physical AI deployments. The September 2026 Series C announcement reports $500 million of cumulative capital and a $1.45 billion valuation, but audited financials and full capitalization terms remain unavailable in the assigned evidence.
sections:
  - id: identity-and-product
    title: Identity, product, and operating footprint
    body: SiMa.ai presents itself as a software-centric embedded-edge machine-learning system-on-chip company. Its product stack combines Modalix silicon, modules and development kits with Palette software, while the hardware documentation describes a second-generation MLSoC integrating application compute, machine-learning acceleration, image-signal processing, and computer-vision processing on one die. The company says it was founded in 2018 and is headquartered in San Jose; its own story page lists offices in eight countries, but the assigned evidence does not independently verify employee count, revenue, active-customer count, or the proportion of production deployments. The platform is positioned for robotics, automotive, drones, industrial automation, aerospace and defense, smart vision, and healthcare, which broadens the opportunity but also increases the number of integration and go-to-market motions that must be executed.
    claimRefs: [CO001, CO002, CO003, CO004, CO011, CO012]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, board, and key-person dependence
    body: "Krishna Rangasayee is identified by SiMa.ai as founder and CEO, and the company’s leadership materials list a board chaired by Moshe Gavrielov alongside Scott Darling, Lip-Bu Tan, Andrew Homan, Jake Flomenberg, and Mike Dauber. The listed backgrounds span Xilinx, Cadence, Intel, Dell Technologies Capital, Maverick Capital, Wing Ventures, and Amplify Partners, giving the company relevant semiconductor and investor coverage. These are company-published governance disclosures rather than an independently filed governance record. The founder-CEO role creates ordinary key-person dependence for a private, technically complex semiconductor business: the assigned sources do not provide succession planning, executive tenure detail, or board voting and protective provisions."
    claimRefs: [CO001, CO009, CO010]
    tableRefs: [TO002]
  - id: financing-and-milestones
    title: Financing, valuation, and milestone interpretation
    body: The latest company announcement dated September 28, 2026 reports a $150 million Series C, $500 million total capital raised, and a $1.45 billion valuation; Yahoo Finance reproduces the same paid Business Wire release, while Forge Global lists a September 29 update with the same valuation and round amount. These sources establish a consistent reported financing headline, not audited cash available, runway, revenue, or liquidation economics. An August 2025 company announcement reported $85 million raised for $355 million cumulative capital, while an April 2025 product brief still cited $270 million raised, preserving the period attached to each disclosed figure. An independent Barchart article reports Micron's strategic investment and early Modalix commercialization, while CNBC frames the broader AI-chip field as a capital-intensive contest against Nvidia's scale. Access to capital is a strength, but the investment case still depends on commercial conversion and capitalization terms.
    claimRefs: [CO005, CO006, CO007, CO008, CO013, CO014, CO015, CO016]
    tableRefs: [TO003]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Strong reported financing step-up
    body: The September 2026 Series C announcement reports $150 million of new financing, $500 million of cumulative capital, and a $1.45 billion valuation, with multiple assigned sources reproducing the headline.
    claimRefs: [CO005]
  - calloutType: risk
    title: Private-company disclosure gap
    body: The assigned evidence does not provide audited revenue, gross margin, operating burn, cash balance, runway, customer concentration, or full Series C terms; those omissions materially limit underwriting precision.
    claimRefs: [CO016]
  - calloutType: insight
    title: Execution breadth is material
    body: SiMa.ai is pursuing hardware, software, modules, developer tools, and multiple Physical AI verticals simultaneously, so product availability and partner validation are not substitutes for independently verified production scale.
    claimRefs: [CO003, CO004, CO011, CO014]
