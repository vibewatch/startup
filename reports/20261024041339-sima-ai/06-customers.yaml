chapter:
  number: 6
  title: Customers
  summary: >-
    SiMa.ai shows credible customer and partner engagement across industrial, robotics,
    mobility, healthcare, and consumer equipment use cases, but the retained evidence is
    mostly company- or partner-reported and does not disclose customer counts, revenue
    concentration, renewal, or production utilization.
sections:
  - id: customer-segments
    title: Buyer, user, and use-case segmentation
    body: >-
      The evidence points to a broad embedded-edge customer profile rather than one
      concentrated vertical. SiMa.ai describes target applications across robotics,
      automotive, industrial automation, aerospace and defense, smart vision, healthcare,
      drones, and retail. Its 2025 financing release says customer demand spans those
      markets, while the 2026 Series C release names ARK Electronics, AVerMedia, Bosch,
      Emerson, Intrinsic, Kontron, L&T Technology Services, Micron, STIGA, Synopsys, TRUMPF
      SE, and Virya Autonomous Technologies as customers or partners. Those names establish
      commercial reach, not a verified count of paying accounts or revenue-weighted
      segmentation. The buyer is likely an equipment maker, systems integrator, or
      engineering organization embedding inference into a product; the end user is the
      operator of the resulting machine. The retained documents do not identify contract
      value, payer, deployment geography, or whether each named relationship is a customer,
      design partner, supplier, or ecosystem partner.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and commercial signals
    body: >-
      Adoption signals are strongest where a named counterpart describes a concrete
      integration objective. STIGA states that it intends to use SiMa.ai's low-power
      platform for real-time decision-making in domestic and commercial robotic lawn
      mowers, and describes a scalable solution architecture for its mower portfolio.
      L&T Technology Services describes a strategic partnership combining its engineering
      capabilities and client reach with SiMa.ai's MLSoC ONE platform, software SDK, joint
      use-case development, and a product-support framework. These are meaningful
      commercialization signals, but neither source establishes production shipment
      volume, paid deployment, renewal, utilization, or end-customer outcomes. SiMa.ai's
      own releases describe Modalix as shipping and in full-scale production, and report
      company-level revenue growth, but those statements are not customer-level adoption
      denominators. The result is a plausible design-in and ecosystem funnel with no
      independently verified conversion from evaluation to scaled production.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: proof-retention-concentration
    title: Named proof, durability, and concentration gaps
    body: >-
      Named proof is uneven. STIGA is the clearest customer-side evidence because the
      partner announcement is issued by STIGA and describes a product family and operating
      objective, while the L&T announcement is issued by a listed engineering-services
      partner and describes joint go-to-market and support. By contrast, the longer list
      of brands in SiMa.ai's financing release is a company statement without customer
      quotes, contract scope, deployment status, or outcome metrics. A SiMa.ai executive
      interview says the company met with more than 30 customers during its early design
      process and later argued that it needed more than 1,000 customers to scale, but
      those are historical management statements rather than a current active-customer
      count. No retained source reports NRR, GRR, churn, renewal rates, contract length,
      cohort behavior, top-account share, or dollar-weighted pipeline. Customer durability
      and concentration therefore remain material diligence gaps, particularly because
      a hardware-and-software platform may depend on a small number of design wins before
      volume production.
    claimRefs: [CU010, CU011, CU012, CU013, CU014]
    tableRefs: [TU003]
callouts:
  - calloutType: insight
    title: Commercial signal is real but not yet revenue-grade
    body: >-
      Named STIGA and L&T relationships demonstrate concrete application and channel
      pathways; the evidence does not yet show how many relationships converted into
      paid production deployments or recurring software revenue.
    claimRefs: [CU005, CU006, CU013]
  - calloutType: risk
    title: Retention and concentration are unobservable
    body: >-
      No retained source provides customer count, renewal, churn, net retention, contract
      duration, or revenue concentration, so customer quality cannot be scored from logos
      or partnership announcements alone.
    claimRefs: [CU012, CU014]
