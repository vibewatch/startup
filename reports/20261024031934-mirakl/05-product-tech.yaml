chapter:
  number: 5
  title: Product & Technology
  summary: Mirakl presents a broad enterprise marketplace operating system spanning marketplace operations, seller and catalog
    workflows, multichannel connections, retail media, and newer agentic-commerce infrastructure. Public evidence supports
    a mature enterprise operating model and visible security and enablement surfaces, but detailed architecture, reliability
    metrics, implementation effort, and independent developer traction remain insufficiently disclosed.
sections:
- id: product-scope
  title: Product scope and maturity
  body: 'Mirakl''s product surface is an enterprise marketplace operating system rather than a single storefront plug-in.
    A current company job page describes Mirakl Platform for launching, scaling, and operating marketplaces and dropship,
    alongside Mirakl Connect for AI-powered multichannel selling, Mirakl Ads for retail media, and Mirakl Nexus for agentic
    commerce. The same page states that the company supports 450+ marketplaces and more than 100k third-party sellers, but
    those scale figures are company-issued and should not be treated as independently audited. External review evidence is
    narrower but useful: Capterra records reviewer-rated shipping management, third-party integrations, and order management
    features, while a customer-facing support article shows that seller APIs cover operational processes such as orders, documents,
    and invoices. The product therefore has a credible operational core, while the public record does not establish module-level
    adoption, implementation duration, uptime, or realized customer outcomes.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  tableRefs:
  - TE001
- id: workflow-and-architecture
  title: Workflow, integrations, and architecture
  body: 'The observable workflow begins with seller onboarding and third-party catalog integration, continues through offer
    and inventory data, order orchestration, shipping, and accounting, and can extend into retail media and agent-facing discovery.
    A customer support article explains that Mirakl APIs automate processes between an integrating system and orders, documents,
    invoices, or other available processes; the API Tracker profile cautions that authentication, permissions, and current
    field support must be confirmed in provider documentation. Mirakl''s AI-engineering hiring specification provides the
    clearest public architecture signal for its newer capabilities: LLMs, retrieval-augmented generation, agents, multimodal
    models, evaluation frameworks, orchestration layers, APIs, tools, retrieval systems, and business workflows, with cloud,
    container, and Kubernetes tooling. This is evidence of intended engineering practice and hiring scope, not proof that
    every component is generally available in the commercial product. Agentic commerce also introduces a data-quality dependency:
    PYMNTS reports that missing metadata, inconsistent language, and incomplete images can become deal-breakers when agents
    discover products outside the retailer''s own site.'
  claimRefs:
  - CE006
  - CE007
  - CE008
  - CE009
  - CE010
  tableRefs:
  - TE002
  figureRefs:
  - FE001
- id: trust-and-gaps
  title: Trust, deployment, and diligence gaps
  body: Mirakl has visible trust and enablement mechanisms, but public evidence is not equivalent to a complete control assessment.
    The Cloud Security Alliance registry describes a Mirakl SaaS solution that automates marketplace operations including
    seller onboarding and third-party catalog integration, and lists a CAIQ artifact intended to document cloud controls;
    the registry is a useful external security surface but does not, by itself, certify operational performance or eliminate
    customer-specific diligence. Mirakl's training catalog lists self-paced power-user, operational, strategic, and business-analyst
    courses, plus quarterly release-note training, which supports an enablement model for complex enterprise deployments.
    The public GitHub organization exposes a PHP seller SDK and a Terraform module, but the page does not establish repository
    breadth, release cadence, contributor depth, or a broad external developer ecosystem. The key technical underwriting gaps
    are therefore implementation effort, uptime and incident history, tenant isolation, security attestations and scope, API
    versioning and limits, data lineage for AI features, and measured quality or latency for agentic workflows.
  claimRefs:
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
  tableRefs:
  - TE003
- id: product-verdict
  title: Product verdict
  body: 'Mirakl appears technically credible for enterprise marketplace operations because the evidence converges on a multi-module
    workflow, integration APIs, customer-facing operating tools, security-control documentation, and an emerging AI stack.
    The differentiation is less a single disclosed algorithm than the combination of marketplace process coverage, enterprise
    integration, seller and catalog operations, ecosystem connectivity, and operational know-how. That breadth is also the
    central execution risk: customers may need substantial data, integration, governance, and change-management work before
    the platform produces reliable marketplace economics. Product diligence should prioritize production reference calls,
    architecture and data-flow review, service-level and incident records, API and event-contract documentation, security
    reports with scope and dates, and evidence separating shipped capabilities from roadmap or recruiting ambition.'
  claimRefs:
  - CE003
  - CE006
  - CE008
  - CE011
  - CE015
