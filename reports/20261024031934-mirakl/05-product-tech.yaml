figures:
- id: FE001
  title: Mirakl product architecture map
  type: stack
  summary: Enterprise marketplace operations sit beneath integration, catalog, and agentic-commerce capabilities, with trust
    and enablement spanning the stack.
  data:
    layers:
    - label: Trust and enablement
      modules:
      - detail: CSA STAR registry and CAIQ artifact are publicly visible; scope and dates require diligence.
        label: Security controls
      - detail: Mirakl University lists power-user, operational, strategic, business-analyst, and release-note courses.
        label: Training and release enablement
    - label: Agentic and retail extensions
      modules:
      - detail: Agent-facing product, inventory, and pricing discovery and transaction infrastructure are described in partner
          coverage.
        label: Mirakl Nexus
      - detail: Company-described retail-media product for marketplace operators.
        label: Mirakl Ads
    - label: Marketplace operating core
      modules:
      - detail: Marketplace launch, scale, operation, dropship, seller onboarding, catalog, and order workflows.
        label: Platform operations
      - detail: Multichannel connections, seller APIs, SDKs, documents, invoices, and order automation.
        label: Connect and APIs
    - label: Customer and seller systems
      modules:
      - detail: Owns customer experience, marketplace governance, catalog quality, and commercial outcomes.
        label: Retailer or B2B operator
      - detail: Supply product data, inventory, offers, orders, and fulfillment signals through marketplace workflows.
        label: Third-party sellers
    - label: Data governance
      modules:
      - label: Catalog quality
        detail: Product metadata, language, images, inventory, and pricing must remain agent-readable and current.
      - label: Access controls
        detail: API authentication, permissions, and customer governance require confirmation in provider documentation.
    - label: Infrastructure and observability
      modules:
      - label: Cloud runtime
        detail: The public engineering specification names AWS or GCP, Docker, and Kubernetes.
      - label: Evaluation and monitoring
        detail: The public engineering specification names evaluation frameworks, monitoring, reliability, latency, and performance
          metrics.
  claimRefs:
  - CE001
  - CE002
  - CE006
  - CE008
  - CE009
  - CE011
  - CE012
  - CE013
  approximationNotes: Layer order is an analytical representation of publicly described modules and dependencies, not a disclosed
    Mirakl reference architecture.
