  evidenceGaps:
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: Independent uptime, incident, service-level, and support-performance records for Mirakl production deployments.
    whyItMatters: Marketplace downtime or weak support can interrupt seller, inventory, order, and payment workflows for enterprise
      customers.
    diligencePath: Request the latest SLA, uptime report, incident register, severity definitions, service credits, and three
      customer reference calls.
    relatedQuestionRefs:
    - QE005
    - QE008
  - type: private-evidence-only
    severity: material
    topic: architecture
    missingEvidence: Current tenant-isolation, data-flow, API-versioning, rate-limit, and integration architecture documentation.
    whyItMatters: Enterprise deployment risk depends on how customer data, seller data, APIs, and AI retrieval paths are isolated
      and operated.
    diligencePath: Obtain a technical architecture review, data-processing map, API contract set, rate-limit schedule, and
      security questionnaire responses.
    relatedQuestionRefs:
    - QE002
    - QE003
    - QE005
  - type: missing-source
    severity: material
    topic: ai-quality
    missingEvidence: Production quality, latency, cost, evaluation, and guardrail metrics for Mirakl's AI and agentic-commerce
      capabilities.
    whyItMatters: Agent-facing catalog and transaction errors can create commercial, compliance, and trust losses even when
      the underlying marketplace workflow is mature.
    diligencePath: Request feature availability by release, evaluation methodology, benchmark results, failure taxonomy, human-review
      controls, and customer production references.
    relatedQuestionRefs:
    - QE007
    - QE009
  - type: enumeration-incomplete
    severity: minor
    topic: developer-signal
    missingEvidence: Complete public repository inventory, release cadence, contributor counts, package usage, and API change
      history.
    whyItMatters: A small visible developer surface may reflect a private enterprise product, but it limits independent assessment
      of extensibility and ecosystem momentum.
    diligencePath: Request the supported SDK and integration inventory, release notes, deprecation policy, partner certification
      list, and developer adoption metrics.
    relatedQuestionRefs:
    - QE006
