      - [Enterprise dropship operator, "Retail operations or merchandising leader", "Supplier and fulfillment operations", "Retail operating budget", "Supplier feeds, order routing, and fulfillment", "Operations and supply chain", "Category expansion with lower working-capital exposure"]
      - [Marketplace operator with media traffic, "Retail media or marketplace monetization lead", "Brands, sellers, and ad-operations teams", "Marketplace or media P&L", "Sponsored listings and seller monetization", "Retail media", "Monetize existing buyer traffic"]
