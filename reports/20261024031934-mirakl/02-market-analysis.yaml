    title: Market sizing lens
    type: pyramid
    summary: The public evidence supports a broad platform-market lens and narrower Mirakl activity lenses, but does not support a numeric company SAM or SOM.
    data:
      nodes:
        - {label: "Global e-commerce platform market, 2030", value: 16.51, unit: "USD billions", note: "MarketsandMarkets forecast"}
        - {label: "Global e-commerce platform market, 2025", value: 9.08, unit: "USD billions", note: "MarketsandMarkets estimate"}
        - {label: "Mirakl platform GMV, 2025 approximate", value: 15, unit: "USD billions", note: "Digital Commerce 360; article also cites USD 14.6B"}
        - {label: "Mirakl ARR, 2025", value: 218, unit: "USD millions", note: "Company-reported; not market size"}
        - {label: "Mirakl-specific SAM", value: null, unit: null, note: "Not publicly isolated"}
        - {label: "Mirakl-specific SOM", value: null, unit: null, note: "Not publicly isolated"}
    approximationNotes: >-
      This is a presentation of non-comparable sizing lenses, not a proportional funnel; GMV,
      ARR, and platform-market values have different units, denominators, and definitions.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM015]
callouts:
  - calloutType: insight
    title: Category growth is not company SAM
    body: Public forecasts show expanding platform demand, but the investable question remains how much of that spend is enterprise marketplace infrastructure that Mirakl can serve profitably.
    claimRefs: [CM005, CM015]
  - calloutType: risk
    title: Enterprise adoption carries execution friction
    body: Integration requirements, quote-based pricing, implementation resources, and the need to create buyer traffic can delay or weaken marketplace returns even when the software is technically capable.
    claimRefs: [CM003, CM013, CM014]
