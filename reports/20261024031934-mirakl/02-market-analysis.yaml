company:
  name: Mirakl
chapter:
  number: 2
  title: Market Analysis
  summary: Mirakl participates in the enterprise marketplace and broader e-commerce platform markets, with the strongest evidence concentrated in large retailers, distributors, manufacturers, and B2B operators. Public sizing supports a growing software category, but the company-specific SAM and SOM remain unisolated because private pricing, customer budgets, and segment revenue are not disclosed.
sections:
  - id: market-boundary
    title: Market boundary and buying job
    body: >-
      The relevant market is enterprise marketplace infrastructure: software that lets an
      established retailer, distributor, manufacturer, or B2B organization onboard third-party
      sellers, normalize catalogs, route multi-vendor orders, split payments, and operate
      dropship or retail-media programs. This is narrower than all e-commerce GMV and broader
      than a storefront platform. The boundary includes marketplace management, dropship,
      catalog, seller, payout, and marketplace advertising modules when they serve the same
      multi-vendor workflow. It excludes first-party storefront commerce, warehouse inventory
      systems, general advertising software, and consumer marketplaces that do not buy
      infrastructure from Mirakl. The buyer is normally an enterprise e-commerce, digital
      commerce, procurement, or business-development owner; IT and finance influence the
      purchase because integration, payment controls, and budget approval are material.
      Cogent2 describes Mirakl as an enterprise-heavy platform for established retailers and
      B2B companies, while AmpiFire's review highlights the practical boundary: marketplace
      software manages sellers and operations but does not create buyer demand. The status quo
      is an existing e-commerce platform with extensions, an internally built marketplace, or
      no third-party assortment at all.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and evidence limits
    body: >-
      The public market evidence supports multiple lenses rather than one interchangeable TAM.
      MarketsandMarkets estimates the global e-commerce platform market at USD 9.08 billion in
      2025 and USD 16.51 billion in 2030, a 12.7% CAGR; that is an upper platform-market lens
      spanning B2B and B2C, not Mirakl's addressable revenue. 6Wresearch presents a much broader
      global B2B e-commerce estimate, but its page contains an apparent unit typo (“8000
      brillion” and “18500 brillion”), so it is retained as a directional source rather than a
      precise valuation input. Company activity provides a traction lens: Digital Commerce 360
      reports $15 billion of 2025 GMV processed through Mirakl's platform, while the same article
      says the company specified $14.6 billion elsewhere. These are platform throughput, not
      Mirakl revenue. The 2025 report also says Mirakl reached $218 million ARR, but this is a
      company-reported operating metric and should not be treated as the market size. The
      defensible conclusion is that software demand is expanding, while Mirakl's SAM and SOM
      require customer-segment revenue, contract values, renewal data, and win-rate evidence
      that are not public in this pool.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyer segments, adoption drivers, and constraints
    body: >-
      The most attractive buyer segment is a large organization with an existing traffic base,
      a need to expand assortment without owning all inventory, and enough integration capacity
      to operate multi-vendor workflows. Digital Commerce 360 reports that 45 global enterprises
      joined Mirakl's customer base in 2025 and that 36 enterprises launched new marketplace or
      dropship operations; those figures indicate enterprise adoption activity, not a complete
      market conversion rate. Landbase records 488 verified companies using Mirakl as of 2026,
      but its commercial database methodology and coverage boundary are not fully disclosed.
      Adoption drivers are assortment expansion, reduced inventory risk, seller-network access,
      payment and catalog complexity, and faster launch than a bespoke build. Constraints are
      the need for an existing storefront or commerce stack, technical implementation,
      enterprise pricing, seller liquidity, and buyer traffic. AmpiFire explicitly notes that
      a technically successful marketplace can still stall if demand is weak; Cogent2 likewise
      says Mirakl is typically a significant investment suited to larger organizations. The
      implication for valuation is positive category exposure but a high dependence on enterprise
      budgets, implementation execution, and customer-level marketplace economics.
    claimRefs: [CM010, CM011, CM012, CM013, CM014]
    tableRefs: [TM003]
  - id: diligence-gaps
    title: Unresolved sizing and adoption questions
    body: >-
      The evidence does not isolate Mirakl's serviceable market by geography, vertical, module,
      or buyer budget. Public sources also disagree or use different units: the 2025 article
      gives both approximately $15 billion and specifically $14.6 billion for platform GMV,
      while older third-party material cites 2023 transaction value above €8.2 billion. These
      are not interchangeable periods or currencies. Pricing is similarly incomplete: AmpiFire
      reports published Mirakl Connect tiers, while enterprise Marketplace and Dropship pricing
      remains quote-only; Cogent2 describes a base fee plus possible GMV component but is not an
      audited pricing schedule. The next diligence step is to obtain a segment-level bookings and
      revenue bridge, customer count by vertical and geography, average contract value and
      implementation duration, renewal and expansion rates, and evidence on the share of GMV
      attributable to Marketplace, Dropship, Connect, Catalog, and Ads. Until then, market
      growth is a supportive context rather than proof of a proportional Mirakl opportunity.
    claimRefs: [CM015, CM016]
    callouts: []
