company:
  name: Mirakl
chapter:
  number: 1
  title: Company Overview
  summary: Mirakl is a Paris-headquartered enterprise marketplace software company led by co-founders Philippe Corrot and Adrien Nussenbaum. Assigned evidence supports a $3.5 billion September 2021 valuation and meaningful operating scale, but conflicting funding tallies, unaudited performance figures, incomplete governance disclosure, and a dated priced round limit current underwriting confidence.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Mirakl provides enterprise software that lets retailers, manufacturers, distributors, and brands operate branded marketplaces rather than selling through a consumer marketplace owned by Mirakl. Adobe documents seller management inside Adobe Commerce, while M2E describes synchronization of product catalogs, inventory, pricing, and orders across Mirakl-powered channels. Those partner descriptions support a subscription-software and ecosystem-enablement model, not an inventory-owning retail model. The assigned sources consistently place headquarters in Paris, but they do not agree on the founding year: Tracxn and UpMarket use 2012, whereas Multiples and Clay use 2011. Because no incorporation filing or original founding announcement is in the assigned pool, the discrepancy remains explicit rather than being resolved by assumption.
    claimRefs: [CO001, CO002, CO005]
    tableRefs: [TO001]
  - id: founders-leadership-and-governance
    title: Founders, leadership, and governance
    body: >-
      The evidence consistently identifies Philippe Corrot and Adrien Nussenbaum as Mirakl's co-founders, and UpMarket lists both as co-CEOs. This continuity concentrates company knowledge and external representation in the founding pair, which is potentially valuable for category expertise but creates a succession and key-person diligence issue. The assigned evidence does not provide a complete executive roster, board membership, committee structure, voting rights, or current ownership percentages. It therefore supports the identity of the two senior leaders but not a conclusion that governance is institutionally diversified. A current organization chart, board register, succession plan, and cap table are necessary before assigning control or dependency beyond the publicly visible co-CEO structure.
    claimRefs: [CO003, CO004]
    tableRefs: [TO002]
  - id: financing-and-scale
    title: Financing, valuation, and operating scale
    body: >-
      The clearest priced benchmark is the September 2021 Series E: multiple assigned sources report $555 million raised at a $3.5 billion post-money valuation, led by Silver Lake. Earlier histories also report a $300 million Series D at more than $1.5 billion in September 2020. Aggregate funding is less clean. Tracxn reports $948 million across six rounds, Multiples reports $945 million across four, and Clay displays both a $1.1 billion headline and a separate $948 million total. The August 2023 debt event is similarly described as $110 million by Tracxn and EUR100 million by Clay. These differences preclude treating any aggregate as cash available. Operating evidence is stronger on direction than audit quality: Digital Commerce 360 relays nearly $160 million of 2023 revenue and $8.6 billion of platform GMV, while Sacra estimates $218 million of 2025 ARR. Revenue, ARR, GMV, funding, and liquidity remain distinct measures.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO011, CO012, CO015]
    tableRefs: [TO003]
  - id: milestones-and-risk-boundaries
    title: Milestones and risk boundaries
    body: >-
      Mirakl's public chronology shows sustained expansion: late-stage equity financing in 2020 and 2021, the Target2Sell acquisition in 2022, a debt financing and first reported platform profitability in 2023, the Adspert acquisition in 2024, and Sacra's estimate of continued ARR growth in 2025. Separate sources repeatedly place the customer or marketplace footprint above 450, although they use different denominators and should not be combined into a more precise total. The evidence also sets a commercial boundary. AmpiFire argues that marketplace software can organize sellers without creating buyer demand, making traffic generation and internal operating capacity material adoption risks. Current headcount, board composition, customer concentration, retention, margins, debt covenants, and liquidity are not established by the assigned evidence.
    claimRefs: [CO006, CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Enterprise scale is visible across different source types
    body: Independent reporting, partner evidence, and analyst coverage repeatedly place Mirakl's customer or marketplace footprint above 450, while preserving the sources' different denominators.
    claimRefs: [CO006]
  - calloutType: risk
    title: Public metrics do not provide a current capital picture
    body: The last disclosed priced valuation is from 2021, funding totals conflict, the 2023 debt amount is reported in different currencies, and audited liquidity and covenant data are absent.
    claimRefs: [CO008, CO009, CO010]
