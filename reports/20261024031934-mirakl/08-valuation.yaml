company:
  name: Mirakl
chapter:
  number: 8
  title: Valuation
  summary: >-
    Mirakl has a credible enterprise marketplace franchise and evidence of substantial
    ARR and customer scale, but the last disclosed $3.5B private mark is from September
    2021 and current public valuation inputs are inconsistent. The evidence therefore
    supports a track recommendation pending audited revenue quality, current financing
    terms, and a priced liquidity event.
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      The investment case rests on a specialized enterprise position rather than a
      generic e-commerce software multiple. BounceWatch classifies the company as a
      SaaS, platform, and B2B business with subscription, transaction-fee, and
      usage-based revenue, while Sacra reports 450+ customers, a 13,000+ seller
      network, $15B of 2025 GMV, and estimated 2025 ARR of $218M. Those signals
      indicate meaningful platform adoption and operating scale, but Sacra's ARR is
      an estimate rather than audited company reporting. The anti-thesis is price
      discovery: the last disclosed financing valued Mirakl at $3.5B in September
      2021, and current pages still describe that mark as the latest reported round.
      At that price, the visible 2025 ARR estimate implies roughly 16.1x ARR, but the
      denominator is not audited and cannot be treated as a live transaction multiple.
      Ranktora's comparison says Mirakl is strongest for enterprise operators but not
      the easiest or most transparent route, reinforcing fit and execution risk
      alongside valuation risk.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001, TV002]
  - id: price-discipline
    title: Price discovery and entry discipline
    body: >-
      Public evidence supports a disciplined range, not a precise current valuation.
      UpMarket identifies the September 2021 Series E as a $555M raise at a $3.5B
      post-money valuation and says private shares do not trade continuously. Its
      disclosure also warns that secondary prices can differ from the last round
      price and that pre-IPO investments are illiquid and speculative. QuantLogix
      records the same last-round mark but publishes a separate QL Price of $18B,
      explicitly calling it a model estimate rather than a quote or target price;
      that figure is not a sufficiently independent transaction benchmark. Multiples
      reports a 35.0x revenue multiple on $100M of revenue at the 2021 mark, while
      Sacra estimates $218M ARR for 2025. The disparate denominators and time bases
      make a single multiple unreliable. Entry should therefore require a current
      primary financing document, cap-table and preference review, and a material
      discount to the stale priced round unless verified growth and margins justify
      otherwise. BounceWatch and Clay both record a €100M debt financing in August
      2023, while the assigned aggregators disagree on total funding and round count;
      neither fact reveals current cash availability, debt draw, covenants, or
      preference seniority.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV015, CV016]
    tableRefs: [TV003]
  - id: scenarios-and-comparables
    title: Scenarios and comparable logic
    body: >-
      Scenario analysis is intentionally anchored to disclosed or explicitly estimated
      operating facts rather than an invented target price. The bull case assumes the
      2025 ARR estimate is broadly accurate, the reported 23% growth persists, and
      enterprise marketplace adoption supports a premium software multiple; the base
      case applies a substantial private-company discount to the stale 2021 mark and
      assumes slower growth until audited revenue and retention data are available.
      The bear case treats the $3.5B mark as impaired by the absence of a newer priced
      round, possible multiple compression, illiquidity, and unresolved preference
      economics. Multiples lists public and private reference companies, including
      VTEX's 2.8x 2025 revenue multiple in the Sacra comparison and lower public
      marketplace-related multiples in its comp table, but those businesses and
      revenue definitions are not fully comparable to Mirakl. The correct use of
      comparables is as a sensitivity check, not as a mechanically transferable
      multiple.
    claimRefs: [CV003, CV008, CV011, CV012, CV013]
  - id: decision-and-diligence
    title: Decision, exit readiness, and thesis breaks
    body: >-
      The evidence supports track rather than buy. Mirakl's scale, enterprise
      positioning, and seller ecosystem are meaningful strengths, but a private
      company with no continuously quoted price requires current primary evidence
      before an investment decision. The thesis improves if Mirakl supplies audited
      ARR-to-revenue reconciliation, gross margin, net and gross retention, customer
      concentration, current cash and debt information, and a clean cap-table
      showing liquidation preferences and secondary versus primary economics. The
      thesis breaks if a new financing prices materially below $3.5B without a
      compensating operating explanation, if ARR growth falls materially below the
      reported 23% estimate, or if customer and seller activity does not translate
      into durable recurring revenue. Exit readiness remains uncertain because
      UpMarket describes secondary transactions as illiquid and says there is no
      guaranteed exit timeline. A current audited financing or liquidity event is
      the highest-value next diligence milestone.
    claimRefs: [CV006, CV007, CV010, CV013, CV014]
    figureRefs: [FV001]
