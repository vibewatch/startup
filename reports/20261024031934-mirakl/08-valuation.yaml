callouts:
  - calloutType: recommendation
    title: Track, not buy
    body: >-
      Mirakl merits continued diligence because the enterprise platform and ecosystem
      appear substantial, but the public valuation record is stale and the newer
      operating metrics are estimates. Require current primary financing terms and
      audited revenue quality before underwriting.
    claimRefs: [CV002, CV006, CV010, CV014]
  - calloutType: risk
    title: Price discovery is the central risk
    body: >-
      A historical $3.5B mark, an independent-looking $18B model estimate, and
      inconsistent public revenue denominators should not be blended into a single
      current valuation.
    claimRefs: [CV006, CV008, CV009, CV010]
