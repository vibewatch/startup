  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buying job
        blocks:
          - type: paragraph
            body: >-
              The relevant market is enterprise marketplace infrastructure: software that lets an established retailer,
              distributor, manufacturer, or B2B organization onboard third-party sellers, normalize catalogs, route
              multi-vendor orders, split payments, and operate dropship or retail-media programs. This is narrower than
              all e-commerce GMV and broader than a storefront platform. The boundary includes marketplace management,
              dropship, catalog, seller, payout, and marketplace advertising modules when they serve the same
              multi-vendor workflow. It excludes first-party storefront commerce, warehouse inventory systems, general
              advertising software, and consumer marketplaces that do not buy infrastructure from Mirakl. The buyer is
              normally an enterprise e-commerce, digital commerce, procurement, or business-development owner; IT and
              finance influence the purchase because integration, payment controls, and budget approval are material.
              Cogent2 describes Mirakl as an enterprise-heavy platform for established retailers and B2B companies,
              while AmpiFire's review highlights the practical boundary: marketplace software manages sellers and
              operations but does not create buyer demand. The status quo is an existing e-commerce platform with
              extensions, an internally built marketplace, or no third-party assortment at all.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Sizing lenses and evidence limits
        blocks:
          - type: paragraph
            body: >-
              The public market evidence supports multiple lenses rather than one interchangeable TAM. MarketsandMarkets
              estimates the global e-commerce platform market at USD 9.08 billion in 2025 and USD 16.51 billion in 2030,
              a 12.7% CAGR; that is an upper platform-market lens spanning B2B and B2C, not Mirakl's addressable
              revenue. 6Wresearch presents a much broader global B2B e-commerce estimate, but its page contains an
              apparent unit typo (“8000 brillion” and “18500 brillion”), so it is retained as a directional source
              rather than a precise valuation input. Company activity provides a traction lens: Digital Commerce 360
              reports $15 billion of 2025 GMV processed through Mirakl's platform, while the same article says the
              company specified $14.6 billion elsewhere. These are platform throughput, not Mirakl revenue. The 2025
              report also says Mirakl reached $218 million ARR, but this is a company-reported operating metric and
              should not be treated as the market size. The defensible conclusion is that software demand is expanding,
              while Mirakl's SAM and SOM require customer-segment revenue, contract values, renewal data, and win-rate
              evidence that are not public in this pool.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
      - number: '2.3'
        title: Buyer segments, adoption drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The most attractive buyer segment is a large organization with an existing traffic base, a need to expand
              assortment without owning all inventory, and enough integration capacity to operate multi-vendor
              workflows. Digital Commerce 360 reports that 45 global enterprises joined Mirakl's customer base in 2025
              and that 36 enterprises launched new marketplace or dropship operations; those figures indicate enterprise
              adoption activity, not a complete market conversion rate. Landbase records 488 verified companies using
              Mirakl as of 2026, but its commercial database methodology and coverage boundary are not fully disclosed.
              Adoption drivers are assortment expansion, reduced inventory risk, seller-network access, payment and
              catalog complexity, and faster launch than a bespoke build. Constraints are the need for an existing
              storefront or commerce stack, technical implementation, enterprise pricing, seller liquidity, and buyer
              traffic. AmpiFire explicitly notes that a technically successful marketplace can still stall if demand is
              weak; Cogent2 likewise says Mirakl is typically a significant investment suited to larger organizations.
              The implication for valuation is positive category exposure but a high dependence on enterprise budgets,
              implementation execution, and customer-level marketplace economics.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Unresolved sizing and adoption questions
        blocks:
          - type: paragraph
            body: >-
              The evidence does not isolate Mirakl's serviceable market by geography, vertical, module, or buyer budget.
              Public sources also disagree or use different units: the 2025 article gives both approximately $15 billion
              and specifically $14.6 billion for platform GMV, while older third-party material cites 2023 transaction
              value above €8.2 billion. These are not interchangeable periods or currencies. Pricing is similarly
              incomplete: AmpiFire reports published Mirakl Connect tiers, while enterprise Marketplace and Dropship
              pricing remains quote-only; Cogent2 describes a base fee plus possible GMV component but is not an audited
              pricing schedule. The next diligence step is to obtain a segment-level bookings and revenue bridge,
              customer count by vertical and geography, average contract value and implementation duration, renewal and
              expansion rates, and evidence on the share of GMV attributable to Marketplace, Dropship, Connect, Catalog,
              and Ads. Until then, market growth is a supportive context rather than proof of a proportional Mirakl
              opportunity.
            claimRefs:
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Category growth is not company SAM
            body: >-
              Public forecasts show expanding platform demand, but the investable question remains how much of that
              spend is enterprise marketplace infrastructure that Mirakl can serve profitably.
            calloutType: insight
            claimRefs:
              - CM005
              - CM015
          - type: callout
            title: Enterprise adoption carries execution friction
            body: >-
              Integration requirements, quote-based pricing, implementation resources, and the need to create buyer
              traffic can delay or weaken marketplace returns even when the software is technically capable.
            calloutType: risk
            claimRefs:
              - CM003
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive set spans platforms, frameworks, and the status quo
        blocks:
          - type: paragraph
            body: >-
              Mirakl is the enterprise incumbent in a market where the buyer can choose a direct marketplace platform,
              extend an existing commerce stack, commission an internal build, or retain manual seller and dropship
              operations. Sacra estimates that Mirakl entered 2026 with more than 450 customers, a network of more than
              13,000 pre-vetted sellers and brands, and $218 million of 2025 ARR; these are estimates rather than
              audited disclosures, but they frame a scale advantage that smaller direct challengers must overcome.
              Marketplacer is the clearest direct alternative in the assigned evidence, with a positioning centered on
              faster onboarding, hands-on support, and mid-market accessibility. Esetrix markets itself on lower cost
              and greater automation, while Medusa and an internal build trade packaged marketplace operations for
              architectural control. The status quo remains a real substitute because an operator can continue using its
              storefront, ERP, spreadsheets, and bilateral supplier integrations rather than fund a marketplace
              transformation. Mirakl's 2021 financing scale supports durability, but current funding and operating scale
              for most alternatives are not disclosed in the assigned evidence and are therefore shown as unknown rather
              than estimated.
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP010
              - CP013
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP010
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP008
              - CP010
      - number: '3.2'
        title: Product breadth is strong, but delivery capability is part of the product
        blocks:
          - type: paragraph
            body: >-
              Mirakl covers seller connection, catalog onboarding, order orchestration, payouts, advertising, and
              marketplace or dropship workflows. The retained B2B review also describes support for customer-specific
              pricing, quotes, multi-warehouse offers, organizational roles, punchout integrations, and external ERP or
              purchasing workflows. That breadth is not equivalent to a complete commerce stack: both BitBag and Cogent2
              describe Mirakl as a backend that still requires a customer-facing storefront and extensive integration
              with commerce, ERP, PIM, WMS, CRM, and finance systems. This makes systems integrators and interface
              governance part of the buying decision, not merely implementation overhead. B2B TechSelect's 2026
              comparison warns that adjacent Adobe, SAP, or PIM experience does not prove native Mirakl implementation
              capability and recommends matching references to the exact scope. Mirakl's ecosystem can deepen
              distribution and switching costs, but execution risk shifts into interface ownership, seller activation,
              exception handling, payout reconciliation, and post-launch support. Marketplacer competes by promising a
              more approachable operating model; open-source and internal-build routes can fit unusual workflows but
              require the buyer to own marketplace logic and continuity.
            claimRefs:
              - CP004
              - CP006
              - CP008
              - CP009
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP008
              - CP009
              - CP010
              - CP016
      - number: '3.3'
        title: The moat is meaningful, but high integration depth can become buyer lock-in
        blocks:
          - type: paragraph
            body: >-
              Public commercial evidence is uneven. A secondary 2026 review reports public Mirakl Connect seller tiers
              of $699 and $2,299 per month, while Marketplace and Dropship pricing remain quote-only. Esetrix's
              promotional comparison claims Mirakl starts at more than GBP20,000 per month and Marketplacer at GBP2,500
              plus 1.5% of GMV, but those figures are competitor-issued and were not corroborated by contracts or
              first-party price sheets in the assigned pool. They are useful only as diligence hypotheses. BitBag
              identifies the more durable lock-in mechanism: Mirakl is closed-source, depends on a separate commerce
              platform, and can require business processes to conform to its framework. Mirakl's seller network,
              installed base, catalog and payout data, and integration ecosystem can reinforce retention; conversely,
              interface complexity and professional-services dependence create openings for faster direct platforms and
              internal builds. The central underwriting question is therefore not whether Mirakl has more features, but
              whether its operational depth produces enough seller liquidity and execution leverage to offset
              implementation cost, roadmap dependence, and multi-system switching friction. Multiples' public page
              further illustrates the evidence risk by grouping revenue and ARR values under one label, so
              private-company scale comparisons should not be treated as like-for-like without underlying definitions.
            claimRefs:
              - CP003
              - CP005
              - CP011
              - CP012
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP011
              - CP012
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Treat public competitor pricing as a diligence lead, not a benchmark
            body: >-
              Core operator contracts are quote-based, and the only explicit cross-vendor prices in the assigned
              evidence come from a challenger. Request redacted contracts, implementation statements of work, realized
              GMV fees, support retainers, and renewal terms before comparing total cost.
            calloutType: risk
            claimRefs:
              - CP003
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing architecture
        blocks:
          - type: paragraph
            body: >-
              Mirakl is best understood as enterprise software around marketplace activity, not as the merchant earning
              the gross merchandise value that runs through customer storefronts. Independent analyses describe core
              SaaS subscription and usage revenue, supplemented by Mirakl Ads, Mirakl Payout, and implementation
              services. Published Connect tiers provide a narrow list-price anchor, while the Marketplace and Dropship
              products remain quote-based. Competitor and review sources agree that enterprise deployments can be
              costly, but none discloses realized contract values or discounts. The resulting revenue mix may be
              recurring, usage-linked, and services-assisted; module-level mix and recognition policy are still private.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
