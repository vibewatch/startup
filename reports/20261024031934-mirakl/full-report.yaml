chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Mirakl provides enterprise software that lets retailers, manufacturers, distributors, and brands operate
              branded marketplaces rather than selling through a consumer marketplace owned by Mirakl. Adobe documents
              seller management inside Adobe Commerce, while M2E describes synchronization of product catalogs,
              inventory, pricing, and orders across Mirakl-powered channels. Those partner descriptions support a
              subscription-software and ecosystem-enablement model, not an inventory-owning retail model. The assigned
              sources consistently place headquarters in Paris, but they do not agree on the founding year: Tracxn and
              UpMarket use 2012, whereas Multiples and Clay use 2011. Because no incorporation filing or original
              founding announcement is in the assigned pool, the discrepancy remains explicit rather than being resolved
              by assumption.
            claimRefs:
              - CO001
              - CO002
              - CO005
