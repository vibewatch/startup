      - number: '1.2'
        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              The evidence consistently identifies Philippe Corrot and Adrien Nussenbaum as Mirakl's co-founders, and
              UpMarket lists both as co-CEOs. This continuity concentrates company knowledge and external representation
              in the founding pair, which is potentially valuable for category expertise but creates a succession and
              key-person diligence issue. The assigned evidence does not provide a complete executive roster, board
              membership, committee structure, voting rights, or current ownership percentages. It therefore supports
              the identity of the two senior leaders but not a conclusion that governance is institutionally
              diversified. A current organization chart, board register, succession plan, and cap table are necessary
              before assigning control or dependency beyond the publicly visible co-CEO structure.
            claimRefs:
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
