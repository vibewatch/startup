      - number: '4.2'
        title: Public traction and quality of growth
        blocks:
          - type: paragraph
            body: >-
              The disclosed series must be kept on their original bases. Digital Commerce 360 reported nearly $160
              million of annual revenue for 2023, while Sacra estimated $177 million of ARR for 2024 and Teardown
              reported $218 million of ARR for 2025. Those observations suggest scale and growth, but ARR is not
              accounting revenue. Sacra also estimated $11.2 billion of customer GMV in 2024, a much larger transaction
              base that belongs to Mirakl's customers rather than Mirakl itself. The combination of faster GMV growth
              and a third-party-reported decline in effective take rate makes monetization per GMV dollar a central
              revenue-quality diligence item.
            claimRefs:
              - CI003
              - CI006
              - CI007
              - CI008
              - CI011
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI011
              - CI012
              - CI015
              - CI016
      - number: '4.3'
        title: Sales efficiency, delivery cost, and margin path
        blocks:
          - type: paragraph
            body: >-
              Public evidence offers implementation duration as a sales-efficiency proxy, not a full unit-economics
              answer. AmpiFire relays a three-to-six-month launch range, which implies meaningful integration and
              customer-success work but does not reveal sales cycle, CAC, payback, or services gross margin. Sacra
              reported full-year profitability for the core platform in 2024 and more than 100% growth in Mirakl Ads,
              while Teardown reported the first full year of group-wide profitability in 2025. These milestones indicate
              a plausible margin path; they do not disclose consolidated operating margin, free cash flow, product gross
              margins, or the share of profit contributed by Ads.
            claimRefs:
              - CI005
              - CI009
              - CI010
              - CI012
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Historical financing is substantial but cannot be treated as cash available today. Permira, UpMarket, and
              Multiples corroborate a $555 million Series E in September 2021 at a valuation above $3.5 billion.
              Teardown and AskCyborg separately report an approximately $110 million bank credit line or debt financing
              in August 2023. No assigned source discloses current cash, facility draw, covenants, maturity, burn,
              runway, or working-capital needs. Mirakl therefore shows credible scale and an improving reported
              profitability trajectory, but the investment case remains conditional on audited financial statements, an
              ARR-to-revenue bridge, cohort retention, product margins, and a current debt-and-liquidity schedule.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Profitability signals are broadening
            body: >-
              Third-party reports move from core-platform profitability in 2024 to group-wide profitability in 2025,
              alongside ARR growth.
            calloutType: strength
            claimRefs:
              - CI007
              - CI009
              - CI011
              - CI012
          - type: callout
            title: GMV does not equal revenue
            body: >-
              Customer GMV, ARR, and accounting revenue have different denominators and cannot be combined into one
              growth series or valuation multiple without a management reconciliation.
            calloutType: risk
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI015
          - type: callout
            title: Condition underwriting on liquidity evidence
            body: >-
              Historical funding and a reported credit facility do not establish current cash availability, debt
              capacity, or runway.
            calloutType: recommendation
            claimRefs:
              - CI013
              - CI014
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and maturity
        blocks:
          - type: paragraph
            body: >-
              Mirakl's product surface is an enterprise marketplace operating system rather than a single storefront
              plug-in. A current company job page describes Mirakl Platform for launching, scaling, and operating
              marketplaces and dropship, alongside Mirakl Connect for AI-powered multichannel selling, Mirakl Ads for
              retail media, and Mirakl Nexus for agentic commerce. The same page states that the company supports 450+
              marketplaces and more than 100k third-party sellers, but those scale figures are company-issued and should
              not be treated as independently audited. External review evidence is narrower but useful: Capterra records
              reviewer-rated shipping management, third-party integrations, and order management features, while a
              customer-facing support article shows that seller APIs cover operational processes such as orders,
              documents, and invoices. The product therefore has a credible operational core, while the public record
              does not establish module-level adoption, implementation duration, uptime, or realized customer outcomes.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE008
              - CE009
              - CE013
      - number: '5.2'
        title: Workflow, integrations, and architecture
        blocks:
          - type: paragraph
            body: >-
              The observable workflow begins with seller onboarding and third-party catalog integration, continues
              through offer and inventory data, order orchestration, shipping, and accounting, and can extend into
              retail media and agent-facing discovery. A customer support article explains that Mirakl APIs automate
              processes between an integrating system and orders, documents, invoices, or other available processes; the
              API Tracker profile cautions that authentication, permissions, and current field support must be confirmed
              in provider documentation. Mirakl's AI-engineering hiring specification provides the clearest public
              architecture signal for its newer capabilities: LLMs, retrieval-augmented generation, agents, multimodal
              models, evaluation frameworks, orchestration layers, APIs, tools, retrieval systems, and business
              workflows, with cloud, container, and Kubernetes tooling. This is evidence of intended engineering
              practice and hiring scope, not proof that every component is generally available in the commercial
              product. Agentic commerce also introduces a data-quality dependency: PYMNTS reports that missing metadata,
              inconsistent language, and incomplete images can become deal-breakers when agents discover products
              outside the retailer's own site.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE006
              - CE007
              - CE009
              - CE010
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE008
              - CE009
              - CE011
              - CE012
              - CE013
      - number: '5.3'
        title: Trust, deployment, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Mirakl has visible trust and enablement mechanisms, but public evidence is not equivalent to a complete
              control assessment. The Cloud Security Alliance registry describes a Mirakl SaaS solution that automates
              marketplace operations including seller onboarding and third-party catalog integration, and lists a CAIQ
              artifact intended to document cloud controls; the registry is a useful external security surface but does
              not, by itself, certify operational performance or eliminate customer-specific diligence. Mirakl's
              training catalog lists self-paced power-user, operational, strategic, and business-analyst courses, plus
              quarterly release-note training, which supports an enablement model for complex enterprise deployments.
              The public GitHub organization exposes a PHP seller SDK and a Terraform module, but the page does not
              establish repository breadth, release cadence, contributor depth, or a broad external developer ecosystem.
              The key technical underwriting gaps are therefore implementation effort, uptime and incident history,
              tenant isolation, security attestations and scope, API versioning and limits, data lineage for AI
              features, and measured quality or latency for agentic workflows.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE011
              - CE012
              - CE014
      - number: '5.4'
        title: Product verdict
        blocks:
          - type: paragraph
            body: >-
              Mirakl appears technically credible for enterprise marketplace operations because the evidence converges
              on a multi-module workflow, integration APIs, customer-facing operating tools, security-control
              documentation, and an emerging AI stack. The differentiation is less a single disclosed algorithm than the
              combination of marketplace process coverage, enterprise integration, seller and catalog operations,
              ecosystem connectivity, and operational know-how. That breadth is also the central execution risk:
              customers may need substantial data, integration, governance, and change-management work before the
              platform produces reliable marketplace economics. Product diligence should prioritize production reference
              calls, architecture and data-flow review, service-level and incident records, API and event-contract
              documentation, security reports with scope and dates, and evidence separating shipped capabilities from
              roadmap or recruiting ambition.
            claimRefs:
              - CE003
              - CE006
              - CE008
              - CE011
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad enterprise operating surface
            body: >-
              Public evidence supports a platform spanning seller, catalog, order, integration, enablement, and emerging
              agentic-commerce workflows rather than a narrow marketplace widget.
            calloutType: strength
            claimRefs:
              - CE001
              - CE004
              - CE006
              - CE011
          - type: callout
            title: Architecture and reliability remain under-disclosed
            body: >-
              Public materials do not provide enough independently verifiable evidence on uptime, incident history,
              tenant isolation, API limits, implementation effort, or production quality metrics for AI workflows.
            calloutType: risk
            claimRefs:
              - CE007
              - CE009
              - CE010
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying motion
        blocks:
          - type: paragraph
            body: >-
              Mirakl sells infrastructure to enterprise retailers, distributors, manufacturers, brands, and B2B
              organizations that want third-party assortment or dropship capability without holding all inventory. The
              buyer is typically an ecommerce, digital commerce, procurement, or marketplace operator; users span
              marketplace operations, catalog, sellers, finance, and customer-facing commerce teams. The product is
              therefore a multi-stakeholder enterprise deployment rather than a single-user storefront tool. Public
              descriptions consistently separate the marketplace operator from third-party sellers and business buyers,
              which is important: a reported customer count is not the same as active buyers, sellers, or
              revenue-producing accounts. The customer-facing job posting describes discovery, tailored demonstrations,
              RFP support, handoff to onboarding, and identifying expansion opportunities, indicating a consultative
              land-and-expand motion. Investor, competitor, and market-data sources also describe adoption across both
              B2B and B2C enterprises. Public evidence does not disclose segment revenue, contract values, or the share
              of customers using more than one module.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU009
              - CU012
      - number: '6.2'
        title: Adoption and operating scale
        blocks:
          - type: paragraph
            body: >-
              The public adoption signal is substantial but heterogeneous. Mirakl's job description says its ecosystem
              includes 450+ marketplaces and more than 100,000 third-party sellers, while a Landbase technology dataset
              reports 488 verified companies using Mirakl and lists enterprises such as Dell, FedEx, Macy's, L'Oréal,
              Airbus, and Kingfisher. These counts use different populations and dates, so they should not be combined
              into one customer KPI. Historical investor material gives a dated trajectory: Bain Capital Ventures
              reported 2,000 sellers and 12 million products at the founders' prior marketplace, then described Mirakl's
              early B2C and B2B traction and its 2019 Series C. A later data compilation records 80 new customers and 66
              new marketplaces in 2021, while a 2025 company release reports Cyber Week GMV and order growth across
              Mirakl-powered marketplaces. Those are platform or customer-operator metrics, not Mirakl net retention.
              The operating motion appears capable of expansion through seller onboarding, catalog breadth, multichannel
              selling, and retail media, but public sources do not provide cohort retention, renewal rates,
              customer-level utilization, or denominator-complete active-account trends.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU014
      - number: '6.3'
        title: Named deployments, durability, and concentration
        blocks:
          - type: paragraph
            body: >-
              Named customer proof is broader than logo proof but still uneven in reference quality. The case-study
              directory identifies Accor, Adobe Commerce, Atlas For Men, Auchan, Best Buy Canada, Conrad, Darty,
              Galeries Lafayette, Leroy Merlin, Phone House, and Satair, with several entries naming senior customer
              executives and describing outcomes such as broader assortment, faster marketplace growth, or a larger
              spare-parts catalog. Specific examples support deployment and use-case breadth, not necessarily production
              status, renewal, or economic payback. The adverse case is operational and procurement-related rather than
              evidence of churn: competitor analyses state that Mirakl requires a separate commerce front end, can
              involve complex onboarding, and may create vendor lock-in; one comparison also says some users report API
              delays and scalability issues. These claims are not independent benchmark studies, but they identify
              implementation friction that can affect time-to-value and expansion. Top-customer concentration,
              logo-to-revenue exposure, churn, GRR, NRR, renewal terms, and failed-pilot rates remain material diligence
              gaps.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU012
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwrite adoption, not logos
            body: >-
              Treat Mirakl's enterprise footprint and named deployments as evidence of market access and implementation
              capability; require cohort-level retention, customer-level GMV-to-revenue bridges, and concentration data
              before underwriting durable expansion.
            calloutType: recommendation
            claimRefs:
              - CU006
              - CU012
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual-risk view
        blocks:
          - type: paragraph
            body: >-
              Integration orchestration is the leading documented operating risk. Independent implementation guidance
              says a misconfigured flow can silently duplicate orders or block stock updates, while a
              competitor-authored assessment describes every connection among Mirakl, ERP, PIM, and storefront systems
              as a potential failure point. Regulatory exposure is potentially severe but role-dependent: the Digital
              Services Act imposes obligations on online platforms that enable consumer contracts, yet the assigned
              evidence does not establish when Mirakl, rather than each customer operator, is the regulated provider.
              Security assurance, agentic catalog integrity, payment-partner dependence, and financial visibility remain
              elevated because public evidence describes controls or dependencies without quantifying incidents,
              recovery performance, concentration, liquidity, or current audited economics. The heatmap therefore
              expresses diligence priority, not measured incident probability or expected loss.
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR008
              - CR013
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and contractual exposure
        blocks:
          - type: paragraph
            body: >-
              The EU Digital Services Act applies to intermediary services offered to recipients in the Union regardless
              of where the provider is established. For online platforms that let consumers contract with traders, it
              requires trader traceability and compliance-by-design measures, and Member States must provide for maximum
              fines of 6% of annual worldwide turnover for failure to comply. Mirakl supplies marketplace infrastructure
              to more than 450 companies according to two current third-party sources, so customer implementations can
              carry meaningful compliance requirements; however, the evidence does not resolve the legal allocation
              among Mirakl, operator, seller, and other service providers. Separately, a competitor-authored analysis
              flags data-sovereignty, bespoke-pricing, and customization constraints. Those observations support
              contract diligence, not a conclusion that Mirakl violated a law or failed a customer obligation.
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.3'
        title: Operational, quality, and security failure modes
        blocks:
          - type: paragraph
            body: >-
              Customer outcomes depend on integrations that synchronize catalog, inventory, orders, shipments, tax,
              returns, and settlement data. The assigned implementation evidence identifies silent duplication and
              blocked stock updates as concrete misconfiguration outcomes and explains that sellers participating in
              multiple Mirakl-operated marketplaces may face distinct categories, formats, and commission rules for each
              instance. B2B deployments add account-specific pricing and workflow complexity that a competitor source
              says standardized SaaS may not fully support. Security evidence is thinner: UpGuard says it continuously
              runs more than 330 external checks, but the public page does not disclose a score, an incident record, or
              internal assurance results. No inference of incident absence is justified. Investment diligence therefore
              needs customer-level error rates, availability, recovery, change-management, security-assurance, and
              incident-remediation evidence.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR015
      - number: '7.4'
        title: Partner, financial, and execution dependencies
        blocks:
          - type: paragraph
            body: >-
              The March 2026 agentic-commerce announcement makes the dependency chain explicit: Mirakl supplies catalog
              and agent-readiness capabilities while J.P. Morgan Payments supplies payment processing, tokenization, and
              fraud protection. The same company-issued account emphasizes accurate product, inventory, and pricing data
              plus identity, consent, limits, and auditability, so partner resilience and data quality become
              transaction controls rather than optional merchandising features. Financial evidence is not
              decision-grade. UpMarket still anchors the last priced round to September 2021 and warns that private
              shares are illiquid and speculative, while Multiples presents round-linked values under a revenue heading
              but says they may be revenue or ARR. These sources do not establish cash available, burn, runway, current
              valuation, or profitability. Thesis-break triggers should therefore focus on measured outages, unresolved
              control failures, failed data portability, adverse regulatory findings, partner concentration, and audited
              financial deterioration.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public evidence is insufficient to clear the top risks
            body: >-
              A material integration outage, unresolved security incident, inability to export customer data, adverse
              regulatory finding, critical partner failure, or audited liquidity shortfall should pause an investment
              decision until quantified remediation and customer-impact evidence are available.
            calloutType: risk
            claimRefs:
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investment case rests on a specialized enterprise position rather than a generic e-commerce software
              multiple. BounceWatch classifies the company as a SaaS, platform, and B2B business with subscription,
              transaction-fee, and usage-based revenue, while Sacra reports 450+ customers, a 13,000+ seller network,
              $15B of 2025 GMV, and estimated 2025 ARR of $218M. Those signals indicate meaningful platform adoption and
              operating scale, but Sacra's ARR is an estimate rather than audited company reporting. The anti-thesis is
              price discovery: the last disclosed financing valued Mirakl at $3.5B in September 2021, and current pages
              still describe that mark as the latest reported round. At that price, the visible 2025 ARR estimate
              implies roughly 16.1x ARR, but the denominator is not audited and cannot be treated as a live transaction
              multiple. Ranktora's comparison says Mirakl is strongest for enterprise operators but not the easiest or
              most transparent route, reinforcing fit and execution risk alongside valuation risk.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV006
              - CV008
              - CV010
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
      - number: '8.2'
        title: Price discovery and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a disciplined range, not a precise current valuation. UpMarket identifies the
              September 2021 Series E as a $555M raise at a $3.5B post-money valuation and says private shares do not
              trade continuously. Its disclosure also warns that secondary prices can differ from the last round price
              and that pre-IPO investments are illiquid and speculative. QuantLogix records the same last-round mark but
              publishes a separate QL Price of $18B, explicitly calling it a model estimate rather than a quote or
              target price; that figure is not a sufficiently independent transaction benchmark. Multiples reports a
              35.0x revenue multiple on $100M of revenue at the 2021 mark, while Sacra estimates $218M ARR for 2025. The
              disparate denominators and time bases make a single multiple unreliable. Entry should therefore require a
              current primary financing document, cap-table and preference review, and a material discount to the stale
              priced round unless verified growth and margins justify otherwise. BounceWatch and Clay both record a
              €100M debt financing in August 2023, while the assigned aggregators disagree on total funding and round
              count; neither fact reveals current cash availability, debt draw, covenants, or preference seniority.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV010
              - CV013
              - CV014
      - number: '8.3'
        title: Scenarios and comparable logic
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis is intentionally anchored to disclosed or explicitly estimated operating facts rather
              than an invented target price. The bull case assumes the 2025 ARR estimate is broadly accurate, the
              reported 23% growth persists, and enterprise marketplace adoption supports a premium software multiple;
              the base case applies a substantial private-company discount to the stale 2021 mark and assumes slower
              growth until audited revenue and retention data are available. The bear case treats the $3.5B mark as
              impaired by the absence of a newer priced round, possible multiple compression, illiquidity, and
              unresolved preference economics. Multiples lists public and private reference companies, including VTEX's
              2.8x 2025 revenue multiple in the Sacra comparison and lower public marketplace-related multiples in its
              comp table, but those businesses and revenue definitions are not fully comparable to Mirakl. The correct
              use of comparables is as a sensitivity check, not as a mechanically transferable multiple.
            claimRefs:
              - CV003
              - CV008
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Decision, exit readiness, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              The evidence supports track rather than buy. Mirakl's scale, enterprise positioning, and seller ecosystem
              are meaningful strengths, but a private company with no continuously quoted price requires current primary
              evidence before an investment decision. The thesis improves if Mirakl supplies audited ARR-to-revenue
              reconciliation, gross margin, net and gross retention, customer concentration, current cash and debt
              information, and a clean cap-table showing liquidation preferences and secondary versus primary economics.
              The thesis breaks if a new financing prices materially below $3.5B without a compensating operating
              explanation, if ARR growth falls materially below the reported 23% estimate, or if customer and seller
              activity does not translate into durable recurring revenue. Exit readiness remains uncertain because
              UpMarket describes secondary transactions as illiquid and says there is no guaranteed exit timeline. A
              current audited financing or liquidity event is the highest-value next diligence milestone.
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV007
              - CV010
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, not buy
            body: >-
              Mirakl merits continued diligence because the enterprise platform and ecosystem appear substantial, but
              the public valuation record is stale and the newer operating metrics are estimates. Require current
              primary financing terms and audited revenue quality before underwriting.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV006
              - CV010
              - CV014
          - type: callout
            title: Price discovery is the central risk
            body: >-
              A historical $3.5B mark, an independent-looking $18B model estimate, and inconsistent public revenue
              denominators should not be blended into a single current valuation.
            calloutType: risk
            claimRefs:
              - CV006
              - CV008
              - CV009
              - CV010
