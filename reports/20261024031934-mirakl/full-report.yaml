  - id: TV001
    title: Recommendation summary
    columns:
      - Dimension
      - Evidence
      - Decision implication
    rows:
      - - Recommendation
        - Track
        - Do not underwrite a buy without a current priced mark and audited operating data.
      - - Confidence
        - Medium
        - The operating signals are material, but key valuation denominators are estimated or stale.
      - - Risk rating
        - High
        - Private-market illiquidity, opaque preferences, debt terms, and multiple compression remain material risks.
      - - Valuation stance
        - Stretched
        - The $3.5B mark is old; the visible 2021 revenue multiple was 35.0x.
    notes: Synthesis of the chapter evidence; the recommendation is not a quoted market price or investment advice.
    claimRefs:
      - CV006
      - CV008
      - CV010
      - CV014
      - CV015
      - CV016
  - id: TV002
    title: Thesis / anti-thesis
    columns:
      - Argument
      - Supporting evidence
      - What would change the view
    rows:
      - - Enterprise platform model
        - >-
          BounceWatch classifies Mirakl as SaaS, platform, and B2B with subscription, transaction-fee, and usage-based
          revenue.
        - Evidence that the model does not translate into durable recurring revenue.
      - - Scale and ecosystem
        - Sacra reports 450+ customers, 13,000+ sellers, and $15B of 2025 GMV.
        - Audited data showing lower activity or weak conversion to recurring revenue.
      - - Growth case
        - Sacra estimates $218M ARR in 2025, up 23% YoY.
        - Audited ARR below the estimate or materially slower growth.
      - - Price risk
        - The latest reported financing is September 2021 at $3.5B; current marks are not continuously traded.
        - A new arm's-length round with transparent terms and defensible growth-adjusted pricing.
    notes: >-
      The Sacra figures are explicitly estimates, while the financing mark is historical; rows should not be read as
      equivalent assurance levels.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV006
      - CV007
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - 2025 ARR estimate is validated; 23% growth persists; retention and margins are strong.
        - A premium private SaaS multiple could support value above the stale $3.5B mark.
        - Execution, competition, and preference stack remain unresolved.
        - Lower probability until audited evidence is supplied.
      - - Base
        - Growth is positive but the ARR denominator and margins require reconciliation.
        - Use the $3.5B round only as a historical anchor and demand a private-company discount.
        - Stale financing, illiquidity, and multiple uncertainty.
        - Most supportable public-evidence case.
      - - Bear
        - A new financing is below $3.5B or estimated ARR fails to convert into durable revenue.
        - Capital loss or down-round exposure is plausible; no precise downside price is supportable.
        - Multiple compression, weak retention, customer concentration, and preference overhang.
        - Material downside trigger.
      - - Entry discipline
        - No commitment until current financing, cap table, debt, and audited revenue bridge are reviewed.
        - Require price and terms that compensate for information asymmetry and illiquidity.
        - Incomplete diligence can conceal dilution or senior claims.
        - Required condition, not a forecast.
    notes: >-
      Scenarios are qualitative because current audited revenue, margins, retention, cap-table terms, and a live
      transaction price are not public in the assigned evidence.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV010
      - CV013
      - CV014
