  - id: FU001
    title: Customer journey from enterprise sale to expansion
    type: journey-map
    summary: >-
      Mirakl's public customer workflow runs from enterprise qualification through implementation, seller activation,
      buyer usage, and potential module expansion.
    data:
      items:
        - label: 1. Qualification
          description: Enterprise discovery, RFPs, technical questions, and success criteria.
          touchpoints:
            - Account Executive partnership
            - Discovery conversations
            - RFP / security questionnaires
        - label: 2. Solution design
          description: Tailored demonstrations and configuration of marketplace, catalog, or Connect workflows.
          touchpoints:
            - Product demonstrations
            - Catalog Transformer
            - Integration feasibility
        - label: 3. Onboarding
          description: Transition from closed-won to implementation with documented requirements.
          touchpoints:
            - Sales-to-onboarding handoff
            - Implementation support
            - Time-to-launch
        - label: 4. Seller activation
          description: Third-party sellers and catalogs are connected, normalized, and made operational.
          touchpoints:
            - Seller onboarding
            - Catalog quality
            - API / EDI / integration work
        - label: 5. Buyer usage
          description: Retail or B2B buyers access broader assortment and marketplace workflows.
          touchpoints:
            - Marketplace storefront
            - Procurement and ordering
            - Dropship or fulfillment
        - label: 6. Expansion
          description: Potential expansion into additional sellers, channels, retail media, or modules.
          touchpoints:
            - Customer feedback
            - Cross-module opportunities
            - Additional marketplaces
