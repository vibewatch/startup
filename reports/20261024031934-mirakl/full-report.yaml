      - number: '1.3'
        title: Financing, valuation, and operating scale
        blocks:
          - type: paragraph
            body: >-
              The clearest priced benchmark is the September 2021 Series E: multiple assigned sources report $555
              million raised at a $3.5 billion post-money valuation, led by Silver Lake. Earlier histories also report a
              $300 million Series D at more than $1.5 billion in September 2020. Aggregate funding is less clean. Tracxn
              reports $948 million across six rounds, Multiples reports $945 million across four, and Clay displays both
              a $1.1 billion headline and a separate $948 million total. The August 2023 debt event is similarly
              described as $110 million by Tracxn and EUR100 million by Clay. These differences preclude treating any
              aggregate as cash available. Operating evidence is stronger on direction than audit quality: Digital
              Commerce 360 relays nearly $160 million of 2023 revenue and $8.6 billion of platform GMV, while Sacra
              estimates $218 million of 2025 ARR. Revenue, ARR, GMV, funding, and liquidity remain distinct measures.
