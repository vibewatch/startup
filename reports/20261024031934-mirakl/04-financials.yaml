company:
  name: Mirakl
chapter:
  number: 4
  title: Financials
  summary: Mirakl appears to combine quoted enterprise subscriptions and usage fees with Connect, Ads, Payout, and implementation revenue. Public evidence indicates rising ARR and improving profitability, but accounting revenue, gross margin, retention, cash, and debt terms remain insufficient for underwriting.
sections:
  - id: revenue-model
    title: Revenue model and pricing architecture
    body: >-
      Mirakl is best understood as enterprise software around marketplace activity, not
      as the merchant earning the gross merchandise value that runs through customer
      storefronts. Independent analyses describe core SaaS subscription and usage revenue,
      supplemented by Mirakl Ads, Mirakl Payout, and implementation services. Published
      Connect tiers provide a narrow list-price anchor, while the Marketplace and Dropship
      products remain quote-based. Competitor and review sources agree that enterprise
      deployments can be costly, but none discloses realized contract values or discounts.
      The resulting revenue mix may be recurring, usage-linked, and services-assisted;
      module-level mix and recognition policy are still private.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-quality
    title: Public traction and quality of growth
    body: >-
      The disclosed series must be kept on their original bases. Digital Commerce 360
      reported nearly $160 million of annual revenue for 2023, while Sacra estimated
      $177 million of ARR for 2024 and Teardown reported $218 million of ARR for 2025.
      Those observations suggest scale and growth, but ARR is not accounting revenue.
      Sacra also estimated $11.2 billion of customer GMV in 2024, a much larger transaction
      base that belongs to Mirakl's customers rather than Mirakl itself. The combination
      of faster GMV growth and a third-party-reported decline in effective take rate makes
      monetization per GMV dollar a central revenue-quality diligence item.
    claimRefs: [CI003, CI006, CI007, CI008, CI011, CI015]
    tableRefs: [TI003]
  - id: cost-and-margin
    title: Sales efficiency, delivery cost, and margin path
    body: >-
      Public evidence offers implementation duration as a sales-efficiency proxy, not a
      full unit-economics answer. AmpiFire relays a three-to-six-month launch range, which
      implies meaningful integration and customer-success work but does not reveal sales
      cycle, CAC, payback, or services gross margin. Sacra reported full-year profitability
      for the core platform in 2024 and more than 100% growth in Mirakl Ads, while Teardown
      reported the first full year of group-wide profitability in 2025. These milestones
      indicate a plausible margin path; they do not disclose consolidated operating margin,
      free cash flow, product gross margins, or the share of profit contributed by Ads.
    claimRefs: [CI005, CI009, CI010, CI012]
  - id: capital-adequacy
    title: Capital adequacy and financial verdict
    body: >-
      Historical financing is substantial but cannot be treated as cash available today.
      Permira, UpMarket, and Multiples corroborate a $555 million Series E in September
      2021 at a valuation above $3.5 billion. Teardown and AskCyborg separately report an
      approximately $110 million bank credit line or debt financing in August 2023. No
      assigned source discloses current cash, facility draw, covenants, maturity, burn,
      runway, or working-capital needs. Mirakl therefore shows credible scale and an
      improving reported profitability trajectory, but the investment case remains
      conditional on audited financial statements, an ARR-to-revenue bridge, cohort
      retention, product margins, and a current debt-and-liquidity schedule.
    claimRefs: [CI013, CI014, CI015, CI016]

tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Unit, Public value or status, Quality, Diligence ask]
    rows:
      - [Marketplace and Dropship, "Enterprise SaaS subscription plus usage", "Quoted contract", "No public rate card", "Recurring mechanism supported; realized price unavailable", "Obtain contract-level ARR, usage fees, discounts, and recognition policy"]
      - [Mirakl Connect, "Seller multichannel subscription", "Monthly tier with GMV allowance", "$699 Growth and $2,299 Pro reported", "Public list-price observation; not realized revenue", "Reconcile tiers, add-ons, discounts, and enterprise contracts"]
      - [Mirakl Ads, "Retail-media monetization", "Seller or operator ad spend", "More than 100% growth in 2024 estimated by Sacra", "Growth estimate; Mirakl revenue and margin undisclosed", "Obtain net revenue, attach rate, concentration, and gross margin"]
      - [Mirakl Payout, "Seller payment services", "Undisclosed usage fee", "Named revenue layer; price unavailable", "Mechanism supported; economics unknown", "Obtain payment volume, fee schedule, losses, and regulatory costs"]
      - [Professional services, "Implementation and integration", "Project or services fee", "Public rate unavailable", "Revenue stream supported; mix and margin unknown", "Separate recurring software from services revenue and delivery cost"]
    notes: "Values distinguish product mechanisms and list-price observations from realized revenue; none supplies an audited revenue mix."
    claimRefs: [CI001, CI002, CI004, CI010]
  - id: TI002
    title: Pricing and monetization observations
    columns: [Offer or metric, Public observation, Basis, Limitation, Underwriting implication]
    rows:
      - [Mirakl Connect Growth, "$699 per month", "Up to $50,000 monthly GMV reported by AmpiFire", "List price; realized discounts unavailable", "A narrow entry-price anchor only"]
      - [Mirakl Connect Pro, "$2,299 per month", "Up to $200,000 monthly GMV reported by AmpiFire", "Add-ons and enterprise terms unavailable", "Shows tier expansion, not company-wide ARPU"]
      - [Marketplace and Dropship, "Quote-only", "Review and comparison sources", "No public contract distribution", "Requires executed contracts and invoices"]
      - [Effective take rate, "About 4.5% in 2015 to about 2% in 2024", "Two third-party analyses", "Analytical estimate, not an audited metric", "GMV growth may not convert proportionally into revenue"]
      - [Implementation duration, "Three to six months", "AmpiFire relaying Mirakl", "Deployment duration is not sales cycle or payback", "Signals a potentially high-touch delivery model"]
    notes: "The observations mix reported list prices, quote-only positioning, and third-party estimates; they must not be treated as realized pricing."
    claimRefs: [CI002, CI003, CI004, CI005]
  - id: TI003
    title: Unit-economics and capital disclosure matrix
    columns: [Metric, Public value, Period and denominator, Confidence, Why it matters, Diligence ask]
    rows:
      - [Annual revenue, "Nearly $160M", "2023 annual revenue", "Medium", "Accounting-revenue scale anchor", "Reconcile to audited statutory revenue"]
      - [ARR, "$177M estimate", "2024 annual recurring revenue", "Medium", "Recurring scale, not accounting revenue", "Provide ARR definition and revenue bridge"]
      - [ARR, "$218M reported", "2025 annual recurring revenue", "Medium", "Indicates growth on the same named metric", "Reconcile cohort expansion, churn, and acquisitions"]
      - [GMV, "$11.2B estimate", "2024 customer marketplace volume", "Medium", "Tests platform activity, not Mirakl revenue", "Reconcile perimeter, returns, and fee-bearing volume"]
      - [Core-platform profitability, "Full-year profitability reported", "2024 core platform", "Medium", "Shows a product-level milestone", "Provide profit definition and segment reconciliation"]
      - [Group profitability, "First full profitable year reported", "2025 group", "Medium", "Suggests broader cost absorption", "Provide operating income and free-cash-flow bridge"]
      - [Gross margin, null, "Company and product level", "Unavailable", "Determines software and services quality", "Provide gross margin by module and services"]
      - ["CAC, payback, NRR, GRR, churn", null, "Cohort and segment basis", "Unavailable", "Tests growth efficiency and durability", "Provide cohort, sales-capacity, and retention schedules"]
      - ["Cash, burn, debt draw, runway", null, "Current as of 2026-10-24", "Unavailable", "Determines financing dependency", "Provide balance sheet, cash flow, facility, and covenant schedules"]
    notes: "Null means the assigned evidence did not disclose a defensible value; it is not zero. Revenue, ARR, and GMV retain their original names, periods, and denominators."
    claimRefs: [CI006, CI007, CI008, CI009, CI011, CI012, CI015, CI016]

figures:
  - id: FI001
    title: Revenue conversion and missing margin bridge
    type: flow
    summary: Customer activity can feed several monetization layers, but public evidence does not bridge those layers to accounting revenue or gross profit.
    data:
      nodes:
        - id: customer-gmv
          label: Customer marketplace activity
          value: "$11.2B 2024 GMV estimate"
        - id: core-contract
          label: Marketplace and Dropship
          value: "Quoted subscription plus usage"
        - id: connect
          label: Mirakl Connect
          value: "Published entry tiers plus custom enterprise"
        - id: ads
          label: Mirakl Ads
          value: "Retail-media monetization"
        - id: payout
          label: Mirakl Payout
          value: "Payment-services monetization"
        - id: services
          label: Professional services
          value: "Implementation and integration"
        - id: profit
          label: Revenue and gross profit
          value: "Mix, recognition, and margin unavailable"
      edges:
        - [customer-gmv, core-contract]
        - [customer-gmv, connect]
        - [customer-gmv, ads]
        - [customer-gmv, payout]
        - [core-contract, profit]
        - [connect, profit]
        - [ads, profit]
        - [payout, profit]
        - [services, profit]
    approximationNotes: "GMV is customer transaction volume, not Mirakl revenue; no conversion rate or gross-profit amount is inferred."
    claimRefs: [CI001, CI003, CI008, CI010, CI015]

callouts:
  - calloutType: strength
    title: Profitability signals are broadening
    body: Third-party reports move from core-platform profitability in 2024 to group-wide profitability in 2025, alongside ARR growth.
    claimRefs: [CI007, CI009, CI011, CI012]
  - calloutType: risk
    title: GMV does not equal revenue
    body: Customer GMV, ARR, and accounting revenue have different denominators and cannot be combined into one growth series or valuation multiple without a management reconciliation.
    claimRefs: [CI006, CI007, CI008, CI015]
  - calloutType: recommendation
    title: Condition underwriting on liquidity evidence
    body: Historical funding and a reported credit facility do not establish current cash availability, debt capacity, or runway.
    claimRefs: [CI013, CI014, CI016]

