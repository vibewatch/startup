company:
  name: Mirakl
chapter:
  number: 7
  title: Risks
  summary: >-
    Mirakl's highest-evidence residual risks are integration failure across customer
    commerce stacks, incomplete public security and incident assurance, and dependence
    on partners and clean catalog data as agentic transactions expand. EU marketplace
    rules and stale, inconsistently labeled financial data add material diligence
    requirements, but the assigned evidence does not establish a Mirakl-specific
    enforcement action, breach, current liquidity position, or customer concentration.
sections:
  - id: ranked-risk-view
    title: Ranked residual-risk view
    body: >-
      Integration orchestration is the leading documented operating risk. Independent
      implementation guidance says a misconfigured flow can silently duplicate orders
      or block stock updates, while a competitor-authored assessment describes every
      connection among Mirakl, ERP, PIM, and storefront systems as a potential failure
      point. Regulatory exposure is potentially severe but role-dependent: the Digital
      Services Act imposes obligations on online platforms that enable consumer
      contracts, yet the assigned evidence does not establish when Mirakl, rather than
      each customer operator, is the regulated provider. Security assurance, agentic
      catalog integrity, payment-partner dependence, and financial visibility remain
      elevated because public evidence describes controls or dependencies without
      quantifying incidents, recovery performance, concentration, liquidity, or current
      audited economics. The heatmap therefore expresses diligence priority, not measured
      incident probability or expected loss.
    claimRefs: [CR001, CR002, CR007, CR008, CR013, CR014, CR015, CR016]
    figureRefs: [FR001]
  - id: regulatory-legal
    title: Regulatory, legal, and contractual exposure
    body: >-
      The EU Digital Services Act applies to intermediary services offered to recipients
      in the Union regardless of where the provider is established. For online platforms
      that let consumers contract with traders, it requires trader traceability and
      compliance-by-design measures, and Member States must provide for maximum fines of
      6% of annual worldwide turnover for failure to comply. Mirakl supplies marketplace
      infrastructure to more than 450 companies according to two current third-party
      sources, so customer implementations can carry meaningful compliance requirements;
      however, the evidence does not resolve the legal allocation among Mirakl, operator,
      seller, and other service providers. Separately, a competitor-authored analysis
      flags data-sovereignty, bespoke-pricing, and customization constraints. Those
      observations support contract diligence, not a conclusion that Mirakl violated a
      law or failed a customer obligation.
    claimRefs: [CR004, CR006, CR007, CR008, CR009]
    tableRefs: [TR001]
  - id: operational-quality-security
    title: Operational, quality, and security failure modes
    body: >-
      Customer outcomes depend on integrations that synchronize catalog, inventory,
      orders, shipments, tax, returns, and settlement data. The assigned implementation
      evidence identifies silent duplication and blocked stock updates as concrete
      misconfiguration outcomes and explains that sellers participating in multiple
      Mirakl-operated marketplaces may face distinct categories, formats, and commission
      rules for each instance. B2B deployments add account-specific pricing and workflow
      complexity that a competitor source says standardized SaaS may not fully support.
      Security evidence is thinner: UpGuard says it continuously runs more than 330
      external checks, but the public page does not disclose a score, an incident record,
      or internal assurance results. No inference of incident absence is justified.
      Investment diligence therefore needs customer-level error rates, availability,
      recovery, change-management, security-assurance, and incident-remediation evidence.
    claimRefs: [CR001, CR002, CR003, CR004, CR015]
    tableRefs: [TR002]
  - id: partner-financial-triggers
    title: Partner, financial, and execution dependencies
    body: >-
      The March 2026 agentic-commerce announcement makes the dependency chain explicit:
      Mirakl supplies catalog and agent-readiness capabilities while J.P. Morgan Payments
      supplies payment processing, tokenization, and fraud protection. The same
      company-issued account emphasizes accurate product, inventory, and pricing data
      plus identity, consent, limits, and auditability, so partner resilience and data
      quality become transaction controls rather than optional merchandising features.
      Financial evidence is not decision-grade. UpMarket still anchors the last priced
      round to September 2021 and warns that private shares are illiquid and speculative,
      while Multiples presents round-linked values under a revenue heading but says they
      may be revenue or ARR. These sources do not establish cash available, burn, runway,
      current valuation, or profitability. Thesis-break triggers should therefore focus
      on measured outages, unresolved control failures, failed data portability, adverse
      regulatory findings, partner concentration, and audited financial deterioration.
    claimRefs: [CR010, CR011, CR012, CR013, CR014, CR016]
    tableRefs: [TR003]
callouts:
  - calloutType: risk
    title: Public evidence is insufficient to clear the top risks
    body: >-
      A material integration outage, unresolved security incident, inability to export
      customer data, adverse regulatory finding, critical partner failure, or audited
      liquidity shortfall should pause an investment decision until quantified
      remediation and customer-impact evidence are available.
    claimRefs: [CR015, CR016]
