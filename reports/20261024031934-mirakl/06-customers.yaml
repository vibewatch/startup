      - ["Third-party seller network", "100,000+ sellers", "2026 job posting", "Mirakl job posting reproduced by Built In", "Medium", "Supports supplier-network breadth", "Active sellers, paid sellers, and seller retention"]
      - ["Verified companies using Mirakl", "488", "Updated 2025-08-17; page labels 2026", "Landbase technology dataset", "Medium", "Independent tech-installation signal", "Method, active usage, and customer-to-marketplace mapping"]
      - ["2021 customer additions", "80 new customers", "2021", "Multiples compilation", "Low", "Historical acquisition signal", "Cohort retention and source audit trail"]
      - ["2021 marketplace launches", "66 new marketplaces", "2021", "Multiples compilation", "Low", "Historical deployment velocity", "Whether launches reached production and stayed active"]
      - ["Cyber Week GMV", "~$800M", "2025-11-24 to 2025-12-01", "Mirakl release syndicated by National Law Review", "Medium", "Shows customer-operator transaction scale", "GMV attribution, customer count, and Mirakl revenue"]
    notes: "Metrics come from different issuers, populations, and periods; GMV is customer-platform throughput rather than Mirakl revenue, and the historical counts are not current retention measures."
    claimRefs: [CU006, CU007, CU008, CU009, CU010, CU011]
  - id: TU003
    title: Named customer proof table
    columns: [Customer, Segment, Deployment / use case, Production vs pilot, Outcome, Limitation]
    enumerationScope:
      coverage: sample
      basis: "Representative named references visible in public case-study and customer-reference directories as of the 2026-10-24 run"
    rows:
      - [Best Buy Canada, Retail, Marketplace and assortment expansion, "Named deployment; production status not independently verified", "Case directory headline reports a 200% SKU increase", "Outcome detail and retention not public"]
      - [Conrad, B2B distribution, Marketplace and wider B2B product assortment, "Named deployment; production status not independently verified", "Case directory lists rapid growth and wider assortment", "No customer-level revenue or renewal data"]
      - [Satair, Industrial / aerospace, Spare-parts marketplace, "Named deployment; production status not independently verified", "Case directory headline reports a 6X larger spare-parts catalog", "Baseline, period, and economics not public"]
      - [Phone House, Retail, Marketplace platform, "Named deployment; production status not independently verified", "Case directory headline reports $1M in new sales", "Attribution period and margin not public"]
      - [Accor Group, Hospitality / procurement, Localized procurement marketplace, "Named deployment; production status not independently verified", "Case directory identifies a more agile procurement marketplace", "No quantified outcome in assigned text"]
      - [Auchan Retail, Retail, Omnichannel marketplace and assortment, "Named deployment; production status not independently verified", "Case directory identifies omnichannel growth and expanded assortment", "No retention or concentration data"]
    notes: "This is a representative sample of named references, not an exhaustive customer list; headlines and directory entries establish named use cases but do not prove renewal, active use, or causal ROI."
    claimRefs: [CU005, CU012, CU013]
figures:
  - id: FU001
    title: Customer journey from enterprise sale to expansion
    type: journey-map
    summary: "Mirakl's public customer workflow runs from enterprise qualification through implementation, seller activation, buyer usage, and potential module expansion."
    data:
      items:
        - label: "1. Qualification"
          description: "Enterprise discovery, RFPs, technical questions, and success criteria."
          touchpoints: ["Account Executive partnership", "Discovery conversations", "RFP / security questionnaires"]
        - label: "2. Solution design"
          description: "Tailored demonstrations and configuration of marketplace, catalog, or Connect workflows."
          touchpoints: ["Product demonstrations", "Catalog Transformer", "Integration feasibility"]
        - label: "3. Onboarding"
          description: "Transition from closed-won to implementation with documented requirements."
          touchpoints: ["Sales-to-onboarding handoff", "Implementation support", "Time-to-launch"]
        - label: "4. Seller activation"
          description: "Third-party sellers and catalogs are connected, normalized, and made operational."
          touchpoints: ["Seller onboarding", "Catalog quality", "API / EDI / integration work"]
        - label: "5. Buyer usage"
          description: "Retail or B2B buyers access broader assortment and marketplace workflows."
          touchpoints: ["Marketplace storefront", "Procurement and ordering", "Dropship or fulfillment"]
        - label: "6. Expansion"
          description: "Potential expansion into additional sellers, channels, retail media, or modules."
          touchpoints: ["Customer feedback", "Cross-module opportunities", "Additional marketplaces"]
    claimRefs: [CU001, CU003, CU014]
callouts:
  - calloutType: recommendation
    title: Underwrite adoption, not logos
    body: "Treat Mirakl's enterprise footprint and named deployments as evidence of market access and implementation capability; require cohort-level retention, customer-level GMV-to-revenue bridges, and concentration data before underwriting durable expansion."
    claimRefs: [CU006, CU012, CU016]
