chapter:
  number: 6
  title: Customers
  summary: Mirakl shows broad enterprise adoption across retail, B2B, manufacturing, and distribution, with public evidence of named marketplace deployments and a large seller ecosystem. The evidence is strongest for customer breadth and workflow fit; retention, net expansion, churn, and concentration remain undisclosed or based on non-independent estimates.
sections:
  - id: customer-segments
    title: Customer segments and buying motion
    body: >-
      Mirakl sells infrastructure to enterprise retailers, distributors, manufacturers,
      brands, and B2B organizations that want third-party assortment or dropship
      capability without holding all inventory. The buyer is typically an ecommerce,
      digital commerce, procurement, or marketplace operator; users span marketplace
      operations, catalog, sellers, finance, and customer-facing commerce teams. The
      product is therefore a multi-stakeholder enterprise deployment rather than a
      single-user storefront tool. Public descriptions consistently separate the
      marketplace operator from third-party sellers and business buyers, which is
      important: a reported customer count is not the same as active buyers, sellers,
      or revenue-producing accounts. The customer-facing job posting describes discovery,
      tailored demonstrations, RFP support, handoff to onboarding, and identifying
      expansion opportunities, indicating a consultative land-and-expand motion.
      Investor, competitor, and market-data sources also describe adoption across both
      B2B and B2C enterprises. Public evidence does not disclose segment revenue,
      contract values, or the share of customers using more than one module.
    claimRefs: [CU001, CU002, CU003, CU004, CU005]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption and operating scale
    body: >-
      The public adoption signal is substantial but heterogeneous. Mirakl's job
      description says its ecosystem includes 450+ marketplaces and more than 100,000
      third-party sellers, while a Landbase technology dataset reports 488 verified
      companies using Mirakl and lists enterprises such as Dell, FedEx, Macy's, L'Oréal,
      Airbus, and Kingfisher. These counts use different populations and dates, so they
      should not be combined into one customer KPI. Historical investor material gives
      a dated trajectory: Bain Capital Ventures reported 2,000 sellers and 12 million
      products at the founders' prior marketplace, then described Mirakl's early B2C
      and B2B traction and its 2019 Series C. A later data compilation records 80 new
      customers and 66 new marketplaces in 2021, while a 2025 company release reports
      Cyber Week GMV and order growth across Mirakl-powered marketplaces. Those are
      platform or customer-operator metrics, not Mirakl net retention. The operating
      motion appears capable of expansion through seller onboarding, catalog breadth,
      multichannel selling, and retail media, but public sources do not provide cohort
      retention, renewal rates, customer-level utilization, or denominator-complete
      active-account trends.
    claimRefs: [CU006, CU007, CU008, CU009, CU010, CU011]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-durability
    title: Named deployments, durability, and concentration
    body: >-
      Named customer proof is broader than logo proof but still uneven in reference
      quality. The case-study directory identifies Accor, Adobe Commerce, Atlas For Men,
      Auchan, Best Buy Canada, Conrad, Darty, Galeries Lafayette, Leroy Merlin, Phone
      House, and Satair, with several entries naming senior customer executives and
      describing outcomes such as broader assortment, faster marketplace growth, or a
      larger spare-parts catalog. Specific examples support deployment and use-case breadth, not necessarily
      production status, renewal, or economic payback. The adverse case is operational
      and procurement-related rather than evidence of churn: competitor analyses state
      that Mirakl requires a separate commerce front end, can involve complex onboarding,
      and may create vendor lock-in; one comparison also says some users report API
      delays and scalability issues. These claims are not independent benchmark studies,
      but they identify implementation friction that can affect time-to-value and
      expansion. Top-customer concentration, logo-to-revenue exposure, churn, GRR, NRR,
      renewal terms, and failed-pilot rates remain material diligence gaps.
    claimRefs: [CU012, CU013, CU014, CU015, CU016]
    tableRefs: [TU003]
