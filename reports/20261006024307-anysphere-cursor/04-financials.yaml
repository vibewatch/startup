      - ["Standalone net profitability", "Not publicly demonstrated before acquisition", "Medium", "Gross profit may not cover R&D, sales, support, and compensation", "Provide audited income and cash-flow statements"]
      - ["Cash, burn, debt, commitments, and runway", "Unavailable in retained evidence", "Low", "Prevents a standalone capital-adequacy conclusion", "Provide cash ledger, burn bridge, debt schedule, cloud commitments, and runway plan"]
