company:
  name: "Anysphere (Cursor)"
chapter:
  number: 4
  title: "Financials"
  summary: "Independent profiles report extraordinary ARR and annualized-revenue growth, but the retained evidence does not establish recognized revenue, audited profitability, cash burn, or runway. The underwriting case therefore turns on whether enterprise mix and proprietary inference can overcome usage-linked model costs, not on headline run-rate growth alone."
sections:
  - id: "revenue-model-and-commercial-traction"
    title: "Revenue model and commercial traction"
    body: >-
      Cursor is described as a subscription software business with a bottom-up
      enterprise motion: individual developers adopt the editor, paid team usage
      develops, and larger organizations move to custom contracts. One independent
      profile reports Pro at $20 per month, Business at $40 per seat per month,
      custom Enterprise pricing, and a $40-per-user monthly Bugbot add-on. The same
      profile estimates that enterprise customers account for about 60% of revenue.
      These are reported list prices and mix estimates, not evidence of realized
      pricing, contract duration, discounts, collections, or revenue recognition.
      The commercial architecture is attractive because seat expansion can raise
      contract value, but public evidence is insufficient to calculate CAC,
      payback, sales-cycle length, or channel economics.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
    tableRefs:
      - "TI001"
      - "TI002"
  - id: "run-rate-growth-and-measurement"
    title: "Run-rate growth and measurement limits"
    body: >-
      Multiple profiles place Cursor at $2 billion of ARR or annual run rate in
      February 2026. Other profiles report $3 billion of ARR by late April and
      roughly $4 billion of ARR or annualized revenue by early-to-mid June. The
      sequence is directionally consistent with rapid expansion, but the metric
      labels are not consistent: some sources say ARR, others say annual run rate
      or revenue. None of those labels can be silently converted into trailing
      recognized revenue or audited earnings. The figures should therefore be
      treated as third-party-reported velocity indicators. Underwriting requires
      reconciliation to monthly recurring revenue, contracted ARR, recognized
      revenue, churn, expansion, and cash collections by customer segment.
    claimRefs:
      - "CI004"
      - "CI005"
      - "CI006"
    tableRefs:
      - "TI003"
  - id: "cost-structure-and-margin-path"
    title: "Cost structure and margin path"
    body: >-
      Inference is the central variable-cost exposure. An independent business-model
      analysis identifies third-party model fees as Cursor's largest variable cost
      and says heavy usage historically compressed individual-subscription margins.
      It also reports that enterprise contracts began producing positive gross
      margin after Anysphere launched a proprietary inference model in November
      2025. A separate profitability review is more cautious: standalone net
      profitability was not publicly demonstrated before acquisition, and reported
      gross margins moved from negative early in 2026 to only slightly positive
      later. The evidence supports an improving margin direction, not a durable
      margin level. Model routing, token consumption, training expense, cloud
      commitments, support, sales compensation, and stock compensation remain
      unavailable.
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI011"
    figureRefs:
      - "FI001"
  - id: "capital-adequacy-and-financial-verdict"
    title: "Capital adequacy and financial verdict"
    body: >-
      Reported cumulative funding is not internally consistent: GetLatka lists
      $2.7 billion across five rounds, while AIHub and The Code W report about
      $3.3 billion or more. More importantly, funding raised is not cash available.
      The reviewed material does not disclose an audited cash balance, monthly
      burn, free cash flow, debt, cloud commitments, runway, or a next-financing
      trigger, so standalone capital adequacy cannot be determined. Operating-risk
      evidence also matters to revenue quality: a reported sandbox escape affected
      versions before 2.5, and an incident database classifies a 2025 Cursor support
      event as false or misleading information. Neither source quantifies financial
      impact, but both justify diligence on churn, support cost, indemnities, and
      enterprise renewal concessions. The financial verdict is high growth with
      unproven earnings quality and unresolved capital visibility.
    claimRefs:
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
callouts:
  - calloutType: "risk"
    title: "Run rate is not recognized revenue"
    body: >-
      The retained sources use ARR, annual run rate, annualized revenue, and revenue
      inconsistently. The $2B-$4B trajectory is a growth signal, not a substitute
      for audited revenue, gross profit, or cash flow.
    claimRefs:
      - "CI004"
      - "CI005"
      - "CI006"
  - calloutType: "recommendation"
    title: "Gate underwriting on primary financial data"
    body: >-
      Require segment-level recognized revenue, gross margin, inference cost,
      retention, cash, burn, and contractual commitments before assigning a
      durable margin or runway conclusion.
    claimRefs:
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI014"
