      - ["Cline", "$0 open-source software tier", "IDE agent with BYOK and local-model options", "Model inference, enterprise package, support, and implementation", "Low license cost can trade off against variable tokens and governance labor"]
      - ["Continue", "Free core; RFP.wiki reports Team at $20/seat/month with $10 credits", "IDE/CLI workflows and paid collaboration controls", "Provider usage, hardware, Company tier, and continuity terms", "Potentially lower software cost but more configuration and supplier decisions"]
      - ["GitHub Copilot / Claude Code", "Unknown from retained pool", "Bundled or supplier-owned distribution is the relevant signal", "Current list price, discounts, included usage, and cross-product bundling", "Direct procurement comparison requires fresh official rate cards"]
      - ["Internal build / standard IDE", "No external seat price; internal labor and infrastructure", "Maximum customization and policy control", "Engineering maintenance, inference, security review, and opportunity cost", "May fit regulated teams but cannot be compared on license price alone"]
