    approximationNotes: >-
      X is a 1-5 ordinal workflow-integration score and Y is a 1-5 ordinal buyer-control
      score derived from retained qualitative evidence; these are analyst judgments, not
      measured market data or independent benchmark results.
    claimRefs: [CP001, CP003, CP004, CP008, CP009, CP011, CP016]
callouts:
  - calloutType: risk
    title: Supplier competition narrows the moat
    body: >-
      Cursor benefits from multi-model access, but Anthropic and other model suppliers
      can use the same upstream capability to compete directly at the application layer.
    claimRefs: [CP004, CP012]
  - calloutType: recommendation
    title: Validate switching behavior with customer-level evidence
    body: >-
      Underwriting should require cohort retention, multi-homing rates, migration effort,
      and realized total cost by team size before assigning value to durable lock-in.
    claimRefs: [CP011, CP016]
