chapter:
  number: 7
  title: "Risks"
  summary: "Anysphere faces existential supplier-competitor margin compression from frontier model providers, heightened software supply-chain security liabilities following CVE-2026-26268 sandbox escapes, and execution friction under the pending SpaceX all-stock acquisition. While commercial ARR reached multi-billion levels, structural dependence on third-party model APIs, unhedged gross margin exposure, and hallucinations in customer-facing support systems represent key downside catalysts."
sections:
  - id: "supplier-margin-risks"
    title: "Supplier-Competitor Dependency and Retail-Wholesale Margin Compression"
    body: "Anysphere's core developer interface historically relied on third-party frontier language models from OpenAI, Anthropic, and Google. This architecture created an acute margin trap wherein Cursor paid standard commercial API rates while its primary model suppliers launched vertically integrated direct competitors, most notably Anthropic's Claude Code and Microsoft's native GitHub Copilot integrations. Corporate spending signals indicated Cursor's market share of AI coding spend contracted from approximately 41% in June 2025 to 26% by May 2026, while Anthropic's category share approached 50%. The retail-versus-wholesale pricing mismatch created structural gross margin degradation that necessitated defensive M&A or capital-intensive in-house model training to avert an unviable cost structure."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
    tableRefs:
      - "TR003"
    figureRefs:
      - "FR001"
  - id: "security-operational-risks"
    title: "Supply-Chain Vulnerabilities, Agent Sandbox Escapes, and Operational Quality"
    body: "The deployment of autonomous multi-file agentic capabilities introduces critical vulnerability vectors into developer workstations and enterprise production environments. In February 2026, National Vulnerability Database disclosures identified CVE-2026-26268 as a critical sandbox escape flaw in Cursor versions prior to 2.5, caused by missing authorization checks that permitted prompt injection payloads to alter Git configuration and executable hook files. Beyond code-generation vulnerabilities, operational incidents involving autonomous support agents—such as Incident 1039 in April 2025, where an AI support bot hallucinated non-existent multi-seat login restrictions—triggered customer frustration and subscription cancellations, highlighting the broader operational risks of unconstrained generative workflows in high-trust enterprise settings."
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR008"
    tableRefs:
      - "TR002"
  - id: "legal-governance-acquisition-risks"
    title: "Legal, Governance, and Acquirer Execution Uncertainties Under SpaceX"
    body: "The announcement in June 2026 of SpaceX's planned $60 billion all-stock acquisition of Anysphere fundamentally alters the venture's risk profile and governance trajectory. Because the transaction consideration is tied to newly listed SpaceX Class A equity, Anysphere stakeholders absorb substantial post-announcement equity volatility and antitrust regulatory review timelines ahead of formal closing. Furthermore, commercial relationships with competing hyperscalers face imminent disruption, evidenced by OpenAI's stated intent to wind down model supply contracts following the SpaceX transaction. Failure to maintain multi-model access or severe post-merger cultural attrition among core MIT engineering talent threatens developer retention across both enterprise and individual developer communities."
    claimRefs:
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR013"
    tableRefs:
      - "TR001"
