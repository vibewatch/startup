    title: "The Retail-versus-Wholesale Structural Dilemma"
    body: "Anysphere's rapid growth from $1M to multi-billion ARR masked an underlying economic trap: paying retail API prices to frontier model vendors who directly offer competing tools at wholesale marginal cost. Even as revenue expanded, corporate spending share contracted from 41% to 26% against Anthropic's Claude Code, proving that product-layer innovation cannot permanently insulate an independent editor without native frontier compute infrastructure."
