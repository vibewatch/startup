  - id: FE001
    title: Cursor Multi-Tier Product Architecture and Execution Stack
    type: stack
    summary: >-
      Layered representation of Cursor client interface, context retrieval, agent orchestration, and hybrid inference
      tiers.
    data:
      layers:
        - label: Client Presentation & Editing Interface
          detail: Developer interaction surface based on a custom fork of Visual Studio Code
          modules:
            - Custom VS Code Electron fork with integrated AI panels
            - Inline completion buffer and predictive diff renderer
            - Workspace configuration parser for project-level .cursorrules
            - External tool integrations covering GitHub, GitLab, Slack, and Linear
        - label: Context Assembly & Codebase Intelligence
          detail: Gathers multi-file syntax trees, diagnostic signals, and repository context
          modules:
            - Codebase indexing engine parsing abstract syntax trees
            - Active buffer tracking and diagnostic compiler error listener
            - Project instruction injection combining user rules with workspace structure
            - Semantic search retrieval indexing relevant multi-file dependencies
        - label: Agent Orchestration & Execution Boundary
          detail: Coordinates autonomous multi-file editing workflows within sandbox boundaries
          modules:
            - Autonomous Agent execution scaffold for multi-file planning
            - Terminal command runner and automated diff generation engine
            - Bugbot automated code review and defect detection pipeline
            - Workspace security sandbox enforcing file authorization checks
        - label: Model Gateway & Hybrid Inference Infrastructure
          detail: Routes completion requests across proprietary and third-party frontier models
          modules:
            - Dynamic model routing gateway supporting Claude, GPT-4, and Gemini
            - Proprietary Composer inference models serving high-frequency completions
            - Compute infrastructure optimized with high-performance GPU hardware
            - Enterprise API proxy ensuring data compliance and zero-retention policies
        - label: Enterprise Security & Governance Layer
          detail: Administrative oversight, single sign-on, and audit logging for organizational controls
          modules:
            - SAML and OpenID Connect single sign-on authentication
            - Centralized workspace audit logging and telemetry export
            - Private cloud and dedicated VPC deployment architectures
            - Zero-data-retention agreements with external foundation model suppliers
        - label: Developer Toolchain & Ecosystem Integrations
          detail: Bidirectional connectors linking editor state with external developer tools
          modules:
            - Git provider bridges for pull request creation on GitHub and GitLab
            - Task tracker synchronization with Linear and Jira issues
            - Communication hooks streaming notification events to Slack
            - Custom Model Context Protocol (MCP) server endpoints for external tools
    approximationNotes: >-
      Architecture layers reflect published technical operating models, security advisories, and system documentation;
      internal routing thresholds are not publicly disclosed.
    claimRefs:
