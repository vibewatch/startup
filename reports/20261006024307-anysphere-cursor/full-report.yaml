  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition, Boundaries, and Spend Classification
        blocks:
          - type: paragraph
            body: >-
              The market for AI-native development environments sits at the intersection of traditional developer
              tooling, cloud infrastructure, and frontier generative AI capabilities. Rather than competing solely as a
              plugin or standalone utility within existing editors, Anysphere's Cursor defined an integrated category by
              rebuilding the core integrated development environment around neural model interactions. The addressable
              spend boundary encompasses primary developer seat subscriptions, supplemental agentic inference compute,
              and enterprise governance add-ons, while explicitly excluding general-purpose cloud hosting, foundational
              model training infrastructure, and generic software engineering consulting services. Ground truth scale
              metrics demonstrate rapid commercial adoption, with Cursor reportedly generating nearly one billion lines
              of working code per day as developers embrace conversational prompting and whole-codebase indexing.
              However, market boundaries remain contested as incumbent IDE providers and frontier model creators expand
              their native developer interfaces, requiring clear segmentation between specialized AI editors and
              commodity developer workstations.
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM012
      - number: '2.2'
        title: Addressable Market Sizing and ARR Trajectory
        blocks:
          - type: paragraph
            body: >-
              Evaluating Cursor's market potential requires multiple sizing lenses rather than an unconstrained top-line
              estimate. The broadest total addressable market encompasses approximately thirty million professional
              software engineers globally, representing an annual tooling spend pool between fifteen and twenty billion
              dollars when modeled at enterprise software budget allocations. Within this envelope, the serviceable
              addressable market focuses on agile engineering organizations and high-velocity developers adopting
              generative AI coding assistants, translating to an immediate addressable segment of seven to ten billion
              dollars. Cursor's realized commercial inflection represents the fastest scaling trajectory in enterprise
              SaaS history, advancing from roughly one million dollars in annual recurring revenue in 2023 to two
              hundred million by April 2025, one billion by November 2025, and two billion by February 2026. Industry
              reporting through mid-2026 chronicled run rates surpassing three to four billion dollars, supporting
              private financing discussions at a fifty billion dollar valuation. Despite this hypergrowth, institutional
              equity analysts emphasize that long-term TAM realization remains contingent upon sustained seat
              penetration and retention across traditional enterprise accounts beyond early tech adopters.
            claimRefs:
              - CM001
              - CM007
              - CM009
              - CM010
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM007
              - CM010
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
              - CM007
              - CM014
      - number: '2.3'
        title: Buyer Personas, Procurement Pathways, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              Cursor's commercial expansion is driven by a two-stage customer acquisition architecture that bridges
              bottoms-up developer affinity and centralized enterprise procurement. The initial adoption layer relies
              heavily on individual software engineers, contractors, and startup founders who expense the standard
              twenty dollar monthly Pro subscription on discretionary corporate cards without requiring procurement
              sign-off. As usage concentrates within engineering pods, organization leads aggregate individual accounts
              into forty dollar per user monthly Teams licenses, consolidating billing and team-level sharing. The third
              and most critical expansion phase transitions budget ownership to the Chief Information Officer, Chief
              Technology Officer, or VP of Engineering through custom enterprise contracts. Enterprise transactions
              introduce rigorous security scrutiny, requiring strict data privacy guarantees, single sign-on
              integration, role-based access controls, and administrative compliance. For large organizations, total
              cost of ownership extends well beyond baseline seat licenses, as heavy usage of autonomous agent modes
              introduces significant variable consumption charges that require dedicated FinOps monitoring and
              departmental budget allocations.
            claimRefs:
              - CM003
              - CM004
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM012
              - CM013
      - number: '2.4'
        title: Adoption Drivers, TCO Realities, and Diligence Constraints
        blocks:
          - type: paragraph
            body: >-
              Cursor's rapid market penetration is powered by dramatic developer productivity gains, fluid natural
              language editing, and the intuitive appeal of whole-repository context awareness. However, enterprise
              adoption faces substantial countervailing frictions that temper unconstrained expansion. Technical
              security vulnerabilities represent a premier operational risk, underscored by CVE-2026-26268, a critical
              sandbox escape flaw in versions prior to 2.5 where prompt injection payloads could manipulate Git hook
              configurations to achieve out-of-sandbox remote code execution. Although Anysphere remediated this
              vulnerability with strict authorization controls, enterprise security architects remain cautious regarding
              agentic tools with broad filesystem write privileges. Furthermore, customer trust was tested in early 2025
              when an automated customer support bot hallucinated an unannounced single-device login restriction,
              sparking user backlash and subscription cancellations. Compounding these governance and reliability
              challenges is the absence of public GAAP financial statements, leaving gross margins and compute cost
              dynamics dependent on third-party estimates as Anysphere navigates volatile inference expenses and
              supplier dependencies.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM011
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Bottom-Up Developer Infiltration Drives Top-Down Enterprise Expansion
            body: >-
              Cursor's initial market adoption bypassed traditional enterprise software sales cycles through
              friction-free individual adoption on the $20 monthly Pro plan, which established grassroots engineering
              dependence before converting into enterprise contracts.
            calloutType: insight
            claimRefs:
              - CM003
              - CM012
              - CM013
          - type: callout
            title: Agentic TCO Surprises and Security Posture Challenge Enterprise Budgets
            body: >-
              While entry subscription costs remain competitive, variable on-demand model consumption and critical
              security vulnerabilities like CVE-2026-26268 represent meaningful adoption constraints for risk-sensitive
              enterprise buyers.
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
              - CM006
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant market is broader than AI-native editors. Cursor competes directly with Windsurf and agent
              extensions such as Cline, with GitHub Copilot as the distribution-led incumbent, Claude Code as a
              terminal-native agent from a model supplier, Gemini Code Assist for Google-oriented enterprises, and
              Replit for browser-based development. Internal tooling and ordinary VS Code workflows remain status-quo
              substitutes when governance, data residency, or variable inference cost outweighs incremental automation.
              Cursor's strongest structural advantage is an integrated, VS Code-compatible environment that combines
              repository indexing, inline generation, chat, and multi-file agent work. The counterweight is that many
              alternatives can access similar frontier models, so the buyer is choosing workflow, administration,
              distribution, and trust as much as raw model capability. Public evidence does not support a complete
              market-share ranking, and the comparative directories used here have opaque scoring methods rather than
              audited benchmarks.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
