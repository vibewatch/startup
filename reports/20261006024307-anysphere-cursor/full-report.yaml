chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Reported Scale
        blocks:
          - type: paragraph
            body: >-
              Anysphere is a San Francisco company founded in 2022 by Michael Truell, Sualeh Asif, Aman Sanger, and
              Arvid Lunnemark. Secondary profiles consistently describe Cursor as an AI-powered code editor created by
              rebuilding the open-source Visual Studio Code base as an AI-first environment rather than offering only an
              editor extension. The public evidence supports a subscription software model and unusually rapid reported
              adoption, but it does not provide audited accounts or a consistent metric dictionary. In particular,
              sources variously use ARR, annual run rate, and annualized revenue. This chapter therefore preserves the
              June 2026 metric as approximately $4 billion of annualized revenue, including approximately $2.6 billion
              attributed to enterprise B2B customers, rather than converting it into audited revenue or cash.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO013
              - CO014
