      - number: '6.3'
        title: Retention Durability, Support Hallucinations, and Security Risks
        blocks:
          - type: paragraph
            body: >
              Sustaining enterprise retention poses significant challenges for Anysphere due to intense competitive
              pressure, model-cost dynamics, and customer trust incidents. In April 2025, customer satisfaction
              experienced measurable disruption when an automated customer support bot named 'Sam' hallucinated and
              asserted an invented login policy to users who had been unexpectedly logged out of the editor. This
              failure in automated customer operations reportedly prompted immediate subscription cancellations and
              highlighted vulnerabilities in relying on AI bots for critical customer support interactions.


              Security governance represents another critical barrier to enterprise durability. In February 2026,
              security researchers identified CVE-2026-26268, a critical sandbox escape vulnerability affecting Cursor
              versions prior to 2.5. The vulnerability allowed malicious prompt injection payloads to modify sensitive
              Git configuration files and Git hooks within the editor's environment, creating a path for out-of-sandbox
              remote code execution. Because enterprise security teams demand rigorous assurance against repository
              tampering and unauthorized code execution, unresolved sandbox vulnerabilities introduce substantial
              procurement roadblocks and heighten customer churn risk across security-sensitive enterprise cohorts.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Support Operations and Automated Customer Trust Vulnerability
            body: >-
              The April 2025 incident involving Cursor's automated support bot inventing company login policies
              demonstrates that customer support automation failures directly trigger customer cancellations and brand
              impairment in developer tooling.
            calloutType: risk
            claimRefs:
              - CU013
          - type: callout
            title: Bottom-Up Developer Adoption Versus Formal Enterprise Standardization
            body: >-
              While Cursor claims widespread penetration across 50,000 enterprise accounts and leading tech firms like
              Stripe and Shopify, verifiable data confirming company-wide mandated deployments versus ad-hoc
              departmental seat usage remains inaccessible.
            calloutType: insight
            claimRefs:
              - CU004
              - CU009
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Supplier-Competitor Dependency and Retail-Wholesale Margin Compression
        blocks:
          - type: paragraph
            body: >-
              Anysphere's core developer interface historically relied on third-party frontier language models from
              OpenAI, Anthropic, and Google. This architecture created an acute margin trap wherein Cursor paid standard
              commercial API rates while its primary model suppliers launched vertically integrated direct competitors,
              most notably Anthropic's Claude Code and Microsoft's native GitHub Copilot integrations. Corporate
              spending signals indicated Cursor's market share of AI coding spend contracted from approximately 41% in
              June 2025 to 26% by May 2026, while Anthropic's category share approached 50%. The retail-versus-wholesale
              pricing mismatch created structural gross margin degradation that necessitated defensive M&A or
              capital-intensive in-house model training to avert an unviable cost structure.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
