      - number: '6.2'
        title: Adoption Trajectory and Named Enterprise Production Proof
        blocks:
          - type: paragraph
            body: >
              Cursor's commercial trajectory demonstrates unprecedented top-line velocity within enterprise developer
              tooling. After reaching $100 million in annual recurring revenue during 2024, Cursor achieved an
              annualized run rate of $1 billion by late 2025, scaled to $2 billion in February 2026, and reached
              reported milestones between $3 billion in April 2026 and $4 billion in early June 2026 prior to the SpaceX
              acquisition transaction. Enterprise adoption has been cited across prominent technology organizations,
              with production deployments and team use reported at companies including Stripe, Shopify, and OpenAI.


              Despite these impressive headline metrics, customer proof exhibits substantial variance in reference
              quality and independent verification. Many enterprise accounts originate as bottom-up developer adoptions
              where corporate engineering teams informally use the tool before central procurement formalizes licensing.
              Full enterprise-wide standardization remains unverified for the vast majority of named accounts, as public
              disclosures frequently rely on company statements or third-party press profiles rather than audited
              customer case studies detailing seat counts, production usage ratios, or contractual retention benchmarks.
            claimRefs:
              - CU007
              - CU008
