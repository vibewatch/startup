              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Supplier competition narrows the moat
            body: >-
              Cursor benefits from multi-model access, but Anthropic and other model suppliers can use the same upstream
              capability to compete directly at the application layer.
            calloutType: risk
