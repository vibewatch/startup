      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Retail-versus-Wholesale Structural Dilemma
            body: >-
              Anysphere's rapid growth from $1M to multi-billion ARR masked an underlying economic trap: paying retail
              API prices to frontier model vendors who directly offer competing tools at wholesale marginal cost. Even
              as revenue expanded, corporate spending share contracted from 41% to 26% against Anthropic's Claude Code,
              proving that product-layer innovation cannot permanently insulate an independent editor without native
              frontier compute infrastructure.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR004
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Evidence Quality
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research more, with low-to-medium confidence and a high risk rating. Multiple
              independent secondary sources repeat a $60B SpaceX transaction narrative, but they disagree on whether the
              deal was announced in June or closed in August 2026, and none of the assigned evidence is a definitive
              merger agreement, capitalization record, or company filing. Public funding totals also differ between
              $2.7B and $3.3B. Those discrepancies are material because an investor cannot calculate dilution,
              preference overhang, conversion economics, or a target return without knowing the actual security and
              transaction status. The correct stance is therefore unresolved rather than a precise premium or discount.
            claimRefs:
              - CV011
              - CV012
              - CV015
              - CV016
