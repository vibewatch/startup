        title: Run-rate growth and measurement limits
        blocks:
          - type: paragraph
            body: >-
              Multiple profiles place Cursor at $2 billion of ARR or annual run rate in February 2026. Other profiles
              report $3 billion of ARR by late April and roughly $4 billion of ARR or annualized revenue by early-to-mid
              June. The sequence is directionally consistent with rapid expansion, but the metric labels are not
              consistent: some sources say ARR, others say annual run rate or revenue. None of those labels can be
              silently converted into trailing recognized revenue or audited earnings. The figures should therefore be
              treated as third-party-reported velocity indicators. Underwriting requires reconciliation to monthly
