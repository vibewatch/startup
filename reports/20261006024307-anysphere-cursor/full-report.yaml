            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP010
              - CP011
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP011
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a meaningful product lead, not an impregnable technical moat. Cursor's editor
              integration, codebase-aware context, and next-edit workflow can create habit and migration friction,
              especially after teams standardize rules, extensions, and administration. Yet the core category is
              vulnerable to commoditization because open-source agents offer model choice and incumbents own major
              developer distribution channels. Third-party reporting also identifies Claude Code as a scaled rival,
              while a community discussion repeatedly questions whether Cursor's lead can withstand Microsoft and other
              well-funded entrants; that discussion is directional sentiment, not market-share proof. Trust can become a
              switching trigger rather than a lock-in mechanism. A reported pre-2.5 sandbox escape enabled malicious
              Git-hook writes, and the AI Incident Database records a support bot episode involving false policy
              information and reported cancellations. The durable-moat case therefore depends on maintaining superior
              workflow quality while improving security, support, and cost predictability faster than bundled and
              open-source alternatives converge.
            claimRefs:
              - CP004
              - CP013
              - CP014
              - CP015
              - CP016
