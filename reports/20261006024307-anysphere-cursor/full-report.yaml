        title: Leadership, Founder Continuity, and Governance Gaps
        blocks:
          - type: paragraph
            body: >-
              Michael Truell is identified as co-founder and chief executive officer across the assigned profiles. The
              same sources identify Asif, Sanger, and Lunnemark as co-founders, but do not establish current formal
              titles or a complete October 2026 executive roster for Asif and Sanger. Tech Insider reports that
              Lunnemark departed in October 2025 to establish Integrous Research, while another secondary profile still
              describes all four founders as leading the company; that conflict makes an official leadership roster a
              diligence requirement rather than a fact to infer. No assigned source supplies board composition, voting
              rights, executive succession arrangements, or a current chief financial officer. The available evidence
              consequently supports founder identity and Truell's CEO role, but not detailed functional ownership or
              control conclusions.
