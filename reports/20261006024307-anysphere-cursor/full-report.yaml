      - number: '8.2'
        title: Financing and Scale Context
        blocks:
          - type: paragraph
            body: >-
              The most coherent historical anchor is PrivatePulse's report of a $29.3B post-money Series D in November
              2025, followed by Tech Funding News reporting April 2026 talks for at least $2B at a valuation above $50B.
              Later sources describe a $60B all-stock SpaceX transaction, yet their dates and terminology diverge.
              Operating metrics are similarly non-comparable: GetLatka labels $2B as 2026 revenue and separately lists a
              $4B June revenue milestone, while The Code W calls $4B an ARR figure. These values should not be blended
              into a valuation multiple. They establish scale and momentum, not an audited revenue base or a reliable
              current entry price.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
