  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and commercial traction
        blocks:
          - type: paragraph
            body: >-
              Cursor is described as a subscription software business with a bottom-up enterprise motion: individual
              developers adopt the editor, paid team usage develops, and larger organizations move to custom contracts.
              One independent profile reports Pro at $20 per month, Business at $40 per seat per month, custom
