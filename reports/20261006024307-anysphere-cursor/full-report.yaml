      - number: '5.4'
        title: Security Isolation, Compliance, and Technical Risk
        blocks:
          - type: paragraph
            body: >-
              Deploying autonomous coding agents with local file system write access introduces severe technical,
              security, and governance challenges into enterprise environments. The fundamental tension stems from
              granting AI agents permission to execute terminal commands and modify workspace configurations while
              attempting to maintain robust isolation boundaries. This vulnerability surfaced in CVE-2026-26268, a
              critical missing authorization flaw (CWE-862) discovered in Cursor versions prior to 2.5, where prompt
              injection payloads could manipulate sensitive `.git` directory configurations and Git hooks to achieve
              remote code execution outside the sandbox without user interaction. Anysphere remediated the vulnerability
              in version 2.5 by implementing strict authorization controls to block writes to Git configuration files
              from workspace sandboxes. Enterprise adoption remains contingent on rigorous trust boundaries, including
              SOC 2 compliance, audit logging, and private deployment controls.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Agentic Sandbox Isolation and Malicious Prompt Injection
            body: >-
              The discovery of CVE-2026-26268 highlights the critical operational danger of granting AI agents local
              file system write access. Because Git automatically executes hook scripts during routine developer
              commands, insufficient authorization checks on workspace `.git` configurations allowed prompt-injected
              agents to achieve remote code execution outside the sandbox. Securing autonomous coding tools requires
              strict, defense-in-depth authorization that treats local repositories as untrusted execution environments.
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
              - CE015
          - type: callout
            title: Proprietary Inference Models as a Structural Unit Economic Moat
            body: >-
              Cursor's introduction of proprietary inference models, such as the Composer series, represents a pivotal
              strategic transition from an API wrapper into a vertically integrated developer platform. Serving
              high-volume code completions via proprietary models transforms unit economics on enterprise contracts from
              negative to positive gross margins while insulating the business against pricing aggression or access
              restrictions from frontier model suppliers.
            calloutType: insight
            claimRefs:
              - CE010
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Economics
        blocks:
          - type: paragraph
            body: >
              Anysphere structures the customer base for its Cursor AI code editor across two primary commercial layers:
              individual practitioners and enterprise engineering organizations. The entry-level adoption tier consists
              of individual professional developers and freelancers utilizing the Pro subscription tier priced at $20
              per month per seat. This self-serve layer established Cursor's initial commercial density, providing the
              user volume that accelerated annual recurring revenue past $100 million in 2024. A critical adjacent
              sub-segment includes venture-backed startups and AI-native engineering teams, where developer velocity
              directly drives competitive product cycles and justifies high willingness to pay.


              At the organizational level, Anysphere distributes the Business tier, which incorporates enterprise-grade
              management capabilities including centralized billing, administrative controls, privacy enforcement modes,
              and bring-your-own-key API options. Market reporting indicates that enterprise adoption expanded rapidly
              to encompass approximately 50,000 enterprise customer accounts by mid-2026 as larger engineering
              organizations sought to institutionalize AI-assisted development workflows. Nevertheless, customer
              procurement reviews must balance developer productivity gains against third-party frontier model
              dependencies and infrastructure costs.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
