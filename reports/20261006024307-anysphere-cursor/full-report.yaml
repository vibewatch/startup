  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks and downside triggers
      - Probability signal
    rows:
      - - Bull
        - >-
          Primary records confirm favorable $60B all-stock consideration or strong standalone economics; reported scale
          reconciles to audited ARR and healthy margins.
        - Use verified consideration or audited cash-flow economics; no higher range is supportable today.
        - Adverse conversion terms, margin weakness, retention deterioration, or security recurrence.
        - Evidence would strengthen only after definitive transaction and audited financial documents.
      - - Base
        - >-
          Reported scale is directionally real, but transaction status, security terms, and metric definitions remain
          unresolved.
        - No defensible entry value or target return; maintain research-more status.
        - Continued source conflict, opaque preferences, and no revenue-to-cash reconciliation.
        - Current evidence most directly supports uncertainty rather than a numerical probability.
      - - Bear
        - >-
          Growth slows, supplier competition intensifies, remediation costs rise, or the reported transaction fails or
          converts unfavorably.
        - Multiple compression and dilution can impair value materially; preserve capital rather than infer a floor.
        - >-
          Loss of enterprise retention, unresolved critical security findings, or no primary proof of transaction
          completion.
        - Downside signal rises if any thesis-break trigger is verified.
    notes: >-
      The assigned sources do not support numerical scenario probabilities, standalone valuation ranges, or target
      returns; the table uses observable diligence signals instead.
    claimRefs:
      - CV003
      - CV004
      - CV006
      - CV009
