      - number: '7.2'
        title: Supply-Chain Vulnerabilities, Agent Sandbox Escapes, and Operational Quality
        blocks:
          - type: paragraph
            body: >-
              The deployment of autonomous multi-file agentic capabilities introduces critical vulnerability vectors
              into developer workstations and enterprise production environments. In February 2026, National
              Vulnerability Database disclosures identified CVE-2026-26268 as a critical sandbox escape flaw in Cursor
              versions prior to 2.5, caused by missing authorization checks that permitted prompt injection payloads to
              alter Git configuration and executable hook files. Beyond code-generation vulnerabilities, operational
              incidents involving autonomous support agents—such as Incident 1039 in April 2025, where an AI support bot
              hallucinated non-existent multi-seat login restrictions—triggered customer frustration and subscription
              cancellations, highlighting the broader operational risks of unconstrained generative workflows in
              high-trust enterprise settings.
            claimRefs:
              - CR005
