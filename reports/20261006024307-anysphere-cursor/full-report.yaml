  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Modular Capabilities
        blocks:
          - type: paragraph
            body: >-
              Anysphere delivers Cursor as an AI-native integrated development environment engineered to accelerate
              software engineering throughput across the entire development lifecycle. Rather than operating as an
              out-of-band chat interface or an editor extension with restricted interface hooks, Cursor is built
              directly on a customized fork of Microsoft Visual Studio Code. This architectural choice grants the
              platform deep, unmediated visibility into active editor buffers, repository layout, build diagnostics, and
              revision histories. Developers interact with the tool through inline code generation, natural language
              codebase querying, and autonomous Agent mode capable of orchestrating multi-file refactoring tasks. The
              product line spans core individual subscriptions, collaborative business tiers, enterprise deployments
              featuring administrative governance, and specialized add-on capabilities such as the Bugbot automated
              vulnerability and bug detection engine.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE011
      - number: '5.2'
        title: Workflow Integration and Developer Experience
        blocks:
          - type: paragraph
            body: >-
              Cursor embeds artificial intelligence directly into high-frequency developer workflows to minimize the
              friction of task switching between planning, implementation, and code verification. Developers establish
              persistent behavioral conventions and architectural rules using project-level `.cursorrules` configuration
              files, which the editor automatically indexes and injects into downstream agent execution contexts.
              Furthermore, Cursor integrates with external development tools and collaboration platforms, connecting to
              version control repositories across GitHub, GitLab, Bitbucket, and Azure DevOps, issue trackers such as
              Linear, and IDE environments. By capturing developer interactions natively within the editor, Cursor
              reduces routine coding time while accumulating significant user switching costs. However, evaluating AI
              productivity requires tracking post-generation review latency, test pass rates, and defect escape
              frequencies rather than gross generated token volume alone.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
      - number: '5.3'
        title: Architecture, Model Routing, and Inference Strategy
        blocks:
          - type: paragraph
            body: >-
              Cursor operates a multi-layered software architecture that pairs a client-side Electron and VS Code
              editing core with cloud-hosted context retrieval indexing, multi-model routing, and proprietary inference
              services. The platform distinguishes itself through model-agnostic flexibility, allowing developers and
              engineering teams to dynamically switch execution across frontier models from Anthropic, OpenAI, and
              Google Gemini depending on task complexity, speed requirements, and cost boundaries. Historically,
              reliance on third-party APIs exposed the platform to severe gross margin compression on fixed-rate
              subscription plans, as heavy developer usage drove high token inference costs. In response, Anysphere
              deployed proprietary inference models, evidenced by its Composer technical initiatives, to serve
              high-volume completions internally, transition enterprise contract unit economics to positive gross
              margins, and mitigate strategic supplier concentration risks.
            claimRefs:
