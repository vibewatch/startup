              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Downside, Exit Readiness, and Decision Path
        blocks:
          - type: paragraph
            body: >-
              Downside is not limited to valuation. SentinelOne describes a critical sandbox escape affecting Cursor
              versions before 2.5, and the AI Incident Database records a customer-facing support-bot incident with
              three reports. The Code W also describes model suppliers becoming direct competitors, while PrivatePulse
              warns that slower growth could materially compress the valuation. These are credible thesis-break
              categories even though the available sources do not quantify their financial impact. Before investment,
              confirm the legal transaction status, security conversion terms, audited revenue and ARR definitions,
              gross margin, retention, security remediation, and the competitive cost of model access. Without those
              items, exit readiness and target return remain indeterminate.
            claimRefs:
              - CV009
              - CV010
              - CV013
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
