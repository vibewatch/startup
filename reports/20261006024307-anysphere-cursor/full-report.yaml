      - number: '8.3'
        title: Bull, Base, and Bear Framework
        blocks:
          - type: paragraph
            body: >-
              A defensible scenario analysis must remain conditional because the assigned sources do not disclose
              audited margins, cash flow, preference terms, fully diluted ownership, or primary acquisition documents.
              The bull case requires verified transaction completion or verified standalone economics plus durable
              growth. The base case is continued uncertainty: strong reported scale, but no investable price that can be
              tied to a specific security. The bear case combines multiple compression with supplier competition,
              product-security costs, and transaction failure or unfavorable conversion terms. No numerical probability
              or new valuation range is supportable from this evidence set; diligence milestones, not fabricated
              precision, should move the recommendation.
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV007
              - CV013
              - CV014
              - CV015
