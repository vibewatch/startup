              - CP006
              - CP008
              - CP009
              - CP012
      - number: '3.2'
        title: Capability, pricing, and distribution
        blocks:
          - type: paragraph
            body: >-
              Cursor's product packaging favors buyers who want an opinionated editor with a familiar extension
              ecosystem and centralized commercial plan. The public profile reviewed for this chapter reports a $20
              monthly Pro tier, while the comparison sources describe Cline as free open-source software whose principal
              recurring cost is model inference and Continue as offering a free core plus paid collaboration tiers.
              Those figures are list-price signals, not realized customer cost: autonomous workloads can raise token
              spend, enterprise discounts are not public, and internal build shifts cost into platform engineering and
              governance. Distribution is a larger strategic asymmetry. Microsoft can bundle Copilot through GitHub and
              VS Code, Google can sell into its cloud base, and Anthropic can pair Claude Code with its own models.
              Cursor's multi-model access aids multi-homing, but supplier-owned rivals can compete for the customer
              while also controlling important model inputs. That makes workflow quality and organizational controls
              more durable than temporary access to any one frontier model.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
