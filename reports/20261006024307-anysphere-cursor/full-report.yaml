              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price discipline before company-quality judgment
            body: >-
              The evidence can support a view that Cursor reached substantial scale, but it cannot identify a verified
              current security, entry price, dilution burden, or target return. Investment approval should remain
              conditional on primary transaction documents, an audited metric bridge, and a fully diluted capitalization
              schedule.
            calloutType: recommendation
            claimRefs:
              - CV011
              - CV012
              - CV015
