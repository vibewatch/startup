      - number: '1.3'
        title: Financing History and the Reported SpaceX Transaction
        blocks:
          - type: paragraph
            body: >-
              The reported financing ladder began with an $8 million seed round in 2023 and a $60 million Series A in
              2024. It then accelerated to a $900 million Series C at a $9.9 billion valuation in June 2025 and a $2.3
              billion Series D at a $29.3 billion valuation in November 2025. One company database reports more than
              $3.37 billion raised across Seed through Series D; this is funding raised, not cash available. In April
              2026, independent reporting described advanced talks for at least $2 billion at a valuation above $50
              billion. June reports then said SpaceX agreed on June 16 to acquire Anysphere for $60 billion in stock,
              with closing expected in Q3 subject to regulatory approval. Because the pool contains no post-Q3
              confirmation, this chapter treats $60 billion as announced transaction consideration, not a verified
              current equity valuation or completed ownership change as of October 6.
