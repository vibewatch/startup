      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Reported cumulative funding is not internally consistent: GetLatka lists $2.7 billion across five rounds,
              while AIHub and The Code W report about $3.3 billion or more. More importantly, funding raised is not cash
              available. The reviewed material does not disclose an audited cash balance, monthly burn, free cash flow,
              debt, cloud commitments, runway, or a next-financing trigger, so standalone capital adequacy cannot be
              determined. Operating-risk evidence also matters to revenue quality: a reported sandbox escape affected
              versions before 2.5, and an incident database classifies a 2025 Cursor support event as false or
              misleading information. Neither source quantifies financial impact, but both justify diligence on churn,
              support cost, indemnities, and enterprise renewal concessions. The financial verdict is high growth with
