        title: Milestones and Adverse Operating Signals
        blocks:
          - type: paragraph
            body: >-
              Anysphere's compressed timeline combines product launch, successive financings, fast commercial scaling,
              and two concrete adverse signals. The AI Incident Database records incident 1039 with three reports and an
              incident date of April 19, 2025, providing evidence of a reported post-deployment support failure without
