      - ["Base", "Reported scale is directionally real, but transaction status, security terms, and metric definitions remain unresolved.", "No defensible entry value or target return; maintain research-more status.", "Continued source conflict, opaque preferences, and no revenue-to-cash reconciliation.", "Current evidence most directly supports uncertainty rather than a numerical probability."]
      - ["Bear", "Growth slows, supplier competition intensifies, remediation costs rise, or the reported transaction fails or converts unfavorably.", "Multiple compression and dilution can impair value materially; preserve capital rather than infer a floor.", "Loss of enterprise retention, unresolved critical security findings, or no primary proof of transaction completion.", "Downside signal rises if any thesis-break trigger is verified."]
    notes: "The assigned sources do not support numerical scenario probabilities, standalone valuation ranges, or target returns; the table uses observable diligence signals instead."
