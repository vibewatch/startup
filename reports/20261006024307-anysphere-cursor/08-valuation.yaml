      - ["Thesis: financing access", "PrivatePulse reports a $29.3B Series D; Tech Funding News later reports talks above $50B.", "Financing raised is not cash available, and proposed valuation is not completed consideration.", "Executed financing documents and a current capitalization table."]
      - ["Anti-thesis: price outran verification", "Secondary sources repeat a $60B transaction but disagree on announcement and closing timing.", "Repeated reporting is not a substitute for definitive legal terms.", "Merger agreement, closing evidence, conversion ratio, and preference treatment."]
      - ["Anti-thesis: operational risk can impair the multiple", "Sources describe supplier competition, a sandbox escape, and a customer-support incident.", "The evidence does not quantify churn, remediation cost, or margin impact.", "Cohort retention, security audit results, incident history, and model-supplier economics."]
    notes: "Rows separate reported facts from investment interpretation; revenue and ARR are deliberately not treated as interchangeable."
    claimRefs:
