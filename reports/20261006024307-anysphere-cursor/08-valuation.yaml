company:
  name: "Anysphere (Cursor)"
chapter:
  number: 8
  title: "Valuation"
  summary: "Public sources agree that Anysphere crossed unusually large financing and operating milestones, but they conflict on funding totals, transaction timing, and whether reported figures are revenue or ARR. The evidence supports a research-more recommendation: treat the reported $29.3B, above-$50B, and $60B marks as unverified reference points until primary transaction, capitalization, and financial records establish what security and price are actually investable."
sections:
  - id: "recommendation-and-evidence-quality"
    title: "Recommendation and Evidence Quality"
    body: >-
      The recommendation is research more, with low-to-medium confidence and a high risk
      rating. Multiple independent secondary sources repeat a $60B SpaceX transaction
      narrative, but they disagree on whether the deal was announced in June or closed in
      August 2026, and none of the assigned evidence is a definitive merger agreement,
      capitalization record, or company filing. Public funding totals also differ between
      $2.7B and $3.3B. Those discrepancies are material because an investor cannot calculate
      dilution, preference overhang, conversion economics, or a target return without
      knowing the actual security and transaction status. The correct stance is therefore
      unresolved rather than a precise premium or discount.
    claimRefs:
      - "CV011"
      - "CV012"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV001"
  - id: "financing-and-scale-context"
    title: "Financing and Scale Context"
    body: >-
      The most coherent historical anchor is PrivatePulse's report of a $29.3B post-money
      Series D in November 2025, followed by Tech Funding News reporting April 2026 talks
      for at least $2B at a valuation above $50B. Later sources describe a $60B all-stock
      SpaceX transaction, yet their dates and terminology diverge. Operating metrics are
      similarly non-comparable: GetLatka labels $2B as 2026 revenue and separately lists a
      $4B June revenue milestone, while The Code W calls $4B an ARR figure. These values
      should not be blended into a valuation multiple. They establish scale and momentum,
      not an audited revenue base or a reliable current entry price.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
    tableRefs:
      - "TV002"
  - id: "scenario-framework"
    title: "Bull, Base, and Bear Framework"
    body: >-
      A defensible scenario analysis must remain conditional because the assigned sources
      do not disclose audited margins, cash flow, preference terms, fully diluted ownership,
      or primary acquisition documents. The bull case requires verified transaction
      completion or verified standalone economics plus durable growth. The base case is
      continued uncertainty: strong reported scale, but no investable price that can be
      tied to a specific security. The bear case combines multiple compression with
      supplier competition, product-security costs, and transaction failure or unfavorable
      conversion terms. No numerical probability or new valuation range is supportable
      from this evidence set; diligence milestones, not fabricated precision, should move
      the recommendation.
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV006"
      - "CV007"
      - "CV013"
      - "CV014"
      - "CV015"
    tableRefs:
      - "TV003"
  - id: "downside-and-decision-path"
    title: "Downside, Exit Readiness, and Decision Path"
    body: >-
      Downside is not limited to valuation. SentinelOne describes a critical sandbox escape
      affecting Cursor versions before 2.5, and the AI Incident Database records a
      customer-facing support-bot incident with three reports. The Code W also describes
      model suppliers becoming direct competitors, while PrivatePulse warns that slower
      growth could materially compress the valuation. These are credible thesis-break
      categories even though the available sources do not quantify their financial impact.
      Before investment, confirm the legal transaction status, security conversion terms,
      audited revenue and ARR definitions, gross margin, retention, security remediation,
      and the competitive cost of model access. Without those items, exit readiness and
      target return remain indeterminate.
    claimRefs:
      - "CV009"
      - "CV010"
      - "CV013"
      - "CV014"
      - "CV016"
    figureRefs:
      - "FV001"
