evidenceGaps:
  - type: missing-source
    severity: material
    topic: transaction-close-and-governance
    missingEvidence: >-
      Post-Q3 primary evidence confirming whether the SpaceX transaction closed, failed, was delayed, or changed terms,
      plus the resulting board and governance structure.
    whyItMatters: >-
      Ownership, liquidity, control, valuation, and leadership conclusions differ materially between a signed agreement
      and a completed close.
    diligencePath: >-
      Obtain the definitive closing announcement, regulatory clearance, transaction documents, and post-close corporate
      registry or board records.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: leadership-roster-and-headcount
    missingEvidence: >-
      A dated official organization chart, current executive roster, employee census, and office-location list
      reconciling materially different secondary profiles.
    whyItMatters: >-
      Current staffing, founder continuity, functional coverage, and concentration risk cannot be assessed reliably from
      conflicting profiles.
    diligencePath: >-
      Request HRIS totals by function and location, executive employment confirmations, and the latest board-approved
      organization chart.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
      - TO002
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-investor-map
    missingEvidence: >-
      A fully diluted cap table, option pool, secondary-sale history, liquidation preferences, board rights, and
      investor consent provisions.
    whyItMatters: >-
      Named participation in a financing does not establish current ownership, voting power, proceeds, or transaction
      economics.
    diligencePath: Review financing documents, shareholder registers, board minutes, and transaction disclosure schedules.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-metric-reconciliation
    missingEvidence: >-
      Audited financial statements and a metric dictionary reconciling ARR, annual run rate, annualized revenue,
      recognized revenue, enterprise revenue, gross margin, and cash.
    whyItMatters: >-
      Secondary sources use overlapping metric labels, and none proves revenue quality, profitability, retention, or
      liquidity.
    diligencePath: >-
      Obtain audited statements, billing exports, customer contracts, cohort schedules, and management metric
      definitions for the cited periods.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: tam-sam-som
    missingEvidence: >-
      Independent institutional market research reports (e.g., Gartner, IDC) providing formal TAM/SAM/SOM segment
      breakdowns and multi-year CAGR projections for AI-native IDEs.
    whyItMatters: >-
      Without segmented third-party market sizing studies, market capacity must be estimated from public developer
      populations and seat pricing rather than verified industry spend benchmarks.
    diligencePath: >-
      Acquire licensed developer tool market forecasts from Gartner or IDC that segregate AI coding assistants from
      legacy developer environment spending.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: arr-trajectory
    missingEvidence: >-
      Audited financial statements reconciling mid-2026 ARR growth claims ($2B in February versus reported $3B in April
      and $4B in June) with revenue recognition standards.
    whyItMatters: >-
      Rapid top-line ARR expansion reported across secondary tech media exhibits wide variances in run-rate definitions
      and timing benchmarks.
    diligencePath: >-
      Review internal management reporting, billing logs, and cohort accounting disclosures during formal Series D/E or
      acquisition diligence.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: Customer-level retention, multi-homing, migration effort, and tool-switching frequency by segment.
    whyItMatters: Without cohort evidence, product habit and editor integration cannot be translated into durable lock-in.
    diligencePath: Request enterprise cohort retention, seat expansion, concurrent-tool usage, and churn interview data.
    relatedQuestionRefs:
      - QP006
  - type: missing-source
    severity: material
    topic: internal-build
    missingEvidence: Comparable adoption and total-cost evidence for internal AI coding stacks and standard IDE workflows.
    whyItMatters: The status quo may cap pricing and adoption even when no named vendor wins the account.
    diligencePath: Interview platform-engineering leaders and compare fully loaded internal build cost with realized vendor invoices.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
      - TP003
  - type: missing-source
    severity: material
    topic: competitive-scale
    missingEvidence: >-
      Current official pricing, enterprise terms, market share, and comparable scale metrics for GitHub Copilot, Claude
      Code, Windsurf, and Replit.
    whyItMatters: Secondary reports use different periods and metric definitions, preventing a normalized competitive ranking.
    diligencePath: >-
      Obtain current official rate cards, procurement quotes, customer references, and consistently defined usage
      metrics.
    relatedQuestionRefs:
      - QP002
      - QP004
  - type: private-evidence-only
    severity: material
    topic: go-to-market efficiency
    missingEvidence: >-
      Realized pricing, discounts, sales-cycle length, CAC, CAC payback, channel cost, and expansion economics by
      customer tier.
    whyItMatters: >-
      List pricing and a bottom-up narrative do not establish efficient customer acquisition or durable contract
      economics.
    diligencePath: >-
      Obtain booking cohorts, sales-pipeline conversion, commissions, marketing spend, billing data, and customer-level
      expansion schedules.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: capital adequacy
    missingEvidence: >-
      Audited cash balance, cash burn, free cash flow, debt, cloud and model commitments, planned uses of funds, runway,
      and next-financing triggers.
    whyItMatters: Funding raised is not cash available, and the missing obligations prevent a standalone runway assessment.
    diligencePath: >-
      Review audited balance sheets and cash-flow statements, bank records, debt schedules, cloud contracts, budgets,
      and board-approved financing plans.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: financial metric definitions
    missingEvidence: >-
      A reconciled schedule separating ARR, annual run rate, annualized revenue, recognized revenue, billings,
      collections, and customer cohorts for each reported date.
    whyItMatters: >-
      The retained sources use different labels for the $2B-$4B trajectory, preventing an audited growth or
      revenue-quality conclusion.
    diligencePath: >-
      Reconcile source dates and definitions to monthly management accounts, contracts, invoices, deferred revenue,
      churn, and cash receipts.
    relatedQuestionRefs:
      - QI004
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: minor
    topic: incident economics
    missingEvidence: >-
      Quantified churn, refunds, support expense, contractual credits, insurance recovery, and renewal impact associated
      with reported security and support incidents.
    whyItMatters: The incidents establish operating-risk events but do not quantify their financial materiality.
    diligencePath: >-
      Review incident postmortems, support logs, refunds, renewal cohorts, cyber-insurance claims, and enterprise
      contract credits.
    relatedQuestionRefs:
      - QI007
  - type: missing-source
    severity: material
    topic: enterprise-retention-nrr
    missingEvidence: >-
      Audited cohort retention curves, gross retention rates (GRR), and net revenue retention (NRR) broken down by
      enterprise tier vs individual Pro subscribers.
    whyItMatters: >-
      Without segmented retention data, it is impossible to evaluate whether growth is driven by sustainable enterprise
      expansion or high-churn self-serve developer turnover.
    diligencePath: >-
      Request confidential SaaS cohort retention tables and enterprise contract renewal logs during commercial
      diligence.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: >-
      Comprehensive census of enterprise customer accounts with verified seat counts, ACV bands, and production
      deployment boundaries.
    whyItMatters: >-
      Reported named references like Stripe and Shopify do not verify whether usage is organization-wide or limited to
      small experimental teams.
    diligencePath: Review vendor customer references, case studies, and enterprise master services agreements (MSAs).
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: legal-antitrust
    missingEvidence: Formal Hart-Scott-Rodino (HSR) antitrust filings and Second Request status for the SpaceX-Anysphere transaction.
