              - CP005
              - CP006
              - CP008
              - CP009
              - CP012
      - number: '3.2'
        title: 能力、定价与分发
        blocks:
          - type: paragraph
            body: >-
              Cursor's 产品 产品包装 偏好 买方 其 want 一个 有明确立场的 editor 与 一个 熟悉的 extension 生态 、 集中式 商业 方案. 该 公开 简介 审阅的 用于 该 章节 报告
              一个 $20 月度 Pro 层级, 而 该 comparison 来源 描述 Cline 作为 免费 开放-来源 软件 whose 主要 经常性 成本 是 模型 推理 、 Continue 作为 提供 一个 免费
              核心 plus paid collaboration 层级. 这些 数字 是 list-价格 信号, 不 实现的 客户 成本: 自主工作负载 可以 提高 token 支出, 企业 折扣 是 不 公开, 、 内部
              build 转移 成本 转为 平台工程 、 治理. 分发 是 一个 更大 战略 不对称. Microsoft 可以 捆绑销售 Copilot 截至 GitHub 、 VS Code, Google 可以 销售
              转为 其 云客户基础, 、 Anthropic 可以 搭配 Claude Code 与 其 拥有 模型. Cursor's multi-模型 访问 aids 多归属, 但 供应商自有竞争者 可以 compete
              用于 该 客户 而 也 controlling important 模型 输入. 该 makes 工作流 质量 、 organizational 控制 更多 持久 than 临时 访问 至 any 一 前沿
              模型.
            claimRefs:
              - CP007
              - CP008
