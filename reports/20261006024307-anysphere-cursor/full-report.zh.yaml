      - number: '8.4'
        title: 下行风险、退出准备度与决策路径
        blocks:
          - type: paragraph
            body: >-
              Downside 是 不 limited 至 估值. SentinelOne 描述 一个 关键 sandbox escape affecting Cursor 版本 此前 2.5, 、 该 AI 事件 数据库
              记录 一个 客户-facing 支持-bot 事件 与 三 报告. 该 Code W 也 描述 模型 suppliers becoming 直接 competitors, 而 PrivatePulse warns
              该 slower 增长 可能 重大地 compress 该 估值. 这些 是 credible thesis-break categories even though 该 可用 来源 确实 不 quantify
              其 财务 影响. 此前 investment, confirm 该 法律 交易 状态, 安全 conversion 条款, 经审计 收入 、 ARR definitions, 毛利率, 留存, 安全
              remediation, 、 该 有竞争力的 成本 的 模型 访问. 没有 这些 items, exit readiness 、 目标回报 保持 无法确定.
            claimRefs:
              - CV009
