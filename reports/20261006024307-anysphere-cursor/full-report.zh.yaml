      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 先看价格纪律，再判断公司质量
            body: >-
              该 证据 可以 支持 一个 view 该 Cursor reached substantial 规模, 但 它 cannot 认定 一个 已核实 当前 安全, 进入 价格, dilution burden, 或
              目标回报. Investment 批准 应 保持 有条件的 在 主要 交易 文件, 一个 经审计 指标桥接表, 、 一个 完全摊薄 capitalization schedule.
