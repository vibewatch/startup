              Anysphere 于 2022 年由 Michael Truell、Sualeh Asif、Aman Sanger 和 Arvid Lunnemark 在旧金山创立。二手资料一致将 Cursor 描述为一款
              AI 驱动的代码编辑器：公司重构开源 Visual Studio Code 基础，将其做成 AI
              优先环境，而不只是提供编辑器扩展。公开证据支持订阅软件模式及异常迅速的据报道采用速度，但没有提供经审计账目，也没有统一的指标口径。尤其是，各来源分别使用 ARR、年度运行率和年化收入等说法。因此，本章保留
              2026 年 6 月约 $4B 年化收入这一指标，其中约 $2.6B 归属于企业 B2B 客户；不能把它转换为经审计收入或现金。
