  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 决策链从相互冲突的公开估值信息出发，最终基于文件证据得出“继续研究”的建议。
    data:
      nodes:
        - id: reported-marks
          label: 据报道的估值信息
          detail: $29.3B D 轮融资、超过 $50B 的融资谈判，以及据报道达 $60B 的交易
        - id: status-conflict
          label: 交易状态冲突
          detail: 各来源对公告、收购和交割时间的说法不一致
        - id: metric-conflict
          label: 指标冲突
          detail: 收入与 ARR 的口径尚未对齐
        - id: risk-overlay
          label: 风险叠加
          detail: 竞争、安全和客户支持证据
        - id: valuation-boundary
          label: 估值边界
          detail: 没有主要交易条款、经审计的经营数据或股权结构表
        - id: decision
          label: 继续研究
          detail: 在证据缺口补齐前，不新增投资，也不设定目标回报
    approximationNotes: 这是按顺序排列的定性决策链，不代表数值转化率、概率或交易已完成。
