      - number: '8.2'
        title: 融资与规模背景
        blocks:
          - type: paragraph
            body: >-
              该 most coherent 历史 anchor 是 PrivatePulse's 报告 的 一个 $29.3B 投后 D 轮 在 November 2025, followed 到 Tech 融资 News
              报道 4 月 2026 谈判 用于 至少 $2B 于 一个 估值 above $50B. Later 来源 描述 一个 $60B 全部-股票 SpaceX 交易, 但 其 dates 、 terminology
              不一致. 运营 指标 是 similarly 不可比: GetLatka 口径 $2B 作为 2026 收入 、 separately lists 一个 $4B 6 月 收入 milestone, 而 该
              Code W calls $4B 一个 ARR 数字. 这些 数值 应 不 是 混合 转为 一个 估值 多个. 它们 确定 规模 、 势头, 不 一个 经审计 收入 base 或 一个 可靠 当前 进入 价格.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV009
              - CV010
              - CV011
              - CV014
      - number: '8.3'
        title: 乐观、基准与悲观框架
        blocks:
          - type: paragraph
            body: >-
              一个 可辩护 情景分析 必须 保持 有条件的 因为 该 指定的 来源 确实 不 披露 经审计 利润率, 现金 flow, preference 条款, 完全摊薄 所有权, 或 主要 收购 文件. 该 乐观情景
              需要 已核实 交易 completion 或 已核实 独立 经济性 plus 持久 增长. 该 基准情景 是 continued uncertainty: 强劲 据报道的 规模, 但 没有 investable
              价格 该 可以 是 tied 至 一个 specific 安全. 该 悲观情景 结合 多个 压缩 与 供应商 competition, 产品-安全 成本, 、 交易 失败 或 unfavorable
              conversion 条款. 没有 数值概率 或 new 估值 range 是 supportable 从 该 证据 set; 尽调里程碑, 不 fabricated precision, 应 转向 该
              recommendation.
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV007
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
