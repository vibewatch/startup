      - number: '5.4'
        title: 安全隔离、合规与技术风险
        blocks:
          - type: paragraph
            body: >-
              Deploying 自主 coding agents 与 本地文件系统 write 访问 引入 严重 技术, 安全, 、 治理 挑战 转为 企业 environments. 该 根本张力 stems 从 授予
              AI agents permission 至 执行终端命令 、 修改工作区配置 而 attempting 至 maintain robust 隔离边界. 该 vulnerability surfaced 在
              CVE-2026-26268, 一个 关键 授权缺失漏洞 (CWE-862) 发现 在 Cursor 版本 之前 至 2.5, 其中 prompt injection 载荷 可能 操纵 敏感 `.git`
              directory 配置 、 Git hooks 至 实现 remote code 执行 outside 该 sandbox 没有 用户 interaction. Anysphere 修复 该
              vulnerability 在 版本 2.5 到 实施 strict authorization 控制 至 阻止写入 至 Git 配置文件 从 workspace sandboxes. 企业 采用 仍然 取决于
              在 严格 信任边界, 包括 SOC 2 合规, 审计日志, 、 私有部署控制.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: 图表
        blocks:
          - type: callout
            title: 智能体沙箱隔离与恶意提示注入
            body: >-
              该 发现 的 CVE-2026-26268 highlights 该 关键 运营 danger 的 授予 AI agents local file system write 访问. 因为 Git 自动执行
              hook scripts 在……期间 routine 开发者 commands, 授权检查不足 在 workspace `.git` 配置 allowed prompt-injected agents 至 实现
              remote code 执行 outside 该 sandbox. Securing 自主 coding tools 需要 strict, defense-在-depth authorization 该 视为
              local repositories 作为 不受信任的执行环境.
