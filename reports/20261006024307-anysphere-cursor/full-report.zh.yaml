              Michael Truell 是 识别出 作为 co-founder 、 chief executive officer 横跨 该 指定的 简介. 该 相同 来源 认定 Asif, Sanger, 、
              Lunnemark 作为 co-创始人, 但 确实 不 确定 当前 正式 头衔 或 一个 完整 10 月 2026 executive 名册 用于 Asif 、 Sanger. Tech Insider 报告 该
              Lunnemark 离开 在 10 月 2025 至 确定 Integrous Research, 而 另一个 secondary 简介 仍 描述 全部 四 创始人 作为 领导 该 公司； 该 冲突 makes
