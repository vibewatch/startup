figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 从成立到 2026 年 6 月据报道的交易、受证据边界约束的里程碑，其中包括两起不利的产品事件。
    data:
      items:
        - label: 2022：Anysphere 成立
          detail: 四位 MIT 同行创立了这家旧金山公司。
          tone: neutral
          claimRefs:
            - CO001
            - CO002
        - label: 2023：Cursor 发布并完成种子融资
          detail: Cursor 于 2023 年发布；报道将同年一笔由 OpenAI Startup Fund 领投的 $8M 种子融资列入其中。
          tone: positive
          claimRefs:
            - CO004
            - CO007
        - label: 2024：Series A
          detail: 报道记录了一笔 $60M Series A 融资。
          tone: positive
          claimRefs:
            - CO007
        - label: 2025-04-19：AI Incident Database 记录
          detail: 事件 1039 列出三份报告及该事件日期。
          tone: negative
          claimRefs:
            - CO016
        - label: 2025-06：Series C
          detail: 据报道，$900M Series C 融资对应 $9.9B 估值。
          tone: positive
          claimRefs:
            - CO008
        - label: 2025-10：创始人变动
          detail: Tech Insider 报道 Arvid Lunnemark 离职并创办 Integrous Research。
          tone: neutral
          claimRefs:
            - CO006
        - label: 2025-11：Series D
          detail: 据报道，$2.3B Series D 融资对应 $29.3B 估值。
          tone: positive
          claimRefs:
            - CO009
        - label: 2026-02：CVE 披露
          detail: 已发布 CVE-2026-26268，涉及影响 2.5 版本之前 Cursor 的沙箱逃逸。
          tone: negative
          claimRefs:
            - CO015
        - label: 2026-04：拟议融资
          detail: 报道称谈判金额至少为 $2B，估值超过 $50B。
          tone: neutral
          claimRefs:
            - CO011
        - label: 2026-06-16：据报道 SpaceX 达成协议
          detail: 6 月来源报道了一项 $60B 全股票协议，预计在取得批准后于第三季度完成交割。
          tone: neutral
          claimRefs:
            - CO012
