  - id: FI001
    title: 收入到毛利的传导机制
    type: flow
    summary: 展示一条有来源的定性桥接，说明报道中的订阅增长如何遇到与使用量挂钩的推理成本。
    data:
      nodes:
        - id: developer-adoption
          label: 个人开发者采用
          detail: 自下而上进入付费漏斗
        - id: paid-seats
          label: Pro 与 Business 席位
          detail: 报道中的标价为每月 $20 和 $40
        - id: enterprise-expansion
          label: 企业扩张
          detail: 据报道，定制合同约占收入的 60%
        - id: run-rate
          label: 报道的 ARR / 运行率
          detail: 2 月为 $2B，4 月为 $3B，截至 2026 年 6 月约为 $4B
        - id: inference-cost
          label: 推理与计算成本
          detail: 与使用量挂钩的第三方模型费用挤压贡献毛利
        - id: gross-profit
          label: 毛利结果
          detail: 据报道，2026 年初为负，之后略有转正
      edges:
        - from: developer-adoption
          to: paid-seats
          label: 自助转化
        - from: paid-seats
          to: enterprise-expansion
          label: 团队采用与扩张
        - from: enterprise-expansion
          to: run-rate
          label: 合同约定的经常性价值
        - from: run-rate
          to: inference-cost
          label: 使用量产生可变成本
        - from: inference-cost
          to: gross-profit
          label: 路由与模型经济性决定价差
    approximationNotes: 仅为定性机制；节点标签保留报道中的指标，不推断转化率、收入确认方式或利润率百分比。
