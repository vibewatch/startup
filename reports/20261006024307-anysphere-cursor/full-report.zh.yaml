  - id: FE001
    title: Cursor 多层产品架构与执行栈
    type: stack
    summary: 分层呈现 Cursor 客户端界面、上下文检索、智能体编排和混合推理层。
    data:
      layers:
        - label: 客户端呈现与编辑界面
          detail: 基于 Visual Studio Code 定制分支的开发者交互界面
          modules:
            - 集成 AI 面板的定制 VS Code Electron 分支
            - 行内补全缓冲区与预测式差异渲染器
            - 解析项目级 .cursorrules 的工作区配置解析器
            - 覆盖 GitHub、GitLab、Slack 和 Linear 的外部工具集成
        - label: 上下文组装与代码库智能
          detail: 汇集多文件语法树、诊断信号和代码库上下文
          modules:
            - 解析抽象语法树的代码库索引引擎
            - 活动缓冲区跟踪与诊断编译器错误监听器
            - 将用户规则与工作区结构结合的项目指令注入
            - 为相关多文件依赖建立索引的语义搜索检索
        - label: 智能体编排与执行边界
          detail: 在沙箱边界内协调自主多文件编辑工作流
          modules:
            - 用于多文件规划的自主 Agent 执行脚手架
            - 终端命令运行器与自动差异生成引擎
            - Bugbot 自动代码审查与缺陷检测流水线
            - 执行文件授权检查的工作区安全沙箱
        - label: 模型网关与混合推理基础设施
          detail: 在自研与第三方前沿模型之间路由补全请求
          modules:
            - 支持 Claude、GPT-4 和 Gemini 的动态模型路由网关
            - 为高频补全提供服务的自研 Composer 推理模型
            - 采用高性能 GPU 硬件优化的计算基础设施
            - 确保数据合规和零留存政策的企业 API 代理
        - label: 企业安全与治理层
          detail: 为组织控制提供行政监督、单点登录和审计日志
          modules:
            - SAML 与 OpenID Connect 单点登录认证
            - 集中式工作区审计日志与遥测导出
            - 私有云与专用 VPC 部署架构
            - 与外部基础模型供应商签订的零数据留存协议
        - label: 开发者工具链与生态集成
          detail: 连接编辑器状态与外部开发者工具的双向连接器
          modules:
            - 用于在 GitHub 和 GitLab 创建拉取请求的 Git 供应商桥接
            - 与 Linear 和 Jira 事项同步的任务跟踪器
            - 将通知事件流式传输至 Slack 的通信钩子
            - 面向外部工具的定制模型上下文协议（MCP）服务器端点
    approximationNotes: 架构层反映已发布的技术运营模型、安全公告和系统文档；内部路由阈值未公开披露。
    claimRefs:
      - CE001
      - CE009
      - CE010
      - CE011
      - CE012
      - CE013
      - CE015
  - id: FU001
    title: 企业客户采用旅程图
    type: journey-map
    summary: 从个人实践者发现产品，逐步走向企业采购与安全治理的迭代采用路径。
    data:
      items:
        - label: 个人实践者发现
          description: 开发者下载作为 VS Code 分支的 Cursor，以获得增强的自动补全和代码库聊天功能。
          duration: Weeks 1-4
          sentiment: positive
        - label: Pro 层自助转化
          description: 工程师升级至每月 $20 的 Pro 订阅，以获得更高的前沿模型限额。
          duration: Month 2
          sentiment: positive
        - label: 团队与部门裂变
          description: 开发者同事在共享项目代码库中采用 Cursor，推动团队自然协作。
          duration: Months 3-5
          sentiment: positive
        - label: Business 层采购评估
          description: IT 与工程负责人评估集中计费、隐私控制和 API 配置。
          duration: Months 6-8
          sentiment: neutral
        - label: 企业安全与治理审计
          description: 企业安全团队审查沙箱边界（CVE-2026-26268）和数据留存协议。
          duration: Months 9-12
          sentiment: negative
        - label: 合同标准化或流失
          description: 客户要么正式确定全企业许可证，要么因成本和模型锁定而流失。
          duration: Ongoing
          sentiment: neutral
    approximationNotes: 旅程阶段综合自免费增值开发者 SaaS 模式及已发布的企业安全审计。
    claimRefs:
      - CU001
