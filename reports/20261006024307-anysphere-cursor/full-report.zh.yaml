  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险与下行触发点
      - 概率信号
    rows:
      - - 乐观
        - 一手记录确认有利的 $60B 全股票对价或强劲的独立经营经济性；报道规模与经审计 ARR 及健康利润率相互吻合。
        - 使用已验证的对价或经审计的现金流经济性；目前无法支持更高区间。
        - 不利的换股条款、利润率疲弱、留存恶化或安全事件复发。
        - 只有在最终交易文件和经审计财务文件确定后，证据才会增强。
      - - 基准
        - 报道规模大体真实，但交易状态、安全条款和指标定义仍未解决。
        - 没有可辩护的入场价值或目标回报；维持继续研究状态。
        - 来源持续冲突、优先权安排不透明，且没有收入到现金的调节表。
        - 当前证据最直接支持不确定性，而非数值概率。
      - - 悲观
        - 增长放缓、供应商竞争加剧、补救成本上升，或报道中的交易失败或以不利条件转换。
        - 倍数压缩和稀释可能严重损害价值；应守住资本，而不是推断价值底线。
        - 企业留存流失、关键安全问题未解决，或没有交易完成的一手证明。
        - 若任何打破投资逻辑的触发条件得到验证，下行信号将增强。
    notes: 指定来源不支持数值化情景概率、独立估值区间或目标回报；本表改用可观察的尽调信号。
