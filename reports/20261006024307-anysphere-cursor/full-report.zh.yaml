        blocks:
          - type: paragraph
            body: >-
              据报道，融资梯度始于 2023 年 $8M 种子轮和 2024 年 $60M A 轮。随后，2025 年 6 月以 $9.9B 估值完成 $900M C 轮，2025 年 11 月又以 $29.3B 估值完成
              $2.3B D 轮。一家企业数据库称，从 Seed 到 D 轮累计募资超过 $3.37B；这是已募资金，不等于可用现金。2026 年 4 月，独立报道指公司正就至少 $2B 融资进行深入谈判，估值超过
              $50B。6 月的报道随后称，SpaceX 于 6 月 16 日同意以 $60B 股票收购 Anysphere，预计在 Q3 完成交割，但须获监管批准。由于来源池没有 Q3 之后的确认，本章将 $60B
              视为已宣布的交易对价，而非截至 10 月 6 日已核实的当前股权估值或已完成的所有权变更。
