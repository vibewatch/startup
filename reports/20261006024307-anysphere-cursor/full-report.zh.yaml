  - id: FM001
    title: 市场规模视角与可触达支出层级
    type: pyramid
    summary: 以分层市场规模展示漏斗：从全球开发者总人数，逐步到 Cursor 已实现及预计的收入容量。
    data:
      items:
        - label: 全球专业开发者（TAM 基础）
          value: 30M developers
          detail: 覆盖所有语言、平台和企业岗位的全球软件开发者人数
        - label: 可触达的 IDE 与云编辑器用户（TAM 支出）
          value: $15B-$20B
          detail: 假设 28M-30M 名开发者每年的工具预算为 $400-$700，计算可触达的年度总支出
        - label: AI 增强型 IDE 可触达市场（SAM）
          value: $7.2B-$9.6B
          detail: 全职活跃开发者以每用户每月 $20-$40 的价格采用生成式 AI 编程助手
        - label: 高速迭代专业细分市场（目标 SAM）
          value: $3.5B-$4.5B
          detail: 优先采用智能体多文件工作流的前端、AI 研究和敏捷全栈工程师
        - label: Cursor 2026 年 2 月运行率（已实现 SOM）
          value: $2.0B ARR
          detail: 据报道，2026 年 2 月个人和企业层级的年化收入已达到该水平
        - label: 预计 2026 年末目标（扩展 SOM）
          value: $4.0B-$6.0B ARR
          detail: 根据科技行业及分析师估计，预计年化收入将沿该轨迹增长
    approximationNotes: 席位数量和美元金额来自分析师模型，将全球开发者估计值（28M-30M）与公布的每月 $20 至 $40 价格点及报道的 ARR 里程碑结合起来。
    claimRefs:
      - CM001
      - CM003
      - CM007
      - CM014
  - id: FP001
    title: 按工作流整合与买方控制力划分的竞争定位
    type: quadrant
    summary: 受证据约束的序数定位显示，Cursor 在整合式工作流上领先，而开源和内部替代方案提供更强的买方控制力。
    data:
      points:
        - label: Cursor
          x: 5
          'y': 3
          note: 编辑器与智能体工作流已整合；显著依赖外部模型供应商。
        - label: GitHub Copilot
          x: 4
          'y': 2
          note: GitHub 和 VS Code 分发能力强；未保留控制力证据。
        - label: Claude Code
          x: 3
          'y': 2
          note: 原生终端的规模化竞争者，与其模型供应商绑定。
        - label: Cline
          x: 3
          'y': 5
          note: 以扩展为主导的工作流，支持开源、自带密钥（BYOK）和本地模型控制。
        - label: Continue
          x: 3
          'y': 5
          note: 可配置的 IDE、CLI 和 CI 方案，但连续性存在不确定性。
        - label: 内部构建
          x: 1
          'y': 5
          note: 控制力可能最大，但封装式整合度低、运营负担高。
    approximationNotes: X 是 1-5 的工作流整合序数评分，Y 是 1-5 的买方控制力序数评分，均来自保留的定性证据；这是分析师判断，不是实测市场数据或独立基准测试结果。
