  title: "Customers"
  summary: "Anysphere expanded from self-serve developers paying $20 per month to enterprise deployments covering an estimated 50,000 enterprise customers, reaching reported annualized revenue milestones between $2 billion and $4 billion by mid-2026. However, public enterprise verification remains concentrated around unverified client logos, while customer-facing support bot hallucinations and sandbox escape vulnerabilities expose material operational and procurement friction."
sections:
  - id: "customer-base-segmentation"
    title: "Customer Base Segmentation and Buyer Economics"
    body: |
      Anysphere structures the customer base for its Cursor AI code editor across two primary commercial layers: individual practitioners and enterprise engineering organizations. The entry-level adoption tier consists of individual professional developers and freelancers utilizing the Pro subscription tier priced at $20 per month per seat. This self-serve layer established Cursor's initial commercial density, providing the user volume that accelerated annual recurring revenue past $100 million in 2024. A critical adjacent sub-segment includes venture-backed startups and AI-native engineering teams, where developer velocity directly drives competitive product cycles and justifies high willingness to pay.

      At the organizational level, Anysphere distributes the Business tier, which incorporates enterprise-grade management capabilities including centralized billing, administrative controls, privacy enforcement modes, and bring-your-own-key API options. Market reporting indicates that enterprise adoption expanded rapidly to encompass approximately 50,000 enterprise customer accounts by mid-2026 as larger engineering organizations sought to institutionalize AI-assisted development workflows. Nevertheless, customer procurement reviews must balance developer productivity gains against third-party frontier model dependencies and infrastructure costs.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory-and-named-proof"
    title: "Adoption Trajectory and Named Enterprise Production Proof"
    body: |
      Cursor's commercial trajectory demonstrates unprecedented top-line velocity within enterprise developer tooling. After reaching $100 million in annual recurring revenue during 2024, Cursor achieved an annualized run rate of $1 billion by late 2025, scaled to $2 billion in February 2026, and reached reported milestones between $3 billion in April 2026 and $4 billion in early June 2026 prior to the SpaceX acquisition transaction. Enterprise adoption has been cited across prominent technology organizations, with production deployments and team use reported at companies including Stripe, Shopify, and OpenAI.

      Despite these impressive headline metrics, customer proof exhibits substantial variance in reference quality and independent verification. Many enterprise accounts originate as bottom-up developer adoptions where corporate engineering teams informally use the tool before central procurement formalizes licensing. Full enterprise-wide standardization remains unverified for the vast majority of named accounts, as public disclosures frequently rely on company statements or third-party press profiles rather than audited customer case studies detailing seat counts, production usage ratios, or contractual retention benchmarks.
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "retention-friction-and-concentration"
    title: "Retention Durability, Support Hallucinations, and Security Risks"
    body: |
      Sustaining enterprise retention poses significant challenges for Anysphere due to intense competitive pressure, model-cost dynamics, and customer trust incidents. In April 2025, customer satisfaction experienced measurable disruption when an automated customer support bot named 'Sam' hallucinated and asserted an invented login policy to users who had been unexpectedly logged out of the editor. This failure in automated customer operations reportedly prompted immediate subscription cancellations and highlighted vulnerabilities in relying on AI bots for critical customer support interactions.

      Security governance represents another critical barrier to enterprise durability. In February 2026, security researchers identified CVE-2026-26268, a critical sandbox escape vulnerability affecting Cursor versions prior to 2.5. The vulnerability allowed malicious prompt injection payloads to modify sensitive Git configuration files and Git hooks within the editor's environment, creating a path for out-of-sandbox remote code execution. Because enterprise security teams demand rigorous assurance against repository tampering and unauthorized code execution, unresolved sandbox vulnerabilities introduce substantial procurement roadblocks and heighten customer churn risk across security-sensitive enterprise cohorts.
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
