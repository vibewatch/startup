callouts:
  - calloutType: "risk"
    title: "Agentic Sandbox Isolation and Malicious Prompt Injection"
    body: "The discovery of CVE-2026-26268 highlights the critical operational danger of granting AI agents local file system write access. Because Git automatically executes hook scripts during routine developer commands, insufficient authorization checks on workspace `.git` configurations allowed prompt-injected agents to achieve remote code execution outside the sandbox. Securing autonomous coding tools requires strict, defense-in-depth authorization that treats local repositories as untrusted execution environments."
    claimRefs:
      - "CE013"
      - "CE014"
      - "CE015"
  - calloutType: "insight"
    title: "Proprietary Inference Models as a Structural Unit Economic Moat"
    body: "Cursor's introduction of proprietary inference models, such as the Composer series, represents a pivotal strategic transition from an API wrapper into a vertically integrated developer platform. Serving high-volume code completions via proprietary models transforms unit economics on enterprise contracts from negative to positive gross margins while insulating the business against pricing aggression or access restrictions from frontier model suppliers."
    claimRefs:
      - "CE010"
      - "CE011"
      - "CE012"
