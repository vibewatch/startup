  evidenceGaps:
    - type: "missing-source"
      severity: "material"
      topic: "transaction-close-and-governance"
      missingEvidence: >-
        Post-Q3 primary evidence confirming whether the SpaceX transaction
        closed, failed, was delayed, or changed terms, plus the resulting board
        and governance structure.
      whyItMatters: >-
        Ownership, liquidity, control, valuation, and leadership conclusions
        differ materially between a signed agreement and a completed close.
      diligencePath: >-
        Obtain the definitive closing announcement, regulatory clearance,
        transaction documents, and post-close corporate registry or board
        records.
