        - "QO010"
      relatedTableRefs:
        - "TO003"
    - type: "conflicting-data"
      severity: "material"
      topic: "leadership-roster-and-headcount"
      missingEvidence: >-
        A dated official organization chart, current executive roster, employee
        census, and office-location list reconciling materially different
        secondary profiles.
      whyItMatters: >-
        Current staffing, founder continuity, functional coverage, and
        concentration risk cannot be assessed reliably from conflicting
        profiles.
      diligencePath: >-
        Request HRIS totals by function and location, executive employment
        confirmations, and the latest board-approved organization chart.
