company:
  name: "Anysphere (Cursor)"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Anysphere, founded in 2022 by four MIT peers, built Cursor as an AI-first
    code editor and was reported at roughly $4 billion in annualized revenue by
    June 2026. June sources also reported a $60 billion all-stock agreement with
    SpaceX, but the assigned evidence does not establish whether the expected
    Q3 2026 closing occurred by this report's October 6 run date.
sections:
  - id: "identity-product-and-scale"
    title: "Identity, Product, and Reported Scale"
    body: >-
      Anysphere is a San Francisco company founded in 2022 by Michael Truell,
      Sualeh Asif, Aman Sanger, and Arvid Lunnemark. Secondary profiles
      consistently describe Cursor as an AI-powered code editor created by
      rebuilding the open-source Visual Studio Code base as an AI-first
      environment rather than offering only an editor extension. The public
      evidence supports a subscription software model and unusually rapid
      reported adoption, but it does not provide audited accounts or a
      consistent metric dictionary. In particular, sources variously use ARR,
      annual run rate, and annualized revenue. This chapter therefore preserves
      the June 2026 metric as approximately $4 billion of annualized revenue,
      including approximately $2.6 billion attributed to enterprise B2B
      customers, rather than converting it into audited revenue or cash.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO013"
      - "CO014"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership, Founder Continuity, and Governance Gaps"
    body: >-
      Michael Truell is identified as co-founder and chief executive officer
      across the assigned profiles. The same sources identify Asif, Sanger, and
      Lunnemark as co-founders, but do not establish current formal titles or a
      complete October 2026 executive roster for Asif and Sanger. Tech Insider
      reports that Lunnemark departed in October 2025 to establish Integrous
      Research, while another secondary profile still describes all four
      founders as leading the company; that conflict makes an official
      leadership roster a diligence requirement rather than a fact to infer.
      No assigned source supplies board composition, voting rights, executive
      succession arrangements, or a current chief financial officer. The
      available evidence consequently supports founder identity and Truell's
      CEO role, but not detailed functional ownership or control conclusions.
    claimRefs:
      - "CO002"
      - "CO005"
      - "CO006"
    tableRefs:
      - "TO002"
  - id: "financing-and-transaction"
    title: "Financing History and the Reported SpaceX Transaction"
    body: >-
      The reported financing ladder began with an $8 million seed round in 2023
      and a $60 million Series A in 2024. It then accelerated to a $900 million
      Series C at a $9.9 billion valuation in June 2025 and a $2.3 billion
      Series D at a $29.3 billion valuation in November 2025. One company
      database reports more than $3.37 billion raised across Seed through
      Series D; this is funding raised, not cash available. In April 2026,
      independent reporting described advanced talks for at least $2 billion at
      a valuation above $50 billion. June reports then said SpaceX agreed on
      June 16 to acquire Anysphere for $60 billion in stock, with closing
      expected in Q3 subject to regulatory approval. Because the pool contains
      no post-Q3 confirmation, this chapter treats $60 billion as announced
      transaction consideration, not a verified current equity valuation or
      completed ownership change as of October 6.
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO003"
  - id: "milestones-and-adverse-signals"
    title: "Milestones and Adverse Operating Signals"
    body: >-
      Anysphere's compressed timeline combines product launch, successive
      financings, fast commercial scaling, and two concrete adverse signals.
      The AI Incident Database records incident 1039 with three reports and an
      incident date of April 19, 2025, providing evidence of a reported
      post-deployment support failure without proving its full commercial
      impact. SentinelOne's vulnerability database describes CVE-2026-26268 as
      a critical prompt-injection path to Git-hook writes and out-of-sandbox
      code execution in Cursor versions before 2.5; the same source says
      version 2.5 addressed the flaw. These records demonstrate that product
      reliability and agent permissions belong in the company-level diligence
      record. They do not establish an absence of other incidents, and neither
      source substitutes for Anysphere's internal incident register,
      remediation evidence, or customer-impact analysis.
    claimRefs:
      - "CO015"
      - "CO016"
      - "CO001"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO011"
      - "CO012"
    figureRefs:
      - "FO001"
