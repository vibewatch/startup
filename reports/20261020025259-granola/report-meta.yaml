  topStrengths:
    - Bot-free, human-guided note creation differentiates Granola from visible meeting-bot workflows.
    - Product scope has expanded into shared context, integrations, APIs, and MCP-compatible assistants.
    - Multiple publications corroborate the $125 million Series C and $1.5 billion financing mark.
    - Named enterprise adoption and public seat pricing provide qualitative commercial signals.
  topRisks:
    - No disclosed revenue, ARR, retention, gross margin, cash, burn, or runway supports the reported valuation.
    - >-
      Consent and privacy execution require primary legal diligence, including verification of the alleged 2026 class
      action.
    - Audio deletion and inconsistent speaker attribution reduce replayability and auditability in sensitive meetings.
    - >-
      Endpoint capture and third-party cloud, transcription, and AI providers create unquantified operating
      dependencies.
  unresolvedGaps:
    - Current revenue, ARR, revenue mix, gross margin, paid-seat count, and realized pricing by plan.
    - NRR, GRR, logo churn, renewal rates, contract duration, and customer concentration by segment.
    - Cash on hand, monthly burn, runway, debt, committed spend, and the next financing milestone.
    - Series C terms, liquidation preferences, dilution, option-pool treatment, board rights, and secondary liquidity.
    - Primary court records and current procedural status for the alleged Chamberlain v. Granola matter.
    - Current leadership and board roster, ownership, voting control, and succession coverage.
    - >-
      SOC 2 report details, incident completeness, provider fallback coverage, and jurisdiction-specific consent
      controls.
