companyProfile:
  summary: >-
    Granola is a London-founded private software company building a bot-free AI notepad for meetings. Its product
    combines device-audio transcription with user-authored notes, then makes meeting context available through shared
    folders, integrations, cross-meeting queries, APIs, and MCP-compatible assistants. Public reporting identifies Chris
    Pedregal and Sam Stephenson as co-founders and Pedregal as CEO.
