callouts:
  - calloutType: risk
    title: Team-centric displacement risk
    body: >-
      Granola's bot-free workflow does not offset weaker speaker attribution,
      video capture, manager dashboards, or sales analytics when those are the
      buyer's decisive criteria.
    claimRefs: [CP015, CP016]
  - calloutType: recommendation
    title: Underwrite retained context, not transcription
    body: >-
      Diligence should test whether shared history, templates, integrations,
      and cross-meeting retrieval create measurable retention beyond the
      easily copied transcript-and-summary layer.
    claimRefs: [CP002, CP003, CP012, CP016]
