      - [Fireflies, "$18", "Per user per month, billed monthly", "Not normalized across plans", "Adjacent vendor citing Transcribex; not first-party", "Procure against a current quote and matched feature tier"]
      - ["Read AI", "$19.75", "Per user per month, billed monthly", "Not normalized across plans", "Adjacent vendor citing Transcribex; not first-party", "Procure against a current quote and matched feature tier"]
      - [Fathom, "$20", "Per user per month, billed monthly", "Not normalized across plans", "Adjacent vendor citing Transcribex; not first-party", "Free-tier generosity may matter more than the paid sticker price"]
