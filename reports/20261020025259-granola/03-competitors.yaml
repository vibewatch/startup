schemaVersion: "report-v2"
artifact: competitors
slug: granola
runDate: 2026-10-20
company:
  name: Granola
chapter:
  number: 3
  title: Competitors
  summary: >-
    Granola is differentiated less by raw transcription than by a bot-free,
    human-guided note workflow and a growing cross-meeting memory layer.
    That position is attractive for individual professionals and sensitive
    external calls, but sales-oriented rivals retain advantages in team
    administration, analytics, speaker attribution, and workflow automation.
sections:
  - id: landscape-and-buyer-alternatives
    title: Landscape and buyer alternatives
    body: >-
      The competitive set spans more than meeting-note applications. Direct
      peers include Otter, Fireflies, Read AI, Fathom, and tl;dv, while the
      practical status quo remains manual notes, generic transcripts, or an
      internal workflow assembled from recording, speech-to-text, and a
      knowledge repository. Third-party reviews consistently place Granola at
      the personal, bot-free end of the market: Otter is associated with live
      collaborative transcription and integrations, Fireflies with sales
      workflow automation, Read AI with analytics, Fathom with automated
      assistance, and tl;dv with team knowledge sharing. Public evidence does
      not support a reliable comparison of competitor funding, revenue,
      installed base, or enterprise penetration, so those scale fields remain
      explicitly unknown rather than being inferred from product visibility.
    claimRefs: [CP001, CP006, CP007, CP008, CP009, CP010, CP011]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability-and-workflow-tradeoffs
    title: Capability and workflow trade-offs
    body: >-
      Granola's clearest product distinction is the combination of device-level
      capture and notes shaped by the user's own shorthand. This avoids a
      visible meeting bot and can preserve the user's judgment about what
      mattered, while shared folders, integrations, and cross-meeting queries
      extend the product from a single-call utility toward a memory layer.
      Those benefits are not universal wins. Independent reviews describe
      Otter as stronger for live collaboration, Fireflies as stronger for
      sales and CRM workflows, and Read AI as stronger for meeting analytics.
      One hands-on review also reports weak speaker labeling, no video capture,
      and thinner manager tooling in Granola. The matrix therefore marks
      unsupported cells as unknown and treats vendor-authored comparisons as
      directional claims, not independent benchmarks.
    claimRefs: [CP001, CP002, CP003, CP006, CP007, CP008, CP009, CP010, CP015]
    tableRefs: [TP002]
  - id: pricing-distribution-and-switching
    title: Pricing, distribution, and switching economics
    body: >-
      Granola's Business price is consistently stated as $14 per user per
      month across company and third-party pages reviewed for this run, with
      an Enterprise tier starting at $35 per user per month. One adjacent
      vendor's October 2026 comparison reports higher monthly per-user entry
      prices for Otter, Fireflies, Read AI, and Fathom, but that comparison
      relies on another pricing publisher and is not a substitute for current
      first-party quotes. Distribution increasingly runs through workflow
      integrations: Granola lists Notion, Slack, HubSpot, Affinity, Zapier, and
      MCP connectivity. Broad meeting-platform compatibility lowers adoption
      friction and permits multi-homing, while accumulated history, templates,
      shared folders, and downstream automations can create workflow and data
      switching costs after adoption.
    claimRefs: [CP003, CP004, CP005, CP012]
    tableRefs: [TP003]
  - id: moat-durability-and-displacement
    title: Moat durability and displacement risk
    body: >-
      The current moat is behavioral and contextual rather than based on a
      uniquely defensible transcription primitive. Granola's human-guided
      workflow can generate notes that feel more personal, and repeated use can
      compound value through searchable meeting history and connected
      workflows. Yet competitors already provide transcripts, summaries,
      integrations, automation, or analytics, making the underlying category
      vulnerable to feature convergence. Granola is most exposed where buyers
      prioritize manager dashboards, speaker attribution, multilingual sales
      intelligence, or video evidence over unobtrusive capture. Its durable
      advantage therefore depends on turning individual habit into retained
      context and organization-wide workflow, without allowing stronger
      team-oriented rivals or general-purpose AI workspaces to absorb the same
      job.
    claimRefs: [CP012, CP013, CP014, CP015, CP016]
