              acquisition, but they are historical or weak proxies. No assigned source supplies CAC, paid conversion,
              sales-cycle length, average contract value, logo churn, gross retention, net retention, or channel
              economics. The evidence therefore cannot distinguish efficient product-led growth from subsidized adoption
