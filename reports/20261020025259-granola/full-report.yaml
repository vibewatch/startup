chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product model
        blocks:
          - type: paragraph
            body: >-
              Granola presents itself as an AI notepad rather than an unattended meeting bot: it captures device audio,
              combines a transcript with the user's own notes, and turns that material into editable summaries and
              searchable meeting memory. Its official pages say the product works across major meeting applications and
              in-person conversations while keeping notes private by default. Independent reviews broadly confirm the
              no-bot, editable-note workflow, while stressing that transcription and note generation still depend on
              cloud providers. Reworked dates the company's London founding to 2023 and its product launch to 2024; the
              allocated evidence does not establish whether London remains the current legal or operating headquarters.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
