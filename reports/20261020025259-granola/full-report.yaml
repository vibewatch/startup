  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: From meeting capture to reusable context
        blocks:
          - type: paragraph
            body: >-
              Granola is delivered as an AI notepad rather than a visible meeting participant. The desktop product
              captures device audio while the user writes short notes, then enhances those notes from the transcript
              after the meeting. That human-guided workflow is the core product distinction: the user supplies emphasis
              and structure, while the transcript supplies missed detail. The resulting notes can be edited and moved
              into downstream tools rather than remaining a standalone transcript. This design reduces meeting friction
              for the user, but it also removes the automatic consent cue created by a bot joining the participant list.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE014
      - number: '5.2'
        title: Product surface and maturity
        blocks:
          - type: paragraph
            body: >-
              The public product surface now spans individual capture, shared team knowledge, cross-meeting retrieval,
              workflow automation, and an MCP connector. Folder-level queries and shared Spaces move the product beyond
              single-meeting summarization toward a searchable organizational memory layer. Native integrations cover
              common destinations such as Slack, Notion, HubSpot, Attio, and Affinity, while Zapier broadens the action
              surface. MCP provides a developer-facing route into external AI tools, although the assigned evidence
              contains no public repository, package telemetry, contributor activity, or independently measured API
              usage with which to assess developer adoption or operational maturity.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE010
