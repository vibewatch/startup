      - number: '3.2'
        title: Capability and workflow trade-offs
        blocks:
          - type: paragraph
            body: >-
              Granola's clearest product distinction is the combination of device-level capture and notes shaped by the
              user's own shorthand. This avoids a visible meeting bot and can preserve the user's judgment about what
              mattered, while shared folders, integrations, and cross-meeting queries extend the product from a
              single-call utility toward a memory layer. Those benefits are not universal wins. Independent reviews
              describe Otter as stronger for live collaboration, Fireflies as stronger for sales and CRM workflows, and
              Read AI as stronger for meeting analytics. One hands-on review also reports weak speaker labeling, no
              video capture, and thinner manager tooling in Granola. The matrix therefore marks unsupported cells as
              unknown and treats vendor-authored comparisons as directional claims, not independent benchmarks.
