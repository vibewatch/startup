  - id: FM001
    title: Granola's evidence-constrained commercial reach
    type: pyramid
    summary: >-
      The source set supports a hierarchy from an unquantified category universe to priced team tiers, but not a numeric
      TAM, SAM, or SOM.
    data:
      nodes:
        - label: Category universe
          value: Not quantified
          detail: Knowledge workers with meeting-documentation needs
        - label: Serviceable workflow
          value: Not quantified
          detail: Recurring meetings requiring transcripts, notes, or searchable context
        - label: High-fit wedge
          value: Not quantified
          detail: Trust-sensitive, meeting-heavy professionals and teams
        - label: Free entry
          value: $0/user/month
          detail: Acquisition tier; independent reviews report a 30-day history limit
        - label: Business
          value: $14/user/month
          detail: Unlimited history and workflow integrations
        - label: Enterprise
          value: Starts at $35/user/month
          detail: Published floor; contract economics are not disclosed
    approximationNotes: >-
      This is a commercial-reach hierarchy, not a scale-proportional TAM/SAM/SOM chart. Prices are published nominal
      values; the three upper layers remain deliberately unquantified.
