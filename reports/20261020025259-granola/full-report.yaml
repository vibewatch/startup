        title: Delivery cost and margin path
        blocks:
          - type: paragraph
            body: >-
              Granola argues that device-level capture avoids the real-time video streaming, cloud video storage, and
              virtual-participant compute incurred by bot-based meeting products. That architecture plausibly lowers one
              class of service-delivery cost, and the company says audio is deleted after transcription while
              transcripts and notes persist. However, this is an issuer explanation, not an audited cost breakdown.
              Model-inference spend, transcription-provider pricing, support, security, storage of text, and integration
              costs are not quantified. Company-authored workload examples frame a fixed seat fee as progressively
              cheaper per meeting at higher usage, but they do not establish Granola's own gross margin. Investors
              therefore should treat the cost advantage as a mechanism to test, not as evidence of software-like
              contribution margin.
