      - number: '4.3'
        title: Distribution and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              The available evidence suggests a product-led entry motion: Granola launched in 2024 with free meeting
              allowances, and the current Basic tier lets users experience the core workflow before paying for durable
              history and integrations. A sponsored but editorially independent growth playbook reports a four-person
              launch team and roughly 150 manually onboarded users, while a low-reputation third-party listing also
