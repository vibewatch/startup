      - CI006
      - CI008
      - CI015
  - id: FE001
    title: Meeting-context product architecture
    type: stack
    summary: >-
      A functional stack from bot-free capture through reusable context and downstream action; it depicts product
      stages, not a verified infrastructure topology.
    data:
      layers:
        - label: Meeting surface
          detail: Zoom, Google Meet, Microsoft Teams, Webex, Slack Huddles, and in-person conversations
        - label: Device capture
          detail: Microphone and system-audio capture without a visible meeting participant
        - label: Transcription
          detail: Real-time desktop transcription and temporary mobile audio caching
        - label: Human-guided synthesis
          detail: User notes, transcript context, templates, summaries, and action items
        - label: Team memory
          detail: Notes, transcripts, shared folders, Spaces, and cross-meeting queries
        - label: External action
          detail: Native integrations, Zapier workflows, and MCP-compatible assistants
    approximationNotes: >-
      Functional layers are synthesized from public product descriptions. They do not establish physical hosting
      boundaries, request flows, subprocessors, or service levels.
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE005
      - CE006
  - id: FU001
    title: Product-led customer journey and expansion surfaces
    type: journey-map
    summary: >-
      Granola can progress from individual trial to workflow integration and governed team use, but public sources do
      not quantify conversion, retention, or expansion at any stage.
    data:
      items:
        - label: Discover
          detail: Meeting-heavy professional encounters bot-free note-taking.
          touchpoints:
            - Free plan
            - Mac, Windows, or mobile app
            - Individual meeting workflow
        - label: Validate
          detail: User compares enhanced notes with the conversation and tests fit.
          touchpoints:
            - AI-enhanced notes
            - Transcript context
            - Custom templates
        - label: Habit
          detail: Repeated meetings create personal searchable history.
          touchpoints:
            - Unlimited history on Business
            - People and Companies context
        - label: Distribute
          detail: Notes move into team systems and become visible to collaborators.
          touchpoints:
            - Slack
            - Notion
            - HubSpot
            - Zapier
        - label: Collaborate
          detail: Shared folders and cross-meeting queries turn notes into team knowledge.
          touchpoints:
            - Shared Spaces
            - Folder-level queries
            - Source-linked answers
        - label: Govern
          detail: Enterprise controls create a route to formal organization-wide procurement.
          touchpoints:
            - Admin controls
            - Security controls
            - Org-wide governance
    approximationNotes: >-
      The ordered journey is an inferred mechanism from product and plan features, not observed funnel data; no stage
      conversion rates are available.
    claimRefs:
      - CU001
      - CU006
      - CU007
      - CU008
      - CU015
