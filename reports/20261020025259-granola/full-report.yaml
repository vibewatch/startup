        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Reworked identifies Chris Pedregal and Sam Stephenson as Granola's co-founders and describes Pedregal as
              chief executive; an independent long-form user review also identifies Pedregal as CEO. That supports the
              founder and chief-executive baseline, but not a complete current leadership roster. The assigned evidence
              does not identify a CFO, general counsel, compliance leader, board members, observer rights, founder
              ownership, or voting-control arrangements, and it does not establish Stephenson's current operating title.
              The concentration of externally visible leadership around Pedregal therefore creates a diligence question
              rather than proof of problematic key-person dependence.
