  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Pricing and revenue architecture
        blocks:
          - type: paragraph
            body: >-
              Granola's monetization is visible at the packaging level but not at the accounting level. The current
              public offer uses a free Basic tier as the acquisition surface, a $14-per-user-per-month Business tier for
              unlimited history and workflow integrations, and an Enterprise tier starting at $35 per user per month for
