      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The current moat is behavioral and contextual rather than based on a uniquely defensible transcription
              primitive. Granola's human-guided workflow can generate notes that feel more personal, and repeated use
              can compound value through searchable meeting history and connected workflows. Yet competitors already
              provide transcripts, summaries, integrations, automation, or analytics, making the underlying category
              vulnerable to feature convergence. Granola is most exposed where buyers prioritize manager dashboards,
              speaker attribution, multilingual sales intelligence, or video evidence over unobtrusive capture. Its
              durable advantage therefore depends on turning individual habit into retained context and
              organization-wide workflow, without allowing stronger team-oriented rivals or general-purpose AI
              workspaces to absorb the same job.
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Team-centric displacement risk
            body: >-
              Granola's bot-free workflow does not offset weaker speaker attribution, video capture, manager dashboards,
              or sales analytics when those are the buyer's decisive criteria.
            calloutType: risk
            claimRefs:
              - CP015
              - CP016
          - type: callout
            title: Underwrite retained context, not transcription
            body: >-
              Diligence should test whether shared history, templates, integrations, and cross-meeting retrieval create
              measurable retention beyond the easily copied transcript-and-summary layer.
            calloutType: recommendation
            claimRefs:
