        - from: product
          to: adoption
        - from: adoption
          to: metrics-gap
        - from: product
          to: competition
        - from: metrics-gap
          to: decision
        - from: competition
          to: decision
    approximationNotes: The flow is qualitative and does not assign weights, probabilities, or implied values.
