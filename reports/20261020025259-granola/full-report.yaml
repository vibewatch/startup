      - number: '3.3'
        title: Pricing, distribution, and switching economics
        blocks:
          - type: paragraph
            body: >-
              Granola's Business price is consistently stated as $14 per user per month across company and third-party
              pages reviewed for this run, with an Enterprise tier starting at $35 per user per month. One adjacent
              vendor's October 2026 comparison reports higher monthly per-user entry prices for Otter, Fireflies, Read
              AI, and Fathom, but that comparison relies on another pricing publisher and is not a substitute for
              current first-party quotes. Distribution increasingly runs through workflow integrations: Granola lists
              Notion, Slack, HubSpot, Affinity, Zapier, and MCP connectivity. Broad meeting-platform compatibility
              lowers adoption friction and permits multi-homing, while accumulated history, templates, shared folders,
              and downstream automations can create workflow and data switching costs after adoption.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
