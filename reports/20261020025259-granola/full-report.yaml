              list prices and report no published annual discount, which improves confidence in the price card but says
              nothing about realized discounts, paid-seat mix, contract duration, collections, or revenue recognition.
              MCP, API access, integrations, and advanced models appear bundled into paid seats rather than publicly
              priced as separate usage streams. Consequently, the model looks like recurring software subscription
