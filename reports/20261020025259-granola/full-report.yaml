      - number: '5.3'
        title: Architecture, dependencies, and controls
        blocks:
          - type: paragraph
            body: >-
              The observable architecture has six stages: meeting audio capture, transcription, transcript-plus-note
              enhancement, storage and organization, retrieval, and downstream actions. Public sources consistently say
              that raw audio is not retained after transcription, which limits the sensitive data footprint but also
              prevents replay-based verification. They do not consistently describe the desktop transport path: one
              Granola article says audio passes directly to transcription providers, while another says nothing is
              streamed to a remote server mid-call and transcription occurs on-device. Without a current data-flow
              diagram, subprocessor map, API documentation, or reliability disclosure, infrastructure boundaries and
              failure modes cannot be underwritten from public evidence.
            claimRefs:
              - CE007
              - CE008
              - CE015
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE015
              - CE016
          - type: figure
            figureRef: FE001
            claimRefs:
