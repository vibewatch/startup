schemaVersion: "report-v2"
artifact: financials
slug: granola
runDate: 2026-10-20
company:
  name: Granola
chapter:
  number: 4
  title: Financials
  summary: >-
    Granola exposes a simple freemium-to-seat-subscription model: Business is
    listed at $14 per user per month and Enterprise starts at $35, while paid
    conversion is tied to history, integrations, administration, and security.
    The public evidence does not disclose revenue, ARR, gross margin, retention,
    cash, burn, runway, or debt, so neither revenue quality nor capital adequacy
    can be underwritten from the assigned sources.
sections:
  - id: pricing-and-revenue-architecture
    title: Pricing and revenue architecture
    body: >-
      Granola's monetization is visible at the packaging level but not at the
      accounting level. The current public offer uses a free Basic tier as the
      acquisition surface, a $14-per-user-per-month Business tier for unlimited
      history and workflow integrations, and an Enterprise tier starting at
      $35 per user per month for controls such as SSO and organization-level
      administration. Independent reviews broadly reproduce those list prices
      and report no published annual discount, which improves confidence in the
      price card but says nothing about realized discounts, paid-seat mix,
      contract duration, collections, or revenue recognition. MCP, API access,
      integrations, and advanced models appear bundled into paid seats rather
      than publicly priced as separate usage streams. Consequently, the model
      looks like recurring software subscription revenue, but its mix and
      quality remain private.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI015]
    tableRefs: [TI001, TI002]
  - id: delivery-cost-and-margin-path
    title: Delivery cost and margin path
    body: >-
      Granola argues that device-level capture avoids the real-time video
      streaming, cloud video storage, and virtual-participant compute incurred
      by bot-based meeting products. That architecture plausibly lowers one
      class of service-delivery cost, and the company says audio is deleted
      after transcription while transcripts and notes persist. However, this is
      an issuer explanation, not an audited cost breakdown. Model-inference
      spend, transcription-provider pricing, support, security, storage of text,
      and integration costs are not quantified. Company-authored workload
      examples frame a fixed seat fee as progressively cheaper per meeting at
      higher usage, but they do not establish Granola's own gross margin.
      Investors therefore should treat the cost advantage as a mechanism to
      test, not as evidence of software-like contribution margin.
    claimRefs: [CI006, CI007, CI008, CI010, CI015]
    figureRefs: [FI001]
  - id: distribution-and-sales-efficiency
    title: Distribution and sales-efficiency proxies
    body: >-
      The available evidence suggests a product-led entry motion: Granola
      launched in 2024 with free meeting allowances, and the current Basic tier
      lets users experience the core workflow before paying for durable history
      and integrations. A sponsored but editorially independent growth
      playbook reports a four-person launch team and roughly 150 manually
      onboarded users, while a low-reputation third-party listing also identifies
      a free tier and broad device coverage. Those observations are consistent
      with low-friction acquisition, but they are historical or weak proxies.
      No assigned source supplies CAC, paid conversion, sales-cycle length,
      average contract value, logo churn, gross retention, net retention, or
      channel economics. The evidence therefore cannot distinguish efficient
      product-led growth from subsidized adoption or a sales-assisted enterprise
      motion.
    claimRefs: [CI003, CI009, CI011, CI016]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: >-
      The assigned evidence contains no current cash balance, monthly burn,
      runway, debt or credit-facility terms, working-capital profile, capex
      requirement, or next-round trigger. Funding and valuation are not treated
      as substitutes for cash available, and the historical financing chronology
      is intentionally left to Company Overview. The principal adverse financial
      risk is therefore information asymmetry: clear list pricing sits beside a
      nearly blank operating model. Independent reviewers also flag limited
      collaboration depth, lack of playback, speaker-attribution constraints,
      and a pending consent-related complaint; these could affect conversion,
      support burden, security review time, or willingness to pay, but none is
      quantified. The financial verdict is “model legible, economics
      unverified”: diligence should obtain cohort revenue, realized pricing,
      retention, gross-margin bridges, and a cash-to-milestone plan before
      underwriting growth or valuation.
    claimRefs: [CI010, CI011, CI012, CI013, CI014, CI015]
    tableRefs: [TI003]
tables:
  - id: TI001
    title: Revenue streams and revenue-quality map
    columns:
      - Stream
      - Mechanism
      - Unit / list price
      - Public status
      - Quality and diligence implication
    rows:
      - [Basic, "Free acquisition tier", "$0 per user per month", "Core notes and chat; history reported as limited", "No direct revenue; request free-to-paid conversion by cohort"]
      - [Business, "Recurring seat subscription", "$14 per user per month", "Unlimited history plus integrations and advanced models", "List price is corroborated; realized price, term, churn, and collections are private"]
      - [Enterprise, "Recurring enterprise seat subscription", "Starting at $35 per user per month", "Adds enterprise controls and support", "Starting price is not realized ACV; request seat bands, discounts, and renewal terms"]
      - ["MCP, API, and integrations", "Bundled paid-plan capability", "No separate public fee found", "Included in Business / Enterprise packaging", "Potential expansion driver, but no attach-rate or incremental revenue disclosed"]
      - ["Usage or transcription overage", "No public usage charge identified", "Unavailable", "Seat pricing is presented without minute caps on Business", "Confirm model-cost exposure, fair-use limits, and any unlisted overage terms"]
    notes: >-
      List pricing and packaging are public; realized pricing, revenue recognition,
      paid-seat mix, discounts, usage limits, and contract terms are unavailable.
    claimRefs: [CI001, CI002, CI003, CI004, CI015]
  - id: TI002
    title: Pricing and monetization evidence
    columns:
      - Evidence item
      - Public value
      - Evidence quality
      - Underwriting interpretation
    rows:
      - ["Business list price", "$14 per user per month", "Official and independently corroborated", "Strong evidence for list price; no evidence of realized ARPU"]
      - ["Enterprise list price", "Starts at $35 per user per month", "Official and independently corroborated", "Floor language leaves discounts, minimum seats, and services unknown"]
      - ["Basic retention gate", "30 days of meeting history reported by independent reviewers", "Multiple reviews; issuer pricing article does not state the limit in the fetched text", "History expiry is a conversion lever that should be tested against paid conversion and churn"]
      - ["Illustrative workload economics", "$0.35 per meeting at 40 meetings/month; $1.40 per meeting at 10 meetings/week", "Company-authored arithmetic using the $14 seat price", "Value framing, not revenue, CAC, margin, or customer ROI evidence"]
    notes: >-
      Values are list-price or company-authored workload examples; no row represents
      realized revenue, independently measured savings, or audited unit economics.
    claimRefs: [CI001, CI002, CI004, CI005, CI007]
  - id: TI003
    title: Unit economics and capital-adequacy diligence map
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Specific diligence ask
    rows:
      - [Revenue / ARR, null, "Unavailable", "Establishes commercial scale and valuation denominator", "Provide monthly recognized revenue and ARR by tier for the last 24 months"]
      - [Revenue mix, null, "Unavailable", "Tests concentration in Business versus Enterprise and any services", "Provide revenue by tier, geography, customer segment, and recurring/nonrecurring classification"]
      - [Gross margin, null, "Unavailable", "Tests whether device capture translates into an economic advantage", "Provide gross margin and a bridge across transcription, model inference, storage, support, and hosting"]
      - [CAC and payback, null, "Unavailable", "Tests efficiency of product-led and enterprise acquisition", "Provide fully loaded CAC and payback by self-serve, sales-assisted, and partner channel"]
      - [Sales cycle and ACV, null, "Unavailable", "Determines cash-conversion timing and enterprise dependence", "Provide median cycle, starting ACV, expansion ACV, discount, and contract term by segment"]
      - [Retention and churn, null, "Unavailable", "Determines durability of seat revenue and expansion", "Provide logo churn, GRR, NRR, seat expansion, and cohort retention by plan"]
      - ["Cash, burn, and runway", null, "Unavailable", "Determines financing dependency and milestone coverage", "Provide current unrestricted cash, monthly net cash burn, committed spend, and base/downside runway"]
      - [Debt and obligations, null, "Unavailable", "Could subordinate equity or accelerate financing need", "Provide debt, credit facilities, covenants, leases, cloud commitments, and other off-balance-sheet obligations"]
    notes: >-
      Null means the assigned public source pool did not disclose the metric; it
      does not mean zero, not applicable, or that the company lacks the item.
    claimRefs: [CI010, CI011, CI012, CI015]
figures:
  - id: FI001
    title: Revenue model bridge from adoption to unverified gross profit
    type: flow
    summary: >-
      Granola's public funnel connects free adoption to paid seats and bundled
      workflow value, but the margin outcome is not disclosed.
    data:
      nodes:
        - label: "Free Basic adoption"
          value: "$0"
          detail: "Core notes and chat create a low-friction trial surface."
        - label: "Conversion trigger"
          value: "History + workflow depth"
          detail: "Unlimited history, advanced models, integrations, and administration sit behind paid tiers."
        - label: "Business seats"
          value: "$14"
          unit: "per user per month"
          detail: "Published recurring seat price."
        - label: "Enterprise seats"
          value: "From $35"
          unit: "per user per month"
          detail: "Published starting price with enterprise controls."
        - label: "Device-capture delivery"
          value: "Company-claimed cost advantage"
          detail: "Granola says it avoids bot streaming and video-storage costs."
        - label: "Gross profit"
          value: "Unavailable"
          detail: "No gross margin or cost-of-revenue bridge appears in the assigned evidence."
    approximationNotes: >-
      Ordered mechanism only; the figure does not imply conversion rates,
      revenue magnitude, realized pricing, or a quantified gross-margin bridge.
    claimRefs: [CI003, CI006, CI008, CI015]
callouts:
  - calloutType: risk
    title: The price card is not a financial model
    body: >-
      Public list prices establish packaging, not ARR, realized ARPU, retention,
      gross margin, or cash generation. Those private metrics remain the core
      underwriting blocker.
    claimRefs: [CI001, CI002, CI010, CI011, CI012, CI015]
  - calloutType: insight
    title: Cost advantage remains a testable hypothesis
    body: >-
      Device-level capture may remove bot-streaming and video-storage costs, but
      model inference, transcription, support, and security costs are undisclosed.
    claimRefs: [CI006, CI008, CI010]
