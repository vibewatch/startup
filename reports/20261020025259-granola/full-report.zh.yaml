      - number: '3.3'
        title: 定价、分销与转换经济性
        blocks:
          - type: paragraph
            body: >-
              本次审阅的公司页面和第三方页面都将 Granola Business 价格写为每用户每月 $14，Enterprise 则从每用户每月 $35 起。一家邻近厂商在 2026 年 10 月的比较中称
              Otter、Fireflies、Read AI 和 Fathom 的每用户月度起价更高，但该比较依赖另一家定价出版商，不能替代当前一手报价。分销越来越依赖工作流集成：Granola 列出
              Notion、Slack、HubSpot、Affinity、Zapier 和 MCP
              连接。广泛兼容会议平台降低了采用摩擦，也允许多平台并用；采用后，积累的历史记录、模板、共享文件夹和下游自动化可能形成工作流与数据切换成本。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP005
      - number: '3.4'
        title: 壁垒持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              当前壁垒主要来自行为和上下文，而不是独有且难以防御的转写底层能力。Granola
              的人工引导工作流可以生成更贴近个人的笔记，反复使用还可能通过可搜索的会议历史和连接的工作流持续累积价值。但竞争对手已经提供转写、摘要、集成、自动化或分析，整个品类容易出现功能趋同。当买家更看重管理者仪表盘、说话人归属、多语言销售智能或视频证据，而不是隐蔽采集时，Granola
              暴露最明显。因此，它的持久优势取决于能否把个人习惯转化为留存的上下文和全组织工作流，同时不被更强的团队型竞争者或通用 AI 工作空间接管同一任务。
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
