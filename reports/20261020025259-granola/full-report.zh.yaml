        title: 展示项
        blocks:
          - type: callout
            title: 市场规模证据是关键缺口
            body: 没有任何保留来源提供独立的品类收入池、符合条件的席位数、Granola 客户数或付费渗透率。价格可以帮助刻画账户经济性，但不能被上升为 TAM、SAM 或 SOM。
            calloutType: risk
