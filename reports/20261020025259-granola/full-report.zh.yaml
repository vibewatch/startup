      - number: '7.4'
        title: 财务模型缺口与论点失效标准
        blocks:
          - type: paragraph
            body: >-
              本章指定的公开证据无法确定烧钱、现金跑道、毛利率、客户集中度、留存率、事故完整性，或外部模型和转写使用的经济性。这些是缺口，不是零值，也不表示不利事件不存在。在作出投资决定前，管理层应提供月度现金烧钱和现金跑道、客群留存与集中度、按工作负载拆分的供应商支出、安全事故和法律登记册、底层
              SOC 2
              报告，以及按司法辖区说明的同意控制流程。论点失效触发因素应包括无法强制执行参会者通知、重大不利法律认定、受监管工作流中反复出现采集或归属失败、失去关键服务商访问而没有经过测试的备选方案，或现金跑道低于投资人要求的融资缓冲。在这些测试通过前，缓解措施仍有一部分只是被声称，而非独立证明。
