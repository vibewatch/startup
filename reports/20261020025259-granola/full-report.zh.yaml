      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 不要把竞争对手指控当作法院认定
            body: 唯一保留的诉讼引用来自竞争对手撰写的比较。评估概率、损害赔偿或运营后果前，应取得起诉书和案卷。
            calloutType: risk
            claimRefs:
              - CR005
              - CR011
          - type: callout
            title: 以控制证据作为投资门槛
            body: 在从“继续研究”推进之前，必须取得同意控制演示、SOC 2 报告审阅、事故与法律登记册、多人说话人准确性测试、服务商备选方案证据，以及月度烧钱和现金跑道数据。
            calloutType: recommendation
