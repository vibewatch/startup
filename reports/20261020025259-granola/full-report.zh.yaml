  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              基于公开证据的结论是“继续研究”：置信度中等、风险高，估值偏高。融资事实本身异常清晰：TechCrunch 和另外两家出版物报道了 1.25 亿美元 C 轮融资，估值 15 亿美元，高于上一轮的 2.5
              亿美元；TechCrunch 和 Creative Collaboration 则将累计融资额定为 1.92
              亿美元。对入场决定更重要的是尚未公开的信息。保留的估值来源没有提供绝对收入、ARR、留存率或利润率，因此无法计算收入倍数、前瞻增长倍数或基于证据的回报目标。因此，当前估值应被视为融资观察值，而不是已证明的公允价值。投资决定需要围绕商业规模、留存、经济性、资本结构和轮次条款开展一手尽调，而不是根据不完整公开数据推断折价。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV007
              - CV012
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV014
              - CV015
      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点是：Granola 可以从差异化的无机器人会议记事本，扩展成服务团队和 AI 工作流的权限化上下文层。保留证据描述了 Spaces、个人和企业 API、MCP 连接以及点名的企业用户；公司公开的
              Business 价格为每用户每月
              $14，并称没有分钟数上限。这些信号支持产品抱负和合理的变现路径，但不能证明合同金额、付费席位规模、留存率或收入质量。反论点同样直接：会议笔记正在商品化，竞争对手和生产力软件巨头拥有更广的分销，而估值在没有公开运营指标的情况下翻了六倍。只有当客户级和客群证据显示上下文层扩张带来持久、高毛利的企业收入，而不只是功能差异时，投资判断才应改变。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV013
              - CV014
      - number: '8.3'
        title: 情景与可比背景
        blocks:
          - type: paragraph
            body: >-
              传统的乐观／基准／悲观估值区间会制造虚假精确，因为分母缺失。保留来源提供了 Granola 的两个融资参考点：2.5 亿美元和 15 亿美元，但都不是模型化的公允价值边界。来源还称 Fireflies 估值 10
              亿美元、用户超过 1600
              万，但没有提供可比收入、增长、留存、利润率、轮次日期或优先权数据，因此该观察不能支持倍数比较。所以下述情景采用明确的运营证据测试，而不是编造数值或概率。乐观情景要求经验证的企业经济性和可防御性；基准情景要求证据证明团队上下文产品能把采用转化为持久收入；悲观情景则由商品化、既有巨头分销或转化疲弱触发。在一致的一手指标和安全条款可得之前，每个情景都不赋予价格。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV007
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV007
              - CV012
              - CV014
              - CV016
      - number: '8.4'
        title: 退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              公开证据不支持目标回报、持有期或退出价值。Granola
              正在扩大产品范围，也有点名的企业采用，但来源集没有披露经审计收入、客群留存、毛利率、烧钱、现金跑道、股权结构表、优先权结构、债务、老股流动性、治理权利或退出时间表。最终尽调应取得按套餐拆分的月度 ARR
              和确认收入、按客群拆分的毛留存和净留存、包含模型及转写成本的毛利率、客户集中度、现金与烧钱、C
              轮条款清单、清算优先权、期权池稀释和董事会权利。如果企业转化或留存疲弱、上下文层使用无法变现、巨头抹平分销优势，或轮次条款使本来可接受的企业价值对新普通股投资人失去吸引力，论点就会失效。在这些测试通过前，跟踪进展优于赋予一个投机性的退出结果。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 价格纪律
            body: 把 15 亿美元视为最新融资估值，而不是已证明的公允价值；在评估入场价格前，必须取得收入质量、留存率、利润率和安全条款证据。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV012
              - CV015
          - type: callout
            title: 虚假精确是当前估值风险
            body: 保留的公开证据没有收入、留存率、利润率、烧钱或优先权数据，因此任何数值化回报或退出情景都是没有依据的臆造。
            calloutType: risk
            claimRefs:
              - CV004
              - CV012
              - CV016
