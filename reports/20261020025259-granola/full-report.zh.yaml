      - number: '2.3'
        title: 买家、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              最初最容易采用的用户，是亲自感受到记录负担的高频开会创始人、高管、投资人、顾问、招聘人员和产品研究员。个人用户可以从免费层开始；当无限历史、共享上下文、集成、账单控制或合规功能变得重要时，职能负责人或运营负责人会成为付费方。产品团队购买它来综合研究结果；收入团队可能更重视
              CRM
              自动化和通话分析，而机器人型竞争产品在这些场景中更合适。受监管工作流会形成另一条采购路径，涉及安全、隐私和法务负责人。证据还表明，通用会议工具可能把受监管买家输给能自动化行业工作流的垂直产品，从而压缩横向产品可获得的份额。
            claimRefs:
              - CM002
              - CM005
              - CM009
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM005
              - CM009
              - CM010
              - CM014
      - number: '2.4'
        title: 驱动因素、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              连续会议、会后综合工作，以及保留跨对话组织记忆的需求推动采用。转写质量、说话人归属、无法回放原始音频、参与者同意、安全审查，以及用户改变既有记笔记习惯的成本都会限制采用。独立评测明显没有公司指南那么乐观：它们指出多人场景表现较弱、音频核验有限，并提到一项待核实的同意问题指控；一份汇编比较还称隐私阻力更广，但没有披露底层研究分母。这些约束使采用时点取决于具体工作流，也削弱了建立在全部知识工作者之上的估值逻辑。更有说服力的判断应看高频、重视信任的客群中的付费转化和留存，而现有证据没有量化这两项。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM015
