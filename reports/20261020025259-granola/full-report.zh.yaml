  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场是付费软件：采集会议音频，将其转成转写稿或结构化笔记，并让生成的上下文可搜索或供下游工作流使用。Granola 更窄的品类是 AI
              记事本，即设备音频采集加人工引导增强，而不是显眼的会议机器人或通用自动摘要。因此纳入的支出包括会议笔记软件、转写处理、可搜索历史和工作流集成。视频会议许可、广义知识管理套件、人工转写，以及主要用于辅导而购买的销售对话智能属于邻近市场，不在核心边界内。现状替代方案是手写笔记、平台原生转写或什么都不做；证据表明，免费使用和低设置摩擦很重要，因为不消费仍是直接替代方案。
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM016
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              来源池没有独立的品类收入估算、符合条件的知识工作者数量、实测转化率，也没有 Granola 的客户数和席位数。因此，自上而下估算 TAM
              会制造虚假精确。可支持的规模视角是商业层面的，而非全市场层面：免费入门层、每用户每月 14 美元的 Business 层，以及每用户每月 35 美元起的 Enterprise 层。Granola 自己的 22
              席示例对应 Business 方案年支出 3,696 美元，并与一个已点名但身份不明的机器人基准的 5,280 美元进行比较。这些数字描述的是账户经济性，不是收入、ARR、市场份额或可用现金。在取得独立品类基数和
              Granola 特定渗透率分母前，任何投资模型都应将 TAM、SAM 和 SOM 留空。
