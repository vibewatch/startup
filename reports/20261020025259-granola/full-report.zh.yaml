  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 定价与收入架构
        blocks:
          - type: paragraph
            body: >-
              Granola 如何靠套餐变现一目了然，但账目如何体现仍无从得知。公开方案用免费 Basic 套餐获客；Business 套餐按每用户每月 $14 收费，提供无限历史记录和工作流集成；Enterprise
              套餐每用户每月 $35 起，提供 SSO、组织级管理等控制能力。独立评测大体印证这些标价，并称未见公开的年度折扣。价目表因此更可信，但实际折扣、付费席位构成、合同期限、回款和收入确认仍看不清。MCP、API
              访问、集成和高级模型似乎都打包进付费席位，未见按用量单独公开定价。由此看，Granola 更像是靠经常性软件订阅获得收入，但收入构成和质量仍未公开。
            claimRefs:
              - CI001
