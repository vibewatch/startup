      - number: '3.2'
        title: 能力与工作流取舍
        blocks:
          - type: paragraph
            body: >-
              Granola
              最鲜明的产品差异，是把设备级采集与根据用户个人速记形成的笔记结合起来。这样既不需要显眼的会议机器人，也能保留用户对重点的判断；共享文件夹、集成和跨会议查询则把产品从单次通话工具延伸为记忆层。但这些优势并非处处成立。独立评测认为
              Otter 更擅长实时协作，Fireflies 更擅长销售和 CRM 工作流，Read AI 更擅长会议分析。一篇实测评测还称 Granola
              的说话人标注较弱、不支持视频采集，面向管理者的工具也更薄弱。因此矩阵将没有证据支持的单元标为未知，并把厂商撰写的比较视为方向性说法，而非独立基准。
