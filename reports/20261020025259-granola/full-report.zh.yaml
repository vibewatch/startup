    title: 产品驱动的客户旅程与扩张触点
    type: journey-map
    summary: Granola 可以从个人试用推进到工作流集成和受治理的团队使用，但公开来源没有量化任何阶段的转化、留存或扩张。
    data:
      items:
        - label: 发现
          detail: 会议密集型专业人士接触到无机器人笔记。
          touchpoints:
            - 免费计划
            - Mac、Windows 或移动应用
            - 个人会议工作流
        - label: 验证
          detail: 用户将增强笔记与对话对照，测试是否匹配需求。
          touchpoints:
            - AI 增强笔记
            - 转录上下文
            - 自定义模板
        - label: 习惯
          detail: 重复会议积累个人可搜索历史。
          touchpoints:
            - Business 无限历史记录
            - People 与 Companies 上下文
        - label: 分发
          detail: 笔记进入团队系统，并对协作者可见。
          touchpoints:
            - Slack
            - Notion
            - HubSpot
            - Zapier
        - label: 协作
          detail: 共享文件夹与跨会议查询把笔记转化为团队知识。
          touchpoints:
            - 共享 Spaces
            - 文件夹级查询
            - 链接来源的答案
        - label: 治理
          detail: 企业控制功能为正式的组织级采购提供路径。
          touchpoints:
            - 管理控制
            - 安全控制
            - 组织级治理
    approximationNotes: 这一有序旅程是根据产品与套餐功能推断出的机制，而非观测到的漏斗数据；没有任何阶段的转化率可用。
    claimRefs:
      - CU001
      - CU006
      - CU007
      - CU008
      - CU015
  - id: FR001
    title: 剩余风险与证据置信度热力图
    type: matrix
    summary: 影响最大的风险往往也缺乏最有力的一手证据，因此法律核验和运营控制测试应成为首要尽调工作。
    data:
      columns:
        - 可能性
        - 影响
        - 缓解措施成熟度
        - 证据置信度
      rows:
        - label: 同意与告知
          values:
            - 中
            - 高
            - 部分
            - 低
        - label: 诉讼指控
          values:
            - Unknown
            - 高
            - 未验证
            - 低
        - label: 无法回放音频
          values:
            - 按设计为高
            - 中高
            - 部分
            - 中
        - label: 说话人归属
          values:
            - 中
            - 中高
            - 部分
            - 中
        - label: 外部供应商依赖
          values:
            - 中
            - 高
            - 部分
            - 中
        - label: 财务模型不透明
          values:
            - 确定性缺口
            - 高
            - 无证据
            - 低
    approximationNotes: 定性类别是分析师评估，而非测量出的频率；“未知”和“确定性缺口”不是数值概率。
    claimRefs:
      - CR005
      - CR010
      - CR013
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 已报告的融资与企业信号先经过指标和竞争缺口筛选，最终得出继续研究的建议。
    data:
      nodes:
        - id: financing
          label: $125M Series C，估值 $1.5B
          detail: 得到交叉印证的融资定价
        - id: product
          label: Spaces、MCP 与 API
          detail: 企业上下文层扩张
        - id: adoption
          label: 已点名的企业用户
          detail: 定性证据，而非已披露收入
        - id: metrics-gap
          label: 没有公开收入或留存
          detail: 没有可支持的估值倍数
        - id: competition
          label: 商品化与现有巨头压力
          detail: 防御性仍未经证明
        - id: decision
          label: 继续研究
          detail: 完成一手尽调后再定价
      edges:
        - from: financing
          to: metrics-gap
        - from: product
          to: adoption
        - from: adoption
          to: metrics-gap
        - from: product
          to: competition
        - from: metrics-gap
          to: decision
        - from: competition
          to: decision
    approximationNotes: 该流程是定性的，没有分配权重、概率或隐含价值。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV007
      - CV014
      - CV015
