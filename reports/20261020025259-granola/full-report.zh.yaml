            body: >-
              指定证据没有当前现金余额、月度烧钱、现金跑道、债务或授信额度条款、营运资金状况、资本开支要求或下一轮融资触发条件。融资和估值不能替代可用现金，历史融资时间线也有意留在公司概览章节。主要财务风险因此是信息不对称：清晰的标价旁边，几乎没有运营模型。独立评测还指出协作深度有限、不支持回放、说话人归属受限，以及一项待决的同意相关投诉；这些因素可能影响转化、支持负担、安全审查时间或支付意愿，但均未量化。财务结论是“模型可读，经济性未验证”：在评估增长或估值前，尽调应取得分群收入、实际定价、留存率、毛利桥接和现金到里程碑计划。
