        blocks:
          - type: paragraph
            body: >-
              现有证据显示其进入市场的方式偏产品驱动：Granola 于 2024 年发布并提供免费会议额度，当前 Basic 层让用户先体验核心工作流，再为持久历史记录和集成付费。一份有赞助但编辑独立的增长手册称，发布团队有
              4 人，手动引导了约 150 名用户；一家信誉较低的第三方目录也提到免费层和广泛的设备覆盖。这些观察与低摩擦获客一致，但要么属于历史情况，要么只是较弱的代理指标。指定来源没有提供
              CAC、付费转化率、销售周期、平均合同金额、客户流失、毛留存、净留存或渠道经济性。因此，现有证据无法区分高效的产品驱动增长、补贴式采用和销售辅助的企业销售模式。
