      - number: '4.2'
        title: 交付成本与利润率路径
        blocks:
          - type: paragraph
            body: >-
              Granola
              称，设备级采集避免了机器人型会议产品产生的实时视频流、云视频存储和虚拟参会者计算成本。这种架构有可能降低一类服务交付成本，公司还称音频在转写后删除，而转写稿和笔记会保留。但这只是发行方解释，并非经审计的成本拆分。模型推理支出、转写服务商定价、支持、安全、文本存储和集成成本均未量化。公司撰写的工作负载示例显示，使用量越高，固定席位费分摊到每次会议的成本越低，但不能证明
              Granola 自身的毛利率。因此，投资人应把成本优势视为待验证机制，而不是软件式贡献利润率的证据。
