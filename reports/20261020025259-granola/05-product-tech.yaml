artifact: product-tech
slug: granola
runDate: "2026-10-20"
company:
  name: Granola
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Granola's product is a bot-free AI notepad that combines device-audio transcription
    with user-written notes, then extends the resulting meeting context into team folders,
    integrations, and MCP-compatible assistants. The workflow is differentiated and
    increasingly broad, but speaker attribution, replayability, consent handling, and
    conflicting public descriptions of the desktop audio path remain material technical
    and diligence constraints.
sections:
  - id: product-workflow
    title: From meeting capture to reusable context
    body: >-
      Granola is delivered as an AI notepad rather than a visible meeting participant.
      The desktop product captures device audio while the user writes short notes, then
      enhances those notes from the transcript after the meeting. That human-guided
      workflow is the core product distinction: the user supplies emphasis and structure,
      while the transcript supplies missed detail. The resulting notes can be edited and
      moved into downstream tools rather than remaining a standalone transcript. This
      design reduces meeting friction for the user, but it also removes the automatic
      consent cue created by a bot joining the participant list.
    claimRefs: [CE001, CE002, CE003, CE014]
    tableRefs: [TE002]
  - id: product-surface
    title: Product surface and maturity
    body: >-
      The public product surface now spans individual capture, shared team knowledge,
      cross-meeting retrieval, workflow automation, and an MCP connector. Folder-level
      queries and shared Spaces move the product beyond single-meeting summarization
      toward a searchable organizational memory layer. Native integrations cover common
      destinations such as Slack, Notion, HubSpot, Attio, and Affinity, while Zapier
      broadens the action surface. MCP provides a developer-facing route into external AI
      tools, although the assigned evidence contains no public repository, package
      telemetry, contributor activity, or independently measured API usage with which to
      assess developer adoption or operational maturity.
    claimRefs: [CE003, CE004, CE005, CE006, CE010]
    tableRefs: [TE001]
  - id: architecture-controls
    title: Architecture, dependencies, and controls
    body: >-
      The observable architecture has six stages: meeting audio capture, transcription,
      transcript-plus-note enhancement, storage and organization, retrieval, and
      downstream actions. Public sources consistently say that raw audio is not retained
      after transcription, which limits the sensitive data footprint but also prevents
      replay-based verification. They do not consistently describe the desktop transport
      path: one Granola article says audio passes directly to transcription providers,
      while another says nothing is streamed to a remote server mid-call and transcription
      occurs on-device. Without a current data-flow diagram, subprocessor map, API
      documentation, or reliability disclosure, infrastructure boundaries and failure
      modes cannot be underwritten from public evidence.
    claimRefs: [CE007, CE008, CE015, CE016]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: reliability-trust
    title: Reliability, trust, and deployment risk
    body: >-
      Granola is available across major conferencing workflows and desktop/mobile
      surfaces, but evidence quality is uneven. Independent reviews identify speaker
      attribution problems in larger or overlapping conversations, and deletion of the
      audio means users cannot return to the original recording to resolve a disputed
      number or quotation. Granola states that it is SOC 2 Type 2 certified and GDPR
      compliant, and that Enterprise customers receive organization-wide model-training
      controls. Those are useful procurement signals, not substitutes for current audit
      artifacts, incident history, uptime and latency data, recovery objectives, or an
      independently verified architecture. Regulated buyers should therefore treat
      consent workflow, transcript accuracy, data routing, and administrative controls as
      pre-deployment diligence items.
    claimRefs: [CE006, CE008, CE009, CE011, CE012, CE013, CE014]
callouts:
  - calloutType: risk
    title: Public data-flow descriptions require reconciliation
    body: >-
      Granola's own materials alternately describe provider-direct audio delivery and no
      remote streaming during desktop transcription. Obtain a current architecture diagram,
      subprocessor list, retention schedule, and plan-specific data-flow attestation before
      approving sensitive deployments.
    claimRefs: [CE015, CE016]
tables:
  - id: TE001
    title: Product module and capability matrix
    columns:
      - Module or capability
      - Primary user
      - Public maturity signal
      - Differentiation
      - Diligence gap
    rows:
      - - AI notepad and Enhance Notes
        - Individual meeting participant
        - Publicly available across desktop and mobile surfaces
        - Human notes guide transcript-based enhancement without a meeting bot
        - No independent benchmark for summary fidelity or error rate
      - - Shared folders and Spaces
        - Teams and knowledge workers
        - Shared collections and folder-level querying are publicly described
        - Converts meetings into a source-linked, queryable context repository
        - No disclosed scale, permission-test coverage, or retrieval-quality benchmark
      - - Integrations and Recipes
        - Operations, product, recruiting, and sales teams
        - Native destinations plus Zapier-based workflows are marketed
        - Moves decisions and actions into systems of record
        - No public delivery SLA, failure-rate data, or complete plan-by-plan entitlement map
      - - MCP connector
        - Developers and AI-tool users
        - Listed by Granola and third-party directories as available
        - Makes meeting context available to MCP-compatible assistants
        - No public usage telemetry, repository activity, version policy, or API reliability data
    notes: >-
      Statuses reflect the assigned public sources as of 2026-10-20; absence of public
      technical telemetry is recorded as a diligence gap, not evidence that a capability is immature.
    claimRefs: [CE002, CE003, CE004, CE005, CE010]
  - id: TE002
    title: Workflow and use-case assessment
    columns:
      - User job
      - Current workflow
      - Granola solution
      - Publicly supportable benefit
      - Limitation
    rows:
      - - Stay engaged while documenting a meeting
        - Choose between listening and writing detailed notes
        - Capture device audio while the user writes short prompts or notes
        - Removes a visible bot and preserves the user's own emphasis
        - Disclosure remains the user's responsibility
      - - Produce a usable post-meeting record
        - Reconstruct decisions and actions from rough notes
        - Enhance user notes with transcript context in an editable document
        - Produces structured notes without requiring a full manual rewrite
        - Public evidence does not quantify accuracy or hallucination rates
      - - Find patterns across prior conversations
        - Search or reread separate notes and transcripts
        - Query shared folders and return source-linked answers
        - Makes multiple meetings searchable as a collection
        - No independent retrieval-quality or maximum-scale benchmark
      - - Turn meeting context into downstream work
        - Copy notes into collaboration, CRM, or project tools
        - Send notes through native integrations, Zapier, or MCP
        - Reduces manual transfer between the meeting record and work systems
        - Connector reliability and delivery guarantees are not publicly disclosed
    notes: >-
      Benefits are qualitative workflow effects described by company and review sources;
      no time-saved, accuracy, or outcome denominator was available in the assigned pool.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE014]
  - id: TE003
    title: Technical dependency and control register
    columns:
      - Component or boundary
      - Publicly described role
      - Dependency
      - Principal risk
    rows:
      - - Device-audio capture
        - Collect meeting audio without joining as a bot
        - Operating-system audio permissions and clean input
        - Consent is not inherently visible and poor audio can impair the transcript
      - - Transcription and raw-audio handling
        - Convert audio to text and delete the raw audio after transcription
        - Local processing and/or third-party transcription providers
        - Official descriptions conflict on whether desktop audio is remotely streamed
      - - Transcript and note store
        - Preserve editable notes, transcripts, folders, and shared context
        - Cloud storage, identity, permissions, and retention controls
        - No retained audio exists for replay-based correction
      - - Retrieval and external actions
        - Query folders and expose context through integrations and MCP
        - Model providers, connectors, destination APIs, and access policy
        - No public uptime, latency, versioning, or connector-failure disclosures
    notes: >-
      This register separates documented product behavior from unresolved infrastructure
      boundaries; the contradictory audio-path descriptions require primary diligence.
    claimRefs: [CE007, CE008, CE009, CE015, CE016]
figures:
  - id: FE001
    title: Meeting-context product architecture
    type: stack
    summary: >-
      A functional stack from bot-free capture through reusable context and downstream action;
      it depicts product stages, not a verified infrastructure topology.
    data:
      layers:
        - label: Meeting surface
          detail: Zoom, Google Meet, Microsoft Teams, Webex, Slack Huddles, and in-person conversations
        - label: Device capture
          detail: Microphone and system-audio capture without a visible meeting participant
        - label: Transcription
          detail: Real-time desktop transcription and temporary mobile audio caching
        - label: Human-guided synthesis
          detail: User notes, transcript context, templates, summaries, and action items
        - label: Team memory
          detail: Notes, transcripts, shared folders, Spaces, and cross-meeting queries
        - label: External action
          detail: Native integrations, Zapier workflows, and MCP-compatible assistants
    approximationNotes: >-
      Functional layers are synthesized from public product descriptions. They do not
      establish physical hosting boundaries, request flows, subprocessors, or service levels.
    claimRefs: [CE001, CE002, CE004, CE005, CE006]
