    title: Operational, quality, and security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Participant is not given effective notice before device-audio capture
        - Medium
        - High
        - Product guidance and notice features described
        - User behavior can bypass a policy-level control
        - Notice enforcement and audit logs are not evidenced
      - - Speaker attribution is wrong in a multi-person meeting
        - Medium
        - Medium to high
        - Manual or contextual identification
        - Decisions or commitments may be assigned to the wrong person
        - Benchmark error rates by platform, accent, room, and speaker count
      - - Deleted audio prevents later verification of disputed wording
        - High by design
        - Medium to high
        - Transcript and notes retained
        - No replayable audio artifact after transcription
        - Test transcript correction, evidentiary acceptance, and exception workflows
      - - Endpoint, connectivity, or provider failure interrupts capture or enhancement
        - Medium
        - Medium
        - Broad meeting-platform compatibility claimed
        - Device and external service chain remains a shared dependency
        - Obtain uptime, error-rate, queueing, retry, and fallback evidence
    notes: >-
      Likelihood and severity are qualitative analytical rankings derived from
      documented product architecture; no incident-frequency denominator was
      available.
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR006
      - CR013
      - CR014
      - CR016
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Counterparty or layer
      - Role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation and residual exposure
    rows:
      - - Transcription and AI processing
        - OpenAI, Anthropic, and other processing providers named by Granola
        - Transcription and note enhancement
        - Spend and workload shares undisclosed
        - Price, policy, quality, capacity, or access changes
        - High
        - Contractual no-training terms are claimed; portability and fallback remain untested
      - - Cloud hosting
        - AWS infrastructure named by Granola
        - Stores retained text and supports the service
        - Region and architecture concentration not quantified
        - Regional outage, configuration error, or access-control failure
        - High
        - Encryption is claimed; resilience design and recovery tests remain a gap
      - - Endpoint audio path
        - macOS, Windows, iOS, and device permissions
        - Captures meeting audio without a visible bot
        - Platform mix not disclosed
        - OS policy or permission change breaks capture
        - Medium to high
        - Cross-platform availability helps, but tested compatibility evidence is needed
      - - Workflow integrations
        - Zapier, Slack, Notion, HubSpot, Affinity, and MCP-compatible tools
        - Moves meeting context into downstream systems
        - Integration usage and switching cost not disclosed
        - API changes or permission errors strand workflows or expose data
        - Medium
        - Minimize privileges, monitor exports, and test manual recovery paths
    notes: >-
      Counterparties and roles are company-reported; concentration, contract
      duration, spend, service levels, and tested fallback coverage are not public
      in the assigned evidence.
    claimRefs:
