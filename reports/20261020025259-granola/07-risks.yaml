company:
  name: Granola
chapter:
  number: 7
  title: Risks
  summary: >-
    Granola's clearest residual risks are consent and privacy execution, loss of
    replayable audio evidence, multi-speaker attribution, and dependence on
    device audio plus third-party cloud and AI providers. Company-published
    controls are substantive, but the assigned evidence contains no primary
    court, regulator, financial, concentration, or incident-completeness record,
    so the investment case remains contingent on targeted diligence.
sections:
  - id: evidence-weighted-ranking
    title: Evidence-weighted risk ranking
    body: >-
      The highest-priority risk is consent and data-governance execution because
      Granola captures device audio without joining as a visible meeting
      participant. Granola advises users to disclose transcription and describes
      notice features, while a competitor-published comparison alleges a 2026
      federal class action concerning undisclosed interception and model
      training. That allegation is not independently verified by a court record
      in the assigned pool, so it is a diligence trigger rather than an
      adjudicated fact. The next tier combines auditability and accuracy:
      immediate audio deletion reduces retained sensitive data but removes the
      replay artifact, while the company's own documentation says automatic
      speaker identification is unavailable in the bot-free workflow. These
      trade-offs matter most in regulated, disputed, or multi-party meetings.
    claimRefs:
      - CR002
      - CR004
      - CR005
      - CR006
      - CR011
      - CR013
      - CR014
    tableRefs:
      - TR001
    figureRefs:
      - FR001
  - id: operational-and-security-controls
    title: Operational and security controls
    body: >-
      Granola states that audio is deleted after transcription, that notes and
      transcripts remain, and that its service is SOC 2 Type 2 certified and
      GDPR compliant. Those claims indicate mitigation maturity, but all
      supporting assurance evidence in this pool is company-issued rather than
      an audit report or regulator record. The retained text also identifies
      external transcription or AI providers and AWS-hosted infrastructure,
      making vendor availability, contract terms, model behavior, data routing,
      and platform permissions part of the operating boundary. Device-level
      capture broadens compatibility across meeting platforms, but it also
      concentrates capture reliability in the endpoint application, operating
      system audio path, and connectivity to processing services. Diligence
      should test these controls rather than equate certification claims with
      complete incident prevention.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR007
      - CR008
      - CR016
    tableRefs:
      - TR002
  - id: partner-and-commercial-dependencies
    title: Partner and commercial dependencies
    body: >-
      The service relies on a chain of endpoint capture, cloud infrastructure,
      transcription and AI providers, and optional workflow integrations. A
      failure or policy change at any layer could degrade capture, enhancement,
      search, or downstream automation even when Granola's own application is
      available. Competitor-authored material argues that enterprise buyers may
      require stronger governance, compliance, and integration depth; because
      those publishers sell alternatives, their comparisons are adverse signals,
      not independent benchmarks. The $14 per-user Business price and unlimited
      history are company claims, not evidence of gross margin or durable unit
      economics. Two independent recipe publishers also demonstrate that
      "granola" is a generic food term, creating measurable search-disambiguation
      noise, but this is a modest brand-discovery issue rather than proof of
      customer-acquisition impairment.
    claimRefs:
      - CR008
      - CR009
      - CR010
      - CR012
      - CR016
    tableRefs:
      - TR003
  - id: financial-model-and-kill-criteria
    title: Financial model gaps and thesis-break criteria
    body: >-
      Public evidence assigned to this chapter does not establish burn, runway,
      gross margin, customer concentration, retention, incident completeness, or
      the economics of external model and transcription usage. These are gaps,
      not zero values and not evidence that adverse events are absent. Before an
      investment decision, management should provide monthly cash burn and
      runway, cohort retention and concentration, vendor spend by workload,
      security incident and legal registers, the underlying SOC 2 report, and a
      jurisdiction-specific consent-control walkthrough. Thesis-break triggers
      should include an inability to enforce participant notice, a material
      adverse legal finding, repeated capture or attribution failures in
      regulated workflows, loss of critical provider access without a tested
      fallback, or runway falling below the investor's required financing
      buffer. Until those tests clear, mitigations remain partly asserted rather
      than independently demonstrated.
    claimRefs:
      - CR003
      - CR005
      - CR008
      - CR013
      - CR014
      - CR015
      - CR016
