chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Granola competes in AI meeting documentation, but its most defensible serviceable
    wedge is narrower: professionals and teams that value bot-free capture,
    human-guided notes, and searchable meeting context. The assigned evidence
    supports buyer segmentation and pricing-based spend lenses, not a defensible
    category TAM, SAM, or SOM.
sections:
  - id: "market-boundary"
    title: "Market boundary and substitutes"
    body: >-
      The relevant market is paid software that captures meeting audio, converts
      it into transcripts or structured notes, and makes the resulting context
      searchable or available to downstream workflows. Granola's narrower
      category is the AI notepad: device-audio capture combined with
      human-guided enhancement rather than a visible meeting bot or a generic
      automated summary. Included spend is therefore meeting-note software,
      transcript processing, searchable history, and workflow integrations.
      Video-conferencing licenses, broad knowledge-management suites, human
      transcription, and sales-conversation intelligence bought primarily for
      coaching are adjacencies rather than the core boundary. The status quo is
      manual notes, platform-native transcripts, or doing nothing; the evidence
      suggests free access and low setup friction are important because
      non-consumption remains a direct alternative.
    claimRefs:
      - "CM001"
      - "CM003"
      - "CM004"
      - "CM016"
    tableRefs:
      - "TM001"
  - id: "evidence-constrained-sizing"
    title: "Evidence-constrained sizing"
    body: >-
      The source pool does not contain an independent category-revenue estimate,
      a count of eligible knowledge workers, a measured conversion rate, or
      Granola customer and seat counts. A top-down TAM would therefore create
      false precision. The supportable sizing lens is commercial rather than
      market-wide: a free entry tier, a $14 per-user monthly Business tier, and
      an Enterprise tier starting at $35 per user monthly. Granola's own
      22-seat example produces $3,696 of annual Business-plan spend and compares
      it with $5,280 for a named-but-unidentified bot-based benchmark. Those
      figures describe account economics, not revenue, ARR, market share, or
      cash available. Any investment model should keep TAM, SAM, and SOM blank
      until an independent category base and Granola-specific penetration
      denominator are obtained.
    claimRefs:
      - "CM006"
      - "CM007"
      - "CM008"
      - "CM013"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyers-and-adoption"
    title: "Buyers, users, payers, and adoption paths"
    body: >-
      The strongest initial users are meeting-heavy founders, executives,
      investors, consultants, recruiters, and product researchers who personally
      feel the documentation burden. Individual users can adopt through the free
      tier, while a functional leader or operations owner becomes the payer when
      unlimited history, shared context, integrations, billing controls, or
      compliance features matter. Product teams buy for research synthesis;
      revenue teams may instead prioritize CRM automation and call analytics,
      where bot-based competitors can fit better. Regulated workflows create a
      separate procurement path involving security, privacy, and legal owners.
      The evidence also suggests generic meeting tools can lose regulated buyers
      to vertical products that automate industry-specific workflows, limiting
      the share available to a horizontal product.
    claimRefs:
      - "CM002"
      - "CM005"
      - "CM009"
      - "CM014"
    tableRefs:
      - "TM003"
  - id: "drivers-constraints-and-valuation-relevance"
    title: "Drivers, constraints, and valuation relevance"
    body: >-
      Adoption is pulled by back-to-back meetings, post-call synthesis work, and
      the desire to preserve institutional memory across conversations. It is
      constrained by transcription quality, speaker attribution, inability to
      replay source audio, participant consent, security review, and the need
      for users to change established note-taking habits. Independent reviews
      are materially less expansive than company-authored guides: they flag
      weaker multi-speaker performance, limited audio verification, and a
      pending consent allegation, while one compiled comparison reports broader
      privacy resistance without exposing the underlying study denominator.
      These constraints make adoption timing workflow-specific and weaken any
      valuation case built on all knowledge workers. The more defensible case
      depends on paid conversion and retention inside high-frequency,
      trust-sensitive cohorts, neither of which is quantified in the assigned
      evidence.
    claimRefs:
      - "CM010"
      - "CM011"
      - "CM012"
      - "CM015"
