schemaVersion: "report-v2"
artifact: valuation
slug: granola
runDate: 2026-10-20
company:
  name: Granola
chapter:
  number: 8
  title: Valuation
  summary: >-
    Granola's March 2026 Series C establishes a well-corroborated $1.5 billion
    financing mark, but retained public evidence does not disclose revenue,
    retention, or margin data needed to support that price fundamentally. The
    resulting recommendation is research-more: product and enterprise signals
    merit continued diligence, while entry discipline should remain strict.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The public-evidence call is research-more, with medium confidence, high
      risk, and a stretched valuation stance. The financing facts themselves
      are unusually clear: TechCrunch and two additional publications report a
      $125 million Series C at a $1.5 billion valuation, up from $250 million in
      the prior round, while TechCrunch and Creative Collaboration put total
      funding at $192 million. What is not public is more important to an entry
      decision. The retained valuation-focused source set provides no absolute
      revenue, ARR, retention, or margin figure, so no revenue multiple,
      forward-growth multiple, or evidence-based return target can be
      calculated. The current mark should therefore be treated as a financing
      observation, not as demonstrated fair value. An invest decision requires
      primary diligence on commercial scale, retention, economics, capital
      structure, and round terms rather than a discount inferred from incomplete
      public data.
    claimRefs: [CV001, CV002, CV003, CV004, CV012, CV015, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The thesis is that Granola can expand from a differentiated bot-free
      meeting notepad into a permissioned context layer for teams and AI
      workflows. The retained evidence describes Spaces, personal and
      enterprise APIs, MCP connectivity, and named enterprise users, while the
      company publishes a $14 per-user monthly Business price and claims no
      minute cap. Those signals support product ambition and a plausible
      monetization path, but they do not establish contract value, paid-seat
      volume, retention, or revenue quality. The anti-thesis is equally direct:
      meeting notes are becoming commoditized, competitors and productivity
      incumbents have broader distribution, and the sixfold valuation reset
      happened without public operating metrics. The decision should change
      only when customer-level and cohort evidence shows that the context-layer
      expansion produces durable, high-margin enterprise revenue rather than
      feature-level differentiation.
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV010, CV013, CV014]
    tableRefs: [TV002]
  - id: scenarios-and-comparable-context
    title: Scenarios and comparable context
    body: >-
      A conventional bull/base/bear valuation range would create false
      precision because the denominator is missing. The retained sources offer
      two Granola financing reference points, $250 million and $1.5 billion,
      but neither is a modeled fair-value bound. They also report Fireflies at
      a $1 billion valuation and more than 16 million users, yet provide no
      comparable revenue, growth, retention, margin, round-date, or preference
      data; that observation cannot support a multiple comparison. Accordingly,
      the scenarios below use explicit operating evidence tests rather than
      invented values or probabilities. The bull case requires verified
      enterprise economics and defensibility, the base case requires evidence
      that the team-context product converts adoption into durable revenue, and
      the bear case is triggered by commoditization, incumbent distribution, or
      weak conversion. Each case remains unpriced until consistent primary
      metrics and security terms are available.
    claimRefs: [CV001, CV002, CV004, CV006, CV007, CV011, CV012, CV014]
    tableRefs: [TV003]
  - id: exit-readiness-and-final-diligence
    title: Exit readiness and final diligence
    body: >-
      Public evidence does not support a target return, hold period, or exit
      value. Granola is scaling product scope and has named enterprise adoption,
      but the source set does not disclose audited revenue, cohort retention,
      gross margin, burn, runway, cap-table preferences, debt, secondary
      liquidity, governance rights, or an exit timetable. Final diligence
      should obtain monthly ARR and recognized revenue by plan, gross and net
      retention by cohort, gross margin including model and transcription
      costs, customer concentration, cash and burn, the Series C term sheet,
      liquidation preferences, option-pool dilution, and board rights. The
      thesis breaks if enterprise conversion or retention is weak, context-layer
      usage fails to monetize, incumbents erase distribution advantages, or
      round terms make otherwise acceptable enterprise value unattractive to
      new common-equity investors. Until those tests clear, tracking progress
      is preferable to assigning a speculative exit outcome.
    claimRefs: [CV004, CV005, CV006, CV007, CV012, CV013, CV014, CV016]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Decision implication
    rows:
      - [Recommendation, Research more, "Do not make an entry decision from the public source set alone."]
      - [Confidence, Medium, "Financing is corroborated; fundamental price support is not."]
      - [Risk rating, High, "Require primary commercial, cap-table, and security diligence before pricing."]
      - [Valuation stance, Stretched, "$1.5B is a financing mark without a disclosed revenue or retention denominator."]
      - [Target return / exit, Not supportable, "Do not invent a return target, hold period, or exit value."]
    notes: >-
      Assessments distinguish reported financing marks from unsupported
      fundamental valuation; unavailable operating and return quantities remain
      explicit gaps.
    claimRefs: [CV001, CV002, CV004, CV007, CV012, CV015, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - [Thesis, "Spaces and APIs extend Granola from notes toward team context infrastructure.", "Verified enterprise API adoption and paid expansion by cohort."]
      - [Thesis, "Named enterprise users provide qualitative product-market evidence.", "Customer references that disclose deployment size, renewal, and measurable outcomes."]
      - [Thesis, "$14/user/month Business pricing offers a visible monetization mechanism.", "Revenue mix, realized price, discounting, and gross-margin evidence."]
      - [Anti-thesis, "Meeting notes are becoming a commodity.", "Durable context-layer usage and retention that simpler note features cannot match."]
      - [Anti-thesis, "Microsoft, Google, and other incumbents have stronger distribution.", "Evidence Granola wins and expands in accounts already using incumbent suites."]
      - [Anti-thesis, "The valuation rose sixfold without public revenue or retention metrics.", "Primary operating data supporting growth, durability, and efficient economics."]
    notes: >-
      Company-issued pricing and product comparisons are treated as promotional
      evidence, not as independent competitive benchmarks.
    claimRefs: [CV002, CV004, CV005, CV006, CV007, CV008, CV010, CV013, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - "Verified enterprise expansion, strong cohort retention, attractive gross margin, and defensible context-layer usage."
        - "No public-evidence range; the $1.5B mark becomes diligence-supportable only if undisclosed operating data justify it."
        - "No numeric probability is supportable; signal improves with audited or board-grade cohort data."
        - "Enterprise expansion or retention misses disclosed diligence thresholds."
      - - Base
        - "Product breadth and named adoption convert into durable revenue, but category competition limits pricing power."
        - "Use $250M and $1.5B only as historical financing observations; no fair-value range or target return is derivable."
        - "No numeric probability is supportable; signal depends on revenue quality, margin, and renewal evidence."
        - "Context features do not improve monetization or customer durability."
      - - Bear
        - "Meeting-note features commoditize and incumbent distribution constrains enterprise conversion."
        - "No evidence-based valuation floor is available because revenue, burn, preferences, and liquidity terms are undisclosed."
        - "No numeric probability is supportable; signal worsens with weak conversion, churn, or punitive preferences."
        - "Weak enterprise conversion, high churn, incumbent bundling, or adverse round terms."
    notes: >-
      Scenario values and probabilities are intentionally unavailable; the
      retained sources do not disclose the operating or capital-structure inputs
      required for a defensible numeric model.
    claimRefs: [CV001, CV002, CV004, CV006, CV007, CV012, CV014, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Reported financing and enterprise signals are filtered through metric and
      competition gaps before reaching a research-more recommendation.
    data:
      nodes:
        - id: financing
          label: "$125M Series C at $1.5B"
          detail: "Corroborated financing mark"
        - id: product
          label: "Spaces, MCP, and APIs"
          detail: "Enterprise context-layer expansion"
        - id: adoption
          label: "Named enterprise users"
          detail: "Qualitative proof, not disclosed revenue"
        - id: metrics-gap
          label: "No public revenue or retention"
          detail: "No supportable valuation multiple"
        - id: competition
          label: "Commodity and incumbent pressure"
          detail: "Defensibility remains unproven"
        - id: decision
          label: "Research more"
          detail: "Price only after primary diligence"
      edges:
        - from: financing
          to: metrics-gap
        - from: product
          to: adoption
        - from: adoption
          to: metrics-gap
        - from: product
          to: competition
        - from: metrics-gap
          to: decision
        - from: competition
          to: decision
    approximationNotes: >-
      The flow is qualitative and does not assign weights, probabilities, or
      implied values.
    claimRefs: [CV001, CV004, CV005, CV006, CV007, CV014, CV015]
callouts:
  - calloutType: recommendation
    title: Price discipline
    body: >-
      Treat $1.5 billion as the latest financing mark, not as demonstrated fair
      value; require revenue quality, retention, margin, and security-term
      evidence before underwriting an entry price.
    claimRefs: [CV001, CV004, CV012, CV015]
  - calloutType: risk
    title: False precision is the immediate valuation risk
    body: >-
      Revenue, retention, margin, burn, and preference data are unavailable in
      the retained public evidence, so a numeric return or exit case would be an
      unsupported invention.
    claimRefs: [CV004, CV012, CV016]
