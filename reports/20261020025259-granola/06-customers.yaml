figures:
  - id: FU001
    title: Product-led customer journey and expansion surfaces
    type: journey-map
    summary: >-
      Granola can progress from individual trial to workflow integration and governed team use,
      but public sources do not quantify conversion, retention, or expansion at any stage.
    data:
      items:
        - label: Discover
          detail: "Meeting-heavy professional encounters bot-free note-taking."
          touchpoints: ["Free plan", "Mac, Windows, or mobile app", "Individual meeting workflow"]
        - label: Validate
          detail: "User compares enhanced notes with the conversation and tests fit."
          touchpoints: ["AI-enhanced notes", "Transcript context", "Custom templates"]
        - label: Habit
          detail: "Repeated meetings create personal searchable history."
          touchpoints: ["Unlimited history on Business", "People and Companies context"]
        - label: Distribute
          detail: "Notes move into team systems and become visible to collaborators."
          touchpoints: ["Slack", "Notion", "HubSpot", "Zapier"]
        - label: Collaborate
          detail: "Shared folders and cross-meeting queries turn notes into team knowledge."
          touchpoints: ["Shared Spaces", "Folder-level queries", "Source-linked answers"]
        - label: Govern
          detail: "Enterprise controls create a route to formal organization-wide procurement."
          touchpoints: ["Admin controls", "Security controls", "Org-wide governance"]
    approximationNotes: "The ordered journey is an inferred mechanism from product and plan features, not observed funnel data; no stage conversion rates are available."
    claimRefs: [CU001, CU006, CU007, CU008, CU015]
callouts:
  - calloutType: risk
    title: Retention and concentration are unobservable
    body: >-
      Public evidence supports segment fit and several named references, but it does not disclose
      NRR, GRR, churn, renewal, contract length, active seats, customer count, or top-customer
      exposure. Investment underwriting should not treat logos or selected testimonials as proof
      of durable, diversified revenue.
    claimRefs: [CU012, CU013, CU014, CU016]
