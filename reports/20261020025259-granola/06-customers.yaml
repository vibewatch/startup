      - ["Cursor", "Technology company", "Adoption identified by Granola", "Not disclosed", "No quantified outcome disclosed", "No customer-side confirmation, seats, tier, or duration"]
      - ["Mistral AI", "AI company", "Adoption identified by Granola", "Not disclosed", "No quantified outcome disclosed", "No customer-side confirmation, seats, tier, or duration"]
      - ["Brex", "Fintech / technology company", "Meeting summaries and written-culture support", "Not disclosed", "Founder says summaries were precise and reliable", "Company-published testimonial with no measured baseline or rollout scope"]
