evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-scale
    missingEvidence: >-
      Current revenue, ARR, gross margin, retention, burn, runway, paid seats, total customer count, and headcount with
      periods and denominators.
    whyItMatters: >-
      These measures are required to judge operating scale, capital efficiency, and whether the reported valuation is
      supported by commercial traction.
    diligencePath: >-
      Obtain management accounts, board KPI packs, billing exports, cohort retention schedules, payroll records, and
      cash forecasts, then reconcile each metric to a defined period and customer segment.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      A current executive and board roster, founder responsibilities, ownership and voting rights, investor board
      rights, succession coverage, and material leadership changes.
    whyItMatters: >-
      Without this record, diligence cannot assess functional gaps, key-person dependence, control, or governance
      protections.
    diligencePath: >-
      Request the cap table, charter and investor-rights documents, board minutes, organization chart, executive
      biographies, and succession plan.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      Independent category revenue, eligible knowledge-worker or meeting-heavy seat counts, Granola paid seats and
      customers, conversion, retention, geographic mix, and segment-level contract values.
    whyItMatters: >-
      Without both a market denominator and company penetration data, pricing examples cannot support TAM, SAM, SOM,
      market share, or valuation-scale adoption assumptions.
    diligencePath: >-
      Obtain an independent category study with methodology and denominator, then reconcile it with management-provided
      paid-seat, customer, cohort retention, geographic, and contract-value data.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitor-scale
    missingEvidence: >-
      Current competitor revenue, funding, customer counts, enterprise mix, retention, and product-roadmap evidence on a
      comparable basis.
    whyItMatters: >-
      Product comparisons cannot establish relative distribution strength or the resources available for bundling,
      pricing pressure, and fast imitation.
    diligencePath: >-
      Obtain first-party investor materials, current company disclosures, and enterprise reference calls for each
      shortlisted competitor.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: trust-and-procurement
    missingEvidence: >-
      A current, independent comparison of consent controls, security certifications, data residency, model-training
      terms, incident history, and regulated-enterprise procurement outcomes across named competitors.
    whyItMatters: >-
      Trust posture can determine enterprise eligibility and may outweigh workflow or price advantages in sensitive
      meeting environments.
    diligencePath: >-
      Review each vendor's current security pack, data-processing agreement, subprocessor list, incident disclosures,
      and customer procurement references.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Recognized revenue, ARR, paid-seat mix, realized pricing, revenue recognition policy, and gross-margin bridge.
    whyItMatters: Without scale, mix, and margin, list pricing cannot support a revenue-quality or profitability judgment.
    diligencePath: >-
      Obtain monthly management accounts, billing exports, cohort revenue, and a cost-of-revenue bridge for the last 24
      months.
    relatedQuestionRefs:
      - QI004
      - QI005
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, sales cycle, realized ACV, conversion, churn, GRR, NRR, and channel economics by segment.
    whyItMatters: The freemium and integration-led packaging does not prove efficient conversion, durable retention, or expansion.
    diligencePath: Review CRM, billing, and product cohorts by acquisition channel, plan, company size, and signup month.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Unrestricted cash, monthly burn, runway, debt, covenants, committed spend, and the next financing milestone.
    whyItMatters: Funding raised and valuation do not establish cash available or the ability to reach the next operating milestone.
    diligencePath: >-
      Obtain bank statements, a 24-month cash forecast, debt and lease schedules, cloud commitments, and board-approved
      financing plans.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Realized discounts, annual terms, minimum seats, overages, refunds, and Enterprise implementation or support fees.
    whyItMatters: Public list prices may overstate ARPU and conceal services burden or usage-linked cost exposure.
    diligencePath: Sample signed Business and Enterprise contracts and reconcile invoice prices to the public price card.
    relatedQuestionRefs:
      - QI001
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: conflicting-data
    severity: material
    topic: desktop-data-flow
    missingEvidence: >-
      A current architecture and data-flow diagram reconciling on-device transcription with the stated direct delivery
      of audio to transcription providers.
    whyItMatters: >-
      Network transport, subprocessor exposure, residency, and failure modes differ materially between local and
      provider-hosted transcription.
    diligencePath: >-
      Obtain the current security architecture, subprocessor list, plan-specific data flows, retention schedule, and a
      security-team walkthrough.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: >-
      Public uptime, latency, transcript-quality, retrieval-quality, connector-failure, recovery-objective, and roadmap
      evidence.
    whyItMatters: >-
      The product is embedded in live meetings and downstream workflows, so silent capture or delivery failures can
      create incomplete records and missed actions.
    diligencePath: >-
      Request twelve months of service-level reports, incident history, model-quality evaluations, connector delivery
      metrics, and the product roadmap.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE001
      - TE002
      - TE003
