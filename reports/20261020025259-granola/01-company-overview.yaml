artifact: company-overview
slug: granola
runDate: 2026-10-20
company:
  name: Granola
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Granola is a London-founded AI meeting-notes company whose bot-free,
    human-guided product expanded from a 2024 launch to enterprise context
    tooling and a reported $125 million Series C at a $1.5 billion valuation in
    March 2026. The financing trajectory is visible, but current headquarters,
    revenue, ARR, headcount, total customer count, board composition, and
    financing terms beyond announced round sizes remain material diligence gaps.
sections:
  - id: identity-and-product
    title: Identity and product model
    body: >-
      Granola presents itself as an AI notepad rather than an unattended meeting
      bot: it captures device audio, combines a transcript with the user's own
      notes, and turns that material into editable summaries and searchable
      meeting memory. Its official pages say the product works across major
      meeting applications and in-person conversations while keeping notes
      private by default. Independent reviews broadly confirm the no-bot,
      editable-note workflow, while stressing that transcription and note
      generation still depend on cloud providers. Reworked dates the company's
      London founding to 2023 and its product launch to 2024; the allocated
      evidence does not establish whether London remains the current legal or
      operating headquarters.
    claimRefs: [CO001, CO002, CO003, CO005, CO015]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Reworked identifies Chris Pedregal and Sam Stephenson as Granola's
      co-founders and describes Pedregal as chief executive; an independent
      long-form user review also identifies Pedregal as CEO. That supports the
      founder and chief-executive baseline, but not a complete current leadership
      roster. The assigned evidence does not identify a CFO, general counsel,
      compliance leader, board members, observer rights, founder ownership, or
      voting-control arrangements, and it does not establish Stephenson's current
      operating title. The concentration of externally visible leadership around
      Pedregal therefore creates a diligence question rather than proof of
      problematic key-person dependence.
    claimRefs: [CO003, CO004]
    tableRefs: [TO002]
  - id: financing-and-scale
    title: Financing and scale signals
    body: >-
      The clearest scale marker is financing. Reworked reports a $43 million
      Series B in May 2025 and a $125 million Series C in March 2026 at a $1.5
      billion valuation, led by Index Ventures with participation from Kleiner
      Perkins and existing investors. A second publication reports $192 million
      of total funding, but the source set does not disclose a cap table,
      dilution, liquidation preferences, secondary sales, debt, or cash
      remaining. Reworked also relays a company-reported 10% weekly user-growth
      rate and names Vanta, Gusto, Asana, and Mistral AI as enterprise customers.
      These are useful adoption signals, not substitutes for revenue, retention,
      paid-seat, or customer-count evidence.
    claimRefs: [CO008, CO010, CO011, CO012, CO013]
    tableRefs: [TO003]
  - id: milestones-and-diligence-posture
    title: Milestones and diligence posture
    body: >-
      The available chronology shows rapid product and capital formation:
      launch in 2024, iOS in April 2025, a Series B the following month, Windows
      in June 2025, SOC 2 Type 2 certification in July 2025, MCP connectivity in
      February 2026, and the Series C in March 2026. The timeline also records a
      current independent review's caution that Granola requires cloud
      processing and is a weaker fit for buyers needing audio playback, imported
      files, unattended capture, or organization-wide live transcripts.
      Business pricing is publicly described, but no allocated source supplies
      revenue, ARR, margins, headcount, total customers, or runway. Those missing
      denominators prevent a reliable assessment of operating scale relative to
      the reported valuation.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010, CO014, CO015, CO016]
    figureRefs: [FO001]
