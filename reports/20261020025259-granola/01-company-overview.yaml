callouts:
  - calloutType: strength
    title: Financing and product expansion are mutually reinforcing signals
    body: >-
      The Series C followed releases across iOS, Windows, and MCP and was
      accompanied by reported enterprise adoption, indicating that investors
      underwrote a broader context platform rather than only a meeting-summary
      utility.
    claimRefs: [CO006, CO007, CO009, CO010, CO013]
  - calloutType: risk
    title: Valuation lacks operating denominators
    body: >-
      The reported $1.5 billion valuation cannot be benchmarked against revenue,
      ARR, margin, retention, cash burn, or total customers from the assigned
      evidence; financing momentum should not be treated as proof of operating
      efficiency.
    claimRefs: [CO010, CO011]
