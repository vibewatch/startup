  - id: capability-and-packaging-comparison
    title: Capability and Packaging Comparison
    body: >-
      Capability breadth is converging, but packaging remains divergent. Runway markets creative, developer, and robotics
      surfaces; Luma sells agents, team workspaces, and APIs; PixVerse exposes API, CLI, canvas, and marketing hubs;
      Pika emphasizes accessible effects, agentic content creation, and mobile-social remix; Kling combines video, image,
      sound, effects, and native 4K; Jimeng emphasizes Chinese prompt fluency and first-last-frame control; and Hailuo's
      associated MiniMax stack combines a consumer app with enterprise APIs. In practice, this means buyers are choosing
      between product philosophies, not only model outputs. Professional teams may favor Runway or Luma because workflow
      continuity, export formats, shared credits, or API controls matter more than novelty. Consumer creators may prefer
      Pika, Jimeng, or Hailuo because the interface and viral loop are easier. API-first builders may prefer Vidu,
      PixVerse, MiniMax, or Luma. Artificial Analysis and official documentation also imply that the frontier now spans
      quality, speed, and price simultaneously, which compresses any moat based solely on claiming "we have video AI."
      Shengshu's challenge is that most core features now exist somewhere else; its opportunity is to win specific user
      cohorts with China-native product fit and high-quality output.
    claimRefs:
