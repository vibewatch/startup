  - id: direct-peer-profiles-and-war-chest-tiers
    title: Direct Peer Profiles and War-Chest Tiers
    body: >-
      The most important direct peers do not all compete on equal footing. Runway is the best-capitalized specialist in
      the set reviewed here, with a reported $315 million Series E at a $5.3 billion valuation in February 2026, a
      60-million-plus creative user base claim, and an expanding world-model narrative that extends beyond media into
      robotics. MiniMax, the company behind Hailuo, appears even broader as a multimodal platform: Sacra describes it as
      a $4 billion-valued company with roughly $1.15 billion total funding and strong enterprise API traction, of which
      Hailuo is only one surface. Luma also looks well-capitalized and increasingly enterprise-oriented, with Owler
      reporting $1.1 billion total funding and a $900 million November 2025 round, while official pages present Luma as
      a professional creative-agent workflow rather than a novelty toy. Pika is much smaller financially, with Sacra
      reporting $135 million raised and a $470 million valuation, but it compensates with accessible packaging and Adobe
      Firefly distribution. Kling, Jimeng, and Wan disclose less investor detail in the sources reviewed, but their
      product posture suggests strong China ecosystem adjacency. Shengshu therefore competes against three different
      capital tiers: multibillion-dollar specialists, broad Chinese multimodal platforms, and lighter consumer-creator
      challengers.
    claimRefs:
