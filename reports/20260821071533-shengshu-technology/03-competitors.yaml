callouts:
  - calloutType: risk
    title: Multi-homing is a real structural threat in creator tiers
    body: >-
      Most creator-facing competitors use prompt-centric interfaces and credit-based plans. That lowers the friction of
      testing several platforms at once and makes it harder for any one vendor, including Shengshu, to defend price or
      retention without deeper workflow attachment.
    claimRefs:
      - CP024
      - CP025
      - CP033
  - calloutType: insight
    title: The most dangerous rivals are not all Western frontier labs
    body: >-
      Hailuo, Kling, and Jimeng show that Shengshu's hardest competitive problems are local as well as global. China
      incumbents and multimodal platforms can combine culturally local UX with large consumer ecosystems, while global
      specialists win on professional workflow depth.
    claimRefs:
      - CP003
      - CP014
      - CP026
      - CP031
  - calloutType: risk
    title: Sora is still a benchmark, but no longer the clearest commercial rival
    body: >-
      OpenAI's shutdown notice weakens Sora as an active go-to-market comparison, but not as an expectation setter.
      Buyers now expect frontier-quality results from several vendors, which means Shengshu cannot rely on "China's Sora"
      positioning alone.
    claimRefs:
      - CP022
      - CP032
