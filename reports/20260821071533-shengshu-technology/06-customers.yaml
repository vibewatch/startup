  - id: retention-durability-and-repeat-usage-gaps
    title: Retention, Durability, and Repeat-Usage Gaps
    body: >-
      Durability is the biggest unresolved customer question. Public sources provide plenty of scale signals and some named
      partner evidence, but almost no direct retention evidence. There is no disclosed NRR, GRR, logo churn, contract
      length, renewal rate, cohort curve, or satisfaction metric. The best public repeat-usage proxy is commercial mix:
      more than 70% of generated output is said to come from commercial projects, which would imply repeat usefulness if it
      is measured consistently. Support and billing surfaces also suggest the company has the operational scaffolding for
      repeat customers, not just one-time novelty traffic. But reliability concerns from Notebookcheck's hands-on review
      cut the other way: if reference fidelity, prompt obedience, and scene consistency still fail too often, customer
      usage may be broad but shallow. The right diligence posture is to treat retention as a major open question with only
      rough estimated proxies—not as a solved positive.
    claimRefs:
      - CU015
      - CU016
      - CU017
      - CU021
      - CU025
      - CU032
      - CU034
    tableRefs:
      - TU004
    figureRefs:
      - FU004
  - id: expansion-loops-and-concentration-risk
    title: Expansion Loops and Concentration Risk
    body: >-
      Shengshu appears to have several land-and-expand paths, but the company has not disclosed enough to judge their
      economics. A creator may start in the self-serve Vidu interface, graduate to paid credits or premium features, then
      move into more structured workflows. A developer or small platform can start with the API, deepen usage through
      Vidu's broader model family, and eventually deploy at scale in a marketplace or app. Brand and commerce teams can be
      pulled in through Vidu Agent, lip-sync, or ready-made product-video workflows. These loops are strategically
      attractive because they allow the company to expand from consumer or creator usage into higher-value B2B contexts.
      The main counterweight is concentration opacity. Public sources do not disclose top-customer share, enterprise ACV,
      partner-revenue concentration, or whether key ecosystem channels can switch among competing video models with limited
      friction. The business likely has lower geographic concentration than many startups, but partner-platform dependence
      could still become a meaningful commercial risk.
    claimRefs:
      - CU018
      - CU019
      - CU020
      - CU021
      - CU022
      - CU023
      - CU028
      - CU033
      - CU036
      - CU037
      - CU038
    tableRefs:
      - TU005
  - id: customer-verdict-and-diligence-priorities
    title: Customer Verdict and Diligence Priorities
    body: >-
      The customer verdict is favorable on breadth and channel creativity, but incomplete on durability and quality of
      spend. Shengshu likely has a genuinely large creator top of funnel and increasingly credible partner-platform
      distribution, which are the two most important public positives. The best proof of real adoption is that outside
      platforms like OpenArt and each::labs publicly expose Vidu to their own users, while Shengshu's own releases point
      to broader adoption by creative platforms and commerce use cases. The weakest areas are classic diligence variables:
      paid conversion, renewal, contract depth, ACV, customer concentration, and independent ROI evidence. Investors should
      therefore underwrite customer reach and ecosystem relevance with moderate confidence, but keep revenue durability and
      reference quality as open diligence gates.
    claimRefs:
      - CU020
      - CU021
      - CU026
      - CU032
      - CU035
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / User / Payer
      - Use Case
      - Scale
      - Revenue / Strategic Value
      - Gap
    rows:
      - - Self-serve creators
        - User and often payer
        - Social clips, creative experiments, short narratives, templates
        - Very large by company claim
        - Drives awareness and credit demand but likely lower ARPU
        - Need paid-conversion, churn, and usage-frequency data
      - - Developers / API users
        - Buyer and user
        - Embed Vidu into apps, workflows, or creative tooling
        - 10,000+ developers and enterprise customers combined by company claim
        - Higher strategic value because usage can scale programmatically
        - Need active API accounts and spend buckets
      - - Enterprise marketing and commerce teams
        - Buyer and payer; end users are teams or agencies
        - Product ads, localized campaigns, virtual try-on, narrative ad production
        - Material but undisclosed
        - Better monetization potential than consumer usage if repeatable
        - Need ACV, renewal, and deployment-depth proof
      - - Partner platforms / marketplaces
        - Buyer or channel partner; end users are their customers
        - Offer Vidu inside a broader creator or developer product
        - Credible and growing from public proof
        - Efficient distribution and indirect customer acquisition
        - Need channel-share economics and dependency data
      - - Hardware / ecosystem channel partners
        - Strategic partner
        - PC workflow bundling and device-level creative enablement
        - Limited public proof
        - Distribution leverage and brand validation
        - Need shipment attach rates and actual usage data
      - - Production teams / studios / narrative creators
        - User; may be buyer directly or through a platform
        - Film, animation, short drama, long-form narrative workflows
        - Publicly referenced but thinly quantified
        - Valuable reference quality if deployments are real
        - Need named case studies with outcomes
    notes: >-
      The segment structure implies a barbell: creator scale at one end and higher-value B2B or partner channels at the
      other. The central diligence task is determining how quickly users move from the left side of that barbell to the
      right.
