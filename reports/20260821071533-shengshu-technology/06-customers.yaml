company:
  name: Shengshu Technology
chapter:
  number: 6
  title: Customers
  summary: >-
    Shengshu's customer story is broad at the top of funnel and increasingly credible in software-platform distribution,
    but still weak on retention-grade proof. Company materials support a global customer base spanning creators,
    developers, enterprise customers, marketers, and partner platforms in more than 200 countries and regions. The most
    important published metrics are all company-claimed: over 40 million creators, more than 10,000 developers and
    enterprise customers, over 500 million generated videos, and more than 70% of output tied to commercial projects by
    mid-2026. Named adoption proof is strongest where third-party platforms publicly list or package Vidu—especially
    OpenArt and each::labs, with somewhat softer confirmation around PhotoGrid. That matters because it shows Shengshu is
    not reliant only on first-party web traffic; it is increasingly distributed through partner ecosystems. The core
    customer diligence gap is durability. There is no public NRR, GRR, churn, contract length, ACV, cohort retention, or
    concentration disclosure, so the right customer conclusion is: strong reach claims, credible ecosystem adoption, and
    still-opaque repeat economics.
sections:
  - id: segment-map-buyer-user-and-payer
    title: Segment Map by Buyer, User, and Payer
    body: >-
      Shengshu's customer base is best understood as layered rather than monolithic. At the volume end are creators and
      self-serve users using Vidu for social content, short videos, and experimentation. At the higher-value end are
      developers, enterprise customers, marketers, and partner platforms embedding Vidu into their own workflows or end
      products. The company repeatedly markets to advertising, film, animation, e-commerce, mobile ads, cultural tourism,
      and education, which suggests Vidu is solving different jobs for different payers: creators buy access and credits,
      developers buy API consumption, and enterprise or commerce teams buy campaign throughput or workflow acceleration.
      This distinction matters because user count alone is not the same as revenue quality. Public sources imply that the
      largest segment by usage is creators, while the strategically most important segments are platform partners and B2B
      customers that can generate recurring usage at higher average spend. The segment map is therefore broad, global, and
      commercially interesting, but not yet disclosed finely enough to show where the business is truly anchored.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU018
      - CU024
      - CU027
      - CU029
      - CU033
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-trajectory-and-public-usage-scale
    title: Adoption Trajectory and Public Usage Scale
    body: >-
      The adoption trajectory looks fast by any public standard, albeit still company-controlled. Shengshu says Vidu
      reached 1 million users within its first month, surpassed 10 million within three months, generated more than
      100 million videos by month four, exceeded 100 million reference-to-video generations by month eight, and later
      surpassed 500 million total generated videos while serving more than 40 million creators and over 10,000 developers
      and enterprise customers. These are large numbers and suggest that Vidu is not a niche prototype. More importantly,
      the company says more than 70% of output now comes from commercial projects, which—if accurate—indicates meaningful
      usage beyond hobbyist experimentation. Still, the public record omits the denominators that matter for customer
      quality: paid share of those users, account activity frequency, active customer definition, enterprise deployment
      depth, and the portion of usage driven by partner platforms versus first-party Vidu properties. The adoption story is
      therefore best viewed as impressive scale with incomplete transparency.
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU006
      - CU016
      - CU026
      - CU032
    tableRefs:
      - TU002
    figureRefs:
      - FU002
  - id: named-customer-proof-and-reference-quality
    title: Named Customer Proof and Reference Quality
    body: >-
      Named customer proof exists, but the quality of that proof varies meaningfully. The strongest evidence is not a
      Fortune 500 logo wall; it is partner or platform pages that publicly package Vidu as an available model or embedded
      capability. OpenArt has a dedicated Vidu video-generator page. each::labs publicly offers a Vidu model family with
      API access, positioning Vidu inside a unified developer platform. Shengshu's own releases say PhotoGrid embedded
      Vidu capabilities into its offering, and direct HTML inspection of PhotoGrid's AI-video page surfaced a Vidu Q3 tile
      even though the readability extract did not preserve it cleanly. By contrast, named examples such as Pollo AI, Odin,
      and long-form production teams are strategically interesting but much less independently verifiable from reviewed
      public sources. Lenovo is a useful separate category: it is less customer proof than channel or ecosystem proof,
      showing Shengshu can gain distribution through hardware and PC workflows. Overall, customer proof is real, but it is
      strongest in creator or developer platforms and weaker in fully documented enterprise case studies.
    claimRefs:
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
      - CU019
      - CU020
