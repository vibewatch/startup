  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Expansion Driver
      - Concentration Risk
      - Impact
      - Diligence Path
    rows:
      - - Creator to paid-plan conversion
        - Unknown creator churn or payer rate
        - Large funnel could monetize well or prove shallow
        - Request creator cohort dashboards and plan-conversion funnels
      - - API to partner-platform scale-up
        - Channel partners may multi-home across video models
        - Can drive rapid usage growth but also rapid switching
        - Review partner contracts, exclusivity terms, and top-partner share
      - - Enterprise marketing workflows
        - Procurement and trust requirements may slow expansion
        - Limits movement from creator novelty into larger budgets
        - Review sales cycle, security review friction, and win/loss data
      - - Commerce and ad automation via Agent / lip sync
        - Campaign usage may be episodic, not subscription-like
        - Revenue could be bursty and seasonal
        - Request campaign recurrence and repeat-purchase data
      - - Hardware / device channel expansion
        - Attach rate and end-user activation may be weak
        - Partnership headlines may overstate actual usage
        - Request activation, retention, and revenue share from Lenovo channel
      - - Geographic breadth
        - Lower country concentration but possible localization overhead
        - Broad reach can reduce geographic risk while increasing support complexity
        - Provide revenue by geography and support cost by region
      - - Top-customer concentration
        - Publicly undisclosed
        - Could materially affect revenue durability
        - Request top 10 customers and partners as share of revenue and usage
    notes: >-
      The most attractive expansion loop is through partner platforms and structured commercial workflows. The biggest
      unknown is whether those loops convert into durable spend or remain easy to switch away from.
