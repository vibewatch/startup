callouts:
  - calloutType: insight
    title: Partner platforms are Shengshu's strongest public customer proof
    body: >-
      OpenArt and each::labs publicly expose Vidu to their own users, which is stronger evidence than a logo wall because
      it shows Vidu being packaged inside other products right now.
    claimRefs:
      - CU009
      - CU010
      - CU020
  - calloutType: risk
    title: Customer scale is visible; retention is not
    body: >-
      Shengshu publishes large usage and creator counts, but none of the classic durability metrics—NRR, GRR, churn,
      renewal, ACV, or top-customer share—are public.
    claimRefs:
      - CU004
      - CU015
      - CU021
      - CU026
  - calloutType: insight
    title: Commercial mix is the best public repeat-use signal
    body: >-
      The claim that more than 70% of output is tied to commercial projects is the most useful public hint that Vidu may
      be used for real work, not just experimentation, although the definition still needs diligence.
    claimRefs:
      - CU005
      - CU016
