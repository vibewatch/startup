  topStrengths:
    - Vidu 在独立 AI 视频基准和持续发布节奏上都有可信产品可见度。
    - Shengshu 近期完成多轮大额融资，并吸引 Alibaba Cloud 等战略投资人。
    - 公司公开说法指向可观商业使用、创作者触达和开发者 / 企业采用。
    - 商业模式覆盖创作者工具、API 访问，以及 Vidu Agent 等工作流产品。
    - 相比 Pika 等规模更小的 AI 视频同行，公司资本实力更强，商业野心也更大。
  topRisks:
    - 2026 年 4 月确切轮后估值、股权结构表和清算优先权结构仍未披露。
    - 未找到公开 ARR、毛利率、烧钱速度、客户集中度或净留存披露。
    - 先进计算出口管制和中国 AI 监管会直接影响成本与风险画像。
    - 公开客户证明有意义，但仍太依赖合作伙伴平台，难以证明收入质量可持续。
    - Runway、Kling、MiniMax、ByteDance 及其他资金充足的 AI 视频玩家会压缩定价和用户注意力。
  unresolvedGaps:
    - 最后一轮确切轮后估值和股权结构表 / 优先权条款尚无公开信息。
    - 分产品线 ARR、毛利率、烧钱速度和算力成本桥仍未披露。
    - 留存、流失、企业 ACV 和头部客户集中度公开渠道看不到。
    - 算力来源韧性和监管合规落地需要管理层级尽调，不能只靠公开信息推断。
    - 做出实时投资决定前，仍需重新拉齐直接可比公司的收入和估值数据。
