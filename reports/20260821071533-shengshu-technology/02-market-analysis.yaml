  - id: regulation-compute-and-cross-border-access
    title: Regulation, Compute, and Cross-Border Access
    body: >-
      Regulation is a first-order market variable for Shengshu because its home market is China and its product outputs
      public-facing synthetic media. China's Interim Measures for the Administration of Generative AI Services took effect
      on August 15, 2023 and explicitly apply to public services generating text, images, audio, video, and related
      content. The reviewed regulatory sources are unusually clear about operational obligations: providers must address
      lawful training data and IP provenance, personal-information protection, content safety, complaint handling,
      transparency, and where relevant filing or security-assessment requirements. China Law Translate's rendering of the
      measures makes the video-specific obligation explicit in Article 12: providers shall label generated images and
      video according to the deep-synthesis rules; Article 14 further requires removal of illegal content and action
      against abusive users. Those obligations hardened in March 2025 when China published labeling rules that take effect
      September 1, 2025 and require visible marks plus technical identifiers, while forbidding deletion or concealment of
      those labels. Cross-border supply adds another constraint. BIS guidance published in May 2026 reaffirmed that a
      U.S. export license remains required for covered advanced-computing items destined for China- or D:5-headquartered
      entities, even when those entities receive the items outside China. For a China-based video-model company, that is
      a direct input-cost and hardware-access risk, not an abstract geopolitics footnote.
    claimRefs:
      - CM029
      - CM030
      - CM031
      - CM032
      - CM033
      - CM034
  - id: shengshu-relevant-sam-and-unresolved-sizing-gaps
    title: Shengshu-Relevant SAM and Unresolved Sizing Gaps
    body: >-
      The most defensible Shengshu sizing lens is not an undifferentiated multi-billion-dollar global "AI video" TAM.
      A cleaner near-term lens starts with Fortune's $847 million 2026 AI video generator market, then isolates the
      46.25% text-to-video slice to reach an estimated $392 million global text-to-video revenue pool. Applying
      Fortune's 20.9% Asia-Pacific share implies an approximately $82 million APAC-attributed text-to-video slice, while
      the same report separately references China at $49 million in 2026. A different but complementary lens isolates the
      33.88% marketing-and-advertising slice, yielding roughly $287 million of 2026 spend tied to campaign-production
      workflows. Those calculations do not produce Shengshu's actual SOM; they simply show that the company's most
      immediately monetizable arena is probably a few hundred million dollars globally and materially smaller within the
      observable China/APAC slice. That still may be large enough to support a unicorn if market share, enterprise ACV,
      and global expansion are strong, but public data do not reveal enough about China-specific enterprise spend, free to
      paid conversion, API revenue mix, or non-China buyer willingness to adopt Chinese video models. Investors should use
      TAM work here as triangulation, not as a substitute for customer and revenue diligence.
    claimRefs:
      - CM036
      - CM037
