callouts:
  - calloutType: risk
    title: China-specific monetization is much less observable than the headline TAM
    body: >-
      Public market reports provide usable global and adjacent market brackets, but they do not reveal Shengshu's most
      important underwriting variables: China enterprise ACV, free-to-paid conversion, API revenue share, customer
      concentration, or export-driven compute sensitivity. The top-down market can support a bullish narrative, but it is
      not sufficient on its own for valuation.
    claimRefs:
      - CM037
      - CM038
      - CM039
      - CM040
  - calloutType: insight
    title: Chinese platforms are already part of the global usage conversation
    body: >-
      a16z's March 2025 consumer ranking explicitly called out Kling and Hailuo as newly important web destinations and
      noted they had surpassed Sora in monthly visits by January 2025. That matters for Shengshu because it suggests the
      global AI-video market can reward Chinese entrants on product utility, not only on domestic policy support.
    claimRefs:
      - CM025
      - CM026
  - calloutType: risk
    title: Compliance and compute are dual bottlenecks for China-based video-model vendors
    body: >-
      Shengshu's home-market position is attractive, but China-specific labeling, moderation, filing, and hardware-access
      obligations mean market growth does not translate one-for-one into margin expansion. Any diligence on Vidu's market
