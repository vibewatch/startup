  - id: buyer-user-and-payer-architecture
    title: Buyer, User, and Payer Architecture
    body: >-
      The market is not one monolithic creator pool. It breaks into at least six commercially distinct segments with
      different budget owners and adoption triggers. First, marketing teams and agencies buy speed, iteration volume,
      and cost compression for campaign creatives; they are the most important near-term segment because analyst data say
      marketing and advertising is already the largest application. Second, retail and e-commerce operators want dynamic
      product showcases, localized short video, and catalog-scale asset production. Third, media, entertainment, and
      studio users care about higher-end controllability, consistency, and production workflows. Fourth, individual
      creators and prosumers enter through freemium or credit tiers and are highly sensitive to UX, trend tools, and
      mobile distribution. Fifth, developers and workflow builders buy APIs, CLI tooling, and orchestration primitives
      rather than consumer-facing subscriptions. Sixth, enterprise innovation, education, and internal-content teams use
      AI video for training, product explanation, and internal communication. Official competitor surfaces make this
      segmentation visible without guessing: Runway separates creative, dev, and robotics lines; Kling bundles consumer
      creation with API and mobile; Pika pushes agents plus apps; PixVerse exposes CLI, agent, marketing hub, and API;
      Jimeng optimizes for Chinese prompts and community remix loops. For Shengshu, this means Vidu competes in both B2C
      and B2B corridors, but the economically important buyers are probably enterprise marketers, developers, and media
      teams rather than casual free creators.
