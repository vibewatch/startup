  - id: demand-drivers-and-workflow-shifts
    title: Demand Drivers and Workflow Shifts
    body: >-
      Demand is being pulled by both media consumption volume and workflow maturation. Pew finds YouTube used by 83% of
      U.S. adults, Facebook by 68%, Instagram by 47%, and TikTok by 33%; YouTube's own 2024 U.S. impact report says the
      platform's creator ecosystem contributed $55 billion to U.S. GDP and that YouTube paid more than $70 billion to
      creators, artists, and media companies between 2021 and 2023. This is the macro context for why AI video tools do
      not need to replace cinema first; they only need to lower the cost of constant short-form, campaign, education,
      and product-video production. The second demand driver is capability maturity. a16z wrote in March 2025 that the
      prior six months delivered major progress in video quality and controllability, that Chinese models Hailuo and
      Kling had already surpassed Sora in monthly web visits by January 2025, and that provider differentiation was
      emerging around prompt adherence, lip sync, and camera control. Official product pages reinforce that observation:
      vendors are shipping workflow features such as reference control, agentic editing, voice/lip-sync, ready-made ad
      templates, CLI batch execution, and API-first orchestration. That evolution shifts the category from novelty toward
      workflow software. Constraints still matter. OpenAI's shutdown of Sora's consumer product and pending API sunset in
      2026 show that platform availability and commercialization paths can change quickly, and that market leadership is
      not permanent even for frontier labs.
    claimRefs:
      - CM023
      - CM024
