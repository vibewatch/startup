chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Shengshu Technology operates in the narrow AI video generator market rather than the entire global video-software
    universe. Credible public estimates place that narrow market at roughly $0.72-1.04 billion in 2025-2026, with
    medium-term CAGR clustered near 19-20%, while adjacent "generative AI in video creation" lenses are smaller and
    broader AI-video lenses are larger. Demand is pulled by marketing, e-commerce, creators, and developer platforms;
    official competitor sites show the category already bundles web creation, mobile apps, APIs, agents, CLI tooling,
    and enterprise workflows. For Shengshu, the most defensible near-term serviceable slice is the text-to-video and
    campaign-production portion of the market, but China-specific monetization, conversion, and enterprise spend remain
    under-disclosed. Regulation and compute export controls are not side issues in this market; for China-based vendors
    they are core go-to-market and cost drivers.
sections:
  - id: market-boundary-and-scope
    title: Market Boundary and Scope
    body: >-
      Shengshu should be analyzed against the narrow AI video generator market, not against all video software. The
      narrow category, as defined by The Business Research Company and Research and Markets, consists of software and
      services that generate or transform video from prompts, images, slides, or related structured inputs using AI.
      That category already spans text-to-video, image-to-video, editing automation, and delivery models ranging from
      self-serve subscriptions to API and enterprise services. Research and Markets' adjacent "generative AI in video
      creation" lens is slightly narrower in one respect and broader in another: it emphasizes creation workflows and
      deployment types such as cloud versus on-premise, but it still covers end users from enterprises to individual
      creators and media companies. Official market surfaces confirm that the commercial category has moved beyond a
      single demo model. Runway sells creative SaaS, developer tooling, and robotics/simulation surfaces; Kling exposes
      API, 4K generation, and mobile distribution; Pika emphasizes agents and workflow automation; PixVerse markets CLI,
      agent, marketing-hub, and API workflows; and Jimeng optimizes for Chinese-language prompting, community remixing,
      and frame-control features. The practical inclusion rule for Shengshu is therefore: count spend on AI-native video
      generation, campaign creation, creator tooling, and developer/enterprise video APIs; exclude legacy NLE suites,
      surveillance analytics, CDN/streaming infrastructure, and generic social-media ad spend that never touches a video
      model.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
