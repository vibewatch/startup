companyProfile:
  summary: Shengshu Technology is a Beijing-founded Chinese AI-video startup established on 2023-03-06 by a Tsinghua-linked team whose public leadership story has centered on Tang Jiayi and Zhu Jun, with Luo Yihang and Bao Fan appearing in later operator roles. Its flagship Vidu platform spans text-to-video, image-to-video, reference-to-video, developer API, and newer workflow products such as Vidu Agent and the real-time Vidu S1 avatar experience. By 2026 the company had raised more than RMB 2.6 billion in disclosed 2026 funding and was publicly described by Dealroom as a unicorn, but CNBC reported that the exact post-money valuation of the April 2026 Alibaba-led round was not disclosed.
