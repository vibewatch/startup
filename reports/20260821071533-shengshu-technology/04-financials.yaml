callouts:
  - calloutType: insight
    title: Shengshu already looks like more than a creator app
    body: >-
      The combination of API pricing, B2B support, named enterprise and platform partners, and Agent workflows aimed at
      advertising suggests Shengshu is trying to monetize commercial content operations, not just casual generation.
    claimRefs:
      - CI001
      - CI003
      - CI013
      - CI032
  - calloutType: risk
    title: Capital rich does not mean margin rich
    body: >-
      Large financing rounds reduce near-term liquidity stress, but AI-video platforms still face heavy inference and
      support costs. Without gross margin and cash-burn data, investors cannot tell whether Shengshu is scaling
      efficiently or simply funding an expensive compute race.
    claimRefs:
      - CI017
      - CI023
      - CI026
      - CI027
  - calloutType: risk
    title: Revenue quality remains the main diligence blocker
    body: >-
      User growth, creator counts, and video-generation volume are encouraging, but without ACV, retention, paid
      conversion, and margin data they are not enough to underwrite a valuation or predict the next financing need.
    claimRefs:
      - CI008
      - CI009
      - CI028
      - CI035
