company:
  name: Shengshu Technology
chapter:
  number: 4
  title: Financials
  summary: >-
    Shengshu's public financial picture is directionally attractive but still far from underwritable on hard numbers.
    Official and third-party sources support three monetization lanes—creator subscriptions or credits, API usage, and
    higher-touch enterprise or platform services—with newer workflow products such as Vidu Agent pushing the company
    toward advertising and commerce budgets rather than hobbyist clip generation alone. Public disclosures also support
    two strong positive signals: 2025 user and revenue growth above 10x on company statements, and very large recent
    capital inflows via a >RMB 600 million Series A+ followed by a RMB 2 billion Series B. The hard blockers are equally
    clear: no audited revenue, no public ARR, no disclosed gross margin, no cash balance, no burn, and no verified
    enterprise contract values. The right financial conclusion is not that Shengshu is weak, but that it remains capital
    rich and metric poor.
sections:
  - id: revenue-surfaces-and-monetization-lanes
    title: Revenue Surfaces and Monetization Lanes
    body: >-
      Public evidence supports a multi-lane monetization model rather than a single subscription product. Shengshu's own
      materials describe the company as operating both MaaS and SaaS, while the product ecosystem cited in the Series A+
      release spans Vidu MaaS, Vidu SaaS, Vidu App, and Vidu Agent. The API launch release adds the most concrete pricing
      evidence: Vidu API was opened with no application required, entry access starting at $10, and base pricing of
      $0.05 per credit, with a four-second video consuming 4 to 40 credits depending on feature and aspect ratio. This is
      a classic usage-based developer funnel. On top of that, the Agent launch reframes video generation as a workflow
      product for ads, TVCs, e-commerce, and short-form media, which points to higher-value commercial budgets than pure
      prompt entertainment. Dealroom and company materials together imply that creator subscriptions and credits are not
      the whole story; corporate clients and platform-level services appear meaningful. The main revenue-model debate is
      therefore not whether Shengshu monetizes, but how much of revenue is low-ARPU self-serve creator spend versus
      higher-quality API and enterprise revenue.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
