  - id: TI004
    title: Capital adequacy table
    columns:
      - Metric
      - Value / Status
      - Confidence
      - Why It Matters
      - Diligence Ask
    rows:
      - - Recent large financing
        - '>RMB 600M Series A+ in Feb 2026; RMB 2B Series B in Apr 2026'
        - high
        - Demonstrates fresh access to capital for compute, R&D, and GTM
        - Reconcile gross versus net proceeds and closing cash receipt dates
      - - Cash on hand
        - null
        - low
        - Needed to determine runway, not just fundraising headlines
        - Provide month-end cash balances since latest round
      - - Monthly burn
        - null
        - low
        - Core input for runway and financing dependency
        - Provide cash burn by R&D, compute, sales, and G&A
      - - Runway months
        - null
        - low
        - Capital adequacy cannot be judged without burn pace
        - Provide base and stress-case runway models
      - - Planned use of funds
        - World-model development, model scaling, commercialization, broader platform build
        - medium
        - Determines whether current round buys efficiency or just additional ambition
        - Provide board-approved use-of-funds plan
      - - Debt / project finance obligations
        - Not disclosed publicly
        - low
        - Debt could materially change risk and cash flexibility
        - Confirm bank facilities, cloud commitments, and off-balance-sheet obligations
    notes: >-
      Recent funding appears substantial, but the absence of cash and burn disclosure prevents a true capital-adequacy
      judgment. The size of the round is a buffer, not a proof of efficiency.
    claimRefs:
      - CI025
      - CI026
      - CI027
      - CI035
  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing Private Metric
      - Impact
      - Exact Diligence Path
    rows:
      - - Audited revenue and ARR
        - Prevents underwriting of scale and valuation efficiency
        - Request audited or board-level monthly revenue bridge by product
      - - Gross margin by product line
        - Blocks assessment of compute economics and pricing power
        - Request margin by creator, API, enterprise, and partner channels
      - - Cash balance and burn
        - Blocks runway and next-round timing analysis
        - Request monthly treasury dashboard since Series B close
      - - Enterprise ACV and concentration
        - Blocks revenue-quality and churn risk assessment
        - Review contract list, ACV distribution, and top-customer share
      - - Paid conversion and churn by plan
        - Blocks PLG efficiency analysis
        - Review cohort dashboards by month and geography
      - - Cloud / GPU commitments
        - Blocks fixed-cost and downside-risk analysis
        - Review supplier contracts, reserved capacity, and prepayment obligations
      - - Partner revenue share terms
        - Blocks channel-quality assessment
        - Review economics for key named partners and platform clients
    notes: >-
      These are not nice-to-have details; they are the minimum set required to convert a promising growth story into a
      financeable underwriting case.
    claimRefs:
      - CI027
      - CI028
      - CI035
      - CI036
