      - TI001
    figureRefs:
      - FI001
  - id: pricing-architecture-and-goto-market-proxies
    title: Pricing Architecture and Go-to-Market Proxies
    body: >-
      Vidu's public pricing architecture is a blend of consumer and developer motions. The English pricing page confirms
      a creator-plan surface and numerous premium tools, but the accessible page does not expose a clean price ladder in
      readable text; by contrast, the API launch release gives direct per-credit and minimum-spend detail. That asymmetry
      itself is a useful signal: list pricing is public enough to support self-serve funnel entry, but realized economics
      likely depend on feature mix, enterprise arrangements, and off-page terms. The API launch also says Shengshu staffs
      a dedicated B2B service team, indicating an explicit enterprise motion rather than a pure PLG creator business.
      Customer examples in the Series A+ release—Pollo AI, PhotoGrid, OpenArt, Hubx, Fal.ai, Eachlabs, Freepik, and
      GensPark—suggest GTM can extend through developer platforms and partner applications, not only direct end-customer
      sales. The financial implication is that Shengshu may have better distribution leverage than a pure standalone app,
      but also potentially higher support and integration cost per serious account. Immediate API access broadens the top
      of funnel; whether it produces efficient payback depends on conversion, usage depth, and support burden, none of
      which are publicly disclosed.
    claimRefs:
      - CI003
      - CI004
      - CI012
      - CI013
      - CI014
      - CI015
      - CI016
      - CI022
      - CI031
      - CI033
    tableRefs:
      - TI002
  - id: traction-signals-and-revenue-quality
    title: Traction Signals and Revenue Quality
    body: >-
      Shengshu's disclosed traction is encouraging but heavily self-reported. The strongest commercial narrative comes
      from the Series A+ and Global Creativity Week releases: the company says 2025 users and revenue both grew more than
      10x, that Vidu has reached more than 200 countries and regions, that it serves more than 40 million creators and
      over 10,000 developers and enterprise customers, that more than 500 million videos have been generated, and that
      commercial projects account for over 70% of output. If accurate, that commercial-project share is especially
      meaningful because it implies Vidu is used for monetizable work rather than only experimentation. The problem is not
      that these claims are implausible; it is that they are not audited. There is still no disclosed ARR, MRR, revenue
      mix by product, retention, enterprise concentration, or cohort conversion. Notebookcheck's hands-on review is a
      useful counterweight here: if production reliability still lags benchmark marketing, some top-of-funnel creator
      activity may not translate cleanly into durable paid usage. Revenue quality should therefore be treated as promising
      but unproven—better than a pure consumer toy if partner and enterprise claims hold, but still short of diligence
      grade.
    claimRefs:
      - CI008
      - CI009
      - CI010
      - CI028
      - CI029
      - CI030
      - CI034
    figureRefs:
      - FI002
  - id: cost-structure-unit-economics-and-margin-pressure
    title: Cost Structure, Unit Economics, and Margin Pressure
    body: >-
      The category economics around Shengshu are clear even if Shengshu's own gross margin is undisclosed. Frontier AI
      video is compute intensive, and both public cloud and peer pricing evidence show why. Google's official agent
      pricing illustrates the broader point that multimodal model usage is metered and optimized through spend-based
      commitments, cached tokens, and differentiated model rates rather than flat-cost infrastructure. Luma, Runway,
      Pika, MiniMax, and Vidu all use credits, usage-based charges, or both—because longer, higher-resolution, and more
      controllable outputs cost meaningfully more to deliver. MiniMax's docs and Sacra profile further suggest that a
      serious multimodal vendor carries substantial model-training and inference overhead, while Pika's Sacra profile
      explicitly warns about "unsustainable compute economics" as user demands scale upward. For Shengshu, this means
      revenue growth alone is insufficient. The key financial question is whether enterprise mix, workflow automation, and
      partner channels can lift realized revenue per unit of compute faster than pricing pressure and model-quality arms
      races compress it. Without gross margin, retry rate, GPU sourcing, or cost-per-generated-second data, the unit
      economics remain a structured unknown.
    claimRefs:
      - CI017
      - CI018
      - CI019
      - CI020
      - CI021
      - CI023
      - CI024
      - CI037
      - CI038
    tableRefs:
      - TI003
  - id: capital-adequacy-and-financing-dependency
    title: Capital Adequacy and Financing Dependency
    body: >-
      Capital adequacy is the strongest part of Shengshu's public financial story. Official and tier-one reporting show
      a >RMB 600 million Series A+ in February 2026 followed by a RMB 2 billion Series B in April 2026, a cadence that
      suggests the company raised a very large amount of fresh capital in a short window. CNBC also notes that the Series
      B proceeds were intended to support a "general world model," which implies that a meaningful share of funding is
      earmarked for frontier model R&D and compute, not just go-to-market scaling. That is important because world-model
      ambitions can consume capital well ahead of revenue. The positive interpretation is that Shengshu appears unlikely
      to be under immediate financing stress. The negative interpretation is that recent funding size may conceal equally
      heavy cost ambition, particularly if the company is trying to compete simultaneously on model quality, real-time
      systems, international expansion, and enterprise deployment. Public sources do not disclose cash on hand, monthly
      burn, debt, or runway. So while Shengshu looks well funded, it cannot yet be called capital efficient. The right
      judgment is "buffered but opaque."
    claimRefs:
      - CI025
      - CI026
      - CI027
      - CI035
    tableRefs:
      - TI004
      - TI005
    figureRefs:
      - FI003
      - FI004
  - id: financial-verdict-and-diligence-blockers
    title: Financial Verdict and Diligence Blockers
    body: >-
      Shengshu's financial posture is attractive enough to merit deeper diligence but too incomplete for conviction.
      Publicly, the business looks like a fast-scaling AI video company with real monetization surfaces, strong recent
      fundraising, global reach claims, and a potential mix shift toward higher-quality commercial usage. Those are the
      right ingredients for a venture-backed winner in generative media. But the missing variables remain the ones that
      determine whether this is a sustainable software business or an expensive compute story with thin margins: gross
      margin by product line, creator-to-paid conversion, enterprise ACV, partner revenue share, customer concentration,
      support cost, cash burn, and next-round trigger. Compared with the reporting discipline visible in public-company
      filing systems, Shengshu's disclosure remains sparse. The working verdict is that revenue quality is plausible,
      capital intensity is definitely high, and capital adequacy is currently strong; however, underwriting should stay
      conditional until management provides an actual financial model and cohort evidence.
    claimRefs:
      - CI027
      - CI028
      - CI029
      - CI035
      - CI036
      - CI037
      - CI038
