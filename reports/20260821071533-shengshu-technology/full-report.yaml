      - number: '7.2'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              The Chinese regulatory burden on Shengshu is substantial and ongoing rather than hypothetical. The 2023
              Interim Measures for Generative AI Services apply directly to public-facing video generation services and
              require lawful data sources, prohibited-content controls, privacy protection, complaint handling, and safe
              stable service delivery. The 2025 labeling measures go further by requiring explicit labels on generated
              video and implicit labels in metadata, plus checks by internet application distribution platforms when
              apps provide generative-AI services. Those labeling requirements rest on earlier Deep Synthesis and
              Algorithmic Recommendation rules, which also inform filing and safety assessment expectations. In
              practice, Shengshu faces three related legal exposures: first, content compliance and moderation failures;
              second, data provenance, privacy, or IP challenges if training or inference inputs are mishandled; third,
              process risk from incomplete algorithm-filing or labeling documentation. The regulatory environment does
              not prohibit growth, and Chinese rules explicitly talk about encouraging innovation, but it makes
              compliance a permanent operating cost with service-suspension risk if the company gets it wrong.
            claimRefs:
