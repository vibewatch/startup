      - number: '1.3'
        title: Funding, Capitalization, and Stakeholders
        blocks:
          - type: paragraph
            body: >-
              Shengshu has raised capital in frequent steps since 2023, but public disclosure quality is uneven. The
              cleanest hard disclosures are the February 2026 Series A+ of more than RMB 600 million and the April 2026
              RMB 2 billion Series B led by Alibaba Cloud, while earlier financing history is reconstructed from
              Baiduwiki and Dealroom. Those sources point to an angel round near RMB 100 million in June 2023, an
              angel-plus round in August 2023, several-hundred-million-yuan rounds in March and June 2024, and a
              several-hundred-million-yuan Series A in September 2025. Dealroom labels Shengshu a unicorn and gives a
              wide $1-2.5 billion valuation band, but CNBC explicitly notes that the company declined to disclose
              valuation with the April 2026 round. The practical diligence conclusion is that Shengshu is clearly
              venture-scale and strategically important enough to attract Alibaba Cloud, Qiming, Baidu-linked investors,
              the Beijing AI fund, and multiple industrial partners, yet investors still face material opacity on exact
              cumulative proceeds, dilution, liquidation preferences, and present ownership control.
