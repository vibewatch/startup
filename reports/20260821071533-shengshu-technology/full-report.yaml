              - CM028
      - number: '2.2'
        title: Market Sizing and Geographic Shape
        blocks:
          - type: paragraph
            body: >-
              Public market estimates cluster in a relatively narrow band only if the analyst uses a similar boundary.
              The Business Research Company sizes the AI video generator market at $0.85 billion in 2025, $1.04 billion
              in 2026, and $2.07 billion in 2030, implying 18.9% CAGR from 2026 to 2030. Its adjacent
              generative-AI-in-video-creation lens is smaller, at $0.39 billion in 2025, $0.47 billion in 2026, and
              $0.98 billion in 2030, with 20.4% CAGR. Fortune Business Insights lands between those lenses on the
              current base year, at $716.8 million in 2025 and $847 million in 2026, forecasting $3.35 billion by 2034
              at 18.8% CAGR. The spread is meaningful but explainable: some publishers count only pure generator
              software, others include more creation services, and some regional splits move materially depending on
              whether analytics, enterprise workflow services, or consumer apps sit inside the boundary. Segment data,
              however, are directionally useful. Fortune reports text-to-video as 46.25% of the 2026 market, marketing
              and advertising as the largest application at 33.88%, social media as the fastest-growing application at
              23.5% CAGR, and large enterprises as the largest customer class at 50.86% share while SMEs grow fastest at
              21.1% CAGR. Geography is less consistent: TBRC calls Asia-Pacific the largest region for AI video
              generator tools in 2025, while Fortune gives North America a 41.0% share in 2025 and Asia-Pacific 20.9%,
              with China at $49 million in 2026. For underwriting Shengshu, that disagreement is a warning that top-down
              China TAM should be treated as directional rather than precise.
