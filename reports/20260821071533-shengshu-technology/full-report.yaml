      - number: '5.5'
        title: Trust, Safety, Privacy, and Quality Controls
        blocks:
          - type: paragraph
            body: >-
              Shengshu has some visible trust and control surfaces, but they are not yet the kind of public assurance
              package that reduces enterprise adoption friction on their own. The help center explicitly includes
              content moderation, credits, subscriptions, and blocked-account recovery, implying that moderation, fraud,
              and account-enforcement workflows do exist. The Vidu S1 page separately warns that the feature involves
              personal information processing, which matters because the product supports image uploads, voice
              selection, and voice cloning for digital-human interactions. However, reviewed public materials did not
              surface a public status page, public incident history, SOC 2 or ISO certifications, detailed model cards,
              red-team reports, or quantified safety-performance metrics. Notebookcheck's test is therefore relevant not
              only as a product review but as a quality-control warning: if prompt obedience, physical consistency, and
              reference fidelity still fail materially in live usage, customer trust and repeat adoption may lag
              benchmark marketing. The trust story is directionally present but substantively incomplete.
