              CNBC also notes that the Series B proceeds were intended to support a "general world model," which implies
              that a meaningful share of funding is earmarked for frontier model R&D and compute, not just go-to-market
              scaling. That is important because world-model ambitions can consume capital well ahead of revenue. The
              positive interpretation is that Shengshu appears unlikely to be under immediate financing stress. The
              negative interpretation is that recent funding size may conceal equally heavy cost ambition, particularly
