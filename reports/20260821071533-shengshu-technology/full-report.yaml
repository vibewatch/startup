  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Revenue bridge
        - ARR, recognized revenue, product-line mix, and creator vs API vs enterprise contribution
        - Without this, valuation relies on activity proxies instead of financial facts
        - Finance diligence and management package.
      - - Revenue quality
        - Net retention, churn, ACV bands, partner concentration, and top-10 customer share
        - Determines whether Shengshu deserves software-like multiples or a lower platform/consumer mix discount
        - Commercial diligence plus cohort review.
      - - Margin and compute
        - Gross margin by channel, GPU commitments, retry rates, and cost per usable second
        - AI-video valuation depends heavily on whether scale improves economics or just increases compute burn
        - Technical + finance workstream.
      - - Cap table and preferences
        - Liquidation preferences, anti-dilution terms, board rights, and ownership after 2025-2026 rounds
        - A headline valuation can still be unattractive if preference overhang absorbs upside
        - Legal counsel and data-room review.
      - - Compliance readiness
        - Algorithm filing, labeling implementation, data-provenance controls, and incident history
        - Regulatory risk is part of the valuation discount, especially for China-linked AI video
        - Policy counsel and product-trust diligence.
      - - Exit readiness
        - Audited financials or filing-grade package suitable for crossover, strategic, or IPO underwriting
        - This is the shortest path from interesting story to investable asset
        - Board-level diligence request before any term-sheet work.
    notes: >-
      These asks are the minimum dataset required to convert Shengshu from a high-interest name into an underwritable
      late-stage investment.
