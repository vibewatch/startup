            body: >-
              Public evidence supports a multi-lane monetization model rather than a single subscription product.
              Shengshu's own materials describe the company as operating both MaaS and SaaS, while the product ecosystem
              cited in the Series A+ release spans Vidu MaaS, Vidu SaaS, Vidu App, and Vidu Agent. The API launch
