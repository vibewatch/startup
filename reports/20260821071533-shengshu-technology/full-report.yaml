  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Scope
        blocks:
          - type: paragraph
            body: >-
              Shengshu should be analyzed against the narrow AI video generator market, not against all video software.
              The narrow category, as defined by The Business Research Company and Research and Markets, consists of
              software and services that generate or transform video from prompts, images, slides, or related structured
              inputs using AI. That category already spans text-to-video, image-to-video, editing automation, and
              delivery models ranging from self-serve subscriptions to API and enterprise services. Research and
              Markets' adjacent "generative AI in video creation" lens is slightly narrower in one respect and broader
              in another: it emphasizes creation workflows and deployment types such as cloud versus on-premise, but it
              still covers end users from enterprises to individual creators and media companies. Official market
              surfaces confirm that the commercial category has moved beyond a single demo model. Runway sells creative
              SaaS, developer tooling, and robotics/simulation surfaces; Kling exposes API, 4K generation, and mobile
              distribution; Pika emphasizes agents and workflow automation; PixVerse markets CLI, agent, marketing-hub,
              and API workflows; and Jimeng optimizes for Chinese-language prompting, community remixing, and
              frame-control features. The practical inclusion rule for Shengshu is therefore: count spend on AI-native
              video generation, campaign creation, creator tooling, and developer/enterprise video APIs; exclude legacy
              NLE suites, surveillance analytics, CDN/streaming infrastructure, and generic social-media ad spend that
              never touches a video model.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM020
              - CM021
              - CM022
              - CM028
          - type: table
            tableRef: TM001
            claimRefs:
