  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Top Risk Picture and Why It Matters
        blocks:
          - type: paragraph
            body: >-
              Shengshu's risk stack is highly coupled. A regulatory event can become a customer problem; a compute
              shortage can become a product-quality and margin problem; a benchmark slip can become a financing problem.
              The most important insight is therefore not any one isolated risk but the transmission path between them.
              China-specific AI rules make compliance a product requirement, not merely a legal afterthought. U.S.
              export controls make infrastructure access a strategic variable, not just a procurement detail. Heavy
              competition means the company cannot simply slow down to be safer, because model and workflow leadership
              are part of the commercial thesis. That creates a classic frontier-AI tension: Shengshu must move fast
              enough to remain relevant while building enough moderation, labeling, privacy, support, and
              enterprise-control maturity to avoid accidents or enforcement. For investors, the practical takeaway is
              that the downside cases are correlated; when they hit, they are likely to hit more than one operating
              dimension at a time.
