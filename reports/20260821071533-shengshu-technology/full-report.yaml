chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Product Scope
        blocks:
          - type: paragraph
            body: >-
              Shengshu Technology is a Beijing-based generative AI company incorporated on March 6, 2023, with its
              registered address in Haidian District at Dongsheng Building on Zhongguancun East Road. Multiple sources
              tie the company to Tsinghua University research roots and to the earlier U-ViT architecture work that
              predated Vidu commercialization. The company's core product is Vidu, a multimodal video generation
              platform spanning text-to-video, image-to-video, and reference-to-video workflows, later extended into
              API, agent, and real-time avatar products. Public company materials position Shengshu as selling both MaaS
              and SaaS, while third-party profiles indicate a mix of subscription revenue and corporate usage. The
              identity question matters because later chapters depend on a clean baseline: this is not just a consumer
              toy app, but a research-heavy Chinese video-model startup with a commercial platform, a Beijing legal
              entity, and a product family already pushed into global distribution.
