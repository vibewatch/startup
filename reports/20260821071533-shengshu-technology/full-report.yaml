      - number: '1.4'
        title: Milestones, Commercialization, and Recognition
        blocks:
          - type: paragraph
            body: >-
              Shengshu's most notable strength is product cadence. After releasing Vidu in April 2024 and launching
              globally in July 2024, the company pushed Vidu 1.5 in November 2024, an enterprise API in February 2025,
              Vidu 2.0 in January 2025, reference-heavy Q-series upgrades through 2025-2026, TurboDiffusion in December
              2025, the one-click Vidu Agent in December 2025, and the real-time Vidu S1 model in July 2026. Company
              statements tie that roadmap to accelerating commercialization: Vidu is claimed to operate in more than 200
              countries and regions, more than 40 million creators and over 10,000 developers or enterprise customers
              are claimed by mid-2026, and named commercial users span ByteDance, Samsung, TAL, Alipay, JD.com, Amazon,
              L'Oréal, Tencent Animation, iQIYI, and Mango TV. External validation exists but is mixed. Shengshu's World
              Economic Forum Technology Pioneer selection and repeated benchmark citations support category relevance,
              while current Artificial Analysis snapshots place Vidu Q3 Pro in the upper tier but not at the very top
              globally. The commercialization story is therefore credible, but still anchored heavily in company claims
              rather than audited usage or revenue disclosures.
