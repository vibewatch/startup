      - number: '1.5'
        title: Adverse Signals and Unresolved Disclosure Gaps
        blocks:
          - type: paragraph
            body: >-
              The main company-overview risks are not existential red flags but disclosure and execution caveats.
              Notebookcheck's hands-on test of Vidu in September 2025 concluded that the product could create striking
              visuals but remained too glitch-prone and inconsistent for dependable professional work, underscoring a
              persistent gap between benchmark marketing and production reliability. Public benchmark positioning also
              appears time-sensitive: company PRs framed Vidu Q3 as No.1 in China and No.2 globally in early 2026, but
              August 2026 Artificial Analysis snapshots show lower rankings for both text-to-video and image-to-video.
              Governance disclosure is thinner still: public sources reviewed do not identify the board, independent
              oversight, ownership rights, or audited financial statements, and even basic current metrics such as
              headcount and exact lifetime funding remain only partially observable. The jobs portal does suggest
              recruiting across Beijing, Shanghai, Shenzhen, and San Francisco, but that should not be mistaken for
              fully documented operating headquarters beyond Beijing. Investors should treat Shengshu as a fast-moving
              but still opaque private company whose strongest facts are about technical shipping velocity rather than
              institutional transparency.
            claimRefs:
              - CO020
              - CO029
              - CO033
              - CO034
              - CO035
              - CO036
              - CO041
      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-to-product speed is the clearest moat signal
            body: >-
              Shengshu has consistently turned research claims into shippable product surfaces: Vidu, subject
              consistency, Vidu 2.0, API, Agent, TurboDiffusion, and real-time S1 all landed within roughly two years of
              incorporation. That cadence, plus strategic funding from Alibaba Cloud and repeated enterprise-use
              references, is the strongest observable sign that the company can translate model quality into commercial
              workflow relevance.
            calloutType: strength
            claimRefs:
              - CO011
              - CO013
              - CO014
              - CO016
              - CO021
              - CO023
          - type: callout
            title: Institutional transparency still lags technical momentum
            body: >-
              Shengshu is easy to understand as a model-shipping startup but much harder to diligence as an institution.
              Public sources do not disclose a current board, exact cap table, audited financials, or a precise current
              valuation, and even seemingly basic figures such as current headcount rely on stale or range-based
              sources. That opacity matters because strong technical progress can coexist with weak governance,
              concentrated control, or economically expensive customer acquisition.
            calloutType: risk
            claimRefs:
              - CO019
              - CO020
              - CO027
              - CO036
              - CO040
          - type: callout
            title: Benchmark and demo leadership should not be confused with reliable production quality
            body: >-
              Shengshu PRs present top-tier benchmark status, but independent hands-on testing still reports
              prompt-following errors, broken physical consistency, and distorted reference images. Investors should
              therefore separate frontier-model positioning from production-dependable quality when valuing the company
              enterprise and media narratives.
            calloutType: risk
