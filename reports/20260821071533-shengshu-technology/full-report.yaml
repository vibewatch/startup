      - number: '3.4'
        title: Distribution, Switching Costs, and Multi-Homing
        blocks:
          - type: paragraph
            body: >-
              Distribution power may matter as much as model quality. Pika's Adobe Firefly placement gives it access to
              a large professional creative ecosystem without building classic enterprise sales from scratch. Runway has
              both its own large creator base and external enterprise partnerships, while TechCrunch reports it is also
              expanding compute capacity and use cases into gaming and robotics. Luma's team workspaces, shared context,
              API, and enterprise plans push it toward a workflow-system position rather than one-off clip generation.
              PixVerse similarly bundles canvas, CLI, marketing hub, and API surfaces. By contrast, many creator-facing
              products remain easy to multi-home because their plans are credit-based, user interfaces are
              prompt-centric, and content can be regenerated elsewhere with modest switching effort. Stronger lock-in
              appears when a platform owns team collaboration, pipeline integration, brand assets, moderation controls,
              or enterprise commitments. That means Shengshu's defensibility will probably come less from casual creator
              subscriptions than from deeper workflow attachment via API, enterprise deployments, and any localized
              compliance or distribution advantages it can sustain.
