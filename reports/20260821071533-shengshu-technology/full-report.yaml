        title: Traction Signals and Revenue Quality
        blocks:
          - type: paragraph
            body: >-
              Shengshu's disclosed traction is encouraging but heavily self-reported. The strongest commercial narrative
              comes from the Series A+ and Global Creativity Week releases: the company says 2025 users and revenue both
              grew more than 10x, that Vidu has reached more than 200 countries and regions, that it serves more than 40
              million creators and over 10,000 developers and enterprise customers, that more than 500 million videos
              have been generated, and that commercial projects account for over 70% of output. If accurate, that
              commercial-project share is especially meaningful because it implies Vidu is used for monetizable work
              rather than only experimentation. The problem is not that these claims are implausible; it is that they
              are not audited. There is still no disclosed ARR, MRR, revenue mix by product, retention, enterprise
              concentration, or cohort conversion. Notebookcheck's hands-on review is a useful counterweight here: if
              production reliability still lags benchmark marketing, some top-of-funnel creator activity may not
              translate cleanly into durable paid usage. Revenue quality should therefore be treated as promising but
