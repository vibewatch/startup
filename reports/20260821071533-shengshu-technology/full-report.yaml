              minimum-spend detail. That asymmetry itself is a useful signal: list pricing is public enough to support
              self-serve funnel entry, but realized economics likely depend on feature mix, enterprise arrangements, and
              off-page terms. The API launch also says Shengshu staffs a dedicated B2B service team, indicating an
              explicit enterprise motion rather than a pure PLG creator business. Customer examples in the Series A+
              release—Pollo AI, PhotoGrid, OpenArt, Hubx, Fal.ai, Eachlabs, Freepik, and GensPark—suggest GTM can extend
