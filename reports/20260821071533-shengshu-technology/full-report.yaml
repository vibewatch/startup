      - number: '1.2'
        title: Founders, Leadership, and Organizational Setup
        blocks:
          - type: paragraph
            body: >-
              Leadership disclosure is meaningful but not perfectly clean. Public English-language reporting in late
              2024 described Jiayu Tang as Shengshu's co-founder and CEO, while 2026 CNBC coverage quoted Zhu Jun as
              founder and company statements describe him as founder and chief scientist. Dealroom reconciles the
              picture best: Tang is presented as co-founder and former CEO, Bao Fan as CTO, Zhu Jun as chief scientist
              with deep Tsinghua affiliation, and Luo Yihang as the executive brought in from ByteDance's Volcano Engine
              to lead research, product, and commercialization as CEO while Tang shifted to president. That leadership
              transition suggests Shengshu moved from founder-led technical incubation into a more scaled operating
              structure during 2025-2026. What remains missing is public board composition, formal governance structure,
              or disclosed control rights, which leaves key-person concentration and governance diligence open.
            claimRefs:
