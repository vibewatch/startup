      - number: '8.4'
        title: Exit readiness, diligence asks, and final view
        blocks:
          - type: paragraph
            body: >-
              Shengshu is not exit-ready from a diligence standpoint even though it may be exit-capable from a
              strategic-interest standpoint. The company clearly knows how to ship product, attract capital, and market
              commercial use cases. What is missing is the package an investment committee needs to underwrite a
              specific price: ARR by product line, net retention, enterprise concentration, gross margin, compute
              commitments, cash burn, board structure, and the preference stack created by rapid 2025-2026 financing.
              Filing infrastructure such as SEC EDGAR and HKEXnews shows the standard public investors eventually
              demand; Shengshu is still far short of that level of disclosure.


              The final view is therefore straightforward. Shengshu is one of the more credible Chinese AI-video
              companies and deserves continued coverage because the product, capital, and commercialization story are
              all real enough to matter. But the public evidence today supports interest, not conviction. Upgrade the
              name only if management provides audited or filing-grade economics, or if entry pricing falls low enough
              to create margin of safety despite the opacity. Until then, Track is the disciplined answer: strong
              company, incomplete valuation proof.
