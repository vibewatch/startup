            body: >-
              Shengshu's financial posture is attractive enough to merit deeper diligence but too incomplete for
              conviction. Publicly, the business looks like a fast-scaling AI video company with real monetization
              surfaces, strong recent fundraising, global reach claims, and a potential mix shift toward higher-quality
              commercial usage. Those are the right ingredients for a venture-backed winner in generative media. But the
              missing variables remain the ones that determine whether this is a sustainable software business or an
              expensive compute story with thin margins: gross margin by product line, creator-to-paid conversion,
              enterprise ACV, partner revenue share, customer concentration, support cost, cash burn, and next-round
              trigger. Compared with the reporting discipline visible in public-company filing systems, Shengshu's
