      - number: '5.4'
        title: Differentiation, Benchmarks, and Maturity Trajectory
        blocks:
          - type: paragraph
            body: >-
              Vidu's product differentiation is strongest where consistency, speed, and workflow packaging intersect.
              Public releases repeatedly emphasize subject or entity consistency, camera control, long single-pass
              generation, native audio, and reference-based production rather than generic prompt-to-video novelty.
              Artificial Analysis leaderboards provide third-party evidence that Vidu remains an upper-tier global
              contender, even if not unambiguously the global best. The GitHub and PR materials around TurboDiffusion
              strengthen the case that Shengshu is attacking one of the category's core bottlenecks—latency—at a systems
              level. Meanwhile, the roadmap from subject consistency in 2024, to Vidu 2.0 speed and templates in early
              2025, to audio-capable Q3, MaaS lip-sync/MCP, and real-time S1 in 2026 shows a coherent move from offline
              clip generation toward a richer production and interaction platform. The maturity caveat is that the most
              impressive claims still lean heavily on company-controlled materials, while benchmark positions and public
              hands-on reviews suggest performance leadership is real but not settled.
