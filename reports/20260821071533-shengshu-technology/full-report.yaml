      - number: '3.5'
        title: Moat Durability and Adverse Competitive Evidence
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence is straightforward: Shengshu does not own a clean feature monopoly. Runway and Luma
              are pushing deeper into professional and enterprise workflows; Kling, Hailuo, and Jimeng bring culturally
              local product fit and strong consumer momentum; PixVerse is pushing workflow orchestration and API
              surfaces; and open-model alternatives such as Stable Video Diffusion and Wan reduce the cost of
              experimenting outside any managed SaaS platform. Even OpenAI's Sora, while no longer an active consumer
              product, helped reset buyer expectations on what a frontier video model should do. Public disclosures are
              also uneven. Official sites are usually strongest on feature marketing and weakest on realized enterprise
              pricing, net retention, or audited usage, which means some rows in any serious comparison remain unknown
              or secondary-sourced. The competitive verdict is therefore mixed: Shengshu has a plausible right to win in
              China-native video quality and commercial speed, but its moat is not secure unless it can combine model
              quality with durable distribution, enterprise workflow stickiness, and compliance execution better than
              rivals with larger ecosystems or deeper capital bases.
