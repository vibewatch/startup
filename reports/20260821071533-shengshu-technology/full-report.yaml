              access starting at $10, and base pricing of $0.05 per credit, with a four-second video consuming 4 to 40
              credits depending on feature and aspect ratio. This is a classic usage-based developer funnel. On top of
              that, the Agent launch reframes video generation as a workflow product for ads, TVCs, e-commerce, and
              short-form media, which points to higher-value commercial budgets than pure prompt entertainment. Dealroom
              and company materials together imply that creator subscriptions and credits are not the whole story;
              corporate clients and platform-level services appear meaningful. The main revenue-model debate is
              therefore not whether Shengshu monetizes, but how much of revenue is low-ARPU self-serve creator spend
              versus higher-quality API and enterprise revenue.
