      - number: '4.4'
        title: Cost Structure, Unit Economics, and Margin Pressure
        blocks:
          - type: paragraph
            body: >-
              The category economics around Shengshu are clear even if Shengshu's own gross margin is undisclosed.
              Frontier AI video is compute intensive, and both public cloud and peer pricing evidence show why. Google's
              official agent pricing illustrates the broader point that multimodal model usage is metered and optimized
              through spend-based commitments, cached tokens, and differentiated model rates rather than flat-cost
              infrastructure. Luma, Runway, Pika, MiniMax, and Vidu all use credits, usage-based charges, or
              both—because longer, higher-resolution, and more controllable outputs cost meaningfully more to deliver.
              MiniMax's docs and Sacra profile further suggest that a serious multimodal vendor carries substantial
              model-training and inference overhead, while Pika's Sacra profile explicitly warns about "unsustainable
              compute economics" as user demands scale upward. For Shengshu, this means revenue growth alone is
              insufficient. The key financial question is whether enterprise mix, workflow automation, and partner
              channels can lift realized revenue per unit of compute faster than pricing pressure and model-quality arms
              races compress it. Without gross margin, retry rate, GPU sourcing, or cost-per-generated-second data, the
              unit economics remain a structured unknown.
