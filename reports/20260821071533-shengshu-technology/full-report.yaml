  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segment Map by Buyer, User, and Payer
        blocks:
          - type: paragraph
            body: >-
              Shengshu's customer base is best understood as layered rather than monolithic. At the volume end are
              creators and self-serve users using Vidu for social content, short videos, and experimentation. At the
              higher-value end are developers, enterprise customers, marketers, and partner platforms embedding Vidu
              into their own workflows or end products. The company repeatedly markets to advertising, film, animation,
              e-commerce, mobile ads, cultural tourism, and education, which suggests Vidu is solving different jobs for
              different payers: creators buy access and credits, developers buy API consumption, and enterprise or
              commerce teams buy campaign throughput or workflow acceleration. This distinction matters because user
              count alone is not the same as revenue quality. Public sources imply that the largest segment by usage is
              creators, while the strategically most important segments are platform partners and B2B customers that can
              generate recurring usage at higher average spend. The segment map is therefore broad, global, and
              commercially interesting, but not yet disclosed finely enough to show where the business is truly
              anchored.
