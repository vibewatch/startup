      - number: '2.5'
        title: Regulation, Compute, and Cross-Border Access
        blocks:
          - type: paragraph
            body: >-
              Regulation is a first-order market variable for Shengshu because its home market is China and its product
              outputs public-facing synthetic media. China's Interim Measures for the Administration of Generative AI
              Services took effect on August 15, 2023 and explicitly apply to public services generating text, images,
              audio, video, and related content. The reviewed regulatory sources are unusually clear about operational
              obligations: providers must address lawful training data and IP provenance, personal-information
              protection, content safety, complaint handling, transparency, and where relevant filing or
              security-assessment requirements. China Law Translate's rendering of the measures makes the video-specific
              obligation explicit in Article 12: providers shall label generated images and video according to the
              deep-synthesis rules; Article 14 further requires removal of illegal content and action against abusive
              users. Those obligations hardened in March 2025 when China published labeling rules that take effect
              September 1, 2025 and require visible marks plus technical identifiers, while forbidding deletion or
              concealment of those labels. Cross-border supply adds another constraint. BIS guidance published in May
              2026 reaffirmed that a U.S. export license remains required for covered advanced-computing items destined
              for China- or D:5-headquartered entities, even when those entities receive the items outside China. For a
              China-based video-model company, that is a direct input-cost and hardware-access risk, not an abstract
              geopolitics footnote.
            claimRefs:
              - CM029
              - CM030
              - CM031
              - CM032
              - CM033
              - CM034
      - number: '2.6'
        title: Shengshu-Relevant SAM and Unresolved Sizing Gaps
        blocks:
          - type: paragraph
            body: >-
              The most defensible Shengshu sizing lens is not an undifferentiated multi-billion-dollar global "AI video"
              TAM. A cleaner near-term lens starts with Fortune's $847 million 2026 AI video generator market, then
              isolates the 46.25% text-to-video slice to reach an estimated $392 million global text-to-video revenue
              pool. Applying Fortune's 20.9% Asia-Pacific share implies an approximately $82 million APAC-attributed
              text-to-video slice, while the same report separately references China at $49 million in 2026. A different
              but complementary lens isolates the 33.88% marketing-and-advertising slice, yielding roughly $287 million
              of 2026 spend tied to campaign-production workflows. Those calculations do not produce Shengshu's actual
              SOM; they simply show that the company's most immediately monetizable arena is probably a few hundred
              million dollars globally and materially smaller within the observable China/APAC slice. That still may be
              large enough to support a unicorn if market share, enterprise ACV, and global expansion are strong, but
              public data do not reveal enough about China-specific enterprise spend, free to paid conversion, API
              revenue mix, or non-China buyer willingness to adopt Chinese video models. Investors should use TAM work
              here as triangulation, not as a substitute for customer and revenue diligence.
            claimRefs:
              - CM036
              - CM037
              - CM038
              - CM039
              - CM040
      - number: '2.7'
        title: Exhibits
        blocks:
          - type: callout
            title: China-specific monetization is much less observable than the headline TAM
            body: >-
              Public market reports provide usable global and adjacent market brackets, but they do not reveal
              Shengshu's most important underwriting variables: China enterprise ACV, free-to-paid conversion, API
              revenue share, customer concentration, or export-driven compute sensitivity. The top-down market can
              support a bullish narrative, but it is not sufficient on its own for valuation.
            calloutType: risk
            claimRefs:
              - CM037
              - CM038
              - CM039
              - CM040
          - type: callout
            title: Chinese platforms are already part of the global usage conversation
            body: >-
              a16z's March 2025 consumer ranking explicitly called out Kling and Hailuo as newly important web
              destinations and noted they had surpassed Sora in monthly visits by January 2025. That matters for
              Shengshu because it suggests the global AI-video market can reward Chinese entrants on product utility,
              not only on domestic policy support.
            calloutType: insight
            claimRefs:
              - CM025
              - CM026
          - type: callout
            title: Compliance and compute are dual bottlenecks for China-based video-model vendors
            body: >-
              Shengshu's home-market position is attractive, but China-specific labeling, moderation, filing, and
              hardware-access obligations mean market growth does not translate one-for-one into margin expansion. Any
              diligence on Vidu's market opportunity should test whether compliance tooling and compute sourcing scale
              as fast as demand.
            calloutType: risk
            claimRefs:
              - CM029
              - CM032
              - CM033
              - CM034
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Competitive Classes
        blocks:
          - type: paragraph
            body: >-
              Shengshu sits inside a crowded but still immature AI video landscape where direct, adjacent, and
              substitute competitors overlap. The direct peer class includes platforms that already ship text-to-video
              or image-to-video, creator-facing interfaces, and at least one of API, enterprise, or production workflow
              features. By that standard, the closest rivals are Runway, Kling, Hailuo/MiniMax, Pika, Luma, Jimeng,
              PixVerse, and Wan. Third-party evidence supports that grouping. Artificial Analysis compares Hailuo,
              Kling, Sora, Vidu, and Wan within the same benchmark family, and a16z's March 2025 consumer ranking called
              out Hailuo, Kling, and Sora as newly relevant web products while putting Runway on the Brink List. The
              market also contains important substitutes rather than only direct peers: open-model or research
              alternatives such as Stable Video Diffusion and Wan, internal build-outs by large AI labs or clouds, and
              the status quo of manual video production with editors, agencies, or in-house creative teams. For
              Shengshu, the strategic question is therefore not "who else can generate a clip?" but "which rival owns
              the buyer's preferred combination of quality, workflow depth, price clarity, localization, and
              distribution?"
