  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The core valuation question is not whether Shengshu is interesting; it is whether the current public
              evidence supports paying an exact late-stage price. On that narrower question, the answer is still no.
              CNBC confirmed Shengshu's April 2026 Alibaba-led financing but also said the company declined to disclose
              valuation, while Dealroom only provides a broad public unicorn band of roughly $1 billion to $2.5 billion.
              At the same time, Shengshu has meaningful positives that stop this from being a simple pass: the company
              disclosed more than RMB 600 million of Series A+ financing in February 2026, roughly RMB 2 billion of
              Series B financing in April 2026, a 10x increase in users and revenue during 2025, and a product surface
              that already spans creator tools, Vidu API, and the ad-oriented Vidu Agent.


              That combination makes Shengshu watchlist-worthy but still price-sensitive. If investors are underwriting
              an internal mark around $1.5 billion to $1.7 billion, they are implicitly assuming that the company has
              already converted product quality and commercial usage into a substantial revenue base. Without audited
              revenue, gross margin, cap-table, or preference disclosures, there is no evidence-backed way to confirm
              that assumption. The recommendation is therefore Track rather than buy: keep the company active in
              coverage, but do not commit capital at an opaque mark unless management opens the revenue bridge,
              gross-margin profile, customer concentration, and dilution stack. The practical rule is simple: the better
              the price and the cleaner the financial package, the more Shengshu shifts from compelling story to
              underwritable asset.
