  - id: TV004
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Key risks
    rows:
      - - Bull
        - >-
          Commercial-project share proves real, revenue run-rate reaches roughly $140M-$180M+, enterprise/API mix
          strengthens, and product quality remains near the top of the category.
        - >-
          ~$1.8B-$3.0B using premium private-growth multiples above public AI/software comps; attractive upside only
          from a lower-end entry.
        - Possible if current company-claimed usage metrics convert cleanly into durable revenue.
        - Requires cleaner margins, retention, and compliance than public evidence currently proves.
      - - Base
        - >-
          Revenue run-rate lands around $80M-$120M, growth stays strong but mixed across creator, partner, and
          enterprise channels, and the market applies a moderate private premium.
        - ~$0.9B-$1.6B; this is the most supportable current band on public evidence alone.
        - Most consistent with strong product signals plus incomplete economics.
        - Margin compression, partner dependence, and under-disclosed churn can still push outcomes lower.
      - - Bear
        - >-
          Revenue quality disappoints, enterprise proof stays thin, compute or regulatory friction rises, and multiples
          compress toward lower software levels.
        - ~$0.5B-$0.9B, implying material downside to a rich late-stage entry.
        - Plausible if opacity persists into the next financing window.
        - Product remains relevant, but valuation resets because the economics never get proven.
    notes: >-
      Bands are designed for entry discipline rather than mark-to-model precision. They translate missing revenue
      evidence into concrete valuation consequences.
    sourceRefs:
      - SV004
      - SV006
      - SV010
      - SV011
      - SV013
      - SV016
