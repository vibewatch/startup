        title: Product Definition and Module Map
        blocks:
          - type: paragraph
            body: >-
              In customer workflow terms, Vidu is not just an AI model; it is a creative operating stack. The public
              surface now covers classic prompt-based generation modes such as text-to-video and image-to-video,
              reference-heavy generation for character or object continuity, native-audio storytelling, workflow
              automation for ads and commerce, API access for developers, and real-time interactive avatar generation
              via Vidu S1. The Q3 page is especially helpful because it frames the product around end use rather than
              lab metrics: finished clips with dialogue, sound effects, and music generated together; longer 16-second
              single-pass outputs; camera-language control; multilingual output; and readiness for comic drama, short
              series, and narrative ads. The S1 / stream surface expands that definition again, positioning Vidu as a
              live interaction layer for voice-controlled digital characters rather than only batch clip rendering. That
              breadth matters because Shengshu appears to be solving several adjacent jobs-to-be-done: creative
              ideation, production acceleration, localization, ad-asset generation, interactive avatars, and developer
              embedding. The module map therefore looks more like a platform roadmap than a single-model feature list.
