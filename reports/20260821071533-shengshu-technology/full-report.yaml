  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Enterprise/API proof stalls
        - No convincing ARR bridge, retention data, or ACV evidence before the next fundraise
        - Breaks the argument that commercial usage is high quality rather than broad but shallow
        - Do not underwrite a premium multiple.
      - - Model quality slips
        - Sustained benchmark or review deterioration versus Runway, Kling, MiniMax, or other top peers
        - Weakens the product-led premium that supports late-stage pricing
        - Re-cut the valuation band toward the base/bear case.
      - - Export-control shock or compute squeeze
        - Tighter effective access to advanced computing or materially worse inference economics
        - Turns product momentum into margin and iteration risk simultaneously
        - Apply a larger discount and require proof of compute resilience.
      - - Regulatory incident
        - Visible content, labeling, data-provenance, or compliance failure tied to Chinese AI rules
        - Transforms policy risk into customer trust and distribution friction
        - Pause underwriting until remediation is verified.
      - - Disclosure remains thin
        - No audited financial package, cap table, or preference view despite continued financing activity
        - Prevents reliable return math even if the company itself performs well
        - Remain on Track / research-more rather than buy.
    notes: >-
      These are monitorable rather than abstract triggers. Each one directly changes the revenue, multiple, or dilution
      assumptions behind the valuation case.
    sourceRefs:
      - SV008
      - SV009
      - SV013
