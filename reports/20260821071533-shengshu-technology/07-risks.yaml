chapter:
  number: 7
  title: Risks
  summary: >-
    Shengshu's risk profile is investable but undeniably high-volatility. The most severe risks are not generic startup
    issues; they are tightly linked to being a Chinese frontier AI-video company with global ambitions. On the regulatory
    side, China already imposes concrete obligations around lawful training data, prohibited content, complaint handling,
    labeling of AI-generated video, and potentially algorithm filing or security assessment. On the geopolitical side,
    U.S. export controls continue to restrict advanced-computing items for China-linked entities, directly threatening the
    cost, speed, and scalability of frontier video training and inference. On the commercial side, Shengshu still lacks
    public disclosure on retention, gross margin, and customer concentration, so several risks can only be bounded rather
    than underwritten. Operationally, public reviews and Shengshu's own roadmap imply that reliability, moderation,
    privacy-sensitive avatar features, and compute efficiency remain live execution burdens. The net judgment is that the
    company has visible mitigants—capital, product cadence, and acceleration research—but also several thesis-break risks
    that could hit model quality, customer trust, or financing at once.
sections:
  - id: top-risk-picture-and-why-it-matters
    title: Top Risk Picture and Why It Matters
    body: >-
      Shengshu's risk stack is highly coupled. A regulatory event can become a customer problem; a compute shortage can
      become a product-quality and margin problem; a benchmark slip can become a financing problem. The most important
      insight is therefore not any one isolated risk but the transmission path between them. China-specific AI rules make
      compliance a product requirement, not merely a legal afterthought. U.S. export controls make infrastructure access a
      strategic variable, not just a procurement detail. Heavy competition means the company cannot simply slow down to be
      safer, because model and workflow leadership are part of the commercial thesis. That creates a classic frontier-AI
      tension: Shengshu must move fast enough to remain relevant while building enough moderation, labeling, privacy,
      support, and enterprise-control maturity to avoid accidents or enforcement. For investors, the practical takeaway is
      that the downside cases are correlated; when they hit, they are likely to hit more than one operating dimension at a
      time.
    claimRefs:
      - CR001
      - CR003
      - CR006
      - CR014
      - CR020
      - CR031
      - CR032
    figureRefs:
      - FR001
  - id: regulatory-and-legal-risk
    title: Regulatory and Legal Risk
    body: >-
      The Chinese regulatory burden on Shengshu is substantial and ongoing rather than hypothetical. The 2023 Interim
      Measures for Generative AI Services apply directly to public-facing video generation services and require lawful data
      sources, prohibited-content controls, privacy protection, complaint handling, and safe stable service delivery. The
      2025 labeling measures go further by requiring explicit labels on generated video and implicit labels in metadata,
      plus checks by internet application distribution platforms when apps provide generative-AI services. Those labeling
      requirements rest on earlier Deep Synthesis and Algorithmic Recommendation rules, which also inform filing and safety
      assessment expectations. In practice, Shengshu faces three related legal exposures: first, content compliance and
      moderation failures; second, data provenance, privacy, or IP challenges if training or inference inputs are mishandled;
      third, process risk from incomplete algorithm-filing or labeling documentation. The regulatory environment does not
      prohibit growth, and Chinese rules explicitly talk about encouraging innovation, but it makes compliance a permanent
      operating cost with service-suspension risk if the company gets it wrong.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR023
      - CR034
      - CR035
      - CR036
      - CR037
      - CR038
    tableRefs:
      - TR001
  - id: operational-quality-privacy-and-security-risk
    title: Operational, Quality, Privacy, and Security Risk
    body: >-
      Shengshu's product itself creates meaningful operational and trust risk. AI video generation is unusually exposed to
      quality failures because users can see prompt drift, physics errors, broken continuity, or weak lip sync instantly.
      Notebookcheck's hands-on review shows that this remains more than a theoretical issue. Vidu's own product direction
      also expands the risk surface: native audio, lip sync, voice cloning, live avatar interaction, and template-based
      automation all create new moderation, privacy, abuse, and reputation burdens. Public sources show that Vidu has a
      content-moderation surface and account-enforcement processes, which is better than having no visible controls, but
      they do not show the depth of model-evaluation, enterprise security assurance, or incident transparency that larger
      buyers often expect. The result is an operational profile where every new feature can improve commercial value while
      simultaneously raising the cost and difficulty of safe deployment.
    claimRefs:
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
      - CR026
      - CR027
      - CR028
      - CR029
      - CR033
    tableRefs:
      - TR002
  - id: dependency-customer-and-financial-risk
    title: Partner, Dependency, Customer, and Financial Risk
    body: >-
      The dependency layer is where geopolitical, financial, and customer risks converge. Shengshu needs advanced compute,
      frontier engineering talent, and continued product acceleration to compete with well-funded rivals such as Runway,
      Kling, Hailuo, and others. U.S. export-control enforcement makes GPU access and related infrastructure more fragile,
      while Shengshu's world-model ambitions likely keep compute demand elevated. At the same time, publicly visible
      customer proof is strongest in partner platforms such as OpenArt and each::labs, which is commercially useful but
      introduces platform dependence and potential switching risk. Financial opacity compounds the problem: the company has
      raised large rounds, but public sources do not disclose burn, gross margin, or customer concentration. That means an
      investor can see the likely pressure points—compute supply, partner-platform concentration, pricing compression, and
      margin dilution—without being able to precisely quantify them. This is a classic case where capital buffer mitigates
      near-term survival risk but does not eliminate model-risk or execution-risk intensity.
    claimRefs:
      - CR006
      - CR007
      - CR008
      - CR014
      - CR015
      - CR016
      - CR017
      - CR018
      - CR019
      - CR020
      - CR024
      - CR030
      - CR039
      - CR040
    tableRefs:
      - TR003
    figureRefs:
      - FR003
  - id: people-execution-and-kill-criteria
    title: People, Execution, and Kill Criteria
    body: >-
      The final risk layer is organizational execution. Shengshu's product cadence suggests impressive engineering speed,
      but it also raises the bar for management systems, compliance operations, enterprise support, and talent retention.
      The company appears to have evolved from founder-led product momentum under Jiayu Tang into a broader operating phase
      where Yihang Luo is the public CEO voice; that shift is not automatically negative, but it does increase the need to
      understand governance continuity and decision rights. The company also needs to keep attracting specialized talent in
      model research, systems acceleration, safety or moderation operations, and enterprise delivery while rivals with deep
      capital pools compete for the same people. These are monitorable risks, which means they should feed directly into
      kill criteria rather than remain vague concerns. For this chapter, the core thesis-break events are export-control
      shock, regulatory enforcement, benchmark or product-quality slippage, failed customer durability, and evidence that
      frontier ambition is outrunning operational discipline.
    claimRefs:
      - CR021
      - CR022
      - CR030
      - CR041
      - CR042
