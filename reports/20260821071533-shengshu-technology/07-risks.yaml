callouts:
  - calloutType: risk
    title: Export controls are not background noise
    body: >-
      The May 2026 BIS guidance makes clear that advanced-computing licensing obligations for China-linked entities remain
      active. For a compute-hungry AI-video company, that is a direct product, margin, and strategy risk.
    claimRefs:
      - CR006
      - CR007
      - CR014
  - calloutType: risk
    title: Compliance is part of the product
    body: >-
      China's AI rules require lawful data sourcing, labeling, complaints handling, and safe stable services. For Vidu,
      compliance failures would not sit in the legal department alone—they would directly affect the shipped product.
    claimRefs:
      - CR001
      - CR002
      - CR023
      - CR038
  - calloutType: insight
    title: Capital and acceleration are real mitigants, but not complete ones
    body: >-
      Shengshu's funding and TurboDiffusion work help offset some compute and execution risk. They do not remove the need
      to prove reliable product quality, customer durability, and regulator-ready operations.
    claimRefs:
      - CR018
      - CR039
      - CR042
