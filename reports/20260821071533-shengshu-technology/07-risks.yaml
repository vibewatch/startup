  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable Trigger
      - Threshold / Event
      - Action Implication
    rows:
      - - Export-control shock
        - GPU or cloud supply restriction
        - Loss of critical capacity, denied licenses, or material cost step-up
        - Pause underwriting until alternative capacity and budget are demonstrated
      - - Regulatory enforcement
        - CAC or related enforcement action
        - Warning, mandated remediation, algorithm-filing failure, or service suspension signal
        - Escalate diligence and reset launch or growth assumptions
      - - Product quality slippage
        - Benchmark and field-performance deterioration
        - Visible decline in ranking, user complaints, or rising refund/regeneration burden
        - Reduce growth assumptions and re-test retention thesis
      - - Customer durability failure
        - Weak renewals or partner concentration shock
        - Meaningful churn, partner delisting, or concentrated revenue exposure discovered
        - Re-cut revenue quality and valuation support
      - - Capital-intensity overrun
        - Burn or gross-margin miss
        - Funding need emerges before durable customer economics are proven
        - Treat as thesis break unless new strategic capital terms are unusually strong
      - - Governance / execution failure
        - Leadership or control breakdown
        - Key departures, unresolved incidents, or compliance backlog becomes visible
        - Require governance remediation before proceeding
    notes: >-
