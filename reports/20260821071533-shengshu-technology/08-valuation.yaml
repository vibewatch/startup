- id: scenario-ranges-and-downside-transmission
  title: Scenario ranges and downside transmission
  body: >-
    Scenario work matters because Shengshu's best public metrics are activity signals, not audited revenue metrics. In the bull case, Shengshu's claimed >70% commercial-project mix proves to be a real revenue-quality signal, the developer and enterprise customer base converts into durable API and B2B contracts, product leadership stays near the top of AI-video benchmarks, and management can show gross margins moving toward software-like levels despite compute intensity. Under that path, a roughly $1.8 billion to $3.0 billion band becomes defensible and can support attractive upside from a lower-end entry.


    The base case is more conservative. It assumes Shengshu is real and growing, but that revenue quality is mixed across self-serve creators, platform partners, and enterprise accounts; compute and compliance costs remain heavy; and the private market applies a premium to public AI/software multiples without treating Shengshu like a fully disclosed scarcity asset. On that path, about $0.9 billion to $1.6 billion looks more supportable. The bear case is not a collapse story; it is a multiple-compression and opacity story. If commercial usage does not translate into durable ARR, if export controls tighten, if regulatory friction slows launches, or if competitive pricing forces thinner margins, a roughly $0.5 billion to $0.9 billion band becomes plausible. That is why the downside transmission runs mainly through missing economics rather than through product irrelevance alone.
