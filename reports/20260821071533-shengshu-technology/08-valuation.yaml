- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Side
  - Argument
  - Evidence basis
  - What would change the view
  rows:
  - - Thesis
    - Product and benchmark credibility are real.
    - Vidu appears on external AI-video leaderboards and has kept shipping major releases.
    - Sustained benchmark slippage or user-quality issues would weaken the case.
  - - Thesis
    - Commercial usage may be better than a hobbyist creator app.
    - Company claims >70% commercial-project share and 10,000+ developers and enterprise customers.
    - Renewal, ACV, and retention disclosure would strengthen this materially.
  - - Thesis
    - Capital strength reduces near-term survival risk.
    - More than RMB 2.6B of disclosed 2026 financing and Alibaba backing provide buffer for compute and GTM.
    - Evidence of heavy burn or onerous preferences would reduce the benefit.
  - - Anti-thesis
    - Exact current valuation is not publicly verified.
    - CNBC says valuation was not disclosed; Dealroom provides only a broad unicorn band.
    - A board-approved financing memo or audited cap-table package would resolve it.
  - - Anti-thesis
    - Revenue quality remains the key missing link.
    - No public ARR, gross margin, burn, concentration, or net-retention disclosure was found.
    - A revenue bridge with cohort and margin data would materially improve confidence.
  - - Anti-thesis
    - Regulation and compute are structural discounts, not background noise.
    - China AI rules plus active U.S. advanced-computing controls can slow growth and raise cost.
    - A documented compliance stack and resilient compute-sourcing plan would narrow the discount.
  notes: The thesis is attractive on product and capital; the anti-thesis is concentrated in valuation support and evidence quality.
