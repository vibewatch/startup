- id: comparable-band-and-supportable-range
  title: Comparable band and supportable range
  body: >-
    The cleanest way to avoid false precision is to triangulate Shengshu across three reference sets: direct AI-video comparables, broader AI/software public multiples, and Shengshu's own disclosed commercial signals. On direct private comps, Runway sits at the top end with a February 2026 $5.3 billion valuation and roughly $860 million raised, Luma reached $4 billion with a $900 million Series C, MiniMax reached a later $4 billion growth mark with about $1.1 billion raised, while Pika appears much smaller at about $470 million valuation and $7.6 million of 2024 revenue. Shengshu belongs above Pika in visible scale and strategic capital, but it still lacks the disclosed revenue depth and investor-grade financial transparency seen even in the secondary reporting around Runway or MiniMax.


    Public market anchors are a useful reality check. Multiples.vc's August 2026 software data show public AI and design-engineering software trading around 4.0x to 4.2x next-twelve-month revenue, while the media-and-entertainment software overview reminds investors that revenue quality varies dramatically between high-margin creative subscriptions and much lower-margin cloud-rendering or infrastructure businesses. Shengshu is not a public SaaS company and should command a private-growth premium if its commercial usage converts well. But that premium cannot be infinite. A $1.5 billion equity value implies about $150 million of sustainable revenue at 10x, about $125 million at 12x, or roughly $107 million at 14x. A $2.0 billion mark implies even more. Those thresholds are plausible for a fast-scaling AI-video leader, yet public evidence does not confirm Shengshu has already reached them. The right conclusion is not that the company is overvalued with certainty, but that the valuation case
    currently rests on unverified revenue assumptions.
