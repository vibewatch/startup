  - type: private-evidence-only
    severity: material
    topic: exact-post-money-and-cap-table
    missingEvidence: Exact April 2026 post-money valuation, ownership dilution, liquidation preferences, anti-dilution terms, and board-control rights.
    whyItMatters: Return math can look attractive on the headline valuation while still being unattractive after preference overhang or weak governance terms.
    diligencePath: Request the financing memo, cap table, term sheets, and board materials for the 2025-2026 rounds.
