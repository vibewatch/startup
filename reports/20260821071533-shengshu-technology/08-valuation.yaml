  title: Valuation
summary: 'Shengshu looks strategically important and commercially promising, but the current public record does not justify underwriting an exact unicorn-plus price with conviction. Public sources confirm rapid product cadence, more than RMB 2.6 billion of disclosed 2026 financing, company-claimed 10x revenue growth in 2025, and a broadening mix of API, creator, and advertising workflows. They do not confirm current ARR, gross margin, burn, customer concentration, or the exact post-money valuation of the April 2026 round. Dealroom''s public $1 billion-$2.5 billion unicorn band is directionally plausible, and a ~US$1.5 billion mark could be defendable if Shengshu already has roughly $100 million-plus of durable commercial revenue and improving margin quality. That condition is not yet proven. Relative to Pika, Shengshu clearly deserves a premium; relative to Runway, Luma, and MiniMax, it still lacks enough disclosed economics to merit equal confidence. The investable posture is Track: do
  not chase opaque pricing above the low end of the unicorn band until management provides filing-grade financial evidence or the entry price resets materially lower.'
sections:
- id: recommendation-and-price-discipline
  title: Recommendation and price discipline
  body: >-
    The core valuation question is not whether Shengshu is interesting; it is whether the current public evidence supports paying an exact late-stage price. On that narrower question, the answer is still no. CNBC confirmed Shengshu's April 2026 Alibaba-led financing but also said the company declined to disclose valuation, while Dealroom only provides a broad public unicorn band of roughly $1 billion to $2.5 billion. At the same time, Shengshu has meaningful positives that stop this from being a simple pass: the company disclosed more than RMB 600 million of Series A+ financing in February 2026, roughly RMB 2 billion of Series B financing in April 2026, a 10x increase in users and revenue during 2025, and a product surface that already spans creator tools, Vidu API, and the ad-oriented Vidu Agent.


    That combination makes Shengshu watchlist-worthy but still price-sensitive. If investors are underwriting an internal mark around $1.5 billion to $1.7 billion, they are implicitly assuming that the company has already converted product quality and commercial usage into a substantial revenue base. Without audited revenue, gross margin, cap-table, or preference disclosures, there is no evidence-backed way to confirm that assumption. The recommendation is therefore Track rather than buy: keep the company active in coverage, but do not commit capital at an opaque mark unless management opens the revenue bridge, gross-margin profile, customer concentration, and dilution stack. The practical rule is simple: the better the price and the cleaner the financial package, the more Shengshu shifts from compelling story to underwritable asset.
