  rows:
  - - Recommendation
    - Track
    - The company is promising, but exact valuation and core economics remain unverified.
    - Keep active coverage; do not commit at opaque unicorn pricing.
  - - Confidence
    - Medium
    - Enough independent reporting exists to bracket a valuation band, but not to underwrite an exact mark.
    - Upgrade only after audited or filing-grade financial disclosure.
  - - Risk rating
    - High
    - Compute, regulation, competition, and financial opacity can all compress the mark at once.
    - Demand a valuation discount and sharper diligence gates.
  - - Valuation stance
    - Stretched
    - A private-growth premium is warranted, but public evidence does not yet prove the revenue needed to support the upper unicorn band.
    - Treat ~$1.5B+ as price-sensitive, not obviously cheap.
  - - Return profile today
    - Asymmetric only at a lower entry
    - Meaningful upside exists if Shengshu proves enterprise-grade economics, but current evidence leaves thin margin of safety at rumored late-stage marks.
    - Prefer a lower price or materially better disclosure before investing.
  notes: This table is price-sensitive rather than company-quality-only. The company can be strong while the current public evidence remains insufficient to support an exact late-stage valuation.
