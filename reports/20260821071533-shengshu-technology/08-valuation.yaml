    severity: material
    topic: revenue-quality-and-margin-bridge
    missingEvidence: ARR by channel, recognized revenue, net retention, gross margin, compute-cost bridge, top-customer concentration, and burn rate.
    whyItMatters: These variables determine whether Shengshu deserves a premium private multiple or a lower platform/consumer mix discount.
    diligencePath: Review monthly management accounts, cohort data, gross-margin bridge, and infrastructure-spend schedules.
