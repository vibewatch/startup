  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Exact post-money valuation, ownership dilution, and preference stack for the April 2026 Series B and earlier 2025 Series A round.
    whyItMatters: Valuation discipline and investor economics cannot be judged from a wide third-party range alone.
    diligencePath: Request the latest cap table, term sheets, and board materials for the 2025-2026 rounds.
    relatedQuestionRefs:
    - QO006
    - QO009
    - QO010
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, independent oversight, committee structure, and shareholder-control rights.
    whyItMatters: Leadership concentration and investor protection cannot be assessed without formal governance documents.
    diligencePath: Obtain board consents, shareholder agreement, and governance policies from management.
    relatedQuestionRefs:
    - QO026
    relatedTableRefs:
    - TO002
  - type: stale
    severity: material
    topic: headcount
    missingEvidence: Fresh employee count and organizational split after March 2024.
    whyItMatters: Scale efficiency, hiring burn, and operating leverage cannot be evaluated with a two-year-old staffing datapoint.
    diligencePath: Request current org chart, HR dashboard, and monthly headcount by function and geography.
    relatedQuestionRefs:
    - QO020
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Audited or management-certified revenue, customer concentration, and gross-margin disclosures for 2025-2026.
    whyItMatters: Company claims about 10x revenue growth and large customer usage are not enough for underwriting.
    diligencePath: Review monthly recurring revenue, top-customer lists, net retention, and gross-margin trends.
    relatedQuestionRefs:
    - QO016
    - QO019
  - type: missing-source
    severity: minor
    topic: footprint
    missingEvidence: A direct public source confirming which non-Beijing cities are operating offices versus only recruiting filters.
    whyItMatters: Global footprint can be overstated if job filters are treated as legal entities or staffed offices.
    diligencePath: Request office lease list and employee distribution by city; verify via local registry or official company materials.
    relatedQuestionRefs:
    - QO028
  - type: conflicting-data
    severity: minor
    topic: benchmark
    missingEvidence: Time-consistent benchmark history reconciling ShengShu No.2-global claim with lower later leaderboard positions.
    whyItMatters: Investors should know whether rank changes reflect methodology shifts, competitive slippage, or selective marketing windows.
    diligencePath: Pull archived leaderboard snapshots and benchmark methodology notes from Artificial Analysis.
