- id: adverse-signals-and-unresolved-disclosure-gaps
  title: Adverse Signals and Unresolved Disclosure Gaps
  body: 'The main company-overview risks are not existential red flags but disclosure and execution caveats. Notebookcheck''s hands-on test of Vidu in September 2025 concluded that the product could create striking visuals but remained too glitch-prone and inconsistent for dependable professional work, underscoring a persistent gap between benchmark marketing and production reliability. Public benchmark positioning also appears time-sensitive: company PRs framed Vidu Q3 as No.1 in China and No.2 globally in early 2026, but August 2026 Artificial Analysis snapshots show lower rankings for both text-to-video and image-to-video. Governance disclosure is thinner still: public sources reviewed do not identify the board, independent oversight, ownership rights, or audited financial statements, and even basic current metrics such as headcount and exact lifetime funding remain only partially observable. The jobs portal does suggest recruiting across Beijing, Shanghai, Shenzhen, and San Francisco,
    but that should not be mistaken for fully documented operating headquarters beyond Beijing. Investors should treat Shengshu as a fast-moving but still opaque private company whose strongest facts are about technical shipping velocity rather than institutional transparency.'
