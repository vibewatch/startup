callouts:
- calloutType: strength
  title: Research-to-product speed is the clearest moat signal
  body: 'Shengshu has consistently turned research claims into shippable product surfaces: Vidu, subject consistency, Vidu 2.0, API, Agent, TurboDiffusion, and real-time S1 all landed within roughly two years of incorporation. That cadence, plus strategic funding from Alibaba Cloud and repeated enterprise-use references, is the strongest observable sign that the company can translate model quality into commercial workflow relevance.'
  claimRefs:
  - CO011
  - CO013
  - CO014
  - CO016
  - CO021
  - CO023
- calloutType: risk
  title: Institutional transparency still lags technical momentum
  body: Shengshu is easy to understand as a model-shipping startup but much harder to diligence as an institution. Public sources do not disclose a current board, exact cap table, audited financials, or a precise current valuation, and even seemingly basic figures such as current headcount rely on stale or range-based sources. That opacity matters because strong technical progress can coexist with weak governance, concentrated control, or economically expensive customer acquisition.
  claimRefs:
  - CO019
  - CO020
  - CO027
  - CO036
  - CO040
- calloutType: risk
  title: Benchmark and demo leadership should not be confused with reliable production quality
  body: Shengshu PRs present top-tier benchmark status, but independent hands-on testing still reports prompt-following errors, broken physical consistency, and distorted reference images. Investors should therefore separate frontier-model positioning from production-dependable quality when valuing the company enterprise and media narratives.
  claimRefs:
  - CO033
  - CO034
  - CO035
