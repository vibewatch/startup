company:
  name: Shengshu Technology
chapter:
  number: 1
  title: Company Overview
  summary: Shengshu Technology is a Beijing-founded, Tsinghua-linked multimodal AI company created in March 2023 whose flagship Vidu platform has expanded from a Sora-style text-to-video model into a broader SaaS, API, agent, and real-time avatar stack. Public sources support at least a unicorn-scale valuation range and more than $380 million of cumulative funding by 2026, but exact lifetime funding, current post-money valuation, board composition, and current headcount remain only partially disclosed. The strongest verified operating signals are rapid product cadence, enterprise and creator adoption claims, and repeated backing from top Chinese strategic and financial investors including Alibaba Cloud, Qiming, Baidu-linked funds, and the Beijing AI fund.
sections:
- id: identity-headquarters-and-product-scope
  title: Identity, Headquarters, and Product Scope
  body: 'Shengshu Technology is a Beijing-based generative AI company incorporated on March 6, 2023, with its registered address in Haidian District at Dongsheng Building on Zhongguancun East Road. Multiple sources tie the company to Tsinghua University research roots and to the earlier U-ViT architecture work that predated Vidu commercialization. The company''s core product is Vidu, a multimodal video generation platform spanning text-to-video, image-to-video, and reference-to-video workflows, later extended into API, agent, and real-time avatar products. Public company materials position Shengshu as selling both MaaS and SaaS, while third-party profiles indicate a mix of subscription revenue and corporate usage. The identity question matters because later chapters depend on a clean baseline: this is not just a consumer toy app, but a research-heavy Chinese video-model startup with a commercial platform, a Beijing legal entity, and a product family already pushed into global distribution.'
