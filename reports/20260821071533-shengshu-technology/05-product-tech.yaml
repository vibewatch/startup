  - id: core-model-architecture-and-engineering-stack
    title: Core Model Architecture and Engineering Stack
    body: >-
      Shengshu's technology stack has unusually visible technical roots. The original Vidu paper describes the model as a
      diffusion system using U-ViT as its backbone, with explicit claims of 1080p generation and up to 16-second single
      generation, plus strong coherence and controllable-video experiments such as canny-to-video, video prediction, and
      subject-driven generation. Later company releases suggest that the commercialization layer has been built by adding
      controllability, consistency, and inference acceleration rather than by replacing that core architecture. Vidu 1.5
      added multiple-entity consistency, multi-angle consistency, and advanced camera control. Vidu 2.0 then emphasized a
      full-stack inference accelerator, lower latency, lower cost, and template abstractions. By late 2025, TurboDiffusion
      and SageAttention pushed the engineering story further into inference infrastructure, with open-source materials
      detailing sparse attention, quantization, sampling-step distillation, and example deployment patterns. The key
      takeaway is that Vidu's differentiation is not one algorithmic trick. It is the compounding of multimodal video
      generation, reference consistency, control, audio, and systems engineering.
    claimRefs:
      - CE006
      - CE007
      - CE008
      - CE009
