  - id: trust-safety-privacy-and-quality-controls
    title: Trust, Safety, Privacy, and Quality Controls
    body: >-
      Shengshu has some visible trust and control surfaces, but they are not yet the kind of public assurance package that
      reduces enterprise adoption friction on their own. The help center explicitly includes content moderation, credits,
      subscriptions, and blocked-account recovery, implying that moderation, fraud, and account-enforcement workflows do
      exist. The Vidu S1 page separately warns that the feature involves personal information processing, which matters
      because the product supports image uploads, voice selection, and voice cloning for digital-human interactions.
      However, reviewed public materials did not surface a public status page, public incident history, SOC 2 or ISO
      certifications, detailed model cards, red-team reports, or quantified safety-performance metrics. Notebookcheck's
      test is therefore relevant not only as a product review but as a quality-control warning: if prompt obedience,
      physical consistency, and reference fidelity still fail materially in live usage, customer trust and repeat adoption
      may lag benchmark marketing. The trust story is directionally present but substantively incomplete.
    claimRefs:
      - CE020
      - CE021
      - CE022
      - CE023
      - CE033
      - CE034
      - CE035
    tableRefs:
      - TE004
  - id: product-tech-verdict-and-blockers
    title: Product-Tech Verdict and Blockers
    body: >-
      Shengshu clears the most important product-tech bar for diligence: there is a real and fast-moving product platform
      here, not merely a frontier-model funding narrative. The evidence base supports a technically serious stack with a
      visible research core, repeat product releases, production-facing APIs and tooling, and concrete attempts to solve
      latency, consistency, and workflow packaging. That is a materially stronger posture than a startup whose story rests
      only on a demo website. The blockers sit one layer higher. Buyers and investors still lack confidence on deployment
      reliability, safety governance, enterprise controls, and how much of the technical edge is durable versus rapidly
      copied by better-capitalized peers. Product conviction should therefore be high on breadth and cadence, moderate on
      defensible technical lead, and only moderate-to-low on trust maturity until Shengshu exposes more production-grade
      control evidence.
    claimRefs:
      - CE019
      - CE020
      - CE023
      - CE025
      - CE032
      - CE035
