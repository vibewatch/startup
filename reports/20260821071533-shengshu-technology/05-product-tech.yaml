  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: production-reliability
      missingEvidence: Quantified generation success rates, audio-sync failure rates, uptime, queue latency, live concurrency, and refund or regeneration rates by product mode.
      whyItMatters: Product breadth is meaningful only if outputs are reliable enough for repeat commercial use and live deployments.
      diligencePath: Request product telemetry dashboards, incident logs, customer support metrics, and mode-level QA reports for the last two quarters.
      relatedQuestionRefs:
