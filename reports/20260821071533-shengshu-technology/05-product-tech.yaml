company:
  name: Shengshu Technology
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Shengshu's product story is unusually concrete for a young frontier-model company. Public sources support a real,
    multi-surface product stack rather than a single demo: Vidu spans text-to-video, image-to-video, reference-heavy
    video generation, native audio-video generation, developer APIs, creative templates, workflow automation, and a new
    real-time digital-human mode in Vidu S1. The technical core is also legible. Shengshu's paper describes Vidu as a
    diffusion model built on a U-ViT backbone, capable of 1080p output and up to 16 seconds in a single generation,
    while later releases layer in multi-entity consistency, camera control, native audio, lip-sync, and acceleration.
    TurboDiffusion and related GitHub repositories add rare practitioner evidence that Shengshu can translate research
    into engineering artifacts. The main weakness is not product absence but trust and reliability maturity: public help
    and moderation surfaces exist, yet reviewed sources do not show the kind of public model cards, certification,
    incident transparency, or rigorous production-quality evidence that would remove implementation risk for large
    enterprise customers.
sections:
  - id: product-definition-and-module-map
    title: Product Definition and Module Map
    body: >-
      In customer workflow terms, Vidu is not just an AI model; it is a creative operating stack. The public surface now
      covers classic prompt-based generation modes such as text-to-video and image-to-video, reference-heavy generation
      for character or object continuity, native-audio storytelling, workflow automation for ads and commerce, API access
      for developers, and real-time interactive avatar generation via Vidu S1. The Q3 page is especially helpful because
      it frames the product around end use rather than lab metrics: finished clips with dialogue, sound effects, and
      music generated together; longer 16-second single-pass outputs; camera-language control; multilingual output; and
      readiness for comic drama, short series, and narrative ads. The S1 / stream surface expands that definition again,
      positioning Vidu as a live interaction layer for voice-controlled digital characters rather than only batch clip
      rendering. That breadth matters because Shengshu appears to be solving several adjacent jobs-to-be-done: creative
      ideation, production acceleration, localization, ad-asset generation, interactive avatars, and developer embedding.
      The module map therefore looks more like a platform roadmap than a single-model feature list.
    claimRefs:
