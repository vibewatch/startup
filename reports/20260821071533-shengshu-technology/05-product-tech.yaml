      topic: enterprise-controls
      missingEvidence: Publicly reviewed sources do not show enterprise security architecture, audit controls, SLA terms, data retention standards, or customer-specific isolation guarantees.
      whyItMatters: Large buyers will assess Vidu as a workflow platform, not only a model demo, and therefore need operational assurances.
      diligencePath: Review enterprise security docs, architecture diagrams, contractual SLAs, data-processing addenda, and customer onboarding controls.
