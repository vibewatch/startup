  - id: deployment-integration-and-operational-workflow
    title: Deployment, Integration, and Operational Workflow
    body: >-
      Deployment evidence suggests that Shengshu is trying to behave like a production platform, not just a research lab.
      The API platform, CLI tooling, GitHub repositories, and help-center content show multiple operational layers:
      developers can access the API surface, automate uploads and tasks, choose model versions and durations, manage lip
      sync and text-to-speech jobs, and retrieve outputs programmatically. The MaaS API update adds another important
      integration signal: Model Context Protocol support lets tools such as Claude and Cursor choose video-generation modes
      through conversational workflows instead of manual API orchestration. That is strategically significant because it
      makes Vidu easier to embed inside agentic and workflow tools rather than only standalone web UI usage. Support and
      onboarding infrastructure are still lighter than large enterprise software norms, but the existence of CLI, skill,
      docs, and customer-support surfaces means Shengshu already ships an ecosystem around the core model. This section of
      the stack looks commercially useful today, though it still appears more startup-native than enterprise-hardened.
    claimRefs:
      - CE005
      - CE012
      - CE013
      - CE014
      - CE015
      - CE024
      - CE029
      - CE038
    tableRefs:
      - TE002
  - id: differentiation-benchmarks-and-maturity-trajectory
    title: Differentiation, Benchmarks, and Maturity Trajectory
    body: >-
      Vidu's product differentiation is strongest where consistency, speed, and workflow packaging intersect. Public
      releases repeatedly emphasize subject or entity consistency, camera control, long single-pass generation, native
      audio, and reference-based production rather than generic prompt-to-video novelty. Artificial Analysis leaderboards
      provide third-party evidence that Vidu remains an upper-tier global contender, even if not unambiguously the global
      best. The GitHub and PR materials around TurboDiffusion strengthen the case that Shengshu is attacking one of the
      category's core bottlenecks—latency—at a systems level. Meanwhile, the roadmap from subject consistency in 2024, to
      Vidu 2.0 speed and templates in early 2025, to audio-capable Q3, MaaS lip-sync/MCP, and real-time S1 in 2026 shows
      a coherent move from offline clip generation toward a richer production and interaction platform. The maturity caveat
      is that the most impressive claims still lean heavily on company-controlled materials, while benchmark positions and
      public hands-on reviews suggest performance leadership is real but not settled.
    claimRefs:
      - CE008
