  topStrengths:
    - Vidu has credible product visibility across independent AI-video benchmarks and continuous release cadence.
    - Shengshu has raised very large recent rounds and attracted strategic investors including Alibaba Cloud.
    - Public company claims point to substantial commercial usage, creator reach, and developer / enterprise adoption.
    - Business model breadth spans creator tools, API access, and workflow products such as Vidu Agent.
    - The company appears better capitalized and more commercially ambitious than smaller AI-video peers such as Pika.
  topRisks:
    - Exact April 2026 post-money valuation, cap table, and liquidation-preference structure remain undisclosed.
    - No public ARR, gross margin, burn, customer concentration, or net-retention disclosure was found.
    - Advanced-computing export controls and Chinese AI regulation directly affect the cost and risk profile.
    - Public customer proof is meaningful but still too partner-platform-heavy to prove durable revenue quality.
    - >-
      Competition from Runway, Kling, MiniMax, ByteDance, and other well-capitalized AI-video players can compress
      pricing and attention.
  unresolvedGaps:
    - Exact last-round post-money valuation and cap-table / preference terms are not publicly available.
    - ARR by product line, gross margin, burn rate, and compute-cost bridge remain undisclosed.
    - Retention, churn, enterprise ACV, and top-customer concentration are not visible publicly.
    - >-
      Compute-sourcing resilience and regulatory-compliance implementation need management-grade diligence, not just
      public inference.
    - >-
      A fresh, standardized direct-comparable revenue and valuation refresh is still needed before a live investment
      decision.
