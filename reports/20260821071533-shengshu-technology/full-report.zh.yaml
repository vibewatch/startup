      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Shengshu 面临的中国监管负担很重，而且是持续的，不是假设风险。2023
              年《生成式人工智能服务管理暂行办法》直接适用于面向公众的视频生成服务，要求数据来源合法、禁止内容可控、隐私受保护、投诉可处理、服务安全稳定。2025
              年标识措施更进一步，要求生成视频带显式标识、元数据带隐式标识；当应用提供生成式 AI
              服务时，互联网应用分发平台还要做检查。这些标识要求建立在更早的深度合成和算法推荐规则之上，也会影响备案和安全评估预期。实务上，Shengshu
              有三类相关法律暴露：第一，内容合规和审核失败；第二，如果训练或推理输入处理不当，可能引发数据来源、隐私或 IP
              挑战；第三，算法备案或标识文件不完整带来的流程风险。监管环境并不禁止增长，中国规则也明确谈到鼓励创新，但合规会成为永久运营成本；如果公司做错，还会有服务暂停风险。
