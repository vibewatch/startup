      - number: '8.2'
        title: 可比区间与可支撑范围
        blocks:
          - type: paragraph
            body: >-
              避免伪精确的最干净方法，是用三组参照来三角定位 Shengshu：直接 AI 视频可比公司、更广义 AI / 软件公开市场倍数，以及 Shengshu 自己披露的商业信号。直接私营可比公司中，Runway
              处于高端，2026 年 2 月估值 $5.3 billion、累计融资约 $860 million；Luma 完成 $900 million C 轮后估值达到 $4 billion；MiniMax 后来达到 $4
              billion 增长期标记，累计融资约 $1.1 billion；Pika 则小得多，估值约 $470 million，2024 年收入 $7.6 million。从可见规模和战略资本看，Shengshu 应高于
              Pika；但即便与围绕 Runway 或 MiniMax 的二手报道相比，它仍缺少已披露收入深度和投资级财务透明度。


              公开市场锚点是有用的现实校验。Multiples.vc 2026 年 8 月软件数据显示，公开 AI 与设计工程软件约按未来十二个月收入 4.0x 到 4.2x
              交易；媒体与娱乐软件概览也提醒投资人，高毛利创意订阅与低得多毛利的云渲染或基础设施业务，收入质量差异巨大。Shengshu 不是公开 SaaS
              公司，如果商业使用转化顺利，应获得私营增长溢价。但这一溢价不能无限。$1.5 billion 股权价值意味着在 10x 下需要约 $150 million 可持续收入，在 12x 下需要约 $125
              million，在 14x 下需要约 $107 million。$2.0 billion 标记要求更高。这些门槛对快速扩张的 AI 视频领导者并非不可能，但公开证据没有确认 Shengshu
              已经达到。正确结论不是公司一定高估，而是当前估值论证建立在未经验证的收入假设上。
            claimRefs:
