      - number: '1.2'
        title: 创始人、领导层与组织设置
        blocks:
          - type: paragraph
            body: >-
              领导层披露有意义，但并不完全干净。2024 年底的公开英文报道将 Jiayu Tang 描述为 Shengshu 联合创始人兼 CEO；2026 年 CNBC 报道引用 Zhu
              Jun，称其为创始人，公司声明则称其为创始人兼首席科学家。Dealroom 的梳理最能对齐各方说法：Tang 是联合创始人兼前 CEO，Bao Fan 是 CTO，Zhu Jun
              是与清华深度绑定的首席科学家，Luo Yihang 则是从 ByteDance 旗下 Volcano Engine 引入的高管，担任 CEO，负责研究、产品和商业化，Tang
              转任总裁。领导层交接说明，Shengshu 在 2025-2026
              期间从创始人主导的技术孵化，转向更规模化的运营结构。缺口仍在于：公开资料没有董事会构成、正式治理结构或控制权披露，关键人物集中度和治理尽调仍然悬而未决。
