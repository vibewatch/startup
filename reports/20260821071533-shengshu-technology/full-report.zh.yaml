  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与竞争类别
        blocks:
          - type: paragraph
            body: >-
              Shengshu 所处的 AI 视频格局拥挤但仍不成熟，直接、相邻和替代型竞争者彼此重叠。直接同业包括已经交付文生视频或图生视频、创作者界面，并至少具备
              API、企业或生产工作流功能之一的平台。按这个标准，最接近的对手是 Runway、Kling、Hailuo / MiniMax、Pika、Luma、Jimeng、PixVerse 和
              Wan。第三方证据支持这个分组。Artificial Analysis 把 Hailuo、Kling、Sora、Vidu 和 Wan 放在同一个基准家族中比较；a16z 的 March 2025 消费者排名把
              Hailuo、Kling 和 Sora 点名为新近重要的网页产品，同时把 Runway 放在 Brink List。市场里也有重要替代品，而不只是直接同业：Stable Video Diffusion 和 Wan
              等开放模型或研究替代方案，大型 AI 实验室或云厂商的内部自建，以及依靠剪辑师、代理公司或内部创意团队手工制作视频的现状。Shengshu
              的战略问题因此不是「还有谁能生成一个片段？」，而是「哪个对手掌握了买方最想要的质量、工作流深度、价格清晰度、本地化和分发组合？」
