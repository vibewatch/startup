              Hailuo、Kling 和 Jimeng 表明，Shengshu 最难的竞争问题既是本地的，也是全球的。中国既有玩家和多模态平台可以把文化本地 UX
              与大型消费者生态结合起来，而全球专业玩家则赢在专业工作流深度。
            calloutType: insight
