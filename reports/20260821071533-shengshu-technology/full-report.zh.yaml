  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 按买方、用户和付款方划分的客户分层图
        blocks:
          - type: paragraph
            body: >-
              Shengshu 的客户基础更像分层结构，而不是单一客群。流量端是创作者和自助用户，用 Vidu 做社交内容、短视频和实验。高价值端是开发者、企业客户、营销人员和合作平台，把 Vidu
              嵌进自己的工作流或最终产品。公司反复面向广告、电影、动画、电商、移动广告、文旅和教育营销，说明 Vidu 为不同付款方解决不同任务：创作者购买访问权和积分，开发者购买 API
              用量，企业或商业团队购买活动产能或工作流加速。这一区分很重要，因为用户数不等于收入质量。公开来源暗示按使用量看最大群体是创作者，而战略上最重要的群体是能以更高客单价产生经常性用量的平台合作伙伴和 B2B
              客户。因此，客户分层很宽、全球化，也具商业吸引力，但披露还不够细，无法看出业务真正锚在哪里。
