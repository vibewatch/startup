            body: >-
              Shengshu 的技术栈有异常清晰的技术根基。最初的 Vidu 论文把模型描述为以 U-ViT 为主干的扩散系统，并明确声称可生成 1080p、单次最长 16 秒，还展示了强一致性和可控视频实验，如
              canny-to-video、视频预测和主体驱动生成。后续公司发布显示，商业化层不是替换核心架构，而是在其上叠加可控性、一致性和推理加速。Vidu 1.5 增加多实体一致性、多角度一致性和高级镜头控制。Vidu
              2.0 随后强调全栈推理加速器、更低延迟、更低成本和模板抽象。到 late 2025，TurboDiffusion 和 SageAttention
              又把工程叙事推进到推理基础设施，开源材料详细说明稀疏注意力、量化、采样步蒸馏和示例部署模式。关键结论是，Vidu 的差异化不是一个算法技巧，而是多模态视频生成、参考一致性、控制、音频和系统工程的复利。
