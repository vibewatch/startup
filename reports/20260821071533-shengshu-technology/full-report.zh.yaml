              Vidu 的产品差异化，最强处在一致性、速度和工作流封装的交叉点。公开发布反复强调主体或实体一致性、镜头控制、长时单次生成、原生音频，以及基于参考素材的生产，而不是泛泛的文本生成视频新鲜感。Artificial
              Analysis 排行榜提供了第三方证据：Vidu 仍是全球第一梯队竞争者，即便还不能明确说是全球最好。围绕 TurboDiffusion 的 GitHub 和新闻稿材料也加强了一个判断：Shengshu
              正在系统层面攻 AI 视频类别的核心瓶颈之一——延迟。与此同时，路线图从 2024 年的主体一致性，到 2025 年初的 Vidu 2.0 速度和模板，再到 Q3 的音频能力、MaaS 口型同步 / MCP，以及
              2026 年实时 S1，显示公司正从离线短片生成，连贯地走向更丰富的生产和交互平台。成熟度的限制在于，最亮眼的主张仍高度依赖公司自控材料；基准位置和公开上手评测说明性能领先真实存在，但结论尚未落定。
