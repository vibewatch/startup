      - number: '3.5'
        title: 护城河耐久性与反向竞争证据
        blocks:
          - type: paragraph
            body: >-
              反向证据很直接：Shengshu 没有干净的功能垄断。Runway 和 Luma 正在向专业和企业工作流更深处推进；Kling、Hailuo 和 Jimeng 具备文化本地产品适配和强消费者势能；PixVerse
              在推进工作流编排和 API 界面；Stable Video Diffusion 和 Wan 等开放模型替代方案，降低了在任何托管 SaaS 平台之外试验的成本。即便 OpenAI 的 Sora
              不再是活跃消费者产品，它也帮助重置了买方对前沿视频模型能力的预期。公开披露同样不均衡。官方网站通常最擅长功能营销，最弱的是已实现企业定价、净留存或经审计使用量，这意味着任何严肃比较里都会有部分行停留在未知或二手来源。竞争结论因此是混合的：Shengshu
              有合理机会在中国原生视频质量和商业速度上获胜；但除非它能把模型质量与持久分发、企业工作流粘性和合规执行结合起来，并且做得比生态更大或资本更深的对手更好，否则护城河并不稳。
