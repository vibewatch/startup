      - number: '1.4'
        title: 里程碑、商业化与认可
        blocks:
          - type: paragraph
            body: >-
              Shengshu 最突出的强项是产品节奏。公司 April 2024 发布 Vidu，July 2024 全球上线，随后在 November 2024 推出 Vidu 1.5、February 2025 推出企业
              API、January 2025 推出 Vidu 2.0，2025-2026 持续升级偏重参考一致性的 Q 系列，December 2025 推出 TurboDiffusion 和一键式 Vidu
              Agent，July 2026 推出实时 Vidu S1 模型。公司声明把这条路线图与商业化提速相连：据称 Vidu 覆盖超过 200 个国家和地区，mid-2026 已服务超过 40 million
              创作者、超过 10,000 名开发者或企业客户，具名商业用户包括 ByteDance、Samsung、TAL、Alipay、JD.com、Amazon、L'Oréal、Tencent
              Animation、iQIYI 和 Mango TV。外部验证存在，但并不单向。Shengshu 入选 World Economic Forum Technology
              Pioneer，并多次被基准测试引用，说明品类地位成立；但当前 Artificial Analysis 快照把 Vidu Q3 Pro
              放在上层，却还不是全球顶端。因此，商业化叙事可信，但仍然高度依赖公司自称，而不是经审计的使用量或收入披露。
