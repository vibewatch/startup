      - number: '4.3'
        title: 牵引信号与收入质量
        blocks:
          - type: paragraph
            body: >-
              Shengshu 披露的牵引令人鼓舞，但高度依赖自报。最强商业叙事来自 Series A+ 和 Global Creativity Week 发布稿：公司称 2025 年用户和收入都增长超过 10x，Vidu
              已覆盖超过 200 个国家和地区，服务超过 40 million 创作者和超过 10,000 名开发者及企业客户，生成视频超过 500 million，且商业项目占产出的超过
              70%。如果准确，商业项目占比尤其有意义，因为它暗示 Vidu 用于可变现工作，而不只是实验。问题不是这些说法不可信，而是它们未经审计。公司仍没有披露
              ARR、MRR、按产品划分的收入结构、留存、企业集中度或队列转化。Notebookcheck
              的上手评测在这里是有用的反向校验：如果生产可靠性仍落后于基准营销，部分漏斗顶部创作者活动未必能干净转成持久付费使用。因此，收入质量应被视为有希望但未证实——如果伙伴和企业主张成立，它强于纯消费者玩具；但距离尽调级证据仍有差距。
