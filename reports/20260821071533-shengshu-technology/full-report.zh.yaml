  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 风格打分，衡量 Shengshu 在市场位置、证据质量、经济性可见度和估值支撑上的表现。
    data:
      items:
        - label: 产品地位
          value: 8/10
          note: Vidu 看起来技术可信，公司出货节奏也快。
        - label: 商业动能
          value: 7/10
          note: 使用量和客户口径很强，但多数来自公司自述。
        - label: 企业端证据
          value: 6/10
          note: OpenArt、eachlabs、PhotoGrid 和开发者渠道有意义，但不能证明留存质量。
        - label: 利润率可见度
          value: 3/10
          note: 未找到公开毛利率、烧钱速度或算力成本拆解。
        - label: 披露质量
          value: 3/10
          note: 精确投后估值、股权结构表和董事会层面的经济性仍不透明。
        - label: 监管 / 算力韧性
          value: 4/10
          note: 资本有帮助，但政策和先进计算约束仍应带来折价。
        - label: 当前估值支撑
          value: 4/10
          note: 公司可能配得上独角兽估值，但公开记录尚未证明区间上沿。
        - label: 证据质量
          value: 5/10
          note: 足以圈定区间并建议观察，不足以支撑高确信度买入。
    approximationNotes: 分数带有主观判断，且为相对分，采用 1-10 分，分数越高越好。分数只总结公开证据。
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV011
      - CV024
      - CV027
      - CV037
      - CV042
