      - number: '2.4'
        title: 需求驱动因素与工作流迁移
        blocks:
          - type: paragraph
            body: >-
              需求同时被媒体消费量和工作流成熟度拉动。Pew 发现，美国成年人中 83% 使用 YouTube、68% 使用 Facebook、47% 使用 Instagram、33% 使用 TikTok；YouTube
              自己的 2024 U.S. impact report 称，平台创作者生态为 U.S. GDP 贡献 $55 billion，并且 YouTube 在 2021 到 2023
              之间向创作者、艺术家和媒体公司支付超过 $70 billion。这个宏观背景解释了为什么 AI
              视频工具不需要先替代电影；它们只要降低持续短视频、活动、教育和产品视频生产的成本即可。第二个需求驱动是能力成熟。a16z 在 March 2025 写道，过去六个月视频质量和可控性大幅进步，中国模型 Hailuo
              和 Kling 到 January 2025 已在月度网站访问量上超过 Sora，供应商差异化正在围绕提示词遵循、唇形同步和镜头控制出现。官方产品页也强化了这一点：厂商正在交付参考控制、智能体剪辑、语音 /
              唇形同步、现成广告模板、CLI 批量执行和 API 优先编排等工作流功能。这个演进把品类从新奇玩具推向工作流软件。约束仍然重要。OpenAI 关闭 Sora 消费者产品并在 2026 计划停用
              API，说明平台可用性和商业化路径会快速变化；即便是前沿实验室，市场领导地位也不是永久的。
            claimRefs:
