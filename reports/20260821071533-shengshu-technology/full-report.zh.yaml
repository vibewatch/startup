      - number: '1.3'
        title: 融资、资本结构与利益相关方
        blocks:
          - type: paragraph
            body: >-
              Shengshu 自 2023 年以来频繁融资，但公开披露质量参差不齐。最硬的披露是 February 2026 超过 RMB 600 million 的 Series A+，以及 April 2026 由
              Alibaba Cloud 领投的 RMB 2 billion Series B；更早的融资历史则要靠 Baiduwiki 和 Dealroom 重建。这些资料指向 June 2023 近 RMB 100
              million 的天使轮、August 2023 的天使+轮、March 和 June 2024 的数亿元人民币轮次，以及 September 2025 的数亿元人民币 Series A。Dealroom 将
              Shengshu 标为独角兽，并给出 $1-2.5 billion 的宽估值区间；但 CNBC 明确指出，公司拒绝披露 April 2026 轮的估值。实际尽调结论是，Shengshu
              明显已经达到风险投资规模，也足够具有战略重要性，能吸引 Alibaba Cloud、Qiming、Baidu 系投资方、北京 AI
              基金和多家产业伙伴；但投资人面对的准确累计募资、稀释、清算优先权、当前所有权控制仍然相当不透明。
