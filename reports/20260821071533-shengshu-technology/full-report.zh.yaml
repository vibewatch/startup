  - id: TV004
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 关键风险
    rows:
      - - 乐观
        - 商业项目占比被证明真实，收入运行率达到约 $140M-$180M+，企业 / API 组合增强，产品质量保持在品类前列。
        - 按高于公共 AI / 软件可比公司的私人成长期溢价倍数，对应 ~$1.8B-$3.0B；只有从低端价格入场才有吸引力上行。
        - 如果公司当前声称的使用指标能顺利转成稳定收入，该情景就可能成立。
        - 需要比当前公开证据更干净的毛利、留存和合规证明。
      - - 基准
        - 收入运行率落在约 $80M-$120M，增长仍强，但创作者、合作伙伴和企业渠道表现分化，市场给予中等私有溢价。
        - ~$0.9B-$1.6B；仅凭公开证据，这是当前最能支撑的区间。
        - 最符合“产品信号强、经济性不完整”的组合。
        - 毛利受压、伙伴依赖和流失披露不足，仍可能把结果推低。
      - - 悲观
        - 收入质量不达预期，企业验证仍薄，算力或监管摩擦上升，倍数向较低软件水平压缩。
        - ~$0.5B-$0.9B，意味着高价后期入场有实质下行。
        - 如果不透明延续到下一轮融资窗口，该情景可信。
        - 产品仍有相关性，但经济性始终无法证明，估值因此重置。
    notes: 这些区间服务于入场纪律，而不是追求模型精确估值。它们把缺失的收入证据转成具体的估值后果。
