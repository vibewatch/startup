        - 最新私募融资
        - 2026 年 2 月以 $5.3B 估值融资 $315M；累计融资 ~$860M
        - 资金最充足的美国直接 AI 视频可比公司，也是溢价参考
        - 比 Shengshu 披露了更多规模、投资方阵容和全球企业验证
      - - Luma AI
        - 最新私募融资
        - 2025 年 11 月以 $4.0B 估值融资 $900M
        - 直接的高端 AI 视频可比公司，且释放大型战略资本信号
        - 收入仍未公开披露
      - - MiniMax
        - 后期私募 / 成长期估值
        - 在早前 $2.5B 轮次后，后期成长期估值为 ~$4.0B；累计融资 ~$1.1B
        - 中国多模态可比公司，资本基础大，且已有公开市场路径
        - 产品范围比 Shengshu 更宽，公开阶段也更靠后
      - - Pika
        - 私募融资 + 收入快照
        - 估值 ~$470M，融资 ~$135M，2024 年收入 $7.6M
        - 有用的底部可比，展示较小 AI 视频玩家的形态
        - 规模早很多，收入质量也可能不同
      - - 公共市场 AI / 设计软件组合
        - NTM 收入倍数
        - 2026 年 8 月公开可比公司为 ~4.0x-4.2x NTM 收入
        - 校准已披露公共软件公司的交易区间
        - 私有 AI 视频龙头可以享有溢价，但不能没有证据
    notes: 这些可比对象用于框定 Shengshu，而不是假装公司完全相同。关键结论是相对位置：Shengshu 应该比 Pika 享有溢价，但公开记录尚不足以给予它与 Runway、Luma 或 MiniMax 同等的置信度。
    enumerationScope:
