      - number: '2.3'
        title: 买方、用户与付款方架构
        blocks:
          - type: paragraph
            body: >-
              市场不是一个单一创作者池。它至少拆成六个商业上不同的分部，各自有不同预算负责人和采用触发点。第一，营销团队和代理公司购买速度、迭代量和活动创意的成本压缩；分析师数据表明营销和广告已经是最大应用，因此这是近期最重要的分部。第二，零售和电商运营方需要动态产品展示、本地化短视频和目录级素材生产。第三，媒体、娱乐和工作室用户看重更高端的可控性、一致性和生产工作流。第四，个人创作者和准专业消费者以免费增值或点数层进入，对
              UX、趋势工具和移动端分发高度敏感。第五，开发者和工作流构建者买的是 API、CLI 工具和编排原语，而不是面向消费者的订阅。第六，企业创新、教育和内部内容团队用 AI
              视频做培训、产品说明和内部沟通。官方竞品界面让这种分层不需要猜测就能看见：Runway 区分创意、开发和机器人产品线；Kling 把消费者创作与 API 和移动端打包；Pika 主推智能体和应用；PixVerse
              暴露 CLI、智能体、营销中心和 API；Jimeng 优化中文提示和社区二创循环。因此，Vidu 同时在 B2C 和 B2B
              走廊竞争，但经济上重要的买方大概率是企业营销人员、开发者和媒体团队，而不是随手试用的免费创作者。
