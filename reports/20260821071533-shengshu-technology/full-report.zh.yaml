chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与产品范围
        blocks:
          - type: paragraph
            body: >-
              Shengshu Technology 是一家位于 Beijing 的生成式 AI 公司，成立于 March 6, 2023，注册地址位于 Haidian District Zhongguancun East
              Road 的 Dongsheng Building。多方资料把公司与清华大学研究根基，以及早于 Vidu 商业化的 U-ViT 架构工作联系起来。公司的核心产品是
              Vidu，一个多模态视频生成平台，覆盖文生视频、图生视频和参考图生视频工作流，后来又延伸到 API、智能体和实时数字人产品。公司公开材料将 Shengshu 定位为同时销售 MaaS 和
              SaaS，第三方画像则显示收入来自订阅和企业使用的组合。身份问题很关键，因为后续章节需要一个清晰基线：这不只是一个消费者玩具应用，而是一家研究密集型中国视频模型初创公司，有商业化平台、Beijing
              法人主体，并且产品家族已经推向全球分发。
