      - number: '2.5'
        title: 监管、算力与跨境访问
        blocks:
          - type: paragraph
            body: >-
              监管对 Shengshu 是一阶市场变量，因为它的本土市场在中国，产品输出又是面向公众的合成媒体。中国《生成式人工智能服务管理暂行办法》于 August 15, 2023
              生效，并明确适用于生成文本、图像、音频、视频和配套内容的公共服务。已审阅监管资料对运营义务讲得异常清楚：提供者必须处理合法训练数据和 IP
              来源、个人信息保护、内容安全、投诉处理、透明度，以及必要时的备案或安全评估要求。China Law Translate 对该办法的译文在 Article 12
              里把视频特定义务说得很直白：提供者应按深度合成规则标注生成图像和视频；Article 14 进一步要求移除违法内容并处置滥用用户。March 2025 中国发布标识规则后，这些义务进一步变硬；规则将于
              September 1, 2025 生效，要求可见标识加技术标识，并禁止删除或隐匿这些标识。跨境供给又加了一层约束。BIS 在 May 2026 发布的指引重申，面向中国或 D:5 总部实体的受管先进计算物项仍需
              U.S. 出口许可，即便这些实体在中国境外接收物项也是如此。一家中国视频模型公司面对的是直接输入成本和硬件访问风险，不是抽象的地缘政治脚注。
            claimRefs:
              - CM029
              - CM030
              - CM031
              - CM032
              - CM033
              - CM034
      - number: '2.6'
        title: Shengshu 相关 SAM 与未解决规模缺口
        blocks:
          - type: paragraph
            body: >-
              最站得住脚的 Shengshu 规模测算视角，不是一个无差别的数十亿美元全球 AI 视频 TAM。更干净的近期视角，应从 Fortune 的 $847 million 2026 AI 视频生成器市场出发，再剥离出
              46.25% 的文生视频切片，得到估计 $392 million 的全球文生视频收入池。套用 Fortune 的 20.9% Asia-Pacific 份额，意味着约 $82 million 的 APAC
              归因文生视频切片；同一报告又单独提到 China 在 2026 为 $49 million。另一个不同但互补的视角，是剥离 33.88% 的营销和广告切片，得到约 $287 million 的 2026
              年活动生产工作流支出。这些计算不能得出 Shengshu 的实际 SOM；它们只是说明，公司最容易立刻变现的竞技场，全球大概率只有几亿美元，在可观察 China / APAC 切片内还要小得多。如果市场份额、企业
              ACV 和全球扩张足够强，这个规模仍可能支撑一个独角兽；但公开数据还不足以揭示中国企业特定支出、免费转付费、API 收入结构，或非中国买方采用中国视频模型的意愿。投资人应把这里的 TAM
              工作当作三角校验，而不是客户和收入尽调的替代品。
            claimRefs:
              - CM036
              - CM037
              - CM038
              - CM039
              - CM040
