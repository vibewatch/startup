  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              核心估值问题不是 Shengshu 是否有意思，而是当前公开证据是否支持支付一个精确的后期价格。在这个更窄的问题上，答案仍是否定的。CNBC 证实 Shengshu 2026 年 4 月由 Alibaba
              领投的融资，但也称公司拒绝披露估值；Dealroom 只给出大约 $1 billion 到 $2.5 billion 的宽泛公开独角兽区间。与此同时，Shengshu 有足够多正面因素，不能简单放弃：公司披露
              2026 年 2 月完成超过 RMB 600 million 的 A+ 轮融资，2026 年 4 月完成约 RMB 2 billion 的 B 轮融资，2025 年用户和收入增长
              10x，产品面已经覆盖创作者工具、Vidu API 和面向广告的 Vidu Agent。


              这组因素让 Shengshu 值得放进观察名单，但仍然对价格敏感。如果投资人按 $1.5 billion 到 $1.7 billion
              的内部标记来承销，等于隐含假设公司已经把产品质量和商业使用转化为可观收入基础。没有经审计收入、毛利率、股权结构表或优先权披露，公开证据无法支撑这一假设。因此建议是观察而不是买入：保持覆盖活跃，但除非管理层打开收入桥、毛利率画像、客户集中度和稀释堆叠，否则不要在不透明标记下投入资本。实操规则很简单：价格越好、财务包越干净，Shengshu
              越能从吸引人的故事转向可承销资产。
