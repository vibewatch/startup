            body: >-
              从客户工作流看，Vidu 不只是一个 AI
              模型，而是一套创意操作栈。公开界面现在覆盖经典提示词生成模式，比如文生视频和图生视频；也覆盖用于角色或物体连续性的重参考生成、原生音频叙事、面向广告和商业的工作流自动化、给开发者的 API 访问，以及基于
              Vidu S1 的实时互动数字人生成。Q3 页面尤其有帮助，因为它围绕最终用途而不是实验室指标来描述产品：可同时生成对白、音效和音乐的成片；单次输出更长的 16
              秒片段；镜头语言控制；多语言输出；以及适配漫画剧、短剧和叙事广告。S1 / stream 界面又扩展了这个定义，把 Vidu 定位成语音控制数字角色的实时互动层，而不只是批量片段渲染。这个宽度很重要，因为
              Shengshu 似乎在解决几个相邻任务：创意构思、生产提速、本地化、广告素材生成、互动数字人和开发者嵌入。因此，模块地图更像平台路线图，而不是单模型功能清单。
