  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入界面与变现通道
        blocks:
          - type: paragraph
            body: >-
              公开证据支持的是多通道变现模型，而不是单一订阅产品。Shengshu 自有材料称公司同时运营 MaaS 和 SaaS；Series A+ 新闻稿提到的产品生态覆盖 Vidu MaaS、Vidu SaaS、Vidu
              App 和 Vidu Agent。API 发布稿给出了最具体的定价证据：Vidu API 开放无需申请，入门访问从 $10 起，基础定价为每点数 $0.05；一个 4 秒视频根据功能和画幅消耗 4 到 40
              点数。这是典型的按量计费开发者漏斗。在此之上，Agent 发布把视频生成重新包装成面向广告、TVC、电商和短视频媒体的工作流产品，指向比纯提示词娱乐更高价值的商业预算。Dealroom
              和公司材料合在一起暗示，创作者订阅和点数并不是全部；企业客户和平台级服务似乎也很重要。收入模型的核心争论因此不是 Shengshu 是否变现，而是收入中有多少来自低 ARPU
              自助创作者支出，又有多少来自质量更高的 API 和企业收入。
