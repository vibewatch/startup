      - number: '2.2'
        title: 市场规模与地理形态
        blocks:
          - type: paragraph
            body: >-
              只有分析师采用相近边界时，公开市场估算才会聚在相对窄的区间。The Business Research Company 估算 AI 视频生成器市场在 2025 为 $0.85 billion、2026 为
              $1.04 billion、2030 为 $2.07 billion，意味着 2026 到 2030 的 CAGR 为 18.9%。它相邻的生成式 AI 视频创作视角更小：2025 为 $0.39
              billion、2026 为 $0.47 billion、2030 为 $0.98 billion，CAGR 为 20.4%。Fortune Business Insights
              在当前基年落在两种视角之间：2025 为 $716.8 million、2026 为 $847 million，并预测到 2034 达到 $3.35 billion，CAGR 为
              18.8%。分歧不小，但可以解释：有些出版方只计算纯生成器软件，有些纳入更多创作服务；部分区域拆分也会随分析、企业工作流服务或消费者应用是否纳入边界而大幅移动。不过，分部数据仍有方向性价值。Fortune
              报告称，文生视频占 2026 市场的 46.25%，营销和广告是最大应用，占 33.88%；社交媒体是增长最快的应用，CAGR 为 23.5%；大型企业是最大客户类别，占 50.86%，SME 增速最快，CAGR
              为 21.1%。地理口径更不一致：TBRC 称 Asia-Pacific 是 2025 AI 视频生成器工具最大区域；Fortune 则给 North America 2025 年 41.0%
              份额、Asia-Pacific 20.9%，并称 China 2026 为 $49 million。承销 Shengshu 时，这种不一致是在提醒：自上而下的 China TAM
              只能当方向性判断，不能当精确数字。
