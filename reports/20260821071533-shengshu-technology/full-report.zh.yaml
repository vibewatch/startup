        title: 财务结论与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              Shengshu 的财务姿态有足够吸引力，值得更深入尽调，但信息不完整，尚不足以形成确信。公开看，这家公司像是一家快速扩张的 AI
              视频公司，具备真实变现界面、强近期融资、自称全球覆盖，并且可能向质量更高的商业使用迁移。这些是生成式媒体赛道风险投资赢家需要的正确要素。但缺失变量恰好决定它究竟是可持续软件业务，还是一门利润率薄、算力昂贵的故事：按产品线毛利率、创作者转付费、企业
              ACV、伙伴收入分成、客户集中度、支持成本、现金消耗和下一轮融资触发条件。与公开公司备案体系中可见的报告纪律相比，Shengshu
              披露仍然稀疏。工作结论是：收入质量有可信度，资本强度肯定高，资本充足性当前较强；但在管理层提供真实财务模型和队列证据之前，承销应保持有条件。
