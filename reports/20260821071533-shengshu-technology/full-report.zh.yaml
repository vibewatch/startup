              a16z 的 March 2025 消费者排名明确点名 Kling 和 Hailuo 是新近重要的网站目的地，并指出它们到 January 2025 已在月度访问量上超过 Sora。这对 Shengshu
              很重要，因为它说明全球 AI 视频市场会按产品效用奖励中国进入者，而不只是按国内政策支持。
