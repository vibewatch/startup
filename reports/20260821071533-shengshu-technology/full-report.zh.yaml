  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >-
              分析 Shengshu 时，应把它放在狭义 AI 视频生成器市场，而不是所有视频软件市场。The Business Research Company 和 Research and Markets
              定义的狭义品类，是用 AI 根据提示词、图像、幻灯片或配套结构化输入生成或转换视频的软件和服务。这个品类已经覆盖文生视频、图生视频、剪辑自动化，以及从自助订阅到 API 和企业服务的交付模式。Research
              and Markets 相邻的「生成式 AI
              视频创作」视角一方面略窄，一方面又略宽：它强调创作工作流和云端、本地部署等部署类型，但仍覆盖从企业到个人创作者和媒体公司的终端用户。官方市场界面证实，商业品类已经走过单一演示模型阶段。Runway 销售创意
              SaaS、开发者工具和机器人 / 仿真界面；Kling 提供 API、4K 生成和移动端分发；Pika 强调智能体和工作流自动化；PixVerse 主推 CLI、智能体、营销中心和 API 工作流；Jimeng
              则优化中文提示词、社区二创和帧控制功能。因此，Shengshu 的实际纳入规则是：计算 AI 原生视频生成、活动创作、创作者工具和开发者 / 企业视频 API 的支出；剔除传统 NLE 套件、监控分析、CDN /
              流媒体基础设施，以及从未触达视频模型的普通社交媒体广告支出。
