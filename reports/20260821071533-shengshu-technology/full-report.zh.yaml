  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 立场
      - 论点
      - 证据依据
      - 什么会改变判断
    rows:
      - - 投资逻辑
        - 产品能力和基准测试可信度是真实支撑。
        - Vidu 出现在外部 AI 视频榜单上，并持续发布重大版本。
        - 如果基准测试持续下滑，或用户质量问题显现，判断会被削弱。
      - - 投资逻辑
        - 商业使用可能强于业余创作者应用。
        - 公司称商业项目占比 >70%，开发者和企业客户超过 10,000 个。
        - 续约、ACV 和留存披露会显著增强该论点。
      - - 投资逻辑
        - 资本实力降低短期生存风险。
        - 2026 年披露融资超过 RMB 2.6B，加上 Alibaba 支持，为算力和 GTM 留出缓冲。
        - 如果出现重度烧钱或苛刻优先权证据，缓冲价值会下降。
      - - 反向逻辑
        - 当前确切估值没有公开验证。
        - CNBC 称估值未披露；Dealroom 只给出宽泛独角兽区间。
        - 董事会批准的融资备忘录或经审计股权结构包可以解决该问题。
      - - 反向逻辑
        - 收入质量仍是最关键缺口。
        - 未发现公开 ARR、毛利率、烧钱速度、集中度或净留存披露。
        - 带有队列和毛利数据的收入桥接表会显著提高置信度。
      - - 反向逻辑
        - 监管和算力是结构性折价，不是背景噪音。
        - 中国 AI 规则叠加美国现行先进计算管制，可能放慢增长并推高成本。
        - 有文档支撑的合规体系和有韧性的算力采购计划，会收窄折价。
    notes: 投资逻辑的吸引力来自产品和资本；反向逻辑集中在估值支撑和证据质量。
