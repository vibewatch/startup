        title: 直接同业画像与弹药级别
        blocks:
          - type: paragraph
            body: >-
              最重要的直接同业并不站在同一起跑线上。Runway 是本组审阅对象中资本最充足的专业玩家：据报道它在 February 2026 以 $5.3 billion 估值完成 $315 million Series
              E，声称拥有 60 million-plus 创意用户，并把世界模型叙事从媒体延伸到机器人。Hailuo 背后的 MiniMax 看起来甚至更宽，是一个多模态平台：Sacra 将其描述为估值 $4
              billion、累计融资约 $1.15 billion 的公司，并拥有很强的企业 API 牵引，Hailuo 只是其中一个界面。Luma 也资本充足且越来越偏企业，Owler 报道其累计融资 $1.1
              billion，并在 November 2025 完成 $900 million 融资；官方页面则把 Luma 呈现为专业创意智能体工作流，而不是新奇玩具。Pika 财务规模小得多，Sacra 报道其融资
              $135 million、估值 $470 million，但它用易用包装和 Adobe Firefly 分发来补偿。Kling、Jimeng 和 Wan
              在已审阅资料中披露的投资人细节较少，但产品姿态显示它们与中国生态有很强相邻性。因此，Shengshu 同时面对三类资本层级：数十亿美元级专业玩家、宽口径中国多模态平台，以及更轻的消费者 / 创作者挑战者。
