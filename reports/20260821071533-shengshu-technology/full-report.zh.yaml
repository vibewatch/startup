      - number: '4.5'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              资本充足性是 Shengshu 公开财务故事中最强的一块。官方和一线报道显示，February 2026 完成 >RMB 600 million Series A+，随后 April 2026 完成 RMB 2
              billion Series B，这个节奏说明公司在短窗口内融到了一大笔新资金。CNBC 还指出，Series B 资金拟用于支持「通用世界模型」，意味着融资中相当一部分会投向前沿模型 R&D
              和算力，而不只是商业化扩张。这一点很重要，因为世界模型雄心可能远早于收入消耗资本。正面解读是，Shengshu
              短期内看起来不太可能有融资压力。负面解读是，近期融资规模可能掩盖同样沉重的成本野心，尤其是在公司试图同时竞争模型质量、实时系统、国际扩张和企业部署时。公开资料没有披露在手现金、月度烧钱、债务或现金跑道。所以，虽然
              Shengshu 看起来资金充足，但还不能称为资本效率高。更合适的判断是「有缓冲，但不透明」。
