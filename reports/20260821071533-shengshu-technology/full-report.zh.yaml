      - number: '4.4'
        title: 成本结构、单位经济与利润率压力
        blocks:
          - type: paragraph
            body: >-
              围绕 Shengshu 的品类经济性很清楚，即便 Shengshu 自己的毛利率没有披露。前沿 AI 视频高度消耗算力，公有云和同业定价证据都说明原因。Google
              官方智能体定价体现了更宽泛的事实：多模态模型使用按量计费，并靠基于支出的承诺、缓存 token 和差异化模型费率来优化，而不是固定成本式基础设施。Luma、Runway、Pika、MiniMax 和 Vidu
              都使用点数、按量收费或两者结合——因为更长、更高分辨率、更可控的输出，交付成本显著更高。MiniMax 文档和 Sacra 画像进一步显示，严肃多模态厂商要承担大量模型训练和推理开销；Pika 的 Sacra
              画像还明确警告，用户需求上行后，会出现「不可持续的算力经济性」。Shengshu
              不能只靠收入增长。关键财务问题是，企业收入结构、工作流自动化和伙伴渠道，能否把单位算力实现收入提升得比定价压力和模型质量军备竞赛挤压得更快。没有毛利率、重试率、GPU
              来源或每生成秒成本数据，单位经济仍是一个结构化未知数。
