  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人或尽调路径
    rows:
      - - 收入桥接
        - ARR、确认收入、产品线组合，以及创作者 / API / 企业贡献
        - 没有这些，估值只能依赖活动代理指标，而不是财务事实
        - 财务尽调和管理层资料包。
      - - 收入质量
        - 净留存、流失、ACV 区间、合作伙伴集中度和前十大客户占比
        - 决定 Shengshu 应享有软件类倍数，还是接受更低的平台 / 消费混合折价
        - 商业尽调加队列复盘。
      - - 毛利与算力
        - 分渠道毛利率、GPU 承诺、重试率和每可用秒成本
        - AI 视频估值很大程度取决于规模是改善经济性，还是只增加算力消耗
        - 技术 + 财务工作流。
      - - 股权结构和优先权
        - 清算优先权、反稀释条款、董事会权利，以及 2025-2026 轮后持股
        - 如果优先权悬顶吃掉上行，头条估值仍可能没有吸引力
        - 法律顾问和数据室审查。
      - - 合规准备度
        - 算法备案、标识落地、数据来源控制和事件历史
        - 监管风险是估值折价的一部分，尤其是与中国相关的 AI 视频
        - 政策顾问和产品信任尽调。
      - - 退出准备度
        - 适合跨阶段投资者、战略方或 IPO 承销的经审计财务资料或申报级资料包
        - 这是从有趣故事变成可投资产的最短路径
        - 任何条款清单工作前，先发起董事会层面的尽调请求。
    notes: 这些问题是最低数据集，决定 Shengshu 能否从高关注标的转成可承销的后期投资。
