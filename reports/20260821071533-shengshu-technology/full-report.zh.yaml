            title: 出口管制不是背景噪音
            body: 2026 年 5 月 BIS 指引明确，中国相关实体的先进计算许可义务仍然有效。对一家饥渴于算力的 AI 视频公司来说，这是直接的产品、利润率和战略风险。
            calloutType: risk
            claimRefs:
              - CR006
