      - number: '4.2'
        title: 定价架构与 GTM 代理指标
        blocks:
          - type: paragraph
            body: >-
              Vidu 的公开定价架构混合了消费者和开发者动作。英文定价页确认了创作者套餐界面和大量高级工具，但可访问页面没有用可读文本给出清晰价格阶梯；相比之下，API
              发布稿直接给出了每点数价格和最低支出细节。这种不对称本身就是有用信号：标价足够公开，可以支撑自助漏斗入口；但实际经济性大概率取决于功能组合、企业安排和页面外条款。API 发布稿还称 Shengshu 配备专门
              B2B 服务团队，说明它有明确企业动作，而不是纯 PLG 创作者业务。Series A+ 发布稿中的客户例子——Pollo
              AI、PhotoGrid、OpenArt、Hubx、Fal.ai、Eachlabs、Freepik 和 GensPark——说明 GTM
              可以借开发者平台和伙伴应用延伸，而不只是直接终端客户销售。财务含义是，Shengshu 的分发杠杆可能强于纯独立应用，但每个严肃账户的支持和集成成本也可能更高。即时 API
              访问拓宽了漏斗顶部；它能否带来高效回本，取决于转化、使用深度和支持负担，这些都没有公开披露。
