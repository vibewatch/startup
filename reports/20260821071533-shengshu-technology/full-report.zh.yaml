  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 核心风险图谱及其重要性
        blocks:
          - type: paragraph
            body: >-
              Shengshu 的风险栈高度耦合。监管事件可能变成客户问题；算力短缺可能变成产品质量和利润率问题；基准下滑可能变成融资问题。因此，最重要的洞见不是某个孤立风险，而是风险之间的传导路径。中国特定 AI
              规则让合规成为产品要求，而不只是法律后置项。美国出口管制让基础设施获取变成战略变量，而不只是采购细节。竞争激烈意味着公司不能为了更安全就简单放慢速度，因为模型和工作流领先本身就是商业论点的一部分。这制造了典型前沿
              AI 张力：Shengshu 必须快到足以保持相关性，同时建立足够成熟的审核、标识、隐私、支持和企业控制，避免事故或执法。对投资人而言，实际结论是下行情景彼此相关；一旦发生，很可能同时打到多个经营维度。
