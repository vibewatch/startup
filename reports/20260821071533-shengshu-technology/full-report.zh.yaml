        - 治理、价格兑现和全球商业深度比功能营销更不透明
      - - Runway
        - 直接同业 / 全球专业厂商
        - 2026 年 2 月 $315M Series E 轮，估值 $5.3B；声称 60M+ 创意用户
        - 专业创作者、工作室、开发者、企业团队、机器人 / 游戏相邻场景
        - 覆盖创意、开发和机器人界面，工作流广度深
        - 更昂贵的专业定位；面临激烈的前沿模型竞争
      - - Hailuo / MiniMax
        - 直接同业 / 中国原生多模态平台
        - Sacra 引用 MiniMax 约 $4B 估值和约 $1.15B 累计融资
        - 消费级创作者及企业 API 用户
        - 强消费端牵引信号、多模态平台广度、1080p / 镜头控制能力声明
        - Hailuo 专属定价和企业客户细节在已审查公开来源中仍不够透明
      - - Kling
        - 直接同业 / 中国原生平台在位者
        - Kuaishou 支持的生态玩家；本报告未使用新的独立融资披露
        - 消费者、创作者、API 用户、移动端用户
        - 原生 4K、音频-图像-视频栈、移动端分发
        - 英文公开定价和企业披露较薄
      - - Pika
        - 直接同业 / 消费创作者挑战者
        - Sacra 引用约 $135M 融资和约 $470M 估值，并有更高投机上行
        - 休闲创作者、社交创作者、专业消费者、Adobe 相邻用户
        - 易上手 UX、病毒式特效、智能体内容创作、Adobe Firefly 分发
        - 资本体量小于 Runway / Luma，专业工作流深度也更弱
      - - Luma
        - 直接同业 / 专业工作流挑战者
        - Owler 引用约 $1.1B 累计融资和 2025 年 11 月 $900M 融资
        - 创意专业人士、团队、API 构建者、企业
        - 创意智能体工作流、关键帧控制、HDR/EXR 导出、团队工作区
        - 消费者品牌心智似乎低于更有病毒传播力的创作者应用
      - - Jimeng
        - 直接同业 / 中国本地化创作者平台
        - ByteDance 生态相邻；本报告未使用独立融资来源
        - 中文创作者和社区用户
        - 中文提示词流畅、首末帧控制、社区二创
        - 公开企业 / API 细节比 Runway、Luma 或 MiniMax 更薄
      - - PixVerse
        - 直接同业 / 工作流和 API 平台
        - 已审查来源未披露私营规模
        - 营销人员、开发者、创作者、企业
        - API、CLI、智能体、画布、营销中心工作流广度
        - 公开披露的实际定价和规模指标仍有限
      - - Wan / 开源式替代方案
        - 替代 / 相邻模型层
        - 已审查来源显示更像社区或平台支持模型，而非明确披露 SaaS 规模
        - 开发者、研究人员、技术用户
        - 托管 SaaS 产品之外，免费或低摩擦实验
        - 托管工作流支持较弱，企业 / 合规包装也更弱
    notes: >-
      竞争行混合了直接同业和一个替代层，因为买方可以用托管 SaaS、广义多模态平台或开源模型替代方案完成同一任务。Runway、Pika、MiniMax 和 Luma 的规模 / 融资细节强于 Kling、Jimeng、Wan 或
      PixVerse。
