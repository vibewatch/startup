  - id: TV005
    title: 投资逻辑破裂与终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 企业 / API 证明停滞
        - 下一轮融资前仍没有有说服力的 ARR 桥接、留存数据或 ACV 证据
        - 打破“商业使用质量高，而非只是广而浅”的论点
        - 不要按溢价倍数承销。
      - - 模型质量下滑
        - 相比 Runway、Kling、MiniMax 或其他头部同行，基准测试或评价持续恶化
        - 削弱支撑后期定价的产品驱动溢价
        - 将估值区间下修至基准 / 悲观情景。
      - - 出口管制冲击或算力挤压
        - 实际可获得先进算力更受限，或推理经济性明显恶化
        - 同时把产品势能转化为毛利和迭代风险
        - 扩大折价，并要求证明算力韧性。
      - - 监管事件
        - 出现与中国 AI 规则相关的内容、标识、数据来源或合规失误
        - 将政策风险转化为客户信任和分发摩擦
        - 暂停投资论证，直到整改得到验证。
      - - 披露仍然稀薄
        - 尽管持续融资，仍没有经审计财务包、股权结构表或优先权视图
        - 即便公司本身表现良好，也无法做可靠回报测算
        - 维持观察 / 继续研究，而不是买入。
    notes: 这些触发项可监测，而非抽象风险。每一项都会直接改变估值案例背后的收入、倍数或稀释假设。
