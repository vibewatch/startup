      - number: '3.4'
        title: 分发、切换成本与多平台使用
        blocks:
          - type: paragraph
            body: >-
              分发能力可能和模型质量一样重要。Pika 进入 Adobe Firefly，让它不必从零搭建传统企业销售，就能接触大型专业创意生态。Runway 既有自己的大型创作者基础，也有外部企业合作；TechCrunch
              还报道它在把算力容量和用例扩展到游戏与机器人。Luma 的团队工作区、共享上下文、API 和企业计划，把它推向工作流系统位置，而不是一次性片段生成。PixVerse 也类似地打包画布、CLI、营销中心和 API
              界面。相比之下，许多面向创作者的产品仍然很容易多平台使用，因为套餐按点数计费、用户界面以提示词为中心，内容也可以用不高的切换成本在别处重新生成。当平台掌握团队协作、管线集成、品牌资产、审核控制或企业承诺时，锁定效应才更强。因此，Shengshu
              的防御性大概率不会来自随意型创作者订阅，而会来自 API、企业部署，以及它能持续守住的任何本地化合规或分发优势所形成的更深工作流绑定。
