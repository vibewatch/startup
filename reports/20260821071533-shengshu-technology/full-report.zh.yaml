            body: >-
              依赖层是地缘政治、财务和客户风险汇合处。Shengshu 需要先进算力、前沿工程人才和持续产品加速，才能与 Runway、Kling、Hailuo 等资金充足的对手竞争。美国出口管制执行让 GPU
