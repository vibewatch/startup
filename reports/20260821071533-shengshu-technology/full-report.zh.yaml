      - number: '1.5'
        title: 负面信号与未解决披露缺口
        blocks:
          - type: paragraph
            body: >-
              公司概况层面的主要风险不是生死级红旗，而是披露和执行上的保留项。Notebookcheck 在 September 2025 对 Vidu
              的上手测试认为，产品能生成醒目的视觉效果，但故障、瑕疵和不一致仍太多，难以支撑可靠的专业工作，凸显基准测试营销与生产可靠性之间长期存在的缺口。公开基准排名也对时间很敏感：公司 PR 在 early 2026 将
              Vidu Q3 包装为中国 No.1、全球 No.2，但 August 2026 的 Artificial Analysis
              快照显示，文生视频和图生视频排名都更低。治理披露更薄：已审阅的公开资料没有披露董事会、独立监督、所有权权利或经审计财务报表；连当前员工数、准确累计融资额这样的基础指标也只能部分观察。招聘门户确实显示公司在
              Beijing、Shanghai、Shenzhen 和 San Francisco 招人，但不能把这误认为除 Beijing 之外的运营总部已有完整文件支持。投资人应把 Shengshu
              视为一家高速推进、但仍不透明的私营公司；它最强的事实是技术交付速度，而不是机构透明度。
            claimRefs:
