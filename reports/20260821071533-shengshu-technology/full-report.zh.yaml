        title: 能力与包装对比
        blocks:
          - type: paragraph
            body: >-
              能力宽度正在趋同，但包装方式仍然分化。Runway 营销创意、开发者和机器人界面；Luma 销售智能体、团队工作区和 API；PixVerse 暴露 API、CLI、画布和营销中心；Pika
              强调易用特效、智能体内容创作和移动社交二创；Kling 组合视频、图像、声音、特效和原生 4K；Jimeng 强调中文提示词流畅度和首尾帧控制；Hailuo 所属的 MiniMax 技术栈则把消费者应用和企业
              API 结合起来。实际看，买方选择的是产品哲学，而不只是模型输出。专业团队可能偏好 Runway 或 Luma，因为工作流连续性、导出格式、共享点数或 API 控制，比新奇感更重要。消费者创作者可能偏好
              Pika、Jimeng 或 Hailuo，因为界面和病毒循环更容易。API 优先构建者可能偏好 Vidu、PixVerse、MiniMax 或 Luma。Artificial Analysis
              和官方文档也暗示，前沿竞争现在同时横跨质量、速度和价格，这会压缩任何只靠声称「我们有视频 AI」建立的护城河。Shengshu
              的挑战在于，多数核心功能已经在别处存在；机会在于靠中国原生产品适配和高质量输出，赢下具体用户群。
