      - number: '8.4'
        title: 退出准备度、尽调问题与最终观点
        blocks:
          - type: paragraph
            body: >-
              从尽调角度看，Shengshu 尚未准备好退出；虽然从战略兴趣角度，它可能具备退出可能。公司显然会发产品、吸引资本，也会营销商业用例。缺的是投资委员会承销具体价格所需的一整套材料：按产品线拆分的
              ARR、净留存、企业集中度、毛利率、算力承诺、现金消耗、董事会结构，以及 2025-2026 年快速融资形成的优先股堆叠。SEC EDGAR、HKEXnews
              等监管申报基础设施展示了公开投资人最终要求的标准；Shengshu 离这一级别披露还很远。


              最终观点很直接。Shengshu 是更可信的中国 AI
              视频公司之一，值得继续覆盖，因为产品、资本和商业化故事都真实到足以重要。但今天的公开证据支持兴趣，而不是确信。只有在管理层提供经审计或达到监管申报级别的经济性，或进入价格低到足以在不透明下创造安全边际时，才应上调。此前，观察是纪律性的答案：公司很强，估值证明不完整。
