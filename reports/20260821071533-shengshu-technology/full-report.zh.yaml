      - number: '8.3'
        title: 情景区间与下行传导
        blocks:
          - type: paragraph
            body: >-
              情景分析很重要，因为 Shengshu 最好的公开指标是活动信号，而不是经审计收入指标。乐观情景下，Shengshu 所称 >70% 商业项目占比被证明是真实的收入质量信号，开发者和企业客户基础转化为耐久 API
              与 B2B 合同，产品领先保持在 AI 视频基准前列，管理层也能证明毛利率在算力强度很高的情况下向软件化水平靠拢。在这条路径下，大约 $1.8 billion 到 $3.0 billion
              的区间有可辩护性；如果从低端进入，也能支撑有吸引力的上行空间。


              基准情景更保守。它假设 Shengshu 真实存在且在增长，但收入质量在自助创作者、平台合作伙伴和企业账户之间参差不齐；算力和合规成本仍然很重；私营市场给公开 AI / 软件倍数一定溢价，但不会把
              Shengshu 当作披露充分的稀缺资产。在这条路径上，大约 $0.9 billion 到 $1.6 billion 更可支撑。悲观情景不是崩盘故事，而是倍数压缩和不透明故事。如果商业使用无法转化为耐久
              ARR，如果出口管制收紧，如果监管摩擦拖慢发布，或如果竞争定价压薄利润率，大约 $0.5 billion 到 $0.9 billion
              的区间就有可能成立。这就是为什么下行主要通过经济性缺失传导，而不只是产品无关。
