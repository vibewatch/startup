evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board roster, committee map, observer rights, and executive org chart below the CEO/president layer.
    whyItMatters: >-
      Public governance visibility is materially weaker than funding visibility, which makes control and oversight
      harder to underwrite.
    diligencePath: Request board materials, org chart, and latest cap-table governance schedules from management.
    relatedQuestionRefs:
      - QO009
      - QO014
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: One authoritative current employee count by function and geography.
    whyItMatters: >-
      Public sources conflict on current scale, which affects operating leverage, customer support capacity, and burn
      assumptions.
    diligencePath: Obtain HRIS-export headcount, attrition, and org-by-location data for the current quarter.
    relatedQuestionRefs:
      - QO016
      - QO019
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Audited revenue, gross margin, customer count, and current-period run-rate disclosure.
    whyItMatters: >-
      The public narrative supports scale but not enough precision to underwrite quality of revenue or margin
      durability.
    diligencePath: Request financial statements, revenue bridge, top-customer concentration, and cohort files.
    relatedQuestionRefs:
      - QO015
      - QO017
      - QO025
  - type: conflicting-data
    severity: material
    topic: market sizing
    missingEvidence: A bottoms-up TAM/SAM/SOM build for Nowports by lane, customer frequency, and service mix.
    whyItMatters: >-
      Broad regional logistics and digital-forwarding estimates do not translate directly into an investable addressable
      market for the company.
    diligencePath: Request management’s market model by country, corridor, industry, and shipment-frequency cohort.
    relatedQuestionRefs:
      - QM006
      - QM019
      - QM025
  - type: private-evidence-only
    severity: material
    topic: willingness to pay
    missingEvidence: >-
      Public pricing, ACV, gross profit by service line, and attach-rate data for financing, customs, and protection
      workflows.
    whyItMatters: Without pricing and retention evidence, category attractiveness cannot be converted into monetization quality.
    diligencePath: Request pricing cards, realized take rates, customer cohorts, and expansion patterns by segment.
    relatedQuestionRefs:
      - QM021
      - QM024
  - type: stale
    severity: minor
    topic: trade flows
    missingEvidence: Current 2026 lane-level trade data tied directly to Nowports’ active corridors.
    whyItMatters: Older market or thesis sources explain demand direction but not present share opportunity by route.
    diligencePath: Pull 2026 customs, port, and lane data for Mexico, Brazil, Chile, Colombia, Peru, and U.S.-Mexico corridors.
    relatedQuestionRefs:
      - QM020
      - QM022
  - type: private-evidence-only
    severity: material
    topic: win-loss data
    missingEvidence: >-
      Account-level win/loss outcomes versus Flexport, Freightos, Forto, Nuvocargo, and traditional forwarders by lane
      and product bundle.
    whyItMatters: Public positioning does not reveal where Nowports actually wins or loses competitively.
    diligencePath: Request CRM win/loss data segmented by country, lane, shipment frequency, and product bundle.
    relatedQuestionRefs:
      - QP020
      - QP023
      - QP024
  - type: private-evidence-only
    severity: material
    topic: retention by product bundle
    missingEvidence: >-
      Retention and expansion data for freight-only customers versus customers using financing, insurance, or reporting
      modules.
    whyItMatters: Moat durability depends on whether bundled workflows create real stickiness.
    diligencePath: Request cohort retention, expansion, and churn by product combination and by country.
    relatedQuestionRefs:
      - QP016
      - QP020
      - QP024
  - type: partial-enumeration
    severity: minor
    topic: local competitor set
    missingEvidence: A full list of Latin American regional digital-forwarding rivals beyond the public set captured here.
    whyItMatters: Smaller regional challengers can still matter on specific lanes or verticals.
    diligencePath: Map active competitors by corridor and industry using local sales battlecards and route-level loss data.
    relatedQuestionRefs:
      - QP001
      - QP004
      - QP023
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: unit economics
    missingEvidence: Gross margin, contribution margin, CAC, payback, and revenue recognition policy by product line.
    whyItMatters: Topline growth is not enough to judge quality in freight-forwarding and embedded-finance models.
    diligencePath: Request audited financial statements, revenue-recognition memo, and management KPI pack.
    relatedQuestionRefs:
      - QI009
      - QI021
      - QI022
      - QI025
  - type: private-evidence-only
    severity: material
    topic: liquidity and funding structure
    missingEvidence: Cash on hand, burn, runway, warehouse lines or debt, and cost of funds for the financing business.
    whyItMatters: Working-capital intensity and credit exposure can dominate economics even when revenue looks strong.
    diligencePath: Request treasury report, debt schedule, covenant summary, and monthly cash bridge.
    relatedQuestionRefs:
      - QI016
      - QI017
      - QI019
      - QI025
  - type: private-evidence-only
    severity: material
    topic: credit performance
    missingEvidence: Delinquency, write-offs, recoveries, and on/off-balance-sheet treatment of financed customer exposure.
    whyItMatters: Financing can deepen margin and retention or create hidden losses depending on underwriting quality.
    diligencePath: Request financing vintages, cohort performance, and facility structure by country.
    relatedQuestionRefs:
      - QI014
      - QI019
      - QI025
  - type: private-evidence-only
    severity: material
    topic: technical architecture
    missingEvidence: Infrastructure stack, data model, integration architecture, observability, and reliability metrics.
    whyItMatters: Without this detail, investors cannot judge scalability, security depth, or implementation complexity.
    diligencePath: Request architecture diagrams, SLOs, incident review process, and integration inventory.
    relatedQuestionRefs:
      - QE022
      - QE023
      - QE025
  - type: private-evidence-only
    severity: material
    topic: product usage
    missingEvidence: Active users, module adoption, mobile usage, report-generation volume, and retention by feature.
    whyItMatters: Module breadth only matters if customers actually use the features enough to create stickiness.
    diligencePath: Request product analytics dashboards and cohort usage by account segment.
    relatedQuestionRefs:
      - QE004
      - QE018
      - QE024
  - type: developer-signal-gap
    severity: minor
    topic: public developer surface
    missingEvidence: A meaningful public code, API-docs, or open-integration footprint for external verification.
    whyItMatters: The product may still be strong, but investors cannot triangulate engineering quality from community artifacts.
    diligencePath: >-
      Request engineering org metrics, deployment cadence, and internal quality dashboards; note that no public repos
      were visible on the identified GitHub accounts.
    relatedQuestionRefs:
      - QE016
      - QE017
      - QE025
  - type: private-evidence-only
    severity: material
    topic: retention and renewal
    missingEvidence: GRR, NRR, churn, contract length, and cohort shipment frequency by segment.
    whyItMatters: Testimonials do not prove durability or economic quality of the customer base.
    diligencePath: Request retention dashboards by mode, country, and product bundle.
    relatedQuestionRefs:
      - QU016
      - QU017
      - QU025
  - type: private-evidence-only
    severity: material
    topic: customer concentration
    missingEvidence: Top-10 customer share, financed-book exposure by account, and revenue concentration by country or lane.
    whyItMatters: A few large freight customers can dominate revenue and hide account risk.
    diligencePath: Request customer concentration tables and share-of-wallet by account.
    relatedQuestionRefs:
      - QU020
      - QU021
      - QU025
  - type: partial-enumeration
    severity: minor
    topic: independent customer review surface
    missingEvidence: Robust third-party review evidence beyond sparse App Store and review-site entries.
    whyItMatters: Independent satisfaction signals are weaker than company-hosted testimonials.
    diligencePath: Request customer references, NPS, CSAT, and support-resolution metrics.
    relatedQuestionRefs:
      - QU014
      - QU022
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: financing and credit exposure
    missingEvidence: >-
      Delinquency, reserves, vintage performance, partner economics, and loss-sharing terms for any financed-book
      exposure.
    whyItMatters: A logistics-plus-finance model can hide credit risk until conditions worsen.
    diligencePath: Request financed-book KPIs, underwriting policy, reserve methodology, and partner contracts.
    relatedQuestionRefs:
