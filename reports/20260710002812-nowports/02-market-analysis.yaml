  claims:
    - {id: CM001, statement: 'Nowports’ market boundary starts with cross-border freight forwarding rather than the entire logistics economy.', type: inferred, topic: market boundary, sourceRefs: [SM001, SM002, SM010], confidence: medium, freshness: current, answersQuestionRefs: [QM001, QM002]}
    - {id: CM002, statement: 'Official Nowports sources combine freight execution with documents, alerts, tracking, and financing or insurance add-ons, which makes the company compete on workflow reduction as well as transport.', type: company-claimed, topic: market boundary, sourceRefs: [SM001, SM002, SM003], confidence: high, freshness: current, answersQuestionRefs: [QM001, QM002, QM014, QM016]}
    - {id: CM003, statement: 'IMARC defines the broader Latin America freight and logistics market to include courier, freight forwarding, freight transport, warehousing, and storage.', type: third-party-reported, topic: market boundary, sourceRefs: [SM010], confidence: medium, freshness: current, answersQuestionRefs: [QM001, QM002]}
    - {id: CM004, statement: 'Mordor says digital freight forwarding demand is moving toward platforms that solve visibility, documentation, and compliance gaps rather than just mode switching.', type: third-party-reported, topic: market boundary, sourceRefs: [SM008], confidence: medium, freshness: current, answersQuestionRefs: [QM001, QM014, QM015]}
    - {id: CM005, statement: 'The operational alternatives to Nowports include traditional forwarders, carriers, customs brokers, and fragmented document-heavy workflows rather than only software peers.', type: inferred, topic: substitutes, sourceRefs: [SM001, SM003, SM016, SM017, SM018], confidence: medium, freshness: current, answersQuestionRefs: [QM003, QM023]}
    - {id: CM006, statement: 'Competitor product pages from Flexport, Freightos, Forto, Nuvocargo, and KLog confirm that visibility, booking, customs, and managed transportation are core market features.', type: third-party-reported, topic: substitutes, sourceRefs: [SM016, SM017, SM018, SM019, SM020], confidence: medium, freshness: current, answersQuestionRefs: [QM003, QM023]}
    - {id: CM007, statement: 'Nowports’ market should include customs and trade-finance workflows when they are directly tied to shipments, not just pure transportation execution.', type: inferred, topic: market boundary, sourceRefs: [SM003, SM005, SM013], confidence: medium, freshness: current, answersQuestionRefs: [QM002, QM015, QM016]}
    - {id: CM008, statement: 'Nowports’ official ocean-freight page shows the company operates in a market where routing, port charges, seasonality, contracts, and customs shape value, not just lane price.', type: company-claimed, topic: market mechanics, sourceRefs: [SM004], confidence: medium, freshness: current, answersQuestionRefs: [QM002, QM014]}
    - {id: CM009, statement: 'Supply Chain Digital characterizes Nowports as a go-to Latin American freight forwarder, reinforcing that the company is evaluated inside a regional forwarding context rather than as generic SaaS.', type: third-party-reported, topic: market boundary, sourceRefs: [SM021], confidence: medium, freshness: recent, answersQuestionRefs: [QM001]}
    - {id: CM010, statement: 'Mordor estimates the global digital freight forwarding market at USD 51.43 billion in 2026 and USD 118.12 billion by 2031.', type: third-party-reported, topic: market size, sourceRefs: [SM008], confidence: medium, freshness: current, answersQuestionRefs: [QM004, QM019]}
    - {id: CM011, statement: 'IMARC estimates the Latin America freight and logistics market at USD 1,102.6 million in 2025 and USD 1,715.6 million by 2034.', type: third-party-reported, topic: market size, sourceRefs: [SM010], confidence: medium, freshness: current, answersQuestionRefs: [QM005, QM019]}
    - {id: CM012, statement: 'The public Mordor and IMARC estimates cannot be treated as a clean TAM/SAM/SOM cascade because they measure different scopes and geographies.', type: inferred, topic: market size, sourceRefs: [SM008, SM010], confidence: medium, freshness: current, answersQuestionRefs: [QM006, QM019, QM025]}
    - {id: CM013, statement: 'Mordor says transportation management represented 59.34% of the digital freight forwarding market in 2025.', type: third-party-reported, topic: market size, sourceRefs: [SM008], confidence: medium, freshness: current, answersQuestionRefs: [QM004, QM012]}
    - {id: CM014, statement: 'Mordor says SMEs held 60.27% share of digital freight forwarding demand in 2025 and are projected to grow at 17.45% CAGR through 2031.', type: third-party-reported, topic: buyers, sourceRefs: [SM008], confidence: medium, freshness: current, answersQuestionRefs: [QM012, QM019]}
    - {id: CM015, statement: 'IMARC identifies manufacturing, wholesale and retail trade, agriculture, construction, oil and gas, mining, and related sectors as key end-user industries in the broader regional market.', type: third-party-reported, topic: buyers, sourceRefs: [SM010], confidence: medium, freshness: current, answersQuestionRefs: [QM008, QM009]}
    - {id: CM016, statement: 'Contxto implies that Nowports’ early market wedge centered on recurring shipment volume rather than sporadic spot forwarding demand.', type: inferred, topic: market wedge, sourceRefs: [SM015], confidence: medium, freshness: historical, answersQuestionRefs: [QM011, QM024]}
    - {id: CM017, statement: 'Nowports’ air-freight page explicitly calls out pharma, urgent shipments, high-value goods, and perishables as suitable categories.', type: company-claimed, topic: buyers, sourceRefs: [SM003, SM004], confidence: high, freshness: current, answersQuestionRefs: [QM009, QM011]}
    - {id: CM018, statement: 'The most likely buyer-owner in Nowports’ workflow is the logistics or supply-chain function, with finance and procurement becoming more important when financing, customs, or spend control matter.', type: inferred, topic: buyers, sourceRefs: [SM001, SM003, SM005], confidence: medium, freshness: current, answersQuestionRefs: [QM009, QM010]}
    - {id: CM019, statement: 'Recurring movers are more attractive than occasional shippers because document management, alerts, and reporting become more valuable with shipment frequency.', type: inferred, topic: buyers, sourceRefs: [SM002, SM003, SM015], confidence: medium, freshness: current, answersQuestionRefs: [QM011, QM024]}
    - {id: CM020, statement: 'World Bank says 44 days elapse on average from export-port entry to destination-port exit across global container routes.', type: third-party-reported, topic: market drivers, sourceRefs: [SM006], confidence: medium, freshness: current, answersQuestionRefs: [QM007, QM013]}
    - {id: CM021, statement: 'World Bank says end-to-end supply-chain digitalization can shorten port delays materially in emerging economies.', type: third-party-reported, topic: market drivers, sourceRefs: [SM006], confidence: medium, freshness: current, answersQuestionRefs: [QM007, QM013, QM014]}
    - {id: CM022, statement: 'Mordor says value-added services around customs, sustainability, and trade finance are where differentiation is increasingly concentrated.', type: third-party-reported, topic: market drivers, sourceRefs: [SM008], confidence: medium, freshness: current, answersQuestionRefs: [QM013, QM015, QM016]}
    - {id: CM023, statement: 'Mordor says regulatory compliance complexity across jurisdictions is a material restraint in digital freight forwarding.', type: third-party-reported, topic: market constraints, sourceRefs: [SM008], confidence: medium, freshness: current, answersQuestionRefs: [QM013, QM019]}
    - {id: CM024, statement: 'Mordor says resistance from traditional freight-forwarding incumbents is another market restraint.', type: third-party-reported, topic: market constraints, sourceRefs: [SM008], confidence: medium, freshness: current, answersQuestionRefs: [QM013, QM018]}
    - {id: CM025, statement: 'Mordor says limited digital infrastructure in emerging markets can also restrain adoption.', type: third-party-reported, topic: market constraints, sourceRefs: [SM008], confidence: medium, freshness: current, answersQuestionRefs: [QM017, QM018]}
    - {id: CM026, statement: 'Maersk’s 2025 Latin America market update highlights congestion, bad weather, road disruptions, and customs or documentation planning across multiple countries.', type: third-party-reported, topic: market constraints, sourceRefs: [SM012], confidence: medium, freshness: recent, answersQuestionRefs: [QM013, QM017, QM018, QM022]}
    - {id: CM027, statement: 'Solistica says visibility, AI-assisted planning, and digital customs are becoming survival requirements in Latin American logistics rather than optional upgrades.', type: third-party-reported, topic: market drivers, sourceRefs: [SM013], confidence: medium, freshness: recent, answersQuestionRefs: [QM013, QM014, QM015]}
    - {id: CM028, statement: 'Mouro argued that transparency, efficiency, and real-time access to shipping data are unusually valuable in Latin American trade flows.', type: third-party-reported, topic: market drivers, sourceRefs: [SM005], confidence: medium, freshness: historical, answersQuestionRefs: [QM013, QM014]}
    - {id: CM029, statement: 'Mexico Business News described Nowports financing as a way to integrate credit, logistics, and insurance into one workflow for Mexican SMEs.', type: third-party-reported, topic: market drivers, sourceRefs: [SM003], confidence: medium, freshness: recent, answersQuestionRefs: [QM016]}
    - {id: CM030, statement: 'Flexport markets cost savings, visibility, customs brokerage, and working-capital benefits, showing how buyers evaluate software-led forwarders on more than transportation alone.', type: third-party-reported, topic: competitors, sourceRefs: [SM016], confidence: medium, freshness: current, answersQuestionRefs: [QM014, QM023]}
    - {id: CM031, statement: 'Freightos, Forto, and Nuvocargo each emphasize booking, integrations, notifications, or customs speed, which shows a market where digital workflow and service orchestration are core buying criteria.', type: third-party-reported, topic: competitors, sourceRefs: [SM017, SM018, SM019], confidence: medium, freshness: current, answersQuestionRefs: [QM015, QM016, QM023]}
    - {id: CM032, statement: 'Nowports’ market is more attractive when measured as recurring, visibility-sensitive, cross-border freight for SMEs and mid-market importers than when measured as total regional logistics spend.', type: inferred, topic: verdict, sourceRefs: [SM008, SM010, SM015], confidence: medium, freshness: current, answersQuestionRefs: [QM020, QM025]}
    - {id: CM033, statement: 'Public sources do not disclose enough company-specific contract-value, retention, or lane-mix data to build a rigorous public SOM for Nowports.', type: inferred, topic: evidence gap, sourceRefs: [SM010, SM021, SM022], confidence: medium, freshness: current, answersQuestionRefs: [QM020, QM021, QM025]}
    - {id: CM034, statement: 'The right public-market conclusion is therefore multi-lens and directional rather than a single headline TAM figure.', type: inferred, topic: verdict, sourceRefs: [SM008, SM010], confidence: low, freshness: current, answersQuestionRefs: [QM025]}
    - {id: CM035, statement: 'A bottoms-up market map by route, shipment frequency, industry, and financing attach rate is still required before turning category growth into an underwriting model for Nowports.', type: open-question, topic: evidence gap, sourceRefs: [], confidence: low, freshness: current, answersQuestionRefs: [QM021, QM025]}
  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: market sizing
      missingEvidence: A bottoms-up TAM/SAM/SOM build for Nowports by lane, customer frequency, and service mix.
      whyItMatters: Broad regional logistics and digital-forwarding estimates do not translate directly into an investable addressable market for the company.
      diligencePath: Request management’s market model by country, corridor, industry, and shipment-frequency cohort.
      relatedQuestionRefs: [QM006, QM019, QM025]
    - type: private-evidence-only
      severity: material
      topic: willingness to pay
      missingEvidence: Public pricing, ACV, gross profit by service line, and attach-rate data for financing, customs, and protection workflows.
      whyItMatters: Without pricing and retention evidence, category attractiveness cannot be converted into monetization quality.
      diligencePath: Request pricing cards, realized take rates, customer cohorts, and expansion patterns by segment.
      relatedQuestionRefs: [QM021, QM024]
    - type: stale
      severity: minor
      topic: trade flows
      missingEvidence: Current 2026 lane-level trade data tied directly to Nowports’ active corridors.
      whyItMatters: Older market or thesis sources explain demand direction but not present share opportunity by route.
      diligencePath: Pull 2026 customs, port, and lane data for Mexico, Brazil, Chile, Colombia, Peru, and U.S.-Mexico corridors.
      relatedQuestionRefs: [QM020, QM022]
