      - ['Mordor Intelligence', '2031 forecast', 'Global digital freight forwarding', 'USD 118.12B', '18.09% CAGR', 'Useful for category velocity, not for Nowports-specific share', medium]
      - ['IMARC Group', '2025 current', 'Latin America freight and logistics market', 'USD 1,102.6M', '4.88% CAGR through 2034', 'Broader regional market definition than digital forwarding alone', medium]
      - ['IMARC Group', '2034 forecast', 'Latin America freight and logistics market', 'USD 1,715.6M', '4.88% CAGR', 'Broad category; likely includes many services outside Nowports’ wedge', medium]
      - ['World Bank / LPI', '2023 baseline', 'Global cross-border logistics reliability', '44 days average container route span', 'Digitalization can shorten port delays', 'Operational pain lens, not spend estimate', high]
      - ['Mouro Capital', '2021 thesis lens', 'Latin America trade flows', 'Imports/exports growing nearly 10% annually since 2015', 'Growth-supporting thesis', 'Narrative investment lens rather than a formal market dataset', medium]
    notes: These are market lenses, not one clean TAM/SAM/SOM stack; they measure different scopes and should be used together rather than forced into a single addressable-market number.
    claimRefs: [CM010, CM011, CM012, CM020, CM021]
