          detail: Mordor estimate for the digitally orchestrated forwarding market
        - label: Digital-forwarding growth lens
          value: USD 118.12B (2031)
          detail: Mordor forecast at 18.09% CAGR
    approximationNotes: These layers are intentionally not additive because they describe different scopes and geographies; the figure is meant to bracket the arena around Nowports rather than imply a precise TAM/SAM/SOM cascade.
