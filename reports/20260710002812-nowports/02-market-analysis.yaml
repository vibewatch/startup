      - ['Freight execution by mode', 'Ocean, air, ground, and multimodal international cargo movement', 'Last-mile-only local delivery or purely warehousing-only services', 'Import/export operators and shipment owners', 'Core included market']
      - ['Customs / compliance support', 'Documentation, declarations, border coordination, and lane-specific process support', 'Unrelated tax software or general legal services', 'Trade compliance, operations, and customs stakeholders', 'Important adjacent layer that increases switching costs']
      - ['Trade finance and cargo insurance', 'Inventory financing, insurance coordination, and payment-term support tied to shipments', 'General unsecured SME lending unrelated to freight', 'Finance and procurement alongside logistics teams', 'Important adjacency that expands wallet share']
      - ['Broader freight / logistics economy', 'Warehousing, transport, CEP, storage, and freight modes across the region', 'Manufacturing itself or non-logistics software budgets', 'Many different budget owners', 'Useful outer boundary but too broad for direct TAM use']
    notes: The table separates Nowports’ true workflow boundary from the much larger general logistics economy so broad market reports are not mistaken for directly addressable revenue.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM006]
  - id: TM002
    title: TAM / SAM / SOM or sizing lens table
    columns: [Publisher, Year / horizon, Geography / scope, Value, CAGR / growth lens, Methodology / limitation, Confidence]
    rows:
