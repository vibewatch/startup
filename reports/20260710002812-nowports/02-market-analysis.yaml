      - ['Retail / e-commerce importer', 'Logistics or merchandising operator', 'Operations and inventory planners', 'Merchandising / operations budget', 'Seasonal or high-frequency inbound product flows', 'Operations with working-capital sensitivity', 'Fast replenishment, status alerts, and landed-cost pressure']
      - ['Automotive / industrial shipper', 'Procurement or plant logistics lead', 'Plant logistics teams', 'Operations / procurement budget', 'Component, parts, or finished-goods freight across borders', 'Plant operations', 'Downtime risk and predictable lane management']
      - ['Pharma / perishables shipper', 'Quality-sensitive operations leader', 'Cold-chain / handling staff', 'Operations budget', 'Urgent, temperature-sensitive, or high-value cargo', 'Operations with compliance oversight', 'Need for speed, handling quality, and exception management']
      - ['SME importer using financing', 'Founder, COO, or finance leader', 'Small logistics team', 'Finance plus operations', 'Import workflow where inventory financing and payment terms matter', 'Finance shared with operations', 'Cash-flow pressure and limited bank credit access']
    notes: Budget owners are inferred from workflow definitions because public sources describe pain points and users more clearly than internal budget authority.
    claimRefs: [CM015, CM016, CM017, CM018, CM019, CM028, CM031]
  - id: TM004
    title: Growth drivers and constraints table
    columns: [Driver / constraint, Direction, Timing, Implication, Diligence ask]
    rows:
      - ['Need for real-time visibility and tracking', driver, current, 'Favors software-led forwarders over email-and-spreadsheet incumbents', 'Request proof that visibility features improve win rates and retention']
      - ['SME adoption of digital-forwarding tools', driver, current to medium term, 'Supports Nowports’ wedge in recurring mid-market and SME cross-border trade', 'Ask for customer mix by shipment frequency and company size']
      - ['Growth of value-added services such as customs and trade finance', driver, current to medium term, 'Expands differentiation and wallet share beyond pure transport execution', 'Request attach-rate and margin data for financing and protection products']
      - ['Regional trade growth and cross-border complexity', driver, current, 'Keeps demand high for operators that can orchestrate lanes across multiple countries', 'Map revenue by route and customs corridor']
      - ['Port congestion, weather, and road or customs bottlenecks', constraint, current, 'Raises the value of flexibility but also the operating difficulty of service delivery', 'Request SLA performance by lane during disruption windows']
      - ['Regulatory and compliance complexity', constraint, current, 'Creates documentation burden and country-by-country operating friction', 'Review customs and compliance failure rates and local partner structure']
      - ['Capital intensity and working-capital pressure', mixed, current, 'Can deepen customer need for financing while also increasing underwriting risk', 'Request loss history, facility funding source, and repayment performance']
      - ['Traditional incumbent inertia and fragmented workflows', constraint, current, 'Slows sales cycles even when the digital ROI case is clear', 'Ask for sales-cycle length, win/loss reasons, and onboarding friction']
    notes: This table mixes ecosystem-level market drivers with company-relevant pass-through effects because public sources do not disclose a full internal market model for Nowports.
    claimRefs: [CM020, CM021, CM022, CM023, CM024, CM025, CM026, CM027, CM028, CM029, CM030, CM031, CM032]
callouts:
  - calloutType: strength
    title: The pain is operational, not theoretical.
    body: 'Public sources converge on the same demand driver: shippers need visibility, documents, customs handling, and fewer exceptions across unpredictable cross-border routes.'
    claimRefs: [CM002, CM020, CM021, CM024, CM026]
  - calloutType: risk
    title: Public market sizing is layered, not clean.
    body: The broad Latin America logistics estimate and the global digital-forwarding estimate measure different scopes, so any precise TAM claim for Nowports still needs a bottoms-up lane and customer build.
    claimRefs: [CM010, CM011, CM012, CM035]
  - calloutType: insight
    title: Financing and compliance are part of the market wedge.
    body: Nowports’ market is more defensible when customs, insurance, and trade-finance friction are included, because those categories raise switching costs and make generic rate-shopping less decisive.
    claimRefs: [CM004, CM022, CM029, CM031]
