  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention and renewal
    missingEvidence: GRR, NRR, churn, contract length, and cohort shipment frequency by segment.
    whyItMatters: Testimonials do not prove durability or economic quality of the customer base.
    diligencePath: Request retention dashboards by mode, country, and product bundle.
    relatedQuestionRefs:
    - QU016
    - QU017
    - QU025
  - type: private-evidence-only
    severity: material
    topic: customer concentration
    missingEvidence: Top-10 customer share, financed-book exposure by account, and revenue concentration by country or lane.
    whyItMatters: A few large freight customers can dominate revenue and hide account risk.
    diligencePath: Request customer concentration tables and share-of-wallet by account.
    relatedQuestionRefs:
    - QU020
    - QU021
    - QU025
  - type: partial-enumeration
    severity: minor
    topic: independent customer review surface
    missingEvidence: Robust third-party review evidence beyond sparse App Store and review-site entries.
    whyItMatters: Independent satisfaction signals are weaker than company-hosted testimonials.
    diligencePath: Request customer references, NPS, CSAT, and support-resolution metrics.
    relatedQuestionRefs:
    - QU014
    - QU022
    relatedTableRefs:
    - TU003
