- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Financing attachment
    - Large financed accounts may dominate wallet share
    - Could improve stickiness but magnify credit concentration
    - Request top financed accounts and exposure by country
  - - Insurance and protection add-ons
    - Usage may be concentrated among higher-risk shippers
    - Can deepen workflow adoption but not necessarily broad retention
    - Request attachment by segment and renewal behavior
  - - Cross-country operations
    - Large multinational accounts may contribute disproportionate volume
    - Could hide country-level customer concentration
    - Request revenue by country and top-10 accounts
  - - Platform reporting and historical data
    - Best value may be concentrated in recurring movers
    - Occasional shippers may remain low-retention accounts
    - Request product usage by shipment-frequency cohort
  - - Operational account management
    - High-touch service model may create key-account dependence
    - Service disruption could hit retention or expansion
    - Request book of business per account manager
  notes: Expansion can strengthen customer economics, but the same bundles can also hide concentration or exposure if a few large accounts dominate use.
  claimRefs:
