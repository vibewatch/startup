    - Uses segmented documentation and import analysis in one platform
    - Public testimonial implies production use
    - Claims better commercial planning and timely decisions
    - No proof that this is representative of the broader base
  notes: Each named proof row is grounded in attributed public testimonials on two official Nowports pages; that is stronger than logo-only evidence but still weaker than case studies with quantified outcomes.
