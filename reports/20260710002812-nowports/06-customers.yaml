company:
  name: Nowports
chapter:
  number: 6
  title: Customers
  summary: Public evidence suggests Nowports sells primarily to recurring importers and exporters in Latin America whose logistics, operations, and finance teams need visibility, documentation, and sometimes working-capital support. Adoption proof exists through named testimonials, early-segment descriptions, and growth claims, but retention, cohort quality, and concentration remain largely private.
sections:
- id: customer-segments-and-buyers
  title: Customer segments, buyers, and use cases
  body: 'The public record points to a fairly consistent customer shape. Contxto says Nowports targets clients moving roughly 10 to 15 maritime containers per month in retail, automotive, and manufacturing, while official pages repeatedly describe recurrent import and export workflows as the best fit for the platform. Air-freight pages add a different use case: pharma, urgent shipments, high-value goods, and perishables. Mexico Business News and TipRanks imply that finance leaders become more important when inventory financing is attached. This suggests a buyer map centered on logistics and supply-chain operators, with finance and procurement joining when working capital, customs, or cash-timing pain is acute.


    The official testimonial pages reinforce that profile. Oriflame, Ostemex, Segamac, and Grupo Raphael all speak in the language of operations, documentation, planning, and tracking, not casual spot shipping. A separate external design case study says the client platform is used daily by operations teams and shipping managers. F6S categorizes the product as used by small businesses, mid-size businesses, large businesses, and enterprises, which is broad but directionally consistent with a multi-segment logistics tool. The strongest public conclusion is that Nowports serves recurring B2B shippers with meaningful operational complexity, rather than one-off consumers or hobbyist exporters.'
