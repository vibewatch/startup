      label: Recurring shipping pain
      detail: Recurrent import and export operators outgrow manual tracking, fragmented contacts, and ad hoc documentation handling.
      tone: warning
    - id: qualification
      label: Expert qualification
      detail: The customer starts with experts who scope the cargo flow and build the initial logistics solution around mode, lane, and urgency.
      tone: neutral
    - id: onboarding
      label: Account onboarding
      detail: Active customers get account-representative support, browser access, mobile access, and customer-success guidance rather than a pure self-serve install.
      tone: positive
    - id: execution
      label: Production workflow use
      detail: Customers use tracking, documents, alerts, reports, and shipment follow-up during live operations.
      tone: positive
    - id: expansion
      label: Expansion layers
      detail: The relationship can widen into financing, insurance, and deeper planning once the shipper has recurring operational needs.
      tone: positive
