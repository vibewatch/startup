tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale
  - Revenue / strategic value
  - Gap
  rows:
  - - Recurring SME importer
    - 'Buyer: founder/ops; user: logistics coordinator; payer: operations/finance'
    - Monthly import flows needing docs and tracking
    - Contxto says 10-15 containers/month for early-fit customers
    - Likely high because workflow intensity is high
    - Need actual segment revenue split
  - - Mid-market manufacturer / retailer
    - 'Buyer: supply chain lead; user: shipping manager; payer: operations'
    - Cross-border ocean and ground cargo
    - Official testimonials and Contxto support this shape
    - Strategically important because recurring volume makes software useful
    - Need volume by industry and country
  - - Air-freight sensitive shipper
    - 'Buyer: ops / supply chain; user: shipping team; payer: operations'
    - Urgent, high-value, pharma, or perishable cargo
    - Official air page names these categories
    - Potentially high-margin or high-value use case
    - Need actual air mix and repeat rate
  - - Finance-sensitive importer
    - 'Buyer: finance plus logistics; user: ops and finance'
    - Inventory financing tied to shipment cycles
    - Mexico Business and TipRanks point to this use case
    - Could expand wallet share and stickiness
    - Need financing attach rate and default data
  - - Large enterprise workflow user
    - 'Buyer: supply chain leadership; user: shipping managers'
    - Daily platform usage and reporting across teams
    - Valentina case suggests daily use by operations teams and shipping managers
    - Could signal high account depth if repeated broadly
    - Need named enterprise count and ACV
  notes: Segment definitions come from direct product pages, third-party startup profiles, and named user evidence rather than from a formal disclosed company segmentation model.
