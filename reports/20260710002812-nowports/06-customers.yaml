- id: TU006
  title: Customer evidence gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Customer count by active cohort
    - Cannot judge breadth of true adoption
    - Request monthly active account counts by country and mode
  - - Retention and renewal data
    - Cannot underwrite durability
    - Request GRR, NRR, logo churn, and contract renewal history
  - - Top-customer concentration
    - Cannot judge dependence on a few accounts
    - Request top-10 and top-20 revenue share
  - - Attach rate for financing / insurance
    - Cannot quantify expansion quality
    - Request attach by segment and account cohort
  - - Case-study outcome metrics
    - Testimonials remain qualitative
    - Request shipment-time savings, error reduction, and spend outcomes by named account
  notes: The main customer gap is not absence of logos; it is absence of cohort, renewal, and concentration data.
