- id: adoption-trajectory-and-named-proof
  title: Adoption trajectory and named customer proof
  body: 'The public adoption data is real but incomplete. TechCrunch reported 10x year-over-year growth in customers served in the first quarter of 2022, and Contxto described a business with about 300 employees across seven countries by late 2021. LATKA later listed 40 customers, which is directionally useful but should be treated cautiously because the methodology is not transparent and appears inconsistent with broader company narratives. What matters more than the exact number is that several sources converge on recurring use, operational depth, and multi-country service. The Valentina case study is especially telling because it says the client-facing platform was used daily by operations teams and shipping managers, which is stronger product-adoption language than a simple logo carousel.


    Named customer proof is also better than a generic logo wall. The official platform and digitalization pages publish attributed quotes from Oriflame, Ostemex, Segamac, and Grupo Raphael. Those testimonials consistently mention documentation access, real-time tracking, invoice retrieval, operational agility, and planning benefits. This does not prove retention or commercial scale for each account, but it does show that identifiable business users publicly describe Nowports as a production workflow tool rather than as a pilot experiment. In customer diligence terms, that is meaningful proof of utility even if it falls short of fully underwritten cohort evidence.'
  claimRefs:
