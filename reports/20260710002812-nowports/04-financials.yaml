  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unit economics
    missingEvidence: Gross margin, contribution margin, CAC, payback, and revenue recognition policy by product line.
    whyItMatters: Topline growth is not enough to judge quality in freight-forwarding and embedded-finance models.
    diligencePath: Request audited financial statements, revenue-recognition memo, and management KPI pack.
    relatedQuestionRefs:
    - QI009
    - QI021
    - QI022
    - QI025
  - type: private-evidence-only
    severity: material
    topic: liquidity and funding structure
    missingEvidence: Cash on hand, burn, runway, warehouse lines or debt, and cost of funds for the financing business.
    whyItMatters: Working-capital intensity and credit exposure can dominate economics even when revenue looks strong.
    diligencePath: Request treasury report, debt schedule, covenant summary, and monthly cash bridge.
    relatedQuestionRefs:
    - QI016
    - QI017
    - QI019
    - QI025
  - type: private-evidence-only
    severity: material
    topic: credit performance
    missingEvidence: Delinquency, write-offs, recoveries, and on/off-balance-sheet treatment of financed customer exposure.
    whyItMatters: Financing can deepen margin and retention or create hidden losses depending on underwriting quality.
    diligencePath: Request financing vintages, cohort performance, and facility structure by country.
    relatedQuestionRefs:
    - QI014
    - QI019
    - QI025
