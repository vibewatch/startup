- id: traction-and-public-financial-proxies
  title: Traction and public financial proxies
  body: 'The strongest public traction datapoints are directional, not complete. Latka reports Nowports revenue of US$11.8 million in 2021, US$50 million in 2022, and US$397.7 million in 2024. TechCrunch separately reported that first-quarter 2022 revenue rose more than 12x year over year while containers shipped and customers served each rose about 10x year over year. Those numbers, if taken at face value, imply extremely fast scaling during the freight-market boom and the company’s expansion across more Latin American markets. But they should still be handled carefully because private-company revenue figures are not filing-backed and may reflect gross freight value rather than cleaner net revenue or gross-profit metrics.


    That caveat is exactly why public listed forwarder filings are useful as proxies. Expeditors’ annual report and C.H. Robinson’s 10-K both show that freight-forwarding economics mix pass-through carrier costs, handling fees, timing judgments, receivables, and working-capital management. Expeditors explicitly describes buy-rate and sell-rate dynamics and shows customs brokerage and other services as a large part of revenue. C.H. Robinson explains that transportation and logistics contracts require significant judgment over performance obligations and revenue recognition timing. Those filings do not tell investors what Nowports earns, but they do demonstrate what must be disentangled before any headline revenue figure can be underwritten: net revenue, gross profit, customer concentration, credit terms, and the split between transport volume and value-added services.'
