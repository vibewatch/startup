    - Cannot judge revenue quality or software leverage
    - Request monthly P&L split for freight, financing, insurance, and support
  - - Revenue-recognition policy
    - Topline may not equal economic value added
    - Review accounting memo and auditor discussion for principal-versus-agent treatment
  - - Cash balance and runway
    - Cannot assess capital adequacy or urgency of next raise
    - Request latest cash position, burn, and 12-18 month forecast
  - - Financing loss performance
    - Cannot underwrite credit economics
    - Request vintage curves, delinquencies, write-offs, and recovery process
  - - Customer concentration and cohort retention
    - Cannot distinguish durable freight revenue from cycle-driven spikes
    - Request cohort analysis and top-customer concentration
  - - Sales efficiency metrics
    - Cannot compare growth quality to SaaS-like claims
    - Request CAC, payback, quota attainment, and sales productivity
  - - Working-capital bridge
    - Cannot see whether growth consumes or releases cash
    - Request DSO, DPO, carrier prepayment exposure, and financing draw structure
