- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Company
  - Price / contract model
  - Included capabilities
  - Discounts or unknowns
  - Implication
  rows:
  - - Nowports
    - Quote-led freight contract plus platform access
    - Multimodal forwarding, platform, reports, alerts, docs, financing options
    - No public list pricing; realized take rate unknown
    - Competitive posture likely depends on bundled workflow value rather than transparent sticker price
  - - Flexport
    - Demo / enterprise sales motion
    - Forwarding, customs, fulfillment, visibility, advisory, working-capital messaging
    - No public standardized price card in local source set
    - Large-scope enterprise packaging can raise switching costs if adopted deeply
  - - Freightos
    - Marketplace and enterprise packaging
    - Instant quotes, booking, integrations, rate distribution, API connectivity
    - Realized buyer pricing varies by carrier and workflow
    - More transparent booking workflow can pressure opaque forwarding margins
  - - Forto
    - Contact / managed-service sales motion
    - Platform visibility, notifications, communications, multimodal freight services
    - Public pricing not disclosed
    - Competes on service-plus-platform quality instead of public list price
  - - Nuvocargo
    - Pilot-based commercial motion
    - AI execution, managed transportation, brokerage, customs
    - Pilot pricing not public; minimum-load trial disclosed instead
    - Low-friction pilots can make displacement easier in corridor-specific accounts
  - - Traditional forwarders
    - Negotiated lane-by-lane quotes
    - Execution and relationship management
    - Opaque price discovery and fewer digital tools
    - Can still win on relationship or spot-rate flexibility despite weaker software
  notes: The public record shows packaging style more clearly than list price. Freight forwarding remains largely quote-driven, so packaging and workflow scope are more observable than posted rate cards.
