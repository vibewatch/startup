tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Nowports
    - Regional digital freight forwarder
    - Raised about $243M-$243M+; Series C at $1.1B; 8+ LATAM offices in historical profiles
    - Latin American importers and exporters, especially recurring mid-market flows
    - Combines forwarding, platform, reporting, financing, and insurance adjacencies in one regional workflow
    - Public evidence on realized pricing, retention, and margin durability remains limited
  - - Flexport
    - Global software-led freight forwarder
    - Large global platform with customs, fulfillment, and working-capital messaging
    - Brands and shippers needing broad global logistics orchestration
    - Control-tower breadth, customs tooling, fulfillment, and global network scale
    - Less Latin America-specific in positioning than Nowports
  - - Freightos
    - Booking marketplace / connectivity platform
    - 425K transactions, 20.6K unique buyer users, 79 carrier partners from Q1 2026 results cited on homepage
    - SMBs, enterprises, carriers, and forwarders needing booking and connectivity
    - Vendor-neutral quotes, integrations, and network effects
    - Less obviously a full-service LatAm execution partner
  - - Forto
    - Technology-first managed forwarder
    - 2.5k customers and 100+ countries on public homepage
    - Global shippers wanting managed international freight with data tooling
    - Data quality, notifications, AI-assisted support, and customer platform
    - Regional specialization in Latin America is not the core message
  - - Nuvocargo
    - Corridor specialist with AI operations
    - North American corridor specialist offering pilots from as few as 10 loads
    - US-Mexico-Canada freight operators
    - AI agents, customs, managed transportation, and low-friction pilot model
    - Geographic scope is narrower than Nowports’ broader LatAm footprint
  - - KLog
    - Regional logistics operator
    - Physical presence shown across Chile, Peru, Bolivia, and Mexico
    - Regional shippers wanting a LatAm operator
    - Regional footprint and local-market presence
    - Public digital-product evidence is thinner than Nowports or global digital peers
  - - Traditional forwarders / brokers
    - Status-quo incumbent set
    - Relationship-based local operators and broker networks
    - Importers that still buy mainly on trust, lane relationships, and price
    - Human flexibility and local relationships
    - Fragmented workflows, weaker visibility, and less standardized reporting
  notes: The table groups buyer alternatives by business model so Nowports is compared against both software-led peers and incumbent substitutes, not just venture-backed startups.
