callouts:
  - calloutType: strength
    title: Founder-market fit is real, not cosmetic.
    body: The YC and Mouro records both point to founders with direct freight-forwarding exposure and a product thesis built around messy real-world trade workflows, not a generic logistics SaaS abstraction.
    claimRefs: [CO004, CO005, CO006, CO008]
  - calloutType: risk
    title: Public scale disclosure is weaker than fundraising disclosure.
    body: Funding history is well corroborated, but current headcount, customer count, and audited revenue are not. That makes the company easier to narrate than to fully underwrite from public information alone.
    claimRefs: [CO017, CO018, CO019, CO023, CO038]
  - calloutType: insight
    title: Nowports is trying to own the workflow around freight, not just the booking.
    body: Official and partner materials consistently frame the company as a single operating layer connecting transport, documents, reporting, alerts, protection, and financing, which is strategically more ambitious than traditional forwarding.
    claimRefs: [CO002, CO028, CO029, CO031, CO037]
