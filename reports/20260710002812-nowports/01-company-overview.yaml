company:
  name: Nowports
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Nowports is a Monterrey-founded digital freight forwarder that expanded rapidly from Y
    Combinator roots into a 2022 unicorn round at a $1.1 billion valuation. Public evidence
    strongly supports the company’s multimodal logistics-plus-platform strategy and funding
    history, but current revenue, headcount, customer count, and governance disclosure remain
    materially less precise than the headline fundraising story.
sections:
  - id: identity-product-stage
    title: Identity, Product, and Stage
    body: |-
      Nowports is best understood as a tech-enabled freight forwarder built around the pain points of Latin American importers and exporters rather than as a pure software vendor. The company’s current official pages and FAQ consistently present the offer as a combination of ocean, air, ground, and multimodal freight execution plus a digital operating layer for documentation, alerts, reporting, and shipment tracking. That framing matters because the company is selling workflow compression and visibility at the same time: customers can book cargo, centralize freight paperwork, track exceptions, and in some markets coordinate insurance, customs support, and financing from one relationship. The official site also emphasizes that the company wants to be a single point of contact for cargo movement, protection, and financing, which shows why the product suite has expanded beyond booking alone.

      Founded in 2018, Nowports publicly ties its origin story to Monterrey, Mexico and to the logistics experience of its founders. The reviewed sources consistently support the 2018 founding year, Y Combinator W19 participation, and a Latin America focus from day one. Public descriptions also show that the company’s lane logic is not purely domestic: official pages emphasize coverage between China, Latin America, and the world, while third-party coverage highlights Asia-to-Latin America maritime flows and US-to-Mexico ground freight. In underwriting terms, the identity is therefore coherent: a Latin American digital forwarder using software, analytics, and finance to reduce operational friction in cross-border trade rather than a marketplace with no execution exposure.
    claimRefs: [CO001, CO002, CO003, CO007, CO028, CO029, CO032, CO033, CO035, CO036, CO037]
    tableRefs: [TO001]
    figureRefs: [FO002, FO003]
  - id: founders-leadership-governance
    title: Founders, Leadership, and Governance
    body: |-
      Founder-market fit is one of the strongest parts of the public record. The Y Combinator company profile says Alfonso de los Ríos and Maximiliano Casal met in 2017, that Casal learned the industry while working for a major freight forwarding group, and that de los Ríos grew up around the sector because his family owned a traditional forwarding business in Mexico. That background makes the current operating model more credible: the company is not a generic software team approaching logistics from the outside, but rather a founder pair that came in through shipping pain points, documentation friction, and customer communication failures. Mouro Capital’s investment note reinforces that interpretation by explicitly describing the founders as combining regional and industry knowledge with a tech-enabled operating model.

      Leadership, however, has evolved. Public reporting in April 2025 said Alfonso de los Ríos stepped out of the CEO role and became president while Fernando Poitevin moved into the CEO seat after previously joining as COO. The same article said co-founder Maximiliano Casal had already left day-to-day operations while remaining on the board. That transition is important for diligence because it cuts both ways. On one hand, it reduces pure founder-key-person concentration and suggests the company has reached a scale where operating discipline matters more. On the other hand, public governance disclosure remains thin: reviewed official pages do not publish a full board roster, committee structure, or executive bench below the top layer. The result is a founder-origin business moving toward institutionalization, but not yet one whose governance is fully transparent from public materials alone.
    claimRefs: [CO004, CO005, CO006, CO012, CO013, CO026, CO027, CO032]
    tableRefs: [TO002]
  - id: funding-scale-stakeholders
    title: Funding History, Scale, and Stakeholders
    body: |-
      Nowports scaled unusually quickly between 2021 and 2022. Tracxn, TechCrunch, Crunchbase News, PR Newswire, Contxto, and LatamList all converge on the same broad funding arc: a July 2021 Series A, a December 2021 $60 million Series B, and a May 2022 $150 million Series C at a $1.1 billion valuation. Public databases and articles differ on whether the 2021 A round should be counted as $16 million or $24 million once extensions are included, but they align on the larger point that the business raised more than $240 million by the time it became a unicorn. Investor quality also matters. SoftBank Latin America Fund led the Series C, Tiger Global backed both the B and C, and earlier investors included Foundation Capital, Mouro Capital, Base10, monashees, Y Combinator, Soma, and Broadhaven.

      Scale signals are directionally strong but uneven in precision. TechCrunch reported more than 500 employees in May 2022, the Y Combinator profile currently shows team size 550, Latka reports roughly 304 employees, and Tracxn shows 280 employees as of April 2026. That inconsistency does not mean the business is weak; it means public headcount data should not be treated as a clean cover metric without management confirmation. Revenue disclosure is similar. Latka reports $397.7 million of 2024 revenue, while TechCrunch only gave relative growth disclosures in 2022. The right diligence conclusion is that public sources support meaningful scale, but not a single definitive current KPI pack for revenue, customers, or staffing.
    claimRefs: [CO008, CO009, CO010, CO011, CO014, CO015, CO016, CO017, CO018, CO019, CO020, CO021, CO022, CO023]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: milestones-and-adverse-signals
    title: Milestones and Adverse Signals
    body: |-
      The company’s milestone path shows both ambition and execution complexity. After founding in 2018 and joining Y Combinator in 2019, Nowports used 2021 and 2022 to accelerate country expansion, financing products, and platform breadth. Official pages now market not only transportation modes but also insurance coordination, document management, analytics, route support, and financing. Mexico Business News described the newer financing service as a way to bring logistics, financing, and cargo insurance into a unified experience for Mexican SMEs, which fits the broader one-stop-shop thesis already visible in TechCrunch, Mouro, and official product pages. The platform pages reinforce the same strategic goal by presenting reporting, alerts, tracking, and centralized documents as differentiators rather than add-ons.

      Adverse signals are real and should not be hidden behind the unicorn narrative. Montevideo Portal reported layoffs in 2023 and cited sector sources who estimated cuts near 15% of the workforce, even though the company publicly confirmed only that “some” employees were let go in a drive for efficiency. Public headcount estimates also conflict across sources, which increases uncertainty around current operating scale. Leadership turnover in 2025 is another meaningful marker: a founder stepping back from the CEO seat can signal maturation, but it can also reflect the need for tighter operating discipline after hypergrowth. None of these signals invalidates the company’s market relevance; they do, however, mean that the public story is strongest on strategic direction and fundraising, and weaker on stable, audited disclosure of current operating health.
    claimRefs: [CO018, CO019, CO024, CO025, CO026, CO027, CO028, CO029, CO030, CO031, CO038]
    tableRefs: [TO004]
