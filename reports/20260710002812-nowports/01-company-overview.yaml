  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: A current board roster, committee map, observer rights, and executive org chart below the CEO/president layer.
      whyItMatters: Public governance visibility is materially weaker than funding visibility, which makes control and oversight harder to underwrite.
      diligencePath: Request board materials, org chart, and latest cap-table governance schedules from management.
      relatedQuestionRefs: [QO009, QO014]
      relatedTableRefs: [TO002]
    - type: conflicting-data
      severity: material
      topic: headcount
      missingEvidence: One authoritative current employee count by function and geography.
      whyItMatters: Public sources conflict on current scale, which affects operating leverage, customer support capacity, and burn assumptions.
      diligencePath: Obtain HRIS-export headcount, attrition, and org-by-location data for the current quarter.
      relatedQuestionRefs: [QO016, QO019]
      relatedTableRefs: [TO003]
    - type: private-evidence-only
      severity: material
      topic: revenue
      missingEvidence: Audited revenue, gross margin, customer count, and current-period run-rate disclosure.
      whyItMatters: The public narrative supports scale but not enough precision to underwrite quality of revenue or margin durability.
      diligencePath: Request financial statements, revenue bridge, top-customer concentration, and cohort files.
      relatedQuestionRefs: [QO015, QO017, QO025]
