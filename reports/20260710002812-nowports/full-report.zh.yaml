      - number: '4.3'
        title: 营运资金、成本结构与资本充足性
        blocks:
          - type: paragraph
            body: >-
              公开证据反复指向一个核心财务问题：营运资金。Capchase 案例研究称，单箱成本从约 US$2,000 涨到最高 US$13,000； Nowports 使用 Capchase Grow 和 Capchase
              Earn，是为了不把股权资本耗在日常物流支出上。Mexico Business News 和 TipRanks 都把融资描述为关键产品， 这说明公司不只是转嫁运费，还承担授信、还款和流动性管理的复杂度。即便
              FAQ 提到最长 30 天账期，也暗示公司可能需要在客户回款与承运商或合作伙伴义务之间垫付时间差。


              上市货代公司的申报文件把影响讲得很清楚。Expeditors 称流动性来自现金和经营活动，但也提到为报关经纪客户提供了大量短期现金垫款； C.H. Robinson
              把营运资金压力、供应商失败和应收周期拉长列为重大风险。Nowports 自己的公开资料没有披露在手现金、月度烧钱、现金跑道、违约率，
              也没有说明融资是表内、仓储融资支持还是合作伙伴出资。这个缺口更重要，因为公司已经经历过 2022 年后的效率重置： Montevideo Portal 报道裁员约占员工 15%，El Financiero
              随后报道 Fernando Poitevin 接任 CEO，并带出明确的运营转型信息。 这些信号不能证明困境，但说明资本纪律和运营重组是当前故事的核心。
