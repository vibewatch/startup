      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              创始人与市场的匹配，是公开记录里最强的一块。Y Combinator 公司档案称，Alfonso de los Ríos 与 Maximiliano Casal 在 2017 年相识； Casal
              在一家大型货代集团工作时学会这个行业，de los Ríos 则从小接触这个领域，因为他的家族在墨西哥经营传统货代业务。
              这段背景让当前运营模式更可信：公司不是一个从外部切入物流的通用软件团队，而是一对从发运痛点、单证摩擦和客户沟通失败里走出来的创始人。 Mouro Capital
              的投资笔记也强化了这个判断，明确把两位创始人描述为把区域与行业知识同科技赋能运营模式结合起来。


              领导层已经发生变化。2025 年 4 月公开报道称，Alfonso de los Ríos 不再担任 CEO，转任总裁；此前以 COO 身份加入的 Fernando Poitevin 接任 CEO。
              同一篇文章称，联合创始人 Maximiliano Casal 已退出日常运营，但仍留在董事会。这个交接对尽调很重要，因为它两面都成立。
              一方面，它降低了纯粹的创始人关键人集中度，也说明公司已到一个更需要运营纪律的规模。另一方面，公开治理披露仍然很薄：
              审阅过的官网页面没有公布完整董事会名单、委员会结构，也没有展示顶层之下的高管梯队。结果是，公司从创始人起家的业务走向机构化，但仅靠公开材料还看不到完全透明的治理。
