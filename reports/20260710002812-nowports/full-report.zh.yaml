      - 可能性
      - 严重性
      - 公开证据
      - 缓释成熟度
      - 剩余敞口
      - 未解决缺口
    rows:
      - - 拉美航线上的港口、机场和边境中断
        - 高
        - 高
        - World Bank 和 Maersk 都强调边境与多式联运设施延误，以及区域性中断驱动因素
        - 中
        - 即便有可视化工具，客户仍会承受 ETA 滑移和成本上涨
        - 需要航线级恢复 KPI 和改道预案
      - - 承运商运力和价格波动
        - 中高
        - 高
        - Expeditors 文件称，当需求超过运力或费率快速波动时，服务质量和利润率可能受损
        - 中
        - 如果承运商价格变化快于客户重新定价，毛利率可能被压缩
        - 需要重新定价节奏、航线利润率波动，以及现货与合约组合
      - - 网络安全或第三方数据事件
        - 中
        - 高
