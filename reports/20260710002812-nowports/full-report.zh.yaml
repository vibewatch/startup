      - number: '8.4'
        title: 退出准备度、论点击穿触发因素与最终尽调请求
        blocks:
          - type: paragraph
            body: >-
              退出准备度看起来有可能，但还无法干净承销。公开证据足以让人相信 Nowports
              已搭建出一个真实区域平台：有官方推荐语、有日常使用信号，产品宽度也超过简单经纪商；第三方来源还显示公司已经越过实验阶段。这足以让战略出售、后期融资或最终流动性可选项继续存在。但可选项不等于准备就绪。公开利润率披露单薄、信用和集中度问题未解，且缺少公开股权结构表或清算优先权细节，都会降低任何精确回报模型的可信度。


              最终尽调姿态应该很明确。投资人应要求按运输模式和地理划分的 2025、2026 年更新收入，毛利率和经营利润率桥表，融资账本表现，客户集中度，分群留存，以及优先权堆栈细节。还应测试裁员后、CEO
              更替后的组织是否真的在提升服务质量和聚焦度。若答案强，Nowports 可能在纪律化定价下支撑建设性估值立场。若答案弱，论点会很快被击穿，因为物流加金融模型会惩罚过度乐观。因此，价格敏感性仍是建议的核心。
