      - number: '2.4'
        title: 市场判断与待解问题
        blocks:
          - type: paragraph
            body: >-
              Nowports 的公开市场论证，在被表述为“为拉美中小企业和中端货主数字化一个碎片化、波动剧烈的跨境物流工作流”时最有力。
              品类足够大，痛点真实，买方愿意为可视化和工作流压缩付费，也得到独立市场报告和竞争对手产品定位的支持。 公司还受益于一个产品切入点：比基础货代更宽，但又比为贸易搭一套完整 ERP 更窄。这个中间位置可信。


              市场故事最弱的一环，是公开资料没有把大市场规模干净地转化为 Nowports 真正可触达的收入池。公开来源没有披露平均合同价值、发运留存、按国家划分的客群组合，
              也没有说明把信用敞口、合规和本地运营强度纳入后，公司现实中能服务多大市场。因此，正确的尽调姿态不是接受某个单一 TAM 数字， 而是要求按航线、行业、发运频次和融资绑定率自下而上搭一张市场地图。
