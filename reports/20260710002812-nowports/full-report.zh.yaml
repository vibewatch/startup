      - number: '6.3'
        title: 留存、满意度与扩张信号
        blocks:
          - type: paragraph
            body: >-
              直接留存披露很弱，但仍有可用替代指标。FAQ 称平台在经常性货运中表现最好，意味着客户只有货量足够、开始重视报表、提醒和历史数据时，价值才最明显。Oriflame、Ostemex、Segamac 和 Grupo
              Raphael 的推荐语都讲的是持续运营收益，而不是一次性成功；Segamac 的引述还专门提到付款提醒、减少与多人沟通的需要，说明工作流已经嵌入。Capchase 的案例研究暗示，Nowports
              对日常运营足够重要，以至于公司围绕物流支出寻找融资方案，而不是把这项服务视为随时可替代。


              即便有这些正面信号，公开记录仍不足以证明耐久性。没有披露 NRR、GRR、流失率、续约率、平均合同期限或活跃账户分群趋势。App Store 页面太单薄，不能作为强客户满意度信号；Serchen
              也明确表示那里没有评论。因此，合理但不完整的图景是：在同时使用平台和融资功能的经常性运营客户中，Nowports
              留存可能更强；但集中度风险、续约质量和扩张经济性仍需要私有数据验证。投资人不应把具名推荐语误当成完整留存数据集。
