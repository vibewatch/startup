      - CV024
      - CV036
      - CV037
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    summary: 基于第三方 2024 年收入锚点 $397.7M 和一组收入倍数，展示示意性股权价值敏感性。
    data:
      items:
        - label: 1.0x 收入
          value: 398
          detail: 接近重折价情景的示意性底部
        - label: 1.5x 收入
          value: 597
          detail: 若不透明折价仍重，基准情景低端
        - label: 2.0x 收入
          value: 795
          detail: 若增长质量尚可，基准情景中枢
        - label: 2.5x 收入
          value: 994
          detail: 接近旧独角兽估值线，但仍低于该水平
        - label: 3.0x 收入
          value: 1193
          detail: 需要强烈相信陈旧估值风险已被消化
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
  - id: FV003
    title: 估值 / 回报区间
    type: range
    summary: 当前价值情景区间说明，推荐高度取决于价格，而不是绝对看多或看空。
    data:
      items:
        - label: 悲观
          low: 300
          mid: 400
          high: 500
          detail: 若增长或信贷质量不及预期，出现下行情景
        - label: 基准
          low: 550
          mid: 725
          high: 900
          detail: 当前公开证据最能支撑的区间
        - label: 乐观
          low: 950
          mid: 1100
          high: 1300
          detail: 需要利润率、留存和纪律性执行的最新证据
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV032
  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: 按投资委员会口径，从证据、经济性可见度、风险和估值支撑做评分卡。
    data:
      items:
        - label: 收入规模
          value: 8/10
          detail: 如果第三方收入估算方向正确，规模已足够重要
        - label: 客户证据
          value: 7/10
          detail: 好过单纯 logo 墙，因为存在具名用户和日常使用信号
        - label: 护城河可见度
          value: 5/10
          detail: 数字工作流和区域执行重要，但护城河持久性尚未充分证明
        - label: 经济性可见度
          value: 3/10
          detail: 未公开经审计利润率、烧钱速度或融资资产账簿披露
        - label: 风险负荷
          value: 3/10
          detail: 信贷、集中度和执行风险仍然重大
        - label: 估值支撑
          value: 4/10
          detail: 旧价格锚仍在，但新证据支撑偏弱
        - label: 退出准备度
          value: 5/10
          detail: 具备可能性，但受披露和行业重估约束
        - label: 当下整体可投性
          value: 4/10
          detail: 公司有看点，但公开证据不足以支撑激进价格
    claimRefs:
      - CV020
      - CV021
      - CV024
      - CV036
      - CV039
      - CV040
