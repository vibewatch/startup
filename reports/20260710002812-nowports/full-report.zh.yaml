      - number: '1.3'
        title: 融资历史、规模与利益相关方
        blocks:
          - type: paragraph
            body: >-
              Nowports 在 2021-2022 年扩张得异常快。Tracxn、TechCrunch、Crunchbase News、PR Newswire、Contxto 和 LatamList
              对融资轨迹的描述大体一致： 2021 年 7 月 Series A 轮、2021 年 12 月 $60M Series B 轮、2022 年 5 月 $150M Series C 轮，估值 $1.1B。
              公开数据库和文章对 2021 年 A 轮在计入追加融资后应算 $16M 还是 $24M 有分歧，但核心一致：成为独角兽时，公司已融资超过 $240M。 投资人质量也重要。SoftBank Latin
              America Fund 领投 C 轮，Tiger Global 参与 B 轮和 C 轮，更早投资人包括 Foundation Capital、Mouro Capital、Base10、monashees、Y
              Combinator、Soma 和 Broadhaven。


              规模信号方向上强，但精度参差。TechCrunch 2022 年 5 月报道员工超过 500 人，Y Combinator 档案目前显示团队规模 550 人，Latka 报告约 304 人，Tracxn 显示截至
              2026 年 4 月为 280 人。 这种不一致不等于业务弱，而是说明没有管理层确认，公开员工数不能当干净的封面指标。收入披露也类似。Latka 报告 2024 年收入 $397.7M，TechCrunch
              2022 年只披露相对增长。 正确的尽调结论是：公开来源支持公司已有可观规模，但尚未给出一个关于收入、客户或人员的单一、确定的最新 KPI 包。
