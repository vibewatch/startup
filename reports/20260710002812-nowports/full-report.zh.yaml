      - number: '2.2'
        title: 规模测算口径与买方分层
        blocks:
          - type: paragraph
            body: >-
              公开市场规模只有分层使用才有用。Mordor 估算，全球数字化货代市场 2026 年为 $51.43B，2031 年达到 $118.12B，CAGR 为 18.09%；
              这个口径把软件赋能货代层定义成快速增长品类。相比之下，IMARC 估算更宽的拉丁美洲货运与物流市场 2025 年为 $1,102.6M，2034 年增至 $1,715.6M， CAGR 只有
              4.88%，且品类定义更宽。这些估算不是互相矛盾，更多是在量不同的东西。更稳妥的结论是：Nowports 位于一个更大但增长较慢的区域物流底盘内， 同时处在其中快速数字化的子类别。


              最有用的买方分层，来自把公开市场类别与公司披露的工作流对齐。IMARC 把制造、批发零售、农业、建筑、油气、采矿和其他行业列为关键终端用户组。 Contxto 报道称，Nowports 早期目标客户通常每月移动
              10 至 15 个海运集装箱，来自零售、汽车和制造业。官方空运页面还点名医药、紧急货件、高价值货物和易腐品。
              因此，买方责任大概率落在中小企业和中端货主内部的物流、供应链、进出口和运营负责人身上；一旦融资、报关、保险或成本控制进入讨论，财务和采购会变得更重要。
