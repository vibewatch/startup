  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、既有玩家与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Nowports 不是只在和一家创业公司竞争。买方可以用四条路径解决同一件事：Nowports 这样的区域数字化货代，Flexport 或 Forto 这样的全球软件牵引型货代， Freightos
              这样的撮合市场或订舱基础设施层，或者传统货代、报关行和内部电子表格的组合。Nowports 官网把公司呈现为面向拉丁美洲的数字化货代，
              覆盖海运、空运、陆运、保险、报表、单证管理、提醒和融资。这个更宽的范围很重要，因为它意味着公司卖的是工作流压缩，而不是单一运输腿。 从竞争角度看，Nowports 更接近平台加服务模式，而不是纯运价聚合器。


              独立来源大体认同这种分类。YC、Tracxn 和 PANCO 都把 Nowports 描述为数字化货代，而不是通用 SaaS 厂商；Supply Chain Digital 则把它称为所在品类中最大的拉美货代。
              但现状替代仍包括传统货代；它们有本地关系和灵活的人工处理能力，仍是真实替代方案，因为许多进口商第一天并不需要完整数字化迁移。 结果是，Nowports
              必须同时打赢现代软件牵引型同业，以及根深蒂固的低技术替代者；后者可以在具体航线上用更低价格或更强关系压过新进入者。
