  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与合规风险
        blocks:
          - type: paragraph
            body: >-
              最具体的公开监管风险不是已披露的执法行动，而是跨境物流、报关处理、支付相关数据和金融科技相邻工作流混在一起后扩大的合规界面。Nowports
              隐私政策称，公司收集账户、支付、税务、设备、地理位置和使用信息；条款又称，自动化 AI
              代理可能分析并联系用户。这个组合让数据处理、同意管理、供应商监督和事件响应都变得重要，尤其是同一隐私政策还明确表示，互联网传输不可能绝对无漏洞。公开安全页面只提供很薄的受理入口，而不是详细控制叙事；这不等于失败证据，但确实留下尽调缺口。


              海关合规是第二大法律风险。Baker McKenzie 2026 年 1 月提示称，墨西哥通过 VUCEM 提交电子海关价值申报的要求将于 2026 年 4 月 1
              日生效，并要求更严格的单证关联、更正流程和内部培训。CNBV 材料显示，墨西哥金融科技框架仍是结构化监管环境，包含 API、AML
              和机构层面规则；只要物流运营商扩展到融资相邻产品或客户现金流支持，这些规则就会相关。正确解读不是 Nowports
              明显不合规，而是它的商业模式触及受监管流程，运营失误可能很快变成法律、金钱或客户信任问题。因此，投资人在假设公司扩张路径无摩擦之前，需要按市场梳理牌照、签约主体、报关代理角色和数据治理归属。
