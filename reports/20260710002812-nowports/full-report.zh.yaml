  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 推荐结论沿着一条简单链条展开：真实规模和证据让故事仍有生命力，但估值纪律占主导，因为披露和风险缺口仍然很大。
    data:
      nodes:
        - id: scale
          label: 真实规模
        - id: proof
          label: 客户 / 产品证据
        - id: risk
          label: 风险 + 不透明
        - id: price
          label: 价格纪律
        - id: call
          label: 跟踪 / 继续研究
      edges:
