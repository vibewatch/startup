      - number: '6.4'
        title: 扩张、集中度风险与客户结论
        blocks:
          - type: paragraph
            body: >-
              公开客户叙事足以支持继续尽调，但不足以定案。最强的论点是，Nowports
              找到了真实客户细分：拉美地区经常发货、运营复杂、单证痛点明显、偶尔需要营运资金的托运人。最大上行空间在于，这些客户可以从货运执行延伸到融资、保险和计划工作流，从而提高账户价值和切换成本。叙事最弱的部分，正是公开创业公司报道几乎不会给投资人的东西：分群表、集中度、续约条款和账户级钱包份额。没有这些数据，就无法判断增长来自大量耐久的中端市场账户，还是少数货量很重的客户。


              因此，客户结论应该保持平衡。相比许多私营公司尽调材料，这里的具名证据更好：公司展示了可引用客户，也有外部观察到的日常使用平台。但公开证据仍没有说明那些最亮眼账户是否会续约、扩张，或长期保持盈利。客户尽调应聚焦账户集中度、重复发货频率、融资附着率，以及由推荐语支撑的客户是否代表更广泛的存量客户群，还是只代表其中最成功的一角。
