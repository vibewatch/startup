      - number: '2.3'
        title: 驱动因素、约束与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开证据里最强的驱动因素是可视化、数字化和波动管理。World Bank 称，从出口港入场到目的港出场平均需要 44 天，端到端供应链数字化可以显著缩短港口延误。 Mordor
              称，需求正在转向能解决可视化、单证和合规缺口的平台，而不只是切换运输方式；中小企业已经代表数字化货代需求的大多数。 Maersk 和 Solistica
              则补上这些抽象概念背后的运营现实：拉美货主面对港口拥堵、海关复杂性、天气扰动、劳工压力和航线波动， 因此多式联运灵活性和实时提醒比单纯最低报价更有价值。Mouro
              的投资笔记也符合这一模式，认为透明度和效率在拉美贸易流里格外有价值。


              约束同样真实。Mordor 点出监管复杂性、基础设施缺口和既有玩家阻力是核心障碍；World Bank 强调海港、机场和多式联运瓶颈；
              最近的拉美市场更新也提到多个国家的报关延误、道路施工和港口拥堵。因此，采用路径不是一键式 SaaS。
              买方首先要有痛感强的进口或出口工作流，其次要有足够发运频次，才会在意单证和可视化；随后还要有足够信任，才会把货物路径以及可能的融资或保险交给同一家提供商。 这解释了为什么 Nowports
              看起来更聚焦高频发运客户，而不是偶发货主；也解释了为什么融资、报关支持和报表不是边缘产品，而是采用加速器。
