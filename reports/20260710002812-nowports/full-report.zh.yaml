      - number: '3.2'
        title: 同业画像与能力差异
        blocks:
          - type: paragraph
            body: >-
              最重要的直接数字化同业呈现出三类原型。Flexport 销售一个宽泛的全球物流操作系统，组合了可视化、货代、报关经纪、履约、关税工具，甚至营运资金收益。 Freightos
              更像卖方中立的订舱和连接层：官网强调即时报价、企业集成、货代工具、API 连接，以及由承运商和货代参与者组成的大网络。 Forto
              把自己定位为技术优先的管理式运输提供商，提供平台可视化、通知和数据质量。Nuvocargo 已收窄到北美走廊，并明显转向 AI 辅助的货运执行、报关和管理式运输。 KLog
              则是一个拉美区域替代方案，在多个国家有实体存在，即使公开的数字化证据较薄。


              面对这组对手，Nowports 的强项不是每个维度上绝对的功能领先，而是拉美区域聚焦、多式联运货代、面向客户的平台，以及嵌入式融资或保险配套业务的组合。
              对在拉美、亚洲和北美之间移动货物的中端进出口商来说，这套组合可能比全球一刀切栈更贴近需求。但这也意味着公司同时横跨服务执行、软件和资本产品。
              产品范围更窄的竞争者可能赢在单点最佳软件；更大的全球平台可能赢在规模、集成和资产负债表深度。
