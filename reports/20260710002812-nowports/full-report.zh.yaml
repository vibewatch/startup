  - id: TR003
    title: 合作伙伴 / 依赖风险登记表
    columns:
      - 依赖
      - 交易对手 / 层级
      - 角色
      - 集中风险
      - 失效场景
      - 严重性
      - 缓释信号
      - 剩余敞口
    rows:
      - - 承运商和货运运力
        - 空运、海运和陆运服务商
        - 搬运货物并决定实际服务边界
        - 压力航线上可能较高
        - 运力冲击或费率飙升会削弱服务和利润率
        - 高
        - 多式联运定位和可视化工具
        - 承运商侧中断仍在 Nowports 控制之外
      - - 报关代理 / 本地运营商
        - 国家层面的清关生态
        - 执行申报和单证处理
        - 可能存在单一国家集中
        - 代理错误或本地控制薄弱会造成延误或合规问题
        - 高
        - 数字单证工作流和面向客户的可视化
        - 代理监督模式未公开披露
      - - 金融合作伙伴
        - Capchase、更广泛的营运资本生态、贷款方
        - 提升资本效率并扩展客户融资选择
        - 按市场和产品看仍未知
        - 合作伙伴收缩或收紧承销会降低附加率和客户灵活性
        - 中高
        - 存在客户融资需求和合作伙伴案例证据
        - 未披露损失分担、契约条款和备用资金
      - - 软件 / 数据和安全供应商
        - 平台、分析和通信技术栈
        - 支撑产品、监控和支持
        - Unknown
        - 供应商宕机或被攻破会中断服务或暴露数据
        - 中高
        - 公开隐私和安全措辞暗示已有供应商治理
        - 子处理方清单、恢复 RTO/RPO 和依赖地图未公开
    notes: 依赖栈很重要，因为 Nowports 卖的是编排和响应速度，不只是运输订舱。
    claimRefs:
      - CR021
      - CR022
      - CR023
      - CR026
      - CR027
      - CR028
      - CR029
  - id: TR004
    title: 人才 / 执行风险登记表
    columns:
      - 职能 / 风险
      - 公开信号
      - 可能性
      - 严重性
      - 缓释信号
      - 剩余敞口
      - 尽调路径
    rows:
      - - 领导层连续性
        - El Financiero 在 2025 年报道称 CEO 发生交接
        - 中
        - 中高
        - 继任者此前已任 COO，并被描述为负责运营转型
        - 战略重置可能拖慢执行或模糊问责
        - 索取董事会材料、组织架构图和高管 KPI 归属
      - - 员工队伍稳定性
        - Montevideo Portal 报道裁员，行业消息源估计约占员工 15%
        - 中高
        - 中高
        - 公司称裁员由效率驱动，并表示运营仍保持活跃
        - 裁员后，士气、组织知识和服务质量可能滞后
        - 索取裁员前后的自愿 / 非自愿离职率和服务指标
      - - 跨职能扩张纪律
        - 公开产品范围横跨物流、可视化、涉海关任务和融资
        - 中
        - 高
        - 数字工作流和专家主导入驻公开可见
        - 产品广度可能跑在控制和人员深度之前
        - 索取路线图治理、上线审批和复盘流程
      - - 商业与风险文化
        - 增长期创业公司历史叠加融资和物流复杂性
        - 中
        - 高
        - 近期转型表述暗示纪律更强
        - 为抢增长，信用或合规闸口可能被放松
        - 索取例外政策、风险委员会召开节奏和升级处理日志
    notes: 执行风险偏高，因为物流质量会在运营中层层放大；管理上小的失手，也会很快反映到客户体验里。
    claimRefs:
      - CR017
      - CR018
      - CR019
      - CR020
      - CR037
      - CR040
  - id: TR005
    title: 缓释措施与放弃标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 海关 / 法律合规
        - 海关异常率或重大申报错误
        - 核心市场反复出现重大海关错误，或有监管介入证据
        - 暂停投资判断；在为增长假设背书前，要求正式整改
      - - 融资 / 信用风险
        - 融资账簿逾期、准备金增加或合作伙伴退出
        - 损失指标明显高于计划，或融资合作方收缩且没有替代方
        - 下调扩张假设，并放大下行情景
      - - 执行稳定性
        - 组织调整后管理层流动或服务 KPI 恶化
        - 再次重大管理层重组，或服务可靠性 / 留存明显下滑
        - 在稳定性重新建立前，视为投资论点破裂
      - - 集中度 / 依赖
        - 头部客户、头部线路或头部合作伙伴敞口
        - 有证据显示少数账户、线路或合作伙伴承载了过大经济贡献
        - 重估估值，并要求更强的下行保护
    notes: 放弃标准不是预测，而是决策规则；它们把不确定性转成可监测的投资检查点。
    claimRefs:
      - CR029
      - CR032
      - CR033
      - CR034
      - CR039
      - CR040
  - id: TV001
    title: 投资建议摘要表
    columns:
      - 建议
      - 置信度
      - 风险评级
      - 估值立场
      - 决策含义
    rows:
      - - 跟踪 / 继续研究
        - 中
        - 高
        - 只有价格低于已过期的 2022 年估值锚，或带结构化下行保护时才有兴趣
        - 不要把 2022 年独角兽估值当成自证；要求最新证据或更好条款
    notes: 这个建议明确对价格敏感，因为公开证据更能证明规模和产品真实存在，却不足以证明利润率、集中度或融资账簿质量。
    claimRefs:
      - CV019
      - CV036
      - CV037
      - CV040
  - id: TV002
    title: 正反投资论点表
    columns:
      - 论点
      - 方向
      - 支撑证据
      - 哪些证据会改变判断
    rows:
      - - 真实收入规模已经存在
        - 正方
        - LATKA 报告 2024 年收入为 $397.7M
        - 最新经审计或管理层背书的收入质量会增强信心
      - - 客户证明不只是 logo 墙
        - 正方
        - 官方具名证言和日常使用证据都存在
        - 留存、NRR 和 cohort 数据会把客户证明变成投资测算证据
      - - 区域物流数字化仍有价值
        - 正方
        - 跨境可视化、单证和融资仍是真痛点
        - 若有证据显示传统玩家或同业已经补上产品差距，论点会被削弱
      - - 2022 年独角兽估值锚可能已经过期
        - 反方
        - 没有新的公开融资价格，还叠加裁员和 CEO 更替
        - 新一轮融资若认购强劲，或审计指标强劲，可能重新验证价格
      - - 板块重定价已经发生
        - 反方
        - 相比过去私募市场热度，Freightos 公开股权市值很小，Forto 也曾探索战略选项
        - 板块整体重估或明确的盈利拐点会有所帮助
      - - 不透明度应当折价
        - 反方
        - 没有公开的 2025/2026 年利润率、亏损、集中度或股权结构细节
        - 完整尽调披露或审计报表会收窄折价
    notes: 反方论点并不是说业务弱，而是说价格必须补偿尚未解决的证据缺口。
    claimRefs:
      - CV002
      - CV010
      - CV014
      - CV018
      - CV020
      - CV021
      - CV024
      - CV035
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 核心风险
      - 概率信号
    rows:
      - - 乐观
        - 收入质量强，融资损失受控，客户加购加深，运营重置改善执行
        - 可支撑 ~2.5x-3.25x 收入倍数逻辑，大致接近或略高于旧独角兽估值锚
        - 需要比当前公开数据更好的利润率、更低风险和更干净的 cohort 表现
        - 在新的 2025/2026 年证据出现前，低到中
      - - 基准
        - 业务继续增长，客户证据站得住，但披露缺口和风险负担仍然显著
        - 可支撑折价后的非独角兽区间，大致按 ~1.5x-2.25x 收入倍数
        - 仍容易受到可比公司倍数压缩和不透明折价影响
        - 以当前证据质量看为中
      - - 悲观
        - 增长放缓，融资或集中度问题浮现，或领导层重置未能转化为持久执行力
        - 可能滑向 ~0.75x-1.25x 收入倍数逻辑，或被按战略出售来定价
        - 目前公开数据还不能有力反驳这个下行情景
        - 若尽调发现亏损或脆弱性，概率为中
    notes: 倍数只是锚定公开可比公司和证据质量的当前价值启发式，不替代基于审计财务的完整模型。
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV032
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Nowports
        - 最新公开私募估值锚
        - 2022 年 Series C 轮，估值 $1.1B
        - 直接锚定此前投资人愿意支付的价格
        - 已过期，且未被当前审计披露验证
      - - Nowports
        - 第三方收入锚
        - LATKA 报告 2024 年收入 $397.7M
        - 可用于粗略测试当前价值敏感性
        - 目录式数据，且没有经审计的利润率背景
      - - Flexport
        - 私募可比
        - Sacra 估计 2024 年收入 $2.1B，2024 年末估值约 $3.8B（约 1.8x 收入）
        - 最接近的规模化数字货代可比对象，且产品宽度相近
        - 私募估计，不是每日公开市场价格
      - - Freightos
        - 公开数字货代可比
        - 2026 年公开市值在不同快照中约为 ~$68M 至 ~$111M
        - 显示公开市场给数字货运平台的定价可能多么苛刻
        - 模式组合不同，小盘股波动也会扭曲比较
      - - Expeditors
        - 公开传统货代可比
        - 2026 年 7 月市值约 ~$22.31B
        - 显示成熟且披露充分的传统玩家能承载多高价值
        - 成熟度、治理和盈利画像差异很大
      - - C.H. Robinson
        - 公开传统货代可比
        - 2026 年 7 月市值约 ~$22.72B
        - 另一个成熟货运 / 物流基准，可参考规模和披露
        - 不是数字原生的拉美增长故事
      - - Forto
        - 私募数字货代下行可比
        - 最近估值为 $2.1B，但据报道 2025 年曾探索合并或出售
        - 释放出板块存在战略选项压力的信号
        - 单一报道、私募语境，且没有实时价格发现
    notes: 可比组有意混合私募和公开参考：私募估值展示此前的创投资金热情，公开估值则锚定透明市场当前奖励什么。
    enumerationScope:
      coverage: sample
      basis: >-
        This table lists the most decision-useful public and quasi-public valuation references in the local source set
        rather than an exhaustive logistics comp universe.
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV007
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
  - id: TV005
    title: 投资论点破裂与放弃触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 最新融资或亏损证据恶化
        - 融资账簿出现实质损失、准备金上升或合作伙伴撤退
        - 削弱交叉销售和利润率假设
        - 按悲观情景重估，并要求更低进入价格
      - - 客户持久性低于预期
        - cohort 留存差、集中度高或依赖头部账户
        - 打破「客户证明能转化为持久经济性」的论点
        - 在留存质量搞清楚前暂停投资
      - - 执行重置没有站稳
        - 管理层进一步重大不稳定，或服务 KPI 恶化
        - 过渡风险转化为经营损害
        - 对溢价定价视为投资论点破裂
      - - 市场价格发现低于预期
        - 新一轮融资、二级交易或战略流程成交价远低于 2022 年估值锚
        - 证实旧私募估值锚过高
        - 采用新的市场信号，而不是维护过期估值锚
    notes: 这些触发项对价格敏感：有些不会让人放弃业务本身，但会让人放弃价格失去纪律时的投资兴趣。
    claimRefs:
      - CV023
      - CV024
      - CV027
      - CV034
      - CV039
      - CV040
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 2025-2026 年收入质量
        - 按运输方式、国家和活跃账户 cohort 更新的收入
        - 判断 2024 年规模是否可持续，还是被运价环境抬高
        - 索取月度管理报表和审计状态
      - - 利润率结构
        - 毛利率、贡献利润率和经营利润率桥接
        - 解释软件加服务故事是否配得上溢价倍数
        - 索取完整 P&L 桥接和线路级利润率组合
      - - 融资 / 信用敞口
        - 逾期、准备金、vintage 表现和合作伙伴经济性
        - 如果亏损被隐藏，物流加金融模式可能毁掉价值
        - 索取融资账簿仪表盘和授信政策
      - - 客户集中度与留存
        - Top-10 账户、线路集中度、NRR/GRR、logo 流失
        - 高集中度或弱留存会快速压缩估值
        - 索取 cohort、集中度和续约表
      - - 股权结构和优先权
        - 清算顺位、优先级、转换条款和任何二级估值锚
        - 回报测算取决于结构，不只看名义估值
        - 索取完整股权结构表和董事会最新批准的估值材料
      - - 过渡后的经营证据
        - 裁员 / 领导层变更前后的服务 KPI
        - 检验运营重置是提高专注度，还是掩盖脆弱性
        - 索取董事会 KPI 包和季度经营复盘
    notes: 这些要求是把叙事式价格讨论推进到真正回报测算所需的最低材料包。
    claimRefs:
      - CV021
      - CV023
      - CV034
      - CV035
      - CV039
      - CV040
figures:
  - id: FO001
    title: Nowports 里程碑与融资时间线
    type: timeline
    summary: 公司公开历程显示：2018 年创立后迅速扩张，2022 年成为独角兽，随后在 2023 年释放纪律信号，并在 2025 年完成领导层交接。
    data:
      items:
        - date: '2018'
          label: 创立
          detail: 在 Monterrey 起步，聚焦拉美货运代理
          tone: neutral
