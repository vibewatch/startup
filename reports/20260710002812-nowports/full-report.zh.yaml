        title: 佐证
        blocks:
          - type: callout
            title: 痛点是运营性的，不是理论性的。
            body: 公开来源指向同一个需求驱动：货主需要在不可预测的跨境航线上获得可视化、单证、报关处理和更少异常。
            calloutType: strength
            claimRefs:
