chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与阶段
        blocks:
          - type: paragraph
            body: >-
              Nowports 更应被看作围绕拉美进出口商痛点搭起来的科技赋能货代，而不是纯软件厂商。公司的官网和 FAQ 对产品的表述很一致：
              海运、空运、陆运与多式联运执行，加上一层数字化运营系统，处理单证、提醒、报表和货物追踪。这个定位很关键，因为公司同时卖两件事：
              压缩工作流、提高可视性。客户可以订舱、集中货运文件、追踪异常，并在部分市场通过同一关系协调保险、报关支持和融资。 官网还强调，公司希望成为货物运输、保护和融资的单一联系人，也解释了为什么产品套件早已超出订舱本身。


              Nowports 2018 年创立，公开叙事把起点放在墨西哥 Monterrey，也放在创始人的物流经历上。本次审阅的来源一致支持 2018 年创立、入选 Y Combinator
              W19、以及从第一天就聚焦拉丁美洲。 公开描述还说明，它的航线逻辑不是纯本土业务：官网强调中国、拉丁美洲和全球之间的覆盖，第三方报道则突出亚洲至拉丁美洲的海运流和美国至墨西哥的陆运。
              放到投资判断里，公司身份是连贯的：一家拉美数字化货代，靠软件、分析和金融降低跨境贸易的运营摩擦，而不是没有执行敞口的撮合市场。
