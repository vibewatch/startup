  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层、买方与使用场景
        blocks:
          - type: paragraph
            body: >-
              公开记录指向相当一致的客户画像。Contxto 称，Nowports 的目标客户每月移动约 10 至 15 个海运集装箱，来自零售、汽车和制造业；
              官网页面也反复把经常性进出口工作流描述为平台最适合的场景。空运页面补充了另一类使用场景：医药、紧急货件、高价值货物和易腐品。 Mexico Business News 和 TipRanks
              暗示，一旦绑定库存融资，财务负责人会变得更重要。这说明买方地图以物流和供应链运营者为中心； 当营运资金、报关或现金时点痛点变尖锐时，财务和采购会加入。


              官方客户证言强化了这个画像。Oriflame、Ostemex、Segamac 和 Grupo Raphael 都用运营、单证、规划和追踪的语言表述价值，而不是临时现货发货。
              另一份外部设计案例研究称，客户平台由运营团队和货运经理每天使用。F6S 把产品归为小企业、中型企业、大型企业和企业级客户都会使用的工具；
              这个口径很宽，但方向上符合多客群物流工具。最强的公开结论是：Nowports 服务的是有显著运营复杂度的经常性 B2B 货主，而不是一次性消费者或业余出口商。
