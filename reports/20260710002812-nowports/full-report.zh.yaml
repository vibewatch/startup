companyProfile:
  summary: >-
    Nowports 是一家在 Monterrey 创立、聚焦拉丁美洲贸易流的数字化货代。产品栈覆盖货运执行、货件可视化、单证管理、提醒、报表，以及融资配套支持。 公开来源一致支持其 2018 年创立、2021-2022
    年快速融资、以及真实客户工作流价值，而不是轻薄的撮合市场叙事。 公开证据也显示公司已跑到可观规模，但利润率、信用表现、客户集中度和股权结构披露稀疏，仍卡住当前投资判断。
