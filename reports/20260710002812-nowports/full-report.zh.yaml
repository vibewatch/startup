  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、信心与价格纪律
        blocks:
          - type: paragraph
            body: >-
              公开记录里最重要的估值事实，也是最大的警示：Nowports 最近一次被广泛引用的定价事件，仍是 2022 年 5 月那轮 Series C，当时公司估值
              $1.1B。那轮融资清楚说明，顶级投资人曾经认为一家把可视化软件、货运执行和融资扩张结合起来的拉美数字货代，有成为独角兽的潜力。但 2022 年的成长期估值标记，不等于 2026
              年的公允价值。此后，公司据称收入大幅扩大，但公开证据对经审计利润率、信用损失、留存、集中度和股权结构条款仍然很薄。公开来源还显示裁员和 CEO
              更替；它们不会否定业务，却会抬高在没有更新证据时支付高峰时期价格的门槛。


              因此，平衡建议既不是“回避”，也不是“不计价格买入”。更合适的是跟踪 / 继续研究，信心中等，风险评级高。如果 LATKA 报道的 2024
              年收入数字方向正确，这家公司规模已足够大、运营也足够真实，不能把它当作只有叙事的创业公司而轻易排除。与此同时，缺少当前盈利能力、融资账本和分群披露，意味着投资人应要求相对 2022
              年独角兽估值有明显折价，或获得结构性下行保护。换句话说，争论重点不再是 Nowports 是否重要，而是价格是否足以补偿不透明、执行风险和行业重估。
