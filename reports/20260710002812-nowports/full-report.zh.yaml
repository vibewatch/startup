      - number: '8.3'
        title: 牛市 / 基准 / 熊市区间与敏感性
        blocks:
          - type: paragraph
            body: >-
              这里做情景分析比假精确更有用，因为太多承销变量仍未披露。最干净的可观察锚点是收入规模，尽管最佳公开收入数字来自第三方目录，而非管理层或审计文件。在这个基础上，低于独角兽估值的基准情景，比完全重新确认 2022
              年独角兽标记更容易站住脚。熊市情景应假设增长放缓、融资或集中度问题浮出水面，且公开市场压缩主导可比公司组。牛市情景则应假设收入质量强于市场担心、融资损失受控、多产品附着真实存在，且运营重置比当前公开证据显示的更有效。


              敏感性很高，因为收入倍数的小幅变化会带来隐含股权价值的大幅变化。按报道的 2024 年收入约 $397.7M 计算，1.5x 倍数意味着不到 $600M，2.0x 约为 $800M，2.5x 约为
              $1.0B，3.0x 则回到接近旧独角兽水平。这组算术不是最终估值；它只是展示，要支撑不同价格水平需要多少确信度。没有更新的 2025–2026
              年收入、毛利率、经营利润率和融资账本指标，投资人不应默认用区间高端作为入场点。
