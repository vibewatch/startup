        title: 采用轨迹与具名客户证据
        blocks:
          - type: paragraph
            body: >-
              公开采用数据确实存在，但并不完整。TechCrunch 报道，2022 年一季度服务客户数同比增长 10 倍；Contxto 则称，到 2021 年底，公司约有 300 名员工，覆盖七个国家。LATKA 后来列出
              40 个客户，这个数字有方向性参考价值，但需要谨慎看待，因为方法不透明，且似乎与公司更广泛叙事不完全一致。比精确客户数更重要的是，多方资料共同指向反复使用、运营深度和多国服务能力。Valentina
              案例尤其能说明问题：运营团队和运输经理每天都用这个面向客户的平台，这比简单 logo 墙更能证明产品采用。


              具名客户证据也强于泛泛的 logo 墙。官方平台和数字化页面发布了 Oriflame、Ostemex、Segamac 和 Grupo Raphael
              的实名引述。这些推荐语反复提到单证访问、实时追踪、发票调取、运营敏捷性和计划能力。它不能证明每个账户的留存或商业规模，但能说明可识别的企业用户公开把 Nowports
              描述为生产工作流工具，而不是试点实验。放在客户尽调里，即便还达不到完整分群证据的标准，这仍是有意义的效用证明。
