  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Nowports 并不竞争整个物流经济，而是竞争一个切片：跨境货主需要货运执行，并且需要足够的软件、可视化、合规处理和营运资金支持来降低运营摩擦。
              官网把公司的产品描述为多式联运货代，加上单证管理、提醒、追踪、保险协调和融资附加项。IMARC 的区域货运与物流分类比这更宽，覆盖多个国家和终端行业里的快递、货代、货运运输和仓储。 Mordor
              的数字化货代覆盖更窄，也更贴近 Nowports：它描述的是运输管理仍占支出大头，但报关、可持续性和贸易融资等增值服务正在提高占比的市场。 这个口径更接近 Nowports 的实际产品切入点。


              现状替代方案不是单一既有玩家。它包括依赖电子邮件、电子表格、电话和碎片化单证流的传统货代；只解决部分工作流的承运商关系和报关行； 也包括
              Flexport、Forto、Freightos、Nuvocargo、KLog 等更新的软件牵引型竞争者，它们强调可视化、订舱、控制塔、报关或管理式运输。 换句话说，Nowports
              的真实市场边界是进出口周边的运营栈，而不只是“航运”。纳入边界应当是：跨境货运执行、货件可视化、单证、路线优化、报关或合规支持， 以及能实质改变进出口商管理货物方式的融资或保险服务。
