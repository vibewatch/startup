      - number: '4.2'
        title: 牵引力与公开财务代理指标
        blocks:
          - type: paragraph
            body: >-
              最强的公开牵引数据是方向性的，不完整。Latka 报告 Nowports 2021 年收入 US$11.8M、2022 年 US$50M、2024 年 US$397.7M。 TechCrunch
              另行报道，2022 年第一季度收入同比增长超过 12 倍，发运集装箱和服务客户数各同比约 10 倍。
              如果按表面值理解，这些数字意味着公司在货运市场繁荣期和扩张至更多拉美市场的过程中实现了极快扩张。但仍需谨慎处理，因为私营公司收入数字没有申报文件支撑， 也可能反映毛货运额，而不是更干净的净收入或毛利指标。


              这个警示正是上市货代公司申报文件有代理价值的原因。Expeditors 年报和 C.H. Robinson 10-K 都显示，货代经济性混合了代付承运商成本、处理费、时点判断、应收账款和营运资金管理。
              Expeditors 明确描述采购价与销售价的动态，并显示报关经纪和其他服务贡献了很大一部分收入。C.H. Robinson 解释说，运输和物流合同在履约义务和收入确认时点上需要大量判断。 这些文件不能告诉投资人
              Nowports 赚了多少钱，但它们说明，在核验任何头条式收入数字之前，必须拆清楚净收入、毛利、客户集中度、信用账期，以及运输量和增值服务之间的分拆。
