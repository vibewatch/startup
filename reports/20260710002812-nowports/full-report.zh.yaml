      - number: '5.4'
        title: 信任、安全、隐私与合规
        blocks:
          - type: paragraph
            body: >-
              信任与合规面是公开资料中较强的一块。隐私政策称，公司收集账户、沟通、支付、登录、使用和大致地理位置信息，并描述了加密、持续监控和法定留存义务。
              安全页面提供网络安全披露联系路径，隐私政策称公司开展渗透测试并参与漏洞赏金计划。服务条款还提到 AI 代理，用于协助、请求资格判断和用户联系。 这些都是有意义的信号，说明产品不是按随手搭的宣传站在运营。


              但投资人不应过度解读。公开信任页面是政策证据，不是执行质量证明。本次本地来源集没有看到公开 SOC 2 报告、ISO 27001 认证、正常运行时间页面、公开 API 文档或详细事件历史。
              它也没有解释客户数据存放在哪里、合作伙伴数据流如何集成、授信数据和物流数据如何隔离。因此，产品与技术结论应保持平衡： Nowports
              有可信证据证明自己拥有一体化物流工作流产品、可见的运营工具和正式信任政策，但深度尽调关心的许多技术细节仍是私有信息，需要直接索取。
