  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现机制
        blocks:
          - type: paragraph
            body: >-
              Nowports 不像一家只有简单订阅收入线的纯 SaaS 公司。官网页面和 FAQ 描述的是货代模式：把海运、空运和陆运与单证管理、提醒、报表、融资和保险撮合结合起来。
              在公开记录中，平台并没有被作为独立产品销售；FAQ 明确说，它是货代服务的组成部分。这个信息很关键，因为它意味着客户活动、承运商采购和货运执行仍是收入生成的主引擎， 软件层则提高绑定、留存和工作流效率。


              公开来源还显示，变现是多层的。海运页面称，定价取决于集装箱类型、重量、体积、路线、港口费用、季节、市场条件、合同和海关； FAQ 提到 Nowports 在部分情况下拿到最长 30 天账期；Mexico
              Business News 称，融资产品可向墨西哥中小企业提供最高 US$250,000。 TipRanks 对公司 LinkedIn
              帖子的摘要把库存融资描述为数字化赋能的产品，流程在线，几天内可拿到资金。合在一起，证据至少支持四个变现面：
              货运执行价差或费用、融资经济性、保险撮合，以及能提升账户留存或钱包份额的工作流价值。公开资料没有显示收入流组合、实际定价， 也没有说明如何用会计政策区分代收代付运输成本和贡献利润。
