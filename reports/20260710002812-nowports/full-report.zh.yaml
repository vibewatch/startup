  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 反复发货人从手工协调转向把货运执行、可视化和可选融资打包在一起的工作流时，Nowports 似乎更容易赢下客户。
    data:
      nodes:
        - id: pain
          label: 反复发货痛点
          detail: 经常进出口的运营方一旦超出手工追踪、零散联系人和临时单证处理的承载能力，痛点就会显现。
          tone: warning
        - id: qualification
          label: 专家评估
          detail: 客户先接触专家；专家界定货物流，围绕运输方式、线路和紧急程度拼出初始物流方案。
          tone: neutral
        - id: onboarding
          label: 账户开通
          detail: 活跃客户获得客户代表支持、浏览器和移动端入口，以及客户成功指导，而不是纯自助安装。
          tone: positive
        - id: execution
          label: 实际工作流使用
          detail: 客户在实际运营中使用追踪、单证、提醒、报告和货运跟进。
          tone: positive
        - id: expansion
          label: 扩张层
          detail: 发货人形成反复运营需求后，关系可进一步扩展到融资、保险和更深度规划。
          tone: positive
    claimRefs:
      - CU001
      - CU007
      - CU020
      - CU028
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    summary: 公开证据支持从反复货运痛点到实际工作流使用的路径，但不支持完整分群转化指标。
    data:
      nodes:
        - id: fit
          label: 反复发货人匹配
        - id: quote
          label: 报价与上线
        - id: ship
          label: 实际货运
        - id: plat
          label: 平台报告与追踪
        - id: expand
          label: 融资 / 复用
      edges:
