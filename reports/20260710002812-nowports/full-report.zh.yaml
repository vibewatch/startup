      - number: '4.4'
        title: 财务判断与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              公开资料支持一个已有真实规模、具备多条变现杠杆的业务，但还不足以看清收入质量。Nowports 看起来增长很快，并已从纯货运扩展到融资和保险配套业务；
              这些业务可能提高单账户收入，也改善黏性。与此同时，同样的配套业务会加大对授信纪律、损失表现、流动性缓冲，以及毛货运流与实际贡献之间拆分的理解要求。
              没有这些细节，投资人无法判断它到底是一家高量低毛利、由软件辅助的货代，还是一家能赚到结构性更好经济性的、软件赋能物流平台。


              因此，正确的公开结论是混合的。收入规模叙事可信，融资需求显然真实，品类经济性在管理得当时可以跑通。 但决定性输入仍是私有信息：按产品划分的毛利率、收入确认政策、CAC
              与回本周期、应收账款天数、融资账簿表现、现金跑道和下一轮融资触发条件。 财务尽调应少盯历史融资头条，多看当前单位经济性、营运资金供给结构，以及 2022 年后的效率动作是否真的改善了现金转换和利润率质量。
