  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块图
        blocks:
          - type: paragraph
            body: >-
              Nowports 的产品最好被理解为国际物流的运营层，而不是单一功能或孤立应用。官网把产品归为运输、保障和集中化。 运输包括海运、空运和陆运；保障包括货物保险、集装箱保险和监护 /
              GPS；集中化包括一个带有单证管理、提醒、追踪、报表和历史视图的数字平台。 FAQ 补充说，部分国家可以提供融资，也可以协助连接报关。这意味着，即使公司把产品包装成一体化体验，它在买方工作流里仍是模块化的。


              模块图很重要，因为它解释了公司如何创造价值。货主可以只用 Nowports 做运输执行，但公开产品叙事围绕协调展开：
              单证、可视化、风险缓释，以及与货物移动绑定的融资。由此形成的产品面，比运价报价引擎宽得多，又比完整 ERP 窄得多。
              它也让公司的技术产品与运营不可分割。软件不是唯一被销售的东西；它是把物流流程结构化的一层，让专家团队、合作伙伴网络和客户都能基于同一份运营记录工作。
