      - number: '7.4'
        title: 缓释措施、监控指标与论点击穿触发因素
        blocks:
          - type: paragraph
            body: >-
              风险图景中令人鼓舞的一点是，多数主要敞口都可以监控。海关合规风险可以通过单证错误率、报关代理监督和逐国实体映射来测试。信用和融资风险可以通过逾期、准备金、付款行为，以及按账户和国家划分的敞口集中度来测试。安全风险可以通过认证、事件日志、第三方渗透测试摘要和泄露通知历史来测试。管理和执行风险可以通过人员流失、运营
              KPI、按分群划分的客户留存，以及新领导团队交付的是服务一致性而不只是成本纪律来测试。


              这让 Nowports 成为一家尽调可能实质改变承销结论的公司。如果公司能证明海关错误率低、融资账本损失受控、客户敞口分散，并且组织调整后服务 KPI
              稳定，当前风险组合就会变得可管理，而不是击穿投资论点。做不到的话，同样的风险会很快传导为客户流失、利润率压缩、融资损失，以及更弱的下一轮融资或退出条件。因此投资含义是有条件的，而非二元。投资人不应把这家公司视为不可投资，但应针对合规失误、融资损失、进一步管理层不稳定，或少数账户
              / 航线承载过多经济性的证据，设置明确否决标准。
