      - number: '8.2'
        title: 估值语境与可比公司组
        blocks:
          - type: paragraph
            body: >-
              可比公司组提示投资人要谦逊。Sacra 2026 年 4 月的 Flexport 研究估计，Flexport 2024 年收入为 $2.1B，2024 年末估值约 $3.8B，且较此前 $8B
              峰值大幅下滑。同一研究称，Flexport 未达到 2024 年底盈利目标，2025 年也只是靠一次性收益实现技术性盈利。TechStartups 另行报道，上一轮估值 $2.1B 的 Forto 在 2025
              年探索合并或出售。公开市场方面，Freightos 在 2026 年的市值只在数千万美元量级，具体取决于快照来源；C.H. Robinson 和 Expeditors 的市值则均高于 $22B。重点不是
              Nowports 应该精确地像其中任何一家公司交易，而是物流平台估值如今跨度极大，数字货代可比公司的重估幅度远大于 2021–2022 年风投轮次所暗示的水平。


              这让私募价格锚定变得危险。Flexport 最新可见估值约相当于 2024 年收入的 1.8x，而 Nowports 过时的 2022 年独角兽估值，对照 LATKA 的 2024 年收入估计，非同期口径下约为
              2.8x 收入。这个数字本身并不离谱，但相对投资人今天能看到的公开披露来说偏贵。成熟上市公司值得更高总市值，因为它们把规模与经审计报表、成熟风控和透明治理结合在一起。Nowports
              在牛市情境下也许应相对传统货代享有增长溢价，但公开记录还不足以支撑按旧估值已经被完全验证的方式付价。
