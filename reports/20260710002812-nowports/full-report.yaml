      - number: '6.3'
        title: Retention, satisfaction, and expansion signals
        blocks:
          - type: paragraph
            body: >-
              Direct retention disclosure is weak, but there are still useful proxies. The FAQ says the platform excels
              in recurrent movements, which implies the greatest value appears when customers move enough volume to care
              about reports, alerts, and historical data. The Oriflame, Ostemex, Segamac, and Grupo Raphael testimonials
              all describe recurring operational benefits rather than one-time wins, and Segamac’s quote specifically
              references payment reminders and less need to communicate with many people, suggesting workflow embedment.
              Capchase’s case study implies that Nowports was important enough to daily operations that the company
              sought financing solutions around its logistics spend rather than treating the service as easily
              replaceable.


              Even with those positives, the public record stops short of durability proof. There is no disclosed NRR,
              GRR, churn, renewal rate, average contract length, or active account cohort trend. The App Store page is
              too thin to serve as a strong customer-satisfaction signal, and Serchen explicitly says there are no
              reviews there. That leaves a sensible but incomplete picture: Nowports likely has stronger retention among
              recurring operators using platform and financing features together, but concentration risk, renewal
              quality, and expansion economics still require private data. Investors should not mistake named
              testimonials for a full retention dataset.
            claimRefs:
              - CU019
