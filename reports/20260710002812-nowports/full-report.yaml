      - number: '7.4'
        title: Mitigations, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The encouraging part of the risk picture is that most of the major exposures are monitorable.
              Customs-compliance risk can be tested through document-error rates, broker oversight, and
              country-by-country entity mapping. Credit and financing risk can be tested through delinquency, reserves,
              payment behavior, and exposure concentration by account and country. Security risk can be tested through
              certifications, incident logs, third-party penetration-test summaries, and breach-notification history.
              Management and execution risk can be tested through turnover, operating KPIs, customer retention by
              cohort, and whether the new leadership team is delivering service consistency rather than only cost
              discipline.


              That makes Nowports a business where diligence can materially change the underwriting outcome. If the
              company can show low customs-error rates, disciplined financed-book losses, diversified customer exposure,
              and stable service KPIs after the organizational changes, the current risk stack becomes manageable rather
              than thesis-breaking. If it cannot, the same risks can transmit quickly into customer churn, margin
              compression, financing losses, and a weaker next-round or exit setup. The investment implication is
              therefore conditional rather than binary. Investors should not treat the business as uninvestable, but
              they should attach explicit kill criteria to compliance misses, financing losses, further management
              instability, or proof that a small number of accounts or lanes carry too much of the economics.
            claimRefs:
              - CR011
