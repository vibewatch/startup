      - number: '2.2'
        title: Sizing Lenses and Buyer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Public market sizing is usable only when kept in layers. Mordor estimates the global digital freight
              forwarding market at $51.43 billion in 2026 and $118.12 billion by 2031, with 18.09% CAGR, which frames
              the software-enabled forwarding layer as a rapidly growing category. IMARC, by contrast, estimates the
              broader Latin American freight and logistics market at $1,102.6 million in 2025 growing to $1,715.6
              million by 2034, a much slower 4.88% CAGR and a much wider category definition. These estimates are not
              contradictory so much as they are measuring different things. The safer conclusion is that Nowports sits
              inside a fast-digitizing subcategory of a much larger but slower-growing regional logistics base.


              The best buyer segmentation comes from matching public market categories with the company’s own disclosed
              workflow. IMARC highlights manufacturing, wholesale and retail trade, agriculture, construction, oil and
              gas, mining, and other industries as key end-user groups. Contxto reported that Nowports’ early target
              customers often moved 10 to 15 maritime containers per month and came from retail, automotive, and
              manufacturing. Official air-freight pages also call out pharma, urgent shipments, high-value goods, and
              perishables. That means buyer ownership likely sits with logistics, supply chain, import/export, and
              operations leaders inside SMEs and mid-market shippers, while finance and procurement become more
              important when financing, customs, insurance, or cost control enter the conversation.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
