      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The public file supports a business with real scale and multiple monetization levers, but it does not yet
              support a clean view of revenue quality. Nowports appears to have grown rapidly and to have expanded
              beyond pure freight into financing and insurance adjacency, which could increase revenue per account and
              improve stickiness. At the same time, the same adjacencies intensify the need to understand underwriting
              discipline, loss performance, liquidity buffers, and the split between gross freight flows and actual
              contribution. Without those details, investors cannot tell whether the business is best thought of as a
              high-volume, low-margin forwarder with software assistance or as a software-enabled logistics platform
              that earns structurally better economics.


              The right public conclusion is therefore mixed. The topline story is credible, the need for financing is
              clearly real, and the category economics can work when managed well. But the decisive inputs remain
              private: gross margin by product, revenue recognition policy, CAC and payback, receivable days,
              financed-book performance, cash runway, and the next-round trigger. Financial diligence should therefore
              focus less on the historical funding headline and more on present-day unit economics, working-capital
              funding structure, and whether the post-2022 efficiency actions actually improved cash conversion and
              margin quality.
