      - number: '3.2'
        title: Peer profiles and capability differences
        blocks:
          - type: paragraph
            body: >-
              The most important direct digital peers reveal three distinct archetypes. Flexport markets a broad global
              logistics operating system that combines visibility, freight forwarding, customs brokerage, fulfillment,
              tariff tools, and even working-capital benefits. Freightos looks more like a vendor-neutral booking and
              connectivity layer: its site emphasizes instant quotes, enterprise integrations, forwarder tools, API
              connectivity, and a large network of carrier and forwarder participants. Forto positions itself as a
              technology-first managed-transportation provider with platform visibility, notifications, and data
              quality. Nuvocargo has narrowed into the North American corridor and now leans heavily into AI-assisted
              freight execution, customs, and managed transportation. KLog appears as a regional Latin American
              alternative with physical presence across several countries, even if its public digital proof is thinner.


              Against that set, Nowports’ strength is not absolute feature supremacy on every dimension. It is the
              combination of Latin American regional focus, multimodal forwarding, a customer-facing platform, and
              embedded financing or insurance adjacencies. That mix can be more relevant for mid-market importers and
              exporters moving between Latin America, Asia, and North America than a global one-size-fits-all stack. But
              it also means the company is stretched across service execution, software, and capital products at the
              same time. Competitors with narrower product scope may win on best-of-breed software, while larger global
              platforms may win on scale, integrations, and balance-sheet depth.
