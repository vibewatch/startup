            body: >-
              The public adoption data is real but incomplete. TechCrunch reported 10x year-over-year growth in
              customers served in the first quarter of 2022, and Contxto described a business with about 300 employees
              across seven countries by late 2021. LATKA later listed 40 customers, which is directionally useful but
