  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              Nowports’ product is best understood as an operating layer for international logistics, not as a single
              feature or isolated app. Official pages group the offer into movement, protection, and centralization.
              Movement includes ocean, air, and ground freight; protection includes cargo insurance, container
              insurance, and custody/GPS; and centralization includes a digital platform with document management,
              alerts, tracking, reports, and historical views. The FAQ adds that financing is available in some
              countries and that customs connections can also be facilitated. This means the product is modular in the
              buyer’s workflow even when the company markets it as one integrated experience.


              The module map matters because it explains how the company creates value. A shipper can use Nowports for
              transport execution alone, but the public product story is built around coordination: documents,
              visibility, risk mitigation, and financing tied to cargo movements. That creates a product surface much
              broader than a freight quote engine and much narrower than a full ERP. It also makes the company’s
              technical product inseparable from operations. The software is not the only thing being sold; it is the
              layer that structures the logistics process so expert teams, partner networks, and customers can all work
              from the same operational record.
            claimRefs:
              - CE001
