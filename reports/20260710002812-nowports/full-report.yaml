      - number: '1.3'
        title: Funding History, Scale, and Stakeholders
        blocks:
          - type: paragraph
            body: >-
              Nowports scaled unusually quickly between 2021 and 2022. Tracxn, TechCrunch, Crunchbase News, PR Newswire,
              Contxto, and LatamList all converge on the same broad funding arc: a July 2021 Series A, a December 2021
              $60 million Series B, and a May 2022 $150 million Series C at a $1.1 billion valuation. Public databases
              and articles differ on whether the 2021 A round should be counted as $16 million or $24 million once
              extensions are included, but they align on the larger point that the business raised more than $240
              million by the time it became a unicorn. Investor quality also matters. SoftBank Latin America Fund led
              the Series C, Tiger Global backed both the B and C, and earlier investors included Foundation Capital,
              Mouro Capital, Base10, monashees, Y Combinator, Soma, and Broadhaven.


              Scale signals are directionally strong but uneven in precision. TechCrunch reported more than 500
              employees in May 2022, the Y Combinator profile currently shows team size 550, Latka reports roughly 304
              employees, and Tracxn shows 280 employees as of April 2026. That inconsistency does not mean the business
              is weak; it means public headcount data should not be treated as a clean cover metric without management
              confirmation. Revenue disclosure is similar. Latka reports $397.7 million of 2024 revenue, while
              TechCrunch only gave relative growth disclosures in 2022. The right diligence conclusion is that public
              sources support meaningful scale, but not a single definitive current KPI pack for revenue, customers, or
              staffing.
