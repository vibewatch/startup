      - number: '4.3'
        title: Working capital, cost structure, and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              The public evidence repeatedly points to working capital as the core financial issue. The Capchase case
              study says container costs rose from roughly US$2,000 to as high as US$13,000 and that Nowports used
              Capchase Grow and Capchase Earn so it would not consume equity capital on day-to-day logistics spend.
              Mexico Business News and TipRanks both describe financing as a key product, which suggests the business is
              not merely passing along freight costs but also taking on underwriting, repayment, and
              liquidity-management complexity. Even the FAQ reference to payment terms of up to 30 days hints at a
              business that may need to bridge timing between customer collection and carrier or partner obligations.


              The forwarder filings make the implications clear. Expeditors says liquidity comes from cash and
              operations but also notes significant short-term cash advances for customs brokerage customers; C.H.
              Robinson lists working-capital pressure, provider failures, and longer receivable cycles as material
              risks. Nowports’ own public file does not disclose cash on hand, monthly burn, runway, default rates, or
              whether financing is on-balance-sheet, warehouse-funded, or partner-funded. That gap matters even more
              because the company has already gone through a post-2022 efficiency reset: Montevideo Portal reported
              layoffs affecting around 15% of staff, and El Financiero later reported a CEO transition to Fernando
              Poitevin with an explicit operating-transformation message. Those signals do not prove distress, but they
              do show that capital discipline and operational restructuring are central to the current story.
            claimRefs:
