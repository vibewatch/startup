  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, and status-quo substitutes'
        blocks:
          - type: paragraph
            body: >-
              Nowports is not just competing with one startup. Buyers can solve the same job through four different
              paths: a regional digital forwarder such as Nowports itself, a global software-led forwarder such as
              Flexport or Forto, a marketplace or booking infrastructure layer such as Freightos, or the traditional
              combination of freight forwarders, customs brokers, and internal spreadsheets. Official Nowports pages
              present the company as a digital freight forwarder for Latin America with ocean, air, ground, insurance,
              reporting, document management, alerts, and financing. That broader scope matters because it means the
              company is selling workflow compression rather than a single transportation leg. In competitive terms,
              this places Nowports closer to a platform-plus-service model than to a pure rate aggregator.


              The independent sources largely agree with that classification. YC, Tracxn, and PANCO all describe
              Nowports as a digital freight forwarder rather than a generic SaaS vendor, and Supply Chain Digital frames
              it as the largest Latin American freight forwarder in its category. The status quo, however, still
              includes traditional forwarders with local relationships and flexible manual handling, and those
              incumbents remain a real substitute because many importers do not need a full digital migration on day
              one. The result is a landscape where Nowports must beat both modern software-led peers and entrenched
              low-tech alternatives that can underprice or out-relationship newer entrants on specific lanes.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
