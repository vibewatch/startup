      - number: '3.4'
        title: Moat durability and adverse competitive signals
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a plausible but not fully proven moat. Nowports can plausibly win where
              buyers need a Latin America-native operator that combines freight execution with digitized workflows and
              financing support. Its regional density, customer service, and operational agility come up repeatedly in
              official testimonials and partner descriptions. However, the adverse case is equally important. Flexport
              is visibly broader at the global operating-system end of the market; Freightos has stronger marketplace
              and integration network effects; Forto shows how data quality and AI-assisted support can be productized
              at scale; and Nuvocargo shows how an AI-centered corridor specialist can target cross-border pain points
              without covering all of Latin America. Even the traditional-forwarder alternative remains credible because
              shippers often care more about rate, lane trust, and problem resolution than brand-new software.


              That means the moat is probably best framed as execution density plus workflow breadth, not as
              irreplaceable technology. It can strengthen if financing attachment, reporting usage, and recurring
              shipment cohorts deepen account-level dependency. It can weaken if the company remains easy to multi-home,
              if larger platforms spend aggressively in the region, or if customers treat Nowports primarily as one more
              forwarding option. Diligence therefore needs win-loss data, cohort retention, lane concentration, and
              proof that customers buying financing or protection products are materially harder to displace than pure
              freight accounts.
