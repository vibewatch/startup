      - number: '8.2'
        title: Valuation context and comparable set
        blocks:
          - type: paragraph
            body: >-
              The comp set argues for humility. Sacra’s April 2026 Flexport research estimates $2.1 billion of 2024
              revenue, a late-2024 valuation of about $3.8 billion, and a sharp decline from Flexport’s earlier $8
              billion peak. The same research says Flexport missed its end-2024 profitability target and was only
              technically profitable in 2025 because of a one-time gain. TechStartups separately reported that Forto,
              last valued at $2.1 billion, was exploring a merger or sale in 2025. On the public side, Freightos traded
              at only tens of millions of dollars of market capitalization in 2026 depending on the snapshot source,
              while C.H. Robinson and Expeditors each carried market capitalizations above $22 billion. The message is
              not that Nowports should trade exactly like any one of these companies. The message is that
              logistics-platform valuations now span a very wide range and that digital-forwarder comps have been
              repriced much more aggressively than 2021-2022 venture rounds implied.


              That makes private price anchoring dangerous. Flexport’s latest visible mark implies about 1.8x 2024
              revenue, while Nowports’ stale 2022 unicorn valuation against LATKA’s 2024 revenue estimate implies
              roughly 2.8x revenue on a non-contemporaneous basis. That is not absurd on its face, but it is rich
              relative to the amount of public disclosure investors have today. Public incumbents deserve higher
              aggregate values because they pair scale with audited statements, established risk controls, and
              transparent governance. Nowports may deserve a growth premium to traditional forwarders in a bull case,
              but the public record does not yet justify paying as though the old mark has been fully validated.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
