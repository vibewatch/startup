  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >-
              Nowports does not compete in the entire logistics economy; it competes in the slice where cross-border
              shippers need freight execution plus enough software, visibility, compliance handling, and working-capital
              support to reduce operational friction. Official pages describe the company’s offer as multimodal freight
              forwarding with document management, alerts, tracking, insurance coordination, and financing add-ons.
              IMARC’s regional freight-and-logistics taxonomy is broader than that, covering courier, freight
              forwarding, freight transport, and warehousing across multiple countries and end-user industries. Mordor’s
              digital freight forwarding coverage is narrower and more relevant to Nowports: it describes a market where
              transportation management still dominates spend, but value-added services such as customs, sustainability,
              and trade finance are gaining share. That is much closer to Nowports’ actual product wedge.


              The status quo is not a single incumbent. It includes traditional freight forwarders that rely on email,
              spreadsheets, phone calls, and fragmented document flows; carrier relationships and customs brokers that
              solve only pieces of the workflow; and newer software-led competitors such as Flexport, Forto, Freightos,
              Nuvocargo, and KLog that emphasize visibility, booking, control towers, customs, or managed
              transportation. In other words, Nowports’ real market boundary is the operational stack around imports and
              exports, not simply “shipping.” The inclusion boundary should therefore be: cross-border freight
              execution, shipment visibility, documentation, route optimization, customs or compliance support, and
              financing or insurance services that materially change how importers and exporters manage cargo.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
