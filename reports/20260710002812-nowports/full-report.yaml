      - number: '7.2'
        title: Operational, security, and service-delivery risk
        blocks:
          - type: paragraph
            body: >-
              Nowports operates in exactly the part of logistics where disruption compounds fast. World Bank and Maersk
              materials both emphasize that cross-border performance depends on border controls, port and airport
              throughput, infrastructure quality, weather, and the speed of operational rerouting. Maersk’s Latin
              America update is especially relevant because it lists infrastructure limitations, port congestion, bad
              weather, customs delays, political unrest, and natural disasters as real regional stressors rather than
              theoretical risks. For a digital freight forwarder promising visibility and coordination, these are not
              background issues; they are the events customers experience as missed ETAs, higher costs, and degraded
              service quality.


              Security risk also deserves more weight than the thin public trust surface might suggest. The privacy
              policy mentions encryption, continuous monitoring, penetration testing, and a bug-bounty program, which is
              directionally positive. At the same time, it explicitly acknowledges that no transmission or platform is
              absolutely invulnerable. Public-company freight forwarders such as Expeditors and C.H. Robinson treat
              cyber, third-party provider failures, data exfiltration, and compliance breakdowns as top-tier enterprise
              risks, and those analogs are useful because Nowports offers software, documentation, and visibility
              alongside freight execution. The issue is not whether Nowports faces identical scale; it is that the same
              failure modes exist in a smaller organization with less public disclosure. That means diligence should
              test not only product functionality, but also incident history, carrier-claim handling, customs error
              rates, and whether control-tower visibility truly translates into faster recovery when the network is
              stressed.
            claimRefs:
              - CR004
              - CR005
