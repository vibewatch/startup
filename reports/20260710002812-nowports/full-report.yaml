  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Fresh financing or loss evidence deteriorates
        - Meaningful financed-book losses, rising reserves, or partner pullback
        - Weakens cross-sell and margin assumptions
        - Re-rate to bear case and demand lower entry price
      - - Customer durability is worse than expected
        - Poor cohort retention, concentration, or top-account dependence
        - Breaks the idea that proof converts into durable economics
        - Pause investment until retention quality is understood
      - - Execution reset does not hold
        - Further major leadership instability or service KPI deterioration
        - Turns transition risk into operating damage
        - Treat as thesis-break for premium pricing
      - - Market price discovery is lower than hoped
        - New round, secondary, or strategic process clears well below 2022 mark
        - Confirms that old private anchor was too high
        - Use new market signal rather than defending stale mark
    notes: >-
      These are price-sensitive triggers: some would not kill interest in the business, but they would kill interest at
      an undisciplined valuation.
    claimRefs:
      - CV023
      - CV024
      - CV027
      - CV034
      - CV039
      - CV040
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - 2025-2026 revenue quality
        - Updated revenue by mode, country, and active account cohort
        - Determines whether 2024 scale is durable or flattered by freight-rate conditions
        - Request monthly management reporting and audit status
      - - Margin structure
        - Gross margin, contribution margin, and operating margin bridge
        - Explains whether a software-plus-service story deserves premium multiples
        - Request full P&L bridge and lane-level margin mix
      - - Financing / credit exposure
        - Delinquency, reserves, vintage performance, and partner economics
        - A logistics-plus-finance model can destroy value if losses are hidden
        - Request financed-book dashboards and underwriting policy
      - - Customer concentration and retention
        - Top-10 accounts, lane concentration, NRR/GRR, logo churn
        - High concentration or weak retention would compress valuation quickly
        - Request cohort, concentration, and renewal tables
      - - Cap table and preferences
        - Liquidation stack, seniority, conversion terms, and any secondary marks
        - Return underwriting depends on structure, not only headline valuation
        - Request full cap table and latest board-approved valuation materials
      - - Post-transition operating proof
        - Service KPIs before and after layoffs / leadership change
        - Tests whether the operating reset improved focus or masked fragility
        - Request board KPI packs and quarterly operating reviews
    notes: >-
      These asks are the minimum package needed to move from narrative-based price discussion to genuine return
      underwriting.
    claimRefs:
      - CV021
      - CV023
      - CV034
      - CV035
      - CV039
      - CV040
