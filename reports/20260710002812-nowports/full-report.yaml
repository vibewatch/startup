      - number: '8.3'
        title: Bull / base / bear ranges and sensitivity
        blocks:
          - type: paragraph
            body: >-
              Scenario work is more useful than false precision here because too many underwriting drivers remain
              undisclosed. The cleanest observable anchor is revenue scale, even though the best public revenue figure
              comes from a third-party directory rather than from management or audited filings. On that basis, a
              sub-unicorn base case is easier to defend than a full reaffirmation of the 2022 unicorn mark. A bear case
              should assume that growth slows, financing or concentration issues surface, and public-market compression
              dominates the comp set. A bull case should assume that revenue quality is stronger than feared, financing
              losses are controlled, multi-product attachment is real, and the operating reset is working better than
              the public evidence currently shows.


              Sensitivity is high because small changes in the revenue multiple create large changes in implied equity
              value. At roughly $397.7 million of reported 2024 revenue, a 1.5x multiple implies just under $600
              million, 2.0x implies roughly $800 million, 2.5x implies about $1.0 billion, and 3.0x gets back to roughly
              the old unicorn level. That arithmetic is not a final valuation; it is a way to show how much conviction
              is required to defend different price levels. Without updated 2025-2026 revenue, gross margin, operating
              margin, and financed-book metrics, investors should resist the temptation to use the top end of the range
              as a default entry point.
            claimRefs:
              - CV003
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
          - type: table
