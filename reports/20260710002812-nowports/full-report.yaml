        - from: scale
          to: proof
        - from: proof
          to: risk
        - from: risk
          to: price
        - from: price
          to: call
    claimRefs:
      - CV002
      - CV020
      - CV024
      - CV036
      - CV037
      - CV040
  - id: FV002
    title: Valuation sensitivity
    type: bar
    summary: >-
      Illustrative equity-value sensitivity using the third-party 2024 revenue anchor of $397.7M and a range of revenue
      multiples.
    data:
      items:
        - label: 1.0x revenue
          value: 398
          detail: Illustrative floor near a hard-discount case
        - label: 1.5x revenue
          value: 597
          detail: Base-case low end if opacity discount remains heavy
        - label: 2.0x revenue
          value: 795
          detail: Base-case center if growth quality is decent
        - label: 2.5x revenue
          value: 994
          detail: Approaches the old unicorn mark but still below it
        - label: 3.0x revenue
          value: 1193
          detail: Requires strong conviction that stale-mark risk is overcome
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
  - id: FV003
    title: Valuation / return range
    type: range
    summary: >-
      Current-value scenario bands show why the recommendation is highly price-sensitive rather than categorically
      bullish or bearish.
    data:
      items:
        - label: Bear
          low: 300
          mid: 400
          high: 500
          detail: Downside if growth or credit quality disappoints
        - label: Base
          low: 550
          mid: 725
          high: 900
          detail: Most defensible band with current public evidence
        - label: Bull
          low: 950
          mid: 1100
          high: 1300
          detail: Needs refreshed proof on margins, retention, and disciplined execution
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV032
  - id: FV004
    title: Investment KPIs
    type: kpi
    summary: IC-style scorecard across proof, economics visibility, risk, and valuation support.
    data:
      items:
        - label: Revenue scale
          value: 8/10
          detail: Large enough to matter if third-party revenue estimates are directionally right
        - label: Customer proof
          value: 7/10
          detail: Better than a logo wall because named users and daily-use signals exist
        - label: Moat visibility
          value: 5/10
          detail: Digital workflow and regional execution matter, but moat durability is not fully proven
        - label: Economics visibility
          value: 3/10
          detail: No public audited margin, burn, or financed-book disclosure
        - label: Risk load
          value: 3/10
          detail: Credit, concentration, and execution risk remain material
        - label: Valuation support
          value: 4/10
          detail: Old price anchor exists, but fresh support is weak
        - label: Exit readiness
          value: 5/10
          detail: Plausible, but constrained by disclosure and sector repricing
        - label: Overall investability today
          value: 4/10
          detail: Interesting company, insufficient public support for an aggressive price
    claimRefs:
      - CV020
      - CV021
      - CV024
      - CV036
      - CV039
      - CV040
