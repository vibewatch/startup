  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and compliance risk
        blocks:
          - type: paragraph
            body: >-
              The most concrete public regulatory risk is not a disclosed enforcement action; it is the expanding
              compliance surface that comes from blending cross-border logistics, customs handling, payments-related
              data, and fintech-adjacent workflows. Nowports’ privacy policy says the company collects account, payment,
              tax, device, geolocation, and usage information, while its terms say automated AI agents may analyze and
              contact users. That combination means data-handling, consent management, vendor oversight, and incident
              response all matter materially, especially because the same privacy policy explicitly says no internet
              transmission is absolutely invulnerable. The public security page offers only a thin intake surface rather
              than a detailed control narrative, which is not evidence of failure but does leave diligence gaps.


              Customs compliance is the second major legal risk. Baker McKenzie’s January 2026 alert says Mexico’s
              electronic Customs Value Declaration requirement via VUCEM becomes effective on 1 April 2026 and requires
              tighter document linkage, correction workflows, and internal training. CNBV materials show that Mexico’s
              fintech framework remains a structured supervisory environment with API, AML, and institution-level rules
              that matter whenever a logistics operator expands into financing-adjacent products or customer cash-flow
              support. The right interpretation is not that Nowports is visibly out of compliance. It is that its
              business model touches regulated processes where operational mistakes can quickly become legal, monetary,
              or customer-trust problems. Investors therefore need market-by-market mapping of licenses, contracted
              entities, brokerage roles, and data-governance ownership before assuming the company’s expansion path is
              frictionless.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
