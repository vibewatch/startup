      - number: '3.3'
        title: Switching costs, distribution power, and multi-homing
        blocks:
          - type: paragraph
            body: >-
              Nowports’ switching-cost story is real but only partially durable in public evidence. The strongest part
              of the case is workflow integration. Official product pages say clients can centralize documents,
              invoices, alerts, tracking, reports, and financing on one platform; FAQ text also says the product works
              best for recurrent movements because those customers get the most value from reporting and tracking.
              Customer testimonials from Oriflame, Ostemex, Segamac, and Grupo Raphael reinforce that argument by
              describing documentation access, real-time tracking, and decision-ready reporting as concrete benefits.
              Those claims suggest that once a shipper routes recurring volume through Nowports, the platform can become
              operationally sticky.


              Still, buyers can multi-home. Flexport, Freightos, Forto, and Nuvocargo each emphasize visibility,
              notifications, booking, or customs orchestration, while traditional forwarders can still win by
              relationship, lane expertise, or price. Freightos in particular weakens the moat of any one digital
              forwarder because it trains buyers to treat freight as a more searchable, connected, and routable
              workflow. Nuvocargo’s promise of starting with as few as 10 loads for a pilot also shows how low-friction
              the initial trial can be in logistics software-enabled services. In practice, Nowports likely has higher
              stickiness with customers that use financing, insurance, and reporting together than with customers only
              seeking spot quotes on occasional shipments.
