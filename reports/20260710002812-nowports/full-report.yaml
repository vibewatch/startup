        blocks:
          - type: paragraph
            body: >-
              The trust and compliance surface is one of the stronger parts of the public file. The privacy policy says
              the company collects account, communication, payment, login, usage, and approximate geolocation
              information and describes encryption, continuous monitoring, and legal-retention obligations. The security
              page provides a contact path for cybersecurity disclosures, and the privacy policy says the company
              conducts penetration testing and participates in a bug bounty program. The terms of service also mention
              AI agents for assistance, request qualification, and user contact. These are meaningful signals that the
              product is not being operated as a casual brochure site.


              However, investors should not overread them. Public trust pages are policy evidence, not proof of
              implementation quality. The local source set does not show a public SOC 2 report, ISO 27001 certification,
              uptime page, public API documentation, or detailed incident history. Nor does it explain where customer
              data is stored, how partner data feeds are integrated, or how underwriting and logistics data are
              separated. The right product-and-technology conclusion is therefore balanced: Nowports has credible
              evidence of an integrated logistics workflow product with visible operational tooling and formal trust
              policies, but many of the technical details that would matter for deep diligence remain private and should
              be requested directly.
