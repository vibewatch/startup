      - number: '2.4'
        title: Market Verdict and Open Questions
        blocks:
          - type: paragraph
            body: >-
              The public-market case for Nowports is strongest when framed as “digitizing a fragmented, volatile
              cross-border logistics workflow for Latin American SMEs and mid-market shippers.” The category is big
              enough to matter, the pain is real, and the buyer’s willingness to pay for visibility and workflow
              compression is supported by both independent market reports and competitor product positioning. The
              company also benefits from a product wedge that is broader than basic forwarding but narrower than
              building a full ERP for trade. That is a credible middle ground.


              The weakest part of the market story is the lack of a clean public conversion from broad market size into
              Nowports’ truly addressable revenue pool. Public sources do not reveal average contract value, shipment
              retention, segment mix by country, or how much of the market the company can realistically serve when
              credit exposure, compliance, and local operating intensity are considered. As a result, the right
              diligence posture is not to accept a single TAM number, but to request a bottoms-up market map by lane,
              industry, shipment frequency, and financing attach rate.
            claimRefs:
              - CM011
              - CM012
              - CM023
              - CM026
              - CM032
              - CM033
              - CM034
              - CM035
