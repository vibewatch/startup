  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization mechanics
        blocks:
          - type: paragraph
            body: >-
              Nowports does not look like a pure SaaS business with a simple subscription line. Official pages and FAQ
              responses describe a freight-forwarding model that combines ocean, air, and ground transport with document
              management, alerts, reporting, financing, and insurance facilitation. The platform is not sold as a
              standalone product in the public record; the FAQ explicitly says it is an integral component of the
              freight-forwarder service. That matters because it implies that customer activity, carrier procurement,
              and shipment execution remain the primary engines of revenue generation, while the software layer
              increases attachment, retention, and workflow efficiency.


              The public sources also show that monetization is multi-layered. The ocean-freight page says pricing
              depends on container type, weight, volume, routing, port charges, season, market conditions, contracts,
              and customs; the FAQ notes that in some cases Nowports has secured payment terms of up to 30 days; and
              Mexico Business News says the financing product can provide up to US$250,000 to Mexican SMEs. TipRanks’
              summary of a company LinkedIn post frames inventory financing as a digitally enabled offering with online
              processes and access to funds in a few days. Taken together, the evidence supports at least four
              monetization surfaces: freight execution spread or fees, financing economics, insurance-related
              facilitation, and workflow value that can improve account retention or wallet share. What the public file
              does not show is the stream mix, realized pricing, or the accounting policy used to distinguish
              pass-through transportation expense from contribution margin.
            claimRefs:
              - CI001
              - CI002
              - CI003
