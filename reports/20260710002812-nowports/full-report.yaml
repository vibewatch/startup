chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Stage
        blocks:
          - type: paragraph
            body: >-
              Nowports is best understood as a tech-enabled freight forwarder built around the pain points of Latin
              American importers and exporters rather than as a pure software vendor. The company’s current official
              pages and FAQ consistently present the offer as a combination of ocean, air, ground, and multimodal
              freight execution plus a digital operating layer for documentation, alerts, reporting, and shipment
              tracking. That framing matters because the company is selling workflow compression and visibility at the
              same time: customers can book cargo, centralize freight paperwork, track exceptions, and in some markets
              coordinate insurance, customs support, and financing from one relationship. The official site also
              emphasizes that the company wants to be a single point of contact for cargo movement, protection, and
              financing, which shows why the product suite has expanded beyond booking alone.


              Founded in 2018, Nowports publicly ties its origin story to Monterrey, Mexico and to the logistics
              experience of its founders. The reviewed sources consistently support the 2018 founding year, Y Combinator
              W19 participation, and a Latin America focus from day one. Public descriptions also show that the
              company’s lane logic is not purely domestic: official pages emphasize coverage between China, Latin
              America, and the world, while third-party coverage highlights Asia-to-Latin America maritime flows and
              US-to-Mexico ground freight. In underwriting terms, the identity is therefore coherent: a Latin American
              digital forwarder using software, analytics, and finance to reduce operational friction in cross-border
              trade rather than a marketplace with no execution exposure.
