companyProfile:
  summary: >-
    Nowports is a Monterrey-founded digital freight forwarder focused on Latin American trade flows, with a product
    stack spanning freight execution, shipment visibility, document management, alerts, reports, and financing-adjacent
    support. Public sources consistently support the 2018 founding story, rapid 2021-2022 fundraising path, and a real
    customer workflow proposition rather than a thin marketplace thesis. Public evidence also suggests the company has
    reached meaningful scale, but current underwriting remains constrained by sparse disclosure on margins, credit
    performance, concentration, and cap-table structure.
  founders:
    - name: Alfonso de los Ríos
      role: Co-founder; former CEO, now president
      background: >-
        Public profiles tie him to family exposure to traditional freight forwarding in Mexico and to the company’s
        original logistics thesis.
