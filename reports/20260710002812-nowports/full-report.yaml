  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, confidence, and price discipline
        blocks:
          - type: paragraph
            body: >-
              The most important valuation fact in the public record is also the biggest caution flag: Nowports’ latest
              widely cited pricing event is still the May 2022 Series C that valued the company at $1.1 billion. That
              round clearly established that top-tier investors once saw unicorn potential in a Latin American digital
              freight forwarder pairing visibility software with freight execution and financing expansion. But a 2022
              growth-stage mark is not the same thing as a 2026 fair value. Since that round, the company has reportedly
              scaled revenue substantially, yet the public evidence is still thin on audited margins, credit losses,
              retention, concentration, and cap-table terms. Public sources also show layoffs and a CEO transition,
              which do not invalidate the business but do raise the bar for paying peak-era pricing without refreshed
              proof.


              The balanced recommendation is therefore not “avoid” and not “buy at any price.” It is track / research
              more, with medium confidence and a high risk rating. If the 2024 revenue figure reported by LATKA is
              directionally right, the business is too large and too operationally real to dismiss as a narrative-only
              startup. At the same time, the absence of current profitability, financed-book, and cohort disclosure
              means investors should demand either a meaningful discount to the 2022 unicorn mark or structured downside
              protection. In other words, the debate is less about whether Nowports matters and more about whether the
              price compensates for opacity, execution risk, and sector repricing.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV019
              - CV024
              - CV036
              - CV037
              - CV040
