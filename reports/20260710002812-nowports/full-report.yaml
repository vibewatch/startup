      - number: '2.3'
        title: Drivers, Constraints, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The strongest drivers in the public evidence are visibility, digitalization, and volatility management.
              The World Bank says 44 days elapse on average from export-port entry to destination-port exit and that
              end-to-end supply-chain digitalization can shorten port delays materially. Mordor says demand is moving
              toward platforms that solve visibility, documentation, and compliance gaps rather than simply switching
              modes, and that SMEs already represent most digital-forwarding demand. Maersk and Solistica add the
              operational reality behind those abstractions: Latin American shippers face port congestion, customs
              complexity, weather disruptions, labor pressure, and lane variability, which makes multimodal flexibility
              and real-time alerts more valuable than a lowest-rate quote alone. Mouro’s investment note fits the same
              pattern by arguing that transparency and efficiency are unusually valuable in Latin American trade flows.


              Constraints are equally real. Mordor flags regulatory complexity, infrastructure gaps, and incumbent
              resistance as core barriers; World Bank emphasizes seaport, airport, and multimodal bottlenecks; and
              recent Latin American market updates note customs delays, roadwork, and port congestion across multiple
              countries. Adoption therefore is not a one-click SaaS motion. The buyer first needs a painful import or
              export workflow, then enough shipment frequency to care about documents and visibility, then enough trust
              to route cargo and possibly financing or insurance through one provider. That explains why Nowports
              appears to focus on recurring movers rather than occasional shippers and why financing, customs support,
              and reporting are not side products but adoption accelerants.
            claimRefs:
              - CM020
              - CM021
              - CM022
              - CM023
