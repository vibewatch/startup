        - Sacra estimates $2.1B 2024 revenue and ~$3.8B late-2024 valuation (~1.8x revenue)
        - Closest scaled digital-forwarder comp with product breadth
        - Private estimate and not a public daily mark
      - - Freightos
        - Public digital-forwarder comp
        - 2026 public market cap ranged around ~$68M to ~$111M across snapshots
        - Shows how harsh public-market pricing can be for digital freight platforms
        - Different model mix and small-cap volatility distort comparison
      - - Expeditors
        - Public incumbent comp
        - ~$22.31B market cap in Jul 2026
        - Shows how much value mature, disclosed incumbents can sustain
        - Very different maturity, governance, and profitability profile
      - - C.H. Robinson
        - Public incumbent comp
        - ~$22.72B market cap in Jul 2026
        - Another mature freight/logistics benchmark for scale and disclosure
        - Not a digital-native LatAm growth story
      - - Forto
        - Private digital-forwarder downside comp
        - Last valued at $2.1B but reportedly explored merger or sale in 2025
        - Signals strategic-option pressure in the sector
        - Single report, private context, and no live price discovery
    notes: >-
      The comp set mixes private and public references intentionally; private marks illustrate prior venture enthusiasm,
      while public marks anchor what transparent markets currently reward.
