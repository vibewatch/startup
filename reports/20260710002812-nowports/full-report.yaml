      - number: '6.4'
        title: Expansion, concentration risk, and customer verdict
        blocks:
          - type: paragraph
            body: >-
              The public customer story is good enough to support continued diligence but not to close it. The strongest
              case is that Nowports has identified a real customer niche: recurring Latin American shippers with
              operational complexity, documentation pain, and occasional working-capital needs. The broadest upside is
              that those customers can expand from freight execution into financing, insurance, and planning workflows,
              increasing account value and switching costs. The weakest part of the story is exactly what public startup
              reporting almost never gives investors: cohort tables, concentration, renewal terms, and account-level
              share of wallet. Without those, it is impossible to know whether growth comes from many durable mid-market
              accounts or a smaller set of freight-heavy customers.


              The right customer verdict is therefore balanced. There is better named proof here than in many
              private-company diligence files because the company shows quoted customers and an externally observed
              daily-use platform. But public evidence still does not show whether the best-looking accounts renew,
              expand, or remain profitable over time. Customer diligence should focus on account concentration, repeat
              shipment frequency, financing attach rate, and whether the testimonial-backed customers are representative
              of the broader installed base or only of the most successful corner of it.
