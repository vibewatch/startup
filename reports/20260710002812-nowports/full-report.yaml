      - number: '8.4'
        title: Exit readiness, thesis-break triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is plausible but not yet cleanly underwritten. There is enough public evidence to believe
              that Nowports has built a real regional platform: official testimonials exist, daily-use signals exist,
              product breadth is broader than a simple broker, and third-party sources suggest the company has moved
              beyond experiment stage. That is enough to keep strategic-sale, late-stage financing, or eventual
              liquidity optionality on the table. But optionality is not the same as readiness. Thin public margin
              disclosure, unresolved credit and concentration questions, and the lack of public cap-table or preference
              detail all lower confidence in any precise return model.


              The right final diligence posture is explicit. Investors should request updated 2025 and 2026 revenue by
              mode and geography, gross margin and operating-margin bridges, financed-book performance, customer
              concentration, cohort retention, and preference-stack detail. They should also test whether the
              post-layoff, post-CEO-transition organization is actually improving service quality and focus. If those
              answers are strong, Nowports could justify a constructive valuation stance at disciplined pricing. If they
              are weak, the thesis can break quickly because a logistics-plus-finance model punishes over-optimism.
              Price sensitivity therefore remains central to the recommendation.
            claimRefs:
              - CV020
              - CV021
              - CV022
              - CV023
              - CV034
              - CV035
              - CV038
              - CV039
              - CV040
