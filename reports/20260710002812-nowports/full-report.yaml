      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Founder-market fit is one of the strongest parts of the public record. The Y Combinator company profile
              says Alfonso de los Ríos and Maximiliano Casal met in 2017, that Casal learned the industry while working
              for a major freight forwarding group, and that de los Ríos grew up around the sector because his family
              owned a traditional forwarding business in Mexico. That background makes the current operating model more
              credible: the company is not a generic software team approaching logistics from the outside, but rather a
              founder pair that came in through shipping pain points, documentation friction, and customer communication
              failures. Mouro Capital’s investment note reinforces that interpretation by explicitly describing the
              founders as combining regional and industry knowledge with a tech-enabled operating model.


              Leadership, however, has evolved. Public reporting in April 2025 said Alfonso de los Ríos stepped out of
              the CEO role and became president while Fernando Poitevin moved into the CEO seat after previously joining
              as COO. The same article said co-founder Maximiliano Casal had already left day-to-day operations while
              remaining on the board. That transition is important for diligence because it cuts both ways. On one hand,
              it reduces pure founder-key-person concentration and suggests the company has reached a scale where
              operating discipline matters more. On the other hand, public governance disclosure remains thin: reviewed
              official pages do not publish a full board roster, committee structure, or executive bench below the top
              layer. The result is a founder-origin business moving toward institutionalization, but not yet one whose
              governance is fully transparent from public materials alone.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO012
              - CO013
              - CO026
              - CO027
              - CO032
