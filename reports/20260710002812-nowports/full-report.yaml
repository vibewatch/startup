        title: Exhibits
        blocks:
          - type: callout
            title: The pain is operational, not theoretical.
            body: >-
              Public sources converge on the same demand driver: shippers need visibility, documents, customs handling,
              and fewer exceptions across unpredictable cross-border routes.
