    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation follows a simple chain: real scale and proof keep the story alive, but valuation discipline
      dominates because disclosure and risk gaps remain large.
    data:
      nodes:
        - id: scale
          label: Real scale
        - id: proof
          label: Customer / product proof
        - id: risk
          label: Risk + opacity
        - id: price
          label: Price discipline
        - id: call
          label: Track / research more
