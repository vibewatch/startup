tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - User
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Ocean freight
    - Import/export operations teams
    - Mature public product page
    - Strong lane complexity and customs context tied to platform
    - Need lane-level SLA and carrier concentration
  - - Air freight
    - Time-sensitive or high-value shippers
    - Mature public product page
    - Specialized handling for pharma, urgent, high-value, and perishable goods
    - Need proof of actual vertical depth and cold-chain controls
  - - Ground freight
    - Domestic and cross-border cargo operators
    - Publicly offered but less deeply described than ocean/air
    - Expands door-to-door coverage and multimodal continuity
    - Need route density and partner model by country
  - - Digital platform
    - Customers plus internal operators
    - Core platform with documents, alerts, reports, tracking
    - Centralizes operations and decision support
    - Need active usage and module adoption metrics
  - - Financing / insurance / custody
    - Finance and risk-sensitive customers
    - Available as adjacency tied to shipments
    - Raises switching costs and operational stickiness
    - Need attach rates, partner economics, and compliance structure
  notes: The module map distinguishes what is clearly productized from what is publicly visible only as a bundled workflow adjacency.
