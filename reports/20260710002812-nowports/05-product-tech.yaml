- id: workflow-architecture-and-deployment
  title: Workflow, operating architecture, and deployment
  body: 'Public evidence suggests a service-led architecture built around a control-tower workflow. The platform page says users can manage documents, generate reports, view historical activity, receive alerts, and locate shipments through an interactive map. The FAQ says setup requires no additional installation and that customers can access the service from standard browsers or a mobile app on iOS and Android. The digitalization page adds multi-channel human support, while the move page emphasizes a single point of contact and ongoing training. A 2024 external design case study further says the company had a client-facing app and two internal apps that were redesigned in close work with users and internal stakeholders.


    Taken together, the likely operating architecture is straightforward at a high level even if the underlying stack is undisclosed: customer demand enters through expert onboarding or quote flows, shipment execution is coordinated across freight providers, the platform organizes documentation and status information, and internal teams use separate operational tooling to manage exceptions. This is not enough to infer databases, APIs, or infrastructure details, and the public record does not justify those guesses. But it is enough to say that the company’s technical delivery model depends on synchronization between customer-facing workflow tools and internal operational software rather than on a purely self-serve web app.'
  claimRefs:
  - CE009
  - CE010
  - CE011
  - CE012
