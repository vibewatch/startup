  topStrengths:
    - >-
      Boston Scientific’s $1.5 billion investment plus a milestone-based $3 billion TAVR option is unusually strong
      strategic validation for a private, pre-approval medtech company.
    - >-
      MiRus is not a single-asset science project: public evidence shows 24 FDA-cleared orthopedic / spine devices,
      manufacturing infrastructure, and a broader MoRe-alloy product platform.
    - >-
      Early clinical and pivotal-trial progress on SIEGEL gives MiRus a credible shot at entering a large
      structural-heart category if STAR executes well.
  topRisks:
    - >-
      The $4.4 billion implied valuation is pre-approval and still binary on STAR-trial, PMA, and Boston Scientific
      option-exercise milestones.
    - >-
      Revenue, margins, customer concentration, headcount, and pre-2026 financing history are not publicly disclosed,
      making public-only underwriting incomplete.
    - >-
      TAVR customer proof is concentrated in a small set of physician champions and trial sites, especially Piedmont
      Heart Institute, rather than broad commercial adoption.
  unresolvedGaps:
    - Private financial statements and product-line revenue / gross-margin detail for the orthopedic business.
    - Verbatim Boston Scientific option milestones, governance rights, and cap-table implications for co-investors.
    - STAR enrollment velocity, activated-site cadence, and the full site mix beyond Piedmont.
