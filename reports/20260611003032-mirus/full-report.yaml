      - number: '3.6'
        title: Exhibits
        blocks:
          - type: callout
            title: BSX Exit Illustrates Incumbency Durability Risk
            body: >-
              Boston Scientific — a top-five global medtech company — exited TAVR twice (Lotus 2020; Acurate 2025)
              despite hundreds of millions in R&D and acquisition spending. The Acurate IDE trial failure, where
              under-expanded valves in ~21% of cases drove inferior one-year outcomes against Edwards and Medtronic, is
              a concrete adverse data point: even technically competitive devices face adoption barriers that translate
              to clinical underperformance in heterogeneous operator environments. MiRus SIEGEL's 8F profile may
              partially address deployment simplicity, but the BSX pattern makes clear that any new TAVR entrant faces a
              structurally high bar.
            calloutType: risk
            claimRefs:
              - CP006
              - CP007
              - CP029
              - CP036
          - type: callout
            title: BSX Call Option Creates Competitive Ambiguity
            body: >-
              Boston Scientific holds a $3 billion call option to acquire MiRus's TAVR business after specified clinical
              and regulatory milestones. This structure makes BSX simultaneously the most strategic investor in MiRus
              and a latent future competitor. If BSX exercises, MiRus TAVR loses independence and its commercial fate
              passes to BSX's distribution priorities. If BSX declines, MiRus must commercialize independently against
              Edwards and Medtronic — requiring a commercial infrastructure build that its current resources cannot
              sustain without additional capital. Investors should require clarity on the option exercise timeline,
              triggers, and MiRus's contingency plan for standalone commercialization.
