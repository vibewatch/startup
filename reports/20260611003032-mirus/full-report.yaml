      - number: '7.2'
        title: Boston Scientific Dependency and Partner Risk
        blocks:
          - type: paragraph
            body: >-
              The strategic relationship with Boston Scientific is simultaneously MiRus's greatest source of capital and
              its greatest concentration risk. BSX's $1.5B equity investment for a 34% stake values MiRus at
              approximately $4.4B post-money; the accompanying exclusive option to acquire the TAVR business for
              additional aggregate payments of $3B creates a financial structure in which MiRus's TAVR trajectory is
              entirely aligned with whether BSX chooses to exercise. Two structural risks flow from this arrangement.


              First, the option creates asymmetric governance: BSX holds the exclusive right to acquire MiRus TAVR on
              terms that include "certain milestones" not publicly disclosed. MiRus therefore faces a scenario in which
              its most valuable asset is contractually reserved for a single buyer, preventing competitive M&A processes
              or IPO paths for TAVR without BSX consent (pending the option agreement terms). If trial milestones are
              missed or clinical data disappoints, BSX may decline to exercise — leaving MiRus without a
              commercialization partner for TAVR at the point of maximum capital need (pre-PMA, mid-trial). BSX declined
              to exercise comparable options on its own ACURATE platform after years of investment, demonstrating that
              large-cap medtech companies will abandon TAVR programs even when development capital has been sunk.


              Second, BSX's track record in TAVR is adverse: it discontinued the Lotus valve in 2016 following
              mechanical complications and delivery system design challenges, then terminated the ACURATE neo2 and
              ACURATE Prime programs globally in 2023–2024 after the IDE trial failed noninferiority. As of 2026, BSX
              has no approved TAVR product of its own and is relying on MiRus to fill that gap. This dependency creates
              aligned incentives for trial acceleration but also concentration risk: BSX's TAVR strategy is a
              single-company bet, and any deterioration in BSX's cardiac or structural heart business priorities
              (strategic pivot, acquisition, capital reallocation) could reduce support for MiRus.


              BSX reported Q4 2025 cardiovascular segment growth of 16.1% organically, indicating healthy underlying
              business fundamentals that support continued investment. However, BSX carries long-term debt of
              approximately $13–14B (per Q4 2025 earnings), meaning additional capital commitments — including the $3B
              option payment — are contingent on the company's broader capital allocation decisions. A deterioration in
              BSX credit markets or a large competing acquisition could reduce the probability of option exercise.
            claimRefs:
