  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Clinical Trial Risk
        blocks:
          - type: paragraph
            body: >-
              The most severe risk to MiRus is regulatory: the Siegel TAVR system requires a Pre-Market Approval (PMA)
              from the FDA as a Class III device, and no TAVR has ever received PMA without a successful large-scale
              randomized controlled trial. The STAR pivotal trial (NCT07278310) targets 1,025 patients across
              approximately 20 U.S. centers; as of June 2026, only Piedmont Heart Institute is listed as an active
              recruiting site on ClinicalTrials.gov. The EFS enrolled 15 patients at five centers over approximately
              twelve months (March–late 2025); extrapolating that pace to 1,025 patients without multi-site
              parallelization implies a trial completion timeline well beyond 2030, and PMA review adds 12–18 months
              beyond data lock. FDA's 2020 guidance requires 30-day, 1-year, and 5-year follow-up endpoints for
              structural heart PMA submissions, creating a multi-year regulatory clock that cannot be accelerated
              without additional site activation.


              The FDA granted Breakthrough Device Designation to the Siegel TAVR for the nickel-allergic patient
              subpopulation — a meaningful regulatory benefit that provides enhanced FDA interaction and potentially
              faster review. However, Breakthrough Designation does not lower the clinical evidentiary bar: the STAR
              trial must still demonstrate non-inferiority or superiority to approved comparators (SAPIEN 3, Evolut FX)
              on a composite primary safety-and-efficacy endpoint. Boston Scientific's Acurate neo2 was a cautionary
              precedent: after receiving CE mark, European commercial sales, and positive early registry data, the
              ACURATE TAVR program was formally discontinued in 2023-2024 when the FDA-required IDE trial showed the
              device failed to meet the predetermined noninferiority margin against SAPIEN and Evolut — leading BSX to
              abandon the entire program. The risk that Siegel, despite favorable 15-patient EFS data, encounters
              durability, hemodynamic, or safety issues at trial scale is real and unquantifiable until the STAR primary
              endpoint is reached.


              CMS coverage adds a second regulatory dimension. The STAR trial received unconditional Coverage with
              Evidence Development (CED) approval on March 27, 2026, enabling Medicare reimbursement for trial
              procedures. CED approval is trial-scope coverage only — it does not pre-authorize commercial
              reimbursement. Post-PMA commercial launch requires a new CMS coverage determination (NCD or LCD), which
              can take 12–24 months and may be conditional on registering all commercial cases in the TVT Registry (as
              is currently required for all TAVR). If FDA approves only a narrow indication (e.g., symptomatic severe AS
              in nickel-allergic patients), the addressable commercial population shrinks materially, reducing
              commercial revenue projections and the expected value of BSX's option.


              For orthopedic and spine products, near-term regulatory risk is lower: the EUROPA PCF system holds 510(k)
              clearance and an NTAP from CMS (effective FY2026). The IO Expandable Wedge system holds 510(k) clearance
              (K232154, September 2023). However, NTAP is time-limited — CMS typically grants NTAP for two to three
              fiscal years, after which the add-on payment lapses and hospitals absorb the full cost within DRG
              reimbursement, potentially reducing adoption incentives. No regulatory investigations, warning letters, or
              483 observations against MiRus have been identified in public sources.
