  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and business-unit structure
        blocks:
          - type: paragraph
            body: >-
              MiRus operates two structurally distinct revenue models that coexist under a single holding entity. The
              first is a conventional medical-device commercial operation in spine and orthopedics: MiRus sells
              FDA-cleared hardware implants and procedural instruments to hospitals and ambulatory surgery centers
              through a distributor network. The product portfolio confirmed by public sources includes at least 24
              510(k)-cleared devices across cervical spine (EUROPA PCF, RIGEL, CYGNUS systems), lumbar spine (IO
              Expandable Lumbar Interbody, ANTARES, 3DR LLIF), extremity (IO Expandable Wedge Osteotomy), and procedural
              solutions (GALILEO, VITESSE). The commercial mechanics are standard for premium spine: MiRus ships
              consigned instrument trays, generates per-procedure revenue on implant sales, and differentiates on the
              MoRe alloy's mechanical properties and, more recently, on NTAP reimbursement support from CMS for the
              EUROPA PCF system. The NTAP designation, effective 2024–2025, entitles qualifying Medicare inpatient cases
              to incremental reimbursement, which lowers the economic friction for hospital adoption but does not itself
              constitute a direct MiRus revenue line. The second business is pre-commercial: the SIEGEL TAVR system is
              an investigational device in the STAR pivotal trial. No TAVR revenue exists today; the relevant financial
              metric for this track is clinical trial burn and regulatory spend rather than sales. Boston Scientific's
              May 2026 investment and option structure are the primary financing vehicle for the TAVR track. The two
              tracks share the MoRe alloy platform and manufacturing infrastructure, which creates some operating
              leverage, but their revenue timing, risk profiles, and capital requirements differ materially.
