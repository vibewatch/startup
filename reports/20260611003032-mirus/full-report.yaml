      - number: '4.6'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              MiRus' financial profile is determined by two competing realities. The first is strategic validation: a
              $1.5 billion BSX investment at an implied ~$4.4 billion equity valuation, with a $3 billion option on the
              TAVR business, is among the largest pre-approval medical device financing events in the TAVR category and
              provides adequate near-term capital for trial completion. The second is informational opacity: the company
              discloses no revenue, no margin, no burn rate, and no unit economics. The result is a financial case that
              cannot be fully underwritten from public data alone. Revenue quality for the orthopedic segment is
              partially inferable — 24 cleared products, CMS NTAP support, and a functioning distributor channel suggest
              a real commercial operation — but the scale, growth trajectory, and margin structure are unknown. The TAVR
              business is entirely pre-revenue: SIEGEL is investigational, STAR is in enrollment, and any TAVR revenue
              is at minimum 3–5 years away under an optimistic regulatory timeline. The capital adequacy question is
              largely resolved by the BSX deal: $1.5 billion is more than sufficient to fund STAR enrollment and primary
              endpoint readout. The underwriting blocker is not capital adequacy per se but option dependency: if STAR
              does not demonstrate non-inferiority to SAPIEN or Evolut on its 1-year composite endpoint, BSX is not
              obligated to exercise the $3 billion option, and the standalone enterprise value reverts to the orthopedic
              business plus any residual pipeline optionality. Margin path analysis remains speculative without a
              diligence conversation: MoRe alloy differentiation could support premium pricing in both spine and TAVR,
              but manufacturing scalability, COGS trajectory, and realized vs. list pricing are all private-data gaps.
              The verdict is that MiRus' financial profile is strategically sound but operationally opaque — sufficient
              for a high-interest diligence queue but not yet underwritable without private access.
            claimRefs:
              - CI039
              - CI040
              - CI041
              - CI042
              - CI043
      - number: '4.7'
        title: Exhibits
        blocks:
          - type: callout
            title: BSX deal validates scale and provides adequate near-term capital
            body: >-
              The $1.5 billion investment at an implied ~$4.4 billion post-money equity valuation, made by a strategic
              acquirer with a declared need to re-enter the TAVR market, is a high-quality external validation event.
              The capital quantum is sufficient to fund STAR enrollment and readout under conservative assumptions. The
              milestone-structured $3 billion option aligns Boston Scientific's incentives with MiRus' clinical success,
              creating a well-aligned principal-agent dynamic for the trial period.
            calloutType: strength
            claimRefs:
              - CI009
              - CI010
              - CI013
              - CI015
          - type: callout
            title: TAVR option is conditional — milestone failure triggers recapitalization risk
            body: >-
              The $3 billion acquisition option is not a committed obligation. If the STAR trial fails to demonstrate
              non-inferiority to SAPIEN/Evolut on its 1-year composite endpoint, Boston Scientific is not required to
              exercise the option. In that scenario, MiRus retains the $1.5 billion investment (less accrued burn) but
              loses the primary exit mechanism for the TAVR business, and the $4.4 billion implied equity valuation
              would not be sustained. The orthopedic business would then bear the full burden of demonstrating
              standalone value. This is the primary underwriting risk in the financial profile.
            calloutType: risk
            claimRefs:
              - CI013
              - CI014
              - CI040
              - CI043
          - type: callout
            title: Revenue and margin opacity is a blocking diligence gap
            body: >-
              MiRus does not publicly disclose revenue, gross margin, burn rate, or unit economics for any business
              unit. All financial modeling of this company from public sources requires assumed benchmarks with very low
              confidence. This makes the company operationally ununderwritable from public data alone and mandates
              private data room access before any capital commitment.
            calloutType: risk
            claimRefs:
              - CI033
              - CI034
              - CI036
              - CI037
              - CI039
          - type: callout
            title: NTAP for EUROPA PCF is a near-term revenue support mechanism
            body: >-
              The CMS New Technology Add-on Payment for EUROPA PCF, effective 2024–2025, entitles hospitals performing
              qualifying Medicare inpatient cervical spine procedures with EUROPA to incremental reimbursement. This
              reduces economic friction for hospital adoption and can accelerate procedure volume — an indirect revenue
              support mechanism without directly increasing MiRus' list price. It is also a precedent that SIEGEL could
              pursue in TAVR if it demonstrates comparable clinical differentiation.
            calloutType: insight
            claimRefs:
              - CI006
              - CI007
              - CI023
          - type: callout
            title: $1.5B investment provides adequate runway — treated as working assumption
            body: >-
              Estimates that the $1.5 billion BSX investment funds MiRus through STAR primary endpoint readout and PMA
              preparation are based on analytical benchmarks from comparable TAVR pivotal trials. This is an inference,
              not a company disclosure. Actual adequacy depends on burn rate, enrollment pace, and whether additional
              clinical endpoints require extension studies. The working assumption should be revisited once private burn
              rate and trial timeline data are available.
