  - id: FM003
    title: Buyer and payer segment map — TAVR vs. spine
    type: matrix
    layout: wide
    summary: Comparison of decision-maker, payer, and adoption pathway across TAVR and spine segments.
    data:
      columns:
        - TAVR / Structural Heart
        - Spinal Implants
        - Key difference
      rows:
        - label: Budget owner
          values:
            - Hospital service-line VP / CFO (capital budget)
            - Spine surgery dept. head / supply chain (supply budget)
            - TAVR is capital-committee decision; spine is supply-chain decision — different sales cycle
        - label: Clinical decision-maker
          values:
            - Multidisciplinary heart team (cardiologist + cardiac surgeon; mandatory)
            - Individual spine surgeon (preference-based consignment)
            - TAVR has regulatory-mandated team gate; spine is surgeon-driven
        - label: Primary payer
          values:
            - Medicare (~75–80% of US procedures)
            - Medicare + commercial + workers' comp (more diversified)
            - TAVR payer concentration creates CMS policy risk; spine is less reimbursement-concentrated
        - label: Reimbursement mechanism
          values:
            - DRG-based inpatient (MS-DRG 266/267); CED for investigational devices
            - DRG or ASC fee-schedule; commercial bundled payments increasing
            - CED constraint applies only to TAVR pre-approval; spine has immediate commercial path
        - label: Switching cost
          values:
            - 'Very high: credentialing, training, imaging setup, team contracts'
            - 'Moderate: consignment logistics, surgeon re-training on alloy, rep relationships'
            - Structural switching barriers are much higher in TAVR
        - label: Program concentration
          values:
            - ~700–900 credentialed US centers (SCAI/STS/ACC/AATS requirements)
            - 4,000+ spine surgery sites (hospitals + ASCs)
            - Spine market fragmentation allows broader distribution but lower per-account revenue
    notes: >-
      TAVR buyer data from SCAI/STS consensus documents and CMS coverage policy. Spine buyer data inferred from JnJ
      DePuy Synthes, Stryker, and Zimmer Biomet product and distribution pages. Payer mix percentages are estimates
      based on GVR end-use data and Medicare prevalence in older patient populations.
