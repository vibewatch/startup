      - number: '5.6'
        title: Regulatory, Quality, Safety, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              MiRus's regulatory posture is materially bifurcated: the orthopedic/spine portfolio is commercially
              deployed under 24 FDA 510(k) clearances (Class II devices), while the SIEGEL TAVR is an investigational
              device operating under an IDE with no PMA yet filed. The EUROPA® PCF system holds both a 510(k) clearance
              (K242516, November 2024) and FDA Breakthrough Device Designation — and separately was awarded a New
              Technology Add-on Payment (NTAP) from CMS, which indicates reimbursement recognition for the novel
              technology but is time-limited. The in-vitro MoRe® metal ion release study (Spine Journal 2023)
              establishes a favorable safety profile for short-term physiologic and inflammatory conditions, but
              long-term in-vivo data in humans are not publicly available. No published clinical outcome studies for
              MiRus spine products (e.g., fusion rates, revision rates, patient-reported outcomes) have been identified
              in public databases. The Siegel clinical evidence base at runDate consists of five FIH patients with
              30-day data plus 15 EFS patients with 30-day data — aggregate n=20 at short follow-up. The 1,025-patient
              STAR pivotal trial is the definitive gate, and its primary completion was originally estimated at December
              2025, but enrollment only began in April 2026, implying the original timeline was aspirational. Long-term
              PVL, structural valve deterioration, and durability data against the 10–15 year horizon relevant to
              younger low-risk TAVR patients are not yet available. Technical risks include rhenium supply concentration
              (rhenium is primarily mined as a byproduct of molybdenum in Kazakhstan and Chile), in-house tissue
              processing quality, delivery system complication rates in real-world (non-expert) operators, and whether
              the GALILEO procedural platform holds necessary regulatory clearances. No publicly disclosed adverse event
              reports, recalls, or FDA enforcement actions were found for any MiRus product.
