      - number: '5.2'
        title: Spine and Orthopedic Product Portfolio
        blocks:
          - type: paragraph
            body: >-
              MiRus has commercialized a broad, MoRe-enabled spine and orthopedic portfolio across pedicle screw
              fixation, interbody fusion, anterior cervical hardware, and foot-and-ankle osteotomy. The EUROPA® Pedicle
              Screw System is the flagship spine fixation product, using MoRe rods and offering a lifetime limited
              warranty on rod fracture — a warranty that the company frames as a direct signal of mechanical confidence
              in the alloy. EUROPA® is available in 4.5 mm and 5.5 mm rod diameters for thoracolumbar surgery. The
              EUROPA® Posterior Cervical Fusion (PCF) system uses a 2.9 mm MoRe rod, which is materially smaller than
              any comparable commercial system and reduces hardware prominence, particularly in smaller patients. FDA
              awarded EUROPA® PCF Breakthrough Device Designation in July 2024. FDA 510(k) clearance for EUROPA® PCF was
              granted under K242516 in November 2024. The IO™ Expandable Lumbar Interbody System expands the expandable
              platform to the lumbar spine: it enters at a 3 mm insertion profile and expands continuously to 16 mm with
              0–23° of lordosis and 2.5 cc graft volume, targeted at patients with degenerative disc disease at L1–S1.
              The MiRus 3DR™ LLIF system with integrated plate fixation cleared via K232154 in September 2023.
              Additional products include RIGEL 3DR™ (cervical corpectomy and standalone cervical interbody), ANTARES
              3DR™ (standalone ALIF), CYGNUS MoRe® Anterior Cervical Plate, PROMETHEUS Adult Deformity System, and MoRe®
              Lumbar Plates. In the extremity segment, the IO™ Expandable Wedge Osteotomy System received FDA 510(k)
              clearance in February 2026 and commercially launched immediately; it applies the same expansion engine to
              Evans osteotomies for lateral column lengthening in foot and ankle surgery, allowing surgeons to fine-tune
              bone correction intraoperatively. OpenFDA records show a total of 24 MiRus 510(k) clearances on file as of
              June 2026.
