      - number: '6.4'
        title: Retention, Repeat Use, and Customer Durability
        blocks:
          - type: paragraph
            body: >-
              No retention metrics — net revenue retention (NRR), gross retention, churn rate, contract length, renewal
              data, or cohort analysis — exist in the public record for either business segment. This is an expected
              reality for a private company with an undisclosed commercial orthopedic revenue base and an entirely
              investigational TAVR program, but it leaves all customer durability analysis speculative.


              For TAVR, the concept of "retention" as normally applied to commercial accounts does not yet apply: trial
              sites participate under IDE protocols administered by MiRus's CRO and clinical affairs team, not under
              commercial supply agreements. A clinical site that completes EFS enrollment is expected to transition to
              the STAR pivotal trial at MiRus's direction, which represents a form of sequential engagement but is
              driven by regulatory pipeline requirements, not customer loyalty. The more relevant durability question
              for TAVR is whether lead investigators will advocate for the device post-approval: the published
              endorsements from Yadav, Thourani, Makkar, Leon, Kapadia, and Genereux suggest strong physician-champion
              alignment, but commercial adoption depends on system economics, FDA approval timing, and a post-market
              registry structure.


              For orthopedic/spine, the most relevant durability proxy would be reorder rates — whether surgeons trained
              on EUROPA® or IO™ products continue to prefer them over titanium or CoCr alternatives. The lifetime
              limited warranty on rod fracture is a structural retention incentive (ongoing product support), and the
              GALILEO™ ecosystem adds procedural switching costs. However, no utilization or reorder data are available.
              The NTAP adds a two-to-three year window during which hospital economics favor EUROPA® PCF adoption, after
              which price competition normalizes. No CMS claims data or commercial contract data confirming sustained
              hospital use have been identified.
