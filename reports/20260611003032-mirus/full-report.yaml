      - number: '4.5'
        title: Public traction proxies and missing private metrics
        blocks:
          - type: paragraph
            body: >-
              MiRus is a private company with limited voluntary financial disclosure. The publicly accessible traction
              signals are almost exclusively clinical and regulatory rather than commercial or financial. For the
              orthopedic business, observable proxies include: 24 510(k) clearances confirming a productized commercial
              portfolio; an NTAP designation for EUROPA PCF confirming CMS recognized the system as sufficiently novel
              for incremental Medicare reimbursement; Breakthrough Device Designation for EUROPA PCF; open sales and
              commercial operations roles in public job postings; and distributor-channel references in public press
              releases. None of these translates directly into revenue, units, or gross profit. For TAVR, the most
              meaningful traction signals are clinical: 15 EFS patients with zero 30-day major adverse events,
              enrollment in the 1,025-patient STAR pivotal trial, and the BSX investment itself as a form of strategic
              validation. Boston Scientific invested $1.5 billion after reviewing MiRus' non-public data room, making
              its decision a high-quality signal about the quality of the underlying evidence — but it does not
              substitute for disclosed financials. Material missing metrics include: (1) total company revenue and
              revenue growth; (2) orthopedic business unit revenue and margin; (3) customer count, distributor count,
              and procedure volume; (4) TAVR trial site count at STAR enrollment; (5) monthly cash burn; (6) pre-BSX
              fundraising total; (7) gross margin on spine hardware; (8) realized ASP vs. list ASP for orthopedic
              products; and (9) inventory carrying value and turns. Any financial model for MiRus that uses assumed
              revenue or margin figures must be labeled as estimated, not observed.
