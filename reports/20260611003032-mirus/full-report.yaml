      - number: '8.3'
        title: Scenario analysis — bull, base, and bear
        blocks:
          - type: paragraph
            body: >-
              Three scenarios capture the material range of outcomes. In the bull case, the STAR trial meets its
              non-inferiority primary endpoint on time (30-day readout of 1-year data by late 2027), FDA grants PMA
              approval in 2028–2029, Boston Scientific exercises the $3 billion TAVR option shortly after PMA, and the
              orthopedic business has grown to $300–500 million annual revenue supported by CMS NTAP and premium MoRe
              alloy differentiation. Total MiRus equity value at BSX option exercise represents a substantial multiple
              on the $4.4 billion post-money, creating strong returns for co-investors who entered at or near the BSX
              round price.

              In the base case, STAR succeeds but regulatory review is extended by 6–18 months beyond the optimistic
              timeline; BSX exercises the option but at slightly modified terms reflecting milestone renegotiation; and
              the orthopedic business continues growing but at single-digit rates. MiRus realizes its value through the
              BSX option exercise, with total outcomes in the $3.5–5.0 billion TAVR + orthopedic range depending on
              final exercise terms. Co-investors at the $4.4 billion post-money achieve modest but positive returns.

              In the bear case, STAR either fails its primary endpoint or is materially delayed beyond 2030, BSX does
              not exercise the option, and MiRus faces a recapitalization of the TAVR program. The orthopedic business
              provides a floor: 24 cleared products, CMS NTAP support, and a functioning distributor channel support a
              real commercial operation, but at undisclosed revenue scale and without TAVR optionality, the standalone
              orthopedic business at peer spine multiples (4–6x revenue) is estimated at $800 million to $3 billion
              depending on revenue scale, well below the $4.4 billion post-money. Co-investors at the BSX round price
              would face a loss in the bear case. This binary structure is the defining risk of the current valuation.
            claimRefs:
              - CV028
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
