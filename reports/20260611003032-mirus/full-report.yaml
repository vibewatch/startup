  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: TAVR Competitive Landscape — Direct Peers and Structural Dynamics
        blocks:
          - type: paragraph
            body: >-
              The US TAVR market is effectively a duopoly. Edwards Lifesciences controls approximately 60–70% of US TAVR
              procedures through its balloon-expandable SAPIEN 3 and SAPIEN 3 Ultra platforms. Edwards' full-year 2025
              TAVR revenue reached $4.5 billion, a year-over-year increase of 8.6%, demonstrating that the incumbent
              remains in a strong growth trajectory rather than a maturing plateau. Medtronic captures the remaining
              ~30–35% with its self-expanding Evolut FX platform. The two-year SMART trial data, which compared Evolut
              to SAPIEN in patients with small aortic annuli and predominantly female enrollment, showed Evolut with
              significantly less bioprosthetic valve dysfunction, five times less prosthetic valve thrombosis, and nine
              times less haemodynamic structural valve dysfunction — findings that may incrementally shift physician
              preferences in this patient subset but have not yet displaced Edwards' overall dominance.

              Abbott holds a small but expanding position with the Navitor system (FDA-approved January 2023 for
              high-risk patients), reporting 0% moderate-to-severe PVL, a mean gradient of 7.4 mmHg, and all-cause
              mortality of 1.9% in approval data. The ENVISION trial is broadening Navitor's label. Cardiologist surveys
              in 2024 predicted Edwards' US share would settle near 72% by 2025 as Abbott ramps, but the data still
              makes TAVR a two-horse race for total volume.

              Boston Scientific is no longer a TAVR competitor. After years of pursuing FDA approval for Acurate neo2,
              BSX discontinued all Acurate commercial, clinical, and manufacturing activity in May 2025. The Acurate IDE
              trial, reported at TCT 2024 and published in The Lancet, showed Acurate neo2 failed to meet the
              prespecified 8% noninferiority margin against both Evolut and SAPIEN; approximately 20% of valves were
              under-expanded, which contributed to worse one-year outcomes. BSX had $200 million in Acurate sales in
              2024 before discontinuation. The exit is strategically significant for MiRus: BSX's May 2026 $1.5 billion
              investment and $3 billion call option on the SIEGEL business reflect a clear acknowledgment that BSX
              cannot independently rebuild TAVR capability and sees MiRus as its re-entry vehicle. This dual role —
              strategic partner today, option holder tomorrow — means BSX is simultaneously validating MiRus and
              retaining the optionality to control or internalize the SIEGEL asset.

              Anteris Technologies is the most directly relevant new entrant. Its DurAVR balloon-expandable THV received
              FDA IDE approval in November 2025 for the PARADIGM pivotal trial (NCT07194265), which will randomize
              ~1,000 patients at 1:1 against commercial TAVR (SAPIEN/Evolut) across the US, Europe, and Canada. DurAVR
              uses a biomimetic single-piece ADAPT tissue design. PARADIGM and the MiRus STAR trial are running in
              parallel, meaning two pre-approval entrants are competing for investigational site access and enrollment
              simultaneously. JenaValve and JC Medical are also in FDA trials for aortic regurgitation indications; both
              were acquired by Edwards in 2024, pending FTC review of JenaValve, further concentrating Edwards' pipeline
              hold.

              The status quo substitute for TAVR remains surgical aortic valve replacement (SAVR), which retains
              guideline preference for patients under 65. SAVR is performed by cardiac surgeons at the same institutions
              and holds long-term durability data that no TAVR system can yet match. Non-operative watchful waiting is
              the default for asymptomatic patients, though the May 2025 FDA approval of SAPIEN for asymptomatic severe
              AS (based on EARLY TAVR data) is beginning to erode that default.
