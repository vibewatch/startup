      - number: '6.5'
        title: Expansion Path and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              MiRus faces pronounced concentration risk across both segments. In TAVR, the publicly confirmed customer
              engagement is dominated by Piedmont Heart Institute: it is the site of the EFS first cases (March 2025),
              the STAR first enrollment (April 2026), and the home institution of both the STAR trial co-chair
              (Thourani) and a national PI (Yadav). The clinical leadership structure creates a hub-and-spoke pattern in
              which Piedmont serves as the anchor site, with Cedars-Sinai as the second confirmed node. Loss of
              physician-champion support from either Yadav or Thourani would materially delay the STAR trial's
              primary-site enrollment momentum.


              The STAR trial's expected expansion to approximately 20 or more U.S. sites will broaden the institutional
              engagement, but the rate of site activation is not publicly disclosed and the registry had not listed
              additional sites as of the June 2026 run date. Commercial TAVR expansion after a potential PMA (likely
              2028–2029 at earliest given a 2026 enrollment start) would require institutional credentialing at several
              hundred sites (approximately 700 certified TAVR programs in the U.S. per STS/TVT Registry data) and would
              compete directly with Edwards and Medtronic for procedure room time, structural heart team training, and
              capital allocation. MiRus's 8 French sheath advantage and nickel-free status provide differentiated entry
              points, but commercial customer acquisition in structural heart is a multi-year, capital-intensive
              endeavor.


              For orthopedic/spine, concentration in the distributor network is entirely opaque. If a small number of
              distributors or regional reps drive the majority of revenue, departure of key distributors would be
              material. The lack of any named distribution partner limits independent evaluation of channel health.
              EUROPA® PCF's Breakthrough Device Designation and NTAP create a two-to-three year window for concentrated
              hospital adoption in the cervical space, but without a post-NTAP commercial strategy backed by visible
              accounts, long-term durability is unconfirmed.


              An important adverse context is that the precedent of major TAVR platforms failing after promising trial
              data exists: Boston Scientific's ACURATE Neo2 and ACURATE Prime platforms were withdrawn from the global
              market in late 2023 after failing to receive FDA approval, demonstrating that strong early feasibility and
              European commercial traction do not guarantee U.S. approval or commercial success. This risk is not
              specific to MiRus but is directly relevant to evaluating commercial customer runway contingent on STAR
              trial success and PMA.
