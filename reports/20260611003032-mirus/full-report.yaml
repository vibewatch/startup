      - number: '5.5'
        title: Differentiation, IP, and Competitive Positioning
        blocks:
          - type: paragraph
            body: >-
              MiRus's primary differentiation thesis across both business segments is the MoRe® alloy platform applied
              to device designs that cannot be replicated with titanium or cobalt chromium. In structural heart, the 8
              Fr delivery system (versus Edwards SAPIEN 3 Ultra and Medtronic Evolut FX, both requiring 14–16 Fr
              sheaths), the elimination of foreshortening, and the nickel-free construct represent product features that
              no currently approved TAVR device offers simultaneously. Boston Scientific's May 2026 investment press
              release explicitly validated these differentiators, noting that the Siegel 'may set it apart from
              currently available technology.' The $3 billion milestone-based option to acquire the TAVR business —
              contingent on clinical and regulatory milestones — further implies that a major strategic buyer places
              high option value on the technology differentiation. In spine, the lifetime limited warranty on MoRe® rod
              fracture is a direct commercial expression of confidence in the material, since rod fracture is a known
              complication in adult spinal deformity surgery. The Breakthrough Device Designation for EUROPA® PCF
              reflects FDA's assessment that the device offers potential substantial improvement over existing
              alternatives. With more than 100 patents covering the alloy and device designs (company-claimed), the IP
              moat is potentially broad, though specific patent numbers and expiry dates are not publicly disclosed. On
              the competitive landscape: J&J DePuy Synthes and Stryker spine use titanium and CoCr systems without
              proprietary alloy differentiation; Zimmer Biomet similarly relies on conventional alloys. No disclosed
              competitor is developing a MoRe-equivalent alloy. In TAVR, current commercial competition is Edwards
              (SAPIEN 3 Ultra, SAPIEN 3 Ultra RESILIA), Medtronic (Evolut FX, Evolut Pro+), and Abbott (Navitor), none
              of which uses an 8 Fr delivery system or claims nickel-free status.
            claimRefs:
              - CE038
