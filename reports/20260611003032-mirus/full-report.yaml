      - number: '3.2'
        title: Orthopedic and Spine Competitive Landscape
        blocks:
          - type: paragraph
            body: >-
              In spinal implants and devices, MiRus faces a concentrated market where three companies command the
              majority of global revenue. Medtronic holds the leading position across most major spine segments in 2024,
              including cervical fixation, thoracolumbar fixation, and interbody devices, supported by a broad portfolio
              spanning traditional fusion and motion preservation. DePuy Synthes (Johnson & Johnson) is the
              second-largest global spine competitor, with 2025 combined spine, sports, and other revenue of $2.8
              billion (down 2.5% year-over-year), holding strong positions in interbody devices, cervical fixation, and
              thoracolumbar fixation. Johnson & Johnson has announced strategic work to evaluate DePuy Synthes as a
              standalone orthopedic entity, which could reshape competitive dynamics and lead to different investment
              priorities.

              Stryker is undergoing a significant structural shift: after reporting only $185 million in spine revenue
              for full-year 2025, the company agreed in January 2025 to divest its US and France spinal implant business
              to Viscogliosi Brothers (VB Spine). Stryker is repositioning around enabling technology platforms
              including robotic navigation (Q Guidance System) and Balance ACS planning software, rather than commodity
              implants. This creates a partial competitive opening in implant categories but simultaneously raises the
              robotics and navigation bar that small implant players like MiRus must integrate with. Zimmer Biomet
              reported total 2025 sales of $8.2 billion and has not announced a spine divestiture, maintaining its
              position as a full-line orthopedic competitor with a strong knee and hip core. Its spine and extremity
              exposure is embedded in broader platforms and distributed through a large direct sales force.

              The global spinal implant and vertebral compression fracture (VCF) market reached $21.4 billion in 2024
              and is projected to grow to approximately $32 billion, per iData Research. Key growth drivers include
              minimally invasive surgery (MIS) workflow adoption, ASC migration, and robotics integration — all areas
              where incumbents are investing while MiRus competes on material science differentiation alone. Titanium
              and PEEK remain the dominant implant materials; proprietary alloys face a skeptical market conditioned by
              decades of competitor data. MiRus holds 24 FDA 510(k) clearances for spine and extremity implants,
              providing a commercial foothold, but publicly disclosed revenue and market share for its spine business
              are unavailable, making competitive position impossible to quantify from public sources.

              The relevant substitutes in spine are non-operative management (physical therapy, injections, bracing),
              existing titanium or PEEK implants from established vendors, and increasingly, biologic augmentation. The
              switching cost from a current spine surgeon's preferred vendor is high: proctoring, tray costs, OR
              familiarity, and field rep relationships all favor incumbents.
