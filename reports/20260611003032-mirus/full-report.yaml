      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Pre-approval binary — the defining valuation risk
            body: >-
              MiRus's implied $4.4 billion equity is entirely contingent on SIEGEL completing the STAR pivotal trial
              successfully and receiving FDA PMA approval. There is no revenue, no approval, and no committed
              acquisition today. Boston Scientific's discontinuation of the ACURATE neo2 and ACURATE Prime TAVR
              platforms in Q2 2025 after years of development demonstrates that even major-company TAVR programs can
              fail — and in that case a well-funded program destroyed substantial capital. A STAR endpoint failure would
              immediately eliminate the $3 billion BSX option and force a recapitalization at a substantially lower
              valuation. Any investor entering at or near the $4.4 billion post-money must price this binary explicitly.
            calloutType: risk
            claimRefs:
              - CV007
              - CV023
              - CV024
              - CV029
              - CV035
          - type: callout
            title: Recommendation — research-more with specific re-evaluation triggers
            body: >-
              The recommended position is research-more. Three triggers should prompt immediate re-evaluation: (1) STAR
              primary endpoint readout (go/no-go on the $3 billion option), (2) private financial disclosure from MiRus
              confirming orthopedic revenue, gross margin, and burn rate, and (3) cap-table transparency confirming
              co-investor economics in the BSX option exercise scenario. Without these, the $4.4 billion entry price
              cannot be fully underwritten from public evidence. The case for tracking MiRus closely is strong — the BSX
              validation signal is the highest-quality pre-approval endorsement available, and the orthopedic commercial
              platform provides a partial floor — but tracking does not require capital commitment at the current
              implied valuation.
            calloutType: recommendation
            claimRefs:
              - CV025
              - CV038
              - CV039
              - CV040
              - CV046
          - type: callout
            title: Revenue and financial metrics are not public — all figures are estimates
            body: >-
              MiRus does not publicly disclose revenue, ARR, gross margins, customer count, headcount, or historical
              fundraising amounts. Every financial estimate in this chapter — including orthopedic revenue ranges, TAVR
              market share scenarios, and implied comparable multiples — is derived from publicly available benchmarks
              for peer companies or from BSX press release disclosure of the deal economics. These estimates should not
              be treated as MiRus-provided figures and may differ materially from actual results.
            calloutType: assumption
            claimRefs:
              - CV025
              - CV034
              - CV038
