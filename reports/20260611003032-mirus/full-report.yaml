  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: MoRe Alloy Platform — Core Material Science
        blocks:
          - type: paragraph
            body: >-
              MiRus' entire product and technology strategy rests on MoRe®, a Molybdenum-47.5Rhenium (Mo-Re) binary
              alloy that the company first developed with inspiration from NASA rocket-engine material science and that
              the FDA cleared for use in medical implants in 2019. The alloy has been in development for over 15 years.
              The primary mechanical advantage is a combination of high yield strength, superior fatigue resistance, and
              minimal recoil compared with the two alloys that currently dominate the spinal implant market — titanium
              (Ti-6Al-4V) and cobalt chromium (Co-28Cr-6Mo). Critically, an in-vitro corrosion study published in Spine
              Journal (2023) measured metal ion release from MoRe® in both physiologic and inflammatory saline
              environments using ICP-MS methods. MoRe® stayed far below the FDA-permitted daily exposure (PDE) limits
              for molybdenum (1,900 μg/cm² day) and rhenium (4,400 μg/cm² day) throughout all tested intervals,
              including the inflammatory condition. The same study found that cobalt-chromium approached or exceeded its
              PDE for cobalt and vanadium under inflammatory conditions — a direct safety contrast. The alloy is
              nickel-free and cobalt-free. In the structural-heart context, MiRus uses a nitric oxide-coated rhenium
              frame for the Siegel TAVR, citing radial strength greater than cobalt or titanium. These material
              properties enable design choices that would be infeasible with legacy alloys: a 2.9 mm posterior cervical
              rod in EUROPA PCF (versus 3.5–4.0 mm for commercial equivalents), a 3 mm lumbar interbody insertion
              profile that expands to 16 mm, and an 8 French TAVR delivery system against the industry standard of
              roughly 14–16 French. The company claims more than 100 patents covering the alloy and derived device
              designs.
            claimRefs:
