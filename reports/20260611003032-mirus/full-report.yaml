      - number: '4.3'
        title: Unit economics, pricing benchmarks, and margin proxies
        blocks:
          - type: paragraph
            body: >-
              MiRus does not publicly disclose ASP, gross margin, or unit-level economics for its spine/orthopedic
              portfolio. Benchmarks from comparable spine and TAVR medtech companies provide the only public reference
              frame. For spine implants, the competitive landscape suggests per-procedure hardware ASPs of approximately
              $3,000–$15,000 depending on system complexity, with cervical and lumbar interbody fusion devices typically
              in the $5,000–$12,000 range. Top-tier spine manufacturers (Stryker, J&J DePuy Synthes, Zimmer Biomet)
              operate at gross margins of approximately 60–70% of product revenue; premium-material,
              higher-differentiation portfolios like MiRus' MoRe alloy systems could in principle command premium
              pricing if the clinical case for durability reduction in revision procedures gains hospital acceptance,
              but the realized ASP is a private-data gap. For TAVR, publicly reported reference points are more
              specific: Edwards Lifesciences' SAPIEN platform and Medtronic's Evolut system sell at approximately
              $25,000–$35,000 per valve, consistent with Edwards' FY2025 TAVR revenue of $4.5 billion across an
              estimated 150,000–200,000 annual procedures globally. CMS DRG reimbursement for an inpatient TAVR case
              (MS-DRG 266–267) typically ranges from $45,000–$60,000 per case, making the device cost the largest single
              component of the hospital episode. MiRus would price SIEGEL within or slightly above this range to be
              commercially viable; any premium over SAPIEN/Evolut ASP would need to be justified on clinical or access
              grounds. The 8-Fr delivery profile and nickel-free design position SIEGEL for premium pricing in specific
              patient segments (women, nickel-allergic patients) but whether payers will reimburse above the existing
              DRG without a new technology add-on payment path for TAVR (analogous to the NTAP awarded for EUROPA in
              spine) remains an open question.
