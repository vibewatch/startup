    MiRus is a private Marietta, Georgia medical-device company led by founder-CEO Jay Yadav. Its core asset is the MoRe
    molybdenum-rhenium platform, which underpins both a commercial orthopedic/spine implant portfolio with 24 FDA 510(k)
