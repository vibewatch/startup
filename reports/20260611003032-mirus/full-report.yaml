      - number: '5.7'
        title: Exhibits
        blocks:
          - type: callout
            title: 8 Fr TAVR delivery — structural break vs. competitors
            body: >-
              The Siegel TAVR's 8 French delivery sheath is approximately 50% smaller than current commercially
              available TAVR systems. This is not an incremental improvement but a structural design break enabled by
              the rhenium alloy's radial strength-to-gauge ratio. At 30-day follow-up across 20 patients (FIH + EFS),
              zero vascular complications were recorded. The small-profile advantage is particularly relevant for the
              estimated 30–40% of TAVR patients who are women, for patients with peripheral artery disease, and for any
              expansion of TAVR into younger lower-risk populations where long-term vascular safety matters more.
            calloutType: strength
            claimRefs:
              - CE019
              - CE024
              - CE026
              - CE027
          - type: callout
            title: SIEGEL clinical evidence base is thin ahead of STAR
            body: >-
              The strongest near-term technical risk for MiRus's enterprise value driver is the reliance on just 20
              patients (n=5 FIH plus n=15 EFS) of short-term (30-day) follow-up data to support a $3 billion option and
              the broader TAVR narrative. The STAR trial is the definitive gate. STAR needs to enroll 1,025 patients and
              follow them for at least one year, meaning primary data readout is realistically late 2027 at earliest
              from April 2026 enrollment. PMA filing and subsequent FDA review add further delay. Long-term TAVR
              outcomes including structural valve deterioration, paravalvular leak durability, and pacemaker rates over
              5–10 years are entirely unknown.
            calloutType: risk
            claimRefs:
              - CE026
              - CE027
              - CE030
              - CE045
              - CE046
          - type: callout
            title: BSX's $3B TAVR option price implies a validation floor and a residual risk
            body: >-
              Boston Scientific's exclusive option to acquire MiRus's TAVR business for an additional $3 billion (on top
              of its $1.5 billion equity investment) after clinical and regulatory milestones is simultaneously
              confirmatory and cautionary. It confirms that a leading cardiovascular strategic values the Siegel
              technology differentiation highly enough to pay a premium for the option. It is cautionary because the
              option is conditional — it is exercisable only after MiRus achieves specific milestones that Boston
              Scientific has not yet committed to fund. The $3B option price is itself contingent; it does not represent
              a guaranteed enterprise event.
            calloutType: insight
            claimRefs:
              - CE039
              - CE040
              - CE041
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Buyer / User / Payer Architecture
        blocks:
          - type: paragraph
            body: >-
              MiRus serves two structurally distinct customer populations that differ in buyer identity, proof of
              adoption, payment mechanism, and risk profile. In the TAVR segment, the "customer" is a hospital
              structural heart program and its team of credentialed interventional cardiologists and cardiac surgeons.
              Currently no commercial TAVR transaction exists anywhere in the world: the Siegel device is an
              investigational device exempt (IDE) product, and the only authorized end-users are clinical investigators
              enrolled in the IDE-approved EFS and STAR pivotal trial. Investigational device use is sponsored by MiRus,
              reimbursed under CMS Coverage with Evidence Development (CED) rules, and does not involve hospital
              procurement, formulary review, or supply-chain contracts. CMS approved the STAR trial under CED on March
              27, 2026, and the EFS was approved March 28, 2025. The MiRus TAVR "customer" today is therefore a named
              clinical investigator at a named trial site — a clinical partner, not a paying commercial account.


              In the orthopedic and spine segment, the buyer is a hospital, ambulatory surgery center (ASC), or private
              surgery practice that purchases implant systems through MiRus's distributor network. End users are spine
              and orthopedic surgeons. The payer is typically a private insurer or Medicare/Medicaid, with procedure
              reimbursement flowing to the facility. The EUROPA® PCF system received a CMS New Technology Add-on Payment
              (NTAP) effective FY2026 (announced August 2025), providing an incremental per-case add-on payment for
              hospitals that adopt the product — a meaningful adoption incentive for the PCF, though NTAP is typically
              limited to two to three years. No revenue figures, customer counts, account names, or contract structures
              for the orthopedic/spine business have been publicly disclosed. The company's distributor page collects
              inquiries but does not name existing partners.
