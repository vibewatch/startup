  - id: FE002
    title: Siegel TAVR clinical workflow
    type: flow
    layout: wide
    summary: >-
      The Siegel TAVR procedure follows the standard TAVR workflow but with an 8 Fr femoral access step that enables
      broader patient eligibility and next-day discharge.
    data:
      nodes:
        - label: Patient screening
          type: source
          note: Severe symptomatic aortic stenosis; low/intermediate/high surgical risk; femoral anatomy assessed.
        - label: Heart team planning
          type: process
          note: Structural heart team (interventional cardiologist + cardiac surgeon) review CT, echo, access anatomy.
        - label: Femoral access — 8 Fr sheath
          type: process
          note: 8 Fr expandable sheath (vs 14–16 Fr for current commercial valves). Smaller incision; less vascular risk.
        - label: Valve delivery — no foreshortening
          type: process
          note: >-
            Open-cell frame eliminates foreshortening; intrinsic commissural alignment. Precise deployment on first
            pass.
        - label: Balloon expansion
          type: process
          note: Pre-mounted valve on balloon expands frame. All 3 sizes (23/26/29 mm) through same 8 Fr sheath.
        - label: Hemodynamic confirmation
          type: process
          note: 'Echo core lab: EFS data showed mean gradient 6.3 mmHg, AVA 2.8 cm². Zero PVL in EFS n=15.'
        - label: Closure + next-day discharge
          type: output
          note: EFS patients discharged next day without complications. Lower vascular trauma consistent with small sheath.
      edges:
        - from: Patient screening
          to: Heart team planning
        - from: Heart team planning
          to: Femoral access — 8 Fr sheath
        - from: Femoral access — 8 Fr sheath
          to: Valve delivery — no foreshortening
        - from: Valve delivery — no foreshortening
          to: Balloon expansion
        - from: Balloon expansion
          to: Hemodynamic confirmation
        - from: Hemodynamic confirmation
          to: Closure + next-day discharge
    claimRefs:
      - CE019
      - CE021
      - CE022
      - CE024
      - CE027
      - CE028
