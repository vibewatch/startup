  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The MiRus investment thesis rests on three reinforcing pillars. First, the MoRe alloy platform creates a
              structurally differentiated material base—24 FDA 510(k)-cleared orthopedic devices and a nickel-free,
              corrosion-resistant structural-heart valve share the same proprietary alloy, giving MiRus a patent-moat
              argument that neither pure spine players nor TAVR incumbents can easily replicate. Second, the SIEGEL TAVR
              system addresses a real large-market need: the global TAVR market was $6.8 billion in 2024 and is growing
              at 6.6% CAGR toward approximately $9.9 billion by 2030, with Edwards controlling roughly 60–70% of U.S.
              volume; any durable new entrant capturing 3–5% share in a $10 billion market represents a $300–500 million
              annual revenue opportunity at prevailing TAVR ASPs of $25,000–$35,000. Third, Boston Scientific's $1.5
              billion investment is not simply passive capital—it is a strategic validation signal from the world's
              second-largest cardiovascular medtech company, which has reviewed MiRus's proprietary data room and
              concluded that SIEGEL warrants a nine-figure bet plus a $3 billion option. That option structure is itself
              the most bullish element: if BSX exercises, the aggregate consideration implies a TAVR-business-only
              valuation above $3 billion post-approval, which is credible relative to Edwards's TAVR revenue multiple of
              approximately 10–12x annual TAVR revenue on its public market cap.

              The anti-thesis is equally serious. MiRus's $4.4 billion implied equity is entirely pre-approval: SIEGEL
              is in a 1,025-patient pivotal trial and is not approved for commercial sale in any country. The STAR
              trial's 1-year primary composite endpoint means the earliest plausible PMA submission is mid-2027 and the
              earliest approval is late-2027 to 2029 under an optimistic regulatory timeline. Boston Scientific's own
              track record is cautionary: it discontinued the ACURATE neo2 and ACURATE Prime TAVR platforms in Q2 2025
              after spending approximately $200 million annually (≈$50 million per quarter globally) on a program that
              failed to gain FDA approval, demonstrating that even well-capitalized incumbents can suffer binary TAVR
              regulatory failures. Revenue, ARR, gross margin, customer count, and historical fundraising are all
              non-public, preventing independent underwriting. The $3 billion BSX option is not a committed obligation—
              BSX retains the right but not the obligation to exercise—and if STAR misses its endpoint, the option
              lapses and MiRus would face a recapitalization event for the TAVR program at a likely substantial discount
              to the current implied valuation. The orthopedic commercial business provides a partial floor but, at peer
              multiples, is unlikely to support anywhere near a $4.4 billion standalone valuation without TAVR upside.
