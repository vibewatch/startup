      - number: '6.3'
        title: Orthopedic and Spine Commercial Customer Base
        blocks:
          - type: paragraph
            body: >-
              MiRus's orthopedic and spine products are commercially marketed through independent sales representatives
              and a distributor network. The company's distributor page invites prospective distribution partners to
              register but does not list existing distributor names or territories. No public-facing customer case
              study, hospital deployment announcement, surgeon testimonial, or purchasing agreement has been identified
              for any of the 24 FDA-cleared spine and orthopedic products. This is consistent with early-stage
              small-device company practice of relying on distributor-driven, surgeon-to-surgeon networks where deal
              flow is private and institutional contracts are rarely announced.


              The EUROPA® PCF system with NTAP designation (CMS FY2026) provides the best public signal of
              hospital-level adoption incentive: the NTAP creates a direct economic benefit for hospitals that implant
              the device during the NTAP window (FY2026, with potential extension subject to CMS renewal). This would be
              expected to ease hospital formulary approval and accelerate initial commercial accounts. However, no
              hospitals receiving NTAP payments for EUROPA® PCF are publicly disclosed.


              The GALILEO™ Spine Alignment Monitoring System creates potential workflow stickiness for hospital and ASC
              customers that adopt it alongside the EUROPA® instrumentation, since procedural-planning-tool integration
              increases switching costs. Similarly, the lifetime limited warranty on MoRe® rod fracture is a
              differentiated commercial message for spine programs with high deformity surgery volume. Neither
              product-level stickiness factor has been linked to any confirmed named customer in the public record.


              The practical diligence gap is significant: without named commercial accounts, revenue figures,
              utilization rates, or distributor identities, it is impossible to assess the commercial depth, durability,
              or concentration of the spine/ortho business. MiRus's 250%+ revenue growth claim (Atlanta Business
              Chronicle, 2022) is the only public growth signal for the company as a whole, but it is stale and does not
              isolate the spine/ortho segment.
