  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Scope
        blocks:
          - type: paragraph
            body: >-
              MiRus competes in two adjoining segments that share a material-science foundation but have distinct
              regulatory, reimbursement, and buyer architectures. The structural heart segment encompasses all
              transcatheter and surgical aortic valve replacement (TAVR and SAVR) procedures, associated delivery and
              imaging systems, and structural-heart service-line infrastructure at qualified hospitals. Excluded from
              this boundary are coronary-artery devices, cardiac rhythm management, mitral and tricuspid interventions
              (though MiRus has an option for those via the Boston Scientific agreement), and non-cardiac vascular
              procedures. The orthopedic and spine segment encompasses fusion implants (interbody cages, pedicle screws,
              rods), motion-preserving devices, extremity implants, and adjacent procedural tools where MiRus holds FDA
              510(k) clearances. Excluded are large-joint arthroplasty (hip, knee), sports medicine, orthobiologics, and
              robotics-assisted surgery platforms that MiRus does not currently sell. The status-quo substitutes differ
              sharply by segment: for structural heart, surgical aortic valve replacement (SAVR) and watchful waiting
              remain the clinical default for many patient populations; for spine, non-operative management (physical
              therapy, steroid injections) and existing metal-alloy cages from incumbents are the base case. The common
              thread is that MiRus's MoRe molybdenum-rhenium alloy replaces conventional materials (cobalt-chromium,
              nitinol, titanium) in both product families, which is the key differentiation claim but also a hurdle
              given surgeon familiarity with incumbent alloys. Adjacent spend areas include structural heart imaging
              (echo, CT), robotic spine navigation, and post-TAVR monitoring, none of which MiRus currently addresses
              but which influence overall hospital budget allocation and capital committee decisions.
            claimRefs:
              - CM001
              - CM002
              - CM003
