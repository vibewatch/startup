      - number: '1.3'
        title: Capital structure and strategic transaction
        blocks:
          - type: paragraph
            body: >-
              The defining company-overview fact is Boston Scientific's May 18, 2026 strategic investment. Boston
              Scientific disclosed a $1.5 billion investment for approximately 34% equity in MiRus, which implies an
              equity value a little above $4.4 billion. The agreement is not a plain minority growth round: Boston
              Scientific also received an exclusive option to acquire the MiRus TAVR business for additional aggregate
              cash payments totaling $3 billion after specified clinical and regulatory milestones, plus a further
              option on mitral and tricuspid valve assets. This structure is simultaneously validating and cautionary.
              It validates MiRus because one of the world's largest cardiovascular strategics committed very large
              capital before approval. It is cautionary because the headline enterprise narrative still depends on
              milestones that have not yet been achieved, and Boston Scientific's full-control outcome is optional
              rather than committed today. Third-party coverage from Fierce Biotech, MedTech Dive, Nasdaq, and Quartz
              aligns on the basic economics and reinforces that the heart-valve program is the value driver behind the
              financing event.
