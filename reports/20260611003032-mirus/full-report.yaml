      - number: '5.4'
        title: Manufacturing, Deployment, and Clinical Workflow
        blocks:
          - type: paragraph
            body: >-
              MiRus operates an internal manufacturing base in Marietta, Georgia. The company's 2021 founder profile
              referenced approximately 70,000 square feet of manufacturing space after a 50,000 sq ft expansion added to
              an existing 20,000 sq ft facility. Job postings as of 2025–2026 show that MiRus has in-house
              cardiovascular tissue processors (for the porcine pericardial leaflets in Siegel) and manufacturing
              associates for orthopedic implants, confirming vertical integration for both product lines. The company
              also maintains an in-house TAVR clinical research team — including in-house Clinical Research Associates,
              cardiology nurses, and field clinical specialists — that operationally supports the EFS and STAR trial.
              For spine and orthopedic products, the commercial model uses a distributor network; MiRus carries a
              distributor page and EXPECT MoRe® educational series for surgeon training. GALILEO™, MiRus's procedural
              solutions suite, spans three modules: GALILEO™ Surgical Planning, GALILEO™ Spine Alignment Monitoring
              System (intraoperative), and GALILEO™ Remote Physiologic Monitoring for post-operative surveillance. The
              VITESSE™ Pedicle Screw Insertion System rounds out procedural tools for spine. For structural heart, the
              TAVR clinical workflow requires a dedicated structural heart team (interventional cardiologist and cardiac
              surgeon), a catheterization lab with fluoroscopic guidance, and appropriate vascular access preparation.
              EFS data indicate that patients treated with the Siegel 8 Fr system were discharged next day without
              complications, consistent with the low-access-site-trauma profile that the smaller sheath diameter is
              designed to achieve. Manufacturing for TAVR tissue valves involves separate tissue-processing operations
              from metal implant manufacturing; MiRus's in-house tissue processing capability is documented through job
              postings rather than regulatory filings, and the precise scale is not publicly disclosed.
