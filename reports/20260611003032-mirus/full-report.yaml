  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and business model
        blocks:
          - type: paragraph
            body: >-
              MiRus presents itself as a medical-technology company building proprietary biomaterials, implants,
              procedural solutions, and monitoring capabilities for cardiovascular and orthopedic disease. The company
              website, about page, and technology materials all center the MoRe alloy platform—MiRus' molybdenum-rhenium
              material base—as the common technical thread across spine, extremity, and structural-heart products. The
              public contact footprint places the company in Marietta, Georgia, while Boston Scientific's May 2026
              investment announcement refers to MiRus' Atlanta-based team; for diligence purposes the supportable
              conclusion is that MiRus is a metro-Atlanta company with operating addresses in Marietta. The business is
              clearly beyond concept stage in orthopedics because the company has multiple FDA-cleared spine and
              extremity products, manufacturing space, a commercial organization, and open operations roles. At the same
              time, its structural-heart program remains investigational: the SIEGEL balloon-expandable TAVR system is
              in a pivotal trial and is not approved for commercial distribution in any country. That mix makes MiRus a
              hybrid company—commercial in spine/orthopedics, clinical-stage in TAVR, and newly recapitalized by a
              strategic investor around the structural-heart upside.
