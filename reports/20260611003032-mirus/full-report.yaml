      - number: '1.2'
        title: Leadership and operator profile
        blocks:
          - type: paragraph
            body: >-
              Official MiRus leadership pages identify Jay Yadav, MD as founder and CEO, not Tom Eichmann. That
              discrepancy matters because the founder-led story is central to MiRus' public narrative. Yadav is an
              interventional cardiologist whose prior exits include CardioMEMS to St. Jude/Abbott and Angioguard to
              Johnson & Johnson; MiRus also credits him as first investor and director of SMART Therapeutics, later
              acquired by Boston Scientific. The rest of the disclosed operating bench is meaningful for a private
              company of MiRus' size: Noah Roth is COO and is tied to MoRe alloy development, Mahesh Krishnan leads
              commercialization, David Toney has been CFO since 2022, Jordan Bauman runs quality and regulatory affairs
              with experience in 510(k), IDE, and PMA pathways, and Pam Cowart brings long cardiovascular
              clinical-affairs experience from CardioMEMS. The public team pages therefore show founder-market fit in
              cardiovascular devices plus a practical bench for orthopedic commercialization and heart-valve trial
              execution. The key-person caveat is that much of MiRus' external credibility still runs through Yadav
              personally, including the company origin story, investor messaging, prior-exit halo, and structural-heart
              vision.
