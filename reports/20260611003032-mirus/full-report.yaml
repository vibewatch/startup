      - number: '7.5'
        title: Financial Opacity, Execution Risk, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              MiRus operates as a private company with no publicly disclosed financial statements. Revenue, gross
              margin, operating expenses, cash burn, or capital adequacy for either the TAVR or orthopedic/spine
              businesses are unknown. The implied post-money valuation from BSX's $1.5B for 34% equals approximately
              $4.4B — a figure that requires either substantial orthopedic revenue generation or a high probability of
              TAVR option exercise to be justified on a fundamental basis. Without disclosed financials, investors
              cannot independently assess the capital adequacy needed to complete STAR (typically $80–200M for a
              1,025-patient Class III device RCT inclusive of site activation, coordination, adjudication, and
              regulatory submission costs), nor evaluate whether the $1.5B injection is sufficient runway to data lock
              without additional dilutive financing.


              The orthopedic/spine business provides a potential revenue bridge, but its scale is entirely undisclosed.
              No revenue figures, distributor identities, account concentration, or margin data have been published for
              EUROPA, RIGEL, IO Expandable, or Atlas Wedge products. The NTAP designation provides a time-limited
              commercial incentive for hospital adoption of the EUROPA PCF system, but NTAP programs typically expire in
              two to three fiscal years — a window that may elapse before the TAVR program reaches PMA decision. If
              orthopedic/spine revenue is insufficient to fund operations and the BSX option is not exercised, MiRus
              faces a capital gap at the most capital-intensive phase of its development.


              Execution risk is compounded by leadership concentration. Jay S. Yadav, MD/PhD, is the sole publicly named
              executive; no CFO, CMO, Chief Operating Officer, or Head of Regulatory Affairs has been publicly
              identified. Scaling a 1,025-patient RCT at 20+ sites while simultaneously operating a commercial
              orthopedic/spine business requires deep operational management bench strength. The absence of disclosed
              executive leadership makes it impossible to assess organizational resilience or succession planning.


              Thesis-break triggers — events that would structurally invalidate the investment thesis — include: (1)
              STAR trial primary endpoint failure or a major safety signal (Siegel-associated death, stroke, or
              permanent pacemaker rate exceeding comparator thresholds); (2) BSX electing not to exercise its TAVR
              option following a trial milestone miss; (3) FDA issuing a non-approvable letter or requiring additional
              studies post-STAR; (4) a rhenium supply disruption or regulatory action forcing product recall; and (5) a
              significant adverse event or FDA enforcement action against MiRus or its manufacturing sites. None of
              these are considered probable in isolation, but each is independently sufficient to materially impair or
              eliminate investment value.
