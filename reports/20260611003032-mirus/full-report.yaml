      - number: '2.2'
        title: Market Sizing — Multiple Lenses
        blocks:
          - type: paragraph
            body: >-
              No single authoritative source provides a simultaneously reliable structural heart and spine market size
              for MiRus's specific addressable population, so the analysis uses multiple lenses that must be reconciled
              rather than averaged. For structural heart, Grand View Research estimated the global TAVR market at USD
              6.8 billion in 2024, projecting 6.6% CAGR to approximately USD 9.9 billion by 2030. North America accounts
              for roughly 50% or more of global TAVR revenue based on procedure-volume concentration data, implying a
              US-Canada addressable of roughly USD 3.4 to 4.5 billion. This estimate is materially uncertain because no
              public source provides a reliable standalone US TAVR revenue figure independent of combined structural
              heart program reporting. A second lens uses procedure volume: with approximately 90,000 to 130,000 annual
              US TAVR procedures (range based on TVT Registry and academic reports through 2023) and mean device cost of
              roughly USD 30,000 to 35,000, a bottom-up estimate yields USD 2.7 billion to USD 4.6 billion, broadly
              consistent with the GVR top-down figure. For spinal implants, Grand View Research estimated the global
              market at USD 13.9 billion in 2024, growing to USD 23.1 billion by 2033 at 6.0% CAGR; North America
              represented 47.8% of this total, implying approximately USD 6.6 billion in 2024 for the US-Canada segment.
              MiRus currently lacks publicly disclosed revenue for its spine portfolio, preventing calculation of
              current market share. Conflicting estimates persist: multiple analyst reports—including projections from
              iData Research, Emergen Research, and Grand View Research—use different base years, procedure definitions,
              and geographies, generating spread of USD 11.8 billion to USD 14.3 billion for the 2024 global spine
              market and CAGR ranges of 5% to 6.1% through 2032-2033. Both figures should be treated as
              order-of-magnitude anchors, not investment-grade inputs, for the MiRus diligence.
