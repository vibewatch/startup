              primary sources in Kazakhstan, Canada, and Chile. Rhenium prices rose 33% between 2020 and 2024. MiRus has
              not disclosed any rhenium supply agreements, pricing hedges, or inventory buffer. A supply disruption
              would simultaneously affect TAVR valve production and orthopedic implant manufacturing — creating a
