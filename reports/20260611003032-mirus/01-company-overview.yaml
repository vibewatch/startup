company:
  name: MiRus
chapter:
  number: 1
  title: Company Overview
  summary: MiRus is a Marietta/Atlanta-area medical device company led by founder-CEO Jay Yadav that combines a commercial orthopedic/spine implant portfolio with an investigational structural-heart program. Public evidence shows 24 FDA 510(k) clearances for its orthopedic platform, a proprietary molybdenum-rhenium technology base, and a step-change financing event on May 18, 2026 when Boston Scientific invested $1.5 billion for about 34% of the company, implying an equity value near $4.4 billion. The same agreement gave Boston Scientific an option to buy MiRus' TAVR business for another $3 billion after clinical and regulatory milestones, which validates the technology while also underscoring that the heart-valve program remains pre-approval and milestone dependent.
sections:
- id: identity-stage-and-business-model
  title: Identity, stage, and business model
  body: 'MiRus presents itself as a medical-technology company building proprietary biomaterials, implants, procedural solutions, and monitoring capabilities for cardiovascular and orthopedic disease. The company website, about page, and technology materials all center the MoRe alloy platform—MiRus'' molybdenum-rhenium material base—as the common technical thread across spine, extremity, and structural-heart products. The public contact footprint places the company in Marietta, Georgia, while Boston Scientific''s May 2026 investment announcement refers to MiRus'' Atlanta-based team; for diligence purposes the supportable conclusion is that MiRus is a metro-Atlanta company with operating addresses in Marietta. The business is clearly beyond concept stage in orthopedics because the company has multiple FDA-cleared spine and extremity products, manufacturing space, a commercial organization, and open operations roles. At the same time, its structural-heart program remains investigational: the
    SIEGEL balloon-expandable TAVR system is in a pivotal trial and is not approved for commercial distribution in any country. That mix makes MiRus a hybrid company—commercial in spine/orthopedics, clinical-stage in TAVR, and newly recapitalized by a strategic investor around the structural-heart upside.'
