- id: milestones-products-and-disclosure-gaps
  title: Milestones, product proof, and disclosure gaps
  body: 'MiRus'' public milestone trail is now coherent enough to support a chronology. Founder materials published in 2021 described expanded Marietta manufacturing capacity, more than 100 patents, and decades of background work on the alloy platform. Orthopedic commercialization is evidenced by repeated FDA 510(k) clearances, including the 3DR lateral lumbar interbody fusion system with integrated plate fixation in 2023 and multiple earlier EUROPA, IO, and CYGNUS-family devices in the openFDA record. Structural-heart milestones accelerated later: first-in-human SIEGEL data were presented in June 2024, U.S. early-feasibility cases were reported in March 2025, 30-day EFS results were highlighted later in 2025, unconditional FDA approval for the STAR pivotal trial was announced in early 2026, and Boston Scientific''s investment landed in May 2026. The missing metrics are still substantial. Public sources do not disclose revenue, customer count, headcount, cumulative historical financing before
    the Boston Scientific deal, or a clean split between orthopedic revenue and TAVR burn. MiRus is therefore no longer a hidden company, but it is still only partially disclosed as an operating business.'
