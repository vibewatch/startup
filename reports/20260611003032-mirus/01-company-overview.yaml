callouts:
- calloutType: insight
  title: The financing event is a strategic option, not just growth capital
  body: Boston Scientific paid a minority-equity price large enough to define MiRus publicly, but its path to full control still depends on clinical and regulatory milestones. That means the headline value is real while the final ownership outcome remains contingent.
  claimRefs:
  - CO007
  - CO009
  - CO010
  - CO036
- calloutType: risk
  title: Founder-led credibility is an asset and a concentration risk
  body: Jay Yadav’s prior exits and technical story explain much of MiRus’ public credibility. They also mean the company’s external narrative, strategic relationships, and product vision remain unusually tied to one individual.
  claimRefs:
  - CO004
  - CO023
  - CO039
