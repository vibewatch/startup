- id: capability-comparison-and-differentiation-analysis
  title: Capability Comparison and Differentiation Analysis
  body: >-
    In TAVR, MiRus differentiates SIEGEL through three primary technical claims: an 8-French
    transfemoral access sheath (the company describes this as smaller than competing platforms),
    a nickel-free and cobalt-free rhenium alloy frame that the company argues reduces
    hypersensitivity risk and improves fatigue performance, and the absence of foreshortening
    during deployment that the company claims enables more precise positioning. SAPIEN 3 uses a
    cobalt-chromium frame delivered via a 14-French equivalent Commander delivery system. Evolut FX
    uses a nitinol (nickel-titanium) self-expanding frame via a 14-French InLine sheath. Abbott
    Navitor describes its FlexNav delivery system as having the largest valve in the smallest
    delivery system at that size range.

    On measured hemodynamic performance, the SIEGEL 30-day EFS data (15 patients, five US centers)
    showed a mean gradient of 6.3 mmHg and valve area of 2.8 cm². By comparison, Navitor's
    approval data reported a mean gradient of 7.4 mmHg and EOA of 2.0 cm². These comparisons are
    not head-to-head and involve different populations, different follow-up windows, and different
    imaging protocols; they should not be treated as evidence of superiority. SIEGEL's clinical
    dataset is 15 patients at 30 days; SAPIEN 3 and Evolut FX are supported by years of post-market
    data from registries containing hundreds of thousands of procedures. The asymmetry in evidence
    depth is the most important near-term competitive disadvantage for MiRus.

    In spine, SIEGEL's alloy differentiation is replicated by the MoRe alloy across the orthopedic
    platform. Titanium-alloy and PEEK interbody cages from Medtronic, DePuy, and Stryker dominate
    because surgeons, hospitals, and payers have decades of outcome data. MiRus's MoRe alloy
    claims high yield strength, fatigue resistance, and MRI compatibility improvements, but
    published long-term comparative outcomes data in spine remains limited. This creates a
    credibility gap that must be closed with surgeon-level clinical adoption and independent
    published data.

    For pricing and packaging, TAVR device pricing at US hospital centers is not publicly disclosed
    by any manufacturer. Market reports estimate TAVR system costs at approximately $30,000–$35,000
    per procedure; this is consistent with a bottom-up US market size estimate of $2.7–$4.6 billion
    at 90,000–130,000 annual procedures. MiRus pricing is entirely unknown since SIEGEL is
    currently an investigational device with no commercial price list. Spine implant pricing from
    incumbents is similarly negotiated bilaterally and not publicly disclosed; MiRus does not
    disclose list prices for its commercial spine portfolio.
