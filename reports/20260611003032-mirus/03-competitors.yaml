- id: distribution-switching-costs-and-lock-in
  title: Distribution, Switching Costs, and Lock-In
  body: >-
    TAVR operator and institutional relationships are the primary moat protecting Edwards and
    Medtronic. Multi-society credentialing requirements (AATS/ACC/SCAI/STS) mandate that TAVR
    programs maintain specific procedural volumes and operator training standards; programs that
    have built training infrastructure around one platform's proctoring, simulators, and field
    support face material switching costs. Edwards operates the Edwards Learning Network providing
    structured training, case support, and online modules; Medtronic offers equivalent training
    infrastructure. Both companies also provide comprehensive reimbursement support desks, CT
    planning tools, and dedicated structural heart service-line resources — infrastructure that
    MiRus cannot match at its current scale.

    Hospital capital committee decisions integrate device approval into multi-year service-line
    contracts that often include bundled pricing across a company's larger portfolio. For a health
    system that relies on Medtronic for CRM, neuromodulation, and spine navigation, resisting
    Medtronic's TAVR bundling pressure is difficult. The same applies to Edwards, whose structural
    heart program extends into mitral and tricuspid territory. These cross-portfolio relationships
    create soft-dollar switching costs invisible to any per-device price comparison.

    For spine, the OR relationship is centered on the field sales representative who manages trays,
    provides intraoperative guidance, and maintains surgeon preferences. Changing implant vendors
    requires training, tray restocking (a material hidden cost), and rebuilding OR staff familiarity.
    ASC migration is shifting some purchasing toward cost-first procurement, which could partially
    benefit a differentiated material science entrant like MiRus that can compete on total
    implant-level value, but the rep-driven model still dominates hospital spine procurement.

    Multi-homing — using both SAPIEN and Evolut depending on anatomy — is already common practice
    at high-volume TAVR centers. Most large programs maintain access to both platforms. This
    suggests that a center can add SIEGEL without abandoning incumbents, which is favorable for
    MiRus adoption post-approval. However, it also means centers have little urgency to exclusively
    commit to SIEGEL, limiting MiRus's ability to command preferred vendor status in the near term.
  claimRefs:
  - CP024
  - CP025
  - CP028
  - CP037

- id: moat-durability-and-displacement-risk
  title: Moat Durability and Displacement Risk
  body: >-
    The adverse evidence pattern in TAVR is stark. Boston Scientific's full TAVR exit — after
    acquiring Symetis for $435 million in 2017 and spending years pursuing FDA approval for both
    Lotus Edge (discontinued 2020) and Acurate neo2 (discontinued 2025) — is the clearest
    available signal of how hard it is to displace Edwards and Medtronic. BSX is one of the world's
    largest medtech companies by revenue and failed at TAVR twice. The Acurate IDE trial failure,
    where approximately 21.6% of valves were under-expanded due to operator inexperience at less
    experienced centers, illustrates that procedural complexity and training investment are not
    easily transferred. MiRus SIEGEL's 8-French low-profile design may mitigate some deployment
    complexity, but the principle stands: TAVR adoption for new systems is structurally gated by
    operator trust, institutional credentialing, and comparative outcomes data that only accumulate
    over years.

    Medtronic continues to invest in its platform. The Evolut FX+ is an incremental advance with
    updated deployment features. The SMART trial five-year results are still pending and may further
    support Medtronic's differentiation in the small-annulus patient segment. Edwards' 7-year
    PARTNER 3 data and its acquisition of JenaValve and JC Medical position it to expand into
    aortic regurgitation — adjacent indications where MiRus does not yet have data. These
    incumbent innovation vectors mean the competitive gap does not stand still.

    For MiRus, the $3 billion BSX call option is simultaneously the most validating and most
    threatening structural feature. If BSX exercises the option, MiRus TAVR ceases to be an
    independent business — its distribution, commercialization, and strategic direction pass to a
    large incumbent. This is not inherently adverse (BSX has superior commercial reach), but it
    changes the risk profile for investors betting on MiRus as an independent structural heart
    company. If BSX declines the option, MiRus must build its own TAVR commercial infrastructure
    from scratch — field hiring, hospital contracting, training programs, reimbursement support —
    against two entrenched competitors with decades of institutional relationships.

    In spine, moat durability for MiRus depends on its ability to generate surgeon-level outcomes
    data that justifies the unfamiliar alloy and builds clinical trust over time. Stryker's implant
    divestiture and JnJ's potential DePuy spinoff create organizational disruption among the top
    three, but disruption does not automatically benefit a small player. The winners from large
    competitor reorganizations are typically well-funded mid-tier companies with established sales
    forces — not early-stage entrants with limited public clinical evidence.
