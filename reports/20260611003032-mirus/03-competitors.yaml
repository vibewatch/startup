  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: MiRus spine position
    missingEvidence: >-
      MiRus spine implant revenue, unit volumes, hospital customer count, and surgeon adoption
      rate for the MoRe alloy portfolio are not disclosed in any public source.
    whyItMatters: >-
      Without commercial traction data for spine, it is impossible to assess whether MiRus's
      orthopedic business provides meaningful capital for the TAVR program or represents a
      viable standalone commercial asset.
    diligencePath: >-
      Request internal revenue breakdown by product line (spine vs. extremity vs. TAVR-related),
      growth rate, gross margin, and top-10 customer hospital names and volumes.
    relatedQuestionRefs:
    - QP020

  - type: missing-source
    severity: material
    topic: SIEGEL vs. incumbent hemodynamics
    missingEvidence: >-
      No published head-to-head hemodynamic or clinical comparison between SIEGEL and any
      currently approved TAVR system exists; all comparisons are cross-trial and non-randomized.
    whyItMatters: >-
      MiRus's commercial thesis depends partly on SIEGEL's hemodynamic superiority claims;
      these cannot be validated until STAR trial 1-year primary endpoint data are published.
    diligencePath: >-
      Monitor STAR trial completion timeline and publication of 1-year primary endpoint;
      seek core-lab echocardiographic data from ongoing enrollment.
    relatedQuestionRefs:
    - QP009

  - type: missing-source
    severity: material
    topic: MoRe alloy spine outcomes
    missingEvidence: >-
      No peer-reviewed comparative outcomes study for MoRe alloy spinal implants vs. titanium
      or PEEK in a matched surgical population was identified in public literature searches.
    whyItMatters: >-
      Surgeon adoption of novel alloy implants requires published outcomes evidence; absence of
      data limits MiRus's ability to differentiate beyond company-claimed material properties.
    diligencePath: >-
      Request any unpublished surgeon registry data or clinical case series from MiRus; check
      for pending publications from MiRus-affiliated spine surgeons.
    relatedQuestionRefs:
    - QP023

  - type: private-evidence-only
    severity: material
    topic: MiRus commercial build plan
    missingEvidence: >-
      MiRus's post-approval TAVR commercialization plan — including whether BSX distribution
      rights would activate and on what terms — is not publicly disclosed.
    whyItMatters: >-
      If BSX declines the call option, MiRus must build a TAVR commercial infrastructure
      independently; the cost and timeline of that build is a critical diligence input.
    diligencePath: >-
      Require MiRus management to present the option exercise scenario, standalone commercial
      plan, and capital requirements for each path.
