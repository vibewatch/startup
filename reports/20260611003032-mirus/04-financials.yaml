- id: financial-verdict
  title: Financial verdict
  body: 'MiRus'' financial profile is determined by two competing realities. The first is strategic validation: a $1.5 billion BSX investment at an implied ~$4.4 billion equity valuation, with a $3 billion option on the TAVR business, is among the largest pre-approval medical device financing events in the TAVR category and provides adequate near-term capital for trial completion. The second is informational opacity: the company discloses no revenue, no margin, no burn rate, and no unit economics. The result is a financial case that cannot be fully underwritten from public data alone. Revenue quality for the orthopedic segment is partially inferable — 24 cleared products, CMS NTAP support, and a functioning distributor channel suggest a real commercial operation — but the scale, growth trajectory, and margin structure are unknown. The TAVR business is entirely pre-revenue: SIEGEL is investigational, STAR is in enrollment, and any TAVR revenue is at minimum 3–5 years away under an optimistic
    regulatory timeline. The capital adequacy question is largely resolved by the BSX deal: $1.5 billion is more than sufficient to fund STAR enrollment and primary endpoint readout. The underwriting blocker is not capital adequacy per se but option dependency: if STAR does not demonstrate non-inferiority to SAPIEN or Evolut on its 1-year composite endpoint, BSX is not obligated to exercise the $3 billion option, and the standalone enterprise value reverts to the orthopedic business plus any residual pipeline optionality. Margin path analysis remains speculative without a diligence conversation: MoRe alloy differentiation could support premium pricing in both spine and TAVR, but manufacturing scalability, COGS trajectory, and realized vs. list pricing are all private-data gaps. The verdict is that MiRus'' financial profile is strategically sound but operationally opaque — sufficient for a high-interest diligence queue but not yet underwritable without private access.'
