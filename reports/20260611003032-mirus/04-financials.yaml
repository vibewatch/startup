- id: capital-adequacy-and-financing-dependency
  title: Capital adequacy, burn rate, and financing dependency
  body: 'The $1.5 billion BSX investment represents the largest single disclosed financing event in MiRus'' history. Public sources do not disclose prior cumulative fundraising, exact cash on hand, or current monthly burn rate; the Company Overview chapter documents the funding chronology through the BSX deal from public sources without specifying pre-2026 fundraising amounts. From a capital adequacy standpoint, the relevant analysis is whether the $1.5 billion investment is sufficient to fund MiRus through the STAR trial to readout and potential PMA submission. STAR is enrolling 1,025 patients at multiple U.S. centers; the primary endpoint is a composite of mortality, stroke, and cardiovascular hospitalization at 1 year. Based on publicly documented costs for comparable pivotal TAVR trials, a 1,000-patient randomized controlled trial from enrollment to 1-year primary endpoint readout typically costs $100–$250 million in clinical operations alone, with regulatory affairs, quality, manufacturing
    scale-up, and general and administrative expenses adding further. The MiRus orthopedic commercial operation also requires ongoing sales-force, distributor, and inventory support. Even with conservative assumptions, the $1.5 billion investment provides substantial runway — likely well beyond the 1-year STAR primary endpoint, with capacity for a potential PMA or 510(k) pathway submission and early commercial planning. The primary financing dependency is therefore not on additional near-term capital but on the milestone-conditional $3 billion BSX option: if STAR fails or is materially delayed, the option would likely not be exercised, and MiRus would face a recapitalization event for its TAVR program. The orthopedic commercial business provides a revenue-generating offset to TAVR burn, but scale is undisclosed. No credit facilities, project finance arrangements, or inventory-backed lending programs are publicly described.'
