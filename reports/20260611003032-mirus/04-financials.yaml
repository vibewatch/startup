- id: boston-scientific-transaction-economics
  title: Boston Scientific transaction economics and option structure
  body: 'The May 18, 2026 Boston Scientific transaction is the most consequential financial event in MiRus'' history and deserves its own analytical treatment. Boston Scientific paid $1.5 billion for approximately 34% equity in MiRus, implying a pre-money equity value of roughly $2.9 billion and a post-money equity value of approximately $4.4 billion. That implied valuation is not independently audited or verified outside of the BSX announcement; it is arithmetic derived from the disclosed equity fraction and the investment quantum. The agreement also granted Boston Scientific an exclusive option to acquire the MiRus TAVR business for additional aggregate cash payments totaling $3 billion, contingent on the completion of certain clinical and regulatory milestones. A further option covers MiRus mitral and tricuspid valve assets at unspecified terms. These structures deserve careful financial interpretation. The $3 billion option is not a committed obligation; Boston Scientific retains the
    right, but not the obligation, to exercise it. The milestone triggers are not publicly disclosed in detail. From MiRus'' perspective, the option is a validation mechanism and a financing backstop — if SIEGEL succeeds in the STAR trial and receives FDA approval, BSX can acquire the TAVR business for what would be a total consideration of $4.5 billion ($1.5B investment plus $3.0B option exercise), representing a substantial multiple on the implied post-money equity for the TAVR business alone. The $1.5 billion investment itself provides significant near-term capital: even assuming the orthopedic business has meaningful but undisclosed operating burn, the infusion is large enough to fund the STAR trial through enrollment and readout, based on comparable pivotal TAVR trial cost structures documented in public comparators. Boston Scientific''s 2025 annual revenue was $20.07 billion with its cardiovascular segment growing approximately 18%, and the company explicitly cited a strategic need
    to re-enter the TAVR market following its Acurate platform withdrawal. The investment therefore reflects strategic optionality for BSX as much as capital supply for MiRus.'
