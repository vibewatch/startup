callouts:
- calloutType: strength
  title: BSX deal validates scale and provides adequate near-term capital
  body: The $1.5 billion investment at an implied ~$4.4 billion post-money equity valuation, made by a strategic acquirer with a declared need to re-enter the TAVR market, is a high-quality external validation event. The capital quantum is sufficient to fund STAR enrollment and readout under conservative assumptions. The milestone-structured $3 billion option aligns Boston Scientific's incentives with MiRus' clinical success, creating a well-aligned principal-agent dynamic for the trial period.
  claimRefs:
  - CI009
  - CI010
  - CI013
  - CI015
- calloutType: risk
  title: TAVR option is conditional — milestone failure triggers recapitalization risk
  body: The $3 billion acquisition option is not a committed obligation. If the STAR trial fails to demonstrate non-inferiority to SAPIEN/Evolut on its 1-year composite endpoint, Boston Scientific is not required to exercise the option. In that scenario, MiRus retains the $1.5 billion investment (less accrued burn) but loses the primary exit mechanism for the TAVR business, and the $4.4 billion implied equity valuation would not be sustained. The orthopedic business would then bear the full burden of demonstrating standalone value. This is the primary underwriting risk in the financial profile.
  claimRefs:
  - CI013
  - CI014
  - CI040
  - CI043
- calloutType: risk
  title: Revenue and margin opacity is a blocking diligence gap
  body: MiRus does not publicly disclose revenue, gross margin, burn rate, or unit economics for any business unit. All financial modeling of this company from public sources requires assumed benchmarks with very low confidence. This makes the company operationally ununderwritable from public data alone and mandates private data room access before any capital commitment.
  claimRefs:
  - CI033
  - CI034
  - CI036
  - CI037
  - CI039
- calloutType: insight
  title: NTAP for EUROPA PCF is a near-term revenue support mechanism
  body: The CMS New Technology Add-on Payment for EUROPA PCF, effective 2024–2025, entitles hospitals performing qualifying Medicare inpatient cervical spine procedures with EUROPA to incremental reimbursement. This reduces economic friction for hospital adoption and can accelerate procedure volume — an indirect revenue support mechanism without directly increasing MiRus' list price. It is also a precedent that SIEGEL could pursue in TAVR if it demonstrates comparable clinical differentiation.
  claimRefs:
  - CI006
  - CI007
  - CI023
- calloutType: assumption
  title: $1.5B investment provides adequate runway — treated as working assumption
  body: Estimates that the $1.5 billion BSX investment funds MiRus through STAR primary endpoint readout and PMA preparation are based on analytical benchmarks from comparable TAVR pivotal trials. This is an inference, not a company disclosure. Actual adequacy depends on burn rate, enrollment pace, and whether additional clinical endpoints require extension studies. The working assumption should be revisited once private burn rate and trial timeline data are available.
  claimRefs:
  - CI026
  - CI027
  - CI028
  - CI031
  - CI032
