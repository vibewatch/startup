  foundingLocation: Marietta, Georgia, USA
  headquarters: Marietta, Georgia, USA
  productSummary: Commercial orthopedic and spine implants and procedural systems built on the MoRe alloy platform, plus the investigational SIEGEL nickel-free balloon-expandable TAVR device now in the STAR pivotal trial.
  customerFocus: Structural-heart trial sites and physician investigators today for TAVR, plus hospitals, ASCs, and spine / orthopedic surgeons for the cleared implant portfolio.
  businessModel: Sell premium spine, orthopedic, and procedural systems through distributors and hospital accounts while using strategic financing to fund a pre-commercial TAVR platform whose main monetization path is Boston Scientific option exercise after clinical and regulatory milestones.
  stage: Private; strategic corporate round / pivotal-trial stage
  fundingStatus: Boston Scientific invested $1.5 billion for approximately 34% equity in May 2026 and secured a further $3 billion option on the TAVR business contingent on clinical and regulatory milestones; prior financing history is not fully public.
