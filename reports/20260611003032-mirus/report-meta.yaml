companyProfile:
  summary: MiRus is a private Marietta, Georgia medical-device company led by founder-CEO Jay Yadav. Its core asset is the MoRe molybdenum-rhenium platform, which underpins both a commercial orthopedic/spine implant portfolio with 24 FDA 510(k) clearances and the investigational SIEGEL balloon-expandable TAVR program. Boston Scientific invested $1.5 billion for roughly 34% equity in May 2026 and holds a further $3 billion milestone-based option on the TAVR business, making MiRus one of the most strategically validated but still financially opaque medtech startups in the market.
  founders:
