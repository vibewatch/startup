- id: tavr-trial-sites-and-investigator-proof
  title: TAVR Clinical Engagement — Sites, Investigators, and Proof Level
  body: >-
    The clearest and most granular evidence of MiRus "customer" engagement sits
    in its TAVR trial program. For the U.S. early feasibility study (EFS,
    NCT06680427), MiRus enrolled 15 patients at five U.S. centers (March–late 2025).
    Only two of these five sites are publicly confirmed by name through press
    releases and independent trade coverage: Piedmont Heart Institute in Atlanta
    and Cedars-Sinai Smidt Heart Institute in Los Angeles. Dr. Pradeep K. Yadav,
    Director of Structural Interventions at Piedmont Heart Institute, performed the
    first EFS cases and presented 30-day results at New York Valves in June 2025
    alongside Dr. Raj Makkar (chief of interventional cardiology, Cedars-Sinai
    Smidt Heart Institute). At 30 days, zero deaths, strokes, rehospitalizations,
    vascular complications, paravalvular leak, or permanent pacemaker implantations
    were recorded across all 15 patients; mean gradient was 6.3 mmHg and mean valve
    area 2.8 cm². These outcomes were presented in podium sessions, constituting
    physician-level endorsement of the device from two named, high-reputation
    centers.


    For the pivotal STAR trial (NCT07278310), MiRus enrolled and treated its first
    patients on April 8, 2026 at Piedmont Heart Institute. The ClinicalTrials.gov
    record as of June 2026 lists only Piedmont Heart Institute as an active
    recruiting site; additional sites have not yet appeared in the registry even
    though the trial design calls for enrollment at multiple U.S. centers. The
    trial chairpersons — Martin Leon, MD (Columbia University Medical Center) and
    Vinod Thourani, MD (Piedmont Heart Institute) — and national PIs Pradeep Yadav,
    Raj Makkar, Samir Kapadia, and Philippe Genereux are publicly named. Their
    institutional affiliations represent the expected geographic spread of STAR
    trial sites (East Coast academic centers, Atlanta, Los Angeles, Cleveland Clinic,
    Atlantic Health), though the registry has not yet published a full site list.


    The first-in-human procedures were performed in June 2024 at Instituto Nacional
    del Torax in Santiago, Chile, in five patients with severe symptomatic aortic
    stenosis. Results at 30 days showed no mortality or stroke, no permanent
    pacemaker requirement, and a mean echo gradient of 6.7 mmHg.


    These investigators function as physician champions and adoption validators, not
    commercial customers. Their participation generates clinical evidence and
    professional-society visibility, but does not create contractual commercial
    relationships, generate revenue for MiRus, or prove market-level adoption.
  claimRefs:
