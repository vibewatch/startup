- id: orthopedic-spine-commercial-customer-base
  title: Orthopedic and Spine Commercial Customer Base
  body: >-
    MiRus's orthopedic and spine products are commercially marketed through
    independent sales representatives and a distributor network. The company's
    distributor page invites prospective distribution partners to register but
    does not list existing distributor names or territories. No public-facing
    customer case study, hospital deployment announcement, surgeon testimonial,
    or purchasing agreement has been identified for any of the 24 FDA-cleared
    spine and orthopedic products. This is consistent with early-stage small-device
    company practice of relying on distributor-driven, surgeon-to-surgeon
    networks where deal flow is private and institutional contracts are rarely
    announced.


    The EUROPA® PCF system with NTAP designation (CMS FY2026) provides the best
    public signal of hospital-level adoption incentive: the NTAP creates a direct
    economic benefit for hospitals that implant the device during the NTAP window
    (FY2026, with potential extension subject to CMS renewal). This would be
    expected to ease hospital formulary approval and accelerate initial commercial
    accounts. However, no hospitals receiving NTAP payments for EUROPA® PCF are
    publicly disclosed.


    The GALILEO™ Spine Alignment Monitoring System creates potential workflow
    stickiness for hospital and ASC customers that adopt it alongside the EUROPA®
    instrumentation, since procedural-planning-tool integration increases switching
    costs. Similarly, the lifetime limited warranty on MoRe® rod fracture is a
    differentiated commercial message for spine programs with high deformity
    surgery volume. Neither product-level stickiness factor has been linked to any
    confirmed named customer in the public record.


    The practical diligence gap is significant: without named commercial accounts,
    revenue figures, utilization rates, or distributor identities, it is impossible
    to assess the commercial depth, durability, or concentration of the spine/ortho
    business. MiRus's 250%+ revenue growth claim (Atlanta Business Chronicle, 2022)
    is the only public growth signal for the company as a whole, but it is stale and
    does not isolate the spine/ortho segment.
  claimRefs:
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  tableRefs:
  - TU004
  figureRefs:
  - FU003

- id: retention-repeat-use-and-customer-durability
  title: Retention, Repeat Use, and Customer Durability
  body: >-
    No retention metrics — net revenue retention (NRR), gross retention, churn
    rate, contract length, renewal data, or cohort analysis — exist in the public
    record for either business segment. This is an expected reality for a private
    company with an undisclosed commercial orthopedic revenue base and an entirely
    investigational TAVR program, but it leaves all customer durability analysis
    speculative.


    For TAVR, the concept of "retention" as normally applied to commercial accounts
    does not yet apply: trial sites participate under IDE protocols administered by
    MiRus's CRO and clinical affairs team, not under commercial supply agreements.
    A clinical site that completes EFS enrollment is expected to transition to the
    STAR pivotal trial at MiRus's direction, which represents a form of sequential
    engagement but is driven by regulatory pipeline requirements, not customer
    loyalty. The more relevant durability question for TAVR is whether lead
    investigators will advocate for the device post-approval: the published
    endorsements from Yadav, Thourani, Makkar, Leon, Kapadia, and Genereux suggest
    strong physician-champion alignment, but commercial adoption depends on system
    economics, FDA approval timing, and a post-market registry structure.


    For orthopedic/spine, the most relevant durability proxy would be reorder rates
    — whether surgeons trained on EUROPA® or IO™ products continue to prefer them
    over titanium or CoCr alternatives. The lifetime limited warranty on rod fracture
    is a structural retention incentive (ongoing product support), and the GALILEO™
    ecosystem adds procedural switching costs. However, no utilization or reorder
    data are available. The NTAP adds a two-to-three year window during which
    hospital economics favor EUROPA® PCF adoption, after which price competition
    normalizes. No CMS claims data or commercial contract data confirming sustained
    hospital use have been identified.
  claimRefs:
  - CU027
  - CU028
  - CU029
  - CU030
  - CU031
  tableRefs:
  - TU005
  figureRefs: []

- id: expansion-path-and-concentration-risks
  title: Expansion Path and Concentration Risks
  body: >-
    MiRus faces pronounced concentration risk across both segments. In TAVR, the
    publicly confirmed customer engagement is dominated by Piedmont Heart Institute:
    it is the site of the EFS first cases (March 2025), the STAR first enrollment
    (April 2026), and the home institution of both the STAR trial co-chair
    (Thourani) and a national PI (Yadav). The clinical leadership structure
    creates a hub-and-spoke pattern in which Piedmont serves as the anchor site,
    with Cedars-Sinai as the second confirmed node. Loss of physician-champion
    support from either Yadav or Thourani would materially delay the STAR trial's
    primary-site enrollment momentum.


    The STAR trial's expected expansion to approximately 20 or more U.S. sites
    will broaden the institutional engagement, but the rate of site activation is
    not publicly disclosed and the registry had not listed additional sites as of
    the June 2026 run date. Commercial TAVR expansion after a potential PMA (likely
    2028–2029 at earliest given a 2026 enrollment start) would require institutional
    credentialing at several hundred sites (approximately 700 certified TAVR programs
    in the U.S. per STS/TVT Registry data) and would compete directly with Edwards
    and Medtronic for procedure room time, structural heart team training, and
    capital allocation. MiRus's 8 French sheath advantage and nickel-free status
    provide differentiated entry points, but commercial customer acquisition in
    structural heart is a multi-year, capital-intensive endeavor.


    For orthopedic/spine, concentration in the distributor network is entirely
    opaque. If a small number of distributors or regional reps drive the majority
    of revenue, departure of key distributors would be material. The lack of any
    named distribution partner limits independent evaluation of channel health.
    EUROPA® PCF's Breakthrough Device Designation and NTAP create a two-to-three
    year window for concentrated hospital adoption in the cervical space, but
    without a post-NTAP commercial strategy backed by visible accounts, long-term
    durability is unconfirmed.


    An important adverse context is that the precedent of major TAVR platforms
    failing after promising trial data exists: Boston Scientific's ACURATE Neo2 and
    ACURATE Prime platforms were withdrawn from the global market in late 2023 after
    failing to receive FDA approval, demonstrating that strong early feasibility
    and European commercial traction do not guarantee U.S. approval or commercial
    success. This risk is not specific to MiRus but is directly relevant to
    evaluating commercial customer runway contingent on STAR trial success and PMA.
  claimRefs:
  - CU032
  - CU033
  - CU034
  - CU035
  - CU036
  - CU037
  - CU038
  tableRefs:
  - TU006
  figureRefs: []

