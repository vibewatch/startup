  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: spine commercial customers
    missingEvidence: >-
      Named hospital, ASC, or surgery-center commercial customers for any MiRus
      orthopedic or spine product; revenue per account; top-10 customer concentration.
    whyItMatters: >-
      Without named commercial accounts, it is impossible to assess whether the
      spine/ortho business has durable, concentrated, or diversified customer adoption.
      The company's $1.5B valuation (post-investment implied) is partly predicated on
      commercial orthopedic scale that cannot be independently validated.
    diligencePath: >-
      Request named commercial account list with revenue per account (FY2024, FY2025),
      distributor identities and territory coverage, and reorder rate by surgeon.
    relatedQuestionRefs:
    - QU006
    - QU007
    - QU016
    - QU018
    - QU020

