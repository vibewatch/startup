callouts:
- calloutType: risk
  title: Extreme Physician-Champion Concentration in TAVR
  body: >-
    As of June 2026, Piedmont Heart Institute is the only publicly confirmed active
    site in the STAR pivotal trial, and both the trial co-chair (Thourani) and a
    national PI (Yadav) are located there. Loss of support from either Yadav or
    Thourani — through departure, health, or competing interests — would materially
    disrupt primary-site enrollment and damage the MiRus TAVR credibility narrative
    at a critical phase of the pivotal trial.
  claimRefs:
  - CU032
  - CU034

- calloutType: risk
  title: No Named Commercial Customers for Orthopedic / Spine
  body: >-
    Despite holding 24 FDA 510(k) clearances and having been in commercial operation
    for several years, MiRus has not named a single hospital, ASC, or surgery-center
    customer for any orthopedic or spine product. This makes it impossible to assess
    customer concentration, revenue durability, distributor health, or competitive
    positioning from public sources. Diligence must include a named account list,
    top-10-customer revenue concentration, and distributor contract terms.
  claimRefs:
  - CU025
  - CU026
  - CU027

- calloutType: insight
  title: Trial Investigators Are Not Commercial Customers — A Critical Distinction
  body: >-
    All public evidence for MiRus TAVR "customer" engagement describes clinical trial
    participation under IDE protocols, not commercial purchasing. Named physicians
    at Piedmont and Cedars-Sinai are principal investigators with clinical and
    regulatory obligations to the trial — they are not customers in the sense of
    having evaluated the device commercially and chosen to purchase it over alternatives.
    Commercial customer proof will not exist until after FDA PMA approval, likely
    in 2028 or later.
  claimRefs:
  - CU001
  - CU003
  - CU019
  - CU021

- calloutType: risk
  title: TAVR Commercialization Risk — Precedent of BSX ACURATE Exit
  body: >-
    Boston Scientific's ACURATE Neo2 and ACURATE Prime TAVR devices, which had
    achieved significant European commercial traction, were withdrawn from the global
    market in late 2023 after the FDA declined to approve them. This establishes
    an adverse reference case for the TAVR device development funnel: trial
    participation and investigator enthusiasm do not guarantee commercial customer
    adoption or regulatory success.
  claimRefs:
  - CU038
  - CU039

