company:
  name: MiRus
chapter:
  number: 6
  title: Customers
  summary: >-
    MiRus has two fundamentally different customer realities. Its TAVR "customers"
    are clinical trial investigators and IDE-approved sites — not commercial buyers —
    with Piedmont Heart Institute as the sole publicly confirmed STAR enrollment site
    and physician-champion concentration heavily concentrated in Dr. Pradeep Yadav and
    Dr. Vinod Thourani. Its orthopedic/spine products are sold commercially through an
    unnamed distributor network with no publicly identified hospital or surgery-center
    customers. Named adoption proof is limited to five EFS investigators (Piedmont and
    Cedars-Sinai confirmed; three additional sites unnamed) and early STAR trial
    engagement; commercial customer validation for either product line is unconfirmed
    in the public domain. Retention, NRR, GRR, and churn data do not exist for TAVR
    (investigational) and are undisclosed for orthopedics/spine.

sections:
- id: customer-segmentation-and-buyer-structure
  title: Customer Segmentation and Buyer / User / Payer Architecture
  body: >-
    MiRus serves two structurally distinct customer populations that differ in buyer
    identity, proof of adoption, payment mechanism, and risk profile. In the TAVR
    segment, the "customer" is a hospital structural heart program and its team of
    credentialed interventional cardiologists and cardiac surgeons. Currently no
    commercial TAVR transaction exists anywhere in the world: the Siegel device
    is an investigational device exempt (IDE) product, and the only authorized
    end-users are clinical investigators enrolled in the IDE-approved EFS and STAR
    pivotal trial. Investigational device use is sponsored by MiRus, reimbursed
    under CMS Coverage with Evidence Development (CED) rules, and does not involve
    hospital procurement, formulary review, or supply-chain contracts. CMS approved
    the STAR trial under CED on March 27, 2026, and the EFS was approved March 28,
    2025. The MiRus TAVR "customer" today is therefore a named clinical investigator
    at a named trial site — a clinical partner, not a paying commercial account.


    In the orthopedic and spine segment, the buyer is a hospital, ambulatory surgery
    center (ASC), or private surgery practice that purchases implant systems through
    MiRus's distributor network. End users are spine and orthopedic surgeons. The
    payer is typically a private insurer or Medicare/Medicaid, with procedure
    reimbursement flowing to the facility. The EUROPA® PCF system received a CMS
    New Technology Add-on Payment (NTAP) effective FY2026 (announced August 2025),
    providing an incremental per-case add-on payment for hospitals that adopt the
    product — a meaningful adoption incentive for the PCF, though NTAP is typically
    limited to two to three years. No revenue figures, customer counts, account
    names, or contract structures for the orthopedic/spine business have been
    publicly disclosed. The company's distributor page collects inquiries but
    does not name existing partners.
  claimRefs:
