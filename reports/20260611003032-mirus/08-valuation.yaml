- id: valuation-context-and-comparable-set
  title: Valuation context and comparable set
  body: >-
    The $4.4 billion implied equity is derived from arithmetic: $1.5 billion divided by approximately 34%
    equals a post-money equity of approximately $4.4 billion. This is not an independently audited figure
    and the stated "approximately 34%" introduces a range of roughly $4.2–4.65 billion. Boston Scientific's
    FY2025 total revenue was $20.07 billion growing at 19.9% year-over-year, and the cardiovascular segment
    grew 18.2% in Q4 2025. The strategic imperative behind the investment—re-entering TAVR after
    discontinuing ACURATE—is therefore grounded in a segment that is one of BSX's fastest-growing.

    For comparable-set analysis, four reference frames are appropriate for a clinical-stage TAVR / commercial
    spine hybrid. First, public cardiovascular medtech companies: Edwards Lifesciences reported FY2025 Q4
    TAVR sales of $1.16 billion (annualizing to approximately $4.5 billion), and its SEC-registered 10-K
    for FY2025 was filed February 25, 2026; Medtronic's cardiovascular-focused operations appear in its
    SEC-registered annual filings; and Boston Scientific's 2025 10-K was filed February 17, 2026 at EDGAR.
    These companies trade at EV/TAVR-revenue multiples implying that high-growth structural heart franchises
    command premium valuations—Edwards alone represents the strongest reference. Second, strategic M&A
    precedents: J&J's acquisition of Abiomed in 2023 for approximately $16.6 billion valued a cardiac-support
    device company at a substantial premium to trailing revenue, illustrating that strategics will pay for
    option value in commercial cardiac devices. Third, comparable spine companies: Stryker's SEC-registered
    10-K for FY2025 filed February 11, 2026 shows that premium spine businesses trade at 4–6x annual
    revenue—this sets a partial floor for the orthopedic segment. Fourth, clinical-stage milestone logic:
    at $3 billion BSX option value for the TAVR business post-milestone, the implied pre-milestone present
    value depends on the probability-weighted STAR outcome, estimated by public evidence at 60–80%
    (supported by zero 30-day major adverse events in 15 EFS patients, but not by pivotal randomized data).

    A pure financial investor underwriting at the $4.4 billion post-money level faces a challenging return
    profile: even in the bull case, the BSX option exercise reallocates TAVR proceeds to MiRus as a
    company-level event (not directly to co-investors unless cap table preferences allow), and entry at
    $4.4 billion post-money requires TAVR success plus meaningful orthopedic growth to clear a 2–3x return
    over a 5–7 year horizon. The valuation stance is stretched for financial investors and fair-to-attractive
    for BSX as the strategic buyer with already-established exercise rights.
