- id: TV002
  title: Thesis and anti-thesis
  columns:
  - Direction
  - Argument
  - What would change the view
  rows:
  - - Thesis
    - MoRe alloy platform creates durable cross-segment IP moat
    - IP challenge, generic alloy substitute, or failed durability claims
  - - Thesis
    - BSX $1.5B investment is best-available strategic validation for SIEGEL
    - BSX withdraws or renegotiates before STAR readout
  - - Thesis
    - $3B TAVR option provides structured exit with defined conditions
    - Option triggers are more restrictive than currently disclosed
  - - Thesis
    - 24 cleared orthopedic products plus CMS NTAP support confirm real commercial operation
    - Revenue or margin data disclosed at levels below peer-comparable floors
  - - Thesis
    - STAR zero 30-day MACE in 15 EFS patients is an early positive signal
    - STAR pivotal misses primary composite endpoint or is discontinued
  - - Anti-thesis
    - $4.4B pre-approval is binary; no revenue, no margin, no approval exists today
    - STAR succeeds and BSX exercises option, validating entry price
  - - Anti-thesis
    - BSX Acurate failure ($200M+ spend, then withdrawal) shows TAVR binary risk
    - SIEGEL differentiation from Acurate is confirmed in pivotal trial vs. incumbents
  - - Anti-thesis
    - BSX option not committed; company-level risk if option lapses
    - Strategic alternative acquirer emerges or option terms confirmed as exercisable
  - - Anti-thesis
    - Revenue, margins, cap table structure all opaque — cannot underwrite from public data
    - Private financial disclosure closes gap
  notes: >-
    Thesis and anti-thesis pairs are derived from public evidence; internal financial data that would
    materially change the view (revenue, margins, cap table) is not available publicly.
