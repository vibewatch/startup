- id: TV003
  title: Comparable valuation table
  columns:
  - Comparable
  - Type
  - Metric / Status
  - Multiple or Value
  - Relevance to MiRus
  - Limitation
  enumerationScope:
    coverage: partial
    basis: >-
      Covers publicly-traded TAVR and spine medtech comparables (Edwards, BSX, Medtronic,
      Stryker, Abbott) plus selected strategic M&A transactions; excludes private TAVR
      startups (Anteris, Pi-Cardia) due to insufficient public financial data; excludes
      non-cardiovascular medtech. As of 2026-06-11.
  rows:
  - - Edwards Lifesciences (EW)
    - Public company
    - FY2025 TAVR revenue ~$4.5B; 10-K filed 2026-02-25
    - ~10–12x EV / TAVR revenue (implied from market cap)
    - Strongest TAVR pure-play comp; sets ceiling for approved TAVR franchise
    - Already approved and commercial; MiRus is pre-approval
  - - Boston Scientific (BSX)
    - Strategic investor / public company
    - FY2025 total revenue $20.07B; 10-K filed 2026-02-17; cardiovascular +18.2% in Q4 2025
    - $1.5B for 34% equity implies $4.4B post-money for MiRus
    - Direct price-setter; BSX is the primary valuation anchor
    - BSX paid for strategic option, not pure financial return; inflates implied value
  - - Medtronic (MDT)
    - Public company
    - Cardiovascular segment in annual 10-K filed at SEC EDGAR
    - ~5–8x EV / cardiovascular revenue (lower multiple than EW)
    - Sets floor on pure cardiovascular segment multiples
    - Medtronic is diversified; cardiovascular is one of multiple segments
  - - Stryker (SYK)
    - Public company
    - FY2025 10-K filed 2026-02-11; premium spine segment revenue
    - ~4–6x EV / revenue for spine-focused operations
    - Orthopedic / spine comp for MiRus floor valuation
    - Much larger scale; MiRus spine business is undisclosed in size
  - - Abbott Laboratories (ABT)
    - Public company
    - Annual 10-K on record at SEC EDGAR; structural heart includes Navitor TAVI
    - ~7–10x blended medtech EV / revenue
    - Structural heart + orthopedic hybrid; closest portfolio analogy among public cos
    - Diversified across diagnostics, nutrition, devices — not apples-to-apples
  - - J&J Abiomed acquisition (2023)
    - Strategic M&A
    - ~$16.6B for LVAD franchise post-commercialization
    - ~8–12x forward revenue at time of deal
    - Precedent for premium strategic cardiac device premium
    - Abiomed was already commercial; MiRus TAVR is pre-approval
  - - BSX ACURATE neo2/Prime TAVR (discontinued)
    - Adverse precedent
    - Q2 2025 discontinuation; prior ~$50M/quarter global sales; no FDA approval
    - N/A (binary failure)
    - "Directly adverse: shows clinical-stage TAVR programs carry binary approval risk"
    - Acurate had more clinical history than SIEGEL at time of withdrawal
  notes: >-
    Multiples for public companies are approximate ranges based on SEC-registered 10-K filings and
    publicly reported revenue. Market capitalizations change daily; figures reflect the analytical
    range as of the June 2026 run date, not a single-day market snapshot. Private-company and
    M&A comparables are based on publicly reported deal terms. Revenue figures for MiRus are not
    available; all MiRus-specific entries reflect derived or inferred values.
