- id: TV004
  title: Bull / base / bear scenario analysis
  columns:
  - Scenario
  - Key assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - "STAR succeeds on time; PMA approved 2028–2029; BSX exercises $3B option; orthopedic reaches $300–500M annual revenue"
    - "Total TAVR + orthopedic value > $4.4B; co-investors at BSX round price achieve 1.5–2.5x return"
    - STAR delay or endpoint near-miss extending timeline
    - 25–35% (zero EFS MACE, BSX bet, but pivotal data not yet in hand)
  - - Base
    - "STAR succeeds with 6–18 month delay; BSX exercises option at milestone-adjusted terms; orthopedic sustains growth at single-digit rates"
    - "Realized total value $3.5–5.0B range; co-investor return modestly positive to flat vs. $4.4B entry"
    - "Option term renegotiation; regulatory CMS coverage delay; slower spine growth"
    - 40–50% (BSX commitment is base-case anchor; timing uncertainty is key variable)
  - - Bear
    - "STAR fails primary endpoint or discontinued; BSX option lapses; MiRus recapitalizes TAVR at lower valuation"
    - "Standalone orthopedic value $800M–$3B at 4–6x estimated revenue; loss on $4.4B entry"
    - "STAR endpoint failure is binary; no runway extension can fix a failed pivotal trial"
    - 20–30% (BSX Acurate precedent; pre-approval TAVR programs have meaningful failure rates)
  notes: >-
    Probability signals are qualitative estimates derived from analogy with TAVR comparable programs
    and clinical stage indicators; they are not actuarial probabilities. Revenue estimates in bull and
    bear cases are ranges from comparable spine benchmarks and are not MiRus disclosures.
    The base case is the author's central estimate given BSX's commitment and available clinical data.
  claimRefs:
  - CV028
  - CV031
  - CV032
  - CV033
  - CV034
  - CV035

- id: TV005
  title: Thesis-break and kill-trigger table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - STAR primary endpoint failure
    - Non-inferiority not met vs. SAPIEN/Evolut on 1-year composite
    - Binary thesis destruction; $3B option lapses; TAVR value collapses
    - Exit or hedge; recapitalize evaluation required
  - - STAR enrollment pace below plan
    - Enrollment <50% of target at 12-month mark
    - Signals site activation problems; delays PMA by 2+ years
    - Flag for private diligence; may not be independently observable
  - - BSX capital reallocation
    - BSX publicly withdraws or renegotiates structural-heart investment priority
    - Removes primary exit path; signals strategic reassessment
    - Re-evaluate without BSX; assess secondary strategic buyer interest
  - - Down-round financing
    - MiRus raises capital at a post-money below $3.5B
    - Signals BSX exit or operational deterioration
    - Thesis broken; exit at available price
  - - Rhenium supply disruption
    - MoRe alloy supply interrupted for >30 days
    - Both orthopedic and TAVR manufacturing impacted; revenue interruption
    - Assess supply chain depth; watch USGS rhenium supply reports
  - - CMS NTAP expiry without renewal
    - EUROPA PCF NTAP expires without extension or successor
    - Removes hospital economic incentive; could reduce spine adoption rate
    - Monitor CMS NTAP register; not thesis-breaking on its own
  notes: >-
    Trigger thresholds are indicative monitoring criteria derived from public comparable TAVR programs and
    BSX deal structure; specific numerical enrollment targets and option milestone definitions are private.
    All severity and transmission assessments are analytical inferences.
  claimRefs:
  - CV003
  - CV004
  - CV030
  - CV035
  - CV045

- id: TV006
  title: Final diligence asks
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Orthopedic revenue and margins
    - Annual revenue, gross margin, and COGS for spine/extremity segment
    - Cannot model orthopedic floor value or assess TAVR burn coverage
    - MiRus CFO; private financial statements
  - - STAR enrollment velocity
    - Sites activated, patients enrolled monthly vs. plan, expected completion date
    - Determines PMA timeline and capital adequacy; central to base/bull case
    - MiRus clinical team; ClinicalTrials.gov may show partial data
  - - Cap table and preference stack
    - Pre-BSX investor list, dilution history, liquidation preferences
    - Determines co-investor economics in any exit scenario
    - MiRus; cap table and shareholder agreement review
  - - BSX option milestone definitions
    - Verbatim text of clinical and regulatory milestone triggers for $3B option
    - Determines whether option is achievable and at what price
    - BSX / MiRus deal agreement; typically disclosed partially in SEC proxy if public
  - - Rhenium supply agreements
    - Supplier(s), contract length, pricing, volume commitments
    - COGS trajectory for both segments; supply concentration risk
    - MiRus operations / procurement
  - - Historical fundraising and pre-BSX cap table
    - Total capital raised before BSX, original shareholder dilution
    - Establishes true cost basis for pre-BSX investors and founder dilution
    - MiRus; investor filings or voluntary disclosure
  - - CMS NTAP status and expiry
    - EUROPA PCF NTAP expiry date and renewal status
    - Affects hospital economics for spine adoption; revenue-supporting for near term
    - CMS NTAP public register; confirm via MiRus press release
  - - Gross margin on TAVR trial operations
    - TAVR clinical and regulatory burn rate
    - Confirms $1.5B is sufficient to fund STAR through primary endpoint readout
    - MiRus CFO; comparable TAVR trial benchmarks available publicly
  notes: >-
    All diligence asks reflect information gaps from public-source analysis only; MiRus has not responded
    to any diligence requests and may have disclosed additional information in private settings. Diligence
    paths are recommended approaches, not confirmed next steps.
  claimRefs:
  - CV025
  - CV036
  - CV037
  - CV038
  - CV046

