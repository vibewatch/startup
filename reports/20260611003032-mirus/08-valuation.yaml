- id: exit-readiness-and-diligence-asks
  title: Exit readiness and final diligence asks
  body: >-
    MiRus's primary exit path is the BSX option exercise: a structured, pre-negotiated route to a strategic
    acquisition of the TAVR business for $3 billion contingent on clinical and regulatory milestones.
    This is an unusually well-defined exit for a private clinical-stage company and reduces the need for
    a traditional IPO or auction process for the structural heart segment. The orthopedic business could
    be retained by MiRus post-TAVR-option-exercise or separately monetized via sale to a spine strategic
    (J&J DePuy Synthes, Stryker, Zimmer Biomet). A secondary IPO of the combined entity is also possible
    if BSX does not exercise and the company achieves sufficient scale in orthopedics.

    Exit readiness for the TAVR track is therefore entirely milestone-gated: STAR primary endpoint readout,
    FDA PMA review, and CMS coverage determination are the three sequential gates that must pass before the
    option exercise becomes available. The orthopedic business is already commercially active and could be
    exit-ready independent of TAVR, but at undisclosed revenue scale, any strategic sale price is opaque
    to outside investors.

    Final diligence asks to underwrite this investment are substantial: private financial statements to
    establish orthopedic revenue, gross margin, and burn rate; STAR enrollment velocity data (sites activated,
    patients enrolled per month vs. plan); cap table showing pre-BSX dilution history, preference stack, and
    co-investor identity; rhenium supply agreements and COGS trajectory; BSX option milestone definitions
    verbatim; and CMS NTAP status and expiry for EUROPA PCF. These gaps represent material underwriting
    blockers that cannot be resolved from public evidence alone.
  claimRefs:
  - CV036
  - CV037
  - CV038
  - CV039
  - CV040
