            body: >-
              估计 $1.5 billion 的 BSX 投资可支持 MiRus 走到 STAR 主要终点读出和 PMA 准备阶段，这一判断基于可比 TAVR
              关键性试验的分析基准。这是推断，不是公司披露。实际充足性取决于烧钱速度、入组节奏，以及额外临床终点是否需要延长研究。拿到私有烧钱速度和试验时间线数据后，应重新审视该工作假设。
