      - number: '3.4'
        title: 分销、切换成本与锁定效应
        blocks:
          - type: paragraph
            body: >-
              TAVR 操作者和机构关系，是保护 Edwards 与 Medtronic 的主要护城河。多学会资质要求（AATS/ACC/SCAI/STS）规定 TAVR
              项目必须维持特定手术量和操作者培训标准；围绕某一平台的带教、模拟器和现场支持建立培训基础设施的项目，会面临实质切换成本。Edwards 运营 Edwards Learning
              Network，提供结构化培训、病例支持和在线模块；Medtronic 提供同等培训基础设施。两家公司还提供全面报销支持台、CT 规划工具和专门的结构性心脏服务线资源——这些基础设施不是 MiRus
              当前规模能够匹配的。

              医院资本委员会决策把器械批准纳入多年服务线合同，这些合同常常包含一家企业更大产品组合的捆绑定价。若某个卫生系统依赖 Medtronic 提供 CRM、神经调控和脊柱导航，要抵抗 Medtronic 的 TAVR
              捆绑压力并不容易。Edwards 同样如此，其结构性心脏项目延伸至二尖瓣和三尖瓣领域。这些跨产品组合关系创造了任何单器械价格比较都看不到的软性切换成本。

              脊柱中，手术室关系围绕现场销售代表展开：代表管理器械托盘、提供术中指导并维护外科医生偏好。更换植入物供应商需要培训、补充托盘（一项实质隐藏成本）并重建手术室人员熟悉度。ASC
              迁移正在让部分采购转向成本优先，这可能部分有利于像 MiRus 这样具有差异化材料科学的进入者，因为它可以在总植入物层面价值上竞争，但销售代表驱动的模式仍主导医院脊柱采购。

              多平台使用——根据解剖结构在 SAPIEN 和 Evolut 之间选择——已是高量 TAVR 中心的常见实践。多数大型项目保持对两个平台的准入。这表明中心可以在获批后增加 SIEGEL，而不必放弃既有厂商，对
              MiRus 采用有利。不过，这也意味着中心缺少独家承诺 SIEGEL 的紧迫性，限制 MiRus 近期争取优选供应商地位的能力。
            claimRefs:
              - CP024
              - CP025
              - CP028
              - CP037
      - number: '3.5'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              TAVR 中的反向证据模式很鲜明。Boston Scientific 在 2017 年以 $435 million 收购 Symetis，并多年推进 Lotus Edge（2020 年停产）和 Acurate
              neo2（2025 年停产）的 FDA 批准后，最终完全退出 TAVR；这是目前最清楚的信号，说明撬动 Edwards 和 Medtronic 有多难。BSX 按收入计是全球最大医疗科技公司之一，却两次败在
              TAVR。Acurate IDE 试验失败中，经验较少中心的操作者经验不足导致约 21.6% 瓣膜扩张不足，说明手术复杂性和培训投入并不容易转移。MiRus SIEGEL 的 8-French
              低轮廓设计可能缓解部分部署复杂性，但原则不变：新系统的 TAVR 采用，结构性受制于操作者信任、机构资质和需要多年积累的比较结局数据。

              Medtronic 继续投资其平台。Evolut FX+ 是一次带有更新部署特征的增量进步。SMART 试验五年结果仍待公布，可能进一步支撑 Medtronic 在小瓣环患者细分中的差异化。Edwards 的 7
              年 PARTNER 3 数据，以及对 JenaValve 和 JC Medical 的收购，使其有能力扩张到主动脉瓣反流这一相邻适应症——MiRus
              在这些领域尚无数据。既有厂商的这些创新向量意味着竞争差距不会停在原地。

              对 MiRus 来说，$3 billion 的 BSX 认购期权同时是最强验证，也是最具威胁的结构特征。如果 BSX 行权，MiRus TAVR
              不再是独立业务——分销、商业化和战略方向都会转到大型既有厂商手中。这不一定是反向因素（BSX 有更强商业触达），但会改变那些押注 MiRus 作为独立结构性心脏公司的投资者所面对的风险画像。如果 BSX
              放弃期权，MiRus 必须从零搭建自己的 TAVR 商业基础设施——现场招聘、医院签约、培训项目、报销支持——并对抗两家拥有数十年机构关系的深度扎根竞争者。

              脊柱中，MiRus 护城河持久性取决于能否产出外科医生层面的结局数据，证明陌生合金值得采用，并随时间建立临床信任。Stryker 植入物剥离和 JnJ 可能拆分
              DePuy，确实给前三大厂商带来组织扰动，但扰动不会自动利好小玩家。大型竞争者重组中的赢家通常是拥有成熟销售队伍、资金充足的中型公司，而不是公开临床证据有限的早期进入者。
