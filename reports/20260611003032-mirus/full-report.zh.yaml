      - number: '2.3'
        title: 买方、用户与支付方分层
        blocks:
          - type: paragraph
            body: >-
              TAVR
              的买方和支付方格局高度机构化且集中。结构性心脏的主要买方是医院资本委员会或结构性心脏服务线负责人，评估系统成本、植入物定价、培训要求和机构资质。用户是多学科心脏团队——通常由介入心脏病专家和心脏外科医生依据
              AATS/ACC/SCAI/STS 共识要求共同决策——绝大多数手术的支付方是 Medicare，其在含证据发展覆盖（CED）条件的 National Coverage Determination（NCD）下覆盖
              TAVR。根据 Grand View Research 终端使用数据，约 88% 的 TAVR 手术在医院完成，其余在门诊手术场景完成，但复杂结构性心脏病例几乎全部集中在医院项目。具体到 SIEGEL
              瓣膜，支付方准入目前限于 CMS 批准的 CED 临床研究入组；FDA
              批准前没有商业报销。脊柱买方地图明显不同：预算负责人通常是骨科或脊柱外科科主任以及医院供应链委员会，外科医生通过寄售式植入物项目拥有重要选择权。支付方组合更广，也更具商业差异——Medicare、Medicaid、商业保险和工伤赔偿都在其中——尽管
              Medicare 仍覆盖 65 岁以上患者中多数脊柱融合手术。脊柱采用触发因素偏向已有正面材料使用经验的外科医生，这也是 MiRus 通过 510(k)
              获批组合积累临床数据和关键意见领袖支持，对商业势头重要的原因。第三类是门诊手术中心（ASC），用于复杂度较低的脊柱手术；这是一个增长中的细分市场，新型植入材料或许能更快被采用，因为资本委员会把关较少，但
              MiRus 尚未公开将 ASC 渗透列为当前重点。
