  - id: FE001
    title: MiRus 产品架构栈
    type: stack
    layout: wide
    summary: MiRus 的产品架构是四层栈，从核心材料，经设备机制，延伸到商业化产品族和手术工具。
    data:
      items:
        - label: 第 1 层——核心材料：MoRe®（Mo-47.5Re，FDA 2019 年批准）
          note: 高屈服强度、抗疲劳、回弹极小、不含镍 / 钴。>100 项专利。>15 年研发。
        - label: 第 2 层——设备机制：IO Expansion Engine | TAVR 开放单元支架 | 3DR Expandable Body | NO 涂层 Re 支架
          note: 合金特性支持 3 mm 椎间置入、8 Fr TAVR 输送、2.9 mm PCF 棒。这些设计用 Ti/CoCr 难以实现。
        - label: 第 3 层——商业产品族：脊柱（EUROPA、IO、RIGEL、ANTARES）| 四肢（IO Wedge、ATLAS）| 结构性心脏（SIEGEL TAVR）
          note: 骨科 / 脊柱已有 24 项 FDA 510k 许可。SIEGEL 仍处 IDE 试验阶段。
        - label: 第 4 层——手术解决方案：GALILEO™（规划、术中对齐、RPM）| VITESSE™ 置入系统
          note: 把产品价值延伸到术前 / 术中 / 术后工作流。许可状态和采用情况尚未由公开信息完全确认。
        - label: 第 5 层——临床项目：EFS（n=15，已完成）| STAR RCT（n=1,025，正在入组）| EUROPA PCF 突破性设备
          note: 临床数据管线支撑 TAVR 最终 PMA 以及脊柱适应证扩展。
    claimRefs:
      - CE001
      - CE008
      - CE017
      - CE019
      - CE033
    approximationNotes: 层级边界是概念抽象；产品族在各层之间共享组件。
  - id: FE002
    title: Siegel TAVR 临床工作流
    type: flow
    layout: wide
    summary: Siegel TAVR 手术沿用标准 TAVR 工作流，但加入 8 Fr 股动脉通路步骤，从而扩大患者适用范围并支持次日出院。
    data:
      nodes:
        - label: 患者筛查
          type: source
          note: 重度症状性主动脉瓣狭窄；低 / 中 / 高外科风险；评估股动脉解剖。
        - label: 心脏团队规划
          type: process
          note: 结构性心脏团队（介入心脏病专家 + 心外科医生）审阅 CT、超声、入路解剖。
        - label: 股动脉通路——8 Fr 鞘
          type: process
          note: 8 Fr 可扩张鞘（当前商业瓣膜为 14–16 Fr）。切口更小；血管风险更低。
        - label: 瓣膜输送——无缩短
          type: process
          note: 开放单元支架消除缩短；内在连合对齐。首次通过即可精准释放。
        - label: 球囊扩张
          type: process
          note: 预装在球囊上的瓣膜扩张支架。3 个尺寸（23/26/29 mm）均通过同一 8 Fr 鞘。
        - label: 血流动力学确认
          type: process
          note: 超声核心实验室：EFS 数据显示平均跨瓣压差 6.3 mmHg，AVA 2.8 cm²。EFS n=15 中 PVL 为零。
        - label: 闭合 + 次日出院
          type: output
          note: EFS 患者次日出院且无并发症。小鞘带来的血管创伤更低，与结果一致。
      edges:
        - from: Patient screening
          to: Heart team planning
        - from: Heart team planning
          to: Femoral access — 8 Fr sheath
        - from: Femoral access — 8 Fr sheath
          to: Valve delivery — no foreshortening
        - from: Valve delivery — no foreshortening
          to: Balloon expansion
        - from: Balloon expansion
          to: Hemodynamic confirmation
        - from: Hemodynamic confirmation
          to: Closure + next-day discharge
    claimRefs:
      - CE019
      - CE021
      - CE022
      - CE024
      - CE027
      - CE028
