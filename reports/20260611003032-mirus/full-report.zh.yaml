      - number: '1.4'
        title: 里程碑、产品证明与披露缺口
        blocks:
          - type: paragraph
            body: >-
              MiRus 的公开里程碑线索现在已经足够连成时间轴。2021 年发布的创始人材料描述了扩大后的 Marietta 制造能力、超过 100 项专利，以及合金平台背后数十年的积累。骨科商业化由反复出现的 FDA
              510(k) 许可支撑，包括 2023 年带集成板固定的 3DR 侧路腰椎椎间融合系统，以及 openFDA 记录中多个更早的 EUROPA、IO 和 CYGNUS
              系列器械。结构性心脏里程碑则在之后加速：2024 年 6 月展示 SIEGEL 首例人体数据，2025 年 3 月报告美国早期可行性病例，2025 年后期突出 30 天 EFS 结果，2026 年初宣布 STAR
              关键性试验获得 FDA 无条件批准，Boston Scientific 投资则在 2026 年 5 月落地。缺失指标仍然很多。公开来源没有披露收入、客户数、员工数、Boston Scientific
              交易前的累计历史融资，或骨科收入与 TAVR 烧钱之间的清晰拆分。因此，MiRus 已不再是一家隐藏公司，但作为运营业务仍只披露了一部分。
