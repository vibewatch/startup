companyProfile:
  summary: >-
    MiRus 是一家位于 Georgia Marietta 的私人医疗器械公司，由创始人兼 CEO Jay Yadav 领导。核心资产是 MoRe 钼铼平台，既支撑拥有 24 项 FDA 510(k) 许可的商业化骨科 /
    脊柱植入物组合，也支撑仍在研究阶段的 SIEGEL 球囊扩张式 TAVR 项目。Boston Scientific 2026 年 5 月投资 $1.5 billion，取得约 34% 股权，并持有一项基于里程碑的额外 $3
    billion TAVR 业务期权，使 MiRus 成为市场上战略验证最强、但财务仍不透明的医疗科技初创公司之一。
