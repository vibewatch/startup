  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >-
              MiRus 竞争于两个相邻细分市场：二者共享材料科学底座，但监管、报销和买方结构各不相同。结构性心脏细分市场涵盖所有经导管和外科主动脉瓣置换（TAVR 与
              SAVR）手术、相关输送和影像系统，以及合格医院的结构性心脏服务线基础设施。边界之外包括冠状动脉器械、心律管理、二尖瓣和三尖瓣介入（尽管 MiRus 通过 Boston Scientific
              协议拥有这些资产的期权），以及非心脏血管手术。骨科和脊柱细分市场涵盖融合植入物（椎间融合器、椎弓根螺钉、棒）、保留运动功能的器械、四肢植入物，以及 MiRus 持有 FDA 510(k)
              许可的相邻手术工具。边界之外包括大关节置换（髋、膝）、运动医学、骨生物制品，以及 MiRus
              目前没有销售的机器人辅助手术平台。不同细分市场的现状替代方案差异很大：结构性心脏中，外科主动脉瓣置换（SAVR）和观察等待仍是许多患者群体的临床默认方案；脊柱中，非手术管理（物理治疗、类固醇注射）以及现有巨头的金属合金融合器是基准方案。共同主线在于，MiRus
              的 MoRe 钼铼合金在两个产品家族中替代传统材料（钴铬、镍钛、钛），这是核心差异化主张，但外科医生熟悉既有合金，也构成采用门槛。相邻支出领域包括结构性心脏影像（超声、CT）、机器人脊柱导航和 TAVR
              术后监测；MiRus 目前都未覆盖，但这些领域会影响医院整体预算分配和资本委员会决策。
