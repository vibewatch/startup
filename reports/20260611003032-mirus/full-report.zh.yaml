      - number: '4.3'
        title: 单位经济性、定价基准与利润率代理
        blocks:
          - type: paragraph
            body: >-
              MiRus 没有公开披露其脊柱 / 骨科产品组合的 ASP、毛利率或单台经济性。公开可参考的框架只能来自可比脊柱和 TAVR 医疗科技公司。脊柱植入物领域，竞争格局显示，单台手术硬件 ASP 约为
              $3,000–$15,000，取决于系统复杂度；颈椎和腰椎椎间融合器械通常在 $5,000–$12,000 区间。头部脊柱厂商（Stryker、J&J DePuy Synthes、Zimmer
              Biomet）的毛利率约为产品收入的 60–70%；像 MiRus 的 MoRe 合金系统这类高端材料、差异化更强的产品组合，理论上可以在医院接受其降低翻修手术耐久性风险的临床论据后拿到溢价，但实际 ASP
              仍是私有数据缺口。TAVR 的公开参照点更具体：Edwards Lifesciences 的 SAPIEN 平台和 Medtronic 的 Evolut 系统每枚瓣膜售价约 $25,000–$35,000，与
              Edwards FY2025 TAVR 收入 $4.5 billion、全球估计每年 150,000–200,000 台手术相匹配。CMS 对住院 TAVR 病例（MS-DRG 266–267）的 DRG
              报销通常为每例 $45,000–$60,000，器械成本因此成为医院单次诊疗中最大的单项成本。MiRus 若要具备商业可行性，SIEGEL 定价需落在该区间内或略高；任何高于 SAPIEN/Evolut ASP
              的溢价，都需要用临床或可及性理由证明。8-Fr 输送外径和无镍设计让 SIEGEL 可在特定患者群体（女性、镍过敏患者）争取溢价，但如果没有 TAVR 的新技术附加支付路径（类似脊柱领域 EUROPA 获得的
              NTAP），付款方是否会在现有 DRG 之外额外报销，仍是开放问题。
