        - IO™ Expandable Wedge Osteotomy System 截骨系统
        - 锁定前可在术中实时调整矫正幅度；减少更换尺寸的需要
        - 商业化刚启动（2026 年 2 月）；暂无已发表临床结局
      - - 高血管风险或小血管患者 TAVR
        - 14–16 Fr 鞘系统（Edwards SAPIEN、Medtronic Evolut）要求 ≥5.0–5.5 mm 股动脉通路
        - SIEGEL 8 Fr 输送系统
        - 可经更小股动脉进入；对女性和小体型患者尤其相关
