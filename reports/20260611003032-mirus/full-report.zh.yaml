              USGS Mineral Commodity Summaries 2025 确认，美国铼净进口依赖度为 65%，主要来源在 Kazakhstan、Canada 和 Chile。2020 至 2024
              年，铼价格上涨 33%。MiRus 未披露任何铼供应协议、价格对冲或库存缓冲。供应中断会同时影响 TAVR 瓣膜生产和骨科植入物制造——让 MiRus 整个产品组合出现单点故障。
