      - number: '7.6'
        title: 附录
        blocks:
          - type: callout
            title: 单站点 STAR 入组是最高优先级运营风险
            body: >-
              截至 2026 年 6 月，ClinicalTrials.gov 仅列出 Piedmont Heart Institute 为活跃 STAR 试验站点。1,025 例患者的关键性 TAVR RCT
              不可能在任何有竞争力的时间表内由单一站点完成。15–20 家中心的站点启动是最高优先级运营任务：站点启动每拖延一周，PMA 时间线都会按比例延长，BSX 选择权可行权前的窗口也会拉长。
