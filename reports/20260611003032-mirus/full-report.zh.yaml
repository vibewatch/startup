      - number: '5.3'
        title: Siegel TAVR——结构性心脏平台
        blocks:
          - type: paragraph
            body: >-
              SIEGEL™ Transcatheter Aortic Valve（TAVR）是 MiRus
              的结构性心脏器械，是一种球囊扩张式经导管心脏瓣膜，用于治疗有症状重度主动脉瓣狭窄。器械围绕铼合金框架带来的三项相互关联特性设计：8 French
              可扩张输送鞘、部署时消除短缩的开孔框架、以及内在连合对齐。Boston Scientific 在 2026 年 5 月投资公告中确认，8 Fr 鞘约比当前商用 TAVR 输送鞘小 50%，后者为 14–16
              French。三种瓣膜尺寸——23 mm、26 mm 和 29 mm——均通过同一 8 Fr 鞘输送，瓣膜预装在球囊上。框架覆有氧化氮涂层，瓣叶为抗钙化处理的干式猪心包组织。据 MiRus 和 Boston
              Scientific 称，Siegel 是市场上唯一无镍 THV 系统，可治疗镍过敏患者（MiRus 估计美国人中占 20%）。2024 年 6 月，智利圣地亚哥 Instituto Nacional del
              Torax 治疗 5 名患者的首次人体结果显示，30 天内无死亡、卒中、永久起搏器或血管并发症；平均跨瓣压差为 6.7 mmHg。美国早期可行性研究（EFS，NCT06680427）在五个中心入组 15
              名患者；2025 年 7 月 New York Valves 披露的 30 天数据显示，无死亡、卒中、再住院、血管并发症、瓣周漏或永久起搏器植入。核心实验室超声数据显示平均跨瓣压差 6.3 mmHg，瓣口面积
              2.8 cm²。FDA 于 2025 年 11 月无条件批准 STAR 关键性试验（IDE）。STAR 是一项 1,025 人前瞻性多中心 RCT，按 1:1 随机分配至 Siegel 或商用球囊 / 自膨式
              THV；主要终点为一年死亡、卒中和心血管住院复合终点。首批患者于 2026 年 4 月 8 日在 Piedmont Heart Institute 入组。STAR 试验由 Martin Leon 和 Vinod
              Thourani 主持；全国 PI 包括 Pradeep Yadav、Raj Makkar、Samir Kapadia 和 Philippe Genereux。
