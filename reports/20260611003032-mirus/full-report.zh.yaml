chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、阶段与商业模式
        blocks:
          - type: paragraph
            body: >-
              MiRus 将自己定位为一家医疗科技公司，为心血管和骨科疾病开发自研生物材料、植入物、手术解决方案和监测能力。公司网站、介绍页和技术材料都围绕 MoRe 合金平台展开——MiRus
              的钼铼材料底座，是脊柱、四肢和结构性心脏产品的共同技术主线。公开联系方式显示公司位于 Georgia Marietta，而 Boston Scientific 2026 年 5 月的投资公告称 MiRus
              团队位于 Atlanta；尽调中可支撑的结论是，MiRus 是一家 Atlanta 都会区公司，在 Marietta 设有运营地址。骨科业务已明显越过概念阶段：公司拥有多款获 FDA
              批准的脊柱和四肢产品、制造空间、商业组织和开放的运营岗位。与此同时，结构性心脏项目仍处研究阶段：SIEGEL 球囊扩张式 TAVR 系统正在关键性试验中，尚未在任何国家获准商业销售。MiRus
              因此是一家混合型公司——脊柱 / 骨科已商业化，TAVR 仍处临床阶段，并刚刚围绕结构性心脏上行空间由战略投资者完成再资本化。
