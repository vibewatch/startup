      - number: '3.6'
        title: 图表
        blocks:
          - type: callout
            title: BSX 退出说明既有厂商护城河持久性风险
            body: >-
              Boston Scientific——全球前五大医疗科技公司——尽管投入数亿美元研发和收购支出，仍两次退出 TAVR（Lotus 2020；Acurate 2025）。Acurate IDE 试验失败中，约
              21% 病例的瓣膜扩张不足，导致相对 Edwards 和 Medtronic 的一年结局更差，这是一个具体反向数据点：即使技术上有竞争力的器械，也会遇到采用壁垒，并在异质操作者环境中转化为临床表现不佳。MiRus
              SIEGEL 的 8F 轮廓可能部分改善部署简易性，但 BSX 模式清楚说明，任何新 TAVR 进入者都面对结构性高门槛。
            calloutType: risk
            claimRefs:
              - CP006
              - CP007
              - CP029
              - CP036
          - type: callout
            title: BSX 认购期权造成竞争含混
            body: >-
              Boston Scientific 持有一项 $3 billion 认购期权，可在特定临床和监管里程碑后收购 MiRus 的 TAVR 业务。这一结构让 BSX 同时成为 MiRus
              最具战略意义的投资者和潜在未来竞争者。如果 BSX 行权，MiRus TAVR 失去独立性，其商业命运转由 BSX 的分销优先级决定。如果 BSX 放弃，MiRus 必须独立商业化，对抗 Edwards 和
              Medtronic——这需要搭建商业基础设施，而当前资源若没有额外资本无法支撑。投资者应要求明确期权行权时间线、触发条件，以及 MiRus 独立商业化的备用计划。
