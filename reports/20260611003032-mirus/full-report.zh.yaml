      - number: '7.3'
        title: 制造、供应链与材料风险
        blocks:
          - type: paragraph
            body: >-
              MiRus 在 TAVR（Siegel）和骨科（EUROPA、RIGEL、IO 系统）上的竞争差异，建立在自有 Molybdenum-Rhenium（MoRe）合金之上。这种差异化也是双刃剑：让 MoRe
              更优的同一组属性（铼含量带来的射线不透性、无镍生物相容性、强度和抗疲劳性），也带来供应链脆弱性，因为铼是地球上最稀有、地理分布最集中的关键矿物之一。


              根据 U.S. Geological Survey Mineral Commodity Summaries 2025，美国 2024 年铼表观消费量约为 27,000 kg，净进口依赖度为
              65%。美国初级产量（约 9,500 kg）来自 Arizona 和 Montana 斑岩铜矿中钼精矿焙烧的副产品。高铼酸铵进口——合金生产使用的形态——主要来自
              Kazakhstan（26%）、Canada（24%）和 Poland（15%），另有 35% 来自其他来源。Kazakhstan（主要铼出口国）的地缘政治扰动、Chile
              供应约束（铼金属粉末），或战略材料出口管制，都可能直接影响 MiRus 大规模制造 MoRe 合金的能力。


              铼价格波动大，且已明显上涨：99.99% 纯铼金属颗粒均价 2024 年为 $1,370/kg，高于 2020 年的 $1,030/kg（USGS MCS 2025），四年涨幅约 33%。若价格出现 180
              度反转或进一步飙升—— 2007–2009 年航空航天需求周期曾发生过——MiRus 所有基于 MoRe 的植入物 COGS 可能同时大幅上升。


              公开信息没有披露 MiRus 的铼采购协议、供应商身份、库存缓冲或合同成本保护。2023 年 PubMed 关于 MoRe 离子释放表征的研究（Spine J.
              2023）确认该合金在生理环境中的生物相容性，但没有回答制造可扩展性或供应链冗余问题。MiRus 未披露制造设施所在地、质量管理体系认证（ISO 13485、FDA QSR 21 CFR Part
              820），也未披露把 TAVR 瓣膜产量扩大到临床乃至最终商业规模时的产能约束。
