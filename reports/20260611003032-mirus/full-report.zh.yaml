      - number: '8.2'
        title: 估值语境与可比公司组
        blocks:
          - type: paragraph
            body: >-
              $4.4 billion 隐含股权价值来自简单算术：$1.5 billion 除以约 34%，得到约 $4.4 billion 投后股权价值。这不是独立审计数字，且“约 34%”会引入约 $4.2–4.65
              billion 的区间。Boston Scientific 2025 财年总收入为 $20.07 billion，同比增长 19.9%；心血管板块在 2025 年第四季度增长
              18.2%。这笔投资背后的战略必要性——终止 ACURATE 后重返 TAVR——因此立足于 BSX 增长最快的板块之一。

              对临床阶段 TAVR / 商业化脊柱混合公司做可比分析，四个参照框架合适。第一，上市心血管医疗科技公司：Edwards Lifesciences 报告 2025 财年第四季度 TAVR 销售额 $1.16
              billion（年化约 $4.5 billion），其 SEC 注册的 2025 财年 10-K 于 2026 年 2 月 25 日提交；Medtronic 的心血管相关业务见于其 SEC 注册年报；Boston
              Scientific 的 2025 年 10-K 于 2026 年 2 月 17 日在 EDGAR 提交。这些公司按 EV/TAVR 收入倍数交易，说明高增长结构性心脏业务享有溢价估值——Edwards
              是最强参照。第二，战略 M&A 先例：J&J 2023 年以约 $16.6 billion 收购
              Abiomed，给一家心脏支持设备公司相对往绩收入的显著溢价，说明战略买家会为商业化心脏器械的选择权价值付费。第三，可比脊柱公司：Stryker 2026 年 2 月 11 日提交的 SEC 注册 2025 财年
              10-K 显示，优质脊柱业务按 4–6x 年收入交易——这为骨科板块设定部分底部。第四，临床阶段里程碑逻辑：TAVR 业务在里程碑后有 $3 billion BSX 选择权价值，里程碑前的隐含现值取决于概率加权的
              STAR 结果；公开证据估计为 60–80%（15 名 EFS 患者 30 天无重大不良事件支撑这一估计，但关键随机数据尚未支撑）。

              纯财务投资者若以 $4.4 billion 投后水平承销，回报曲线会很难：即便在牛市情景，BSX 行权也会把 TAVR 对价作为公司层面事件分配给
              MiRus（除非资本结构优先权允许，否则不会直接流向共同投资者）；以 $4.4 billion 投后进入，需要 TAVR 成功并叠加有意义的骨科增长，才可能在 5–7 年周期内越过 2–3x
              回报门槛。估值立场对财务投资者偏紧，对已经拥有行权权利的战略买家 BSX 则公平到有吸引力。
