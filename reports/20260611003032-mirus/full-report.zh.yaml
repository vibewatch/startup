      - number: '4.2'
        title: Boston Scientific 交易经济性与期权结构
        blocks:
          - type: paragraph
            body: >-
              2026 年 5 月 18 日的 Boston Scientific 交易，是 MiRus 历史上最重大的财务事件，应单独分析。Boston Scientific 以 $1.5 billion 取得 MiRus
              约 34% 股权，隐含投前股权价值约 $2.9 billion，投后股权价值约 $4.4 billion。该隐含估值没有在 BSX
              公告之外经过独立审计或验证；它只是由披露的股权比例和投资金额推导出的算术结果。协议还授予 Boston Scientific 一项排他期权，可在若干临床和监管里程碑完成后，以总额 $3 billion
              的额外现金付款收购 MiRus TAVR 业务。另一项期权覆盖 MiRus 二尖瓣和三尖瓣资产，条款未披露。这些结构需要谨慎财务解读。$3 billion 期权不是已承诺义务；Boston Scientific
              保留行权权利，但没有行权义务。里程碑触发条件并未详细公开。站在 MiRus 角度，期权既是验证机制，也是融资后盾——如果 SIEGEL 在 STAR 试验中成功并获得 FDA 批准，BSX 可以用总对价 $4.5
              billion（$1.5B 投资加 $3.0B 期权行权）收购 TAVR 业务，仅就 TAVR 业务而言，相当于在隐含投后股权价值上给出显著倍数。$1.5 billion
              投资本身提供了可观短期资本：即便假设骨科业务有有意义但未披露的经营烧钱，参照公开可比关键性 TAVR 试验成本结构，这笔资金也足以支撑 STAR 试验完成入组和读出。Boston Scientific 2025
              年年收入为 $20.07 billion，其心血管部门增长约 18%，公司还明确提到，在 Acurate 平台退出后有重返 TAVR 市场的战略需要。因此，这笔投资对 BSX 来说体现的是战略选择权，和对
              MiRus 的资本供给同样重要。
