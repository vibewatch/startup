      - - Boston Scientific (BSX)
        - 战略投资者 / 上市公司
        - FY2025 总收入 $20.07B；10-K 于 2026-02-17 提交；2025 Q4 心血管 +18.2%
        - $1.5B 换 34% 股权，隐含 MiRus 投后估值 $4.4B
        - 直接定价方；BSX 是主要估值锚
        - BSX 买的是战略期权，不是纯财务回报；推高了隐含价值
      - - Medtronic (MDT)
