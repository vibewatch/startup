      - number: '6.4'
        title: 留存、重复使用与客户耐久性
        blocks:
          - type: paragraph
            body: >-
              公开记录中，两个业务板块都没有留存指标——净收入留存率（NRR）、总留存率、流失率、合同期限、续约数据或队列分析。对于一家商业骨科收入基础未披露、TAVR
              项目完全处于研究性阶段的私营公司，这是可预期的现实，但也让全部客户耐久性分析都停留在推测层面。


              TAVR 领域，商业账户通常意义上的「留存」概念尚不适用：试验中心按 MiRus 的 CRO 和临床事务团队管理的 IDE 方案参与，而不是按商业供应协议参与。完成 EFS 入组的临床中心预计会在 MiRus
              安排下转入 STAR 关键性试验，这代表一种顺序参与，但由监管管线路径驱动，不是客户忠诚度。TAVR
              更相关的耐久性问题，是核心研究者是否会在获批后继续倡导该器械：Yadav、Thourani、Makkar、Leon、Kapadia 和 Genereux
              已发表的背书显示，医生倡导者高度一致，但商业采用取决于系统经济性、FDA 批准时点和上市后注册体系。


              骨科 / 脊柱领域，最相关的耐久性代理指标应是复购率——接受 EUROPA® 或 IO™ 产品培训的外科医生，是否会继续偏好它们而非钛或 CoCr
              替代方案。棒断裂终身有限保修是一种结构性留存激励（持续产品支持），GALILEO™ 生态则增加程序切换成本。不过，没有可用的使用率或复购数据。NTAP 创造了一个两到三年窗口，期间医院经济性有利于 EUROPA®
              PCF 采用；窗口结束后，价格竞争会正常化。没有发现 CMS 申报数据或商业合同数据可证实医院持续使用。
            claimRefs:
              - CU027
              - CU028
              - CU029
              - CU030
              - CU031
