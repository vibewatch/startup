      - number: '5.7'
        title: 附录
        blocks:
          - type: callout
            title: 8 Fr TAVR 输送——相对竞争对手的结构性断裂
            body: >-
              Siegel TAVR 的 8 French 输送鞘约比当前商用 TAVR 系统小 50%。这不是渐进式改善，而是由铼合金径向强度 / 规格比带来的结构性设计断裂。20 名患者（FIH + EFS）30
              天随访中记录到零血管并发症。小外径优势尤其适用于估计占 TAVR 患者 30–40% 的女性、外周动脉疾病患者，以及未来 TAVR 扩展到更年轻低风险人群时——这些场景里长期血管安全性更重要。
            calloutType: strength
            claimRefs:
              - CE019
              - CE024
              - CE026
              - CE027
          - type: callout
            title: STAR 前，SIEGEL 临床证据基础仍薄
            body: >-
              MiRus 企业价值驱动因素最强的近期技术风险，是仅依赖 20 名患者（n=5 FIH 加 n=15 EFS）的短期（30 天）随访数据，来支撑 $3 billion 期权和更广泛的 TAVR 叙事。STAR
              试验是决定性关口。STAR 需要入组 1,025 名患者并至少随访一年，意味着从 2026 年 4 月开始入组算起，主要数据读出最早现实上也要到 2027 年末。PMA 申报和后续 FDA
              审评还会继续推迟。5–10 年维度的长期 TAVR 结局，包括结构性瓣膜退化、瓣周漏耐久性和起搏器率，完全未知。
            calloutType: risk
            claimRefs:
              - CE026
              - CE027
              - CE030
              - CE045
              - CE046
          - type: callout
            title: BSX 的 $3B TAVR 期权价格意味着验证底线和剩余风险
            body: >-
              Boston Scientific 在临床和监管里程碑达成后，可追加 $3 billion 收购 MiRus TAVR 业务的独家期权（在其 $1.5 billion
              股权投资之外），既是证实信号，也是警示信号。它证实一家领先心血管战略方足够看重 Siegel 技术差异化，愿意为期权支付溢价。它也值得警惕，因为期权有条件——只有 MiRus 达成特定里程碑后才可行使，而
              Boston Scientific 尚未承诺为这些里程碑提供资金。$3B 期权价格本身也带条件；它不代表已保证发生的企业事件。
            calloutType: insight
            claimRefs:
              - CE039
              - CE040
              - CE041
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与买方 / 用户 / 付款方架构
        blocks:
          - type: paragraph
            body: >-
              MiRus 服务两个结构上截然不同的客户群体，它们在买方身份、采用证明、支付机制和风险画像上都不同。TAVR
              板块中，「客户」是医院结构性心脏项目及其获得资质的介入心脏病专家和心脏外科医生团队。目前全球任何地方都不存在商业 TAVR 交易：Siegel 器械是 investigational device
              exempt（IDE）产品，唯一获授权终端用户是纳入 IDE 批准 EFS 和 STAR 关键性试验的临床研究者。研究性器械使用由 MiRus 赞助，按 CMS Coverage with Evidence
              Development（CED）规则报销，不涉及医院采购、院内目录评审或供应链合同。CMS 于 2026 年 3 月 27 日按 CED 批准 STAR 试验，EFS 于 2025 年 3 月 28
              日获批。因此，MiRus TAVR 今天的「客户」是具名试验中心的具名临床研究者——是临床合作伙伴，不是付费商业账户。


              骨科和脊柱板块中，买方是通过 MiRus 分销商网络采购植入系统的医院、门诊手术中心（ASC）或私人外科诊所。终端用户是脊柱和骨科外科医生。付款方通常是商业保险或
              Medicare/Medicaid，手术报销流向医疗机构。EUROPA® PCF 系统获得 CMS New Technology Add-on Payment（NTAP），FY2026 生效（2025 年 8
              月宣布），为采用该产品的医院提供按病例增加的附加支付——这是 PCF 有意义的采用激励，尽管 NTAP 通常仅持续两到三年。骨科 /
              脊柱业务没有公开披露收入、客户数、账户名称或合同结构。公司分销商页面收集询盘，但不列出现有合作伙伴名称。
