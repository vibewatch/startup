      - number: '6.6'
        title: 附录
        blocks:
          - type: callout
            title: TAVR 中医生倡导者极度集中
            body: >-
              截至 2026 年 6 月，Piedmont Heart Institute 是 STAR 关键性试验唯一公开确认的活跃中心，试验共同主席（Thourani）和一名全国 PI（Yadav）都在该机构。如果
              Yadav 或 Thourani 任一人的支持因离职、健康或利益冲突而流失，将实质性扰乱主中心入组，并在关键性试验的关键阶段削弱 MiRus TAVR 可信度叙事。
            calloutType: risk
            claimRefs:
              - CU032
              - CU034
          - type: callout
            title: 骨科 / 脊柱没有具名商业客户
            body: >-
              尽管持有 24 项 FDA 510(k) 许可并已商业运营数年，MiRus 没有为任何骨科或脊柱产品具名一家医院、ASC
              或外科中心客户。因此，公开来源无法评估客户集中度、收入耐久性、分销商健康度或竞争定位。尽调必须包括具名账户清单、前 10 大客户收入集中度和分销商合同条款。
            calloutType: risk
            claimRefs:
              - CU025
              - CU026
              - CU027
          - type: callout
            title: 试验研究者不是商业客户——这是关键区分
            body: >-
              MiRus TAVR「客户」参与的全部公开证据，描述的都是 IDE 方案下的临床试验参与，不是商业采购。Piedmont 和 Cedars-Sinai
              的具名医生是主要研究者，对试验负有临床和监管义务——他们不是在商业上评估器械并选择采购以替代竞品的客户。商业客户证明要等 FDA PMA 批准后才会出现，可能在 2028 年或更晚。
            calloutType: insight
            claimRefs:
              - CU001
              - CU003
              - CU019
              - CU021
          - type: callout
            title: TAVR 商业化风险——BSX 退出 ACURATE 的先例
            body: >-
              Boston Scientific 的 ACURATE Neo2 和 ACURATE Prime TAVR 器械曾在欧洲取得显著商业牵引力，但 FDA 拒绝批准后于 2023 年末退出全球市场。这为 TAVR
              器械开发漏斗建立了一个反向参照案例：试验参与和研究者热情不能保证商业客户采用或监管成功。
            calloutType: risk
            claimRefs:
              - CU038
