  - id: FM003
    title: 买方与支付方分群图——TAVR vs. 脊柱
    type: matrix
    layout: wide
    summary: 比较 TAVR 与脊柱两个分部的决策者、支付方和采用路径。
    data:
      columns:
        - TAVR / 结构性心脏
        - 脊柱植入物
        - 关键差异
      rows:
        - label: 预算负责人
          values:
            - 医院服务线 VP / CFO（资本预算）
            - 脊柱外科科室负责人 / 供应链（供应预算）
            - TAVR 是资本委员会决策；脊柱是供应链决策——销售周期不同
        - label: 临床决策者
          values:
            - 多学科心脏团队（心脏科医生 + 心脏外科医生；强制）
            - 单个脊柱外科医生（偏好驱动寄售）
            - TAVR 有监管强制的团队关口；脊柱由外科医生驱动
        - label: 主要支付方
          values:
            - Medicare（约 75–80% 美国手术）
            - Medicare + 商业保险 + 工伤赔偿（更多元）
            - TAVR 支付方集中带来 CMS 政策风险；脊柱报销集中度较低
        - label: 报销机制
          values:
            - 基于 DRG 的住院报销（MS-DRG 266/267）；在研器械适用 CED
            - DRG 或 ASC 费用表；商业打包支付增加
            - CED 约束只适用于审批前 TAVR；脊柱有即时商业化路径
        - label: 切换成本
          values:
            - 非常高：资质认证、培训、影像设置、团队合同
            - 中等：寄售物流、围绕合金重新培训外科医生、销售代表关系
            - TAVR 的结构性切换壁垒高得多
        - label: 项目集中度
          values:
            - 约 700–900 个美国认证中心（SCAI/STS/ACC/AATS 要求）
            - 4,000+ 个脊柱手术点（医院 + ASC）
            - 脊柱市场更分散，分销覆盖面更广，但单账户收入更低
    notes: >-
      TAVR 买方数据来自 SCAI/STS 共识文件和 CMS 覆盖政策。脊柱买方数据根据 JnJ DePuy Synthes、Stryker 和 Zimmer Biomet 的产品与分销页面推断。支付方结构百分比为估计值， 基于
      GVR 终端使用数据以及老年患者人群中的 Medicare 覆盖率。
    claimRefs:
      - CM010
      - CM011
      - CM015
      - CM016
      - CM018
      - CM025
      - CM034
      - CM035
