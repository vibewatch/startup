      - number: '1.3'
        title: 股权结构与战略交易
        blocks:
          - type: paragraph
            body: >-
              公司概况里最关键的事实，是 Boston Scientific 2026 年 5 月 18 日的战略投资。Boston Scientific 披露以 $1.5 billion 投资取得 MiRus 约 34%
              股权，隐含股权价值略高于 $4.4 billion。该协议不是普通的少数股权成长轮：Boston Scientific 还获得一项排他期权，可在特定临床和监管里程碑完成后，以总额 $3 billion
              的额外现金付款收购 MiRus TAVR
              业务，并进一步持有二尖瓣和三尖瓣资产期权。这一结构既验证公司，也提醒风险。验证在于，全球最大心血管战略方之一在产品获批前投入了巨额资本。风险在于，头部企业叙事仍依赖尚未达成的里程碑，Boston
              Scientific 最终取得完全控制权也是今天的选择权，而非既定义务。Fierce Biotech、MedTech Dive、Nasdaq 和 Quartz
              的第三方报道与基本经济条款一致，也强化了一个结论：心脏瓣膜项目是这次融资事件背后的价值驱动因素。
