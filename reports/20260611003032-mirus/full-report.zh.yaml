      - number: '6.2'
        title: TAVR 临床参与——中心、研究者与证据层级
        blocks:
          - type: paragraph
            body: >-
              MiRus「客户」参与度最清晰、颗粒度最高的证据，来自其 TAVR 试验项目。美国早期可行性研究（EFS，NCT06680427）中，MiRus 在五个美国中心入组 15 名患者（2025 年 3
              月至年底）。这五个中心里，只有两个通过新闻稿和独立行业报道公开确认名称：亚特兰大的 Piedmont Heart Institute 和洛杉矶的 Cedars-Sinai Smidt Heart
              Institute。Piedmont Heart Institute 结构性介入主任 Pradeep K. Yadav 医生完成首批 EFS 病例，并在 2025 年 6 月 New York Valves 上与
              Cedars-Sinai Smidt Heart Institute 介入心脏病学主任 Raj Makkar 医生一起披露 30 天结果。30 天时，全部 15
              名患者中记录到零死亡、卒中、再住院、血管并发症、瓣周漏或永久起搏器植入；平均跨瓣压差为 6.3 mmHg，平均瓣口面积为 2.8 cm²。上述结果在大会发言环节呈现，构成来自两个具名高声誉中心的医生层面器械背书。


              关键性 STAR 试验（NCT07278310）中，MiRus 于 2026 年 4 月 8 日在 Piedmont Heart Institute 入组并治疗首批患者。截至 2026 年 6
              月，ClinicalTrials.gov 记录仅列出 Piedmont Heart Institute 为活跃招募中心；尽管试验设计要求在多个美国中心入组，其他中心尚未出现在注册表中。公开具名的试验主席包括
              Martin Leon, MD（Columbia University Medical Center）和 Vinod Thourani, MD（Piedmont Heart Institute）；全国 PI 包括
              Pradeep Yadav、Raj Makkar、Samir Kapadia 和 Philippe Genereux。他们的机构归属代表 STAR 试验中心预期的地理分布（东海岸学术中心、Atlanta、Los
              Angeles、Cleveland Clinic、Atlantic Health），但注册表尚未发布完整中心名单。


              首次人体手术于 2024 年 6 月在智利圣地亚哥 Instituto Nacional del Torax 完成，涉及 5 名重度有症状主动脉瓣狭窄患者。30
              天结果显示无死亡或卒中、无永久起搏器需求，平均超声跨瓣压差为 6.7 mmHg。


              这些研究者扮演医生倡导者和采用验证者角色，不是商业客户。他们的参与生成临床证据和专业学会能见度，但不会创造合同性商业关系，不会为 MiRus 产生收入，也不能证明市场层面的采用。
