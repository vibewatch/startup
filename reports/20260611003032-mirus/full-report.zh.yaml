  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与业务单元结构
        blocks:
          - type: paragraph
            body: >-
              MiRus 在单一控股实体下并行运营两种结构不同的收入模式。第一种是脊柱和骨科中的常规医疗器械商业业务：MiRus 通过分销网络向医院和门诊手术中心销售 FDA
              批准的硬件植入物和手术器械。公开来源确认的产品组合包括至少 24 款 510(k) 获批器械，覆盖颈椎（EUROPA PCF、RIGEL、CYGNUS 系统）、腰椎（IO Expandable Lumbar
              Interbody、ANTARES、3DR LLIF）、四肢（IO Expandable Wedge
              Osteotomy）和手术解决方案（GALILEO、VITESSE）。商业机制符合高端脊柱的标准做法：MiRus 交付寄售器械托盘，通过植入物销售按手术产生收入，并以 MoRe 合金的机械属性以及近期 CMS 对
              EUROPA PCF 系统的 NTAP 报销支持形成差异化。NTAP 资格于 2024–2025 年生效，使符合条件的 Medicare 住院病例可获得增量报销，降低医院采用的经济摩擦，但其本身不构成 MiRus
              的直接收入线。第二种业务尚未商业化：SIEGEL TAVR 系统是 STAR 关键性试验中的研究性器械。今天没有 TAVR 收入；这条线的相关财务指标是临床试验烧钱和监管支出，而非销售额。Boston
              Scientific 2026 年 5 月投资和期权结构，是 TAVR 线的主要融资工具。两条线共享 MoRe 合金平台和制造基础设施，带来一定运营杠杆，但收入时间、风险画像和资本需求存在实质差异。
            claimRefs:
