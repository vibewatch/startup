      - number: '4.6'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              MiRus 的财务画像由两股相互拉扯的现实决定。第一是战略验证：BSX 以隐含约 $4.4 billion 股权估值投资 $1.5 billion，并持有 TAVR 业务 $3 billion 期权，这是
              TAVR
              品类中规模最大的获批前医疗器械融资事件之一，也为试验完成提供了充足近期资本。第二是信息不透明：公司不披露收入、利润率、烧钱速度或单台经济性。因此，仅靠公开数据无法完整承销这一财务案例。骨科板块的收入质量可以部分推断——24
              个获批产品、CMS NTAP 支持、以及运转中的分销渠道，说明公司有真实商业化业务——但规模、增长轨迹和利润率结构均未知。TAVR 业务完全处于收入前阶段：SIEGEL 仍是研究性器械，STAR
              正在入组；即便按乐观监管时间表，任何 TAVR 收入至少也在 3–5 年之后。BSX 交易基本解决了资本充足性问题：$1.5 billion 足以支持 STAR
              入组和主要终点读出。承销卡点不是资本充足性本身，而是期权依赖：如果 STAR 不能在一年复合终点上证明相对 SAPIEN 或 Evolut 的非劣效，BSX 没有义务行使 $3 billion
              期权，独立企业价值将回落到骨科业务加任何剩余管线期权价值。没有尽调访谈，利润率路径分析仍属推测：MoRe 合金差异化可能支撑脊柱和 TAVR 双线溢价，但制造可扩展性、COGS
              轨迹、实际价格与标价差异，都是私有数据缺口。结论是：MiRus 的财务画像在战略上成立，但运营层面不透明——足以进入高兴趣尽调队列，但没有私有访问权限前尚不能承销。
            claimRefs:
              - CI039
              - CI040
              - CI041
              - CI042
              - CI043
      - number: '4.7'
        title: 附录
        blocks:
          - type: callout
            title: BSX 交易验证规模，并提供充足近期资本
            body: >-
              战略收购方明确需要重返 TAVR 市场，并以隐含约 $4.4 billion 投后股权估值投资 $1.5 billion，这是高质量外部验证事件。按保守假设，这笔资本足以支持 STAR 入组和读出。里程碑结构下的
              $3 billion 期权，让 Boston Scientific 的激励与 MiRus 临床成功绑定，在试验期形成较好的委托代理一致性。
            calloutType: strength
            claimRefs:
              - CI009
              - CI010
              - CI013
              - CI015
          - type: callout
            title: TAVR 期权有条件——里程碑失败会触发再资本化风险
            body: >-
              $3 billion 收购期权不是已承诺义务。如果 STAR 试验不能在一年复合终点上证明相对 SAPIEN/Evolut 的非劣效，Boston Scientific 无需行使期权。届时 MiRus 会保留
              $1.5 billion 投资（扣除已发生烧钱），但失去 TAVR 业务的主要退出机制，$4.4 billion 隐含股权估值也难以维持。骨科业务将独自承担证明独立价值的压力。这是财务画像中的主要承销风险。
            calloutType: risk
            claimRefs:
              - CI013
              - CI014
              - CI040
              - CI043
          - type: callout
            title: 收入和利润率不透明，是阻断尽调的缺口
            body: >-
              MiRus
              没有公开披露任何业务单元的收入、毛利率、烧钱速度或单台经济性。任何基于公开来源对该公司建模，都必须使用置信度很低的假设基准。因此，单靠公开数据无法从运营层面承销公司；任何资本承诺前都必须获得私有数据室访问权限。
            calloutType: risk
            claimRefs:
              - CI033
