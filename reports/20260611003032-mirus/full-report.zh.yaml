  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              MiRus 的投资论点建立在三根相互强化的支柱上。第一，MoRe 合金平台构成结构性差异化材料底座——24 款获 FDA 510(k) 许可的骨科器械和一款无镍、耐腐蚀的结构性心脏瓣膜共享同一专有合金，让
              MiRus 能提出专利护城河主张，纯脊柱玩家和 TAVR 现有厂商都难以轻易复制。第二，SIEGEL TAVR 系统击中真实的大市场需求：全球 TAVR 市场 2024 年为 $6.8 billion，并以
              6.6% CAGR 增长，预计 2030 年约 $9.9 billion；Edwards 控制美国约 60–70% 量级。任何耐久的新进入者在 $10 billion 市场中拿下 3–5% 份额，按当前
              $25,000–$35,000 的 TAVR ASP 计算，都是 $300–500 million 年收入机会。第三，Boston Scientific 的 $1.5 billion
              投资不只是被动资本，而是来自全球第二大心血管医疗科技公司的战略背书；它审阅了 MiRus 的专有数据室，并认定 SIEGEL 值得押下九位数资金外加 $3 billion 选择权。选择权结构本身是最看多的部分：若
              BSX 行权，总对价意味着 TAVR 业务获批后的单独估值超过 $3 billion，相对于 Edwards 约 10–12x 年 TAVR 收入、反映在公开市值中的收入倍数，这一水平可信。

              反论点同样严肃。MiRus $4.4 billion 的隐含股权价值完全处于获批前：SIEGEL 仍在一项 1,025 例患者的关键试验中，尚未在任何国家获准商业销售。STAR 试验 1
              年主要复合终点意味着，最早可行的 PMA 递交时间是 2027 年中；在乐观监管时间表下，最早获批时间是 2027 年末至 2029 年。Boston Scientific 自身记录也提供警示：它在每年约投入
              $200 million（全球每季度约 $50 million）后，于 2025 年第二季度终止 ACURATE neo2 和 ACURATE Prime TAVR 平台，因为项目未能获得 FDA
              批准；这说明即便资本充足的现有厂商，也可能遭遇二元化的 TAVR 监管失败。收入、ARR、毛利率、客户数和历史融资均未公开，无法独立承销。$3 billion 的 BSX 选择权不是承诺义务——BSX
              有权但没有义务行权；如果 STAR 未达终点，选择权失效，MiRus 将可能需要以显著低于当前隐含估值的水平，为 TAVR 项目进行资本重组。骨科商业业务提供部分底部支撑，但按同业倍数估算，若没有 TAVR
              上行空间，几乎不可能支撑接近 $4.4 billion 的独立估值。
