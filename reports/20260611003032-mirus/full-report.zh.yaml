        Covers publicly-traded TAVR and spine medtech comparables (Edwards, BSX, Medtronic, Stryker, Abbott) plus
        selected strategic M&A transactions; excludes private TAVR startups (Anteris, Pi-Cardia) due to insufficient
        public financial data; excludes non-cardiovascular medtech. As of 2026-06-11.
    rows:
      - - Edwards Lifesciences (EW)
        - 上市公司
        - FY2025 TAVR 收入约 $4.5B；10-K 于 2026-02-25 提交
        - 约 10–12x EV / TAVR 收入（由市值隐含）
