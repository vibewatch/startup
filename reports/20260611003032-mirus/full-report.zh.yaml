      - number: '8.4'
        title: 退出就绪度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              MiRus 的主要退出路径是 BSX 行权：一条结构化、预先谈好的路线，在临床和监管里程碑达成后，以 $3 billion 将 TAVR
              业务出售给战略买家。对一家临床阶段私人公司来说，这是异常清晰的退出路径，也降低了结构性心脏板块走传统 IPO 或竞拍流程的必要性。TAVR 选择权行权后，MiRus
              可以保留骨科业务，也可以单独卖给脊柱战略买家（J&J DePuy Synthes、Stryker、Zimmer Biomet）。若 BSX 不行权且公司在骨科达到足够规模，合并实体二次 IPO 也有可能。

              TAVR 路线的退出就绪度完全由里程碑卡口决定：STAR 主要终点读出、FDA PMA 审评和 CMS 覆盖决定，是选择权可行权前必须依次通过的三道门。骨科业务已经商业化，理论上可在不依赖 TAVR
              的情况下具备退出条件；但收入规模未披露，外部投资者无法看清任何战略出售价格。

              承销这笔投资需要补齐大量最终尽调问题：私人财务报表，用来确认骨科收入、毛利率和现金消耗率；STAR 入组速度数据（已启动站点、每月入组患者数与计划对比）；股权结构表，显示 BSX
              前稀释历史、优先权结构和共同投资者身份；铼供应协议和 COGS 轨迹；BSX 选择权里程碑定义原文；以及 EUROPA PCF 的 CMS NTAP
              状态和到期时间。这些缺口是实质性承销阻碍，无法仅靠公开证据解决。
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
              - CV046
              - CV048
