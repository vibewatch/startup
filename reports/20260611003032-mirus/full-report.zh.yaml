      - number: '2.2'
        title: 市场规模——多重视角
        blocks:
          - type: paragraph
            body: >-
              没有单一权威来源能同时可靠给出 MiRus 特定可服务人群的结构性心脏和脊柱市场规模，因此分析采用多重视角，并需要相互校准，而不是简单取平均。结构性心脏方面，Grand View Research 估计 2024
              年全球 TAVR 市场为 USD 6.8 billion，预计到 2030 年以 6.6% CAGR 增至约 USD 9.9 billion。基于手术量集中度数据，North America 约占全球 TAVR
              收入 50% 或更高，隐含美国 - 加拿大可服务市场约 USD 3.4 billion 至 USD 4.5 billion。该估计存在重大不确定性，因为没有公开来源提供独立于合并结构性心脏项目报告的可靠美国
              TAVR 单项收入数字。第二个视角采用手术量：美国每年约 90,000 至 130,000 例 TAVR 手术（范围基于 TVT Registry 和截至 2023 年的学术报告），平均器械成本约 USD
              30,000 至 USD 35,000，自下而上估算得到 USD 2.7 billion 至 USD 4.6 billion，与 GVR 自上而下数字大体一致。脊柱植入物方面，Grand View
              Research 估计 2024 年全球市场为 USD 13.9 billion，到 2033 年以 6.0% CAGR 增至 USD 23.1 billion；North America 占 47.8%，隐含
              2024 年美国 - 加拿大细分市场约 USD 6.6 billion。MiRus 目前没有公开披露脊柱组合收入，无法计算当前市场份额。冲突估计仍存在：包括 iData Research、Emergen
              Research 和 Grand View Research 在内的多份分析师报告采用不同基准年份、手术定义和地理范围，使 2024 年全球脊柱市场估计落在 USD 11.8 billion 至 USD 14.3
              billion，2032–2033 年 CAGR 范围为 5% 至 6.1%。对 MiRus 尽调而言，两组数字都应视为数量级锚点，而非投资级输入。
