  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与临床试验风险
        blocks:
          - type: paragraph
            body: >-
              MiRus 面临的最大风险是监管：Siegel TAVR 系统作为 Class III 器械需要获得 FDA Pre-Market Approval（PMA），而历史上没有任何 TAVR
              能在没有成功的大规模随机对照试验情况下获得 PMA。STAR 关键性试验（NCT07278310）目标是在约 20 个美国中心入组 1,025 名患者；截至 2026 年 6
              月，ClinicalTrials.gov 仅列出 Piedmont Heart Institute 为活跃招募中心。EFS 用约 12 个月（2025 年 3 月至年底）在五个中心入组 15
              名患者；如果没有多中心并行，仅按这一速度外推到 1,025 人，试验完成时间将远超 2030 年，PMA 审评还会在数据锁定后再增加 12–18 个月。FDA 2020 年指南要求结构性心脏 PMA 申报包含
              30 天、1 年和 5 年随访终点，形成无法在不额外启动中心情况下加速的多年监管时钟。


              FDA 授予 Siegel TAVR 面向镍过敏患者亚群的 Breakthrough Device Designation——这是有意义的监管收益，可增强与 FDA
              的互动并可能加快审评。不过，Breakthrough Designation 不会降低临床证据门槛：STAR 试验仍必须在复合安全性和有效性主要终点上，证明相对已批准对照器械（SAPIEN 3、Evolut
              FX）的非劣效或优效。Boston Scientific 的 Acurate neo2 是警示先例：在获得 CE 标志、欧洲商业销售和积极早期注册数据后，ACURATE TAVR 项目因 FDA 要求的 IDE
              试验显示其未达到相对 SAPIEN 和 Evolut 的预设非劣效界值，在 2023–2024 年正式终止，导致 BSX 放弃整个项目。Siegel 虽然有有利的 15 人 EFS
              数据，但在试验规模扩大后仍可能遇到耐久性、血流动力学或安全性问题；这一风险真实存在，且在 STAR 主要终点达成前无法量化。


              CMS 覆盖增加了第二个监管维度。STAR 试验于 2026 年 3 月 27 日获得无条件 Coverage with Evidence Development（CED）批准，使试验手术可获得 Medicare
              报销。CED 批准只覆盖试验范围——并不预先授权商业报销。PMA 后商业上市需要新的 CMS 覆盖决定（NCD 或 LCD），可能需要 12–24 个月，并可能要求所有商业病例登记到 TVT
              Registry（当前所有 TAVR 都有此要求）。如果 FDA 只批准狭窄适应症（例如镍过敏患者的有症状重度 AS），可寻址商业人群会大幅缩小，进而压低商业收入预测和 BSX 期权的预期价值。


              骨科和脊柱产品的近期监管风险较低：EUROPA PCF 系统拥有 510(k) 许可和 CMS NTAP（FY2026 生效）。IO Expandable Wedge 系统拥有 510(k)
              许可（K232154，2023 年 9 月）。不过，NTAP 有时间限制——CMS 通常授予两到三个财年的 NTAP，之后附加支付失效，医院需在 DRG
              报销内吸收全部成本，可能削弱采用激励。公开来源没有识别到针对 MiRus 的监管调查、警告信或 483 观察项。
