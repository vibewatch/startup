    title: 增长驱动因素与采用约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 对 MiRus 的影响
      - 尽调问题
    rows:
      - - 全球人口老龄化（60 岁以上人口到 2050 年翻倍至 21 亿）
        - 驱动因素
        - 持续至 2030 年以后
        - 随时间扩大 AS 发病基数和绝对手术量
        - 确认美国 AS 发病率是否能转化为现有积压之外的增量手术量
      - - 适应症扩展至无症状重度 AS（FDA 2025 年 5 月批准 SAPIEN 3；CMS NCD 复议进行中）
        - 驱动因素
        - 若 CMS 扩大覆盖，则为 2025–2027 年
        - 可能新增 300,000+ 名符合条件的美国患者；但也会强化 Edwards 的领先位置
        - 获取 CMS NCD 最终决定；建模其对竞争性 ASP 压力与销量增长的影响
      - - TAVR 使用转向更年轻、低风险患者（到 2022 年，<65 岁群体占 51.7%）
        - 驱动因素
        - 正在加速；持续推进
        - 耐久性权重上升；利好 MoRe 这类生物相容性更好的材料
        - 委托长期耐久性比较；评估 SIEGEL 瓣膜寿命数据管线
      - - CMS 对 SIEGEL 的 CED 要求（仅 STAR 试验入组）
        - 约束
        - 直至 FDA 批准（若 STAR 按计划推进，约 2027–2028 年）
        - 商业收入仅限试验中心报销；获批前无法商业化上市
        - 梳理 STAR 中心数量和入组速度；识别 CED 可能扩展的路径
      - - 机构资质认证要求（AATS/ACC/SCAI/STS）
        - 约束
        - 永久性结构门槛；覆盖所有 TAVR 中心
        - 可服务市场限于约 700–900 家获得资质的美国中心
        - 确认多少 STAR 中心与具备资质的高量中心重合
      - - 在位者市场集中（Edwards + Medtronic 占主导；BSX ACURATE 已停产）
        - 约束
        - 持续存在；经销商关系根深蒂固
        - 夺取份额需要拿出相对 SAPIEN 和 Evolut 足够有说服力的差异化数据；BSX 的 ACURATE 失败入局是反向先例
        - 要求 MiRus 提供竞争胜负数据；评估独立头对头数据时间表
      - - FDA 批准后的报销滞后（CMS NCD 更新需 12–24 个月）
        - 约束
        - FDA 批准后适用
        - 器械已获批但无法按商业费率报销，会形成收入空窗
        - 建模报销延迟情景下的现金流；评估新 TAVR 的 DRG 定价
      - - 资本强度（混合手术室、CT 影像、超声心动、体外循环）
        - 约束
        - 持续存在
        - 限制向社区中心扩张；MiRus 8Fr 鞘管降低血管通路成本，但不降低房间 / 影像成本
        - 评估 SIEGEL 的 8Fr 轮廓是否打开 14-16Fr 竞品无法触达的社区中心机会
    notes: 时间判断是截至 2026 年 6 月所收集监管和临床证据基础上的定性估计。BSX ACURATE 停产引用自公开抓取数据（PDF 访问受阻）；建议进一步核验。
