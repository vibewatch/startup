      - number: '8.5'
        title: 附录
        blocks:
          - type: callout
            title: 获批前二元性——核心估值风险
            body: >-
              MiRus 隐含 $4.4 billion 股权价值，完全取决于 SIEGEL 成功完成 STAR 关键试验并获得 FDA PMA 批准。今天没有收入、没有批准，也没有已承诺的收购。Boston
              Scientific 在多年开发后，于 2025 年第二季度终止 ACURATE neo2 和 ACURATE Prime TAVR 平台，说明即便大公司 TAVR
              项目也可能失败——在该案例中，一个资金充足的项目毁掉了大量资本。STAR 终点失败会立即抹去 $3 billion BSX 选择权，并迫使公司以大幅更低估值资本重组。任何以 $4.4 billion
              投后或接近该水平进入的投资者，都必须显式定价这种二元性。
            calloutType: risk
            claimRefs:
              - CV007
              - CV023
              - CV024
              - CV029
              - CV035
          - type: callout
            title: 建议——继续研究，并设置具体复评触发点
            body: >-
              建议立场是继续研究。三项触发点应立即启动复评：（1）STAR 主要终点读出（决定 $3 billion 选择权推进 / 终止），（2）MiRus 私人财务披露，确认骨科收入、毛利率和现金消耗率，（3）股权结构表
              透明度，确认 BSX 行权情景下共同投资者经济权利。没有这些信息，公开证据不足以完整承销 $4.4 billion 进入价格。密切跟踪 MiRus 的理由很强——BSX
              背书是获批前最高质量的认可，骨科商业化平台也提供部分底部——但跟踪不等于必须按当前隐含估值投入资本。
            calloutType: recommendation
            claimRefs:
              - CV025
              - CV038
              - CV039
              - CV040
              - CV046
          - type: callout
            title: 收入和财务指标未公开——所有数字都是估计
            body: >-
              MiRus 未公开披露收入、ARR、毛利率、客户数、员工数或历史融资金额。本章所有财务估计——包括骨科收入区间、TAVR 市占率情景和隐含可比倍数——都来自同业公司的公开基准，或来自 BSX
              新闻稿披露的交易经济条款。这些估计不应视为 MiRus 提供的数字，且可能与实际结果存在重大差异。
            calloutType: assumption
            claimRefs:
              - CV025
              - CV034
              - CV038
