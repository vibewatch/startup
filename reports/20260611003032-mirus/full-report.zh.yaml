      - number: '2.5'
        title: 采用约束、报销与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              多重结构性约束限制 TAVR 新进入者的采用速度，这与临床价值高低无关。AATS、ACC、SCAI 和 STS 共同制定的机构资质要求规定，医院必须拥有完整结构性心脏项目，包括现场心脏外科、心导管室、CT
              影像、多学科心脏团队和有记录的手术量，才能商业化提供 TAVR。这些要求实际上把商业市场限制在已经投入大量资本并达到足够病例量的医院，将 TAVR 收入集中在美国约 700–900 家高量中心。对 MiRus
              来说，STAR 关键性试验在 CMS 批准的 CED 中心入组，在获批前只能接触这一小部分研究中心；每新增一个 SIEGEL 中心都需要 MiRus 无法绕开的资质基础设施。报销时间是第二重约束：即便 FDA
              批准，新 TAVR 器械的 CMS 覆盖决定可能需要 12–24 个月，形成一个窗口期，FDA 已批但尚未报销的手术会让医院承担成本风险。外科医生培训和带教要求进一步增加采用摩擦；新 TAVR 平台通常需要
              10–20 例监督病例，医生才可获得独立植入认证，从而放大每个中心的上线成本和时间。医院层面的资本强度——复合手术室、CT 基础设施、超声实验室、灌注待命——把 TAVR
              项目锚定在资本充足的中心，也减慢向社区场景扩张。既有厂商市场集中度是最持久的约束：Edwards Lifesciences 和 Medtronic 通过 SAPIEN 与 Evolut 产品线合计控制全球
              TAVR 手术的大多数，Abbott 凭 Navitor 份额较小但在增长。Boston Scientific 曾试图通过欧洲的 ACURATE Neo2/Prime
              平台建立市场地位，并寻求美国批准，最终却停产，说明即便出资方资本雄厚，单靠技术价值也不保证能拿到份额。骨科脊柱中，由于寄售式植入物物流，切换成本低于 TAVR，但 DePuy Synthes、Stryker 和
              Zimmer Biomet 拥有深度嵌入的销售和临床支持网络。关键尽调缺口包括 MiRus 脊柱收入和市场份额没有公开披露，SIEGEL 临床结局数据仅有 30 天 EFS 随访以外的信息不足，以及 CMS
              对无症状 TAVR 覆盖决定悬而未决；该决定会大幅影响可服务手术池。
