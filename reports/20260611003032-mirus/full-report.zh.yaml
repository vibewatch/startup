      - number: '7.5'
        title: 财务不透明、执行风险与投资论点破裂触发点
        blocks:
          - type: paragraph
            body: >-
              MiRus 是私人公司，没有公开披露财务报表。TAVR 或骨科 / 脊柱业务的收入、毛利率、运营费用、现金消耗和资本充足性均未知。BSX 以 $1.5B 获得 34% 所对应的投后估值约为
              $4.4B——若从基本面支撑，这一数字需要可观的骨科收入，或 TAVR 选择权有高概率行权。没有披露财务数据，投资者无法独立评估完成 STAR 所需的资本充足性（1,025 例患者的 III 类器械
              RCT，通常包含站点启动、协调、裁定和监管申报成本，需 $80–200M），也无法判断 $1.5B 注资是否足以支撑到数据锁定，而不再发生稀释性融资。


              骨科 / 脊柱业务可能提供收入桥，但规模完全未披露。EUROPA、RIGEL、IO Expandable 或 Atlas Wedge 产品均未公布收入、分销商身份、客户集中度或利润率数据。NTAP 认定为医院采用
              EUROPA PCF 系统提供了有时限的商业激励，但 NTAP 项目通常在两到三个财政年内到期——窗口期可能早于 TAVR 项目到达 PMA 决策。如果骨科 / 脊柱收入不足以支撑运营，且 BSX
              选择权未行权，MiRus 将在开发过程中资本强度最高的阶段面临资金缺口。


              领导层集中进一步放大执行风险。Jay S. Yadav, MD/PhD 是唯一公开点名的高管；公司没有公开披露 CFO、CMO、首席运营官或监管事务负责人。在经营商业化骨科 / 脊柱业务的同时，把 1,025
              例患者 RCT 扩展到 20+ 个站点，需要深厚的运营管理梯队。缺少公开高管团队信息，使外部无法评估组织韧性或继任计划。


              投资论点破裂触发点——会从结构上推翻投资论点的事件——包括：（1）STAR 试验主要终点失败或出现重大安全信号（Siegel 相关死亡、卒中或永久起搏器率超过对照阈值）；（2）试验里程碑未达成后，BSX
              选择不行使 TAVR 选择权；（3）FDA 发出不予批准函，或要求 STAR 后追加研究；（4）铼供应中断或监管行动迫使产品召回；（5）MiRus 或其制造站点发生重大不良事件或 FDA
              执法行动。单独看，这些事件都不算大概率，但每一项都足以独立大幅损害或抹去投资价值。
