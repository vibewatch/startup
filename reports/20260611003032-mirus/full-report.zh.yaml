        - 25–35%（EFS MACE 为零、BSX 下注，但关键试验数据尚未在手）
      - - 基准
        - STAR 成功但延迟 6–18 个月；BSX 以里程碑调整后的条款行使期权；骨科保持个位数增长
        - 实现总价值 $3.5–5.0B 区间；共同投资者相对 $4.4B 进入价回报小幅为正至持平
        - 期权条款重谈；CMS 覆盖监管延迟；脊柱增长放慢
        - 40–50%（BSX 承诺是基准情景锚；时间不确定性是关键变量）
      - - 悲观
        - STAR 未达主要终点或被终止；BSX 期权失效；MiRus 以更低估值为 TAVR 资本重组
        - 独立骨科价值按估计收入 4–6x 为 $800M–$3B；$4.4B 进入价亏损
        - STAR 终点失败是二元事件；延长现金跑道也修不了失败的关键试验
        - 20–30%（BSX Acurate 先例；审批前 TAVR 项目有明显失败率）
    notes: 概率信号是参考 TAVR 可比项目和临床阶段指标得出的定性估计，并非精算概率。乐观和悲观情景的收入估计来自可比脊柱基准区间，不是 MiRus 披露。基准情景是作者在 BSX 承诺和现有临床数据下的中枢估计。
    claimRefs:
      - CV028
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
  - id: TV005
    title: 投资逻辑破裂与止损触发表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - STAR 主要终点失败
        - 相比 SAPIEN/Evolut，1 年复合终点未达到非劣效
        - 投资逻辑被二元摧毁；$3B 期权失效；TAVR 价值坍塌
        - 退出或对冲；需要评估资本重组
      - - STAR 入组进度低于计划
        - 第 12 个月时入组 <50% 目标
        - 暗示中心启动有问题；PMA 延迟 2 年以上
        - 标记为私有尽调事项；可能无法独立观察
      - - BSX 资本重新分配
        - BSX 公开撤回或重谈结构性心脏投资优先级
        - 移除主要退出路径；暗示战略重新评估
        - 脱离 BSX 重新评估；判断次级战略买家兴趣
      - - 下轮融资
        - MiRus 以低于 $3.5B 的投后估值融资
        - 暗示 BSX 退出或运营恶化
        - 投资逻辑破裂；按可得价格退出
      - - 铼供应中断
        - MoRe 合金供应中断 >30 天
        - 骨科和 TAVR 制造均受影响；收入中断
        - 评估供应链深度；跟踪 USGS 铼供应报告
      - - CMS NTAP 到期且未续期
        - EUROPA PCF NTAP 到期，且没有延长或后续政策
        - 移除医院经济激励；可能压低脊柱采用率
        - 跟踪 CMS NTAP 登记；单独看不构成投资逻辑破裂
    notes: 触发阈值是基于公开可比 TAVR 项目和 BSX 交易结构推导出的指示性监控标准；具体数字化入组目标和期权里程碑定义属于私有信息。所有严重性和传导评估均为分析推断。
    claimRefs:
      - CV003
      - CV004
      - CV030
      - CV035
      - CV045
  - id: TV006
    title: 最终尽调问题
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 骨科收入和利润率
        - 脊柱 / 四肢分部的年收入、毛利率和 COGS
        - 无法建模骨科底部价值，也无法评估 TAVR 烧钱覆盖
        - MiRus CFO；私人财务报表
      - - STAR 入组速度
        - 已启动中心、每月入组患者数相对计划、预计完成日期
        - 决定 PMA 时间线和资本充足性；是基准 / 乐观情景核心
        - MiRus 临床团队；ClinicalTrials.gov 可能显示部分数据
      - - 股权结构表和优先权堆叠
        - BSX 前投资者名单、稀释历史、清算优先权
        - 决定任一退出情景下的共同投资者经济性
        - MiRus；审阅股权结构表和股东协议
      - - BSX 期权里程碑定义
        - $3B 期权的临床和监管里程碑触发条件逐字文本
        - 决定期权是否可实现，以及以什么价格实现
        - BSX / MiRus 交易协议；若公开，通常在 SEC 委托书中部分披露
      - - 铼供应协议
        - 供应商、合同期限、定价、采购量承诺
        - 两个分部的 COGS 轨迹；供应集中风险
        - MiRus 运营 / 采购
      - - 历史融资和 BSX 前股权结构表
        - BSX 前累计融资额、原股东稀释
        - 确认 BSX 前投资者的真实成本基础和创始人稀释
        - MiRus；投资者文件或自愿披露
      - - CMS NTAP 状态和到期
        - EUROPA PCF NTAP 到期日和续期状态
        - 影响医院采用脊柱产品的经济性；短期内支撑收入
        - CMS NTAP 公开登记；通过 MiRus 新闻稿确认
      - - TAVR 试验运营毛利率
        - TAVR 临床和监管烧钱速度
        - 确认 $1.5B 足以支持 STAR 跑到主要终点读数
        - MiRus CFO；可公开取得可比 TAVR 试验基准
    notes: 所有尽调问题只反映公开来源分析下的信息缺口；MiRus 未回复任何尽调请求，也可能已在私下场景披露更多信息。尽调路径是建议方法，不是已确认的下一步。
    claimRefs:
      - CV025
      - CV036
      - CV037
      - CV038
      - CV046
