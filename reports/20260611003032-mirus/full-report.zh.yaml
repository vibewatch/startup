      - number: '5.4'
        title: 制造、部署与临床工作流
        blocks:
          - type: paragraph
            body: >-
              MiRus 在佐治亚州 Marietta 运营内部制造基地。公司 2021 年创始人简介提到，在原有 20,000 sq ft 设施基础上新增 50,000 sq ft 扩建后，制造空间约为 70,000 sq
              ft。2025–2026 年招聘信息显示，MiRus 拥有内部心血管组织处理人员（用于 Siegel 的猪心包瓣叶）和骨科植入物制造人员，证明两条产品线均有垂直整合。公司还维持内部 TAVR
              临床研究团队，包括内部 Clinical Research Associates、心脏科护士和现场临床专家，运营支持 EFS 和 STAR 试验。脊柱和骨科产品采用分销商网络商业模式；MiRus
              设有分销商页面，并提供 EXPECT MoRe® 外科医生培训教育系列。GALILEO™ 程序解决方案套件覆盖三个模块：GALILEO™ Surgical Planning、GALILEO™ Spine
              Alignment Monitoring System（术中）和 GALILEO™ Remote Physiologic Monitoring（术后监测）。VITESSE™ Pedicle Screw
              Insertion System 则补足脊柱程序工具。结构性心脏领域，TAVR 临床工作流需要专门结构性心脏团队（介入心脏病专家和心脏外科医生）、带透视引导的导管室，以及适当血管通路准备。EFS 数据显示，接受
              Siegel 8 Fr 系统治疗的患者次日出院且无并发症，与小鞘径设计希望实现的低入路创伤特征一致。TAVR 组织瓣膜制造涉及独立于金属植入物制造的组织处理工序；MiRus
              的内部组织处理能力由招聘信息佐证，而非监管文件，精确规模未公开披露。
