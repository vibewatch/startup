      - number: '7.2'
        title: Boston Scientific 依赖与合作伙伴风险
        blocks:
          - type: paragraph
            body: >-
              MiRus 与 Boston Scientific 的战略关系，既是它最大的资本来源，也是最大的集中风险。BSX 以 $1.5B 入股 34%，对应 MiRus 约 $4.4B 的投后估值；同时，BSX
              获得以合计额外 $3B 收购 TAVR 业务的独家选择权。这个财务结构把 MiRus 的 TAVR 轨迹几乎完全系在 BSX 是否行权上。由此产生两项结构性风险。


              第一，选择权带来不对称治理：BSX 拥有收购 MiRus TAVR 的独家权利，条款包含尚未公开的 “certain milestones”。因此，MiRus 最有价值的资产在合同上预留给单一买方；若无 BSX
              同意（取决于选择权协议条款），TAVR 无法启动竞争性 M&A 流程，也难以走 IPO 路径。若试验里程碑未达成或临床数据不及预期，BSX 可能拒绝行权——MiRus 将在最需要资本的阶段（PMA
              前、试验中期）失去 TAVR 商业化伙伴。BSX 曾在多年投入后放弃自有 ACURATE 平台的可比选择权，说明大型医疗科技公司即使已沉没开发资本，也会放弃 TAVR 项目。


              第二，BSX 在 TAVR 上的历史记录偏负面：Lotus 瓣膜因机械并发症和输送系统设计挑战在 2016 年停产；ACURATE neo2 和 ACURATE Prime 项目又在 IDE
              试验未能证明非劣效后，于 2023–2024 年在全球终止。截至 2026 年，BSX 没有获批的自有 TAVR 产品，正依赖 MiRus 填补空白。这种依赖让双方都有动力加速试验，但也放大集中风险：BSX 的
              TAVR 战略押在一家公司上；若 BSX 心脏或结构性心脏业务优先级恶化（战略转向、并购、资本重新分配），对 MiRus 的支持可能下降。


              BSX 报告 2025 年第四季度心血管板块有机增长 16.1%，底层业务基本面健康，能够支撑继续投资。但 BSX 长期债务约 $13–14B（按 2025 年第四季度业绩），意味着额外资本承诺——包括 $3B
              选择权付款——取决于公司更大范围的资本配置决定。若 BSX 信用市场恶化，或出现大型竞争性收购，选择权行权概率可能下降。
