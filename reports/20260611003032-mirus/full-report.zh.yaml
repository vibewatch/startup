      - number: '5.5'
        title: 差异化、知识产权与竞争定位
        blocks:
          - type: paragraph
            body: >-
              MiRus 在两条业务线上的核心差异化逻辑，是将 MoRe® 合金平台用于钛或钴铬无法复制的器械设计。在结构性心脏中，8 Fr 输送系统（相较 Edwards SAPIEN 3 Ultra 和 Medtronic
              Evolut FX 均需 14–16 Fr 鞘）、消除短缩、无镍结构，构成当前任何已获批 TAVR 器械都无法同时提供的产品特征。Boston Scientific 2026 年 5
              月投资新闻稿明确验证了这些差异化，称 Siegel「可能使其有别于当前可用技术」。基于临床和监管里程碑、用于收购 TAVR 业务的 $3 billion
              里程碑期权，也进一步说明大型战略买家给这项技术差异化赋予了高期权价值。脊柱领域，MoRe® 棒断裂终身有限保修是对材料信心的直接商业表达，因为棒断裂是成人脊柱畸形手术中的已知并发症。EUROPA® PCF 获得
              Breakthrough Device Designation，反映 FDA 认为该器械相较现有替代方案可能提供实质性改善。公司声称合金和器械设计覆盖超过 100 项专利，IP
              护城河可能较宽，但具体专利号和到期日未公开披露。竞争格局方面：J&J DePuy Synthes 和 Stryker 脊柱产品使用钛和 CoCr 系统，没有专有合金差异化；Zimmer Biomet
              同样依赖传统合金。没有已披露竞争对手在开发等同于 MoRe 的合金。TAVR 领域，当前商业竞争者为 Edwards（SAPIEN 3 Ultra、SAPIEN 3 Ultra
              RESILIA）、Medtronic（Evolut FX、Evolut Pro+）和 Abbott（Navitor），其中没有一家采用 8 Fr 输送系统或声称无镍。
            claimRefs:
              - CE038
              - CE039
              - CE040
              - CE041
              - CE042
              - CE043
      - number: '5.6'
        title: 监管、质量、安全与技术风险
        blocks:
          - type: paragraph
            body: >-
              MiRus 的监管状态明显分化：骨科 / 脊柱产品组合已凭 24 项 FDA 510(k) 许可（Class II 器械）商业部署，而 SIEGEL TAVR 仍是在 IDE 下运行的研究性器械，尚未提交
              PMA。EUROPA® PCF 系统同时拥有 510(k) 许可（K242516，2024 年 11 月）和 FDA Breakthrough Device Designation；另获 CMS New
              Technology Add-on Payment（NTAP），说明新技术获得报销认可，但该支付有时间限制。Spine Journal 2023 年的体外 MoRe®
              金属离子释放研究，为短期生理和炎症条件建立了有利安全性画像，但人体长期体内数据尚未公开。公共数据库中没有发现 MiRus 脊柱产品已发表的临床结局研究（如融合率、翻修率、患者报告结局）。截至
              runDate，Siegel 的临床证据基础由 5 名 FIH 患者 30 天数据加 15 名 EFS 患者 30 天数据构成，合计 n=20 且随访很短。1,025 人 STAR
              关键性试验是决定性关口；其主要完成时间最初估计为 2025 年 12 月，但入组直到 2026 年 4 月才开始，说明原时间线偏愿景化。面向较年轻低风险 TAVR 患者相关的 10–15 年时间维度，长期
              PVL、结构性瓣膜退化和耐久性数据尚不可得。技术风险包括铼供应集中度（铼主要作为钼副产品在哈萨克斯坦和智利开采）、内部组织处理质量、真实世界（非专家）操作者中的输送系统并发症率，以及 GALILEO
              程序平台是否拥有必要监管许可。未发现任何 MiRus 产品公开披露的不良事件报告、召回或 FDA 执法行动。
