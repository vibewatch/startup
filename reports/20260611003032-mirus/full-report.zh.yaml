          - type: callout
            title: EUROPA PCF 的 NTAP 是近期收入支持机制
            body: >-
              EUROPA PCF 的 CMS New Technology Add-on Payment 于 2024–2025 年生效，使用 EUROPA 开展符合条件的 Medicare
              住院颈椎手术时，医院可获得增量报销。这降低了医院采用的经济摩擦，并可能加快手术量增长——这是间接收入支持机制，并不直接提高 MiRus 标价。它也为 SIEGEL 在 TAVR 中争取类似路径提供先例，前提是
              SIEGEL 展现出可比的临床差异化。
