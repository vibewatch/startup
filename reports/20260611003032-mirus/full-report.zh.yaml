      - number: '3.2'
        title: 骨科与脊柱竞争格局
        blocks:
          - type: paragraph
            body: >-
              在脊柱植入物和器械领域，MiRus 面对一个集中市场，三家公司掌握全球收入的大多数。Medtronic 2024
              年在多数主要脊柱细分市场保持领先，包括颈椎固定、胸腰椎固定和椎间器械，背后是横跨传统融合与运动保留的宽产品组合。DePuy Synthes（Johnson & Johnson）是全球第二大脊柱竞争者，2025
              年脊柱、运动及其他合并收入为 $2.8 billion（同比下降 2.5%），在椎间器械、颈椎固定和胸腰椎固定中地位稳固。Johnson & Johnson 已宣布战略性评估将 DePuy Synthes
              作为独立骨科实体的工作，这可能重塑竞争动态，并带来不同的投资优先级。

              Stryker 正经历重大结构变化：2025 全年脊柱收入仅 $185 million 后，公司于 2025 年 1 月同意将美国和法国脊柱植入物业务出售给 Viscogliosi Brothers（VB
              Spine）。Stryker 正围绕使能技术平台重新定位，包括机器人导航（Q Guidance System）和 Balance ACS
              规划软件，而不是大宗植入物。这在植入物品类中创造了部分竞争空档，但同时提高了机器人和导航门槛，MiRus 这类小型植入物玩家必须与之集成。Zimmer Biomet 2025 年总销售额为 $8.2
              billion，尚未宣布剥离脊柱业务，仍作为全线骨科竞争者保持地位，膝关节和髋关节核心强劲。其脊柱和四肢敞口嵌在更宽平台中，并通过大型直营销售队伍分销。

              根据 iData Research，全球脊柱植入物和椎体压缩骨折（VCF）市场 2024 年达到 $21.4 billion，预计将增长至约 $32
              billion。关键增长驱动因素包括微创手术（MIS）流程采用、ASC 迁移和机器人集成——这些都是既有厂商正在投资的领域，而 MiRus 仅靠材料科学差异化竞争。钛和 PEEK
              仍是主导植入材料；自研合金面对的市场已经被竞争对手数十年数据训练得更谨慎。MiRus 持有 24 项脊柱和四肢植入物 FDA 510(k)
              许可，拥有商业立足点，但其脊柱业务公开披露的收入和市场份额不可得，无法从公开来源量化竞争位置。

              脊柱中的相关替代方案包括非手术管理（物理治疗、注射、支具）、成熟供应商的现有钛或 PEEK
              植入物，以及越来越多的生物增强。从当前脊柱外科医生偏好的供应商切换，成本很高：带教、器械托盘成本、手术室熟悉度和现场销售代表关系都偏向既有厂商。
