        - $3B TAVR 期权给出有明确条件的结构化退出路径
        - 期权触发条件比当前披露更严格
      - - 投资逻辑
        - 24 个获批骨科产品加 CMS NTAP 支持，证明商业化运营真实存在
        - 披露收入或利润率低于同业可比下限
      - - 投资逻辑
        - STAR 的 15 名 EFS 患者 30 天 MACE 为零，是早期正面信号
        - STAR 关键试验未达主要复合终点，或被终止
      - - 反向逻辑
        - 审批前 $4.4B 是二元押注；当前没有收入、利润率或获批结果
        - STAR 成功且 BSX 行使期权，验证进入价格
      - - 反向逻辑
        - BSX Acurate 失败（投入 $200M+ 后撤回）显示 TAVR 的二元风险
        - 关键试验证实 SIEGEL 相比 Acurate 和现有产品有差异化
      - - 反向逻辑
        - BSX 期权并非已承诺；若期权失效，公司层面风险上升
        - 出现替代战略收购方，或确认期权条款可行使
      - - 反向逻辑
        - 收入、利润率、股权结构表全都不透明——无法靠公开数据承销
        - 私有财务披露补上缺口
    notes: 投资逻辑与反向逻辑配对来自公开证据；足以实质改变观点的内部财务数据（收入、利润率、股权结构表）并未公开。
