      - number: '6.3'
        title: 骨科与脊柱商业客户基础
        blocks:
          - type: paragraph
            body: >-
              MiRus 的骨科和脊柱产品通过独立销售代表和分销商网络商业推广。公司分销商页面邀请潜在分销伙伴注册，但不列出现有分销商名称或区域。针对 24 个 FDA
              已许可脊柱和骨科产品，公开资料中没有识别到任何面向公众的客户案例、医院部署公告、外科医生推荐或采购协议。这符合早期小型器械公司常见做法：依靠分销商驱动、外科医生之间的网络，交易流私密，机构合同很少公开宣布。


              获得 NTAP 指定（CMS FY2026）的 EUROPA® PCF 系统，是医院层面采用激励的最佳公开信号：NTAP 在窗口期（FY2026，可能延长但取决于 CMS
              续批）为植入该器械的医院创造直接经济收益。按预期，它会降低医院目录审批难度并加快初始商业账户获取。不过，没有公开披露哪些医院因 EUROPA® PCF 获得 NTAP 支付。


              GALILEO™ Spine Alignment Monitoring System 若与 EUROPA® 器械一起被医院和 ASC
              客户采用，可能形成工作流粘性，因为程序规划工具整合会提高切换成本。同样，MoRe®
              棒断裂终身有限保修，是面向高畸形手术量脊柱项目的差异化商业信息。公开记录中，这两项产品层面的粘性因素都没有关联到任何已确认具名客户。


              实际尽调缺口很大：没有具名商业账户、收入数字、使用率或分销商身份，就无法评估脊柱 / 骨科业务的商业深度、耐久性或集中度。MiRus 声称收入增长 250%+（Atlanta Business
              Chronicle，2022）是公司整体唯一公开增长信号，但已经过时，且没有拆出脊柱 / 骨科板块。
