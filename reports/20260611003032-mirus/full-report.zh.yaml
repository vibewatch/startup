  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: MoRe 合金平台——核心材料科学
        blocks:
          - type: paragraph
            body: >-
              MiRus 的产品和技术战略全部建立在 MoRe® 之上。这是一种 Molybdenum-47.5Rhenium（Mo-Re）二元合金，公司最初从 NASA 火箭发动机材料科学获得灵感开发，FDA 于 2019
              年批准其用于医疗植入物。该合金开发已超过 15
              年。相较当前主导脊柱植入物市场的两类合金——钛（Ti-6Al-4V）和钴铬（Co-28Cr-6Mo）——其核心机械优势是高屈服强度、更强疲劳抗性和极低回弹。关键的是，Spine
              Journal（2023）发表的一项体外腐蚀研究用 ICP-MS 方法，在生理盐水和炎症盐水环境中测量了 MoRe® 的金属离子释放。MoRe® 在所有测试间隔中均远低于 FDA 允许的钼（1,900
              μg/cm² day）和铼（4,400 μg/cm² day）每日暴露限值（PDE），炎症条件下也如此。同一研究发现，钴铬在炎症条件下接近或超过钴和钒的
              PDE——构成直接安全性对照。该合金不含镍、不含钴。在结构性心脏领域，MiRus 为 Siegel TAVR
              采用一体化氧化氮涂层铼框架，并称其径向强度高于钴或钛。上述材料属性让一些传统合金无法实现的设计成为可能：EUROPA PCF 的 2.9 mm 后路颈椎棒（商业同类通常为 3.5–4.0 mm）、可从 3 mm
              腰椎椎间置入外形扩张到 16 mm 的装置、以及 8 French TAVR 输送系统，而行业标准约为 14–16 French。公司声称合金和衍生器械设计覆盖超过 100 项专利。
