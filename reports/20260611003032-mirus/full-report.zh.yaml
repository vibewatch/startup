  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: TAVR 竞争格局——直接同业与结构性动态
        blocks:
          - type: paragraph
            body: >-
              美国 TAVR 市场实际上是双寡头。Edwards Lifesciences 通过球囊扩张式 SAPIEN 3 和 SAPIEN 3 Ultra 平台控制约 60–70% 的美国 TAVR 手术。Edwards
              2025 全年 TAVR 收入达到 $4.5 billion，同比增加 8.6%，说明既有龙头仍处强劲增长轨道，而不是进入成熟平台期。Medtronic 以自扩张 Evolut FX 平台拿下剩余约
              30–35%。两年期 SMART 试验数据比较了小主动脉瓣环、且入组者以女性为主的患者中 Evolut 与 SAPIEN 的表现，显示 Evolut
              的生物瓣功能障碍显著更少，人工瓣血栓少五倍，血流动力学结构性瓣膜功能障碍少九倍——这些发现可能在该患者子集中逐步改变医生偏好，但尚未撼动 Edwards 的整体主导地位。

              Abbott 凭 Navitor 系统占据小但扩大的位置（2023 年 1 月获 FDA 批准用于高风险患者），批准数据报告中度至重度 PVL 为 0%，平均压差 7.4 mmHg，全因死亡率
              1.9%。ENVISION 试验正在拓宽 Navitor 标签。2024 年心脏病专家调查预测，随着 Abbott 爬坡，到 2025 年 Edwards 美国份额将稳定在约 72%，但数据仍显示，总量层面的
              TAVR 是两强竞争。

              Boston Scientific 已不再是 TAVR 竞争者。多年寻求 Acurate neo2 的 FDA 批准后，BSX 于 2025 年 5 月停止所有 Acurate
              商业、临床和制造活动。Acurate IDE 试验在 TCT 2024 报告并发表于 The Lancet，显示 Acurate neo2 未能达到相对 Evolut 和 SAPIEN 的预设 8%
              非劣效界值；约 20% 瓣膜扩张不足，导致一年结局更差。停产前，BSX 2024 年 Acurate 销售额为 $200 million。这次退出对 MiRus 具有战略意义：BSX 2026 年 5 月对
              SIEGEL 业务的 $1.5 billion 投资和 $3 billion 认购期权，清楚承认 BSX 无法独立重建 TAVR 能力，并把 MiRus
              视为重返市场的载体。这一双重角色——今天是战略伙伴，明天是期权持有人——意味着 BSX 既在验证 MiRus，也保留控制或内部化 SIEGEL 资产的选择权。

              Anteris Technologies 是最直接相关的新进入者。其 DurAVR 球囊扩张式 THV 于 2025 年 11 月获得 FDA IDE 批准，用于 PARADIGM
              关键性试验（NCT07194265）；该试验将在美国、欧洲和加拿大约 1,000 名患者中，以 1:1 随机对照商业 TAVR（SAPIEN/Evolut）。DurAVR 使用仿生单片式 ADAPT
              组织设计。PARADIGM 与 MiRus STAR 试验并行推进，意味着两个获批前进入者同时争夺研究中心准入和入组。JenaValve 和 JC Medical 也在为主动脉瓣反流适应症进行 FDA
              试验；二者均于 2024 年被 Edwards 收购，其中 JenaValve 交易仍待 FTC 审查，这进一步集中 Edwards 的管线控制。

              TAVR 的现状替代方案仍是外科主动脉瓣置换（SAVR），指南仍偏好 65 岁以下患者采用 SAVR。SAVR 由同一批机构内的心脏外科医生完成，并拥有任何 TAVR
              系统目前都无法匹敌的长期耐久性数据。无症状患者的默认方案是非手术观察等待，不过基于 EARLY TAVR 数据，FDA 2025 年 5 月批准 SAPIEN 用于无症状重度 AS，开始侵蚀这一默认方案。
