      - number: '3.3'
        title: 能力对比与差异化分析
        blocks:
          - type: paragraph
            body: >-
              TAVR 中，MiRus 通过三项主要技术主张区分 SIEGEL：8-French
              股动脉入路鞘管（公司称其小于竞争平台）、无镍且无钴的铼合金支架（公司认为可降低超敏风险并改善疲劳性能），以及部署时不短缩（公司称可实现更精准定位）。SAPIEN 3 使用钴铬支架，经 14-French 等效
              Commander 输送系统递送。Evolut FX 使用镍钛自扩张支架，经 14-French InLine 鞘管递送。Abbott Navitor 称其 FlexNav
              输送系统在该尺寸范围内以最小输送系统容纳最大瓣膜。

              按已测量血流动力学表现，SIEGEL 30 天 EFS 数据（15 名患者、5 个美国中心）显示平均压差 6.3 mmHg、瓣口面积 2.8 cm²。相比之下，Navitor 批准数据报告平均压差 7.4
              mmHg、EOA 2.0 cm²。这些比较并非头对头，且涉及不同人群、不同随访窗口和不同影像协议；不应视为优效证据。SIEGEL 的临床数据集只有 15 名患者、30 天；SAPIEN 3 和 Evolut FX
              则有多年上市后数据支持，注册登记中包含数十万例手术。证据深度的不对称，是 MiRus 近期最重要的竞争劣势。

              在脊柱中，SIEGEL 的合金差异化由 MoRe 合金在整个骨科平台上复用。Medtronic、DePuy 和 Stryker 的钛合金及 PEEK
              椎间融合器占据主导，因为外科医生、医院和支付方拥有数十年结局数据。MiRus 的 MoRe 合金主张包括高屈服强度、抗疲劳性和 MRI
              兼容性改善，但脊柱领域公开发表的长期比较结局数据仍有限。这造成了可信度缺口，必须靠外科医生层面的临床采用和独立发表数据来填补。

              定价和包装方面，没有任何制造商公开披露美国医院中心的 TAVR 器械定价。市场报告估计 TAVR 系统每例手术成本约 $30,000–$35,000；这与美国每年 90,000–130,000 例手术、市场规模
              $2.7–$4.6 billion 的自下而上估计一致。MiRus 定价完全未知，因为 SIEGEL 目前是研究性器械，没有商业价格表。既有厂商的脊柱植入物定价同样由双方协商且未公开披露；MiRus
              不披露其商业脊柱组合的目录价。
            claimRefs:
