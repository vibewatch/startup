        - 插入轮廓更小，减少组织牵拉；术中可调节前凸角
        - 公开来源未发现已发表融合率或临床结局数据
      - - 小体型患者后路颈椎固定
        - 标准 3.5–4.0 mm CoCr 杆；硬件突出风险
