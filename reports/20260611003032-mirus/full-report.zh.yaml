      - number: '4.4'
        title: 资本充足性、烧钱速度与融资依赖
        blocks:
          - type: paragraph
            body: >-
              $1.5 billion 的 BSX 投资，是 MiRus 历史上披露过的最大单笔融资事件。公开来源没有披露此前累计融资、准确现金余额或当前月度烧钱速度；公司概况章节仅基于公开来源梳理到 BSX
              交易为止的融资时间线，没有给出 2026 年前的融资金额。资本充足性的核心问题，是 $1.5 billion 是否足以支持 MiRus 完成 STAR 试验读出并提交潜在 PMA。STAR 计划在多个美国中心入组
              1,025 名患者；主要终点是一年时死亡、卒中和心血管住院的复合终点。参考可比关键性 TAVR 试验公开成本，一项 1,000 人随机对照试验从入组到一年主要终点读出，仅临床运营通常就需要 $100–$250
              million，监管事务、质量、制造放大、G&A 还会继续加码。MiRus 的骨科商业化业务也需要持续投入销售队伍、分销商和库存支持。即便采用保守假设，$1.5 billion
              投资也提供了充足现金跑道——很可能远超 STAR 一年主要终点，并足以覆盖潜在 PMA 或 510(k) 路径提交和早期商业规划。因此，主要融资依赖并不在近期额外资本，而在 BSX 里程碑条件下的 $3
              billion 期权：如果 STAR 失败或重大延期，期权很可能不会被行使，MiRus 的 TAVR 项目将面临再资本化事件。骨科商业化业务能产生收入，对冲部分 TAVR
              烧钱，但规模未披露。公开资料没有描述任何信贷额度、项目融资安排或库存抵押贷款项目。
            claimRefs:
              - CI026
              - CI027
              - CI028
              - CI029
              - CI030
              - CI031
              - CI032
      - number: '4.5'
        title: 公开牵引力代理指标与缺失的私有指标
        blocks:
          - type: paragraph
            body: >-
              MiRus 是一家私营公司，自愿财务披露有限。公开可见的牵引力信号几乎全是临床和监管信号，而不是商业或财务信号。骨科业务可观察的代理指标包括：24 项 510(k)
              许可，证明产品组合已经产品化并商业化；EUROPA PCF 获得 NTAP，证明 CMS 认可该系统足够新，可获得增量 Medicare 报销；EUROPA PCF 获得 Breakthrough Device
              Designation；公开招聘中出现销售和商业运营岗位；公开新闻稿中提到分销渠道。上述信号都不能直接转换为收入、出货量或毛利润。TAVR 最有意义的牵引力信号是临床层面：15 名 EFS 患者 30
              天重大不良事件为零、1,025 人 STAR 关键性试验入组、以及 BSX 投资本身带来的战略验证。Boston Scientific 在审阅 MiRus 非公开数据室后投资 $1.5
              billion，这一决策是底层证据质量的高质量信号——但不能替代已披露财务数据。重大缺失指标包括：（1）公司总收入和收入增长；（2）骨科业务单元收入和利润率；（3）客户数、分销商数和手术量；（4）STAR 入组时
              TAVR 试验中心数；（5）月度现金消耗；（6）BSX 前累计融资额；（7）脊柱硬件毛利率；（8）骨科产品实际 ASP 与标价 ASP；（9）库存账面价值和周转率。任何采用假设收入或利润率的 MiRus
              财务模型，都必须标注为估计值，而非观察值。
