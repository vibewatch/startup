      - number: '5.2'
        title: 脊柱与骨科产品组合
        blocks:
          - type: paragraph
            body: >-
              MiRus 已将一套由 MoRe 支撑的广泛脊柱和骨科产品组合商业化，覆盖椎弓根螺钉固定、椎间融合、前路颈椎硬件、足踝截骨。EUROPA® Pedicle Screw System 是旗舰脊柱固定产品，使用
              MoRe 棒，并对棒断裂提供终身有限保修——公司将该保修定位为对合金机械信心的直接信号。EUROPA® 面向胸腰椎手术，提供 4.5 mm 和 5.5 mm 两种棒直径。EUROPA® Posterior
              Cervical Fusion（PCF）系统使用 2.9 mm MoRe 棒，显著小于任何可比商业系统，可降低硬件突出度，尤其适合体型较小患者。FDA 于 2024 年 7 月授予 EUROPA® PCF
              Breakthrough Device Designation。EUROPA® PCF 于 2024 年 11 月以 K242516 获得 FDA 510(k) 许可。IO™ Expandable Lumbar
              Interbody System 将可扩张平台扩展到腰椎：其以 3 mm 置入外形进入，连续扩张至 16 mm，提供 0–23° 前凸和 2.5 cc 植骨容量，目标患者为 L1–S1
              退变性椎间盘病。带集成钢板固定的 MiRus 3DR™ LLIF 系统于 2023 年 9 月通过 K232154 获批。其他产品包括 RIGEL 3DR™（颈椎椎体切除和独立颈椎椎间）、ANTARES
              3DR™（独立 ALIF）、CYGNUS MoRe® Anterior Cervical Plate、PROMETHEUS Adult Deformity System 和 MoRe® Lumbar
              Plates。肢端领域，IO™ Expandable Wedge Osteotomy System 于 2026 年 2 月获得 FDA 510(k)
              许可并立即商业上市；它把同一扩张引擎用于足踝手术中外侧柱延长的 Evans 截骨，允许外科医生在术中微调骨性矫正。OpenFDA 记录显示，截至 2026 年 6 月，MiRus 共备案 24 项 510(k)
              许可。
