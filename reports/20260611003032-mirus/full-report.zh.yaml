      - number: '2.6'
        title: 图表
        blocks:
          - type: callout
            title: 无症状 AS 适应症带来重大上行催化剂——但仍受报销闸门限制
            body: >-
              FDA 2025 年 5 月批准 Edwards SAPIEN 3 用于无症状重度 AS，这是任何 TAVR 系统在该适应症上的首个批准。CMS 已因此启动对其 NCD 的重新考虑，引用 EARLY TAVR
              数据：早期 TAVR 相对监测在复合终点上有 18.5 个百分点优势（26.8% vs 45.3%）。如果 CMS 扩大覆盖，美国每年约 300,000–500,000 名无症状重度 AS
              患者可能新增符合条件，可服务市场会显著扩大。对 MiRus 来说，这是双刃信号：更大的市场验证 TAVR 项目，但当前 FDA 批准和临床证据基础完全属于 Edwards 的 SAPIEN 平台。SIEGEL
              若要参与任何扩张，需要自己的无症状数据——很可能是独立于 STAR 的另一项研究。
            calloutType: insight
            claimRefs:
              - CM013
              - CM014
              - CM020
              - CM021
          - type: callout
            title: Boston Scientific 退出 ACURATE 市场，是新 TAVR 进入者的警示先例
            body: >-
              Boston Scientific——同一家向 MiRus 投入 USD 1.5 billion 的战略投资者——曾在欧洲高级临床使用和美国监管开发中拥有自己的 TAVR 产品（ACURATE
              Neo2/Prime），但最终终止了该项目。即便有 BSX 的资本、分销网络和临床事务基础设施，这次失败仍凸显：技术价值、资金和战略支持并不保证能夺取 TAVR 市场份额。BSX 终止 ACURATE
              的具体原因尚未完全公开，无法详细归因于临床、定价、市场集中度或监管因素；对竞争尽调而言，这是一个尚未解决的反向信号。
            calloutType: risk
            claimRefs:
              - CM036
              - CM037
              - CM038
          - type: callout
            title: MiRus 骨科脊柱底座处在 USD 6.6B 的美国市场，短期商业势头存在
            body: >-
              2024 年美国脊柱植入物市场估计约 USD 6.6 billion，CAGR 为 6%。MiRus 拥有 24 项 FDA 510(k)
              许可，覆盖颈椎、胸椎、腰椎和四肢系统，形成了宽泛的商业产品底座。脊柱细分市场产生当前收入，用以交叉补贴 SIEGEL TAVR 开发项目，不过金额没有公开披露。在脊柱领域，MiRus 面对 DePuy
              Synthes（JnJ）、Stryker、Zimmer Biomet 等资金雄厚的既有厂商，但自研 MoRe 合金的 MRI 兼容性和生物力学特征，可能在影像伪影或骨整合质量具有临床意义的市场中形成植入物差异化。
            calloutType: insight
            claimRefs:
              - CM027
              - CM028
              - CM029
              - CM039
              - CM040
              - CM041
          - type: callout
            title: SIEGEL 的 CMS 报销路径不确定，且决定近期商业上市能否落地
            body: >-
              SIEGEL 在美国商业上市不仅需要 FDA 批准（取决于 STAR 试验结果），还需要 CMS 的 NCD 或 LCD 决定，以商业上可行的水平提供 Medicare 报销。2026 年 3 月 27 日的
              CMS CED 批准允许 STAR 入组，但不构成商业覆盖。鉴于 CMS 同时在重新考虑无症状 TAVR NCD，机构带宽和政策注意力可能影响时间线。如果 FDA 批准 SIEGEL，但 CMS 将 NCD
              修订推迟 18–24 个月，收入爬坡会被大幅延后，并可能迫使 MiRus 在空窗期以低于成本的价格维持医院准入。
