      - number: '6.5'
        title: 扩张路径与集中度风险
        blocks:
          - type: paragraph
            body: >-
              MiRus 两个板块都面临显著集中度风险。TAVR 方面，公开确认的客户参与主要集中在 Piedmont Heart Institute：它是 EFS 首批病例中心（2025 年 3 月）、STAR
              首次入组中心（2026 年 4 月），也是 STAR 试验共同主席（Thourani）和一名全国 PI（Yadav）的所在机构。临床领导结构形成辐射式格局，Piedmont 是锚定中心，Cedars-Sinai
              是第二个已确认节点。如果 Yadav 或 Thourani 任一医生倡导者支持流失，将实质性延迟 STAR 试验主中心入组动能。


              STAR 试验预期扩展到约 20 个或更多美国中心，这会拓宽机构参与面，但中心启动速度未公开披露；截至 2026 年 6 月运行日期，注册表尚未列出更多中心。潜在 PMA 之后的商业 TAVR 扩张（考虑
              2026 年开始入组，最早也可能是 2028–2029 年）需要在数百个中心完成机构资质准入（按 STS/TVT Registry 数据，美国约 700 个获认证 TAVR 项目），并将与 Edwards 和
              Medtronic 直接争夺手术室时间、结构性心脏团队培训和资本配置。MiRus 的 8 French 鞘优势和无镍状态提供差异化切入点，但结构性心脏商业客户获取是一项多年、资本密集型任务。


              骨科 / 脊柱方面，分销商网络集中度完全不透明。如果少数分销商或区域代表贡献大部分收入，关键分销商离开将具有重大影响。缺少任何具名分销伙伴，限制了对渠道健康度的独立评估。EUROPA® PCF 的
              Breakthrough Device Designation 和 NTAP 为颈椎领域集中医院采用创造了两到三年窗口，但如果没有可见账户支撑的 NTAP 后商业策略，长期耐久性尚未证实。


              一个重要反向背景是，重大 TAVR 平台在有前景试验数据后失败并非没有先例：Boston Scientific 的 ACURATE Neo2 和 ACURATE Prime 平台在未获 FDA 批准后，于
              2023 年末退出全球市场，说明强劲早期可行性和欧洲商业牵引力并不保证美国批准或商业成功。该风险并非 MiRus 特有，但与评估依赖 STAR 试验成功和 PMA 的商业客户跑道直接相关。
