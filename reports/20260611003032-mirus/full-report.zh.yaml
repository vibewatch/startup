      - number: '7.4'
        title: 医生 / 站点集中度与竞争风险
        blocks:
          - type: paragraph
            body: >-
              MiRus 的临床和商业 TAVR 前景高度集中在少数医生倡导者身上。STAR 试验主席是 Martin B. Leon, MD（Columbia University），联合主席是 Vinod H.
              Thourani, MD（Piedmont Heart Institute）。全国主要研究者包括 Pradeep K. Yadav, MD（Piedmont；也是 MiRus 创始人的儿子和 EFS
              首席操作者）、Raj Makkar, MD（Cedars-Sinai）、Samir Kapadia, MD（Cleveland Clinic）和 Philippe Genereux, MD（Atlantic
              Health System）。这六名医生、五家机构构成了 Siegel 设备所有已公开确认的临床背书。任何研究者离任、失能或退出——尤其是 Piedmont 的 Dr. Yadav 和 Dr.
              Thourani，那里是唯一活跃 STAR 站点——都会直接拖慢入组速度。研究者与 PI 的关系还因 Jay S. Yadav, MD（MiRus 创始人兼 CEO）是 Pradeep Yadav
              的父亲而更复杂，可能引发负面观察者标记的利益冲突披露风险。


              STAR 试验推进后，竞争风险会加剧。Edwards Lifesciences 以 SAPIEN 3 Ultra 平台控制美国 TAVR 市场约 55–65%，背后有大量 TVT Registry
              结局数据、设备迭代（SAPIEN 3 Ultra RESILIA）和成熟的 IDN/GPO 合同。Medtronic 的 Evolut FX TAVR 系统已发布 2 年随机数据（Evolut Low Risk
              RCT），显示生物瓣膜功能障碍显著更少（人工瓣膜血栓少 5 倍、血流动力学结构性瓣膜功能障碍少于 SAPIEN 9 倍）。若 Siegel 商业上市前未收集 STAR 5
              年数据，这些耐久性数据优势可能成为竞争门槛。Anteris Technologies 于 2025 年 11 月获得 FDA IDE 批准，启动 PARADIGM 关键试验（DurAVR 球囊扩张式
              TAVR，仿生瓣叶），形成第三个下一代平台；其时间窗口与 MiRus 接近，将争夺临床试验站点、研究者，并最终争夺市场份额。


              商业上市时间上的竞争压力很大：如果 Edwards 或 Medtronic 在 MiRus 完成 STAR 之前，带着多年结局数据推出下一代瓣膜（RESILIA、Evolut FX Pro），Siegel 的 8
              Fr 鞘管和无镍设计，可能不足以在学术结构性心脏项目中取代根深蒂固的现有厂商；若上市时 Siegel 缺少 2 年 STAR 数据，风险尤其高。
