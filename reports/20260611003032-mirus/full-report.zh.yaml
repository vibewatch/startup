      - number: '1.2'
        title: 领导层与运营者画像
        blocks:
          - type: paragraph
            body: >-
              MiRus 官方领导层页面列出的创始人兼 CEO 是 Jay Yadav, MD，而不是 Tom Eichmann。这个差异重要，因为创始人主导的故事是 MiRus 公开叙事的核心。Yadav
              是介入心脏病专家，此前退出案例包括将 CardioMEMS 卖给 St. Jude/Abbott、将 Angioguard 卖给 Johnson & Johnson；MiRus 还称他是 SMART
              Therapeutics 的首位投资者和董事，该公司后来被 Boston Scientific 收购。其余已披露运营班底对 MiRus 这种规模的私人公司也有分量：Noah Roth 任 COO，并与 MoRe
              合金开发相关；Mahesh Krishnan 负责商业化；David Toney 自 2022 年起任 CFO；Jordan Bauman 负责质量与监管事务，拥有 510(k)、IDE 和 PMA
              路径经验；Pam Cowart 则带来 CardioMEMS 时期的长期心血管临床事务经验。因此，公开团队页面显示出心血管器械领域的创始人 -
              市场匹配，也具备骨科商业化和心脏瓣膜试验执行的实操班底。关键人物风险在于，MiRus 的外部可信度很大程度仍系于 Yadav 个人，包括公司起源故事、投资者信息、过往退出光环和结构性心脏愿景。
