      - number: '8.3'
        title: 情景分析——牛市、基准与熊市
        blocks:
          - type: paragraph
            body: >-
              三种情景覆盖了主要结果区间。牛市情景下，STAR 试验按时达到非劣效主要终点（2027 年末读出 1 年数据的 30 天结果），FDA 在 2028–2029 年授予 PMA 批准，Boston
              Scientific 在 PMA 后不久行使 $3 billion TAVR 选择权；骨科业务则在 CMS NTAP 和高端 MoRe 合金差异化支持下，增长到 $300–500 million 年收入。BSX
              行权时，MiRus 总股权价值相对于 $4.4 billion 投后形成显著倍数，为以 BSX 轮价格或接近该价格进入的共同投资者带来强回报。

              基准情景下，STAR 成功，但监管审评比乐观时间线延长 6–18 个月；BSX 行权，但条款略有修改，以反映里程碑再谈判；骨科业务继续增长，但增速为个位数。MiRus 通过 BSX 行权兑现价值，最终结果落在
              $3.5–5.0 billion 的 TAVR + 骨科区间，具体取决于最终行权条款。以 $4.4 billion 投后进入的共同投资者获得温和但为正的回报。

              熊市情景下，STAR 要么未达主要终点，要么实质性延迟到 2030 年以后；BSX 不行权，MiRus 面临 TAVR 项目资本重组。骨科业务提供底部：24 款获批产品、CMS NTAP
              支持和运转中的分销渠道，支撑真实商业运营；但在收入规模未披露且没有 TAVR 选择权的情况下，按同业脊柱倍数（4–6x 收入）估算，独立骨科业务价值为 $800 million 至 $3 billion，显著低于
              $4.4 billion 投后。以 BSX 轮价格进入的共同投资者在熊市情景下面临亏损。这种二元结构是当前估值的核心风险。
