      - number: '2.4'
        title: 增长驱动因素
        blocks:
          - type: paragraph
            body: >-
              多个相互强化的因素支持 TAVR 细分市场在未来十年跑赢市场平均增速。第一是人口扩张：WHO 预计全球 60 岁及以上人口到 2050 年将翻倍至 2.1 billion，全球 70 岁及以上成年人中钙化性 AS
              患病率为每 100,000 人 1,841 例——今天约 12.6 million 人。仅美国，CDC 数据显示 AS 影响 65 岁及以上成年人 5%（约 2.1 million 人）。第二是适应症扩张：FDA
              2025 年 5 月批准 Edwards SAPIEN 3 平台用于无症状重度 AS，这是该人群的首个批准。CMS 现在正应 Edwards 正式请求重新考虑其 NCD，以覆盖无症状 TAVR；该请求引用
              EARLY TAVR 随机试验，其中复合终点（死亡、中风、计划外住院）在 TAVR 患者中发生率为 26.8%，观察等待为 45.3%。将 TAVR
              扩展至无症状患者可能显著扩大可服务手术量，但支付方接受度仍有争议，因为许多心脏病专家反对治疗无症状患者。第三是年龄组渗透：TAVR 已从仅限高风险患者的手术，转变为 65 岁及以上患者的主导方式。65–80
              岁组中，TAVR 使用率在 2016 至 2022 年从 AVR 手术的 42.1% 翻倍至 80.6%；80 岁以上组达到 97.8%；即便在 65 岁以下组——历史上属于 SAVR 的地盘——TAVR 到
              2022 年也达到手术量的 51.7%。脊柱方面，增长驱动因素包括人口老龄化带来的退行性椎间盘疾病负担上升、微创手术技术扩张，以及 MiRus 自研 MoRe
              合金；与钛或钴铬植入物相比，该合金可能减少影像伪影并改善骨整合，不过大规模独立比较结局数据尚未公开。
