            title: BSX 选择权行权概率是关键估值驱动
            body: >-
              MiRus 隐含 $4.4B 估值只有在 BSX 行使 $3B TAVR 收购选择权时才站得住。如果选择权不行权，MiRus 的隐含价值将落到独立骨科 / 脊柱业务，而公开来源无法量化该业务。选择权行权概率取决于
              STAR 主要终点成功、试验时间线，以及行权时 BSX 的战略资本配置——截至 2026 年 6 月，这些问题均未解决。
