figures:
- id: FR001
  title: Risk Heatmap — Likelihood vs. Residual Severity
  type: matrix
  layout: wide
  summary: >-
    Five-by-five risk matrix mapping 14 named MiRus risks by likelihood (x-axis)
    and residual severity (y-axis) after mitigation. Critical cluster in high-severity /
