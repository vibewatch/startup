  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: BSX option milestone conditions
    missingEvidence: >-
      Specific performance milestones, exercise conditions, and termination rights
      associated with BSX's exclusive option to acquire MiRus TAVR for $3B.
    whyItMatters: >-
      Without milestone terms, it is impossible to assess the probability of option
      exercise, the conditions under which BSX could walk away, or the downside
      valuation scenario if the option is not exercised.
    diligencePath: >-
      Request executed Equity Purchase Agreement and MIPSA from MiRus; review option
      conditions, exercise window, milestone definitions, and termination triggers.
    relatedQuestionRefs:
    - QR003
    - QR014
    - QR019

  - type: private-evidence-only
    severity: blocking
    topic: rhenium supply agreements
    missingEvidence: >-
      MiRus rhenium supply agreements, supplier identities, pricing arrangements,
      inventory buffer levels, and supply chain redundancy plans.
    whyItMatters: >-
      Rhenium is the critical differentiating input for all MiRus products. A single
      undisclosed supply relationship creates an existential single-point-of-failure
      risk across TAVR and orthopedic product lines simultaneously.
    diligencePath: >-
      Request rhenium supplier contracts, minimum order commitments, pricing mechanisms,
      and backup sourcing plan; assess geopolitical exposure of primary suppliers.
    relatedQuestionRefs:
    - QR004
    - QR029

  - type: private-evidence-only
    severity: material
    topic: MiRus financials and capital adequacy
    missingEvidence: >-
      Audited financial statements, orthopedic/spine revenue run rate, gross margins,
      operating expenses, cash burn, and projected runway to STAR data lock.
    whyItMatters: >-
      Without financial visibility, it is impossible to confirm whether the $1.5B
      BSX investment is sufficient to fund STAR through data lock, or whether
      additional dilutive financing will be required.
    diligencePath: >-
      Request audited FY2024 and FY2025 financials; cash bridge model to PMA filing;
      capital adequacy sensitivity analysis under delayed enrollment scenarios.
    relatedQuestionRefs:
    - QR005

  - type: missing-source
    severity: material
    topic: STAR trial site activation pipeline
    missingEvidence: >-
      Complete STAR trial site list beyond Piedmont Heart Institute; activation
      timeline for additional 15–20 planned sites; projected monthly enrollment pace.
    whyItMatters: >-
      Single-site enrollment cannot achieve 1,025 patients in a competitive timeframe;
      without site activation progress, PMA timelines and BSX option exercise
      probability are materially uncertain.
    diligencePath: >-
      Monitor ClinicalTrials.gov quarterly; request site activation Gantt chart and
      enrollment pace projections from MiRus clinical operations.
    relatedQuestionRefs:
    - QR001
    - QR013
    relatedTableRefs:
    - TR001

  - type: missing-source
    severity: material
    topic: MiRus IP and patent portfolio
    missingEvidence: >-
      Detailed patent portfolio for MoRe alloy, 8 Fr delivery sheath, and Siegel
      valve geometry; freedom-to-operate analysis relative to Edwards and Medtronic.
    whyItMatters: >-
      IP strength determines the defensibility of the moat that justifies the $4.4B
      implied valuation premium over undisclosed orthopedic/spine revenues.
    diligencePath: >-
      Request patent list from USPTO; conduct freedom-to-operate analysis for each
      core IP claim; assess expiry timeline for issued patents.
    relatedQuestionRefs:
    - QR015

  - type: private-evidence-only
    severity: material
    topic: manufacturing QSR and ISO compliance
    missingEvidence: >-
      Manufacturing facility locations, ISO 13485 certification status, FDA QSR
      21 CFR Part 820 compliance history, and capacity for TAVR valve production
      at trial and commercial scale.
    whyItMatters: >-
      Undisclosed manufacturing readiness creates regulatory risk during PMA review;
      FDA inspects manufacturing facilities as part of PMA approval process.
    diligencePath: >-
      Request ISO 13485 certificate; confirm FDA facility registration numbers;
      visit manufacturing site(s) during diligence.
    relatedQuestionRefs:
    - QR016

  - type: missing-source
    severity: minor
