callouts:
- calloutType: risk
  title: Single-Site STAR Enrollment Is the Highest-Urgency Operational Risk
  body: >-
    As of June 2026, ClinicalTrials.gov lists only Piedmont Heart Institute as an
    active STAR trial site. A 1,025-patient pivotal TAVR RCT cannot be completed
    at a single site in any competitive timeframe. Site activation at 15–20 centers
    is the highest-urgency operational task: each week of delay in site activation
    adds proportionally to the PMA timeline and extends the window before BSX's
    option can be exercised.
  claimRefs:
  - CR001
  - CR002
  - CR024

- calloutType: risk
  title: Rhenium Dependency Is Unhedged and Undisclosed
  body: >-
    USGS Mineral Commodity Summaries 2025 confirms that the U.S. is 65% net-import
    reliant for rhenium, with primary sources in Kazakhstan, Canada, and Chile.
    Rhenium prices rose 33% between 2020 and 2024. MiRus has not disclosed any
    rhenium supply agreements, pricing hedges, or inventory buffer. A supply
    disruption would simultaneously affect TAVR valve production and orthopedic
    implant manufacturing — creating a single-point-of-failure across MiRus's entire
    product portfolio.
  claimRefs:
  - CR018
  - CR019
  - CR020
  - CR021

- calloutType: assumption
  title: BSX Option Exercise Probability Is the Key Valuation Driver
  body: >-
    The $4.4B implied MiRus valuation is only justifiable if BSX exercises its $3B
    TAVR acquisition option. If the option is not exercised, the implied value of
    MiRus falls to the standalone orthopedic/spine business, which is unquantifiable
    from public sources. The probability of option exercise is a function of STAR
    primary endpoint success, trial timeline, and BSX's strategic capital allocation
    at the time of exercise — all unresolved as of June 2026.
  claimRefs:
  - CR011
  - CR012
  - CR031
  - CR032

