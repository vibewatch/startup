- id: physician-site-concentration-and-competitive-risk
  title: Physician/Site Concentration and Competitive Risk
  body: >-
    MiRus's clinical and commercial TAVR prospects are highly concentrated in a
    small number of physician-champions. The STAR trial chair is Martin B. Leon, MD
    (Columbia University) and Co-Chair is Vinod H. Thourani, MD (Piedmont Heart
    Institute). The national Principal Investigators are Pradeep K. Yadav, MD
    (Piedmont; also MiRus founder's son and lead EFS operator), Raj Makkar, MD
    (Cedars-Sinai), Samir Kapadia, MD (Cleveland Clinic), and Philippe Genereux, MD
    (Atlantic Health System). This concentration in six named physicians at five
    institutions represents the entirety of publicly confirmed clinical advocacy for
    the Siegel device. Departure, incapacity, or disengagement of any of these
    investigators — particularly Dr. Yadav and Dr. Thourani at Piedmont, the sole
    active STAR site — would directly impair trial enrollment velocity. The
    investigator-PI relationship is also complicated by the fact that Jay S. Yadav,
    MD (MiRus founder and CEO) is the father of Pradeep Yadav, creating a potential
    conflict-of-interest disclosure risk that adverse observers will flag.


    Competitive risk intensifies as the STAR trial progresses. Edwards Lifesciences
    controls approximately 55–65% of the U.S. TAVR market with the SAPIEN 3 Ultra
    platform, supported by extensive TVT Registry outcomes data, device iterations
    (SAPIEN 3 Ultra RESILIA), and established IDN/GPO contracting. Medtronic's
    Evolut FX TAVR system has published 2-year randomized data (Evolut Low Risk
    RCT) showing significantly less bioprosthetic valve dysfunction (5x less
    prosthetic valve thrombosis, 9x less haemodynamic structural valve dysfunction
    than SAPIEN). These durability data advantages may become a competitive hurdle
    for the Siegel if the STAR 5-year data are not collected before commercial launch.
    Anteris Technologies received FDA IDE approval for its PARADIGM pivotal trial
    (DurAVR balloon-expandable TAVR with biomimetic leaflets) in November 2025,
    creating a third next-generation platform that will compete for clinical trial
    sites, investigators, and eventually market share with similar timing to MiRus.


    The competitive pressure on commercial launch timing is significant: if
    Edwards or Medtronic launch next-generation valves (RESILIA, Evolut FX Pro)
    with multi-year outcomes data before MiRus completes STAR, the clinical
    differentiation of the Siegel 8 Fr sheath and nickel-free design may be
    insufficient to displace entrenched incumbents in academic structural heart
    programs, particularly if Siegel lacks 2-year STAR data at launch.
