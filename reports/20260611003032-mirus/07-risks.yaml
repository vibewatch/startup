- id: manufacturing-supply-chain-and-material-risk
  title: Manufacturing, Supply Chain, and Material Risk
  body: >-
    MiRus's competitive differentiation in both TAVR (Siegel) and orthopedics
    (EUROPA, RIGEL, IO systems) is built on the proprietary Molybdenum-Rhenium
    (MoRe) alloy. This differentiation creates a double-edged material risk: the
    same properties that make MoRe superior (rhenium content providing radiopacity,
    nickel-free biocompatibility, strength, and fatigue resistance) also create
    supply chain vulnerability, because rhenium is among the rarest and most
    geographically concentrated critical minerals on Earth.


    According to the U.S. Geological Survey Mineral Commodity Summaries 2025,
    U.S. apparent consumption of rhenium was approximately 27,000 kg in 2024, with
    net import reliance at 65%. Primary U.S. production (~9,500 kg) is a byproduct
    of molybdenum concentrate roasting at porphyry copper mines in Arizona and
    Montana. Ammonium perrhenate imports — the form used in alloy production — came
    primarily from Kazakhstan (26%), Canada (24%), and Poland (15%), with 35% from
    other sources. Geopolitical disruption in Kazakhstan (a major rhenium exporter),
    Chilean supply constraints (rhenium metal powder), or export controls on
    strategic materials could directly impact MiRus's ability to manufacture the
    MoRe alloy at scale.


    Rhenium prices are volatile and have risen substantially: the average price of
    99.99% pure rhenium metal pellets was $1,370/kg in 2024, up from $1,030/kg in
    2020 (per USGS MCS 2025), representing a ~33% increase over four years. A
    180-degree reversal or further spike — which occurred during the 2007–2009
    aerospace-demand cycle — could materially increase the cost of goods for
    all MiRus MoRe-based implants simultaneously.


    No public information exists on MiRus's rhenium sourcing agreements,
    supplier identities, inventory buffer, or contractual cost protections. The
    2023 PubMed study on MoRe ion release characterization (Spine J. 2023) confirms
    the alloy's biocompatibility in physiologic environments but does not address
    manufacturing scalability or supply-chain redundancy. MiRus has not disclosed
    its manufacturing facility locations, quality management system certifications
    (ISO 13485, FDA QSR 21 CFR Part 820), or capacity constraints for scaling
    TAVR valve production to clinical and eventually commercial volumes.
