- id: buyer-user-payer-segmentation
  title: Buyer, User, and Payer Segmentation
  body: >-
    The TAVR buyer and payer landscape is highly institutionalized and concentrated. The primary
    buyer in structural heart is the hospital capital committee or structural heart service-line
    administrator, who evaluates system cost, implant pricing, training requirements, and
    institutional credentialing. The user is the multidisciplinary heart team—typically an
    interventional cardiologist and a cardiac surgeon acting jointly under AATS/ACC/SCAI/STS
    consensus requirements—and the payer for the overwhelming majority of procedures is Medicare,
    which covers TAVR under a National Coverage Determination (NCD) with Coverage with Evidence
    Development (CED) conditions. Approximately 88% of TAVR procedures are performed in hospitals
    according to Grand View Research end-use data, with the remainder at ambulatory surgical
    settings, though complex structural heart cases are almost exclusively at hospital-based programs.
    For the SIEGEL valve specifically, payer access is currently constrained to CMS-approved CED
    clinical-study enrollment; commercial reimbursement is not available until FDA approval.
    The spine buyer map differs meaningfully: the budget owner is typically the orthopedic or spine
    surgery department head and the hospital supply chain committee, with surgeons exercising
    significant choice through consignment-style implant programs. The payer mix is broader and
    more commercially varied—Medicare, Medicaid, commercial insurers, and workers' compensation all
    feature—though Medicare still covers the majority of spinal fusion in patients over 65. Adoption
    triggers in spine favor surgeons with prior positive material experience, which is why MiRus
    building clinical data and key-opinion-leader support through its 510(k)-cleared portfolio
    matters for commercial momentum. A third category—ambulatory surgery centers (ASCs) for less
    complex spine procedures—represents a growing segment where novel implant materials may see
    faster uptake due to fewer capital-committee gatekeepers, but MiRus has not publicly identified
    ASC penetration as a current focus.
