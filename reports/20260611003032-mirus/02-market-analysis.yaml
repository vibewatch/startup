  - - Watchful waiting / medical management
    - Pharmacologic therapy for AS; echocardiographic surveillance
    - Entirely outside device spend
    - Cardiologist decision; outpatient payer
    - Status-quo substitute that intervention must demonstrate superiority over; relevant to asymptomatic TAVR debate
