- id: TM003
  title: Segment and buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Budget owner
  - Adoption trigger
  rows:
  - - High-volume structural heart center (academic / quaternary)
    - Hospital service-line VP / capital committee
    - Interventional cardiologist + cardiac surgeon (multidisciplinary heart team)
    - Medicare (~75–80%); commercial insurers (~15–20%)
    - Patient referral → CT sizing → heart team evaluation → device selection → procedural booking → post-op follow-up
    - CFO / cardiovascular service line VP
    - "Competitive clinical data; key-opinion-leader relationships; CMS CED coverage confirmation; favorable reimbursement rate"
  - - Community hospital TAVR program (volume ≥50 cases/yr)
    - Hospital administrator / supply chain committee
    - Interventional cardiologist (cardiac surgery on call or telemedicine)
    - Medicare predominantly
    - Simpler pathway; direct cardiologist referral; less complex cases
    - Hospital administrator
    - "Ease of training; smaller sheath size (8Fr for SIEGEL); proctoring support; competitive cost per case"
  - - Spine surgery center (academic + community)
    - Orthopedic or neurosurgery department chair / supply chain
    - Spine surgeon (orthopedic or neurosurgical)
    - Medicare, commercial, workers' comp mix
    - Pre-op CT/MRI planning → implant selection → OR consignment → post-op imaging
    - Department head / supply chain VP
    - "MoRe alloy artifacts reduction on CT/MRI; surgeon familiarity from distributor; pricing vs. incumbent"
  - - ASC (ambulatory surgery center) — spine
    - ASC owner / administrator
    - Spine surgeon (independent)
    - Commercial payers; Medicare for eligible cases
    - Faster throughput; lower-acuity spine cases; streamlined consignment logistics
    - ASC owner / physician partner
    - "Lower instrument-set cost; surgeon preference; alloy familiarity; bundled payment compatibility"
  - - Structural heart patient (direct)
    - N/A (patient does not purchase device)
    - Patient with symptomatic or asymptomatic severe AS
    - Medicare or commercial insurer
    - Patient referred by primary cardiologist to TAVR center
    - N/A
    - "Symptom burden; referral pathway; guideline recommendation; geographic access to TAVR center"
  notes: Buyer/user/payer segmentation based on SCAI/STS consensus requirements, CMS coverage policy, GVR end-use data showing 88% hospital share, and MiRus spine product descriptions. CED-only status means structural heart access is currently limited to STAR trial sites.
