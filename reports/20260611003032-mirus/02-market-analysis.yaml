    gatekeepers that slow new-entrant adoption and are particularly relevant for MiRus SIEGEL.
  data:
    items:
    - label: AS diagnosis and risk stratification
      value: 100
      note: "Echocardiographic screening; ~2.1M US adults ≥65 with AS (CDC 5% prevalence estimate); not all diagnosed or referred"
    - label: Referral to TAVR-capable structural heart center
      value: 55
      note: "Patient directed to credentialed center; geographic access limits referral; underdiagnosis documented in women and minorities (CDC)"
    - label: Heart team evaluation and procedure selection
      value: 40
      note: "CT sizing, echo, multi-disciplinary review; device-specific sizing drives product selection; SAVR remains first-line for <65 low-risk per 2020 ACC/AHA guidelines"
    - label: "CED/CMS reimbursement clearance (pre-approval for SIEGEL)"
      value: 20
      note: "For SIEGEL: patient must enroll in STAR trial at CMS-approved CED site (approved 2026-03-27); commercial patients ineligible until FDA approval and new NCD"
    - label: Procedure scheduling and device ordering
