- id: adoption-constraints-reimbursement-and-diligence-gaps
  title: Adoption Constraints, Reimbursement, and Diligence Gaps
  body: >-
    Multiple structural constraints limit adoption speed for TAVR entrants, independent of clinical
    merit. Institutional credentialing requirements jointly established by AATS, ACC, SCAI, and STS
    require a full structural heart program with on-site cardiac surgery, a cardiac catheterization
    laboratory, CT imaging, a multidisciplinary heart team, and documented procedural volume
    before a hospital can offer TAVR commercially. These requirements effectively limit the
    commercial market to hospitals that have already committed substantial capital and achieved
    adequate case volume, concentrating TAVR revenue at roughly 700–900 high-volume centers in the
    US. For MiRus, the STAR pivotal trial's enrollment at CMS-approved CED sites provides access
    only to that small set of investigational sites during the pre-approval period; every new SIEGEL
    center requires credentialing infrastructure that MiRus cannot bypass. Reimbursement timing
    is a second constraint: even after FDA approval, CMS coverage determinations for new TAVR
    devices can take 12–24 months, creating a window where FDA-approved but not-yet-reimbursed
    procedures generate hospital cost exposure. Surgeon training and proctoring requirements impose
    additional adoption friction; new TAVR platforms typically require 10–20 supervised cases
    before independent implantation certification, multiplying per-center launch cost and time.
    Capital intensity at the hospital level—hybrid OR suites, CT infrastructure, echo lab,
    perfusion standby—anchors TAVR programs at well-capitalized centers and slows expansion to
    community settings. Incumbent market concentration is the most durable constraint: Edwards
    Lifesciences and Medtronic together control the large majority of TAVR procedures globally
    through SAPIEN and Evolut product lines, while Abbott holds a smaller but growing share with
    Navitor. Boston Scientific's own prior attempt to build a market position with the ACURATE
    Neo2/Prime platform in Europe while seeking US approval ultimately resulted in product
    discontinuation, demonstrating that technical merit alone does not guarantee share capture
    even for a well-capitalized sponsor. In orthopedic spine, switching costs are lower than TAVR
    given the consignment-style implant logistics, but DePuy Synthes, Stryker, and Zimmer Biomet
    have deeply embedded sales and clinical support networks. Key diligence gaps include the
    absence of public MiRus spine revenue and market share, lack of SIEGEL clinical outcome data
    beyond 30-day EFS follow-up, and unresolved CMS asymptomatic TAVR coverage determination
    that would substantially affect the addressable procedure pool.
