- id: growth-drivers
  title: Growth Drivers
  body: >-
    Several reinforcing factors support above-market-average growth in the TAVR segment over the
    next decade. First, demographic expansion: the WHO projects the global population aged 60 and
    older will double to 2.1 billion by 2050, and calcific AS prevalence is 1,841 cases per 100,000
    adults aged 70 and older globally—approximately 12.6 million people today. In the US alone,
    AS affects 5% of adults 65 and older (roughly 2.1 million people) according to CDC data.
    Second, indication expansion: the FDA approved the Edwards SAPIEN 3 platform for asymptomatic
    severe AS in May 2025, the first-ever approval for this population. CMS is now reconsidering
    its NCD to cover asymptomatic TAVR following Edwards's formal request citing the EARLY TAVR
    randomized trial, in which the composite endpoint (death, stroke, unplanned hospitalization)
    occurred in 26.8% of TAVR patients versus 45.3% under watchful waiting. Extending TAVR to
    asymptomatic patients could meaningfully expand the addressable procedure volume, though payer
    acceptance remains contested as many cardiologists oppose asymptomatic treatment. Third,
    age-group penetration: TAVR has shifted from a high-risk-only procedure to the dominant modality
    in patients 65 and older. In the 65–80 age group, TAVR utilization doubled from 42.1% to 80.6%
    of AVR procedures between 2016 and 2022; in the over-80 group it reached 97.8%; and even in
    the under-65 group—historically SAVR territory—TAVR reached 51.7% of procedures by 2022.
    For spine, growth drivers include an aging population with rising degenerative disc disease
    burden, expansion of minimally invasive surgical techniques, and MiRus's proprietary MoRe
    alloy, which may reduce imaging artifact and improve bone integration compared to titanium or
    cobalt-chromium implants, though independent comparative outcome data at scale are not yet
    publicly available.
