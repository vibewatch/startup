company:
  name: MiRus
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    MiRus operates at the intersection of two large but structurally distinct markets: the global
    TAVR/structural heart segment (USD 6.8 billion in 2024, 6.6% CAGR through 2030) and the global
    spinal implants market (USD 13.9 billion in 2024, 6.0% CAGR to 2033). Both markets are
    dominated by well-capitalized incumbents—Edwards Lifesciences, Medtronic, and Abbott in TAVR;
    Medtronic, DePuy Synthes, Stryker, and Zimmer Biomet in spine—and both impose institutional,
    regulatory, and reimbursement gatekeepers that structurally slow entry. MiRus's near-term
    commercial addressable market is effectively limited to the STAR randomized trial's
    CED-enrolled patient population until FDA approval of SIEGEL, while the orthopedic spine
    business operates in a large but mature market requiring differentiated material technology and
    clinical adoption to displace entrenched competitors.

sections:
- id: market-boundary-and-scope
  title: Market Boundary and Scope
  body: >-
    MiRus competes in two adjoining segments that share a material-science foundation but have
    distinct regulatory, reimbursement, and buyer architectures. The structural heart segment
    encompasses all transcatheter and surgical aortic valve replacement (TAVR and SAVR) procedures,
    associated delivery and imaging systems, and structural-heart service-line infrastructure at
    qualified hospitals. Excluded from this boundary are coronary-artery devices, cardiac rhythm
    management, mitral and tricuspid interventions (though MiRus has an option for those via the
    Boston Scientific agreement), and non-cardiac vascular procedures. The orthopedic and spine
    segment encompasses fusion implants (interbody cages, pedicle screws, rods), motion-preserving
    devices, extremity implants, and adjacent procedural tools where MiRus holds FDA 510(k)
    clearances. Excluded are large-joint arthroplasty (hip, knee), sports medicine, orthobiologics,
    and robotics-assisted surgery platforms that MiRus does not currently sell. The status-quo
    substitutes differ sharply by segment: for structural heart, surgical aortic valve replacement
    (SAVR) and watchful waiting remain the clinical default for many patient populations; for spine,
    non-operative management (physical therapy, steroid injections) and existing metal-alloy cages
    from incumbents are the base case. The common thread is that MiRus's MoRe molybdenum-rhenium
    alloy replaces conventional materials (cobalt-chromium, nitinol, titanium) in both product
    families, which is the key differentiation claim but also a hurdle given surgeon familiarity with
    incumbent alloys. Adjacent spend areas include structural heart imaging (echo, CT), robotic
    spine navigation, and post-TAVR monitoring, none of which MiRus currently addresses but which
    influence overall hospital budget allocation and capital committee decisions.
