callouts:
- calloutType: insight
  title: Asymptomatic AS indication creates a major upside catalyst — but remains reimbursement-gated
  body: >-
    The FDA approved Edwards SAPIEN 3 for asymptomatic severe AS in May 2025, the first
    approval of any TAVR system for this indication. CMS has opened a reconsideration of its NCD
    in response, citing the EARLY TAVR data showing a 18.5 percentage-point composite-endpoint
    advantage for early TAVR over surveillance (26.8% vs 45.3%). If CMS expands coverage,
    approximately 300,000–500,000 additional US patients with asymptomatic severe AS could become
    eligible annually, dramatically expanding the addressable market. For MiRus, this is a
    double-edged signal: a larger market validates the TAVR program, but the FDA approval and
    clinical evidence base currently belong entirely to Edwards's SAPIEN platform. SIEGEL would
    need its own asymptomatic data—likely a separate study from STAR—to participate in any
    expansion.
  claimRefs:
  - CM013
  - CM014
  - CM020
  - CM021

- calloutType: risk
  title: Boston Scientific ACURATE market exit is a cautionary precedent for new TAVR entrants
  body: >-
    Boston Scientific—the same strategic investor that committed USD 1.5 billion to MiRus—had
    its own TAVR product (ACURATE Neo2/Prime) in advanced European clinical use and US regulatory
    development, but ultimately discontinued the program. This failure despite BSX's capital,
    distribution network, and clinical-affairs infrastructure underscores that technical merit,
    funding, and strategic support do not guarantee TAVR market-share capture. The specific
    reasons BSX discontinued ACURATE have not been fully disclosed publicly, preventing detailed
    attribution to clinical, pricing, market-concentration, or regulatory factors, making it an
    unresolved adverse signal for competitive diligence.
  claimRefs:
  - CM036
  - CM037
  - CM038

- calloutType: insight
  title: MiRus's orthopedic spine base operates in a USD 6.6B US market with near-term commercial momentum
  body: >-
    The US spinal implants market is estimated at approximately USD 6.6 billion in 2024,
    growing at a 6% CAGR. MiRus has 24 FDA 510(k) clearances including cervical, thoracic,
    lumbar, and extremity systems, giving it a broad commercial product base. The spine segment
    generates current revenue that cross-subsidizes the SIEGEL TAVR development program, though
    the amount is not publicly disclosed. In spine, MiRus competes with deep-pocketed incumbents
    including DePuy Synthes (JnJ), Stryker, and Zimmer Biomet, but the proprietary MoRe alloy's
    MRI-compatibility and biomechanical profile may differentiate implants in markets where
    imaging artifact or bone integration quality matters clinically.
  claimRefs:
  - CM027
  - CM028
  - CM029
  - CM039
  - CM040
  - CM041

- calloutType: risk
  title: CMS reimbursement trajectory for SIEGEL is uncertain and binary for near-term commercial launch
  body: >-
    Commercial launch of SIEGEL in the US requires not only FDA approval (dependent on STAR trial
    outcomes) but also a CMS NCD or LCD determination providing Medicare reimbursement at a
    commercially viable level. CMS CED approval on March 27, 2026 enables STAR enrollment but
    does not constitute commercial coverage. Given that CMS is simultaneously reconsidering its
    asymptomatic TAVR NCD, the agency's bandwidth and policy attention may affect timelines. A
    scenario where FDA approves SIEGEL but CMS delays NCD revision by 18–24 months would
    substantially delay revenue ramp and could force MiRus to price below cost to maintain
    hospital access during the gap.
  claimRefs:
  - CM011
  - CM012
  - CM016
  - CM037

