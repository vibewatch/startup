- id: TM004
  title: Growth drivers and adoption constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for MiRus
  - Diligence ask
  rows:
  - - Aging global population (60+ doubling to 2.1B by 2050)
    - Driver
    - Ongoing through 2030+
    - Expands AS incidence base and absolute procedure volume over time
    - Confirm that US AS incidence rate translates to incremental procedure volume beyond existing backlog
  - - Indication expansion to asymptomatic severe AS (FDA May 2025 for SAPIEN 3; CMS NCD reconsideration ongoing)
    - Driver
    - 2025–2027 if CMS expands coverage
    - Could add 300,000+ new eligible US patients; but also strengthens Edwards's lead position
    - Obtain final CMS NCD decision; model impact on competitive ASP pressure vs. volume gain
  - - TAVR utilization shift to younger, lower-risk patients (51.7% of <65 age group by 2022)
    - Driver
    - Accelerating; ongoing
    - Increases durability concern weighting; favors biologically favorable materials like MoRe
    - Commission long-term durability comparisons; assess SIEGEL valve longevity data pipeline
  - - CMS CED requirement for SIEGEL (STAR trial enrollment only)
    - Constraint
    - Until FDA approval (~2027–2028 if STAR proceeds on schedule)
    - Limits commercial revenue to trial-site reimbursement; no commercial launch until post-approval
    - Map STAR site count and enrollment rate; identify potential CED expansion path
  - - Institutional credentialing requirements (AATS/ACC/SCAI/STS)
    - Constraint
    - Permanent structural barrier; governs all TAVR sites
    - Restricts addressable market to ~700–900 credentialed US centers
    - Confirm how many STAR sites overlap with credentialed high-volume centers
  - - Incumbent market concentration (Edwards + Medtronic dominant; BSX ACURATE discontinued)
    - Constraint
    - Ongoing; entrenched distributor relationships
    - Market share capture requires compelling differentiated data vs. SAPIEN and Evolut; BSX's failed ACURATE entry is an adverse precedent
    - Request MiRus competitive win/loss data; assess independent head-to-head data timeline
  - - Reimbursement lag after FDA approval (12–24 months for CMS NCD update)
    - Constraint
    - Applicable post-FDA approval
    - Creates revenue gap where device is approved but not reimbursed at commercial rates
    - Model cash-flow scenario under delayed reimbursement; assess DRG pricing for new TAVR
  - - Capital intensity (hybrid OR, CT imaging, echo, perfusion)
    - Constraint
    - Ongoing
    - Limits expansion to community centers; MiRus 8Fr sheath reduces vascular access cost but not room/imaging cost
    - Assess whether SIEGEL's 8Fr profile opens community center opportunities not accessible by 14-16Fr competitors
  notes: Timing assessments are qualitative estimates based on regulatory and clinical evidence gathered through June 2026. The BSX ACURATE discontinuation is cited from public fetch data (access blocked PDF); additional verification recommended.
