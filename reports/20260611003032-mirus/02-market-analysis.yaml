    - "Competition: SAVR remains guideline-recommended for symptomatic AS in patients under 65; limits TAVR pool"
  - - Spinal implants / fusion (US)
    - Interbody cages, pedicle screws, rods, plating systems, extremity implants across cervical/thoracic/lumbar
    - Large-joint arthroplasty, sports medicine, orthobiologics, robotics-assisted surgery
    - Orthopedic/spine department; supply-chain committee; Medicare, commercial, workers' compensation
    - Current commercial revenue base; MiRus has 24 FDA 510(k) clearances; competing against DePuy, Stryker, Zimmer
  - - Adjacent structural heart (US)
    - Mitral/tricuspid transcatheter repair, left atrial appendage closure, related structural procedures
    - Currently excluded from MiRus commercial operations
    - Hospital structural heart program; same buyer as TAVR
