    - Count includes historical clearances; current marketed product list may differ; no Class III PMA in hand
  - - FDA Breakthrough Device Designation
    - Awarded July 2024 for EUROPA® PCF system
    - Posterior cervical spine indications
    - Designation ≠ approved; regulatory timeline compression only; PCF 510k granted Nov 2024
  - - NTAP (New Technology Add-on Payment)
    - Awarded for EUROPA® PCF System (per MiRus press release; CMS year undisclosed)
    - Hospital reimbursement supplement for novel technology during NTAP window
