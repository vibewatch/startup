- id: siegel-tavr-platform
  title: Siegel TAVR — Structural Heart Platform
  body: "The SIEGEL™ Transcatheter Aortic Valve (TAVR) is MiRus's structural heart device, a balloon-expandable transcatheter heart valve for the treatment of symptomatic severe aortic stenosis. The device is designed around three interlinked features enabled by the rhenium alloy frame: an 8 French expandable delivery sheath, an open-cell frame that eliminates foreshortening during deployment, and intrinsic commissural alignment. Boston Scientific confirmed in its May 2026 investment announcement that the 8 Fr sheath is approximately 50% smaller than current commercially available TAVR delivery sheaths, which run 14–16 French. All three valve sizes — 23 mm, 26 mm, and 29 mm — are delivered through the same 8 Fr sheath, and the valve arrives pre-mounted on the balloon. The frame is coated with nitric oxide and the leaflets are dry porcine pericardial tissue treated against calcification. Siegel is the only nickel-free THV system on the market per MiRus and Boston Scientific, enabling treatment of patients with nickel allergies (estimated at 20% of Americans according to MiRus). First-in-human results from five patients treated at Instituto Nacional del Torax in Santiago, Chile (June 2024) showed no mortality, stroke, permanent pacemaker, or vascular complications at 30 days; mean gradient was 6.7 mmHg. The U.S. early feasibility study (EFS, NCT06680427) enrolled 15 patients at five centers; 30-day data presented at New York Valves (July 2025) showed no deaths, strokes, rehospitalizations, vascular complications, paravalvular leak, or permanent pacemaker implantations. Core lab echo data showed mean gradient 6.3 mmHg and valve area 2.8 cm². The FDA unconditionally approved the STAR pivotal trial (IDE) in November 2025. STAR is a 1,025-patient prospective multicenter RCT randomizing 1:1 to Siegel or a commercially available balloon- or self-expanding THV; primary endpoint is composite mortality, stroke, and cardiovascular hospitalization at one year. First patients were enrolled at Piedmont Heart Institute on April 8, 2026. The STAR trial is chaired by Martin Leon and Vinod Thourani; national PIs include Pradeep Yadav, Raj Makkar, Samir Kapadia, and Philippe Genereux."
