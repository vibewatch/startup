- id: TE003
  title: Technology and operating architecture table
  columns:
  - Layer / component
  - Role in product
  - Key dependency
  - Technical risk
  rows:
  - - MoRe® alloy (Mo-47.5Re)
    - Core enabling material for all implant families
    - Rhenium supply (primarily Kazakhstan and Chile as byproduct of Mo mining)
    - Supply concentration; price volatility; single-alloy platform creates correlated risk across product lines
  - - MoRe Expansion Engine
    - Enables in-situ expansion for IO lumbar and IO wedge product families
    - Proprietary locking mechanism design; IP protection
    - Mechanism complexity; replication risk if IP challenged; manufacturing precision required
  - - Siegel TAVR rhenium frame (NO-coated)
    - Balloon-expandable scaffold holding porcine leaflets; radial strength + no foreshortening
    - Nitric oxide coating process; alloy forming precision
    - Coating uniformity and durability; frame recoil under in-vivo conditions over years
  - - Dry porcine pericardial leaflets (anti-calcification treated)
    - TAVR valve tissue; haemodynamic function
    - External or in-house porcine tissue supply; anti-calcification treatment process
    - Long-term structural valve deterioration unknown; tissue durability in younger patients unclear
  - - 8 Fr expandable delivery sheath
    - TAVR catheter delivery system enabling access through smaller femoral arteries
    - Sheath materials; catheter manufacturing
    - Real-world operator complication rate; vascular access injury in non-expert centers
  - - GALILEO™ platform (planning, monitoring, RPM)
    - Preoperative surgical planning; intraoperative spine alignment feedback; postoperative remote monitoring
    - Software / digital infrastructure; regulatory clearance for each module
    - Clearance status unverified for all modules; adoption rate unknown; integration with hospital systems unclear
  notes: Architecture derived from public product pages, job postings, and press releases. Dependency and risk characterizations reflect diligence inference; actual manufacturing specifications, supply contracts, and coating process details are not publicly disclosed.
