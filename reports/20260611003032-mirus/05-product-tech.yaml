- id: TE002
  title: Clinical workflow and use-case table
  columns:
  - User job
  - Current workflow
  - MiRus solution
  - Measurable / claimed benefit
  - Limitation
  rows:
  - - Thoracolumbar spinal fusion (adult deformity)
    - Titanium or CoCr rod-screw fixation; rod fracture is known complication in long constructs
    - EUROPA® Pedicle Screw + MoRe rods with lifetime warranty
    - Higher fatigue resistance; warranty covers revision if fracture occurs
    - Long-term human fusion and revision rates not publicly disclosed
  - - Minimally invasive lumbar interbody fusion
    - Static TLIF/XLIF spacer selected by preop templating and intraop trialing
    - IO™ Expandable Lumbar Interbody (3 mm profile → 16 mm)
    - Smaller insertion profile reduces tissue retraction; intraop lordosis titration
    - Published fusion or clinical outcomes data not identified in public sources
  - - Posterior cervical fixation in smaller patients
    - Standard 3.5–4.0 mm CoCr rods; hardware prominence risk
    - EUROPA® PCF with 2.9 mm MoRe rod
    - Lower-profile implant; potentially less invasive in pediatric / small patients
    - Investigational for PCF indications at Breakthrough Device stage; PCF clearance K242516 now obtained
  - - Foot and ankle lateral column lengthening (Evans osteotomy)
    - Fixed-size wedge selected by preoperative templating; no intraop adjustment
    - IO™ Expandable Wedge Osteotomy System
    - Intraoperative real-time correction adjustment before locking; reduces need for size changes
    - Very early commercial launch (Feb 2026); no published clinical outcomes
  - - TAVR in high-vascular-risk or small-vessel patients
    - 14–16 Fr sheath systems (Edwards SAPIEN, Medtronic Evolut) require ≥5.0–5.5 mm femoral access
    - SIEGEL 8 Fr delivery system
    - Access via smaller femoral arteries; particularly relevant for women and small patients
    - Investigational; no commercial approval; STAR outcome data pending
  - - TAVR in nickel-allergic patients
    - No approved nickel-free TAVR option; must avoid standard CoCr-based frames
    - SIEGEL (nickel-free rhenium frame)
    - Enables TAVR for ~20% of Americans with nickel allergy per MiRus claim
    - Allergy prevalence claim unverified from independent epidemiology in this context
  notes: Benefit claims reflect MiRus company-stated and physician-quoted performance; independent randomized efficacy data are limited to the EFS 30-day results for TAVR and are unavailable for spine products. Spine rows based on device design specs; clinical outcome comparison to competitors requires head-to-head data not yet available.
