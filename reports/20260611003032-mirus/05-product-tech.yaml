callouts:
- calloutType: strength
  title: 8 Fr TAVR delivery — structural break vs. competitors
  body: "The Siegel TAVR's 8 French delivery sheath is approximately 50% smaller than current commercially available TAVR systems. This is not an incremental improvement but a structural design break enabled by the rhenium alloy's radial strength-to-gauge ratio. At 30-day follow-up across 20 patients (FIH + EFS), zero vascular complications were recorded. The small-profile advantage is particularly relevant for the estimated 30–40% of TAVR patients who are women, for patients with peripheral artery disease, and for any expansion of TAVR into younger lower-risk populations where long-term vascular safety matters more."
  claimRefs:
  - CE019
  - CE024
  - CE026
  - CE027

- calloutType: risk
  title: SIEGEL clinical evidence base is thin ahead of STAR
  body: "The strongest near-term technical risk for MiRus's enterprise value driver is the reliance on just 20 patients (n=5 FIH plus n=15 EFS) of short-term (30-day) follow-up data to support a $3 billion option and the broader TAVR narrative. The STAR trial is the definitive gate. STAR needs to enroll 1,025 patients and follow them for at least one year, meaning primary data readout is realistically late 2027 at earliest from April 2026 enrollment. PMA filing and subsequent FDA review add further delay. Long-term TAVR outcomes including structural valve deterioration, paravalvular leak durability, and pacemaker rates over 5–10 years are entirely unknown."
  claimRefs:
  - CE026
  - CE027
  - CE030
  - CE045
  - CE046

- calloutType: insight
  title: BSX's $3B TAVR option price implies a validation floor and a residual risk
  body: "Boston Scientific's exclusive option to acquire MiRus's TAVR business for an additional $3 billion (on top of its $1.5 billion equity investment) after clinical and regulatory milestones is simultaneously confirmatory and cautionary. It confirms that a leading cardiovascular strategic values the Siegel technology differentiation highly enough to pay a premium for the option. It is cautionary because the option is conditional — it is exercisable only after MiRus achieves specific milestones that Boston Scientific has not yet committed to fund. The $3B option price is itself contingent; it does not represent a guaranteed enterprise event."
  claimRefs:
  - CE039
  - CE040
  - CE041

