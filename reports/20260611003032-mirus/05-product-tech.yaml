  title: MiRus product architecture stack
  type: stack
  layout: wide
  summary: "MiRus's product architecture is a four-layer stack from core material through device mechanisms to commercial families and procedural tools."
  data:
    items:
    - label: "Layer 1 — Core Material: MoRe® (Mo-47.5Re, FDA approved 2019)"
      note: "High yield strength, fatigue resistance, minimal recoil, nickel-free/cobalt-free. >100 patents. >15 years R&D."
    - label: "Layer 2 — Device Mechanisms: IO Expansion Engine | TAVR Open-Cell Frame | 3DR Expandable Body | NO-coated Re frame"
      note: "Alloy properties enable 3 mm interbody insertion, 8 Fr TAVR delivery, 2.9 mm PCF rod. These designs are infeasible with Ti/CoCr."
    - label: "Layer 3 — Commercial Product Families: Spine (EUROPA, IO, RIGEL, ANTARES) | Extremity (IO Wedge, ATLAS) | Structural Heart (SIEGEL TAVR)"
      note: "24 FDA 510k clearances for orthopedic/spine. SIEGEL investigational under IDE."
    - label: "Layer 4 — Procedural Solutions: GALILEO™ (planning, intraop alignment, RPM) | VITESSE™ insertion system"
      note: "Extends product value into pre/intra/post-operative workflow. Clearance status and adoption not fully confirmed publicly."
    - label: "Layer 5 — Clinical Programs: EFS (n=15, complete) | STAR RCT (n=1,025, enrolling) | EUROPA PCF Breakthrough Device"
      note: "Clinical data pipeline supporting eventual PMA for TAVR and expanded spine indications."
