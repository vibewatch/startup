company:
  name: MiRus
chapter:
  number: 5
  title: Product & Technology
  summary: MiRus delivers a unified implant platform anchored by its proprietary MoRe® (Molybdenum-47.5Rhenium) superalloy, spanning commercial spine and orthopedic hardware and an investigational balloon-expandable TAVR system. The spine/orthopedic portfolio carries 24 FDA 510(k) clearances and includes multiple product families across fusion, interbody, and extremity surgery; the IO™ expandable family and EUROPA® Posterior Cervical System represent the most technically differentiated entrants. The SIEGEL™ TAVR is the company's structural-heart flagship, employing an 8 French delivery sheath, nickel-free rhenium frame, and open-cell design that eliminates foreshortening — features corroborated by zero-endpoint 30-day data in a 15-patient U.S. early feasibility study and now entering a 1,025-patient pivotal RCT (STAR trial, enrollment began April 2026) that will determine the PMA pathway.
sections:
- id: more-alloy-platform
  title: MoRe Alloy Platform — Core Material Science
  body: "MiRus' entire product and technology strategy rests on MoRe®, a Molybdenum-47.5Rhenium (Mo-Re) binary alloy that the company first developed with inspiration from NASA rocket-engine material science and that the FDA cleared for use in medical implants in 2019. The alloy has been in development for over 15 years. The primary mechanical advantage is a combination of high yield strength, superior fatigue resistance, and minimal recoil compared with the two alloys that currently dominate the spinal implant market — titanium (Ti-6Al-4V) and cobalt chromium (Co-28Cr-6Mo). Critically, an in-vitro corrosion study published in Spine Journal (2023) measured metal ion release from MoRe® in both physiologic and inflammatory saline environments using ICP-MS methods. MoRe® stayed far below the FDA-permitted daily exposure (PDE) limits for molybdenum (1,900 μg/cm² day) and rhenium (4,400 μg/cm² day) throughout all tested intervals, including the inflammatory condition. The same study found that cobalt-chromium approached or exceeded its PDE for cobalt and vanadium under inflammatory conditions — a direct safety contrast. The alloy is nickel-free and cobalt-free. In the structural-heart context, MiRus uses a nitric oxide-coated rhenium frame for the Siegel TAVR, citing radial strength greater than cobalt or titanium. These material properties enable design choices that would be infeasible with legacy alloys: a 2.9 mm posterior cervical rod in EUROPA PCF (versus 3.5–4.0 mm for commercial equivalents), a 3 mm lumbar interbody insertion profile that expands to 16 mm, and an 8 French TAVR delivery system against the industry standard of roughly 14–16 French. The company claims more than 100 patents covering the alloy and derived device designs."
