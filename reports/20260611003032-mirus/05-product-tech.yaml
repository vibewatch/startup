- id: FE002
  title: Siegel TAVR clinical workflow
  type: flow
  layout: wide
  summary: "The Siegel TAVR procedure follows the standard TAVR workflow but with an 8 Fr femoral access step that enables broader patient eligibility and next-day discharge."
