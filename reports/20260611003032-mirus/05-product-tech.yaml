  - - IDE (Investigational Device Exemption) for STAR trial
    - FDA unconditional IDE approval November 25, 2025
    - SIEGEL TAVR pivotal trial (NCT07278310)
    - IDE ≠ PMA; commercial approval requires successful STAR completion and separate PMA filing
  - - MoRe® alloy FDA status
    - Approved for use in medical implants 2019
    - Base material for all MiRus implant families
    - Long-term in-vivo human safety data limited to short-term follow-up; no adverse event or recall record found
  - - In-vitro biocompatibility / ion release
    - Published Spine J 2023 study confirms low Mo and Re ion release far below FDA PDE
    - In-vitro physiologic and inflammatory environments (30-day duration)
    - In-vitro data; long-term in-vivo human corrosion data absent from public record
  - - GMP / quality management system
    - Standard Class II device GMP (21 CFR Part 820) applies; no public ISO 13485 or audit disclosures
    - All cleared products
    - No public quality system certification, audit report, or adverse event database entries found
  - - Adverse events / recalls
    - No FDA MedWatch, recall, or MDR reports identified for MiRus products
    - All products
    - Absence of adverse event records in public databases is a positive but not a guarantee
  notes: Regulatory status from openFDA, FDA accessdata, and MiRus press releases. NTAP year and CMS decision document not independently verified from CMS website. GMP and quality certifications are standard obligations for Class II medical devices but are not independently confirmed from public records.
