- id: capital-ownership-public-transition
  title: Funding history, ownership, and public-market transition
  body: 'Shadowfax''s capital history spans venture and crossover backers before its public-market transition. Eight Roads, Entrackr, and TechCrunch all reported the February 2024 $100 million round led by TPG NewQuest, with participation from Mirae Asset, Nokia Growth Partners, Qualcomm, IFC, Flipkart, and Trifecta. Those reports establish that the business remained attractive to growth capital even after the Indian logistics category had become more skeptical on burn and margin quality. By 2025, the company had pivoted from private fundraising to IPO execution. The January 2026 red herring prospectus disclosed an offer aggregating up to ₹19,072.69 million, consisting of a fresh issue of up to ₹10,000 million and an offer for sale of up to ₹9,072.69 million. The selling-shareholder list in the filing included Flipkart Internet Private Limited, Eight Roads Investments Mauritius II, NewQuest Asia Fund IV, and Mirae Asset funds, showing that existing institutional holders used the IPO as a
    partial-liquidity event while the company still raised primary capital. The prospectus also recorded in-principle approvals from BSE and NSE dated August 13, 2025. External reporting tracked the transition in real time. VCCircle reported Shadowfax''s confidential IPO filing in 2025, Economic Times reported the updated draft prospectus for a ₹2,000 crore IPO, and Financial Express covered the January 2026 price band of ₹118-124. Qualcomm Ventures later framed the January 28, 2026 listing as a category-defining milestone for Indian logistics. Together these sources show a company that moved from unicorn-style private financing into a listed-company disclosure rhythm without changing its core thesis: using an asset-light network and software layer to win share in express and hyperlocal logistics.'
