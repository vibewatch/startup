- id: milestones-and-adverse-context
  title: Milestones, new products, and adverse context
  body: 'Shadowfax''s narrative arc is visible in its milestones. The About Us page starts the story in 2015 with a pure last-mile food-delivery and courier service and 10,000-plus orders per day in its first year. Later company material emphasizes the shift into broader 3PL, express, hyperlocal, and quick-commerce categories, while 2026 exchange disclosures added two notable product and corporate actions: the April 17, 2026 acquisition disclosure for Criticalog and the April 21, 2026 launch disclosure for Shadowfax 360. These moves suggest continued expansion into software-led merchant tooling and premium logistics services around the core network. There is also an adverse side to the 2026 record. TechCrunch reported that Shadowfax slipped on listing as investors focused on heavy revenue concentration among a handful of large ecommerce and quick-commerce clients. That does not negate the business''s progress, but it does explain why public-market scrutiny is different from late-stage private
    fundraising scrutiny: network scale and growth are no longer enough if the market worries that bargaining power sits with a concentrated customer set. The appropriate read is balanced. Shadowfax has achieved milestone density rarely seen in Indian logistics: founding-to-scale in ten years, major venture backing, audited profitability, public-market transition, and continuing product launches. But the same public-market transition has exposed the next set of diligence questions around concentration, segment mix, and how sustainable current profitability is if pricing remains intensely competitive.'
