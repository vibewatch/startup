company:
  name: Shadowfax
chapter:
  number: 1
  title: Company Overview
  summary: Shadowfax is an Indian last-mile logistics platform founded in 2015 that has evolved from a food-delivery and courier network into a full-stack express, hyperlocal, reverse-logistics, and fulfillment provider. Official 2026 disclosures show a Bengaluru-headquartered, publicly listed company led by co-founder Abhishek Bansal, with 2,500+ cities, 15,100+ PIN codes, and 2.5 lakh+ average quarterly transacting delivery partners on the company site; audited FY26 standalone revenue reached ₹4,080.35 crore with FY26 profit after tax of ₹115.18 crore, while Q4 FY26 revenue reached ₹1,237 crore in the investor presentation. The company raised $100 million in 2024 from TPG NewQuest-led investors, moved into IPO mode through 2025, and by 2026 had disclosed a ₹19.07 billion offer structure, a broader board and committee framework, and new products such as Shadowfax 360. The strongest diligence positives are network scale, improving profitability, and multi-vertical reach; the main caveats
    are client concentration, valuation sensitivity, and some inconsistency between different public revenue presentations.
sections:
- id: identity-operating-model
  title: Identity, headquarters, and operating model
  body: 'Shadowfax Technologies was originally incorporated on April 21, 2015 in Delhi as Shadowfax Technologies Private Limited, according to the January 2026 red herring prospectus. The same filing says the company converted to a public limited company in 2025 and shifted its registered office to Bengaluru effective October 1, 2025. Current official pages place the company at Devarabisanahalli, Bellandur, Bengaluru and describe it as an Indian logistics platform spanning express parcel, same-day and next-day delivery, 30-minute delivery, reverse logistics, fulfillment, and value-added services. The company mission published on the About Us page is to build the fastest and most reliable logistics network by empowering a million micro-entrepreneurs through technology. This framing matters because Shadowfax still operates as an asset-light coordination layer rather than a warehouse-heavy or linehaul-dominant incumbent. Its consumer and merchant promise is speed and reliability; its supply-side
    promise is income opportunity through a large delivery-partner network. Official 2026 marketing pages describe reach across more than 2,500 cities and 15,100 PIN codes, with 2.5 lakh-plus average quarterly transacting delivery partners. Older company-authored material also highlights the hybrid nature of the network: express parcel for ecommerce and D2C brands, hyperlocal and quick-commerce delivery for higher-frequency use cases, and value-added services such as fraud control, route optimization, and reverse-logistics tooling. That combination makes Shadowfax more than a courier brand; it is a software-mediated logistics operating system with service lines tuned to different delivery-time promises.'
