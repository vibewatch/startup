- id: scale-profitability-inflection
  title: Scale snapshot and profitability inflection
  body: 'The strongest new fact in the 2026 record is profitability at scale. The May 14, 2026 board-meeting outcome disclosed audited standalone revenue from operations of ₹4,080.35 crore for FY26, up from ₹2,467.20 crore in FY25, with profit after tax of ₹115.18 crore versus ₹6.21 crore a year earlier. The same filing showed Q4 FY26 standalone revenue from operations of ₹1,205.81 crore and profit after tax of ₹55.27 crore. Separately, the investor presentation summarized Q4 FY26 revenue at ₹1,237 crore, FY26 revenue at ₹4,202 crore, adjusted EBITDA of ₹159 crore, and 22.6 crore customer orders delivered in Q4 FY26 across express and hyperlocal services. The difference between audited standalone revenue and investor-presentation revenue requires care, but both official disclosure sets point in the same direction: Shadowfax is no longer just a growth story. The company is now generating positive earnings while still compounding order volume and network density. The presentation also disclosed
    15,656 PIN codes, 2,59,609 partners, and strong order growth in express and hyperlocal segments, suggesting the network is scaling rather than merely extracting margin from a static footprint. Independent coverage corroborates the trend. Entrackr reported H1 FY26 revenue of ₹1,805.6 crore and profit of ₹21 crore, while Inc42 reported FY24 revenue of ₹1,884.8 crore and a 92% reduction in net loss to ₹11.8 crore. Read together, the evidence suggests a three-stage progression: first, large-scale network formation; second, loss compression through margin discipline; and third, visible profitability supported by order growth, not just cost cutting. That is one of the clearest reasons Shadowfax now screens as a serious category leader rather than a venture-funded logistics intermediary.'
