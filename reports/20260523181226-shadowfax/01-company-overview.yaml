  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: post-ipo-ownership-mix
    missingEvidence: Fully diluted post-IPO cap table with promoter, institutional, ESOP, and public-float percentages after secondary sales and ESOP allotments.
    whyItMatters: Ownership concentration shapes control, liquidity, follow-on supply, and founder alignment after the public listing transition.
    diligencePath: Reconcile latest shareholding pattern, allotment notices, and prospectus dilution schedules into a fully diluted cap-table model.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO003
  - type: conflicting-data
    severity: material
    topic: fy26-revenue-comparability
    missingEvidence: A clear bridge explaining why the investor presentation cites FY26 revenue of ₹4,202 crore while the board-approved audited standalone result shows ₹4,080.35 crore revenue from operations.
    whyItMatters: The company overview chapter needs one canonical number; unresolved presentation-versus-audit differences can cascade into valuation and financial model drift.
    diligencePath: Request reconciliation between presentation KPIs and audited statutory line items, including whether one figure is consolidated, rounded, or segment-summed.
    relatedQuestionRefs:
    - QO024
  - type: private-evidence-only
    severity: material
    topic: client-concentration-detail
    missingEvidence: Top-customer revenue shares, contract durations, and churn protections behind the public-market concentration concern.
    whyItMatters: Shadowfax’s post-listing risk perception depends on whether large clients are durable, diversified across service lines, or able to reprice the network aggressively.
    diligencePath: Request top-10 customer concentration, contract tenure, and wallet-share data from management or review deeper prospectus risk-factor tables.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-table-to002-completeness
    missingEvidence: A complete leadership org chart including CFO, audit-chair biographies, and any additional board observers or senior executives not named on the governance page.
    whyItMatters: The leadership and founder table is intentionally partial and should not be read as a complete management roster for succession-risk analysis.
    diligencePath: Request an updated leadership org chart and board biographies pack from investor relations after the next annual report cycle.
    relatedQuestionRefs:
    - QO008
    - QO009
    relatedTableRefs:
    - TO002
