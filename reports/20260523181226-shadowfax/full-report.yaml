      - number: '7.2'
        title: Operational Quality and Security Risk
        blocks:
          - type: paragraph
            body: >
              Shadowfax operational model is asset-light but latent-risk-heavy. Three sub-risks dominate: gig-workforce
              availability and quality lost-in-transit and shipment-damage exposure and technology-infrastructure
              concentration.

              The rider network of 2.05 lakh non-exclusive delivery partners gives Shadowfax scale elasticity but no
              contractual exclusivity. A competitor offering better incentives can trigger a rapid exodus. Attrition
              fell from approximately 50 percent in FY25 to 15.3 percent in H1 FY26 per Moneycontrol sourced RHP data
              but this improvement is concentrated in urban hubs; rural franchisee routes remain fragile. The SF Shield
              rider verification system (facial AI 20 million scans daily) mitigates identity fraud but cannot prevent
              en-masse defection to rival platforms.

              Shipment quality and loss metrics are disclosed in general terms in the RHP. Quality-check and
              lost-shipment costs were reported at approximately 6.1 percent of Q4 FY26 revenue per analyst coverage.
              Higher loss rates disproportionately impact the D2C segment where Shadowfax is the sole carrier of record.
              Insurance coverage for in-transit loss is stated to be maintained in the RHP but policy limits and
              exclusions are not disclosed.

              Technology and cybersecurity risk is elevated by three factors: (1) SF Shield processes biometric data
              creating a DPDP Act obligation; (2) all core dispatch routing and real-time tracking systems run on cloud
              infrastructure; (3) Shadowfax SaaS platform Shadowfax 360 is a newer revenue stream with limited
              independent security audit history. A prolonged cloud provider outage or material breach of biometric data
              stores would disrupt operations and trigger regulatory penalties simultaneously.
