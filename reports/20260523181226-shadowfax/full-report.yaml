      - number: '7.3'
        title: Partner and Dependency Risk
        blocks:
          - type: paragraph
            body: >
              Revenue concentration and partner dependency are the most frequently cited risks by analysts covering the
              IPO. The RHP discloses that the single largest client Flipkart Instakart accounted for 48.91 percent of H1
              FY26 revenue (51.23 percent H1 FY25 48 percent FY25 59.23 percent FY24). The top-five clients collectively
              accounted for 74.6 percent of FY25 revenue and 84.96 percent of FY24 revenue. These figures are not
              improving structurally: H1 FY26 shows only a marginal reduction from FY25 levels.

              Meesho and one other unnamed e-commerce anchor client each represent meaningful single-digit percentage
              shares. Loss of any one of the top three clients without replacement volume would likely render the
              current fixed-lease and headcount base unprofitable within two to three quarters given INR 1322 crore in
              lease liabilities.

              Third-party franchisee dependency is a second-order concentration risk. Shadowfax last-mile in tier-2/3
              markets is delivered through approximately 4600 franchisee partners (as of FY25 with some growth in FY26).
              The franchisee model has attracted consumer-fraud complaints and quality-control dispersion. Franchisee
              contracts are typically short-term and renewable creating renewal-risk cliffs.

              On the technology supply side Shadowfax dispatch and routing engine is hosted on third-party cloud
              infrastructure. The RHP does not name the cloud provider or disclose disaster-recovery RPO/RTO targets. A
              single-provider concentration without disclosed failover creates tail-risk for the 3.5 million-plus daily
              shipment volume.
