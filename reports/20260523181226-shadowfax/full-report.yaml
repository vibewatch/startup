      - number: '1.2'
        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              Shadowfax remains founder-led. The 2026 governance page lists Abhishek Bansal as Chairman, Managing
              Director and CEO, while Vaibhav Khandelwal serves as Whole-Time Director and CTO. The same page adds
              Praharsh Chandra as Whole-Time Director and CBO and Gaurav Jaithlia as Whole-Time Director and Head of
              Business Strategy. The red herring prospectus continues to identify Abhishek Bansal and Vaibhav Khandelwal
              as the company promoters, which makes the founder duo the primary governance and control anchors even
              though the disclosed executive bench is broader. Governance has clearly been formalized for public-market
              scrutiny. The board now includes independent directors such as Bijou Kurien, Pirojshaw Sarkari, and
              Ruchira Shukla, alongside named board committees for audit, nomination and remuneration, stakeholder
              relationships, risk management, CSR, and IPO matters. Investor-correspondence disclosures additionally
              identify Krishnakanth G V as Company Secretary and Compliance Officer, showing the company has staffed the
              statutory interfaces expected of a listed issuer. The main governance strength is continuity: the business
              still presents itself through the founding narrative, and official and external sources repeatedly center
              Abhishek Bansal in financing, IPO, and strategy communication. The main governance risk is the inverse of
              that strength: leadership concentration remains high, especially because the founders and early operating
              team still sit at the intersection of product strategy, investor relations, and go-to-market execution.
              The company has added governance scaffolding, but the business story remains tightly identified with its
              founding team.
