  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Adjusted EBITDA margin breakdown
        - Below 3% for two consecutive quarters
        - >-
          Destroys the argument that Shadowfax deserves a growth-stock logistics multiple rather than a mature
          low-margin rerating.
        - Exit or materially cut exposure at first confirmation.
      - - Customer concentration worsens
        - Any single customer exceeds 40% of revenue
        - >-
          Shows diversification is failing and increases sensitivity to pricing resets or allocation cuts from one
          account.
        - Move from MONITOR to AVOID unless management supplies hard contractual protection.
      - - Growth re-rates to mature logistics
        - FY28E revenue CAGR falls below 20%
        - Lowers justified multiple from around 25x to something closer to 15x, compressing fair value sharply.
        - Re-underwrite the stock on downside multiples; do not average down blindly.
      - - PE/lock-up supply overhang crystallises
        - Major pre-IPO holders sell into July–October 2026 lock-up expiry windows
        - Adds technical supply pressure to a valuation already lacking strong upside support.
        - Avoid initiating positions immediately ahead of expiry windows without block-sale absorption evidence.
    notes: >
      These are explicit thesis-break conditions rather than generic risks. Each threshold changes either the multiple
      investors should pay or the confidence they can have in the growth and diversification story.
    claimRefs:
      - CV038
      - CV046
      - CV047
      - CV048
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters for Valuation
      - Diligence Path
    rows:
      - - Service-line unit economics
        - Audited economics by e-commerce, q-commerce, hyperlocal, FMCG, and kirana distribution service lines.
        - Without segment-level economics, margin sustainability and the right blended multiple cannot be verified.
        - Request board-grade segment profitability pack and service-line contribution margin bridge.
      - - Flipkart commercial terms
        - >-
          Pricing protections, volume commitments, termination rights, and related-party or strategic commercial
          clauses.
        - Flipkart concentration is the central downside variable in both base and bear cases.
        - Review customer master agreement, amendment history, and revenue concentration dashboard.
      - - Adj. EBITDA quality
        - Separate disclosure of FY26 ESOP cost and capitalised technology spend adjustments.
        - True comparability versus Blue Dart, Delhivery, and analyst models depends on consistent EBITDA treatment.
        - Reconcile management-adjusted EBITDA to Ind-AS accounts with auditor or controller support.
      - - Q-commerce disintermediation
        - >-
          Revenue contribution and profitability by Blinkit, Swiggy Instamart, Zepto, and other rapid-delivery
          customers.
        - >-
          The market is paying for growth partly driven by q-commerce; internal fleet build-outs could reduce external
          logistics demand.
        - Obtain customer-level cohort trend and volume share movement by category.
      - - Exit and overhang readiness
        - Detailed lock-up expiry schedule and expected PE investor sell-down path over 12–24 months.
        - Supply-side pressure can cap upside even if operating performance stays solid.
        - Review cap table, lock-up calendar, and likely secondary/block-deal route with bankers or IR.
    notes: >
      These are the final diligence items most likely to change the recommendation. If management cannot supply them,
      the right posture remains MONITOR rather than BUY.
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
      - CV050
