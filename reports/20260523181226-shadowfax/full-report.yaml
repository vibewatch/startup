  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: IPO context and public-market entry
        blocks:
          - type: paragraph
            body: |
              Shadowfax's valuation debate starts with its IPO tape, because the market gave a mixed first verdict.
              The company came to market at a ₹124 price band and listed on January 28, 2026 at ₹113, roughly 9%
              below issue price. That weak debut matters for valuation because it shows investors initially viewed
              the offer as fully priced even before the company had a full post-listing reporting track record.
              The structure also carried sentiment baggage: the IPO raised approximately ₹2,250 crore, but the
              presence of an OFS element by existing investors meant the transaction did not read as a pure growth-
              capital round. Public evidence therefore frames the listing less as a clean rerating catalyst and
              more as a negotiated liquidity event in which early holders partially de-risked while public buyers
              accepted execution and valuation risk.

              What changed after listing was not the existence of the business but the market's willingness to pay
              for it. The stock rallied sharply into May 2026 as Shadowfax reported FY26 profitability, delivered
              a strong Q4, and drew formal analyst initiation from JM Financial, ICICI Securities, and Morgan
              Stanley. That rebound improves confidence in the quality of the platform but does not erase the
              original message from the IPO: public investors were willing to own Shadowfax only at a discount,
              and the current price has moved materially ahead of that initial clearing level. The valuation
              chapter therefore treats the IPO not as proof that the current mark is cheap, but as evidence that
              pricing discipline matters and that public support for the stock remains conditional rather than
              unconditional.
            claimRefs:
              - CV001
              - CV002
              - CV036
              - CV038
              - CV049
      - number: '8.2'
        title: Current public-market valuation
        blocks:
          - type: paragraph
            body: |
              By May 22, 2026 Shadowfax had become a profitable, publicly traded logistics platform with numbers
              that are credible enough to support institutional coverage. Shares traded at ₹201.28 within a 52-week
              band of ₹98.55 to ₹212, implying a market capitalisation of roughly ₹11,747–11,770 crore and an
              enterprise value near ₹10,962 crore after adjusting for net cash. FY26 revenue reached ₹4,202 crore,
              adjusted EBITDA ₹159 crore, Ind-AS EBITDA ₹212 crore, and net profit ₹112 crore; ROCE and ROE both
              sit near 9.6%. Those are real milestones, especially for a logistics operator that recently came to
              market and still operates with thin reported margins.

              The valuation issue is not whether Shadowfax is real; it is whether the current price leaves enough
              room for error. At 2.61x EV/FY26 revenue, 51.75x EV/Ind-AS EBITDA, 92.33x trailing PE, and 50.66x
              forward PE, the stock is being asked to perform more like a growth platform than a mature logistics
              carrier. Analyst targets reinforce that tension. JM Financial's ₹190 target and ICICI Securities'
              ₹175 target both sit below the market, while Morgan Stanley's ₹225 target is the only major upside
              case above spot. Consensus near ₹197 effectively says the market has already discounted most of the
              current public bull thesis. That makes Shadowfax investable to monitor, but difficult to underwrite
              as an obvious buy at ₹201 without stronger evidence on margin durability, concentration reduction,
              and comparative advantage versus peers.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
