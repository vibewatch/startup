      and partner interfaces at the top, showing the key technology components within each layer and their primary
      dependencies.
    data:
      layers:
        - id: physical-network
          label: Physical Network (Layer 1)
          modules:
            - 53+ leased sort centres (3.5M+ sq ft; 4,299+ touchpoints; 15,000+ PIN codes; 2,500+ cities)
            - Third-party linehaul fleet (asset-light; no owned trucks or planes)
            - HD bullet cameras at sort centres (SF Shield; 20M scans/day; 4M images/videos/day)
        - id: cloud-infrastructure
          label: Cloud Infrastructure (Layer 2)
          modules:
            - Google Cloud Platform (post-AWS migration 2025; 8 NAT IPs; Private Google Access)
            - Internal Load Balancers for inter-service traffic (post-migration optimisation)
            - Kafka messaging bus (async inter-service events; schema registry cleaned post-migration)
        - id: data-ai
          label: Data and AI Platform (Layer 3)
          modules:
            - SF Maps — ANN/Siamese network; 1.5B-point training data; VectorDB; H3 geospatial indexing
            - AI selfie validation — FaceNet 512-D embeddings; liveness detection; 96% precision
            - SF Shield AI video analytics — stream-based geospatial algorithms; neural network image processing
            - Route optimisation engine; demand forecasting; AI RTO predictor
        - id: core-platform
          label: Core Platform Services (Layer 4)
          modules:
            - Order Management System (OMS) — order intake, PIN-code serviceability, partner assignment
            - Real-time tracking — GPS every 5 seconds; live shipment status via webhooks
            - COD remittance automation; WhatsApp customer communication bot
        - id: service-lines
          label: Product Service Lines (Layer 5)
          modules:
            - Express parcel (~69% revenue H1 FY26); Hyperlocal / quick commerce (~20%)
            - Reverse logistics; CriticaLog critical-goods (₹130 crore ARR); Prime Large heavy parcel (₹60 crore ARR)
            - Dark store operations (managed fulfilment nodes; 20%+ GM at top stores)
        - id: integration-layer
          label: Integration and API Layer (Layer 6)
          modules:
            - REST API — order creation, tracking webhooks, label generation, reverse-pickup initiation
            - Shopify App Store integration (shadowfax-order-app); WooCommerce one-click (Shadowfax 360)
            - Postman public collection (workspace 9ba9v71); sandbox environment
        - id: client-interfaces
          label: Client and Partner Interfaces (Layer 7)
          modules:
            - Shadowfax 360 self-serve portal (launched April 21, 2026; SME / D2C; flat-rate billing)
            - Enterprise API dashboard for large ecommerce and quick-commerce clients
            - Android Delivery Partner Super App (v25.7.3; 9M+ downloads; 4.1/5; 100,000+ DAU)
