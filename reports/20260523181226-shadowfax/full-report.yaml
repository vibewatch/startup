      - number: '6.3'
        title: Named customer proof and evidence quality
        blocks:
          - type: paragraph
            body: >
              The clearest customer proof for Shadowfax comes from the Red Herring Prospectus and its citations across
              multiple independent sources: the RHP names individual clients, discloses their revenue contribution
              percentages, and identifies specific service lines used. This is formal regulatory-grade customer evidence
              rather than marketing copy. The named client list across the RHP and corroborating sources includes
              Meesho, Flipkart, Myntra, Swiggy, BigBasket, Zepto, Nykaa, Blinkit, Kartrocket, Zomato, Uber, Pincode,
              Purplle, Licious, ONDC, and Magicpin. For the quick-commerce segment, ICICI Securities confirms Shadowfax
              provides specialised hyperlocal delivery to Zepto, BigBasket, Blinkit, Swiggy Instamart, and Flipkart
              Minutes. The largest client, Meesho — India's largest social commerce platform — uses Shadowfax for
              express forward parcel and reverse pickup across its pan-India seller network. The relationship is
              long-standing: Meesho was a primary growth driver from Shadowfax's earlier growth phase, and its 48.9%
              revenue share in H1 FY26 confirms the depth of integration. Flipkart Internet Private Limited was itself a
              Shadowfax shareholder, participating as a selling shareholder in the January 2026 IPO, which provides
              additional validation of the strategic relationship depth. Snapdeal co-founders Kunal Bahl and Rohit
              Bansal (Titan Capital) invested early and realised approximately 158 times their initial investment at the
              IPO per Scanx, confirming that the Shadowfax–Snapdeal link originated as a customer-investor relationship.
              The Shadowfax official About Us page describes the company as "the preferred logistics partner for India's
              top e-commerce and hyperlocal brands," a marketing framing consistent with the prospectus-level evidence.
              Evidence quality is high for production deployment: all named clients are active shipping accounts, not
              pilots. However, formal case studies, client testimonials, documented SLA performance metrics, and outcome
              statements are not publicly available. The evidenceGaps note below details this limitation. Shadowfax is
              confirmed as the largest 3PL in same-day delivery and reverse pickup by order volume for FY25 and Q1 FY26
