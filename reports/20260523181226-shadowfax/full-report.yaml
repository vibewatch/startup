      - number: '4.4'
        title: Capital adequacy, cash, capex, and financing dependency
        blocks:
          - type: paragraph
            body: >
              Following the January 2026 IPO that raised approximately ₹1,907 crore (₹1,000 crore fresh issue, ₹907
              crore OFS), Shadowfax operates with a robust post-listing balance sheet. Per Simply Wall St data as of end
              of FY26, total shareholder equity stands at approximately ₹1,740 crore and total debt is approximately
              ₹0.28 crore — negligible. Cash and short-term investments are approximately ₹1,120 crore. Total assets are
              approximately ₹2,830 crore, with total liabilities of approximately ₹1,090 crore. Short-term assets
              (₹1,640 crore) comfortably exceed both short-term liabilities (₹890 crore) and long-term liabilities (₹200
              crore), suggesting sound near-term liquidity. EBIT of approximately ₹94.5 crore supports 4.8x interest
              coverage.

              Operating cash flow was ₹350 crore in FY26 — a significant improvement indicating the business is now
              self-funding at the operating level. The 9-month FY26 free cash flow (operating cash flow minus capex) was
              ₹61 crore even as the company deployed its highest-ever capex: ₹140 crore in the 9M period and ₹185 crore
              for the full FY26 year. Management has guided FY27 capex at ₹180-190 crore, representing approximately
              2.5-3.5% of expected revenue (down from 4.4% in FY26). This indicates the heaviest absolute-capex cycle
              may have passed.

              The funding chronology — from venture rounds through the $100 million TPG NewQuest-led 2024 round to the
              January 2026 IPO — is covered in the Company Overview chapter. For the forward capital assessment, the
              relevant facts are: (1) the company has no material debt dependency; (2) it is operating-cash-flow
              positive; (3) IPO proceeds allocated for use include ₹423 crore for network capex, ₹139 crore for lease
              payments on new facilities, and ₹89 crore for branding and marketing; (4) the remaining proceeds and cash
              reserves are available for inorganic acquisitions and general corporate purposes. The lease model for all
              logistics facilities is a structural funding dependency — every square foot of operating space (currently
              3.5 million+ sq ft) is leased, making the lease-payments line a recurring capital obligation rather than a
              one-time asset purchase. This lease dependency persists despite the strong equity cushion and must be
              assessed as a recurring cash demand alongside capex when projecting capital adequacy.
