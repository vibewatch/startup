  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Pillar
      - Supporting Evidence
      - What Would Change the View
    rows:
      - - THESIS
        - Scale and network density
        - >-
          FY26 shipments reached 72.6 crore across 2,000+ cities, giving Shadowfax a meaningful density advantage in
          open-network third-party logistics.
        - >-
          Evidence of sustained shipment share loss or materially slower volume growth versus listed peer Delhivery
          would weaken the scale-premium argument.
      - - THESIS
        - Product and service differentiation
        - >-
          First-attempt delivery above 94% and rapid q-commerce / dark-store growth suggest Shadowfax can serve more
          time-sensitive categories than slower peers.
        - >-
          If q-commerce economics deteriorate or large clients internalise fulfilment, the product-differentiation
          premium should compress.
      - - THESIS
        - Operating leverage
        - >-
          The gig-based, asset-light model and routing technology indicate that incremental volume can lift EBITDA
          without proportional capex.
        - >-
          If incremental growth requires rising incentives, leased-capacity spending, or technology amortisation
          adjustments, the leverage thesis weakens.
      - - ANTI-THESIS
        - Valuation priced for near perfection
        - 51.75x EV/Ind-AS EBITDA and 92x PE leave little room for margin misses or temporary volume softness.
        - >-
          A lower entry price or another year of clean margin expansion would reduce the perfection risk embedded in the
          stock.
      - - ANTI-THESIS
        - Thin margin buffer
        - >-
          Adjusted EBITDA margin is only 3.8%, versus Blue Dart's 11.27% and Mahindra Logistics' ~6%, leaving little
          protection against fuel, wage, or pricing shocks.
        - >-
          Consistent adjusted EBITDA margin above 5.5% across multiple quarters would show the business is moving beyond
          fragile profitability.
      - - ANTI-THESIS
        - Customer and channel concentration
        - >-
          Flipkart dependence, light promoter ownership, and q-commerce disintermediation risk mean one or two
          counterparties can still move the equity case materially.
        - >-
          Better segment disclosure, lower single-customer exposure, and proof that new FMCG and kirana volumes are
          diversifying the mix would improve the view.
    notes: >
      The thesis and anti-thesis are deliberately symmetrical. Shadowfax can be a strong operator while still being an
      unattractive stock at the wrong price or with the wrong concentration profile.
