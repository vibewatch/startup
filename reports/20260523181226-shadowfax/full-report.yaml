      - number: '6.2'
        title: Adoption and deployment trajectory
        blocks:
          - type: paragraph
            body: >
              Shadowfax's adoption trajectory is among the sharpest documented for an Indian 3PL operator. The company's
              3PL ecommerce market share grew from approximately 8% in FY22 to 23% in the first half of FY26 per the
              Redseer report cited in the ICICI Securities March 2026 initiating coverage and the Economic Times. ICICI
              estimates market share reached approximately 27–28% by December 2026, implying Shadowfax has consolidated
              its position as the second-largest player behind Delhivery. Express parcel shipment volumes grew from 302
              million in FY23 to 342 million in FY24 to 536 million in FY25, with an estimated 670 million in FY26 per
              ICICI projections. Hyperlocal volumes grew from 48 million in FY23 to 95 million in FY24 to 140 million in
              FY25, with ICICI estimating 196 million in FY26. The H1 FY26 express volume was 29.4 crore (294 million)
              orders, up 50% year-on-year from 196 million in H1 FY25 per Hindu BusinessLine. Total revenue compounded
              at 32.5% CAGR from FY23 to FY25 (₹1,415 crore to ₹2,485 crore), then accelerated to 68.4% year-on-year
              growth in H1 FY26 to reach ₹1,805.6 crore per Entrackr. Full-year FY26 revenue was ₹4,202 crore
              consolidated per the investor presentation. Average express yield per order improved from ₹49 to ₹54
              (approximately 10% or more) over the reported periods per Hindu BusinessLine, a meaningful signal of
              improving revenue quality as value-added services (same-day, open-box, reverse) contribute a greater
              fraction of the express revenue mix. As of September 2025, the network reached 14,758 pin codes through
              4,299 touchpoints with 205,864 average quarterly unique transacting delivery partners per the Red Herring
              Prospectus data cited in Chittorgarh and Paytm Money. The April 2026 launch of Shadowfax 360 opens the SME
              and D2C funnel, which had previously been largely closed to small sellers due to onboarding friction and
              volume minimums. CriticaLog (₹130 crore ARR) and Prime Large heavy parcels (₹60 crore ARR, live in
