  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >
              Shadowfax operates at the intersection of logistics gig-economy labour and digital data processing making
              it subject to a rapidly expanding regulatory perimeter. Four legislative pillars define the near-term
              exposure window.

              The Code on Social Security 2020 (SS Code) became effective November 21 2025 with associated Rules
              notified May 8-9 2026. The SS Code mandates that aggregators contributing to gig and platform workers must
              pay a social-security levy of 1 to 2 percent of annual turnover capped at 5 percent of the total amount
              paid to such workers. At Shadowfax FY26 revenue run-rate of approximately INR 4200 crore this implies an
              annual incremental levy of INR 42 to 84 crore. The company had 2.05 lakh non-exclusive delivery partners
              in FY25. Because the partners are formally non-exclusive the precise applicability of aggregator liability
              is being litigated in industry forums but the RHP explicitly flags this as a material risk without
              quantification.

              The Digital Personal Data Protection Act 2023 and DPDP Rules 2025 (notified November 13 2025) impose
              strict obligations on data fiduciaries. Shadowfax processes biometric identity data through SF Shield (20
              million scans per day 4 million images per day via facial-recognition AI). Non-compliance fines reach INR
              250 crore per breach with full compliance required by May 13 2027 and Consent Manager appointment by
              November 13 2026. The company has not published a formal DPDP compliance roadmap as of the report date.

              GST regime shifts effective July 2025 require Goods Transport Agency operators to elect forward-charge
              liability under the Notification 5/2023. Shadowfax GTA operations face a 5 percent GST rate without ITC or
              12 percent with ITC versus the competitive 18 percent courier rate creating a mixed-incentive pricing
              environment that may erode surface-transport margins if compliance elections are suboptimal.

              As a newly listed entity Shadowfax is subject to SEBI LODR Regulations 2015 amended through 2024 including
              enhanced Related Party Transaction norms increased independent-director scrutiny and quarterly
              disclosures. The company used SEBI Regulation 6(2) eligibility (not the standard 6(1)(b) profitability
              pathway) to qualify for the IPO signalling that standard profitability gates were not met.
            claimRefs: []
