      - number: '5.4'
        title: Developer ecosystem, API surface, and merchant integrations
        blocks:
          - type: paragraph
            body: >
              Shadowfax exposes a REST API to enterprise clients and shipping partners that covers order creation and
              fulfilment, real-time status and tracking via webhooks, label generation, reverse-pickup initiation, and
              COD management. The API uses token-based authentication (Bearer Token / API key) and supports a sandbox
              environment for pre-production testing. APITracker lists Shadowfax as offering webhooks and a developer
              API but does not confirm public OpenAPI/Swagger specs, an OAuth playground, or a publicly downloadable SDK
              — all of which are listed as absent on the tracker profile. A Postman public collection (workspace ID
              9ba9v71) exists and is cited by third-party integration guides, confirming that at least a
              developer-contributed API collection is accessible through Postman's network.

              The Shadowfax Logistics Platform is listed on the Shopify App Store (app slug shadowfax-order-app) and
              grants access to customer data (name, email, phone, physical address), product and inventory data, and all
              order history including returns and third-party fulfilment. The app enables end-to-end workflow automation
              from Shopify order import to shipment creation, tracking updates, and return handling. Third-party
              integration documentation (Parcelmind) describes the integration flow: Shopify order placement triggers an
              API call to Shadowfax order-creation endpoint, with tracking webhooks pushing status updates back.
              WooCommerce integration is disclosed in the Shadowfax 360 press release as a one-click option alongside
              Shopify; no WooCommerce plugin page was independently located.

              The delivery partner Super App (Android package in.shadowfax.gandalf) is the primary field interface for
              the 259,609+ active delivery partners. As of May 2026, version 25.7.3 is the latest release, sized at
              approximately 32.8 MB, requiring Android 5.1+. Google Play lists 9 million+ downloads and a 4.1/5 rating
              from 200,000+ reviews. The app supports multiple earning streams in a single interface — food and grocery
              delivery, express parcel, bike taxi, and 10-minute quick-commerce — making it a multi-service "Super App"
              for the gig workforce. AppBrain data confirms the app as active with continuous updates. User reviews on
              Google Play mention occasional order-allocation inconsistencies and customer-support responsiveness gaps,
              which represent an adverse developer/partner signal on operational reliability at scale.
            claimRefs:
              - CE026
              - CE027
              - CE028
              - CE029
              - CE030
              - CE031
      - number: '5.5'
        title: Trust, safety, compliance framework, and product roadmap
        blocks:
          - type: paragraph
            body: >
              Shadowfax's trust and compliance framework is built primarily around its proprietary AI security stack
              rather than industry certifications. The daily selfie check-in for delivery partners is the most visible
              element: every delivery partner must submit a live selfie at shift start, which the AI pipeline validates
              in real time against the onboarding reference photo using FaceNet embeddings and a liveness model. This is
              supplemented by the SF Eye subsystem within SF Shield, which monitors rider identity at sort centres
              through geospatial algorithms and neural network video analytics, preventing impersonation at induction
              and dispatch points. The Track & Trace subsystem adds a second layer: over 20 million daily barcode scans
              at sort centres with AI anomaly detection for misrouting, mishandling, and theft risk. Geo-location is
              continuously captured (every 5 seconds while the partner is active on the platform), and all personal data
              transmitted through the delivery partner app is encrypted in transit per the Google Play privacy policy
              disclosure.

              On listing-related compliance, Shadowfax is bound by SEBI Listing Obligations and Disclosure Requirements
              (LODR) regulations as a publicly listed entity on NSE (SHADOWFAX) and BSE (544685). The April 21, 2026
              Shadowfax 360 launch was disclosed under Regulation 30 of SEBI LODR, filed by the Company Secretary. There
              are no publicly disclosed ISO 27001, SOC 2, PCI-DSS, or sector-specific logistics certifications on the
              company's public-facing pages. The innovation page does not reference formal data-privacy certifications;
              the company does not operate in a regulated healthcare or financial-services vertical that would mandate
              external audits, though CriticaLog's healthcare and IT-supply-chain verticals may surface compliance gaps
              if expanded.

              The product roadmap as of May 2026, assembled from exchange disclosures and management commentary,
              includes: completion of Shadowfax 360 merchant onboarding at scale (ongoing from April 2026 launch);
              expansion of Prime Large heavy-parcel service from 6,000 to 10,000 pin codes by end FY27; full integration
              of CriticaLog's operational systems and route optimisation into the core platform; continued capex of
              ₹180–190 crore in FY27 directed at sort centre automation and last-mile infrastructure; and an intent
              (disclosed in a Shadowfax AI blog) to move toward agentic AI that autonomously handles disruptions,
              rerouting, and rate adjustments without human intervention. No public API changelog or release cadence is
              published that would allow independent verification of software release velocity.
