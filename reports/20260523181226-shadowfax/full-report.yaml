              best-in-class (21% RTO) and median performers (39%+ RTO) is purely operational — not driven by category or
              platform. For Shadowfax, RTO improvement is both a client retention lever and a net revenue driver: every
              percentage point of RTO reduction eliminates a double logistics event (failed forward delivery + reverse
              pickup) and improves net revenue per shipment. As the market leader in reverse pickup, Shadowfax is
              positioned to profit both from higher RTO events and from the VAS solutions that reduce them — a
              structurally advantageous dual-position.
