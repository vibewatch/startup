      - number: '7.5'
        title: Mitigations and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >
              Shadowfax has implemented a set of operational and governance mitigations. SF Shield provides real-time
              biometric identity verification and fraud pattern detection across 20 million daily scans reducing
              impersonation-based fraud materially since FY24 rollout. The Risk Management Committee chaired by Vaibhav
              Khandelwal meets quarterly and reviews all material risks per the governance page disclosure. The INR 1120
              crore post-IPO cash position provides a buffer of approximately 8 months of operating burn at current
              run-rate. Portfolio diversification into CriticaLog (critical and high-value cargo) Prime Large (bulky
              shipments) and the Shadowfax 360 SaaS platform partially reduces volume concentration risk.

              Despite these mitigations the following observable triggers would constitute thesis-break conditions
              requiring immediate investment review: (1) single top-client volume loss exceeding 20 percent of revenue
              without replacement for two consecutive quarters; (2) a formal DPDP enforcement action or NCLT or High
              Court ruling classifying gig partners as employees; (3) consolidated EBITDA margin falling below 2 percent
              for two consecutive quarters; (4) a material data breach affecting biometric data of rider partners or
              customers leading to regulatory penalties; (5) loss of any three of the four co-founders within a 12-month
              window.
