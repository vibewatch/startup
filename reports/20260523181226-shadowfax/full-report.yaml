      - number: '8.5'
        title: Bull / base / bear scenarios
        blocks:
          - type: paragraph
            body: |
              Scenario analysis is the clearest way to translate Shadowfax's mixed evidence set into valuation
              discipline. The bull case assumes Shadowfax can grow FY28 revenue to ₹7,100 crore, expand adjusted
              EBITDA margin to 7%, and convince the market to pay 30x EV/Adj. EBITDA. That combination yields an
              implied market cap near ₹16,110 crore or roughly ₹276 per share, about 37% upside from the May 22,
              2026 price. The operating logic behind that case is not impossible: q-commerce and FMCG expansion
              continue, customer concentration eases, and operating leverage scales faster than costs. But it also
              assumes investors remain willing to capitalise Shadowfax as a premium growth platform.

              The base case is more conservative and more plausible on today's evidence. Revenue reaches ₹6,700
              crore, adjusted EBITDA margin improves to 5.6%, and the market applies 25x EV/Adj. EBITDA, implying
              roughly ₹10,875 crore market cap or ₹186 per share. That is slightly below the current market price,
              which means even decent execution may not produce attractive near-term returns from here. The bear
              case shows why the stock still deserves a HIGH risk label: if revenue reaches only ₹5,200 crore,
              margin stalls at 4%, and the multiple compresses to 15x, the implied market cap is only about ₹4,120
              crore or ₹71 per share. Probability-weighting those cases produces value around ₹180 per share,
              below current trading levels and consistent with a monitor-not-chase stance.
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV025
