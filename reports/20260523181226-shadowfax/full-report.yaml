          - type: callout
            title: Platform captive logistics and client concentration are structural market constraints
            body: >
              Despite strong market growth, Shadowfax faces two market-structural constraints that limit addressable
              share expansion. First, Delhivery's acquisition of Ecom Express (2025) and ongoing investment by Ekart/ATS
              compresses the 3PL-addressable pool in horizontal ecommerce. Second, Shadowfax's own disclosure (via JM
              Financial) confirms that the top customer contributed 48.9% and top-5 contributed 74.1% of H1 FY26 revenue
