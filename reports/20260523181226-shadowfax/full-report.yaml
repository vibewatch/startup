      - number: '6.4'
        title: Retention, repeat usage, and durability
        blocks:
          - type: paragraph
            body: >
              Shadowfax does not formally disclose net revenue retention (NRR), gross revenue retention (GRR), or client
              churn rates in its prospectus or any post-IPO disclosure. This is a material evidence gap for durability
              assessment. The proxy indicators available suggest high volume retention with enterprise clients. First,
              the revenue concentration of the top five clients was approximately 75% in FY24, 74.6% in FY25, and 74.1%
              in H1 FY26 per ICICI Securities and Scanx — a stable band that implies these accounts have remained active
              and have not defected, even as overall revenue grew 68% year-on-year in H1 FY26. Second, the largest
              client (Meesho) maintained approximately 49% revenue share in both FY25 and H1 FY26, showing no material
              decline in relative wallet share despite the structural concern about Meesho insourcing volumes through
              its Valmo platform. Third, express shipment volumes expanded consistently across every reported period,
              reaching 29.4 crore orders in H1 FY26, up 50% year-on-year, suggesting that existing client order volumes
              are growing, not shrinking — implying net revenue expansion (implicit NRR above 100%) for the retained
              account cohort. Fourth, the average express revenue per order improved from approximately ₹49 to ₹54, a
              yield lift that points to service-mix improvement or pricing discipline rather than pure volume growth at
              flat unit economics. The multi-service integration model (same client uses express, hyperlocal, and
              reverse on the same API and platform) creates structural switching friction: replacing Shadowfax requires
              re-integrating all three service lines with an alternative provider. ICICI Securities and Scanx both note
              this as a retention mechanism. However, the absence of long-term contracts is a durable risk: all
              relationships are SLA-based and terminable, per disclosures in the Hindu BusinessLine review. Meesho's
              insourcing trajectory via Valmo is the primary evidence against retention durability — outsourced share
              declined from 98.2% in FY23 to 35.5% in H1 FY26 per ICICI, even as Meesho's overall revenue contribution
              to Shadowfax remained stable, meaning Shadowfax is holding value through other service lines even as
              express volume from Meesho declines as a share of Meesho's total shipments.
