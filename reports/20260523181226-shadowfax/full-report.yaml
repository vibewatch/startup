companyProfile:
  summary: >
    Shadowfax is an Indian logistics platform founded in 2015 that has expanded from a food-delivery and courier network
    into a scaled express, hyperlocal, reverse-logistics, and fulfillment operator. By 2026 the company had transitioned
    into a publicly listed issuer with audited profitability, a footprint across 2,500+ cities and 15,100+ PIN codes,
    and a large delivery-partner network. The core thesis is an asset-light, software-mediated last-mile network serving
    ecommerce, quick commerce, D2C, and merchant logistics use cases, with adjacent software and control layers such as
    Shadowfax 360 and fraud-management tooling.
