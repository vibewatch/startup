      - number: '2.3'
        title: Buyer, user, and payer segmentation with adoption path
        blocks:
          - type: paragraph
            body: >
              India's ecommerce logistics market is characterised by a buyer-payer structure in which the platform or
              brand — not the end consumer — contracts with and pays the 3PL. Understanding this structure is essential
              for assessing Shadowfax's revenue quality and concentration risk.

              Horizontal ecommerce platforms (Amazon, Flipkart, Meesho) represent the largest buyer segment, accounting
              for the bulk of India's ecommerce express parcel volume. These platforms are sophisticated procurement
              buyers with volume leverage and a demonstrated willingness to invest in captive logistics (Ekart, ATS). JM
              Financial confirms Shadowfax serves Meesho, Flipkart, Myntra, Swiggy, Bigbasket, Zepto, Nykaa, Blinkit,
              Kartrocket, Zomato, Uber, and Purplle — a mix that spans horizontal ecommerce, food/grocery, and
              on-demand, consistent with the company's multi-vertical positioning. Client concentration is materially
              high: the top customer contributed 48.9% of H1 FY2026 revenue, and the top five accounted for 74.1%.

              Quick commerce operators (Blinkit, Zepto, Swiggy Instamart) form a structurally different buyer segment
              with different SLA requirements (sub-30-minute), different dark-store-to-consumer geography, and different
              3PL contract structures. Mordor data shows Tier I Metros held 67.33% of India's quick-commerce market in
              2025 — concentration in dense urban zones that suits Shadowfax's gig-network deployment model. JM
              Financial confirms Shadowfax as market leader in 3PL quick-commerce solutions.

              D2C brands represent a fast-growing segment where buyer sophistication varies significantly. Unicommerce
              data from 6,000+ brands and 410M+ shipments shows D2C GMV grew 33% in FY2026 driven entirely by volume,
              not price increases. ET Brandequity reports that 66% of new D2C orders came from Tier 2 and 3 cities. D2C
              brands typically use courier aggregators or multi-carrier orchestration; acquisition of new D2C clients
              requires tech integration and performance track record.

              Reverse logistics buyers span all segments but represent a distinct budget decision: return-cost
              management is a known pain point (COD RTO at 58% peak, 21% best-in-class per Unicommerce), and Shadowfax
              is confirmed as market leader in reverse pickup shipments by JM Financial. The adoption path for reverse
              logistics typically follows a brand's forward-logistics relationship, making it a natural cross-sell.
