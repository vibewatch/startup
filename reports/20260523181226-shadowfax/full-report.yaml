      - number: '3.2'
        title: Competitor profiles and capability comparison
        blocks:
          - type: paragraph
            body: >
              Each major competitor carries a distinct capability footprint that defines where it overlaps or diverges
              from Shadowfax's addressable segments. Delhivery is the broadest-capability competitor, offering express
              parcel, Part Truckload (PTL) freight, supply chain services (SCS), international delivery, and the newly
              launched Delhivery Local for intra-city delivery — the latter being a direct response to Porter's and
              Shadowfax's hyperlocal share gains. In FY26, Delhivery delivered over 1 billion express parcels for the
              first time, with express shipment volumes growing 40.2% year-on-year to 1,054 million shipments. Its
              EBITDA reached ₹764 crore at 7.3% margin — above Shadowfax's disclosed adjusted EBITDA of ₹159 crore at
              roughly 3.8% on investor-presentation revenue, suggesting scale-derived margin advantages. Blue Dart's
              capabilities are intentionally narrower: air-to-ground at 60:40 mix, serving B2B enterprise accounts
              requiring time-definite commitments. With 404 million FY26 shipments and DHL's global network integration,
              Blue Dart commands premium pricing (typically 30–50% above 3PL express rates) and has virtually no
              quick-commerce or COD/hyperlocal exposure, meaning it does not cannibalize Shadowfax's fastest-growing
              segments. XpressBees covers 2,500+ cities with express B2C, cross-border, 3PL warehousing, and reverse
              logistics, with quick-commerce pilots in select metros as of 2024. Its FY24 revenue of ~₹2,492 crore
              reflects rapid growth from a smaller base, but its negative PAT margin (−6% FY24, Inc42) means it has been
              constrained in capex deployment relative to Delhivery and Shadowfax. Shiprocket's capability stack sits in
              a different layer: it is an orchestration and aggregation platform, not a network operator. Its value to
              merchants is carrier-agnostic routing, fulfillment services, and cross-border tooling. With 400,000+
              merchants and $4B+ annual GMV on the platform, Shiprocket is the demand aggregator through which many D2C
              brands first access Shadowfax's delivery network — meaning Shiprocket is simultaneously a B2B customer and
              a potential disintermediator as it builds warehousing and captive fulfillment capabilities. Porter's
              capability set is largely non-overlapping: intra-city mini-trucks, two-wheelers, and packers-and-movers
              for MSME clients across 22+ cities. Its ₹4,300 crore FY25 revenue and unicorn status reflect network
              density in the intra-city freight market, not ecommerce last-mile. The exception is where Shadowfax and
              Porter both operate hyperlocal delivery in Tier-1 metros, and where Delhivery's Delhivery Local initiative
              is attempting to enter Porter's territory. Loadshare at ~₹1,200 crore FY24 is a tech-enabled regional
              logistics network covering inter-city and last-mile with focus on Tier-2/3 expansion, 250,000+ daily
              deliveries, and British International Investment backing for EV fleet conversion.
