      - number: '2.4'
        title: Growth drivers, adoption constraints, and diligence implications
        blocks:
          - type: paragraph
            body: >
              India's ecommerce and logistics market is driven by a combination of structural demand forces, technology
              enablement, and government policy tailwinds — but is simultaneously constrained by platform captive-arm
              investment, customer concentration, RTO economics, and emerging gig-worker regulatory risk.

              On the demand side, the Flipkart-Bain joint report documented 25% ecommerce growth in Q1 CY2026,
              confirming that the 2025 revival was not a one-quarter event. Bain projects Indian eretail at $170-180B
              GMV by 2030 at 20%+ CAGR. Redseer confirms parcel volumes growing at 15-20% CAGR with 1 billion
              parcels/month by 2030 as the target milestone — the direct translation of GMV growth into shipment demand
              that supports 3PL volume growth. India became the world's second-largest eretail market in 2025 with
              280-300M online shoppers, and the next growth phase is explicitly geographically broadening: Bain confirms
              Tier 2+ cities contributed approximately half of incremental eretail orders in 2025, creating new pin-code
              coverage demand beyond the metro-centric incumbents.

              Mordor Intelligence quantifies the incremental CAGR impacts: quick-commerce boom adds +2.1%, D2C brand
              proliferation +1.5%, ONDC-driven MSME onboarding +1.8%, and UPI/digital payments +1.2%. The National
              Logistics Policy and Dedicated Freight Corridor investment (INR 11.2 trillion in FY26) adds +2.1% by
              targeting structural cost compression from 13-14% of GDP toward the 8% benchmark of developed markets.

              On the constraint side, India's logistics spend at 13-14% of GDP versus 8-10% in developed markets signals
              structural inefficiency that pressures provider margins. Platform captive logistics (Ekart, ATS) directly
              compresses the 3PL addressable market for horizontal ecommerce. MarkWide Research flags diesel price
              volatility, land acquisition constraints, driver shortage, and legacy-ERP integration friction as
              operational headwinds. High COD prevalence drives RTO rates that peak at 58% during festive periods,
              straining working capital and reverse logistics capacity. Shadowfax's own IPO disclosure identifies
              social-security-code regulatory risk as a potential cost escalator for the asset-light gig model. Client
              concentration (top-5 at 74.1% of H1 FY26 revenue) creates platform pricing leverage and reduces
              Shadowfax's ability to resist per-shipment rate compression from large buyers.
