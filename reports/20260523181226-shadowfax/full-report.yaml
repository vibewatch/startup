  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and operating model
        blocks:
          - type: paragraph
            body: >-
              Shadowfax Technologies was originally incorporated on April 21, 2015 in Delhi as Shadowfax Technologies
              Private Limited, according to the January 2026 red herring prospectus. The same filing says the company
              converted to a public limited company in 2025 and shifted its registered office to Bengaluru effective
              October 1, 2025. Current official pages place the company at Devarabisanahalli, Bellandur, Bengaluru and
              describe it as an Indian logistics platform spanning express parcel, same-day and next-day delivery,
              30-minute delivery, reverse logistics, fulfillment, and value-added services. The company mission
              published on the About Us page is to build the fastest and most reliable logistics network by empowering a
              million micro-entrepreneurs through technology. This framing matters because Shadowfax still operates as
              an asset-light coordination layer rather than a warehouse-heavy or linehaul-dominant incumbent. Its
              consumer and merchant promise is speed and reliability; its supply-side promise is income opportunity
              through a large delivery-partner network. Official 2026 marketing pages describe reach across more than
              2,500 cities and 15,100 PIN codes, with 2.5 lakh-plus average quarterly transacting delivery partners.
              Older company-authored material also highlights the hybrid nature of the network: express parcel for
              ecommerce and D2C brands, hyperlocal and quick-commerce delivery for higher-frequency use cases, and
              value-added services such as fraud control, route optimization, and reverse-logistics tooling. That
              combination makes Shadowfax more than a courier brand; it is a software-mediated logistics operating
              system with service lines tuned to different delivery-time promises.
