  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, streams, and segment mix
        blocks:
          - type: paragraph
            body: >
              Shadowfax's primary revenue mechanism is a per-order fee charged to enterprise clients for completed
              logistics transactions. The RHP and public disclosures confirm three revenue segments: express forward
              parcel (the largest); hyperlocal services covering quick commerce, food, and on-demand delivery; and other
              logistics services including critical logistics, strategic insourcing, and dark-store operations. The
              company does not publish a price list. Per the RHP and the Finmint business-model analysis, tariffs are
              enterprise-SLA-based and dynamic across four dimensions — delivery distance, service speed (same-day,
              next-day, hyperlocal), parcel weight, and additional handling requirements (open-box verification, reverse
              pickup, exchange). This means published pricing is not available for due diligence; only realised revenue
              figures in audited accounts are source-reliable.

              In H1 FY26, express forward parcel contributed ₹1,238.7 crore, approximately 69% of operating revenue, up
              57.3% YoY from ₹787.2 crore in H1 FY25. Hyperlocal generated ₹359.3 crore, approximately 20% of operating
              revenue, up 82.5% YoY from ₹196.8 crore. Other logistics services contributed ₹207.5 crore, approximately
              11% of operating revenue, up 136% YoY from ₹88 crore. Q4 FY26 shows similar mix: express ₹925 crore
              (+120.8% YoY), hyperlocal ₹232 crore (+32.1% YoY), and other logistics ₹80 crore — the last category
              intentionally wind-down per Q4 concall as management repositions it toward higher-value critical
              logistics. The company's own prospectus disclosure that value-added services contribute approximately 40%
              of express revenue is the clearest margin-relevant segment statement available; however, because the
              company explicitly does not track or disclose margins at the service-line level, the EBITDA benefit from
              VAS cannot be separately quantified. The full-year FY26 revenue of ₹4,202 crore consolidated (₹4,080.35
              crore standalone audited) reflects compound growth: FY23 was ₹1,415 crore, FY24 ₹1,884.8 crore, and FY25
              ₹2,485 crore.

              A structurally material fact on revenue quality: client concentration is extreme. Per the RHP, the top
              client contributed approximately 49% of H1 FY26 revenue; top five clients contributed 74.6% of FY25
              revenue and 84.96% of FY24 revenue. Flipkart group entities (Instakart Services and Flipkart Internet)
              contributed ₹2,668.57 crore and ₹183.55 crore respectively in FY25, making them the dominant revenue
              anchor. No long-term contracts exist; all relationships are governed by SLAs that can be terminated or
              re-tendered. The RHP states explicitly that "loss of any major client could have a material adverse
              effect." The emerging diversification story — D2C and SME push via Shadowfax 360, CriticaLog (₹130 crore
              ARR), Prime Large heavy shipments (₹60 crore ARR), and vertical quick commerce via dark stores — is
              directionally sound but not yet sufficient to shift concentration ratios materially.
