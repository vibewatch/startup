      - number: '5.6'
        title: Exhibits
        blocks:
          - type: callout
            title: >-
              Proprietary AI stack (SF Maps, SF Shield, selfie validation) is technically documented and operationally
              proven
            body: >
              Unlike most Indian logistics 3PLs that rely on third-party address and routing tools, Shadowfax has
              published detailed engineering accounts of in-house AI systems: SF Maps (1.5 billion data points, >90%
              within-100m accuracy, 10% RTO reduction), SF Shield (20 million daily scans, neural-network video
              analytics), and the selfie-validation pipeline (FaceNet 512-D, 96% precision, liveness detection). These
              are not marketing claims — they are described at model architecture level in engineering blog posts. The
              data moat from 1.5+ billion historical deliveries is a structural barrier to replication that grows with
              each shipment.
