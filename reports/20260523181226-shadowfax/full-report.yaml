      - number: '6.5'
        title: Concentration risk and expansion strategy
        blocks:
          - type: paragraph
            body: >
              Client concentration is the central investor concern about Shadowfax's customer base. The company's
              largest client, Meesho, contributed approximately 48.9% of H1 FY26 operating revenue per ICICI Securities
              initiating coverage. The top five clients contributed 74.1% of H1 FY26 revenue and the top ten
              approximately 84–86% per Hindu BusinessLine and Scanx. TechCrunch reported that Shadowfax's IPO shares
              fell approximately 9% from the ₹124 offer price to ₹112.60 on January 28, 2026 listing, with client
              concentration cited as the primary investor concern — a direct market-based adverse signal. The structural
              risk from Meesho is both the largest and most specific: ICICI Securities documents that Meesho outsourced
              98.2% of its shipments to 3PLs in FY23 but had reduced that to 35.5% by H1 FY26 through its Valmo
              insourcing platform. ICICI's bear case explicitly identifies a "demand slowdown for Meesho, which is its
              biggest client (>50% overall revenue contribution)" as the scenario implying a stock target of ₹80 per
              share. The Ecom Express precedent is a directly relevant adverse case: Ecom Express lost Meesho volume to
              Valmo, entered financial distress, and was acquired by Delhivery for ₹1,407 crore in 2025 at approximately
              a 78% discount to its prior ₹7,300 crore valuation. Shadowfax is actively pursuing concentration
              mitigation. Shadowfax 360 (April 2026) democratises access for SMEs and D2C brands with no volume
              minimums, targeting a new segment that previously could not onboard. CriticaLog provides high-value
              critical logistics (healthcare, auto, luxury, IT) with ₹130 crore ARR and defensible margin. Prime Large
              targets heavy parcel volumetric shipments generating ₹60 crore ARR across approximately 6,000 pin codes.
              Dark-store operations for quick commerce deliver ₹8–15 lakh monthly revenue per store at top-performing
              sites. The expansion logic is sound — Shadowfax's network is an infrastructure layer that any logistics
              vertical can utilise — but the timelines for these adjacencies to materially dilute Meesho's revenue share
              are multi-year, not quarters. ICICI projects Shadowfax's express parcel volumes to grow at 23% CAGR
              through FY28E, driven by market share gains from Amazon onboarding, D2C expansion, and pin-code extension;
              and hyperlocal at 38% CAGR through FY28E, driven by vertical quick-commerce category expansion.
