  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and Shadowfax's addressable perimeter
        blocks:
          - type: paragraph
            body: >
              Shadowfax operates at the intersection of multiple sub-markets within India's logistics ecosystem, and
              defining the boundary correctly is essential before sizing. The company's core addressable market is the
              outsourced, technology-mediated last-mile logistics spend generated by ecommerce platforms, quick-commerce
              operators, D2C brands, food-delivery networks, and on-demand hyperlocal services. Excluded from the
              addressable market are: in-house captive logistics arms (Ekart/Flipkart, Amazon Transportation Services),
              large-parcel and freight-forwarding segments dominated by Blue Dart, Gati, and traditional surface
              freight, and warehousing-only 3PL contracts that do not involve last-mile delivery. These exclusions are
              material: Ekart and ATS collectively serve hundreds of millions of parcels annually for their parent
              platforms and represent a structural ceiling on 3PL addressable volume for horizontal ecommerce.

              Within the addressable boundary, Mordor Intelligence segments India's ecommerce logistics market by
              service type, business model, delivery speed, product category, and city tier. Transportation captured
              71.42% of market revenue in 2025, confirming that delivery itself — not warehousing or analytics — remains
              the dominant spend pool. B2C accounts for 62.58% of the market, with C2C at the fastest-growing 6.42%
              CAGR, driven by peer-to-peer marketplace growth on platforms like Meesho. Fashion and lifestyle holds the
              largest product-category share at 25.58%, making it the single-biggest vertical for Shadowfax's
              express-parcel business. Tier-3 and below cities already represent 40.48% of the ecommerce logistics
              market — a structural fact that favours asset-light networks capable of low-cost rural coverage,
              Shadowfax's primary competitive positioning versus warehouse-heavy incumbents.

              Status-quo substitutes include (1) captive logistics operations built or acquired by platforms, (2) direct
              courier contracts without a technology orchestration layer, and (3) courier aggregators like Shiprocket
              that route shipments across multiple 3PL carriers for smaller D2C brands. None of these substitutes fully
              replicate Shadowfax's ability to serve both express parcel and hyperlocal quick-commerce delivery from a
              single last-mile partner network, which is a genuine adjacency advantage. Adjacent markets include
              cross-border ecommerce logistics (excluded from current scope; Mordor CEP market domestic deliveries at
              90.35% of market in 2025) and B2B distribution logistics (excluded; primarily served by freight-heavy
              operators).
