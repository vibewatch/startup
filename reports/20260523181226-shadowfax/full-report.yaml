      - number: '8.6'
        title: Recommendation and diligence asks
        blocks:
          - type: paragraph
            body: |
              The recommendation is MONITOR, not because Shadowfax lacks quality, but because the evidence-to-price
              ratio is no longer generous. The business now has enough public proof to justify institutional
              interest: large scale, improving profitability, analyst coverage, and a credible role in India's
              logistics stack. Yet the recommendation remains constrained by valuation support. Two of three
              initiated analysts sit below the market, the consensus target is slightly below spot, and the
              probability-weighted scenario range lands under the current share price. That is the definition of a
              stretched but not obviously broken situation. A more attractive entry zone is roughly ₹155–170,
              where downside from base-case underwriting is narrower and the market would no longer be charging so
              much for still-developing proof.

              Final diligence therefore matters more than another quarter of narrative. Investors still need
              service-line unit economics, explicit disclosure on Flipkart contract terms, clarity on ESOP and
              capitalised-tech adjustments, and better visibility into q-commerce dependence and lock-up overhang.
              The thesis should be treated as broken if adjusted EBITDA margin falls below 3% for two consecutive
              quarters, if any single customer moves above 40% of revenue, or if revenue growth slows far enough to
              force the market from a 25x to 15x valuation framework. Exit readiness for existing PE investors also
              points to block deals rather than a strategic sale, which means supply-side pressure could matter just
              as much as operating execution over the next 12–24 months. Until those open questions narrow, the
              right posture is active monitoring with strict downside triggers rather than aggressive buying.
