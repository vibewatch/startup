            title: Shadowfax holds structural advantages in India's fastest-growing logistics sub-segments
            body: >
              Shadowfax entered 2026 as India's second-largest ecommerce express delivery 3PL (23% market share per JM
              Financial) and market leader in both reverse pickup and 3PL quick-commerce delivery. These positions are
              in the two structurally highest-growth sub-segments: quick commerce (Mordor CAGR 12.74%; Bain estimates
              Q-com to contribute 45-50% of incremental eretail GMV to 2030) and D2C reverse logistics (demand driven by
              33% D2C GMV growth and high RTO rates). The company's multi-vertical positioning is rare: no other
              large-scale 3PL simultaneously leads in both express parcel and hyperlocal quick-commerce per disclosed
              data.
