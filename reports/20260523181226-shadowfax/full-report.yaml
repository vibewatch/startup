      - number: '7.4'
        title: People and Execution Risk
        blocks:
          - type: paragraph
            body: >
              Shadowfax executive team consists of four co-founders: Abhishek Bansal (CEO) Praharsh Chandra (COO) Gaurav
              Jawgi (CTO) and Vaibhav Khandelwal (CSO and Risk Management Committee Chair). The RHP identifies
              key-person dependency on each of these individuals with no disclosed succession plans. The company has not
              disclosed whether there are non-compete or lock-in provisions beyond the standard promoter lock-up from
              the IPO.

              Board stability is a concern: the average tenure of board members as of the IPO date was approximately 1.2
              years. Three of four independent directors joined within the 18 months preceding the IPO. Rapid board
              turnover in a compliance-heavy post-IPO environment introduces governance risk particularly under SEBI
              LODR independent-director norms.

              Workforce scaling risk is acute. Headcount nearly doubled from 11675 in FY25 to 21654 by September 2025
              per company disclosures. This growth outpaces established onboarding and training processes. The
              operations-staff ramp coincides with geographic expansion into tier-2/3 cities where Shadowfax has less
              institutional knowledge creating a compounded execution risk.

              Cultural and incentive alignment risk is heightened by the non-exclusivity of the gig partner base. SF
              Shield fraud-detection capability catches identity impersonation but does not address systematic
              underperformance or coordinated slowdown by delivery partners in the context of wage disputes.
