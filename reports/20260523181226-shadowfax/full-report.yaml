      - number: '5.3'
        title: AI systems, data intelligence, and cloud infrastructure
        blocks:
          - type: paragraph
            body: >
              Shadowfax's disclosed proprietary AI and infrastructure assets fall into three categories: address and
              location intelligence, security and fraud prevention, and cloud infrastructure. On address intelligence,
              the company launched SF Maps in July 2024 — an in-house artificial neural network using a Siamese-network
              architecture. Address text inputs are converted to embeddings stored in a VectorDB; H3 geospatial indexing
              is used for location fine-tuning. The model is trained on 1.5+ billion historical delivery and pickup data
              points. Post-launch, Shadowfax reports a 10% reduction in customer cancellations/RTOs and a 25%
              improvement in customer NPS. The CTO described this as a fundamental advance over what3words-style fixed
              codes because it accepts free-text Indian address input without customer adoption friction.

              On security and fraud, SF Shield (launched January 2025 per Economic Times coverage) combines two
              subsystems. The Track & Trace Solution performs over 20 million package scans per day using
              high-definition bullet cameras deployed at sort centres; the AI engine processes each scan to confirm the
              correct handler is scanning the correct package into the correct bin, triggering real-time misrouting and
              mishandling alerts. Over 4 million images and videos are captured daily at critical operational
              touchpoints. The second subsystem, SF Eye, targets identity fraud in the gig workforce. The AI
              selfie-validation pipeline was separately documented in a Shadowfax engineering blog: it evolved from a
              ResNet18 baseline (93% accuracy, failed on noisy real-world selfies) to FaceNet with 512-dimensional
              embeddings (96% precision), augmented with a dedicated liveness detection model to block printed-photo and
              screen spoofing.

              On cloud infrastructure, Shadowfax published a detailed engineering post on its AWS-to-GCP migration. The
              platform runs a microservices architecture connected through Kafka. During early GCP migration the team
              discovered that one NAT IP was insufficient for 260,000–280,000 concurrent ports needed; scaling to 8 NAT
              IPs resolved port exhaustion but required coordinating external partner whitelist updates. A TCP-timeout
              misconfiguration (reducing from 1,200 s to 30 s to free ports) caused a full-day outage before being
              reverted. Post-migration optimisations included Kafka schema registry cleanup, enabling Private Google
              Access to route Google API calls through Google's private backbone (bypassing NAT), and migrating
              inter-service communication to Internal Load Balancers. These changes reduced NAT port usage by 38% (from
              ~260,000 to ~160,000). The Android delivery partner app is also a material technical asset: the
              engineering team reduced median app start time from 3.5 seconds to 750 ms (90th percentile: 1.9 s) through
              lazy loading, baseline profiles, Constraint Layout optimisation, and asynchronous initialisation — a 40%
              gain serving more than 100,000 daily active users.
            claimRefs:
