  topStrengths:
    - >-
      Category-scale logistics network with audited profitability and dense national coverage across cities, PIN codes,
      and delivery-partner supply.
    - >-
      Asset-light operating model and software-led service stack give Shadowfax room to scale faster than heavier
      traditional logistics peers.
    - Public-market disclosures in 2025-2026 materially improved transparency relative to the private-company period.
    - >-
      Product adjacency in quick commerce, reverse logistics, and Shadowfax 360 increases merchant wallet-share
      potential beyond plain parcel delivery.
  topRisks:
    - >-
      Customer concentration remains a major public-market concern and could quickly pressure growth or pricing if a top
      account reallocates volume.
    - >-
      Margins are positive but still thin, so execution misses or cost shocks could compress earnings and valuation
      multiples.
    - >-
      Valuation already discounts much of the current growth case, with fair value analysis and most analyst targets
      sitting below the market price.
    - >-
      Key financial metrics still require reconciliation across audited statements, investor presentations, and
      third-party market-data surfaces.
  unresolvedGaps:
    - >-
      Post-IPO fully diluted ownership and selling-shareholder residual stakes are not fully reconciled from public
      sources.
    - >-
      Public data does not adequately disclose top-customer contract terms, tenure, or concentration by exact revenue
      share.
    - >-
      Revenue reconciliation between audited FY26 standalone figures and investor-presentation metrics remains
      incomplete.
    - Long-run margin durability under competitive and regulatory pressure is still unproven.
