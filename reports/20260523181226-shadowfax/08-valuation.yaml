chapter:
  number: 8
  title: "Valuation"
  summary: >
    Shadowfax enters public-market valuation with genuine operating proof but limited margin of safety.
    As of May 22, 2026 the stock trades at ₹201.28, roughly 78% above its January 2026 listing price,
    implying approximately ₹11,747–11,770 crore market capitalisation and ₹10,962 crore enterprise
    value. FY26 revenue of ₹4,202 crore, adjusted EBITDA of ₹159 crore, Ind-AS EBITDA of ₹212 crore,
    and net profit of ₹112 crore show that the company has crossed into profitability, but the current
    price still embeds a demanding 2.61x EV/revenue, 51.75x EV/Ind-AS EBITDA, and 92.33x trailing PE.
    Public evidence supports a serious logistics platform with scale, technology, and improving
    profitability, but not a clean bargain. Two of three initiated analysts publish targets below the
    market price, the comparable set points to limited multiple expansion from here, and the weighted
    bull/base/bear framework implies fair value closer to ₹180 per share. Recommendation: MONITOR.
    Risk rating: HIGH. Valuation stance: STRETCHED.
