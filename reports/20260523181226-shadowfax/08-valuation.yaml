      - ["Flipkart commercial terms", "Pricing protections, volume commitments, termination rights, and related-party or strategic commercial clauses.", "Flipkart concentration is the central downside variable in both base and bear cases.", "Review customer master agreement, amendment history, and revenue concentration dashboard."]
      - ["Adj. EBITDA quality", "Separate disclosure of FY26 ESOP cost and capitalised technology spend adjustments.", "True comparability versus Blue Dart, Delhivery, and analyst models depends on consistent EBITDA treatment.", "Reconcile management-adjusted EBITDA to Ind-AS accounts with auditor or controller support."]
      - ["Q-commerce disintermediation", "Revenue contribution and profitability by Blinkit, Swiggy Instamart, Zepto, and other rapid-delivery customers.", "The market is paying for growth partly driven by q-commerce; internal fleet build-outs could reduce external logistics demand.", "Obtain customer-level cohort trend and volume share movement by category."]
      - ["Exit and overhang readiness", "Detailed lock-up expiry schedule and expected PE investor sell-down path over 12–24 months.", "Supply-side pressure can cap upside even if operating performance stays solid.", "Review cap table, lock-up calendar, and likely secondary/block-deal route with bankers or IR."]
    notes: >
      These are the final diligence items most likely to change the recommendation. If management cannot supply
      them, the right posture remains MONITOR rather than BUY.
    claimRefs: [CV039, CV040, CV041, CV042, CV050]

