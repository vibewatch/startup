      - ["Customer concentration worsens", "Any single customer exceeds 40% of revenue", "Shows diversification is failing and increases sensitivity to pricing resets or allocation cuts from one account.", "Move from MONITOR to AVOID unless management supplies hard contractual protection."]
      - ["Growth re-rates to mature logistics", "FY28E revenue CAGR falls below 20%", "Lowers justified multiple from around 25x to something closer to 15x, compressing fair value sharply.", "Re-underwrite the stock on downside multiples; do not average down blindly."]
      - ["PE/lock-up supply overhang crystallises", "Major pre-IPO holders sell into July–October 2026 lock-up expiry windows", "Adds technical supply pressure to a valuation already lacking strong upside support.", "Avoid initiating positions immediately ahead of expiry windows without block-sale absorption evidence."]
