chapter:
  number: 2
  title: Market Analysis
  summary: >
    India's ecommerce logistics and last-mile delivery markets are large, fast-growing, and structurally favourable for tech-enabled 3PL operators.
    Mordor Intelligence estimates the India ecommerce logistics market at USD 7.25 billion in 2026, expanding to USD 11.14 billion by 2031 (CAGR 8.98%),
    while the broader CEP market is sized at USD 6.27 billion (2026) growing at 10.34% CAGR. Quick commerce reached USD 3.65 billion (Mordor) to
    USD 10-11 billion GMV (Bain) depending on definition, with the Bain-Flipkart joint report documenting 25% e-retail growth in Q1 CY2026.
    Redseer ranks Shadowfax as the second-largest 3PL with approximately 8 percentage-point market-share gain between July 2024 and July 2025,
    and JM Financial confirms ~23% express delivery market share in H1 FY26. Key structural drivers include ecommerce volume growth, D2C proliferation,
    quick-commerce expansion, and government logistics infrastructure; key constraints include client concentration, platform captive-arm investment,
    high RTO rates, and gig-worker regulatory risk.

sections:
  - id: market-boundary-and-scope
    title: Market boundary, included spend, and Shadowfax's addressable perimeter
    body: >
      Shadowfax operates at the intersection of multiple sub-markets within India's logistics ecosystem, and defining the boundary correctly
      is essential before sizing. The company's core addressable market is the outsourced, technology-mediated last-mile logistics spend
      generated by ecommerce platforms, quick-commerce operators, D2C brands, food-delivery networks, and on-demand hyperlocal services.
      Excluded from the addressable market are: in-house captive logistics arms (Ekart/Flipkart, Amazon Transportation Services), large-parcel
      and freight-forwarding segments dominated by Blue Dart, Gati, and traditional surface freight, and warehousing-only 3PL contracts that
      do not involve last-mile delivery. These exclusions are material: Ekart and ATS collectively serve hundreds of millions of parcels
      annually for their parent platforms and represent a structural ceiling on 3PL addressable volume for horizontal ecommerce.

      Within the addressable boundary, Mordor Intelligence segments India's ecommerce logistics market by service type, business model,
      delivery speed, product category, and city tier. Transportation captured 71.42% of market revenue in 2025, confirming that delivery
      itself — not warehousing or analytics — remains the dominant spend pool. B2C accounts for 62.58% of the market, with C2C at the
      fastest-growing 6.42% CAGR, driven by peer-to-peer marketplace growth on platforms like Meesho. Fashion and lifestyle holds the
      largest product-category share at 25.58%, making it the single-biggest vertical for Shadowfax's express-parcel business. Tier-3
      and below cities already represent 40.48% of the ecommerce logistics market — a structural fact that favours asset-light networks
      capable of low-cost rural coverage, Shadowfax's primary competitive positioning versus warehouse-heavy incumbents.

      Status-quo substitutes include (1) captive logistics operations built or acquired by platforms, (2) direct courier contracts without
      a technology orchestration layer, and (3) courier aggregators like Shiprocket that route shipments across multiple 3PL carriers for
      smaller D2C brands. None of these substitutes fully replicate Shadowfax's ability to serve both express parcel and hyperlocal
      quick-commerce delivery from a single last-mile partner network, which is a genuine adjacency advantage. Adjacent markets include
      cross-border ecommerce logistics (excluded from current scope; Mordor CEP market domestic deliveries at 90.35% of market in 2025)
      and B2B distribution logistics (excluded; primarily served by freight-heavy operators).
