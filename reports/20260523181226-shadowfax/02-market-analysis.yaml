  - id: TM003
    title: Segment and Buyer Map
    columns:
      - Segment
      - Primary Buyer / Payer
      - End User
      - Delivery SLA
      - Budget Owner
      - Adoption Trigger
    rows:
      - - Horizontal E-commerce (B2C)
        - Marketplace platform (Amazon, Flipkart, Meesho)
        - Online consumer placing marketplace order
        - Next-day / 2-day standard
        - Platform logistics head; volume-rate contracts
        - Platform launches or expands 3PL roster; cost-per-shipment bid
      - - Quick Commerce
        - Q-com operator (Blinkit, Zepto, Swiggy Instamart)
        - Urban consumer demanding <30-minute delivery
        - Sub-30 minutes (hyperlocal)
        - Q-com ops and supply chain team
        - Platform launches in new city / dark store; 3PL shortlisted for pilot
      - - D2C Brand Delivery (forward)
        - D2C brand (Nykaa, Boat, Mamaearth, Licious)
        - Brand's direct online customer
        - Same-day / next-day or standard
        - Brand COO / supply chain; tech-integration feasibility
        - Brand launches DTC website or migrates from aggregator-only model
      - - Reverse Logistics / Returns
        - Ecommerce platform or D2C brand
        - Returning consumer (return/exchange initiated)
        - 2–5 day pickup window
        - Same logistics budget owner as forward delivery
        - Client seeking RTO reduction or exchange-delivery capability
      - - Hyperlocal / On-Demand (food/grocery)
        - On-demand platform (Zomato, Swiggy, Magicpin)
        - Consumer ordering food / grocery on platform
        - <2 hr same-day
        - Platform ops team
        - Platform diversifies delivery partner beyond captive fleet
    notes: >
      Segment coverage is representative, not exhaustive; B2B and MSME courier segments excluded. Adoption triggers are based on
      JM Financial Shadowfax analyst note and general industry coverage; formal procurement timelines are not publicly disclosed.
      Budget ownership in large platforms (Amazon/Flipkart) sits within dedicated logistics/supply-chain functions, not general
      procurement, which affects vendor-switching friction.
