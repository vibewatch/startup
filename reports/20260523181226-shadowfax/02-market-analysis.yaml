  - id: market-sizing-tam-sam-som
    title: Market sizing — TAM, SAM, SOM, and multi-lens triangulation
    body: >
      No single market size figure adequately captures Shadowfax's addressable opportunity because the company operates across
      express parcel, hyperlocal quick-commerce, D2C direct delivery, and reverse logistics — each with distinct analyst-defined
      boundaries and growth rates. The appropriate sizing exercise uses multiple lenses triangulated against Shadowfax's disclosed
      service mix.

      At the broadest layer, the India 3PL and logistics market is estimated at approximately USD 47.6 billion in 2026 by MarkWide Research
      with an 11.4% CAGR through 2035. This includes non-ecommerce verticals (automotive, industrial, cold-chain), most of which
      Shadowfax does not currently address, and therefore overestimates the TAM for planning purposes.

      The most directly comparable market size estimates are Mordor Intelligence's India ecommerce logistics figure of USD 7.25 billion
      (2026), which grows to USD 11.14 billion by 2031 at an 8.98% CAGR, and the India domestic CEP market at USD 6.27 billion (2026)
      growing at 10.34% CAGR. The last-mile delivery market estimate from IMARC Group is USD 7.4 billion in 2025, forecast to reach
      USD 24.5 billion by 2034 at 13.54% CAGR — a wider definition that includes food-delivery last-mile and is partially overlapping
      with the Mordor figure. D2C logistics, sized by Mordor at USD 8.03 billion in 2026, also overlaps with the ecommerce figure but
      highlights the fast-growing direct-brand sub-segment where Shadowfax is actively expanding.

      Quick commerce — the segment Shadowfax leads on a 3PL basis — adds an incrementally-sized opportunity. Mordor Intelligence places
      India Q-commerce at USD 3.65 billion in 2026 (CAGR 12.74% through 2031). Bain & Company's 2026 India Shops Online report
      documents USD 10–11 billion quick-commerce GMV in FY25, with 16-17% of total eretail GMV. The wide range ($3.65B vs $10-11B)
      reflects different definitions: Mordor sizes the Q-commerce services market (logistics + platform ops), while Bain sizes total
      GMV transacted. The logistics-cost layer embedded in GMV is substantially smaller; at 8-10% logistics cost on GMV, the logistics
      portion of India's Q-commerce segment is roughly $0.8-1.0 billion.

      A bottom-up SAM estimate can be derived: India ecommerce logistics ($7.25B) plus a portion of quick-commerce logistics (~$0.9B
      estimated logistics spend) yields an addressable segment of approximately $8-9 billion. Against this SAM, Shadowfax's implied
      H1 FY26 revenue annualised (~₹4,200 crore ≈ ~$500M) suggests a market penetration of approximately 6-7% of the $7-8B SAM —
      consistent with JM Financial's 23% share in express only (a sub-segment of the broader SAM). A SOM of $1.5-1.7B can be inferred
      from the 23% share applied to the ecommerce logistics core. Contradictory estimates from 6W Research (19.2% CAGR) and MarkWide
      (11.4%) for adjacent market definitions reflect genuine methodological divergence and are preserved as diligence gaps.
