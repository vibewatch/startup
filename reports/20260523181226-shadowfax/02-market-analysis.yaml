tables:
  - id: TM001
    title: India Ecommerce Logistics Market Definition Table
    columns:
      - Segment / Category
      - Included Spend
      - Excluded Spend
      - Buyer / Payer
      - Relevance to Shadowfax
    rows:
      - - Express E-commerce Parcel
        - 3PL forward last-mile delivery fee; value-added services (VAS) such as doorstep QC, exchange, fraud check
        - In-house captive fleet ops (Ekart/ATS); warehousing-only contracts
        - Marketplace platform (Amazon, Flipkart, Meesho)
        - Core revenue line; ~23% market share in H1 FY26 per JM Financial
      - - Quick Commerce / Hyperlocal
        - Sub-30-minute 3PL last-mile delivery logistics fee; dark-store fulfilment support
        - Platform-owned dark-store operations and inventory cost; same-day grocery GMV
        - Q-com platforms (Blinkit, Zepto, Swiggy Instamart)
        - Growing segment; JM Financial confirms Shadowfax as market leader in 3PL Q-com
      - - D2C Brand Delivery
        - Express forward delivery and reverse pickup for direct-brand sales
        - Brand-operated captive warehouse dispatch; offline/retail distribution
        - D2C brands (Nykaa, Mamaearth, Boat, Purplle, Licious)
        - Expanding segment; Shadowfax client list includes multiple D2C names
      - - Reverse Logistics
        - Return-pickup fee; forward of return to origin or exchange dispatch
        - Brand-operated in-house returns desks; consumer-to-consumer C2C returns
        - Ecommerce platforms and D2C brands
        - Market leader by order volume in reverse pickup per JM Financial
      - - Value-Added Services (VAS)
        - Doorstep QC, hand-in-hand exchange, COD collection, partial-delivery fraud check
        - Basic scan-and-sign-only VAS; IT-platform SaaS standalone
        - Enterprise clients across all segments above
        - High-margin add-on; explicitly named in JM Financial as Shadowfax strength
    notes: >
      Segment boundaries are analyst-defined and overlap: a single Shadowfax shipment for a D2C brand may be counted in both the
      ecommerce logistics and D2C logistics totals depending on the methodology used by Mordor Intelligence or IMARC. Excluded spend
      categories represent genuine ceiling risk: Ekart and ATS captive volumes are not available to 3PL providers regardless of
      competitive quality. VAS revenue is not separately disclosed in Shadowfax's public financials.
