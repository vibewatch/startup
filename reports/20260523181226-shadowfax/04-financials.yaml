  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: lease-obligation-detail
      missingEvidence: >
        Full lease schedule with per-facility tenure, renewal options, break clauses, and annual rent-step-up rates.
        The RHP discloses total right-of-use asset and lease liability balances but does not publish a granular lease-by-lease
        schedule or weighted average remaining term.
      whyItMatters: >
        With 100% leased facilities, the lease-obligation tenor and break-clause structure determines refinancing risk and
        flexibility to close underperforming facilities; opaque lease terms prevent accurate free-cash-flow modelling.
      diligencePath: >
        Request the full Ind-AS 116 lease schedule, including facility-level start/end dates, break clauses, and rent escalation
        terms, from management or review footnotes to audited statutory accounts.
      relatedQuestionRefs:
        - QI027
    - type: private-evidence-only
      severity: high
      topic: concentration-downside-scenario
      missingEvidence: >
        A scenario analysis showing the margin and cash impact of a 20-25% reduction in volume from the top client, which
        contributed approximately 49% of H1 FY26 operating revenue. No public disclosure contains this stress test.
      whyItMatters: >
        The top client accounts for a near-majority of revenue; without a documented downside scenario, investors cannot
        quantify the floor on profitability if the relationship reprices or volumes shift to in-house logistics.
      diligencePath: >
        Model a 20% and 25% volume-reduction scenario using disclosed segment cost split (52% partner costs, 19% transport)
        and compare against the fixed-cost base (employee, lease) to determine the EBITDA/PAT floor.
      relatedQuestionRefs:
        - QI029
