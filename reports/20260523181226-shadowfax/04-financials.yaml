  - id: TI005
    title: Public Financial Gaps Table — Shadowfax
    columns:
      - Missing metric
      - Why it matters for underwriting
      - Impact if not obtained
      - Exact diligence path
    rows:
      - - Per-segment gross margin (express vs hyperlocal vs other)
        - The three segments have materially different cost structures and growth trajectories; blended margin may mask margin-dilutive mix shift
        - Cannot assess whether margin improvement is sustainable or driven by temporary mix shift
        - Request management accounts or investor-day disclosure with segment contribution margin; cross-check with peer (Delhivery) segment-level disclosure approach
      - - Per-shipment realised pricing (by client tier and service type)
        - All pricing is SLA-based and private; only blended implied revenue per shipment is derivable from public accounts
        - Cannot model revenue impact of repricing risk if large client demands lower tariffs
        - Request sample SLA terms (redacted) or pricing-floor disclosure in investor day; compare with Delhivery disclosed tariff range
      - - Client-level revenue and margin (top 3 clients)
        - Top client ~49% of H1 FY26 revenue; any volume/pricing change from Meesho or Flipkart is outsized
        - Cannot stress-test concentration risk or model P&L impact of client renegotiation
        - Request management's own client-concentration stress scenario; review SLA renewal dates and pricing reset clauses
      - - Lost shipments cost breakdown (underwriting premium vs actual losses)
        - 6.1% of Q4 FY26 revenue is unusually high; the line blends a product-revenue item (reverse QC insurance) with operational losses
        - Risk of misinterpreting quality-check premium as operational inefficiency or vice versa; distorts margin quality
        - Request management account split of (a) product premium revenue and (b) net actual shipment loss from the quality-check line
      - - Ind AS 116 right-of-use asset and lease liability schedule
        - All facilities are leased; lease liabilities are a material contingent obligation and affect leverage and cash-flow duration
        - Cannot fully assess capital adequacy without quantifying total lease payment obligations and weighted-average duration
        - Request FY26 audited Ind AS 116 note from annual report; analyse remaining lease commitments vs cash position
      - - CAC, contract renewal rates, and churn metrics
        - While individual consumer CAC is not meaningful, contract renewal and re-pricing frequency with enterprise clients determines revenue durability
        - Cannot assess revenue retention quality or likelihood of volume erosion from top clients
        - Request disclosed contract renewal terms, SLA re-pricing frequency, and any historical volume-loss events from management
      - - FY26 audited working capital cycle
        - Receivables duration from large ecommerce clients determines how much capital is tied up in the business
        - Cannot assess cash conversion cycle or working capital financing need without receivables and payables days
        - Request debtor days and creditor days from audited FY26 balance sheet and cash flow notes
    claimRefs:
      - CI022
      - CI027
      - CI037
      - CI038
    notes: >
      These gaps are assessed relative to what would be required for a financial underwriting exercise. Some gaps may be resolved
      in the FY26 Annual Report when published. Client-level economics gaps are inherent to listed-company disclosures and would
      require a private-markets data-sharing framework or management meeting to partially bridge.

figures:
  - id: FI001
    title: Shadowfax Revenue Model Bridge — Customer Activity to Gross Revenue
    type: flow
    layout: standard
    summary: >
      How customer order activity converts into revenue streams through Shadowfax's per-shipment fee model,
      with VAS and emerging segments layered on top of core express and hyperlocal volumes.
    data:
      nodes:
        - id: client-demand
          label: 'Client demand: ecommerce, quick commerce, D2C brands, ONDC'
        - id: order-intake
          label: 'Order intake: API integration; per-shipment fee triggered on accepted shipment'
        - id: express-stream
          label: 'Express parcel delivery fee: ~69% of revenue (H1 FY26); weight-distance-speed dynamic tariff'
        - id: hyperlocal-stream
          label: 'Hyperlocal / quick-commerce delivery fee: ~20% of revenue (H1 FY26); per-order, proximity-based'
        - id: other-stream
          label: 'Other logistics: critical logistics, insourcing, dark stores: ~11% of revenue (H1 FY26)'
        - id: vas-layer
          label: 'VAS overlay: reverse pickup, open-box, same-day premium; 40% of express revenue (RHP); higher margin'
        - id: gross-revenue
          label: 'Gross revenue from operations: FY26 ₹4,202 crore consolidated (+69.1% YoY)'
        - id: partner-cost
          label: 'Less: delivery-partner payments: ~52% of revenue; largest single cost item'
        - id: transport-cost
          label: 'Less: transportation charges: ~19% of revenue; linehaul and mid-mile'
        - id: other-cost
          label: 'Less: employee costs, lost shipments, other overheads: ~24% of revenue'
        - id: adj-ebitda
          label: 'Adjusted EBITDA: ₹159 crore FY26 (3.8% margin); Ind-AS EBITDA ₹212 crore (5.0%)'
      edges:
        - from: client-demand
          to: order-intake
          label: Per-shipment event triggers revenue recognition
        - from: order-intake
          to: express-stream
          label: B2C ecommerce and D2C orders routed here
        - from: order-intake
          to: hyperlocal-stream
          label: Quick commerce and on-demand orders routed here
        - from: order-intake
          to: other-stream
          label: Critical and insourcing orders routed here
        - from: express-stream
          to: vas-layer
          label: Reverse, open-box, and premium tiers add revenue premium
        - from: express-stream
          to: gross-revenue
          label: Core express fee
        - from: hyperlocal-stream
          to: gross-revenue
          label: Hyperlocal per-order fee
        - from: other-stream
          to: gross-revenue
          label: Critical logistics and management fees
        - from: vas-layer
          to: gross-revenue
          label: VAS revenue premium layered on express
        - from: gross-revenue
          to: partner-cost
          label: Largest variable cost deducted
        - from: gross-revenue
          to: transport-cost
          label: Linehaul deducted
        - from: gross-revenue
          to: other-cost
          label: Fixed and semi-fixed costs deducted
        - from: gross-revenue
          to: adj-ebitda
          label: Operating profit after costs
    approximationNotes: >
      Revenue share percentages (69% express, 20% hyperlocal, 11% other) are H1 FY26 DRHP-sourced. VAS at 40% of express is
      DRHP-disclosed but not separately revenue-accounted. Cost percentages are Q4 FY26 actuals from Multibagg analysis of
      company disclosures. Adj EBITDA figure is FY26 full-year from Scanx citing board outcome.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI007
      - CI008
      - CI013
      - CI014
      - CI018

  - id: FI002
    title: Shadowfax Unit Economics Bridge — Revenue to Adjusted EBITDA per Shipment (Q4 FY26)
    type: flow
    layout: standard
    summary: >
      Derivation of per-shipment unit economics from Q4 FY26 consolidated revenue and order volume figures.
      All values are estimates derived from public disclosures; not independently audited per-unit figures.
    data:
      nodes:
        - id: revenue-per-shipment
          label: 'Revenue per shipment: ~₹54.7 (derived: ₹1,237 crore / 22.6 crore orders, Q4 FY26)'
        - id: partner-expense
          label: 'Less partner expense: ~₹28.6/shipment (52.2% of revenue); gig delivery-partner payout'
        - id: transport-charge
          label: 'Less transport charge: ~₹10.2/shipment (18.7% of revenue); linehaul and intercity trucking'
        - id: employee-expense
          label: 'Less employee cost: ~₹4.9/shipment (8.9% of revenue); warehouse, ops, tech headcount'
        - id: lost-shipments
          label: 'Less lost shipments / QC cost: ~₹3.3/shipment (6.1% of revenue); includes QC product premium'
        - id: other-overhead
          label: 'Less other overhead: ~₹5.2/shipment (remaining ~9.5% of total cost); rent, tech, marketing'
        - id: adj-ebitda-per-shipment
          label: 'Adjusted EBITDA per shipment: ~₹2.57 (derived: ₹58 crore / 22.6 crore orders, Q4 FY26, 4.7% margin)'
        - id: pat-per-shipment
          label: 'PAT per shipment: ~₹2.48 (derived: ₹56 crore / 22.6 crore orders, Q4 FY26, 4.5% margin)'
      edges:
        - from: revenue-per-shipment
          to: partner-expense
          label: Gig payout is largest variable cost; 52% of revenue
        - from: revenue-per-shipment
          to: transport-charge
          label: Second-largest variable; linehaul and mid-mile
        - from: revenue-per-shipment
          to: employee-expense
          label: Semi-fixed; grew 40% YoY in H1 FY26
        - from: revenue-per-shipment
          to: lost-shipments
          label: Contains product-underwriting premium; diligence required
        - from: revenue-per-shipment
          to: other-overhead
          label: Rent, tech, marketing, and miscellaneous
        - from: revenue-per-shipment
          to: adj-ebitda-per-shipment
          label: Residual after all cost deductions (adj EBITDA basis)
        - from: adj-ebitda-per-shipment
          to: pat-per-shipment
          label: After finance costs, tax, and depreciation
    approximationNotes: >
      All per-shipment figures are derived by dividing Q4 FY26 line-item expenses (from Multibagg analysis of company disclosures)
      by 22.6 crore total orders (Multibagg, BSQ4). Express and hyperlocal are blended; actual express per-shipment economics
      are higher and hyperlocal are lower than these blended figures. The lost-shipments / QC cost line blends a product-
      underwriting revenue item with operational losses per Q4 concall management commentary.
    claimRefs:
      - CI013
