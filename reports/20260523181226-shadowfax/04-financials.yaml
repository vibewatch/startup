  - id: cost-structure-and-margin-evolution
    title: Cost structure, gross margin drivers, and profitability trajectory
    body: >
      Shadowfax's cost base is dominated by variable delivery-partner and transportation payments, a structure consistent with its
      asset-light, gig-mediated operating model. In Q4 FY26, partner expenses were 52.2% of consolidated revenue, transportation
      charges were 18.7%, employee benefit expenses were 8.9%, and the "lost shipments and quality check cost" line was 6.1%.
      Total expenses were 95.3% of revenue, implying a 4.7% adjusted EBITDA margin for the quarter. In H1 FY26, the equivalent
      figures from DRHP show delivery personnel costs at 53% of total expenses (₹956 crore, +69% YoY), transportation at 18%
      (₹325.2 crore, +52.8% YoY), and employee benefits at ₹171.8 crore (+40% YoY). The lost/damaged shipments line was
      ₹148.2 crore in H1 FY26, more than 3x the prior year — the Q4 concall CFO noted this includes both a reverse doorstep
      quality-check product premium and actual losses. The company does not separately disclose a gross margin line; the first
      profit-disclosure line below revenue is EBITDA excluding other income.

      The profitability trajectory is the strongest evidence of operating leverage. Adjusted EBITDA was negative ₹113.47 crore in
      FY23, improved to ₹11.37 crore in FY24 (0.6% margin), ₹56.19 crore in FY25 (2.0% margin), ₹64.34 crore in H1 FY26
      (3.56% margin), ₹49 crore in Q3 FY26 (4.3% margin), and ₹58 crore in Q4 FY26 (4.7% margin). FY26 full-year adjusted EBITDA
      was ₹159 crore (3.8% margin, +227% YoY). Ind-AS EBITDA — which adds back lease accounting adjustments — was ₹212 crore
      in FY26 (5.0% margin, +277% YoY). Net profit after tax progressed from -₹142.64 crore (FY23) to -₹11.88 crore (FY24) to
      ₹6.06 crore (FY25) to ₹112 crore consolidated / ₹115.18 crore standalone (FY26). The audited standalone results were filed
      with exchanges on May 14, 2026 following the Board of Directors meeting. FY26 basic EPS on standalone basis was ₹2.29.

      Two structural margin caveats apply. First, the company itself states in the DRHP that it does not track margins at the
      service-line level, so it is not possible to confirm which segment or client concentration is most margin-accretive or
      margin-dilutive. Second, the lost-shipments line at 6.1% of Q4 FY26 revenue is unusually high relative to simple logistics
      peers and is subject to management discretion in categorisation (product-underwriting premium vs actual losses). Management
      guided for adjusted EBITDA margin improvement of approximately 100-120 basis points per year to FY28, after which it aspires
      to 200-250 basis points improvement annually toward a "double-digit steady-state EBITDA" target.
