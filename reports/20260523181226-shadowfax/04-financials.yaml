  - id: unit-economics
    title: Unit economics and per-shipment metrics
    body: >
      Because Shadowfax does not publicly disclose per-shipment pricing, all per-unit economics must be derived from public financial
      statements divided by publicly disclosed order volumes. These are estimates, not independently corroborated figures. In Q4 FY26,
      ₹1,237 crore consolidated revenue was delivered across 22.6 crore orders, implying approximately ₹54.7 revenue per shipment.
      Applied to the ₹58 crore adjusted EBITDA for the quarter, adjusted EBITDA per shipment was approximately ₹2.57. For FY26
      full year, ₹4,202 crore revenue over 72.6 crore orders implies approximately ₹57.9 revenue per shipment. These estimates
      combine express and hyperlocal in a single blended number; express parcels have longer distance and higher weight, implying
      higher per-unit revenue, while hyperlocal is high-frequency, low-weight, and proximity-driven. The blended revenue per
      shipment has declined slightly quarter on quarter as hyperlocal — a structurally lower-revenue-per-order service — grows
      faster.

      Derived cost allocation at the Q4 FY26 level: partner expenses at 52.2% of revenue imply approximately ₹28.6 per shipment;
      transportation at 18.7% implies approximately ₹10.2 per shipment; employee costs at 8.9% imply approximately ₹4.9 per
      shipment; and lost shipment/quality check costs at 6.1% imply approximately ₹3.3 per shipment. These four items sum to
      approximately ₹47 per shipment, leaving about ₹7.7 per shipment for adjusted EBITDA and other overhead. The company has not
      disclosed CAC or LTV, which are not meaningful constructs for a B2B per-shipment model where clients are contracted platforms
      with SLA-based relationships rather than individual acquired consumers.

      For the newer revenue bets, management disclosed dark-store gross margins of 20%+ at top stores, with monthly revenue per
      store ranging from ₹8 to ₹15 lakh and a three-to-four month payback period. CriticaLog is cited at ₹130 crore ARR based on
      Q4 FY26 volumes. Prime Large (heavy and volumetric shipments) is at ₹60 crore ARR. These emerging segments remain small
      relative to core express volume but represent a path to higher-margin revenue mix.
