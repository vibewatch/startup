callouts:
  - calloutType: strength
    title: Post-IPO balance sheet is robust and business is now operating-cash-flow positive
    body: >
      The combination of negligible debt (~₹0.28 crore), approximately ₹1,120 crore in cash, and ₹350 crore FY26 operating
      cash flow means Shadowfax can fund its FY27 capex program of ₹180-190 crore entirely from operations without capital
      markets access. The IPO fresh-issue proceeds provide additional runway for inorganic moves. This is a materially different
      financial posture from the venture-funded loss-making state of FY23.
    claimRefs:
      - CI029
      - CI031
      - CI032
      - CI033
  - calloutType: risk
    title: Client concentration is the dominant financial risk and was explicitly flagged by public-market investors
    body: >
      The single largest client (believed to be Meesho per DRHP disclosure) contributed approximately 49% of H1 FY26 revenue,
      and the top five clients together contributed 74.6% of FY25 revenue. No long-term contracts provide volume floor
      protection; all SLAs can be terminated or re-tendered. Financial Express and TechCrunch both noted concentration risk
      as the primary factor in the 9% below-issue-price listing. A 20% volume reduction from the largest client would eliminate
      roughly one-tenth of revenue — equivalent to approximately ₹420 crore on FY26 annualised run-rate — threatening to reverse
      most or all of the FY26 profitability gain.
    claimRefs:
      - CI011
      - CI012
      - CI037
      - CI038

