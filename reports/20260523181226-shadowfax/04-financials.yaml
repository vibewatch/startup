  - id: financial-verdict-and-gaps
    title: Financial verdict, private metric gaps, and diligence blockers
    body: >
      Shadowfax's financial profile as of May 2026 is that of a post-inflection 3PL that has demonstrated operating leverage at
      scale, achieved audited profitability, and now carries a near-debt-free balance sheet with over ₹1,000 crore in cash. The
      69.1% revenue growth in FY26 and the 3.8% adjusted EBITDA margin represent a genuine step-change from the 2% margins in
      FY25 and the long loss-making period in FY23-FY24. The operating cash flow of ₹350 crore shows the business can sustain
      its current capex program without external funding.

      The central financial risk is revenue concentration. Market coverage at IPO listing was explicitly adverse on this: Financial
      Express noted at the January 29, 2026 listing that the largest client accounted for approximately 49% of H1 FY26 revenue
      and that profitability remains thin. TechCrunch noted the stock fell approximately 9% from issue price as investors weighed
      concentration against a thin margin profile. The net profit margin in FY25 was 0.3%, and FY26's 2.7% consolidated net margin,
      while materially improved, remains thin relative to logistics platforms in more mature markets. If any single large client
      renegotiates pricing downward, moves logistics in-house, or reduces volume share, the EBITDA impact would be highly material
      given partner-cost structure is largely variable and not easily offset.

      Three additional financial diligence blockers are identified here. First, the DRHP explicitly acknowledges that the company
      does not track margins at the service-line level, making it impossible from public disclosures alone to assess which segment
      — express, hyperlocal, or VAS — is the margin engine or the drag. Second, per-shipment pricing is SLA-based and not publicly
      disclosed; realised revenue per shipment is a derived estimate, not a verified figure. Third, the lost-shipments and quality-
      check cost line at 6.1% of revenue in Q4 FY26 requires a diligence review to separate product-premium underwriting from
      actual operational losses. Management commentary on this line is available in Q4 concall transcripts but the accounting
      treatment warrants independent scrutiny.
