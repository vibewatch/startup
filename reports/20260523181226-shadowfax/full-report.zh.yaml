      - number: '7.5'
        title: 缓释措施与论点破裂触发器
        blocks:
          - type: paragraph
            body: >
              Shadowfax 已落地一组运营和治理缓释措施。SF Shield 在 20 million 次每日扫描中提供实时生物识别身份验证和欺诈模式检测，自 FY24 推出后大幅降低了身份冒用型欺诈。由 Vaibhav
              Khandelwal 主持的 Risk Management Committee 按季度开会，并按治理页面披露审查所有重大风险。IPO 后 INR 1120 crore 现金头寸，按当前 run-rate
              约可覆盖 8 个月经营 burn。业务组合向 CriticaLog（关键和高价值货物）、Prime Large（大件包裹）以及 Shadowfax 360 SaaS 平台延伸，部分降低了业务量集中风险。

              尽管有这些缓释措施，以下可观察触发器会构成论点破裂条件，需要立即重新审查投资：(1) 单一最大客户收入量流失超过 20%，且连续两个季度没有替代；(2) 正式 DPDP 执法行动，或 NCLT / High
              Court 裁定将 gig partners 认定为雇员；(3) 合并 EBITDA 利润率连续两个季度低于 2%；(4) 影响 rider partners
              或客户生物识别数据的重大数据泄露，并导致监管处罚；(5) 四名联合创始人中任意三人在 12 个月窗口内离职。
