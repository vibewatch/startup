          label: 减员工成本：~₹4.9/shipment（占收入 8.9%）；仓库、运营、技术人员
        - id: lost-shipments
          label: 减丢失货件 / QC 成本：~₹3.3/shipment（占收入 6.1%）；包含 QC 产品溢价
        - id: other-overhead
          label: 减其他间接费用：~₹5.2/shipment（剩余 ~9.5% 总成本）；租金、技术、营销
        - id: adj-ebitda-per-shipment
          label: 每票 Adjusted EBITDA：~₹2.57（推导：₹58 crore / 22.6 crore 订单，Q4 FY26，4.7% 利润率）
        - id: pat-per-shipment
          label: 每票 PAT：~₹2.48（推导：₹56 crore / 22.6 crore 订单，Q4 FY26，4.5% 利润率）
      edges:
        - from: revenue-per-shipment
          to: partner-expense
          label: 零工支出是最大可变成本；占收入 52%
        - from: revenue-per-shipment
          to: transport-charge
          label: 第二大可变项；干线和中段运输
        - from: revenue-per-shipment
          to: employee-expense
          label: 半固定；H1 FY26 YoY 增长 40%
        - from: revenue-per-shipment
          to: lost-shipments
          label: 包含产品承保溢价；需要尽调
        - from: revenue-per-shipment
          to: other-overhead
          label: 租金、技术、营销和杂项
        - from: revenue-per-shipment
          to: adj-ebitda-per-shipment
          label: 所有成本扣除后的剩余（adj EBITDA 口径）
        - from: adj-ebitda-per-shipment
          to: pat-per-shipment
          label: 扣除财务成本、税和折旧后
    approximationNotes: >
      所有每票数据均由 Q4 FY26 单项费用（来自 Multibagg 对公司披露的分析）除以 22.6 crore 总订单（Multibagg，BSQ4）推导。快递 和超本地为混合口径；实际快递每票经济性高于该混合值，超本地
      低于该混合值。丢失货件 / QC 成本行按 Q4 业绩电话会管理层评论，将一项产品承保收入项与运营损失混合。
