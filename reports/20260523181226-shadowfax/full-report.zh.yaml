      - number: '3.3'
        title: 定价、打包与分销动态
        blocks:
          - type: paragraph
            body: >
              印度快递物流市场的单票费率对比显示，Shadowfax 结构上低于 Delhivery，同时在可比线路上匹配或低于 XpressBees。 0.5kg 本地运单中，Shadowfax 的指示区间为
              ₹46–70，低于 Delhivery 的 ₹59–80 和 XpressBees 的 ₹49–85。全国 1kg 运单中，Shadowfax 为 ₹90–130，Delhivery 为
              ₹120–150。Blue Dart 在所有区域都有溢价—— 约比 3PL 快递费率高 30–50%——反映其限时保证和企业合同模式。所有服务商的 COD 收款每单增加 ₹20–50 或订单价值的
              1–2%，RTO 费用通常等同单程费率，形成一种成本不对称，尤其压迫高 RTO 率商户。DTDC 拥有 14,000+ 个 franchise partners 和约 ~12M 月运单，采用面向大众快递市场的
              franchisee-led pricing model，费率大体接近 XpressBees， 但与 ecommerce API 连接的技术集成较弱。定价动态正在变化。July 2025
              行业报告称，印度主要物流承运商宣布 2026 年提价 8–12%，部分由燃油成本上升和 Delhivery 收购后的利润率修复驱动。Delhivery 在 Ecom Express 交易后明确表示，
              它正在「放弃折扣以提升利润率」——这是一个市场信号，说明 2022–2024 年激进的件量补贴定价正在结束。 这给 Shadowfax 带来双重机会和风险：更高行业费率保护 Shadowfax 自身利润率，但
              Delhivery 的规模允许它在新的更高基数上维持竞争性定价， 而较小玩家承受利润率压力。分销和 GTM 策略差异很大。Delhivery 面向大型平台做企业客户管理，并通过 API 直接接入
              marketplace OMS。Shiprocket 通过其聚合层，把较小 D2C 商户在包括 Shadowfax 的多个承运商之间路由。Blue Dart 使用直接企业销售和 DHL 全球客户关系。Porter
              采用 digital-first SME 获客模式。Shadowfax 正走混合路径：与主要 Q-com 和平台客户建立直接企业关系 （JM Financial 称前五大客户占 H1 FY26 收入
              74.1%），并通过 Shadowfax 360 产品发布（April 2026）扩大 D2C mid-market 分销。
