      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: Shadowfax 在印度增长最快的物流子分部具备结构性优势
            body: >
              进入 2026 年时，Shadowfax 是印度第二大 ecommerce express delivery 3PL（JM Financial 称市场份额 23%）， 也是 reverse pickup 和
              3PL quick-commerce delivery 的市场领导者。这些位置落在两个结构性增长最高的子分部： quick commerce（Mordor CAGR 12.74%；Bain 估算 Q-com 到
              2030 年将贡献新增 eretail GMV 的 45-50%） 和 D2C 逆向物流（需求由 33% D2C GMV 增长和高 RTO 率驱动）。公司的多垂直定位很少见：披露数据中，没有其他大型 3PL
              同时在快递包裹和本地即时 quick-commerce 领先。
            calloutType: strength
            claimRefs:
              - CM019
              - CM020
              - CM021
              - CM024
              - CM043
          - type: callout
            title: 平台自建物流和客户集中度是结构性市场约束
            body: >
              尽管市场增长强劲，Shadowfax 面对两项限制可触达份额扩张的市场结构性约束。第一，Delhivery 收购 Ecom Express（2025） 以及 Ekart/ATS 的持续投资，压缩了横向
              ecommerce 中 3PL 可触达池。第二，Shadowfax 自身披露（经 JM Financial）确认，头部客户贡献 48.9%，前五大客户贡献 H1 FY26 收入的
              74.1%——这意味着市场需求侧增长的一部分， 被少数平台客户捕获；随着这些平台自己的物流基础设施成熟，其议价权会提高。任何一个前五大客户重新议价费率，都会实质影响单位经济。
            calloutType: risk
