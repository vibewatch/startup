companyProfile:
  summary: >
    Shadowfax 是一家 2015 年成立的印度物流平台，最初做食品配送和快递网络，后来扩展为规模化的快递、 即时、本地、逆向物流和履约运营商。到 2026 年，公司已转为上市发行人，具备经审计盈利能力，覆盖 2,500+
    个城市和 15,100+ 个 PIN codes，并拥有大型配送合作伙伴网络。核心论点是：Shadowfax 以轻资产、 软件调度的最后一公里网络服务电商、quick commerce、D2C 和商户物流场景，同时叠加
    Shadowfax 360 与反欺诈工具等软件和控制层。
