  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、收入流与分部结构
        blocks:
          - type: paragraph
            body: >
              Shadowfax 的主要收入机制，是向企业客户按完成的物流交易收取每单费用。RHP 和公开披露确认三类收入分部：express forward parcel（最大）；覆盖 quick
              commerce、食品和按需配送的 hyperlocal services；以及其他物流服务，包括 critical logistics、 strategic insourcing 和 dark-store
              operations。公司不发布价目表。根据 RHP 和 Finmint business-model analysis， 费率按企业 SLA
              确定，并在四个维度上动态变化——配送距离、服务速度（same-day、next-day、hyperlocal）、包裹重量、 以及额外处理要求（open-box verification、reverse
              pickup、exchange）。这意味着公开定价无法用于尽调；只有经审计账户中的实际收入数字具有来源可靠性。

              H1 FY26，express forward parcel 贡献 ₹1,238.7 crore，约占运营收入 69%，较 H1 FY25 的 ₹787.2 crore 同比增长 57.3%。Hyperlocal
              产生 ₹359.3 crore，约占运营收入 20%，较 ₹196.8 crore 同比增长 82.5%。其他物流服务贡献 ₹207.5 crore，约占运营收入 11%，较 ₹88 crore 同比增长
              136%。Q4 FY26 结构类似：express ₹925 crore（+120.8% YoY）、hyperlocal ₹232 crore（+32.1% YoY）、 其他物流 ₹80 crore——最后一类按
              Q4 concall 被管理层有意收缩，重新定位到更高价值的 critical logistics。公司自有 prospectus 披露称，增值服务约贡献 express 收入
              40%，这是目前最清晰的、与利润率相关的分部表述；但由于公司明确不按服务线跟踪或披露利润率， VAS 带来的 EBITDA 受益无法单独量化。FY26 全年收入为 ₹4,202 crore
              consolidated（经审计单体为 ₹4,080.35 crore），体现复合增长：FY23 为 ₹1,415 crore，FY24 为 ₹1,884.8 crore，FY25 为 ₹2,485 crore。

              关于收入质量，有一个结构性重要事实：客户集中度极高。根据 RHP，头部客户约贡献 H1 FY26 收入的 49%；前五大客户贡献 FY25 收入 74.6%、FY24 收入 84.96%。Flipkart
              group entities（Instakart Services 和 Flipkart Internet）在 FY25 分别贡献 ₹2,668.57 crore 和 ₹183.55
              crore，是主导性收入锚点。公司没有长期合同； 所有关系均由可终止或重新招标的 SLA 管理。RHP 明确称，「失去任何主要客户都可能产生重大不利影响」。新兴多元化故事——通过 Shadowfax
              360、CriticaLog（₹130 crore ARR）、Prime Large heavy shipments（₹60 crore ARR）以及通过 dark stores 做 vertical quick
              commerce 来推进 D2C 和 SME——方向上成立， 但尚不足以实质改变集中度比例。
