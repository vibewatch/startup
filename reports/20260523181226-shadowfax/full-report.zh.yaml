  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台服务组合与产品模块图谱
        blocks:
          - type: paragraph
            body: >
              Shadowfax 公开将自己描述为印度物流平台，向客户提供六条清晰产品线；客户可通过统一 API 接入，自 April 2026 起也可通过 Shadowfax 360
              自助门户接入。核心服务线包括：（1）Express parcel——B2C 和 D2C 正向货件，提供 next-day 和 same-day SLA；按 DRHP，该分部约占 H1 FY26 operating
              revenue 的 69%，为最大分部；（2）Hyperlocal / quick commerce——面向 Flipkart、Zepto、Zomato、Swiggy、BigBasket 和 Nykaa
              等食品、生鲜杂货、药品客户的两小时内按需配送，贡献约 H1 FY26 收入的 20%；（3）Reverse logistics——上门和 hub-based 取件，带 API
              驱动质检（open-box、hand-in-hand exchange），公司称按 reverse-pickup 订单量领先；（4）Critical logistics（CriticaLog）——2025
              年收购为全资子公司，专攻医疗、汽车、奢侈品和 IT 中高价值、时效敏感、white-glove B2B 货件，截至 Q4 FY26 ARR 为 ₹130 crore；（5）Prime
              Large——高端重货层级，覆盖大体积和超大件；截至 Q4 FY26 已上线约 6,000 pin codes，ARR 为 ₹60 crore；（6）Dark store operations——由
              Shadowfax 管理、服务 quick-commerce 客户的履约节点；管理层称头部站点单仓月收入 ₹8–15 lakh，gross margin 超过 20%。Shadowfax 360 于 April
              21, 2026 通过 SEBI 交易所披露发布，是面向 SMEs 和 D2C 品牌的自助发货门户；它在同一企业级网络之上叠加透明 flat-rate 计费、无最低订单承诺、AI 驱动 RTO 预测，以及一键
              Shopify 和 WooCommerce 集成。shadowfax.in 的 innovation 页面列出支撑全部服务线的核心技术能力：需求预测、路线优化、API live
              tracking、reverse-logistics 质检和 zone geo-tracking。截至 May 2026 披露的网络覆盖为：15,000+ PIN codes、2,500+ 城市、259,609
              名平均季度交易配送伙伴、53+ 个租赁分拣中心、4,299+ 个运营触点，以及 3.5 million+ sq ft 租赁空间。
