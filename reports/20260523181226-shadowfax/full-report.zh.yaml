      - number: '5.2'
        title: 配送管理与运营工作流
        blocks:
          - type: paragraph
            body: >
              Shadowfax 的履约工作流是一个由 API 调度、资产轻的闭环。企业客户或 Shadowfax 360 商户通过 REST API 或 360 门户提交发货请求；order management
              system（OMS）校验 PIN-code 可服务性并分配取件时段。配送伙伴通过 Android Super App 接收任务；App 展示由 SF Maps 驱动的路线优化导航。SF Maps 用基于
              1.5+ billion 历史配送训练出的深度学习地址模型，把非结构化印度地址输入解析成距离目的地 100 metres 内的 lat/long。对于 express
              parcels，货件先进入分拣中心；AI-powered cameras（SF Shield Track &
              Trace）扫描包裹条码，并用人脸识别对照白名单校验操作员身份；错分警报实时触发。包裹通过干线运输至目的地分拣中心（Shadowfax
              作为资产轻模型使用第三方干线），再次入库后派发至末端配送。配送伙伴在平台上活跃时，GPS 位置每五秒采集一次。到达门口时，伙伴必须用每日自拍完成身份认证；AI 自拍校验系统用 FaceNet 512-D
              embeddings 和活体模型，将实时拍摄与入驻照片匹配，以阻断伪造。Cash on Delivery 回款被打包进 COD remittance cycles，Shadowfax
              将其营销为行业最快。逆向取件中，伙伴在客户门口进行 open-box 质检，或在 hub-based inspection 中按客户可配置 QC 参数检查。Hyperlocal 订单路径更短：伙伴从 dark
              store 或商户位置接单、取货，并在 SLA 窗口内送达；该分部没有分拣中心中间环节，降低延迟，但也移除了 SF Shield 扫描检查点。平台还开放基于 WhatsApp 的对话式
              bot，向客户收集地址确认，并把修正输入 SF Maps 实时训练闭环。
