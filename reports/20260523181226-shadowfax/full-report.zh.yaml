      - number: '1.5'
        title: 里程碑、新产品与负面背景
        blocks:
          - type: paragraph
            body: >-
              Shadowfax 的叙事弧线可以从里程碑里看出来。About Us 页面把故事起点放在 2015 年，彼时是纯最后一公里食品配送和快递服务， 第一年日订单超过 10,000-plus。后续公司材料强调向更广的
              3PL、快递、本地即时和 quick-commerce 品类迁移；2026 年交易所披露又加入两项值得注意的产品和公司动作：April 17, 2026 对 Criticalog 的收购披露，以及 April
              21, 2026 对 Shadowfax 360 的发布披露。这些动作说明，公司仍在核心网络周边继续扩张软件驱动的商户工具和高端物流服务。2026 年记录也有负面一面。TechCrunch
              报道称，Shadowfax 上市时股价走弱，因为投资者关注少数大型 ecommerce 和 quick-commerce
              客户带来的高收入集中度。这并不否定业务进展，但解释了为什么公开市场审视不同于后期私募融资审视：如果市场担心议价权掌握在集中客户手里， 网络规模和增长就不再足够。合理解读应保持平衡。Shadowfax
              已经实现了印度物流中少见的里程碑密度：十年从创立到规模化、主要风险资本背书、 经审计盈利、公开市场转型，以及持续产品发布。但同一公开市场转型，也暴露了下一组尽调问题：客户集中度、分部结构，
              以及在价格竞争仍然激烈时当前盈利能力有多可持续。
