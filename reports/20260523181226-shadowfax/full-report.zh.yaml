    sections:
      - number: '6.1'
        title: 客户基础分层
        blocks:
          - type: paragraph
            body: >
              Shadowfax 服务五个清晰客户分层，锚点是企业级 ecommerce 平台。第一个也是主导分层是大型横向 ecommerce，主要为 Meesho 和 Flipkart；两者共同驱动多数
              express-parcel 和 reverse-logistics 量。按 ICICI Securities initiating coverage report，Meesho 单独贡献约 H1 FY26
              operating revenue 的 48.9%，是绝对最大的单一收入锚点。Flipkart group entities（Instakart Services 和 Flipkart
              Internet）是第二大账户。两类客户都在 express forward、reverse pickup 和 value-added services 上使用 Shadowfax。第二个分层是 quick
              commerce 和 hyperlocal delivery，H1 FY26 贡献收入 20%（₹359.3 crore，同比增长 82.5%）。Quick-commerce 客户包括
              Zepto、Blinkit、Swiggy Instamart、BigBasket（Tata）和 Flipkart Minutes；ICICI Securities 确认，按 Redseer
              订单量口径，Shadowfax 是 3PL quick-commerce solutions 市场领导者。第三个分层是 fashion 和 beauty ecommerce——Myntra（Flipkart
              Group）面向 fashion，Nykaa 面向 beauty——Shadowfax 承接 express 和 same-day 正向配送以及退货。第四个分层是 food delivery 和 mobility
              platforms（Zomato、Swiggy、Uber），使用 Shadowfax 两轮车队网络；按 Economic Times，Shadowfax 是唯一向 online mobility
              platforms 提供两轮车队的大规模 3PL。第五个也是增长最快的分层是 SMEs 和 D2C brands，通过 Shadowfax 360（April 21, 2026 发布）触达；该产品为从
              marketplace 模式转向自有渠道 commerce 的 online-first sellers 提供无最低订单承诺、flat-rate 计费、一键 Shopify 和 WooCommerce
              集成。一个新兴的第六相邻方向是通过 CriticaLog 切入 critical logistics B2B（医疗、汽车、奢侈品、IT 高价值货件），截至 Q4 FY26 产生 ₹130 crore
              ARR。其他具名客户包括 ONDC、Magicpin、Licious、Purplle、Kartrocket、Pincode 和 Uber，客户 mix 正在向 top-five 集中客户组之外扩展。
