      - number: '7.3'
        title: 伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >
              收入集中和伙伴依赖，是覆盖本次 IPO 的分析师最常提到的风险。RHP 披露，最大单一客户 Flipkart Instakart 贡献了 H1 FY26 收入的 48.91%（H1 FY25 为
              51.23%，FY25 为 48%，FY24 为 59.23%）。前五大客户合计贡献 FY25 收入的 74.6%、FY24 收入的 84.96%。这些数字没有结构性改善：H1 FY26 相比 FY25
              只是小幅下降。

              Meesho 和另一家未具名的电商 anchor client 各自也贡献了有意义的个位数百分比收入。如果前三大客户中任何一家流失且没有替代量补上，在 INR 1322 crore
              租赁负债约束下，现有固定租赁和人员底座很可能在两到三个季度内转为亏损。

              第三方 franchisee 依赖是第二层集中风险。Shadowfax 在 tier-2/3 市场的 last-mile 由约 4600 家 franchisee partners 交付（截至 FY25，FY26
              有一定增长）。franchisee 模式已引发消费者欺诈投诉，也带来质控离散。franchisee 合同通常期限较短且需续约，形成续约风险悬崖。

              技术供应侧，Shadowfax 的调度和路径引擎托管在第三方云基础设施上。RHP 没有披露云服务商名称，也没有披露灾难恢复 RPO/RTO 目标。在没有披露故障切换的情况下，单一供应商集中给日均 3.5
              million-plus 包裹量带来尾部风险。
