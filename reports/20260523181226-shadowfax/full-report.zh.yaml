      - number: '6.3'
        title: 具名客户证据与证据质量
        blocks:
          - type: paragraph
            body: >
              Shadowfax 最清晰的客户证据来自 Red Herring Prospectus 及其在多个独立来源中的引用：RHP
              点名具体客户，披露其收入贡献比例，并标明所用具体服务线。这是正式监管级客户证据，不是营销文案。RHP 和佐证来源中的具名客户列表包括
              Meesho、Flipkart、Myntra、Swiggy、BigBasket、Zepto、Nykaa、Blinkit、Kartrocket、Zomato、Uber、Pincode、Purplle、Licious、ONDC
              和 Magicpin。Quick-commerce 分部方面，ICICI Securities 确认 Shadowfax 向 Zepto、BigBasket、Blinkit、Swiggy Instamart 和
              Flipkart Minutes 提供 specialized hyperlocal delivery。最大客户 Meesho——印度最大的 social commerce 平台——在其泛印度卖家网络中使用
              Shadowfax 做 express forward parcel 和 reverse pickup。这段关系持续已久：Meesho 是 Shadowfax 早期增长阶段的主要驱动因素，H1 FY26
              48.9% 的收入份额确认了整合深度。Flipkart Internet Private Limited 本身曾是 Shadowfax 股东，并在 January 2026 IPO 中作为 selling
              shareholder 参与，进一步验证了战略关系深度。Snapdeal 联合创始人 Kunal Bahl 和 Rohit Bansal（Titan Capital）早期投资，并按 Scanx 在 IPO
              时实现约 158 倍初始投资回报，确认 Shadowfax–Snapdeal 关系最初兼具客户和投资人属性。Shadowfax 官方 About Us 页面将公司描述为“India 顶级 e-commerce 和
              hyperlocal 品牌的首选物流伙伴”，这一营销表述与 prospectus 级证据一致。生产部署证据质量高：所有具名客户都是活跃发货账户，不是 pilots。不过，正式案例研究、客户证言、SLA
              performance metrics 和 outcome statements 均未公开。下方 evidenceGaps note 说明了这一限制。按 Redseer，且由 Economic Times 和
              ICICI Securities 引用，Shadowfax 在 FY25 和 Q1 FY26 是按订单量计的 same-day delivery 和 reverse pickup 最大 3PL。
