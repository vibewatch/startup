  - id: TV005
    title: 投资逻辑破裂与止损触发条件表
    columns:
      - 触发条件
      - 阈值
      - 对投资逻辑的传导
      - 操作含义
    rows:
      - - 调整后 EBITDA 利润率崩塌
        - 连续两个季度低于 3%
        - 这会摧毁 Shadowfax 应享有成长型物流倍数、而非成熟低利润率重估的论点。
        - 首次确认后退出或大幅降低敞口。
      - - 客户集中度恶化
        - 任一单一客户收入占比超过 40%
        - 表明多元化失败，并提高对单一账户价格重置或配额削减的敏感度。
        - 除非管理层提供硬性合同保护，否则从观察转为回避。
      - - 增长被重估为成熟物流
        - FY28E 收入 CAGR 低于 20%
        - 合理倍数会从约 25x 降至接近 15x，公允价值被大幅压缩。
        - 按下行倍数重新承销该股；不要盲目摊低成本。
      - - PE / 锁定期供给压力兑现
        - 主要 pre-IPO 持有人在 July–October 2026 锁定期到期窗口卖出
        - 在估值已缺少强上行支撑时，进一步增加技术性供给压力。
        - 若无大宗交易吸收证据，避免在到期窗口前立即建仓。
    notes: |
      这些是明确的投资逻辑破裂条件，而非泛泛风险。每个阈值都会改变投资者应支付的倍数，或改变他们对增长和多元化叙事的信心。
    claimRefs:
      - CV038
      - CV046
      - CV047
      - CV048
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 对估值为何重要
      - 尽调路径
    rows:
      - - 服务线单位经济性
        - 按 e-commerce、q-commerce、hyperlocal、FMCG 和 kirana 分销服务线审计的经济性。
        - 若没有分部层面经济性，利润率可持续性和正确综合倍数无法验证。
        - 要求提供董事会级分部盈利包和服务线贡献利润率桥。
      - - Flipkart 商业条款
        - 定价保护、货量承诺、终止权，以及关联方或战略商业条款。
        - Flipkart 集中度是基准和熊市情景中的核心下行变量。
        - 审阅客户主协议、修订历史和收入集中度看板。
      - - Adj. EBITDA 质量
        - 单独披露 FY26 ESOP 成本和资本化技术支出调整。
        - 与 Blue Dart、Delhivery 和分析师模型真正可比，取决于 EBITDA 处理口径一致。
        - 在审计师或财务负责人支持下，将管理层调整后 EBITDA 与 Ind-AS 账目调节。
      - - Q-commerce 去中介化
        - Blinkit、Swiggy Instamart、Zepto 及其他快速配送客户的收入贡献和盈利能力。
        - 市场支付的增长溢价部分来自 q-commerce；客户自建运力可能压缩外部物流需求。
        - 获取客户层面的 cohort 趋势和按品类划分的货量份额变化。
      - - 退出与抛压准备
        - 详细锁定期到期安排，以及未来 12–24 个月 PE 投资者预期减持路径。
        - 即便经营表现稳健，供给侧压力也可能压制上行。
        - 与投行或 IR 审阅 cap table、锁定期日历和可能的二级 / 大宗交易路径。
    notes: |
      这些最终尽调项最可能改变建议。若管理层无法提供，正确姿态仍是观察，而非买入。
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
      - CV050
