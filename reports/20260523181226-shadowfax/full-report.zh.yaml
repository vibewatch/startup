      - number: '2.3'
        title: 买方、用户与付款方分层及采用路径
        blocks:
          - type: paragraph
            body: >
              印度 ecommerce 物流市场的结构是 buyer-payer 合一：与 3PL 签约并付费的是平台或品牌，而不是终端消费者。理解这个结构， 是评估 Shadowfax 收入质量和集中度风险的前提。

              横向 ecommerce 平台（Amazon、Flipkart、Meesho）是最大的买方分部，占印度 ecommerce 快递包裹量的大头。这些平台是成熟采购方， 具备件量杠杆，也已经证明愿意投资
              captive logistics（Ekart、ATS）。JM Financial 确认 Shadowfax 服务
              Meesho、Flipkart、Myntra、Swiggy、Bigbasket、Zepto、Nykaa、Blinkit、Kartrocket、Zomato、Uber 和 Purplle——这个组合横跨横向
              ecommerce、食品 / 杂货和按需服务，与公司的多垂直定位一致。客户集中度实质性偏高： 头部客户贡献 H1 FY2026 收入的 48.9%，前五大客户贡献 74.1%。

              Quick commerce 运营商（Blinkit、Zepto、Swiggy Instamart）构成结构不同的买方分部，SLA 要求不同（sub-30-minute）、
              dark-store-to-consumer 地理结构不同，3PL 合同结构也不同。Mordor 数据显示，2025 年 Tier I Metros 占印度 quick-commerce 市场
              67.33%——集中在高密度城市区，适合 Shadowfax 的 gig-network 部署模式。JM Financial 确认 Shadowfax 是 3PL quick-commerce
              解决方案市场领导者。

              D2C 品牌是快速增长分部，但买方成熟度差异很大。Unicommerce 来自 6,000+ 个品牌和 410M+ 件运单的数据表明， FY2026 D2C GMV 增长 33%，完全由件量驱动，而不是涨价。ET
              Brandequity 报道，新 D2C 订单中 66% 来自 Tier 2 和 3 城市。D2C 品牌通常使用快递聚合商或多承运商编排；获取新 D2C 客户需要技术集成和履约记录。

              逆向物流买方横跨所有分部，但代表独立预算决策：退货成本管理是明确痛点（Unicommerce 显示 COD RTO 峰值 58%，best-in-class 为 21%），且 JM Financial 确认
              Shadowfax 是 reverse pickup shipments 的市场领导者。逆向物流的采用路径通常跟随品牌的正向物流关系， 因此是自然的交叉销售。
