  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              Shadowfax 位于物流 gig-economy 劳动力与数字数据处理的交叉点，正落入快速扩张的监管边界。近期风险窗口由四根立法支柱界定。

              The Code on Social Security 2020（SS Code）已于 November 21 2025 生效，配套 Rules 于 May 8-9 2026 通知。SS Code 要求向 gig
              和 platform workers 供给工作的 aggregators 缴纳社会保障 levy，为 annual turnover 的 1 to 2 percent，并以支付给此类 workers 总额的 5
              percent 为上限。按 Shadowfax FY26 revenue run-rate 约 INR 4200 crore 计算，意味着 annual incremental levy 为 INR 42 to
              84 crore。公司 FY25 有 2.05 lakh 名非独家配送伙伴。由于这些伙伴形式上为非独家，aggregator liability 的精确适用性仍在行业论坛中争议，但 RHP
              已明确将其列为重大风险，且未量化。

              The Digital Personal Data Protection Act 2023 和 DPDP Rules 2025（notified November 13 2025）对 data
              fiduciaries 施加强约束。Shadowfax 通过 SF Shield 处理 biometric identity data（20 million scans per day 4 million
              images per day via facial-recognition AI）。不合规罚款最高为 INR 250 crore per breach；full compliance required by
              May 13 2027，Consent Manager appointment by November 13 2026。截至报告日，公司未发布正式 DPDP 合规路线图。

              GST regime 自 July 2025 起变化，要求 Goods Transport Agency operators 按 Notification 5/2023 选择 forward-charge
              liability。Shadowfax GTA operations 面临 5 percent GST rate without ITC，或 12 percent with ITC；相比竞争性的 18
              percent courier rate，这形成混合激励的定价环境。如果合规选择不佳，可能侵蚀 surface-transport margins。

              作为新上市实体，Shadowfax 受 SEBI LODR Regulations 2015 及截至 2024 的修订约束，包括更严格的 Related Party Transaction
              规范、更高的独立董事审查和季度披露要求。公司使用 SEBI Regulation 6(2) eligibility（而非标准 6(1)(b) profitability pathway）获得 IPO
              资格，表明标准盈利门槛未被满足。
