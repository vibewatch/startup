      - number: '5.5'
        title: 信任、安全、合规框架与产品路线图
        blocks:
          - type: paragraph
            body: >
              Shadowfax 的信任与合规框架主要围绕自有 AI 安全栈，而不是行业认证。配送伙伴每日自拍 check-in 是最可见的一环：每位配送伙伴开工时必须提交实时自拍，AI 管线用 FaceNet
              embeddings 和活体模型，将其与入驻参考照片实时校验。SF Shield 内的 SF Eye 子系统提供补充，在分拣中心通过 geospatial algorithms 和 neural network
              video analytics 监控骑手身份，防止在入库和派发点冒名。Track & Trace 子系统叠加第二层：分拣中心每天超过 20 million 次条码扫描，AI anomaly detection
              识别错分、误操作和盗损风险。Geo-location 持续采集（伙伴在平台上活跃时每 5 seconds 一次），按 Google Play privacy policy 披露，所有通过配送伙伴 App
              传输的个人数据均在传输中加密。

              上市合规方面，Shadowfax 作为 NSE（SHADOWFAX）和 BSE（544685）上市公司，受 SEBI Listing Obligations and Disclosure
              Requirements（LODR）regulations 约束。April 21, 2026 的 Shadowfax 360 发布由 Company Secretary 根据 SEBI LODR
              Regulation 30 向交易所披露。公司公开页面没有披露 ISO 27001、SOC 2、PCI-DSS 或物流行业特定认证。innovation
              页面未提及正式的数据隐私认证；公司不运营受监管医疗或金融服务垂直，但如果 CriticaLog 的医疗和 IT-supply-chain 垂直扩张，可能暴露合规缺口。

              截至 May 2026，基于交易所披露和管理层评论拼出的产品路线图包括：完成 Shadowfax 360 商户大规模入驻（自 April 2026 发布后持续推进）；Prime Large 重货服务到 FY27
              年末从 6,000 pin codes 扩展到 10,000 pin codes；将 CriticaLog 的运营系统和路线优化完全整合进核心平台；FY27 继续投入 ₹180–190 crore
              capex，用于分拣中心自动化和末端基础设施；以及（在 Shadowfax AI blog 中披露的）向 agentic AI 迁移的意图，让 AI 在无人干预下自主处理中断、改道和费率调整。公司没有发布公开
              API changelog 或 release cadence，外部无法独立验证软件发布速度。
