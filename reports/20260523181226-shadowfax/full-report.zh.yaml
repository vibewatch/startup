      - number: '1.4'
        title: 规模快照与盈利拐点
        blocks:
          - type: paragraph
            body: >-
              2026 年记录中最强的新事实，是规模化盈利。May 14, 2026 董事会会议结果披露，FY26 经审计单体运营收入 为 ₹4,080.35 crore，高于 FY25 的 ₹2,467.20
              crore；税后利润为 ₹115.18 crore，一年前为 ₹6.21 crore。同一文件显示，Q4 FY26 单体运营收入为 ₹1,205.81 crore，税后利润为 ₹55.27
              crore。另据投资者演示稿，Q4 FY26 收入为 ₹1,237 crore，FY26 收入为 ₹4,202 crore，adjusted EBITDA 为 ₹159 crore，Q4 FY26
              在快递和本地即时服务中交付 22.6 crore 笔客户订单。经审计单体收入与投资者演示稿收入之间的差异需要谨慎处理， 但两套官方披露都指向同一方向：Shadowfax
              不再只是一个增长故事。公司在订单量和网络密度继续复合增长的同时，已经产生正收益。 演示稿还披露 15,656 个 PIN codes、2,59,609
              名合作伙伴，以及快递和本地即时分部的强劲订单增长，说明网络在扩张， 而不是只从静态版图中榨取利润率。独立报道也印证了趋势。Entrackr 报道 H1 FY26 收入为 ₹1,805.6 crore、 利润为
              ₹21 crore；Inc42 报道 FY24 收入为 ₹1,884.8 crore，净亏损下降 92% 至 ₹11.8 crore。合并解读，
              证据显示三阶段推进：先形成大规模网络；再靠利润率纪律压缩亏损；最后在订单增长支撑下出现可见盈利，而不只是削成本。 这是 Shadowfax 现在更像严肃品类领导者、而不只是风险资本扶持的物流中介的最清晰理由之一。
