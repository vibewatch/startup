          - type: callout
            title: RTO 率管理是印度 D2C 物流市场的关键运营和利润率杠杆
            body: >
              Unicommerce 对 6,000+ 个 D2C 品牌、410M+ 件运单的分析显示，best-in-class（21% RTO）和中位表现者（39%+
              RTO）之间的差距纯属运营问题——不是由品类或平台驱动。对 Shadowfax 来说，RTO 改善既是客户留存杠杆，也是净收入驱动因素： RTO 每下降 1 个百分点，就消除一次双重物流事件（失败的正向配送 +
              reverse pickup），并改善每票净收入。作为 reverse pickup 市场领导者，Shadowfax 既能从更高 RTO 事件中获利，也能从降低 RTO 的 VAS
              解决方案中获利——这是结构上有利的双重位置。
