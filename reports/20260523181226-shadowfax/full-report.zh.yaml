      - number: '7.4'
        title: 人员与执行风险
        blocks:
          - type: paragraph
            body: >
              Shadowfax 高管团队由四名联合创始人组成：Abhishek Bansal（CEO）、Praharsh Chandra（COO）、Gaurav Jawgi（CTO）和 Vaibhav
              Khandelwal（CSO 兼 Risk Management Committee Chair）。RHP 将上述每个人列为 key-person dependency，且未披露接班计划。公司没有披露除 IPO
              标准 promoter lock-up 之外，是否存在 non-compete 或 lock-in 条款。

              董事会稳定性值得关注：截至 IPO 日，董事平均任期约 1.2 年。四名独立董事中有三名是在 IPO 前 18 个月内加入。上市后合规要求重，董事会快速更替会引入治理风险，尤其是在 SEBI LODR
              独立董事规范下。

              人员扩张风险很尖锐。公司披露显示，员工数从 FY25 的 11675 人几乎翻倍，到 September 2025 达到 21654 人。增长速度跑在既有入职和培训流程前面。运营人员扩张又与 tier-2/3
              城市扩张同步，而 Shadowfax 在这些城市的组织经验较少，执行风险被叠加放大。

              gig partner 基础非独家，文化和激励一致性风险更高。SF Shield 欺诈检测能力能抓到身份冒用，但在工资纠纷背景下，无法解决配送伙伴系统性表现不佳或协同放慢的问题。
