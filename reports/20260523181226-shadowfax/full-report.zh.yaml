      - number: '8.3'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >
              Shadowfax 的可比公司集合支持的是细分判断，而不是单向结论。

              对比最接近的上市成长同行 Delhivery，Shadowfax 在 EV/revenue 上其实略便宜（2.61x 对 3.14x），EV/EBITDA 也大致持平（51.75x 对 50.98x）。

              这个比较解释了为什么部分投资者愿意付高价：印度电商物流平台的估值，市场已经习惯更多看远期规模和利润率轨迹，而不是当期盈利。

              但 Delhivery 不能为 Shadowfax 当前价格提供一揽子正当性，因为 Delhivery 较低的 revenue-to-enterprise-value
              折价，是在多年公开市场经营记录之后才形成的，而且仍反映一个上市后路径波动很大的行业。


              其余可比公司更让人冷静。

              Blue Dart 仅以 1.99x EV/revenue 和 12.91x EV/EBITDA 交易，同时利润率明显更高，说明当增长稀缺性不再是主导因素后，成熟物流经济性的估值长什么样。

              Mahindra Logistics 约 0.5x EV/revenue 和 8.7x EV/EBITDA，代表较低倍数的 B2B 合同物流框架。

              私募市场参照更弱：Xpressbees 的估值重置隐含约 0.3x EV/revenue，Ecom Express 约 0.5x EV/revenue 的困境出售，则说明亏损物流故事压缩得有多快。

              因此，可比表传递的信息很清楚。Shadowfax 可以相对困境或慢增长同行守住溢价，但当前价格只有在增长和利润率扩张同步延续时才成立；同行中位数天然并不支持支付显著高于当前倍数的价格。
