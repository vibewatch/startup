      - number: '6.2'
        title: 采用与部署轨迹
        blocks:
          - type: paragraph
            body: >
              在印度 3PL 运营商中，Shadowfax 的采用轨迹属于公开资料中最陡的一类。按 ICICI Securities March 2026 initiating coverage 和 Economic
              Times 引用的 Redseer report，公司 3PL ecommerce market share 从 FY22 的约 8% 增至 FY26 上半年的 23%。ICICI 估计，到 December
              2026，market share 达到约 27–28%，意味着 Shadowfax 已巩固 Delhivery 之后第二大玩家的位置。Express parcel shipment volumes 从 FY23
              的 302 million 增至 FY24 的 342 million、FY25 的 536 million，并按 ICICI 预测在 FY26 达到估计 670 million。Hyperlocal
              volumes 从 FY23 的 48 million 增至 FY24 的 95 million、FY25 的 140 million，ICICI 估计 FY26 为 196 million。按 Hindu
              BusinessLine，H1 FY26 express volume 为 29.4 crore（294 million）订单，较 H1 FY25 的 196 million 同比增长 50%。按
              Entrackr，FY23 至 FY25 总收入以 32.5% CAGR 增长（₹1,415 crore 至 ₹2,485 crore），随后在 H1 FY26 同比加速至 68.4%，达到 ₹1,805.6
              crore。按投资者演示，FY26 全年合并收入为 ₹4,202 crore。Hindu BusinessLine 称，报告期内平均 express yield per order 从 ₹49 提升至 ₹54（约
              10% 或以上），这是收入质量改善的有意义信号，因为 value-added services（same-day、open-box、reverse）在 express 收入 mix 中占比提升。截至
              September 2025，按 Chittorgarh 和 Paytm Money 引用的 Red Herring Prospectus 数据，网络通过 4,299 个触点覆盖 14,758 pin
              codes，并拥有 205,864 名平均季度唯一交易配送伙伴。April 2026 推出的 Shadowfax 360 打开了 SME 和 D2C
              漏斗；此前小卖家因入驻摩擦和量门槛基本被排除在外。CriticaLog（₹130 crore ARR）和 Prime Large 重货（₹60 crore ARR，Q4 FY26 已覆盖约 6,000 pin
              codes）代表新的需求面，ICICI 估计这些相邻业务将支撑多年增长。
