  - id: FI001
    title: Shadowfax 收入模型桥 — 客户活动到总收入
    type: flow
    layout: standard
    summary: |
      客户订单活动如何通过 Shadowfax 的单票收费模型转化为收入流，并在核心快递和超本地货量之上叠加 VAS 和新兴细分。
    data:
      nodes:
        - id: client-demand
          label: 客户需求：电商、即时零售、D2C 品牌、ONDC
        - id: order-intake
          label: 订单摄入：API 集成；接受发货后触发单票费用
        - id: express-stream
          label: 快递包裹配送费：~69% 收入（H1 FY26）；按重量-距离-速度动态定价
        - id: hyperlocal-stream
          label: 超本地 / 即时零售配送费：~20% 收入（H1 FY26）；按单、基于距离
        - id: other-stream
          label: 其他物流：关键物流、内包、前置仓：~11% 收入（H1 FY26）
        - id: vas-layer
          label: VAS 叠加：逆向取件、开箱验货、当日达高端层级；占快递收入 40%（RHP）；利润率更高
        - id: gross-revenue
          label: 运营总收入：FY26 ₹4,202 crore 合并（+69.1% YoY）
        - id: partner-cost
          label: 减：配送伙伴付款：~52% 收入；最大单项成本
        - id: transport-cost
          label: 减：运输费用：~19% 收入；干线和中段运输
        - id: other-cost
          label: 减：员工成本、丢失货件、其他间接费用：~24% 收入
        - id: adj-ebitda
          label: Adjusted EBITDA：FY26 ₹159 crore（3.8% 利润率）；Ind-AS EBITDA ₹212 crore（5.0%）
      edges:
        - from: client-demand
          to: order-intake
          label: 单票事件触发收入确认
        - from: order-intake
          to: express-stream
          label: B2C 电商和 D2C 订单路由至此
        - from: order-intake
          to: hyperlocal-stream
          label: 即时零售和按需订单路由至此
        - from: order-intake
          to: other-stream
          label: 关键物流和内包订单路由至此
        - from: express-stream
          to: vas-layer
          label: 逆向、开箱验货和高端层级增加收入溢价
        - from: express-stream
          to: gross-revenue
          label: 核心快递费用
        - from: hyperlocal-stream
          to: gross-revenue
          label: 超本地单票费用
        - from: other-stream
          to: gross-revenue
          label: 关键物流和管理费
        - from: vas-layer
          to: gross-revenue
          label: VAS 收入溢价叠加到快递
        - from: gross-revenue
          to: partner-cost
          label: 扣除最大可变成本
        - from: gross-revenue
          to: transport-cost
          label: 扣除干线
        - from: gross-revenue
          to: other-cost
          label: 扣除固定和半固定成本
        - from: gross-revenue
          to: adj-ebitda
          label: 成本后经营利润
    approximationNotes: >
      收入占比（69% 快递、20% 超本地、11% 其他）来自 H1 FY26 DRHP。VAS 占快递收入 40% 由 DRHP 披露，但未单独做收入核算。成本占比为 Q4 FY26 实际值，来自 Multibagg
      对公司披露的分析。Adj EBITDA 数字为 Scanx 引用董事会结果的 FY26 全年数据。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI007
      - CI008
      - CI013
      - CI014
      - CI018
  - id: FI002
    title: Shadowfax 单位经济性桥 — 每票收入到 Adjusted EBITDA（Q4 FY26）
    type: flow
    layout: standard
    summary: |
      用 Q4 FY26 合并收入和订单量数据推导每票单位经济性。所有数值均为基于公开披露推导的估计；并非经独立审计的单票数据。
    data:
      nodes:
        - id: revenue-per-shipment
          label: 每票收入：~₹54.7（推导：₹1,237 crore / 22.6 crore 订单，Q4 FY26）
        - id: partner-expense
          label: 减伙伴费用：~₹28.6/shipment（占收入 52.2%）；零工配送伙伴支出
        - id: transport-charge
