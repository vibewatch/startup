      - number: '1.3'
        title: 融资历史、所有权与公开市场转型
        blocks:
          - type: paragraph
            body: >-
              在转向公开市场前，Shadowfax 的资本历史横跨风险投资和 crossover 投资人。Eight Roads、Entrackr 和 TechCrunch 均报道了 February 2024 由 TPG
              NewQuest 领投的 $100 million 融资，参与方包括 Mirae Asset、Nokia Growth Partners、Qualcomm、IFC、Flipkart 和
              Trifecta。这些报道说明，即便印度物流赛道对烧钱和利润率质量更谨慎， Shadowfax 仍能吸引成长资本。到 2025 年，公司从私募融资转向 IPO 执行。January 2026 red
              herring prospectus 披露，发行总额最高 ₹19,072.69 million，其中包括最高 ₹10,000 million 的新股发行和最高 ₹9,072.69 million 的 offer
              for sale。文件中的出售股东名单包括 Flipkart Internet Private Limited、Eight Roads Investments Mauritius II、NewQuest Asia
              Fund IV 和 Mirae Asset funds，显示既有机构股东把 IPO 作为部分流动性事件，同时公司仍募集一级资本。prospectus 还记录了 BSE 和 NSE 于 August 13,
              2025 出具的 in-principle approvals。外部报道实时跟踪了这次转型。VCCircle 报道了 Shadowfax 在 2025 年的 confidential IPO
              filing，Economic Times 报道了 ₹2,000 crore IPO 的 updated draft prospectus， Financial Express 则报道了 January 2026
              的 ₹118-124 价格区间。Qualcomm Ventures 随后把 January 28, 2026 上市称为印度物流的 category-defining
              里程碑。合在一起看，这些来源呈现的是一家从独角兽式私募融资进入上市公司披露节奏的公司， 但核心论点没有变：用轻资产网络和软件层，在快递与本地即时物流中抢份额。
