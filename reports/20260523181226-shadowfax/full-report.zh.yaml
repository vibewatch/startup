  - id: TE003
    title: 技术与运营架构表——Shadowfax
    columns:
      - 层级 / 组件
      - 角色
      - 依赖
      - 已知风险
    rows:
      - - 订单管理系统（OMS）
        - 中央路由和分配引擎；接收 API 订单；触发 SF Maps 地址解析；分配配送伙伴
        - Google Cloud Platform（GCP）；内部微服务经 Kafka 通信；客户 REST API
        - 编排单点；2025 迁移中，GCP 故障或 NAT 配置错误导致全天宕机
      - - SF Maps（地址智能）
        - ANN / Siamese-network 嵌入模型；通过 VectorDB + H3 索引把印度自由文本地址解析为经纬度
        - GCP 推理基础设施；1.5B 历史配送数据点；WhatsApp 机器人提供地址纠错输入
        - 数据分布漂移（新城市、地址格式）时，模型准确率可能下降；依赖 WhatsApp API
      - - SF Shield——Track & Trace
        - 分拣中心每日 20M+ 条码扫描；HD 摄像头 AI 核验处理人、包裹、格口匹配；实时告警
        - 自研监控基础设施；AI 视频处理管线；与 OMS 集成
        - 监控硬件 capex 和维护；员工外观变化时 AI 模型可能漂移；无第三方审计
      - - SF Shield——SF Eye（骑手身份）
        - 分拣中心人脸识别和地理空间 AI；防止零工骑手冒名和账号滥用
        - 每日自拍验证后端；FaceNet 512-D 嵌入；活体检测模型
        - 对抗条件（口罩、极端光照）下的表现未公开做基准测试
      - - AI 自拍验证管线
        - 骑手每日打卡——实时自拍与入职照片比对；活体检测拦截伪造
        - FaceNet 模型；512-D 嵌入数据库；活体检测（ResNet18 迭代后的轻量模型）
        - 公司报告精度 96%；假阳性率（真实骑手被拦）未披露
      - - 配送伙伴 Super App（Android）
        - 为 259,609+ 名伙伴提供路线引导、接单、收入看板、多品类任务管理
        - GCP 后端 API；GPS；SF Maps 导航；实时 OMS 连接
        - App 版本 25.7.3；要求 Android 5.1+；200K+ 条评论提到偶发订单分配问题
      - - Kafka 消息总线
        - 异步服务间通信；解耦 OMS、追踪和通知服务
        - GCP Pub/Sub 或自管 Kafka 集群（博客显示 Kafka schema registry 消耗 NAT 端口）
        - 迁移期间需要清理 schema registry；陈旧连接推高 NAT 端口使用
      - - GCP 云基础设施（AWS 迁移后）
        - 计算、网络（8 个 NAT IP）、面向 Google APIs 的 Private Google Access、Internal Load Balancers
        - Google Cloud Platform；8 个外部 NAT IP（所有客户 / 伙伴防火墙均需外部白名单）
        - TCP timeout 配置错误在 2025 年导致全天宕机；8-IP 白名单带来协同成本
      - - 分拣中心网络
        - 物理入库、分拣和发运节点；部署 SF Shield 摄像头；干线交接点
        - 53+ 个租赁设施；3.5M+ sq ft；全部租赁——零自有基础设施
        - 100% 租赁模式——租约不续或租金上涨就是直接产能风险
      - - 干线运输
        - 分拣中心之间的城际包裹流转；第三方承运商；轻资产模式
        - 第三方卡车供应商；无自有干线车队
        - 服务质量和准时率依赖第三方可靠性；未披露后备 SLA
    claimRefs:
      - CE009
      - CE011
      - CE016
      - CE017
      - CE018
      - CE019
      - CE020
      - CE021
      - CE022
      - CE023
      - CE024
      - CE025
      - CE026
    notes: |
      架构细节来自 Shadowfax 工程博客（GCP 迁移、SF Maps 上线、自拍验证、Android 速度优化）和 SF Shield 新闻稿。尚未发布第三方技术审计、架构图或正式系统设计文档。所有技术主张均来自公司自身。
