  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: |
      决策链从规模和盈利证明出发，经过集中度和估值检查，最后落到 MONITOR 结论。
    data:
      nodes:
        - id: scale
          label: 规模证明
          detail: FY26 72.6 crore 票和覆盖 2,000+ 个城市的网络确认平台相关性。
          type: process
        - id: profitability
          label: 盈利证明
          detail: FY26 收入 ₹4,202 crore、调整后 EBITDA ₹159 crore、Ind-AS EBITDA ₹212 crore、净利润 ₹112 crore，验证经营进展。
          type: process
        - id: risk
          label: 风险堆栈
          detail: Flipkart 集中度、薄利润率、q-commerce 脱媒，以及较低的 promoter 持股，让下行风险仍然有分量。
          type: process
        - id: valuation
          label: 估值检查
          detail: 2.61x EV/revenue、51.75x EV/EBITDA，以及接近 ₹197 的一致目标价显示，上行空间已经被大幅折现。
          type: process
        - id: weighted
          label: 情景权重
          detail: 牛 / 基准 / 熊分析隐含每股价值约 ₹180，低于当前 ₹201 市价。
          type: process
        - id: decision
          label: MONITOR
          detail: 在上调评级前，等待更低入场价，或看到单位经济和集中度的更强证据。
          type: process
      edges:
        - from: scale
          to: profitability
          label: 业务是真实的
        - from: profitability
          to: risk
          label: 有证明但没有缓冲
        - from: risk
          to: valuation
          label: 倍数必须保持严苛
        - from: valuation
          to: weighted
          label: 检查公允价值
        - from: weighted
          to: decision
          label: 价格纪律
    approximationNotes: |
      该流程展示逻辑顺序，而非数值模型。它用于说明为什么一家好公司在当前价格下仍然只能是 monitor。
    claimRefs:
