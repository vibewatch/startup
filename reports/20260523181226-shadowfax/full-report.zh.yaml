          - type: callout
            title: Shiprocket 同时是 Shadowfax 的分销渠道和潜在去中介者
            body: >
              Shiprocket 通过一个包含 Shadowfax 的承运商网络，为 400,000+ 商户路由 200M+ 年 ecommerce transactions。 在这个角色中，它既是 B2B 客户，也是
              Shadowfax 在 D2C mid-market 配送能力的分销渠道。但随着 Shiprocket 建设自有履约基础设施、仓储能力，并在获得 SEBI 批准后准备 ₹2,500 crore
              IPO，它正在搭建能力栈，以便更强势地与承运商谈判， 或在履约中去中介化。这种双重角色——渠道和潜在竞争者——意味着 Shadowfax 应把 Shiprocket 增长同时视为分销机会和战略风险。
              正确的尽调问题是：Shadowfax 是否披露了通过 Shiprocket 路由运单带来的收入敞口，以及 Shadowfax 360（April 2026 发布）是否旨在赶在 Shiprocket 的全栈
              pitch 成为留存威胁前捕获 D2C 商户。
