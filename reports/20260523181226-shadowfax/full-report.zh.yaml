      - number: '8.6'
        title: 建议与尽调问题
        blocks:
          - type: paragraph
            body: |
              建议是 MONITOR，不是因为 Shadowfax 质量不够，而是因为证据相对价格已不再宽裕。
              这门生意已经有足够公开证据支持机构兴趣：规模大、盈利改善、分析师覆盖，并且在印度物流栈中扮演可信角色。
              但估值支撑仍约束建议。三家启动覆盖的分析师中有两家的目标价低于市场价，共识目标价略低于现价，概率加权情景区间也落在当前股价下方。
              这就是“拉伸但未明显破裂”的定义。
              更有吸引力的入场区间大约是 ₹155–170；在这个区间，用基准情景承销的下行更窄，市场也不再为仍在形成中的证据收取过高价格。

              因此，最终尽调比再听一个季度叙事更重要。
              投资者仍需要服务线单位经济、Flipkart 合同条款的明确披露、ESOP 和资本化技术调整的清晰度，以及对 q-commerce 依赖和 lock-up overhang 的更好能见度。
              如果 adjusted EBITDA 利润率连续两个季度低于 3%，任何单一客户收入占比超过 40%，或收入增长放慢到足以迫使市场从 25x 转向 15x 估值框架，就应视为论点破裂。
              现有 PE 投资者的退出准备也指向 block deals，而不是战略出售；这意味着未来 12–24 个月，供给侧压力可能与运营执行同样重要。
              在这些开放问题收窄前，正确姿态是主动监控，并设置严格下行触发器，而不是激进买入。
