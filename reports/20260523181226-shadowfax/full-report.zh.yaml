          label: Quick Commerce / 即时本地入口
          description: Zepto、Blinkit、Swiggy Instamart、BigBasket：按需 dark-store 配送的 3PL 伙伴；2 小时 SLA；Shadowfax 按交易量为市场领导者（Redseer）
