  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: IPO 背景与进入公开市场
        blocks:
          - type: paragraph
            body: |
              Shadowfax 的估值讨论要从 IPO 交易记录开始，因为市场给出的第一轮判断是混合的。
              公司以 ₹124 价格区间上市，并于 January 28, 2026 以 ₹113 挂牌，较发行价低约 9%。
              这个疲弱首秀对估值重要，因为它说明在公司还没有完整上市后报告记录之前，投资者最初就认为发行定价已经打满。
              交易结构也带着情绪包袱：IPO 募资约 ₹2,250 crore，但存量投资者 OFS 部分的存在，让这笔交易不像纯粹的 growth-capital 轮。
              因此，公开证据把这次上市框定为一次协商后的流动性事件，而不是干净的重估催化：早期持有人部分降风险，公开市场买方则接下执行和估值风险。

              上市后改变的不是业务存在与否，而是市场愿意为它支付多少。
              到 May 2026，Shadowfax 因披露 FY26 盈利、交出强劲 Q4，并获得 JM Financial、ICICI Securities 和 Morgan Stanley 正式启动覆盖，股价大幅反弹。
              这轮反弹提高了对平台质量的信心，但没有抹去 IPO 的原始信息：公开市场投资者只有在折价时才愿意持有 Shadowfax，而当前价格已经显著高于最初的出清水平。
              因此，本估值章节不把 IPO 当作当前价格便宜的证据，而把它视为定价纪律重要的证据，也说明公开市场对这只股票的支持仍是有条件的，而非无条件。
            claimRefs:
              - CV001
              - CV002
              - CV036
              - CV038
              - CV049
      - number: '8.2'
        title: 当前公开市场估值
        blocks:
          - type: paragraph
            body: >
              到 May 22, 2026，Shadowfax 已成为一家盈利的上市物流平台，数据足以支撑机构覆盖。

              股价报 ₹201.28，处于 ₹98.55 至 ₹212 的 52 周区间内；对应市值约 ₹11,747–11,770 crore，扣除净现金后企业价值接近 ₹10,962 crore。

              FY26 收入达到 ₹4,202 crore，adjusted EBITDA 为 ₹159 crore，Ind-AS EBITDA 为 ₹212 crore，净利润 ₹112 crore；ROCE 和 ROE
              均接近 9.6%。

              这些都是真实里程碑，尤其对一家刚上市不久、报告利润率仍很薄的物流运营商而言。


              估值问题不在于 Shadowfax 是否真实，而在于当前价格是否留出了足够容错。

              按 2.61x EV/FY26 revenue、51.75x EV/Ind-AS EBITDA、92.33x trailing PE、50.66x forward PE
              计算，市场要求这只股票更像增长平台，而不是成熟物流承运商。

              分析师目标价强化了这种张力。JM Financial 的 ₹190 目标价和 ICICI Securities 的 ₹175 目标价都低于市场价，Morgan Stanley 的 ₹225
              目标价是唯一高于现价的主要上行情景。

              接近 ₹197 的共识目标价基本说明，市场已经消化了当前公开牛市论点的大部分。

              这让 Shadowfax 值得持续跟踪，但若没有更强证据证明利润率耐久、客户集中下降和相对同行的比较优势，要在 ₹201 把它写成明确买入并不容易。
