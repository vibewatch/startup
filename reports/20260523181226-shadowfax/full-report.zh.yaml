      - number: '6.5'
        title: 集中度风险与扩张策略
        blocks:
          - type: paragraph
            body: >
              客户集中度是投资者对 Shadowfax 客户基础的核心担忧。按 ICICI Securities initiating coverage，公司最大客户 Meesho 贡献约 H1 FY26 operating
              revenue 的 48.9%。Hindu BusinessLine 和 Scanx 称，前五大客户贡献 H1 FY26 收入的 74.1%，前十大约 84–86%。TechCrunch 报道，Shadowfax
              IPO 股票在 January 28, 2026 上市时，从 ₹124 发行价跌约 9% 至 ₹112.60，客户集中度被列为首要投资者担忧——这是直接的市场化负面信号。Meesho
              带来的结构性风险最大，也最具体：ICICI Securities 记录，FY23 Meesho 将 98.2% 货件外包给 3PLs，但到 H1 FY26 已通过其 Valmo 内包平台降至
              35.5%。ICICI 的 bear case 明确把“Meesho 需求放缓，且 Meesho 是其最大客户（>50% overall revenue contribution）”列为对应 ₹80
              每股目标价的情景。Ecom Express 先例是直接相关的负面案例：Ecom Express 失去 Meesho 量给 Valmo 后陷入财务困境，并在 2025 年以 ₹1,407 crore 被
              Delhivery 收购，较此前 ₹7,300 crore 估值折价约 78%。Shadowfax 正主动缓释集中度。Shadowfax 360（April 2026）以无量门槛让 SMEs 和 D2C
              brands 接入，瞄准此前无法入驻的新分层。CriticaLog 提供高价值 critical logistics（医疗、汽车、奢侈品、IT），ARR 为 ₹130 crore，且利润率更具防御性。Prime
              Large 瞄准重货大体积货件，在约 6,000 pin codes 产生 ₹60 crore ARR。面向 quick commerce 的 dark-store operations 在头部站点单仓月收入
              ₹8–15 lakh。扩张逻辑成立——Shadowfax 网络是一层可被任何物流垂直复用的基础设施——但这些相邻业务要实质稀释 Meesho 收入份额，周期是多年，不是几个季度。ICICI 预计，在 Amazon
              onboarding、D2C 扩张和 pin-code 延伸推动下，Shadowfax express parcel volumes 到 FY28E 将以 23% CAGR 增长；在 quick-commerce
              垂直品类扩张推动下，hyperlocal 到 FY28E 将以 38% CAGR 增长。
