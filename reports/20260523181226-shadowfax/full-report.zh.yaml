      - number: '5.4'
        title: 开发者生态、API 暴露面与商户集成
        blocks:
          - type: paragraph
            body: >
              Shadowfax 向企业客户和发货伙伴开放 REST API，覆盖订单创建与履约、通过 webhooks 实时状态和追踪、面单生成、逆向取件发起、COD 管理。API 使用基于 token 的认证（Bearer
              Token / API key），并支持 sandbox 环境做上线前测试。APITracker 将 Shadowfax 列为提供 webhooks 和 developer API，但未确认存在公开
              OpenAPI/Swagger specs、OAuth playground 或可公开下载的 SDK；这些在 tracker profile 上均列为缺失。一个 Postman public
              collection（workspace ID 9ba9v71）存在，并被第三方集成指南引用，确认至少有一个开发者贡献的 API collection 可通过 Postman network 访问。

              Shadowfax Logistics Platform 已上架 Shopify App Store（app slug
              shadowfax-order-app），并获取客户数据（name、email、phone、physical address）、商品和库存数据，以及包括退货和第三方履约在内的全部订单历史。该 App 支持从
              Shopify 订单导入到创建货件、追踪更新、退货处理的端到端流程自动化。第三方集成文档（Parcelmind）描述了集成流：Shopify 下单会触发对 Shadowfax order-creation
              endpoint 的 API call，tracking webhooks 再把状态更新推回。WooCommerce 集成在 Shadowfax 360 新闻稿中与 Shopify 一起披露为 one-click
              选项；未独立找到 WooCommerce plugin page。

              配送伙伴 Super App（Android package in.shadowfax.gandalf）是 259,609+ 活跃配送伙伴的主要现场界面。截至 May 2026，version 25.7.3
              为最新版本，大小约 32.8 MB，要求 Android 5.1+。Google Play 显示下载量 9 million+，来自 200,000+ reviews 的评分为 4.1/5。该 App
              在单一界面支持多种收入流——餐饮和生鲜配送、express parcel、bike taxi、10-minute quick-commerce——因此是面向 gig workforce 的多服务“Super
              App”。AppBrain 数据确认该 App 活跃且持续更新。Google Play 用户评论提到偶发订单分配不一致和客服响应缺口，这对规模化运营可靠性构成负面的开发者 / 伙伴信号。
