      - number: '4.2'
        title: 成本结构、毛利率驱动因素与盈利轨迹
        blocks:
          - type: paragraph
            body: >
              Shadowfax 的成本基底主要由可变的配送伙伴和运输支出构成，这与其资产轻、靠 gig 模式调度的运营模型一致。Q4 FY26，合作伙伴费用占合并收入 52.2%，运输费用占 18.7%，员工福利费用占
              8.9%，“lost shipments and quality check cost” 科目占 6.1%。总费用为收入的 95.3%，对应本季度 adjusted EBITDA margin 为 4.7%。H1
              FY26，DRHP 给出的同口径数据显示，配送人员成本占总费用 53%（₹956 crore，+69% YoY），运输占 18%（₹325.2 crore，+52.8% YoY），员工福利为 ₹171.8
              crore（+40% YoY）。H1 FY26 遗失 / 损坏货件科目为 ₹148.2 crore，超过上年同期 3x；Q4 业绩会 CFO
              指出，该科目既包括逆向上门质检产品溢价，也包括实际损失。公司没有单独披露毛利率；收入之下第一条利润披露线是 EBITDA excluding other income。

              盈利轨迹是经营杠杆最有力的证据。Adjusted EBITDA 从 FY23 的负 ₹113.47 crore，改善至 FY24 的 ₹11.37 crore（0.6% margin）、FY25 的 ₹56.19
              crore（2.0% margin）、H1 FY26 的 ₹64.34 crore（3.56% margin）、Q3 FY26 的 ₹49 crore（4.3% margin）和 Q4 FY26 的 ₹58
              crore（4.7% margin）。FY26 全年 adjusted EBITDA 为 ₹159 crore（3.8% margin，+227% YoY）。Ind-AS EBITDA 加回租赁会计调整，FY26
              为 ₹212 crore（5.0% margin，+277% YoY）。Net profit after tax 从 -₹142.64 crore（FY23）推进至 -₹11.88
              crore（FY24）、₹6.06 crore（FY25），再到 FY26 的 ₹112 crore 合并口径 / ₹115.18 crore 单体口径。经审计的单体业绩在 May 14, 2026
              董事会会议后提交给交易所。FY26 单体口径 basic EPS 为 ₹2.29。

              仍需保留两项结构性利润率约束。第一，公司在 DRHP 中自行说明，它不跟踪服务线层面的利润率，因此无法确认哪个分部或客户集中度最增厚利润率、哪个最拖累利润率。第二，Q4 FY26 revenue 中 6.1% 的
              lost-shipments 科目相对简单物流同业异常偏高，且分类受管理层判断影响（产品承保溢价 vs 实际损失）。管理层指引 adjusted EBITDA margin 到 FY28 每年大约提升
              100-120 basis points，之后希望每年提升 200-250 basis points，迈向“double-digit steady-state EBITDA”目标。
