      - number: '4.5'
        title: 财务结论、私有指标缺口与尽调阻断点
        blocks:
          - type: paragraph
            body: >
              截至 May 2026，Shadowfax 的财务画像是一家拐点后的 3PL：已在规模上证明经营杠杆，取得经审计盈利，资产负债表接近无债，并持有超过 ₹1,000 crore 现金。FY26 收入增长
              69.1%，adjusted EBITDA margin 达到 3.8%，相较 FY25 的 2% margin 和 FY23-FY24 长期亏损期，确实是台阶式变化。₹350 crore
              的经营现金流说明，业务无需外部融资即可维持当前 capex 计划。

              核心财务风险是收入集中度。IPO 上市时的市场报道在这一点上明确偏负面：Financial Express 在 January 29, 2026 上市报道中指出，最大客户贡献约 H1 FY26 收入的
              49%，且盈利能力仍薄。TechCrunch 指出，投资者在集中度与薄利润率之间权衡后，股价较发行价下跌约 9%。FY25 net profit margin 为 0.3%；FY26 合并 net margin
              虽明显改善至 2.7%，但相对更成熟市场的物流平台仍偏薄。若任一大客户向下重谈价格、把物流转回自营，或降低量份额，考虑到合作伙伴成本结构大多可变且难以轻易抵消，EBITDA 冲击会高度重大。

              这里识别出三项额外财务尽调阻断点。第一，DRHP 明确承认公司不跟踪服务线层面的利润率，仅靠公开披露无法判断 express、hyperlocal 或 VAS 中谁是利润率引擎、谁是拖累。第二，单票定价基于
              SLA 且不公开；实现单票收入只是推导估算，不是已验证数字。第三，Q4 FY26 遗失货件和质检成本占收入 6.1%，需要尽调拆分产品溢价承保与实际运营损失。Q4
              业绩会纪要提供了管理层对该科目的解释，但会计处理仍值得独立审查。
