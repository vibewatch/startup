      - number: '8.4'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >
              Shadowfax 的正面论点直接且有证据支撑。

              公司已经在印度物流中达到有意义的规模：FY26 包裹量 72.6 crore，网络覆盖 2,000+ 城市，平台按其品类业务量看似是最大 open-network third-party logistics
              玩家。

              产品证据也支持部分溢价故事。管理层和独立覆盖都描述了 94% 以上的首次派送成功率、q-commerce 和 dark-store 物流的快速增长，以及一种轻资产运营模式：用 gig
              运力和路径软件把增量业务量转化为经营杠杆，而不是自建重资产车队。

              如果这种模式继续跑通，Shadowfax 应该比更慢、更重资产的同行拿到更高估值。


              反论点同样重要，因为它直接打击估值支撑。

              Shadowfax 的 adjusted EBITDA 利润率仍只有 3.8%，对燃油通胀、激励压力或价格竞争几乎没有冗余。

              围绕 Flipkart 的客户集中仍是核心下行变量；promoter 持股接近 16.6%，按印度上市公司标准偏轻；股价已经反映了利润率持续扩张且执行失误很少的预期。

              公开来源还强调了 q-commerce 中的去中介风险：Blinkit、Swiggy Instamart、Zepto 等大客户正在自建或扩张内部配送能力。

              简言之，论点是真实的，但对价格高度敏感。Shadowfax 看起来是一家高质量运营商，却被定价成其运营模式、客户组合和利润率路径已经充分验证；而公开申报文件中，这些证明的重要部分仍不完整。
            claimRefs:
