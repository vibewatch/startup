      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Shadowfax 仍由创始人带队。2026 治理页面列出 Abhishek Bansal 为 Chairman、Managing Director and CEO，Vaibhav Khandelwal 为
              Whole-Time Director and CTO。同一页面还列出 Praharsh Chandra 为 Whole-Time Director and CBO，Gaurav Jaithlia 为
              Whole-Time Director and Head of Business Strategy。red herring prospectus 继续将 Abhishek Bansal 和 Vaibhav
              Khandelwal 识别为公司 promoters， 这使创始双人成为主要治理和控制锚点，尽管披露的高管团队已经更宽。为了接受公开市场审视，治理已明显制度化。董事会现在包括 Bijou
              Kurien、Pirojshaw Sarkari、Ruchira Shukla 等独立董事，并设有审计、提名与薪酬、利益相关方关系、 风险管理、CSR 和 IPO 事项等具名董事会委员会。投资者通信披露还将
              Krishnakanth G V 列为 Company Secretary and Compliance
              Officer，说明公司已经配齐上市发行人应有的法定接口。治理的主要优势是连续性：业务仍通过创始叙事对外呈现， 官方和外部来源也反复把 Abhishek Bansal 放在融资、IPO
              和战略沟通中心。主要治理风险则是这项优势的反面： 领导集中度仍高，尤其是创始人和早期运营团队仍处在产品战略、投资者关系和 go-to-market 执行的交汇处。公司已搭起治理脚手架，
              但商业故事仍与创始团队高度绑定。
