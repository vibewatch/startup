      - number: '3.5'
        title: 图表
        blocks:
          - type: callout
            title: Shadowfax 是唯一在 quick-commerce、reverse 和 top-2 express 三线同时领先的 3PL
            body: >
              2026 年印度 ecommerce 物流市场中，没有竞争者同时领先 quick-commerce 3PL delivery、reverse logistics pickup volume，并在 express
              parcel delivery 中位居 #2——这是 Shadowfax 根据 JM Financial 和 Redseer 披露实现的组合。Delhivery 是规模更大的快递玩家，但不领先
              quick-commerce 3PL。Blue Dart 是收入规模玩家，但结构上缺席 quick-commerce 和 D2C 本地即时。XpressBees 参与快递竞争，但仍亏损，也没有被确认的 Q-com
              领导地位。这种多垂直定位形成网络密度优势—— 用于本地即时配送的资产能提高返程快递包裹利用率——而任何单一垂直都难以复制。
            calloutType: strength
            claimRefs:
              - CP015
              - CP016
              - CP017
              - CP019
              - CP035
          - type: callout
            title: Delhivery 的 Ecom Express 后规模与客户集中度带来两条不同替代路径
            body: >
              Delhivery 的 ₹10,508 crore FY26 收入、27–30% 快递市场份额，以及 Ecom Express 收购后的公开定价纪律策略， 构成可能扩大的结构性规模差距。收入达到
              Shadowfax 的 2.5× 后，Delhivery 能同时资助 Delhivery Local（与 Shadowfax 本地即时竞争）、自动化
              capex，以及防守件量的深度定价。第二项风险是客户集中度：Shadowfax 头部客户（likely Flipkart/Meesho）贡献 H1 FY26 收入 48.9%（JM Financial），而
              Flipkart 同时是 Ekart 的母公司。 平台决定把更多件量转向 captive arm，在财务上会很重大，在战略上也合理。两项风险目前都受控，但需要在 Shadowfax 上市后披露中持续监控。
            calloutType: risk
