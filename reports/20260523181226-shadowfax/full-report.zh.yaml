  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与 Shadowfax 可触达边界
        blocks:
          - type: paragraph
            body: >
              Shadowfax 处在印度物流生态多个子市场的交汇处，做规模测算前必须先把边界划准。公司的核心可触达市场，是 ecommerce 平台、 quick-commerce 运营商、D2C
              品牌、食品配送网络和按需本地即时服务产生的、外包且由技术调度的最后一公里物流支出。可触达市场不包括： 平台自建物流部门（Ekart/Flipkart、Amazon Transportation
              Services）、由 Blue Dart、Gati 和传统地面货运主导的大件包裹与货代分部、 以及不涉及最后一公里配送的纯仓储 3PL 合同。这些剔除项很重要：Ekart 和 ATS
              合计每年为母平台处理数亿件包裹， 对横向 ecommerce 中 3PL 可触达件量构成结构性天花板。

              在可触达边界内，Mordor Intelligence 按服务类型、业务模式、配送速度、产品类别和城市层级切分印度 ecommerce 物流市场。 Transportation 在 2025 年占市场收入的
              71.42%，说明配送本身——不是仓储或分析——仍是最大支出池。B2C 占市场 62.58%，C2C 则以 6.42% CAGR 增长最快，由 Meesho 等平台上的点对点 marketplace
              增长带动。Fashion and lifestyle 以 25.58% 拿下最大产品类别份额，是 Shadowfax 快递包裹业务的单一最大垂直。Tier-3 及以下城市已占 ecommerce 物流市场
              40.48%——这是一个结构性事实，利好能够低成本覆盖农村地区的轻资产网络，也是 Shadowfax 相对重仓储 incumbents 的主要竞争定位。

              现状替代方案包括：（1）平台自建或收购的 captive logistics 运营；（2）没有技术编排层的直接快递合同；（3）Shiprocket 等快递聚合商，为较小的 D2C 品牌在多个 3PL
              承运商之间路由运单。这些替代方案没有任何一个能完整复制 Shadowfax 用同一个最后一公里合作伙伴网络同时服务快递包裹和本地即时 quick-commerce 配送的能力，这是真正的相邻优势。相邻市场包括跨境
              ecommerce 物流（排除在当前范围之外；Mordor CEP market 显示 2025 年国内配送占市场 90.35%）和 B2B 分销物流（排除； 主要由重货运运营商服务）。
