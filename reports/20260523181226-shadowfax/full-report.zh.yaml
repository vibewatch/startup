        - 目前没有单一竞争对手能在规模上复制三者，但 Delhivery 正投入所有三条垂直线，并以 FY26 ₹10,508 crore 收入支撑 capex
        - 中——2–3 年窗口期；在此之前，很难有单一竞争对手可信地同时补齐三项差距
        - 跟踪分部层面 EBITDA 披露，判断多分部模式是在稀释利润率还是增厚利润率
      - - 在订单量复合增长同时实现规模化盈利（FY26 PAT ₹115.18 crore）
        - 定价商品化会重新带来利润率压力；Delhivery 整合后会优先守利润率，而不是补贴规模——可能打破行业定价平衡
        - 中——周期性；当前行业定价纪律对 Shadowfax 利润率有利
        - 监测 Delhivery 单票 yield 披露；跟踪 Shadowfax 调整后 EBITDA / 票趋势
    notes: >
