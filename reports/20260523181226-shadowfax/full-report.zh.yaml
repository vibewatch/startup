      - - Quick Commerce / 本地即时
        - 30 分钟内 3PL last-mile 配送物流费；dark-store 履约支持
        - 平台自有 dark-store 运营和库存成本；当日达杂货 GMV
        - Q-com 平台（Blinkit, Zepto, Swiggy Instamart）
        - 增长细分；JM Financial 确认 Shadowfax 是 3PL Q-com 市场领导者
      - - D2C 品牌配送
        - 面向品牌直营销售的正向快递配送和逆向取件
        - 品牌自营 captive 仓库发货；线下 / 零售分销
        - D2C 品牌（Nykaa, Mamaearth, Boat, Purplle, Licious）
        - 扩张中的细分；Shadowfax 客户名单包括多个 D2C 名称
      - - 逆向物流
        - 退货取件费；退回原点的正向运输或换货发货
        - 品牌自营内部退货柜台；消费者到消费者 C2C 退货
        - 电商平台和 D2C 品牌
        - JM Financial 显示，按逆向取件订单量为市场领导者
      - - 增值服务 (VAS)
        - 上门 QC、hand-in-hand 换货、COD 收款、部分配送欺诈检查
        - 基础仅扫码签收 VAS；IT 平台 SaaS 单独售卖
        - 覆盖上述所有细分的企业客户
        - 高利润附加项；JM Financial 明确将其列为 Shadowfax 强项
    notes: >
      细分边界由分析师定义且有重叠：Shadowfax 为 D2C 品牌配送的一单，可能会根据 Mordor Intelligence 或 IMARC 使用的方法，被同时计入电商物流和 D2C
      物流总量。剔除支出类别代表真实的天花板风险：无论竞争质量如何，Ekart 和 ATS 的 captive 业务量都不向 3PL providers 开放。Shadowfax 公开财务没有单独披露 VAS 收入。
    enumerationScope:
