      - number: '4.4'
        title: 资本充足性、现金、capex 与融资依赖
        blocks:
          - type: paragraph
            body: >
              January 2026 IPO 募集约 ₹1,907 crore（₹1,000 crore fresh issue，₹907 crore OFS）之后，Shadowfax 以强健的上市后资产负债表运营。按
              Simply Wall St 截至 FY26 年末的数据，股东权益合计约 ₹1,740 crore，总债务约 ₹0.28 crore，几乎可以忽略。现金和短期投资约 ₹1,120 crore。总资产约
              ₹2,830 crore，总负债约 ₹1,090 crore。短期资产（₹1,640 crore）明显覆盖短期负债（₹890 crore）和长期负债（₹200 crore），说明近期流动性稳健。约 ₹94.5
              crore 的 EBIT 支撑 4.8x interest coverage。

              FY26 经营现金流为 ₹350 crore，改善幅度显著，说明业务在经营层面已经可以自我供血。即便公司投入了史上最高 capex，9-month FY26 free cash flow（经营现金流减
              capex）仍为 ₹61 crore：9M 期间 capex 为 ₹140 crore，FY26 全年为 ₹185 crore。管理层指引 FY27 capex 为 ₹180-190 crore，约占预期收入
              2.5-3.5%（低于 FY26 的 4.4%）。这说明绝对金额最高的 capex 周期可能已经过去。

              从风险融资轮到 TPG NewQuest 领投的 2024 年 $100 million 融资，再到 January 2026 IPO，融资脉络已在 Company Overview
              章节覆盖。前瞻资本评估的关键事实是：（1）公司没有重大债务依赖；（2）经营现金流为正；（3）IPO 募资用途包括 ₹423 crore 网络 capex、₹139 crore 新设施租赁付款、₹89 crore
              品牌和营销；（4）剩余募集资金和现金储备可用于非有机收购和一般公司用途。所有物流设施均采用租赁模式，这是结构性的资金依赖——每一平方英尺运营空间（当前 3.5 million+ sq
              ft）都是租来的，因此租赁付款是经常性资本义务，不是一次性资产购买。尽管权益缓冲强，这种租赁依赖仍会持续；做资本充足性预测时，必须把它和 capex 一起视为经常性现金需求。
