      - number: '4.3'
        title: 单票经济性与每票指标
        blocks:
          - type: paragraph
            body: >
              Shadowfax 未公开披露单票定价，因此所有单票经济性都只能用公开财务报表除以公开订单量推导。这些是估算值，不是独立验证数据。Q4 FY26，₹1,237 crore 合并收入对应 22.6 crore
              订单，隐含每票收入约 ₹54.7。用本季度 ₹58 crore adjusted EBITDA 折算，每票 adjusted EBITDA 约 ₹2.57。FY26 全年，₹4,202 crore 收入对应
              72.6 crore 订单，隐含每票收入约 ₹57.9。这些估算把 express 与 hyperlocal 合并成一个混合口径；express parcels 距离更长、重量更高，单票收入也更高，而
              hyperlocal 高频、轻量、靠近场景驱动。由于 hyperlocal 这种结构性低单票收入服务增长更快，混合每票收入环比略有下降。

              按 Q4 FY26 口径推导成本分摊：合作伙伴费用占收入 52.2%，约合每票 ₹28.6；运输占 18.7%，约合每票 ₹10.2；员工成本占 8.9%，约合每票 ₹4.9；遗失货件 / 质检成本占
              6.1%，约合每票 ₹3.3。四项合计约每票 ₹47，给 adjusted EBITDA 和其他管理费用留下约每票 ₹7.7。公司未披露 CAC 或 LTV；在 B2B 单票模型里，客户是签约平台、关系靠 SLA
              约束，而不是逐个获客的消费者，这两个指标意义不大。

              新收入押注方面，管理层披露，头部前置仓的 gross margin 超过 20%，单仓月收入在 ₹8 到 ₹15 lakh，回本周期为三到四个月。CriticaLog 按 Q4 FY26 量级被引用为 ₹130
              crore ARR。Prime Large（重货与大体积货件）为 ₹60 crore ARR。这些新兴分部相对核心 express 体量仍小，但提供了提升收入 mix 利润率的路径。
