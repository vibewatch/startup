    layout: wide
    summary: |
      旅程图展示 Shadowfax 如何获取并扩展五类客户：从初始发现，到 API 集成、生产上线，再向更多服务线交叉扩展。图中将五类客户细分建模为旅程节点，每类都有不同的进入路径、服务切入点和扩展模式。
    data:
      nodes:
        - id: enterprise_horizontal
          label: 企业横向电商入口
          description: Meesho、Flipkart：为快递正向包裹做 API 集成；通过企业销售入驻；量最大、单件收益最低；随后扩展到逆向取件和 VAS
