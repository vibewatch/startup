  - id: FE002
    title: Shadowfax 快递包裹配送流程 — 订单到门
    type: flow
    layout: standard
    summary: |
      标准快递包裹从企业客户下单，到分拣中心入库、中段运输和 AI 验证最后一公里配送的端到端流程，包含 COD 收款和逆向物流路径。
    data:
      nodes:
        - id: order-placement
          label: 客户 / 商户通过 REST API 或 Shadowfax 360 门户下单
        - id: oms-routing
          label: OMS 验证 PIN-code 可服务性；分配取件伙伴；生成标签
        - id: sf-maps-resolve
          label: SF Maps 解析配送地址：ANN 模型 + H3 地理空间索引；必要时 WhatsApp 机器人确认
        - id: pickup-partner
          label: 配送伙伴在 Android 超级 App 接受取件任务；完成每日自拍检查验证
        - id: sort-centre-induction
          label: 包裹进入始发分拣中心；SF Shield 扫描条码；AI 验证处理人员身份（SF Eye）
        - id: mid-mile
          label: 第三方干线将包裹运至目的地分拣中心
        - id: dest-sort-centre
          label: 包裹在目的地分拣中心扫描；AI 再验证；派发配送伙伴
        - id: last-mile
          label: 配送伙伴借助 SF Maps 导航至门口；GPS 每 5 秒追踪
        - id: delivery-attempt
          label: 门口交付：客户确认；如适用则 COD 收款；确认交付
        - id: cod-remittance
          label: COD 金额批量汇给商户（Shadowfax 声称行业最快周期）
        - id: rto-path
          label: 配送失败：AI RTO 预测器在发货前标记高风险订单；触发退回始发地
        - id: reverse-pickup
          label: 逆向取件：伙伴在门口执行开箱 QC；商品退回分拣中心
      edges:
        - from: order-placement
          to: oms-routing
          label: API 调用触发 OMS 创建订单
        - from: oms-routing
          to: sf-maps-resolve
          label: 伙伴分配前地址标准化
        - from: oms-routing
          to: pickup-partner
          label: 任务派给最近可用且已验证的伙伴
        - from: pickup-partner
          to: sort-centre-induction
          label: 伙伴揽收货件并送至分拣中心
        - from: sort-centre-induction
          to: mid-mile
          label: 分拣并进入干线
        - from: mid-mile
          to: dest-sort-centre
          label: 通过第三方承运人进行城际运输
        - from: dest-sort-centre
          to: last-mile
          label: 带路线优化派发最后一公里伙伴
        - from: last-mile
          to: delivery-attempt
          label: 上门配送尝试
        - from: delivery-attempt
          to: cod-remittance
          label: COD 收款并批量回款
        - from: delivery-attempt
          to: rto-path
          label: 配送失败触发退回流程
        - from: rto-path
          to: reverse-pickup
          label: 发起逆向取件；执行开箱 QC
    approximationNotes: >
      工作流根据 Shadowfax 创新页面、工程博客（SF Maps、自拍视频验证、SF Shield）以及 Shadowfax 360 新闻稿重构。即时本地配送闭环更短——没有分拣中心入库，也没有中段运输；合作伙伴从 dark
      store 取货后直接配送。CriticaLog 的关键货件流程在人员验证和安全协议上可能不同；细节未公开记录。
