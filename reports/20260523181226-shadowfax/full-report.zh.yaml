      - number: '7.2'
        title: 运营质量与安全风险
        blocks:
          - type: paragraph
            body: >
              Shadowfax 的运营模型资产轻，但潜在风险重。三类子风险占主导：gig-workforce availability and quality、在途丢失与货件损坏敞口，以及技术基础设施集中。

              2.05 lakh 非独家配送伙伴网络给 Shadowfax 带来规模弹性，但没有合同独占性。竞争对手若给出更高激励，可能快速引发外流。按 Moneycontrol 引用的 RHP 数据，流失率从 FY25 约
              50 percent 降至 H1 FY26 的 15.3 percent，但改善集中在城市 hubs；农村 franchisee 路线仍脆弱。SF Shield 骑手验证系统（facial AI 20
              million scans daily）缓释身份欺诈，但无法阻止骑手成规模转投竞争平台。

              货件质量和损失指标在 RHP 中只做概括披露。按分析师覆盖，quality-check and lost-shipment costs 约占 Q4 FY26 revenue 的 6.1
              percent。更高损失率会不成比例地冲击 D2C 分部，因为 Shadowfax 是唯一登记承运方。RHP 称公司维持在途损失保险，但未披露保单限额和除外责任。

              技术与网络安全风险由三项因素抬高：（1）SF Shield 处理 biometric data，触发 DPDP Act 义务；（2）所有核心 dispatch、routing 和 real-time
              tracking systems 都运行在云基础设施上；（3）Shadowfax SaaS platform Shadowfax 360 是较新的收入流，独立安全审计历史有限。一旦云服务商长时间宕机，或
              biometric data stores 遭遇重大泄露，运营中断和监管处罚会同时发生。
