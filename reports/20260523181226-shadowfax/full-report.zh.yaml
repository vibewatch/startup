  - id: FE001
    title: Shadowfax 平台栈架构 — 服务层和技术组件
    type: stack
    layout: standard
    summary: |
      七层视图展示 Shadowfax 物流平台，从底部实体网络基础设施到顶部商户和伙伴接口，并列出各层关键技术组件及主要依赖。
    data:
      layers:
        - id: physical-network
          label: 实体网络（Layer 1）
          modules:
            - 53+ 个租赁分拣中心（3.5M+ sq ft；4,299+ 个触点；15,000+ 个 PIN codes；2,500+ 个城市）
            - 第三方干线车队（轻资产；无自有卡车或飞机）
            - 分拣中心的 HD 枪式摄像头（SF Shield；20M scans/day；4M images/videos/day）
        - id: cloud-infrastructure
          label: 云基础设施（Layer 2）
          modules:
            - Google Cloud Platform（2025 从 AWS 迁移后；8 NAT IPs；Private Google Access）
            - 用于服务间流量的内部负载均衡器（迁移后优化）
            - Kafka 消息总线（异步服务间事件；迁移后清理 schema registry）
        - id: data-ai
          label: 数据和 AI 平台（Layer 3）
          modules:
            - SF Maps — ANN/Siamese 网络；1.5B-point 训练数据；VectorDB；H3 地理空间索引
            - AI 自拍验证 — FaceNet 512-D 嵌入；活体检测；96% 精确率
            - SF Shield AI 视频分析 — 基于流的地理空间算法；神经网络图像处理
            - 路线优化引擎；需求预测；AI RTO 预测器
        - id: core-platform
          label: 核心平台服务（Layer 4）
          modules:
            - 订单管理系统（OMS）— 订单摄入、PIN-code 可服务性、伙伴分配
            - 实时追踪 — 每 5 秒 GPS；通过 webhooks 提供实时货件状态
            - COD 回款自动化；WhatsApp 客户沟通机器人
        - id: service-lines
          label: 产品服务线（Layer 5）
          modules:
            - 快递包裹（~69% 收入 H1 FY26）；超本地 / 即时零售（~20%）
            - 逆向物流；CriticaLog 关键货品（₹130 crore ARR）；Prime Large 重件包裹（₹60 crore ARR）
            - 前置仓运营（托管履约节点；头部门店 20%+ GM）
        - id: integration-layer
          label: 集成和 API 层（Layer 6）
          modules:
            - REST API — 创建订单、追踪 webhooks、生成标签、发起逆向取件
            - Shopify App Store 集成（shadowfax-order-app）；WooCommerce 一键接入（Shadowfax 360）
            - Postman 公开集合（workspace 9ba9v71）；沙箱环境
        - id: client-interfaces
          label: 客户和伙伴接口（Layer 7）
          modules:
            - Shadowfax 360 自助门户（April 21, 2026 发布；SME / D2C；统一费率计费）
            - 面向大型电商和即时零售客户的企业 API 仪表盘
            - Android 配送伙伴超级 App（v25.7.3；9M+ 次下载；4.1/5；100,000+ DAU）
    approximationNotes: >
      层边界为分析性构造，基于公司博客文章、创新页面和新闻披露；Shadowfax 未发布官方架构图。组件位置根据技术描述推断，可能不反映真实系统边界。Kafka 集群管理模式（self-hosted vs GCP
      Pub/Sub）未在公开来源确认。
