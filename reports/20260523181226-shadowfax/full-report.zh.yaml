      - number: '8.5'
        title: 牛市 / 基准 / 熊市情景
        blocks:
          - type: paragraph
            body: |
              情景分析是把 Shadowfax 这组混合证据转化为估值纪律的最清楚方法。
              牛市情景假设 Shadowfax 能把 FY28 收入增长到 ₹7,100 crore，adjusted EBITDA 利润率扩到 7%，并说服市场支付 30x EV/Adj. EBITDA。
              这一组合隐含市值接近 ₹16,110 crore，或每股约 ₹276，较 May 22, 2026 价格有约 37% 上行。
              该情景背后的运营逻辑并非不可能：q-commerce 和 FMCG 扩张延续，客户集中缓解，经营杠杆扩张快于成本。
              但它也假设投资者仍愿意把 Shadowfax 资本化为高端增长平台。

              基准情景更保守，也更符合今天的证据。
              收入达到 ₹6,700 crore，adjusted EBITDA 利润率提高至 5.6%，市场给予 25x EV/Adj. EBITDA，隐含市值约 ₹10,875 crore，或每股 ₹186。
              这略低于当前市场价格，意味着即便执行不错，从这里开始也未必能产生有吸引力的近端回报。
              熊市情景说明为什么这只股票仍应贴 HIGH 风险标签：如果收入仅达到 ₹5,200 crore，利润率停在 4%，倍数压缩至 15x，隐含市值只有约 ₹4,120 crore，或每股 ₹71。
              对这些情景按概率加权后，价值约为每股 ₹180，低于当前交易水平，也与“监控而不追高”的姿态一致。
