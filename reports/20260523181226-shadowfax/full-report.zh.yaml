      - number: '6.4'
        title: 留存、重复使用与耐久性
        blocks:
          - type: paragraph
            body: >
              Shadowfax 未在招股书或任何 IPO 后披露中正式披露 net revenue retention（NRR）、gross revenue
              retention（GRR）或客户流失率。这是评估耐久性的重大证据缺口。可用代理指标显示，企业客户的量留存较高。第一，按 ICICI Securities 和 Scanx，前五大客户收入集中度在 FY24 约
              75%、FY25 为 74.6%、H1 FY26 为 74.1%；这个稳定区间意味着在总收入 H1 FY26 同比增长 68% 的同时，这些账户仍保持活跃且没有流失。第二，最大客户 Meesho 在 FY25 和
              H1 FY26 均维持约 49% 收入份额，尽管 Meesho 通过 Valmo 平台内包物流量构成结构性担忧，其相对钱包份额并未出现重大下降。第三，express shipment volumes
              在每个披露期持续扩张，H1 FY26 达到 29.4 crore 订单，同比增长 50%，说明现有客户订单量在增长而非收缩——这意味着留存账户组存在净收入扩张（隐含 NRR 高于 100%）。第四，平均
              express revenue per order 从约 ₹49 提升至 ₹54，这一 yield lift 指向服务 mix 改善或定价纪律，而不是单位经济性不变下的纯量增长。多服务整合模型（同一客户在同一
              API 和平台上使用 express、hyperlocal 和 reverse）制造结构性切换摩擦：替换 Shadowfax 需要把三条服务线全部重新接入替代供应商。ICICI Securities 和
              Scanx 都将其视为留存机制。不过，缺少长期合同是耐久风险：按 Hindu BusinessLine review 披露，所有关系均基于 SLA 且可终止。Meesho 通过 Valmo
              的内包轨迹，是反证留存耐久性的首要证据——按 ICICI，外包份额从 FY23 的 98.2% 降至 H1 FY26 的 35.5%；但 Meesho 对 Shadowfax 的整体收入贡献仍稳定，意味着即便
              Meesho 的 express volume 在其总货件中的份额下降，Shadowfax 仍通过其他服务线守住价值。
