      - number: '3.2'
        title: 竞争者画像与能力对比
        blocks:
          - type: paragraph
            body: >
              每个主要竞争者都有不同能力足迹，决定了它与 Shadowfax 可触达分部的重叠或分化。Delhivery 是能力最宽的竞争者， 提供快递包裹、Part
              Truckload（PTL）货运、供应链服务（SCS）、国际配送，以及新推出的 Delhivery Local 城内配送—— 后者是对 Porter 和 Shadowfax
              在本地即时份额提升的直接回应。FY26，Delhivery 首次交付超过 1 billion 个快递包裹，快递运单量同比增长 40.2% 至 1,054 million 件。EBITDA 达到 ₹764
              crore，利润率 7.3%—— 高于 Shadowfax 披露的 adjusted EBITDA ₹159 crore，以及按投资者演示稿收入计算约 3.8% 的利润率，说明规模带来利润率优势。 Blue
              Dart 的能力有意更窄：air-to-ground 结构为 60:40，服务需要限时承诺的 B2B 企业客户。凭借 404 million FY26 运单和 DHL 全球网络整合，Blue Dart
              掌握溢价定价（通常比 3PL 快递费率高 30–50%），且几乎没有 quick-commerce 或 COD / 本地即时敞口，因此不会蚕食 Shadowfax 增长最快的分部。XpressBees 覆盖
              2,500+ 个城市，提供 express B2C、cross-border、3PL warehousing 和 reverse logistics，并截至 2024 年在部分 metros 试点
              quick-commerce。其 FY24 收入约 ~₹2,492 crore，显示小基数上的快速增长，但负 PAT 利润率（FY24 为 −6%，Inc42） 意味着相对 Delhivery 和
              Shadowfax，它在 capex 投放上受到约束。Shiprocket 的能力栈位于不同层：它是编排和聚合平台， 不是网络运营商。它给商户的价值是承运商无关的路由、履约服务和跨境工具。平台上有
              400,000+ 商户和 $4B+ 年 GMV， Shiprocket 是许多 D2C 品牌首次接入 Shadowfax 配送网络时使用的需求聚合商——也就是说，Shiprocket 同时是 B2B
              客户和潜在去中介者，因为它正在建设仓储和 captive fulfillment 能力。Porter 的能力组合大体不重叠：面向 22+ 个城市 MSME 客户的城内小卡、两轮车和搬家服务。其 FY25 收入
              ₹4,300 crore 和 unicorn status 反映的是城内货运市场的网络密度， 不是 ecommerce 最后一公里。例外在于 Shadowfax 和 Porter 都在 Tier-1 metros
              做本地即时配送，以及 Delhivery 的 Delhivery Local 计划正试图进入 Porter 的地盘。Loadshare FY24 约 ~₹1,200 crore，是一个技术驱动的区域物流网络，
              覆盖城际和最后一公里，重点扩张 Tier-2/3，日配送 250,000+，并获得 British International Investment 支持以转向 EV fleet。
