        - 偏弱：已报道特许经营骗局事件；合同期限短
        - 任意 2 个季度窗口内特许经营商数量流失超过 20%
        - 月度特许经营商盘点；消费者投诉率跟踪
    notes: |
      投资逻辑破裂触发条件必须能从公开披露中观察，包括 SEBI LODR 文件、季度业绩新闻稿和监管命令数据库。 缓释充分性按底层风险规模评估，而不是对照绝对最佳实践。
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 理由
      - 置信度
    rows:
      - - 建议
        - 观察
        - 当前价格高于概率加权公允价值，已消化大部分 FY26 改善叙事。
        - 中
      - - 估值立场
        - 偏贵
        - 2.61x EV/revenue 和 51.75x EV/Ind-AS EBITDA 相对可比公司和分析师目标都显得饱满。
        - 高
      - - 风险评级
        - 高
        - 调整后 EBITDA 利润率仅 3.8%，叠加 Flipkart 集中度、promoter 持股接近 16.6% 和锁定期抛压，构成不对称下行。
        - 高
      - - 偏好买点
        - ₹155–170/share
        - 该区间相对 ₹180 加权公允价值重新给出安全边际，也更接近公开公允价值观点的下半区间。
        - 中
      - - 最现实的持有 / 退出姿态
        - 等待更好买点或更强证据
        - 基准情景已隐含温和下行；上行需要更高概率的牛市路径，或同业并未清晰支撑的估值倍数扩张。
        - 中
    notes: |
      这是价格敏感的建议表，而不是通用质量评分。它把本章证据转化为当前可执行姿态、估值视角和入场纪律。
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV035
      - CV045
  - id: TV002
    title: 正向 / 反向投资逻辑表
    columns:
      - 方向
      - 支柱
      - 支撑证据
      - 何种情况会改变观点
    rows:
      - - 正向逻辑
        - 规模与网络密度
        - FY26 货运量达到 72.6 crore，覆盖 2,000+ 个城市，使 Shadowfax 在开放网络第三方物流中拥有有意义的密度优势。
        - 若有证据显示货运份额持续流失，或相对上市同业 Delhivery 的货量增长明显放缓，规模溢价论点会被削弱。
      - - 正向逻辑
        - 产品与服务差异化
        - 首次投递成功率高于 94%，q-commerce / dark-store 快速增长，说明 Shadowfax 比较慢的同业更能服务时效敏感品类。
        - 若 q-commerce 经济性恶化，或大客户把履约内化，产品差异化溢价应会收缩。
      - - 正向逻辑
        - 经营杠杆
        - 基于 gig 的轻资产模式和路由技术说明，增量货量可在不等比例增加 capex 的情况下抬升 EBITDA。
        - 若增量增长需要更高激励、租赁运力支出或技术摊销调整，杠杆逻辑会削弱。
      - - 反向逻辑
        - 估值几乎按完美执行定价
        - 51.75x EV/Ind-AS EBITDA 和 92x PE 几乎不给利润率不及预期或短期货量疲软留空间。
        - 更低买点，或再经历一年干净的利润率扩张，可降低股价中隐含的完美执行风险。
      - - 反向逻辑
        - 利润率缓冲薄
        - 调整后 EBITDA 利润率仅 3.8%，低于 Blue Dart 的 11.27% 和 Mahindra Logistics 的 ~6%，面对燃油、工资或定价冲击时缓冲很薄。
        - 若调整后 EBITDA 利润率连续多个季度稳定高于 5.5%，可证明业务正走出脆弱盈利状态。
      - - 反向逻辑
        - 客户与渠道集中
        - Flipkart 依赖、promoter 持股偏低和 q-commerce 去中介化风险意味着，一两个交易对手仍可能显著左右股权投资逻辑。
        - 更好的分部披露、更低单一客户敞口，以及新 FMCG 和 kirana 货量正在分散组合的证据，会改善判断。
    notes: |
      正向与反向逻辑有意保持对称。Shadowfax 可以是强运营商，但若价格不对或集中度结构不对，股票仍缺乏吸引力。
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
      - CV043
      - CV050
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
