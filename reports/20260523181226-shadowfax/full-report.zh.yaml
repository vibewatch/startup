        - 最大客户约占 H1 FY26 收入 49%；Meesho 或 Flipkart 的任何量价变化影响都很大
        - 无法压力测试集中度风险，也无法建模客户重谈对 P&L 的影响
        - 要求管理层自己的客户集中压力情景；审查 SLA 续约日期和价格重置条款
      - - 丢失货件成本拆分（承保保费 vs 实际损失）
        - Q4 FY26 收入的 6.1% 异常高；该科目把产品收入项（reverse QC insurance）与运营损失混在一起
        - 可能把质检保费误读为运营低效，或反过来；扭曲利润率质量
        - 要求管理账拆分 quality-check line 中 (a) 产品保费收入和 (b) 实际净货损
      - - Ind AS 116 使用权资产和租赁负债明细表
        - 全部设施均为租赁；租赁负债是重大或有义务，会影响杠杆和现金流久期
        - 若不量化总租赁付款义务和加权平均期限，无法完整评估资本充足性
        - 索取年报中的 FY26 经审计 Ind AS 116 附注；分析剩余租赁承诺 vs 现金头寸
      - - CAC、合同续约率和流失指标
        - 个体消费者 CAC 意义不大，但企业客户的合同续约和重新定价频率决定收入耐久性
        - 无法评估收入留存质量，或头部客户单量流失的可能性
        - 要求管理层披露合同续约条款、SLA 重新定价频率和任何历史单量流失事件
      - - FY26 经审计营运资本周期
        - 大型电商客户的应收账款周期决定业务占用多少资本
        - 没有应收和应付天数，无法评估现金转换周期或营运资本融资需求
        - 从经审计 FY26 资产负债表和现金流附注索取应收账款天数与应付账款天数
    claimRefs:
      - CI022
      - CI027
      - CI037
      - CI038
    notes: |
      这些缺口是相对于财务承保所需信息评估的。部分缺口可能会在 FY26 Annual Report 发布时解决。客户层面经济性缺口是上市公司披露的内在限制，需要私募市场数据共享框架或管理层会议才能部分弥合。
