    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与运营模式
        blocks:
          - type: paragraph
            body: >-
              根据 January 2026 red herring prospectus，Shadowfax Technologies 最初于 April 21, 2015 在 Delhi 以 Shadowfax
              Technologies Private Limited 名义注册成立。同一文件称，公司在 2025 年转为 public limited company，并自 October 1, 2025 起将注册办公室迁至
              Bengaluru。目前官方页面显示，公司位于 Devarabisanahalli, Bellandur, Bengaluru，并将其描述为覆盖快递包裹、当日达和次日达、30-minute delivery、
              逆向物流、履约和增值服务的印度物流平台。About Us 页面发布的公司使命是：借助技术赋能一百万微型创业者， 打造最快、最可靠的物流网络。这个表述很重要，因为 Shadowfax
              仍是一层轻资产协调网络，而不是重仓储或以干线运输为主的传统企业。 它给消费者和商户的承诺是速度与可靠性；给供给侧的承诺，是通过大型配送合作伙伴网络创造收入机会。官方 2026 营销页面称，公司覆盖超过 2,500
              个城市和 15,100 个 PIN codes，季度平均交易配送合作伙伴超过 2.5 lakh-plus。更早的公司自有材料也强调网络的混合属性：为 ecommerce 和 D2C 品牌提供快递包裹，
              为高频场景提供本地即时和 quick-commerce 配送，并提供欺诈控制、路线优化、逆向物流工具等增值服务。这个组合让 Shadowfax
              不只是一个快递品牌，而是一套软件调度的物流操作系统，服务线围绕不同配送时效承诺做了调校。
