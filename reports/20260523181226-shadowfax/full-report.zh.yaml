  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与市场结构
        blocks:
          - type: paragraph
            body: >
              2026 年印度 ecommerce 物流市场由五类竞争者构成，每一类都对 Shadowfax 施加不同压力。第一类也是最大的结构性约束， 是平台自建物流：Ekart（Flipkart）和 Amazon
              Transportation Services（ATS）合计服务母平台超过 80% 的件量， 对印度两大 ecommerce 玩家中 3PL 可触达份额形成硬天花板。这些部门利用母公司资助的 capex 和
              captive volume 保证维持成本领先， 独立 3PL 在这些线路上很难匹配。第二类是大型 3PL 快递——以 Delhivery 为首。Delhivery 在 June 2025 获得 CCI
              批准后，于 2025 年完成对 Ecom Express 的 ₹1,407 crore 收购。整合后，按其 CEO 说法，Delhivery 掌握快递包裹市场 27–30% 份额，相比之下 Shadowfax
              份额约为 ~23%（JM Financial，H1 FY26）。Delhivery FY26 收入 ₹10,508 crore，远高于 Shadowfax 的 ₹4,202 crore；其收购后决定放弃
              volume discounts， 也标志着定价纪律阶段，将压缩全行业利润率。XpressBees 获 Alibaba 和 Blackstone 支持，累计融资约 ~$630M，覆盖 2,500+ 个城市，并在
              EBITDA 口径盈利但 PAT 口径尚未盈利；它仍是 express B2C delivery 中相关的规模竞争者。 第三类是高端空运快递：DHL 持有 75% 的 Blue Dart，FY26 交付 404
              million 件运单，收入 ₹6,141 crore。 Blue Dart 面向企业 B2B（70% 收入）和限时空运；它在 quick-commerce 3PL 或 D2C 本地即时配送中并不构成实质竞争。
              第四类是快递聚合商：Shiprocket FY25 收入 ₹1,670 crore，为 D2C 和 SMB 运单在 25+ 个承运商伙伴之间路由， 其中包括 Shadowfax
              本身，因此既是需求渠道，也可能在自建物流栈时成为竞争威胁。最后，相邻的城内物流平台——Porter（FY25 ₹4,300 crore，unicorn）和 Loadshare（FY24 ₹1,200
              crore）——竞争城内 B2B 运输和区域干线，但在 Shadowfax 的密度和规模下，不竞争 ecommerce 快递包裹或 quick-commerce 3PL。Shadowfax
              在这个格局中的独特位置是： 它是唯一被确认同时在 quick-commerce delivery 和 reverse pickup 上领先的 3PL 运营商（JM Financial），同时在整体快递中排名
              #2。这种多分部同时领先，是关键结构性护城河。
