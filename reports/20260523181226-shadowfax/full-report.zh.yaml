      - number: '2.2'
        title: 市场规模测算——TAM、SAM、SOM 与多视角交叉验证
        blocks:
          - type: paragraph
            body: >
              单一市场规模数字无法充分刻画 Shadowfax 的可触达机会，因为公司横跨快递包裹、本地即时 quick-commerce、D2C 直送和逆向物流——
              每个领域都有不同的分析师边界和增长率。合适的测算方法，是用多个视角对照 Shadowfax 已披露的服务结构进行交叉验证。

              最宽一层，MarkWide Research 估算印度 3PL 和物流市场在 2026 年约为 USD 47.6 billion，并将在 2035 年前以 11.4% CAGR 增长。这个口径包含非
              ecommerce 垂直（automotive、industrial、cold-chain），其中大多数 Shadowfax 目前并不覆盖，因此用于规划时会高估 TAM。

              最可比的市场规模估算，是 Mordor Intelligence 的印度 ecommerce 物流规模 USD 7.25 billion（2026），到 2031 年以 8.98% CAGR 增至 USD
              11.14 billion；以及印度国内 CEP 市场 USD 6.27 billion（2026），以 10.34% CAGR 增长。IMARC Group 对最后一公里配送市场的估算为 2025 年 USD
              7.4 billion，预计到 2034 年以 13.54% CAGR 增至 USD 24.5 billion——这是更宽口径，包含食品配送最后一公里，与 Mordor 口径部分重叠。 Mordor 估算 D2C
              物流在 2026 年为 USD 8.03 billion，也与 ecommerce 口径重叠，但凸显了 Shadowfax 正在积极扩张的快速增长直销品牌子分部。

              Quick commerce——Shadowfax 以 3PL 口径领先的分部——带来增量规模机会。Mordor Intelligence 将印度 Q-commerce 置于 2026 年 USD 3.65
              billion（到 2031 年 CAGR 12.74%）。Bain & Company 的 2026 India Shops Online 报告记录 FY25 quick-commerce GMV 为 USD
              10–11 billion，占总 eretail GMV 的 16-17%。这个宽区间（$3.65B vs $10-11B）来自不同定义：Mordor 测算 Q-commerce 服务市场（logistics +
              platform ops），Bain 测算交易总 GMV。嵌在 GMV 中的物流成本层要小得多；若 GMV 的物流成本为 8-10%，印度 Q-commerce 分部的物流部分约为 $0.8-1.0
              billion。

              自下而上的 SAM 可以这样推导：印度 ecommerce 物流（$7.25B）加上一部分 quick-commerce 物流（估算物流支出约 $0.9B），得到约 $8-9 billion
              的可触达分部。对照这个 SAM，Shadowfax 隐含 H1 FY26 收入年化（约 ₹4,200 crore ≈ ~$500M）意味着在 $7-8B SAM 中渗透率约为 6-7%——与 JM
              Financial 所称仅快递分部 23% 份额一致（快递只是更广 SAM 的一个子分部）。若把 23% 份额应用到 ecommerce 物流核心，可推得 SOM 为 $1.5-1.7B。6W
              Research（19.2% CAGR）和 MarkWide（11.4%）对相邻市场定义给出的矛盾估算，反映了真实的方法论差异， 因此作为尽调缺口保留。
