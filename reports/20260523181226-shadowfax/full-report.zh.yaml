      - number: '5.3'
        title: AI 系统、数据智能与云基础设施
        blocks:
          - type: paragraph
            body: >
              Shadowfax 已披露的自有 AI 与基础设施资产分三类：地址和位置智能、安全与欺诈防控、云基础设施。地址智能方面，公司在 July 2024 推出 SF Maps——一个使用 Siamese-network
              架构的自研人工神经网络。地址文本输入被转换为 embeddings 并存入 VectorDB；H3 geospatial indexing 用于位置微调。模型基于 1.5+ billion
              个历史配送和取件数据点训练。上线后，Shadowfax 报告客户取消 / RTO 下降 10%，客户 NPS 提升 25%。CTO 将其描述为相比 what3words
              式固定编码的根本进步，因为它接受印度自由文本地址输入，不需要客户改变习惯。

              安全与欺诈方面，按 Economic Times 报道，January 2025 推出的 SF Shield 由两个子系统组成。Track & Trace Solution 每天通过部署在分拣中心的高清
              bullet cameras 完成超过 20 million 次包裹扫描；AI engine 处理每次扫描，确认正确操作员把正确包裹扫入正确格口，并实时触发错分和误操作警报。关键运营触点每天采集超过 4
              million 张图像和视频。第二个子系统 SF Eye 针对 gig workforce 身份欺诈。Shadowfax 工程博客另行记录了 AI 自拍校验管线：它从 ResNet18 baseline（93%
              accuracy，但在嘈杂真实自拍上失败）演进到 FaceNet + 512-dimensional embeddings（96% precision），并叠加专门的 liveness detection
              model，阻断打印照片和屏幕翻拍。

              云基础设施方面，Shadowfax 发布了详尽工程文章，复盘其 AWS-to-GCP migration。平台运行微服务架构，并通过 Kafka 连接。GCP 迁移早期，团队发现一个 NAT IP 无法支撑所需的
              260,000–280,000 concurrent ports；扩展到 8 NAT IPs 解决了端口耗尽，但需要协调外部伙伴更新白名单。一次 TCP-timeout 配置错误（为释放端口从 1,200 s
              降到 30 s）导致全天故障，后续才回滚。迁移后优化包括清理 Kafka schema registry、启用 Private Google Access 让 Google API 调用走 Google
              私有骨干网（绕过 NAT），以及把服务间通信迁移至 Internal Load Balancers。这些变化让 NAT port usage 降低 38%（从 ~260,000 到
              ~160,000）。Android 配送伙伴 App 也是重要技术资产：工程团队通过 lazy loading、baseline profiles、Constraint Layout 优化和异步初始化，把
              median app start time 从 3.5 seconds 降到 750 ms（90th percentile: 1.9 s），提升 40%，服务超过 100,000 名 daily active
              users。
