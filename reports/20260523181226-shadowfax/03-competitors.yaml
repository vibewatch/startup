      - - "Blue Dart Express (NSE: BLUEDART)"
        - "Premium air+ground express; DHL subsidiary (75% owned)"
        - "FY26 revenue ₹6,141 crore; PAT ₹240 crore; 404M shipments"
        - "B2B enterprise; time-definite air express; pharmaceutical and high-value goods"
        - "Global DHL network integration; premium SLA; 60:40 air-to-ground mix; brand trust in enterprise"
