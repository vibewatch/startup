  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: nrr-grr-churn-data
      missingEvidence: >
        Shadowfax has not disclosed formal NRR, GRR, or client-level churn rates in any public filing or
        investor communication. No Shadowfax case study or client testimonial with quantified retention or
        outcome metrics is publicly available.
      whyItMatters: >
        Without NRR or GRR, it is not possible to assess whether client revenue growth is driven by genuine
        account expansion or by new client acquisition masking underlying churn. Given that top-five
        concentration is stable at 74–75%, the retention appears high, but durability cannot be confirmed.
      diligencePath: >
        Request NRR and GRR by client tier and service line in management due diligence. Request contract
        tenors and minimum volume commitments for top-5 clients. Request a customer cohort table showing
        revenue by client vintage (year of first shipment).
      relatedQuestionRefs:
        - QU015
        - QU022

    - type: missing-source
      severity: material
      topic: contract-terms-and-pricing
      missingEvidence: >
        Contract lengths, minimum volume commitments, notice periods, and repricing terms for Shadowfax's
        major enterprise clients are not disclosed in the DRHP or any investor communication. All
        relationships are described as SLA-based and terminable.
      whyItMatters: >
        Without knowing contract terms, the structural risk from Meesho or Flipkart reducing volume cannot
        be modelled. A 30-day termination right creates a very different risk profile than a 12-month
        notice period.
      diligencePath: >
        Obtain executed SLA templates and MSA for top-3 clients in due diligence. Assess penalty or
        take-or-pay provisions, if any. Map out the commercial exposure if Meesho gave 30-day notice.
      relatedQuestionRefs:
        - QU016
        - QU026

    - type: missing-source
      severity: material
      topic: sme-d2c-adoption-metrics
      missingEvidence: >
        Shadowfax 360 was launched on April 21, 2026 — less than two months before the run date. No
        adoption metrics, new merchant sign-up count, or revenue contribution data have been disclosed.
      whyItMatters: >
        The diversification narrative depends on Shadowfax 360 successfully onboarding SME and D2C clients
        at scale. Without adoption data, the timeline for meaningful concentration dilution is unknown.
      diligencePath: >
        Request 90-day post-launch merchant sign-up data, active shipping merchants, and revenue from
        Shadowfax 360 in due diligence. Track quarterly investor presentation disclosures for FY27.
      relatedQuestionRefs:
        - QU020

    - type: private-evidence-only
      severity: material
      topic: client-level-revenue-breakdown
      relatedTableRefs:
        - TU003
      missingEvidence: >
        Individual revenue contributions are disclosed only for Meesho (~49%) and the Flipkart group
        (~12%). The revenue contributions of Zepto, Blinkit, Swiggy, Myntra, Nykaa, Zomato, and other
        named clients are not individually disclosed in the RHP or any investor communication.
      whyItMatters: >
        Without per-client revenue visibility, it is not possible to model the revenue impact of losing
        any client other than Meesho. The top-5 minus Meesho and Flipkart collectively represent
        approximately 13% of revenue, but their identities and individual sizes are unknown.
      diligencePath: >
        Request full client revenue breakdown for top-10 clients in due diligence data room. Cross-reference
        with Redseer market-share data per service line.
      relatedQuestionRefs:
        - QU008
        - QU009
        - QU010
