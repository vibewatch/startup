company:
  name: Shadowfax
chapter:
  number: 6
  title: Customers
  summary: >
    Shadowfax's customer base is concentrated among India's largest ecommerce and quick-commerce platforms.
    The prospectus names Meesho, Flipkart, Myntra, Swiggy, BigBasket, Zepto, Nykaa, Blinkit, Zomato, and Uber
    as clients; the largest client (Meesho) contributed approximately 48.9% of H1 FY26 operating revenue and
    the top five collectively 74.1%, creating extreme single-client and top-cohort exposure. Express parcel
    generated 69% of H1 FY26 revenue (₹1,238.7 crore), hyperlocal 20% (₹359.3 crore), and other logistics
    11% (₹207.5 crore). Adoption has been rapid: 3PL ecommerce market share grew from 8% in FY22 to 23% in
    H1 FY26, total revenue expanded from ₹1,415 crore in FY23 to ₹4,202 crore in FY26, and express shipment
    volumes grew from 302 million in FY23 to 536 million in FY25. The company does not disclose formal NRR or
    GRR; top-five revenue concentration has been stable at 74–75% across reporting periods, suggesting client
    retention is high but upsell evidence is volume-driven rather than price-driven. Key risks are Meesho
    insourcing via its Valmo platform (outsourcing share collapsed from 98.2% in FY23 to 35.5% in H1 FY26),
    the absence of long-term contracts, and a 9% IPO listing discount driven by investor concern over
    concentration. Diversification efforts include the April 2026 Shadowfax 360 SME portal, CriticaLog
    (₹130 crore ARR), Prime Large heavy parcel (₹60 crore ARR), and a dark-store infrastructure play.

sections:
  - id: customer-base-segmentation
    title: Customer base segmentation
    body: >
      Shadowfax serves customers across five distinct segments anchored by enterprise ecommerce platforms.
      The first and dominant segment is large horizontal ecommerce, primarily Meesho and Flipkart, which
      together drive the majority of express-parcel and reverse-logistics volumes. Meesho alone contributed
      approximately 48.9% of H1 FY26 operating revenue per the ICICI Securities initiating coverage report,
      making it by far the largest single revenue anchor. Flipkart group entities (Instakart Services and
      Flipkart Internet) are the second largest account. Both clients use Shadowfax across express forward,
      reverse pickup, and value-added services. The second segment is quick commerce and hyperlocal delivery,
      which generated 20% of H1 FY26 revenue (₹359.3 crore, up 82.5% year-on-year). Quick-commerce clients
      include Zepto, Blinkit, Swiggy Instamart, BigBasket (Tata), and Flipkart Minutes; ICICI Securities
      confirms Shadowfax is the market leader in 3PL quick-commerce solutions by order volume per Redseer.
      The third segment is fashion and beauty ecommerce — Myntra (Flipkart Group) for fashion and Nykaa for
      beauty — where Shadowfax handles express and same-day forward delivery as well as returns. The fourth
      segment is food delivery and mobility platforms (Zomato, Swiggy, Uber), which use the Shadowfax
      two-wheeler fleet network; Shadowfax is the only large-scale 3PL to offer a two-wheeler fleet to
      online mobility platforms per the Economic Times. The fifth and fastest-growing segment is SMEs and
      D2C brands, targeted via Shadowfax 360 (launched April 21, 2026), which offers no-minimum-order
      commitment, flat-rate billing, and one-click Shopify and WooCommerce integrations for online-first
      sellers transitioning from marketplace models to owned-channel commerce. An emerging sixth adjacency is
      critical logistics B2B through CriticaLog (healthcare, automotive, luxury, IT high-value shipments)
      generating ₹130 crore ARR as of Q4 FY26. Additional named clients include ONDC, Magicpin, Licious,
      Purplle, Kartrocket, Pincode, and Uber, expanding the mix beyond the top-five concentration cohort.
