callouts:
  - calloutType: strength
    title: RHP-Grade Named Client Proof with Stable Concentration
    body: >
      The Shadowfax Red Herring Prospectus provides regulatory-grade named client proof — naming 16+ enterprise
      clients including Meesho, Flipkart, Myntra, Swiggy, Zepto, Blinkit, Nykaa, and Zomato with individual
      or group revenue percentages. The top-five concentration band has been stable at 74–75% across three
      consecutive periods, signalling that these clients are not churning. Express order volumes grew 50%
      year-on-year in H1 FY26 and the average yield per order improved from ₹49 to ₹54, together suggesting
      the enterprise client base is both growing and becoming more revenue-efficient.
    claimRefs:
      - CU019
      - CU020
      - CU031
      - CU017

  - calloutType: risk
    title: Meesho Concentration and Valmo Insourcing — Critical Structural Risk
    body: >
      Meesho's approximately 49% revenue share is the single most material customer risk. Meesho is actively
      insourcing via its Valmo platform: outsourced volume share fell from 98.2% in FY23 to 35.5% in H1 FY26.
      Even as the revenue share has remained stable, this means Shadowfax is doing a smaller fraction of
      Meesho's total logistics volume. Ecom Express, which faced an analogous Meesho dependency, entered
      financial distress when Meesho shifted volume; it was sold to Delhivery at a 78% discount to prior
      valuation. ICICI's bear-case scenario explicitly models a Meesho demand slowdown as the primary
      downside. Investor concern was confirmed by the 9% listing discount on January 28, 2026.
    claimRefs:
      - CU037
      - CU038
      - CU039
      - CU045

