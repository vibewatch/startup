      - - Technology and Cloud
        - Cloud infrastructure (provider undisclosed); SF Shield AI
        - 'Weak: no multi-cloud or BCP RTO disclosed'
        - Dispatch system outage exceeding 8 hours causing more than 1M shipment SLA breach
        - Real-time system monitoring; annual DR test disclosure expected
      - - People and Execution
        - Founder equity retention; promoter lock-up; competitive compensation
        - 'Partial: no succession plans disclosed for any co-founder'
        - Loss of any 2 of 4 co-founders within 12 months
        - Monitor SEBI filing disclosures; board meeting minutes
      - - Financial and Leverage
        - INR 1120 crore post-IPO cash; asset-light model reduces capex
        - Adequate for approximately 8 months of operating burn at current run-rate
        - EBITDA margin falling below 2% for 2 consecutive quarters
        - Quarterly P&L; working capital cycle analysis
      - - Franchisee and Partner
        - Code of conduct; franchisee agreements; consumer redress mechanism
        - 'Weak: franchise scam incidents reported; short-term contracts'
        - Loss of more than 20% of franchisee count in any 2-quarter window
        - Monthly franchisee census; consumer complaint rate tracking
    notes: >
      Thesis-break triggers are designed to be observable from public disclosures including SEBI
      LODR filings quarterly results press releases and regulatory order databases. Mitigation
      adequacy is assessed relative to the magnitude of the underlying risk not absolute best
      practice.

