    - id: CE005
      statement: >
        Prime Large is a premium heavy-parcel tier active across approximately 6,000 PIN codes as of Q4 FY26, with ₹60
        crore ARR on a Q4 FY26 annualised basis. Management guided expansion to 10,000 PIN codes by end FY27.
      type: company-claimed
      topic: prime-large-module
      sourceRefs:
        - SE007
      confidence: medium
      freshness: current
      answersQuestionRefs:
        - QE012

    - id: CE006
      statement: >
        Dark store operations under Shadowfax management yield monthly revenue of ₹8–15 lakh per store at top-performing
        sites, >20% gross margin at top stores, and a 3–4 month payback per management. Network reach covers 2,500+ cities
        and 15,000+ PIN codes; the company operates 53+ sort centres within 3.5 million+ sq ft of leased space and
        4,299+ operational touchpoints.
      type: company-claimed
      topic: dark-store-network-infrastructure
      sourceRefs:
        - SE001
        - SE007
      confidence: medium
      freshness: current
      answersQuestionRefs:
        - QE014
        - QE023

    - id: CE007
      statement: >
        Shadowfax 360 was launched on April 21, 2026 via a SEBI LODR Regulation 30 exchange disclosure, confirmed by
        Company Secretary Krishnakanth Venkata Gangavarapu. The portal provides SMEs and D2C brands with immediate access
        to 15,000+ PIN codes, flat-rate billing, AI RTO predictor, and fastest COD remittance cycles, with no minimum
        order commitment.
      type: observed
      topic: shadowfax-360-launch
      sourceRefs:
        - SE002
        - SE007
        - SE008
        - SE009
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QE002
        - QE018

    - id: CE008
      statement: >
        The Shadowfax 360 portal enables one-click integration with Shopify and WooCommerce, provides a self-serve
        onboarding flow (registration and first shipment in minutes), and targets SMEs and D2C brands that have been
        excluded from enterprise logistics due to minimum-volume requirements. The press release quotes CBO Praharsh
        Chandra describing it as a "significant lever to help us scale our business and diversify our merchant base."
      type: observed
      topic: shadowfax-360-features
      sourceRefs:
        - SE002
        - SE007
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QE002
        - QE008

    - id: CE009
      statement: >
        Shadowfax's fulfilment workflow is API-mediated: enterprise clients integrate via REST API; the OMS validates
        PIN-code serviceability and assigns a delivery partner. The Android Super App delivers the job. For express,
        the parcel is inducted at a sort centre, linehaul-transported, and dispatched for AI-navigated last-mile delivery
        with GPS tracking every 5 seconds while the partner is on-platform.
      type: observed
      topic: delivery-workflow
      sourceRefs:
        - SE001
        - SE004
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QE001
        - QE013

