      statement: >
        The Shadowfax AI in Logistics blog states route-optimisation AI reduces fuel costs by 10–15% and delivery
        times by 20–25%; demand forecasting allows advance rider deployment during demand spikes (sales festivals,
        monsoon, etc.). These are company-stated outcome ranges, not independently audited figures.
      type: company-claimed
