      - Primary User / Buyer
      - Status / Maturity
      - Differentiation
      - Diligence Gap
    rows:
      - - Express Parcel (Forward)
        - Large ecommerce platforms (Flipkart, Meesho), D2C brands, online retailers
        - Production / GA — dominant at ~69% of H1 FY26 revenue; 10+ years of operation
        - 15,000+ PIN-code reach; SF Maps AI navigation; SF Shield fraud detection; same-day and next-day SLAs
        - Undisclosed per-client SLA breach rates; pricing leverage held by top 5 clients (74.6% FY25 revenue)
      - - Hyperlocal / Quick Commerce
        - Quick-commerce platforms (Zepto, Blinkit, Instamart), food/grocery apps
        - Production / GA — ~20% of H1 FY26 revenue; 82.5% YoY growth H1 FY26
        - Sub-2-hour SLA at scale; dark-store-to-door last mile; company claims 3PL market leadership by volume
        - No sort-centre SF Shield scan in hyperlocal loop; per-order margin undisclosed; captive fleet competition
      - - Reverse Logistics
        - Ecommerce platforms and D2C brands managing RTOs and exchange returns
        - Production / GA — included in express revenue; company claims volume market leadership
        - Open-box doorstep and hub-based QC; API-customisable quality parameters; real-time visibility
        - RTO rate by client/category not disclosed; quality-check cost line (6.1% of Q4 revenue) partially opaque
      - - CriticaLog (Critical Logistics)
        - B2B enterprises in healthcare, automotive, luxury goods, IT supply chain
        - GA post-acquisition — ₹130 crore ARR basis Q4 FY26; wholly owned subsidiary since 2025
