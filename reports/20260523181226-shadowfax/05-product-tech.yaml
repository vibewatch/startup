  - id: trust-compliance-roadmap
    title: Trust, safety, compliance framework, and product roadmap
    body: >
      Shadowfax's trust and compliance framework is built primarily around its proprietary AI security
      stack rather than industry certifications. The daily selfie check-in for delivery partners is the
      most visible element: every delivery partner must submit a live selfie at shift start, which the
      AI pipeline validates in real time against the onboarding reference photo using FaceNet embeddings
      and a liveness model. This is supplemented by the SF Eye subsystem within SF Shield, which
      monitors rider identity at sort centres through geospatial algorithms and neural network video
      analytics, preventing impersonation at induction and dispatch points. The Track & Trace subsystem
      adds a second layer: over 20 million daily barcode scans at sort centres with AI anomaly detection
      for misrouting, mishandling, and theft risk. Geo-location is continuously captured (every 5 seconds
      while the partner is active on the platform), and all personal data transmitted through the delivery
      partner app is encrypted in transit per the Google Play privacy policy disclosure.

      On listing-related compliance, Shadowfax is bound by SEBI Listing Obligations and Disclosure
      Requirements (LODR) regulations as a publicly listed entity on NSE (SHADOWFAX) and BSE (544685).
      The April 21, 2026 Shadowfax 360 launch was disclosed under Regulation 30 of SEBI LODR, filed by
      the Company Secretary. There are no publicly disclosed ISO 27001, SOC 2, PCI-DSS, or sector-specific
      logistics certifications on the company's public-facing pages. The innovation page does not reference
      formal data-privacy certifications; the company does not operate in a regulated healthcare or
      financial-services vertical that would mandate external audits, though CriticaLog's healthcare and
      IT-supply-chain verticals may surface compliance gaps if expanded.

      The product roadmap as of May 2026, assembled from exchange disclosures and management commentary,
      includes: completion of Shadowfax 360 merchant onboarding at scale (ongoing from April 2026
      launch); expansion of Prime Large heavy-parcel service from 6,000 to 10,000 pin codes by end
      FY27; full integration of CriticaLog's operational systems and route optimisation into the core
      platform; continued capex of ₹180–190 crore in FY27 directed at sort centre automation and
      last-mile infrastructure; and an intent (disclosed in a Shadowfax AI blog) to move toward
      agentic AI that autonomously handles disruptions, rerouting, and rate adjustments without human
      intervention. No public API changelog or release cadence is published that would allow independent
      verification of software release velocity.
