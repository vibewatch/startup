    - id: CE015
      statement: >
        Shadowfax's AI RTO Predictor uses machine learning to flag high-risk return-to-origin orders before dispatch,
        allowing pre-dispatch intervention. This feature is embedded in both the core platform and Shadowfax 360 as a
        merchant-facing RTO reduction tool.
      type: observed
      topic: ai-rto-predictor
      sourceRefs:
        - SE002
        - SE008
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QE013

    - id: CE016
      statement: >
        SF Maps (launched July 2024) is an in-house ANN-based address intelligence system using a Siamese-network
        architecture. Address text is converted to embeddings stored in a VectorDB; H3 geospatial indexing fine-tunes
        location intelligence. The model is trained on 1.5+ billion historical Shadowfax delivery and pickup data points.
        Since launch, the company reports a 10% reduction in RTOs / customer cancellations and a 25% improvement in
        customer NPS. Precision reported is >90% within 100 metres of the intended destination.
      type: observed
      topic: sf-maps-architecture
      sourceRefs:
        - SE013
        - SE001
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QE004
        - QE022

    - id: CE017
      statement: >
        The SF Maps system is differentiated from global addressing solutions (what3words, Google Plus Codes) because
        it accepts free-text Indian address input without requiring customers to adopt a new coding system. The CTO
        (Vaibhav Khandelwal) described this as fundamental to solving the last-mile navigation problem in India. The
        company has stated an intent to make the AI model generally available for research.
      type: observed
      topic: sf-maps-differentiation
      sourceRefs:
        - SE013
        - SE006
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QE004
        - QE016

    - id: CE018
      statement: >
        SF Shield was launched in January 2025 per Economic Times coverage. It combines two subsystems: (1) Track &
        Trace — an in-house AI surveillance network integrated with the OMS, performing over 20 million package
        scans per day using HD bullet cameras at sort centres, capturing 4+ million images and videos daily, with
        real-time alerts for misrouting and mishandling; and (2) SF Eye — identity verification at sort centres to
        prevent rider impersonation and account misuse.
      type: observed
      topic: sf-shield-architecture
      sourceRefs:
