      sourceRefs:
        - SE006
        - SE022
      confidence: medium
      freshness: current
      answersQuestionRefs:
        - QE015

    - id: CE013
      statement: >
        The Shadowfax innovation page lists six core technology capabilities: demand forecasting (API-driven supply-demand
        alignment); efficient misrouting solutions (tech-enabled reverse logistics with hub-based API QC); route
        optimisation (intelligent fleet management); reverse parcel pickup; API live tracking; and zone tracking
        (live geo-tracking and geofencing for accurate delivery).
      type: observed
      topic: innovation-page-capabilities
      sourceRefs:
        - SE001
        - SE022
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QE015

