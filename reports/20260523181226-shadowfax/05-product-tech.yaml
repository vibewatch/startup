  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: third-party-certifications
      missingEvidence: >
        No SOC 2 Type II, ISO 27001, or PCI-DSS certification was found in any public source. As Shadowfax
        handles consumer personal data (name, phone, address, payment) for millions of enterprise clients,
        the absence of third-party security certifications is a material gap for regulated-industry enterprise
        procurement.
      whyItMatters: >
        CriticaLog serves healthcare and IT verticals that typically require supplier security certifications.
        Shadowfax 360 onboards D2C brands who handle consumer PII. The missing certifications may be a
        procurement blocker in regulated segments and a reputational risk in the event of a breach.
      diligencePath: >
        Request ISO 27001 certificate (if held) or most recent SOC 2 Type II audit report from management.
        Check whether CriticaLog's healthcare contracts require HIPAA or equivalent compliance.
      relatedQuestionRefs:
        - QE010

    - type: unverifiable-claim
      severity: moderate
      topic: ai-performance-metrics
      missingEvidence: >
        All AI performance claims (SF Maps: 10% RTO reduction, 25% NPS improvement, >90% within-100m accuracy;
        selfie validation: 96% precision; route optimisation: 20–25% faster delivery times) are company-disclosed
        only. No independent third-party benchmark, academic publication, or customer-corroborated audit has been
        located.
      whyItMatters: >
        If AI performance claims are overstated, the technology differentiation narrative weakens and the data-moat
        argument becomes less defensible versus competitors deploying third-party AI tools.
      diligencePath: >
        Request customer-level data on pre/post RTO rates for a sample of Shadowfax 360 and enterprise clients.
        Ask for independent delivery-partner app uptime and performance audit data.
      relatedQuestionRefs:
        - QE022

    - type: private-evidence-only
      severity: moderate
      topic: sla-breach-and-uptime-data
      missingEvidence: >
        Shadowfax publishes no SLA breach rates, uptime statistics, or service-level performance reports. The only
        documented outage is the GCP migration TCP-timeout incident (full-day, 2025). Delivery reliability at 22.6
        crore quarterly orders is not independently verified beyond management-claimed order counts.
      whyItMatters: >
        Enterprise clients negotiate SLA-based contracts; undisclosed breach rates prevent assessment of contractual
        liability exposure and true delivery-quality benchmarking versus competitors.
      diligencePath: >
        Request SLA breach reports by client tier and service line, covering at least FY26. Review any
        material adverse event disclosures in the RHP risk factors related to delivery failure.
      relatedQuestionRefs:
        - QE021
        - QE025

    - type: unverifiable-claim
      severity: low
      topic: woocommerce-integration
      missingEvidence: >
        WooCommerce integration is disclosed in the Shadowfax 360 press release but no independent plugin page,
        WooCommerce.com listing, or developer documentation was found. The integration may exist but is not publicly
