  - id: developer-ecosystem-integrations
    title: Developer ecosystem, API surface, and merchant integrations
    body: >
      Shadowfax exposes a REST API to enterprise clients and shipping partners that covers order creation
      and fulfilment, real-time status and tracking via webhooks, label generation, reverse-pickup
      initiation, and COD management. The API uses token-based authentication (Bearer Token / API key)
      and supports a sandbox environment for pre-production testing. APITracker lists Shadowfax as
      offering webhooks and a developer API but does not confirm public OpenAPI/Swagger specs, an OAuth
      playground, or a publicly downloadable SDK — all of which are listed as absent on the tracker
      profile. A Postman public collection (workspace ID 9ba9v71) exists and is cited by third-party
      integration guides, confirming that at least a developer-contributed API collection is accessible
      through Postman's network.

      The Shadowfax Logistics Platform is listed on the Shopify App Store (app slug shadowfax-order-app)
      and grants access to customer data (name, email, phone, physical address), product and inventory
      data, and all order history including returns and third-party fulfilment. The app enables
      end-to-end workflow automation from Shopify order import to shipment creation, tracking updates,
      and return handling. Third-party integration documentation (Parcelmind) describes the integration
      flow: Shopify order placement triggers an API call to Shadowfax order-creation endpoint, with
      tracking webhooks pushing status updates back. WooCommerce integration is disclosed in the
      Shadowfax 360 press release as a one-click option alongside Shopify; no WooCommerce plugin page
      was independently located.

      The delivery partner Super App (Android package in.shadowfax.gandalf) is the primary field
      interface for the 259,609+ active delivery partners. As of May 2026, version 25.7.3 is the latest
      release, sized at approximately 32.8 MB, requiring Android 5.1+. Google Play lists 9 million+
      downloads and a 4.1/5 rating from 200,000+ reviews. The app supports multiple earning streams in
      a single interface — food and grocery delivery, express parcel, bike taxi, and 10-minute
      quick-commerce — making it a multi-service "Super App" for the gig workforce. AppBrain data
      confirms the app as active with continuous updates. User reviews on Google Play mention occasional
      order-allocation inconsistencies and customer-support responsiveness gaps, which represent an
      adverse developer/partner signal on operational reliability at scale.
