  claims:
    - id: CE001
      statement: >
        Shadowfax operates six distinct product service lines as of May 2026: Express Parcel (forward B2C and D2C);
        Hyperlocal / Quick Commerce; Reverse Logistics; CriticaLog (critical goods, acquired 2025); Shadowfax 360
        (SME/D2C self-serve portal, launched April 21, 2026); and Prime Large (heavy-parcel premium tier). Dark store
        management operates as a sub-service under the hyperlocal and quick-commerce lines.
      type: observed
      topic: product-portfolio
      sourceRefs:
        - SE002
        - SE007
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QE001

    - id: CE002
      statement: >
        Express parcel was approximately 69% of H1 FY26 operating revenue per the DRHP; hyperlocal / quick commerce
        contributed approximately 20%. As of Q4 FY26, express revenue was ₹925 crore (+120.8% YoY) and hyperlocal
        was ₹232 crore (+32.1% YoY).
      type: observed
      topic: service-line-revenue-mix
      sourceRefs:
        - SE002
        - SE007
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QE001

    - id: CE003
      statement: >
        Reverse logistics is included in Shadowfax's express segment and is served through doorstep and hub-based
        quality checks with API-configurable QC parameters. The innovation page explicitly lists reverse-parcel pickup
        as a technology capability with open-box and hub-based options.
      type: observed
      topic: reverse-logistics
      sourceRefs:
        - SE001
        - SE007
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QE013

    - id: CE004
      statement: >
        CriticaLog was acquired as a wholly-owned subsidiary by Shadowfax in 2025. As of Q4 FY26 management commentary,
        CriticaLog contributed approximately ₹130 crore on an ARR basis. It serves healthcare, automotive, luxury goods,
        and IT supply chain verticals with white-glove and specialised-security handling.
      type: observed
      topic: criticalog-module
      sourceRefs:
        - SE020
        - SE021
      confidence: high
      freshness: current
      answersQuestionRefs:
