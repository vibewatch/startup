        - Self-serve onboarding in minutes; no minimum order; flat-rate billing; Shopify / WooCommerce one-click
        - Revenue contribution in FY27 not yet disclosed; scalability of customer support for long-tail SMEs untested
      - - Prime Large (Heavy Parcel)
        - Ecommerce platforms and brands shipping heavy or volumetric goods
        - Early GA — ₹60 crore ARR basis Q4 FY26; ~6,000 pin-code coverage
        - Premium pricing tier for volumetric/oversize parcels; white-glove handling option per management
        - Coverage limited; unit economics and per-shipment pricing not publicly disclosed
