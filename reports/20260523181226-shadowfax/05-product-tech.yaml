company:
  name: Shadowfax
chapter:
  number: 5
  title: Product & Technology
  summary: >
    Shadowfax operates a cloud-native logistics platform that spans express parcel delivery, hyperlocal
    quick-commerce, reverse logistics, critical-goods delivery (via CriticaLog), and dark-store fulfilment.
    The technology stack runs on Google Cloud Platform (migrated from AWS in 2025) and is structured as
    microservices connected through Kafka; it includes proprietary AI systems — SF Maps (address
    intelligence trained on 1.5 billion data points, >90% accuracy within 100 m), SF Shield (20 million
    daily package scans with AI video analytics), and an AI selfie-validation pipeline using FaceNet
    512-dimensional embeddings that achieves 96% precision for rider identity verification. The delivery
    partner Super App (Android v25.7.3, 9 million+ downloads, 4.1/5 rating with 200K+ reviews) and the
    April 2026 Shadowfax 360 self-serve portal for SMEs and D2C brands are the primary demand-side
    interfaces. API-first design enables one-click integrations with Shopify and WooCommerce; a Postman
    collection is publicly documented. The platform's stated technical differentiation lies in its
    proprietary address-intelligence model, its layered fraud-prevention framework, and its GCP-native
    microservices architecture deployed across 53+ leased sort centres and 3.5 million+ square feet of
    operational space. Key diligence gaps are undisclosed SLA breach rates, absence of third-party
    certifications (SOC 2, ISO 27001), architecture documentation limited to company blog posts, and
    roadmap targets that are management-stated rather than independently verified.

sections:
  - id: platform-portfolio-overview
    title: Platform service portfolio and product module map
    body: >
      Shadowfax operates what it publicly describes as an Indian logistics platform with six distinct
      product lines accessible to clients through a unified API and, since April 2026, through the
      Shadowfax 360 self-serve portal. The core service lines are: (1) Express parcel — forward B2C and
      D2C shipments with next-day and same-day SLAs, the largest segment at approximately 69% of H1 FY26
      operating revenue per the DRHP; (2) Hyperlocal / quick commerce — sub-two-hour on-demand delivery
      for food, grocery, and pharmaceutical clients including Flipkart, Zepto, Zomato, Swiggy, BigBasket,
      and Nykaa, contributing approximately 20% of H1 FY26 revenue; (3) Reverse logistics — doorstep
      and hub-based pickups with API-led quality checks (open-box, hand-in-hand exchange), which the
      company claims to lead by reverse-pickup order volume; (4) Critical logistics (CriticaLog) —
      acquired as a wholly-owned subsidiary in 2025, specialising in high-value, time-critical and
      white-glove B2B shipments in healthcare, automotive, luxury goods, and IT, with ₹130 crore ARR
      as of Q4 FY26; (5) Prime Large — a premium heavy-parcel tier covering volumetric and oversized
      goods, live across approximately 6,000 pin codes as of Q4 FY26 with ₹60 crore ARR; and (6) Dark
      store operations — Shadowfax-managed fulfillment nodes for quick-commerce clients, generating
      ₹8–15 lakh monthly revenue per store at top-performing sites with >20% gross margin per management.
      Shadowfax 360, launched via SEBI exchange disclosure on April 21, 2026, is a self-serve shipping
      portal targeting SMEs and D2C brands; it layers flat-rate transparent billing, no-minimum-order
      commitment, AI-driven RTO prediction, and one-click Shopify and WooCommerce integrations on top
      of the same enterprise-grade network. The innovation page on shadowfax.in lists the core technology
      capabilities underpinning all service lines: demand forecasting, route optimisation, API-live
      tracking, reverse-logistics quality checks, and zone geo-tracking. Network reach disclosed as of
      May 2026 is 15,000+ PIN codes across 2,500+ cities, served by 259,609 average quarterly
      transacting delivery partners operating from 53+ leased sort centres and 4,299+ operational
      touchpoints within 3.5 million+ square feet of leased space.
