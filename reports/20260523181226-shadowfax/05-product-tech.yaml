  - id: delivery-workflow-operating-model
    title: Delivery management and operating workflow
    body: >
      Shadowfax's fulfilment workflow is an API-mediated, asset-light loop. An enterprise client or
      Shadowfax 360 merchant places a shipment request via REST API or the 360 portal; the order
      management system (OMS) validates the PIN-code serviceability and assigns a pick-up slot. A
      delivery partner receives the job through the Android Super App; the app displays route-optimised
      navigation powered by SF Maps, which uses a deep-learning address model trained on 1.5+ billion
      past deliveries to resolve unstructured Indian address inputs to lat/long within 100 metres of
      the destination. For express parcels, the shipment is inducted at a sort centre where AI-powered
      cameras (SF Shield Track & Trace) scan the package barcode and verify the handler identity against
      a whitelist using facial recognition; misrouting alerts are triggered in real time. The parcel is
      linehaul-transported to the destination sort centre (Shadowfax uses third-party linehaul as an
      asset-light model), re-inducted, and dispatched for last-mile delivery. The delivery partner's
      GPS location is captured every five seconds while on the platform. At the doorstep, the partner
      must authenticate with a daily selfie; the AI selfie-validation system matches the live capture
      against the onboarded photo using FaceNet 512-D embeddings and a liveness model to block spoofing.
      Cash on Delivery collections are batched into COD remittance cycles that Shadowfax markets as the
      fastest in the industry. For reverse pickups, the partner conducts an open-box quality check at
      the customer doorstep or a hub-based inspection, with customisable QC parameters per client.
      Hyperlocal orders follow a shorter loop: the partner receives the order from a dark store or
      merchant location, picks it up, and delivers within the SLA window; this segment operates without
      a sort centre mid-step, reducing latency but also removing the SF Shield scan checkpoint. The
      platform also exposes a WhatsApp-based conversational bot that collects address confirmation from
      customers and feeds corrections into the SF Maps real-time training loop.
