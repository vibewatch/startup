  - id: FE002
    title: Shadowfax Express Parcel Delivery Workflow — Order to Doorstep
    type: flow
    layout: standard
    summary: >
      End-to-end flow of a standard express parcel from enterprise client order placement through
      sort-centre induction, mid-mile transport, and AI-verified last-mile delivery, including
      COD collection and reverse-logistics path.
    data:
      nodes:
        - id: order-placement
          label: 'Client / merchant places order via REST API or Shadowfax 360 portal'
        - id: oms-routing
          label: 'OMS validates PIN-code serviceability; assigns pickup partner; generates label'
        - id: sf-maps-resolve
          label: 'SF Maps resolves delivery address: ANN model + H3 geospatial indexing; WhatsApp bot confirms if needed'
        - id: pickup-partner
          label: 'Delivery partner accepts pickup job on Android Super App; daily selfie check validated'
        - id: sort-centre-induction
          label: 'Package inducted at origin sort centre; SF Shield scans barcode; AI verifies handler identity (SF Eye)'
        - id: mid-mile
          label: 'Third-party linehaul transports parcel to destination sort centre'
        - id: dest-sort-centre
          label: 'Package scanned at destination sort centre; AI re-verifies; delivery partner dispatched'
        - id: last-mile
          label: 'Delivery partner navigates to doorstep via SF Maps; GPS tracked every 5 seconds'
        - id: delivery-attempt
          label: 'Doorstep delivery: customer confirmation; COD collection if applicable; delivery confirmation'
        - id: cod-remittance
          label: 'COD amount batch-remitted to merchant (Shadowfax claims fastest industry cycle)'
        - id: rto-path
          label: 'Failed delivery: AI RTO predictor flags high-risk orders pre-dispatch; return-to-origin triggered'
        - id: reverse-pickup
          label: 'Reverse pickup: partner conducts open-box QC at doorstep; item returned to sort centre'
      edges:
        - from: order-placement
          to: oms-routing
          label: API call triggers OMS order creation
        - from: oms-routing
          to: sf-maps-resolve
          label: Address normalisation before partner assignment
        - from: oms-routing
          to: pickup-partner
          label: Job dispatched to nearest available verified partner
        - from: pickup-partner
          to: sort-centre-induction
          label: Partner collects shipment and delivers to sort centre
        - from: sort-centre-induction
          to: mid-mile
          label: Sorted and inducted into linehaul
        - from: mid-mile
          to: dest-sort-centre
          label: Intercity transport via third-party carrier
        - from: dest-sort-centre
          to: last-mile
          label: Last-mile partner dispatched with route optimisation
        - from: last-mile
          to: delivery-attempt
          label: Doorstep delivery attempt
        - from: delivery-attempt
          to: cod-remittance
          label: COD collected and batched for remittance
        - from: delivery-attempt
          to: rto-path
          label: Failed delivery triggers return workflow
        - from: rto-path
          to: reverse-pickup
          label: Reverse pickup initiated; open-box QC performed
    approximationNotes: >
      Workflow is reconstructed from the Shadowfax innovation page, engineering blog posts (SF Maps, selfie validation,
      SF Shield), and the Shadowfax 360 press release. The hyperlocal loop is shorter — no sort-centre induction or
      mid-mile step; partner picks up from dark store and delivers directly. CriticaLog critical-shipment workflow may
      differ in handler verification and security protocols; details are not publicly documented.
    claimRefs:
