  - id: TE003
    title: Technology and Operating Architecture Table — Shadowfax
    columns:
      - Layer / Component
      - Role
      - Dependency
      - Known Risk
    rows:
      - - Order Management System (OMS)
        - Central routing and assignment engine; receives API orders; triggers SF Maps address resolution; allocates partner
        - Google Cloud Platform (GCP); internal microservices via Kafka; client REST API
        - Single point of orchestration; GCP outage or NAT misconfiguration caused full-day outage in 2025 migration
      - - SF Maps (Address Intelligence)
        - ANN / Siamese-network embedding model; resolves free-text Indian address to lat/long via VectorDB + H3 indexing
        - GCP inference infrastructure; 1.5B historical delivery data points; WhatsApp bot for address correction input
        - Model accuracy degradation if data distribution shifts (new cities, address formats); WhatsApp API dependency
      - - SF Shield — Track & Trace
        - 20M+ daily barcode scans at sort centres; HD camera AI verifies handler-package-bin match; real-time alerts
        - In-house surveillance infrastructure; AI video processing pipeline; integration with OMS
        - Surveillance hardware capex and maintenance; AI model drift if employee appearance changes; no third-party audit
      - - SF Shield — SF Eye (Rider Identity)
        - Facial recognition and geospatial AI at sort centres; prevents impersonation and account misuse in gig workforce
        - Daily selfie validation backend; FaceNet 512-D embeddings; liveness detection model
        - Performance under adversarial conditions (masks, extreme lighting) not publicly benchmarked
      - - AI Selfie Validation Pipeline
        - 'Daily rider check-in — live selfie matched against onboarding photo; liveness check blocks spoofing'
        - FaceNet model; 512-D embedding database; liveness detection (lightweight model post-ResNet18 iteration)
        - 96% precision reported by company; false-positive rate (genuine rider blocked) not disclosed
      - - Delivery Partner Super App (Android)
        - Route guidance, order acceptance, earnings dashboard, multi-category job management for 259,609+ partners
        - GCP backend APIs; GPS; SF Maps navigation; real-time OMS connection
        - App version 25.7.3; Android 5.1+ required; 200K+ reviews note occasional order-allocation issues
      - - Kafka Messaging Bus
        - Async inter-service communication; decouples OMS, tracking, and notification services
        - GCP Pub/Sub or self-managed Kafka cluster (blog indicates Kafka schema registry was a NAT port consumer)
        - Schema registry cleanup required during migration; stale connections elevated NAT port usage
      - - GCP Cloud Infrastructure (post-AWS migration)
        - Compute, networking (8 NAT IPs), Private Google Access for Google APIs, Internal Load Balancers
        - Google Cloud Platform; 8 external NAT IPs (external whitelisting dependency across all client/partner firewalls)
        - TCP timeout misconfiguration caused full-day outage in 2025; 8-IP whitelisting creates coordination overhead
      - - Sort Centre Network
        - Physical induction, sort, and dispatch nodes; SF Shield cameras installed; linehaul handoff point
        - 53+ leased facilities; 3.5M+ sq ft; all leases — zero owned infrastructure
        - '100% leased model — lease non-renewal or rent escalation is a direct capacity risk'
      - - Linehaul Transport
        - Inter-city parcel movement between sort centres; third-party carriers; asset-light model
        - Third-party trucking vendors; no owned linehaul fleet
        - Service quality and on-time delivery depend on third-party reliability; no disclosed fallback SLA
