      statement: >
        Shadowfax markets its COD remittance cycle as the fastest in the industry; this is disclosed as a feature
        of both the core platform and Shadowfax 360. COD remittance is an important cash-flow benefit for SME sellers
        on cash-heavy Indian markets. No independent benchmark of Shadowfax's COD cycle versus peers was located.
      type: company-claimed
      topic: cod-remittance
      sourceRefs:
        - SE002
        - SE008
      confidence: medium
      freshness: current
      answersQuestionRefs:
