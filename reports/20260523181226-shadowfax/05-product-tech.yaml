callouts:
  - calloutType: strength
    title: Proprietary AI stack (SF Maps, SF Shield, selfie validation) is technically documented and operationally proven
    body: >
      Unlike most Indian logistics 3PLs that rely on third-party address and routing tools, Shadowfax has published detailed
      engineering accounts of in-house AI systems: SF Maps (1.5 billion data points, >90% within-100m accuracy, 10% RTO
      reduction), SF Shield (20 million daily scans, neural-network video analytics), and the selfie-validation pipeline
      (FaceNet 512-D, 96% precision, liveness detection). These are not marketing claims — they are described at model
      architecture level in engineering blog posts. The data moat from 1.5+ billion historical deliveries is a structural
      barrier to replication that grows with each shipment.
    claimRefs:
      - CE016
      - CE017
      - CE019
      - CE020
      - CE032
  - calloutType: risk
    title: No third-party certifications (SOC 2, ISO 27001) are publicly confirmed; architecture resilience has been tested by a full-day outage
    body: >
      Shadowfax's trust framework is entirely self-attested: no SOC 2 Type II, ISO 27001, PCI-DSS, or equivalent certification
      appears on public-facing pages or in exchange filings. The GCP migration engineering blog explicitly describes a
      full-day platform outage caused by a TCP timeout misconfiguration — demonstrating that the architecture is not immune
      to configuration-driven failures. Enterprise clients in regulated verticals (healthcare via CriticaLog, financial data
      via COD) will encounter a certification gap in procurement. The 6.1% Q4 FY26 lost-shipments cost line, while
      partially explained as a product-underwriting premium, remains opaque and above what logistics peers typically report.
    claimRefs:
      - CE021
      - CE034
      - CE035
      - CE036
      - CE037

