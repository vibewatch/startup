      statement: >
        The delivery partner network comprised 259,609 average quarterly transacting partners as of May 2026 per the
        Shadowfax investor presentation. The Google Play listing describes 1 lakh+ (100,000+) delivery partners across
        2,500+ cities handling 4 million+ orders monthly.
