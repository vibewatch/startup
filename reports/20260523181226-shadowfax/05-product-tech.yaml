        Covers all six publicly disclosed Shadowfax service lines as of May 2026, including the April 2026
        Shadowfax 360 launch and the 2025 CriticaLog acquisition. Dark-store management and Prime Large are
        included as disclosed ARR-stage products from Q4 FY26 management concall. Potential undisclosed
        white-label or enterprise-only modules are an evidence gap. Source cross-check draws on exchange
        filings, innovation page, and independent press coverage across six distinct domains.
