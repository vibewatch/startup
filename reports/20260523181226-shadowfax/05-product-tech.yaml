      sourceRefs:
        - SE018
        - SE001
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QE014

    - id: CE011
      statement: >
        Shadowfax uses SF Maps to resolve unstructured Indian address inputs. The system accepts free-text address and
        resolves to GPS coordinates via an AI model; a WhatsApp conversational bot interacts with customers to gather
        and correct address information. The GPS feedback loop updates every 5 seconds from active delivery partners.
      type: observed
      topic: address-resolution-workflow
      sourceRefs:
        - SE013
        - SE001
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QE015
        - QE019

