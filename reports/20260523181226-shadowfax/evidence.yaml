    severity: material
    topic: xpressbees-fy25-fy26-revenue
    missingEvidence: >
      XpressBees does not publicly disclose audited annual reports; FY25 and FY26 revenue are not confirmed in public
      filings. FY24 figures from Inc42 and Affluense show conflicting estimates (₹2,492 crore vs ₹4,200+ crore),
      creating uncertainty about XpressBees's true scale relative to Shadowfax.
    whyItMatters: >
      The revenue gap between Shadowfax (₹4,202 crore FY26) and XpressBees is the key determinant of whether XpressBees
      or Shadowfax is the clearer #2 player; if XpressBees has grown significantly in FY25-26, the competitive
      positioning changes.
    diligencePath: >
      Request XpressBees FY25/FY26 audited financials through DPIIT/MCA filings; cross-reference with Redseer and JM
