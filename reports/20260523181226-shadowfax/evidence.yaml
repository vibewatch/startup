    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: minor
    topic: shadowfax-segment-revenue-mix
    missingEvidence: >
      Shadowfax does not publicly disclose segment-level revenue breakdown between express parcel, quick-commerce, and
      reverse logistics. Without this, the relative profitability and growth contribution of each segment — critical for
      moat durability assessment — cannot be verified.
    whyItMatters: >
      If quick-commerce is growing but at lower margins than express parcel, Shadowfax's multi-segment moat may be
