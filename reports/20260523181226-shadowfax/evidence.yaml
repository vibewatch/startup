evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: post-ipo-ownership-mix
    missingEvidence: >-
      Fully diluted post-IPO cap table with promoter, institutional, ESOP, and public-float percentages after secondary
      sales and ESOP allotments.
    whyItMatters: >-
      Ownership concentration shapes control, liquidity, follow-on supply, and founder alignment after the public
      listing transition.
    diligencePath: >-
      Reconcile latest shareholding pattern, allotment notices, and prospectus dilution schedules into a fully diluted
      cap-table model.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: fy26-revenue-comparability
    missingEvidence: >-
      A clear bridge explaining why the investor presentation cites FY26 revenue of ₹4,202 crore while the
      board-approved audited standalone result shows ₹4,080.35 crore revenue from operations.
    whyItMatters: >-
      The company overview chapter needs one canonical number; unresolved presentation-versus-audit differences can
      cascade into valuation and financial model drift.
    diligencePath: >-
      Request reconciliation between presentation KPIs and audited statutory line items, including whether one figure is
      consolidated, rounded, or segment-summed.
    relatedQuestionRefs:
      - QO024
  - type: private-evidence-only
    severity: material
    topic: client-concentration-detail
    missingEvidence: >-
      Top-customer revenue shares, contract durations, and churn protections behind the public-market concentration
      concern.
    whyItMatters: >-
      Shadowfax’s post-listing risk perception depends on whether large clients are durable, diversified across service
      lines, or able to reprice the network aggressively.
    diligencePath: >-
      Request top-10 customer concentration, contract tenure, and wallet-share data from management or review deeper
      prospectus risk-factor tables.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-table-to002-completeness
    missingEvidence: >-
      A complete leadership org chart including CFO, audit-chair biographies, and any additional board observers or
      senior executives not named on the governance page.
    whyItMatters: >-
      The leadership and founder table is intentionally partial and should not be read as a complete management roster
      for succession-risk analysis.
    diligencePath: >-
      Request an updated leadership org chart and board biographies pack from investor relations after the next annual
      report cycle.
    relatedQuestionRefs:
      - QO008
      - QO009
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: sam-isolation
    missingEvidence: >
      No single public source provides a clean SAM isolation for Shadowfax's three core verticals (express parcel,
      hyperlocal quick-commerce, and reverse logistics) within the broader ecommerce logistics market.
    whyItMatters: >
      Without a defensible SAM, market penetration estimates are approximations and TAM-based market-share narratives
      overstate the addressable opportunity.
    diligencePath: >
      Request Shadowfax's internal segment-level revenue disclosure in analyst calls; cross-reference with Redseer or
      RedSeer strategy consultants for sub-segment market sizing.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: quick-commerce-sizing-discrepancy
    missingEvidence: >
      Quick-commerce market size estimates vary from USD 3.65 billion (Mordor, services definition) to USD 10-11 billion
      (Bain, GMV definition) and USD 6.78-7.6 billion (ResearchAndMarkets, GOV definition), reflecting definitional
      rather than methodological disagreement. No source provides a direct logistics-cost sub-component of
      quick-commerce.
    whyItMatters: >
      The true logistics-revenue pool embedded in quick-commerce GMV depends on the per-order logistics cost assumed,
      which none of the public sources disclose.
    diligencePath: >
      Seek Shadowfax hyperlocal segment revenue as disclosed in future quarterly filings; compare against IBEF and
      Redseer quick-commerce logistics cost percentage estimates.
    relatedQuestionRefs:
      - QM022
      - QM003
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: logistics-cost-gdp-benchmark
    missingEvidence: >
      While multiple sources reference India's logistics cost at 13-14% of GDP versus 8-10% in developed markets, no
      single primary source provides a rigorous country-by-country benchmark from a neutral third party. The comparison
      is widely cited (Mordor, MarkWide) but not independently verified by a government or regulatory body in the fetch
      log.
    whyItMatters: >
      The GDP-ratio comparison is often used to justify infrastructure investment headroom and long-term margin
      improvement, but if the 13-14% figure is overstated, the addressable efficiency-improvement thesis weakens.
    diligencePath: >
      Cross-reference with World Bank Logistics Performance Index and India's National Logistics Policy official
      progress reports; look for Ministry of Commerce and Industry benchmarking documents.
    relatedQuestionRefs:
      - QM019
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: minor
    topic: d2c-logistics-partner-switching
    missingEvidence: >
      No public data available on average tenure, switching rate, or reasons for logistics-partner switching among
      Indian D2C brands; Deccan Chronicle and Shiprocket content describe the aggregator model but not switching
      economics.
    whyItMatters: |
      Switching dynamics affect Shadowfax's D2C customer LTV and churn risk estimates.
    diligencePath: >
      Review Shadowfax client-retention data in IPO filing sections on key risks; request Shiprocket and iThink
      Logistics annual cohort data.
    relatedQuestionRefs:
      - QM015
