  - type: private-evidence-only
    severity: material
    topic: lease-obligation-detail
    missingEvidence: >
      Full lease schedule with per-facility tenure, renewal options, break clauses, and annual rent-step-up rates. The
      RHP discloses total right-of-use asset and lease liability balances but does not publish a granular lease-by-lease
      schedule or weighted average remaining term.
    whyItMatters: >
      With 100% leased facilities, the lease-obligation tenor and break-clause structure determines refinancing risk and
      flexibility to close underperforming facilities; opaque lease terms prevent accurate free-cash-flow modelling.
    diligencePath: >
      Request the full Ind-AS 116 lease schedule, including facility-level start/end dates, break clauses, and rent
