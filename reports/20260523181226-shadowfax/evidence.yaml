  - type: private-evidence-only
    severity: high
    topic: concentration-downside-scenario
    missingEvidence: >
      A scenario analysis showing the margin and cash impact of a 20-25% reduction in volume from the top client, which
      contributed approximately 49% of H1 FY26 operating revenue. No public disclosure contains this stress test.
    whyItMatters: >
      The top client accounts for a near-majority of revenue; without a documented downside scenario, investors cannot
      quantify the floor on profitability if the relationship reprices or volumes shift to in-house logistics.
    diligencePath: >
      Model a 20% and 25% volume-reduction scenario using disclosed segment cost split (52% partner costs, 19%
      transport) and compare against the fixed-cost base (employee, lease) to determine the EBITDA/PAT floor.
    relatedQuestionRefs:
      - QI029
  - type: private-evidence-only
    severity: material
    topic: third-party-certifications
    missingEvidence: >
      No SOC 2 Type II, ISO 27001, or PCI-DSS certification was found in any public source. As Shadowfax handles
      consumer personal data (name, phone, address, payment) for millions of enterprise clients, the absence of
      third-party security certifications is a material gap for regulated-industry enterprise procurement.
    whyItMatters: >
      CriticaLog serves healthcare and IT verticals that typically require supplier security certifications. Shadowfax
      360 onboards D2C brands who handle consumer PII. The missing certifications may be a procurement blocker in
      regulated segments and a reputational risk in the event of a breach.
    diligencePath: >
      Request ISO 27001 certificate (if held) or most recent SOC 2 Type II audit report from management. Check whether
      CriticaLog's healthcare contracts require HIPAA or equivalent compliance.
    relatedQuestionRefs:
      - QE010
