evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial opacity
    missingEvidence: Revenue, burn rate, cash runway, gross margin and exact headcount remain undisclosed in public sources.
    whyItMatters: >-
      A late-stage hardware company can look well funded publicly but still be undercapitalized relative to
      certification and production burn.
    diligencePath: >-
      Request monthly management accounts, cash-runway planning, headcount by function and audited 2025/2026 financial
      statements under NDA.
    relatedQuestionRefs:
      - QO017
      - QO022
  - type: private-evidence-only
    severity: material
    topic: governance opacity
    missingEvidence: >-
      Board composition, founder ownership, liquidation preferences, anti-dilution terms and secondary activity are not
      publicly disclosed.
    whyItMatters: These fields determine real control, downside protection and effective entry price at a unicorn valuation.
    diligencePath: Review the cap table, shareholder agreements and board materials from the most recent financing rounds.
    relatedQuestionRefs:
      - QO009
      - QO023
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: minor
    topic: certification timing
    missingEvidence: >-
      Public sources disagree on the exact date when the VE25-100 TC application was accepted or formally entered
      review.
    whyItMatters: The difference is not thesis-breaking but matters for benchmarking Volant’s certification velocity against peers.
    diligencePath: >-
      Request the CAAC project-acceptance notice, project code and official milestone tracker from the company or
      regulator-facing counsel.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: orders
    missingEvidence: >-
      The public file does not cleanly split confirmed orders, options, letters of intent, deposits and delivery
      schedules inside the 1,900-aircraft headline.
    whyItMatters: Backlog quality is a central input into commercialization credibility and any revenue-weighted valuation view.
    diligencePath: >-
      Obtain a customer-by-customer pipeline with contract type, deposit status, cancelability, pricing and expected
      delivery timing.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO001
      - TO004
  - type: missing-source
    severity: minor
    topic: ipo
    missingEvidence: The Hong Kong IPO path is discussed by media but not confirmed in an official filing or company statement.
    whyItMatters: IPO timing affects liquidity expectations and near-term valuation psychology, but should not be assumed as a fact.
    diligencePath: Wait for a formal exchange filing, mandate announcement or company confirmation before underwriting an IPO path.
    relatedQuestionRefs:
      - QO015
  - type: missing-source
    severity: minor
    topic: adverse events
    missingEvidence: >-
      No public lawsuits or sanctions were surfaced in the reviewed sources, but absence cannot be proven from sector
      media alone.
    whyItMatters: >-
      Undisclosed legal or regulatory issues would matter disproportionately for a certification-dependent aviation
      company.
    diligencePath: >-
      Run court, sanctions and administrative-penalty checks in Chinese legal databases and request litigation
      disclosure from management.
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: material
    topic: sam sizing
    missingEvidence: >-
      No public source isolates a rigorous China SAM for six-seat piloted passenger eVTOL matching Volant’s exact target
      configuration and route profile.
    whyItMatters: Without a clean SAM, investors can over-underwrite Volant off policy TAM numbers that are far too broad.
    diligencePath: >-
      Build a route-level SAM from named corridor candidates, seat utilization assumptions, pricing, vertiport density
      and operator-readiness data.
    relatedQuestionRefs:
      - QM021
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: route economics
    missingEvidence: >-
      Public materials do not disclose VE25-100 route-level economics, turn times, utilization assumptions or
      infrastructure cost per hub.
    whyItMatters: Passenger eVTOL adoption depends on unit economics more than policy rhetoric once certification is achieved.
    diligencePath: >-
      Request route models, energy use, maintenance assumptions and vertiport capex / opex from Volant and
      infrastructure partners.
    relatedQuestionRefs:
      - QM015
      - QM023
  - type: conflicting-data
    severity: minor
    topic: market sizing
    missingEvidence: >-
      Broad-sector forecasts mix official aggregates, third-party growth bands and global UAM estimates that are not
      directly comparable.
    whyItMatters: Averaging incompatible market figures would create false precision in SAM and valuation work.
    diligencePath: Keep broad-TAM and narrow-category estimates separated and construct bottom-up corridor cases instead.
    relatedQuestionRefs:
      - QM022
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: budget ownership
    missingEvidence: >-
      There is little public evidence on which buyers will self-fund routes versus rely on subsidies, leasing support or
      municipal sponsorship.
    whyItMatters: Budget ownership affects gross margin, route durability and customer-concentration risk.
    diligencePath: Collect MOUs, lease terms and government support documents for Volant’s top launch customers and launch cities.
    relatedQuestionRefs:
      - QM020
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: minor
    topic: backlog conversion
    missingEvidence: >-
      Public sources do not reveal contract conversion, cancellation rights or deposit percentages across the order
      book.
    whyItMatters: Demand quality shapes the real near-term market, not just the theoretical TAM.
    diligencePath: Request a customer-by-customer order-quality schedule under NDA.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: unit economics
    missingEvidence: >-
