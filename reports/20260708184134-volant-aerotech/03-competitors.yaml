- calloutType: risk
  title: Headline backlog and capital do not yet equal category leadership
  body: Volant’s funding and orders are impressive, but competitors own more verifiable proof on either certification, public liquidity, or actual operations. Until Volant converts capital and counterparties into certified deliveries and recurring routes, its moat remains more narrative than demonstrated.
