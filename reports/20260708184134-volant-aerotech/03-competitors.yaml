callouts:
- calloutType: insight
  title: Volant is not behind every competitor; it is behind the leaders of each adjacent lane
  body: EHang leads on certified autonomous passenger operations, AutoFlight on cargo-certification proof, Joby and Archer on public disclosure and Western certification, and Beta on range-led mission economics. Volant’s challenge is that category leadership is fragmented, so it must win on route execution rather than on one obvious headline metric.
  claimRefs:
