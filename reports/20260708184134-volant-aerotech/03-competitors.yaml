  evidenceGaps:
  - type: missing-source
    severity: material
    topic: unit economics
    missingEvidence: Public sources do not provide a clean apples-to-apples unit-economics comparison across Volant, AutoFlight, Joby, Archer and Beta.
    whyItMatters: Competitive positioning in passenger aviation depends as much on cost per seat-mile and utilization as on certification headlines.
    diligencePath: Request route-level cost models, maintenance assumptions, battery cycle economics and utilization cases from management teams or investors.
    relatedQuestionRefs:
    - QP024
    - QP025
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: backlog quality
    missingEvidence: Volant’s public order headline does not disclose the mix of firm contracts, options, deposits and cancellations relative to peers.
    whyItMatters: A large but weak-quality backlog can look stronger than a smaller but more binding commercial pipeline.
    diligencePath: Collect customer-by-customer contract terms and compare deposit quality against public peers where possible.
    relatedQuestionRefs:
    - QP022
    - QP025
    relatedTableRefs:
    - TP003
    - TP004
  - type: missing-source
    severity: minor
    topic: consumer pricing
    missingEvidence: Most peer OEMs do not disclose simple public aircraft price lists or route prices, limiting direct pricing comparison.
    whyItMatters: Without pricing data, relative go-to-market strength must be inferred from packaging and launch sequencing instead of direct margin math.
    diligencePath: Use operator or leasing interviews and private data-room materials to reconstruct expected pricing by scenario.
    relatedQuestionRefs:
    - QP015
    - QP024
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: minor
    topic: european peer viability
    missingEvidence: The reviewed official Volocopter materials do not themselves explain the full extent of the company’s market setback.
    whyItMatters: Europe’s failures are a useful cautionary signal but require separate legal or insolvency documentation for precision.
    diligencePath: Review court, insolvency and funding records for Lilium and Volocopter before using them as hard valuation comps.
    relatedQuestionRefs:
    - QP023
  - type: private-evidence-only
    severity: minor
    topic: competitive route economics
    missingEvidence: No public source reveals how Volant’s route-level economics compare with AutoFlight, Joby or Archer on the same corridor.
    whyItMatters: A company can look competitively strong on paper while failing on per-route profitability once charging, maintenance and utilization are modeled.
    diligencePath: Compare corridor-level operating models under NDA across a common set of routes and utilization assumptions.
