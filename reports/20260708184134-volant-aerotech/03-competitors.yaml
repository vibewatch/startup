- id: TP004
  title: Moat Durability / Competitive Risk Register
  columns:
  - Theme
  - Volant positive case
  - Competing threat
  - Why it matters
  - What would disprove moat strength
  rows:
  - - China policy alignment
    - Operates inside fastest-moving low-altitude policy market
    - Peers also benefit; EHang and AutoFlight already have stronger proof
    - Policy helps everyone; proof separates winners
    - If certification slips while policy support remains broad
  - - Capital raised
    - '>RMB5B cumulative funding gives runway and supplier credibility'
    - Joby and Archer still disclose larger public liquidity pools
    - Capital buys time but not category leadership
    - If more capital does not convert into certification or deliveries
  - - Order-book breadth
    - 1,900+ headline shows market interest across domestic and overseas users
    - Headline mixes LOIs, options and firm orders; quality unclear
    - Backlog quality matters more than gross count
    - If deposits and firm contracts prove small
  - - Configuration fit
    - Six-seat passenger format can address higher-value routes than two-seat tourism craft
    - AutoFlight, Joby and Archer also target premium passenger use cases
    - Direct architecture peers reduce differentiation
    - If peers certify first with similar economics
  - - Manufacturing / supply chain
    - Chinese industrial ecosystem and Zigong base can support scale
    - Execution risk remains high and suppliers can serve peers too
    - Industrial scale is only moat if ramp succeeds
    - If production readiness lags certification
  - - Commercial packaging
    - Mix of airline, leasing and tourism counterparties is strategically flexible
    - EHang already operates; Western peers disclose clearer launch programs
    - Packaging, not hardware alone, wins routes
    - If Volant cannot turn counterparties into actual recurring operations
  notes: Moat analysis is conditional rather than absolute. Volant has ingredients for a moat but not yet the strongest public proof on certification, operations or unit economics.
