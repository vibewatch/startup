  topStrengths:
    - >-
      Volant has raised at category-leading scale for a private China passenger-eVTOL startup, materially reducing
      immediate financing risk versus thinner peers.
    - The VE25-100 program shows real certification and flight-test progress rather than concept-only marketing.
    - >-
      Named customers such as China Southern General Aviation, Asian Express and Pan Pacific provide stronger public
      customer proof than many early-stage eVTOL programs.
    - >-
      China’s low-altitude-economy policy support and Volant’s operator / infrastructure partner mix create meaningful
      strategic optionality if certification lands on time.
  topRisks:
    - >-
      Certification timing remains the central gating risk, and public targets have already drifted from a 2026
      expectation to H1 2027.
    - Revenue, margins, burn, runway and contract hardness remain too opaque publicly to support precise underwriting.
    - >-
      Backlog quality is mixed across confirmed orders, deposits, options and LOIs, so the headline order book should
      not be treated as bankable revenue.
    - >-
      Insurance, route approvals, vertiport readiness and public-trust reactions can delay commercialization even after
      technical progress.
    - >-
      Recent sector insolvencies at Lilium and Volocopter prove that eVTOL valuations can compress violently when
      funding and commercialization fall out of sync.
  unresolvedGaps:
    - >-
      Customer-by-customer binding status, deposits, cancellations, milestones and delivery schedules for the public
      backlog.
    - Current cash position, monthly burn, runway and capex plan.
    - Regulator-facing critical path and open findings for VE25-100 certification.
    - Route-level unit economics including insurance, pilot, maintenance, vertiport and utilization assumptions.
    - Cap-table structure, liquidation preferences, founder ownership and board-level governance depth.
