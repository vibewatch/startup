  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: No public dispatch-rate, MTBF, endurance-cycle or recurring maintenance data were found for Volant prototypes.
    whyItMatters: Without reliability data, hardware maturity cannot be distinguished from milestone theater.
    diligencePath: Request fleet test logs, failure reports, reliability dashboards and maintenance assumptions.
