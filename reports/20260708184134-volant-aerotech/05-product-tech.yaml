  - type: missing-source
    severity: material
    topic: subsystems
    missingEvidence: No reviewed public source discloses battery supplier, avionics stack, actuator providers, compute architecture or detailed safety-case decomposition.
    whyItMatters: These components drive certification difficulty, reliability and supply risk.
    diligencePath: Request subsystem architecture documents, supplier lists, FMEA summaries and certification work packages.
