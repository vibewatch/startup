company:
  name: Volant Aerotech
chapter:
  number: 5
  title: Product & Technology
  summary: 'Volant’s product surface is unusually legible for a private eVTOL startup: the company has published a coherent aircraft spec, a visible certification timeline, a training-simulator narrative, and a manufacturing-base story. What remains opaque are the deeper engineering internals—battery, avionics, suppliers, field reliability and software stack—so the public file supports maturity and architecture framing better than technical proof at subsystem depth.'
sections:
- id: product-definition-and-use-cases
  title: What Volant Is Actually Selling
  body: 'Volant is not selling generic “air mobility.” It is building a piloted, passenger-grade lift-plus-cruise eVTOL aircraft—the VE25-100—plus the supporting training, manufacturing and operator-enablement stack required to make that aircraft deployable. In customer-workflow terms, the product is a route-capable airframe that an airline, leasing platform, tourism operator, rescue unit or regional transport partner can certify into operations, crew, maintain and eventually scale into a small fleet.


    The public spec is consistent across the company’s product pages and news surfaces. Volant describes the VE25-100 as a one-pilot, five-passenger aircraft with 2,500-kilogram maximum takeoff weight, 500-kilogram payload, 235 km/h cruise speed and 200-400 km range. The company positions that envelope as versatile enough for airport or intercity transfers, island routes, sightseeing, emergency rescue and cargo-adjacent missions. That matters strategically because the first commercial use case for eVTOL is rarely “mass commuting”; it is usually whichever route can tolerate premium pricing, operational complexity and gradual regulatory ramp.


    The important nuance is that Volant’s product is still an aircraft platform, not a completed transport network. The commercial surface therefore includes more than the cabin and range numbers: operator training, route suitability, maintenance readiness, low-altitude infrastructure coordination and certification progress are part of the product definition whether the company wants them to be or not.'
