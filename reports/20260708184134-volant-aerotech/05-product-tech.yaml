- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User job
  - Current workflow or pain
  - Volant solution
  - Measurable benefit
  - Limitation
  rows:
  - - Island / inter-island shuttle
    - Boats or helicopters with poor time economics or limited convenience
    - Piloted VE25-100 route service
    - Faster point-to-point travel with larger cabin than small sightseeing craft
    - Needs pilot, vertiport and route approvals
  - - Airport / intercity connector
    - Ground transport is slow and congestion-prone
    - 235 km/h eVTOL designed for short regional legs
    - Can compress travel time materially on short sectors
    - Economics depend on utilization and infrastructure
  - - Tourism / sightseeing operator
    - Need premium experience with safe passenger platform
    - Passenger cabin plus scenic-route operations
    - Early willingness-to-pay use case
    - May remain niche and policy-limited first
  - - Emergency rescue
    - Ground access can be slow or terrain-constrained
    - Cabin can fit a two-meter stretcher
    - Potentially faster medical or rescue access
    - Requires mission certification and dispatch integration
  - - Cargo / light logistics
    - Need higher-speed short-haul aerial movement
    - Cabin can accept aviation-grade containers / reconfiguration
    - Better asset utilization across missions
    - Passenger-optimized platform may not be cheapest cargo option
  - - Private / business mobility
    - Need time-saving premium transport
    - Flexible six-seat cabin and spacious interior narrative
    - Comfort and brand differentiation
    - Likely small-volume niche and sensitive to regulation
  notes: These scenarios are best read as route-design possibilities, not as proven operating deployments.
