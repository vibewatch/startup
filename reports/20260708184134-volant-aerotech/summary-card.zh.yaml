  topStrengths:
    - 在中国民营载人 eVTOL 初创公司里，Volant 融资规模处于头部，短期融资风险明显低于资金更薄的同行。
    - VE25-100 项目已经拿出真实取证和试飞进展，不只是概念营销。
    - China Southern General Aviation、Asian Express、Pan Pacific 等具名客户，让 Volant 的公开客户证明强于许多早期 eVTOL 项目。
    - 中国低空经济政策支持叠加 Volant 的运营方 / 基础设施伙伴组合；如果取证按期落地，公司会拿到有意义的战略选择权。
  topRisks:
    - 取证时间仍是最核心的门槛风险，公开目标已从 2026 年预期后移到 2027 年上半年。
    - 收入、毛利率、烧钱速度、现金跑道和合同硬度在公开层面仍太不透明，难以支撑精确承销。
    - 积压订单质量混杂，既有确认订单、定金，也有期权和 LOI；表面订单额不能直接当成可兑现收入。
    - 即使技术继续推进，保险、航线审批、垂直起降场准备度和公众信任反应仍可能拖慢商业化。
    - Lilium 和 Volocopter 近期破产说明，一旦融资节奏和商业化脱节，eVTOL 估值会剧烈压缩。
  unresolvedGaps:
    - 公开积压订单按客户拆分的约束力、定金、取消权、里程碑和交付排期。
    - 当前现金余额、月度烧钱速度、现金跑道和资本开支计划。
    - VE25-100 取证面向监管的关键路径和未关闭问题。
    - 航线级单位经济性，包括保险、飞行员、维修、垂直起降场和利用率假设。
    - 股权结构表、清算优先权、创始人持股和董事会治理深度。
