- id: TV005
  title: Thesis-Break and Kill Triggers Table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Certification slip
    - Material delay beyond H1 2027 without credible closeout plan
    - Extends burn, weakens backlog confidence, compresses valuation band
    - Move from research-more to avoid / pass absent compensating price drop
  - - Anchor-customer unwind
    - Meaningful reduction or deferral by China Southern, Asian Express or Pan Pacific
    - Undermines backlog optionality and GTM narrative
    - Re-underwrite customer-quality premium immediately
  - - Financing stress
    - Next round priced on clearly weaker or emergency terms
    - Signals current mark was not durable
    - Demand much lower entry or step away
  - - Safety / public trust event
    - High-profile incident tied to Volant platform or test program
    - Raises discount rate and slows route-opening assumptions
    - Freeze bullish case until root cause and regulator stance are clear
  - - Insurance / infrastructure block
    - Flagship route economics fail because coverage or vertiports do not clear
    - Converts theoretical demand into non-monetizable demand
    - Reduce revenue-timing confidence and scenario weights
  notes: These are explicit thesis-break conditions, not generic risks.
  claimRefs:
  - CV019
  - CV023
  - CV025
  - CV037
  - CV040
- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Cap table and preferences
    - Liquidation preferences, investor rights, anti-dilution, founder ownership
    - Can dramatically change real entry economics even at same headline valuation
    - Request latest cap table and financing docs from management / counsel
  - - Burn and runway
    - Current cash, monthly burn, capex and next-round trigger
    - Determines whether the current mark is durable or fragile
    - Request monthly operating model and financing plan
  - - Backlog hardness
    - Customer-by-customer binding status, deposits, cancellation terms and delivery milestones
    - Backlog quality is central to the valuation premium
    - Review signed contracts and pipeline matrix
  - - Certification confidence
    - Critical path, open findings, staffing depth and schedule variance
    - Main driver of scenario weighting
    - Request regulator work plan and internal milestone dashboard
  - - Route economics
    - Insurance, vertiport, utilization, maintenance and pilot assumptions
    - Determines whether post-cert value can justify current price
    - Request corridor-level unit economics by launch route
  - - Governance and exit readiness
    - Board composition, audit readiness, entity structure and IPO preparation status
    - Shapes exit discount rate and organizational resilience
    - Review governance package and listing-prep materials if any
  notes: These asks are ranked by valuation sensitivity rather than by narrative interest.
