- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Argument
  - What would change the view
  rows:
  - - China policy support, strong fundraising momentum and a real customer / certification narrative can justify unicorn status for a leading domestic passenger-eVTOL player.
    - More proof on certification probability, route economics and contract quality would strengthen this thesis materially.
  - - The current mark may already price in a large share of future success before revenue, margin and runway are publicly visible.
    - A materially lower entry price or stronger private data would reduce this concern.
  - - Volant’s larger passenger-aircraft design space could justify a better long-term outcome than smaller-tourism-first architectures if it reaches market on time.
    - If certification slips further or route economics remain unclear, the advantage becomes an expensive burden.
  - - Customer names, deposits and international interest create meaningful strategic option value.
    - If anchor accounts re-size, defer or fail to convert after certification, option value should be discounted sharply.
  notes: The investment debate is mostly about price and probability, not about whether the company is “interesting.”
