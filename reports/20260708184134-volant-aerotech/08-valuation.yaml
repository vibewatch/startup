- id: TV003
  title: Bull / Base / Bear Scenario Table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Certification lands close to current target; anchor customers convert meaningfully; early deliveries and China sector re-rating follow
    - US$1.8B-2.6B range becomes supportable and the current mark can compound further
    - Execution still hard, but milestone stack clears in sequence
    - Possible, but requires several linked wins
  - - Base
    - Certification progresses with some friction; backlog remains mixed but intact; financing remains available; commercialization proof stays limited
    - US$1.2B-1.6B range looks roughly fair, keeping current unicorn-band marks defensible but not cheap
    - Public opacity keeps upside capped
    - Most consistent with current evidence
  - - Bear
    - Certification slips materially, backlog softens, or financing terms worsen amid sector caution
    - US$0.5B-0.9B range becomes plausible as investors re-anchor to distress and earlier-stage comps
    - Multiple compression can be abrupt in eVTOL
    - Low-probability but highly consequential downside
  notes: Ranges are author scenarios anchored on milestone probability, peer-cap bands and downside-comp evidence, not on a precise financial model.
