- id: TV004
  title: Comparable Valuation Table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  enumerationScope:
    coverage: partial
    basis: Comparable set combines public market caps, annual-report archives, filings, and downside sector events available as of 2026-07-08.
    rationale: No comparable is perfect because eVTOL programs differ materially by aircraft architecture, autonomy, geography, disclosure quality and commercialization stage.
  rows:
  - - Joby Aviation
    - Public market cap and filing disclosure
    - ~US$7.85B market cap; not yet generating operating revenues
    - Best-known U.S. passenger-eVTOL benchmark with strongest public-capital access
    - Much more disclosed and better funded than Volant; not directly comparable on China policy leverage
  - - Archer Aviation
    - Public market cap plus FY2025 liquidity and loss profile
    - ~US$3.69B market cap; ~US$2.0B liquidity; heavy losses
    - Useful benchmark for late-stage passenger-eVTOL valuation versus burn
    - Still a U.S. public company with broader disclosure and capital-market access
  - - EHang
    - Public market cap and operating-proof reference
    - ~US$0.42B market cap; only China player with paid human-carrying ops proof
    - Best China public anchor for what real operating proof can mean
    - Smaller autonomous-tourism-first architecture and different business model
  - - Hurun low-altitude unicorn cluster
    - Private valuation marks
    - Aerofugia US$1.8B; Volant US$1.5B; Tengden US$1.5B; XAG US$1.0B
    - Useful for private China sector context
    - Index-style marks are less precise than priced public-market quotes
  - - Lilium / Volocopter downside comps
    - Distress outcomes
    - Recent insolvency episodes despite years of development
    - Defines downside physics if funding and commercialization diverge
    - Not direct fair-value comps; they are failure-state reference points
  notes: Comparables are used directionally to frame valuation bands, not to force false precision from mismatched business models.
