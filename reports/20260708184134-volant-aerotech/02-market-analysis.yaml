  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sam sizing
    missingEvidence: No public source isolates a rigorous China SAM for six-seat piloted passenger eVTOL matching Volant’s exact target configuration and route profile.
    whyItMatters: Without a clean SAM, investors can over-underwrite Volant off policy TAM numbers that are far too broad.
    diligencePath: Build a route-level SAM from named corridor candidates, seat utilization assumptions, pricing, vertiport density and operator-readiness data.
    relatedQuestionRefs:
    - QM021
    - QM025
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: route economics
    missingEvidence: Public materials do not disclose VE25-100 route-level economics, turn times, utilization assumptions or infrastructure cost per hub.
    whyItMatters: Passenger eVTOL adoption depends on unit economics more than policy rhetoric once certification is achieved.
    diligencePath: Request route models, energy use, maintenance assumptions and vertiport capex / opex from Volant and infrastructure partners.
    relatedQuestionRefs:
    - QM015
    - QM023
  - type: conflicting-data
    severity: minor
    topic: market sizing
    missingEvidence: Broad-sector forecasts mix official aggregates, third-party growth bands and global UAM estimates that are not directly comparable.
    whyItMatters: Averaging incompatible market figures would create false precision in SAM and valuation work.
    diligencePath: Keep broad-TAM and narrow-category estimates separated and construct bottom-up corridor cases instead.
    relatedQuestionRefs:
    - QM022
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: minor
    topic: budget ownership
    missingEvidence: There is little public evidence on which buyers will self-fund routes versus rely on subsidies, leasing support or municipal sponsorship.
    whyItMatters: Budget ownership affects gross margin, route durability and customer-concentration risk.
    diligencePath: Collect MOUs, lease terms and government support documents for Volant’s top launch customers and launch cities.
    relatedQuestionRefs:
    - QM020
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: minor
    topic: backlog conversion
    missingEvidence: Public sources do not reveal contract conversion, cancellation rights or deposit percentages across the order book.
    whyItMatters: Demand quality shapes the real near-term market, not just the theoretical TAM.
    diligencePath: Request a customer-by-customer order-quality schedule under NDA.
