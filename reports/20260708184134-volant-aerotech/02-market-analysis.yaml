tables:
- id: TM001
  title: Market Definition Table
  columns:
  - Segment / boundary
  - Included spend / activity
  - Excluded from Volant SAM
  - Typical buyer / payer
  - Why it matters for Volant
  rows:
  - - Low-altitude economy (broad)
    - Aircraft manufacturing, operations, infrastructure, UTM, batteries, insurance, services
    - None; this is the umbrella category
    - 'Mixed: governments, operators, logistics firms, consumers, insurers'
    - Explains why policy TAM numbers are so large
  - - Passenger eVTOL
    - Crewed or autonomous passenger-carrying aircraft, vertiports, route ops, maintenance
    - Industrial drones, agricultural spraying, most hobbyist GA
    - Airlines, GA operators, tourism firms, leasing firms, local governments
    - Volant’s core category
  - - Tourism / sightseeing
    - Fixed scenic routes, premium short flights, destination operations
    - Mass urban commuting and airport-replacement volumes
    - Scenic operators, local governments, passengers
    - Likely earliest passenger-adjacent revenue pool
  - - Public service / emergency
    - Medical, rescue, patrol, disaster response, municipal deployment
    - Purely consumer discretionary traffic
    - Government agencies, SOEs, public-service operators
    - Lower political resistance and mission urgency
  - - Logistics and cargo
    - Drone delivery, cargo eVTOL, offshore / remote resupply
    - Most passenger-transport economics
    - Logistics firms, hospitals, industrial operators
    - Important proof market, but Volant is not a pure cargo leader
  - - General aviation adjacency
    - Training, charter, helicopters, business aviation
    - Scheduled airline service at scale
    - GA operators, clubs, corporate operators
    - Provides operator talent and route adjacency but is not the same market
  - - Infrastructure and UTM
    - Vertiports, landing pads, charging, traffic management, communications
    - Aircraft hardware alone
    - Municipal governments, developers, telecoms, operators
    - A necessary precondition for scaled deployments
  notes: This table separates the broad low-altitude policy market from the narrower passenger-eVTOL serviceable market relevant to Volant. “Excluded” means excluded from Volant’s near-term direct SAM, not excluded from the broader sector.
