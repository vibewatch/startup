callouts:
- calloutType: insight
  title: Policy TAM is real but too broad to underwrite Volant directly
  body: The trillion-yuan Chinese low-altitude-economy story is useful because it mobilizes infrastructure and capital, not because it translates one-for-one into six-seat passenger-aircraft demand. Volant’s real SAM is the smaller, slower-to-open passenger slice inside that umbrella.
  claimRefs:
  - CM001
  - CM008
  - CM011
  - CM033
- calloutType: risk
  title: Commercialization bottlenecks now sit after aircraft certification, not before it
  body: China’s regulators are building a favorable framework, but route approval, operator readiness, vertiports, charging and contract quality remain gating constraints. The market may be attractive while still converting into revenue much more slowly than policy narratives imply.
