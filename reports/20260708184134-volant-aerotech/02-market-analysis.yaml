company:
  name: Volant Aerotech
chapter:
  number: 2
  title: Market Analysis
  summary: 'Volant sells into a much narrower slice of China’s low-altitude economy than the headline trillion-yuan policy numbers imply: it targets the piloted, six-seat passenger and special-mission eVTOL layer inside a broader ecosystem spanning drones, logistics, tourism, public service and infrastructure. China’s policy and infrastructure buildout is a real tailwind, but near-term revenue will likely come first from tourism, public-service and fixed-route deployments rather than dense urban commuting.'
sections:
- id: market-boundary
  title: 'Market Boundary: Low-Altitude Economy Is Broader Than Volant’s Real Addressable Market'
  body: 'The core market-definition mistake in Chinese eVTOL coverage is to treat the low-altitude economy and passenger eVTOL as synonyms. They are not. Multiple sector sources define the low-altitude economy as the full economic system built around manned and unmanned aircraft operating mainly below 1,000 meters, plus the associated infrastructure, operations, traffic management, batteries, composites, insurance and digital services. In that broad frame, drones, industrial inspection, agricultural spraying, logistics, emergency response, tourism, general aviation and urban air mobility all sit in the same policy bucket. That is why the headline market figures reach into the hundreds of billions or trillions of yuan.


    Volant’s real addressable market is far narrower. Its VE25-100 is a six-seat, piloted passenger eVTOL with public-service and logistics variants, which means it competes in the upper-value, lower-volume corner of the low-altitude economy rather than in the mass-volume drone segment. In practical terms, the relevant buyer universe is not “everyone participating in the low-altitude economy”; it is airlines, general-aviation operators, tourism route operators, leasing companies, local governments and emergency-service organizations able to finance, certify and operate crewed aircraft.


    This distinction matters for diligence because the broad policy market can grow rapidly while Volant’s specific subsegment still commercializes slowly. A trillion-yuan policy umbrella does not automatically translate into rapid six-seat passenger-aircraft deliveries. Volant needs certified aircraft, approved operators, routes, vertiports, charging and viable unit economics inside a much smaller, more operationally constrained SAM than the headline sector narrative suggests.'
