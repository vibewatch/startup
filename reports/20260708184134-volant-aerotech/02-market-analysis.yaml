- id: sizing-and-growth
  title: 'Sizing the Market: Broad Policy TAM vs Narrow Passenger-eVTOL SAM'
  body: 'Official and semi-official Chinese sizing is directionally huge but methodologically mixed. Market and policy sources peg the 2024 low-altitude economy baseline at roughly RMB670 billion, with 2025 commentary ranging from about RMB800 billion to RMB1.5 trillion and a long-range official target above RMB3.5 trillion by 2035. Those figures are meaningful because they reflect actual industrial policy and infrastructure spending, not just consultant enthusiasm. But they also aggregate manufacturing, operations, services and infrastructure across drones, logistics, emergency response, general aviation and eVTOL.


    For Volant, the more relevant question is not whether the total policy market is large; it is which parts of that market can absorb a six-seat passenger aircraft before 2030. Sector reports repeatedly indicate that cargo drones and uncrewed services are the most mature near-term demand pools, while piloted passenger transport remains certification- and infrastructure-constrained. The same sources suggest tourism, island and scenic routes, emergency response and fixed intercity corridors are earlier revenue vectors than broad ride-hail-like urban commuting.


    Global UAM forecasts add context but should not be confused with Chinese industrial-policy numbers. AviationOutlook cites Bank of America Institute research around a US$23 billion global UAM market by 2035, while Faxiangongchang places China’s eVTOL subsegment at around RMB3.2 billion in 2024 and above RMB9.5 billion by 2026. Those narrower figures are much closer to Volant’s real commercial category. The resulting diligence takeaway is that Volant is chasing a market that can become large, but whose directly serviceable passenger slice is still small relative to the aggregate low-altitude economy headlines.'
