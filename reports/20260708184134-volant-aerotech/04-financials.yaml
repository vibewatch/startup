callouts:
- calloutType: risk
  title: Financial opacity is the core anti-thesis
  body: Volant’s public file is strong enough to show that the company is financed; it is not strong enough to show that the company is economically efficient. Without revenue, margin, burn and contract-quality data, investors are underwriting a capital story rather than an operating story.
  claimRefs:
  - CI008
  - CI025
  - CI026
  - CI037
- calloutType: insight
  title: Category peers prove the burn curve is real
  body: Joby and Archer disclose multi-hundred-million-dollar annual operating losses even with much stronger public disclosure and progress. That context makes Volant’s fundraising scale look more understandable—but also underscores why runway cannot be judged from fundraising alone.
  claimRefs:
  - CI012
  - CI013
  - CI014
  - CI015
  - CI033
