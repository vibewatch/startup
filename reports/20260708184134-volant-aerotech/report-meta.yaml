companyProfile:
  summary: >-
    Volant Aerotech is a Shanghai-based Chinese advanced-air-mobility company
    founded on 2021-06-01 and centered on one core program: the six-seat VE25-100
    passenger eVTOL. Public evidence supports a serious industrial and financing
    story — a Zigong manufacturing-and-flight-test base, meaningful certification
    progress, more than RMB5 billion raised across 13 rounds, and a large stated
    backlog spanning domestic operators, lessors and international partners. What
    remains thin is the part that matters most for price discipline: revenue
    quality, burn, contract hardness, governance depth and route economics.
  foundedDate: '2021-06-01'
  founders:
    - name: Dong Ming
      role: Founder & CEO
      background: >-
        Aviation-systems veteran with prior experience at AVIC, GE and Rockwell
        Collins and participation in major Chinese commercial-aircraft programs
        including ARJ21 and C919.
      claimRefs:
        - CO009
  foundingLocation: Shanghai, China
  headquarters: Shanghai, China
  productSummary: >-
    VE25-100 passenger eVTOL aircraft with one pilot, five passengers, 500 kg
    payload and 200-400 km range, plus certification, training, operator-service
    and manufacturing support around the program.
  customerFocus: >-
    General-aviation and airline operators, lessors, tourism and regional-mobility
    partners, public-service and rescue users, and selected international
    infrastructure-backed route developers.
  businessModel: >-
    Aircraft sales or allocations to operators and lessors, customer deposits and
    future route-support, training, maintenance and ecosystem services once
    certification and operating approvals are achieved.
  stage: Late-stage private / unicorn
  fundingStatus: >-
    April-May 2026 brought a US$300M Series C and nearly RMB1B Series C+ in rapid
    succession, pushing cumulative public reported funding above RMB5B and keeping
    Volant in the top tier of China’s passenger-eVTOL capital formation.
