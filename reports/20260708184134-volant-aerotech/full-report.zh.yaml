      - number: '3.2'
        title: 能力广度与产品定位
        blocks:
          - type: paragraph
            body: >-
              产品架构是这个市场的第一道主要分界线。Volant 公开把 VE25-100 描述为六座客运飞机，配 8 台电机、500 kg 载荷和 200-400 km 航程。AutoFlight 的客运
              Prosperity 页面也呈现一款六座 1+5 全电飞机；Joby 年报则描述一架由飞行员驾驶、最多搭载 4 名乘客、最高 200 mph、航程约 100 miles 的飞机。Beta 的 ALIA
              强调更长的实证航程，以及客货双用运营逻辑。Wisk 和 EHang 更用力推动自主化。这些差异不是装饰：它们决定认证路径、任务经济性、航线密度和客户类型。


              Volant 最强的产品定位点，是它似乎把有意义的座舱规模、中国认证取向，以及已包含航空公司、租赁公司和海外旅游型交易对手的客户组合拼在了一起。风险在于，多家其他公司已经拥有更清晰的“品类领导”标签：EHang
              占据已认证无人驾驶客运运营，AutoFlight 占据货运认证，Joby 占据安静有人驾驶空中出租车品牌和广泛测试成熟度，Archer 占据 FAA Means of Compliance 进展，Beta
              占据任务型运营的航程加经济性。


              因此，仅凭原始规格看，Volant 的产品护城河并不明显。护城河必须来自执行：在中国的认证速度、制造准备度、客户转化和航线部署。如果这些环节滞后，产品可能会变成一个融资充足但夹在更成熟品类领导者之间的中间地带。
