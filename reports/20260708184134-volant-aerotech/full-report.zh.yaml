      - number: '2.2'
        title: 市场规模：宽口径政策 TAM 与窄口径客运 eVTOL SAM
        blocks:
          - type: paragraph
            body: >-
              中国官方和半官方规模测算方向上很大，但方法混杂。市场和政策来源把 2024 年低空经济基线放在约 RMB670B；2025 年评论区间从约 RMB800B 到 RMB1.5T 不等；长期官方目标则指向 2035
              年超过 RMB3.5T。这些数字有意义，因为它们反映真实产业政策和基础设施支出，而不只是咨询公司热情。但这些数字也把无人机、物流、应急响应、通用航空和 eVTOL 横跨制造、运营、服务和基础设施全部汇总在一起。


              对 Volant 更关键的问题，不是政策总盘子是否足够大，而是哪些部分能在 2030
              年前吸收一款六座客运飞机。行业报告反复显示，货运无人机和无人化服务是近期最成熟的需求池，而有人驾驶客运仍受认证和基础设施约束。同一批来源也显示，旅游、岛屿和景区航线、应急响应、固定城际走廊，比广泛的类网约车城市通勤更可能先产生收入。


              全球 UAM 预测可以提供背景，但不能与中国产业政策数字混用。AviationOutlook 引用 Bank of America Institute 研究，预计 2035 年全球 UAM 市场约
              US$23B；Faxiangongchang 则把中国 eVTOL 细分市场放在 2024 年约 RMB3.2B、2026 年超过 RMB9.5B。这些更窄的数字更接近 Volant
              真正的商业类别。尽调结论是：Volant 追逐的市场有机会变大，但可直接服务的客运切片，相比低空经济总量头条仍然很小。
