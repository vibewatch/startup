      - number: '8.4'
        title: 退出准备度、价格敏感性与最终尽调
        blocks:
          - type: paragraph
            body: >-
              公开退出准备度看起来仍早。香港上市传闻可能反映雄心，但披露画像距离招股书级别还很远。公开资料没有收入质量、利润率结构、董事会层面治理深度、优先权悬置，或经审计的客户转化数据，而这些通常才能支撑顺畅的后期上市故事。退出路径质量在
              IPO 发生前就会影响折现率，因此当前投资者必须把它计入价格。


              最重要的含义是价格敏感性。如果 Volant 的入场价明显低于公开独角兽区间下沿，不对称性会改善，因为大量认证和订单储备风险已经被折价。若价格达到或高于 Hurun 风格的 US$1.5 billion
              标记，投资者就是在提前为成功付费，而这种成功仍需要多个外部系统排齐。


              最终尽调因此应少关注宏大市场叙事，多关注少数能最快撬动内在价值的变量：合同硬度、认证信心、月度现金消耗、客户集中度、保险和航线启动经济性，以及投资者权利结构。
