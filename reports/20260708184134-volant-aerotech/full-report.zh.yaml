      - number: '6.3'
        title: 耐久性、留存与客户背书质量
        blocks:
          - type: paragraph
            body: >-
              由于 Volant 还未披露收入分组或交付机队，公开耐久性证据天然薄弱。未找到
              NRR、GRR、合同续签数据、客户满意度评分或复购行为。这与其说是对公司的否定，不如说是提醒：这个行业仍处于规模化前的采购阶段。公开层面能评估的是背书质量。China Southern General
              Aviation、Asian Express 和 Pan Pacific 是可信的具名交易对手，披露了使用场景，部分还披露了定金或固定订单表述。其余客户集公开成熟度低得多：很多名字只以标识或大订单簿的一部分出现。


              实际结果是，同一份订单储备内部，背书质量差异很大。有些客户看起来是活跃的共同开发或航线设计伙伴；另一些更像等待认证、融资和基础设施落地的期权式战略关系。因此，投资者不应把订单储备里的每一架飞机都等量看待。


              即便如此，公开资料也没有显示明显流失或客户撤回。缺少公开撤销证据略偏正面，但不能替代对取消条款、定金可转换性、里程碑触发条件和附函的私下尽调。
