      - CV031
      - CV032
      - CV035
  - id: TV005
    title: 论点失效与终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资判断的传导
      - 行动含义
    rows:
      - - 取证滑坡
        - 明显拖过 2027 年上半年，且缺乏可信收口计划
        - 拉长烧钱周期、削弱订单簿信心、压缩估值区间
        - 若价格没有同步下调，从 research-more 转向规避 / 放弃
      - - 锚定客户撤回
        - China Southern、Asian Express 或 Pan Pacific 明显削减或推迟订单
        - 削弱订单簿可选性和 GTM 叙事
        - 立即重估客户质量溢价
      - - 融资压力
        - 下一轮以明显更弱或应急条款定价
        - 说明当前估值标记撑不住
        - 要求大幅降低进入价格，或直接退出
      - - 安全 / 公众信任事件
        - 与 Volant 平台或测试项目相关的高关注事故
        - 推高折现率，并放慢开航假设
        - 根因和监管态度明确前，冻结乐观情形
      - - 保险 / 基础设施卡点
        - 因保险覆盖或垂直起降场未落地，旗舰航线经济性跑不通
        - 把理论需求变成无法变现的需求
        - 下调收入兑现时点信心和情景权重
    notes: 表中条件会明确打断投资判断，不是泛泛风险。
    claimRefs:
