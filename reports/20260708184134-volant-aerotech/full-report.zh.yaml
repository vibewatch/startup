        - OEM + 服务模式让激励更一致
        - 核查客户负责人和走廊启动打法
      - - 治理透明度
        - 董事会和继任披露稀疏
        - 中
        - 中高
        - 除投资方名单外，公开看不到更多
        - 获取董事会构成、委员会和关键人留任机制
    notes: 后期航空航天项目高度依赖协调，又经不起长期领导真空，因此执行风险被放大。
    claimRefs:
      - CR013
      - CR026
      - CR032
      - CR033
  - id: TR005
    title: 缓释与终止标准表
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 认证节奏
        - 公开排期滑坡
        - 2027 年上半年之后再次实质延期，且没有明确原因闭环
        - 提高要求回报；重新评估资金跑道和客户信心
      - - 积压订单质量
        - 锚定客户变化
        - 有证据显示 China Southern、Asian Express 或 Pan Pacific 缩减、取消或实质推迟承诺
        - 将积压订单倍数视为受损，并重看估值底线
      - - 融资依赖
        - 资本市场通道
        - 下一轮需要明显更弱的条款或应急结构
        - 将投资论点从增长融资切到生存融资
      - - 安全 / 公众信任
        - 涉及 Volant 飞机或配套运营的公开事故
        - 致命或高关注安全事件，或监管要求暂停
        - 在根因和监管立场清楚前，冻结乐观商业化假设
      - - 保险 / 基础设施瓶颈
        - 航线启动阻碍
        - 旗舰走廊出现指示性保险免责、无法承受的保费或垂直起降场延期
        - 下调近期运营概率，并降低收入时间判断的置信度
      - - 执行集中度
        - 领导层扰动
        - 创始人 / 技术负责人意外离开，且没有明确后备梯队
        - 要求更大的治理折价，或暂停投资确信度
    notes: 终止标准有意设置成可观察、绑定现实事件，而不是叙事情绪。
    claimRefs:
      - CR001
      - CR004
      - CR006
      - CR009
      - CR010
      - CR014
