      - number: '4.4'
        title: 公开财务缺口与承保边界
        blocks:
          - type: paragraph
            body: >-
              缺失字段事关承保，不是装饰。Volant
              不披露收入、ARR、毛利率、烧钱速度、现金跑道、债务、资本开支强度、员工数、飞机单位成本、平均售价、取消条款、质保准备金或航线级补贴。公开报道也没有把约束性销售与期权、定金和意向书拆开。这意味着即便是简单问题——公司每月烧多少钱、要交付多少架飞机才能达到毛利率盈亏平衡、每条航线承担多少保险和垂直起降机场费用——也无法凭公开材料可靠回答。


              新政策层让这些缺失数据更重要，而不是更不重要。中国 2026 年低空保险推进，明确迫使运营商把责任险纳入单位经济性；垂直起降机场运营商和物业所有者也会要求专门保险和安全披露。对 Volant
              而言，工程、认证和财务被紧紧绑在一起：如果管理层无法证明安全和利用率假设，保险、航线审批和基础设施成本可能摧毁本来看似有吸引力的飞机经济性。


              因此，本章结论刻意收窄。公开档案支撑的命题是：Volant 具备融资能力，也有商业看点。公开档案不支撑的命题是：Volant
              已经经济高效、毛利为正，甚至可以被有信心地建模。任何超出资本充足性的投资论证，都必须依赖私下尽调。
