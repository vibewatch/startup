  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户是谁——谁买，谁用
        blocks:
          - type: paragraph
            body: >-
              Volant
              的客户群更适合理解为多方采购生态，而不是一张简单的航空公司销售名单。公开材料显示，至少有五类客户或伙伴：通航和航空运营方、融资租赁公司、海外基础设施或开发伙伴、公共服务和救援组织，以及高端旅游或区域出行运营方。很多情况下，买方、运营方和最终用户并不是同一方。租赁公司可能负责融资，本地运营方负责飞行，乘客或救援机构才是终端用户。


              这个区别很关键，因为它改变了“客户牵引力”的含义。租赁公司标识不等于乘客需求；救援或公共服务伙伴不等于一条盈利旅游航线；有海外基础设施背书的 LOI 也不等于已交付机队。即便如此，Volant
              的公开客户组合仍然贴合这个品类。早期 eVTOL 采购通常从几类交易对手开始：能容忍认证延迟、能影响基础设施或政策，并且会战略性思考未来航线控制权。


              客户名单还暗示了一条中国优先、但不只中国的 GTM 路径。China Southern General Aviation、Asian Express、ABC Financial Leasing 和 Beijing
              E-Town Financing Leasing 等国内名字，指向本土运营和金融渠道；Pan Pacific / CAIEC 结构则显示，在密集城市空中出租车网络普及之前，Volant
              可能先把产品出口到海岛、旅游和救援走廊。
