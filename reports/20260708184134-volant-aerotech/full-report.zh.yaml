  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 该建议从有支撑的独角兽事实图景出发，穿过披露缺口和赛道风险，最后落到继续研究的结论。
    data:
      nodes:
        - id: fact
          label: 独角兽估值信号
          detail: Hurun 将 Volant 估值列为 US$1.5B，2026 年融资动能真实存在
        - id: proof
          label: 真实但早期的证据
          detail: 客户名称、认证进展和政策顺风都存在
        - id: opacity
          label: 经济性不透明
          detail: 收入、利润率、资金续航和股权结构细节披露仍很薄
        - id: risk
          label: 赛道下行逻辑
          detail: 同业破产和认证依赖抬高折现率
        - id: call
          label: 继续研究 / 偏紧
          detail: 公司确实有分量，但当前公开证据不足以支持激进买入
      edges:
        - from: fact
          to: proof
          label: 受制于
        - from: proof
          to: opacity
          label: 抵消
        - from: opacity
          to: risk
          label: 放大
        - from: risk
          to: call
          label: 导向
    claimRefs:
      - CV001
      - CV003
      - CV014
      - CV020
      - CV022
      - CV025
      - CV039
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: Volant 的公允价值最敏感的变量是里程碑达成概率，而不是单一披露估值标记。
    data:
      items:
        - label: 认证时间 / 概率
          value: 35
        - label: 在手订单转化质量
          value: 25
        - label: 融资续航 / 稀释
          value: 20
        - label: 航线经济性 / 保险
          value: 12
        - label: 赛道倍数情绪
          value: 8
      yAxis:
        label: 相对估值敏感性（%）
    approximationNotes: 敏感性权重来自作者基于公开风险和估值证据的判断，不是管理层指引。
    claimRefs:
      - CV014
      - CV019
      - CV023
      - CV025
      - CV040
