  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：低空经济比 Volant 真正可服务市场更宽
        blocks:
          - type: paragraph
            body: >-
              中国 eVTOL 报道里最核心的市场定义错误，是把低空经济和客运 eVTOL 当成同义词。它们不是一回事。多个行业来源把低空经济定义为一个完整经济系统，围绕主要在 1,000
              米以下运行的有人和无人航空器展开，并包括基础设施、运营、交通管理、电池、复合材料、保险和数字服务。在这个大框架里，无人机、工业巡检、农业喷洒、物流、应急响应、旅游、通用航空和城市空中交通都落在同一个政策桶里。这也是头部市场规模会达到数千亿乃至数万亿元的原因。


              Volant 真正可服务市场要窄得多。VE25-100 是一款六座、有人驾驶的客运
              eVTOL，并带有公共服务和物流变体，这意味着它竞争的是低空经济中高价值、低批量的一角，而不是大批量无人机市场。实际买方不是“所有参与低空经济的人”，而是有能力为载人飞机融资、认证并运营的航空公司、通用航空运营商、旅游航线运营商、租赁公司、地方政府和应急服务机构。


              市场边界区分对尽调很关键，因为宽泛政策市场可以快速扩张，而 Volant 所在的细分市场仍可能慢速商业化。万亿元级政策伞不会自动转化成六座客运飞机的快速交付。Volant
              需要的是已认证飞机、获批运营商、航线、垂直起降机场、充电设施，以及在一个远小于头部行业叙事所暗示规模、且运营约束更强的 SAM 内跑通单位经济性。
