        - label: 累计融资额
          value: '>700'
          unit: USD M equivalent
        - label: 公开收入披露质量
          value: Low
        - label: 风险评级
          value: High
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV022
      - CV028
