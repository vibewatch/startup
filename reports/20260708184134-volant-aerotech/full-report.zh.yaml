  - id: FU004
    title: 留存 / 复购队列
    type: matrix
    layout: wide
    summary: 交付前的留存代理指标，说明公开证据能揭示、也无法揭示的客户关系韧性。
    data:
      columns:
        - 协议状态（公开记录）
        - 公开退出证据
        - 合同具体度
        - 缺口
      rows:
        - label: China Southern General Aviation
          values:
