  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 最先击穿投资假设的是什么
        blocks:
          - type: paragraph
            body: >-
              Volant 的风险画像，核心并不是 eVTOL
              这个想法是否有意思。真正的问题是哪个依赖先断：认证进度、融资期限、订单储备转化、基础设施就绪，还是安全事件后的公众信任。当前公开资料最强地指向四个一线风险。第一，型号合格审定和下游运营批准仍然卡住一切。第二，订单簿很大，但质量混杂，公开合同细节有限。第三，低空基础设施、保险和监管协调仍在实时搭建。第四，近期同行破产说明，这个行业仍容易受到资本市场急转弯冲击。


              这些风险之间的联动，比风险登记表中的任意单行更重要。认证延期会拉长烧钱周期；烧钱周期拉长会提高融资依赖；融资依赖会让客户更谨慎；客户谨慎会削弱订单储备质量；订单储备质量变弱，会抬高下一轮融资的折现率。这才是真正的风险传导链。


              因此，本章把 Volant 的剩余风险评为高，尽管没有单一公开来源证明公司即将失败。项目本身看起来认真；围绕项目的系统仍然脆弱。
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR012
              - CR014
              - CR017
              - CR020
              - CR027
              - CR034
              - CR035
      - number: '7.2'
        title: 监管、法律与安全风险
        blocks:
          - type: paragraph
            body: >-
              认证仍是最核心的法律和监管瓶颈。Volant 公布了可信的适航路径，但早期对 2026 年取证的公开预期已经推迟到 2027
              年上半年目标。这类滑期在航空航天很常见，但对投资者仍然重要，因为每个季度延迟都会影响客户节奏、现金消耗和竞争观感。即使拿到型号合格证，下游运营批准、航线许可、培训批准和本地基础设施集成仍然关键。


              中国更广的低空系统也在变得更支持行业的同时变得更严格。CAAC
              已成立低空安全部门，法律修订继续把适航、飞行管理和服务平台规则制度化。长期看这有助于行业，但短期会抬高合规门槛。公开安全事件也可能触发政策突然反应。Reuters 关于 2026 年 6
              月北京轻型飞机事故的报道，描述了旅游飞行暂停、运营方不确定性，以及外界重新关注空域管控缺口。


              保险又创造了一层准监管门槛。多方来源认为，保险正在从可选项变成准入门槛，尤其是跨边界或密集城市运营。一旦保险、责任分配和地方批准成为前置条件，单靠技术成功已经不足以打开一条航线。
