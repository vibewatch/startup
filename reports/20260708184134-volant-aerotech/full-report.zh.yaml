  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 主题
      - Volant 正面判断
      - 竞争威胁
      - 重要性
      - 证伪护城河强度的信号
    rows:
      - - 中国政策契合
        - 身处推进最快的低空政策市场
        - 同行同样受益；EHang 和 AutoFlight 已有更强验证
        - 政策人人受益，真正拉开差距的是验证
        - 如果政策支持仍广泛，但取证进度滑坡
      - - 已融资额
        - '>RMB5B 累计融资带来现金跑道，也增强供应商信任'
        - Joby 和 Archer 公开披露的流动性储备仍更大
        - 资本买时间，但买不到品类领导权
        - 如果更多资本没能转化为取证或交付
      - - 订单簿广度
        - 1,900+ 架订单口径显示海内外用户有兴趣
        - 总数混合 LOI、期权和确定订单；质量不清
        - 积压订单质量比总量更重要
        - 如果订金和确定合同被证明规模很小
      - - 构型适配
        - 六座客运构型能覆盖比双座观光机更高价值的航线
        - AutoFlight、Joby 和 Archer 也瞄准高端客运场景
        - 直接架构同行压低差异化
        - 如果同行用相似经济性更早取证
      - - 制造 / 供应链
        - 中国工业生态和自贡基地可以支撑规模化
        - 执行风险仍高，供应商也能服务同行
        - 只有爬坡成功，工业规模才是护城河
        - 如果生产准备落后于取证
      - - 商业包装
        - 航空公司、租赁和文旅交易对手的组合具备战略弹性
        - EHang 已经运营；西方同行披露的首发项目更清晰
        - 赢下航线靠包装，不只靠硬件
        - 如果 Volant 不能把交易对手转成实际、持续运营
    notes: 护城河分析是有条件的，不是绝对结论。Volant 具备形成护城河的材料，但在取证、运营或单位经济上的公开验证还不是最强。
