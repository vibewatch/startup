      - number: '7.4'
        title: 财务 / 模型风险与终止标准
        blocks:
          - type: paragraph
            body: >-
              业务模型风险很直接：Volant 仍处于规模化前，披露不足。公司融到的钱足以显得重要，但公开细节不足以证明资本效率。同行失败让警示更尖锐。Lilium
              破产说明，如果政府或私人支持退潮，雄心勃勃的飞机项目会烧掉惊人的资本。Volocopter 破产说明，即使是知名城市空中出行品牌，也可能跨不过从示范到商业融资的缺口。


              这并不意味着 Volant 正走向同样结局。相较这些同行近期在欧洲面对的融资现实，中国政策支持更强；Volant 的客户 /
              伙伴组合也更明确地绑定运营方、租赁方和基础设施规划方。但教训仍然清楚：订单储备标题不能消除资本风险，市场可能在商业运营开始前就急剧转冷。


              因此，投资假设会被可衡量事件击穿，而不是被情绪击穿。重大认证延期、重要锚定客户撤回、无法以可接受条款完成下一轮融资、保险或航线批准阻断关键走廊的证据，或直接涉及 Volant
              的公开安全事件，任何一项都会迫使判断明显转冷。
