      - number: '5.3'
        title: 成熟度、认证与制造准备度
        blocks:
          - type: paragraph
            body: >-
              Volant 的成熟度故事强于许多私营同行，因为公司发布的是分步开发时间线，而不只是抽象路线图。X1 全尺寸验证机于 2022 年下线，2023 年初首飞，并在 CAAC 华东地区管理局于 2023 年 9
              月受理 VE25-100 型号合格证申请前完成过渡飞行。随后，公开材料显示了一串审查和测试事件：2024 年 10 月首次审查会、建立 G-1 认证基础和项目特定认证计划、AC101
              开发样机下线、自由飞行进展、首次有人驾驶飞行，以及后续集中适航审查会。


              这些节点有意义，因为客运 eVTOL 风险主要由适航流程纪律主导。Volant
              还称已完成单螺旋桨失效和应急着陆等高风险测试，并借有人驾驶和转换飞行里程碑验证操稳和系统稳定性。合在一起，这些主张把公司放在概念营销之后、严肃认证执行之中。


              但时间线也说明尽调必须保持谨慎。不同公开表面对型号认证时间预期并不一致：一篇 2025 年文章引用了 2026 年取证预期，而公司 2026 年 5 月更新称目标为 2027
              年上半年。这类滑期在航空领域正常，但它会拉长资本消耗、客户等待时间和竞争压力。制造准备度也可见但未完全证明：自贡基地和年产 300
              架产能说法显示了意图和设施，却没有公开证据证明生产良率、供应商认证状态或超过头部产能口径的吞吐量。
