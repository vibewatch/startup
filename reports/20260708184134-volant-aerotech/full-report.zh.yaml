  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    enumerationScope:
      coverage: partial
      basis: >-
        Comparable set combines public market caps, annual-report archives, filings, and downside sector events
        available as of 2026-07-08.
      rationale: >-
        No comparable is perfect because eVTOL programs differ materially by aircraft architecture, autonomy, geography,
        disclosure quality and commercialization stage.
    rows:
      - - Joby Aviation
        - 公开市值和申报披露
        - ~US$7.85B 市值；尚未产生运营收入
        - 美国最知名的载人 eVTOL 基准，公开资本通道最强
        - 披露远多于 Volant、资金也更足；中国政策杠杆无法直接可比
      - - Archer Aviation
        - 公开市值，加上 FY2025 流动性和亏损情况
        - ~US$3.69B 市值；~US$2.0B 流动性；亏损沉重
        - 可作为后期载人 eVTOL 估值与烧钱水平的参照
        - 仍是美国上市公司，披露更广、资本市场通道更强
      - - EHang
        - 公开市值和运营验证参照
        - ~US$0.42B 市值；唯一有付费载人运营证明的中国玩家
        - 是理解真实运营证明价值的最佳中国公开锚点
        - 架构更小、自动驾驶和旅游优先，商业模式也不同
      - - 胡润低空独角兽集群
        - 私募估值标记
        - Aerofugia 估值 US$1.8B；Volant 估值 US$1.5B；Tengden 估值 US$1.5B；XAG 估值 US$1.0B
        - 可提供中国私募市场板块背景
        - 指数式估值标记不如已定价的公开市场报价精确
      - - Lilium / Volocopter 下行可比
        - 困境结局
        - 研发多年后仍出现近期破产事件
        - 融资和商业化背离时，它们界定了下行路径
        - 不是直接公允价值可比，而是失败状态参照点
    notes: 可比公司只用于方向性框定估值区间，不拿错配商业模式强行做伪精确。
    claimRefs:
      - CV007
      - CV008
