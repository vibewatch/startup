  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 认证接近当前目标落地；锚定客户有效转化；早期交付和中国板块重估随后出现
        - US$1.8B-2.6B 区间变得可支撑，当前估值还能继续复利
        - 执行仍难，但里程碑栈按顺序打通
        - 有可能，但需要多个相互关联的胜利
      - - 基准
        - 认证有摩擦但继续推进；积压订单结构混合但保持完整；融资仍可获得；商业化证据仍有限
        - US$1.2B-1.6B 区间大致合理，当前独角兽区间估值站得住，但不便宜
        - 公开不透明压住上行空间
        - 最符合当前证据
      - - 悲观
        - 认证实质延期、积压订单转弱，或行业谨慎下融资条款恶化
        - 投资人重新锚定困境和更早期可比公司后，US$0.5B-0.9B 区间变得可能
        - eVTOL 的倍数压缩可能很突然
        - 低概率但后果很重的下行情景
    notes: 上述区间是作者情景，锚定里程碑概率、同业市值区间和下行可比证据，而不是精确财务模型。
