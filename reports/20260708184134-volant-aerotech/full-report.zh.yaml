        - 很可能是最早接近载客业务的收入池
      - - 公共服务 / 应急
        - 医疗、救援、巡逻、灾害响应、市政部署
        - 纯消费者可选出行
        - 政府机构、国企、公共服务运营方
        - 政治阻力更低，任务更急
      - - 物流和货运
