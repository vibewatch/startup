      - number: '4.3'
        title: 资本充足性与同行烧钱背景
        blocks:
          - type: paragraph
            body: >-
              公开档案能支撑的是资本充足性比较。Volant 在 2026
              年连续融资，暗示公司拥有可观跑道来推进认证和制造准备；股东结构转向保险、国资关联和产业资本，也说明其股东基础比典型风投团更有耐心。这很重要，因为公开同行显示，即便披露更充分、进展更领先，赛道依然很烧钱。Joby
              报告 2025 年 Q4 拥有 US$1.4B 现金和短期投资，并在 2026 年 2 月额外收到净额 US$1.2B；其年报仍称公司尚未产生经营收入。Archer 在 FY2025 年末拥有约 US$2.0B
              流动性、US$729.6M 运营费用和 US$618.2M 净亏损。


              这些同行数字不能证明 Volant 现金足够。但它们说明 Volant 所在的经济邻域：资本密集、尚未规模化、认证驱动，即便公开领先者仍在亏损。相对这个基准，核心结论是 Volant 累计超过 RMB5B
              的私人资本在方向上相当可观；但没有烧钱速度数据，仍无法判断。一家融资充足的客运 eVTOL 项目，如果认证或制造比计划更久，仍可能走向资本不足。


              因此，公开信号指向的是大概率近期偿付能力，而不是已证明资本效率。Volant 已经筹到足够资本，能继续留在比赛中；但披露还不足以证明这场比赛具有财务纪律。
