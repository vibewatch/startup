      - number: '1.2'
        title: 创始人、领导层与公开治理信息
        blocks:
          - type: paragraph
            body: >-
              Volant 公开领导层信息强于公开治理披露。公司网站明确列出创始人兼 CEO Dong Ming、总裁 Mcfly Huang 和 CTO Zhang Baozhu。材料称 Dong 是航空系统老兵，曾在
              AVIC、GE 和 Rockwell Collins 任职，并参与 ARJ21、C919 和 CR929 项目；Huang 是偏商业化的高管，在通用航空和低空经济领域有近 20 年经验；Zhang
              是总师级飞机开发专家，拥有数十年 Part 23 和 Part 25 适航经验。Bamboo Works 的一篇画像还提到技术负责人 Yu Wei / William Yu，据称他曾在 CAAC 和
              Honeywell 工作。


              更大的团队叙事，是一支航空履历很重的队伍。Volant 官方材料称，核心团队来自 COMAC、Airbus、GE 和 Honeywell，参与过 9 个大型飞机项目；公司 2024
              年发布的信息称，团队合计拥有超过 400 年型号经验，并包括 10 名 CAAC 委任代表。这个说法在方向上有价值，因为 Volant 竞争的是认证密集型客运航空，而不是纯软件或消费硬件。


              但治理透明度仍然很薄。公开材料没有董事会名单、创始人持股、详细股权结构，也没有披露投票控制、优先清算条款或接班安排。因此，公司呈现出“领导层很强、治理很暗”的状态：投资人可以承保可信的技术和商业履历，却无法仅凭公开材料完整评估董事会独立性或控制权安排。
