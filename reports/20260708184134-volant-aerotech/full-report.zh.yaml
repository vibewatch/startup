      - number: '8.3'
        title: 建议、投资假设与反向假设
        blocks:
          - type: paragraph
            body: >-
              持有 Volant 的投资假设是连贯的。中国已把低空航空列为战略优先级；Volant 融资规模位居品类前列；客户证据好于许多概念期 eVTOL 创业公司；产品落在客运 eVTOL
              设计空间中的一个位置，如果认证和运营经济性跑通，可能具备有吸引力的实用价值。反向假设同样连贯：公司仍处于规模化前，公开投资判断数据太薄，品类死亡率真实存在，当前估值可能已经计入了超过证据所能支撑的成功。


              合适建议因此是继续研究，而不是买入或回避。公司体量太大，不能轻易忽略；但价格缺少足够证据，不能激进背书。买入判断需要更有吸引力的入场估值，或私下证据补上合同质量、资金跑道、认证概率和航线经济性上的最大缺口。回避判断则需要比当前公开资料更清晰的近期财务或技术断裂迹象。


              换句话说，Volant 适合作为尽调优先项，还不是一个可按确信度定价的公开信息资产。
