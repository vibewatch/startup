      - number: '6.2'
        title: 具名客户证据与采用轨迹
        blocks:
          - type: paragraph
            body: >-
              最强的公开客户证据来自三个具名锚点。第一，China Southern General Aviation 公开成为 Volant
              首个确认订单客户，并在飞机尚未取得型号合格证前支付定金。这是罕见的品类证据，因为它表明至少一家成熟运营方愿意在最终认证前投入资本。第二，Asian Express 从 2023 年 118
              架飞机意向书，演进到后来通过 Inner Mongolia Express General Aviation 子公司签下固定订单，提供了一个软承诺转硬承诺的公开案例。第三，Pan Pacific 在 2025 年
              7 月签下 500 架飞机交易，并由 CAIEC 提供基础设施支持，显示 Volant 正在把海外部署打包成“飞机 + 基础设施”的方案。


              更广的采用轨迹也清楚，尽管仍处于收入前阶段。公开来源称，截至 2024 年底，Volant 战略合作和意向订单超过 860 架、价值 RMB22 billion；到 2026 年中，意向书和确认订单超过
              1,900 架、价值超过 RMB47.5 billion。独立报道还称，公司已收取近 RMB100 million 定金，约三分之一订单储备来自海外。


              但这是一条管线曲线，不是部署曲线。公开资料仍未证明已交付量产飞机、在飞客户机队、航线利用率、续约行为或重复下单。现阶段，采用故事靠承诺、定金和合作深度衡量，而不是靠在飞飞机衡量。
