      - number: '5.2'
        title: 架构、控制理念与运营商工作流
        blocks:
          - type: paragraph
            body: >-
              Volant 公开架构故事围绕一个保守但有商业野心的设计选择展开：有人驾驶的升力-巡航飞机，采用全电传飞控和简化车辆操作，而不是纯自主。在实践中，公司试图把有翼客运 eVTOL
              更长航程、更宽敞座舱的优势，与降低飞行员工作负荷的控制理念结合起来。公司材料描述了 8 台电机和冗余推进系统；CEO
              访谈则增加了更具体的人因视角：飞机借助算法协同，把传统多轴飞机操纵转成更简单的控制输入，目标是让飞行员感觉更直观。


              这是公开档案里更可信的产品差异点之一，因为它直接连到采用摩擦。如果每个客户都必须搭建异常困难的飞行员培训管线，再漂亮的飞机规格也没那么重要。Volant 的论点是，全电传飞控加 SVO
              可以压缩商用飞行员的型号转换难度，并在以后支撑更可规模化的培训路径。模拟器发布强化了这个主张，因为它显示公司不只在思考飞机本体，也在思考培训和验证工具链。


              不过，公开工程图景并不完整。Volant
              列出了主要能力模块——机体结构、气动、飞控律开发、冗余系统、电推进冗余和热设计——但不披露子系统供应商、能量密度、电池安全架构、航电伙伴或现场可靠性统计。因此，公开档案支撑的是一个合理运营模型假设，而不是深度子系统审计。
