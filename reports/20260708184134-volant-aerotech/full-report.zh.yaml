      - number: '7.3'
        title: 运营、依赖与人员风险
        blocks:
          - type: paragraph
            body: >-
              运营层面，主要未知数不是 Volant 能不能造出一架原型机，而是公司能否把原型经验转化为可重复、可认证、可支持的生产，同时协调电池、推进、维修、培训和基础设施。公开材料称公司在自贡有年产 300
              架的基地，但没有公开证据说明供应商资质、良率、签派可靠性或维修负担。制造和质量风险因此仍明显未解。


              伙伴依赖同样重要。Pan Pacific 的 500 架国际承诺依赖 CAIEC 的基础设施角色，也依赖认证按时完成。ABC Financial Leasing 和 Beijing E-Town
              Financing Leasing 等租赁渠道名字可以加速采用，但也意味着 Volant 的需求故事可能依赖第三方资本和残值信心。因此，客户依赖和融资依赖是重叠的。


              人员风险也看得见。CEO 访谈描述了一种强工程导向文化，甚至承认公司在 2023
              年前后接近破产。这一方面说明韧性很强，另一方面也确认项目一直高度依赖创始人的判断、融资时点和执行纪律。董事会、继任和组织披露稀疏，关键人和执行集中风险仍然高。
