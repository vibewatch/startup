      - number: '5.4'
        title: 差异化与技术依赖
        blocks:
          - type: paragraph
            body: >-
              Volant 的产品策略卡在一个很具体的中间地带。相较 EHang，它采用更常规的有人驾驶客运飞机架构，客舱、载荷和航线灵活性明显更高；但也背上了飞行员培训和取证负担，而全自动观光飞行器可以部分避开这些负担。相较
              Joby、Archer 和 Wisk，Volant 公开披露的工程面更窄，成熟度也早于那些已经讨论 TIA 符合性飞机、阿联酋有限商业框架或全自主堆栈的同行。这并不说明 Volant
              弱；它说明公司从中国优先的认证和制造基地出发竞争，而不是走最充分公开子系统信息的路线。


              真正的技术依赖因此不止飞机本身。Volant 需要推动 CAAC 型号合格审定持续向前，把 AC101
              的经验工业化为可重复生产，拿到运营方培训路径，对齐垂直起降场和航线基础设施，最终还要处理下游运营批准或出口端行政要求。CEO 访谈清楚说明管理层理解这套生态逻辑：公司把自己定位为 OEM
              和运营服务提供商，而不是每条航线天然的长期拥有者。


              尽调视角下，最重要的结论是：Volant 的技术风险并不藏在某个神秘单一模块里，而是分散在认证纪律、飞行员可用性、供应商就绪度、生产质量和基础设施耦合中。公开资料证明了进展，但还没有证明商业规模上的可重复性。
