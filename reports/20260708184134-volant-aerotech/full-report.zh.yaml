      - CV023
      - CV025
      - CV037
      - CV040
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 股权结构与优先权
        - 清算优先权、投资人权利、反稀释、创始人持股
        - 即便名义估值不变，也可能大幅改写真实进入经济性
        - 向管理层 / 律师索取最新股权表和融资文件
      - - 烧钱与现金跑道
        - 当前现金、月度烧钱、资本开支、下一轮触发条件
        - 决定当前估值标记是稳固还是脆弱
        - 索取月度经营模型和融资计划
      - - 订单簿硬度
        - 逐客户核查约束力、定金、取消条款和交付里程碑
        - 订单簿质量是估值溢价核心
        - 审阅已签合同和管线矩阵
      - - 取证信心
        - 关键路径、未关闭问题、团队厚度和进度偏差
        - 情景权重的主要驱动因素
        - 索取监管工作计划和内部里程碑看板
      - - 航线经济性
        - 保险、垂直起降场、利用率、维修和飞行员假设
        - 决定取证后的价值能否支撑当前价格
        - 按首批航线索取走廊级单位经济模型
      - - 治理与退出准备度
        - 董事会构成、审计准备、实体结构和 IPO 准备状态
        - 影响退出折现率和组织韧性
        - 审阅治理资料包；如有，审阅上市准备材料
    notes: 表中问题按估值敏感度排序，而不是按叙事吸引力排序。
    claimRefs:
      - CV014
      - CV023
      - CV029
      - CV036
      - CV037
      - CV038
