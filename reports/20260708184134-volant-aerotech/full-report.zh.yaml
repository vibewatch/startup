      - number: '4.2'
        title: 定价、单位经济性与经营杠杆
        blocks:
          - type: paragraph
            body: >-
              客运 eVTOL 单位经济性仍主要是模型，不是已验证事实集，Volant
              也不例外。公司不披露飞机目录价、租赁费率表、航线级定价、毛利率路径或电池更换假设。即使订单头条也必须谨慎看待，因为名义订单价值除以飞机数量，只能得到粗略方向性代理，而不是可融资的实际成交价。因此，公开证据只能支撑一个单位经济性框架：飞机制造成本、融资或租赁成本、利用率、充电和维护成本、保险、航线费用和人力，全都夹在硬件和任何可持续利润率之间。


              同行案例同时给出希望和警示。Faxiangongchang 报道，EHang 目前旅游运营每次飞行约 880 元、每次补贴 100-300
              元，说明存在真实付费需求，但还不是清晰自我维持的市场模型。同一报道也凸显制造成本与用户目前愿为短途飞行支付价格之间的巨大缺口。Beta 的公开材料值得注意，因为它明确框定能源经济性——VTOL 能源成本约
              US$28 / 小时，对照 Bell 407；CTOL 约 US$18 / 小时，对照 Cessna 208——Volant 公开层面没有这样做。


              经济含义很简单：Volant 的财务质量不太取决于抽象
              TAM，更取决于它能否足够快地降低单次飞行成本，从而支撑高频航线且不长期依赖补贴。在公司公布航线经济性或进入商业运营前，公开投资人无法区分一家潜在有吸引力的飞机企业，和一个被稀缺资产热情遮住的资本黑洞。
