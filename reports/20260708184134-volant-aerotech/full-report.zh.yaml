  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 认证、安全和融资风险如何传导到客户、收入时间和估值。
    data:
      nodes:
        - id: cert
          label: 认证延误
        - id: burn
          label: 更长烧钱期 / 融资需求
        - id: cust
