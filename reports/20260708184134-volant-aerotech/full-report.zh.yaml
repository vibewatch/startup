    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 牛市、基准和熊市里程碑状态下的示意性估值区间。
    data:
      items:
        - label: 熊市情形
          low: 500
          mid: 700
          high: 900
        - label: 基准情形
          low: 1200
          mid: 1450
          high: 1600
        - label: 牛市情形
          low: 1800
          mid: 2200
          high: 2600
    approximationNotes: 这些区间以百万美元表示，依据里程碑概率、同业市值背景和下行情景可比证据，而不是已披露的财务模型。
    claimRefs:
      - CV016
      - CV017
      - CV018
      - CV025
      - CV032
      - CV040
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 最关键指标和最大披露缺口的紧凑 KPI 快照。
    data:
