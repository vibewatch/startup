      - number: '1.3'
        title: 融资历史、估值与投资人结构
        blocks:
          - type: paragraph
            body: >-
              Volant 走过一串快速融资，从一家典型中国硬科技创业公司，变成资本密集型 eVTOL 领先者。公司和媒体信息显示，2022 年中公司完成超过 RMB100M 的 Pre-A 轮，2024
              年前又完成多轮融资，随后在 2026 年连续拿下两轮头部融资：2026 年 4 月下旬宣布 US$300M C 轮，2026 年 5 月下旬宣布近 RMB1B C+ 轮。C 轮由迪拜 Stone Venture
              领投，HSG、Fortera Capital、Future Capital 和 Legend Capital 参投；C+ 轮引入 China Life Sci-Tech Fund、Shanghai Minhang
              Jintou、NIO Capital、CCT Stone / Cornerstone 和 China Internet Investment Fund。


              投资人组合和总融资额同样重要。第三方报道普遍把股东结构变化解读为：公司从风险投资主导的技术验证，转向为认证、制造和商业化筹集耐心资本。国资背景基金、保险资本和汽车产业投资人格外关键，因为客运 eVTOL
              是长周期认证业务，重工具、重供应链，也重监管依赖。这个解读与管理层表态一致：融资用途指向适航认证、量产和全球商业化，而不是品牌建设。


              到 2026 年 6 月，报道通常称公司累计融资超过 RMB5B，并在 Hurun 2026 Global Unicorn Index 中获得 US$1.5B 估值。部分中文媒体称 Volant
              是国内估值第三高的 eVTOL 玩家，Bamboo Works 则报道，当地媒体把新融资与潜在香港 IPO
              联系起来。融资事实很强；资本结构细节不强。没有公开来源披露投后股本、清算优先权、反稀释保护、二级交易或创始人稀释路径。
