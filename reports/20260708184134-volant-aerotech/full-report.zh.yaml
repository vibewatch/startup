  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 谁真正与 Volant 竞争
        blocks:
          - type: paragraph
            body: >-
              围绕 Volant 的竞争集常被谈得太松。不是每家 eVTOL 公司都是直接替代品。EHang 领先于自主、两座、短途城市观光和低空旅游；AutoFlight 同时覆盖货运认证和六座客运飞机；Joby 和
              Archer 是有人驾驶客运项目，针对西方认证和高端接驳网络优化；Beta 强调多任务客运与货运运营，航程经济性异常突出；Wisk 聚焦自主优先的客运服务；Volocopter
              在行业受挫后，更像一个欧洲警示参照，而不是仍然活跃的基准。因此，Volant 面对的是直接对手和邻近对手的混合。


              从直接构型看，Volant 最接近有人驾驶、六座、有翼客运 eVTOL 群体。VE25-100 与 AutoFlight 的 Prosperity 同为 1+5 座布局，200-400 km
              头部航程则把它放到更长航程客运场景，而不是纯城区内旅游跳点。若脱离背景拿 EHang 来比较，会产生误导：EHang 是中国商业认证和付费运营的最佳证明点，但它解决的是不同的座舱、自主性和航线问题。


              更有用的竞争视角，是按同行已经证明了什么来分层。EHang 已证明自主旅游认证和早期商业化。AutoFlight 已证明重载货运认证，并保留客运邻近性。Joby 和 Archer
              已证明公开市场融资渠道、大额流动性和深度西方认证进展。Beta 已证明航程和运营经济性定位。相比之下，Volant 最强的是中国融资动能和订单簿广度，但在硬性公开证明上，仍弱于每条邻近赛道的领先者。
