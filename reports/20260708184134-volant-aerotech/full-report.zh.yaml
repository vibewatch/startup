      - number: '1.5'
        title: 封面指标、证据质量与公开缺口
        blocks:
          - type: paragraph
            body: >-
              Volant 最强的公开封面指标，是融资、估值、产品规格和订单簿规模。融资故事得到异常充分的交叉印证：2026 年 4 月 US$300M C 轮、2026 年 5 月近 RMB1B C+ 轮、累计融资超过
              RMB5B，以及 Hurun 的 US$1.5B 独角兽估值。产品规格在官方和第三方来源中也稳定：六座、载荷 500 kg、航程 200-400 km、巡航速度约 235
              km/h。客户牵引力可见，但必须谨慎拆解，因为公司报告的是确认订单和意向书混合池，而不是干净的确定订单交付表。


              最弱的公开指标，恰恰是私营公司承保最看重的项目。Volant 不披露收入、烧钱速度、毛利率、现金跑道、准确员工数或单位经济性。公开来源也没有把 1,900
              架头部订单簿拆成定金、约束性合同和软性意向书。同样，公开股权结构缺少董事会构成、创始人持股、优先权条款和二级交易。这些缺口不是装饰性空字段；它们正决定独角兽估值究竟由产业准备度支撑，还是只由稀缺资产热情推高。


              因此，后续章节应把公司声称的里程碑和订单数字视为重要证据，但不能等同于已认证交付、已确认收入或已披露经济性。Volant
              的公开档案足以确认身份、领导层、融资、客户兴趣和认证动能；还不足以跨过后期私募尽调在财务透明度、治理透明度和合同质量上的正常门槛。
