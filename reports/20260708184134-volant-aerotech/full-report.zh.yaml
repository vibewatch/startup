        title: 可比公司与情景区间
        blocks:
          - type: paragraph
            body: >-
              Volant 最好的公开可比框架是混合框架。Joby 和 Archer 等公开市场客运 eVTOL 龙头，为这个品类仍有多昂贵提供透明但仍亏损的基准。EHang
              提供了最相关的中国商业化证据，因为它已有实际售票运营；但其市值明显低于 Joby 和 Archer，且仍反映早期经济性。Lilium 和 Volocopter
              等困境案例也重要，并不是因为它们在业务质量上是直接可比公司，而是因为当融资、认证和商业化不同步时，它们定义了行业下行的物理规律。


              在这个基础上，Volant 的隐含价格落在一个尴尬区间的中部。它远低于 Joby 和 Archer 的公开市值，这合理，因为两家公司披露更多、公开资本通道更强；但它也显著高于 EHang 市值，而 EHang
              今天拥有更强运营证据。这不自动说明 Volant 被高估；它意味着投资者在为另一组可能性付费——更大客运飞机的经济性、中国政策杠杆、强融资财团和大额公开订单储备。问题在于，其中大部分优势仍取决于里程碑兑现。


              因此，情景估值比点估值更清楚。若认证按计划推进、订单储备转化、中国低空经济让整个板块重估，牛市情景可以支撑明显高于 US$1.5 billion 的价格。基准情景让 Volant
              大致停留在当前独角兽区间。若认证滑期或客户承诺软化，熊市情景会迅速压缩到后期私募困境估值，或公开市场低个位数十亿美元市值水平。
