  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Volant 到底在卖什么
        blocks:
          - type: paragraph
            body: >-
              Volant 卖的不是泛泛的“空中交通”。它在打造一款有人驾驶、客运级、升力-巡航 eVTOL
              飞机——VE25-100——以及让这架飞机可部署所需的培训、制造和运营商赋能栈。放到客户工作流里，产品是一副可跑航线的机体，航空公司、租赁平台、旅游运营商、救援单位或区域交通伙伴可以把它纳入认证运营、配置机组、维护，并最终扩成小型机队。


              公司产品页和新闻页面中的公开规格保持一致。Volant 把 VE25-100 描述为一款 1 名飞行员、5 名乘客的飞机，最大起飞重量 2,500 kg，载荷 500 kg，巡航速度 235 km/h，航程
              200-400 km。公司认为这个包线足够多用途，可覆盖机场或城际接驳、岛屿航线、观光、应急救援和货运邻近任务。这在战略上重要，因为 eVTOL
              的首个商业用例很少是“大众通勤”；通常是哪条航线能承受高价、运营复杂性和逐步监管爬坡，哪条航线先跑出来。


              关键细节是，Volant 的产品仍是飞机平台，不是已经完成的交通网络。因此，商业表面不只包括座舱和航程数字：运营商培训、航线适配、维护准备度、低空基础设施协调和认证进展，不管公司是否愿意，都属于产品定义的一部分。
