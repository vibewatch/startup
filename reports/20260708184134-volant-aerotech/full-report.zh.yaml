      - number: '6.4'
        title: 扩张飞轮与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Volant
              可能的扩张飞轮不是消费者病毒式增长，而是账户深耕。一段初始关系可以从战略合作协议开始，发展为具体型号培训和维修合作，转化为确认订单或定金，并在认证完成后才变成机队扩张账户。航空公司、租赁和基础设施伙伴之所以重要，原因在于它们既能塑造第一条航线，也能影响第二笔订单。


              同一结构也带来集中度风险。公开客户证据集中在少数锚定账户，订单储备的大部分仍不够具体。如果一两个旗舰客户延期、缩量或重新界定范围，市场对订单储备质量的观感会明显变化。认证节奏、运营批准、基础设施就绪度和运营方培训，都隔在今天的订单储备和明天的机队收入之间。


              因此，最均衡的结论很窄：Volant 的具名客户证据好于许多概念期 eVTOL 创业公司，但还没有足够已交付客户证据来证明持久留存或广泛多元化。
