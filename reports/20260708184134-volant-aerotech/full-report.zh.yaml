      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Volant 的买方地图是多边的。商业客运航线中，飞机买方可能是租赁公司或地方国资平台，运营方可能是通用航空公司或航空公司旗下单位，终端用户是乘客，有效付款方则可能是乘客，也可能是航线赞助方。这种复杂性已经出现在
              Volant 披露的客户组合里：China Southern Airlines General Aviation 和 Asian Express 代表运营商式需求，ABC Financial Leasing
              代表融资通道，而不是直接终端用户。Pan Pacific 等海外交易对手，更偏向航线开发联盟和基础设施主导部署，而不是纯粹替代航空公司。


              因此，近期采用路径取决于具体场景。旅游和观光可以承受高价、固定航线和计划运营，中国监管者也已经为首个商业 eVTOL
              使用场景建立了针对性观光规则框架。公共服务和应急任务可以依赖政府预算，遭遇的政治阻力可能低于大众客运通勤。物流在更广义低空经济里拥有最清晰的收入证明，但 Volant
              当前旗舰机型首先针对客运优化，而不是纯货运平台。


              这种买方复杂性也改变了商业化时钟。飞机认证本身不能解锁收入：运营商还需要航线审批、垂直起降机场或起降点准入、充电和维护支持、保险、受训飞行员，有些场景还需要地方政府协调。因此，Volant
              最现实的早期市场，是一组有赞助、固定场景的部署，而不是第一天就无限制铺开的城市空中出租车网络。
