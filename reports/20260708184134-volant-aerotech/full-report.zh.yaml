  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开资料到底支持怎样的价格
        blocks:
          - type: paragraph
            body: >-
              公开资料支持一个强结论和一个弱结论。强结论是，在外部观察者眼中，Volant 已经跨过独角兽门槛：Hurun 2026 Global Unicorn Index 把 Volant 估值列为 US$1.5
              billion，多篇 2026 年融资报道也确认，公司在约一个月内完成了 US$300 million 加近 RMB1 billion
              的罕见融资爆发。弱结论是，投资者通常需要用来支撑这个价格的几乎所有其他信息——收入、利润率、烧钱、资金跑道、交付节奏、合同质量，以及清算或优先权结构——大多仍未披露。


              这意味着估值必须被看作一个按概率加权的里程碑练习，而不是经典收入倍数或 DCF 练习。正确的问题不是“Volant
              今天应该按多少倍交易？”，而是“当前估值已经计入了多少未来认证和商业化曲线？”按这个基础看，Hurun 的 US$1.5 billion
              信号合理，但并不让人安心。它反映了真实的融资深度、真实的客户可选性和强政策顺风，也反映了大量尚未证明的执行。


              中国媒体约 RMB7.2 billion（~US$1.0
              billion）的较低估计在方向上重要，因为它说明并非所有观察者都锚定同一个价格。合理解读不是其中一个来源必然错误，而是价格发现仍然嘈杂：私募估值、战略信号和经营证据还没有干净对齐。
