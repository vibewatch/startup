      - number: '3.3'
        title: 定价、打包与落地模式
        blocks:
          - type: paragraph
            body: >-
              很少有 eVTOL OEM 公开完整飞机定价，因此落地结构比标价更有信息量。Volant 的公开客户组合显示出混合模式：向航空公司和通用航空运营商直接销售或分配飞机，借 ABC Financial Leasing
              等金融租赁方部署，并在海外和中国推进场景主导的旅游或公共服务航线。EHang 更接近围绕已认证飞机和运营人合格证搭建的一体化服务或航线模型。Joby 和 Archer 围绕高端空中出租车网络、早期城市首发和
              app / 航线合作定位。Beta 更偏飞机加基础设施，强调能源成本和任务经济性，而不是消费者空中出租车叙事。


              所以，Volant 的竞争不只在硬件上，也在于如何打包完整商业化闭环。一架六座飞机卖给租赁公司，再经由国资背景运营商跑航线，与一架自主观光飞机卖入景区固定航线，或一条经由消费者 app 体验售卖的 Dubai /
              Abu Dhabi 高端接驳，是完全不同的经济产品。Volant 具名交易对手广，令人鼓舞，因为这暗示公司意识到了这些打包差异。


              弱项是披露质量。Volant 没有公开拆分约束性订单、期权、租赁结构、定金和航线经济性。Joby 和 Archer 对流动性和启动顺序披露更多；EHang 对实际商业运营披露更多；Beta
              对能源成本框架披露更多。因此，Volant 看起来商业想象力强，但相比领先同行，如何把模型变现仍不够透明。
