    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品边界与运营足迹
        blocks:
          - type: paragraph
            body: >-
              Volant Aerotech 是一家中国民营先进空中交通创业公司，重点开发高等级商用客运 eVTOL 飞机。公司官方英文材料称，Shanghai Volant Aerotech Co., Ltd. 成立于
              2021-06-01，总部位于上海，并在自贡运营一个智能制造与试飞基地，设计年产能约 300 架。公司明确把自身定位在客运，而不是爱好者无人机或纯货运无人机，并将 VE25-100
              定义为首款面向商业客运的旗舰机型，同时也允许旅游、公共服务、物流和救援变体。


              当前产品面收敛，但商业野心不小。Volant 将 VE25-100 描述为六座升力-巡航飞机，配置 1 名飞行员和 5 名乘客，载荷 500 kg，航程 200-400 km，巡航速度 235
              km/h。公司称，飞机采用 8 台电机和多重冗余，并已完成单推进器失效、应急着陆等高风险测试项目。这组规格让 Volant 更接近 eVTOL
              市场中更重、更偏有人驾驶区域空中交通的一侧，而不是小型自主多旋翼竞争者。


              因此，运营故事把身份、产品和产业化紧紧绑在一起：上海提供总部和融资通道，自贡承载测试和生产基础设施，VE25-100
              则是唯一的认证和商业化切入口。这种集中度给投资人和客户一个清晰叙事，但也意味着公司近期命运高度绑定在一个飞机项目、一条监管主导的认证路径和一个规划制造基地上。
