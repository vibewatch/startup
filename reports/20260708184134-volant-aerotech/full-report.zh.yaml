      - number: '1.4'
        title: 认证进展、订单与里程碑
        blocks:
          - type: paragraph
            body: >-
              按客运 eVTOL 标准看，Volant 的里程碑推进很快，但并非没有模糊地带。官方材料称，公司 2021 年成立，2022 年 8 月推出 X1 全尺寸技术验证机，2023 年 1
              月完成首飞，随后完成过渡飞行里程碑，并在 2025 年推出 AC101 开发机。公司还称，截至 2026 年 3 月，VE25-100
              已完成行业首次空中压载试验、首次不限高自由飞行、首次有人驾驶飞行、空中推力测定测试，以及动力装置和全机风洞测试。这些节点支撑了一个判断：Volant 已经越过概念设计，进入面向认证的工程执行。


              核心商业里程碑是订单簿。Volant 官方 About 页面称，公司已获得超过 1,900 份意向书和确认订单，总价值超过 RMB47.5B，客户包括 China Southern Airlines
              General Aviation、Asian Express、ABC Financial Leasing、Beijing E-Town Financing Leasing、自贡国资实体、China
              Aviation Rescue & Emergency、CAR Inc.、China General Aviation、China Fei Long General Aviation 和
              DeerJet。外部报道给了更多颗粒度：Yicai 和官方转载称，其中超过 500 架来自海外，覆盖泰国、阿联酋和德国客户；Thailand Pan Pacific 协议单项覆盖 500 架，名义金额
              US$1.75B；ABC Financial Leasing 签下 10 架确认订单，并拥有 110 架期权。


              剩下的闸门事件是型号认证。公开来源一致显示，VE25-100 自 2023-2024 年起进入 CAAC 华东型号认证工作，并在 2024 年和 2025
              年召开实质性审查会，但具体受理日期并不一致。时间表也发生过变化：部分 2025 年材料称预计 2026 年取证，而 2026 年 4-5 月的报道和管理层表态把目标推到 2027 年或 2027
              年上半年。这种滑期不等于失败，但它是判断 Volant 能否从融资项目转成运营企业时最重要的进度事实。
