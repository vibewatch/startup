      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              中国政策组合是真实的需求加速器。本章审阅的来源指向多项政策：2026-07-01 生效的修订版 Civil Aviation Law、2026 年初的标准计划（目标到 2030 年形成 300
              多项行业标准）、把低空经济列为战略性新兴产业的第十五个五年规划，以及 NDRC 和 CAAC
              层面的专门治理机构。深圳、合肥和广东的基础设施规划显示，支持不止停留在叙事层面：资金会进入垂直起降机场、航线和数字空域项目。这些条件明显好于多数西方客运 eVTOL OEM 目前在 UAE 之外能拿出的条件。


              同时，瓶颈是结构性的。基础设施仍要建设，空域管理仍要数字化，即使规模不大的有人驾驶机队，也可能在每个枢纽带来公用事业级电力和维护需求。认证栈同样有多层：飞机型号认证必不可少，但它还要与运营人合格证、航线规划、垂直起降机场许可和消费者保护规则并行。EHang
              和 AutoFlight 的证据显示，中国监管者可以推进很快；但证据也显示，迄今最快的进展要么来自自主两座旅游，要么来自货运平台，而不是 Volant 正在追逐的六座有人驾驶客运类别。


              对 Volant
              而言，需求时点高度取决于路径。市场背景足够有吸引力，可以支撑投资人持续兴趣和客户试验。但真实采用曲线，将由客运级认证、基础设施建设、航线审批、融资渠道和客户信心能多快在同一批城市和走廊里汇合决定。换句话说：政策铺出跑道，商业化仍要靠运营闭环。
