  - id: TV002
    title: 正反论点表
    columns:
      - 论点
      - 什么会改变观点
    rows:
      - - 中国政策支持、强劲融资动能，加上真实的客户 / 认证叙事，足以支撑一家领先国产载人 eVTOL 企业的独角兽地位。
        - 只要在认证概率、航线经济性和合同质量上拿出更多证据，这一论点会明显增强。
      - - 当前估值可能已经在收入、利润率和资金跑道公开可见之前，提前计入了相当大一部分未来成功。
        - 如果入场价格明显更低，或非公开数据更强，这一担忧会减轻。
      - - 如果能按时进入市场，Volant 更大的载人飞行器设计空间，长期结果可能优于较小、旅游优先的架构。
        - 如果认证继续延期，或航线经济性仍不清楚，这一优势会变成昂贵负担。
      - - 客户名称、保证金和国际意向带来有意义的战略期权价值。
        - 如果锚定客户在认证后缩小规模、推迟或未能转化，期权价值应大幅折价。
    notes: 投资争论主要围绕价格和概率，而不是公司是否“有意思”。
