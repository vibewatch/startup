      - number: '3.4'
        title: 护城河耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Volant 的潜在护城河来自几项组合：中国政策同频、大额国内融资、有意义的订单簿广度，以及瞄准高价值客运细分而非商品化无人机的产品形态。这些优势真实存在。公司还受益于一个已经诞生 EHang
              这类已认证客运先行者、AutoFlight 这类货运认证先行者的监管环境，说明中国确实能推动飞机穿过认证栈。


              但竞争风险同样具体。EHang 已在中国拥有最强认证品牌。AutoFlight 有更清晰的货运证明叙事，也有直接可比的六座客运架构。Joby 和 Archer 拥有更强公开资产负债表和更深披露的认证活动。Beta
              具备更长航程的运营经济性，以及可信的货运 / 客运双用性。如果监管者接受远程客运监督，Wisk 的自主优先模型可能变得更有吸引力。欧洲失败案例也说明，资本密集本身并不能带来生存权。


              因此，今天不应把 Volant
              评为拥有明确产品护城河。若它能在市场结构固化前，把资本和客户兴趣转化成已认证飞机和可靠航线，就有机会走出护城河。在此之前，它的护城河仍是潜力而非事实；竞争风险在于，分类更清晰的领导者继续占有投资人和运营商最重视的证明点。
