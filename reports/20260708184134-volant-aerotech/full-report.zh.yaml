  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型表面与公开披露现实
        blocks:
          - type: paragraph
            body: >-
              Volant
              可能的经济模型不难理解，尽管公开数字看不清。公开材料和客户披露显示，收入可能来自几类：向运营商销售或分配飞机、经由金融租赁方部署、收取客户定金或预付款，并在认证机队投入运营后，逐步从维护、培训、航线运营或关联服务中获得重复收入。这是客运
              eVTOL 公司的标准变现栈。但与成熟航天航空或出行公司不同，Volant 在已审阅公开档案中不披露收入、年化收入节奏、毛利率、烧钱速度、员工数或单位经济性细节。


              今天最具体的公开财务证明点不是收入，而是融资和需求可选性。2026 年 4-5 月报道显示，Volant 在数周内完成 US$300M C 轮和近 RMB1B C+ 轮，把累计资本推高到 RMB5B
              以上。批评性报道还称，公司已收取近 RMB100M 定金；这对营运资金验证有意义，但仍不等于重复服务收入或已交付飞机收入。同一报道明确警告，1,900 架订单头条混合了确定承诺和更软的兴趣。


              这让 Volant 处在后期深科技公司熟悉的位置：经济模型读得懂，承保数据看不到。公开投资人能看到未来应有哪些收入流，却无法测试当前成本结构、定价纪律或合同质量是否让这些收入流足够有吸引力。
