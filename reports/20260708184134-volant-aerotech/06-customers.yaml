tables:
- id: TU001
  title: Customer Segmentation Table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale / strategic value
  - Gap
  rows:
  - - General aviation / airline operators
    - Buyer and operator often aligned; end user is passenger or mission customer
    - Sightseeing, short-haul passenger, inter-island, rescue support
    - Strongest near-term proof because operators understand flight ops
    - No public fleet deployment or utilization data
  - - Leasing / financing partners
    - Buyer / financer differs from operator and end user
    - Aircraft financing and channel enablement
    - Can widen adoption by lowering capex burden
    - No public lease economics or residual-value terms
  - - Overseas infrastructure-backed developers
    - Buyer may be developer, operator or SPV; infrastructure partner is separate
    - Island transport, tourism, emergency response
    - Important for export GTM and route creation
    - LOIs depend on certification and infrastructure buildout
  - - Public-service / rescue entities
    - Buyer may be government-linked or mission agency
    - Emergency rescue, medical transfer, public-service missions
    - Useful for early mission-critical validation
    - Procurement cycles and budgets are opaque
  - - Tourism / premium mobility operators
    - Operator serves paying passengers directly
    - Low-altitude tourism, urban / regional premium travel
    - Likely first high-willingness-to-pay routes
    - Demand and regulation still unproven at scale
  notes: Segment definitions focus on who signs, who flies and who ultimately benefits, because those roles are often split in aviation procurement.
