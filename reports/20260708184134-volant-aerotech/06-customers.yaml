company:
  name: Volant Aerotech
chapter:
  number: 6
  title: Customers
  summary: 'Volant’s customer story is real enough to map but still too early to call durable. The strongest public proof is a small set of named, pre-delivery anchor customers—China Southern General Aviation, Asian Express / Inner Mongolia Express, and Pan Pacific—plus deposits and structured cooperation around operations, training and infrastructure. The weakest part is everything that normally follows proof: deliveries, active fleets, repeat purchases, retention metrics and route utilization.'
sections:
- id: customer-segments-and-buyer-roles
  title: Who the Customers Are — and Who Actually Buys vs Uses
  body: 'Volant’s customer base is best understood as a multi-party procurement ecosystem rather than a simple airline sales list. Public materials show at least five customer or partner categories: general-aviation and airline operators, financial lessors, overseas infrastructure or development partners, public-service and rescue organizations, and premium tourism or regional-mobility operators. In many cases the buyer, operator and end user are different. A leasing company may finance the aircraft, a local operator may fly it, and passengers or rescue agencies may be the end users.


    That distinction matters because it changes what “customer traction” means. A logo from a leasing company is not the same as passenger demand; a rescue or public-service partner is not the same as a profitable tourism route; and an overseas infrastructure-backed LOI is not the same as a delivered fleet. Volant’s public customer mix nonetheless fits the category well. Early eVTOL procurement usually starts with counterparties that can tolerate certification delay, influence infrastructure or policy, and think strategically about future route control.


    The customer list also implies a China-first but not China-only GTM path. Domestic names such as China Southern General Aviation, Asian Express, ABC Financial Leasing and Beijing E-Town Financing Leasing point to operator and finance channels at home, while the Pan Pacific / CAIEC structure shows how Volant may export the product into island, tourism and rescue corridors before dense urban air-taxi networks become common.'
