- id: named-customer-proof-and-adoption-trajectory
  title: Named Customer Proof and Adoption Trajectory
  body: 'The strongest public customer proof comes from three named anchors. First, China Southern General Aviation publicly became Volant’s first confirmed-order customer and paid a deposit despite the aircraft not yet being type-certified. That is unusually strong category proof because it shows at least one sophisticated operator was willing to commit capital before final certification. Second, Asian Express evolved from a 118-aircraft letter of intent in 2023 into a later fixed order through its Inner Mongolia Express General Aviation subsidiary, providing one public example of a soft commitment converting into a harder one. Third, Pan Pacific’s July 2025 deal for 500 aircraft, paired with infrastructure support from CAIEC, shows how Volant is packaging overseas deployment as a combined aircraft-plus-infrastructure proposition.


    The broader adoption trajectory is also clear, even if it is still pre-revenue. Public sources say Volant had more than 860 aircraft in strategic cooperation and intended orders worth RMB22 billion by late 2024, then more than 1,900 letters of intent and confirmed orders worth over RMB47.5 billion by mid-2026. Independent reporting further says the company had collected nearly RMB100 million of deposits and that roughly one-third of backlog originated overseas.


    But this is a pipeline curve, not a deployment curve. There is still no public evidence of delivered production aircraft, live customer fleets, route utilization, renewal behavior or repeat ordering. For now the adoption story is measured in commitments, deposits and cooperation depth rather than in flying aircraft.'
