- id: durability-retention-and-reference-quality
  title: Durability, Retention, and Reference Quality
  body: 'Public durability evidence is weak by construction because Volant has not yet disclosed revenue cohorts or delivered fleets. No NRR, GRR, contract-renewal data, customer satisfaction scores or repeat-purchase behavior were found. That is not an indictment of the company so much as a reminder that the sector is still in a pre-scale procurement phase. What can be assessed publicly is the quality of reference evidence. China Southern, Asian Express and Pan Pacific are credible named counterparties with disclosed use cases and, in some cases, deposits or fixed-order language. The rest of the customer set is much less developed publicly: many names are visible only as logos or as part of a broad order book.


    The practical result is that reference quality varies sharply inside the same backlog. Some customers appear to be active co-development or route-design partners. Others appear to be option-like strategic relationships awaiting certification, financing and infrastructure. That means investors should not treat every unit in the backlog as equal.


    Even so, the public file is not showing visible churn or customer withdrawal either. The absence of public unwind evidence is mildly positive, but it cannot replace private diligence on cancellation terms, deposit convertibility, milestone triggers and side letters.'
  claimRefs:
  - CU016
  - CU018
  - CU019
  - CU020
