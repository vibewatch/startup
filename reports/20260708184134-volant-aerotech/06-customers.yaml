- id: TU005
  title: Expansion and Concentration Risk Table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Anchor operator accounts convert after certification
    - High — few publicly strong anchors today
    - If one anchor slips, backlog quality perception worsens quickly
    - Review customer-by-customer milestone schedules and penalties
  - - Leasing-channel expansion
    - Medium — financing partners may be powerful but opaque
    - Channel economics could widen reach or hide weak end demand
    - Request lease terms, residual assumptions and end-customer pipeline
  - - Overseas island / tourism corridors
    - Medium-high — export accounts depend on infrastructure and local approvals
    - Great international optics but heavy execution dependency
    - Review CAIEC and local partner responsibilities, funding and rollout sequence
  - - Public-service / rescue adoption
    - Medium — procurement cycles can be slow and political
    - Can validate mission value but may not scale like passenger fleets
    - Map procurement budgets, mission demand and tender timing
  - - Operator-service deepening (training, maintenance, ops support)
    - Positive expansion loop if real
    - Can turn one aircraft sale into long-tail service revenue and follow-on orders
    - Request signed scopes of work and service economics
  notes: Concentration risk is more important than churn risk today because backlog quality is visible while delivered-customer diversification is not.
