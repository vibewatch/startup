chapter:
  number: 7
  title: Risks
  summary: Volant’s risk stack is dominated by certification timing, backlog quality, infrastructure and insurance friction, and funding duration. The company has enough progress to stay investable, but the category’s recent insolvencies and China’s still-evolving low-altitude safety regime make this a high-residual-risk program where one or two missed milestones can reprice the entire thesis.
sections:
- id: risk-rank-overview
  title: What Actually Breaks the Thesis First
  body: 'Volant’s risk profile is not primarily about whether eVTOL is an interesting idea. The real question is which dependency breaks first: certification schedule, financing duration, backlog conversion, infrastructure readiness, or public trust after a safety event. The current public file points most strongly to four top-tier risks. First, type certification and downstream operating approvals still gate everything. Second, the order book is large but mixed in quality, with limited public contract detail. Third, low-altitude infrastructure, insurance and regulatory coordination are still being built in real time. Fourth, the sector remains vulnerable to capital-market whiplash, as shown by recent peer insolvencies.


    The interaction between these risks matters more than any single row in a register. A certification slip extends burn. Extended burn increases financing dependence. Financing dependence makes customers more cautious. Customer caution weakens backlog quality. Weaker backlog quality raises the discount rate on the next round. That is the true risk transmission chain.


    Accordingly, this chapter ranks Volant’s residual risk as high even though no single public source proves imminent failure. The program looks serious; the system around it is still fragile.'
  claimRefs:
