- id: TR005
  title: Mitigation and Kill Criteria Table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Certification timing
    - Public schedule slippage
    - Another material delay beyond H1 2027 without clear causal closeout
    - Increase required return; re-underwrite runway and customer confidence
  - - Backlog quality
    - Anchor-customer change
    - Evidence that China Southern, Asian Express or Pan Pacific reduce, cancel or materially defer commitments
    - Treat backlog multiple as impaired and revisit valuation floor
  - - Funding dependency
    - Capital-market access
    - Next round requires sharply weaker terms or emergency structure
    - Shift thesis from growth financing to survival financing
  - - Safety / public trust
    - Public incident tied to Volant aircraft or related operations
    - Fatal or high-profile safety event, or regulator-imposed pause
    - Freeze bullish commercialization assumptions until root cause and regulator stance clear
  - - Insurance / infrastructure bottleneck
    - Route-launch blockers
    - Indicative insurance exclusions, unaffordable premiums, or vertiport delays on flagship corridors
    - Lower probability of near-term operations and reduce revenue timing confidence
  - - Execution concentration
    - Leadership disruption
    - Unexpected founder / technical leader departure without clear bench
    - Demand stronger governance discount or pause conviction
  notes: Kill criteria are intentionally observable and tied to real-world events rather than narrative sentiment.
