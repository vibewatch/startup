  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial opacity
    missingEvidence: Revenue, burn rate, cash runway, gross margin and exact headcount remain undisclosed in public sources.
    whyItMatters: A late-stage hardware company can look well funded publicly but still be undercapitalized relative to certification and production burn.
    diligencePath: Request monthly management accounts, cash-runway planning, headcount by function and audited 2025/2026 financial statements under NDA.
    relatedQuestionRefs:
    - QO017
    - QO022
  - type: private-evidence-only
    severity: material
    topic: governance opacity
    missingEvidence: Board composition, founder ownership, liquidation preferences, anti-dilution terms and secondary activity are not publicly disclosed.
    whyItMatters: These fields determine real control, downside protection and effective entry price at a unicorn valuation.
    diligencePath: Review the cap table, shareholder agreements and board materials from the most recent financing rounds.
    relatedQuestionRefs:
    - QO009
    - QO023
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: minor
    topic: certification timing
    missingEvidence: Public sources disagree on the exact date when the VE25-100 TC application was accepted or formally entered review.
    whyItMatters: The difference is not thesis-breaking but matters for benchmarking Volant’s certification velocity against peers.
    diligencePath: Request the CAAC project-acceptance notice, project code and official milestone tracker from the company or regulator-facing counsel.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO004
  - type: conflicting-data
    severity: material
    topic: orders
    missingEvidence: The public file does not cleanly split confirmed orders, options, letters of intent, deposits and delivery schedules inside the 1,900-aircraft headline.
    whyItMatters: Backlog quality is a central input into commercialization credibility and any revenue-weighted valuation view.
    diligencePath: Obtain a customer-by-customer pipeline with contract type, deposit status, cancelability, pricing and expected delivery timing.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO001
    - TO004
  - type: missing-source
    severity: minor
    topic: ipo
    missingEvidence: The Hong Kong IPO path is discussed by media but not confirmed in an official filing or company statement.
    whyItMatters: IPO timing affects liquidity expectations and near-term valuation psychology, but should not be assumed as a fact.
    diligencePath: Wait for a formal exchange filing, mandate announcement or company confirmation before underwriting an IPO path.
    relatedQuestionRefs:
    - QO015
  - type: missing-source
    severity: minor
    topic: adverse events
    missingEvidence: No public lawsuits or sanctions were surfaced in the reviewed sources, but absence cannot be proven from sector media alone.
    whyItMatters: Undisclosed legal or regulatory issues would matter disproportionately for a certification-dependent aviation company.
    diligencePath: Run court, sanctions and administrative-penalty checks in Chinese legal databases and request litigation disclosure from management.
    relatedQuestionRefs:
    - QO024
