company:
  name: Volant Aerotech
chapter:
  number: 1
  title: Company Overview
  summary: Volant Aerotech is a Shanghai-based Chinese passenger-eVTOL developer founded in 2021, building the six-seat VE25-100 and a Zigong manufacturing-and-flight-test base. In April-May 2026 it raised back-to-back Series C and C+ rounds totaling about US$440 million to push CAAC certification and commercialization, and Hurun valued it at about US$1.5 billion in the 2026 Global Unicorn Index.
sections:
- id: identity-and-operating-surface
  title: Identity, Product Surface, and Operating Footprint
  body: 'Volant Aerotech is a private Chinese advanced-air-mobility startup focused on high-grade commercial passenger eVTOL aircraft. Official English-language company materials say Shanghai Volant Aerotech Co., Ltd. was established on 2021-06-01, is headquartered in Shanghai, and operates a smart manufacturing and flight-test base in Zigong that is designed for annual output of roughly 300 aircraft. The company positions itself explicitly around passenger transport rather than hobbyist or cargo-only drones, and frames the VE25-100 as its first flagship aircraft for commercial passenger transport while still allowing tourism, public-service, logistics and rescue variants.


    The current product surface is concentrated but commercially ambitious. The VE25-100 is presented as a six-seat lift-plus-cruise aircraft with one pilot and five passengers, 500 kg payload, 200-400 km range and 235 km/h cruise speed. Volant says the aircraft uses eight electric motors with multiple redundancy and has already completed high-risk test items such as single-propulsor-failure and emergency-landing tests. That specification package places Volant closer to the heavier, piloted, regional-air-mobility side of the eVTOL market than to smaller autonomous multicopter competitors.


    The operating story therefore links identity, product and industrialization tightly: Shanghai for headquarters and financing access, Zigong for test and production infrastructure, and the VE25-100 as the single certification and commercialization wedge. That concentration gives Volant a coherent narrative for investors and customers, but it also means the company''s near-term fate is heavily coupled to one aircraft program, one regulator-led certification path and one planned manufacturing footprint.'
