      - number: '4.2'
        title: Pricing, Unit Economics, and Operating Leverage
        blocks:
          - type: paragraph
            body: >-
              Passenger-eVTOL unit economics are still mostly a model, not a demonstrated fact set, and Volant is no
              exception. The company discloses no aircraft list price, no lease-rate card, no route-level pricing, no
              gross-margin path and no battery-replacement assumptions. Even the order headline should be treated
              carefully because notional order value divided by aircraft count produces only a rough directional proxy,
              not a bankable realized price. Public evidence therefore supports only a framework for unit economics:
              aircraft build cost, financing or leasing cost, utilization, charging and maintenance cost, insurance,
              route fees, and labor all sit between the hardware and any lasting margin.


              Peer examples show both promise and caution. Faxiangongchang reports that EHang’s current tourism
              operations around 880 yuan per flight with subsidies of 100-300 yuan per flight represent real paying
              demand but not yet a clearly self-sustaining market model. The same report highlights the wide gap between
              manufacturing cost and what users are currently willing to pay for short flights. Beta’s public materials
              are notable because they frame energy economics explicitly—about US$28 per hour for VTOL energy against a
              Bell 407 reference and US$18 per hour for CTOL against a Cessna 208 reference—something Volant does not do
              publicly.


              The economic implication is simple: Volant’s financial quality will depend less on abstract TAM and more
              on whether it can lower per-flight cost fast enough to support high-frequency routes without permanent
              subsidy. Until the company publishes route economics or reaches commercial operations, public investors
              cannot distinguish a potentially attractive aircraft business from a capital sink masked by scarce-asset
              enthusiasm.
