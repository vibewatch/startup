      - number: '1.3'
        title: Funding History, Valuation, and Investor Stack
        blocks:
          - type: paragraph
            body: >-
              Volant accelerated from a typical Chinese hard-tech startup into a capital-intensive eVTOL frontrunner
              through a rapid sequence of rounds. Company and media sources indicate a pre-A round above RMB100 million
              in mid-2022, multiple additional financings through 2024, and then two headline rounds in quick succession
              during 2026: a US$300 million Series C announced in late April 2026 and a nearly RMB1 billion Series C+
              announced in late May 2026. The Series C was led by Dubai-based Stone Venture with participation from HSG,
              Fortera Capital, Future Capital and Legend Capital, while the C+ introduced China Life Sci-Tech Fund,
              Shanghai Minhang Jintou, NIO Capital, CCT Stone / Cornerstone and China Internet Investment Fund.


              The investor mix matters as much as the gross dollars. Third-party coverage consistently interprets the
              cap-table shift as a move from venture-led technology validation toward patient capital for certification,
              manufacturing and commercialization. State-backed funds, insurance-linked capital and auto-industry
              investors are especially relevant because passenger eVTOL is a long-cycle certification business with
              heavy tooling, supply-chain and regulatory dependencies. That interpretation is consistent with management
              comments that the funding is aimed at airworthiness certification, mass production and global
              commercialization rather than brand-building.


              By June 2026 the company was commonly reported at more than RMB5 billion raised cumulatively and, in
              Hurun's 2026 Global Unicorn Index, at a US$1.5 billion valuation. Some Chinese media described Volant as
              the third-highest-valued domestic eVTOL player, while Bamboo Works reported that local media were linking
              the fresh rounds to a possible Hong Kong IPO. The financing facts are strong; the capital-structure
              details are not. No public source discloses the post-money share count, liquidation preferences,
              anti-dilution protections, secondary transactions or founder dilution path.
            claimRefs:
