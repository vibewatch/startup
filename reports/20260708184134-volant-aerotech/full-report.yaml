  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Who Actually Competes With Volant
        blocks:
          - type: paragraph
            body: >-
              The competitive set around Volant is often discussed too loosely. Not every eVTOL company is a direct
              substitute. EHang leads in autonomous, two-seat, short-range urban sightseeing and low-altitude tourism;
              AutoFlight spans both cargo certification and a six-seat passenger aircraft; Joby and Archer are piloted
              passenger programs optimized for Western certification and premium shuttle networks; Beta emphasizes
              multi-mission passenger and cargo operations with unusually strong range economics; Wisk is focused on
              autonomy-first passenger service; and Volocopter now functions more as a cautionary European reference
              point than as a live benchmark after its sector setbacks. Volant therefore faces both direct and adjacent
              rivals.


              In direct-configuration terms, Volant is closest to the piloted, six-seat, winged passenger-eVTOL cohort.
              Its VE25-100 matches AutoFlight’s Prosperity in 1+5 seating, and its 200-400 km headline range positions
              it against longer-range passenger use cases rather than purely intra-district tourism hops. That makes
              comparisons to EHang misleading if used without context: EHang is the best Chinese proof point for
              commercial certification and paid operations, but it solves a different cabin, autonomy and route problem.


              The more useful competitive lens is to segment peers by what they have already proven. EHang has proven
              certification and early commercialization in autonomous tourism. AutoFlight has proven heavy-cargo
              certification and retains passenger adjacency. Joby and Archer have proven public-market access, large
              liquidity and deep Western certification progress. Beta has proven range and operational-economics
              positioning. Volant, by contrast, is strongest on Chinese fundraising momentum and order-book breadth, but
              still weaker on hard public proof than the leaders of each adjacent lane.
