  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: What the Public Record Actually Supports on Price
        blocks:
          - type: paragraph
            body: >-
              The public file supports one strong conclusion and one weak one. The strong conclusion is that Volant has
              crossed the threshold into unicorn territory in the eyes of external observers: Hurun’s 2026 Global
              Unicorn Index places Volant at US$1.5 billion, and multiple 2026 funding reports confirm an extraordinary
              financing burst of US$300 million plus nearly RMB1 billion in the span of about one month. The weak
              conclusion is almost everything else an investor would normally need to justify buying into that mark:
              revenue, margin, burn, runway, delivery cadence, contract quality, and liquidation or preference structure
              all remain largely undisclosed.


              That means valuation must be treated as a probability-weighted milestone exercise rather than a classic
              revenue-multiple or DCF exercise. The right question is not “what multiple should Volant trade at today?”
              but rather “how much of the future certification-and-commercialization curve is already being priced into
              the current mark?” On that basis, the US$1.5 billion Hurun signal is plausible but not comfortable. It
              reflects real financing depth, real customer optionality, and strong policy tailwinds. It also reflects a
              substantial amount of unproven execution.


              A lower Chinese-media estimate around RMB7.2 billion (~US$1.0 billion) is directionally important because
              it suggests not all observers anchor to the same mark. The fair reading is not that one source must be
              wrong; it is that price discovery is still noisy because private valuation, strategic signaling and
              operating evidence are not aligned cleanly yet.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
