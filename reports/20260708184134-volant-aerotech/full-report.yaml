      - number: '4.3'
        title: Capital Adequacy and Peer Burn Context
        blocks:
          - type: paragraph
            body: >-
              What the public file can support is a capital-adequacy comparison. Volant’s consecutive 2026 rounds imply
              substantial runway for certification and manufacturing prep, and the shift toward insurance, state-linked
              and industrial capital suggests a shareholder base that is more patient than a typical venture syndicate.
              That matters because public peers show how expensive this category remains even for better-disclosed
              operators. Joby reported US$1.4 billion of cash and short-term investments at Q4 2025 plus an additional
              net US$1.2 billion received in February 2026, while its annual filing still described the company as not
              yet generating operating revenues. Archer ended FY2025 with about US$2.0 billion in liquidity, US$729.6
              million of operating expenses and a US$618.2 million net loss.


              Those peer numbers do not prove Volant has enough cash. But they do show the economic neighborhood it
              inhabits: capital-intensive, pre-scale, certification-driven and still loss-making even for public
              frontrunners. Relative to that benchmark, the key takeaway is that Volant’s more than RMB5 billion of
              cumulative private capital is directionally substantial, yet still impossible to judge without burn-rate
              data. A well-funded passenger-eVTOL program can still become undercapitalized if certification or
              manufacturing take longer than planned.


              The public signals therefore point to probable near-term solvency, not to proven capital efficiency.
              Volant has raised enough to stay relevant in the race. It has not disclosed enough to prove that the race
              is financially disciplined.
