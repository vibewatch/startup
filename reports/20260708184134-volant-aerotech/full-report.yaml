      - number: '3.3'
        title: Pricing, Packaging, and Go-to-Market Models
        blocks:
          - type: paragraph
            body: >-
              Very few eVTOL OEMs publicly disclose full aircraft pricing, which makes go-to-market structure more
              informative than sticker price. Volant’s public customer set suggests a mixed model: direct aircraft sales
              or allocations to airlines and general-aviation operators, leasing-mediated deployments via ABC Financial
              Leasing, and scenario-led tourism or public-service routes abroad and in China. EHang is closer to an
              integrated service or route model built around certified aircraft and operator certificates. Joby and
              Archer are positioning around premium air-taxi networks, early city launches and app / route partnerships.
              Beta is more aircraft-and-infrastructure oriented, stressing energy cost and mission economics rather than
              a consumer air-taxi narrative.


              That means Volant’s competition is not only on hardware; it is on packaging the entire commercialization
              loop. A six-seat aircraft sold to a leasing company and then routed through a state-backed operator is a
              very different economic product from an autonomous sightseeing aircraft sold into scenic fixed routes, or
              a premium Dubai / Abu Dhabi shuttle sold through a consumer app experience. Volant’s breadth of named
              counterparties is encouraging because it implies awareness of these packaging differences.


              The weakness is disclosure quality. Volant does not publicly split binding orders, options, lease
              structures, deposits and route economics. Joby and Archer disclose far more about liquidity and launch
              sequencing; EHang discloses more about actual commercial operations; Beta discloses more around
              energy-cost framing. Volant therefore looks commercially imaginative, but less transparent than leading
              peers on how the model monetizes.
