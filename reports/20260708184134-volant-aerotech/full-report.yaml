      - number: '8.4'
        title: Exit Readiness, Price Sensitivity, and Final Diligence
        blocks:
          - type: paragraph
            body: >-
              Public exit readiness looks early. Rumors of a Hong Kong path may reflect ambition, but the disclosure
              profile is still far from prospectus-grade. There is no public revenue quality, margin structure,
              board-level governance depth, preference overhang, or audited customer-conversion data that would normally
              support a smooth late-stage listing story. This matters for current investors because exit path quality
              shapes the discount rate even before an IPO happens.


              The most important implication is price sensitivity. If Volant were offered materially below the lower end
              of the public unicorn range, the asymmetry would improve because much of the certification and backlog
              risk would already be discounted. At or above the Hurun-style US$1.5 billion mark, however, investors are
              paying forward for success that still requires several external systems to line up.


              Final diligence should therefore focus less on broad market storytelling and more on the handful of
              variables that can move intrinsic value fastest: contract hardness, certification confidence, monthly
              burn, customer concentration, insurance and route-launch economics, and investor-rights structure.
