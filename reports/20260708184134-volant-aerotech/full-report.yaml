  - id: FE001
    title: Product Architecture Map
    type: stack
    layout: wide
    summary: Publicly visible layers of the VE25-100 product stack, from mission cabin to certification/manufacturing layer.
    data:
      layers:
        - label: Mission / passenger layer
          description: 1 pilot + 5 passengers, flexible cabin, passenger / rescue / cargo reconfiguration
          detail: This is the user-facing mission surface Volant markets to operators and route planners.
        - label: Pilot interaction layer
          description: Cockpit interface, fly-by-wire controls, Simplified Vehicle Operations
          detail: Volant’s control philosophy aims to reduce pilot workload and training friction.
        - label: Flight-control and safety layer
          description: Control laws, redundancy management, handling-quality validation
          detail: >-
            The public safety story is strongest at the level of control logic and test milestones, not raw reliability
            data.
        - label: Propulsion / energy layer
          description: Eight motors, redundant propulsion concept, thermal / energy management
          detail: Volant discloses the top-level propulsion concept but not subsystem suppliers or cell architecture.
        - label: Airframe layer
          description: Composite-wing lift+cruise architecture, 2,500 kg MTOW class, 500 kg payload target
          detail: The aircraft geometry and payload envelope are central to the company’s differentiation story.
        - label: Industrialization layer
          description: G-1 certification basis, AC101 test article, Zigong manufacturing and flight-test base
          detail: The product is inseparable from certification execution and production readiness.
