      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              China’s policy stack is a genuine demand accelerator. Sources reviewed for this chapter point to a revised
              Civil Aviation Law effective 2026-07-01, an early-2026 standards plan targeting more than 300 sector
              standards by 2030, a 15th Five-Year Plan that classifies the low-altitude economy as a strategic emerging
              industry, and dedicated governance bodies at both NDRC and CAAC. Infrastructure plans in Shenzhen, Hefei
              and Guangdong show that this is not just narrative support: it comes with funded vertiport, route and
              digital-airspace programs. Those conditions are materially better than what most Western passenger-eVTOL
              OEMs can currently point to outside the UAE.


              At the same time, the bottlenecks are structural. Infrastructure still has to be built, airspace
              management still has to be digitized, and a modest piloted fleet can create utility-scale electricity and
              maintenance requirements at each hub. The certification stack is also multilayered: aircraft type
              certification is necessary, but it sits alongside operator certificates, route planning, vertiport
              permitting and consumer-protection rules. Evidence from EHang and AutoFlight shows that Chinese regulators
              can move fast, but it also shows that the fastest progress so far has come either in autonomous two-seat
              tourism or cargo platforms rather than in the six-seat piloted passenger category Volant is pursuing.


              For Volant, that means demand timing is highly path-dependent. The market backdrop is attractive enough to
              support sustained investor interest and customer experimentation. But the true adoption curve will be
              governed by how quickly passenger-grade certification, infrastructure buildout, route approvals, financing
              channels and customer confidence converge in the same cities and corridors. In other words: policy creates
              the runway, but commercialization still depends on operational closure.
