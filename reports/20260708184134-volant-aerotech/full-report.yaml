      - number: '5.3'
        title: Maturity, Certification, and Manufacturing Readiness
        blocks:
          - type: paragraph
            body: >-
              Volant’s maturity story is stronger than many private peers because the company publishes a stepwise
              development timeline rather than only abstract roadmap language. The X1 full-scale demonstrator rolled out
              in 2022, flew in early 2023 and completed transition flights before the CAAC East China Regional
              Administration accepted the VE25-100 type-certificate application in September 2023. Public materials then
              show a sequence of review and test events: the October 2024 first review meeting, establishment of the G-1
              certification basis and project-specific certification plan, rollout of the AC101 development prototype,
              free-flight progress, first piloted flight and later consolidated airworthiness review meetings.


              That is meaningful because passenger eVTOL risk is dominated by airworthiness process discipline. Volant
              also says it has completed high-risk tests such as single-propeller failure and emergency landing, and
              that it has validated handling and system stability through piloted and conversion-flight milestones.
              Taken together, those claims place the company beyond concept-stage marketing and into serious
              certification execution.


              But the timeline also reveals why diligence should stay cautious. Different public surfaces point to
              different type-certification timing expectations: a 2025 article cites an expectation of certification in
              2026, while the company’s May 2026 update says first-half 2027. Slippage of that kind is normal in
              aerospace, but it matters because each delay extends capital burn, customer waiting time and competitive
              pressure. Manufacturing readiness is visible but not fully proven too: the Zigong base and 300-aircraft
              annual capacity claim show intent and facilities, yet there is no public evidence of production yield,
              supplier qualification status or throughput beyond headline capacity.
