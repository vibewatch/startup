      - number: '7.4'
        title: Financial / Model Risk and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              The business-model risk is straightforward: Volant is still pre-scale and under-disclosed. It has raised
              enough money to look relevant, but not enough public detail to prove capital efficiency. Peer failures
              sharpen the warning. Lilium’s insolvency shows that ambitious aircraft programs can burn through
              extraordinary amounts of capital if government or private support falls away. Volocopter’s insolvency
              shows that even well-known urban-air-mobility brands can fail to bridge the gap from demonstration to
              commercial funding.


              That does not mean Volant is heading toward the same outcome. China’s policy support is stronger than
              Europe’s recent funding reality for those peers, and Volant’s customer/partner mix is more explicitly tied
              to operators, lessors and infrastructure planners. But the lesson is still clear: backlog headlines do not
              eliminate capital risk, and the market can turn hard before commercial operations begin.


              The thesis therefore breaks on measurable events, not on vibes. A major certification slip, a meaningful
              anchor-customer unwind, inability to raise the next round on acceptable terms, evidence that insurance or
              route approvals block key corridors, or a public safety event directly involving Volant would each force a
              materially harsher view.
