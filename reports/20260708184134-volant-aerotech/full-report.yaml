      - number: '1.4'
        title: Certification Progress, Orders, and Milestones
        blocks:
          - type: paragraph
            body: >-
              Volant's milestone arc has been fast by passenger-eVTOL standards, though not free of ambiguity. Official
              materials say the company was founded in 2021, rolled out the X1 full-scale technological demonstrator in
              August 2022, completed its maiden flight in January 2023, and then moved through transition-flight
              milestones before rolling out the AC101 development aircraft in 2025. The company also states that the
              VE25-100 completed the industry's first in-flight ballast test, its first unrestricted free flight, its
              first piloted flight, in-flight thrust-determination tests, and powerplant plus full-aircraft wind-tunnel
              testing by March 2026. These milestones support the view that Volant is beyond conceptual design and into
              certification-oriented engineering.


              The central commercial milestone is the order book. Volant's official about page says the company has
              secured more than 1,900 letters of intent and confirmed orders worth over RMB47.5 billion from customers
              including China Southern Airlines General Aviation, Asian Express, ABC Financial Leasing, Beijing E-Town
              Financing Leasing, Zigong state-owned entities, China Aviation Rescue & Emergency, CAR Inc., China General
              Aviation, China Fei Long General Aviation and DeerJet. External reports add more granularity: Yicai and
              official reposts say more than 500 of those orders are overseas, including customers in Thailand, the UAE
              and Germany; the Thailand Pan Pacific agreement alone covered 500 units and US$1.75 billion of notional
              value; and ABC Financial Leasing signed for 10 confirmed units with options for 110 more.


              The remaining gating event is type certification. Public sources agree that the VE25-100 has been in CAAC
              East China type-certification work since 2023-2024 and that substantive review meetings were held in 2024
              and 2025, but there is inconsistency on the exact acceptance date. On timing, sources have also shifted:
              some 2025 materials said certification was expected in 2026, while April-May 2026 reporting and management
              comments moved the target into 2027 or the first half of 2027. That slippage does not mean failure, but it
              is the single most important schedule fact for underwriting Volant's transition from funded program to
              operating business.
