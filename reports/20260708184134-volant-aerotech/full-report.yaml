      - number: '6.4'
        title: Expansion Loops and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Volant’s likely expansion loop is not consumer viral growth; it is account deepening. A first relationship
              can begin with a strategic cooperation agreement, grow into a type-specific training and maintenance
              partnership, convert into a confirmed order or deposit, and only after certification become a
              fleet-expansion account. This is why airline, leasing and infrastructure partners matter so much: they can
              shape both the first route and the second order.


              That same structure creates concentration risk. Public customer proof is clustered around a small number
              of anchor accounts, and much of the rest of the backlog remains less specific. If one or two flagship
              customers were delayed, resized or re-scoped, the optics around backlog quality would change materially.
              Certification timing, operating approvals, infrastructure readiness and operator training all sit between
              today’s backlog and tomorrow’s fleet revenue.


              The most balanced conclusion is therefore narrow. Volant has better named-customer proof than many
              concept-stage eVTOL startups, but it does not yet have enough delivered-customer evidence to demonstrate
              durable retention or broad diversification.
