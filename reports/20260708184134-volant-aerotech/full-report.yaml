      - number: '4.4'
        title: Public Financial Gaps and Underwriting Limits
        blocks:
          - type: paragraph
            body: >-
              The missing fields are underwriting-critical, not cosmetic. Volant does not disclose revenue, ARR, gross
              margin, burn, cash runway, debt, capex intensity, headcount, aircraft unit cost, average selling price,
              cancellation terms, warranty reserves or route-level subsidies. Public reporting also does not separate
              binding sales from options, deposits and letters of intent. That means even simple questions—how much cash
              the company burns per month, how many aircraft must be delivered to reach gross-margin break-even, or how
              much insurance and vertiport expense each route carries—cannot be answered reliably from public material.


              New policy layers make those missing data more important, not less. China’s 2026 low-altitude insurance
              push explicitly forces operators to factor liability coverage into unit economics, while vertiport
              operators and property owners will require specialized coverage and safety disclosures. For Volant, that
              means engineering, certification and finance are tightly coupled: insurance, route approval and
              infrastructure costs can destroy otherwise appealing aircraft economics if management cannot prove safety
              and utilization assumptions.


              Accordingly, this chapter’s conclusion is deliberately narrow. The public file supports a thesis that
              Volant is financeable and commercially interesting. It does not support a thesis that Volant is yet
              economically efficient, margin-positive or even confidently modelable. Any investment case that goes
              beyond capital adequacy must depend on private diligence.
            claimRefs:
              - CI008
              - CI020
              - CI021
              - CI026
              - CI027
