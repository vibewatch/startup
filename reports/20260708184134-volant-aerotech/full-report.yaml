      - number: '1.5'
        title: Cover Metrics, Evidence Quality, and Public Gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest public cover metrics for Volant are financing, valuation, product specification and
              order-book scale. The financing story is unusually well corroborated: US$300 million Series C in April
              2026, nearly RMB1 billion C+ in May 2026, cumulative funding above RMB5 billion, and Hurun's US$1.5
              billion unicorn valuation. The product specification is also stable across official and third-party
              sources: six seats, 500 kg payload, 200-400 km range and roughly 235 km/h cruise speed. Customer traction
              is visible but needs careful parsing because the company reports a blended pool of confirmed orders and
              letters of intent rather than a clean firm-backlog schedule.


              The weakest public metrics are the ones that matter most for private-company underwriting. Volant does not
              disclose revenue, burn rate, gross margin, cash runway, exact headcount or unit economics. Public sources
              also do not provide a clean split between deposits, binding contracts and soft letters of intent across
              the 1,900-unit headline order book. Likewise, the public cap table omits board composition, founder
              ownership, preference terms and secondary activity. These are not cosmetic missing fields; they are
              exactly the items that determine whether a unicorn valuation is supported by industrial readiness or only
              by scarce-asset enthusiasm.


              Accordingly, later chapters should treat company-claimed milestones and order numbers as important but not
              equivalent to certified deliveries, recognized revenue or disclosed economics. Volant's public file is
              strong enough to establish identity, leadership, funding, customer interest and certification momentum. It
              is not strong enough to clear the normal late-stage private diligence bar on financial transparency,
              governance transparency or contract quality.
            claimRefs:
              - CO024
              - CO025
              - CO027
              - CO032
              - CO036
              - CO037
              - CO038
              - CO039
