  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model Surface vs Public Disclosure Reality
        blocks:
          - type: paragraph
            body: >-
              Volant’s likely economic model is understandable even though its reported numbers are not. Public
              materials and customer disclosures imply a mix of aircraft sales or allocations to operators,
              leasing-enabled deployments through financial lessors, customer deposits or prepayments, and eventually
              recurring revenue from maintenance, training, route operations or related services once certified fleets
              enter service. That is the standard monetization stack for a passenger-eVTOL company. But unlike a mature
              aerospace or mobility company, Volant does not publish revenue, run-rate, gross margin, burn, headcount or
              unit-economics detail in the reviewed public file.


              The most concrete public financial proof point today is not revenue but funding and demand optionality.
              April-May 2026 coverage says Volant raised US$300 million in Series C and nearly RMB1 billion in C+ only
              weeks apart, pushing cumulative capital above RMB5 billion. Critical coverage also says the company has
              collected nearly RMB100 million of deposits, which is meaningful as working-capital validation but still
              not equivalent to recurring service revenue or delivered-aircraft revenue. The same coverage explicitly
              warns that the 1,900-aircraft order headline mixes firm commitments with softer interest.


              This leaves Volant in a familiar late-stage deep-tech position: the economic model is legible, but the
              underwriting data are not. Public investors can see what revenue streams should exist in the future, yet
              they cannot test whether current cost structure, pricing discipline or contract quality make those streams
              attractive.
