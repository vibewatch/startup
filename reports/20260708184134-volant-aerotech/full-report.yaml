  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: What Actually Breaks the Thesis First
        blocks:
          - type: paragraph
            body: >-
              Volant’s risk profile is not primarily about whether eVTOL is an interesting idea. The real question is
              which dependency breaks first: certification schedule, financing duration, backlog conversion,
              infrastructure readiness, or public trust after a safety event. The current public file points most
              strongly to four top-tier risks. First, type certification and downstream operating approvals still gate
              everything. Second, the order book is large but mixed in quality, with limited public contract detail.
              Third, low-altitude infrastructure, insurance and regulatory coordination are still being built in real
              time. Fourth, the sector remains vulnerable to capital-market whiplash, as shown by recent peer
              insolvencies.


              The interaction between these risks matters more than any single row in a register. A certification slip
              extends burn. Extended burn increases financing dependence. Financing dependence makes customers more
              cautious. Customer caution weakens backlog quality. Weaker backlog quality raises the discount rate on the
              next round. That is the true risk transmission chain.


              Accordingly, this chapter ranks Volant’s residual risk as high even though no single public source proves
              imminent failure. The program looks serious; the system around it is still fragile.
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR012
              - CR014
              - CR017
              - CR020
              - CR027
              - CR034
              - CR035
      - number: '7.2'
        title: Regulatory, Legal, and Safety Risk
        blocks:
          - type: paragraph
            body: >-
              Certification remains the central legal and regulatory bottleneck. Volant has published a credible
              airworthiness sequence, but older public expectations of 2026 certification have already shifted to a
              first-half 2027 target. That kind of slippage is normal in aerospace and still material for investors
              because each quarter of delay affects customer timing, cash consumption and competitive optics. Even after
              a type certificate, downstream operating approvals, route permissions, training approvals and local
              infrastructure integration still matter.


              The broader Chinese low-altitude system is also becoming stricter at the same time it becomes more
              supportive. The CAAC has created a low-altitude safety department, and legal revisions continue to
              formalize airworthiness, flight-management and service-platform rules. That should help the industry over
              time, but in the near term it raises the compliance bar. Public safety events can also trigger sudden
              policy reactions. Reuters reporting on the June 2026 Beijing light-plane crash describes tour suspensions,
              uncertainty among operators and renewed focus on airspace-control gaps.


              Insurance creates another quasi-regulatory layer. Multiple sources argue that coverage is becoming an
              entry threshold rather than an optional afterthought, especially for cross-boundary or dense-urban
              operations. Once insurance, liability allocation and local approvals become prerequisites, technical
              success alone is no longer enough to open a route.
