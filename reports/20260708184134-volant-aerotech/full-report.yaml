      - number: '3.2'
        title: Capability Breadth and Product Positioning
        blocks:
          - type: paragraph
            body: >-
              Product architecture is the first major separator in this market. Volant publicly describes the VE25-100
              as a six-seat passenger aircraft with eight motors, 500 kg payload and 200-400 km range. AutoFlight’s
              passenger Prosperity page also presents a six-seat 1+5 all-electric aircraft, while Joby’s annual report
              describes a piloted aircraft for a pilot plus up to four passengers at up to 200 mph and around 100 miles
              range. Beta’s ALIA emphasizes much longer demonstrated range and a dual passenger-cargo operating logic.
              Wisk and EHang push much harder on autonomy. These differences are not cosmetic: they determine
              certification pathways, mission economics, route density and customer type.


              Volant’s strongest product-positioning point is that it appears to combine meaningful cabin size with
              Chinese-certification orientation and a customer set that already includes airlines, leasing companies and
              overseas tourism-oriented counterparties. The risk is that multiple other firms already own clearer
              “category leadership” labels: EHang on certified pilotless passenger operations, AutoFlight on cargo
              certification, Joby on quiet piloted air-taxi branding and extensive test maturity, Archer on FAA Means of
              Compliance progress, and Beta on range-plus-economics for mission-driven operations.


              As a result, Volant’s product moat is not obvious from raw specifications alone. It has to come from
              execution: certification speed in China, manufacturing readiness, customer conversion and route
              deployment. If those lag, the product can end up looking like a well-funded middle ground between
              better-proven category leaders.
