      - number: '8.2'
        title: Comparable Set and Scenario Bands
        blocks:
          - type: paragraph
            body: >-
              The best public comp framework for Volant is hybrid. Public passenger-eVTOL leaders such as Joby and
              Archer offer transparent but still loss-making benchmarks for how expensive this category remains. EHang
              provides the most relevant China commercialization proof because it has actual ticketed operations, but
              its market cap is well below Joby and Archer and still reflects early-stage economics. Distress cases such
              as Lilium and Volocopter matter too, not because they are direct comps on business quality, but because
              they define the downside physics of the sector when funding, certification and commercialization fall out
              of sync.


              On this basis, Volant’s implied mark sits in the middle of an awkward range. It is far below Joby’s and
              Archer’s public market capitalizations, which is reasonable because those companies disclose more and have
              stronger public capital access. But it is well above EHang’s market cap despite EHang possessing stronger
              operational proof today. That does not automatically make Volant overvalued; it means investors are paying
              for a different possibility set—larger passenger aircraft economics, China policy leverage, a strong
              funding syndicate and a large stated backlog. The problem is that most of those advantages remain
              milestone-contingent.


              Scenario valuation is therefore cleaner than point valuation. A bull case can justify a mark comfortably
              above US$1.5 billion if certification stays on track, backlog converts, and China’s low-altitude economy
              re-rates the whole sector. A base case keeps Volant roughly in the current unicorn band. A bear case
              compresses sharply toward late-stage private distress or low-single-digit public-cap-style territory if
              certification slips or customer commitments soften.
