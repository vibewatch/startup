      - number: '5.2'
        title: Architecture, Control Philosophy, and Operator Workflow
        blocks:
          - type: paragraph
            body: >-
              Volant’s public architecture story is centered on a conservative but commercially ambitious design choice:
              a piloted lift-plus-cruise aircraft that uses full fly-by-wire control and simplified vehicle operations
              rather than pure autonomy. In practice, that means the company is trying to combine the longer-range and
              roomier-cabin advantages of winged passenger eVTOL with a control philosophy that reduces pilot workload.
              Company materials describe eight electric motors and a redundant propulsion system, while the CEO
              interview adds a more concrete human-factors lens: the aircraft uses algorithmic coordination to turn what
              would traditionally be multi-axis aircraft handling into simpler control inputs intended to feel more
              intuitive to pilots.


              This is one of the more credible product differentiators in the public file because it ties directly to
              adoption friction. A beautiful aircraft spec matters less if every customer must build an unusually hard
              pilot-training pipeline. Volant’s argument is that full fly-by-wire plus SVO can compress type transition
              difficulty for commercial pilots and later support more scalable training pathways. The simulator
              announcement strengthens that claim because it shows the company thinking about the training and
              validation toolchain, not just the aircraft itself.


              Still, the public engineering picture is incomplete. Volant lists major competency buckets—airframe
              structures, aerodynamics, flight-control law development, redundant systems, electric propulsion
              redundancy and thermal design—but does not disclose subsystem vendors, energy density, battery safety
              architecture, avionics partners or field reliability statistics. That means the public file supports a
              sound operating model hypothesis, not a deep subsystem audit.
            claimRefs:
