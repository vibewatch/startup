      - number: '8.3'
        title: Recommendation, Thesis, and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis for owning Volant is coherent. China has made low-altitude aviation a strategic priority;
              Volant has raised at category-leading scale; customer proof is better than that of many concept-stage
              eVTOL startups; and the product sits in a part of the passenger-eVTOL design space that could have
              attractive utility if certification and operating economics land. The anti-thesis is equally coherent: the
              company is still pre-scale, public underwriting data are too thin, category mortality is real, and the
              current mark may already price in more success than the evidence can support.


              That is why the right recommendation is research-more rather than buy or avoid. The company is too
              substantial to dismiss, but the price is too evidence-light to endorse aggressively. A buy call would
              require either a meaningfully better entry valuation or private evidence that closes the biggest gaps on
              contract quality, runway, certification probability and route economics. An avoid call would require
              clearer signs of imminent financial or technical breakage than the public record currently shows.


              In other words, Volant is investable as a diligence priority, not yet as a conviction-priced
              public-information asset.
