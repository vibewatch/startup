      - number: '1.2'
        title: Founders, Leadership, and Governance Surface
        blocks:
          - type: paragraph
            body: >-
              Volant's public leadership surface is stronger than its public governance disclosure. The company openly
              identifies founder and CEO Dong Ming, President Mcfly Huang and CTO Zhang Baozhu on its website. Dong is
              described as an aviation-systems veteran with experience at AVIC, GE and Rockwell Collins and with prior
              work on the ARJ21, C919 and CR929 programs; Huang is a commercially oriented executive with nearly two
              decades in general aviation and the low-altitude economy; and Zhang is a chief-engineer-level
              aircraft-development specialist with decades of Part 23 and Part 25 airworthiness experience. A Bamboo
              Works profile additionally points to technical leader Yu Wei / William Yu, who reportedly has prior CAAC
              and Honeywell background.


              The broader team story is one of heavyweight aviation pedigree. Volant's official materials claim its core
              team comes from COMAC, Airbus, GE and Honeywell and has participated in nine major aircraft programs,
              while a 2024 company release said the team collectively holds more than 400 years of model-specific
              experience and includes ten CAAC designated representatives. That claim is directionally helpful because
              Volant is competing on certification-intensive passenger aviation rather than purely on software or
              consumer hardware.


              But governance transparency is still thin. There is no public board roster, no disclosed founder
              ownership, no detailed cap table and no public discussion of voting control, preference stack or
              succession planning. The company therefore looks leadership-rich but governance-opaque: investors can
              underwrite credible technical and commercial resumes, yet cannot fully assess board independence or
              control rights from public material alone.
