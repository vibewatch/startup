      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Volant’s buyer map is multi-sided. For commercial passenger routes, the aircraft buyer may be a leasing
              company or local state-backed platform, the operator may be a general-aviation or airline-affiliated unit,
              the end user is the passenger, and the effective payer may be either the passenger or a route sponsor.
              That complexity is visible in Volant’s own disclosed customer set: China Southern Airlines General
              Aviation and Asian Express represent operator-style demand, while ABC Financial Leasing represents a
              financing channel rather than a direct end-user. Overseas counterparties such as Pan Pacific tilt even
              more toward route-development consortia and infrastructure-led deployments rather than pure airline
              replacement.


              The near-term adoption path is therefore use-case specific. Tourism and sightseeing can tolerate premium
              pricing, fixed routes and scheduled operations, and Chinese regulators have already created a targeted
              sightseeing rule framework for the first commercial eVTOL use case. Public-service and emergency missions
              can rely on government budgets and may face lower political resistance than mass passenger commuting.
              Logistics has the cleanest revenue proof in the broader low-altitude economy, but Volant’s current
              flagship is optimized first for passenger transport rather than a pure cargo platform.


              This buyer complexity also changes the commercialization clock. Aircraft certification alone does not
              unlock revenue: operators need route approvals, vertiport or landing-site access, charging and maintenance
              support, insurance, trained pilots and in some cases local-government coordination. That is why the most
              realistic early market for Volant is a set of sponsored, fixed-scenario deployments rather than
              unconstrained urban air-taxi networks from day one.
            claimRefs:
              - CM015
              - CM016
              - CM017
