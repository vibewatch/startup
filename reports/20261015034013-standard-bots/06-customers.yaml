company:
  name: "Standard Bots"
chapter:
  number: 6
  title: "Customers"
  summary: "Standard Bots shows credible demand signals across SMB and enterprise manufacturing, but the public record is still weighted toward company-controlled deployment claims rather than independently underwritten customer durability. The strongest proof in this pool is a specific Shaw Barrels throughput outcome plus repeated 2026 reporting that the company serves hundreds of businesses, while retention, concentration, and installed-base denominators remain undisclosed."
sections:
  - id: "segment-mix-and-buying-motion"
    title: "Segment mix and buying motion"
    body: "The customer story is built around lowering robotics-adoption friction for manufacturers that do not want an integrator-heavy project. Standard Bots' own AI page says operators can teach robots in plain language and by demonstration, while Aesop Academy describes the same hardware serving both a Fortune 100 line and a 50-person job shop. Public product positioning also implies multiple customer entry points: Spark is pitched for labs and R&D benches, Core for machining and welding environments, and Thor for heavier payload lines. That mix suggests the company is not selling into a single factory archetype; it is trying to bridge small job shops, mid-market automation buyers, and larger strategic accounts. The buying motion also appears hybrid rather than purely self-serve, with DIY, guided deployment, and turnkey integration options all visible on the palletizing page."
    claimRefs: ["CU001", "CU002", "CU003", "CU006", "CU009"]
    tableRefs: ["TU001"]
    figureRefs: ["FU001"]
  - id: "adoption-proof-and-reference-quality"
    title: "Adoption proof and reference quality"
    body: "Public adoption proof exists, but it is uneven in quality. Standard Bots' palletizing page gives the clearest specific operating outcome: Shaw Barrels is said to have increased output from 200 parts per day to 800. The same page also claims 100+ manufacturers are already scaling with the company and that its team has commissioned hundreds of palletizing cells. Independent 2026 coverage broadens the picture by repeating that Standard Bots serves hundreds of businesses and naming logos such as Sunoco, Lockheed Martin, Amazon, NASA, and the U.S. Army. The issue is depth rather than breadth: those larger references are useful brand-validation signals, but the assigned pool does not disclose contract size, site count, production-versus-pilot status, or renewal behavior for any of the marquee accounts. The chapter therefore supports real commercial traction, but not yet a fully underwritten installed base."
    claimRefs: ["CU004", "CU005", "CU007", "CU008", "CU012", "CU014"]
    tableRefs: ["TU002", "TU003"]
  - id: "durability-expansion-and-concentration-risk"
    title: "Durability, expansion, and concentration risk"
    body: "The biggest underwriting gap is not whether Standard Bots has customers; it is whether those customers renew, expand economically, and diversify revenue enough to support the growth narrative. The Next Web explicitly notes that the 10% U.S. deployment-share target is management's projection and that current unit volumes are not disclosed. NewmarketPitch reaches a similar conclusion from a valuation angle, arguing that public materials still do not show audited revenue, backlog, shipment volume, retention, or software attach. That matters for this chapter because Standard Bots appears to mix hardware, deployment services, and ongoing support, yet the public record does not break out channel mix, top-account exposure, or contract terms. Expansion loops are visible in the customer experience design, but the durability metrics that would validate those loops are still private."
    claimRefs: ["CU010", "CU011", "CU013", "CU014"]
callouts:
  - calloutType: "insight"
    title: "Commercial traction is visible, but reference quality is tiered"
    body: "The evidence supports live deployments and some measurable customer outcomes, but only the Shaw Barrels example provides a concrete operating delta in this pool. The higher-profile logos remain useful proof-of-interest rather than proof of durable, expanding production usage."
    claimRefs: ["CU007", "CU008", "CU012"]
  - calloutType: "risk"
    title: "Retention and concentration are still private"
    body: "Public sources do not disclose NRR, GRR, churn, contract length, top-customer mix, or unit volumes behind the 10% deployment-share target, so the customer base cannot yet be underwritten for durability or concentration risk from public evidence alone."
    claimRefs: ["CU010", "CU011", "CU013"]
