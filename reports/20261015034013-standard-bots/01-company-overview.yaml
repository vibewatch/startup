callouts:
  - calloutType: insight
    title: Simplicity and service are the public wedge
    body: >-
      The assigned official sources consistently pair a relatively transparent
      entry price with no-code positioning and three deployment models, implying
      that Standard Bots' commercial wedge is ease of adoption as much as robot
      hardware.
    claimRefs:
      - CO007
      - CO008
      - CO009
  - calloutType: risk
    title: Valuation is better evidenced than operating quality
    body: >-
      The June 2026 financing event is well supported, but the same public pool
      still does not disclose enough audited revenue, margin, shipment, board,
      or cap-table detail to validate the unicorn price on fundamentals alone.
    claimRefs:
      - CO010
      - CO016
