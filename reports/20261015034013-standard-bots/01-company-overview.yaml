artifact: company-overview
slug: standard-bots
runDate: 2026-10-15
company:
  name: Standard Bots
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Standard Bots presents a coherent public identity as a Glen Cove, New York
    industrial robotics company with a domestic-manufacturing narrative, a
    low-friction deployment pitch, and a reported June 2026 Series C that set a
    $1 billion valuation. The assigned evidence supports the company, founder,
    funding, and milestone baseline that later chapters can reuse, but public
    operating disclosure still lags the valuation and leaves cap-table,
    governance, revenue, and shipment depth only partially knowable.
sections:
  - id: public-snapshot
    title: Public snapshot and operating posture
    body: >-
      Standard Bots' official surfaces consistently frame the company as an
      American industrial robotics manufacturer rather than a pure software
      startup. The homepage positions it as "America's largest AI-native
      industrial robot manufacturer" built in Glen Cove, New York, while the
      A3 member profile and product pages reinforce a vertically integrated
      stack spanning hardware, software, and service delivery. The product and
      commercial wedge is also unusually explicit for a private hardware company:
      the January 2026 blog post publishes a $37,000 list price for Core, the
      company argues that automation is becoming affordable for smaller
      manufacturers, and the palletizing page shows three deployment models from
      DIY to turnkey integration. That combination suggests the near-term thesis
      is not just lower-cost hardware, but lower-friction deployment for
      manufacturers that lack deep robotics engineering capacity.
    claimRefs:
      - CO001
      - CO002
      - CO006
      - CO007
      - CO008
      - CO009
      - CO013
    tableRefs:
      - TO001
  - id: leadership-and-governance
    title: Founders, leadership, and governance visibility
    body: >-
      The assigned pool gives enough evidence to establish the publicly named
      leadership roster, but not enough to underwrite governance depth. The Aug
      2026 tear sheet attributes the company's 2011 founding to Evan Beard and
      David Golden and names four public leadership roles: Beard as CEO, Zach
      Tomkinson as President, Ashley Higgins as Chief Strategy Officer, and
      Golden as Co-Founder. The same evidence set does not disclose a current
      board roster, voting rights, or a detailed explanation of Golden's
      day-to-day operating role, so leadership identity is clearer than
      governance structure. That matters because the company is asking investors
      to underwrite a manufacturing-scale narrative with limited public detail on
      how authority and oversight are distributed around the founding team.
    claimRefs:
      - CO003
      - CO004
      - CO005
      - CO014
      - CO016
    tableRefs:
      - TO002
  - id: capital-and-stakeholders
    title: Funding history and stakeholder map
    body: >-
      Public funding evidence is much stronger than public operating evidence.
      Unite AI reports that Standard Bots raised a $200 million Series C at a
      $1 billion valuation on June 9, 2026, and the tear sheet rolls that into
      a $263 million-plus cumulative funding history after a $63 million 2024
      Series B. The disclosed investor roster points to a mix of venture and
      strategic backers, including RoboStrategy, General Catalyst, Amazon
      Industrial Innovation Fund, Samsung Next, Box Group, and GiantLeap
      Capital. What remains missing is the economic and control layer below the
      headline round data: the assigned evidence does not expose liquidation
      preferences, secondary mix, ownership percentages, or shareholder rights,
      so the financing milestone is real while the governance and dilution
      mechanics remain only partially visible.
    claimRefs:
      - CO010
      - CO011
      - CO012
      - CO016
    tableRefs:
      - TO003
  - id: milestones-and-open-questions
    title: Milestones, scale signals, and the core open question
    body: >-
      The milestone record supports a real scale-up story, but not a fully
      underwritten unicorn case. The timeline spans a 2011 founding, visible A3
      membership by 2023, a 2024 Series B, a May 2025 facility-expansion and
      heavier-payload-product milestone, and the June 2026 Series C. Official
      materials also extend the narrative forward by claiming that by 2027 the
      company will manufacture "everything – from metal in to robots out" in
      America. The principal unresolved issue is whether the public operating
      evidence has caught up with the financing mark: the skeptical source in the
      pool argues that it has not, and the current chapter evidence does not
      rebut that critique with audited revenue, margin, shipment, or cap-table
      disclosure.
    claimRefs:
      - CO003
      - CO004
      - CO007
      - CO010
      - CO011
      - CO013
      - CO015
      - CO016
    figureRefs:
      - FO001
