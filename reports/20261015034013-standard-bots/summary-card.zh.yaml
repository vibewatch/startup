    - 完整股权结构表、清算优先权、反稀释条款，以及 Series C 是否包含老股转让或结构化成分。
    - 关于部署规模、客户集中度、留存，以及到 2027 年达到美国新部署机器人 10% 这一说法进展的独立证据。
    - 第三方安全与认证文件，以及 Bolt 达到可出货状态的里程碑。
    - 董事会构成、治理权利，以及对 David Golden 当前职务和参与程度更清晰的公开说明。
