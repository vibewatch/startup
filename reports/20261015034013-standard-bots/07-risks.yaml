      - Public evidence
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - [Field-service bottleneck, Company pages promise guided deployment direct support and warranty replacement, Medium, High, Medium, High, Need technician count response-time distribution and MTTR by installed site.]
      - [Integration remains partly custom, Latent Space says conventional programming still handles motion and cell logic around learned perception, Medium, Medium, Medium, Medium, Need deployment time by use case and percent of installs requiring custom engineering.]
      - [Fleet-learning blind spots, Some defense customers are air-gapped and local inference is favored where internet is unreliable, Medium, Medium, Early, Medium, Need share of air-gapped installs and model-improvement cadence by cohort.]
      - [Ramp and warranty load, The factory expansion and bundled support increase exposure to quality escapes returns spare-parts load and on-site interventions, High, High, Early, High, Need yields return rates spare-parts turns and backlog aging.]
    notes: Operational rows mix company-described mitigations with independent commentary; unresolved-gap cells identify the private operating metrics still needed to underwrite execution.
    claimRefs: [CR005, CR006, CR007, CR008, CR009, CR010]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty or locus
      - Role
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - [External capital narrative, Current and future investors, Funds factory growth and working capital, Next financing is pressured if public proof stays behind the valuation story, High, The company already raised $200 million and has marquee backers, High]
      - [Reference-demand conversion, Marquee customers and public logos, Validates demand and brand, Named accounts do not convert into disclosed shipped units renewals or production depth, High, Broad sector mix and SMB positioning may diversify demand, High]
      - [Internal service and integration channel, Standard Bots direct and guided deployment model, Implements cells and keeps customers live, Bookings can outrun install support and renewal quality if service capacity lags, High, Self-serve and value-add paths reduce some burden but do not remove in-house dependence, High]
    notes: Dependency register focuses on counterparties and internal bottlenecks that could block repeatable scale rather than on generic macro factors.
    claimRefs: [CR001, CR003, CR004, CR005, CR006, CR010, CR012]
