  evidenceGaps:
    - type: missing-source
      severity: material
      topic: safety-certification
      missingEvidence: Independent certification materials, incident logs, and recall history for RO1, Core, Thor, and related deployments.
      whyItMatters: Safety posture is currently described through company and press language, which is not enough to underwrite regulatory or product-liability risk at scale.
      diligencePath: Request CE UL and ISO documentation, customer safety sign-off packets, and any internal field-incident reporting summary.
      relatedQuestionRefs: [QR001, QR002]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: unit-economics-disclosure
      missingEvidence: Audited revenue, gross margin, shipment volume, service gross margin, software attach, backlog, and round-terms detail.
      whyItMatters: Without operating proof, the $1 billion valuation remains a financing mark rather than a fully underwritten business model.
      diligencePath: Request the current board deck or diligence room package with 2025 and 2026 financials plus shipped-unit rollforwards.
      relatedQuestionRefs: [QR006, QR008]
      relatedTableRefs: [TR001, TR003]
    - type: private-evidence-only
      severity: material
      topic: deployment-volume-proof
      missingEvidence: Installed-base counts, shipped units, renewal rates, service-response distribution, and named production-depth evidence by account.
      whyItMatters: These metrics determine whether the 10% deployment claim and direct-support model are scaling together or diverging.
      diligencePath: Request cohort-level install data, top-account deployment depth, churn or renewal data, and service-capacity dashboards.
      relatedQuestionRefs: [QR004, QR005, QR007]
      relatedTableRefs: [TR002, TR003]
