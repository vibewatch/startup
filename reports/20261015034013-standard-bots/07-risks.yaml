company:
  name: Standard Bots
chapter:
  number: 7
  title: Risks
  summary: >-
    Standard Bots' public risk profile is dominated by execution and disclosure rather than a single
    catastrophic event: the company is scaling a hardware-and-service-heavy operating model while
    public evidence still leaves revenue, unit-volume, service-capacity, and certification support
    largely unverified. The strongest residual risks are valuation underwrite, field-service scaling,
    and safety/regulatory substantiation as the company pushes a 10% U.S. deployment claim.
sections:
  - id: capital-market-and-disclosure-risk
    title: Capital market and disclosure risk
    body: >-
      The June 2026 Series C gives Standard Bots ample capital and a strong narrative, but it also
      raises the burden of proof. Multiple independent articles confirm the $200 million round at a
      $1 billion valuation and frame the proceeds around manufacturing expansion, yet the same public
      record still does not disclose unit volumes, profitability, backlog, or comparable shipment
      data. That matters because the company's 10% U.S. deployment target is still management
      guidance rather than a verified operating result, and TNW notes that such a share would imply
      several thousand annual units. In practice, the financing is real, but the operating proof
      needed to justify the valuation remains materially thinner than the funding headline.
    claimRefs: [CR001, CR002, CR003, CR004, CR011, CR012]
  - id: regulatory-and-safety-substantiation
    title: Regulatory and safety substantiation
    body: >-
      The assigned pool does not surface a public lawsuit, enforcement action, or recall, but that is
      not the same as clearing regulatory risk. What it does show is that the safety posture is still
      described primarily through company and press language: RO1 is presented as a collaborative arm
      with collision detection and ISO/TS 15066-oriented safeguards, yet no independent certification
      packet, field-incident statistics, or recall history appears in the retained evidence. For an
      investor, the risk is therefore substantiation rather than an identified legal breach. If the
      company is scaling quickly into production deployments, independent safety and compliance proof
      should arrive before the next refresh rather than after a field issue forces disclosure.
    claimRefs: [CR013]
    tableRefs: [TR001]
  - id: operational-execution-and-service-load
    title: Operational execution and service load
    body: >-
      The clearest operating risk is that Standard Bots still has to behave like a robot company even
      when investors value it like a software platform. The product pages emphasize lease support,
      guided deployment, turnkey integration, fast-response service, and warranty replacement, while
      StartupFortune explicitly notes that robot scale still requires inventory, suppliers, quality
      control, and field service. Latent Space reinforces that the technical workflow is not fully
      autonomous: inference stays on-premise because factories often lack reliable internet, some
      defense environments are air-gapped, and conventional programming still handles parts of the
      cell logic. Those details do not invalidate the product story, but they make service staffing,
      deployment quality, and repeatability central operational risks.
    claimRefs: [CR005, CR006, CR007, CR008, CR009, CR010]
    tableRefs: [TR002]
  - id: dependency-map-and-kill-criteria
    title: Dependency map and kill criteria
    body: >-
      Standard Bots is trying to combine domestic manufacturing, direct selling, and AI-driven ease of
      use into one growth loop, which concentrates dependency risk in a few measurable places. First,
      the company needs the 2026 factory expansion and hands-on service model to convert marquee logos
      into repeatable shipped-unit volume rather than one-off references. Second, the business needs
      evidence that pricing and support translate into durable software or service economics, because
      the public record still looks more like a financing story than a disclosed operating model.
      Third, the U.S.-built and often-direct-sales posture reduces some supplier and channel
      dependency, but it also makes the company more exposed to its own production discipline and
      response capacity. The thesis should weaken quickly if shipment proof, service metrics, or
      independent safety evidence fail to catch up with the narrative before the next review cycle.
    claimRefs: [CR001, CR002, CR004, CR005, CR006, CR010, CR011, CR012]
    tableRefs: [TR003]
    figureRefs: [FR001]
