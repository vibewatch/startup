callouts:
  - calloutType: risk
    title: Current thesis-break triggers
    body: >-
      The risk view should worsen materially if disclosed 2026 shipments land far below the
      multi-thousand-unit implication of the 10% deployment claim, if direct-support response quality
      degrades during the manufacturing ramp, or if independent safety and certification evidence
      still trails deployment expansion at the next refresh.
    claimRefs: [CR004, CR006, CR013]
  - calloutType: insight
    title: Visible mitigations are commercial, not yet audited
    body: >-
      The public mitigations in this pool are pricing, vertical integration, local inference, and
      hands-on service. Those may improve adoption, but they do not substitute for audited unit
      economics, shipped-unit proof, service-capacity metrics, or third-party certification evidence.
    claimRefs: [CR005, CR006, CR008, CR010, CR012]
