callouts:
  - calloutType: "strength"
    title: "The clearest wedge is simpler deployment at a visible entry price"
    body: >-
      Public evidence consistently shows Standard Bots selling lower-friction automation:
      demonstration-based programming, a $37,000 entry robot, and deployment choices that
      range from self-serve to full integration.
    claimRefs: ["CP003", "CP005", "CP013"]
  - calloutType: "risk"
    title: "Price leadership is helpful, but open evidence does not prove a moat"
    body: >-
      The strongest adverse source says the pricing wedge is real but still vulnerable to
      incumbent price, feature, trust, and channel responses, and TNW separately notes that
      core operating proof points remain undisclosed.
    claimRefs: ["CP009", "CP010", "CP011"]
  - calloutType: "insight"
    title: "The company is competing across two frames at once"
    body: >-
      Standard Bots is not only fighting classic cobot incumbents; investor databases and
      industry coverage also place it alongside broader physical-AI entrants, which expands the
      future competitor set beyond robot-arm pricing tables.
    claimRefs: ["CP008", "CP012"]
