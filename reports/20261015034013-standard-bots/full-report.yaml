  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      A constrained deployment-and-capacity lens from cited U.S. install activity to Standard Bots' stated share
      ambition and manufacturing buildout.
    data:
      items:
        - label: Cited U.S. industrial robot installations
          value: 44000
          unit: units
          note: TNW says IFR recorded approximately 44,000 U.S. installations in 2024.
        - label: Standard Bots stated share ambition
          value: 10
          unit: '%'
          note: Company goal repeated by TNW and Robotics & Automation News.
        - label: Low-end implied annual units
          value: 4400
          unit: units
          note: 10% of the cited 44,000 U.S. install base.
        - label: High-end implied annual units
          value: 5000
          unit: units
          note: TNW's range for 10% share depending on 2026 totals.
        - label: Core starting price
          value: 37000
          unit: USD
          note: NewMarketPitch cites a $37,000 starting price for the 18 kg Core robot.
        - label: Planned Glen Cove footprint
          value: 70000
          unit: sq ft
          note: Independent coverage says the post-Series C buildout targets 70,000 square feet.
    approximationNotes: >-
      This pyramid mixes install-volume, share, price, and capacity lenses because the assigned pool does not contain a
      single primary public TAM dataset for Standard Bots. The 4,400-unit figure is a direct 10% transformation of TNW's
      cited 44,000 U.S. installations; the 5,000-unit point reflects TNW's own higher-end wording for 2026 totals. The
      70,000-square- foot point is a supply-capacity signal from independent coverage, not proof of shipments,
      utilization, or revenue.
