  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence points to a hybrid flow from robot demand into hardware bookings, integration services, support
      obligations, and only partially visible gross profit.
    data:
      nodes:
        - id: demand
          label: Automation demand
          value: SMB and enterprise manufacturers need easier deployment
          note: Demand is inferred from company positioning and traction claims, not from disclosed bookings.
        - id: hardware
          label: Robot / cell sale
          value: $37K list entry point is public
          note: Public evidence supports list pricing only.
        - id: integration
          label: Integration and tooling
          value: 20-50% install uplift; tooling extra
          note: Company guide says deployment requires additional spend beyond the arm.
        - id: services
          label: Deployment services
          value: DIY, Value-Add, or Full Integration
          note: Commercial model includes guided and turnkey delivery options.
        - id: support
          label: Post-sale support
          value: Jump Start plus fast field support
          note: Support is visible in product copy, but monetization is not disclosed.
        - id: gross-profit
          label: Gross profit outcome
          value: Undisclosed
          note: Margin depends on hardware, services, support, and any software attach that is not publicly broken out.
      edges:
        - from: demand
          to: hardware
          label: creates booking opportunity
        - from: hardware
          to: integration
          label: requires deployment inputs
        - from: integration
          to: services
          label: drives project labor
        - from: services
          to: support
          label: creates uptime obligation
        - from: support
          to: gross-profit
          label: determines margin quality
    approximationNotes: The flow is qualitative because public evidence does not disclose conversion rates, attach rates, or unit margins.
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI008
      - CI014
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Public sources describe a four-layer product stack from operator workflow to support operations.
    data:
      layers:
        - label: Operator workflow
          note: No-code and demonstration entry points aimed at non-specialist operators.
          modules:
            - label: Plain-language task setup
            - label: Palletizing Wizard on iPad
            - label: 'Teaching modes: tele-op, lift-assist, jog'
          outputs:
            - label: Faster initial setup for shop-floor users
        - label: AI skill layer
          note: Trade-show coverage adds named feature modules beyond the generic AI pitch.
          modules:
            - label: Vision / Quick Find / Text Find
            - label: Motion / Show Path
            - label: Agent / conversational routine generation
          outputs:
            - label: Adaptation to changing parts and task variation
        - label: Product hardware layer
          note: Official lineup separates benchtop, mid-range, and heavy-payload arms.
          modules:
            - label: Spark 7 kg / 900 mm
            - label: Core 18 kg / 1,300 mm
            - label: Thor 30 kg / 2,000 mm
          outputs:
            - label: Coverage from R&D benches to palletizing cells
        - label: Control software layer
          note: Unite.ai and A3 describe internally controlled software and motion systems.
          modules:
            - label: ArcOS control software
            - label: Vision, firmware, and electronics
          outputs:
            - label: Internal control of user workflow and robot behavior
        - label: Electromechanical layer
          note: Trade and company sources say Standard Bots designs key robot subsystems itself.
          modules:
            - label: AmpereDrive + motors / drives / actuators
            - label: Mechanical parts and final assembly
          outputs:
            - label: Greater cost / supply / performance control
        - label: Deployment layer
          note: Commercial model bundles multiple service intensities around the robot.
          modules:
            - label: DIY / Value-Add / Full Integration
            - label: On-site installation / Jump Start
          outputs:
            - label: Lower dependence on third-party integrators
        - label: Support layer
          note: Support promises are central to the value proposition but remain lightly benchmarked.
          modules:
            - label: 24/7 support + 30-minute response target
            - label: Sub-24h field help when needed
          outputs:
            - label: Faster issue resolution for general manufacturers
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
      - CE010
      - CE012
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence points to a hybrid journey from low-friction discovery through deployment assistance and then
      expansion, with the retention leg still weakly evidenced.
    data:
      items:
        - label: SMB discovery and ROI framing
          actor: Owner or operations lead at a smaller manufacturer
          channel: Aesop coverage and Standard Bots AI page
          touchpoints:
            - No-code, demonstration-led setup is the headline value proposition.
            - The same hardware is described as fitting a 50-person job shop.
          tone: positive
        - label: Enterprise or strategic-account validation
          actor: Procurement or automation stakeholder at a larger organization
          channel: June 2026 media coverage
          touchpoints:
            - Named logos such as Sunoco, Lockheed Martin, Amazon, NASA, and the U.S. Army appear in coverage.
            - Public sources still do not specify account scope or production depth.
          tone: neutral
        - label: Deployment model selection
          actor: Plant team choosing implementation support
          channel: Palletizing page
          touchpoints:
            - DIY kit
            - Value-Add Package
            - Full Integration
          tone: positive
        - label: First production outcome
          actor: Operations team proving use-case economics
          channel: Official case-study teaser
          touchpoints:
            - Shaw Barrels is said to have moved from 200 parts per day to 800.
            - This is the clearest quantified customer outcome in the assigned pool.
          tone: positive
        - label: Expansion through services and support
          actor: Installed customer adding cells or new workflows
          channel: Palletizing support promise
          touchpoints:
            - < 30m call response time
            - < 24h on-site if needed
            - 24/7 U.S. expert support
          tone: positive
        - label: Renewal and concentration underwriting
          actor: Investor or diligence team
          channel: Adverse analysis and risk review
          touchpoints:
            - No public NRR, GRR, churn, contract length, or top-customer mix.
            - The 10% deployment-share target is a projection, not a verified installed-base metric.
          tone: warning
    approximationNotes: >-
      Journey stages are analytical abstractions derived from the assigned sources rather than a management-published
      customer funnel.
    claimRefs:
      - CU001
      - CU006
      - CU007
      - CU010
      - CU011
      - CU014
