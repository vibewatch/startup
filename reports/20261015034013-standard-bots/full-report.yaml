      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The architectural narrative is a layered stack rather than a single hardware SKU. The AI page presents
              vision, motion, and agent capabilities as operator-facing skills; Machine Design’s Automate 2026 coverage
              adds concrete feature names such as Quick Find, Text Find, a Roboflow integration, conversational routine
              generation, and Show Path; Unite.ai names internal stack components including AmpereDrive and ArcOS; and
              the A3 member profile reiterates a vertically integrated design across software, firmware, electronics,
              vision, and mechanical parts. Taken together, the public evidence suggests Standard Bots is trying to own
              the user workflow, robot control layer, and increasing portions of electromechanical design, not just
              assemble commodity arms. What is still missing is a source set that independently benchmarks latency,
              accuracy, uptime, or failure-handling quality for those layers in production conditions.
            claimRefs:
