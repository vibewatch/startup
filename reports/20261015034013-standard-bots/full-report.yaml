  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The investment call stays research-more because a real financing signal and credible adoption wedge are outweighed
      by missing financial proof at the current price.
    data:
      nodes:
        - id: wedge
          label: Accessible product wedge
          note: Official pages frame no-code deployment and multiple service levels for smaller manufacturers.
        - id: financing
          label: Real financing signal
          note: $200 million of Series C capital at a $1 billion valuation confirms a market-clearing private round.
        - id: scale
          label: Scale-up indicators
          note: Independent and syndicated coverage point to a 70,000-square-foot plant and broad deployment claims.
        - id: disclosure
          label: Financial proof gap
          note: Public evidence still lacks audited revenue, gross margin, backlog, retention, and software attach rate.
        - id: underwriting
          label: Price sensitivity stays high
          note: At the current mark, upside depends on proving software-like economics and much higher shipment scale.
        - id: decision
          label: 'Recommendation: research-more / stretched'
          note: Require private KPI and financing-term diligence before treating the round as investable.
      edges:
        - from: wedge
          to: scale
          label: supports adoption narrative
        - from: financing
          to: underwriting
          label: confirms price signal
        - from: scale
          to: underwriting
          label: helps, but does not close
        - from: disclosure
          to: underwriting
          label: blocks buy-underwrite
        - from: underwriting
          to: decision
          label: drives entry discipline
    claimRefs:
      - CV001
      - CV006
      - CV008
      - CV011
      - CV013
