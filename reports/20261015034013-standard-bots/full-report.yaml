              - CI008
              - CI014
      - number: '4.2'
        title: Public traction and capital signals are positive, while cost structure remains partially opaque
        blocks:
          - type: paragraph
            body: >-
              Independent coverage corroborates that Standard Bots raised a $200 million Series C at a $1 billion
              valuation in June 2026 and said the proceeds would expand manufacturing capacity, product development, and
              U.S. deployment. Official and third-party sources also show management emphasizing accessible deployment,
              hundreds of manufacturer users or automated sites, and a goal of reaching roughly 10% of new U.S.
              industrial robot deployments. Those are useful traction proxies, but they are still not revenue-quality
              disclosures. On the cost side, the company’s own materials point to a business that likely carries
              meaningful manufacturing, field-service, and integration obligations: Standard Bots says it builds robots
              end-to-end in the United States, often sells direct, offers on-site jump starts, and can run turnkey
              deployments. That mix can strengthen customer adoption and control, but it usually increases
              working-capital needs and service-delivery load relative to pure software models.
            claimRefs:
              - CI001
              - CI002
              - CI006
              - CI007
              - CI009
              - CI010
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI006
              - CI009
              - CI010
              - CI011
      - number: '4.3'
        title: 'Financial verdict: promising top-of-funnel signals, insufficient underwriting-grade disclosure'
        blocks:
          - type: paragraph
            body: >-
              The financial case is directionally credible but still incomplete. The optimistic case is easy to state:
              public pricing is approachable for SMB manufacturers, the deployment narrative is simpler than legacy
              robotics integration, and new capital can fund capacity expansion and GTM. The hard part is that the core
              underwriting metrics remain undisclosed. There is no public cash balance, burn cadence, backlog, realized
              gross margin, customer concentration, software mix, or cohort payback data. Even the one revenue anchor
              surfaced by an adverse commentary is explicitly treated as a weak and inconsistent third-party estimate
              rather than a verified operating fact. That leaves the chapter with a clear verdict: Standard Bots may be
              building a scalable automation platform, but public evidence today only supports a well-funded growth
              thesis, not a clean read on revenue quality, margin path, or runway sufficiency.
            claimRefs:
              - CI001
              - CI004
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Hybrid revenue model, not a pure robot-arm SKU
            body: >-
              The public commercial surface shows hardware, deployment services, bundled software, and post-sale
              support, so the business should be underwritten as a hybrid product-and-services model until management
              proves a recurring software layer.
            calloutType: insight
            claimRefs:
              - CI003
              - CI004
              - CI008
              - CI014
          - type: callout
            title: Capital adequacy remains the main diligence blocker
            body: >-
              The June 2026 raise removes immediate funding doubt, but public evidence still does not disclose cash on
              hand, monthly burn, debt obligations, or margin structure, so runway and next-round dependency cannot be
              verified from public materials.
            calloutType: risk
            claimRefs:
              - CI001
              - CI002
              - CI010
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What the company actually ships
        blocks:
          - type: paragraph
            body: >-
              The assigned source set supports a more concrete product map than a generic “AI robotics” pitch. Standard
              Bots’ current public lineup spans Spark, Core, and Thor, covering light benchtop work through heavier
              industrial payloads, while the palletizing page bundles Thor into a full cell with controls, sensors,
              gripper, and software instead of selling only an arm. Across official pages, trade coverage, and
              directories, the use-case map is consistent: machine tending, palletizing, welding, pick-and-place,
              surface finishing, assembly, and inspection. That matters because it frames Standard Bots less as a
              research platform and more as a broadening cobot vendor trying to reduce application-specific integration
              friction for general manufacturers. The strongest product proof remains company-authored, but the external
              descriptions are specific enough to validate the workflow categories and the company’s focus on
              non-specialist deployment rather than only on bespoke engineering projects.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE006
          - type: table
