  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary is industrial automation, not generalized physical AI
        blocks:
          - type: paragraph
            body: >-
              The usable market boundary today is narrower than the company's broader physical-AI narrative. Standard
              Bots' cited applications cluster around machine tending, palletizing, welding, assembly, inspection, and
              similar manufacturing tasks, while TNW says the company still sees home robotics as a future opportunity
              but "remains focused on industrial use for now." That means the included spend is best framed as
              industrial robot hardware plus the surrounding control software, accessories, training, deployment, and
              service needed to make a cell productive, rather than all robotics or consumer automation. The official
              palletizing page reinforces that boundary by selling a full cell, multiple deployment modes, and on-site
              support instead of a bare component.
            claimRefs:
              - CM001
              - CM002
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM015
      - number: '2.2'
        title: Sizing evidence supports a meaningful wedge, but not a clean TAM/SAM/SOM stack
        blocks:
          - type: paragraph
            body: >-
              The best public sizing lens is a deployment lens, not a revenue-backed TAM model. TNW says the
              International Federation of Robotics recorded approximately 44,000 U.S. industrial robot installations in
              2024, and it notes that Standard Bots' stated ambition of 10% of new U.S. deployments would imply roughly
              4,400 to 5,000 units depending on 2026 totals. That gives a concrete ceiling for the company's near-term
              share ambition, but it is still a projection rather than verified shipment data. Public sources do not
              disclose current unit volume, revenue, or profitability, and the Silicon Valley Invest Club tear sheet
              compiles inconsistent revenue estimates ranging from less than $5 million to about $24 million annualized,
              so the market case cannot yet be translated into a reliable SOM or recurring-software model from public
              evidence alone.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM013
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM011
              - CM013
      - number: '2.3'
        title: Buyer adoption path centers on accessibility for capacity-constrained manufacturers
        blocks:
          - type: paragraph
            body: >-
              The company is aiming at manufacturers that want automation without a full robotics engineering team,
              especially smaller and mid-sized shops where deployment friction matters as much as headline capability.
              Accio describes Standard Bots as targeting fast, affordable, and easy-to-implement automation for small to
              medium-sized manufacturers, while independent coverage repeatedly emphasizes demonstration-based training
              and no-code operation as the core adoption mechanism. The official palletizing page broadens that path
              from self-serve kits to guided rollout and full integration, which implies different buyers and budget
              holders across plant operations, manufacturing engineering, and automation leadership rather than a single
              homogeneous purchaser.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM014
      - number: '2.4'
        title: Demand drivers are real, but market conversion still depends on proof beyond price
        blocks:
          - type: paragraph
            body: >-
              The bullish market logic is straightforward: manufacturers face labor shortages, U.S. competitiveness
              pressure, and a continuing need for automation that is easier to deploy than traditional robot programs.
              Yet the constraint side matters just as much for valuation. Independent coverage says Standard Bots is
              pushing a lower-cost, more vertically integrated offer, and its facility expansion signals an attempt to
              scale supply, but adverse analysis argues that cheaper hardware alone cannot justify a unicorn outcome
              unless software, support, and repeat-deployment economics become durable. In other words, the market
              appears large enough to matter, but public evidence still leaves the conversion rate from broad automation
              demand to company-specific economic value unresolved.
            claimRefs:
              - CM006
              - CM011
              - CM012
              - CM013
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Sizing remains a diligence gap, not a closed model
            body: >-
              Public evidence is strong enough to bound the current category and to translate the company's 10% U.S.
              deployment ambition into an implied unit range, but not strong enough to verify present shipments,
              customer concentration, software attach, or recurring margin structure.
            calloutType: risk
            claimRefs:
              - CM008
              - CM010
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set spans incumbents, direct cobot peers, and physical-AI entrants
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports a broad competitive set rather than a one-peer narrative. Standard Bots
              directly frames itself against collaborative robot vendors including Universal Robots, ABB, Techman Robot,
              Omron, and FANUC on price and use-case fit, while TNW places the company inside a demonstration-learning
              field that also includes Covariant, Realtime Robotics, and several Chinese firms. Dealroom's public
              taxonomy adds a second flank: investors and databases increasingly cluster Standard Bots with broader
              physical-AI entrants such as Sanctuary AI, Physical Intelligence, Preferred Networks, and Skild. That
              means buyers can solve the same automation job through incumbent cobots, adjacent AI-native automation
              vendors, or the status quo of integrator-led bespoke automation and internal engineering efforts.
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP008
              - CP010
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP007
              - CP012
      - number: '3.2'
        title: Public differentiation is strongest on list pricing and operator simplicity
        blocks:
          - type: paragraph
            body: >-
              Standard Bots' strongest public wedge is a lower-friction purchase story. Its own January 2026 pricing
              guide lists RO1 at $37,000 with built-in vision and no recurring license fees, then places major peer
              price bands above or around that entry point. The company's palletizing page extends the pitch from
              pricing into capability, comparing Thor against FANUC CRX-30iA and Universal Robots UR30 on identical 30
              kg payload but better reach, repeatability, and linear speed. Those comparisons are vendor-authored, so
              they show how Standard Bots wants buyers to think rather than independently verified benchmark outcomes,
              but they still explain why the company is selling "easy automation" rather than a premium integrator-heavy
              system.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP007
              - CP008
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP006
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP010
              - CP013
      - number: '3.3'
        title: The go-to-market pitch tries to reduce integrator dependence, not eliminate switching risk
        blocks:
          - type: paragraph
            body: >-
              The distribution message is also part of the product strategy. Standard Bots says its robots learn through
              demonstration instead of traditional coding, and on the palletizing page it pairs that claim with
              direct-sales and deployment options ranging from a DIY kit to guided rollout and full integration. That
              can compress time-to-value for SMB buyers that lack in-house robotics engineers, and it also helps explain
              why the company claims adoption from both named enterprises and hundreds of smaller manufacturers. But the
              same evidence does not prove low switching costs after deployment: buyers still need to test whether
              software workflows, support responsiveness, and multi-site rollout beat the incumbent channel depth
              already held by larger robot vendors.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP013
      - number: '3.4'
        title: Durability is plausible, but public proof still trails the ambition
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence is not that Standard Bots lacks a story; it is that public proof of the story is
              still incomplete. NewMarketPitch argues the pricing wedge is real but says the defensibility question
              remains open because vendors such as Universal Robots, ABB, FANUC, Yaskawa, Dobot, Techman, and Omron can
              counter on price, trust, channel, or features. TNW makes a similar point more concretely: the company's
              10% deployment target is management's projection, while unit volumes, revenue, and profitability remain
              undisclosed. Until public evidence shows realized pricing, repeat deployments, and independent win-loss
              data, the moat reads as promising but not yet durable.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The clearest wedge is simpler deployment at a visible entry price
            body: >-
              Public evidence consistently shows Standard Bots selling lower-friction automation: demonstration-based
              programming, a $37,000 entry robot, and deployment choices that range from self-serve to full integration.
            calloutType: strength
            claimRefs:
              - CP003
              - CP005
              - CP013
          - type: callout
            title: Price leadership is helpful, but open evidence does not prove a moat
            body: >-
              The strongest adverse source says the pricing wedge is real but still vulnerable to incumbent price,
              feature, trust, and channel responses, and TNW separately notes that core operating proof points remain
              undisclosed.
            calloutType: risk
            claimRefs:
              - CP009
              - CP010
              - CP011
          - type: callout
            title: The company is competing across two frames at once
            body: >-
              Standard Bots is not only fighting classic cobot incumbents; investor databases and industry coverage also
              place it alongside broader physical-AI entrants, which expands the future competitor set beyond robot-arm
              pricing tables.
            calloutType: insight
            claimRefs:
              - CP008
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public pricing are visible, but realized economics are not
        blocks:
          - type: paragraph
            body: >-
              The clearest public evidence is about what Standard Bots appears to sell, not what it earns. Official
              pages show a direct commercial motion around robot hardware and palletizing cells, with three deployment
              modes that range from a self-serve kit to guided deployment and full integration. The same official
              material markets a no-code operating model, bundled software, and fast field support, which implies that
              revenue likely comes from more than a one-time arm sale even when the public page only exposes list-style
              offers. Public pricing is still mostly list pricing and benchmark language: the company says RO1 costs
              $37,000, and its own guide frames installation, tooling, and training as material add-ons. That is enough
              to infer a hybrid hardware, integration, and support revenue stack, but not enough to infer realized ASPs,
              software attach, discounting, or contribution margins.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI008
              - CI013
              - CI014
