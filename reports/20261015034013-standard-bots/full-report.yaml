        title: Exhibits
        blocks:
          - type: callout
            title: Simplicity and service are the public wedge
            body: >-
              The assigned official sources consistently pair a relatively transparent entry price with no-code
              positioning and three deployment models, implying that Standard Bots' commercial wedge is ease of adoption
              as much as robot hardware.
            calloutType: insight
