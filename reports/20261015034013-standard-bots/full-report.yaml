        - >-
          A flat or down-round outcome becomes plausible because the public record does not support current-price
          conviction.
        - Hardware gross-margin pressure, long deployments, or preference-stack drag.
        - Triggered if private diligence does not close today's gaps.
    notes: >-
      Scenario rows are qualitative underwriting lenses anchored to the disclosed $1 billion Series C mark because
      public evidence does not support a fully modeled DCF or direct comp set.
    claimRefs:
      - CV001
      - CV007
      - CV008
