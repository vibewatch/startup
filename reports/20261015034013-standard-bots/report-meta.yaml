summary:
  headline: >-
    Research-more: Standard Bots has a credible AI-native cobot product narrative and real financing support, but the
    June 2026 $1B valuation is still too price-sensitive to underwrite from public evidence because revenue, margins,
    shipment depth, and cap-table terms remain undisclosed.
