  topStrengths:
    - Real June 2026 Series C financing at a $1B valuation gives the company a credible market-clearing price signal.
    - >-
      Public product pages show a clear low-friction deployment wedge: direct sales, no-code positioning, and
      guided-to-turnkey rollout options.
    - Domestic-manufacturing and vertical-integration messaging is coherent across official and third-party sources.
  topRisks:
    - >-
      Public evidence still does not disclose audited revenue, margins, backlog, shipment depth, or customer
      concentration.
    - >-
      The hardware-plus-services model is likely capital intensive and margin opaque without management-reconciled
      disclosures.
    - >-
      Competitive differentiation is plausible, but realized moat strength and repeat deployment economics remain
      unproven.
  unresolvedGaps:
    - Audited or management-reconciled financials covering revenue, gross margin, burn, cash, and runway.
    - >-
      Full cap table, liquidation preferences, anti-dilution terms, and whether the Series C included any secondary or
      structured components.
    - >-
      Independent evidence for deployment depth, customer concentration, retention, and progress toward the claim of
      reaching 10% of new U.S. robot deployments by 2027.
    - Third-party safety and certification documentation, plus ship-readiness milestones for Bolt.
    - >-
      Board composition, governance rights, and a clearer public explanation of David Golden's current role and
      involvement.
