        - id: support
          label: 售后支持
          value: Jump Start plus fast field support
          note: 产品文案展示了支持服务，但未披露其变现方式。
        - id: gross-profit
          label: 毛利结果
          value: Undisclosed
          note: 利润率取决于硬件、服务、支持，以及未公开拆分的软件附加收入。
      edges:
        - from: demand
          to: hardware
          label: 创造订单机会
        - from: hardware
          to: integration
          label: 需要部署投入
        - from: integration
          to: services
          label: 推动项目人力
        - from: services
          to: support
          label: 产生正常运行时间义务
        - from: support
          to: gross-profit
          label: 决定利润率质量
    approximationNotes: 由于公开证据未披露转化率、附加率或单台利润率，该流程仅作定性描述。
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI008
      - CI014
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开来源描述了从操作员工作流到支持运营的多层产品栈。
    data:
      layers:
        - label: 操作员工作流
          note: No-code and demonstration entry points aimed at non-specialist operators.
          modules:
            - label: 自然语言任务设置
            - label: iPad 上的 Palletizing Wizard
            - label: 示教模式：远程操作、助力抬升、点动
          outputs:
            - label: Faster initial setup for shop-floor users
        - label: AI 技能层
          note: Trade-show coverage adds named feature modules beyond the generic AI pitch.
          modules:
            - label: Vision / Quick Find / Text Find
            - label: Motion / Show Path
            - label: Agent / 对话式程序生成
          outputs:
            - label: Adaptation to changing parts and task variation
        - label: 产品硬件层
          note: Official lineup separates benchtop, mid-range, and heavy-payload arms.
          modules:
            - label: Spark 型号：7 kg / 900 mm
            - label: Core 型号：18 kg / 1,300 mm
            - label: Thor 型号：30 kg / 2,000 mm
          outputs:
            - label: Coverage from R&D benches to palletizing cells
        - label: 控制软件层
          note: Unite.ai and A3 describe internally controlled software and motion systems.
          modules:
            - label: ArcOS 控制软件
            - label: 视觉、固件和电子设备
          outputs:
            - label: Internal control of user workflow and robot behavior
        - label: 机电层
          note: Trade and company sources say Standard Bots designs key robot subsystems itself.
          modules:
            - label: AmpereDrive + 电机 / 驱动器 / 执行器
            - label: 机械部件和最终组装
          outputs:
            - label: Greater cost / supply / performance control
        - label: 部署层
          note: Commercial model bundles multiple service intensities around the robot.
          modules:
            - label: DIY / 增值服务 / 全面集成
            - label: 现场安装 / Jump Start
          outputs:
            - label: Lower dependence on third-party integrators
        - label: 支持层
          note: Support promises are central to the value proposition but remain lightly benchmarked.
          modules:
            - label: 24/7 支持 + 30 分钟响应目标
            - label: 必要时 24 小时内提供现场帮助
          outputs:
            - label: Faster issue resolution for general manufacturers
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
      - CE010
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据显示，客户旅程从低门槛发现开始，经过部署支持走向扩张，但留存环节的证据仍然薄弱。
    data:
      items:
        - label: SMB 发现与 ROI 评估
          actor: 小型制造商的所有者或运营负责人
          channel: Aesop 报道和 Standard Bots AI 页面
          touchpoints:
            - 无代码、以演示驱动的设置是核心价值主张。
            - 同一套硬件被描述为适合拥有 50 人的车间。
          tone: positive
        - label: 企业或战略客户验证
          actor: 大型组织的采购或自动化负责人
          channel: 2026 年 6 月媒体报道
          touchpoints:
            - 报道中出现 Sunoco、Lockheed Martin、Amazon、NASA 和美国陆军等知名名称。
            - 公开来源仍未说明客户范围或生产深度。
          tone: neutral
        - label: 部署模式选择
          actor: 选择实施支持的工厂团队
          channel: Palletizing 页面
          touchpoints:
            - DIY 套件
            - 增值服务包
            - 全面集成
          tone: positive
        - label: 首个生产结果
          actor: 验证用例经济性的运营团队
          channel: 官方案例预告
          touchpoints:
            - 据称 Shaw Barrels 已从每天 200 个零件提升至 800 个。
            - 这是指定证据池中最清晰的量化客户结果。
          tone: positive
        - label: 通过服务和支持扩张
          actor: 已安装客户增加工作单元或新工作流
          channel: Palletizing 支持承诺
          touchpoints:
            - 电话响应时间 < 30m
            - 必要时 < 24h 到场
            - 24/7 美国专家支持
          tone: positive
        - label: 续约与客户集中度判断
          actor: 投资人或尽调团队
          channel: 反向分析与风险审查
          touchpoints:
            - 没有公开 NRR、GRR、流失率、合同期限或头部客户构成。
            - 10% 部署份额目标是预测，不是经过验证的安装基数指标。
          tone: warning
    approximationNotes: 旅程阶段是根据指定来源提炼的分析抽象，而非管理层发布的客户漏斗。
    claimRefs:
      - CU001
      - CU006
      - CU007
      - CU010
      - CU011
      - CU014
