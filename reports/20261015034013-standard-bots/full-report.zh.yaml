  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式和公开价格可见，但实际经济性不可见
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开证据说明 Standard Bots
              似乎卖什么，而不是它赚了什么。官方页面展示了围绕机器人硬件和码垛工作单元的直销模式，部署方式从自助套件延伸到引导式部署和完整集成。官方材料还销售无代码操作模式、捆绑软件和快速现场支持，因此收入可能不止一次性机械臂销售，即便公开页面只展示标价式方案。现有价格大多仍是标价和基准语言：公司称
              RO1 售价 $37,000，自有指南把安装、工具和培训列为重要增项。这足以推断其收入栈包含硬件、集成和支持，但不足以推断实际 ASP、软件附加率、折扣或贡献利润率。
