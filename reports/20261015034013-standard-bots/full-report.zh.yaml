      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观情景
        - 部署方面的说法转化为可重复复制的工作单元、软件或服务附加收入，以及每年数千台的出货量。
        - 只有在未来收入达到约 $75 million 至 $100 million、且具备软件式经济性时，当前 $1 billion 估值或更高估值才站得住。
        - 执行、渠道和利润率证据仍需兑现。
        - 需要私有 KPI 材料确认出货速度和附加收入。
      - - 基准
        - 融资会加速制造和部署，但经济性喜忧参半，证据兑现速度慢于估值上涨。
        - 当前估值可以理解为风险投资期权价值，但没有更好的入场价格或更强证据，回报判断仍然薄弱。
        - 估值倍数收缩，商业化放缓。
        - 与当前公开证据最匹配。
      - - 悲观情景
        - 收入、积压订单、留存或融资条款落后于独角兽叙事。
        - 由于公开记录不足以支撑对当前价格的确信，平轮或下轮融资结果变得可能。
        - 硬件毛利率压力、部署周期长，或优先股堆叠拖累。
        - 如果私有尽调无法补上当前缺口，则触发该情景。
    notes: 情景行是定性的投资判断视角，以已披露的 $1 billion C 轮估值为锚，因为公开证据不足以支持完整 DCF 或直接可比公司组。
