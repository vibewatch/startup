        title: 展示项
        blocks:
          - type: callout
            title: 简单易用与服务能力构成公开切入点
            body: 现有官方来源始终把相对透明的入门价格、无代码定位和三种部署模式放在一起，说明 Standard Bots 的商业切入点既是机器人硬件，也在于让客户更容易采用。
