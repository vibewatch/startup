      - number: '3.3'
        title: GTM 叙事试图减少对集成商的依赖，而不是消除切换风险
        blocks:
          - type: paragraph
            body: >-
              分销信息也是产品策略的一部分。Standard Bots 称机器人通过示范学习，而不是依赖传统编程；码垛页面则把这一说法与直销和部署选项放在一起，覆盖 DIY
              套件、引导式上线和完整集成。对于缺少内部机器人工程师的中小买方，这可能缩短实现价值的时间，也解释了公司为何声称既有知名企业客户，也有数百家小型制造商采用。但同一批证据并不能证明部署后的切换成本很低：买方仍需验证软件流程、支持响应和多工厂扩展是否优于大型机器人厂商已经掌握的渠道深度。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP013
