chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公开概况与经营姿态
        blocks:
          - type: paragraph
            body: >-
              Standard Bots 的官方渠道始终把公司定位为美国工业机器人制造商，而非纯软件创业公司。官网称其为“美国最大的 AI 原生工业机器人制造商”，总部位于纽约州 Glen Cove；A3
              会员资料和产品页面则进一步印证其覆盖硬件、软件和服务交付的垂直整合体系。这家私有硬件公司的产品和商业切入点也格外明确：2026 年 1 月的博客公布 Core 的标价
              $37,000，公司强调自动化正变得更适合小型制造商，码垛页面则展示了从 DIY 到交钥匙集成的三种部署模式。这一组合说明，近期投资逻辑不只是更便宜的硬件，还包括为机器人工程能力有限的制造商降低部署门槛。
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
              - CO008
              - CO009
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO004
              - CO007
              - CO010
              - CO011
              - CO014
      - number: '1.2'
        title: 创始人、管理层与治理透明度
        blocks:
          - type: paragraph
            body: >-
              现有证据足以确认公开点名的管理层名单，但不足以评估治理深度。2026 年 8 月的资料页将公司 2011 年创立归于 Evan Beard 和 David Golden，并列出四个公开管理岗位：Beard 任
              CEO，Zach Tomkinson 任总裁，Ashley Higgins 任首席战略官，Golden 任联合创始人。同一证据集没有披露现任董事会名单、投票权，或 Golden
              日常经营职责的详细说明，因此管理层身份比治理结构更清晰。公司正要求投资者相信其制造业规模化叙事，但创始团队内部的权力和监督如何分配，公开细节仍很有限。
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO014
              - CO016
