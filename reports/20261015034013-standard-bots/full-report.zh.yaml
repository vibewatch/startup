  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 当前市场边界是工业自动化，而非泛化的物理 AI
        blocks:
          - type: paragraph
            body: >-
              当前可用的市场边界比公司的广义物理 AI 叙事更窄。Standard Bots 已披露的应用集中在机床上下料、码垛、焊接、装配、检测及类似制造任务；TNW
              称公司虽把家用机器人视为未来机会，但“目前仍专注工业用途”。因此，纳入范围更适合定义为工业机器人硬件，以及让工作单元真正投入生产所需的控制软件、配件、培训、部署和服务，而不是所有机器人或消费自动化。官方码垛页面也印证了这一边界：它销售完整工作单元、多种部署模式和现场支持，而非单一零部件。
            claimRefs:
              - CM001
              - CM002
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM015
      - number: '2.2'
        title: 规模证据支持有意义的切入点，但还拼不出干净的 TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              最好的公开规模化视角是部署量，而不是由收入支撑的 TAM 模型。TNW 称国际机器人联合会记录到 2024 年美国约有 44,000 台工业机器人安装，并指出 Standard Bots 声称要占美国新增部署量
              10%，按 2026 年总量计算意味着约 4,400 至 5,000 台。这为公司的近期份额目标提供了具体上限，但仍是预测，不是已验证的出货数据。公开来源没有披露当前设备量、收入或盈利能力；Silicon
              Valley Invest Club 资料页汇总的收入估计也不一致，从年化不足 $5 million 到约 $24 million 不等，因此仅凭公开证据还无法把市场故事转成可靠的 SOM 或经常性软件模型。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM013
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM011
              - CM013
      - number: '2.3'
        title: 产能受限制造商的买方采用路径：先解决可及性
        blocks:
          - type: paragraph
            body: >-
              公司瞄准希望实现自动化、却没有完整机器人工程团队的制造商，尤其是部署摩擦与功能本身同样重要的小型和中型工厂。Accio 将 Standard Bots
              描述为面向中小制造商，提供快速、可负担且易于落地的自动化；独立报道也反复强调示教式培训和无代码操作是核心采用机制。官方码垛页面把路径从自助套件扩展到引导式上线和完整集成，意味着工厂运营、制造工程和自动化管理岗位中可能存在不同买方和预算持有人，而不是一个同质化采购者。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM014
      - number: '2.4'
        title: 需求驱动真实存在，但市场转化仍取决于价格之外的证明
        blocks:
          - type: paragraph
            body: >-
              看多市场逻辑很直接：制造商面临劳动力短缺、美国竞争力压力，以及持续存在的自动化需求，而传统机器人项目往往更难部署。但估值也必须看约束端。独立报道称 Standard Bots
              正推动更低成本、垂直整合程度更高的方案，厂房扩建也显示其试图扩大供给；审慎分析则认为，除非软件、支持和重复部署经济性变得持久，否则单靠更便宜的硬件不足以支撑独角兽结果。换言之，市场足够大，但公开证据仍未说明：广泛的自动化需求，究竟有多少能转化为
              Standard Bots 自身的经济价值。
            claimRefs:
              - CM006
              - CM011
              - CM012
              - CM013
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 规模仍是待尽调缺口，而非已经闭合的模型
            body: 公开证据足以界定当前品类，并把公司占美国部署量 10% 的目标换算成隐含设备区间，但不足以验证当前出货、客户集中度、软件附加率或经常性利润结构。
            calloutType: risk
            claimRefs:
              - CM008
              - CM010
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合覆盖老牌厂商、直接协作机器人同行和物理 AI 新进入者
        blocks:
          - type: paragraph
            body: >-
              留存证据支持一个广泛的竞争集合，而不是单一同行叙事。Standard Bots 直接把自己与 Universal Robots、ABB、Techman Robot、Omron 和 FANUC
              等协作机器人厂商放在价格和使用场景上比较；TNW 则把公司置于一个以示教学习为特色的赛道中，竞争者还包括 Covariant、Realtime Robotics 和多家中国公司。Dealroom
              的公开分类又增加了另一侧：投资人和数据库越来越多地把 Standard Bots 与 Sanctuary AI、Physical Intelligence、Preferred Networks 和 Skild
              等更广义的物理 AI 新进入者归为一组。买方因此可以通过成熟协作机器人、相邻的 AI 原生自动化供应商，或集成商主导的定制自动化和内部工程，解决同一个自动化任务。
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP008
              - CP010
              - CP012
