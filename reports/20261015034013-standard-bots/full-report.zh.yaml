        title: 耐久性有可能成立，但公开证明仍落后于目标
        blocks:
          - type: paragraph
            body: >-
              反向证据并不是说 Standard Bots 没有故事，而是故事的公开证明仍不完整。NewMarketPitch 认为价格切入点真实存在，但防御性仍待回答，因为 Universal
              Robots、ABB、FANUC、Yaskawa、Dobot、Techman 和 Omron 等厂商可以从价格、信任、渠道或功能上反击。TNW 也提出了更具体的类似观点：公司 10%
              的部署目标是管理层预测，而设备量、收入和盈利能力仍未披露。在公开证据展示实际价格、重复部署和独立胜负数据之前，这道护城河只能算有希望，还谈不上持久。
