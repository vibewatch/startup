  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 投资结论仍是继续研究：真实融资信号和可信的采用切入点，抵不过当前价格下缺失的财务证明。
    data:
      nodes:
        - id: wedge
          label: 易接入的产品切入点
          note: 官方页面面向较小制造商，展示无代码部署和多个服务层级。
        - id: financing
          label: 真实融资信号
          note: C 轮融资 $200 million、估值 $1 billion，确认这是一次市场认可的私募轮次。
        - id: scale
          label: 扩张指标
          note: 独立报道和转载报道指向一座 70,000 平方英尺的工厂，以及广泛部署的说法。
        - id: disclosure
          label: 财务证明缺口
          note: 公开证据仍缺少经审计收入、毛利率、积压订单、留存和软件附加率。
        - id: underwriting
          label: 价格敏感度仍高
          note: 按当前估值，上行空间取决于证明软件式经济性和大幅提高出货规模。
        - id: decision
          label: 建议：继续研究 / 估值偏高
          note: 在把本轮视为可投资之前，要求私有 KPI 和融资条款尽调。
      edges:
        - from: wedge
          to: scale
          label: 支持采用叙事
        - from: financing
          to: underwriting
          label: 确认价格信号
        - from: scale
          to: underwriting
          label: 有帮助，但无法补齐缺口
        - from: disclosure
          to: underwriting
          label: 阻止买入判断
        - from: underwriting
          to: decision
          label: 推动入场纪律
    claimRefs:
      - CV001
      - CV006
      - CV008
      - CV011
      - CV013
