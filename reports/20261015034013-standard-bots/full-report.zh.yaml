      - number: '3.2'
        title: 公开差异化最强在标价和操作简单
        blocks:
          - type: paragraph
            body: >-
              Standard Bots 最强的公开切入点是更低摩擦的购买体验。其 2026 年 1 月价格指南将带内置视觉、无经常性许可费的 RO1 标为
              $37,000，并把主要同行的价格区间列在这一入门价之上或附近。公司的码垛页面又把叙事从价格延伸到能力，将 Thor 与 FANUC CRX-30iA 和 Universal Robots UR30 在相同 30
              kg 负载下对比，声称触达范围、重复性和直线速度更好。这些比较由厂商自己撰写，说明的是 Standard Bots
              希望买方如何理解产品，而不是独立验证的基准结果；但它们解释了公司为什么销售“易用自动化”，而不是依赖集成商的高端系统。
