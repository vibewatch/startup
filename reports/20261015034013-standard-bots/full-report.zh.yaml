      - number: '1.3'
        title: 融资历史与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              公开融资证据远强于公开经营证据。Unite AI 报道 Standard Bots 于 2026 年 6 月 9 日完成 $200 million Series C，估值 $1 billion；资料页将这笔融资与
              2024 年 $63 million Series B 合并，得出 $263 million+ 的累计融资。已披露投资人包括 RoboStrategy、General Catalyst、Amazon
              Industrial Innovation Fund、Samsung Next、Box Group 和 GiantLeap
              Capital，呈现出财务投资人与战略投资人并存的组合。缺失的是融资标题以下的经济和控制层：现有证据没有披露清算优先权、老股出售比例、持股比例或股东权利，因此融资里程碑真实存在，但治理和稀释机制仍只部分可见。
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO016
          - type: table
            tableRef: TO003
            claimRefs:
              - CO010
              - CO011
              - CO012
      - number: '1.4'
        title: 里程碑、规模信号与核心悬问
        blocks:
          - type: paragraph
            body: >-
              里程碑记录支持真实的规模化故事，但还不足以支撑一套完整的独角兽投资判断。时间线包括 2011 年创立、2023 年前后可见的 A3 会员身份、2024 年 Series B、2025 年 5
              月的厂房扩建和更大负载产品里程碑，以及 2026 年 6 月 Series C。官方材料还把叙事延伸到未来，称公司将在 2027
              年于美国实现“从金属进入到机器人产出”的全流程制造。尚未解决的关键问题是：公开经营证据是否已经追上融资估值。资料中的审慎来源认为并没有，而本章现有证据也没有用经审计收入、利润率、出货量或资本表披露来反驳这一点。
