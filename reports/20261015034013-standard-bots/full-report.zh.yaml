            body: 如果已披露的 2026 年出货量远低于“达到 10% 部署量”这一说法所隐含的数千台规模，如果制造爬坡期间直支持响应质量恶化，或者下一次更新时独立安全和认证证据仍落后于部署扩张，风险判断应显著恶化。
            calloutType: risk
            claimRefs:
              - CR004
              - CR006
              - CR013
          - type: callout
            title: 可见缓释措施仍是商业措施，尚未审计
            body: 本批材料中的公开缓释措施包括价格、垂直整合、本地推理和人工服务。这些措施可能改善采用，但不能替代经审计的单位经济性、出货证明、服务产能指标或第三方认证证据。
            calloutType: insight
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR010
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 按当前价格仍建议继续研究
        blocks:
          - type: paragraph
            body: >
              留存材料中最有力的估值事实是，Standard Bots 确实在 2026 年 6 月完成了一轮真实的独角兽价格融资：多家第三方来源与 Tracxn 均指向 $200 million Series C 和 $1
              billion 估值；Tracxn 还显示，2024 年 Series B 与 2026 年 Series C 的已披露累计融资达到 $263 million。这足以把当前价格视为真实的私募市场信号，而不是传闻。


              但仅凭公开证据，还不足以按同一价格承销买入。资料中的不利估值审查明确指出，公开记录仍缺少经审计收入、出货量、毛利率、订单积压、留存和软件附加率，并认为即使采用方向性的收入锚点，硬件比重较高的机器人业务也会对应溢价倍数。融资信号领先于经营证明，因此在私下尽调补齐
              KPI 和条款缺口前，价格敏感型结论仍是继续研究，风险高，估值偏紧。
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV009
              - CV010
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV009
              - CV010
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV011
              - CV013
      - number: '8.2'
        title: 乐观情景存在，但反命题仍主导投资判断
        blocks:
          - type: paragraph
            body: >
              乐观情景可以理解。Standard Bots
              官方页面描述了直销、自助、引导和交钥匙部署路径，强调无代码易用性，并把产品线定位为面向小型制造商的可负担自动化，而不只是面向大型企业、依赖集成商的项目。公司发布和独立报道还指向 Glen Cove
              更大的厂房、数百家企业部署的说法，以及明年达到美国新增工业机器人部署量约 10%
              的目标。如果这些经营叙事最终转化为重复部署的工作单元、软件或服务附加率，以及更快的部署周期，这轮融资就更像早期平台押注，而不是过度定价。


              反命题是，公开披露仍落后于估值。验证融资轮的同一批证据，并没有验证收入质量、利润率、客户集中度、订单积压的耐久性，或 Standard Bots
              究竟在多大程度上已从低成本机械臂厂商变成软件赋能的自动化平台。因此情景分布是不对称的：上行可信，但前提是私有 KPI 证据必须明显好于公开记录目前呈现的情况。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
      - number: '8.3'
        title: 任何可投资进入前的最终尽调要求
        blocks:
          - type: paragraph
            body: >
              现在要做严肃的投资决策，需要私有证明，而不是又一轮叙事汇总。优先要求管理层核对的 KPI
              包，应该覆盖收入、毛利率、出货量、订单积压、部署批次、重复订单，以及任何能够支撑软件式估值逻辑的软件或服务附加收入。融资文件同样重要：没有完整股权结构表、清算优先权、反稀释条款、董事会权利，以及 Series C
              任何老股出售或结构化成分，就无法仅凭公开证据完整评估入场纪律。


              如果尽调显示硬件式利润率却没有有意义的经常性收入，如果部署说法无法转化为可重复的出货速度，或者优先股堆叠显著削弱普通股等价的下行保护，投资逻辑就会失效。只有当私有材料显示 Standard Bots
              正把真实的价格和易用性切入点转化为持久商业规模，且经济性足以支撑或超过当前独角兽价格时，逻辑才会改善。
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 公开证据支持融资轮，而非投资判断
            body: 真实的独角兽价格融资已经发生，但留存材料仍未披露足够经营细节，无法支持在同一价格买入。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV008
              - CV013
          - type: callout
            title: 哪些信息会改变结论
            body: 只有私有尽调证明出货增长可重复、软件或服务附加率成立，且融资条款没有通过优先权悬置掩盖下行风险，投资建议才可能改善。
            calloutType: assumption
            claimRefs:
              - CV010
              - CV011
              - CV013
