evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-governance
    missingEvidence: >-
      A current cap table, liquidation preferences, board composition, observer rights, and any secondary or structured
      components of the 2026 Series C.
    whyItMatters: >-
      Public round headlines do not reveal dilution economics, control rights, or downside protection, all of which
      affect valuation judgment and governance risk.
    diligencePath: >-
      Request financing documents, the current cap table, investor-rights agreements, and a current board observer
      matrix from management.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Audited or management-reconciled revenue, gross margin, backlog, shipment volume, software attach, retention, and
      customer concentration data.
    whyItMatters: >-
      The company can be identified and financed from public evidence, but operating quality cannot be underwritten
      cleanly without these metrics.
    diligencePath: >-
      Request audited financials, board or lender reporting packs, deployment cohort data, and customer concentration
      disclosures.
    relatedQuestionRefs:
      - QO005
  - type: missing-source
    severity: material
    topic: sam-som-sizing
    missingEvidence: >-
      Segmented deployment volumes, average selling prices, software attach rates, and customer expansion data by buyer
      cohort.
    whyItMatters: >-
      Without these operating metrics, the chapter can bound a category and a share ambition but cannot verify a
      realistic serviceable obtainable market or recurring-value model.
    diligencePath: >-
      Request management cohort data showing installed units, ASP, software/services mix, and repeat deployments by
      segment for the last 12-24 months.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: revenue-estimates
    missingEvidence: A reconciled company or audited revenue disclosure that supersedes conflicting secondary-database estimates.
    whyItMatters: >-
      The public revenue range is too inconsistent to support valuation-multiple or SAM conversion analysis with
      confidence.
    diligencePath: >-
      Obtain management-reconciled trailing-twelve-month revenue, gross margin, bookings, and backlog, plus bridge notes
      explaining differences from third-party datasets.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-ownership
    missingEvidence: >-
      Customer procurement evidence showing who owns the budget, what payback thresholds are used, and how often
      deployments expand after the first cell.
    whyItMatters: >-
      Budget ownership and repeatability determine whether the wedge is a niche equipment sale or a scalable platform
      motion across manufacturers.
    diligencePath: >-
      Ask for anonymized customer case files or references showing initial buyer title, approval path, implementation
      time, payback, and follow-on expansion.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-attach
    missingEvidence: Customer-level pricing, discounting, financing terms, software attach, and support attach by segment.
    whyItMatters: >-
      List prices alone do not show whether Standard Bots' wedge survives procurement, channel incentives, or multi-site
      rollouts.
    diligencePath: >-
      Request redacted quotes, reseller or direct contract templates, and cohort-level realized pricing by deployment
      type.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: win-loss-and-switching
    missingEvidence: >-
      Independent win-loss data, replacement stories, and multi-homing evidence against Universal Robots, FANUC, ABB,
      and Techman.
    whyItMatters: >-
      Without buyer-side evidence, the chapter cannot judge whether deployment ease actually overcomes incumbent trust
      and installed-base advantages.
    diligencePath: >-
      Collect customer references, procurement evaluations, and field case studies that compare at least two named
      alternatives.
    relatedQuestionRefs:
      - QP006
      - QP008
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: deployment-depth
    missingEvidence: >-
      Shipped units, deployed-site counts, backlog, field failure rates, and service-response metrics behind the 10%
      deployment ambition.
    whyItMatters: >-
      The moat depends on repeatable deployment loops and operating scale, not just on a financing event or management
      projection.
    diligencePath: >-
      Request board or lender materials with shipped units, active deployments, backlog, and support SLA performance by
      quarter.
    relatedQuestionRefs:
      - QP007
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Current cash balance, monthly burn, runway, debt or equipment-finance obligations, and board-approved minimum-cash
      thresholds.
    whyItMatters: >-
      Without cash and burn disclosure, the chapter cannot determine whether the June 2026 raise meaningfully de-risks
      runway or only funds a capital-intensive scale-up for a limited period.
    diligencePath: >-
      Request monthly management accounts, cash bridge, debt schedule, and a 24-month operating model tied to
      manufacturing expansion and headcount plans.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Recognized revenue, bookings, backlog, realized ASP, discounting policy, software attach, and customer
      concentration by cohort.
    whyItMatters: >-
      List pricing and deployment claims do not show whether growth is repeatable, diversified, or earned at acceptable
      economics.
    diligencePath: >-
      Request audited financial statements, customer-level revenue cohorting, bookings/backlog reports, and revenue mix
      by hardware, services, and software.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: >-
      Sales cycle length, CAC, payback by channel, implementation success rate, and renewal or repeat-deployment
      behavior.
    whyItMatters: >-
      The core thesis depends on easier deployment translating into efficient customer acquisition and profitable
      expansion, but public evidence only shows company-authored payback proxies.
    diligencePath: >-
      Request funnel conversion data, channel split, payback cohorts, failed deployment rates, and net revenue retention
