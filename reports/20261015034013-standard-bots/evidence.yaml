    keyQuote: >-
      Standard Bots is a US-based company that designs, manufactures, and sells a robotic arm. Our co-founder previously
      built the biggest vertical farming operation in the world, now valued at over $2B. Our vision is to build the
      world's preeminent robotics platform, the Apple or Tesla of robotics. We believe robotics will be the next major
      platform, and our vertically integrated approach, designing our own software, firmware, electronics, vision
      system, and mechanical parts together, is the only way to provide the best user experience. Robotics historically
      have been hard to set up, involving high upfront costs and third party systems integration. Standard Bots'
      full-stack approach affords strong structural advantages that make it much easier and more affordable for
      customers to set up and use its robots - our goal is to democratize robotics in the same way that the Apple II did
      with the PC industry in the 1970s. Early customer feedback and demand has been very strong.
    canonical: SO005
