company:
  name: "Standard Bots"
chapter:
  number: 4
  title: "Financials"
  summary: "Public evidence supports a hybrid hardware-plus-services revenue model and confirms a well-funded June 2026 financing, but it does not disclose realized pricing, revenue, gross margin, burn, or cash runway. The underwriting question is therefore not whether Standard Bots can sell robots, but whether its direct-sales, integration, and support model can scale profitably enough to justify ongoing capital needs."
sections:
  - id: "revenue-model-and-pricing"
    title: "Revenue model and public pricing are visible, but realized economics are not"
    body: "The clearest public evidence is about what Standard Bots appears to sell, not what it earns. Official pages show a direct commercial motion around robot hardware and palletizing cells, with three deployment modes that range from a self-serve kit to guided deployment and full integration. The same official material markets a no-code operating model, bundled software, and fast field support, which implies that revenue likely comes from more than a one-time arm sale even when the public page only exposes list-style offers. Public pricing is still mostly list pricing and benchmark language: the company says RO1 costs $37,000, and its own guide frames installation, tooling, and training as material add-ons. That is enough to infer a hybrid hardware, integration, and support revenue stack, but not enough to infer realized ASPs, software attach, discounting, or contribution margins."
    claimRefs: ["CI003", "CI004", "CI005", "CI008", "CI013", "CI014"]
    tableRefs: ["TI001", "TI002"]
    figureRefs: ["FI001"]
  - id: "traction-cost-structure-and-capital"
    title: "Public traction and capital signals are positive, while cost structure remains partially opaque"
    body: "Independent coverage corroborates that Standard Bots raised a $200 million Series C at a $1 billion valuation in June 2026 and said the proceeds would expand manufacturing capacity, product development, and U.S. deployment. Official and third-party sources also show management emphasizing accessible deployment, hundreds of manufacturer users or automated sites, and a goal of reaching roughly 10% of new U.S. industrial robot deployments. Those are useful traction proxies, but they are still not revenue-quality disclosures. On the cost side, the company’s own materials point to a business that likely carries meaningful manufacturing, field-service, and integration obligations: Standard Bots says it builds robots end-to-end in the United States, often sells direct, offers on-site jump starts, and can run turnkey deployments. That mix can strengthen customer adoption and control, but it usually increases working-capital needs and service-delivery load relative to pure software models."
    claimRefs: ["CI001", "CI002", "CI006", "CI007", "CI009", "CI010", "CI012", "CI013", "CI014"]
    tableRefs: ["TI003"]
  - id: "underwriting-view-and-diligence-blockers"
    title: "Financial verdict: promising top-of-funnel signals, insufficient underwriting-grade disclosure"
    body: "The financial case is directionally credible but still incomplete. The optimistic case is easy to state: public pricing is approachable for SMB manufacturers, the deployment narrative is simpler than legacy robotics integration, and new capital can fund capacity expansion and GTM. The hard part is that the core underwriting metrics remain undisclosed. There is no public cash balance, burn cadence, backlog, realized gross margin, customer concentration, software mix, or cohort payback data. Even the one revenue anchor surfaced by an adverse commentary is explicitly treated as a weak and inconsistent third-party estimate rather than a verified operating fact. That leaves the chapter with a clear verdict: Standard Bots may be building a scalable automation platform, but public evidence today only supports a well-funded growth thesis, not a clean read on revenue quality, margin path, or runway sufficiency."
    claimRefs: ["CI001", "CI004", "CI010", "CI011", "CI012"]
callouts:
  - calloutType: "insight"
    title: "Hybrid revenue model, not a pure robot-arm SKU"
    body: "The public commercial surface shows hardware, deployment services, bundled software, and post-sale support, so the business should be underwritten as a hybrid product-and-services model until management proves a recurring software layer."
    claimRefs: ["CI003", "CI004", "CI008", "CI014"]
  - calloutType: "risk"
    title: "Capital adequacy remains the main diligence blocker"
    body: "The June 2026 raise removes immediate funding doubt, but public evidence still does not disclose cash on hand, monthly burn, debt obligations, or margin structure, so runway and next-round dependency cannot be verified from public materials."
    claimRefs: ["CI001", "CI002", "CI010"]
