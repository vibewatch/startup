      - ["Cash / burn / runway disclosure", null, "Low", "Capital adequacy cannot be underwritten without cash and burn visibility", "Provide current cash, monthly burn, runway, debt covenants, and minimum-cash operating thresholds"]
      - ["Directional third-party revenue anchor", "One adverse commentary cites an unverified ~$36.4M revenue/ARR estimate and warns it is inconsistent", "Low", "Useful only as a weak directional reference; not fit for underwriting", "Confirm or reject the estimate with audited statements, bookings, and backlog data"]
    notes: "Null entries are intentional and reflect missing public disclosure; company-authored payback and deployment claims are separated from independently corroborated funding facts."
    claimRefs: ["CI001", "CI002", "CI004", "CI006", "CI009", "CI010", "CI011"]
