company:
  name: Standard Bots
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Standard Bots has a specific and publicly legible product story: three AI-native cobot form factors, turnkey palletizing cells,
    and a full-stack control narrative built around vision, motion, and agent-like task authoring. Independent trade coverage supports
    the lower-cost, faster-deployment positioning and domestic-manufacturing ambition, but the assigned public evidence still does not
    verify certification posture, uptime metrics, or a broad external developer ecosystem.
sections:
  - id: product-scope
    title: What the company actually ships
    body: >-
      The assigned source set supports a more concrete product map than a generic “AI robotics” pitch. Standard Bots’ current public
      lineup spans Spark, Core, and Thor, covering light benchtop work through heavier industrial payloads, while the palletizing page
      bundles Thor into a full cell with controls, sensors, gripper, and software instead of selling only an arm. Across official pages,
      trade coverage, and directories, the use-case map is consistent: machine tending, palletizing, welding, pick-and-place, surface
      finishing, assembly, and inspection. That matters because it frames Standard Bots less as a research platform and more as a
      broadening cobot vendor trying to reduce application-specific integration friction for general manufacturers. The strongest product
      proof remains company-authored, but the external descriptions are specific enough to validate the workflow categories and the
      company’s focus on non-specialist deployment rather than only on bespoke engineering projects.
    claimRefs: [CE001, CE002, CE003, CE005, CE006]
    tableRefs: [TE001, TE002]
  - id: architecture-operating-model
    title: Architecture and operating model
    body: >-
      The architectural narrative is a layered stack rather than a single hardware SKU. The AI page presents vision, motion, and agent
      capabilities as operator-facing skills; Machine Design’s Automate 2026 coverage adds concrete feature names such as Quick Find,
      Text Find, a Roboflow integration, conversational routine generation, and Show Path; Unite.ai names internal stack components
      including AmpereDrive and ArcOS; and the A3 member profile reiterates a vertically integrated design across software, firmware,
      electronics, vision, and mechanical parts. Taken together, the public evidence suggests Standard Bots is trying to own the user
      workflow, robot control layer, and increasing portions of electromechanical design, not just assemble commodity arms. What is
      still missing is a source set that independently benchmarks latency, accuracy, uptime, or failure-handling quality for those
      layers in production conditions.
    claimRefs: [CE001, CE004, CE007, CE008, CE012]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: deployment-support
    title: Deployment, support, and buyer fit
    body: >-
      Standard Bots’ go-to-market message is as much about delivery model as about robot hardware. The palletizing offer is packaged in
      self-serve, guided, and turnkey formats, and the company explicitly says operators can program cells from an iPad without
      robotics experience. Independent commentary from ARC and Machine Design reinforces the same thesis: the buyer is a manufacturer
      that wants automation without hiring a full controls or robotics team. Support promises are also prominent. Machine Design
      reported a three-year warranty plus 24/7 support with a 30-minute response target, while the official palletizing page promises
      sub-30-minute call response and sub-24-hour field support if needed. Those promises strengthen the usability story, but they are
      still promises; the assigned pool does not independently quantify installed-base uptime, failure rates, or repeat deployment speed
      across customers.
    claimRefs: [CE005, CE006, CE009, CE010, CE011]
  - id: differentiation-and-risks
    title: Differentiation and unresolved technical risks
    body: >-
      The differentiation case is credible but not fully proven. Standard Bots appears to have a real pricing and usability wedge: the
      official blog anchors a roughly $37K mid-range robot, the AI page and trade coverage emphasize teaching by demonstration instead
      of specialist programming, and multiple sources repeat the U.S.-manufacturing and vertical-integration story. The adverse case is
      equally clear. NewMarketPitch argues that cheaper hardware alone does not justify the company’s positioning unless the arm becomes
      the entry point into recurring software, support, fleet-management, templates, and workflow data. That critique is important for
      technical diligence because the public package still lacks independent certification identifiers, incident history, published
      reliability statistics, or a strong public practitioner/developer surface. The result is a product story with strong narrative
      coherence but incomplete third-party proof on safety, repeatability at scale, and ecosystem depth.
    claimRefs: [CE004, CE009, CE011, CE013, CE014]
callouts:
  - calloutType: insight
    title: The stack thesis is workflow ownership, not just low-cost hardware
    body: >-
      The best-supported technical upside is that Standard Bots is trying to bundle user workflow, AI-assisted task authoring, robot
      control, and field support into one experience. If that layer really compounds with templates and repeat deployments, the moat is
      stronger than the arm bill of materials alone.
    claimRefs: [CE005, CE007, CE008, CE013]
  - calloutType: risk
    title: Safety and reliability proof still trails the marketing specificity
    body: >-
      The assigned evidence set documents warranty and support promises, but it does not independently verify certification status,
      incident rates, or production uptime. That keeps trust, safety, and quality controls in “diligence required” territory rather
      than turning them into underwritten strengths.
    claimRefs: [CE010, CE014]
