      - ["Control stack", "ArcOS plus internally controlled drives, actuators, and motion logic", "Vertical integration in electromechanics and control software", "No public architecture or API docs for external validation"]
      - ["Cell integration", "DIY, guided, and turnkey deployment paths", "Accessories, sensors, grippers, and customer environment fit", "Deployment speed varies by task and layout complexity"]
      - ["Support / field service", "24/7 support, 30-minute target response, on-site help", "Service organization capacity and geographic coverage", "Support promise is clearer than field performance evidence"]
    notes: >-
      Summarizes the architecture the company and trade coverage describe; unresolved risks are kept explicit where the assigned pool lacks third-party technical proof.
    claimRefs: [CE005, CE007, CE008, CE010, CE012, CE014]
