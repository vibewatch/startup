company:
  name: Standard Bots
chapter:
  number: 8
  title: Valuation
  summary: >
    Standard Bots' $200 million Series C at a $1 billion valuation is well corroborated by
    retained third-party coverage and market trackers, and the company is pairing that round
    with a larger New York manufacturing footprint and a clear low-friction deployment story.
    But the public record still does not disclose audited revenue, gross margin, shipment
    velocity, backlog, retention, or cap-table terms, so the evidence supports a real private
    market price mark rather than a buy-underwrite at that same price.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation stays research-more at the current mark
    body: |
      The strongest valuation fact in the retained pool is that Standard Bots did clear a real
      unicorn-priced financing round in June 2026: multiple third-party sources and Tracxn align
      on a $200 million Series C at a $1 billion valuation, while Tracxn also points to $263
      million of cumulative disclosed funding across the 2024 Series B and 2026 Series C. That is
      enough to treat the current mark as a real private-market signal rather than rumor.

      It is not enough to underwrite a buy at that same price from public evidence alone. The
      adverse valuation review in the assigned pool explicitly says the public record still lacks
      audited revenue, shipment volume, gross margin, backlog, retention, and software attach
      rate, and it argues that even a directional revenue anchor would imply a premium multiple
      for a hardware-heavy robotics business. With financing signal ahead of disclosed operating
      proof, the price-sensitive call remains research-more, with high risk and a stretched
      valuation stance until private diligence closes the KPI and terms gap.
    claimRefs: [CV001, CV002, CV008, CV009, CV010, CV013]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-scenario-framing
    title: The bull case exists, but the anti-thesis still dominates underwriting
    body: |
      The bull case is understandable. Official Standard Bots pages describe direct, self-serve,
      guided, and turnkey deployment paths, emphasize no-code usability, and position the product
      line as affordable automation for smaller manufacturers rather than only enterprise
      integrator-heavy projects. The retained company-issued and independent coverage also points
      to a larger Glen Cove facility, claims of deployments to hundreds of companies, and a stated
      goal of reaching roughly 10% of new U.S. industrial robot deployments by next year. If that
      operating narrative translates into repeat cells, software or service attach, and faster
      deployment cycles, the round can look like an early platform bet instead of an overreach.

      The anti-thesis is that public disclosure still trails the valuation. The same evidence pack
      that validates the round does not validate revenue quality, margins, customer concentration,
      backlog durability, or the extent to which Standard Bots is becoming a software-enabled
      automation platform rather than a lower-cost robot-arm vendor. That makes the scenario set
      asymmetric: upside is credible, but only if private KPI evidence is materially better than
      what the public record currently shows.
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV010, CV011, CV012, CV013]
    tableRefs: [TV002, TV003]
  - id: final-diligence-asks-and-thesis-breaks
    title: Final diligence asks before any investable entry
    body: |
      A serious investment decision now needs private proof, not another narrative round-up.
      Priority asks are a management-reconciled KPI package covering revenue, gross margin,
      shipment volume, backlog, deployment cohorts, repeat orders, and any software or service
      attach that could justify software-like valuation logic. The financing package also matters:
      without the full cap table, liquidation preferences, anti-dilution terms, board rights, and
      any secondary or structured components of the Series C, entry discipline cannot be fully
      underwritten from public evidence.

      The thesis breaks if diligence shows hardware-like margins without meaningful recurring
      revenue, if deployment claims do not translate into repeatable shipment velocity, or if the
      preference stack meaningfully weakens common-equivalent downside. The thesis improves only if
      private materials show that Standard Bots is converting a real pricing-and-usability wedge
      into durable commercial scale with economics strong enough to support or outgrow the current
      unicorn mark.
    claimRefs: [CV004, CV007, CV008, CV009, CV010, CV011, CV013]
