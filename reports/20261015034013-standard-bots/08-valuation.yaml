      - ["Anti-thesis", "Public evidence still lacks audited revenue, shipment volume, backlog, retention, and cap-table detail, so valuation can outrun disclosed fundamentals.", "Downgrade further if diligence shows hardware-like economics, concentrated customers, or weak repeat demand."]
      - ["Investment pivot", "The round is credible as a private-market signal, but buy-level conviction needs proof that Standard Bots is becoming a platform rather than only a low-cost arm vendor.", "Move toward investable only with private KPI diligence and entry terms that are below, or clearly justified at, the current mark."]
    notes: "Arguments translate retained evidence only; missing financial and financing detail is treated as an open diligence item rather than assumed away."
    claimRefs: [CV001, CV004, CV005, CV006, CV008, CV010, CV011, CV012, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation/return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Deployment claims convert into repeat cells, software or service attach, and several thousand annual shipments.", "At or above the current $1 billion mark can work only if forward revenue reaches roughly $75 million to $100 million with software-like economics.", "Execution, channel, and margin proof still have to show up.", "Requires private KPI pack confirming shipment velocity and attach."]
      - [Base, "Funding accelerates manufacturing and deployment, but economics look mixed and proof arrives slower than valuation.", "The current mark is understandable as venture option value, but return underwriting is weak without better entry or stronger proof.", "Multiple compression and slower commercialization.", "Best match to current public evidence."]
      - [Bear, "Revenue, backlog, retention, or financing terms trail the unicorn narrative.", "A flat or down-round outcome becomes plausible because the public record does not support current-price conviction.", "Hardware gross-margin pressure, long deployments, or preference-stack drag.", "Triggered if private diligence does not close today's gaps."]
    notes: "Scenario rows are qualitative underwriting lenses anchored to the disclosed $1 billion Series C mark because public evidence does not support a fully modeled DCF or direct comp set."
    claimRefs: [CV001, CV007, CV008, CV009, CV010, CV013]
