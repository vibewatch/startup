tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current public status
  - Revenue-quality view
  - Diligence ask
  rows:
  - - Brokerage trading infrastructure
    - Embedded execution, liquidity, custody, settlement, and compliance stack for brokers
    - Spread, transaction, or platform contract
    - Clearly live via Interactive Brokers and Public evidence
    - Likely recurring and activity-linked, but realized pricing is opaque
    - Request by-product revenue mix, minimums, and spread realization by asset class
  - - Stablecoin payroll and payouts
    - Cross-border contractor or payroll disbursements through regulated stablecoin rails
    - Transaction volume and payout-service economics
    - Clearly live via Gusto and Remote evidence
    - Potentially high-frequency workflow, but take rates and pass-through costs are unknown
    - Request take rate, payout COGS, and margin by corridor
  - - 24/7 funding and investment settlement
    - Real-time account funding and stablecoin settlement for brokerages or investment platforms
    - Funding volume and contract economics
    - Clearly live via Interactive Brokers and Republic evidence
    - Looks sticky if embedded in core account-funding flow
    - Request attach rate, active customers, and funding-margin economics
  - - Remittance and payment acceptance
    - Cross-border remittance or acceptance flows using stablecoins and fiat conversion
    - Per-transaction fee or spread
    - Visible via Félix Pago and transact references
    - Can be large-volume, but corridor economics and FX pass-through are undisclosed
    - Request corridor profitability and partner concentration
  - - Qualified custody and trust services
    - Custody, control, and safekeeping inside regulated trust framework
    - Service fee, AUC-based, or contract model
    - Strengthened by trust-company launch; pricing undisclosed
    - Trust framing may increase stickiness, but fee model is not public
    - Request custody AUC, fee bands, and compliance cost per client
  - - Tokenization and issuer support
    - Compliant issuance, lifecycle management, and integrated custody/settlement
    - Implementation plus ongoing service economics
    - Product surface is visible, but live revenue contribution is undisclosed
    - Potentially strategic, but current monetization contribution is unknown
    - Request pipeline, live assets, and tokenization revenue contribution
  notes: The public record makes the monetization lanes visible, but not the revenue share, take rates, or accounting treatment within each lane.
