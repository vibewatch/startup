- id: TI002
  title: Pricing / monetization table
  columns:
  - Offer lane
  - Public price or monetization signal
  - List vs. realized pricing
  - Unknowns
  - Evidence
  rows:
  - - Brokerage trading stack
    - Configurable spreads by asset
    - Only monetization logic is public; no fee card
    - Spread levels, volume tiers, minimum commitments, and revenue share
    - Interactive Brokers trading case study
  - - Stablecoin settlement and payouts
    - Usage/transaction economics implied by payout workflows
    - No public rate card
    - Per-corridor take rates, compliance pass-through, and prefunding economics
    - Transact solution; Gusto, Remote, Stripe, Republic case studies
  - - Remittance flows
    - Transaction-fee logic implied; Félix quotes end-user fee reduction
    - End-user fee benefit is public, supplier monetization is not
    - Net take rate after FX and partner costs
    - Félix Pago case study
  - - Qualified custody
    - Fee model undisclosed
    - No public list pricing
    - AUC-based pricing, minimums, and compliance support fees
    - Trust-company launch; custody official pages
  - - Tokenization / issuer support
    - Enterprise-contract logic implied
    - No public list pricing
    - Setup fees, lifecycle fees, and custody attach economics
    - Tokenization and trust-company disclosures
  - - Substitute price anchor
    - $1.80 total cost for a $1,000 crypto trade at IBKR
    - Customer-facing substitute price, not Zero Hash enterprise price
    - How much of customer price flows to Zero Hash versus the distributor
    - Interactive Brokers crypto page
  notes: Public monetization signals are real but sparse; they explain how Zero Hash can make money without revealing what it actually earns per workflow.
