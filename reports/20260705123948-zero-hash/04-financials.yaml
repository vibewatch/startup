- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Public best available proxy
  - Why it matters
  - Exact diligence path
  rows:
  - - Revenue and ARR by product
    - Volume and deployment metrics only
    - Without revenue by lane, it is impossible to test quality, concentration, and seasonality
    - Request audited revenue bridge by product, customer segment, and geography
  - - Gross margin and COGS split
    - No direct disclosure; only operational hints from case studies and product pages
    - Margin path is central to underwriting infrastructure businesses
    - Request gross-margin bridge split across compliance, custody, cloud, liquidity, and partner costs
  - - Cash, burn, and runway
    - 2025 raise plus 2026 funding-talk story
    - Needed to judge financing dependency and dilution risk
    - Request current cash balance, monthly burn, and runway under base and downside cases
  - - Realized pricing and discounting
    - Configurable spreads and usage logic only
    - List logic is not enough to underwrite take-rate durability
    - Request sample contracts, discount schedules, and gross-to-net realization by workflow
  - - Customer concentration
    - Named logos and customer metrics only
    - A handful of large platforms could dominate revenue even if case studies look diversified
    - Request top-20 customer revenue and gross-margin concentration
  - - Debt, covenants, or hidden obligations
    - No retained public disclosure
    - Off-balance-sheet or debt obligations can change valuation materially
    - Request debt agreements, guarantees, and any covenant package
  - - Independent validation of case-study metrics
    - Most growth numbers are company-supplied
    - The growth narrative is attractive but still needs third-party or data-room support
    - Request customer attestations, cohort exports, and auditor-reviewed operating metrics
  notes: These are the highest-value gaps that prevent the current chapter from moving from promising public proxy set to fully underwritten financial view.
  enumerationScope:
    coverage: partial
    basis: Covers the seven most material diligence blockers surfaced by the retained public record rather than every possible data-room request.
