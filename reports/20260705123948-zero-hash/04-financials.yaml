- id: traction-and-unit-economics-proxies
  title: Traction and unit-economics proxies
  body: |-
    Revenue is undisclosed, so the right public traction lens is usage rather than GAAP output. Zero Hash says it has settled more than $65B and serves more than 7M end customers. The 2026 stablecoin momentum report adds a dense set of company-reported growth proxies: active stablecoin customers up 146% year over year, transaction count up 208%, dollar volume up 690%, average transaction size up 157%, active users across 106 countries, and inbound RFIs up 5x from 2024 to 2025. Those are not audited financials, but they are strong indicators that the company is seeing more frequent, larger, and more geographically distributed stablecoin activity.

    The customer case studies deepen that picture. Interactive Brokers launched in 12 weeks and then reported 2,010% transaction growth, $216M of Q3 2025 volume, 30% more assets traded per customer, and time-to-first-trade falling from 59 to 15 days. MoneyLion, Republic, Remote, Gusto, Public, Stripe, and Félix Pago extend the evidence across consumer trading, payroll, funding, payouts, and remittance. The caution is that nearly all of these data points are company-supplied. They are valuable underwriting proxies, but they should not be mistaken for audited unit economics or clean evidence of margin quality.
