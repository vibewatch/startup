  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Audited revenue, revenue mix, and revenue-recognition detail by product and customer segment.
    whyItMatters: Without revenue disclosure, the chapter can judge demand proxies but not true revenue quality.
    diligencePath: Request audited monthly revenue bridge by product, segment, geography, and customer cohort.
    relatedQuestionRefs:
    - QI001
    - QI003
    - QI004
    - QI022
    relatedTableRefs:
    - TI001
    - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, CAC, payback, implementation cost, and net revenue retention by segment.
    whyItMatters: This is the missing layer between visible throughput and underwritten profitability.
    diligencePath: Request GAAP and non-GAAP gross margin, CAC/payback, and contribution-margin analysis for each major workflow.
    relatedQuestionRefs:
    - QI010
    - QI011
    - QI021
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, runway, and any debt or covenant package.
    whyItMatters: A 2025 raise does not answer whether the company is self-funded today or preparing for another capital need.
    diligencePath: Request latest balance sheet, cash-flow statement, runway model, and debt schedule.
    relatedQuestionRefs:
    - QI015
    - QI016
    - QI017
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue concentration, churn, and realized pricing dispersion.
    whyItMatters: The logo set looks diversified, but public logos do not prove diversified revenue quality.
    diligencePath: Request top-20 customer exposure and concentration-adjusted margin analysis.
    relatedQuestionRefs:
    - QI021
    - QI024
    relatedTableRefs:
    - TI005
  - type: conflicting-data
    severity: minor
    topic: funding-optionality
    missingEvidence: Board-level explanation of whether the 2026 fundraising discussion was opportunistic, strategic, or balance-sheet driven.
    whyItMatters: The adverse 2026 article is important context but cannot be treated as confirmed new capital.
    diligencePath: Request management commentary, term-sheet status, and intended use of any prospective financing.
    relatedQuestionRefs:
    - QI018
    - QI025
    relatedTableRefs:
    - TI004
