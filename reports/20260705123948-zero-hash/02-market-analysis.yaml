- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Regulatory clarity (GENIUS / MiCAR era)
    - Driver
    - Now
    - Makes institutional stablecoin programs easier to green-light
    - Track which jurisdictions still block launch
  - - 24/7 settlement and reduced prefunding
    - Driver
    - Now
    - Direct ROI for broker funding, payroll, remittances, and treasury
    - Quantify float and working-capital savings by use case
  - - Chain abstraction + embedded compliance
    - Driver
    - Now
    - Turns blockchain complexity into a vendor feature rather than client burden
    - Test whether compliance stack shortens implementation time
  - - Institutional RWA and tokenization interest
    - Driver
    - 1-3 years
    - Opens new issuer and asset-manager budgets
    - Measure how many pilots become production mandates
  - - Incumbent card and bank rails
    - Constraint
    - Now
    - Entrenched substitutes can cap take-rate capture
    - Map when stablecoins complement rather than replace incumbents
  - - Consumer payment skepticism
    - Constraint
    - Now
    - Retail everyday-payments TAM may be overstated
    - Separate institutional from consumer demand in forecasts
  - - Bank exposure and AML obligations
    - Constraint
    - Now
    - Institutions need more controls even without direct custody
    - Review onboarding, screening, and monitoring burden
  - - Counterparty and custodian continuity risk
    - Constraint
    - Ongoing
    - Can slow adoption or force multi-vendor architectures
    - Evaluate venue concentration, sweeping policies, and backup custody
  notes: Drivers expand demand or shorten procurement cycles; constraints limit practical adoption, pricing power, or how much of the workflow stablecoins can displace.
