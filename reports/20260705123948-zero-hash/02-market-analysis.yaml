chapter:
  number: 2
  title: Market Analysis
  summary: Zero Hash’s relevant market is regulated crypto, stablecoin, and tokenization infrastructure sold into institutional workflows—not the full crypto market cap. Public evidence supports a fast-growing stablecoin base layer and real institutional demand across broker funding, payouts, payins, and tokenization, but exact SAM, share, pricing, and module economics remain private.
sections:
- id: market-boundary
  title: Market boundary and what this chapter is actually sizing
  body: 'The cleanest way to size Zero Hash’s market is to ignore the temptation to use total crypto market capitalization as a proxy. Zero Hash is not selling exposure to bitcoin prices; it is selling regulated infrastructure that lets banks, brokerages, fintechs, merchants, and asset managers launch specific products without building custody, liquidity, compliance, or chain orchestration internally. That means the relevant market is regulated crypto, stablecoin, and tokenization infrastructure spend. Included inside that boundary are trading enablement for brokerages and banks, stablecoin money movement for payouts, payins, treasury, and funding, tokenization issuance and lifecycle tooling, and on-ramp conversion products that make those rails usable. Excluded from the boundary are speculative token market cap, consumer exchange revenue that does not depend on infrastructure outsourcing, and generic blockchain software spend with no regulated financial workflow attached. This narrower
    boundary is what keeps the chapter analytically honest: it frames Zero Hash as a picks-and-shovels vendor inside a regulated financial-infrastructure category rather than as a claim on all crypto activity.'
  claimRefs:
  - CM001
  - CM002
  - CM033
  - CM036
  - CM037
  tableRefs:
  - TM001
  figureRefs:
  - FM003
- id: sizing-lenses
  title: 'Sizing lenses: stablecoin base layer, adoption proxies, and the limits of public TAM'
  body: 'Even after the boundary is narrowed, public sizing remains more constrained than typical SaaS TAM work. J.P. Morgan gives the clearest external base layer by estimating the fiat-backed dollar stablecoin market at roughly $300 billion today, with a plausible path to $500 billion to $750 billion over the next few years and a $1 trillion upside case if adoption and regulation line up. Circle’s USDC economy report adds transaction-scale proof: more than 78% year-over-year circulation growth and more than $18 trillion of all-time USDC volume, including $1 trillion in a single month in late 2024. Zero Hash’s own report then adds platform-specific adoption signals—1.4 billion stablecoin-ready accounts, 146% customer growth, 208% transaction-count growth, 690% dollar-volume growth, and 106-country usage in 2025. Those data points do not yield an exact Zero Hash TAM, SAM, or SOM, but they do show that the relevant market is a growing, regulated money-movement and asset-issuance layer rather
    than a purely narrative opportunity. The missing piece is product-line revenue, pricing, and share data that would translate these adoption proxies into a tighter serviceable-market estimate.'
