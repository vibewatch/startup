  topStrengths:
    - Regulatory moat across U.S. jurisdictions plus trust-company, MiCAR, and EMI credentials raises the bar for direct rivals.
    - Marquee institutional customers and investors such as Interactive Brokers, Morgan Stanley-linked E*TRADE, Public, Gusto, Stripe, and Franklin Templeton validate enterprise relevance.
    - The product spans trade, transact, tokenize, custody, and compliance, allowing Zero Hash to sell a bundled infrastructure layer instead of a single point product.
    - Current homepage metrics show meaningful scale already visible in settled volume, end-customer reach, and uptime.
    - Stablecoin adoption tailwinds described by Zero Hash, Circle, Visa, and J.P. Morgan support long-duration demand for regulated infrastructure.
  topRisks:
    - Revenue, gross margin, and customer concentration are undisclosed, making valuation precision materially weaker than company-quality assessment.
    - Licensing breadth is a moat, but it also creates fixed compliance overhead and execution risk if charter or Europe milestones slip.
    - Competition remains intense across Fireblocks, Anchorage Digital, BitGo, Coinbase, Circle, and internal builds by sophisticated financial institutions.
    - Strategic-interest headlines such as Mastercard-related talks validate relevance but do not guarantee monetizable or closed-price outcomes.
    - White-label enterprise infrastructure can be sticky, but a few very large partners may accumulate bargaining power over time.
  unresolvedGaps:
    - Product-level revenue, net take rate, gross margin, and profitability remain undisclosed.
    - Top-customer concentration, renewal history, and cohort retention are not visible in the public file.
    - Any 2026 financing terms, preferences, or secondary structure above the 2025 unicorn mark remain unconfirmed.
