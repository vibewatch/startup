companyProfile:
  summary: Zero Hash is a Chicago-based B2B crypto, stablecoin, and tokenization infrastructure platform that lets fintechs, brokerages, banks, and asset managers launch digital-asset products through APIs rather than building custody, liquidity, settlement, and compliance stacks in-house. Public materials show the company serving marquee partners including Interactive Brokers, Public, Gusto, Stripe, and Franklin Templeton, while the current homepage claims $65B+ settled volume, 7M+ end customers, and coverage across 200 jurisdictions. The public record is strongest on regulatory posture and customer proof, and weakest on economics.
  foundedDate: '2018-01-01'
  founders:
    - name: Edward Woodford
      role: Founder and CEO
      background: Former founder of a CFTC-registered derivatives exchange; newsroom materials say he has led zerohash since its 2017 inception.
      claimRefs: [CO007]
  foundingLocation: Chicago, Illinois
  headquarters: Chicago, Illinois
  productSummary: API-based infrastructure for crypto trading, stablecoin payments and remittances, custody, settlement, tokenization, and on/off-ramp workflows, with regulatory and compliance tooling embedded in the stack.
  customerFocus: Fintech platforms, brokerages, banks, asset managers, payment companies, and enterprises embedding digital-asset or stablecoin capabilities.
  businessModel: Enterprise infrastructure monetized through transaction and spread economics, custody or platform services, and regulated stablecoin or tokenization workflows; exact pricing and take rates are not publicly disclosed.
  stage: Series D
  fundingStatus: $104M Series D-2 at $1B valuation in September 2025; 2026 reporting also described fundraising talks above $1.5B but no closed follow-on round.
