  topStrengths:
    - 覆盖美国各辖区的监管护城河，加上信托公司、MiCAR 和 EMI 资质，抬高了直接竞争门槛。
    - Interactive Brokers、Morgan Stanley 关联的 E*TRADE、Public、Gusto、Stripe 和 Franklin Templeton 等头部机构客户与投资者，验证了企业相关性。
    - 产品覆盖交易、转账、代币化、托管和合规，让 Zero Hash 可以卖一层打包的基础设施，而不是单点产品。
    - 当前官网指标显示，结算量、终端客户覆盖和 uptime 已有可见规模。
    - Zero Hash、Circle、Visa 和 J.P. Morgan 描述的 stablecoin 采用顺风，支撑受监管基础设施的长期需求。
  topRisks:
    - 收入、毛利率和客户集中度未披露，估值精度比公司质量判断弱得多。
    - 牌照广度是护城河，但也带来固定合规开销；如果牌照或欧洲里程碑延迟，执行风险会上升。
    - Fireblocks、Anchorage Digital、BitGo、Coinbase、Circle，以及成熟金融机构自建系统，竞争仍很激烈。
    - 与 Mastercard 相关谈判等战略兴趣头条验证了相关性，但不保证可变现或已经锁定价格的结果。
    - 白标企业基础设施可能有粘性，但少数超大合作伙伴可能随时间积累议价能力。
  unresolvedGaps:
    - 产品级收入、净抽成率、毛利率和盈利能力仍未披露。
    - 最大客户集中度、续约历史和队列留存，在公开材料中不可见。
    - 2026 年任何高于 2025 年独角兽标记的融资条款、优先权或老股结构仍未确认。
