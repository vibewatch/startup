chapter:
  number: 7
  title: Risks
  summary: The highest-severity risks are federal-charter execution, multi-jurisdiction compliance burden, invisible operational
    reliability, partner concentration, and opaque unit economics. Zero Hash has a genuine regulatory moat, but that moat
    can fail quickly if exams, incident discipline, or flagship partner launches slip.
sections:
- id: regulatory-and-legal-stack
  title: Regulatory and legal stack
  body: 'Zero Hash’s biggest strength and biggest risk are the same thing: it has assembled a broad licensing stack across
    U.S. money transmission, New York virtual-currency oversight, a North Carolina trust company, European MiCAR authorization,
    and a Dutch EMI license. That stack creates real distribution and credibility advantages for banks, brokerages, and payments
    firms that want an outsourced digital-asset rail, but it also creates a permanently high fixed burden of exams, policy
    maintenance, and jurisdiction-by-jurisdiction remediation risk. The highest-severity regulatory item is the still-pending
    OCC national trust bank charter. If approved, it would simplify the U.S. framework and raise custody credentials. If delayed,
    denied, or legally challenged, the company keeps operating, but it loses a key piece of the premium narrative around federal-grade
    infrastructure. The public file also shows conduct controls and disclosures, yet it does not disclose exam history, complaint
    volumes, or remediation statistics, which means investors can see the scaffolding but not the defect rate.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
