- id: operational-and-security-load
  title: Operational and security load
  body: 'Operational risk is not abstract for Zero Hash because the product promise is that crypto, stablecoin, custody, and
    tokenized-asset complexity disappears inside partner experiences. The company advertises 99.99% uptime, broad asset support,
    and a global footprint, while the 2026 stablecoin report describes sharply higher volume, transaction counts, and cross-border
    reach. Those are encouraging scale markers, but they also mean sanctions screening, transaction monitoring, address controls,
    asset-policy maintenance, and incident response all become more demanding as adoption rises. The public security posture
    is respectable: ISO 27001, GDPR alignment, SOC 2, and a bug-bounty program all help. What the public file still lacks
    is independent uptime or incident data and any quantified fraud or loss history. External risk notes from J.P. Morgan,
    Chainalysis, and Fireblocks matter because they describe the exact failure modes that can damage an infrastructure intermediary:
    opaque counterparties, weak market integrity, settlement breaks, venue misuse of funds, and banks being blamed for customer
    crypto activity they only indirectly touch.'
  claimRefs:
  - CR013
  - CR014
  - CR015
  - CR016
