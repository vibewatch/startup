- id: underwriting-implications
  title: Underwriting implications
  body: 'From an investment perspective, the severity ranking is straightforward. First is regulatory execution risk around
    the OCC process and the burden of maintaining a sprawling multi-jurisdiction licensing base. Second is operational and
    counterparty risk because the system only works if payments, custody, and execution remain invisible and reliable through
    volatile markets. Third is partner concentration and bargaining risk because the company’s best proof points are also
    its largest dependencies. Fourth is financial-model opacity: public sources still do not reveal revenue durability, margin
    structure, chargebacks, fraud losses, or customer concentration. Governance upgrades and the disclosed executive bench
    are constructive, but they do not close those core evidence gaps. That leaves a disciplined monitoring posture rather
    than a fear-based one. The right kill criteria are observable: stalled charter progress, material compliance findings,
    security or settlement failures at flagship partners, or evidence that demand indicators like RFIs and volume are failing
    to convert into durable enterprise economics.'
