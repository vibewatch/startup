- id: partner-dependence-and-execution
  title: Partner dependence and execution
  body: Zero Hash is a classic white-label infrastructure vendor, which means the platform wins only when partners launch,
    expand, and stick. That model is attractive because it allows the company to sit behind high-quality institutional brands
    such as Interactive Brokers, Public, Stripe, and other named accounts without having to acquire retail users directly.
    It is also risky because revenue concentration, switching behavior, and satisfaction signals remain mostly private. The
    partner profile cuts both ways. Strong institutions validate the stack, but they also have negotiating leverage and, over
    time, may choose to internalize more of the workflow. Strategic signals are similarly mixed. Virtu’s addition to the liquidity
    ecosystem and the list of marquee clients are positives for execution quality, yet CoinDesk’s report that Mastercard walked
    away from investment plans is a reminder that strategic intent can change quickly. The most important underwriting question
    is therefore not whether Zero Hash has good logos, but whether those logos deepen their dependence on the platform fast
    enough to offset bargaining power and replacement risk.
  claimRefs:
  - CR025
  - CR026
  - CR027
  - CR028
  - CR029
  - CR030
  - CR031
  - CR032
