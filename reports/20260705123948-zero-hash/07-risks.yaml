- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Federal-charter risk
    - OCC progress stalls or legal challenge escalates
    - No clear positive milestone for multiple quarters or formal injunction/denial
    - Treat as thesis-break for federal-custody upside; reset valuation expectations lower.
  - - Compliance burden risk
    - Material exam findings or remediation backlog
    - Repeated or severe unresolved regulator findings
    - Pause conviction until evidence shows findings are contained and fixable.
  - - Invisible-reliability risk
    - Security incident, outage, or settlement break at flagship partner
    - Any event that harms partner end users or freezes flows
    - Move from track to avoid unless root cause and controls are fully disclosed.
  - - Partner concentration risk
    - Flagship launch delays, churn, or weaker partner activity
    - Missed rollout windows or meaningful partner downgrades
    - Assume slower monetization and lower multiple support.
  - - Economic-opacity risk
    - Management still withholds unit economics after next financing step
    - No disclosure on revenue quality, margins, or concentration
    - Do not pay above the last closed valuation absent new evidence.
  notes: Kill criteria are intentionally observable so the investment team can monitor them between formal refreshes.
