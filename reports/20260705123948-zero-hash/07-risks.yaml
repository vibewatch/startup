  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory risk register completeness
    missingEvidence: A full internal register of exam findings, open remediation items, and every jurisdiction-specific restriction.
    whyItMatters: The public record proves breadth of licensing but not whether the footprint is clean, strained, or already
      under remediation.
    diligencePath: Request the latest compliance dashboard, exam calendar, and any regulator correspondence summarized by
      entity.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: independent uptime and incident evidence
    missingEvidence: Independent incident history, uptime logs, partner exception rates, and third-party penetration or red-team
      summaries.
    whyItMatters: A white-label infrastructure business can lose trust quickly if reliability claims are not independently
      verifiable.
    diligencePath: Ask for the last 24 months of incident reports, severity classification, and partner-visible service metrics.
    relatedQuestionRefs:
    - QR028
  - type: private-evidence-only
    severity: material
    topic: partner concentration
    missingEvidence: Revenue concentration by top partner, launch funnel by major account, and churn or renewal history.
    whyItMatters: The partner roster is the strongest upside proof and also the main hidden downside if a few accounts dominate
      revenue.
    diligencePath: Request top-10 customer concentration, net revenue retention by product, and launch-to-go-live conversion
      data.
    relatedQuestionRefs:
    - QR029
  - type: private-evidence-only
    severity: material
    topic: fraud loss and working-capital exposure
    missingEvidence: Chargebacks, fraud losses, prefunding needs, reserve requirements, and any balance-sheet exposure linked
      to payments or stablecoin flows.
    whyItMatters: Without loss and working-capital data, investors cannot distinguish a capital-light software moat from a
      capital-hungry regulated-ops business.
    diligencePath: Obtain product-level loss metrics, prefunding model, and treasury-risk policy by entity.
    relatedQuestionRefs:
    - QR030
