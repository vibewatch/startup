- id: trust-security-and-regulatory-stack
  title: Trust, security, and regulatory stack
  body: 'Security and regulation are not side claims in Zero Hash’s story; they are part of the product itself. The security page advertises ISO 27001 and 27002 alignment, GDPR compliance, and SOC 2 Type 1 and Type 2 controls. The legal disclosures surface is also more substantial than a generic marketing footer, listing transfer-service disclosures, supported-asset disclosures, risk disclosures, segregation of client assets, and EU trading platform operating rules. On the regulatory side, the company claims a layered stack: New York licensing appears on the DFS registry, Europe is covered by MiCAR authorization from the Dutch AFM, and the May 2026 EMI license from DNB extends that posture for e-money-token payment flows. The trust-company launch is especially relevant because it pushes the stack toward qualified custody and retirement-account enablement. The remaining issue is evidence depth. These are important credibility markers, but they are still top-level markers; a serious diligence
    process would still need audit reports, entity-by-entity activity maps, asset-segregation proofs, insurance details, and actual complaint-resolution statistics.'
  claimRefs:
  - CE023
  - CE024
  - CE025
  - CE026
