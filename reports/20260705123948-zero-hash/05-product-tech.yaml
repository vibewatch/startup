  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: developer-surface-depth
    missingEvidence: Public zerohash API reference docs, SDK repositories, changelog cadence, and sandbox onboarding material.
    whyItMatters: The fetched corpus proves API-first positioning but not the actual maturity of the builder experience or implementation ergonomics.
    diligencePath: Request current API docs, SDK list, release notes, and sample implementation artifacts directly from the company.
    relatedQuestionRefs:
    - QE020
  - type: private-evidence-only
    severity: material
    topic: custody-controls
    missingEvidence: Trust-company legal opinions, insurance coverage, segregation mechanics, key-ceremony evidence, and reconciliation exception metrics.
    whyItMatters: Custody is a failure-intolerant layer and marketing-level MPC claims are insufficient for underwriting asset-safety risk.
    diligencePath: Review custody architecture memo, SOC 2 scope, insurance schedules, and trust-company examination materials.
    relatedQuestionRefs:
    - QE005
    - QE019
  - type: private-evidence-only
    severity: material
    topic: commercial-depth
    missingEvidence: Module-level customer counts, attach rates, pricing ranges, and gross-margin profile by workflow.
    whyItMatters: Breadth is strategically valuable only if multiple modules convert into durable commercial usage and not just slideware adjacency.
    diligencePath: Ask management for product-by-product active-customer counts, attach rates, and unit economics.
    relatedQuestionRefs:
    - QE001
    - QE003
  - type: private-evidence-only
    severity: material
    topic: incident-history
    missingEvidence: Historical uptime by module, incident disclosures, degraded-mode procedures, and recovery-time objectives.
    whyItMatters: A 99.99% uptime headline is helpful but does not reveal whether critical modules share operational bottlenecks or correlated failure modes.
    diligencePath: Request production SLO dashboards, incident postmortems, and customer SLA templates.
    relatedQuestionRefs:
    - QE007
    - QE020
  - type: private-evidence-only
    severity: minor
    topic: tokenization-governance
    missingEvidence: Who controls contract upgrades, transfer restrictions, pause rights, and asset-servicing responsibilities on live tokenized products.
    whyItMatters: Tokenization risk is concentrated in governance and operational control, not only issuance capability.
    diligencePath: Request smart-contract governance docs and a live asset-control matrix for tokenization customers.
    relatedQuestionRefs:
    - QE010
  - type: private-evidence-only
    severity: minor
    topic: complaint-resolution-visibility
    missingEvidence: Complaint volumes, response SLAs, escalation paths, and remediation outcomes.
    whyItMatters: The existence of a complaint form is useful, but the absence of resolution data limits how much signal it provides on service quality.
    diligencePath: Ask for complaint logs, resolution timing, and any recurring root-cause categories over the last 12 months.
    relatedQuestionRefs:
    - QE026
