tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Trade infrastructure
    - Brokerages, banks, fintech trading teams
    - Clearly commercialized
    - 24/7 trading with liquidity, custody, settlement, and compliance inside one API-first flow
    - Need realized spread economics, venue coverage, and outage history by asset
  - - Qualified digital asset custody
    - Treasury, operations, and compliance teams
    - Core enabling layer
    - MPC-secured wallets, multi-signature controls, live monitoring, and real-time audit reporting
    - Need actual segregation model, insurance structure, and reconciler exception rates
  - - Fiat on/off ramp
    - Consumer-product and payments teams
    - Commercialized
    - Regulated conversion between banking rails and digital assets without separate vendor patchwork
    - Need fee schedules, bank-partner dependencies, and failure-handling detail
  - - Global payouts / remittances
    - Payroll, remittance, and treasury teams
    - Commercialized
    - Near-instant global settlement, address screening, Travel Rule automation, and last-mile orchestration
    - Need corridor-by-corridor latency, FX economics, and last-mile partner concentration
  - - Stablecoin payins
    - Merchants and platforms accepting onchain payments
    - Commercialized but narrower disclosure
    - Instant irreversible settlement and automated monitoring inside merchant-credit flow
    - Need refund/dispute handling, chain coverage, and merchant onboarding requirements
  - - Tokenization engine
    - Banks, asset managers, and capital-markets teams
    - Emerging but concrete
    - Compliant issuance, governance, and lifecycle management across multiple chains on one regulated stack
    - Need live client count, supported asset classes, and smart-contract control boundaries
  notes: Maturity reflects public packaging depth and regulatory readiness, not a verified internal roadmap or customer-satisfaction score.
  claimRefs:
  - CE006
  - CE008
  - CE010
  - CE012
  - CE014
  - CE017
  - CE019
  - CE020
- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Company solution
  - Measurable benefit
  - Limitation
  rows:
  - - Launch embedded crypto trading
    - Brokerage or fintech must source venues, custody, compliance, and settlement separately
    - Trade stack with routed execution and regulated custody
    - Accelerates time to market and keeps trading inside the customer experience
    - No public disclosure on venue count, realized spreads, or failover history
  - - Offer institutional custody
    - Firm must secure wallets, approvals, reconciliation, and reporting
    - Custody module with MPC wallets and multi-sign controls
    - Centralizes control model and keeps reporting audit-ready
    - Insurance and bankruptcy-remoteness specifics are not public
  - - Convert fiat to crypto or back
    - Teams otherwise stitch together banking partners and crypto vendors
    - Regulated on/off-ramp infrastructure
    - Simplifies conversion workflow inside one regulated flow
    - No public per-transaction pricing or bank-dependency map
  - - Send global payouts or remittances
    - Traditional rails create cutoffs, intermediaries, and FX delays
    - Onchain payouts and remittance stack with screening and last-mile delivery
    - Near-instant settlement and 24/7 operations across 200+ jurisdictions
    - Local partner economics and exact coverage exceptions are not public
  - - Accept stablecoin payments
    - Merchant uses card or fragmented crypto processors
    - Payins with onchain confirmation and merchant crediting
    - Instant irreversible settlement and fewer card-network costs
    - Chargeback alternatives, refund logic, and merchant protections need diligence
  - - Issue tokenized assets
    - Institution must design issuance, custody, compliance, and governance stack alone
    - Tokenization engine on unified regulated infrastructure
    - Launches programmable financial products without building issuance stack from scratch
    - No public evidence on production volumes or supported token standards
  notes: Benefits are product-design claims from zerohash surfaces and category logic, not independently audited ROI outcomes.
