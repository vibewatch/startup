- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / certification
  - Status
  - Scope
  - Gap
  rows:
  - - ISO 27001 / 27002-aligned ISMS
    - Claimed current
    - Information security management system
    - Need certificate scope, auditor, renewal cadence, and exceptions
  - - SOC 2 Type 1 and Type 2
    - Claimed current
    - Security, privacy, availability, and confidentiality controls
    - Need report scope, control exceptions, and environment boundaries
  - - GDPR compliance
    - Claimed current
    - EU privacy and data-protection posture
    - Need DPA terms, subprocessors, and data-residency commitments
  - - MiCAR authorization
    - Claimed current
    - EEA crypto-asset and stablecoin infrastructure for B2B2C customers
    - Need passporting details, product carve-outs, and activity-by-entity map
  - - EMI license from DNB
    - Claimed current
    - EMT and payment-services coverage under European framework
    - Need exact flows, exemptions, and customer onboarding implications
  - - Public legal disclosures
    - Claimed current
    - Risk disclosure, asset segregation, transfer rules, supported assets, and EU trading rules
    - Need direct links from each product SKU to the relevant disclosures and service terms
  - - Complaint intake process
    - Visible
    - Formal path for complaints about products or services
    - Need complaint volumes, response SLAs, and remediation disclosures
  notes: Controls are strong signaling, but public pages do not substitute for the underlying audit reports, legal opinions, or operating evidence.
