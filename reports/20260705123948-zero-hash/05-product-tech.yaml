- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Customer API and integration layer
    - Exposes trading, payments, custody, and tokenization functions to customer apps
    - API quality, auth flows, and customer engineering resources
    - Fetched corpus shows limited public SDK or changelog detail on zerohash itself
  - - Execution and liquidity layer
    - Routes trades and pricing across liquidity sources
    - Market makers and venue connectivity, including partners like Virtu
    - Liquidity fragmentation or partner concentration could degrade execution quality
  - - Custody and wallet layer
    - Holds assets, authorizes movement, and supports monitoring and reporting
    - MPC key-management design, approval policies, trust entity, and reconciliation processes
    - Control failures or asset-segregation weaknesses would be high-severity
  - - Compliance and monitoring layer
    - Runs screening, Travel Rule, transaction monitoring, and reporting
    - Regulatory rulesets, screening vendors, and wallet analytics
    - Rule drift or false negatives can create regulatory and counterparty risk
  - - Fiat and settlement layer
    - Bridges banking rails, stablecoin movement, and fiat settlement
    - Banking partners, money-transmission licenses, and local payout rails
    - Banking or payout-partner disruption could break service continuity
  - - Tokenization governance layer
    - Defines asset rules, minting, distribution, and lifecycle controls
    - Smart contracts, custody hooks, and jurisdiction-specific compliance
    - Public sources do not show who controls upgrades, freezes, or recovery actions
  notes: This is a public-evidence operating model, not an internal system diagram.
