figures:
- id: FE001
  title: Product architecture map
  type: stack
  layout: standard
  summary: Zero Hash’s public architecture reads as a layered platform that packages trading, payments, custody, and tokenization on top of the same regulated rails.
  data:
    layers:
    - label: Customer experience layer
      detail: Brokerage, bank, fintech, payroll, remittance, or payments app embeds zerohash functionality behind its own brand.
    - label: Workflow products
      detail: Trade, on/off-ramp, payouts, remittances, payins, custody, and tokenization modules can be enabled per use case.
    - label: Core orchestration
      detail: Liquidity routing, wallet orchestration, settlement logic, and compliance automation tie product modules together.
    - label: Control and custody layer
      detail: MPC wallets, approval policies, monitoring, reconciliation, audit logs, and qualified-custody entities safeguard assets.
    - label: Regulatory and legal layer
      detail: Money-transmission stack, NYDFS licenses, MiCAR authorization, EMI license, disclosures, and complaint handling shape allowed flows.
    - label: External infrastructure layer
      detail: Banking rails, blockchains, market makers, last-mile payout partners, and smart-contract environments remain critical dependencies.
  claimRefs:
  - CE001
  - CE007
  - CE009
  - CE017
  - CE026
  - CE030
- id: FE002
  title: Customer workflow / operating flow
  type: flow
  layout: wide
  summary: The operating flow starts with a customer platform request, runs through zerohash-controlled conversion and compliance layers, and ends with onchain or fiat settlement.
  data:
    nodes:
    - id: n1
      label: Customer app request
      detail: End user initiates trade, funding, payout, payment, or tokenization action inside a partner platform.
    - id: n2
      label: API intake
      detail: zerohash receives the request through its integration layer and identifies the required product workflow.
    - id: n3
      label: Compliance checks
      detail: Wallet screening, transaction monitoring, Travel Rule logic, and jurisdiction rules are applied.
    - id: n4
      label: Liquidity / custody orchestration
      detail: The platform routes execution, authorizes wallet movement, or prepares issuance and governance steps.
    - id: n5
      label: Onchain or fiat settlement
      detail: Trade finality, stablecoin transfer, merchant credit, or local payout distribution is completed.
    - id: n6
      label: Reporting and monitoring
      detail: Audit logs, reconciliation, and compliance reporting continue after the transaction completes.
    edges:
    - from: n1
      to: n2
    - from: n2
      to: n3
    - from: n3
      to: n4
    - from: n4
      to: n5
    - from: n5
      to: n6
