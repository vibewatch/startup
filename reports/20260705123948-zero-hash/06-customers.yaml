- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale / proof
  - Revenue / strategic value
  - Gap
  rows:
  - - Retail brokerages
    - 'Buyer: product / brokerage ops; User: trader or investor; Payer: brokerage platform'
    - Embedded crypto trading, funding, and onchain transfers
    - Public and Interactive Brokers case studies plus customer pages
    - Marquee financial brands can validate product quality and generate multi-product expansion
    - No disclosed ACV or revenue concentration by brokerage
  - - Payroll and employer platforms
    - 'Buyer: payroll / treasury / product; User: contractor or employee; Payer: payroll platform or employer'
    - Stablecoin payroll payouts and treasury funding
    - Gusto and Remote case studies
    - Recurring payroll cycles could create durable usage if adopted broadly
    - Public sources do not show retained employer count or payroll volume
  - - Payments and internet platforms
    - 'Buyer: treasury / payouts / payments; User: payout recipient or merchant; Payer: platform'
    - Stablecoin payout infrastructure and crypto conversion
    - Stripe payout case study and MiCAR roster
    - Cross-border settlement can make Zero Hash part of core money movement
    - No public contract terms or payout-volume disclosure
  - - Private markets and investment funding
    - 'Buyer: capital-markets / product teams; User: investor; Payer: investment platform'
    - 24/7 funding and tokenization-adjacent capital movement
    - Republic case study and Republic site
    - Could deepen ties with tokenization and alternative-investment workflows
    - No renewal or revenue disclosure by platform
  - - Remittance and cross-border apps
    - 'Buyer: treasury / remittance product; User: sender and recipient; Payer: remittance platform'
    - US-LATAM remittances and instant global payouts
    - Félix Pago case study
    - Shows Zero Hash can support high-frequency money movement outside brokerage use cases
    - Remittance economics and corridor concentration are undisclosed
  - - Event trading and prediction markets
    - 'Buyer: exchange / operations; User: trader; Payer: market platform'
    - Instant stablecoin account funding during volatile events
    - Kalshi case study
    - Supports time-sensitive funding where 24/7 access matters
    - No public volume or retention disclosure
  notes: Revenue value is inferred from workflow criticality because the reviewed public corpus does not disclose customer-level commercial terms.
