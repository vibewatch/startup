company:
  name: Zero Hash
chapter:
  number: 6
  title: Customers
  summary: Zero Hash has credible named-customer proof across brokerages, payroll platforms, payments, remittances, and private-markets funding. The public record is strongest on deployment breadth and selected outcome metrics, but still weak on retention economics, contract structure, and customer concentration despite the quality of the roster.
sections:
- id: customer-base-and-segmentation
  title: Customer base and segment structure
  body: 'The visible Zero Hash customer base is broad in workflow terms even if the company does not publish a complete production roster. The most credible pattern is B2B2C infrastructure sold to platforms rather than directly to end consumers. Brokerages such as Public and Interactive Brokers use Zero Hash to expose crypto trading, funding, and asset-movement features to their own clients. Payroll and HR platforms such as Gusto and Remote use it to push contractor payouts over stablecoin rails. Republic uses it for 24/7 investment funding, Félix Pago for remittance flows, and Kalshi for event-driven account funding. That breadth matters because the buyer is often a product, treasury, or operations team, the user is the platform’s underlying consumer or contractor, and the payer is the platform itself. The roster therefore spans retail investing, payroll, payments, global HR, remittances, and alternative-investment funding. The chapter’s key caveat is that platform breadth is easier to
    prove than commercial mix: public materials show who is using Zero Hash and roughly why, but not how revenue is distributed across those segments.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU015
  - CU022
  - CU039
  - CU044
  - CU045
  tableRefs:
  - TU001
  - TU002
