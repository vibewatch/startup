- id: durability-and-expansion-economics
  title: Durability, repeat usage, and expansion economics
  body: 'The reviewed public evidence supports a land-and-expand story much more than it supports a retention story. Expansion logic is intuitive and source-backed: a brokerage can start with trading, then add funding and onchain transfers; a payroll platform can move from an initial stablecoin payout feature into broader treasury and corridor expansion; and a remittance or funding platform can deepen usage as settlement becomes core to the product experience. Case-study outcomes from Public, Interactive Brokers, Republic, Remote, and MoneyLion all point to workflows that matter once live, which is encouraging for durability. But the underwriting gap is still material. There is no public gross retention, logo churn, standard contract length, minimum commitment disclosure, or cohort table in the fetched corpus. Even positive qualitative language around repeat usage—such as Félix saying faster transfers improved repeat usage—does not substitute for subscription or transaction-retention economics.
    In other words, Zero Hash’s public evidence proves that customers can adopt and expand with the product; it does not yet prove how sticky or economically durable those relationships are.'
  claimRefs:
  - CU020
  - CU021
  - CU024
  - CU026
  - CU027
  - CU030
  - CU037
  - CU040
  - CU043
  tableRefs:
  - TU004
  - TU006
- id: concentration-partner-dependence-and-adverse-signals
  title: Concentration, partner dependence, and adverse signals
  body: 'The quality of the named roster is clearly a strength, but it also creates concentration and partner-dependence questions. The company repeatedly highlights Public, Interactive Brokers, Stripe, Gusto, Franklin Templeton, and Morgan Stanley-linked brands, which is valuable signaling but could also mean a meaningful share of revenue sits in a small set of marquee relationships. The Virtu partnership shows that customer outcomes in trading products depend on external liquidity depth as well as Zero Hash’s own software. The May 2026 CoinDesk article adds a different risk lens: even with a strong client list, the company was still pursuing fresh capital above a $1.5 billion valuation after Mastercard walked away from a potential investment following its BVNK acquisition. That does not disprove customer quality, but it does show that strategic-partner narratives can change quickly. The right conclusion is therefore balanced. Zero Hash has real named-customer proof and valuable institutional
    logos, yet investors should still demand hard data on customer concentration, contract terms, partner SLAs, and renewal patterns before assuming the public roster translates cleanly into durable revenue quality.'
