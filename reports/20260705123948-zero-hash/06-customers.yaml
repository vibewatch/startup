  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Gross retention, logo churn, renewal rates, contract duration, and cohort views by major customer segment.
    whyItMatters: Named customer proof alone cannot establish durability or revenue quality for an infrastructure vendor.
    diligencePath: Request board metrics for GRR, NRR, logo churn, cohort curves, and standard renewal terms.
    relatedQuestionRefs:
    - QU015
    - QU016
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 customer revenue share, minimum commitments, and segment mix by revenue or gross profit.
    whyItMatters: A small number of marquee institutions may create outsized concentration risk despite broad logo variety.
    diligencePath: Request a customer concentration schedule and revenue mix by brokerage, payroll, payments, remittance, and tokenization-related customers.
    relatedQuestionRefs:
    - QU019
    - QU025
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: independent-customer-validation
    missingEvidence: Reference calls, public customer conference talks, or review exports independent of Zero Hash’s own case-study pages.
    whyItMatters: Most current proof is company-curated, which is useful but weaker than independently sourced customer validation.
    diligencePath: Collect customer references across at least brokerage, payroll, and remittance cohorts and compare claims against case-study outcomes.
    relatedQuestionRefs:
    - QU014
    - QU023
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: minor
    topic: beta-to-production-conversion
    missingEvidence: Current adoption levels for Gusto’s beta payout product and production conversion milestones after launch.
    whyItMatters: Beta-stage publicity can overstate durable commercial adoption if rollout stalls before broad usage.
    diligencePath: Ask for live employer count, payout volume, and timeline from beta to general availability.
    relatedQuestionRefs:
    - QU006
    - QU024
  - type: private-evidence-only
    severity: minor
    topic: partner-sla-dependence
    missingEvidence: Liquidity-partner SLAs, routing logic, last-mile payout partner list, and fallback procedures.
    whyItMatters: Customer experience in trading and payouts depends on partner performance as well as Zero Hash code.
    diligencePath: Review partner contracts, routing policies, and incident management for external counterparty failures.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: minor
    topic: complaint-trend-visibility
    missingEvidence: Complaint volume, time-to-resolution, and recurring issue categories by customer type.
    whyItMatters: Complaint trends can reveal service or integration issues earlier than churn data becomes visible publicly.
    diligencePath: Request 12-month complaint logs and map them against customer concentration and module usage.
