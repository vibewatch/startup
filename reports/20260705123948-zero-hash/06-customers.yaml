- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Cross-sell from trading into funding, payouts, and onchain transfers
    - Large brokerages may still account for disproportionate economics
    - High
    - Request ARR by workflow and top-customer share
  - - Payroll rails for Gusto and Remote
    - Beta or early deployments can look strategic before they become broad recurring volume
    - Medium-high
    - Ask for active employer counts, recipient counts, and payout volume retention
  - - Global payout and remittance corridors
    - Specific corridors or last-mile partners may dominate economics
    - Medium-high
    - Review corridor concentration and payout-partner contracts
  - - Private-markets and tokenization-adjacent funding
    - A few marquee institutional brands could create signaling value without large recurring revenue
    - Medium
    - Request revenue mix by platform and usage intensity
  - - Liquidity-ecosystem depth through Virtu and similar partners
    - Customer outcomes in trading products depend on partner pricing and market depth
    - Medium-high
    - Review partner SLAs, routing logic, and failover options
  - - Fundraising momentum around marquee customers
    - If financing or strategic-partner expectations soften, headline roster quality may not fully offset execution risk
    - Medium
    - Discuss runway, fundraising path, and exposure to customer or investor overlap
  notes: The central risk is not lack of logos; it is uncertainty around how much recurring revenue and retention quality each logo actually represents.
