- id: named-customer-proof-and-adoption
  title: Named customer proof and adoption trajectory
  body: 'Deployment proof is strongest where Zero Hash pairs a workflow-specific case study with either a customer-domain corroboration or a concrete outcome. Public is the cleanest example: Zero Hash says it powers 24/7 crypto trading, more order types, broader token choice, and onchain transfers, while Public’s own site says crypto services are provided by Zero Hash. Interactive Brokers is similarly strong because two case studies cover both trading and funding, and IBKR’s own crypto page names Zero Hash as one of the service providers. Gusto’s proof is good but slightly softer because the public launch is still described as beta, even though the case study and press release are detailed. Remote, Republic, MoneyLion, Félix Pago, and Kalshi all show real production-style workflows with concrete outcome language, but they rely more heavily on company-hosted evidence. The resulting interpretation is favorable on deployment reality: Zero Hash clearly powers live customer workflows across multiple
    verticals. The limitation is not lack of logos; it is that most proof remains curated by Zero Hash rather than independently measured by customers or filings.'
  claimRefs:
  - CU004
  - CU005
  - CU006
  - CU011
  - CU012
  - CU013
  - CU014
  - CU016
  - CU019
  - CU026
