- id: TU006
  title: Retention visibility and diligence gaps table
  columns:
  - Visibility area
  - Public evidence
  - What is missing
  - Why it matters
  - Next diligence step
  rows:
  - - Deployment versus durability
    - Many named case studies and some customer-site corroboration
    - Cohorts, GRR, and logo churn
    - A wide logo roster can still hide weak renewal quality
    - Request cohort tables and board-level retention metrics
  - - Contract structure
    - Gusto is still described as beta; other examples lack term details
    - MSA length, renewal rules, and volume commitments
    - Durability depends heavily on contract design for infrastructure vendors
    - Review live contracts or procurement summaries
  - - Commercial concentration
    - Marquee names include Public, Interactive Brokers, Stripe, Gusto, and Morgan Stanley-linked brands
    - Top-customer revenue share and minimum commitments
    - One or two major brokerages or platforms could dominate economics
    - Ask for top-10 concentration schedule
  - - Independent validation
    - Public and IBKR customer pages help, but most detailed outcomes are still company-hosted
    - Reference calls, review exports, or customer conference talks
    - Independent customer evidence is stronger than curated case studies
    - Run reference calls and gather third-party testimonials
  - - Complaint trend visibility
    - Complaint intake page exists
    - Resolution speed and recurrence patterns
    - Complaint frequency can reveal integration or operations pain before churn does
    - Request complaint logs and root-cause taxonomy
  notes: This extra table substitutes for a public retention-cohort figure because the reviewed sources do not responsibly support numeric cohort cells.
  claimRefs:
  - CU037
  - CU038
  - CU041
  - CU043
