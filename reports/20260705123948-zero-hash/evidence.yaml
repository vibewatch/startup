evidenceGaps:
  - type: missing-source
    severity: material
    topic: founding-date
    missingEvidence: >-
      Primary-source legal formation records or a fetched corporate-history page that reconciles 2017 platform inception
      with the 2018 standalone-company milestone used in this report.
    whyItMatters: Founding chronology is reused by later chapters and affects historical narrative consistency.
    diligencePath: >-
      Pull incorporation records, Seed CX lineage material, or an official corporate-history document that explicitly
      bridges the chronology split.
    relatedQuestionRefs:
      - QO003
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      A complete consolidated board and committee map across zerohash LLC, Liquidity Services, and Trust Company,
      including observer or control rights.
    whyItMatters: >-
      Public entity-level director names do not show who controls major decisions or how oversight is divided across the
      stack.
    diligencePath: Request the current legal-entity chart, board roster, committee charters, and investor-rights summary.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: economics-gap
    missingEvidence: >-
      Current revenue, gross margin, net revenue retention, and module-level contribution by trading, payments, and
      tokenization.
    whyItMatters: >-
      These metrics determine whether the regulatory stack converts into attractive unit economics or merely expensive
      complexity.
    diligencePath: Request board materials or monthly financials with product-segment revenue, gross profit, and retention cohorts.
    relatedQuestionRefs:
      - QO025
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-customer concentration, partner-specific volumes, and contract duration for the largest institutional
      relationships.
    whyItMatters: Logo quality is high, but concentration risk cannot be judged from public partner announcements alone.
    diligencePath: Request top-10 customer exposure, volume by use case, and renewal / termination terms in the data room.
    relatedQuestionRefs:
      - QO025
  - type: missing-source
    severity: material
    topic: serviceable-market
    missingEvidence: >-
      A product-line and geography level serviceable-market model that isolates Zero Hash’s real addressable spend
      rather than stablecoin supply or network activity proxies.
    whyItMatters: Without a tighter SAM, market size can be directionally correct yet still too broad for underwriting.
    diligencePath: Request management’s internal market model by module, geography, buyer vertical, and conversion assumptions.
    relatedQuestionRefs:
      - QM022
  - type: private-evidence-only
    severity: material
    topic: market-share
    missingEvidence: >-
      Current volumes, active accounts, or revenue by product line needed to translate traction markers into a
      defendable SOM.
    whyItMatters: Share capture is what matters for valuation, and public sources expose only coarse platform-level scale figures.
    diligencePath: Request module-level volumes, active customer counts, and revenue concentration by vertical.
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: material
    topic: pricing-and-unit-economics
    missingEvidence: Pricing schedules, take rates, gross margins, and compliance or custody cost-to-serve by module.
    whyItMatters: The market can be large while the economics remain unattractive if compliance and custody costs absorb the spread.
    diligencePath: Request customer contracts, pricing grids, gross margin bridge, and implementation-cost data by workflow.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: material
    topic: enterprise-pricing
    missingEvidence: >-
      Published enterprise fee cards, minimums, and realized take-rate evidence across Zero Hash and the closest
      alternatives.
    whyItMatters: Without real pricing and discount data, the chapter can compare scope but not durable margin power.
    diligencePath: Request sampled contracts or win-loss pricing exhibits from Zero Hash and at least two competitor alternatives.
    relatedQuestionRefs:
      - QP008
      - QP009
      - QP010
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: win-loss-data
    missingEvidence: >-
      Customer-level win-loss, renewal, and churn data showing whether large buyers consolidate on one stack or
      multi-home.
    whyItMatters: This is the missing proof behind the moat claim and the switching-cost discussion.
    diligencePath: Request renewal cohorts, migration cases, and documented competitive displacements by segment.
    relatedQuestionRefs:
      - QP016
      - QP024
      - QP025
    relatedTableRefs:
      - TP001
      - TP004
  - type: private-evidence-only
    severity: material
    topic: switching-cost-economics
    missingEvidence: Implementation-time, migration-cost, and control-owner data from live customer deployments.
    whyItMatters: Public product pages suggest switching costs, but they do not quantify how sticky those costs really are.
    diligencePath: Ask for customer implementation postmortems and re-platforming examples.
    relatedQuestionRefs:
      - QP016
      - QP024
    relatedTableRefs:
      - TP004
  - type: enumeration-incomplete
    severity: minor
    topic: long-tail-competitor-landscape
    missingEvidence: >-
      A more exhaustive regional or niche-vertical competitor census beyond the direct stack, issuer, custody, and
      distributor classes covered here.
    whyItMatters: >-
      The core decision set is covered, but some long-tail regional vendors could matter in specific geographies or
      charters.
    diligencePath: >-
      Expand later refreshes with region-specific competitors only when customer mix or geography makes them
      decision-relevant.
    relatedQuestionRefs:
      - QP001
      - QP023
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Audited revenue, revenue mix, and revenue-recognition detail by product and customer segment.
    whyItMatters: Without revenue disclosure, the chapter can judge demand proxies but not true revenue quality.
    diligencePath: Request audited monthly revenue bridge by product, segment, geography, and customer cohort.
    relatedQuestionRefs:
      - QI001
      - QI003
      - QI004
      - QI022
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
