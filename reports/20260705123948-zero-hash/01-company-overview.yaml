company:
  name: Zero Hash
chapter:
  number: 1
  title: Company Overview
  summary: Zero Hash enters the report as a regulated crypto, stablecoin, and tokenization infrastructure provider with a verified September 2025 unicorn round, expanding U.S. and European licensing, and a broadening roster of embedded-finance customers. The strongest public strengths are regulatory posture and institutional distribution; the biggest remaining gaps are the unresolved 2017-versus-2018 chronology split and the absence of audited revenue, margin, concentration, and governance-rights disclosure.
sections:
- id: founding-identity
  title: Founding chronology, identity, and current positioning
  body: Zero Hash’s current official surfaces are explicit about one thing and notably fuzzy about another. They are explicit that the company wants to be read as the regulated infrastructure layer behind trading, stablecoin, and tokenization products for banks, brokerages, and fintechs rather than as a consumer-facing exchange. The homepage now packages that identity around three operating modules—trade, transact, and tokenize—and pairs it with 2026 scale language of $65B+ settled volume, 7M+ end customers, 100+ supported assets, 200 jurisdictions, and 99.99% uptime. What remains less clean is the chronology. Official pages consistently use 2017 as the inception marker, while the assignment brief for this report uses 2018 as the standalone-company founding milestone. The cleanest reconciliation is to treat 2017 as the Seed CX and platform-lineage inception date, and 2018 as the milestone for the standalone operating company that later scaled under the Zero Hash brand. Because no fetched
    incorporation record or corporate-history page fully bridges that split, the 2017 versus 2018 chronology should remain a diligence note rather than a hidden assumption.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO021
  - CO022
  - CO023
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: leadership-governance
  title: Leadership bench and governance structure
  body: Founder centrality is still high, but the public operating bench is broader than a single charismatic founder story. Edward Woodford remains the essential narrative bridge from inception to current scale, and his prior derivatives-exchange background helps explain why Zero Hash sells regulated infrastructure rather than pure consumer crypto experiences. The newsroom also discloses a more functional operating bench across legal, business development, commercial execution, finance, and security. That matters because the company now sells into institutions that care as much about risk operations and regulatory design as product speed. Governance has also become more legible during 2025, when Zero Hash publicly added separate directors to its LLC board, its liquidity-services board, and the trust-company board. Even so, the public picture is incomplete. The board disclosures are entity-specific rather than a simple consolidated board roster, and fetched public materials do not expose
    control rights, observer rights, or a full governance map. Investors should therefore read the named director additions as a genuine maturity signal, but not as a substitute for seeing the full legal-entity structure and board package in diligence.
  claimRefs:
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
