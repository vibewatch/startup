- id: TP001
  title: Competitor profile table
  columns:
  - Competitor / class
  - Category
  - Scale / funding signal
  - Target segment
  - Differentiation
  - Key limitation
  rows:
  - - Zero Hash
    - Full-stack B2B2C digital-asset infrastructure
    - $65B+ settled volume; 7M+ end customers; 100+ assets
    - Banks, brokerages, fintechs, and platforms embedding digital assets
    - One regulated platform across trade, transact, custody, and tokenization
    - Realized pricing, retention, and win-loss data are not public
  - - Fireblocks
    - Digital-asset orchestration, custody, and stablecoin infrastructure
    - $310M Series D; $2B+ valuation disclosed historically
    - Banks, fintechs, exchanges, trading firms, and startups
    - Broad wallet/orchestration platform with stablecoin, payments, and tokenization scope
    - Less obviously packaged as one regulated B2B2C brokerage stack
  - - BitGo
    - Custody-first institutional infrastructure
    - Globally trusted since 2013 on official custody page
    - Funds, issuers, treasuries, and institutions prioritizing asset protection
    - Qualified custody, cold storage, and regulatory framing
    - Narrower public product breadth than Zero Hash or Fireblocks
  - - Anchorage Digital
    - Institutional custody plus issuance and reserve tooling
    - Bank-oriented platform spanning custody, issuance, rewards, and reserves
    - Institutions issuing, holding, or distributing digital dollars and tokenized assets
    - Direct reserve, issuance, and rewards capabilities alongside custody
    - Public pricing and breadth of broker-facing trading tools are opaque
  - - Circle
    - Issuer and compliance rails for stablecoin settlement
    - Native USDC on 35 networks in retained 2026 source set
    - Payment firms, fintechs, exchanges, wallets, and chains
    - Issuer control, compliance tooling, bridged-to-native path, and multichain reach
    - Not a full brokerage or qualified-custody stack by itself
  - - Coinbase / distribution ecosystem
    - Exchange, wallet, payments, and consumer-finance distribution
    - One trusted account for crypto, stocks, and more on homepage
    - Retail and institutional buyers that value brand and liquidity access
    - Strong end-user trust, distribution, and adjacent financial products
    - Prime-specific enterprise packaging is not observable in the retained corpus
  - - Broker / fintech substitutes (Interactive Brokers, Public)
    - Customer-owning distribution channels using infrastructure behind the scenes
    - $1.80 public IBKR trade-cost anchor; Public offers 60+ assets
    - Existing brokers or investing apps that want to preserve the front end
    - Keep the customer relationship while outsourcing infrastructure modules
    - They are channels and wrappers, not reusable infrastructure for everyone else
  - - Internal build / status quo
    - Issuer, custodian, and orchestration mix built by the buyer
    - Uses existing treasury, compliance, engineering, and support budgets
    - Large institutions with internal control preferences
    - Maximum control over packaging, economics, and user experience
    - Highest integration, licensing, and operating-complexity burden
