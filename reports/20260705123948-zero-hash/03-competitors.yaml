- id: moat-durability-and-adverse-evidence
  title: Moat durability and adverse evidence
  body: |-
    The disconfirming evidence is meaningful. Circle and Anchorage can bypass parts of the intermediary layer on issuance and reserve-heavy workflows. Fireblocks has more visibly abundant capital and a broad official platform story. Coinbase, Interactive Brokers, and Public demonstrate that customer-owning distributors can keep the brand, economics, and interface while pushing infrastructure into the background. Visa and J.P. Morgan both describe stablecoins as rising payment infrastructure, which expands the addressable market but also increases the incentive for larger incumbents, issuers, and custodians to move down-stack or across-stack.

    That leaves Zero Hash with a moat that appears executional and regulatory-integration-led rather than permanently structural. The company’s best public argument is that one regulated platform can reduce the number of vendors a buyer must coordinate across trade, transact, custody, and tokenization. The missing proof is commercial, not conceptual: public realized pricing, durable win-loss evidence, churn behavior, and data on how often large customers consolidate versus multi-home. Until those are visible, the prudent conclusion is that Zero Hash has a credible wedge but not an unassailable position.
