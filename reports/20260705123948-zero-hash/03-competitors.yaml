    - Request customer references on consolidation versus multi-vendor stacks
  - - Stablecoin abstraction is differentiating
    - Circle and Anchorage can remove intermediary scope on issuance and reserve-heavy flows
    - High
    - Circle controls native issuance and multichain USDC; Anchorage markets issuance and reserve services
    - Test where Zero Hash adds value beyond issuer access
  - - Qualified custody strengthens trust
    - BitGo and Anchorage are already recognized custody specialists
    - Medium
    - Both position institutional custody as a core wedge
    - Request win-loss evidence in qualified-custody-led deals
  - - Customer distribution can compound
    - Coinbase, IBKR, and Public keep the brand and interface
    - High
