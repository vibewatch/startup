- id: switching-costs-substitutes-and-distribution
  title: Switching costs, substitutes, and distribution power
  body: |-
    Multi-homing is a central reality of this market. A buyer can source issuer rails from Circle, custody from Anchorage or BitGo, wallet and policy orchestration from Fireblocks, and still keep the distribution relationship inside its own brokerage or fintech app. Public’s explicit software-licensing disclosure and Interactive Brokers’ public crypto pricing both show how infrastructure can sit behind a more powerful end-user brand. That means Zero Hash often competes for wallet share inside a larger customer product rather than winning a visible end-customer relationship outright.

    Switching costs are real, but they look operational rather than monopolistic. Once a platform has integrated custody controls, stablecoin settlement flows, licensing logic, and front-end order types, re-platforming is not trivial. But the retained set does not show proof that those costs are high enough to prevent recomposition over time. Internal build is therefore not a straw man. It is a legitimate option for the largest institutions, especially when they already own compliance, treasury, and customer-support functions and only need to buy narrow modules rather than an entire stack.
  claimRefs:
  - CP023
  - CP029
  - CP030
