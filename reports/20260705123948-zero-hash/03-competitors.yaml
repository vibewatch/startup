- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence today
  - Mitigation / diligence ask
  rows:
  - - One regulated platform reduces vendor sprawl
    - Buyers can multi-home across issuer, custody, and distribution layers
    - High
