            title: Regulatory moat plus client quality is the bull core
            body: >-
              Zero Hash has one of the most credible public combinations of licensing breadth and enterprise logos in
              the B2B2C stablecoin stack. That is why it belongs on a live watchlist, not in the discard pile.
            calloutType: strength
            claimRefs:
