  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Zero Hash typically lands because a platform needs faster money movement or crypto functionality, then expands
      once the first regulated workflow is live.
    data:
      nodes:
        - id: j1
          label: Problem trigger
          detail: Platform wants 24/7 trading, faster cross-border settlement, or real-time account funding.
        - id: j2
          label: Integration evaluation
          detail: Customer compares building internal rails versus embedding Zero Hash infrastructure.
        - id: j3
          label: Initial launch
          detail: First workflow goes live in trading, funding, payouts, payroll, remittances, or onchain transfers.
        - id: j4
          label: Operational usage
          detail: End users rely on the product in real time, often with 24/7 availability and onchain settlement.
        - id: j5
          label: Workflow expansion
          detail: Customer adds more tokens, order types, corridors, or adjacent funding and transfer features.
        - id: j6
          label: Durability test
          detail: Renewal economics depend on volume, recurring use, and commercial terms that are mostly private.
    approximationNotes: >-
      Stages are inferred from case-study narratives because the reviewed public sources do not publish a formal Zero
      Hash sales funnel or customer-success map.
    claimRefs:
      - CU001
      - CU004
      - CU006
      - CU013
      - CU016
      - CU040
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: wide
    summary: >-
      Public evidence supports a sequential adoption flow from evaluation to first workflow launch to broader product
      attachment, but not stage-by-stage conversion rates.
    data:
      nodes:
        - id: f1
          label: Strategic need
          detail: Brokerage, payroll, or payments platform needs regulated crypto or stablecoin capability.
        - id: f2
          label: Implementation choice
          detail: Customer chooses Zero Hash to avoid building infrastructure internally.
        - id: f3
          label: First workflow launch
          detail: Examples include IBKR trading, Gusto payroll, Public crypto, and Remote payouts.
        - id: f4
          label: Active usage
          detail: Case-study outcomes show live trading, funding, payouts, and transaction volume.
        - id: f5
          label: Expansion
          detail: Customers add more order types, more tokens, more corridors, or adjacent funding features.
        - id: f6
          label: Retention unknowns
          detail: Public sources do not disclose GRR, logo churn, or contract terms.
      edges:
        - from: f1
          to: f2
          label: Build vs buy decision
        - from: f2
          to: f3
          label: Integration
        - from: f3
          to: f4
          label: Production go-live
        - from: f4
          to: f5
          label: Additional workflows
        - from: f5
          to: f6
          label: Renewal economics
    approximationNotes: >-
      A flow is used instead of a numeric funnel because the public corpus has outcomes and launch examples but no
      conversion percentages between stages.
    claimRefs:
