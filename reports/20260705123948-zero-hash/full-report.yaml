      - number: '8.3'
        title: What keeps the multiple in check
        blocks:
          - type: paragraph
            body: >-
              The reason to stay disciplined is not that the business looks weak; it is that the evidence remains
              lopsided. We can see customer quality, market momentum, product breadth, and licensing depth. We cannot
              see net revenue by product, gross margin by entity, partner concentration, or the cost of supporting a
              global compliance footprint. That means valuation must be framed through milestone and strategic comps
              instead of a neat revenue multiple. Fireblocks proves infrastructure assets can command premium private
              prices. Anchorage and BitGo prove that custody-grade rivals already market stronger or more mature
              credential sets in some lanes. Coinbase proves that broad crypto distribution remains a live competitive
              benchmark. Interactive Brokers proves that the flagship client set is serious, but it also reminds
              investors that sophisticated partners can internalize more of the stack over time. The right conclusion is
              not that Zero Hash is overvalued. It is that upside should be phased in only as evidence on conversion,
              margins, and concentration arrives.
            claimRefs:
