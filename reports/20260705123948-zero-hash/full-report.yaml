      - number: '3.3'
        title: Switching costs, substitutes, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Multi-homing is a central reality of this market. A buyer can source issuer rails from Circle, custody
              from Anchorage or BitGo, wallet and policy orchestration from Fireblocks, and still keep the distribution
              relationship inside its own brokerage or fintech app. Public’s explicit software-licensing disclosure and
              Interactive Brokers’ public crypto pricing both show how infrastructure can sit behind a more powerful
              end-user brand. That means Zero Hash often competes for wallet share inside a larger customer product
              rather than winning a visible end-customer relationship outright.


              Switching costs are real, but they look operational rather than monopolistic. Once a platform has
              integrated custody controls, stablecoin settlement flows, licensing logic, and front-end order types,
              re-platforming is not trivial. But the retained set does not show proof that those costs are high enough
              to prevent recomposition over time. Internal build is therefore not a straw man. It is a legitimate option
              for the largest institutions, especially when they already own compliance, treasury, and customer-support
              functions and only need to buy narrow modules rather than an entire stack.
            claimRefs:
              - CP023
              - CP029
              - CP030
              - CP031
              - CP032
              - CP033
              - CP036
      - number: '3.4'
        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The disconfirming evidence is meaningful. Circle and Anchorage can bypass parts of the intermediary layer
              on issuance and reserve-heavy workflows. Fireblocks has more visibly abundant capital and a broad official
              platform story. Coinbase, Interactive Brokers, and Public demonstrate that customer-owning distributors
              can keep the brand, economics, and interface while pushing infrastructure into the background. Visa and
              J.P. Morgan both describe stablecoins as rising payment infrastructure, which expands the addressable
              market but also increases the incentive for larger incumbents, issuers, and custodians to move down-stack
              or across-stack.


              That leaves Zero Hash with a moat that appears executional and regulatory-integration-led rather than
              permanently structural. The company’s best public argument is that one regulated platform can reduce the
              number of vendors a buyer must coordinate across trade, transact, custody, and tokenization. The missing
              proof is commercial, not conceptual: public realized pricing, durable win-loss evidence, churn behavior,
              and data on how often large customers consolidate versus multi-home. Until those are visible, the prudent
              conclusion is that Zero Hash has a credible wedge but not an unassailable position.
