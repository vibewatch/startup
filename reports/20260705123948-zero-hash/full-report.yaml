      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The public record supports a favorable demand and product-market-fit read. Zero Hash is clearly embedded
              in multiple regulated money-movement workflows, it serves large and credible customers, and the
              platform-level stablecoin metrics point to growing frequency and ticket size rather than one-off
              experimentation. Those are the ingredients of a potentially high-quality infrastructure business:
              recurring workflow dependence, cross-sell potential across several use cases, and customers whose own
              scale can compound platform activity.


              The underwriting blocker is not demand. It is conversion from demand into realized economics. Revenue is
              undisclosed. Gross margin, CAC, payback, burn, and runway are undisclosed. Customer concentration,
              realized pricing, and revenue mix are undisclosed. The case studies that make the growth narrative
              attractive are also mostly company-authored. So the right conclusion is not bearish, but incomplete: Zero
              Hash looks financially promising and better capitalized after the 2025 raise, yet a serious investment
              view still requires data-room evidence on revenue quality, margin path, and current balance-sheet strength
              before the chapter can support conviction underwriting.
