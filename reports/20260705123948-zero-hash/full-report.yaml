  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and solution classes
        blocks:
          - type: paragraph
            body: >-
              Zero Hash should be compared against solution classes, not just one direct rival. The company spans
              brokerage execution infrastructure, stablecoin settlement, custody, and tokenization, so the realistic
              buyer alternatives include full-stack infrastructure vendors such as Fireblocks, custody-first specialists
              such as BitGo, bank-oriented platforms such as Anchorage, issuer rails such as Circle, and distribution
              owners such as Coinbase, Interactive Brokers, and Public that can keep the customer relationship while
              outsourcing some infrastructure. Internal build also remains credible for large institutions because the
              buyer can combine Circle or Anchorage-style issuer or reserve rails, Fireblocks or BitGo-style custody and
              orchestration, and its own front end.


              That breadth cuts both ways. It gives Zero Hash a broader value proposition than a pure custody or
              stablecoin vendor, but it also means the company is exposed to more substitute paths. The strongest
              competitive lens is therefore not “Who else does exactly this?” It is “How else can a bank, brokerage, or
              fintech deliver regulated digital-asset products to its own users?” On that broader lens, Fireblocks,
              BitGo, Anchorage, Circle, Coinbase-adjacent distribution, and internal build all matter more than
              one-for-one feature mimicry.
