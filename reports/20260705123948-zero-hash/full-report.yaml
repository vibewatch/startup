      - number: '8.2'
        title: Moat, market, and client-quality upside
        blocks:
          - type: paragraph
            body: >-
              The bull side of the story is real. Zero Hash combines a broad U.S. licensing base with a North Carolina
              trust company, MiCAR authorization, and a Dutch EMI license, which few B2B2C infrastructure peers can
              match at the same time. That licensing stack is paired with a surprisingly strong institutional client
              set. Interactive Brokers is both lead investor and production customer, Morgan Stanley is tied into the
              E*TRADE rollout narrative, Public is live, and company materials point to Stripe, Franklin Templeton, and
              other regulated institutions using the platform. Market conditions are also supportive. Circle, J.P.
              Morgan, and Visa all describe meaningful stablecoin adoption tailwinds, especially in cross-border
              payments and wholesale settlement, while Zero Hash’s own 2026 report claims unusually fast growth in
              stablecoin activity. Put differently, the company appears to sit in the right segment of digital-asset
              infrastructure at the right time. The upside case therefore does not need heroic market timing; it needs
              proof that these regulatory and distribution advantages convert into monetizable, durable enterprise
              economics.
            claimRefs:
