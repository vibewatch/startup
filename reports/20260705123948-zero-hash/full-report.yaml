      - number: '4.3'
        title: Capital adequacy and balance-sheet gaps
        blocks:
          - type: paragraph
            body: >-
              Company Overview owns the round chronology, but Financials still has to answer whether the company looks
              adequately capitalized for the next leg of execution. The clearest public positive is the September 2025
              Series D-2: CoinDesk and multiple follow-on reports say Zero Hash raised $104M at a $1B valuation led by
              Interactive Brokers, taking reported total funding to $275M. The trust-company launch in the same period
              also matters because it expands the product and regulatory perimeter around qualified custody, RIAs, and
              retirement-account use cases. Together, those facts support a narrative of growing institutional
              credibility.


              But the core balance-sheet questions remain unanswered. No retained public source discloses cash on hand,
              monthly burn, runway, debt, or covenant constraints. The May 2026 CoinDesk article should therefore be
              interpreted carefully: it is adverse optionality context, not evidence of new money already closed.
              Mastercard reportedly stepped away and Zero Hash was said to be pursuing new funding above a $1.5B
              valuation, but the article does not confirm proceeds. So the responsible underwriting posture is that 2025
              strengthened capital context, while 2026 still leaves open whether the company wanted incremental growth
              capital, strategic flexibility, or simply a refreshed valuation signal.
