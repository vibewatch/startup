      - number: '2.2'
        title: 'Sizing lenses: stablecoin base layer, adoption proxies, and the limits of public TAM'
        blocks:
          - type: paragraph
            body: >-
              Even after the boundary is narrowed, public sizing remains more constrained than typical SaaS TAM work.
              J.P. Morgan gives the clearest external base layer by estimating the fiat-backed dollar stablecoin market
              at roughly $300 billion today, with a plausible path to $500 billion to $750 billion over the next few
              years and a $1 trillion upside case if adoption and regulation line up. Circle’s USDC economy report adds
              transaction-scale proof: more than 78% year-over-year circulation growth and more than $18 trillion of
              all-time USDC volume, including $1 trillion in a single month in late 2024. Zero Hash’s own report then
              adds platform-specific adoption signals—1.4 billion stablecoin-ready accounts, 146% customer growth, 208%
              transaction-count growth, 690% dollar-volume growth, and 106-country usage in 2025. Those data points do
              not yield an exact Zero Hash TAM, SAM, or SOM, but they do show that the relevant market is a growing,
              regulated money-movement and asset-issuance layer rather than a purely narrative opportunity. The missing
              piece is product-line revenue, pricing, and share data that would translate these adoption proxies into a
              tighter serviceable-market estimate.
