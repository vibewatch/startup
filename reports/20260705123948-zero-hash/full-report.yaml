      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation = track / fair / medium confidence
            body: >-
              The company-quality evidence is better than the price-evidence quality. Stay anchored to the $1.0B closed
              round until new economics or new terms prove that a higher step-up is earned.
            calloutType: recommendation
            claimRefs:
              - CV001
