  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what this chapter is actually sizing
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to size Zero Hash’s market is to ignore the temptation to use total crypto market
              capitalization as a proxy. Zero Hash is not selling exposure to bitcoin prices; it is selling regulated
              infrastructure that lets banks, brokerages, fintechs, merchants, and asset managers launch specific
              products without building custody, liquidity, compliance, or chain orchestration internally. That means
              the relevant market is regulated crypto, stablecoin, and tokenization infrastructure spend. Included
              inside that boundary are trading enablement for brokerages and banks, stablecoin money movement for
              payouts, payins, treasury, and funding, tokenization issuance and lifecycle tooling, and on-ramp
              conversion products that make those rails usable. Excluded from the boundary are speculative token market
              cap, consumer exchange revenue that does not depend on infrastructure outsourcing, and generic blockchain
              software spend with no regulated financial workflow attached. This narrower boundary is what keeps the
              chapter analytically honest: it frames Zero Hash as a picks-and-shovels vendor inside a regulated
              financial-infrastructure category rather than as a claim on all crypto activity.
