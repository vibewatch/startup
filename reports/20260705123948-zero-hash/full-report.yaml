  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              The public evidence makes Zero Hash’s revenue mechanism legible even though it does not disclose revenue
              itself. The platform is clearly not a consumer brokerage. Its official surfaces and customer case studies
              position it as infrastructure sold to banks, brokerages, fintechs, payroll platforms, remittance
              providers, and investment platforms. Those sources show monetization opportunities across brokerage
              execution, custody, stablecoin funding and payouts, remittance, payment acceptance, and tokenization. The
              Interactive Brokers trading case study is especially useful because it explicitly mentions configurable
              spreads by asset, which confirms at least one monetization lane tied to transaction activity rather than
              pure subscription seats.


              What remains opaque is realized pricing. Zero Hash does not publish a fee card, take-rate schedule,
              minimum contract value, custody-fee schedule, or revenue-recognition policy on the retained product pages.
              The best public price clues are indirect: configurable spreads in the IBKR case study, transaction-based
              use cases across payroll and remittance case studies, and substitute pricing pressure from customer-facing
              brokers. That means the chapter can explain how activity likely turns into revenue, but not the realized
              economics of that conversion.
