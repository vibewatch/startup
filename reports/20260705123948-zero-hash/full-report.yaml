        title: Capital formation, scale evidence, and customer milestones
        blocks:
          - type: paragraph
            body: >-
              The financing path is straightforward through the September 2025 unicorn round and substantially murkier
              after that. The last closed event supported in fetched sources is the $104 million Series D-2 at a $1
              billion valuation led by Interactive Brokers, with participation from Morgan Stanley, Apollo-managed
              funds, SoFi, and other institutions, bringing cumulative funding to $275 million. That is the clean
              valuation anchor for this report. The 2026 CoinDesk follow-up is still important, but for a different
              reason: it preserves the adverse fact that Mastercard dropped its investment plans and that Zero Hash
              returned to the market pursuing new capital at more than a $1.5 billion valuation. That is directionally
              useful, but it is not the same as a closed round. Customer milestones reinforce why capital arrived in the
              first place. Public, Gusto, Virtu, and Interactive Brokers all map to different use cases—retail trading,
              global payroll, liquidity depth, and broker crypto execution—showing that Zero Hash’s scale is built on
              embedded infrastructure rather than one narrow product motion.
