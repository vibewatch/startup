            body: >-
              Security and regulation are not side claims in Zero Hash’s story; they are part of the product itself. The
              security page advertises ISO 27001 and 27002 alignment, GDPR compliance, and SOC 2 Type 1 and Type 2
              controls. The legal disclosures surface is also more substantial than a generic marketing footer, listing
              transfer-service disclosures, supported-asset disclosures, risk disclosures, segregation of client assets,
              and EU trading platform operating rules. On the regulatory side, the company claims a layered stack: New
