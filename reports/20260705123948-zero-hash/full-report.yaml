              public file still lacks is independent uptime or incident data and any quantified fraud or loss history.
              External risk notes from J.P. Morgan, Chainalysis, and Fireblocks matter because they describe the exact
              failure modes that can damage an infrastructure intermediary: opaque counterparties, weak market
