              - CR038
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Top risk = charter and compliance execution
            body: >-
              The licensing moat is real, but the premium narrative depends on adding federal-grade credentials without
              tripping over the burden of maintaining state and EU obligations simultaneously.
            calloutType: risk
            claimRefs:
              - CR005
              - CR008
              - CR040
              - CR041
          - type: callout
            title: Moat and burden come from the same place
            body: >-
              The best evidence for Zero Hash quality is the breadth of its regulated footprint and partner roster; the
              same evidence also explains why exam, conduct, and incident discipline are the first underwriting
              questions.
            calloutType: strength
            claimRefs:
              - CR002
              - CR007
              - CR011
              - CR026
          - type: callout
            title: Do not underwrite invisible reliability on trust alone
            body: >-
              Security certifications and uptime claims are useful, but the public file still lacks independent
              incident, fraud, or partner-concentration data needed for a higher-confidence risk discount.
            calloutType: assumption
            claimRefs:
