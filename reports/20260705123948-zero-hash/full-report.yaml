      - number: '6.3'
        title: Durability, repeat usage, and expansion economics
        blocks:
          - type: paragraph
            body: >-
              The reviewed public evidence supports a land-and-expand story much more than it supports a retention
              story. Expansion logic is intuitive and source-backed: a brokerage can start with trading, then add
              funding and onchain transfers; a payroll platform can move from an initial stablecoin payout feature into
              broader treasury and corridor expansion; and a remittance or funding platform can deepen usage as
              settlement becomes core to the product experience. Case-study outcomes from Public, Interactive Brokers,
              Republic, Remote, and MoneyLion all point to workflows that matter once live, which is encouraging for
              durability. But the underwriting gap is still material. There is no public gross retention, logo churn,
              standard contract length, minimum commitment disclosure, or cohort table in the fetched corpus. Even
              positive qualitative language around repeat usage—such as Félix saying faster transfers improved repeat
              usage—does not substitute for subscription or transaction-retention economics. In other words, Zero Hash’s
              public evidence proves that customers can adopt and expand with the product; it does not yet prove how
              sticky or economically durable those relationships are.
