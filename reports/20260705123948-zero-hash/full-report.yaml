  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform surface and product map
        blocks:
          - type: paragraph
            body: >-
              Zero Hash’s product story is coherent because the company is not selling an isolated crypto widget; it is
              merchandising one regulated platform that can trade, transact, and tokenize. The homepage and solution
              pages repeatedly tie those motions together under the same institutional stack, then branch the stack into
              distinct workflows such as trading, fiat conversion, global payouts, remittances, payins, custody, and
              tokenization. That matters for underwriting because it implies customers can land on one surface and later
              expand without re-platforming. The industry pages reinforce the same positioning from the buyer side:
              banks are told they can add trading, payments, and tokenization without rebuilding core systems,
              brokerages can add crypto and tokenized assets inside the same investing experience, and fintechs are told
              the stack can expand incrementally over time. The breadth looks real, not merely thematic, because each
              product page also describes step-by-step operating flows. The caution is that public packaging is much
              stronger than public commercial detail: Zero Hash does not disclose module-level attach rates, realized
              pricing, or which products are deepest in production versus newest in go-to-market emphasis.
