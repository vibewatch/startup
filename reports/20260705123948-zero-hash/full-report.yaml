      - number: '8.4'
        title: Recommendation and diligence path
        blocks:
          - type: paragraph
            body: >-
              The most defensible call today is track, medium confidence, and fair valuation stance. The closed $1.0
              billion mark looks well supported by the quality of the syndicate, the breadth of licensing, and the
              visible platform scale. The unconfirmed 2026 chatter above $1.5 billion is plausible but not yet
              underwritten. To move up from track, investors need evidence that the charter and Europe story translate
              into cleaner custody credentials, that flagship partner launches broaden rather than concentrate exposure,
              and that stablecoin growth carries healthy unit economics rather than only higher compliance burden. To
              move down, look for the opposite: stalled charter progress, Europe friction, customer concentration, or
              multiple compression relative to better-capitalized peers. This is therefore a price-sensitive company,
              not merely a high-quality company. Stronger fundamentals could justify a premium later, but the current
              public record still says pay respect to the last closed round until new evidence proves that a higher
              step-up is earned.
            claimRefs:
              - CV040
              - CV041
              - CV042
              - CV023
