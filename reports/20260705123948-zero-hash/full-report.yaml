            body: >-
              The quality of the named roster is clearly a strength, but it also creates concentration and
              partner-dependence questions. The company repeatedly highlights Public, Interactive Brokers, Stripe,
              Gusto, Franklin Templeton, and Morgan Stanley-linked brands, which is valuable signaling but could also
              mean a meaningful share of revenue sits in a small set of marquee relationships. The Virtu partnership
              shows that customer outcomes in trading products depend on external liquidity depth as well as Zero Hash’s
