      - number: '1.4'
        title: Regulatory stack, trust surfaces, and residual diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Zero Hash’s strongest differentiation claim is not raw product breadth; it is the depth of the regulatory
              stack wrapped around that product breadth. Official materials point to coverage across the United States
              and multiple non-U.S. jurisdictions, while specific milestones show the stack thickening rather than
              simply widening. The trust-company launch created a qualified-custody and retirement-account angle. MiCAR
              authorization moved the company into a harmonized EEA crypto framework. The EMI license then added
              payments legitimacy on top of MiCAR for European stablecoin flows. Finally, the OCC national trust bank
              application signals an attempt to simplify a state-by-state U.S. structure into a more federal posture.
              Public disclosure and complaints surfaces are also deeper than a generic startup footer, with dedicated
              risk, pricing, segregation, conflicts, and complaint channels. Still, the same evidence base that supports
              trust and regulatory breadth leaves major private-company questions unanswered: there is no audited
              revenue view, no public margin picture, no disclosed customer concentration, and no clean public
              reconciliation of all governance rights across entities.
