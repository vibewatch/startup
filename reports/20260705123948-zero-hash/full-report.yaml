  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: The decision path runs from closed-price evidence to moat, market conversion, and then to price discipline.
    data:
      nodes:
        - id: n1
          label: Closed round
          detail: $1.0B is the hard anchor
        - id: n2
          label: Moat quality
          detail: Licensing, trust, MiCAR, EMI
        - id: n3
          label: Market tailwind
          detail: Stablecoin adoption and client demand
        - id: n4
          label: Economics gap
          detail: Revenue and margin remain opaque
        - id: n5
          label: Recommendation
          detail: Track / fair / medium confidence
      edges:
        - from: n1
          to: n2
          label: anchors
        - from: n2
          to: n3
          label: supports
        - from: n3
          to: n4
          label: needs conversion
        - from: n4
          to: n5
          label: constrains
    approximationNotes: The flow prioritizes closed evidence and explicitly separates strategic upside from confirmed economics.
    claimRefs:
      - CV001
      - CV006
      - CV012
      - CV016
      - CV026
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      The largest valuation swing factors are charter progress, partner monetization, and economics disclosure rather
      than raw stablecoin TAM alone.
    data:
      items:
        - label: Closed-round anchor
          value: 10
          detail: Highest weighting because it is a priced event
        - label: Regulatory moat execution
          value: 8
          detail: Material upside if cleanly maintained
        - label: Client-quality conversion
          value: 8
          detail: Needs revenue proof from marquee logos
        - label: Economics disclosure
          value: 9
          detail: Missing today and therefore highly sensitive
        - label: Competitive compression
          value: 7
          detail: Rises if better-capitalized peers win the narrative
    approximationNotes: Values are directional sensitivity weights, not company-reported scores.
    claimRefs:
      - CV003
      - CV006
      - CV008
      - CV016
      - CV035
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      The public record supports a disciplined range around the $1.0B close, with upside contingent on new proof rather
      than on current chatter alone.
    data:
      items:
        - label: Bear
          low: 0.7
          mid: 0.9
          high: 1
          unit: USD bn
        - label: Base
          low: 1
          mid: 1.2
          high: 1.4
          unit: USD bn
        - label: Bull
          low: 1.4
          mid: 1.7
          high: 2
          unit: USD bn
        - label: Unconfirmed live signal
          low: 1.5
          mid: 1.75
          high: 2
          unit: USD bn
    approximationNotes: >-
      Ranges are scenario estimates derived from milestone evidence, not quoted market marks or formal valuation
      opinions.
    claimRefs:
      - CV001
      - CV003
      - CV023
      - CV024
      - CV025
      - CV038
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Zero Hash scores high on moat and client quality, middling on evidence quality and valuation support, and low on
      public economics transparency.
    data:
      items:
        - label: Regulatory moat
          value: 8
          unit: score
          detail: Broadest visible advantage in the file
        - label: Client quality
          value: 8
          unit: score
          detail: Exceptional institutional roster for a private vendor
        - label: Market tailwind
          value: 7
          unit: score
          detail: Stablecoin demand is real but not infinite
        - label: Economics visibility
          value: 3
          unit: score
          detail: Core public weakness
        - label: Price support today
          value: 6
          unit: score
          detail: Fair around the last close, not enough for a bold premium yet
    approximationNotes: Scores are investment-committee heuristics rather than management or market ratings.
    claimRefs:
      - CV006
      - CV008
      - CV012
      - CV016
      - CV023
      - CV026
