      - number: '3.2'
        title: Capability, pricing, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              The official pages show that most of the named competitors own a substantial slice of the same buyer
              workflow, but few own all of it. Fireblocks is broad across wallets, automation, stablecoin
              infrastructure, payments, and tokenization. BitGo is narrower but strong in regulated custody. Anchorage
              reaches further into issuance, reserves, and rewards economics. Circle is especially strong where native
              stablecoin issuance, multichain distribution, and compliance tooling matter more than brokerage UX. Zero
              Hash’s edge is that its public narrative ties brokerage execution, custody, stablecoin settlement, and
              tokenization together inside one regulated B2B2C platform.


              Pricing is the weakest public comparison dimension. Most enterprise infrastructure pages in the retained
              set are sales-led and omit realized price, take rate, minimums, and service mix. The cleanest visible
              price anchor is actually a substitute signal: Interactive Brokers publicly advertises very low retail
              crypto trading costs, demonstrating how distribution owners can compress end-user economics. Trust is much
              more observable than price. Chainalysis, Visa, and J.P. Morgan all reinforce that compliance, treasury,
              and exposure management are not optional in this category, which is why qualified custody, policy
              enforcement, and issuer-grade controls remain core buying criteria rather than check-box features.
