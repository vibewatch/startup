  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Founding chronology, identity, and current positioning
        blocks:
          - type: paragraph
            body: >-
              Zero Hash’s current official surfaces are explicit about one thing and notably fuzzy about another. They
              are explicit that the company wants to be read as the regulated infrastructure layer behind trading,
              stablecoin, and tokenization products for banks, brokerages, and fintechs rather than as a consumer-facing
              exchange. The homepage now packages that identity around three operating modules—trade, transact, and
              tokenize—and pairs it with 2026 scale language of $65B+ settled volume, 7M+ end customers, 100+ supported
              assets, 200 jurisdictions, and 99.99% uptime. What remains less clean is the chronology. Official pages
              consistently use 2017 as the inception marker, while the assignment brief for this report uses 2018 as the
              standalone-company founding milestone. The cleanest reconciliation is to treat 2017 as the Seed CX and
              platform-lineage inception date, and 2018 as the milestone for the standalone operating company that later
              scaled under the Zero Hash brand. Because no fetched incorporation record or corporate-history page fully
              bridges that split, the 2017 versus 2018 chronology should remain a diligence note rather than a hidden
              assumption.
