            title: Opaque revenue is the reason not to pay for the narrative
            body: >-
              Missing net revenue, gross margin, and concentration data are the main blockers to a stronger
              recommendation. Without them, upside scenarios stay hypothetical even if the strategic story sounds
              compelling.
            calloutType: risk
