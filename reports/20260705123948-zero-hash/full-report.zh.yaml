            body: >-
              收入未披露，因此正确的公开牵引视角是使用量，而不是 GAAP 产出。Zero Hash 称已结算超过 $65B，服务超过 7M 终端客户。2026
              年稳定币动能报告又给出一组密集的公司披露增长代理指标：活跃稳定币客户同比增长 146%、交易笔数增长 208%、美元交易量增长 690%、平均交易额增长 157%、活跃用户覆盖 106 个国家，2024 到
              2025 年入站 RFI 增长 5x。这些不是经审计财务数据，但强烈表明公司看到的是更频繁、更大额、地域分布更广的稳定币活动。


              客户案例进一步加深了这一图景。Interactive Brokers 用 12 周上线，随后报告交易增长 2,010%、2025 年 Q3 交易量 $216M、每位客户交易资产数增加
              30%，从开户到首次交易的时间从 59 天降至 15 天。MoneyLion、Republic、Remote、Gusto、Public、Stripe 和 Félix Pago
              把证据扩展到消费者交易、薪资、融资、付款和汇款。需要谨慎的是，这些数据点几乎都由公司提供。它们是有价值的投资判断代理指标，但不能误认为经审计单位经济性或利润率质量的干净证据。
