        - 服务费、按 AUC 收费或合同模式
        - 信托公司启动后支撑更强；定价未披露
        - 信托框架可能提高粘性，但收费模式未公开
        - 要求提供托管 AUC、费率区间和单客户合规成本
      - - 代币化和发行方支持
