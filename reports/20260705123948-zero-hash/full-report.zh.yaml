      - number: '1.4'
        title: 监管栈、信任触点与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Zero Hash
              最强的差异化主张不是单纯产品宽度，而是包在产品宽度外面的监管栈深度。官方材料指向美国和多个非美国司法辖区的覆盖，具体里程碑则显示这套栈在变厚，而不只是变宽。信托公司的推出带来了合格托管和退休账户角度。MiCAR
              授权把公司带入统一的 EEA 加密框架。随后 EMI 牌照又在 MiCAR 之上，为欧洲稳定币流增加支付合法性。最后，OCC
              全国信托银行申请表明公司试图把美国逐州结构简化为更联邦化的姿态。公开披露和投诉触点也比一般创业公司页脚更深，拥有专门的风险、定价、隔离、冲突和投诉渠道。尽管如此，支撑信任和监管宽度的同一证据基础，也留下了重大私人公司问题：没有经审计的收入视图，没有公开利润率图景，没有披露客户集中度，也没有把各实体治理权利完整调和的公开材料。
