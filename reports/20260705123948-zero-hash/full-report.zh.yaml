  - id: TR005
    title: 缓释措施与终止标准表
    columns:
      - 风险
      - 可监控触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 联邦特许风险
        - OCC 进展停滞或法律挑战升级
        - 连续多个季度没有明确正向里程碑，或出现正式禁令 / 拒批
        - 视为联邦托管上行空间的投资逻辑破裂；下调估值预期。
      - - 合规负担风险
        - 重大检查发现或整改积压
        - 反复出现或严重且未解决的监管发现
        - 暂缓提高确信度，直到证据显示问题已被圈住且可修复。
      - - 不可见的可靠性风险
        - 旗舰合作伙伴发生安全事件、宕机或结算中断
        - 任何伤害合作伙伴终端用户或冻结资金流的事件
        - 除非根因和控制措施充分披露，否则从跟踪转为回避。
      - - 合作伙伴集中风险
        - 旗舰上线延迟、客户流失或合作伙伴活跃度走弱
        - 错过上线窗口，或出现有意义的合作伙伴降级
        - 假设变现更慢，估值倍数支撑更弱。
      - - 经济性不透明风险
        - 下一步融资后，管理层仍不披露单位经济性
        - 不披露收入质量、利润率或集中度
        - 没有新证据时，不要按高于上一轮已交割估值的价格买入。
    notes: 终止标准刻意设计成可观察指标，方便投资团队在正式更新之间持续监控。
