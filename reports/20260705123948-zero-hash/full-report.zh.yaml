      - number: '8.5'
        title: 附录
        blocks:
          - type: callout
            title: 建议 = 跟踪 / 公允 / 中等置信度
            body: 公司质量证据强于价格证据。先锚定 $1.0B 已交割轮次，直到新的经济性或新条款证明更高估值台阶是挣来的。
            calloutType: recommendation
            claimRefs:
              - CV001
