      - number: '2.2'
        title: 规模测算视角：稳定币底层、采用代理指标与公开 TAM 的边界
        blocks:
          - type: paragraph
            body: >-
              即使边界收窄，公开规模测算仍比典型 SaaS TAM 工作受限。J.P. Morgan 给出了最清晰的外部底层：它估计当前法币支持的美元稳定币市场约为 $300B，未来几年有望走向 $500B 到
              $750B；如果采用和监管配合，乐观上行可达 $1T。Circle 的 USDC 经济报告补上交易规模证据：流通量同比增长超过 78%，USDC 历史总交易量超过 $18T，其中 2024 年底单月达到
              $1T。Zero Hash 自己的报告再给出平台特定采用信号：14 亿个可用稳定币账户、客户增长 146%、交易笔数增长 208%、美元交易量增长 690%，以及 2025 年覆盖 106
              个国家。这些数据点不能推导出精确的 Zero Hash TAM、SAM 或
              SOM，但它们确实说明相关市场正在成长，本质是受监管的资金流转和资产发行层，而不是纯叙事机会。缺失的一块，是能把这些采用代理指标转化为更紧可服务市场估算的产品线收入、定价和份额数据。
