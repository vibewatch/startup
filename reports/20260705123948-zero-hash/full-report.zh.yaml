  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 关键风险
    rows:
      - - 乐观
        - OCC 进展、欧洲变现和头部客户扩张按时落地
        - $1.5B-$2.0B 的估值可作为上一轮已交割估值上的里程碑溢价站住脚
        - 需要新的披露，而不只是新的新闻标题
        - 特许延迟、竞争或转化偏弱，都会打破乐观情景。
      - - 基准
        - 牌照护城河守住，客户质量仍强，经济性仍只部分可见
        - $1.0B-$1.4B 围绕上一轮已交割估值较合理，并给动量少量溢价
        - 最符合当前公开证据
        - 单位经济性缺失限制上行。
      - - 悲观
        - 上线滑坡、竞争压缩倍数，或监管放慢特许路径
        - <$1.0B 也合理，前提是护城河看起来成本高而不是可变现
        - 来源应是负面里程碑流，而不是正常波动
        - 旗舰客户表现不佳会加速下行。
      - - 战略收购视角
        - 战略买家看重牌照和客户名单，超过独立经济性
        - 可能出现溢价结果，但 Mastercard 先例说明并无保证
        - 提供有用的上行选择权，不是基准情景
        - 只当作上行选项，绝不能当作硬底。
    notes: 情景区间仅作方向性参考，因为公开资料缺少收入、利润率和清算优先权结构细节。
