      - number: '5.3'
        title: 信任、安全与监管栈
        blocks:
          - type: paragraph
            body: >-
              安全和监管不是 Zero Hash 故事里的附带主张；它们就是产品的一部分。安全页面宣传 ISO 27001 和 27002 对齐、GDPR 合规，以及 SOC 2 Type 1 和 Type 2
              控制。法律披露页面也比一般营销页脚更扎实，列出转账服务披露、支持资产披露、风险披露、客户资产隔离和欧盟交易平台运营规则。监管侧，公司声称拥有分层栈：DFS 登记显示其具备纽约牌照，欧洲由荷兰 AFM 的
              MiCAR 授权覆盖，2026 年 5 月 DNB 颁发的 EMI
              牌照又把这一姿态扩展到电子货币代币支付流。信托公司的推出尤其相关，因为它把这套栈推向合格托管和退休账户赋能。剩余问题是证据深度。这些都是重要可信度标记，但仍是顶层标记；严肃尽调仍需要审计报告、逐实体活动地图、资产隔离证明、保险细节和实际投诉解决统计。
