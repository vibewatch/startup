    title: 公司概况
    sections:
      - number: '1.1'
        title: 创立时间线、身份与当前定位
        blocks:
          - type: paragraph
            body: >-
              Zero Hash
              当前官方材料有一件事说得很清楚，另一件事则明显含糊。清楚的是，公司希望被理解为银行、券商和金融科技公司背后的受监管基础设施层，支撑交易、稳定币和代币化产品，而不是面向消费者的交易所。官网现在把这一身份包装在交易、转账和代币化三个运营模块下，并配上
              2026 年的规模口径：$65B+ 结算量、7M+ 终端客户、100+ 支持资产、200 个司法辖区和 99.99% 可用性。不够干净的是时间线。官方页面持续使用 2017 年作为创立标记，而本报告任务说明采用
              2018 年作为独立公司创立里程碑。最清晰的调和方式，是把 2017 年视为 Seed CX 和平台谱系的起点，把 2018 年视为后来在 Zero Hash
              品牌下扩张的独立运营公司里程碑。由于未抓取到能完全打通这一差异的注册记录或公司史页面，2017 与 2018 的时间线差异应保留为尽调备注，而不是隐藏假设。
