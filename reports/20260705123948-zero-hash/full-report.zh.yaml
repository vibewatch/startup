      - number: '4.3'
        title: 资本充足性与资产负债表缺口
        blocks:
          - type: paragraph
            body: >-
              轮次时间线归公司概况章节负责，但财务章节仍必须回答：公司是否看起来有足够资本执行下一阶段。最清晰的公开正面证据是 2025 年 9 月 D-2 轮：CoinDesk 和多篇后续报道称，Zero Hash 由
              Interactive Brokers 领投，以 $1B 估值融资 $104M，使披露累计融资达到 $275M。同一时期推出信托公司也重要，因为它把产品和监管边界扩展到合格托管、RIA
              和退休账户用例。这些事实共同支撑了机构可信度上升的叙事。


              但核心资产负债表问题仍无答案。保留下来的公开来源没有披露账上现金、月度烧钱、现金跑道、债务或契约限制。因此，2026 年 5 月 CoinDesk
              文章应谨慎解读：它是反向可选性背景，不是新资金已经到账的证据。据报道，Mastercard 退出了投资，Zero Hash 据称在寻求估值高于 $1.5B
              的新融资，但文章没有确认募资到账。因此，负责任的投资判断应是：2025 年改善了资本背景，而 2026 年仍未说明公司想要的是增量增长资本、战略灵活性，还是单纯刷新估值信号。
