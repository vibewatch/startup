  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界，以及本章真正测算的对象
        blocks:
          - type: paragraph
            body: >-
              测算 Zero Hash 市场规模，最干净的方法是先抵住诱惑，不把加密市场总市值当作代理指标。Zero Hash
              卖的不是对比特币价格的敞口；它卖的是受监管基础设施，让银行、券商、金融科技公司、商户和资管机构推出具体产品，而不必内部自建托管、流动性、合规或链编排。因此，相关市场是受监管的加密资产、稳定币和代币化基础设施支出。边界内包括面向券商和银行的交易赋能、用于付款、收款、资金管理和融资的稳定币资金流转、代币化发行和生命周期工具，以及让这些轨道可用的入金转换产品。边界外则包括投机代币市值、不依赖基础设施外包的消费者交易所收入，以及没有受监管金融工作流附着的通用区块链软件支出。这个更窄的边界让本章保持分析诚实：它把
              Zero Hash 放在受监管金融基础设施品类里的卖铲子供应商，而不是把它当成整个加密活动的索取权。
            claimRefs:
