      - number: '6.3'
        title: 耐久性、复用与扩张经济性
        blocks:
          - type: paragraph
            body: >-
              已审阅的公开证据更支持一个落地后扩张的故事，而不是留存故事。扩张逻辑直观，也有来源支撑：券商可以从交易开始，再加入融资和链上转账；薪资平台可以从初始稳定币付款功能扩展到更宽的资金管理和走廊扩张；汇款或融资平台可以在结算成为产品体验核心后加深使用。Public、Interactive
              Brokers、Republic、Remote 和 MoneyLion 的案例结果都指向一旦上线就很关键的工作流，这对耐久性是正面信号。但投资判断缺口仍然很大。抓取语料中没有公开总留存率、客户流失、
              标准合同期限、最低承诺披露或队列表。即便关于重复使用的正面定性语言——例如 Félix 称更快转账提升了复用——也不能替代订阅或交易留存经济性。换句话说，Zero Hash
              的公开证据证明客户可以采用并随产品扩张；但还没有证明这些关系有多粘、经济上有多耐久。
