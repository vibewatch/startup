        - 实施费叠加持续服务经济性
        - 产品能力可见，但实际收入贡献未披露
        - 有战略价值潜力，但当前变现贡献未知
        - 要求提供管线、上线资产和代币化收入贡献
    notes: 公开资料能看见变现路径，但看不见各路径中的收入分成、抽成率或会计处理。
