  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与方案类型
        blocks:
          - type: paragraph
            body: >-
              比较 Zero Hash 时，应看方案类型，而不只是一个直接对手。公司横跨券商执行基础设施、稳定币结算、托管和代币化，因此现实买方替代方案包括 Fireblocks 这样的全栈基础设施供应商、BitGo
              这样的托管优先专家、Anchorage 这样的银行导向平台、Circle 这样的发行方轨道，以及 Coinbase、Interactive Brokers、Public
              这类分发所有者；它们可以保留客户关系，同时外包部分基础设施。大型机构内部自建也仍然可信，因为买方可以组合 Circle 或 Anchorage 式发行方或储备轨道、Fireblocks 或 BitGo
              式托管和编排，以及自有前端。


              这种宽度利弊共存。它让 Zero Hash
              的价值主张比纯托管或稳定币供应商更宽，但也让公司暴露在更多替代路径下。因此，最强的竞争视角不是“还有谁做完全一样的事？”而是“银行、券商或金融科技公司还能用什么方式把受监管数字资产产品交付给自己的用户？”在这个更宽视角下，Fireblocks、BitGo、Anchorage、Circle、Coinbase
              邻近分发、以及内部自建，都比一对一功能模仿更重要。
