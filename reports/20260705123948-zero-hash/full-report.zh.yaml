  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与分层结构
        blocks:
          - type: paragraph
            body: >-
              可见的 Zero Hash 客户基础在工作流上很宽，即使公司没有公布完整生产客户名单。最可信的模式是 B2B2C 基础设施卖给平台，而不是直接卖给终端消费者。Public 和 Interactive
              Brokers 等券商用 Zero Hash 向自己的客户提供加密交易、融资和资产流转功能。Gusto 和 Remote 等薪资与 HR 平台用它通过稳定币轨道发放承包商款项。Republic 用它做 24/7
              投资入金，Félix Pago 用它处理汇款流，Kalshi
              用它处理事件驱动账户入金。这个宽度重要，因为买方往往是产品、资金或运营团队，用户是平台底层消费者或承包商，付款方则是平台自身。因此，客户名单横跨零售投资、薪资、支付、全球
              HR、汇款和另类投资融资。本章关键提示是：平台宽度比商业组合更容易证明。公开材料显示谁在使用 Zero Hash，也大致显示原因，但没有显示收入如何分布在这些细分中。
