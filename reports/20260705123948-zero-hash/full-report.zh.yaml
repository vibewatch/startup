      - number: '8.3'
        title: 压住倍数的因素
        blocks:
          - type: paragraph
            body: >-
              需要保持纪律，并不是因为业务看起来弱，而是证据仍然偏科。客户质量、市场动能、产品宽度和牌照深度都看得见；
              按产品拆的净收入、按实体拆的毛利率、合作伙伴集中度，以及支撑全球合规版图的成本都看不见。因此估值只能靠里程碑和战略可比对象来框， 不能套一个干净的收入倍数。Fireblocks
              证明，基础设施资产可以拿到高溢价私有市场价格。Anchorage 和 BitGo 证明，在部分赛道，托管级对手已经拿出更强或更成熟的资质组合。Coinbase 证明，广泛加密分发仍是活的竞争基准。
              Interactive Brokers 证明旗舰客户群够认真，但也提醒投资人，成熟合作伙伴会随时间把更多技术栈内化。 正确结论不是 Zero Hash
              被高估，而是只有当转化、利润率和集中度证据到位，上行空间才应分阶段计入。
