              融资路径到 2025 年 9 月独角兽轮为止很清楚，之后明显更模糊。抓取来源支持的最后一次已关闭事件，是 Interactive Brokers 领投的 $104M D-2 轮，估值 $1B，Morgan
              Stanley、Apollo 管理基金、SoFi 等机构参投，使累计融资达到 $275M。这是本报告最干净的估值锚。2026 年 CoinDesk 后续报道仍然重要，但理由不同：它保留了 Mastercard
              放弃投资计划、Zero Hash 又以超过 $1.5B 估值回到市场融资这一反向事实。这个信息有方向性价值，但不等同于已关闭轮次。客户里程碑解释了资本为什么先到位。Public、Gusto、Virtu 和
              Interactive Brokers 分别映射到零售交易、全球薪资、流动性深度和券商加密执行，说明 Zero Hash 的规模来自嵌入式基础设施，而不是单一狭窄产品动作。
