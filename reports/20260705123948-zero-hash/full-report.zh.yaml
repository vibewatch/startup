  - id: TV005
    title: 投资逻辑破裂与终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 特许或欧洲里程碑滑坡
        - 实质性延迟、拒批或限制性条件
        - 缩小护城河，削弱溢价倍数支撑
        - 不要按高于最近已完成融资锚点的价格支付。
      - - 旗舰合作伙伴不及预期
        - 重点客户上线延迟、流失，或使用量低于预期
        - 削弱「客户质量高」的多头逻辑
        - 在集中度更清晰前，从跟踪转向回避。
      - - 竞争挤压
        - 托管资质更强或分发更广的同行夺走品类叙事
        - 把 Zero Hash 拉回「众多优质供应商之一」
        - 下调情景区间，并要求更严格的定价纪律。
      - - 下一轮融资后经济性仍不透明
        - 收入、利润率或集中度仍未披露
        - 基本面无法支撑溢价
        - 只把叙事上行视作投机性机会。
      - - 重大合规问题
        - 出现实质性检查发现或运营事故
        - 把护城河变成负担，并损害合作伙伴信任
        - 立即按下行情景重新测算。
    notes: 这些触发点设计成可在两次刷新之间监测，并刻意把里程碑证据放在抽象情绪之前。
