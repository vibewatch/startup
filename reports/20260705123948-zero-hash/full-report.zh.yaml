companyProfile:
  summary: >-
    Zero Hash 是一家总部位于芝加哥的 B2B 加密资产、稳定币和代币化基础设施平台，帮助金融科技公司、券商、银行和资管机构通过 API
    推出数字资产产品，而不是自建托管、流动性、结算和合规栈。公开材料显示，公司服务的标杆伙伴包括 Interactive Brokers、Public、Gusto、Stripe 和 Franklin
