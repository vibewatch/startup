          - type: callout
            title: 监管护城河叠加客户质量，是多头核心
            body: 在 B2B2C 稳定币技术栈中，Zero Hash 公开可见的牌照宽度与企业客户标识组合，可信度居前。 因此 Zero Hash 应留在动态观察名单，而不是被丢进淘汰堆。
            calloutType: strength
            claimRefs:
              - CV006
