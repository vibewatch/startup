    summary: 运营流程从客户平台请求开始，经过 zerohash 控制的兑换和合规层，最后完成链上或法币结算。
    data:
      nodes:
        - id: n1
          label: 客户应用请求
          detail: 终端用户在合作伙伴平台内发起交易、入金、付款、支付或代币化动作。
        - id: n2
          label: API 受理
          detail: zerohash 通过集成层接收请求，并识别所需产品工作流。
        - id: n3
          label: 合规检查
          detail: 平台会执行钱包筛查、交易监控、Travel Rule 逻辑和司法辖区规则。
        - id: n4
          label: 流动性 / 托管编排
          detail: 平台路由执行、授权钱包划转，或准备发行和治理步骤。
        - id: n5
          label: 链上或法币结算
          detail: 交易最终性、稳定币转账、商户入账或本地出款分发完成。
        - id: n6
          label: 报告与监控
          detail: 交易完成后，审计日志、对账和合规报告还会继续。
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
    claimRefs:
      - CE006
      - CE010
      - CE012
      - CE014
      - CE015
      - CE016
  - id: FE003
    title: 关键依赖图
    type: dag
    layout: standard
    summary: 平台对受监管实体和外部交易对手的依赖，不亚于对产品代码的依赖。
    data:
      nodes:
        - id: d1
          label: NYDFS / 州级牌照
        - id: d2
          label: AFM / DNB 欧洲许可
        - id: d3
          label: 银行与出款伙伴
        - id: d4
          label: 做市商和流动性提供方
        - id: d5
          label: 区块链和智能合约环境
        - id: d6
          label: Travel Rule / 监控控制
        - id: d7
          label: zerohash 编排层
        - id: d8
          label: 面向客户的工作流
      edges:
        - from: d1
          to: d7
        - from: d2
          to: d7
        - from: d3
          to: d7
        - from: d4
          to: d7
        - from: d5
          to: d7
        - from: d6
          to: d7
        - from: d7
          to: d8
    claimRefs:
      - CE015
      - CE016
      - CE026
      - CE028
      - CE030
      - CE041
  - id: FE004
    title: 产品成熟度 / 能力图
    type: matrix
    layout: standard
    summary: 公开证据显示，核心交易和支付模块商业化较强；内部开发者工具和代币化控制细节的外部可见度更薄。
    data:
      columns:
        - 商业化封装
        - 监管就绪度
        - 公开证据深度
        - 剩余尽调风险
      rows:
        - label: 交易基础设施
          values:
            - label: 高
              tone: positive
            - label: 高
              tone: positive
            - label: 高
              tone: positive
            - label: 中
              tone: neutral
        - label: 托管
          values:
            - label: 高
              tone: positive
            - label: 高
              tone: positive
            - label: 中
              tone: neutral
            - label: 中高
              tone: negative
        - label: 稳定币出款 / 汇款
          values:
            - label: 高
              tone: positive
            - label: 高
              tone: positive
            - label: 中
              tone: neutral
            - label: 中
              tone: neutral
        - label: 入金
          values:
            - label: 中
              tone: neutral
            - label: 高
              tone: positive
            - label: 中
              tone: neutral
            - label: 中高
              tone: negative
        - label: 代币化引擎
          values:
            - label: 中
              tone: neutral
            - label: 高
              tone: positive
            - label: 中
              tone: neutral
            - label: 高
              tone: negative
        - label: 公开开发者界面
          values:
            - label: 低
              tone: negative
            - label: n/a
              tone: neutral
            - label: 低
              tone: negative
            - label: 高
              tone: negative
    approximationNotes: 评分反映已审阅公开证据的深度，不代表内部工程质量，也不代表披露口径之外的正常运行时间遥测。
    claimRefs:
      - CE005
      - CE019
      - CE020
      - CE023
      - CE034
      - CE035
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 平台需要更快的资金流转或加密功能时，Zero Hash 通常切入；第一个受监管工作流上线后，再向更多场景扩张。
    data:
      nodes:
        - id: j1
          label: 问题触发
          detail: 平台想要 24/7 交易、更快的跨境结算，或实时账户入金。
        - id: j2
          label: 集成评估
          detail: 客户会比较自建内部通道与嵌入 Zero Hash 基础设施。
        - id: j3
          label: 初次上线
          detail: 第一个工作流落在交易、入金、出款、薪资、汇款或链上转账。
        - id: j4
          label: 运营使用
          detail: 终端用户实时依赖产品，通常需要 24/7 可用性和链上结算。
        - id: j5
          label: 工作流扩张
          detail: 客户增加更多代币、订单类型、走廊，或相邻的入金和转账功能。
        - id: j6
          label: 耐久性测试
          detail: 续约经济性取决于交易量、重复使用和商业条款；这些大多未公开。
    approximationNotes: 阶段来自案例研究叙事推断，因为已审阅公开来源没有发布正式的 Zero Hash 销售漏斗或客户成功地图。
    claimRefs:
      - CU001
      - CU004
      - CU006
      - CU013
      - CU016
      - CU040
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: 公开证据支持一条顺序采用路径：先评估，再上线第一个工作流，最后绑定更广的产品；但证据不支持逐阶段转化率。
    data:
      nodes:
        - id: f1
          label: 战略需求
          detail: 经纪、薪资或支付平台需要受监管的加密或稳定币能力。
        - id: f2
          label: 实施选择
          detail: 客户选择 Zero Hash，是为了避免自己搭建基础设施。
        - id: f3
          label: 首个工作流上线
          detail: 例子包括 IBKR 交易、Gusto 薪资、Public 加密和 Remote 出款。
        - id: f4
          label: 活跃使用
          detail: 案例研究结果显示，交易、入金、出款和交易量已经跑起来。
        - id: f5
          label: 扩张
          detail: 客户增加更多订单类型、更多代币、更多走廊，或相邻的入金功能。
        - id: f6
          label: 留存未知
          detail: 公开来源不披露 GRR、logo 流失或合同条款。
      edges:
        - from: f1
          to: f2
          label: 自建与购买决策
        - from: f2
          to: f3
          label: 集成
        - from: f3
          to: f4
          label: 生产上线
        - from: f4
          to: f5
          label: 追加工作流
        - from: f5
          to: f6
          label: 续约经济性
    approximationNotes: 这里用流程图而不是数字漏斗，因为公开语料有结果和上线案例，却没有阶段之间的转化百分比。
    claimRefs:
      - CU007
      - CU013
      - CU020
      - CU026
      - CU040
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: standard
    summary: 最强的具名客户证据，会同时给出工作流细节，并带有客户侧佐证或量化结果；留存可见度几乎处处偏弱。
    data:
      columns:
        - 工作流具体度
        - 独立佐证
        - 留存可见度
      rows:
        - label: Public
          values:
