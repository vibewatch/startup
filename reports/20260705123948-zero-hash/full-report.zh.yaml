      - number: '1.2'
        title: 管理层梯队与治理结构
        blocks:
          - type: paragraph
            body: >-
              创始人中心性仍然很高，但公开可见的运营班底已不只是一个魅力型创始人故事。Edward Woodford 仍是从创立到当前规模的关键叙事桥梁，他此前的衍生品交易所背景，也解释了为什么 Zero Hash
              卖的是受监管基础设施，而不是纯消费者加密体验。新闻室还披露了一个更职能化的运营团队，覆盖法务、业务拓展、商业执行、财务和安全。这个信息重要，因为公司现在卖给机构客户；这些客户关心风险运营和监管设计，程度不亚于产品速度。治理在
              2025 年也更清晰：Zero Hash 公开为 LLC
              董事会、流动性服务董事会和信托公司董事会分别增加董事。即便如此，公开图景仍不完整。董事披露按实体拆分，并不是一份简单的合并董事会名单；抓取到的公开材料也没有暴露控制权、观察员权利或完整治理图。投资者应把这些具名董事加入视为真实的成熟度信号，但不能替代尽调中查看完整法律实体结构和董事会资料包。
