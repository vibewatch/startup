        title: 收入模型与定价可见度
        blocks:
          - type: paragraph
            body: >-
              公开证据让 Zero Hash
              的收入机制可读，即使公司没有披露收入本身。平台显然不是消费者券商。官方页面和客户案例把它定位为卖给银行、券商、金融科技公司、薪资平台、汇款服务商和投资平台的基础设施。这些来源显示，变现机会横跨券商执行、托管、稳定币融资和付款、汇款、支付收单和代币化。Interactive
              Brokers 交易案例尤其有用，因为它明确提到可按资产配置点差，至少确认了一条与交易活动绑定的变现路径，而不是纯订阅席位。


              不透明的是实际定价。Zero Hash 没有在保留的产品页面上公布费率卡、抽成率表、最低合同额、托管费表或收入确认政策。最好的公开价格线索是间接的：IBKR
