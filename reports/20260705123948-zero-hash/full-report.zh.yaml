        - 若嵌入核心账户入金流程，看起来粘性强
        - 要求提供附加率、活跃客户和入金利润率经济性
      - - 汇款和支付受理
        - 使用稳定币和法币兑换的跨境汇款或受理流程
        - 单笔交易费或价差
        - 可从 Félix Pago 和 transact 相关资料看到
        - 交易量可能很大，但各走廊经济性和 FX 转嫁机制未披露
        - 要求提供各走廊盈利能力和合作伙伴集中度
      - - 合格托管和信托服务
