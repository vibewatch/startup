  - id: TV006
    title: 最终尽调追问表
    columns:
      - 议题
      - 缺失证据
      - 重要性
      - 负责方 / 尽调路径
    rows:
      - - 按产品划分的净收入
        - 交易、Transact、托管和代币化收入拆分
        - 需要确认哪根支柱真正驱动企业价值
        - 索取管理层 KPI 包和经审计的收入分部。
      - - 毛利率与损失结构
        - 按实体披露毛利率、欺诈损失、拒付和预垫资金需求
        - 区分软件式经济性和受监管资产负债表拖累
        - 按法律实体索取财务和风险材料。
      - - 客户集中度
        - 头部客户收入占比和续约历史
        - 客户名单很强，但集中度仍可能主导估值
        - 索取前 10 大客户和分群分析。
      - - 2026 年融资结构
        - 条款、优先权、老股转让，以及任何新一轮的领投方
        - 如果结构很重，名义估值更高也可能偏弱
        - 在决定价格前获取资料室或股权结构表更新。
      - - 监管发现
        - 未结检查事项、整改账龄和特许牌照审查状态
        - 护城河只有干净且可持续，才配得上溢价
        - 索取合规仪表盘和监管往来摘要。
    notes: 这些追问是从叙事支撑的跟踪判断，推进到价格支撑的投资决策所需的最低集合。
