            body: >-
              估值章节应从最近一笔已交割事实出发，而不是追着最响的叙事跑。Zero Hash 的硬锚，是 2025 年 9 月 D-2 轮：以 $1.0B 估值融资 $104M，机构投资方阵容显著强，证据扎实。2026
              年的传言是另一回事。 CoinDesk 报道融资洽谈超过 $1.5B，也提到 Mastercard 的战略兴趣，但两者都不是已交割交易。严肃买方和投资人正在接触这项资产，
              因此信号有方向意义；但信号替代不了一轮已定价融资。区分两者很关键，因为文件其余部分在经济性上仍然不透明。 公开材料更能证明规模、牌照和客户质量，远不能证明抽佣率、毛利率、留存或盈利能力。证据错配要求估值纪律。
              公司也许比上一轮已交割估值更值钱，但要证明到底高出多少，证据仍然缺失。
