          - type: callout
            title: 收入不透明，是不能为叙事付钱的理由
            body: 净收入、毛利率和集中度数据缺失，是更强建议的主要障碍。数据缺口不补上，即便战略故事听起来有吸引力，上行情景仍是假设。
            calloutType: risk
            claimRefs:
