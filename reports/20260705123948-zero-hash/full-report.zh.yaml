      - number: '8.4'
        title: 建议与尽调路径
        blocks:
          - type: paragraph
            body: >-
              今天最可辩护的判断是：跟踪、中等置信度、估值公允。已交割的 $1.0B 估值，有投资方质量、牌照宽度和可见平台规模支撑。 未确认的 2026 年 $1.5B+
              传言有可信度，但还不能纳入定价承保。要从跟踪上调，投资人需要看到证据： 信托特许和欧洲叙事能转成更干净的托管资质，旗舰伙伴上线是在拓宽敞口而不是加重集中度，稳定币增长带来健康单位经济而不只是更高合规负担。
              下调则看反面：特许进展停滞、欧洲落地摩擦、客户集中，或相对资金更厚的同业出现倍数压缩。因此，Zero Hash 对价格敏感，
              不只是质量高。更强的基本面以后可以支撑溢价，但当前公开记录仍要求尊重上一轮已交割定价，直到新证据证明更高台阶是挣来的。
