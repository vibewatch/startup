    approximationNotes: 矩阵评分衡量证据质量和留存可见度，不衡量该客户关系的绝对战略价值。
    claimRefs:
      - CU004
      - CU005
      - CU012
      - CU014
      - CU038
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 剩余风险的严重度集中在特许牌照执行、伙伴依赖和不可见的运营可靠性上。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余判断
      rows:
        - label: 待批 OCC 特许牌照
          values:
            - 中
            - 很高
            - 低至中
            - 首要风险
        - label: 州级和 EU 合规栈
          values:
            - 高
            - 高
            - 中
            - 持续负担
        - label: 安全 / 结算失败
          values:
            - 中
            - 很高
            - 中
            - 二元下行
        - label: 伙伴集中
          values:
            - 中
            - 高
            - 低至中
            - 叙事敏感
        - label: 经济性不透明
          values:
            - 高
            - 高
            - 低
            - 关键尽调卡点
    approximationNotes: 矩阵压缩的是有证据支撑的判断，不是公司披露的评分。
    claimRefs:
      - CR005
      - CR008
      - CR011
      - CR015
      - CR036
      - CR040
  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 多数下行路径会通过伙伴信任、上线节奏，以及投资者给监管资质的溢价传导。
    data:
      nodes:
        - id: n1
          label: 监管事件
          detail: 特许牌照延误、检查发现或整改
        - id: n2
          label: 运营压力
          detail: 监控、欺诈、托管或资产政策负荷
        - id: n3
          label: 伙伴信任
          detail: 上线节奏、推出信心、切换成本
        - id: n4
          label: 收入转化
          detail: RFIs、使用量和企业变现
        - id: n5
          label: 估值支撑
          detail: 叙事溢价与证据支撑倍数
      edges:
        - from: n1
          to: n3
          label: 约束
        - from: n2
          to: n3
          label: 侵蚀
        - from: n3
          to: n4
          label: 驱动
        - from: n4
          to: n5
          label: 支撑
        - from: n1
          to: n5
          label: 重定价
    approximationNotes: 这张图是方向性的，并有意省略实际伙伴集中度等未知内部变量。
    claimRefs:
      - CR015
      - CR016
      - CR017
      - CR025
      - CR036
      - CR039
  - id: FR003
    title: 依赖图
    type: dag
    layout: standard
    summary: Zero Hash 位于监管机构、流动性提供方和品牌化企业伙伴之间，因此故障可能同时从多个侧面打来。
    data:
      nodes:
        - id: n1
          label: OCC / 州级 / EU 监管机构
          detail: 牌照和经营行为监管
        - id: n2
          label: Zero Hash 平台
          detail: 交易、转账、托管、代币化
        - id: n3
          label: 流动性提供方
          detail: Virtu 和其他做市商
        - id: n4
          label: 机构客户
          detail: IBKR、Public、Stripe 及同类客户
        - id: n5
          label: 终端用户
          detail: 零售和企业支付用户
        - id: n6
          label: 稳定币通道
          detail: 跨境和资金管理流
      edges:
        - from: n1
          to: n2
          label: 授权
        - from: n3
          to: n2
          label: 定价
        - from: n2
          to: n4
          label: 支撑
        - from: n4
          to: n5
          label: 品牌化
        - from: n2
          to: n6
          label: 路由
        - from: n6
          to: n4
          label: 启用
    approximationNotes: 这张图呈现的是依赖结构，不是法律实体图。
    claimRefs:
      - CR022
      - CR025
      - CR028
      - CR029
      - CR031
      - CR032
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 决策路径从已成交价格证据出发，依次看护城河、市场转化，再看价格纪律。
    data:
      nodes:
        - id: n1
          label: 已成交轮次
          detail: $1.0B 是硬锚点
        - id: n2
          label: 护城河质量
          detail: 牌照、信任、MiCAR、EMI
        - id: n3
          label: 市场顺风
          detail: 稳定币采用和客户需求
        - id: n4
          label: 经济性缺口
          detail: 收入和利润率仍不透明
        - id: n5
          label: 建议
          detail: 跟踪 / 合理 / 中等信心
      edges:
        - from: n1
          to: n2
          label: 锚定
        - from: n2
          to: n3
          label: 支撑
        - from: n3
          to: n4
          label: 需要转化
        - from: n4
          to: n5
          label: 约束
    approximationNotes: 该流程优先看已成交证据，并明确拆分战略上行与已确认经济性。
    claimRefs:
      - CV001
      - CV006
      - CV012
      - CV016
      - CV026
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 估值摆动最大的因素是特许牌照进展、伙伴变现和经济性披露，而不只是稳定币 TAM 本身。
    data:
      items:
        - label: 已成交轮次锚点
          value: 10
          detail: 权重最高，因为它是已定价事件
        - label: 监管护城河执行
          value: 8
          detail: 若能干净守住，上行空间可观
        - label: 客户质量转化
          value: 8
          detail: 需要头部客户给出收入证据
        - label: 经济性披露
          value: 9
          detail: 目前缺位，因此高度敏感
        - label: 竞争压缩
          value: 7
          detail: 资本更厚的同业若赢下叙事，压力会上升
    approximationNotes: 数值是方向性的敏感性权重，不是公司披露评分。
    claimRefs:
      - CV003
      - CV006
      - CV008
      - CV016
      - CV035
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开记录支持围绕 $1.0B 成交价划定纪律性区间；上行取决于新证据，而不是当前市场传言本身。
    data:
      items:
        - label: 悲观
          low: 0.7
          mid: 0.9
          high: 1
          unit: USD bn
        - label: 基准
          low: 1
          mid: 1.2
          high: 1.4
          unit: USD bn
        - label: 乐观
          low: 1.4
          mid: 1.7
          high: 2
          unit: USD bn
        - label: 未确认的实时信号
          low: 1.5
          mid: 1.75
          high: 2
          unit: USD bn
    approximationNotes: 区间是基于里程碑证据推导的情景估计，不是市场报价或正式估值意见。
    claimRefs:
      - CV001
      - CV003
      - CV023
      - CV024
      - CV025
      - CV038
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Zero Hash 在护城河和客户质量上得分高，证据质量和估值支撑居中，公开经济性透明度低。
    data:
      items:
        - label: 监管护城河
          value: 8
          unit: score
          detail: 可见优势中最宽的一项
        - label: 客户质量
          value: 8
          unit: score
          detail: 作为私人供应商，机构客户名单很强
        - label: 市场顺风
          value: 7
          unit: score
          detail: 稳定币需求真实，但不是无限
        - label: 经济性可见度
          value: 3
          unit: score
          detail: 公开信息里的核心短板
        - label: 当下价格支撑
          value: 6
          unit: score
          detail: 围绕上一轮成交价算合理，暂不足以支撑激进溢价
    approximationNotes: 评分是投资委员会的启发式判断，不是管理层或市场评级。
    claimRefs:
      - CV006
      - CV008
      - CV012
      - CV016
      - CV023
      - CV026
