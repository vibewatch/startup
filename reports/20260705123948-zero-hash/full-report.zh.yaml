        - 上行空间存在，但下行可能从合规或集中度传导过来。
      - - 估值立场
        - 合理
        - 上一轮已交割估值 = $1.0B；2026 年传闻仍未证实
        - 小幅溢价需要更强证据才能承受。
      - - 决策含义
        - 盯住入场价格和里程碑
        - 特许、欧洲、合作伙伴变现和经济性披露
        - 只有这些变量一起改善，才升级推进。
