  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台边界与产品图谱
        blocks:
          - type: paragraph
            body: >-
              Zero Hash
              的产品故事是连贯的，因为公司卖的不是孤立加密小组件，而是一个能交易、转账和代币化的受监管平台。官网和解决方案页面反复把这些动作捆在同一机构栈下，再把栈分叉到不同工作流，例如交易、法币转换、全球付款、汇款、收款、托管和代币化。这对投资判断很重要，因为它意味着客户可以先落在一个界面上，之后无需重构平台就能扩展。行业页面从买方侧强化了同样定位：银行被告知可以在不重建核心系统的情况下加入交易、支付和代币化；券商可以在同一投资体验中加入加密资产和代币化资产；金融科技公司则被告知，这套栈可以随时间渐进扩展。宽度看起来真实，而不只是主题包装，因为每个产品页面还描述了逐步运营流程。需要谨慎的是，公开包装明显强于公开商业细节：Zero
              Hash 没有披露模块级附加率、实际定价，也没有说明哪些产品在生产中最深，哪些只是最新市场推广重点。
