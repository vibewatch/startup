- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Charter or Europe milestone slippage
    - Meaningful delay, denial, or restrictive conditions
    - Shrinks the moat and weakens premium multiple support
    - Do not pay above the last closed anchor.
  - - Flagship partner disappointment
    - Rollout delay, churn, or lower-than-expected usage at major accounts
    - Undercuts the customer-quality bull case
    - Move from track toward avoid until concentration is clearer.
  - - Competitive compression
    - Peers with better custody credentials or broader distribution win the category narrative
    - Reframes Zero Hash as one good vendor among many
    - Lower scenario range and require more pricing discipline.
  - - Economics remain hidden after next financing step
    - Still no revenue, margin, or concentration disclosure
    - Makes it impossible to justify a premium on fundamentals
    - Treat narrative upside as speculative only.
  - - Material compliance issue
    - Meaningful exam finding or operating incident
    - Turns the moat into a burden and damages partner trust
    - Re-underwrite from downside case immediately.
  notes: Triggers are designed to be monitorable between refreshes and intentionally emphasize milestone evidence over abstract
    sentiment.
  claimRefs:
  - CV024
  - CV025
  - CV035
  - CV040
  - CV041
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Net revenue by product
    - Trading, transact, custody, and tokenization revenue split
    - Need to know which pillar truly drives enterprise value
    - Request management KPI pack and audited revenue segmentation.
  - - Gross margin and loss profile
    - Gross margin, fraud losses, chargebacks, and prefunding needs by entity
    - Distinguishes software-like economics from regulated balance-sheet drag
    - Request finance and risk materials by legal entity.
  - - Customer concentration
    - Top-customer revenue share and renewal history
    - The logo set is excellent, but concentration can still dominate valuation
    - Request top-10 customer and cohort analysis.
  - - 2026 financing structure
    - Terms, preferences, secondaries, and who is leading any new round
    - A higher headline valuation can still be weak if structure is heavy
    - Obtain data-room or cap-table update before any price decision.
  - - Regulatory findings
    - Open exam items, remediation aging, and charter review status
    - The moat only deserves a premium if it is clean and durable
    - Request compliance dashboard and regulator correspondence summary.
  notes: These asks are the minimum set needed to move from a narrative-backed track call to a price-backed investment decision.
