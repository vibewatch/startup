- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Public evidence
  - What would change the view
  rows:
  - - Regulatory moat
    - 51 U.S. jurisdictions, trust company, MiCAR, EMI
    - Prove these credentials translate into superior win rates or margins.
  - - Client quality
    - IBKR, Public, Stripe, Franklin Templeton and other marquee names
    - Show low churn and expanding wallet share inside the roster.
  - - Stablecoin tailwind
    - Circle, J.P. Morgan, Visa, and Zero Hash all describe real growth
    - Disclose monetization quality rather than only volume growth.
  - - 'Anti-thesis: opaque economics'
    - No public ARR, margin, or concentration data
    - Management discloses durable economics by product or entity.
  - - 'Anti-thesis: competition'
    - Fireblocks, Anchorage, BitGo, Coinbase remain credible alternatives
    - Evidence shows switching costs and bundle depth are truly differentiating.
  notes: Bull points rely on multiple independent and official sources; anti-thesis points mostly reflect what the public
    record still cannot prove.
