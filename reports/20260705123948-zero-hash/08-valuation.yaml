- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Probability signal
  - Key risks
  rows:
  - - Bull
    - OCC progress, Europe monetization, and marquee-client expansions land on time
    - $1.5B-$2.0B becomes defendable as a milestone premium over the last close
    - Needs new disclosure, not just new headlines
    - Charter delay, competition, or weak conversion would break the case.
  - - Base
    - Licensing moat holds, client quality remains strong, economics stay only partly visible
    - $1.0B-$1.4B feels fair around the last closed round with some premium for momentum
    - Best fit for current public evidence
    - Upside capped by missing unit economics.
  - - Bear
    - Rollouts slip, competition compresses multiples, or regulators slow the charter path
    - <$1.0B is plausible if the moat looks expensive rather than monetizable
    - Would follow negative milestone flow, not normal variance
    - Downside accelerates if flagship customers underperform.
  - - Strategic-takeout lens
    - A strategic buyer values licensing and client roster more than standalone economics
    - A premium outcome is possible, but Mastercard precedent shows nothing is guaranteed
    - Useful optionality, not base case
    - Treat as upside-only, never as hard floor.
  notes: Scenario ranges are directional because the public file lacks revenue, margin, and preference-stack detail.
