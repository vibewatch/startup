  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: product-level economics
    missingEvidence: ARR or net revenue by pillar, gross margin by entity, and any evidence of profitability or burn discipline.
    whyItMatters: Without economics disclosure, the public record supports company quality better than valuation precision.
    diligencePath: Request finance pack with product-level revenue, margin, and loss profile, plus bridge from GAAP or management
      accounts.
    relatedQuestionRefs:
    - QV027
  - type: private-evidence-only
    severity: material
    topic: customer concentration
    missingEvidence: Top-customer concentration, renewal history, and exposure to any single brokerage or payments partner.
    whyItMatters: Marquee client quality is a strength, but a few oversized accounts can still dominate valuation risk.
    diligencePath: Request top-10 customer list with revenue contribution, launch status, and NRR by cohort.
    relatedQuestionRefs:
    - QV028
  - type: enumeration-incomplete
    severity: material
    topic: comparable valuation coverage
    missingEvidence: A fuller private and public comparable set with current revenue multiples, preference terms, and closed
      2026 transactions.
    whyItMatters: The current comp set is model-appropriate but still partial because the cached corpus is stronger on milestones
      than on pure valuation data.
    diligencePath: Supplement with live private-market and public-market comp work before underwriting any premium above the
      last close.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: minor
    topic: upgrade milestones
    missingEvidence: Exact internal targets that would justify moving from track to buy, such as revenue thresholds, charter
      dates, or partner expansion metrics.
    whyItMatters: A recommendation change should be evidence-based and price-sensitive, not momentum-driven.
    diligencePath: Agree an internal milestone checklist with management diligence and revisit after the next financing or
      major launch.
    relatedQuestionRefs:
    - QV030
