chapter:
  number: 8
  title: Valuation
  summary: The last closed public price is $1.0 billion and remains the best anchor. 2026 chatter above $1.5 billion may prove
    directionally right, but without disclosed revenue quality, customer concentration, or financing terms, the most defensible
    stance is track / fair / medium confidence.
sections:
- id: price-anchor-and-evidence-quality
  title: Price anchor and evidence quality
  body: 'The valuation chapter should start from the last closed fact, not from the loudest narrative. In Zero Hash’s case,
    the hard anchor is the September 2025 Series D-2: $104 million raised at a $1.0 billion valuation with a notably strong
    institutional syndicate. That is solid evidence. The 2026 chatter is different. CoinDesk reports fundraising above $1.5
    billion and recounts strategic interest from Mastercard, but neither item is a closed transaction. They matter as directional
    signals because serious buyers and investors are engaging with the asset, yet they are not a substitute for a priced financing.
    This distinction is important because the rest of the file remains economically opaque. Public materials validate scale,
    licensing, and customer quality far better than they validate take rate, gross margin, retention, or profitability. That
    mismatch argues for valuation discipline. The company may be worth more than the last close, but the evidence needed to
    prove how much more is still missing.'
