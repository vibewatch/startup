    - Public institution; >$100B market cap and ~ $700B client assets
    - Frames the caliber of a flagship client-investor
    - Not a direct software multiple comp.
  - - Anchorage / BitGo
    - Credential reference
    - Federally or trust-grade custody positioning
    - Shows the custody-credential bar Zero Hash is chasing
    - Reference set is strategic rather than valuation-pure.
  notes: 'This is a model-appropriate comp set: one closed round, one unconfirmed live signal, one private comp, and two strategic
