      - [Risk rating, high, "Execution, financing, launch, contract conversion, and customer concentration risks remain material."]
      - [Valuation stance, stretched, "Approximately $1.2B post-transaction value is ahead of demonstrated product commercialization."]
      - [Decision implication, "milestone-gated diligence", "Revisit after definitive filings, cash bridge, cap table, and Ranger readiness evidence."]
    notes: "Assessments synthesize retained sources; the transaction value is conditional on no redemptions and is not a verified cash-available figure."
    claimRefs: [CV006, CV007, CV011, CV012]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Evidence, What would change the view]
    rows:
      - ["Orbital mobility demand is strategically relevant", "Ranger is designed for multi-orbit national-security missions and the company cites six contracts and pending proposals.", "Independent evidence of funded program awards and delivery milestones."]
      - ["Capital access could accelerate production", "The announced transaction includes a $300M convertible PIPE and approximately $253M of trust assuming no redemptions.", "Definitive filings showing proceeds, costs, redemptions, and post-close cash."]
      - ["Platform proof remains incomplete", "The official investor material says Ranger has not been manufactured, operated, or sold to date.", "Successful flight, customer acceptance, and independently corroborated technical readiness."]
      - ["Andromeda headline value is not backlog", "The $6.2B IDIQ ceiling is shared across 14 awardees and no specific Quantum Space funding is allocated.", "Program-level task orders, funded amounts, and conversion timing."]
    notes: "The table separates company-issued claims from diligence conclusions; an IDIQ ceiling and a contract pipeline are not recognized revenue."
    claimRefs: [CV001, CV003, CV006, CV008, CV009]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Assumptions, Valuation / return logic, Probability signal, Key trigger]
    rows:
      - [Bull, "Closing occurs; financing is available; funded government work converts; Ranger reaches operation.", "The announced approximately $1.2B value could be supported or exceeded by scaled delivery economics.", "Low-to-medium; multiple execution gates remain open.", "Definitive filing, funded backlog, and successful mission evidence."]
      - [Base, "Strategic demand persists but conversion, manufacturing, and cash timing are uneven.", "The announced value remains difficult to underwrite; wait for a better entry price or stronger proof.", "Medium; consistent with disclosed gaps.", "Cash bridge, cap table, and program-level backlog."]
      - [Bear, "Redemptions, failed closing, dilution, launch delay, cost overrun, or unfunded pipeline.", "Downside is material because no public revenue or completed platform supports a floor.", "Medium; risks are expressly disclosed.", "Missed milestone, financing shortfall, or contract non-conversion."]
      - [Catalyst, "Independent technical proof and contract awards arrive faster than expected.", "Could justify moving from track toward a valuation-supported entry.", "Unresolved.", "Flight heritage, customer acceptance, and recurring economics."]
    notes: "Scenarios are qualitative because public sources do not disclose revenue, margin, cash burn, fully diluted shares, or a defensible forward multiple."
    claimRefs: [CV007, CV010, CV011, CV013, CV014, CV015]
