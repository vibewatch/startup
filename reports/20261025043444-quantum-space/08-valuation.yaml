company:
  name: Quantum Space
chapter:
  number: 8
  title: Valuation
  summary: Quantum Space has a credible national-security space thesis and announced financing support, but the proposed approximately $1.2 billion post-transaction equity value is still primarily a forward-looking price on a spacecraft platform that has not yet been manufactured, operated, or sold. The evidence supports a track recommendation until funded backlog, dilution, execution, and flight proof are clearer.
sections:
  - id: investment-case
    title: Investment case and price sensitivity
    body: >-
      The investment case rests on a differentiated orbital-mobility platform, government demand,
      and access to capital rather than on disclosed operating revenue. Quantum Space's June 2026
      announcement describes six contracts and pending proposals across the U.S. Space Force,
      Department of War, DARPA, and Air Force Research Laboratory, plus eligibility for a
      $6.2 billion Andromeda IDIQ vehicle. That ceiling is shared across 14 awardees, and the
      company explicitly says it has not yet been allocated a specific amount of funding under
      Andromeda. The investor site separately presents more than $88 million in secured
      government contracts, but neither source provides a program-by-program funded backlog,
      revenue schedule, margin profile, or cash-conversion bridge. The commercial case therefore
      remains milestone-led: production readiness, contract conversion, and successful Ranger
      operation must precede confidence that the announced equity value is supported by
      recurring economics. Against that evidence, price discipline matters more than a generic
      quality score; a lower entry price or demonstrable funded backlog would improve the call,
      while a failed closing, redemptions, or delayed flight would weaken it.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001]
  - id: scenarios-and-comps
    title: Scenarios, financing structure, and comparables
    body: >-
      The proposed transaction supplies a reference price but not a verified cash balance. Quantum
      Space and Inflection Point announced approximately $600 million of pre-money equity value
      and approximately $1.2 billion post-transaction equity value assuming no redemptions.
      The same announcement describes approximately $253 million in trust, a convertible PIPE of
      approximately $300 million at $12 per share, and expected retention of approximately 50%
      ownership by existing Quantum Space holders. These are transaction assumptions, not cash
      available after costs, working-capital needs, or any future dilution. The official materials
      also describe the platform as a design concept still in development, while the independent
      GovConWire account repeats that Ranger has not yet reached commercial proof. Public
      comparables show a wide distribution: the retained market-data pages report Rocket Lab
      market capitalization of $33.63 billion in October 2026 and Intuitive Machines market
      capitalization of $1.71 billion as of November 7, 2025. These are not like-for-like
      valuation multiples and should not be used to infer Quantum Space's value; they are
      context for how public-market expectations can diverge across space businesses. The
      accessible SpaceNews lead independently characterized Quantum Space as a developing
      national-security spacecraft company pursuing a SPAC merger. A scenario framework is
      consequently more defensible than a point target.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV015, CV016]
    tableRefs: [TV002, TV003]
    figureRefs: [FV001]
  - id: decision-and-diligence
    title: Recommendation and thesis-break triggers
    body: >-
      The recommendation is track, with medium confidence and a stretched valuation stance.
      This is not a judgment that the company lacks strategic value; it is a price-sensitive
      conclusion driven by the gap between an announced approximately $1.2 billion equity value
      and limited public evidence of realized revenue, completed manufacturing, flight heritage,
      or fully diluted capitalization. The bull case requires the business combination to close,
      the PIPE and trust proceeds to be available after redemptions and transaction costs, funded
      government work to convert into production, and Ranger to meet its stated design objectives.
      The base case assumes strategic traction continues but timing, funding, and contract
      conversion remain uneven, making the announced value hard to underwrite. The bear case is
      a delayed or failed transaction, heavy redemptions or dilution, a delayed or failed launch,
      cost overruns, or a government pipeline that remains an IDIQ ceiling rather than funded
      backlog. Before upgrading, diligence should obtain the definitive transaction filing,
      fully diluted cap table and preference terms, post-close cash bridge, contract-level
      funded backlog, unit economics, manufacturing schedule, and independent technical
      readiness evidence. A thesis break is a material loss of committed financing, a missed
      mission milestone, or evidence that announced contract potential is not converting to
      funded work.
    claimRefs: [CV011, CV012, CV013, CV014]
    tableRefs: []
