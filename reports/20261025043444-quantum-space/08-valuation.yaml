callouts:
  - calloutType: recommendation
    title: Track, not buy
    body: The announced transaction creates a reference price but public evidence does not yet establish the revenue, cash, dilution, or flight-proof base needed to underwrite it.
    claimRefs: [CV006, CV007, CV011]
  - calloutType: risk
    title: The headline pipeline is not funded backlog
    body: Andromeda's $6.2B ceiling is shared across 14 awardees, and Quantum Space says no specific amount has yet been allocated to it.
    claimRefs: [CV003, CV009]
