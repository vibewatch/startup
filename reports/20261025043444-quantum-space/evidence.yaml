evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: scale
    missingEvidence: >-
      Audited revenue, ARR, cash balance, total capital raised, employee count, customer count, and funded backlog by
      program.
    whyItMatters: >-
      The proposed valuation and growth narrative cannot be tested against operating scale or cash conversion without
      these denominators.
    diligencePath: >-
      Request audited financial statements, monthly cash and burn schedule, customer-level backlog, contract funding
      notices, and a fully diluted capitalization table.
    relatedQuestionRefs:
      - QO007
      - QO008
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: schedule
    missingEvidence: A reconciled Prime schedule explaining the earlier June 2026 target and later second-half-2027 target.
    whyItMatters: The change affects launch credibility, program timing, and the interpretation of manufacturing-readiness evidence.
    diligencePath: >-
      Obtain the current integrated master schedule, critical-path variance log, test-readiness evidence, and
      launch-provider commitments.
    relatedQuestionRefs:
      - QO009
      - QO010
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Complete board, ownership, executive retention, and succession information.
