company:
  name: Quantum Space
chapter:
  number: 4
  title: Financials
  summary: Quantum Space has a capital-backed path to scale Ranger, but public evidence is still centered on announced financing, contract access, and management estimates rather than recognized revenue, gross margin, cash, or backlog conversion. The underwriting case therefore depends on execution of the proposed SPAC financing and disclosure of program-level economics.
sections:
  - id: monetization-and-traction
    title: Revenue model and public traction
    body: >-
      Quantum Space is developing Ranger as a maneuverable spacecraft platform for national-security, civil, and commercial missions rather than selling a recurring software subscription. The public materials describe a mix of government contracts, future task orders, spacecraft production, launch-site processing, and possible commercial services such as life extension, payload hosting, and logistics. The June 2026 transaction announcement identifies six contracts and pending proposals, but it does not disclose recognized revenue, contract values by program, backlog conversion, billing milestones, or customer concentration. The Andromeda vehicle is a ceiling and procurement channel, not Quantum Space revenue: the company announcement expressly says that no specific funding amount has yet been allocated to Quantum Space. This makes the available traction useful for demand validation but insufficient to calculate ARR, revenue growth, or a sales-efficiency ratio.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-unit-economics
    title: Pricing, cost structure, and unit economics
    body: >-
      No public source in the assigned pool provides a customer price list, realized spacecraft price, contract gross margin, contribution margin, CAC, payback period, utilization, or recurring service rate. The official funding release says the Series A extension was directed to hardware development, team scaling, and contracting, while the company later described proceeds from the proposed transaction as funding Ranger production and manufacturing expansion. That is consistent with a hardware- and program-delivery cost base, but it does not establish a margin path. Management's claim of up to 70% lower cost than conventional architectures is an internal estimate, not a realized customer price or audited cost advantage. The financial model should keep revenue, gross profit, and cash conversion as unavailable until contracts, labor and supplier costs, launch costs, and acceptance terms are disclosed.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI002, TI003]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and underwriting verdict
    body: >-
      Quantum Space is financing a capital-intensive development and production program. The 2025 company release reports a $40 million Series A extension, bringing the Series A total to $57 million, while the June 2026 proposed combination includes a $300 million PIPE and approximately $253 million in the SPAC trust account assuming no redemptions. Those are announced financing sources, not a disclosed post-close cash balance, and they remain subject to the transaction's stated shareholder approval and other closing conditions. The transaction communication also states that Ranger was still in development and had not been manufactured, operated, or sold as of the announcement, while independent industry reporting describes servicing demand as still dominated by bespoke government and defense work. A SpaceNews report independently confirms the SPAC path, and the SEC index records a subsequent Form 425 filing, but neither fills the operating-data gap. Without a balance sheet, burn rate, debt schedule, funded backlog, or use-of-proceeds detail by work package, runway and next-round triggers cannot be calculated. The financial verdict is therefore track rather than underwrite: demand signals and financing access are meaningful, but revenue quality, margin path, and capital sufficiency remain material diligence blockers.
    claimRefs: [CI006, CI009, CI010, CI011, CI012, CI013, CI014, CI015, CI016]
