      - [Andromeda access, "IDIQ task-order channel for maneuverable and refuellable spacecraft", "Shared vehicle ceiling", "$6.2B ceiling across 14 awardees; no specific Quantum Space allocation reported", "Procurement access, not Quantum Space revenue", "Obtain Quantum Space's awarded position, task-order probability, and funded ceiling"]
      - [Commercial and civil missions, "Spacecraft platform and possible mission services", "Mission or spacecraft contract", "Pipeline described, but no customer-level value or recognized revenue disclosed", "Management-described opportunity", "Request customer names or anonymized cohorts, contract status, deposits, and acceptance criteria"]
      - ["Life extension, payload hosting, and logistics", "Potential services enabled by Ranger and related platforms", "Service mission or payload slot", "Described on industry profile; pricing, utilization, and launch cadence unavailable", "Concept and product-market hypothesis", "Obtain signed customer commitments, price cards, utilization assumptions, and service cost per mission"]
    notes: "Public-source snapshot as of 2026-10-25; contract counts, ceilings, and pipeline estimates are not interchangeable with recognized revenue, ARR, or funded backlog; null economics require diligence."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Metric or price, Value, Basis, Confidence, Why it matters, Diligence ask]
    rows:
      - [Ranger customer price, null, "No public list or realized price found in assigned pool", low, "Prevents revenue-per-platform and gross-profit modeling", "Obtain signed-price ranges by spacecraft class and mission type"]
      - [Recurring service rate, null, "No public subscription, service-rate, or payload-slot schedule", low, "Determines whether future revenue is episodic or recurring", "Obtain service catalog, contract duration, renewal, and escalation terms"]
      - [Cost advantage, "Up to 70% lower cost beyond LEO", "Management estimate and internal analysis", medium, "Could support demand and pricing, but does not prove realized margin", "Reconcile estimate to comparable mission, supplier BOM, launch, labor, and test costs"]
    notes: "Null values mean no public realized price or rate was found; the 70% figure is a company estimate, not audited unit economics or a customer quote."
    claimRefs: [CI005, CI006, CI007]
  - id: TI003
    title: Unit economics and capital inputs
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Recognized revenue, null, low, "Cannot assess scale, growth, or revenue quality", "Request audited historical and year-to-date revenue by program and customer"]
      - [Gross margin, null, low, "Cannot assess hardware, launch, service, or supplier margin path", "Request gross-margin bridge by product and fully loaded cost allocation"]
      - [CAC or sales payback, null, low, "Government capture cycles and channel effort may consume cash before award", "Request bid-and-capture spend, win rates, cycle time, and contribution by channel"]
      - [Cash on hand and runway, null, low, "Cannot test funding sufficiency through Prime and production milestones", "Request latest balance sheet, monthly burn, committed capex, debt, and runway case"]
      - [Funded backlog, null, low, "Pipeline and IDIQ ceilings may not convert to cash", "Request funded backlog, remaining performance obligations, and cancellation or protest exposure"]
    notes: "Unavailable fields are deliberate nulls, not zeroes; public announcements describe financing and opportunities but do not disclose the operating inputs needed for a cash-flow model."
    claimRefs: [CI008, CI009, CI010, CI011, CI012, CI013, CI014]
