callouts:
  - calloutType: insight
    title: The key financial question is conversion
    body: Public evidence supports access to defense demand and announced financing, but it does not show how many awards are funded, when milestones bill, or whether production economics can produce cash before the next financing need.
    claimRefs: [CI001, CI002, CI010, CI013]
  - calloutType: recommendation
    title: Require program-level underwriting before valuation
    body: Before relying on the proposed valuation, obtain funded backlog, contract economics, post-close cash after redemptions and transaction costs, monthly burn, capex, debt, and a mission-by-mission path to gross profit.
    claimRefs: [CI010, CI011, CI012, CI014]
