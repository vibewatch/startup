chapter:
  number: 6
  title: Customers
  summary: Quantum Space has disclosed government-space traction and a named payload-processing supplier, but public evidence remains concentrated in contracts, proposals, and platform positioning rather than recurring production deployments or retention metrics. The customer thesis is therefore promising but still dependent on mission execution, procurement conversion, and commercial demand.
sections:
  - id: customer-segments
    title: Buyer segments and use cases
    body: >-
      Quantum Space targets a three-sided customer set: U.S. national-security
      organizations, civil-space agencies, and commercial space operators. Its
      own announcement says the customer base spans the U.S. national-security
      space enterprise and describes six contracts and pending proposals with the
      U.S. Space Force, Department of War, DARPA, and Air Force Research
      Laboratory. The platform is also positioned for commercial satellite
      operators that need orbital mobility, payload delivery, inspection, or
      life-extension services. The segment map is credible as a buyer thesis,
      but the public record does not disclose contract-by-contract customer
      names, funded amounts, revenue bands, or whether each relationship is
      production, pilot, study, or proposal stage.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and proof quality
    body: >-
      The strongest adoption evidence is a named operational relationship with
      All Points Logistics: All Points states that Quantum Space selected it for
      spacecraft processing services for future Ranger missions beginning in
      2026. This is evidence of planned pre-launch integration and checkout,
      not proof of an on-orbit mission or repeat revenue. Quantum Space also
      reports six contracts and pending proposals. Satellite Today reported a
      June 2027 Ranger pathfinder target in June 2026, while a later
      company-issued September update moved Prime to the second half of 2027
      and said a Systems Integration Review had been completed. NASA's 2026
      RSGS article illustrates government-led validation of the wider servicing
      market, but it concerns Northrop Grumman's mission rather than Quantum
      Space and should not be counted as Quantum Space adoption. No assigned
      source provides active-customer count, utilization, renewal, churn, NRR,
      GRR, contract length, or cohort data.
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU015]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-expansion
    title: Named proof, expansion, and concentration
    body: >-
      Customer proof is currently strongest at the infrastructure and
      government-program interface. All Points identifies Quantum Space as a
      customer of its Space Prep service, meaning All Points is a supplier
      rather than a buyer of Ranger, and describes a 2026 start for processing
      future missions. That relationship supports a pre-launch workflow use
      case but does not establish flight completion, customer outcomes, or
      production cadence. Quantum Space's Andromeda
      position is an IDIQ vehicle with a large ceiling shared among awardees,
      and the company explicitly says it has not received a specific funding
      allocation under that contract. Payload reports that in-space servicing
      remains overwhelmingly government- and defense-buyer driven and that
      sector contracts are still largely bespoke and one-off. This creates a
      plausible expansion loop from government demonstrations to commercial
      servicing, but also leaves concentration, procurement timing, and
      anchor-customer dependence unresolved.
    claimRefs: [CU010, CU011, CU012, CU013, CU014, CU016]
    tableRefs: [TU003]
