  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and value chain
        blocks:
          - type: paragraph
            body: >-
              This chapter treats Quantum Space's addressable market as orbital mobility and in-space logistics: orbital
              transfer vehicles, satellite repositioning, refueling, life extension, and related depot infrastructure.
              It excludes launch vehicles, generic satellite manufacturing, and in-space manufacturing unless those
              activities directly support transportation or servicing. The boundary matters because broader ISAM
              estimates combine manufacturing, servicing, and transportation, while Quantum Space's Ranger proposition
              is centered on maneuverable, refuelable spacecraft. Government and defense programs are the clearest
              present buyers; commercial demand is a prospective adjacency. GAO reports that robotic servicing is not
              routinely used and has only been demonstrated on a handful of missions, so this is an emerging
              infrastructure category rather than a mature recurring-services market.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and market maturity
        blocks:
          - type: paragraph
            body: >-
              Available sizing lenses are not interchangeable. The Business Research Company reports a $2.6 billion 2026
              market and $5.23 billion in 2030, but its definition spans in-space manufacturing, servicing, and
              transportation across multiple applications. That is a broad top-down ceiling, not a Quantum Space SAM. A
              second lens is institutional demand: GAO records more than 11,000 active satellites in 2025, at least
              18,000 more projected by 2030, and more than $2 billion of DOD and NASA ISAM development over the prior
              decade. A bottom-up commercial lens is not yet supportable because Payload reports servicing contracts
              remain bespoke, one-off engagements and stakeholders still need to prove repeatable commercial demand. The
              defensible conclusion is that the market is expanding, but a precise SAM or SOM requires program-level
              budgets, task orders, service pricing, and qualification evidence that are not public here.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM009
      - number: '2.3'
        title: Buyers, adoption path, and constraints
        blocks:
          - type: paragraph
            body: >-
              The buyer map is defense-led. The U.S. Space Force and related Department of War programs are evaluating
              propellant management, orbital transfer vehicles, network mechanics, warehousing, repair, refuel, and
              logistics health monitoring. These requirements indicate budget ownership by government mission and
              acquisition organizations, with spacecraft operators and prime contractors as users or integration
              partners. Quantum Space's June 2026 depot award and September 2026 launch-processing work order are
              evidence of program access, not proof of scaled revenue or commercial product-market fit. Adoption is
              constrained by the chicken-and-egg problem documented by GAO: providers hesitate without a user base,
              while operators hesitate to design serviceable satellites without proven services. Emerging standards,
              limited in-space test opportunities, fragmented government priorities, launch and rendezvous execution
              risk, and unclear commercial pricing all lengthen qualification cycles. Ranger's modularity and refueling
              thesis can improve option value if the platform demonstrates flight performance, but the evidence does not
              yet establish a repeatable multi-mission backlog.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Market conclusion
            body: >-
              The strongest evidence supports an expanding, government-led orbital-logistics opportunity; it does not
              support treating the broad ISAM forecast as Quantum Space revenue potential.
