  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Quantum Space competes against more than orbital-transfer vehicles. A buyer can procure a maneuverable
              platform such as Ranger, engage a servicing or refueling specialist, use an incumbent-led
              government-private program, replace the satellite through another launch, or fund a bespoke internal
              mission. DARPA's RSGS program illustrates the incumbent route: government robotics are paired with a
              commercial platform integrated by Northrop Grumman's SpaceLogistics. Payload identifies Astroscale, Orbit
              Fab, Starfish Space, and other specialists pursuing narrower servicing capabilities, while its sector
              review says servicing remains overwhelmingly driven by government and defense buyers. Factories in Space
              also classifies Quantum across transportation, inspection, life extension, and logistics, showing how many
              adjacent categories overlap the buyer job. The landscape is therefore fragmented by mission type and
              maturity rather than organized around one clean product category.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP009
              - CP010
              - CP011
              - CP012
              - CP016
      - number: '3.2'
        title: Capability position and proof burden
        blocks:
          - type: paragraph
            body: >-
              Ranger's stated differentiation is the combination of multi-orbit reach, modular payload hosting,
              refuelability, and sustained maneuver. Quantum says the platform is designed for LEO, MEO, GEO, and
              cislunar operations, carries more than 4,000 kilograms of storable fuel, and could operate for up to 15
              years. Those specifications and the claimed cost advantage remain design or management assertions rather
              than demonstrated customer outcomes. BlacKnight Space Labs explicitly identifies proving the economics and
              refueling concept in operation as the central technical and commercial challenge. Ranger Prime is now the
              key proof point: Quantum calls it the first Ranger flight and schedules it no earlier than spring 2027,
              whereas three October 2025 reports described a June 2026 plan. The company's prior Sentry spacecraft
              reached orbit but experienced a power-system anomaly that shortened its intended mission, reinforcing the
              value of flight evidence over specification comparisons.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP009
              - CP010
              - CP011
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP008
              - CP009
              - CP010
              - CP011
      - number: '3.3'
        title: Procurement, pricing, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Distribution is concentrated in government channels, and access to a contract vehicle does not equal
              funded backlog. Quantum describes the Space Force's Andromeda IDIQ as a shared $6.2 billion ceiling across
              14 awardees and states that no specific funding has been allocated to the company. It separately reports
              six contracts and pending proposals and an unweighted opportunity pipeline above $5 billion, both
              company-reported measures that should not be treated as revenue or committed orders. Payload's sector
              reporting says servicing contracts remain largely bespoke and one-off, limiting evidence of repeat
              purchasing or standardized packaging. None of the assigned sources provides a comparable public list price
              or realized Ranger contract price. This prevents a defensible price-performance comparison and makes
              funded task orders, mission-level economics, and win-loss evidence the most important commercial diligence
              requests.
            claimRefs:
              - CP010
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP013
              - CP014
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Quantum's potential moat combines propulsion know-how, modular architecture, manufacturing ambition, and
              government access, but each layer still has a credible counter. Payload reports that Quantum spent $40
              million to acquire Phase Four's propulsion technology, yet specialist competitors can focus on one mission
              such as refueling, inspection, or life extension while an incumbent can combine integration history with
              government-developed robotics. LeadIQ's low-reputation estimates suggest approximately 115 employees, $73
              million raised, and $10 million to $25 million of annual revenue as of October 2026; these are directional
              third-party estimates, not audited scale measures. Switching costs may rise only after qualification and
              mission integration. Before then, multi-award procurement, schedule slips, and the absence of disclosed
              pricing preserve buyer optionality. The durable moat case therefore depends on Ranger Prime performance,
              funded follow-on orders, repeatable production, and independent cost evidence rather than the breadth of
              the roadmap alone.
            claimRefs:
              - CP002
              - CP003
              - CP008
              - CP009
              - CP015
              - CP016
