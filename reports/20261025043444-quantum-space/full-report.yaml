      - number: '1.2'
        title: Leadership, governance, and dependency
        blocks:
          - type: paragraph
            body: >-
              The disclosed leadership story is concentrated around co-founder and Executive Chairman Kam Ghaffarian and
              CEO Jim Bridenstine, appointed in May 2026. The SPAC announcement highlights Ghaffarian's role in founding
              the company and Bridenstine's prior service as NASA Administrator, naval aviator, and member of Congress.
              The September launch-processing announcement identifies Kerry Wisnosky as President and quotes him on
              Prime execution, while the 2025 mission article identifies Richard Matlock as Senior Vice President for
              National Security Space Programs and Phil Bracken as Chief Technology Officer. This provides evidence of
              functional coverage across executive, program, national-security, and technical roles, but the assigned
              evidence does not disclose a complete board roster, ownership schedule, succession plan, or retention
              arrangements. Key-person dependence is therefore material, particularly because the public narrative ties
              strategy and government-market credibility to a small number of named leaders.
