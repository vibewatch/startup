      - number: '1.3'
        title: Financing, commercialization, and transaction status
        blocks:
          - type: paragraph
            body: >-
              Quantum Space announced a definitive business combination agreement with Inflection Point Acquisition
              Corp. VI on June 8, 2026. The company release described a $300 million PIPE, approximately $600 million
              pre-money equity value, and approximately $1.2 billion post-transaction equity value assuming no
              public-shareholder redemptions; these are transaction terms and management disclosures, not realized cash,
              revenue, or ARR. Independent coverage also states that the transaction remained subject to shareholder
              approval and customary closing conditions and that the Andromeda vehicle's $6.2 billion ceiling is shared
              across 14 awardees. The company release explicitly says no specific amount of Andromeda funding had yet
              been allocated to Quantum Space. The evidence does not establish current revenue, cash balance, total
              lifetime capital raised, funded backlog, customer count, or post-close dilution, so those fields remain
              diligence gaps rather than zeros.
