              - CU008
              - CU010
              - CU011
              - CU015
      - number: '6.3'
        title: Named proof, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Customer proof is currently strongest at the infrastructure and government-program interface. All Points
              identifies Quantum Space as a customer of its Space Prep service, meaning All Points is a supplier rather
              than a buyer of Ranger, and describes a 2026 start for processing future missions. That relationship
              supports a pre-launch workflow use case but does not establish flight completion, customer outcomes, or
              production cadence. Quantum Space's Andromeda position is an IDIQ vehicle with a large ceiling shared
              among awardees, and the company explicitly says it has not received a specific funding allocation under
              that contract. Payload reports that in-space servicing remains overwhelmingly government- and
              defense-buyer driven and that sector contracts are still largely bespoke and one-off. This creates a
              plausible expansion loop from government demonstrations to commercial servicing, but also leaves
              concentration, procurement timing, and anchor-customer dependence unresolved.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
