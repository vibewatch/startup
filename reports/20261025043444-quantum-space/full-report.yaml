      The broad ISAM forecast is a ceiling, while institutional spending and Quantum Space's near-term serviceable
      market remain narrower and unquantified.
    data:
      items:
        - label: Broad ISAM market (2030)
          value: $5.23B
          detail: Business Research Company forecast; manufacturing, servicing, and transportation combined
        - label: Broad ISAM market (2026)
          value: $2.6B
          detail: Business Research Company estimate; same broad category
        - label: Quantum Space SAM/SOM
          value: Not disclosed
          detail: Requires program budgets, task orders, pricing, and qualification evidence
        - label: Institutional ISAM development
          value: '>$2B'
          detail: GAO-reported DOD and NASA development over the prior decade; not commercial revenue
        - label: Active satellite base
          value: '>11,000'
          detail: GAO-reported active satellites in 2025; installed-base indicator
        - label: Additional satellites projected
          value: '>=18,000'
          detail: GAO-reported projected launches by 2030; demand context, not service revenue
    approximationNotes: >-
      The layers are an ordered evidence hierarchy, not a mathematical conversion or proportionally scaled funnel; the
      2026 and 2030 values are publisher forecasts for a broader market than Quantum Space's core.
    claimRefs:
      - CM005
      - CM006
      - CM009
  - id: FP001
    title: Competitive positioning by public scope and maturity
    type: quadrant
    summary: >-
      Ranger has the broadest stated scope in the assigned evidence, but fixed-orbit procurement and incumbent
      integration paths carry stronger maturity signals.
    data:
      points:
        - label: Quantum Space Ranger
          x: 5
          'y': 2
          detail: Broad multi-orbit, modular, refuelable thesis; first Ranger flight is still pending.
        - label: SpaceLogistics MRV
          x: 3
          'y': 4
          detail: Incumbent-led GEO servicing program with government robotics and a planned demonstration.
        - label: Astroscale
          x: 3
          'y': 3
          detail: Focused servicing and life-extension missions with additional demonstrations planned.
        - label: Orbit Fab
          x: 2
          'y': 2
          detail: Refueling specialist whose planned mission addresses a critical mobility dependency.
        - label: Fixed-orbit replacement
          x: 1
          'y': 5
          detail: Narrow flexibility but a familiar procurement and mission architecture.
        - label: Bespoke internal mission
          x: 3
          'y': 3
          detail: Mission-specific scope with buyer control, integration burden, and no standardized service economics.
      xAxis:
        label: Breadth of publicly described mission scope
        min: 0
        max: 5
      yAxis:
        label: Public flight and procurement maturity
        min: 0
        max: 5
    approximationNotes: >-
      Scores are directional ordinal synthesis of assigned evidence, not measured performance, market share, or
      independent engineering benchmarks.
    claimRefs:
      - CP002
      - CP003
      - CP008
      - CP009
      - CP010
      - CP011
  - id: FI001
    title: Publicly described revenue-to-cash pathway
    type: flow
    summary: >-
      Contract access and financing are inputs to Ranger production and mission delivery, but the public record does not
      disclose the conversion points into recognized revenue or gross profit.
    data:
      nodes:
        - id: demand
          label: Defense, civil, and commercial demand
          detail: Six contracts, pending proposals, and described commercial opportunities
        - id: awards
          label: Funded awards and task orders
          detail: Andromeda is a $6.2B shared ceiling; no Quantum Space allocation disclosed
        - id: financing
          label: Equity financing
          detail: $40M Series A extension; proposed $300M PIPE and approximately $253M trust account
        - id: production
          label: Ranger development and production
          detail: Hardware development, testing, and Tulsa manufacturing expansion
        - id: mission
          label: Manufacturing and mission validation
          detail: Ranger was still in development and not yet manufactured, operated, or sold in the June 2026 communication
        - id: revenue
          label: Recognized revenue and gross profit
          detail: Not publicly disclosed; conversion, margin, and cash timing remain open
  - id: FE001
    title: Ranger product architecture map
    type: stack
    summary: >-
      Ranger's public product concept links payload delivery, modular interfaces, maneuvering, endurance, and
      distributed production into one orbital-mobility platform.
    data:
      layers:
        - label: Mission outputs
          detail: Intended payload delivery and repositioning outcomes for GEO and cislunar missions.
          items:
            - label: GEO delivery
              detail: Reported capacity exceeds 1.5 metric tons directly to GEO.
            - label: Cislunar delivery
              detail: Reported capacity exceeds 2.5 metric tons in cislunar space.
        - label: Payload integration
          detail: Standardized interfaces are intended to make Ranger mission-configurable.
          items:
            - label: Four modular ports
              detail: Each port is described as 24 inches.
            - label: Payload range
              detail: Reported support extends from cubesats to 500-kg smallsats.
        - label: Mobility
          detail: Propulsion is intended to support transfer and repeated orbital maneuver.
          items:
            - label: Single-fuel multi-mode propulsion
              detail: One disclosed architecture is intended to serve multiple maneuver regimes.
            - label: 12 km/s maximum delta-V
              detail: This is a current company-stated design metric, not a verified flight result.
        - label: Endurance
          detail: Stored propellant and refueling are intended to extend useful maneuver life.
          items:
            - label: 4,000 kg fuel
              detail: Current company-stated fuel capacity.
            - label: Up to 15 years
              detail: Company-stated on-station objective subject to qualification and operation.
        - label: Production
          detail: Distributed sites divide engineering, propulsion integration, testing, and component production.
          items:
            - label: Tulsa
              detail: Planned tank and precision-parts manufacturing.
            - label: Hawthorne and Rockville
              detail: Propulsion integration and test plus engineering and mission development.
        - label: Qualification and operations
          detail: >-
            Flight, refueling, reliability, safety, security, and support evidence must connect the design to
            deployment.
          items:
            - label: Current maturity
              detail: The company stated in June 2026 that Ranger had not been manufactured, operated, or sold.
            - label: Diligence proof
              detail: Qualification records and independently observed mission results remain required.
    approximationNotes: >-
      The stack is a qualitative architecture map; layer order does not represent physical size, cost, maturity, or
      performance.
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
      - CE011
      - CE013
