  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Quantum Space is developing Ranger as a maneuverable spacecraft platform for national-security, civil, and
              commercial missions rather than selling a recurring software subscription. The public materials describe a
              mix of government contracts, future task orders, spacecraft production, launch-site processing, and
              possible commercial services such as life extension, payload hosting, and logistics. The June 2026
              transaction announcement identifies six contracts and pending proposals, but it does not disclose
              recognized revenue, contract values by program, backlog conversion, billing milestones, or customer
              concentration. The Andromeda vehicle is a ceiling and procurement channel, not Quantum Space revenue: the
              company announcement expressly says that no specific funding amount has yet been allocated to Quantum
              Space. This makes the available traction useful for demand validation but insufficient to calculate ARR,
              revenue growth, or a sales-efficiency ratio.
