      - number: '5.3'
        title: Maturity, deployment, and ecosystem dependencies
        blocks:
          - type: paragraph
            body: >-
              The strongest current maturity evidence is cautionary. Aviation Week called Ranger an in-development
              vehicle in 2023, while Quantum Space's own June 2026 transaction disclosure stated that Ranger was still
              in development and had not been manufactured, operated, or sold. This sharply separates detailed design
              claims from flight-proven capability. The broader servicing ecosystem is also early: Payload reported that
              contracts remain largely bespoke and one-off, and DARPA described its separate 2026 RSGS launch as a
              demonstration intended to prove commercial viability for GEO servicing. Those external programs validate
              the strategic relevance of servicing and mobility, but they do not validate Ranger. Underwriting therefore
              depends on Ranger-specific qualification, launch, maneuver, payload-interface, and refueling evidence.
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
      - number: '5.4'
        title: Trust, safety, security, and quality controls
        blocks:
          - type: paragraph
            body: >-
              Public evidence in the assigned pool does not describe Ranger-specific cybersecurity architecture,
              software-assurance practices, safety certification, reliability statistics, supplier redundancy, or
              production acceptance yields. This is material for a defense-oriented spacecraft that is expected to
              maneuver autonomously, handle storable propellant, integrate third-party payloads, and operate for years.
              Quantum Space's transaction communication itself identifies safety performance, security incidents, launch
              failures, dangerous materials, and product defects as risks. That disclosure demonstrates awareness, not
              control effectiveness. Diligence should require security plans, hazard analyses, environmental and
              propulsion qualification matrices, software verification records, non-conformance data, and
              supplier-continuity evidence before treating the platform as deployment-ready.
            claimRefs:
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Coherent platform architecture
            body: >-
              Ranger combines orbital transfer, standardized payload interfaces, high maneuverability, and refuelable
              endurance in one product thesis that could serve several mission classes if qualification succeeds.
            calloutType: strength
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
          - type: callout
            title: Design detail exceeds operational proof
            body: >-
              Quantum Space disclosed in June 2026 that Ranger was still in development and had not been manufactured,
              operated, or sold, while broader servicing activity remains dominated by bespoke demonstrations.
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer segments and use cases
        blocks:
          - type: paragraph
            body: >-
              Quantum Space targets a three-sided customer set: U.S. national-security organizations, civil-space
              agencies, and commercial space operators. Its own announcement says the customer base spans the U.S.
              national-security space enterprise and describes six contracts and pending proposals with the U.S. Space
              Force, Department of War, DARPA, and Air Force Research Laboratory. The platform is also positioned for
              commercial satellite operators that need orbital mobility, payload delivery, inspection, or life-extension
              services. The segment map is credible as a buyer thesis, but the public record does not disclose
              contract-by-contract customer names, funded amounts, revenue bands, or whether each relationship is
              production, pilot, study, or proposal stage.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU016
      - number: '6.2'
        title: Adoption trajectory and proof quality
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption evidence is a named operational relationship with All Points Logistics: All Points
              states that Quantum Space selected it for spacecraft processing services for future Ranger missions
              beginning in 2026. This is evidence of planned pre-launch integration and checkout, not proof of an
              on-orbit mission or repeat revenue. Quantum Space also reports six contracts and pending proposals.
              Satellite Today reported a June 2027 Ranger pathfinder target in June 2026, while a later company-issued
              September update moved Prime to the second half of 2027 and said a Systems Integration Review had been
              completed. NASA's 2026 RSGS article illustrates government-led validation of the wider servicing market,
              but it concerns Northrop Grumman's mission rather than Quantum Space and should not be counted as Quantum
              Space adoption. No assigned source provides active-customer count, utilization, renewal, churn, NRR, GRR,
              contract length, or cohort data.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
