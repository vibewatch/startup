chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Quantum Space describes itself as building agile, maneuverable spacecraft for national-security, civil,
              and commercial space operations. Its Ranger platform is presented as a multi-orbit spacecraft architecture
              spanning LEO, MEO, GEO, and cislunar operations, with single-fuel, multi-mode propulsion, modular and
              refuellable architecture, and long-duration station-keeping as the core product thesis. These are
              primarily company-stated design objectives rather than independently demonstrated operating results. The
              company identifies engineering and mission development in Rockville, Maryland, propulsion integration and
              testing in Hawthorne, California, and a Tulsa manufacturing facility being developed to expand production.
              The Oklahoma Department of Commerce reported that the Tulsa site is expected to begin modifications in
              July 2026 and target initial operational capability in Q1 2027, so the footprint is an execution plan
              rather than proof of scaled manufacturing.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
