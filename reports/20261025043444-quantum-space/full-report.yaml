  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk landscape
        blocks:
          - type: paragraph
            body: >-
              Quantum Space's highest-consequence risk is execution of Ranger Prime. The September 2026
              launch-processing agreement is evidence that mission preparation has entered a more detailed phase, but it
              is not evidence of a completed spacecraft, successful environmental testing, launch, or on-orbit
              performance. The company's own transaction disclosure states that Ranger has not been manufactured,
              operated, or sold to date and explicitly lists delayed launches, launch failures, orbital-placement
              failures, cost increases, product defects, and unsafe satellite-system performance as risks. Those
              disclosures make a high residual execution exposure appropriate even though the company has completed a
              Systems Integration Review and is targeting the second half of 2027. A second linked risk is technical
              proof: the 4,000+ kg fuel capacity, refuelable architecture, 15-year life, modularity, and cost advantage
              are design or management claims rather than demonstrated operating results. The refueling demonstration's
              financial terms were not disclosed, so contract award should not be treated as funded backlog or proof of
              commercial economics. These risks matter because a single failed pathfinder could delay revenue
              milestones, weaken customer confidence, and raise the capital required to reach a repeatable service
              cadence.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR007
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.2'
        title: Legal, financial, and market exposure
        blocks:
          - type: paragraph
            body: >-
              The proposed Inflection Point transaction introduces closing and capitalization risk alongside operating
              risk. Public descriptions give a $600 million pre-money equity value, approximately $1.2 billion
              post-transaction equity value assuming no redemptions, approximately $253 million in trust proceeds, and a
              $300 million PIPE or convertible PIPE commitment; those amounts are transaction assumptions, not cash
              available today. Closing remains subject to shareholder approval and other customary conditions, while
              redemption requests could reduce proceeds. The company has also described six contracts and pending
              proposals, a $5 billion unweighted pipeline estimate, and eligibility under a $6.2 billion Andromeda IDIQ
              ceiling; none of those figures establishes Quantum Space's allocated funding, recognized revenue, margin,
              or cash runway. Sector evidence adds a market-conversion risk: Payload reports that servicing contracts
              remain largely bespoke, one-off awards and that the sector must prove reliable rendezvous-and-proximity
              operations before broader commercial demand can follow. Thus, the investment case is exposed to
              government-budget timing, contract protests or counterparty failure, SPAC dilution/redemptions, and a
              slower-than-expected commercial market.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR016
      - number: '7.3'
        title: Mitigations, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Some mitigations are visible but not yet mature. Quantum Space has contracted specialized launch-site
              processing, completed a Systems Integration Review, announced facilities in Rockville, Hawthorne, and
              Tulsa, and selected Quindar for mission-management infrastructure. These actions reduce coordination risk,
              but they do not eliminate dependence on launch providers, specialized suppliers, government customers, or
              the ability to hire and retain flight-operations talent. The transaction disclosure also identifies
              energetic materials, dangerous chemicals, safety performance, security incidents, supplier and
              prime-contractor performance, government funding changes, and bidder protests as material uncertainties.
              Monitoring should therefore focus on objective gates: completion of environmental testing; successful
              launch and orbital insertion; demonstrated refueling and payload operations; disclosure of contract-level
              funding and milestone payments; SPAC closing, redemptions, and dilution; and evidence of repeatable
              non-bespoke customer demand. A thesis break occurs if Prime slips materially without a funded recovery
              plan, if the vehicle fails to meet its design standards, if the SPAC does not close or leaves inadequate
              capital, or if safety/security incidents or contract losses reveal that the platform cannot scale
              reliably.
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR012
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR007
              - CR009
              - CR012
              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Flight proof is the central kill criterion
            body: >-
              The thesis should be re-underwritten if Ranger Prime misses its targeted launch window without a funded
              recovery plan, or if the mission fails to demonstrate the performance and safety standards on which the
              platform's economics depend.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR014
          - type: callout
            title: Announced capital is not cash available
            body: >-
              The proposed valuation, trust proceeds, and PIPE are transaction terms subject to closing conditions,
              shareholder redemptions, financing conditions, and dilution; they should not be treated as current cash
              runway.
            calloutType: assumption
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and price sensitivity
        blocks:
          - type: paragraph
            body: >-
              The investment case rests on a differentiated orbital-mobility platform, government demand, and access to
              capital rather than on disclosed operating revenue. Quantum Space's June 2026 announcement describes six
              contracts and pending proposals across the U.S. Space Force, Department of War, DARPA, and Air Force
              Research Laboratory, plus eligibility for a $6.2 billion Andromeda IDIQ vehicle. That ceiling is shared
              across 14 awardees, and the company explicitly says it has not yet been allocated a specific amount of
              funding under Andromeda. The investor site separately presents more than $88 million in secured government
              contracts, but neither source provides a program-by-program funded backlog, revenue schedule, margin
              profile, or cash-conversion bridge. The commercial case therefore remains milestone-led: production
              readiness, contract conversion, and successful Ranger operation must precede confidence that the announced
              equity value is supported by recurring economics. Against that evidence, price discipline matters more
              than a generic quality score; a lower entry price or demonstrable funded backlog would improve the call,
              while a failed closing, redemptions, or delayed flight would weaken it.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV006
              - CV007
              - CV011
              - CV012
      - number: '8.2'
        title: Scenarios, financing structure, and comparables
        blocks:
          - type: paragraph
            body: >-
              The proposed transaction supplies a reference price but not a verified cash balance. Quantum Space and
              Inflection Point announced approximately $600 million of pre-money equity value and approximately $1.2
              billion post-transaction equity value assuming no redemptions. The same announcement describes
              approximately $253 million in trust, a convertible PIPE of approximately $300 million at $12 per share,
              and expected retention of approximately 50% ownership by existing Quantum Space holders. These are
              transaction assumptions, not cash available after costs, working-capital needs, or any future dilution.
              The official materials also describe the platform as a design concept still in development, while the
              independent GovConWire account repeats that Ranger has not yet reached commercial proof. Public
              comparables show a wide distribution: the retained market-data pages report Rocket Lab market
              capitalization of $33.63 billion in October 2026 and Intuitive Machines market capitalization of $1.71
              billion as of November 7, 2025. These are not like-for-like valuation multiples and should not be used to
              infer Quantum Space's value; they are context for how public-market expectations can diverge across space
              businesses. The accessible SpaceNews lead independently characterized Quantum Space as a developing
              national-security spacecraft company pursuing a SPAC merger. A scenario framework is consequently more
              defensible than a point target.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV008
              - CV009
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV011
      - number: '8.3'
        title: Recommendation and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The recommendation is track, with medium confidence and a stretched valuation stance. This is not a
              judgment that the company lacks strategic value; it is a price-sensitive conclusion driven by the gap
              between an announced approximately $1.2 billion equity value and limited public evidence of realized
              revenue, completed manufacturing, flight heritage, or fully diluted capitalization. The bull case requires
              the business combination to close, the PIPE and trust proceeds to be available after redemptions and
              transaction costs, funded government work to convert into production, and Ranger to meet its stated design
              objectives. The base case assumes strategic traction continues but timing, funding, and contract
              conversion remain uneven, making the announced value hard to underwrite. The bear case is a delayed or
              failed transaction, heavy redemptions or dilution, a delayed or failed launch, cost overruns, or a
              government pipeline that remains an IDIQ ceiling rather than funded backlog. Before upgrading, diligence
              should obtain the definitive transaction filing, fully diluted cap table and preference terms, post-close
              cash bridge, contract-level funded backlog, unit economics, manufacturing schedule, and independent
              technical readiness evidence. A thesis break is a material loss of committed financing, a missed mission
              milestone, or evidence that announced contract potential is not converting to funded work.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, not buy
            body: >-
              The announced transaction creates a reference price but public evidence does not yet establish the
              revenue, cash, dilution, or flight-proof base needed to underwrite it.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV007
              - CV011
          - type: callout
            title: The headline pipeline is not funded backlog
            body: >-
              Andromeda's $6.2B ceiling is shared across 14 awardees, and Quantum Space says no specific amount has yet
              been allocated to it.
            calloutType: risk
            claimRefs:
              - CV003
              - CV009
