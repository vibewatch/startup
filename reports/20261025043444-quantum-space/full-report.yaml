      - number: '1.4'
        title: Milestones, execution gates, and unresolved risks
        blocks:
          - type: paragraph
            body: >-
              Recent milestones show progression from financing and executive transition toward manufacturing and flight
              preparation: the company announced the SPAC transaction in June 2026, described a Tulsa manufacturing plan
              in May 2026, and in September 2026 announced a specific launch-processing work order for Prime. Prime is
              described as a pathfinder mission for Ranger and Scout, with a Systems Integration Review completed and a
              target launch in the second half of 2027. The assigned sources also preserve execution risks rather than
              treating plans as outcomes: the company says Ranger has not yet been manufactured, operated, or sold;
              launch delays, launch failures, defects, safety incidents, supplier/counterparty failures, funding
              changes, and transaction failure are identified risks. A 2025 source reported an earlier June 2026 target
              for Ranger Prime, so the later second-half-2027 target is a material schedule change and should be tracked
              as a current plan, not proof of a completed launch.
