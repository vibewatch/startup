      - number: '5.2'
        title: Architecture, interfaces, and production model
        blocks:
          - type: paragraph
            body: >-
              The public architecture combines a large storable-propellant load, single-fuel multi-mode propulsion,
              refuelability, and standardized payload interfaces. Quantum Space states 4,000 kilograms of fuel, 12 km/s
              maximum delta-V, and up to 15 years on station. Those metrics describe the intended operating envelope;
              the assigned evidence does not provide qualification reports, duty cycles, mass budgets, or on-orbit
              refueling results. The planned production model is distributed. Quantum Space says Tulsa will manufacture
              large propulsion tanks and precision spacecraft parts, complementing propulsion integration and testing in
              Hawthorne and engineering and mission development in Rockville. Tulsa initial operational capability is
              targeted for Q1 2027, so production scale remains a roadmap milestone rather than demonstrated fleet
              throughput.
