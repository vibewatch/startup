      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Quantum Space is financing a capital-intensive development and production program. The 2025 company
              release reports a $40 million Series A extension, bringing the Series A total to $57 million, while the
              June 2026 proposed combination includes a $300 million PIPE and approximately $253 million in the SPAC
              trust account assuming no redemptions. Those are announced financing sources, not a disclosed post-close
              cash balance, and they remain subject to the transaction's stated shareholder approval and other closing
              conditions. The transaction communication also states that Ranger was still in development and had not
              been manufactured, operated, or sold as of the announcement, while independent industry reporting
              describes servicing demand as still dominated by bespoke government and defense work. A SpaceNews report
              independently confirms the SPAC path, and the SEC index records a subsequent Form 425 filing, but neither
              fills the operating-data gap. Without a balance sheet, burn rate, debt schedule, funded backlog, or
              use-of-proceeds detail by work package, runway and next-round triggers cannot be calculated. The financial
              verdict is therefore track rather than underwrite: demand signals and financing access are meaningful, but
              revenue quality, margin path, and capital sufficiency remain material diligence blockers.
            claimRefs:
              - CI006
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The key financial question is conversion
            body: >-
              Public evidence supports access to defense demand and announced financing, but it does not show how many
              awards are funded, when milestones bill, or whether production economics can produce cash before the next
              financing need.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI010
              - CI013
          - type: callout
            title: Require program-level underwriting before valuation
            body: >-
              Before relying on the proposed valuation, obtain funded backlog, contract economics, post-close cash after
              redemptions and transaction costs, monthly burn, capex, debt, and a mission-by-mission path to gross
              profit.
            calloutType: recommendation
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Ranger is positioned as a multi-operations orbital transfer vehicle rather than a payload that remains in
              one fixed slot. Satellite Today describes a customer workflow in which a launch provider performs initial
              insertion and Ranger completes last-mile transport to geostationary or cislunar destinations, allowing the
              delivered spacecraft to preserve its own propellant for operations. The reported design capacity is more
              than 1.5 metric tons directly to GEO and more than 2.5 metric tons in cislunar space. Four 24-inch modular
              ports are intended to support payloads ranging from cubesats to 500-kilogram smallsats. These are product
              specifications and intended workflow benefits, not verified evidence of completed Ranger deliveries or
              realized customer savings.
            claimRefs:
              - CE001
