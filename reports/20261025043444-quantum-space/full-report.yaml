      - number: '4.2'
        title: Pricing, cost structure, and unit economics
        blocks:
          - type: paragraph
            body: >-
              No public source in the assigned pool provides a customer price list, realized spacecraft price, contract
              gross margin, contribution margin, CAC, payback period, utilization, or recurring service rate. The
              official funding release says the Series A extension was directed to hardware development, team scaling,
              and contracting, while the company later described proceeds from the proposed transaction as funding
              Ranger production and manufacturing expansion. That is consistent with a hardware- and program-delivery
              cost base, but it does not establish a margin path. Management's claim of up to 70% lower cost than
              conventional architectures is an internal estimate, not a realized customer price or audited cost
              advantage. The financial model should keep revenue, gross profit, and cash conversion as unavailable until
              contracts, labor and supplier costs, launch costs, and acceptance terms are disclosed.
            claimRefs:
              - CI005
