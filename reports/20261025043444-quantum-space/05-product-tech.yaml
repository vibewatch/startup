company:
  name: Quantum Space
chapter:
  number: 5
  title: Product & Technology
  summary: Quantum Space is developing Ranger as a maneuverable, modular orbital-transfer platform for GEO, cislunar, defense, and commercial missions. Public evidence defines an ambitious propulsion, payload, and manufacturing architecture, but the company's own June 2026 disclosure says Ranger remained unmanufactured, unoperated, and unsold, leaving flight maturity and reliability as core diligence gaps.
sections:
  - id: product-and-customer-workflow
    title: Product definition and customer workflow
    body: >-
      Ranger is positioned as a multi-operations orbital transfer vehicle rather
      than a payload that remains in one fixed slot. Satellite Today describes a
      customer workflow in which a launch provider performs initial insertion and
      Ranger completes last-mile transport to geostationary or cislunar
      destinations, allowing the delivered spacecraft to preserve its own
      propellant for operations. The reported design capacity is more than 1.5
      metric tons directly to GEO and more than 2.5 metric tons in cislunar
      space. Four 24-inch modular ports are intended to support payloads ranging
      from cubesats to 500-kilogram smallsats. These are product specifications
      and intended workflow benefits, not verified evidence of completed Ranger
      deliveries or realized customer savings.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-production
    title: Architecture, interfaces, and production model
    body: >-
      The public architecture combines a large storable-propellant load,
      single-fuel multi-mode propulsion, refuelability, and standardized payload
      interfaces. Quantum Space states 4,000 kilograms of fuel, 12 km/s maximum
      delta-V, and up to 15 years on station. Those metrics describe the intended
      operating envelope; the assigned evidence does not provide qualification
      reports, duty cycles, mass budgets, or on-orbit refueling results. The
      planned production model is distributed. Quantum Space says Tulsa will
      manufacture large propulsion tanks and precision spacecraft parts,
      complementing propulsion integration and testing in Hawthorne and
      engineering and mission development in Rockville. Tulsa initial operational
      capability is targeted for Q1 2027, so production scale remains a roadmap
      milestone rather than demonstrated fleet throughput.
    claimRefs: [CE005, CE006, CE007, CE008, CE009, CE010, CE011]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-and-market-dependencies
    title: Maturity, deployment, and ecosystem dependencies
    body: >-
      The strongest current maturity evidence is cautionary. Aviation Week called
      Ranger an in-development vehicle in 2023, while Quantum Space's own June
      2026 transaction disclosure stated that Ranger was still in development and
      had not been manufactured, operated, or sold. This sharply separates
      detailed design claims from flight-proven capability. The broader servicing
      ecosystem is also early: Payload reported that contracts remain largely
      bespoke and one-off, and DARPA described its separate 2026 RSGS launch as a
      demonstration intended to prove commercial viability for GEO servicing.
      Those external programs validate the strategic relevance of servicing and
      mobility, but they do not validate Ranger. Underwriting therefore depends
      on Ranger-specific qualification, launch, maneuver, payload-interface, and
      refueling evidence.
    claimRefs: [CE012, CE013, CE014, CE015]
  - id: trust-safety-and-quality
    title: Trust, safety, security, and quality controls
    body: >-
      Public evidence in the assigned pool does not describe Ranger-specific
      cybersecurity architecture, software-assurance practices, safety
      certification, reliability statistics, supplier redundancy, or production
      acceptance yields. This is material for a defense-oriented spacecraft that
      is expected to maneuver autonomously, handle storable propellant, integrate
      third-party payloads, and operate for years. Quantum Space's transaction
      communication itself identifies safety performance, security incidents,
      launch failures, dangerous materials, and product defects as risks. That
      disclosure demonstrates awareness, not control effectiveness. Diligence
      should require security plans, hazard analyses, environmental and
      propulsion qualification matrices, software verification records,
      non-conformance data, and supplier-continuity evidence before treating the
      platform as deployment-ready.
    claimRefs: [CE016]

