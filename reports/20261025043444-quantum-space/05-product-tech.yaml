      - [Refueling, "Intended to replenish Ranger in orbit", "Compatible depot or servicer plus safe rendezvous and transfer", "No Ranger refueling demonstration is established"]
      - [Payload interface, "Four 24-inch modular ports", "Mechanical, electrical, software, and environmental compatibility", "Interface-control and qualification records are unavailable"]
      - [Ground production, "Tulsa tanks and precision parts; Hawthorne integration and test", "CNC, welding, inspection, pressure testing, and suppliers", "Tulsa capability is targeted for Q1 2027"]
      - [Mission operations, "Long-duration multi-orbit maneuver and payload delivery", "Navigation, command, communications, cyber controls, and support", "Operational reliability and control effectiveness are not disclosed"]
    notes: "Dependencies and risks are diligence implications from the disclosed architecture; they are not evidence that a failure or incident has occurred."
    claimRefs: [CE004, CE005, CE006, CE007, CE008, CE009, CE010, CE011, CE016]

figures:
  - id: FE001
    title: Ranger product architecture map
    type: stack
    summary: Ranger's public product concept links payload delivery, modular interfaces, maneuvering, endurance, and distributed production into one orbital-mobility platform.
    data:
      layers:
        - label: Mission outputs
          detail: Intended payload delivery and repositioning outcomes for GEO and cislunar missions.
          items:
            - label: GEO delivery
              detail: Reported capacity exceeds 1.5 metric tons directly to GEO.
            - label: Cislunar delivery
              detail: Reported capacity exceeds 2.5 metric tons in cislunar space.
        - label: Payload integration
          detail: Standardized interfaces are intended to make Ranger mission-configurable.
          items:
            - label: Four modular ports
              detail: Each port is described as 24 inches.
            - label: Payload range
              detail: Reported support extends from cubesats to 500-kg smallsats.
        - label: Mobility
          detail: Propulsion is intended to support transfer and repeated orbital maneuver.
          items:
            - label: Single-fuel multi-mode propulsion
              detail: One disclosed architecture is intended to serve multiple maneuver regimes.
            - label: 12 km/s maximum delta-V
              detail: This is a current company-stated design metric, not a verified flight result.
        - label: Endurance
          detail: Stored propellant and refueling are intended to extend useful maneuver life.
          items:
            - label: 4,000 kg fuel
              detail: Current company-stated fuel capacity.
            - label: Up to 15 years
              detail: Company-stated on-station objective subject to qualification and operation.
        - label: Production
          detail: Distributed sites divide engineering, propulsion integration, testing, and component production.
          items:
            - label: Tulsa
              detail: Planned tank and precision-parts manufacturing.
            - label: Hawthorne and Rockville
              detail: Propulsion integration and test plus engineering and mission development.
        - label: Qualification and operations
          detail: Flight, refueling, reliability, safety, security, and support evidence must connect the design to deployment.
          items:
            - label: Current maturity
              detail: The company stated in June 2026 that Ranger had not been manufactured, operated, or sold.
            - label: Diligence proof
              detail: Qualification records and independently observed mission results remain required.
    approximationNotes: "The stack is a qualitative architecture map; layer order does not represent physical size, cost, maturity, or performance."
    claimRefs: [CE002, CE003, CE004, CE005, CE006, CE007, CE008, CE009, CE010, CE011, CE013]

callouts:
  - calloutType: strength
    title: Coherent platform architecture
    body: Ranger combines orbital transfer, standardized payload interfaces, high maneuverability, and refuelable endurance in one product thesis that could serve several mission classes if qualification succeeds.
    claimRefs: [CE001, CE004, CE005, CE006, CE007, CE008]
  - calloutType: risk
    title: Design detail exceeds operational proof
    body: Quantum Space disclosed in June 2026 that Ranger was still in development and had not been manufactured, operated, or sold, while broader servicing activity remains dominated by bespoke demonstrations.
    claimRefs: [CE013, CE014, CE015]

