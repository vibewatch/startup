company:
  name: Quantum Space
chapter:
  number: 1
  title: Company Overview
  summary: Quantum Space is a Rockville-based space-defense company developing the Ranger maneuverable spacecraft platform for national-security and commercial missions. The current refresh confirms a distributed manufacturing buildout, a planned Prime pathfinder mission, and a proposed SPAC transaction, while flight proof, funded backlog, operating scale, and final transaction outcomes remain unresolved.
sections:
  - id: identity-and-platform
    title: Identity, platform, and operating footprint
    body: Quantum Space describes itself as building agile, maneuverable spacecraft for national-security, civil, and commercial space operations. Its Ranger platform is presented as a multi-orbit spacecraft architecture spanning LEO, MEO, GEO, and cislunar operations, with single-fuel, multi-mode propulsion, modular and refuellable architecture, and long-duration station-keeping as the core product thesis. These are primarily company-stated design objectives rather than independently demonstrated operating results. The company identifies engineering and mission development in Rockville, Maryland, propulsion integration and testing in Hawthorne, California, and a Tulsa manufacturing facility being developed to expand production. The Oklahoma Department of Commerce reported that the Tulsa site is expected to begin modifications in July 2026 and target initial operational capability in Q1 2027, so the footprint is an execution plan rather than proof of scaled manufacturing.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and dependency
    body: The disclosed leadership story is concentrated around co-founder and Executive Chairman Kam Ghaffarian and CEO Jim Bridenstine, appointed in May 2026. The SPAC announcement highlights Ghaffarian's role in founding the company and Bridenstine's prior service as NASA Administrator, naval aviator, and member of Congress. The September launch-processing announcement identifies Kerry Wisnosky as President and quotes him on Prime execution, while the 2025 mission article identifies Richard Matlock as Senior Vice President for National Security Space Programs and Phil Bracken as Chief Technology Officer. This provides evidence of functional coverage across executive, program, national-security, and technical roles, but the assigned evidence does not disclose a complete board roster, ownership schedule, succession plan, or retention arrangements. Key-person dependence is therefore material, particularly because the public narrative ties strategy and government-market credibility to a small number of named leaders.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: financing-and-commercialization
    title: Financing, commercialization, and transaction status
    body: Quantum Space announced a definitive business combination agreement with Inflection Point Acquisition Corp. VI on June 8, 2026. The company release described a $300 million PIPE, approximately $600 million pre-money equity value, and approximately $1.2 billion post-transaction equity value assuming no public-shareholder redemptions; these are transaction terms and management disclosures, not realized cash, revenue, or ARR. Independent coverage also states that the transaction remained subject to shareholder approval and customary closing conditions and that the Andromeda vehicle's $6.2 billion ceiling is shared across 14 awardees. The company release explicitly says no specific amount of Andromeda funding had yet been allocated to Quantum Space. The evidence does not establish current revenue, cash balance, total lifetime capital raised, funded backlog, customer count, or post-close dilution, so those fields remain diligence gaps rather than zeros.
    claimRefs: [CO009, CO010, CO011, CO012]
    tableRefs: [TO003]
  - id: milestones-and-risks
    title: Milestones, execution gates, and unresolved risks
    body: "Recent milestones show progression from financing and executive transition toward manufacturing and flight preparation: the company announced the SPAC transaction in June 2026, described a Tulsa manufacturing plan in May 2026, and in September 2026 announced a specific launch-processing work order for Prime. Prime is described as a pathfinder mission for Ranger and Scout, with a Systems Integration Review completed and a target launch in the second half of 2027. The assigned sources also preserve execution risks rather than treating plans as outcomes: the company says Ranger has not yet been manufactured, operated, or sold; launch delays, launch failures, defects, safety incidents, supplier/counterparty failures, funding changes, and transaction failure are identified risks. A 2025 source reported an earlier June 2026 target for Ranger Prime, so the later second-half-2027 target is a material schedule change and should be tracked as a current plan, not proof of a completed launch."
    claimRefs: [CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Government-market positioning with tangible buildout
    body: The company combines a stated national-security mission, six contracts and pending proposals disclosed in the transaction materials, and a physical manufacturing and launch-processing plan. The evidence supports strategic traction and infrastructure formation, but not yet funded backlog conversion or flight-proven performance.
    claimRefs: [CO003, CO009, CO013]
  - calloutType: risk
    title: Valuation and execution remain ahead of proof
    body: The approximately $1.2 billion post-transaction value assumes no redemptions, while Ranger remains in development and Prime has not yet flown. Diligence should reconcile transaction mechanics, funded program value, schedule changes, and mission-readiness evidence before treating the announced valuation as supported by operating results.
    claimRefs: [CO010, CO014, CO016]
