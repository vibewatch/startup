  - calloutType: strength
    title: Broad platform thesis
    body: "Ranger combines multi-orbit maneuver, modular payload hosting, refuelability, and long-duration operation in one proposed platform."
    claimRefs: [CP001, CP005, CP006]
  - calloutType: risk
    title: First-flight proof remains ahead
    body: "Ranger Prime is the first Ranger flight, and Quantum's current no-earlier-than-spring-2027 schedule supersedes the June 2026 timing reported in 2025."
    claimRefs: [CP002, CP004]
  - calloutType: recommendation
    title: Underwrite task orders, not ceilings
    body: "Treat Andromeda eligibility and the unweighted pipeline as access indicators until funded allocations, realized pricing, and repeat orders are disclosed."
    claimRefs: [CP010, CP013, CP014]
