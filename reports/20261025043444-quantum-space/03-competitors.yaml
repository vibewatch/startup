      - ["Andromeda access", "Company reports a shared $6.2B IDIQ ceiling across 14 awardees and no Quantum allocation", "Competition for future maneuverable-spacecraft work", "Preserves buyer choice among multiple awardees", "Funded task orders, award share, and conversion timing"]
      - ["SpaceLogistics RSGS", "Government-private partnership; customer price not disclosed", "Robotic GEO servicing and relocation", "Government demonstration can reduce integration risk", "Commercial service price, cadence, and post-demo demand"]
      - ["Astroscale / Orbit Fab", "No comparable public price in assigned evidence", "Life extension, de-orbit, or refueling specialization", "Narrow service may be purchased separately or multi-homed", "Mission price, repeat volume, interfaces, and margin"]
      - ["Fixed-orbit replacement or internal build", "No comparable lifecycle cost in assigned evidence", "Replacement asset or bespoke mission", "Familiar procurement may outweigh broader platform flexibility", "Like-for-like lifecycle cost and mission-performance comparison"]
