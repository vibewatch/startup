      - ["Government-contract funding, protests, and counterparty performance", "United States", "Contracts/proposals disclosed; allocated funding not disclosed for Andromeda", "Medium", "High", "Track award notices, funded task orders, protests, and prime-contractor obligations.", "High", "Request contract-by-contract funding, milestones, termination rights, and protest history."]
      - ["Safety, security, hazardous-material, and launch regulation", "United States", "Risk disclosures identify energetic materials, dangerous chemicals, safety incidents, and launch risks", "Medium", "Critical", "Complete environmental testing, launch-site reviews, safety controls, and security procedures.", "High", "Review safety case, incident register, export/licensing status, and hazardous-material controls."]
    notes: Sources are a partial public-risk enumeration as of 2026-10-25; several obligations and contract terms remain private or prospective.
