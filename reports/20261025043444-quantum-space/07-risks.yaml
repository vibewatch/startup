    title: Quantum Space risk heatmap
    type: matrix
    summary: Execution and financing risks remain in the high-impact, medium-to-high-likelihood quadrant until flight and transaction milestones are completed.
    data:
      columns: [Impact, Likelihood, Mitigation maturity, Residual severity]
      rows:
        - label: Ranger Prime launch or orbital failure
          values: [Critical, Medium, Developing, Critical]
        - label: Unvalidated refueling and endurance claims
          values: [Critical, Medium, Developing, High]
        - label: SPAC closing, redemption, or dilution shortfall
          values: [Critical, Medium, Developing, High]
        - label: Government funding or contract timing
          values: [High, Medium, Developing, High]
        - label: Supplier / launch-site dependency
          values: [High, Medium, Developing, High]
        - label: Safety, hazardous-material, or security incident
          values: [Critical, Low-to-medium, Developing, High]
    claimRefs: [CR001, CR004, CR007, CR009, CR012, CR014]
callouts:
  - calloutType: risk
    title: Flight proof is the central kill criterion
    body: The thesis should be re-underwritten if Ranger Prime misses its targeted launch window without a funded recovery plan, or if the mission fails to demonstrate the performance and safety standards on which the platform's economics depend.
    claimRefs: [CR001, CR003, CR004, CR014]
  - calloutType: assumption
    title: Announced capital is not cash available
    body: The proposed valuation, trust proceeds, and PIPE are transaction terms subject to closing conditions, shareholder redemptions, financing conditions, and dilution; they should not be treated as current cash runway.
    claimRefs: [CR007, CR008, CR009, CR010]
