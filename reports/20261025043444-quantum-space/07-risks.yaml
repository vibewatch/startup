    claimRefs: [CR001, CR002, CR006, CR007, CR012, CR013, CR014, CR015]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, likelihood, severity, mitigation maturity, residual exposure, unresolved gap]
    rows:
      - ["Ranger Prime delayed or fails launch/orbital insertion", "Medium", "Critical", "Launch processing agreement and Systems Integration Review are in place; flight proof is pending.", "High", "No public environmental-test results or successful flight evidence."]
      - ["Ranger design claims fail in operation", "Medium", "Critical", "Prototype and demonstration work are planned; design claims remain unvalidated.", "High", "No public proof of 4,000+ kg capacity, refueling, 15-year life, or cost target in operation."]
      - ["Manufacturing, supplier, or integration bottleneck", "Medium", "High", "Tulsa manufacturing center and multiple facilities are being developed; specialized partners support processing.", "High", "Capacity, redundancy, yield, schedule, and supplier concentration are undisclosed."]
      - ["Cybersecurity or facility security incident", "Low-to-medium", "High", "Mission-management infrastructure and security requirements are identified; controls are not publicly detailed.", "Medium-high", "Request security architecture, certifications, incident history, and recovery tests."]
    notes: Risk ratings are analytical judgments anchored to disclosed failure modes and announced mitigations; they are not company-provided probabilities.
    claimRefs: [CR001, CR002, CR003, CR004, CR012, CR013, CR014]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, counterparty, role, concentration, failure scenario, severity, mitigation, residual exposure]
    rows:
      - ["Launch processing and site operations", "All Points Logistics / Vandenberg Space Force Base", "Clean-room, propellant servicing support, safety reviews, ground support, and transport", "Mission-specific work order; public alternatives not established", "Processing delay or partner failure delays Prime", "High", "Master Services Agreement plus mission-specific work order", "High"]
      - ["Government demand and funding", "DoD, Space Force, DARPA, AFRL", "Primary disclosed contract and proposal ecosystem", "High relative to commercial proof", "Award funding is delayed, reduced, protested, or not converted into task orders", "High", "Multiple agencies and programs reduce single-program dependence, but funded diversification is unverified.", "High"]
      - ["Mission-management software", "Quindar", "Secure, scalable infrastructure for commercial and government missions", "Named provider; redundancy not disclosed", "Platform outage or integration failure affects operations", "Medium", "Selection of a dedicated mission-management service", "Medium-high"]
      - ["Capital markets and transaction funding", "Inflection Point Acquisition Corp. VI and PIPE investors", "SPAC closing, trust proceeds, and PIPE financing", "Transaction-dependent", "Redemptions, failed vote, financing or listing failure reduce capital", "Critical", "Definitive agreement and announced PIPE commitments", "High"]
    notes: Public sources identify counterparties and roles but do not disclose concentration percentages, backup suppliers, or enforceable funding availability.
    claimRefs: [CR007, CR008, CR009, CR010, CR011, CR012, CR016]
figures:
