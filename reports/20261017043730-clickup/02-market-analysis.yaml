  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: A third-party TAM, SAM, or SOM model for work-management software that isolates ClickUp's addressable segments by geography and buyer type.
      whyItMatters: Without a bounded market model, valuation and growth expectations have to lean on proxies instead of a defendable demand denominator.
      diligencePath: Obtain analyst market maps or management-provided sizing that bridge category spend, seat assumptions, and ClickUp's target segments.
      relatedQuestionRefs: [QM002, QM008]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: buyer-economics
      missingEvidence: Free-to-paid conversion, plan mix, net revenue retention, and seat expansion by customer segment.
      whyItMatters: Public pricing ladders show monetization paths, but they do not reveal whether breadth converts into efficient revenue growth across segments.
      diligencePath: Request board-grade cohort data or investor materials that break revenue, expansion, and churn by plan and customer type.
      relatedQuestionRefs: [QM003, QM004]
    - type: missing-source
      severity: minor
      topic: enterprise-penetration
      missingEvidence: Independent disclosure of active seat depth or spend behind the "85% of Fortune 500" enterprise-reach claim.
      whyItMatters: Enterprise-logo penetration sounds strong, but investors still need to know whether those accounts are deep platform rollouts or lightweight departmental footprints.
