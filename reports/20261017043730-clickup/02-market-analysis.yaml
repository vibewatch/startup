  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Individual or very small team
        - Founder or team lead
        - Solo contributor or a small project team
        - Same person as buyer
        - Basic task tracking, docs, and lightweight collaboration
        - Departmental or personal productivity budget
        - Free Forever makes it easy to test consolidation without procurement
      - - Startup, agency, or SMB team
        - Ops lead, product lead, or agency owner
        - Cross-functional contributors
        - Department head or ops leader
        - Client delivery, sprint planning, campaign execution, and shared reporting
        - Functional operating budget
        - Outgrowing a patchwork of simpler tools and wanting one configurable workspace
      - - Mid-market operations or PMO
        - PMO leader, ops director, or transformation owner
        - Multiple departments sharing workflows and dashboards
        - COO, ops, or transformation budget
        - Standardized cross-team execution with automations, dashboards, and governance
        - Central operations or PMO budget
        - Need for shared visibility and repeatable process control
      - - Enterprise or regulated account
        - IT, security, procurement, and a business sponsor
        - Business units plus admins and workspace owners
        - Central IT or enterprise software budget
        - Standardized enterprise work management with SSO, permissions, and compliance review
        - CIO, IT, security, or procurement
        - Requirement for governance and contract-backed enterprise controls
    notes: >-
      Buyer and budget-owner fields are inferred from plan packaging, review commentary, and
      compliance requirements rather than from customer-level procurement disclosures.
    claimRefs: [CM003, CM005, CM006, CM010, CM012]
figures:
  - id: FM001
    title: Adoption proof pyramid
    type: pyramid
    summary: >-
      Public evidence supports a layered adoption-proof lens for ClickUp, but not a formal
      TAM/SAM/SOM model.
    data:
      items:
        - label: Consolidation scope
          displayValue: 100+ products
          note: Official positioning for the breadth of software ClickUp says it can replace
        - label: Public review footprint
          displayValue: 10,000+ G2 users
          note: Company-cited social proof rather than paid-customer count
        - label: Independent review base
          displayValue: 4,639 verified reviews
          note: Software Advice review volume shows broad evaluation and usage visibility
        - label: Economic proof point
          displayValue: 384% ROI over three years
          note: Value case cited by ClickUp, not an independent market-size estimate
        - label: Productivity proof point
          displayValue: 92,400 hours saved
          note: Company-presented third-party savings proxy
        - label: Enterprise validation
          displayValue: 85% of Fortune 500 companies
          note: Enterprise reach proxy without seat or revenue depth
    approximationNotes: >-
      This is an evidence-constrained adoption pyramid rather than a TAM/SAM/SOM stack because the
      retained public sources disclose proxies for breadth, adoption, ROI, and enterprise
      penetration but not addressable-market dollars, seat counts, or conversion by segment.
    claimRefs: [CM001, CM007, CM013, CM015]
callouts:
  - calloutType: insight
    title: Consolidation is the core demand thesis
    body: >-
      The consistent buy case across official and independent sources is not a single killer feature
      but the chance to replace several disconnected work tools with one configurable workspace.
    claimRefs: [CM008, CM009, CM013]
  - calloutType: risk
    title: Breadth enlarges the pitch but weakens clean market sizing
    body: >-
      ClickUp's appeal broadens the buyer universe, but the same breadth raises setup and governance
      costs and leaves public TAM/SAM/SOM evidence too thin for a precise market model.
    claimRefs: [CM010, CM011, CM014]
