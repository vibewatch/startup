  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Current ARR or revenue bridge, NRR, gross margin, burn, runway, and debt disclosures.
      whyItMatters: These metrics determine whether ClickUp's breadth and AI story are translating into durable business quality rather than expensive expansion.
      diligencePath: Request current management reporting or lender or investor materials that show growth quality and cash efficiency.
      relatedQuestionRefs: [QV002, QV008, QV009]
    - type: missing-source
      severity: material
      topic: price-discovery
      missingEvidence: Any 2025-2026 primary round, secondary mark, tender price, or board-approved 409A context tied to the current cap table.
      whyItMatters: The last disclosed public valuation anchor is from 2021, so a current entry cannot be judged fairly without fresh price discovery and term context.
      diligencePath: Obtain recent financing materials, secondary transaction data, or board valuation summaries with preference-stack detail.
      relatedQuestionRefs: [QV001, QV006, QV007, QV008]
    - type: missing-source
      severity: minor
      topic: exit-readiness
      missingEvidence: Current evidence on IPO readiness, executive bench durability, and public-company operating discipline beyond anecdotal staffing or product narratives.
      whyItMatters: Exit timing drives return timing, but the retained evidence only partially addresses whether ClickUp is preparing for a public-market standard of disclosure and governance.
      diligencePath: Request current executive roster changes, audit readiness status, and board materials on financing or IPO preparedness.
      relatedQuestionRefs: [QV009, QV010]
