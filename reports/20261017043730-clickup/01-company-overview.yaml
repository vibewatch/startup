callouts:
  - calloutType: "risk"
    title: "Scale metrics are directionally strong but not decision-grade"
    body: >-
      The public story is clearly large-scale, but the retained evidence mixes
      teams, users, and paying-customer proxies. That makes the direction
      useful and the denominator unstable.
    claimRefs: ["CO007", "CO014", "CO015"]
  - calloutType: "insight"
    title: "AI attach rate is the clearest current monetization signal"
    body: >-
      The best current operating signal is not raw user count but how often AI
      shows up in new sales-led deals and how much it expands ticket size.
    claimRefs: ["CO008"]
