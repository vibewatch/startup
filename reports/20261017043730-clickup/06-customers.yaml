      severity: material
      topic: retention-metrics
      missingEvidence: Board-grade NRR, GRR, gross logo churn, renewal rates, and cohort retention by segment.
      whyItMatters: Without retention data, the chapter can support product-market fit and adoption breadth but not customer durability or expansion quality.
      diligencePath: Request monthly and annual cohort tables by customer size, including logo churn, seat expansion, and renewal cadence.
      relatedQuestionRefs: [QU008]
    - type: missing-source
      severity: material
      topic: named-deployment-proof
      missingEvidence: Named production customers with deployment scope, start date, outcome, and renewal or expansion evidence.
      whyItMatters: Logo-level or reviewer-level proof does not replace verifiable reference accounts when underwriting enterprise readiness.
      diligencePath: Request five to ten current customer references across SMB, mid-market, and enterprise, plus signed case studies or procurement records.
      relatedQuestionRefs: [QU004]
      relatedTableRefs: [TU003]
