figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      The retained sources imply a customer path that begins with simple team
      trials, expands through workflow design, and only works at larger scale
      when the buyer can absorb governance and rollout complexity.
    data:
      items:
        - label: Trial and first workspace
          actor: "Freelancer / small team"
          touchpoints:
            - "Free plan or simple project start"
            - "Tasks, docs, and basic coordination in one place"
          note: "Entry looks easiest when a buyer starts small and avoids turning on every feature at once."
          tone: positive
        - label: Workflow design
          actor: "Project or operations lead"
          touchpoints:
            - "Spaces, Folders, Lists, statuses, and custom fields"
            - "Hierarchy planning before scale-up"
          note: "Rollout quality depends on deliberate workspace design rather than default settings."
          tone: neutral
        - label: Department rollout
          actor: "Agency or service-team manager"
          touchpoints:
            - "Time tracking"
            - "Workload and portfolio views"
            - "Recurring delivery workflows"
          note: "Services-heavy teams get especially clear value from workload and utilization tooling."
          tone: positive
        - label: Cross-functional standardization
          actor: "PMO / operations / remote-hybrid team"
          touchpoints:
            - "Docs, dashboards, automations, and shared visibility"
            - "Replacing overlapping work-management tools"
          note: "Third-party reviews repeatedly frame ClickUp as strongest when several workflows are consolidated."
          tone: positive
        - label: Enterprise land
          actor: "Large organization / initiative sponsor"
          touchpoints:
            - "Transparency across departments"
            - "Strategic-initiative coordination"
            - "Fortune 500 credibility claim"
          note: "Enterprise reach is publicly marketed, but named deployment depth is still missing."
          tone: neutral
        - label: Expansion friction loop
          actor: "Admin plus end users"
          touchpoints:
            - "Learning curve and setup time"
            - "Performance and notification friction"
            - "Plan-wide pricing complexity"
          note: "Expansion depends on whether the buyer can absorb governance, onboarding, and pricing overhead."
          tone: risk
    approximationNotes: null
    claimRefs: [CU006, CU007, CU008, CU010, CU011, CU012, CU013, CU015]
callouts:
  - calloutType: risk
    title: Durability is still the missing proof layer
    body: >-
      The public record shows real usage and broad segment fit, but it does not
      yet show verified NRR, GRR, churn, renewal, or concentration metrics, so
      the customer-quality call remains materially under-evidenced.
    claimRefs: [CU003, CU004, CU014, CU015]
