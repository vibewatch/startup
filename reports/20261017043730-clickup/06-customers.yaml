      - ["Enterprise reach claim", "85%of Fortune 500 companies", "Current homepage", "ClickUp homepage", medium, "Supports enterprise brand reach and top-of-funnel credibility", "Named logos, department scope, and production depth are not disclosed"]
      - ["Time to ROI", "11 months", "2026", "G2 article", medium, "Implies measurable value realization for adopted accounts", "Cohort size, use case mix, and exact ROI calculation are not disclosed"]
