      - [ONES overview, "Free plus paid tiers confirmed; no per-seat dollar disclosed in excerpted table", Business tier confirmed, Enterprise tier confirmed, "No standalone AI price disclosed in the retained excerpt"]
    notes: >-
      Third-party 2026 reviews do not agree on plan names or published prices, so this table is best read as a pricing
      snapshot range rather than a definitive current rate card.
    claimRefs: [CI002, CI003, CI004]
  - id: TI003
    title: Unit-economics proxies and missing underwriting inputs
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["ARR (Sep. 2025)", "$300M", Medium, "Best recent scale datapoint tying product breadth to recurring software revenue", "Provide monthly ARR bridge from Sep. 2025 to present"]
      - ["AI attach on new sales-led deals", "40%+ of new deals include AI", Medium, "Suggests expansion revenue and higher ACV from AI upsell", "Disclose attach rate by segment and cohort renewals"]
      - ["AI deal-size uplift", "7x larger average sales-led deal size when AI is included", Medium, "Indicates AI may improve payback even if base seat pricing stays competitive", "Show gross margin and sales efficiency for AI-attached vs non-AI cohorts"]
      - ["Customer ROI / payback proxy", "384% ROI; $3.9M revenue increase; payback <6 months for commissioned composite customer", High, "Buyer ROI evidence can support enterprise close rates but is not the same as ClickUp margin", "Provide audited customer ROI cohorts and referenceable case studies by segment"]
      - ["Gross margin, burn, runway, debt", null, Low, "Missing core inputs block capital-adequacy underwriting and margin-path judgment", "Disclose latest cash, burn, runway, debt, and covenant package"]
    notes: >-
      Public unit-economics evidence mixes company-commissioned ROI claims, company-linked ARR disclosures, and external
      syntheses; null means the assigned source pool did not disclose a current public value.
    claimRefs: [CI005, CI006, CI007, CI009, CI014, CI015]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      ClickUp's public monetization path starts with free-team adoption, upgrades into paid seat tiers, and layers AI
      add-ons on top of the core workspace contract.
    data:
      nodes:
        - id: free-teams
          label: Free teams
          value: "5M+ teams / wide top-of-funnel"
          valueNote: "Team count includes free workspaces, not just paying customers."
        - id: paid-seats
          label: Paid seat plans
          value: "Free → paid seat conversion"
          valueNote: "Multiple 2026 reviews describe a free-to-paid per-seat ladder."
        - id: plan-upgrades
          label: Business / Enterprise upgrades
          value: "Governance, security, reporting"
          valueNote: "Custom enterprise pricing obscures realized ASP in public evidence."
        - id: ai-addons
          label: AI add-ons
          value: "Brain $9 / Everything AI $28"
          valueNote: "AI is sold separately from the base workspace in retained 2026 reviews."
        - id: larger-deals
          label: Larger sales-led deals
          value: "7x when AI included"
          valueNote: "Company-linked Sept. 2025 disclosure via SQ Magazine."
        - id: arr
          label: Recurring revenue
          value: "$300M ARR disclosed Sep. 2025"
          valueNote: "Latest public recurring-revenue datapoint in the assigned source pool."
      edges:
        - from: free-teams
          to: paid-seats
          label: Convert teams that outgrow the free plan
        - from: paid-seats
          to: plan-upgrades
          label: Upgrade for controls, storage, and reporting
        - from: plan-upgrades
          to: ai-addons
          label: Cross-sell AI into larger accounts
        - from: ai-addons
          to: larger-deals
          label: Raise ACV in sales-led motion
        - from: larger-deals
          to: arr
          label: Improves recurring revenue mix and scale
    approximationNotes: >-
      This is a qualitative bridge based on retained public evidence rather than a reconciled financial waterfall; it
      shows mechanism, not revenue contribution by stream.
    claimRefs: [CI001, CI003, CI005, CI006]
