      severity: material
      topic: capital-adequacy
      missingEvidence: Current board-grade cash balance, monthly burn, runway, debt facilities, covenant package, and any planned financing milestones.
      whyItMatters: Without liquidity disclosure, investors cannot judge whether ClickUp's AI and go-to-market expansion are self-funded or financing-dependent.
      diligencePath: Request the latest board package or financing memo with cash, burn, debt, and 18-24 month runway scenarios.
      relatedQuestionRefs: [QI006]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: material
      topic: margin-visibility
      missingEvidence: Current gross margin, hosting and support-cost intensity, professional-services mix, and working-capital profile.
      whyItMatters: Margin structure determines whether ARR growth is creating durable software economics or masking rising delivery costs.
      diligencePath: Request current gross-margin bridge, cloud cost trends, support headcount allocation, and any services revenue mix.
      relatedQuestionRefs: [QI006]
      relatedTableRefs: [TI001, TI003]
    - type: stale
      severity: material
      topic: pricing-realization
      missingEvidence: Current realized pricing, discount policy, seat expansion by cohort, and AI attach revenue by segment.
      whyItMatters: Public list prices and review snapshots do not show actual ASP, enterprise discounting, or whether AI upsell is durable at renewal.
      diligencePath: Request current SKU sheet, median discount ranges, cohort-based AI attach, and renewal/expansion data by customer segment.
      relatedQuestionRefs: [QI001, QI002, QI004]
      relatedTableRefs: [TI001, TI002, TI003]
