      - number: '4.2'
        title: 牵引力与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              最好的公开牵引力数据不是 GAAP 收入，而是 ClickUp 2025 年 9 月披露的 ARR。SQ Magazine 对公司 BusinessWire 公告的整理称，ClickUp ARR 达到 $300
              million，用户超过 2000 万，每月团队注册超过 800,000；同时披露 AI 销售同比增长 400%、AI 使用量增长 800%，包含 AI 时销售驱动交易的平均规模大 7 倍，超过 40%
              的新销售驱动交易包含 AI。这些是有用的变现信号，因为它们把产品广度连接到具体的销售切入点：在企业销售中，AI
              似乎正在提高交易规模和附加率。面向客户的官方证据仍偏营销，不足以支撑投资判断，但它强化了买家可以靠效率收益证明支出合理的说法：ClickUp 称一项委托 Forrester 研究发现，综合客户实现 384%
              ROI、收入增加 $3.9 million、节省 92,400 小时，并在六个月内回本。综合来看，这些数据点显示出真实的扩张潜力，但不能替代披露的净留存率、CAC、销售周期或按 cohort 划分的毛留存率。
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
