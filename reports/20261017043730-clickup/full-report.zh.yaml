          - type: callout
            title: AI 可能加深护城河，也可能抹平护城河
            body: ClickUp 正在明确围绕 AI 杠杆重组，但同一动作既可能靠自动化扩大差异化，也可能在买家认为编排层可在别处复刻时加速商品化。
            calloutType: insight
            claimRefs:
