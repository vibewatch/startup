  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 公开上行空间建立在产品覆盖面和变现潜力之上，但过时的估值锚点与尚未解决的尽调缺口，阻止我们作出买入判断。
    data:
      nodes:
        - id: breadth
          label: 产品覆盖面
          value: 100+ products; tasks, docs, chat, whiteboards, dashboards, AI agents
          tone: positive
          note: 如果客户确实整合工具，公司主导的定位便能支撑溢价故事。
        - id: monetization
          label: 变现杠杆
          value: $7 Unlimited, $12 Business, $9 Brain, $28 Everything AI
          tone: positive
          note: AI 定价创造上行空间，但也推高了席位的全包成本。
        - id: scale
          label: 公开规模证明
          value: $150M revenue (2022), 100k paying customers, ~$300M ARR
          tone: positive
          note: 足以证明公司有实际业务，但不足以证明当前增长质量。
        - id: valuation
          label: 过时的估值锚点
          value: $400M Series C at $4B in October 2021
          tone: risk
          note: 相对于 2026 年决策日，最近一次披露的估值已显陈旧。
        - id: frictions
          label: 压缩风险
          value: Setup burden, AI loaded cost, privacy/security concern
          tone: risk
          note: 负面信号来自独立评价和竞品评价，而非公司材料。
        - id: call
          label: 建议
          value: research-more / stretched / high risk
          tone: neutral
          note: 等待新的价格发现，或仅在低于过时估值水位的价格入场。
      edges:
        - from: breadth
          to: monetization
          label: 更广的平台
        - from: monetization
          to: scale
          label: 必须转化为持久增长
        - from: scale
          to: valuation
          label: 当前证明仍以旧轮融资为基准
        - from: valuation
          to: frictions
          label: 过时估值碰上真实执行风险
        - from: frictions
          to: call
          label: 阻止今天按当前价格买入
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV010
      - CV011
      - CV012
      - CV015
