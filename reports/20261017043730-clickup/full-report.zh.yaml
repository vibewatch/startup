  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 入围名单按买家需求分裂，而不是一组整齐的可比公司
        blocks:
          - type: paragraph
            body: >-
              指定来源不支持一张简单的同业对比表，让所有买家比较相同的三个产品。ClickUp
              自己卖的是整合能力，把现状明确描述为碎片化软件和工作蔓延，而不是某个具体竞争对手。竞争与评论来源又把市场拆成至少三条现实替代路径：monday.com 这类广泛的可视化工作管理套件；Asana
              风格、结构更简单的项目工具；以及 Plane 这类由工程团队主导、强调自托管、可扩展性和部署选择的控制导向方案。这种分裂很重要：当买家想用一套云端套件集中多个职能时，ClickUp
              更容易胜出；但当买家只优化某个窄约束，例如部署控制、简单性或聊天优先的运营模式时，竞争就更难。
            claimRefs:
              - CP001
              - CP004
