        title: 展示
        blocks:
          - type: callout
            title: 广泛套件的覆盖仍然重要
            body: 指定证据一致支持 ClickUp 最可辩护的广泛优势：一个覆盖任务、文档、协作、自动化和 AI 的云端工作空间，而不是单一用途的项目跟踪器。
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: callout
            title: 复杂度与 AI 套餐是最容易被攻击的薄弱点
            body: 来源池中最可重复的反 ClickUp 叙事是：买家为广度付出的代价是更长的上手周期、更多配置和额外 AI 成本，而不是更干净的开箱即用体验。
            calloutType: risk
            claimRefs:
              - CP005
              - CP006
              - CP010
