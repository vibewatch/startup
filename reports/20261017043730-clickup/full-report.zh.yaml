      - number: '2.3'
        title: 受证据约束的市场规模、驱动因素与限制
        blocks:
          - type: paragraph
            body: >-
              最强的公开采用信号是代理指标，而不是正式的市场规模披露。ClickUp 官网引用“85% of Fortune 500 companies”“4.7/5 by 10,000+ users on
              G2”，第三方还给出三年 384% ROI、六个月内回本的证据；Software Advice 则基于 4,639 条经核实评论给出 4.6 的总体评分。这些数据支持 ClickUp
              同时进入自助和企业环境的判断，但看不出席位数、细分组合、转化率或钱包份额。独立来源对采用逻辑的描述也一致：团队购买 ClickUp，是为了整合碎片化工具栈，获得共享可见性、自动化和 AI
              辅助工作流。反向约束同样一致：平台广度带来了真实的设置、治理、培训，有时还有性能负担，尤其对大型工作空间或偏好更简单、更有明确立场工具的团队如此。由于留存来源没有发布 ClickUp 可服务市场的自下而上或第三方
              TAM/SAM/SOM 估算，本章只停留在受证据约束的采用视角，并明确提出市场规模和变现深度的尽调要求。
            claimRefs:
