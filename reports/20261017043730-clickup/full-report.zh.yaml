  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、隐私与安全暴露
        blocks:
          - type: paragraph
            body: >-
              公开证据支持的是复杂的安全画像，而不是彻底无风险。ClickUp 当前官网和评论资料显示其具备可信的企业安全姿态：公司宣传 SOC 2 Type II、ISO 27001、GDPR 和 HIPAA，评论资料也把
              SSO、2FA 和管理员控制列为企业准备度的一部分。这很重要，因为受监管买家有可能通过第一轮合规筛查。


              更难的问题是默认设置和覆盖范围是否与营销说法一致。SmartSuite 的 2026
              年评论称，附件、剪辑和表单历史上曾可从公开链接直接访问，更强的附件设置需要主动开启，部分公开链接行为仍然存在。这不能证明当前存在数据泄露或执法问题，但意味着风险章节应把隐私控制验证视为待做尽调，而不是已解决的证据。同样重要的是，这组来源没有监管机构、法院或事件一手记录，因此法律清洁度和泄露历史风险仍是证据缺口，而不是正面结论。
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
      - number: '7.2'
        title: 运营与采用风险
        blocks:
          - type: paragraph
            body: >-
              ClickUp 的运营风险主要是复杂度风险。多份近期评论，甚至 ClickUp
              自己的工作流软件文章，都指向同一模式：平台广泛、强大且可定制，但如果团队在形成稳定运营规范前过度搭建工作空间，就可能不堪重负或放慢速度。这是有意义的投资风险，因为推广不佳看起来可能像产品市场匹配弱，实际失败原因却是实施债务。


              缓解措施确实存在，但依赖流程，而非自动完成。TaskRhino 称，成功团队会投入精简的状态架构、命名规范和自定义字段；PMWorld360 则建议在扩张前先从一个代表性工作流、少量必要字段和明确责任开始。官方
              2026 年产品信息也显示部分问题有所改善，包括大型工作空间性能更快、移动端一致性更好；但 ClickUp 仍承认移动端功能覆盖尚未达到桌面端水平。因此从运营角度看，风险可控，但前提是严格的变更管理、培训和治理。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR012
              - CR013
