        title: 展示
        blocks:
          - type: callout
            title: 整合是核心需求逻辑
            body: 官方和独立来源一致支持的购买逻辑，不是某一个杀手级功能，而是用一个可配置工作空间替代多个彼此割裂的工作工具。
            calloutType: insight
