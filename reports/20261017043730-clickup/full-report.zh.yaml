      - CV005
      - CV006
      - CV007
      - CV010
      - CV011
      - CV012
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - AI 增值功能附加率良好，企业使用加深，当前 ARR / 收入质量显著超过最近的公开数据点。
        - 只有在更新后的尽调证明规模和留存明显强于当前公开记录时，价值才可能超过已过时的 $4B 水位。
        - 需要新的价格发现、更强的增长质量证明，以及有限的治理拖累。
        - AI 附加率疲弱、扩张放缓，或私募市场估值持平 / 下行，都会打破乐观情景。
      - - 基准
        - 平台依然覆盖面广且有用，但当前经营状况只能看出方向，单靠公开证据不足以让市场上调公司评级。
        - 入场应以低于 2021 年估值为目标，或采用能够补偿价格发现过时问题的交易结构。
        - 与今天保留的证据集最为匹配。
        - 若尽调发现留存更弱、现金消耗更重，或优先权形成估值上方的压力，连基准情景也会下移。
      - - 悲观
        - 覆盖面带来治理负担，AI 增购推高总成本，新的价格发现重置软件估值倍数或市场对公司的预期。
        - 价值跌破 2021 年水位；回报取决于避开下行轮入场，或等待经营修复。
        - 复杂度、全包定价以及隐私 / 安全担忧方面的不利证据，构成支持这一情景的反向证据。
        - 流失、安全负面消息或融资条款疲弱中的任意组合，都会推动这一情景提前出现。
    notes: 由于保留的公开证据无法提供干净的 2026 年可比公司集合、当前股权表条款或新的私募市场估值，情景区间有意相对于最近披露的估值表达。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV010
      - CV011
      - CV012
      - CV015
      - CV016
