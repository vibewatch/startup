  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              公开证据支持的是经典的企业软件变现阶梯，而不是交易或支付模式。Sacra 将 ClickUp 描述为订阅制 SaaS 公司，提供免费层、按席位付费的套餐、企业定价和单独的 AI 增值服务；多份 2026
              年评论也显示，买家仍从宽松的免费计划进入，再为存储、报告、治理和安全控制升级。这种结构在财务上很重要，因为它让 ClickUp 拥有低摩擦漏斗顶部，以及同一账户内的多个变现杠杆：增加席位、套餐升级和 AI
              附加。问题在于当前第三方评论的价格漂移。有些来源描述 $7 的 Unlimited 和 $12 的 Business 阶梯，另一份 2026 年 3 月评论则显示 Core 为 $9、Business 为
              $17，另有单独的 Max 层级。这种不一致并不能否定变现，但意味着在管理层提供当前报价表、折扣政策和按细分市场划分的实际 ASP 前，标价只能作为方向性参考。
            claimRefs:
              - CI001
