  - id: TP002
    title: 基于指定证据的采购标准矩阵
    columns:
      - 采购标准
      - ClickUp
      - monday.com
      - Plane
      - 现状工具栈
      - 证据说明
    rows:
      - - 跨职能广度
        - 高：一个套件集成任务、文档、聊天、目标、自动化、AI 和集成
        - 高：定位为面向广泛团队的可视化 AI 工作平台
        - 中：工作项、文档、周期和 AI 覆盖较广，但以工程主导的控制为框架
        - 中低：广度取决于不同工具的拼接
        - ClickUp 的广度得到官方及评论来源交叉印证；竞争对手的广度主张来自各自厂商的比较内容
      - - AI 套餐设计
        - 在基础套餐之上另设付费 AI 层或额度
        - 在工作平台叙事中定位为原生 AI
        - 根据其比较页面，每个套餐均包含 AI 额度
        - 取决于团队已经购买的各项工具
        - 指定证据对 ClickUp 的独立 AI 定价和 Plane 的内含额度定位最为充分
      - - 部署 / 控制灵活性
        - 指定竞争比较中仅支持云端
        - 指定来源集中为 SaaS；此处未留存自托管证据
        - 强：明确描述云端、自托管和物理隔离选项
        - 如果团队保留本地系统或定制集成，潜力可能较高
        - 这是有结构化证据支持的 Plane 攻击 ClickUp 的最清晰领域
      - - 采用难度
        - 不一：功能强大，但反复被描述为功能密集、配置较慢
        - 竞品资料强调更快见效
        - 没有被定位为最易用，但被描述为更紧凑、更聚焦工程团队
        - 无需迁移，但用户要承担多工具的管理负担
        - monday.com 和 Rock 作为竞争方存在偏见，但 project-management.com 独立支持复杂度方面的担忧
      - - 采用后的转换成本潜力
        - 如果团队围绕一个套件标准化文档、聊天、工作流和 AI 上下文，转换成本高
        - 中高，但指定证据主要是厂商定位
        - 中：数据控制和开发工作流重要时更强
        - 低：平台级锁定收益较少，但被迫迁移成本也更低
        - 转换成本评估属于分析判断而非直接来源引述，因为指定来源池没有公开胜负和流失数据
    notes: 该序数矩阵综合了来源描述的产品范围、部署选项和买方权衡；不支持的单元保留为部分信息， 不作猜测。
