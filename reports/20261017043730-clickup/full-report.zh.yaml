  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >-
              留存证据把 ClickUp 的市场边界定义为整合碎片化知识工作软件，而不是单一功能的项目管理细分市场。ClickUp 官网称其提供“100+ 款产品，用来替代碎片化 软件”，Software
              Advice、ONES 和 PMWorld360 的独立描述也都把它定位为一个整合任务、文档、聊天、仪表板、白板、目标、报告和 AI 的工作空间。这样一来，客户原本会分别投入任务跟踪器、文档 /
              wiki、协作层、报告层和工作流自动化工具的预算，都可能被纳入 ClickUp。相同来源也暗示了清晰的边界：ClickUp 无法替代专业会计、ERP
              或深度行业系统；对于不需要广泛协作或治理的团队，更简单的单一用途工具仍是可行替代品。
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM012
      - number: '2.2'
        title: 买家、用户与预算归属
        blocks:
          - type: paragraph
            body: >-
              公开套餐和评论证据指向多细分买家图谱。ClickUp 从免费自助入口起步，经 Unlimited 和 Business 席位层级，直到定制化 Enterprise
              采购；独立评论反复把初创公司、代理机构、跨职能部门和企业组织列为目标用户。Software Advice 还提供了一个有用的需求信号：超过半数受评组织拥有 2—50 名员工，说明尽管 ClickUp
              也在向高端市场销售，公开证据在 SMB 和中端市场使用上更强。预算归属可能随细分市场变化：创始人和团队负责人可以用部门预算采用免费或 Unlimited 层级；当报告和自动化变得重要时，运营或 PMO
              负责人更可能成为买家；一旦需要 SSO、合规或集中治理，IT、安全和采购就会成为准入关口。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM012
