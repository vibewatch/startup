        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              留存的公开证据显示 ClickUp 于 2017 年成立，Zeb Evans 仍是最主要的对外发声者，二手报道仍将 Alex Yurkowski 列为 CTO。这种集中很重要：围绕产品方向、裁员、效率和 AI
              变现的公开叙事依然高度以创始人为中心，而留存来源看不到详细的董事会构成和控制机制。财务与 AI 人才梯队正在增强——Dan Zhang 以 CFO 身份参与 2025 年 9 月 AI 附加率披露，Codegen
              CEO Jay 则在 2025 年 12 月收购后加入并担任 Head of AI——但治理透明度仍落后于领导层品牌曝光。
