      - number: '1.3'
        title: 融资、规模与披露质量
        blocks:
          - type: paragraph
            body: >-
              ClickUp 最后一个有明确依据的融资基准仍是 2021 年 10 月 Series C：以 $4.0 billion 投后估值融资 $400 million，累计披露融资达到 $535
              million。公司近期叙事的重点已从单纯的产品广度转向变现质量——2025 年 9 月披露将 $300 million ARR 与强劲的 AI
              附加指标联系起来，包括更大的交易规模和更高的附加率。但规模披露并不干净。官方和二手来源分别提到 500 万团队、1400 万用户和超过 2000 万用户，这些数字似乎对应不同人群，不能视为经核实的付费客户数。
