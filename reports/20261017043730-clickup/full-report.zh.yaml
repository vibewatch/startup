      - number: '7.3'
        title: 伙伴、平台与定价依赖
        blocks:
          - type: paragraph
            body: >-
              ClickUp 力图成为承载任务、文档、聊天、报告和 AI 的单一工作空间，恰恰因为更多工作流汇聚到一个平台，才产生依赖风险。官网大力宣传“Connected Apps & Any MCP”“500+ tool
              superpowers”和 AI agents；产品与评论页面则强调 1,000+ 个集成。这种广度在商业上很有吸引力，但也意味着产品价值越来越依赖连接器质量、应用权限、身份配置以及第三方服务的供应商可靠性。


              成本和控制又加深了这种依赖。SmartSuite 指出，相当一部分集成通过 Zapier 等连接器运行，可能增加外部订阅和维护负担。PMWorld360
              还称，高级治理、采购和身份管理需求可能迫使客户评估定制定价的 Enterprise 层级，而 Brain AI 和 Everything AI
              则单独变现。实际而言，伙伴和定价风险与其说来自单一经销商集中度，不如说取决于客户能否吸收不断增加的配置、集成和按席位计费的 AI 成本，同时不丢失 ClickUp 所宣传的 ROI。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR014
