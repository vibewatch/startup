        - label: 公开评价足迹
          displayValue: 10,000+ G2 users
          note: 公司引用的社会证明，不等同于付费客户数
        - label: 独立评价基础
          displayValue: 4,639 verified reviews
          note: Software Advice 的评价数量显示出广泛的评估与使用可见度
        - label: 经济性证明点
          displayValue: 384% ROI over three years
          note: ClickUp 引用的价值案例，并非独立的市场规模估计
        - label: 生产力证明点
          displayValue: 92,400 hours saved
          note: 公司展示的第三方节省成本代理指标
        - label: 企业验证
          displayValue: 85% of Fortune 500 companies
          note: 企业触达代理指标，但没有席位数或收入深度
    approximationNotes: 这是受证据约束的采用金字塔，而非 TAM / SAM / SOM 堆栈；保留的公开来源披露了覆盖面、采用、ROI 和企业渗透率的代理指标，却没有披露可服务市场金额、席位数或各细分市场的转化率。
    claimRefs:
      - CM001
      - CM007
      - CM013
      - CM015
  - id: FP001
    title: 按套件覆盖面与部署 / 控制灵活性划分的竞争定位图
    type: quadrant
    summary: 指定来源将 ClickUp 放在市场的广套件一端、低控制一端附近；Plane 和现状工具栈则以牺牲整合度为代价保留更多控制权。
    data:
      xAxis:
        label: 套件覆盖面 / 内置整合度（序数 1-5）
        min: 1
        max: 5
      yAxis:
        label: 部署 / 控制灵活性（序数 1-5）
        min: 1
        max: 5
      points:
        - label: ClickUp
          x: 5
          'y': 1
          note: 广泛的一体化套件，但在指定的竞品比较中仅支持云端。
        - label: monday.com
          x: 4
          'y': 1
          note: 覆盖面广的可视化工作套件；指定来源池没有证明其具备自托管控制能力。
        - label: Asana
          x: 3
          'y': 1
          note: 汇总比较中的结构化项目管理替代方案，但保留的覆盖面证据少于 ClickUp。
        - label: Plane
          x: 3
          'y': 5
          note: 工作流范围比单点工具更广，并提供自托管和隔离网络部署选项。
        - label: Notion
          x: 2
          'y': 1
          note: 以文档为主的替代方案，属于更广泛的候选名单，并非 ClickUp 的完整替代品。
        - label: 现状工具栈
          x: 2
          'y': 4
          note: 套件整合度低，但由于团队保留现有的独立工具，控制力相对较高。
    approximationNotes: 序数分数综合自来源描述的产品覆盖面与部署选项；它们不是基准、市场份额或性能测量。
    claimRefs:
      - CP001
      - CP009
      - CP011
      - CP012
      - CP013
  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: ClickUp 的公开变现路径从免费团队采用开始，升级到付费席位层级，再在核心工作空间合同之上叠加 AI 增值功能。
    data:
      nodes:
        - id: free-teams
          label: 免费团队
          value: 5M+ teams / wide top-of-funnel
          valueNote: Team count includes free workspaces, not just paying customers.
        - id: paid-seats
          label: 付费席位方案
          value: Free → paid seat conversion
          valueNote: Multiple 2026 reviews describe a free-to-paid per-seat ladder.
        - id: plan-upgrades
          label: Business / Enterprise 升级
          value: Governance, security, reporting
          valueNote: Custom enterprise pricing obscures realized ASP in public evidence.
        - id: ai-addons
          label: AI 增值功能
          value: Brain $9 / Everything AI $28
          valueNote: AI is sold separately from the base workspace in retained 2026 reviews.
        - id: larger-deals
          label: 更大型的销售驱动交易
          value: 7x when AI included
          valueNote: Company-linked Sept. 2025 disclosure via SQ Magazine.
        - id: arr
          label: 经常性收入
          value: $300M ARR disclosed Sep. 2025
          valueNote: Latest public recurring-revenue datapoint in the assigned source pool.
      edges:
        - from: free-teams
          to: paid-seats
          label: 将超出免费方案能力的团队转化为付费客户
        - from: paid-seats
          to: plan-upgrades
          label: 为控制、存储和报告功能升级
        - from: plan-upgrades
          to: ai-addons
          label: 向大客户交叉销售 AI
        - from: ai-addons
          to: larger-deals
          label: 在销售驱动模式下提高 ACV
        - from: larger-deals
          to: arr
          label: 改善经常性收入结构并扩大规模
    approximationNotes: 这是基于保留的公开证据构建的定性桥接，而非已核对的财务瀑布图；它展示的是机制，不是各收入流的贡献。
    claimRefs:
      - CI001
      - CI003
      - CI005
      - CI006
  - id: FE001
    title: 产品架构图
    type: stack
    summary: ClickUp 将共享工作数据、多视图工作流界面、AI / 自动化与企业控制层叠进一个可配置的工作空间。
    data:
      layers:
        - label: 工作流界面
          items:
            - 任务、文档、目标、仪表盘、聊天和白板
            - 列表、看板、甘特图、日历、时间线和工作量视图
          outputs:
            - 在一个工作空间中完成日常执行与协作
        - label: 共享上下文与工作对象
          items:
            - Workspace / Spaces / Folders / Lists / Tasks 层级
            - 状态、自定义字段、依赖关系、评论和附件
          outputs:
            - 一套底层数据模型，让不同团队可以按各自方式解读
        - label: 自动化与 AI
          items:
            - Brain 摘要、连接式搜索和任务生成
            - Agent 式自动化、提醒和状态汇总
          outputs:
            - 数据维护良好时，可加快搜索、报告和工作流交接
        - label: 集成层
          items:
            - GitHub、Google、Slack、Zoom、Salesforce 和基于 API 的扩展
          outputs:
            - 为工作流和数据交接连接外部系统
        - label: 治理与信任层
          items:
            - SSO、SCIM、数据驻留、企业 API 和合规界面
          outputs:
            - 为推广、安全和采购划定企业控制边界
        - label: 商业打包
          items:
            - 免费核心工作空间、付费协作层级和单独的 AI 变现
          outputs:
            - 部署范围和产品行为会随方案权限与增值功能选择而变化
    approximationNotes: 这些层级边界综合自官方和第三方描述，并非 ClickUp 的真实系统图。
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE009
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 保留的来源暗示了一条客户路径：从简单的团队试用开始，经由工作流设计扩展；只有当买方能够消化治理和推广复杂度时，产品才适合更大规模。
    data:
      items:
        - label: 试用与首个工作空间
          actor: 自由职业者 / 小团队
          touchpoints:
            - 免费方案或简单项目启动
            - 在一个地方处理任务、文档和基础协作
          note: 买方从小规模开始、避免一次打开所有功能时，进入门槛最低。
          tone: positive
        - label: 工作流设计
          actor: 项目或运营负责人
          touchpoints:
            - Spaces、Folders、Lists、状态和自定义字段
            - 扩大规模前规划层级
          note: 推广质量取决于有意识地设计工作空间，而不是沿用默认设置。
          tone: neutral
        - label: 部门推广
          actor: 代理机构或服务团队经理
          touchpoints:
            - 时间追踪
            - 工作量和项目组合视图
            - 周期性交付工作流
          note: 服务业务占比较高的团队，尤其能从工作量和利用率工具中获得清晰价值。
          tone: positive
        - label: 跨职能标准化
          actor: PMO / 运营 / 远程混合团队
          touchpoints:
            - 文档、仪表盘、自动化和共享可见性
            - 替代重叠的工作管理工具
          note: 第三方评价反复指出，当多个工作流被整合时，ClickUp 的优势最明显。
          tone: positive
        - label: 企业落地
          actor: 大型组织 / 项目发起人
          touchpoints:
            - 跨部门透明度
            - 战略项目协调
            - 财富 500 强可信度声明
          note: 企业触达在公开市场上有宣传，但具体部署深度仍缺失。
          tone: neutral
        - label: 扩张摩擦循环
          actor: 管理员与终端用户
          touchpoints:
            - 学习曲线与设置时间
            - 性能与通知摩擦
            - 全方案定价复杂度
          note: 扩张取决于买方能否消化治理、入职培训和定价开销。
          tone: risk
    approximationNotes: null
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU010
      - CU011
      - CU012
      - CU013
      - CU015
