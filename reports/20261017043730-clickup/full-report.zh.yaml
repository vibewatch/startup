      - number: '3.3'
        title: 护城河能否持久，取决于执行、信任，以及 AI 是否会压缩工作流溢价
        blocks:
          - type: paragraph
            body: >-
              指定证据中的 ClickUp
              仍有有意义的护城河要素：跨职能客户案例、企业安全信号，以及团队一旦标准化采用平台后会提高迁移成本的广泛产品覆盖。但同一证据也说明，这种差异化可能比专有系统记录类别更容易被压缩。monday.com 和 Plane
              都在从买家当前最痛的地方发起替代叙事：易采用性、部署控制和更透明的 AI 套餐。TechCrunch 及较低层级的后续报道还显示，管理层如今重押 AI
              驱动的生产力和内部自动化。若产品执行改善，这可能强化差异化；但如果 AI 让协作层更商品化，客户又认为用更便宜或更可控的工具栈也能复刻足够多的工作流，替代风险也会升高。
            claimRefs:
              - CP003
              - CP007
              - CP008
              - CP009
              - CP013
              - CP014
