      - number: '3.2'
        title: 广度是核心优势，但也带来真实的采用与套餐摩擦
        blocks:
          - type: paragraph
            body: >-
              来源池中最一致的支持 ClickUp 信号是广度。官方产品文案、客户案例和多份对比资料都描述了一个覆盖任务、文档、聊天、时间跟踪、仪表板、目标以及日益增多的 AI
              能力的工作空间。这正是其真实的整合卖点，也解释了为什么 ClickUp 在工程、营销、项目服务和行政工作流中都能进入候选名单。反向约束同样一致：竞争对手和评论者反复指出，平台上手慢、配置重，加入 AI
              后总成本也高于醒目的席位标价。竞争尽调应因此少把 ClickUp 当作单点方案的弱势挑战者，而应视为广泛的既有平台；它的主要风险不是能力缺失，而是买家对复杂度、变更管理成本和增量 AI 套餐的抵触。
            claimRefs:
