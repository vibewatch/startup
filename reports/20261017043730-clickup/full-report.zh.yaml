        - 跨职能知识工作者和团队负责人
        - 已广泛发布，是所有来源描述的核心
        - 在一个系统中整合任务、文档、目标、仪表盘、聊天和工时追踪
        - 需要最新的分细分市场付费席位构成，以及各模块实际协同采用的证据
      - - AI 层（Brain、agents、connected search）
        - 管理员、项目负责人和个人贡献者
        - 已商业化推出，并随着 2025-2026 年的版本持续扩展
        - 能理解上下文的摘要、搜索、任务生成和代理式操作，覆盖工作区数据及已连接的应用
        - 需要附加购买率、使用频率、模型治理细节，以及公司自述之外经测量的生产力提升
      - - 协作界面（Chat、Docs、Whiteboards、SyncUps）
        - 协调执行和知识沉淀的项目团队
