        title: 身份与产品范围
        blocks:
          - type: paragraph
            body: >-
              ClickUp 在 2026 年发布的材料中始终把自己定位成统一工作空间：在同一运营层整合任务、文档、聊天、仪表板、目标和
              AI。公司卖的不只是按席位收费的任务管理，而是整合能力和工作流上下文。独立对比资料也支持这一定位，将 ClickUp
              描述为通用协作软件，而非只服务销售团队或单一职能的工具。实际产品卖点很宽：把多个工作应用合并起来，加上 AI 和连接搜索，再靠核心订阅与附加 AI 使用量组合变现。
