      severity: "material"
      topic: "security-controls"
      missingEvidence: "Independent evidence that verifies the scope of compliance badges, secure-sharing defaults, and the current state of attachment or form exposure controls."
      whyItMatters: "Enterprise trust claims are central to rollout risk, but the current evidence pool pairs company badges with reviewer criticism instead of neutral control validation."
      diligencePath: "Collect current SOC 2 and ISO scope documents, admin-default sharing documentation, security-review responses, and recent customer or auditor commentary."
    - type: "private-evidence-only"
      severity: "material"
      topic: "reliability"
      missingEvidence: "Status-page metrics, SLA attainment, and large-workspace performance benchmarks after the 4.0 redesign."
      whyItMatters: "Public reviews show lingering lag and dashboard complaints, but underwriting needs production telemetry to judge whether redesign work materially improved reliability at scale."
      diligencePath: "Request uptime history, incident postmortems, latency benchmarks for large workspaces, and reference customers running dashboard- and automation-heavy deployments."
