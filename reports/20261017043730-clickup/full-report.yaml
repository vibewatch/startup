        - 'Mixed: powerful but repeatedly described as feature-dense and slower to configure'
        - Competitor messaging emphasizes easier time-to-value
        - Not framed as easiest, but framed as tighter and more focused for engineering-led teams
        - No migration needed, but users keep the overhead of multiple tools
        - >-
