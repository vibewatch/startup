  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      ClickUp's public monetization path starts with free-team adoption, upgrades into paid seat tiers, and layers AI
      add-ons on top of the core workspace contract.
    data:
      nodes:
        - id: free-teams
          label: Free teams
          value: 5M+ teams / wide top-of-funnel
          valueNote: Team count includes free workspaces, not just paying customers.
        - id: paid-seats
          label: Paid seat plans
          value: Free → paid seat conversion
          valueNote: Multiple 2026 reviews describe a free-to-paid per-seat ladder.
        - id: plan-upgrades
          label: Business / Enterprise upgrades
          value: Governance, security, reporting
          valueNote: Custom enterprise pricing obscures realized ASP in public evidence.
        - id: ai-addons
          label: AI add-ons
          value: Brain $9 / Everything AI $28
          valueNote: AI is sold separately from the base workspace in retained 2026 reviews.
        - id: larger-deals
          label: Larger sales-led deals
          value: 7x when AI included
          valueNote: Company-linked Sept. 2025 disclosure via SQ Magazine.
        - id: arr
          label: Recurring revenue
          value: $300M ARR disclosed Sep. 2025
          valueNote: Latest public recurring-revenue datapoint in the assigned source pool.
      edges:
        - from: free-teams
          to: paid-seats
          label: Convert teams that outgrow the free plan
        - from: paid-seats
          to: plan-upgrades
          label: Upgrade for controls, storage, and reporting
        - from: plan-upgrades
          to: ai-addons
          label: Cross-sell AI into larger accounts
        - from: ai-addons
          to: larger-deals
          label: Raise ACV in sales-led motion
        - from: larger-deals
          to: arr
          label: Improves recurring revenue mix and scale
    approximationNotes: >-
      This is a qualitative bridge based on retained public evidence rather than a reconciled financial waterfall; it
