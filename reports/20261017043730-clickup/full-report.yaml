  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base spans horizontal work-management buyers, but the public mix still skews SMB and mid-market
        blocks:
          - type: paragraph
            body: >-
              The retained sources point to a horizontal customer base rather than a single-vertical footprint. The
              cleanest quantified segment view comes from G2-derived reviewer data: 77% SMBs, 18% mid-market, and 4%
              enterprise. That aligns with the product positioning in third-party reviews, which repeatedly frame
              ClickUp as a fit for cross-functional project teams, agencies, professional-services workflows, and buyers
              replacing overlapping work-management tools. ClickUp's own homepage pushes the enterprise end of that
              spectrum by saying it is "Powering businesses of all sizes" and claiming use by "85%of Fortune 500
              companies," but the public pool does not break that reach into paid seats, departments, contract size, or
              renewal depth. The result is a credible broad ICP with much better evidence for segment breadth than for
              segment economics.
            claimRefs:
              - CU002
              - CU005
              - CU006
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU001
            claimRefs:
              - CU002
              - CU005
              - CU006
              - CU008
              - CU009
              - CU010
      - number: '6.2'
        title: Adoption proof is strongest in reviewer scale and public satisfaction, not in named deployments
        blocks:
          - type: paragraph
            body: >-
              Adoption proof is real, but its quality is uneven. The best public signal is reviewer-scale usage: a 2026
              G2 article says ClickUp has a 4.7 out of 5 rating and more than 10,000 user reviews, reports 74% user
              adoption, and lists an 11-month time to ROI. ClickUp's homepage independently repeats the 4.7/5 and
              10,000+ G2-reviewer signal, which makes the rating and review-count evidence sturdier than a single review
              article. What the pool does not show is a comparable set of named production customers with contract
              scope, expansion history, or customer-level outcomes. Even the enterprise footprint claim is logo-level
              evidence rather than deployment depth. For underwriting, that means public adoption evidence clears the
              "real product, real user base" bar, but not the "verified reference account quality" bar.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU014
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
