      - number: '1.3'
        title: Funding, scale, and disclosure quality
        blocks:
          - type: paragraph
            body: >-
              ClickUp's last clearly supportable financing benchmark remains the October 2021 Series C: $400 million
              raised at a $4.0 billion post-money valuation, with total disclosed funding reaching $535 million. The
              company's more current narrative is about monetization quality rather than just breadth—September 2025
              disclosure tied $300 million ARR to strong AI attach metrics, including larger deal sizes and higher
              attach rates. Scale, however, is not cleanly disclosed. Official and secondary sources cite 5 million
              teams, 14 million users, and more than 20 million users, but those appear to measure different populations
              and should not be read as a verified paying-customer count.
            claimRefs:
              - CO002
              - CO006
              - CO007
              - CO008
              - CO014
              - CO015
      - number: '1.4'
        title: Milestones, adverse signals, and open diligence asks
        blocks:
          - type: paragraph
            body: >-
              The milestone pattern since 2021 shows a company trying to turn horizontal project management into a
              larger AI and platform-consolidation story. Product and M&A events in 2025-2026—Brain MAX, Codegen,
              Ora.pm, and Kitemaker—point to continued expansion around AI and software-delivery workflows. At the same
              time, independent and competitor-origin reviews qualify the bullish story with real adoption friction:
              extra AI charges, a steep learning curve, usability complaints, and lingering security or complexity
              concerns. The biggest remaining diligence gap is that public evidence still does not show board
              composition, current cap-table terms, debt, or board-grade operating metrics such as gross margin, burn,
              and runway.
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO016
