      - number: '5.2'
        title: Operating model and architecture
        blocks:
          - type: paragraph
            body: >
              ClickUp's operating model appears to rely on a shared work-data hierarchy that different teams can render
              through multiple views, automations, and AI helpers. Reviewer walkthroughs describe the core hierarchy as
              Workspace to Spaces to Folders to Lists to Tasks, while official and analyst material show the newer AI
              layer pulling context from tasks, docs, conversations, external apps, and web search. In practice, this
              means the product is best understood as a configurable system of record with several presentation layers -
              planning views, collaboration surfaces, dashboards, integrations, and AI actions - sitting on top of the
              same underlying objects.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE014
