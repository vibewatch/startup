        - Cloud only in assigned competitor comparisons
        - SaaS in the assigned source set; no self-hosting evidence retained here
        - 'Strong: cloud, self-hosted, and air-gapped options are explicitly described'
        - Potentially high if a team keeps local systems or custom integrations
        - This is the clearest structurally evidenced area where Plane attacks ClickUp
