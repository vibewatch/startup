  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Support
      - What would change the view
    rows:
      - - 'Thesis: breadth can support premium monetization'
        - >-
          Official materials position ClickUp as a consolidated workspace with AI agents, while PMWorld360 still sees
          breadth and flexibility as a differentiator.
        - >-
          Current expansion, retention, and enterprise-seat data would show whether breadth is monetizing or merely
          broad.
      - - 'Thesis: scale is real, not theoretical'
        - Sacra reports $150M revenue in 2022 and 100,000 paying customers; Brandhopper cites ~$300M ARR.
        - >-
          Current audited or management-grade 2025-2026 metrics would show whether that scale has compounded or
          plateaued.
      - - 'Anti-thesis: fully loaded price can rise quickly'
        - >-
          Official and third-party sources show a low base seat price but separate AI line items that materially
          increase all-in spend.
        - Bundled AI economics or evidence of strong attach rates without churn would reduce concern.
      - - 'Anti-thesis: complexity and control issues can hurt adoption'
        - Rock, PMWorld360, and SmartSuite all describe setup burden, governance overhead, or security/privacy concerns.
        - Proof of stable performance, contained admin burden, and remediated privacy issues would weaken the bear case.
    notes: >-
      Rows blend company-issued and independent evidence; support column names the specific retained source angle rather
      than implying equivalent source independence across every thesis item.
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV007
      - CV010
      - CV011
      - CV012
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          AI add-ons attach well, enterprise usage deepens, and current ARR/revenue quality materially exceeds the last
          public datapoints.
        - >-
          Value can clear above the stale $4B watermark only if refreshed diligence proves meaningfully stronger scale
          and retention than the public record currently shows.
        - Needs fresh price discovery, stronger quality-of-growth proof, and limited governance drag.
        - Weak AI attach, slowing expansion, or a flat/down private mark would break the bull case.
      - - Base
        - >-
          Platform remains broad and useful, but current economics are only directionally visible and not enough to
          re-rate the company upward on public evidence alone.
        - >-
          Entry discipline should target a discount to the 2021 mark or a structure that compensates for stale price
          discovery.
        - Best match to today's retained evidence set.
        - If diligence uncovers weaker retention, heavier burn, or preference overhang, even the base case shifts down.
      - - Bear
        - >-
          Breadth creates governance burden, AI upsell raises all-in cost, and new price discovery resets software
          multiples or company-specific expectations.
        - >-
          Value falls below the 2021 watermark; return depends on avoiding a down-round entry or waiting for operational
          repair.
        - Supported by adverse evidence on complexity, loaded pricing, and privacy/security concerns.
        - Any combination of churn, adverse security headlines, or weak financing terms pushes this case forward.
    notes: >-
      Scenario ranges are intentionally relative to the last disclosed valuation because the retained public evidence
      does not provide a clean 2026 comp set, current cap-table terms, or fresh private-market marks.
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV010
      - CV011
      - CV012
      - CV015
      - CV016
