        - 'High: positioned as a visual AI work platform for broad team use'
        - 'Medium: broad for work items, docs, cycles, and AI, but framed through engineering-led control'
        - 'Low to medium: breadth depends on stitching separate tools'
        - >-
          ClickUp breadth is corroborated by official and review sources; competitor breadth claims come from each
          vendor's own comparison content
      - - AI packaging
        - Separate paid AI layers or credits on top of the base plan
