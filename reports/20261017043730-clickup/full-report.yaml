              - CO014
              - CO015
      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Retained public evidence places ClickUp's founding in 2017, with Zeb Evans still the dominant external
              voice and Alex Yurkowski still named as CTO in secondary reporting. That concentration matters because the
              public narrative around product direction, layoffs, efficiency, and AI monetization is still highly
              founder-centric, while detailed board composition and control mechanics are not visible in the retained
              source set. Named finance and AI bench depth is improving—Dan Zhang appears as the CFO attached to the
              September 2025 AI attach-rate disclosure, and Codegen's CEO Jay joined as Head of AI after the December
              2025 acquisition—but governance transparency still trails leadership branding.
