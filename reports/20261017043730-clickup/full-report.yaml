              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP009
              - CP011
              - CP012
              - CP013
      - number: '3.2'
        title: Breadth is the core edge, but it creates real adoption and packaging friction
        blocks:
          - type: paragraph
            body: >-
              The most consistent pro-ClickUp signal in the pool is breadth. Official product copy, customer stories,
              and multiple comparison sources all describe a single workspace that covers tasks, docs, chat, time
              tracking, dashboards, goals, and increasingly AI. That supports a real consolidation pitch and helps
              explain why ClickUp remains shortlistable across engineering, marketing, project-services, and
              administrative workflows. The counterweight is equally consistent: competitor and reviewer commentary
              repeatedly says the platform can be slow to onboard, heavy to configure, and more expensive than the
              headline seat price once AI is added. For competitive diligence, that means ClickUp should be treated less
              as a point-solution underdog and more as a broad incumbent whose main exposure is not capability absence,
              but buyer resistance to complexity, change-management cost, and incremental AI packaging.
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP006
              - CP010
              - CP015
