chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product scope
        blocks:
          - type: paragraph
            body: >-
              Company-issued 2026 materials consistently position ClickUp as a unified workspace that combines tasks,
              docs, chat, dashboards, goals, and AI in one operating layer. That matters because the company is selling
              consolidation and workflow context, not only seat-based task management. Independent comparison coverage
              reinforces that framing by describing ClickUp as general-purpose collaboration software rather than a
              sales-only or single-function tool. In practical terms, the product pitch is broad: consolidate multiple
              work apps, add AI and connected search, and monetize through a mix of core subscriptions and attached AI
              usage.
            claimRefs:
              - CO001
              - CO009
              - CO010
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO004
              - CO005
              - CO006
