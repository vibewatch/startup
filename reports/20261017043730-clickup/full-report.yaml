  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      ClickUp layers shared work data, multi-view workflow surfaces, AI/automation, and enterprise controls into one
      configurable workspace.
    data:
      layers:
        - label: Workflow surface
          items:
            - Tasks, docs, goals, dashboards, chat, and whiteboards
            - List, board, Gantt, calendar, timeline, and workload-style views
          outputs:
            - Daily execution and collaboration in one workspace
        - label: Shared context and work objects
          items:
            - Workspace / Spaces / Folders / Lists / Tasks hierarchy
            - Statuses, custom fields, dependencies, comments, and attachments
          outputs:
            - One underlying data model that multiple teams can interpret differently
        - label: Automation and AI
          items:
            - Brain summaries, connected search, and task generation
            - Agent-style automations, reminders, and status synthesis
          outputs:
            - Faster search, reporting, and workflow handoffs when data is maintained well
        - label: Integration layer
          items:
            - GitHub, Google, Slack, Zoom, Salesforce, and API-based extensions
          outputs:
            - External-system connectivity for workflow and data handoffs
        - label: Governance and trust layer
          items:
            - SSO, SCIM, data residency, enterprise API, and compliance surfaces
          outputs:
            - Enterprise control boundaries for rollout, security, and procurement
        - label: Commercial packaging
          items:
            - Free core workspace, paid collaboration tiers, and separate AI monetization
          outputs:
            - Deployment scope and product behavior vary with plan access and add-on decisions
    approximationNotes: >-
      Layer boundaries are an analytical synthesis from official and third-party descriptions, not a literal ClickUp
      system diagram.
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE009
      - CE014
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      The retained sources imply a customer path that begins with simple team trials, expands through workflow design,
      and only works at larger scale when the buyer can absorb governance and rollout complexity.
    data:
      items:
        - label: Trial and first workspace
          actor: Freelancer / small team
          touchpoints:
            - Free plan or simple project start
            - Tasks, docs, and basic coordination in one place
          note: Entry looks easiest when a buyer starts small and avoids turning on every feature at once.
          tone: positive
        - label: Workflow design
          actor: Project or operations lead
          touchpoints:
            - Spaces, Folders, Lists, statuses, and custom fields
            - Hierarchy planning before scale-up
          note: Rollout quality depends on deliberate workspace design rather than default settings.
          tone: neutral
        - label: Department rollout
          actor: Agency or service-team manager
          touchpoints:
            - Time tracking
            - Workload and portfolio views
            - Recurring delivery workflows
          note: Services-heavy teams get especially clear value from workload and utilization tooling.
          tone: positive
        - label: Cross-functional standardization
          actor: PMO / operations / remote-hybrid team
          touchpoints:
            - Docs, dashboards, automations, and shared visibility
            - Replacing overlapping work-management tools
          note: Third-party reviews repeatedly frame ClickUp as strongest when several workflows are consolidated.
          tone: positive
        - label: Enterprise land
          actor: Large organization / initiative sponsor
          touchpoints:
            - Transparency across departments
            - Strategic-initiative coordination
            - Fortune 500 credibility claim
          note: Enterprise reach is publicly marketed, but named deployment depth is still missing.
          tone: neutral
        - label: Expansion friction loop
          actor: Admin plus end users
          touchpoints:
            - Learning curve and setup time
            - Performance and notification friction
            - Plan-wide pricing complexity
          note: Expansion depends on whether the buyer can absorb governance, onboarding, and pricing overhead.
          tone: risk
    approximationNotes: null
    claimRefs:
