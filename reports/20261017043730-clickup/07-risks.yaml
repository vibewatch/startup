callouts:
  - calloutType: risk
    title: Top risk is governance debt, not missing features
    body: >-
      ClickUp looks strongest when a buyer has disciplined ownership, naming,
      permissions, and rollout standards; without that, the same flexibility
      that helps consolidation can slow adoption and hide root-cause problems.
    claimRefs: [CR004, CR005, CR012]
  - calloutType: recommendation
    title: Clear kill criteria for diligence
    body: >-
      Break the thesis if a live admin review cannot validate safer sharing
      defaults, if enterprise controls require materially higher spend than the
      modeled ROI can support, or if reference customers still need heavy
      central administration to keep the workspace usable.
    claimRefs: [CR003, CR011, CR014]
