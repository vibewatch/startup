evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: Current board composition, voting/control terms, debt facilities, and cap-table detail after the 2021 Series C.
    whyItMatters: >-
      These items determine control, downside protection, and whether the last public valuation still anchors current
      ownership economics.
    diligencePath: >-
      Request the latest board list, financing docs, debt agreements, and a current cap-table or investor-rights
      summary.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale-footprint
    missingEvidence: A reconciled bridge between users, teams, paying customers, and employee counts across 2025-2026 disclosures.
    whyItMatters: >-
      Unreconciled denominators can overstate commercial traction or hide whether growth is mostly free-workspace
      adoption.
    diligencePath: Ask management for the latest customer-count definition, paid-seat count, and current headcount with date stamps.
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: operating-economics
    missingEvidence: Board-grade revenue, gross margin, burn, runway, and AI attach contribution beyond the September 2025 disclosure.
    whyItMatters: >-
      The investability question depends on whether AI expansion is improving unit economics, not only top-line
      narrative.
    diligencePath: >-
      Request board materials or data-room metrics covering ARR quality, gross margin, burn, runway, and AI attach by
      cohort.
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A third-party TAM, SAM, or SOM model for work-management software that isolates ClickUp's addressable segments by
      geography and buyer type.
    whyItMatters: >-
      Without a bounded market model, valuation and growth expectations have to lean on proxies instead of a defendable
      demand denominator.
    diligencePath: >-
      Obtain analyst market maps or management-provided sizing that bridge category spend, seat assumptions, and
      ClickUp's target segments.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: Free-to-paid conversion, plan mix, net revenue retention, and seat expansion by customer segment.
    whyItMatters: >-
      Public pricing ladders show monetization paths, but they do not reveal whether breadth converts into efficient
      revenue growth across segments.
    diligencePath: >-
      Request board-grade cohort data or investor materials that break revenue, expansion, and churn by plan and
      customer type.
    relatedQuestionRefs:
      - QM003
      - QM004
  - type: missing-source
    severity: minor
    topic: enterprise-penetration
    missingEvidence: Independent disclosure of active seat depth or spend behind the "85% of Fortune 500" enterprise-reach claim.
    whyItMatters: >-
      Enterprise-logo penetration sounds strong, but investors still need to know whether those accounts are deep
      platform rollouts or lightweight departmental footprints.
    diligencePath: >-
      Ask management for named-reference depth, seat counts, or case-study evidence that translates logo reach into
      wallet share.
    relatedQuestionRefs:
      - QM007
  - type: private-evidence-only
    severity: material
    topic: evidence-gap-pricing
    missingEvidence: >-
      Current enterprise discounting, seat-minimums, upsell patterns, and realized AI attach-rate data across customer
      cohorts.
    whyItMatters: >-
      List pricing alone does not show whether ClickUp is winning competitively on net price or simply publishing an
      attractive headline seat.
    diligencePath: >-
      Request current enterprise proposals, customer references with live contracts, and cohort-level attach-rate data
      for Brain and Everything AI.
    relatedQuestionRefs:
      - QP004
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: win-loss-and-churn
    missingEvidence: >-
      Independent or company-verified win-loss, churn, and expansion data against monday.com, Asana, Jira, Notion, and
      self-hosted substitutes.
    whyItMatters: Moat durability and switching-cost claims remain directional without observed retention or displacement data.
    diligencePath: >-
      Obtain customer interviews, board reporting on churn and expansion, and any sales enablement win-loss summaries
      segmented by competitor.
    relatedQuestionRefs:
      - QP006
      - QP008
  - type: enumeration-incomplete
    severity: minor
    topic: competitive-landscape-coverage
    missingEvidence: >-
      A broader independent market map that scores all major work-management suites, developer tools, and self-hosted
      substitutes on a common rubric.
    whyItMatters: >-
      The assigned pool supports the main buyer alternatives, but it does not exhaustively cover every regional or
      vertical specialist entrant.
    diligencePath: >-
      Supplement with a neutral market map or analyst landscape before using the chapter to rank second-tier niche
      competitors.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current board-grade cash balance, monthly burn, runway, debt facilities, covenant package, and any planned
      financing milestones.
    whyItMatters: >-
      Without liquidity disclosure, investors cannot judge whether ClickUp's AI and go-to-market expansion are
      self-funded or financing-dependent.
    diligencePath: Request the latest board package or financing memo with cash, burn, debt, and 18-24 month runway scenarios.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: margin-visibility
    missingEvidence: Current gross margin, hosting and support-cost intensity, professional-services mix, and working-capital profile.
    whyItMatters: >-
      Margin structure determines whether ARR growth is creating durable software economics or masking rising delivery
      costs.
    diligencePath: >-
      Request current gross-margin bridge, cloud cost trends, support headcount allocation, and any services revenue
      mix.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI001
      - TI003
  - type: stale
    severity: material
    topic: pricing-realization
    missingEvidence: Current realized pricing, discount policy, seat expansion by cohort, and AI attach revenue by segment.
    whyItMatters: >-
      Public list prices and review snapshots do not show actual ASP, enterprise discounting, or whether AI upsell is
      durable at renewal.
    diligencePath: >-
      Request current SKU sheet, median discount ranges, cohort-based AI attach, and renewal/expansion data by customer
      segment.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI004
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Independent developer or practitioner signal on API usage, public integration depth, SDK activity, or community
      adoption proxies.
    whyItMatters: >-
      The chapter brief explicitly asks for product and technical proof beyond marketing, and the assigned pool does not
      provide a neutral developer-signal source for ClickUp's ecosystem depth.
    diligencePath: >-
      Request API usage metrics, top integration endpoints, developer-doc traffic, partner implementation case studies,
      or neutral practitioner discussions that show real technical adoption.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: security-controls
    missingEvidence: >-
      Independent evidence that verifies the scope of compliance badges, secure-sharing defaults, and the current state
      of attachment or form exposure controls.
    whyItMatters: >-
      Enterprise trust claims are central to rollout risk, but the current evidence pool pairs company badges with
      reviewer criticism instead of neutral control validation.
    diligencePath: >-
      Collect current SOC 2 and ISO scope documents, admin-default sharing documentation, security-review responses, and
      recent customer or auditor commentary.
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: Status-page metrics, SLA attainment, and large-workspace performance benchmarks after the 4.0 redesign.
    whyItMatters: >-
      Public reviews show lingering lag and dashboard complaints, but underwriting needs production telemetry to judge
      whether redesign work materially improved reliability at scale.
    diligencePath: >-
      Request uptime history, incident postmortems, latency benchmarks for large workspaces, and reference customers
      running dashboard- and automation-heavy deployments.
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: Board-grade NRR, GRR, gross logo churn, renewal rates, and cohort retention by segment.
    whyItMatters: >-
      Without retention data, the chapter can support product-market fit and adoption breadth but not customer
      durability or expansion quality.
    diligencePath: >-
      Request monthly and annual cohort tables by customer size, including logo churn, seat expansion, and renewal
      cadence.
    relatedQuestionRefs:
      - QU008
  - type: missing-source
    severity: material
    topic: named-deployment-proof
    missingEvidence: Named production customers with deployment scope, start date, outcome, and renewal or expansion evidence.
    whyItMatters: >-
      Logo-level or reviewer-level proof does not replace verifiable reference accounts when underwriting enterprise
      readiness.
    diligencePath: >-
      Request five to ten current customer references across SMB, mid-market, and enterprise, plus signed case studies
      or procurement records.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Top-customer, channel, and partner concentration data plus win-loss or procurement-friction evidence by segment.
    whyItMatters: >-
      Customer diversification and procurement friction directly affect downside protection, forecast reliability, and
      sales efficiency.
    diligencePath: Request top-10 customer concentration, channel mix, and sales-cycle conversion data for the last four quarters.
    relatedQuestionRefs:
      - QU008
  - type: missing-source
    severity: minor
    topic: metric-denominators
    missingEvidence: Cohort definitions and calculation methods behind the public user-adoption, ROI, and Fortune 500 reach metrics.
    whyItMatters: >-
      The reported metrics are directionally useful, but missing denominators make it hard to translate them into
      revenue quality or account depth.
    diligencePath: Ask management or the referenced publishers for methodology notes behind the public adoption and ROI figures.
    relatedQuestionRefs:
      - QU002
      - QU003
    relatedTableRefs:
      - TU002
  - type: missing-source
    severity: material
    topic: legal-regulatory-cleanliness
    missingEvidence: >-
      Current regulator, court, incident-primary, and status-page evidence on lawsuits, enforcement, breach history, or
      major outages.
    whyItMatters: The present pack cannot clear legal or incident exposure, so a clean risk conclusion would overstate confidence.
    diligencePath: >-
      Run targeted regulator, litigation, and incident-history diligence before treating security posture as fully
      de-risked.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: security-control-validation
    missingEvidence: >-
      Current security questionnaire, certification scope and expiry, penetration-test summary, and live admin proof of
      safer sharing defaults.
    whyItMatters: >-
      Marketing badges and review commentary do not prove the control surface matches a buyer's real deployment and
      data-handling needs.
    diligencePath: >-
      Review the security packet and run an admin walkthrough focused on links, guests, permissions, SSO, and
