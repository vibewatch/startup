callouts:
  - calloutType: "strength"
    title: "Broad suite breadth still matters"
    body: "The assigned evidence consistently supports ClickUp's broadest defensible edge: one cloud workspace spanning tasks, docs, collaboration, automation, and AI rather than a single-purpose project tracker."
    claimRefs: ["CP001", "CP002", "CP003", "CP004"]
  - calloutType: "risk"
    title: "Complexity and AI packaging are the easiest attack surface"
    body: "The most repeatable anti-ClickUp narrative in the pool is that buyers pay for breadth with longer onboarding, more configuration, and extra AI cost rather than with a cleaner out-of-the-box experience."
    claimRefs: ["CP005", "CP006", "CP010", "CP015"]
  - calloutType: "insight"
    title: "AI could deepen the moat or flatten it"
    body: "ClickUp is explicitly reorganizing around AI leverage, but the same move can either widen differentiation through automation or accelerate commoditization if buyers decide the orchestration layer is reproducible elsewhere."
    claimRefs: ["CP007", "CP008", "CP013", "CP014"]
