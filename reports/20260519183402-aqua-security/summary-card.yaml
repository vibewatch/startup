summary:
  headline: >-
    Aqua Security remains a credible CNAPP pioneer with Trivy-driven distribution, runtime/container depth, and real
    enterprise reach, but flat valuation since the 2021 unicorn round, 2025 restructuring, and persistent
    private-company disclosure gaps justify a TRACK recommendation and stretched valuation stance until private
    diligence proves materially stronger ARR, retention, margin, and cash-efficiency than the public record.
  overallScore: 6.4
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
