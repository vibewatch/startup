  topStrengths:
    - >-
      Aqua was early to container and cloud-native security and still presents a credible code-to-cloud platform
      narrative with runtime depth.
    - >-
      Trivy gives Aqua a powerful open-source wedge into developer and DevSecOps workflows that many commercial
      competitors cannot easily replicate.
    - >-
      Official company disclosures support meaningful scale: 500+ enterprise customers, 40% of the Fortune 100, and
      strong banking penetration.
    - >-
      The company retained unicorn status through the January 2024 extension round and still attracts strategic
      ecosystem support through partner and marketplace channels.
    - >-
      The 2025 Akamai partnership and AI-security messaging suggest Aqua is still extending the product story rather
      than simply harvesting a legacy container niche.
  topRisks:
    - >-
      Aqua's last publicly disclosed valuation remained above $1B in January 2024 rather than clearly re-rating above
      the 2021 unicorn benchmark.
    - >-
      Wiz, Palo Alto Networks, CrowdStrike, Fortinet/Lacework, Orca, Sysdig, and Snyk all intensify platform, bundling,
      and procurement pressure in CNAPP.
    - >-
      2025 leadership transition and repeated layoffs create execution risk and raise questions about growth quality,
      culture, and runway discipline.
    - >-
      Public financial disclosure remains too thin to underwrite common equity confidently: ARR, NRR, gross margin,
      burn, runway, and preference terms are undisclosed.
    - >-
      Aqua's own open-source success with Trivy can compress paid scanner differentiation unless runtime, platform
      workflow, and enterprise response layers keep winning.
  unresolvedGaps:
    - Current ARR / revenue, NRR, gross margin, burn, and runway are not publicly disclosed or audited.
    - Cap-table, preference stack, and the exact terms of the 2024 extension are not publicly available.
    - >-
      Current headcount is unresolved because official disclosures are absent and late-2025 third-party estimates
      conflict materially.
    - Customer concentration, renewal cadence, and marketplace-to-paid conversion are not publicly visible.
    - >-
      Public evidence is insufficient to know whether AI-security expansion is already a meaningful commercial growth
      vector or still mostly narrative.
