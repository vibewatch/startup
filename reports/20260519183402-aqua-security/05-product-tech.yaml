  - CE017
  - CE041
  - CE044
- calloutType: risk
  title: Public roadmap and packaging detail remain thinner than the platform narrative.
  body: Aqua can clearly prove broad capability themes, but the public record still does not show a dated module roadmap, exact SKU boundaries, or deep internal architecture detail. That creates diligence risk precisely where late-stage buyers and investors want roadmap confidence.
  claimRefs:
  - CE049
  - CE051
  - CE052
- calloutType: risk
  title: Third-party feedback shows a real documentation and integration breadth risk even if capability breadth is strong.
  body: 'The same public evidence that supports Aqua''s feature breadth also surfaces friction: AWS feedback calls documentation thin, while Gartner reviewers flag higher price, fewer integrations, and weaker telemetry visibility than some alternatives.'
  claimRefs:
  - CE032
  - CE038
