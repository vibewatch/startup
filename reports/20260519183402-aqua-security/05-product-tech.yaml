    - Fragmented CSPM reports and manual evidence collection
    - Aqua CNAPP plus compliance detail in reviews and customer references
    - More unified posture and workload evidence across standards
    - Public evidence confirms control surfaces, not customer audit outcomes
  - - AI application team protects prompts and model interactions
    - New AI controls often require code changes or sit only at the edge
    - Aqua Secure AI in workload plus Akamai Firewall for AI at the edge
    - Prompt inspection and workload protection without claimed SDK changes
    - Public evidence is recent launch material, not yet a long reference base
