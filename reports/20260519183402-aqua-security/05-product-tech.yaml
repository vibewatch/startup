  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: roadmap-visibility
    missingEvidence: A dated module-by-module roadmap with GA, beta, and planned-release markers for runtime, posture, supply-chain, and AI features.
    whyItMatters: Without a dated roadmap, it is hard to judge which modules are mature revenue drivers versus narrative extensions.
    diligencePath: Request the current product roadmap deck and release-calendar view from product leadership, including GA/beta status by module.
    relatedQuestionRefs:
    - QE018
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: reliability-visibility
    missingEvidence: Public uptime history, service-level commitments, or benchmark data on scanning scale and runtime overhead.
    whyItMatters: Reliability and performance matter for an always-on CNAPP, but public evidence today is anecdotal rather than operationally underwriteable.
    diligencePath: Request status-page history, SLA terms, runtime overhead benchmarks, and customer reference calls focused on production operations.
    relatedQuestionRefs:
    - QE020
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: packaging-visibility
    missingEvidence: A clean SKU or pricing matrix showing what is bundled in Aqua Platform, what is add-on, and how Trivy feeds paid conversion.
    whyItMatters: Commercial boundaries determine attach rates, ACV expansion, and how much of the story is monetized versus free/open-source adoption.
    diligencePath: Request current packaging sheets, price books, and funnel data showing Trivy-to-platform conversion and module attach rates.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE001
  - type: missing-source
    severity: material
    topic: architecture-visibility
    missingEvidence: Deeper architecture evidence showing whether Aqua's modules share one control plane, data plane, and policy engine or operate as packaged subsystems.
    whyItMatters: A unified workflow does not automatically mean a unified architecture; the distinction affects implementation effort, roadmap leverage, and margin profile.
    diligencePath: Request an architecture review with platform engineering covering sensors, agents, data stores, policy services, and module boundaries.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE003
