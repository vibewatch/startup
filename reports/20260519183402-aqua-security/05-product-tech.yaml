- calloutType: strength
  title: Aqua's strongest workflow story is not one feature but the handoff from Trivy to runtime to prompt protection.
  body: The public evidence consistently shows Aqua trying to own the sequence from developer-stage scanning through runtime enforcement and now AI prompt governance. That workflow coherence is more defensible than any single feature checklist item.
