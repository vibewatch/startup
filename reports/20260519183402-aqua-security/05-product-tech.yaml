- id: architecture-and-operating-model
  title: Architecture and operating model
  body: 'At the level Aqua documents publicly, the operating model has four visible layers. First comes Trivy and other pre-production scanning surfaces that inspect code, images, filesystems, Kubernetes resources, and VM artifacts. Second comes a contextual layer where Aqua says it correlates vulnerabilities, runtime behavior, and cloud context rather than leaving each signal in a separate point tool. Third comes runtime enforcement, where Aqua positions itself as protecting live workloads against known and unknown threats. Fourth comes the newer AI-security layer, where Aqua and Akamai together claim to inspect prompt traffic at the edge while Aqua monitors behavior inside the workload.


    The most important architecture caveat is that public evidence proves workflow unification more clearly than backend unification. Aqua''s materials support claims about one CNAPP experience, contextual vulnerability management, and a common journey from code to runtime. They do not, however, expose enough low-level architecture to prove whether all modules share the same policy engine, data plane, storage model, and release cadence. That is especially relevant for investors because Trivy, posture controls, runtime enforcement, marketplace packaging, and the new Secure AI story may be commercially coherent without being architecturally identical. The right public takeaway is therefore balanced: Aqua appears to have a real integrated operating model for users, but the engineering depth of that integration still needs management walkthroughs and architecture diligence before one assumes full platform leverage.'
