chapter:
  number: 5
  title: Product & Technology
  summary: Aqua Security publicly presents a broad CNAPP that starts with Trivy-led developer and supply-chain scanning, layers in posture and contextual vulnerability management, and then enforces at runtime across cloud-native workloads. The company's current differentiation story now extends from code to cloud to prompt, backed by recent AI workload and prompt-protection announcements plus a notably strong public trust-and-compliance stack. The public record is strongest on workflow breadth, integrations, and certifications, and materially thinner on exact SKU boundaries, low-level shared architecture, uptime metrics, and dated module roadmap detail.
sections:
- id: platform-in-workflow-terms
  title: Aqua Platform in customer workflow terms
  body: 'Aqua''s strongest public product story is a workflow story rather than a single-module story. The official homepage and platform pages consistently frame Aqua as a cloud-native application protection platform that runs from code to cloud to prompt: developers scan early, cloud and platform teams gain risk context across posture and runtime, and production teams apply enforcement in live workloads. That positioning matters because Aqua is not simply selling a vulnerability dashboard or a Kubernetes runtime add-on. The customer job it claims to solve is how to keep one application risk loop intact as software moves from repository and CI/CD, into containers, clusters, serverless functions, and now AI-connected workloads.


    Trivy is the clearest public entry point into that workflow. Aqua markets Trivy as an open-source scanner that can plug into CI/CD with low friction, while the GitHub repo and docs show coverage across repositories, filesystems, container images, Kubernetes, VM images, secrets, misconfigurations, SBOMs, and license risk. In customer terms, that means Aqua can start the conversation with a developer or platform engineer before the buyer commits to a larger platform rollout. The commercial platform then layers contextual prioritization, posture visibility, runtime protection, and AI prompt or workload protection on top. Public evidence is therefore strong that Aqua wants to own the handoff from developer-stage hygiene to production enforcement, even if public SKU boundaries are still much thinner than the workflow narrative.'
