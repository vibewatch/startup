slug: aqua-security
runDate: "2026-05-19"
company:
  name: Aqua Security

chapter:
  number: 1
  title: Company Overview
  summary: >-
    Aqua Security is a Boston- and Ramat Gan-based cloud native security company founded in 2015.
    Official company releases support a current leadership handoff to CEO Mike Dube, more than $325M
    raised and a valuation above $1B by January 2024, plus 500+ enterprise customers and 40% of the
    Fortune 100; revenue and current headcount remain either undisclosed or conflicting in third-party
    sources and are therefore treated as evidence gaps rather than ground truth.

sections:
  - id: section-identity
    title: Identity, product surface, and distribution footprint
    body: >-
      Aqua Security was founded in 2015 and, in its current company boilerplate, identifies Boston,
      Massachusetts and Ramat Gan, Israel as its headquarters. The company positions itself as a cloud
      native application security provider covering the lifecycle from code to cloud to prompt. Current
      homepage and product materials group the platform around code security, runtime protection, and
      posture management, while the broader platform description emphasizes agentless and agent-based
      controls across software supply chain, cloud infrastructure, and live workloads.

      Aqua's strongest ecosystem asset is Trivy, the open-source scanner that Aqua itself highlights as
      a major adoption wedge. Reviewed Trivy materials and GitHub documentation show coverage for
      vulnerabilities, misconfigurations, secrets, SBOMs, repositories, container images, and Kubernetes
      clusters. Aqua also shows clear commercial distribution breadth through its own partner program,
      AWS Marketplace, Microsoft Azure Marketplace, the Red Hat partner catalog, and Cisco's technical
      alliance materials. Together these sources support a business model built around enterprise cloud
      security software sold directly and through channel, marketplace, and ecosystem partners rather
      than a narrow point product.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO008, CO009, CO041]
    figureRefs: [FO002]

  - id: section-leadership
    title: Founders, leadership transition, and governance posture
    body: >-
      Aqua's founding leadership remains central to the company story even after the official November
      2025 handoff. Co-founder Dror Davidoff, who had served as CEO, and co-founder Amir Jerbi, who had
      served as CTO, both stepped back from day-to-day executive roles and became strategic advisors.
      The company promoted Mike Dube from president and chief revenue officer to CEO and elevated Nir
      Makowski from senior vice president of engineering to chief product and technology officer. Aqua
      framed the transition not as a founder exit but as a planned move into its next phase of growth and
      global expansion.

      Dube's background is weighted toward go-to-market execution rather than founding product vision:
      Aqua says he previously held senior roles at CrowdStrike, Splunk, Cybereason, and Check Point.
      That makes him well suited to enterprise sales scaling, but it also increases key-person dependence
      on Makowski and the still-influential founders for technical continuity. Governance remains only
      partially visible in public materials. Reviewed official and third-party sources identify founders,
      investors, and executive changes, but they do not disclose a current board roster, founder
      ownership percentages, or formal succession terms. Those omissions are material diligence gaps,
      especially after the leadership reshuffle.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015, CO016, CO040]
    tableRefs: [TO002]

  - id: section-capital
    title: Funding history, investor base, and stakeholder map
    body: >-
      Aqua's publicly defensible financing history is anchored by three official milestones. The 2019
      Series C added $62M and brought total funding above $100M. The March 2021 Series E added $135M at
      a valuation above $1B and raised disclosed lifetime funding to $265M. The January 2024 extension
      added another $60M, led by Evolution Equity Partners with participation from Insight Partners,
      Lightspeed Venture Partners, and StepStone Group, taking disclosed lifetime funding to $325M while
      keeping valuation above $1B.

      Across the reviewed official rounds, Aqua's disclosed investor set includes ION Crossover Partners,
      Evolution Equity Partners, Insight Partners, Lightspeed Venture Partners, StepStone Group, TLV
      Partners, Greenspring Associates, Acrew Capital, and M12. Aqua's about page also lists Shlomo
      Kramer among its investors. What is not public is just as important: no reviewed source disclosed a
      cap table, liquidation preferences, founder ownership, secondary share mix, or debt facilities.
      For chapter-one canonical facts, the official $325M total raised is stronger than later Calcalist
      reports that cite about $235M; those third-party numbers are preserved as conflicts, not adopted as
      ground truth.
    claimRefs: [CO017, CO018, CO019, CO020, CO021, CO036, CO037, CO039, CO041]
    tableRefs: [TO003]

  - id: section-scale
    title: Customer scale, cover metrics, and explicit unsupported numbers
    body: >-
      Aqua's strongest officially disclosed scale metrics come from the January 2024 funding release.
      There the company said it had more than 500 enterprise customers worldwide, including 40% of the
      Fortune 100, and that it served six of the top 10 banks in North America and six of the top seven
      banks in Canada. Its customer page gives supporting qualitative breadth rather than hard counts,
      showing proof points across government, finance, energy, travel tech, software, and retail. A
      TechCrunch follow-up also cited PayPal, Netflix, and Samsung as claimed customers.

      Aqua also reported a 65% increase in new business during 2023, while its 2021 Series E release said
      it had doubled paying customers during 2020 and already counted half a dozen $1M-plus ARR
      customers. Those signals support real commercial maturity, as do the 2024 awards and the continued
      prominence of Trivy. However, official primary sources reviewed for this chapter do not disclose
      current revenue, ARR, gross margin, NRR, or headcount. The only numerical revenue signal located was
      GetLatka's reported $89.9M 2024 revenue, and headcount signals conflict materially across GetLatka
      and Calcalist. The KPI table therefore preserves official numbers where available and marks revenue
      and headcount as unsupported or conflicting rather than pretending to precision.
    claimRefs: [CO022, CO023, CO024, CO025, CO028, CO029, CO030, CO031, CO032, CO033, CO034, CO035, CO038]
    tableRefs: [TO001]
    figureRefs: [FO003]

  - id: section-milestones
    title: Milestone chronology and adverse signals
    body: >-
      Aqua's dated public chronology shows a company that established category leadership early, scaled
      through several financing rounds, and then entered a more mixed 2025 period. The core timeline runs
      from 2015 founding, to the 2019 Series C, to the 2021 Series E at unicorn valuation, through open-
      source traction milestones around Trivy, and into the 2024 capital extension that kept Aqua above a
      $1B valuation while formalizing 500-plus enterprise customers and 40% Fortune 100 penetration.

      The 2025 record adds both positive and cautionary signals. Aqua announced a strategic Akamai
      partnership focused on AI application security in July 2025, then executed a planned leadership
      transition in November 2025. But Calcalist also reported continued restructuring and another layoff
      round in December 2025, alongside disputed funding and headcount totals. Those reports do not
      overturn the official financing record, but they do matter for diligence because they suggest
      execution pressure and cost discipline issues after the leadership change. No separate material
      regulatory milestone was identified in reviewed public sources, so the chronology centers on the
      public founding, financing, product, partnership, governance, scale, and adverse events that can be
      dated and defended from local evidence.
    claimRefs: [CO017, CO018, CO019, CO020, CO026, CO027, CO028, CO029, CO034, CO035, CO036, CO037, CO040]
    tableRefs: [TO004]
    figureRefs: [FO001]

