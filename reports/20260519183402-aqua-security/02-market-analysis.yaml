  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sam-isolation
    missingEvidence: Public segmentation of Aqua revenue, pipeline, or customer count by vertical, geography, and workload type.
    whyItMatters: Without segment-level demand and conversion data, the chapter can bound TAM but cannot defend a clean Aqua SAM or SOM.
    diligencePath: Request management disclosure or investor materials showing customer mix, regulated-industry concentration, and cloud/runtime module attachment by region.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: channel-mix
    missingEvidence: Aqua’s direct versus channel or marketplace sourced bookings, renewals, and partner-influenced pipeline share.
    whyItMatters: The go-to-market narrative includes MSPs, SIs, marketplaces, and direct sales, but public evidence does not reveal which motion is economically dominant.
    diligencePath: Ask for bookings mix by route to market, average deal size by channel, and attach rates for marketplace and partner-led deployments.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: material
    topic: market-share
    missingEvidence: Reliable third-party market-share data for CNAPP or CWPP that includes Aqua, Wiz, Orca, Prisma Cloud, Sysdig, Snyk, and CrowdStrike on a comparable basis.
    whyItMatters: Category share would help translate broad market growth into a defensible view of Aqua’s competitive position and achievable SOM.
    diligencePath: Obtain paid analyst market-share exhibits or management win-rate data by segment and competitor, then reconcile them against the category boundary used in this chapter.
    relatedQuestionRefs:
    - QM027
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: material
    topic: growth-vs-efficiency
    missingEvidence: A consistent time series for Aqua’s ARR, growth, gross retention, and hiring/productivity before and after the 2024 funding extension and 2025 reorganization.
    whyItMatters: Public evidence shows both category tailwinds and efficiency-oriented actions, but not enough operating data to distinguish a temporary reset from a durable slowdown.
    diligencePath: Request cohort growth, net revenue retention, ARR by module, sales efficiency, and headcount productivity under the new leadership team.
    relatedQuestionRefs:
    - QM028
    relatedTableRefs:
    - TM004
  - type: access-blocked
    severity: minor
    topic: gartner-primary-cnapp-text
    missingEvidence: Direct access to Gartner’s primary CNAPP market-guide or glossary prose rather than secondary summaries and vendor quotations.
    whyItMatters: Primary analyst wording would tighten the category-definition section and reduce reliance on vendor or media paraphrase for consolidation logic.
    diligencePath: Use a subscribed Gartner export or ask management for the exact quoted analyst exhibit referenced in board or fundraising material.
    relatedQuestionRefs:
    - QM004
    - QM007
    relatedTableRefs:
    - TM001
    - TM002
