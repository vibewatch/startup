tables:
- id: TM001
  title: Market definition table
  columns:
  - Category
  - Included spend / activity
  - Excluded or adjacent spend
  - Primary buyer / payer
  - Why it matters to Aqua
  rows:
  - - Core CNAPP
    - Integrated code-to-cloud platform combining posture, workload, entitlement, Kubernetes, and shift-left controls.
    - General cloud IAM, email/web, or network-only tools.
    - CISO or cloud security leader; central security budget.
    - Direct match to Aqua’s platform positioning and peer set.
  - - CSPM / KSPM / CIEM
    - Configuration, entitlement, and Kubernetes posture controls across cloud estates.
    - Standalone posture tools without runtime or code context.
    - Cloud/platform security; shared security-platform budget.
    - Common land-and-expand entry point inside CNAPP.
  - - CWPP / runtime security
    - Workload, container, VM, and serverless runtime protection plus detection and response.
    - Pure endpoint EDR or network-only tools.
    - Security operations and workload owners.
    - Historic predecessor category and current differentiation area.
  - - Software supply chain / AppSec
    - SCA, SAST, IaC scanning, SBOM, and developer workflow security.
    - Generic AST suites without cloud/runtime linkage.
    - AppSec and DevSecOps program owners.
    - Adjacency that shapes SAM but is not identical to core CNAPP.
  - - Broad cloud security
    - CASB, encryption, IAM, web/email security, network security, managed services, and compliance tooling.
    - Total cyber spend and non-cloud security categories.
    - Multiple IT and security budget owners.
    - Useful upper bound but too broad to treat as Aqua’s TAM.
  notes: Boundary rows combine third-party definitions with chapter synthesis; included and excluded spend is analytical rather than a formal vendor taxonomy.
