  - - Public sector and federal cloud
    - Security authority plus SI/MSP partner
    - Program security and cloud ops
    - Agency security or program budget
    - Partner-assisted deployment and marketplace/channel procurement
    - Cloud transformation plus policy-driven controls
  - - Large multicloud enterprise
    - Cloud center of excellence plus SOC leadership
    - Security ops, platform engineering, app teams
    - Central security platform budget
    - Consolidate tools and connect code, cloud, and runtime
    - Alert fatigue and attack-path prioritization needs
