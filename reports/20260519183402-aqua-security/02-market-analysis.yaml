- id: sizing-lenses-and-contradictions
  title: Sizing lenses and contradictions
  body: 'The sizing evidence supports a range, not a single precise TAM. MarketsandMarkets provides the narrowest third-party lens, projecting CNAPP at USD 19.3 billion by 2027 and also showing that the older CWPP predecessor category only reached USD 6.70 billion by 2023. Grand View and Allied publish much larger cloud-security forecasts, but those numbers cover broader spend pools and longer horizons: roughly USD 35.8 billion to USD 35.84 billion in the 2022-2024 base years, growing to USD 75.26 billion by 2030 or USD 125.8 billion by 2032. National CIO Review’s citation of Gartner’s USD 213 billion 2025 security-spend umbrella is even broader and is best treated as proof that budgets exist, not as a category TAM for Aqua. The contradiction is therefore methodological, not necessarily factual. The narrow CNAPP view is useful for a strict category lens, while the broader cloud-security views capture adjacent posture, control, and compliance spend that a platform like Aqua may influence
    or consolidate over time. Public evidence is still insufficient to isolate Aqua’s SAM or SOM with confidence, so the chapter preserves that gap explicitly instead of smoothing it away.'
