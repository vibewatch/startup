  title: Boundary discipline matters more than a headline TAM
  body: The narrow third-party CNAPP lens is large enough to matter, but the much larger cloud-security and cyber-spend numbers are only useful as adjacent ceilings. Aqua’s valuation case should be tested against conversion within regulated multicloud buyers, not against the entire cloud-security umbrella.
  claimRefs:
