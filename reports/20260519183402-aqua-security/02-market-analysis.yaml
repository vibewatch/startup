company:
  name: Aqua Security
chapter:
  number: 2
  title: Market Analysis
  summary: Aqua’s most defensible market is integrated CNAPP plus adjacent runtime and software-supply-chain spend inside regulated multicloud enterprises, not the full cloud-security umbrella. Third-party market lenses range from USD 19.3 billion for core CNAPP to USD 75-126 billion for broader cloud security, so valuation depends more on conversion and competitive differentiation than on citing a single giant TAM. Demand tailwinds are real, but category ambiguity, review-led friction, and Aqua’s recent restructuring keep execution risk material.
sections:
- id: market-boundary-and-adjacencies
  title: Market boundary and adjacencies
  body: Aqua sits inside the narrow CNAPP layer rather than the whole cloud-security universe, so the chapter starts by defining the market before citing any TAM. TechTarget’s independent definition anchors CNAPP as a bundled platform spanning cloud infrastructure, cloud-native applications, and cloud workloads, while Aqua’s own academy expands that bundle into shift-left scanning, CSPM, KSPM, CIEM, and runtime cloud workload protection. Those definitions matter because they pull software supply chain security and runtime controls into the addressable set, but they do not justify treating every cloud-security budget line as core CNAPP spend. Broad cloud-security categories still include IAM, encryption, web and email security, managed services, and other controls that can touch the same buyer without being substitutes for Aqua. Aqua’s own materials, Microsoft’s marketplace listing, and Cisco’s alliance page all reinforce that its pitch is unified lifecycle coverage for regulated, multicloud,
    container-heavy enterprises. The practical market boundary for valuation is therefore integrated code, posture, entitlement, and runtime security for modern application estates, with software supply chain security as a powerful adjacency rather than a complete replacement for the core category.
  claimRefs:
