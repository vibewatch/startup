- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Factor
  - Direction
  - Timing
  - Evidence
  - Implication for Aqua
  - Diligence ask
  rows:
  - - Kubernetes already mainstream
    - +
    - Now
    - 66% production use and 18% evaluation among end-user organizations
    - Expands core CNAPP demand beyond early adopters
    - How much of Aqua ARR comes from Kubernetes-first programs?
  - - Multi-cloud complexity
    - +
    - Now
    - 56% multi-cloud usage and 2.3 public cloud providers on average
    - Raises need for unified posture and runtime policy
    - What percent of wins involve two or more clouds?
  - - Security pain in containers
    - +
    - Now
    - Security is the top container challenge for 40% of organizations
    - Supports runtime and risk-prioritization budgets
    - Which product modules convert this pain into spend?
  - - Software supply chain and AI risk
    - +
    - Next 12-24 months
    - Broad security spending growth is tied to application security, software trust, and AI risk
    - Keeps AppSec adjacency expanding into CNAPP deals
    - How much pipeline is supply-chain led versus runtime led?
  - - Tool sprawl and alert fatigue
    - +
    - Now
    - TechTarget and competitor narratives emphasize overload and prioritization
    - Favors integrated platforms over point tools
    - Is Aqua winning as a consolidator or as a specialist module?
  - - Category ambiguity
    - '-'
    - Now
    - Vendors and analysts use CNAPP labels inconsistently
    - Weakens clean TAM and positioning narratives
    - Can management provide a repeatable market-definition framework?
  - - Operational friction and scale concerns
    - '-'
    - Now
    - Reviews cite price, integrations, UI, training, and enterprise-scale issues
    - May slow expansion after pilots
    - What are churn and expansion rates by customer size?
  - - Efficiency mode and restructuring risk
    - '-'
    - Near term
    - Layoffs, flat-valuation commentary, and cash-flow-independence messaging
    - Valuation upside depends on execution proof, not just market growth
    - How fast can new leadership convert tailwinds into efficient expansion?
