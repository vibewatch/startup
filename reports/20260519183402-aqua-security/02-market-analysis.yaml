    - CISO or cloud security director
    - Platform security, DevSecOps, compliance
    - Central security budget
    - Standardize posture and runtime across multicloud estate
    - Compliance pressure and concentration of sensitive workloads
  - - Financial services and other regulated workloads
    - CISO plus infrastructure risk owners
    - Security engineering and cloud ops
    - Security plus risk/compliance budget
    - Land with posture/runtime, then expand across business units
    - Auditability, least privilege, and runtime protection
  - - Developer-led or Kubernetes-heavy teams
    - Engineering security or platform lead
    - Developers, DevOps, SREs
    - Platform engineering or shared DevSecOps budget
    - Start with image, IaC, or Kubernetes scanning, then expand
