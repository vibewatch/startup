companyProfile:
  summary: >-
    Aqua Security is a cloud-native security company founded in 2015 and headquartered in Boston,
    Massachusetts and Ramat Gan, Israel. The business was co-founded by Dror Davidoff and Amir Jerbi, who led
    the company through its 2021 unicorn Series E and January 2024 extension round before moving into strategic
    advisor roles during a November 2025 leadership transition that elevated Mike Dube to chief executive
    officer. Aqua's commercial positioning centers on a code-to-cloud-to-prompt CNAPP platform that spans
    software-supply-chain security, posture management, vulnerability management, runtime protection, and AI
    workload security. Trivy is the company's most important open-source distribution asset and broadens Aqua's
    reach into developer and DevSecOps workflows. Official company releases say Aqua had raised $325M and served
    more than 500 enterprise customers, including 40% of the Fortune 100, by January 2024.
