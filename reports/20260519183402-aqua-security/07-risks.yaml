  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: win-loss-data-platform-competition
      missingEvidence: 2025-2026 win-loss, renewal, discounting, and churn data segmented by Wiz, Palo Alto, CrowdStrike, GitHub, and other bundled alternatives.
      whyItMatters: Public competitor pages prove category breadth, but not the realized displacement rate inside Aqua's installed base or top pipeline.
      diligencePath: Request top-20 competitive deal reviews, renewal cohorts by platform, and pricing exception logs from finance and sales ops.
      relatedQuestionRefs:
        - QR001
        - QR029
      relatedTableRefs:
        - TR003
    - type: missing-source
      severity: material
      topic: ai-security-customer-proof
      missingEvidence: Named production customers, deployment depth, renewal behavior, and revenue contribution for Secure AI or other AI-security offerings.
      whyItMatters: Without customer proof, AI remains strategic option value rather than a reliable offset to CNAPP bundling and valuation pressure.
      diligencePath: Request customer references, design-partner list, production go-live dates, and attach-rate data for AI-security modules.
      relatedQuestionRefs:
        - QR007
        - QR018
        - QR026
      relatedTableRefs:
        - TR003
        - TR004
    - type: missing-source
      severity: material
      topic: service-reliability-history
      missingEvidence: Public or private uptime history, SLA-credit issuance, Sev1 incident record, and postmortems for Aqua-hosted services over the last 24 months.
      whyItMatters: Support terms publish a 99.9% availability target, but the absence of attainment evidence prevents a clean read on operational resilience.
      diligencePath: Request uptime dashboards, incident-notice archive, credit policy, and recent post-incident reviews from support leadership.
      relatedQuestionRefs:
        - QR021
        - QR024
      relatedTableRefs:
        - TR001
        - TR002
    - type: private-evidence-only
      severity: material
      topic: next-round-pricing-and-economics
      missingEvidence: 2025-2026 ARR, growth, gross margin, burn, cash balance, and any active secondary or financing discussions.
      whyItMatters: Those numbers determine whether Aqua's flat unicorn valuation is durable or a precursor to a down round.
      diligencePath: Request board materials, budget-versus-actuals, fundraising timeline, and any banker or investor feedback on current pricing.
      relatedQuestionRefs:
        - QR002
        - QR004
        - QR027
      relatedTableRefs:
        - TR005
    - type: missing-source
      severity: material
      topic: succession-and-attrition-depth
      missingEvidence: Succession plans, regretted attrition, open-role aging, and support-capacity metrics below the C-suite after the leadership reshuffle and layoffs.
      whyItMatters: Public headlines establish change at the top, but not whether the bench below leadership is stable enough to execute the roadmap.
      diligencePath: Request org chart by function, attrition by team, offer acceptance rates, and customer-success staffing coverage.
      relatedQuestionRefs:
        - QR003
        - QR025
      relatedTableRefs:
        - TR004
