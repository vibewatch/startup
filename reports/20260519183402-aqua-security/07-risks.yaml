company:
  name: Aqua Security
chapter:
  number: 7
  title: Risks
  summary: >-
    Aqua's highest-conviction risks are category compression as Wiz scales and platform vendors bundle CNAPP
    plus AI security, execution strain from the November 2025 founder succession followed by early-2026
    layoffs, and a still-flat unicorn valuation that did not re-rate upward in Aqua's January 2024 raise.
    Independent review pages also point to pricing, integration, visibility, and enterprise-scale gaps,
    which makes AI expansion and post-reorg execution the central diligence question.
sections:
  - id: competitive-and-model-risks
    title: Competitive and Model Risks
    body: >-
      Aqua's most severe risk is that CNAPP procurement is consolidating around larger code-to-cloud
      platforms while Aqua remains a flat-value unicorn. Wiz raised $1 billion at a $12 billion valuation
      in 2024, publicly targets $1 billion of ARR and an IPO, and says 50% of the Fortune 100 already
      uses it. Palo Alto, CrowdStrike, Orca, Sysdig, and Snyk all market broader AI- and runtime-aware
      platforms, while Fortinet's Lacework acquisition shows strategic buyers can fold CNAPP into bigger
      security suites at distressed prices. Palo Alto's fiscal 2025 results add another scale datapoint:
      $9.2 billion of revenue and $5.6 billion of Next-Generation Security ARR. That kind of balance-sheet
      and recurring-revenue base gives suite vendors far more room than Aqua to fund bundling, cross-sell,
      and AI-led platform expansion. Against that backdrop, TechCrunch's January 2024 Aqua story
      explicitly noted that the company's valuation had stayed above $1 billion rather than moving higher
      since 2021. That flat mark matters because it suggests Aqua did not widen the gap fast enough while
      better-capitalized rivals broadened platform scope and M&A capacity.

      Aqua also faces self-created commoditization pressure. Its Trivy project already delivers fast
      open-source vulnerability, misconfiguration, secret, SBOM, and license scanning, and Aqua says
      GitLab Container Scanning, Harbor, and Artifact Hub use it by default. That open-source reach is
      strategically valuable, but it also means baseline scanning is cheap or free while procurement
      increasingly prizes integrated workflow, runtime context, and AI-assisted response. Independent
      review sites reinforce the risk: Gartner, TrustRadius, PeerSpot, and G2 all surface complaints
      around price, integrations, visibility, or enterprise-scale execution. The mitigation case is
      runtime depth—Aqua's own leadership and workload-security positioning emphasize runtime protection
      and vulnerability management—but investors should treat that differentiation as a narrow moat until
      win-rate, renewal, and attach-rate data prove otherwise.
    claimRefs:
