  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Platform competition and bundling
        - Renewal win-rate and discounting versus Wiz, Palo Alto, CrowdStrike, and other suites
        - Two consecutive quarters of enterprise win rate below 50% or discounting above 25%
        - Re-rate Aqua as a niche asset and require materially lower entry price or stop
      - - Valuation staleness and financing overhang
        - Next primary round, major secondary, or banker-marked process
        - Flat-to-down pricing versus the 2021/2024 unicorn mark without clear ARR or margin inflection
        - Treat as balance-sheet warning and renegotiate valuation assumptions
      - - Reorg and people execution
        - Additional layoffs or loss of newly installed leadership
        - Another material reduction or departure of Mike Dube or Nir Makowski within 12 months
        - Pause investment until org stability and coverage recover
      - - Product gaps
        - Independent reviews and reference calls on integrations, visibility, and enterprise scale
        - Same complaints persist through 2026 H2 or emerge in top-20 customer diligence
        - Underwrite slower expansion, lower NRR, and higher churn risk
      - - AI expansion
        - Secure AI customer proof and partner attach
        - No named production customers or measurable ARR signal by next financing cycle
        - Value AI as option only, not as base-case growth engine
      - - Service and legal controls
        - DPA, MSA, SLA, subprocessor, and breach-notice review
        - Weak indemnity or caps, unclear residency, or no satisfactory uptime evidence
        - Require contractual remediation before close or terminate diligence
    notes: >-
      Kill criteria are intentionally monitorable and tied to observable financing, customer, product, and
      contractual events rather than generic caution language.
