  - id: people-and-execution-risks
    title: People and Execution Risks
    body: >-
      The people risk is unusually important because Aqua's strategic pivot is happening at the same
      moment as organizational stress. In November 2025 both founders stepped out of day-to-day CEO and
      CTO roles, Mike Dube moved from CRO to CEO, and Nir Makowski became chief product and technology
      officer. That can be a healthy professionalization step, but it is still a major transfer of
      product vision, technical authority, and commercial accountability. The risk rose rather than fell
      when layoffs followed weeks later. Calcalist described multiple reductions across 2022-2026,
      including a 2026 reorganization aimed at cash-flow independence. Public headcount descriptors moved
      from about 450 employees in late 2025 to roughly 360 after the latest cuts, which is not fatal but
      is material for roadmap and support capacity.

      This matters because Aqua is not simply harvesting a mature franchise; it is trying to defend core
      CNAPP economics while also expanding into AI workload and prompt-security protection. That is a
      difficult operating brief for a newly reshuffled leadership team. The mitigation is that the
      founders remain strategic advisors, the official plan keeps focus on runtime protection and
      vulnerability management, and Aqua still claims meaningful Fortune 100 penetration. But until
      diligence shows stable product velocity, intact customer-success coverage, and named AI-security
      production wins, investors should assume that execution—not pure market size—is the factor most
      likely to turn an investable story into a value trap.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR027
