  - id: regulatory-and-legal-risks
    title: Regulatory and Legal Risks
    body: >-
      Aqua's legal and regulatory risk is less about a visible public enforcement action and more about
      contract structure, privacy obligations, and the evidentiary gap between public assurances and
      enterprise-grade commitments. Aqua's privacy policy states that for platform users operating under
      customer direction it acts as a data processor under a DPA and related commercial agreements. That
      is directionally the right posture, but it means diligence has to move past marketing pages into
      the actual DPA, residency, subprocessors, and breach-notification terms because cloud-security
      tools routinely ingest code, images, telemetry, and security findings from regulated environments.
      CISA's guidance that organizations must manage external dependencies and operational resilience
      makes those downstream controls material, not peripheral.

      The sharper concern is risk allocation. Aqua's website terms disclaim warranties around
      effectiveness, availability, completeness, and error-free operation, cap liability, and route
      disputes to Israeli law in Tel Aviv-Jaffa. Its support and professional-services terms help
      operationally—they mention commercially reasonable 99.9% availability, affiliate delivery, and
      Aqua's retained responsibility for subcontractors—but they also reserve change rights, keep pricing
      opaque, and offer limited warranty language. None of that is unusual for vendor-first contracts,
      but it means the public legal baseline is company-friendly. The investment implication is
      straightforward: if enterprise MSAs, DPAs, SLA credits, or subprocessor controls are weaker than
      procurement norm, a buyer should assume more legal and incident-cost exposure than the product
      story alone suggests.
    claimRefs:
      - CR031
      - CR032
      - CR033
      - CR034
      - CR035
      - CR036
      - CR037
      - CR038
    tableRefs:
      - TR001

  - id: operational-and-dependency-risks
    title: Operational and Dependency Risks
    body: >-
      Operationally, the product is credible but not clean. Independent reviews create a consistent
      pattern: Gartner says Aqua's image assessment is strong but price is high, integrations are fewer,
      and visibility or telemetry trails EDR-style tools; a critical Gartner review says the product
      struggles at very large enterprise volumes; TrustRadius and PeerSpot mention Jira and SIEM gaps,
      UI/UX issues, web-portal or reporting weaknesses, and log-forwarding or server-integration needs;
      G2 includes enterprise complaints about slow feature delivery and missing scan coverage. That does
      not mean Aqua is weak at the core workload-security problem—some reviewers praise policy
      configuration, runtime protection, drift prevention, and ROI—but it does mean the company still
      has execution work before it can consistently win platform consolidations on total workflow fit.

      Dependency risk compounds that product gap. Aqua's AI-security narrative is currently tied to a
      joint story with Akamai, while support and professional services can rely on affiliates and
      subcontractors under the published terms. At the same time, open-source Trivy broadens
      distribution but reduces control over how much value customers must buy back from the commercial
      platform. The result is a classic transmission problem: if integrations lag, partners do not
      convert, or OSS users do not upgrade, then price pressure turns into slower renewals and weaker
      financing leverage. Aqua's mitigation path—runtime depth, workload focus, and partner-accelerated
      AI entry—remains plausible, but public evidence still skews toward product positioning and launch
      messaging rather than hard renewal or AI attach metrics.
    claimRefs:
      - CR018
      - CR019
      - CR020
      - CR021
      - CR022
