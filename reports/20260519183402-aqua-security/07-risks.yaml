    rows:
      - - Customer-data processor and DPA obligations
        - Global / multi-jurisdiction
        - Privacy policy says Aqua acts as processor for platform users under customer instructions and related DPAs
        - Medium
        - High
        - Customer-controlled processing model plus DPA framework
        - Cross-border transfer, residency, and breach-notification exposure remains
        - Review DPA, subprocessors, residency controls, and incident-notice commitments
      - - Website terms warranty and liability limits
        - Israel / global website users
        - Public terms disclaim effectiveness, availability, completeness, and error-free operation and cap liability
        - High
        - High
        - Enterprise MSA can supersede public website baseline
        - Public legal posture remains vendor-favorable and can shape procurement leverage
        - Request MSA caps, indemnities, venue carve-outs, and cyber-liability language
      - - Support-term availability and change control
        - Global customers
        - Support terms target 99.9% availability, allow affiliate delivery, and permit posted revisions
        - Medium
        - High
        - Availability target plus no-material-decrease qualifier
        - No public record of achieved uptime, credits, or major incidents
        - Review SLA credits, uptime history, and support staffing coverage
      - - Professional-services subcontractor and warranty limits
        - Global customers
        - PS terms allow subcontractors, set limited warranty language, and keep pricing confidential
        - Medium
        - Medium
        - Aqua remains responsible for subcontractors contractually
        - Onboarding quality and cost transparency may vary across deployments
        - Review SOW templates, subcontractor controls, and acceptance criteria
      - - Cyber-resilience and dependency-management expectations
        - United States / critical cyber environments
        - CISA states organizations need tailored plans and management of external dependencies
        - Medium
        - Medium
        - Aqua markets security, support, and trust materials as customer controls
        - Public materials do not prove tested resilience, outage handling, or regulator-grade readiness
        - Request pen-test cadence, tabletop results, and 24-month incident notices
    notes: >-
      Rows are severity-ranked from the standpoint of an investor evaluating contractual recourse,
      privacy obligations, and service assurance using Aqua's public legal pages and CISA guidance.
    enumerationScope:
      coverage: partial
      basis: >-
        Enumeration covers publicly visible legal and regulatory exposures that can be substantiated from
        Aqua's privacy, terms, support, and professional-services pages plus CISA guidance; private
        customer MSAs, DPAs, incidents, and sealed disputes are not publicly enumerable.
