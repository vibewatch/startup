companyProfile:
  summary: >-
    Aqua Security 是一家云原生安全公司，2015 创立，总部位于 Boston, Massachusetts 和 Ramat Gan, Israel。Dror Davidoff 与 Amir Jerbi
    共同创办公司，并带领 Aqua 完成 2021 年以独角兽估值进行的 Series E 和 January 2024 扩展轮；November 2025 领导层交接时，两人转任战略顾问，Mike Dube 升任首席执行官。Aqua
    的商业定位围绕从代码到云再到提示词的 CNAPP 平台展开，覆盖软件供应链安全、安全态势管理、漏洞管理、运行时防护和 AI 工作负载安全。Trivy 是公司最重要的开源分发资产，把 Aqua 延伸进开发者和 DevSecOps
    工作流。官方公司发布称，截至 January 2024，Aqua 累计融资 $325M，服务超过 500 家企业客户，其中包括 Fortune 100 的 40%。
