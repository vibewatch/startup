      - number: '5.2'
        title: 架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              按 Aqua 公开文档的层级，运营模型有四个可见层。第一层是 Trivy 和其他生产前扫描界面，检查代码、镜像、文件系统、Kubernetes 资源和 VM 制品。第二层是上下文层，Aqua
              称其会关联漏洞、运行时行为和云上下文，而不是把每个信号留在孤立单点工具中。第三层是运行时执行，Aqua 把自己定位为保护实时工作负载免受已知和未知威胁。第四层是更新的 AI 安全层，Aqua 与 Akamai
              共同声称在边缘检查提示词流量，同时由 Aqua 监测工作负载内部行为。


              最重要的架构保留点是，公开证据更清楚证明了工作流统一，而不是后端统一。Aqua 材料支持关于单一 CNAPP
              体验、上下文化漏洞管理，以及从代码到运行时的共同旅程的说法。但它们没有暴露足够底层架构，无法证明所有模块是否共享同一策略引擎、数据平面、存储模型和发布节奏。这对投资者尤其相关，因为
              Trivy、安全态势控制、运行时执行、marketplace 包装和新的 Secure AI 故事可能在商业上连贯，却不一定在架构上相同。因此，正确的公开结论应保持平衡：Aqua
              似乎为用户提供了真实集成的运营模型，但在假设完整平台杠杆之前，集成的工程深度仍需要管理层讲解和架构尽调。
