      - number: '2.2'
        title: 规模测算视角与矛盾
        blocks:
          - type: paragraph
            body: >-
              规模证据支持区间，而不是一个精确 TAM。MarketsandMarkets 给出最窄的第三方视角，预计 CNAPP 到 2027 达到 USD 19.3 billion，并显示更早的 CWPP 前身品类到
              2023 仅达到 USD 6.70 billion。Grand View 和 Allied 发布的云安全预测大得多，但这些数字覆盖更宽的支出池和更长周期：2022-2024 基准年约 USD 35.8
              billion 至 USD 35.84 billion，增长到 2030 的 USD 75.26 billion 或 2032 的 USD 125.8 billion。National CIO Review 引用
              Gartner 的 USD 213 billion 2025 安全支出大伞更宽，最好只当作预算存在的证据，而不是 Aqua 的品类 TAM。因此，矛盾在方法上，不必然在事实上。狭义 CNAPP
              视角适合严格品类口径；更宽的云安全视角则捕捉一个 Aqua 这类平台可能随时间影响或整合的相邻安全态势、控制和合规支出。公开证据仍不足以有把握隔离 Aqua 的 SAM 或
              SOM，所以本章明确保留这个缺口，而不是把它抹平。
