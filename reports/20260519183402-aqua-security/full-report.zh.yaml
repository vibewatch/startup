      - number: '1.3'
        title: 融资历史、投资方基础与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              Aqua 公开可防守的融资历史由三个官方里程碑支撑。2019 Series C 新增 $62M，累计融资超过 $100M。March 2021 Series E 新增 $135M，估值高于
              $1B，披露的累计融资升至 $265M。January 2024 扩展轮再增 $60M，由 Evolution Equity Partners 领投，Insight Partners、Lightspeed
              Venture Partners 和 StepStone Group 参与，使披露的累计融资达到 $325M，同时估值仍高于 $1B。

              在已审阅的官方轮次中，Aqua 披露的投资方包括 ION Crossover Partners、Evolution Equity Partners、Insight Partners、Lightspeed
              Venture Partners、StepStone Group、TLV Partners、Greenspring Associates、Acrew Capital 和 M12。Aqua 的 about 页面还把
              Shlomo Kramer 列为投资者。同样重要的是未公开部分：没有已审阅来源披露股权结构表、清算优先权、创始人持股、老股占比或债务工具。作为第一章的规范事实，官方 $325M 累计融资比后续 Calcalist
              报道的约 $235M 更强；这些第三方数字保留为冲突项，而不是采纳为事实基准。
