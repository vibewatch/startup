      - number: '4.5'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              Aqua 的财务故事足以支持继续尽调，但还不够干净，不能在没有管理层访问的情况下做投资判断。公司显然有真实企业相关性：官方客户数、Fortune 100
              渗透率声明、多渠道采购足迹和经常性平台架构，都指向一门真实软件业务，而不是纯叙事空壳。融资记录也比反向媒体报道暗示的更有支撑：官方和独立来源都收敛到截至 January 2024 累计融资 $325
              million。


              阻碍同样清楚。公开证据仍未揭示实际定价、产品线组合、毛利率、CAC、回本周期、NRR、现金余额、债务或现金跑道。外部收入估计可用于框定情景，但仍低置信。与此同时，2021-2024
              估值持平、连续裁员以及明确的现金流独立表述，都暗示 Aqua 正在按效率管理，而不是明显冲刺一个高溢价增长轮。因此，正确结论是有层次的：Aqua 很可能拥有可行的企业收入模式和 CNAPP
              中的战略价值，但融资依赖和利润率质量在私有财务打开之前仍未解决。
