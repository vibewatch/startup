chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品边界与分发足迹
        blocks:
          - type: paragraph
            body: >-
              Aqua Security 创立于 2015，在当前公司标准简介中把 Boston, Massachusetts 和 Ramat Gan, Israel
              列为总部。公司把自己定位为云原生应用安全提供商，覆盖从代码到云再到提示词的生命周期。当前首页和产品材料将平台归为代码安全、运行时防护和安全态势管理几块；更广的平台描述则强调，Aqua
              用无代理与基于代理的控制覆盖软件供应链、云基础设施和实时工作负载。

              Aqua 最强的生态资产是 Trivy，这款开源扫描器也是 Aqua 自己强调的重要采用切入点。已审阅的 Trivy 材料和 GitHub 文档显示，它覆盖漏洞、配置错误、密钥、SBOM、代码库、容器镜像和
              Kubernetes 集群。Aqua 的商业分发也相当清晰，渠道包括自有合作伙伴计划、AWS Marketplace、Microsoft Azure Marketplace、Red Hat 合作伙伴目录，以及
              Cisco 的技术联盟材料。合在一起，这些来源支持一个判断：Aqua 的商业模式围绕企业云安全软件展开，通过直销、渠道、marketplace 和生态伙伴销售，而不是狭窄的单点产品。
