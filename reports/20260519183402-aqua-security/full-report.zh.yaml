      - number: '8.2'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              正向逻辑是战略位置。Aqua 仍呈现一个从代码到云的广泛云原生安全平台，以 Trivy 作为大型开源楔子，并官方声称拥有 500 多家企业客户和 Fortune 100 的 40%。Aqua 自有生态项目以及
              AWS、Azure 等云市场渠道构成的伙伴足迹，说明产品进入了主流企业采购路径，而不只是定制项目。2025 年 Akamai 合作和 Black Hat 前后的 AI 安全信息显示，Aqua
              仍在尝试把平台延伸到新的采购叙事中，而不是防守一个静态的容器单点工具。


              负向逻辑在估值信心，而不在品类位置。Aqua 最近披露的估值标记，在 2021 年 Series E 与 2024 年延伸轮之间没有明显上行；Calcalist 2025
              年关于反复裁员的报道表明，管理层一直在为韧性和现金流独立优化。裁员报道并不否定业务，但在看不到私有指标前，会削弱支付溢价倍数的理由。反向逻辑很简单：Aqua
              可能是一家好公司，但公开证据集仍太薄，不足以在陈旧独角兽锚点或以上给出强买入判断。
