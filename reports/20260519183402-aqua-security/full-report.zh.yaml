      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Aqua 的法律和监管风险，不在于有可见的公开执法行动，而在于合同结构、隐私义务，以及公开保证与企业级承诺之间的证据缺口。Aqua 隐私政策称，在平台用户按客户指示运营的场景下，公司会根据 DPA
              和配套商业协议担任数据处理者。方向上这是正确姿态，但尽调必须越过营销页面，审查实际 DPA、数据驻留、子处理者和泄露通知条款，因为云安全工具经常从受监管环境中摄入代码、镜像、遥测和安全发现。CISA
              关于组织必须管理外部依赖和运营韧性的指引，使这些下游控制成为实质事项，而不是边缘问题。

              更尖锐的问题是风险分配。Aqua 网站条款围绕有效性、可用性、完整性和无差错运行排除保证，限制责任，并将争议引至 Tel Aviv-Jaffa
              适用以色列法。它的支持和专业服务条款在运营上有帮助——其中提到商业合理的 99.9% 可用性、关联公司交付，以及 Aqua
              对分包商保留责任——但条款也保留变更权，保持价格不透明，并给出有限保证语言。供应商优先合同里，上述条款并不罕见，但意味着公开法律基线偏向公司。投资含义很直接：如果企业 MSA、DPA、SLA
              抵扣或子处理者控制弱于采购常规，买方应假设法律和事故成本暴露高于产品故事本身所暗示的水平。
