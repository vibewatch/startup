      - number: '8.3'
        title: 乐观、基准、悲观情景与可比公司集合
        blocks:
          - type: paragraph
            body: >-
              Aqua 的模型估值区间必须表达为区间，因为公司是私营企业，2024 年延伸轮只披露为高于 $1B，保留的收入代理指标来自 GetLatka，而不是审计报表。使用这个低置信度代理指标，Aqua
              的参考倍数不只是高于 SentinelOne：按估计收入略高于 11x 计算，Aqua 会高于 Tenable 的 2.41x、Okta 的 4.31x、SentinelOne 的 5.03x 和 Zscaler
              的 7.60x，只略低于 Fortinet 的 12.26x，并仍低于 Palo Alto Networks 的 16.62x 和 CrowdStrike 的 27.0x。更宽的公开可比区间，让 Aqua
              看起来更接近公开安全软件公司的高端，而不是中位。


              价差也受 Aqua 尚未公开披露的质量信号牵引。Yahoo Finance 关键统计页面显示，Fortinet 季度收入增长 20.1%、Zscaler 为 25.9%、Tenable 为 9.6%、Okta 为
              11.6%；Fortinet 和 Okta 已盈利，Zscaler 和 Tenable 仍略微亏损。Palo Alto Networks 在 Nasdaq 发布的 2025 财年结果有助于解释其更高倍数：收入增长
              15% 至 $9.2B，下一代安全 ARR 增长 32% 至 $5.6B。


              这个区间反对把 Aqua 简单称为明显便宜或明显破裂。乐观情景到 $1.6B-$2.3B，需要证明 Aqua 已显著高于公开收入代理指标，且重组后效率在改善。约 $0.9B-$1.3B
              的基准情景，假设增长稳健但并不顶尖，安全软件质量只在十几个百分点中段。$0.25B-$0.55B 的悲观情景并非理论推演：Fortinet 收购 Lacework 一案，官方条款未披露，后来
              MarketScreener 估计约为 $150M，显示当增长和效率无法收敛时，后期云安全结局可能被压缩得多厉害。
