      - number: '3.2'
        title: 能力广度、架构与买方适配
        blocks:
          - type: paragraph
            body: >-
              Aqua 的核心差异在于，即使它销售更宽的 CNAPP 故事，自己仍像一个运行时与容器专家。Aqua 官方材料和保留评论持续强化同一幅图景：买方用 Aqua
              做镜像评估、策略执行、运行时防护、合规可视化和生产深度的 Kubernetes 安全。Trivy 通过给 Aqua 一个可信的开发者、CI/CD 和开源工作流立足点，把这种位置向上游延伸。这种组合把 Aqua
              与更偏开发者治理的 Snyk 区分开，也把它与无代理优先同行区分开；后者优化的是覆盖率和优先级，而不是运行中工作负载内部的深度控制。


              代价是，Aqua 最强的能力并不等于当下市场最容易销售的路径。Wiz 的统一图谱和 Orca 的 SideScanning 架构都承诺用更少的部署摩擦带来更快的价值实现。Prisma
              Cloud、CrowdStrike 和 Fortinet 能讲更宽的企业平台故事，把云安全与其他预算和相邻产品绑定。Sysdig 是最接近的运行时导向重叠者，因为它也强调实时防御和开源可信度。因此，Aqua
              最适合真正需要工作负载深度和策略执行的安全团队，而不是主要想用最少摩擦拿到“足够好”CNAPP 覆盖的买方。
