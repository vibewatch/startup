      - CV039
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前 ARR 和收入桥
        - 2024-2026 年按产品、地区和渠道拆分的经审计 ARR / 收入
        - 判断 >$1B 公开锚点到底便宜、合理还是偏高
        - CFO 数据室和董事会批准的经营计划
      - - 净留存率和毛利率
        - NRR 队列、按模块拆分的毛利率、服务收入占比
        - 判断 Aqua 应该拿 PANW 式倍数、中档倍数，还是困境倍数
        - 财务和客户成功尽调会议
      - - 烧钱速度、现金跑道和现金流路径
        - 月度烧钱速度、现金余额、债务、达到现金流盈亏平衡的时间
        - 厘清 2025 年调整是修复了融资依赖，还是只是延后问题
        - 资金管理 / FP&A 包
      - - 股权结构表和优先权
        - 完全摊薄所有权、期权池、清算瀑布，以及 2024 年延长轮的任何附加条款
        - 没有优先股堆叠可见度，就无法计算普通股回报
        - 融资文件和股权结构表导出的法律审查
      - - 客户集中度和续约质量
        - 前 10 大客户、客户流失、NRR，以及 500+ 客户群中的产品渗透
        - 验证客户证明能否转化为可持续收入质量
        - 客户分析导出加商业化尽调
      - - 董事会对退出路径的看法
        - 关于下一轮融资、战略兴趣和 IPO 准备门槛的董事会材料
        - 判断投资人应建模战略出售可选性，还是更长的独立发展路径
        - CEO / 董事会负责人访谈和最新董事会材料
    notes: 这些问题是把本章从公开估值标记三角测算，升级为真正投资备忘录所需的最低证据集。
    claimRefs:
      - CV029
      - CV030
      - CV037
      - CV038
      - CV039
      - CV040
