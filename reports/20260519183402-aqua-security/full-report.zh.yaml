      - CU013
      - CU039
      - CU040
      - CU041
      - CU045
      - CU046
      - CU049
    data:
      items:
        - id: J1
          label: 发现
          detail: 开发者或安全从业者通过 GitLab、Harbor、Artifact Hub、社区帖子或合作伙伴渠道发现 Trivy。
          actor: 开发者 / 安全从业者
          sentiment: positive
        - id: J2
          label: 评估
          detail: 平台和安全团队根据合规与运营需求，测试镜像、代码仓库、运行时和姿态覆盖。
          actor: 平台工程 / 云安全
          sentiment: neutral
        - id: J3
          label: 采购
          detail: 企业买家直接签约，或通过 AWS Marketplace、Azure 私有报价、Red Hat 或渠道合作伙伴签约。
          actor: 采购 / 安全领导层
          sentiment: neutral
        - id: J4
          label: 生产上线
          detail: 具名账户把 Aqua 或 Trivy 部署进真实云原生工作流，覆盖银行、公共部门、软件、能源、零售和旅游。
          actor: 平台 + 安全运营
          sentiment: positive
        - id: J5
          label: 扩张
          detail: 账户从镜像和运行时控制扩展到更宽的 CNAPP、合规和新兴 AI 工作负载保护。
          actor: 安全领导层 / 架构
          sentiment: positive
        - id: J6
          label: 续约检验
          detail: 支持质量、集成、文档和企业规模性能，决定账户是否续约并标准化。
          actor: 客户成功 / 采购
          sentiment: neutral
