  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 市场信号
      - 目标客群
      - 关键差异化
      - 相比 Aqua 的主要短板
    rows:
      - - Wiz
        - 直接 CNAPP 领导者
        - '>50% 的 Fortune 100 客户；估值 $12B；融资 $1.9B'
        - 重视统一风险上下文和整合的大型云原生企业
        - 跨代码、云和运行时的统一安全图谱；企业客户势头强
        - 在深度运行时和容器执行专精上，保留证据少于 Aqua
      - - Palo Alto Networks / Prisma Cloud 平台
        - 既有云安全平台
        - 上市公司，有季度披露和广泛采购触达
        - 已标准化采用 Palo Alto，或把云安全纳入更广 SecOps 采购的企业
        - 广泛覆盖代码到云、SOC 融合，并有上市公司信任背书
        - 相比运行时牵引的专家型方案，可能显得更宽、更重
      - - Orca Security
        - 无代理优先的 CNAPP 同行
        - 无代理云安全先行者，拥有专利 SideScanning 和 280+ 条评价信号
        - 追求快速上线、广覆盖和低摩擦可视性的团队
        - 无代理部署和上下文优先级排序，不承担代理优先开销
        - 在工作负载内深度运行时控制上，保留证据弱于 Aqua
      - - Sysdig
        - 运行时中心的云防御同行
        - 运行时和 Falco 基因，叙事聚焦实时防御
        - 希望兼具运行时深度和开放创新可信度的安全团队
        - 强运行时洞察、引导式响应和 Falco 血统
        - 在左移和渠道分销的 Aqua 式广度上，保留证据较少
      - - Snyk
        - 开发者主导的邻近竞争对手
        - 知名开发者安全平台，定位 AI 编码助手
        - 重视代码和供应链治理的工程主导型组织
        - 嵌入式开发者工作流和 AI 原生左移动作
        - 运行时和工作负载执行方面，保留支撑远少于 Aqua
      - - CrowdStrike Falcon Cloud Security
        - 大型平台型邻近竞争对手
        - 大型单平台安全资产版图，且运行时营销经 MITRE 验证
        - 由安全团队主导、把 Falcon 从终端和威胁运营扩展到云的买方
        - 结合无代理可视性、传感器遥测、AI 响应和威胁情报
        - 主要差异化不在容器和 Kubernetes 运行时深度
      - - Fortinet + Lacework
        - 整合背景 / 新兴替代
        - 收购于 2024 年完成；MarketScreener 估计价格约 $150M
        - 偏好由 Fortinet 单一供应商提供网络加云安全的买方
        - 将 Fortinet Security Fabric 与 Lacework 的代理和无代理 CNAPP 资产结合
        - 在保留证据中，仍更像整合信号，而不是已重新证明的市场领导者
      - - 内部自建 + 现状工具包
        - 替代 / 非标准化路径
        - 用原生云控制、开源和邻近安全工具替代单一 CNAPP
        - 没有单一标准、只解决点状问题的小团队或平台负责人
        - 承诺最低的路径，局部覆盖往往也够用
        - 上下文割裂，统一运行时、态势和策略运营弱于 Aqua
    notes: 各行只总结保留的公开证据。若未保留公开数字，规模单元格使用已披露融资、客户、披露或平台信号，而不是编造收入估计。
