  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 参考指标
      - 倍数 / 估值 / 状态
      - 与 Aqua 的相关性
      - 局限
    rows:
      - - Aqua 参考锚点
        - 官方最近披露估值 >$1B；GetLatka 估计 2024 年收入 $89.9M
        - '>~11x 估计收入'
        - 本章情景测算的基准锚点
        - 基于不完整公开数据的私营公司估计
      - - Tenable
        - Yahoo Finance EV / 收入 2.41x；季度收入增长 9.6%；利润率 -1.15%
        - 成熟、低增速安全软件倍数
        - 增速更慢、盈利进展有限的上市安全平台，可用来校准底部
        - 暴露管理和漏洞管理组合不同于 Aqua 的 CNAPP 定位
      - - Okta
        - Yahoo Finance EV / 收入 4.31x；季度收入增长 11.6%；利润率 8.05%
        - 盈利但中等增速的身份 / 安全倍数
        - 即便安全软件已经盈利，只要增长不够顶尖，估值也可能停在低到中个位数区间
        - 身份主导的平台和商业化路径与 Aqua 差异很大
      - - SentinelOne
        - Yahoo Finance EV / 收入 5.03x，利润率为负
        - 质量较低的上市安全倍数
        - 可作为经济性较弱公司的偏底部上市参照
        - 产品组合和公开市场定价机制不同
      - - Zscaler
        - Yahoo Finance EV / 收入 7.60x；季度收入增长 25.9%；利润率 -2.25%
        - 增速更高的云安全倍数
        - 云原生安全中上部上市可比公司，披露质量明显好于 Aqua
        - 零信任 / SSE 组合不同于 Aqua 更宽的代码到云平台
      - - Fortinet
        - Yahoo Finance EV / 收入 12.26x；季度收入增长 20.1%；利润率 27.49%
        - 盈利型安全平台倍数
        - 强利润率叠加主流平台规模，在没有 CrowdStrike 式溢价时仍可拿到的估值
        - 规模更大，硬件和服务占比也不同，更像目标参照而非直接可比公司
      - - Palo Alto Networks
        - Yahoo Finance EV / 收入 16.62x；Nasdaq 披露 FY2025 收入增长 15% 至 $9.2B，下一代安全 ARR 增长 32% 至 $5.6B
        - 上市多元化安全龙头
        - 当增长和 ARR 韧性仍强时，规模化、盈利型安全平台在公开市场可获得的估值
        - 规模和多元化程度远高于 Aqua；不是纯粹的私营公司可比对象
      - - CrowdStrike
        - Yahoo Finance 基于 $4.81B 收入给出的 EV / 收入 27.0x
        - 高溢价上市云安全倍数
        - 披露充分、规模领先的品类龙头，可作为接近天花板的上市可比公司
        - 规模、披露和平台广度远超 Aqua
      - - Wiz 2024 轮融资
        - TechCrunch 披露估值 $12B；ChannelE2E 称 2023 ARR 为 $350M
        - 隐含 ARR 约 34x
        - 高增长 CNAPP 风格私营公司中，现有最好的上限参照
        - 增速、公司阶段和市场动能都不同于 Aqua，且更强
      - - Lacework 2024 出售
        - Fortinet 称条款未披露；MarketScreener 后来估计约 $150M
        - 困境战略退出；无法从保留证据可靠推导倍数
        - 晚期云安全厂商的重要下行情景先例
        - 金额来自第三方估计，本组来源也未验证 Lacework 的 ARR
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the public trading, private-round, and M&A references retained in local evidence through 2026-05-19;
        private metrics remain estimated and incomplete.
    notes: >-
      可比公司组合刻意保持混合，因为 Aqua 是私营公司，公开证据不完整。新的上市可比区间先覆盖 Tenable、Okta、Zscaler 和 Fortinet，约 2.4x 至 12.3x，再上探到 Palo Alto
      Networks 和 CrowdStrike；Wiz 和 Lacework 仍只能作为方向性的私营公司 / M&A 区间，而不是可直接标准化的可比公司。
