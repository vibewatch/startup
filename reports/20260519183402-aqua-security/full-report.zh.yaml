      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              最强的增长驱动是结构性的。Kubernetes 和容器渗透已经进入主流，多云抬高了策略与权限复杂度，更广泛的安全预算也正被应用安全、软件供应链完整性和 AI 相关风险牵引。CISA 的韧性框架，以及
              TechTarget 关于告警过载和人员不足的证据，都支持对集成化、强调优先级的平台的需求。竞争对手叙事也指向同一方向：Wiz 强调安全图谱，Orca 强调无代理上下文，Prisma Cloud 强调云到 SOC
              的融合，Sysdig 强调运行时信号与整合，Snyk 从开发者安全向外扩张，CrowdStrike 则借助套件强度和对手情报压入这个品类。主要约束在执行层面。Aqua 自己的 academy 承认 CNAPP
              标签被广泛使用，这削弱了清晰的品类测算。公开评论提到定价、集成、报告和企业级扩展摩擦。TechCrunch 强调 2024 扩展轮估值持平，CTech 报道了围绕现金流独立进行的裁员和重组。净影响是：Aqua
              参与的是健康市场，但估值上行更少取决于引用一个巨大的大口径 TAM，更多取决于证明它能在要求最高的企业买方中高效扩张。
