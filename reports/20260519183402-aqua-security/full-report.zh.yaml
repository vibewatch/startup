        title: 里程碑时间线与反向信号
        blocks:
          - type: paragraph
            body: >-
              Aqua 有日期支撑的公开时间线显示，公司早期确立品类领导地位，经过数轮融资扩张，随后进入更复杂的 2025 阶段。核心时间线从 2015 创立，到 2019 Series C，再到 2021 以独角兽估值完成
              Series E，之后出现 Trivy 相关开源牵引里程碑，并进入 2024 资本扩展轮；该轮让 Aqua 维持 $1B 以上估值，也正式确认 500+ 企业客户和 40% Fortune 100 渗透率。

              2025 记录同时增加了正面和警示信号。Aqua 在 July 2025 宣布与 Akamai 围绕 AI 应用安全建立战略合作，随后在 November 2025 执行计划中的领导层交接。但 Calcalist
              也在 December 2025
              报道，公司继续重组并再次裁员，同时给出了存在争议的融资和员工数总额。这些报道不能推翻官方融资记录，但对尽调很重要，因为它们暗示领导层更替后存在执行压力和成本纪律问题。已审阅公开来源没有识别出单独的重大监管里程碑，因此时间线聚焦于能用本地证据定日、可防守的公开创立、融资、产品、合作、治理、规模和反向事件。
