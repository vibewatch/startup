      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              CNAPP 同时触达开发、平台运维、合规和安全运营，因此买方、用户和付款方天然跨职能。Aqua 客户页面显示，其在政府、金融、能源、软件、互联网服务和零售中都有牵引；2024 融资发布则称超过 500 家企业和
              Fortune 100 的 40% 已采用其方案。需求侧证据解释了这些组织为什么购买。CNCF 报告显示，66% 的终端用户组织已经在生产环境运行 Kubernetes，56% 使用多云组合，安全是 40%
              组织面临的首要容器挑战。这意味着日常用户通常是平台安全、DevSecOps、工程安全、SRE
              和合规团队，而付款方通常是集中安全或平台预算负责人。采用往往从扫描和可视化开始，而不是一上来做大型平台标准化：Trivy 提供开发者和开源切入点，marketplace
              降低采购摩擦，合作伙伴渠道帮助联邦或大型企业落地。之后，当买方需要在代码、云安全态势、权限和实时工作负载之间建立统一上下文层，采用路径才扩展到运行时执行和策略统一。
