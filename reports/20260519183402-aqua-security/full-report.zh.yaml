      - number: '5.3'
        title: 部署、集成与可服务性
        blocks:
          - type: paragraph
            body: >-
              Aqua 的公开交付模型远不止直销 SaaS 卖法。Azure Marketplace 显示，其提供横跨 ACR、ACI、Windows containers 和 Azure DevOps 的
              Azure-native 支持。Aqua 自己的 marketplaces 代码库增加了 ECS、EKS、Fargate 和 Lambda 等 AWS 触点，以及 Red Hat Marketplace
              operator 路径和 Google Cloud 集成表述。Cisco 联盟页面则加入 Kenna 漏洞优先级排序上下文。这些来源合在一起表明，Aqua 预期客户会通过直部署、marketplace 采购、基于
              operator 的安装，以及外部分析或工单工具的多种组合采用平台。这在战略上有用，因为 CNAPP 买方很少只标准化到一个云或一种部署路径。


              可服务性信号正面但混杂。Aqua 自己网站上的客户引语称，架构师访问不额外收费；AWS 反馈称部署容易，且从代码到运行时覆盖很广。与此同时，AWS 反馈也要求更好的 API 文档，Gartner
              评论者则提到集成少于一些替代方案、遥测可视化更弱。这个组合让 Aqua 看起来运营认真，但并非无摩擦。公开记录支持真实的支持动作和广泛部署触达，却没有提供买方在假设超大资产低摩擦铺开前会想看到的
