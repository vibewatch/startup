        - 收入大约达到 $150M-$170M，留存改善、毛利率更清晰、重置后效率提升；市场给予 ~10x-13x
        - $1.6B-$2.3B
        - 1.6x-2.3x
        - 需要私有证据证明 Aqua 已明显高于公开收入代理指标，并朝盈亏平衡推进
      - - 基准
        - 50%
        - 收入大约落在 $110M-$130M，市场对可信但非顶级的网络安全增长态势给 ~8x-10x
        - $0.9B-$1.3B
        - 0.9x-1.3x
        - 如果 2024 标记方向正确但不便宜，这是最站得住脚的公开区间
      - - 悲观
        - 25%
        - 收入大约停在 $70M-$90M，发生又一次重置，买方或后期投资者套用困境资产 ~3x-6x 逻辑
        - $0.25B-$0.55B
        - 0.25x-0.55x
        - Lacework 式结局或估值下调融资很可能让普通股持有人几乎没有上行
    notes: 这些情景是估计、低置信度区间。Aqua 是私营公司，2024 年 extension 只披露为高于 $1B，收入假设用第三方估算作代理，而非经审计文件。
