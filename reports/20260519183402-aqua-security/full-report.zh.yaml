  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相邻领域
        blocks:
          - type: paragraph
            body: >-
              Aqua 位于较窄的 CNAPP 层，而不是整个云安全宇宙，因此本章先定义市场，再引用任何 TAM。TechTarget 的独立定义把 CNAPP
              锚定为一个打包平台，横跨云基础设施、云原生应用和云工作负载；Aqua 自己的 academy 则把这个包扩展到左移扫描、CSPM、KSPM、CIEM
              和运行时云工作负载防护。这些定义很重要，因为它们把软件供应链安全和运行时控制拉入可服务范围，但并不支持把每一项云安全预算都当成核心 CNAPP 支出。广义云安全类别仍包括 IAM、加密、Web
              与邮件安全、托管服务，以及其他会触达同一买方但不能替代 Aqua 的控制项。Aqua 自身材料、Microsoft 的 marketplace 上架页和 Cisco
              的联盟页面都强化了一点：它的卖点是为受监管、多云、容器密集型企业提供统一生命周期覆盖。因此，估值上实用的市场边界应是现代应用资产的集成代码、安全态势、权限和运行时安全；软件供应链安全是强相邻领域，而不是核心品类的完整替代。
