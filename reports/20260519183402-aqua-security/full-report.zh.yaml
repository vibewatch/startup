  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Aqua 从代码到云再到 prompt 的运营模型里，客户能看见的层次：从开发者扫描延伸到运行时和 AI 控制。
    approximationNotes: 该栈反映公开工作流和控制层，不是逆向工程的微服务图。Aqua 对功能层的文档比共享数据平面内部更清楚。
    data:
      layers:
        - label: 开发者与供应链入口层
          detail: Trivy 和生产前扫描在代码、代码仓库、文件系统、镜像和 VM 中发现漏洞、错误配置、密钥、SBOM 和许可证风险。
          modules:
            - Trivy 代码仓库 / 文件系统 / 镜像 / VM 目标
            - SBOM 生成
            - 密钥扫描
            - 许可证风险扫描
        - label: 上下文与姿态层
          detail: Aqua 关联漏洞、运行时行为和云上下文；姿态控制覆盖云和 Kubernetes 配置暴露。
          modules:
            - 上下文化漏洞管理
            - CSPM
            - KSPM
            - 合规视图
        - label: 运行时执行层
          detail: 生产控制在云原生环境中保护在线工作负载，抵御已知和未知威胁。
          modules:
            - 运行时保护
            - 威胁检测
            - 漂移与完整性控制
            - 策略执行
        - label: AI prompt 与工作负载层
          detail: 最新 AI 安全扩张把工作负载内监控与边缘 prompt 检查结合起来。
          modules:
            - Secure AI 运行时保护
            - prompt 防御
            - 模型 / 服务发现
            - 行为画像
        - label: 分发与集成层
          detail: 平台不是靠单一路径交付，而是通过云市场、Operator、云集成和合作伙伴分析落地。
          modules:
            - AWS / Azure / Red Hat 渠道
            - Cisco Kenna 优先级排序
            - GitHub / JFrog 集成
            - Akamai Firewall for AI 防火墙
