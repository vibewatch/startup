      - number: '6.5'
        title: 客户判断
        blocks:
          - type: paragraph
            body: >-
              客户章节应读作「真实但只完成部分论证」的故事。Aqua 显然具备企业市场地位：公司拥有庞大的官方客户数，持续披露 Fortune 100 和银行业渗透率，并有足够具名引用证明它并非只卖给匿名试点。Trivy
              周围的从业者社区强化了客户故事，说明 Aqua 不只在管理层 PPT 里有可信度，也在用户层面有信用。


              但公开证据距离投资人想要的客户韧性证明仍差很远。没有披露的队列数据，没有公开集中度表，没有续约日历，也没有可信的公开桥梁能把 Trivy 使用或云市场试用连接到付费 CNAPP
              扩张。评测平台支持「产品有价值且覆盖面广」的判断，但也暴露了规模、集成、文档和支持速度方面的抱怨；上述问题都会影响企业扩张。因此结论应保持平衡：Aqua
              的客户基础足以支持继续尽调，但最终投资判断仍取决于私下披露的留存、集中度和转化证据。
