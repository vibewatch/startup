            body: >-
              Aqua 未公开披露 NRR、GRR、总流失率、客户流失率、合同期限或续约队列，因此无法直接从公开材料观察真实留存韧性。现有最佳代理指标好坏参半：客户引语、云市场评论和评测平台反馈。正面看，GitLab
              的公开引语称客户成功支持和架构师时间免费包含在内；该支持安排对企业平台是有用的留存信号。G2 在 57 条评论中均分为 4.2/5，并给出三个月平均实施周期和十一个月平均 ROI
              窗口，说明用户确实看到了价值兑现时间。TrustRadius 有评论者描述高 ROI 和容易配置的策略，PeerSpot 则赞赏运行时保护、漂移防护和文档。


              抱怨同样真实，不应弱化。Gartner 可见评论里，一条 4.0 的正面评价仍指出价格更高、集成更少；一条 3.0 的批评性评价则称 Aqua 在真正企业级规模的镜像和容器体量上吃力。G2
              用户提到客户支持响应慢，以及 API 或功能缺口；AWS Marketplace 评论摘录和 TrustRadius 评论则指向文档、API、Jira 和 SIEM
              集成短板。合在一起，公开记录更支持「有价值，但有时运营负担重」，而不是「扩张轻松且留存指标世界级」。
