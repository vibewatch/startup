    title: 市场定义表
    columns:
      - 类别
      - 纳入的支出 / 活动
      - 排除或相邻支出
      - 主要买方 / 付款方
      - 为什么对 Aqua 重要
    rows:
      - - 核心 CNAPP
        - 整合从代码到云的平台，结合态势、工作负载、权限、Kubernetes 和左移控制。
        - 通用云 IAM、邮件 / Web 或仅网络工具。
        - CISO 或云安全负责人；中央安全预算。
        - 与 Aqua 的平台定位和可比公司集合直接匹配。
      - - CSPM / KSPM / CIEM
        - 覆盖云资产的配置、权限和 Kubernetes 态势控制。
        - 没有运行时或代码上下文的独立态势工具。
        - 云 / 平台安全；共享安全平台预算。
        - CNAPP 内常见的落地后扩张入口。
      - - CWPP / 运行时安全
        - 工作负载、容器、VM 和无服务器运行时保护，加上检测与响应。
        - 纯终端 EDR 或仅网络工具。
        - 安全运营和工作负载负责人。
        - 历史前身品类，也是当前差异化区域。
      - - 软件供应链 / AppSec
        - SCA、SAST、IaC 扫描、SBOM 和开发者工作流安全。
        - 没有云 / 运行时连接的通用 AST 套件。
        - AppSec 和 DevSecOps 项目负责人。
        - 塑造 SAM 的相邻领域，但不等同于核心 CNAPP。
      - - 广义云安全
        - CASB、加密、IAM、Web / 邮件安全、网络安全、托管服务和合规工具。
        - 总网络安全支出和非云安全品类。
        - 多个 IT 和安全预算负责人。
        - 可作为有用上限，但过宽，不能当作 Aqua 的 TAM。
    notes: 边界行结合了第三方定义和章节综合；纳入与排除的支出是分析口径，而不是正式供应商分类法。
