            body: >-
              反向证据有分量，尽管它不能干净地替代官方融资数据。Calcalist 报道称，Aqua 创始人在 2025 年末后退，公司自 2022
              起经历数轮裁员，管理层把最新重组框定为围绕长期稳定和现金流独立。Calcalist 后续文章称，Aqua 再次裁减数十名员工，当时约有 360 名员工。这些内容不应覆盖 Aqua 官方 $325 million
              累计融资数字，因为 Calcalist 约 $235 million 的融资数字与公司自己的 2024 声明和 Tracxn 融资时间线冲突。但它们确实是成本压力和运营重置上的反向信号。


              公开市场基准进一步显示 Aqua 隐藏了多少信息。Yahoo Finance 显示，Palo Alto Networks 和 CrowdStrike 都在高 EV-to-revenue
              倍数交易，同时已经产生数十亿美元收入和正自由现金流；SentinelOne 则以低得多的倍数交易，利润率大幅为负。SEC EDGAR 还显示 CrowdStrike 持续提交至 2026 的年度 10-K，凸显
              Aqua 与上市云安全同行之间的披露差距。Fortinet 2024 收购 Lacework 提供了最尖锐的下行基准：Fortinet 最初未披露价格条款，但 MarketScreener 后来估计交易约为
              $150 million。这种估值重置提醒人们：如果规模与效率无法收敛，后期云安全厂商仍可能以受压价格出清。
