      - number: '6.4'
        title: 扩张路径、集中度风险与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              Aqua 确实有清晰的落地后扩张逻辑。产品触点横跨代码、云、运行时、合规，如今又覆盖 AI 工作负载保护；因此，从容器或镜像安全切入后，扩张到更广 CNAPP 标准化具备可信路径。Trivy、GitHub
              市场、AWS Marketplace、Azure 私有报价、Cisco 联盟页面、Red Hat 认证和 Akamai 合作，都拓宽了账号发现、测试、采购或扩展平台的路径。多触点打法在战略上有帮助，因为 Aqua
              可以通过不同触点触达开发者、云架构师、安全团队和企业买方，而不是只靠单一的大客户直销动作。


              同样的渠道复杂度也带来投资论证摩擦。私有报价和伙伴协助采购意味着公开定价很弱、续约归属不清、渠道利润不可见。公开客户数标题也无法说明收入是广泛分布，还是少数大型受监管账户承担了过高 ARR
              权重。银行渗透率说法在商业上亮眼，但也提示金融服务可能对账本尤其重要。最后，Trivy 的社区足迹确实带来认知优势，但 Aqua 没有公开从免费扫描器、社区使用或云市场试用转化为付费平台 ARR
              的数据。扩张有可能；集中度与转化仍未被证明。
