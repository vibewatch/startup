        title: 付费企业基础与从业者社区
        blocks:
          - type: paragraph
            body: >-
              Aqua 的公开客户故事明显由企业主导，而不是 SMB 主导。最强的官方披露仍是 January 2024 融资发布：全球超过 500 家企业公司采用 Aqua，Fortune 100 的 40%
              使用该平台，Aqua 在北美和加拿大银行中也有深度渗透。更早的 2021 披露已经描述了 2020 付费客户翻倍、半打客户 ARR 超过 $1
              million，以及在全球最大金融机构中的银行渗透。这不是广泛自助席位业务的语言，而是大型账户、受监管企业销售的语言。


              买方、用户和付款方也明显不同。产品页面和合作伙伴界面指向开发者和 DevOps 团队，他们是 Trivy 与 CI/CD 扫描的第一批用户；平台或安全团队是 CNAPP
              的运营负责人；企业采购或合作伙伴渠道则持有更广 Aqua Platform 的合同。这个分裂很重要，因为 Aqua 的公开开源和生态触达远宽于其具名付费客户名单。Trivy 嵌入 GitLab 容器扫描，并获得
