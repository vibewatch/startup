  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 竞争与商业模式风险
        blocks:
          - type: paragraph
            body: >-
              Aqua 最严重的风险在于，CNAPP 采购正向更大的从代码到云平台集中，而 Aqua 仍是估值停滞的独角兽。Wiz 在 2024 年以 $12 billion 估值融资 $1 billion，公开目标是 $1
              billion ARR 和 IPO，并称 Fortune 100 中已有 50% 使用它。Palo Alto、CrowdStrike、Orca、Sysdig 和 Snyk 都在销售更广的 AI
              与运行时感知平台；Fortinet 收购 Lacework 则说明战略买家可以用受压价格把 CNAPP 折进更大的安全套件。Palo Alto 2025 财年结果又给出一个规模锚点：收入 $9.2
              billion，Next-Generation Security ARR $5.6 billion。上述资产负债表和经常性收入底盘，让套件厂商比 Aqua 有大得多的空间去补贴捆绑、交叉销售和 AI
              驱动的平台扩张。在上述背景下，TechCrunch 2024 年 1 月关于 Aqua 的报道明确指出，公司估值自 2021 年以来只是保持在 $1 billion
              以上，并未继续上行。估值持平标记很重要，因为它说明在资金更充足的对手拓宽平台范围和并购能力时，Aqua 没有足够快地拉开差距。

              Aqua 还面对自身制造的商品化压力。它的 Trivy 项目已经提供快速的开源漏洞、错误配置、密钥、SBOM 和许可证扫描，Aqua 称 GitLab Container Scanning、Harbor 和
              Artifact Hub 默认使用它。开源触达在战略上有价值，但也意味着基础扫描变得便宜甚至免费，而采购越来越看重集成工作流、运行时上下文和 AI
              辅助响应。独立评测网站强化了这个风险：Gartner、TrustRadius、PeerSpot 和 G2 都暴露了围绕价格、集成、可见性或企业级执行的抱怨。缓释理由是运行时深度——Aqua
              自己的领导层和工作负载安全定位强调运行时保护和漏洞管理——但在胜率、续约和附加率数据证明相反之前，投资人应把这种差异化视为狭窄护城河。
