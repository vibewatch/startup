      - number: '7.3'
        title: 运营与依赖风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，产品可信，但并不顺滑。独立评论形成了一致模式：Gartner 称 Aqua 的镜像评估强，但价格高、集成较少，可见性或遥测落后于 EDR 类工具；一条批评性 Gartner
              评论称，产品在超大企业体量下吃力；TrustRadius 和 PeerSpot 提到 Jira 与 SIEM 缺口、UI/UX 问题、Web 门户或报告短板，以及日志转发或服务器集成需求；G2
              则包含企业用户对功能交付慢和扫描覆盖缺失的抱怨。上述抱怨并不意味着 Aqua 在核心工作负载安全问题上薄弱——一些评论者赞赏策略配置、运行时保护、漂移防护和
              ROI——但确实说明，在整体工作流契合度上稳定赢下平台整合之前，公司仍有执行功课要补。

              依赖风险会放大这个产品缺口。Aqua 的 AI 安全叙事目前绑在与 Akamai 的联合故事上，而根据公开条款，支持和专业服务可以依赖关联公司与分包商。与此同时，开源 Trivy 扩大了分发，却削弱了 Aqua
              对客户必须从商业平台买回多少价值的控制。结果是一个典型的传导问题：如果集成滞后、伙伴不能转化，或 OSS 用户不升级，那么价格压力就会变成更慢的续约和更弱的融资杠杆。Aqua
              的缓释路径——运行时深度、工作负载聚焦和伙伴加速 AI 切入——仍可信，但公开证据仍更偏向产品定位和发布信息，而不是硬续约或 AI 附加指标。
