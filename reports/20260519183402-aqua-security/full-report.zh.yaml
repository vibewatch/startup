      - number: '4.2'
        title: GTM 效率与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              Aqua 有足够公开牵引标记，不能说仍未成规模。2021 年，Aqua 称 2020 付费客户翻倍，并已拥有超过 6 个 ARR 高于 $1 million 的客户。到 January 2024，公司称超过
              500 家企业采用 Aqua，Fortune 100 的 40% 使用该平台，而 2023 新业务增长 65%。这些都是有意义的企业销售指标：它们暗示不低的 ACV、较长购买周期，以及有能力赢下大型受监管账户的
              GTM 引擎。


              问题是，公开市场仍缺少核心分母。GetLatka 估计 Aqua 2024 收入为 $89.9 million，高于 2023 的 $56.3
              million，但明确把其数字标为公司报告或估计数据。用这个估计数搭配 GetLatka 的 2024 年 638 名员工快照，意味着人均收入约 $141 thousand；再与 Aqua 的 500+
              企业客户声明配对，则意味着在任何服务组合调整前，单客户收入低于约 $180 thousand。这些是可用的方向性代理指标，不是可支撑投资判断的事实。如果相当一部分客户是小型初始单或免费 /
              开源漏斗转化，它们也可能低估真实企业合同规模。同时，公开 CAC、回本周期、NRR、毛利率和服务组合缺失，意味着单位经济故事仍更偏结构性，而不是数字性。
