  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 从业务验证和战略价值出发，穿过估值不确定性，落到最终观察建议。
    data:
      nodes:
        - id: FL1
          label: 业务验证
          detail: 官方 2024 年新闻稿称有 500+ 家企业客户，并覆盖 Fortune 100 的 40%
        - id: FL2
          label: 战略价值
          detail: 从代码到云的平台、Trivy 切入点、Marketplace 渠道，以及 AI 安全扩张
        - id: FL3
          label: 公开估值锚
          detail: 最后披露的估值在 2024 年 1 月仍高于 $1B
        - id: FL4
          label: 数据缺口
          detail: Aqua 是私营公司；年经常性收入（ARR）、净留存率（NRR）、毛利率、烧钱速度和优先股堆叠均未披露
        - id: FL5
          label: 反向执行信号
          detail: 2025 年裁员和重组放大下行空间，也提高融资风险敏感度
        - id: FL6
          label: 建议：观察
          detail: 等价格更低或非公开经营指标更强，再考虑买入
