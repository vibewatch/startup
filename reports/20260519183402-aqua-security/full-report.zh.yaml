      - number: '8.4'
        title: 投资逻辑破裂触发点、退出框架与尽调问题
        blocks:
          - type: paragraph
            body: >-
              最终判断仍停留在观察，因为剩余尽调不是装饰性工作。缺失项正是决定 Aqua 究竟是有纪律的后期软件资产，还是结构受损的独角兽估值标记的关键：当前 ARR、净收入留存、毛利率、烧钱速度、现金跑道、客户集中度，以及
              2024 年延伸轮的实际优先股堆叠。公开来源无法回答这些问题；缓存中无法访问或损坏的分析师 / 存档页面也进一步说明，公开三角验证并不完整。


              因此，投资逻辑破裂触发点很直接。再次发生重大重组、融资低于 2024 年估值标记、苛刻优先股条款，或出现大客户不续约证据，都会把案例推向回避。相反，如果私下披露 ARR 高于大约 $120M、NRR 高于大约
              115%、毛利率高于大约 75%，并有可信路径走到现金流盈亏平衡，估值姿态会实质上更接近合理。从公开证据看，最可能的退出是战略出售，或在效率得到证明后再融资；相比上市同行或 Wiz，近期 IPO 更难论证。
