  - id: TV005
    title: 投资逻辑失效和终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 投资逻辑传导
      - 行动含义
    rows:
      - - 下轮融资降估值或惩罚性延长轮
        - 新股融资低于 2024 年 >$1B 标记，或条款明显偏向既有投资人
        - 证实公开锚点夸大了当前股权价值
        - 从观察转向回避，除非条款仍能保护新资金
      - - 再次重大重组
        - 新一轮大范围裁员，或有明确证据显示 2025 年调整没有稳定经营
        - 表明效率仍未修复，增长质量在恶化
        - 在管理层证明可持续经营控制前，视为投资逻辑失效
      - - 实际 ARR 明显弱于代理指标
        - 私营公司过去 12 个月收入明显低于公开的 $89.9M 代理值
        - 推高隐含入场倍数，摧毁基准情景测算
        - 不按独角兽估值投资
      - - 留存 / 利润率失败
        - NRR 低于约 110%，或毛利率低于约 70%
        - 连中档安全软件倍数的理由也被拿掉
        - 下调估值区间，并按困境增长资产重新承销
      - - 竞争挤压
        - 证据显示大型套件用捆绑式 CNAPP 和 AI 安全产品抹平 Aqua 差异化
        - 战略稀缺性下降，退出选项变窄
        - 更偏向只按战略出售来建模，而非增长股权上行
    notes: 触发因素聚焦会实质改变估值支撑的事件，而不是普通季度噪音。
    claimRefs:
      - CV029
      - CV030
      - CV035
      - CV036
      - CV037
