  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              Aqua 变现的是一套宽口径云原生应用保护平台，而不是单一单点产品。官方产品页描述了一个集成 CNAPP，横跨代码安全、云安全、运行时防护、漏洞管理和 AI 时代工作负载保护。TechCrunch 2021
              年的报道补充说，Aqua 当时已经从较窄的容器安全工具转向平台打法；Trivy 页面则显示，Aqua 仍维护一个分发很广的开源扫描器，可作为开发者入口漏斗。最清晰的收入含义是，Aqua
              的核心业务是卖给大型组织的经常性企业软件，而不是 SMB 自助服务或消费者路径。


              公开记录没有显示实际价目表。相反，Aqua 似乎通过协商式企业合同和渠道辅助采购变现。Azure 上架页明确是私有报价 marketplace 页面，GitHub marketplaces 代码库推广
              30-day trial 和 marketplace 采购，合作伙伴计划覆盖 MSP、系统集成商、分销商和联邦渠道。这种组合支持先落地再扩张模式和多条采购路径，但也意味着实际
              ASP、折扣和附加销售率仍被隐藏。Aqua 自己的客户材料显示，一些架构师时间和客户成功支持不额外收费，这有利于采用，却也模糊了服务边界和订阅经济性。
