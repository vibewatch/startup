      - number: '3.3'
        title: 定价、包装、GTM 与信任姿态
        blocks:
          - type: paragraph
            body: >-
              保留的公开证据没有显示一个充满透明标价的市场。Aqua 自己的公开包装信号指向协商式企业销售，包括 Microsoft Marketplace 私有报价路径，而不是清晰公开价目表；G2
              数据也指向数月实施路径和协商折扣。这在 CNAPP 中并不罕见。保留材料中的 Wiz、Orca、Prisma Cloud、CrowdStrike 和 Sysdig 也都呈现 demo
              驱动的企业销售路径，这意味着定价压力通过包装和整合体现，而不是通过明显的公开价格战体现。在这一组中，最清晰的相对透明度优势并不来自这里点名的某个 Aqua
              对手，而是一个一般事实：更容易采用或套件更宽的替代方案，可以把买方预期往下锚定。


              GTM 上，Aqua 拥有比许多私营同行更多的渠道证据：MSP、SI、经销商、分销商、联邦合作伙伴、Cisco 联盟材料、Azure Marketplace，以及其他云上的 marketplace
              引用。这有助于抵消 Aqua 作为私营公司的披露画像，但并不能完全解决它与上市既有厂商之间的信任对比。Palo Alto Networks、CrowdStrike 和 Fortinet
              受益于更广的采购关系、更宽的相邻产品资产，以及上市公司披露界面；在大型企业或受监管采购流程中，它们更容易通过审查。
