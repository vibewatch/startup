  - id: TP004
    title: 护城河持久性 / 竞争风险登记
    columns:
      - Aqua 护城河或风险
      - 威胁
      - 严重性
      - 重要性
      - 缓解措施 / 尽调问题
    rows:
      - - 运行时和容器深度
        - Wiz、CrowdStrike、Prisma Cloud 和 Sysdig 都在扩展运行时主张
        - 高
        - 运行时深度是 Aqua 最清晰的差异化点，若被侵蚀，会直接压缩赢单质量
        - 索取运行时重度 Kubernetes 账户相对具名竞争对手的当前胜率
      - - Trivy 开源动作
        - 开源可能带来认知，但未必稳定转化为付费
        - 中
        - 只有能输送销售管线、带来附加购买或防守性留存，Trivy 才能成为护城河
        - 索取 Trivy 用户转化、附加购买并续约付费 Aqua 模块的证据
      - - 无代理优先的购买转向
        - Orca 和 Wiz 降低部署摩擦，可能赢下想要快速覆盖的团队
        - 高
        - 如果买方更看重上线速度而非更深控制，Aqua 的技术深度就更难变现
        - 对比无代理优先竞争对手，衡量价值实现时间和管理开销
      - - 平台整合压力
        - Palo Alto、CrowdStrike 和 Fortinet 可将云安全折入更大的平台交易
        - 高
        - 采购便利性和邻近产品杠杆可能压过专家型优势
        - 按既有安装基础和套件语境复盘输单，而不只看功能清单
      - - 定价不透明和企业复杂度
        - 评价证据指向价格、集成和 UI 摩擦
        - 高
        - 包装不透明、运营摩擦更高，会让更简单的替代方案更容易显得够用
