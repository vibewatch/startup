  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、估值锚点与限制条件
        blocks:
          - type: paragraph
            body: >-
              Aqua 应被视为观察标的，而不是确信买入，因为公开记录支持一家真实业务，却不支持精确定价。官方公司公告仍锚定硬事实：Aqua 成立于 2015 年，运营地在 Boston 和 Ramat Gan，截至 2024
              年 1 月累计融资 $325M，估值仍高于 $1B，并称超过 500 家企业客户使用该平台，其中包括 Fortune 100 的 40%。上述事实都是有意义的证明点；2025 年 11 月领导层交接公告也确认
              Mike Dube 是现任 CEO。


              投资论证问题在于，Aqua 是私营公司，公开数据不完整。最强的公开收入代理指标是 GetLatka 估计的 2024 年收入 $89.9M；按 $1B 参考估值计算，收入倍数略高于
              11x，但该估计置信度低且未经审计。TechCrunch 也把 2024 年 1 月延伸轮描述为基本延续 2021 年独角兽轮的持平融资；Calcalist 后来又报道裁员和重组。在
              ARR、NRR、毛利率、烧钱速度和优先股数据不完整的情况下，正确姿态是有纪律的兴趣，而不是激进入场。
