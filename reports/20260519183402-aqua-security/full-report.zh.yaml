    title: 风险传导图
    type: dag
    layout: wide
    summary: 展示 Aqua 的市场、产品和组织风险如何传导到续约、利润率、融资和估值。
    data:
      nodes:
        - id: bundled-platforms
          label: 捆绑式平台
          type: input
          description: 大型套件挤压独立 CNAPP 需求。
        - id: review-gaps
          label: 评测网站产品缺口
          type: input
          description: 定价、可见性和集成问题削弱企业适配度。
        - id: reorganization
          label: 重组与裁员
          type: input
          description: 降本动作和领导层更替拖慢执行。
        - id: ai-bet
          label: AI 扩张押注
          type: input
          description: Secure AI 需要加码产品和 GTM 投入。
        - id: renewal-pressure
          label: 续约压力
          type: process
          description: 竞争流失和工作流摩擦打击留存与增购。
        - id: margin-pressure
          label: 利润率压力
          type: process
          description: 折扣和额外执行投入压缩效率。
        - id: financing-risk
          label: 融资风险
          type: output
          description: 增长质量走弱，会削弱未来融资谈判筹码。
        - id: valuation-risk
          label: 估值风险
          type: output
          description: 投资人和员工仍要面对估值持平或下调风险。
      edges:
