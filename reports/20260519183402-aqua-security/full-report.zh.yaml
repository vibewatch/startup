      - number: '1.2'
        title: 创始人、领导层交接与治理状态
        blocks:
          - type: paragraph
            body: >-
              即使 November 2025 已完成正式交接，Aqua 的创始领导层仍是公司叙事的核心。曾任 CEO 的联合创始人 Dror Davidoff 和曾任 CTO 的联合创始人 Amir Jerbi
              都退出日常高管岗位，转任战略顾问。公司把总裁兼首席营收官 Mike Dube 提拔为 CEO，并将工程高级副总裁 Nir Makowski 提拔为首席产品与技术官。Aqua
              将这次交接描述为进入下一阶段增长和全球扩张的计划动作，而非创始人离场。

              Dube 的背景更偏 GTM 执行，而不是创始产品愿景：Aqua 称他曾在 CrowdStrike、Splunk、Cybereason 和 Check Point
              担任高级职务。这让他适合扩张企业销售，但也加大了公司对 Makowski
              以及仍有影响力的创始人在技术连续性上的关键人依赖。公开材料只能看到部分治理情况。已审阅的官方和第三方来源识别出创始人、投资方和高管变动，但没有披露当前董事会名单、创始人持股比例或正式继任条款。领导层调整之后，这些缺口都是实质性尽调问题。
