      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              支撑最强的资本事实是官方口径：Aqua 在 March 2021 融资 $135 million，使累计融资达到 $265 million；January 2024 又增加 $60 million，使累计融资达到
              $325 million。TechCrunch 和 Globes 佐证，2024 资金是 2021 Series E 的扩展，而不是明显重新定价的新一轮；三个来源都继续把公司描述为估值高于或超过 $1
              billion。这对时间线有帮助，但对投资判断的帮助有限，因为三年里独角兽标记持平通常意味着新资本延长了现金跑道，并未证明业务已经挣到显著更高估值。


              剩下的资本充足性问题，正是私营公司可以选择不公开回答的问题。Aqua 2021 年新闻稿称，募集资金将深化产品组合并扩张地域，这符合一家仍在 R&D 和企业 GTM 上实质投入的公司。但本证据集中没有公开来源披露
              2024 扩展后的现金、债务、月度烧钱或现金跑道。2025 官方领导层交接发布谈的是增长和全球扩张，而不是资产负债表自给。因此，资本图景是复杂的：Aqua
              无疑已筹集有意义资本并保住独角兽身份，但公开记录仍不能说明这些资本现在支撑的是一个自我造血的业务，还是只是把下一次融资决策的时间拉长。
