      - number: '1.4'
        title: 客户规模、封面指标与明确不支持的数字
        blocks:
          - type: paragraph
            body: >-
              Aqua 最强的官方规模指标来自 January 2024 融资发布。公司当时称，全球已有超过 500 家企业客户，其中包括 Fortune 100 的 40%，并服务北美前 10 大银行中的 6 家、加拿大前
              7 大银行中的 6 家。客户页面提供了定性广度而非硬数量，展示了政府、金融、能源、旅游科技、软件和零售等领域的证明点。TechCrunch 的后续报道还引用 PayPal、Netflix 和 Samsung
              作为公司声称的客户。

              Aqua 还称 2023 新业务增长 65%，而 2021 Series E 发布称，公司 2020 付费客户翻倍，并已拥有半打 ARR 超过 $1M 的客户。这些信号支持真实的商业成熟度，2024 奖项和
              Trivy 的持续存在感也同样支持这一点。不过，本章审阅的官方一手来源没有披露当前收入、ARR、毛利率、NRR 或员工数。找到的唯一收入数字信号是 GetLatka 报道的 2024 收入
              $89.9M；员工数信号在 GetLatka 和 Calcalist 之间存在实质冲突。因此，KPI 表在有官方数字时保留官方口径，并把收入和员工数标为未获支持或存在冲突，而不是伪装成精确值。
