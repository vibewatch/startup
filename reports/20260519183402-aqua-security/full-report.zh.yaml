      - number: '5.4'
        title: 信任、合规与质量控制
        blocks:
          - type: paragraph
            body: >-
              作为一家私营安全厂商，Aqua 公开的信任栈出奇地多。合规页面称，Aqua 获得敏感未分类联邦数据最高影响级授权，覆盖 400 多项安全控制；获得 ISO 27001、27701、27017、27018 和
              42001 认证；每年接受 SOC 2 审计；并发布 CSA STAR 自评材料。这比许多私营基础设施软件厂商公开的信任姿态具体得多。ISO 42001 披露尤其有用，因为 Aqua 现在正在营销 AI
              安全能力，可以指向正式 AI 管理体系标准，而不仅是功能营销。


              质量证据更复杂。评论和 marketplace
              来源确实支持真实生产使用、有意义的运行时价值和广泛合规可视化。它们也暴露了摩擦：文档深度、集成广度和遥测可视化并未获得一致好评。因此，信任图景呈现一种有利的不对称：治理和认证证据很强，运营遥测相对薄。对尽调而言，这意味着
              Aqua 已经有资格在安全和合规姿态上被认真看待，但仍需要展示实际面向客户的服务指标、支持表现，以及超出认证和客户证言的运营质量证据。
