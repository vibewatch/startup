  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 从客户工作流看 Aqua Platform
        blocks:
          - type: paragraph
            body: >-
              Aqua 最强的公开产品故事是工作流故事，而不是单一模块故事。官方首页和平台页面持续把 Aqua
              描述为一个从代码到云再到提示词的云原生应用保护平台：开发者早期扫描，云和平台团队获得跨安全态势与运行时的风险上下文，生产团队在实时工作负载中执行策略。这个定位重要，因为 Aqua 卖的不是简单的漏洞仪表盘或
              Kubernetes 运行时插件。它声称要解决的客户任务，是在软件从代码库和 CI/CD，进入容器、集群、serverless 函数，再到如今 AI 连接工作负载时，保持同一个应用风险闭环不断裂。


              Trivy 是进入这条工作流最清晰的公开入口。Aqua 将 Trivy 营销为可低摩擦接入 CI/CD 的开源扫描器，而 GitHub
              代码库和文档显示，它覆盖代码库、文件系统、容器镜像、Kubernetes、VM 镜像、密钥、配置错误、SBOM 和许可证风险。用客户语言说，Aqua
              可以先与开发者或平台工程师开启对话，再让买方承诺更大的平台铺开。商业平台随后叠加上下文优先级排序、安全态势可视化、运行时防护，以及 AI 提示词或工作负载防护。因此，公开证据强烈显示，Aqua
              想拥有从开发阶段卫生到生产执行的交接，尽管公开 SKU 边界仍比工作流叙事薄得多。
