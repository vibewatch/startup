      - number: '7.4'
        title: 人员与执行风险
        blocks:
          - type: paragraph
            body: >-
              人员风险格外重要，因为 Aqua 的战略转向与组织压力发生在同一时间。2025 年 11 月，两位创始人同时退出日常 CEO 和 CTO 角色，Mike Dube 从 CRO 转为 CEO，Nir
              Makowski 出任首席产品与技术官。该交接可以是健康的职业化步骤，但仍然是产品愿景、技术权威和商业责任的一次重大转移。几周后裁员跟进，风险不是下降而是上升。Calcalist 描述了 2022-2026
              年间多轮裁员，包括一次以现金流独立为目标的 2026 年重组。公开员工数描述从 2025 年末约 450 人，降至最近裁员后的约 360 人；降幅并不致命，但对路线图和支持能力很重要。

              原因在于，Aqua 不是在收割一个成熟业务；它一边要守住核心 CNAPP 经济性，一边还要扩张到 AI
              工作负载和提示安全保护。刚刚重组过的领导团队要完成这项运营任务并不轻松。缓释因素在于，创始人仍担任战略顾问，官方计划继续聚焦运行时保护和漏洞管理，Aqua 也仍声称拥有有意义的 Fortune 100
              渗透率。但在尽调证明产品速度稳定、客户成功覆盖未受损，并出现具名 AI 安全生产环境胜利之前，投资人应假设最可能把可投资故事变成价值陷阱的因素是执行，而不是纯粹的市场规模。
