  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局概览与竞争框架
        blocks:
          - type: paragraph
            body: >-
              Aqua 所在的 CNAPP 市场已经不再像简单的单点解决方案品类。直接云安全同行是 Wiz、Orca、Prisma Cloud 和 Sysdig；相邻的开发者主导挑战者是 Snyk；大型平台竞争者是
              CrowdStrike；Fortinet 加 Lacework
              则提供整合背景，即使它们不一定是当前候选清单中最先出现的实时替代方案。现状替代并不是“不做安全”，而是一组原生云控制、开源扫描器和相邻平台，足以解决相当一部分任务，不必标准化到 Aqua。


              这个框架很重要，因为 Aqua 并不只想靠广义 CNAPP 勾选项取胜。其保留下来的最强证据集中在容器、Kubernetes 和运行时深度；Wiz 和 Orca 则围绕图谱上下文和无代理优先接入赢得心智；Palo
              Alto、CrowdStrike 和 Fortinet 越来越把云安全作为更大安全资产中的一个模块销售。因此，Aqua
              必须同时打赢多个待办任务：成为最好的运行时操作者，提供可接受的代码到云广度，具备可信的开发者工作流，并拥有足够宽的平台经济性，以免被整合替代。
