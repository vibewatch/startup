        - 客户集中、流失或非活跃 logo 数据会很快削弱这一证明
      - - 投资逻辑
        - 平台凭借代码到云端覆盖、Trivy 分发和主要云市场渠道，仍具战略相关性
        - 如果证明 Trivy 无法转化为付费销售管线，或买方只把 Aqua 当作一个功能，稀缺价值会下降
      - - 投资逻辑
        - 2025 年 Akamai 合作和 AI 安全叙事说明产品仍在演进，而不是品类停滞
        - 如果 AI 安全扩张主要停留在叙事、没有商业采用，市场扩张论点会变弱
      - - 反向逻辑
        - 最近披露估值在 2024 年仍高于 $1B，但相对 2021 年独角兽轮没有可见上调
        - 之后若有经审计指标支撑、价格显著更高的融资，可反驳估值持平的担忧
      - - 反向逻辑
        - 2025 年裁员和重组说明 Aqua 更像在延长现金跑道、重置效率，而不是明显复合增长冲向溢价轮
        - 若有清晰证据显示现金流盈亏平衡和可持续增长，重置会从防御性变成建设性
      - - 反向逻辑
        - 公开指标太不完整，无法有信心给普通股定价，尤其是优先权和稀释
        - 如果完整数据室提供 ARR、NRR、毛利率、烧钱速度和清算瀑布，判断可能转向买入
    notes: 本表在业务质量和估值确定性之间权衡。反向逻辑聚焦证据和定价纪律，并不否认 Aqua 拥有有意义的产品和客户。
