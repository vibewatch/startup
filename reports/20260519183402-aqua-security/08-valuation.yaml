- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Side
  - Argument
  - What would change the view
  rows:
  - - Thesis
    - 'Aqua still has real scale: 500+ enterprise customers and 40% of the Fortune 100 from official 2024 disclosures'
    - Customer concentration, churn, or inactive-logo data would weaken this proof quickly
  - - Thesis
    - The platform remains strategically relevant through code-to-cloud coverage, Trivy distribution, and major marketplace channels
    - Proof that Trivy does not convert to paid pipeline or that buyers treat Aqua as a feature would reduce scarcity value
  - - Thesis
    - The 2025 Akamai partnership and AI-security messaging indicate ongoing product evolution rather than category stagnation
    - If AI-security expansion is mostly narrative with no commercial adoption, the market-expansion argument weakens
  - - Anti-thesis
    - The last disclosed valuation stayed above $1B in 2024 without a visible mark-up from the 2021 unicorn round
    - A later financing at a materially higher price backed by audited metrics would rebut the flat-mark concern
  - - Anti-thesis
    - 2025 layoffs and restructuring suggest Aqua was extending runway and resetting efficiency, not obviously compounding into a premium round
    - Clean evidence of cash-flow breakeven and durable growth would make the reset constructive instead of defensive
  - - Anti-thesis
    - Public metrics are too incomplete to price the common equity confidently, especially around preferences and dilution
    - A full data room with ARR, NRR, gross margin, burn, and liquidation waterfall could move the call toward buy
  notes: This table weighs business quality against valuation certainty. The anti-thesis is about evidence and pricing discipline, not about denying that Aqua has meaningful products or customers.
