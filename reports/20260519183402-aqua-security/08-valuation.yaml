- id: triggers-and-diligence-asks
  title: Thesis-break triggers, exit framing, and diligence asks
  body: |-
    The final call stays at track because the remaining diligence is not cosmetic. The missing items are exactly the items that determine whether Aqua is a disciplined late-stage software asset or a structurally impaired unicorn mark: current ARR, net revenue retention, gross margin, burn, runway, customer concentration, and the actual preference stack from the 2024 extension. Public sources do not answer those questions, and the blocked or broken analyst/archive pages in the cache reinforce that public triangulation is incomplete.

    That makes the thesis-break triggers straightforward. Another major restructuring, a financing below the 2024 mark, punitive preferred terms, or evidence that large customers are not renewing would all push the case toward avoid. By contrast, private disclosure of ARR above roughly $120M, NRR above roughly 115%, gross margin above roughly 75%, and a credible path to cash-flow breakeven would move the valuation stance materially closer to fair. From public evidence, the most plausible exits are a strategic sale or a later financing once efficiency is demonstrated; a near-term IPO is much harder to underwrite than it is for listed peers or Wiz.
