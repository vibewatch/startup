  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: Current ARR, NRR, margin, burn, and runway
    missingEvidence: Audited current ARR / revenue, net revenue retention, gross margin, CAC payback, cash balance, burn, and runway.
    whyItMatters: These inputs decide whether Aqua deserves a stretched, fair, or distressed valuation range and whether the 2025 reset actually fixed financing dependency.
    diligencePath: Request the CFO operating model, audited revenue bridge, board package, and latest monthly finance pack.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV001
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: Cap table and 2024 extension terms
    missingEvidence: Fully diluted ownership, liquidation preferences, any participating preferred terms, and whether the 2024 extension included secondary shares or unusual rights.
    whyItMatters: Common-equity return math can be badly overstated when preference overhang or off-market terms are hidden.
    diligencePath: Review financing documents, cap-table export, and counsel-prepared liquidation waterfall for the latest round.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV001
    - TV005
    - TV006
  - type: private-evidence-only
    severity: material
    topic: Customer concentration and renewal quality
    missingEvidence: Top-customer ARR share, product penetration, logo churn, gross retention, and net retention across the 500-plus customer base.
    whyItMatters: Aqua's public customer count is impressive, but valuation depends on revenue durability, not logo count alone.
    diligencePath: Obtain cohort analysis, top-20 customer summary, and renewal / expansion dashboards from GTM leadership.
    relatedQuestionRefs:
    - QV031
    relatedTableRefs:
    - TV006
  - type: conflicting-data
    severity: material
    topic: Headcount and total-raised conflicts
    missingEvidence: A management-verified history of headcount changes and a definitive financing chronology that reconciles official, Tracxn, and Calcalist figures.
    whyItMatters: Conflicting workforce and funding numbers make it harder to infer operating efficiency and the real degree of dilution or capital consumed.
    diligencePath: Ask finance and HR for board-approved headcount history plus a financing timeline signed off by legal.
    relatedQuestionRefs:
    - QV008
    - QV009
  - type: access-blocked
    severity: minor
    topic: Supplementary customer-proof and analyst pages
    missingEvidence: The cached Tracxn funding-investor page was rate-limited, Crunchbase was JS-blocked, and several Aqua archive URLs for case studies and reports resolved as broken pages.
    whyItMatters: These blocked or broken pages do not overturn the core view, but they reduce public triangulation on investor roster, archived customer proof, and supporting market materials.
    diligencePath: Request current customer case studies directly from Aqua and use licensed datasets for investor-history validation.
    relatedQuestionRefs:
    - QV017
    - QV019
  - type: enumeration-incomplete
    severity: minor
    topic: Comparable valuation table TV004 precision
    missingEvidence: Normalized ARR, margin, and growth inputs for private or acquired comparables such as Wiz and Lacework.
    whyItMatters: Without normalized private-comp financials, comparable multiples are directional rather than exact and can overstate or understate Aqua's true valuation band.
    diligencePath: Cross-check with licensed private-market datasets and any investor-shared comp sheets before setting an entry price.
    relatedQuestionRefs:
    - QV015
    - QV016
    relatedTableRefs:
    - TV004
