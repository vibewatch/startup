- id: scenario-analysis-and-comparables
  title: Bull, base, bear framing and comparable set
  body: |-
    Aqua's modeled valuation range has to be expressed as a range because the company is private, the 2024 extension was disclosed only as above $1B, and the retained top-line proxy comes from GetLatka rather than audited statements. Using that low-confidence proxy, Aqua's reference multiple is not merely above SentinelOne: at a little over 11x estimated revenue, Aqua would sit above Tenable's 2.41x, Okta's 4.31x, SentinelOne's 5.03x, and Zscaler's 7.60x, while landing only modestly below Fortinet's 12.26x and still below Palo Alto Networks' 16.62x and CrowdStrike's 27.0x. That wider public-comp band makes Aqua look closer to the high end of public security software than to the middle.

    The spread also tracks quality signals that Aqua has not disclosed publicly. Yahoo Finance's key-statistics pages show quarterly revenue growth of 20.1% for Fortinet, 25.9% for Zscaler, 9.6% for Tenable, and 11.6% for Okta; Fortinet and Okta are profitable, while Zscaler and Tenable remain slightly loss-making. Palo Alto Networks' fiscal 2025 results, published on Nasdaq, help explain its richer multiple: revenue grew 15% to $9.2B and next-generation security ARR rose 32% to $5.6B.

    That range argues against calling Aqua obviously cheap or obviously broken. A bull case to $1.6B-$2.3B needs evidence that Aqua is already materially above the public revenue proxy and that post-restructuring efficiency is improving. The base case of roughly $0.9B-$1.3B assumes steady but not elite growth and only mid-teens security-software quality. The bear case of $0.25B-$0.55B is not theoretical: Fortinet's acquisition of Lacework, later estimated by MarketScreener at about $150M after undisclosed official terms, shows how badly late-stage cloud-security outcomes can compress when growth and efficiency fail to converge.
