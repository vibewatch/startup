- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Reference metric
  - Multiple / valuation / status
  - Relevance to Aqua
  - Limitation
  rows:
  - - Aqua reference anchor
    - Official last disclosed mark >$1B; GetLatka 2024 revenue estimate $89.9M
    - '>~11x estimated revenue'
    - Baseline anchor for this chapter's scenario work
    - Private-company estimate using incomplete public data
  - - Tenable
    - Yahoo Finance EV/revenue 2.41x; quarterly revenue growth 9.6%; profit margin -1.15%
    - Mature lower-growth security-software multiple
    - Useful floor reference for a public security platform with slower growth and only modest profitability progress
    - Exposure-management and vulnerability-management mix differs from Aqua's CNAPP positioning
  - - Okta
    - Yahoo Finance EV/revenue 4.31x; quarterly revenue growth 11.6%; profit margin 8.05%
    - Profitable but moderate-growth identity/security multiple
    - Shows that even profitable security software can stay in the low-to-mid single-digit band when growth is not elite
    - Identity-led platform and go-to-market differ materially from Aqua
  - - SentinelOne
    - Yahoo Finance EV/revenue 5.03x with negative profit margin
    - Lower-quality public security multiple
    - Useful floor-ish listed comp for weaker economics
    - Different product mix and public-market dynamics
  - - Zscaler
    - Yahoo Finance EV/revenue 7.60x; quarterly revenue growth 25.9%; profit margin -2.25%
    - Higher-growth cloud-security multiple
    - Relevant upper-middle public comp for cloud-native security with much better disclosure than Aqua
    - Zero-trust / SSE mix differs from Aqua's broader code-to-cloud platform
  - - Fortinet
    - Yahoo Finance EV/revenue 12.26x; quarterly revenue growth 20.1%; profit margin 27.49%
    - Profitable security-platform multiple
    - Shows what strong margins plus mainstream platform scale can earn without CrowdStrike-style premium valuation
    - Larger scale plus hardware and services mix make it an aspirational rather than direct comp
  - - Palo Alto Networks
    - Yahoo Finance EV/revenue 16.62x; Nasdaq FY2025 revenue +15% to $9.2B and next-generation security ARR +32% to $5.6B
    - Listed diversified security leader
    - Shows what a scaled, profitable security platform can trade at in public markets when growth and ARR durability remain strong
    - Much larger and more diversified than Aqua; not a pure-play private comp
  - - CrowdStrike
    - Yahoo Finance EV/revenue 27.0x on $4.81B revenue
    - Premium public cloud-security multiple
    - Ceiling-like public comp for category leaders with deep disclosure and scale
    - Scale, disclosure, and platform breadth far exceed Aqua
  - - Wiz 2024 round
    - TechCrunch $12B valuation; ChannelE2E says $350M 2023 ARR
    - ~34x implied ARR
    - Best available high-growth CNAPP-style private ceiling reference
    - Different growth rate, newer company, and stronger market momentum than Aqua
  - - Lacework 2024 sale
    - Fortinet said terms undisclosed; MarketScreener later estimated about $150M
    - Distressed strategic outcome; multiple not reliably derivable from retained evidence
    - Important downside precedent for late-stage cloud-security vendors
    - Amount is based on third-party estimate and Lacework ARR is not verified in this source set
  enumerationScope:
    coverage: partial
    basis: Covers the public trading, private-round, and M&A references retained in local evidence through 2026-05-19; private metrics remain estimated and incomplete.
  notes: Comparable set is intentionally mixed because Aqua is private and public evidence is incomplete. The fresh public-comp corridor now spans roughly 2.4x to 12.3x across Tenable, Okta, Zscaler, and Fortinet before stepping up to Palo Alto Networks and CrowdStrike; Wiz and Lacework remain directional private/M&A brackets rather than directly normalized comps.
