- id: expansion-and-friction
  title: Expansion Motion, Concentration Risk, and Procurement Friction
  body: |-
    Aqua does have a visible land-and-expand logic. Product surfaces span code, cloud, runtime, compliance, and now AI-workload protection, which makes it plausible that a first sale into container or image security can expand into broader CNAPP standardization. Trivy, GitHub marketplaces, AWS Marketplace, Azure private offers, Cisco alliance pages, Red Hat certification, and the Akamai partnership all widen the number of ways an account can discover, test, procure, or extend the platform. That is strategically helpful because it lets Aqua reach developers, cloud architects, security teams, and enterprise buyers through different surfaces instead of one monolithic field-sales motion.

    The same channel complexity also creates underwriting friction. Private offers and partner-assisted procurement mean public pricing is weak, renewal ownership is unclear, and channel margin is invisible. Public customer-count headlines also do not reveal whether revenue is broadly distributed or whether a smaller number of large regulated accounts carry disproportionate ARR weight. The bank-penetration claims are commercially impressive, but they also warn that financial services may be especially important to the book. Finally, Trivy's community footprint is a real awareness advantage, yet Aqua gives no public conversion math from free scanners, community usage, or marketplace trials into paid platform ARR. Expansion is plausible; concentration and conversion remain unproven.
  claimRefs:
  - CU036
