- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Driver / risk
  - Public evidence
  - Impact on revenue durability
  - Evidence quality
  - Diligence path
  rows:
  - - Platform breadth enables cross-sell
    - Aqua product and platform pages span code, cloud, runtime, compliance, and AI-workload security
    - 'Positive: supports land-and-expand after initial workload-security win'
    - Medium
    - Request module attach rates, product-family ARR, and expansion paths by cohort
  - - Trivy practitioner funnel
    - Trivy docs, GitHub, and community quotes show wide practitioner reach
    - 'Positive but unproven: expands awareness and trust at technical-user level'
    - Medium
    - Request Trivy-to-paid conversion, PQL / SQL creation, and sourced pipeline contribution
  - - Marketplace and private-offer procurement
    - AWS listing, Azure private offer, and GitHub marketplace trial surface are public
    - 'Mixed: can accelerate land motion while obscuring realized pricing and renewal ownership'
    - Medium
    - Request direct vs marketplace bookings, billing owner, and renewal economics by channel
  - - Partner leverage
    - Cisco, Red Hat, and Akamai surfaces broaden channel credibility and use-case access
    - 'Positive: can open enterprise accounts and adjacent workloads'
    - Medium
    - Request channel-sourced pipeline, win rates, discounting, and partner margin structure
  - - Financial-services concentration risk
    - Bank-penetration claims are unusually strong relative to public named-customer depth
    - Potentially negative if a small set of banks drives disproportionate ARR
    - Medium
    - Request top-20 customer ARR, top-bank ARR, and next-12-month renewal calendar
  - - Aggregate-count opacity
    - 500+ enterprise customers is large, but public materials do not show size-band, geography, or product mix
    - 'Negative: concentration cannot be ruled out even with a high customer count'
    - Medium
    - Request customer distribution by ARR band, geography, and product family
  - - Enterprise-scale execution risk
    - Gartner critical review flags challenges at very high image/container volume
    - Negative for expansion at the largest accounts if unresolved
    - Medium
    - Request reference calls and performance metrics for the largest production environments
  notes: Rows mix upside vectors and underwriting risks because Aqua's public expansion story is inseparable from its concentration and procurement opacity. Public evidence supports the motion, not the resulting revenue quality.
