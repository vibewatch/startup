- id: durability-signals
  title: Durability, Satisfaction, and Repeat-Use Proxies
  body: |-
    Aqua does not publicly disclose NRR, GRR, gross churn, logo churn, contract length, or renewal cohorts, so true durability cannot be observed directly from public materials. The best available proxies are therefore mixed: customer quotes, marketplace comments, and review-platform feedback. On the positive side, GitLab's public quote says customer-success access and architect time are included at no extra cost, which is a useful support-retention signal for an enterprise platform. G2 shows a 4.2/5 average across 57 reviews and cites a three-month average implementation period and eleven-month average ROI window, suggesting users do see time-to-value. TrustRadius includes reviewers who describe high ROI and easy policy configuration, while PeerSpot praises runtime protection, drift prevention, and documentation.

    The complaints are also real and should not be minimized. Gartner's visible reviews include a favorable 4.0 note that still flags higher price and fewer integrations, and a critical 3.0 review that says Aqua struggles with true enterprise-scale image and container volume. G2 users mention slow customer-support response times and API or feature gaps, while AWS marketplace review excerpts and TrustRadius comments point to documentation, API, Jira, and SIEM-integration shortcomings. Taken together, the public record supports 'valuable but sometimes operationally heavy' more than it supports 'effortless expansion with world-class retention metrics.'
