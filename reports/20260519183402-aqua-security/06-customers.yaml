  - - Financial services / banking
    - 'Buyer: security + risk leadership; User: cloud / container teams; Payer: regulated enterprise budget'
    - Container, cloud, and compliance-heavy workload security
    - 6 of top 10 North American banks; 6 of top 7 Canadian banks; named references include Alma and AIB
    - Likely high-ACV and sticky compliance use cases
    - Possible vertical concentration is not disclosed
  - - Public sector / federal
    - 'Buyer: agency security leadership; User: cloud-transformation teams; Payer: agency / contractor procurement'
    - Secure cloud transformation and compliance-led deployment
    - Koch Federal plus a named U.S. federal government-agency story on customer page
    - Credibility in regulated, long-cycle accounts
    - Named-agency count and contract scope remain thin
  - - Software / platform ecosystems
    - 'Buyer: security engineering; User: developers and platform teams; Payer: enterprise software budget'
    - Embedded container scanning and DevSecOps default security
    - GitLab customer proof plus Trivy default-scanner role in GitLab container scanning
    - High leverage because Aqua can reach downstream developers indirectly
    - Embedded ecosystem proof does not equal disclosed paid-platform ARR
  - - Industrial / energy / utilities
    - 'Buyer: enterprise architect / security lead; User: operations + cloud teams; Payer: enterprise procurement'
    - CSPM, regulatory controls, workload security
    - Elvia quote and Koch Federal customer quote
    - Shows Aqua is not limited to pure software buyers
    - Public outcome metrics are qualitative, not numeric
  - - Retail / travel / internet services
    - 'Buyer: security or DevOps lead; User: app / cloud teams; Payer: business-unit or central IT budget'
    - Secure AWS Fargate, build secure apps, improve operational efficiency
    - Travel-tech startup, online retailer, Kakaku.com references on customer page
    - Demonstrates cross-vertical use-case breadth
    - Many proofs are logo/quote level only
  - - Practitioner community (distinct from paid base)
    - 'Buyer: often none at discovery; User: developers / OSS maintainers / security engineers; Payer: later enterprise sponsor if conversion occurs'
    - Image, repo, IaC, SBOM, cloud, and Kubernetes scanning with Trivy
    - GitLab, Artifact Hub, Harbor defaults plus testimonials from MasterCard, Deutsche Bahn, Wise and others
    - Meaningful top-of-funnel and brand-trust engine
    - No public conversion rate from community usage into paid CNAPP contracts
  notes: Rows intentionally separate paid enterprise accounts from the broader Trivy practitioner community. Public evidence is qualitative and strategic, not a disclosed revenue-weighted segment breakdown.
