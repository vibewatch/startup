- id: adoption-trajectory
  title: Adoption Trajectory and Named Public Proof
  body: |-
    The adoption trajectory is real even if the absolute customer schedule is hidden. In 2021 Aqua said it had doubled paying customers during 2020 and already had half a dozen customers above $1 million ARR, which implies the company had achieved meaningful enterprise ACV well before the 2024 extension round. By early 2024, the official message shifted from growth anecdotes to scale markers: 500-plus enterprise customers, 40% Fortune 100 penetration, six of the top 10 banks in North America, six of the top seven banks in Canada, and 65% new-business growth during 2023. A 2025 leadership-transition release reused the Fortune 100 penetration claim, which suggests the company still wanted investors and customers to view that blue-chip footprint as current.

    Named proof is narrower than the aggregate count, but it is not empty. Aqua's customer page shows public references across finance, public sector, software, energy, retail, travel tech, and internet services. The strongest named rows in this evidence set are Alma, AIB, GitLab, Koch Federal, and Elvia, with TechCrunch independently adding PayPal, Netflix, and Samsung as claimed customers. The limitation is proof quality: most named deployments are company-controlled case blurbs or quotes rather than independently documented production rollouts with spend, duration, or quantified outcomes. That is enough to establish real adoption, not enough to underwrite renewal quality.
