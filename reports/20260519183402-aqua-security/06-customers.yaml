chapter:
  number: 6
  title: Customers
  summary: 'Aqua has credible enterprise customer traction: official 2024 disclosures say more than 500 enterprise companies worldwide use the platform, 40% of the Fortune 100 use Aqua, and the company has unusually deep bank penetration. Public named proof spans finance, public sector, software, energy, travel, retail, and internet services, while Trivy adds a much broader practitioner community that should not be conflated with paid enterprise accounts. The missing pieces are renewal, concentration, and conversion math: public reviews are directionally positive but mixed, and private-offer procurement plus sparse live case studies leave durability only partially verified.'
sections:
- id: segment-mix
  title: Paid Enterprise Base Versus Practitioner Community
  body: |-
    Aqua's public customer story is overwhelmingly enterprise-led rather than SMB-led. The strongest official disclosure remains the January 2024 funding release: more than 500 enterprise companies worldwide had adopted Aqua, 40% of the Fortune 100 used the platform, and Aqua had deep bank penetration in North America and Canada. Earlier 2021 disclosures already described doubled paying customers in 2020, half a dozen customers above $1 million ARR, and bank penetration among the world's largest financial institutions. That is not the language of a broad self-serve seat business; it is the language of large-account, regulated-enterprise selling.

    The buyer, user, and payer are also visibly different. Product pages and partner surfaces point to developers and DevOps teams as the first users of Trivy and CI/CD scanning, platform or security teams as the operational owners of CNAPP, and enterprise procurement or partner channels as the contract owners for the broader Aqua platform. That split matters because Aqua's public open-source and ecosystem reach is much wider than its named paid customer list. Trivy is embedded in GitLab container scanning and praised by practitioners from companies such as MasterCard, Deutsche Bahn, and Wise, but those references prove practitioner trust and workflow relevance rather than paid Aqua-platform ARR on their own.
