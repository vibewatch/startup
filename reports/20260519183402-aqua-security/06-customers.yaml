  rows:
  - - Global enterprise CNAPP accounts
    - 'Buyer: CISO / cloud-security lead; User: platform + security teams; Payer: enterprise procurement'
    - Code-to-cloud, runtime, posture, compliance, AI-workload security
    - 500+ enterprise customers worldwide; 40% of Fortune 100
    - Core paid base with blue-chip credibility
