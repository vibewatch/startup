  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, contract length, and actual cohort-retention tables by customer segment.
    whyItMatters: Without real renewal data, Aqua's durability is being inferred from reviews and support quotes instead of measured customer economics.
    diligencePath: Request board-ready retention cohorts, logo churn analysis, renewal term lengths, and customer-health dashboards under NDA.
    relatedQuestionRefs:
    - QU017
    - QU025
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer ARR schedule, top-20 share of ARR, top-bank share of ARR, and the next-12-month renewal calendar.
    whyItMatters: A 500-plus customer count does not eliminate the possibility that a smaller set of large regulated accounts drives disproportionate revenue or renewal risk.
    diligencePath: Request top-customer concentration schedules, ARR by vertical and size band, and named upcoming renewals.
    relatedQuestionRefs:
    - QU021
    - QU022
    - QU025
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: A current, accessible case-study library with named customers, contract scope, deployment dates, and measurable outcomes.
    whyItMatters: The public named-proof set is real but shallow; stronger case studies would let us test whether customer logos represent scaled production deployments and repeat value.
    diligencePath: Request a current customer-reference list and archived case studies, or obtain customer-reference calls for Alma, AIB, GitLab, Elvia, and one federal account.
    relatedQuestionRefs:
    - QU004
    - QU023
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: trivy-to-paid-conversion
    missingEvidence: Conversion rates from Trivy usage, community adoption, GitHub marketplace trials, and cloud-marketplace evaluations into paid Aqua-platform contracts.
    whyItMatters: Trivy may be a major strategic funnel, but without conversion math it is impossible to separate awareness value from monetized customer acquisition.
    diligencePath: Request product-qualified-lead, trial-to-paid, and Trivy-sourced pipeline metrics by quarter.
    relatedQuestionRefs:
    - QU007
    - QU024
    relatedTableRefs:
    - TU005
  - type: access-blocked
    severity: minor
    topic: public-proof-access
    missingEvidence: Restored or archived copies of Aqua's case-study, research-report, awards, and alternate historical article pages.
    whyItMatters: Link rot reduces independent replayability of Aqua's public customer proof and increases reliance on a smaller set of still-live marketing surfaces.
    diligencePath: Recover archived copies or ask Aqua for a current media-and-case-study index that resolves to live URLs.
    relatedQuestionRefs:
    - QU023
