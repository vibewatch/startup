- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public Value / Status
  - Evidence Quality
  - Underwriting Read
  - Financing Dependency Implication
  - Diligence Ask
  rows:
  - - Lifetime capital raised (canonical)
    - $325M as of Jan 2024
    - High
    - Usable historical fact
    - Shows meaningful capital base but says nothing about current liquidity
    - Reconcile full cap table and current unrestricted cash
  - - Post-Series E total in 2021
    - $265M after $135M Series E
    - High
    - Usable historical fact
    - Shows only $60M incremental primary capital publicly added since 2021
    - Confirm dilution, insider participation, and ownership by round
  - - Latest disclosed valuation marker
    - Above / over $1B in 2024, broadly flat versus 2021
    - Medium
    - Directionally usable
    - Suggests runway extension without visible public re-rating
    - Provide current 409A, internal marks, and board financing view
  - - Cash on hand / debt / runway
    - null
    - Low / unavailable
    - Not underwriteable from public data
    - Financing dependency cannot be quantified today
    - Provide latest balance sheet, debt schedule, and runway analysis
  - - Workforce restructuring
    - Layoffs across 2022, 2024, and 2025; cash-flow-independence goal cited
    - Medium
    - Usable signal, not a clean burn figure
    - Points to cost reset and efficiency pressure
    - Provide burn before/after restructuring and current hiring plan
  - - Planned use of funds
    - 2021 proceeds earmarked for product breadth and geographic expansion; 2024 framed around continued growth
    - Medium
    - Partial only
    - Implies capital still supports R&D and GTM rather than proven self-funding
    - Provide operating plan, budget by function, and next-round trigger
  notes: This table deliberately separates well-supported funding chronology from the still-missing liquidity facts that matter for underwriting. Null means unavailable publicly, not immaterial.
