- id: TI005
  title: Public financial gaps table
  columns:
  - Missing Private Metric
  - Impact
  - Best Public Proxy
  - Exact Diligence Path
  rows:
  - - Audited revenue / ARR by product line
    - Cannot underwrite scale, growth quality, or revenue mix
    - GetLatka revenue estimate only
    - Request audited P&L plus ARR bridge by module and geography
  - - Realized pricing and discount waterfall
    - Cannot test whether marketplace and channel motion compress ASPs
    - Private-offer listings and free-trial signals only
    - Request bookings export showing list, net, discount, and channel mix
  - - Gross margin by subscription vs. services
    - Cannot judge software quality or long-term EBITDA path
    - Bundled support signals plus public-comp benchmarks only
    - Request segment gross margin and cost-of-service allocation
  - - CAC, payback, NRR, and GRR
    - Cannot evaluate GTM efficiency or expansion durability
    - Million-dollar customer signal and customer count only
    - Request cohort tables, payback math, sales productivity, and retention waterfalls
  - - Cash balance, burn, runway, and debt
    - Cannot quantify financing dependency after the 2024 extension
    - Layoff cadence plus cash-flow-independence language only
    - Request latest balance sheet, cash flow statement, debt schedule, and runway case
  - - Customer concentration and segment mix
    - Cannot judge durability of the 500+ enterprise-customer base
    - Fortune 100 and bank-penetration claims only
    - Request top-20 customer schedule, renewal dates, and vertical mix of ARR
  notes: 'This table is intentionally gap-focused: the listed items are the minimum private diligence package required before Aqua can be underwritten on financial quality instead of narrative strength.'
