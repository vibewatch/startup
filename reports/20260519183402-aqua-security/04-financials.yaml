chapter:
  number: 4
  title: Financials
  summary: Aqua Security looks like a real late-stage enterprise CNAPP vendor, with official claims of more than 500 enterprise customers and $325 million total funding as of January 2024, but it remains highly opaque financially. Public evidence supports an enterprise subscription model with marketplace and partner distribution plus an open-source funnel, yet realized pricing, ARR, gross margin, CAC, burn, and runway are not disclosed. The flat unicorn valuation from 2021 to 2024, repeated 2024-2025 layoffs, and stated goal of cash-flow independence make the underwriting case credible on demand but unresolved on efficiency and financing dependency.
sections:
- id: revenue-model
  title: Revenue Model and Monetization
  body: |-
    Aqua monetizes a broad cloud-native application protection platform rather than a single point product. Official product pages describe one integrated CNAPP spanning code security, cloud security, runtime protection, vulnerability management, and AI-era workload protection. TechCrunch's 2021 reporting adds that Aqua had already shifted from a narrower container-security tool into a platform play, while the Trivy page shows Aqua still maintains a widely distributed open-source scanner that can function as a developer-entry funnel. The clearest revenue implication is that Aqua's core business is recurring enterprise software sold into larger organizations, not SMB self-serve or consumer motion.

    What the public record does not show is an actual rate card. Instead, Aqua appears to monetize through negotiated enterprise contracts and channel-assisted procurement. The Azure listing is explicitly a private-offer marketplace page, the GitHub marketplaces repository promotes 30-day trials and marketplace procurement, and the partner program spans MSPs, systems integrators, distributors, and federal channels. That combination supports a land-expand model with multiple procurement paths, but it also means realized ASPs, discounting, and attach rates remain hidden. Aqua's own customer materials suggest some architect time and customer-success support are bundled at no extra cost, which is good for adoption but muddies where services end and subscription economics begin.
