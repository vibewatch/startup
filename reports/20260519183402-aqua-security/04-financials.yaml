  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-and-runway
    missingEvidence: Current cash balance, debt obligations, monthly burn, and runway months after the January 2024 extension.
    whyItMatters: These are the core inputs required to judge financing dependency and whether layoffs actually solved the liquidity problem.
    diligencePath: Request the latest monthly or quarterly board package, balance sheet, cash flow statement, and runway model under NDA.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: blocking
    topic: pricing-and-margin
    missingEvidence: Realized pricing waterfall, discount policy, gross margin split between software and services, and net retention metrics.
    whyItMatters: Without these data, Aqua cannot be valued on revenue quality or compared cleanly to public cloud-security peers.
    diligencePath: Request bookings extracts, cohort retention tables, and segment gross-margin schedules by product and channel.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI002
    - TI003
    - TI005
  - type: conflicting-data
    severity: material
    topic: funding-total-conflict
    missingEvidence: A reconciled cap-table-backed explanation for why Calcalist reported roughly $235M raised while official and Tracxn sources point to $325M.
    whyItMatters: Conflicting public totals weaken confidence in downstream dilution and capital-adequacy analysis if left unresolved.
    diligencePath: Request the full financing chronology with signed round amounts, security type, and whether any figures exclude extensions or secondaries.
    relatedQuestionRefs:
    - QI008
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Customer concentration, segment mix, and renewal schedule for the 500-plus enterprise customer base.
    whyItMatters: High customer count alone does not reveal whether a few large accounts dominate ARR or whether renewals are healthy.
    diligencePath: Request top-customer schedule, ARR by vertical and size band, and next-12-month renewal calendar.
    relatedTableRefs:
    - TI005
