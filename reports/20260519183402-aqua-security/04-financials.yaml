- id: capital-adequacy
  title: Capital Adequacy and Financing Dependency
  body: |-
    The best-supported capital facts are the official ones: Aqua raised $135 million in March 2021, bringing total funding to $265 million, and added a further $60 million in January 2024 to reach $325 million total raised. TechCrunch and Globes corroborate that the 2024 money was an extension of the 2021 Series E rather than a visibly re-priced new round, and all three sources continue to describe the company as valued above or over $1 billion. That is helpful for chronology but less helpful for underwriting, because a flat unicorn mark across three years usually means the new capital extended runway without proving that the business had earned a materially higher valuation.

    The remaining capital-adequacy questions are exactly the ones a private company can choose not to answer publicly. Aqua's 2021 press release said proceeds would deepen the product portfolio and expand geographically, which fits a company still spending materially on R&D and enterprise GTM. But no public source in this evidence set discloses cash on hand, debt, monthly burn, or runway after the 2024 extension. The 2025 official leadership-transition release talks about growth and global expansion, not balance-sheet self-sufficiency. So the capital picture is nuanced: Aqua has undeniably raised meaningful capital and preserved unicorn status, yet the public record still does not show whether that capital now supports a self-funding business or merely prolonged time to the next financing decision.
