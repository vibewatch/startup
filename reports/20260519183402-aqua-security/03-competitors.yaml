  evidenceGaps:
  - type: missing-source
    severity: material
    topic: realized pricing and discounts
    missingEvidence: Current list-to-net pricing bands, discount discipline, and module attach data for Aqua, Wiz, Orca, Prisma Cloud, CrowdStrike, and Sysdig.
    whyItMatters: Without realized pricing and attach data, the pricing table can compare packaging posture but cannot model true competitive economics or margin pressure.
    diligencePath: Request recent redlines, price books, private-offer examples, or anonymized competitive quotes by segment and module.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: win-loss and displacement by rival
    missingEvidence: Segmented win-loss data showing when Aqua displaces Wiz, Orca, Prisma Cloud, CrowdStrike, or status quo alternatives and when it loses.
    whyItMatters: Moat durability depends on actual replacement behavior, not just product narratives or review fragments.
    diligencePath: Obtain salesforce extracts, renewal notes, and recent competitive battlecards tied to opportunity outcomes by buyer segment.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: Trivy to paid conversion
    missingEvidence: Evidence linking Trivy adoption to paid Aqua platform conversion, expansion, or protective renewal behavior.
    whyItMatters: Trivy is clearly a distribution asset, but its economic moat value depends on whether open-source usage reliably converts into durable commercial advantage.
    diligencePath: Ask for funnel metrics from downloads to qualified pipeline to paid platform attach, segmented by customer size and cloud maturity.
    relatedQuestionRefs:
    - QP020
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: minor
    topic: large-enterprise operating data
    missingEvidence: Independent recent references showing how Aqua handles the largest image and workload volumes relative to Wiz, Orca, and Prisma Cloud.
    whyItMatters: A Gartner critical review suggests scale friction, but one review is not enough to size whether it is a broad enterprise limitation or an outlier.
    diligencePath: Collect recent large-enterprise customer references, deployment architectures, or third-party benchmarks focused on workload scale and operational overhead.
    relatedQuestionRefs:
    - QP016
    - QP021
