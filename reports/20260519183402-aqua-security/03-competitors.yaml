- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Aqua moat or risk
  - Threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - Runtime and container depth
    - Wiz, CrowdStrike, Prisma Cloud, and Sysdig all broaden runtime claims
    - high
    - Runtime depth is Aqua’s clearest differentiator, so erosion here directly compresses win quality
    - Ask for current win rates in runtime-heavy Kubernetes accounts versus named rivals
  - - Trivy open-source motion
    - Open source may create awareness without reliable paid conversion
    - medium
    - Trivy can be a moat only if it feeds pipeline, attach, or defensive retention
    - Request conversion, attach, and renewal evidence from Trivy users into paid Aqua modules
  - - Agentless-first buying shift
    - Orca and Wiz lower deployment friction and may win teams that want fast coverage
    - high
    - If buyers value onboarding speed over deeper controls, Aqua’s technical depth becomes less monetizable
    - Measure time-to-value and admin overhead against agentless-first competitors
  - - Platform consolidation pressure
    - Palo Alto, CrowdStrike, and Fortinet can fold cloud security into larger platform deals
    - high
    - Procurement convenience and adjacent-product leverage can outweigh specialist superiority
    - Review losses by incumbent installed base and bundle context, not just by feature checklist
  - - Pricing opacity and enterprise complexity
    - Review evidence points to price, integration, and UI friction
    - high
    - Opaque packaging and higher operational friction make it easier for simpler alternatives to look good enough
    - Collect recent implementation times, discount bands, and services dependency by segment
  - - Status quo substitution
    - Teams can assemble native cloud controls, Trivy, and adjacent tools without standardizing on Aqua
    - medium
    - Aqua must prove why unified CNAPP depth beats piecemeal alternatives economically and operationally
    - Ask for quantified ROI evidence on tool consolidation, incident reduction, and compliance efficiency
  notes: Severity reflects the risk that the named force erodes Aqua’s ability to preserve pricing power or shortlist position over the next 12 to 24 months. It is not a statement about current churn.
