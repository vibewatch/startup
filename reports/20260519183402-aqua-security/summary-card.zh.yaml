summary:
  headline: >-
    Aqua Security 仍是可信的 CNAPP 先行者，拥有 Trivy 驱动的分发、运行时 / 容器深度和真实企业触达；但 2021 年独角兽轮以来估值持平、2025 年重组、私营公司披露缺口长期存在，在私下尽调证明
    ARR、留存、利润率和现金效率显著强于公开记录前，应维持观察建议和偏高估值判断。
