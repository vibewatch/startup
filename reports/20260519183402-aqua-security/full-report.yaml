      - number: '3.3'
        title: Pricing, packaging, GTM, and trust posture
        blocks:
          - type: paragraph
            body: >-
              The retained public evidence does not show a market full of transparent list prices. Aqua’s own public
              packaging signals point to negotiated enterprise selling, including a Microsoft Marketplace private-offer
              route rather than a clean public rate card, and G2 data points to a multi-month implementation path plus
              negotiated discounts. That is not unusual across CNAPP. Wiz, Orca, Prisma Cloud, CrowdStrike, and Sysdig
              also present as demo-led enterprise motions in the retained set, which means pricing pressure appears
              through packaging and consolidation rather than through obvious public price wars. The clearest relative
              transparency advantage in this cohort is not a named Aqua rival here, but the general fact that
              easier-to-adopt or broader-bundle alternatives can anchor buyer expectations downward.


              On GTM, Aqua has more channel evidence than many private peers: MSPs, SIs, resellers, distributors,
              federal partners, Cisco alliance material, Azure Marketplace, and marketplace references across other
              clouds. That helps counterbalance Aqua’s private-company disclosure profile, but it does not fully solve
              the trust comparison against public incumbents. Palo Alto Networks, CrowdStrike, and Fortinet benefit from
              wider procurement relationships, broader adjacent product estates, and public-company disclosure surfaces
              that make them easier to underwrite in large enterprise or regulated buying processes.
