              developers and DevOps teams as the first users of Trivy and CI/CD scanning, platform or security teams as
              the operational owners of CNAPP, and enterprise procurement or partner channels as the contract owners for
              the broader Aqua platform. That split matters because Aqua's public open-source and ecosystem reach is
              much wider than its named paid customer list. Trivy is embedded in GitLab container scanning and praised
              by practitioners from companies such as MasterCard, Deutsche Bahn, and Wise, but those references prove
