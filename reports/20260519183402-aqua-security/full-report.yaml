      - number: '7.2'
        title: Regulatory and Legal Risks
        blocks:
          - type: paragraph
            body: >-
              Aqua's legal and regulatory risk is less about a visible public enforcement action and more about contract
              structure, privacy obligations, and the evidentiary gap between public assurances and enterprise-grade
              commitments. Aqua's privacy policy states that for platform users operating under customer direction it
              acts as a data processor under a DPA and related commercial agreements. That is directionally the right
              posture, but it means diligence has to move past marketing pages into the actual DPA, residency,
              subprocessors, and breach-notification terms because cloud-security tools routinely ingest code, images,
              telemetry, and security findings from regulated environments. CISA's guidance that organizations must
              manage external dependencies and operational resilience makes those downstream controls material, not
              peripheral.

              The sharper concern is risk allocation. Aqua's website terms disclaim warranties around effectiveness,
              availability, completeness, and error-free operation, cap liability, and route disputes to Israeli law in
              Tel Aviv-Jaffa. Its support and professional-services terms help operationally—they mention commercially
              reasonable 99.9% availability, affiliate delivery, and Aqua's retained responsibility for
              subcontractors—but they also reserve change rights, keep pricing opaque, and offer limited warranty
              language. None of that is unusual for vendor-first contracts, but it means the public legal baseline is
              company-friendly. The investment implication is straightforward: if enterprise MSAs, DPAs, SLA credits, or
              subprocessor controls are weaker than procurement norm, a buyer should assume more legal and incident-cost
              exposure than the product story alone suggests.
            claimRefs:
