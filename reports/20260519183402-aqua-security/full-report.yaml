      - number: '4.2'
        title: GTM Efficiency and Unit-Economics Proxies
        blocks:
          - type: paragraph
            body: >-
              Aqua has enough public traction markers to say the company is not pre-scale. In 2021, Aqua said it doubled
              paying customers in 2020 and already had more than six customers with ARR above $1 million. By January
              2024, the company said more than 500 enterprise companies had adopted Aqua and that 40% of the Fortune 100
              used the platform, while new business grew 65% in 2023. Those are meaningful enterprise-sales indicators:
              they imply non-trivial ACV, long buying cycles, and a GTM engine capable of winning large regulated
              accounts.


              The problem is that the public market still lacks the core denominators. GetLatka estimates Aqua at $89.9
              million of 2024 revenue, up from $56.3 million in 2023, but explicitly labels its figures as
              company-reported or estimated data. Using that estimate with GetLatka's 638-employee 2024 snapshot implies
              roughly $141 thousand of revenue per employee, and pairing it with Aqua's 500-plus enterprise-customer
              claim implies less than about $180 thousand of revenue per customer before any services mix adjustments.
              Those are usable directional proxies, not underwriteable facts. They also likely understate true
              enterprise contract size if a meaningful share of customers are small land deals or free/open-source
              funnel conversions. Meanwhile, the absence of public CAC, payback, NRR, gross margin, and services mix
              means the unit-economics story is still more structural than numeric.
