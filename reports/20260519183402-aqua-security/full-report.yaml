      - number: '4.5'
        title: Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              Aqua's financial story is good enough to support continued diligence, but not clean enough to underwrite
              without management access. The company clearly has real enterprise relevance: official customer counts,
              Fortune 100 penetration claims, a multi-channel procurement footprint, and a recurring-platform
              architecture all point to a genuine software business rather than a narrative shell. The funding record is
              also better supported than the adverse press implies: official and independent sources converge around
              $325 million total raised as of January 2024.


              The blockers are equally clear. Public evidence still does not reveal realized pricing, product-line mix,
              gross margin, CAC, payback, NRR, cash balance, debt, or runway. External revenue estimates are useful for
              bracketing scenarios but remain low-confidence. Meanwhile, the flat 2021-2024 valuation, serial layoffs,
              and explicit cash-flow-independence messaging suggest Aqua is managing for efficiency, not obviously
              sprinting toward a premium-marked growth round. The right conclusion is therefore nuanced: Aqua likely has
              a viable enterprise revenue model and strategic value in CNAPP, but financing dependency and margin
              quality remain unresolved until private financials are opened.
