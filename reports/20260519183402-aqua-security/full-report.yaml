      - number: '8.2'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is strategic relevance. Aqua still presents a broad cloud-native security platform from
              code to cloud, with Trivy as a large open-source wedge and official customer claims of 500-plus
              enterprises plus 40% of the Fortune 100. The partner footprint across Aqua's own ecosystem program and
              marketplace channels such as AWS and Azure suggests the product is procured in mainstream enterprise
              buying paths, not only in bespoke projects. The 2025 Akamai partnership and Black Hat-era AI-security
              messaging show that Aqua is still trying to extend the platform into a new buying narrative rather than
              defend a static container point tool.


              The negative case is valuation confidence, not category relevance. Aqua's last disclosed mark did not
              visibly step up between the 2021 Series E and the 2024 extension, and Calcalist's 2025 reporting on
              repeated layoffs suggests management has been optimizing for durability and cash-flow independence. That
              does not invalidate the business, but it does weaken the argument for paying a premium multiple without
              seeing private metrics. The anti-thesis is simple: Aqua may be a good company whose public evidence set is
              still too thin to justify a strong-buy call at or above the stale unicorn anchor.
