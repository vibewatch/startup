  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Customer-visible layers of Aqua's code-to-cloud-to-prompt operating model, from developer scanning through runtime
      and AI controls.
    approximationNotes: >-
      This stack reflects public workflow and control layers, not a reverse-engineered microservice diagram. Aqua
      documents functional layers more clearly than shared data-plane internals.
    data:
      layers:
        - label: Developer and Supply-Chain Entry Layer
          detail: >-
            Trivy and pre-production scanning catch vulnerabilities, misconfigurations, secrets, SBOM, and license risk
            in code, repos, filesystems, images, and VMs.
          modules:
            - Trivy repo / fs / image / VM targets
            - SBOM generation
            - Secret scanning
            - License-risk scanning
        - label: Context and Posture Layer
          detail: >-
            Aqua correlates vulnerabilities, runtime behavior, and cloud context while posture controls cover cloud and
            Kubernetes configuration exposure.
          modules:
            - Contextual vulnerability management
            - CSPM
            - KSPM
            - Compliance views
        - label: Runtime Enforcement Layer
          detail: >-
            Production controls protect live workloads against known and unknown threats across cloud-native
            environments.
          modules:
            - Runtime protection
            - Threat detection
            - Drift and integrity controls
            - Policy enforcement
        - label: AI Prompt and Workload Layer
