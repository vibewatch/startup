  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product surface, and distribution footprint
        blocks:
          - type: paragraph
            body: >-
              Aqua Security was founded in 2015 and, in its current company boilerplate, identifies Boston,
              Massachusetts and Ramat Gan, Israel as its headquarters. The company positions itself as a cloud native
              application security provider covering the lifecycle from code to cloud to prompt. Current homepage and
              product materials group the platform around code security, runtime protection, and posture management,
              while the broader platform description emphasizes agentless and agent-based controls across software
              supply chain, cloud infrastructure, and live workloads.

              Aqua's strongest ecosystem asset is Trivy, the open-source scanner that Aqua itself highlights as a major
              adoption wedge. Reviewed Trivy materials and GitHub documentation show coverage for vulnerabilities,
              misconfigurations, secrets, SBOMs, repositories, container images, and Kubernetes clusters. Aqua also
              shows clear commercial distribution breadth through its own partner program, AWS Marketplace, Microsoft
              Azure Marketplace, the Red Hat partner catalog, and Cisco's technical alliance materials. Together these
              sources support a business model built around enterprise cloud security software sold directly and through
              channel, marketplace, and ecosystem partners rather than a narrow point product.
