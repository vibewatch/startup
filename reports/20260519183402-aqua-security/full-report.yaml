  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, valuation anchor, and caveats
        blocks:
          - type: paragraph
            body: >-
              Aqua should be treated as a track candidate, not a conviction buy, because the public record supports a
              real business but does not support precise pricing. Official company releases still anchor the hard facts:
              Aqua was founded in 2015, operates from Boston and Ramat Gan, raised $325M by January 2024, remained
              valued above $1B, and said more than 500 enterprise customers including 40% of the Fortune 100 used the
              platform. Those are meaningful proof points, and the November 2025 leadership-transition release keeps
              Mike Dube as the current CEO.


              The underwriting problem is that Aqua is private and public data is incomplete. The strongest public
              top-line proxy is GetLatka's estimated $89.9M of 2024 revenue, which would imply a little over 11x revenue
              at a $1B reference mark, but that estimate is low-confidence and not audited. TechCrunch also framed the
              January 2024 extension as essentially a flat continuation of the 2021 unicorn round, while Calcalist later
              reported layoffs and restructuring. With incomplete ARR, NRR, gross-margin, burn, and preference data, the
              right stance is disciplined interest rather than aggressive entry.
