  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor
      - Category
      - Scale / market signal
      - Target segment
      - Key differentiation
      - Primary limitation vs. Aqua
    rows:
      - - Wiz
        - Direct CNAPP leader
        - '>50% of Fortune 100 customers; $12B valuation; $1.9B financing'
        - Large cloud-native enterprises prioritizing unified risk context and consolidation
        - Unified security graph across code, cloud, and runtime; strong enterprise momentum
        - Less retained evidence than Aqua on deep runtime and container-enforcement specialization
      - - Palo Alto Networks / Prisma Cloud
        - Incumbent cloud-security platform
        - Public company with quarterly disclosure and broad procurement reach
        - Enterprises already standardized on Palo Alto or buying cloud security with broader SecOps
        - Broad code-to-cloud coverage, SOC convergence, and public-company trust posture
        - Can feel broader and heavier than a runtime-led specialist case
      - - Orca Security
        - Agentless-first CNAPP peer
        - Pioneer of agentless cloud security with patented SideScanning and 280+ reviews signal
        - Teams optimizing for fast onboarding, broad coverage, and low-friction visibility
        - Agentless deployment and contextual prioritization without agent-first overhead
        - Weaker retained support than Aqua on deep in-workload runtime control
      - - Sysdig
        - Runtime-centric cloud-defense peer
        - Runtime and Falco heritage with real-time defense narrative
        - Security teams wanting runtime depth with open-innovation credibility
        - Strong runtime insights, guided response, and Falco lineage
        - Less retained evidence of Aqua-like breadth in shift-left and channel distribution
      - - Snyk
        - Developer-led adjacent competitor
        - Well-known developer-security platform with AI coding-assistant positioning
        - Engineering-led organizations prioritizing code and supply-chain governance
        - Embedded developer workflow and AI-native shift-left motion
        - Much less retained support than Aqua for runtime and workload enforcement
      - - CrowdStrike Falcon Cloud Security
        - Large platform adjacent competitor
        - Large single-platform security estate and MITRE-validated runtime marketing
        - Security-led buyers extending Falcon from endpoint and threat operations into cloud
        - Combines agentless visibility, sensor telemetry, AI response, and threat intelligence
        - Not primarily differentiated on container and Kubernetes runtime depth
      - - Fortinet + Lacework
        - Consolidation context / emerging alternative
        - Acquisition closed in 2024; MarketScreener estimated roughly $150M price
        - Buyers preferring single-vendor network plus cloud security from Fortinet
        - Combines Fortinet Security Fabric with Lacework’s agent and agentless CNAPP assets
        - Still more consolidation signal than fully re-proven market leader in retained set
      - - Internal build + status quo bundle
        - Substitute / no-standardization path
        - Uses native cloud controls, open source, and adjacent security tools instead of one CNAPP
        - Smaller teams or platform owners solving point problems without a single standard
        - Lowest commitment path and often acceptable for partial coverage
        - Fragmented context and weaker unified runtime, posture, and policy operations than Aqua
