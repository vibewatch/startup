            body: >-
              Aqua's public delivery model is much broader than a direct-sales SaaS pitch. Azure Marketplace shows
              Azure-native support across ACR, ACI, Windows containers, and Azure DevOps. Aqua's own marketplaces
              repository adds AWS surfaces such as ECS, EKS, Fargate, and Lambda, plus a Red Hat Marketplace operator
              path and Google Cloud integration language. Cisco's alliance page adds Kenna vulnerability-prioritization
              context. Together these sources suggest that Aqua expects customers to adopt the platform through multiple
              combinations of direct deployment, marketplace procurement, operator-based installation, and external
              analytics or ticketing tools. That is strategically useful because CNAPP buyers rarely standardize on one
              cloud or one deployment motion.


              Serviceability signals are positive but mixed. A customer quote on Aqua's own site says architect access
              is included at no extra cost, and AWS feedback says deployment is easy and coverage is broad from code to
              runtime. At the same time, AWS feedback also calls for better API documentation, while Gartner reviewers
              mention fewer integrations and weaker telemetry visibility than some alternatives. That combination makes
              Aqua look operationally serious but not frictionless. The public record supports a real support motion and
              broad deployment reach, yet it does not provide the uptime, SLA, or large-scale-operability evidence that
              a buyer would want before assuming low-friction rollout across a very large estate.
