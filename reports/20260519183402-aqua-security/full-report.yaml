            body: >-
              The customer chapter should be read as a 'real but only partially underwritten' story. Aqua clearly has
              enterprise relevance: the company has a large official customer count, persistent Fortune 100 and banking
              claims, and enough named references to prove it is not selling only to anonymous pilots. The practitioner
              community around Trivy strengthens that story by showing Aqua has credibility at the user level, not just
              in executive slideware.


              But public evidence stops well short of proving customer durability in the way an investor would want.
              There is no disclosed cohort data, no public concentration schedule, no renewal calendar, and no credible
              public bridge from Trivy usage or marketplace trials into paid CNAPP expansion. Review platforms support
              the view that the product is valuable and broad, yet they also surface scale, integration, documentation,
              and support-speed complaints that matter for enterprise expansion. The right conclusion is therefore
