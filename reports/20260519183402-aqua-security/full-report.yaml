      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The strongest growth drivers are structural. Kubernetes and container penetration are already mainstream,
              multi-cloud raises policy and entitlement complexity, and broader security budgets are being pulled toward
              application security, software supply chain integrity, and AI-related risk. CISA’s resilience framing and
              TechTarget’s evidence on alert overload and limited staff both support the case for integrated,
              prioritization-heavy platforms. Competitor narratives point the same way: Wiz emphasizes a security graph,
              Orca emphasizes agentless context, Prisma Cloud emphasizes cloud-to-SOC convergence, Sysdig emphasizes
              runtime signal and consolidation, Snyk expands from developer security outward, and CrowdStrike uses
              bundle strength and adversary intelligence to press into the category. The main constraints are
              executional. Aqua’s own academy admits the CNAPP label is used broadly, which weakens clean category
              sizing. Public reviews cite pricing, integrations, reporting, and enterprise-scale friction. TechCrunch
              highlights a flat valuation through the 2024 extension round, and CTech reports layoffs and a
              restructuring framed around cash-flow independence. The net implication is that Aqua participates in a
              healthy market, but valuation upside depends less on quoting a giant umbrella TAM and more on proving
              efficient expansion inside the most demanding enterprise buyers.
