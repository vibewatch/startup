      - number: '7.3'
        title: Operational and Dependency Risks
        blocks:
          - type: paragraph
            body: >-
              Operationally, the product is credible but not clean. Independent reviews create a consistent pattern:
              Gartner says Aqua's image assessment is strong but price is high, integrations are fewer, and visibility
              or telemetry trails EDR-style tools; a critical Gartner review says the product struggles at very large
              enterprise volumes; TrustRadius and PeerSpot mention Jira and SIEM gaps, UI/UX issues, web-portal or
              reporting weaknesses, and log-forwarding or server-integration needs; G2 includes enterprise complaints
              about slow feature delivery and missing scan coverage. That does not mean Aqua is weak at the core
              workload-security problem—some reviewers praise policy configuration, runtime protection, drift
              prevention, and ROI—but it does mean the company still has execution work before it can consistently win
              platform consolidations on total workflow fit.

              Dependency risk compounds that product gap. Aqua's AI-security narrative is currently tied to a joint
              story with Akamai, while support and professional services can rely on affiliates and subcontractors under
              the published terms. At the same time, open-source Trivy broadens distribution but reduces control over
              how much value customers must buy back from the commercial platform. The result is a classic transmission
              problem: if integrations lag, partners do not convert, or OSS users do not upgrade, then price pressure
              turns into slower renewals and weaker financing leverage. Aqua's mitigation path—runtime depth, workload
              focus, and partner-accelerated AI entry—remains plausible, but public evidence still skews toward product
              positioning and launch messaging rather than hard renewal or AI attach metrics.
