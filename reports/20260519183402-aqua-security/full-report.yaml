        title: Funding history, investor base, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Aqua's publicly defensible financing history is anchored by three official milestones. The 2019 Series C
              added $62M and brought total funding above $100M. The March 2021 Series E added $135M at a valuation above
              $1B and raised disclosed lifetime funding to $265M. The January 2024 extension added another $60M, led by
              Evolution Equity Partners with participation from Insight Partners, Lightspeed Venture Partners, and
              StepStone Group, taking disclosed lifetime funding to $325M while keeping valuation above $1B.

              Across the reviewed official rounds, Aqua's disclosed investor set includes ION Crossover Partners,
              Evolution Equity Partners, Insight Partners, Lightspeed Venture Partners, StepStone Group, TLV Partners,
              Greenspring Associates, Acrew Capital, and M12. Aqua's about page also lists Shlomo Kramer among its
              investors. What is not public is just as important: no reviewed source disclosed a cap table, liquidation
              preferences, founder ownership, secondary share mix, or debt facilities. For chapter-one canonical facts,
              the official $325M total raised is stronger than later Calcalist reports that cite about $235M; those
              third-party numbers are preserved as conflicts, not adopted as ground truth.
