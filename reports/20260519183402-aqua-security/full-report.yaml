      - number: '1.2'
        title: Founders, leadership transition, and governance posture
        blocks:
          - type: paragraph
            body: >-
              Aqua's founding leadership remains central to the company story even after the official November 2025
              handoff. Co-founder Dror Davidoff, who had served as CEO, and co-founder Amir Jerbi, who had served as
              CTO, both stepped back from day-to-day executive roles and became strategic advisors. The company promoted
              Mike Dube from president and chief revenue officer to CEO and elevated Nir Makowski from senior vice
              president of engineering to chief product and technology officer. Aqua framed the transition not as a
              founder exit but as a planned move into its next phase of growth and global expansion.

              Dube's background is weighted toward go-to-market execution rather than founding product vision: Aqua says
              he previously held senior roles at CrowdStrike, Splunk, Cybereason, and Check Point. That makes him well
              suited to enterprise sales scaling, but it also increases key-person dependence on Makowski and the
              still-influential founders for technical continuity. Governance remains only partially visible in public
              materials. Reviewed official and third-party sources identify founders, investors, and executive changes,
              but they do not disclose a current board roster, founder ownership percentages, or formal succession
              terms. Those omissions are material diligence gaps, especially after the leadership reshuffle.
