  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape overview and competitive frame
        blocks:
          - type: paragraph
            body: >-
              Aqua sits inside a CNAPP market that no longer behaves like a simple point-solution category. The direct
              cloud-security peers are Wiz, Orca, Prisma Cloud, and Sysdig; the adjacent developer-led challenger is
              Snyk; the large platform competitor is CrowdStrike; and Fortinet plus Lacework matter as consolidation
              context even when they are not the first live alternative in a current shortlist. The status quo
              substitute is not “no security,” but rather a bundle of native cloud controls, open-source scanners, and
              adjacent platforms that solve enough of the job without standardizing on Aqua.


              That framing matters because Aqua is not trying to win only on broad CNAPP checkboxes. Its strongest
              retained evidence is around container, Kubernetes, and runtime depth, while Wiz and Orca are winning
              mindshare around graph context and agentless-first onboarding, and Palo Alto, CrowdStrike, and Fortinet
              increasingly sell cloud security as one module inside a wider security estate. Aqua therefore has to beat
              multiple jobs-to-be-done at once: best runtime operator, acceptable code-to-cloud breadth, credible
              developer workflow, and sufficiently broad platform economics to avoid being displaced by consolidation.
