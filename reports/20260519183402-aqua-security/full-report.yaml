      - number: '5.5'
        title: Differentiation, roadmap, and open technology risks
        blocks:
          - type: paragraph
            body: >-
              Aqua's clearest differentiation is that it combines an open-source developer wedge, a runtime-first
              cloud-workload-security story, and a newer prompt- and AI-workload-security extension. Many competitors
              can claim parts of that stack, but Aqua's public materials are unusually explicit about joining them.
              Trivy gives Aqua a credible developer and supply-chain surface, the platform pages emphasize contextual
              remediation and runtime controls, and the 2025 Akamai partnership extends that logic into prompt defense
              and AI-workload behavior. The resulting product thesis is compelling: the same buyer who wants fewer
              fragmented tools for cloud-native risk may also want one vendor that can move from repo and image hygiene
              into production workloads and emerging AI interactions.


              The open risks sit where the narrative gets newest or least specific. Public roadmap detail is thin beyond
              the AI-security launch materials and evergreen platform language. The AI module is supportable as a real
              product direction, but public customer proof, module packaging, and GA-level adoption detail are still
              thin. Public sources also do not cleanly separate where Aqua Platform ends and where individual commercial
              add-ons begin. That means the chapter's conclusion should stay disciplined: Aqua has a credible product
              breadth and a differentiated workflow story, but private diligence still has to prove architecture depth,
              service reliability, packaging logic, and how quickly the AI-security extension becomes repeatable revenue
