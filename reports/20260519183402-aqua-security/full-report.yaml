            body: >-
              Aqua's public customer story is overwhelmingly enterprise-led rather than SMB-led. The strongest official
              disclosure remains the January 2024 funding release: more than 500 enterprise companies worldwide had
              adopted Aqua, 40% of the Fortune 100 used the platform, and Aqua had deep bank penetration in North
              America and Canada. Earlier 2021 disclosures already described doubled paying customers in 2020, half a
              dozen customers above $1 million ARR, and bank penetration among the world's largest financial
              institutions. That is not the language of a broad self-serve seat business; it is the language of
              large-account, regulated-enterprise selling.


