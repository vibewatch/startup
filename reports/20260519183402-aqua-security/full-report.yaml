      - number: '2.3'
        title: Buyers, users, payers, and adoption motion
        blocks:
          - type: paragraph
            body: >-
              Buyers, users, and payers are cross-functional because CNAPP touches development, platform operations,
              compliance, and security operations at once. Aqua’s customers page shows traction across government,
              finance, energy, software, internet services, and retail, while its 2024 funding release says more than
              500 enterprises and 40% of the Fortune 100 have adopted its approach. Demand-side evidence reinforces why
              those organizations buy. CNCF reports 66% of end-user organizations already run Kubernetes in production,
              56% use multi-cloud combinations, and security is the leading container challenge for 40% of
              organizations. That means the typical day-to-day users are platform security, DevSecOps, engineering
              security, SRE, and compliance teams, while the payer is usually a central security or platform budget
              owner. Adoption often begins with scanning and visibility rather than a big-bang platform standardization:
              Trivy provides a developer and open-source wedge, marketplaces offer low-friction procurement, and partner
              channels help federal or large-enterprise deployments. From there, the motion expands into runtime
              enforcement and policy unification once buyers need a single context layer across code, cloud posture,
              entitlements, and live workloads.
