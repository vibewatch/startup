  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Down round or punitive extension
        - Primary financing below the 2024 >$1B mark or with clearly investor-favoring terms
        - Confirms that the public anchor overstated current equity value
        - Move from track toward avoid unless terms still protect new money
      - - Another major restructuring
        - Fresh broad layoff round or clear evidence that the 2025 reset did not stabilize operations
        - Suggests efficiency remains broken and growth quality is deteriorating
        - Treat as thesis break until management proves durable operating control
      - - Weak actual ARR versus proxy
        - Private trailing revenue materially below the public $89.9M proxy
        - Raises the implied entry multiple and destroys the base-case math
        - Do not invest at a unicorn mark
      - - Retention / margin failure
        - NRR below roughly 110% or gross margin below roughly 70%
        - Removes the justification for even mid-tier security-software multiples
        - Cut valuation range and re-underwrite as a distressed growth asset
      - - Competitive compression
        - Evidence that major suites neutralize Aqua's differentiation with bundled CNAPP and AI-security offers
        - Strategic scarcity value falls and exit optionality narrows
        - Lean toward strategic-sale-only view rather than growth-equity upside
    notes: Triggers focus on events that would materially change valuation support, not ordinary quarterly noise.
    claimRefs:
      - CV029
      - CV030
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Current ARR and revenue bridge
        - Audited ARR / revenue by product, geography, and channel for 2024-2026
        - Determines whether the >$1B public anchor is cheap, fair, or stretched
        - CFO data room and board-approved operating plan
      - - Net revenue retention and gross margin
        - NRR cohorts, gross margin by module, and services mix
        - Required to know whether Aqua deserves PANW-like, mid-tier, or distressed multiples
        - Finance and customer-success diligence session
      - - Burn, runway, and cash-flow path
        - Monthly burn, cash balance, debt, and timing to cash-flow breakeven
        - Clarifies whether the 2025 reset fixed financing dependency or only delayed it
        - Treasury / FP&A package
      - - Cap table and preferences
        - Fully diluted ownership, option pool, liquidation waterfall, and any 2024 extension side terms
        - Common-equity return math is impossible without preference overhang visibility
        - Legal review of financing docs and cap table export
      - - Customer concentration and renewal quality
        - Top-10 customers, logo churn, NRR, and product penetration inside the 500+ customer base
        - Validates that customer proof converts into durable revenue quality
        - Customer analytics export plus GTM diligence
      - - Board view on exit path
        - Board materials on next financing, strategic interest, and IPO readiness thresholds
        - Determines whether investors should model strategic sale optionality or a longer independent path
        - CEO / board-lead interview and latest board deck
    notes: >-
      These asks are the minimum set needed to convert this chapter from a public-mark triangulation into a true
      investment memo.
    claimRefs:
      - CV029
      - CV030
      - CV037
      - CV038
      - CV039
