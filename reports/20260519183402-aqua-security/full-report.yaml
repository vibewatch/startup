  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: >-
      How Aqua is presented to buyers: scan early with Trivy, correlate posture and runtime context, then enforce in
      production and extend to AI prompts.
    approximationNotes: >-
      The flow is a normalized customer workflow synthesized from official product pages, Trivy docs, and partner
      surfaces. Public sources confirm the steps, but not the internal orchestration logic between them.
    data:
      nodes:
        - id: dev
          label: Developer / DevSecOps
          detail: Scans repository, filesystem, image, or VM target with Trivy in CI/CD
          type: input
        - id: supply
          label: Supply-Chain Findings
          detail: Vulnerabilities, secrets, misconfigurations, SBOM, and license risk are surfaced before deployment
          type: process
        - id: deploy
          label: Deploy to Cloud / Kubernetes / Serverless
          detail: Application moves into container, Kubernetes, VM, serverless, or hybrid runtime
          type: process
        - id: context
          label: Aqua Risk Context
          detail: Platform correlates cloud posture, vulnerability findings, and runtime behavior
          type: process
        - id: runtime
          label: Runtime Enforcement
          detail: Known and unknown threats are monitored or blocked in live production
          type: process
        - id: ai
          label: AI Prompt / Workload Protection
          detail: If the app uses models, Aqua and Akamai inspect prompt traffic and workload behavior
          type: process
        - id: ops
          label: Security / Compliance Team
          detail: Teams prioritize remediation, collect compliance views, and govern exceptions
          type: output
      edges:
        - from: dev
          to: supply
          label: Pre-deployment scans
        - from: supply
          to: deploy
          label: Approved build moves forward
        - from: deploy
          to: context
          label: Runtime and cloud context added
        - from: context
          to: runtime
          label: Policies and priorities enforced
        - from: runtime
          to: ops
          label: Alerts, remediation, compliance context
        - from: deploy
          to: ai
          label: Apps calling models create prompt surface
        - from: ai
          to: ops
          label: Prompt and AI-workload telemetry
        - from: supply
          to: ops
          label: Developer-stage findings inform policy
    claimRefs:
      - CE002
      - CE014
      - CE017
      - CE024
      - CE041
      - CE043
      - CE045
