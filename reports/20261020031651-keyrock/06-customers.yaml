  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: >-
        NRR, GRR, logo and revenue churn, renewal rates, contract duration, cohort curves, and
        customer satisfaction by service line.
      whyItMatters: >-
        Without retention evidence, venue breadth and relationship access cannot establish durable
        recurring demand or expansion within existing accounts.
      diligencePath: >-
        Request anonymized monthly customer and revenue cohorts for 2024 through year-to-date 2026,
        reconciled to contracts, invoices, and trading-volume records.
      relatedQuestionRefs: [QU004]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: >-
        A verified roster of named production customers with start date, service, usage, outcome,
        current status, and permission to reference.
      whyItMatters: >-
        Partner announcements, ecosystem memberships, and acquired-network descriptions do not
        establish production deployment or customer value.
      diligencePath: >-
        Select at least five customers across market making, OTC, options, on-chain, and asset
        management for reference calls and reconcile each to current revenue.
      relatedQuestionRefs: [QU003, QU008]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: concentration
      missingEvidence: >-
        Top-1, top-5, and top-10 customer revenue and gross-profit shares, including acquired
        BlockFills relationships and channel-originated business.
      whyItMatters: >-
        Counterparty concentration could make reported operating breadth economically dependent on
        a small number of institutions, venues, issuers, or partners.
      diligencePath: >-
        Obtain a customer-level revenue and gross-profit bridge for 2024, 2025, and year-to-date
        2026 with churned accounts, related parties, and acquisition cohorts identified.
      relatedQuestionRefs: [QU006]
    - type: conflicting-data
      severity: minor
      topic: acquired-network
      missingEvidence: >-
        Court-approved transaction documents and a management reconciliation of BlockFills clients
        transferred, activated, retained, and monetized after closing.
      whyItMatters: >-
        Secondary reporting contains inconsistent transaction values and cannot support a precise
        acquired-customer denominator.
