schemaVersion: "report-v2"
artifact: customers
slug: keyrock
runDate: 2026-10-20
company:
  name: Keyrock
chapter:
  number: 6
  title: Customers
  summary: >-
    Keyrock's public customer evidence establishes a broad institutional and crypto-native
    addressable base and substantial venue coverage, but it does not establish active customer
    count, retention, concentration, or measured customer outcomes. The BlockFills asset
    acquisition may widen the institutional funnel, yet the available evidence does not show
    how many relationships migrated, remained active, or produced revenue.
sections:
  - id: customer-segments
    title: Customer segments and buying centers
    body: >-
      The clearest supported segment is institutional digital-asset market participants. Scalable
      describes Keyrock's market making, OTC, and options execution as serving institutional
      clients, while Preqin identifies institutions, foundations, and other market participants
      and says the client footprint is strongest in the European Union, United Kingdom, and
      Switzerland while extending globally. A separate database broadens the apparent target set
      to private investors, crypto exchanges, digital-asset projects, DeFi protocols, and financial
      institutions. These are publisher-reported categories rather than disclosed revenue cohorts.
      A company-authored recruiting post also distinguishes institutional and crypto-native
      audiences, which is useful for mapping go-to-market positioning but does not prove either
      audience is paying, active, or retained. Buyer, user, payer, contract structure, and revenue
      contribution remain undisclosed for every segment.
    claimRefs: [CU004, CU005, CU006, CU007, CU012]
    tableRefs: [TU001]
  - id: adoption-and-proof
    title: Adoption signals versus customer proof
    body: >-
      Public scale indicators describe operating reach rather than customer adoption. Keyrock says
      it is active across 85 centralized and decentralized venues and has a 220-person team
      operating across 37 countries; Scalable separately reports coverage of more than 1,400
      markets. None of those denominators measures active customers, funded accounts, recurring
      contracts, transaction retention, or customer revenue. CoinDesk reported that the proposed
      BlockFills acquisition would provide access to an institutional network spanning hedge funds,
      asset managers, market makers, and mining companies. A lower-reputation secondary account
      put the predecessor network at approximately 2,000 institutional clients, but its transaction
      figures are internally inconsistent. That quantity is therefore a low-confidence predecessor
      metric, not a Keyrock customer count, and no retained source confirms post-acquisition
      migration, activation, or monetization.
    claimRefs: [CU001, CU002, CU003, CU008, CU009, CU010]
    tableRefs: [TU002]
  - id: durability-expansion-and-concentration
    title: Durability, expansion, and concentration risk
    body: >-
      Expansion intent is visible, but durability is not. In March 2026 the chief executive said
      Keyrock planned to grow its services, client base, and geographic reach, and a current
      recruiting post seeks commercial impact across institutional and crypto-native audiences.
      Company-controlled LinkedIn content also identifies participation in the Open Standard
      network around OUSD, while ConnectSafely reports a Deutsche Bank partnership. These named
      relationships are ecosystem or partner signals, not verified production customers with
      attributable outcomes. Across the assigned evidence, no NRR, GRR, churn, renewal, contract
      length, cohort, top-customer share, or revenue-by-segment metric is disclosed. The resulting
      underwriting risk is material: acquisition-led access and partnership reach may enlarge the
      funnel, but without account migration, retention, and concentration data, neither
      land-and-expand durability nor dependency on a small number of counterparties can be tested.
    claimRefs: [CU010, CU011, CU012, CU013, CU014, CU015, CU016]
    tableRefs: [TU003]
    figureRefs: [FU001]
tables:
  - id: TU001
    title: Customer segmentation and evidence boundary
    columns:
      - Segment
      - Buyer / user / payer
      - Supported use case
      - Public scale signal
      - Strategic value
      - Unresolved gap
    rows:
      - - Institutional trading firms
        - Hedge funds, asset managers, market makers, and other institutions; payer not disclosed
        - OTC execution, options, and liquidity access
        - Segment named by independent profiles and the BlockFills network report
        - Core counterparty base for capital-markets services
        - Active accounts, revenue, renewal, and outcomes are not disclosed
      - - Token issuers and foundations
        - Issuer or foundation treasury and market teams; contract owner not disclosed
        - Market making and digital-asset liquidity
        - Segment identified in independent company profiles
        - Potential recurring liquidity mandates
        - Production deployments, mandate duration, and economics are not disclosed
      - - Exchanges, protocols, and crypto-native projects
        - Venue, protocol, or project teams; user and payer may differ
        - Venue liquidity, DeFi ecosystem support, and trading access
        - Database profile lists exchanges, DeFi protocols, and blockchain initiatives
        - Distribution surface across centralized and on-chain markets
        - Named paying customers and volume attributable to clients are not disclosed
      - - Private investors and wealth clients
        - Private investors and allocators; payer not disclosed
        - Asset and wealth management
        - Database profile lists private investors and asset-management firms
        - Cross-sell beyond transactional liquidity services
        - Assets, client count, fees, and retention are not disclosed
    notes: >-
      Segment labels synthesize the retained profiles; no source supplies segment revenue,
      customer counts, contract economics, or a complete buyer-user-payer map.
    claimRefs: [CU004, CU005, CU006, CU007]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns:
      - Metric
      - Value
      - Period
      - Source / confidence
      - Implication
      - Missing denominator or qualification
    rows:
      - - Trading venues
        - "85 centralized and decentralized venues"
        - "2026-03-31"
        - Keyrock / medium
        - Broad operating distribution
        - Does not disclose active clients, utilization, or client revenue
      - - Markets covered
        - "More than 1,400"
        - "2026, exact date not stated"
        - Scalable / medium
        - Broad asset-market coverage
        - Market definition, client attribution, and usage are not disclosed
      - - Organizational footprint
        - "220 people across 37 countries"
        - "2026-03-31"
        - Keyrock / medium
        - Capacity to support a distributed client base
        - Headcount and country reach are not customer-adoption metrics
      - - Acquired institutional network
        - Hedge funds, asset managers, market makers, and mining companies
        - 2026-06-01 acquisition announcement
        - CoinDesk / medium
        - Potential institutional funnel expansion
        - Court approval was pending and migrated accounts were not disclosed
      - - BlockFills predecessor clients
        - "Approximately 2,000 institutional clients"
        - "2026, before reported acquisition integration"
        - Aiying License & Compliance / low
        - Possible upper-bound context for acquired relationships
        - Secondary account contains inconsistent transaction values; no Keyrock retention proof
    notes: >-
      Values retain each source's period and denominator; venue, market, headcount, and acquired
      predecessor metrics are not converted into a Keyrock active-customer count.
    claimRefs: [CU001, CU002, CU003, CU008, CU009, CU010]
  - id: TU003
    title: Named customer proof table
    columns:
      - Named relationship
      - Segment
      - Public evidence
      - Production versus pilot
      - Outcome
      - Limitation
    rows:
      - - BlockFills institutional network
        - Hedge funds, asset managers, market makers, and mining companies
        - CoinDesk reported prospective access through an acquisition; Aiying later reported integration
        - Not disclosed at individual-account level
        - Potential network expansion only
        - No migrated-account, retained-client, or revenue evidence
      - - Open Standard / OUSD
        - Payments and digital-asset ecosystem participants
        - Keyrock's LinkedIn page said it was part of the network as OUSD launched
        - Live ecosystem participation claimed; commercial status not disclosed
        - No measured customer outcome disclosed
        - Partner-network evidence, not proof that Open Standard is a paying customer
      - - Deutsche Bank
        - Traditional financial institution
        - ConnectSafely reports a strategic partnership
        - Not disclosed
        - No measured customer outcome disclosed
        - Secondary database statement; no contract, revenue, or retention evidence
    notes: >-
      Sample covers the named relationships found in the assigned evidence and deliberately does
      not relabel partners, ecosystem memberships, or an acquired network as verified customers.
    enumerationScope:
      coverage: sample
      basis: >-
        Named relationships visible in the eight assigned, successfully prefetched sources as of
        the 2026-10-20 run date; no public customer roster was available.
    claimRefs: [CU008, CU009, CU010, CU015, CU016]
figures:
  - id: FU001
    title: Institutional customer journey and evidence gaps
    type: journey-map
    summary: >-
      Public evidence supports an institutional-to-crypto-native commercial path, but proof weakens
      sharply after relationship access and before activation, retention, or expansion.
    data:
      items:
        - label: Audience formation
          detail: Position services to institutional and crypto-native audiences.
          touchpoints:
            - Brand and market education
            - Institutional and crypto-native messaging
        - label: Qualification
          detail: Identify institutions, issuers, foundations, venues, protocols, and investors.
          touchpoints:
            - Commercial team
            - Partner and ecosystem network
        - label: Mandate design
          detail: Match a counterparty to market making, OTC, options, or asset-management services.
          touchpoints:
            - Tailored service scope
            - Undisclosed procurement and contracting
        - label: Deployment
          detail: Connect the mandate to centralized or on-chain trading venues.
          touchpoints:
            - Venue and market coverage
            - No disclosed activation denominator
        - label: Relationship expansion
          detail: Add services, geographies, or acquired-network access.
          touchpoints:
            - BlockFills institutional network
            - Client-base and geographic growth intent
        - label: Retention proof
          detail: Public evidence stops before renewals, cohorts, concentration, or recurring economics.
          touchpoints:
            - NRR and GRR unavailable
            - Top-customer exposure unavailable
    approximationNotes: >-
      The sequence is an analytical customer-workflow model, not a disclosed Keyrock sales process;
      it contains no inferred conversion rates or stage volumes.
    claimRefs: [CU008, CU011, CU012, CU013, CU014]
callouts:
  - calloutType: risk
    title: Customer scale remains unverified
    body: >-
      Venue breadth, market coverage, followers, partners, and acquired relationships should not be
      treated as active customers. Underwriting requires account-level activation, retention,
      concentration, and revenue evidence.
    claimRefs: [CU010, CU013, CU014]
