artifact: "financials"
slug: "keyrock"
runDate: "2026-10-20"
company:
  name: "Keyrock"
chapter:
  number: 4
  title: "Financials"
  summary: "Keyrock has a broad capital-markets revenue surface and public evidence of operating scale, but the disclosed record does not establish group revenue, realized pricing, gross margin, cash burn, or runway. Parent-entity figures and the acquisition of assets from bankrupt BlockFills sharpen the need for consolidated financials, capital-at-risk data, and transaction-liability detail before the $1.1 billion valuation can be underwritten."
sections:
  - id: "revenue-architecture"
    title: "Revenue architecture is broad, but realized monetization is opaque"
    body: |
      Keyrock presents a diversified capital-markets model spanning market making, OTC execution, options, and asset management rather than a single recurring software product. Its official market-making material describes continuous algorithmic pricing, liquidity aggregation across more than 85 exchanges, and performance reporting; third-party descriptions add spread capture, trading-volume fees, and assets-under-management fees as plausible monetization mechanisms. Those mechanisms are directionally credible but do not establish contract terms, realized take rates, principal-versus-agent accounting, or revenue recognition. The reviewed official product page publishes no numeric customer price, so list pricing cannot be used as a proxy for revenue or margin. The bridge therefore stops at gross revenue: public evidence does not quantify rebates, hedging costs, inventory losses, venue fees, financing expense, or compensation needed to derive gross profit.
    claimRefs: ["CI001", "CI003", "CI004", "CI005", "CI006", "CI007"]
    tableRefs: ["TI001", "TI002"]
    figureRefs: ["FI001"]
  - id: "traction-and-cost-base"
    title: "Scale indicators are visible; consolidated economics are not"
    body: |
      Keyrock and an independent profile both point to meaningful operating breadth: 85 venues, a 220-person team, and operations across 37 countries. Hiring evidence also shows an expensive, specialized cost base. A New York marketing leadership role advertised a $175,000-$220,000 base range plus variable compensation, while an options-engineering lead was expected to manage roughly seven engineers supporting automated quoting, execution, pricing, risk controls, and production reliability. These are cost and complexity proxies, not CAC, payback, productivity, or total payroll estimates. A low-tier company-data profile reports EUR31.2 million of 2024 turnover and an EUR11.4 million net loss for Belgian parent KEYROCK SA, but those entity-level accounting figures cannot be treated as current group revenue, ARR, cash burn, or consolidated profitability.
    claimRefs: ["CI002", "CI008", "CI009", "CI013", "CI014"]
    tableRefs: ["TI003"]
  - id: "capital-adequacy"
    title: "Fresh capital and acquisition appetite increase the balance-sheet diligence burden"
    body: |
      The March 2026 Series C valued Keyrock at $1.1 billion and was described by the company as significant, but the announcement did not disclose proceeds and said the round was a rolling close. Management identified balance-sheet strengthening, service innovation, and acquisitions as uses of funds; funding raised therefore cannot be equated with cash available. Capital adequacy is further complicated by the BlockFills transaction. CoinDesk reported a $3.25 million proposed purchase of assets from a bankrupt counterparty that had disclosed $100 million-$500 million of liabilities against $50 million-$100 million of assets. The purchase price is not a measure of assumed obligations, integration cost, regulatory capital, or contingent exposure. Underwriting requires the executed purchase agreement, liability schedule, post-close liquidity buffer, and stress losses by desk.
    claimRefs: ["CI010", "CI011", "CI012", "CI015", "CI016"]
  - id: "financial-verdict"
    title: "Financial verdict: attractive breadth, insufficient underwriting evidence"
    body: |
      The public record supports service breadth, institutional infrastructure, acquisition-led expansion, and a sizable technical organization. It does not support a reliable assessment of revenue quality, customer concentration, trading-capital intensity, gross margin, or runway. Revenue may combine agency fees, bid-ask spread, principal trading, and asset-management economics with materially different volatility and capital requirements; reporting them as one undifferentiated total would obscure risk. The parent-company turnover and loss figures are useful boundary markers but are dated, secondary, and not consolidated. The investment case should remain gated on audited 2025 and year-to-date 2026 group financials, desk-level revenue and gross profit, cash and encumbered capital, counterparty exposures, and a reconciliation of acquisition obligations. Until those arrive, valuation should not be justified with ARR or SaaS-style multiples.
    claimRefs: ["CI001", "CI005", "CI007", "CI011", "CI013", "CI014", "CI015", "CI016"]
