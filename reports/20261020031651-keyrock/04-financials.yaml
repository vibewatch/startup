    title: "Do not equate the Series C with runway"
    body: "The company disclosed a $1.1 billion valuation and intended uses but not round proceeds, current cash, burn, encumbered trading capital, debt, or regulatory-capital requirements."
    claimRefs: ["CI010", "CI011", "CI012"]
  - calloutType: "recommendation"
