      - ["OTC trading", "Bespoke execution for institutional counterparties", "Offered publicly; quote economics unavailable", "Service existence corroborated; pricing and volumes undisclosed", "Notional volume, net spread, counterparty concentration, and settlement losses"]
      - ["Options", "Automated quoting, execution, and risk-managed derivatives service", "Dedicated engineering team; revenue unavailable", "Company-issued hiring evidence supports operating complexity", "Premium/fee revenue, hedge cost, Greeks limits, and stress P&L"]
      - ["Asset management", "Management and potential performance fees on managed strategies", "Service launched; AUM and fee schedule unavailable", "Service existence corroborated; fee basis only described by a low-confidence third party", "AUM, net flows, fee rates, performance allocation, and redemption terms"]
    notes: "Mechanisms distinguish supported service descriptions from inferred monetization; no row provides realized pricing, audited revenue mix, or gross margin."
    claimRefs: ["CI001", "CI003", "CI005", "CI006", "CI009"]
  - id: "TI002"
    title: "Pricing and monetization disclosure"
    columns: ["Offering", "Public pricing basis", "Numeric price", "What remains unknown"]
    rows:
      - ["Market making", "Customized mandate with continuous quoting and reporting", "Not disclosed", "Retainer, spread share, volume tiers, venue rebates, minimum commitment, and inventory-risk allocation"]
      - ["OTC", "Transaction-specific institutional execution", "Not disclosed", "Quoted spread, minimum ticket, settlement fee, credit terms, and loss allocation"]
      - ["Options", "Bespoke strikes, maturities, and systematic execution", "Not disclosed", "Premium markup, structuring fee, hedge charge, collateral, and capital usage"]
      - ["Asset management", "Assets-under-management fee described by a third-party job profile", "Not disclosed", "Management fee, performance fee, hurdle, liquidity terms, and strategy-level net returns"]
    notes: "The reviewed official market-making page contains no numeric customer price; third-party monetization descriptions are directional and are not evidence of realized contracts."
    claimRefs: ["CI003", "CI006", "CI007"]
  - id: "TI003"
    title: "Unit economics, cost, and capital-adequacy ledger"
    columns: ["Metric", "Public value or status", "Confidence", "Why it matters", "Required diligence evidence"]
    rows:
      - ["KEYROCK SA 2024 turnover", "EUR31,193,599", "Low; secondary profile citing Belgian annual accounts", "Entity-level scale marker, not consolidated group revenue", "Filed accounts and consolidation perimeter reconciliation"]
      - ["KEYROCK SA 2024 net result", "EUR-11,403,312", "Low; secondary profile citing Belgian annual accounts", "Accounting loss signals possible weak profitability but is not cash burn", "Audited P&L, cash-flow statement, and one-off reconciliation"]
      - ["Gross margin", "Not publicly disclosed", "Unavailable", "Separates spread/fee economics from venue, hedge, financing, and delivery costs", "Desk-level revenue, direct costs, and principal-trading treatment"]
      - ["Cash, burn, and runway", "Series C described as significant; proceeds and current cash unavailable", "Medium on funding status; unavailable on liquidity", "Funding raised is not cash available and cannot establish runway", "Bank statements, monthly burn, encumbered capital, debt, and minimum regulatory capital"]
      - ["BlockFills transaction", "$3.25 million proposed asset purchase; target liabilities reported at $100 million-$500 million versus $50 million-$100 million of assets", "Medium; independent reporting before court approval", "Purchase price alone does not reveal assumed liabilities, integration cost, or capital impact", "Executed agreement, assumed-liability schedule, closing statement, and post-close stress test"]
    notes: "Values preserve the cited entity, period, currency, and uncertainty; accounting loss is not treated as cash burn, and funding is not treated as cash on hand."
    claimRefs: ["CI010", "CI011", "CI012", "CI013", "CI014", "CI015", "CI016"]
