evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board roster, committee structure, founder voting control, succession plan, shareholder register, and
      investor consent rights.
    whyItMatters: >-
      Founder concentration and investor protections determine control, continuity, and downside rights at a late-stage
      private company.
    diligencePath: >-
      Request the current cap table, articles, shareholder agreement, board and committee charters, recent board
      minutes, and documented succession plan.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: funding-gap
    missingEvidence: >-
      Series C proceeds, primary-versus-secondary allocation, security type, pre-money value, preferences, and
      cumulative fully diluted ownership.
    whyItMatters: The valuation alone does not establish cash added to the balance sheet, dilution, or downside protections.
    diligencePath: Obtain the signed Series C term sheet, closing statement, capitalization table, and funds-flow schedule.
    relatedQuestionRefs:
      - QO004
      - QO007
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-data-gap
    missingEvidence: >-
      Audited consolidated revenue, revenue by service line, gross margin, customer count, concentration, retention, and
      current cash or regulatory-capital position.
    whyItMatters: >-
      These metrics are required to test whether operating traction and balance-sheet capacity support the $1.1 billion
      valuation.
    diligencePath: >-
      Request audited 2025 accounts, year-to-date 2026 management accounts, service-line bridge, customer cohort
      schedule, and regulatory-capital reports.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Comparable annual institutional digital-asset liquidity spend, take rates, addressable volumes, and Keyrock
      revenue by service line and geography.
    whyItMatters: >-
      Without common units and monetization denominators, operational reach cannot be converted into TAM, SAM, SOM,
      market share, or a valuation multiple.
    diligencePath: >-
      Obtain management's market model, audited service-line revenue, venue-level volumes, realized take rates, and
      independent industry transaction-volume data with matched scope.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Customer contracts, fee schedules, approval cycles, budget ownership, retention, concentration, and switching
      behavior by buyer segment.
    whyItMatters: >-
      Public buyer categories do not establish willingness to pay, sales-cycle duration, revenue durability, or
      realistic serviceable demand.
    diligencePath: >-
      Review anonymized contracts and cohort data, then interview customers across venues, allocators, foundations, and
      trading firms.
    relatedQuestionRefs:
      - QM003
      - QM006
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: conflicting-transaction-value
    missingEvidence: >-
      The executed BlockFills asset-purchase agreement and bankruptcy-court sale order showing consideration, assumed
      liabilities, installments, and regulatory conditions.
    whyItMatters: >-
      The $3.25 million and $325 million reports differ by two orders of magnitude and change the interpretation of
      acquisition discipline and consolidation economics.
    diligencePath: >-
      Retrieve the primary Chapter 11 docket and signed purchase agreement, then reconcile cash consideration,
      liabilities, contingent payments, and acquired entities.
    relatedQuestionRefs:
      - QM005
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Realized spreads, fee schedules, rebates, minimum commitments, collateral terms, discounts, contract duration, and
      peer bids on comparable mandates.
    whyItMatters: >-
      Without normalized commercial terms, service breadth and venue count cannot establish pricing power or customer
      value.
    diligencePath: >-
      Run a standardized request for proposal with Keyrock, Wintermute, Flowdesk, B2C2, and at least one incumbent or
      internal-build cost case.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Revenue, volume, margin, retention, and counterparty exposure by the ten largest customers, venues, protocols, and
      issuers.
    whyItMatters: >-
      Distribution breadth can coexist with concentrated economics or counterparty risk, which would weaken
      switching-cost and moat conclusions.
    diligencePath: >-
      Request a cohort and concentration schedule reconciled to audited revenue, trading volume, limits, and
      counterparty-risk reporting.
    relatedQuestionRefs:
      - QP010
  - type: enumeration-incomplete
    severity: minor
    topic: peer-comparison
    missingEvidence: >-
      Current primary-source product, pricing, licensing, venue-coverage, and execution disclosures for each named
      direct peer.
    whyItMatters: >-
      The assigned evidence identifies peers but does not support a complete like-for-like capability or regulatory
      matrix.
    diligencePath: >-
      Collect current official product, regulatory-register, and procurement evidence for Wintermute, Flowdesk, B2C2,
      and Portofino.
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: pricing-disclosure
    missingEvidence: >-
      Executed customer contracts and billing data showing retainers, spread share, volume tiers, rebates,
      asset-management fees, and realized discounts.
    whyItMatters: >-
      Without realized pricing, service breadth cannot be converted into defensible revenue quality or gross-margin
      estimates.
    diligencePath: >-
      Sample contracts by service line and reconcile their pricing terms to invoice-level revenue for 2025 and
      year-to-date 2026.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: >-
      Pipeline conversion, sales cycle, CAC, retention, expansion, and contribution margin by customer cohort and
      service line.
    whyItMatters: A senior GTM hire indicates investment but does not establish efficient acquisition or durable customer economics.
    diligencePath: >-
      Obtain the CRM funnel, cohort revenue, sales compensation, and fully loaded acquisition cost for the last eight
      quarters.
    relatedQuestionRefs:
      - QI003
  - type: missing-source
    severity: material
    topic: group-financials
    missingEvidence: >-
      Audited 2025 and year-to-date 2026 consolidated revenue, gross profit, operating expenses, cash flow, and
      entity-perimeter reconciliation.
    whyItMatters: >-
      Secondary parent-company figures cannot establish current group economics or the profitability of individual
      desks.
    diligencePath: >-
      Request audited consolidated statements, monthly management accounts, and a bridge from KEYROCK SA to the full
      group.
    relatedQuestionRefs:
      - QI005
      - QI008
      - QI010
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, encumbered trading capital, monthly burn, debt, regulatory-capital minima, and downside
      liquidity stress results.
    whyItMatters: An undisclosed rolling close and stated balance-sheet use do not establish cash available or runway.
    diligencePath: >-
      Review bank and custodian statements, treasury forecasts, debt agreements, regulatory returns, and desk-level
      stress tests.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: blockfills-acquisition
    missingEvidence: >-
      Executed purchase agreement, assumed-liability schedule, regulatory approvals, integration budget, and post-close
      capital allocation.
    whyItMatters: The target's bankruptcy liabilities create uncertainty that the reported purchase price alone cannot resolve.
    diligencePath: Inspect the court-approved transaction documents and management's acquisition accounting and integration plan.
    relatedQuestionRefs:
      - QI007
      - QI010
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: control-diligence
    missingEvidence: >-
      Current SOC or equivalent control reports, penetration-test summaries, custody and key-management design, incident
      history, uptime records, recovery tests, and service-level terms.
    whyItMatters: >-
      These controls determine whether the multi-venue execution stack can protect assets, maintain availability, and
      recover safely under stressed market conditions.
    diligencePath: >-
      Request control reports and exceptions, architecture and custody diagrams, the 24-month incident register, uptime
      exports, and observed disaster-recovery results.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: execution
    missingEvidence: >-
      Independent, denominator-complete measurements of spread, depth, slippage, fill rate, latency, and uptime by venue
      and service line.
    whyItMatters: >-
      Product differentiation rests on execution quality, but public claims cannot show whether Keyrock outperforms
      alternatives or remains resilient during volatility.
    diligencePath: >-
      Obtain venue-level before-and-after cohorts, timestamped execution-quality reports, client references, and
      third-party monitoring exports for normal and stressed periods.
    relatedQuestionRefs:
      - QE003
      - QE004
      - QE005
  - type: private-evidence-only
    severity: material
    topic: blockfills
    missingEvidence: >-
      A product-by-product integration plan covering acquired technology, data migration, customer cutover, control
      ownership, regulatory approvals, and decommissioning.
    whyItMatters: >-
      Acquired technology and teams may broaden the platform while increasing operational, security, and continuity risk
      during integration.
    diligencePath: >-
      Review the signed integration plan, system inventory, migration test evidence, approval dependencies, customer
      communications, and accountable control owners.
    relatedQuestionRefs:
      - QE006
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      NRR, GRR, logo and revenue churn, renewal rates, contract duration, cohort curves, and customer satisfaction by
