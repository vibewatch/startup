      expansion within existing accounts.
    diligencePath: >-
      Request anonymized monthly customer and revenue cohorts for 2024 through year-to-date 2026, reconciled to
      contracts, invoices, and trading-volume records.
    relatedQuestionRefs:
      - QU004
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
