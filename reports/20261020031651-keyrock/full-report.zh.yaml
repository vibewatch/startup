chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与经营版图
        blocks:
          - type: paragraph
            body: >-
              Keyrock 于 2017 年在布鲁塞尔成立并注册，如今定位为覆盖做市、OTC 执行、期权、资产管理和链上流动性的数字资产投资集团。
              其商业模式主要面向机构：自有算法在中心化和去中心化场所报价并管理流动性，配套团队提供定制化执行和投资产品。公开来源确认比利时母公司为 Keyrock SA，并一致将总部置于布鲁塞尔。最新官方规模披露截至 2026
              年 3 月：37 个国家拥有 220 名员工，并在比利时、英国、瑞士、法国和美国设有实体。 Keyrock 还宣称覆盖 85 个以上场所和 1,400 个市场；这些是公司口径的经营指标，并非独立审计结果。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
              - CO010
              - CO013
              - CO014
      - number: '1.2'
        title: 管理层与治理
        blocks:
          - type: paragraph
            body: >-
              三位联合创始人仍担任核心高管：Kevin de Patoul 任 CEO，Jeremy de Groodt 任 CTO，Juan David Mendieta 任首席战略官。
              他们披露的经历涵盖战略咨询、面向银行的安全软件以及银行或央行分析，对一家服务机构客户的交易公司而言，创始人与市场的匹配度可信。 官方领导层页面还列出 Eric Beckwith、Francesco
              Adiliberti 和 Stef Wynendaele 等投资、运营及商业高管。一则当前公司发布的市场岗位转发显示， 全球品牌重塑由 CCO
              负责，意味着公司正向机构化定位调整。治理透明度明显较弱：审阅的公开来源无法确认董事会构成、委员会、创始人投票控制权、 继任安排或投资者同意权，因此关键人和控制风险仍是待核查事项。
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.3'
        title: 资本历史与利益相关方
        blocks:
          - type: paragraph
            body: >-
              Keyrock 2026 年 3 月 31 日的公告确认，SC Ventures 领投 C 轮，Ripple 继续参与，估值为 $1.1B。公告称本轮为规模显著的滚动交割，
              但未披露募资额、投前估值、证券类型、主次发行构成或投资者权利。更早的官方里程碑显示，Volta Ventures 参与种子轮，SIX 和 MiddleGame Ventures 参与 A
              轮，Ripple、MiddleGame 和 Volta 参与 B 轮。A 轮日期无法完全对齐：Keyrock 当前时间线写作 2021 年，独立公司简介则写作 2020 年 10 月。
              因此，现有材料既无法支持精确的当前累计募资额，也无法支持精确的累计稀释比例。该估值是已验证的融资标记，不等于可用现金或经营业绩。
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
      - number: '1.4'
        title: 里程碑与投资评估边界
        blocks:
          - type: paragraph
            body: >-
              公司经营路径显示其有意超越核心做市：算法迭代伴随早期融资，OTC 和期权团队于 2023 年开启，2025 年收购 Turing Capital 后进入资产和财富管理， Fija Finance 则在 2026
              年扩大链上覆盖。CoinDesk 随后报道称，公司拟以 $3.25M 收购 BlockFills 在破产保护中的机构业务，当时仍待法院批准。
              该交易可能带来客户和能力，但从破产交易对手方收购资产也会引入整合、责任筛选和业务连续性风险。更根本的问题是，现有证据没有提供当前收入、收入运行率、
              客户数、留存率或集团经审计盈利。这些缺口阻碍估值与牵引力的检验，应明确保留，不能用数据库估计或旧报告数字填补。
            claimRefs:
              - CO014
              - CO015
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO010
              - CO011
              - CO012
              - CO015
              - CO016
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 估值已披露，融资经济性未披露
            body: Keyrock 的公告支持 $1.1 billion 的 C 轮估值，但融资额、首发与老股转让的构成、优先权以及截至目前的累计融资仍未披露。
            calloutType: risk
            claimRefs:
              - CO010
              - CO013
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场比全部数字资产更窄：它是机构用于在中心化和去中心化场所对代币化资产报价、执行、对冲和管理的流动性及资本市场基础设施。 Keyrock 披露的范围涵盖做市、OTC
              执行、期权、资产管理，以及相邻的资金管理和链上流动性流程。买方可以从综合服务商采购这些功能，
              组合专业团队，直接在交易所和协议上交易，或在内部保留交易和资金管理能力。普通加密资产持有、零售经纪、仅托管支出以及与流动性无关的区块链软件 不在边界内。这样的定义避免把宽泛的代币市场价值当成可获得收入，而是聚焦
              Keyrock 可能服务的预算和流程。
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
              - CM014
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              留存证据没有披露可比的行业收入池、费率分母或公司各服务线收入，无法据此计算 TAM、SAM 或 SOM。因此，经营代理指标是唯一可辩护的测算视角。 Keyrock 2026 年 3 月披露覆盖 85 个场所、拥有
              220 人团队并在 37 个国家运营；独立报道则分别称其覆盖 80 多个场所、拥有 200 多名员工。 Preqin 一份较早或未标日期的简介称其拥有来自 36 个国家的 170
              多名专家，说明公司在扩张，但无法形成干净的时间序列。Tracxn 的竞争者范围和披露募资总额
              显示供应商群体已有融资且较为分散，但募资额既不是市场收入，也不是客户支出。这些代理指标说明触达和竞争性投入，不能形成估值级别的市场规模估计。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM006
              - CM012
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM011
      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开证据指向多个买方群体，而非单一同质客户。CoinDesk 在 Keyrock 寻求收购的 BlockFills 机构网络中识别出对冲基金、资产管理公司、做市商和矿业公司。 Preqin
              描述机构、基金会和其他市场参与者使用定制报价与合作安排；Keyrock 招聘语言也明确面向机构和加密原生受众。交易所、协议和代币发行方购买流动性深度；
              资产配置方和交易公司购买执行、对冲和接入；基金会及资金团队购买市场质量和风险管理支持。采用通常从交易对手及监管批准开始，经有限授权扩展至更多产品和场所。
              预算可能由交易、资金、市场或产品团队掌握，但合同经济性和决策权仍属非公开信息。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.4'
        title: 增长驱动、约束与估值含义
        blocks:
          - type: paragraph
            body: >-
              主要需求驱动是传统金融与代币化市场的融合：SC Ventures 称成熟的流动性基础设施是基础，Keyrock 也同时面向机构配置方和加密原生运营者。 链上支付和稳定币生态带来相邻流动性需求，Keyrock
              宣称参与 OUSD 网络就是一例。约束同样重要：牌照和监管批准决定服务可在哪些地方提供；
              资本和交易对手限额约束库存密集型做市；更换供应商需要法律、运营和风险审批；供应商失灵时买方信任可能迅速恶化。BlockFills 进入第 11 章破产保护时，
              据报负债高于资产，既带来收购机会，也带来整合和风险转移问题。留存来源中的收购价格相差两个数量级，因此没有一手文件就不应把该交易或广泛市场增长用于估值。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 没有可辩护的公开 TAM
            body: 可用来源衡量的是场所、员工规模、竞争者募资和买方类别，而不是可比的年度客户支出；用货币金额给出 TAM/SAM/SOM 会制造虚假的精确度。
            calloutType: risk
            claimRefs:
              - CM012
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 市场拥挤，直接同业之外还有更广替代方案
        blocks:
          - type: paragraph
            body: >-
              直接同业数量可观，并非围绕某一个明显对手集中。Tracxn 识别出 129 家活跃竞争者，其中 31 家已融资，并将 Wintermute、Flowdesk 和 B2C2 列为 Keyrock 的主要竞争者。
              该分类覆盖最接近的算法做市和流动性供应商，但买方实际选择更广：可以从多家流动性供应商采购，使用交易所原生流动性，保留现有 OTC 或主经纪服务关系，
              或在内部建设部分交易和资金能力。这些替代方案的竞争方式不同。直接同业比拼执行、资本、覆盖和服务广度；内部建设与维持现状则通过避免供应商依赖竞争，
              即便会增加人员、技术和资产负债表成本，而留存公开证据没有量化这些成本。
            claimRefs:
              - CP001
              - CP002
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
              - CP011
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
      - number: '3.2'
        title: 可见差异化在于广度和基础设施
        blocks:
          - type: paragraph
            body: >-
              Keyrock 最清晰的已记录差异化是广度，而不是已有公开证明的执行优势。公司材料覆盖做市、资产管理、OTC、期权、高频交易和 DeFi 团队； 2026 年 3 月公告称其活跃于 85
              个中心化和去中心化场所。公司发布的岗位转发还描述了围绕 Rust、AWS、交易所连接和市场数据处理构建的低延迟、关键交易技术栈。 这一组合可降低希望由单一交易对手覆盖多条流程的机构的整合摩擦。但它不能证明
              Keyrock 相比同业提供更紧的价差、更低的滑点、更高的可用性或更高的风险调整回报； 指定证据中没有独立基准检验这些结果。链上资产管理增长还会带来相邻协议竞争者，而不只是扩大 Keyrock 的可服务机会。
            claimRefs:
              - CP005
              - CP007
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP007
              - CP009
              - CP010
              - CP013
              - CP014
              - CP015
      - number: '3.3'
        title: 分销规模可见，定价能力不可见
        blocks:
          - type: paragraph
            body: >-
              公开指标显示出一定经营规模。Keyrock 报告覆盖 85 个场所，当前来源称团队约有 220 至 225 人。International Finance 另称 2024 年覆盖 85 家交易所和 400
              个金融市场，公司岗位转发则称覆盖 80 多家交易所。计划中的 BlockFills 交易若完成并整合，可能带来覆盖对冲基金、资产管理公司、做市商和矿业公司的机构网络。
              这些是分销信号，不是留存或定价能力的证明。留存来源没有披露客户价差、最低承诺、返佣、已实现费用、合同期限、钱包份额或续约行为。 因此，定价比较仍是已知服务模式和明确未知数的证据地图，并不声称 Keyrock
              比同业更便宜或更贵。
            claimRefs:
              - CP005
              - CP006
              - CP011
              - CP013
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP016
      - number: '3.4'
        title: 护城河取决于资本、信任与整合执行
        blocks:
          - type: paragraph
            body: >-
              Keyrock 2026 年 3 月的 C 轮公告将公司估值定为 $1.1B，并称资本将支持资产负债表实力、服务创新和收购。该策略可以叠加场所覆盖、牌照、人才和客户接入， 但 BlockFills
              也暴露出行业脆弱性：CoinDesk 报道称标的进入第 11 章破产保护，负债 $100M–$500M，资产 $50M–$100M。
              一篇声誉较低的行业汇编认为，监管基础设施正与报价质量并列成为竞争轴；这一方向性判断有一定合理性，却不是衡量 Keyrock 现状的独立基准。
              因此，可辩护的护城河不是服务清单本身，而要靠执行质量、韧性控制、持久的交易对手信任和成功整合来证明；指定公开证据没有量化这些方面。
            claimRefs:
              - CP008
              - CP011
              - CP012
              - CP014
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 规模不等于定价能力
            body: 场所数量和员工规模显示经营触达，但留存证据没有量化已实现价差、费用、续约行为或客户钱包份额。
            calloutType: risk
            claimRefs:
              - CP005
              - CP006
              - CP016
          - type: callout
            title: 困境整合可以加速分销
