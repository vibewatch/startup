  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 由于支撑价格的输入仍不可得，证据链将一个可见的私募估值标记转化为继续研究的决定。
    data:
      nodes:
        - id: valuation-marker
          label: $1.1B 私募估值
          detail: 两份第三方报道和 Keyrock 公告相互印证。
        - id: operating-breadth
          label: 广泛的运营面
          detail: 四条明确列出的服务线，以及公司声称覆盖 85+ 个交易场所。
        - id: financing-opacity
          label: 融资条款不可得
          detail: 未披露融资所得、股价、稀释和优先权。
        - id: economics-opacity
          label: 经营经济性不可得
          detail: 留存证据中没有经审计的收入、利润率、留存或集中度数据。
        - id: transaction-conflict
          label: 并购证据冲突
          detail: 指定来源对 BlockFills 的报道金额为 $3.25M 和 $325M。
        - id: decision
          label: 继续研究
          detail: 在完成一手尽调前，不给出估值区间和入场决定。
      edges:
        - from: valuation-marker
          to: operating-breadth
        - from: operating-breadth
          to: financing-opacity
        - from: financing-opacity
          to: economics-opacity
        - from: economics-opacity
          to: transaction-conflict
        - from: transaction-conflict
          to: decision
    approximationNotes: 这是一条定性决策链；不代表概率、转化率或与价值成比例的节点大小。
    claimRefs:
      - CV001
      - CV005
      - CV010
      - CV013
      - CV014
