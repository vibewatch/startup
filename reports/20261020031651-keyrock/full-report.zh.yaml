            - 交易场所与市场覆盖
            - 未披露激活分母
        - label: 关系扩张
          detail: 增加服务、地域或被收购网络的接入。
          touchpoints:
            - BlockFills 机构网络
            - 客户基础和地域增长意图
        - label: 留存证明
          detail: 公开证据止步于续约、客户群、集中度和经常性经济性之前。
          touchpoints:
            - NRR 和 GRR 不可得
            - 头部客户敞口不可得
    approximationNotes: 这条链路是分析性的客户工作流模型，不是 Keyrock 披露的销售流程；其中没有推断转化率或阶段规模。
    claimRefs:
      - CU008
      - CU011
      - CU012
      - CU013
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 仅依据留存证据，对可能性、影响、缓解成熟度和剩余严重程度作定性判断；未知值保持明确标注。
    data:
      columns:
        - 可能性
        - 影响
        - 缓解成熟度
        - 剩余严重程度
      rows:
