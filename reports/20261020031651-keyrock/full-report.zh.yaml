  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 决策与价格纪律
        blocks:
          - type: paragraph
            body: >-
              公开估值标记清楚，但投资价值并不清楚。两份第三方报告称 Keyrock 在 2026 年 3 月 C 轮后估值 $1.1B，而 Keyrock 只称交易规模显著且为滚动交割。
              留存来源没有提供募资额、股价、稀释、清算优先权、收入、利润率、留存或客户集中度。这些缺口阻碍回报模型，使 headline 估值成为观察到的融资信号，而不是公允价值证据。
              因此建议继续研究，风险高，且估值偏高、尚未完成投资评估。在取得一手交易文件和经审计经营数据前，不应仅凭轮次名称或投资者姓名入场。
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV010
              - CV013
              - CV014
      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              可投资论点是广度加基础设施：Keyrock 覆盖做市、资产管理、OTC 和期权，并称其流动性层触达 85 多个场所。融资公告还显示其团队有 220 人、覆盖 37 个国家。
              这些信号支持跨服务分销和机构相关性的可能性，但仍是公司发布的规模指标，不是盈利质量的证明。反论点是，经营广度可能消耗资产负债表和风险资本，却无法带来有吸引力的风险调整回报。 公司管理的 LinkedIn
              页面同时显示 223 名可见员工和 51-200 人规模区间，说明公开经营指标不能替代尽调级数据。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV012
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
              - CV015
      - number: '8.3'
        title: 融资与交易背景
        blocks:
          - type: paragraph
            body: >-
              Keyrock 称 C 轮资本将强化资产负债表、支持服务创新并用于收购，但未量化分配。收购报道增加了重要的核验问题。CoinDesk 报道拟以 $3.25M 收购破产的 BlockFills，
              待法院批准，并称负债为 $100M–$500M、资产为 $50M–$100M。后来一篇声誉较低的合规文章却称交易已以 $325M 完成。
              百倍价格冲突和不同完成状态无法用指定证据调和，因此两个数字都不应进入估值模型。需要法院一手命令、购买协议和交割记录。
            claimRefs:
              - CV003
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.4'
        title: 情景、退出与最终尽调
        blocks:
          - type: paragraph
            body: >-
              情景分析可以定性，但不能定量。乐观情景需要经审计证据证明多产品广度能转化为持久收入、有吸引力的利润率、重复机构需求以及受控的风险资本。
              基准情景是公司在当前私募市场标记下继续保持战略相关性，但回报仍未被证明。悲观情景包括倍数压缩、单位经济性弱、融资优先权拖累，以及收购整合或交易对手损失。 EquityZen 将
              IPO、并购和符合条件的市场转售列为私人股份可能的退出方式，但 Keyrock 特定交易、股权结构表和财务数据均受限。因此退出准备度未验证。 在设定价格或目标回报前，最终尽调必须取得股权结构表、C
              轮文件、经审计财务、风险资本明细、集中度数据及 BlockFills 一手交易记录。
            claimRefs:
              - CV007
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV010
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 先看质量，再看价格
            body: 在一手融资条款、经审计经营数据、集中度和风险资本证据支持入场价格前，不要把 $1.1B 融资标记转化为买入决定。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV007
              - CV013
              - CV014
