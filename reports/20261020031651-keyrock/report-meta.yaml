  topStrengths:
    - Broad institutional service set across market making, OTC, options, asset management, and onchain liquidity.
    - Company-reported reach across more than 85 venues and 1,400 markets.
    - Experienced founder-led management and support from strategic financial-market investors.
  topRisks:
    - Audited revenue, margins, retention, customer concentration, and risk-adjusted profitability are not public.
    - Series C proceeds, share price, dilution, liquidation preferences, and investor rights are undisclosed.
    - >-
      BlockFills integration, inherited-liability, regulatory-approval, and client-migration exposure remains
      unresolved.
    - >-
      Automated liquidity provision depends on volatile markets, venue access, counterparties, and balance-sheet
      resilience.
  unresolvedGaps:
    - >-
      Audited 2025 and year-to-date 2026 financials, including revenue by service line, gross margin, and risk-adjusted
      trading results.
