companyProfile:
  summary: >-
    Keyrock was founded in Brussels in 2017 and has expanded from algorithmic market making into OTC and options
    execution, asset management, and onchain liquidity. It reported 220 people across 37 countries and activity across
    more than 85 venues in March 2026. SC Ventures led a Series C, with continued Ripple support, at a reported $1.1
    billion valuation, but the company did not disclose proceeds or the operating metrics needed to test that price.
