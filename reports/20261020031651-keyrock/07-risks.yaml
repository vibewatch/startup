    title: Risk heatmap
    type: matrix
    summary: >-
      Qualitative view of likelihood, impact, mitigation maturity, and residual severity based
      only on the retained evidence; unknown values remain explicit.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Regulatory approvals and license transfer
          values: [Medium, High, Partial, High]
        - label: Distressed-asset integration
          values: [Medium, High, Early, High]
        - label: Balance-sheet and counterparty stress
          values: [Medium, High, Undisclosed, High]
        - label: Multi-venue technology / security
          values: [Unknown, High, Undisclosed, Unquantified]
        - label: Client and staff migration
          values: [Medium-high, High, Early, High]
        - label: Financial and concentration transparency
          values: [High, Medium-high, Undisclosed, High]
    approximationNotes: >-
      Qualitative labels are analytical, not probability estimates; no numeric likelihood or
      loss model is supported by the assigned evidence.
    claimRefs: [CR001, CR008, CR009, CR010, CR011, CR013, CR015, CR016]
callouts:
  - calloutType: risk
    title: Primary-document gate
    body: >-
      Do not underwrite the acquisition or regulatory expansion from secondary summaries alone:
      require the final sale order, purchase agreement, license consents, liability schedules,
      and post-close integration reporting.
    claimRefs: [CR004, CR005, CR006, CR007, CR009]
