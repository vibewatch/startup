      diligencePath: Request primary transaction documents and independently verify each licensed entity with the relevant regulator.
      relatedQuestionRefs: [QR001, QR002, QR009]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: integration-risk
      missingEvidence: Post-close client, volume, staff, contract-novation, systems-migration, and inherited-claim metrics.
      whyItMatters: Acquisition value and operational risk depend on assets and relationships actually transferring and remaining active.
      diligencePath: Review the integration plan, weekly migration dashboard, staff retention, client cohorts, and exception logs.
      relatedQuestionRefs: [QR003, QR008]
      relatedTableRefs: [TR002, TR003]
    - type: private-evidence-only
      severity: material
      topic: balance-sheet
      missingEvidence: Audited 2025 and 2026 interim financials, liquidity buffers, leverage, counterparty limits, and severe-stress results.
      whyItMatters: Public funding and valuation disclosures do not measure loss absorption or capital available under stress.
