      severity: "material"
      topic: "customer-concentration"
      missingEvidence: "Revenue, volume, margin, retention, and counterparty exposure by the ten largest customers, venues, protocols, and issuers."
      whyItMatters: "Distribution breadth can coexist with concentrated economics or counterparty risk, which would weaken switching-cost and moat conclusions."
      diligencePath: "Request a cohort and concentration schedule reconciled to audited revenue, trading volume, limits, and counterparty-risk reporting."
      relatedQuestionRefs:
