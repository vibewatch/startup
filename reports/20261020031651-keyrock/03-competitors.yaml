    - type: "private-evidence-only"
      severity: "material"
      topic: "pricing-gap"
      missingEvidence: "Realized spreads, fee schedules, rebates, minimum commitments, collateral terms, discounts, contract duration, and peer bids on comparable mandates."
      whyItMatters: "Without normalized commercial terms, service breadth and venue count cannot establish pricing power or customer value."
      diligencePath: "Run a standardized request for proposal with Keyrock, Wintermute, Flowdesk, B2C2, and at least one incumbent or internal-build cost case."
      relatedQuestionRefs:
