artifact: "company-overview"
slug: "keyrock"
runDate: "2026-10-20"
company:
  name: "Keyrock"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Keyrock is a Brussels-founded digital-asset market maker and investment group whose official March 2026 Series C valued it at $1.1 billion. The public record supports a 220-person organization, broad trading-venue coverage, and continued product expansion, but it does not disclose the Series C amount, current total raised, revenue run rate, customer count, board composition, or investor rights."
sections:
  - id: "identity-and-operating-footprint"
    title: "Identity and operating footprint"
    body: >-
      Keyrock was founded and incorporated in Brussels in 2017 and now presents itself as a
      digital-asset investment group spanning market making, OTC execution, options, asset
      management, and onchain liquidity. Its commercial model is primarily institutional:
      proprietary algorithms quote and manage liquidity across centralized and decentralized
      venues, while adjacent desks provide tailored execution and investment products. Public
      sources identify the Belgian parent as Keyrock SA and consistently place headquarters in
      Brussels. The latest official scale disclosure, dated March 2026, was 220 employees across
      37 countries and entities in Belgium, the UK, Switzerland, France, and the US. Keyrock also
      claims activity across more than 85 venues and 1,400 markets; those are company-originated
      operating metrics rather than independently audited measures.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: "leadership-and-governance"
    title: "Leadership and governance"
    body: >-
      The three co-founders remain in central executive roles: Kevin de Patoul as CEO, Jeremy de
      Groodt as CTO, and Juan David Mendieta as Chief Strategy Officer. Their disclosed
      backgrounds cover strategy consulting, secure banking-oriented software, and banking or
      central-bank analysis, which is a credible founder-market-fit combination for an
      institution-facing trading firm. The official leadership page adds experienced investment,
      operating, and commercial executives, including Eric Beckwith, Francesco Adiliberti, and
      Stef Wynendaele. A current company-issued marketing-role repost places a global rebrand
      mandate under the CCO, signaling an institutional repositioning. Governance visibility is
      materially weaker: the reviewed public sources do not establish board composition,
      committees, founder voting control, succession arrangements, or investor consent rights,
      so key-person and control risk remain open diligence items.
    claimRefs: [CO006, CO007, CO008, CO009]
    tableRefs: [TO002]
  - id: "capital-and-stakeholders"
    title: "Capital history and stakeholder map"
    body: >-
      Keyrock's March 31, 2026 announcement confirms a Series C led by SC Ventures, with continued
      Ripple participation, at a $1.1 billion valuation. It calls the financing a significant
      rolling close but does not disclose proceeds, pre-money valuation, security type, primary
      versus secondary mix, or investor rights. Earlier official milestones identify Volta
      Ventures in the seed round, SIX and MiddleGame Ventures in Series A, and Ripple,
      MiddleGame, and Volta in Series B. The Series A date is not cleanly reconciled: Keyrock's
      current timeline says 2021, while an independent company profile says October 2020.
      Consequently, neither an exact current total-raised figure nor precise cumulative dilution
      is supportable from this pool. The valuation is a verified financing marker, not evidence
      of cash available or operating performance.
    claimRefs: [CO010, CO011, CO012, CO013]
    tableRefs: [TO003]
  - id: "milestones-and-underwriting-limits"
    title: "Milestones and underwriting limits"
    body: >-
      The operating arc shows deliberate broadening beyond core market making: algorithm
      iterations accompanied early financings, OTC and options desks opened in 2023, asset and
      wealth management followed the 2025 Turing Capital acquisition, and Fija Finance expanded
      onchain reach in 2026. CoinDesk then reported a proposed $3.25 million acquisition of
      BlockFills' institutional business from Chapter 11, subject at that point to court approval.
      That transaction could add clients and capabilities, but acquiring assets from a bankrupt
      counterparty introduces integration, liability-selection, and continuity risks. More
      fundamentally, the reviewed evidence does not supply current revenue, revenue run rate,
      customer count, retention, or audited group profitability. Those omissions prevent a
      valuation-to-traction test and should remain explicit rather than being filled with
      database estimates or prior-report numbers.
    claimRefs: [CO014, CO015, CO016]
    figureRefs: [FO001]
