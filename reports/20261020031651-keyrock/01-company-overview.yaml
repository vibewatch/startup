  - id: "TO002"
    title: "Leadership and founder table"
    columns: ["Person", "Role", "Disclosed background", "Functional coverage", "Key-person dependency"]
    rows:
      - ["Kevin de Patoul", "Co-founder and CEO", "Former Roland Berger strategy consultant", "Corporate strategy, fundraising, external leadership", "High: CEO remains central to strategy and financing narrative"]
      - ["Jeremy de Groodt", "Co-founder and CTO", "Led secure-application teams for European institutions and banking", "Technical vision and infrastructure", "High: core trading infrastructure is a defining capability"]
      - ["Juan David Mendieta", "Co-founder and Chief Strategy Officer", "Banking strategy consulting and central-banking supply models", "Long-term strategy and market structure", "High: strategy role remains founder-held"]
      - ["Eric Beckwith", "Chief Investment Officer", "Former Bank of America Merrill Lynch trading-desk managing director", "Investment strategy and trading operations", "Medium: institutional trading expertise is concentrated in named leadership"]
      - ["Francesco Adiliberti", "Chief Operating Officer", "Former senior roles at Goldman Sachs, UBS, Nomura, HSBC, and Amber Group", "Operations and organizational development", "Medium: execution of geographic and product expansion"]
      - ["Stef Wynendaele", "Chief Commercial Officer", "Keyrock commercial and growth roles since 2018", "Institutional sales, partnerships, and rebrand sponsorship", "Medium: current repositioning mandate reports into the CCO"]
    notes: "Backgrounds and responsibilities are company-disclosed; third-party profiles corroborate the founder roles but not every biography."
    enumerationScope:
      coverage: "exhaustive"
      basis: "All six executives displayed on Keyrock's official leadership page when accessed on 2026-10-20."
    claimRefs: [CO006, CO007, CO008, CO009]
  - id: "TO003"
    title: "Stakeholder or investor map"
    columns: ["Stakeholder", "Financing role", "Control or economic importance", "Diligence ask"]
    rows:
      - ["SC Ventures", "Series C lead", "Lead investor at the $1.1 billion valuation", "Obtain investment amount, board rights, preferences, and strategic-commercial commitments"]
      - ["Ripple", "Series B lead; continued Series C support", "Recurring strategic investor across two disclosed rounds", "Confirm current ownership, pro rata rights, and related commercial dependencies"]
      - ["SIX / SIX FinTech Ventures", "Series A investor", "Institutional financial-market sponsor in early scaling phase", "Confirm current stake, observer rights, and any ongoing commercial relationship"]
      - ["MiddleGame Ventures", "Series A and Series B investor", "Recurring financial investor", "Confirm current ownership, follow-on participation, and transfer restrictions"]
      - ["Volta Ventures", "Seed, Series A, and Series B investor", "Longest-running named institutional backer", "Confirm founder dilution history, remaining stake, and information rights"]
    notes: "This map is limited to investors named in Keyrock's official financing timeline and March 2026 release; ownership percentages and rights were not public."
    enumerationScope:
      coverage: "exhaustive"
      basis: "All investors named in Keyrock's official 2018-2026 financing timeline and March 2026 Series C release."
    claimRefs: [CO010, CO011, CO012, CO013]
