artifact: valuation
slug: keyrock
runDate: "2026-10-20"
company:
  name: Keyrock
chapter:
  number: 8
  title: Valuation
  summary: >-
    Keyrock has a corroborated $1.1 billion private-market valuation and credible operating-breadth
    signals, but the public record does not disclose the financing proceeds, preferences, audited
    economics, or customer-quality metrics needed to underwrite that price. The appropriate stance
    is research more, with high risk and no defensible public valuation range until those gaps close.
sections:
  - id: decision-and-price-discipline
    title: Decision and price discipline
    body: >-
      The public valuation marker is clear but the investment value is not. Two third-party reports
      place Keyrock at $1.1 billion following its March 2026 Series C, while Keyrock describes the
      transaction only as significant and a rolling close. None of the retained sources provides
      proceeds, share price, dilution, liquidation preferences, revenue, margin, retention, or
      customer concentration. Those omissions prevent a return model and make the headline valuation
      an observed financing signal rather than evidence of fair value. The recommendation is therefore
      research more, with high risk and a stretched, ununderwritten valuation stance. Entry should wait
      for primary transaction documents and audited operating data rather than rely on the round label
      or investor names.
    claimRefs: [CV001, CV002, CV007, CV013, CV014]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The investable thesis is breadth plus infrastructure: Keyrock markets market making, asset
      management, OTC, and options, and says its liquidity layer reaches more than 85 venues. Its
      financing announcement also points to a 220-person team operating across 37 countries. These
      signals support the possibility of cross-service distribution and institutional relevance, but
      they remain company-issued scale indicators rather than proof of earnings quality. The
      anti-thesis is that operational breadth can consume balance sheet and risk capital without
      producing attractive risk-adjusted returns. A company-managed LinkedIn page also simultaneously
      shows 223 visible employees and a 51-200 employee size band, illustrating why public operating
      indicators should not substitute for diligence-grade data.
    claimRefs: [CV004, CV005, CV006, CV012, CV015]
    tableRefs: [TV002]
  - id: financing-and-transaction-context
    title: Financing and transaction context
    body: >-
      Keyrock says the Series C capital will strengthen its balance sheet, support service innovation,
      and fund acquisitions, but it does not quantify the allocation. Acquisition reporting adds a
      material verification problem. CoinDesk reported a proposed $3.25 million purchase of bankrupt
      BlockFills subject to court approval and cited liabilities of $100 million to $500 million
      against assets of $50 million to $100 million. A later low-reputation compliance article instead
      reported a completed $325 million purchase. The hundredfold price conflict and different
      completion statuses cannot be reconciled from the assigned evidence, so neither number should
      enter a valuation model. Primary court orders, purchase agreements, and closing records are
      required.
    claimRefs: [CV003, CV008, CV009, CV010, CV011]
  - id: scenarios-exit-and-diligence
    title: Scenarios, exit, and final diligence
    body: >-
      Scenario work can be directional but not numerical. A bull case requires audited evidence that
      multi-product breadth converts into durable revenue, attractive margins, repeat institutional
      demand, and controlled capital-at-risk. The base case is continued strategic relevance with an
      unproven return at the current private-market marker. The bear case combines multiple compression,
      weak unit economics, financing preference overhang, and acquisition integration or counterparty
      losses. EquityZen describes IPO, merger or acquisition, and eligible marketplace resale as
      possible private-share exits, but it gates Keyrock-specific deals, cap-table data, and financials.
      Exit readiness is therefore unverified. Final diligence must obtain the cap table, Series C
      documents, audited financials, risk-capital schedule, concentration data, and primary BlockFills
      transaction records before setting a price or target return.
    claimRefs: [CV007, CV010, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Evidence basis, Decision implication]
    rows:
      - [Recommendation, "Research more", "Headline valuation is known; underwriting inputs are not.", "Do not approve an entry price from public evidence."]
      - [Confidence, "Medium-low", "The financing marker is corroborated, but economics and terms are absent.", "Treat the conclusion as a diligence gate, not a price target."]
      - [Risk rating, "High", "Balance-sheet deployment and acquisition reporting add unresolved exposure.", "Require primary financial, risk, and transaction records."]
      - [Valuation stance, "Stretched / ununderwritten", "$1.1 billion is reported without disclosed proceeds or operating multiples.", "No defensible public valuation range is available."]
      - [Price-change trigger, "Not yet quantifiable", "No audited earnings base, cap table, or preference stack is public.", "Set a return hurdle only after the missing inputs are supplied."]
    notes: "Assessments are analytical judgments from the retained public evidence; they are not a securities price, offer, or independently verified company guidance."
    claimRefs: [CV001, CV002, CV007, CV013, CV014]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Argument, Current evidence, What would change the view]
    rows:
      - [Thesis, "Broad service surface can deepen institutional relationships.", "Company materials list market making, asset management, OTC, and options.", "Audited segment revenue, retention, and cross-sell data would strengthen the thesis."]
      - [Thesis, "Venue connectivity can support distribution and execution breadth.", "Keyrock says its liquidity layer aggregates data from more than 85 exchanges.", "Independent execution-quality and profitability benchmarks are needed."]
      - [Anti-thesis, "Scale signals may mask capital intensity and volatile trading economics.", "Public sources disclose team and venue reach but not risk-adjusted earnings.", "Audited margins, capital-at-risk, and stress losses could rebut this concern."]
      - [Anti-thesis, "Acquisition execution and disclosure quality may create downside.", "Assigned sources disagree by one hundredfold on the BlockFills purchase price.", "Primary court and closing documents must resolve price, liabilities, and status."]
    notes: "Operating breadth and scale are company-issued claims; the anti-thesis reflects evidence gaps and a documented public-source conflict, not a forecast."
    claimRefs: [CV004, CV005, CV006, CV010, CV011, CV015]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Evidence-supported assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Service breadth produces durable cross-sell, audited margins, and controlled capital-at-risk.", "A premium could be supportable only after economics and round terms validate the $1.1 billion marker.", "Not estimable from public evidence.", "Failure to produce audited segment economics."]
      - [Base, "Keyrock remains strategically relevant, but financial conversion and financing rights remain opaque.", "Treat $1.1 billion as a financing marker with no defensible return range.", "Most consistent with the assigned evidence.", "Preference overhang or weak retention discovered in diligence."]
      - [Bear, "Multiple compression combines with weak unit economics, integration costs, or counterparty losses.", "Downside cannot be bounded without balance-sheet, preference, and exposure data.", "Plausible but not quantifiable.", "Material stress loss, failed acquisition approval, or a down round."]
    notes: "Scenarios are conditional frameworks, not forecasts; probabilities and valuation ranges are intentionally withheld because the required financial and transaction inputs are not public."
    claimRefs: [CV001, CV003, CV010, CV013, CV014, CV015]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: "The evidence chain converts a visible private valuation marker into a research-more decision because price-supporting inputs remain unavailable."
    data:
      nodes:
        - id: valuation-marker
          label: "$1.1B private valuation"
          detail: "Corroborated by two third-party reports and Keyrock's announcement."
        - id: operating-breadth
          label: "Broad operating surface"
          detail: "Four named service lines and company-claimed reach across 85+ venues."
        - id: financing-opacity
          label: "Financing terms unavailable"
          detail: "Proceeds, share price, dilution, and preferences are not disclosed."
        - id: economics-opacity
          label: "Economics unavailable"
          detail: "No audited revenue, margins, retention, or concentration in the retained evidence."
        - id: transaction-conflict
          label: "M&A evidence conflicts"
          detail: "Assigned sources report $3.25M versus $325M for BlockFills."
        - id: decision
          label: "Research more"
          detail: "Withhold a valuation range and entry decision pending primary diligence."
      edges:
        - from: valuation-marker
          to: operating-breadth
        - from: operating-breadth
          to: financing-opacity
        - from: financing-opacity
          to: economics-opacity
        - from: economics-opacity
          to: transaction-conflict
        - from: transaction-conflict
          to: decision
    approximationNotes: "This is a qualitative decision chain; it does not imply probabilities, conversion rates, or value-proportional node sizes."
    claimRefs: [CV001, CV005, CV010, CV013, CV014]
callouts:
  - calloutType: recommendation
    title: Price before quality
    body: >-
      Do not convert the $1.1 billion financing marker into a buy decision until primary financing
      terms, audited economics, concentration, and capital-at-risk evidence support an entry price.
    claimRefs: [CV001, CV007, CV013, CV014]
