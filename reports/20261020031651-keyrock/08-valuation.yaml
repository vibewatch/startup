  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financing-terms
      missingEvidence: "Series C proceeds, primary share price, ownership sold, dilution, liquidation preferences, participation rights, and any secondary component."
      whyItMatters: "These terms determine effective entry valuation, downside protection, and the ownership required for a target return."
      diligencePath: "Obtain the signed financing documents, post-money cap table, investor rights agreement, and board-approved sources-and-uses schedule."
      relatedQuestionRefs: [QV003, QV010]
    - type: private-evidence-only
      severity: material
      topic: underwriting-gaps
      missingEvidence: "Audited revenue by service line, gross and contribution margins, retention, customer concentration, capital-at-risk, and stress-loss history."
      whyItMatters: "Without these inputs, scenario probabilities, valuation multiples, and downside cannot be modeled responsibly."
      diligencePath: "Review audited 2025 and year-to-date 2026 financials, cohort schedules, counterparty exposures, and risk-committee stress reports."
      relatedQuestionRefs: [QV004, QV008, QV010]
    - type: missing-source
      severity: material
      topic: valuation-comparables
      missingEvidence: "Comparable company operating metrics, transaction values, and normalized revenue or earnings bases matched to Keyrock's service mix."
      whyItMatters: "A list of names or private funding marks cannot support a defensible valuation range without comparable denominators and periods."
      diligencePath: "Build a primary-source comparable set from public filings, transaction documents, and verified private-round data after Keyrock's own financial denominator is available."
      relatedQuestionRefs: [QV005]
    - type: conflicting-data
      severity: material
      topic: acquisition-price
      missingEvidence: "Primary BlockFills purchase agreement, bankruptcy-court sale order, final consideration schedule, assumed liabilities, and regulatory closing status."
      whyItMatters: "Assigned sources disagree by one hundredfold on price and differ on whether the transaction was proposed or completed."
      diligencePath: "Retrieve the bankruptcy docket, executed asset-purchase agreement, court approval order, and Keyrock closing announcement before using the transaction in valuation."
      relatedQuestionRefs: [QV007]
