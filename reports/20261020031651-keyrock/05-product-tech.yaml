  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "control-diligence"
      missingEvidence: >-
        Current SOC or equivalent control reports, penetration-test summaries, custody and
        key-management design, incident history, uptime records, recovery tests, and service-level terms.
      whyItMatters: >-
        These controls determine whether the multi-venue execution stack can protect assets,
        maintain availability, and recover safely under stressed market conditions.
      diligencePath: >-
        Request control reports and exceptions, architecture and custody diagrams, the
        24-month incident register, uptime exports, and observed disaster-recovery results.
      relatedQuestionRefs: [QE007]
    - type: "missing-source"
      severity: "material"
      topic: "execution"
      missingEvidence: >-
        Independent, denominator-complete measurements of spread, depth, slippage, fill rate,
        latency, and uptime by venue and service line.
      whyItMatters: >-
        Product differentiation rests on execution quality, but public claims cannot show
        whether Keyrock outperforms alternatives or remains resilient during volatility.
      diligencePath: >-
        Obtain venue-level before-and-after cohorts, timestamped execution-quality reports,
        client references, and third-party monitoring exports for normal and stressed periods.
      relatedQuestionRefs: [QE003, QE004, QE005]
    - type: "private-evidence-only"
      severity: "material"
      topic: "blockfills"
      missingEvidence: >-
        A product-by-product integration plan covering acquired technology, data migration,
        customer cutover, control ownership, regulatory approvals, and decommissioning.
      whyItMatters: >-
        Acquired technology and teams may broaden the platform while increasing operational,
        security, and continuity risk during integration.
      diligencePath: >-
        Review the signed integration plan, system inventory, migration test evidence,
        approval dependencies, customer communications, and accountable control owners.
      relatedQuestionRefs: [QE006, QE008]
