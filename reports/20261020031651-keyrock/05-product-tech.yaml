company:
  name: "Keyrock"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Keyrock presents a broad digital-asset operating stack built around algorithmic
    market making, institutional execution, onchain liquidity, and asset management,
    with company materials claiming connectivity across more than 85 exchanges.
    The public evidence establishes breadth but not independently measured execution
    quality, uptime, security controls, or the implementation status of the newer
    agentic and BlockFills-derived capabilities.
sections:
  - id: "product-scope"
    title: "Product scope and customer workflow"
    body: >-
      Keyrock's public product is not a single software SKU. It is a managed capital-markets
      service set spanning algorithmic market making, OTC and options execution, asset
      management, and onchain liquidity. The official funding release confirms that service
      breadth, while independent profiles add treasury, validator, ecosystem-development,
      and API delivery descriptions that should be treated as directory-reported rather than
      as audited product specifications. In workflow terms, token issuers and venues buy
      liquidity and market-quality support, while institutions use execution desks and
      managed-investment services. This breadth can increase account share, but public
      materials do not disclose service-level terms, realized execution improvements, or
      which legal entity delivers each module.
    claimRefs: [CE004, CE005, CE006, CE009, CE011]
    tableRefs: [TE001]
  - id: "operating-architecture"
    title: "Operating architecture and delivery model"
    body: >-
      The evidence supports an architecture centered on multi-venue market data, proprietary
      quantitative logic, automated quoting, and execution across centralized and
      decentralized markets. Keyrock says it aggregates liquidity and price data from more
      than 85 exchanges into a unified trading layer, provides continuous algorithmic
      pricing, and adjusts markets in real time. Directory evidence describes an
      institutional API and proprietary quantitative infrastructure, but no retained source
      exposes API documentation, system topology, custody boundaries, latency, capacity, or
      failover design. The architecture map therefore distinguishes disclosed operating
      functions from inferred interfaces and does not represent a verified technical
      implementation.
    claimRefs: [CE001, CE002, CE003, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: "maturity-and-roadmap"
    title: "Maturity, deployment, and roadmap"
    body: >-
      Current maturity is clearest in the established market-making service, which Keyrock
      markets as operating continuously across a large venue footprint. Adjacent services
      are publicly named but less measurable. A company-authored job description says an
      agentic layer already runs market mechanics, yet provides no deployment scope,
      validation method, or performance baseline. The March 2026 funding release frames
      innovation, service growth, and acquisitions as forward priorities. CoinDesk first
      reported the proposed BlockFills asset acquisition in June, and a later specialist
      outlet reported technology, operating systems, and derivatives talent entering the
      platform. Integration milestones, customer migration, and production cutover evidence
      remain undisclosed.
    claimRefs: [CE002, CE010, CE012, CE013]
    tableRefs: [TE002]
  - id: "trust-and-technical-risk"
    title: "Trust, reliability, and technical diligence"
    body: >-
      The retained evidence does not establish independently measured uptime, incident
      history, audited security controls, privacy practices, custody design, business
      continuity, or execution-quality benchmarks. FintechMall explicitly recommends
      confirming the legal entity, custody model, regulatory perimeter, wallet controls,
      settlement exposure, reconciliation, and continuity arrangements. Those are selection
      questions rather than findings of deficiency, but they define the central technical
      diligence boundary for a provider that connects to many venues and may combine
      principal risk, execution, and managed services. The BlockFills integration adds
      technology and talent but also expands the operational surface that must be tested
      before treating product breadth as a defensible technology advantage.
    claimRefs: [CE007, CE012, CE013, CE014]
tables:
  - id: "TE001"
    title: "Product module and maturity matrix"
    columns: ["Module", "Primary user", "Public maturity signal", "Differentiation claim", "Diligence gap"]
    rows:
      - ["Algorithmic market making", "Token issuers, exchanges, and market participants", "Officially marketed as active with continuous pricing across 85+ exchanges", "Unified multi-venue liquidity and real-time quote adjustment", "No independent uptime, spread, depth, or slippage benchmark"]
      - ["Institutional OTC and options", "Institutional counterparties", "Named by official and third-party sources as a current service", "Combines bilateral execution with broader liquidity capabilities", "No volume, fill-quality, counterparty, or settlement metrics"]
      - ["Asset and wealth management", "Institutional allocators and asset owners", "Named as an active service in the March 2026 company release", "Extends Keyrock from execution into managed investment services", "No assets under management, mandate terms, or performance history"]
      - ["Onchain and DeFi liquidity", "Protocols, ecosystems, and issuers", "Reported by directories and a company-authored job description", "Spans centralized and decentralized venue types", "No protocol-level deployment list, custody model, or smart-contract assurance"]
      - ["Advisory, validator, and ecosystem services", "Blockchain ecosystems and asset issuers", "Directory-reported; detailed operating maturity is not public", "Packages liquidity with ecosystem and infrastructure support", "No official module documentation, customer outcomes, or service-level scope"]
    notes: >-
      Statuses are evidence-bounded as of 2026-10-20; company marketing is not an
      independent performance test, and null operating metrics remain diligence gaps.
    claimRefs: [CE002, CE004, CE005, CE009, CE011]
  - id: "TE002"
    title: "Customer workflow and use-case evidence"
    columns: ["User job", "Starting workflow", "Keyrock solution", "Claimed benefit", "Public limitation"]
    rows:
      - ["Maintain a liquid token market", "Fragmented venue books and price differences", "Algorithmic market making and unified multi-venue quotes", "Tighter spreads, deeper books, and more stable execution", "No independent before-and-after market-quality data"]
      - ["Execute institutional digital-asset trades", "Source liquidity and manage large or complex orders", "OTC, spot, options, and high-frequency trading desks", "Broader execution coverage from one provider", "No disclosed execution-quality, fee, or settlement comparison"]
      - ["Build onchain market infrastructure", "Coordinate protocol liquidity and ecosystem participation", "Onchain liquidity, DeFi desks, validator, and ecosystem services", "Connect liquidity provision with ecosystem support", "Public evidence does not document custody, smart-contract controls, or deployment outcomes"]
    notes: >-
      Benefits are company or directory claims, not independently measured outcomes;
      retained sources do not provide comparable deployment-level denominators.
    claimRefs: [CE001, CE003, CE005, CE007, CE011]
  - id: "TE003"
    title: "Evidence-bounded technology and operating architecture"
    columns: ["Layer or process", "Disclosed role", "Dependency", "Principal risk"]
    rows:
      - ["Market-data and liquidity inputs", "Aggregate liquidity and price data from 85+ exchanges", "Venue APIs, data quality, and continuous connectivity", "Stale data, venue outages, and inconsistent market states"]
      - ["Quantitative decision layer", "Generate and adjust quotes using proprietary algorithms", "Models, risk limits, and real-time processing", "No public latency, model-governance, or stress-performance evidence"]
      - ["Execution and service layer", "Deliver market making, OTC, options, spot, and onchain services", "Capital, counterparties, custody, and settlement rails", "Principal, counterparty, settlement, and integration exposure"]
      - ["Client delivery and oversight", "Provide API access and trading insights or statistics on demand", "Reporting, reconciliation, approvals, and support", "No public SLA, control audit, business-continuity test, or support metric"]
    notes: >-
      The rows summarize functions explicitly described by retained sources; dependencies
      and risks are diligence implications, not verified descriptions of Keyrock's internal topology.
    claimRefs: [CE001, CE002, CE003, CE006, CE007, CE008, CE011]
figures:
  - id: "FE001"
    title: "Publicly evidenced product architecture"
    type: "stack"
    summary: >-
      Disclosed capabilities form a six-layer operating stack, while implementation
      details and control evidence remain largely private.
    data:
      layers:
        - label: "Market inputs"
          modules: ["Liquidity data", "Price data across 85+ exchanges"]
        - label: "Venue connectivity"
          modules: ["Centralized venues", "Decentralized venues"]
        - label: "Quantitative layer"
          modules: ["Proprietary algorithms", "Real-time quote adjustment"]
        - label: "Execution surfaces"
          modules: ["Market making and high-frequency trading", "OTC, spot, and options"]
        - label: "Client delivery"
          modules: ["Institutional API", "Trading insights and statistics"]
        - label: "Expansion layer"
          modules: ["Agentic market mechanics claim", "BlockFills technology integration"]
    approximationNotes: >-
      Layer order is an analytical presentation of disclosed functions, not a verified
      system topology; no performance or control metric is inferred.
    claimRefs: [CE001, CE003, CE008, CE010, CE012, CE013]
callouts:
  - calloutType: "strength"
    title: "Broad service surface with multi-venue connectivity"
    body: >-
      Keyrock combines market making, institutional execution, onchain services, and
      asset management, while official materials claim connectivity across more than
      85 exchanges. That breadth is strategically useful but remains primarily
      company-described.
    claimRefs: [CE002, CE004, CE011]
  - calloutType: "risk"
    title: "Control evidence trails product breadth"
    body: >-
      Public sources do not provide independent uptime, execution-quality, security,
      custody, continuity, or integration evidence sufficient to underwrite the
      operating stack.
    claimRefs: [CE007, CE013, CE014]
