      - number: '5.3'
        title: Maturity, deployment, and roadmap
        blocks:
          - type: paragraph
            body: >-
              Current maturity is clearest in the established market-making service, which Keyrock markets as operating
              continuously across a large venue footprint. Adjacent services are publicly named but less measurable. A
              company-authored job description says an agentic layer already runs market mechanics, yet provides no
              deployment scope, validation method, or performance baseline. The March 2026 funding release frames
              innovation, service growth, and acquisitions as forward priorities. CoinDesk first reported the proposed
              BlockFills asset acquisition in June, and a later specialist outlet reported technology, operating
              systems, and derivatives talent entering the platform. Integration milestones, customer migration, and
              production cutover evidence remain undisclosed.
            claimRefs:
              - CE002
              - CE010
              - CE012
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE007
              - CE011
      - number: '5.4'
        title: Trust, reliability, and technical diligence
        blocks:
          - type: paragraph
            body: >-
              The retained evidence does not establish independently measured uptime, incident history, audited security
              controls, privacy practices, custody design, business continuity, or execution-quality benchmarks.
              FintechMall explicitly recommends confirming the legal entity, custody model, regulatory perimeter, wallet
              controls, settlement exposure, reconciliation, and continuity arrangements. Those are selection questions
              rather than findings of deficiency, but they define the central technical diligence boundary for a
              provider that connects to many venues and may combine principal risk, execution, and managed services. The
              BlockFills integration adds technology and talent but also expands the operational surface that must be
              tested before treating product breadth as a defensible technology advantage.
            claimRefs:
              - CE007
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad service surface with multi-venue connectivity
            body: >-
              Keyrock combines market making, institutional execution, onchain services, and asset management, while
              official materials claim connectivity across more than 85 exchanges. That breadth is strategically useful
              but remains primarily company-described.
            calloutType: strength
            claimRefs:
              - CE002
              - CE004
              - CE011
          - type: callout
            title: Control evidence trails product breadth
            body: >-
              Public sources do not provide independent uptime, execution-quality, security, custody, continuity, or
              integration evidence sufficient to underwrite the operating stack.
            calloutType: risk
            claimRefs:
              - CE007
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying centers
        blocks:
          - type: paragraph
            body: >-
              The clearest supported segment is institutional digital-asset market participants. Scalable describes
              Keyrock's market making, OTC, and options execution as serving institutional clients, while Preqin
              identifies institutions, foundations, and other market participants and says the client footprint is
              strongest in the European Union, United Kingdom, and Switzerland while extending globally. A separate
              database broadens the apparent target set to private investors, crypto exchanges, digital-asset projects,
              DeFi protocols, and financial institutions. These are publisher-reported categories rather than disclosed
              revenue cohorts. A company-authored recruiting post also distinguishes institutional and crypto-native
              audiences, which is useful for mapping go-to-market positioning but does not prove either audience is
              paying, active, or retained. Buyer, user, payer, contract structure, and revenue contribution remain
              undisclosed for every segment.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
      - number: '6.2'
        title: Adoption signals versus customer proof
        blocks:
          - type: paragraph
            body: >-
              Public scale indicators describe operating reach rather than customer adoption. Keyrock says it is active
              across 85 centralized and decentralized venues and has a 220-person team operating across 37 countries;
              Scalable separately reports coverage of more than 1,400 markets. None of those denominators measures
              active customers, funded accounts, recurring contracts, transaction retention, or customer revenue.
              CoinDesk reported that the proposed BlockFills acquisition would provide access to an institutional
              network spanning hedge funds, asset managers, market makers, and mining companies. A lower-reputation
              secondary account put the predecessor network at approximately 2,000 institutional clients, but its
              transaction figures are internally inconsistent. That quantity is therefore a low-confidence predecessor
              metric, not a Keyrock customer count, and no retained source confirms post-acquisition migration,
              activation, or monetization.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU008
              - CU009
              - CU010
      - number: '6.3'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Expansion intent is visible, but durability is not. In March 2026 the chief executive said Keyrock planned
              to grow its services, client base, and geographic reach, and a current recruiting post seeks commercial
              impact across institutional and crypto-native audiences. Company-controlled LinkedIn content also
              identifies participation in the Open Standard network around OUSD, while ConnectSafely reports a Deutsche
              Bank partnership. These named relationships are ecosystem or partner signals, not verified production
              customers with attributable outcomes. Across the assigned evidence, no NRR, GRR, churn, renewal, contract
              length, cohort, top-customer share, or revenue-by-segment metric is disclosed. The resulting underwriting
              risk is material: acquisition-led access and partnership reach may enlarge the funnel, but without account
              migration, retention, and concentration data, neither land-and-expand durability nor dependency on a small
              number of counterparties can be tested.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU008
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer scale remains unverified
            body: >-
              Venue breadth, market coverage, followers, partners, and acquired relationships should not be treated as
              active customers. Underwriting requires account-level activation, retention, concentration, and revenue
              evidence.
            calloutType: risk
            claimRefs:
              - CU010
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The BlockFills transaction creates a concrete regulatory execution risk rather than a generic
              crypto-policy concern. June reporting described Keyrock as the successful bidder at $3.25 million while
              completion remained subject to court and regulatory approval; later sources described completion but
              continued to characterize the proposed UK authorization as approval-dependent. One low-reputation
              compliance article instead printed $325 million, a hundredfold conflict that should be resolved against
              the signed purchase agreement and sale order. The underwriting case should therefore treat license
              transfer, change-of-control consent, assumed-liability boundaries, and consideration as unverified until
              counsel reviews the primary records.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR009
      - number: '7.2'
        title: Operational, quality, and security exposure
        blocks:
          - type: paragraph
            body: >-
              Acquiring technology, client lists, liabilities, and a derivatives team from a failed counterparty creates
              migration, data, staffing, and control-integration work. The target entered Chapter 11 after reported
              losses and a large gap between liabilities and assets; that history does not establish a Keyrock failure,
              but it raises the standard for inherited exposure review. Keyrock also describes an automated, multi-venue
              model spanning 85 centralized and decentralized venues. No retained source provides uptime, incident,
              penetration-test, custody-segregation, or stress-test evidence, so operational severity can be framed but
              not calibrated from public data.
            claimRefs:
              - CR002
              - CR007
              - CR008
              - CR010
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR007
              - CR008
              - CR010
              - CR015
      - number: '7.3'
        title: Financial model and dependency exposure
        blocks:
          - type: paragraph
            body: >-
              Keyrock says its Series C proceeds will strengthen the balance sheet and fund acquisitions, which makes
              capital adequacy central to the risk case rather than merely a financing detail. Yet the retained Preqin
              preview shows no revenue series and says service pricing is not disclosed. The company also spans market
              making, asset management, OTC, and options, creating dependencies on venue access, counterparties,
              regulatory permissions, and investor capital. A 220-person team across 37 countries provides breadth, but
              public workforce indicators and a lean AI-augmented transformation mandate do not substitute for audited
              controls, exposure limits, or named owners of integration risk.
            claimRefs:
              - CR001
              - CR003
              - CR011
              - CR012
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR009
              - CR010
              - CR014
              - CR015
      - number: '7.4'
        title: Residual risk, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposures are regulatory approval, distressed-asset integration, and balance-sheet
              resilience because the purchase is approval-linked, the acquired operation emerged from bankruptcy, and
              Keyrock itself identifies balance-sheet strengthening as a use of new capital. Monitoring should focus on
              executed approval documents, migrated and active client relationships, inherited claims, venue and
              counterparty concentration, liquidity buffers, and severe-stress results. The investment case should pause
              if a material license transfer is denied, acquired clients or staff fail to migrate, inherited liabilities
              exceed agreed boundaries, or Keyrock cannot evidence liquidity and risk limits sufficient for a severe
              market shock.
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR010
              - CR013
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary-document gate
            body: >-
              Do not underwrite the acquisition or regulatory expansion from secondary summaries alone: require the
              final sale order, purchase agreement, license consents, liability schedules, and post-close integration
              reporting.
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR009
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision and price discipline
        blocks:
          - type: paragraph
            body: >-
              The public valuation marker is clear but the investment value is not. Two third-party reports place
              Keyrock at $1.1 billion following its March 2026 Series C, while Keyrock describes the transaction only as
              significant and a rolling close. None of the retained sources provides proceeds, share price, dilution,
              liquidation preferences, revenue, margin, retention, or customer concentration. Those omissions prevent a
              return model and make the headline valuation an observed financing signal rather than evidence of fair
              value. The recommendation is therefore research more, with high risk and a stretched, ununderwritten
              valuation stance. Entry should wait for primary transaction documents and audited operating data rather
              than rely on the round label or investor names.
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV010
              - CV013
              - CV014
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is breadth plus infrastructure: Keyrock markets market making, asset management,
              OTC, and options, and says its liquidity layer reaches more than 85 venues. Its financing announcement
              also points to a 220-person team operating across 37 countries. These signals support the possibility of
              cross-service distribution and institutional relevance, but they remain company-issued scale indicators
              rather than proof of earnings quality. The anti-thesis is that operational breadth can consume balance
              sheet and risk capital without producing attractive risk-adjusted returns. A company-managed LinkedIn page
              also simultaneously shows 223 visible employees and a 51-200 employee size band, illustrating why public
              operating indicators should not substitute for diligence-grade data.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV012
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
              - CV015
      - number: '8.3'
        title: Financing and transaction context
        blocks:
          - type: paragraph
            body: >-
              Keyrock says the Series C capital will strengthen its balance sheet, support service innovation, and fund
              acquisitions, but it does not quantify the allocation. Acquisition reporting adds a material verification
              problem. CoinDesk reported a proposed $3.25 million purchase of bankrupt BlockFills subject to court
              approval and cited liabilities of $100 million to $500 million against assets of $50 million to $100
              million. A later low-reputation compliance article instead reported a completed $325 million purchase. The
              hundredfold price conflict and different completion statuses cannot be reconciled from the assigned
              evidence, so neither number should enter a valuation model. Primary court orders, purchase agreements, and
              closing records are required.
            claimRefs:
              - CV003
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.4'
        title: Scenarios, exit, and final diligence
        blocks:
          - type: paragraph
            body: >-
              Scenario work can be directional but not numerical. A bull case requires audited evidence that
              multi-product breadth converts into durable revenue, attractive margins, repeat institutional demand, and
              controlled capital-at-risk. The base case is continued strategic relevance with an unproven return at the
              current private-market marker. The bear case combines multiple compression, weak unit economics, financing
              preference overhang, and acquisition integration or counterparty losses. EquityZen describes IPO, merger
              or acquisition, and eligible marketplace resale as possible private-share exits, but it gates
              Keyrock-specific deals, cap-table data, and financials. Exit readiness is therefore unverified. Final
              diligence must obtain the cap table, Series C documents, audited financials, risk-capital schedule,
              concentration data, and primary BlockFills transaction records before setting a price or target return.
            claimRefs:
              - CV007
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV010
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price before quality
            body: >-
              Do not convert the $1.1 billion financing marker into a buy decision until primary financing terms,
              audited economics, concentration, and capital-at-risk evidence support an entry price.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV007
              - CV013
              - CV014
