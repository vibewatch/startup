chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Keyrock was founded and incorporated in Brussels in 2017 and now presents itself as a digital-asset
              investment group spanning market making, OTC execution, options, asset management, and onchain liquidity.
              Its commercial model is primarily institutional: proprietary algorithms quote and manage liquidity across
              centralized and decentralized venues, while adjacent desks provide tailored execution and investment
              products. Public sources identify the Belgian parent as Keyrock SA and consistently place headquarters in
              Brussels. The latest official scale disclosure, dated March 2026, was 220 employees across 37 countries
              and entities in Belgium, the UK, Switzerland, France, and the US. Keyrock also claims activity across more
              than 85 venues and 1,400 markets; those are company-originated operating metrics rather than independently
              audited measures.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
              - CO010
              - CO013
              - CO014
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              The three co-founders remain in central executive roles: Kevin de Patoul as CEO, Jeremy de Groodt as CTO,
              and Juan David Mendieta as Chief Strategy Officer. Their disclosed backgrounds cover strategy consulting,
              secure banking-oriented software, and banking or central-bank analysis, which is a credible
              founder-market-fit combination for an institution-facing trading firm. The official leadership page adds
              experienced investment, operating, and commercial executives, including Eric Beckwith, Francesco
              Adiliberti, and Stef Wynendaele. A current company-issued marketing-role repost places a global rebrand
              mandate under the CCO, signaling an institutional repositioning. Governance visibility is materially
              weaker: the reviewed public sources do not establish board composition, committees, founder voting
              control, succession arrangements, or investor consent rights, so key-person and control risk remain open
              diligence items.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.3'
        title: Capital history and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Keyrock's March 31, 2026 announcement confirms a Series C led by SC Ventures, with continued Ripple
              participation, at a $1.1 billion valuation. It calls the financing a significant rolling close but does
              not disclose proceeds, pre-money valuation, security type, primary versus secondary mix, or investor
              rights. Earlier official milestones identify Volta Ventures in the seed round, SIX and MiddleGame Ventures
              in Series A, and Ripple, MiddleGame, and Volta in Series B. The Series A date is not cleanly reconciled:
              Keyrock's current timeline says 2021, while an independent company profile says October 2020.
              Consequently, neither an exact current total-raised figure nor precise cumulative dilution is supportable
              from this pool. The valuation is a verified financing marker, not evidence of cash available or operating
              performance.
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
      - number: '1.4'
        title: Milestones and underwriting limits
        blocks:
          - type: paragraph
            body: >-
              The operating arc shows deliberate broadening beyond core market making: algorithm iterations accompanied
              early financings, OTC and options desks opened in 2023, asset and wealth management followed the 2025
              Turing Capital acquisition, and Fija Finance expanded onchain reach in 2026. CoinDesk then reported a
              proposed $3.25 million acquisition of BlockFills' institutional business from Chapter 11, subject at that
              point to court approval. That transaction could add clients and capabilities, but acquiring assets from a
              bankrupt counterparty introduces integration, liability-selection, and continuity risks. More
              fundamentally, the reviewed evidence does not supply current revenue, revenue run rate, customer count,
              retention, or audited group profitability. Those omissions prevent a valuation-to-traction test and should
              remain explicit rather than being filled with database estimates or prior-report numbers.
            claimRefs:
              - CO014
              - CO015
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO010
              - CO011
              - CO012
              - CO015
              - CO016
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation is disclosed; financing economics are not
            body: >-
              The $1.1 billion Series C valuation is supported by Keyrock's announcement, but the amount raised,
              primary-versus-secondary mix, preferences, and current total raised remain undisclosed.
            calloutType: risk
            claimRefs:
              - CO010
              - CO013
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is narrower than all digital assets: it is the institutional liquidity and
              capital-markets infrastructure used to quote, execute, hedge, and manage tokenized assets across
              centralized and decentralized venues. Keyrock's disclosed scope spans market making, OTC execution,
              options, asset management, and adjacent treasury or onchain-liquidity workflows. Buyers can purchase these
              functions from a full-service provider, combine specialist desks, transact directly on exchanges and
              protocols, or maintain internal trading and treasury capabilities. General crypto ownership, retail
              brokerage, custody-only spend, and blockchain software unrelated to liquidity are outside this boundary.
              This definition avoids treating broad token-market value as addressable revenue and focuses instead on the
              budgets and workflows Keyrock can plausibly serve.
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
              - CM014
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The retained evidence does not disclose a comparable sector revenue pool, fee-rate denominator, or company
              service-line revenue from which to calculate TAM, SAM, or SOM. Operational proxies therefore provide the
              only defensible sizing lens. Keyrock reported activity across 85 venues, a 220-person team, and operations
              across 37 countries in March 2026; independent reporting separately described more than 80 venues and more
              than 200 staff. Preqin's older or undated profile described more than 170 experts across 36 countries,
              suggesting expansion but not a clean time series. Tracxn's competitor universe and disclosed funding
              totals show a funded, fragmented supplier set, yet capital raised is neither market revenue nor customer
              spend. These proxies indicate reach and competitive investment, not a valuation-grade market-size
              estimate.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM006
              - CM012
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM011
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to several buyer groups rather than one uniform customer. CoinDesk identified hedge
              funds, asset managers, market makers, and mining companies in the BlockFills institutional network Keyrock
              sought to acquire. Preqin describes institutions, foundations, and other market participants using
              tailored quotes and partnership arrangements, while Keyrock's recruiting language explicitly targets
              institutional and crypto-native audiences. Exchanges, protocols, and token issuers buy liquidity depth;
              allocators and trading firms buy execution, hedging, and access; foundations and treasury teams buy market
              quality and risk-management support. Adoption typically moves from counterparty and regulatory approval
              through a limited mandate to broader products and venues. Budget ownership likely sits with trading,
              treasury, markets, or product teams, but contract economics and decision rights remain private.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.4'
        title: Growth drivers, constraints, and valuation implications
        blocks:
          - type: paragraph
            body: >-
              The primary demand driver is convergence between traditional finance and tokenized markets: SC Ventures
              described sophisticated liquidity infrastructure as foundational, and Keyrock is positioning for both
              institutional allocators and crypto-native operators. Onchain payment and stablecoin ecosystems create
              adjacent liquidity needs, illustrated by Keyrock's stated participation in the OUSD network. Constraints
              are equally material. Licenses and regulatory approvals determine where services can be offered; capital
              and counterparty limits constrain inventory-intensive market making; switching requires legal,
              operational, and risk approval; and buyer trust can deteriorate quickly when a provider fails. BlockFills
              entered Chapter 11 with reported liabilities exceeding assets, creating acquisition opportunity but also
              integration and risk-transfer questions. The reported purchase price differs by two orders of magnitude
              across retained sources, so neither the transaction nor broad market growth should be used in valuation
              without primary documents.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: No defensible public TAM
            body: >-
              The available sources measure venues, staffing, competitor funding, and buyer categories, not comparable
              annual customer spend; a currency TAM/SAM/SOM would be false precision.
            calloutType: risk
            claimRefs:
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: A crowded market with broader alternatives than direct peers
        blocks:
          - type: paragraph
            body: >-
              The direct peer set is substantial rather than concentrated around one obvious rival. Tracxn identifies
              129 active competitors, including 31 funded companies, and names Wintermute, Flowdesk, and B2C2 as
              Keyrock's top competitors. That taxonomy captures the closest algorithmic market-making and liquidity
              providers, but a buyer's actual choice set is wider: it can multi-source liquidity providers, use
              exchange-native liquidity, retain an incumbent OTC or prime-services relationship, or build selected
              trading and treasury capabilities internally. Those alternatives compete differently. Direct peers compete
              on execution, capital, coverage, and service breadth; internal build and status quo compete by avoiding
              vendor dependence even when they impose staffing, technology, and balance-sheet costs that the retained
              public evidence does not quantify.
            claimRefs:
              - CP001
              - CP002
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
              - CP011
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
      - number: '3.2'
        title: Breadth and infrastructure are the visible differentiation
        blocks:
          - type: paragraph
            body: >-
              Keyrock's clearest documented differentiation is breadth rather than a publicly proven execution
              advantage. Company-issued materials span market making, asset management, OTC, options, high-frequency
              trading, and DeFi desks, while the March 2026 company announcement reports activity across 85 centralized
              and decentralized venues. A company-issued job repost also describes a low-latency, mission-critical
              trading stack built around Rust, AWS, exchange connectivity, and market-data handling. This combination
              can reduce integration friction for institutions seeking one counterparty across multiple workflows. It is
              not evidence that Keyrock delivers tighter spreads, lower slippage, better uptime, or superior
              risk-adjusted returns than peers; no independent benchmark in the assigned evidence tests those outcomes.
              Onchain asset-management growth also creates adjacent protocol competitors rather than only expanding
              Keyrock's addressable opportunity.
            claimRefs:
              - CP005
              - CP007
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP007
              - CP009
              - CP010
              - CP013
              - CP014
              - CP015
      - number: '3.3'
        title: Distribution scale is visible; pricing power is not
        blocks:
          - type: paragraph
            body: >-
              Public indicators suggest meaningful operating scale. Keyrock reports 85 venues, and current sources place
              the team at roughly 220 to 225 people. International Finance separately reported 85 exchanges and 400
              financial markets in 2024, while the company-issued role repost says more than 80 exchanges. The planned
              BlockFills transaction could add an institutional network spanning hedge funds, asset managers, market
              makers, and mining companies, subject to completion and integration. These are distribution signals, not
              proof of retention or pricing power. None of the retained sources discloses customer spreads, minimum
              commitments, rebates, realized fees, contract duration, wallet share, or renewal behavior. Therefore the
              pricing comparison remains an evidence map of known service models and explicit unknowns, not a claim that
              Keyrock is cheaper or more expensive than peers.
            claimRefs:
              - CP005
              - CP006
              - CP011
              - CP013
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP016
      - number: '3.4'
        title: The moat depends on capital, trust, and integration execution
        blocks:
          - type: paragraph
            body: >-
              Keyrock's March 2026 Series C announcement valued the company at $1.1 billion and framed the capital as
              support for balance-sheet strength, service innovation, and acquisitions. That strategy can compound venue
              coverage, licenses, talent, and client access, but the BlockFills context also illustrates sector
              fragility: CoinDesk reported that the target entered Chapter 11 with liabilities of $100 million to $500
              million against assets of $50 million to $100 million. A separate low-reputation industry compilation
              argues that regulatory infrastructure is becoming a competitive axis alongside quote quality; that
              directional thesis is plausible but not an independent benchmark of Keyrock's posture. The defensible moat
              is therefore not the service list itself. It must be demonstrated through execution quality, resilient
              controls, durable counterparty trust, and successful integration, none of which is quantified in the
              assigned public evidence.
            claimRefs:
              - CP008
              - CP011
              - CP012
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is not pricing power
            body: >-
              Venue count and headcount show operating reach, but no retained evidence quantifies realized spreads,
              fees, renewal behavior, or customer wallet share.
            calloutType: risk
            claimRefs:
              - CP005
              - CP006
              - CP016
          - type: callout
            title: Distressed consolidation can accelerate distribution
            body: >-
              The BlockFills transaction may add institutional relationships and capabilities, while the target's
              bankruptcy makes integration, liabilities, and client retention central diligence questions rather than
              automatic sources of value.
            calloutType: insight
            claimRefs:
              - CP011
              - CP012
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture is broad, but realized monetization is opaque
        blocks:
          - type: paragraph
            body: >
              Keyrock presents a diversified capital-markets model spanning market making, OTC execution, options, and
              asset management rather than a single recurring software product. Its official market-making material
              describes continuous algorithmic pricing, liquidity aggregation across more than 85 exchanges, and
              performance reporting; third-party descriptions add spread capture, trading-volume fees, and
              assets-under-management fees as plausible monetization mechanisms. Those mechanisms are directionally
              credible but do not establish contract terms, realized take rates, principal-versus-agent accounting, or
              revenue recognition. The reviewed official product page publishes no numeric customer price, so list
              pricing cannot be used as a proxy for revenue or margin. The bridge therefore stops at gross revenue:
              public evidence does not quantify rebates, hedging costs, inventory losses, venue fees, financing expense,
              or compensation needed to derive gross profit.
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI003
              - CI005
              - CI006
              - CI009
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI006
              - CI007
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI013
      - number: '4.2'
        title: Scale indicators are visible; consolidated economics are not
        blocks:
          - type: paragraph
            body: >
              Keyrock and an independent profile both point to meaningful operating breadth: 85 venues, a 220-person
              team, and operations across 37 countries. Hiring evidence also shows an expensive, specialized cost base.
              A New York marketing leadership role advertised a $175,000-$220,000 base range plus variable compensation,
              while an options-engineering lead was expected to manage roughly seven engineers supporting automated
              quoting, execution, pricing, risk controls, and production reliability. These are cost and complexity
              proxies, not CAC, payback, productivity, or total payroll estimates. A low-tier company-data profile
              reports EUR31.2 million of 2024 turnover and an EUR11.4 million net loss for Belgian parent KEYROCK SA,
              but those entity-level accounting figures cannot be treated as current group revenue, ARR, cash burn, or
              consolidated profitability.
            claimRefs:
              - CI002
              - CI008
              - CI009
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.3'
        title: Fresh capital and acquisition appetite increase the balance-sheet diligence burden
        blocks:
          - type: paragraph
            body: >
              The March 2026 Series C valued Keyrock at $1.1 billion and was described by the company as significant,
              but the announcement did not disclose proceeds and said the round was a rolling close. Management
              identified balance-sheet strengthening, service innovation, and acquisitions as uses of funds; funding
              raised therefore cannot be equated with cash available. Capital adequacy is further complicated by the
              BlockFills transaction. CoinDesk reported a $3.25 million proposed purchase of assets from a bankrupt
              counterparty that had disclosed $100 million-$500 million of liabilities against $50 million-$100 million
              of assets. The purchase price is not a measure of assumed obligations, integration cost, regulatory
              capital, or contingent exposure. Underwriting requires the executed purchase agreement, liability
              schedule, post-close liquidity buffer, and stress losses by desk.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI015
              - CI016
      - number: '4.4'
        title: 'Financial verdict: attractive breadth, insufficient underwriting evidence'
        blocks:
          - type: paragraph
            body: >
              The public record supports service breadth, institutional infrastructure, acquisition-led expansion, and a
              sizable technical organization. It does not support a reliable assessment of revenue quality, customer
              concentration, trading-capital intensity, gross margin, or runway. Revenue may combine agency fees,
              bid-ask spread, principal trading, and asset-management economics with materially different volatility and
              capital requirements; reporting them as one undifferentiated total would obscure risk. The parent-company
              turnover and loss figures are useful boundary markers but are dated, secondary, and not consolidated. The
              investment case should remain gated on audited 2025 and year-to-date 2026 group financials, desk-level
              revenue and gross profit, cash and encumbered capital, counterparty exposures, and a reconciliation of
              acquisition obligations. Until those arrive, valuation should not be justified with ARR or SaaS-style
              multiples.
            claimRefs:
              - CI001
              - CI005
              - CI007
              - CI011
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not equate the Series C with runway
            body: >-
              The company disclosed a $1.1 billion valuation and intended uses but not round proceeds, current cash,
              burn, encumbered trading capital, debt, or regulatory-capital requirements.
            calloutType: risk
            claimRefs:
              - CI010
              - CI011
              - CI012
          - type: callout
            title: Make consolidated financial disclosure a gating item
            body: >-
              Require audited group accounts and desk-level economics before applying revenue, earnings, or SaaS-style
              valuation multiples.
            calloutType: recommendation
            claimRefs:
              - CI007
              - CI011
              - CI013
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Keyrock's public product is not a single software SKU. It is a managed capital-markets service set
              spanning algorithmic market making, OTC and options execution, asset management, and onchain liquidity.
              The official funding release confirms that service breadth, while independent profiles add treasury,
              validator, ecosystem-development, and API delivery descriptions that should be treated as
              directory-reported rather than as audited product specifications. In workflow terms, token issuers and
              venues buy liquidity and market-quality support, while institutions use execution desks and
              managed-investment services. This breadth can increase account share, but public materials do not disclose
              service-level terms, realized execution improvements, or which legal entity delivers each module.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE009
              - CE011
