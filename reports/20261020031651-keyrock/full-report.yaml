      - number: '5.2'
        title: Operating architecture and delivery model
        blocks:
          - type: paragraph
            body: >-
              The evidence supports an architecture centered on multi-venue market data, proprietary quantitative logic,
              automated quoting, and execution across centralized and decentralized markets. Keyrock says it aggregates
              liquidity and price data from more than 85 exchanges into a unified trading layer, provides continuous
              algorithmic pricing, and adjusts markets in real time. Directory evidence describes an institutional API
              and proprietary quantitative infrastructure, but no retained source exposes API documentation, system
              topology, custody boundaries, latency, capacity, or failover design. The architecture map therefore
              distinguishes disclosed operating functions from inferred interfaces and does not represent a verified
              technical implementation.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE008
