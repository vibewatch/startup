- id: milestones-and-product-launch
  title: Milestones and product launch
  body: 'River''s milestone arc is compressed enough to be part of the investment thesis. In public, the company moved from April incorporation to a June emergence from stealth and then to an August mega-round while presenting a preview API as already live. The launch materials also bridge the current product to a much larger ambition: a personalization layer, personal hardware, and eventually full-stack personal AI agents owned by individuals. That makes the timeline impressive but also aggressive. The current evidence supports a working infrastructure product, clear open-weight positioning, and strong investor sponsorship.     It does not support confidence that the outer roadmap has team, governance, customer, or capital-allocation discipline behind it yet. The company is therefore best understood as an unusually well-funded infrastructure startup with one visible product and a long-range vision that extends far beyond what public evidence can independently verify as of this research
    date.

    '
