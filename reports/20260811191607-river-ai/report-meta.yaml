  topStrengths:
  - Exceptional founder pedigree spanning DeepMind, OpenAI, and xAI.
  - Strategic investor endorsement from NVIDIA and AMD Ventures signals hardware alignment.
  - Token-metered pricing removes idle GPU cost for customers and gives River a concrete wedge.
  - General Catalyst framed the financing around American resilience and open-stack infrastructure.
  - A $1.1B war chest gives River time to recruit talent and secure compute while proving the product.
  topRisks:
  - Company is four months old with no disclosed revenue, customers, or independent validation of speed and cost claims.
  - The market is highly competitive across closed-model APIs, open-weight platforms, and raw infrastructure vendors.
  - Valuation expectations may already be stretched despite missing operating proof.
  - Public governance and team-depth disclosure are extremely limited, increasing key-person risk.
  - River depends on continued availability and commercial usability of third-party open-weight model families.
  unresolvedGaps:
  - No disclosed transaction valuation despite a $1.1B financing headline.
  - Headcount, leadership bench, and governance structure remain largely undisclosed.
  - No revenue, customer count, or usage metrics are public.
  - Independent benchmark validation of the 15–20 minute RL run claim is unavailable.
  - Roadmap timing for personalization, hardware, and agents is still high level only.
