chapter:
  number: 6
  title: Customers
  summary: River's current GTM evidence supports an early developer-first motion with clear product legibility but very limited customer proof. The likely path is self-serve evaluation into technical pilot, not yet broad enterprise rollout.
sections:
- id: target-customers
  title: Target customers
  body: |
    River's public materials imply a customer profile before they prove one. The most obvious fit is technical buyers who want custom model behavior but do not want to build or maintain dedicated training infrastructure themselves. That includes AI-native startups, applied AI teams inside larger enterprises, and platform engineering groups that care about checkpoint ownership and deployment portability. The product is unlikely to appeal first to generalist business users because the workflow still assumes model choice, training logic, and evaluation discipline. It is more plausible as a tool for teams already serious about building proprietary AI behavior. This makes the target customer logic coherent even though the customer proof is sparse. The company knows who should care; it has not yet shown publicly which of those buyers are already adopting in production.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU007
  - CU008
  - CU009
  - CU022
  - CU030
  - CU034
  - CU035
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: go-to-market-strategy
  title: Go-to-market strategy
  body: |
    The visible motion is product-led at the top of funnel and founder-led in market education. River has public docs, a published rate card, an SDK package, and a familiar deployment surface, all of which lower initial evaluation friction. That is a smart way to enter a technical market quickly. The limitation is that self-serve motion only gets a company so far when the product touches training, model governance, and enterprise data. Eventually River will need stronger proof, onboarding discipline, and trust artifacts to move beyond technically curious evaluators. The current motion should therefore be seen as a wedge, not as a fully developed go-to-market engine. It is good enough to create conversations and pilot interest, but not yet enough to prove repeatable enterprise scaling.
  claimRefs:
