  - FU002
- id: developer-adoption-signals
  title: Developer adoption signals
  body: |
    The strongest public adoption signals today are developer-oriented rather than customer-oriented. River exposes docs, an SDK, visible pricing, and a Discord channel, which together create an evaluable surface for technical users. Those are useful signals because they show the company is not operating as a pure concept. They are not the same thing as traction. Public evidence does not show package-download scale, active community size, case-study depth, or named customer success. That distinction matters because the company can be highly legible to developers while still being commercially unproven. The product clearly exists and can be tried. What the chapter cannot yet establish is how much of that interest turns into durable usage, deployed endpoints, or account expansion.
  claimRefs:
  - CU004
  - CU005
  - CU010
  - CU012
  - CU013
  - CU018
  - CU019
