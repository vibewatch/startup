  - FU003
- id: enterprise-path
  title: Enterprise path
  body: The most plausible enterprise motion is a staircase. A developer or applied AI lead tests River through the public tooling, a team runs a pilot on a real workflow, checkpoints persist if the outcome is good, and then deployment plus storage create the first recurring revenue layer. That path is logical because it matches the product design. It also has real failure points. The absence of reference customers slows procurement, preview-stage tooling can require unusually high support, and security or compliance gaps can block later-stage rollout. The question is not whether River can attract attention; the funding announcement already does that. The question is whether River can convert that attention into production trust quickly enough to build a repeatable account engine before competitors with more proof blunt the wedge. That is why the next refresh should prioritize proof of paying production customers, conversion metrics, and procurement-grade trust materials instead of additional
