chapter:
  number: 4
  title: Financials
  summary: River's financial profile is defined by extraordinary capital access and very weak public operating disclosure. The monetization model is visible, but burn, revenue, margins, and financing mechanics remain mostly unknown.
sections:
- id: funding-and-capital-structure
  title: Funding and capital structure
  body: |
    Financial analysis of River starts with a paradox: the company has one of the clearest funding headlines in the dataset and one of the thinnest capital-structure disclosures. Public materials confirm a $1.1 billion combined Seed and Series A, which is extraordinary for a company whose product is still in preview. Yet those same materials do not disclose the transaction price, ownership split, board rights, debt, or any other financing mechanics. That means capital adequacy is visible, but dilution, governance consequences, and investor control are not. Investors can still say something useful: River has enough capital to buy time, hire aggressively, and secure infrastructure. But because round mechanics are undisclosed, the financing can only be analyzed as a capacity signal, not as a clean cap-table fact pattern. The financing therefore removes one risk while amplifying another: expectations become very high before operating proof becomes public.
  claimRefs:
  - CI001
  - CI002
  - CI006
  - CI012
  - CI013
  - CI021
  - CI022
  - CI029
  - CI030
  - CI033
