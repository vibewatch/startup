- id: burn-rate-discussion
  title: Burn rate discussion
  body: |
    The cost side has to be inferred from River's product and investor set rather than read from reported numbers. A company selling training and RL workflows on frontier open-weight models will almost certainly spend heavily on compute, model hosting, and performance engineering. The strategic presence of NVIDIA and AMD Ventures hints at why those relationships matter. Hardware access and cost discipline are likely central to whether River can translate impressive top-line narratives into sane unit economics. At the same time, research talent, developer support, and infrastructure operations are unlikely to be cheap. This means River can be well capitalized and still financially fragile if margins on real workloads disappoint. In the absence of burn data, the best financial interpretation is not that River is safe; it is that River has more room than most startups to discover whether its pricing sheet maps onto a scalable economic engine.
  claimRefs:
  - CI010
  - CI011
  - CI014
  - CI015
  - CI021
  - CI023
  - CI024
  - CI025
  - CI028
  - CI029
  - CI035
