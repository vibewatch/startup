  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: burn-rate
    missingEvidence: No public cash-burn, headcount-cost, or compute-spend disclosure exists.
    whyItMatters: Runway and capital-efficiency analysis cannot be completed without internal data.
    diligencePath: Request board materials or management KPIs showing monthly burn and cash balance.
    relatedQuestionRefs:
    - QI022
  - type: private-evidence-only
    severity: blocking
    topic: revenue-conversion
    missingEvidence: No usage, revenue, or deployed-workload conversion data is public.
    whyItMatters: The core question is whether preview activity is becoming durable commercial usage.
    diligencePath: Request cohort-level revenue and usage conversion metrics.
    relatedQuestionRefs:
    - QI023
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: No public benchmark shows cost per training job, blended gross margin, or support cost per account.
    whyItMatters: High infrastructure intensity can erode an apparently attractive pricing sheet.
    diligencePath: Request representative job P&Ls or customer-specific cost curves.
    relatedQuestionRefs:
    - QI024
  - type: missing-source
    severity: material
    topic: capital-quality
    missingEvidence: Commercial or supply benefits tied to strategic investors are not disclosed.
    whyItMatters: Strategic capital may matter more than its dollar amount if it secures scarce hardware or channels.
    diligencePath: Ask management to distinguish capital-only investors from strategic operating partners.
    relatedQuestionRefs:
    - QI025
