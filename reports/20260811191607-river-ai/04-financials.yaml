  - TI003
  figureRefs:
  - FI002
- id: financial-gaps
  title: Financial gaps
  body: 'The chapter therefore carries unusually large evidence gaps. There is no public revenue line, no ARR, no margin data, no burn, no runway model beyond the round size itself, and no evidence of enterprise committed-spend contracts. River looks financially powerful from the outside because the financing number is so large. But that can be misleading for an infrastructure company whose commercial proof, support burden, and compute cost profile are still hidden. In practice, the first real diligence questions are operational: how many accounts are paying, what types of workloads repeat, what does a representative training job cost to serve, and how quickly does a tuned checkpoint turn into deployed inference. Until those answers are available, the chapter treats River''s finances as a combination of strong access to capital and very low visibility into operating efficiency. Until River discloses actual operating metrics or board-grade financial reporting, the financing number should
    be treated as capacity evidence, not as proof of business quality. Until River discloses actual operating metrics or board-grade financial reporting, the financing number should be treated as capacity evidence, not as proof of business quality.'
