- id: valuation-stance
  title: Valuation stance
  body: The current stance is deliberately cautious. River is clearly interesting, clearly well funded, and clearly backed by people who can attract elite capital. None of those facts resolves whether today's private-market entry price is attractive for a new investor or whether the company has already pulled too much future success into the financing story. The bull case is visible, the bear case is also visible, and the missing data disproportionately affects the answer. That pushes the right public stance toward “track” with low confidence rather than toward aggressive conviction. If River shows production customer proof, benchmark credibility, and even limited operating disclosure, the valuation debate could improve quickly. Until then, the company should be treated as a premium optionality story with wide range bounds and high reset risk. For now, the only intellectually honest public stance is to keep the range wide and focus on the few upcoming disclosures that could collapse it meaningfully.
