- id: comparables
  title: Comparables
  body: 'The right comparables for River are not perfect because the company sits between frontier-founder financings and infrastructure platforms. Safe Superintelligence and Reflection AI show what founder premium can look like in hot AI markets, but River''s current product is more concrete and more infrastructure-specific than some founder-led research narratives. On the other hand, conventional infrastructure comps understate the founder and policy optionality investors may be buying. The most honest comparable set therefore needs more than one lens. One lens captures founder quality and financing environment. Another captures infrastructure intensity and the need for customer proof. Until River discloses actual operating metrics, both lenses need to remain in play. That is why the chapter treats comparables as a bracket, not as a decisive answer.

    '
