  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: valuation-gap
    missingEvidence: The actual transaction price and ownership implications of the financing are not public.
    whyItMatters: No valuation stance can be high confidence without an actual deal-price anchor.
    diligencePath: Request cap-table mechanics or investor-side deal terms.
    relatedQuestionRefs:
    - QV022
  - type: missing-source
    severity: material
    topic: founder-premium
    missingEvidence: Public data cannot cleanly separate River's founder premium from any early operating proof priced into the round.
    whyItMatters: This distinction drives whether upside remains or expectations are already overbaked.
    diligencePath: Compare internal operating metrics to financing narrative used with investors.
    relatedQuestionRefs:
    - QV023
  - type: missing-source
    severity: material
    topic: downside-sensitivity
    missingEvidence: No public scenario analysis links slower benchmark or customer proof to financing-round downside.
    whyItMatters: Optionality stories can reprice sharply if proof arrives late.
    diligencePath: Model revenue-delay sensitivity and compare to peer resets.
    relatedQuestionRefs:
    - QV024
  - type: missing-source
    severity: material
    topic: comparable-set
    missingEvidence: Public comparables can justify multiple lenses, from frontier-founder labs to infrastructure platforms.
    whyItMatters: Comparable selection heavily influences scenario framing.
    diligencePath: Define a disciplined comp set once actual deal price and traction metrics are known.
    relatedQuestionRefs:
    - QV025
    relatedTableRefs:
    - TV004
