evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital-structure-gap
    missingEvidence: Cap table, ownership percentages, and liquidation preference details for the Seed and Series A remain private.
    whyItMatters: Without financing mechanics, investor influence and founder dilution cannot be assessed.
    diligencePath: Request financing documents or management-provided capitalization tables.
    relatedQuestionRefs:
      - QO022
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: No headcount, team-size, or hiring-distribution disclosure is public.
    whyItMatters: Execution capacity and burn-rate planning depend on team size and composition.
    diligencePath: Request a current org chart and hiring plan.
    relatedQuestionRefs:
      - QO023
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Board membership, observer rights, and formal governance committees were not disclosed.
    whyItMatters: Governance clarity affects control, oversight, and key-person-risk mitigation.
    diligencePath: Request board list, voting agreements, and governance policies.
    relatedQuestionRefs:
      - QO024
  - type: enumeration-incomplete
    severity: material
    topic: leadership and founder table
    missingEvidence: Launch materials mention a team from xAI and Tesla but do not publicly name the rest of the founding bench.
    whyItMatters: Founder-market fit and functional coverage cannot be fully assessed with only one named executive.
    diligencePath: Request a full leadership roster with prior roles and join dates.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: tam
    missingEvidence: No high-quality public market model isolates open-weight fine-tuning cloud spend as of the run date.
    whyItMatters: Sizing conclusions remain directional and low confidence without a tighter denominator.
    diligencePath: Build a bottoms-up market model from disclosed customer counts, workload mix, and pricing across direct vendors.
    relatedQuestionRefs:
      - QM022
  - type: missing-source
    severity: material
    topic: adoption-constraint
    missingEvidence: Public data on regulated-industry production adoption of open-weight training platforms is sparse.
    whyItMatters: Procurement velocity is a major determinant of River's go-to-market timing.
    diligencePath: Interview enterprise buyers or collect case studies from direct competitors.
    relatedQuestionRefs:
      - QM023
  - type: conflicting-data
    severity: material
    topic: licensing
    missingEvidence: Commercial licensing and acceptable-use constraints differ across upstream model providers and evolve quickly.
    whyItMatters: River's obtainable market depends on what workloads can actually be deployed commercially.
    diligencePath: Map provider-specific licenses and product restrictions by model family.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: material
    topic: buyer-priority
    missingEvidence: No public survey ranks willingness to pay for RL and LoRA workflow acceleration by River's target segment.
    whyItMatters: Without segment economics, even a reasonable TAM lens cannot translate into a likely share model.
    diligencePath: Interview AI platform teams and compare pilot budgets across verticals.
    relatedQuestionRefs:
      - QM025
  - type: missing-source
    severity: material
    topic: competitive-ranking
    missingEvidence: No neutral public market-share or usage dataset ranks vendors for enterprise RL and LoRA production workloads.
    whyItMatters: The strongest competitor may differ from the most visible one.
    diligencePath: Interview buyers and triangulate from customer references across direct rivals.
    relatedQuestionRefs:
      - QP022
  - type: missing-source
    severity: material
    topic: benchmark-gap
    missingEvidence: Public benchmark data comparing River against Together, Predibase, Fireworks, or OpenAI is absent.
    whyItMatters: River's differentiation claim is still unverified.
    diligencePath: Run controlled benchmarks or request customer benchmark decks.
    relatedQuestionRefs:
      - QP023
  - type: missing-source
    severity: material
    topic: distribution-advantage
    missingEvidence: Competitor customer counts, win rates, and expansion data are not directly comparable in public.
    whyItMatters: Without proof, it is difficult to separate technical advantage from go-to-market maturity.
    diligencePath: Collect customer proof and case studies by competitor.
    relatedQuestionRefs:
      - QP024
  - type: missing-source
    severity: material
    topic: feature-cloning
    missingEvidence: >-
      No public evidence shows how long River's RL and ownership wedge would remain unique after broader market
      response.
    whyItMatters: Moat durability is a core valuation input.
    diligencePath: Monitor competitor roadmaps and ask management for defensibility evidence.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: blocking
    topic: burn-rate
    missingEvidence: No public cash-burn, headcount-cost, or compute-spend disclosure exists.
    whyItMatters: Runway and capital-efficiency analysis cannot be completed without internal data.
    diligencePath: Request board materials or management KPIs showing monthly burn and cash balance.
    relatedQuestionRefs:
      - QI022
  - type: private-evidence-only
    severity: blocking
    topic: revenue-conversion
