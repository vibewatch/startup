- id: closed-model-fine-tuning-competition
  title: Closed-model fine-tuning competition
  body: |
    OpenAI remains the most important indirect benchmark because it defines the simplest closed-model path for many enterprise buyers. River is effectively asking customers to accept more model-choice complexity in exchange for ownership, portability, and potentially lower cost. That is a reasonable trade if the buyer already knows it wants open weights, but it is not automatically the winning trade for every enterprise. Closed-model platforms remove some upstream model-selection burden and often carry stronger perceived reliability. River therefore does not just compete with open-weight infrastructure vendors; it also competes against the appeal of simplicity. In practical terms, River must show that speed, checkpoint portability, and workflow control can compensate for the extra decision-making buyers face when they choose an open-model training path over a closed-model API.
  claimRefs:
  - CP001
  - CP010
  - CP011
  - CP012
  - CP013
  - CP015
