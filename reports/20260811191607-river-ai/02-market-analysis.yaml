- id: policy-landscape
  title: Policy landscape
  body: |
    Policy is not just background noise for River; it is part of the market narrative. The July 2026 open-weights letter gave River and similar vendors a useful talking point by framing open models as a competitiveness and resilience issue. At the same time, the missing signatories were as informative as the signatories themselves. OpenAI, Anthropic, and Google were not reported as supporters of that letter, which means the industry still has no unified consensus on how open-weight access should be governed. For River, that creates a mixed market environment. Some enterprises may view open weights as strategically attractive because they want ownership and supplier diversity. Others will worry about safety, licensing, and procurement risk. River therefore benefits from the direction of the policy conversation without being able to treat it as settled law or universal buyer consensus.
  claimRefs:
  - CM005
  - CM006
  - CM018
  - CM024
  - CM025
