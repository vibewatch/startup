  evidenceGaps:
  - type: missing-source
    severity: material
    topic: tam
    missingEvidence: No high-quality public market model isolates open-weight fine-tuning cloud spend as of the run date.
    whyItMatters: Sizing conclusions remain directional and low confidence without a tighter denominator.
    diligencePath: Build a bottoms-up market model from disclosed customer counts, workload mix, and pricing across direct vendors.
    relatedQuestionRefs:
    - QM022
  - type: missing-source
    severity: material
    topic: adoption-constraint
    missingEvidence: Public data on regulated-industry production adoption of open-weight training platforms is sparse.
    whyItMatters: Procurement velocity is a major determinant of River's go-to-market timing.
    diligencePath: Interview enterprise buyers or collect case studies from direct competitors.
    relatedQuestionRefs:
    - QM023
  - type: conflicting-data
    severity: material
    topic: licensing
    missingEvidence: Commercial licensing and acceptable-use constraints differ across upstream model providers and evolve quickly.
    whyItMatters: River's obtainable market depends on what workloads can actually be deployed commercially.
    diligencePath: Map provider-specific licenses and product restrictions by model family.
    relatedQuestionRefs:
    - QM024
  - type: missing-source
    severity: material
    topic: buyer-priority
    missingEvidence: No public survey ranks willingness to pay for RL and LoRA workflow acceleration by River's target segment.
    whyItMatters: Without segment economics, even a reasonable TAM lens cannot translate into a likely share model.
    diligencePath: Interview AI platform teams and compare pilot budgets across verticals.
    relatedQuestionRefs:
    - QM025
