- id: addressable-market-sizing
  title: Addressable market sizing
  body: Any market-size estimate for River should be treated as a lens, not as a fact. The cleanest approach is to separate the broad enterprise spend on custom model infrastructure from the narrower subset that specifically wants open-weight fine-tuning, then narrow again to the share that values fast token-metered RL and LoRA workflows. On that basis, a single-digit-billion TAM lens, a multi-billion SAM lens, and a low-hundreds-of-millions near-term obtainable share are directionally reasonable. Those numbers are intentionally conservative because public evidence does not yet show how many enterprises will pay for these workflows at scale, or how fast open-weight procurement will convert from experimentation into production. River's near-term opportunity is therefore more about wedge depth and execution than about proving an exact top-down market number on day one. The market therefore deserves a thesis-led range view rather than false precision from headline-sized top-down estimates alone.
