companyProfile:
  summary: >
    River AI 是一家位于 Palo Alto 的全栈 AI 公司，Igor Babuschkin 于 2026 年 4 月创立；他是 xAI 联合创始人、前首席工程师，也曾在 Google DeepMind 和 OpenAI
    做研究。公司近期产品是一套按 token 计费的 API，用于在前沿开放权重大语言模型上做 LoRA 微调和强化学习，让企业不用专门搭建基础设施团队，也能训练、调优并拥有自己的定制 AI 模型。River 的长期愿景是重建整条 AI
    栈——从训练基础设施，到个性化层，再到个人硬件——让 AI agent 由个人拥有，而不是向大型实验室租用。2026 年 8 月 11 日，River 在注册成立四个月后宣布完成 $1.1B 的 Seed 与 Series A
    合计融资，由 General Catalyst 和 AMP PBC 领投，NVIDIA 和 AMD Ventures 战略入股。
