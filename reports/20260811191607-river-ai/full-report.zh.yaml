  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 企业 AI 微调市场
        blocks:
          - type: paragraph
            body: >
              River 进入的是 AI 栈里企业不再租用通用模型行为、开始针对自有数据、工作流和政策优化模型的那一层。这个市场有吸引力，因为许多团队现在想要的不止是 prompt
              engineering；但它仍然早，边界也模糊。微调基础设施与模型托管、推理工具、GPU 云和 MLOps 平台相互重叠。River 的切口比整个品类窄：它专注于开放权重模型上的快速 LoRA
              和强化学习后训练，并尽量压低买方的基础设施负担。市场信号真实存在，因为越来越多企业 AI 团队想要控制权和可迁移性；但证据仍是方向性的，还不成熟。因此，River
              享受强主题顺风，却仍处在一个买方预算、采购周期和长期品类定义都未稳定的赛道。
