            body: >-
              任何针对 River 的市场规模估计，都应该当成视角，而不是事实。最干净的做法是先拆出企业在定制模型基础设施上的广义支出，再缩到明确想要开放权重微调的子集，最后再缩到重视按 token 计费的快速 RL 和
              LoRA 工作流的那部分。按这个口径，个位数十亿美元的 TAM、多十亿美元的
              SAM，以及近期低数亿美元级别的可获得份额，在方向上合理。这些数字有意保守，因为公开证据还没证明有多少企业会大规模为这些工作流付费，也没证明开放权重采购会以多快速度从实验转向生产。因此，River
