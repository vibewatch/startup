    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与阶段
        blocks:
          - type: paragraph
            body: >
              即便按 2026 年 AI 创业公司的标准看，River AI 也很反常：公司 2026 年 4 月 20 日成立，在 Nevada 注册，不到四个月后就宣布 $1.1B 的 Seed 与 Series A
              合计融资。公开材料把运营总部放在 Palo Alto，并把公司定位成 AI 基础设施公司，而不是消费级 AI 应用。近期产品还不是宽泛的 agent 平台；它是一套已经上线的预览版
              API，用于在开放权重大语言模型上做 LoRA 微调和强化学习。这个细节重要，因为 River 一边用具体产品切口建立早期可信度，一边讲述个人 AI
              所有权的宏大长期故事。证据基础也很薄。除了发布当天的公告，公开可见的只是少量官方页面和新闻稿，因此本章把身份事实视为支撑较充分，但运营规模、员工人数、治理和牵引力仍未解决。
