      - number: '1.2'
        title: 领导层与创始团队
        blocks:
          - type: paragraph
            body: >
              River 的公开身份几乎完全压在 Igor Babuschkin 身上。官方公告和发布报道都称他为联合创始人兼 CEO，独立背景资料则把他与 DeepMind、OpenAI、xAI
              串起来。这段履历是真正的优势，因为 River 卖的是高级训练工作流的基础设施，不是薄薄一层应用。它也带来集中风险：发布时没有披露其他具名高管、技术联合创始人或董事会成员。公司称创始团队来自 xAI 和
              Tesla，但公开证据到此为止。因此，投资人可以较高置信度承认创始人履历，却仍要面对管理层厚度、GTM
              覆盖，以及谁真正负责核心工程、安全、财务和企业销售职能的不确定性。一个极强的可见创始人，配上几乎不透明的运营班底，这种失衡正是 River 早期尽调画像的核心。
