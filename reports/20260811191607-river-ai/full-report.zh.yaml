              融资故事既是档案里最清楚的事实，也是后续不确定性最大的来源。River 于 2026 年 8 月 11 日宣布完成 $1.1B 的 Seed 与 Series A 合计融资，由 General Catalyst
              和 AMP PBC 领投，NVIDIA 和 AMD Ventures 为战略投资方，Y Combinator 与 Temasek
              也在名单中。这个组合有意义：大型软件投资人、硬件相关战略资本和全球知名机构被放在一起。但公告没有披露持股比例、分轮规模、权利安排和交易估值。二级报道称，Babuschkin 此前曾探索最高 $1B、最高 $5B
              估值的融资，并可能计划投入个人资本；这些信息只能作为较低置信度背景，不能当成已确认条款。尽调上，River
              相对公司年龄已经显得资本过剩，但这笔资本带来的治理和稀释后果仍不透明。投资方控制权也同样只能谨慎看待，仅靠公开材料无法判断。
