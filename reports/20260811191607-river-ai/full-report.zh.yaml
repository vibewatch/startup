      - number: '2.3'
        title: 政策环境
        blocks:
          - type: paragraph
            body: >
              政策对 River 不是背景噪音，而是市场叙事的一部分。2026 年 7 月的开放权重公开信把开放模型框定为竞争力和韧性问题，给 River
              和类似供应商提供了有用话术。与此同时，缺席的签署者和签署者一样有信息量。OpenAI、Anthropic 和 Google 未被报道支持这封信，这意味着行业对开放权重访问应如何治理仍没有统一共识。对 River
              来说，这形成了喜忧参半的市场环境。一些企业可能因为想要所有权和供应商多样性而认为开放权重具备战略吸引力；另一些企业会担心安全、许可和采购风险。因此，River
              受益于政策讨论的方向，但不能把它当成既定法律或普遍买方共识。
