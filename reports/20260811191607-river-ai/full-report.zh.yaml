              团队，以及重视检查点所有权和部署可迁移性的平台工程团队。产品不太可能最先吸引通用业务用户，因为工作流仍假设用户懂模型选择、训练逻辑和评估纪律。更合理的定位，是给那些已经认真构建自有 AI
              行为的团队使用。因此，目标客户逻辑是连贯的，哪怕客户证明稀缺。公司知道谁应该在意；它还没有公开证明这些买方里谁已经在生产中采用。
