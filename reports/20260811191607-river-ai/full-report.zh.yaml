              认证，可以通过客户端查看账户范围内的可用模型，也能通过暴露出来的 LoRA 参数配置适配行为，而不是只能走黑盒 prompt 工作流。这个细节重要，因为 River
              不是简单重新包装推理，而是在尝试把模型训练本身做成可消费的 API 产品。因此，产品故事取决于客户是否相信 River 的工作流主张：训练循环快、客户拥有检查点、部署兼容
              OpenAI、运营负担低。公开文档里的架构看起来连贯，但自有技术深度到底有多少、多少只是对已知组件的编排，仍不清楚。
