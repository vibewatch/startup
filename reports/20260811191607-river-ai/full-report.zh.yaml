  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 融资与资本结构
        blocks:
          - type: paragraph
            body: >
              River 的财务分析从一个悖论开始：公司拥有数据集中最清楚的融资标题之一，却也有最薄的资本结构披露之一。公开材料确认了 $1.1B 的 Seed 与 Series A
              合计融资；对一个产品仍在预览期的公司来说，这非常罕见。但同一批材料没有披露交易价格、持股拆分、董事会权利、债务或任何其他融资机制。这意味着资本充足性可见，稀释、治理后果和投资方控制权不可见。投资人仍能说一件有用的事：River
              有足够资本买时间、积极招聘并锁定基础设施。但轮次机制未披露，这笔融资只能被分析为能力信号，不能当成清晰的 cap table
              事实模式。因此，融资消除了一个风险，也放大了另一个风险：运营证明公开之前，预期已经被抬得很高。
