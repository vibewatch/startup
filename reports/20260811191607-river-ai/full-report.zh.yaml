  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 执行与交付风险
        blocks:
          - type: paragraph
            body: >
              River
              最大的执行挑战在于，它一边要证明技术上复杂的工作流，一边还要围绕它把公司其他部分搭起来。产品处在预览期，公开团队大多未披露，路线图跨度远超当前已交付表面。这个组合带来典型交付风险：即便核心技术概念成立，外围支持、评估、onboarding
              和产品纪律也可能还没成熟到足以服务企业买方。公司还把很大一部分外部可信度集中在一位公开高管身上，带来关键人和叙事风险。简言之，River
              有风险，不是因为想法不连贯；而是因为范围很大、公司很年轻、公开证据里的运营班底仍然很薄。
