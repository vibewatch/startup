  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接 API 竞争对手
        blocks:
          - type: paragraph
            body: >
              River 进入的市场里，模型定制、托管和部署平台已经有多家可信玩家。最接近的直接同行，是那些向企业谈开放模型、微调和生产用例，而不只是卖原始 GPU 租赁的供应商。Together
              AI、Predibase、Fireworks AI，以及某种程度上的 Baseten，在这条连续谱上最靠近 River，尽管各自强调的栈位置略有不同。River
              的挑战在于，这些竞争对手大多已经有更广的市场存在感、更深的公开文档，或更强的生产成熟度证明。它的优势是聚焦。River 围绕快速 RL、LoRA
              工作流和检查点所有权，打出一个相对具体的切口。若能转化成可见客户成果，这种聚焦会很有力；但在没有基准测试和客户证明之前，它仍只是论点，不是已经打赢的市场。
