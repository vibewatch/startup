            body: >
              River 的市场能否成立，取决于底层开放模型供给层是否健康。River 已经支持 Qwen、Kimi 和 GLM 系列，更大的生态还包括 Meta、Mistral、DeepSeek
              等。这个宽度具有战略正面意义，因为 River
              可以把自己呈现为多元模型市场之上的训练层，而不是单模型应用供应商。但它也带来碎片化：每个提供方给出的上下文窗口、许可条款、更新节奏和部署假设都不同。对企业客户来说，训练平台的价值不只是速度或价格，还在于能吸收上游变化，不迫使买方把一切重建。River
              看起来方向上契合这种需求，但公司仍依赖第三方模型的动能来保持目录新鲜度和买方相关性。
