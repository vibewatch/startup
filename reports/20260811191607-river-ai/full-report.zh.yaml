        blocks:
          - type: paragraph
            body: >-
              当前立场有意谨慎。River
              显然有意思，显然资本充足，也显然由能吸引顶级资本的人支持。但这些事实都不能回答：今天的私募市场入场价对新投资人是否有吸引力，或者公司是否已经把太多未来成功提前拉进融资故事。牛市情景可见，熊市情景也可见，而缺失数据对答案影响过大。这把正确的公开立场推向低置信度的“跟踪”，而不是激进确信。如果
              River
