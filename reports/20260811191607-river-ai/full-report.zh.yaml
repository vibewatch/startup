      - number: '3.2'
        title: 闭源模型微调竞争
        blocks:
          - type: paragraph
            body: >
              OpenAI 仍是最重要的间接标尺，因为它为许多企业买方定义了最简单的闭源模型路径。River
              实际上是在要求客户接受更多模型选择复杂度，换取所有权、可迁移性和潜在更低成本。如果买方已经明确要开放权重，这笔交换合理；但它不会自动成为每家企业的胜出选择。闭源模型平台减少了部分上游模型选择负担，也往往有更强的可靠性感知。因此，River
              不只是在和开放权重基础设施供应商竞争，也在和“简单”的吸引力竞争。落到实际，River 必须证明，当买方选择开放模型训练路径而不是闭源模型 API 时，速度、检查点可迁移性和工作流控制足以抵消额外决策成本。
            claimRefs:
              - CP001
              - CP010
