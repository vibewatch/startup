  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct API competitors
        blocks:
          - type: paragraph
            body: >
              River has entered a market that already contains multiple credible platforms for model customization,
              hosting, and deployment. The closest direct peers are vendors that speak to enterprises about open models,
              fine-tuning, and production use cases rather than only raw GPU rentals. Together AI, Predibase, Fireworks
              AI, and in some respects Baseten sit closest to River on that continuum, although each emphasizes a
              slightly different slice of the stack. River's challenge is that most of these competitors already have
              broader market presence, more public documentation depth, or stronger proof of production maturity. Its
              advantage is focus. River is pitching a relatively specific wedge around fast RL and LoRA workflows with
              checkpoint ownership. That focus can be powerful if it converts into visible customer outcomes, but
              without benchmarks and customer proof it remains a thesis rather than a demonstrated market win.
