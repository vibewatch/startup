      - number: '2.2'
        title: Open-weight model ecosystem
        blocks:
          - type: paragraph
            body: >
              The viability of River's market depends on the health of the open-model supply layer beneath it. River
              already supports Qwen, Kimi, and GLM families, while the wider ecosystem includes Meta, Mistral, DeepSeek,
              and others. That breadth is strategically positive because it lets River present itself as a training
              layer above a diverse model market rather than as a single-model application vendor. It also creates
              fragmentation. Each provider ships different context windows, licensing terms, update cadences, and
              deployment assumptions. For enterprise customers, that means the value of a training platform is not only
              speed or price; it is also the ability to absorb upstream change without forcing the buyer to rebuild
              everything. River appears directionally aligned with that need, but the company still depends on
              third-party model momentum for catalog freshness and buyer relevance.
