      - number: '3.4'
        title: Market positioning
        blocks:
          - type: paragraph
            body: >-
              On a competitive map, River currently looks like a high-control, low-proof entrant. It has a credible
              technical story, a founder who can explain why the product exists, and a financing package that gives it
              unusual early leverage. What it does not yet have in public is the evidence of durable operating
              superiority that would let an investor rank it above better-established peers. That does not make River
              weak; it makes it early. The positioning bet is that open-weight ownership plus fast workflow execution
              will matter enough for enterprises to adopt a young platform despite limited public proof. The risk is
              that the same market logic that makes River interesting also makes it legible for incumbents to emulate.
              Until River demonstrates customer wins or benchmark outperformance, the chapter treats the company as a
              credible challenger with a narrow but defensible-looking thesis, not a winner of the field. That is why
              competitive diligence should focus less on category labels and more on how quickly River can turn a narrow
