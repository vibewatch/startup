      - number: '3.3'
        title: Strategic differentiation
        blocks:
          - type: paragraph
            body: >
              River's differentiation is not that it invented fine-tuning, inference, or model serving. The
              differentiated pitch is the packaging: token-metered LoRA plus reinforcement-learning post-training on
              open-weight models, coupled to checkpoint ownership and a deployment path that resembles the OpenAI API
              surface many developers already know. That package appeals most where control and workflow speed matter
              more than broad platform maturity. It may also benefit from investor-linked hardware credibility. Still,
              the moat is ambiguous. Customer-owned checkpoints are valuable for buyers, but they also reduce lock-in.
              If larger platforms replicate the workflow, River cannot rely on switching costs alone. The company must
              therefore build defensibility through experience quality, time-to-result, and operational reliability
              rather than through exclusivity over the underlying models or infrastructure primitives.
