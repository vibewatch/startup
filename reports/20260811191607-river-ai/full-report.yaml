  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core training API
        blocks:
          - type: paragraph
            body: >
              River's product proposition is unusually concrete for a company this young. The public product is a live
              preview API that exposes LoRA fine-tuning and reinforcement-learning post-training on open-weight models.
              Users authenticate with an API key, can inspect account-scoped model availability through the client, and
              can configure adaptation behavior through exposed LoRA parameters rather than through a black-box
              prompt-only workflow. That matters because River is not merely repackaging inference. It is attempting to
              make model training itself feel consumable as an API product. The product story therefore depends on
              whether customers trust River's workflow claims: fast training loops, checkpoint ownership,
              OpenAI-compatible deployment, and low operational overhead. The architecture appears coherent from public
              docs, but the exact depth of proprietary technology versus orchestration over known components remains
              unclear.
