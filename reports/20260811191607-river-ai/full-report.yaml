  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Enterprise AI fine-tuning market
        blocks:
          - type: paragraph
            body: >
              River is entering the part of the AI stack where enterprises stop renting generic model behavior and begin
              optimizing models for their own data, workflows, and policies. That is an attractive market because many
              teams now want more than prompt engineering, but it is still early enough that market boundaries are
              blurry. Fine-tuning infrastructure overlaps with model hosting, inference tooling, GPU clouds, and MLOps
              platforms. River's wedge is narrower than the whole category: it is specifically about fast LoRA and
              reinforcement-learning post-training on open-weight models with minimal infrastructure overhead for the
              buyer. The market signal is real because a growing set of enterprise AI teams wants control and
              portability, but the evidence is still directional rather than mature. As a result, River benefits from a
              strong thematic tailwind while still operating in a category where buyer budgets, procurement cycles, and
              long-run category definitions remain unsettled.
            claimRefs:
