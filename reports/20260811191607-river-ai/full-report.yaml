  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Execution and delivery risk
        blocks:
          - type: paragraph
            body: >
              River's biggest execution challenge is that it is trying to prove a technically sophisticated workflow
              while still building the rest of the company around it. The product is in preview, the public team is
              mostly undisclosed, and the roadmap spans far beyond the currently delivered surface. That combination
              creates classic delivery risk: even if the core technical concept is sound, the surrounding support,
              evaluation, onboarding, and product discipline may not yet be mature enough for enterprise buyers. The
              company also concentrates a large share of external credibility in one public executive, which raises
              key-person and messaging risk. In short, River is not risky because the idea is incoherent; it is risky
              because the scope is large, the company is young, and public evidence on the operating bench is still very
              thin.
