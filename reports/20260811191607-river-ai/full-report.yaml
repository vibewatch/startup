chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and stage
        blocks:
          - type: paragraph
            body: >
              River AI is unusual even by 2026 AI-startup standards: the company was founded on April 20, 2026,
              incorporated in Nevada, and was already announcing a $1.1 billion combined Seed and Series A less than
              four months later. Public materials place the operating headquarters in Palo Alto and frame the business
              as an AI infrastructure company rather than a consumer AI app. The near-term product is not a broad agent
              platform yet; it is a live preview API for LoRA fine-tuning and reinforcement learning on open-weight
              large language models. That matters because River is trying to establish early credibility through a
              concrete product wedge while still telling an expansive long-run story about personal AI ownership. The
              evidence base is also thin. Beyond launch-day announcements, only a small set of official pages and news
              writeups exist, so the chapter treats identity facts as well supported but treats operating scale,
              headcount, governance, and traction as unresolved.
