      - number: '7.2'
        title: Competitive risk
        blocks:
          - type: paragraph
            body: >
              River is entering an already crowded field where many adjacent vendors can attack its wedge from different
              directions. Closed-model providers can win on simplicity, open-weight platforms can win on maturity and
              proof, and infrastructure vendors can win on flexibility or cost if they add more workflow-specific
              packaging. River's differentiators—checkpoint ownership, RL emphasis, and speed claims—are attractive, but
              none is obviously impossible to copy. That means the company needs to accumulate proof faster than
              competitors accumulate equivalent features. The moat is therefore mostly operational and experiential
              today, not structural. If River converts technical interest into production wins quickly, this risk
              becomes manageable. If it does not, the same features that make the product legible also make the market
              response predictable.
