      - number: '7.3'
        title: Regulatory and policy risk
        blocks:
          - type: paragraph
            body: >
              The policy environment is supportive enough to help River's narrative and unsettled enough to stay
              dangerous. Open-weight advocacy clearly exists, but so does growing regulatory attention on AI safety,
              claim substantiation, governance, privacy, and misuse. River sits in the middle of that tension because it
              wants to make powerful training workflows easy to use. If policy pressure rises, open-weight
              infrastructure providers may find themselves asked to prove more about controls, monitoring, or
              permissible workloads. River also depends on upstream model-provider rules, which can change without
              regulatory action. The result is a layered policy risk stack: formal regulation, informal supplier
              restrictions, and reputational expectations from enterprise buyers. None of those risks are fatal today,
              but all of them are important because River's current product narrative assumes relatively open access and
              relatively smooth enterprise acceptance.
