      - number: '1.3'
        title: Funding and investors
        blocks:
          - type: paragraph
            body: >
              The financing story is both the clearest fact in the file and the largest source of downstream ambiguity.
              River announced $1.1 billion across Seed and Series A on August 11, 2026, led by General Catalyst and AMP
              PBC, with NVIDIA and AMD Ventures as strategic investors and Y Combinator plus Temasek also named. That
              list is meaningful because it blends a large software investor with hardware-linked strategic capital and
              globally recognized institutions. At the same time, the announcement omitted ownership percentages,
              round-by-round sizing, rights, and the transaction valuation. Secondary reporting says Babuschkin had
              earlier explored raising up to $1 billion at up to a $5 billion valuation and may have intended to commit
              personal capital, but those points remain lower-confidence context rather than confirmed deal terms. For
              diligence, River already looks overcapitalized relative to its age, yet the governance and dilution
              consequences of that capital are still opaque. The same caution applies to investor control, which remains
              impossible to judge from public materials alone.
