      - number: '4.2'
        title: Revenue outlook
        blocks:
          - type: paragraph
            body: >
              River at least gives a visible monetization frame. The API charges by training, prompt, and completion
              tokens and separately charges for checkpoint storage. That makes the model legible in a way many newly
              funded AI startups are not. It does not make revenue knowable. No public evidence discloses customer
              counts, usage volumes, average contract sizes, or conversion from experiments into recurring deployed
              workloads. The most reasonable view is that revenue exists on a continuum from zero to early pilot-stage
              usage, but not at a level anyone can underwrite confidently from public materials. A constructive takeaway
              is that River has multiple possible recurring streams once customers stay on the platform. A skeptical
              takeaway is that preview-stage usage can be volatile, discount-heavy, and operationally expensive long
              before it becomes durable revenue.
