  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Unicorn event and capital raised
        blocks:
          - type: paragraph
            body: >
              River's financing created a unicorn-scale narrative even though the company did not publish a transaction
              valuation. In practical terms, a $1.1 billion combined Seed and Series A announced four months after
              incorporation immediately moves River into the class of companies that will be judged against frontier AI
              financings, not ordinary software seed rounds. That is important because it changes the burden of proof.
              The financing itself is real and well supported. The valuation embedded in that financing is not. Public
              evidence therefore supports a large capital event and a high-expectation context, but not a clean price
              anchor. The result is a company that clearly has elite market attention while still lacking the operating
              disclosure that would normally make such attention easy to underwrite.
            claimRefs:
