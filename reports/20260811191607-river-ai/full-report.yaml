companyProfile:
  summary: >
    River AI is a Palo Alto-based full-stack AI company founded in April 2026 by Igor Babuschkin, co-founder and former
    chief engineer of xAI and veteran researcher at Google DeepMind and OpenAI. The company's near-term product is a
    token-metered API for LoRA fine-tuning and reinforcement learning on frontier open-weight large language models,
    enabling enterprises to train, tune, and own custom AI models without a dedicated infrastructure team. River's
    longer-term vision is to rebuild the entire AI stack—from training infrastructure through personalization layers to
    personal hardware—so that AI agents are owned by individuals rather than rented from large labs. On August 11, 2026,
    four months after incorporation, River announced $1.1 billion in combined Seed and Series A funding led by General
    Catalyst and AMP PBC, with strategic stakes from NVIDIA and AMD Ventures.
