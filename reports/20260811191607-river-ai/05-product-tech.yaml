- id: roadmap
  title: Roadmap
  body: River's roadmap is both ambitious and strategically coherent. The current product sits at the training-infrastructure layer, but management frames it as only the first step toward personalization software, personal AI hardware, and eventually personal agents owned by individuals. That progression makes narrative sense because the company wants to own more of the stack over time. It also materially increases execution risk. Each roadmap step moves River into a different competitive arena with different technical, regulatory, and go-to-market requirements. Today, the public evidence only supports the first layer with confidence. The roadmap should therefore be interpreted as a vision and sequencing hypothesis, not as a delivered product plan. Investors can underwrite that ambition as upside only after River proves the infrastructure layer has strong user pull and durable workflow differentiation. The technology picture is therefore strong enough to support product credibility, but
