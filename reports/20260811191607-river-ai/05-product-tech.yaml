- id: model-catalog-and-pricing
  title: Model catalog and pricing
  body: |
    The most detailed public product evidence is River's pricing sheet. It names specific Qwen, Kimi, and GLM variants and publishes token-level training and inference prices for most of them. That transparency is valuable because it lets investors see how River intends to monetize complex workflows at a granular level. The catalog also reveals where River is betting. Qwen and Kimi variants cover multiple size and context regimes, while GLM inclusion broadens non-Western model supply. The highest-priced long-context offerings show that River expects some customers to pay materially more for premium context windows, which is consistent with a workflow-driven enterprise buyer rather than a commodity inference buyer. The pricing sheet is therefore not just a rate card; it is the clearest external artifact describing the technical surface River believes matters.
