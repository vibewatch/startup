  evidenceGaps:
  - type: missing-source
    severity: material
    topic: performance-claim
    missingEvidence: No public benchmark methodology or raw results accompany River's speed and cost claims.
    whyItMatters: Product differentiation hinges on these claims being real in customer workloads.
    diligencePath: Request benchmark notebooks, workload assumptions, and side-by-side competitor tests.
    relatedQuestionRefs:
    - QE022
  - type: missing-source
    severity: material
    topic: architecture
    missingEvidence: Public materials describe workflow behavior but not the exact proprietary versus open-source boundary in the architecture.
    whyItMatters: The size of River's true technical moat depends on what is uniquely built.
    diligencePath: Request architecture review with internal component map and dependency list.
    relatedQuestionRefs:
    - QE023
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: Security attestations, audit controls, and enterprise compliance details are not visible publicly.
    whyItMatters: Enterprise adoption can stall even when the technical core is strong.
    diligencePath: Request security whitepaper, logging model, and compliance roadmap.
    relatedQuestionRefs:
    - QE024
  - type: stale
    severity: material
    topic: roadmap
    missingEvidence: Roadmap milestones beyond the preview API are expressed as vision statements without dated deliverables.
    whyItMatters: Ambitious roadmap scope raises focus risk without milestone discipline.
    diligencePath: Request dated roadmap and success criteria for the next two releases.
    relatedQuestionRefs:
    - QE025
