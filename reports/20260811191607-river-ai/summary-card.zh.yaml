    - 尽管缺少运营证明，估值预期可能已经被拉高。
    - 治理和团队厚度公开信息极少，关键人风险更高。
    - River 依赖第三方开放权重模型家族持续可用，并且在商业场景中可落地。
  unresolvedGaps:
