  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: licensing
    missingEvidence: Provider-specific license and access restrictions are not mapped in River's public materials.
    whyItMatters: Supplier rules may define the real product boundary more than River's own roadmap.
    diligencePath: Create a provider-by-provider model access and licensing matrix.
    relatedQuestionRefs:
    - QR022
  - type: private-evidence-only
    severity: blocking
    topic: security-risk
    missingEvidence: Security controls, incident response, and audit evidence are not publicly disclosed.
    whyItMatters: Enterprise trust is a gating dependency for adoption.
    diligencePath: Request security pack, trust-center materials, and internal incident policies.
    relatedQuestionRefs:
    - QR023
  - type: missing-source
    severity: blocking
    topic: performance-risk
    missingEvidence: No independent benchmark evidence validates or falsifies River's public workflow claims.
    whyItMatters: Differentiation risk is highest where the public story is strongest.
    diligencePath: Run or request independent benchmark comparisons.
    relatedQuestionRefs:
    - QR024
  - type: missing-source
    severity: material
    topic: kill-criteria
    missingEvidence: Relative probabilities of failure by risk vector cannot be ranked from public evidence alone.
    whyItMatters: Investors need to know which risk to monitor most aggressively over the next refresh period.
    diligencePath: Interview customers and management to rank thesis-break scenarios.
    relatedQuestionRefs:
    - QR025
acknowledgedWarnings:
- dimension: fetchTrailMissing
  reason: The user supplied a pre-fetched URL pack, but the run-level fetch trail file is unavailable in this workspace so the warning is intentionally acknowledged.
