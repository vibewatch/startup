- id: leadership-and-governance
  title: Leadership Structure and Governance
  body: 'The public governance record is better than what many private unicorns offer, although it still does not fully solve ownership and control questions. In late 2025 Yanolja announced a refreshed leadership structure that grouped the company around Consumer Platform, Enterprise Solutions, and Corporation divisions, with Cheolwoong Lee, Junyoung Lee, and Chanseok Choi taking those presidencies while founder Sujin Lee remained Group CEO. The governance page then adds a more concrete oversight picture: as of February 4, 2026, the board consisted of five executive directors, four outside directors, and one non-executive director, and it operated formal audit, related-party, compensation, and nominating-governance committees. That level of governance disclosure is positive for a private company preparing for larger capital-markets scrutiny, but it still leaves material gaps. The company does not publicly break out ownership percentages, control provisions, or liquidation preferences, and
    the public record does not provide a clean current headcount figure. The net result is that leadership visibility is strong enough for operational assessment, while ownership visibility remains incomplete for full underwriting.'
