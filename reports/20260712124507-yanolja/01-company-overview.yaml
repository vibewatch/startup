  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A current management-verified employee headcount and regional employee distribution.
    whyItMatters: Headcount is a common late-stage scale metric and helps judge operating leverage, but current public figures are inconsistent or stale.
    diligencePath: Request current organization charts or HR dashboards from management.
    relatedQuestionRefs:
    - QO019
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: material
    topic: customer count
    missingEvidence: A reconciled customer-count definition across consumer users, enterprise accounts, solution licenses, and travel-channel relationships.
    whyItMatters: Public sources cite 30,000 clients, 80,000 licenses, and 1.33 million businesses, which are not directly comparable and could mislead valuation or market-share analysis.
    diligencePath: Ask management for a metric dictionary and the latest audited definitions for B2C users, B2B accounts, and active properties.
    relatedQuestionRefs:
    - QO020
  - type: private-evidence-only
    severity: material
    topic: capital structure
    missingEvidence: Current debt facilities, covenant package, and maturity schedule.
    whyItMatters: Without debt detail it is difficult to fully assess financing dependency, downside resilience, and effective enterprise value.
    diligencePath: Request balance-sheet notes, lender agreements, and treasury disclosures.
    relatedQuestionRefs:
    - QO021
  - type: private-evidence-only
    severity: material
    topic: cap table
    missingEvidence: A full cap table including early investors, preference stack, secondaries, and post-SoftBank dilution.
    whyItMatters: Ownership and preference terms directly affect dilution, control, and IPO or exit economics.
    diligencePath: Request the capitalization table and board-approved financing documents from management counsel.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: material
    topic: Qoo10 recovery
    missingEvidence: Updated settlement, collateral-realization, or collection data on the Interpark Commerce receivable from Qoo10.
    whyItMatters: The eventual economic recovery may differ meaningfully from the gross outstanding amount cited in early adverse reporting.
    diligencePath: Monitor company disclosures and ask management for collections status, collateral value, and any impairment taken.
    relatedQuestionRefs:
    - QO023
