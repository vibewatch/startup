- id: scale-signals-ai-and-adverse-context
  title: Scale Signals, AI Positioning, and Adverse Context
  body: 'The current Yanolja thesis depends on management proving that scale, AI, and global enterprise adoption can coexist without weakening economics or governance. Public 2024 and 2025 results show real scale: revenue rose from KRW 924.5 billion to KRW 1.029 trillion, aggregate TTV reached KRW 39.2 trillion, and enterprise solutions accounted for roughly a third of group revenue with higher margins than the consumer platform. Additional operating claims are more mixed in quality. Yanolja and BusinessKorea describe a footprint across more than 200 countries and very large counts of travel businesses or sales channels, while earlier Yonhap and TechCrunch reporting documented 80,000-plus licenses or about 30,000 clients across roughly 170 countries for the cloud business. These are directionally supportive but not perfectly harmonized, so they should be read as scale signals rather than as a single audited customer count. The AI narrative is also increasingly central: Yanolja says it adopted
    ChatGPT Enterprise, is applying GPT-5-linked workflows, and is using AI for demand forecasting, dynamic pricing, localization, and automated operations. The main adverse context is that some of the same strategic moves that broadened the company’s scope also created exposure to unsettled Interpark Commerce proceeds and cancellation friction for customers during the Qoo10-related disruption.'
