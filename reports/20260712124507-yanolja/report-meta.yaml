  foundingLocation: Seoul, South Korea
  headquarters: Seoul, South Korea
  productSummary: |
    Consumer marketplace for lodging, flights, activities, performances, memberships, and broader
    travel-and-leisure purchases in Korea, plus Enterprise Solutions spanning hospitality cloud,
    property and channel workflows, distribution, data solutions, and AI-enabled travel operations.
  customerFocus: |
    Korean and regional leisure travelers on the consumer side; hotels, travel businesses,
    distribution partners, and travel operators globally on the enterprise side.
  businessModel: |
    Consumer booking and marketplace monetization layered with enterprise software, distribution,
    data, and AI-enabled operating solutions for travel businesses.
  stage: "Late-stage private / unicorn"
  fundingStatus: |
