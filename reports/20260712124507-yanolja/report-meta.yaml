companyProfile:
  summary: |
    Yanolja began in 2005 as a Korea-focused lodging-information and booking service and has since
    expanded into a multi-segment travel technology company. Today the public record shows two core
    businesses: a consumer travel and leisure platform centered on the NOL / Yanolja ecosystem, and
    a global Enterprise Solutions division that sells hospitality cloud, distribution, data, and
    AI-enabled workflow products to travel businesses. The enterprise segment has become the key
    quality signal in the model because it grows faster and carries materially higher margins than
    the consumer marketplace. Strategic capital from Booking Holdings, GIC, and SoftBank helped fund
    this expansion, while Interpark and Go Global broadened the company’s consumer and B2B reach.
  foundedDate: '2005-01-01'
  founders:
