  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: >-
          Recommendation is track, because quality is real but the current headline valuation is too hard to defend
          publicly
        blocks:
          - type: paragraph
            body: >-
              Yanolja looks strategically relevant enough to stay on an investor’s active list, but not cheap enough on
              public evidence to underwrite a fresh entry at the often-cited US$10 billion mark. The positive case is
              real: the company is profitable on an adjusted EBITDA basis, it has crossed KRW 1 trillion of annual
              revenue, its enterprise segment is growing faster and at much higher margins than the consumer platform,
              and it still has obvious strategic value as the leading Korean travel super-app combined with a global
              hospitality-software and data layer. The problem is price discipline. The 2025 results release implies
              only about US$717 million of revenue, which means a US$10 billion valuation equates to roughly 14 times
              trailing revenue. That is above the public market-cap-to-revenue proxies of Booking, Airbnb, Expedia, and
              Trip.com, even though those companies are larger, liquid, and more heavily disclosed. The correct stance
              is therefore not to dismiss Yanolja, but to separate company quality from valuation support. Public
              evidence justifies a track / selective posture, not a blind willingness to pay the last private headline
              mark.
            claimRefs:
              - CV001
              - CV003
              - CV004
