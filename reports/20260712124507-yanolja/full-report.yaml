  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Local Korean Platform Rivals
        blocks:
          - type: paragraph
            body: >-
              In Korea, Yanolja does not compete only with other travel-booking brands. It also competes with broad
              digital platforms that can insert travel into larger consumer habits. Naver combines search, commerce,
              local discovery, and payments-like behaviors inside a platform that already touches a very large share of
              Korean digital intent, which makes it dangerous even if travel is only one adjacency rather than its core
              business. Kakao competes differently: through messaging, mobility, identity, and ecosystem lock-in that
              can support discovery, booking, and repeat usage around urban movement and lifestyle demand. Coupang is
              different again. It brings logistics infrastructure, membership behavior, and a very large active-customer
              base, meaning it can subsidize or cross-promote travel-related offers from a stronger commerce cash
              engine. Against these players, Yanolja’s consumer edge is category focus and a travel-native brand, but
              its weakness is that adjacent giants can acquire attention more cheaply because travel is only one use
              case inside broader ecosystems.
