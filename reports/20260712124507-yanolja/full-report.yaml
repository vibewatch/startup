      - number: '8.3'
        title: Bull, base, and stretch cases all still leave the US$10 billion mark looking aggressive
        blocks:
          - type: paragraph
            body: >-
              The scenario framework should start from reported revenue and then ask what multiple Yanolja can credibly
              earn given its mix, growth, and disclosure profile. A bear case assumes that investors price Yanolja more
              like a conventional OTA with modest disclosure credit; that yields roughly US$2.9 billion to US$3.6
              billion on 4 to 5 times trailing revenue. A base case gives the company some scarcity and software credit
              for its enterprise business and AI narrative; that yields about US$4.3 billion to US$5.0 billion on 6 to 7
              times revenue. A bull case assumes improving mix, better public-market sentiment, and more confidence in
              global B2B durability; that points to roughly US$5.7 billion to US$6.5 billion on 8 to 9 times revenue.
              Even a very generous 10 times multiple only supports around US$7.2 billion on current revenue. That is why
              the US$10 billion anchor looks more like a strategic aspiration or old private reference point than a
              public-market-clearing price. To support US$10 billion at Airbnb-like 7 times revenue, Yanolja would need
              about US$1.43 billion of annual revenue, roughly twice what it reported for 2025, unless investors are
              also willing to underwrite materially stronger margins and better disclosures than are currently public.
            claimRefs:
