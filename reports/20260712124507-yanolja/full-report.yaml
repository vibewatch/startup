      - number: '3.2'
        title: Global OTA Benchmarks
        blocks:
          - type: paragraph
            body: >-
              The global OTA set matters because it sets the performance bar that a future Yanolja IPO would be judged
              against. Booking Holdings, Airbnb, Expedia, and Trip.com all operate at revenue and market-cap levels
              materially above what Yanolja publicly discloses. Booking alone generated $26.91 billion of 2025 revenue
              and carried a July 2026 market cap above $138 billion. Airbnb remained a roughly $88 billion public
              company with more than $12 billion of 2025 revenue. Expedia and Trip.com were smaller than Booking and
              Airbnb but still operated with public-market scale, liquidity, and investor visibility far beyond
              Yanolja’s current private-company disclosure set. Those companies also compete across categories that
              matter to Yanolja’s future strategy: accommodations, flights, experiences, and international demand
              routing. The implication is not that Yanolja must match global giants in absolute scale immediately. It is
              that any valuation argument for Yanolja has to show how a Korea-anchored consumer platform and a
              travel-enterprise stack can justify a premium multiple without equivalent public transparency or
              international network effects.
