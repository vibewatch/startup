  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              Yanolja sits at the intersection of at least three related markets that need to be separated to avoid
              false precision. The first is the global and Asia-Pacific online travel agency market, where travel
              discovery, booking, payments, and post-booking service are already digital and increasingly app-led. The
              second is South Korea’s travel-demand base itself: inbound tourism, domestic leisure, outbound travel, and
              the associated online spending that a local super-app can capture through lodging, flights, leisure, and
              events. The third is the hospitality-software and property-management software stack that powers hotels
              and other accommodation providers. Public sources give much better visibility on the first and third
              layers than on the second. Mordor and Grand View Research both show a very large OTA market, but their
              absolute 2025-2026 numbers differ enough that the right conclusion is not one exact TAM value; it is a
              range with scope and methodology caveats preserved. On the software side, the market gets smaller when
              narrowed to core PMS and broader when widened to all hotel and hospitality management software. That
              distinction matters because Yanolja Cloud is not just a PMS vendor; it also sells adjacent distribution,
              revenue-management, and travel-data capabilities.
