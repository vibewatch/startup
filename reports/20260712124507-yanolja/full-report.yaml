        title: Revenue model now looks like a consumer cash engine plus higher-margin enterprise software layer
        blocks:
          - type: paragraph
            body: >-
              Yanolja’s public financial disclosures support a clearer revenue model than many late-stage private travel
              companies provide. The business is no longer described only as a Korean lodging-booking app. Instead, the
              company reports separate Consumer Platform and Enterprise Solutions revenue lines under K-IFRS, which
              matters because it shows two distinct monetization engines: a domestic and regional travel marketplace on
              one side, and subscription, cloud hospitality, and AI data solutions on the other. The 2025 result is
              especially important because Enterprise Solutions reached roughly one-third of group revenue while also
              delivering far higher adjusted EBITDA margins than the consumer business. That mix shift suggests Yanolja
              is trying to fund market-facing consumer growth with a structurally stronger B2B software layer. Still,
              investors should be careful not to over-read the segment breakout. The company states that revenue
              excludes intercompany transactions and that holdings, eliminations, and rounding prevent the segment lines
              from summing cleanly to consolidated revenue. Even so, the public record now supports a credible thesis
              that Yanolja monetizes through both booking-linked consumer demand and software or data services sold to
