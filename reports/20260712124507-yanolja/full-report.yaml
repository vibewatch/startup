      - number: '8.4'
        title: >-
          Investment upside exists, but only if diligence closes the gap between strategic story and hard valuation
          evidence
        blocks:
          - type: paragraph
            body: >-
              The final investment view depends less on whether Yanolja is important and more on whether an investor can
              convert the story into an acceptable risk-adjusted entry price. Public evidence supports the idea that
              Yanolja has built something rare: a domestic consumer champion with a scaling B2B travel-technology stack,
              positive adjusted EBITDA, and credible AI partnerships. Yet the missing items are exactly the ones that
              determine whether a premium private valuation should be paid: fully diluted cap table, liquidation
              preferences, net cash or debt, working-capital intensity, 2026 interim trading, enterprise retention,
              software-like ARR quality, and a clean bridge from reported segment revenue to repeatable cash flow. Those
              gaps matter because they sit on top of real execution frictions, including the Qoo10 receivable issue and
              the fact that IPO timing remains flexible rather than committed. The disciplined conclusion is to keep
              Yanolja in the funnel, but demand a materially lower entry point than US$10 billion or insist on
              structural protection and significantly fuller disclosure before underwriting anything close to that
              headline.
