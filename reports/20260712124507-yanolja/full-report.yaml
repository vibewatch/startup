      - number: '1.3'
        title: Capital Formation, Strategic Expansion, and IPO Readiness
        blocks:
          - type: paragraph
            body: >-
              Yanolja’s capital path is one of the clearest parts of the public record. In June 2019 the company raised
              $180 million from GIC and Booking Holdings, crossing the billion-dollar valuation threshold and pairing
              capital with a strategic distribution tie-up through Agoda. In July 2021 SoftBank Vision Fund 2 invested 2
              trillion won, which industry sources said could value Yanolja above 10 trillion won and gave the company a
              second, much larger validation point. The next major strategic move was the Interpark transaction, which
              TechCrunch and Yonhap tied to Yanolja’s super-app ambitions and expansion into travel tickets,
              attractions, and related lifestyle categories. More recent BusinessKorea reporting adds an IPO-readiness
              angle: Yanolja hired a former NYSE executive, expanded its overseas branch network, and set up a Delaware
              corporation while keeping a U.S. listing option open. That said, the same strategic-expansion story also
              carries risk. The Qoo10-related Interpark Commerce receivable overhang shows that corporate restructuring
              can expose Yanolja to balance-sheet and consumer-protection questions even before a public listing
              happens.
