chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Origin, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Yanolja’s public identity matters because it explains why the company can credibly claim both consumer
              relevance in Korea and enterprise relevance abroad. Yonhap, TechCrunch, and the company’s own disclosures
              all trace the business back to 2005, when founder Sujin Lee built Yanolja as a motel-information portal
              before broadening it into a wider travel and leisure platform. Current company pages now describe Yanolja
              as a global travel technology company that operates a data-powered travel enablement platform spanning
              pre-trip, in-trip, and post-trip experiences for both travelers and travel enterprises. The NOL consumer
              app shows how broad that consumer proposition has become: lodging, flights, leisure, performances, and
              global inventory all sit inside one mobile surface. Meanwhile, company financial disclosures divide the
              business into consumer platform and enterprise solutions, which is important because the latter now
              represents a large enough share of revenue to influence the group’s margin path and strategic narrative.
              The core overview takeaway is therefore not just that Yanolja is a booking app, but that it is trying to
              combine domestic consumer demand with B2B infrastructure and data services into one travel operating
              model.
