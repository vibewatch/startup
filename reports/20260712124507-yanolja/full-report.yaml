      - number: '7.2'
        title: Platform, consumer-protection, and competition rules are becoming more interventionist
        blocks:
          - type: paragraph
            body: >-
              Yanolja’s consumer and merchant surfaces also sit inside a second risk family: Korea’s increasingly
              interventionist approach to platform fairness, algorithmic transparency, dark patterns, and e-commerce
              conduct. The reviewed BKL, Cleary, and NBR materials all point in the same direction even if the final
              legislative architecture is still moving: policy makers want more control over self-preferencing, search
              and recommendation logic, commission practices, external payment treatment, and deceptive interface
              design. That trend matters because Yanolja is not only an OTA; it is a multi-sided marketplace that ranks
              supply, allocates traffic, promotes inventory, and monetizes merchants and travelers simultaneously. Korea
              Times reporting shows that the enforcement climate is not theoretical. Food-delivery platforms faced
              self-correction rejection and looming FTC penalties, and Trip.com was fined for travel-related
              e-commerce-law violations. Even where Yanolja is not named, those cases tell investors what regulators are
              willing to police. The practical underwriting takeaway is that feature launches, merchandising tactics,
              and fee design all carry a higher policy-risk tax than simple topline growth figures suggest.
            claimRefs:
