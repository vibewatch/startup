      - number: '7.3'
        title: Company-specific execution risk comes from collections, IPO prep, integration, and governance opacity
        blocks:
          - type: paragraph
            body: >-
              The company-specific risk picture is narrower than the legal backdrop but still material. Public news
              coverage indicates Yanolja remained exposed to roughly KRW 168 billion of proceeds outstanding from the
              Interpark Commerce sale to Qoo10, plus additional unpaid funds linked to the settlement-delay crisis.
              Management said the issue did not affect capital flow and pointed to collateral, which is directionally
              reassuring, but outside investors still lack recovery timing, counterparty quality, and impairment-path
              detail. At the same time, Yanolja’s ongoing U.S.-listing preparation—U.S. office build-out, Delaware
              entity formation, senior capital-markets hiring, and public flexibility on IPO timing—raises the
              operational bar for disclosure controls, governance discipline, and cross-border legal consistency.
              Expansion adds another layer. The Interpark acquisition, Go Global integration, and enterprise pivot all
              require management to coordinate consumer, B2B, and international businesses without losing focus.
              Yanolja’s public governance materials show board committees and a formal board structure, which helps, but
              the record still leaves major underwriting gaps around internal controls, management succession depth,
              litigation reserves, and whether global compliance ownership is centralized enough for a company with
              increasing AI and enterprise complexity.
