  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Privacy and cybersecurity risk is the most immediate Korean compliance burden
        blocks:
          - type: paragraph
            body: >-
              For Yanolja, the most immediate non-market risk is not a generic macro shock but the tightening Korean
              privacy and cybersecurity regime that now reaches directly into platform governance, incident response,
              and executive accountability. The legal materials reviewed in this run show that Korea has raised the cost
              of getting privacy and security wrong: PIPA amendments expanded administrative-penalty headroom, broadened
              what can count as a reportable breach, and increased board- and CEO-level responsibility for privacy
              oversight, while the amended Network Act and its decree increased incident-reporting speed, strengthened
              CISO and committee requirements, and created new sanctions for repeated security failures. This matters
              disproportionately for Yanolja because it operates a travel super-app, enterprise hospitality software,
              payments-adjacent workflows, and international data exchanges at the same time. The company’s AI roadmap
              further increases the number of data-processing and decisioning flows that could attract scrutiny. Public
              evidence does show some mitigation—an active governance page, a formal IR surface, and large-operator
              behavior consistent with preparing for public markets—but the public record does not reveal enough about
