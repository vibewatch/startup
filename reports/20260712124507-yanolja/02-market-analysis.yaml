tables:
- id: TM001
  title: Market definition table
  columns:
  - Layer
  - Included spend / workflow
  - Excluded spend
  - Primary buyer / user
  - Why it matters to Yanolja
  rows:
  - - Global OTA market
    - Digital discovery, booking, servicing for flights, stays, ground transport, experiences
    - Pure offline agency sales and supplier-direct volume outside OTA definitions
    - Travelers and travel shoppers
    - Sets the broad consumer-distribution TAM
  - - APAC OTA market
    - Regional OTA activity within Asia-Pacific digital channels
    - Non-digital and non-OTA bookings
    - APAC travelers and regional platforms
    - Most relevant regional demand backdrop for Yanolja’s super-app ambitions
  - - South Korea digital travel demand
    - Inbound, domestic, and outbound travel demand that can be captured digitally through apps or online channels
    - Travel spend that never touches an online booking or marketplace
    - Korean residents, inbound visitors, travel planners
    - Defines Yanolja Platform’s practical home-market opportunity
  - - Hospitality PMS market
    - Core property-management, reservation, front-desk, and revenue tools for hotels and similar properties
    - Broader non-hospitality real-estate software
    - Hotel owners, GMs, operations teams
    - Closest public proxy for Yanolja Cloud core software TAM
  - - Broader hotel and hospitality management software market
    - PMS plus booking engines, digital services, CRS, communications, and guest-service tools
    - Travel demand that does not require operator software
    - Hotel groups, independent operators, chains
    - Captures Yanolja Cloud’s adjacent modules beyond core PMS
  notes: Definitions intentionally separate consumer travel demand from hotel-operator software demand so later valuation work does not double count revenue pools or confuse OTA GMV with software revenue.
