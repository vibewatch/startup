- id: drivers-constraints-and-evidence-gaps
  title: Growth Drivers, Constraints, and Evidence Gaps
  body: 'The structural growth case for Yanolja’s markets is clear: APAC remains the fastest-growing travel region in major OTA reports, online bookings are still outpacing offline channels, and hotel software adoption continues to migrate toward cloud, automation, and AI-assisted revenue management. Those trends line up well with Yanolja’s self-described platform strategy. But a disciplined market view also has to preserve the constraints. OTA economics face search-cost volatility, supplier-direct competition, regulatory scrutiny, and payment or refund complexity. PMS adoption faces integration friction, data-privacy and cybersecurity burdens, OTA fee pressure, and hotel reluctance to replace legacy workflows quickly. The Korean market adds another layer: official tourism and trend pages are rich in visitor and behavior data, but the fetched public evidence still does not cleanly publish a Korea-only OTA GMV figure or a Korea-specific hotel-software TAM that can be inserted into one neat
    model. That gap does not invalidate the opportunity. It simply means the right diligence stance is to use multi-lens sizing, ask management for internal market-share assumptions, and avoid over-claiming precision where the public record is only directional.'
