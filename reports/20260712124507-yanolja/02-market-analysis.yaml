  evidenceGaps:
  - type: missing-source
    severity: material
    topic: mobile OTA share in Korea
    missingEvidence: A Korea-specific, current-series estimate of OTA or mobile-booking penetration by value rather than by travel demand or survey description.
    whyItMatters: Without a Korea-only digital-booking share, SAM estimates for Yanolja Platform remain directional rather than precise.
    diligencePath: Request KTO microdata or a paid Korea OTA market report with platform-level booking-channel shares.
    relatedQuestionRefs:
    - QM019
  - type: private-evidence-only
    severity: material
    topic: Yanolja OTA SAM
    missingEvidence: Management’s internal model for Korean OTA share, addressable categories, and cross-sell attach assumptions.
    whyItMatters: Public tourism demand does not translate directly into Yanolja’s monetizable booking and take-rate pool.
    diligencePath: Request management market-share decks, category GMV splits, and monetization assumptions.
    relatedQuestionRefs:
    - QM020
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: Yanolja Cloud Korea SAM
    missingEvidence: A public South Korea-specific hospitality software value estimate that can be mapped directly to Yanolja Cloud’s product scope.
    whyItMatters: Global and APAC software reports overstate addressable value unless narrowed to country and module scope.
    diligencePath: Obtain a paid Korea-specific hotel-software report or management’s country TAM model.
    relatedQuestionRefs:
    - QM021
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: minor
    topic: budget ownership
    missingEvidence: Property-level procurement examples showing which budget owner signs and funds Yanolja Cloud deployments in Korea.
    whyItMatters: Buyer-user-payer maps are directionally clear but still generic without Korean procurement detail.
    diligencePath: Interview hotel operators and review sample contracts or proposals.
    relatedQuestionRefs:
    - QM022
    relatedTableRefs:
    - TM003
  - type: conflicting-data
    severity: material
    topic: OTA market size methodology
    missingEvidence: Publisher-side methodology reconciliation between Mordor and Grand View OTA market definitions.
    whyItMatters: TAM differences of this scale can distort growth expectations, valuation comps, and market-share assumptions.
    diligencePath: Review the paid methodology sections or contact publishers to reconcile gross-booking versus revenue scope.
