- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Factor
  - Direction
  - Timing
  - Evidence
  - Implication
  - Diligence ask
  rows:
  - - Mobile-first booking
    - positive
    - current
    - Mordor OTA report says mobile held 63.5% share in 2025
    - Benefits app-led players and raises importance of UX and retention
    - Measure Yanolja mobile conversion and repeat rate
  - - APAC travel recovery
    - positive
    - current
    - Mordor and Phocuswright call APAC the growth engine
    - Supports Korea inbound and regional expansion
    - Check country-level booking mix and corridor exposure
  - - AI-assisted planning
    - positive
    - emerging-to-current
    - PhocusWire and Korea Times report mainstreaming of AI planning
    - Helps discovery, personalization, and ancillary attach
    - Check whether AI lifts conversion or just marketing narrative
  - - Cloud migration in PMS
    - positive
    - current
    - Mordor PMS report shows cloud at 64.92% share in 2025
    - Favors SaaS-native or API-friendly vendors like Yanolja Cloud
    - Check implementation time and migration win rates
  - - SME software adoption
    - positive
    - current
    - Mordor PMS says SMEs held 57.05% share in 2025
    - Creates large long-tail software opportunity
    - Check ARPU, onboarding cost, and churn by property size
  - - Search/CAC volatility
    - negative
    - current
    - Mordor OTA cites dependence on search and AI-discovery shifts as restraint
    - Raises acquisition-cost risk for OTA players
    - Check traffic mix and paid-search dependence
  - - Integration and legacy friction
    - negative
    - current
    - Mordor PMS flags integration complexity with legacy systems
    - Can slow software rollout and raise services intensity
    - Check average deployment time and support burden
  - - Privacy / cybersecurity burden
    - negative
    - current
    - Straits and hotel-software sources flag privacy and cyber concerns
    - Compliance cost can slow vendor adoption and raise product requirements
    - Check security certifications and data-governance costs
  notes: This table mixes demand-side and supply-side forces because Yanolja’s market opportunity spans consumer distribution and operator software. Positive factors increase TAM; constraints mostly affect acquisition cost, adoption speed, or take-rate quality.
