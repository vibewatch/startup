chapter:
  number: 2
  title: Market Analysis
  summary: Yanolja sells into a large and still-digitizing travel market where mobile-first OTA behavior and AI-assisted planning remain structural demand tailwinds, especially in Asia-Pacific. Public market data implies a very large global OTA TAM and a much smaller but still attractive hospitality-software TAM, while official Korean tourism data shows strong inbound recovery, regional dispersion, and experience-led demand. The main analytical challenge is that Korea-specific OTA and hotel-software spend is not cleanly published in the fetched public sources, so the most defensible view is a multi-lens range rather than a single-point market estimate.
sections:
- id: market-boundary-and-scaling-lenses
  title: Market Boundary and Sizing Lenses
  body: 'Yanolja sits at the intersection of at least three related markets that need to be separated to avoid false precision. The first is the global and Asia-Pacific online travel agency market, where travel discovery, booking, payments, and post-booking service are already digital and increasingly app-led. The second is South Korea’s travel-demand base itself: inbound tourism, domestic leisure, outbound travel, and the associated online spending that a local super-app can capture through lodging, flights, leisure, and events. The third is the hospitality-software and property-management software stack that powers hotels and other accommodation providers. Public sources give much better visibility on the first and third layers than on the second. Mordor and Grand View Research both show a very large OTA market, but their absolute 2025-2026 numbers differ enough that the right conclusion is not one exact TAM value; it is a range with scope and methodology caveats preserved. On the software
    side, the market gets smaller when narrowed to core PMS and broader when widened to all hotel and hospitality management software. That distinction matters because Yanolja Cloud is not just a PMS vendor; it also sells adjacent distribution, revenue-management, and travel-data capabilities.'
