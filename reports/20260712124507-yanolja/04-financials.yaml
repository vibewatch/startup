  - type: private-evidence-only
    severity: material
    topic: cash and runway
    missingEvidence: A current cash balance, short-term investment schedule, and downside runway view for Yanolja.
    whyItMatters: Positive adjusted EBITDA does not prove liquidity resilience, especially for a company still investing in consumer growth and acquisitions.
    diligencePath: Request the latest monthly treasury dashboard, cash bridge, and 12- to 24-month operating plan.
