  rows:
  - - Consumer Platform
    - Travel, lodging, leisure, and related consumer transactions through the NOL / Yanolja consumer surface
    - KRW 671.2B in 2024; KRW 723.7B in 2025
    - Large installed consumer base can fund brand and demand acquisition
    - Margin lower than enterprise and affected by marketing / integration spend
  - - Enterprise Solutions
    - Cloud hospitality, subscription, and AI data solutions sold to travel enterprises
    - KRW 292.6B in 2024; KRW 352.6B in 2025
    - Fastest-growing disclosed segment and structurally higher margin
    - Customer count, ARPU, and churn are not publicly reconciled
  - - Direct fee-generating travel activity
    - Included in TTV and consumer monetization narrative
    - Company discloses TTV but not take rate
    - Supports marketplace scale and monetization potential
    - Take rate and gross versus net revenue treatment are not broken out
  - - Subscription / data-linked revenue
    - Included in Enterprise Solutions and linked to indirect transaction activity
    - TTV footnotes cite cloud hospitality and data solutions
    - Suggests recurring or quasi-recurring software-style revenue
    - Exact subscription mix is not publicly quantified
  - - Integrated platform monetization
    - Management frames travel enablement platform across traveler and enterprise workflows
    - 2025 release says Enterprise Solutions is about one-third of revenue
    - Supports a blended consumer-plus-infrastructure thesis
    - Holding-company eliminations make precise mix analysis harder
  notes: Public disclosures now support a real segment model, but not a fully detailed revenue-recognition bridge by product or geography.
