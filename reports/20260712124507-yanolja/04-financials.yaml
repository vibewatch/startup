- id: adverse-context-and-underwriting-blockers
  title: The main financial risk is not top-line weakness; it is incomplete visibility into cash, receivables, and true earnings quality
  body: 'The adverse financial story around Yanolja is narrower than the growth story, but it is not trivial. BusinessKorea reported that Yanolja still had roughly KRW 168 billion of proceeds outstanding from the Interpark Commerce sale to Qoo10, plus around KRW 10 billion of additional unpaid funds tied to the settlement-delay crisis. Yanolja publicly responded that the matter did not affect capital flow and said it had collateral and strong financial soundness, but that reassurance should still be treated as management positioning rather than audited liquidity evidence. More broadly, the company gives investors revenue, TTV, and adjusted EBITDA, yet it still withholds most of the variables required for downside underwriting: current cash, burn, leverage, working-capital pressure, impairment treatment, and the bridge from statutory earnings to recurring cash generation. Even the stronger disclosure surface on IR and DART does not fully solve that problem because the readable public artifacts
    emphasize report existence more than detailed note extraction. The public verdict is therefore positive on scale and funding history, but only medium-confidence on true financial durability.'
