- id: recent-results-and-earnings-quality
  title: 2024 and 2025 results show scale, but earnings quality still depends on adjusted metrics and disclosure choices
  body: The biggest change in Yanolja’s public financial profile is that outsiders can now see a two-year operating arc rather than a one-off headline. For 2024, Yanolja reported KRW 924.5 billion of revenue, KRW 27.0 trillion of TTV, and KRW 114.7 billion of adjusted EBITDA. For 2025, the company reported KRW 1,029.2 billion of revenue, KRW 39.2 trillion of TTV, and KRW 100.0 billion of adjusted EBITDA. That means scale increased again, but profit conversion weakened as the company invested into consumer-platform integration, the NOL UNIVERSE rollout, marketing, and product improvements. Enterprise Solutions continued to outrun the consumer business on both growth and margin, which is a constructive mix signal. However, the comparison is not as clean as it first appears. Yanolja explicitly says adjusted EBITDA is a non-K-IFRS measure, and the TTV footnotes changed between the two annual releases, with the 2024 definition including intercompany transactions and the 2025 definition excluding
    them. The result is a public dataset that is meaningful but not fully standardized, so direction is more reliable than precision when comparing years.
