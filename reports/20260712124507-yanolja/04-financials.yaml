  title: Enterprise Solutions is the key quality signal inside the income statement
  body: Yanolja’s public numbers imply that the company’s best economic asset is not simply Korean travel demand, but the faster-growing enterprise software and data stack that now contributes about one-third of revenue at much higher margins.
