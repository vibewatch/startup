chapter:
  number: 4
  title: Financials
  summary: Yanolja now discloses enough to show a real two-engine revenue model and positive adjusted EBITDA, but not enough to fully underwrite cash generation or balance-sheet risk. Public 2024 and 2025 releases show revenue scaling from KRW 924.5 billion to KRW 1.029 trillion, with Enterprise Solutions growing faster and at materially higher margins than the consumer platform. The main constraints are that Adjusted EBITDA is non-K-IFRS, segment totals do not reconcile cleanly to the group, and key balance-sheet items such as cash, burn, debt, and impairment treatment remain private or only partially described.
sections:
- id: revenue-model-and-segment-mix
  title: Revenue model now looks like a consumer cash engine plus higher-margin enterprise software layer
  body: 'Yanolja’s public financial disclosures support a clearer revenue model than many late-stage private travel companies provide. The business is no longer described only as a Korean lodging-booking app. Instead, the company reports separate Consumer Platform and Enterprise Solutions revenue lines under K-IFRS, which matters because it shows two distinct monetization engines: a domestic and regional travel marketplace on one side, and subscription, cloud hospitality, and AI data solutions on the other. The 2025 result is especially important because Enterprise Solutions reached roughly one-third of group revenue while also delivering far higher adjusted EBITDA margins than the consumer business. That mix shift suggests Yanolja is trying to fund market-facing consumer growth with a structurally stronger B2B software layer. Still, investors should be careful not to over-read the segment breakout. The company states that revenue excludes intercompany transactions and that holdings, eliminations,
    and rounding prevent the segment lines from summing cleanly to consolidated revenue. Even so, the public record now supports a credible thesis that Yanolja monetizes through both booking-linked consumer demand and software or data services sold to travel operators.'
