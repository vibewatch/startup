    - Medium-High
    - No take rate, gross margin, NRR, or segment cohort detail
    - Enterprise growth and margin are positive, but underlying quality is opaque
    - Request segment P&L, cohort data, and ARPU / churn definitions
  notes: These gaps are material because Yanolja is private and still markets itself partly through non-K-IFRS headline metrics.
