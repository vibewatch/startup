- id: capital-history-and-balance-sheet-context
  title: Capital formation has been strong since 2019, but present-day balance-sheet resilience is still inferred
  body: 'Yanolja’s financing history is much easier to verify than its current cash position. The company publicly disclosed a $180 million Series D in 2019 from GIC and Booking Holdings, and Yonhap corroborated that the round pushed valuation above $1 billion while also creating a strategic Agoda distribution partnership. In 2021, Yonhap and TechCrunch reported SoftBank Vision Fund 2 invested about 2 trillion won, or roughly $1.7 billion, at a valuation in the 10 trillion won range. Those rounds, followed by Interpark-related expansion and later U.S.-listing preparations, show that Yanolja has historically had access to very large pools of growth capital. More recently, IR pages and DART-linked disclosures show a more formal reporting surface, including annual and quarterly report links and closing announcements. That said, public sources still do not disclose the items an investor would need to verify near-term liquidity directly: cash and short-term investments, debt schedules, covenants,
    or free cash flow. The most defensible public conclusion is therefore that Yanolja has demonstrated capital access, not that it has proven present-day balance-sheet strength in full detail.'
