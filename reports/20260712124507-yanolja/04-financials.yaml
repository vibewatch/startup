    - Request latest balance sheet and treasury schedule
  - - Debt and covenant package
    - High
    - Leverage can change IPO or financing flexibility
    - No detailed debt schedule in reviewed public sources
    - Request lender agreements and maturity ladder
  - - Receivable recovery from Qoo10 / Interpark Commerce
    - High
    - Potential write-down could hit equity or cash expectations
    - BusinessKorea reported KRW 168B outstanding and collateral claims
    - Request collection status and impairment treatment
  - - Statutory earnings and cash-flow detail
    - High
    - Adjusted EBITDA alone is insufficient for valuation work
    - DART pages show report existence, but readable public extraction is limited
    - Obtain full annual and quarterly statements with notes
