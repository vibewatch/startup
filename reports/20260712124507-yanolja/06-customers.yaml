- id: enterprise-customer-footprint
  title: B2B customer proof is broader than hotel logos alone because Yanolja sells into properties, agencies, and operators
  body: 'The enterprise-customer story is where Yanolja’s scale looks most differentiated. Public sources indicate that the company’s customer footprint includes hotels and other travel businesses using cloud operating software, travel agencies and tour operators connected through Yanolja Go Global, and restaurant or F&B operators using adjacent POS tooling. The 2024 results release said Enterprise Solutions served over 1.3 million travel businesses and more than 21,000 sales channels globally. Earlier Go Global materials add more specific commercial shape: more than 1 million travel products from 200 countries, more than 20,000 client partners, and later a rebrand statement saying over 20,000 partners across more than 100 markets. Those numbers are directionally impressive, but they are not interchangeable definitions. A travel business, a sales channel, a property, and a partner are different units of account. The right interpretation is therefore that Yanolja has wide enterprise reach
    across several customer types, while investors still need a current metric dictionary to translate those signals into active accounts, paying properties, and customer concentration.'
  claimRefs:
