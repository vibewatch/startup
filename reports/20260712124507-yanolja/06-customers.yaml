  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: consumer cohorts
    missingEvidence: Current active consumer users, transacting users, repeat-booking frequency, and cohort retention for the NOL / Yanolja app.
    whyItMatters: App breadth and ratings are not enough to underwrite consumer durability or monetization quality.
    diligencePath: Request MAU, transacting-user, and repeat-booking cohort data from management.
    relatedQuestionRefs:
    - QU019
    - QU025
    relatedTableRefs:
    - TU001
    - TU005
  - type: private-evidence-only
    severity: material
    topic: enterprise retention
    missingEvidence: Gross retention, net revenue retention, logo churn, and upsell data by product line.
    whyItMatters: Case studies show value creation but not whether that value persists portfolio-wide.
    diligencePath: Request customer cohort retention, churn reasons, and expansion by PMS, channel manager, and distribution products.
    relatedQuestionRefs:
    - QU020
    - QU025
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: account definition and concentration
    missingEvidence: A reconciled metric dictionary for travel businesses, channels, partners, products, properties, and licenses plus top-customer concentration.
    whyItMatters: Without definitions, outsiders can overstate real paying-customer breadth and ignore concentration risk.
    diligencePath: Request current paying-account counts and top-20 customer revenue concentration.
    relatedQuestionRefs:
    - QU007
    - QU021
    - QU025
    relatedTableRefs:
    - TU002
    - TU003
    - TU005
  - type: missing-source
    severity: material
    topic: systemwide support performance
    missingEvidence: Portfolio-level SLA performance, ticket volumes, first-response times, and customer-satisfaction trend lines.
    whyItMatters: Reviews praise support, but anecdotal support quality is not the same as measured service performance at scale.
    diligencePath: Request support operations dashboards and CSAT / NPS histories.
    relatedQuestionRefs:
    - QU022
    - QU025
    relatedTableRefs:
    - TU004
    - TU005
