- id: customer-quality-risks-and-open-questions
  title: Customer quality looks promising, but public disclosure still stops short of true durability metrics
  body: Yanolja’s public customer proof is persuasive on breadth and use-case utility, but weaker on durability and monetization quality. The reviewed sources do not disclose net revenue retention, churn, cohort behavior, average contract value, top-customer concentration, or a clean split between paying properties, software licenses, distribution partners, and consumer transactors. There is also some tension between impressive operational stories and softer signals. For example, the RapidServe app shows 44 thousand downloads on AppBrain but no ratings there, and the customer record around Qoo10 and Interpark highlights how ecosystem disruptions can spill into user experience and collections risk. Review pages also contain requests for better reporting, mobile functionality, and deeper customization, which suggests the product is useful but not flawless. The correct public conclusion is that Yanolja has credible customer proof across consumer and enterprise surfaces, but that customer durability
    and economic quality remain partially opaque until management provides cohort, retention, and concentration data.
  claimRefs:
