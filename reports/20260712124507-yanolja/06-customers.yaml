- id: TU005
  title: Customer diligence gaps table
  columns:
  - Missing metric
  - Why it matters
  - Best public clue
  - Diligence ask
  rows:
  - - Active consumer users / transactors
    - Needed to test app durability and frequency
    - App ratings and review counts show usage but not actives
    - Request MAU, transacting users, repeat-booking cohorts
  - - Paying properties vs licenses vs partners
    - Needed to separate software accounts from distribution relationships
    - Public metrics use several non-comparable units
    - Request metric dictionary and current paying-account counts
  - - NRR, churn, and expansion
    - Needed to evaluate enterprise stickiness
    - Case studies imply value but not portfolio retention
    - Request cohort retention and upsell data by product
  - - Top-customer concentration
    - Needed to assess downside risk
    - No major concentration disclosure in reviewed sources
    - Request top-20 account revenue share
  - - Customer support load and SLA performance
    - Needed to test whether strong reviews scale operationally
    - Reviews praise support but do not provide systemwide service metrics
    - Request ticket volumes, first-response times, and SLA attainment
  notes: These gaps matter because customer breadth alone does not prove customer quality or financial durability.
