company:
  name: Yanolja
chapter:
  number: 6
  title: Customers
  summary: Yanolja has credible public customer proof on both consumer and enterprise sides, but the evidence is uneven. Consumer proof is strongest in the live NOL app surface, app-store trust signals, and narrative demand commentary, while enterprise proof is strongest in verified hotel case studies, broad partner and channel counts, and strong review-platform feedback for PMS, channel-manager, and POS products. What remains missing are the durability metrics—active users, churn, NRR, concentration, and reconciled account definitions—that would turn broad adoption evidence into a fully underwritten customer-quality view.
sections:
- id: consumer-demand-proof
  title: Consumer proof is strongest in app breadth, app ratings, and Korea-centric travel usage signals
  body: 'The public consumer record shows that Yanolja still benefits from meaningful end-user relevance, even if the company does not publish a fully reconciled MAU or transacting-customer funnel. The clearest consumer proof comes from the NOL app listing and Yanolja’s own consumer pages, which show a broad travel-and-leisure surface extending beyond lodging into flights, performances, exhibitions, and discount-led promotions. The App Store listing also gives a current trust signal: a 4.8 rating from 4.6 thousand ratings at the access date and product copy referencing 3.2 million accommodations plus 10 million member-written reviews. None of that is equivalent to disclosed actives or repeat-booking rates, but it does support ongoing consumer relevance. The 2025 results release adds directional demand evidence by citing strong inbound demand from APAC into Korea and continued outbound travel growth. Taken together, the public record supports Yanolja as a live consumer brand with broad category
    reach, but not as a company that publicly discloses cohort quality or retention with investor-grade precision.'
  claimRefs:
