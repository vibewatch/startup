      - number: '8.2'
        title: 公开 OTA 可比公司显示，哪怕不调整不透明折价，Yanolja 已经处在溢价区间
        blocks:
          - type: paragraph
            body: >-
              最干净的公开交叉验证不是完美的企业价值模型，而是把最相关的上市旅行平台做一个简单的市值 / 收入比较。CompaniesMarketCap 的 2026 年 7 月数据显示，Booking 的市值约
              US$138.2 billion，TTM 收入 US$27.7 billion；Airbnb 市值 US$88.2 billion，收入 US$12.6 billion；Expedia 市值 US$32.5
              billion，收入 US$14.7 billion；Trip.com 市值 US$27.0 billion，收入 US$8.8 billion。对应的公开收入倍数约为 5.0 倍、7.0 倍、2.2 倍和
              3.1 倍，中位数接近 4.0 倍。因此，Yanolja 隐含约 14.0 倍的历史收入倍数，不只是略贵，而是明显落在公开 OTA 样本之外。多头反驳是，Yanolja
              值得一定溢价，因为企业软件和数据层利润率更高，韩国领导地位也有战略稀缺性。这个论点有道理，但当 Yanolja 按收入仍只有约三分之一来自企业业务，且继续披露非 K-IFRS
              而不是完全上市公司级别的估值输入时，很难把溢价拉到约 Airbnb 两倍、且比 Booking 高出好几圈的倍数。
