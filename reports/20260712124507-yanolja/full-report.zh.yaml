      - number: '1.3'
        title: 资本形成、战略扩张与 IPO 准备度
        blocks:
          - type: paragraph
            body: >-
              Yanolja 的资本路径是公开记录中最清楚的一块。2019 年 6 月，公司从 GIC 和 Booking Holdings 融资 $180 million，跨过十亿美元估值门槛，并通过 Agoda
              绑定战略分销合作。2021 年 7 月，SoftBank Vision Fund 2 投资 2 trillion won，行业消息称这可能让 Yanolja 估值超过 10 trillion
              won，也给公司带来第二个且大得多的验证点。下一步重大动作是 Interpark 交易，TechCrunch 和 Yonhap 将其与 Yanolja
              的超级应用野心，以及向旅游票务、景点和生活方式品类扩张联系起来。较新的 BusinessKorea 报道又补上 IPO 准备角度：Yanolja 聘请前 NYSE 高管，扩大海外分支网络，并设立 Delaware
              公司，同时保留赴美上市选项。话虽如此，同一条战略扩张故事也带着风险。Interpark Commerce 与 Qoo10 相关应收款悬而未决，说明公司重组即便发生在上市前，也可能把 Yanolja
              暴露在资产负债表和消费者保护问题下。
