  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 隐私和网络安全风险，是最紧迫的韩国合规负担
        blocks:
          - type: paragraph
            body: >-
              对 Yanolja 来说，最紧迫的非市场风险不是泛泛的宏观冲击，而是韩国隐私和网络安全制度收紧，并且已经直接伸入平台治理、事件响应和高管问责。本轮审阅的法律材料显示，韩国已经抬高隐私和安全出错成本：PIPA
              修订扩大了行政处罚上限，拓宽了可报告泄露的范围，并提高董事会和 CEO 层面对隐私监督的责任；修订后的 Network Act 及其实施令提高了事件报告速度，强化了 CISO
              和委员会要求，并为重复安全失败设置新制裁。这对 Yanolja 影响格外大，因为它同时运营旅行超级应用、企业酒店软件、邻近支付的工作流和国际数据交换。公司的 AI
              路线图进一步增加了可能引来审视的数据处理和决策流数量。公开证据确实显示一些缓释因素——活跃的治理页面、正式 IR
              界面，以及与准备进入公开市场一致的大型运营方行为——但公开记录没有披露足够的事件历史、数据架构或控制测试，无法以充分置信度承销合规成熟度。
