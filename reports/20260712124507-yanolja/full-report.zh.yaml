  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议是继续跟踪，因为公司质量真实存在，但当前名义估值很难用公开证据支撑
        blocks:
          - type: paragraph
            body: >-
              Yanolja 的战略相关性足够强，值得留在投资人的主动观察名单上；但按公开证据看，它还没有便宜到可以在常被引用的 US$10 billion 估值上承销一笔新投资。正面案例是真实的：公司按调整后 EBITDA
              已经盈利，年收入突破 KRW 1 trillion，企业业务增长更快、利润率也显著高于消费者平台，而且它仍具备清晰战略价值——一端是韩国领先的旅行超级应用，另一端叠着全球酒店软件和数据层。问题在价格纪律。2025
              年业绩公告隐含收入只有约 US$717 million，意味着 US$10 billion 估值相当于约 14 倍历史收入。这个水平高于 Booking、Airbnb、Expedia 和 Trip.com
              的上市市值 / 收入参照，尽管这些公司规模更大、流动性更好、披露也更充分。因此正确姿态不是否定 Yanolja，而是把公司质量和估值支撑分开。公开证据支持继续跟踪 /
              选择性推进，不支持盲目接受上一轮私人市场名义估值。
