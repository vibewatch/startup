  - id: TV005
    title: 论点失效与否决触发表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对估值的传导
      - 行动含义
    rows:
      - - 没有新披露，IPO 定价口径仍接近 US$10B
        - 管理层或投行在缺少新证据下，仍按上一轮私募头部估值推介交易
        - 上行空间过度依赖叙事溢价
        - 放弃，或要求强得多的结构保护
      - - 2026 年经营表现不及预期
        - 期中增长、利润率或企业业务占比明显走弱
        - 降低溢价倍数扩张概率
        - 下调情景区间
      - - Qoo10 回款恶化
        - 应收账款减值或长期回收延迟浮现
        - 削弱对现金转化和治理纪律的信心
        - 进一步下调股权价值
      - - 企业业务质量弱于隐含预期
        - ARR、流失率或客户集中度撑不起软件式溢价
        - 抹掉高于 OTA 可比公司定价的核心理由
        - 向较低可比区间重估
      - - 股权结构或优先权条款对投资者不友好
        - 优先权顺位、摊薄或控制权条款比假设更差
        - 普通股结果可能与头部估值大幅偏离
        - 要求结构保护，或退出
    notes: 触发项把估值怀疑转成可监控的尽调事件。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
      - CV040
      - CV041
      - CV042
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 路径
    rows:
      - - 股权结构与优先权条款
        - 完全摊薄股数、清算顺位、投资者权利
        - 决定任何头部价格下的真实普通股价值
        - 法务 + 财务数据室
      - - 现金、债务与营运资本
        - 净现金、债务明细、应收账款账龄、季节性
        - 用来把收入叙事桥接到股权价值
        - 财务尽调
      - - 2026 年期中表现
        - 上半年收入、分部结构、盈利能力、预订趋势
        - 检验 2025 年动能是否延续到 IPO 窗口
        - 管理层更新或季度材料
      - - 企业业务质量指标
        - ARR、流失率、NRR、头部客户集中度、合同期限
        - 判断 Yanolja 是否值得享受软件式溢价
        - RevOps + 财务尽调
      - - 分部到现金桥接
        - 调整后 EBITDA 如何转化为经营现金和再投资需求
        - 避免为非现金或低质量利润支付溢价
        - 财务 + 审计尽调
    notes: 守纪律的投资者若要接受接近最激进估值叙事的价格，至少要补齐上述缺口。
    claimRefs:
      - CV004
      - CV008
      - CV029
      - CV030
      - CV041
      - CV042
