            body: >-
              全球 OTA 组很重要，因为它设定了未来 Yanolja IPO 将被拿来比较的业绩标尺。Booking Holdings、Airbnb、Expedia 和 Trip.com 的收入与市值都远高于 Yanolja
              的公开披露。单是 Booking，2025 年收入就达到 $26.91 billion，2026 年 7 月市值超过 $138 billion。Airbnb 仍是一家约 $88 billion
              市值的上市公司，2025 年收入超过 $12 billion。Expedia 和 Trip.com 小于 Booking 与 Airbnb，但仍具备公开市场规模、流动性和投资者可见度，远超 Yanolja
              当前私营公司披露水平。这些公司也在 Yanolja 未来战略所需品类上竞争：住宿、机票、体验和国际需求路由。这里的含义不是 Yanolja 必须马上在绝对规模上追平全球巨头，而是 Yanolja
              的估值论证必须说明，一个扎根韩国的消费者平台叠加旅行企业技术栈，如何在缺少同等公开透明度或国际网络效应时支撑溢价倍数。
