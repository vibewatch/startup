      - number: '7.3'
        title: 公司自身的执行风险来自款项回收、IPO 准备、整合和治理不透明
        blocks:
          - type: paragraph
            body: >-
              公司自身的风险图谱比法律背景更窄，但仍然重要。公开新闻显示，Interpark Commerce 出售给 Qoo10 后，Yanolja 仍有约 KRW 168 billion
              款项未收回，另有与结算延迟危机相关的未付款项。管理层称该问题不影响资金流，并指向抵押物；方向上算是安抚，但外部投资人仍看不到回收时间、交易对手质量和减值路径的细节。与此同时，Yanolja
              正在准备赴美上市——搭建美国办公室、设立 Delaware 实体、招聘资深资本市场人才，并公开保持 IPO
              时点弹性——这把披露控制、治理纪律和跨境法律一致性的运营门槛都抬高了。扩张又加一层压力。Interpark 收购、Go Global 整合和企业业务转向，都要求管理层同时协调消费者、B2B
              和国际业务，且不能分心。Yanolja 的公开治理材料展示了董事会委员会和正式董事会架构，这有帮助；但记录里仍留下重大承销缺口，包括内控、管理层接班深度、诉讼准备金，以及面对 AI
              和企业业务复杂度上升时，全球合规权责是否足够集中。
