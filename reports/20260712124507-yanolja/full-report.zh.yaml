      - number: '2.2'
        title: 韩国需求环境与旅行行为
        blocks:
          - type: paragraph
            body: >-
              官方和半官方需求信号显示，韩国旅行市场进入 2026 年时动能真实，尽管公开数据仍不能完美切出 OTA 预订价值。Korea Times 援引 Ministry of Culture, Sports and
              Tourism 的报道称，2026 年 4 月韩国接待外国游客 2.03 million 人，1–4 月累计 6.77 million
              人，两项都处在创纪录复苏节奏。报道称区域机场客流也在上升，单月入境消费创纪录；这很重要，因为它说明旅游需求正从 Seoul 核心外溢，多站行程中的变现空间也在增加。Korea Tourism
              Organization 对 2026 年的表述也强化了这个市场的产品形态：其“dualism”展望称，旅客现在既要技术也要情绪，既要本地真实感也要便利，并更愿意为精选体验付费，同时在其他地方省钱。另一篇使用
              Trip.com 数据的 Korea Times 文章也支持同一需求模式，指出客源城市更广、Busan 和其他区域目的地兴趣更强、体验驱动购买更多。对 Yanolja
              来说，可寻址的韩国旅行机会不只是间夜，而是住宿、交通、休闲、演出、本地体验，以及越来越基于 App 的旅程中的交叉销售行为。
