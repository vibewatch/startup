              本土旅行界面为中心，把机票、住宿、休闲、演出和促销装进一个移动入口。企业侧，公司将酒店云产品定位为集成运营环境，覆盖预订、前台、客房清洁、渠道分销、预订转化，并通过 SanhaIT
