      - number: '5.2'
        title: AI 是旅客个性化和运营方自动化之间的黏合层
        blocks:
          - type: paragraph
            body: >-
              Yanolja 近期产品传播中反复出现的主题，不只是云软件，而是垂直 AI。公司称已采用 ChatGPT Enterprise 和 GPT-5 相关工作流，正在深化与 Google Cloud 和 AWS
              的合作，并用这些工具自动化客服、需求预测、动态定价、本地化、工单分流和运营工作流。重要的是，Yanolja 并没有把 AI 营销成外挂聊天机器人。公司始终把 AI
              与自有旅行数据、库存聚合和平台野心绑定，覆盖行前、行中、行后用例。Google Cloud 材料强调生成式 AI 基础设施、训练与推理工具，以及基于云的自助终端；AWS 材料强调 Bedrock、Amazon Q
