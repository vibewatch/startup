        title: 2024 和 2025 年业绩显示出规模，但盈利质量仍取决于调整后指标和披露选择
        blocks:
          - type: paragraph
            body: >-
              Yanolja 公开财务画像最大的变化，是外部人现在能看到两年运营弧线，而不是一次性头条。2024 年，Yanolja 披露收入 KRW 924.5 billion、TTV KRW 27.0
              trillion、调整后 EBITDA KRW 114.7 billion。2025 年，公司披露收入 KRW 1,029.2 billion、TTV KRW 39.2 trillion、调整后 EBITDA
              KRW 100.0 billion。这意味着规模再次扩大，但随着公司投入消费者平台整合、NOL UNIVERSE
              推出、营销和产品改进，利润转化变弱。企业解决方案在增长和利润率上继续跑赢消费者业务，是建设性的结构信号。不过，这组对比并没有第一眼看上去那么干净。Yanolja 明确称调整后 EBITDA 是非 K-IFRS
              指标，TTV 脚注也在两份年报之间变化：2024 年定义包括集团内交易，2025 年定义排除集团内交易。结果是，公开数据集有意义但未完全标准化，因此跨年比较时，方向比精度更可靠。
