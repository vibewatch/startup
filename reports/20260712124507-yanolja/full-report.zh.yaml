  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 韩国本土平台对手
        blocks:
          - type: paragraph
            body: >-
              在韩国，Yanolja 的竞争不只是其他旅行预订品牌。它还要面对能把旅行嵌入更大消费习惯的综合数字平台。Naver
              把搜索、商业、本地发现和类支付行为装进同一平台，已经触达韩国数字意图的很大一部分；即便旅行只是邻近业务而非核心业务，它也很危险。Kakao
              的竞争方式不同：消息、出行、身份和生态锁定可以支撑围绕城市流动与生活方式需求的发现、预订和复购。Coupang
              又是另一类。它带着物流基础设施、会员行为和庞大活跃客户群，可以用更强的商业现金引擎补贴或交叉推广旅行优惠。面对这些玩家，Yanolja
              的消费者端优势是品类聚焦和旅行原生品牌；弱点是，相邻巨头获取注意力可能更便宜，因为旅行只是更大生态里的一个使用场景。
