      - number: '1.4'
        title: 规模信号、AI 定位与负面背景
        blocks:
          - type: paragraph
            body: >-
              当前 Yanolja 投资论点取决于管理层能否证明规模、AI 和全球企业采用可以并存，同时不削弱经济性和治理。2024 和 2025 年公开业绩显示公司已有实质规模：收入从 KRW 924.5 billion
              增至 KRW 1.029 trillion，汇总 TTV 达 KRW 39.2 trillion，企业解决方案贡献集团收入约三分之一，利润率高于消费者平台。其他运营说法质量更参差。Yanolja 和
              BusinessKorea 描述的足迹覆盖 200 多个国家，旅行企业或销售渠道数量很大；早前 Yonhap 和 TechCrunch 则记录云业务拥有 80,000 多个许可证，或约 30,000
              名客户，覆盖约 170 个国家。这些信号方向上支持规模叙事，但口径并未完全统一，因此应当读成规模信号，而不是单一经审计客户数。AI 叙事也越来越居中：Yanolja 称已采用 ChatGPT
              Enterprise，正在应用与 GPT-5 相关的工作流，并用 AI 做需求预测、动态定价、本地化和自动化运营。主要负面背景是，部分扩张公司边界的战略动作，也让公司承受尚未解决的 Interpark
              Commerce 款项敞口，以及 Qoo10 相关冲击中客户取消的摩擦。
