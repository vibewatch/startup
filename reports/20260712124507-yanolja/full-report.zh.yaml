      - number: '7.4'
        title: AI 和全球扩张提高上行空间，也扩大了投资人必须测试的控制面
        blocks:
          - type: paragraph
            body: >-
              最后一类风险不是纯法律风险，而是战略风险：Yanolja 想把 AI 驱动的工作流自动化、动态定价、企业软件和全球旅行分发叠到现有业务上，但它的公开披露仍少于上市软件平台。公司和合作伙伴材料持续把 Yanolja
              定位在个性化、自动化运营、本地化、库存优化和 AI agent 驱动的旅行工作流上。这些动作可能强化增长故事，但也会扩大模型治理、可解释性、本地化错误、数据最小化失败和跨境传输摩擦的暴露面。Yanolja
              公开称服务 200 多个国家的旅行企业、连接超过 20,000 个渠道或合作伙伴，并让 IPO
              时点保持弹性，这意味着管理层同时横跨许多司法辖区和利益相关方。这不推翻投资逻辑，但正确的尽调姿态，是把抽象风险话术转成明确的否决触发项：未披露的重大事件、应收款回收失败、监管机构针对市场行为采取行动、AI
              控制证据薄弱，或 IPO 进程跑在披露准备前面。基于当前公开证据，Yanolja 仍可投，但应带着中高合规折价，而不是享受纯粹品类龙头溢价。
