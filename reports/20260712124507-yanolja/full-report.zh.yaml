      - number: '1.2'
        title: 领导架构与治理
        blocks:
          - type: paragraph
            body: >-
              公开治理记录好于许多私营独角兽，但仍没有完全回答所有权和控制权问题。2025 年末，Yanolja 宣布刷新领导架构，围绕消费者平台、企业解决方案和公司职能三个部门组织公司，Cheolwoong
              Lee、Junyoung Lee、Chanseok Choi 分任总裁，创始人 Sujin Lee 留任 Group CEO。治理页面进一步给出了更具体的监督图景：截至 2026 年 2 月 4
              日，董事会由五名执行董事、四名外部董事和一名非执行董事组成，并设有审计、关联方、薪酬、提名与治理等正式委员会。对一家准备接受更大资本市场审视的私营公司来说，这种治理披露是加分项，但关键缺口仍在。公司没有公开拆分持股比例、控制权条款或清算优先权，公开记录也没有给出清晰的当前员工数。结果是：领导层可见度足以支持运营评估，但所有权可见度仍不足以完成完整承销。
