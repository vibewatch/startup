      - number: '2.3'
        title: 购买者、用户、付款者与采用路径
        blocks:
          - type: paragraph
            body: >-
              Yanolja 的 B2C 和 B2B 业务面对的是截然不同的购买者和付款者。消费者侧，终端用户、预订人和付款人通常是同一个人或家庭，因此低摩擦、以 App
              为中心的复购更容易成立。这里的增长靠库存密度、价格透明度、评价、支付和推荐，而不是长销售周期。B2B
              侧，购买者通常是酒店业主、总经理、收益经理或运营负责人，用户则包括前台员工、预订团队和物业一线运营人员。付款人往往是物业或酒店集团预算负责人，采用过程需要集成、上线培训和工作流改变，不是一键转化。市场证据说明了为什么这一点重要。OTA
              层，移动端已经是主界面，亚太的超级应用行为在结构上有利。PMS 层，云化、中小企业采用和 API 优先集成是主要增长向量，也就是说，最容易拿下的客户往往是独立或中型物业，它们想要更低前期成本、更快部署，以及更好的
              OTA / 渠道连接。这个分裂意味着 Yanolja 的市场机会很大，但运营上分成两条线：一边是短周期消费者转化，另一边是由工作流驱动的软件采用。
