      - number: '2.4'
        title: 增长驱动因素、约束与证据缺口
        blocks:
          - type: paragraph
            body: >-
              Yanolja 所处市场的结构性增长逻辑清楚：主要 OTA 报告中，APAC 仍是增长最快的旅游区域；线上预订仍跑赢线下渠道；酒店软件采用继续迁向云、自动化和 AI 辅助收益管理。这些趋势与 Yanolja
              自述的平台战略相匹配。但严谨的市场观点也必须保留约束。OTA 经济性面对搜索成本波动、供应商直连竞争、监管审视，以及支付或退款复杂度。PMS 采用则面对集成摩擦、数据隐私和网络安全负担、OTA
              费率压力，以及酒店不愿快速替换旧工作流。韩国市场又加了一层：官方旅游和趋势页面给了大量访客与行为数据，但本次取得的公开证据仍没有清晰发布韩国单市场 OTA GMV，或可以直接塞进模型的韩国酒店软件
              TAM。这个缺口不推翻机会，只说明尽调应采用多镜头测算，要求管理层提供内部市占假设，并在公开记录只有方向性时避免声称精确。
