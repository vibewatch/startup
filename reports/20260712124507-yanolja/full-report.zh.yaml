companyProfile:
  summary: >
    Yanolja 2005 年从面向韩国的住宿信息和预订服务起步，此后扩展为多业务板块的旅游科技公司。今天的公开记录显示它有两块核心业务：以 NOL / Yanolja
    生态为中心的消费者旅行和休闲平台，以及面向旅行企业销售酒店云、分销、数据和 AI 工作流产品的全球企业解决方案部门。企业业务增长更快，利润率显著高于消费者市场，已经成为模型里的关键质量信号。来自 Booking
    Holdings、GIC 和 SoftBank 的战略资本支持了这轮扩张；Interpark 和 Go Global 则拓宽了公司的消费者与 B2B 覆盖。
