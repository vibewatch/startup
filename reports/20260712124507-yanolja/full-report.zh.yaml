  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算视角
        blocks:
          - type: paragraph
            body: >-
              Yanolja 处在至少三个相邻市场的交叉点，必须拆开看，避免假精确。第一层是全球及亚太 OTA 市场，旅行发现、预订、支付和售后服务已数字化，并越来越由 App
              驱动。第二层是韩国旅行需求本身：入境游、国内休闲、出境游，以及本地超级应用可通过住宿、机票、休闲和活动承接的线上消费。第三层是支撑酒店和其他住宿供给方的酒店软件与物业管理软件栈。公开资料对第一层和第三层的可见度明显高于第二层。Mordor
              和 Grand View Research 都显示 OTA 市场很大，但二者给出的 2025–2026 年绝对数字差异足够大，正确结论不是一个精确
              TAM，而是在保留范围和方法论限制的前提下给出区间。软件侧若收窄到核心 PMS，市场会更小；若放宽到全部酒店和接待管理软件，市场又会变大。这个区别重要，因为 Yanolja Cloud 不只是 PMS
              厂商；它还销售相邻的分销、收益管理和旅行数据能力。
