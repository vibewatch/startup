            body: >-
              Yanolja 的融资历史远比当前现金状况更容易验证。公司公开披露 2019 年从 GIC 和 Booking Holdings 完成 $180 million Series D；Yonhap
              也证实该轮把估值推高到 $1 billion 以上，并建立了与 Agoda 的战略分销伙伴关系。2021 年，Yonhap 和 TechCrunch 报道 SoftBank Vision Fund 2 投资约 2
              trillion won，约合 $1.7 billion，估值处在 10 trillion won 区间。这些融资，叠加 Interpark 相关扩张和后续赴美上市准备，显示 Yanolja
              历史上能接触到很大规模的增长资本。更近期，IR 页面和 DART
              链接披露展现出更正式的信息披露界面，包括年度和季度报告链接以及结算公告。话虽如此，公开资料仍未披露投资者直接验证短期流动性所需的项目：现金和短期投资、债务期限表、契约条款或自由现金流。因此，最稳妥的公开结论是
              Yanolja 已证明融资渠道，而不是已完整证明当前资产负债表强度。
