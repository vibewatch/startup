      - number: '8.4'
        title: 投资上行存在，但前提是尽调补上战略故事与硬估值证据之间的缺口
        blocks:
          - type: paragraph
            body: >-
              最终投资判断不太取决于 Yanolja 是否重要，而更取决于投资人能否把故事转成可接受的风险调整后入场价格。公开证据支持一个判断：Yanolja 确实搭出了稀缺资产——本土消费者冠军、正在扩张的 B2B
              旅行技术栈、调整后 EBITDA 为正，以及可信的 AI 伙伴关系。但缺失项恰好决定了是否应支付溢价私人估值：完全摊薄股本表、清算优先权、净现金或债务、营运资本占用、2026 年中期经营、企业客户留存、类软件
              ARR 质量，以及从已报告分部收入到可重复现金流的清晰桥接。这些缺口重要，因为它们叠在真实执行摩擦之上，包括 Qoo10 应收款问题，以及 IPO 时点仍保持弹性而非明确承诺。纪律性结论是，把 Yanolja
              留在漏斗里，但入场价格必须显著低于 US$10 billion；若要承销接近这个名义估值的价格，则必须要求结构性保护和显著更充分的披露。
