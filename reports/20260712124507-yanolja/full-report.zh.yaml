  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型如今更像消费者现金引擎叠加高利润率企业软件层
        blocks:
          - type: paragraph
            body: >-
              Yanolja 的公开财务披露让收入模型比许多后期私营旅行公司更清楚。业务已不再只被描述为韩国住宿预订 App。公司按 K-IFRS
              单独披露消费者平台和企业解决方案收入线，这很重要，因为它显示了两套不同变现引擎：一边是国内和区域旅行市场，另一边是订阅、酒店云和 AI 数据解决方案。2025
              年结果尤其关键，企业解决方案达到集团收入约三分之一，同时调整后 EBITDA 利润率远高于消费者业务。这个结构迁移说明 Yanolja 正试图用结构更强的 B2B
              软件层，为面向市场的消费者增长供血。不过，投资者不应过度解读分部拆分。公司说明收入排除了集团内交易，同时控股、抵销和四舍五入会让各分部线无法干净加总到合并收入。即便如此，公开记录现在已经支持一个可信论点：Yanolja
              同时通过与预订挂钩的消费者需求，以及卖给旅行运营方的软件或数据服务变现。
