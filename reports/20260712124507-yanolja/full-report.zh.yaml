chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、起点与商业模式
        blocks:
          - type: paragraph
            body: >-
              Yanolja 的公开定位很关键，因为它解释了公司为何既能在韩国消费者端有分量，也能在海外企业客户侧站得住。Yonhap、TechCrunch 和公司披露都把业务追溯到 2005 年：创始人 Sujin Lee
              先把 Yanolja 做成汽车旅馆信息门户，之后扩成更广的旅游和休闲平台。如今公司页面把 Yanolja 定位为全球旅游科技公司，运营一个数据驱动的旅行赋能平台，覆盖旅客和旅行企业的行前、行中、行后体验。NOL
              消费者 App
              显示这套消费者主张已经铺得很宽：住宿、机票、休闲、演出和全球库存都装进一个移动入口。与此同时，公司财务披露把业务划为消费者平台和企业解决方案，这一点重要，因为后者收入占比已大到足以影响集团利润率路径和战略叙事。因此，概览层面的核心结论不是
              Yanolja 只是一个预订 App，而是它正试图把韩国本土消费者需求、B2B 基础设施和数据服务拼进同一套旅行运营模型。
