            body: >-
              围绕 Yanolja 的负面财务故事比增长故事窄，但并不轻。BusinessKorea 报道称，Yanolja 仍有约 KRW 168 billion 的 Interpark Commerce
              出售款未收回，另有约 KRW 10 billion 的额外未付款项与结算延迟危机有关。Yanolja
              公开回应称该事项不影响资本流动，并表示公司有抵押品且财务稳健，但这种安抚仍应视为管理层表态，而不是经审计流动性证据。更广泛地看，公司给了投资者收入、TTV 和调整后
              EBITDA，却仍隐去做下行承销所需的大部分变量：当前现金、烧钱、杠杆、营运资金压力、减值处理，以及法定盈利到经常性现金生成的桥接。即便 IR 和 DART
              上的信息披露界面更强，也没有完全解决问题，因为可读的公开材料更强调报告存在，而不是提取了详细附注。公开结论因此是：规模和融资历史为正面，但真实财务耐久度只能给中等置信度。
