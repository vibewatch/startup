      - number: '3.4'
        title: 护城河耐久度、价格压力与锁定风险
        blocks:
          - type: paragraph
            body: >-
              Yanolja 的护城河真实存在，但有条件。韩国本土旅行品牌、国内需求密度和扩大的企业足迹，搭出一座很多对手没有的桥。全球 OTA
              规模大得多，但韩国品牌亲密度可能弱；酒店软件厂商的运营工具可能更强，但消费者需求数据更少。这座桥是 Yanolja
              最好的论据。问题在于，市场每一侧都在变难。消费者平台正用搜索、订阅、物流和出行捆绑来压低获客成本。软件对手正用云迁移、集成广度、开放 API 和 AI
              原生自动化来提高切换成本。公开证据也让价格保持不透明：如今很多市场竞争发生在动态消费者优惠、协商酒店合同、订阅，或以报价驱动的企业套餐中，而不是透明价目表。投资者因此应把 Yanolja
              的竞争位置视为有前景但尚未锁定。公司必须持续证明，品类聚焦、旅行数据和双边平台创造的经济性，优于大型消费者生态或同类最佳酒店技术栈单独能做到的结果。
