      - number: '8.3'
        title: 乐观、基准和极限情景下，US$10 billion 估值仍然显得激进
        blocks:
          - type: paragraph
            body: >-
              情景框架应先从已报告收入出发，再判断在当前业务组合、增长和披露画像下，Yanolja 能合理拿到什么倍数。悲观情景假设投资人把 Yanolja 更像传统 OTA 来定价，只给有限披露加分；按 4 到 5
              倍历史收入，对应约 US$2.9 billion 至 US$3.6 billion。基准情景给企业业务和 AI 叙事一些稀缺性与软件信用；按 6 到 7 倍收入，对应约 US$4.3 billion 至
              US$5.0 billion。乐观情景假设业务组合改善、公开市场情绪更好、全球 B2B 持久性可信度提高；按 8 到 9 倍收入，对应约 US$5.7 billion 至 US$6.5
              billion。即便非常慷慨地给 10 倍，当前收入也只能支撑约 US$7.2 billion。这就是为什么 US$10 billion 锚点更像战略愿景或旧的私人市场参照，而不是公开市场可出清价格。如果要在
              Airbnb 类似的 7 倍收入上支撑 US$10 billion，Yanolja 年收入需要达到约 US$1.43 billion，约为 2025
              年报告值的两倍；除非投资人还愿意承销远强于当前公开材料的利润率和披露质量。
