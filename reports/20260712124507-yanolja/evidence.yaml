evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A current management-verified employee headcount and regional employee distribution.
    whyItMatters: >-
      Headcount is a common late-stage scale metric and helps judge operating leverage, but current public figures are
      inconsistent or stale.
    diligencePath: Request current organization charts or HR dashboards from management.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: customer count
    missingEvidence: >-
      A reconciled customer-count definition across consumer users, enterprise accounts, solution licenses, and
      travel-channel relationships.
    whyItMatters: >-
      Public sources cite 30,000 clients, 80,000 licenses, and 1.33 million businesses, which are not directly
      comparable and could mislead valuation or market-share analysis.
    diligencePath: >-
      Ask management for a metric dictionary and the latest audited definitions for B2C users, B2B accounts, and active
      properties.
    relatedQuestionRefs:
      - QO020
  - type: private-evidence-only
    severity: material
    topic: capital structure
    missingEvidence: Current debt facilities, covenant package, and maturity schedule.
    whyItMatters: >-
      Without debt detail it is difficult to fully assess financing dependency, downside resilience, and effective
      enterprise value.
    diligencePath: Request balance-sheet notes, lender agreements, and treasury disclosures.
    relatedQuestionRefs:
      - QO021
  - type: private-evidence-only
    severity: material
    topic: cap table
    missingEvidence: A full cap table including early investors, preference stack, secondaries, and post-SoftBank dilution.
    whyItMatters: Ownership and preference terms directly affect dilution, control, and IPO or exit economics.
    diligencePath: Request the capitalization table and board-approved financing documents from management counsel.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: Qoo10 recovery
    missingEvidence: Updated settlement, collateral-realization, or collection data on the Interpark Commerce receivable from Qoo10.
    whyItMatters: >-
      The eventual economic recovery may differ meaningfully from the gross outstanding amount cited in early adverse
      reporting.
    diligencePath: Monitor company disclosures and ask management for collections status, collateral value, and any impairment taken.
    relatedQuestionRefs:
      - QO023
  - type: missing-source
    severity: material
    topic: mobile OTA share in Korea
    missingEvidence: >-
      A Korea-specific, current-series estimate of OTA or mobile-booking penetration by value rather than by travel
      demand or survey description.
    whyItMatters: >-
      Without a Korea-only digital-booking share, SAM estimates for Yanolja Platform remain directional rather than
      precise.
    diligencePath: Request KTO microdata or a paid Korea OTA market report with platform-level booking-channel shares.
    relatedQuestionRefs:
      - QM019
  - type: private-evidence-only
    severity: material
    topic: Yanolja OTA SAM
    missingEvidence: Management’s internal model for Korean OTA share, addressable categories, and cross-sell attach assumptions.
    whyItMatters: Public tourism demand does not translate directly into Yanolja’s monetizable booking and take-rate pool.
    diligencePath: Request management market-share decks, category GMV splits, and monetization assumptions.
    relatedQuestionRefs:
      - QM020
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: Yanolja Cloud Korea SAM
    missingEvidence: >-
      A public South Korea-specific hospitality software value estimate that can be mapped directly to Yanolja Cloud’s
      product scope.
    whyItMatters: Global and APAC software reports overstate addressable value unless narrowed to country and module scope.
    diligencePath: Obtain a paid Korea-specific hotel-software report or management’s country TAM model.
    relatedQuestionRefs:
      - QM021
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: minor
    topic: budget ownership
    missingEvidence: Property-level procurement examples showing which budget owner signs and funds Yanolja Cloud deployments in Korea.
    whyItMatters: Buyer-user-payer maps are directionally clear but still generic without Korean procurement detail.
    diligencePath: Interview hotel operators and review sample contracts or proposals.
    relatedQuestionRefs:
      - QM022
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: OTA market size methodology
    missingEvidence: Publisher-side methodology reconciliation between Mordor and Grand View OTA market definitions.
    whyItMatters: TAM differences of this scale can distort growth expectations, valuation comps, and market-share assumptions.
    diligencePath: Review the paid methodology sections or contact publishers to reconcile gross-booking versus revenue scope.
    relatedQuestionRefs:
      - QM025
  - type: missing-source
    severity: material
    topic: public pricing transparency
    missingEvidence: Current, directly comparable take-rate, commission, or SaaS list-price data across Yanolja and peers.
    whyItMatters: >-
      Pricing power is central to moat durability, but most retrieved sources emphasize positioning rather than
      transparent unit economics.
    diligencePath: Collect management proposals, supplier contracts, or hotel-software pricing sheets from field interviews.
    relatedQuestionRefs:
      - QP019
  - type: private-evidence-only
    severity: material
    topic: korean rival economics
    missingEvidence: Travel-category revenue or take-rate contribution from Naver, Kakao, and Coupang.
    whyItMatters: >-
      Without category-level economics it is hard to judge how aggressively these ecosystems can subsidize travel
      features.
    diligencePath: Request segment disclosures or interview channel partners and sellers.
    relatedQuestionRefs:
      - QP020
    relatedTableRefs:
