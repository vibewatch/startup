  rows:
  - - Yanolja
    - Korean travel platform + travel enterprise software
    - KRW 1.029T 2025 revenue; enterprise solutions 34% of revenue
    - Travel-native brand plus B2C/B2B bridge
    - Reference point for local focus plus cloud expansion
  - - Naver
    - Search, commerce, local discovery
    - KRW 12.0T 2025 revenue; commerce 31% of revenue
    - Intent capture and massive platform traffic
    - Can intercept travel demand before specialist apps do
  - - Kakao / Kakao Mobility
    - Messaging, mobility, AI ecosystem, memberships
    - Kakao Q1 2026 revenue KRW 1.94T; mobility subscriptions launched
    - Super-app adjacency and transport relevance
    - Competes for local movement, discovery, and app retention
  - - Coupang
    - Commerce, logistics, memberships
    - 23.9M active product-commerce customers; $34.5B 2025 revenue
    - Large customer base and subsidy capacity
    - Can cross-sell travel from a stronger commerce engine
  - - Booking Holdings
    - Global OTA
    - 2025 revenue $26.91B; market cap $138.23B
    - Global inventory and public-market scale
    - Sets the hardest valuation and distribution benchmark
  - - Airbnb
    - Alternative stays and travel platform
    - 2025 revenue $12.24B; market cap $88.20B
    - Global brand and differentiated supply
    - Strong global leisure benchmark for accommodation discovery
  - - Expedia Group
    - Global OTA / packages / Vrbo
    - 2025 revenue $14.73B; market cap $32.50B
    - Broad inventory and brand portfolio
    - Relevant for package, flight, and experience breadth
  - - Trip.com
    - Asia-based global OTA
    - 2025 revenue $8.75B; market cap $26.95B
    - APAC strength and mobile-first execution
    - Closest large public APAC-style benchmark
  notes: Scale metrics mix company disclosures, SEC filings, and market-data pages. The table is designed to show order-of-magnitude differences in capital scale, not to imply identical business models.
