    - Negative
    - Scale gap affects marketing, partnerships, and valuation comparisons
  - - Integration expectations
    - Oracle and Mews both emphasize platform integration breadth
    - Enterprise software rivals
    - Negative
    - Hotels increasingly buy for workflow consolidation, not point tools
  - - AI feature race
    - Cloudbeds, Mews, Oracle, and Yanolja all market AI capabilities
    - Enterprise software rivals
    - Mixed
    - AI becomes table stakes rather than unique differentiation
  - - Local travel brand equity
    - Yanolja remains Korea-native and travel-specific
    - Yanolja advantage
    - Positive
    - Can offset some scale disadvantage in domestic demand capture
  - - B2C + B2B bridge
    - Yanolja links traveler demand and hotel software
    - Yanolja advantage
    - Positive
    - Creates a narrative most single-sided rivals lack
  - - Opaque pricing and unit economics
    - Most enterprise contracts are quote-led and OTA economics are not fully visible
    - Whole market
    - Mixed
    - Harder for outsiders to judge whether moat converts into superior margins
  - - Switching cost uncertainty
    - Hotels may face migration pain but also want open APIs
    - Whole market
    - Mixed
    - Lock-in may be real, but it is not monopolistic for cloud-native operators
  notes: The register combines moat-supporting signals and erosion risks. Competitive durability depends on whether Yanolja’s dual-sided model actually translates into lower CAC or higher software ROI than rival ecosystems provide.
