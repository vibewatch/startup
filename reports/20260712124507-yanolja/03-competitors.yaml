- id: competitive-moat-and-risk
  title: Moat Durability, Pricing Pressure, and Lock-in Risk
  body: 'Yanolja’s moat is real but conditional. Its local Korean travel brand, domestic demand density, and growing enterprise footprint create a bridge that many rivals do not have. A global OTA may have much larger scale but weaker Korean brand intimacy; a hotel-software vendor may have stronger operational tooling but less consumer-demand data. That bridge is the best argument for Yanolja. The problem is that every side of the market is getting harder. Consumer platforms are leaning on search, subscriptions, logistics, and mobility bundles to reduce acquisition costs. Software rivals are leaning on cloud migration, integration breadth, open APIs, and AI-native automation to raise switching costs. Public evidence also leaves pricing opaque: much of the market now competes through dynamic consumer offers, negotiated hotel contracts, subscriptions, or quote-led enterprise packages rather than list-price transparency. Investors should therefore treat Yanolja’s competitive position as promising
    but not locked in. The company must keep proving that its category focus, travel data, and dual-sided platform create better economics than either broad consumer ecosystems or best-of-breed hospitality stacks can produce alone.'
