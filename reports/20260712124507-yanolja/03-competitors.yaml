  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public pricing transparency
    missingEvidence: Current, directly comparable take-rate, commission, or SaaS list-price data across Yanolja and peers.
    whyItMatters: Pricing power is central to moat durability, but most retrieved sources emphasize positioning rather than transparent unit economics.
    diligencePath: Collect management proposals, supplier contracts, or hotel-software pricing sheets from field interviews.
    relatedQuestionRefs:
    - QP019
  - type: private-evidence-only
    severity: material
    topic: korean rival economics
    missingEvidence: Travel-category revenue or take-rate contribution from Naver, Kakao, and Coupang.
    whyItMatters: Without category-level economics it is hard to judge how aggressively these ecosystems can subsidize travel features.
    diligencePath: Request segment disclosures or interview channel partners and sellers.
    relatedQuestionRefs:
    - QP020
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: win-loss data
    missingEvidence: Yanolja Cloud win-loss rates against Oracle, Mews, Cloudbeds, and other hotel-tech vendors.
    whyItMatters: Platform narratives do not prove whether Yanolja actually wins competitive bake-offs in its target segments.
    diligencePath: Request CRM win-loss reports and reference-call notes from sales leadership.
    relatedQuestionRefs:
    - QP021
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: minor
    topic: source of differentiation
    missingEvidence: Quantitative proof of how much Yanolja’s demand data improves conversion, pricing, or upsell versus peers.
    whyItMatters: The strategic bridge between B2C demand and B2B software is plausible, but the public record does not quantify its economic impact.
    diligencePath: Ask management for cohort analyses tying consumer demand data to hotel-operator ROI.
    relatedQuestionRefs:
    - QP022
  - type: conflicting-data
    severity: material
    topic: valuation benchmark pressure
    missingEvidence: A reconciled framework translating Yanolja’s private KPIs into the same investor language used for public OTA and hotel-tech comps.
    whyItMatters: Without apples-to-apples KPI mapping, large public-comparable valuations may either overstate or understate Yanolja’s actual competitive quality.
    diligencePath: Build a comparable-company bridge using revenue mix, growth, margins, and customer metrics from management materials.
    relatedQuestionRefs:
    - QP025
