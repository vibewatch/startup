summary:
  headline: >
    Yanolja combines a valuable Korean travel-platform franchise with a promising higher-margin enterprise software
    engine, but the frequently cited US$10B valuation looks stretched versus public travel-platform comps and the
    company’s still-limited disclosure depth.
