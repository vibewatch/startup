  topStrengths:
    - Leading Korea travel brand with broad consumer reach across lodging, flights, leisure, and memberships
    - Enterprise Solutions is now about one-third of revenue and materially more profitable than the consumer platform
    - Large strategic backers including Booking Holdings, GIC, and SoftBank validated the company’s strategic importance
    - Crossed KRW 1 trillion of annual revenue and remained positive on adjusted EBITDA
    - AI, data, and global distribution capabilities create a plausible path to higher-quality enterprise monetization
  topRisks:
    - >-
      US$10B implies roughly 14x trailing revenue on reported 2025 revenue, materially above Booking, Airbnb, Expedia,
      and Trip.com public comp proxies
    - >-
      Public disclosure still omits cap-table detail, net cash / debt, enterprise ARR, retention, and a clean cash-flow
      bridge
    - >-
      Enterprise Solutions is still only about one-third of revenue, so Yanolja is not yet a pure software multiple
      story
    - Qoo10 / Interpark Commerce receivable exposure adds a cash-quality and governance overhang
    - IPO timing remains flexible, which suggests valuation and market-window risk are still unresolved
  unresolvedGaps:
    - Fully diluted cap table, liquidation preferences, and control rights by investor class are not public
    - Net cash, debt schedule, working-capital profile, and receivable aging are not publicly disclosed
    - 2026 interim trading and current booking momentum are not public enough to anchor a live IPO valuation
    - Enterprise ARR, churn, net retention, and customer concentration remain private
    - A banker-grade EV comp model with normalized cash / debt adjustments was not publicly available
