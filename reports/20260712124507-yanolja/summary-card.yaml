company:
  name: Yanolja
  website: https://www.yanolja.com
  sector: Consumer / Travel Technology
  stage: Late-stage private / unicorn
  headquarters: Seoul, South Korea
  shortDescription: |
    Yanolja is South Korea’s best-known travel super-app and a growing global hospitality-software
    platform. Public evidence shows a Korean consumer marketplace spanning lodging, flights,
    leisure, and memberships alongside a higher-margin Enterprise Solutions business selling cloud,
    distribution, data, and AI-enabled operating tools to travel businesses worldwide. The company
    raised $180M from GIC and Booking Holdings in 2019, received about $1.75B from SoftBank
    Vision Fund 2 in 2021, crossed KRW 1 trillion of annual revenue in 2025, and continues to
    explore an eventual U.S. listing while remaining private.
