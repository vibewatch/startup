  title: Regulation is moving faster than public disclosure depth
  body: Yanolja’s public narrative emphasizes growth, AI, and global scale, but the Korean legal backdrop now expects faster incident reporting, higher executive accountability, and more platform-process transparency than the company publicly documents.
