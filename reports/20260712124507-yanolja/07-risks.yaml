- id: TR002
  title: Platform and consumer-protection risk register
  columns:
  - Risk theme
  - Observed Korean direction
  - Why Yanolja is exposed
  - Severity
  - What to test
  rows:
  - - Algorithmic transparency
    - BKL and proposed platform rules point toward search and recommendation disclosure
    - Marketplace ranking, promotions, and travel discovery depend on algorithmic choices
    - high
    - Ask for ranking-governance, override logs, and merchant appeals process
  - - Self-preferencing / tying / MFN scrutiny
    - Cleary and NBR flag self-preferencing, MFN, tying, and multi-homing restrictions as target conduct
    - Yanolja can influence traffic allocation between owned inventory, merchants, and partner products
    - medium-high
    - Review merchant terms, parity clauses, and inventory-prioritization logic
  - - Dark-pattern enforcement
    - BKL notes amended e-commerce law and KFTC dark-pattern enforcement trend
    - Urgency cues, discount framing, refunds, and checkout design can all be scrutinized
    - medium-high
    - Inspect UX review process, complaint logs, and refund-dispute metrics
  - - Commission and external-payment rules
    - BKL describes pressure for fee transparency and nondiscriminatory payment treatment
    - Merchant monetization may need redesign if rules tighten
    - medium
    - Review fee disclosures, payment-choice flows, and partner complaints
  - - Travel-platform enforcement precedent
    - Korea Times reported fines on Trip.com under e-commerce law
    - Travel interfaces are not exempt from consumer-law scrutiny
    - medium
    - Map travel-product flows against Korean cancellation, disclosure, and refund obligations
  notes: These are not abstract DMA-style talking points; they are the conduct areas most likely to change product and monetization design in Korea.
