- id: TR005
  title: Mitigation priorities and investment kill triggers
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Investment implication
  rows:
  - - Privacy / security failure
    - Material incident or regulator action
    - Undisclosed breach, major enforcement inquiry, or repeated incident pattern
    - Pause underwriting until root-cause and remediation evidence is provided
  - - Marketplace conduct challenge
    - KFTC or consumer-law action
    - Formal action tied to ranking, pricing, refunds, or merchant treatment
    - Cut marketplace-margin assumptions and increase legal reserve expectations
  - - Receivable recovery failure
    - Qoo10 / Interpark receivable deterioration
    - Recovery slips materially or impairment rises
    - Reduce equity value for weaker cash conversion and governance confidence
  - - AI-control immaturity
    - Weak documentation on model governance
    - No clear review, override, monitoring, or complaint process for AI-led workflows
    - Do not pay a premium for AI narrative until controls are verified
  - - IPO-readiness gap
    - Disclosure systems trail strategy
    - Management cannot provide segmented, auditable, and jurisdiction-consistent data
    - Treat Yanolja as a private company with public-market ambitions, not as public-ready
  notes: Kill triggers are written as observable diligence events so the risk chapter can directly inform investment process discipline.
  claimRefs:
  - CR040
  - CR041
  - CR042
