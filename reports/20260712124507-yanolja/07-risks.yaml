tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Obligation / change
  - Why it matters for Yanolja
  - Public evidence
  - Residual exposure
  - Diligence path
  rows:
  - - PIPA administrative penalties can reach up to 10% of total revenue in specified cases
    - A large travel-and-software platform faces meaningful financial downside if privacy controls fail
    - Kim & Chang, DLA Piper, and Chambers all describe materially tougher Korean privacy enforcement
    - Public record does not show Yanolja penalty-scenario planning
    - Request privacy-risk register, control owners, and regulator-interaction history
  - - Broader breach definition and notice obligations
    - Travel, payments-adjacent, and cloud workflows create many potential notification triggers
    - Kim & Chang and DLA Piper describe expanded notice scope
    - No public incident-response metrics or breach playbooks disclosed
    - Review breach-severity thresholds, tabletop cadence, and notice templates
  - - Cross-border transfer consent and disclosure requirements
    - Yanolja markets globally and likely moves traveler and enterprise data across borders
    - DLA Piper, Chambers, and Pureum all highlight disclosure-heavy transfer rules and limited exceptions
    - Actual data-locality architecture is not public
    - Request transfer maps, SCC equivalents, and localization exceptions by market
  - - Network Act 24-hour reporting and response-manual duties
    - Fast incident reporting raises operating pressure and governance burden
    - Kim & Chang and BKL describe the 24-hour rule and manual requirements
    - No public evidence of response-SLA performance
    - Review incident command structure and MSIT/KISA reporting ownership
  - - Executive-level CISO and information-security committee requirements
    - Cyber accountability is moving upward into management and board structures
    - Kim & Chang and KLRI describe executive CISO and committee obligations
    - Public governance pages do not show how security oversight is implemented internally
    - Request committee charter, budget authority, and board reporting pack
  notes: The register focuses on the Korean rules most likely to move directly into cost, operational friction, or reputational damage for Yanolja.
