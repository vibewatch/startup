- id: TR004
  title: AI, data, and global operating-risk map
  columns:
  - Exposure
  - Evidence in public materials
  - Failure mode
  - Residual concern
  rows:
  - - Dynamic pricing and personalization
    - OpenAI and Google Cloud materials describe demand forecasting, pricing, and recommendation use cases
    - Opaque or biased pricing logic could trigger consumer or platform scrutiny
    - No public model-governance framework disclosed
  - - Workflow automation and AI agents
    - AWS, BusinessKorea, and THRIVE materials describe AI agents and automated hotel operations
    - Automation mistakes can create service errors, complaints, or enterprise liability
    - Public evidence lacks human-override and auditability detail
  - - Global data movement
    - Go Global, enterprise footprint, and cross-border travel workflows imply extensive international transfer activity
    - Localization or transfer-rule breaches could multiply by jurisdiction
    - Architecture, subprocessors, and data-residency choices are not publicly mapped
  - - Enterprise uptime and service quality
    - Yanolja Cloud is positioned as operational infrastructure for hotels and travel sellers
    - An outage or integration failure can hit customers in live travel operations
    - No public uptime, incident, or SLA disclosure
  notes: Strategic product upside and regulatory exposure are linked because the same AI features that expand margin potential also increase explainability and control requirements.
  claimRefs:
