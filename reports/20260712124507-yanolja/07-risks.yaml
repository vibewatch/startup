- id: TR003
  title: Yanolja-specific execution and governance risks
  columns:
  - Issue
  - Current public signal
  - Why it matters
  - Mitigation visible publicly
  - Open question
  rows:
  - - Qoo10 / Interpark Commerce receivable recovery
    - BusinessKorea reported about KRW 168 billion still owed plus additional unpaid funds
    - Delayed recovery can pressure cash conversion and distract management
    - Management said capital flow was unaffected and collateral was secured
    - When will recovery conclude and what impairment assumptions are being used?
  - - IPO-readiness and disclosure controls
    - U.S. office, Delaware entity, IR cadence, and capital-markets hiring suggest public-market preparation
    - Cross-border listing prep raises governance, disclosure, and legal-consistency demands
    - Formal governance and IR surfaces now exist
    - How mature are internal controls, segment reporting, and audit readiness?
  - - M&A and integration complexity
    - Interpark and Go Global expanded scope beyond a single Korea OTA
    - Integration errors can erode focus and dilute synergies
    - Management keeps emphasizing platform and enterprise convergence
    - What revenue and margin contribution comes from each acquired business?
  - - Leadership and succession depth
    - New leadership structure and global expansion imply more distributed management
    - Execution risk rises if key decisions remain concentrated
    - Public board committees and executive appointments are visible
    - What are succession plans for founder and platform leaders?
  - - Compliance ownership across B2C, B2B, and global units
    - Public record shows scale but not the control operating model
    - Fragmented ownership would raise error rates as regulations tighten
    - Governance page suggests formal oversight exists
    - Is privacy/security ownership centralized or regionalized, and how is it audited?
  notes: The company-specific risks are less about category demand and more about whether scale, structure, and control systems are keeping up with strategic ambition.
