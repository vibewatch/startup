  evidenceGaps:
  - type: private-evidence-only
    severity: high
    topic: incident history and cyber-control maturity
    missingEvidence: A management-grade incident log, tabletop cadence, and regulator-interaction history are not public.
    whyItMatters: Without incident-history detail, investors cannot distinguish between clean operations and simply undisclosed problems.
    diligencePath: Request three-year incident register, root-cause reviews, and evidence of MSIT/KISA reporting processes.
    relatedQuestionRefs:
    - QR024
  - type: private-evidence-only
    severity: high
    topic: cross-border transfer architecture
    missingEvidence: Yanolja does not publicly map which data sets move across borders, where they are stored, or which subprocessors handle them.
    whyItMatters: Localization and transfer compliance cannot be underwritten from policy summaries alone.
    diligencePath: Request data-flow maps, subprocessor list, residency exceptions, and transfer-governance approvals by jurisdiction.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR001
    - TR004
  - type: private-evidence-only
    severity: medium
    topic: AI model-governance controls
    missingEvidence: Public materials describe AI use cases but not review gates, override rights, monitoring, or bias / complaint management.
    whyItMatters: Investors should not capitalize AI upside without knowing how algorithmic decisions are governed operationally.
    diligencePath: Request model inventory, approval workflow, human-override standards, audit logs, and exception-handling metrics.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: medium
    topic: Qoo10 receivable recovery timing and impairment
    missingEvidence: Public reporting does not provide a dated recovery schedule, collateral mark, or impairment assumptions for the outstanding Qoo10 exposure.
    whyItMatters: The difference between delayed recovery and economic loss is material to cash-conversion quality and governance confidence.
    diligencePath: Request receivable aging, collateral valuation support, legal recovery status, and audit treatment.
    relatedQuestionRefs:
    - QR018
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: medium
    topic: succession and control allocation
    missingEvidence: Public governance materials do not show detailed succession plans or how compliance ownership is allocated across consumer, enterprise, and international units.
    whyItMatters: Execution risk rises when strategic breadth outpaces clear management-accountability mapping.
    diligencePath: Request org chart, succession plans, RACI for privacy / security / legal by business line, and internal-audit scope.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR003
