- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to valuation
  - Action implication
  rows:
  - - IPO price talk remains near US$10B without new disclosure
    - Management or bankers market the deal near last private headline with little new evidence
    - Leaves upside too reliant on narrative premium
    - Pass or insist on much stronger structure
  - - 2026 trading underwhelms
    - Interim growth, margins, or enterprise mix soften materially
    - Reduces probability of premium multiple expansion
    - Lower scenario range
  - - Qoo10 recovery deteriorates
    - Receivable impairment or long recovery delay emerges
    - Cuts confidence in cash conversion and governance discipline
    - Haircut equity value further
  - - Enterprise quality is weaker than implied
    - ARR, churn, or customer concentration do not support software-style premium
    - Removes core reason to price above OTA comp set
    - Re-rate toward lower comp band
  - - Cap table or preferences are investor-unfriendly
    - Preference stack, dilution, or control terms are worse than assumed
    - Common-equity outcome can differ sharply from headline valuation
    - Require structure protection or walk away
  notes: These triggers translate valuation skepticism into monitorable diligence events.
