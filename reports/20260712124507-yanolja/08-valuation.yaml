- id: public-comps-and-current-multiple
  title: Public OTA comparables imply that Yanolja sits at a premium even before adjusting for opacity
  body: The cleanest public cross-check is not a perfect enterprise-value model, but a simple market-cap-to-revenue comparison across the most relevant listed travel platforms. CompaniesMarketCap data for July 2026 place Booking at about US$138.2 billion of market cap on US$27.7 billion of TTM revenue, Airbnb at US$88.2 billion on US$12.6 billion, Expedia at US$32.5 billion on US$14.7 billion, and Trip.com at US$27.0 billion on US$8.8 billion. That translates into approximate public revenue multiples of 5.0 times, 7.0 times, 2.2 times, and 3.1 times, respectively, with a median near 4.0 times. Yanolja’s implied roughly 14.0 times trailing revenue multiple is therefore not just a little rich; it is materially outside the public OTA set. The bullish rebuttal is that Yanolja deserves some premium because its enterprise software and data layer carries higher margins and because its Korean leadership is strategically scarce. That argument has merit, but the premium is hard to stretch all the
    way to a multiple roughly twice Airbnb’s and several turns above Booking while Yanolja is still only about one-third enterprise by revenue and continues to disclose non-K-IFRS rather than fully public-company-grade valuation inputs.
