  evidenceGaps:
  - type: private-evidence-only
    severity: high
    topic: cap table and liquidation preferences
    missingEvidence: The public record does not disclose Yanolja’s fully diluted share count, liquidation preferences, or control rights by investor class.
    whyItMatters: A headline valuation can materially overstate common-equity value if preferences, dilution, or control terms are heavy.
    diligencePath: Request current cap table, option pool, preferred share terms, and board-rights summary.
    relatedQuestionRefs:
    - QV026
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: high
    topic: cash, debt, and working capital
    missingEvidence: Public sources do not provide net cash, debt maturity, receivable aging, or a cash-flow bridge that reconciles adjusted EBITDA to cash generation.
    whyItMatters: Equity value cannot be bridged from revenue and EBITDA narratives without balance-sheet and working-capital evidence.
    diligencePath: Request monthly cash bridge, debt schedule, receivable aging, and working-capital seasonality.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: medium
    topic: 2026 interim trading
    missingEvidence: There is no public first-half 2026 revenue, bookings, or segment update detailed enough to test whether 2025 momentum continued into the current IPO window.
    whyItMatters: Valuation should key off current trajectory, not just year-end 2025 results.
    diligencePath: Request year-to-date financials, monthly bookings, and segment performance through the latest closed period.
    relatedQuestionRefs:
    - QV028
  - type: private-evidence-only
    severity: high
    topic: enterprise ARR, retention, and concentration
    missingEvidence: Public evidence does not disclose ARR, NRR, GRR, top-customer concentration, or contract-duration data for the enterprise business.
    whyItMatters: These metrics determine whether Yanolja deserves a software-style premium instead of an OTA-style discount.
    diligencePath: Request cohort analysis, ARR waterfall, renewal calendar, top-customer exposure, and churn by segment.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: medium
