- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / path
  rows:
  - - Cap table and preferences
    - Fully diluted share count, liquidation stack, investor rights
    - Determines true common-equity value at any headline price
    - Legal + finance data room
  - - Cash, debt, and working capital
    - Net cash, debt schedule, receivable aging, seasonality
    - Needed to bridge equity value from revenue narrative
    - Finance diligence
  - - 2026 interim performance
    - First-half revenue, segment mix, profitability, booking trends
    - Tests whether 2025 momentum is continuing into IPO window
    - Management update or quarterly materials
  - - Enterprise quality metrics
    - ARR, churn, NRR, top-customer concentration, contract duration
    - Determines whether Yanolja deserves software-like premium treatment
    - RevOps + finance diligence
  - - Segment-to-cash bridge
    - How adjusted EBITDA translates into operating cash and reinvestment needs
    - Prevents paying a premium for non-cash or low-quality earnings
    - Finance + audit diligence
  notes: These are the minimum missing items before a disciplined investor should underwrite anything close to the most aggressive valuation narrative.
