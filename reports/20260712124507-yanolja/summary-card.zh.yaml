  topStrengths:
    - 韩国头部旅游品牌，触达住宿、机票、休闲和会员等广泛消费场景
    - Enterprise Solutions 已贡献约三分之一收入，利润率明显高于消费平台
    - Booking Holdings、GIC、SoftBank 等大型战略股东背书了公司的战略价值
    - 年收入跨过 KRW 1 万亿，调整后 EBITDA 仍为正
    - AI、数据和全球分销能力，让企业端变现质量继续抬升具备可行路径
  topRisks:
    - 按已披露的 2025 收入算，US$10B 约对应过去十二个月收入的 14x，明显高于 Booking、Airbnb、Expedia 和 Trip.com 等上市可比公司
    - 公开披露仍缺股权结构细节、净现金 / 债务、企业 ARR、留存率和清晰的现金流桥接
    - Enterprise Solutions 仍只占约三分之一收入，Yanolja 还不能按纯软件公司倍数定价
    - Qoo10 / Interpark Commerce 应收款敞口拖累现金质量，也带来治理阴影
    - IPO 时间仍有弹性，说明估值和市场窗口风险尚未解决
  unresolvedGaps:
    - 完全稀释股权结构、清算优先权和各类投资人的控制权尚未公开
    - 净现金、债务期限表、营运资本画像和应收账款账龄没有公开披露
    - 2026 年中期交易表现和当前预订动能披露不足，难以锚定实时 IPO 估值
    - 企业 ARR、流失率、净留存和客户集中度仍未公开
    - 未见经过现金 / 债务标准化调整的投行级 EV 可比公司模型
