- id: deployment-proof-and-technical-gaps
  title: Real deployment proof is credible, but the public technical package is still incomplete
  body: The strongest external proof that Yanolja’s technology works comes from usage evidence rather than architecture white papers. HotelTechReport case studies show the software being used to compress check-in times, reduce overbookings, increase direct bookings, and improve on-the-go management. Capterra and HotelTechReport product pages describe a unified PMS, integrated booking engine, and channel manager used across properties of different sizes, while AppBrain and Google Play show that Yanolja Cloud Solution ships operational mobile apps for restaurant and hotel workflows. Those are all practical product signals. At the same time, technical diligence still hits several walls. The public sources do not expose uptime history, SLAs, security certifications, API throttling policies, multi-tenant architecture detail, or model-risk controls at a depth that would satisfy a sophisticated hospitality CIO or an infrastructure-focused investor. The correct verdict is therefore favorable on
    product breadth, deployment practicality, and AI ambition, but only medium-confidence on deep technical defensibility until management provides a fuller architecture and reliability package.
