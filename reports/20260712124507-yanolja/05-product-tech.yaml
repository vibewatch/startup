  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: architecture and tenancy
    missingEvidence: Reference architecture, tenancy model, service boundaries, and infrastructure topology for the cloud hospitality stack.
    whyItMatters: These details determine scalability, upgrade complexity, and isolation risk for enterprise deployments.
    diligencePath: Request architecture diagrams, tenancy documentation, and deployment reference patterns from engineering.
    relatedQuestionRefs:
    - QE019
    - QE025
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: reliability and SLA
    missingEvidence: Published SLA commitments, uptime history, incident postmortems, and disaster-recovery architecture.
    whyItMatters: Hotels and travel operators depend on continuous availability across reservations, distribution, and guest operations.
    diligencePath: Request SLA schedules, support matrices, incident metrics, and DR test results.
    relatedQuestionRefs:
    - QE020
    - QE025
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: security and model governance
    missingEvidence: Security certifications, privacy-engineering details, model-evaluation methods, hallucination controls, and data-governance documentation for AI features.
    whyItMatters: AI-driven travel operations touch sensitive customer, payment-adjacent, and property data, so governance quality matters for enterprise adoption.
    diligencePath: Request security white papers, audit reports, model-risk policies, and privacy-by-design documentation.
    relatedQuestionRefs:
    - QE021
    - QE025
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: open developer experience
    missingEvidence: A public sandbox, auth documentation, versioning policy, rate limits, and SDK references for external developers.
    whyItMatters: Without these materials, it is difficult to judge whether Yanolja’s platform can scale integrations efficiently beyond assisted enterprise onboarding.
    diligencePath: Ask product and developer-relations teams for sandbox access, API references, and change-management policies.
    relatedQuestionRefs:
    - QE011
    - QE012
    - QE013
    - QE025
    relatedTableRefs:
    - TE003
    - TE005
