company:
  name: Yanolja
chapter:
  number: 5
  title: Product & Technology
  summary: Yanolja’s product stack now clearly spans a consumer travel app, a hospitality operating system, and an AI-enabled data and distribution layer. Public sources show practical product breadth across booking, PMS, channel management, kiosks, POS, B2B distribution, and AI automation, with enterprise solutions increasingly positioned as a vertical software platform rather than a narrow hotel tool. The main diligence limits are that Yanolja still exposes only selective technical documentation publicly, offers contact-led integration onboarding instead of a broad open developer portal, and does not publicly detail architecture, security controls, uptime, or model-governance internals at the depth a technical buyer or investor would ideally want.
sections:
- id: platform-surface-and-product-modules
  title: The product surface now spans consumer travel, hospitality operations, and B2B distribution
  body: 'Yanolja’s public product footprint is broader than a conventional OTA and broader than a single PMS vendor. The consumer side centers on the NOL app and Yanolja’s domestic travel interfaces, which bundle flights, accommodation, leisure, performances, and promotions into one mobile surface. On the enterprise side, the company’s cloud hospitality offering is framed as an integrated operating environment covering reservations, front office, housekeeping, channel distribution, booking conversion, and increasingly kiosks and monitoring systems through subsidiaries such as SanhaIT. The travel-distribution layer adds another dimension: Yanolja Go Global links hotels, agencies, and tour operators across large international networks rather than only helping one property run its back office. This matters because it means Yanolja is trying to own both demand capture and supply-side tooling, with data flowing across both. The technical picture is still described more at the solution level than
    at the architecture-diagram level, but the public evidence is enough to say Yanolja has become a multi-surface travel operating stack rather than a single booking product.'
  claimRefs:
