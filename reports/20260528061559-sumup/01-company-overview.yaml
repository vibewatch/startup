  - id: leadership-and-governance
    title: Leadership and Governance
    body: >-
      SumUp was co-founded in 2012 by a small team including Marc-Alexander Christ, who
      subsequently served as the company's CFO through at least mid-2022. By December 2023,
      Hermione McKee had taken on the Group CFO role, a position she still held as of October
      2025. The company does not publicly identify a single "Group CEO" in its investor press
      releases—a notable governance opacity for a company of its scale and IPO ambitions.


      At the operating company level, SumUp Limited (the Irish entity and EU gateway) appointed
      Niall Mac an tSionnaigh as CEO following his prior role as COO of SumUp Limited and VP
      of Global Operations; he joined SumUp in 2022 from LinkedIn. Gareth Walsh, a twelve-year
      SumUp veteran, transitioned from CEO of SumUp Limited to non-executive director and now
      serves as chair of the holding company board. The commercial organisation is led by
      Luke Griffiths as Chief Commercial Officer (as of December 2025), with Pierre Lion
      appointed Global Director of Enterprise Sales in March 2025 (formerly CGO at Mangopay),
      reflecting the push into large-merchant segments. Felix Lamouroux serves as SVP Global
      Banking, overseeing the rapidly growing business account product.


      Co-founder Marc-Alexander Christ remains closely involved in strategic decisions (cited
      in the March 2025 enterprise announcement), creating a meaningful key-person dependence
      on the founding team. The absence of a publicly named group CEO is an evidence gap that
      diligence should close before any transaction. Board composition beyond the Irish
      subsidiary is not publicly disclosed.
