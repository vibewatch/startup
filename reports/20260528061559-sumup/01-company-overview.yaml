  - id: operating-scale-and-metrics
    title: Operating Scale and Key Metrics
    body: >-
      SumUp's scale as of 2025–2026 is substantial for a private European fintech. The company
      serves more than 4 million merchants (including, per the company's own description,
      taxi drivers, coffee shop owners, and large sports stadiums) across 37 markets worldwide.
      Employees number over 3,000 from more than 90 nationalities, with offices on four
      continents. The company processes more than 1 billion transactions annually (as cited in
      the October 2025 EU VAT Expert Group press release).


      The business account product has reached significant scale: by December 2025 SumUp had
      1.5 million active business account users holding over €1 billion in aggregate merchant
      deposits—a meaningful indicator of merchant stickiness and a growing deposit base that
      underpins the lending product. Over 250,000 SMEs have received financing through SumUp's
      instant financing product, which is backed in part by a $100 million credit facility from
      Victory Park Capital (VPC) secured in mid-2023.


      Revenue data: SumUp does not publicly disclose revenues, but the company stated revenues
      grew more than 60% annually in the two years preceding June 2022, and maintained over
      30% top-line growth through 2023. No audited financials are publicly available; the
      €703 million revenue estimate cited by some third-party data aggregators for 2026 is
      unverified. Gross margins and NRR are also undisclosed. These gaps are material for
      valuation work.
