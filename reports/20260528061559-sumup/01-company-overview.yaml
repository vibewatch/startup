  - id: funding-history-and-capital-structure
    title: Funding History and Capital Structure
    body: >-
      SumUp's capital structure is unusual for a company of its scale: the large majority of
      its cumulative financing has been debt rather than equity, which has kept dilution low
      for founders and early investors but creates an ongoing debt-service obligation and
      refinancing risk. Co-founder Christ stated in June 2022 that less than €100 million of
      SumUp's then-cumulative €1.5 billion raised was equity before the 2022 round.


      Key rounds: In March 2021, SumUp raised €750 million in debt—one of the largest debt
      financings ever for a private European startup at the time. In June 2022, SumUp raised
      €590 million ($624 million) at an enterprise value of €8 billion ($8.5 billion); the
      round was led by Bain Capital Tech Opportunities with participation from BlackRock,
      btov Partners, Centerbridge, Crestline, Fin Capital, and Sentinel Dome Partners. This
      round was a hybrid of 50% equity and 50% debt. In December 2023, SumUp raised
      €285 million ($307 million) led by Sixth Street Growth, with further participation from
      Bain Capital Tech Opportunities, Fin Capital, and Liquidity Group. This round was
      predominantly equity and confirmed an up-round vs. the €8 billion 2022 valuation,
      though the precise new valuation was not disclosed. In May 2024, SumUp completed a
      US$1.6 billion private credit (debt) transaction led by Goldman Sachs—one of the largest
      European private credit deals of its kind—which was used to refinance existing debt and
      is therefore not incremental equity-based funding. Additional participants in the 2024
      credit included AllianceBernstein, Apollo Global Management, Arini, Deutsche Bank AG,
      Fortress Investment Group, SilverRock Financial Services, and Vista Credit Partners,
      alongside existing lenders BlackRock, Crestline, Liquidity Capital, Oaktree Capital
      Management, Sentinel Dome, and Temasek.


      In mid-2023, secondary market activity provided a discordant signal on valuation: Groupon
      disclosed in a SEC filing that it was selling SumUp shares at a price implying just
      €3.9 billion enterprise value—less than half the 2022 headline valuation. SumUp's
      December 2023 primary round was framed as confirming an up-round vs. €8 billion, but
      the secondary-market discount is a material red flag for any diligence exercise.
