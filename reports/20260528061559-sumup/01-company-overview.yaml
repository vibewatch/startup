  - id: ma-and-expansion-milestones
    title: M&A History and Expansion Milestones
    body: >-
      SumUp has been an active acquirer since at least 2018, using debt-financed capital to
      expand its product portfolio and geographic footprint inorganically. Key acquisitions
      include: Debitoor (accounting/invoicing, 2018); Shoplo (e-commerce marketplace tooling,
      2019); Payleven (a Rocket Internet-incubated Square clone, integrated as part of European
      expansion, exact date undisclosed); Goodtill (London-based POS software for hospitality/
      restaurants, November 2020, undisclosed amount, processed £500 million+ in transactions
      per year and served Uber Boat, Edinburgh Fringe, SSE Wembley Arena, and Leicester City
      FC among others); Tiller (French POS software for restaurants, undisclosed amount and
      date); and Fivestars (US payments and loyalty platform, October 2021, $317 million in
      cash and stock—SumUp's largest disclosed acquisition and its first in the US, giving it
      70 million consumer loyalty members and 12,000 merchant relationships).


      On organic expansion, SumUp launched Peru in June 2022 (35th market), Australia in
      August 2023 (36th market), and reached 37 markets by 2025. The company launched
      girocard acceptance in Germany in August 2025, removing the last gap in German card
      acceptance. In October 2025, SumUp was appointed to the European Commission's VAT
      Expert Group, reflecting its growing regulatory influence. By December 2025, SumUp
      announced cash deposit capabilities and local IBAN plans, representing a meaningful step
      toward becoming a full-service EU bank for SMBs.


      The enterprise push began in earnest around 2025: SumUp became official payment processor
      for The O2 arena in London and hired Pierre Lion in March 2025 to lead enterprise sales.
      This shift from SMB-only to multi-segment positioning is a strategic inflection point
      with competitive implications for SumUp's pricing, sales motion, and product roadmap.
