company:
  name: SumUp

chapter:
  number: 1
  title: Company Overview
  summary: >-
    SumUp is a London-registered, Berlin-anchored global fintech founded in 2012 that provides
    card payment hardware, business accounts, lending, and POS software to over 4 million
    merchants across 37 markets. The company has raised over €2.4 billion in disclosed capital
    (dominated by debt), achieved EBITDA profitability since December 2022, and is actively
    exploring an IPO at a $10–15 billion target valuation while its last equity round implied
    €8 billion—creating a meaningful gap with a 2023 secondary market print of €3.9 billion.

sections:
  - id: identity-and-business-model
    title: Company Identity and Business Model
    body: >-
      SumUp was founded in 2012 with the mission to empower small merchants worldwide by making
      affordable, easy-to-use payment solutions accessible to businesses of any size. Incorporated
      in England on 7 November 2011 as Ka-Ching Payments Limited (renamed to SumUp Payments
      Limited in February 2013, Companies House number 07836562), the company's registered office
      is at 16–20 Shorts Gardens, London, WC2H 9US. Its primary operational hub is Berlin,
      with additional offices in Amsterdam, Barcelona, Cologne, London, São Paulo, Santiago,
      Boulder (Colorado), and El Paso (Texas), spread across more than 20 offices on four
      continents.


      SumUp's core product is a card reader that allows small merchants to accept in-person
      payments via smartphone, supplemented by a growing "Super App" that bundles a free
      business account and Mastercard, online store, invoicing, gift cards, payment links,
      and merchant cash advances. The company earns revenue primarily through a per-transaction
      fee model with no monthly hardware rental, and layers in subscription revenue through
      SumUp One (a bundled membership plan) and SaaS software for POS restaurant/retail
      systems. SumUp operates as a regulated payment and e-money institution in the UK (FCA)
      and as a regulated entity through its Irish subsidiary SumUp Limited in the EU—the Irish
      entity is SumUp's gateway for European market operations.


      As of May 2026, SumUp serves more than 4 million merchants in 37 markets, employs over
      3,000 people from more than 90 nationalities, and has achieved EBITDA profitability since
      December 2022 while maintaining over 30% top-line growth year-over-year through 2023.
      The company is pursuing dual strategic thrusts: deepening financial services (business
      banking, lending, insurance) for its existing SMB base, and expanding into enterprise and
      large-merchant segments (stadiums, concert venues, national retail chains).
