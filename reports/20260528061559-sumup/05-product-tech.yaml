- id: FE002
  title: Customer workflow / operating flow
  type: flow
  layout: wide
  summary: How a merchant can move from onboarding into checkout, payout, operations, retention, and financing inside the current SumUp stack.
  data:
    nodes:
    - id: setup
      label: Account setup
      description: Merchant sets up SumUp account, app, catalog, and optionally a reader or POS package.
    - id: acceptance
      label: Choose acceptance mode
      description: Merchant picks Solo Lite, Solo, Terminal, POS, Kiosk, or Tap to Pay based on complexity and hardware needs.
    - id: payment
      label: Take payment
      description: Customer taps, inserts, swipes, or pays remotely through invoices, links, or online checkout.
    - id: proof
      label: Send proof / follow-up
      description: Merchant sends digital receipts, invoices, links, or order confirmations and can continue the conversation remotely.
    - id: settlement
      label: Settle to merchant money layer
      description: Funds settle into payouts or Business Account flows that connect to cards, transfers, and deposits.
    - id: ops
      label: Run operations
      description: Merchant uses POS, reports, inventory, bookings, and online store tools to manage daily operations.
    - id: retention
      label: Drive repeat usage
      description: Loyalty, Local app, promotions, and service bookings turn one-off payments into repeat spend.
    - id: finance
      label: Expand treasury / financing
      description: Cash Advance and newer banking features deepen merchant dependence on the platform.
    edges:
    - from: setup
      to: acceptance
    - from: acceptance
      to: payment
    - from: payment
      to: proof
    - from: payment
      to: settlement
    - from: settlement
      to: ops
    - from: ops
      to: retention
    - from: retention
      to: payment
    - from: settlement
      to: finance
