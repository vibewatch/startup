  evidenceGaps:
  - type: missing-source
    severity: material
    topic: solo-plus-sku
    missingEvidence: A current official SKU map or deprecation note that confirms whether Solo+ remains a distinct product, bundle name, or retired surface.
    whyItMatters: Hardware portfolio clarity affects migration planning, pricing comparisons, and spare-parts / support assumptions for merchants upgrading from older reader generations.
    diligencePath: Ask product and hardware ops for the current SKU catalog, regional reader matrix, and any Solo-to-Terminal migration guidance.
    relatedQuestionRefs:
    - QE005
    relatedTableRefs:
    - TE001
  - type: private-evidence-only
    severity: material
    topic: reliability-metrics
    missingEvidence: Historical uptime, incident counts, RMA / hardware-failure rates, and published SLOs for readers, POS, Kiosk, and Cloud API.
    whyItMatters: Enterprise buyers need evidence that SumUp can operate a broader, hardware-heavy commerce stack without hidden downtime or field-support burden.
    diligencePath: Request status-history exports, post-mortems, RMA statistics, and service-level commitments by product line.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: banking-and-acquiring-dependencies
    missingEvidence: A market-by-market map of acquirers, processors, safeguarding banks, cash-deposit partners, and core banking / ledger providers.
    whyItMatters: Those counterparties shape margin, outage concentration, regulatory exposure, and geographic expansion speed, but the public surface only shows fragments such as rails and permissions.
    diligencePath: Ask payments ops and treasury for the current scheme / acquirer matrix, safeguarding-bank roster, and any concentration thresholds.
    relatedQuestionRefs:
    - QE027
    relatedTableRefs:
    - TE003
  - type: stale
    severity: material
    topic: pos-security-attestation
    missingEvidence: Updated PCI, penetration-test, or other third-party security attestations for the POS stack after the July 2024 SAQ-D window.
    whyItMatters: Hospitality and retail buyers increasingly treat current attestations as a procurement gate; an expired public window weakens trust even if controls remain strong internally.
    diligencePath: Request the latest SAQ / ROC evidence, pen-test summaries, vulnerability-management cadence, and any current ISO or SOC mappings for POS.
    relatedQuestionRefs:
    - QE028
    relatedTableRefs:
    - TE004
