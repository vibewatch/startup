- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / signal
  - Status
  - Scope / evidence
  - Source tier
  - Gap / implication
  rows:
  - - EEA EMI permissions
    - Public and current
    - DNB register lists e-money issuance, card transactions, credit transfers, payment instruments, and acquiring for SumUp Limited
    - Regulatory
    - Strong signal for payments scope, but not a full banking license
  - - UK safeguarding model
    - Public and current
    - Segregated safeguarding accounts, additional insurance, Faster Payments handling, and explicit non-bank positioning
    - Official
    - Protective for merchant funds, but FSCS does not apply
  - - Cloud API payment security
    - Public and current
    - Docs describe PCI compliance, end-to-end encryption, and webhook-based result updates
    - Technical docs
    - Comforting for integrations, but still self-disclosed rather than independently attested
  - - POS PCI / infrastructure note
    - Partially current
    - Goodtill page says AWS eu-west-1 hosting and PCI DSS SAQ-D valid from Jul 2019 to Jul 2024
    - Technical docs
    - Attestation recency beyond Jul 2024 is not public
  - - Merchant app reputation
    - Public and current
    - App Store shows 4.7/5 with about 13k ratings; Google Play lists the full app surface
    - Review
    - Healthy distribution signal, but app-store ratings do not prove uptime or enterprise readiness
  - - Broad merchant review base
    - Public and current
    - Trustpilot showed 4.1/5 across 43k+ reviews at fetch time
    - Review / adverse
    - Large feedback base also implies recurring support and UX complaints exist at scale
  - - Status / incident transparency
    - Public but thin
    - A dedicated status.sumup.com surface exists, but fetched public detail is sparse
    - Official
    - Public uptime history is too thin for enterprise diligence
  - - Detailed POS security artefacts
    - Restricted
    - Goodtill says deeper documentation is available only on request
    - Technical docs
    - Serious buyers will need private evidence to close diligence
  notes: This table separates what is verifiably public from what still requires private diligence. Review-platform metrics are included as trust signals, not as substitutes for regulatory or audit evidence.
