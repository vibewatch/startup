chapter:
  number: 5
  title: Product & Technology
  summary: SumUp now operates a broad merchant stack spanning readers, software POS, Tap to Pay, online checkout, business banking, and newer retention / scheduling tools. The architecture is specific enough to map—SDKs, Cloud API, mobile OS dependencies, card schemes, banking rails, safeguarding, and AWS-backed POS infrastructure are all visible—but public diligence still lacks hard uptime, hardware-supply, acquirer-routing, and post-2024 security-attestation detail.
sections:
- id: product-suite-and-merchant-jobs
  title: Product Suite and Merchant Jobs
  body: 'SumUp now presents itself less as a single card-reader company and more as a merchant operating system that spans acceptance, commerce software, and money management. The current public surface covers card readers, a standalone Solo family, POS Lite, the fuller SumUp POS stack, Kiosk, Tap to Pay, Invoices, Payment Links, Online Store, Business Account, and newer add-ons such as Bookings and Loyalty. In practice the workflow is modular: a micro-merchant can start with Solo Lite or Tap to Pay, a shop counter can move into POS Lite or the fuller POS bundle, and a higher-throughput venue can add Kiosk or Terminal while still staying inside the same Business app and reporting surface. That modularity is a real strength because it creates an upgrade path without forcing merchants to rip out tooling every time they outgrow a simple reader. The main product-portfolio caveat is hardware clarity: Solo and Solo Lite are clearly current, but the fetched official 2026 surface does not expose
    a distinct Solo+ page, so diligence should confirm whether Solo+ is a live SKU, a regional bundle name, or effectively retired.'
