- id: TE002
  title: Workflow / use-case table
  columns:
  - Merchant job
  - Current workflow pain point
  - SumUp solution
  - Evidence of benefit
  - Limitation / dependency
  rows:
  - - On-the-go seller / market trader
    - Needs low-friction card acceptance without a fixed counter
    - Solo Lite or Tap to Pay through Business app
    - No dedicated hardware for Tap to Pay; Solo Lite manages tips, refunds, and wallets
    - Tap to Pay is contactless-only; Solo Lite still needs smartphone pairing
  - - Single-counter retailer
    - Needs simple POS with inventory and sales reports
    - POS Lite + connected reader
    - $0 monthly fee and inventory/reporting workflow
    - Advanced staffing and ingredient controls are absent
  - - Restaurant / fast-casual counter
    - Needs richer ordering, loyalty, staff and online-order flows
    - Full SumUp POS + Connect
    - Marketing/loyalty, item modifiers, online ordering, customer database
    - Dedicated hardware and implementation overhead are higher than Lite
  - - Self-service QSR / venue
    - Needs faster throughput and fewer staffed order points
    - Kiosk + POS backend
    - Company claims 25% larger orders and up to 50% lower waits
    - Public proof stops at marketing statistics
  - - Service professional
    - Needs appointment scheduling, quotes, invoices, and remote payment collection
    - Bookings + Invoices + Payment Links
    - Booking page automates appointment intake and links into payment collection
    - Adoption metrics and churn for Bookings are not public
  - - Online-first merchant
    - Needs a fast storefront and fallback remote collection path
    - Online Store + Payment Links + Online Payments
    - Store adds inventory/reporting while links work without a website
    - Alternative payment method activation and economics may vary by region
  - - Merchant treasury / payouts
    - Needs payout control, spending card, and bank-like tools
    - Business Account + Mastercard + deposits / IBAN roadmap
    - Deposits exceeded €1 billion and local IBAN / cash deposit rollout is underway
    - Banking permissions and account features differ by country
  - - Retention and repeat spend
    - Needs loyalty, promotions, and repeat-customer tools without new hardware
    - Loyalty + Local app + POS/Business app data
    - No-new-hardware loyalty and autopilot win-back promotions
    - Consumer app adoption and long-term repeat-rate uplift are not public
  notes: The workflow table translates product modules into merchant jobs rather than listing SKUs alone; measurable benefits are taken from public claims and should be treated as directional until merchant cohort data is disclosed.
