- id: trust-compliance-and-developer-surface
  title: Trust, Compliance, and Developer Surface
  body: 'Public trust evidence is credible but incomplete. On the regulated-money side, the DNB register shows SumUp Limited passporting as an electronic-money institution with permissions for card transactions, credit transfers, payment-instrument issuance, and acquiring. SumUp''s safeguarding page makes the consumer-protection model explicit: funds are segregated, supported by an insurance policy, and not protected by FSCS because SumUp is not a bank. On the POS side, the ex-Goodtill security page discloses AWS hosting and PCI DSS SAQ-D coverage, but that attestation window only runs through July 2024 and newer audit evidence is not public. The developer surface is a differentiator. SumUp publishes reader SDKs, Cloud API, API reference, webhook docs, Go packages, and public GitHub repositories, including a Tap-to-Pay sample app. That matters because it suggests SumUp is trying to be embedded into partner and merchant software stacks, not just sell stand-alone hardware. The trade-off is
    that developer and merchant operations become more reliant on GitHub, app stores, mobile OS policies, and SumUp''s own documentation quality. Public review surfaces are decent rather than pristine: app-store ratings are healthy, but Trustpilot still shows large-scale complaint volume, so the trust story is good enough for SMB distribution but still below enterprise-grade transparency.'
