- id: roadmap-maturity-and-risk-judgment
  title: Roadmap, Maturity, and Risk Judgment
  body: 'The 2025–2026 release trail shows a company still adding important product surface area rather than just polishing a mature bundle. SumUp shipped direct girocard acceptance in Germany, expanded Bookings, reached banking scale milestones and added cash deposit plus local IBAN features, launched Loyalty with a consumer Local app, and introduced SumUp Pay in Ireland. Third-party coverage adds another layer: Beacon 2026 described an in-house Android Tap to Pay stack, Kiosk expansion, and wider Cash Advance rollouts; Retail Times described the new Terminal as an all-in-one handheld POS with automatic updates and more features already queued. The maturity picture is therefore uneven by module. Core acceptance, POS, and merchant banking look mature. Terminal, Loyalty, Bookings, and consumer-wallet functionality look earlier and still region-scoped. The biggest diligence risks are not whether SumUp can add features—it plainly can—but whether the company can keep the stack reliable across
    many device types and countries while also carrying banking, regulatory, and hardware complexity. Roadmap breadth is becoming a selling point, but it is also increasing integration, compliance, and support burden.'
