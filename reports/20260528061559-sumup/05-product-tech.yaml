- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Public evidence of role
  - External dependency
  - Why it matters
  - Risk / gap
  rows:
  - - Business app control plane
    - Google Play and App Store listings say one app powers readers, POS, Tap to Pay, links, invoices, banking, loyalty, online store, and bookings
    - Apple / Google app-store distribution and OS policies
    - This is the merchant control surface across most modules
    - Any app-store policy, review, or OS breakage can hit many products at once
  - - Reader hardware family
    - Solo Lite is phone-paired; Solo and Terminal are standalone devices
    - Hardware manufacturing, device connectivity, printer accessories
    - Hardware remains the anchor for in-person checkout and venue operations
    - No public contract-manufacturer, RMA, or second-source detail
  - - Tap to Pay OS layer
    - Tap to Pay requires iPhone XS+ or Android 11+ with NFC and internet
    - Apple iOS, Android, NFC stacks, device certification
    - Eliminates reader hardware for light merchants and partners
    - Contactless-only; hardware/OS fragmentation still matters
  - - POS / Kiosk software stack
    - POS, POS Lite, and Kiosk add catalog, inventory, staff, loyalty, and self-service flows
    - Tablets, touchscreens, printers, customer displays
    - This is SumUp's move from payment acceptance into operating software
    - Public deployment density and implementation time are undisclosed
  - - Integration layer
    - Reader SDKs, Cloud API, Payment Switch, REST API, and webhooks are publicly documented
    - Developer documentation quality, API stability, GitHub maintenance
    - Enables embedding into third-party apps, kiosks, and POS systems
    - No public uptime/SLA or backward-compatibility guarantees
  - - Online checkout layer
    - Online Payments docs list hosted and custom flows plus broad APM support
    - Card schemes, wallets, APMs, and browser payment flows
    - Lets SumUp serve card-not-present, invoicing, and ecommerce use cases
    - Market-by-market availability and take rates are not public
  - - Money movement layer
    - Business Account, Mastercard, ACH, Faster Payments, SEPA, cash deposit, and local IBAN features sit below acceptance
    - Banking rails, safeguarding banks, regulators
    - Deepens merchant lock-in beyond card acceptance
    - Licensing and feature availability vary across the UK, EU, and US
  - - Compliance / control layer
    - DNB EMI passporting, FCA safeguarding language, PCI SAQ-D note, and Cloud API encryption are all public
    - Regulators, safeguarding banks, PCI programs
    - Payments trust is central to merchant adoption
    - Newest attestations and acquirer routing remain opaque
  - - POS infrastructure layer
    - Goodtill security note places the backend on AWS eu-west-1
    - AWS availability and cloud-security configuration
    - Important because POS/Kiosk create more operational criticality than simple readers
    - No public multi-region failover or DR topology is disclosed
  notes: Architecture rows combine official product pages, developer docs, app-store descriptions, regulatory entries, and the Goodtill security note; the objective is to show dependency concentration and operating assumptions, not to infer unpublished internals.
