- calloutType: strength
  title: Modular upgrade path is a real product advantage
  body: Merchants can start with a low-friction reader or Tap to Pay and move into fuller POS, Kiosk, banking, and retention modules without abandoning the same app and reporting surface. That lowers migration friction and should support expansion revenue over time.
  claimRefs:
