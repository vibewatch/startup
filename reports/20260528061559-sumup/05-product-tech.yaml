- id: TE001
  title: Product module / asset matrix
  columns:
  - Module
  - Primary user / job
  - Delivery surface
  - Public maturity / status
  - Differentiation evidence
  - Key diligence gap
  rows:
  - - Solo Lite
    - Micro-merchants and mobile sellers
    - Phone-paired card reader + Business app
    - Current / live
    - Low-cost reader, app-managed refunds and catalog, all-day battery
    - No public successor / migration path beyond current reader family
  - - Solo
    - SMBs that want standalone acceptance
    - Standalone touchscreen reader
    - Current / live
    - Digital receipts, reports, printer support, 4G/Wi-Fi/offline backup
    - No public hardware-failure or warranty-return data
  - - Terminal
    - Growing hospitality / retail operators
    - All-in-one handheld POS + printer
    - Recent launch
    - Combines reader, POS, ordering, receipt printing, updates, and 4G/Wi-Fi
    - Launch evidence is mainly third-party; installed-base disclosure absent
  - - POS Lite
    - Single-location shops needing simple counter POS
    - Tablet POS with connected reader
    - Current / live
    - No monthly fee, inventory, reporting, cash + card acceptance
    - Advanced staff and operations features are excluded
  - - SumUp POS
    - Retail and restaurant teams with richer ops needs
    - Register + customer screen + software
    - Current / live
    - Staff tools, loyalty, ordering, dedicated hardware bundle
    - No public deployment counts or retention by vertical
  - - Kiosk
    - High-throughput self-service food and beverage
    - POS add-on / self-service kiosk
    - Current / expanding
    - Claims 25% larger orders, 50% lower waits, 35% higher basket via upsell
    - Benefit claims are marketing metrics with no audit detail
  - - Tap to Pay
    - Mobile sellers who want zero extra hardware
    - Software-only acceptance on phone
    - Current / live
    - No reader required, quick setup, app/SDK distribution
    - Contactless-only and dependent on NFC phone + OS support
  - - Invoices / Payment Links / Online Store
    - Remote billing and ecommerce sellers
    - Remote checkout software
    - Current / live
    - Multiple remote collection options across invoices, links, and store
    - Take-rate, settlement timing, and APM economics are not public by market
  - - Business Account & Card
    - Merchants managing payouts and spend
    - Account + debit card
    - Current in Europe / previewed in US
    - Links acquiring, payouts, spending card, deposits, cash deposit, and local IBAN roadmap
    - Availability, licensing, and limits vary materially by market
  - - Cash Advance
    - Qualified merchants needing working capital
    - Embedded financing
    - Current / expanding
    - Funding is tied into the broader merchant ecosystem
    - Underwriting rules, APRs, and loss rates are not public
  - - Loyalty / Bookings / SumUp Pay
    - Retention, services scheduling, and consumer-wallet use cases
    - Software add-ons + consumer app
    - Recent / region-scoped
    - No-new-hardware loyalty, service-booking flows, and a consumer wallet layer
    - Early rollout stage and regional coverage make durability hard to judge
  notes: Rows summarize the current public product surface using fetched official product pages, app-store descriptions, and 2025–2026 launch evidence; they do not imply equal adoption, revenue share, or geographic availability.
