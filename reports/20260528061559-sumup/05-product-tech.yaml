  - CE004
  - CE011
  - CE014
  - CE034
- calloutType: strength
  title: Developer surface makes SumUp more than a closed reader vendor
  body: Reader SDKs, Cloud API, webhook support, a public GitHub organization, and sample apps make SumUp usable inside partner POS, kiosk, and mobile-app flows. That should widen distribution beyond merchants who buy hardware directly from SumUp.
  claimRefs:
  - CE024
  - CE025
  - CE031
  - CE032
  - CE033
- calloutType: risk
  title: Reliability and concentration risk are still under-disclosed
  body: Solo and Terminal rely on Wi-Fi or mobile data, Tap to Pay relies on app stores and supported NFC phones, and the public POS security note points to AWS infrastructure. Yet SumUp does not publicly disclose uptime, failover topology, or hardware-RMA metrics at the level an enterprise buyer would normally expect.
  claimRefs:
  - CE015
  - CE028
  - CE034
  - CE048
  - CE050
- calloutType: risk
  title: Banking ambition is outpacing public transparency
  body: The regulatory and safeguarding record is real, and deposits plus local IBAN rollouts are meaningful. But SumUp still does not publicly map acquirer routing, safeguarding-bank mix, consumer-versus-merchant licensing boundaries, or the full economics of cash advances and consumer-wallet products.
  claimRefs:
  - CE021
  - CE022
  - CE047
