summary:
  headline: >-
    SumUp is a scaled and strategically relevant SMB-payments platform, but the public record still supports only a
    track call because economics, capital structure, and governance disclosure lag the valuation narrative.
  overallScore: 5.9
  recommendation: track
  confidence: medium
