company:
  name: SumUp
chapter:
  number: 8
  title: Valuation
  summary: SumUp has real scale, real profitability signals, and real strategic optionality, but the public valuation record is too contradictory to justify the reported $10-15 billion IPO narrative on current evidence. Official financing history points to an $8.5 billion 2022 round, CNBC surfaced a roughly €3.9 billion secondary print via Groupon, and later IPO reporting floated a much higher range without disclosing audited consolidated revenue or preference terms. The chapter therefore lands on TRACK, medium confidence, high risk, and a stretched valuation stance pending fuller diligence or materially better entry terms.
sections:
- id: financing-context-and-entry-discipline
  title: Financing context and entry discipline
  body: SumUp valuation starts with three incompatible public price signals rather than one clean market-clearing mark. Officially, the company raised €590 million in 2022 at an €8 billion enterprise value, then raised another €285 million in 2023 while calling the deal an up-round but not publishing a new valuation, and then refinanced $1.6 billion of private credit in 2024. Independent reporting added a much harsher datapoint when CNBC said Groupon sold SumUp shares at a price implying roughly €3.9 billion, while later Sifted and other IPO reporting floated a $10-15 billion listing ambition. That is not normal valuation noise; it is a 2x-plus spread around the same company. The practical implication is that investors should treat SumUp as a price-sensitive diligence case, not as a narrative buy. Public evidence is good enough to show a scaled, financeable merchant-payments platform with banking and enterprise optionality, but it is not good enough to underwrite the IPO headline because
    audited consolidated revenue, gross margin, debt covenants, and liquidation preferences are still missing from the open record.
