- id: thesis-antithesis-and-comparable-context
  title: Thesis, anti-thesis, and comparable context
  body: The positive side of the SumUp case is evidence-backed. The company still claims more than 4 million merchants, more than 1 billion annual transactions, 1.5 million active business-account users with more than €1 billion of deposits, and an enterprise expansion push that broadens the story beyond card readers. Management also says the company has been EBITDA-positive since late 2022. Those facts are enough to rule out a simplistic “broken fintech” narrative. The anti-thesis is that none of those facts gives investors a clean consolidated revenue denominator or a filing-grade picture of capital structure and governance. Public comp work matters here because the directly comparable acquiring and POS names—Shift4, PayPal, Block, and Toast—screen around roughly 1.0x to 2.3x revenue, while premium hybrids such as Adyen and Shopify sit around 11x to 12x and offer much stronger disclosure. SumUp may deserve to sit above the low-multiple cluster if banking, software, and enterprise mix are
    real drivers, but open sources do not yet show enough audited evidence to place it confidently near the premium end of the range.
