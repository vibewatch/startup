    - Stay on track and continue diligence rather than chase headline valuation
  - - Bull
    - Reported IPO narrative
    - Audited group revenue and margins are strong, governance package looks IPO-ready, and investors can justify premium-hybrid comp treatment
    - 10.0-15.0
    - Requires multiple unproven upgrades rather than just steady execution
    - Upgrade only after a full data room closes the denominator and cap-table gaps
