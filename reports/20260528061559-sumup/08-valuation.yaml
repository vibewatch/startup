tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Why it follows
  rows:
  - - Recommendation
    - TRACK — continue diligence, but do not underwrite the IPO headline on public evidence alone
    - Observed price signals are too dispersed and too disclosure-light for a buy call at the reported $10-15 billion band
  - - Confidence
    - Medium
    - Official financing and public-comp screens are clear, but consolidated revenue and capital-structure detail are still missing
  - - Risk rating
    - High
    - Debt refinancing, governance opacity, and a wide gap between official, secondary, and IPO signals can all reprice equity value quickly
  - - Valuation stance
    - Stretched on current IPO headlines
    - Aspirational IPO pricing sits well above the Groupon secondary signal and above what low-multiple merchant-acquiring comps would support
  - - Entry discipline
    - Prefer diligence-backed pricing inside the secondary-to-2022 corridor
    - A lower entry or materially better disclosure would improve the risk/reward faster than modest narrative progress
  - - Decision implication
    - Require audited denominator, debt/covenant pack, and cap-table terms before moving forward
    - Without those files the investor is underwriting story quality rather than provable valuation support
  notes: 'Recommendation is intentionally price-sensitive and evidence-sensitive: company quality is real, but the public valuation record is not yet tight enough for false precision.'
