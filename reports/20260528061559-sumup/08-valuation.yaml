- id: thesis-break-triggers-and-final-diligence
  title: Thesis-break triggers and final diligence asks
  body: 'The recommendation can move, but only through evidence or price, not through admiration. A buyer should upgrade the case only if management provides audited consolidated revenue, margin and segment-mix data, a clear debt and covenant package, and a cap-table view that shows common-equivalent investors are not sitting behind hidden downside asymmetry. The same discipline defines the kill criteria. If fresh private-market pricing repeats the Groupon discount, if group economics look closer to a low-multiple acquirer than a premium software-like platform, or if banking and enterprise expansion fail to deepen monetisation, then the premium narrative breaks. Governance also matters more than it might in an early-stage company because IPO-grade pricing normally depends on filing-grade transparency. Today, the public record still leans on company releases and press leaks rather than on the disclosure standard visible at listed peers. That is why the diligence list is narrow and concrete:
    prove the denominator, prove the margin structure, prove the capital structure, and prove the governance package before paying up for the IPO dream.'
