- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Pillar
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Scale
    - 4M+ merchants, 1B+ annual transactions, and 1.5M active business-account users indicate a real platform
    - Scale without a clean consolidated revenue denominator does not prove premium valuation support
    - Audited group revenue bridge and segment reporting
  - - Profitability
    - Management says EBITDA has been positive since Q4 2022
    - EBITDA proof without gross-margin, take-rate, and cash-flow detail can still mask low-quality earnings
    - Margin waterfall and cash conversion by segment
  - - Product breadth
    - Business accounts, deposits, lending, POS, and enterprise sales can push SumUp above pure acquiring
    - If most economics still come from low-multiple merchant acquiring, premium-comp logic breaks
    - Segment mix and attach-rate data
  - - Capital structure
    - Repeated financing access shows lenders and investors still back the platform
    - Debt refinancing and undisclosed preference terms can create hidden downside asymmetry for equity
    - Debt maturity, covenant, and liquidation-preference package
  - - Market narrative
    - London or US IPO optionality creates upside if disclosure improves
    - IPO reporting today is based on press leaks and aspirational bands, not on public audited numbers
    - Bank-ready audited statements and governance package
  - - Governance
    - Founders appear committed and still materially involved
    - Entity-level executive disclosure is not the same as group-level board and governance transparency
    - Full board, committee, and decision-rights disclosure
  notes: The table separates genuine business quality from the unanswered questions that still block a premium underwriting call.
