- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Consolidated audited financials
    - 2024-2025 audited revenue, gross profit, EBITDA, cash flow, and balance sheet
    - Needed to place SumUp on the right public-comp axis and test IPO-grade valuation support
    - Finance team, auditor package, and board-approved annual results deck
  - - Segment mix and unit economics
    - Revenue split across payments, POS, banking, lending, and enterprise, plus take rate, gross margin, and retention by segment
    - Determines whether SumUp deserves low-multiple processing comps or premium hybrid treatment
    - FP&A and business-line owners
  - - Debt and covenant package
    - Maturity schedule, pricing, covenants, collateral, and refinancing flexibility for the 2024 private credit
    - Debt-heavy financing can dominate equity downside in a stressed exit
    - Treasury workstream and lender materials
  - - Cap table and preference terms
    - Liquidation preferences, seniority, anti-dilution, warrants, and any side letters
    - Without this, apparent valuation may not equal common-equivalent value
    - Legal counsel and board materials
  - - Governance pack
    - Group board composition, committees, group CEO or equivalent authority map, and founder control rights
    - IPO-grade valuation usually requires IPO-grade governance clarity
    - Corporate secretary and investor-relations workstream
  - - Secondary market evidence
    - Recent tender or secondary pricing, volume, and participant mix after the Groupon datapoint
    - Shows whether the adverse print was isolated or still the market-clearing signal
    - Shareholder registry review and broker checks
  notes: 'The asks are intentionally narrow: they focus on the missing items most likely to change the recommendation or valuation band.'
