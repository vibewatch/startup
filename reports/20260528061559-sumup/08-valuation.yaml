- id: scenario-range-and-recommendation
  title: Bull, base, bear, and recommendation logic
  body: 'Scenario work for SumUp has to stay anchored on observed public prints rather than pretend the missing denominator is known. The bear case is straightforward: if public markets continue to value merchant acquiring around low-single-digit revenue multiples and SumUp cannot clear the disclosure bar for a premium listing, the Groupon-like secondary signal near $4 billion to $5 billion becomes the relevant valuation corridor. The base case is more charitable. It assumes EBITDA proof holds, banking and enterprise expansion deepen monetisation, and the company deserves to trade above the low-multiple peer cluster, but still below aspirational IPO headlines until audited group numbers are shown; that supports something like a $6 billion to $8.5 billion band. The bull case is the reported IPO narrative itself: $10 billion to $15 billion only if diligence proves SumUp belongs closer to premium hybrid comps than to pure acquirers. Because the evidence does not yet clear that bar, the most
    supportable call today is TRACK with medium confidence, high risk, and a stretched current valuation stance.'
