- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Fresh secondary discount or down-round
    - New private-market pricing again clears near or below the Groupon-style print
    - Shows that the market still rejects premium IPO framing
    - Re-underwrite from the bear band or walk away
  - - Weak consolidated economics
    - Audited group revenue, margin, or take rate look much weaker than needed for premium-hybrid comp treatment
    - Collapses the bridge from business quality to valuation support
    - Reset toward low-multiple public comps
  - - Capital-structure overhang
    - Debt covenants, maturity wall, or preference stack absorb too much downside value
    - Equity returns become asymmetric even if operations remain acceptable
    - Require materially lower entry or avoid
  - - Banking / enterprise attach disappoints
    - Deposits, lending, or enterprise expansion fail to deepen monetisation
    - SumUp screens more like a payments processor than a broadened financial OS
    - Reduce upside weighting and stay in the low-multiple corridor
  - - Governance pack remains thin
    - Board, committee, and group-leadership disclosure stay below IPO standards
    - Premium valuation cannot be justified on public-market terms
    - Delay investment until governance diligence is complete
  notes: These are thesis-break conditions, not routine KPIs. Each one would move valuation support faster than ordinary merchant-growth updates would help it.
