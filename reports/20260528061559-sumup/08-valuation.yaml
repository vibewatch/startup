- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Shift4
    - May 2026 market cap $4.25B; 2025 revenue $4.17B
    - ~1.0x market cap / revenue
    - Closest direct public merchant-acquiring and POS analogue for low-multiple processing economics
    - Equity value is not EV and Shift4 has its own leverage, vertical mix, and M&A profile
  - - PayPal
    - May 2026 market cap $38.60B; 2025 revenue $33.17B
    - ~1.2x market cap / revenue
    - Scaled payments benchmark for mature transaction-heavy economics
    - Much larger brand, consumer mix, and global network effects than SumUp
  - - Block
    - May 2026 market cap $42.50B; 2025 revenue $24.19B
    - ~1.8x market cap / revenue
    - Useful merchant-acquiring and seller-ecosystem reference with banking and software adjacency
    - Public mix includes Cash App and other businesses that make it broader than SumUp
  - - Toast
    - May 2026 market cap $14.20B; 2025 revenue $6.15B
    - ~2.3x market cap / revenue
    - Helpful restaurant POS and software-enabled payments analogue
    - Concentrated vertical focus and public disclosure quality differ from SumUp’s broader SMB base
  - - Adyen
    - May 2026 market cap $34.39B; 2025 revenue $3.10B
    - ~11.1x market cap / revenue
    - Upper-bound premium payments-platform comp with strong filing-grade disclosure
    - Far better disclosed, more enterprise-focused, and structurally different from SumUp
  - - Shopify
    - May 2026 market cap $138.32B; 2025 revenue $11.55B
    - ~12.0x market cap / revenue
    - Context for what a premium commerce operating system can command publicly
    - Broader software and merchant-services platform; not a direct acquiring comp
  notes: This is a public-market screen using market cap to reported revenue, not a true EV/revenue comparison. It is still decision-useful because it shows how sharply low-multiple acquiring peers differ from premium hybrid platforms.
  enumerationScope:
