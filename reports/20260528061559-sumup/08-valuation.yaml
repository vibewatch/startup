  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: consolidated-revenue-disclosure
    missingEvidence: Audited 2024-2025 consolidated revenue, gross profit, EBITDA, cash flow, and a bridge from legal-entity accounts to group reporting.
    whyItMatters: Without a clean denominator, investors cannot tell whether SumUp belongs near low-multiple acquiring comps or nearer premium hybrid platforms.
    diligencePath: Request audited consolidated financial statements, management bridge schedules, and banker or board materials used for IPO preparation.
    relatedQuestionRefs:
    - QV004
    - QV015
    - QV028
    relatedTableRefs:
    - TV001
    - TV003
    - TV004
    - TV006
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Segment-level take rate, gross margin, retention, CAC payback, and cash conversion across acquiring, POS, banking, lending, and enterprise.
    whyItMatters: These variables determine whether SumUp deserves a premium hybrid multiple or should remain near lower public acquiring screens.
    diligencePath: Ask FP&A for segment dashboards, cohort views, and management scenarios used to support IPO or fundraising discussions.
    relatedQuestionRefs:
    - QV016
    - QV027
    - QV030
    relatedTableRefs:
    - TV002
    - TV003
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: capital-structure
    missingEvidence: Debt maturity schedule, covenant package, collateral, preference stack, anti-dilution protections, and any side letters affecting common-equivalent returns.
    whyItMatters: Debt-heavy financing can dominate downside value and make the same headline valuation much less attractive for new equity.
    diligencePath: Request financing documents, lender decks, cap-table materials, and counsel summaries before underwriting any entry price.
    relatedQuestionRefs:
    - QV017
    - QV029
    - QV030
    relatedTableRefs:
    - TV001
    - TV005
    - TV006
  - type: missing-source
    severity: material
    topic: governance-disclosure
    missingEvidence: Group-level board composition, committees, founder control rights, and a clear map of who runs the group versus regulated operating entities.
    whyItMatters: IPO-grade valuation normally requires IPO-grade governance disclosure, especially when investors are asked to pay premium-hybrid multiples.
    diligencePath: Request board materials, governance chart, committee charters, and any draft IPO governance package.
    relatedQuestionRefs:
    - QV018
    - QV030
    relatedTableRefs:
    - TV005
    - TV006
  - type: missing-source
    severity: material
    topic: secondary-market-breadth
    missingEvidence: Recent tender or secondary pricing beyond the Groupon-linked datapoint, including trade volume, buyer type, and whether discounts persisted into 2025-2026.
    whyItMatters: One discounted trade may be noisy, but repeated secondary-market discounts would sharply weaken the bull and base cases.
    diligencePath: Check shareholder registry changes, broker feedback, and any tender documentation since the Groupon transaction.
    relatedQuestionRefs:
    - QV009
    - QV010
    - QV030
    relatedTableRefs:
    - TV003
    - TV005
    - TV006
