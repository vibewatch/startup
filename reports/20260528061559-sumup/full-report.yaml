            title: Debt-heavy capital structure creates refinancing and covenant risk
            body: >-
              The large majority of SumUp's €2.4 billion+ raised is debt. The US$1.6 billion May 2024 private credit
              deal refinanced existing obligations but did not eliminate them. Debt service consumes operating cash
              flow, and any covenant breach or deterioration in payment volumes could trigger liquidity stress,
              especially given the absence of public financials and disclosed leverage ratios.
            calloutType: risk
