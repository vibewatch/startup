      - number: '7.5'
        title: Monitoring indicators and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The right way to monitor SumUp is to focus on observable failure signals that would break the underwriting
              story, not on generic fintech anxieties. Three public evidence clusters stand out. First, reliability: a
              repeat of the May 2026 transfer delay, especially if tied to payment-scheme or bank-partner issues, would
              suggest that SumUp’s fast-growing business-account product is scaling ahead of its operational resilience.
              Second, capital structure: the 2024 debt refinancing and 2025-2026 IPO reporting mean investors should
              assume external financing remains strategic to both balance-sheet management and expansion. Third,
              merchant-trust controls: public complaints already cluster around verification, held funds, billing, and
              slow support; if those themes intensify as the company pushes upmarket, the risk transmission route to
              churn and valuation compression becomes much shorter.


              Security and economics now belong on the same monitor list. A disclosed data-security or privacy incident
              would hit trust and regulatory exposure at once, while evidence that SumUp must keep widening discount
              plans or negotiated pricing to defend share against Square, PayPal/Zettle, or Stripe would imply weaker
              unit economics than merchant-growth headlines suggest. Because SumUp is still a private company with
              limited public segment disclosure, investors should also treat missing or delayed financial and governance
              transparency as a warning signal rather than neutral silence.


              Accordingly, this chapter treats licence restrictions, multi-market settlement outages, renewed dependence
              on large refinancing or IPO proceeds, regulatory-remediation programmes, serious data incidents, and
              visible take-rate compression without matching disclosure as thesis-break events. Softer but still
              monitorable warning signs include worsening complaints cadence, fresh ombudsman compensation decisions,
              management churn inside the enterprise, compliance, risk, or banking functions, or widening use of
              custom-rate plans for larger merchants. These are measurable and should be attached to diligence covenants
              or refresh triggers rather than left as narrative caveats.
