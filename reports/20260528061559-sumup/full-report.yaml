  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Six-layer view of SumUp's merchant stack from apps and devices down to integration, money movement, and trust
      infrastructure.
    data:
      layers:
        - label: Merchant control layer
          detail: >-
            Business app on iOS and Android plus POS front ends, Kiosk, and the Local consumer app coordinate setup,
            catalog, reporting, loyalty, and bookings.
        - label: Acceptance-device layer
          detail: >-
            Solo Lite handles phone-paired acceptance; Solo and Terminal handle standalone checkout; Tap to Pay removes
            separate hardware for contactless use cases.
        - label: Commerce-software layer
          detail: >-
            POS, POS Lite, Kiosk, Online Store, Payment Links, Invoices, Bookings, and Loyalty turn payment acceptance
            into day-to-day merchant operations.
        - label: Integration layer
          detail: >-
            Reader SDKs, Cloud API, Payment Switch, REST APIs, and webhooks let SumUp be embedded into third-party apps,
            kiosks, and POS systems.
        - label: Money-movement layer
          detail: >-
            Card schemes, wallets, Business Account, Mastercard, ACH / Faster Payments / SEPA, cash deposit, local
            IBANs, and Cash Advance sit below merchant checkout.
        - label: Trust and infrastructure layer
          detail: >-
            DNB EMI permissions, FCA-style safeguarding, AWS-backed POS infrastructure, PCI disclosures, GitHub repos,
            and app-store distribution support the stack.
    approximationNotes: >-
      The stack is assembled from official product pages, developer docs, app-store listings, regulatory entries, and
      the Goodtill security note; SumUp does not publish one canonical architecture diagram.
