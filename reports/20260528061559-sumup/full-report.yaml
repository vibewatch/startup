      - number: '7.6'
        title: Financial model and competitive risk
        blocks:
          - type: paragraph
            body: >-
              SumUp’s public pricing already shows the core margin-risk mechanism. Its UK pricing page advertises a
              1.69% default transaction fee, then immediately offers a 0.99% plan for merchants processing £3,000 or
              more per month and bespoke pricing for businesses above £10,000 monthly volume. That is direct evidence
              that pricing gets sharper as merchants scale, exactly when SumUp is trying to move beyond micro-merchants
              into larger and more attractive sellers. MobileTransaction’s 2026 comparison reinforces the point: it says
              cost-conscious startups often prefer SumUp’s lowest fee, but it also says Square has the stronger free app
              and that PayPal’s post-Zettle app is less compelling.


              Competitive pressure therefore comes from several directions at once. PayPal Point of Sale says it charges
              1.75% per transaction, no contracts or recurring fees, and offers custom rate plans once merchants exceed
              £10,000 monthly card volume. Square advertises no setup or monthly fees and bespoke plans above £200,000
              in annual payments volume. Stripe’s pricing page goes further toward platform competition, combining
              pay-as-you-go pricing, custom packages, 1.5% + 20p pricing for EU cards, 99.999% historical uptime, and
              PCI-compliant infrastructure. SumUp is unlikely to fight each rival on identical terms in every cohort,
              but the common pattern is clear: higher-volume merchants are trained to expect negotiated economics,
              richer software, or stronger infrastructure claims. That creates credible take-rate compression risk as
              SumUp moves upmarket.


              Governance and disclosure add a final layer of uncertainty. Companies House confirms SumUp Payments
              Limited is a private UK company, and SumUp’s legal-information page mainly routes outsiders toward terms,
              safeguarding, and status surfaces rather than segment reporting, governance detail, or business-line
              profitability. Investors can infer that SumUp is building across acquiring, business accounts, enterprise,
              and financing, but they cannot verify public take-rate trends, cohort margins, fraud losses, board
              controls, or product concentration with public-company precision. Limited disclosure is therefore not a
              cosmetic issue; it increases the chance that margin or control slippage becomes visible only after it is
              already material.
            claimRefs:
              - CR043
              - CR057
              - CR059
              - CR060
              - CR061
              - CR062
              - CR063
              - CR064
              - CR065
