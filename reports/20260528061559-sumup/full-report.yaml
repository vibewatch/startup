          label: 'Profitability signal: EBITDA-positive since Q4 2022'
          type: input
        - id: breadth
          label: 'Breadth: banking, POS, lending, enterprise expansion'
          type: input
        - id: gap
          label: 'Disclosure gap: no clean audited consolidated denominator or cap-table terms'
          type: input
        - id: dispersion
          label: 'Price dispersion: ~$4.2B secondary vs $8.5B 2022 round vs $10-15B IPO talk'
          type: process
        - id: comps
