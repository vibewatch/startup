              Groupon's 2023 SEC filing showed SumUp shares sold at a price implying €3.9 billion—a 51% discount to the
              €8 billion 2022 primary-round valuation. SumUp's December 2023 primary round was described as an up-round
              from €8 billion, but the gap vs. the secondary market print remains unexplained. IPO aspirations at $10–15
              billion add further ambiguity.
            calloutType: risk
            claimRefs:
