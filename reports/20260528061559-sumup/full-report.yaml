      - - Software attach, ARPU, and churn for POS / invoicing / paid tiers
        - Necessary to judge whether subscriptions materially improve revenue quality
        - Request paying seats, paid-account penetration, ARPU, churn, and enterprise contract distribution
      - - CAC, payback, and cohort retention / NRR
        - Necessary to evaluate whether cross-sell deepens economics or only expands product scope
        - Request channel-level CAC, payback, cohort retention, and NRR by merchant segment
      - - Gross margin and contribution margin by line of business
        - Necessary to separate a payments-led scale story from an actually attractive profit pool
        - >-
          Request segment gross profit and contribution margin bridge for processing, hardware, software, banking, and
          lending
      - - Merchant-finance defaults, delinquencies, recoveries, and reserve policy
        - Necessary to value the lending book and stress capital consumption through a downturn
        - Request origination vintages, delinquency buckets, charge-offs, recoveries, and reserve methodology
      - - Current cash balance, monthly burn, runway, debt maturities, and covenant headroom
        - Necessary to judge whether 2024 refinancing solved the capital question or only deferred it
        - Request treasury package with cash, debt schedule, covenant tests, and downside runway analysis
      - - Audited consolidated revenue, GMV, and segment mix
        - Necessary to reconcile private marks, secondary pricing, and any IPO-ready valuation case
        - Request last two years of audited consolidated financials plus current-year management accounts
