      - number: '3.5'
        title: Differentiation, Switching Economics, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              SumUp's core competitive differentiation rests on four pillars: (1) the lowest publicly advertised flat
              transaction rate in the UK micro-merchant segment (1.69% vs Square and PayPal Zettle at 1.75%), (2) the
              widest direct-market footprint among self-serve mPOS providers (37 markets, versus Square's ~9 markets),
              (3) the Business Account + POS bundle that creates retention through banking relationship alongside
              payment acceptance, and (4) mobile-first onboarding with no credit check, no contract, and no minimum
              volume. The first advantage is narrow and vulnerable: a 6 basis-point margin is not a durable moat against
              a competitor willing to price at or below SumUp's rate. Square and Teya have both moved to comparable or
              bundled pricing in ways that reduce this advantage in practice for merchants above specific volume
              thresholds.

              Merchant switching costs in the mPOS segment are structurally low. Hardware is purchased outright (not
              rented), mobile app accounts are free to create, and there is no data lock-in since transaction histories
              can be exported. Multi-homing (using multiple providers simultaneously) is common: a sole trader may use
              SumUp for in-person payments and PayPal for online invoicing. The primary retention mechanism is the
              Business Account: once a merchant's operating cash settles into a SumUp account and they hold a SumUp
              Mastercard, the friction of switching increases materially—analogous to the stickiness model deployed by
              Square (Square Banking/Cash App) and Shopify (Shopify Balance).

              Adverse competitive threats include: (a) softPOS commoditisation—tap-to-pay on unmodified smartphones
              (supported by Apple iOS 17+, Android, and all major schemes) is rendering dedicated card-reader hardware
              progressively less necessary, compressing SumUp's hardware revenue and removing one onboarding friction
              barrier that previously favoured SumUp's plug-and-play card reader; (b) price compression from scheme fee
              increases—Visa and Mastercard increased scheme fees multiple times after 2022, adding an estimated £200
              million-plus annually in costs to UK merchants, reducing flat-rate providers' net margin on the
              1.69%–1.75% rack rate; (c) capital market access— Block, Shopify, and Adyen each have public equity and
              deep credit markets available to fund merchant acquisition subsidies, hardware promotions, or loss-leader
              pricing, while SumUp must self-fund these from operations or debt facilities, constraining its competitive
              firepower. SumUp's €285 million in private credit (2023) provides runway but not the liquidity depth of a
              public balance sheet.
