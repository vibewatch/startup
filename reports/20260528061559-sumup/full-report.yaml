  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              SumUp’s public posture is that it operates as a regulated payment and e-money institution rather than as a
              bank. The company says SumUp Payments Limited is FCA-authorised under the Electronic Money Regulations
              2011, while the Central Bank of Ireland lists SumUp Limited as an authorised e-money firm that acts as the
              gateway into European operations. That perimeter matters because SumUp is now holding merchant funds and
              business-account balances at scale, yet its own safeguarding page is explicit that FSCS protection does
              not apply and that an insolvency return process can still involve delay and cost deductions. Legal and
              complaint risk is therefore less about a disclosed headline enforcement case and more about whether
              verification, safeguarding, or support controls fail often enough to create merchant harm under a
              regulated standard.


              The rulebook is also moving. The European Banking Authority’s payment-services and electronic-money page
              already frames supervisory work around the point at which PSD3/PSR will apply, including an opinion aimed
              at avoiding dual-licensing burdens and another on payment-fraud trends that calls for additional
              anti-fraud measures beyond PSD3, PSR, and the Instant Payments Regulation. The European Commission’s own
              payment-services page places payment services and e-money alongside financial-crime and
              anti-money-laundering policy work, while the FCA’s electronic-money and payment-institutions hub groups
              conduct, safeguarding, and payment-services or e-money regulations in the same supervisory stack. For
              SumUp, that means PSD3/PSR and UK payment-rules reform are not abstract Brussels or Westminster noise:
              they can force repeated changes to authentication, open-banking, safeguarding, fraud, and reporting
              workflows across acquiring, business accounts, and payouts.


              Public adverse evidence already shows that the risk is real, not theoretical. Two Financial Ombudsman
              decisions required SumUp to compensate complainants: one after poor handling of a scam-related dispute,
              and another after a charity’s account hit an undisclosed verification limit and its terminals stopped
              during an event. SumUp’s complaints process promises a 15-business-day response, but the legal terms still
              preserve broad suspension rights when information is incomplete or verification is not satisfied. Its
              legal-information hub also centralises the Merchant Services Agreement, Payment Terms, safeguarding
              materials, and service-status surfaces, which is useful for compliance tracing but also highlights how
              many separate legal and operating artefacts now sit behind a simple merchant-acquiring brand. AML/KYC is
              the clearest transmission route: stricter onboarding, sanctions screening, or transaction monitoring may
              be necessary, but if staffing, escalation, or customer communication lags, those controls can still shut
              merchants out of live trading.
