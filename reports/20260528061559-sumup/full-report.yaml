  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitor Landscape and Segmentation
        blocks:
          - type: paragraph
            body: >-
              SumUp's competitive environment divides into five identifiable clusters based on target merchant size,
              product philosophy, and distribution model. The first cluster—micro-merchant mPOS peers—consists of
              providers that share SumUp's core use case: enabling sole traders and small businesses to accept card
              payments via a compact hardware reader paired with a smartphone app. Square (Block, Inc.), PayPal Point of
              Sale (formerly Zettle), Teya, and myPOS all compete here on flat-rate pricing, zero-contract posture, and
              low-friction onboarding. This cluster is SumUp's highest-stakes battleground.

              The second cluster is platform-led payment infrastructure. Stripe Terminal targets developers and
              enterprises that need an API-first in-person payment capability integrated into broader software stacks.
              Shopify POS targets existing Shopify e-commerce merchants expanding into physical retail. Both require
              meaningful configuration and are not self-serve in the way SumUp is. The third cluster is software-led
              vertical POS systems: Lightspeed (retail and restaurant), Toast (restaurant), and Clover (Fiserv
              bank-bundled, US-first) provide deep sector software with payment acceptance embedded. SumUp's acquisition
              of Goodtill (hospitality POS) and its POS Pro product move it toward this cluster but from below.

              The fourth cluster is enterprise-grade acquiring: Adyen operates at enterprise and omnichannel scale with
              interchange-plus pricing that only becomes competitive above several million euros in annual card volume.
              Worldpay, Global Payments, and Nexi serve similar enterprise and bank-referred merchants. These providers
              do not compete directly with SumUp on micro-merchant onboarding but create a meaningful ceiling on SumUp's
              upmarket expansion. The fifth cluster is bank/acquirer bundles: Barclaycard, Lloyds Cardnet, and analogues
              in every European market distribute acquiring terminals through business banking relationships, often at
              higher per-transaction fees but with perceived incumbent trust. These are the status-quo substitutes SumUp
              displaces when winning new merchants.
