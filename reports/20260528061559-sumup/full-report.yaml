      - number: '7.2'
        title: Operational, fraud, and reliability risk
        blocks:
          - type: paragraph
            body: >-
              Operational reliability is the cleanest evidence-backed risk in the public record. IsDown says it has
              tracked 255 SumUp incidents since 2021 and 11 incidents in the last 90 days alone, including two major
              outages and a median resolution time of just over two hours. The recent issue set is directly relevant to
              merchant cash flow: outbound and inbound business-account transfers were delayed for roughly 20 hours on
              19 May 2026; other spring incidents affected card-reader connectivity, Cloud API transactions, receipts
              and sales history, support chat, and cards issued by Santander UK. Downdetector’s issue taxonomy points to
              the same broad failure surface: app, login, payments, purchases, funds transfer, QR code, and website.


              Merchant-feedback channels and ombudsman decisions suggest the pain is felt most acutely when controls
              intersect with money movement. Trustpilot reviews and BBB complaints repeatedly mention fund holds,
              delayed payouts, confusing verification, refund or chargeback friction, and slow support. The ombudsman
              cases show both fraud-handling and onboarding-verification failures can produce direct merchant loss and
              compensation. With SumUp’s business-account product now carrying more than €1 billion of deposits and 1.5
              million active users, the blast radius of any future service or controls failure is larger than when the
              business was mostly a card-reader acquirer.


              Public security evidence is better than silence but thinner than a public-company controls pack. SumUp
              runs a private HackerOne bug-bounty programme with rewards and published rules, response timelines, and
              scope guidance. Its developer materials say the Cloud API is PCI compliant, requires device authorisation
              or API-key-based access, encrypts card data end-to-end, rejects plain-HTTP or unauthenticated API calls,
              and expects integrators to verify webhook events through the API rather than trust raw notifications.
              SumUp also keeps a public Europe status page with named components. Those are positive control indicators,
              but the retained source set still does not provide the equivalent of breach history, GDPR-operational
              metrics, or independently attested security reporting. Data/privacy/security risk therefore remains
              material even though SumUp clearly invests in baseline controls.
