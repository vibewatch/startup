  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-style scoring of market proof, economics, governance, and valuation support for SumUp.
    data:
      items:
        - label: Scale proof
          value: 4.5
          note: Merchant, transaction, and business-account scale are clearly real
        - label: Product breadth
          value: 4
          note: Payments, POS, banking, lending, and enterprise all appear meaningful
        - label: Profitability signal
          value: 3.5
          note: EBITDA positivity helps, but margin detail is still missing
        - label: Disclosure quality
          value: 1.5
          note: No clean audited consolidated denominator in retained sources
        - label: Governance clarity
          value: 1.5
          note: Entity-level appointments do not equal full group governance disclosure
        - label: Capital-structure simplicity
          value: 1.5
          note: Private credit and undisclosed preference terms create underwriting friction
        - label: Public-comp support
          value: 2.5
          note: Some hybrid upside exists, but direct comps mostly screen much lower
        - label: Exit readiness
          value: 2.5
          note: IPO optionality exists, yet the public disclosure package still looks incomplete
    approximationNotes: Scores are on a 1-5 judgment scale and are meant to discipline the recommendation, not replace valuation work.
