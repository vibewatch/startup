            body: >-
              SumUp now presents itself less as a single card-reader company and more as a merchant operating system
              that spans acceptance, commerce software, and money management. The current public surface covers card
              readers, a standalone Solo family, POS Lite, the fuller SumUp POS stack, Kiosk, Tap to Pay, Invoices,
