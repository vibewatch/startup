      - number: '4.3'
        title: Capital adequacy, debt dependence, and refinancing exposure
        blocks:
          - type: paragraph
            body: >-
              SumUp's capital structure is the clearest financial risk in the public record. TechCrunch reported in June
              2022 that before the €590 million hybrid round, SumUp had raised approximately €1.5 billion in total since
              2012, including a €750 million debt round in 2021 — and that less than €100 million of that total was
              equity, a structure that kept dilution low but created substantial debt dependence before any equity-like
              rounds closed. The 2022 round itself raised €590 million at an €8 billion enterprise value and explicitly
              mixed debt with equity in equal 50/50 proportions. The December 2023 round added €285 million, with CNBC
              reporting that it was predominantly equity but still included a debt component. Then in May 2024, SumUp
              raised US$1.6 billion from private-credit lenders led by Goldman Sachs. Official and independent coverage
              are aligned that the 2024 deal was explicitly for refinancing existing debt while also preserving growth
              optionality, which makes it supportive in the near term but also confirms the business is meaningfully
              reliant on debt markets rather than only retained earnings or common equity.


              Additional public records reinforce the leverage story without fully resolving it. Companies House filing
              history for SumUp Payments Limited shows full accounts filed for the year ended 31 December 2024 and an
              MR01 charge registration created in August 2024, while SumUp’s safeguarding page stresses that customer
              funds are safeguarded rather than bank deposits on SumUp’s own balance sheet. DNB’s public register also
              shows EU e-money permissions for SumUp Limited. Those records are important, but they are not enough to
              underwrite consolidated liquidity. They do not provide the group’s cash balance, debt maturity ladder,
              covenant headroom, or the credit-loss and funding-cost profile attached to the merchant-finance book. In
              practice, public evidence supports a view that SumUp has adequate external capital access today, but also
              that future flexibility still depends on successful refinancing and continued lender appetite.
