    type: journey-map
    layout: wide
    summary: >-
      Six-stage view of how SumUp can move a merchant from simple payment acceptance into software, banking, funding,
      and eventually enterprise-grade operations.
    data:
      items:
        - label: Acquire low-friction reader
          description: >-
            Sole traders, freelancers, and micro-merchants adopt card acceptance because setup is easy, contract
            friction is low, and pricing is simple.
        - label: Run daily checkout
          description: >-
            Merchants begin using SumUp in daily service with card-present payments, mobile checkout, and next-day
            payout expectations.
        - label: Add workflow software
          description: >-
            Retail and hospitality merchants attach POS workflows such as reporting, inventory, table service, kitchen
            routing, and promotions.
        - label: Adopt business banking
          description: >-
            Payout capture moves into the SumUp business account, creating deposit balances and more daily operational
            dependence.
        - label: Use funding and loyalty
          description: >-
            Merchant cash advances, loyalty, digital ordering, and multiple cards deepen attachment beyond commodity
            acquiring.
        - label: Scale into multi-site / venue use
          description: >-
            The strongest public enterprise proof appears when SumUp becomes part of multi-location operations, venue
            kiosks, and venue-wide payment orchestration.
