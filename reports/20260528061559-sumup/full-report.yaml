          core market
        - Treat partner concentration and failover as priority diligence before writing equity upside.
      - - Execution and merchant trust
        - Leadership churn or complaints acceleration
        - >-
          Departure of enterprise, banking, compliance, or Irish-entity leaders inside 12 months, or BBB complaints
          rising above 30 closed in 12 months with fresh held-fund themes
        - Shift view from controlled expansion to stretched organisation until segment metrics improve.
      - - Regulatory-change / AML remediation load
        - Official rule change, remediation programme, or verification backlog
        - >-
          Any material PSD3/PSR or UK payment-rules gap programme, FCA/CBI remediation notice, or sustained growth in
          manual-review / false-positive queues
        - Treat as thesis-break until compliance cost, launch delays, and merchant-interruption risk are quantified.
