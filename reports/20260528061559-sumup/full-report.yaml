      - number: '4.2'
        title: Unit economics visibility, traction anchors, and GTM shift
        blocks:
          - type: paragraph
            body: >-
              Public traction evidence is meaningful but still stops well short of full unit economics. SumUp’s own
              about and funding materials say the company serves over 4 million businesses, and by December 2025 the
              company claimed more than 1.5 million active Business Account users with over €1 billion of merchant
              deposits. The same announcement said SumUp had issued financing to more than 250,000 SMEs and generated
              more than 1 million merchant-cash-advance offers, which is enough to establish lending as a real product
              line rather than a pilot. SumUp also publicly claimed positive EBITDA since Q4 2022 and over 30% top-line
              growth through 2023, while Sacra estimated roughly $600 million of 2025 annualized revenue and a mix that
              spans hardware, payment processing, software, and financial services.


              What remains missing is the exact set of metrics that would convert those signals into an underwriteable
              model. No reviewed public source disclosed the realized blended take rate net of scheme fees and
              interchange, hardware gross margin or subsidy policy, CAC, payback, NRR, churn, deposit economics, or
              credit-loss performance on merchant advances. The GTM motion also appears to be changing. SumUp’s original
              self-serve model was built around low-friction card-reader acquisition, but the POS Pro product and 2025
              enterprise-sales hire show a growing push into larger merchants and more sales-assisted deployments. That
              likely improves contract-value potential and software attach, but it also changes sales efficiency
              assumptions and could require a heavier service and onboarding cost base than the original micro-merchant
              model.
