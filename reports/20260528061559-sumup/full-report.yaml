companyProfile:
  summary: >-
    SumUp is a late-stage private fintech founded in 2012 that built its franchise on low-friction card acceptance for
    micro and small merchants, then expanded into point-of-sale software, invoicing, business accounts, merchant cards,
    and financing. The company now serves more than 4 million merchants across 37 markets, employs more than 3,000
    people, and has meaningful strategic optionality as it pushes further into banking services and larger merchant
    accounts, but it still discloses far less financial detail than public-market payments peers.
  foundedDate: '2012-01-01'
  founders:
    - name: Marc-Alexander Christ
      role: Co-founder
    - name: Stefan Jeschonnek
      role: Co-founder
    - name: Jan Deepen
      role: Co-founder
  foundingLocation: Dublin, Ireland / Berlin, Germany
  headquarters: London, UK / Berlin, Germany
  productSummary: >-
    SumUp sells card readers, POS hardware and software, online payments, invoicing, payment links, business accounts,
    merchant cards, and merchant financing. Its model starts with transaction monetization and layers in subscriptions,
    SaaS, and banking-style products to deepen merchant attachment.
  customerFocus: >-
    Micro, small, and increasingly mid-market or enterprise merchants across retail, hospitality, services, events, and
    omnichannel commerce, with strongest evidence in European SMB payments.
  businessModel: >-
    Transaction fees on in-person and online payments remain the core engine, supplemented by hardware sales, POS
    software, subscription bundles such as SumUp One, and spread or fee income from business banking and
    merchant-finance products.
  stage: Late-stage private unicorn
  fundingStatus: >-
    Officially last marked at an €8 billion / about $8.5 billion valuation in June 2022, followed by a 2023 up-round
    without a disclosed valuation and a $1.6 billion private-credit refinancing in May 2024.
