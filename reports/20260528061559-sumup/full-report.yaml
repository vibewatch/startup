            title: Verification controls have already produced public merchant losses
            body: >-
              The charity-event ombudsman decision matters because it shows SumUp’s control stack can interrupt live
              revenue if onboarding is not completed in time. This is not merely a support annoyance; it is a documented
              case of lost sales and compensation.
