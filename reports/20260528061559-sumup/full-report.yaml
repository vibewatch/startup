      - number: '5.2'
        title: Checkout Architecture and External Dependencies
        blocks:
          - type: paragraph
            body: >-
              SumUp's architecture is specific enough in public docs to map the operating model. In-person acceptance
              splits into three modes: phone-paired readers such as Solo Lite, standalone readers such as Solo and
              Terminal, and software-only Tap to Pay on a compatible iPhone or Android device. On top sits the commerce
              layer: POS/POS Lite, Kiosk, Online Store, Payment Links, Invoices, Bookings, and Loyalty. Underneath sits
              an integration layer of Reader SDKs, Cloud API, Payment Switch, REST APIs, and checkout-status webhooks.
              That makes SumUp meaningfully more extensible than a pure closed reader vendor, particularly for kiosk and
              embedded POS use cases. The dependency chain is also very visible. Acceptance depends on card schemes and
              wallets, mobile operating systems, app-store distribution, and reliable internet connectivity. Cloud API
              reduces Bluetooth coupling, but Solo still depends on Wi-Fi or mobile data, and Tap to Pay is limited to
              contactless flows on supported NFC phones. For the POS estate, the Goodtill security note ties backend
              hosting to AWS eu-west-1. The public gap is not whether dependencies exist, but how concentrated they are:
              there is still no public acquirer-routing map, hardware-manufacturing disclosure, or quantified uptime/SLA
              record for enterprise buyers.
