        title: Exhibits
        blocks:
          - type: callout
            title: SoftPOS Commoditisation Threatens Hardware Margin
            body: >-
              Tap-to-pay on unmodified smartphones (Apple Tap to Pay on iOS 17+, Android NFC) is progressively rendering
              SumUp's card-reader hardware less necessary as an onboarding hook. SumUp's Solo card reader and tap-to-pay
              capability represent a competitive response, but so do Square, PayPal, and every other mPOS provider. If
              hardware attach rates fall, SumUp's per-reader revenue and the onboarding stickiness of its physical
              product diminish, increasing reliance on the Business Account and software subscriptions for monetisation.
            calloutType: risk
            claimRefs:
              - CP041
              - CP042
          - type: callout
            title: Public-Market Capital Gap Is SumUp's Most Durable Structural Disadvantage
            body: >-
              Block ($42.5 B), Shopify ($138.3 B), and Adyen ($34.4 B) each have public equity and deep liquid credit
              markets available to fund merchant acquisition campaigns, hardware subsidies, or loss-leader pricing
              rounds. SumUp, private and carrying ~€1.7 B in debt facilities, must fund competitive responses from
              operations or additional private debt—a constraint that limits its ability to match a sustained price war
              or expansion subsidy initiated by any of its listed peers.
            calloutType: risk
            claimRefs:
              - CP043
              - CP044
              - CP045
          - type: callout
            title: 37-Market Footprint Is Unmatched Among Self-Serve mPOS Peers
            body: >-
              No other self-serve, zero-contract mPOS provider serves 37 markets simultaneously. Square operates in 9
              markets. PayPal's reach is broad but via the PayPal consumer network rather than a dedicated mPOS product
              in each country. SumUp's multi-market regulatory licensing (FCA UK, CBI Ireland, national licences in 30+
              markets) creates a high replication cost for any new challenger attempting comparable coverage.
