      - number: '4.4'
        title: Public financial gaps, adverse evidence, and verdict
        blocks:
          - type: paragraph
            body: >-
              The biggest remaining problem is not whether SumUp has revenue, but whether the public evidence set is
              good enough to value that revenue. The cleanest public mark to actual traded economics is the October 2023
              Groupon 8-K, which disclosed the sale of a small SumUp stake for €8.4 million and implies an equity value
              of roughly €3.9 billion. CNBC explicitly highlighted that discount, while Sifted later reported that banks
              were being lined up around a possible $10 billion to $15 billion IPO. Those two signals are too far apart
              to hand-wave away, and they sit on top of a disclosure base that still lacks audited consolidated revenue,
              GMV, segment mix, net take rate, gross margin, CAC, payback, NRR, default rates, current cash, burn, and
              debt maturities.


              Adverse operating evidence exists too, though it is not by itself thesis-breaking. A 2023 Financial
              Ombudsman decision upheld a complaint against SumUp and ordered £400 in compensation for poor service
              around a scam-related payment, while review aggregators continue to flag fund holds and account-stability
              complaints. Those signals matter because operational friction in a payment platform can leak margin
              through support costs, reserves, disputes, and merchant churn, even when the top-line story looks
              attractive. The financial verdict is therefore mixed but clear: SumUp appears to have a broad, cross-sold
              merchant ecosystem and credible scale, yet the public record still does not justify underwriting an
              IPO-style valuation case without audited group statements, a product-level margin waterfall, and
              lending-performance vintages.
