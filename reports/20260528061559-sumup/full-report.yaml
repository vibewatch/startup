      - number: '3.2'
        title: Micro-Merchant mPOS Peer Profiles
        blocks:
          - type: paragraph
            body: >-
              Square, now operating under Block, Inc. (NYSE: SQ), is SumUp's most comparable direct peer globally. In
              FY2024 Square processed $228 billion in Gross Payment Volume across more than 4 million sellers,
              completing 5.2 billion individual transactions from over 800 million payment cards. Block's 10-K
              explicitly states the company has shifted strategic focus toward "mid-market sellers" (those generating
              more than $500,000 in annualised Square GPV) and restaurant/service verticals, reducing emphasis on the
              micro-merchant segment. SumUp's US CEO Andrew Helms publicly noted this upmarket migration creates an
              opportunity for SumUp to absorb the micro-merchant cohort that Square is de-prioritising in customer
              service terms. In the UK, Square charges 1.75% for all in-person card payments with no monthly fee on its
              free plan, and offers custom rate plans for merchants exceeding £10,000 per month. Block had a market
              capitalisation of approximately $42.5 billion as of May 2026.

              PayPal rebranded Zettle by PayPal to PayPal Point of Sale in late 2024, consolidating the brand under the
              PayPal parent. The in-person UK transaction fee is 1.75%, with the PayPal Reader (replacement for the
              Zettle Reader 2) available from £29 and the PayPal Terminal from £149. PayPal's primary distribution
              advantage is its 400-million-plus global consumer wallet, which can route consumer-side payments and
              vouchers through merchants using its hardware. Independent reviewers note the PayPal Reader's app offers
              fewer features than the discontinued Zettle-branded equivalent and that the 1.75% rate is "relatively
              high" compared to SumUp's 1.69%. PayPal Holdings had a market capitalisation of approximately $38.6
              billion as of May 2026, giving it resources to subsidise merchant acquisition and consumer loyalty
              programmes at scale SumUp cannot match on a private-company balance sheet.

              Teya, a UK-headquartered fintech founded in 2019, serves approximately 70,000 merchants predominantly in
              the UK with a flat-rate card machine offering that bundles next-day settlement (including weekends), a
              free Business Account with 0.5% cashback, and 24/7 UK-based customer support. Teya explicitly competes on
              service quality versus incumbents and positions itself against SumUp in its own pricing comparison
              materials, noting its 24/7 UK-based support as a differentiator versus SumUp's operational support model.
              A £29.99 monthly fee applies when monthly card turnover is below £2,500, creating a minimum-activity floor
              that SumUp does not impose. Teya's scale (70k customers vs SumUp's 4 million merchants) is significantly
              smaller but the company's UK-only concentration makes it a direct adversary in SumUp's largest European
              market.

              myPOS serves European micro-merchants with a pure pay-per-transaction model, a free merchant account with
              IBAN, and instant access to funds upon each payment. The myPOS UK pricing-and-fees page confirms a
              zero-monthly-fee structure similar to SumUp's pay-as-you-go option, and myPOS's instant-settlement feature
              is a differentiator versus SumUp's 1–3 working day settlement window on the pay-as-you-go plan.
