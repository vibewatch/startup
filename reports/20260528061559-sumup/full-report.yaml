            title: Enterprise push is a strategic inflection point
            body: >-
              SumUp has historically focused on the smallest of SMBs (sole traders, micro-merchants). The March 2025
              enterprise sales hire, The O2 deal, and a push into stadiums and national retail chains represent a
              deliberate upmarket shift. Success here could expand TAM and improve unit economics, but risks diverting
              product and sales resources from the core SMB mission.
