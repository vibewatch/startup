  claims:
    - id: CP001
      statement: >-
        SumUp's competitive environment divides into five clusters: micro-merchant mPOS peers
        (Square, PayPal POS, Teya, myPOS), developer/platform-led (Stripe Terminal, Shopify POS),
        software-led vertical (Lightspeed, Clover), enterprise acquirers (Adyen, Worldpay), and
        bank/acquirer bundles (Barclaycard, Nexi).
      type: observed
      topic: competitive-landscape
      sourceRefs: [SP005, SP025, SP026]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QP001]

    - id: CP002
      statement: >-
        Square, PayPal POS, Teya, and myPOS share SumUp's core use case—enabling small merchants
        to accept card payments via compact hardware with a no-contract, self-serve model—making
        them SumUp's highest-stakes direct competitors.
      type: observed
      topic: competitive-landscape
      sourceRefs: [SP006, SP009, SP028, SP012]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QP002]

