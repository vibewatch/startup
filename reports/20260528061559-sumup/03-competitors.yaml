  - id: platform-software-led
    title: Platform and Software-Led Competitors
    body: >-
      Stripe Terminal is Stripe's in-person payment product, positioned explicitly for developers,
      platforms, and enterprise merchants that want to unify online and offline payment
      acceptance in a single API. The Stripe documentation pages describe Terminal as enabling
      "leading enterprises and platforms to unify commerce across channels, seamlessly integrate
      payments with their point of sale, and easily manage their hardware needs." UK pricing
      is 2.5% + 20p for standard online card transactions, with custom in-person Terminal
      pricing available for enterprise. There are no publicly advertised flat-rate or
      self-serve in-person transaction fees for Terminal—merchants must contact Stripe sales.
      Stripe's depth as an API platform (Stripe Connect for marketplace payments, Stripe
      Issuing for card issuance, Stripe Treasury for financial accounts) gives it embedded
      finance breadth that SumUp's developer platform cannot yet match, though SumUp's
      developer SDK (sumup-go, @sumup/sdk) is growing. Stripe has no disclosed market cap
      in public equity markets but was last valued at approximately $65–70 billion in secondary
      markets. Its investor base includes Sequoia, Andreessen Horowitz, and Fidelity.

      Shopify POS targets the approximately 2 million merchants on Shopify's global commerce
      platform who want to add an in-person retail channel. The POS Pro plan costs £69/month
      and includes unlimited POS staff, buy-online-pickup-in-store, and advanced reporting.
      Shopify's card transaction rate on its standard plans is 2% + 25p online for UK cards.
      Shopify POS is structurally sticky: a merchant building their entire e-commerce presence
      on Shopify (product catalogue, inventory, customer CRM, marketing) faces high switching
      costs for any point-of-sale change because POS, inventory, and online are unified.
      SumUp cannot replicate this lock-in without a comparable e-commerce hosting platform.
      Shopify's market capitalisation was approximately $138.3 billion as of May 2026,
      giving it capital to subsidise hardware and merchant acquisition at rates that
      SumUp cannot sustain on a private balance sheet.

      Lightspeed Commerce (TSX/NYSE: LSPD) provides cloud-based POS software for independent
      retailers and restaurants, with integrated Lightspeed Payments. The Lightspeed product
      is iPad-first, data-rich (inventory management, purchase orders, supplier management,
      advanced reporting), and serves multi-location merchants. Lightspeed's annual revenue
      was approximately CAD $930 million (FY2025) with the company continuing to grow through
      platform and payment penetration. SumUp's acquisition of Goodtill (hospitality POS)
      represents its primary competitive response to Lightspeed in the UK restaurant and
      bar sector, but Lightspeed's software depth—especially in retail inventory—remains
      a competitive gap for SumUp's POS Pro offering.
