  - id: enterprise-acquirers-bank-bundles
    title: Enterprise Acquirers and Bank/Acquirer Bundles
    body: >-
      Adyen N.V. (AMS: ADYEN) is Europe's dominant enterprise payment platform, offering
      in-person acquiring, e-commerce gateway, and embedded finance (Adyen for Platforms)
      in a single unified infrastructure. Adyen's POS pricing page lists $0.13 processing fee
      plus interchange plus a percentage markup (interchange-plus model), which only becomes
      cost-competitive with flat-rate providers at high monthly card volumes (typically above
      €50,000/month). Adyen's technical documentation for point-of-sale describes a
      full-featured Terminal API with support for multi-currency, global payment methods, and
      custom terminal applications. Adyen had a market capitalisation of approximately
      $34.4 billion as of May 2026. Adyen's strategy explicitly targets enterprises and
      platforms; it does not offer a self-serve micro-merchant product. However, Adyen has
      announced progressively smaller minimum volume thresholds as it builds market share,
      creating a long-term risk that it enters SumUp's merchant tier.

      Clover, a product line of Fiserv, Inc., distributes card acceptance hardware through US
      bank partnerships and Fiserv's direct merchant services channel. Clover pricing requires
      3-year contracts in most configurations and mandates a credit approval process. Clover's
      hardware promotion (as of 2026) requires merchants to process $10,000 or more in card
      transactions within the first four billing cycles. This contrasts sharply with SumUp's
      zero-contract, zero-minimum model. Clover is primarily a US product and is not a
      direct European competitor to SumUp, though Fiserv's European acquiring assets (from
      the WorldPay acquisition and European bank partnerships) represent latent channel risk.

      Worldpay (now part of FIS/GTCR) serves UK small businesses through its "small business
      payments" product with custom rate plans. The Worldpay website promotes managed service
      and volume-dependent pricing rather than transparent flat-rate fees, consistent with
      its bank-acquirer heritage. Barclaycard Business offers UK card acceptance as part of
      its business banking bundle, competing in SumUp's target market on brand recognition
      but typically at higher blended rates and longer contract terms. Nexi Group, Europe's
      largest acquiring network by merchant count, serves approximately 3 million merchants
      across 25+ European countries through bank partnerships and is the benchmark European
      acquirer infrastructure against which SumUp's pan-European footprint is partly built.
