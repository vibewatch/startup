company:
  name: SumUp

chapter:
  number: 3
  title: Competitors
  summary: >-
    SumUp faces five distinct competitor clusters: micro-merchant mPOS peers (Square, PayPal
    Point of Sale, Teya, myPOS), platform-led players (Stripe Terminal, Shopify POS),
    software-led vertical systems (Lightspeed), enterprise acquirers (Adyen, Worldpay), and
    bank/acquirer bundles (Barclaycard, Nexi). SumUp's 1.69% flat rate is the lowest among
    UK micro-merchant providers, its 37-market European footprint is unmatched by direct peers,
    and its bundled Business Account mirrors Square's but at lower transaction cost. The primary
    adverse threats are softPOS commoditisation of hardware margin, price compression from
    Visa/Mastercard scheme fee increases, PayPal's consumer brand leverage, and the significant
    public-market capital advantage held by Block ($42.5 B), Shopify ($138.3 B), and Adyen
    ($34.4 B) relative to SumUp's private balance sheet.

sections:
  - id: landscape-and-segmentation
    title: Competitor Landscape and Segmentation
    body: >-
      SumUp's competitive environment divides into five identifiable clusters based on target
      merchant size, product philosophy, and distribution model. The first cluster—micro-merchant
      mPOS peers—consists of providers that share SumUp's core use case: enabling sole traders
      and small businesses to accept card payments via a compact hardware reader paired with a
      smartphone app. Square (Block, Inc.), PayPal Point of Sale (formerly Zettle), Teya, and
      myPOS all compete here on flat-rate pricing, zero-contract posture, and low-friction
      onboarding. This cluster is SumUp's highest-stakes battleground.

      The second cluster is platform-led payment infrastructure. Stripe Terminal targets
      developers and enterprises that need an API-first in-person payment capability integrated
      into broader software stacks. Shopify POS targets existing Shopify e-commerce merchants
      expanding into physical retail. Both require meaningful configuration and are not
      self-serve in the way SumUp is. The third cluster is software-led vertical POS systems:
      Lightspeed (retail and restaurant), Toast (restaurant), and Clover (Fiserv bank-bundled,
      US-first) provide deep sector software with payment acceptance embedded. SumUp's
      acquisition of Goodtill (hospitality POS) and its POS Pro product move it toward this
      cluster but from below.

      The fourth cluster is enterprise-grade acquiring: Adyen operates at enterprise and
      omnichannel scale with interchange-plus pricing that only becomes competitive above several
      million euros in annual card volume. Worldpay, Global Payments, and Nexi serve similar
      enterprise and bank-referred merchants. These providers do not compete directly with SumUp
      on micro-merchant onboarding but create a meaningful ceiling on SumUp's upmarket expansion.
      The fifth cluster is bank/acquirer bundles: Barclaycard, Lloyds Cardnet, and analogues
      in every European market distribute acquiring terminals through business banking
      relationships, often at higher per-transaction fees but with perceived incumbent trust.
      These are the status-quo substitutes SumUp displaces when winning new merchants.
