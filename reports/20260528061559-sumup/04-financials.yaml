  - id: FI004
    title: Capital intensity / cash-flow map
    type: flow
    layout: wide
    summary: >-
      Capital map showing how SumUp funds growth and where public visibility breaks. The company now combines
      hybrid/equity rounds, warehouse-like lending support, a large private-credit refinancing, and growing banking
      balances, yet still does not publish the cash, maturity, or covenant data needed to judge balance-sheet
      resilience.
    approximationNotes: >-
      This figure treats merchant deposits as safeguarded customer funds rather than free corporate cash and therefore
      separates them from the true equity/debt buffer.
    data:
      nodes:
        - id: debt-2021
          label: €750M 2021 debt round (pre-equity base)
        - id: round-2022
          label: €590M 2022 hybrid round
        - id: round-2023
          label: €285M 2023 mostly-equity round
        - id: vpc
          label: $100M VPC facility for merchant advances
        - id: private-credit
          label: $1.6B 2024 private-credit refinancing
        - id: deposits
          label: €1B+ safeguarded merchant deposits
        - id: regulated
          label: EMI / payment-institution permissions, not a bank balance sheet
        - id: growth-uses
          label: M&A, new markets, product expansion, enterprise push
        - id: opaque-buffer
          label: Cash, burn, maturities, and covenant headroom undisclosed
      edges:
        - from: debt-2021
          to: growth-uses
          label: Foundation debt stack; almost no equity before 2022
        - from: round-2022
          to: growth-uses
          label: Growth capital
        - from: round-2023
          to: growth-uses
          label: Optionality and expansion
        - from: vpc
          to: growth-uses
          label: Supports lending book
        - from: private-credit
          to: opaque-buffer
          label: Refinances debt but adds leverage questions
        - from: deposits
          to: regulated
          label: Customer funds require safeguarding
        - from: regulated
          to: opaque-buffer
          label: Deposits are not the same as corporate liquidity
        - from: growth-uses
          to: opaque-buffer
          label: Runway depends on spend pace and debt terms
