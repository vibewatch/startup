  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: revenue-mix
      missingEvidence: >-
        A management-quality revenue split across processing, hardware, software, banking, and lending, including
        geography and merchant-size mix.
      whyItMatters: >-
        The public record proves multiple monetization surfaces exist, but not how much each one contributes to revenue
        or margin.
      diligencePath: >-
        Request the last twelve months of segment revenue with gross profit and attach-rate disclosure by major product
        line.
      relatedQuestionRefs:
        - QI004
        - QI020
      relatedTableRefs:
        - TI001
    - type: private-evidence-only
      severity: material
      topic: realized-take-rate
      missingEvidence: Net take-rate waterfall after interchange, scheme fees, refunds, custom pricing, and support costs.
      whyItMatters: List pricing cannot be converted into realized unit economics without the net waterfall.
      diligencePath: Request monthly fee revenue and direct acquiring-cost bridge by payment channel and geography.
      relatedQuestionRefs:
        - QI021
        - QI022
      relatedTableRefs:
        - TI003
        - TI005
    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: Current cash, burn, runway, debt maturities, covenant headroom, and refinancing plan.
      whyItMatters: >-
        The 2024 refinancing proves access to capital but not whether balance-sheet flexibility is durable under
        downside scenarios.
      diligencePath: Request treasury reporting pack, debt agreements, covenant calculations, and downside runway analysis.
      relatedQuestionRefs:
        - QI014
        - QI015
        - QI023
        - QI028
      relatedTableRefs:
        - TI004
        - TI005
    - type: private-evidence-only
      severity: material
      topic: merchant-finance-losses
      missingEvidence: >-
        Origination vintages, defaults, delinquencies, recoveries, reserve policy, and effective yield for merchant cash
        advances.
      whyItMatters: Lending can deepen revenue quality or destroy it depending on credit performance and funding cost.
      diligencePath: >-
        Request cohort-level credit-performance tables and underwriting policy documentation for the merchant-finance
        program.
      relatedQuestionRefs:
        - QI008
        - QI026
      relatedTableRefs:
        - TI003
        - TI005
    - type: conflicting-data
      severity: material
      topic: valuation
      missingEvidence: A reconciled cap-table mark that explains the 2023 secondary print versus later IPO valuation narratives.
      whyItMatters: >-
        Entry price discipline depends on knowing whether the secondary mark, the private preferred mark, or the IPO
        narrative is the right anchor.
      diligencePath: >-
        Request latest cap table, recent secondary transactions, preferred/common share pricing, and any banker
        materials used for IPO prep.
      relatedQuestionRefs:
        - QI018
        - QI019
        - QI025
