  - id: TI004
    title: Capital adequacy table
    columns:
      - item
      - public evidence
      - current value / status
      - why it matters
      - diligence ask
    rows:
      - - 2021 pre-existing debt base
        - TechCrunch (citing SumUp CFO interview, June 2022)
        - >-
          €750M debt round in 2021; at time of June 2022 round, ~€1.5B raised total with <€100M equity; most capital
          had been debt
        - Shows structural debt dependence predates 2022; equity base was negligible before hybrid round
        - Request pre-2022 debt instruments, lender names, and current outstanding balances or repayment status
      - - 2022 hybrid round
        - Official 2022 press release and Reuters
        - €590M at €8B enterprise value; debt + equity mix; total capital raised then €1.5B
        - Established meaningful external financing support, but also early debt dependence
        - Request exact 2022 debt/equity split and current outstanding balance from that round
      - - 2023 funding round
        - Official 2023 press, Sixth Street, CNBC
        - €285M new funding; predominantly equity with a small debt component per CNBC
        - Added capital while the company claimed EBITDA positivity and margin improvement
        - Request security terms, liquidation preferences, and any debt attached to the round
      - - Victory Park Capital facility
        - CNBC and official 2023 round references
        - US$100M facility supporting merchant cash advances
        - Shows lending growth depends partly on external warehouse-like capital
        - Request facility covenants, advance rate, eligibility criteria, and current utilization
      - - 2024 private-credit refinancing
        - Official 2024 press and Fintech Futures
        - >-
          US$1.6B private credit led by Goldman Sachs; stated purpose was refinancing existing debt plus growth
          optionality
        - >-
          Confirms near-term liquidity access, but also confirms the balance sheet is debt-funded enough to require
          large-scale refinancing
        - Request debt maturity ladder, weighted average cost of debt, and covenant package
      - - Companies House charge
        - Companies House filing history
        - MR01 charge registered 20 Aug 2024
        - Public sign that secured obligations exist at the UK entity level
        - Request charge details, collateral scope, and group-guarantee structure
      - - Entity accounts
        - Companies House overview and filing history
        - Full accounts for year ended 31 Dec 2024 filed on 6 Oct 2025; next accounts due by 30 Sep 2026
        - Shows there are filed entity accounts, but not necessarily a usable consolidated group P&L for investors
        - Request consolidated audited group statements and bridge to UK entity accounts
      - - 2023 secondary market mark
        - Groupon 8-K and CNBC
        - Implied valuation roughly €3.9B from secondary sale economics
        - Critical adverse valuation datapoint that conflicts with headline private-market narratives
        - Request latest common and preferred share prices plus any 409A / board marks
      - - 2025-2026 IPO narrative
        - Sifted / Bloomberg reporting
        - Potential London IPO discussed at $10B-$15B valuation
        - >-
          Shows ambition and optionality, but increases the need for audited financial disclosure before public-market
          pricing
        - Request IPO readiness pack, auditor history, and latest internal forecast used with banks
    notes: >-
      Capital evidence is much stronger than operating-margin evidence; the issue is not whether SumUp can raise money,
      but on what terms and against what future refinancing needs.
