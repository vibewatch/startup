company:
  name: SumUp
chapter:
  number: 4
  title: Financials
  summary: >-
    SumUp’s public financial picture is directionally stronger than most private fintechs but still incomplete for
    underwriting. Official sources show a diversified monetization stack across payment processing, hardware, POS
    software, subscriptions, business banking, and merchant cash advances, plus positive EBITDA since Q4 2022 and over
    €1 billion of merchant deposits by late 2025. But the business remains debt-heavy: a 2024 US$1.6 billion
    private-credit refinancing, a public 2023 secondary mark implying roughly €3.9 billion, and no disclosed group cash,
    burn, debt maturities, realized take rate, or credit-loss metrics leave the margin path and valuation case
    underdetermined.
sections:
  - id: revenue-model-and-list-pricing
    title: Revenue model, list pricing, and monetization surfaces
    body: >-
      SumUp’s public surfaces show a classic payments-led SMB platform that has expanded well beyond a simple card
      reader. The core revenue engine is transaction processing: the UK pricing page lists 1.69% pay-as-you-go pricing
      for in-person payments, a discounted 0.99% rate under a £19-per-month Payments Plus plan, and custom terms for
      merchants processing at least £10,000 monthly. The same page also lists remote-payment pricing at 2.5%, plus
      recurring software subscriptions such as POS Plus at £29 per month, Business Account Plus at £15 per month, and
      Invoices Plus at £8 per month. Official product pages and the POS Pro site show that SumUp is trying to monetize
      not only payment acceptance, but also workflow software, reporting, accounting integrations, and cash-management
      features inside the same merchant profile.


      Official and third-party product evidence also shows that SumUp still monetizes hardware as a one-off
      customer-acquisition and attachment surface rather than as a rental business. ExpertMarket’s 2026 pricing review
      lists reader hardware from £25 + VAT to £135 + VAT, while CardPaymentOptions notes the long-standing flat-rate,
      no-monthly-fee positioning that helped SumUp scale with micro-merchants. The important underwriting distinction is
      that all of these are list prices or catalog prices, not realized pricing. Public materials explicitly route
      higher-volume merchants into bespoke pricing, and third-party breakdowns note that the 0.99% discount applies only
      to eligible in-person consumer-card volume. That means public price cards are useful for understanding
      monetization mechanics and sales motion, but not for inferring the blended take rate or gross profit actually
      retained after interchange, schemes, hardware costs, refunds, support, and negotiated discounts.
    claimRefs:
