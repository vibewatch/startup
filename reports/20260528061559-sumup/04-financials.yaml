  - id: TI003
    title: Unit economics table
    columns:
      - metric
      - public value / status
      - confidence
      - why it matters
      - diligence ask
    rows:
      - - Merchant scale
        - 4M+ businesses
        - High
        - Large merchant base supports diversified demand and embedded cross-sell potential
        - Request active transacting merchants by cohort and geography
      - - Business-account users
        - 1.5M active users
        - High
        - Shows banking adoption, retention potential, and a distribution base for other financial services
        - Request monthly active funded accounts and deposit retention by cohort
      - - Merchant deposits
        - ">€1B customer deposits"
        - High
        - Signals trust and balance-sheet relevance of banking features, even if safeguarded rather than bank-funded
        - Request average balances, payout frequency, and revenue earned per funded account
      - - Merchant finance scale
        - 250K+ SMEs funded; 1M+ offers issued
        - High
        - Confirms lending is material enough to matter to revenue quality and risk
        - Request vintages, approval rates, loss curves, and repeat-borrower share
      - - Profitability status
        - Positive EBITDA since Q4 2022
        - High
        - Important proof that the model is not purely growth-at-all-costs
        - Request audited EBITDA bridge to operating cash flow
      - - Growth rate
        - 30%+ top-line growth through 2023
        - High
        - Shows the platform was still growing while improving EBITDA margins
        - Request 2024-2026 revenue bridge and segment growth rates
      - - Third-party revenue estimate
        - Sacra estimates about $600M annualized revenue in 2025
        - Medium
        - Useful anchor for scenario work, but not a substitute for audited disclosure
        - Request audited 2025 revenue and reconciliation versus any management-adjusted run rate
      - - Realized blended take rate
        - Not publicly disclosed
        - Medium
        - This is the single best bridge from merchant volume to net revenue
        - Request product- and geography-level take-rate waterfall after schemes and interchange
      - - Gross margin
        - Not publicly disclosed
        - Medium
        - Needed to judge whether hardware, support, and acquiring costs are scaling favorably
        - Request gross profit by line of business and margin bridge
      - - CAC / payback / NRR / churn
        - Not publicly disclosed
        - Medium
        - Needed to judge whether the platform deepens economics as merchants adopt more tools
        - Request cohort retention, CAC by channel, and payback by merchant size
      - - Credit losses / recoveries on merchant finance
        - Not publicly disclosed
        - Medium
        - Needed to separate lending volume from lending quality
        - Request default, delinquency, recovery, and reserve metrics by origination vintage
    notes: >-
      The table mixes disclosed public anchors with explicit nulls where the reviewed source set did not provide
      underwriting-grade unit economics.
