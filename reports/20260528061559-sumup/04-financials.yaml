  - id: FI003
    title: Financial estimate range
    type: range
    layout: standard
    summary: >-
      Public financial anchors available for SumUp. Some are true ranges and others are single public marks, which is
      itself the problem: financing and valuation headlines are visible, but disclosure depth is not.
    approximationNotes: >-
      The secondary valuation item is an inferred point estimate from the Groupon 8-K transaction economics,
      corroborated by CNBC. The IPO item is reported market talk, not company guidance.
    data:
