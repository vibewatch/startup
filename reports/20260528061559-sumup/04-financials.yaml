tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - stream
      - mechanism
      - unit
      - current value/status
      - quality
      - diligence ask
    rows:
      - - Card-present acquiring
        - >-
          Usage-based processing fees on in-person transactions via readers, terminals, kiosks, and POS-linked
          acceptance
        - "% of payment volume"
        - >-
          UK list pricing is 1.69% pay-as-you-go or 0.99% under Payments Plus for eligible in-person consumer-card
          volume
        - "High on mechanism, medium on economics: monetization is obvious but blended realized take rate is not public"
        - Request realized take rate by geography/card mix after interchange, schemes, and custom discounts
      - - Remote payments
        - Payment links, invoices, online store, and other card-not-present acceptance
        - "% of payment volume"
        - UK list pricing is 2.5%; public sources do not show remote share of revenue or mix by tool
        - "Medium: revenue stream is visible, but volume mix and refund/chargeback leakage are private"
        - Request remote GMV share, refund rates, chargeback rates, and blended net revenue after fraud loss
      - - Hardware sales
        - One-off sale of card readers and terminals that seed merchant acquisition and attachment
        - Per device sold
        - >-
          Third-party 2026 pricing shows a visible UK range of roughly £25 + VAT to £135 + VAT with no rental model
          highlighted
        - "Medium: hardware clearly monetizes, but margin could range from profit center to subsidized acquisition tool"
        - Request hardware COGS, attach rates, replacement rates, and any subsidy policy by merchant cohort
      - - POS software and workflow tools
        - Recurring software upgrades such as POS Plus, plus vertical POS deployments for retail and hospitality
        - Monthly subscription / contract
        - >-
          POS Plus is listed at £29 per month; POS Pro positioning points to higher-touch enterprise and multi-store use
          cases, but enterprise pricing is undisclosed
        - "Medium-high: recurring software is attractive if attach is real, but no public attach or churn figures exist"
        - Request POS paid-seat count, ARPU, churn, and enterprise contract-value distribution
      - - Business-account and cash-management tools
        - Free base account plus paid upgrades, faster payouts, cards, transfers, cash deposits, and local IBAN features
        - Monthly subscription plus indirect retention / float effects
        - >-
          Business Account Plus is listed at £15 per month; base account is marketed as free; over €1 billion of
          merchant deposits and 1.5 million active users were reported in late 2025
        - "Medium: product scale is real, but deposit economics, funding cost, and direct revenue take are undisclosed"
        - Request net interest / fee revenue, deposit retention, payout-cost economics, and paid-upgrade penetration
      - - Merchant finance
        - Merchant cash advances repaid through future transaction flows and supported by external credit capacity
        - Advance fees / financing income
        - >-
          Public sources show UK launch with VPC support, a $100 million VPC credit facility, and more than 250,000 SMEs
          funded with 1 million-plus offers
        - "Medium: product scale is real, but underwriting quality and loss content are private"
        - Request vintage defaults, loss rates, reserve policy, effective yield, and funding-cost waterfall
    notes: Public monetization surfaces are visible, but full internal revenue mix and realized economics are not disclosed.
