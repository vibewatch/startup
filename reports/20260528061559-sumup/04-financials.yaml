callouts:
  - calloutType: strength
    title: Payments is only the entry point
    body: >-
      Public evidence shows SumUp has already widened monetization into software, banking, and merchant finance. That
      breadth can improve retention and contract value even if raw acquiring margins compress.
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI011
      - CI027
      - CI028
      - CI052
  - calloutType: risk
    title: Debt is part of the model, not just a bridge
    body: >-
      The 2024 US$1.6 billion refinancing and the VPC facility mean capital adequacy depends on lender appetite and debt
      terms, not just operating momentum. Without a maturity ladder and covenant package, refinancing exposure remains a
      core diligence risk.
    claimRefs:
      - CI022
      - CI023
      - CI024
      - CI035
      - CI044
  - calloutType: recommendation
    title: Ask for audited group economics before underwriting the valuation story
    body: >-
      The public record supports scale and product breadth, but not a reliable revenue-to-margin waterfall. Before
      leaning into any IPO-style valuation case, request audited consolidated statements, segment gross margins, debt
      maturities, and lending vintages.
    claimRefs:
      - CI037
      - CI039
      - CI042
      - CI043
      - CI044
      - CI049
      - CI050
