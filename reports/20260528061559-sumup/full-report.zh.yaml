  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 支柱
      - 投资逻辑
      - 反向逻辑
      - 何种证据会改变判断
    rows:
      - - 规模
        - 4M+ 商户、1B+ 年交易量和 1.5M 活跃企业账户用户，说明平台真实存在
        - 没有干净的合并收入分母，规模本身不能证明溢价估值有支撑
        - 经审计的集团收入桥接和分部报告
      - - 盈利能力
        - 管理层称 EBITDA 自 Q4 2022 起转正
        - 只有 EBITDA 证明，没有毛利率、take rate 和现金流细节，仍可能掩盖低质量盈利
        - 分部利润率瀑布图和现金转化
      - - 产品广度
        - 企业账户、存款、借贷、POS 和企业销售，可把 SumUp 推到纯收单之上
        - 如果大部分经济模型仍来自低倍数商户收单，溢价可比估值逻辑就会断裂
        - 分部组合和附加率数据
      - - 资本结构
        - 多次拿到融资，说明贷方和投资人仍支持该平台
        - 债务再融资和未披露的优先权条款，可能给股权埋下隐藏的下行不对称
        - 债务到期、契约和清算优先权资料包
      - - 市场叙事
        - 伦敦或美国 IPO 选择权带来上行空间，前提是披露改善
        - 当前 IPO 报道基于媒体泄露和目标区间，不是公开审计数字
        - 可交给银行的审计报表和治理资料包
      - - 治理
        - 创始人看起来投入度高，且仍深度参与
        - 实体层面的高管披露，不等于集团层面的董事会和治理透明度
        - 完整董事会、委员会和决策权披露
    notes: 这张表把真实业务质量和仍阻碍溢价承销判断的未解问题拆开。
