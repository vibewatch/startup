      - number: '8.3'
        title: 乐观、基准、悲观情景和建议逻辑
        blocks:
          - type: paragraph
            body: >-
              SumUp 的情景工作必须锚定已经观察到的公开价格，而不是假装缺失的分母已经知道。悲观情景很直接：如果公开市场继续以低个位数收入倍数给商户收单定价，而 SumUp 又无法达到高溢价上市的披露门槛，那么
              Groupon 式老股信号附近的 $4 billion 到 $5 billion 就成为相关估值走廊。基准情景更宽容：假设 EBITDA
              证明站得住，银行和企业扩张加深变现，公司值得高于低倍数可比公司群组交易，但在经审计集团数据出来前仍低于愿景式 IPO 标题；这支持大约 $6 billion 到 $8.5 billion
              的区间。乐观情景就是报道中的 IPO 叙事本身：只有在尽调证明 SumUp 更接近高溢价混合型可比公司，而不是纯收单机构时，$10 billion 到 $15 billion
              才成立。因为证据还没越过这道门槛，今天最能支撑的判断是观察，中等信心、高风险，当前估值立场偏高。
