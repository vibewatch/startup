      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              对一家这种规模的公司来说，SumUp 的资本结构并不常见：累计融资的大头是债而不是股，这让创始人和早期投资者稀释较低，但也带来持续偿债义务和再融资风险。联合创始人 Christ 在 2022 年 6
              月表示，SumUp 当时累计募集的 €1.5 billion 中，2022 年融资前的股权融资不到 €100 million。


              关键轮次如下：2021 年 3 月，SumUp 通过债务融资 €750 million，是当时欧洲私营初创公司史上规模最大的债务融资之一。2022 年 6 月，SumUp 在 €8 billion（$8.5
              billion）企业价值下融资 €590 million（$624 million）；该轮由 Bain Capital Tech Opportunities 领投，BlackRock、btov
              Partners、Centerbridge、Crestline、Fin Capital 和 Sentinel Dome Partners 参投。该轮为 50% 股权、50% 债务的混合融资。2023 年 12
              月，SumUp 融资 €285 million（$307 million），由 Sixth Street Growth 领投，Bain Capital Tech Opportunities、Fin Capital
              和 Liquidity Group 继续参投。该轮以股权为主，并确认相较 2022 年 €8 billion 估值有所上调，但没有披露新的精确估值。2024 年 5 月，SumUp 完成由 Goldman
              Sachs 牵头的 US$1.6 billion 私人信贷（债务）交易——这是欧洲同类私人信贷交易中规模最大的交易之一——资金用于再融资现有债务，因此不是新增股权融资。2024 年信贷的其他参与方包括
              AllianceBernstein、Apollo Global Management、Arini、Deutsche Bank AG、Fortress Investment Group、SilverRock
              Financial Services 和 Vista Credit Partners；现有贷款方 BlackRock、Crestline、Liquidity Capital、Oaktree Capital
              Management、Sentinel Dome 和 Temasek 也参与其中。


              2023 年中，老股市场活动给估值发出一个相冲突的信号：Groupon 在 SEC 文件中披露，其出售 SumUp 股份的价格隐含企业价值仅 €3.9 billion，不到 2022 年名义估值的一半。SumUp
              2023 年 12 月的新股融资被包装为确认相对 €8 billion 估值有所上调，但老股市场折价对任何尽调而言都是实质红旗。
