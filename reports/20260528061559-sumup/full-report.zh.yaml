      - number: '8.2'
        title: 投资逻辑、反向逻辑和可比公司背景
        blocks:
          - type: paragraph
            body: >-
              SumUp 案子的正面部分有证据支撑。公司仍声称拥有超过 400 万商户、超过 10 亿笔年交易、150 万活跃 Business Account 用户和超过 €1 billion
              存款，并推动企业端扩张，把故事拓展到读卡器之外。管理层还称公司自 2022 年底以来 EBITDA
              为正。这些事实足以排除简单的“坏掉的金融科技公司”叙事。反向逻辑是，这些事实没有给投资人一个干净的合并收入分母，也没有提供申报级的资本结构和治理图景。公开可比公司分析在这里很重要，因为直接可比的收单和 POS
              名称——Shift4、PayPal、Block 和 Toast——大致筛在 1.0x 到 2.3x 收入，而 Adyen 和 Shopify 这类高溢价混合体约在 11x 到
              12x，并提供强得多的披露。如果银行、软件和企业组合是真实驱动，SumUp 也许应该高于低倍数群组；但公开来源还没有足够经审计证据，把它有把握地放到区间高端。
