  - id: TI003
    title: 单位经济表
    columns:
      - 指标
      - 公开数值 / 状态
      - 置信度
      - 重要性
      - 尽调请求
    rows:
      - - 商户规模
        - 4M+ 家企业
        - 高
        - 庞大商户基础支撑需求分散度，也为嵌入式交叉销售打开空间
        - 要求按队列和地区提供活跃交易商户数
      - - Business Account 用户
        - 1.5M 活跃用户
        - 高
        - 显示银行功能已有采用度、留存潜力，也为其他金融服务提供分发基础
        - 要求按队列提供月活有资金账户数和存款留存
      - - 商户存款
        - '>€1B 客户存款'
        - 高
        - 即便资金是受保护而非银行自有，也说明银行功能获得信任并影响资产负债表
        - 要求提供平均余额、打款频率，以及每个有资金账户贡献的收入
      - - 商户融资规模
        - 250K+ 家 SME 获得资金；已发出 1M+ 份要约
        - 高
        - 证明贷款业务规模已足够大，会影响收入质量和风险
        - 要求提供放款年份、批准率、损失曲线和重复借款人占比
      - - 盈利状态
        - 自 2022 年 Q4 起 EBITDA 为正
        - 高
        - 这是模型并非只靠不计成本增长的关键证明
        - 要求提供经审计 EBITDA 到经营现金流的桥表
      - - 增长率
        - 截至 2023 年收入增长 30%+
        - 高
        - 说明平台在改善 EBITDA 利润率的同时仍在增长
        - 要求提供 2024–2026 年收入桥表和分部增长率
      - - 第三方收入估计
        - Sacra 估计 2025 年年化收入约 $600M
        - 中
        - 可作为情景测算锚点，但不能替代经审计披露
        - 要求提供经审计 2025 年收入，并与任何管理层调整后的运行率对账
      - - 实际混合抽佣率
        - 未公开披露
        - 中
        - 这是从商户交易量推导净收入的最佳桥梁
        - 要求提供扣除卡组织费用和交换费后的产品、地区层面抽佣率瀑布
      - - 毛利率
        - 未公开披露
        - 中
        - 需要用它判断硬件、支持和收单成本是否随规模改善
        - 要求按业务线提供毛利和利润率桥表
      - - CAC / 回本周期 / NRR / 流失
        - 未公开披露
        - 中
        - 需要用它判断商户采用更多工具后，平台经济性是否加深
        - 要求按商户规模提供队列留存、渠道 CAC 和回本周期
      - - 商户融资的信用损失 / 回收
        - 未公开披露
        - 中
        - 需要用它把贷款规模和贷款质量分开
        - 要求按放款年份提供违约、逾期、回收和准备金指标
    notes: 本表混合了已披露的公开锚点，也明确标出所审阅资料未提供、足以承销判断的单位经济缺口。
