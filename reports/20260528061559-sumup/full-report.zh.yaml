  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: 以六层视角拆解 SumUp 的商户栈，从应用和设备延伸到底层集成、资金流转和信任基础设施。
    data:
      layers:
        - label: 商户控制层
          detail: iOS 和 Android 上的 Business app，加上 POS 前端、Kiosk 和 Local 消费者 app，协同处理设置、目录、报表、忠诚度和预约。
        - label: 收款设备层
          detail: Solo Lite 处理与手机配对的收款；Solo 和 Terminal 处理独立结账；Tap to Pay 在无接触场景下去掉单独硬件。
        - label: 商业软件层
          detail: POS、POS Lite、Kiosk、Online Store、Payment Links、Invoices、Bookings 和 Loyalty 把支付收款变成商户日常运营。
        - label: 集成层
          detail: Reader SDK、Cloud API、Payment Switch、REST API 和 webhook 让 SumUp 能嵌入第三方 app、自助终端和 POS 系统。
        - label: 资金流转层
          detail: 卡组织、钱包、Business Account、Mastercard、ACH / Faster Payments / SEPA、现金存款、本地 IBAN 和 Cash Advance 构成商户结账下方的资金层。
        - label: 信任与基础设施层
          detail: DNB EMI 许可、FCA 式资金保护、AWS 支撑的 POS 基础设施、PCI 披露、GitHub 仓库和应用商店分发支撑整套栈。
    approximationNotes: 该栈由官方产品页、开发者文档、应用商店列表、监管条目和 Goodtill 安全说明拼出；SumUp 未发布一张标准架构图。
