  - id: TI004
    title: 资本充足性表
    columns:
      - 项目
      - 公开证据
      - 当前数值 / 状态
      - 重要性
      - 尽调请求
    rows:
      - - 2021 年既有债务基础
        - TechCrunch（引用 SumUp CFO 2022 年 6 月访谈）
        - 2021 年债务融资 €750M；截至 2022 年 6 月融资时累计融资约 €1.5B，其中股权 <€100M；大部分资本来自债务
        - 说明 2022 年之前就已结构性依赖债务；混合轮之前股权基础几乎可以忽略
        - 要求提供 2022 年前债务工具、贷款方名称，以及当前未偿余额或偿还状态
      - - 2022 年混合融资
        - 官方 2022 年新闻稿和 Reuters
        - 企业价值 €8B 下融资 €590M；债务 + 股权混合；彼时累计融资 €1.5B
        - 建立了有意义的外部融资支持，但也显示早期债务依赖
        - 要求提供 2022 年债务 / 股权的精确拆分，以及该轮当前未偿余额
      - - 2023 年融资轮
        - 官方 2023 年新闻稿、Sixth Street、CNBC
        - 新融资 €285M；CNBC 称主要为股权，带少量债务
        - 公司称 EBITDA 为正、利润率改善时仍补充了资本
        - 要求提供证券条款、清算优先权，以及该轮附带的任何债务
      - - Victory Park Capital 额度
        - CNBC 和官方 2023 年融资引用
        - US$100M 额度，用于支持商户现金预支
        - 显示贷款增长部分依赖外部、类似仓储融资的资本
        - 要求提供额度契约、预付率、合格标准和当前使用率
      - - 2024 年私人信贷再融资
        - 官方 2024 年新闻稿和 Fintech Futures
        - Goldman Sachs 牵头 US$1.6B 私人信贷；公司称用途是再融资既有债务，并保留增长选择权
        - 证明短期内仍能获得流动性，但也确认资产负债表依赖债务，规模已大到需要大额再融资
        - 要求提供债务到期阶梯、加权平均债务成本和契约组合
      - - Companies House 抵押登记
        - Companies House 申报历史
        - MR01 抵押于 2024 年 8 月 20 日登记
        - 公开信号显示英国实体层面存在担保义务
        - 要求提供抵押细节、抵押品范围和集团担保结构
      - - 实体账目
        - Companies House 概览和申报历史
        - 截至 2024 年 12 月 31 日年度的完整账目已于 2025 年 10 月 6 日提交；下一份账目截止日为 2026 年 9 月 30 日
        - 说明已有实体账目归档，但投资者未必能拿到可用的合并集团损益表
        - 要求提供经审计合并集团报表，并与英国实体账目桥接
      - - 2023 年二级市场估值标记
        - Groupon 8-K 和 CNBC
        - 按二级出售经济性推算，隐含估值约 €3.9B
        - 这是关键反向估值数据点，与私募市场头部叙事冲突
        - 要求提供最新普通股和优先股股价，以及任何 409A / 董事会估值标记
      - - 2025–2026 年 IPO 叙事
        - Sifted / Bloomberg 报道
        - 据讨论，潜在伦敦 IPO 估值为 $10B-$15B
        - 显示野心和选择权，但在公开市场定价前，更需要经审计财务披露
        - 要求提供 IPO 准备资料包、审计机构历史，以及与投行使用的最新内部预测
    notes: 资本证据远强于经营利润率证据；问题不在于 SumUp 能否融资，而在于融资条款如何、未来还需要面对哪些再融资需求。
