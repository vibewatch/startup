            title: 37 个市场足迹在自助式 mPOS 同行中无人匹敌
            body: >-
              没有其他自助式、零合约 mPOS 提供商同时服务 37 个市场。Square 运营于 9 个市场。PayPal 覆盖很广，但依靠 PayPal 消费者网络，而不是在每个国家都有专门 mPOS 产品。SumUp
              的多市场监管牌照（英国 FCA、爱尔兰 CBI，以及 30+ 市场的国家牌照）给任何试图实现可比覆盖的新挑战者设置了很高复制成本。
