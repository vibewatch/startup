  - id: TV005
    title: 投资逻辑破裂与叫停触发条件表
    columns:
      - 触发条件
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 新的老股折价或估值下调轮
        - 新的私募市场定价再次在接近或低于 Groupon 式成交价处出清
        - 说明市场仍不接受溢价 IPO 框架
        - 从悲观区间重新承销，或直接离场
      - - 合并经济模型偏弱
        - 经审计集团收入、利润率或 take rate 明显弱于溢价混合可比估值所需水平
        - 打断业务质量通向估值支撑的桥
        - 重置到低倍数公开可比公司
      - - 资本结构悬顶
        - 债务契约、到期墙或优先股堆叠吸走过多下行价值
        - 即便经营仍可接受，股权回报也会变得不对称
        - 要求显著更低入场价，或回避
      - - 银行 / 企业业务附着不及预期
        - 存款、借贷或企业扩张未能加深货币化
        - SumUp 看起来更像支付处理商，而不是拓宽后的金融 OS
        - 降低上行权重，留在低倍数走廊
      - - 治理资料包仍薄
        - 董事会、委员会和集团领导层披露低于 IPO 标准
        - 按公开市场要求，溢价估值无法自洽
        - 等治理尽调完成后再投资
    notes: 这些是投资逻辑破裂条件，不是常规 KPI。每一项都会比普通商户增长更新更快改变估值支撑。
    claimRefs:
      - CV011
      - CV041
      - CV042
      - CV044
      - CV045
      - CV050
      - CV051
      - CV053
      - CV055
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人 / 尽调路径
    rows:
      - - 合并经审计财务
        - 2024-2025 经审计收入、毛利润、EBITDA、现金流和资产负债表
        - 需要用它把 SumUp 放到正确的公开可比公司轴线上，并测试 IPO 级估值支撑
        - 财务团队、审计师资料包和董事会批准的年度业绩材料
      - - 分部组合和单位经济模型
        - 支付、POS、银行、借贷和企业业务收入拆分，以及各分部 take rate、毛利率和留存
        - 决定 SumUp 应该按低倍数支付处理可比公司估值，还是享受溢价混合估值
        - FP&A 和业务线负责人
      - - 债务和契约资料包
        - 2024 年私募信贷的到期安排、定价、契约、抵押品和再融资灵活性
        - 压力退出时，债务占比高的融资可能主导股权下行
        - 资金管理工作流和贷方材料
      - - 股权结构表和优先权条款
        - 清算优先权、优先级、反稀释、认股权证以及任何附函
        - 没有这些，表观估值可能不等于普通股等价价值
        - 法律顾问和董事会材料
      - - 治理资料包
        - 集团董事会构成、委员会、集团 CEO 或同等职权图谱，以及创始人控制权
        - IPO 级估值通常需要 IPO 级治理清晰度
        - 公司秘书和投资者关系工作流
      - - 老股市场证据
        - Groupon 数据点之后，近期要约或老股交易定价、成交量和参与者组合
        - 说明这次反向成交价是孤例，还是仍代表市场出清信号
        - 股东名册审查和经纪商核验
    notes: 这些要求刻意收窄：只聚焦最可能改变建议或估值区间的缺失项。
    claimRefs:
      - CV041
      - CV042
      - CV053
      - CV054
      - CV055
