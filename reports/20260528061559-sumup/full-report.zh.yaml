      - number: '5.2'
        title: 结账架构和外部依赖
        blocks:
          - type: paragraph
            body: >-
              SumUp 的公开文档已经具体到足以画出运营模型。线下收单分三种模式：Solo Lite 这类与手机配对的读卡器、Solo 和 Terminal 这类独立读卡器，以及在兼容 iPhone 或 Android
              设备上纯软件化运行的 Tap to Pay。上层是商业层：POS/POS Lite、Kiosk、Online Store、Payment Links、Invoices、Bookings 和
              Loyalty。底层是集成层：Reader SDK、Cloud API、Payment Switch、REST API 和结账状态 webhook。这让 SumUp 比纯封闭读卡器厂商更具可扩展性，尤其适合
              Kiosk 和嵌入式 POS 场景。依赖链也很清楚。收单依赖卡组织和钱包、移动操作系统、应用商店分发以及可靠互联网连接。Cloud API 降低了蓝牙耦合，但 Solo 仍依赖 Wi-Fi 或移动数据，Tap
              to Pay 也只限于支持 NFC 手机上的非接触式流程。POS 资产方面，Goodtill 安全说明把后端托管指向 AWS
              eu-west-1。公开缺口不是有没有依赖，而是这些依赖有多集中：面向企业买家，SumUp 仍未公开收单路由图、硬件制造披露，或量化的正常运行时间 / SLA 记录。
