        title: 耐久性可见度不完整：评论普遍认可易用性，但支持和资金访问投诉是真实反向信号
        blocks:
          - type: paragraph
            body: >-
              SumUp 的公开耐久性证据有一个重要的混合面。正面看，Trustpilot 上 SumUp 基于 43,000 多条评论得分
              4.1/5，其自动摘要强调易用性、设置简单、可靠性和费用透明。一位近期评论者明确称自己使用 SumUp 超过五年，没有月费，且除银行假日外次日到账可靠；TrustRadius
              评论也提到支付可靠，以及活动或户外酒吧部署。JustUseApp 没那么热情，但基于 675 条评论的 3.8/5 仍大体偏正面。问题在于，这些都不是留存指标。公开资料没有 NRR、GRR、logo
              流失、支付量留存或合同期限披露。与此同时，反向证据很具体，不是抽象抱怨。Trustpilot 也浮现了响应慢、资金被扣留且通知不清的投诉；CardPaymentOptions
              称资金冻结和支持问题仍反复出现；Resolver 称资金访问和支付问题是最常见投诉类别；Financial Ombudsman 支持了一起针对 SumUp 沟通不佳的投诉，并责令赔偿 £400。SumUp
              自己的投诉、拒付和欺诈通知页面确认，争议和出款审核都是运营现实的一部分。所以满意度可见，但耐久性经济性不可见——支持摩擦是公开记录里最清楚的留存风险。
