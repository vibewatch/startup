      - number: '3.5'
        title: 差异化、切换经济性与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              SumUp 的核心竞争差异化落在四根支柱上：（1）英国微型商户细分中公开宣传最低的固定交易费率（1.69%，对比 Square 和 PayPal Zettle 的 1.75%）；（2）自助式 mPOS
              提供商中最广的直接市场足迹（37 个市场，对比 Square 约 9 个市场）；（3）Business Account + POS
              打包，把支付受理旁边的银行关系变成留存抓手；（4）移动优先入驻，无信用检查、无合约、无最低交易量。第一项优势很窄且脆弱：6 个基点的利润差，不足以抵御愿意按 SumUp 费率或更低费率定价的竞争者。Square
              和 Teya 都已转向可比或打包定价，在特定交易量门槛以上的商户中，实际削弱了这项优势。

              mPOS 细分中的商户切换成本结构性较低。硬件是一次性买断（不是租赁），移动应用账户可免费创建，交易历史可以导出，因此没有数据锁定。多归属（同时使用多个提供商）很常见：个体经营者可能用 SumUp
              处理线下付款，同时用 PayPal 做在线开票。主要留存机制是 Business Account：一旦商户经营现金流沉淀到 SumUp 账户，并持有 SumUp Mastercard，切换摩擦就会实质上升——类似
              Square（Square Banking/Cash App）和 Shopify（Shopify Balance）采用的黏性模型。

              反向竞争威胁包括：（a）softPOS 商品化——在未改装智能手机上 tap-to-pay（Apple iOS 17+、Android 和所有主要支付体系均支持）正让专用读卡器硬件越来越不必要，压缩 SumUp
              硬件收入，并移除过去有利于 SumUp 即插即用读卡器的一个入驻摩擦壁垒；（b）支付体系费用上升带来价格压缩——2022 年后 Visa 和 Mastercard 多次提高卡组织费用，估计每年给英国商户增加
              £200 million+ 成本，削弱固定费率提供商在 1.69%–1.75% 标价上的净利润；（c）资本市场可得性——Block、Shopify 和 Adyen
              都有公开股权和深度信贷市场，可为商户获取补贴、硬件促销或亏损引流定价提供资金，而 SumUp 必须从运营或债务工具中自筹，限制了其竞争火力。SumUp 2023 年的 €285 million
              私人信贷提供了现金跑道，但没有公开资产负债表的流动性深度。
