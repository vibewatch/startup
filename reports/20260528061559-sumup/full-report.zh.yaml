      - number: '7.2'
        title: 运营、欺诈和可靠性风险
        blocks:
          - type: paragraph
            body: >-
              运营可靠性是公开记录里证据最干净的风险。IsDown 称自 2021 年以来已追踪 255 起 SumUp 事件，仅过去 90 天就有 11
              起，其中包括两次重大宕机，中位解决时间略高于两小时。近期事件集与商户现金流直接相关：2026 年 5 月 19 日，Business Account 转出和转入延迟了约 20
              小时；其他春季事件影响了读卡器连接、Cloud API 交易、收据和销售历史、支持聊天，以及 Santander UK 发行的卡。Downdetector
              的问题分类指向同样广的故障面：应用、登录、支付、购买、资金转账、QR code 和网站。


              商户反馈渠道和申诉专员裁决说明，当控制与资金流动交叉时，痛感最强。Trustpilot 评论和 BBB
              投诉反复提到资金冻结、出款延迟、验证混乱、退款或拒付摩擦，以及支持响应慢。申诉专员案例显示，欺诈处理和开户验证失败都可能造成直接商户损失并触发赔偿。随着 SumUp 的 Business Account
              产品承载超过 €1 billion 存款和 150 万活跃用户，未来任何服务或控制失灵的影响半径，都比公司主要还是读卡器收单机构时更大。


              公开安全证据比沉默好，但仍薄于上市公司控制包。SumUp 运营一个私有 HackerOne 漏洞赏金计划，设有奖励、公开规则、响应时间线和范围指引。开发者材料称 Cloud API 符合 PCI
              要求，需要设备授权或基于 API key 的访问，对卡数据做端到端加密，拒绝明文 HTTP 或未经认证的 API 调用，并要求集成方通过 API 验证 webhook 事件，而不是相信原始通知。SumUp
              还维护一个公开欧洲状态页，列明组件。这些都是正面的控制指标，但保留的来源集仍没有提供等同于泄露历史、GDPR 运营指标或独立认证安全报告的材料。因此，数据、隐私和安全风险仍然重要，尽管 SumUp
              显然在基线控制上有投入。
