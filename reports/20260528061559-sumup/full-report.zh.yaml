  - id: FU001
    title: 客户旅程图——SumUp 先落地后扩张路径
    type: journey-map
    layout: wide
    summary: 用六个阶段展示 SumUp 如何把商户从简单支付收款推进到软件、银行服务、融资，并最终进入企业级运营。
    data:
      items:
        - label: 获取低摩擦读卡器
          description: 个体商户、自由职业者和微型商户采用银行卡收款，因为设置容易、合同摩擦低、定价简单。
        - label: 运行日常结账
          description: 商户开始在日常服务中使用 SumUp，处理持卡现场支付、移动结账，并期待次日打款。
        - label: 添加工作流软件
          description: 零售和餐饮商户接入 POS 工作流，包括报表、库存、桌边服务、厨房路由和促销。
        - label: 采用商业银行服务
          description: 打款沉淀进入 SumUp 商业账户，形成存款余额，也加深日常运营依赖。
        - label: 使用融资和忠诚度
          description: 商户现金预支、忠诚度、数字点单和多张卡让绑定超出商品化收单。
        - label: 扩展到多门店 / 场馆使用
          description: 当 SumUp 成为多地点运营、场馆自助终端和全场馆支付编排的一部分时，最强的公开企业级证据才出现。
    claimRefs:
      - CU004
      - CU006
      - CU008
      - CU025
      - CU027
      - CU039
  - id: FU002
    title: 采用 / 部署漏斗——从微型商户到企业级场馆
    type: flow
    layout: wide
    summary: 定性部署流展示公开证据如何从简单支付收款推进到运营软件、银行服务绑定和场馆级铺开。
    data:
      nodes:
        - id: reader
          label: 读卡器入驻
          detail: 最初的价值主张是让微型商户、自由职业者和简单服务型企业轻松接受银行卡。
          tone: positive
        - id: daily
          label: 商户日常使用
          detail: 商户用 SumUp 处理反复发生的持卡现场交易、移动结账，以及基础订单或库存工作流。
          tone: positive
        - id: pos
          label: POS 工作流附加
          detail: 零售和餐饮客户加入报表、厨房管理、桌边服务、促销和多门店控制。
          tone: positive
        - id: banking
          label: 银行和融资绑定
          detail: 商业账户、现金存款、本地 IBAN 和商户现金垫款，让商户更依赖 SumUp 这个主要金融伙伴。
          tone: neutral
        - id: enterprise
          label: 企业 / 场馆铺开
          detail: The O2 和 Between the Bridges 表明，SumUp 正借助 POS、自助终端和 QR 点单编排，进入吞吐量更高的场馆。
          tone: positive
      edges:
        - from: reader
          to: daily
        - from: daily
          to: pos
        - from: pos
          to: banking
        - from: banking
          to: enterprise
    approximationNotes: 这是定性的运营流程，不是量化转化漏斗。公开来源能证明这些阶段存在，但没有披露每一步的商户数量或转化比例。
    claimRefs:
      - CU002
      - CU006
      - CU018
      - CU020
      - CU025
      - CU026
      - CU028
  - id: FU003
    title: 客户证明矩阵——SumUp 具名部署证据质量
    type: matrix
    layout: wide
    summary: 用来判断 SumUp 公开具名客户案例里，到底披露了多少真实部署细节。
    data:
      columns:
        - 证据质量
        - 结果具体度
        - 生产成熟度
        - 持续性可见度
      rows:
        - label: Netzel’s Barbershop 案例
          values:
            - 中
            - 店主方向性引述
            - 生产环境
            - 低
        - label: Market Place
          values:
            - 中
            - 工作流和报表收益
            - 生产环境
            - 低
        - label: Udderlicious
          values:
            - 中
            - 三年使用说法
            - 生产环境
            - 中
        - label: Between the Bridges 案例
          values:
            - 高
            - 覆盖全场馆运营范围
            - 生产环境
            - 低
        - label: The O2
          values:
            - 高
            - POS 和自助终端部署范围
            - 生产环境
            - 低
    claimRefs:
      - CU013
      - CU015
      - CU017
      - CU018
      - CU020
      - CU042
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 基于本章留存的公开证据，用热力图矩阵把 SumUp 的主要风险放入不同发生概率和严重度区间。
    data:
      columns:
        - 低概率
        - 中概率
        - 高概率
      rows:
        - label: 灾难级严重度
          values:
            - ''
            - 数据安全或隐私控制失效
            - 在 >€1bn 存款底盘上，结算问题和宕机反复出现
        - label: 高严重度
          values:
            - 牌照或保障资金安排失效
            - 依赖再融资 / 资本市场；合作银行 / 发起银行中断
            - 支付网络中断
        - label: 中高严重度
          values:
            - 欺诈 / 退款控制失误
            - 企业业务执行承压
            - 资金被扣、支持响应慢、竞争压低抽成率，侵蚀商户信任
        - label: 中等严重度
          values:
            - 新增申诉专员赔偿裁决
            - 爱尔兰管理层交接摩擦；PSD3/PSR 或 AML 整改负担
            - 本地 IBAN / 银行业务铺开复杂度
        - label: 监测级严重度
          values:
            - 公司边界变化
            - 单一市场支付网络覆盖缺口
            - 投诉节奏加快
    approximationNotes: 位置来自截至 2026-05-28 的公开证据定性综合；内部风险评分、宕机成本数据、监管通信和分部利润率披露，都可能显著改变象限位置。
    claimRefs:
      - CR014
      - CR023
      - CR025
      - CR036
      - CR044
      - CR045
      - CR046
      - CR047
      - CR048
      - CR064
      - CR066
      - CR067
  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 展示合规、宕机和商户信任失灵如何层层传导，变成流失、更高支持成本和融资压力。
    data:
      nodes:
        - id: n1
          label: 验证 / 控制缺口
          type: risk-source
          detail: 入驻或欺诈控制失效，或沟通不到位
        - id: n2
          label: 支付网络或结算事件
          type: risk-source
          detail: 外部通道或合作伙伴问题拖慢付款或转账
        - id: n3
          label: 商户资金不可用
          type: intermediate
          detail: 打款延迟或余额被冻结
        - id: n4
          label: 投诉升级
          type: intermediate
          detail: BBB、Trustpilot 或 FOS 案件累积
        - id: n5
          label: 商户流失 / 采用放慢
          type: intermediate
          detail: 信任和产品采用走弱
        - id: n6
          label: 支持和合规成本上升
          type: intermediate
          detail: 人工整改、赔偿和合规支出增加
        - id: n7
          label: 收入和利润率压力
          type: outcome
          detail: GPV 下降或服务成本上升，压缩经济性
        - id: n8
          label: 估值 / 融资压力
          type: outcome
          detail: 投资人要求更多资本或更大折扣
      edges:
        - from: n1
          to: n3
          label: 暂停或冻结
        - from: n1
          to: n4
          label: 争议和赔偿
        - from: n2
          to: n3
          label: 结算延迟
        - from: n2
          to: n4
          label: 公开宕机记录
        - from: n3
          to: n5
          label: 现金流压力
        - from: n4
          to: n5
          label: 信任侵蚀
        - from: n4
          to: n6
          label: 整改负担
        - from: n5
          to: n7
          label: GPV / 留存下降
        - from: n6
          to: n7
          label: 运营支出上升
        - from: n7
          to: n8
          label: 资本更贵
    approximationNotes: 传导链来自留存公开证据的推断，不来自内部风险仪表盘或董事会材料。
    claimRefs:
      - CR011
      - CR016
      - CR017
      - CR021
      - CR023
      - CR025
      - CR044
      - CR045
      - CR048
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: standard
    summary: 梳理 SumUp 运行支付、商业账户和借贷栈所依赖的外部许可、合作伙伴和融资渠道。
    data:
      nodes:
        - id: d1
          label: FCA / CBI 许可
          type: risk-source
          detail: 英国和欧盟资金流转的监管边界
        - id: d2
          label: 支付网络
          type: risk-source
          detail: Visa、Mastercard、girocard 和其他通道
        - id: d3
          label: 保障资金 / 结算银行
          type: risk-source
          detail: 持有资金并移动余额
        - id: d4
          label: Fifth Third Bank
          type: risk-source
          detail: 支持页面披露的美国发起银行关系
        - id: d5
          label: 私人信贷贷款方
          type: risk-source
          detail: Goldman 牵头再融资和更广泛贷款方银团
        - id: d6
          label: 核心支付受理
          type: intermediate
          detail: 线下刷卡和线上商户处理
        - id: d7
          label: 商业账户和打款
          type: intermediate
          detail: 储值、转账和本地 IBAN 工作流
        - id: d8
          label: 即时融资
          type: intermediate
          detail: 商户现金垫款和放贷能力
        - id: d9
          label: 商户信任和收入
          type: outcome
          detail: 留存、GPV 和估值韧性
      edges:
        - from: d1
          to: d6
          label: 允许收单模式
        - from: d1
          to: d7
          label: 允许电子货币 / 打款
        - from: d2
          to: d6
          label: 受理和授权
        - from: d2
          to: d7
          label: 绑定支付网络的转账
        - from: d3
          to: d7
          label: 保障并结算资金
        - from: d4
          to: d6
          label: 美国发起银行
        - from: d5
          to: d8
          label: 资产负债表 / 信贷能力
        - from: d6
          to: d9
          label: 核心商户 GPV
        - from: d7
          to: d9
          label: 现金流信任
        - from: d8
          to: d9
          label: 借贷带动留存
    approximationNotes: 除已披露的美国发起银行和英国通用保障资金描述外，合作银行名称并未公开，因此部分依赖按类别归并。
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR025
      - CR031
      - CR039
      - CR042
      - CR045
      - CR047
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 规模证明、披露缺口、上市可比公司区间和相互冲突的价格信号，如何共同指向 TRACK 建议。
    data:
      nodes:
        - id: scale
          label: 规模证明：4M+ 商户、1B+ 笔交易、1.5M 个商业账户
          type: input
        - id: profit
          label: 盈利信号：自 2022 年 Q4 起 EBITDA 为正
          type: input
        - id: breadth
          label: 宽度：银行、POS、借贷、企业扩张
          type: input
        - id: gap
          label: 披露缺口：缺少干净、经审计的合并分母或股权条款
          type: input
        - id: dispersion
          label: 价格分散：约 $4.2B 二级市场 vs 2022 轮 $8.5B vs IPO 传闻 $10-15B
          type: process
        - id: comps
          label: 上市可比公司分化：直接可比约 1.0x-2.3x vs 高溢价混合公司约 11x-12x
          type: process
        - id: call
          label: 建议：TRACK，中等置信度，高风险
          type: output
        - id: upgrade
          label: 只有经审计收入、利润率、治理和条款得到证明后才上调
          type: output
      edges:
        - from: scale
          to: dispersion
        - from: profit
          to: dispersion
        - from: breadth
          to: comps
        - from: gap
          to: dispersion
        - from: dispersion
          to: call
        - from: comps
          to: call
        - from: call
          to: upgrade
    approximationNotes: 这张图是决策逻辑，不是机械估值模型。它展示在当前公开价格下，哪些已观察事实和缺失事实会推动建议变化。
    claimRefs:
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV041
      - CV042
      - CV048
      - CV049
      - CV050
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 在不同公开市场收入倍数下，支撑 $10 billion 估值所需的示例性收入。
    data:
      items:
        - label: 1.0x 收入
          value: 10
          note: 类 Shift4 直接收单方筛选
        - label: 1.5x 收入
          value: 6.67
          note: 介于 PayPal 和类 Block 结果之间
        - label: 2.5x 收入
          value: 4
          note: 高于直接可比公司集群，低于高溢价软件
        - label: 5.0x 收入
          value: 2
          note: 需要强得多的混合经济性
        - label: 10.0x 收入
          value: 1
          note: 接近 Adyen/Shopify 语境下的高溢价平台区间
    approximationNotes: 数值为支撑所报道 IPO 区间下限所需的收入，单位为十亿美元。SumUp 没有公开披露集团合并收入，因此图中用上市可比公司倍数作为敏感性标尺。
    claimRefs:
      - CV009
      - CV021
      - CV024
      - CV027
      - CV030
      - CV033
      - CV036
      - CV037
      - CV038
      - CV041
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 熊市、基准和牛市估值区间锚定已观察到的公开价格信号，而不是未披露的内部预测。
    data:
      items:
        - label: 熊市情形
          low: 4
          mid: 4.2
          high: 5
          note: 如果披露和市场窗口仍然偏弱，清算价值接近二级市场
        - label: 基准情形
          low: 6
          mid: 7.25
          high: 8.5
          note: 如果 EBITDA 和产品宽度守住，位于二级市场成交价和 2022 官方轮之间
        - label: 牛市情形
          low: 10
          mid: 12.5
          high: 15
          note: 如果高溢价混合公司级披露质量得到证明，可接近报道中的 IPO 目标
    approximationNotes: 区间以十亿美元计，采用报道中的公开估值锚点和美元等值。公开证据不足以支持更细精度，所以刻意保持粗粒度。
    claimRefs:
      - CV001
      - CV009
      - CV011
      - CV012
      - CV045
      - CV046
      - CV047
      - CV051
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 用 IC 风格给 SumUp 的市场证明、经济性、治理和估值支撑打分。
    data:
      items:
        - label: 规模证明
          value: 4.5
          note: 商户、交易和商业账户规模明显真实
        - label: 产品宽度
          value: 4
          note: 支付、POS、银行、借贷和企业业务都看起来有意义
        - label: 盈利信号
          value: 3.5
          note: EBITDA 转正有帮助，但利润率细节仍缺失
        - label: 披露质量
          value: 1.5
          note: 留存来源中没有干净、经审计的合并分母
        - label: 治理清晰度
          value: 1.5
          note: 实体层面的任命不等于完整集团治理披露
        - label: 资本结构简洁度
          value: 1.5
          note: 私人信贷和未披露优先权条款给承销增加摩擦
        - label: 上市可比公司支撑
          value: 2.5
          note: 存在一些混合业务上行空间，但直接可比公司筛选结果大多低得多
        - label: 退出准备度
          value: 2.5
          note: IPO 可选性存在，但公开披露包看起来仍不完整
    approximationNotes: 分数基于 1-5 判断量表，用来约束建议，而不是替代估值工作。
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV016
      - CV041
      - CV042
      - CV043
      - CV044
      - CV049
      - CV050
      - CV053
