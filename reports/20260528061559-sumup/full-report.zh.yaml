  - id: TR003
    title: 合作方 / 依赖风险清单
    columns:
      - 依赖
      - 对手方 / 轨道
      - 角色
      - 集中度信号
      - 失效场景
      - 严重性
      - 缓释
      - 剩余风险敞口
    rows:
      - - 卡组织和网络轨道
        - Visa / Mastercard / girocard / 其他支付卡组织
        - 刷卡受理和 Business Account 转账路由
        - 在本土借记卡占比高的市场，以及任何归因于卡组织故障的事件中为高
        - 卡组织问题会阻断许多商户的受理，或延迟结算
        - 高
        - 原生 girocard 支持、广泛银行卡受理、持续卡组织集成
        - 仍然高，因为外部轨道不在 SumUp 控制内。
      - - 客户资金保护和结算银行
        - 未披露的英国银行及欧盟银行对手方
        - 持有商户资金并转移余额
        - 公开未知，因为合作方名单未披露
        - 银行或结算合作方停机会拖慢出款，或让客户资金保护操作复杂化
        - 高
        - 隔离账户、保险，以及公司声称会审查银行安排
        - 在披露合作方名称、集中度和故障切换设计前，仍为高。
      - - 美国保荐银行关系
        - Fifth Third Bank
        - 美国支付聚合商保荐
        - 在多个美国支持页面可见
        - 保荐银行或项目变更会扰乱美国收单流
        - 中-高
        - 多个支持页面仍锚定同一保荐银行披露
        - 在替代保荐或路由冗余得到证明前，风险有实质意义。
      - - 私募信贷和借贷合作方
        - Goldman 牵头贷款方和 Victory Park Capital
        - 债务再融资和商户信贷能力
        - 高，因为 2024 债务规模大，且 2023 VPC 信贷额度支持现金预支增长
        - 贷款方风险偏好收紧会抬高资金成本、限制贷款，或迫使在压力下再融资
        - 高
        - EBITDA 转正、再融资超额认购、贷款方名单多元化
        - 仍然高，因为资产负债表维护和增长都依赖对手方。
    notes: 本清单聚焦公开证据显示在资金划转、余额持有或信贷能力提供中必不可少的对手方和轨道。
