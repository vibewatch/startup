companyProfile:
  summary: >-
    SumUp 是一家 2012 年创立的后期私营金融科技公司，最初靠低摩擦的刷卡收款服务切入微型和小商户，之后扩展到 POS 软件、开票、商业账户、商户卡和融资。公司目前服务 37 个市场、超过 4 million 商户，员工超过
    3,000 人；随着业务继续深入银行服务和更大商户账户，战略可选项不小，但它披露的财务细节仍远少于上市支付同行。
