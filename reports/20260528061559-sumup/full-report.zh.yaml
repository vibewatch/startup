      - number: '2.3'
        title: 买方与细分市场地图
        blocks:
          - type: paragraph
            body: >-
              SumUp 的买方动作仍最接近创始人主导和经营者主导的 SMB 商务，但工作流因细分市场而异。个体经营者或上门服务商户常从最简单的收款痛点开始：「我需要在路上收银行卡付款。」微型零售商或集市摊主可能先用读卡器或
              Tap to Pay，等客户需求越过柜台后再加支付链接或在线商店。餐饮住宿和繁忙场馆更强烈地走向手持 POS、员工工具和更快结账。服务企业先用发票和链接，之后才会需要完整商店或复杂多地点 POS 部署。


              付款方和预算负责人也会随细分市场变化。在市场微型端，创始人或业主经营者通常同时是买方、用户和付款方，因此简单性和透明的运营投入比功能宽度更重要。商户变大后，财务或运营负责人会更关注入账速度、转账和商业账户集成；门店经理或一线员工则成为
              POS 层的日常用户。平台和市场买方又不同：他们不太关心单个网点，更关心嵌入式分发、下游商户赋能和清算管线。


              这也是一站式定位重要的原因。Visa 称，欧洲小企业希望应付和应收工具合在一起；PSE/TSG 显示，软件合作伙伴对嵌入式支付和融资有实质潜在需求。SumUp
              的产品栈正匹配这个推进路径：先收一笔款，再增加远程收款，再增加简单商务工具，然后加入商业账户和结算控制。POS Pro
              和多门店功能扩大了可触达细分市场，但买方地图的核心仍是想要快速部署、并逐步需要更宽工作流覆盖的 SMB。
