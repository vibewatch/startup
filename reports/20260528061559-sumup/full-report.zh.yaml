      - number: '1.4'
        title: 运营规模与关键指标
        blocks:
          - type: paragraph
            body: >-
              以 2025–2026 年看，SumUp 作为一家欧洲私营金融科技公司的规模已经可观。公司在全球 37 个市场服务超过 4 million 商户（按公司自述，包括出租车司机、咖啡店主和大型体育场）。员工超过
              3,000 人，国籍超过 90 个，办公室覆盖四大洲。公司每年处理超过 1 billion 笔交易（见 2025 年 10 月 EU VAT Expert Group 新闻稿引用）。


              商业账户产品已经做出明显规模：到 2025 年 12 月，SumUp 拥有 1.5 million 活跃商业账户用户，商户存款合计超过 €1
              billion——这是商户黏性的重要指标，也形成支持贷款产品增长的存款基础。超过 250,000 家 SME 已通过 SumUp 的即时融资产品获得资金；该产品部分由 Victory Park
              Capital（VPC）在 2023 年中提供的 $100 million 信贷额度支持。


              收入数据：SumUp 不公开披露收入，但公司曾表示，在 2022 年 6 月前两年收入年增速超过 60%，并在 2023 年维持超过 30% 的收入增长。没有公开可得的经审计财务；一些第三方数据聚合商引用的
              2026 年 €703 million 收入估计未经验证。毛利率和 NRR 也未披露。这些缺口对估值工作很关键。
