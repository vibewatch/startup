  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与分层
        blocks:
          - type: paragraph
            body: >-
              SumUp 的竞争环境可按目标商户规模、产品哲学和分发模式分成五个清晰群组。第一组是微型商户 mPOS 同行，提供商与 SumUp
              共享核心用例：让个体经营者和小企业用紧凑硬件读卡器配合智能手机应用受理银行卡付款。Square（Block, Inc.）、PayPal Point of Sale（原 Zettle）、Teya 和 myPOS
              都在这里竞争，核心卖点是固定费率、零合约姿态和低摩擦入驻。这一组是 SumUp 风险最高的战场。

              第二组是平台主导的支付基础设施。Stripe Terminal 面向开发者和企业，他们需要 API-first 的线下支付能力，并把它接入更广的软件栈。Shopify POS 面向已有 Shopify
              电商商户向实体零售扩张。两者都需要实质配置，并不像 SumUp 那样自助。第三组是软件主导的垂直 POS 系统：Lightspeed（零售和餐厅）、Toast（餐厅）和 Clover（Fiserv
              银行打包、美国优先）提供深行业软件，并嵌入支付受理。SumUp 收购 Goodtill（餐饮 POS）和推出 POS Pro，正在从低端向这一组靠拢。

              第四组是企业级收单：Adyen 以企业和全渠道规模运营，采用 interchange-plus 定价，通常只有在年银行卡交易量达到数百万欧元以上时才具备成本竞争力。Worldpay、Global Payments
              和 Nexi 服务类似的企业和银行转介商户。这些提供商不在微型商户入驻上与 SumUp 直接竞争，但会给 SumUp 上探市场形成明显天花板。第五组是银行 / 收单机构打包：Barclaycard、Lloyds
              Cardnet 以及每个欧洲市场的类似机构，通过商业银行关系分发收单终端，通常单笔费用更高，但拥有既有机构信任。SumUp 赢得新商户时，替代的正是这类现状方案。
