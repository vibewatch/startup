  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 为何有用
      - 局限
    rows:
      - - Shift4
        - May 2026 市值 $4.25B；2025 收入 $4.17B
        - ~1.0x 市值 / 收入
        - 最接近的公开商户收单与 POS 直接可比对象，可观察低倍数支付处理业务经济模型
        - 股权价值不是 EV，且 Shift4 自身有杠杆、垂直行业组合和 M&A 特征
      - - PayPal
        - May 2026 市值 $38.60B；2025 收入 $33.17B
        - ~1.2x 市值 / 收入
        - 成熟、交易密集型经济模型的规模化支付基准
        - PayPal 的品牌、消费者组合和全球网络效应都比 SumUp 大得多
      - - Block
        - May 2026 市值 $42.50B；2025 收入 $24.19B
        - ~1.8x 市值 / 收入
        - 有用的商户收单和卖家生态参照，带有银行和软件邻近业务
        - 公开业务组合包含 Cash App 和其他业务，范围比 SumUp 更宽
      - - Toast
        - May 2026 市值 $14.20B；2025 收入 $6.15B
        - ~2.3x 市值 / 收入
        - 有助于类比餐饮 POS 和软件驱动支付
        - 垂直行业集中度和公开披露质量，与 SumUp 更宽的 SMB 基础不同
      - - Adyen
        - May 2026 市值 $34.39B；2025 收入 $3.10B
        - ~11.1x 市值 / 收入
        - 披露达到申报文件级别的高溢价支付平台上限可比对象
        - Adyen 披露远好于 SumUp，更偏企业客户，结构也不同
      - - Shopify
        - May 2026 市值 $138.32B；2025 收入 $11.55B
        - ~12.0x 市值 / 收入
        - 说明优质商业操作系统在公开市场能拿到怎样的定价
        - 更宽的软件和商户服务平台；不是直接收单可比对象
    notes: 这是一个公开市场筛选，用市值对照已报告收入，不是真正的 EV / 收入比较。它仍对决策有用，因为它显示低倍数收单同业和溢价混合平台的差距有多陡。
