  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层仍从微型商户起步，再延伸到工作流更重的零售和餐饮
        blocks:
          - type: paragraph
            body: >-
              SumUp
              的公开定位和第三方评论仍首先指向微型商户长尾：自由职业者、个体经营者、独立零售商，以及其他希望轻松接受银行卡、又不想经历银行式开户摩擦的业主经营型业务。官方关于页面和首页把信息讲得很简单——为小企业提供负担得起的支付和经营工具；Website
              Planet、CardPaymentOptions 和 Payment Institutions
              等独立评论也认为，最适合的仍是小型经营者和独立专业人士。但当前产品集已经不再只是读卡器故事。官方酒店餐饮和食品饮料页面显示，SumUp
              正凭桌边服务、厨房路由、库存、报表和多门店控制，深入工作流更重的环境。企业页面走得更远，承诺提供一个覆盖近 40 个国家、带数字点单、Loyalty 和菜单控制的单一云端 POS 平台。Store Leads
              提供了一个有用的线上可见采用信号：17,222 个仍在运行的店铺，服装类占比强，食品饮料份额有意义，并且地理上偏向英国和法国。模式很清楚：在低端，SumUp
              的买家、用户和付款人往往是同一个人；但越往上，栈越来越瞄准经理、员工、财务团队和多站点经营者。
