      - number: '1.5'
        title: 并购历史与扩张里程碑
        blocks:
          - type: paragraph
            body: >-
              至少从 2018 年起，SumUp 就是活跃收购方，用债务融资资本通过外延方式扩展产品组合和地理覆盖。关键收购包括：Debitoor（会计 / 开票，2018 年）；Shoplo（电商市场工具，2019
              年）；Payleven（Rocket Internet 孵化的 Square 克隆，作为欧洲扩张的一部分整合，具体日期未披露）；Goodtill（伦敦餐饮 / 餐厅 POS 软件，2020 年 11
              月，金额未披露，每年处理 £500 million+ 交易，并服务 Uber Boat、Edinburgh Fringe、SSE Wembley Arena 和 Leicester City FC
              等客户）；Tiller（法国餐厅 POS 软件，金额和日期未披露）；以及 Fivestars（美国支付和忠诚度平台，2021 年 10 月，以现金加股票支付 $317 million——这是 SumUp
              披露过的最大收购，也是其首次美国收购，带来 70 million 忠诚度消费者会员和 12,000 个商户关系）。


              有机扩张方面，SumUp 于 2022 年 6 月进入 Peru（第 35 个市场），2023 年 8 月进入 Australia（第 36 个市场），到 2025 年覆盖 37 个市场。公司 2025 年 8
              月在 Germany 上线 girocard 受理，补上德国刷卡受理的最后缺口。2025 年 10 月，SumUp 获任 European Commission 的 VAT Expert Group
              成员，反映其监管影响力正在增强。到 2025 年 12 月，SumUp 宣布现金存款能力和本地 IBAN 计划，朝面向 SMB 的全服务欧盟银行又迈出重要一步。


              企业业务推进大约从 2025 年真正开始：SumUp 成为伦敦 The O2 arena 的官方支付处理商，并于 2025 年 3 月聘请 Pierre Lion 负责企业销售。从只服务 SMB
              转向多细分市场定位，是一个战略拐点，将影响 SumUp 的定价、销售动作和产品路线图。
