  - id: TR005
    title: 缓释与否决条件表
    columns:
      - 风险
      - 可监控触发点
      - 阈值或事件
      - 行动含义
    rows:
      - - 牌照 / 客户资金保护失败
        - 监管行动或客户资金保护违规披露
        - 任何 FCA 或 CBI 限制、公开整改通知，或带保留意见的客户资金保护问题
        - 在法律范围、客户资金影响和整改成本被核清前，视为投资逻辑失效。
      - - 结算和停机复发
        - 公开事件频率
        - 一次持续 >12 hours 的跨市场出款事件，或任意滚动 90 days 内两次重大停机
        - 暂缓提高信心，要求复盘、服务抵扣和客户流失数据。
      - - 资本市场依赖
        - 新的大额债务或融资路径失败
        - 又一笔主要用于现有债务的 >$500m 再融资，或 IPO 推进延迟且未披露资产负债表替代方案
        - 重新测算稀释、债务成本和战略可选性的下行情景。
      - - 合作方轨道依赖
        - 卡组织或银行对手方中断
        - 任何明确绑定支付卡组织或银行合作方的重复事件，或核心市场出现可见的受理回退
        - 在写入股权上行空间前，把合作方集中度和故障切换列为优先尽调。
      - - 执行和商户信任
        - 领导层流失或投诉加速
        - 12 months 内企业、银行业务、合规或爱尔兰实体负责人离任，或 BBB 投诉升至 12 months 内已关闭超过 30 起且出现新的资金扣留主题
        - 在分部指标改善前，把判断从可控扩张改为组织承压。
      - - 监管变化 / AML 整改负担
        - 正式规则变化、整改项目或核验积压
        - 任何重大的 PSD3/PSR 或英国支付规则差距整改项目、FCA/CBI 整改通知，或人工审核 / 误报队列持续增长
        - 在合规成本、上线延迟和商户中断风险量化前，按投资逻辑破裂处理。
      - - 数据安全 / 隐私事件
        - 安全披露或监管方 / 客户事件通知
        - 任何已披露的数据泄露、反复出现的 webhook 或 API 滥用事件，或影响商户 / 消费者数据的 GDPR / 隐私事件
        - 暂停判断，要求提供根因分析、通知范围、整改成本和流失影响。
      - - 利润率压缩 / 披露恶化
        - 价格让步或经济模型继续不透明
        - 必须大幅扩大折扣方案或谈判定价，却没有匹配的分部披露；或在软件 / 基础设施层面明显输给 Square、PayPal/Zettle 或 Stripe 的企业客户
        - 重切利润率假设；在单位经济模型拿到直接证据前，提高治理折价。
    notes: 这些叫停标准刻意做成可衡量指标，好接入刷新触发器，而不是停留在定性担忧。
