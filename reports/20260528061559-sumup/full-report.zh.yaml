      - number: '3.6'
        title: 图表与证据
        blocks:
          - type: callout
            title: SoftPOS 商品化威胁硬件利润率
            body: >-
              未改装智能手机上的 tap-to-pay（Apple Tap to Pay on iOS 17+、Android NFC）正让 SumUp 的读卡器硬件作为入驻钩子越来越不必要。SumUp 的 Solo 读卡器和
              tap-to-pay 能力是竞争回应，但 Square、PayPal 和其他每一家 mPOS 提供商也都有回应。若硬件附着率下降，SumUp 的单读卡器收入和实体产品带来的入驻黏性都会减弱，变现将更依赖
              Business Account 和软件订阅。
            calloutType: risk
            claimRefs:
              - CP041
              - CP042
          - type: callout
            title: 公开市场资本差距是 SumUp 最持久的结构性劣势
            body: >-
              Block（$42.5 B）、Shopify（$138.3 B）和 Adyen（$34.4 B）都拥有公开股权和深度流动信贷市场，可为商户获取活动、硬件补贴或亏损引流定价轮提供资金。SumUp
              仍是私营公司，并背负约 €1.7 B 债务工具，竞争回应必须来自运营或额外私人债务——这个约束限制了它匹配任何上市同行发起的持续价格战或扩张补贴的能力。
