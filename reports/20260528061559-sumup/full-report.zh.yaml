      - number: '3.3'
        title: 平台与软件主导型竞争者
        blocks:
          - type: paragraph
            body: >-
              Stripe Terminal 是 Stripe 的线下支付产品，明确面向希望在单一 API 中统一线上和线下支付受理的开发者、平台和企业商户。Stripe 文档页面称，Terminal
              可让「领先企业和平台跨渠道统一商务、把支付无缝接入销售点，并轻松管理硬件需求」。英国定价为标准在线卡交易 2.5% + 20p；企业可获得定制线下 Terminal 定价。Terminal
              没有公开宣传的固定费率或自助线下交易费——商户必须联系 Stripe 销售。Stripe 作为 API 平台的深度（用于市场支付的 Stripe Connect、用于发卡的 Stripe
              Issuing、用于金融账户的 Stripe Treasury）给它带来嵌入式金融宽度，SumUp 的开发者平台尚无法匹配；不过 SumUp 的开发者
              SDK（sumup-go、@sumup/sdk）正在增长。Stripe 在公开股票市场没有披露市值，但老股市场最近估值约 $65–70 billion。其投资者包括 Sequoia、Andreessen
              Horowitz 和 Fidelity。

              Shopify POS 面向 Shopify 全球商务平台上约 2 million 商户中希望增加线下零售渠道的客户。POS Pro 计划每月 £69，包含无限 POS
              员工、线上购买门店自提和高级报告。Shopify 标准计划下的英国卡在线交易费率为 2% + 25p。Shopify POS 结构性黏性很强：如果商户把完整电商存在建在 Shopify 上（产品目录、库存、客户
              CRM、营销），任何销售点切换都会面临高切换成本，因为 POS、库存和在线业务是统一的。没有可比的电商托管平台，SumUp 无法复制这种锁定效应。截至 2026 年 5 月，Shopify 市值约 $138.3
              billion，使其有资本以 SumUp 私营资产负债表无法承受的力度补贴硬件和商户获取。

              Lightspeed Commerce（TSX/NYSE: LSPD）为独立零售商和餐厅提供云端 POS 软件，并集成 Lightspeed Payments。Lightspeed 产品以 iPad
              为先，数据能力强（库存管理、采购订单、供应商管理、高级报告），并服务多地点商户。Lightspeed 年收入约 CAD $930 million（FY2025），公司继续通过平台和支付渗透增长。SumUp 收购
              Goodtill（餐饮 POS）是其在英国餐厅和酒吧领域应对 Lightspeed 的主要竞争动作，但 Lightspeed 的软件深度——尤其是零售库存——仍是 SumUp POS Pro 产品的竞争缺口。
