      - number: '2.4'
        title: 增长驱动、采用约束和仍需尽调的问题
        blocks:
          - type: paragraph
            body: >-
              SumUp 所在市场的增长逻辑是真实的。ECB 数据显示，欧元区非接触和卡基支付仍在增长；UK Finance 显示，英国非接触使用到 2026 年仍深度嵌入；FCA
              数据称，数字钱包正成为相当一部分成年人的主要或同等重要支付方式。分析师研究也指向同一方向：Capgemini 看到小商户优先考虑全渠道结账和增值服务，zeb 看到数字支付持续替代现金，Mordor 预计欧洲市场到
              2031 年仍会复合增长。监管不只是负担：PSD2、即时支付和开放银行轨道，也让 SumUp 这类提供商有新方式深化入账、A2A 和嵌入式金融主张。


              约束同样重要。现金并未消失，FCA
              仍发现一批有意义的重度现金用户，欧洲本地支付体系碎片化也让泛欧扩张更复杂。即时支付和开放银行可能帮助商户，但也会压缩银行卡经济性，并加剧围绕结算、路由和钱包结账的竞争。Intrum
              的逾期付款数据暗示，宏观压力可能正好在商户最在意费用和切换成本时拖慢软件支出。Capgemini 和 Trustpilot 又补充了第二条警示：快速入驻和可靠支持就是产品的一部分，不是旁枝问题。


              因此，对估值而言，本章支持一种有纪律的看法。SumUp 暴露在大型结构性增长主题中，但公开证据仍不足以按国家、细分市场或产品隔离其准确市场份额。这意味着尽调应先把公司作为一家欧洲 SMB
              商户服务整合者来承销，并把银行和大型场馆带来的上行作为附加项，而不是把它看成对所有支付增长的泛化押注。
