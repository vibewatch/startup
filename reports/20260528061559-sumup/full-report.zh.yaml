      - number: '2.2'
        title: 规模口径：外层市场很大，有证据支撑的 SAM 很窄
        blocks:
          - type: paragraph
            body: >-
              公开证据支持 SumUp 周边存在一个很大的市场外壳，但没有暴露干净的公司特定 SAM 或 SOM。最宽的自上而下口径是欧洲支付市场：Mordor 估计 2025 年为 USD 0.64
              trillion、2026 年为 USD 0.74 trillion，其中 POS 和零售仍占较大份额。ECB 给出更贴近基础设施的视角：欧元区非现金交易和非接触量仍在增长，该地区已有约 20.8 million
              台 POS 终端。这些信号说明，SumUp 参与的是一个非常大、仍在数字化的支付生态，而不是一个边缘小众案例。


              但自上而下的市场价值太宽，不能直接拿来承销 SumUp。英国和欧盟官方企业数量外壳说明了原因。2025 年英国有 5.7 million 家私营部门企业，但只有 1.4 million 家有雇员，只有 2.6
              million 家注册 VAT/PAYE。欧洲有 26.1 million 家 SME，但其中很多公司并不受理商户付款、不收银行卡，也不落在 SumUp
              商户软件的甜蜜点。这些外壳数量有助于框定外层宇宙，却无法干净转换成支付就绪客户基数。


              实务结论是保留不确定性，而不是强行追求精确。本章图表用分析师和官方视角框定市场规模，并说明为什么 POS 重的商户服务仍具实质意义。它们不应被误读为 SumUp 已披露的 TAM、SAM 或 SOM。即便
              Worldpay 旗舰 2026 报告，也只能在落地页层面公开引用，无法从公开页面完整检视，因此市场规模记录仍是指示性而非确定性。
