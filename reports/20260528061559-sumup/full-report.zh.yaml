            body: >-
              最有用的公开客户证据不是 logo 墙，而是一段引用、一个工作流，或一个能说明 SumUp 实际如何被使用的部署范围。在 SMB 端，官方页面给出具名案例和真实但多为定性的结果：Netzel’s
              Barbershop 称结账变得更容易、生意增长；Blend On The Hill 称 SumUp 从一开始就让上线变得容易；Market Place 称 Point of Sale Pro
              节省时间并改善报表；Le Loubnane 说它极大节省时间；Udderlicious 表示三年的使用简化了一切。这些是真实使用信号，但没有走到可量化留存或 ROI。场馆证据更强。Financial IT 和
              RTIH 报道，Between the Bridges 在 2026 季把所有刷卡、POS 和 QR 订单迁移到 SumUp；RTIH 关于 O2 的报道则描述了一项多年现场处理协议，包含 POS 和自助
              Kiosk 供应。SumUp 自己的企业招聘公告进一步说明，公司现在服务 DHL、Miele 和体育场馆客户，并明确瞄准体育场和演唱会场馆。这给了 SumUp
              可信的企业部署证据，但只有一部分超过了展示型信号。最好的公开证据，是那组少数明确披露部署范围的客户。
