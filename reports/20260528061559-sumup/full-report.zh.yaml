      - number: '7.4'
        title: 人员和执行风险
        blocks:
          - type: paragraph
            body: >-
              公开叙事显示，SumUp 正试图同时做几件难事：从 SMB 刷卡收单延伸到企业客户，扩展本地 IBAN 和现金存款等银行功能，保持贷款产品增长，并为可能的 IPO
              或行业整合周期做准备。单看每项都不离谱，但放在一起就形成管理范围风险。2025 年，公司专门聘请新的全球企业销售负责人，面向体育场和演唱会场馆等更大商户；Financial IT 同时描述了爱尔兰受监管实体在
              CEO、财务、合规、风险和董事会层面的领导层变化。SumUp 自己的银行业务发布又叠加了 2025–2026 年更多本地化和产品推出工作。


              这个组合带来两点投资人担忧。第一，公司正进入销售周期更长、实施工作更多、服务预期更高的分部，而这些都不同于其历史上的微型商户基底。第二，更多业务现在绑定到类银行的受监管工作流，执行错误的后果不再只是产品采用问题，也可能变成合规和流动性问题。公开来源没有展示企业收入贡献、分部利润率或领导层流失率，所以尽调必须验证：组织是否真的走在复杂度曲线前面，还是只是以快于管理系统成熟的速度不断加项目。
