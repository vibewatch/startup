      - number: '4.2'
        title: 单位经济可见度、牵引锚点与 GTM 转向
        blocks:
          - type: paragraph
            body: >-
              公开牵引证据有意义，但距离完整单位经济仍差很多。SumUp 自己的介绍页和融资材料称，公司服务超过 4 million 家企业；到 2025 年 12 月，公司声称拥有超过 1.5 million 名活跃
              Business Account 用户，商户存款超过 €1 billion。同一公告称，SumUp 已向超过 250,000 家 SME 发放融资，并发出超过 1 million
              个商户现金预支邀约，足以证明贷款是一条真实产品线，而不是试点。SumUp 还公开声称自 Q4 2022 起 EBITDA 为正，并在 2023 年保持超过 30% 的收入增长；Sacra 估计其 2025
              年年化收入约 $600 million，收入组合横跨硬件、支付处理、软件和金融服务。


              仍缺失的是一组能把这些信号转换为可承销模型的准确指标。已审阅公开来源没有披露扣除卡组织费用和交换费后的实际混合抽成率、硬件毛利率或补贴政策、CAC、回本周期、NRR、流失率、存款经济性，或商户预支的信用损失表现。GTM
              动作也似乎正在变化。SumUp 原来的自助模式围绕低摩擦读卡器获客搭建，但 POS Pro 产品和 2025
              年企业销售招聘显示，公司正越来越多地推进更大商户和更多销售辅助部署。这可能提升合同价值潜力和软件附着，但也会改变销售效率假设，并可能需要比原有微型商户模式更重的服务和入驻成本基础。
