  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品套件和商户任务
        blocks:
          - type: paragraph
            body: >-
              SumUp 现在更像一个覆盖收单、商业软件和资金管理的商户操作系统，而不是一家单一读卡器公司。当前公开产品面包括读卡器、独立 Solo 系列、POS Lite、更完整的 SumUp POS 栈、Kiosk、Tap
              to Pay、Invoices、Payment Links、Online Store、Business Account，以及 Bookings、Loyalty 等新插件。实际工作流是模块化的：微型商户可以从
              Solo Lite 或 Tap to Pay 起步；门店柜台可以升级到 POS Lite 或更完整的 POS 套件；高吞吐场景可以再加 Kiosk 或 Terminal，同时仍留在同一个 Business
              应用和报表界面里。模块化是真优势，因为它给商户留出升级路径，不要求商户每次长大一点就推倒工具重来。产品组合里主要的注意点是硬件口径：Solo 和 Solo Lite 明确仍在售，但抓取到的 2026
              年官方页面没有展示独立的 Solo+ 页面，因此尽调需要确认 Solo+ 是仍然存在的 SKU、区域性套装名称，还是事实上已经退役。
