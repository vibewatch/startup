      - number: '7.6'
        title: 财务模型和竞争风险
        blocks:
          - type: paragraph
            body: >-
              SumUp 的公开定价已经显示核心利润率风险机制。英国定价页面宣传默认交易费率为 1.69%，随后立即为每月处理 £3,000 以上的商户提供 0.99% 计划，并为月交易量超过 £10,000
              的企业提供定制定价。这是直接证据：商户规模越大，定价越锋利，而这恰好发生在 SumUp 试图从微型商户上移到更大、更有吸引力卖家的时候。MobileTransaction 的 2026
              年对比强化了这一点：它称重视成本的初创公司往往偏好 SumUp 最低费率，但也称 Square 有更强的免费应用，而 PayPal 收购 Zettle 后的应用吸引力较弱。


              竞争压力因此同时来自多个方向。PayPal Point of Sale 称其每笔交易收费 1.75%，没有合同或经常性费用，并在商户月卡交易量超过 £10,000 后提供定制费率计划。Square
              宣传无设置费或月费，并为年支付量超过 £200,000 的客户提供定制方案。Stripe 的定价页面进一步走向平台竞争，组合了按量付费、定制套餐、欧盟卡 1.5% + 20p 定价、99.999%
              历史正常运行时间和 PCI 合规基础设施。SumUp 不太可能在每个队列里按完全相同条件和每个对手打，但共同模式很清楚：高交易量商户已经被训练得期待协商经济性、更丰富的软件，或更强的基础设施声明。SumUp
              上移市场时，这会形成可信的抽佣率压缩风险。


              治理和披露又增加了最后一层不确定性。Companies House 确认 SumUp Payments Limited 是英国私人公司；SumUp
              的法律信息页面主要把外部人导向条款、资金保障和状态页面，而不是分部报告、治理细节或业务线盈利能力。投资人可以推断 SumUp 正在横跨收单、Business
              Account、企业和融资建设，但无法以上市公司精度验证公开抽佣率趋势、队列利润率、欺诈损失、董事会控制或产品集中度。因此，有限披露不是外观问题；它提高了利润率或控制滑坡只有在已经重要之后才显现的概率。
