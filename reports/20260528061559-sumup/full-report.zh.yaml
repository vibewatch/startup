      - number: '3.4'
        title: 企业收单机构与银行 / 收单机构打包
        blocks:
          - type: paragraph
            body: >-
              Adyen N.V.（AMS: ADYEN）是欧洲占主导地位的企业支付平台，把线下收单、电商网关和嵌入式金融（Adyen for Platforms）放进同一套统一基础设施。Adyen 的 POS 定价页列出
              $0.13 处理费，加 interchange，再加百分比加价（interchange-plus 模式）；这种模式通常只有在较高月度银行卡交易量下（一般高于
              €50,000/月）才比固定费率提供商更具成本竞争力。Adyen 的销售点技术文档描述了一套功能完整的 Terminal API，支持多币种、全球支付方式和定制终端应用。截至 2026 年 5 月，Adyen
              市值约 $34.4 billion。Adyen 战略明确瞄准企业和平台；它不提供自助式微型商户产品。不过，Adyen 在扩大市场份额时已宣布逐步降低最低交易量门槛，形成其长期进入 SumUp 商户层级的风险。

              Clover 是 Fiserv, Inc. 的产品线，通过美国银行合作伙伴和 Fiserv 直营商户服务渠道分发刷卡受理硬件。Clover 多数配置要求 3 年合约，并强制信用审批流程。Clover
              的硬件促销（截至 2026 年）要求商户在前四个账单周期内处理 $10,000 或以上银行卡交易。与 SumUp 的零合约、零最低额模式相比，这形成鲜明反差。Clover 主要是美国产品，不是 SumUp
              的直接欧洲竞争者；但 Fiserv 的欧洲收单资产（来自 WorldPay 收购和欧洲银行合作关系）代表潜在渠道风险。

              Worldpay（现属 FIS/GTCR）通过其「small business payments」产品和定制费率计划服务英国小企业。Worldpay
              网站推广托管服务和按交易量定价，而不是透明固定费率，这与其银行收单机构传承一致。Barclaycard Business 把英国刷卡受理作为商业银行套餐的一部分提供，在 SumUp
              目标市场中以品牌认知竞争，但混合费率通常更高、合约期限更长。Nexi Group 是按商户数量计的欧洲最大收单网络，通过银行合作伙伴在 25+ 个欧洲国家服务约 3 million 商户，是衡量 SumUp
              泛欧足迹时的一项欧洲收单基础设施基准。
