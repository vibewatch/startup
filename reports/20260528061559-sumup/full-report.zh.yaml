  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 推导依据
    rows:
      - - 建议
        - 观察 — 继续尽调，但不要只靠公开证据支撑 IPO 头条估值
        - 已观察到的价格信号过于分散，披露也太薄，尚不足以在据报 $10-15 billion 区间给出买入判断
      - - 置信度
        - 中
        - 官方融资和公开可比公司筛选清楚，但合并收入和资本结构细节仍缺失
      - - 风险评级
        - 高
        - 债务再融资、治理不透明，以及官方估值、老股交易和 IPO 信号之间的巨大落差，都可能快速重定价股权价值
      - - 估值立场
        - 按当前 IPO 头条估值看偏高
        - 目标式 IPO 定价显著高于 Groupon 老股信号，也高于低倍数商户收单可比公司能支撑的水平
      - - 入场纪律
        - 更倾向于在老股交易到 2022 年轮次之间，以尽调支撑的价格入场
        - 更低入场价或明显更充分的披露，比叙事小幅推进更快改善风险 / 回报
      - - 决策含义
        - 推进前，必须拿到经审计的分母数据、债务 / 财务约束条款包和股权结构表条款
        - 没有这些文件，投资人承销的是叙事质量，而不是可验证的估值支撑
    notes: 建议刻意对价格和证据敏感：公司质量确实存在，但公开估值记录还不够紧，不能假装精确。
