  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 单位
      - 当前数值 / 状态
      - 质量
      - 尽调问题
    rows:
      - - 线下持卡收单
        - 通过读卡器、终端、自助机和 POS 联动受理线下交易，按使用收取处理费
        - 支付量百分比
        - 英国标价为即用即付 1.69%；符合条件的线下消费者卡交易量使用 Payments Plus 时为 0.99%
        - 机制证据高、经济性证据中：变现方式清楚，但实际混合抽佣率未公开
        - 索取扣除交换费、卡组织费用和定制折扣后，按地区 / 卡种组合拆分的实际抽佣率
      - - 远程支付
        - 支付链接、发票、在线商店和其他非面对面收单
        - 支付量百分比
        - 英国标价为 2.5%；公开来源未显示远程收入占比或按工具拆分的组合
        - 中：收入流可见，但交易量组合以及退款 / 拒付损耗未公开
        - 索取远程 GMV 占比、退款率、拒付率，以及扣除欺诈损失后的混合净收入
      - - 硬件销售
        - 一次性销售读卡器和终端，用于启动商户获取并带动后续附加销售
        - 按售出设备
        - 第三方 2026 年定价显示，英国可见价格区间大约为 £25 + VAT 至 £135 + VAT，且未突出租赁模式
        - 中：硬件明确变现，但利润率可能从利润中心到补贴获客工具都有可能
        - 索取硬件 COGS、附加率、替换率，以及按商户队列拆分的补贴政策
      - - POS 软件和工作流工具
        - POS Plus 等经常性软件升级，以及面向零售和酒店餐饮的垂直 POS 部署
        - 月度订阅 / 合同
        - POS Plus 标价 £29/月；POS Pro 定位指向更重服务的企业和多门店使用场景，但企业价格未披露
        - 中高：经常性软件有吸引力，前提是附加销售真实，但没有公开的附加率或流失数据
        - 索取 POS 付费席位数、ARPU、流失率和企业合同价值分布
      - - 商业账户和现金管理工具
        - 免费基础账户，加上付费升级、更快出款、卡、转账、现金存款和本地 IBAN 功能
        - 月度订阅，加间接留存 / 浮存金效应
        - Business Account Plus 标价 £15/月；基础账户以免费作为卖点；2025 年末据报道商户存款超过 €1 billion，活跃用户 1.5 million
        - 中：产品规模真实，但存款经济性、资金成本和直接收入抽成未披露
        - 索取净利息 / 费用收入、存款留存、出款成本经济性和付费升级渗透率
      - - 商户融资
        - 以未来交易流水偿还的商户现金垫款，并由外部信贷额度支持
        - 垫款费用 / 融资收入
        - 公开来源显示，英国上线获得 VPC 支持，另有 $100 million VPC 信贷额度；超过 250,000 家 SMEs 已获资金支持，发出超过 1 million 个融资要约
        - 中：产品规模真实，但承销质量和损失内容未公开
        - 索取各放款批次的违约、损失率、准备金政策、实际收益率和资金成本分配顺序
    notes: 公开可见的变现入口清楚，但完整内部收入组合和实际经济性未披露。
