      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              SumUp 由包括 Marc-Alexander Christ 在内的小团队于 2012 年共同创立；Christ 之后至少到 2022 年中仍担任公司 CFO。到 2023 年 12 月，Hermione
              McKee 已接任集团 CFO，且截至 2025 年 10 月仍在任。公司在投资者新闻稿中没有公开点名一位单一的「Group CEO」——以其规模和 IPO 目标来看，这是一个值得注意的治理不透明点。


              在运营公司层面，SumUp Limited（爱尔兰实体，也是欧盟门户）任命 Niall Mac an tSionnaigh 为 CEO；此前他曾任 SumUp Limited COO 和全球运营 VP，2022
              年从 LinkedIn 加入 SumUp。服务 SumUp 12 年的 Gareth Walsh 从 SumUp Limited CEO 转任非执行董事，目前担任控股公司董事会主席。商业组织由 Luke
              Griffiths 以 Chief Commercial Officer 身份领导（截至 2025 年 12 月）；Pierre Lion 于 2025 年 3 月获任 Global Director of
              Enterprise Sales（此前为 Mangopay CGO），显示公司正在推进大商户业务。Felix Lamouroux 担任 SVP Global Banking，负责快速增长的商业账户产品。


              联合创始人 Marc-Alexander Christ 仍深度参与战略决策（2025 年 3 月企业业务公告中曾被引用），由此形成对创始团队的实质关键人物依赖。公司没有公开点名集团
              CEO，是交易前尽调需要补上的证据缺口。除爱尔兰子公司外，董事会构成并未公开披露。
