              2025–2026 年发布轨迹显示，公司仍在增加重要产品面，而不只是打磨一个成熟套件。SumUp 在德国上线直接 girocard 收单，扩展 Bookings，达到银行规模里程碑并增加现金存款和本地 IBAN
              功能，推出带消费者 Local 应用的 Loyalty，并在爱尔兰推出 SumUp Pay。第三方报道又补了一层：Beacon 2026 提到自研 Android Tap to Pay 栈、Kiosk
              扩张和更广的 Cash Advance 推广；Retail Times 把新 Terminal 描述为一体化手持 POS，具备自动更新，且更多功能已排队。成熟度因此按模块分化。核心收单、POS
              和商户银行看起来成熟。Terminal、Loyalty、Bookings 和消费者钱包功能更早期，也仍受区域限制。最大的尽调风险不是 SumUp
