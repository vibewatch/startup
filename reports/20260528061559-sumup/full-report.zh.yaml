      - number: '8.4'
        title: 打破投资逻辑的触发条件和最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              建议可以改变，但只能靠证据或价格，不能靠欣赏。一名买方只有在管理层提供经审计合并收入、利润率和分部结构数据、清晰债务与契约包，以及一张显示普通股等价投资人没有藏在隐性下行不对称之后的股权结构表时，才应上调判断。同样的纪律定义了否决标准。如果新的私募市场定价重复
              Groupon 折价，如果集团经济性看起来更接近低倍数收单机构而不是高溢价软件化平台，或者银行和企业扩张没能加深变现，那么高溢价叙事就破了。治理也比在早期公司里更重要，因为 IPO 级定价通常依赖
              申报级透明度。今天的公开记录仍主要靠公司新闻稿和媒体泄露，而不是上市同行可见的披露标准。因此，尽调清单很窄也很具体：证明分母，证明利润率结构，证明资本结构，并证明治理包，然后再为 IPO 梦想支付溢价。
