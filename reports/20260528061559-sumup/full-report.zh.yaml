        title: 信任、合规和开发者界面
        blocks:
          - type: paragraph
            body: >-
              公开信任证据可信但不完整。受监管资金一侧，DNB 登记册显示 SumUp Limited 以电子货币机构身份通行，许可覆盖卡交易、贷记转账、支付工具发行和收单。SumUp
              的资金保障页面明确了消费者保护模型：资金被隔离，有保险政策支持；由于 SumUp 不是银行，资金不受 FSCS 保护。POS 一侧，前 Goodtill 安全页面披露了 AWS 托管和 PCI DSS SAQ-D
              覆盖，但该认证窗口只到 2024 年 7 月，更新的审计证据没有公开。开发者界面是一个差异点。SumUp 发布 Reader SDK、Cloud API、API 参考文档、webhook 文档、Go 包和公开
              GitHub 仓库，其中包括 Tap-to-Pay 示例应用。这很重要，因为它说明 SumUp 想嵌入合作伙伴和商户软件栈，而不只是卖独立硬件。代价是，开发者和商户运营会更依赖 GitHub、应用商店、移动 OS
              政策和 SumUp 自身文档质量。公开评论面称得上不错但并不干净：应用商店评分健康，但 Trustpilot 仍显示大规模投诉量，所以信任故事足以支撑 SMB 分发，却还低于企业级透明度。
