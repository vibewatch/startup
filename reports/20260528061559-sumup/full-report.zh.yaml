      - number: '3.2'
        title: 微型商户 mPOS 同行画像
        blocks:
          - type: paragraph
            body: >-
              Square 现在隶属于 Block, Inc.（NYSE: SQ），是全球范围内与 SumUp 最可比的直接同行。FY2024，Square 在超过 4 million 卖家中处理了 $228 billion
              的总支付量（Gross Payment Volume），来自超过 800 million 张支付卡、合计 5.2 billion 笔交易。Block 的 10-K 明确表示，公司已把战略重心转向「中端卖家」（年化
              Square GPV 超过 $500,000 的卖家）以及餐厅 / 服务垂直行业，降低对微型商户细分的重视。SumUp 美国 CEO Andrew Helms 公开指出，这种上探市场迁移给 SumUp
              带来机会，可以吸收 Square 在客服意义上降低优先级的微型商户队列。在英国，Square 对所有线下刷卡付款收取 1.75%，免费计划没有月费，并为月交易额超过 £10,000 的商户提供定制费率计划。截至
              2026 年 5 月，Block 市值约 $42.5 billion。

              PayPal 于 2024 年末将 Zettle by PayPal 更名为 PayPal Point of Sale，把品牌整合到 PayPal 母品牌之下。英国线下交易费为 1.75%，PayPal
              Reader（替代 Zettle Reader 2）起价 £29，PayPal Terminal 起价 £149。PayPal 的主要分发优势是 400 million+
              全球消费者钱包，可通过使用其硬件的商户路由消费者侧支付和优惠券。独立评测者指出，PayPal Reader 应用功能少于已停用的 Zettle 品牌版本，且 1.75% 费率相对 SumUp 的
              1.69%「较高」。截至 2026 年 5 月，PayPal Holdings 市值约 $38.6 billion，这给它足够资源，以 SumUp
              这类私营公司资产负债表难以匹配的规模补贴商户获取和消费者忠诚度计划。

              Teya 是一家总部位于英国、2019 年成立的金融科技公司，主要在英国服务约 70,000 家商户，提供固定费率刷卡机，并打包次日结算（含周末）、带 0.5% 返现的免费 Business Account，以及
              24/7 英国本地客服。Teya 明确以服务质量对标既有机构，并在自家价格比较材料中把自己放在 SumUp 对面，强调其 24/7 英国本地支持是相对 SumUp 运营支持模式的差异点。当月银行卡交易额低于
              £2,500 时，商户需支付 £29.99 月费，形成 SumUp 没有设置的最低活跃门槛。Teya 规模（70k 客户 vs SumUp 4 million 商户）显著更小，但英国单一市场集中度让它成为
              SumUp 最大欧洲市场中的直接对手。

              myPOS 服务欧洲微型商户，采用纯按交易付费模式，提供带 IBAN 的免费商户账户，并在每笔付款后即时取得资金。myPOS 英国定价和费用页面确认，其零月费结构类似 SumUp 的按用量付费选项；myPOS
              的即时结算功能则是相对 SumUp 按用量付费计划 1–3 个工作日结算窗口的差异点。
