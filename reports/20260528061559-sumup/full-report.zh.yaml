      - number: '7.3'
        title: 合作伙伴、资本和基础设施依赖
        blocks:
          - type: paragraph
            body: >-
              SumUp 的商业模式依赖它无法完全控制的基础设施：卡网络、本地借记卡体系、资金保障和结算银行、赞助银行，以及信贷提供方。公开证据显示，这种依赖在运营上很重要。SumUp 直到 2025 年 8
              月才在德国增加原生 girocard 收单，意味着欧洲最偏本地借记卡的市场之一，此前要依赖国际共同标识才能完整收单。2026 年 5 月，IsDown 捕捉到的一则官方事件更新，把 Business
              Account 转账延迟归因于支付体系本身的问题。另一个侧面是，SumUp 英国资金保障页面称其依赖多家可信银行持有客户资金，而多份美国支持页面把 SumUp Inc. 标注为 Fifth Third Bank
              的注册 Payment Facilitator。


              资本依赖同样重要。公司 2024 年 US$1.6 billion 再融资明确用于既有债务再融资和新增增长能力，法律和新闻报道将其描述为当年欧洲最大私募信贷交易之一。随后，2025–2026
              年公开报道显示，SumUp 正探索 $10 billion 到 $15 billion IPO，部分目的在于为整合提供资金。这些事实合起来意味着，贷款方风险偏好和市场准入不是边缘问题；它们仍是 SumUp
              同时管理资产负债表维护和战略扩张的核心。
