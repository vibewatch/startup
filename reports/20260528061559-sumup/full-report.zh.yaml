    title: 公开财务缺口表
    columns:
      - 缺失指标或披露
      - 对承销判断的影响
      - 精确尽调路径
    rows:
      - - 扣除交换费、卡组织费用、退款和定制折扣后的实际混合抽佣率
        - 没有这个指标，标价无法转化为可靠的单位交易量收入假设
        - 要求按产品和地区提供月度总交易量、总费用、网络 / 卡组织 / 交换费支出、退款和净收入
      - - 硬件毛利率和补贴政策
        - 必须用它判断硬件本身盈利，还是只是一种 CAC 工具
        - 要求提供物料清单、到岸成本、保修 / 更换成本，以及按设备系列划分的利润率
      - - POS / 开票 / 付费层的软件附加、ARPU 和流失
        - 必须用它判断订阅是否实质改善收入质量
        - 要求提供付费席位、付费账户渗透率、ARPU、流失率和企业合同分布
      - - CAC、回本周期、队列留存 / NRR
        - 必须用它评估交叉销售是在加深经济性，还是只扩大产品范围
        - 要求按商户分层提供渠道 CAC、回本周期、队列留存和 NRR
      - - 按业务线划分的毛利率和贡献利润率
        - 必须用它把支付驱动的规模故事与真正有吸引力的利润池分开
        - 要求提供处理、硬件、软件、银行和贷款业务的分部毛利，以及贡献利润率桥表
      - - 商户融资违约、逾期、回收和准备金政策
        - 必须用它给贷款账本估值，并压测下行周期中的资本消耗
        - 要求提供放款年份、逾期分桶、核销、回收和准备金方法
      - - 当前现金余额、月度烧钱速度、现金跑道、债务到期和契约余量
        - 必须用它判断 2024 年再融资是解决了资本问题，还是只是把问题后移
        - 要求提供包含现金、债务计划、契约测试和下行情景现金跑道分析的资金包
      - - 经审计合并收入、GMV 和分部结构
        - 必须用它调和私募估值标记、二级市场定价和任何 IPO 准备估值案例
        - 要求提供过去两年经审计合并财务报表，以及本年度管理账
    notes: 这些是核心公开数据缺口，使本章只能停在“看似合理”，还无法进入完整承销判断。
