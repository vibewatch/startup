        blocks:
          - type: paragraph
            body: >-
              公开资料里支持 SumUp 客户耐久性的最好论据，不是一条披露的留存曲线，而是从低摩擦支付楔子进入软件、银行并最终进入企业使用的可见扩张循环。Beacon 活动报道显示，SumUp
              有意围绕这种递进建设：面向成长型零售和餐饮的 POS Plus、面向更复杂经营者的 Business Account Plus，以及面向高级用户的更多商户服务基础设施。Finextra 关于 Business
              Account 的报道说明这不是纸面故事。150 万活跃 Business Account 用户和超过 €1 billion 存款，意味着 SumUp
              的银行附着已经有规模；商户现金预支又提供了进一步提升钱包份额的杠杆。话虽如此，公开记录在投资人最想要精度的地方很薄。店铺数据集不披露头部客户集中度。场馆公告证明 The O2 和 Between the
