  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、标价与变现表面
        blocks:
          - type: paragraph
            body: >-
              SumUp 的公开材料显示，它是一家典型的支付驱动型 SMB 平台，已远超一个简单读卡器。核心收入引擎是交易处理：英国定价页列出线下付款 1.69% 的按用量付费价格、每月 £19 的 Payments Plus
              计划下 0.99% 的折扣费率，以及为每月处理至少 £10,000 的商户提供定制条款。同一页面还列出 2.5% 的远程支付定价，以及 POS Plus 每月 £29、Business Account Plus
              每月 £15、Invoices Plus 每月 £8 等经常性软件订阅。官方产品页面和 POS Pro 网站显示，SumUp
              想变现的不只是支付受理，还包括同一商户档案内的工作流软件、报告、会计集成和现金管理功能。


              官方和第三方产品证据也显示，SumUp 仍把硬件作为一次性客户获取和附着入口来变现，而不是租赁业务。ExpertMarket 2026 年定价评测列出的读卡器硬件价格从 £25 + VAT 到 £135 +
              VAT；CardPaymentOptions 则提到，长期的固定费率、零月费定位帮助 SumUp
              在微型商户中扩张。关键承销差别在于，这些都是标价或目录价，不是实际实现价格。公开材料明确把更高交易量商户导向定制定价；第三方拆解也指出，0.99%
              折扣只适用于符合条件的线下消费者卡交易量。因此，公开价格卡有助于理解变现机制和销售动作，但不能用来推断扣除交换费、卡组织费用、硬件成本、退款、支持和协商折扣后，公司实际留存的混合抽成率或毛利。
