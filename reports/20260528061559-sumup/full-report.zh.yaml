chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              SumUp 创立于 2012 年，使命是让全球小商户也能获得价格可承受、易用的支付解决方案，无论企业规模大小。公司 2011 年 11 月 7 日在英格兰注册为 Ka-Ching Payments
              Limited（2013 年 2 月更名为 SumUp Payments Limited，Companies House 编号 07836562），注册办公室位于 16–20 Shorts Gardens,
              London, WC2H 9US。主要运营中心在柏林，另在 Amsterdam、Barcelona、Cologne、London、São Paulo、Santiago、Boulder（Colorado）和 El
              Paso（Texas）设有办公室，四大洲合计超过 20 个办公室。


              SumUp 的核心产品是读卡器，让小商户可以用智能手机接受线下付款；不断扩展的「Super App」又把免费商业账户和
              Mastercard、在线商店、开票、礼品卡、支付链接和商户现金预支打包在一起。公司主要靠按笔交易费收费，没有每月硬件租金；同时通过 SumUp One（一种打包会员计划）和面向餐饮 / 零售 POS 系统的
              SaaS 软件叠加订阅收入。SumUp 在英国以受监管支付和电子货币机构运营（FCA），在欧盟则通过其爱尔兰子公司 SumUp Limited 作为受监管实体运营——爱尔兰实体是 SumUp 进入欧洲市场的门户。


              截至 2026 年 5 月，SumUp 在 37 个市场服务超过 4 million 商户，员工超过 3,000 人，国籍超过 90 个；自 2022 年 12 月起已实现 EBITDA 盈利，并在 2023
              年维持超过 30% 的同比收入增长。公司正在推进两条战略主线：一是为现有 SMB 客群深化金融服务（商业银行、贷款、保险），二是进入企业和大商户细分市场（体育场、演唱会场馆、全国性零售连锁）。
