- id: partner-capital-and-infrastructure-dependencies
  title: Partner, capital, and infrastructure dependencies
  body: |-
    SumUp’s business model depends on infrastructure it does not fully control: card networks, domestic debit schemes, safeguarding and settlement banks, sponsor banks, and credit providers. The public evidence shows that this dependency is operationally material. SumUp only added native girocard acceptance in Germany in August 2025, meaning one of Europe’s most domestic-debit-heavy markets previously relied on international co-badges for full acceptance. In May 2026, an official incident update captured by IsDown blamed business-account transfer delays on an issue within the payment scheme itself. Separately, SumUp’s UK safeguarding page says it relies on multiple trusted banks to hold customer funds, while multiple US support pages identify SumUp Inc. as a registered Payment Facilitator of Fifth Third Bank.

    Capital dependencies are just as important. The company’s 2024 US$1.6 billion refinancing was expressly for existing-debt refinance plus new growth capacity, and legal and news coverage framed it as one of Europe’s largest private credit transactions of the year. Public reporting in 2025-2026 then shows SumUp exploring a $10 billion to $15 billion IPO in part to fund consolidation. Together, those facts imply that lender appetite and market access are not side issues; they are still central to how SumUp manages both balance-sheet maintenance and strategic expansion.
