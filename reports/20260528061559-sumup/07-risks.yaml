- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold or event
  - Action implication
  rows:
  - - Licensing / safeguarding failure
    - Regulator action or safeguarding breach disclosure
    - Any FCA or CBI restriction, public remediation notice, or qualified safeguarding issue
    - Treat as thesis-break until legal scope, customer-fund impact, and remediation cost are underwritten.
  - - Settlement and outage recurrence
    - Public incident cadence
    - One cross-market payout incident lasting >12 hours or two major outages within any rolling 90 days
    - Pause conviction and demand postmortems, service credits, and customer-attrition data.
  - - Capital-markets dependence
    - New large debt or failed financing pathway
    - Another >$500m refinancing primarily for existing debt, or IPO push slipping without a disclosed balance-sheet alternative
    - Re-cut downside on dilution, debt cost, and strategic optionality.
  - - Partner-rail dependence
    - Scheme or bank counterparty disruption
    - Any repeat incident explicitly tied to payment scheme or bank partner, or visible acceptance rollback in a core market
    - Treat partner concentration and failover as priority diligence before writing equity upside.
  - - Execution and merchant trust
    - Leadership churn or complaints acceleration
    - Departure of enterprise, banking, compliance, or Irish-entity leaders inside 12 months, or BBB complaints rising above 30 closed in 12 months with fresh held-fund themes
    - Shift view from controlled expansion to stretched organisation until segment metrics improve.
  - - Regulatory-change / AML remediation load
    - Official rule change, remediation programme, or verification backlog
    - Any material PSD3/PSR or UK payment-rules gap programme, FCA/CBI remediation notice, or sustained growth in manual-review / false-positive queues
    - Treat as thesis-break until compliance cost, launch delays, and merchant-interruption risk are quantified.
  - - Data security / privacy incident
    - Security disclosure or regulator/customer incident notice
    - Any disclosed breach, recurring webhook or API-abuse event, or GDPR/privacy incident affecting merchant or consumer data
    - Pause conviction and demand root-cause analysis, notification scope, remediation cost, and churn impact.
  - - Margin compression / disclosure deterioration
    - Pricing concessions or continued opaque economics
    - Need to widen discount plans or negotiated pricing materially without matching segment disclosure, or visible enterprise losses to Square, PayPal/Zettle, or Stripe on software/infrastructure grounds
    - Re-cut margin assumptions and increase the governance discount until unit economics are evidenced directly.
  notes: kill criteria are intentionally measurable so they can be wired into refresh triggers instead of staying as qualitative concerns.
