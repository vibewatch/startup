- id: people-and-execution-risk
  title: People and execution risk
  body: |-
    The public story on execution is that SumUp is trying to do several hard things at once: extend from SMB card acceptance into enterprise accounts, broaden banking features such as local IBANs and cash deposit, keep lending products growing, and prepare for a possible IPO or industry consolidation cycle. None of those initiatives are unreasonable in isolation, but together they create management-scope risk. The company hired a new global enterprise-sales leader in 2025 specifically to go after larger merchants such as stadiums and concert venues, while Financial IT described simultaneous leadership changes across the Irish regulated entity’s CEO, finance, compliance, risk, and board layers. SumUp’s own banking release then layered on further localisation and product rollout work for 2025-2026.

    That mix creates two investor concerns. First, the company is moving into segments with longer sales cycles, more implementation work, and heavier service expectations than its historic micro-merchant base. Second, more of the business is now tied to regulated-bank-like workflows, meaning execution errors can have compliance and liquidity consequences rather than just product-adoption consequences. Public sources do not show enterprise revenue contribution, segment margins, or leadership attrition rates, so diligence must verify whether the organisation is truly ahead of the complexity curve or merely adding initiatives faster than management systems mature.
