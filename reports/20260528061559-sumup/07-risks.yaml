  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: debt-maturity
    missingEvidence: Debt maturity profile, interest margins, covenant thresholds, lender waterfall, and any refinancing triggers for the 2024 private credit package.
    whyItMatters: These terms determine whether a revenue or outage shock converts into an immediate liquidity or covenant event.
    diligencePath: Request the signed credit agreement, amendment history, compliance certificates, and most recent lender reporting pack.
    relatedQuestionRefs:
    - QR031
  - type: private-evidence-only
    severity: material
    topic: partner-banks
    missingEvidence: Names, concentration, and geography split of safeguarding banks, settlement banks, and business-account banking partners in the UK and EU.
    whyItMatters: Without named counterparties and exposure sizing, partner concentration and contingency quality cannot be underwritten.
    diligencePath: Request the bank-partner roster, partner SLAs, backup-routing design, and concentration by safeguarded balance and transaction volume.
    relatedQuestionRefs:
    - QR032
  - type: missing-source
    severity: material
    topic: uptime-sla
    missingEvidence: Product-level uptime commitments, incident-retention history, customer-credit policies, and regional service-level targets.
    whyItMatters: Independent outage trackers show incidents, but investors still need the contractual service standard and remediation obligations.
    diligencePath: Request enterprise MSAs, SLA schedules, service-credit policy, and an internal postmortem log for 2025-2026 incidents.
    relatedQuestionRefs:
    - QR033
  - type: private-evidence-only
    severity: material
    topic: enterprise-mix
    missingEvidence: Enterprise merchant pipeline, signed volumes, revenue share, win rates, and concentration versus the SMB base.
    whyItMatters: The enterprise push is central to execution risk, but public disclosures do not show whether the new motion is materially moving revenue.
    diligencePath: Request segment GPV and revenue by SMB versus enterprise, top-10 enterprise accounts, and the FY2026 sales plan by region.
    relatedQuestionRefs:
    - QR034
  - type: missing-source
    severity: material
    topic: regulatory-legal risk register coverage
    missingEvidence: A full litigation schedule, regulator correspondence log, and complaints-by-theme dataset across all operating jurisdictions.
    whyItMatters: Public registers and ombudsman decisions show some exposure, but they are not an exhaustive legal or regulatory inventory.
    diligencePath: Request outside counsel litigation summary, FCA and CBI supervisory correspondence, and management's complaints dashboard.
    relatedQuestionRefs:
    - QR006
    relatedTableRefs:
    - TR001
