  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof table coverage
    missingEvidence: A complete list of named SumUp enterprise, venue, and flagship SMB deployments with go-live dates, site counts, and product modules used.
    whyItMatters: The public record includes vivid examples, but it almost certainly undercounts the real deployed customer base and could over-emphasize showcase logos.
    diligencePath: Request the top 25 reference accounts by segment, with deployment scope, live status, tenure, and a customer reference contact for at least five accounts.
    relatedQuestionRefs:
    - QU011
    - QU024
    - QU025
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: retention metrics disclosure
    missingEvidence: Segmented NRR, GRR, logo churn, payment-volume churn, renewal rates, and contract duration for reader-only, POS, banking, and enterprise cohorts.
    whyItMatters: Review ratings are not a substitute for actual merchant retention economics, especially if SumUp is trying to move merchants up the stack into software and banking.
    diligencePath: Request cohort tables by acquisition year and product bundle, plus monthly active merchant and payment-volume retention by geography.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: customer concentration disclosure
    missingEvidence: Top-10 and top-20 merchant, venue, and partner concentration by GPV, revenue, and gross profit; also the share coming from event venues versus long-tail SMBs.
    whyItMatters: The long-tail SMB narrative suggests diversification, but SumUp’s new enterprise push could create hidden concentration in venues, large chains, or strategic channels.
    diligencePath: Ask management for concentration tables covering GPV, revenue, and loss-adjusted gross profit by customer, sector, and channel.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: enterprise venue revenue mix
    missingEvidence: Enterprise and venue payment volume, revenue, and gross-margin contribution as a share of the total merchant book.
    whyItMatters: Named venue wins are strategically important, but without mix data it is impossible to tell whether the enterprise motion is financially meaningful or still primarily signaling value.
    diligencePath: Request enterprise and venue segment dashboards, including active locations, deployed terminals and kiosks, annualized GPV, revenue, gross margin, and win-loss rates.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: minor
    topic: venue contract economics
    missingEvidence: Contract length, minimums, take rates, terminal counts, kiosk counts, and transaction throughput for The O2 and Between the Bridges.
    whyItMatters: The announcements confirm deployment, but they do not show whether the deals are recurring, high-volume, or profitable enough to validate the enterprise strategy.
    diligencePath: Ask for copies of venue contracts or summary term sheets, plus post-launch transaction and uptime dashboards for both accounts.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU003
    - TU005
