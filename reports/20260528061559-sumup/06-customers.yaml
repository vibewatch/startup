- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / risk
  - Impact
  - Diligence path
  rows:
  - - POS Plus and workflow software
    - Attach rate from card-reader users into POS Plus is undisclosed
    - Could materially lift ARPU and reduce churn if attach is strong
    - Request funnel data from reader-only merchants into POS, by country and vertical
  - - Business Account and deposits
    - 1.5 million active users is scaled but still below the 4 million+ total merchant headline
    - Shows meaningful wallet-share capture, but penetration by segment is unclear
    - Request business-account penetration and deposit balances by merchant cohort
  - - Merchant cash advances
    - Funding could deepen stickiness but may also skew toward cash-constrained merchants
    - Potentially raises share-of-wallet and retention if underwriting is disciplined
    - Request repeat-MCA rates, default rates, and GPV uplift after financing
  - - Loyalty, digital ordering, and enterprise modules
    - Feature depth versus specialist competitors is not independently benchmarked
    - Important for moving from payments to a unified commerce stack
    - Request enterprise win-loss analysis and churn reasons against specialist POS / CRM vendors
  - - Venue deals (The O2, Between the Bridges)
    - Marquee logos may overstate materiality if deployed volume is still small
    - Provides credibility for enterprise sales and future venue wins
    - Request annualized GPV, take rate, terminal counts, kiosk counts, and renewal terms for each venue
  - - Customer concentration disclosure
    - No public top-10 merchant, venue, or channel concentration data
    - Makes it impossible to quantify dependence on any large account or sector
    - Request concentration tables by GPV, revenue, and gross profit
  notes: This table focuses on where SumUp can expand revenue per merchant and where the public record stops short of proving durability or diversification. The key issue is not lack of logos, but lack of disclosed attach, mix, and concentration data.
  claimRefs:
