artifact: customers
slug: sumup
runDate: '2026-05-28'
company:
  name: SumUp
chapter:
  number: 6
  title: Customers
  summary: SumUp’s customer base is still anchored in micro merchants and small retail or hospitality operators, but public proof now shows a real expansion path into multi-site workflows and venue payments through accounts such as The O2 and Between the Bridges. Named merchant quotes across barbershop, café, restaurant, and market operators confirm live usage, while business-account growth to 1.5 million active users and more than €1 billion in deposits shows meaningful wallet-share expansion beyond card acceptance. Durability visibility remains partial because public review signals are mixed and support complaints are concrete, but no public NRR, churn, or concentration dataset exists.
sections:
- id: customer-base-segmentation
  title: Customer base segmentation still starts with micro merchants, then expands into workflow-heavy retail and hospitality
  body: 'SumUp’s public positioning and third-party reviews still point first to the long tail of micro merchants: freelancers, sole traders, independent retailers, and other owner-operated businesses that want easy card acceptance without bank-style onboarding friction. The official about page and homepage keep the message simple — affordable payments and business tools for small businesses — while independent reviews from Website Planet, CardPaymentOptions, and Payment Institutions say the best fit is still smaller operators and independent professionals. But the current product set is no longer just a card-reader story. Official hospitality and food-and-drink pages show SumUp pushing deeper into workflow-heavy environments with table service, kitchen routing, inventory, reporting, and multi-location controls. The enterprise page goes further, promising a single cloud-based POS platform with digital ordering, loyalty, and menu control across nearly 40 countries. Store Leads adds a useful
    directional signal on where this adoption is visible online: 17,222 live storefronts, strong apparel representation, meaningful food-and-drink share, and a geographic tilt toward the UK and France. The pattern is clear: SumUp’s buyer, user, and payer are often the same person at the low end, but the stack increasingly targets managers, staff, finance teams, and multi-site operators higher up the curve.'
