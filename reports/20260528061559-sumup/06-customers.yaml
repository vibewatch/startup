- id: named-deployments-and-proof-quality
  title: Named customer proof is strongest when SumUp shows real workflow or venue-wide deployment detail, not just logos
  body: 'The most useful public customer proof is not a logo wall; it is a quote, a workflow, or a deployment scope that shows how SumUp is actually being used. At the SMB end, official pages provide named examples with real though mostly qualitative outcomes: Netzel’s Barbershop says checkout became easier and business went up; Blend On The Hill says SumUp made it easy to get set up from the start; Market Place says Point of Sale Pro saves hours and improves reporting; Le Loubnane describes a massive time-saver; and Udderlicious says three years of use have simplified everything. Those are genuine usage signals, but they stop short of measurable retention or ROI. The venue evidence is stronger. Financial IT and RTIH report that Between the Bridges moved every card, POS, and QR order to SumUp for the 2026 season, while RTIH’s O2 coverage describes a multi-year on-site processing deal with POS and self-service kiosk supply. SumUp’s own enterprise-hire announcement reinforces that the company
    now serves DHL, Miele, and stadium players and is explicitly targeting stadiums and concert venues. That gives SumUp credible proof of enterprise deployment, but only some of it rises above showcase-level signaling. The best public evidence is the small set of accounts where the deployment scope is explicit.'
