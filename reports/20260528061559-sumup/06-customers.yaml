tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / User / Payer
  - Use case
  - Proof of live adoption
  - Strategic value
  - Key gap
  rows:
  - - Sole traders and freelancers
    - Owner-operator is buyer, user, and payer
    - Low-friction card acceptance, invoices, next-day cash flow
    - Official mission, micro-merchant positioning, and long-tenure Trustpilot/TrustRadius user reviews
    - Anchor segment for low-cost merchant acquisition and broad brand reach
    - Active versus dormant merchant count is undisclosed
  - - Retail shops and boutiques
    - Owner / manager buys, staff use, company pays
    - Countertop POS, catalog, promotions, reporting, online checkout
    - Store Leads shows apparel as the largest visible storefront category; Beacon launches POS Plus for retailers
    - Higher software attach and multi-location expansion path
    - No public retention or ARPU by retail cohort
  - - Food, drink, and hospitality SMEs
    - Owner / manager buys, staff use, company pays
    - Table service, kitchen routing, kiosk, QR ordering, inventory, reporting
    - Hospitality and food pages plus Blend, Market Place, Le Loubnane, and Udderlicious testimonials
    - Strong workflow wedge into daily operations and tips-heavy environments
    - No disclosed hospitality GPV, site count, or cohort retention
  - - Service businesses and beauty operators
    - Owner / manager is buyer and payer; frontline staff are users
    - Mobile POS, Tap to Pay, lightweight business management
    - Beacon names beauty salons as a POS Plus target; Netzel’s Barbershop is a named service-business testimonial
    - Mobile-first use cases align with SumUp’s low-complexity setup
    - No public vertical mix for service businesses
  - - Growing multi-site SMBs
    - Operations or finance buys, location managers and staff use, company pays
    - Multi-location menu control, multiple cards, bulk transfers, integrated software and banking
    - Enterprise page and Business Account Plus positioning for more complex operators
    - Primary land-and-expand cohort from payments into software and banking
    - Attach rate from reader-only merchants to advanced bundles is not disclosed
  - - Enterprise venues and chains
    - Operations, finance, and IT buy; venue staff use; company pays
    - Venue-wide POS, self-service kiosk, QR ordering, loyalty, and digital ordering
    - The O2 and Between the Bridges deployments; enterprise page; Pierre Lion hire
    - Strategic proof that SumUp can handle higher-volume environments
    - Revenue contribution and top-customer concentration are undisclosed
  notes: This segmentation mixes official positioning, named deployments, and third-party storefront data. It distinguishes total merchant-base claims from narrower ecommerce-store signals and uses null-equivalent gaps where public evidence stops.
