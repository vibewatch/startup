  - CU026
  - CU027
  - CU028
  - CU039
  - CU040
- id: TU006
  title: Adverse complaints / support-friction table
  columns:
  - Adverse signal
  - Evidence
  - Segment affected
  - Implication
  - Diligence ask
  rows:
  - - Trustpilot support friction
    - AI summary flags poor customer service, slow responses, and funds being held without clear notice
    - Merchants and business-account users
    - Support quality could impair retention even if product setup is easy
    - Request complaint volumes, first-response SLAs, and payout-freeze rates by product
  - - BBB / PaymentPop dispersion
    - CardPaymentOptions cites a BBB rating of 1.4 and C- profile with fund-hold complaints
    - US merchants
    - North American support and reserve-policy perception looks materially weaker than Trustpilot
    - Request monthly reserve-account incidence and fund-release timelines
  - - Ombudsman ruling
    - FOS upheld a complaint and ordered £400 compensation for poor communication
    - UK merchants
    - Shows support or communication failures can reach formal dispute resolution
    - Request FOS complaint counts, uphold rates, and remediation actions
  - - Resolver complaint taxonomy
    - Resolver says accessing funds and payment issues are the most common complaint types
    - UK merchants
    - Funds access appears to be a recurring pain point, not a one-off anecdote
    - Request categorized complaint logs and root-cause breakdowns
  - - Chargeback / fraud workflows
    - SumUp publishes formal chargeback and fraud-notification procedures
    - All merchants
    - Disputes and fraud reviews are normal enough to warrant dedicated processes that may temporarily interrupt payouts
    - Request chargeback rate, reserve policy triggers, and average resolution time
  notes: This table intentionally emphasizes adverse evidence rather than averaging it away with positive reviews. It distinguishes recurring support and funds-access friction from outright fraud liability or merchant misconduct.
