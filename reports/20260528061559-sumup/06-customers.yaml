- id: expansion-loops-and-concentration-risk
  title: Expansion loops are visible, but public concentration and enterprise-materiality data are still missing
  body: 'The best public case for SumUp’s customer durability is not a disclosed retention curve; it is the visible expansion loop from a low-friction payments wedge into software, banking, and eventually enterprise use. Beacon-event coverage shows SumUp deliberately building for that progression: POS Plus for growing retailers and restaurants, Business Account Plus for more complex operators, and more merchant-care infrastructure for advanced users. Finextra’s business-account coverage shows this is not theoretical. One and a half million active business-account users and more than €1 billion in deposits mean SumUp already has scaled banking attachment, while merchant cash advances provide a further share-of-wallet lever. That said, the public record is thin where investors would most want precision. The storefront dataset does not reveal top-customer concentration. Venue announcements prove production use at The O2 and Between the Bridges, but not whether venue economics are material to
    overall revenue. There is no top-10 merchant concentration table, no attach-rate disclosure from reader-only merchants into banking or POS, and no enterprise segment revenue mix. The current evidence therefore supports a credible land-and-expand story, but not a quantified conclusion that large-account expansion has yet changed the risk profile of the customer base.'
