- id: durability-satisfaction-and-support-friction
  title: 'Durability visibility is partial: reviews are generally positive on ease of use, but support and funds-access complaints are a real adverse signal'
  body: Public durability evidence for SumUp is mixed in an important way. On the positive side, Trustpilot rates SumUp 4.1 out of 5 from more than 43,000 reviews, and its automated summary highlights ease of use, straightforward setup, reliability, and fee transparency. A recent reviewer explicitly described using SumUp for more than five years with no monthly cost and dependable next-day payouts outside bank holidays, while TrustRadius reviews cite reliable payments and event or outside-bar deployments. JustUseApp is less enthusiastic, but still directionally positive at 3.8 out of 5 based on 675 reviews. The problem is that none of these are retention metrics. There is no public NRR, GRR, logo churn, payment-volume retention, or contract-length disclosure. Meanwhile, the adverse evidence is specific rather than abstract. Trustpilot also surfaces complaints about slow responses and funds being held without clear notice; CardPaymentOptions says fund-holds and support issues remain recurring
    themes; Resolver says accessing funds and payment issues are the most common complaint categories; and the Financial Ombudsman upheld a SumUp complaint over poor communication and ordered £400 in compensation. SumUp’s own complaints, chargeback, and fraud-notification pages confirm that disputes and payout reviews are part of the operating reality. So satisfaction is visible, but durability economics are not — and support friction is the clearest public risk to retention.
  claimRefs:
