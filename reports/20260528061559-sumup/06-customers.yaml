figures:
- id: FU001
  title: Customer journey map — SumUp land-and-expand path
  type: journey-map
  layout: wide
  summary: Six-stage view of how SumUp can move a merchant from simple payment acceptance into software, banking, funding, and eventually enterprise-grade operations.
  data:
    items:
    - label: Acquire low-friction reader
      description: Sole traders, freelancers, and micro-merchants adopt card acceptance because setup is easy, contract friction is low, and pricing is simple.
    - label: Run daily checkout
      description: Merchants begin using SumUp in daily service with card-present payments, mobile checkout, and next-day payout expectations.
    - label: Add workflow software
      description: Retail and hospitality merchants attach POS workflows such as reporting, inventory, table service, kitchen routing, and promotions.
    - label: Adopt business banking
      description: Payout capture moves into the SumUp business account, creating deposit balances and more daily operational dependence.
    - label: Use funding and loyalty
      description: Merchant cash advances, loyalty, digital ordering, and multiple cards deepen attachment beyond commodity acquiring.
    - label: Scale into multi-site / venue use
      description: The strongest public enterprise proof appears when SumUp becomes part of multi-location operations, venue kiosks, and venue-wide payment orchestration.
  claimRefs:
  - CU004
  - CU006
  - CU008
  - CU025
  - CU027
  - CU039
- id: FU002
  title: Adoption / deployment funnel — from micro merchant to enterprise venue
  type: flow
  layout: wide
  summary: Qualitative deployment flow showing how public proof progresses from simple payment acceptance into operational software, banking attach, and venue-scale rollouts.
  data:
    nodes:
    - id: reader
      label: Reader onboarding
      detail: Initial value proposition is easy card acceptance for micro-merchants, freelancers, and simple service businesses.
      tone: positive
    - id: daily
      label: Daily merchant usage
      detail: Merchants use SumUp for repeated card-present transactions, mobile checkout, and basic order or inventory workflows.
      tone: positive
    - id: pos
      label: POS workflow attach
      detail: Retail and hospitality customers add reporting, kitchen management, table service, promotions, and multi-location controls.
      tone: positive
    - id: banking
      label: Banking and funding attach
      detail: Business accounts, cash deposits, local IBANs, and merchant cash advances deepen dependency on SumUp as the primary financial partner.
      tone: neutral
    - id: enterprise
      label: Enterprise / venue rollout
      detail: The O2 and Between the Bridges show SumUp moving into higher-throughput venues with POS, kiosk, and QR order orchestration.
      tone: positive
    edges:
    - from: reader
      to: daily
    - from: daily
      to: pos
    - from: pos
      to: banking
    - from: banking
      to: enterprise
  approximationNotes: This is a qualitative operating flow, not a quantified conversion funnel. Public sources show the stages exist but do not disclose merchant counts or conversion percentages at each step.
