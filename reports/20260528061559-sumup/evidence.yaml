evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-financials
    missingEvidence: Audited annual revenue, gross margin, NRR, and burn rate for FY2024–2025.
    whyItMatters: >-
      Without public financials, IPO target multiples and debt-service coverage cannot be independently assessed; the
      $10–15B IPO range is unanchored.
    diligencePath: Request management accounts and audited financials under NDA from SumUp CFO Hermione McKee or investor relations.
    relatedQuestionRefs:
      - QO014
  - type: missing-source
    severity: material
    topic: group-ceo
    missingEvidence: >-
      Identity and tenure of SumUp's Group CEO, if any; the company's holding company board composition beyond Gareth
      Walsh.
    whyItMatters: >-
      Key-person risk cannot be assessed without knowing who leads the group entity; governance opacity is a diligence
      red flag ahead of a potential IPO.
    diligencePath: >-
      Request SumUp Group corporate organization chart and board membership from the company or obtain from Companies
      House filings for the holding entity.
    relatedQuestionRefs:
      - QO001
      - QO025
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: valuation-secondary
    missingEvidence: >-
      Full detail on how many secondary transactions occurred at discounts and at what prices; updated secondary-market
      pricing as of 2025–2026.
    whyItMatters: >-
      The Groupon single-data-point discount (€3.9B vs. €8B) may not represent the market clearing price; other
      shareholders may have transacted at different levels.
    diligencePath: Search SEC EDGAR for US shareholders disclosing SumUp sales; request cap table under NDA.
    relatedQuestionRefs:
      - QO013
      - QO018
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
