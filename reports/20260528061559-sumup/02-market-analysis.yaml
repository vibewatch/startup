- id: sizing-shells
  title: 'Sizing shells: large outer market, narrow evidentiary SAM'
  body: >-
    Public evidence supports a large market shell around SumUp, but it does not expose a clean company-specific SAM or SOM. The broadest top-down lens is the Europe payments market: Mordor pegs it at USD 0.64 trillion in 2025 and USD 0.74 trillion in 2026, with POS and retail still occupying large shares. The ECB gives a more infrastructure-grounded lens: euro-area non-cash transactions and contactless volumes are still growing, and the region already supports about 20.8 million POS terminals. These signals tell us SumUp is participating in a very large and still-digitizing payments ecosystem, not a niche edge case.


    But top-down market value is too broad to underwrite SumUp directly. Official UK and EU business-count shells show why. The UK had 5.7 million private-sector businesses in 2025, yet only 1.4 million had employees and only 2.6 million were VAT/PAYE registered. Europe had 26.1 million SMEs, but that includes many firms that are not merchant-accepting, not card-taking, or not in SumUp's merchant-software sweet spot. Those shell counts help bound the outer universe, but they do not convert cleanly into a payments-ready customer base.


    The practical conclusion is to preserve uncertainty rather than force precision. The figures in this chapter use analyst and official lenses to bound the size of the market, and they show why POS-heavy merchant services remain material. They should not be mistaken for disclosed SumUp TAM, SAM, or SOM. Even Worldpay's flagship 2026 report is only openly citable at the landing-page level, not fully inspectable from the public page, so the market-sizing record remains indicative rather than definitive.
