- id: drivers-and-constraints
  title: Growth drivers, adoption constraints, and what still needs diligence
  body: >-
    The growth case for SumUp's market is real. ECB data shows contactless and card-based euro-area payments still rising, UK Finance shows UK contactless usage remains deeply embedded in 2026, and FCA data says digital wallets are becoming a main or equal payment method for a meaningful minority of adults. Analyst studies reinforce the same direction of travel: Capgemini sees small merchants prioritizing omnichannel checkout and value-added services, zeb sees digital payments steadily replacing cash, and Mordor expects Europe's market to keep compounding through 2031. Regulation is not only a burden: PSD2, instant payments, and open-banking rails also create new ways for providers like SumUp to deepen payout, A2A, and embedded-finance propositions.


    Constraints matter just as much. Cash has not disappeared, the FCA still finds a meaningful cohort of heavy cash users, and Europe's local-scheme fragmentation keeps pan-European scaling messy. Instant payments and open banking may help merchants, but they also compress card economics and intensify competition around settlement, routing, and wallet-based checkout. Intrum's late-payment data implies that macro pressure can slow software spend exactly when merchants are most sensitive to fees and switching effort. Capgemini and Trustpilot add a second caution: fast onboarding and reliable support are part of the product, not a side issue.


    For valuation work, the chapter therefore supports a disciplined view. SumUp has exposure to large structural growth themes, but public evidence is still insufficient to isolate its exact market share by country, segment, or product. That means diligence should underwrite the company first as a European SMB merchant-services consolidator with upside from banking and larger venues, not as a generic claim on all payments growth.
