- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver / constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Euro-area non-cash and contactless growth
    - positive
    - near term
    - Supports continued demand for easy card acceptance and modern POS tools.
    - Request SumUp's active merchant growth by payment method and country.
  - - UK contactless and wallet penetration
    - positive
    - near term
    - Keeps low-friction checkout and mobile acceptance relevant for SMBs.
    - Ask for UK versus continental Europe product attach rates.
  - - One-stop-shop demand across payables and receivables
    - positive
    - near to medium term
    - Supports bundling payments, payouts, and banking-like tools into one merchant stack.
    - Request business-account adoption and payout-usage data by cohort.
  - - Embedded payments and software-led finance demand
    - positive
    - medium term
    - Creates upside if SumUp can distribute through platforms or deepen banking adjacencies.
    - Ask for platform/API revenue and partner pipeline.
  - - Open banking and instant payments
    - mixed
    - near to medium term
    - Can widen A2A and settlement products but also compress card economics.
    - Request gross-margin sensitivity by rail and instant-settlement usage.
  - - Cash persistence
    - negative
    - ongoing
    - Limits the speed of digital conversion in certain regions and merchant types.
    - Request country mix for cash-heavy verticals and offline-only merchants.
  - - Late payments and macro pressure
    - negative
    - near term
    - Makes merchants more fee-sensitive and may delay software upgrades.
    - Ask for churn, downgrade, and delinquency trends in weaker SMB cohorts.
  - - Switching, onboarding, and support friction
    - negative
    - ongoing
    - Execution quality can matter as much as price in retaining small merchants.
    - Review support SLA, reserve policies, and complaints by product.
  - - Local-scheme fragmentation and compliance overhead
    - negative
    - medium term
    - Raises operational complexity across Europe and can dilute innovation budgets.
    - Request certification, routing, and compliance cost by country or scheme.
  notes: Timing reflects when the source-backed force is most likely to influence merchant adoption or margin; several items are structurally mixed because the same trend can be a growth driver for new products and a pressure source for legacy card economics.
