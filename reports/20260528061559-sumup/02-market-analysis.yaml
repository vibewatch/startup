  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sumup-sam-som
    missingEvidence: Country-level GMV, merchant counts, and take rates by core product lane (card readers, POS, remote payments, business account).
    whyItMatters: Without country and product mix, any public SAM or SOM is only an outer shell and cannot support precise market-share or margin underwriting.
    diligencePath: Request a cohort table splitting active merchants, payment volume, revenue, and gross margin by geography and product family for 2024-2026.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: enterprise-mix
    missingEvidence: Revenue, merchant-count, or location-count disclosure for POS Pro, multi-site customers, larger venues, and enterprise-adjacent deployments.
    whyItMatters: The chapter can verify that SumUp is presenting an upmarket product, but not whether enterprise or larger-venue expansion is material to growth or valuation.
    diligencePath: Ask management for signed POS Pro customers, average location count, average monthly processing volume, and share of revenue from larger venues.
    relatedQuestionRefs:
    - QM027
    relatedTableRefs:
    - TM003
  - type: access-blocked
    severity: minor
    topic: gated-analyst-tables
    missingEvidence: Open-access Europe merchant-segment tables from flagship reports such as Worldpay GPR 2026 and similar top-down merchant-acquiring datasets.
    whyItMatters: Public landing pages confirm these reports exist, but the detailed merchant splits that could sharpen the sizing range remain gated.
    diligencePath: Obtain the full Worldpay, Capgemini, or comparable merchant-payments reports in the data room and reconcile their Europe SMB and POS assumptions against management disclosures.
    relatedQuestionRefs:
    - QM024
    - QM025
    - QM026
    relatedTableRefs:
    - TM002
