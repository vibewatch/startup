company:
  name: SumUp
chapter:
  number: 2
  title: Market Analysis
  summary: SumUp's market is best understood as the European and UK SMB merchant operating stack where businesses need low-friction in-person acceptance, remote payment collection, simple commerce software, and faster cash-flow tools. Public data supports a large outer shell—26.1 million European SMEs, 5.7 million UK businesses, and a Europe payments market worth USD 0.64 trillion in 2025—but no public source isolates SumUp's true SAM or SOM by country, merchant size, or product mix. Growth tailwinds are strong, yet cash persistence, support friction, interchange pressure, and local-scheme fragmentation keep the opportunity large but materially uncertain.
sections:
- id: market-boundary
  title: Market boundary and the jobs SumUp actually serves
  body: >-
    SumUp's addressable market is narrower than the whole payments industry and broader than a single card-reader SKU. The company's current product surfaces cover low-friction in-person acceptance (card readers and Tap to Pay), store-side software (POS Lite, POS Pro, and Terminal), remote collection (invoices, payment links, invoice generator), simple online commerce (online store), and a business-account layer that speeds payouts and transfers. That means the included spend is best framed as the SMB merchant operating stack around getting paid, keeping checkout moving, and managing near-term cash flow rather than as the entire banking, treasury, or enterprise-acquiring universe.


    The exclusion line matters. Full commercial banking, issuer processing, wholesale FX, and custom enterprise acquiring are not the underwriting center of gravity for SumUp. Status-quo substitutes remain highly fragmented: cash, manual bank transfer or paper-style invoicing, basic bank terminals, and standalone POS or bookkeeping tools. SumUp's self-serve setup language, phone-based acceptance, and no-website-required remote tools all point to a strong wedge in micro-merchants, sole traders, and small local operators that want fast deployment more than bespoke enterprise integration.


    At the same time, the boundary is expanding. POS Pro is explicitly positioned as an enterprise point-of-sale surface, and the 2026 core-products announcement shows management packaging operations software and payments together. The right market read is therefore a layered one: SumUp's base market is European and UK SMB merchant acceptance plus adjacent software and banking, while larger-venue and multi-site retail are upside adjacency rather than the clean base-case TAM.
