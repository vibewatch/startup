- id: buyer-and-segment-map
  title: Buyer and segment map
  body: >-
    SumUp's buyer motion is still closest to founder-led and operator-led SMB commerce, but the workflow differs by segment. A solo trader or field-service merchant often starts with the simplest acceptance pain: “I need to take card payments on the go.” A micro retailer or market stall may begin with card readers or Tap to Pay, then add payment links or an online store when customer demand spills beyond the counter. Hospitality and busy venues pull harder toward handheld POS, staff tooling, and faster checkout. Service businesses use invoices and links before they ever need a full store or a sophisticated multi-location POS deployment.


    The payer and budget owner also change by segment. In the micro end of the market, the founder or owner-operator usually acts as buyer, user, and payer at the same time, which makes simplicity and transparent operating effort more important than feature breadth. As merchants grow, finance or operations owners begin to care more about payout speed, transfers, and business-account integration, while store managers or frontline staff become daily users of the POS layer. Platform and marketplace buyers are different again: they care less about one outlet and more about embedded distribution, downstream merchant enablement, and settlement plumbing.


    This is why one-stop-shop positioning matters. Visa says smaller European businesses want combined payables and receivables tools, and PSE/TSG shows meaningful latent demand for embedded payments and financing from software partners. SumUp's product stack matches that progression: accept a payment, add remote collection, add simple commerce tools, then add business-account and settlement control. POS Pro and multi-store features widen the reachable segment, but the heart of the buyer map remains SMBs that want fast deployment and increasingly broader workflow coverage.
