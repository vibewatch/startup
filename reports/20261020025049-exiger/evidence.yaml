evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: Current revenue, ARR, organic growth, gross margin, net retention, burn, customer concentration, and segment mix.
    whyItMatters: >-
      Customer counts and transaction headlines cannot establish software quality, growth durability, or valuation
      support without these operating metrics.
    diligencePath: >-
      Obtain audited financial statements, monthly ARR bridges, cohort retention, gross-margin schedules, cash
      statements, and top-customer concentration from management.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Complete current executive and board roster, founder roles, ownership percentages, voting rights, board
      committees, veto rights, and management rollover.
    whyItMatters: >-
      Sponsor control, management incentives, succession exposure, and minority protections cannot be assessed from
      named directors alone.
    diligencePath: >-
      Request the current cap table, stockholders agreement, board and committee roster, investor-rights agreements, and
      management incentive plan.
    relatedQuestionRefs:
      - QO002
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: ownership
    missingEvidence: >-
      Primary closing documentation reconciling the $1.2B investment or acquisition label with the statement that
      transaction terms were undisclosed.
    whyItMatters: >-
      Purchase price, enterprise value, equity value, primary capital, and secondary proceeds have different
      implications for ownership and current valuation.
    diligencePath: >-
      Review the 2023 purchase agreement, funds-flow statement, capitalization at closing, debt schedule, and sponsor
      investment committee materials.
    relatedQuestionRefs:
      - QO003
      - QO007
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A bottoms-up Exiger TAM/SAM/SOM model with buyer counts, annual contract values, segment and geography filters,
      pricing, current market share, and independently validated customer ROI.
    whyItMatters: >-
      Without a serviceable-market bridge and obtainable-share evidence, broad agentic-AI category forecasts cannot
      support Exiger revenue forecasts or valuation multiples.
    diligencePath: >-
      Request management's segment-level market model, pricing and contract distributions, win/loss data, sales-cycle
      metrics, retention and expansion cohorts, and customer-level ROI studies; reconcile them to independent
      procurement and analyst benchmarks.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: competitive-evidence-gap
    missingEvidence: >-
      Independent named-rival benchmarks covering capability, customer scale, win rates, funding, pricing, and product
      direction.
    whyItMatters: >-
      Without symmetric evidence, Exiger's relative position and the durability of its asserted lead cannot be
      quantified.
    diligencePath: >-
      Obtain recent RFP scorecards, win-loss records, named customer references, analyst evaluations, and direct product
      demonstrations for the top three finalists.
    relatedQuestionRefs:
      - QP004
      - QP007
      - QP008
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Realized pricing, implementation fees, discount schedules, renewal terms, and comparable competitor proposals.
    whyItMatters: Procurement-channel access does not establish price-performance, gross-margin quality, or switching economics.
    diligencePath: >-
      Review anonymized order forms, renewal cohorts, discount approvals, implementation statements of work, and three
      recent competitive bids.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: moat-durability
    missingEvidence: >-
      Independent customer evidence on retention, multi-homing, replacement frequency, data portability, implementation
      burden, and competitor displacement.
    whyItMatters: >-
      Company-issued scale and technology claims do not prove lock-in or resistance to suite bundling and internal
      builds.
    diligencePath: >-
      Interview retained, churned, and multi-product customers and test data export, integration replacement, and
      workflow migration in technical diligence.
    relatedQuestionRefs:
      - QP006
      - QP007
  - type: private-evidence-only
    severity: material
    topic: pricing-and-recognition
    missingEvidence: >-
      Current price book, realized contract values, discounts, revenue mix, and revenue-recognition policy by software,
      data, and services.
    whyItMatters: >-
      Without this evidence, recurring revenue quality, ACV, services exposure, and price realization cannot be
      measured.
    diligencePath: Obtain the current price book, top contract samples, billing schedules, and audited revenue-recognition memo.
    relatedQuestionRefs:
      - QI002
      - QI009
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      ARR, GAAP revenue, gross margin, data and cloud COGS, services margin, CAC, payback, GRR, NRR, and cohort
      retention.
    whyItMatters: >-
      These inputs determine whether claimed customer scale and product investment convert into durable, profitable
      growth.
    diligencePath: >-
      Review audited statements, ARR waterfall, cohort schedules, sales-efficiency analysis, and product-versus-services
      margin bridge.
    relatedQuestionRefs:
      - QI004
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, monthly burn, runway, debt and covenant schedule, acquisition consideration, planned uses of funds,
      and next-financing trigger.
    whyItMatters: The public investment narrative cannot establish liquidity, financing dependency, or downside resilience.
    diligencePath: >-
      Obtain the latest balance sheet, 24-month cash forecast, debt agreements, board-approved budget, and acquisition
      cash-flow schedule.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: >-
      Revenue concentration by customer, federal versus commercial segment, product, contract vehicle, and renewal
      cohort.
    whyItMatters: >-
      A large claimed logo count does not reveal dependence on major government programs or a small set of enterprise
      contracts.
    diligencePath: Request top-20 customer revenue, segment bookings, contract backlog, renewal dates, and concentration sensitivity.
    relatedQuestionRefs:
      - QI005
  - type: missing-source
    severity: material
    topic: independent-validation
    missingEvidence: >-
      Independent uptime history, incident record, penetration-test results, model accuracy benchmarks, and
      implementation performance distributions.
    whyItMatters: >-
      Company-issued feature and control claims do not establish production reliability or decision quality in regulated
      workflows.
    diligencePath: >-
      Request status history, incident summaries, third-party security reports, model evaluation packs, and
      reference-customer implementation metrics.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: security-controls
    missingEvidence: >-
      Current FedRAMP authorization scope, ISO certificate, SOC 2 Type II report, control exceptions, and remediation
      status.
    whyItMatters: Named certifications may cover only part of the product, infrastructure, period, or control population.
    diligencePath: Review the authorization package and current audit artifacts under NDA with security and compliance owners.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: implementation
    missingEvidence: >-
      Median deployment duration, implementation staffing, integration failure rate, support SLA, and time-to-value by
      customer segment.
    whyItMatters: >-
      Service intensity and data onboarding burden determine scalability, gross-margin quality, and customer adoption
      risk.
    diligencePath: Obtain cohort-level implementation data and interview recent enterprise and federal deployment owners.
    relatedQuestionRefs:
      - QE004
      - QE007
  - type: missing-source
    severity: minor
    topic: product-roadmap
    missingEvidence: Module-level release notes, deprecation policy, API documentation, and customer-visible roadmap commitments.
    whyItMatters: A claimed rapid release cadence is difficult to evaluate without versioned artifacts and compatibility evidence.
    diligencePath: Request the product roadmap, changelog, API documentation, release governance, and backward-compatibility policy.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: NRR, GRR, logo churn, renewal rates, contract duration, and cohort expansion or contraction by customer segment.
    whyItMatters: >-
      Customer counts and review scores do not establish recurring-revenue durability or whether deployments expand
      after initial adoption.
    diligencePath: >-
      Obtain a customer-level ARR and renewal cohort export for the last eight quarters, reconciled to bookings and
      revenue by finance.
    relatedQuestionRefs:
      - QU008
  - type: private-evidence-only
    severity: material
    topic: customer concentration
    missingEvidence: Top-1, top-5, and top-10 customer revenue concentration, public-sector revenue share, and channel-attributed ARR.
    whyItMatters: >-
      The stated government and Fortune 500 footprint cannot reveal dependence on a small number of large contracts or
      procurement channels.
    diligencePath: >-
      Review customer-level revenue, contract ceilings, funded backlog, renewal dates, and channel source with names
      masked if confidentiality requires.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof
    missingEvidence: >-
      A complete current customer roster with production versus pilot status, deployed modules, start date, contract
      value, and validated outcomes.
    whyItMatters: >-
      The public sample cannot establish reference breadth, deployment depth, or the share of customers with measurable
      production outcomes.
    diligencePath: >-
      Request a stratified reference list and independently call at least two customers in each material government,
      enterprise, and industrial segment.
    relatedQuestionRefs:
      - QU003
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: legal-status
    missingEvidence: >-
      Primary regulator, court, licensing, privacy, and claims-history records establishing Exiger's current legal and
      enforcement posture.
    whyItMatters: >-
      The product supports regulated decisions, so undisclosed enforcement, claims, or license constraints could impair
