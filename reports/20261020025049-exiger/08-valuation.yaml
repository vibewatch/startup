schemaVersion: "report-v2"
artifact: valuation
slug: exiger
runDate: 2026-10-20
company:
  name: Exiger
chapter:
  number: 8
  title: Valuation
  summary: >-
    Exiger presents credible product scale, customer reach, and sponsor-backed investment, but the
    assigned public evidence does not disclose the current revenue, ARR, margins, retention, cash
    profile, capitalization, or transaction terms needed to underwrite a precise entry valuation.
    The recommendation is research-more with medium confidence, high risk, and a stretched
    valuation stance relative to the evidence currently available.
sections:
  - id: recommendation-and-decision
    title: Recommendation and decision posture
    body: >-
      The investable conclusion is research-more, not buy or avoid. Exiger has evidence of a broad
      platform, more than 550 customers, AWS Marketplace distribution, and company-reported 50%
      core-market growth in 2026. Those signals support continued diligence, but they do not supply
      the financial denominator required for valuation. The public record variously describes the
      2023 event as a $1.2 billion acquisition or investment, while one source also says the
      transaction's financial terms were not disclosed. Without current ARR, revenue quality,
      gross margin, retention, net debt, cash burn, or preference terms, the reported figure should
      not be treated as a verified current equity value. Entry discipline therefore requires a
      data-room bridge from enterprise value to fully diluted equity value before price approval.
    claimRefs: [CV001, CV002, CV003, CV004, CV010, CV011, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-and-comparable-context
    title: Financing and comparable context
    body: >-
      Financing history is internally inconsistent across third-party databases. Tracxn reports
      $80 million across three rounds and identifies an April 2024 conventional-debt round with an
      undisclosed amount, whereas Multiples reports $80 million across one pre-acquisition round.
      That conflict prevents a reliable reconstruction of invested capital, debt outstanding, or
      dilution. Multiples also presents a heterogeneous comparison set spanning Clarivate and SMS
      at 2.2x and 3.2x revenue and private EcoVadis and Pigment marks at 8.7x and 10.0x. These are
      context markers, not an Exiger pricing formula: the companies differ in product mix,
      profitability, growth, liquidity, and reporting basis, and Exiger's current revenue is not
      disclosed in the assigned evidence.
    claimRefs: [CV001, CV004, CV005, CV006, CV007, CV014, CV016]
  - id: thesis-and-antithesis
    title: Thesis and anti-thesis
    body: >-
      The thesis is that proprietary supply-chain data, regulated-market deployment, customer
      breadth, and faster AI product delivery can support durable workflow ownership. Exiger says
      it reinvests more than 30% of annual revenue in proprietary data, reduced the modeled cost and
      duration of its AI replatform, and achieved 50% core-market growth in 2026. The anti-thesis is
      equally material: these are company claims without disclosed cohort retention, unit
      economics, or audited segment results. Simplify's critical commentary identifies bundled
      supplier-risk features from SAP Ariba and Oracle, replatform execution risk with government
      buyers, and pricing pressure from specialists. A premium entry is defensible only after
      customer-level retention, margin, and competitive-win evidence converts those claims into
      measurable cash-flow durability.
    claimRefs: [CV008, CV009, CV010, CV011, CV012, CV013, CV015, CV016]
    tableRefs: [TV002]
  - id: scenarios-exit-and-diligence
    title: Scenarios, exit readiness, and diligence gates
    body: >-
      Scenario analysis must remain qualitative until Exiger supplies current operating and capital
      data. The bull case requires independently reconciled ARR growth, strong gross retention,
      scalable margins, and proof that AI-led product velocity expands paid usage rather than only
      feature output. The base case accepts product and customer evidence but withholds price
      endorsement because no current revenue multiple can be calculated. The bear case combines
      failed replatform execution, bundled competition, weak renewal economics, and financing
      overhang; its downside cannot be quantified without net debt and preference terms. No
      evidence in the assigned pool supports a target return, hold period, IPO window, or M&A exit
      value. Final approval should require audited financials, ARR and retention cohorts, customer
      concentration, pipeline conversion, cap table, debt schedule, liquidation preferences, and
      a management bridge between the reported $1.2 billion context and fully diluted equity value.
    claimRefs: [CV004, CV007, CV008, CV009, CV010, CV013, CV015, CV016]
    tableRefs: [TV003]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Decision field, Current view, Evidence basis, Decision implication]
    rows:
      - [Recommendation, research-more, "Product and customer signals are material, but valuation inputs are incomplete.", "Continue diligence; do not approve an entry price."]
      - [Confidence, medium, "Multiple current sources support operating momentum, while core financial facts remain private.", "Confidence can rise only after financial and customer reconciliation."]
      - [Risk rating, high, "Execution, bundled competition, financing structure, and disclosure gaps remain material.", "Require downside protections and explicit kill criteria."]
      - [Valuation stance, stretched, "A reported $1.2B transaction or investment context lacks a disclosed current financial denominator.", "Treat the figure as context, not a verified current equity value."]
      - [Entry discipline, gated, "Current ARR, margins, retention, net debt, preferences, and fully diluted ownership are unavailable.", "Price only after an enterprise-to-equity value bridge."]
    notes: "Analyst judgment as of 2026-10-20; labels are evidence-sensitive and do not represent a transaction recommendation or a verified market price."
    claimRefs: [CV001, CV002, CV003, CV004, CV010, CV015, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Evidence-backed argument, Thesis case, Anti-thesis or limitation, What would change the view]
    rows:
      - ["AI and data investment", "Exiger reports a faster, lower-cost AI replatform and substantial data reinvestment.", "Claims are company-issued and lack audited cost or productivity reconciliation.", "Provide budget-to-actual replatform costs and release-to-revenue conversion."]
      - ["Customer and channel reach", "The company reports 550+ customers and March 2026 AWS Marketplace availability.", "Counts do not disclose retention, expansion, concentration, or marketplace-sourced revenue.", "Provide logo-level cohorts, NRR, gross retention, and channel-attributed bookings."]
      - ["Growth and product proof", "Exiger reports 50% core-market growth and quantified workflow outcomes.", "Growth metric definition, period denominator, and independent customer validation are absent.", "Reconcile growth to audited ARR and obtain customer-confirmed ROI samples."]
      - ["Competitive moat", "Proprietary supply-chain data and regulated deployment may raise switching costs.", "Simplify highlights suite bundling, replatform execution, and specialist pricing risks.", "Show win/loss data, renewal pricing, implementation time, and displacement evidence."]
    notes: "Company-issued operating claims are presented as claims, not independent verification; the adverse commentary comes from Simplify's editorial summary within a company job repost."
    claimRefs: [CV008, CV009, CV010, CV011, CV012, CV013, CV015]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Required assumptions, Valuation or return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Audited ARR growth and retention validate product momentum; gross margin scales; AI investment improves paid adoption.", "Could support a premium to low public reference marks, but no Exiger value range is supportable before revenue and net-debt disclosure.", "Unquantified; requires data-room proof.", "Growth fails to reconcile to ARR or customers do not validate expansion and ROI."]
      - [Base, "Customer breadth and product differentiation persist, but financial disclosure and transaction terms remain limited.", "No numeric range; withhold price endorsement and benchmark only after normalizing revenue quality and capital structure.", "Most consistent with the assigned public evidence.", "Financing or preference terms transfer disproportionate downside to new capital."]
      - [Bear, "AI replatform underdelivers, suite vendors bundle competing features, specialists pressure pricing, or government demand weakens.", "Multiple compression and financing overhang are plausible, but downside value is not calculable from public evidence.", "Material risk signal, not a forecast probability.", "Weak retention, margin compression, customer concentration, or a down round."]
    notes: "Scenarios are conditional and intentionally omit invented probabilities, target returns, and valuation ranges; the cited 2.2x-10.0x revenue marks are heterogeneous reference points, not directly applied multiples."
    claimRefs: [CV004, CV007, CV008, CV009, CV010, CV013, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: "Operating proof narrows the diligence case, but financial and transaction opacity stop the chain before a price-approved recommendation."
    data:
      nodes:
        - id: product-scale
          label: Product and data scale
          detail: "Broad supply-chain workflow coverage and proprietary-data claims create a credible diligence starting point."
        - id: customer-proof
          label: Customer and channel proof
          detail: "550+ company-reported customers and AWS Marketplace availability indicate reach, not retention economics."
        - id: growth-signal
          label: Growth signal
          detail: "Company-reported 50% core-market growth is encouraging but lacks a disclosed financial denominator."
        - id: financial-gap
          label: Financial opacity
          detail: "Current ARR, revenue quality, margins, retention, burn, and net debt are not supplied by the assigned evidence."
        - id: risk-adjustment
          label: Competitive and execution risk
          detail: "Bundling, specialist pricing, and replatform execution can reduce the value of product momentum."
        - id: decision
          label: Research more
          detail: "No price approval until operating metrics and the enterprise-to-equity bridge are reconciled."
    approximationNotes: "Ordered qualitative logic only; node order does not encode probability, magnitude, or a quantitative conversion rate."
    claimRefs: [CV009, CV010, CV011, CV013, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Price approval is not supportable
    body: >-
      Maintain a research-more posture. The evidence supports continued diligence on Exiger's
      platform and customer reach, but not a current equity value or target return.
    claimRefs: [CV001, CV004, CV010, CV016]
  - calloutType: risk
    title: The $1.2 billion label needs reconciliation
    body: >-
      Sources call the 2023 event both an acquisition and an investment, while a transaction
      description says financial terms were not disclosed. Obtain the definitive capitalization
      and purchase-price bridge before using the figure in valuation.
    claimRefs: [CV001, CV002, CV003, CV004]
