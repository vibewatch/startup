company:
  name: "Exiger"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Exiger's documented competitive position rests on unusually broad workflow coverage,
    proprietary product-aware data, federal procurement access, and enterprise integration
    claims. Two independent sources identify rival or comparable companies, but neither
    supplies a symmetric product, pricing, or win-loss benchmark, so relative capability
    and moat durability remain material diligence gaps.
sections:
  - id: "competitive-boundary"
    title: "Competitive boundary and buyer alternatives"
    body: >-
      Exiger competes across a broad job rather than a single software category: third-party
      diligence, multi-tier supply-chain mapping, parts and materials intelligence, trade
      enforcement, software supply-chain exposure, procurement, and compliance workflow.
      That breadth means the relevant alternatives are not limited to direct SCRM or TPRM
      specialists. Buyers may also consider established GRC or TPRM suites, ERP and procurement
      platforms that can bundle adjacent workflows, internal data-and-analytics builds, and
      manual or consulting-led processes. Simplify names SAP Ariba, Oracle, Resilinc, and
      Prewave as potential competitive pressure, while Multiples supplies a heterogeneous
      comparable-company list and selected financial markers. Neither source provides symmetric
      product, customer, win-loss, or pricing evidence. The profile table therefore maps decision
      categories rather than pretending that full company-by-company comparisons are available.
      Exiger's own public scale claims are meaningful demand signals,
      but they remain company-issued and should not be treated as an independently measured
      market-share lead.
    claimRefs: ["CP001", "CP003", "CP004", "CP015", "CP016"]
    tableRefs: ["TP001"]
  - id: "capability-and-trust"
    title: "Capability breadth, proprietary data, and trust posture"
    body: >-
      The strongest documented differentiation is the combination of workflow breadth and
      product-aware data. Exiger says its engineering knowledge graph covers 10 billion
      supply-chain records, 400 million part attributes, and 6.5 million mapped relationships
      across more than 200 countries. It also says the platform connects supplier and software
      bills of materials to risk signals and exposes actions through APIs and enterprise-system
      integrations. The 2024 XSB acquisition brought a separate parts and logistics dataset
      in-house, reinforcing a data-asset strategy rather than a pure application-layer strategy.
      Trust and procurement posture add another competitive vector: Exiger reports FedRAMP
      Moderate authorization and other controls, while a government-wide GSA contract and a
      2026 P1 Marketplace status create routes into regulated buyers. None of the retained
      sources establishes how named competitors perform on the same criteria, so unknown cells
      are intentionally left unknown.
    claimRefs: ["CP001", "CP002", "CP004", "CP005", "CP007", "CP011", "CP012"]
    tableRefs: ["TP002"]
    figureRefs: ["FP001"]
  - id: "distribution-and-pricing"
    title: "Distribution power, procurement paths, and pricing opacity"
    body: >-
      Distribution appears to be part of Exiger's competitive strategy. A multi-year GSA award
      announced in 2022 carried a stated total contract value of $74.5 million, while the 2026
      AWS Marketplace launch was positioned as a way to shorten procurement and embed purchasing
      in an existing cloud account. P1 Marketplace "Awardable" status provides another government
      acquisition route. These channels can lower buying friction and make a functionally similar
      entrant harder to adopt in federal or highly regulated settings. They do not reveal unit
      pricing, realized discounts, contract minimums, implementation charges, or renewal terms.
      The assigned sources also provide no comparable pricing for named alternatives. Accordingly,
      the pricing table distinguishes disclosed procurement mechanisms from undisclosed economics;
      the $74.5 million award is a contract value, not annual recurring revenue or a list price.
    claimRefs: ["CP004", "CP005", "CP006", "CP014"]
    tableRefs: ["TP003"]
  - id: "moat-and-displacement-risk"
    title: "Moat durability and displacement risk"
    body: >-
      Exiger's defensibility appears to depend on the interaction of proprietary data, regulated
      deployment credentials, embedded integrations, acquisition-expanded coverage, and
      procurement channels rather than on a single feature. The company says it reinvests more
      than 30% of annual revenue in proprietary data and that AI writes 95% of first-generation
      code in its development process; both claims could support faster product iteration, but
      neither is independently verified here. The same breadth creates risk: enterprise suites
      can bundle adjacent modules, customers can build internal analytics around their own data,
      and generative-AI tooling may reduce application-development barriers. The assigned
      adverse search returned no retained result. Simplify's commentary names suite-bundling and
      specialist pressure, while the pool still contains no independent product benchmark,
      win-loss study, churn evidence, or rival roadmap. That absence is not proof that
      displacement risk is low. It means moat durability cannot be underwritten without direct
      customer references and side-by-side competitive evidence.
    claimRefs: ["CP008", "CP009", "CP010", "CP013", "CP015", "CP016"]
