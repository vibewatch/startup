      - ["Resilinc / Prewave", "Named specialist pressure", "No symmetric scale or funding profile in retained evidence", "Risk, procurement, and supply-chain teams", "Potential focused workflow depth and pricing pressure", "Named only in Simplify commentary; no product test or pricing evidence"]
