      - "Discounts / unknowns"
      - "Competitive implication"
    rows:
      - ["GSA enterprise SCRM / TPRM award", "Multi-year contract with stated total value of $74.5M", "Government-wide access to SCRM and TPRM capabilities", "Annual value, unit basis, usage, and realized discount are not disclosed", "Enterprise procurement path and shared-service distribution"]
      - ["AWS Marketplace", "No list or unit price in retained evidence", "1Exiger supply-chain and third-party-risk platform", "Contract minimums, implementation, discounting, and renewal terms unknown", "Potentially shorter cloud procurement path"]
      - ["P1 Solutions Marketplace", "No price disclosed; described as post-competition and readily awardable", "Exiger Cyber government use case", "Government-account access and award process details constrain comparison", "Additional regulated-buyer acquisition route"]
      - ["Direct enterprise offering", "No standardized list or per-unit price in retained evidence", "Broad supply-chain, procurement, compliance, and AI workflows", "Packaging, services mix, deployment fees, and realized pricing unknown", "Breadth may support platform selling but economics cannot be compared"]
      - ["Named competing products", "No retained evidence", "No retained evidence", "No rival price, package, or discount evidence", "No defensible price-performance comparison"]
    notes: >-
      Contract value is not ARR or list pricing. The table preserves the disclosed procurement
      mechanism and marks absent unit economics and competitor pricing as evidence gaps.
    claimRefs: ["CP004", "CP005", "CP006", "CP014", "CP015"]
figures:
