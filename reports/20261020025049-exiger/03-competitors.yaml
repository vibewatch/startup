      - ["Regulated deployment / trust", "Claims FedRAMP Moderate authorization, ISO 27001, and SOC 2 Type II controls", "Unknown", "Unknown", "Unknown", "Customer-specific; unknown"]
    notes: >-
      Exiger cells summarize company-issued statements; every rival-class cell is marked unknown
      because the assigned pool contains no source supporting a symmetric comparative rating.
    claimRefs: ["CP001", "CP002", "CP007", "CP008", "CP011", "CP012", "CP015"]
  - id: "TP003"
    title: "Pricing, packaging, and procurement comparison"
    columns:
      - "Offer / route"
      - "Disclosed price or contract model"
