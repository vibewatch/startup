    title: "Exiger differentiation vectors by breadth and validation"
    type: "quadrant"
    summary: >-
      Ordinal x-axis scores scope breadth from 1 (narrow) to 5 (broad); ordinal y-axis scores
      external validation from 1 (company assertion only) to 5 (documented procurement or
      institutional route).
    data:
      points:
        - label: "Proprietary product-aware data"
          x: 5
          y: 2
          detail: "Broad claimed data coverage; validation in the assigned pool is company-issued."
        - label: "Government-wide GSA contract"
          x: 4
          y: 5
          detail: "Broad SCRM / TPRM scope with a documented procurement award."
        - label: "FedRAMP and control posture"
          x: 3
          y: 3
          detail: "Important regulated-market claim, but credentials are described by Exiger."
        - label: "AWS Marketplace route"
          x: 3
          y: 4
          detail: "A live marketplace listing externally confirms the distribution route."
        - label: "XSB data expansion"
          x: 4
          y: 2
          detail: "Acquisition expands parts and logistics coverage; performance is not benchmarked."
        - label: "AI-native development process"
          x: 4
          y: 1
          detail: "Potential iteration advantage rests on unverified company claims."
    approximationNotes: >-
      Coordinates are analyst-authored ordinal evidence scores, not market-share, product-quality,
      or win-rate measurements. They rank the breadth and external validation of documented Exiger
      differentiation vectors only; named competitors lack comparable coordinates in the assigned pool.
    claimRefs: ["CP002", "CP004", "CP006", "CP007", "CP009", "CP012", "CP015"]
callouts:
  - calloutType: "strength"
    title: "Trust and distribution reinforce product breadth"
    body: >-
      Federal procurement routes, AWS Marketplace availability, and regulated-deployment claims
      can reduce adoption friction in buyer segments where access and assurance matter alongside
      functionality.
    claimRefs: ["CP004", "CP005", "CP006", "CP012"]
  - calloutType: "risk"
    title: "Relative advantage is not independently benchmarked"
    body: >-
      The retained pool contains no named-rival product test, pricing comparison, win-loss record,
      or independent customer benchmark, so Exiger's asserted lead cannot be quantified.
    claimRefs: ["CP014", "CP015"]
