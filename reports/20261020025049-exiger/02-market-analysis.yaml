      - ["Procurement and resilience", "Risk-informed sourcing, supplier qualification, directed-buy, and mitigation orchestration", "Full source-to-pay suites and general spend management", "Chief procurement and supply-chain organizations", "Workflow adjacency and ROI path"]
      - ["Trade, readiness, and compliance", "Country-of-origin, tariff, sanctions, regulatory, defense-readiness, and audit workflows", "Legal advice, customs brokerage, and broad governance suites", "Trade compliance, legal, federal, and defense program budgets", "Regulated-market adjacency"]
      - ["Cyber supply-chain risk", "Software bills of materials, supplier cyber hygiene, and product exposure", "Endpoint security, network security, and general security operations", "CISO, third-party risk, healthcare, and government security budgets", "Vertical and functional adjacency"]
    notes: "Boundary is synthesized from Exiger-issued product descriptions and third-party coverage; it is not a publisher-defined market taxonomy, and excluded systems may remain integration partners or substitutes."
    claimRefs: ["CM001", "CM002", "CM003", "CM015", "CM016"]
