      - ["Exiger installed-base reach", "Exiger releases; March and September 2026", "Global", "550+ customers and 150 Fortune 500 customers", "Company-reported customer counts", "Medium", "No segment mix, contract value, retention, or unique-customer denominator"]
      - ["Government and defense reach", "Exiger releases; March and September 2026", "Primarily U.S.-oriented descriptions", "60+ government/DIB organizations in March; 80+ government and defense industrial organizations in September", "Two dated company descriptions", "Medium-low", "Changing label and denominator prevent a clean growth calculation"]
    notes: "Values retain the cited publisher, period, denominator, and uncertainty. These are category and reach proxies, not an Exiger TAM/SAM/SOM; no CAGR is computed from the endpoints."
    claimRefs: ["CM004", "CM005", "CM008", "CM009", "CM010", "CM012", "CM016"]
  - id: "TM003"
    title: "Segment, buyer, user, payer, and adoption map"
    columns: ["Segment", "Economic buyer", "Primary users", "Likely payer or budget", "Workflow and adoption trigger", "Constraint or diligence ask"]
    rows:
      - ["Federal, defense, and national security", "Program executive, acquisition, supply-chain, or mission leadership", "Analysts, operators, data teams, and program managers", "Program, acquisition, readiness, or mission-assurance budget", "Control-tower visibility, red/blue-team workflows, and regulated deployment", "Validate procurement cycle, authority to operate, services load, and budget concentration"]
      - ["Large enterprise and manufacturing", "Chief procurement, supply-chain, risk, or operations leader", "Category managers, supplier-risk teams, engineers, and planners", "Procurement, operations, resilience, or risk budget", "Sub-tier visibility, alternate sourcing, BOM exposure, and cost reduction", "Validate ERP/PLM integration effort, measured ROI, retention, and contract expansion"]
      - ["Healthcare systems", "CISO, supply-chain, third-party-risk, or compliance leader", "Security, procurement, biomedical, and vendor-risk teams", "Cybersecurity, supply-chain, or compliance budget", "Ransomware pressure, medical-device/software exposure, and SBOM requirements", "AHA preferred status signals access, not signed demand or conversion"]
      - ["Trade and compliance-intensive organizations", "Chief compliance, legal, trade, or procurement leader", "Due-diligence, sanctions, customs, and supplier-onboarding teams", "Compliance, legal operations, procurement, or trade budget", "Country-of-origin, sanctions, tariff, and continuous-monitoring needs", "Establish willingness to consolidate point tools and accountability for agent actions"]
      - ["Cloud-marketplace buyers", "Existing AWS account and procurement owners", "Risk, supply-chain, procurement, and platform teams", "Committed cloud spend or software procurement budget", "Marketplace discovery, purchase, deployment, and account management", "Measure whether the route shortens sales cycles or merely changes transaction mechanics"]
    notes: "Buyer and budget ownership are analytical inferences from cited workflows and distribution routes; exact Exiger contract signatories, budget codes, sales cycles, and implementation fees are not public in the allocated evidence."
    claimRefs: ["CM008", "CM009", "CM010", "CM011", "CM012", "CM013"]
figures:
  - id: "FM001"
    title: "Evidence-constrained market reach stack"
    type: "pyramid"
    summary: "Six non-additive lenses narrow from a broad agentic-SCM forecast to Exiger's disclosed reach and channels without presenting an unsupported TAM/SAM/SOM."
    data:
      items:
        - label: "Agentic-AI SCM spend proxy"
          value: "$53B in 2030"
          detail: "Gartner forecast as reported by TechEdgeAI; category spend, not Exiger TAM."
        - label: "Enterprise adoption proxy"
          value: "60% in 2030"
          detail: "Forecast share of enterprises using SCM software with agentic features."
        - label: "Healthcare association reach"
          value: "Nearly 5,000 represented entities"
          detail: "AHA membership/reach proxy; not qualified buyers or contracts."
        - label: "Exiger global customer base"
          value: "550+"
          detail: "Company-reported current customer count."
        - label: "Fortune 500 customer reach"
          value: "150"
          detail: "Company-reported subset; penetration denominator is 500 companies."
        - label: "Government and defense reach"
          value: "60+ in March; 80+ in September 2026"
          detail: "Company releases use different descriptions, so no growth rate is inferred."
    approximationNotes: "The layers use different units, populations, and publishers and are neither additive nor a conversion funnel; they show evidence scope only, with no implied nesting, market share, or valuation multiple."
    claimRefs: ["CM004", "CM005", "CM011", "CM012", "CM016"]
callouts:
  - calloutType: "risk"
    title: "Category growth is not company market size"
    body: "The $53 billion forecast concerns agentic-AI-enabled supply-chain-management software broadly. Without pricing, segment revenue, contract values, market share, or serviceable-market methodology, applying it directly to Exiger would overstate the evidence."
    claimRefs: ["CM004", "CM016"]
  - calloutType: "insight"
    title: "Implementation capacity is part of the adoption equation"
    body: "Exiger's own role requirements emphasize onboarding, integration, recurring analysis, action tracking, and federal coordination. Faster AI product delivery does not remove customer data, governance, and change-management work."
    claimRefs: ["CM013", "CM014"]
