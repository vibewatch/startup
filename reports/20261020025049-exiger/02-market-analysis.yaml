slug: "exiger"
runDate: "2026-10-20"
company:
  name: "Exiger"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "Exiger addresses a converging market for supplier risk, third-party risk, procurement, trade compliance, and operational resilience, with agentic-AI supply-chain software providing the strongest available growth proxy. The allocated evidence does not establish an Exiger-specific TAM, SAM, SOM, pricing envelope, market share, or independently audited ROI, so adoption forecasts and buyer-reach indicators should be treated as directional rather than valuation-grade sizing."
sections:
  - id: "market-boundary"
    title: "Market boundary and sizing lenses"
    body: |
      Exiger's core boundary is narrower than the whole supply-chain software market: it centers on intelligence and workflows for third-party and supplier risk, sub-tier mapping, parts and materials, procurement, compliance, and resilience. The company also reaches adjacent trade, readiness, cyber-supply-chain, and product-lifecycle workflows, while ERP, PLM, source-to-pay systems, general-purpose cloud infrastructure, and internal analyst processes remain complements or substitutes rather than automatically included spend. TechEdgeAI reports Gartner forecasts for agentic-AI-enabled supply-chain-management software of less than $2 billion in 2025 and $53 billion in 2030, but this is a category proxy, not Exiger's TAM. No allocated source isolates Exiger's serviceable or obtainable share, pricing, or market share.
    claimRefs: ["CM001", "CM002", "CM003", "CM004", "CM016"]
    tableRefs: ["TM001", "TM002"]
    figureRefs: ["FM001"]
  - id: "buyers-and-routes"
    title: "Buyers, users, payers, and routes to adoption"
    body: |
      The evidence points to multiple buying centers rather than one homogeneous customer. Federal and defense programs value authorization, mission assurance, control-tower operations, and visibility into parts and suppliers; large enterprises and manufacturers buy resilience, procurement efficiency, and supplier intelligence; healthcare organizations add cyber and medical-device supply-chain concerns. Risk, procurement, supply-chain, compliance, security, and program leaders can all sponsor or use the platform, while enterprise or agency budgets ultimately pay. AWS Marketplace and the American Hospital Association relationship can lower discovery or procurement friction, but neither proves conversion economics. Exiger's claimed base of more than 550 customers and 150 Fortune 500 customers establishes reach, not penetration or retention.
    claimRefs: ["CM008", "CM009", "CM010", "CM011", "CM012", "CM013"]
    tableRefs: ["TM003"]
  - id: "growth-drivers"
    title: "Growth drivers and adoption timing"
    body: |
      Regulation, geopolitical volatility, sub-tier opacity, sanctions and trade controls, software bills of materials, and pressure to automate procurement all increase demand for continuously refreshed risk intelligence. Agentic AI could expand the software budget if it converts signals into governed actions rather than another dashboard. TechEdgeAI reports Gartner expects enterprise use of agentic features in supply-chain software to rise from 5% in 2025 to 60% in 2030, while 72% of supply-chain organizations were deploying generative AI in 2025 but only 23% had a formal AI strategy. Those figures suggest strong experimentation and a long implementation curve. Exiger's data asset and reinvestment claims may aid differentiation, but remain company assertions rather than independent proof.
    claimRefs: ["CM004", "CM005", "CM006", "CM007", "CM015"]
  - id: "constraints-and-gaps"
    title: "Adoption constraints and valuation implications"
    body: |
      Adoption is constrained by fragmented procurement data, difficult integrations, permissions, auditability, cybersecurity, human oversight, and the operating effort needed to turn findings into tracked mitigation. A company-issued role repost calls for large-scale onboarding, integration, recurring control-tower analysis, action management, and coordination with federal stakeholders, indicating that implementation capacity remains part of the solution. TechEdgeAI reports only 19% of surveyed organizations deploying supply-chain AI at scale while three-quarters were still planning, designing, or piloting use cases. For valuation, the category forecast is therefore insufficient: diligence still needs contract values, budget source, sales cycle, deployment cost, retention, measured ROI, pricing, market share, and a reconciled serviceable market.
    claimRefs: ["CM007", "CM013", "CM014", "CM016"]
