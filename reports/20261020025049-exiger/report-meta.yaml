  topStrengths:
    - >-
      Broad platform coverage and a company-reported knowledge graph spanning 10 billion supply-chain records create a
      credible data-and-workflow differentiation thesis.
    - >-
      Company-reported reach of 550+ global customers, 150 Fortune 500 companies, and 80+ government and defense
      organizations indicates meaningful enterprise and regulated-market penetration.
    - >-
      AWS Marketplace distribution, API-first integration claims, and stated FedRAMP Moderate, ISO 27001, and SOC 2 Type
      II controls support procurement and deployment in complex environments.
  topRisks:
    - >-
      Current ARR, revenue, margins, retention, burn, cash, debt, and customer concentration are undisclosed, preventing
      assessment of growth quality and downside resilience.
    - >-
      Rapid AI-led replatforming, frequent releases, and operational buildout create implementation, regression,
      model-governance, and customer migration risk without independent reliability data.
    - >-
      Suite bundling, specialist pricing pressure, opaque renewal economics, and an unreconciled sponsor transaction
      weaken confidence in durable pricing power and current valuation.
  unresolvedGaps:
    - >-
      Audited ARR and revenue, organic growth, gross margin, NRR, GRR, burn, cash, debt, and customer and segment
      concentration.
    - >-
      Definitive 2023 and 2024 transaction documents, fully diluted cap table, primary-versus-secondary proceeds,
      sponsor control rights, liquidation preferences, and enterprise-to-equity value bridge.
    - >-
      Customer-level retention cohorts, deployment depth, implementation time, independently validated ROI, win-loss
      evidence, and comparable pricing.
    - >-
      Independent uptime and incident history, model accuracy benchmarks, security-control reports and exceptions,
      regulatory records, and current certification scope.
disclaimer: >-
  This report is public-source diligence, not investment, legal, tax, or accounting advice. Company-reported figures
