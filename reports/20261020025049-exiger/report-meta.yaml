companyProfile:
  summary: >-
    Founded in 2013, Exiger is a private, sponsor-backed software company that combines supply-chain and
    third-party-risk data with compliance, procurement, and AI-assisted operating workflows. The company reports more
    than 550 global customers, including 150 Fortune 500 companies, and distributes 1Exiger through AWS Marketplace.
    Public evidence supports a credible regulated-market and product-scale narrative, but not the current financial
    quality or capital structure needed for underwriting.
