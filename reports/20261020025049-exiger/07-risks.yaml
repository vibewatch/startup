schemaVersion: "report-v2"
artifact: risks
slug: exiger
runDate: 2026-10-20
company:
  name: Exiger
chapter:
  number: 7
  title: Risks
  summary: >-
    Exiger's highest residual risks are execution of its rapid AI replatform, control of
    sensitive compliance decisions across a broad integration surface, and financial or
    customer concentration that cannot be quantified from the assigned public evidence.
    FedRAMP, ISO 27001, SOC 2 Type 2, permissioned agents, and audit-oriented workflows are
    meaningful claimed mitigations, but the retained evidence is predominantly company-issued.
sections:
  - id: risk-ranking-and-evidence-limits
    title: Risk ranking and evidence limits
    body: >-
      The risk view is constrained by an evidence set in which seven of eight retained sources
      are company-issued releases, product pages, or company job content; the remaining profile
      does not provide primary legal, regulatory, financial, or incident records. The leading
      residual risk is therefore execution and assurance rather than a documented adverse event.
      Exiger says it compressed a three-year, $180 million platform upgrade into a four-month,
      $20 million sprint and that AI writes 95% of first-generation code. Those claims indicate
      speed and cost leverage, but they also raise release-governance, regression, and model-risk
      questions when paired with daily or hourly deployment ambitions. The matrix uses ordinal
      analyst judgments, not measured incident probabilities, and assigns "unknown" where the
      pool cannot establish likelihood.
    claimRefs: [CR001, CR005, CR006, CR007]
    figureRefs: [FR001]
  - id: regulatory-legal-and-security-exposure
    title: Regulatory, legal, and security exposure
    body: >-
      Exiger operates inside consequential screening and supplier-risk workflows: its own
      materials describe sanctions, export-control, forced-labor, ownership, and product-origin
      checks. This creates exposure to false negatives, false positives, stale source data,
      privacy failures, and inconsistent jurisdictional rules. The company says it has
      government-wide FedRAMP Moderate authorization plus ISO 27001 and SOC 2 Type 2, and it
      describes role, permission, review-point, and audit-trail controls. Those are relevant
      mitigations, but the assigned pool contains no underlying authorization package, audit
      report, regulator record, court docket, or incident register. Diligence should therefore
      verify current scope, exceptions, subprocessors, model governance, claims history, and
      whether human review is mandatory for high-consequence decisions.
    claimRefs: [CR002, CR003, CR004, CR016]
    tableRefs: [TR001]
  - id: operational-and-technical-execution
    title: Operational and technical execution
    body: >-
      Operational risk is amplified by simultaneous replatforming, data onboarding, integration,
      and federal-program delivery. A 2026 Exiger job posting sought a director to "stand up and
      run" the operational backbone of a mission-critical, federally aligned program and required
      execution across multiple workstreams under tight timelines and ambiguous requirements.
      That is a useful delivery signal, not proof of failure, but it indicates that key operating
      processes were still being built while the company promoted rapid scaling. Hundreds of
      claimed native integrations, open APIs, and an AI-driven ETL layer increase usefulness and
      switching depth while expanding interface, entitlement, lineage, and implementation risk.
      Release quality, rollback performance, onboarding cycle time, and severity-one incident data
      are the decisive missing operating measures.
    claimRefs: [CR005, CR006, CR007, CR008, CR009, CR012]
    tableRefs: [TR002]
  - id: dependencies-economics-and-thesis-breaks
    title: Dependencies, economics, and thesis breaks
    body: >-
      Exiger's March 2026 AWS Marketplace launch can shorten procurement, but it adds a channel
      dependency whose revenue contribution, commercial terms, and contingency arrangements are
      undisclosed. The company also says it reinvests more than 30% of annual revenue in
      proprietary, product-aware data; that may sustain differentiation, yet it is an investment
      intensity metric rather than evidence of margin, burn, runway, or return on data spend.
      Company releases cite more than 550 customers, but the assigned evidence does not disclose
      retention, segment revenue mix, top-customer concentration, or government-budget exposure.
      Thesis-break triggers should include failed independent control verification, sustained
      severe release defects, material data-rights challenges, loss of critical authorization,
      or customer and channel concentration above the investor's underwriting limits.
    claimRefs: [CR010, CR011, CR013, CR014, CR015]
    tableRefs: [TR003]
