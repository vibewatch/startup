        - label: Security and AI governance
          values: [Medium, High, Company-asserted, Medium-high]
        - label: Implementation and integration
          values: [High, High, Scaling, High]
        - label: AWS channel dependency
          values: [Medium, Medium-high, Relationship established, Medium]
        - label: Financial and customer concentration
          values: [Unknown, High, Undisclosed, High uncertainty]
    approximationNotes: >-
      Analyst-created ordinal categories from the cited evidence; they are not measured
      probabilities, incident rates, or loss estimates.
    claimRefs: [CR001, CR003, CR004, CR005, CR007, CR008, CR011, CR013, CR015, CR016]
callouts:
  - calloutType: risk
    title: Evidence-quality constraint
    body: >-
      Public materials establish claimed controls and strategic intent, but not loss history,
      control effectiveness, concentration, or financial resilience; underwriting should remain
      conditional on primary diligence artifacts.
    claimRefs: [CR001, CR003, CR004, CR015]
  - calloutType: recommendation
    title: Thesis-break tests
    body: >-
      Pause or reprice if independent review finds material authorization gaps, repeated severe
      release failures, weak data rights, or customer, channel, and government concentration above
      the investor's approved limits.
    claimRefs: [CR004, CR007, CR011, CR015]
