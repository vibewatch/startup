callouts:
  - calloutType: strength
    title: Federal-grade distribution and ecosystem position
    body: >-
      Exiger combines a reported 550-plus customer base with government adoption,
      FedRAMP authorization, AHA partner validation, and AWS Marketplace distribution.
      These signals support relevance in regulated procurement, but remain weaker than
      audited retention, bookings, or revenue evidence.
    claimRefs: [CO006, CO007, CO008, CO015]
  - calloutType: risk
    title: Transaction scale is not a current valuation
    body: >-
      The $1.2 billion figure is described as an investment by Exiger and as an
      acquisition price by Multiples, which also says financial terms were undisclosed.
      Underwriting should obtain the closing statement and cap table before treating the
      figure as enterprise value, equity value, primary capital, or current valuation.
    claimRefs: [CO009, CO011]
