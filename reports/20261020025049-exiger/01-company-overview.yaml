company:
  name: Exiger
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Exiger is a sponsor-backed supply-chain and third-party-risk software company whose
    current scale is best evidenced by company-reported customer counts and a broad
    government footprint. Its 2026 AI replatform and AWS Marketplace launch strengthen
    the platform narrative, but transaction semantics, governance rights, and core
    financial performance remain insufficiently disclosed for firm underwriting.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Exiger presents itself as an AI platform for mapping and managing physical and
      software supply-chain risk, combining supplier, product, part, component, and risk
      data in one operating environment. Independent profile sources date the company to
      2013 and place its headquarters in New York City, although the assigned official
      pages do not state a current legal headquarters. The business model is described as
      subscription software, while the product spans supply-chain intelligence,
      third-party screening, compliance, and procurement workflows. Availability through
      AWS Marketplace since March 2026 reduces procurement friction but is distribution
      evidence, not proof of adoption or revenue. The September 2026 1Exiger release is a
      major platform change that management says moved development onto an AI-native
      lifecycle; the economic and quality claims around that replatform remain
      company-issued and need customer or technical validation.
    claimRefs: [CO001, CO002, CO003, CO006, CO014]
    tableRefs: [TO001]
  - id: ownership-leadership-and-governance
    title: Ownership, leadership, and governance
    body: >-
      Brandon Daniels remained the named chief executive in Exiger's September 2026
      announcement. That release also identifies a sponsor-heavy board: Carlyle partner
      Steve Bailey as chair, Insight Partners managing director Ryan Hinkle, JMI Equity
      partner Bob Nye, and Carlyle partner Dayne Baird as directors. Exiger characterizes
      the 2023 event as a $1.2 billion investment led by Carlyle, Insight, and JMI, while
      an independent transaction profile calls it a Carlyle acquisition or majority
      investment. The same profile also says financial terms were not disclosed, so the
      $1.2 billion figure should not be treated automatically as enterprise value,
      post-money valuation, or cash proceeds. Public evidence does not establish voting
      rights, sponsor ownership percentages, management rollover, or a complete current
      board roster, leaving material governance and key-person diligence open.
    claimRefs: [CO004, CO005, CO009, CO011]
    tableRefs: [TO002, TO003]
  - id: scale-and-commercial-footprint
    title: Scale and commercial footprint
    body: >-
      The strongest current scale disclosure is company-issued: Exiger reported more than
      550 global customers in both March and September 2026 and identified 150 Fortune 500
      customers. Its government disclosure changed from more than 60 government and
      Defense Industrial Base organizations in March to more than 80 government and
      defense industrial organizations in September; the later figure is used here
      without assuming that the definitions are identical. An AWS seller profile repeats
      the earlier 550-plus, 150, and 60-plus figures, but it is a supplier listing rather
      than independent verification. AHA's selection of Exiger as a preferred
      cybersecurity provider in 2024 offers partner validation of sector relevance, not
      quantified commercial performance. Revenue, ARR, margins, retention, customer
      concentration, and current headcount remain unverified.
    claimRefs: [CO007, CO008, CO015]
  - id: milestones-and-underwriting-implications
    title: Milestones and underwriting implications
    body: >-
      Exiger's public arc runs from a 2013 founding and an $80 million 2018 growth round
      through product expansion, acquisitions, sponsor investment, and a 2026 AI
      replatform. The milestone sequence shows sustained investment in data and product
      breadth, including Supply Chain Explorer, four named acquisitions from 2023 through
      2024, an AHA channel credential, AWS Marketplace distribution, and the 1Exiger
      transformation. It does not establish financial durability. Simplify's editorial
      commentary flags bundled competition from SAP Ariba and Oracle, replatform execution
      risk, and possible pricing pressure from specialist competitors. Those observations
      are directional rather than benchmarked, but they sharpen the core diligence test:
      confirm that product breadth converts into renewal quality and pricing power before
      relying on the reported transaction scale or management's development-efficiency
      claims.
    claimRefs: [CO002, CO009, CO010, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
