        - 客户广度和产品差异化持续，但财务披露和交易条款仍然有限。
        - 没有数值区间；只有在标准化收入质量和资本结构后，才可拒绝认可价格并进行基准比较。
        - 与指定公开证据最一致。
        - 融资或优先权条款将不成比例的下行风险转移给新资本。
      - - 悲观
        - AI 重构交付不及预期，套件厂商捆绑竞争功能，专业厂商压低定价，或政府需求走弱。
        - 倍数压缩和融资悬垂均有可能，但仅凭公开证据无法计算下行价值。
        - 重要风险信号，不是预测概率。
        - 留存疲弱、利润率压缩、客户集中度高或下轮融资。
    notes: 情景均为条件性判断，且有意不填入虚构概率、目标回报和估值区间；所引用的 2.2x-10.0x 收入倍数是异质的参考点， 并非直接套用的倍数。
    claimRefs:
      - CV004
      - CV007
      - CV008
      - CV009
      - CV010
      - CV013
      - CV015
      - CV016
