              - CR015
          - type: callout
            title: 论点破坏测试
            body: 若独立审查发现重大授权缺口、反复出现严重发布失败、数据权利薄弱，或客户、渠道和政府集中度超过投资人批准的上限，应暂停或重新定价。
            calloutType: recommendation
