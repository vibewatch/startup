  - id: FM001
    title: 受证据约束的市场触达层级
    type: pyramid
    summary: 六个不可相加的视角，从广义 agentic-SCM 预测逐步收窄到 Exiger 已披露的触达范围和渠道，但不呈现缺乏支持的 TAM/SAM/SOM。
    data:
      items:
        - label: Agentic-AI SCM 支出代理指标
          value: $53B in 2030
          detail: Gartner 预测，由 TechEdgeAI 报道；这是品类支出，不是 Exiger 的 TAM。
        - label: 企业采用代理指标
          value: 60% in 2030
          detail: 使用带 agentic 功能 SCM 软件的企业预测占比。
        - label: 医疗协会触达
          value: Nearly 5,000 represented entities
          detail: AHA 会员 / 触达代理指标；不是合格买家或合同。
        - label: Exiger 全球客户基础
          value: 550+
          detail: 公司报告的当前客户数。
        - label: Fortune 500 客户触达
          value: '150'
          detail: 公司报告的子集；渗透率分母为 500 家公司。
        - label: 政府与国防触达
          value: 60+ in March; 80+ in September 2026
          detail: 公司公告使用了不同描述，因此不推断增长率。
    approximationNotes: 各层使用不同单位、群体和发布者，既不可相加，也不是转化漏斗；它们只展示证据范围，不暗示嵌套关系、市场份额或估值倍数。
    claimRefs:
      - CM004
      - CM005
      - CM011
      - CM012
      - CM016
  - id: FP001
    title: Exiger 按广度与验证程度划分的差异化向量
    type: quadrant
    summary: 序数 x 轴按范围广度从 1（窄）到 5（广）评分；序数 y 轴按外部验证从 1（仅公司主张）到 5（有记录的采购或机构路径）评分。
    data:
      points:
        - label: 专有产品感知数据
          x: 5
          'y': 2
          detail: 声称的数据覆盖面广；指定材料中的验证来自公司。
        - label: 政府范围 GSA 合同
          x: 4
          'y': 5
          detail: SCRM / TPRM 范围广，并有记录在案的采购授标。
        - label: FedRAMP 与控制态势
          x: 3
          'y': 3
          detail: 重要的受监管市场主张，但资质由 Exiger 自行描述。
        - label: AWS Marketplace 路径
          x: 3
          'y': 4
          detail: 在线市场列表从外部确认了该分销路径。
        - label: XSB 数据扩展
          x: 4
          'y': 2
          detail: 收购扩大了零部件和物流覆盖；表现尚未基准化。
        - label: AI 原生开发流程
          x: 4
          'y': 1
          detail: 潜在迭代优势建立在未经验证的公司主张上。
    approximationNotes: 坐标是分析师编制的序数证据评分，不是市场份额、产品质量或胜率测量。它们仅对有记录的 Exiger 差异化向量的广度和外部验证进行排序； 指定来源中没有具备可比坐标的竞争对手。
    claimRefs:
