              重新平台化提供资金。这些事实说明资本被战略性部署，不说明当前可用现金规模，也不说明早期融资中一级与二级资金的构成。保留证据没有当前现金余额、烧钱速度、现金跑道、债务表、契约包、收购对价或下一轮触发条件。因此财务质量喜忧参半：订阅定位、较大的客户基数、可扩展的
