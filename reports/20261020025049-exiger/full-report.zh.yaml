      - number: '7.4'
        title: 依赖、经济性与论点破坏点
        blocks:
          - type: paragraph
            body: >-
              Exiger 2026 年 3 月推出 AWS Marketplace 可缩短采购流程，但也增加了一个渠道依赖，其收入贡献、商业条款和应急安排未披露。公司还称每年将超过 30%
              的收入再投资于专有、理解产品的数据；这或许能维持差异化，但它是投资强度指标，不是利润率、烧钱、现金跑道或数据投入回报的证据。公司公告称客户超过 550
              家，但指定证据没有披露留存、分部收入组合、大客户集中度或政府预算暴露。论点破坏触发条件应包括独立控制验证失败、严重发布缺陷持续、重大数据权利挑战、关键授权丧失，或客户与渠道集中度超过投资人的投资评估上限。
            claimRefs:
              - CR010
              - CR011
              - CR013
              - CR014
              - CR015
