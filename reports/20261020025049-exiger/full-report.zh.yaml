      - CP004
      - CP006
      - CP007
      - CP009
      - CP012
      - CP015
  - id: FI001
    title: 受证据约束的收入模型桥接
    type: flow
    summary: 从企业需求到收入和毛利的概念性桥接；未披露的经济性被明确标为缺口。
    data:
      nodes:
        - id: demand
          label: 企业与政府风险工作流
          detail: 第三方、供应链、采购、贸易和软件安全用例
        - id: contract
          label: 平台或模块合同
          detail: 直接企业协议、独立产品或试用转化；定价未披露
        - id: channel
          label: 直接采购或 AWS Marketplace 采购
          detail: 市场降低采购摩擦，但费用和折扣未披露
        - id: deployment
          label: 数据接入与集成
          detail: 实施人力和系统集成支持部署
        - id: recurring-value
          label: 监控、情报与工作流使用
          detail: 持续的平台价值取决于专有数据和持续的产品投入
        - id: financial-output
          label: 收入与毛利
          detail: ARR、收入组合、毛利率、留存和现金转化均未公开披露
      edges:
        - from: demand
          to: contract
        - from: contract
          to: channel
        - from: channel
          to: deployment
        - from: deployment
          to: recurring-value
        - from: recurring-value
          to: financial-output
    approximationNotes: 仅为概念性顺序；节点顺序不代表转化率、价值比例、合同时间或利润率。
    claimRefs:
      - CI001
      - CI003
      - CI005
      - CI011
      - CI013
      - CI015
  - id: FE001
    title: 从决策到行动的产品架构
    type: stack
    summary: 产品的主张价值取决于保持从客户数据、关系上下文到受治理执行的可追溯性。
    data:
      layers:
        - label: 客户系统
          detail: ERP、PLM、S2P、数据湖、技术数据包、文档和调查提供组织特定的上下文。
          items:
            - ERP 和 S2P
            - PLM 和技术数据
            - 数据湖和文档
        - label: 接入与验证
          detail: API、原生集成、ETL、接入、审计和验证为使用客户数据做准备。
          items:
            - 开放 API
            - 原生集成
            - AI 驱动的 ETL
            - 数据验证
        - label: 供应链知识图谱
          detail: 专有记录和属性连接零部件、材料、规格、供应商和风险信号。
          items:
            - 零部件属性
            - 供应商关系
            - 外部风险信号
        - label: 实体与影响上下文
          detail: 本体关联法人实体、所有权、设施、装运、零部件、产品和项目。
          items:
            - 实体解析
            - 次级供应商映射
            - 项目暴露
        - label: 受治理的 AI 工作
          detail: 代理在配置好的角色、权限和人工复核节点内调查、监控、评估并分派工作。
          items:
            - 调查
            - 监控
            - 评估
            - 人工复核
        - label: 运营行动
          detail: 输出回到采购、合规、工程和控制塔工作流，用于缓解风险和报告。
          items:
            - 采购行动
            - 合规工作流
            - 缓解跟踪
            - 报告
    approximationNotes: 根据公开描述组装的概念性技术栈；层级顺序展示工作流依赖，不代表测得的延迟、规模或系统边界。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE011
      - CE012
  - id: FU001
    title: 客户采用入口与扩张循环
    type: journey-map
    summary: Exiger 可以从单一风险工作流切入，嵌入企业系统，再通过采购渠道和相邻运营网络用例扩大范围。
    data:
      nodes:
        - id: identify
          label: 识别暴露
          detail: 检测第三方、供应商、贸易或零部件层面的风险信号。
          touchpoints:
            - Risk and compliance team
            - Supply-chain team
        - id: assess
          label: 评估与映射
          detail: 将信号关联到实体、所有权、设施、装运、零部件和项目。
          touchpoints:
            - 1EXIGER.AI
            - Due-diligence workflow
        - id: act
          label: 分派行动
          detail: 通过受治理的工作流发送评估、监控事件和缓解任务。
          touchpoints:
            - Procurement
            - Compliance
            - Program operations
        - id: embed
          label: 嵌入系统
          detail: 将风险上下文连接到 ERP、PLM、源到付和数据环境。
          touchpoints:
            - Open APIs
            - Native integrations
        - id: procure
          label: 拓宽采购
          detail: 通过 Carahsoft 触达政府客户，或通过 AWS Marketplace 进行云采购。
          touchpoints:
            - Carahsoft
            - AWS Marketplace
        - id: expand
          label: 扩展用例
          detail: 从监控扩展到产能、替代采购、贸易和 IT 供应链工作流。
          touchpoints:
            - Co-development
            - Adjacent modules
    approximationNotes: 该顺序是对已披露产品和渠道入口的分析性综合；不是实测转化漏斗，也不暗示已观察到的扩张率。
    claimRefs:
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 定性的剩余风险排序，将有证据支持的缓解主张与公开可能性或财务暴露仍未知的领域区分开来。
    data:
      columns:
        - 可能性
        - 影响
        - 缓解成熟度
        - 剩余风险
      rows:
        - label: AI 重构与发布质量
          values:
            - 高
            - 高
            - 发展中
            - 高
        - label: 监管与法律状态
          values:
            - Unknown
            - 高
            - 未验证
            - 高不确定性
        - label: 安全与 AI 治理
          values:
            - 中
            - 高
            - 公司自述
            - 中高
        - label: 实施与集成
          values:
            - 高
            - 高
            - 规模化中
            - 高
        - label: AWS 渠道依赖
          values:
            - 中
            - 中高
            - 已建立关系
            - 中
        - label: 财务与客户集中度
          values:
            - Unknown
            - 高
            - 未披露
            - 高不确定性
    approximationNotes: 基于所引证据由分析师创建的序数分类；它们不是经过测量的概率、事故率或损失估计。
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR005
      - CR007
      - CR008
      - CR011
      - CR013
      - CR015
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 运营层面的证据收窄了尽调判断范围，但财务与交易透明度不足，使证据链在形成经价格批准的建议前就中断。
    data:
      nodes:
        - id: product-scale
          label: 产品与数据规模
          detail: 广泛覆盖供应链工作流，加上关于专有数据的公司自述，为尽调提供了可信的起点。
        - id: customer-proof
          label: 客户与渠道证据
          detail: 公司自报的 550+ 家客户和 AWS Marketplace 上架情况说明了触达范围，但不能说明留存经济性。
        - id: growth-signal
          label: 增长信号
          detail: 公司自报核心市场增长 50%，信号积极，但缺少已披露的财务分母。
        - id: financial-gap
          label: 财务透明度不足
          detail: 当前 ARR、收入质量、利润率、留存、现金消耗和净债务，均未在指定证据中提供。
        - id: risk-adjustment
          label: 竞争与执行风险
          detail: 打包销售、专业化定价和平台迁移执行，都可能削弱产品动能的价值。
        - id: decision
          label: 继续研究
          detail: 在运营指标与企业价值到股权价值的桥接关系核对一致前，不应批准价格。
    approximationNotes: 仅表示有序的定性逻辑；节点顺序不代表概率、规模或定量转化率。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV013
      - CV015
      - CV016
