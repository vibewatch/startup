  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算视角
        blocks:
          - type: paragraph
            body: >-
              Exiger
              的核心边界比整个供应链软件市场更窄，聚焦第三方和供应商风险、次级供应商映射、零部件与材料、采购、合规和韧性相关的情报与流程。公司也触及贸易、准备度、网络供应链和产品生命周期等相邻流程；ERP、PLM、source-to-pay
              系统、通用云基础设施及内部分析流程则是互补或替代方案，不应自动计入支出。TechEdgeAI 报道 Gartner 预测，代理式 AI 赋能的供应链管理软件规模将从 2025 年不足 20 亿美元增至 2030
              年 530 亿美元，但这只是品类代理指标，并非 Exiger 的 TAM。没有来源单独测算 Exiger 的可服务份额、可获取份额、定价或市场份额。
