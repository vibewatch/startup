              - CV015
              - CV016
      - number: '8.2'
        title: 融资与可比背景
        blocks:
          - type: paragraph
            body: >-
              第三方数据库对融资历史的记录彼此矛盾。Tracxn 报告三轮融资共 8000 万美元，并列出 2024 年 4 月一轮金额未披露的常规债务融资；Multiples 则称一次收购前融资共 8000
              万美元。该冲突阻碍了对投入资本、未偿债务或稀释情况的可靠重建。Multiples 还展示了异质的比较集：Clarivate 和 SMS 的收入倍数为 2.2 倍和 3.2 倍，私营公司 EcoVadis 和
              Pigment 的指标为 8.7 倍和 10.0 倍。这些是背景参照，不是 Exiger 的定价公式；各公司的产品组合、盈利能力、增长、流动性和报告基础不同，而指定证据没有披露 Exiger 当前收入。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV014
              - CV016
      - number: '8.3'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点是：专有供应链数据、受监管市场部署、客户广度和更快的 AI 产品交付，可以支撑持久的工作流控制权。Exiger 称每年将超过 30% 的收入再投资于专有数据，降低了 AI 重新平台化的预计成本和周期，并在
              2026 年实现核心市场增长 50%。反论点同样重要：这些都是公司主张，没有披露队列留存、单位经济性或经审计的分部结果。Simplify 的批评性评论指出 SAP Ariba 和 Oracle
              的供应商风险功能捆绑、面向政府买方的重新平台化执行风险，以及专业厂商的定价压力。只有客户级留存、利润率和竞争胜出证据将这些主张转化为可量化的现金流持久性后，溢价进入才有依据。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.4'
        title: 情景、退出准备度与尽调门槛
        blocks:
          - type: paragraph
            body: >-
              在 Exiger 提供当前运营和资本数据之前，情景分析必须保持定性。乐观情景要求独立核对的 ARR 增长、强劲的毛收入留存、可扩展利润率，并证明 AI
              驱动的产品速度扩大了付费使用，而不只是增加功能产出。基准情景接受产品和客户证据，但不支持价格判断，因为无法计算当前收入倍数。悲观情景包括重新平台化失败、套件式竞争、续约经济性疲弱和融资悬置；没有净债务和优先权条款，无法量化下行空间。指定证据池没有支持目标回报、持有期、IPO
              时间窗口或并购退出价值的证据。最终批准应要求经审计财务、ARR 和留存队列、客户集中度、销售漏斗转化、股权结构表、债务表、清算优先权，以及管理层将披露的 12 亿美元背景桥接到完全摊薄股权价值的说明。
            claimRefs:
              - CV004
