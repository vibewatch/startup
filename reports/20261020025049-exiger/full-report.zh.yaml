      - number: '3.2'
        title: 能力广度、专有数据与信任姿态
        blocks:
          - type: paragraph
            body: >-
              有记录支持的最强差异化来自工作流广度与理解产品的数据结合。Exiger 称其工程知识图谱覆盖 10b（100 亿）条供应链记录、400m（4 亿）个零部件属性和 6.5m（650 万）个映射关系，遍及 200
              多个国家。公司还称平台将供应商和软件物料清单连接到风险信号，并通过 API 和企业系统集成暴露行动。2024 XSB
              后，独立的零部件和物流数据集被纳入公司内部，进一步强化了数据资产战略，而非纯应用层战略。信任与采购姿态构成另一条竞争轴线：Exiger 报告获得 FedRAMP Moderate 授权及其他控制认证；政府级
              GSA 合同和 2026 年 P1 Marketplace 资质则提供进入受监管买方的路径。保留来源没有说明竞争对手在相同标准上的表现，因此未知单元格有意保持未知。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP007
              - CP011
              - CP012
