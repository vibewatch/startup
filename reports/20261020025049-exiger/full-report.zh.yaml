      - number: '1.3'
        title: 规模与商业覆盖
        blocks:
          - type: paragraph
            body: >-
              当前最强的规模披露来自公司：Exiger 在 2026 年 3 月和 9 月均披露全球客户超过 550 家，并称其中 150 家为《财富》500 强客户。政府披露从 3 月的超过 60
              家政府及国防工业基础组织，变为 9 月的超过 80 家政府及国防工业组织；本文使用后一个数字，但不假定两者定义完全相同。AWS 卖家资料重复了此前的 550+、150 和
              60+，但它只是供应商列表，不是独立核验。AHA 在 2024 年选 Exiger 为首选网络安全供应商，可验证其行业相关性，但不能量化商业表现。收入、ARR、利润率、留存、客户集中度和当前员工数仍未验证。
            claimRefs:
              - CO007
              - CO008
              - CO015
      - number: '1.4'
        title: 里程碑与投资判断含义
        blocks:
          - type: paragraph
            body: >-
              Exiger 的公开发展轨迹从 2013 年成立和 2018 年 8000 万美元成长轮，延伸至产品扩张、收购、赞助方投资和 2026 年 AI 重新平台化。里程碑显示公司持续投入数据和产品广度，包括
              Supply Chain Explorer、2023 至 2024 年间四项已命名收购、AHA 渠道资质、AWS Marketplace 分发和 1Exiger 转型，但不能证明财务韧性。Simplify
              的编辑评论指出 SAP Ariba 和 Oracle
              的套件式竞争、重新平台化执行风险以及专业型竞争者可能带来的定价压力。这些观察是方向性的，未经基准量化，却强化了核心尽调问题：在依赖披露的交易规模或管理层开发效率主张之前，先确认产品广度能否转化为续约质量和定价能力。
