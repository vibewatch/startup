      - number: '1.2'
        title: 所有权、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Exiger 2026 年 9 月公告仍将 Brandon Daniels 列为首席执行官。公告还显示董事会由赞助方主导：Carlyle 合伙人 Steve Bailey 任主席，Insight Partners
              董事总经理 Ryan Hinkle、JMI Equity 合伙人 Bob Nye 以及 Carlyle 合伙人 Dayne Baird 任董事。Exiger 将 2023 年事件描述为由
              Carlyle、Insight 和 JMI 主导的 12 亿美元投资，而独立交易资料称其为 Carlyle 收购或控股投资。该资料同时指出财务条款未披露，因此不应自动把 12
              亿美元视为企业价值、投后估值或现金所得。公开证据无法确定投票权、赞助方持股比例、管理层滚存持股或完整的现任董事会名单，重要治理和关键人物尽调仍未完成。
