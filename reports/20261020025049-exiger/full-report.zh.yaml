chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Exiger 将自身定位为用于映射和管理实体及软件供应链风险的 AI 平台，把供应商、产品、零部件、组件和风险数据放进同一运营环境。独立资料将公司成立时间追溯至 2013
              年，并将总部列为纽约市，但指定的官方页面没有说明当前法定总部。其商业模式被描述为订阅软件，产品覆盖供应链情报、第三方筛查、合规和采购流程。自 2026 年 3 月通过 AWS Marketplace
              提供服务可降低采购摩擦，但这只是分销证据，不代表客户采用或收入。2026 年 9 月发布 1Exiger 是一次重大平台变更；管理层称开发已转向 AI
              原生生命周期，但围绕重新平台化的经济性和质量主张仍来自公司，需客户或技术验证。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO006
              - CO014
