      - number: '3.3'
        title: 分发能力、采购路径与定价不透明
        blocks:
          - type: paragraph
            body: >-
              分发似乎是 Exiger 竞争策略的一部分。2022 年宣布的多年期 GSA 奖项披露合同总额 7450 万美元；2026 年 AWS Marketplace
              上线则被定位为缩短采购流程，并把购买嵌入现有云账户。P1 Marketplace 的 Awardable
              状态又提供一条政府采购路径。这些渠道可降低购买摩擦，使联邦或高度受监管场景中的功能相近新进入者更难采用，但不能说明单位定价、实际折扣、合同最低额、实施收费或续约条款。指定来源也没有提供知名替代方案的可比定价。因此定价表区分了已披露的采购机制和未披露的经济性；7450
              万美元是合同价值，不是 ARR 或标价。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP014
              - CP015
      - number: '3.4'
        title: 壁垒持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Exiger 的可防御性似乎来自专有数据、受监管部署资质、嵌入式集成、收购扩展的覆盖面和采购渠道的共同作用，而非某一项功能。公司称每年将超过 30% 的收入再投入专有数据，并称 AI 在开发流程中编写了 95%
              的第一代代码；两项主张都可能支持更快迭代，但本文未独立核验。广度也带来风险：企业套件可以捆绑相邻模块，客户可围绕自有数据搭建内部分析，生成式 AI
              工具可能降低应用开发门槛。指定的不利搜索没有返回保留结果。Simplify
              提到套件捆绑和专业厂商压力，但证据池仍没有独立产品基准、输赢研究、流失证据或竞争对手路线图。这个缺口不代表替代风险低，只说明没有直接客户推荐和并列竞争证据，就无法评估壁垒持久性。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP013
              - CP015
              - CP016
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 信任与分发强化产品广度
            body: 联邦采购路径、AWS Marketplace 可用性和受监管部署主张，可降低那些同时看重访问和保障、而不只看功能的买方群体的采用摩擦。
            calloutType: strength
