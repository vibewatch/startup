      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 证据质量约束
            body: 公开材料确立了公司所称的控制和战略意图，但没有损失历史、控制有效性、集中度或财务韧性；投资评估应以取得主要尽调材料为前提。
            calloutType: risk
            claimRefs:
              - CR001
