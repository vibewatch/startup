      - number: '2.2'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              证据显示存在多个购买中心，而不是单一同质客户。联邦和国防项目看重授权、任务保障、控制塔运营以及零部件和供应商可见性；大型企业和制造商购买韧性、采购效率和供应商情报；医疗机构还会关注网络和医疗器械供应链风险。风险、采购、供应链、合规、安全和项目负责人都可能发起或使用平台，最终由企业或机构预算付款。AWS
              Marketplace 与美国医院协会关系可降低发现或采购摩擦，但都不能证明转化经济性。Exiger 声称拥有超过 550 家客户和 150 家《财富》500 强客户，说明触达面，而非渗透率或留存。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.3'
        title: 增长驱动与采用时点
        blocks:
          - type: paragraph
            body: >-
              监管、地缘政治波动、次级供应商不透明、制裁与贸易管制、软件物料清单以及自动化采购压力，都在推高对持续更新风险情报的需求。如果代理式 AI
              能把信号转成受治理的行动，而不只是再增加一个仪表盘，就可能扩大软件预算。TechEdgeAI 报道 Gartner 预计，企业在供应链软件中使用代理功能的比例将从 2025 年的 5% 升至 2030 年的
              60%；2025 年有 72% 的供应链组织在部署生成式 AI，但只有 23% 制定了正式 AI 战略。这些数字表明试验活跃，落地周期却很长。Exiger
              的数据资产和再投资主张或许有助于差异化，但仍是公司主张，不是独立证明。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM015
      - number: '2.4'
        title: 采用约束与估值含义
        blocks:
          - type: paragraph
            body: >-
              采用受到采购数据碎片化、集成困难、权限、可审计性、网络安全、人类监督以及将发现转化为可跟踪缓解措施所需运营投入的约束。一份公司发布的岗位转发要求大规模上线、集成、持续控制塔分析、行动管理和联邦利益相关方协调，说明实施能力仍是解决方案的一部分。TechEdgeAI
              报道，受访组织中只有 19% 已将供应链 AI 规模化部署，四分之三仍在规划、设计或试点。对估值而言，品类预测远远不够：仍需核实合同金额、预算来源、销售周期、部署成本、留存、可量化
              ROI、定价、市场份额和可服务市场口径。
            claimRefs:
              - CM007
              - CM013
              - CM014
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 品类增长不等于公司市场规模
            body: 530 亿美元预测针对的是广义的代理式 AI 供应链管理软件。若没有定价、分部收入、合同金额、市场份额或可服务市场方法论，直接套用于 Exiger 会夸大证据。
            calloutType: risk
            claimRefs:
              - CM004
              - CM016
          - type: callout
            title: 实施能力是采用方程的一部分
            body: Exiger 自身岗位要求强调上线、集成、持续分析、行动跟踪和联邦协调。更快的 AI 产品交付并不能消除客户数据、治理和变更管理工作。
            calloutType: insight
            claimRefs:
              - CM013
              - CM014
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争边界与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              Exiger 竞争的是一项广泛的工作，而非单一软件品类：第三方尽调、多层级供应链映射、零部件与材料情报、贸易执法、软件供应链暴露、采购及合规流程。因此相关替代方案不局限于 SCRM 或 TPRM
              专业厂商。买方也可能考虑成熟的 GRC 或 TPRM 套件、能够捆绑相邻流程的 ERP 和采购平台、内部数据分析建设，以及人工或咨询驱动的流程。Simplify 将 SAP
              Ariba、Oracle、Resilinc 和 Prewave 列为潜在竞争压力来源；Multiples
              则提供异质的可比公司列表和部分财务指标。两者都没有提供对称的产品、客户、输赢或定价证据。因此，画像表映射的是决策类别，而不是假装存在完整的逐家公司比较。Exiger
              自身的规模主张是有意义的需求信号，但来自公司，不应视为独立测量的市场份额领先。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP015
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
