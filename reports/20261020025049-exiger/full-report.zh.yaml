  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与决策姿态
        blocks:
          - type: paragraph
            body: >-
              可投资结论是继续研究，而不是买入或回避。Exiger 有广泛平台、超过 550 家客户、AWS Marketplace 分发以及公司披露的 2026 年核心市场增长 50%
              等证据。这些信号支持继续尽调，但没有提供估值所需的财务分母。公开记录对 2023 年事件的说法不一，有时称其为 12 亿美元收购，有时称投资；另一个来源还称交易财务条款未披露。在没有当前
              ARR、收入质量、毛利率、留存、净债务、现金消耗或优先权条款的情况下，不应把该数字视为已验证的当前股权价值。因此，批准价格前必须取得从企业价值到完全摊薄股权价值的数据室桥接表。
            claimRefs:
              - CV001
