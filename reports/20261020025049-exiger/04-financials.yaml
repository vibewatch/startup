schemaVersion: "report-v2"
artifact: financials
slug: exiger
runDate: 2026-10-20
company:
  name: Exiger
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a subscription-oriented SaaS and technology-enabled
    services model, with AWS Marketplace adding a lower-friction procurement
    channel and Exiger reporting material reinvestment in proprietary data and
    product development. Underwriting remains constrained because current ARR,
    revenue, gross margin, retention, cash, burn, runway, and debt are not
    disclosed in the retained evidence.
sections:
  - id: revenue-architecture
    title: Revenue architecture and pricing visibility
    body: >-
      Exiger describes its model as a combination of SaaS and technology-enabled
      solutions, while an independent company-data provider labels the revenue
      model subscription. The platform spans third-party screening, supply-chain
      mapping, procurement, trade enforcement, and software-supply-chain
      security, so the likely commercial architecture is an enterprise platform
      contract with modules, proprietary data, and implementation work rather
      than a single self-serve SKU. A 2022 launch offered Supply Chain Explorer
      as a standalone product and promoted early-access trial licenses. The 2026
      AWS Marketplace launch creates an additional purchase and deployment
      route, but none of the retained sources provides list prices, realized
      contract values, discounts, revenue mix, or revenue-recognition terms.
      Marketplace availability therefore indicates distribution optionality,
      not a quantified improvement in revenue or sales efficiency.
    claimRefs: [CI001, CI002, CI003, CI004, CI010, CI011]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-gtm
    title: Traction and go-to-market signals
    body: >-
      Exiger's September 2026 investor-backed release claimed 550-plus global
      customers, including 150 Fortune 500 companies and more than 80 government
      and defense-industrial organizations, and cited 50% core-market growth
      during 2026. These are useful indicators of enterprise reach but remain
      company-issued claims rather than audited revenue evidence. The earlier
      2022 release reported software-license revenue compound annual growth above
      100% over the preceding four years; it is historical and cannot establish
      the current growth rate. AWS Marketplace may shorten procurement for some
      buyers, while the stated multi-year AWS relationship and planned global
      AWS practice suggest a channel-led expansion effort. No public sales-cycle,
      pipeline-conversion, CAC, quota-productivity, or partner-economics data was
      retained, so sales efficiency cannot be underwritten from these signals.
    claimRefs: [CI003, CI004, CI007, CI008, CI009, CI015]
  - id: cost-and-unit-economics
    title: Cost structure and unit-economics boundary
    body: >-
      The clearest public cost signal is Exiger's statement that more than 30%
      of annual revenue is reinvested to generate proprietary, product-aware
      data. The company also said an AI replatform compressed an internally
      estimated three-year, $180 million upgrade into a four-month, $20 million
      sprint. These figures indicate substantial data and product-development
      intensity, but they do not disclose accounting R&D expense, cash paid, or
      recurring savings. A current implementation role describes data onboarding,
      integration, analytics, engineering, data-science, and government-program
      coordination, showing that service delivery requires skilled labor in
      addition to software infrastructure. Customer savings claims demonstrate
      potential willingness-to-pay value, not Exiger revenue or gross profit.
      Gross margin, hosting cost, implementation margin, CAC, payback, NRR, and
      concentration remain unavailable.
    claimRefs: [CI005, CI006, CI012, CI013, CI015]
    tableRefs: [TI003]
  - id: capital-adequacy-verdict
    title: Capital adequacy and financial verdict
    body: >-
      Exiger's public narrative shows continued investment: the company says it
      completed three acquisitions after the 2023 sponsor transaction, expanded
      proprietary data assets, and funded a broad AI-led replatform. Those facts
      establish strategic capital deployment, not the amount of cash currently
      available or the primary-versus-secondary composition of earlier financing.
      The retained evidence provides no current cash balance, burn rate, runway,
      debt schedule, covenant package, acquisition consideration, or next-round
      trigger. Financial quality is therefore mixed: subscription positioning,
      a large claimed customer base, a scalable marketplace channel, and visible
      customer-value cases are positives, while opaque pricing, service intensity,
      aggressive data reinvestment, and independently flagged bundling pressure
      leave revenue durability and margin conversion unproven. Investment
      committee underwriting should require a current quality-of-revenue bridge,
      cohort retention, gross-margin decomposition, and a 24-month liquidity plan.
    claimRefs: [CI005, CI006, CI008, CI014, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams and monetization mechanisms
    columns:
      - Stream
      - Mechanism
      - Commercial unit
      - Public status
      - Revenue-quality assessment
      - Diligence ask
    rows:
      - [Enterprise platform subscription, "Recurring access to 1Exiger capabilities", "Enterprise contract; exact unit undisclosed", "Subscription model reported by Multiples and SaaS positioning stated by Exiger", "Potentially recurring, but ARR and retention are undisclosed", "Provide ARR by product, renewal cohort, and contract duration"]
      - [Standalone product or module, "Supply Chain Explorer was offered as a standalone product", "License or subscription; exact basis undisclosed", "Early-access trial licenses announced in 2022", "Potential land motion, with conversion and pricing unknown", "Provide trial-to-paid conversion and module attach rates"]
      - [AWS Marketplace channel, "Discover, test, buy, deploy, and manage 1Exiger through AWS Marketplace", "Marketplace contract; price and fee basis undisclosed", "Generally available in March 2026", "Could reduce procurement friction; channel take-rate and incremental revenue unknown", "Provide bookings, discounts, AWS fees, and channel-sourced pipeline"]
      - [Technology-enabled implementation, "Data onboarding, integrations, analytics workflows, and program operations", "Project, services, or bundled work; exact basis undisclosed", "Operational staffing requirements are publicly visible", "May support deployment but can dilute software gross margin", "Separate services revenue, utilization, backlog, and services gross margin"]
      - [Proprietary data and multi-module intelligence, "Data and workflow capabilities embedded across risk, procurement, trade, and software security", "Separate data fee or bundled entitlement not disclosed", "Exiger says more than 30% of revenue is reinvested in proprietary data", "Differentiating input with potentially high recurring cost", "Disclose data monetization, third-party data expense, and module-level contribution"]
    notes: "Sources describe mechanisms and company positioning; no retained source discloses realized pricing, revenue mix, contract value, or recognition policy."
    claimRefs: [CI001, CI002, CI003, CI005, CI010, CI011, CI013]
  - id: TI002
    title: Pricing and packaging evidence
    columns:
      - Offer or route
      - Public price
      - Contract or unit
      - Discount or realization evidence
      - Underwriting implication
    rows:
      - [1Exiger direct enterprise sale, "Not disclosed", "Enterprise platform agreement inferred; term undisclosed", "No list-to-realized bridge", "Cannot estimate ACV, expansion, or price realization"]
      - [AWS Marketplace, "Not disclosed", "Marketplace purchase and management route", "No private-offer discount or marketplace fee disclosed", "Channel accessibility is verified; economics are not"]
      - [Supply Chain Explorer standalone, "Not disclosed", "Standalone license or subscription", "Early-access trial availability disclosed in 2022", "Trial structure does not establish paid conversion or current packaging"]
      - [Implementation and integration, "Not disclosed", "Project, service, or bundled deployment work", "No rate card, utilization, or attach rate disclosed", "Services intensity may affect CAC, deployment cost, and gross margin"]
    notes: "All amounts are unavailable in the retained public evidence; 'Not disclosed' is a gap, not a zero value or estimate."
    claimRefs: [CI002, CI003, CI004, CI013, CI015]
  - id: TI003
    title: Unit economics and capital-efficiency evidence
    columns:
      - Metric
      - Public value or status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Current ARR and revenue growth, "Not disclosed; 50% core-market growth is company-claimed and not defined as revenue or ARR", Low, "Sets scale and growth quality", "Reconcile GAAP revenue, ARR, bookings, and constant-currency growth"]
      - [Gross margin and services mix, "Not disclosed", Low, "Tests software scalability and implementation drag", "Provide product, data, cloud, and services gross-margin bridge"]
      - [CAC and payback, "Not disclosed", Low, "Tests efficiency of enterprise and channel acquisition", "Provide CAC by segment, sales cycle, win rate, and payback"]
      - [Retention and expansion, "Not disclosed", Low, "Tests recurring revenue durability", "Provide GRR, NRR, logo churn, and cohort expansion"]
      - [Data reinvestment, "More than 30% of annual revenue, company-claimed", Medium, "Signals both differentiation and a recurring cost burden", "Reconcile the percentage to accounting R&D, data COGS, and capitalized development"]
      - [AI replatform investment, "$20M four-month sprint versus an internally estimated $180M three-year upgrade, company-claimed", Medium, "Shows development intensity and claimed efficiency", "Provide actual cash spend, capitalization policy, realized savings, and ongoing run-rate cost"]
      - [Customer value signal, "$100M saved across metal purchases, company-claimed customer outcome", Low, "May support willingness to pay but is not Exiger revenue", "Validate customer attribution, baseline, period, and Exiger fee capture"]
      - ["Cash, burn, runway, and debt obligations", "Not disclosed", Low, "Determines financing dependency and downside resilience", "Provide cash balance, monthly burn, debt schedule, covenants, and 24-month liquidity plan"]
    notes: "Company-claimed figures are preserved with their stated metric and basis; customer savings, growth, investment, revenue, ARR, accounting expense, and cash flow are not interchangeable."
    claimRefs: [CI005, CI006, CI007, CI012, CI015]
figures:
  - id: FI001
    title: Evidence-bounded revenue model bridge
    type: flow
    summary: "A conceptual bridge from enterprise demand to revenue and gross profit, with undisclosed economics shown as explicit gaps."
    data:
      nodes:
        - id: demand
          label: Enterprise and government risk workflows
          detail: "Third-party, supply-chain, procurement, trade, and software-security use cases"
        - id: contract
          label: Platform or module contract
          detail: "Direct enterprise agreement, standalone product, or trial conversion; pricing undisclosed"
        - id: channel
          label: Direct or AWS Marketplace procurement
          detail: "Marketplace lowers purchasing friction, but fees and discounts are undisclosed"
        - id: deployment
          label: Data onboarding and integration
          detail: "Implementation labor and system integration support deployment"
        - id: recurring-value
          label: Monitoring, intelligence, and workflow usage
          detail: "Recurring platform value depends on proprietary data and continued product investment"
        - id: financial-output
          label: Revenue and gross profit
          detail: "ARR, revenue mix, gross margin, retention, and cash conversion are not publicly disclosed"
      edges:
        - from: demand
          to: contract
        - from: contract
          to: channel
        - from: channel
          to: deployment
        - from: deployment
          to: recurring-value
        - from: recurring-value
          to: financial-output
    approximationNotes: "Conceptual sequence only; node order does not imply conversion rates, value proportions, contract timing, or margin."
    claimRefs: [CI001, CI003, CI005, CI011, CI013, CI015]
callouts:
  - calloutType: risk
    title: Financial disclosure is the underwriting bottleneck
    body: >-
      Public sources expose commercial mechanisms and selected operating claims,
      but not the current revenue, margin, retention, liquidity, or leverage data
      needed to convert product traction into a defensible cash-flow view.
    claimRefs: [CI015]
