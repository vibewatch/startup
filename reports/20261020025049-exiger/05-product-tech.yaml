artifact: product-tech
slug: exiger
runDate: 2026-10-20
company:
  name: Exiger
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Exiger presents 1EXIGER.AI as a unified operating layer that connects proprietary
    supply-chain intelligence, customer systems, and governed AI agents across risk,
    procurement, compliance, and resilience workflows. The disclosed architecture is
    specific enough to show a credible data-to-action model, but most maturity,
    performance, security, and scale assertions remain company-issued rather than
    independently benchmarked.
sections:
  - id: product-scope-and-modules
    title: Product scope and module map
    body: >-
      1EXIGER.AI is positioned as a workflow platform rather than a single risk-scoring
      application. Its public product surface spans third-party due diligence, continuous
      monitoring, multi-tier supplier and part mapping, capacity and alternate-source
      analysis, drawing and specification interpretation, tariff and country-of-origin
      analysis, and software-bill-of-material exposure. That breadth gives buyers a common
      operating layer for procurement, compliance, engineering, and supply-chain teams,
      but public materials do not disclose module-level adoption, packaging, release
      status, or production usage. The older Supply Chain Explorer launch establishes that
      supplier-network discovery and risk triage were commercialized by 2022, while a
      Snowflake partner listing preserves evidence of the earlier DDIQ-centered risk
      platform. The current suite therefore appears to be an expansion and consolidation
      of established capabilities, not a wholly new product, although migration depth and
      customer-by-customer module maturity remain diligence gaps.
    claimRefs: [CE001, CE002, CE008, CE014]
    tableRefs: [TE001]
  - id: architecture-and-data-model
    title: Architecture and operating model
    body: >-
      The disclosed architecture joins customer operational data with Exiger's knowledge
      graph, resolves relationships among legal entities, ownership, suppliers, facilities,
      shipments, parts, materials, and end programs, and then routes investigation or
      action through permissioned agents and workflows. Exiger says open APIs, hundreds of
      native integrations, and an AI-driven ETL layer ingest ERP, PLM, and source-to-pay
      data and return enriched context to those systems. Its claimed differentiation is
      the product-aware graph: 10 billion supply-chain records, 400 million part
      attributes, and 6.5 million mapped relationships across more than 200 countries.
      These figures describe potential data breadth, not independently measured accuracy,
      freshness, entity-resolution precision, or customer-specific coverage. The
      investment case therefore rests less on a generic agent layer than on whether this
      proprietary graph remains accurate and usable inside high-consequence workflows.
    claimRefs: [CE003, CE004, CE005, CE015]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: deployment-integration-and-support
    title: Deployment, integration, and operational use
    body: >-
      Deployment is not represented as a zero-touch SaaS activation. A current
      implementation role describes a lifecycle from contract signature through
      onboarding, documentation, training, deployment, and handoff to customer success,
      with sales, product, engineering, and support coordination. A separate federal
      operations role calls for large-scale data onboarding, validation, control-tower
      analysis, and Red Team and Blue Team workflows, indicating that complex programs
      combine software with material implementation and operating-process work. AWS
      Marketplace availability can simplify purchasing and account administration, but it
      does not remove ERP, PLM, data-lake, permission, or data-quality dependencies.
      Public evidence gives no median time-to-value, implementation staffing ratio,
      integration failure rate, support SLA, uptime history, or customer-level adoption
      curve. Those missing measures are central to judging scalability and service burden.
    claimRefs: [CE007, CE011, CE012]
    tableRefs: [TE002]
  - id: maturity-differentiation-and-trust
    title: Maturity, differentiation, and trust posture
    body: >-
      Exiger's September 2026 announcement describes a completed AI-led replatform and an
      AI product-development lifecycle intended to support continuous deployment, while
      the public workflow narrative emphasizes starting with critical suppliers and
      materials rather than attempting a complete map first. This is a coherent adoption
      model for enterprises whose source data is fragmented, but release cadence is not
      equivalent to reliability or customer value. Exiger also states that regulated
      deployments use a FedRAMP Moderate-authorized environment backed by ISO 27001 and
      SOC 2 Type II controls. The assigned evidence does not include the underlying audit
      reports, authorization package, status history, penetration-test results, or
      independently measured model performance. The only independent developer-surface
      source explicitly says its Exiger profile is an unenriched stub and is not a
      security assessment. Product diligence should therefore verify control scope,
      incident history, model governance, data lineage, and production performance
      directly rather than treating marketing certifications as complete technical proof.
    claimRefs: [CE006, CE009, CE010, CE013, CE016]
