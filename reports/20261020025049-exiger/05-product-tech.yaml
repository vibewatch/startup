      - Role
      - Key dependency
      - Principal risk
    rows:
      - ["Customer systems and evidence", "Provide ERP, PLM, S2P, data-lake, survey, and document inputs", "Data access, schema mapping, and customer data quality", "Incomplete or stale source data can propagate into decisions"]
      - ["Proprietary knowledge graph", "Connect parts, materials, specifications, suppliers, and risks", "Continuous ingestion, normalization, and entity resolution", "Scale claims do not prove accuracy or freshness"]
      - ["Relationship and ontology layer", "Link signals to ownership, facilities, shipments, products, and programs", "Correct relationship inference and customer-specific context", "Opaque lineage can make a plausible answer hard to audit"]
      - ["Agentic execution layer", "Investigate, assess, monitor, route, and initiate workflows", "Role permissions, review points, and model governance", "Automation errors may enter high-consequence procurement or compliance work"]
      - ["Integration and workflow layer", "Return context and actions to operational systems", "APIs, ETL, native connectors, and bidirectional product-lifecycle flows", "Connector maintenance and implementation services may constrain scale"]
      - ["Regulated deployment controls", "Support government and regulated workloads", "FedRAMP environment, ISO controls, SOC controls, and secure CI/CD", "Control scope and current audit evidence are not present in the assigned pool"]
    notes: "Architecture is reconstructed from Exiger's public descriptions and implementation postings; it is not a verified system diagram or security audit."
    claimRefs: [CE003, CE004, CE005, CE006, CE010]
