callouts:
  - calloutType: strength
    title: Differentiation is data-dependent
    body: >-
      The defensible asset is the claimed product-aware relationship graph and its
      integration into decisions, not the availability of generic AI agents. Diligence
      should test graph accuracy, freshness, provenance, and customer-specific coverage.
    claimRefs: [CE003, CE005]
  - calloutType: risk
    title: Public proof lags product ambition
    body: >-
      Current materials describe rapid replatforming, continuous releases, and regulated
      deployment, but the assigned pool lacks independent performance, uptime, audit, and
      developer-adoption evidence.
    claimRefs: [CE006, CE009, CE010, CE013, CE016]
