chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Exiger presents itself as an AI platform for mapping and managing physical and software supply-chain risk,
              combining supplier, product, part, component, and risk data in one operating environment. Independent
              profile sources date the company to 2013 and place its headquarters in New York City, although the
              assigned official pages do not state a current legal headquarters. The business model is described as
              subscription software, while the product spans supply-chain intelligence, third-party screening,
              compliance, and procurement workflows. Availability through AWS Marketplace since March 2026 reduces
              procurement friction but is distribution evidence, not proof of adoption or revenue. The September 2026
              1Exiger release is a major platform change that management says moved development onto an AI-native
              lifecycle; the economic and quality claims around that replatform remain company-issued and need customer
              or technical validation.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO006
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO003
              - CO007
              - CO008
              - CO009
              - CO011
      - number: '1.2'
        title: Ownership, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              Brandon Daniels remained the named chief executive in Exiger's September 2026 announcement. That release
              also identifies a sponsor-heavy board: Carlyle partner Steve Bailey as chair, Insight Partners managing
              director Ryan Hinkle, JMI Equity partner Bob Nye, and Carlyle partner Dayne Baird as directors. Exiger
              characterizes the 2023 event as a $1.2 billion investment led by Carlyle, Insight, and JMI, while an
              independent transaction profile calls it a Carlyle acquisition or majority investment. The same profile
              also says financial terms were not disclosed, so the $1.2 billion figure should not be treated
              automatically as enterprise value, post-money valuation, or cash proceeds. Public evidence does not
              establish voting rights, sponsor ownership percentages, management rollover, or a complete current board
              roster, leaving material governance and key-person diligence open.
            claimRefs:
              - CO004
              - CO005
              - CO009
              - CO011
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
              - CO009
              - CO011
