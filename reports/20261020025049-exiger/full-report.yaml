  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              Exiger describes its model as a combination of SaaS and technology-enabled solutions, while an independent
              company-data provider labels the revenue model subscription. The platform spans third-party screening,
              supply-chain mapping, procurement, trade enforcement, and software-supply-chain security, so the likely
              commercial architecture is an enterprise platform contract with modules, proprietary data, and
              implementation work rather than a single self-serve SKU. A 2022 launch offered Supply Chain Explorer as a
              standalone product and promoted early-access trial licenses. The 2026 AWS Marketplace launch creates an
              additional purchase and deployment route, but none of the retained sources provides list prices, realized
              contract values, discounts, revenue mix, or revenue-recognition terms. Marketplace availability therefore
              indicates distribution optionality, not a quantified improvement in revenue or sales efficiency.
            claimRefs:
