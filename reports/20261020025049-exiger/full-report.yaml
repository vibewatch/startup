  - id: TV001
    title: Recommendation summary
    columns:
      - Decision field
      - Current view
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - research-more
        - Product and customer signals are material, but valuation inputs are incomplete.
        - Continue diligence; do not approve an entry price.
      - - Confidence
        - medium
        - Multiple current sources support operating momentum, while core financial facts remain private.
        - Confidence can rise only after financial and customer reconciliation.
      - - Risk rating
        - high
        - Execution, bundled competition, financing structure, and disclosure gaps remain material.
        - Require downside protections and explicit kill criteria.
      - - Valuation stance
        - stretched
        - A reported $1.2B transaction or investment context lacks a disclosed current financial denominator.
        - Treat the figure as context, not a verified current equity value.
      - - Entry discipline
        - gated
        - Current ARR, margins, retention, net debt, preferences, and fully diluted ownership are unavailable.
        - Price only after an enterprise-to-equity value bridge.
    notes: >-
