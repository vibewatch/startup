  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing lenses
        blocks:
          - type: paragraph
            body: >
              Exiger's core boundary is narrower than the whole supply-chain software market: it centers on intelligence
              and workflows for third-party and supplier risk, sub-tier mapping, parts and materials, procurement,
              compliance, and resilience. The company also reaches adjacent trade, readiness, cyber-supply-chain, and
              product-lifecycle workflows, while ERP, PLM, source-to-pay systems, general-purpose cloud infrastructure,
              and internal analyst processes remain complements or substitutes rather than automatically included spend.
              TechEdgeAI reports Gartner forecasts for agentic-AI-enabled supply-chain-management software of less than
              $2 billion in 2025 and $53 billion in 2030, but this is a category proxy, not Exiger's TAM. No allocated
              source isolates Exiger's serviceable or obtainable share, pricing, or market share.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM009
