            tableRef: TO003
            claimRefs:
              - CO006
              - CO009
              - CO010
              - CO011
      - number: '1.3'
        title: Scale and commercial footprint
        blocks:
          - type: paragraph
            body: >-
              The strongest current scale disclosure is company-issued: Exiger reported more than 550 global customers
              in both March and September 2026 and identified 150 Fortune 500 customers. Its government disclosure
              changed from more than 60 government and Defense Industrial Base organizations in March to more than 80
              government and defense industrial organizations in September; the later figure is used here without
              assuming that the definitions are identical. An AWS seller profile repeats the earlier 550-plus, 150, and
              60-plus figures, but it is a supplier listing rather than independent verification. AHA's selection of
              Exiger as a preferred cybersecurity provider in 2024 offers partner validation of sector relevance, not
              quantified commercial performance. Revenue, ARR, margins, retention, customer concentration, and current
              headcount remain unverified.
            claimRefs:
              - CO007
              - CO008
              - CO015
      - number: '1.4'
        title: Milestones and underwriting implications
        blocks:
          - type: paragraph
            body: >-
              Exiger's public arc runs from a 2013 founding and an $80 million 2018 growth round through product
              expansion, acquisitions, sponsor investment, and a 2026 AI replatform. The milestone sequence shows
              sustained investment in data and product breadth, including Supply Chain Explorer, four named acquisitions
              from 2023 through 2024, an AHA channel credential, AWS Marketplace distribution, and the 1Exiger
              transformation. It does not establish financial durability. Simplify's editorial commentary flags bundled
              competition from SAP Ariba and Oracle, replatform execution risk, and possible pricing pressure from
              specialist competitors. Those observations are directional rather than benchmarked, but they sharpen the
              core diligence test: confirm that product breadth converts into renewal quality and pricing power before
              relying on the reported transaction scale or management's development-efficiency claims.
            claimRefs:
