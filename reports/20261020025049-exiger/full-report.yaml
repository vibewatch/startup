        - Company says more than 30% of annual revenue is reinvested; return and supplier dependence are undisclosed.
        - Data quality, rights, freshness, or cost problems degrade decisions and economics.
        - High
        - Ongoing company-reported data investment.
        - High; audit provenance, licensing rights, quality controls, update latency, and unit economics.
      - - Customer and government demand
        - More than 550 company-reported global customers
        - Revenue base and reference credibility
        - Top-customer, segment, renewal, and government-budget shares are undisclosed.
        - Major renewal loss or public-budget change impairs growth and operating leverage.
        - High
        - Customer scale spans Fortune 500 and government organizations.
        - High uncertainty; obtain ARR cohorts, NRR, GRR, top-10 share, segment mix, and renewal pipeline.
      - - Sponsor-backed transformation
        - Carlyle, Insight Partners, and JMI Equity
        - Capital allocation and AI-transformation sponsorship
        - Control rights, board protections, and capital commitments are not in the assigned evidence.
        - Schedule or return pressure prioritizes deployment speed over assurance and durable economics.
        - Medium-high
        - Sponsors publicly endorse the transformation.
        - Medium-high; inspect governance rights, budget gates, technical milestones, and downside financing support.
