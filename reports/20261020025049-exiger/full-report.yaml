              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM011
              - CM012
              - CM016
      - number: '2.2'
        title: Buyers, users, payers, and routes to adoption
        blocks:
          - type: paragraph
            body: >
              The evidence points to multiple buying centers rather than one homogeneous customer. Federal and defense
              programs value authorization, mission assurance, control-tower operations, and visibility into parts and
              suppliers; large enterprises and manufacturers buy resilience, procurement efficiency, and supplier
              intelligence; healthcare organizations add cyber and medical-device supply-chain concerns. Risk,
              procurement, supply-chain, compliance, security, and program leaders can all sponsor or use the platform,
              while enterprise or agency budgets ultimately pay. AWS Marketplace and the American Hospital Association
              relationship can lower discovery or procurement friction, but neither proves conversion economics.
              Exiger's claimed base of more than 550 customers and 150 Fortune 500 customers establishes reach, not
              penetration or retention.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.3'
        title: Growth drivers and adoption timing
        blocks:
          - type: paragraph
            body: >
              Regulation, geopolitical volatility, sub-tier opacity, sanctions and trade controls, software bills of
              materials, and pressure to automate procurement all increase demand for continuously refreshed risk
              intelligence. Agentic AI could expand the software budget if it converts signals into governed actions
              rather than another dashboard. TechEdgeAI reports Gartner expects enterprise use of agentic features in
              supply-chain software to rise from 5% in 2025 to 60% in 2030, while 72% of supply-chain organizations were
              deploying generative AI in 2025 but only 23% had a formal AI strategy. Those figures suggest strong
              experimentation and a long implementation curve. Exiger's data asset and reinvestment claims may aid
              differentiation, but remain company assertions rather than independent proof.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM015
      - number: '2.4'
        title: Adoption constraints and valuation implications
        blocks:
          - type: paragraph
            body: >
              Adoption is constrained by fragmented procurement data, difficult integrations, permissions, auditability,
              cybersecurity, human oversight, and the operating effort needed to turn findings into tracked mitigation.
              A company-issued role repost calls for large-scale onboarding, integration, recurring control-tower
              analysis, action management, and coordination with federal stakeholders, indicating that implementation
              capacity remains part of the solution. TechEdgeAI reports only 19% of surveyed organizations deploying
              supply-chain AI at scale while three-quarters were still planning, designing, or piloting use cases. For
              valuation, the category forecast is therefore insufficient: diligence still needs contract values, budget
              source, sales cycle, deployment cost, retention, measured ROI, pricing, market share, and a reconciled
              serviceable market.
            claimRefs:
              - CM007
              - CM013
              - CM014
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Category growth is not company market size
            body: >-
              The $53 billion forecast concerns agentic-AI-enabled supply-chain-management software broadly. Without
              pricing, segment revenue, contract values, market share, or serviceable-market methodology, applying it
              directly to Exiger would overstate the evidence.
            calloutType: risk
            claimRefs:
              - CM004
              - CM016
          - type: callout
            title: Implementation capacity is part of the adoption equation
            body: >-
              Exiger's own role requirements emphasize onboarding, integration, recurring analysis, action tracking, and
              federal coordination. Faster AI product delivery does not remove customer data, governance, and
              change-management work.
            calloutType: insight
            claimRefs:
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive boundary and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Exiger competes across a broad job rather than a single software category: third-party diligence,
              multi-tier supply-chain mapping, parts and materials intelligence, trade enforcement, software
              supply-chain exposure, procurement, and compliance workflow. That breadth means the relevant alternatives
              are not limited to direct SCRM or TPRM specialists. Buyers may also consider established GRC or TPRM
              suites, ERP and procurement platforms that can bundle adjacent workflows, internal data-and-analytics
              builds, and manual or consulting-led processes. Simplify names SAP Ariba, Oracle, Resilinc, and Prewave as
              potential competitive pressure, while Multiples supplies a heterogeneous comparable-company list and
              selected financial markers. Neither source provides symmetric product, customer, win-loss, or pricing
              evidence. The profile table therefore maps decision categories rather than pretending that full
              company-by-company comparisons are available. Exiger's own public scale claims are meaningful demand
              signals, but they remain company-issued and should not be treated as an independently measured
              market-share lead.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP015
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP008
              - CP014
              - CP015
              - CP016
      - number: '3.2'
        title: Capability breadth, proprietary data, and trust posture
        blocks:
          - type: paragraph
            body: >-
              The strongest documented differentiation is the combination of workflow breadth and product-aware data.
              Exiger says its engineering knowledge graph covers 10 billion supply-chain records, 400 million part
              attributes, and 6.5 million mapped relationships across more than 200 countries. It also says the platform
              connects supplier and software bills of materials to risk signals and exposes actions through APIs and
              enterprise-system integrations. The 2024 XSB acquisition brought a separate parts and logistics dataset
              in-house, reinforcing a data-asset strategy rather than a pure application-layer strategy. Trust and
              procurement posture add another competitive vector: Exiger reports FedRAMP Moderate authorization and
              other controls, while a government-wide GSA contract and a 2026 P1 Marketplace status create routes into
              regulated buyers. None of the retained sources establishes how named competitors perform on the same
              criteria, so unknown cells are intentionally left unknown.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP007
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
              - CP011
              - CP012
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP004
              - CP006
              - CP007
              - CP009
              - CP012
              - CP015
      - number: '3.3'
        title: Distribution power, procurement paths, and pricing opacity
        blocks:
          - type: paragraph
            body: >-
              Distribution appears to be part of Exiger's competitive strategy. A multi-year GSA award announced in 2022
              carried a stated total contract value of $74.5 million, while the 2026 AWS Marketplace launch was
              positioned as a way to shorten procurement and embed purchasing in an existing cloud account. P1
              Marketplace "Awardable" status provides another government acquisition route. These channels can lower
              buying friction and make a functionally similar entrant harder to adopt in federal or highly regulated
              settings. They do not reveal unit pricing, realized discounts, contract minimums, implementation charges,
              or renewal terms. The assigned sources also provide no comparable pricing for named alternatives.
              Accordingly, the pricing table distinguishes disclosed procurement mechanisms from undisclosed economics;
              the $74.5 million award is a contract value, not annual recurring revenue or a list price.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP014
              - CP015
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Exiger's defensibility appears to depend on the interaction of proprietary data, regulated deployment
              credentials, embedded integrations, acquisition-expanded coverage, and procurement channels rather than on
              a single feature. The company says it reinvests more than 30% of annual revenue in proprietary data and
              that AI writes 95% of first-generation code in its development process; both claims could support faster
              product iteration, but neither is independently verified here. The same breadth creates risk: enterprise
              suites can bundle adjacent modules, customers can build internal analytics around their own data, and
              generative-AI tooling may reduce application-development barriers. The assigned adverse search returned no
              retained result. Simplify's commentary names suite-bundling and specialist pressure, while the pool still
              contains no independent product benchmark, win-loss study, churn evidence, or rival roadmap. That absence
              is not proof that displacement risk is low. It means moat durability cannot be underwritten without direct
              customer references and side-by-side competitive evidence.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP013
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Trust and distribution reinforce product breadth
            body: >-
              Federal procurement routes, AWS Marketplace availability, and regulated-deployment claims can reduce
              adoption friction in buyer segments where access and assurance matter alongside functionality.
            calloutType: strength
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP012
          - type: callout
            title: Relative advantage is not independently benchmarked
            body: >-
              The retained pool contains no named-rival product test, pricing comparison, win-loss record, or
              independent customer benchmark, so Exiger's asserted lead cannot be quantified.
            calloutType: risk
            claimRefs:
              - CP014
