            body: >-
              Exiger combines a reported 550-plus customer base with government adoption, FedRAMP authorization, AHA
              partner validation, and AWS Marketplace distribution. These signals support relevance in regulated
              procurement, but remain weaker than audited retention, bookings, or revenue evidence.
