  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Evidence-backed argument
      - Thesis case
      - Anti-thesis or limitation
      - What would change the view
    rows:
      - - AI and data investment
        - Exiger reports a faster, lower-cost AI replatform and substantial data reinvestment.
        - Claims are company-issued and lack audited cost or productivity reconciliation.
        - Provide budget-to-actual replatform costs and release-to-revenue conversion.
      - - Customer and channel reach
        - The company reports 550+ customers and March 2026 AWS Marketplace availability.
        - Counts do not disclose retention, expansion, concentration, or marketplace-sourced revenue.
        - Provide logo-level cohorts, NRR, gross retention, and channel-attributed bookings.
      - - Growth and product proof
        - Exiger reports 50% core-market growth and quantified workflow outcomes.
        - Growth metric definition, period denominator, and independent customer validation are absent.
        - Reconcile growth to audited ARR and obtain customer-confirmed ROI samples.
      - - Competitive moat
        - Proprietary supply-chain data and regulated deployment may raise switching costs.
        - Simplify highlights suite bundling, replatform execution, and specialist pricing risks.
        - Show win/loss data, renewal pricing, implementation time, and displacement evidence.
    notes: >-
      Company-issued operating claims are presented as claims, not independent verification; the adverse commentary
      comes from Simplify's editorial summary within a company job repost.
