  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Required assumptions
      - Valuation or return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          Audited ARR growth and retention validate product momentum; gross margin scales; AI investment improves paid
          adoption.
        - >-
          Could support a premium to low public reference marks, but no Exiger value range is supportable before revenue
          and net-debt disclosure.
        - Unquantified; requires data-room proof.
        - Growth fails to reconcile to ARR or customers do not validate expansion and ROI.
      - - Base
        - >-
          Customer breadth and product differentiation persist, but financial disclosure and transaction terms remain
          limited.
        - >-
          No numeric range; withhold price endorsement and benchmark only after normalizing revenue quality and capital
          structure.
        - Most consistent with the assigned public evidence.
        - Financing or preference terms transfer disproportionate downside to new capital.
      - - Bear
        - >-
          AI replatform underdelivers, suite vendors bundle competing features, specialists pressure pricing, or
          government demand weakens.
        - >-
          Multiple compression and financing overhang are plausible, but downside value is not calculable from public
          evidence.
        - Material risk signal, not a forecast probability.
        - Weak retention, margin compression, customer concentration, or a down round.
    notes: >-
      Scenarios are conditional and intentionally omit invented probabilities, target returns, and valuation ranges; the
      cited 2.2x-10.0x revenue marks are heterogeneous reference points, not directly applied multiples.
