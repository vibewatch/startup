      - number: '4.2'
        title: Traction and go-to-market signals
        blocks:
          - type: paragraph
            body: >-
              Exiger's September 2026 investor-backed release claimed 550-plus global customers, including 150 Fortune
              500 companies and more than 80 government and defense-industrial organizations, and cited 50% core-market
              growth during 2026. These are useful indicators of enterprise reach but remain company-issued claims
              rather than audited revenue evidence. The earlier 2022 release reported software-license revenue compound
              annual growth above 100% over the preceding four years; it is historical and cannot establish the current
              growth rate. AWS Marketplace may shorten procurement for some buyers, while the stated multi-year AWS
              relationship and planned global AWS practice suggest a channel-led expansion effort. No public
              sales-cycle, pipeline-conversion, CAC, quota-productivity, or partner-economics data was retained, so
              sales efficiency cannot be underwritten from these signals.
            claimRefs:
              - CI003
              - CI004
              - CI007
              - CI008
              - CI009
              - CI015
      - number: '4.3'
        title: Cost structure and unit-economics boundary
        blocks:
          - type: paragraph
            body: >-
              The clearest public cost signal is Exiger's statement that more than 30% of annual revenue is reinvested
              to generate proprietary, product-aware data. The company also said an AI replatform compressed an
              internally estimated three-year, $180 million upgrade into a four-month, $20 million sprint. These figures
              indicate substantial data and product-development intensity, but they do not disclose accounting R&D
              expense, cash paid, or recurring savings. A current implementation role describes data onboarding,
              integration, analytics, engineering, data-science, and government-program coordination, showing that
              service delivery requires skilled labor in addition to software infrastructure. Customer savings claims
              demonstrate potential willingness-to-pay value, not Exiger revenue or gross profit. Gross margin, hosting
              cost, implementation margin, CAC, payback, NRR, and concentration remain unavailable.
            claimRefs:
              - CI005
              - CI006
              - CI012
              - CI013
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI012
              - CI015
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Exiger's public narrative shows continued investment: the company says it completed three acquisitions
              after the 2023 sponsor transaction, expanded proprietary data assets, and funded a broad AI-led
              replatform. Those facts establish strategic capital deployment, not the amount of cash currently available
              or the primary-versus-secondary composition of earlier financing. The retained evidence provides no
              current cash balance, burn rate, runway, debt schedule, covenant package, acquisition consideration, or
              next-round trigger. Financial quality is therefore mixed: subscription positioning, a large claimed
              customer base, a scalable marketplace channel, and visible customer-value cases are positives, while
              opaque pricing, service intensity, aggressive data reinvestment, and independently flagged bundling
              pressure leave revenue durability and margin conversion unproven. Investment committee underwriting should
              require a current quality-of-revenue bridge, cohort retention, gross-margin decomposition, and a 24-month
              liquidity plan.
            claimRefs:
              - CI005
              - CI006
              - CI008
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financial disclosure is the underwriting bottleneck
            body: >-
              Public sources expose commercial mechanisms and selected operating claims, but not the current revenue,
              margin, retention, liquidity, or leverage data needed to convert product traction into a defensible
              cash-flow view.
            calloutType: risk
            claimRefs:
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and module map
        blocks:
          - type: paragraph
            body: >-
              1EXIGER.AI is positioned as a workflow platform rather than a single risk-scoring application. Its public
              product surface spans third-party due diligence, continuous monitoring, multi-tier supplier and part
              mapping, capacity and alternate-source analysis, drawing and specification interpretation, tariff and
              country-of-origin analysis, and software-bill-of-material exposure. That breadth gives buyers a common
              operating layer for procurement, compliance, engineering, and supply-chain teams, but public materials do
              not disclose module-level adoption, packaging, release status, or production usage. The older Supply Chain
              Explorer launch establishes that supplier-network discovery and risk triage were commercialized by 2022,
              while a Snowflake partner listing preserves evidence of the earlier DDIQ-centered risk platform. The
              current suite therefore appears to be an expansion and consolidation of established capabilities, not a
              wholly new product, although migration depth and customer-by-customer module maturity remain diligence
              gaps.
            claimRefs:
              - CE001
              - CE002
              - CE008
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
              - CE002
              - CE008
              - CE014
      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The disclosed architecture joins customer operational data with Exiger's knowledge graph, resolves
              relationships among legal entities, ownership, suppliers, facilities, shipments, parts, materials, and end
              programs, and then routes investigation or action through permissioned agents and workflows. Exiger says
              open APIs, hundreds of native integrations, and an AI-driven ETL layer ingest ERP, PLM, and source-to-pay
              data and return enriched context to those systems. Its claimed differentiation is the product-aware graph:
              10 billion supply-chain records, 400 million part attributes, and 6.5 million mapped relationships across
              more than 200 countries. These figures describe potential data breadth, not independently measured
              accuracy, freshness, entity-resolution precision, or customer-specific coverage. The investment case
              therefore rests less on a generic agent layer than on whether this proprietary graph remains accurate and
              usable inside high-consequence workflows.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE015
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE010
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE011
              - CE012
      - number: '5.3'
        title: Deployment, integration, and operational use
        blocks:
          - type: paragraph
            body: >-
              Deployment is not represented as a zero-touch SaaS activation. A current implementation role describes a
              lifecycle from contract signature through onboarding, documentation, training, deployment, and handoff to
              customer success, with sales, product, engineering, and support coordination. A separate federal
              operations role calls for large-scale data onboarding, validation, control-tower analysis, and Red Team
              and Blue Team workflows, indicating that complex programs combine software with material implementation
              and operating-process work. AWS Marketplace availability can simplify purchasing and account
              administration, but it does not remove ERP, PLM, data-lake, permission, or data-quality dependencies.
              Public evidence gives no median time-to-value, implementation staffing ratio, integration failure rate,
              support SLA, uptime history, or customer-level adoption curve. Those missing measures are central to
              judging scalability and service burden.
            claimRefs:
              - CE007
              - CE011
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE007
              - CE011
              - CE012
              - CE015
      - number: '5.4'
        title: Maturity, differentiation, and trust posture
        blocks:
          - type: paragraph
            body: >-
              Exiger's September 2026 announcement describes a completed AI-led replatform and an AI product-development
              lifecycle intended to support continuous deployment, while the public workflow narrative emphasizes
              starting with critical suppliers and materials rather than attempting a complete map first. This is a
              coherent adoption model for enterprises whose source data is fragmented, but release cadence is not
              equivalent to reliability or customer value. Exiger also states that regulated deployments use a FedRAMP
              Moderate-authorized environment backed by ISO 27001 and SOC 2 Type II controls. The assigned evidence does
              not include the underlying audit reports, authorization package, status history, penetration-test results,
              or independently measured model performance. The only independent developer-surface source explicitly says
              its Exiger profile is an unenriched stub and is not a security assessment. Product diligence should
              therefore verify control scope, incident history, model governance, data lineage, and production
              performance directly rather than treating marketing certifications as complete technical proof.
            claimRefs:
              - CE006
              - CE009
              - CE010
              - CE013
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is data-dependent
            body: >-
              The defensible asset is the claimed product-aware relationship graph and its integration into decisions,
              not the availability of generic AI agents. Diligence should test graph accuracy, freshness, provenance,
              and customer-specific coverage.
            calloutType: strength
            claimRefs:
              - CE003
              - CE005
          - type: callout
            title: Public proof lags product ambition
            body: >-
              Current materials describe rapid replatforming, continuous releases, and regulated deployment, but the
              assigned pool lacks independent performance, uptime, audit, and developer-adoption evidence.
            calloutType: risk
            claimRefs:
              - CE006
              - CE009
              - CE010
              - CE013
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: A two-sided customer base with regulated buyers at the center
        blocks:
          - type: paragraph
            body: >-
              Exiger's public customer narrative spans large enterprises, federal and defense organizations, banks, and
              industrial supply-chain operators. The common economic buyer is typically a procurement, compliance,
              supply-chain, or risk leader, while analysts, program teams, engineers, and contracting personnel use the
              workflows. Exiger's September 2026 release reported 550+ global customers, including 150 Fortune 500
              companies and 80+ government and defense industrial organizations; a March 2026 release used 60+ for the
              government and Defense Industrial Base subset, so the two disclosed snapshots indicate a broader
              public-sector footprint but do not establish a like-for-like cohort increase. The strongest industrial
              example is an unnamed large aerospace manufacturer, which shows technically deep use but cannot be tied to
              a disclosed contract value or renewal record.
            claimRefs:
              - CU001
              - CU002
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.2'
        title: Adoption proof is broad, but much of it remains vendor-mediated
        blocks:
          - type: paragraph
            body: >-
              The customer-count claims are current and specific, yet they originate in company releases and should not
              be treated as independently audited adoption. FeaturedCustomers adds a wider reference inventory of 16
              reviews or testimonials and 19 case studies or success stories, but that inventory is an aggregation
              surface rather than retention data. Gartner Peer Insights supplies the clearest independent user signal:
              1Exiger showed a 4.4 rating from 32 all-time ratings, with 91% of ratings at four or five stars. An
              anonymized legal and compliance reviewer at a $10 billion-$30 billion travel and hospitality company also
              described several years of use, customization, and responsive issue resolution. These signals support real
              production use, while their small and self-selected samples limit extrapolation to the whole customer
              base.
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU008
              - CU009
              - CU010
              - CU011
      - number: '6.3'
        title: Integration and procurement channels create plausible expansion paths
        blocks:
          - type: paragraph
            body: >-
              Exiger's product surface covers third-party assessment, continuous monitoring, multi-tier mapping, demand
              and capacity analysis, trade exposure, and IT supply-chain risk. That breadth creates a land-and-expand
              path from one risk workflow into adjacent procurement, compliance, engineering, and resilience tasks,
              although no public module attach rates substantiate the path. Carahsoft provides a government-focused
              reseller route, and 1Exiger's March 2026 AWS Marketplace availability gives commercial and international
              buyers another procurement surface. Exiger also says it offers hundreds of native integrations and open
              APIs for ERP, PLM, and source-to-pay systems. The September replatforming announcement described customers
              building alongside Exiger while retaining their own data, suggesting co-development can deepen
              deployments, but this remains a company-issued description rather than an independently measured expansion
              result.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: Satisfaction is visible; retention and concentration are not
        blocks:
          - type: paragraph
            body: >-
              The public record does not disclose net revenue retention, gross revenue retention, logo churn, renewal
              rates, contract duration, cohort behavior, segment revenue, or top-customer concentration. Gartner's
              review distribution is encouraging but cannot substitute for those commercial metrics: it measures a
              small, self-selected product review population rather than a renewing revenue cohort. It also contains
              identifiable friction. A 2026 favorable review still called the learning curve steep for new users, while
              a 2025 critical review scored the product 3.0 and described navigation through immaterial hits and a
              user-friendliness problem. AWS Marketplace may reduce procurement friction, but it does not prove faster
              conversion or renewal. Underwriting customer durability therefore requires private evidence, including
              customer-level ARR, start and renewal dates, product modules, expansion or contraction, and channel
              source.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and evidence limits
        blocks:
          - type: paragraph
            body: >-
              The risk view is constrained by an evidence set in which seven of eight retained sources are
              company-issued releases, product pages, or company job content; the remaining profile does not provide
              primary legal, regulatory, financial, or incident records. The leading residual risk is therefore
              execution and assurance rather than a documented adverse event. Exiger says it compressed a three-year,
              $180 million platform upgrade into a four-month, $20 million sprint and that AI writes 95% of
              first-generation code. Those claims indicate speed and cost leverage, but they also raise
              release-governance, regression, and model-risk questions when paired with daily or hourly deployment
              ambitions. The matrix uses ordinal analyst judgments, not measured incident probabilities, and assigns
              "unknown" where the pool cannot establish likelihood.
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR007
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR007
              - CR008
              - CR011
              - CR013
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and security exposure
        blocks:
          - type: paragraph
            body: >-
              Exiger operates inside consequential screening and supplier-risk workflows: its own materials describe
              sanctions, export-control, forced-labor, ownership, and product-origin checks. This creates exposure to
              false negatives, false positives, stale source data, privacy failures, and inconsistent jurisdictional
              rules. The company says it has government-wide FedRAMP Moderate authorization plus ISO 27001 and SOC 2
              Type 2, and it describes role, permission, review-point, and audit-trail controls. Those are relevant
              mitigations, but the assigned pool contains no underlying authorization package, audit report, regulator
              record, court docket, or incident register. Diligence should therefore verify current scope, exceptions,
              subprocessors, model governance, claims history, and whether human review is mandatory for
              high-consequence decisions.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR008
              - CR016
      - number: '7.3'
        title: Operational and technical execution
        blocks:
          - type: paragraph
            body: >-
              Operational risk is amplified by simultaneous replatforming, data onboarding, integration, and
              federal-program delivery. A 2026 Exiger job posting sought a director to "stand up and run" the
              operational backbone of a mission-critical, federally aligned program and required execution across
              multiple workstreams under tight timelines and ambiguous requirements. That is a useful delivery signal,
              not proof of failure, but it indicates that key operating processes were still being built while the
              company promoted rapid scaling. Hundreds of claimed native integrations, open APIs, and an AI-driven ETL
              layer increase usefulness and switching depth while expanding interface, entitlement, lineage, and
              implementation risk. Release quality, rollback performance, onboarding cycle time, and severity-one
              incident data are the decisive missing operating measures.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR012
              - CR016
      - number: '7.4'
        title: Dependencies, economics, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              Exiger's March 2026 AWS Marketplace launch can shorten procurement, but it adds a channel dependency whose
              revenue contribution, commercial terms, and contingency arrangements are undisclosed. The company also
              says it reinvests more than 30% of annual revenue in proprietary, product-aware data; that may sustain
              differentiation, yet it is an investment intensity metric rather than evidence of margin, burn, runway, or
              return on data spend. Company releases cite more than 550 customers, but the assigned evidence does not
              disclose retention, segment revenue mix, top-customer concentration, or government-budget exposure.
              Thesis-break triggers should include failed independent control verification, sustained severe release
              defects, material data-rights challenges, loss of critical authorization, or customer and channel
              concentration above the investor's underwriting limits.
            claimRefs:
              - CR010
              - CR011
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR010
              - CR011
              - CR013
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Evidence-quality constraint
            body: >-
              Public materials establish claimed controls and strategic intent, but not loss history, control
              effectiveness, concentration, or financial resilience; underwriting should remain conditional on primary
              diligence artifacts.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR015
          - type: callout
            title: Thesis-break tests
            body: >-
              Pause or reprice if independent review finds material authorization gaps, repeated severe release
              failures, weak data rights, or customer, channel, and government concentration above the investor's
              approved limits.
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR007
              - CR011
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and decision posture
        blocks:
          - type: paragraph
            body: >-
              The investable conclusion is research-more, not buy or avoid. Exiger has evidence of a broad platform,
              more than 550 customers, AWS Marketplace distribution, and company-reported 50% core-market growth in
              2026. Those signals support continued diligence, but they do not supply the financial denominator required
              for valuation. The public record variously describes the 2023 event as a $1.2 billion acquisition or
              investment, while one source also says the transaction's financial terms were not disclosed. Without
              current ARR, revenue quality, gross margin, retention, net debt, cash burn, or preference terms, the
              reported figure should not be treated as a verified current equity value. Entry discipline therefore
              requires a data-room bridge from enterprise value to fully diluted equity value before price approval.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV010
              - CV011
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV010
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
              - CV016
      - number: '8.2'
        title: Financing and comparable context
        blocks:
          - type: paragraph
            body: >-
              Financing history is internally inconsistent across third-party databases. Tracxn reports $80 million
              across three rounds and identifies an April 2024 conventional-debt round with an undisclosed amount,
              whereas Multiples reports $80 million across one pre-acquisition round. That conflict prevents a reliable
              reconstruction of invested capital, debt outstanding, or dilution. Multiples also presents a heterogeneous
              comparison set spanning Clarivate and SMS at 2.2x and 3.2x revenue and private EcoVadis and Pigment marks
              at 8.7x and 10.0x. These are context markers, not an Exiger pricing formula: the companies differ in
              product mix, profitability, growth, liquidity, and reporting basis, and Exiger's current revenue is not
              disclosed in the assigned evidence.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV014
              - CV016
      - number: '8.3'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that proprietary supply-chain data, regulated-market deployment, customer breadth, and
              faster AI product delivery can support durable workflow ownership. Exiger says it reinvests more than 30%
              of annual revenue in proprietary data, reduced the modeled cost and duration of its AI replatform, and
              achieved 50% core-market growth in 2026. The anti-thesis is equally material: these are company claims
              without disclosed cohort retention, unit economics, or audited segment results. Simplify's critical
              commentary identifies bundled supplier-risk features from SAP Ariba and Oracle, replatform execution risk
              with government buyers, and pricing pressure from specialists. A premium entry is defensible only after
              customer-level retention, margin, and competitive-win evidence converts those claims into measurable
              cash-flow durability.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.4'
        title: Scenarios, exit readiness, and diligence gates
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis must remain qualitative until Exiger supplies current operating and capital data. The
              bull case requires independently reconciled ARR growth, strong gross retention, scalable margins, and
              proof that AI-led product velocity expands paid usage rather than only feature output. The base case
              accepts product and customer evidence but withholds price endorsement because no current revenue multiple
              can be calculated. The bear case combines failed replatform execution, bundled competition, weak renewal
              economics, and financing overhang; its downside cannot be quantified without net debt and preference
              terms. No evidence in the assigned pool supports a target return, hold period, IPO window, or M&A exit
              value. Final approval should require audited financials, ARR and retention cohorts, customer
              concentration, pipeline conversion, cap table, debt schedule, liquidation preferences, and a management
              bridge between the reported $1.2 billion context and fully diluted equity value.
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price approval is not supportable
            body: >-
              Maintain a research-more posture. The evidence supports continued diligence on Exiger's platform and
              customer reach, but not a current equity value or target return.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV010
              - CV016
          - type: callout
            title: The $1.2 billion label needs reconciliation
            body: >-
              Sources call the 2023 event both an acquisition and an investment, while a transaction description says
              financial terms were not disclosed. Obtain the definitive capitalization and purchase-price bridge before
              using the figure in valuation.
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
