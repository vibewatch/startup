company:
  name: Exiger
chapter:
  number: 6
  title: Customers
  summary: >-
    Exiger reports a broad base of 550+ customers spanning Fortune 500 enterprises and
    government or defense organizations, while Gartner Peer Insights provides a smaller
    independent signal of generally positive product experience. Public evidence is much
    weaker on retention, contract durability, segment revenue, and customer concentration.
sections:
  - id: customer-segments
    title: A two-sided customer base with regulated buyers at the center
    body: >-
      Exiger's public customer narrative spans large enterprises, federal and defense
      organizations, banks, and industrial supply-chain operators. The common economic
      buyer is typically a procurement, compliance, supply-chain, or risk leader, while
      analysts, program teams, engineers, and contracting personnel use the workflows.
      Exiger's September 2026 release reported 550+ global customers, including 150 Fortune
      500 companies and 80+ government and defense industrial organizations; a March 2026
      release used 60+ for the government and Defense Industrial Base subset, so the two
      disclosed snapshots indicate a broader public-sector footprint but do not establish
      a like-for-like cohort increase. The strongest industrial example is an unnamed large
      aerospace manufacturer, which shows technically deep use but cannot be tied to a
      disclosed contract value or renewal record.
    claimRefs: [CU001, CU002, CU009, CU010, CU011, CU012, CU013]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Adoption proof is broad, but much of it remains vendor-mediated
    body: >-
      The customer-count claims are current and specific, yet they originate in company
      releases and should not be treated as independently audited adoption. FeaturedCustomers
      adds a wider reference inventory of 16 reviews or testimonials and 19 case studies or
      success stories, but that inventory is an aggregation surface rather than retention
      data. Gartner Peer Insights supplies the clearest independent user signal: 1Exiger
      showed a 4.4 rating from 32 all-time ratings, with 91% of ratings at four or five stars.
      An anonymized legal and compliance reviewer at a $10 billion-$30 billion travel and
      hospitality company also described several years of use, customization, and responsive
      issue resolution. These signals support real production use, while their small and
      self-selected samples limit extrapolation to the whole customer base.
    claimRefs: [CU001, CU003, CU004, CU005, CU008]
    tableRefs: [TU002, TU003]
  - id: adoption-and-expansion
    title: Integration and procurement channels create plausible expansion paths
    body: >-
      Exiger's product surface covers third-party assessment, continuous monitoring,
      multi-tier mapping, demand and capacity analysis, trade exposure, and IT supply-chain
      risk. That breadth creates a land-and-expand path from one risk workflow into adjacent
      procurement, compliance, engineering, and resilience tasks, although no public module
      attach rates substantiate the path. Carahsoft provides a government-focused reseller
      route, and 1Exiger's March 2026 AWS Marketplace availability gives commercial and
      international buyers another procurement surface. Exiger also says it offers hundreds
      of native integrations and open APIs for ERP, PLM, and source-to-pay systems. The
      September replatforming announcement described customers building alongside Exiger
      while retaining their own data, suggesting co-development can deepen deployments, but
      this remains a company-issued description rather than an independently measured
      expansion result.
    claimRefs: [CU012, CU013, CU014, CU015, CU016]
    figureRefs: [FU001]
  - id: durability-and-risk
    title: Satisfaction is visible; retention and concentration are not
    body: >-
      The public record does not disclose net revenue retention, gross revenue retention,
      logo churn, renewal rates, contract duration, cohort behavior, segment revenue, or
      top-customer concentration. Gartner's review distribution is encouraging but cannot
      substitute for those commercial metrics: it measures a small, self-selected product
      review population rather than a renewing revenue cohort. It also contains identifiable
      friction. A 2026 favorable review still called the learning curve steep for new users,
      while a 2025 critical review scored the product 3.0 and described navigation through
      immaterial hits and a user-friendliness problem. AWS Marketplace may reduce procurement
      friction, but it does not prove faster conversion or renewal. Underwriting customer
      durability therefore requires private evidence, including customer-level ARR,
      start and renewal dates, product modules, expansion or contraction, and channel source.
    claimRefs: [CU004, CU005, CU006, CU007, CU014]
