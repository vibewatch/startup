figures:
  - id: FU001
    title: Customer adoption surfaces and expansion loop
    type: journey-map
    summary: >-
      Exiger can enter through a discrete risk workflow, embed in enterprise systems, and
      broaden through procurement channels and adjacent operating-network use cases.
    data:
      nodes:
        - id: identify
          label: Identify exposure
          detail: Detect a third-party, supplier, trade, or part-level risk signal.
          touchpoints: ["Risk and compliance team", "Supply-chain team"]
        - id: assess
          label: Assess and map
          detail: Link the signal to entities, ownership, facilities, shipments, parts, and programs.
          touchpoints: ["1EXIGER.AI", "Due-diligence workflow"]
        - id: act
          label: Route action
          detail: Send assessments, monitoring events, and mitigation tasks through governed workflows.
          touchpoints: ["Procurement", "Compliance", "Program operations"]
        - id: embed
          label: Embed in systems
          detail: Connect risk context to ERP, PLM, source-to-pay, and data environments.
          touchpoints: ["Open APIs", "Native integrations"]
        - id: procure
          label: Broaden procurement
          detail: Use Carahsoft for government access or AWS Marketplace for cloud procurement.
          touchpoints: ["Carahsoft", "AWS Marketplace"]
        - id: expand
          label: Expand use cases
          detail: Extend from monitoring into capacity, alternate sourcing, trade, and IT supply-chain workflows.
          touchpoints: ["Co-development", "Adjacent modules"]
    approximationNotes: >-
      The sequence is an analytical synthesis of disclosed product and channel surfaces;
      it is not a measured conversion funnel and does not imply observed expansion rates.
    claimRefs: [CU012, CU013, CU014, CU015, CU016]
