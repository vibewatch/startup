callouts:
  - calloutType: "insight"
    title: "Standardization Model Drives Operating Leverage and High Repeat Purchases"
    body: "Unlike traditional industrial robotics integrators that require dedicated on-site teams for bespoke engineering projects, Mech-Mind's standardized 'Eye-Brain-Hand' hardware-software architecture enables deployment cycles to contract from months to days. This productized approach underpinned a 93.9% repeat purchase rate in H1 2026 while gross margins reached 65.0%."
    claimRefs:
      - "CO011"
      - "CO012"
  - calloutType: "risk"
    title: "Persistent Net Losses from R&D Investments and Downstream Market Commoditization"
    body: "Mech-Mind posted an adjusted net loss of RMB 52.5 million in H1 2026 as strategic R&D expenditures grew 72.9% year-over-year to RMB 80.1 million. Furthermore, while the company's component positioning avoids direct robot body competition, severe homogenization and price erosion among downstream robot builders create long-term adoption and pricing risks."
    claimRefs:
      - "CO013"
      - "CO014"
