      - number: '6.2'
        title: Adoption trajectory and geographic expansion
        blocks:
          - type: paragraph
            body: >-
              Public operating data indicate increasing adoption on several non-equivalent measures. The prospectus
              reports 1,605 accumulated customers that had placed orders by March 31, 2026, more than 900 overseas
              customers across almost 50 countries and regions, and more than 29,000 deployed product units as of its
              latest practicable date. For the comparable first-quarter window, the customer base increased from 236 in
              2025 to 258 in 2026, while intelligent robotic guidance product volume rose from 1,321 to 2,412 units.
              Overseas revenue reached 50.3% of 2025 revenue before moderating to 44.0% in the first quarter of 2026.
              These measures support real adoption, but they must not be combined into a single funnel: accumulated
              ordering customers, period customers, units, countries, and revenue share have different populations and
              time bases.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU010
