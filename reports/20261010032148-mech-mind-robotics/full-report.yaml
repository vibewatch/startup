              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Repeat-customer revenue mix is improving
            body: >-
              Existing customers generated 78% of 2025 revenue and 86% of revenue in the three months ended March 31,
              2026, a useful durability signal even though it is not a retention rate.
            calloutType: strength
            claimRefs:
              - CU005
          - type: callout
            title: Concentration and channel opacity remain material
            body: >-
              The top five customers reached 39.3% of 2025 revenue, while integrators generated 94.6% of first-quarter
              2026 revenue. Diligence should reconcile end-customer concentration with integrator concentration and
              obtain customer-level deployment and renewal evidence.
            calloutType: risk
            claimRefs:
