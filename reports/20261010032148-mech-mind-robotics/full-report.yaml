      - number: '6.3'
        title: Named customer proof and durability
        blocks:
          - type: paragraph
            body: >-
              The strongest named proof is a representative set rather than a complete customer census. The prospectus
              identifies CATL, BYD, Midea, and Foxconn among more than 100 Fortune Global 500 relationships, and AI
              Insider repeats those names while attributing them to the South China Morning Post. Mech-Mind's current
              homepage also claims more than 100 Fortune Global 500 clients. The filing does not disclose, for each
              named company, whether the relationship is a pilot or production deployment, the number of sites or units,
              realized savings, renewal history, or current contract status. Existing-customer revenue contribution rose
              from 61% in 2023 to 74% in 2024, 78% in 2025, and 86% in the first quarter of 2026, but this is a
              revenue-mix proxy, not NRR, GRR, churn, or cohort retention.
            claimRefs:
              - CU005
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU011
              - CU010
              - CU015
      - number: '6.4'
        title: Expansion, concentration, and procurement friction
        blocks:
          - type: paragraph
            body: >-
              Expansion appears to come from repeat purchasing, new scenarios, and replication through trained
              integrators. The company describes a sequence in which it validates a new application directly, documents
              a standard application, trains integrators, and then scales deployment through the channel. That mechanism
              is plausible, but public data do not isolate same-customer site expansion, cross-sell, pricing, or units
              per account. Concentration is a growing counterweight: the top five customers represented 39.3% of 2025
              revenue, up from 24.8% in 2023, and the largest customer reached 15.0% in 2025. A separate independent
              analysis flags industrial-capex cyclicality, while 36Kr reported the founder's claim that the company had
              no data-collection-center revenue. The latter is management's assertion reported by a third party, not
              independent verification of revenue quality.
            claimRefs:
              - CU012
              - CU013
              - CU015
              - CU016
