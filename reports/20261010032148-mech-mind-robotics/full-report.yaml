  - id: TV002
    title: Investment Thesis versus Anti-Thesis Evaluation
    columns:
      - Perspective
      - Core Argument
      - Evidence Base
      - View Invalidation Trigger
    rows:
      - - 'Bull Thesis: Vision Scale'
        - Mech-Mind is an established market leader in industrial 3D vision with global tier-1 customer adoption
        - 30,000+ camera deployments across ~50 countries and 100+ Fortune Global 500 accounts
        - Slowdown in quarterly camera shipment run-rate or customer churn in automotive/EV
      - - 'Bull Thesis: Operating Leverage'
        - Rapid revenue expansion and expanding international mix are narrowing operating losses
        - Revenue grew 44% in 2025 to RMB 389M; overseas gross margin reached 79% vs 50% domestic
        - Overseas gross margin compression below 60% or reversal in loss narrowing trend
      - - 'Anti-Thesis: Valuation Multiple'
        - Trading at >20x trailing sales in a cyclical hardware-dependent sector leaves no margin of safety
        - Market cap of HK$11.2B against FY2025 sales of RMB 389M and ongoing net losses
        - Sustained revenue hypergrowth exceeding 80% YoY alongside GAAP operating profitability
      - - 'Anti-Thesis: Peer De-Rating'
        - Embodied AI concept stocks face severe secondary market de-rating as commercial scrutiny intensifies
        - Unitree shares dropped over 50% post-listing; UBTECH market value halved from highs
        - Sector-wide multiple re-expansion and regulatory clarity validating embodied AI revenue models
    notes: >-
      Thesis points evaluated against FY2023-FY2025 revenue trajectory, H-share performance, and embodied intelligence
      commercialization hurdles.
    claimRefs:
      - CV003
      - CV006
      - CV008
      - CV009
      - CV011
      - CV012
      - CV013
  - id: TV003
    title: Bull, Base, and Bear Scenario Projections
    columns:
      - Scenario
      - Operating Assumptions
      - Target Multiple & Valuation
      - Probability Signal
      - Downside Triggers
    rows:
      - - Bull Case
        - FY2026 revenue expands 75% to RMB 680M; overseas share exceeds 60%; adjusted net margin achieves breakeven
        - 22x forward P/S yields valuation of HK$16.5B (HK$132/share, +48% upside)
        - 20% probability; contingent on rapid overseas robotics adoption and tier-1 auto expansions
        - Tariff barriers on Chinese robotics hardware or domestic EV capex freeze
      - - Base Case
        - FY2026 revenue grows 50% to RMB 585M; gross margins hold near 65%; adjusted net loss narrows to <RMB 50M
        - 14x forward P/S yields valuation of HK$9.0B (HK$72/share, -19% downside)
        - 55% probability; reflects steady industrial automation expansion with persistent pricing pressure
        - Prolonged loss-making quarters and multiple compression toward industrial tech peers
      - - Bear Case
        - >-
          FY2026 revenue growth decelerates to 25% (RMB 485M); domestic price war depresses gross margin below 50%; cash
          burn expands
        - 8x forward P/S yields valuation of HK$4.3B (HK$34/share, -62% downside)
        - 25% probability; triggered by macroeconomic slowdown, capex cuts, or loss of key accounts
        - Customer concentration defaults, export restrictions, or aggressive domestic price cutting
    notes: Scenario valuations model 12-month forward expectations based on FY2026 revenue run-rate and peer P/S multiples.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV011
