callouts:
  - calloutType: "insight"
    title: "Commercialization Reality: Industrial Deployments Versus Subsidized Data Centers"
    body: "While pure-play humanoid startups have relied on municipal data-collection subsidies and related-party contracts to demonstrate headline revenue, Mech-Mind's commercial traction is anchored in repeatable factory-floor and logistics deployments, validated by 30,000 cumulative sets shipped and a 93.9% first-half repurchase rate."
    claimRefs:
      - "CM006"
      - "CM010"
      - "CM013"

  - calloutType: "risk"
    title: "Capital Expenditure Cyclicality and Margin Divergence"
    body: "Industrial adoption remains structurally tethered to manufacturing Capex cycles. Although overseas gross margins reached 79% in 2025 compared to 50% domestically, macro factory slowdowns and extended enterprise pilot cycles pose recurring headwinds to sustained revenue acceleration."
    claimRefs:
      - "CM011"
      - "CM012"

