artifact: customers
slug: mech-mind-robotics
runDate: 2026-10-10
company:
  name: Mech-Mind Robotics
chapter:
  number: 6
  title: Customers
  summary: >-
    Mech-Mind has broad commercial reach, with 1,605 accumulated ordering customers as of
    March 31, 2026, more than 29,000 products deployed, and over 900 overseas customers.
    Adoption is heavily mediated by system integrators, while rising top-five concentration and
    the absence of public NRR, GRR, churn, contract-duration, and customer-level outcome data
    limit confidence in durability.
sections:
  - id: buyer-channel-segmentation
    title: Buyer, user, and channel segmentation
    body: >-
      The paying customer is usually an automation intermediary rather than the factory where the
      equipment is ultimately used. System integrators generated 93.6%, 95.1%, 81.5%, and 94.6%
      of revenue in 2023, 2024, 2025, and the three months ended March 31, 2026, respectively.
      Direct customers include automotive manufacturers, industrial manufacturers, and logistics
      and warehouse operators, while end users span automotive, new energy, consumer electronics,
      logistics, education, and general manufacturing. The company reported 1,369 cooperating
      system integrators at March 31, 2026. This model expands geographic and vertical reach but
      puts implementation quality, end-customer visibility, and part of the service relationship in
      third-party hands. Visicon's product page is tangible partner-channel evidence, although it
      describes capabilities rather than disclosed sales or customer outcomes.
    claimRefs: [CU006, CU007, CU008, CU009]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and geographic expansion
    body: >-
      Public operating data indicate increasing adoption on several non-equivalent measures. The
      prospectus reports 1,605 accumulated customers that had placed orders by March 31, 2026,
      more than 900 overseas customers across almost 50 countries and regions, and more than
      29,000 deployed product units as of its latest practicable date. For the comparable
      first-quarter window, the customer base increased from 236 in 2025 to 258 in 2026, while
      intelligent robotic guidance product volume rose from 1,321 to 2,412 units. Overseas revenue
      reached 50.3% of 2025 revenue before moderating to 44.0% in the first quarter of 2026.
      These measures support real adoption, but they must not be combined into a single funnel:
      accumulated ordering customers, period customers, units, countries, and revenue share have
      different populations and time bases.
    claimRefs: [CU001, CU002, CU003, CU004, CU010, CU014]
    tableRefs: [TU002]
  - id: named-proof-and-durability
    title: Named customer proof and durability
    body: >-
      The strongest named proof is a representative set rather than a complete customer census.
      The prospectus identifies CATL, BYD, Midea, and Foxconn among more than 100 Fortune Global
      500 relationships, and AI Insider repeats those names while attributing them to the South
      China Morning Post. Mech-Mind's current homepage also claims more than 100 Fortune Global
      500 clients. The filing does not disclose, for each named company, whether the relationship
      is a pilot or production deployment, the number of sites or units, realized savings, renewal
      history, or current contract status. Existing-customer revenue contribution rose from 61% in
      2023 to 74% in 2024, 78% in 2025, and 86% in the first quarter of 2026, but this is a
      revenue-mix proxy, not NRR, GRR, churn, or cohort retention.
    claimRefs: [CU005, CU011]
    tableRefs: [TU003]
  - id: expansion-concentration-and-friction
    title: Expansion, concentration, and procurement friction
    body: >-
      Expansion appears to come from repeat purchasing, new scenarios, and replication through
      trained integrators. The company describes a sequence in which it validates a new
      application directly, documents a standard application, trains integrators, and then scales
      deployment through the channel. That mechanism is plausible, but public data do not isolate
      same-customer site expansion, cross-sell, pricing, or units per account. Concentration is a
      growing counterweight: the top five customers represented 39.3% of 2025 revenue, up from
      24.8% in 2023, and the largest customer reached 15.0% in 2025. A separate independent
      analysis flags industrial-capex cyclicality, while 36Kr reported the founder's claim that the
      company had no data-collection-center revenue. The latter is management's assertion
      reported by a third party, not independent verification of revenue quality.
    claimRefs: [CU012, CU013, CU015, CU016]
    figureRefs: [FU001]
tables:
  - id: TU001
    title: Customer segmentation by payer, user, and route to market
    columns:
      - Segment
      - Buyer / payer
      - User and use case
      - Scale or value signal
      - Principal diligence gap
    rows:
      - - System-integrator channel
        - Third-party automation integrator
        - Factory or warehouse operators using integrated robotic systems
        - "94.6% of revenue in the three months ended March 31, 2026; 1,369 cooperating integrators at period end"
        - End-customer identity, integrator-level concentration, sell-through, and service quality
      - - Direct strategic accounts
        - Automotive, industrial, logistics, and warehouse operators
        - New-scenario validation, commissioning, and larger production-line projects
        - "5.4% of revenue in the three months ended March 31, 2026; 18.5% in full-year 2025"
        - Account-level contract values, active sites, expansion, and renewal terms
      - - Overseas customers
        - Direct customers and system integrators outside Chinese Mainland
        - Manufacturing and logistics deployments across North America, Europe, and Asia
        - "More than 900 customers across almost 50 countries and regions; 44.0% of revenue in Q1 2026"
        - Country-level concentration, partner economics, support cost, and local retention
      - - Global strategic references
        - Large manufacturers and their automation partners
        - Production automation in automotive, new energy, electronics, and related verticals
        - "More than 100 Fortune Global 500 relationships; representative names include CATL, BYD, Midea, and Foxconn"
        - Named deployment scope, production status, outcomes, and current relationship status
    notes: >-
      Filing-defined channel and geography metrics are shown with their stated periods; direct
      customer and end-user populations overlap, and customer-level revenue is not publicly split
      by vertical.
    claimRefs: [CU002, CU006, CU007, CU009, CU011, CU014]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns:
      - Metric
      - Value
      - Period / as-of date
      - Source basis
      - Confidence and implication
      - Missing denominator or limitation
    rows:
      - - Accumulated ordering customers
        - "1,605"
        - "As of March 31, 2026"
        - HKEX prospectus
        - "Medium: confirms an ordering relationship"
        - Active status, order frequency, and revenue distribution are undisclosed
      - - Period customer base
        - "236 to 258"
        - "Three months ended March 31, 2025 to the same period in 2026"
        - HKEX prospectus
        - "Medium: indicates 9.3% growth in period customers"
        - Definition is not an active installed-base count
      - - Intelligent robotic guidance product volume
        - "1,321 to 2,412 units"
        - "Three months ended March 31, 2025 to the same period in 2026"
        - HKEX prospectus
        - "Medium: indicates substantially higher shipment volume"
        - Units per customer, replacement units, and deployments are not separated
      - - Existing-customer revenue contribution
        - "61%, 74%, 78%, 86%"
        - "2023, 2024, 2025, and three months ended March 31, 2026"
        - HKEX prospectus
        - "Medium: repeat-customer revenue mix strengthened"
        - Not NRR, GRR, renewal rate, or cohort retention
      - - Deployed product footprint
        - "More than 29,000 units"
        - Latest practicable date in the August 24, 2026 prospectus
        - HKEX prospectus
        - "Medium: demonstrates cumulative deployment scale"
        - Product mix, active status, replacement rate, and customer denominator are undisclosed
      - - Overseas revenue share
        - "32.4%, 36.4%, 50.3%, 44.0%"
        - "2023, 2024, 2025, and three months ended March 31, 2026"
        - HKEX prospectus
        - "Medium: international revenue became material"
        - Counterparty location may be an integrator rather than the end-user site
    notes: >-
      Metrics are not funnel stages and should not be converted into rates against one another;
      periods, populations, products, and denominators differ. The 9.3% period-customer growth is
      calculated from the filing's 236 and 258 counts.
    claimRefs: [CU001, CU003, CU004, CU005, CU010, CU014]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Publicly described relationship or use
      - Production vs. pilot
      - Public outcome
      - Limitation
    rows:
      - - CATL
        - New-energy manufacturing
        - Named by the prospectus among representative customers or end users
        - Not disclosed at customer level
        - No customer-specific quantified outcome disclosed
        - Scope, sites, units, contract value, and renewal history are unavailable
      - - BYD
        - Automotive and new energy
        - Named by the prospectus among representative customers or end users
        - Not disclosed at customer level
        - No customer-specific quantified outcome disclosed
        - Scope, sites, units, contract value, and renewal history are unavailable
      - - Midea
        - Home appliances and manufacturing
        - Named in the prospectus deployment discussion and in secondary reporting
        - Not disclosed at customer level
        - No customer-specific quantified outcome disclosed
        - Relationship vintage, scope, production status, and current activity are unavailable
      - - Foxconn
        - Electronics manufacturing
        - Named in the prospectus deployment discussion and in secondary reporting
        - Not disclosed at customer level
        - No customer-specific quantified outcome disclosed
        - Relationship vintage, scope, production status, and current activity are unavailable
    notes: >-
      This is a representative sample of names disclosed by the company and repeated in assigned
      secondary reporting, not a complete customer list. No row should be read as proof of a
      current production deployment or independently verified outcome.
    enumerationScope:
      coverage: sample
      basis: >-
        Representative names disclosed in the August 2026 prospectus, the current company
        homepage, and assigned secondary reporting.
    claimRefs: [CU011, CU010, CU015]
figures:
  - id: FU001
    title: Customer adoption and expansion loop
    type: journey-map
    summary: >-
      The disclosed route moves from direct use-case validation to integrator-led replication, but
      customer-level conversion and retention rates are not public.
    data:
      items:
        - label: Identify automation need
          detail: Direct customer or integrator identifies a factory or warehouse use case.
          touchpoints:
            - Field sales
            - Integrator network
        - label: Prove the application
          detail: Mech-Mind conducts field testing, proof-of-concept work, or application co-development.
          touchpoints:
            - Technical evaluation
            - Proof-of-concept trial
        - label: Complete initial deployment
          detail: Products are delivered and commissioning is provided when required.
          touchpoints:
            - Installation
            - Commissioning
        - label: Standardize the application
          detail: Hardware, software, and supporting documents are packaged for replication.
          touchpoints:
            - Commissioning manual
            - Software configuration
        - label: Enable system integrators
          detail: Trained integrators incorporate Mech-Mind products into broader automation systems.
          touchpoints:
            - Product training
            - Technical enablement
        - label: Replicate and expand
          detail: Integrators sell into additional sites and scenarios, enabling follow-on orders and cross-sell.
          touchpoints:
            - Repeat order
            - New site or scenario
    approximationNotes: >-
      This is a qualitative mechanism reconstructed from the prospectus; no stage conversion
      rates, elapsed times, or common population were disclosed.
    claimRefs: [CU006, CU007, CU008, CU015]
callouts:
  - calloutType: strength
    title: Repeat-customer revenue mix is improving
    body: >-
      Existing customers generated 78% of 2025 revenue and 86% of revenue in the three months
      ended March 31, 2026, a useful durability signal even though it is not a retention rate.
    claimRefs: [CU005]
  - calloutType: risk
    title: Concentration and channel opacity remain material
    body: >-
      The top five customers reached 39.3% of 2025 revenue, while integrators generated 94.6% of
      first-quarter 2026 revenue. Diligence should reconcile end-customer concentration with
      integrator concentration and obtain customer-level deployment and renewal evidence.
    claimRefs: [CU006, CU012, CU013]
