      severity: material
      topic: named-customers
      missingEvidence: >-
        Customer-confirmed deployment status, site and unit counts, production-versus-pilot
        classification, realized outcomes, contract values, and current relationship status for
        the representative named customers.
      whyItMatters: >-
        Company-disclosed names and aggregate deployment metrics do not establish customer-level
        production use, realized ROI, or reference durability.
      diligencePath: >-
        Obtain a customer-level deployment schedule and interview procurement or operating owners
        at CATL, BYD, Midea, and Foxconn; reconcile responses to invoices, acceptance records, and
        support logs.
      relatedQuestionRefs: [QU003, QU009]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: >-
        NRR, GRR, logo churn, renewal rate, contract duration, order frequency, cohort retention,
        and expansion by direct customer and system integrator.
      whyItMatters: >-
        Existing-customer revenue contribution can rise because of concentration or large orders
        and is not a substitute for customer or revenue retention.
      diligencePath: >-
        Request quarterly customer cohorts for 2023 through Q1 2026, with beginning revenue,
        churn, contraction, expansion, new revenue, and ending revenue reconciled to reported
        revenue.
      relatedQuestionRefs: [QU004, QU005]
    - type: private-evidence-only
      severity: material
      topic: channel-concentration
      missingEvidence: >-
        Revenue concentration, inventory, sell-through, end-customer mapping, order cadence, and
        attrition for the system-integrator network.
      whyItMatters: >-
        The integrator channel provides most revenue, so aggregate integrator counts do not reveal
        economic dependence, dormant relationships, or end-customer overlap.
      diligencePath: >-
        Obtain integrator-level revenue and order histories, identify common end customers, and
        sample-check sell-through, inventory, implementation quality, and renewal behavior in the
        largest regions.
      relatedQuestionRefs: [QU005, QU006]
