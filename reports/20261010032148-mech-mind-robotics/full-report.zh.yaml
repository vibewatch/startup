      - number: '7.3'
        title: 运营失效模式、硬件质量与技术颠覆
        blocks:
          - type: paragraph
            body: >-
              光学视觉和机器人操作在汽车焊接线、电子装配及高吞吐物流枢纽都需要严格的运行时间。全球安装超过 30,000 台工业 3D 相机后，Mech-Mind
              面临光学传感器老化、环境眩光、镜头污染和工厂振动等运营风险。维持竞争优势需要持续重投技术；公司仅 FY25 研发投入就达 113 million
              yuan，超过不计研发支出的经营亏损。与此同时，主要制造业的资本开支周期性使视觉引导自动化工作单元需求波动，公司必须保持灵活产品发布节奏，避免硬件和算法过时。
            claimRefs:
              - CR008
              - CR011
