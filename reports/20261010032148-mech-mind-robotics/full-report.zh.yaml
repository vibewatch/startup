      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 上游组件供应商与人形平台的分化
            body: >-
              具身 AI 正出现一条关键结构分界：Mech-Mind 等模块化上游供应商，与 Unitree、Galaxy Universal
