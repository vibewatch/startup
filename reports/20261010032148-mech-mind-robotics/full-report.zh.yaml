            title: 成熟客户的极高集中度
            body: 存量客户贡献 Mech-Mind 2026 年一季度收入的 86%，高于 2023 年的 61%。客户单体部署增加虽代表利用率扩张，但如果主要汽车或电子制造商削减年度自动化预算，业务将面临严重下行风险。
            calloutType: risk
            claimRefs:
              - CR004
