        - Sony 机器视觉 CMOS 与激光发射器
        - 利用结构光和激光片三角测量采集 2D/3D 光学传感器数据
        - 全球半导体和光学组件供应商
        - 暴露于专业高端 CMOS 传感器和精密光学镜片供应链
      - - 硬件封装
        - IP65 铝制外壳与热耗散
        - 保护光电元件免受车间粉尘、进水和环境热量影响
        - 机械外壳和工厂环境温度（<45°C）
        - 在未配备空调的高温铸造厂中，被动冷却限制热耗散
      - - 边缘计算平台
        - 工厂 IPC（Windows 11 / 工业 PC）
        - 执行视觉处理、点云重建和轨迹生成
        - 主机操作系统、CPU/GPU 硬件和内部总线驱动
        - 已有文档显示，长时间执行多项目时 IPC 性能滞后且内存饱和
      - - 算法层
        - 抗反射与点云融合
        - 缓解亮金属、深色零件和透明塑料上的多径散射
        - 针对 GPU/CPU 加速优化的专有 AI 算法
        - 复杂的多曝光点云融合增加每帧采集的计算延迟
      - - 机器人集成
        - Mech-Viz 驱动与运动学求解器
        - 将视觉目标位姿转换为机器人运动指令并执行碰撞检查
        - 第三方工业机器人控制器（ABB、KUKA、Fanuc、Yaskawa 等）
        - 机器人 OEM 固件更新可能破坏运动学仿真绑定和现场通信
      - - 应用部署
        - 图形化步骤流程与向导式配置
        - 允许非编码操作员配置视觉流程和抓取策略
        - 受训现场部署技术员和区域系统集成商
        - 处理非标准定制工件时经常需要资深 SI 手工编写脚本
    notes: 风险评估基于供应商技术文档、硬件数据表及官方社区故障排查通知。
