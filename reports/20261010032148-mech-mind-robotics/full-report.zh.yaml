      - number: '8.3'
        title: 情景建模、估值倍数与同业敏感性
        blocks:
          - type: paragraph
            body: >-
              为设定有纪律的入场参数，我们按未来 12 个月建模三种经营情景。乐观情景（概率 20%）下，Mech-Mind 延续海外增长势头，2026 财年收入增长 75% 至 RMB 680
              million，海外收入占总收入超过 60%。在这一轨迹下，经营杠杆将亏损收窄至盈亏平衡，支撑 22x 远期 P/S 溢价倍数，对应 HK$16.5 billion 的股权估值（每股 HK$132.00，潜在上涨
              48%）。基准情景（概率 55%）下，国内汽车和电子行业资本开支保持克制，2026 财年收入增长 50% 至 RMB 585 million。毛利率维持在约 65%，但持续的研发投入使调整后净亏损约为 RMB
              50 million；按 14x 远期倍数计算，合理股权估值为 HK$9.0 billion（每股 HK$72.00，较当前交易价格下行 19%）。悲观情景（概率
              25%）下，国内价格竞争加剧、出口摩擦增多，收入增长放缓至 25%（RMB 485 million），综合毛利率压缩至 52%，远期销售倍数降至 8x，估值为 HK$4.3 billion（每股
              HK$34.00）。按概率加权的预期估值为 HK$9.33 billion（较市价低 17%），在当前二级市场报价下，潜在投资者面临不利的风险收益不对称。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV007
