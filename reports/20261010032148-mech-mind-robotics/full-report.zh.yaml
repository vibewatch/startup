  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与软硬件模块化技术栈
        blocks:
          - type: paragraph
            body: >-
              Mech-Mind Robotics
              提供一体化“Eye-Brain-Hand”工业自动化架构，旨在解决高混合制造和仓储中传统机器视觉的固有限制。在客户流程中，“Eye”硬件层生成校准后的三维点云和高分辨率光学数据，可处理复杂几何体、高反光金属、吸光深色工件及透明包装，这些场景会让传统
              2D 相机失效。传感器硬件包括 Mech-Eye 工业结构光 3D 相机系列（如 Mech-Eye PRO S/M、Mech-Eye NANO、旗舰 Mech-Eye ULTRA M-GL）、Mech-Eye
              3D Laser Profilers（包括 LNX-7580-GL 和 LNX-8080-GL），以及 Mech-Eye AIC-Lite 2D 智能 AI
              相机系列。它们配套四部分“Brain”软件平台：Mech-Vision 用于图形化机器视觉流水线设计，Mech-DLK 用于本地深度学习模型训练和验证，Mech-MSR 用于尺寸测量和 CAD
              偏差分析，Mech-Viz 用于无碰撞机器人运动和轨迹规划。位于技术栈顶层的 Mech-Mind 还通过 Mech-Station 系列提供模块化、可直接生产的具身 AI 工作单元，尤其是用于上下料的
              Mech-Station InstaPick 和用于混合 SKU 拆垛的 Mech-Station InstaDepal，使工厂无需定制夹具或大量手写机器人代码即可部署自动化单元。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE008
