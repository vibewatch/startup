        - 提高信心前，要求经审计的 IPO 后 FY2026 现金流量表
      - - 风险评级
        - 高
        - 估值倍数高（追踪市销率超过 20 倍）、同业倍数收缩且工业资本开支具有周期性
        - 严格控制仓位，并针对宏观冲击建立止损纪律
      - - 估值立场
        - 估值偏高
        - IPO 后交易价为 HK$89.45，相对硬件自动化同业仍处溢价倍数
        - 入场前，监测倍数是否压缩至远期市销率 10–12 倍
    notes: 建议综合考虑 IPO 后市值（截至 2026 年 9 月 10 日为 HK$11.2B）、同业倍数、亏损收窄和披露透明度不足后得出。
    claimRefs:
      - CV001
      - CV008
      - CV010
      - CV011
      - CV014
  - id: TV002
    title: 多空投资论点评估
    columns:
      - 视角
      - 核心论点
      - 证据基础
      - 观点失效触发因素
    rows:
      - - 看多论点：视觉规模
        - Mech-Mind 是工业 3D 视觉领域成熟的市场领导者，已获得全球头部客户采用
        - 在约 50 个国家部署超过 30,000 台相机，拥有 100 多家《财富》全球 500 强客户
        - 季度相机出货速度放缓，或汽车 / 电动车客户流失
      - - 看多论点：经营杠杆
        - 收入快速扩张、海外收入占比提升，正在收窄经营亏损
        - 2025 年收入增长 44% 至 RMB 389M；海外毛利率达到 79%，国内为 50%
        - 海外毛利率压缩至 60% 以下，或亏损收窄趋势逆转
      - - 看空论点：估值倍数
        - 在依赖周期性硬件的行业中，追踪市销率超过 20 倍，几乎没有安全边际
        - 市值 HK$11.2B，而 FY2025 销售额为 RMB 389M 且仍在净亏损
        - 收入持续同比超高速增长超过 80%，同时实现 GAAP 经营盈利
      - - 看空论点：同业重估
        - 随着商业审视加剧，具身 AI 概念股面临二级市场大幅下调估值
        - Unitree 上市后股价下跌超过 50%；UBTECH 市值从高点腰斩
        - 全行业倍数重新扩张，监管明确性验证具身 AI 的收入模式
    notes: 结合 FY2023–FY2025 收入走势、H 股表现和具身智能商业化障碍评估上述论点。
    claimRefs:
      - CV003
      - CV006
      - CV008
      - CV009
      - CV011
      - CV012
      - CV013
  - id: TV003
    title: 牛市、基准与熊市情景预测
    columns:
      - 情景
      - 经营假设
      - 目标倍数与估值
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观情景
        - FY2026 收入增长 75% 至 RMB 680M；海外占比超过 60%；调整后净利率实现盈亏平衡
        - 22 倍远期市销率对应 HK$16.5B 估值（HK$132/share，+48% 上行空间）
        - 20% 概率；取决于海外机器人快速采用和头部汽车客户扩张
        - 中国机器人硬件面临关税壁垒，或国内电动车资本开支冻结
      - - 基准情景
        - FY2026 收入增长 50% 至 RMB 585M；毛利率维持在约 65%；调整后净亏损收窄至 <RMB 50M
        - 14 倍远期市销率对应 HK$9.0B 估值（HK$72/share，-19% 下行空间）
        - 55% 概率；反映工业自动化稳步扩张但定价压力持续
        - 持续亏损的季度表现，以及倍数向工业科技同业压缩
      - - 悲观情景
        - FY2026 收入增速放缓至 25% (RMB 485M)；国内价格战将毛利率压低至 50% 以下；现金消耗扩大
        - 8 倍远期市销率对应 HK$4.3B 估值（HK$34/share，-62% 下行空间）
        - 25% 概率；由宏观经济放缓、资本开支削减或关键客户流失触发
        - 客户集中度风险暴露、出口限制或国内激进降价
    notes: 情景估值基于 FY2026 收入运行率和同业市销率倍数，模拟未来 12 个月预期。
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV011
      - CV014
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间梳理从 2016 年公司成立、香港 IPO 到 2026 年商业规模化的发展里程碑。
    approximationNotes: null
    data:
      items:
        - label: 公司成立
          date: '2016'
          detail: Shao Tianlan 在北京 / 雄安创立公司，聚焦用于机器人的标准化 3D 视觉和机器智能。
          tone: neutral
        - label: A+ 轮融资
          date: '2019'
          detail: Qiming Venture Partners 独家投资 A+ 轮融资，建立早期机构支持。
          tone: positive
        - label: 全球子公司网络扩张
          date: '2023'
          detail: 在慕尼黑、东京、底特律和首尔设立运营子公司，服务国际自动化市场。
          tone: neutral
        - label: 标准化在线检测发布
          date: 2025-12
          detail: 发布集成硬件软件在线测量系统，搭载 Mech-Eye UHP-140-GL 相机和 Mech-Metrics。
          tone: positive
        - label: IPO 前部署里程碑
          date: 2026-06
          detail: 累计产品出货量超过 29,000 台，覆盖 50 个典型工业制造场景。
          tone: positive
        - label: 香港联交所 IPO
          date: '2026-09-01'
          detail: 以 HK$101.70 per share 在港交所主板（09615.HK）上市，市值达到 HK$12.71 billion。
          tone: positive
        - label: 上市后首份中期报告
          date: '2026-09-24'
          detail: 披露 H1 2026 收入 RMB 237.3M（同比增长 54.7%）、毛利率 65.0% 和复购率 93.9%。
          tone: neutral
        - label: 下游价格压力与增长阻力
          date: 2026-10
          detail: 披露调整后净亏损 RMB 52.5M，同时下游机器人本体制造面临激烈价格竞争。
          tone: warning
