      - number: '7.2'
        title: 监管监督、上市审查与地缘政治逆风
        blocks:
          - type: paragraph
            body: >-
              Mech-Mind 业务覆盖约 50 个国家和地区，FY25 海外市场贡献总收入的
              50.3%。快速全球化带来跨司法辖区监管摩擦，包括双用途出口管制、数据隐私治理和跨境商业合规方面的潜在审查。在中国内地，证券监管机构已评估对机器人和 AI 硬件企业设定更严格的 IPO
              资格门槛，强调经过验证的经常性软件收入，而非项目补贴。同时，创始人 Shao Tianlan 公开批评同业通过地方政府数据采集中心记录非经济性循环收入。Mech-Mind 按 HKEX
              上市规则维护正式合规披露和公司治理门户，但跨境地缘政治碎片化仍是无法对冲的系统性逆风。
            claimRefs:
              - CR005
              - CR009
              - CR010
              - CR014
