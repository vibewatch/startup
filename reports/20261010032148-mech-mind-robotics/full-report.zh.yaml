      - number: '7.4'
        title: 客户集中、利润率压缩与财务可持续性
        blocks:
          - type: paragraph
            body: >-
              Mech-Mind 收入高度集中于存量企业客户，相关收入占比从 2023 年 61% 升至 2025 年 78% 和 2026 年一季度 86%。CATL、BYD、Foxconn
              等一级工业客户持续复用产品，说明账户在扩张，但依赖集中工业客户群也使公司更容易受到资本开支冻结或客户自研自动化的冲击。毛利率还存在显著地域差异：2025 年海外毛利率 79%，中国仅
              50%，反映国内激烈价格竞争和利润率压缩。二级交易平台要求标准投资免责声明，强调历史运营扩张不能保证未来财务表现。
            claimRefs:
              - CR004
