      - number: '8.2'
        title: 投资论点与反论点评估
        blocks:
          - type: paragraph
            body: >-
              Mech-Mind 的核心投资逻辑建立在已验证的商业规模和差异化的海外利润结构之上。不同于依赖推测性原型的早期人形机器人或具身智能同业，Mech-Mind 已在约 50 个国家部署超过 30,000 台工业 3D
              相机，服务 100 多家《财富》全球 500 强企业，包括 CATL、BYD、Midea 和 Foxconn。收入从 2023 年的 RMB 181 million 增至 2024 年的 RMB 269
              million，再升至 2025 年的 RMB 389 million；2026 年第一季度收入同比加速增长 73.09%，达到 RMB 106 million。更关键的是，海外客户在 2025 年贡献了 79%
              的毛利率，而中国大陆客户为 50%，说明全球扩张能带来显著的定价权和毛利润提升。反方逻辑则强调估值倍数的脆弱性和全行业情绪恶化。公开市场上的具身智能同业经历了严重的估值重估：Unitree Robotics
              股价较上市后高点跌幅超过 50%，UBTECH 估值腰斩。此外，创始人 Shao Tianlan
              公开指责同业数据采集中心，凸显行业对收入质量的普遍审视；因此，在投入资金前，必须先证明工业软件和硬件在无外部补贴支撑下具备盈利能力。
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV008
