  - id: FV001
    title: 从商业进展到公开市场估值的决策逻辑流程
    type: flow
    summary: 这条逻辑链将工业部署规模、收入扩张、持续经营亏损和 IPO 后估值折价串起来，最终指向继续研究的判断。
    data:
      nodes:
        - label: 1. 工业规模与全球覆盖（30,000+ 台相机、100+ 家 F500 客户、约 50 个国家）
        - label: 2. 收入增长加速（2025 年收入 RMB 389M；2026 年 Q1 增长 73% 至 RMB 106M）
        - label: 3. 利润率不对称与地域差异（海外 GM 为 79%，国内 GM 为 50%）
        - label: 4. 持续现金消耗与净亏损（2025 年经调整净亏损 RMB 109M；2026 年 Q1 为 RMB 33M）
        - label: 5. 公开市场价格修正（IPO 价为 HK$101.7，跌至 HK$75.4；在市值 HK$11.2B 时交易价约为 HK$89.45）
        - label: 6. 建议立场：继续研究（等待经审计的 IPO 后 FY2026 报表及国内利润率扭转）
    approximationNotes: 这是根据已报告财务数据和 HKEX 上市首日交易表现综合出的顺序性投资决策逻辑。
