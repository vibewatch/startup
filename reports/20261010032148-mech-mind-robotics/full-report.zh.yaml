              Mech-Mind Robotics Technologies Co., Ltd. 于 2026 年 9 月以 09615.HK 代码在香港交易所上市，从高增长私有独角兽转为上市公司，募资 HK$2.35
              billion（$300 million）。上市巩固了资本化，但二级市场首日交易即显现估值波动：股价从 HK$101.70 至 HK$107.70 的发售区间滑落至上市后 HK$75.40
              的低点，随后部分恢复。CLSA Limited 管理的二级市场稳价措施依法将在 2026 年 9 月 26 日到期，届时人为订单簿支撑消失，公开市场估值将直接暴露于机构交易情绪。尽管经调整净亏损从 FY23 的
              334 million yuan 收窄至 FY25 的 109 million yuan，持续现金消耗和整个机器人行业的估值压缩仍意味着较高的市场情绪风险。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
