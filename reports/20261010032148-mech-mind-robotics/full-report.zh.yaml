chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、成立背景与商业模式
        blocks:
          - type: paragraph
            body: >-
              Mech-Mind Robotics Technologies Co., Ltd. 于 2016 年成立，定位为工业具身人工智能组件提供商，聚焦标准化 3D
              视觉、机器视觉软件和机器人运动规划。公司总部位于北京和雄安，并在慕尼黑、东京、底特律及首尔设有国际运营子公司，推动全球商业落地。Mech-Mind
              不制造定制机械臂，也不是工程投入很重的定制系统集成商，而是提供模块化“Eye-Brain-Hand”软硬件产品平台。平台包括用于光学感知的 Mech-Eye 工业 3D 相机和轮廓仪、用于智能决策的
              Mech-Vision 与 Mech-Viz 软件平台，以及专用机器人操作工具。公司于 2026 年 9
              月在香港交易所上市后作为商业上市公司运营，通过标准化硬件出货和配套企业软件许可变现。公开市场披露和商业登记文件将其与名称相近的海外自动化企业区分开来，显示 Mech-Mind
              是亚洲及全球机器人视觉组件领域的独立市场领导者。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO016
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
      - number: '1.2'
        title: 高管领导、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              公司管理核心是创始人、董事长、执行董事兼 CEO Shao Tianlan；他自 2016 年创立公司以来一直主导技术路线。Shao
              开创了“智能胜于形态”的核心产品理念，把架构资源投向感知、决策算法和操作能力，使系统能适配多种机械形态，而不是自建专有机器人本体。公司治理遵循香港交易所第 18C 章专业科技公司上市指引，并接受包括 Qiming
              Venture Partners 在内的主要机构支持者监督。Shao 对核心技术战略、具身智能研究方向和商业伙伴联盟的依赖仍较集中，但德国、美国、日本和韩国业务单元已设立区域总经理，运营去中心化有所推进。
            claimRefs:
              - CO005
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
      - number: '1.3'
        title: 资本化、香港上市与商业规模
        blocks:
          - type: paragraph
            body: >-
              2026 年 9 月 1 日，Mech-Mind 以股票代码 09615.HK 在香港交易所主板上市，完成重要资本化里程碑。全球发售价为每股 HK$101.70，上市初始市值为 HK$12.71
              billion（约 $1.63 billion USD）。上市前，Qiming Venture Partners 等风险资本伙伴提供机构支持；Qiming 于 2019 年独家领投 Mech-Mind 的 A+
              轮融资，并保留 IPO 前 7.38% 股权。在截至 2026 年 6 月 30 日的上市后首份财务业绩中，公司总收入为 RMB 237.3 million（$35.4 million USD），同比增长
              54.7%；新商业合同订单同比增长 75.3% 至 RMB 335.4 million，未履行订单积压升至 RMB 176.5 million。累计硬件和相机出货量超过 30,000 台，覆盖 1,600
              家全球客户，包括 CATL、BYD、Midea 和 Foxconn 等大型制造企业。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO007
      - number: '1.4'
        title: 运营里程碑、技术执行与不利压力
        blocks:
          - type: paragraph
            body: >-
              Mech-Mind 在汽车和电子检测等高要求流程中快速实现产品化，推出 100% 在线测量系统，每个测量点耗时两秒、偏差低于 0.2 millimeters。标准化软硬件集成使整体毛利率从 2023 年的
              39.1% 提升至 2026 年上半年的 65.0%；欧洲、北美、日本和韩国业务贡献总收入的 41.9%，海外毛利率为 81.4%。但公司也面临明显运营逆风：上半年研发投入达 RMB 80.1
              million，同比增加 72.9%，导致经调整净亏损 RMB 52.5 million（$7.8 million USD）。同时，下游工业机器人本体厂商的激烈价格战和产品同质化威胁组件定价权，而 AI
              视觉引导机器人在全球工业中的渗透率仍约为 5.1%。
            claimRefs:
              - CO013
              - CO014
              - CO015
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO015
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 标准化模式带来经营杠杆和高复购
            body: >-
              与需要专门现场团队承接定制工程项目的传统工业机器人集成商不同，Mech-Mind 的标准化“Eye-Brain-Hand”软硬件架构可将部署周期从数月压缩至数日。该产品化模式支撑了 2026 年上半年 93.9%
              的复购率，同时毛利率达到 65.0%。
            calloutType: insight
            claimRefs:
              - CO011
              - CO012
          - type: callout
            title: 研发投入与下游市场商品化导致持续亏损
            body: >-
              Mech-Mind 2026 年上半年经调整净亏损 RMB 52.5 million，战略研发支出同比增长 72.9% 至 RMB 80.1
              million。虽然公司的组件定位避开了机器人本体的直接竞争，但下游机器人制造商严重同质化和价格下滑，仍带来长期采用及定价风险。
            calloutType: risk
            claimRefs:
              - CO013
              - CO014
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与支出类别
        blocks:
          - type: paragraph
            body: >-
              Mech-Mind Robotics 所处商业市场聚焦工业 3D 视觉、AI 感知软件和智能机器人引导，而非通用自动化硬件或完整机器人操作器。核心支出包括高分辨率 3D
              相机、结构光传感器、工业激光轮廓仪、深度学习算法，以及用于编排关节式机械臂的智能运动规划软件；通用工厂监控软件、老式 2D
              条码读取器和非智能机械输送不在可服务支出范围内。公司提供感知与规划一体化技术栈，服务于高混合制造和物流流程，包括随机拣选、混箱拆垛、精密件拣选及在线尺寸检测，以替代僵化的定制工装和容易出错的人工劳动。
            claimRefs:
              - CM001
              - CM002
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM009
      - number: '2.2'
        title: 市场规模与受证据约束的收入规模
        blocks:
          - type: paragraph
            body: >-
              估算具身 AI 机器人可服务市场时，必须把广义工厂自动化预测与已验证的工业支出分开。尽管自动化 headline 估计覆盖数千亿美元全球资本开支，3D
              机器人视觉和智能引导这一细分市场仍是快速扩张的高毛利子集。Mech-Mind 已披露财务数据提供了具体收入基准：全年收入从 2023 年 RMB 181 million 增至 2024 年 RMB 269
              million、2025 年 RMB 389 million；经调整净亏损则从 RMB 334 million 收窄至 RMB 109 million。2026 年上半年收入为 RMB 237.3
              million，同比增长 54.7%，毛利率升至 65.0%，订单积压增长 102.0% 至 RMB 176.5 million。海外客户贡献 2025 年收入约一半，毛利率为
              79%，说明全球制造中心相较中国国内安装项目拥有更强溢价能力。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM011
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM011
      - number: '2.3'
        title: 买方细分与采购路径
        blocks:
          - type: paragraph
            body: >-
              企业采用 3D
              视觉系统主要集中在汽车制造、物流和电商仓储、电动车电池生产及精密电子领域。采购通常由负责工厂现代化预算的自动化工程师和运营总监推动，最终由制造副总裁或供应链高管签字。由于工业客户要求高运行可靠性和低集成风险，系统集成商及机器人原始设备制造商成为不可或缺的渠道中介。当视觉单元在反光或不规则表面上实现每小时最多
              1,200 件的稳定吞吐后，客户留存显著提升；Mech-Mind 在超过 100 家 Fortune Global 500 客户中的 2026 年上半年复购率为 93.9%，印证了这一点。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: 采用驱动因素、资本开支周期与商业化风险
        blocks:
          - type: paragraph
            body: >-
              制造业长期缺工、主要出口中心工资上涨，以及电池和汽车装配线的严格质量要求推动了采用。但若干逆风限制市场速度和厂商利润：工业视觉采购属于资本投资，对宏观下行和企业资本开支冻结高度敏感；机器人同业上市后估值大幅回撤，也加剧了二级市场怀疑；政府补贴的数据采集中心引发公开争议，有人指其可能人为抬高短期收入。Mech-Mind
              坚称收入严格对应真实工业交付，但持续经营亏损和漫长企业评估周期仍限制整体市场估值。
            claimRefs:
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 商业化现实：工业部署与补贴数据中心
            body: >-
              纯人形机器人初创公司依靠市政数据采集补贴及关联方合同来展示 headline 收入，而 Mech-Mind 的商业进展建立在可重复的工厂和物流部署上，累计出货 30,000 套、上半年复购率 93.9%
              也对此形成验证。
            calloutType: insight
            claimRefs:
              - CM006
              - CM010
              - CM013
          - type: callout
            title: 资本开支周期与利润率分化
            body: 工业采用在结构上仍受制造业 Capex 周期牵引。2025 年海外毛利率为 79%，国内为 50%；宏观工厂放缓和企业试点周期拉长，持续给收入加速带来逆风。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与结构定位
        blocks:
          - type: paragraph
            body: >-
              工业机器人和具身人工智能竞争格局分为专业化上游组件供应商与下游全系统人形机器人开发商。Mech-Mind Robotics 主要是上游基础设施供应商，提供工业 3D
              相机（Mech-Eye）、机器视觉与机器人规划软件（Mech-Vision、Mech-Viz、Mech-DLK），以及 Mech-Hand
              灵巧夹爪等执行硬件。这一架构让工业机器人和自动化工作站能够在汽车、电子、物流和锂电池工厂执行复杂感知、规划和操作任务。相较之下，Unitree Robotics 和 UBTECH 等下游具身 AI
              同业开发完整机器人系统和人形平台。它们虽获得较高公众关注并进入二级市场，但收入高度依赖学术研究、教育和宣传展览，而非工业厂区部署。2025 年前三季度，Unitree Robotics 的人形机器人收入中
              73.6% 来自科研和教育，17.39% 来自商业娱乐或消费，仅 9.01% 来自制造检测、导览等工业应用。Mech-Mind
              则直接向工业集成商和企业制造商销售模块化视觉-大脑-手组件，避开全身人形机器人高资本负担和漫长商业验证周期。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
