  - id: FI001
    title: 收入模式桥接
    type: flow
    summary: 从工业感知组件到毛利和研发再投资的商业转化路径。
    data:
      nodes:
        - label: 1. 工业 3D 视觉传感器（Mech-Eye）
          detail: 向全球工业 OEM 和系统集成商销售标准化硬件相机
        - label: 2. 算法与软件捆绑（Mech-Vision / Viz）
          detail: 无需定制代码即可嵌入专有运动规划与深度学习软件
        - label: 3. 商业工作站部署
          detail: 已在物流、汽车、新能源和电子领域部署超过 30,000 台
        - label: 4. 全球分销网络
          detail: 17 个国际业务中心推动 H1 2026 海外收入占比达到 41.9%
        - label: 5. 合并收入实现
          detail: H1 2026 产生 RMB 237.3M 收入，同比扩大 54.7%，客户复购率为 93.9%
        - label: 6. 标准化毛利转化
          detail: 毛利 RMB 154.2M，毛利率 65.0%（海外毛利率 81.4%）
        - label: 7. 研发再投资与经营亏损
          detail: 研发投入 RMB 80.1M（占收入 33.8%），推动 H1 2026 经营亏损 RMB 77.45M
    claimRefs:
      - CI001
      - CI002
      - CI005
      - CI008
      - CI010
  - id: FE001
    title: Mech-Mind 具身 AI 全栈产品架构
    type: stack
    summary: 分层呈现 Mech-Mind 的软硬件一体化架构，覆盖物理感知、软件感知、机器人运动控制和交钥匙机器人工作站。
    data:
      layers:
        - label: 交钥匙机器人工作站
          name: Turnkey Robotic Workcell Layer
          detail: 预集成的具身 AI 应用站，包括用于上下料的 Mech-Station InstaPick，以及用于混合 SKU 物流拆垛的 Mech-Station InstaDepal。
        - label: 机器人轨迹规划
          name: Robot Control & Trajectory Planning Layer
          detail: Mech-Viz 智能机器人编程环境，支持自动碰撞检测、抓取规划和轨迹生成，覆盖 50 多个机器人品牌。
        - label: 视觉与计量软件
          name: AI Vision & Metrology Software Layer
          detail: 核心软件平台包括 Mech-Vision（图形化视觉流程）、Mech-DLK（深度学习训练）和 Mech-MSR（3D 测量与 CAD 比对）。
        - label: 光学 3D 与 2D 感知
          name: 3D & 2D Optical Perception Layer
          detail: 工业级物理感知产品组合，包括 Mech-Eye 结构光 3D 相机（PRO、NANO、ULTRA）、3D 激光轮廓仪（LNX 系列）和 AIC-Lite 2D AI 相机。
        - label: 边缘硬件与计算
          name: Edge Compute & Hardware Substrate Layer
          detail: 加固型 IP65 传感器外壳、高端 Sony 机器视觉 CMOS 传感器、以太网通信接口和车间级工业个人计算机。
        - label: 外部机器人执行器
          name: Industrial Manipulator & Actuation Layer
          detail: 主流机器人 OEM 提供的实体四轴、六轴和桁架机器人（如 KUKA、ABB、Fanuc、Yaskawa）执行视觉引导轨迹。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE008
  - id: FU001
    title: 客户采用与扩张闭环
    type: journey-map
    summary: 已披露路径从直接用例验证走向由集成商主导的复制，但客户层面的转化率和留存率尚未公开。
    data:
      items:
        - label: 识别自动化需求
          detail: 直接客户或集成商识别工厂或仓库用例。
          touchpoints:
            - 一线销售
            - 集成商网络
        - label: 验证应用
          detail: Mech-Mind 开展现场测试、概念验证或应用联合开发。
          touchpoints:
            - 技术评估
            - 概念验证试验
        - label: 完成初始部署
          detail: 交付产品，并在需要时提供调试服务。
          touchpoints:
            - 安装
            - 调试
        - label: 标准化应用
          detail: 将硬件、软件和配套文档打包，以便复制推广。
          touchpoints:
            - 调试手册
            - 软件配置
        - label: 赋能系统集成商
          detail: 经过培训的集成商把 Mech-Mind 产品纳入更广泛的自动化系统。
          touchpoints:
            - 产品培训
            - 技术赋能
        - label: 复制推广与扩张
          detail: 集成商将产品卖到更多站点和场景，带来后续订单和交叉销售。
          touchpoints:
            - 重复订单
            - 新站点或新场景
    approximationNotes: 这是根据招股书还原出的定性机制；文件未披露各阶段转化率、耗时或共同样本。
    claimRefs:
