  - id: TE002
    title: 工业机器人视觉应用场景与运营工作流表
    columns:
      - 用户任务 / 应用
      - 传统人工 / 视觉工作流
      - Mech-Mind 解决方案架构
      - 可量化运营收益
      - 技术限制 / 边界
    rows:
      - - 混合 SKU 拆垛与码垛
        - 人工卸货，或要求为每个箱子建立 CAD 模型的刚性视觉方案
        - Mech-Eye LSR/ULTRA + Mech-Vision + Mech-Viz + InstaDepal 工作单元
        - 无需逐个 SKU 预注册，即可自主处理纸箱和袋装物
        - 变形或破损、内部散装物移位的袋子可能导致吸取失败
      - - 金属零件深料箱拣选
        - 人工上料，或容易卡料的机械振动盘上料机
        - Mech-Eye ULTRA M-GL + Mech-Viz 动态无碰撞路径规划
        - 可靠拣选反光及黑色钣金件，并清理深料箱
        - 搜索深容器中被遮挡的角落时，循环时间会增加
      - - 高精度汽车料架装载
        - 定制精密机械夹具配合人工刚性对齐
        - Mech-Eye NANO + AIC-Lite 2D AI 相机二次定位
        - 定位精度最高 ±0.5 mm；减少定制工装夹具支出
        - 料架挂钩严重变形、超出相机容差时需要人工介入
      - - 高速小型五金件分拣
        - 人工操作员分拣，容易疲劳和放置错误
        - Mech-Eye 3D 相机 + Mech-Viz 实时角度计算和路径生成
        - 黑色和亮面螺栓的分拣循环时间最低可达每件 1.7 s
        - 受机器人实际负载和机械夹具加速度上限约束
      - - 在线胶条与结构密封检测
        - 后处理离线坐标测量机（CMM）抽样
        - Mech-Eye LNX-8080-GL 3D 激光轮廓仪 + Mech-MSR 检测软件
        - 按产线节拍进行 100% 在线检测，测量胶条宽度 / 高度和气泡
        - 高抛光铬表面的透明胶可能产生折射噪声
      - - 汽车车身 / 零件在线尺寸计量
        - 人工量规检查或抽样 CMM 检测，时间开销高达 90%
        - 双相机 Mech-Eye LNX-7580-GL 轮廓仪 + Mech-MSR CAD 比对
        - 每个测量点的检测循环时间约 2 秒；在线覆盖率 100%
        - 高速激光扫描需要严格隔离环境振动
    notes: 运营工作流基准和吞吐量主张来自公司在 Automate 和 Automation World 2026 上的现场演示及案例简报。
