      - number: '5.2'
        title: 运行架构与机器人引导流程
        blocks:
          - type: paragraph
            body: >-
              Mech-Mind 方案的核心机制是在本地工业个人电脑（IPC）上运行的感知到执行流水线，并直接连接工业机器人操作器。自动化循环开始后，Mech-Eye
              结构光相机或激光轮廓仪扫描工件场景，利用板载光学硬件和抗反光图像融合算法过滤超过 15,000 lux 的工厂环境光，并抑制光学多径反射。原始 3D 点云进入
              Mech-Vision，由预配置算法执行空间点云过滤、3D 分割、目标特征提取和 6-DoF 姿态估计，无需手写脚本。面对皱袋或混合 SKU 物流包裹等非结构化、会变形或高度变化的物体时，Mech-Vision
              调用通过 Mech-DLK 训练和优化的推理模型。确定组件坐标系和姿态后，Mech-Viz 接收目标姿态，动态模拟机器人运动学，计算最优抓取角度，并为超过 50
              个主流机器人品牌生成无碰撞路径。在高速小件处理和机床上下料场景中，这一闭环可将单件拣选周期压至 1.7 seconds；使用 AIC-Lite 进行挂架二次定位时，重复精度最高可达 ±0.5 mm。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE009
          - type: table
            tableRef: TE002
