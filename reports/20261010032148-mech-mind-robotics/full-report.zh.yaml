              - CV014
      - number: '8.4'
        title: 公开市场催化剂、尽调重点与论点失效触发条件
        blocks:
          - type: paragraph
            body: >-
              作为刚在香港交易所上市的发行人，Mech-Mind 的投资逻辑将在未来两个至四个季度接受具体监管和经营披露里程碑的检验。尽调必须聚焦三个主要验证方向。第一，投资者需要审阅即将发布的 2026
              财年中期及年度财务披露，确认经审计的经营净现金流、研发费用资本化率和 IPO 后实际现金余额，以判断 HK$2.35 billion
              的募资总额能否提供不受限制的多年资金储备。第二，商业跟踪必须监测海外收入增长的可持续性，并验证国际毛利率在地缘政治和关税不确定性下仍能稳定高于
              70%。第三，必须厘清客户续约、净留存率以及硬件与软件的利润结构，判断 Mech-Mind 能否从项目制视觉供应商转型为一体化具身智能平台。明确的论点失效触发条件包括：(1)
              任一季度亏损收窄轨迹逆转，导致年化调整后净亏损超过 RMB 150 million；(2) 国内毛利率降至 45% 以下，表明产品严重同质化；或 (3) 监管或客户诉讼影响面向北美或欧洲汽车客户的海外发货。
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV009
              - CV014
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 投资立场：按上市初期倍数继续研究
            body: >-
              Mech-Mind 的工业规模（已部署 30,000+ 台相机）和海外利润溢价（79% GM）验证了真实客户需求，但二级市场 HK$11.2 billion 的交易估值对应超过 20x 历史收入的溢价倍数。在
              IPO 后经审计财务报表验证利润率能持续扩张并实现经营盈亏平衡前，投资者应保持继续研究的立场。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV009
              - CV011
              - CV014
          - type: callout
            title: 具身智能行业估值重估与价格压力带来的下行风险
            body: >-
              Unitree 和 UBTECH 等具身智能同业上市后的大幅收缩，凸显其容易受到宏观估值倍数压缩的影响。此外，如果工业自动化资本开支持续受限，中国制造业长期的国内价格压力可能侵蚀 Mech-Mind 50%
              的国内毛利率。
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV012
