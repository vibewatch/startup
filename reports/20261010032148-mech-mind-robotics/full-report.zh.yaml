      - number: '3.2'
        title: 竞争者画像、技术差异化与收入模式
        blocks:
          - type: paragraph
            body: >-
              机器视觉与具身机器人领域的直接及相邻竞争者，在市场进入策略和资本配置上差异明显。由清华和 Stanford 校友 Wang He 联合创立的 Galaxy Universal Robotics，开发名为
              Galaxy Star Brain 的端到端具身大模型，以及 Galbot G1、S1、ET1 等轮式和人形机器人平台。Galaxy Universal 曾瞄准 CATL、Bosch、Toyota、BAIC 和
              SAIC 等工业客户，也参与数据采集中心合作。中国具身 AI 行业一直争论：由地方政府和投资者资助的数据采集中心，究竟能产生真实商业回报，还是通过循环采购设备和回购数据制造暂时性账面收入。Mech-Mind
              管理层公开强调，公司来自市政数据采集中心的收入为零，而是聚焦 Fortune Global 500 制造和物流客户的商业部署。公司称全球累计出货超过 30,000 台工业相机和 27,000 套
              Eye-Brain-Hand 产品。在海外市场，Mech-Mind 在先进抓取领域与 Soft Robotics 等自动化厂商竞争，在自主感知领域与 Intelligent Flying Machines
              等组件创新者竞争。但标准工业 2D/3D 机器视觉竞争仍很激烈，既有视觉厂商拥有成熟分销网络，硬件集成门槛也更低。
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP008
              - CP009
              - CP010
      - number: '3.3'
        title: 转换成本、定价动态与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              工业机器视觉和机器人操作的转换成本来自软件集成、定制夹具校准及工厂产线认证。Mech-Mind 将 Mech-Vision 和 Mech-Viz 嵌入工厂自动化单元，汽车或电池产线完成认证后便形成运营锁定。公司
              2025 年海外毛利率为 79%，中国为 50%，显示其海外定价能力更强，也反映国内视觉厂商和系统集成商之间的价格竞争。另一方面，公司仍面临明显商品化风险和公开市场估值压力。2026 年 9 月 1
              日在香港交易所上市、发行价为每股 HK$101.70 后，股价迅速波动，到 2026 年 10 月 9 日盘中低至 HK$75.25，较发行价下跌近 20% 至 26%。同业二级市场表现也承压：Unitree
              Robotics 市值较上市后峰值约减少 2.4 trillion yuan，UBTECH 股价在 2026 年内腰斩。这些估值收缩说明公开市场投资者要求可持续、可重复的工业收入，而非投机性的具身 AI 倍数。
            claimRefs:
