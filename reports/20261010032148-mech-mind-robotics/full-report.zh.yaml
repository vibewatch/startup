          - type: callout
            title: 跨境利润率差异指向国内价格竞争
            body: Mech-Mind 2025 年海外出货毛利率为 79%，中国内地为 50%。随着海外收入占比达到总收入的 50.3%，守住海外渠道并缓解跨境监管摩擦，是维护集团盈利能力的关键。
            calloutType: insight
