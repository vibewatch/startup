  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 管理层建议与估值立场
        blocks:
          - type: paragraph
            body: >-
              Mech-Mind Robotics 于 2026 年 9 月 1 日以 09615 股票代码在香港交易所完成 IPO，标志着公司从风险投资支持的独角兽转为上市工业科技供应商。公司发行 23,140,590 股
              H 股，定价处于市场推广指示区间上限，每股 HK$101.70，募集最高 HK$2.35 billion
              总额。上市为持续研发和全球业务扩张提供了充足的流动资产负债表缓冲，但早期二级交易显示投资者仍持审慎态度。Mech-Mind 股价首日跌破 HK$101.70 发行价，盘中低至 HK$75.40，随后于 2026
              年 9 月 10 日稳定在每股约 HK$89.45，对应总市值约 HK$11.2 billion。按这一估值，公司企业倍数超过过去十二个月收入的
              20x，在竞争日益激烈的工业机器人市场中已计入激进增长预期。我们启动覆盖并给出“继续研究”建议及估值偏紧立场，在真实技术规模与估值纪律之间保持平衡判断。
            claimRefs:
              - CV001
