  - id: FP001
    title: 工业感知与具身 AI 竞争定位图
    type: quadrant
    summary: 以序数比较感知与任务专业化程度，以及工业资质和商业规模。
    data:
      points:
        - label: Mech-Mind Robotics
          x: 8.5
          'y': 8.5
          detail: 工业资质高，已部署超过 30,000 台相机；聚焦上游 Eye-Brain-Hand 架构。
        - label: Unitree Robotics
          x: 4
          'y': 7.5
          detail: 硬件产量高，但工业渗透率低（73.6% 收入来自教育 / 研究）。
        - label: Galaxy Universal
          x: 5.5
          'y': 4
          detail: 基础模型与人形机器人平台先进；工业资质尚处早期，数据中心收入存在争议。
        - label: UBTECH Robotics
          x: 4.5
          'y': 6
          detail: 服务机器人与人形机器人领域的公开先行者；重工业制造收入占比有限。
        - label: Soft Robotics
          x: 7
          'y': 5
          detail: 软体抓取任务专业化程度高；相较主要机器视觉供应商，工业部署规模中等。
        - label: 传统机器视觉现状
          x: 9
          'y': 9
          detail: 在工厂产线中的工业资质最深；切换成本高，但视觉技术栈僵化且依赖规则。
      xAxis:
