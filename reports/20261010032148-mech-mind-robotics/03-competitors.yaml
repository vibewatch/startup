callouts:
  - calloutType: insight
    title: Divergence Between Upstream Component Providers and Humanoid Platforms
    body: |
      A critical structural divide in embodied AI is emerging between modular upstream suppliers like Mech-Mind and downstream humanoid builders like Unitree and Galaxy Universal. Upstream component suppliers generate recurring industrial revenues by solving discrete production bottlenecks (bin picking, depalletizing, quality inspection) for qualified manufacturing lines. Conversely, full-body humanoid platforms remain heavily dependent on academic laboratories, government demonstration projects, and controversial data collection centers, creating acute vulnerability when secondary markets demand recurring enterprise cash flows.
    claimRefs:
      - CP001
      - CP003
      - CP004
      - CP007
  - calloutType: risk
    title: Secondary Market Valuation De-Rating Across Embodied AI Sector
    body: |
      Public market investors in Hong Kong and mainland China have aggressively de-rated embodied robotics listings in 2026. Mech-Mind's stock dropped below its HK$101.70 issue price to an intraday low of HK$75.25 within six weeks of its September 2026 debut, while Unitree Robotics and UBTECH suffered severe capital contractions. This broad de-rating indicates that public markets are enforcing rigorous scrutiny on industrial gross margins and unit economics, rejecting speculative embodied-AI hype.
    claimRefs:
      - CP011
      - CP015
      - CP016
