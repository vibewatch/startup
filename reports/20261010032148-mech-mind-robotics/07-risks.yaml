callouts:
  - calloutType: "risk"
    title: "Extreme Customer Concentration in Mature Accounts"
    body: "Existing customers generated 86% of Mech-Mind's revenue in the first quarter of 2026, up from 61% in 2023. While rising deployments per customer reflect expanding utilization, it exposes the business to acute downside should major automotive or electronics manufacturers trim annual automation budgets."
    claimRefs:
      - "CR004"
      - "CR012"
  - calloutType: "insight"
    title: "Cross-Border Margin Disparity Signals Domestic Price Competition"
    body: "Mech-Mind achieved a 79% gross margin on overseas shipments in 2025 compared to 50% within mainland China. As international revenue reaches 50.3% of the total, preserving overseas channel access and mitigating cross-border regulatory friction are paramount to defending group-level profitability."
    claimRefs:
