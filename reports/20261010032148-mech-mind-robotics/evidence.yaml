evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-historical-cash-burn
    missingEvidence: >-
      Audited pre-IPO historical cash burn rates, exact operating cash flow, and debt obligations prior to fiscal year
      2024 remain unreleased in interim public filings.
    whyItMatters: >-
      Prevents a complete multi-year longitudinal assessment of cash runway efficiency and capital consumption during
      early platform commercialization.
    diligencePath: >-
      Review full HKEX listing prospectus disclosures and upcoming audited annual report disclosures under HKEX 09615.HK
      compliance filings.
    relatedQuestionRefs:
      - QO008
  - type: enumeration-incomplete
    severity: minor
    topic: governance-and-stakeholder-coverage
    missingEvidence: >-
      Comprehensive register of pre-IPO venture cap table shareholdings beyond Qiming Venture Partners' disclosed 7.38%
      pre-IPO stake, alongside detailed employment agreements for regional subsidiary executives.
    whyItMatters: >-
      Limits detailed analysis of voting control, dilution mechanics, and board representation agreements among earlier
      institutional investors and key subsidiary leaders.
    diligencePath: >-
      Examine detailed substantial shareholder notices and executive compensation filings under HKEX disclosure of
      interests system.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Third-party audited market share breakdowns and standardized SAM/SOM sizing for industrial 3D robot vision
      separate from general automation.
    whyItMatters: >-
      Broad market estimates conflate 2D machine vision, complete robotic arms, and software licenses, making
      addressable market penetration hard to model precisely.
    diligencePath: >-
      Request management TAM/SAM models and customer cohort expansion data by industry vertical during post-IPO analyst
      disclosures.
    relatedQuestionRefs:
      - QM009
  - type: missing-source
    severity: minor
    topic: customer-metrics
    missingEvidence: Detailed churn and net revenue retention (NRR) percentage metrics for enterprise robot vision installations.
    whyItMatters: >-
      Repurchase rate of 93.9% demonstrates re-order propensity but does not verify net revenue retention or
      wallet-share growth across long-term deployments.
    diligencePath: >-
      Review subsequent periodic financial disclosures on HKEX for segmented recurring software and support revenue
      disclosures.
  - type: missing-source
    severity: material
    topic: competitor-margins
    missingEvidence: Audited line-item gross margins and customer churn rates for private embodied AI peers such as Galaxy Universal.
    whyItMatters: >-
      Prevents conclusive underwriting of whether competitors can sustain industrial pricing without municipal
      subsidies.
    diligencePath: >-
      Inspect eventual Hong Kong Stock Exchange prospectus disclosures from Galaxy Universal and private customer
      contract win-loss audits.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: integration-switching-costs
    missingEvidence: >-
      Empirical customer migration costs and software retraining duration when switching from Mech-Mind to alternative
      vision platforms.
    whyItMatters: Directly determines the structural durability of Mech-Mind's software moat and vulnerability to commoditization.
    diligencePath: >-
      Interview system integrators in automotive and battery sectors regarding the engineering hours required to
      substitute Mech-Vision with open-source or competitor vision tools.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited unit-level customer acquisition costs (CAC), payback periods, and net revenue retention (NRR) rates by
      geographic cohort.
    whyItMatters: >-
      Without granular customer payback and cohort retention metrics, underwriters cannot independently verify whether
      65% gross margins will translate into sustained operating leverage as international expansion scales.
    diligencePath: >-
      Request customer cohort retention schedules and detailed GTM commission and sales expenditure breakdowns from the
      issuer during diligence.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: hardware-failure-rates
    missingEvidence: >-
      Audited mean time between failures (MTBF) and field return/warranty rates across Mech-Eye cameras and LNX
      profilers operating in high-vibration manufacturing environments.
    whyItMatters: >-
      Field reliability under heavy industrial thermal cycling directly governs plant availability and warranty support
      costs.
    diligencePath: Request customer RMA service logs and factory maintenance telemetry during confidential technical diligence.
  - type: private-evidence-only
    severity: material
    topic: system-integrator-commissioning-cost
    missingEvidence: >-
      Empirical customer data detailing integration hours, custom end-effector tooling expenses, and non-standard line
      commissioning costs incurred alongside Mech-Mind hardware.
    whyItMatters: >-
      Total cost of deployment may be substantially higher than upfront hardware list prices if integration complexity
      remains high.
    diligencePath: Interview certified regional system integrators and review customer statement-of-work (SOW) documents.
  - type: enumeration-incomplete
    severity: material
    topic: named-customers
    missingEvidence: >-
      Customer-confirmed deployment status, site and unit counts, production-versus-pilot classification, realized
      outcomes, contract values, and current relationship status for the representative named customers.
    whyItMatters: >-
      Company-disclosed names and aggregate deployment metrics do not establish customer-level production use, realized
      ROI, or reference durability.
    diligencePath: >-
      Obtain a customer-level deployment schedule and interview procurement or operating owners at CATL, BYD, Midea, and
      Foxconn; reconcile responses to invoices, acceptance records, and support logs.
    relatedQuestionRefs:
      - QU003
      - QU009
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      NRR, GRR, logo churn, renewal rate, contract duration, order frequency, cohort retention, and expansion by direct
      customer and system integrator.
    whyItMatters: >-
      Existing-customer revenue contribution can rise because of concentration or large orders and is not a substitute
      for customer or revenue retention.
    diligencePath: >-
      Request quarterly customer cohorts for 2023 through Q1 2026, with beginning revenue, churn, contraction,
      expansion, new revenue, and ending revenue reconciled to reported revenue.
    relatedQuestionRefs:
      - QU004
      - QU005
  - type: private-evidence-only
    severity: material
    topic: channel-concentration
    missingEvidence: >-
      Revenue concentration, inventory, sell-through, end-customer mapping, order cadence, and attrition for the
      system-integrator network.
    whyItMatters: >-
      The integrator channel provides most revenue, so aggregate integrator counts do not reveal economic dependence,
      dormant relationships, or end-customer overlap.
    diligencePath: >-
      Obtain integrator-level revenue and order histories, identify common end customers, and sample-check sell-through,
      inventory, implementation quality, and renewal behavior in the largest regions.
    relatedQuestionRefs:
      - QU005
      - QU006
  - type: private-evidence-only
    severity: material
    topic: operational-reliability-metrics
    missingEvidence: >-
      Audited mean time between failures (MTBF), warranty claims rate, and component-level recall data for Mech-Eye 3D
      vision cameras in production manufacturing lines.
    whyItMatters: >-
      Direct operational failure data is critical to confirm whether hardware reliability matches company claims across
      30,000 deployed units.
    diligencePath: >-
      Request customer SLA reports, field incident logs, and warranty reserve accounting from Mech-Mind management
      during formal technical diligence.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR002
  - type: missing-source
