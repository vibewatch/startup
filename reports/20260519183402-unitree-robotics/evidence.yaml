evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: series-c-funding
    missingEvidence: Exact Series C amount and a reconciled lead-investor roster.
    whyItMatters: These facts anchor valuation history and influence ownership, signaling, and follow-on financing assumptions.
    diligencePath: >-
      Request the signed financing announcement, post-closing cap table, and board observer rights schedule from
      management.
    relatedQuestionRefs:
      - QO015
      - QO016
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board composition, CFO/COO bench, and any investor governance rights.
    whyItMatters: Key-person dependency and governance maturity cannot be underwritten from public materials alone.
    diligencePath: Ask for the latest board list, committee structure, and executive organization chart.
    relatedQuestionRefs:
      - QO006
      - QO025
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Audited revenue, current headcount, and region/channel mix beyond media summaries.
    whyItMatters: Cover metrics are needed by later chapters and today remain partly media-compiled.
    diligencePath: Request audited FY2024/FY2025 statements and monthly KPI packs covering shipments, revenue, and overseas mix.
    relatedQuestionRefs:
      - QO017
      - QO018
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: market-share
    missingEvidence: Independent methodology behind Unitree's share claims in quadrupeds and humanoids.
    whyItMatters: Share claims are strategically important but not yet fully reproducible from reviewed evidence.
    diligencePath: Obtain the underlying Yole or similar market-share tables and compare against IDC shipment datasets.
    relatedQuestionRefs:
      - QO023
  - type: private-evidence-only
    severity: material
    topic: ipo-prep
    missingEvidence: A directly accessible filing PDF and formal counseling materials.
    whyItMatters: Official filing text would clarify disclosure timing, entity scope, and any pre-IPO restructuring.
    diligencePath: Retrieve the filing from the regulator portal or management data room and preserve a human-readable copy.
    relatedQuestionRefs:
      - QO019
      - QO025
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: quadruped-market-size
    missingEvidence: >-
      A public global quadruped revenue figure or unit-forecast series comparable to IDC’s humanoid data is missing from
      the fetched set.
    whyItMatters: >-
