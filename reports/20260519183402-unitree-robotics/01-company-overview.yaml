- id: milestones-public-profile-and-risks
  title: Milestones, Public Profile, and Emerging Risks
  body: Unitree's milestone record is unusually public for a private robotics company. Official materials and independent reporting place it on the 2021 Spring Festival Gala stage, at the 2022 Winter Olympics opening, the 2023 Super Bowl pre-game show, the 2023 Asian Games, and CES 2025; TIME later named Unitree to the TIME100 companies list. These appearances serve both branding and commercial proof, especially because Unitree now spans consumer quadrupeds, developer-focused humanoids, industrial quadrupeds, and robot arms. Yet visibility cuts both ways. Humanoid Index compiles 1,000-plus employees and 5,500-plus 2025 shipments, while CnTechPost reports a 2026 target of 10,000-20,000 humanoids; these are useful scale signals, but not audited financial disclosures. More importantly, adverse evidence has emerged. The Wire China documents rising Washington scrutiny over Unitree's U.S. sales, and a 2025 arXiv paper alleges serious security and telemetry risks in the G1. Combined with still-unclear
    governance detail, those risks deserve to travel with the milestone story rather than sit outside it.
