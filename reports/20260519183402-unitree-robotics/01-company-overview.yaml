callouts:
- calloutType: risk
  title: Series C Precision Remains a Real Diligence Gap
  body: Unitree is clearly a late-stage private robotics company with IPO preparation under way, but the public evidence still does not settle the exact Series C amount or a fully confirmed investor roster. The right conclusion is not that the round is suspect; it is that the best-supported number is the post-money valuation range around RMB 12 billion / US$1.6–1.7 billion, while amount and lead-list precision remain open diligence items.
  claimRefs:
  - CO021
  - CO022
  - CO023
  - CO024
  - CO025
  - CO039
- calloutType: insight
  title: Open Source Is Part of the Company Story, Not a Side Project
  body: Unitree's GitHub footprint is unusually deep for a private hardware company and matters strategically. It supports the claim that the company is not just staging robots for viral demos; it is actively lowering the barrier for research and developer adoption around its hardware families, which in turn reinforces brand reach and future ecosystem leverage.
  claimRefs:
  - CO009
  - CO038
