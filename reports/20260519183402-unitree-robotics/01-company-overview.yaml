company:
  name: Unitree Robotics
chapter:
  number: 1
  title: Company Overview
  summary: Unitree Robotics is a Hangzhou-founded robotics company built around Wang Xingxing's low-cost commercialization thesis for legged robots. The strongest public evidence supports a 2016 founding, a broad product scope spanning quadrupeds, humanoids, arms, lidar and developer tooling, and a June 2025 Series C at roughly RMB 12 billion (about US$1.6-1.7 billion) post-money. Unitree's milestone record is unusually visible for a private hardware company — from CCTV galas to CES and GitHub — but the exact Series C amount, a fully confirmed investor roster, and deeper governance detail remain unresolved.
sections:
- id: identity-founder-story
  title: Identity, Founding Story, and Mission
  body: 'Unitree Robotics is consistently described across official and independent sources as a Hangzhou-based robotics company founded in 2016 by Wang Xingxing. The founding story matters because it explains the company''s commercial DNA: Wang told KrASIA that he built the XDog quadruped during graduate study, realized electric actuation could radically cut cost and improve agility, briefly joined DJI, then left after roughly two months to start Unitree in May 2016. That low-cost, fast-cycle thesis still shows up in today''s positioning. Official materials center the company on civilian robotics, describe a mission of technology-driven progress, and frame Unitree as building a broad platform of quadrupeds, humanoids, manipulators, and core components rather than a one-off demo product. The rhetoric is idealistic, but the consistent through-line is democratization through affordability and speed rather than bespoke research-only systems. That combination helps explain why Unitree shows up in both consumer and developer contexts.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO038
