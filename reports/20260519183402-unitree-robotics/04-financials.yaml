company:
  name: Unitree Robotics
chapter:
  number: 4
  title: Financials
  summary: Unitree's public financial picture supports real commercial traction but not full underwriting. The strongest evidence points to a hardware-led model spanning quadrupeds, humanoids, arms, components, and developer tooling, with visible list prices from roughly US$1.6K for Go2 and US$13.5K-16K for G1 to US$90K for H1, while B2 remains more quote-led. TechNode and The Robot Report both cite roughly RMB 1 billion / US$137-140 million of 2024 revenue, and later sources place Unitree at 1,000-plus employees, 5,500-plus 2025 humanoid shipments, and a 10,000-20,000 unit 2026 target — useful but still medium-confidence context rather than audited disclosure. Margins, cash, burn, debt, backlog, and realized ASPs remain undisclosed, so the chapter's financial verdict is that financing dependency and margin opacity still dominate the underwriting risk until filing-stage disclosure arrives.
sections:
- id: revenue-model-and-pricing
  title: Revenue Model and Pricing Architecture
  body: 'The public evidence strongly favors a hardware-led revenue model. Unitree sells consumer and industry quadrupeds, developer-facing humanoids, robot arms, lidar, and related tooling; KrASIA quoted Wang in 2021 saying the majority of revenue already came from robot sales, with only a minor portion from performances. That historical comment still fits the current catalog. TechNode adds an important segmentation clue: quadrupeds are aimed mainly at consumers, while humanoids are aimed at developers who modify perception and motion algorithms on top of Unitree hardware. The price ladder reinforces that segmentation. Go2 starts at US$1,600 on the official page and US$2,800 on the shop page; G1 is advertised at US$13.5K on the product page and US$16K on the shop page; H1 is listed at US$90K; STEMfinity lists Z1 arms at US$13,387.50; and B2 appears to sit in a quote-led industrial workflow rather than a fully transparent ecommerce path. Those are list anchors, not realized ASPs, because
    taxes, shipping, customs, channel discounts, and after-sales obligations are not disclosed.'
