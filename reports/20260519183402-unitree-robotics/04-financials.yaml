  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin
    missingEvidence: Manufacturing BOM, gross margin, service burden, and warranty reserve by product line.
    whyItMatters: Without these numbers, investors cannot tell whether Unitree's visible price ladder converts into durable contribution margin.
    diligencePath: Request audited segment margin data, current BOM snapshots, and service/warranty reserve history.
    relatedQuestionRefs:
    - QI016
    - QI025
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Cash on hand, monthly burn, any debt facilities, and management's next-round trigger.
    whyItMatters: Capital adequacy is the central underwriting question for a scale-up robotics manufacturer.
    diligencePath: Request latest cash balance, 13-week cash flow, debt schedule, and board-approved financing plan.
    relatedQuestionRefs:
    - QI016
    - QI017
    relatedTableRefs:
    - TI004
  - type: access-blocked
    severity: material
    topic: ipo-filing
    missingEvidence: Readable official IPO counseling materials or a formal prospectus.
    whyItMatters: The filing path is known, but direct document access was not cleanly recoverable in-session.
    diligencePath: Retrieve the regulator filing or data-room copy and reconcile it against media summaries before final underwriting.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: b2-pricing
    missingEvidence: A directly visible self-serve B2 price from an official or clearly auditable distributor page.
    whyItMatters: B2 likely sits at the high end of Unitree's ladder, but current direct evidence is quote-led rather than price-transparent.
    diligencePath: Ask sales for a signed B2 quote with configuration, freight, and after-sales terms.
    relatedQuestionRefs:
    - QI007
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Customer, geography, and product revenue mix plus backlog conversion data.
    whyItMatters: Without mix data, public shipment and price facts cannot be translated into a credible forecast.
    diligencePath: Request SKU-level sales mix, geography mix, and quarter-by-quarter booked-to-billed conversion metrics.
    relatedQuestionRefs:
    - QI023
    - QI025
    relatedTableRefs:
    - TI001
    - TI005
