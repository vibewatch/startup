callouts:
- calloutType: risk
  title: Visible Revenue, Invisible Margin
  body: Unitree has enough public evidence to show meaningful revenue and shipment momentum, but not enough to show whether that momentum converts into durable gross margin. In a robotics company, that gap is not cosmetic — it determines whether growth reduces financing risk or merely scales the cash burn that future investors must absorb.
  claimRefs:
  - CI014
  - CI015
  - CI023
  - CI024
  - CI041
  - CI042
- calloutType: insight
  title: Hardware Ladder Broadens Demand but Complicates Forecasting
  body: The same breadth that makes Unitree commercially interesting also complicates financial modeling. Low-cost quadrupeds, mid-priced developer humanoids, high-priced full humanoids, arms, components, and support all likely carry different ASP, margin, and support profiles. Without mix data, topline growth does not answer the profitability question.
  claimRefs:
  - CI012
  - CI025
  - CI026
  - CI031
  - CI032
