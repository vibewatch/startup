- id: capital-intensity-and-financing-dependency
  title: Capital Intensity and Financing Dependency
  body: 'Even without a published cash-flow statement, Unitree looks capital intensive. Selling robots rather than pure software means working capital, manufacturing scale, actuators, batteries, after-sales support, and channel economics all matter. Public materials do not disclose gross margin, cash, debt, or burn, so the central question is not whether Unitree has traction; it is whether that traction converts into self-funding economics before the next financing trigger. The capital timeline helps frame that risk. TechNode and Forbes anchor the June 2025 Series C around RMB 12 billion valuation; later eHangzhou and Global Times coverage describe active IPO-prep work and expected filing-stage disclosure. That sequence implies the company is still relying on external capital and public-market preparation to bridge the gap between visible product momentum and full financial transparency. The financing story is therefore credible but incomplete: there is a real valuation anchor, a real IPO
    path, and no hard public evidence yet on cash adequacy or margin structure.'
  claimRefs:
