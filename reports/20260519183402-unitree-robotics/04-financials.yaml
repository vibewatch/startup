- id: diligence-blockers-and-financial-verdict
  title: Diligence Blockers and Financial Verdict
  body: 'The chapter''s verdict is straightforward: Unitree has real commercial evidence, but margin visibility is still too weak for clean underwriting. The company clearly monetizes hardware, shows an unusually broad product ladder, and has enough reported revenue and shipment context to matter. But the missing variables are the ones that govern investability — BOM, service cost, warranty burden, channel discounts, backlog conversion, cash runway, debt, and actual disclosure from filing-stage documents. The accessible filing path itself is still imperfect in-session: the regulator-linked PDF route was identifiable but returned a 405 response to the fetch profile, which is a reminder that public coverage and primary disclosure are not the same thing. Until Unitree files or otherwise opens the data room, investors should treat public revenue and shipment numbers as directional proof of traction, not proof of quality. That makes financing dependency and unresolved unit economics the main
    blockers, even if the topline story remains compelling.'
