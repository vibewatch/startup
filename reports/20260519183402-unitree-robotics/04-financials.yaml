- id: public-traction-and-revenue-context
  title: Public Traction and Revenue Context
  body: 'Unitree has enough public traction signals to show it is not pre-commercial, but the sources still stop short of a clean financial model. TechNode reports that Unitree generated more than RMB 1 billion (US$137 million) of revenue in 2024, and The Robot Report relays the same rough number at about US$140 million. Humanoid Index adds 1,000-plus employees and 5,500-plus units shipped in 2025 as of February 2026, while CnTechPost reports Wang''s target of 10,000-20,000 humanoid shipments in 2026. The right way to use these figures is as medium-confidence context, not audited truth. They come from reputable reporting and aggregators, but not from financial statements. They also do not map neatly onto one another: 2024 revenue predates the cited 2025 humanoid shipment ramp, and Unitree sells far cheaper quadrupeds and peripherals alongside pricier humanoids. As a result, investors should resist the temptation to back into a single blended ASP or margin story from a few public figures.
    The public data show momentum, not full transparency.'
  claimRefs:
