companyProfile:
  summary: Unitree Robotics is a Hangzhou-based legged and humanoid robotics company founded in 2016 by Wang Xingxing. The company's strategy is to commercialize high-performance robots at materially lower price points than many western peers, while controlling more of the component stack in-house. Public evidence shows a broad lineup that now spans Go2 quadrupeds, B2 industrial robots, G1 and H1 humanoids, Z1 robotic arms, lidar, SDKs, and reinforcement-learning tooling. Unitree's products are sold directly and through developer-facing channels rather than existing only as lab prototypes, which distinguishes it from several richly valued humanoid peers. The company remains private and financially opaque, but it has enough public traction to be treated as a real operating robotics business rather than a concept-stage story.
  foundedDate: '2016-01-01'
  founders:
    - name: Wang Xingxing
      role: Founder, CEO, and CTO
      background: Built the XDog quadruped during graduate study, briefly worked at DJI, then started Unitree to pursue lower-cost commercialization of legged robots.
      claimRefs: [CO002, CO003]
  foundingLocation: Hangzhou, China
  headquarters: Hangzhou, China
  productSummary: Portfolio spans Go2 consumer/developer quadrupeds, B2 industrial quadrupeds, G1 and H1 humanoids, Z1 robotic arms, lidar, and open developer tooling including SDKs, ROS2 packages, and reinforcement-learning repositories.
  customerFocus: Research labs, developers, education, industrial inspection and automation users, public-event operators, and international distributors or integrators evaluating affordable legged and humanoid robots.
  businessModel: Primarily hardware sales supplemented by components, developer tooling, and related support/services; humanoids are positioned mainly for developers while quadrupeds address both consumer and industrial workflows.
  stage: Late-stage private (post-Series C, IPO-prep reported)
  fundingStatus: June 2025 Series C reportedly valued Unitree around RMB 12 billion (about US$1.6B-US$1.7B) with IPO preparation underway; exact proceeds and a fully reconciled investor roster remain unconfirmed in public sources.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO006, CO020, CO021, CO025, CO029, CI014, CI015]
