          - type: callout
            title: 中国顺风是运营性的，不只是话术
            body: 标准、测试基础设施和供应商密度缩短了从原型到现场部署的回路。中国政策姿态之所以对 Unitree 有价值，是因为它降低商业化摩擦，而不是因为政策本身证明终端市场需求。
