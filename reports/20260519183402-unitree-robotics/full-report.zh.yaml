            body: >-
              即便没有公开现金流量表，Unitree 看起来也资本密集。卖机器人而不是纯软件，意味着营运资本、制造规模、执行器、电池、售后支持和渠道经济性都很重要。公开材料没有披露毛利率、现金、债务或烧钱速度，所以核心问题不是
              Unitree 是否有牵引，而是这些牵引能否在下一次融资触发前转化为自我供血的经济性。资本时间线有助于界定这个风险。TechNode 和 Forbes 把 2025 年 6 月 Series C 轮锚定在约
              RMB 12 billion 估值；后续 eHangzhou 和 Global Times 报道描述了活跃的 IPO
              准备工作和预期申报阶段披露。这个顺序意味着，公司仍依赖外部资本和公开市场准备，来弥合可见产品动能与完整财务透明度之间的缺口。因此，融资故事可信但不完整：估值锚点真实，IPO
