      - number: '1.3'
        title: 融资、估值与 IPO 准备
        blocks:
          - type: paragraph
            body: >-
              目前最可靠的资本锚点不是投机性的 IPO 标题，而是 2025 年 6 月的 Series C 轮。TechNode 报道 Unitree 投后估值超过 RMB 12 billion（约 US$1.64
              billion），Forbes 独立报道为 RMB 12 billion（约 US$1.7 billion），The Robot Report
              也落在相同区间。关键限定是，具体融资额，甚至完整投资方名单都没有完全确认。TechNode 点名 China Mobile、Tencent、JinQiu Capital、Alibaba、Ant Group 和
              Geely；Forbes 验证了 Geely、Ant Group 和 HongShan；Humanoid Index 汇总该轮约 US$96 million；The Robot Report 则提到第三方估算接近
              US$97.6 million。这些信息在独角兽以上估值方向上相互印证，但还不够精确，不能把它当成已经坐实的股权结构表事实。已经坐实的是 IPO 准备：TechNode 称 CITIC Securities
              担任顾问，后续报道称申报准备正在推进，这意味着 Unitree 这家私有公司正走向更正式的信息披露。
