  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 分层地图与采购路径
        blocks:
          - type: paragraph
            body: >
              理解 Unitree
              的客户宇宙，最好把它看作一组公开证据簇，而不是一份披露清晰的收入分层。最强的证据簇是研究和开发者用户、教育相关买方、工业巡检前景客户、公共活动或媒体组织方，以及服务大学、公共安全和企业实验的西方分销商或集成商。研究和教育尤其突出，因为实验室和渠道伙伴反复点名这些场景，而且相对西方替代品，Unitree
              公开低价显著降低了实验室采购门槛。工业巡检经常出现在公司和分销商营销中，尤其围绕电力巡检和全地形移动，但独立具名运营方很少。公开活动证据很多——春晚、冬奥会、Super
              Bowl、亚运会、CES——但这些证据更多说明认知度和技术展示，而不是经常性客户经济性。采购路径也会按买方成熟度分裂：Go2 和部分 G1
              配置可以直接在线购买，或至少可以直接查看价格；更重载或更复杂的部署，则依赖授权分销商、培训、保修和集成支持。这种分裂塑造了几乎所有西方证据点。
