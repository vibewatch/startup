      - number: '2.4'
        title: 中国顺风真实存在，但采用约束仍然有效
        blocks:
          - type: paragraph
            body: >-
              Unitree 受益于两个异常强的顺风。第一，中国制造生态和密集供应商基础压缩组件成本和生产周期，帮助本土机器人厂商比许多西方同行更快商业化。第二，政策栈正在变得更明确：2026 年人形机器人与具身 AI
              国家标准、杭州“全球总部港”集群，以及已经把机器人视为战略基础设施的本土环境，都提高了更快本地测试、认证和采购的概率。这些不是抽象政策口号；它们在试生产、测试和供应链寻源中降低摩擦。


              但这些顺风并不会消除核心约束。IFR 仍警告，人形机器人近期并不是传统工业机器人的万能替代品。IDC 的 2025 年市场组合显示，行业真实需求中心仍比炒作周期暗示的更早期。Unitree
              还面临超出工程问题的信任摩擦：网络安全研究凸显了广泛攻击面，美国政治审查也已经在公共部门语境中把公司框定为安全风险。低价今天有助于赢单，但如果软件和服务尚未成熟、市场就先商品化，低价也可能预示未来毛利率压力。实际结论是，中国供应链和政策顺风会加快商业化节奏，但采用仍取决于具体工作流的
              ROI、安全信心，以及地缘政治上可接受的采购路径。
