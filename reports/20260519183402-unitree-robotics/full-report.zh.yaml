            body: >-
              作为人形机器人供应商，Unitree
              的销售路径异常开放。它直接在线销售，在公开代码库发布开发者工具；第三方报道称，其人形机器人面向会自定义运动和感知的开发者，而不是购买封闭黑盒的客户。这种开放降低了进入门槛，也解释了为什么 Unitree
              在研究、大学、公共安全试点和分销商主导的海外销售中有牵引。它也可能支撑了据报道 2025 年 5,500+ 台出货和公司 1,000+ 人员工规模。取舍在于，开放准入并不等于企业锁定。Agility 把
              Digit 包进 Arc 加服务 / 支持，Boston 强调 Orbit 集成和工业推广纪律，Figure / 1X 试图拥有封闭 AI
              或家庭用户体验。因此，公开渠道宽度看起来是优势，但也可能掩盖了高接触部署和售后支持中仍有多少工作回落到客户和分销商身上。Unitree
