      - number: '8.3'
        title: 含明确估值区间的乐观、基准和悲观情景
        blocks:
          - type: paragraph
            body: >-
              情景分析应锚定在公开收入下限上，而不是英雄式 TAM 捕获假设。合理乐观情景是假设 Unitree 把产品驱动的出货量转成工业和商业重复需求，同时保持海外渠道开放。在这种情况下，2028 年收入可能达到
              US$500M–US$800M，公司也许配得上约 6x–8x EV/revenue 区间，对应估值约
              US$3.0B–US$6.4B。该情景要求的不只是出货增长，还需要可信的需求质量改善，以及一些证据表明软件、服务或集成附加率在上升。


              基准情景更克制，也可能更接近当前公开证据。Unitree 继续增长，但组合仍以开发者、研究、表演和早期商业用途为主，而不是高质量工业 ARR。这支撑约 US$300M–US$450M 的 2028 年收入和约
              4x–6x 倍数，对应约 US$1.2B–US$2.7B。悲观情景假设地缘政治压缩、ASP 压力和低毛利硬件组合，把 2028 年收入压在约 US$180M–US$250M，并把倍数推向 3x–4x，估值约
              US$0.6B–US$1.0B。在当前约 US$1.6B–US$1.7B 的价格上，基准情景回报只是中等，悲观情景会亏本金；因此，这里价格纪律比行业兴奋更重要。
