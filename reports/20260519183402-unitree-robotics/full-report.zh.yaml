              Unitree 显然是一家正在准备 IPO 的后期私有机器人公司，但公开证据仍未坐实 Series C 轮的具体金额，也没有完全确认投资方名单。正确结论不是这轮融资可疑；而是证据最强的数字是约 RMB 12
