    approximationNotes: 流程综合了公开产品页、SDK README、RL 指南和应用模板说明，并非来自某个官方参考流程。
    data:
      nodes:
        - id: select-platform
          label: 选择机身平台和载荷
          type: input
        - id: setup-sdk
          label: 在 Ubuntu 上安装 SDK / ROS2 / 中间件依赖
          type: process
        - id: train-validate
          label: 在 RL Gym、Isaac Lab 或世界模型技术栈中训练或验证策略
          type: process
        - id: sim2real
          label: 通过 DDS / ROS2 接到真实机器人，并在目标工作流中测试
          type: decision
        - id: package-app
          label: 为 UniStore / 集成商部署打包应用或控制服务
          type: process
        - id: update-operate
          label: 运行机器人、推送 OTA 更新、打磨策略并循环
          type: output
      edges:
        - from: select-platform
          to: setup-sdk
          label: 选择 Go2、B2、G1、H1/H1-2 或 Z1
        - from: setup-sdk
          to: train-validate
          label: 连接中间件和仿真
        - from: train-validate
          to: sim2real
          label: 运行 play / sim2sim / deploy_real
        - from: sim2real
          to: package-app
          label: 沉淀可用行为
        - from: package-app
          to: update-operate
          label: 交付并维护
    claimRefs:
      - CE012
      - CE013
      - CE014
      - CE015
      - CE016
      - CE017
      - CE018
      - CE019
      - CE038
  - id: FE003
    title: 关键依赖图
    type: dag
    layout: wide
    summary: Unitree 的产品执行依赖纵向整合的机器人组件、外部计算生态、合作伙伴渠道，以及不断演进的标准和安全控制。
    data:
      nodes:
        - id: unitree-platform
          label: Unitree 具身平台
          detail: 中心节点，覆盖机器人、中间件和部署界面
          type: process
        - id: inhouse-components
          label: 自研电机 / 减速器 / 控制器 / 激光雷达
          detail: 支撑性能和成本的关键纵向整合主张
          type: input
        - id: gpu-compute
          label: 计算模块和 GPU 生态
          detail: Jetson Orin、Intel 计算、Isaac 环境和开发者硬件假设
          type: input
        - id: open-source-stack
          label: GitHub SDK / ROS2 / RL / 世界模型仓库
          detail: 开发者采用和第三方实验依赖这些资产
          type: input
        - id: testing-production
          label: 测试、试生产和标准基础设施
          detail: 从演示性能走向规模化部署的必要条件
          type: input
        - id: channel-support
          label: 分销商和集成商
          detail: 对西方市场的支持、培训和部署执行很重要
          type: input
        - id: safety-security
          label: 安全和网络安全控制
          detail: 公开证据最弱的一层，可能限制采用
          type: output
      edges:
        - from: inhouse-components
          to: unitree-platform
          label: 性能 + 成本基础
        - from: gpu-compute
          to: unitree-platform
          label: 训练 / 机载计算
        - from: open-source-stack
          to: unitree-platform
          label: 开发者开放面
        - from: testing-production
          to: unitree-platform
          label: 规模化 / 认证
        - from: channel-support
          to: unitree-platform
          label: 部署支撑
        - from: unitree-platform
          to: safety-security
          label: 采用瓶颈
