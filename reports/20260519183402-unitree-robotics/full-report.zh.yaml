      - number: '7.5'
        title: 缓释因素、剩余暴露与投资逻辑断裂触发点
        blocks:
          - type: paragraph
            body: >-
              Unitree 的缓释逻辑很直接：中国正主动支持人形机器人标准化和机器人产业集群，Unitree
              有真实销量和低定价，迭代快，开发者开放策略也让实验覆盖面很广。这些都是有意义的缓冲。但缓释之后，剩余暴露仍集中在四处。第一，政策：中国背景是美国采购禁令言论里无法修复的根因。第二，网络安全 /
              隐私：一次可信的漏洞或数据流发现，就可能立刻让买家犹豫。第三，客户证据：在 Unitree 展示具名、持续使用的工业客户之前，西方买家仍可把平台视为强大的研究工具，而非规模化企业系统。第四，估值时点：IPO
              重估或推迟会立刻检验规模叙事是否转成耐久经济性。这些才是最重要的监控点。投资人可以承受硬件风险；政策关门、安全冲击和商业验证缺席同时出现，就难承受得多。
