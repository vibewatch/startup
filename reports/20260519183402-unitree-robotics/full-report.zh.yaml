      - number: '6.3'
        title: 耐久性、集中度与证据质量缺口
        blocks:
          - type: paragraph
            body: >
              本章的核心尽调结论是：Unitree
              有真实采用，但公开证据质量不均，留存证据偏弱。研究使用是置信度最高的分层，因为它包括直接运营方页面和论文，其中一些跨越多年仍持续存在。西方分销和采购证据提供方向性支持，因为它显示了保修、集成、培训以及政府或大学销售路径，但它仍离终端客户运营结果隔了一层。公开活动和
              CES 亮相具有战略价值，因为它们制造认知，并且如 Xinhua 所说，带来阶段性商业价值；但它们不能证明买方会续约、扩张或大规模部署车队。工业巡检处在两端之间：Unitree
              显然在营销该场景，分销商也积极卖进去，但具名第三方运营方和量化结果仍少。集中度风险很可能偏向研究、演示和渠道辅助出口市场，只是因为这些分层拥有最密集的公开证据。同时，西方采用还面临来自安全担忧、政治审查、分销商依赖，以及缺乏公开
              NRR、GRR、头部客户或队列数据的非小摩擦。实际读法是，Unitree
              已经有足够客户证据支持更深入尽调，但披露的客户经济性还不足以证明企业、工业和政府队列中的可重复性。投资者可以承销需求生成和低摩擦进入的证据，但还不能承销一个证据充分的经常性客户基础。
