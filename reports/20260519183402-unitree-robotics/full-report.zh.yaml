      - number: '6.2'
        title: 按分层列出的具名证据
        blocks:
          - type: paragraph
            body: >
              具名公开证据在学术和研究使用中最深。RoMI Lab 称，一台 Go1 自 2022 年春季起就在其实验室，是敏捷运动研究的关键平台；RTU MIREA 的 Zenodo 支持论文记录了一次具体的 Go1 Air
              与 ArduPilot 集成，并报告了实测延迟；Correll Lab 的现场测试提供了异常有价值的负面证据，展示 Unitree
              四足机器人在哪里会打滑、缠住并需要人工恢复。西方公共安全和政府证据更薄，但仍有意义：The Wire China 报道，Central Connecticut State University 运营一台
              Go2，Topeka Police Department 因为西方替代品太贵而购买了三只 Unitree 机器狗，美国陆军通过分销商为四只 Unitree 机器狗预留了超过
              $60,000。分销商页面强化了西方机会由渠道主导这一点：TVC、Drones Plus Robotics、Futurology、RoboStore 和 US Robot Systems 都把 Unitree
              营销到研究、教育、工业巡检、政府或安防用例，并明确使用支持和集成话术。公开活动提供了最宽的可见度证明——尤其是 2025 年春晚和多次全球活动亮相——但这些应归类为展示证据，而不是生产客户背书。
