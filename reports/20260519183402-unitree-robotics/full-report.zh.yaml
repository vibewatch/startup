      - number: '8.6'
        title: 图表
        blocks:
          - type: callout
            title: 跟踪公司；不要把 Figure 式上行空间写进今天的价格
            body: Unitree 的真实商业化证据强于许多同业，但当前估值仍领先于公开证据所能证明的毛利率和组合。因此，选股优势来自价格纪律，不来自行业热情。
            calloutType: recommendation
            claimRefs:
              - CV019
              - CV020
              - CV027
