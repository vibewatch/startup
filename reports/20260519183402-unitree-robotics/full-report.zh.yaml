      - number: '2.2'
        title: 用彼此冲突但有用的视角测算市场
        blocks:
          - type: paragraph
            body: >-
              关于 Unitree 机会的公开市场规模证据相互矛盾，因为不同来源在衡量不同东西。Goldman Sachs 给出很宽的长期人形机器人区间，从 US$6B 到
              US$154B，取决于成本、用例和公众接受度障碍能否清除。相比之下，IDC 支持的报道给出更落地的当前快照：2025 年约 18,000 台人形机器人、约 US$440M 收入。Xinhua 引用 Morgan
              Stanley，指向一个大得多的 2050 年中国单一市场场景：价值 6 trillion yuan、出货 59 million 台。Forbes 又加了一层，把 Goldman 的硬件市场框架和 ARK
              Invest 的劳动力价值框架放在一起比较，而后者根本不是硬件收入预测。


              落到 Unitree 身上，最能支持决策的视角既不是蓝天 TAM，也不是最保守的当前市场快照。可观察的可获取市场（SOM）地板已经能从公司据报道 2024 年超过 1 billion yuan 的收入和 2025
              年人形机器人出货规模中看到；相对 2025 年测算的人形机器人市场，这个规模不小，但仍几乎不说明毛利率或经常性收入质量。短期可服务市场（SAM）比纯人形机器人更宽，因为 Unitree
              今天就能从四足巡检和研究预算中变现；但它又比“全球劳动力替代”叙事窄，因为实际需求仍偏向表演、教育、数据采集和早期工业用途。也因此，本章保留相互矛盾的估算，而不是强行制造虚假的精确度：市场显然真实，显然在增长，但还远没有一个定数。
