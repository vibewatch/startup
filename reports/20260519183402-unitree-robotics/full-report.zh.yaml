  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              以当前约 US$1.6B–US$1.7B 的隐含估值看，Unitree
              值得观察。投资逻辑成立：在人形和四足机器人公司里，很少有公司能同时拿出已发布的产品价格、直销渠道、真实报道收入、覆盖四足和人形的广产品组合，以及可见的海外需求。Unitree
              不是零收入概念股。它的低价格和出货节奏，给了它许多估值更高的同业仍缺的商业化轮廓。


              反向逻辑同样重要。目前公开证据更多说明 Unitree 的销量和能见度，而非经济性。毛利率、出货组合、保修负担、经常性软件或服务收入都未披露。IDC 支持的报道还显示，2025 年可测量的人形机器人市场只有约
              US$440M，需求由表演、教育、数据采集和接待主导，并非规模化工业 ARR。这意味着投资人仍在押注：可负担硬件销量会转成更耐久的工业经济性。安全审查和中国注册地折价，也进一步解释了为什么 Unitree
              的估值远低于 Figure 或 Apptronik。因此，公开证据支持的是对价格敏感的观察姿态，而不是按当前估值确信买入。
