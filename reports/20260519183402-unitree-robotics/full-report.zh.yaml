      - number: '8.4'
        title: 为什么公开证据还不足以支撑全额建仓
        blocks:
          - type: paragraph
            body: >-
              公开证据让 Unitree 向可投资走了一大步，但还没走完。它确认公司真实存在、正在出货、有价格体系，商业化渠道也比大多数同业更广。它还支持一个强有力的相对论点：相对于最膨胀的私募可比公司，Figure
              看起来贵得多，Apptronik 的定价也显然押注了一个大于当前公开证据所能证明的未来。但关键缺口是经济性质量。抓取到的来源没有一个披露 Unitree
              的毛利率、产品族组合、服务附加、保修负担或清算优先顺位。投资人因此知道公司有需求，却不知道这些需求会复利成有吸引力的企业价值，还是只会变成难服务的硬件收入。


              这就是本章停在观察的核心原因。问题不是公开证据为负，而是当前价格已经要求投资人相信尚未公开证明的收入质量。安全审查还带来一层独立且真实的倍数折价，西方同业受影响没这么大。因此，正确读法是合理到偏高：Unitree
              不是显而易见的泡沫，但公开证据仍不足以支持按高质量工业 ARR 转型已经完成来加价买入。
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV031
              - CV032
              - CV035
              - CV036
              - CV037
              - CV038
              - CV045
      - number: '8.5'
        title: 最后尽调问题、投资逻辑断裂触发点和退出路径
        blocks:
          - type: paragraph
            body: >-
              当前公开资料指向少数会实质改变判断的尽调项。第一是收入质量：投资人需要细分组合、毛利率和重复订单证据，判断 Unitree
              是否正从低价机器人供应商进化为有防守能力的机器人平台。第二是下行结构：没有股权结构表和清算细节，即使企业价值公平，股权回报也可能没有吸引力。第三是地缘政治耐久性：美国及盟友的采购或出口限制可能迅速收窄海外
              TAM，尤其是公共部门或敏感商业买家。


              退出路径存在，但近期最能支撑的路径仍是中国境内 IPO 或 IPO 前重估，而不是溢价全球战略并购。IPO 准备叙事真实存在，但不应把它写成必然事件。IPO
              搁置、下轮融资降价，或有证据显示报道的出货增长没有转成重复工业合同，都会打破乐观叙事。反过来，如果 Unitree
              披露细分经济性、展示可信的工业经常性需求，并给投资人更好的价格或更好的下行保护，建议就会改善。在此之前，审慎姿态是密切跟踪、围绕尽调沟通，不要假设仅靠销量领先就能抹平与最贵同业的估值差。
            claimRefs:
              - CV002
              - CV022
              - CV027
              - CV028
              - CV038
