      - number: '1.4'
        title: 里程碑、公众形象与新兴风险
        blocks:
          - type: paragraph
            body: >-
              作为私有机器人公司，Unitree 的里程碑记录异常公开。官方材料和独立报道显示，它登上过 2021 年春晚舞台、2022 年冬奥会开幕式、2023 年 Super Bowl 赛前秀、2023 年亚运会和 CES
              2025；TIME 后来也把 Unitree 列入 TIME100 companies list。这些亮相既服务品牌，也提供商业证明，尤其是因为 Unitree
              现在横跨消费级四足机器人、面向开发者的人形机器人、工业四足机器人和机械臂。但可见度也会带来双刃剑效应。Humanoid Index 汇总显示员工超过 1,000 人、2025 年出货超过 5,500
              台，CnTechPost 报道 2026 年人形机器人目标为 10,000-20,000 台；这些是有用的规模信号，但不是经审计财务披露。更重要的是，反向证据已经出现。The Wire China 记录了华盛顿对
              Unitree 美国销售的审查升温，一篇 2025 年 arXiv 论文则指称 G1 存在严重安全与遥测风险。叠加仍不清晰的治理细节，这些风险应该和里程碑故事一并呈现，而不是被放在故事之外。
