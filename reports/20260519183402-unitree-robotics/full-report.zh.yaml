              Unitree 并不是在一个干净的绿地市场里竞争。直接人形机器人同行包括追求工业或家庭部署叙事的西方初创公司（Figure、1X、Agility、Boston
              Dynamics），以及密集的中国队列，覆盖全尺寸人形机器人、娱乐机器人和四足替代品（Agibot、Fourier、UBTech、DEEP
              Robotics）。公开证据还显示，买方经常可以完全避开人形机器人：Agility 明确把 Digit 定位为连接既有自动化孤岛，Boston 已经把 Spot 卖进巡检工作流，DEEP
              把四足机器人卖进公用事业和救援任务，Goldman / IFR 都认为可负担性和用例成熟度仍制约采用。这意味着 Unitree
