      - number: '7.4'
        title: 执行、客户证据、IP / 护城河与 IPO 时点风险
        blocks:
          - type: paragraph
            body: >-
              执行风险不只是多造机器人。IPO 审视升温之前，Unitree 还得把开发者驱动、价格驱动的增长，转成企业客户撑得住的业务。开放 SDK
              和仿真生态是很强的采用引擎，但也削弱专有锁定，让护城河看起来更像速度和成本，而不是受保护的工作流控制权。如果客户证据来得够快，这可以接受；如果同业继续抓住信任层，问题就会放大。公开报道显示，Unitree
              确有收入规模和私募市场热度，但若公开市场要把 IPO
              估值抬到更高水平，投资人就必须相信客户留存、合规和质量能持续——这些领域公开记录仍然很薄。高速增长、披露不完整、地缘政治阴影叠在一起，估值和时点风险就不是旁枝；它是投资逻辑最直接的断裂点之一。
