      - number: '5.2'
        title: 技术栈、内部组件与开发者工作流
        blocks:
          - type: paragraph
            body: >
              最深的产品技术证据位于机器人外壳之下。Unitree 的介绍页面明确声称内部研发电机、减速器、控制器、激光雷达以及感知和运动控制算法；A1
              电机页面把这个主张具体化：执行器把控制器、行星减速器、交叉滚子轴承、传感器、RS485 通信和即插即用维护能力集成到单一模块中。在公开机器人页面中，感知同样处于中心位置：Go2 宣传自研 4D lidar，G1
              和 H1/H1-2 则用激光雷达加深度相机做人形感知。软件上，Unitree 公开的栈远多于许多硬件同行。GitHub 代码库覆盖 SDK2、ROS2、Isaac Gym RL、Isaac Lab
              仿真、世界模型学习、应用模板、URDF 资产和部署助手。SDK2 支持 Ubuntu、x86_64 和 aarch64 上的当前家族；ROS2 使用
              CycloneDDS，并公开运动、低层状态、远程控制和激光雷达的直接话题；RL Gym 规范了 Train-to-Play-to-Sim2Sim-to-Sim2Real 闭环；Isaac Lab
              复用来自实体机器人的 DDS 话题；UnifoLM 世界模型代码库为 G1 和 Z1
              操作任务加入更有野心的仿真加策略层。结果是，从原始硬件到开发者应用打包和策略部署，有一条可见路径，即便官方文档中心页面仍难以通过静态抓取检查。
