  - id: TV001
    title: 建议摘要表
    columns:
      - 参数
      - 评估
      - 证据支持的说明
    rows:
      - - 总体建议
        - 观察
        - 商业化和收入底盘真实存在，但经济性披露太薄，还不足以支撑坚定买入
      - - 置信度
        - 中
        - 公开证据方向上积极，但利润率、股权结构表和经常性收入仍不完整
      - - 风险评级
        - 高
        - 硬件收入结构、中国折价和安全审查都可能压制上行兑现
      - - 估值立场
        - 合理至偏高
        - 低于 Figure 或 Apptronik，但对照 Unitree 自身公开证据，并不明显便宜
      - - 支持入场的因素
        - 真实产品、可见价格、已发货量、海外需求
        - Unitree 已不是还没产品的故事
      - - 阻碍买入的因素
        - 没有毛利率、分部结构或优先股堆叠披露
        - 当前价格要求投资者相信尚未验证的收入质量
      - - 上调条件
        - 更好的经济性披露或更好的价格
        - 工业经常性需求证明加上下行保护，会改变判断
    notes: 这张表只总结本章判断，而且有意保持价格敏感：更好的价格或更充分的披露，即使不改变公司的技术质量，也可能改善观点。
