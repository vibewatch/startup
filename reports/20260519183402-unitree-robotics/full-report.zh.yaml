  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 当前可支撑估值或状态
      - 已抓取证据能支撑什么
      - 可比理由
      - 主要局限
    rows:
      - - Unitree
        - US$1.6B–US$1.7B 已完成轮次锚点；US$7B IPO 目标
        - TechNode 和 The Robot Report 支持当前锚点；Humanoid Index 给出较低的四舍五入估值和 IPO 野心
        - 主要标的估值锚点
        - 利润率、结构和优先股堆叠未披露
      - - Figure AI
        - 约 US$39B
        - Tech Market Briefs 和 Humanoid Index 支持极高的后期私募估值
        - 展示该行业最昂贵的叙事倍数
        - 异常案例，公开经济性披露有限
      - - Apptronik
        - 约 US$5B
        - Apptronik 官方信息和 Reuters-linked US News 支持 2026 年 A-X 轮估值，以及接近 US$1B 的累计融资
        - Figure 之下最接近的美国高估值私募可比公司
        - 战略投资者占比重；经济性披露仍然很轻
      - - Agility Robotics
        - Humanoid Index 摘要高于 US$2.1B+
        - 官方定位加 Humanoid Index 支持其商业物流重点和近期大额融资
        - 更贴近落地的商业仓储可比对象
        - 抓取集里没有完整披露精确投后估值和经济性
      - - 1X Technologies
        - Humanoid Index 摘要高于 US$500M+
        - 官方 NEO 定位加 Humanoid Index 支持家用机器人逻辑和较低估值层级
        - 可作为消费者 / 家庭叙事的低端同行
        - 地域不同，且更偏消费者
      - - Agibot / UBTech
        - 定性中国背景；抓取文本里没有干净的可比估值
        - AGIBOT 证实中国同行野心；UBTech 证实公开市场参照，但报价页在文本模式下无法机器读取
        - 提供有用的中国语境和公开市场透明度基准
        - 当前抓取集的数字支撑较弱
    notes: 这组可比公司有意保留不均衡，因为不同同行的可支撑度不同。Figure 和 Apptronik 的公开估值线索比 Agibot 或 UBTech 更干净；表格保留这种不对称，而不是强行制造虚假精度。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the six most decision-relevant peers or peer groups visible in the fetched evidence set, including the
        strongest numeric private-round anchors and the weaker China-context references that are supportable only
        qualitatively today.
