  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与价格架构
        blocks:
          - type: paragraph
            body: >-
              公开证据强烈指向一个硬件主导的收入模式。Unitree 销售消费级和工业级四足机器人、面向开发者的人形机器人、机械臂、激光雷达和相关工具；KrASIA 在 2021 年引用 Wang
              的说法称，大部分收入已经来自机器人销售，表演只占小部分。这个历史评论仍符合当前目录。TechNode 补充了一个重要分层线索：四足机器人主要面向消费者，人形机器人则面向会在 Unitree
              硬件上修改感知和运动算法的开发者。价格梯度也强化了这种分层。Go2 在官方页面起价 US$1,600，在商店页面为 US$2,800；G1 产品页标为 US$13.5K，商店页标为 US$16K；H1 标价
              US$90K；STEMfinity 将 Z1 机械臂列为 US$13,387.50；B2 则似乎处在报价驱动的工业工作流中，而不是完全透明的电子商务路径。这些都是标价锚点，不是实际
              ASP，因为税费、运输、海关、渠道折扣和售后义务均未披露。
