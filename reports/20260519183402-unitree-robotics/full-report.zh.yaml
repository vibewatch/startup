      - number: '7.2'
        title: 安全、网络安全、质量与产品责任风险
        blocks:
          - type: paragraph
            body: >-
              Unitree 的公开产品页面和独立安全文献指向同一方向：公司仍足够早期，技术进步与真实运营不确定性并存。G1 和 H1 页面告诉用户保持安全距离、避免危险使用，并理解早期人形机器人的局限；G1
              基础产品也只公布了不高的手臂载荷和较短保修条款。仅这一点，就足以支持在工业场景中保持谨慎。arXiv 安全评估走得更远，指称存在具体 BLE
              攻击路径和反复出现的遥测行为；在受监管或隐私敏感环境中，这可能变得不可接受。Hill Dickinson
              补上法律框架：人形机器人一旦离开实验室，制造商、运营方和软件栈之间责任不清，就会成为现实产品责任问题。Unitree 的 OTA
              节奏和开发者速度是有用缓释项，但不能替代经审计安全保证、长期支持承诺或披露的现场可靠性数据。
