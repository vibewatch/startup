        - 高
        - 高
        - 大规模工业部署前，先建设区域支持团队和零部件仓
        - 按地域询问支持人员配置、响应时间和备件策略
      - - 安全工程
        - 公开漏洞利用叙事跑在已披露修复叙事前面
        - 中
        - 高
        - 发布安全响应政策、补丁节奏和外部审计
        - 索取 CVE 处理流程、红队工作和安全更新控制
      - - 法律 / 合规建设
        - IPO 路径提高披露和治理负担
        - 中
        - 高
        - 上市前，将政策、隐私、出口管制和产品安全团队制度化
        - 要求公司提供 IPO 就绪治理计划，以及外部律师 / 审计准备情况
      - - IP / 生态策略
        - 如果软件商业化跟不上，开放工具会削弱留存
        - 高
        - 中
        - 在开放工具之上叠加付费云、工作流或企业集成
        - 要求披露开发者商业化、附加率和软件收入
    notes: 这里的人员风险，与其说是某位高管离职，不如说是公司能否赶在估值预期见顶之前，从高速硬件创新者成熟为服务撑得住、政策风险也看得懂的全球供应商。
