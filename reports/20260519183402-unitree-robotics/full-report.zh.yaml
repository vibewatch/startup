  - id: TR005
    title: 缓释措施与否决标准表
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 采购禁令 / 地缘政治封闭
        - ASRA 或类似限制
        - 法案通过、适用范围扩大，或受监管买家大规模主动排除
        - 除非海外逻辑不再是核心，否则转为回避
      - - 出口管制外溢
        - 新芯片限制或披露的供应中断
        - 交付延迟、规格下调，或突然需要重新设计
        - 重新测算成本曲线和交付可信度
      - - 网络安全 / 隐私冲击
        - 独立漏洞、确认的遥测滥用，或监管调查
        - 具名客户暂停、召回，或公开事件
        - 在补救获得独立验证前，按投资逻辑击穿处理
      - - 质量 / 支持失败
        - 保修索赔、故障或支持积压显著上升
        - 现场保有量扩大，但没有公开扩充支持能力
        - 下调企业转化和利润率假设
      - - 客户验证缺口
        - 具名工业客户持续缺位
        - IPO 进程推进前仍无披露的经常性生产部署
        - 将故事重估为开发者 / 研究硬件，而不是企业机器人平台
      - - IPO 时点 / 估值风险
        - IPO 延期、重新定价，或治理短板
        - 政策审查升温时，CSRC / 交易所流程滑坡
        - 披露改善前，不按峰值估值承销
      - - 护城河侵蚀
        - 同行缩小价差，或以相近成本在服务上超过 Unitree
        - Agibot / 1X / 其他公司公布明显更低价格或更好支持
        - 重新评估 Unitree 是否仍配得上成本和产品广度溢价
    notes: 这张表把宽泛风险转成明确的监测触发因素。对这家公司而言，否决标准大多是外部事件或证据点缺失，而不是季度间产品功能漏项。
