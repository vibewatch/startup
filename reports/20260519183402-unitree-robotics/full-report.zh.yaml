  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品家族与工作流匹配
        blocks:
          - type: paragraph
            body: >
              作为一家私有机器人供应商，Unitree 公开产品界面异常宽：Go2 面向低成本开发者用途、教育和轻载野外场景；B2 面向工业巡检和重载移动；G1 与 H1/H1-2 面向人形机器人
              R&D、遥操作、灵巧操作和展示部署；Z1 把产品栈延伸到机械臂和机载操作。共同商业模式不是单一交钥匙工作流，而是硬件平台策略：买方先选择一种机体形态，再围绕它叠加二次开发、RL 策略、ROS2
              控制或集成商支持。这一点重要，因为公司证据最强的工作流仍由工程牵引，而不是终端消费者自动化。Go2 页面突出建图、侧跟随、4D lidar、OTA 更新和二次开发；B2
              强调全地形巡检、爬楼梯、越障、载重和可选充电；G1 与 H1/H1-2 强调灵巧性、高扭矩密度、激光雷达加深度感知和开发者扩展。Z1
              公开信息更薄，但它明确被定位为面向移动机器人载荷工作、物流和研究的开放编程机械臂。公开活动亮相提升认知，但最强的工作流证据仍来自研究、巡检和集成商主导部署，而不是大众市场自主家庭使用。
