companyProfile:
  summary: >-
    Unitree Robotics 是一家总部位于杭州的腿式与人形机器人公司，由 Wang Xingxing 于 2016
    年创立。公司的打法是用明显低于许多西方同行的价格，把高性能机器人商业化，同时把更多组件栈掌握在内部。公开证据显示，Unitree 的产品线已经很宽，覆盖 Go2 四足机器人、B2 工业机器人、G1 与 H1 人形机器人、Z1
    机械臂、激光雷达、SDK 和强化学习工具。Unitree
    的产品既直销，也通过面向开发者的渠道销售，并不只是停留在实验室原型；这一点把它和几家估值很高的人形机器人同行区分开来。公司仍为私有、财务不透明，但公开牵引力已经足够，应该把它视为真实运营中的机器人企业，而不是概念阶段故事。
