  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 从认知到活跃使用的典型旅程显示，今天有两条主路径：低摩擦的开发者直接购买，以及渠道辅助的企业或机构采购。
    approximationNotes: 旅程综合自官方商店流程、分销商话术和具名公开采购案例，并非来自某个已披露的公司销售手册。
    data:
      nodes:
        - id: awareness
          label: 认知
          detail: 买家最早通过出圈演示、晚会报道、CES 或研究圈口碑接触 Unitree。
        - id: evaluation
          label: 评估
          detail: 研究员或运营负责人拿价格、载荷和开发者开放度与西方替代方案对比。
        - id: route-selection
          label: 路径选择
          detail: 小买家可以直接零售购买；大买家会转向分销商，换取支持、培训、保修和集成。
        - id: onboarding
          label: 导入
          detail: 机器人会按实验室用途、公共安全工作流或巡检原型配置，并接入 SDK / ROS / 应用支持。
        - id: active-use
          label: 活跃使用
          detail: 真实使用最清楚地出现在实验室、公开演示，以及部分警方或政府研究场景。
        - id: repeat-expand
          label: 复购 / 扩展
          detail: 这里的公开证明最弱：分销商承诺支持，但续约、机队扩张和队列数据大多未披露。
    claimRefs:
      - CU020
      - CU021
      - CU026
      - CU033
      - CU034
      - CU040
  - id: FU002
    title: 采用 / 部署流向
    type: flow
    layout: standard
    summary: 具名证据通常从兴趣表达和渠道接触，走向实验室或机构部署；只提供曝光的活动亮相则并行留在认知路径上。
    approximationNotes: 流程把付费使用证据与活动曝光证据拆开，因为公开来源常把这两类混在一起。
    data:
      nodes:
        - id: event-visibility
          label: 曝光路径：晚会、体育赛事、CES、Super Bowl
          type: input
        - id: buyer-inquiry
          label: 买方询盘：实验室、大学、警方、集成商或企业运营团队
          type: process
        - id: direct-or-channel
          label: 直营网店或经销商协助采购
          type: decision
        - id: deployment
          label: 科研、巡检原型或公共安全部署
          type: process
        - id: documented-proof
          label: 公开证据以实验室页面、论文、文章或经销商案例表述出现
          type: process
        - id: repeat-gap
          label: 复购和续约证据基本缺失
          type: output
      edges:
        - from: event-visibility
          to: buyer-inquiry
          label: 建立认知
        - from: buyer-inquiry
          to: direct-or-channel
          label: 选择路径
        - from: direct-or-channel
          to: deployment
          label: 安装并运行
        - from: deployment
          to: documented-proof
          label: 具名证据出现
        - from: documented-proof
          to: repeat-gap
          label: 持续性仍不清楚
