            body: >-
              本章结论很直接：Unitree
              有真实商业证据，但毛利率可见度仍太弱，难以干净承销。公司显然在硬件上变现，展示了异常宽的产品阶梯，也有足够的据报道收入和出货背景，值得重视。但缺失变量正是决定可投资性的变量——BOM、服务成本、保修负担、渠道折扣、积压订单转化、现金跑道、债务，以及申报阶段文件中的实际披露。可访问的申报路径本身在本次会话中仍不完美：监管机构链接的
              PDF 路径可以识别，但对抓取配置返回 405 响应；这提醒我们，公开报道和一手披露不是同一回事。在 Unitree
              申报或以其他方式开放数据室之前，投资者应把公开收入和出货数字视为牵引的方向性证明，而不是质量证明。这让融资依赖和未解决单位经济性成为主要阻碍，即便收入线故事仍有吸引力。
