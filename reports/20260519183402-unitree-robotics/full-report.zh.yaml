            title: 核心下行不是产品不真实，而是经济性不透明
            body: 投资人能看到产品、价格，甚至收入下限。还看不到的是这些产品是否带来有吸引力的毛利率，或可重复的工业经济性。这就是它仍是一笔尽调驱动投资的原因。
            calloutType: risk
            claimRefs:
              - CV017
