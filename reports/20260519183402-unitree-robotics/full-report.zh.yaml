      - number: '8.2'
        title: 融资背景与可比公司组
        blocks:
          - type: paragraph
            body: >-
              以私募市场标准看，Unitree 当前估值锚相对扎实：TechNode 和 The Robot Report 都把公司放在 2025 年 Series C 背景后的约
              US$1.6B–US$1.7B，Humanoid Index 则更保守，给出 US$1.4B+，同时也收录了更带宣传色彩的 US$7B IPO
              目标。这种冲突不是致命问题，反而有用。它提醒投资人，已交割轮次证据和前瞻叙事证据不能混成一个估值锚。更保守的定价方式，是用已交割轮次估值约束进入价格，把 IPO 数字只当乐观情景叙事。


              相对同业，Figure 约 US$39B 是行业异常值，不是所有人形机器人公司的出清价格。Apptronik 约 US$5B 明显高于 Unitree，但背后有近 US$1B
              融资和高度战略化的投资人基础。Agility 和 1X 提供更接地气的中档参照，Agibot 和 UBTech 对中国语境有用，但在本次抓取资料里数字锚更弱。关键对比点不是 Unitree
              「因为更低所以便宜」。而是 Unitree 今天的产品证据强于许多同业，同时在毛利率和细分组合披露质量上明显更低，还叠加清晰的中国地缘政治折价。这个组合让当前估值可以理解，但看不出明显向投资人一侧错定价。
