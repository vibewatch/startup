      - number: '5.3'
        title: 部署成熟度与制造姿态
        blocks:
          - type: paragraph
            body: >
              公开证据显示 Unitree 正在走出实验室原型，但产品组合内部并不均衡。公司反复宣称自己在四足机器人公开零售上领先，商店页面通过公布 Go2 和 G1 的直销价格、运输披露和二次开发选项支持这个判断。外部
              CES 报道确认，Unitree 愿意在 2025 年初同时向全球买方展示 Go2、G1、H1 和 B2-W，这意味着它有一套连贯产品线，而不是孤立概念车。介绍页面还称 Unitree 正在持续改善产线，并覆盖
              ToB 和 ToC 腿式、人形和机械臂品类；杭州机器人枢纽文章又提供了更广的生态信号，描述围绕 Unitree
              等公司的试生产、测试、认证和培训能力正在成形。不过，成熟度并不一致。四足机器人更接近可部署产品，已经有载荷、续航和建图流程文档；人形机器人销售时仍突出对局限、开发中特性和安全使用的提醒。二级来源称 Unitree
              是量产领导者，应作为方向性背景，而不是经审计制造证据。最可辩护的成熟度判断是：Unitree 已在四足机器人和开发者硬件上实现可信商业化；人形机器人仍是快速推进、但尚未完全验证的平台家族。
