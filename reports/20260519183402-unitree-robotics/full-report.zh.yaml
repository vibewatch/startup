      - number: '2.5'
        title: 图表与要点
        blocks:
          - type: callout
            title: 海外采购审查可能封顶本来很大的海外机会
            body: >-
              The Wire China 的证据重要，因为它同时展示了 Unitree
              海外故事的两面：美国今天确实有真实需求，但这些需求处在安全敏感度越来越高的采购环境里。这让海外总可用市场（TAM）真实存在，却在政治上脆弱。
