      - number: '5.4'
        title: 安全、差异化与技术风险
        blocks:
          - type: paragraph
            body: >
              Unitree
              的核心差异化，是低价公开硬件、对关键机器人组件的垂直整合，以及相对开放的开发者界面的组合。这个组合很可能解释了为什么它的机器人频繁出现在研究实验室、公开展示和成本敏感买方讨论中。但同一组公开材料也凸显了实质风险。安全免责声明不是埋在条款里的样板脚注；它们直接嵌在
              G1、H1、B2、Go2 和 A1 电机页面中，提醒强力运动、全球人形机器人行业的不成熟、保持安全距离的必要性，以及禁止危险改装。性能限定同样重要：B2 的最高速度需要特殊配置，Go2
              提到部分功能需要人工操作或二次开发，G1 称部分样例功能仍在开发中。Correll Lab 的外部现场证据刺破了营销演示的光滑表面：Go1
              可以在崎岖地形中导航，但在真实环境中仍会打滑、缠住，并需要手动重启。最严厉的反向信号来自网络安全：一篇 2025 年研究论文指称 G1 存在 BLE
              配网和加密弱点。即便该论文中的部分主张仍需独立复现，它也足以支撑一个结论：Unitree 的技术优势并不会消除严肃尽调需求。在承销广泛企业部署前，仍必须核查安全、环境坚固性、安全认证和生产可靠性。
