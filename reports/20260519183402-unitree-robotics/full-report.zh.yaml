      - number: '2.3'
        title: 买方分层：工业巡检、开发者、研究与推广用途
        blocks:
          - type: paragraph
            body: >-
              Unitree 的买方地图，比长期人形机器人叙事暗示的更碎片化。四足机器人中，工业巡检、应急响应、公共安全和公用事业式工作流，是当前预算最清晰的场景，因为 B2 产品围绕载荷、续航和复杂地形明确设计。The
              Wire China 也记录了美国大学、地方警察和陆军的真实需求，其中可负担价格是决定性因素。学术实验室和开发者构成第二个清晰分层：GitHub 工具、SDK 文档，以及外部学术论文中对 Go1
              的使用，都指向可重复的研究和教育需求。这类买方往往来自 R&D、实验室或院系资本预算，而不是企业自动化预算。


              人形机器人已经商业化，但当前买方组合不如巡检分层成熟。IDC 称 2025 年出货主要由表演、研究与教育、数据采集和接待拉动。这与 Unitree 在春晚上的高可见曝光相符，也与公司围绕 G1
              的开发者导向信息相符。未来家庭使用是管理层公开愿景的一部分，但已抓取证据还看不到规模化家庭收入市场。最重要的实践区分因此不是抽象的“消费者还是企业”，而是买方购买机器人，是为了可重复、ROI
              可测的工作流，还是为了开发、实验、数据采集或推广可见度。Unitree 当前两边都参与，这种混合需求画像同时带来机会和估值模糊性。
