    title: 增长驱动因素与约束表
    columns:
      - 因素
      - 方向
      - 时间
      - 对 Unitree 的影响
      - 有证据支撑的解读
      - 尽调需索取
    rows:
      - - 中国密集的零部件生态
        - 驱动因素
        - 当下
        - 支撑更低 ASP 和更快迭代
        - 供应商竞争和集聚让 Unitree 在成本与速度上占优
        - 要求披露 COGS 趋势和供应商集中度
      - - 2026 年人形机器人标准与具身 AI 政策支持
        - 驱动因素
        - 当下至 2030
        - 改善国内测试、合规和采购路径
        - 中国已从泛泛鼓励转向具体标准
        - 梳理 Unitree 已满足哪些标准
      - - 杭州机器人集群
        - 驱动因素
        - 当下至 2027
        - 提升本地测试和产业化能力
        - 集群基础设施可缩短商业化闭环
        - 跟踪 Unitree 是否使用新测试评估基础设施
      - - 低入门价与直销
        - 驱动因素
        - 当下
        - 扩大开发者、学术和准专业消费者漏斗
        - 价格是客户选择 Unitree 而非西方替代品的直接原因
        - 评估低价是在增厚还是摊薄利润率
      - - 劳动力短缺与以人为中心场景适配
        - 驱动因素
        - 中期
        - 让人形机器人投资逻辑仍具战略意义
        - IFR 认可真实需求逻辑，但不认同短期普及
        - 把 Unitree 试点与量化的劳动力替代挂钩
      - - 当前需求集中在表演、研究和数据采集
        - 约束因素
        - 当下
        - 收入质量可能落后于叙事质量
        - 已测得的用例结构，比家庭或工厂热叙事更早期
        - 要求按终端市场拆分出货结构
      - - 传统机器人仍是强替代品
        - 约束因素
        - 当下
        - 限制高吞吐、结构化工作流中的 SAM
        - 形态优势只在特定以人为中心任务中成立
        - 按工作流将 Unitree 与协作机器人、AMR 和无人机对标
      - - 网络安全与责任担忧
        - 约束因素
        - 当下
        - 拖慢敏感环境采用
        - 人形机器人扩大攻击面，也放大安全责任问题
        - 要求第三方安全审计和事故历史
      - - 美国及盟友安全审查
        - 约束因素
        - 当下至中期
        - 压低海外公共部门 TAM，并可能外溢到企业采购
        - 围绕中国机器人的政治叙事已经启动
        - 跟踪采购限制和出口管制动作
      - - 生态与服务转向
        - 做不到是约束 / 做到则是驱动
        - 2026 年以后
        - Unitree 必须走出只卖便宜硬件
        - IDC 预计竞争会转向服务和生态
        - 索取软件附加率、服务收入和开发者留存指标
    notes: 本表区分有证据支撑的驱动因素与约束因素。几行是双刃剑：低价拉动需求，也可能挤压利润率；政策支持利好国内市场， 但无法抵消海外审查。
