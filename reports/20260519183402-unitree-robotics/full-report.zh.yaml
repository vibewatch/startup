      - number: '7.3'
        title: 供应链、分销与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Unitree 极大受益于以中国为中心的供应网络，而同一张网络也制造了依赖风险。第三方报道把公司的价格优势归因于中国组件生态；如果出口管制规则或国内瓶颈收紧，这个优势会很快被压缩。公司的海外销售
              路线也在结构上依赖分销商和早期采用买方，而不是直接的西方运营足迹。Wire China 显示，当前美国需求真实存在，但集中在大学、警察部门和陆军研究，而不是大型经常性工业合同。这让 Unitree
              暴露于渠道脆弱性：在公司建立独立本地支持基础之前，分销商、客户或监管机构都可能打断动能。Agility 和 Boston Dynamics
              等同行在这里不只是竞争者，也是证明软件集成、现场服务和具名工业用户本身就是风险缓释项的参照。Unitree 尚未披露同等运营缓冲。
