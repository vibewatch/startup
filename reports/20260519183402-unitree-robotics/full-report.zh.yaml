  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 地缘政治、采购禁令与监管风险
        blocks:
          - type: paragraph
            body: >-
              风险栈从 Unitree 的出身开始。美国议员已经不再只谈无人机和电信设备；American Security Robotics Act 明确针对来自受关注外国实体的地面机器人，IEEE
              把该提案界定为两党脱钩议程的一部分。即便法案永远不会成为法律，它的话术也很重要，因为它给受监管和政府邻近买方一个可辩护理由，让他们可以先发制人地避开中国机器人。出口管制风险会叠加放大这个问题。美国政府来源显示，对中国半导体限制已经很宽、还在扩张，并且行政执行复杂。公开披露并未显示
              Unitree 是制裁目标，但它仍依赖一个生活在政策冲击半径内的硬件生态。中国国内标准和杭州政策支持确实有助于近期规模化和安全治理，但它们无法解决西方买方眼中“中国来源本身”带来的外交政策反对。
