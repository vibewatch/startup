      - number: '1.2'
        title: 领导力集中与开发者界面
        blocks:
          - type: paragraph
            body: >-
              管理层证据同时很强，也很薄。强在 Wang Xingxing：所审阅来源都一致显示他是创始人兼 CEO，Forbes 还把他标为
              CTO，这与访谈和公司公开工程足迹中呈现的技术优先画像相符。薄在其余班底。已审阅材料没有披露董事会名单、独立董事，或单独具名的 CFO/COO 层级，因此围绕 Wang
              存在真实的关键人依赖。部分抵消这种不透明的是，Unitree 作为硬件公司，却有异常公开的开发者界面。其 GitHub 组织公开了覆盖 G1、H1、Go2、B2、H2 及其他机器人家族的 SDK、ROS2
              包、强化学习代码库和应用模板。这样的开源姿态支持一个判断：Unitree 不只是卖成品机器人；它还试图播种开发者生态，扩大采用面，并在研究人员和开发者中强化品牌。
