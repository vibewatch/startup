  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：腿式机器人，不是所有自动化
        blocks:
          - type: paragraph
            body: >-
              Unitree
              横跨两个重叠但仍然不同的市场：四足机器人已经服务巡检、公共安全、开发者和研究工作流；人形机器人则通过开发者、表演、接待和早期工业实验走向商业化。公司也销售机械臂和传感器，但这些产品今天的商业意义主要在于拓宽具身机器人栈，而不是创造一个独立的软件市场。因此，一个有用的市场边界应包括腿式系统上的机器人硬件、机载算力、感知包、集成、维护和开发者工具支出；不包括固定工业机械臂、传送带自动化、纯软件
              AI 和无人机，除非买方明确在同一工作流中做替代。


              这个边界重要，因为 Unitree 并不是先攻最成熟的自动化预算。它的直营网店、GitHub 代码库和平价 G1 入门点，显示出开发者、教育者和实验者中的强牵引；B2
              巡检四足机器人则面向巡检、应急响应等更结构化的工业任务。公开证据还不支持把整个制造自动化市场都视为 Unitree
              的可服务市场（SAM）。在许多工作流中，人力、AMR、协作机器人和固定工业机器人仍是强替代品，IFR
              也明确表示，人形机器人在中短期不会成为万能帮手。正确框架是分层市场：四足机器人工作流今天已经商业化；人形机器人工作流也真实商业化，但仍集中在低风险、低问责场景。
