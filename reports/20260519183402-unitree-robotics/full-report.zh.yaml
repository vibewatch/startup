              Unitree 有足够的公开牵引信号，说明它不是商业化前公司，但这些来源仍不足以拼出干净财务模型。TechNode 报道 Unitree 2024 年收入超过 RMB 1 billion（US$137
              million），The Robot Report 也转述了约 US$140 million 的粗略数字。Humanoid Index 补充称，截至 2026 年 2 月，公司员工超过 1,000 人，2025
              年出货超过 5,500 台；CnTechPost 报道 Wang 对 2026 年人形机器人出货的目标为 10,000-20,000
              台。正确用法是把这些数字当作中等置信度背景，而不是审计事实。它们来自可信报道和汇总方，但不是财务报表。它们之间也不能整齐映射：2024 年收入早于被引用的 2025 年人形机器人出货爬坡，Unitree
              还同时销售价格低得多的四足机器人和外设，以及更贵的人形机器人。因此，投资者应克制，不要试图从少数公开数字倒推出单一混合 ASP 或毛利率故事。公开数据说明的是动能，不是完整透明度。
