  - id: TV005
    title: 投资逻辑击穿与否决触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 重要性
      - 行动含义
    rows:
      - - 出口或采购限制显著扩大
        - 公共部门或敏感商业禁令从零散审查扩散开来
        - 会收窄海外 TAM，并压缩投资者愿意为 Unitree 支付的倍数
        - 除非仅靠国内经济性也能支撑价格，否则转为负面观点
      - - 出货增长没有转成工业重复需求
        - 到 2027 年仍没有可信的工业经常性需求证据
        - 会把 Unitree 从平台故事重估为低毛利硬件商
        - 不在当前或更高价格加仓
      - - 下调估值融资或 IPO 叙事搁置
        - 下一轮融资低于当前估值，或 IPO 准备故事停滞
        - 会削弱公开证据中可见的主要重估机制
        - 按悲观情景区间重新承销
      - - 毛利率被证明结构性疲弱
        - 尽调显示，服务负担之后产品家族毛利率低或为负
        - 会推翻「规模自然改善价值」这个逻辑
        - 把低价视为商品化，而不是护城河
      - - 重大安全事件或审计失败
        - 公开泄露、安全事故，或关键采购审计失败
        - 会强化中国折价，并推迟企业采用
        - 暂停或退出，直到补救得到证明
    notes: 否决触发因素是可观察事件，不是泛泛担忧。每一项都直接攻击 Unitree 的可服务市场、估值倍数，或守住当前定价叙事的能力。
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 按产品家族和终端市场拆分收入
        - 没有公开拆分四足机器人、人形机器人、部件、服务、工业、研究或表演需求
        - 决定当前增长是否在复利成耐久价值
        - 要求管理账或 IPO 准备材料
      - - 毛利率、保修和现场故障数据
        - 没有公开硬件单位经济性或服务负担
        - 区分规模护城河和低价商品陷阱
        - 要求产品家族贡献利润率和保修准备金明细
      - - 股权结构表和优先股堆叠
        - 没有公开清算、参与权或反稀释细节
        - 股权回报可能与企业价值大幅背离
        - 要求当前轮条款的法律摘要
      - - 工业经常性需求证明
        - 没有公开合同金额、续约或 ARR 式披露
        - 当前估值需要比单纯出货量更高质量的需求
        - 要求工业客户队列、重复订单和服务附加
      - - 海外敞口和政策预案
        - 海外销售在哪里、受采购限制影响多大，细节有限
        - 海外 TAM 消失速度可能快于国内 TAM
        - 按地理和客户类别映射收入
      - - IPO 准备实质
        - IPO 准备已公开，但正式申报内容尚未公开
        - IPO 可选性是当前最清晰可见的重估路径
        - 要求时间表、审计就绪情况和顾问工作流细节
    notes: 前四项要求最重要，因为它们直接影响当前价格的估值支撑。没有这些证据，最有支撑的姿态仍是观察，而不是买入。
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV042
