chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创立故事与使命
        blocks:
          - type: paragraph
            body: >-
              官方与独立来源都一致把 Unitree Robotics 描述为一家总部位于杭州、由 Wang Xingxing 在 2016 年创立的机器人公司。创立故事重要，因为它解释了公司的商业 DNA：Wang 告诉
              KrASIA，自己在研究生阶段做出 XDog 四足机器人，意识到电驱动能大幅降本并提升灵活性，随后短暂加入 DJI，又在约两个月后离开，于 2016 年 5 月创立
              Unitree。低成本、快迭代的逻辑，今天仍体现在公司的定位里。官方材料把公司放在民用机器人赛道，强调技术驱动进步的使命，并把 Unitree
              定义为一个覆盖四足机器人、人形机器人、机械臂和核心组件的宽平台，而不是一次性演示产品。表述偏理想主义，但主线很稳定：靠可负担价格和速度推动普及，而不是只做定制化研究系统。这种组合也解释了为什么 Unitree
              会同时出现在消费者和开发者场景中。
