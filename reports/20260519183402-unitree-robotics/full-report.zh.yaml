  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 重要性
      - 反向逻辑 / 削弱因素
      - 改变观点的条件
    rows:
      - - 真实的产品市场验证
        - Unitree 已在四足机器人和人形机器人上公开产品页、价格和出货证据
        - 单纯销量仍可能只是低毛利硬件收入
        - 披露毛利率和重复订单率
      - - 中国成本和政策优势
        - 密集供应链和标准支持加快规模化
        - 海外买家仍可能套用结构性中国折价
        - 证明海外商业需求在审查下仍然稳定
      - - 相对最贵同行的估值折价
        - 当前估值远低于 Figure，也低于 Apptronik
        - 也可能是同行估值过高，而不是 Unitree 被低估
        - 证明 Unitree 能把销量转成优于同行预期的经济性
      - - 双平台敞口
        - 四足机器人让业务不只押注人形机器人热潮
        - 收入结构复杂会让可比对象更难选，也可能掩盖低质量收入
        - 按产品家族和终端市场披露收入拆分
      - - IPO 可选性
        - IPO 准备带来真实的重估上行空间
        - US$7B 目标不是已完成轮次的事实
        - 发布更正式的 IPO 准备披露，或更新私募市场条款
    notes: 投资逻辑有意与直接的反向逻辑并列。只有当「改变观点的条件」一栏开始获得真实证据，而不只是叙事支撑时，建议才会改善。
