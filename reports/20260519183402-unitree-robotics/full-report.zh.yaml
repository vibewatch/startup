        - Figure 02 劳动力；Figure 03 家庭；Helix AI
        - 初创公司中资本最厚、AI 品牌最强
        - 价格不透明，披露的部署规模有限
      - - 1X Technologies
        - 挪威 / 美国家庭人形机器人初创公司
        - $125M+ 融资；200+ 名员工；预购阶段
        - 家庭机器人和远程操作辅助自主
        - NEO、NEO Gamma
        - 软体安全家庭设计，远程操作兜底
        - 资本有限，公开工业客户验证有限
      - - Agility Robotics
        - 美国工业人形机器人初创公司
        - $641M+ 融资；约 100 台商用单位
        - 仓储、物流、制造
        - Digit + Arc + 服务
        - 公开工作流栈最完整，且有具名企业用户
        - 价格未披露，对开发者爱好者市场不够可及
      - - Boston Dynamics
        - 美国工业机器人老牌公司
        - Hyundai 支持；Atlas 选择性推出；Spot 已实地部署
        - 工业自动化、巡检、物料搬运
        - Atlas、Spot、Orbit
        - 企业信任、载荷和集成纪律
        - Atlas 不能公开购买，价格不透明
      - - Agibot
        - 中国人形机器人和表演机器人竞争对手
        - 声称部署 1,000+ 台 A2；公开电商价格
        - 商业表演、展览、具身 AI 平台
        - A2 Ultra、X2、A2 Lite、平台软件
        - 价格和认证透明，表演用途组合更广
        - 支持责任仍推回买方；西方验证有限
      - - DEEP Robotics
        - 中国四足机器人替代品
        - 在公用事业、救援和公共安全中有工业部署
        - 巡检、巡逻、危险环境
        - 四足系统
        - 机动性比手更重要时，它是务实替代品
        - 不是直接的通用人形平台
      - - UBTECH
        - 中国机器人老牌公司
        - 商业和教育覆盖面广
        - 人形服务、教育、养老、消费硬件
        - 人形及更广机器人组合
        - 纯人形初创公司之外的装机基础经验
        - 公开材料覆盖广，但对当前旗舰人形机器人的经济性深度不足
      - - Fourier
        - 中国聚焦灵巧操作的人形机器人竞争对手
        - 官方推进 GR-2 产品，配 SDK 和触觉手
        - 开发者和企业实验
        - GR-2 人形机器人
        - 相较 Unitree G1 基础版，公开的灵巧与触觉叙事更强
        - 价格未披露，商业部署规模不公开
      - - 现状替代品
        - 固定自动化、AMR、四足机器人和人工
        - 成熟行业，装机基础深厚
        - 仓库、工厂、巡检、安全
        - 机械臂、AMR、Spot 类四足机器人、人工工作流
        - ROI、支持和操作流程更清晰
        - 比成功人形机器人可能提供的通用移动性和具身能力更弱
    notes: 规模与融资字段混合公司直接披露、分析师或媒体报道；它们只是尽力收集的公开信号，不是经审计财报。纳入现状替代品， 是因为很多买方仍可完全绕开人形机器人。
