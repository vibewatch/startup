  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 2028 年收入
      - 估值区间
      - 从当前入场价看
      - 概率信号
    rows:
      - - 乐观
        - 工业需求放量，海外渠道保持开放，软件 / 服务附加改善，IPO 路径保持可信
        - US$500M–US$800M
        - US$3.0B–US$6.4B
        - 上行空间有吸引力，但经济性质量必须追上出货故事
        - 需要看到工业重复订单和利润率进展
      - - 基准
        - 销量继续增长，但结构仍以开发者、研究、表演和早期商业用途为主
        - US$300M–US$450M
        - US$1.2B–US$2.7B
        - 相对当前估值只有中等上行
        - 最符合今天可测得的市场结构
      - - 悲观
        - 安全审查升温，ASP 受压，Unitree 仍主要是低毛利硬件商
        - US$180M–US$250M
        - US$0.6B–US$1.0B
        - 当前入场会产生资本损失
        - 由出口 / 采购限制或工业转化疲弱触发
    notes: 收入区间是分析师估计，锚定公开收入底盘和人形机器人市场的可测现状。倍数不是上市公司可比估值，而是为一家资本密集、经济性披露不完整的机器人公司设定的情景带。
