- id: supply-chain-and-dependencies
  title: Supply Chain, Distribution, and Dependency Risk
  body: 'Unitree benefits enormously from the same China-centered supply web that also creates its dependency risk. Third-party
    reporting attributes the company''s price advantage to component ecosystems in China; if export-control rules or domestic
    bottlenecks tighten, that edge can compress quickly. The company''s overseas route to market is also structurally dependent
    on distributors and early adopter buyers rather than a direct western operating footprint. Wire China shows that current
    U.S. demand is real, but it clusters in universities, police departments, and Army research rather than in large recurring
    industrial contracts. That leaves Unitree exposed to channel fragility: a distributor, customer, or regulator can interrupt
    momentum before the company has built an independent local support base. Peers such as Agility and Boston Dynamics matter
    here not only as competitors, but as proof that software integration, field service, and named industrial users are themselves
    risk mitigants. Unitree does not yet disclose the same operating cushion.'
  claimRefs:
  - CR014
  - CR016
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  - CR037
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: execution-customer-proof-and-valuation
  title: Execution, Customer Proof, IP / Moat, and IPO Timing Risk
  body: Execution risk is not just about manufacturing more robots. Unitree still has to convert a developer-led, price-led
    growth motion into a supportable enterprise business before IPO scrutiny rises. The open SDK and simulation footprint
    is a powerful adoption engine, but it also weakens proprietary lock-in and makes the moat look more like speed and cost
    than protected workflow ownership. That is acceptable if customer proof arrives fast; it becomes problematic if peers
    keep owning the trust layer. Public reporting shows Unitree has real revenue scale and private-market traction, but any
    public-market step-up toward a much higher IPO valuation would force investors to underwrite durability in customer retention,
    compliance, and quality—all areas where the public record remains thin. The combination of fast growth, incomplete disclosure,
    and geopolitical overhang means valuation and timing risk is not a side note; it is one of the most direct ways the thesis
    can break.
  claimRefs:
  - CR015
  - CR027
  - CR028
  - CR029
