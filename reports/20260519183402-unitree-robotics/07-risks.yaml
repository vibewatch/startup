  evidenceGaps:
  - type: missing-source
    severity: material
    topic: liability-insurance
    missingEvidence: Unitree product-liability insurance terms, incident-response playbooks, and customer contract indemnities.
    whyItMatters: Without contractual and insurance detail, legal exposure after a physical or privacy incident cannot be
      sized confidently.
    diligencePath: Request customer MSA templates, insurance certificates, and any incident-escalation documents from Unitree
      or channel partners.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: blocking
    topic: chip-and-cloud-architecture
    missingEvidence: Named AI-chip suppliers, EAR classifications, cloud endpoints, and any data-localization options for
      overseas customers.
    whyItMatters: Export-control, supply-chain, and privacy risk all depend on technical architecture that is not disclosed
      in the public record.
    diligencePath: Run management diligence on preferred chips, alternative suppliers, network architecture, and overseas
      data-hosting options.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR002
    - TR003
  - type: missing-source
    severity: material
    topic: enterprise-customer-proof
    missingEvidence: Named recurring industrial customers, expansion data, support staffing, and field-reliability metrics
      for humanoid deployments.
    whyItMatters: Customer-proof and quality are the main bridge between a cheap developer platform and an investable enterprise
      robotics company.
    diligencePath: Request top-customer list, deployment duration, renewal status, MTBF, failure rates, and support SLAs by
      geography.
    relatedQuestionRefs:
    - QR014
    - QR021
    relatedTableRefs:
    - TR003
  - type: stale
    severity: material
    topic: ipo-timeline
    missingEvidence: Current CSRC / exchange timetable and any updated valuation target after the 2025 funding and 2026 policy
      backdrop.
    whyItMatters: IPO timing is central to valuation realization and can change quickly as policy or quality issues emerge.
    diligencePath: Refresh pre-IPO counsel, underwriter, and timetable data before any investment decision tied to near-term
      listing.
    relatedQuestionRefs:
    - QR017
    relatedTableRefs:
