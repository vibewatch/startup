- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Procurement-ban / geopolitical closure
    - ASRA or similar restrictions
    - Passage, broadening scope, or major self-exclusion by regulated buyers
    - Move to avoid unless overseas thesis is no longer core
  - - Export-control spillover
    - New chip restrictions or disclosed supply interruption
    - Delivery delays, spec downgrades, or sudden redesign requirement
    - Re-underwrite cost curve and delivery credibility
  - - Cyber / privacy shock
    - Independent exploit, confirmed telemetry abuse, or regulator inquiry
    - Named customer pause, recall, or public incident
    - Treat as thesis-break until remediation is independently verified
  - - Quality / support failure
    - Warranty claims, failures, or support backlog materially rise
    - No public support extension plus growing field base
    - Discount enterprise conversion and margin assumptions
  - - Customer-proof gap
    - Named industrial customers remain absent
    - No disclosed recurring production deployments before IPO process advances
    - Re-rate story as developer/research hardware rather than enterprise robotics platform
  - - IPO timing / valuation risk
    - IPO delay, repricing, or governance shortfall
    - CSRC / exchange process slips while policy scrutiny rises
    - Avoid underwriting peak valuation until disclosure improves
  - - Moat erosion
    - Peers close price gap or surpass Unitree on service at similar cost
    - Agibot / 1X / others publish materially lower prices or better support
    - Reassess whether Unitree still deserves a cost-and-breadth premium
  notes: The table converts broad risks into explicit monitoring triggers. For this company, kill criteria are mostly external
    events or missing proof points rather than quarter-to-quarter product-feature misses.
