    - Government-adjacent and regulated buyers may self-exclude before passage
    - Track bill progress, House/Senate uptake, and enterprise customer reactions
  - - Export-control spillover into advanced chips and robotics supply
    - United States / China cross-border
    - EAR rules already expanded; compliance and enforcement remain active
    - medium
    - high
    - Supplier diversification and chip substitution could help if they exist
    - Cost, performance, or delivery could deteriorate without public warning
    - Request named chip suppliers, EAR classifications, and alternative sourcing paths
  - - Product-liability and accountability ambiguity for humanoid injury or malfunction
    - US / EU / major operating markets
    - Legal frameworks still immature for embodied AI
    - medium
    - high
    - Contracts and insurance can transfer part of the risk
    - A single serious incident could trigger outsized legal and reputational damage
    - Review insurance, indemnities, safety manuals, and incident-response playbooks
  - - Privacy / biometric-data compliance for audio, video, and sensor data
    - EU / UK / other privacy-heavy markets
    - Live risk whenever robot data flows cross borders
    - high
    - high
    - Data minimization, localization, and better disclosure can reduce risk
    - Opaque telemetry or cloud architecture can block regulated customers entirely
    - Map data flows, retention, and hosting options for each target geography
  - - China standards divergence versus western conformity expectations
    - China plus export markets
    - New standards published in 2026
    - medium
    - medium
    - Domestic standardization should improve baseline testing and documentation
    - Divergent standards can create duplicate certification work and buyer confusion
    - Confirm certifications, notified-body plans, and crosswalk to western compliance requirements
  - - Policy concentration on Chinese local support and robotics-cluster priorities
    - China domestic
    - Supportive today but policy-driven
    - medium
    - medium
    - Hangzhou cluster support lowers near-term execution friction
    - If priorities shift, Unitree loses part of its cost and commercialization advantage
    - Validate subsidies, facilities, and policy dependencies by province
