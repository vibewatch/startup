company:
  name: Unitree Robotics
chapter:
  number: 7
  title: Risks
  summary: 'Unitree''s highest-severity risks are external rather than purely technical: geopolitics, procurement bans, export-control
    spillover, and privacy/security narratives can shut buyers out before the company proves western enterprise maturity.
    The mitigations—China policy support, low pricing, fast iteration, OTA updates, and a broad developer ecosystem—are real
    but incomplete, leaving residual exposure highest on policy, cyber/privacy, customer proof, and IPO-timing risk.'
sections:
- id: geopolitical-and-regulatory
  title: Geopolitical, Procurement-Ban, and Regulatory Risk
  body: The risk stack starts with Unitree's origin. U.S. lawmakers are no longer talking only about drones and telecom gear;
    the American Security Robotics Act explicitly targets ground robots from foreign entities of concern, and IEEE frames
    that proposal as part of a bipartisan decoupling agenda. Even if the bill never becomes law, its rhetoric matters because
    it gives regulated and government-adjacent buyers a defensible reason to avoid Chinese robots preemptively. Export-control
    risk compounds the problem. U.S. government sources show that semiconductor restrictions on China are already broad, expanding,
    and administratively messy. Unitree is not publicly disclosed as a sanctions target, but it still depends on a hardware
    ecosystem living inside that policy blast radius. Domestic Chinese standards and Hangzhou policy support do help near-term
    scale and safety governance, yet they do not solve the foreign-policy objection that Chinese origin itself creates for
    western buyers.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
