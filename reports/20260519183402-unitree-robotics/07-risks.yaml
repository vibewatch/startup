callouts:
- calloutType: risk
  title: Geopolitics is the first-order risk, not just a background factor
  body: Unitree can improve products faster than it can change country-of-origin. Because procurement and privacy debates
    focus on that origin, policy risk can shut doors even when the hardware keeps getting better and cheaper.
  claimRefs:
  - CR001
  - CR006
  - CR034
- calloutType: recommendation
  title: Treat customer-proof and cyber assurance as the two key diligence gates
  body: If Unitree can show durable industrial customers plus credible security remediation, much of the remaining risk becomes
    ordinary hardware execution. If it cannot, the company remains vulnerable to policy, privacy, and IPO repricing shocks.
  claimRefs:
  - CR024
  - CR035
  - CR037
  - CR041
