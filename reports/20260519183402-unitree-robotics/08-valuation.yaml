company:
  name: Unitree Robotics
chapter:
  number: 8
  title: Valuation
  summary: Unitree’s current private-market anchor of roughly US$1.6B–US$1.7B is easier to defend than
    the richest humanoid comps because the company has real product pricing, visible commercialization,
    and a reported revenue floor. But the public evidence still does not justify aggressive entry at that
    price without better disclosure on margins, segment mix, and downside structure; the best-supported
    stance is TRACK with explicit bull, base, and bear bands rather than a blind discount-to-Figure thesis.
sections:
- id: recommendation-thesis
  title: Recommendation, thesis, and anti-thesis
  body: 'Unitree merits a TRACK recommendation at the current roughly US$1.6B–US$1.7B implied valuation.
    The thesis is real: few humanoid and legged-robot companies can point to all of the following at once—published
    product pricing, direct sales channels, real reported revenue, a broad portfolio across quadrupeds
    and humanoids, and visible overseas demand. Unitree is not a zero-revenue idea stock. Its low prices
    and shipping cadence give it a commercialization profile that many richer peers still lack.


    The anti-thesis is equally important. The current public evidence base still says much more about
    Unitree’s volume and visibility than about its economics. Gross margin, shipment mix, warranty burden,
    and recurring software or service revenue are not disclosed. IDC-backed reporting also says the measured
    2025 humanoid market was only about US$440M and was led by performances, education, data collection,
    and reception—not by scaled industrial ARR. That means investors are still underwriting a transition
    from affordable hardware volume into more durable industrial economics. Security scrutiny and Chinese-domicile
    discounting further explain why Unitree trades far below Figure or Apptronik. The public evidence
    therefore supports a price-sensitive track posture, not a conviction buy at the current mark.'
