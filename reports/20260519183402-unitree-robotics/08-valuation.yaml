  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-and-preferences
    missingEvidence: Unitree’s preference stack, liquidation terms, and detailed cap table are not public.
    whyItMatters: These terms determine whether a seemingly fair enterprise value can still produce weak
      common-equity outcomes.
    diligencePath: Request term sheet or legal summary from the current round, plus IPO-prep materials
      if available.
    relatedQuestionRefs:
    - QV028
    - QV029
  - type: private-evidence-only
    severity: material
    topic: margin-and-warranty
    missingEvidence: No public gross-margin, warranty reserve, or field-failure disclosure was found for
      Unitree.
    whyItMatters: Without these economics, investors cannot determine whether low prices are a moat or
      a future problem.
    diligencePath: Request management accounts with product-family gross margin, service attach rate,
      returns, and warranty claims.
    relatedQuestionRefs:
    - QV019
    - QV030
  - type: private-evidence-only
    severity: material
    topic: shipment-mix
    missingEvidence: Public sources do not disclose how Unitree’s reported shipments split across industrial,
      developer, research, performance, and other channels.
    whyItMatters: Scenario underwriting depends on whether volume is converting into durable enterprise
      demand or simply broad low-accountability use.
    diligencePath: Request shipment mix and repeat-order data by end market for 2025 and 2026 YTD.
    relatedQuestionRefs:
    - QV025
    - QV031
  - type: access-blocked
    severity: minor
    topic: ubtech-public-market-cap
    missingEvidence: The fetched HKEX quote page did not expose a clean text-mode market-cap value for
      UBTech.
    whyItMatters: A directly readable public-market benchmark would improve the China peer section.
    diligencePath: Pull a machine-readable exchange data feed or current annual report excerpt that states
      shares outstanding and market cap.
    relatedQuestionRefs:
    - QV012
    relatedTableRefs:
    - TV004
