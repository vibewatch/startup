- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Why it matters
  - Action implication
  rows:
  - - Export or procurement restrictions broaden materially
    - Public-sector or sensitive commercial bans spread beyond isolated scrutiny
    - Would narrow foreign TAM and compress the multiple investors will pay for Unitree
    - Move to negative view unless domestic economics alone support price
  - - Shipment growth does not convert to industrial repeat demand
    - No credible industrial recurring-demand evidence by 2027
    - Would re-rate Unitree from platform story to low-margin hardware vendor
    - Do not add at current or higher price
  - - Down-round or shelved IPO narrative
    - Next financing below current mark or IPO-prep story stalls
    - Would undermine the main rerating mechanism visible in public evidence
    - Re-underwrite to bear-case band
  - - Gross margin proves structurally weak
    - Diligence reveals low or negative product-family margin after service burden
    - Would eliminate the idea that scale automatically improves value
    - Treat low price as commoditization, not moat
  - - Material security incident or audit failure
    - Public breach, safety incident, or critical procurement audit failure
    - Would reinforce the China discount and delay enterprise adoption
    - Pause or exit until remediation is demonstrated
  notes: Kill triggers are observable events, not generalized worries. Each one directly attacks either
    Unitree’s addressable market, valuation multiple, or ability to defend the current pricing narrative.
  claimRefs:
  - CV039
  - CV040
  - CV041
  - CV042
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue mix by product family and end market
    - No public split across quadrupeds, humanoids, components, services, industrial, research, or performance
      demand
    - Determines whether current growth is compounding into durable value
    - Request management accounts or IPO-prep materials
  - - Gross margin, warranty, and field-failure data
    - No public unit economics for hardware or service burden
    - Separates scale moat from low-price commodity trap
    - Request product-family contribution margin and warranty reserve schedule
  - - Cap table and preference stack
    - No public liquidation, participation, or anti-dilution detail
    - Equity returns can diverge sharply from enterprise value
    - Request legal summary of current round terms
  - - Industrial recurring-demand proof
    - No public contract-value, renewal, or ARR-style disclosure
    - Current valuation needs better demand quality than shipment volume alone
    - Ask for industrial customer cohort, repeat orders, and service attach
  - - Overseas exposure and policy contingency
    - Limited detail on where overseas sales sit and how exposed they are to procurement restrictions
    - Foreign TAM can disappear faster than domestic TAM
    - Map revenue by geography and customer class
  - - IPO-prep substance
    - IPO prep is public, but formal filing content is not
    - IPO optionality is the clearest rerating path currently visible
    - Request timetable, audit readiness, and advisor workstream detail
  notes: The first four asks are the most important because they directly affect valuation support at
    the current price. Without them, the best-supported posture remains track rather than buy.
  claimRefs:
