- id: why-public-evidence-is-not-enough
  title: Why public evidence does not fully justify a full-size entry
  body: 'Public evidence gets Unitree partway to investable. It confirms the company is real, shipping,
    priced, and already commercializing across more channels than most peers. It also supports a strong
    relative argument against the most inflated private-market comps: Figure looks far more expensive,
    and Apptronik is clearly priced for a bigger future than its current public evidence base proves.
    But the critical missing layer is economics quality. None of the fetched sources discloses Unitree’s
    gross margin, product-family mix, service attach, warranty burden, or liquidation stack. Investors
    therefore know the company has demand, but they do not know whether that demand compounds into attractive
    enterprise value or merely into hard-to-service hardware revenue.


    That is the core reason this chapter stops at TRACK. The problem is not that public evidence is negative;
    it is that the current price already asks investors to believe in revenue quality that has not yet
    been publicly demonstrated. Security scrutiny adds a separate but real multiple discount that Western
    peers do not face to the same degree. The right read is therefore fair-to-stretched: Unitree is not
    an obvious bubble, yet the public evidence base still does not support paying up as if the transition
    to high-quality industrial ARR has already happened.'
