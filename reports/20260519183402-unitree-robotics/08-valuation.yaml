- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Why it matters
  - Anti-thesis / what weakens it
  - What would change the view
  rows:
  - - Real product-market proof
    - Unitree already publishes product pages, prices, and shipment evidence across quadrupeds and humanoids
    - Volume alone may still be low-margin hardware revenue
    - Disclose gross margin and repeat-order rates
  - - China cost and policy advantage
    - Dense supply chain and standards support faster scaling
    - Foreign buyers may apply a structural China discount anyway
    - Show that overseas commercial demand remains durable despite scrutiny
  - - Relative-value discount to richest peers
    - Current mark is far below Figure and below Apptronik
    - Peers may be overvalued, not Unitree undervalued
    - Prove Unitree can convert volume into better economics than peers expect
  - - Dual platform exposure
    - Quadrupeds diversify the business beyond pure humanoid hype
    - Mix complexity makes comparable selection harder and can hide lower-quality revenue
    - Provide revenue split by product family and end market
  - - IPO optionality
    - IPO prep creates real rerating upside
    - US$7B aspiration is not a closed-round fact
    - Publish more formal IPO-prep disclosures or update private-market terms
  notes: The thesis is intentionally balanced against direct anti-thesis statements. The recommendation
    would improve only if the “what would change the view” column starts receiving real evidence rather
    than narrative support.
