- id: financing-and-comparables
  title: Financing context and comparable set
  body: 'The current valuation anchor for Unitree is relatively strong by private-market standards: TechNode
    and The Robot Report both place the company around US$1.6B–US$1.7B after the 2025 Series C context,
    while Humanoid Index rounds the company lower at US$1.4B-plus and also carries a much more promotional
    US$7B IPO aspiration. This conflict is useful rather than fatal. It tells investors that closed-round
    evidence and forward-narrative evidence should not be blended into one anchor. The more conservative
    way to underwrite the price is to use the closed-round mark for entry discipline and treat the IPO
    figure as a bull-case narrative only.


    Relative to peers, Figure’s ~US$39B is the sector outlier, not the clearing price for all humanoid
    companies. Apptronik’s roughly US$5B sits well above Unitree but comes with nearly US$1B of capital
    raised and a heavily strategic investor base. Agility and 1X provide more grounded mid-tier references,
    while Agibot and UBTech are useful China context but weaker numeric anchors in the fetched set. The
    important comparative point is not that Unitree is “cheap because lower.” It is that Unitree combines
    stronger present-day product proof than many peers with materially lower disclosure quality on margins
    and segment mix, plus a clear China geopolitical discount. That mix makes today’s valuation understandable
    but not obviously mispriced in the investor’s favor.'
