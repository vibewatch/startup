- id: diligence-asks-and-triggers
  title: Final diligence asks, thesis-break triggers, and exit paths
  body: 'The current public set points to a small number of diligence items that would materially change
    the call. The first is revenue quality: investors need segment mix, gross margin, and repeat-order
    evidence to determine whether Unitree is evolving from a low-price robot vendor into a defensible
    robotics platform. The second is downside structure: without cap-table and liquidation details, even
    a fair enterprise value could still be unattractive equity. The third is geopolitical durability:
    U.S. and allied procurement or export restrictions could narrow foreign TAM quickly, particularly
    in public-sector or sensitive commercial buyers.


    Exit paths exist, but the most supportable near-term path is still an IPO or pre-IPO re-rating inside
    China rather than a premium global strategic M&A outcome. The IPO-prep narrative is real, but it should
    not be underwritten as an inevitability. A shelved IPO, a down-round, or evidence that reported shipment
    growth is not converting into repeat industrial contracts would all break the bull narrative. Conversely,
    the recommendation would improve if Unitree disclosed segment economics, showed credible industrial
    recurring demand, and offered investors either better price or better downside protection. Until then,
    the prudent posture is to track closely, engage on diligence, and avoid assuming that volume leadership
    alone will close the valuation gap with the richest peers.'
