callouts:
- calloutType: insight
  title: Unitree is the category's pricing reference point
  body: No other major humanoid vendor makes entry pricing as visible as Unitree. That visibility lowers experimentation friction,
    accelerates developer adoption, and forces every rival discussion to answer a Unitree benchmark even when the rival sells
    a more capable system.
  claimRefs:
  - CP001
  - CP002
  - CP031
- calloutType: risk
  title: Cheap hardware does not equal enterprise trust
  body: Unitree wins first meetings on cost, but the public record still leaves gaps on manipulation depth, workflow software,
    support coverage, privacy posture, and named enterprise renewals. Those gaps are exactly where Agility, Boston Dynamics,
    and some Chinese peers can still defend share.
  claimRefs:
  - CP032
  - CP037
  - CP038
  - CP040
