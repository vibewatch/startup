- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Main threat
  - Severity
  - Current evidence
  - Mitigation / diligence ask
  rows:
  - - Lowest visible price point in humanoids
    - Peers slash price or subsidize deployments
    - high
    - G1 list pricing remains the public benchmark, but Agibot and 1X are also pushing lower-cost narratives
    - Track peer pricing disclosures and whether Unitree preserves gross margin while scaling
  - - Broad embodied-robot portfolio
    - Narrower peers close the gap with better flagship execution
    - medium
    - Unitree spans quadrupeds, humanoids, arms, lidar, and developer assets
    - Test whether cross-sell actually converts into recurring platform revenue
  - - Open developer ecosystem
    - Open tools reduce lock-in and invite copying
    - high
    - SDK2, ROS2, RL, and templates make Unitree easy to adopt and easy to leave
    - Ask for app-store, cloud, or recurring-software metrics that deepen retention
  - - China supply-chain cost advantage
    - Policy shocks or component restrictions erode access or raise costs
    - high
    - Third-party reporting attributes major cost edge to Chinese component ecosystems
    - Validate supplier concentration, export-control exposure, and alternative sourcing paths
  - - Fast overseas distribution via distributors
    - Support quality and compliance depth lag enterprise expectations
    - high
    - Wire China shows distributor-led U.S. sales but limited direct local operating presence
    - Ask for SLA coverage, parts depots, and direct enterprise support headcount by region
  - - Speed to market in research and edge deployments
    - Regulated buyers choose trust-heavy western alternatives
    - high
    - Security criticism and procurement-ban rhetoric create a non-price wedge against Unitree
    - Stress-test win rates in government-adjacent or privacy-sensitive sectors
  notes: This register evaluates competitive durability rather than pure technical merit. A moat can be valuable and still
    fragile if it depends on policy, trust, or support assumptions that change faster than hardware costs.
