- id: moat-durability-and-adverse-evidence
  title: Moat Durability — Cost Curve and Ecosystem Are Real; Trust, Manipulation, and Policy Remain Weak Points
  body: 'The durable part of Unitree''s moat is straightforward: fast Chinese manufacturing, lower component costs, breadth
    across robot categories, and an open developer ecosystem that makes the platform easy to trial. Those attributes are hard
    for western startups to replicate quickly. The weak part is equally visible. Unitree does not yet disclose the same workflow
    software, named enterprise deployment depth, or safety/compliance posture that Agility and Boston can point to. Policy
    rhetoric in Washington increasingly frames Chinese robots as security problems, and independent security research on G1
    amplifies the idea that low price does not equal enterprise trust. In practice, that means Unitree is well positioned
    to commoditize entry-level embodied robotics, especially in research and price-sensitive use cases, but remains exposed
    when the buyer cares most about manipulation reliability, support, privacy, or procurement scrutiny. The moat is therefore
    strong on cost and breadth, medium on ecosystem, and weak on trust-driven lock-in.'
