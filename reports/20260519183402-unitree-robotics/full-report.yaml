      - number: '2.3'
        title: 'Buyer segments: industrial inspection, developers, research, and promotional use'
        blocks:
          - type: paragraph
            body: >-
              Unitree’s buyer map is more fragmented than the long-run humanoid narrative suggests. In quadrupeds,
              industrial inspection, emergency response, public safety, and utility-style workflows are the clearest
              current budgets because the B2 product is explicitly designed around payload, endurance, and difficult
              terrain. The Wire China also documents actual U.S. demand from universities, local police, and the Army,
              where affordability is the decisive factor. Academic labs and developers form a second clear segment:
              GitHub tooling, SDK documentation, and outside academic papers on Go1 usage all point to repeatable
              research and education demand. These buyers often pay from R&D, lab, or departmental capital budgets
              rather than enterprise automation budgets.


              Humanoids are commercial, but the current buyer mix is less mature than the inspection segment. IDC says
              2025 shipments were led by performances, research and education, data collection, and reception. That
              aligns with Unitree’s high-visibility Gala exposure and with the company’s own developer-oriented
              messaging around G1. Future household use is part of management’s public ambition, but the fetched
              evidence does not show a scaled home-revenue market yet. The most important practical distinction is
              therefore not “consumer versus enterprise” in the abstract; it is whether the buyer is purchasing a robot
              for a repeatable workflow with measurable ROI or for development, experimentation, data collection, or
              promotional visibility. Unitree currently participates in both sides, and that mixed demand profile drives
              both opportunity and valuation ambiguity.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM016
              - CM017
