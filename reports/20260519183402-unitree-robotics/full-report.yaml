  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              The public evidence strongly favors a hardware-led revenue model. Unitree sells consumer and industry
              quadrupeds, developer-facing humanoids, robot arms, lidar, and related tooling; KrASIA quoted Wang in 2021
              saying the majority of revenue already came from robot sales, with only a minor portion from performances.
              That historical comment still fits the current catalog. TechNode adds an important segmentation clue:
              quadrupeds are aimed mainly at consumers, while humanoids are aimed at developers who modify perception
              and motion algorithms on top of Unitree hardware. The price ladder reinforces that segmentation. Go2
              starts at US$1,600 on the official page and US$2,800 on the shop page; G1 is advertised at US$13.5K on the
              product page and US$16K on the shop page; H1 is listed at US$90K; STEMfinity lists Z1 arms at
              US$13,387.50; and B2 appears to sit in a quote-led industrial workflow rather than a fully transparent
              ecommerce path. Those are list anchors, not realized ASPs, because taxes, shipping, customs, channel
              discounts, and after-sales obligations are not disclosed.
