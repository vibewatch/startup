companyProfile:
  summary: >-
    Unitree Robotics is a Hangzhou-based legged and humanoid robotics company founded in 2016 by Wang Xingxing. The
    company's strategy is to commercialize high-performance robots at materially lower price points than many western
    peers, while controlling more of the component stack in-house. Public evidence shows a broad lineup that now spans
    Go2 quadrupeds, B2 industrial robots, G1 and H1 humanoids, Z1 robotic arms, lidar, SDKs, and reinforcement-learning
    tooling. Unitree's products are sold directly and through developer-facing channels rather than existing only as lab
    prototypes, which distinguishes it from several richly valued humanoid peers. The company remains private and
    financially opaque, but it has enough public traction to be treated as a real operating robotics business rather
    than a concept-stage story.
