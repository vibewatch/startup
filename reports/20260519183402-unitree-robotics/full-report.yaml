      - number: '2.4'
        title: China tailwinds are real, but adoption constraints remain binding
        blocks:
          - type: paragraph
            body: >-
              Unitree benefits from two unusually strong tailwinds. First, China’s manufacturing ecosystem and dense
              supplier base compress component cost and production lead times, helping domestic robot makers
              commercialize faster than many Western peers. Second, the policy stack is becoming more explicit: 2026
              national standards for humanoids and embodied AI, Hangzhou’s “global home port” cluster, and a domestic
              environment that already treats robotics as strategic infrastructure all increase the probability of
              faster local testing, certification, and procurement. These are not abstract policy slogans; they reduce
              friction across pilot manufacturing, testing, and supply chain sourcing.


              But these tailwinds do not remove the core constraints. IFR still warns that humanoids are not near
              universal replacement for conventional industrial robots. IDC’s 2025 market mix shows that the industry’s
              real demand center remains earlier-stage than the hype cycle implies. Unitree also faces trust frictions
              that go beyond engineering: cybersecurity research highlights broad attack surfaces, and U.S. political
              scrutiny already frames the company as a security risk in public-sector contexts. Low prices help win
              today, but they may also signal future gross-margin pressure if the market commoditizes before software
              and services mature. The practical conclusion is that China supply-chain and policy tailwinds accelerate
              commercialization timing, yet adoption still depends on workflow-specific ROI, safety confidence, and
              geopolitically acceptable procurement paths.
