  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape — Direct Peers, Incumbents, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Unitree is not competing in a clean greenfield market. The direct humanoid peer set includes western
              startups pursuing industrial or home deployment narratives (Figure, 1X, Agility, Boston Dynamics) and a
              dense Chinese cohort that spans full-size humanoids, entertainment robots, and quadruped substitutes
              (Agibot, Fourier, UBTech, DEEP Robotics). Public evidence also shows that the buyer can often avoid a
              humanoid altogether: Agility explicitly frames Digit as connecting existing automation islands, Boston
              already sells Spot into inspection workflows, DEEP sells quadrupeds into utility and rescue work, and
              Goldman/IFR both argue that affordability and use-case maturity still constrain adoption. That means
              Unitree must beat not only other humanoids, but also proven status-quo stacks such as fixed industrial
              automation, AMRs, quadrupeds, and labor-intensive human workflows. The field is already crowded enough
              that low cost alone will not produce winner-take-all dynamics.
            claimRefs:
