      - number: '7.3'
        title: Supply Chain, Distribution, and Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              Unitree benefits enormously from the same China-centered supply web that also creates its dependency risk.
              Third-party reporting attributes the company's price advantage to component ecosystems in China; if
              export-control rules or domestic bottlenecks tighten, that edge can compress quickly. The company's
              overseas route to market is also structurally dependent on distributors and early adopter buyers rather
              than a direct western operating footprint. Wire China shows that current U.S. demand is real, but it
              clusters in universities, police departments, and Army research rather than in large recurring industrial
              contracts. That leaves Unitree exposed to channel fragility: a distributor, customer, or regulator can
              interrupt momentum before the company has built an independent local support base. Peers such as Agility
              and Boston Dynamics matter here not only as competitors, but as proof that software integration, field
              service, and named industrial users are themselves risk mitigants. Unitree does not yet disclose the same
              operating cushion.
