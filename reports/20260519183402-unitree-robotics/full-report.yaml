  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product family and workflow fit
        blocks:
          - type: paragraph
            body: >
              Unitree's public product surface is unusually broad for a private robotics vendor: Go2 targets low-cost
              developer, education, and light-duty field use; B2 targets industrial inspection and heavy-duty mobility;
              G1 and H1/H1-2 target humanoid R&D, teleoperation, manipulation, and showcase deployments; Z1 extends the
              stack into arms and onboard manipulation. The common commercial pattern is not a single turnkey workflow,
              but a hardware platform strategy: a buyer chooses a body form factor, then layers secondary development,
              RL policies, ROS2 control, or integrator support around it. That matters because the company's
              best-evidenced workflows are still engineering-led rather than end-user consumer automation. Go2's page
              foregrounds mapping, side-follow, 4D lidar, OTA updates, and secondary development; B2 emphasizes
              all-terrain inspection, stair climbing, obstacle traversal, load carrying, and optional charging; G1 and
              H1/H1-2 emphasize dexterity, high torque density, lidar plus depth sensing, and developer expansion. Z1's
              public messaging is thinner, but it is explicitly positioned as an open-program arm for mobile robot
              payload work, logistics, and research. Public event appearances raise awareness, yet the strongest
              workflow evidence remains research, inspection, and integrator-led deployment rather than mass-market
              autonomous household use.
            claimRefs:
