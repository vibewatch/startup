    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Founding Story, and Mission
        blocks:
          - type: paragraph
            body: >-
              Unitree Robotics is consistently described across official and independent sources as a Hangzhou-based
              robotics company founded in 2016 by Wang Xingxing. The founding story matters because it explains the
              company's commercial DNA: Wang told KrASIA that he built the XDog quadruped during graduate study,
              realized electric actuation could radically cut cost and improve agility, briefly joined DJI, then left
              after roughly two months to start Unitree in May 2016. That low-cost, fast-cycle thesis still shows up in
              today's positioning. Official materials center the company on civilian robotics, describe a mission of
              technology-driven progress, and frame Unitree as building a broad platform of quadrupeds, humanoids,
              manipulators, and core components rather than a one-off demo product. The rhetoric is idealistic, but the
              consistent through-line is democratization through affordability and speed rather than bespoke
              research-only systems. That combination helps explain why Unitree shows up in both consumer and developer
              contexts.
            claimRefs:
