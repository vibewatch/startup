      - number: '5.4'
        title: Safety, differentiation, and technical risks
        blocks:
          - type: paragraph
            body: >
              Unitree's core differentiation is the combination of low-price public hardware, vertical integration into
              key robot components, and a relatively open developer surface. That combination likely explains why its
              robots appear so often in research labs, public showcases, and cost-sensitive buyer discussions. But the
              same public corpus also highlights material risks. Safety disclaimers are not boilerplate footnotes buried
              in terms; they are embedded directly in G1, H1, B2, Go2, and A1 motor pages, warning about powerful
              motion, the immaturity of global humanoid robotics, the need for safe distance, and the prohibition on
              hazardous modifications. Performance caveats also matter: B2's top speed requires special configurations,
              Go2 notes that some functions need human operation or secondary development, and G1 says some sample
              functions are still under development. External field evidence from Correll Lab punctures the polish of
              marketing demos by showing that a Go1 can navigate rugged terrain but still slip, entangle, and require
              manual rebooting in real environments. The harshest adverse signal is cybersecurity: a 2025 research paper
              alleges BLE provisioning and encryption weaknesses in G1. Even if some claims in that paper remain to be
              independently replicated, it is enough to conclude that Unitree's technical edge does not eliminate the
              need for serious diligence on security, environmental ruggedization, safety certification, and production
              reliability before underwriting broad enterprise deployment.
