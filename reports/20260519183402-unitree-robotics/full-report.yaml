      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Geopolitics is the first-order risk, not just a background factor
            body: >-
              Unitree can improve products faster than it can change country-of-origin. Because procurement and privacy
              debates focus on that origin, policy risk can shut doors even when the hardware keeps getting better and
              cheaper.
