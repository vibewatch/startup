      - number: '6.3'
        title: Durability, concentration, and proof-quality gaps
        blocks:
          - type: paragraph
            body: >
              The chapter's central diligence conclusion is that Unitree has real adoption, but public proof quality is
              uneven and retention evidence is weak. Research usage is the highest-confidence segment because it
              includes direct operator pages and papers, some of which persist over multiple years. Western distributor
              and procurement evidence is directionally positive because it shows warranty, integration, training, and
              government or university sales pathways, but it still sits one layer away from end-customer operating
              outcomes. Public events and CES appearances are strategically useful because they create awareness and, as
              Xinhua notes, interim commercial value; however, they do not prove that buyers renew, expand, or deploy
              fleets at scale. Industrial inspection sits between those extremes: Unitree clearly markets it, and
              distributors actively sell into it, but named third-party operators with quantified outcomes remain
              scarce. Concentration risk likely runs toward research, demo, and channel-assisted export markets simply
              because those are the segments with the densest public proofs. At the same time, western adoption faces
              nontrivial friction from security concerns, political scrutiny, distributor dependence, and the absence of
              public NRR, GRR, top-customer, or cohort data. The practical read is that Unitree already has enough
              customer evidence to justify deeper diligence, but not enough disclosed customer economics to claim
              repeatability across enterprise, industrial, and government cohorts without management data. An investor
              can underwrite evidence of demand generation and low-friction entry, but not yet a fully evidenced
              recurring-customer base.
