      - number: '7.2'
        title: Safety, Cybersecurity, Quality, and Product-Liability Risk
        blocks:
          - type: paragraph
            body: >-
              Unitree's public product pages and the independent security literature point in the same direction: the
              company is early enough that technical progress coexists with real operational uncertainty. The G1 and H1
              pages tell users to keep a safe distance, avoid hazardous use, and understand the limits of early-stage
              humanoids; the G1 base product also publishes only modest arm load and short warranty terms. That alone
              would justify caution in industrial settings. The arXiv security assessment goes further, alleging a
              concrete BLE attack path and recurring telemetry behavior that could become unacceptable in regulated or
              privacy-sensitive environments. Hill Dickinson adds the legal framing: once humanoids leave the lab,
              unclear accountability between manufacturer, operator, and software stack becomes a live liability
              question. Unitree's OTA cadence and developer velocity are useful mitigants, but they are not substitutes
              for audited security assurance, long-term support commitments, or disclosed field-reliability data.
            claimRefs:
