      - number: '5.3'
        title: Deployment maturity and manufacturing posture
        blocks:
          - type: paragraph
            body: >
              Public evidence suggests Unitree is moving beyond lab prototypes, but unevenly across the portfolio. The
              company repeatedly claims public retail leadership in quadrupeds, and the shop pages support that thesis
              by publishing direct prices for Go2 and G1, shipping disclosures, and secondary-development options.
              External CES coverage confirms that Unitree was willing to show Go2, G1, H1, and B2-W together to a global
              buyer audience in early 2025, implying a coherent lineup rather than isolated concept vehicles. The about
              page also says Unitree is continuing to improve its production lines and now covers both ToB and ToC
              legged, humanoid, and arm categories; the Hangzhou robotics-hub article adds a broader ecosystem signal by
              describing pilot production, testing, certification, and training capacity taking shape around firms like
              Unitree. Still, maturity is not uniform. Quadrupeds look closer to deployable products with documented
              loads, endurance, and mapping flows, while humanoids are still sold with prominent cautions about
              limitations, developing features, and safe use. Secondary sources that call Unitree a mass-production
              leader should be treated as directional context, not as audited manufacturing evidence. The most
              defensible maturity view is that Unitree has achieved credible commercialization in quadrupeds and
              developer hardware, while humanoids remain a fast-moving but still pre-fully-validated platform family.
