      - number: '5.2'
        title: Technology stack, in-house components, and developer workflow
        blocks:
          - type: paragraph
            body: >
              The deepest product-technology evidence sits below the robot shells. Unitree's about page explicitly
              claims in-house work on motors, reducers, controllers, lidar, and perception and motion-control
              algorithms, and the A1 motor page makes that claim concrete: the actuator integrates controller, planetary
              reducer, crossed roller bearing, sensors, RS485 communications, and plug-and-play serviceability in a
              single module. Across public robot pages, sensing is equally central: Go2 advertises a self-developed 4D
              lidar, while G1 and H1/H1-2 use lidar plus depth cameras for humanoid perception. On software, Unitree
              exposes far more of its stack than many hardware peers. GitHub repositories cover SDK2, ROS2, Isaac Gym
              RL, Isaac Lab simulation, world-model learning, app templates, URDF assets, and deployment helpers. SDK2
              supports current families across Ubuntu, x86_64, and aarch64; ROS2 uses CycloneDDS and exposes direct
              topics for motion, low-level state, remote control, and lidar; RL Gym formalizes a
              Train-to-Play-to-Sim2Sim-to-Sim2Real loop; Isaac Lab reuses DDS topics from the physical robot; the
              UnifoLM world-model repo adds a more ambitious simulation-plus-policy layer for G1 and Z1 manipulation
              tasks. The result is a visible path from raw hardware to developer app packaging and policy deployment,
              even if official document-center pages remain difficult to inspect through static fetches.
