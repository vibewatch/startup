      - number: '2.2'
        title: Sizing the market with conflicting but useful lenses
        blocks:
          - type: paragraph
            body: >-
              Public market-sizing evidence for Unitree’s opportunity is contradictory because sources are measuring
              different things. Goldman Sachs offers a wide long-run humanoid range from US$6B to US$154B depending on
              whether cost, use-case, and public-acceptance barriers clear. IDC-backed reporting, by contrast, gives a
              grounded current snapshot: roughly 18,000 humanoid units and about US$440M of revenue in 2025. Xinhua’s
              citation of Morgan Stanley points to a much larger 2050 China-only scenario worth 6 trillion yuan and 59
              million units. Forbes adds still another layer by contrasting Goldman’s hardware-market framing with ARK
              Invest’s labor-value framing, which is not a hardware revenue forecast at all.


              For Unitree, the most decision-useful lens is neither the blue-sky TAM nor the most conservative current
              market snapshot alone. The observable SOM floor is already visible in the company’s reported 2024 revenue
              of more than 1 billion yuan and its reported 2025 humanoid shipment scale, which is large relative to the
              measured 2025 humanoid market but still says little about margins or recurring revenue quality. The
              near-term SAM is broader than pure humanoids because Unitree can monetize quadruped inspection and
              research budgets today, yet narrower than generic “global labor replacement” narratives because actual
              demand still skews to performance, education, data collection, and early industrial use. This is why the
              chapter preserves contradictory estimates instead of forcing a fake precision: the market is clearly real,
              clearly growing, and still nowhere near one settled number.
