      - number: '3.2'
        title: Price / Performance — Unitree's Benchmark Is Disruptive, but Not Equivalent to Enterprise Readiness
        blocks:
          - type: paragraph
            body: >-
              Unitree's strongest public evidence is economic, not workflow-specific. G1 is listed around $13.5K-$16K
              and Go2 at $2,800, while western humanoid peers still rely on undisclosed commercial terms, deposits, or
              selective deployment funnels. Even Agibot's transparently priced humanoids sit above Unitree on sticker
              price. That makes Unitree the sector's most visible price-performance anchor for developers, labs, and
              edge-case enterprise buyers. But the spec sheets also show why the company should not be mistaken for the
              most enterprise-ready platform. G1 publishes only about 2-3 kg arm load, optional rather than standard
              dexterous hands, short warranty windows, and explicit warnings that the industry remains early stage.
              Fourier publishes a stronger dexterity story, Atlas publishes heavier payloads and industrial
              integrations, and Agility publishes workflow controls and support. Unitree therefore wins the first
              purchase conversation more often than the full-fleet production conversation.
