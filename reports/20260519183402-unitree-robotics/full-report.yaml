      - number: '8.3'
        title: Bull, base, and bear scenarios with explicit valuation ranges
        blocks:
          - type: paragraph
            body: >-
              The scenario work should be grounded in the public revenue floor rather than in heroic TAM capture math. A
              reasonable bull case assumes Unitree turns product-led volume into industrial and commercial repeat demand
              while keeping overseas channels open. In that case, 2028 revenue could plausibly reach US$500M–US$800M,
              and the company could deserve roughly a 6x–8x EV/revenue band, implying a valuation range around
              US$3.0B–US$6.4B. That scenario requires more than just shipment growth: it requires credible
              demand-quality improvement and some evidence that software, services, or integration attach rates are
              rising.


              The base case is more modest and probably closer to the current public evidence. Unitree keeps growing,
              but the mix remains dominated by developers, research, performances, and early commercial use rather than
              high-quality industrial ARR. That supports something like US$300M–US$450M of 2028 revenue and roughly a
              4x–6x multiple, yielding around US$1.2B–US$2.7B. The bear case assumes geopolitical compression, ASP
              pressure, and low-margin hardware mix cap 2028 revenue around US$180M–US$250M and push the multiple toward
              3x–4x, or roughly US$0.6B–US$1.0B. At a current price around US$1.6B–US$1.7B, the base case is only
              moderately rewarding while the bear case can lose capital, which is why price discipline matters more here
              than sector excitement.
            claimRefs:
              - CV023
              - CV024
