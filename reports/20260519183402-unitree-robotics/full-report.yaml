              China documents rising Washington scrutiny over Unitree's U.S. sales, and a 2025 arXiv paper alleges
              serious security and telemetry risks in the G1. Combined with still-unclear governance detail, those risks
              deserve to travel with the milestone story rather than sit outside it.
