      - number: '8.4'
        title: Why public evidence does not fully justify a full-size entry
        blocks:
          - type: paragraph
            body: >-
              Public evidence gets Unitree partway to investable. It confirms the company is real, shipping, priced, and
              already commercializing across more channels than most peers. It also supports a strong relative argument
              against the most inflated private-market comps: Figure looks far more expensive, and Apptronik is clearly
              priced for a bigger future than its current public evidence base proves. But the critical missing layer is
              economics quality. None of the fetched sources discloses Unitree’s gross margin, product-family mix,
              service attach, warranty burden, or liquidation stack. Investors therefore know the company has demand,
              but they do not know whether that demand compounds into attractive enterprise value or merely into
              hard-to-service hardware revenue.


              That is the core reason this chapter stops at TRACK. The problem is not that public evidence is negative;
              it is that the current price already asks investors to believe in revenue quality that has not yet been
              publicly demonstrated. Security scrutiny adds a separate but real multiple discount that Western peers do
              not face to the same degree. The right read is therefore fair-to-stretched: Unitree is not an obvious
              bubble, yet the public evidence base still does not support paying up as if the transition to high-quality
              industrial ARR has already happened.
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV031
              - CV032
              - CV035
              - CV036
              - CV037
              - CV038
              - CV045
      - number: '8.5'
        title: Final diligence asks, thesis-break triggers, and exit paths
        blocks:
          - type: paragraph
            body: >-
              The current public set points to a small number of diligence items that would materially change the call.
              The first is revenue quality: investors need segment mix, gross margin, and repeat-order evidence to
              determine whether Unitree is evolving from a low-price robot vendor into a defensible robotics platform.
              The second is downside structure: without cap-table and liquidation details, even a fair enterprise value
              could still be unattractive equity. The third is geopolitical durability: U.S. and allied procurement or
              export restrictions could narrow foreign TAM quickly, particularly in public-sector or sensitive
              commercial buyers.


              Exit paths exist, but the most supportable near-term path is still an IPO or pre-IPO re-rating inside
              China rather than a premium global strategic M&A outcome. The IPO-prep narrative is real, but it should
              not be underwritten as an inevitability. A shelved IPO, a down-round, or evidence that reported shipment
              growth is not converting into repeat industrial contracts would all break the bull narrative. Conversely,
              the recommendation would improve if Unitree disclosed segment economics, showed credible industrial
              recurring demand, and offered investors either better price or better downside protection. Until then, the
              prudent posture is to track closely, engage on diligence, and avoid assuming that volume leadership alone
              will close the valuation gap with the richest peers.
            claimRefs:
              - CV002
              - CV022
              - CV027
              - CV028
              - CV038
              - CV039
              - CV040
              - CV041
              - CV042
