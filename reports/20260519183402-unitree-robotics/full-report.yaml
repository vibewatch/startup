      - number: '7.4'
        title: Execution, Customer Proof, IP / Moat, and IPO Timing Risk
        blocks:
          - type: paragraph
            body: >-
              Execution risk is not just about manufacturing more robots. Unitree still has to convert a developer-led,
              price-led growth motion into a supportable enterprise business before IPO scrutiny rises. The open SDK and
              simulation footprint is a powerful adoption engine, but it also weakens proprietary lock-in and makes the
              moat look more like speed and cost than protected workflow ownership. That is acceptable if customer proof
              arrives fast; it becomes problematic if peers keep owning the trust layer. Public reporting shows Unitree
              has real revenue scale and private-market traction, but any public-market step-up toward a much higher IPO
              valuation would force investors to underwrite durability in customer retention, compliance, and
              quality—all areas where the public record remains thin. The combination of fast growth, incomplete
              disclosure, and geopolitical overhang means valuation and timing risk is not a side note; it is one of the
              most direct ways the thesis can break.
            claimRefs:
