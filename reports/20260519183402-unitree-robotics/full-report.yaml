  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: legged robots, not all automation'
        blocks:
          - type: paragraph
            body: >-
              Unitree sits across two overlapping but still distinct markets: quadruped robots that already serve
              inspection, public-safety, developer, and research workflows; and humanoid robots that are commercializing
              through developers, performances, reception, and early industrial experimentation. The company also sells
              arms and sensors, but those products are commercially relevant mainly because they widen the
              embodied-robot stack rather than because they create an independent software market today. A useful market
              boundary therefore includes spend on robot hardware, onboard compute, perception packages, integration,
              maintenance, and developer tooling for legged systems; it excludes fixed industrial arms, conveyor
              automation, software-only AI, and drones unless a buyer is explicitly substituting into the same workflow.


              That boundary matters because Unitree is not attacking the most mature automation budgets first. Its
              direct-sale storefront, GitHub repositories, and affordable G1 entry point show strong traction in
              developers, educators, and experimenters, while the B2 inspection quadruped addresses more structured
              industrial jobs like inspection and emergency response. Public evidence does not yet support treating the
              entire manufacturing automation market as Unitree’s SAM. Human labor, AMRs, cobots, and fixed industrial
              robots remain strong substitutes in many workflows, and IFR is explicit that humanoids will not become
              universal helpers in the near to medium term. The right framing is a layered market: quadruped workflows
              are commercially live today; humanoid workflows are commercially real but still concentrated in low-risk,
              lower-accountability segments.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
