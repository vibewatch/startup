  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segment map and procurement routes
        blocks:
          - type: paragraph
            body: >
              Unitree's customer universe is easier to understand as a set of public evidence clusters than as a neatly
              disclosed revenue segmentation. The strongest clusters are research and developer users,
              education-adjacent buyers, industrial inspection prospects, public-event or media organizers, and western
              distributors or integrators serving universities, public safety, and enterprise experimentation. Research
              and education stand out because they are repeatedly named by both labs and channel partners, and because
              Unitree's low public pricing materially lowers the threshold for lab acquisition relative to Western
              alternatives. Industrial inspection appears often in company and distributor marketing, especially around
              power inspection and all-terrain mobility, but independent named operators are scarce. Public-event proof
              is abundant — Spring Festival Gala, Winter Games, Super Bowl, Asian Games, CES — yet that evidence shows
              awareness and technical showmanship more than recurring customer economics. Procurement routes also split
              by buyer sophistication: Go2 and some G1 configurations can be purchased or at least priced directly
              online, while heavier-duty or more complex deployments lean on authorized distributors, training,
              warranty, and integration support. That split shapes nearly every western proof point.
