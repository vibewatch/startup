      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Track the company; do not underwrite Figure-style upside into today’s price
            body: >-
              Unitree has more real commercialization proof than many peers, but the current mark still gets ahead of
              the public evidence on margins and mix. That makes the stock-picking edge price discipline, not sector
              enthusiasm.
            calloutType: recommendation
            claimRefs:
              - CV019
              - CV020
              - CV027
              - CV042
          - type: callout
            title: The core downside is economics opacity, not lack of product reality
            body: >-
              Investors can see products, prices, and even a revenue floor. What they cannot yet see is whether those
              products carry attractive margins or repeatable industrial economics. That is why this remains a
              diligence-led story.
            calloutType: risk
            claimRefs:
              - CV017
              - CV020
              - CV036
              - CV037
          - type: callout
            title: Figure is a useful outlier, not the correct base multiple
            body: >-
              The fact that Figure cleared a US$39B mark proves investor appetite for humanoid optionality; it does not
              prove that every shipping humanoid company should be valued anywhere close to that level.
            calloutType: assumption
            claimRefs:
