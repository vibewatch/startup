  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Geopolitical, Procurement-Ban, and Regulatory Risk
        blocks:
          - type: paragraph
            body: >-
              The risk stack starts with Unitree's origin. U.S. lawmakers are no longer talking only about drones and
              telecom gear; the American Security Robotics Act explicitly targets ground robots from foreign entities of
              concern, and IEEE frames that proposal as part of a bipartisan decoupling agenda. Even if the bill never
              becomes law, its rhetoric matters because it gives regulated and government-adjacent buyers a defensible
              reason to avoid Chinese robots preemptively. Export-control risk compounds the problem. U.S. government
              sources show that semiconductor restrictions on China are already broad, expanding, and administratively
              messy. Unitree is not publicly disclosed as a sanctions target, but it still depends on a hardware
              ecosystem living inside that policy blast radius. Domestic Chinese standards and Hangzhou policy support
              do help near-term scale and safety governance, yet they do not solve the foreign-policy objection that
              Chinese origin itself creates for western buyers.
            claimRefs:
