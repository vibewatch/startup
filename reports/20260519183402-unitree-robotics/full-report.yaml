      - number: '7.5'
        title: Mitigations, Residual Exposure, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              The mitigation case for Unitree is straightforward: China is actively supporting humanoid standardization
              and robotics clusters, Unitree has real volume and low pricing, the company iterates fast, and its
              developer openness gives it broad experimentation reach. Those are meaningful cushions. But the residual
              exposure after mitigation remains high in four places. First, policy: Chinese origin is the unfixable root
              cause of procurement-ban rhetoric in the U.S. Second, cyber/privacy: one credible exploit or data-flow
              finding could trigger immediate buyer hesitation. Third, customer proof: until Unitree shows named
              recurring industrial users, western buyers can still dismiss the platform as a powerful research tool
              rather than a scaled enterprise system. Fourth, valuation timing: IPO repricing or delay would instantly
              reveal whether scale claims are translating into durable economics. Those are the monitoring points that
              matter most. An investor can live with hardware risk; it is much harder to live with policy closure,
              security shock, or absent commercial validation at the same time.
            claimRefs:
