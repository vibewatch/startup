      - number: '3.3'
        title: Distribution, Manufacturing Scale, and Developer Access
        blocks:
          - type: paragraph
            body: >-
              Unitree's go-to-market is unusually open for a humanoid vendor. It sells directly online, publishes
              developer tooling in public repos, and third-party reporting says its humanoids are aimed at developers
              who customize motion and perception rather than buying a closed black box. That openness lowers entry
              barriers and helps explain why Unitree has traction in research, universities, public safety pilots, and
              distributor-led overseas sales. It also likely supports the reported 5,500+ units shipped in 2025 and the
              company's 1,000+ employee scale. The trade-off is that open access is not the same as enterprise lock-in.
              Agility wraps Digit inside Arc plus service/support, Boston emphasizes Orbit integrations and industrial
              rollout discipline, and Figure/1X try to own a closed AI or home-user experience. Public channel breadth
              therefore looks like a strength, but it may also be masking how much high-touch deployment and post-sale
              support work still falls back on customers and distributors. Unitree can widen the top of funnel faster
              than peers, but its distribution model today appears better suited to developer adoption and channel
              breadth than to high-touch enterprise deployment support.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP015
              - CP016
              - CP026
