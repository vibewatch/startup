        title: Leadership Concentration and Developer Surface
        blocks:
          - type: paragraph
            body: >-
              Leadership evidence is simultaneously strong and thin. It is strong on Wang Xingxing: reviewed sources
              consistently show him as founder-CEO, and Forbes additionally labels him CTO, which matches the
              technical-first profile visible in interviews and the company's public engineering footprint. It is thin
              on the rest of the bench. Reviewed materials do not disclose a board roster, independent directors, or a
              separately named CFO/COO layer, leaving a real key-person dependency around Wang. What partially offsets
              that opacity is Unitree's unusually public developer surface for a hardware company. Its GitHub
              organization exposes SDKs, ROS2 packages, reinforcement-learning repositories, and app templates across
              G1, H1, Go2, B2, H2, and other robot families. That open-source posture supports the claim that Unitree is
              not just selling finished robots; it is trying to seed a developer ecosystem that widens adoption and
              reinforces its brand among researchers and builders.
