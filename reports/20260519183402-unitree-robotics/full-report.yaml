      - number: '1.3'
        title: Funding, Valuation, and IPO Preparation
        blocks:
          - type: paragraph
            body: >-
              The most reliable current capital anchor is not a speculative IPO headline but the June 2025 Series C.
              TechNode reports Unitree at more than RMB 12 billion post-money (about US$1.64 billion), Forbes
              independently reports RMB 12 billion (about US$1.7 billion), and The Robot Report lands in the same
              neighborhood. The critical caveat is that the exact amount raised and even the full investor roster are
              not fully confirmed. TechNode names China Mobile, Tencent, JinQiu Capital, Alibaba, Ant Group, and Geely;
              Forbes verifies Geely, Ant Group, and HongShan; Humanoid Index compiles the round at roughly US$96
              million; and The Robot Report notes third-party estimates near US$97.6 million. These are directionally
              consistent around unicorn-plus valuation, but not precise enough to treat as a settled cap-table fact.
              What is settled is IPO preparation: TechNode says CITIC Securities is the advisor, and later coverage says
              filing preparation was active, making Unitree a private company moving toward more formal disclosure.
