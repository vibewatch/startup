  evidenceGaps:
  - type: missing-source
    severity: material
    topic: quadruped-market-size
    missingEvidence: A public global quadruped revenue figure or unit-forecast series comparable to IDC’s
      humanoid data is missing from the fetched set.
    whyItMatters: Without a clean public quadruped market total, any combined legged-robot TAM for Unitree
      remains partially inferred rather than source-native.
    diligencePath: Pull a paid analyst quadruped market summary or ask management for internal market-share
      assumptions used in investor materials.
    relatedQuestionRefs:
    - QM025
  - type: private-evidence-only
    severity: material
    topic: segment-revenue-split
    missingEvidence: Unitree does not publicly break out revenue across quadrupeds, humanoids, components,
      software, or services.
    whyItMatters: The absence of segment mix prevents precise SAM/SOM sizing and makes it hard to assess
      whether current revenue quality is improving or simply volume-driven.
    diligencePath: Request revenue and gross-margin split by product family in diligence or IPO-prep materials.
    relatedQuestionRefs:
    - QM026
    - QM027
  - type: conflicting-data
    severity: minor
    topic: market-sizing
    missingEvidence: Long-range market estimates conflict because sources use different scopes, geographies,
      and time horizons.
    whyItMatters: Investors could anchor on the wrong TAM if these differences are not kept explicit.
    diligencePath: Normalize future work by separating hardware revenue, services revenue, and labor-value
      scenarios into different charts.
