  title: China tailwinds are operational, not just rhetorical
  body: Standards, test infrastructure, and supplier density shorten the loop from prototype to field
    deployment. For Unitree, China’s policy posture is valuable because it reduces commercialization friction,
    not because it proves end-market demand by itself.
  claimRefs:
