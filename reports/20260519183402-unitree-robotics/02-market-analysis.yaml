- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Factor
  - Direction
  - Timing
  - Implication for Unitree
  - Evidence-backed interpretation
  - Diligence ask
  rows:
  - - Dense China component ecosystem
    - Driver
    - Now
    - Supports lower ASPs and faster iteration
    - Supplier competition and clustering favor Unitree on cost and speed
    - Request COGS trend and supplier concentration disclosures
  - - 2026 humanoid standards and embodied-AI policy support
    - Driver
    - Now to 2030
    - Improves domestic testing, compliance, and procurement pathways
    - China has moved from generic encouragement to specific standards
    - Map which standards Unitree already meets
  - - Hangzhou robotics cluster
    - Driver
    - Now to 2027
    - Improves local testing and industrialization capacity
    - Cluster infrastructure can shorten commercialization loops
    - Track whether Unitree uses the new test and evaluation infrastructure
  - - Low entry pricing and direct sales
    - Driver
    - Now
    - Expands developer, academic, and prosumer funnel
    - Price is a direct reason customers choose Unitree over Western alternatives
    - Assess whether low prices are margin accretive or margin dilutive
  - - Labor shortage and human-centric environment fit
    - Driver
    - Medium term
    - Keeps humanoid thesis strategically relevant
    - IFR sees real demand logic but not near-term ubiquity
    - Tie Unitree pilots to quantified labor substitution
  - - Current demand concentrated in performances, research, and data collection
    - Constraint
    - Now
    - Revenue quality may lag narrative quality
    - Measured use-case mix is earlier-stage than household or factory hype
    - Request shipment mix by end market
  - - Traditional robots remain strong substitutes
    - Constraint
    - Now
    - Limits SAM in high-throughput structured workflows
    - Form-factor advantage is real only in selected human-centric tasks
    - Benchmark Unitree against cobots, AMRs, and drones by workflow
  - - Cybersecurity and liability concerns
    - Constraint
    - Now
    - Slows adoption in sensitive environments
    - Humanoids widen attack surfaces and safety accountability questions
    - Request third-party security audits and incident history
  - - U.S. and allied security scrutiny
    - Constraint
    - Now to medium term
    - Caps overseas public-sector TAM and could spill into enterprise procurement
    - Political framing around Chinese robots is already active
    - Track procurement restrictions and export-control actions
  - - Ecosystem and service shift
    - Constraint if missed / driver if met
    - 2026 onward
    - Unitree must move beyond cheap hardware alone
    - IDC expects competition to shift toward services and ecosystems
    - Ask for software attach, service revenue, and developer retention metrics
  notes: 'This table distinguishes evidence-backed drivers from evidence-backed constraints. Several rows
    are double-edged: low pricing is a demand driver but may also pressure margin; policy support helps
    domestically but does not neutralize foreign scrutiny.'
