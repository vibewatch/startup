  title: Foreign procurement scrutiny can cap an otherwise large overseas opportunity
  body: 'The Wire China evidence matters because it shows both sides of Unitree’s overseas story at once:
    real U.S. demand exists today, but it exists inside an increasingly security-sensitive procurement
    environment. That makes overseas TAM real but politically fragile.'
  claimRefs:
