chapter:
  number: 2
  title: Market Analysis
  summary: 'Unitree participates in two related but not identical markets: commercially live quadruped
    workflows and earlier-stage humanoid workflows. Public evidence supports a real but still uneven market,
    with IDC measuring only about US$440M of 2025 humanoid revenue while Goldman and Morgan Stanley frame
    much larger long-run possibilities; China’s supply chain and policy support accelerate Unitree’s timing,
    but substitutes, security scrutiny, and immature demand mix still constrain adoption.'
sections:
- id: market-boundary
  title: 'Market boundary: legged robots, not all automation'
  body: 'Unitree sits across two overlapping but still distinct markets: quadruped robots that already
    serve inspection, public-safety, developer, and research workflows; and humanoid robots that are commercializing
    through developers, performances, reception, and early industrial experimentation. The company also
    sells arms and sensors, but those products are commercially relevant mainly because they widen the
    embodied-robot stack rather than because they create an independent software market today. A useful
    market boundary therefore includes spend on robot hardware, onboard compute, perception packages,
    integration, maintenance, and developer tooling for legged systems; it excludes fixed industrial arms,
    conveyor automation, software-only AI, and drones unless a buyer is explicitly substituting into the
    same workflow.


    That boundary matters because Unitree is not attacking the most mature automation budgets first. Its
    direct-sale storefront, GitHub repositories, and affordable G1 entry point show strong traction in
    developers, educators, and experimenters, while the B2 inspection quadruped addresses more structured
    industrial jobs like inspection and emergency response. Public evidence does not yet support treating
    the entire manufacturing automation market as Unitree’s SAM. Human labor, AMRs, cobots, and fixed
    industrial robots remain strong substitutes in many workflows, and IFR is explicit that humanoids
    will not become universal helpers in the near to medium term. The right framing is a layered market:
    quadruped workflows are commercially live today; humanoid workflows are commercially real but still
    concentrated in low-risk, lower-accountability segments.'
