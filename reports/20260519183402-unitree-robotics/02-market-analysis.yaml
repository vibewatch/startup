  title: Contradictory TAM numbers should be treated as bounds, not reconciled precision
  body: 'Goldman, IDC, Morgan Stanley, and ARK are measuring different layers of the opportunity. Investors
    should preserve the contradiction: a small measured 2025 market can coexist with a very large long-run
    scenario without either number being “wrong.”'
