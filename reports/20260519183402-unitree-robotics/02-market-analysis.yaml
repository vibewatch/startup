  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Primary buyer / payer
  - Why it matters for Unitree
  rows:
  - - Quadruped industrial inspection and emergency response
    - Robot hardware, perception stack, batteries, maintenance, integration, remote operations
    - Fixed CCTV only, manned patrol labor, facility redesign
    - Utility operators, industrial safety teams, public-safety agencies
    - B2 is already specified around terrain, endurance, and payload for this segment
  - - Quadruped research and developer market
    - Robot purchase, SDK access, accessories, lab integration, experimental payloads
    - Pure simulation software and non-legged research platforms
    - Universities, labs, robotics startups, grant-funded programs
    - GitHub activity plus Go1 academic studies show this is a real current budget line
  - - Humanoid developer kits and embodied-AI experimentation
    - Robot hardware, dev tooling, compute modules, data collection, operator training
    - General-purpose labor replacement claims not tied to current capability
    - Developers, AI labs, universities, startup prototypers
    - G1 price and secondary-development posture make this a tangible current entry market
  - - Humanoid performances, reception, and branded experiences
    - Robot rental or purchase, choreography/integration, event support, content management
    - Broad enterprise-automation programs
    - Event operators, brands, venues, public showcases
    - IDC says performances and reception remain among the largest actual demand buckets in 2025
  - - Humanoid industrial pilots
    - Robot hardware, factory integration, supervised deployment, safety setup, maintenance
    - Large-scale labor replacement assumptions without contract proof
    - Manufacturers, warehouses, integrators
    - Strategically important long term, but still earlier than promotional or developer demand today
