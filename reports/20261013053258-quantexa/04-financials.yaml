callouts:
  - calloutType: risk
    title: Implementation Complexity and Margin Drag
    body: >-
      While Quantexa commands strong platform pricing power across Tier-1 institutions, third-party buyer reviews and
      composite economic analyses demonstrate that implementation and data preparation overheads remain high. The heavy
      services requirement risks depressing effective software gross margins during the early years of customer
      deployments.
    claimRefs:
      - CI005
      - CI012
  - calloutType: insight
    title: Expansion Leverage via Reusable Entity Foundation
    body: >-
      Quantexa's core architectural advantage lies in its single data context layer: once entity resolution and
      knowledge graphs are established for AML, additional use cases in fraud, credit risk, and customer intelligence
      can be deployed with minimal incremental data ingestion overhead, driving substantial net retention expansion.
    claimRefs:
      - CI001
      - CI013
