        - - Transparency Check (Missing GAAP margin, burn, preference stack)
          - Risk Assessment (Down-round & multiple compression exposure)
        - - Risk Assessment (Down-round & multiple compression exposure)
          - Stance Output (TRACK recommendation, Stretched valuation)
