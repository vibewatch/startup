        - Centaur 级 ARR 规模（$100M+）被未经验证的毛利率、烧钱速度和清算优先权结构抵消
        - 在完成私有财务和股权结构表审计前，暂缓后期资本投入
      - - 信心
        - 中
        - 高可信客户与融资证据，部分被缺少经审计 GAAP 披露所抵消
        - 验证管理层关于 ARR、服务收入组合和客户留存的桥接说明
      - - 风险评级
        - 高
        - 在宏观 IPO 市场不确定的情况下，私营软件倍数超过历史 ARR 的 20 倍
        - 要求新资本获得下行估值保护和高级清算权平等地位
      - - 估值立场
        - 偏高
        - $2.6B Series F 定价和传闻中的 $3B+ IPO 目标，对可比公司没有安全边际
        - 入口价格低于经验证 ARR 的 12 倍，或等待公开 IPO 价格发现
    notes: 建议和风险评级综合公开融资定价、市场倍数及披露缺口，截至 2026 年 10 月。
    claimRefs:
      - CV001
      - CV003
      - CV009
      - CV013
      - CV014
  - id: TV002
    title: 投资论点与反论点驱动因素
    columns:
      - 视角
      - 核心论点
      - 证据锚点
      - 改变观点的催化剂
    rows:
      - - 论点：品类主导
        - 在全球金融机构动态实体解析和图谱上下文中的可防御护城河
        - 已部署于全球前 10 大银行中的 7 家；获 IDC MarketScape 评为决策智能领导者
        - 一级银行采用速度放缓，或关键账户转向 Palantir 或超大规模云厂商
      - - 论点：商业扩张
        - 企业 ROI 已得到验证，并跨政府、电信和医疗行业实现多元化
        - Forrester TEI 显示 ROI 为 228%；参考客户包括 UK Cabinet Office、HMRC 和 NHS
        - 未能把 AI 平台创新转化为非银行软件扩张
      - - 反论点：倍数脆弱性
        - 隐含估值倍数超过 ARR 的 20 倍，股权容易遭遇剧烈压缩
        - $2.6B Series F 估值对应 $100M 历史 ARR 基准；市场对二级定价存在猜测
        - 经验证披露显示 ARR 增长加速至 45% 以上，软件毛利率超过 80%
      - - 反论点：基本面不透明
        - 未公开披露服务收入拖累、现金消耗和优先股堆叠
        - 公开渠道没有经验证的损益表或资产负债表披露
        - 获得经审计财务报表，显示自由现金流为正且为清晰的 1 倍非参与型优先权
    notes: 分析将已验证的企业护城河与私有估值压力和披露缺口进行对照。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV007
      - CV008
      - CV013
  - id: TV003
    title: 牛市、基准与熊市情景预测
    columns:
      - 情景
      - 概率
      - 运营假设
      - 估值与倍数
      - 下行触发因素 / 催化剂
    rows:
      - - 乐观情景
        - 25%
        - ARR 增至 $220M+，同比增长 35%，软件毛利率超过 80%，代理式 AI 快速变现
        - 估值 $3.5B - $4.2B（ARR 的 16 倍 - 19 倍）；成功在纽约上市
        - 一级企业扩张加速，美国公共科技市场倍数强劲
      - - 基准情景
        - 50%
        - ARR 增至 $180M，同比增长 20%，专业服务占比 25%，现金消耗保持克制
        - 估值 $2.6B - $3.0B（ARR 的 14 倍 - 16 倍）；在英国或美国上市，定价与 Series F 持平
        - 政府 / 银行采购延迟；倍数正常化抵消稳定增长
      - - 悲观情景
        - 25%
        - ARR 增长放缓至低于 12%，客户集中度拖累，高烧钱迫使公司进行稀释性融资
        - 估值 $1.5B - $1.8B（ARR 的 8 倍 - 10 倍）；降价轮或推迟公开上市
        - 倍数向合规软件老牌公司收缩；全球银行削减预算
    notes: 情景分析纳入公开可比公司和私募基准的倍数敏感性。
    claimRefs:
      - CV001
      - CV003
      - CV008
      - CV010
      - CV011
      - CV012
      - CV014
