chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与平台基础
        blocks:
          - type: paragraph
            body: >-
              Quantexa 由 CEO Vishal Marria 与经验丰富的创始团队于 2016
              年在伦敦创立，已成为定义品类的决策智能软件供应商。它解决全球企业的一项根本运营故障：不同旧系统中的孤岛、重复和含混记录无法互联。Quantexa
              不要求客户冒险替换核心系统，而是用专有动态实体解析和知识图谱技术，把数十亿条内外部数据点拼成统一的上下文数据基础。该架构形成 Quantexa 所称的 Real-World
              Context，让一级商业银行、保险公司、电信运营商和政府执法机构自动化合规审查、识别复杂欺诈团伙，并提取跨企业客户智能。随着企业软件架构转向自主代理部署，Quantexa
              将平台定位为连接原始数据资产与大语言模型的关键上下文织物，让下游 AI 决策保持可解释、可审计，并扎根于可信的现实关系。
            claimRefs:
              - CO001
              - CO012
          - type: table
            tableRef: TO001
            claimRefs:
              - CO004
              - CO006
              - CO007
      - number: '1.2'
        title: 高管领导与组织治理
        blocks:
          - type: paragraph
            body: >-
              Quantexa 由创始人兼 CEO Vishal Marria 领导。Marria 曾是 Ernst & Young 最年轻的执行董事，并在 Detica、SAS
              和大型投资银行机构担任高级技术人员，这些经历直接塑造了公司的金融犯罪与分析重点。联合创始人、首席技术官 Jamie Hutton 是动态实体解析算法的主要架构师；Richard Seewald、Imam
              Hoque、Felix Hoddinott、Alexon Bell 和 Laura Hutton 也参与领导。近几个运营周期，公司引入首席产品官 Dan Higgins 等资深软件管理者，负责 Q Assist
              和代理式 Agent Gateway 等平台演进。创始核心仍对产品方向拥有显著运营和技术影响力，但公司已通过 EMEA、北美和 APAC 的区域管理董事分散职能治理。鉴于 Marria
              是公开商业代表、Hutton 是专有系统架构师，关键人物依赖仍集中于两人；不过高管扩张已在合规、产品开发和全球渠道联盟之间建立分工明确的部门领导。
            claimRefs:
              - CO002
              - CO003
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
      - number: '1.3'
        title: 资本化历程与投资人联合体
        blocks:
          - type: paragraph
            body: >-
              Quantexa 的融资历程显示出持续的机构支持：六轮私募风投和成长股权融资合计约 $545M 至 $546M 股权资本。公司于 2017 年 3 月完成由 Albion Ventures 领投的 $3.3M A
              轮，HSBC 早期参与，并成为其核心企业设计客户。随后 Warburg Pincus 于 2021 年 7 月领投 $153M 至 $157M 的 D 轮，夯实其全球扩张的资产负债表。2023 年 4
              月，公司完成 $129M E 轮后成为独角兽；最近于 2025 年 3 月完成 $175M F 轮，投后估值 $2.6B，由 Ontario Teachers' Pension Plan 的创投部门
              Teachers' Venture Growth 领投。Warburg Pincus、Evolution Equity Partners、BNY Mellon、ABN AMRO 和 British Patient
              Capital 继续支持该轮融资。尽管投资人阵容强大，详细股权结构表仍被严格保密：确切的股份类别拆分、清算优先权倍数和二级交易价格均未披露，潜在少数股东因此面临明显的治理与优先权结构信息不对称。
            claimRefs:
              - CO004
              - CO005
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO005
      - number: '1.4'
        title: 运营规模与商业 traction
        blocks:
          - type: paragraph
            body: >-
              Quantexa 从伦敦总部扩展为全球软件企业，在纽约、波士顿、新加坡、墨尔本、布鲁塞尔和多伦多等金融中心拥有超过 900 名员工。FY2022 后商业 traction 明显加速：公司净留存率为
              144%，Committed ARR 增长超过 70%，北美贡献 30% 收入、APAC 贡献 20%。到 2024 年，Quantexa 年 ARR 超过 $100M，成为 Centaur，预计年度增速约
              40%。客户包括全球十大商业银行中的七家，以及 UK Cabinet Office 和 Govia Thameslink Railway 等政府和交通机构。Microsoft 联合开发的 Azure
              Managed Application 上架，以及与 Deloitte、Accenture 和 KPMG 的系统集成商联盟进一步增强了企业分销。但交易经济性仍偏向高接触式企业软件销售，年合同额为 $0.5M 至
              $15M，专业服务通常使首年部署成本增加 20% 至 40%。
            claimRefs:
              - CO006
              - CO007
              - CO010
              - CO011
              - CO013
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO008
              - CO009
      - number: '1.5'
        title: 战略里程碑与关键风险分析
        blocks:
          - type: paragraph
            body: >-
              从融资到产品交付，再到独立分析师认可，Quantexa 一路保持稳定执行。关键里程碑包括 2021 年末部署 Quantexa 2、2023 年成为独角兽、2025 年 $2.6B 的 F 轮估值，以及在
              2026 年 Gartner 决策智能平台魔力象限和 IDC MarketScape 中均获评 Leader。2025 年末，公司推出带 MCP 兼容 Agent Gateway 的 Quantexa
              AI，将图基础设施用于代理式 AI 工作流，并获得 Morgan Stanley 的 2026 Innovation
              Award。尽管如此，尽调仍发现明显运营和财务风险。独立经济研究显示，复杂企业实施需要大量变更管理和集成投入：综合企业模型吸收超过 $8.2M 的专业服务及实施拖累，另有 $2.1M
              持续维护成本。Quantexa 还要面对 NICE Actimize 等成熟金融犯罪套件、Ripjar 等灵活的细分专家，以及 Palantir Foundry
              等通用企业数据平台。在缺少当前软件与服务收入占比、毛利率和净现金消耗 GAAP 披露的情况下，其后期溢价倍数需要严格核验。
            claimRefs:
              - CO008
              - CO009
              - CO015
      - number: '1.6'
        title: 展示
        blocks:
          - type: callout
            title: 动态实体解析与上下文图谱构筑的战略护城河
            body: >-
              Quantexa 的核心技术差异化在于：它能在数十亿条记录中动态解析不同实体，而不是先强行统一模式再分析。平台把上下文评分嵌入调查和 AI 管道，为一级银行带来可验证的误报下降，同时把自己定位为企业代理式 AI
              工作流可信赖的上下文数据织物。
            calloutType: insight
            claimRefs:
              - CO001
              - CO012
          - type: callout
            title: 实施拖累高、股权结构表信息不对称
            body: >-
              Quantexa 虽拥有较高净留存率和知名客户，但 $0.5M 至 $15M 的年度企业合同需要大量专业服务，首年实施成本可增加 20% 至
              40%。叠加不透明的私有资本结构和未经核实的现金消耗，尽调必须在评估后期估值前，仔细核查部署摩擦和清算优先权层级。
            calloutType: risk
            claimRefs:
              - CO010
              - CO011
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Quantexa 处于新兴的决策智能软件品类，Gartner 和 IDC 将其定义为：连接碎片化数据、把上下文 AI
              落地，用于建模、执行和增强复杂商业决策的技术。它不把自己定位为通用商业智能报表或集中式数据仓库，而是围绕动态实体解析、现实世界知识图谱和调查决策工作流划定市场边界。在企业部署中，主要切入口是监管合规与金融犯罪，具体包括反洗钱（AML）、了解你的客户（KYC）和交易欺诈监测。传统替代方案包括旧式关系型主数据管理（MDM）平台、数据库规则引擎和
              NICE Actimize 等点解决方案。这些旧系统难以处理含混匹配，导致误报警报积压，消耗大量合规分析师工时。Quantexa
              通过建立不依赖模式的上下文织物，在数十亿条内外部数据点中动态解析实体，让一级机构连接原始数据与可信运营行动，无需整体替换旧核心系统。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM006
              - CM012
      - number: '2.2'
        title: 可服务市场规模、增长驱动因素与测算口径
        blocks:
          - type: paragraph
            body: >-
              测算决策智能的可服务市场，需要把宽泛的行业共识拆成受软件约束的现实需求层。宏观分析师预计，到 2030 年全球决策智能软件大盘为 $15B 至 $25B，复合年增长率超过 22%。但这一总额包含许多不属于
              Quantexa 核心图匹配能力的横向企业分析、自动仪表盘和机器人流程自动化。若限定为具备上下文数据基础的专用决策智能平台，并采用 2026 IDC MarketScape 供应商评估口径，近期全球软件 TAM
              估计为 $16.8B。再缩小到全球金融机构的金融犯罪合规、欺诈检测和监管风险分析，可服务软件市场约 $8.5B。在这一受监管市场中，Quantexa 的现实 SAM 约为 $3.2B，对应约 500
              家最大的全球商业银行、一级保险公司、电信运营商和政府收入机构；这些客户能够承担数百万美元订阅合同和数月集成部署。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM007
              - CM009
              - CM011
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM005
              - CM007
              - CM009
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM007
              - CM009
              - CM011
              - CM013
              - CM014
      - number: '2.3'
        title: 买方细分、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              Quantexa
              的企业采购具有高平均合同额和明显的双预算购买路径。在核心金融服务垂直领域，主要商业买方是首席合规官或金融犯罪负责人，他们控制由监管同意令和不断上涨的合规人力成本推动的监管整改预算。对这些买方而言，Quantexa
              是任务关键型风险缓释资产，可将 AML 误报最多降低
              90%，并加快复杂金融犯罪调查。与此同时，首席数据官（CDO）和首席信息官（CIO）也开始寻求现代化客户智能与主数据基础设施，形成第二条企业购买路径。Morgan Stanley 在 Tech Week 2026
              获认可的全公司部署展示了这一定位：Quantexa 作为企业上下文层，统一不同业务线的碎片化客户数据，为下一代客户智能和可信 AI 应用提供动力。企业软件年合同额为 $0.5M 至
              $15M，专业服务通常再增加首年合同价值的 20% 至 40%，用于复杂数据连接器工程。
            claimRefs:
              - CM005
              - CM007
              - CM008
              - CM010
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM010
              - CM011
              - CM013
      - number: '2.4'
        title: 采用瓶颈、市场约束与尽调考量
        blocks:
          - type: paragraph
            body: >-
              尽管 Quantexa
              已在一级银行展现品类领导力，其进一步扩张仍受结构性约束。第一，商业模式和沉重的架构足迹，使其主要适合数据丰富、监管压力高的企业。实体记录不足数百万或合规压力有限的组织，通常没有足够数据规模或资金证明每年
              $0.5M 至 $15M 承诺的合理性。第二，企业采购和集成周期很长，往往要与 Deloitte 或 Accenture 等系统集成伙伴共同投入 6 至 12 个月工程时间；企业 IT
              冻结时，这会造成显著切换摩擦和销售周期风险。第三，Quantexa 虽在 Vodafone 电信业务和 UK Cabinet Office
              公共部门取得重要客户成功，但收入仍高度集中于全球银行。尽调必须严格评估：离开金融犯罪场景后，决策智能能否维持高净留存率，并承受 Databricks 等数据云平台和企业应用巨头的激烈竞争。
            claimRefs:
              - CM004
              - CM007
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 监管合规是可防守的品类切入口
            body: >-
              Quantexa 的市场成功表明，高 ACV 企业决策智能在锚定非自由裁量的监管风险时采用最快。CFO 往往把通用数据统一视为可选 IT 优化，但解决 AML
              误报和监管整改能提供紧迫、足以获批预算的商业论证，从而打开全球顶级银行账户。
            calloutType: insight
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM011
          - type: callout
            title: 中端市场摩擦与总拥有成本高
            body: >-
              企业订阅每年 $0.5M 至 $15M，加上初始合同价值 20% 至 40% 的实施服务开支，限制了 Quantexa 的可服务客户数量。没有 PB
              级图复杂度的中型机构将面临高得难以承受的总拥有成本，因此自助式或更轻量的市场部署仍是未经证明的扩张方向。
            calloutType: risk
            claimRefs:
              - CM007
              - CM011
              - CM012
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与替代品类
        blocks:
          - type: paragraph
            body: >-
              Quantexa 面对多线竞争，包括专门金融犯罪的成熟厂商、广泛的企业分析平台、细分调查供应商和旧式关系系统。与纯粹聚焦反洗钱（AML）检测的点解决方案不同，Quantexa
              将可服务领域定义为上下文决策智能。NICE Actimize 等成熟厂商凭借规则引擎和预打包监管库主导一级银行合规，但难以在含混数据集中动态匹配实体。更广的平台如 Palantir Foundry
              提供广泛本体集成和定制工作流，但需要大量前置部署工程团队与定制建模。Ripjar 等细分厂商提供灵活的观察名单筛查和 AML 分析，却缺少 Quantexa
              在客户智能和欺诈领域的多域规模。企业买方也常在云数据仓库上的内部开发与供应商方案间权衡，内部工程团队会尝试手写图生成和实体解析管道。
            claimRefs:
              - CP001
              - CP002
              - CP010
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP010
              - CP011
              - CP012
      - number: '3.2'
        title: 架构差异化与技术护城河
        blocks:
          - type: paragraph
            body: >-
