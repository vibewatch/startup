  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 展示企业决策智能从最初合规试点，到扩展为多工作负载企业数据底座的客户采用生命周期。
    data:
      items:
        - label: 初步评估
          buyer: Chief Compliance Officer & Head of Financial Crime
          focus: AML & KYC false-positive reduction evaluation
          touchpoints:
            - 高管简报和合规痛点审计
            - 基于历史交易批数据的概念验证
            - 与传统规则型检测引擎进行基准比较
          friction: High data privacy security reviews and schema compatibility checks
        - label: 定向生产试点
          buyer: Financial Crime Operations & Data Architecture Lead
          focus: Single-line deployment (e.g., AML investigation acceleration)
          touchpoints:
            - 在云端或本地部署核心实体解析引擎
            - 与四大系统集成商搭建数据摄取流水线
            - 与调查员桌面工作流集成
          friction: Heavy initial professional services setup requiring 20% to 40% contract value
        - label: 单部门落地
          buyer: CIO & Head of Operational Risk
          focus: Operationalization across departmental investigator teams
          touchpoints:
            - 切入生产环境，误报率最高降低 90%
            - 停用传统点式监控数据库
            - 初始年度软件订阅承诺（$0.5M-$1.5M ARR）
          friction: Ongoing investigator retraining and organizational change management
        - label: 跨垂直行业扩张
          buyer: Chief Risk Officer & Head of Fraud
          focus: Expansion to internal fraud, credit risk, and customer intelligence
          touchpoints:
            - 扩展知识图谱，连接外部企业登记库
            - 将上下文评分模型部署到新业务线
            - 扩大订阅规模，合同价值向 $3.0M+ ARR 提升
          friction: Cross-departmental data governance negotiations and budget alignment
        - label: 企业决策数据底座
          buyer: Enterprise CDO, CIO & Business Unit Leaders
          focus: Institution-wide Real-World Context foundation for trusted AI and agentic workflows
          touchpoints:
            - 在数千名运营用户之间整合多种工作负载
            - 使用统一上下文层集成代理式 AI
            - 多年期经常性软件续约，转换壁垒高
          friction: Long-term vendor dependency and contract renegotiation friction
        - label: 生态系统成熟
          buyer: Global CIO & External Business Network Partners
          focus: Consortium data sharing and industry-wide financial crime intelligence
          touchpoints:
            - 跨组织共享欺诈情报
            - 共同创新生成式和预测式 AI 代理工作流
            - 高管支持与全企业平台续约
          friction: Evolving cross-border data residency and AI governance regulations
    approximationNotes: 采用阶段和采购动态综合 Forrester Total Economic Impact 建模及企业部署案例研究。
