    summary: 以可视化决策流程追踪规模和技术护城河如何受到估值倍数与披露缺口的约束，最终得出“TRACK”立场。
    data:
      nodes:
        - label: 商业规模（$100M+ ARR，前十大银行中有 7 家）
        - label: 技术护城河（IDC MarketScape 领导者，实体解析）
