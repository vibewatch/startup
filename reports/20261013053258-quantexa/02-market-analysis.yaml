callouts:
  - calloutType: insight
    title: Regulatory Compliance as the Defensible Category Wedge
    body: Quantexa's market success demonstrates that high-ACV enterprise decision intelligence is adopted fastest when anchored to non-discretionary regulatory risk. While general data unification is often viewed by CFOs as an elective IT optimization, solving AML false positives and regulatory remediation provides an urgent, budget-clearing business case that unlocks top-tier global banking accounts.
    claimRefs:
      - CM001
      - CM005
      - CM006
      - CM011
  - calloutType: risk
    title: Mid-Market Friction and High Total Cost of Ownership
    body: Enterprise subscription pricing ranging from $0.5M to $15M annually, coupled with implementation service overhead of 20% to 40% of initial contract value, restricts Quantexa's addressable customer count. Mid-market institutions without petabyte-scale graph complexity face prohibitive total cost of ownership, making self-service or lighter-weight marketplace deployment an unproven expansion vector.
    claimRefs:
      - CM007
      - CM011
      - CM012
