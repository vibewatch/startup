company:
  name: Quantexa
chapter:
  number: 1
  title: Company Overview
  summary: Quantexa is a scaled London-based Decision Intelligence software pioneer founded in 2016, backed by $545M+ in capital
    at a $2.6B valuation, that unifies fragmented enterprise records using dynamic entity resolution and knowledge graphs
    across tier-one banks, insurers, and public agencies.
sections:
- id: corporate-identity-and-foundations
  title: Corporate Identity and Platform Foundations
  body: 'Founded in London in 2016 by CEO Vishal Marria and an experienced founding team, Quantexa has established itself
    as a category-defining Decision Intelligence software provider. The company addresses a fundamental operational failure
    across global enterprises: the inability to connect siloed, duplicate, and ambiguous data records across disparate legacy
    systems. Rather than requiring customers to undertake high-risk core replacements, Quantexa deploys proprietary dynamic
    entity resolution and knowledge graph technology to stitch together billions of internal and external data points into
    a unified, contextual data foundation. This architectural approach creates what Quantexa terms Real-World Context, allowing
    tier-one commercial banks, insurers, telecommunications operators, and government enforcement agencies to automate compliance
    reviews, identify complex fraud rings, and surface cross-enterprise client intelligence. As enterprise software architectures
    transition toward autonomous agentic deployments, Quantexa has positioned its platform as the essential contextual fabric
    bridging raw data assets with large language models, ensuring that downstream AI decisions remain explainable, auditable,
    and grounded in trusted real-world relationships.'
  claimRefs:
  - CO001
  - CO012
  tableRefs:
  - TO001
- id: executive-leadership-and-governance
  title: Executive Leadership and Organizational Governance
  body: Quantexa is led by Founder and Chief Executive Officer Vishal Marria, whose prior background as the youngest Executive
    Director at Ernst & Young and senior technologist at Detica, SAS, and major investment banking institutions directly informs
    the company's financial crime and analytics focus. Marria is supported by co-founders including Chief Technology Officer
    Jamie Hutton, who serves as the primary architect behind Quantexa's dynamic entity resolution algorithms, as well as Richard
    Seewald, Imam Hoque, Felix Hoddinott, Alexon Bell, and Laura Hutton. In recent operating cycles, the executive bench has
    expanded through the addition of senior software operators such as Chief Product Officer Dan Higgins, who oversees platform
    evolutions including Q Assist and the agentic Agent Gateway. While the founding core retains substantial operational and
    technical influence over product direction, the company has diversified functional governance across regional managing
    directors in EMEA, North America, and APAC. Key-person reliance remains concentrated in Marria and Hutton given their
    roles as the public commercial figurehead and proprietary systems architect, respectively; however, executive expansion
    has created structured departmental leadership across compliance, product development, and global channel alliances.
  claimRefs:
  - CO002
  - CO003
  tableRefs:
  - TO002
- id: capitalization-history-and-ownership
  title: Capitalization History and Investor Syndicate
  body: 'Quantexa''s financing history reflects sustained institutional backing spanning six private venture capital and growth
    equity rounds totaling approximately $545M to $546M in equity capital. The company raised an initial $3.3M Series A in
    March 2017 led by Albion Ventures with early participation from HSBC, which also served as a cornerstone enterprise design
    client. Following successive expansion financings, private equity sponsor Warburg Pincus led a $153M to $157M Series D
    round in July 2021, cementing Quantexa''s balance sheet for global expansion. In April 2023, Quantexa achieved unicorn
    status following a $129M Series E financing, and most recently in March 2025 closed a $175M Series F round at a post-money
    valuation of $2.6B led by Teachers'' Venture Growth, the venture investment arm of the Ontario Teachers'' Pension Plan.
    The round included continued support from Warburg Pincus, Evolution Equity Partners, BNY Mellon, ABN AMRO, and British
    Patient Capital. Despite this pedigree, detailed cap table economics remain tightly held: exact share class breakdowns,
    liquidation preference multiples, and secondary transaction pricing are undisclosed, leaving potential minority investors
    with notable governance and preference-stack information asymmetries.'
  claimRefs:
  - CO004
  - CO005
  - CO014
  tableRefs:
  - TO003
- id: operational-scale-and-commercial-traction
  title: Operational Scale and Commercial Traction
  body: From its London headquarters, Quantexa has expanded into a global software enterprise with more than 900 employees
    operating across key financial centers including New York, Boston, Singapore, Melbourne, Brussels, and Toronto. Commercial
    traction accelerated meaningfully following its FY2022 performance, where the company recorded a 144% Net Retention Rate
    and a greater than 70% expansion in Committed ARR, establishing North America as a 30% revenue contributor and APAC as
    a 20% contributor. By 2024, Quantexa achieved Centaur status by surpassing $100M in Annual Recurring Revenue while sustaining
    estimated annual growth near 40%. The company counts seven of the top ten global commercial banks among its customer base,
    alongside major government bodies such as the UK Cabinet Office and transport authorities such as Govia Thameslink Railway.
    Enterprise distribution is further bolstered through strategic cloud partnerships, including an Azure Managed Application
    listing co-developed with Microsoft, and systems integrator alliances with Deloitte, Accenture, and KPMG. However, deal
    economics remain weighted toward high-touch enterprise software sales, with annual contract values spanning $0.5M to $15M
    and professional services typically adding 20% to 40% in first-year deployment costs.
  claimRefs:
  - CO006
  - CO007
  - CO010
  - CO011
  - CO013
  figureRefs:
  - FO001
- id: risk-factors-and-strategic-milestones
  title: Strategic Milestones and Critical Risk Analysis
  body: Quantexa's operational progression demonstrates consistent execution across financing, product delivery, and independent
    analyst recognition. Key milestones include the deployment of Quantexa 2 in late 2021, unicorn status in 2023, the $2.6B
    Series F valuation in 2025, and recognition as a Leader in both the 2026 Gartner Magic Quadrant for Decision Intelligence
    Platforms and the IDC MarketScape. In late 2025, the company introduced Quantexa AI with an MCP-compliant Agent Gateway,
    positioning its graph foundation for agentic AI workflows and earning Morgan Stanley's 2026 Innovation Award. Nevertheless,
    diligence highlights meaningful operational and financial risks. Independent economic studies indicate that complex enterprise
    implementations incur heavy change management and integration overhead, with composite enterprise models absorbing over
    $8.2M in professional services and implementation drag alongside $2.1M in ongoing maintenance. Furthermore, Quantexa competes
    against entrenched incumbent financial crime suites such as NICE Actimize, agile niche specialists like Ripjar, and general-purpose
    enterprise data platforms like Palantir Foundry. Without verified GAAP disclosures regarding current software-versus-services
    revenue mix, gross margins, and net burn, Quantexa's late-stage premium multiple demands disciplined verification.
  claimRefs:
  - CO008
  - CO009
  - CO015
