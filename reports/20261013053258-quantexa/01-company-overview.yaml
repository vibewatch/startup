callouts:
- calloutType: insight
  title: Strategic Moat via Dynamic Entity Resolution and Contextual Graphs
  body: Quantexa's core technical differentiation lies in resolving disparate entities dynamically across billions of records
    rather than forcing schema unification before analysis. By embedding contextual scoring into investigations and AI pipelines,
    the platform delivers verifiable false-positive reductions for tier-one banks while positioning itself as the trusted
    contextual data fabric for enterprise agentic AI workflows.
  claimRefs:
  - CO001
  - CO012
- calloutType: risk
  title: High Implementation Drag and Cap Table Information Asymmetry
  body: While Quantexa commands high net retention and marquee logos, annual enterprise contract commitments ranging from
    $0.5M to $15M require extensive professional services that can add 20% to 40% in first-year implementation costs. Coupled
    with an opaque private capital structure and unverified cash burn, diligence must closely evaluate deployment friction
    and liquidation preference seniority before underwriting late-stage valuations.
  claimRefs:
  - CO010
  - CO011
