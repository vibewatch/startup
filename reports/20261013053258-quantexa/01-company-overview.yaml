  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosures-and-capital-structure
    missingEvidence: Audited GAAP income statements, exact software-versus-services gross margins, current cash burn rate,
      and late-stage liquidation preference seniority stack.
    whyItMatters: Without audited financial statements, true software gross margins cannot be separated from professional
      services drag, obscuring underlying cash flow economics.
    diligencePath: Request confidential disclosure of FY2024-FY2025 audited financial statements, board deck reporting ARR
      waterfall, and full capitalization table summary.
    relatedQuestionRefs:
    - QO009
  - type: missing-source
    severity: material
    topic: Stakeholder or investor map
    missingEvidence: Complete institutional ownership percentages, voting rights agreements, board observer seats, and secondary
      share transaction records across all funding rounds.
    whyItMatters: High ownership concentration among early venture and growth equity sponsors may restrict minority investor
      governance influence and create liquidation overhang.
    diligencePath: Review company Articles of Association, investor rights agreements, and voting covenants in private diligence
      data room.
    relatedQuestionRefs:
    - QO009
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: minor
    topic: customer-concentration-and-contract-sizes
    missingEvidence: Detailed logo count breakdown, top-10 customer revenue concentration percentages, and gross revenue retention
      (GRR) metrics across banking and public sector verticals.
    whyItMatters: High customer concentration among top global banking accounts could expose revenue stability to procurement
      policy changes or vendor consolidation.
    diligencePath: Review customer cohorts, net expansion by industry vertical, and account-level renewal history during management
      diligence sessions.
