          friction: "High data privacy security reviews and schema compatibility checks"
        - label: "Targeted Production Pilot"
          buyer: "Financial Crime Operations & Data Architecture Lead"
          focus: "Single-line deployment (e.g., AML investigation acceleration)"
          touchpoints:
            - "Deployment of core Entity Resolution engine on cloud or on-premise"
            - "Data ingestion pipeline setup with Big Four systems integrators"
            - "Integration with investigator desktop workflows"
          friction: "Heavy initial professional services setup requiring 20% to 40% contract value"
        - label: "Single-Department Land"
          buyer: "CIO & Head of Operational Risk"
          focus: "Operationalization across departmental investigator teams"
          touchpoints:
            - "Production cutover achieving up to 90% alert false-positive reduction"
            - "Decommissioning of legacy point monitoring databases"
            - "Initial annual software subscription commitment ($0.5M-$1.5M ARR)"
          friction: "Ongoing investigator retraining and organizational change management"
        - label: "Cross-Vertical Expansion"
          buyer: "Chief Risk Officer & Head of Fraud"
          focus: "Expansion to internal fraud, credit risk, and customer intelligence"
          touchpoints:
            - "Knowledge graph expansion connecting external corporate registries"
            - "Deployment of contextual scoring models across new business lines"
            - "Subscription expansion scaling contract value toward $3.0M+ ARR"
          friction: "Cross-departmental data governance negotiations and budget alignment"
        - label: "Enterprise Decision Fabric"
          buyer: "Enterprise CDO, CIO & Business Unit Leaders"
          focus: "Institution-wide Real-World Context foundation for trusted AI and agentic workflows"
          touchpoints:
            - "Multi-workload integration across thousands of operational users"
            - "Agentic AI integration using unified context layer"
            - "Multi-year recurring software renewal with high switching barriers"
          friction: "Long-term vendor dependency and contract renegotiation friction"
        - label: "Ecosystem Maturation"
          buyer: "Global CIO & External Business Network Partners"
          focus: "Consortium data sharing and industry-wide financial crime intelligence"
          touchpoints:
            - "Cross-organization fraud intelligence sharing"
            - "Co-innovation on generative and predictive AI agent workflows"
            - "Executive sponsorship and enterprise-wide platform renewal"
          friction: "Evolving cross-border data residency and AI governance regulations"
    approximationNotes: "Adoption phases and procurement dynamics synthesized from Forrester Total Economic Impact modeling and enterprise deployment case studies."
