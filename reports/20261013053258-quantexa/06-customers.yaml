    title: "Customer journey map"
    type: "journey-map"
    summary: "Enterprise decision intelligence customer adoption lifecycle from initial compliance pilot to multi-workload enterprise fabric expansion."
    data:
      items:
        - label: "Initial Evaluation"
          buyer: "Chief Compliance Officer & Head of Financial Crime"
          focus: "AML & KYC false-positive reduction evaluation"
          touchpoints:
            - "Executive briefing and compliance pain point audit"
            - "Proof-of-concept on historical transaction batch data"
