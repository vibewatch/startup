callouts:
  - calloutType: "strength"
    title: "Deep Tier-1 Account Expansion and High Replacement Barriers"
    body: "Quantexa has successfully embedded its entity resolution and knowledge graph platform into the core operating architecture of premier global financial institutions including HSBC, BNY Mellon, and Morgan Stanley. Once deployed across tens of billions of transactions and integrated with legacy banking mainframes, switching costs become formidable. The resulting land-and-expand dynamic has historically driven net retention rates to 144%, turning compliance entry points into enterprise-wide decision fabrics."
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU007"
      - "CU010"
  - calloutType: "risk"
    title: "Implementation Complexity and Professional Services Overhead"
    body: "Deploying Quantexa's platform requires extensive custom integration, schema mapping, and change management. Professional services fees typically add 20% to 40% on top of first-year software license costs, with external consulting studies indicating multi-year implementation and change management expenses of $8.2 million for large financial institutions. This structural complexity introduces procurement friction, lengthens sales cycles, and poses deployment delay risks."
    claimRefs:
      - "CU001"
      - "CU011"
      - "CU012"
      - "CU015"
