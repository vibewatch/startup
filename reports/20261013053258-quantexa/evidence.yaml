evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosures-and-capital-structure
    missingEvidence: >-
      Audited GAAP income statements, exact software-versus-services gross margins, current cash burn rate, and
      late-stage liquidation preference seniority stack.
    whyItMatters: >-
      Without audited financial statements, true software gross margins cannot be separated from professional services
      drag, obscuring underlying cash flow economics.
    diligencePath: >-
      Request confidential disclosure of FY2024-FY2025 audited financial statements, board deck reporting ARR waterfall,
      and full capitalization table summary.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: material
    topic: Stakeholder or investor map
    missingEvidence: >-
      Complete institutional ownership percentages, voting rights agreements, board observer seats, and secondary share
      transaction records across all funding rounds.
    whyItMatters: >-
      High ownership concentration among early venture and growth equity sponsors may restrict minority investor
      governance influence and create liquidation overhang.
    diligencePath: >-
      Review company Articles of Association, investor rights agreements, and voting covenants in private diligence data
      room.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: minor
    topic: customer-concentration-and-contract-sizes
    missingEvidence: >-
      Detailed logo count breakdown, top-10 customer revenue concentration percentages, and gross revenue retention
      (GRR) metrics across banking and public sector verticals.
    whyItMatters: >-
      High customer concentration among top global banking accounts could expose revenue stability to procurement policy
      changes or vendor consolidation.
    diligencePath: >-
      Review customer cohorts, net expansion by industry vertical, and account-level renewal history during management
      diligence sessions.
  - type: missing-source
    severity: material
    topic: tam-segmentation-transparency
    missingEvidence: >-
      Granular bottom-up market sizing separating recurring Decision Intelligence software subscription spend from
      accompanying systems integration and data cleansing services.
    whyItMatters: >-
      Broad industry TAM estimates lump multi-billion-dollar IT professional services together with pure software
      licensing, obscuring Quantexa's addressable software ARR ceiling.
    diligencePath: >-
      Obtain vendor-disclosed customer ACV distributions and third-party analyst sub-segment breakdowns isolating pure
      software subscription revenue from implementation spend.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: mid-market-adoption-economics
    missingEvidence: >-
      Verified deployment metrics, contract values, and churn data for non-Tier-1 enterprise customers with under $5
      billion in assets or revenue.
    whyItMatters: >-
      Without mid-market and non-banking commercial traction data, Quantexa's SAM is constrained to several hundred
      global financial and government institutions, limiting long-term growth velocity.
    diligencePath: >-
      Review pipeline conversion benchmarks, contract win-rate reports, and partner co-sell metrics across Microsoft
      Azure and Google Cloud marketplaces for regional enterprises.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: hyperscaler-and-in-house-replication
    missingEvidence: >-
      Direct benchmark data on enterprise cost and engineering feasibility when attempting to replicate Quantexa's
      dynamic graph analytics using native hyperscaler tools.
    whyItMatters: >-
      Affects the long-term defensibility of Quantexa's software premium if cloud providers or open-source foundation
      models simplify complex graph-based entity resolution.
    diligencePath: >-
      Request customer proof points comparing total cost of ownership between in-house cloud-native implementations and
      Quantexa's packaged Decision Intelligence platform.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: unaudited-gross-margin
    missingEvidence: >-
      Audited breakdown of software subscription gross margin versus professional services delivery costs and
      implementation labor.
    whyItMatters: >-
      High implementation overhead observed in composite studies ($8.2M implementation vs $4.4M software) suggests gross
      margins could be compressed during rapid expansion.
    diligencePath: Request audited GAAP/IFRS gross margin statements separated by software licensing and professional services lines.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: current-cash-burn-and-runway
    missingEvidence: >-
      Monthly operating cash burn rate, net cash balance, and forward runway following the March 2025 Series F financing
      round.
    whyItMatters: >-
      Understanding ongoing capital consumption is critical to assessing whether Quantexa can self-fund growth to
      profitability or requires future dilutive equity rounds.
    diligencePath: Review management financial model, trailing twelve months cash flow statements, and board-level budget forecasts.
    relatedQuestionRefs:
      - QI005
  - type: private-evidence-only
    severity: material
    topic: production-infrastructure-sizing-and-tco
    missingEvidence: >-
      Audited client benchmarks detailing cloud infrastructure compute expenditures (Spark clusters, Elasticsearch
      instances, and object storage) across live production deployments.
    whyItMatters: >-
      High underlying infrastructure requirements significantly increase the true total cost of ownership beyond base
      Quantexa license fees, directly impacting buyer ROI.
    diligencePath: >-
      Request customer deployment architecture sizing guides and anonymized infrastructure cost telemetry during
      technical due diligence.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: public-developer-signal-telemetry
    missingEvidence: >-
      Public community engagement metrics, open-source download volumes, or third-party developer forum activity
      regarding Quantexa API integrations.
    whyItMatters: >-
      Quantexa's proprietary distribution model restricts developer insights to authorized customer accounts, limiting
      external validation of practitioner sentiment.
    diligencePath: >-
      Review Quantexa Community user growth metrics, partner certification graduation counts, and customer developer
      satisfaction surveys under NDA.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: >-
      Audited current Gross Retention Rate (GRR), ongoing Net Revenue Retention (NRR) for FY2025-FY2026, and top-ten
      customer concentration percentages.
    whyItMatters: >-
      Without audited current retention and customer concentration figures, high reported historical expansion (144% NRR
      in FY2022) cannot be validated against potential churn or revenue concentration in top-tier banks.
    diligencePath: >-
      Request private SaaS metrics package under non-disclosure agreement detailing customer cohort churn tables, logo
      retention, and top-ten customer ARR contributions.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: minor
    topic: customer-enumeration
    missingEvidence: Complete commercial customer roster and contract values across all enterprise accounts.
    whyItMatters: >-
      Public customer disclosures highlight flagship reference accounts but omit smaller mid-market implementations and
