            tableRef: TE003
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Decoupled Batch and Dynamic Processing Enables Scalable Real-Time Graph Analysis
            body: >-
              Quantexa resolves the tension between bulk scale and interactive latency by separating its compute
              topology into two synchronized tiers. A batch Spark engine written in native Scala handles high-volume
              data transformations and historical entity networks across tens of billions of rows. Concurrently, a
              dynamic microservice tier running on Kubernetes queries indexed Elasticsearch stores to construct
              egocentric sub-graphs and score transactions on the fly, delivering sub-second investigation responses
              without requiring expensive global graph database locking.
            calloutType: insight
            claimRefs:
              - CE001
              - CE009
          - type: callout
            title: Extensive Supporting Infrastructure Creates Significant Hidden Total Cost of Ownership
            body: >-
              While Quantexa provides powerful entity resolution algorithms, deploying the platform demands a heavy
              secondary software footprint. Enterprise customers must independently license, configure, and operate
              clusters for Apache Spark, Elasticsearch or OpenSearch, Kafka streaming brokers, and PostgreSQL database
              instances in addition to Quantexa software licenses. This prerequisite infrastructure expands cloud
              compute costs, requires specialized data engineering talent, and extends deployment cycles to multiple
              months.
            calloutType: risk
            claimRefs:
              - CE010
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Enterprise Buyer Profiles
        blocks:
          - type: paragraph
            body: >-
              Quantexa targets complex, data-intensive global enterprises with high regulatory compliance exposure,
              complex data fragmentation, and high-stakes fraud risk. The company's primary customer base is
              concentrated within Tier-1 global financial institutions, including 7 of the top 10 global banks such as
              HSBC, BNY Mellon, Danske Bank, ING, and Morgan Stanley. In banking, the primary buyers are Chief
              Information Officers, Chief Compliance Officers, and Global Heads of Financial Crime, who procure
              Quantexa's Decision Intelligence Platform to overcome severe false-positive alert volumes generated by
              legacy rules-based monitoring systems. Beyond tier-1 banking, Quantexa has expanded into global insurance
              carriers like Zurich Insurance Group, telecommunications operators like Vodafone, healthcare providers
              including NHS Foundation Trusts, and government agencies such as the UK Cabinet Office. While banking
              historically accounted for over 70% of company revenue, non-banking verticals including insurance,
              government, and telecommunications grew to generate nearly 30% of total revenue. Across all target
              sectors, buyers face disconnected legacy data silos and seek unified entity views to automate operational
              decision-making.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
