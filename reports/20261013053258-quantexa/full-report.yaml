      - number: '6.3'
        title: Named Customer Deployments and Measurable Operational Outcomes
        blocks:
          - type: paragraph
            body: >-
              Publicly verified customer deployments demonstrate quantifiable operational outcomes across financial
              crime detection, credit risk investigations, fraud recovery, and client data consolidation. HSBC
              represents Quantexa's earliest and most strategic production customer, deploying the platform globally
              across 62 countries and 39 million customer records to establish a single customer view through entity
              resolution and generate an estimated £4 million in cost savings from legacy system decommissioning. In
              investment banking, Morgan Stanley received its 2026 Innovation Award for implementing Quantexa's entity
              resolution to unify customer and contact data across business units, providing an integrated enterprise
              view. In public sector fraud detection, the UK Cabinet Office deployed Quantexa's contextual scoring
              technology during post-pandemic oversight, successfully recovering £14 million in fraudulent COVID-19
              scheme loans and exposing 250 connected illicit networks. In continental European banking, Novobanco
              established a unified data estate on Quantexa and Microsoft Azure, deploying over 50 AI models for fraud
              detection and customer personalization. In insurance, Zurich Insurance Group partnered with Quantexa in
              late 2025 as the first global insurer implementing the decision intelligence platform for automated fraud
              detection.
