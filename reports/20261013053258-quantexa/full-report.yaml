      - number: '6.4'
        title: Expansion Dynamics, Implementation Overhead, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              While Quantexa demonstrates strong land-and-expand dynamics once embedded in client infrastructure,
              platform adoption involves substantial procurement friction, high total cost of ownership, and heavy
              professional services dependence. Typical enterprise software annual contracts range from $0.5 million to
              $15.0 million depending on data ingestion volume and user seat tiers. However, deployment requires
              extensive systems integration, data cleansing, and schema configuration. Professional services engagements
              typically add 20% to 40% of first-year contract value, and Forrester's enterprise economic modeling
              estimated three-year implementation and organizational change management costs at $8.2 million, exceeding
              cumulative software subscription fees of $4.4 million. Furthermore, while Quantexa's core platform reduces
              alert false positives by up to 90% and accelerates model resolution by 60x, enterprise clients face
              prolonged rollout timelines and integration hurdles when moving models from ad-hoc analysis into real-time
              production workflows. The business also carries inherent customer concentration risk given its reliance on
              top-tier global banks and large-scale public sector agency procurement cycles.
