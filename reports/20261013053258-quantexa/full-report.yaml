        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Discipline Over Pre-IPO Euphoria
            body: >-
              While Quantexa commands elite client references across global financial institutions and government
              intelligence, entering at a rumored $3B+ valuation in private secondary markets lacks fundamental margin
              of safety. Investors should avoid chasing pre-IPO liquidity until audited disclosures confirm gross margin
              sustainability and cap-table preference terms.
