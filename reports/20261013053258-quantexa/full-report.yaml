      - number: '5.3'
        title: Decisioning Workflows, Analytics Tooling, and User Interfaces
        blocks:
          - type: paragraph
            body: >-
              Beyond data unification and network assembly, Quantexa operationalizes intelligence through its scoring
              framework, investigation interfaces, and decision workflows. The application tier features the Zoltar web
              application suite, encompassing Explorer, Search, and Task Management modules tailored for compliance
              officers, fraud investigators, and risk analysts. For advanced analytical engineering, Quantexa provides
              Detection Packs and the QPython library, enabling data scientists to build, backtest, and deploy
              transparent scoring algorithms directly against resolved graph networks. These workflows support augmented
              decisioning by recommending alert prioritizations and next-best actions while preserving explainability
              and human-in-the-loop oversight for regulated financial institutions.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE014
