chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Platform Foundations
        blocks:
          - type: paragraph
            body: >-
              Founded in London in 2016 by CEO Vishal Marria and an experienced founding team, Quantexa has established
              itself as a category-defining Decision Intelligence software provider. The company addresses a fundamental
              operational failure across global enterprises: the inability to connect siloed, duplicate, and ambiguous
              data records across disparate legacy systems. Rather than requiring customers to undertake high-risk core
              replacements, Quantexa deploys proprietary dynamic entity resolution and knowledge graph technology to
              stitch together billions of internal and external data points into a unified, contextual data foundation.
              This architectural approach creates what Quantexa terms Real-World Context, allowing tier-one commercial
              banks, insurers, telecommunications operators, and government enforcement agencies to automate compliance
              reviews, identify complex fraud rings, and surface cross-enterprise client intelligence. As enterprise
              software architectures transition toward autonomous agentic deployments, Quantexa has positioned its
              platform as the essential contextual fabric bridging raw data assets with large language models, ensuring
              that downstream AI decisions remain explainable, auditable, and grounded in trusted real-world
              relationships.
            claimRefs:
              - CO001
              - CO012
          - type: table
            tableRef: TO001
            claimRefs:
              - CO004
              - CO006
              - CO007
      - number: '1.2'
        title: Executive Leadership and Organizational Governance
        blocks:
          - type: paragraph
            body: >-
              Quantexa is led by Founder and Chief Executive Officer Vishal Marria, whose prior background as the
              youngest Executive Director at Ernst & Young and senior technologist at Detica, SAS, and major investment
              banking institutions directly informs the company's financial crime and analytics focus. Marria is
              supported by co-founders including Chief Technology Officer Jamie Hutton, who serves as the primary
              architect behind Quantexa's dynamic entity resolution algorithms, as well as Richard Seewald, Imam Hoque,
              Felix Hoddinott, Alexon Bell, and Laura Hutton. In recent operating cycles, the executive bench has
              expanded through the addition of senior software operators such as Chief Product Officer Dan Higgins, who
              oversees platform evolutions including Q Assist and the agentic Agent Gateway. While the founding core
              retains substantial operational and technical influence over product direction, the company has
              diversified functional governance across regional managing directors in EMEA, North America, and APAC.
              Key-person reliance remains concentrated in Marria and Hutton given their roles as the public commercial
              figurehead and proprietary systems architect, respectively; however, executive expansion has created
              structured departmental leadership across compliance, product development, and global channel alliances.
            claimRefs:
              - CO002
              - CO003
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
      - number: '1.3'
        title: Capitalization History and Investor Syndicate
        blocks:
          - type: paragraph
            body: >-
              Quantexa's financing history reflects sustained institutional backing spanning six private venture capital
              and growth equity rounds totaling approximately $545M to $546M in equity capital. The company raised an
              initial $3.3M Series A in March 2017 led by Albion Ventures with early participation from HSBC, which also
              served as a cornerstone enterprise design client. Following successive expansion financings, private
              equity sponsor Warburg Pincus led a $153M to $157M Series D round in July 2021, cementing Quantexa's
              balance sheet for global expansion. In April 2023, Quantexa achieved unicorn status following a $129M
              Series E financing, and most recently in March 2025 closed a $175M Series F round at a post-money
              valuation of $2.6B led by Teachers' Venture Growth, the venture investment arm of the Ontario Teachers'
              Pension Plan. The round included continued support from Warburg Pincus, Evolution Equity Partners, BNY
              Mellon, ABN AMRO, and British Patient Capital. Despite this pedigree, detailed cap table economics remain
              tightly held: exact share class breakdowns, liquidation preference multiples, and secondary transaction
              pricing are undisclosed, leaving potential minority investors with notable governance and preference-stack
              information asymmetries.
            claimRefs:
              - CO004
              - CO005
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO005
      - number: '1.4'
        title: Operational Scale and Commercial Traction
        blocks:
          - type: paragraph
            body: >-
              From its London headquarters, Quantexa has expanded into a global software enterprise with more than 900
              employees operating across key financial centers including New York, Boston, Singapore, Melbourne,
              Brussels, and Toronto. Commercial traction accelerated meaningfully following its FY2022 performance,
              where the company recorded a 144% Net Retention Rate and a greater than 70% expansion in Committed ARR,
              establishing North America as a 30% revenue contributor and APAC as a 20% contributor. By 2024, Quantexa
              achieved Centaur status by surpassing $100M in Annual Recurring Revenue while sustaining estimated annual
              growth near 40%. The company counts seven of the top ten global commercial banks among its customer base,
              alongside major government bodies such as the UK Cabinet Office and transport authorities such as Govia
              Thameslink Railway. Enterprise distribution is further bolstered through strategic cloud partnerships,
              including an Azure Managed Application listing co-developed with Microsoft, and systems integrator
              alliances with Deloitte, Accenture, and KPMG. However, deal economics remain weighted toward high-touch
              enterprise software sales, with annual contract values spanning $0.5M to $15M and professional services
              typically adding 20% to 40% in first-year deployment costs.
            claimRefs:
              - CO006
              - CO007
              - CO010
              - CO011
              - CO013
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO008
              - CO009
      - number: '1.5'
        title: Strategic Milestones and Critical Risk Analysis
        blocks:
          - type: paragraph
            body: >-
              Quantexa's operational progression demonstrates consistent execution across financing, product delivery,
              and independent analyst recognition. Key milestones include the deployment of Quantexa 2 in late 2021,
              unicorn status in 2023, the $2.6B Series F valuation in 2025, and recognition as a Leader in both the 2026
              Gartner Magic Quadrant for Decision Intelligence Platforms and the IDC MarketScape. In late 2025, the
              company introduced Quantexa AI with an MCP-compliant Agent Gateway, positioning its graph foundation for
              agentic AI workflows and earning Morgan Stanley's 2026 Innovation Award. Nevertheless, diligence
              highlights meaningful operational and financial risks. Independent economic studies indicate that complex
              enterprise implementations incur heavy change management and integration overhead, with composite
              enterprise models absorbing over $8.2M in professional services and implementation drag alongside $2.1M in
              ongoing maintenance. Furthermore, Quantexa competes against entrenched incumbent financial crime suites
              such as NICE Actimize, agile niche specialists like Ripjar, and general-purpose enterprise data platforms
              like Palantir Foundry. Without verified GAAP disclosures regarding current software-versus-services
              revenue mix, gross margins, and net burn, Quantexa's late-stage premium multiple demands disciplined
              verification.
            claimRefs:
              - CO008
              - CO009
              - CO015
      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Moat via Dynamic Entity Resolution and Contextual Graphs
            body: >-
              Quantexa's core technical differentiation lies in resolving disparate entities dynamically across billions
              of records rather than forcing schema unification before analysis. By embedding contextual scoring into
              investigations and AI pipelines, the platform delivers verifiable false-positive reductions for tier-one
              banks while positioning itself as the trusted contextual data fabric for enterprise agentic AI workflows.
            calloutType: insight
            claimRefs:
              - CO001
              - CO012
          - type: callout
            title: High Implementation Drag and Cap Table Information Asymmetry
            body: >-
              While Quantexa commands high net retention and marquee logos, annual enterprise contract commitments
              ranging from $0.5M to $15M require extensive professional services that can add 20% to 40% in first-year
              implementation costs. Coupled with an opaque private capital structure and unverified cash burn, diligence
              must closely evaluate deployment friction and liquidation preference seniority before underwriting
              late-stage valuations.
            calloutType: risk
            claimRefs:
              - CO010
              - CO011
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Quantexa operates within the emerging Decision Intelligence software category, which Gartner and IDC
              define as technology that models, executes, and augments complex business decisions by connecting
              fragmented data and operationalizing contextual AI. Rather than competing as a generic business
              intelligence reporting dashboard or a centralized data warehouse, Quantexa defines its market boundary
              around dynamic entity resolution, real-world knowledge graphs, and investigative decisioning workflows. In
              enterprise deployments, the primary wedge is regulatory compliance and financial crime—specifically
              anti-money laundering (AML), Know Your Customer (KYC), and transaction fraud monitoring. Traditional
              status-quo alternatives in this market consist of legacy relational Master Data Management (MDM)
              platforms, database rules engines, and point solutions such as NICE Actimize. These legacy systems
              struggle with ambiguous matching, creating severe false-positive alert backlogs that consume excessive
              manual compliance analyst hours. By establishing a schema-agnostic contextual fabric that resolves
              entities dynamically across billions of internal and external data points, Quantexa allows Tier-1
              organizations to bridge raw data and trusted operational action without requiring wholesale legacy core
              system replacement.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM006
              - CM012
      - number: '2.2'
        title: Addressable Market Sizing, Growth Drivers, and Sizing Lens
        blocks:
          - type: paragraph
            body: >-
              Quantifying the addressable market for Decision Intelligence requires dissecting broad industry consensus
              into realistic, software-constrained demand layers. Macro analyst estimates project the overarching global
              Decision Intelligence software market between $15 billion and $25 billion by 2030, expanding at a compound
              annual growth rate exceeding 22%. However, much of this headline total incorporates horizontal enterprise
              analytics, automated dashboarding, and robotic process automation that lies outside Quantexa's core
              graph-matching capabilities. When bounded specifically to dedicated decision intelligence platforms with
              contextual data foundations—as evaluated in the 2026 IDC MarketScape vendor assessment—the near-term
              global software TAM is estimated at $16.8 billion. Narrowing further to financial crime compliance, fraud
              detection, and regulatory risk analytics across global financial institutions yields an addressable
              software market of approximately $8.5 billion. Within this regulated universe, Quantexa's realistic
              Serviced Addressable Market (SAM) is approximately $3.2 billion, representing the roughly 500 largest
              global commercial banks, tier-one insurers, telecommunications operators, and government revenue agencies
              capable of absorbing multi-million-dollar subscription contracts and multi-month integration deployments.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM007
              - CM009
