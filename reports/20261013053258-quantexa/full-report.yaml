      - number: '3.3'
        title: Commercial Packaging, Pricing Models, and Switching Costs
        blocks:
          - type: paragraph
            body: >-
              Quantexa distributes its software via annual subscription licenses, ranging from approximately $0.5
              million to $15.0 million annually depending on record volumes, user seats, and deployed application
              suites. First-year deployments typically carry an additional 20% to 40% professional services
              implementation investment, reflecting the integration complexity of large-scale enterprise data fabrics.
              Once embedded, Quantexa's unified entity foundation establishes substantial organizational switching
              costs. When a global financial institution leverages the same resolved customer context across KYC
              screening, fraud operations, credit risk, and customer intelligence, displacing the platform would require
              coordinating migrations across disparate business units. In Forrester's composite economic study,
              enterprise adoption yielded $3.6 million in cost savings through the retirement of legacy point detection
              tools and bespoke databases. These multi-use case dynamics reinforce customer retention and expand
              contract values over time.
