              - CV011
              - CV012
              - CV014
      - number: '8.4'
        title: Recommendation Synthesis and Diligence Action Plan
        blocks:
          - type: paragraph
            body: >
              Synthesizing qualitative market dominance against quantitative valuation discipline, Quantexa receives an
              overall recommendation of TRACK, medium confidence, high risk rating, and a stretched valuation stance.
              While the technology moat in dynamic entity resolution and customer stickiness are verified, late-stage
              entry at a $2.6B to $3.0B headline valuation lacks sufficient risk-adjusted margin of safety without
              proprietary access to the capitalization table and audited financial statements. Institutional investors
              considering secondary shares on platforms like Forge Global or EquityZen must condition any commitment on
              verifying exact subscription gross margins, net retention bridges beyond historical FY2022 releases,
              customer concentration amongst top-5 banks, and senior liquidation preferences. Key thesis-break triggers
              include persistent deceleration of ARR growth below 15%, multiple compression below 10x revenue across
              enterprise software peers, or key customer defection within tier-one global institutions.
