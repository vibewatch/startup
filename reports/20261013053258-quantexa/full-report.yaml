  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Pricing Architecture, and Software Packaging
        blocks:
          - type: paragraph
            body: >-
              Quantexa generates revenue primarily through enterprise software subscriptions for its Decision
              Intelligence Platform, augmented by specialized solution modules and deployment-related professional
              services. The core monetization mechanism revolves around annual licensing agreements that scale with
              institutional data volume, record throughput, and the specific operational modules activated. As
              documented across Tier-1 banking deployments including HSBC, Standard Chartered, BNY Mellon, and Morgan
              Stanley, institutional buyers license the foundation to unify disparate data streams and resolve entities
              into context-rich knowledge graphs. Unlike consumer or mid-market compliance software, Quantexa maintains
              an unlisted, bespoke pricing structure requiring custom quotations based on architecture scope. For
              enterprise underwriting, understanding this packaging is essential: initial contract values reflect base
              entity resolution infrastructure, while subsequent revenue growth relies on activating secondary
              application suites such as anti-money laundering, payment fraud detection, and customer intelligence on
              top of the established graph context.
            claimRefs:
