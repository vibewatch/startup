      - number: '7.4'
        title: Residual Risk Synthesis, Heatmap Matrix, and Diligence Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Quantexa's residual risk profile is shaped by the interplay between capital intensity, enterprise sales
              complexity, and structural customer concentration. Having secured $545 million in lifetime equity
              financing, culminating in a $175 million Series F round in March 2025 at a $2.6 billion valuation,
              Quantexa faces elevated expectations to sustain rapid annual recurring revenue growth while navigating an
              881-person global operating structure. Investors must rigorously monitor identifiable thesis-break
              triggers that would invalidate the investment thesis: specifically, customer churn exceeding 10% among
              tier-1 banking anchor accounts, services revenue exceeding 35% of total gross revenue indicating platform
              delivery friction, formal regulatory sanctions concerning algorithmic bias or unexplainable automated
