  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Compliance, AI Governance, and Legal Exposures
        blocks:
          - type: paragraph
            body: >-
              Quantexa's core value proposition centres on mission-critical anti-money laundering, know-your-customer
              compliance, and fraud detection deployments across heavily regulated tier-1 financial institutions and
              public sector agencies. Operating in these highly scrutinized environments exposes the company to evolving
              cross-border compliance demands, including the European Union's General Data Protection Regulation and the
              emerging EU AI Act. Because Quantexa's Decision Intelligence Platform ingests massive volumes of
              structured and unstructured enterprise records to generate dynamic entity profiles and knowledge graphs,
              any failure to maintain transparent data lineage or adhere to jurisdiction-specific data residency
              mandates introduces material regulatory and legal liability. While Quantexa incorporates automated
              stewardship mechanisms and model explainability frameworks to provide auditable outputs for bank
              regulators, the continuous introduction of generative and agentic AI capabilities elevates supervisory
              scrutiny around algorithmic bias, data provenance, and automated decision explainability across
              transatlantic jurisdictions.
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: table
            tableRef: TR001
