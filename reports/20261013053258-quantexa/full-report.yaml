        title: Unit Economics, Deployment Overheads, and Margin Bridge
        blocks:
          - type: paragraph
            body: >-
              Analyzing Quantexa's unit economics requires untangling high software recurring revenue potential from
              substantial upfront implementation friction. In a representative composite enterprise study conducted by
              Forrester Consulting, an enterprise customer paid $4.4 million in risk-adjusted present value subscription
              fees over three years, scaling from $750,000 in Year 1 to $3.0 million by Year 3 as multiple operational
              lines of business joined the platform. However, the same composite deployment incurred $8.2 million in
              implementation and change management costs, alongside $2.1 million in ongoing infrastructure and
              maintenance expenses. This substantial service-to-software ratio highlights that Quantexa deployments are
              intensive multi-year operational transformations rather than lightweight SaaS integrations. For mid-tier
              enterprises, this implementation complexity and lack of published pricing represent a significant barrier
              to adoption. Nevertheless, once the foundational graph is operational, incremental use cases deliver
              compelling operating leverage, enabling strong expansion margins as clients scale from compliance
              investigations into enterprise-wide customer intelligence.
