      - number: '6.2'
        title: Adoption Trajectory, Enterprise Deployment Scale, and Retention
        blocks:
          - type: paragraph
            body: >-
              Quantexa's commercial adoption trajectory reflects steady global enterprise expansion, scaling past $100
              million in annual recurring revenue in late 2024 with historical Committed ARR expansion exceeding 70%
              year-over-year. The platform's enterprise deployments operate at massive data scale, connecting over 60
              billion records across internal and external data sources for clients spanning more than 60 countries.
              Geographically, EMEA represents the core historical customer base at over 50% of revenue, while North
              America has expanded rapidly to contribute 30% of revenue, and the Asia-Pacific region accounts for
              approximately 20%. Historical net retention rate reached 144% in FY2022, underscoring substantial net
              expansion within existing accounts as clients license additional use cases. However, verified ongoing net
              revenue retention and gross retention rates remain undisclosed private metrics. An independent Total
              Economic Impact study by Forrester Consulting evaluated a composite enterprise customer deploying Quantexa
              across multiple use cases, finding that initial platform software subscription fees of $750,000 in Year 1
              increased to $3.0 million by Year 3 as additional business units and analytical workloads were adopted.
            claimRefs:
              - CU007
