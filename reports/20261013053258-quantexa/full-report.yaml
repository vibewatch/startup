          - type: callout
            title: Services Drag and Legacy Suite Inertia
            body: >-
              Incumbent vendors like NICE Actimize maintain deep regulatory inertia, while Quantexa's 20% to 40% initial
              professional services drag poses an adoption barrier for mid-market buyers.
            calloutType: risk
            claimRefs:
              - CP004
