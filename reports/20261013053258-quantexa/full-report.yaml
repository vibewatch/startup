      - number: '5.4'
        title: Deployment Models, Infrastructure Dependencies, and Operational Trade-Offs
        blocks:
          - type: paragraph
            body: >-
              Quantexa supports flexible deployment topologies across on-premise data centers, private clouds, and
              hyperscaler environments—including AWS, Microsoft Azure, and Google Cloud Platform—with orchestration
              managed via Kubernetes Helm charts. However, enterprise operationalization introduces notable
              architectural complexity and infrastructure overhead. Running the full Quantexa stack requires
              coordinating distinct compute and data tiers: an Apache Spark cluster for batch processing, an
              Elasticsearch or OpenSearch cluster for indexed search and dynamic sub-graph retrieval, cloud object
              storage for bulk file persistence, and an enterprise RDBMS for state and audit tracking. Third-party
              architectural assessments highlight that this distributed stack drives high total cost of ownership (TCO)
              and multi-month implementation timelines, posing adoption hurdles for mid-market buyers lacking dedicated
              data engineering resources.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
