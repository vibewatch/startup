      - number: '8.2'
        title: Financing History and Valuation Discipline
        blocks:
          - type: paragraph
            body: >
              Quantexa's capital trajectory reflects aggressive scale-up financing, totaling approximately $545M raised
              across six rounds from premier institutional investors including Warburg Pincus, Ontario Teachers' Pension
              Plan (Teachers' Venture Growth), British Patient Capital, and strategic banking partners such as BNY
              Mellon and ABN AMRO. The company crossed unicorn status at $1B+ in 2023 and achieved a $2.6B post-money
              valuation in its $175M Series F round in March 2025. Emerging secondary market indications and preliminary
              IPO planning point toward an equity valuation objective exceeding $3B across London or New York venues.
              However, discipline requires testing whether public comps justify this premium: public data and analytics
              leaders such as Palantir trade at elevated revenue multiples driven by GAAP operating profitability and
              explosive public-sector growth, while pure-play enterprise compliance peers trade closer to 6x to 10x ARR.
              Without verified disclosure of Quantexa's gross margin structure, current cash burn rate, and preference
              stack terms, underwriting a private valuation multiple north of 20x ARR exposes late-stage capital to
              compression or down-round risk upon public listing.
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV014
              - CV015
      - number: '8.3'
        title: Scenario Analysis and Downside Risks
        blocks:
          - type: paragraph
            body: >
              Scenario modeling across bull, base, and bear horizons demonstrates a polarized return distribution. In
              the bull case, Quantexa capitalizes on enterprise agentic AI adoption via its Agent Gateway and Q Assist
              offerings, sustaining 35% ARR expansion, expanding beyond banking into telecom and healthcare, and pricing
              an IPO at $3.5B to $4.2B (18x-20x forward ARR). In the base case, enterprise procurement cycles lengthen
              and services heavy deployments constrain margin expansion, leading to steady 20% growth and an IPO or
              crossover round priced at $2.6B to $3.0B (12x-14x ARR), providing modest 1.0x to 1.15x multiples of
              invested capital from current marks. In the bear case, software growth decelerates below 12%, multiple
              compression aligns pricing with historical compliance software comps at 8x ARR, and liquidation preference
              overhang dilutes common equity, generating a down-round or discounted IPO mark of $1.5B to $1.8B. These
              dynamics reinforce why institutional investors should maintain valuation discipline rather than chasing
              pre-IPO liquidity.
            claimRefs:
              - CV001
              - CV008
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
