  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: Current board composition, voting control, debt facilities, and any investor protective provisions after the Alibaba round.
    whyItMatters: Governance concentration and financing overhang materially affect downside protection, follow-on dilution, and strategic optionality.
    diligencePath: Request the latest cap table, board observer/seat schedule, debt schedule, and financing documents from management.
    relatedQuestionRefs:
    - QO011
    - QO023
    relatedTableRefs:
    - TO002
    - TO003
  - type: missing-source
    severity: material
    topic: follow-on-fundraising-status
    missingEvidence: Whether the additional 100 billion won post-Alibaba fundraising actually closed, on what terms, and whether any secondary sales occurred.
    whyItMatters: Round completion and structure change cash runway, dilution, signal quality, and how seriously investors should read the 3 trillion won valuation headline.
    diligencePath: Ask management for closed-round announcements, subscription documents, and an updated cash balance bridge after December 2024.
    relatedQuestionRefs:
    - QO016
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: workforce-disclosure
    missingEvidence: Current headcount, functional split, office footprint, and hiring or attrition trends by major geography.
    whyItMatters: People-cost intensity and execution bandwidth are critical for judging the durability of new-business expansion into payments, menswear, and Japan.
    diligencePath: Request an org chart, payroll summary, and active headcount by function and location as of the latest month-end.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: minor
    topic: active-customer-disclosure
    missingEvidence: A disclosed active buyer, seller, or paying-account count that is more decision-useful than app MAU.
    whyItMatters: MAU alone does not reveal conversion quality, monetized accounts, or seller density across Ably, 4910, and Amood.
    diligencePath: Ask for active buyers, active sellers, order frequency, and monetized-account counts by platform for the last four quarters.
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology coverage
    missingEvidence: A fully exhaustive, dated chronology covering every product, financing, governance, partnership, and adverse event across all Ably business lines.
    whyItMatters: The milestone table is intentionally selective, so omitted events could still affect how investors interpret execution consistency or timing.
    diligencePath: Request a management-prepared corporate timeline cross-checked to board decks, financing documents, and product launch logs.
    relatedTableRefs:
    - TO004
