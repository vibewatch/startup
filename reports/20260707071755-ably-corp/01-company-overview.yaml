callouts:
- calloutType: strength
  title: Ably has moved beyond a one-app story
  body: The combination of the flagship marketplace, seller tools, 4910, Amood, and Ably Pay suggests that the company is building a broader commerce stack rather than relying only on one women’s-fashion app. That platform breadth is one reason the Alibaba round and later growth claims look more durable than a simple cohort-growth story.
  claimRefs:
  - CO004
  - CO015
  - CO016
  - CO020
  - CO030
- calloutType: risk
  title: Scale is visible, but governance and compliance opacity remain real diligence issues
  body: Public evidence supports Ably’s user scale, valuation step-up, and expansion into payments and Japan, but investors still lack board detail, clean headcount disclosure, and proof of any completed post-Alibaba follow-on financing. At the same time, darker-pattern enforcement, review-disclosure rules, and broader platform legislation are raising the compliance burden on Korean ecommerce operators.
  claimRefs:
  - CO024
  - CO032
  - CO033
  - CO038
  - CO039
  - CO040
