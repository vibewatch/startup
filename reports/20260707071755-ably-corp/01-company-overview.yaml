- id: leadership-governance-and-operating-model
  title: Leadership, Governance, and Operating Model
  body: 'The public leadership file is thinner than the growth narrative. Reviewed company pages clearly identify Kang Seok-hoon as chief executive and locate the company in Seocho-gu, Seoul, while independent reporting adds the useful founder-market-fit point that he co-founded Watcha before starting Ably in 2018. Official materials also reference a CTO named Haneul and describe a distinctive internal operating model built around squads plus functional teams. Ably says that structure supports four strategic priorities—style portal, chain platform, global, and fintech—which aligns with the visible product portfolio and newer payment expansion. Culture disclosures further emphasize flexible work, aggressive performance orientation, and the abolition of the inclusive wage system in 2022. What is missing is equally important: reviewed public sources do not provide a board roster, debt schedule, or full executive bench. That keeps key-person dependence on Kang relatively high and leaves outside
    investors with limited visibility into governance mechanics.'
  claimRefs:
  - CO005
  - CO006
  - CO017
  - CO018
  - CO019
  - CO032
  - CO033
  tableRefs:
  - TO002
- id: capital-base-and-performance
  title: Capital Base, Scale Metrics, and Financial Performance
  body: 'The strongest public capital marker is the December 2024 Alibaba investment. Multiple outlets align on the rough economics: 100 billion won for about a 5% stake, implying a valuation near 3 trillion won and giving Ably the label of South Korea’s first unicorn startup of 2024. The public file also implies a steep step-up from the roughly 900 billion won valuation cited for a January 2022 pre-Series C round. Ably’s own homepage currently claims 300 billion won of cumulative investment, but reviewed reporting does not prove whether the additional post-Alibaba fundraising management discussed ever closed. Operating performance is better documented. Company-linked and independent reports show 2023 turning profitable, 2024 revenue rising to roughly 334 billion won with 2.5 trillion won of GMV, and 2025 revenue reaching 369.7 billion won with GMV around 2.8 trillion won while losses narrowed sharply. Mid-2026 coverage adds another layer of momentum through Ably Pay and renewed first-half
    growth.'
