company:
  name: Ably Corp.
chapter:
  number: 1
  title: Company Overview
  summary: Ably Corp. is a Seoul-based private fashion-commerce platform builder whose public story combines recommendation-led consumer apps, seller-enablement infrastructure, and international expansion through 4910 and Amood. The evidence strongly supports a December 2024 Alibaba investment at roughly a 3 trillion won valuation and a 2025-2026 operating scale step-up, but public disclosure on governance, headcount, and post-Alibaba financing terms remains thin while Korean ecommerce rules are tightening.
sections:
- id: identity-and-business-model
  title: Identity, Product, and Business Model
  body: 'Ably should be understood as a multi-sided commerce operator rather than a single shopping app. Official materials frame the company around “next commerce”: helping buyers discover personal style while also making it easier for sellers to source, list, distribute, and support inventory. That logic matters because Ably’s public footprint spans more than the flagship women’s-fashion marketplace. Independent reports consistently describe the corporate platform set as Ably, men’s-fashion app 4910, and Japan-facing app Amood, while official and app-store materials show seller tooling and partner-support infrastructure sitting behind them. The official history also suggests a meaningful evolution story: Kang Seok-hoon’s team began with teen-shopping mall Banhala in 2015, then pivoted to the Ably app in March 2018. The result is a business model that tries to compound consumer demand, seller onboarding, and data-driven recommendations across adjacent formats rather than rely on one storefront
    alone.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO007
