  headline: 继续研究：ABLY 是一家已具规模的韩国 fashion-tech 平台，增长可信，有 Alibaba 战略背书，经营表现也在改善；但在私营经济性和融资条款更充分披露之前，当前名义价格相对类电商上市公司仍偏贵。
