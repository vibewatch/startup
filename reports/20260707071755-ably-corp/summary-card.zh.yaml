  topStrengths:
    - ABLY 已突破 10 million 月活用户，规模上看像韩国垂直时尚电商的领先者。
    - 平台已不再是单一 app 故事：4910、Amood、卖家工具和 Ably Pay 为管理层打开多条相邻变现线。
    - 据报道 2025 年收入 KRW 369.7 billion、经营现金流转正、2026 上半年经营利润为正，说明业务质量在改善。
    - Alibaba 的 KRW 100 billion 投资，为 ABLY 的品类位置和 K-fashion 全球化叙事提供外部验证。
  topRisks:
    - Alibaba 轮的确切条款、持股比例计算、优先股堆叠，以及后续融资状态仍未公开。
    - 隐含约 8.1x trailing sales 的名义价格高于类电商上市可比区间，安全边际很薄。
    - 韩国时尚电商仍高度依赖促销，Musinsa、Zigzag、W Concept、Temu、Shein 和 AliExpress 的竞争也很激烈。
    - 围绕 dark patterns、平台公平和电商合规的监管收紧，可能推高成本和执行风险。
    - 乐观情景依赖 Ably Pay、4910 和 Amood，但公开证据仍未展示这些业务的分部经济性。
  unresolvedGaps:
    - 已签署的 Alibaba term sheet、确切持股比例、清算优先权，以及计划中的额外 KRW 100 billion 融资是否实际完成。
    - 核心 ABLY app 的分部运行率收入、take rate、毛利率、CAC、复购行为和 NRR。
    - Ably Pay、4910 和 Amood 的独立经济性和现金需求。
    - 买家和商户两侧的卖家集中度、退货负担、补贴强度和队列耐久性。
    - 公开市场式承销所需的董事会组成、领导层深度，以及其他治理或披露事项。
