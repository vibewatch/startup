- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Budget owner
  - Adoption trigger
  rows:
  - - Core women’s-fashion shopper on ABLY
    - Consumer chooses the app
    - Consumer shopper
    - Consumer pays for goods
    - Installs ABLY, browses AI-ranked items, checks out with platform services
    - Household discretionary spend
    - Free shipping, trend discovery, and broad style selection
  - - ABLY merchant or seller using seller tooling
    - Seller or merchant operator
    - Seller operations staff plus downstream shoppers
    - Seller pays with time, margin, and sometimes service usage; shopper still pays for goods
    - Uses seller app, open-market tools, and Partners support to list and manage inventory
    - Merchant operating budget
    - Need to reduce sourcing, fulfillment, support, and marketing friction
  - - Men’s-fashion shopper on 4910
    - Consumer chooses the app
    - Male shopper
    - Consumer pays for goods
    - Receives AI taste-based recommendations and shops style-led inventory
    - Household discretionary spend
    - Desire for a simpler men’s-fashion discovery experience
  - - Korean seller exporting through Amood
    - Seller chooses export path
    - Japanese shopper
    - Japanese shopper pays for goods; seller and platform share economics
    - Turns on one-stop export support for translation, customs, logistics, and customer service
    - Seller growth budget
    - Need for cross-border demand without building local Japanese operations
  - - Premium-curation alternative (29CM / W Concept)
    - Consumer chooses alternate app
    - Premium or designer-oriented shopper
    - Consumer pays for goods
    - Browses curated brand stories and premium labels on rival platforms
    - Household discretionary spend
    - Preference for curated premium brands over ABLY’s broader marketplace mix
  - - Mass-market fashion discovery alternative (Musinsa / Zigzag)
    - Consumer chooses alternate app
    - Young fashion shopper
    - Consumer pays for goods
    - Uses category breadth, ranking, delivery, or brand ecosystems on substitute platforms
    - Household discretionary spend
    - Preference for rival discovery logic, delivery promise, or community/network effects
  notes: Budget owners are inferred from the public workflow descriptions because ABLY does not disclose a formal buyer-budget taxonomy; the table focuses on who chooses the platform and who bears adoption friction in each segment.
