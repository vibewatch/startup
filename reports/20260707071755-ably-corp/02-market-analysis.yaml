company:
  name: Ably Corp.
chapter:
  number: 2
  title: Market Analysis
  summary: 'ABLY operates inside a very large Korean e-commerce market, but the directly relevant layer is much narrower: mobile-first fashion-platform commerce that is taking share from legacy channels even while the broader fashion industry grows only at low single digits. Public data show ABLY already sits near the top of specialty-platform scale on user and transaction lenses, with 4910 and Amood extending that footprint into men’s fashion and Japan export, while Chinese price competition and tightening Korean e-commerce rules are the main adoption and monetization constraints.'
sections:
- id: market-boundary-and-substitutes
  title: Market boundary, included spend, and substitutes
  body: 'ABLY does not sit inside all of Korean retail or even all of Korean e-commerce; it sits in the narrower layer where fashion-oriented shoppers discover, compare, and buy style goods through mobile-first platforms. The broad ceiling is still large: Trade.gov puts Korean e-commerce at roughly $200 billion in 2025 and about half of retail sales, while WPIC sizes the 2024 online market at about KRW 242 trillion. But those totals include electronics, food delivery, travel, and many other categories that do not map cleanly to ABLY’s buyer behavior. The more relevant adjacent boundary is Korea’s broader fashion industry, which Aju Press says is growing only at low single digits even as spend and attention shift toward platform-born brands. Within that boundary, the main substitutes are not only other fashion apps such as Musinsa, Zigzag, 29CM, and W Concept, but also legacy department stores, offline boutiques, and direct marketplace or social-selling paths that let a seller avoid building
    a branded, data-rich destination on ABLY at all.'
