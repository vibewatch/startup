tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment/category
  - Included spend
  - Excluded spend
  - Buyer/payer
  - Relevance
  rows:
  - - Broad Korean e-commerce
    - All online retail and service spending across major categories
    - Offline retail and non-commerce digital activity
    - Consumer is end payer; merchants and platforms capture revenue
    - Useful upper bound only; far broader than ABLY’s style-commerce niche
  - - Fashion-platform commerce
    - App-based discovery and purchase of apparel, accessories, beauty-adjacent and lifestyle goods through specialty platforms
    - Electronics, travel, food delivery, and general-merchandise spend not tied to style-led discovery
    - Consumer pays for goods; platform monetizes seller transactions and services
    - This is ABLY’s core addressable layer
  - - Seller-enablement and partner tooling
    - Operational services that help sellers source, list, market, fulfill, and support orders
    - Pure consumer-only app usage without seller tooling
    - Seller or merchant budget owner; shopper remains payer for goods
    - Important because ABLY competes on both demand aggregation and seller enablement
  - - Men’s-fashion adjacency (4910)
    - Style-led male shopper demand plus related beauty and lifestyle discovery inside 4910
    - Women-only core ABLY traffic and non-style categories with no relevance to fashion discovery
    - Male shopper pays; platform monetizes through the same commerce stack
    - Expands ABLY’s reachable buyer base beyond the core women’s app
  - - Japan export via Amood
    - Cross-border K-fashion sales and export services for Korean sellers into Japan
    - Domestic-only Korean transactions that never enter the export pipe
    - Japanese shopper pays; Korean seller and platform share the economics
    - Demonstrates an international expansion path without building a full global marketplace from scratch
  - - Substitute paths
    - Musinsa, Zigzag, 29CM, W Concept, offline department stores, and direct social or marketplace selling
    - N/A
    - Consumer or seller chooses an alternate route
    - ABLY must win against these alternatives, not just against total retail
  notes: Rows deliberately separate broad e-commerce, the narrower fashion-platform layer, two-sided seller tooling, and cross-border export so the chapter does not treat every Korean online-shopping dollar as addressable to ABLY.
