    - label: Leading Korean fashion-platform transaction scale (KRW trillion)
      low: 1.0
      mid: 2.5
      high: 4.5
      displayValue: 1.0T-4.5T KRW
      detail: Low = 29CM at 1T+ GMV, mid = ABLY at 2.5T 2024 transaction volume, high = Musinsa at 4.5T 2024 GMV. This is a disclosed peer-scale range, not a whole-market TAM.
      tone: neutral
  approximationNotes: The low point is a floor because 29CM was reported only as having surpassed KRW 1 trillion, not at a precise point estimate. The mid and high points are company-specific transaction or GMV disclosures from separate publishers and should be read as peer-scale brackets rather than synchronized year-end measurements.
