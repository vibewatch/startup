- id: FM004
  title: Adoption funnel or value-chain map
  type: funnel
  layout: standard
  summary: ABLY’s public evidence points to a buyer journey that narrows from broad discovery into repeat behavior and then into deeper monetization through payments, adjacent categories, and export-enabled seller growth.
  data:
    items:
    - label: Discovery through mobile-first fashion browsing
      value: 100
      detail: Grounded in Korea’s mobile-first e-commerce behavior and platform-led fashion discovery
    - label: App install and first session
      value: 72
      detail: Grounded in ABLY’s early user-acquisition story and current large-scale MAU footprint
    - label: First order after recommendation and shipping incentives
      value: 50
      detail: Grounded in free-shipping, AI recommendation, and category-breadth messaging rather than a disclosed conversion rate
    - label: Repeat behavior plus payments attachment
      value: 34
      detail: Grounded in high engagement, repeat-customer data in Japan, and fast growth of Ably Pay
    - label: Cross-segment expansion to men’s and Japan export
      value: 20
      detail: Grounded in 4910 and Amood traction, not a disclosed cohort funnel
  approximationNotes: Stage values are ordinal indices used to show funnel narrowing, not measured conversion rates. No fetched source discloses a complete ABLY funnel, so the figure encodes sequencing and relative narrowing rather than audited percentages.
