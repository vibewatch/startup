- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver/constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Mobile-first commerce and high online penetration
    - driver
    - current
    - Supports frequent app engagement and lowers friction for discovery-led shopping
    - Request ABLY mobile conversion and repeat-purchase data by cohort rather than relying on country averages
  - - Shift from department-store labels to platform-born brands
    - driver
    - current to medium term
    - Helps specialty apps capture attention even when the overall fashion market grows slowly
    - Ask management for cohort or brand-level evidence showing whether ABLY is gaining share from offline or from rival apps
  - - AI personalization and cross-category merchandising
    - driver
    - current
    - Raises discovery efficiency and lets ABLY monetize beauty, lifestyle, and content alongside core fashion
    - Request incremental conversion or basket-size lift from recommendation and category-expansion features
  - - Japan export pipeline via Amood
    - driver
    - current to medium term
    - Creates a second growth channel for sellers and ties ABLY’s infrastructure to cross-border demand
    - Ask for gross margin and repeat-rate data on Amood-export orders versus domestic orders
  - - Fast-delivery and integrated-payment expectations
    - mixed
    - current
    - Incumbents with strong logistics and payment products benefit, while weaker operators face service-level pressure
    - Request ABLY Pay attach-rate, delivery-service mix, and order-level economics
  - - Chinese low-cost entrants (AliExpress, Temu, Shein)
    - constraint
    - current
    - Compress pricing power and force Korean platforms to defend on curation, trust, and domestic-brand relevance
    - Test whether ABLY’s repeat behavior is holding up in price-sensitive categories
  - - 2025 dark-pattern and consumer-review rules
    - constraint
    - current
    - Raises UX-compliance burden around subscriptions, price display, reviews, and cancellation flows
    - Review ABLY product flows and seller policies for compliance cost and implementation scope
  - - 2026 domestic-agent and platform-fairness proposals
    - constraint
    - current to medium term
    - Add regulatory uncertainty for cross-border platforms and may change enforcement or disclosure expectations across the ecosystem
    - Track whether the final rule set materially changes obligations for overseas marketplaces competing with ABLY
  notes: Timing and implication fields combine country-level market guides, legal updates, and sector reporting; several items are ecosystem constraints rather than ABLY-specific disclosures, which is why diligence asks focus on company-level pass-through.
