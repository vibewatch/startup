  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: women-fashion-platform-sizing
    missingEvidence: A public study that separates Korea women’s-fashion-platform TAM, SAM, and SOM from total e-commerce, total fashion-industry output, and company-specific GMV disclosures.
    whyItMatters: Without a clean market denominator, Ably can be framed as either a tiny slice of Korea retail or a leading share of a much narrower women’s-platform segment, which changes valuation framing.
    diligencePath: Request management’s internal category tree, third-party app-intelligence share studies, and merchant or buyer cohort breakouts that isolate women’s fashion commerce from adjacent categories.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: business-mix
    missingEvidence: Segment-level GMV, revenue, and user mix for beauty, lifestyle, 4910, and Amood relative to the core women’s-fashion app.
    whyItMatters: Public disclosures confirm adjacency expansion, but not whether those adjacencies are still exploratory or already material enough to reshape the buyer mix and multiple.
    diligencePath: Ask for a management cohort table showing GMV, MAU, repeat rates, and contribution margin by core Ably, 4910, Amood, and non-fashion categories.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: material
    topic: seller-economics
    missingEvidence: Publicly auditable seller count, take-rate, Ably Pay attach-rate, and seller-retention metrics by segment.
    whyItMatters: Ably’s market position depends on whether seller tooling and payments deepen monetization or merely support top-line GMV without durable take-rate expansion.
    diligencePath: Request seller-cohort data covering active sellers, gross and net take rate, payments penetration, and retention for core Ably, Partners sellers, and Amood exporters.
    relatedQuestionRefs:
    - QM025
