callouts:
- calloutType: insight
  title: ABLY is increasingly a multi-segment style-commerce stack, not only a women’s-fashion app
  body: 'Public evidence now shows ABLY operating across at least three demand paths: its core women’s-fashion app, the men’s wedge 4910, and the Japan export channel Amood. That matters because ABLY’s market opportunity is widening through adjacent categories, payments, and seller tooling even though no public source cleanly discloses the exact mix each segment contributes.'
  claimRefs:
  - CM014
  - CM027
  - CM032
  - CM036
- calloutType: risk
  title: The biggest unresolved question is denominator quality, not numerator growth
  body: ABLY’s GMV, MAU, and segment-expansion numbers are strong, but public sources still do not isolate a clean women’s-fashion-platform TAM, nor do they disclose seller count, take rate, or payments attachment by segment. That means valuation debates can be driven as much by market-definition choice and monetization disclosure quality as by ABLY’s headline growth.
  claimRefs:
