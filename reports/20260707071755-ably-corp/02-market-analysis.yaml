- id: FM001
  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: Public market sizing for ABLY narrows from Korea-wide e-commerce totals to fashion-industry output and then to disclosed specialty-platform transaction volumes.
  data:
    items:
    - label: Broad Korean e-commerce ceiling
      value: KRW 242T (2024)
      detail: WPIC market-wide e-commerce estimate for South Korea
    - label: Broader Korean fashion-industry output
      value: KRW 52.2T (2026 proj.)
      detail: Aju Press / KCCI industry-output projection
    - label: ABLY disclosed transaction scale
      value: KRW 2.8T (2025)
      detail: DigitalToday summary of company-reported 2025 transaction volume
    - label: Disclosed premium-peer floor
      value: KRW 1T+ (29CM, 2025)
      detail: The Asia Business Daily summary of 29CM GMV threshold
  approximationNotes: 'This is a constrained layering of different public lenses rather than a true TAM/SAM/SOM stack: the top layer is broad e-commerce, the second layer is overall fashion-industry output, and the bottom layers are company-scale transaction observations. The figure is meant to bracket ABLY’s arena, not to imply clean additivity.'
