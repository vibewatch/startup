- id: evidence-constrained-sizing-lenses
  title: Evidence-constrained sizing lenses
  body: 'No fetched source cleanly publishes a Korea women’s-fashion-platform TAM, SAM, and SOM sequence for ABLY, so this chapter preserves multiple public lenses instead of pretending they are interchangeable. At the broad end are Trade.gov’s roughly $200 billion 2025 e-commerce estimate and WPIC’s KRW 242 trillion 2024 total. A narrower but still imperfect upper bound is the Korea fashion industry itself, with Aju Press reporting KRW 51.8 trillion of projected 2025 output and KRW 52.2 trillion for 2026. Below that sit disclosed platform-scale observations: Musinsa at roughly KRW 4.5 trillion of 2024 GMV, ABLY at roughly KRW 2.5 trillion in 2024 and KRW 2.8 trillion in 2025, and 29CM above KRW 1 trillion. Those numbers are useful because they show the practical size of leading fashion destinations, but they are company or platform outputs, not a unified market denominator. The core conclusion is that ABLY is already large relative to specialty peers, yet the exact size of the addressable
    women’s-platform segment remains a diligence gap rather than a solved public fact.'
