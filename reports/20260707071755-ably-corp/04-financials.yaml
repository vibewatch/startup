  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - 2024 GMV
        - KRW 2.5tn
        - medium
        - Shows the scale of throughput behind the 2024 revenue split
        - Request monthly GMV by category and attach revenue by lane
      - - 2025 GMV
        - KRW 2.8tn
        - medium
        - Shows continued activity growth even as the company narrowed losses
        - Request GMV bridge from repeat buyers, new buyers, and adjacent apps
      - - 2025 operating cash flow
        - KRW 15.05bn
        - medium
        - Best public signal that operations generated cash during 2025
        - Request monthly cash-flow bridge and one-off working-capital effects
      - - 2025 cash and equivalents
        - KRW 100bn
        - medium
        - Provides a treasury snapshot relevant to near-term capital adequacy
        - Request unrestricted cash, minimum cash needs, and post-year-end cash changes
      - - Gross margin
        - null
        - low
        - Core test of whether service and product revenue are attractive after delivery and support costs
        - Request gross margin by service revenue, product revenue, and new business
      - - CAC / payback
        - null
        - low
        - Determines whether promo-heavy growth is self-funding or capital consuming
        - Request paid and blended CAC, first-order loss, and payback by app
      - - Burn / runway
        - null
        - low
        - Required to judge whether current cash covers the current growth plan
        - Request monthly burn, runway, and management downside plan
      - - New-business traction proxy
        - 4910 MAU 3.4m; Amood downloads 6.5m; sellers 25,000+
        - medium
        - Indicates adjacent surfaces may justify reinvestment despite current opacity on margin
        - Request app-level revenue, contribution margin, and retention data
    notes: The table intentionally mixes disclosed metrics with null placeholders because the underwriting problem is the gap between visible scale and hidden economics.
