  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer lane
      - Public price / unit / contract signal
      - List vs. realized pricing
      - Unknowns
      - Source
    rows:
      - - ABLY shopper app
        - Free shipping, 30% new-member coupon pack, level coupons, daily discounts
        - Only list-level buyer incentives are public
        - Seller take rate, shipping subsidy burden, and realized monetization after discounts
        - Official ABLY app listing and homepage
      - - 4910 shopper app
        - Up to 33% coupon pack and free shipping at launch-stage positioning
        - Consumer incentives are public; platform economics are not
        - Net promo cost, paid-marketing support, and repeat-purchase payback
        - Official 4910 app listing
      - - Seller-management tooling
        - Seller order management, inquiry management, and mobile marketing functions are public
        - Capability is public; price card is not
        - Whether seller tooling is bundled, upsold, or monetized indirectly through GMV
        - Seller-management app listing
      - - Service-revenue lane
        - Company-linked reporting says platform transaction fees drive service revenue growth
        - Revenue line is disclosed; fee schedule is not
        - Category-level take rate, commission dispersion, and refund/chargeback effects
        - Wowtale and DigitalToday reporting on audit results
      - - Product-revenue lane
        - Company-linked reporting links product revenue to fulfillment and partner solutions
        - Revenue line is disclosed; unit pricing is not
        - Gross margin, inventory/working-capital exposure, and service-level economics
        - Wowtale and The Pickool reporting on audit results
    notes: Public pricing evidence is strongest on buyer-facing incentives and weakest on seller take rates, realized revenue retention, and contract structure.
    enumerationScope:
      coverage: partial
      basis: The rows summarize the monetization signals that are directly observable in retained official and independent sources while marking realized pricing as unknown.
