  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing-visibility
      missingEvidence: ABLY's realized take rate, revenue-recognition policy, discount leakage, and shipping-subsidy burden by revenue lane.
      whyItMatters: Public GMV and revenue do not reveal whether growth is structurally profitable after incentives and refunds.
      diligencePath: Request audited revenue-recognition memo, category-level commission schedules, refund policy economics, and net shipping-cost bridge.
      relatedQuestionRefs:
        - QI004
      relatedTableRefs:
        - TI002
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: CAC, promo payback, sales cycle, and contribution margin by core app, 4910, and Amood.
      whyItMatters: Fast user and GMV growth can still destroy value if the company is buying growth with uneconomic incentives.
      diligencePath: Request acquisition funnel metrics, paid-media attribution, first-order loss, repeat-purchase curves, and app-level contribution margins.
      relatedQuestionRefs:
        - QI011
      relatedTableRefs:
        - TI003
    - type: private-evidence-only
      severity: blocking
      topic: liquidity
      missingEvidence: Current burn, runway, unrestricted cash, debt schedule, covenants, and any off-balance-sheet obligations.
      whyItMatters: One year-end cash snapshot cannot establish downside resilience or the need for another financing round.
      diligencePath: Obtain monthly treasury reporting, debt documents, covenant package, board liquidity thresholds, and downside runway scenarios.
      relatedQuestionRefs:
        - QI020
        - QI021
      relatedTableRefs:
        - TI004
    - type: missing-source
      severity: material
      topic: follow-on-financing
      missingEvidence: Independent confirmation of whether the planned additional KRW 100 billion financing discussed after the Alibaba round actually closed.
      whyItMatters: The answer changes whether ABLY's expansion plan is being funded by internal cash generation alone or by additional outside capital.
      diligencePath: Request updated cap table, financing history after December 2024, and any board materials describing active fundraising.
      relatedQuestionRefs:
        - QI019
      relatedTableRefs:
        - TI004
    - type: private-evidence-only
      severity: material
      topic: gross-margin-and-working-capital
      missingEvidence: Gross margin by service versus product revenue, returns rate, seller concentration, and payable / inventory timing.
      whyItMatters: Revenue quality depends on whether growth is concentrated, cash-conversion friendly, and resilient after fulfillment and returns costs.
      diligencePath: Request audited segment gross-margin bridge, top-seller concentration data, return-rate history, and working-capital bridge.
      relatedQuestionRefs:
        - QI013
        - QI022
      relatedTableRefs:
        - TI003
        - TI005
    - type: private-evidence-only
      severity: material
      topic: diligence-path
      missingEvidence: Stand-alone P&Ls and unit-economics packs for 4910, Amood, fintech, beauty, and offline initiatives.
      whyItMatters: The public record shows these adjacencies are strategically important, but not whether they are accretive or a drag on the core platform.
      diligencePath: Request management reporting by business line, including revenue, contribution margin, cash burn, and cohort retention.
      relatedQuestionRefs:
        - QI026
      relatedTableRefs:
        - TI001
        - TI005
