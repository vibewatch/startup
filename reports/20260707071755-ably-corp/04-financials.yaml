tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Revenue stream
      - Mechanism
      - Unit
      - Current value / status
      - Revenue quality
      - Diligence ask
    rows:
      - - Core ABLY marketplace service revenue
        - Platform transaction fees tied to shopper orders across fashion, beauty, and lifestyle
        - GMV-linked service revenue
        - 2024 service revenue KRW 189.1bn; 2025 service revenue KRW 227.3bn
        - Strongest visible lane because it scales with marketplace activity, but realized take rate is undisclosed
        - Request seller take rate, category mix, and net shipping-adjusted contribution margin
      - - Partners / fulfillment product revenue
        - Fulfillment and partner-solution operations supporting sourcing, logistics, and seller enablement
        - Product revenue tied to operational services
        - 2024 product revenue KRW 145.1bn; 2025 product revenue KRW 142.3bn
        - Real but operationally heavier than fee revenue, so margin profile may be lower or more variable
        - Request gross margin by fulfillment cohort and working-capital needs per seller segment
      - - Seller tooling and marketing services
        - Order management, inquiry handling, history tracking, and mobile marketing for sellers
        - Seller workflow / service bundle
        - Officially visible in market-management app; monetization terms undisclosed
        - Potentially sticky if embedded in seller workflow, but current price realization is unknown
        - Request attach rate, fee schedule, and share of sellers using paid marketing functions
      - - 4910 male-fashion monetization
        - New app uses AI recommendations, coupons, and free shipping to grow buyer activity and brand penetration
        - GMV- and promo-linked commerce revenue
        - Large user growth and rising transaction volume; no separate revenue disclosure
        - Attractive if it scales repeat demand, but likely promotion-intensive during expansion
        - Request 4910 stand-alone revenue, promo spend, and cohort repeat rate
      - - Amood cross-border seller services
        - One-stop export support for translation, customs, logistics, CS, and Japanese demand generation
        - Export-linked transaction and service revenue
        - Seller base exceeded 25,000 and downloads exceeded 6.5m; no separate revenue disclosure
        - Strategic because it expands TAM and seller monetization, but cost-to-serve is likely meaningful
        - Request Japan GMV, export take rate, logistics cost per order, and seller retention
    notes: Public sources establish the existence of these monetization lanes, but not their realized mix, take rates, or margin contribution.
    enumerationScope:
      coverage: partial
      basis: This table captures the major monetization lanes explicitly visible in retained official and independent sources rather than every internal SKU or commercial contract.
