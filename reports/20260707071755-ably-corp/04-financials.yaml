slug: ably-corp
runDate: '2026-07-07'
company:
  name: Ably Corp.
chapter:
  number: 4
  title: Financials
  summary: >-
    ABLY's public financial picture is unusually legible for a private fashion platform on top-line scale and capital
    access, but still under-specified on realized economics. Retained sources support a blended model of service revenue
    from marketplace transactions and product revenue from seller/fulfillment solutions, with 2024 revenue of about KRW
    334.3 billion, 2025 revenue of KRW 369.7 billion, positive 2025 operating cash flow, and about KRW 100 billion of
    year-end cash. They do not disclose realized take rate, gross margin, CAC, burn, runway, debt, or customer
    concentration, so the underwriting conclusion is favorable on demand and directional liquidity but incomplete on
    margin quality and capital efficiency.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing visibility
    body: |-
      ABLY is not publicly legible as a pure software subscription company, and it is not simply a single-app retailer either. The retained official surfaces describe a style-commerce platform that serves both shoppers and sellers, while seller tooling and fulfillment materials show that the company also monetizes operational enablement. That interpretation is reinforced by the 2024 and 2025 financial reporting coverage: revenue is explicitly split between service revenue tied mainly to platform transactions and product revenue tied to fulfillment and partner solutions. In other words, the company appears to turn shopper activity into platform fees while also taking a more operational role in sourcing, logistics, and seller support.

      What remains opaque is realized pricing quality. Public consumer surfaces show aggressive list-level incentives such as free shipping, coupon packs, and daily promotions across ABLY and 4910, but they do not reveal the seller take rate, the amount of discount leakage, net shipping economics, or any revenue-recognition detail. So the public record is strong enough to explain how ABLY can make money, but not strong enough to tell an investor how much of each won of GMV becomes durable gross profit.
