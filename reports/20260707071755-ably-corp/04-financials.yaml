  - id: TI004
    title: Capital adequacy table
    columns:
      - Capital item
      - Public value / status
      - Readthrough
      - Next-round trigger / obligation view
      - Diligence ask
    rows:
      - - Latest confirmed primary financing
        - Alibaba invested KRW 100bn in Dec 2024 for about a 5% stake
        - Confirms external capital access from a strategic investor
        - No public trigger disclosed beyond growth and global expansion ambitions
        - Request closing documents, investor rights, and use-of-proceeds schedule
      - - Implied valuation
        - About KRW 3tn / $2.1bn
        - Helpful for valuation context, but not evidence of current cash sufficiency
        - Valuation alone does not reveal runway or cost of capital
        - Request cap-table update and valuation terms versus operating plan
      - - Planned follow-on financing
        - Additional KRW 100bn was discussed publicly in Dec 2024 but not later confirmed
        - Suggests management wanted extra strategic flexibility or growth capital
        - Unclear whether absence of confirmation reflects no raise, quiet close, or changed plan
        - Request status of follow-on process and whether need still exists
      - - 2025 year-end cash on hand
        - About KRW 100bn cash and cash equivalents
        - Positive treasury snapshot and not a distress signal by itself
        - Insufficient alone to infer runway without burn and debt data
        - Request unrestricted cash, escrowed balances, and board liquidity thresholds
      - - 2025 operating cash flow
        - KRW 15.05bn positive
        - Indicates cash generation in the reported year
        - Does not rule out future burn from aggressive expansion or seasonal working-capital swings
        - Request quarterly OCF bridge and capex / inventory / payable dynamics
      - - Debt / project-finance obligations
        - No retained public disclosure
        - Largest remaining blind spot in capital-adequacy underwriting
        - Hidden debt, guarantees, or vendor financing could change runway materially
        - Request debt schedule, covenants, guarantees, and off-balance-sheet commitments
    notes: Company Overview should own the full funding chronology; this table isolates the forward capital facts needed for liquidity and financing judgment.
    claimRefs:
      - CI031
      - CI033
      - CI034
      - CI035
      - CI036
      - CI037
      - CI038
  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing private metric
      - Impact on underwriting
      - Exact diligence path
    rows:
      - - Realized take rate and revenue-recognition policy
        - Without it, investors cannot convert GMV or shopper incentives into net revenue quality
        - Obtain category-level commission schedules, revenue-recognition memo, and discount / refund treatment
      - - Gross margin by service versus product revenue
        - Without it, the market cannot judge whether fulfillment growth helps or dilutes earnings quality
        - Request audited segment gross-margin bridge and COGS composition by lane
      - - CAC, sales efficiency, and promo payback
        - Without it, 4910 and core-app growth could be value destructive even if GMV rises
        - Request acquisition funnel, coupon spend, paid-media attribution, and payback by app cohort
      - - Burn, runway, and debt obligations
        - Without it, year-end cash cannot be translated into survival months or downside resilience
        - Request monthly treasury report, debt schedule, covenant pack, and downside runway scenario
      - - Working-capital, returns, and seller concentration
        - Without it, public revenue and OCF may overstate durability if cash conversion is volatile
        - Request returns rate, payable timing, top-seller concentration, and fulfillment inventory assumptions
      - - Follow-on financing status after Alibaba round
        - Without it, investors cannot tell whether management still expects external growth capital
        - Request board materials, fundraising pipeline, and post-2025 cap-table changes
    notes: These are the minimum missing data points that prevent a full underwriting view even though top-line and treasury proxies are publicly visible.
    enumerationScope:
      coverage: exhaustive
      basis: This table enumerates the specific public-information gaps that block financial underwriting of ABLY based on the retained source set used in this chapter.
    claimRefs:
      - CI015
      - CI036
      - CI037
      - CI038
      - CI046
