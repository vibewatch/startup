  - id: traction-and-unit-economics-proxies
    title: Traction and unit-economics proxies
    body: |-
      Public traction is the strongest part of ABLY's financial case. Independent coverage and the homepage converge on core-platform scale: more than 10 million monthly users, annual GMV above KRW 2 trillion, and broad user engagement. The adjacent apps are no longer trivial experiments either. 4910 moved from beta to full launch, posted very rapid user growth, and roughly doubled monthly users within 2025, while Amood crossed 6.5 million cumulative downloads in Japan and expanded its seller/export network. Those facts matter financially because they imply that ABLY is not relying on one aging domestic women’s-fashion surface to defend its top line.

      But these are still throughput proxies, not clean unit economics. The retained set gives GMV, MAU, downloads, service revenue, product revenue, operating cash flow, and cash balance. It does not give gross margin, contribution margin per order, CAC, payback, returns rate, inventory risk, or cohort behavior by seller and buyer segment. The right investor takeaway is therefore “observable scale with hidden conversion mechanics”: there is plenty of evidence that activity is real, but not enough to know how efficiently activity converts into long-duration earnings.
    claimRefs:
