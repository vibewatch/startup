  - id: capital-adequacy-and-financing
    title: Capital adequacy and financing dependency
    body: |-
      Company Overview should own the full round chronology, but Financials still has to answer the forward question: does the public record suggest ABLY is adequately capitalized for its current plan? The answer is directionally yes, but not conclusively. The latest clearly confirmed round is the December 2024 Alibaba investment of KRW 100 billion for roughly a 5% stake at an implied valuation around KRW 3 trillion. By year-end 2025, the company also reported about KRW 100 billion of cash and cash equivalents and positive operating cash flow of KRW 15.05 billion. Those facts make it difficult to argue that ABLY was in immediate funding distress at that point.

      The limitation is that investors still cannot underwrite treasury sufficiency. Public sources mention a planned additional KRW 100 billion raise after the Alibaba round, but the retained 2025-2026 set does not confirm that the follow-on closed. Nor does the public record disclose burn, runway, debt, covenant burden, payables pressure, or customer concentration. So the right framing is not “capital shortage proven”; it is “capital adequacy plausible but still unverified beyond cash snapshot and one year of positive operating cash generation.”
    claimRefs:
      - CI029
