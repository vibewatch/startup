- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Recommendation and preference-data layer
    - Uses purchase history, likes, reviews, and other behavior data to personalize multiple shopper surfaces
    - Large-scale first-party data collection and model iteration
    - Weak public model-governance disclosure despite centrality to product differentiation
  - - Consumer app experience layer
    - ABLY and 4910 blend recommendations, promotions, content, and community-style interaction
    - App performance, permissions, and merchandising logic
    - Public evidence shows features but not uptime, experimentation guardrails, or abuse controls
  - - Seller operating console
    - Order management, inquiry management, history, push alerts, and mobile marketing for merchants
    - Seller-app adoption and mobile support reliability
    - No public adoption, churn, or response-time metrics
  - - Partners and fulfillment layer
    - ABLY handles sourcing, logistics, shipping, CS, and parts of merchant onboarding
    - Physical fulfillment capacity, supplier management, and CX staffing
    - Operational bottlenecks can degrade both supply growth and buyer satisfaction
  - - Payment rail
    - Ably Pay internalizes checkout and transaction data
    - Regulatory compliance, fraud controls, and payment-system uptime
    - Public payment growth exists, but control quality and loss rates do not
  - - Cross-border export pipeline
    - Amood plus Seongsu facilities route Korean seller inventory into Japan with translation and customs support
    - Fulfillment hub, customs process, localization, and support vendors
    - Japan growth can stall if any logistics or support link weakens
  notes: This is an operating architecture table built from retained public descriptions, not a software-stack inventory; the public stack, hosting, and incident surfaces remain missing.
