  evidenceGaps:
  - type: missing-source
    severity: material
    topic: docs-gap
    missingEvidence: Public engineering stack details, API or integration docs, a status page, security certifications, and incident history for ABLY, 4910, Amood, and seller tooling.
    whyItMatters: Without these artifacts, investors cannot independently judge service reliability, integration burden, or engineering maturity behind the product breadth.
    diligencePath: Request architecture diagrams, public/private integration docs, uptime history, certification inventory, and the internal owner for operational readiness.
    relatedQuestionRefs:
    - QE019
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: privacy-enforcement
    missingEvidence: Model-governance controls, consent logging, retention windows, data-sharing maps, subprocessors, and any privacy-impact reviews for recommendation and gifting flows.
    whyItMatters: ABLY’s differentiation relies on preference data, so weak privacy or governance controls could become a direct product and reputational risk.
    diligencePath: Request privacy-by-design documentation, DPIA or equivalent reviews, retention schedules, third-party data-sharing inventory, and the escalation process for regulator inquiries.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: access-blocked
    severity: material
    topic: access-gap
    missingEvidence: Readable independent coverage for current Amood GMV and exporter-growth claims from the blocked 2026 Sedaily URLs or equivalent alternative outlets.
    whyItMatters: The Japan expansion story is central to ABLY’s product breadth, but blocked corroboration leaves some current traction claims under-verified.
    diligencePath: Re-fetch the blocked URLs directly or replace them with another independent source that discloses Japan GMV, seller growth, or repeat-customer evidence.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: blocking
    topic: technical-underwrite
    missingEvidence: Service-level objectives, experiment-governance rules, seller-tool adoption metrics, payment-fraud metrics, and module-level contribution economics.
    whyItMatters: Product breadth is visible, but technical durability cannot be underwritten until operating reliability and module economics are observable.
    diligencePath: Request the product review deck that covers reliability KPIs, release cadence, seller-tool penetration, payment risk, and app-level or module-level economics.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE004
    - TE005
