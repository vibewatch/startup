- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / signal
  - Current status
  - Scope
  - Gap
  rows:
  - - Consumer-app permission disclosure
    - Visible on ABLY and 4910 Play listings
    - Device history, camera/storage, notifications, and contacts in ABLY for gifting/points
    - No public permission-justification or minimization narrative beyond listing text
  - - Seller-app data safety
    - Visible on seller Play listing
    - Personal info and device IDs collected; some sharing with third parties; encryption in transit; deletion requests available
    - No public retention schedule, subprocessors, or security-certification detail
  - - Refund and cancellation rights
    - Defined by Korea FTC policy materials
    - Applies to order fulfillment, cancellation timing, and consumer redress
    - Public ABLY sources do not explain implementation detail or exception handling
  - - Dark-pattern compliance
    - 2025 legal update raised obligations
    - Hidden renewals, gradual cost disclosure, pre-selected options, false hierarchy, and cancellation obstruction
    - No public statement shows ABLYs internal audit or monitoring approach
  - - Review and ranking disclosure
    - 2026 proposal would tighten disclosure rules and penalties
    - Touches paid ranking, review display, and marketplace transparency
    - No public moderation or ranking-governance documentation
  - - Privacy-enforcement climate
    - PIPC remains active on cross-border data issues in 2026
    - Relevant to recommendation-heavy, data-rich commerce products
    - No public ABLY data-governance or cross-border-transfer policy in retained set
  notes: This table separates visible product-control signals from the larger governance gaps that still require management or data-room evidence.
