- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow pain
  - ABLY solution
  - Measurable benefit
  - Limitation
  rows:
  - - Find relevant style items quickly
    - Catalog sprawl and price-only comparison slow discovery
    - ABLY personalizes feed, search, PDP, cart, and category recommendations
    - 10m+ MAU and long usage time imply the loop is sticky at scale
    - No public precision/recall or conversion-lift benchmarks
  - - Browse and engage beyond a one-off purchase
    - Transactional shopping apps often lose users after checkout
    - ABLY layers editor content, community, AI chat, and AI profile features into the session
    - 660m monthly launches and long average usage time
    - No disclosed retention split between commerce and content users
  - - Manage market operations on mobile
    - Sellers need to watch orders and customer inquiries in real time
    - Able Market Management centralizes orders, inquiries, history, and push notifications
    - Operational visibility is mobile-first rather than desktop-only
    - Public sources do not show seller adoption or response-time outcomes
  - - Launch a new seller business with low ops burden
    - Sourcing, logistics, shipping, and CS are heavy entry barriers
    - Partners absorbs operational tasks so sellers can start and run a market more easily
    - Expanded supply can improve assortment breadth
    - No public disclosure of seller take rates or service-level commitments
  - - Sell into Japan without building foreign ops
    - Translation, customs, logistics, and marketing are hard for small Korean sellers
    - Amood plus the export pipeline offers one-click overseas sales linkage and managed operations
    - 25k+ markets, SKU growth, and repeat-buyer growth show practical use
    - Public sources do not give export defect rate or unit economics
  - - Check out faster and stay within the ecosystem
    - Third-party checkout adds friction and weakens data capture
    - Ably Pay brings payment into the company’s own stack
    - 4.7x transaction-volume growth after launch
    - No public evidence on authorization rates, chargebacks, or fraud stack
  notes: Benefits are stated only where the retained source set gives either usage evidence or direct product-description support; unit economics and SLA outcomes remain undisclosed.
