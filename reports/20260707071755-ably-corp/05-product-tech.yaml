- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Current status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - ABLY flagship app
    - Mainstream Korean shoppers across fashion, beauty, and lifestyle
    - Scaled flagship; 10.05m+ MAU and heavy session frequency
    - Cross-category AI recommendation plus content/community loops
    - Need retention, conversion-lift, and category-level take-rate data
  - - 4910 app
    - Male-oriented fashion shoppers
    - Scaled adjacency; launched late 2023 and reached multimillion MAU in 2025
    - Men-first recommendation, ranking, and sports/brand rails
    - Need repeat rate, gross margin, and overlap vs core ABLY cohorts
  - - Amood app
    - Japanese buyers and Korean exporting sellers
    - Scaled international channel; 6.5m cumulative downloads and 25k+ markets
    - One-stop Japan export bridge that couples demand with seller enablement
    - Need Japan GMV, return rate, and contribution margin
  - - Able Market Management
    - ABLY sellers and operators
    - Live production utility on mobile
    - Order/inquiry workflow, push alerts, and mobile marketing in one app
    - Need seller adoption, DAU, and paid-attach visibility
  - - Partners / chain-platform operations
    - Would-be and current sellers
    - Monetized operating layer visible in reported product revenue
    - ABLY absorbs sourcing, logistics, shipping, CS, and export support
    - Need cost-to-serve, SLA, and seller-side NPS
  - - Ably Pay
    - Shoppers at checkout
    - Rapidly scaled internal payment rail in 2025
    - Adds checkout control and closed-loop transaction data
    - Need payment share, fraud losses, and BNPL or wallet roadmap detail
  notes: Rows summarize the product modules that are publicly legible today; the missing fields are mostly economics, reliability, and adoption granularity rather than module existence.
