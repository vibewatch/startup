evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: >-
      Current board composition, voting control, debt facilities, and any investor protective provisions after the
      Alibaba round.
    whyItMatters: >-
      Governance concentration and financing overhang materially affect downside protection, follow-on dilution, and
      strategic optionality.
    diligencePath: >-
      Request the latest cap table, board observer/seat schedule, debt schedule, and financing documents from
      management.
    relatedQuestionRefs:
      - QO011
      - QO023
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: follow-on-fundraising-status
    missingEvidence: >-
      Whether the additional 100 billion won post-Alibaba fundraising actually closed, on what terms, and whether any
      secondary sales occurred.
    whyItMatters: >-
      Round completion and structure change cash runway, dilution, signal quality, and how seriously investors should
      read the 3 trillion won valuation headline.
    diligencePath: >-
      Ask management for closed-round announcements, subscription documents, and an updated cash balance bridge after
      December 2024.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: workforce-disclosure
    missingEvidence: Current headcount, functional split, office footprint, and hiring or attrition trends by major geography.
    whyItMatters: >-
      People-cost intensity and execution bandwidth are critical for judging the durability of new-business expansion
      into payments, menswear, and Japan.
    diligencePath: Request an org chart, payroll summary, and active headcount by function and location as of the latest month-end.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: active-customer-disclosure
    missingEvidence: A disclosed active buyer, seller, or paying-account count that is more decision-useful than app MAU.
    whyItMatters: MAU alone does not reveal conversion quality, monetized accounts, or seller density across Ably, 4910, and Amood.
    diligencePath: >-
      Ask for active buyers, active sellers, order frequency, and monetized-account counts by platform for the last four
      quarters.
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology coverage
    missingEvidence: >-
      A fully exhaustive, dated chronology covering every product, financing, governance, partnership, and adverse event
      across all Ably business lines.
    whyItMatters: >-
      The milestone table is intentionally selective, so omitted events could still affect how investors interpret
      execution consistency or timing.
    diligencePath: >-
      Request a management-prepared corporate timeline cross-checked to board decks, financing documents, and product
      launch logs.
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: women-fashion-platform-sizing
    missingEvidence: >-
      A public study that separates Korea women’s-fashion-platform TAM, SAM, and SOM from total e-commerce, total
      fashion-industry output, and company-specific GMV disclosures.
    whyItMatters: >-
      Without a clean market denominator, Ably can be framed as either a tiny slice of Korea retail or a leading share
      of a much narrower women’s-platform segment, which changes valuation framing.
    diligencePath: >-
      Request management’s internal category tree, third-party app-intelligence share studies, and merchant or buyer
      cohort breakouts that isolate women’s fashion commerce from adjacent categories.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: business-mix
    missingEvidence: >-
      Segment-level GMV, revenue, and user mix for beauty, lifestyle, 4910, and Amood relative to the core
      women’s-fashion app.
    whyItMatters: >-
      Public disclosures confirm adjacency expansion, but not whether those adjacencies are still exploratory or already
      material enough to reshape the buyer mix and multiple.
    diligencePath: >-
      Ask for a management cohort table showing GMV, MAU, repeat rates, and contribution margin by core Ably, 4910,
      Amood, and non-fashion categories.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: seller-economics
    missingEvidence: Publicly auditable seller count, take-rate, Ably Pay attach-rate, and seller-retention metrics by segment.
    whyItMatters: >-
      Ably’s market position depends on whether seller tooling and payments deepen monetization or merely support
      top-line GMV without durable take-rate expansion.
    diligencePath: >-
      Request seller-cohort data covering active sellers, gross and net take rate, payments penetration, and retention
      for core Ably, Partners sellers, and Amood exporters.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: merchant-monetization
    missingEvidence: >-
      Current merchant commission schedules, ad rates, and subsidy-sharing terms across Ably, Zigzag, 29CM, W Concept,
      and Musinsa.
    whyItMatters: >-
      Without realized take rates and promotion funding splits, public pricing signals cannot tell whether Ably has
      pricing power or is simply buying growth.
    diligencePath: Request seller contracts, blended take-rate bridges, and discount-funding waterfalls by platform and by category.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: Cohort retention, repeat purchase, multi-homing share, and seller churn data by platform and by category.
    whyItMatters: >-
      MAU and GMV prove reach, but they do not prove that buyers or sellers are locked in strongly enough to defend
      margins against Musinsa, Shein, Coupang, or Zigzag.
    diligencePath: >-
      Request cohort tables, wallet-share studies, seller churn by acquisition cohort, and win-loss data for overlapping
      brands.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: material
