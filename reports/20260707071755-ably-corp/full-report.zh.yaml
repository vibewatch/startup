  customerFocus: 韩国时尚购物者，尤其是以手机为主的年轻消费者；也包括需要发现流量、运营能力和跨境赋能的卖家、精品店与合作商户。
  businessModel: 市场平台与电商平台变现，建立在商品和服务收入、卖家赋能、推荐驱动的需求聚合，以及金融科技和国际扩张等较新的相邻押注之上。
