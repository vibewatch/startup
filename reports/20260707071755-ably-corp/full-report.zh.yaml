        - 已规模化旗舰；MAU 10.05m+，会话频率高
        - 跨品类 AI 推荐，加上内容 / 社区循环
        - 需要留存、转化提升和分品类抽佣率数据
      - - 4910 应用
        - 男性向时尚消费者
        - 已规模化相邻业务；2023 年底上线，2025 年达到数百万 MAU
        - 男性向推荐、榜单和运动 / 品牌路径
        - 需要复购率、毛利率，以及与 ABLY 核心用户群的重叠度
      - - Amood 应用
        - 日本买家和韩国出口卖家
        - 已规模化国际渠道；累计下载 6.5m，店铺 25k+
        - 一站式日本出口桥梁，把需求和卖家赋能接起来
        - 需要日本 GMV、退货率和贡献毛利
