        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              从高层看，ABLY 的收入质量公开案例有吸引力，但还不能在细节层面承做。正面因素很实在：多年 GMV 增长、2024 和 2025 年收入创纪录、明确的服务收入与商品收入拆分、相邻应用牵引力、有意义的 2024
              年 12 月一级融资轮，以及 2025 年正经营现金流。这些事实让 ABLY 更像一个已有规模、具备真实变现和资本渠道的电商平台，而不是仍处实验阶段的创业公司。


              阻断项不是需求，而是需求如何转化为耐久利润率和自筹式增长的能见度。投资人仍缺少已披露抽佣率、毛利率、退货行为、CAC、回本期、现金消耗、续航期、债务、营运资本动态和客户集中度。竞争与监管压力提高了这些隐藏变量变重要的概率。实务尽调立场因此应是：看好规模和市场位置，对方向性流动性持建设性态度，但在管理层提供利润率结构、现金需求和新业务经济性的数据室
