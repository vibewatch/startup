      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              主要采用驱动来自结构，而不是周期。韩国已经是移动优先电商市场；购物者习惯快速履约、集成支付和高频应用
              互动。公开报道还显示，年轻消费者越来越偏好平台原生时尚品牌，而非百货商店既有品牌，这解释了为什么即便更广时尚市场增长缓慢，ABLY 及同行仍能增长。ABLY
              近期业绩强化了这种模式：其交易额增速超过更广的线上购物板块，自有支付产品快速放大，日本扩张也为卖家创造了出口路径。约束同样真实。中国低价进入者正在用价格训练购物者，并压缩平台差异化；韩国本土合规规则现在覆盖暗黑模式、评价披露，并最终覆盖大型外国运营商的国内代理人义务；PIPA
              相关数据规则又给跨境或数据密集型电商模型增加一层执行复杂度。合在一起，这些约束意味着 ABLY 的市场有吸引力，但它不是一个无摩擦的赢家通吃品类。
