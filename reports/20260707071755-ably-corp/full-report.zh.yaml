  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价能见度
        blocks:
          - type: paragraph
            body: >-
              从公开材料看，ABLY 不是纯软件订阅公司，也不是简单的单应用零售商。保留下来的官方触点描述的是一个同时服务购物者和卖家的风格电商平台；卖家工具和履约材料则显示，公司也通过运营赋能变现。2024 年和 2025
              年财务报道进一步强化了这个判断：收入被明确拆分为主要与平台交易挂钩的服务收入，以及与履约和合作伙伴解决方案挂钩的商品收入。换句话说，公司似乎把购物者活动转化为平台费用，同时在选品、物流和卖家支持中承担更重的运营角色。


              仍然不透明的是实际定价质量。公开消费者触点显示，ABLY 和 4910
              在清单层面有激进激励，例如包邮、优惠券包和每日促销；但这些材料没有揭示卖家抽佣率、折扣流失金额、净运费经济性或任何收入确认细节。因此，公开记录足以解释 ABLY 如何赚钱，却不足以告诉投资人每一 won GMV
              中有多少会变成耐久毛利。
