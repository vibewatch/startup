      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              公司概览应负责完整轮次时间线，但财务章节仍要回答前瞻问题：公开记录是否显示 ABLY 有足够资本支撑当前计划？答案方向上是肯定的，但并非定论。最新明确确认的轮次是 2024 年 12 月 Alibaba 投资，以
              KRW 100 billion 换约 5% 股权，隐含估值约 KRW 3 trillion。到 2025 年末，公司还报告约 KRW 100 billion 现金及现金等价物，并产生 KRW 15.05
              billion 正经营现金流。这些事实让人很难主张 ABLY 当时处于即时融资压力中。


              限制在于，投资人仍无法承做资金库是否足够。公开来源提到 Alibaba 轮后计划再募 KRW 100 billion，但保留下来的 2025-2026
              年材料没有确认该跟进融资已经完成。公开记录也没有披露现金消耗、续航期、债务、契约负担、应付账款压力或客户集中度。因此，正确表述不是「已证明资本短缺」；而是「资本充足性看起来可信，但除现金快照和一年正经营现金生成外，仍未得到验证」。
