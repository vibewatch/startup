      - number: '8.2'
        title: 公开可比公司与当前倍数缺口
        blocks:
          - type: paragraph
            body: >-
              ABLY 无法与任一单一上市公司完全匹配，因此正确做法是用可比公司区间，而不是错误的一对一类比。Coupang 是最干净的韩国商业参考，因为它是本地上市规模平台且物流强度高；PayPal 重要，因为 Ably
              Pay 是变现上行故事的一部分；Nu 重要，因为市场给快速增长的平台金融科技经济模型更高的当前收入倍数；Adyen 展示了优质支付软件能拿到的溢价上沿。留存可比组还纳入 Grab 和 Sea
              作为相邻背景，有助于说明亚洲平台类比存在，即便它们在本轮中不是干净的定价锚。


              这些公开参考给出的区间很宽。当前销售倍数约为 Coupang 1.0x、PayPal 1.2x、Nu 当前收入基数约 6.4x、Adyen 高于 11x。以此区间看，ABLY 的标示估值相当于 2025 年收入约
              8.1x 追踪销售额。ABLY 因而明显高于商业型同业，仍低于最高端的软件型溢价结果。换句话说，如果业务走向更高质量的金融科技和跨境变现，当前价格并不荒谬；但如果 ABLY
              主要仍是促销驱动的商业平台，这个价格显然不保守。
