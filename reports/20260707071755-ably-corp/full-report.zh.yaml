        - 高端品牌护城河或独家库存优势不够明显
      - - W Concept
        - 高端策展时尚与生活方式
        - 2025 年销售额 119.5B won；2026 年盈利承压；Shinsegae 支持
        - 设计师品牌女性和高端生活方式消费者
        - 编辑式呈现、品牌叙事、造型册、高端品牌选品
        - 优惠券和营销强度可能侵蚀高端经济性
      - - 29CM
        - 高端策展与设计师品牌平台
        - 1T+ won GMV 和 1.76M MAU；Musinsa 旗下
        - 高客单价女性，以及家居、生活、儿童和美妆消费者
        - 设计师品牌入驻、更强叙事、高端篮子构成
        - 仍小于 Musinsa，表层运营也偏重促销
      - - Musinsa
        - 时尚既有玩家和生活方式平台
        - 2024 年 GMV ~4.5T won，收入 >1.24T won，营业利润 >100B won
        - 横跨男装、女装、儿童、运动和生活方式的广泛时尚人群
        - 自有品牌、编辑内容、强品牌网络、国际触达
        - 覆盖面更广，削弱了女装焦点的纯度
      - - Coupang 与 Naver 通路
        - 横向替代和发现基础设施
        - WPIC 称 Coupang 和 Naver 合计约占本地线上市场份额 65%
        - 追求速度、搜索或结账便利的大众移动消费者
        - 规模、搜索或发现习惯、配送和上市公司治理
        - 不是专业时尚社区，也不是设计师品牌策展领导者
      - - Shein
        - 全球低价进入者
        - 据报道，2025 年底韩国 MAU 已超过 Zigzag，但仍落后 Ably
        - 价格敏感的女装消费者和趋势驱动的冲动购买者
        - 极致性价比、社交视频拉动、快速趋势周转
        - 监管暴露和本地信任姿态较弱
      - - Shopee 或 Sea
        - 可能进入者或跨境参照物
        - 官方称其为东南亚和台湾最大的泛区域电商平台
        - 如果韩国进一步向区域进口开放，则面向跨境电商买家和卖家
        - 大规模区域物流和电商平台打法
        - 当下看不到本地韩国时尚社区
    notes: 各行混合了当下报道和官方界面，用来呈现形态、规模和定位；私营公司的单位经济性尚无法直接比较。
