      - number: '7.3'
        title: 依赖关系与跨境执行
        blocks:
          - type: paragraph
            body: >-
              ABLY 的依赖画像不只是客户集中度问题。公开记录显示几组相互咬合的依赖：商家持续参与、购物者活跃度健康、4910 和 Amood 等相邻产品表现持续，以及 Alibaba 2024
              年投资带来的信誉背书。没有一个今天单独致命，但叠加起来，公司就依赖许多部件同时运转。Amood 说明上行空间，也说明脆弱性。出口叙事足够真实，值得重视——公开报道提到日本端约 25,000
              个韩国小商家——但这也意味着产品本地化、商家入驻、结算、退货和监管处理都必须跨境跑通。与此同时，公开来源没有披露 ABLY 在云、物流、支付服务商或保险方上的集中度。这一披露缺口重要，因为公司的消费者
              app、卖家运营和支付栈都要经过看不见的交易对手。资本侧形态类似：Alibaba
              轮次仍是重要信号，但公开档案依然没有上市公司式的融资、储备或供应商风险透明度。投资人因此应把依赖风险看作网络问题，而不是单点问题：卖家、交易对手、跨境控制或资本获取任何一处踉跄，都可能很快传导到增长、声誉和融资弹性。
