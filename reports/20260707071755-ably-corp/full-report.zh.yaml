      - number: '1.2'
        title: 领导层、治理与运营模式
        blocks:
          - type: paragraph
            body: >-
              公开领导层材料比增长叙事更薄。已审阅公司页面明确 Kang Seok-hoon 是 CEO，公司位于首尔 Seocho-gu；独立报道则补上了有用的创始人-市场契合度线索：他在 2018 年创办 Ably
              前曾联合创办 Watcha。官方材料还提到一位名为 Haneul 的 CTO，并描述了一套围绕小队与职能团队搭建的独特内部运营模式。Ably
              称，该结构支撑四个战略重点——风格入口、链式平台、全球化和金融科技——这与可见产品组合及新的支付扩张相吻合。文化披露进一步强调灵活办公、强绩效导向，并在 2022
              年废除包干工资制。缺失的信息同样关键：已审阅公开来源没有董事会名单、债务日程表或完整高管梯队。因此，Kang 的关键人依赖仍偏高，外部投资人对治理机制的能见度有限。
