        - KRW 15.05bn 为正
        - 表明报告年度产生了现金
        - 不能排除激进扩张或季节性营运资本波动带来的未来烧钱
        - 索取季度 OCF 桥，以及资本开支 / 库存 / 应付账款动态
      - - 债务 / 项目融资义务
        - 留存公开材料没有披露
        - 资本充足性投资判断中最大的剩余盲点
        - 隐性债务、担保或供应商融资可能实质改变现金跑道
        - 索取债务明细、契约、担保和表外承诺
    notes: 公司概览章节应承载完整融资年表；本表只隔离流动性和融资判断所需的前瞻资本事实。
