      - number: '4.3'
        title: 成本结构、利润率路径与监管负荷
        blocks:
          - type: paragraph
            body: >-
              ABLY 的结构看起来比轻量、纯软件市场平台更偏运营密集。卖家管理应用、履约中心材料和 Amood
              出口文件都指向订单处理、客户服务、物流、翻译、海关和跨境运营中的真实工作。这种运营足迹解释了公司为什么能扩大卖家宽度并改善出口吞吐，但也意味着利润率很可能取决于物流、客服、支付和促销执行，而不只是纯
              平台费用。2024 年公司层面在旗舰平台持续盈利的情况下仍录得经营亏损，这是一个重要线索：ABLY 能从核心活动中产生利润，但集团层面利润率仍对再投资决策和相邻业务扩张成本敏感。


              外部条件也强化了这个判断。韩国仍是移动优先、快速配送的电商市场；2025-2026 年法律更新指向对暗黑模式、评价披露和线上平台义务更紧的监管。再加上 AliExpress、Temu、Shein
              和本土同行竞争，可能的利润率图景是：平台必须持续在促销、服务质量和合规上投入。公开记录支持一条可信的规模路径，但还不支持一条已经披露、干净的毛利率耐久路径。
