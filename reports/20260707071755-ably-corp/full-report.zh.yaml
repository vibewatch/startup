      - number: '1.3'
        title: 资本基础、规模指标与财务表现
        blocks:
          - type: paragraph
            body: >-
              最强的公开资本锚点是 2024 年 12 月 Alibaba 投资。多家媒体在大致经济条件上吻合：100 billion won 换约 5% 股权，隐含估值接近 3 trillion won，并让 Ably
              得到韩国 2024 年首家独角兽创业公司的标签。公开材料还暗示，相比 2022 年 1 月 pre-Series C 轮约 900 billion won 的估值，Ably 已经大幅跃升。Ably
              自有主页目前称累计投资 300 billion won，但已审阅报道不能证明管理层曾讨论的 Alibaba 之后追加融资是否已经完成。经营表现记录更充分。公司相关和独立报道显示，2023 年转盈，2024
              年收入升至约 334 billion won、GMV 达 2.5 trillion won，2025 年收入达到 369.7 billion won、GMV 约 2.8 trillion
              won，同时亏损大幅收窄。2026 年中报道又通过 Ably Pay 和上半年重启增长补上一层动能。
