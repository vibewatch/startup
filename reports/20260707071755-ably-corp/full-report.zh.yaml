  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 明确假设
      - 指示性价值 / 倍数逻辑
      - 概率信号
    rows:
      - - 牛市
        - Ably Pay、4910 和 Amood 持续复利，同时利润率质量改善。
        - 类 Adyen 的 10.1x 至 11.2x 销售额区间，对 2025 年销售额意味着约 KRW 3.7-4.1tn。
        - 需要证明新业务可持续，且质量高于核心电商。
      - - 基准
        - 核心平台保持强势，相邻业务也有帮助，但经济性仍只披露一部分。
        - 类 Nu 的 6.4x 当前收入逻辑到当前 8.1x headline 估值，意味着约 KRW 2.4-3.0tn。
        - 以当前证据看最可能，因为增长真实，但还不到申报级披露。
      - - 熊市
        - 在竞争和监管升高下，市场主要把业务视为促销驱动型电商。
        - 类 Coupang 或 PayPal 的 1.0x 至 1.2x 销售额，只意味着约 KRW 0.37-0.44tn。
        - 若利润率偏弱、增长转软或尽调结果令人失望，就会走向这一情景。
      - - 稍后承销
        - 管理层证明单位经济更好，但投资人拒绝按当前价格进入。
        - 等待更多披露或更便宜的进入价格，而不是今天硬做决定。
        - 如果投资人喜欢公司胜过当前价格，这是最实际的路径。
    notes: 估值输出是情景区间，锚定当前公开可比公司倍数带和 2025 年收入；它们刻意不是 DCF 式精确估算。
