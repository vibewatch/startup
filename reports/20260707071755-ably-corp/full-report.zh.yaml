  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值状态
      - 相关性
      - 局限
    rows:
      - - Coupang
        - 2025 年收入 $34.53bn；2026 年 7 月市值 $34.37bn
        - ~1.0x 销售额
        - 最接近的韩国上市电商平台，兼具物流和交易平台规模。
        - 零售和履约版图比 ABLY 更宽。
      - - PayPal
        - 2025 年收入 $33.17bn；2026 年 7 月市值 $39.77bn
        - ~1.2x 销售额
        - 衡量 Ably Pay 上行空间的最佳公开支付基准。
        - 全球支付处理商，不是时尚交易平台。
      - - Nu Holdings
        - 2025 年全年收入 $6.99bn；当前收入 TTM $10.62bn；2026 年 7 月市值 $68.35bn
        - 按当前收入约 ~6.4x
        - 展示市场愿意为高速增长的平台金融科技经济性付出什么价格。
        - 银行业主导模式和分母敏感性，让它只能作为方向性可比。
      - - Adyen
        - 2025 年收入 2.36bn EUR；2026 年 7 月市值 $31.45bn
        - StockAnalysis 报告 P/S ~11.21x
        - 可作为高端支付软件质量的有用上限。
        - 支付软件经济性远比 ABLY 当前公开材料干净。
      - - Grab / Sea 背景
        - Grab 2025 年收入 $3.37bn；保留 Sea IR
        - 仅作背景，本轮不作为锚点
        - 在同业组里保留亚洲平台视角。
        - 本轮保留结果中，配对市值抓取不完整。
    notes: 本表刻意只做部分覆盖：它抓住最有决策价值的公开可比倍数带，而不是声称给出完整同业表。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows capture the highest-signal public comp bands retained in this run, plus one adjacent Asian-platform context
        row, rather than a full exhaustive peer screen.
