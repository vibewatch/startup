  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代项
        blocks:
          - type: paragraph
            body: >-
              ABLY 不落在整个韩国零售里，甚至也不等同于整个韩国电商；它处在更窄的一层：以时尚为导向的购物者通过移动优先 平台发现、比较并购买风格商品。大天花板仍然很大：Trade.gov 估计韩国电商 2025 年约
              $200 billion、约占零售销售一半；WPIC 则估算 2024 年线上市场约 KRW 242 trillion。但这些总量包含电子产品、外卖、旅游和许多其他品类，不能干净映射到 ABLY
              的买家行为。更相关的相邻边界是韩国更广的时尚产业；Aju Press 称，虽然支出和注意力正转向平台原生品牌，该产业也只是低个位数增长。在这个边界内，主要替代项不只是 Musinsa、Zigzag、29CM 和
              W Concept 等其他时尚应用，还包括传统百货、线下精品店，以及让卖家完全绕过 ABLY、无需搭建品牌化且数据丰富目的地的直接市场平台或社交销售路径。
