            - label: 中-低
              tone: warning
            - label: 产品宽度看得见；工程和控制细节看不见
              tone: warning
    claimRefs:
      - CE016
      - CE018
      - CE024
      - CE028
      - CE031
      - CE043
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: ABLY 可见的客户旅程横跨多边：从买家发现商品，到商家运营，再延伸到组合扩张或出口扩张。
    data:
      nodes:
        - id: discover
          label: 发现
          detail: 本土买家靠包邮、优惠券和推荐驱动的获客入口接触 ABLY 或 4910。
          tone: positive
        - id: browse
          label: 浏览并互动
          detail: 用户在个性化时尚、美妆、生活方式信息流，以及社区 / 内容界面里互动，拉深单次使用。
          tone: positive
        - id: purchase
          label: 购买
          detail: 消费者在主应用或 4910 购物流程中转化，支付越来越多绑定 ABLY Pay。
          tone: neutral
        - id: seller-ops
          label: 商家运营
          detail: 商家用商家 App 管理订单、咨询、历史记录和移动营销。
          tone: positive
        - id: export
          label: 日本出口扩张
          detail: 商家可把商品导入 Amood，翻译、物流、清关和客服由 ABLY 承接。
          tone: positive
        - id: repeat
          label: 复购与留存
          detail: 重复使用的公开证据主要来自日本：复购客户和偏好增长信号可见，但未披露 NRR 或流失数据。
          tone: warning
    approximationNotes: 该旅程图综合公开产品界面，而非内部漏斗；ABLY 没有发布单一端到端转化图。
    claimRefs:
      - CU002
      - CU004
      - CU021
      - CU026
      - CU029
      - CU030
      - CU032
      - CU033
      - CU039
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: 公开证据支持一条从主应用流量规模，到国内相邻产品和日本业务界面的推进路径，但不支持推算其间转化率。
    data:
      nodes:
        - id: flagship-scale
          label: 主应用规模
          detail: Ably 达到 10.05M MAU、660M 次启动、平均每月使用 1h1m。
          tone: positive
        - id: core-demographic
          label: 核心人群守住
          detail: 4.61M 名 20 多岁和 30 多岁女性用户，支撑本土基本盘。
          tone: positive
        - id: male-expansion
          label: 4910 男性人群扩张
          detail: 4910 达到 1.21M MAU，2030 人群同比增长 8.5x。
          tone: positive
        - id: japan-demand
          label: Amood 日本需求
          detail: Amood 累计下载量达 6.5M，覆盖约 4.25M 名 14-29 岁女性。
          tone: positive
        - id: seller-channel
          label: 商家渠道
          detail: 日本路径已纳入 25,000 名商家，出口 SKU 增加，复购客户增长。
          tone: positive
        - id: unknown-conversion
          label: 未知转化层
          detail: ABLY 未披露连接安装、活跃买家、付费订单、活跃商家和留存用户队列的转化率。
          tone: warning
      edges:
        - from: flagship-scale
          to: core-demographic
        - from: core-demographic
          to: male-expansion
        - from: male-expansion
          to: japan-demand
        - from: japan-demand
          to: seller-channel
        - from: seller-channel
          to: unknown-conversion
    approximationNotes: 这是界面到界面的部署流，不是真正的数字漏斗；公开披露没有给出贯穿组合的共同分母。
    claimRefs:
      - CU011
      - CU012
      - CU013
      - CU016
      - CU017
      - CU018
      - CU020
      - CU021
      - CU035
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: ABLY 的客户证据在大规模生产使用上最强，在公开留存可见度和商家级经济性上最弱。
    data:
      columns:
        - 证据质量
        - 结果具体度
        - 留存可见度
        - 生产成熟度
      rows:
        - label: Ably 主应用买家
          values:
            - 高 — 10.05M MAU 及参与度指标
            - 中 — 有人口结构和使用数据，但没有具名买家
            - 低 — 无公开用户队列
            - 高 — 大规模消费产品
        - label: 4910 用户
          values:
            - 中 — MAU 和用户队列增长信号
            - 中 — 有用户结构细节，但无买家转化
            - 低 — 无复购订单数据
            - 高 — 活跃本土购物界面
        - label: Amood 日本买家
          values:
            - 高 — 下载量、人群覆盖和复购信号
            - 中 — 有复购客户增长，但无订单经济性
            - 中 — 已披露复购客户增长
            - 高 — 活跃消费 App
        - label: Amood 商家 / 品牌
          values:
            - 高 — 25,000 家店铺，以及具名品牌结果
            - 高 — 5 个具名品牌交易增长
            - 低 — 无按队列拆分的商家留存
            - 高 — 运行中的出口管线
        - label: 使用商家 App 的 ABLY 商家
          values:
            - 中 — 商家运营工具可见
            - 低 — 无按工具使用拆分的商家数或 GMV
            - 低 — 无续约或使用年限数据
            - 高 — 商家运营工作流已存在
    approximationNotes: 该矩阵比较的是公开资料中可见的证据层，而非给内部客户质量打分；低分主要代表披露缺口，不代表表现为负。
    claimRefs:
      - CU004
      - CU011
      - CU016
      - CU018
      - CU020
      - CU023
      - CU024
      - CU025
      - CU028
      - CU029
      - CU031
      - CU036
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 剩余风险最高的部分不是原始消费者需求，而是合规收紧和利润转化敏感性。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 暗黑模式 / 评价 / 退款合规
          values:
            - label: 高
              tone: negative
            - label: 高
              tone: negative
            - label: 中
              tone: neutral
            - label: 高
              tone: negative
        - label: Ably Pay 隐私 / 欺诈事件
          values:
            - label: 中-高
              tone: negative
            - label: 高
              tone: negative
            - label: 低-中
              tone: negative
            - label: 高
              tone: negative
        - label: 集团利润率挤压
          values:
            - label: 高
              tone: negative
            - label: 高
              tone: negative
            - label: 中
              tone: neutral
            - label: 高
              tone: negative
        - label: 跨境控制失效
          values:
            - label: 中
              tone: neutral
            - label: 中-高
              tone: negative
            - label: 低-中
              tone: negative
            - label: 中-高
              tone: negative
        - label: 治理 / 所有者不透明
          values:
            - label: 中-高
              tone: negative
            - label: 中-高
              tone: negative
            - label: 低
              tone: negative
            - label: 高
              tone: negative
    claimRefs:
      - CR037
      - CR038
      - CR039
      - CR040
      - CR041
      - CR042
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 主要传导路径是：规则收紧和运营复杂度上升，压到信任、利润率、现金可见度，最终影响融资灵活性。
    data:
      nodes:
        - id: n1
          label: 监管收紧
          detail: 暗黑模式、评价、隐私和跨境义务的监管要求越来越细。
        - id: n2
          label: 商家 / 履约运营
          detail: 商家工具和运营支持都会增加执行负荷。
        - id: n3
          label: Ably Pay 扩张
          detail: 支付的战略重要性在上升。
        - id: n4
          label: 消费者信任与转化
          detail: 用户规模足够大，任何质量或隐私故障都会被放大。
        - id: n5
          label: GMV 和服务收入
          detail: 需求仍可见，但单靠需求不够。
        - id: n6
          label: 集团利润率 / 亏损线
          detail: 促销、合规和再投资共同塑造利润转化。
        - id: n7
          label: 现金可见度
          detail: 储备、债务和现金跑道披露仍偏薄。
        - id: n8
          label: 融资灵活性 / 估值
          detail: 资本可得性和估值都受执行可信度牵动。
      edges:
        - from: n1
          to: n4
          label: 消费者与监管审视
        - from: n1
          to: n6
          label: 合规成本
        - from: n2
          to: n4
          label: 服务质量
        - from: n2
          to: n6
          label: 运营成本
        - from: n3
          to: n4
          label: 隐私 / 支付信任
        - from: n3
          to: n6
          label: 欺诈与控制开销
        - from: n4
          to: n5
          label: 转化与留存
        - from: n5
          to: n6
          label: 规模不等于利润率
        - from: n6
          to: n7
          label: 亏损或现金转化走弱
        - from: n7
          to: n8
          label: 融资和估值压力
    claimRefs:
      - CR018
      - CR019
      - CR037
      - CR038
      - CR039
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: ABLY 的依赖网络横跨商家、战略资本、交易对手和监管方，而不是一个孤立瓶颈。
    data:
      nodes:
        - id: d1
          label: Alibaba 资本信号
          detail: 公开资料中最后一轮明确确认的战略融资。
        - id: d2
          label: ABLY 核心 App
          detail: 主应用需求和流量引擎。
        - id: d3
          label: 4910 / Amood / Ably Pay
          detail: 相邻业务引擎如今会影响增长故事。
        - id: d4
          label: 商家基本盘
          detail: 商家提供库存和出口动能。
        - id: d5
          label: 不可见供应商栈
          detail: 云、物流、PSP、保险方和反欺诈工具的公开映射缺位。
        - id: d6
          label: KFTC / PIPC
          detail: 监管方塑造合规暴露。
        - id: d7
          label: 日本跨境链条
          detail: 本地化、结算、支持和商家出口执行。
        - id: d8
          label: 融资灵活性
          detail: 取决于执行可信度的结果变量。
      edges:
        - from: d1
          to: d8
          label: 资本信号
        - from: d2
          to: d8
          label: 核心需求证明
        - from: d3
          to: d8
          label: 相邻业务上行或拖累
        - from: d4
          to: d2
          label: 库存宽度
        - from: d4
          to: d7
          label: 出口供给
        - from: d5
          to: d2
          label: 服务连续性
        - from: d5
          to: d3
          label: 支付和工具可用性
        - from: d6
          to: d3
          label: 支付与跨境规则
        - from: d6
          to: d8
          label: 执法可信度
        - from: d7
          to: d8
          label: 国际执行证明
    claimRefs:
      - CR024
      - CR025
      - CR026
      - CR027
      - CR030
      - CR040
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 推荐结论从真实运营规模出发，经由可比公司估值分散和披露限制，落到继续研究。
    data:
      nodes:
        - id: scale
          label: 已规模化平台
          detail: 10m+ MAU、2024 GMV KRW 2.5tn、2025 销售额 KRW 369.7bn
        - id: growth
          label: 相邻业务动能
          detail: Ably Pay、4910 和 Amood 仍在增长
        - id: comps
          label: 公开可比公司区间宽
          detail: 同类参照的销售额倍数约 1x 到 11x
        - id: opacity
          label: 披露缺口
          detail: 股权结构和单位经济数据仍缺位
        - id: decision
          label: 继续研究
          detail: 公司值得看，但按当前标示价格吸引力还不明显
      edges:
        - from: scale
          to: growth
          label: 支持
        - from: growth
          to: comps
          label: 可能支撑
        - from: comps
          to: opacity
          label: 但受制于
        - from: opacity
          to: decision
          label: 因此
    claimRefs:
      - CV005
      - CV008
      - CV009
      - CV014
      - CV015
      - CV018
      - CV038
      - CV042
      - CV045
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 以 2025 年收入 KRW 369.7bn 计算，公开可比区间会指向与当前标示估值截然不同的价值。
    data:
      items:
        - label: 类 Coupang 1.0x
          value: 370
        - label: 类 PayPal 1.2x
          value: 444
        - label: 类 Nu 6.4x
          value: 2366
        - label: 当前标示 8.1x
          value: 3000
        - label: 类 Adyen 10.1x
          value: 3734
      yAxis:
        label: 2025 年收入对应的示意估值（KRW bn）
    approximationNotes: 这些数值把 2025 年收入 KRW 369.7bn 乘以可比公司式销售额倍数；它们只是公开市场经验估算，不是内在价值。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
      - CV038
      - CV039
      - CV040
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 熊市、基准和牛市区间的核心问题，是市场最终给 ABLY 哪一档倍数。
    data:
      items:
        - label: 熊市情景
          low: 370
          mid: 444
          high: 700
        - label: 基准情景
          low: 2366
          mid: 3000
          high: 3200
        - label: 牛市情景
          low: 3734
          mid: 4137
          high: 4500
    approximationNotes: 熊市情景锚定类 Coupang 和类 PayPal 的销售额区间，基准情景从类 Nu 的当前收入逻辑跨到当前标示估值，牛市情景采用高溢价支付软件式结果。
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV043
      - CV044
      - CV049
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: KPI 视图显示 ABLY 确有规模，也显示当前估值里埋着价格和披露门槛。
    data:
      items:
        - label: 2025 年收入
          value: '369.7'
          unit: KRW bn
        - label: 2025 年经营亏损
          value: '4.3'
