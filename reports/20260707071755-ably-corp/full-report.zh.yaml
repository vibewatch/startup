  - id: TV005
    title: 推翻命题与叫停触发表
    columns:
      - 触发项
      - 为什么重要
      - 可观察预警信号
      - 行动含义
    rows:
      - - 市场仍竞争激烈时增长停滞
        - 8x 销售额 headline 估值需要持续运营动能支撑。
        - MAU 或 GMV 增长不再跑赢品类增长。
        - 向更低的电商倍数重估。
      - - 相邻业务变现失败
        - 牛市情景依赖 Ably Pay、4910 和 Amood 改善收入质量。
        - 用户强增长，但没有分部层面的经济性证明。
        - 把上行叙事视为未证实，并下调价值预期。
      - - 促销掩盖利润率质量偏弱
        - 包邮和优惠券能做出规模，但不一定带来持久利润转化。
        - take rate 或毛利率证据一旦披露便令人失望。
        - 转向 PayPal/Coupang 式区间或更低。
      - - 监管压紧平台经济性
        - 黑暗模式和平台公平规则会增加摩擦和合规成本。
        - 出现新的执法，或更广的平台义务。
        - 加入政策折价，并放慢承销节奏。
      - - 股权结构条款不利于投资人
        - 优先权或混乱的后续融资可能削弱 headline 估值质量。
        - 尽调后，轮次计算仍无法对上。
        - 即使业务质量仍好，也放弃价格敏感型进入。
    notes: 这些少数触发项最可能把 ABLY 从「价格有争议但公司有意思」推向「在该价格下不具吸引力」。
    claimRefs:
      - CV021
