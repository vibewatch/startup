      - CV044
      - CV048
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 要求
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - Alibaba 轮次机制
        - 已签署 term sheet、准确持股、优先权、是否混有老股转让
        - 需要用它把 headline 估值转成真实进入价格。
        - 要求提供律师包和更新后股权结构表。
      - - 当前分部 P&L
        - 核心 ABLY、Ably Pay、4910 和 Amood 的收入、毛利和现金需求
        - 需要检验相邻业务是提升还是稀释估值质量。
        - 要求管理层按业务线报告。
      - - 单位经济
        - take rate、毛利率、CAC、复购行为、退货、卖家集中度
        - 需要判断 ABLY 应该落在哪个公开倍数带。
        - 要求提供 cohort 和单位经济仪表板。
      - - 2026 run-rate 展望
        - 当前季度收入桥和运营计划
        - 需要判断 2025 年往绩数据是低估还是高估当前经济性。
        - 要求提供董事会材料或当前运营复盘。
      - - 监管敞口
        - 律师对黑暗模式、平台公平和消费者法敞口的看法
        - 需要框定合规和执法带来的下行风险。
        - 取得外部律师备忘录和管理层整改计划。
      - - 退出准备度
        - 披露路线图、审计深度，以及面向公开市场报告的准备度
        - 需要判断公司能否随时间取得更高质量的估值区间。
        - 要求提供 CFO 路线图和报告日历。
    notes: 如果管理层答不上这些要求，投资案例就应留在观察名单，而不是进入按当前价格下注的确信模式。
    claimRefs:
      - CV041
      - CV045
      - CV046
      - CV047
      - CV049
      - CV050
