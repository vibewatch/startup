      - number: '5.3'
        title: 成熟度、路线图与差异化
        blocks:
          - type: paragraph
            body: >-
              ABLY 的产品成熟度最好理解为产品组合编排。旗舰应用已经规模化，月活超过 10 million，月度启动频次也异常高。4910 已从 2023 年末上线走到百万级用户规模；Amood
              则成为实质可见的日本需求和卖家出口渠道。与此同时，运营型产品不再是边缘项目：Partners 出现在已报道商品收入中，公司的履约足迹也已经扩展，以支持海外卖家工作流。这比仍在证明一个狭窄用例的创业公司更成熟。


              因此，差异化主张可信，但尚未完全承做。ABLY 看起来最强的地方，是多个模块相互强化：第一方偏好数据改善推荐；互动触点创造更多会话和信号；卖家工具和履约降低供给摩擦；支付提高结账 控制；Amood
              加全球履约把同一台机器延伸进跨境需求。缺口在于，公开记录对发布节奏、可用性纪律、安全姿态，或这些模块之间的精确技术接口仍语焉不详。ABLY
              的产品边缘在行为和业务结果中可见，但底层工程触点主要仍由公司故事和应用商店描述来叙述，而不是由文档来证明。
