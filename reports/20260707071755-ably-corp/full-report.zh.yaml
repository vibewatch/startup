      - number: '7.2'
        title: 运营、利润率与安全传导
        blocks:
          - type: paragraph
            body: >-
              从运营看，ABLY 更脆弱的不是需求线，而是利润率线。公开报道足以支撑真实规模：月活超过 1000 万、2025 年收入创纪录、交易额约 KRW 2.8T、2026 上半年恢复增长。但同一批来源也显示，集团
              2025 年仍亏损，管理层自己把缺口归因于对 4910 和 Amood 的再投入。也就是说，公司尚未进入“规模自然带来集团长期盈利”的状态。运营模型还增加了复杂度。官方材料展示了商家工具和履约运营，Korea
              Herald 则把 Ably Pay
              描述为快速放大的交易层。每一个触面都能加深护城河和变现，但也各有失效模式：商家支持断点、推荐或转化质量差、支付欺诈或隐私错误，以及扩张项目成本失控。竞争背景让问题更尖锐。韩国时尚市场增长温和，中国玩家仍进攻强势，行业同行已经更依赖优惠券和营销。风险传导路径因此很直接：如果执行质量下滑，而促销或合规成本上升，ABLY
              可以守住 GMV 增长，却仍在利润转化、现金可见性，或两者上失手。
