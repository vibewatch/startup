      - number: '4.2'
        title: 牵引力与单位经济性代理指标
        blocks:
          - type: paragraph
            body: >-
              公开牵引力是 ABLY 财务案例中最强的一部分。独立报道和官网在核心平台规模上相互收敛：月度用户超过 10 million、年度 GMV 高于 KRW 2
              trillion，并且用户参与广泛。相邻应用也不再是无关紧要的实验。4910 从 beta 走到全面上线，用户增长很快，并在 2025 年内月度用户大致翻倍；Amood 在日本累计下载量超过 6.5
              million，并扩大了卖家 / 出口网络。这些事实具有财务意义，因为它们意味着 ABLY 并不依赖一个老化的本土女性时尚触点来守住收入线。


              但这些仍是吞吐量代理，不是干净的单位经济性。保留材料给出了
              GMV、MAU、下载量、服务收入、商品收入、经营现金流和现金余额。它没有给出毛利率、每单贡献利润、CAC、回本期、退货率、库存风险，或按卖家和买家细分的队列
              行为。因此，正确的投资人结论是「规模可观测、转化机制隐藏」：活动真实的证据很多，但还不足以判断活动能多高效地转化为长期利润。
