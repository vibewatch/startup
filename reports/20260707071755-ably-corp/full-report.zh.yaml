  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 单位
      - 当前价值 / 状态
      - 收入质量
      - 尽调问题
    rows:
      - - 核心 ABLY 平台服务收入
        - 平台交易费，与时尚、美妆和生活方式订单挂钩
        - 与 GMV 挂钩的服务收入
        - 2024 年服务收入 KRW 189.1bn；2025 年服务收入 KRW 227.3bn
        - 最强的可见收入通道，因为会随平台交易活跃度放大，但实际抽佣率未披露
        - 要求卖家抽佣率、品类组合和扣除配送调整后的净贡献毛利率
      - - Partners / 履约产品收入
        - 履约和伙伴解决方案运营，支撑选品、物流和卖家赋能
        - 与运营服务挂钩的产品收入
        - 2024 年产品收入 KRW 145.1bn；2025 年产品收入 KRW 142.3bn
        - 收入真实存在，但比手续费收入更重运营，因此利润率画像可能更低或更波动
        - 要求按履约队列提供毛利率，以及每个卖家细分的营运资金需求
      - - 卖家工具和营销服务
        - 为卖家提供订单管理、咨询处理、历史追踪和移动营销
        - 卖家工作流 / 服务包
        - 在市场管理 app 中官方可见；变现条款未披露
        - 一旦嵌入卖家工作流，可能有黏性，但当前价格兑现未知
        - 要求绑定率、费率表，以及使用付费营销功能的卖家占比
      - - 4910 男装变现
        - 新 app 借助 AI 推荐、优惠券和免邮来提升买家活跃度和品牌渗透
        - 与 GMV 和促销挂钩的电商收入
        - 用户增长大、交易量上升；未单独披露收入
        - 如果能放大复购需求，吸引力不错，但扩张期很可能促销强度高
        - 要求 4910 独立收入、促销支出和队列复购率
      - - Amood 跨境卖家服务
        - 一站式出口支持，覆盖翻译、清关、物流、CS 和日本需求生成
        - 与出口挂钩的交易和服务收入
        - 卖家基数超过 25,000，下载量超过 6.5m；未单独披露收入
        - 具备战略意义，因为扩张 TAM 并提升卖家变现，但服务成本可能不轻
        - 要求日本 GMV、出口抽佣率、每单物流成本和卖家留存
    notes: 公开来源确认了这些变现通道存在，但没有披露实际组合、抽佣率或利润率贡献。
