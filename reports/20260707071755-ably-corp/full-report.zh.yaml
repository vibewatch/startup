  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与用户任务
        blocks:
          - type: paragraph
            body: >-
              ABLY 已不能再被理解为单应用女性时尚市场平台。保留下来的官方触点描述的是一个双边风格生态：购物者发现商品，卖家则用 ABLY
              的基础设施创建、运营并越来越多地出口业务。这一点重要，因为产品章节不应停在旗舰消费者信息流。ABLY 自有主页把风格电商与链式平台 分开，更广的来源组合显示出这种拆分在实践中的样子：旗舰 ABLY
              应用承载广泛多品类发现和互动，4910 聚焦男性导向的推荐和排名驱动购物，Amood 打开面向日本买家的触点，卖家管理应用给商户一套移动运营控制台，Partners 与履约则吸收卖家本来需要自己承担的工作。


              实际工作流结果是，ABLY 同时位于几个待完成任务的中间。对买家，它是个性化发现与便利层，配有包邮和优惠券机制。对卖家，它不只是店面
              上架场所；它可以成为处理订单流、咨询、物流和跨境执行的运营层。对跨境商户，Amood 和出口管线让 ABLY 更像电商基础设施提供商，而不是本土时尚
              应用。上行空间在于多个触点之间的宽度与资产复用。缺点在于，技术耐久性取决于这些触点是否真正共享基础设施和数据优势，而不只是共享品牌。
