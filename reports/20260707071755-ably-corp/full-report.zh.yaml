  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：直接同行、高端策展、既有巨头与新进入者
        blocks:
          - type: paragraph
            body: >-
              Ably 的竞争集比「女性时尚应用对其他商城聚合器」这个旧框架更宽。公司现在处在四个重叠战场的交叉点。第一，是仍在争夺日常发现和转化的国内女性时尚直接同行，其中 Zigzag 仍是最接近的运营对标，W
              Concept 则是最清晰的策展型高端对照。第二，是 29CM，尤其是 Musinsa 等高端且时尚优先的既有玩家；它们的规模和品牌关系让供给侧杠杆强过大多数应用驱动同行。第三，是 Coupang 和 Naver
              相关通道等横向替代，因为韩国购物者已经把大部分零售生活放在移动端、比价重且多平台分流的环境里。第四，是可能进入或快速上升的外部威胁，尤其是 Shein，以及潜在的 Shopee
              式跨境市场平台模型。这个更宽框架重要，因为 Ably 迄今报告的最强胜利来自规模和品类扩张，而最明显的脆弱点来自价格压力、资产负债表深得多的既有玩家，以及愿意在多个 应用之间分配注意力的购物者。
