      - number: '7.4'
        title: 人、治理与投资否决标准
        blocks:
          - type: paragraph
            body: >-
              最后一层风险是内部执行治理。ABLY
              的公开文化材料把公司想要的运转方式讲得格外明确：一个团队式决策、角色灵活覆盖、高挑战协作，以及愿意用个人最优换团队结果。业务同时协调多个应用、支付、卖家工具和合规时，僵硬的烟囱式组织跑不动；这确实能缓释风险。但文化不等于控制证据。公开材料仍没有给出董事会名单、债务时间表、支付储备指标、具名合规负责人或安全认证清单。相比之下，PayPal
              和 Sea 等公开同业维护专门的投资者或财务门户，PayPal、Nu 和 Adyen 的市场数据页面也显示，即便规模大得多，外部资本市场条件也会快速变化。投资含义是，ABLY
              仍可具吸引力，但尽调负担很高。这里不是“立即走开”的章节；而是“不要把强消费者牵引力误当作执行完全受控”的章节。最清晰的否决触发器都是可观察事项：KFTC 或 PIPC
              新行动、集团又一年亏损且现金可见性没有改善、4910、Amood 或 Ably Pay 势头停滞，或证实未披露的供应商集中度实质性偏高。
