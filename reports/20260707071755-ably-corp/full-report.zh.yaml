  - id: TI004
    title: 资本充足性表
    columns:
      - 资本项
      - 公开值 / 状态
      - 解读
      - 下一轮触发因素 / 义务视角
      - 尽调索取项
    rows:
      - - 最近确认的一级融资
        - Alibaba 于 2024 年 12 月投资 KRW 100bn，获得约 5% 股权
        - 证明公司能从战略投资者获得外部资本
        - 除增长和全球扩张目标外，公开材料未披露触发因素
        - 索取交割文件、投资人权利和资金用途计划
      - - 隐含估值
        - 约 KRW 3tn / $2.1bn
        - 有助于估值参照，但不能证明当前现金充足
        - 仅靠估值看不出现金跑道或资本成本
        - 索取最新股权结构表，以及估值条款与经营计划的对照
      - - 计划中的后续融资
        - 2024 年 12 月公开讨论过追加 KRW 100bn，但之后未获确认
        - 暗示管理层需要额外战略弹性或增长资金
        - 尚不清楚未确认是因为未融资、低调交割，还是计划调整
        - 索取后续融资进展，以及资金需求是否仍然存在
