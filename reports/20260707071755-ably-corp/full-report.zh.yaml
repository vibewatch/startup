    rows:
      - - 快速找到匹配风格商品
        - 商品目录庞杂，只按价格比较会拖慢发现
        - ABLY 个性化信息流、搜索、PDP、购物车和品类推荐
        - 10m+ MAU 和长使用时长说明该循环在规模化后仍有粘性
        - 没有公开的准确率 / 召回率或转化提升基准
      - - 不止一次性购买，还能浏览和互动
        - 交易型购物应用往往在结账后流失用户
        - ABLY 把编辑内容、社区、AI 聊天和 AI 个人资料功能叠进会话
        - 月启动 660m 次，平均使用时长较长
        - 未披露电商用户与内容用户的留存拆分
      - - 在移动端管理市场运营
        - 卖家需要实时盯订单和客户咨询
        - Able Market Management 集中订单、咨询、历史记录和推送通知
        - 运营可见性优先在移动端实现，而不是只靠桌面端
        - 公开来源没有显示卖家采用率或响应时间结果
      - - 以较低运营负担启动新的卖家业务
        - 找货、物流、配送和客服都是高进入门槛
        - Partners 承接运营任务，卖家更容易启动并经营一个店铺
        - 供给扩张可以改善货品宽度
        - 未公开披露卖家抽佣率或服务水平承诺
      - - 不自建海外运营也能卖到日本
        - 翻译、清关、物流和营销对韩国小卖家都很难
        - Amood 加出口管线，提供一键海外销售联动和托管运营
        - 25k+ 店铺、SKU 增长和复购买家增长显示实际使用
        - 公开来源未给出出口缺陷率或单位经济性
      - - 更快结账，并留在生态内
        - 第三方结账增加摩擦，也削弱数据捕捉
        - Ably Pay 把支付收进公司自有技术栈
        - 上线后交易量增长 4.7x
        - 授权率、拒付或反欺诈体系没有公开证据
    notes: 仅在留存来源提供使用证据或直接产品描述支持时陈述收益；单位经济性和 SLA 结果仍未披露。
