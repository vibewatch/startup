      - 什么会改变看法
    rows:
      - - 规模
        - ABLY 已经达到品类领先的用户和 GMV 规模。
        - 仅有规模并不能证明变现质量能持久。
        - 要求提供分部利润率和 cohort 留存。
      - - 新引擎
        - Ably Pay、4910 和 Amood 可以把收入质量拉到核心交易平台费用之外。
        - 这些相邻业务仍可能高度依赖促销或投资。
        - 按业务线审查独立经济性。
      - - 市场背景
        - K-fashion 和移动电商在韩国仍有结构性大盘。
        - 整体市场增长还不够快，遮不住薄弱经济性。
        - 用品类增长和促销支出检验份额提升。
      - - 定价权
        - AI 推荐和卖家工具可能支撑更有黏性的变现。
        - 包邮、优惠券和运营服务可能意味着定价权利润率更低。
        - 审查 take rate、补贴负担和卖家集中度。
      - - 轮次质量
        - Alibaba 背书验证了资产的战略需求。
        - 表面轮次计算和条款仍过于不透明，无法干净承销。
        - 取得 term sheet 和更新后的股权结构表。
    notes: 反命题主要指向估值质量和披露，而不是 ABLY 是否真是一门运营中的业务。
