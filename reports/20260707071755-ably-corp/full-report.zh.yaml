chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              理解 Ably，不能把它看成单一购物应用，而应看成多边电商运营商。官方材料用「下一代电商」框定公司：一边帮助买家发现个人风格，一边降低卖家选品、上架、分发和售后支持的难度。这套逻辑重要，因为 Ably
              的公开足迹已经超过旗舰女性时尚市场平台。独立报道持续把公司平台组合描述为 Ably、男装应用 4910 和面向日本的
              Amood；官方和应用商店材料则显示，卖家工具与合作伙伴支持基础设施位于其后。官方历史还显示一条有意义的演进线：Kang Seok-hoon 的团队 2015 年从青少年购物商城 Banhala 起步，2018
              年 3 月转向 Ably 应用。由此形成的商业模式，不靠一个店面单打独斗，而是尝试在相邻形态之间复利消费者需求、卖家入驻和数据驱动推荐。
