      - number: '2.3'
        title: 买家、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              ABLY 的增长不再只是单一女性时尚市场平台的故事。需求端，消费者用户和付款方仍是购买商品的购物者，但公司现在至少推进三条不同细分路径：核心女性 应用、男装切口 4910，以及面向日本的 Amood
              出口渠道。供给端，相关买家往往是卖家或商户，他们要决定是否上架库存、通过 Partners 外包运营，或用 ABLY 的卖家工具管理订单和营销。这个区分重要，因为采用是双边的：购物者响应包邮、AI
              推荐、内容和快速配送预期；卖家响应更低的运营摩擦、更广的需求入口和出口赋能。4910 近期用户增长，以及 Amood 在下载量、店铺数和复购客户上的动能，显示 ABLY
              正利用相邻细分来延展同一套市场平台与基础设施 体系，而不是做互不相关的实验。公司公开材料仍没有披露各细分的精确 GMV 或用户构成，因此跨细分重要性只得到部分回答。
