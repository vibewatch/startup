  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 标示估值，以及为何尚不能纳入投资定价
        blocks:
          - type: paragraph
            body: >-
              公开证据足以验证 ABLY 已跨过独角兽门槛，市场也愿意为这个故事付高价。多份留存报告都指向同一组 2024 年末 Alibaba 投资事实：投资 KRW 100B、持股约 5%、标示估值接近 KRW
              3T。这条估值口径下的业务事实也是真实的：用户规模跨过 1000 万 MAU，2024 年 GMV 达到 KRW 2.5T，2025 年收入达到 KRW 369.7B，2026
              上半年势头仍为正。足以说明，公司并不是靠空气估值。


              公开记录没有给出的是干净的投资定价算式。“约 5%”的持股说法，与 KRW 3T
              标示估值并不能严丝合缝地对上；留存资料也没有披露签署版投资条款书、清算优先权、老股转让比例，或计划中的后续融资是否真正完成。也就是说，这个标示估值可以按市场事件采信，但不能当作精确入场价。本章的估值因此从情景框架和公开可比公司出发，而不是假装私募轮已经给出完整股权结构表答案。
