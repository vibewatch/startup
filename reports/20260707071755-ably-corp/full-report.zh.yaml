  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险组合
        blocks:
          - type: paragraph
            body: >-
              ABLY 近期最可信的外部风险，不是需求突然蒸发，而是监管收紧。韩国电商法已经对经营者披露、托管或消费者损害补偿、订单确认，以及七日履约和退款时点给出具体义务。在这条基线之上，2025-2026
              年法律更新显示，平台经营者面对的规则正变得更细：暗黑模式限制已经生效，子法规草案会增加更清晰的评论披露标准和更重的重复违规处罚，大型境外店铺的境内代理框架也在落地。即便 ABLY
              本身是韩国公司，这些变化仍重要，因为它的增长策略越来越多碰到跨境卖家流、支付和推荐驱动的商品陈列。隐私执法是第二条法律线索。PIPC 官网正主动展示对规模化数字公司的制裁，Ably Pay
              以及任何消费者数据处理失误，都会比一般后台事项更具实质性。公开留存记录中看不到针对 ABLY
              的诉讼或监管行动，不能过度解读为法律干净；只能说明公开档案很薄。做投资判断时，实际含义是：界面设计、评论、退款、数据处理和跨境治理都要越过更高的合规线，而公司还在扩展产品触面。
