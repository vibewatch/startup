      - number: '8.4'
        title: 最终尽调问题、论点破坏项与退出准备度
        blocks:
          - type: paragraph
            body: >-
              投资人的好消息是，剩余尽调议程并不神秘。缺的正是把情景备忘录变成投资定价的那些数据：股权结构表和投资条款书机制、分部经济性、抽佣率、毛利率、留存、卖家集中度，以及 Ably Pay、4910 和 Amood
              的贡献画像。如果这些数据足够强，建议可以很快上调，因为平台顶线规模已经清楚可见。如果数据令人失望，当前标示估值会很快压缩，因为 ABLY 隐含倍数与较低的上市商业区间之间没有多少安全边际。


              同一逻辑也解释退出准备度。公开同业以持续、由申报支撑的节奏披露，ABLY
              仍停留在私营公司深度。这不说明公司弱；只说明业务还不能以同样方式被公开市场纳入投资定价。在管理层给出更丰富的数据室资料包之前，正确姿态是跟踪否决触发器、收紧入场纪律，并把任何建议上调都视为取决于更低价格或实质更强披露。
