  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失的私有指标
      - 对投资判断的影响
      - 具体尽调路径
    rows:
      - - 实际抽佣率和收入确认政策
        - 没有这些数据，投资者无法把 GMV 或买家激励转化为净收入质量
        - 获取分品类佣金表、收入确认备忘录，以及折扣 / 退款处理方式
      - - 服务收入与产品收入的毛利率拆分
        - 没有这些数据，市场无法判断履约增长是在改善还是稀释盈利质量
        - 索取经审计的分部毛利率桥，以及各收入线销货成本构成
      - - CAC、销售效率和促销回本周期
        - 没有这些数据，即使 GMV 上升，4910 和核心应用增长也可能毁损价值
        - 索取获客漏斗、优惠券支出、付费媒体归因，以及按应用用户群拆分的回本周期
      - - 烧钱、现金跑道和债务义务
        - 没有这些数据，年末现金无法换算成可存活月数或下行韧性
        - 索取月度资金报告、债务明细、契约包和下行现金跑道情景
      - - 营运资本、退货和卖家集中度
        - 如果现金转化波动，缺少这些数据会让公开收入和 OCF 夸大持续性
        - 索取退货率、应付款节奏、头部卖家集中度和履约库存假设
      - - Alibaba 轮后的后续融资状态
        - 没有这些数据，投资者无法判断管理层是否仍预期外部增长资本
        - 索取董事会材料、融资管线和 2025 年后的股权结构变化
    notes: 这些是最低限度缺失数据点；虽然营收规模和现金储备代理指标公开可见，但缺少它们就无法形成完整投资判断。
    enumerationScope:
      coverage: exhaustive
      basis: >-
        This table enumerates the specific public-information gaps that block financial underwriting of ABLY based on
        the retained source set used in this chapter.
