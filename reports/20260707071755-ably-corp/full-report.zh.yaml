      - number: '2.2'
        title: 受证据约束的规模测算口径
        blocks:
          - type: paragraph
            body: >-
              已抓取来源没有干净发布一组适用于 ABLY 的韩国女性时尚平台 TAM、SAM 和 SOM，因此本章保留多个公开口径，而不假装它们可以互换。最宽口径是 Trade.gov 对 2025 年电商约 $200
              billion 的估算，以及 WPIC 对 2024 年 KRW 242 trillion 总量的估算。更窄但仍不完美的上限，是韩国时尚产业本身；Aju Press 报道 2025 年预计产值 KRW 51.8
              trillion、2026 年 KRW 52.2 trillion。再往下是已披露的平台规模观察：Musinsa 2024 年 GMV 约 KRW 4.5 trillion，ABLY 2024 年约 KRW
              2.5 trillion、2025 年约 KRW 2.8 trillion，29CM 超过 KRW 1
              trillion。这些数字有用，因为它们展示了头部时尚目的地的实际规模；但它们是公司或平台产出，不是统一的市场分母。核心结论是，ABLY
              相对专业同行已经很大，但可服务女性平台细分市场的精确规模仍是尽调缺口，而不是一个已经解决的公开事实。
