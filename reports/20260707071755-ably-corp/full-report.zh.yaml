      - number: '5.4'
        title: 信任、合规与技术风险
        blocks:
          - type: paragraph
            body: >-
              ABLY 的信任触点一部分可见，一部分缺失。可见的一面是，消费者和卖家应用披露了权限范围，卖家应用 发布的数据安全摘要提到收集个人信息和设备标识、传输加密以及删除请求。韩国法律和监管材料也明确显示，像 ABLY
              这样的平台正处在一个趋严环境中，取消流程、渐进式费用披露、虚假层级、隐藏续订、付费排名披露和评价完整性都被纳入监管。这意味着产品、增长和法律团队不能把 结账 UX
              或排名逻辑当成纯商业问题；合规设计是产品架构的一部分。


              缺失的一面同样重要。保留下来的招聘、FAQ 和新闻中心触点没有提供真正的公开技术栈视图；保留材料中也看不到状态页或事故历史；甚至部分近期第三方 Amood
              报道在缓存中被阻断。因此，投资人无法仅凭公开材料验证模型治理控制、评价审核流程、反欺诈防线、隐私保护内建 实践或服务级可靠性。正确的风险读法不是 ABLY
              明显很弱，而是一个推荐密集、数据丰富、依赖物流的电商平台正面对更高治理要求，同时公开技术尽调触点仍很浅。
