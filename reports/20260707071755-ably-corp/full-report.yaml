        title: Trust, compliance, and technical risks
        blocks:
          - type: paragraph
            body: >-
              ABLY’s trust surface is partly visible and partly missing. On the visible side, the consumer and seller
              apps disclose permission scopes, and the seller app publishes a data-safety summary that references
              collection of personal information and device identifiers, transit encryption, and deletion requests.
              Korean legal and regulatory materials also make clear that platforms like ABLY are operating inside a
              tightening environment for cancellation flow, gradual cost disclosure, fake hierarchy, hidden renewals,
              paid-ranking disclosure, and review integrity. That means product, growth, and legal teams cannot treat
              checkout UX or ranking logic as a purely commercial matter; compliance design is part of the product
              architecture.


              The missing side is equally important. The retained recruit, FAQ, and news-hub surfaces do not provide a
              real public stack view, no status page or incident history is visible in the retained set, and even some
              recent third-party Amood coverage is blocked in cache. Investors therefore cannot validate
              model-governance controls, review-moderation processes, fraud defenses, privacy-by-design practices, or
              service-level reliability from public artifacts alone. The right risk read is not that ABLY is obviously
              weak. It is that a recommendation-heavy, data-rich, logistics-dependent commerce platform now faces rising
              governance requirements while offering only a shallow public technical-diligence surface.
