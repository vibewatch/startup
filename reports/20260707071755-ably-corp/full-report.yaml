              - CU038
              - CU039
              - CU040
              - CU041
              - CU042
              - CU043
              - CU044
      - number: '6.6'
        title: Exhibits
        blocks:
          - type: callout
            title: ABLY has already built a multi-surface customer engine
            body: >-
              The customer story is no longer just flagship-Ably scale. Public evidence now supports three demand
              surfaces — flagship Ably, 4910, and Amood — plus a seller-operations layer and a Japan export route, which
              is unusually broad for a fashion-platform company of this size.
            calloutType: strength
            claimRefs:
              - CU011
              - CU016
              - CU017
              - CU020
              - CU026
              - CU039
          - type: callout
            title: Adoption is visible; durability is not
            body: >-
              ABLY discloses enough to prove broad usage, but not enough to prove revenue durability. The public file
              lacks NRR, GRR, churn, renewal, contract-length, and concentration disclosure, so investors still cannot
              translate headline MAU and seller counts into dependable customer quality.
            calloutType: risk
            claimRefs:
              - CU031
              - CU035
              - CU036
              - CU044
          - type: callout
            title: Competition and Korean trust rules can both raise customer-acquisition cost
            body: >-
              Shein's low-price push and tighter Korean rules on dark patterns, review disclosures, refunds, and
              complaints all point in the same direction: ABLY may need to spend more and operate more carefully to keep
              both shoppers and merchants growing at the current pace.
            calloutType: risk
            claimRefs:
              - CU040
              - CU042
              - CU043
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk stack
        blocks:
          - type: paragraph
            body: >-
              ABLY’s most credible near-term external risk is regulatory tightening rather than sudden demand
              evaporation. Korean e-commerce law already imposes concrete duties around operator disclosure, escrow or
              consumer-damage compensation, order confirmation, and seven-day fulfillment and refund timing. On top of
              that baseline, 2025-2026 legal updates show the regime becoming more prescriptive for platform operators:
              dark-pattern restrictions are now in force, draft sub-regulations would add clearer review-disclosure
              standards and stronger repeat-offender penalties, and the domestic-agent framework for large foreign
              storefronts is being operationalized. Even where ABLY itself is a domestic company, those developments
              matter because its growth strategy increasingly touches cross-border seller flows, payments, and
              recommendation-led merchandising. Privacy enforcement is a second legal vector. PIPC’s public site is
              actively showcasing sanctions against scaled digital companies, which makes ABLY Pay and any consumer-data
              mishandling more material than a generic back-office concern. The absence of a retained public record
              showing ABLY-specific litigation or regulator action should not be over-read as proof of legal
              cleanliness; it only means the public file is thin. For underwriting, the practical implication is that
              interface design, reviews, refunds, data handling, and cross-border governance need to clear a rising
              compliance bar while the company is still expanding product surfaces.
            claimRefs:
