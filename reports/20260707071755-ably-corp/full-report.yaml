  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, premium curation, incumbents, and entrants'
        blocks:
          - type: paragraph
            body: >-
              Ablys competitive set is wider than the legacy frame of womens-fashion app versus other mall aggregators.
              The company now sits at the intersection of four overlapping arenas. First are the direct domestic
              womens-fashion peers that still compete for everyday discovery and conversion, with Zigzag remaining the
              closest operational analog and W Concept the clearest curated-premium contrast. Second are premium and
              fashion-first incumbents such as 29CM and especially Musinsa, whose scale and brand relationships give
              them stronger supply-side leverage than most app-led peers. Third are horizontal substitutes such as
              Coupang and Naver-linked rails that matter because Korean shoppers already spend most of their retail
              lives in mobile, comparison-heavy, multi-homing environments. Fourth are likely entrants or fast-rising
              external threats, especially Shein and potentially Shopee-style cross-border marketplace models. That
              broader frame matters because Ablys strongest reported wins so far come from scale and category expansion,
              while its most obvious vulnerabilities come from price pressure, incumbents with much deeper balance
              sheets, and shoppers who are willing to split attention across multiple apps.
            claimRefs:
