            body: >-
              ABLY looks structurally more operationally intensive than a light, software-only marketplace. The
              seller-management app, fulfillment-center materials, and Amood export documentation all point to real work
              in order handling, customer service, logistics, translation, customs, and cross-border operations. That
              operating footprint helps explain why the company can grow seller breadth and improve export throughput,
              but it also means margins likely depend on execution in logistics, customer support, payments, and
              promotions rather than on pure marketplace fees alone. The 2024 company-wide operating loss despite
              continued flagship-platform profitability is an important clue: ABLY can generate profitable core
              activity, but group-level margins are still sensitive to reinvestment decisions and adjacent-business
              scaling costs.


              External conditions reinforce that reading. South Korea remains a mobile-first, fast-delivery e-commerce
              market, and 2025-2026 legal updates point to tighter regulation around dark patterns, review disclosure,
              and online-platform obligations. Add in competition from AliExpress, Temu, Shein, and domestic peers, and
              the likely margin picture is a platform that must keep spending on promotions, service quality, and
              compliance. The public record supports a credible path to scale, but not a clean path yet to disclosed
              gross-margin durability.
