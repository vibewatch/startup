      - number: '7.4'
        title: People, governance, and investment kill criteria
        blocks:
          - type: paragraph
            body: >-
              The final risk layer is internal execution governance. ABLY’s public culture materials are unusually
              explicit about how the company wants to operate: one-team decision-making, flexible role coverage,
              challenge-heavy collaboration, and willingness to trade personal optimization for team outcomes. That is a
              real mitigation because businesses juggling multiple apps, payments, seller tooling, and compliance cannot
              function with rigid silo behavior. But culture is not the same thing as control evidence. Public materials
              still do not provide a board roster, debt schedule, payments reserve metrics, named compliance owners, or
              a security-certification inventory. By contrast, public peers such as PayPal and Sea maintain dedicated
              investor or financial portals, and market-data surfaces for PayPal, Nu, and Adyen show how quickly
              external capital-market conditions can change even for much larger operators. The investment implication
              is that ABLY can still be attractive while carrying a high diligence burden. This is not a
              walk-away-immediately chapter; it is a
              do-not-confuse-strong-consumer-traction-with-fully-controlled-execution chapter. The cleanest kill
              triggers are observable ones: a new KFTC or PIPC action, another year of group losses without better cash
              visibility, a stall in 4910 or Amood or Ably Pay momentum, or confirmation that undisclosed vendor
              concentration is materially high.
