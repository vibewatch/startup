      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The main adoption drivers are structural rather than cyclical. Korea is already a mobile-first e-commerce
              market; shoppers are accustomed to fast fulfillment, integrated payments, and high-frequency app
              engagement. Public reporting also suggests younger consumers increasingly prefer platform-born fashion
              labels over department-store incumbents, which helps explain why ABLY and peers can still grow even while
              the broader fashion market expands only slowly. ABLY’s own recent results reinforce that pattern: its
              transaction volume outgrew the broader online-shopping sector, its in-house payments product scaled
              rapidly, and Japan expansion is creating an export pathway for sellers. The constraints are equally real.
              Chinese low-cost entrants are training shoppers on price and compressing platform differentiation;
              domestic compliance rules now cover dark patterns, review disclosures, and eventually domestic-agent
              obligations for large foreign operators; and PIPA-linked data rules add another layer of execution
              complexity for cross-border or data-heavy commerce models. Together, those constraints mean ABLY’s market
              is attractive, but it is not a frictionless winner-take-all category.
