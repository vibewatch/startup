              useful because they show the practical size of leading fashion destinations, but they are company or
              platform outputs, not a unified market denominator. The core conclusion is that ABLY is already large
              relative to specialty peers, yet the exact size of the addressable women’s-platform segment remains a
              diligence gap rather than a solved public fact.
