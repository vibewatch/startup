    rows:
      - - Bull
        - Ably Pay, 4910, and Amood keep compounding while margin quality improves.
        - Adyen-like 10.1x to 11.2x sales band implies roughly KRW 3.7-4.1tn on 2025 sales.
        - Needs proof that new businesses are durable and higher quality than core commerce.
      - - Base
        - Core platform remains strong and adjacencies help, but economics stay only partly disclosed.
        - Nu-like 6.4x current-revenue logic to current 8.1x headline implies roughly KRW 2.4-3.0tn.
        - Most plausible on current evidence because growth is real but not yet filing-grade.
      - - Bear
        - Business is judged primarily as promotion-heavy commerce under higher competition and regulation.
        - Coupang- or PayPal-like 1.0x to 1.2x sales implies only about KRW 0.37-0.44tn.
        - Would follow from weak margins, soft growth, or disappointing diligence.
