      - number: '3.2'
        title: Direct peers and where capability overlap is real
        blocks:
          - type: paragraph
            body: >-
              The closest domestic competitors still divide into two shapes. Zigzag is the closest like-for-like peer
              because it also aggregates fragmented fashion supply, leans on personalization, and is pushing harder on
              delivery and category breadth in 2026. W Concept and 29CM are less direct on low-price discovery but more
              dangerous wherever brand identity, editorial presentation, and premium basket size matter. Musinsa is
              broader than any of them and no longer a mens-streetwear niche; it now overlaps across women, kids,
              sports, private label, and international reach. Against that field, Ablys most distinct public wedge is a
              data-and-infrastructure bundle: AI recommendations, payments, seller tooling, and the ability to reuse
              those assets across the core app, 4910, and Amood. That is a real differentiator, but it is not yet a
              proven monopoly on any key buying criterion. The premium-curation players show that designer brands and
              storytelling can pull high-value users away from Ably, while Musinsa shows that broad platform scale can
              coexist with deeper monetization levers than pure marketplace commissions.
