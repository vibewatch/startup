  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Headline valuation and why it is not yet underwritable
        blocks:
          - type: paragraph
            body: >-
              Public evidence is strong enough to validate that ABLY crossed into unicorn territory and that the market
              was willing to pay up for the story. Multiple retained reports converge on a late-2024 Alibaba investment
              of KRW 100 billion, language around roughly 5% ownership, and a headline valuation near KRW 3 trillion.
              The business facts underneath that headline are also real: user scale crossed 10 million monthly actives,
              2024 GMV hit KRW 2.5 trillion, 2025 revenue reached KRW 369.7 billion, and 2026 first-half momentum
              remained positive. That is enough to say the company is not being valued on vapor.


              What the public record does not provide is clean underwriting math. The “about 5%” ownership language does
              not reconcile neatly with a KRW 3 trillion headline, and the retained set does not disclose the signed
              term sheet, liquidation preferences, secondary mix, or whether the planned follow-on raise actually
              closed. That means the headline can be trusted as a market event but not as a precise entry price. In this
              chapter, valuation therefore starts from scenario framing and relative public comps rather than from
              pretending the private round already gives a complete cap-table answer.
            claimRefs:
              - CV001
              - CV002
              - CV003
