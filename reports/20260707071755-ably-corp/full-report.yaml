            body: >-
              The public case for ABLY is attractive on revenue quality at a high level, but not yet underwritable at a
              detailed level. The positives are substantial: multi-year GMV growth, record 2024 and 2025 revenue,
              explicit service-versus-product revenue split, adjacent-app traction, a meaningful December 2024 primary
              round, and positive 2025 operating cash flow. Those facts make ABLY look more like a scaled commerce
              platform with real monetization and capital access than like a still-experimental startup.


              The blocker is not demand. It is visibility into conversion from demand into durable margin and
              self-funded growth. Investors still lack disclosed take rate, gross margin, returns behavior, CAC,
              payback, burn, runway, debt, working-capital dynamics, and customer concentration. Competitive and
              regulatory pressure raise the chance that these hidden variables matter. The practical diligence stance
              should therefore be: positive on scale and market position, constructive on directional liquidity, but
