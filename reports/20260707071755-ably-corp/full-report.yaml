      - number: '3.4'
        title: Moat durability, multi-homing, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a plausible competitive wedge for Ably, but not yet a fully underwritten
              moat. The strongest case is that Ably has already combined engagement scale, AI-led discovery, seller
              tooling, and portfolio expansion more effectively than any other womens-fashion specialist in Korea. The
              adverse case is just as important. Sheins MAU acceleration shows that low-price global entrants can move
              quickly. 29CM and W Concept show that premium users can be pulled by editorial curation and brand
              storytelling, while Musinsa demonstrates that the largest local fashion incumbent has broader monetization
              and supply-side leverage than most vertical peers. Public evidence on pricing, take rates, subsidies, and
              retention remains thin across the whole set, which means investors still cannot prove whether Ably wins on
              durable economics or on temporary execution momentum. Until Ably can disclose stronger category-level
              retention, exclusive-brand stickiness, and win-loss outcomes versus Musinsa, Zigzag, Shein, and horizontal
              substitutes, its moat should be treated as credible but still only partially proven.
            claimRefs:
              - CP006
