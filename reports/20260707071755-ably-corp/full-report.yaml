      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              ABLY’s growth is no longer just a story about a single women’s-fashion marketplace. On the demand side,
              the consumer user and payer is still the shopper buying goods, but the company now pursues at least three
              distinct segment paths: the core women’s app, the men’s-fashion wedge 4910, and the Japan-facing Amood
              export channel. On the supply side, the relevant buyer is often the seller or merchant deciding whether to
              list inventory, outsource operations through Partners, or manage orders and marketing through ABLY’s
              seller tooling. That distinction matters because adoption is two-sided: shoppers respond to free shipping,
              AI recommendations, content, and fast delivery expectations, while sellers respond to lower operational
              friction, broader demand access, and export enablement. 4910’s recent user growth and Amood’s download,
              store-count, and repeat-customer momentum show ABLY using adjacent segments to extend the same marketplace
              and infrastructure stack rather than pursuing unrelated experiments. The company’s public materials still
              stop short of disclosing the exact GMV or user mix by segment, so cross-segment materiality remains only
              partially answered.
