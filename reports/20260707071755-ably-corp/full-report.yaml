      - number: '1.4'
        title: Milestones, Expansion, and Risk Signals
        blocks:
          - type: paragraph
            body: >-
              Ably’s milestone pattern shows a company broadening from one Korean fashion app into a broader commerce
              stack. The 2023 break-even inflection matters because it arrived before the Alibaba round, giving external
              capital a stronger proof base than pure growth-at-all-costs stories usually have. The 4910 launch and
              Amood ramp show that management is not simply defending the flagship app; it is using adjacent categories
              and geographies to create new growth vectors. Public third-party metrics support meaningful user adoption
              for both moves. At the same time, the downside context is real. Ably is scaling inside a Korean ecommerce
              market that is large and mobile-first, yet fashion-market growth has been relatively subdued. Competitive
              intensity from 29CM, Zigzag, Shein, AliExpress, and Temu is rising, and legal commentary shows ecommerce
              platforms facing tighter rules around dark patterns, review disclosures, and platform-fairness oversight.
              Those risks do not invalidate the scale story, but they do make execution quality and regulatory
              compliance more central to underwriting.
