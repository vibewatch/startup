  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Portfolio and user jobs
        blocks:
          - type: paragraph
            body: >-
              ABLY is no longer legible as a one-app women’s-fashion marketplace. The retained official surface
              describes a two-sided style ecosystem in which shoppers discover products while sellers use ABLY’s
              infrastructure to create, run, and increasingly export businesses. That matters because the product
              chapter should not stop at the flagship consumer feed. ABLY’s own homepage separates style commerce from a
              chain platform, and the broader source set shows how that split manifests in practice: the flagship ABLY
              app serves broad multi-category discovery and engagement, 4910 concentrates on male-oriented
              recommendation and ranking-led shopping, Amood opens a Japan-facing buyer surface, the seller-management
              app gives merchants a mobile operating console, and Partners plus fulfillment absorb work that sellers
              would otherwise need to perform themselves.


              The practical workflow consequence is that ABLY sits in the middle of several jobs to be done at once. For
              buyers, it is a personalized discovery and convenience layer with free-shipping and coupon mechanics. For
              sellers, it is not just a storefront listing venue; it can be an operating layer that handles order flow,
              inquiries, logistics, and cross-border execution. For cross-border merchants, Amood and the export
              pipeline make ABLY look more like a commerce infrastructure provider than a domestic fashion app. The
              upside is breadth and reuse of assets across multiple surfaces. The drawback is that technical durability
              depends on whether those surfaces truly share infrastructure and data advantages, not merely branding.
