  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              ABLY is not publicly legible as a pure software subscription company, and it is not simply a single-app
              retailer either. The retained official surfaces describe a style-commerce platform that serves both
              shoppers and sellers, while seller tooling and fulfillment materials show that the company also monetizes
              operational enablement. That interpretation is reinforced by the 2024 and 2025 financial reporting
              coverage: revenue is explicitly split between service revenue tied mainly to platform transactions and
              product revenue tied to fulfillment and partner solutions. In other words, the company appears to turn
              shopper activity into platform fees while also taking a more operational role in sourcing, logistics, and
              seller support.


              What remains opaque is realized pricing quality. Public consumer surfaces show aggressive list-level
              incentives such as free shipping, coupon packs, and daily promotions across ABLY and 4910, but they do not
              reveal the seller take rate, the amount of discount leakage, net shipping economics, or any
              revenue-recognition detail. So the public record is strong enough to explain how ABLY can make money, but
              not strong enough to tell an investor how much of each won of GMV becomes durable gross profit.
