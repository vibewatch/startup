      - number: '8.3'
        title: Scenario view, recommendation, and price discipline
        blocks:
          - type: paragraph
            body: >-
              The bull case does not require heroic imagination. It requires evidence that the company’s newer
              engines—Ably Pay, 4910, and Amood—are improving the quality of revenue rather than only extending growth.
              Recent operating momentum, rapid user growth in 4910, and the expansion of Amood’s download and seller
              base all point in that direction. If those engines create durable monetization with better take-rate and
              margin characteristics, then an Adyen-like or at least Nu-like band becomes arguable and the current
              headline can be defended.


              The bear case is equally straightforward. ABLY’s public product surfaces emphasize free shipping, coupons,
              and operational enablement for sellers. Competition from Zigzag, 29CM, W Concept, Shein, Temu, and
              AliExpress remains intense, while Korea’s fashion market is not growing fast enough to bail out weak unit
              economics. If the company is still best understood as a low-margin, promotion-sensitive commerce operator,
              then the public market will naturally look toward Coupang or PayPal-style bands rather than premium
              software. That is why the recommendation here is research-more with medium confidence: the company quality
              is credible, but the current public record does not yet prove that paying around 8x trailing sales is an
              attractive entry.
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
