      - number: '7.2'
        title: Operational, margin, and security transmission
        blocks:
          - type: paragraph
            body: >-
              Operationally, ABLY looks more fragile at the margin line than at the demand line. Public reporting
              supports real scale: more than 10 million monthly users, record 2025 revenue, roughly KRW 2.8 trillion of
              transaction volume, and renewed first-half 2026 growth. But those same sources also show that the group
              remained loss-making in 2025 and that management itself tied the gap to reinvestment in 4910 and Amood.
              That means the company is not yet in a state where volume automatically guarantees durable group
              profitability. The operating model adds complexity. Official materials show merchant tooling and
              fulfillment operations, while Korea Herald frames Ably Pay as a rapidly scaling transaction layer. Each of
              those surfaces can deepen moat and monetization, but each also introduces its own failure modes:
              merchant-support breakdowns, poor recommendation or conversion quality, payments fraud or privacy errors,
              and cost overruns in expansion programs. Competitive context sharpens the issue. Korean fashion-market
              growth is modest, Chinese entrants remain aggressive, and sector peers are already leaning harder on
              coupons and marketing. The risk transmission path is therefore straightforward: if execution quality slips
              while promotions or compliance cost rises, ABLY can preserve GMV growth but still miss on profit
              conversion, cash visibility, or both.
