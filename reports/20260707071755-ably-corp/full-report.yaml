      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The company can be good without the price being good
            body: >-
              ABLY’s operating evidence is strong enough to justify continued diligence, but the public file still does
              not show enough valuation-quality detail to treat the current headline as obviously attractive.
            calloutType: recommendation
            claimRefs:
              - CV039
              - CV042
              - CV045
          - type: callout
            title: Cap-table opacity is the main reason not to force a decision
            body: >-
              The largest remaining valuation risk is not whether ABLY exists or whether users care; it is whether the
              private round economics and unit economics deserve anything close to the current implied multiple.
            calloutType: risk
            claimRefs:
              - CV041
              - CV045
              - CV049
