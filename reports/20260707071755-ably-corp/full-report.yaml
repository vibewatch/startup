      - number: '1.3'
        title: Capital Base, Scale Metrics, and Financial Performance
        blocks:
          - type: paragraph
            body: >-
              The strongest public capital marker is the December 2024 Alibaba investment. Multiple outlets align on the
              rough economics: 100 billion won for about a 5% stake, implying a valuation near 3 trillion won and giving
              Ably the label of South Korea’s first unicorn startup of 2024. The public file also implies a steep
              step-up from the roughly 900 billion won valuation cited for a January 2022 pre-Series C round. Ably’s own
              homepage currently claims 300 billion won of cumulative investment, but reviewed reporting does not prove
              whether the additional post-Alibaba fundraising management discussed ever closed. Operating performance is
              better documented. Company-linked and independent reports show 2023 turning profitable, 2024 revenue
              rising to roughly 334 billion won with 2.5 trillion won of GMV, and 2025 revenue reaching 369.7 billion
              won with GMV around 2.8 trillion won while losses narrowed sharply. Mid-2026 coverage adds another layer
              of momentum through Ably Pay and renewed first-half growth.
