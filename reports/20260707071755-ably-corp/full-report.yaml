        - Unified-cart aggregation, Jikjin Delivery, personalization, Kakao ecosystem trust
        - Less obvious premium-brand moat or exclusive inventory edge
      - - W Concept
        - Premium curated fashion and lifestyle
        - 2025 sales 119.5B won; 2026 profitability pressure; backed by Shinsegae
        - Designer-brand women and premium lifestyle shoppers
        - Editorial presentation, brand storytelling, lookbooks, premium-brand sourcing
        - Coupon and marketing intensity can erode premium economics
      - - 29CM
        - Premium curation and designer-brand platform
