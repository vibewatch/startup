      - - Musinsa
        - Fashion incumbent and lifestyle platform
        - ~4.5T won GMV, >1.24T won revenue, >100B won op profit in 2024
        - Broad fashion audience across men, women, kids, sports, and lifestyle
        - Private label, editorial content, strong brand network, international reach
