      - number: '1.2'
        title: Leadership, Governance, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              The public leadership file is thinner than the growth narrative. Reviewed company pages clearly identify
              Kang Seok-hoon as chief executive and locate the company in Seocho-gu, Seoul, while independent reporting
              adds the useful founder-market-fit point that he co-founded Watcha before starting Ably in 2018. Official
              materials also reference a CTO named Haneul and describe a distinctive internal operating model built
              around squads plus functional teams. Ably says that structure supports four strategic priorities—style
              portal, chain platform, global, and fintech—which aligns with the visible product portfolio and newer
              payment expansion. Culture disclosures further emphasize flexible work, aggressive performance
              orientation, and the abolition of the inclusive wage system in 2022. What is missing is equally important:
              reviewed public sources do not provide a board roster, debt schedule, or full executive bench. That keeps
              key-person dependence on Kang relatively high and leaves outside investors with limited visibility into
              governance mechanics.
