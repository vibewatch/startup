  'title': 'Competitors'
  'summary': 'Ablys real competitor set is broader than Zigzag and W Concept alone: Musinsa dominates local fashion scale, 29CM and W Concept compete for premium curation, Coupang and Naver own horizontal shopping habits, and Shein proves low-price entrants can gain users quickly. Ablys strongest public edge is an AI-led, category-expanding operating stack that stretches across Ably, 4910, and Amood, but public evidence still does not prove stronger take rates or switching costs than better-capitalized rivals.'
'sections':
- 'id': 'landscape-direct-peers-and-entrants'
  'title': 'Landscape: direct peers, premium curation, incumbents, and entrants'
  'body': 'Ablys competitive set is wider than the legacy frame of womens-fashion app versus other mall aggregators. The company now sits at the intersection of four overlapping arenas. First are the direct domestic womens-fashion peers that still compete for everyday discovery and conversion, with Zigzag remaining the closest operational analog and W Concept the clearest curated-premium contrast. Second are premium and fashion-first incumbents such as 29CM and especially Musinsa, whose scale and brand relationships give them stronger supply-side leverage than most app-led peers. Third are horizontal substitutes such as Coupang and Naver-linked rails that matter because Korean shoppers already spend most of their retail lives in mobile, comparison-heavy, multi-homing environments. Fourth are likely entrants or fast-rising external threats, especially Shein and potentially Shopee-style cross-border marketplace models. That broader frame matters because Ablys strongest reported wins so far
    come from scale and category expansion, while its most obvious vulnerabilities come from price pressure, incumbents with much deeper balance sheets, and shoppers who are willing to split attention across multiple apps.'
