companyProfile:
  summary: >-
    Ably Corp. is a private Seoul fashion-commerce company that has grown from the
    flagship ABLY women’s marketplace into a broader multi-app ecosystem spanning 4910,
    Amood, seller-management tools, fulfillment support, and newer fintech-adjacent
    surfaces such as Ably Pay. Public evidence supports real consumer scale, category
    leadership in Korean vertical commerce, and improving operating quality through 2025
    and the first half of 2026, but disclosure depth still looks private-company light
    relative to the public comps investors would naturally use to benchmark the business.
