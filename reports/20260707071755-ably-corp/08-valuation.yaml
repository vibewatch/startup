- id: public-comparables-and-the-current-multiple-gap
  title: Public comparables and the current multiple gap
  body: |-
    ABLY is not a perfect match for any single listed company, so the right approach is to use a comp corridor rather than a false one-to-one analog. Coupang is the cleanest Korea commerce reference because it is a local, listed scale platform with logistics intensity; PayPal matters because Ably Pay is part of the monetization upside story; Nu matters because the market has awarded it a much richer current-revenue multiple for fast-growth platform-fintech economics; and Adyen shows the outer edge of what premium payments-software quality can command. The retained comp set also includes Grab and Sea as adjacent context, which helps show that Asian platform analogs exist even if they are not clean pricing anchors in this run.

    Those public references produce a very wide band. Current sales multiples are roughly 1.0x for Coupang, 1.2x for PayPal, around 6.4x on Nu’s current revenue base, and above 11x for Adyen. Against that band, ABLY’s headline value implies about 8.1x trailing sales on 2025 revenue. That places ABLY well above commerce-like peers and still below the highest premium software-like outcome. In other words, the current price is not absurd if the business evolves toward higher-quality fintech and cross-border monetization, but it is clearly not conservative if ABLY remains primarily a promotion-heavy commerce platform.
