  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-round-terms
    missingEvidence: The signed Alibaba round term sheet, exact ownership percentage, any preference stack, and whether a follow-on KRW 100 billion raise actually closed.
    whyItMatters: Without exact security terms and dilution mechanics, the public KRW 3 trillion headline cannot be turned into reliable entry-price underwriting.
    diligencePath: Request cap-table snapshots, the Alibaba term sheet, any side letters, and an updated financing history through 2026.
    relatedQuestionRefs:
    - QV026
    - QV031
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Current take rate, gross margin, CAC, repeat behavior, NRR, seller concentration, and returns or subsidy burden by product line.
    whyItMatters: Those variables decide whether ABLY should be priced like a low-margin commerce platform or a higher-quality fintech-enabled marketplace.
    diligencePath: Request a segment P&L and cohort pack covering core ABLY, Ably Pay, 4910, and Amood.
    relatedQuestionRefs:
    - QV023
    - QV024
    - QV028
    - QV031
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: new-business-monetization
    missingEvidence: Stand-alone revenue, contribution margin, and cash needs for Ably Pay, 4910, and Amood.
    whyItMatters: The bull case depends on these adjacencies proving incremental rather than just narrative or marketing-intensive growth.
    diligencePath: Request business-line dashboards showing GMV, revenue, gross profit, active users, and payback by business.
    relatedQuestionRefs:
    - QV009
    - QV010
    - QV020
    - QV031
    relatedTableRefs:
    - TV003
    - TV006
