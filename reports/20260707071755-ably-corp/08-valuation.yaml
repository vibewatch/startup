- id: TV005
  title: Thesis-Break and Kill Triggers Table
  columns:
  - Trigger
  - Why it matters
  - Observable warning sign
  - Action implication
  rows:
  - - Growth stalls while market remains competitive
    - An 8x sales headline needs continuing operating momentum.
    - MAU or GMV growth stops outrunning category growth.
    - Re-rate toward lower commerce multiples.
  - - Adjacencies fail to monetize
    - The bull case depends on Ably Pay, 4910, and Amood improving revenue quality.
    - Strong user growth with no segment-level economic proof.
    - Treat the upside narrative as unproven and cut value expectations.
  - - Promotions hide weak margin quality
    - Free shipping and coupons can create scale without durable profit conversion.
    - Take-rate or gross-margin evidence disappoints once disclosed.
    - Move toward PayPal/Coupang-style bands or lower.
  - - Regulation tightens platform economics
    - Dark-pattern and platform-fairness rules can add friction and compliance cost.
    - New enforcement or broader platform obligations appear.
    - Add a policy discount and slow underwriting pace.
  - - Cap-table terms are investor-unfriendly
    - Preferences or a messy follow-on could weaken headline valuation quality.
    - Round math still cannot be reconciled after diligence.
    - Walk away from price-sensitive entry even if business quality remains good.
  notes: These are the few triggers most likely to move ABLY from an interesting company at a debatable price to an unattractive investment at that price.
