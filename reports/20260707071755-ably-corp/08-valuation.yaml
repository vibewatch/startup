- id: TV004
  title: Comparable Valuation Table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation status
  - Relevance
  - Limitation
  rows:
  - - Coupang
    - 2025 revenue $34.53bn; July 2026 market cap $34.37bn
    - ~1.0x sales
    - Closest listed Korean commerce platform with logistics and marketplace scale.
    - Broader retail and fulfillment footprint than ABLY.
  - - PayPal
    - 2025 revenue $33.17bn; July 2026 market cap $39.77bn
    - ~1.2x sales
    - Best public payments benchmark for Ably Pay upside.
    - Global payments processor, not a fashion marketplace.
  - - Nu Holdings
    - 2025 annual revenue $6.99bn; current revenue TTM $10.62bn; July 2026 market cap $68.35bn
    - ~6.4x on current revenue
    - Shows what the market pays for fast-growth platform-fintech economics.
    - Banking-led model and denominator sensitivity make it only a directional comp.
  - - Adyen
    - 2025 revenue 2.36bn EUR; July 2026 market cap $31.45bn
    - StockAnalysis-reported P/S ~11.21x
    - Useful ceiling for premium payments-software quality.
    - Much cleaner payments software economics than ABLY’s current public file.
  - - Grab / Sea context
    - Grab 2025 revenue $3.37bn; Sea IR retained
    - Context only, not an anchor in this run
    - Keeps an Asian platform lens in the peer set.
    - Current paired market-cap capture was incomplete in this retained run.
