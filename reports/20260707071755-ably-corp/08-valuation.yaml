    - Do not stretch on price without private diligence.
  - - Confidence
    - Medium
    - Core growth and scale are real, but cap-table and unit-economics disclosure remain incomplete.
    - Use scenario framing, not conviction underwriting.
  - - Risk rating
    - High
    - Competition, regulation, and monetization quality can all compress the headline quickly.
    - Require downside monitoring and hard kill criteria.
  - - Valuation stance
    - Fair-to-stretched
    - Current headline sits above commerce-like peers and below only premium software-like outcomes.
    - Insist on evidence-sensitive entry discipline.
  - - What would improve the call
    - Lower price or better data
    - Either a cheaper entry or stronger segment economics could justify a recommendation upgrade.
    - Revisit after data room review or a price reset.
