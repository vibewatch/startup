    severity: minor
    topic: comparable valuation table coverage
    missingEvidence: A fuller, filing-backed peer sheet including additional Asian commerce and fashion platforms with current valuation captures.
    whyItMatters: The current comp table is sufficient for scenario framing but not exhaustive enough to claim a complete peer set for ABLY.
    diligencePath: Extend the comp sheet with refreshed market-cap captures for Grab, Sea, and domestic listed analogs before investment committee pricing.
