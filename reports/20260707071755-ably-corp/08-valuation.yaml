- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Lens
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Scale
    - ABLY has already reached category-leading user and GMV scale.
    - Scale alone does not prove durable monetization quality.
    - Request segment margins and cohort retention.
  - - New engines
    - Ably Pay, 4910, and Amood can lift revenue quality beyond core marketplace fees.
    - They may still be promotion- or investment-heavy adjacencies.
    - Review stand-alone economics by business line.
  - - Market context
    - K-fashion and mobile commerce remain structurally large in Korea.
    - Overall market growth is not fast enough to hide weak economics.
    - Test share gains against category growth and promo spend.
  - - Pricing power
    - AI recommendations and seller tooling may support stickier monetization.
    - Free shipping, coupons, and operational services may indicate lower-margin pricing power.
    - Review take rate, subsidy burden, and seller concentration.
  - - Round quality
    - Alibaba backing validates strategic demand for the asset.
    - Headline round math and terms remain too opaque for clean underwriting.
    - Obtain the term sheet and updated cap table.
  notes: The anti-thesis is mainly about valuation quality and disclosure, not about whether ABLY is a real operating business.
