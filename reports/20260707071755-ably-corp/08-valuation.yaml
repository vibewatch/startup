- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Ask
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Alibaba round mechanics
    - Signed term sheet, exact ownership, preferences, any secondary mix
    - Needed to convert headline valuation into true entry math.
    - Request counsel package and updated cap table.
  - - Current segment P&L
    - Revenue, gross profit, and cash needs for core ABLY, Ably Pay, 4910, and Amood
    - Needed to test whether adjacencies lift or dilute valuation quality.
    - Request management reporting by business line.
  - - Unit economics
    - Take rate, gross margin, CAC, repeat behavior, returns, seller concentration
    - Needed to know which public multiple band ABLY deserves.
    - Request cohort and unit-economics dashboard.
  - - 2026 run-rate outlook
    - Current-quarter revenue bridge and operating plan
    - Needed to know whether 2025 trailing figures understate or overstate present economics.
    - Request board deck or current operating review.
  - - Regulatory exposure
    - Counsel view on dark-pattern, platform-fairness, and consumer-law exposure
    - Needed to bound downside risk from compliance and enforcement.
    - Obtain outside-counsel memo and management remediation plan.
  - - Exit readiness
    - Disclosure roadmap, audit depth, and readiness for public-style reporting
    - Needed to judge whether the company can earn a higher-quality valuation band over time.
    - Request CFO roadmap and reporting calendar.
  notes: If management cannot answer these asks, the investment case should remain on watchlist rather than move into price-taking conviction mode.
