company:
  name: Ably Corp.
chapter:
  number: 7
  title: Risks
  summary: ABLY’s risk stack is not a lack-of-demand story; it is the interaction of tightening Korean consumer and privacy rules with still-unproven group-level profitability and a widening operating graph across payments, seller tooling, and Japan expansion. Public evidence also shows real mitigants—scale, improving losses, merchant tooling, and an execution culture built around cross-functional ownership—but not enough disclosure to underwrite vendor concentration, control owners, or ABLY-specific legal history with high confidence.
sections:
- id: regulatory-and-legal-risk-stack
  title: Regulatory and legal risk stack
  body: 'ABLY’s most credible near-term external risk is regulatory tightening rather than sudden demand evaporation. Korean e-commerce law already imposes concrete duties around operator disclosure, escrow or consumer-damage compensation, order confirmation, and seven-day fulfillment and refund timing. On top of that baseline, 2025-2026 legal updates show the regime becoming more prescriptive for platform operators: dark-pattern restrictions are now in force, draft sub-regulations would add clearer review-disclosure standards and stronger repeat-offender penalties, and the domestic-agent framework for large foreign storefronts is being operationalized. Even where ABLY itself is a domestic company, those developments matter because its growth strategy increasingly touches cross-border seller flows, payments, and recommendation-led merchandising. Privacy enforcement is a second legal vector. PIPC’s public site is actively showcasing sanctions against scaled digital companies, which makes
    ABLY Pay and any consumer-data mishandling more material than a generic back-office concern. The absence of a retained public record showing ABLY-specific litigation or regulator action should not be over-read as proof of legal cleanliness; it only means the public file is thin. For underwriting, the practical implication is that interface design, reviews, refunds, data handling, and cross-border governance need to clear a rising compliance bar while the company is still expanding product surfaces.'
