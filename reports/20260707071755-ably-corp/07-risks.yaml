  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-risk-register
    missingEvidence: ABLY’s internal legal risk register, regulator correspondence history, and any private dispute log.
    whyItMatters: The public register captures the highest-severity visible risks, but it cannot prove whether ABLY already has unresolved investigations, notices, or edge-case obligations.
    diligencePath: Request the internal compliance register, outside-counsel memos, and any KFTC/PIPC correspondence from the last 24 months.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: vendor-concentration
    missingEvidence: Named cloud, logistics, payment-service-provider, insurer, and fraud-tool counterparties plus backup architecture.
    whyItMatters: A hidden single-point dependency could turn a technical or commercial outage into a revenue, refund, or regulatory event.
    diligencePath: Ask management for a counterparty concentration matrix, failover design, and SLA / incident history by critical vendor.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: payments-balance-sheet
    missingEvidence: Ably Pay reserve balances, fraud-loss rates, debt / warehouse exposure, and payments-related insurance cover.
    whyItMatters: Without reserve and loss data, investors cannot tell whether payment growth is creating hidden balance-sheet or fraud exposure.
    diligencePath: Review payment ledgers, reserve policies, insurance schedules, and fraud-loss reporting packs.
    relatedQuestionRefs:
    - QR027
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: External security certifications, pen-test summaries, incident log, and uptime / rollback history for ABLY’s commerce and payments stack.
    whyItMatters: The chapter can identify that quality and privacy matter, but it cannot verify whether operational controls are actually mature.
    diligencePath: Request ISO / SOC-style evidence, internal incident postmortems, and trust-and-safety / SRE dashboards.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: governance-ownership
    missingEvidence: Board roster, compliance org chart, named owners for refunds, reviews, privacy, Japan expansion, and incident escalation.
    whyItMatters: Culture alone does not prove accountability; investors need to know who owns each control surface as the operating graph widens.
    diligencePath: Request org charts, board materials, escalation playbooks, and RACI matrices for regulated workflows.
    relatedQuestionRefs:
    - QR019
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: material
    topic: ably-specific-legal-history
    missingEvidence: Any ABLY-specific lawsuit, IP dispute, regulator action, or settlement history that is not obvious in the public corpus.
    whyItMatters: The absence of visible public actions is not the same as a clean legal file, yet that distinction directly affects underwriting.
    diligencePath: Run counsel-led docket review, management legal questionnaire, and reps / warranties checklist focused on disputes and enforcement.
    relatedQuestionRefs:
