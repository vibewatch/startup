- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Regulatory / privacy action
    - Named KFTC or PIPC action involving ABLY or Ably Pay
    - Formal investigation, sanction, or corrective order
    - Pause underwriting until management provides timeline, controls, and financial exposure
  - - Group profitability slippage
    - Another full-year group loss without stronger cash disclosure
    - Losses persist while reserve, debt, and runway visibility stays thin
    - Move from conditional interest to research-more or avoid pending data room
  - - Adjacency stall
    - 4910, Amood, or Ably Pay momentum fades materially
    - Growth engine stops offsetting core-app maturity assumptions
    - Cut terminal-growth assumptions and reassess capital needs
  - - Vendor concentration surprise
    - Single PSP, logistics, or cloud concentration proves high
    - No tested backup or failover path for a critical dependency
    - Increase operational risk discount and require remediation plan
  - - Governance opacity
    - Board / compliance ownership remains undisclosed late in diligence
    - Management cannot name owners for refunds, reviews, privacy, and Japan controls
    - Treat governance as thesis-breaking at current disclosure level
  notes: These kill criteria are intentionally observable from diligence outputs rather than from private optimism or generic macro narratives.
