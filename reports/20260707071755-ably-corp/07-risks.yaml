- id: dependency-and-cross-border-execution
  title: Dependency and cross-border execution
  body: 'ABLY’s dependency profile is broader than a simple customer concentration question. The public record suggests several interlocking dependencies: continued merchant participation, healthy shopper engagement, sustained performance from adjacent products such as 4910 and Amood, and the credibility boost that came with Alibaba’s 2024 investment. None of those are singularly fatal today, but together they create a business that depends on many moving parts working at once. Amood illustrates the upside and the fragility. The export story appears real enough to matter—public reporting references around 25,000 Korean small-business sellers on the Japanese surface—but that also means product localization, merchant onboarding, settlement, returns, and regulatory handling have to work across borders. Meanwhile, the public source set does not identify ABLY’s cloud, logistics, payment-service-provider, or insurer concentration. That disclosure gap matters because the company’s consumer apps,
    seller operations, and payments stack all route through unseen counterparties. The capital side has a similar shape: Alibaba’s round remains a meaningful signal, yet the public file still does not provide listed-company style financing, reserve, or vendor-risk transparency. Investors should therefore think of dependency risk as a network problem, not a single-point problem: a stumble in sellers, counterparties, cross-border controls, or capital access can travel quickly into growth, reputation, and financing flexibility.'
