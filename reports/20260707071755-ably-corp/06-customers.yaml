  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: True NRR, GRR, churn, renewal, and contract-length metrics by flagship shoppers, 4910 users, Amood users, and seller cohorts.
    whyItMatters: Without durability metrics, ABLY's visible adoption scale cannot be translated into dependable revenue quality or customer lifetime value.
    diligencePath: Request monthly cohort tables and retention dashboards broken out by platform surface and by buyer versus seller cohort.
    relatedQuestionRefs:
    - QU021
  - type: missing-source
    severity: material
    topic: conversion-gap
    missingEvidence: A unified funnel from downloads or visits to active shoppers, placing buyers, active merchants, paid expansion, and retained cohorts.
    whyItMatters: Public adoption metrics are impressive, but investors still cannot see where value is created or lost between traffic, order conversion, and merchant monetization.
    diligencePath: Request management funnel data for flagship Ably, 4910, Amood, seller activation, and ABLY Pay attach rates.
    relatedQuestionRefs:
    - QU020
    - QU022
  - type: enumeration-incomplete
    severity: material
    topic: named-seller-proof
    missingEvidence: A fuller named-customer roster across the Korean flagship marketplace plus referenceable merchant case studies with GMV, tenure, and expansion details.
    whyItMatters: The current public file proves Japan seller activity, but it does not show whether ABLY's most valuable Korean merchants are durable, expanding, or concentrated.
    diligencePath: Request a merchant reference list split by flagship Ably, 4910 supply partners, and Amood exporters, plus permissioned calls with top merchants.
    relatedQuestionRefs:
    - QU014
    - QU023
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: concentration-gap
    missingEvidence: Top-customer, top-merchant, and top-brand revenue concentration by platform surface and geography.
    whyItMatters: A broad consumer brand can still have fragile economics if a small number of merchants, categories, or channels drive most of the revenue.
    diligencePath: Request top-10 merchant GMV share, top-category GMV share, and any merchant contributing more than 10% of platform revenue.
    relatedQuestionRefs:
    - QU023
    - QU026
    relatedTableRefs:
    - TU005
  - type: access-blocked
    severity: minor
    topic: privacy-surface
    missingEvidence: A directly accessible English privacy-regulator page and a readable legal commentary page tying current privacy enforcement more specifically to ABLY-style marketplace data practices.
    whyItMatters: Customer trust and cross-border scaling depend on compliant handling of personal and transaction data, but part of the legal source set was access-limited in the supplied cache.
    diligencePath: Refresh regulator and legal pages in a full fetch-enabled environment, then map any new privacy obligations to ABLY's app, seller, and export workflows.
    relatedQuestionRefs:
    - QU026
    relatedTableRefs:
    - TU006
