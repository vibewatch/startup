- id: TU006
  title: Customer trust and compliance friction table
  columns:
  - Rule / obligation
  - What the source says
  - Customer implication
  - Evidence status
  rows:
  - - Dark-pattern rules
    - Kim & Chang says Korea's amended E-Commerce Act now specifies obligations and prohibitions around dark patterns
    - Promotional UX and checkout design face higher compliance scrutiny
    - Verified legal analysis
  - - Review disclosure rules
    - Kim & Chang says draft sub-regulations clarify disclosure requirements for consumer reviews and increase penalties for repeat offenders
    - Merchants and marketplace surfaces need cleaner review provenance and moderation
    - Verified legal analysis
  - - Refund, cancellation, and complaint handling
    - FTC policy page says e-commerce brokerages must help resolve complaints and respect cancellation/refund rights
    - ABLY's buyer trust flows and seller processes need compliant after-sales support
    - Verified regulator guidance
  - - Domestic representative regime for overseas businesses
    - HwaWoo says Korea is clarifying domestic representative thresholds for foreign businesses
    - Cross-border growth can increase governance overhead and partner-management complexity
    - Verified legal analysis
  - - Platform-governance expansion
    - NBR says the Online Platform Fairness Bill would expand KFTC authority over platform business decisions
    - Marketplace governance costs could rise as ABLY scales multi-sided customer operations
    - Verified policy analysis
  notes: These rows do not prove ABLY non-compliance; they show why customer acquisition, reviews, and complaint handling deserve explicit diligence as the platform scales.
  claimRefs:
  - CU042
