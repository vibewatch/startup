- id: adoption-and-usage-trajectory
  title: Adoption trajectory is strongest on public usage and seller-base evidence
  body: 'The strongest customer evidence in this chapter is adoption scale. ABLY''s own homepage now claims 10 million MAU, 55 million cumulative downloads, more than KRW 2 trillion of annual transaction volume, and 100 million cumulative reviews, while a third-party report from BusinessKorea says Wise App measured 10.05 million monthly active users in May 2025 and unusually deep engagement: 660 million launches in the month and average monthly usage of one hour and one minute. That flagship strength appears to be extending into adjacent segments rather than remaining static. Korea Herald says 4910 reached 1.21 million MAU in the first half of 2026, and Financial Today says its 2030 user count was up about 8.5 times year over year with users in their 20s leading the mix. Japan is the clearest second engine: MK says Amood exceeded 6.5 million cumulative downloads and 4.25 million female users aged 14-29, while AFPBB says the marketplace crossed 25,000 sellers and posted repeat-customer and
    export-SKU growth. The public file therefore supports broad adoption depth even though it does not disclose conversion rates between these surfaces.'
