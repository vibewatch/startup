company:
  name: Ably Corp.
chapter:
  number: 6
  title: Customers
  summary: 'ABLY''s customer engine is multi-sided: the flagship app now has third-party-reported scale of 10.05 million MAU, 4910 is rapidly adding 2030 male users, and Amood combines 6.5 million Japan downloads with a 25,000-seller export channel and reported repeat-customer growth. Public evidence is much stronger for adoption and cross-border seller activation than for retention economics or concentration, while Shein-led competition and tighter Korean review and dark-pattern rules raise acquisition and compliance risk.'
sections:
- id: customer-base-segmentation
  title: Customer base segmentation across shoppers, sellers, and export participants
  body: 'ABLY''s public customer story is broader than a single women''s-fashion marketplace. The company''s own homepage frames ABLY as a seller-and-user style ecosystem, while the flagship app listing makes clear that the consumer offer spans fashion, beauty, and lifestyle with free shipping, coupons, and editorial or community content designed to keep shoppers inside the app. On the supply side, ABLY''s own retrospective says the company now connects micro sellers, mid-sized shopping malls, and designer brands across roughly 40,000 markets, and a dedicated seller-management app shows that merchants are expected to manage orders, inquiries, history, and customer marketing through ABLY''s tooling. The portfolio then adds two distinct segment wedges: 4910 for 2030 male fashion discovery and Amood for Japan-facing K-fashion discovery. Taken together, the visible buyer, user, and payer map spans domestic female shoppers, male shoppers, Korean merchants, Japanese end users, and Korean exporters
    using ABLY''s managed cross-border stack.'
