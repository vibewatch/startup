  - - Regulatory trust friction
    - Dark-pattern, review-disclosure, complaint-handling, and platform-governance rules can raise the cost of customer acquisition and merchant compliance
    - Request ABLY's internal readiness review for 2025-2026 Korean e-commerce rule changes
