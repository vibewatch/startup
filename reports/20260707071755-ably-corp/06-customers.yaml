callouts:
- calloutType: strength
  title: ABLY has already built a multi-surface customer engine
  body: The customer story is no longer just flagship-Ably scale. Public evidence now supports three demand surfaces — flagship Ably, 4910, and Amood — plus a seller-operations layer and a Japan export route, which is unusually broad for a fashion-platform company of this size.
  claimRefs:
  - CU011
  - CU016
  - CU017
  - CU020
  - CU026
  - CU039
- calloutType: risk
  title: Adoption is visible; durability is not
  body: ABLY discloses enough to prove broad usage, but not enough to prove revenue durability. The public file lacks NRR, GRR, churn, renewal, contract-length, and concentration disclosure, so investors still cannot translate headline MAU and seller counts into dependable customer quality.
  claimRefs:
  - CU031
  - CU035
  - CU036
  - CU044
- calloutType: risk
  title: Competition and Korean trust rules can both raise customer-acquisition cost
  body: 'Shein''s low-price push and tighter Korean rules on dark patterns, review disclosures, refunds, and complaints all point in the same direction: ABLY may need to spend more and operate more carefully to keep both shoppers and merchants growing at the current pace.'
  claimRefs:
  - CU040
  - CU042
  - CU043
