  rows:
  - - Flagship Ably shoppers
    - Buyer and primary user
    - Browse and buy fashion, beauty, and lifestyle items with community and content overlays
    - 10.05M MAU reported; 4.61M women in their 20s and 30s
    - Largest visible traffic and monetization surface
    - No public repeat-purchase, basket-size, or cohort data
  - - Korean ABLY sellers
    - User and payer to merchant tools; indirect payer via platform fees
    - List inventory, fulfill orders, answer inquiries, and run customer marketing
    - Seller app exists; company says ecosystem spans micro sellers to designer brands across ~40,000 markets
    - Core supply-side engine and likely driver of service revenue
    - No public seller count, fee take-rate, or seller retention by cohort
  - - 4910 shoppers
    - Buyer and primary user
    - AI-led male fashion discovery with promotions and free shipping
    - 1.21M MAU in H1 2026; 2030 user count up ~8.5x YoY
    - Extends domestic reach to male fashion demand without building a new merchant stack
    - No public buyer conversion, repeat-purchase, or monetization breakdown
  - - Amood Japan shoppers
    - Buyer and primary user
    - Discover and buy Korean fashion in Japan through localized app experience
    - 6.5M cumulative downloads; 4.25M female users 14-29; 46% demographic reach claim
    - Creates international demand channel for K-fashion inventory
    - No public disclosed CAC, repeat-order frequency, or country-level ARPU
  - - Amood sellers / exporters
    - User and economic beneficiary; likely fee payer through commerce services
    - Sell into Japan with translation, logistics, customs, and CS handled by ABLY
    - 25,000 sellers; SKU volume +20% YoY; open even to unregistered individual sellers
    - Most tangible cross-border land-and-expand surface
    - No public top-seller concentration, export take-rate, or seller retention
