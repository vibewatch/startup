- id: retention-durability-and-trust-gaps
  title: Retention, durability, and trust remain the thinnest parts of the public file
  body: 'ABLY''s public customer evidence is rich on top-of-funnel and platform-usage metrics, but sparse on durability metrics that matter most to investors. No reviewed source disclosed NRR, GRR, churn, renewal rate, contract length, or cohort retention for the flagship app, 4910, Amood, or the seller base. The best repeat-use proof instead comes from Japan, where AFPBB reports repeat-customer growth of 15% and MK reports a 20% rise in preference actions, while BusinessKorea attributes long flagship session time partly to content features such as webtoons, AI chat, and community. Those are useful engagement proxies, but they are not substitutes for true retention or revenue-quality disclosure. The same applies to promotions: both the flagship app and 4910 emphasize free shipping, coupons, and discounts, which likely help retention but also imply a consumer relationship partly supported by incentives rather than by disclosed cohort stickiness. This chapter therefore treats retention economics
    and customer-trust visibility as explicit diligence gaps rather than as quantities that can be safely inferred from usage scale alone.'
