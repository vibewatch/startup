- id: named-customer-proof-and-production-maturity
  title: Named customer proof is real in Japan, but thin on independently verified enterprise references
  body: 'Public named customer proof is not strongest on the Korean flagship side; it is strongest in the Japan export motion. MK names multiple Korean brands and shopping malls that used Amood to sell into Japan, and it gives transaction-growth figures for Benhit, Mucent, Crasian, Modimud, and Black Up. Those examples matter because they move the file beyond logos or app-download counts into concrete seller outcomes tied to a live commercial channel. AFPBB complements that proof by showing a 25,000-seller base, repeat-customer growth, and explicit access for individual sellers without business registration. The seller-management app adds another operational proof layer by showing that ABLY merchants have mobile tooling for orders, inquiries, and customer marketing. Even so, the public file is still incomplete on account-level durability: it does not name large flagship merchants on the Korean marketplace, give referenceable contract economics, or publish customer-satisfaction cohorts for
    merchants. The result is a file that proves real production activity, especially in Japan, but still leaves diligence work on merchant quality and concentration.'
