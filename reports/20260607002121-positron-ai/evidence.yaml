evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: financials
    missingEvidence: >-
      Annual recurring revenue, revenue run rate, gross margin percentage, and net revenue retention rate for Positron
      AI.
    whyItMatters: >-
      Revenue and margin data are prerequisite for valuation analysis, multiple assessment, and comparison to analogous
      hardware startups.
    diligencePath: Request financial data-room access; triangulate via customer contract values and number of Atlas units shipped.
    relatedQuestionRefs:
      - QO007
      - QO027
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Current employee count and organizational structure below the three named principals.
    whyItMatters: Headcount and org depth are indicators of execution capacity for the Asimov tape-out and Titan system build.
    diligencePath: LinkedIn headcount aggregation; data-room request for current org chart and VP-level team composition.
    relatedQuestionRefs:
      - QO008
      - QO028
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board composition, investor governance rights, preference stack, and liquidation waterfall.
    whyItMatters: Without board and cap table data, control allocation and downside protection for new investors cannot be assessed.
    diligencePath: Cap table and board composition from data room; review NVCA-standard Series A/B terms via legal diligence.
    relatedQuestionRefs:
      - QO004
      - QO011
  - type: missing-source
    severity: material
    topic: performance-claims
    missingEvidence: >-
      Independent third-party benchmark of Atlas versus Nvidia H100/H200 conducted by a party with no financial
      relationship to Positron.
    whyItMatters: >-
      Company-published performance figures and Dylan Patel's SemiAnalysis commentary are from financially interested
      parties; independent validation would significantly raise claim confidence.
    diligencePath: Commission or locate an MLPerf-style independent benchmark; review Cloudflare's internal trial results.
    relatedQuestionRefs:
      - QO006
      - QO018
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: roadmap
    missingEvidence: >-
      Independent confirmation of Asimov tape-out timeline and any contractual commitments from foundry or packaging
      partners.
    whyItMatters: Asimov tape-out is the single critical-path event for the Titan system and for justifying the Series B valuation.
    diligencePath: >-
      Obtain foundry/packaging partner term sheets or contracts; review internal design milestones in engineering due
      diligence.
    relatedQuestionRefs:
      - QO017
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Systematic adverse-event search: litigation, SEC investigation, employment disputes, patent challenges, or
      government regulatory actions involving Positron AI.
    whyItMatters: >-
      Absence of public adverse records does not confirm non-occurrence; hardware IP and employment disputes are common
      in FPGA-to-ASIC transitions.
    diligencePath: PACER litigation search; USPTO patent assignment/dispute search; Delaware / Nevada UCC and court filings.
    relatedQuestionRefs:
      - QO020
      - QO021
  - type: private-evidence-only
    severity: minor
    topic: founders
    missingEvidence: >-
      Identity of the potential third founder implied by the about page description of 'a visionary, an applied
      mathematician, and an engineer'.
    whyItMatters: An undisclosed founder could have dilutive equity claims or governance rights not apparent from public filings.
    diligencePath: Review Delaware incorporation filings; request cap table to verify founding equity allocation.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: minor
    topic: investors
    missingEvidence: >-
      QIA and Arm strategic investor terms: geographic supply commitments, exclusivity, IP licensing, preferred pricing,
      or co-investment obligations.
    whyItMatters: Strategic terms could create constraints on Positron's ability to serve other sovereign or technology partners.
    diligencePath: Review Series B investment agreement for side letters and strategic commitments with QIA and Arm.
    relatedQuestionRefs:
      - QO013
      - QO014
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: >-
      Full milestone log including internal product milestones, unreported customer deployments, and any undisclosed
      adverse or governance events not captured in public press releases.
    whyItMatters: >-
      Milestone coverage in TO004 relies on company-issued communications; internal or adverse events that were not
      publicly disclosed are excluded.
    diligencePath: >-
      Request internal milestone tracker and board-meeting summaries; cross-reference with data-room documents during
      diligence.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: minor
    topic: investors
    missingEvidence: >-
      Full cap table ownership percentages, pro-rata rights, and secondary holder details for the stakeholder map in
      TO003.
    whyItMatters: >-
      Without exact ownership stakes and governance rights, economic control allocation among the 10 named investors
      cannot be assessed.
    diligencePath: Request full cap table and Series B investment agreement from Positron AI data room during diligence.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: blocking
    topic: SAM-SOM-sizing
    missingEvidence: >-
      Positron's SAM and SOM estimates, production capacity, current revenue run rate, and customer-count figures have
      not been publicly disclosed.
    whyItMatters: >-
      Without revenue or volume data, the sizing analysis cannot confirm whether Positron has reached commercial scale
      sufficient to validate the market thesis; the SAM estimate in this chapter is based on inferred constraints rather
      than commercial evidence.
    diligencePath: >-
      Request Atlas unit shipment volumes, revenue run rate, and customer count under NDA; cross-check against Jump
      Trading and Cloudflare deployment scale.
    relatedQuestionRefs:
      - QM022
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: inference-TAM-sizing
    missingEvidence: >-
      No independent source separates inference-only accelerator spend from total AI accelerator spend (training +
      inference + custom ASICs); published TAM figures conflate these categories.
    whyItMatters: >-
      The $120B–$180B inference-specific TAM estimate is derived with explicit assumptions; if inference represents a
      lower share of total accelerator spend than assumed, the addressable market is proportionally smaller.
    diligencePath: >-
      Seek IDC or Gartner inference-specific sub-segmentation; monitor public reporting from hyperscaler earnings calls
      on inference vs. training capex breakdown.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: Groq-revenue-data
    missingEvidence: >-
      Groq has not publicly confirmed its 2025 revenue projection miss; the $500 million figure cited in this chapter is
      from VentureBeat reporting attributed to sources, not Groq's own disclosure.
    whyItMatters: >-
      The Groq revenue miss is used as adverse evidence for inference hardware market volatility; if the figure is
      inaccurate, the risk signal is overstated.
    diligencePath: Monitor Groq investor communications; seek additional independent confirmation of 2025 revenue actuals.
    relatedQuestionRefs:
      - QM013
  - type: stale
    severity: minor
    topic: export-control-regulatory-status
    missingEvidence: >-
      The BIS replacement framework for the rescinded AI Diffusion Rule had not been published as of the runDate
      (2026-06-07); the regulatory environment remains in flux.
    whyItMatters: >-
      The new framework could materially change Positron's export compliance burden and its competitive advantage as a
      U.S.-fabricated silicon vendor.
    diligencePath: >-
      Monitor BIS Federal Register publications; track Congressional action on RASA (H.R. 2683) and any successor to the
      AI Diffusion Rule.
    relatedQuestionRefs:
      - QM014
  - type: private-evidence-only
    severity: material
