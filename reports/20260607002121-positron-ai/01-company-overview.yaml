slug: positron-ai
runDate: '2026-06-07'
company:
  name: Positron AI
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Positron AI is a Reno, Nevada-based AI inference hardware startup founded in spring 2023 that has raised over $305
    million, including a $230 million Series B in February 2026 at a post-money valuation exceeding $1 billion. The
    company sells the Atlas FPGA-based inference accelerator—claimed to deliver 3.5× performance per dollar versus
    Nvidia's H100—and is developing the Asimov custom ASIC and Titan next-generation system targeting production in
    early 2027. Cloudflare and Jump Trading serve as anchor customers and, in Jump's case, a co-lead Series B investor,
    providing strong customer validation; however, revenue, headcount, and independent performance corroboration remain
    undisclosed.

sections:
  - id: identity-product-model
    title: Identity, product, and business model
    body: >
      Positron AI describes itself as a purpose-built AI inference hardware company whose mission is to make
      transformer-model inference dramatically cheaper and more energy-efficient. The company is headquartered in Reno,
      Nevada, with a remote-first team distributed across the United States. It was founded in the spring of 2023—a
      date corroborated by the company's own "about" page and multiple press reports—making it approximately 38 months
      old as of the June 2026 run date.

      The business model is hardware product sales: Positron designs and sells inference accelerator systems to cloud
      providers, enterprises, and inference-heavy operators. The flagship product, Atlas, is a first-generation
      transformer inference server built around Altera Agilex FPGA silicon fabricated and assembled in the United
      States. Atlas is marketed on three key metrics versus Nvidia's H100: 3.5× better performance per dollar, up to
      66% lower power consumption, and 93% memory bandwidth utilization versus 10–30% typical for GPU-based systems.
      Customers load any HuggingFace Transformers-compatible model via drag-and-drop and serve it through an
      OpenAI-API-compatible endpoint with no code changes required.

      The company is building a two-product roadmap beyond Atlas. Asimov is a custom ASIC silicon chip designed
      memory-first around LPDDR5x rather than HBM; it targets 864 GB to 2.3 TB of memory per chip, a 2.76 TB/s
      realizable bandwidth, and air-cooled operation at ~400W TDP. Titan is the next-generation system built on four
      Asimov chips, targeting 8+ TB of memory per server and support for up to 16-trillion-parameter models. Both
      products are listed as "coming in 2027" on the Positron website as of the run date. The company's strategic
      rationale is that modern transformer inference is memory-bound rather than compute-bound, and that GPUs—designed
      for training—are inefficient vehicles for production inference at scale.

      Positron emphasizes Made-in-America supply chain as both a differentiator and a national-security argument, and
      positions itself as an alternative for customers seeking to reduce Nvidia dependency amid GPU supply constraints,
      rising inference costs, and grid power limitations.
