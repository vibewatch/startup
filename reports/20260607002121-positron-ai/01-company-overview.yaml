    title: Key-person concentration in two founders and one hired CEO
    body: >-
      Strategy, technical vision, fundraising, and enterprise credibility concentrate in Thomas Sohmers, Edward
      Kmett, and Mitesh Agrawal. The board composition, depth of the VP layer, and succession planning are
      undisclosed. Departure of any of the three would likely impair Asimov execution or commercial momentum.
    claimRefs:
      - CO013
      - CO015
      - CO019
