      - CO021

  - calloutType: risk
    title: Asimov tape-out is the single critical-path milestone for Series B deployment
    body: >-
      The $230 million Series B is explicitly allocated to accelerate the Asimov and Titan roadmap. Asimov
      tape-out, targeted for late 2026, has not yet occurred as of the run date. A delay would compress the
      production timeline toward 2028 and expose Positron to a window where Atlas alone must sustain growth
      against competitors with newer silicon.
