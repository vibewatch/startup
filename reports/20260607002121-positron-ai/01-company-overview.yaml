  - id: milestones-adverse
    title: Milestones, adverse events, and competitive context
    body: >
      Positron's milestone record is among the fastest public execution timelines for an FPGA-to-ASIC inference
      company. The company went from founding to first prototype in approximately 8 months, from prototype to shipped
      product in an additional 7 months, and from shipped product to Series A in approximately another 13 months—all
      with a team of fewer than 20 people. The Series B followed the Series A by approximately 7 months.

      No adverse legal, regulatory, or governance events are disclosed in public sources. The leadership transition
      from Sohmers as CEO to Agrawal as CEO (with Sohmers remaining as CTO) is the most significant structural change
      in the company's history; it appears to have been orderly and was framed as a positive hire, not a forced
      change, but independent evidence for the circumstances is limited. VentureBeat noted that Groq, where Sohmers
      previously worked, reduced its 2025 revenue projection from $2 billion to $500 million—a signal of how volatile
      the AI hardware market can be and a relevant analog risk for Positron.

      Performance claims remain company-published and partially validated only by a financially interested advisor
      (Dylan Patel, SemiAnalysis) and by one production customer (Jump Trading) under specific workloads. The Asimov
      chip has not yet taped out; targeted tape-out in late 2026 and production in early 2027 create a single
      critical-path execution risk that will determine whether the Series B capital is deployed effectively.
