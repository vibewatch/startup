    title: Performance claims remain company-published and partially validated only
    body: >-
      Atlas performance metrics (3.5× perf/dollar vs H100, 93% bandwidth utilization, 3× lower latency) are
      Positron-issued and validated in production only by Jump Trading under specific trading workloads and
      by Cloudflare in an ongoing trial whose results have not been published. The primary public third-party
      validator, Dylan Patel of SemiAnalysis, is a disclosed investor and advisor, limiting his independence.
