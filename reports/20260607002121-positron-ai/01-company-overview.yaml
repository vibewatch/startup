  - id: traction-metrics-gaps
    title: Customer traction, scale metrics, and evidence gaps
    body: >
      Positron's publicly confirmed customer base includes Cloudflare and Parasail (via its SnapServe platform). The
      company's about page and multiple investor communications also reference customers in networking, gaming, content
      moderation, CDN, and Token-as-a-Service verticals without naming them. Cloudflare's deployment is described by
      its head of hardware as meeting a "deep technical evaluation" threshold that only one other unnamed startup had
      previously warranted; the stated condition for wider global deployment is that Atlas must "deliver the advertised
      metrics." Jump Trading's validation is the strongest public third-party proof point: the firm deployed Atlas in
      production, observed roughly 3× lower end-to-end latency versus H100 on trading inference workloads, and then
      co-led the Series B.

      Headcount, revenue, run-rate, ARR, gross margin, and NRR are entirely undisclosed. The company was 15 people
      at month 15 and the about page and press materials do not provide a more recent headcount figure. Positron
      describes itself as remote-first, with headquarters in Reno, Nevada. GitHub activity (the positron-ai org
      has repositories including aiperf, guidellm, hf-litmus, and forks of transformers and llama.cpp) confirms
      active engineering work but does not indicate team size.

      Performance claims are company-published figures that have not been independently replicated by third-party
      benchmarking institutions. Dylan Patel of SemiAnalysis—an advisor and investor—provided commentary validating
      the memory approach but did so as a disclosed financial stakeholder, which limits its weight as independent
      corroboration. Cloudflare is conducting trials but has not published results. These are material gaps that
      downstream chapters must carry as open diligence questions.
