  - id: founders-leadership-key-person
    title: Founders, leadership, and key-person dependence
    body: >
      Positron was co-founded by two people: Thomas Sohmers (CTO) and Edward Kmett (Chief Scientist). Sohmers
      previously served as Director of Technology Strategy at Groq—a competing AI inference chip company—giving him
      direct experience with the architecture choices and customer requirements of the inference market. Kmett is an
      applied mathematician known in the functional-programming and compiler-design communities, providing the
      mathematical underpinning for Positron's memory-optimization approach. The company's "about" page describes the
      founding story as a collaboration across "a visionary, an applied mathematician, and an engineer," suggesting a
      third co-founder or early key technical contributor; this is unresolved in public evidence.

      Mitesh Agrawal joined as CEO at approximately month 21 of the company's existence—roughly late 2024 or early
      2025—stepping in as Sohmers transitioned from CEO to CTO. Agrawal was previously COO of Lambda, an
      Nvidia-ecosystem AI cloud provider, where he helped scale the company from approximately $500,000 to nearly
      $500 million in annualized revenue run rate and participated in raising hundreds of millions in capital. His
      hire is a structural inflection: Positron added a seasoned commercial operator with direct knowledge of
      large-scale GPU-customer economics at a moment when it needed to convert early engineering credibility into
      enterprise sales and fundraising momentum.

      Key-person concentration is a material concern. Agrawal is the primary commercial face—the CEO who announced
      both the Series A and Series B, appears in all major press interviews, and is quoted in official investor
      releases. Sohmers owns the technical credibility that drives customer evaluation decisions (Cloudflare's
      "deep technical evaluation" context and Jump Trading's due diligence). Kmett's role appears to be scientific
      architecture rather than daily operations, but his departure would weaken the chip-design intellectual
      foundation. The board composition, governance structure, and depth of the executive team below these three
      are not publicly disclosed, which limits the ability to assess succession risk.
