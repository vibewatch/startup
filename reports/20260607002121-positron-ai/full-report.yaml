      - number: '3.5'
        title: Switching costs, lock-in, and moat durability
        blocks:
          - type: paragraph
            body: >
              Positron's competitive moat is structurally asymmetric: weaker in the developer/cloud-API segment,
              stronger in the specialized on-premise enterprise segment. In the cloud-API segment, Positron does not
              offer a competing cloud service, so developer workloads naturally flow to GroqCloud, SambaCloud, or
              Cerebras Inference API, all of which offer lower-friction onboarding (API key, no procurement cycle) and
              OpenAI-compatible interfaces. Switching costs between these cloud providers are low: all offer compatible
              Python/JavaScript SDKs, usage-based billing, and spot capacity. Positron's FPGA Atlas cannot currently
              compete for cloud-API developer workloads.

              In the on-premise enterprise segment, hardware switching costs are substantially higher. Once Atlas is
              deployed and integrated into a customer's data pipeline—as with Cloudflare and Jump Trading—the effort to
              swap hardware involves procurement cycles, re-rack, re-test, and model re-optimization. Positron's
              HuggingFace-compatible drag-and-drop model loading and OpenAI-API endpoint compatibility reduce
              software-level switching costs, which is a double-edged sword: it lowers the initial evaluation barrier
              but also makes it easier for customers to compare and switch later.

              Supply chain access and partner relationships are a secondary moat dimension. Positron's relationship with
              Altera (Intel's FPGA division) for Agilex FPGA silicon and its US-manufactured claim create supply chain
              narrative differentiation, especially given executive-order-driven emphasis on the "American AI Stack"
              (cited in Groq's own marketing). However, Groq also emphasizes domestic supply chain credibility, and
              SambaNova's Intel collaboration provides a more direct manufacturing partner relationship than Positron
              has disclosed.

              Commoditization risk is real. The inference accelerator market is converging on a common set of claims
              (memory bandwidth, air cooling, TCO advantage over GPU) and table-stakes features (OpenAI-compatible API,
              HuggingFace model compatibility, enterprise security). As Groq, Cerebras, SambaNova, and Tenstorrent all
              offer these features, Positron's differentiation narrows to: (a) on-premise deployment model, (b) Asimov
              ASIC roadmap execution, and (c) US-supply-chain positioning. The first is a shrinking moat as cloud APIs
              improve; the second is a future bet that is as yet unfunded relative to Groq's $6.9 B and Cerebras's $6.38
              B IPO raise; the third is a narrative differentiator that has not yet translated to measurable pricing
              power or customer lock-in in disclosed deals.

              Multi-homing is common across all AI inference buyers: enterprises typically test multiple providers
              before standardizing. Positron's strongest lock-in vector is the Asimov/Titan roadmap: a customer who
              deploys Atlas and commits to the Asimov transition (planned 2027) will have deeper workflow integration
              and organizational knowledge investment. But this lock-in requires Asimov to ship on time and match its
              performance claims—an execution risk that has no independent corroboration as of the research date.
            claimRefs:
