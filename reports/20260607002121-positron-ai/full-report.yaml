      - number: '7.3'
        title: Partner, customer, and ecosystem dependencies are strategically helpful but still concentrated
        blocks:
          - type: paragraph
            body: >-
              Positron's early partner graph is high quality, but concentration remains unmistakable. The public record
              still revolves around three named relationships: Cloudflare, Jump Trading, and Parasail. Each is valuable,
              yet each also has a caveat. Cloudflare is a marquee customer in exactly the power-constrained distributed
              environment Positron wants, but the most specific public language still describes a long qualification
              process with larger rollout contingent on performance. Jump is the strongest proof point because it
              started as a customer and became a co-lead investor after testing Atlas, but it is also a very specific
              buyer persona with latency-sensitive trading workloads rather than a broad enterprise reference base.
              Parasail is an attractive channel-like partner because it already serves 500B+ tokens daily across a
              model-agnostic GPU network, but that same hardware diversity means the relationship is unlikely to be
              exclusive. Beyond named customers, Positron's own releases point to Arm, Supermicro, and other
              supply-chain partners, while its software strategy deliberately works around rather than against the
              Nvidia-trained model ecosystem. That reduces switching friction, but it also means Positron still depends
              on third-party platforms, buyer approvals, and ecosystem behavior that it does not control.
            claimRefs:
