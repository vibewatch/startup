      - number: '7.4'
        title: Capital intensity and model-risk are amplified by valuation and stronger rival balance sheets
        blocks:
          - type: paragraph
            body: >-
              The financial risk here is less near-term insolvency than mismatch between valuation, capital needs, and
              how quickly the market may move underneath the roadmap. Positron has raised just over $300M and reached a
              $1B+ valuation, which is meaningful support for a young hardware company, but the roadmap still requires
              tape-out, production ramp, customer qualification, and field execution in a brutally expensive segment.
              Jon Peddie says the company has spent about $38M to date and reports purchase orders above that amount,
              yet the public record still does not disclose gross margin, backlog quality, customer concentration by
              revenue, or whether current purchase orders convert into repeat production demand. Benchmark credibility
              matters because the valuation implicitly assumes Atlas traction and Asimov/Titan roadmap conversion. At
              the same time, the market can compress from two sides. AIM Media's adverse thesis argues that smaller
              models may shrink the addressable need for frontier-memory inference hardware, while better-capitalized
              rivals continue to close distribution and manufacturing gaps. SambaNova's 2026 announcements pair new
              capital with Intel and named production deployments, illustrating how quickly execution comparisons can
              become unforgiving. If Positron slips on schedule or proof, the capital requirement of catching up can
              rise faster than customer trust.
            claimRefs:
              - CR026
