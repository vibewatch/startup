        - id: market-tailwind
          label: Inference market and power bottlenecks are real
          detail: Analysts describe 2026 as inference-led and constrained by power, capital, and memory.
          tone: positive
        - id: financial-gap
          label: Revenue-quality pack is missing
          detail: No public revenue, gross-margin, backlog, or burn disclosure supports the round price.
          tone: warning
        - id: roadmap-gate
          label: Asimov/Titan schedule is the main swing factor
          detail: Late-2026 tape-out and early-2027 production remain roadmap claims, not delivered facts.
          tone: warning
        - id: track-call
          label: TRACK
          detail: Public evidence supports plausibility, but not conviction underwriting at current price.
          tone: neutral
        - id: buy-upgrade
          label: Upgrade only after diligence and milestone proof
          detail: Cap table, customer expansion, benchmark validation, and manufacturing economics must clear.
          tone: positive
      edges:
        - from: funding-proof
          to: product-proof
        - from: product-proof
          to: market-tailwind
        - from: market-tailwind
          to: financial-gap
        - from: financial-gap
          to: roadmap-gate
        - from: roadmap-gate
          to: track-call
        - from: track-call
          to: buy-upgrade
    approximationNotes: >-
      This is a decision framework rather than a weighted model; it makes explicit why recommendation quality is limited
      by missing diligence rather than by lack of market interest.
    claimRefs:
      - CV001
      - CV005
      - CV013
      - CV015
      - CV030
      - CV033
      - CV040
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      Illustrative valuation bands move more on milestone delivery and competitive pressure than on any published
      revenue number, because the public record lacks a full financial model.
    data:
      items:
        - label: Current round reference
          value: 1000
          detail: Minimum disclosed threshold from the Series B announcement.
          tone: neutral
        - label: On-time Asimov tape-out
          value: 1250
          detail: Supports base-case durability if roadmap execution remains intact.
          tone: positive
        - label: Independent benchmark validation
          value: 1400
          detail: Would strengthen pricing power and commercialization credibility.
          tone: positive
        - label: No broadening beyond lighthouse users
          value: 850
          detail: Customer concentration keeps the round from compounding.
          tone: warning
        - label: Six-month roadmap slip
          value: 700
          detail: Delay increases financing risk before custom silicon is validated.
          tone: warning
        - label: Incumbent or peer pricing compression
          value: 650
          detail: Transparent token pricing from peers can narrow upside quickly.
          tone: negative
    approximationNotes: >-
      Values are analyst decision bands anchored to the disclosed round threshold, peer pricing pressure, and roadmap
      milestones; they are not implied market prices from a disclosed financial model.
    claimRefs:
      - CV001
      - CV025
      - CV027
      - CV028
      - CV033
      - CV035
      - CV037
      - CV039
      - CV044
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      The scenario range shows why the current disclosed price is watchable but not obviously mispriced: upside exists,
      yet the downside band widens quickly if milestones fail.
    data:
      items:
        - label: Reset / down-round risk
          low: 250
          mid: 375
          high: 500
          displayValue: $250-$500M
          detail: Roadmap delay plus weak commercialization can force a pricing reset.
          tone: negative
        - label: Bear case
          low: 500
          mid: 650
          high: 800
          displayValue: $500-$800M
          detail: Small-model mix shift, incumbent bundling, and execution slippage compress value.
          tone: warning
        - label: Base case
          low: 900
          mid: 1100
          high: 1300
          displayValue: $900-$1,300M
          detail: Round holds if Atlas proof broadens and roadmap timing mostly stays intact.
          tone: neutral
        - label: Bull case
          low: 1500
          mid: 1750
          high: 2000
          displayValue: $1,500-$2,000M
          detail: Requires on-time Asimov plus broader commercial proof and continued peer appetite.
          tone: positive
    approximationNotes: >-
      The range is milestone-based because public evidence does not disclose revenue or security terms; midpoints
      represent rough underwriting anchors, not expected values.
    claimRefs:
      - CV001
      - CV034
      - CV037
      - CV038
      - CV039
      - CV040
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: >-
      The scorecard highlights a familiar late-stage hardware asymmetry: market opportunity and product ambition are
      strong, but financial transparency and capital-structure visibility remain weak.
    data:
      items:
        - label: Market opportunity
          value: 8 / 10
          detail: Analyst sources support a large and growing inference-led semiconductor market.
        - label: Product proof
          value: 6 / 10
          detail: Shipping Atlas and named customers help, but proof remains narrow and mostly company-authored.
        - label: Financial transparency
          value: 3 / 10
          detail: Revenue, margin, backlog, and burn remain undisclosed publicly.
        - label: Valuation support
          value: 5 / 10
          detail: The round is plausible relative to peers, but not clearly cheap at the disclosed threshold.
        - label: Exit readiness
          value: 4 / 10
          detail: Strategic investors help, yet liquidity timing is still speculative and disclosure-light.
        - label: Recommendation
          value: TRACK
          detail: Watch for diligence closure and roadmap delivery before sizing an investment.
    approximationNotes: >-
      Scores are qualitative IC aids derived from the evidence base in this chapter, not a house model or standardized
      rating system.
    claimRefs:
      - CV013
      - CV015
      - CV024
      - CV029
      - CV030
      - CV040
      - CV041
