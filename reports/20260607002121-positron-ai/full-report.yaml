  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation, buyer, user, and payer
        blocks:
          - type: paragraph
            body: >-
              The public customer record points to a clear but narrow segmentation pattern. Positron is not presenting
              Atlas as a mass-market developer API; it is presenting a hardware-plus-serving stack for operators who
              already run meaningful inference workloads and care about power, latency, and deployment fit. The likely
              buyer is an infrastructure or platform owner, the immediate user is an ML platform or performance
              engineering team, and the payer is an enterprise or cloud procurement budget rather than an individual
              developer credit card. The named examples align with that framing. Cloudflare is a globally distributed
              network and application-services operator with edge and CDN economics to protect. Parasail is closer to a
              channel-like platform customer that turns hardware into downstream AI endpoint products. Jump Trading is a
              latency-sensitive trading operator where power envelopes, time-to-deploy, and performance per watt matter
              economically. Positron also claims unnamed traction in networking, gaming, content moderation, CDN, and
              Token-as-a-Service accounts, but those logos and workloads are not enumerated publicly, so the segment map
              is credible in direction and thin in denominator.
