        title: Revenue Model and Pricing
        blocks:
          - type: paragraph
            body: >-
              Positron's primary revenue mechanism is direct hardware sales of the Atlas inference server system to
              enterprise, cloud, and specialized computing customers. The company sells a purpose-built 2U server
              housing eight Positron Archer FPGA-based accelerators with 256 GB of HBM total memory and a 2 kW power
              envelope. Revenue is recognized at the point of hardware delivery, consistent with a standard
              capital-equipment sale. A bundled 24-hour SLA support contract serviced by a Washington-/US-based team
              accompanies each system, implying a modest attached services stream alongside the hardware transaction. No
              cloud-API, token-based, or consumption pricing model has been publicly announced by Positron. However,
              partner Parasail offers SnapServe LLM hosting at $30–$60 per month per end-user tier, powered by Atlas
              hardware, suggesting Positron captures value upstream as a hardware supplier while partners build
              recurring downstream services. No public list pricing for Atlas has been disclosed; procurement requires
              direct engagement with Positron's sales team via a contact-sales form on the website. For context, cloud
              inference API competitors charge $0.075–$0.79 per million input tokens (Groq), free-to-enterprise
              subscription tiers (Cerebras), and SambaNova's SambaCloud API pricing—none of which are directly
              comparable to an on-premise hardware sale, but which define the cost-per-token economics a buyer must
              weigh when choosing a deployment model.
