      - number: '4.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer-to-Investor Signal Validates GTM Trajectory
            body: >-
              Jump Trading's progression from Atlas customer to co-lead Series B investor is among the strongest GTM
              validation signals available at this stage. The firm's CTO publicly reported approximately 3x lower
              end-to-end latency versus H100 in production evaluation, and Jump subsequently committed capital at
              co-lead scale. This compressed sales-to-investment cycle signals that technical conviction and commercial
              demand are real, not marketing-driven. For underwriters, the key question is whether this pattern is
              replicable across a broader set of enterprise customers at meaningful volume.
            calloutType: strength
            claimRefs:
              - CI017
              - CI018
          - type: callout
            title: Private-Company Opacity Is the Primary Diligence Blocker
            body: >-
              Positron has not publicly disclosed revenue, ARR, gross margin, cash balance, burn rate, or unit economics
              in any form. The entire financial underwriting rests on proxy indicators—customer logos, investor quality,
              and benchmark performance claims—rather than audited or management-reported financials. While this is
              normal for a $305M-raised, Series B-stage hardware startup, it means no judgment on revenue quality,
              margin trajectory, or capital adequacy is possible without a data room. This is the blocking issue for any
              diligence effort at the current stage.
            calloutType: risk
            claimRefs:
              - CI010
              - CI039
          - type: callout
            title: Groq Revenue Volatility Is a Direct Sector Adverse Signal
            body: >-
              Groq's reduction of its 2025 revenue projection from over $2 billion to approximately $500 million
              highlights the structural volatility of the AI inference hardware market. Even a well-funded, dedicated
              inference chip company with $750M+ raised can face dramatic revenue shortfalls. For Positron, this signals
              that customer concentration risk, demand volatility, and competitive pricing pressure from GPU incumbents
              are real execution risks. The absence of a diversified revenue base or disclosed customer count makes it
              impossible to assess whether Positron faces similar concentration dynamics.
            calloutType: risk
            claimRefs:
              - CI028
              - CI002
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition in customer workflow terms
        blocks:
          - type: paragraph
            body: >-
              Positron’s public product surface is more than a chip pitch: the homepage describes a workflow in which a
              customer starts with a Hugging Face Transformers model or trained checkpoint, uploads or links weights
              into a Positron Model Manager, and then repoints applications to an OpenAI-compatible endpoint. Atlas is
              the shipping product in that workflow today, with the support site reinforcing API-led access and the
              Atlas page adding concrete system specifications, bundled support, and a production-serving footprint. In
              customer terms, Positron is trying to remove the software migration tax that usually blocks accelerator
              adoption: buyers keep model assets, keep OpenAI-style client semantics, and swap the serving substrate
              underneath. The named public workflows fit power-constrained, latency-sensitive environments such as
              Cloudflare-style distributed AI services, Parasail’s token-serving stack, and Jump Trading’s
              latency-sensitive inference use case. The gap is that public materials describe the happy path more
              clearly than the operating path: model lifecycle controls, authentication design, tenant isolation, and
              deployment runbooks are not documented with the same specificity as the hardware and compatibility
              narrative.
