            body: >-
              Durability is where the chapter stays cautious. No reviewed source discloses renewal rates, contract
              length, churn, net revenue retention, or even a customer count. That means the public record cannot
              separate one-time technical evaluations from repeatable revenue behavior. The best qualitative durability
              signal is Jump Trading moving from customer to investor after testing Atlas, because that implies
              conviction that goes beyond a marketing proof-of-concept. Parasail also looks durable at the partner level
