      - number: '4.4'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              Positron has raised approximately $305 million across three rounds: a $12.5 million seed (2023–2024), a
              $51.6 million Series A (July 2025, total 2025 capital over $75 million), and a $230 million Series B
              (February 4, 2026) at a post-money valuation exceeding $1 billion. The Series B was oversubscribed and
              co-led by ARENA Private Wealth, Jump Trading, and Unless, with strategic investment from Qatar Investment
              Authority (QIA), Arm Holdings, and Helena. Use of proceeds is designated for Asimov ASIC development
              (tape-out targeting late 2026, production early 2027), Atlas deployment scale-up, and team growth. No cash
              on hand, monthly burn rate, or remaining runway has been publicly disclosed. Based on comparable
              early-stage semiconductor startups undertaking custom ASIC development cycles, estimated monthly burn
              likely ranges from $8–20 million per month, implying a rough runway estimate of 18–36 months from the
              February 2026 close—though this is an analyst estimate with no public data to anchor it. No credit
              facility, equipment financing, project finance, or debt obligation has been publicly disclosed. Positron
              claims it expects strong revenue growth in 2026, though no specific revenue trajectory, ARR target, or
              milestone trigger for a next round has been disclosed. The company's capital intensity is high relative to
              pure software peers: custom ASIC development, US-domestic manufacturing relationships, and a hardware
              supply chain require sustained capital availability well before revenue from Asimov/Titan can materially
              offset operating expenses.
            claimRefs:
