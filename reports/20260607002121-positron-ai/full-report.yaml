            body: >-
              Trust and quality evidence is where the public record thins out. Positron does publish a support surface
              and a headline OpenAI-compatible API message, and Atlas lists a 24-hour SLA from a Washington/US-based
              team. But the fetched support and GitHub materials do not show public documentation for administrative
              APIs, role models, audit logging, key rotation, tenant controls, uptime commitments beyond the support
