chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and business model
        blocks:
          - type: paragraph
            body: >
              Positron AI describes itself as a purpose-built AI inference hardware company whose mission is to make
              transformer-model inference dramatically cheaper and more energy-efficient. The company is headquartered
              in Reno, Nevada, with a remote-first team distributed across the United States. It was founded in the
              spring of 2023—a date corroborated by the company's own "about" page and multiple press reports—making it
              approximately 38 months old as of the June 2026 run date.

              The business model is hardware product sales: Positron designs and sells inference accelerator systems to
              cloud providers, enterprises, and inference-heavy operators. The flagship product, Atlas, is a
              first-generation transformer inference server built around Altera Agilex FPGA silicon fabricated and
              assembled in the United States. Atlas is marketed on three key metrics versus Nvidia's H100: 3.5× better
              performance per dollar, up to 66% lower power consumption, and 93% memory bandwidth utilization versus
              10–30% typical for GPU-based systems. Customers load any HuggingFace Transformers-compatible model via
              drag-and-drop and serve it through an OpenAI-API-compatible endpoint with no code changes required.

              The company is building a two-product roadmap beyond Atlas. Asimov is a custom ASIC silicon chip designed
              memory-first around LPDDR5x rather than HBM; it targets 864 GB to 2.3 TB of memory per chip, a 2.76 TB/s
              realizable bandwidth, and air-cooled operation at ~400W TDP. Titan is the next-generation system built on
              four Asimov chips, targeting 8+ TB of memory per server and support for up to 16-trillion-parameter
              models. Both products are listed as "coming in 2027" on the Positron website as of the run date. The
              company's strategic rationale is that modern transformer inference is memory-bound rather than
              compute-bound, and that GPUs—designed for training—are inefficient vehicles for production inference at
              scale.

              Positron emphasizes Made-in-America supply chain as both a differentiator and a national-security
              argument, and positions itself as an alternative for customers seeking to reduce Nvidia dependency amid
              GPU supply constraints, rising inference costs, and grid power limitations.
