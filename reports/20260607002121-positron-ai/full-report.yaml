              to co-lead investors demonstrate both technical conviction and commercial commitment. Jump's CTO publicly
              reported approximately 3x lower end-to-end latency versus an H100-based system in production evaluation.
              The Series B's oversubscription and the participation of Qatar Investment Authority (QIA) and Arm Holdings
              as strategic investors suggests emerging pipeline in sovereign AI infrastructure and ecosystem partnership
              channels. Competitor SambaNova's $350M Series E in February 2026 and IDC's forecast of approximately $600
              billion in global hyperscaler capex for 2026 confirm the underlying demand backdrop supporting Positron's
              sales thesis. No channel, reseller, marketplace, or API cloud sales have been publicly announced. Sales
              cycle length, customer acquisition cost (CAC), average contract value (ACV), or net revenue retention
