  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal uncertainty is rising faster than Positron's public compliance record
        blocks:
          - type: paragraph
            body: >-
              Export-control risk is now a first-order diligence item for any advanced-computing vendor, and Positron's
              roadmap pushes it closer to the center of that risk pool. The external environment is moving quickly: BIS
              expanded advanced-computing and AI-model-weight controls in January 2025, lawyers tracking the rule
              changes say foundries, packaging partners, and remote-access/IaaS operators now face more explicit
              diligence burdens, and the policy structure itself already shifted again when BIS started rescinding the
              AI Diffusion Rule while preserving earlier chip controls and adding new red-flag guidance. That makes the
              risk less about a single prohibited shipment and more about recurring classification, screening,
              certification, and counterparty-monitoring work. Positron's public materials emphasize American
              manufacturing, future custom silicon, and strategic investors, but the reviewed sources do not expose a
              comparable public export-compliance program, ECCN disclosure, or buyer-screening process. For a startup
              trying to sell into cloud, trading, and potentially international sovereign or regulated environments, the
              compliance gap can slow deals even before it creates enforcement exposure. The legal/IP side is also
              underdeveloped in public evidence: public patent-search surfaces reviewed here did not yield a clearly
              reviewable Positron patent corpus, so moat and freedom-to-operate need direct diligence rather than
              assumption.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR042
              - CR045
