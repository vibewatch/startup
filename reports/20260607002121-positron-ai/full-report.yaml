  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Adjacencies, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The market boundary for Positron AI is the AI inference accelerator segment within the broader AI
              semiconductor and data center infrastructure market. Included spend covers dedicated hardware for running
              trained AI models in production—custom inference accelerators, inference-optimized servers, and the
              associated memory subsystems. Excluded spend includes AI training clusters, general-purpose CPU/GPU
              procurement not intended for inference, consumer-device neural processing units, and autonomous-vehicle
              chips. The relevant adjacency is the broader intelligent data center segment, which IDC estimates at $281
              billion in 2026 across CPUs, AI accelerators, GPUs, custom ASICs, and networking silicon; Positron
              addresses only the inference-focused subset.

              Status-quo substitutes are important to define correctly because they reveal the actual switching decision
              buyers face. The dominant substitute is NVIDIA GPU infrastructure—H100, H200, and Blackwell-series systems
              that support both training and inference workloads within a single CUDA ecosystem. Cloud-hosted inference
              APIs (e.g., AWS Bedrock, Google Vertex, Azure AI) represent a second substitute: enterprises that have not
              yet built on-premises AI infrastructure pay per token to a hyperscaler instead of deploying hardware.
              CPU-based inference using quantized or distilled models is a third substitute relevant for low-throughput
              or cost-constrained workloads. Custom hyperscaler ASICs (Google TPU, Amazon Trainium/Inferentia, Microsoft
              Maia, Meta MTIA) are a fourth substitute that captures budget from the largest cloud operators but is
              unavailable to enterprise buyers.

              Positron's pitch is that each of these substitutes fails on one or more of three constraints that are
              hardening as inference workloads scale: (1) power density—NVIDIA Hopper and Blackwell systems increasingly
              require liquid cooling, excluding them from air-cooled data center fleets; (2) memory capacity—transformer
              inference on large context windows and multi-trillion-parameter models exhausts GPU memory faster than HBM
              supply can fill; and (3) cost per token—GPU economics at inference scale are worse than
              inference-optimized LPDDR-based architectures for memory-bound workloads. These three constraints define
              Positron's serviceable addressable market as the subset of AI inference deployment where power, memory, or
              economics rule out the dominant GPU substitute.
