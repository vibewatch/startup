      - number: '1.3'
        title: Funding history, investors, and valuation
        blocks:
          - type: paragraph
            body: >
              Positron has raised just over $305 million across three disclosed financing events. The seed round
              totalled approximately $23.5 million; the company's about page indicates it had raised less than $6
              million by month 8 and less than $12.5 million by month 15, with the full seed amount announced separately
              before the Series A. The Series A was a $51.6 million oversubscribed round announced on July 28, 2025, led
              by Valor Equity Partners, Atreides Management, and DFJ Growth, with additional participation from Flume
              Ventures (which includes Scott McNealy), Resilience Reserve, 1517 Fund, and Unless. Dylan Patel, founder
              of SemiAnalysis, is listed as both an advisor and an investor.

              The Series B, announced on February 4, 2026, raised $230 million at a post-money valuation exceeding $1
              billion, making Positron a unicorn approximately 34 months after founding. The round was co-led by ARENA
              Private Wealth, Jump Trading, and Unless, and included new strategic investors Qatar Investment Authority
              (QIA), Arm Holdings, and Helena. All Series A investors—Valor, Atreides, DFJ Growth, Resilience Reserve,
              Flume, and 1517—also participated. The oversubscription of both rounds is a positive signal, as is the
              conversion of Jump Trading from customer to co-lead investor after deploying Atlas in production and
              observing ~3× lower latency versus comparable H100-based systems on trading inference workloads.

              The strategic composition of the Series B is notable: QIA brings sovereign AI infrastructure interest
              (announced at Web Summit Qatar); Arm brings a technology-partnership angle given Asimov's use of ARMv9
              cores on-chip; and Jump Trading brings a high-frequency-trading customer validation that is difficult to
              replicate in a purely financial deal. Together these signal that Positron has successfully attracted
              participants with non-financial motivations to commit at Series B scale.

              Revenue, EBITDA, and ARR are not publicly disclosed. The company describes itself as expecting "strong
              revenue growth in 2026" and positions itself to become one of the fastest-growing silicon companies ever,
              but these are company-issued forward statements without third-party verification. The exact cap table,
              pro-rata rights, preference stack, and board composition are undisclosed for a private company.
