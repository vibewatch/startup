      - number: '8.3'
        title: 'Scenario ranges and price sensitivity: valuation depends more on milestones than on disclosed financials'
        blocks:
          - type: paragraph
            body: >-
              Because Positron has not publicly disclosed revenue, gross margin, backlog, burn, or the economics of the
              Series B security, any scenario range has to be milestone-based rather than presented as false-precision
              multiple math. The key sensitivity is not whether the market likes inference in the abstract; it is
              whether Positron can turn a shipping Atlas narrative into repeatable commercial proof before the
              custom-silicon transition consumes more capital. The upside case requires three things to happen together:
              Atlas deployments need to widen beyond lighthouse accounts, Asimov has to hit late-2026 tape-out with
              credible early-2027 production, and buyers need to keep paying for power-efficient alternatives instead of
              defaulting back to incumbent GPU stacks. The base case assumes the company keeps its strategic value but
              does not yet prove enough to materially expand the round mark. The bear case is easy to sketch from public
              evidence: smaller-model adoption weakens demand for giant-memory systems, CUDA and incumbent bundling keep
              switching costs high, and any tape-out delay pushes the company back into capital raising before the
              roadmap is validated. In that framework, price sensitivity is sharp: modest execution misses can erase
              much of the notional upside from buying at the current disclosed threshold.
