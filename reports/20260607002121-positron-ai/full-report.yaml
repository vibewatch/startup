      - number: '3.4'
        title: Incumbent response and platform substitutes
        blocks:
          - type: paragraph
            body: >
              Nvidia remains the overwhelmingly dominant force in AI infrastructure. The Blackwell GPU architecture is
              the current flagship for both training and inference, with the data center platform offering end-to-end
              support for AI inference across frameworks (PyTorch, TensorRT, ONNX), orchestration (NIM microservices,
              Triton Inference Server), and hardware (H100/H200/B100/B200). Nvidia's competitive moat rests on four
              pillars: installed base (the vast majority of AI clusters worldwide run Nvidia GPUs), software ecosystem
              (CUDA has a decade of developer investment), supply chain (TSMC HBM allocation, NVLink/NVSwitch
              connectivity), and enterprise sales infrastructure. Nvidia's inferencing platform claims up to 10×
              performance improvement for frontier MoE models; while Positron claims 3.5× perf/dollar over H100,
              Nvidia's Blackwell successor may erode that gap. The incumbent's primary weakness relative to specialized
              inference chips is GPU architecture over-optimization for training (compute-dense,
              memory-bandwidth-limited for inference), which is the core thesis Positron, Groq, Cerebras, and SambaNova
              all exploit.

              AMD's Instinct MI series (MI300, MI325, MI350) targets the same data center AI acceleration market. AMD
              has a GPU software ecosystem advantage over custom ASICs via ROCm (PyTorch/HIP compatibility) and OEM
              distribution through Dell, HPE, and SuperMicro. AMD's financial data (via ir.amd.com) confirms its data
              center segment as a high-growth segment with strong public reporting. The Instinct product page returned a
              404 error during research, reflecting a possible URL migration, but product availability is confirmed via
              OEM channels.

              Intel's Gaudi 3 AI accelerator is Intel's inference play. The Gaudi 3 PCIe card (HL-338) uses standard
              Ethernet networking rather than NVLink/NVSwitch, avoiding proprietary fabric lock-in, and offers 33% more
              I/O connectivity per accelerator versus H100. Intel positions Gaudi 3 on PyTorch integration and open
              standards. Intel's strategic investment in SambaNova (Series E participation) creates a dual-track
              incumbent response: Gaudi 3 as a standalone GPU alternative plus SambaNova's RDU systems as the
              inference-optimized layer. This is adverse to Positron because it increases Intel's distribution reach
              into the inference-specialized segment that Positron targets.

              Cloud-native inference substitutes—GroqCloud, SambaCloud, Cerebras Inference API, AWS Inferentia, Google
              Cloud TPU, and Azure AI—represent the largest substitute class. Enterprises that run inference via API
              have zero hardware procurement friction and can switch providers with minimal code changes (all major
              inference API providers offer OpenAI-compatible endpoints). This is the most important competitive dynamic
              for Positron's developer-facing go-to-market: the availability of high-performance cloud APIs with
              negligible switching costs raises the hurdle for on-premise hardware adoption and limits Positron's
              addressable market to buyers with specific privacy, latency (on-premise), or cost-at-scale arguments.
