  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and taxonomy
        blocks:
          - type: paragraph
            body: >
              Positron AI operates at the intersection of two overlapping competitive markets: the on-premise AI
              inference accelerator hardware market (custom silicon servers sold direct to enterprise and cloud buyers)
              and the cloud-hosted AI inference API market (pay-as-you-go access to accelerated inference).
              Understanding which competitive bucket a given buyer is operating in materially changes the comparison
              set.

              Within on-premise inference hardware, the direct peer set includes Groq (LPU-based custom ASIC racks),
              Cerebras (Wafer-Scale Engine systems, now publicly listed), SambaNova (RDU dataflow chips), Tenstorrent
              (RISC-V-based AI accelerators with the Galaxy system), and d-Matrix (3DIMC chiplet in-memory compute in
              PCIe form factor). All target transformer inference workloads and share the thesis that GPUs are
              architecturally mismatched to inference workloads because they optimize for compute rather than memory
              bandwidth. Nvidia, AMD (Instinct MI series), and Intel (Gaudi 3) are the incumbent GPU and GPU-adjacent
              platform incumbents; they command the overwhelming majority of installed base and software ecosystem
              loyalty.

              The cloud-API substitutes—GroqCloud, SambaCloud, Cerebras Inference API, and hyperscaler GPU
              clouds—compete for the same developer and enterprise inference budget without requiring the buyer to
              deploy hardware at all. This segment represents the primary switching-cost challenge for Positron:
              OpenAI-compatible APIs from Groq, Cerebras, and SambaNova let developers migrate workloads in two lines of
              code, creating low software-layer lock-in. For on-premise buyers, hardware switching costs are higher and
              Positron's differentiation (memory bandwidth, air cooling, US-manufactured supply chain, privacy) is more
              durable.

              Status-quo and build-alternative positions also matter. Many enterprises have not yet deployed specialized
              AI inference hardware at all—they are running inference on existing GPU clusters or on public cloud GPU
              instances (AWS Inferentia, Google TPU, Azure AI Accelerators). Internal-build is not a credible
              alternative for most customers given chip development costs, but large hyperscalers (Google, Amazon,
              Microsoft) have proprietary silicon that competes indirectly. The competitive map below covers direct
              peers, incumbent accelerator platforms, and cloud-API substitutes; it excludes hyperscaler proprietary
              silicon, which is not available for external purchase.
