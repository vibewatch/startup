      - number: '8.2'
        title: >-
          Financing context and comparable support: the round sits inside a hot inference market, but still far behind
          scaled peers
        blocks:
          - type: paragraph
            body: >-
              Positron benefits from issuing stock into a market that still rewards inference infrastructure, but the
              comparable set also shows how much proof remains missing. IDC and TechInsights both describe 2026 as a
              year when inference, datacenter scale, and power efficiency are moving to the center of AI hardware
              spending. Research and Markets' startup roundup and Polaris' AI-chip commentary both point to sustained
              funding for inference-centric challengers, while Groq and SambaNova show that late-stage private capital
              is still available for companies that can convert architecture narratives into commercial traction. Groq's
              September 2025 round valued that company at $6.9 billion, Cerebras completed an IPO in May 2026, and
              SambaNova raised more than $350 million in fresh strategic capital in February 2026. On that backdrop,
              Positron's $1B+ mark is not facially absurd. But the public comps are also more mature or more
              transparent. NVIDIA's fiscal 2026 filing discloses $215.9 billion of revenue and detailed risk factors,
              while MarketBeat and SEC surfaces show AMD, Intel, and Arm all maintain regular public filing cadence and
              therefore give investors liquidity and disclosure that Positron does not. The practical conclusion is that
              the round price is supportable as a strategic milestone, yet still exposed if execution slips because the
              company has not earned the disclosure premium that public peers enjoy.
