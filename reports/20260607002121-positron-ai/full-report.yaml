      - number: '3.2'
        title: 'Primary funded peers: Groq and Cerebras'
        blocks:
          - type: paragraph
            body: >
              Groq is Positron's most directly analogous competitor in terms of architecture philosophy and
              go-to-market. Founded in 2016 and headquartered in Mountain View, California, Groq pioneered the LPU
              (Language Processing Unit), a custom ASIC with hundreds of megabytes of on-chip SRAM as primary weight
              storage rather than cache. The LPU uses static scheduling via a custom compiler, single-core architecture,
              and direct chip-to-chip connectivity via a plesiosynchronous protocol, achieving deterministic execution
              at low latency. Groq has raised $750 million (September 2025) at a post-money valuation of $6.9
              billion—roughly seven times Positron's post-Series B valuation—with investors including Disruptive,
              BlackRock, Neuberger Berman, Samsung, and Cisco. The company claims to power more than two million
              developers and Fortune 500 companies via GroqCloud, and publicly named customers include McLaren Formula
              1, GPTZero (10 M+ users), StackAI, and Stats Perform. Groq offers Free/Developer/Enterprise API tiers with
              token-based pricing starting at $0.05/M input tokens for Llama-3.1-8B; Developer and Enterprise tiers add
              rate limits, prompt caching, and performance guarantees. Notably, GroqCloud is a cloud-first API product:
              Groq monetizes through API usage, not hardware sales, placing it in a different GTM lane than Positron's
              on-premise hardware model.

              Critically for Positron, VentureBeat has reported that Groq reduced its 2025 revenue projection from $2
              billion to $500 million—a signal that even the best-funded inference startup faces volatile demand
              conversion. This is relevant context for Positron's own revenue ramp assumptions.

              Cerebras Systems is the best-capitalized AI inference hardware competitor. Founded in 2015, Sunnyvale,
              California, it builds the Wafer-Scale Engine (WSE-3), the world's largest chip at 58× the die size of a
              leading GPU. Cerebras claims inference up to 15× faster than GPU-based solutions and ran at over 1,200
              tokens per second for GPT-5.3-Codex-Spark via a partnership with OpenAI. The company completed its IPO on
              May 14, 2026, listing on Nasdaq (CBRS) at $185/share and closing with $6.38 billion in gross proceeds,
              becoming the most significant hardware AI IPO to date. Pre-IPO investors included Sam Altman, Ilya
              Sutskever, Andy Bechtolsheim, and Lip-Bu Tan (Intel CEO). Enterprise customers include AlphaSense (6,500+
              enterprise clients using Cerebras for real-time research synthesis), with additional deployments in
              medical research, cryptography, energy, and government. Cerebras offers Free/Developer/Enterprise API
              tiers plus Code Pro and Code Max subscription plans. As a publicly listed company, Cerebras has
              significantly more capital access, public market accountability, and institutional sales infrastructure
              than Positron.
