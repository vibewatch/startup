  - id: market-sizing
    title: TAM, SAM, and SOM — Multiple Sizing Lenses
    body: >-
      Three independent lenses are available for sizing the AI inference accelerator market, and they converge on a
      large but imprecisely bounded opportunity. IDC's April 2026 forecast places the full data center semiconductor
      market at $477.1 billion in 2026, with the intelligent data center sub-segment—CPUs, accelerators, GPUs, custom
      ASICs, and networking—at $281 billion. TechInsights independently projects data center accelerator markets
      specifically past $300 billion in 2026, driven by the shift from training to inference deployment. By 2030, IDC
      projects data center semiconductor revenues reaching $843.2 billion, roughly half the entire semiconductor market.

      The TAM for AI inference accelerators can be estimated by triangulation. If IDC's $477.1 billion data center
      semiconductor market includes approximately 60% spend on logic/accelerators (IDC data), and inference is
      estimated to be growing to represent at least half of that by 2027 (per analyst consensus), the inference
      accelerator TAM in 2026 is in the range of $120–$180 billion. TechInsights explicitly labels accelerator markets
      "past $300B" which likely includes the broader GPU training market. The ResearchAndMarkets 2026–2036 AI chips
      report covers a multi-hundred-billion-dollar total market but does not provide a single authoritative year-one
      figure. These estimates carry significant methodological limitations: TAM figures from analyst reports typically
      include all AI accelerator spend (training + inference + custom ASIC programs), and the inference-only slice is
      not cleanly separable from public data.

      Positron's SAM is substantially smaller than the headline TAM. The SAM is bounded by the subset of inference
      deployments that are: (a) air-cooling-compatible (excluding hyperscale data centers requiring liquid cooling),
      (b) CUDA-ecosystem-migratable (buyers able to trial non-NVIDIA inference hardware), and (c) memory-bound
      workloads where LPDDR architecture outperforms HBM in total-cost-of-ownership analysis. Positron itself does not
      publish SAM estimates. Given confirmed deployments at Cloudflare and Jump Trading—both constrained buyers who
      prioritize power efficiency and memory bandwidth over general-purpose GPU flexibility—the SAM maps most cleanly
      onto inference workloads in CDN/edge, financial services, and enterprise inference providers, representing an
      estimated low-single-digit percentage of the TAM in 2026 with expansion potential as Asimov silicon ships.

      Positron's SOM depends on Atlas production capacity and sales velocity, neither of which is publicly disclosed.
      The $230 million Series B is framed as enabling a ramp toward one of the fastest-growing silicon companies in
      history, but no revenue or customer-count figures have been confirmed. These contradictions—large TAM, unclear
      SAM, and undisclosed SOM—are preserved as evidence gaps rather than resolved through estimation.
