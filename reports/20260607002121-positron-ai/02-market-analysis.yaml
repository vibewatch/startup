  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: SAM-SOM-sizing
      missingEvidence: >-
        Positron's SAM and SOM estimates, production capacity, current revenue run rate, and customer-count figures
        have not been publicly disclosed.
      whyItMatters: >-
        Without revenue or volume data, the sizing analysis cannot confirm whether Positron has reached commercial
        scale sufficient to validate the market thesis; the SAM estimate in this chapter is based on inferred
        constraints rather than commercial evidence.
      diligencePath: >-
        Request Atlas unit shipment volumes, revenue run rate, and customer count under NDA; cross-check against
        Jump Trading and Cloudflare deployment scale.
      relatedQuestionRefs:
        - QM022
      relatedTableRefs:
        - TM002
    - type: conflicting-data
      severity: material
      topic: inference-TAM-sizing
      missingEvidence: >-
        No independent source separates inference-only accelerator spend from total AI accelerator spend (training +
        inference + custom ASICs); published TAM figures conflate these categories.
      whyItMatters: >-
        The $120B–$180B inference-specific TAM estimate is derived with explicit assumptions; if inference represents
        a lower share of total accelerator spend than assumed, the addressable market is proportionally smaller.
      diligencePath: >-
        Seek IDC or Gartner inference-specific sub-segmentation; monitor public reporting from hyperscaler earnings
        calls on inference vs. training capex breakdown.
      relatedQuestionRefs:
        - QM006
      relatedTableRefs:
        - TM002
    - type: missing-source
      severity: material
      topic: Groq-revenue-data
      missingEvidence: >-
        Groq has not publicly confirmed its 2025 revenue projection miss; the $500 million figure cited in this
        chapter is from VentureBeat reporting attributed to sources, not Groq's own disclosure.
      whyItMatters: >-
        The Groq revenue miss is used as adverse evidence for inference hardware market volatility; if the figure
        is inaccurate, the risk signal is overstated.
      diligencePath: >-
        Monitor Groq investor communications; seek additional independent confirmation of 2025 revenue actuals.
      relatedQuestionRefs:
        - QM013
    - type: stale
      severity: minor
