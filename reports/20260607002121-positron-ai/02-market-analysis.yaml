  - id: buyer-segmentation
    title: Buyer, User, and Payer Segmentation and Adoption Path
    body: >-
      Positron's buyer universe is better understood through confirmed deployments and target-customer signals than
      through a generic enterprise segmentation. The company's announced customers span three observable buyer archetypes.

      The first archetype is the power-constrained infrastructure operator. Cloudflare—a global CDN and security
      network with distributed, air-cooled data centers—is a confirmed early customer. Cloudflare head of hardware
      Andrew Wee has publicly stated that AI energy demands are unsustainable and that Positron Atlas has warranted
      the most in-depth evaluation of any startup chip in the company's history. Budget ownership sits with the head
      of hardware and the infrastructure capital allocation process. The adoption trigger is per-unit power cost and
      air-cooling compatibility, not theoretical peak performance.

      The second archetype is the performance-sensitive financial and quantitative computing firm. Jump Trading co-led
      the Series B after first becoming an Atlas customer. Jump CTO Alex Davies cited 3x lower end-to-end latency versus
      H100-based systems on its specific inference workloads as the deciding technical factor. Budget ownership is with
      the CTO and technology infrastructure function. The adoption trigger is latency-per-dollar, not raw throughput.

      The third archetype is the AI-native Token-as-a-Service or inference API provider. Positron reports deployments
      across networking, gaming, content moderation, CDN, and token-as-a-service verticals—categories where inference
      is continuous and cost per token is directly tied to unit economics. Budget ownership is with engineering and
      infrastructure leads. The adoption trigger is cost efficiency at high throughput.

      The adoption path is hardware-led with a typical arc of: (1) trial/benchmark phase (customer tests Atlas against
      incumbent H100 on a specific workload), (2) production pilot (limited deployment in one data center or rack),
      (3) scaled deployment contingent on matching or exceeding claimed economics, and (4) potential investment or
      long-term supply agreement (as evidenced by Jump Trading's co-lead). Positron's Atlas is a drop-in replacement
      supporting Hugging Face transformer models via OpenAI-compatible endpoints, reducing integration friction.
      The main adoption constraint at this phase is ecosystem trust: customers have limited evidence of Positron's
      multi-year hardware roadmap reliability and post-sale support depth relative to established NVIDIA relationships.
