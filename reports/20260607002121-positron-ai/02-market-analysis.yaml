  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - driver/constraint
      - direction
      - timing
      - implication for Positron
      - diligence ask
    rows:
      - - Transformer inference is memory-bound, not compute-bound
        - Driver
        - Current (structural)
        - Positron's memory-first LPDDR architecture is architecturally aligned with dominant workload profile
        - Independent benchmark replication of claimed 93% memory bandwidth utilization vs 10-30% GPU baseline
      - - Energy availability bottleneck in data centers
        - Driver
        - Current and worsening
        - Air-cooled, lower-power Atlas systems can deploy in data centers that reject liquid-cooled GPU racks
        - Quantify addressable installed base of air-cooled data center capacity globally
      - - HBM memory supply pre-committed through 2026
        - Driver
        - 2025–2026 horizon
        - LPDDR-based Positron avoids HBM supply chain; reduces buyer dependency on constrained HBM allocation
        - Monitor HBM supply normalization timeline; if supply frees up, urgency of alternative reduces
      - - CUDA ecosystem lock-in
        - Constraint
        - Persistent
        - Customers must benchmark, validate, and potentially rewrite inference pipelines; adoption is slower
        - Measure actual migration friction from Atlas pilot data; track software compatibility issues
      - - AI chip startup revenue volatility
        - Constraint
        - Near-term
        - Groq's revenue miss from $2B+ to $500M forecast shows market timing risk for inference hardware
        - Understand Positron's contracted revenue vs. pipeline; assess customer concentration
      - - U.S. export controls on advanced AI chips
        - Mixed (opportunity and constraint)
        - Active regulatory environment; ongoing uncertainty through 2026
        - U.S.-fabricated Atlas may benefit from domestic supply preference; export compliance burden for
          international sales; RASA bill extends controls to remote access
        - Map Positron's international customer base against restricted jurisdictions; assess compliance posture
      - - Efficient small model trend (DeepSeek, Llama-3 variants)
        - Constraint (partial)
        - Ongoing
        - Smaller models reduce memory requirement per inference call; reduces one key advantage of Positron's
          memory-first pitch
        - Track model size distribution across Positron's customer workloads; assess impact on large-context pitch
      - - Capital intensity of silicon development
        - Constraint
        - Persistent
        - Asimov NRE, tape-out (~late 2026), and production ramp (early 2027) require sustained capital; burn rate
          not disclosed; $230M Series B provides runway
        - Assess NRE/OpEx run rate vs. Series B proceeds; evaluate probability of on-time Asimov tape-out
    notes: >-
      Direction and timing are qualitative assessments from research synthesis. Quantitative estimates for driver
      magnitude (e.g. addressable installed base, CUDA migration rate) are not available from public sources and are
      flagged as diligence asks. The Groq revenue miss is from VentureBeat reporting; Groq has not confirmed these
      figures publicly.
