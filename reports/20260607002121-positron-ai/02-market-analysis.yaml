callouts:
  - calloutType: insight
    title: Memory-First Thesis as the Market-Sizing Dividing Line
    body: >-
      The most important analytical judgment in this chapter is that Positron's addressable market is not the headline
      AI accelerator market, but the subset of inference deployments where memory capacity, memory bandwidth, and power
      density are the binding constraints rather than raw FLOP count. IDC and TechInsights confirm that the overall
      market is large and growing, but Positron's differentiation is only commercially relevant where buyers cannot
      meet their inference requirements with commodity GPUs. This constraint-based boundary produces a SAM that is a
      single-digit percentage of the headline TAM in 2026, expandable as the Asimov platform ships and memory-bound
      use cases proliferate.
    claimRefs:
      - CM006
      - CM007
      - CM039
      - CM040
  - calloutType: risk
    title: Inference Market Volatility and Competitor Revenue Misses
    body: >-
      Groq's reported reduction of its 2025 revenue forecast from over $2 billion to approximately $500 million
      illustrates that inference hardware startups face significant timing and adoption risks even with technically
      validated products. The AI inference accelerator market is structurally large but commercially volatile: buyer
      procurement cycles are long, CUDA migration friction is real, and frontier model providers have not yet publicly
      committed to non-NVIDIA inference silicon at scale. Positron's market timing—shipping Atlas now while Asimov
      tapes out in late 2026—is positioned to capture early-adopter buyers, but validated revenue and customer
      concentration remain undisclosed evidence gaps.
    claimRefs:
      - CM036
      - CM041
      - CM042
