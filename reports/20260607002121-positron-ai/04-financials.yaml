  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: cash burn and runway
      missingEvidence: >-
        Monthly cash burn rate, cash on hand as of Q1 2026, and remaining runway from the Series B close.
      whyItMatters: >-
        Without burn rate and runway data, capital adequacy cannot be assessed and the risk of requiring
        a Series C before Asimov production ramp cannot be quantified.
      diligencePath: >-
        Request management-reported operating cash flow for the last six months, a board-approved burn
        forecast through Asimov tape-out, and a summary of current cash position.
      relatedQuestionRefs:
        - QI005

    - type: private-evidence-only
      severity: blocking
      topic: revenue and ARR
      missingEvidence: >-
        Revenue recognized from Atlas hardware sales, ARR or annualized run rate, and quarterly growth
        trajectory since Atlas first shipment.
      whyItMatters: >-
        Revenue quality and growth rate are the primary inputs to valuation; without these, the $1B+
        valuation cannot be independently assessed.
      diligencePath: >-
        Request quarterly revenue schedule from Atlas first shipment through Q1 2026, including by
        customer and product line.

    - type: missing-source
      severity: material
      topic: Atlas list pricing and ASP
      missingEvidence: >-
        Published or provided Atlas system price, representative customer contracts, or average selling
        price (ASP) range.
      whyItMatters: >-
        Without ASP, gross margin cannot be computed and unit economics modeling is impossible.
      diligencePath: >-
        Request Atlas pricing sheet, representative purchase order, and if available, realized ASP by
        customer segment.
      relatedQuestionRefs:
        - QI003

    - type: missing-source
      severity: material
      topic: independent benchmark verification
      missingEvidence: >-
        Third-party independent verification of Atlas performance claims (3.08x perf/$ vs H100, 93%
        memory bandwidth utilization) by an organization unaffiliated with Positron or its investors.
      whyItMatters: >-
        Performance claims are the primary basis for pricing power and margin justification; unverified
        claims create material risk of customer disappointment or competitive response.
      diligencePath: >-
        Commission or source an independent benchmarking study using industry-standard inference benchmarks
        (e.g., MLPerf Inference); request raw test data and methodology from existing customer deployments.
      relatedQuestionRefs:
        - QI024

    - type: private-evidence-only
      severity: material
      topic: unit economics and gross margin
      missingEvidence: >-
        Bill of materials (BOM) for Atlas, manufacturing COGS per unit, gross margin by product,
        and operating expense breakdown by function. Also missing: public-company comparable gross
        margins for FPGA-based hardware vendors serving inference markets.
      whyItMatters: >-
        Without COGS and gross margin data, the pathway to profitability and Asimov margin improvement
        thesis cannot be validated.
      diligencePath: >-
        Request audited or management-reported gross margin for Atlas, BOM summary, and operating expense
        schedule; compare against comparable FPGA hardware vendor filings for context.
      relatedQuestionRefs:
        - QI004
        - QI015
        - QI016

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      TI004 (Capital Adequacy) notes are included as an analytical caveat rather than omitted
      because burn and runway cells are analyst estimates, not primary-source facts. Notes
      are retained to surface the estimation basis for all readers.
  - dimension: paywallRisk
    reason: >-
      Three SEC EDGAR js-only sources (SI002, SI003, SI004) and one broken Cloudflare page (SI008)
      are cited for filing-type requirement and customer-proof context; these represent 4 of 26
      sources (15%) and are below the 30% report-level ceiling. No paywall sources are cited.
