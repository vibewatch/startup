callouts:
  - calloutType: strength
    title: Customer-to-Investor Signal Validates GTM Trajectory
    body: >-
      Jump Trading's progression from Atlas customer to co-lead Series B investor is among the strongest
      GTM validation signals available at this stage. The firm's CTO publicly reported approximately 3x
      lower end-to-end latency versus H100 in production evaluation, and Jump subsequently committed capital
      at co-lead scale. This compressed sales-to-investment cycle signals that technical conviction and
      commercial demand are real, not marketing-driven. For underwriters, the key question is whether this
      pattern is replicable across a broader set of enterprise customers at meaningful volume.
    claimRefs:
      - CI017
      - CI018
  - calloutType: risk
    title: Private-Company Opacity Is the Primary Diligence Blocker
    body: >-
      Positron has not publicly disclosed revenue, ARR, gross margin, cash balance, burn rate, or unit
      economics in any form. The entire financial underwriting rests on proxy indicators—customer logos,
      investor quality, and benchmark performance claims—rather than audited or management-reported financials.
      While this is normal for a $305M-raised, Series B-stage hardware startup, it means no judgment on
      revenue quality, margin trajectory, or capital adequacy is possible without a data room. This is
      the blocking issue for any diligence effort at the current stage.
    claimRefs:
      - CI010
      - CI039
  - calloutType: risk
    title: Groq Revenue Volatility Is a Direct Sector Adverse Signal
    body: >-
      Groq's reduction of its 2025 revenue projection from over $2 billion to approximately $500 million
      highlights the structural volatility of the AI inference hardware market. Even a well-funded, dedicated
      inference chip company with $750M+ raised can face dramatic revenue shortfalls. For Positron, this
      signals that customer concentration risk, demand volatility, and competitive pricing pressure from GPU
      incumbents are real execution risks. The absence of a diversified revenue base or disclosed customer
      count makes it impossible to assess whether Positron faces similar concentration dynamics.
    claimRefs:
      - CI028
      - CI002

