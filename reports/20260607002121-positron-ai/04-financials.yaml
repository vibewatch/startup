  - id: sec-gtm
    title: GTM Motion and Sales Efficiency
    body: >-
      Positron's go-to-market motion is direct enterprise sales led by CEO Mitesh Agrawal, who previously
      helped Lambda scale from approximately $500,000 to approximately $500 million in annualized revenue run
      rate while serving as COO—an operationally relevant track record for the current commercialization phase.
      Confirmed early deployments include Cloudflare (globally distributed, power-constrained data center
      infrastructure), Parasail/SnapServe (AI-native data platform for token delivery), and Jump Trading
      (performance inference for high-frequency and quantitative trading workloads). The customer-to-co-lead-
      investor dynamic with Jump Trading is a particularly strong GTM validation signal: customers who escalate
      to co-lead investors demonstrate both technical conviction and commercial commitment. Jump's CTO publicly
      reported approximately 3x lower end-to-end latency versus an H100-based system in production evaluation.
      The Series B's oversubscription and the participation of Qatar Investment Authority (QIA) and Arm Holdings
      as strategic investors suggests emerging pipeline in sovereign AI infrastructure and ecosystem partnership
      channels. Competitor SambaNova's $350M Series E in February 2026 and IDC's forecast of approximately
      $600 billion in global hyperscaler capex for 2026 confirm the underlying demand backdrop supporting
      Positron's sales thesis. No channel, reseller, marketplace, or API cloud sales have been publicly
      announced. Sales cycle length, customer acquisition cost (CAC), average contract value (ACV), or
      net revenue retention (NRR) are not publicly disclosed, limiting quantitative GTM efficiency analysis.
    claimRefs:
      - CI015
      - CI017
      - CI018
      - CI025
      - CI029
      - CI030
