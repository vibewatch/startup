      - CI038

  - id: sec-costs
    title: Cost Structure and Gross Margin Path
    body: >-
      Atlas relies on an FPGA-based architecture using Intel Altera (Agilex-class) chips fabricated at Intel
      foundry facilities in the United States, with final server assembly also completed domestically. FPGA-based
      inference hardware typically carries a higher per-unit component cost than GPU equivalents due to FPGA
      pricing dynamics, though the energy savings and air-cooled form factor may reduce total deployment cost
      for buyers. Atlas gross margin is estimated in the range of 30–55% based on hardware startup peer
      comparables, but no public disclosure, audited filing, or independent estimate exists to verify this range.
      The transition to the Asimov custom ASIC, planned for TSMC fabrication with production targeted for early
      2027, introduces a substantially different cost structure: higher non-recurring engineering (NRE) and
      mask set costs upfront, but lower per-unit COGS at production volume—a typical ASIC margin improvement
      trajectory. Working capital requirements include FPGA chip procurement lead times, server assembly,
      and inventory buffers for customer delivery; none of these figures have been disclosed. AMD, Intel, and
      Arm Holdings each maintain public SEC EDGAR filings providing competitive reference points for data
      center accelerator unit economics. No inventory, accounts receivable, working capital, or operating
      expense breakdowns have been made public. The Asimov ASIC development is a multi-year R&D capital
      investment representing the dominant component of Series B spending; this is consistent with the typical
      custom silicon development cycle of 18–24 months from design start to production.
    claimRefs:
      - CI019
      - CI020
      - CI021
      - CI022
      - CI023
      - CI024
      - CI026
