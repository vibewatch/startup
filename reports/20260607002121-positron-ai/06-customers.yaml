- id: TU006
  title: Procurement and deployment friction table
  columns:
  - Friction point
  - Public evidence
  - Likely effect
  - Which segment feels it most
  - What is missing publicly
  rows:
  - - No public pricing or commercial package
    - Positron public surface does not publish pricing or standard terms
    - Slows third-party diligence and self-qualification
    - All enterprise buyers
    - Price book, contract terms, and volume discounts
  - - Evaluation before scale
    - Cloudflare evidence is trial-based and conditional
    - Large accounts may spend quarters testing before purchase expansion
    - Cloud / CDN operators
    - Trial milestones, success criteria, and conversion rate
  - - Solution-engineering intensity
    - Jump case highlights remote evaluation, on-prem deployment work, and low-level stack access
    - Win rates may be high but expensive to support
    - Trading and other performance-sensitive buyers
    - Standardized deployment checklist and staffing model
  - - Channel opacity
    - Parasail relationship may hide ultimate end-user demand behind a partner shell
    - Makes concentration and margin harder to read
    - Partner-led accounts
    - Shipment volumes, revenue share, and exclusivity terms
  notes: Friction rows reflect missing public sales artifacts and the qualification burden implied by the named customer stories.
