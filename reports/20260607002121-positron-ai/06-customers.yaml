- id: sec-expansion-risk
  title: Expansion motion, partner dependence, and concentration risk
  body: Expansion motion likely exists, but it is tightly coupled to procurement friction and concentration risk. Positron is clearly trying to land Atlas today and then expand into larger footprints or next-generation systems such as Asimov and Titan. That motion is visible in the Jump story, where better-than-H100 latency and quick deployment created enough conviction for a deeper roadmap relationship, and in the Parasail story, where a partner can turn hardware into downstream recurring services. But the same stories reveal friction. Cloudflare appears to require long trialing before materially larger deployment. Trading buyers want rapid on-prem qualification and deep technical access, which is sticky once won but expensive to support. Positron's public surface does not publish pricing, standard commercial terms, or a self-serve evaluation package, so the distance from technical interest to booked revenue is still opaque. Because only three named relationships are public and one is also
    an investor, concentration risk remains high until management discloses customer count, account mix, and the economics of partner-led channels.
