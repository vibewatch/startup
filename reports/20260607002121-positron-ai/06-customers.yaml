callouts:
- calloutType: strength
  title: Jump Trading is the clearest public proof of customer conviction
  body: 'Jump gives Positron more than a logo: the company says it started as a customer, the CTO publicly quoted a meaningful latency result, and the account later became a co-lead investor. That combination makes Jump the best disclosed reference even though the public record still describes the first deployment as small.'
  claimRefs:
  - CU017
  - CU018
  - CU019
- calloutType: risk
  title: Cloudflare is strategically important but still qualification-heavy in public evidence
  body: Cloudflare is a very relevant buyer profile for Positron, but the freshest independent language still describes long-term trials and larger rollout only if metrics hold. Investors should therefore treat Cloudflare as serious proof of relevance, not as proof of broad production volume.
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU031
- calloutType: risk
  title: Retention and concentration are the two biggest unresolved customer questions
  body: Public customer proof is enough to show real adoption, but not enough to show repeatability. There is still no public customer count, no concentration disclosure, and no retention or renewal data, which means the underwriting risk is not whether Positron has any customers, but whether the customer base is broad and durable enough to matter.
  claimRefs:
  - CU026
  - CU027
  - CU039
  - CU040
