- id: sec-durability
  title: Retention, durability, and what remains unproven
  body: Durability is where the chapter stays cautious. No reviewed source discloses renewal rates, contract length, churn, net revenue retention, or even a customer count. That means the public record cannot separate one-time technical evaluations from repeatable revenue behavior. The best qualitative durability signal is Jump Trading moving from customer to investor after testing Atlas, because that implies conviction that goes beyond a marketing proof-of-concept. Parasail also looks durable at the partner level because its own platform claims enormous token volumes and multiple downstream customers, but that is indirect evidence for Positron; it does not show how much of Parasail's business sits on Positron hardware or whether the relationship is exclusive. Cloudflare remains strategically valuable but evidentially conditional because the clearest 2026 language is still trial-based. In other words, Positron has enough public evidence to support real adoption, but not enough to support
    a strong public claim about retention, account stickiness, or the predictability of repeat revenue.
  claimRefs:
  - CU017
  - CU019
  - CU026
  - CU027
