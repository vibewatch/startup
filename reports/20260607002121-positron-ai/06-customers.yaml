tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Representative use case
  - Public proof
  - Strategic value
  - Gap
  rows:
  - - Cloud / CDN operators
    - 'Buyer: infra leadership; user: platform / edge teams; payer: infrastructure budget'
    - Run inference near end users inside distributed, power-constrained facilities
    - Cloudflare named by Positron and repeated in press; 2026 trial language reported
    - High strategic value if scaled because rollout could expand globally
    - No Cloudflare-authored case study, unit count, or revenue disclosure
  - - AI deployment platforms / neoclouds
    - Buyer and user can sit with a platform operator; payer may be the platform itself
    - Turn Positron hardware into endpoints sold downstream to AI builders
    - Parasail / SnapServe named publicly; third-party reporting ties service pricing to the stack
    - Creates channel leverage and many indirect end users
    - Commercial terms and shipment volumes are undisclosed
  - - Latency-sensitive trading firms
    - 'Buyer: CTO / infra; user: quant / ML infra; payer: trading technology budget'
    - Lower-latency inference in power-constrained exchange and data-center environments
    - Jump Trading customer-to-investor path with quoted latency outcome
    - Strong proof of performance fit and possible roadmap co-development
    - Public deployment described as small test deployment, not fleet scale
  - - Networking / content moderation / gaming / Token-as-a-Service
    - Likely infra buyers and platform teams
    - Always-on inference where cost per token and rack power matter
    - Claimed on Positron about page but unnamed publicly
    - Suggests wedge beyond three named accounts
    - No named logos, outcomes, or account counts
  - - Enterprise copilots / generative agents
    - 'Buyer: enterprise IT / product; user: app teams'
    - Serve enterprise copilots or agent workflows on existing infrastructure
    - Series A says production environments include enterprise copilots
    - Shows broader workload applicability
    - No named reference customer or contract evidence
  notes: Rows separate named proof from company-claimed but unnamed segment traction; absence of a named logo is treated as a diligence gap, not as disproof.
