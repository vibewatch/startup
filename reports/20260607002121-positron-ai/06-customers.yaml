- id: sec-proof
  title: Named customer proof and adoption quality
  body: 'Named proof is real, but the quality of proof differs sharply by account. Jump Trading is the strongest public evidence because the record contains a named customer, a customer-quoted outcome, and an economic escalation from customer to co-lead investor. Even there, the detail matters: EE Times says the first deployment was a small test deployment, so the strongest public proof is successful evaluation with early deployment, not yet disclosed fleet-scale production. Cloudflare is strategically important but evidentially weaker. Positron and multiple outlets say Cloudflare is using or testing Atlas in distributed, power-constrained environments, while TechSpot specifically describes long-term trials and a conditional larger rollout if metrics hold. That is better than a logo slide, but still short of a Cloudflare-authored case study. Parasail and SnapServe sit in the middle. Positron names Parasail as a customer, and third-party reporting says the two co-developed a low-cost always-on
    service, but the public Parasail and SnapServe surfaces reveal more about Parasail''s own go-to-market than about Positron shipment volume or production depth.'
