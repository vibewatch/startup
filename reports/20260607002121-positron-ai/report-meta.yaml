  productSummary: >-
    Atlas is an FPGA-based transformer inference server with an OpenAI-compatible
    serving layer; Positron is extending that platform with the memory-first Asimov
    ASIC and the Titan system for larger-context inference workloads.
  customerFocus: >-
    Cloud providers, enterprises, and performance-sensitive inference operators in
