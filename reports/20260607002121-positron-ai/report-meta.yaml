companyProfile:
  summary: >-
    Positron AI is a Reno-based AI inference hardware startup founded in spring 2023.
    It sells the shipping Atlas FPGA inference server and is developing the Asimov
    custom ASIC and Titan next-generation system for 2027. The company has raised
    approximately $305 million across seed, Series A, and a $230 million Series B at
    a post-money valuation above $1 billion, with early public customer proof from
    Cloudflare, Parasail, and Jump Trading. Commercial momentum appears real, but the
    company still discloses little about revenue quality, margins, or capital
    structure.
  founders:
