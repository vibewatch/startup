      role: Co-founder and CTO
      background: Former Director of Technology Strategy at Groq; technical architect of Positron's inference roadmap.
      claimRefs: [CO013]
    - name: Edward Kmett
      role: Co-founder and Chief Scientist
      background: Applied mathematician known for functional-programming and compiler-design work.
