    - 当前股权结构表、清算优先权、债务、信息权和任何二级市场估值标记均未披露。
    - 需要第三方复现基准测试和更完整的客户案例，才能把灯塔客户证明和持久生产采用区分开。
    - Asimov 和 Titan 爬坡所需的晶圆厂承诺、NRE 负担和单位经济性未公开。
    - 董事会构成和第二梯队领导力深度仍大体不透明。
