  topStrengths:
    - 超额认购融资和战略性 Series B 财团，验证了投资人对公司及路线图的真实需求。
    - Atlas 已经出货；Jump Trading 是最强的公开客户证明，并引用了相对 H100 系统的延迟优势。
    - Positron 的 memory-first 架构瞄准的是推理里真实存在的功耗、带宽和模型内存占用瓶颈。
