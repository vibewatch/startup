      - number: '7.2'
        title: 制造转换、benchmark 可信度和企业就绪度构成主要运营风险簇
        blocks:
          - type: paragraph
            body: >-
              运营上，Positron 要求投资者同时承销两家公司：当前的 Atlas 业务，向功耗受限环境出货基于 FPGA 的系统；未来的 Asimov/Titan
              业务，则依赖新自研芯片项目按时落地。这一转换并不简单。VentureBeat 报道 Atlas 使用 Intel 设施，而 Asimov 制造转向 TSMC；Jon Peddie 补充了对 Credo 的
              Weaver memory chiplet 和 LPDDR5X 架构的依赖。公司把 LPDDR 和风冷描述为缓解 HBM、CoWoS 与液冷瓶颈的手段，但这些设计选择仍需在 ASIC
              规模上验证良率、封装和性能。公开 benchmark 质量是第二个运营问题。Positron 发布了有吸引力的 tokens-per-watt
              和功耗主张，但最强独立报道仍把这些比较视为公司发布或特定工作负载结果。Cloudflare 的公开姿态仍有条件，Jump 引用的结果有说服力但高度专用。第三个问题是企业就绪度。已审阅的 Positron
              客户材料和支持界面没有显示部分成熟基础设施买家如今期待的信任中心、漏洞披露或事故历史界面，尤其当 Groq 等同业和 Cloudflare 等客户都明显发布安全与合规资源时。
