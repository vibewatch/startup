        - id: product-proof
          label: Atlas 已出货，并有具名灯塔客户
          detail: Atlas 和客户证明存在，但覆盖广度和经济性仍不清楚。
          tone: positive
        - id: market-tailwind
          label: 推理市场和功耗瓶颈真实存在
          detail: 分析师将 2026 年描述为推理主导，并受功耗、资本和内存约束的一年。
          tone: positive
        - id: financial-gap
          label: 收入质量包缺失
          detail: 没有公开收入、毛利率、在手订单或烧钱披露支撑本轮价格。
          tone: warning
        - id: roadmap-gate
          label: Asimov/Titan 排期是主要摇摆因素
          detail: 2026 年末流片和 2027 年初量产仍是路线图主张，不是已交付事实。
          tone: warning
        - id: track-call
          label: 观察
          detail: 公开证据支持故事可信，但还不足以在当前价格下形成承销确信。
          tone: neutral
        - id: buy-upgrade
          label: 只有尽调和里程碑证明到位后才上调
          detail: 股权结构表、客户扩张、基准测试验证和制造经济性必须过关。
          tone: positive
      edges:
        - from: funding-proof
          to: product-proof
        - from: product-proof
          to: market-tailwind
        - from: market-tailwind
          to: financial-gap
        - from: financial-gap
          to: roadmap-gate
        - from: roadmap-gate
          to: track-call
        - from: track-call
          to: buy-upgrade
    approximationNotes: 这是决策框架，不是加权模型；它明确说明，推荐质量受限于缺失的尽调，而不是市场兴趣不足。
    claimRefs:
      - CV001
      - CV005
      - CV013
      - CV015
      - CV030
      - CV033
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 示意性估值区间更多受里程碑交付和竞争压力影响，而不是任何已发布收入数字，因为公开记录缺少完整财务模型。
    data:
      items:
        - label: 当前轮次参照
          value: 1000
          detail: Series B 公告披露的最低门槛。
          tone: neutral
        - label: Asimov 按时流片
          value: 1250
          detail: 如果路线图执行保持完整，支撑基准情景耐久性。
          tone: positive
        - label: 独立基准测试验证
          value: 1400
          detail: 会增强定价权和商业化可信度。
          tone: positive
        - label: 未走出标杆用户圈
          value: 850
          detail: 客户集中度高，本轮融资难以继续放大。
          tone: warning
        - label: 路线图延误六个月
          value: 700
          detail: 定制芯片验证前，延误会推高融资风险。
          tone: warning
        - label: 既有厂商或同业压价
          value: 650
          detail: 同业透明的 token 定价会很快压窄上行空间。
          tone: negative
    approximationNotes: 数值是分析师决策区间，锚定已披露的本轮门槛、同业定价压力和路线图里程碑；它们不是由已披露财务模型推导出的市场价格。
    claimRefs:
      - CV001
      - CV025
      - CV027
      - CV028
      - CV033
      - CV035
      - CV037
      - CV039
      - CV044
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 情景区间说明，当前披露价格值得观察，但并不明显错定：上行空间存在；一旦里程碑落空，下行区间会迅速变宽。
    data:
      items:
        - label: 重估 / 下轮降价风险
          low: 250
          mid: 375
          high: 500
          displayValue: $250-$500M
          detail: 路线图延误叠加商业化乏力，可能迫使价格重置。
          tone: negative
        - label: 悲观情景
          low: 500
          mid: 650
          high: 800
          displayValue: $500-$800M
          detail: 小模型占比上升、既有厂商打包销售、执行失速，都会压低价值。
          tone: warning
        - label: 基准情景
          low: 900
          mid: 1100
          high: 1300
          displayValue: $900-$1,300M
          detail: Atlas 证据面扩大、路线图节奏大体守住，本轮价格才撑得住。
          tone: neutral
        - label: 乐观情景
          low: 1500
          mid: 1750
          high: 2000
          displayValue: $1,500-$2,000M
          detail: 需要 Asimov 准时落地、商业证据扩大，且同业资金胃口延续。
          tone: positive
    approximationNotes: 区间按里程碑划分，因为公开证据没有披露收入或证券条款；中点只是粗略投资测算锚点，不是预期值。
    claimRefs:
      - CV001
      - CV034
      - CV037
      - CV038
      - CV039
      - CV040
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 记分卡凸显后期硬件投资常见的不对称：市场机会和产品野心都强，但财务透明度和资本结构能见度仍弱。
    data:
      items:
        - label: 市场机会
          value: 8 / 10
          detail: 分析师资料支持推理驱动的半导体市场规模大、仍在增长。
        - label: 产品证据
          value: 6 / 10
          detail: Atlas 已出货且有具名客户加分，但证据面仍窄，且主要来自公司自述。
        - label: 财务透明度
          value: 3 / 10
          detail: 收入、毛利率、订单积压和烧钱速度仍未公开。
        - label: 估值支撑
          value: 5 / 10
          detail: 相比同业，本轮价格说得通；但按披露门槛看，并不明显便宜。
        - label: 退出准备度
          value: 4 / 10
          detail: 战略投资者加分，但流动性时点仍只能推测，披露也少。
        - label: 投资建议
          value: TRACK
          detail: 投资规模落地前，先观察尽调是否闭环、路线图能否交付。
    approximationNotes: 分数是投委会定性辅助，来自本章证据基础；不是机构内部模型，也不是标准化评级体系。
    claimRefs:
      - CV013
      - CV015
      - CV024
      - CV029
      - CV030
      - CV040
      - CV041
