      - number: '1.5'
        title: 里程碑、负面事件与竞争背景
        blocks:
          - type: paragraph
            body: >
              在 FPGA 到 ASIC 的推理公司中，Positron 的公开执行节奏属于最快一档。公司从成立到首个原型约 8 个月，从原型到出货产品又用约 7 个月，从出货产品到 Series A 再用约 13
              个月；这一切由不足 20 人的团队完成。Series B 距 Series A 约 7 个月。

              公开来源未披露任何负面法律、监管或治理事件。Sohmers 从 CEO 转为 CTO、Agrawal 接任
              CEO，是公司历史上最重要的结构变化；过程看起来有序，并被包装为正面引入，而非被迫调整，但关于具体情形的独立证据有限。VentureBeat 曾指出，Sohmers 前东家 Groq 将 2025 年收入预测从
              $2 billion 下调至 $500 million；这说明 AI 硬件市场波动性很高，也是 Positron 的相关类比风险。

              性能宣称仍来自公司发布，且只得到一位有财务利益相关的顾问（Dylan Patel，SemiAnalysis）和一位生产客户（Jump Trading）在特定负载下的部分验证。Asimov 芯片尚未
              tape-out；目标是 2026 年末 tape-out、2027 年初量产，这形成一条单一关键路径执行风险，将决定 Series B 资本是否能有效部署。
