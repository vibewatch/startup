      - number: '4.2'
        title: GTM 路径与销售效率
        blocks:
          - type: paragraph
            body: >-
              Positron 的 GTM 由 CEO Mitesh Agrawal 主导的企业直销驱动。他曾任 Lambda COO，帮助 Lambda 将年化收入运行率从约 $500,000 扩大到约 $500
              million；这段履历与公司当前商业化阶段直接相关。已确认早期部署包括 Cloudflare（全球分布式、受功耗约束的数据中心基础设施）、Parasail/SnapServe（面向 token 交付的 AI
              原生数据平台）和 Jump Trading（面向高频和量化交易工作负载的高性能推理）。Jump Trading 既是客户又升级为联合领投方，是特别强的 GTM
              验证信号：客户愿意升级为联合领投投资者，说明技术信念和商业承诺都成立。Jump 的 CTO 公开称，在生产评估中，端到端延迟约比 H100 系统低 3 倍。Series B 获超额认购，Qatar
              Investment Authority（QIA）和 Arm Holdings 作为战略投资者参与，说明主权 AI 基础设施和生态合作渠道正在形成早期机会。竞争对手 SambaNova 2026 年 2 月完成
              $350M Series E，IDC 预测 2026 年全球超大规模云厂商资本开支约 $600 billion，这些都确认了支撑 Positron 销售逻辑的需求背景。公司尚未公开宣布渠道、经销商、市场平台或
              API 云销售。销售周期、获客成本（CAC）、平均合同价值（ACV）和净留存率（NRR）均未公开披露，限制了对 GTM 效率的量化分析。
