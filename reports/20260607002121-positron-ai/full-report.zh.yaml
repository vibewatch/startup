      - number: '2.5'
        title: 图表与要点
        blocks:
          - type: callout
            title: 内存优先论点是市场规模划线依据
            body: >-
              本章最重要的分析判断是，Positron 的可服务市场不是名义 AI 加速器市场，而是推理部署中由内存容量、内存带宽和功率密度构成硬约束、而非原始 FLOP 数量的子集。IDC 和 TechInsights
              证实整体市场庞大且在增长，但只有在买方无法用商品 GPU 满足推理需求时，Positron 的差异化才有商业意义。这种基于约束划出的边界，使 2026 年 SAM 只占名义 TAM 的个位数百分比；随着
              Asimov 平台出货、内存受限用例扩散，SAM 才可能扩大。
