  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 支撑依据
      - 可能推翻它的因素
      - 哪些证据会改变判断
    rows:
      - - 推理需求规模很大，仍在扩张
        - IDC 和 TechInsights 都把 2026 年描述为由推理和数据中心主导的支出周期。
        - 如果小模型或边缘推理压缩了巨内存系统的高端市场，Positron 的紧迫性会下降。
        - 独立证据显示，大模型和内存密集型工作负载仍是价值最高的细分市场。
      - - Positron 已越过概念阶段
        - Atlas 已出货，公司称已有生产部署，具名客户包括 Cloudflare 和 Parasail。
        - 具名客户仍可能只是标杆验证，而非规模化经常性账户。
        - 客户分组数据能显示复购、扩张和多元化生产使用。
      - - 公司具备战略融资势能
        - Series B 轮超额认购，Jump、QIA、Arm 以及其他战略或专业投资者参投。
        - 战略资本会带来治理复杂度，也不能单独保证商业成功。
        - 看到投资条款清单中的权利、优先权，以及是否有投资者持有限制性控制条款。
      - - 内存优先架构可能正好击中真实瓶颈
        - Positron、IDC 和市场评论都把内存、功耗和 HBM 稀缺列为约束。
        - 大多数基准差异仍来自公司口径，巨头可用新硬件或捆绑方案反击。
        - 第三方基准和客户案例，验证其在付费生产工作负载中的表现。
      - - 以同业融资看，本轮定价仍有合理性
        - Groq、Cerebras 和 SambaNova 都显示，资本仍愿意为推理故事买单。
        - 这些同业规模更大、融资更多，或已经具备流动性，因此 Positron 未必配得上类似的稀缺性溢价。
        - 更广的可比公司集合，包含披露的私募市场估值或 Positron 的公开二级报价。
      - - 有上行空间，但容错很低
        - Asimov 按时推进并扩大商业化，可能支撑本轮估值之上的上行。
        - 流片、客户扩张或融资纪律任何一项失手，都可能让 $1B+ 入场估值快速压缩。
        - 证据显示，在 ASIC 过渡吃掉增量资本前，Atlas 能转化为可持续收入。
    notes: 本表把已确认事实和明确的反向条件放在一起，保证建议对价格敏感，而不是泛泛给公司质量打分。
