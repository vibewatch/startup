      - number: '3.3'
        title: 挑战者同业：SambaNova、Tenstorrent 与 d-Matrix
        blocks:
          - type: paragraph
            body: >
              SambaNova Systems 是 2025–2026 年窗口中产品发布最活跃的同业。公司成立于 2017 年，位于 California 州 San Jose，打造 RDU（Reconfigurable
              Dataflow Unit）：一颗定制 ASIC，使用数据流架构，把 AI 操作组织成装配线式流水线，从而减少内存密集型内核调用。第五代 SN50 芯片于 2026 年 2 月 24
              日发布，声称相比上一代，每个加速器算力高 5×、网络带宽高 4×；SambaNova 引用 SemiAnalysis 基准称，Llama-3.3 70B 上达到 895 tokens/s，而 Nvidia
              B200 为 184 tokens/s。公司在 2026 年 2 月完成 $350 M+ 超额认购 Series E，由 Vista Equity Partners 和 Cambium Capital
              领投，Intel Capital 与 T. Rowe Price 参投；与 Intel 的多年合作让其可通过 Intel 全球渠道共同销售。SoftBank 是 SN50 在日本 AI
              数据中心部署的首个客户。IDC 分析师 Peter Rutten 称 SN50 正在「改变大规模 AI 推理的 token 经济性」。SambaNova 宣称在智能体 AI 负载上，总拥有成本（TCO）比 GPU
              低 3×；多模型常驻内存支持快速模型切换。SambaCloud 通过兼容 OpenAI 的 API 提供 DeepSeek、Llama 等模型，token 价格具备竞争力。相较
              Positron，SambaNova 的 Intel 合作显著扩大了分销触达和制造能力。

              Tenstorrent 是一家加拿大 AI 加速器公司（总部位于 Texas 州 Austin），由传奇芯片架构师 Jim Keller 领导。其产品使用基于 RISC-V 的处理核心（Wormhole 和
              Grayskull 芯片），Galaxy 系统瞄准大规模 AI 推理。Tenstorrent 采用开发者优先 GTM，通过 TT-Metalium SDK 开源软件，拥有活跃专利组合，并截至 2026
              年中提出行业领先性能宣称。公司凭借 RISC-V 开放标准差异化吸引了开发者社区投资，但公开客户和收入披露有限。Tenstorrent 已获得值得注意的战略融资，但总融资数字没有达到 Groq、Cerebras
              或 SambaNova 那样的公开细节程度。

              d-Matrix 是位于 Santa Clara 的推理芯片创业公司，采用完全不同的内存路线：3DIMC（3D stacked Digital In-Memory Compute），把计算直接放进堆叠 SRAM
              内部，以消除数据移动瓶颈。Corsair 平台瞄准最高 100 B 参数模型，采用兼容现有数据中心配置的 PCIe 形态，无需重配机架即可插入部署。d-Matrix 团队背景声称累计出货超过 1
              亿颗芯片，并瞄准超低延迟和高批量吞吐的企业负载。相较 Positron 的整机架 Atlas，PCIe
              形态是有意义的差异点：它降低了部署摩擦门槛，但也限制了单次部署占用和模型规模。融资和客户细节未做充分公开披露。
