  - id: TM004
    title: 增长驱动与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 对 Positron 的影响
      - 尽调问题
    rows:
      - - Transformer 推理受内存限制，而非受算力限制
        - 驱动因素
        - 当前（结构性）
        - Positron 内存优先的 LPDDR 架构与主流工作负载画像在架构上匹配
        - 独立复现实验：验证其宣称的 93% 内存带宽利用率，相比 GPU 基准 10-30%
      - - 数据中心能源可用性成为瓶颈
        - 驱动因素
        - 当前且正在恶化
        - 风冷、低功耗 Atlas 系统可部署在拒绝液冷 GPU 机架的数据中心
        - 量化全球可触达的风冷数据中心存量容量
      - - HBM 内存供应到 2026 年前已被预先锁定
        - 驱动因素
        - 2025–2026 年窗口
        - 基于 LPDDR 的 Positron 绕开 HBM 供应链；降低买方对受限 HBM 配额的依赖
        - 跟踪 HBM 供应正常化时间表；若供应释放，替代方案紧迫性会下降
      - - CUDA 生态锁定
        - 约束
        - 持续存在
        - 客户必须做基准测试、验证，并可能重写推理流水线；采用速度更慢
        - 用 Atlas 试点数据衡量实际迁移摩擦；跟踪软件兼容性问题
      - - AI 芯片初创公司收入波动
        - 约束
        - 近期
        - Groq 收入预测从 $2B+ 下修至 $500M，显示推理硬件存在市场时点风险
        - 了解 Positron 已签约收入与管线对比；评估客户集中度
      - - 美国对先进 AI 芯片的出口管制
        - 混合（机会与约束）
        - 监管环境活跃；不确定性持续到 2026 年
        - 美国制造的 Atlas 可能受益于国内供应偏好；国际销售承担出口合规负担；RASA 法案将管制延伸至远程访问
        - 将 Positron 国际客户群映射到受限司法辖区；评估合规姿态
      - - 高效小模型趋势（DeepSeek、Llama-3 变体）
        - 约束（部分）
        - 持续
        - 较小模型降低每次推理调用的内存需求；削弱 Positron 内存优先卖点的一项关键优势
        - 跟踪 Positron 客户工作负载中的模型尺寸分布；评估对大上下文卖点的影响
      - - 芯片开发资本强度
        - 约束
        - 持续存在
        - Asimov NRE、tape-out（约 2026 年末）和量产爬坡（2027 年初）需要持续资本；烧钱速度未披露；$230M Series B 提供现金跑道
        - 评估 NRE/OpEx 运行率与 Series B 融资额的关系；判断 Asimov 按时 tape-out 的概率
    notes: 方向和时间来自研究综合后的定性判断。驱动因素强度的定量估计（如可触达装机基础、CUDA 迁移率）没有公开来源，因此列为尽调问题。Groq 收入落空来自 VentureBeat 报道；Groq 未公开确认这些数字。
