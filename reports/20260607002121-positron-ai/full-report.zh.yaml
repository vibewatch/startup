      - number: '2.2'
        title: 总可用市场（TAM）、可服务市场（SAM）与可获取市场（SOM）——多重规模测算视角
        blocks:
          - type: paragraph
            body: >-
              三个独立视角可用于测算 AI 推理加速器市场，结论都指向一个巨大但边界不够精确的机会。IDC 2026 年 4 月预测显示，2026 年完整数据中心半导体市场为 $477.1
              billion，其中智能数据中心子板块——CPU、加速器、GPU、定制 ASIC 和网络——为 $281 billion。TechInsights 独立预测，受训练向推理部署转移推动，数据中心加速器市场在
              2026 年将超过 $300 billion。到 2030 年，IDC 预计数据中心半导体收入达到 $843.2 billion，约占整个半导体市场一半。

              AI 推理加速器的 TAM 可用三角测算法估算。如果 IDC 的 $477.1 billion 数据中心半导体市场中约 60% 支出投向逻辑/加速器（IDC 数据），且按分析师共识，推理到 2027
              年至少会增长到其中一半，那么 2026 年推理加速器 TAM 区间约为 $120–$180 billion。TechInsights 明确称加速器市场「超过 $300B」，但这很可能包含更广泛 GPU
              训练市场。ResearchAndMarkets 2026–2036 AI 芯片报告覆盖一个数千亿美元量级总市场，却没有给出单一权威的第一年数字。这些估算方法限制显著：分析师报告中的 TAM 通常包含所有 AI
              加速器支出（训练 + 推理 + 定制 ASIC 项目），而纯推理切片无法从公开数据中干净拆分。

              Positron 的 SAM 明显小于名义 TAM。SAM 受三类推理部署约束：（a）兼容风冷（排除需要液冷的超大规模数据中心），（b）可从 CUDA 生态迁移（买方能试用非 NVIDIA
              推理硬件），（c）内存受限负载在总拥有成本分析中由 LPDDR 架构胜过 HBM。Positron 自身未发布 SAM 估算。已确认部署的 Cloudflare 和 Jump Trading
              都是受约束买家，更重视能效和内存带宽，而非通用 GPU 灵活性；因此，SAM 最清晰地对应 CDN/边缘、金融服务和企业推理提供商中的推理负载。估计 2026 年这只占 TAM 的低个位数百分比，但随着
              Asimov 芯片出货具备扩张潜力。

              Positron 的 SOM 取决于 Atlas 产能和销售速度，两者均未公开披露。$230 million Series B
              被描述为支持公司冲刺史上增长最快的硅公司之一，但没有收入或客户数量得到确认。这些矛盾——TAM 很大、SAM 不清晰、SOM 未披露——应作为证据缺口保留，而不是用估算强行填平。
