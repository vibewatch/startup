      - number: '3.4'
        title: 既有厂商回应与平台替代品
        blocks:
          - type: paragraph
            body: >
              Nvidia 仍是 AI 基础设施中的压倒性主导力量。Blackwell GPU 架构是当前训练和推理旗舰，数据中心平台为 AI
              推理提供端到端支持，覆盖框架（PyTorch、TensorRT、ONNX）、编排（NIM microservices、Triton Inference
              Server）和硬件（H100/H200/B100/B200）。Nvidia 的竞争护城河建立在四根支柱上：装机基础（全球绝大多数 AI 集群运行 Nvidia GPU）、软件生态（CUDA
              积累了十年开发者投入）、供应链（TSMC HBM 配额、NVLink/NVSwitch 连接）和企业销售基础设施。Nvidia 推理平台声称可将前沿 MoE 模型性能提升最高 10×；虽然 Positron
              宣称相较 H100 每美元性能高 3.5×，但 Nvidia 的 Blackwell 后继产品可能侵蚀这一差距。相对专用推理芯片，既有厂商的主要弱点是 GPU
              架构过度为训练优化（算力密集、推理时受内存带宽限制），这正是 Positron、Groq、Cerebras 和 SambaNova 共同利用的核心逻辑。

              AMD 的 Instinct MI 系列（MI300、MI325、MI350）瞄准同一个数据中心 AI 加速市场。相较定制 ASIC，AMD 通过 ROCm（PyTorch/HIP 兼容）拥有 GPU
              软件生态优势，并借助 Dell、HPE 和 SuperMicro 进入 OEM 分销。AMD 财务数据（来自 ir.amd.com）确认其数据中心板块是高增长业务，并有强公开披露。研究期间，Instinct
              产品页返回 404 错误，可能说明 URL 迁移；但 OEM 渠道已确认产品可用。

              Intel 的 Gaudi 3 AI 加速器是 Intel 的推理方案。Gaudi 3 PCIe 卡（HL-338）使用标准 Ethernet 网络，而非 NVLink/NVSwitch，避免专有互连锁定；相比
              H100，每个加速器 I/O 连接多 33%。Intel 以 PyTorch 集成和开放标准定位 Gaudi 3。Intel 对 SambaNova 的战略投资（参与 Series
              E）形成双轨既有厂商回应：一方面是 Gaudi 3 作为独立 GPU 替代品，另一方面是 SambaNova 的 RDU 系统作为推理优化层。这对 Positron 不利，因为它扩大了 Intel 在
              Positron 所瞄准推理专用细分中的分销触达。

              云原生推理替代品——GroqCloud、SambaCloud、Cerebras Inference API、AWS Inferentia、Google Cloud TPU 和 Azure
              AI——构成最大的替代品类别。企业通过 API 运行推理时，硬件采购摩擦为零，并且可以用极少代码改动切换供应商（所有主要推理 API 提供商都提供兼容 OpenAI 的端点）。这是 Positron 面向开发者
              GTM 中最重要的竞争动态：高性能云 API 可用且切换成本极低，抬高了本地部署硬件采用门槛，并把 Positron 的可服务市场限制在具有隐私、延迟（本地部署）或规模化成本论点的买方。
