      - number: '3.2'
        title: 主要已融资同业：Groq 与 Cerebras
        blocks:
          - type: paragraph
            body: >
              从架构理念和商业化路径看，Groq 是 Positron 最直接可比的竞争对手。Groq 成立于 2016 年，总部位于 California 州 Mountain View，率先推出 LPU（Language
              Processing Unit）：一颗定制 ASIC，以数百 MB 片上 SRAM 作为主要权重存储，而不是缓存。LPU 通过定制编译器做静态调度，采用单核架构，并用 plesiosynchronous
              协议直连芯片，实现低延迟确定性执行。Groq 于 2025 年 9 月融资 $750 million，投后估值 $6.9 billion，约为 Positron Series B 后估值的七倍；投资方包括
              Disruptive、BlackRock、Neuberger Berman、Samsung 和 Cisco。公司声称通过 GroqCloud 服务超过 200 万开发者和 Fortune 500
              公司，公开具名客户包括 McLaren Formula 1、GPTZero（10 M+ 用户）、StackAI 和 Stats Perform。Groq 提供 Free/Developer/Enterprise
              API 分层，token 计价从 Llama-3.1-8B 的 $0.05/M input tokens 起；Developer 和 Enterprise 层增加速率限制、prompt
              缓存和性能保证。需要注意，GroqCloud 是云优先 API 产品：Groq 通过 API 用量变现，而非卖硬件，这让它与 Positron 的本地部署硬件模式处在不同 GTM 车道。

              对 Positron 尤其关键的是，VentureBeat 报道称 Groq 将 2025 年收入预测从 $2 billion 下调至 $500
              million。这一信号说明，即便融资最充足的推理创业公司，需求转化也可能剧烈波动；这也是审视 Positron 自身收入爬坡假设时的相关背景。

              Cerebras Systems 是资本最充足的 AI 推理硬件竞争对手。公司成立于 2015 年，位于 California 州 Sunnyvale，打造 Wafer-Scale
              Engine（WSE-3），这是全球最大芯片，尺寸为领先 GPU 裸片的 58×。Cerebras 声称推理速度最高比 GPU 方案快 15×，并通过与 OpenAI 合作，在
              GPT-5.3-Codex-Spark 上跑到超过 1,200 tokens per second。公司于 2026 年 5 月 14 日完成 IPO，在 Nasdaq（CBRS）以 $185/share
              上市，收盘时总募集资金 $6.38 billion，成为迄今最重要的 AI 硬件 IPO。IPO 前投资人包括 Sam Altman、Ilya Sutskever、Andy Bechtolsheim 和
              Lip-Bu Tan（Intel CEO）。企业客户包括 AlphaSense（6,500+ 企业客户使用 Cerebras 做实时研究综合），另有医疗研究、密码学、能源和政府领域部署。Cerebras 提供
              Free/Developer/Enterprise API 分层，以及 Code Pro 和 Code Max 订阅方案。作为上市公司，Cerebras 拥有比 Positron
              更强的资本获取能力、公开市场问责和机构销售基础设施。
