  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: >-
              Positron 的主要收入机制，是把 Atlas 推理服务器系统直接卖给企业、云和专用计算客户。该公司销售一台专用 2U 服务器，内含 8 块基于 FPGA 的 Positron Archer 加速器，HBM
              总内存 256 GB，功耗包络 2 kW。收入在硬件交付时确认，符合标准资本设备销售。每套系统捆绑一份 24 小时 SLA 支持合约，由华盛顿 /
              美国团队服务，意味着硬件交易之外还有一条小规模附带服务收入。Positron 尚未公开宣布云 API、按 token 或按消耗计费模式。不过，合作伙伴 Parasail 以 Atlas 硬件支撑
              SnapServe LLM 托管，按终端用户层级每月收费 $30–$60，说明 Positron 作为上游硬件供应商获取价值，而合作伙伴在下游搭建经常性服务。Atlas
              公开标价未披露；采购需要通过官网联系销售表单直接接洽 Positron 销售团队。作为参照，云端推理 API 竞争对手的收费包括 Groq 每百万输入 token $0.075–$0.79、Cerebras
              从免费到企业订阅的层级，以及 SambaNova 的 SambaCloud API 定价；这些都不能与本地部署硬件销售直接对比，但定义了买家选择部署模式时必须权衡的单 token 成本经济性。
