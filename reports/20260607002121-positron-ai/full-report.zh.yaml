      - number: '2.4'
        title: 增长驱动、采用约束与监管环境
        blocks:
          - type: paragraph
            body: >-
              AI 推理加速器市场的结构性增长驱动，来自推理需求本身的复合增长：每一代前沿模型都提高参数量和上下文长度，若硬件效率不能同步提升，每 token 推理成本就会上升。Positron 的判断是，GPU 效率提升受
              HBM 稀缺约束，无法追上推理需求增长，因此为内存优先推理架构留下持久窗口。

              另外三项需求侧驱动可以观察，也有证据支撑。第一，能源可得性已经成为硬运营约束：超大规模云厂商资本开支（capex）在 2026 年估计达到 $600
              billion，数据中心用电越来越受公用事业侧限制和可持续承诺约束。第二，HBM 内存供应到 2026 年已被预先锁定，推动推理运营方向基于 LPDDR
              的替代方案迁移，以应对容量受限负载。第三，模型效率趋势（DeepSeek、Meta Llama 变体等更小、更聪明的模型）提高了低功耗硬件上高批量推理的可行性，扩大了推理专用加速器的适用理由。

              采用约束同样显著。CUDA 生态是最大的结构性壁垒：开发者、ML 工程师和企业 IT 团队在 NVIDIA 软件栈上积累多年工具、流程和组织知识；切换需要模型迁移、基准测试和验证。Positron
              的做法——支持兼容 OpenAI 的端点，并无需改代码接收 Hugging Face 模型二进制——降低了摩擦，但没有消除摩擦。资本强度是第二个约束：硅创业公司需要多年 NRE
              投资，才可能匹配既有厂商的可靠性和支持能力；企业买家在承诺基础设施前，也必须评估供应商长期存活能力。Groq 将 2025 年收入预测从 $2B+ 下调到 $500M，说明这一波动风险真实存在。

              监管环境加入了地缘政治维度。BIS 对先进计算 IC 的出口管制自 2022 年 10 月以来持续推进；AI Diffusion Rule 在 2025 年 5 月被提出后又被撤销，2026 年 1
              月最终规则则允许对中国大陆出口逐案审查。Remote Access Security Act 已在众议院以 369-22 票通过，将把出口管制延伸到先进 AI 算力的云端远程访问。国会将 BIS 2026
              财年预算提高 23%。这些管制给 Positron 同时带来风险和机会：作为美国制造的硬件平台，Positron 可能受益于供应链本地化偏好，并免受影响外国来源 AI
              芯片的限制；但作为面对国际客户的硬件供应商，公司也要承担合规负担。
