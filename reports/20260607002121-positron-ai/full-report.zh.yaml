      - number: '2.3'
        title: 买方、用户、付款方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              相比通用企业分层，Positron 的买方宇宙更适合从已确认部署和目标客户信号来理解。公司已宣布客户对应三个可观察买方原型。

              第一类是受电力约束的基础设施运营方。Cloudflare 是全球 CDN 和安全网络，拥有分布式、风冷数据中心，也是已确认早期客户。Cloudflare 硬件负责人 Andrew Wee 公开表示，AI
              能源需求不可持续，而 Positron Atlas 触发了该公司历史上对创业公司芯片最深入的评估。预算由硬件负责人和基础设施资本分配流程掌握。采用触发点是单机功耗成本和风冷兼容性，而不是理论峰值性能。

              第二类是对性能敏感的金融和量化计算公司。Jump Trading 先成为 Atlas 客户，随后共同领投 Series B。Jump CTO Alex Davies 称，在其特定推理负载上，Atlas 相较
              H100 系统端到端延迟低 3×，这是决定性技术因素。预算由 CTO 和技术基础设施职能掌握。采用触发点是每美元延迟，而非原始吞吐。

              第三类是 AI 原生的 Token 即服务或推理 API 提供商。Positron 称已在网络、游戏、内容审核、CDN 和 Token 即服务等垂直领域部署；这些类别的推理持续发生，每 token
              成本直接绑定单位经济性。预算由工程和基础设施负责人掌握。采用触发点是高吞吐下的成本效率。

              采用路径由硬件牵引，通常走四步：（1）试用/基准测试阶段（客户用特定负载把 Atlas 与既有 H100
              对比），（2）生产试点（在一个数据中心或一个机架有限部署），（3）在达到或超过宣称经济性后扩大部署，（4）潜在投资或长期供货协议（Jump Trading 共同领投即为证据）。Positron 的 Atlas
              是可插拔替代方案，通过兼容 OpenAI 的端点支持 Hugging Face transformer 模型，降低集成摩擦。当前主要采用约束是生态信任：相比既有 NVIDIA 关系，客户掌握的 Positron
              多年硬件路线图可靠性和售后支持深度证据有限。
