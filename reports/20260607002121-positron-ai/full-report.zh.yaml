          low: 8
          mid: 14
          high: 20
          unit: $M/month
          source: >-
            Analyst estimate based on ASIC development stage comparables and disclosed headcount signals; not publicly
            confirmed
        - label: Series B 轮交割后隐含现金跑道（月）
          low: 18
          mid: 24
          high: 36
          unit: months
          source: >-
            Derived from $230M Series B and monthly burn range above; assumes no material revenue offset; subject to
            revision
    approximationNotes: 收入区间省略，因为没有公开数据足以限定。毛利率、烧钱速度和现金跑道都是分析师估计，没有公开锚点。估值上限未知（仅披露下限）。所有区间都应视为示意性情景输入，不是财务指引。
    claimRefs:
