  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律不确定性上升速度快于 Positron 的公开合规记录
        blocks:
          - type: paragraph
            body: >-
              对任何先进计算供应商来说，出口管制风险现在都是一阶尽调事项，而 Positron 的路线图把它推向这一风险池的更中心。外部环境变化很快：BIS 在 2025 年 1 月扩大了先进计算和 AI
              模型权重管制，跟踪规则变化的律师称，晶圆厂、封装伙伴和远程访问 / IaaS 运营商现在面临更明确的尽调负担；政策结构本身也已经再次变化，BIS 开始撤销 AI Diffusion
              Rule，同时保留早前芯片管制并增加新的红旗指引。这使风险不再只是某一笔被禁止的出货，而是反复发生的分类、筛查、认证和交易对手监控工作。Positron
              的公开材料强调美国制造、未来自研硅和战略投资者，但已审阅来源没有展示可比的公开出口合规项目、ECCN
              披露或买方筛查流程。对一家试图卖给云、交易，以及潜在国际主权或受监管环境的创业公司来说，这个合规缺口可能在产生执法敞口之前就拖慢交易。法律 / IP
              侧的公开证据也不足：本次审阅的公开专利搜索界面没有得出可清晰审阅的 Positron 专利组合，因此护城河和 freedom-to-operate 需要直接尽调，而不是假设。
