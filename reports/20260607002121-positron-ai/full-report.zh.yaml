              描述为风冷系统，可放进现有数据中心边界，而不需要液冷改造或小众网络方案。这很重要，因为公开客户引用指向的环境同时在意功耗、延迟和铺开速度：Cloudflare 的分布式 AI 平台、Parasail 的
