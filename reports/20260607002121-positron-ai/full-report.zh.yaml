      - number: '1.3'
        title: 融资历史、投资方与估值
        blocks:
          - type: paragraph
            body: >
              Positron 已通过三次披露的融资事件募集略高于 $305 million。种子轮总额约 $23.5 million；公司简介页面显示，第 8 个月时融资不足 $6 million，第 15 个月时不足
              $12.5 million，完整种子轮金额则在 Series A 前另行宣布。Series A 为 $51.6 million 超额认购轮，于 2025 年 7 月 28 日宣布，由 Valor Equity
              Partners、Atreides Management 和 DFJ Growth 领投，Flume Ventures（包括 Scott McNealy）、Resilience Reserve、1517 Fund
              和 Unless 参投。SemiAnalysis 创始人 Dylan Patel 同时列为顾问和投资人。

              Series B 于 2026 年 2 月 4 日宣布，募集 $230 million，投后估值超过 $1 billion，使 Positron 在成立约 34 个月后成为独角兽。该轮由 ARENA
              Private Wealth、Jump Trading 和 Unless 共同领投，新战略投资方包括 Qatar Investment Authority（QIA）、Arm Holdings 和
              Helena。所有 Series A 投资人——Valor、Atreides、DFJ Growth、Resilience Reserve、Flume 和
              1517——也继续参与。两轮融资均超额认购是正面信号；Jump Trading 在生产环境部署 Atlas，并在交易推理负载上观察到相较可比 H100 系统约 3×
              更低延迟后，从客户转为共同领投方，同样是正面信号。

              Series B 的战略投资方构成值得关注：QIA 带来主权 AI 基础设施兴趣（在 Web Summit Qatar 宣布）；Arm 因 Asimov 在芯片上使用 ARMv9 核心而带来技术合作角度；Jump
              Trading 则提供难以在纯财务交易中复制的高频交易客户验证。合在一起，这说明 Positron 已成功吸引带有非财务动机的参与方，以 Series B 规模投入资金。

              收入、EBITDA 和年经常性收入（ARR）均未公开披露。公司称自己预计 2026
              年会有「强劲收入增长」，并定位为有望成为史上增长最快的硅公司之一，但这些都是公司发布的前瞻性表述，缺少第三方验证。作为私营公司，其精确股权结构表、按比例跟投权、优先股堆叠和董事会构成均未披露。
