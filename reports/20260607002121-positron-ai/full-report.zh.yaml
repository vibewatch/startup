figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Positron 的公开记录从 2023 年春季创立延伸到 34 个月后跻身独角兽，主线是 Atlas 快速落地、两轮超额认购融资，以及一名客户转为共同领投方。
    data:
      items:
        - date: 2023-04
          label: 在内华达州 Reno 创立
