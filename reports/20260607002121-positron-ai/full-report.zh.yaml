  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值 / 证据
      - 为何推翻论点
      - 行动含义
    rows:
      - - Asimov 进度大幅滑坡
        - 流片错过 2026 年末窗口，或量产明显推迟到 2027 年初以后
        - 当前价格取决于下一次资本决策前，定制硅片进展是否可信。
        - 除非价格重置且资本结构仍干净，否则转为回避。
      - - 具名客户验证没有拓宽
        - 没有新的生产客户，也没有标杆用户深化部署的证据
        - 商业化故事对独角兽硬件估值来说仍太窄。
        - 建议维持跟踪；若现金消耗上升，则下调。
      - - 小模型趋势跑赢内存密集型需求
        - 客户工作负载组合转向更便宜的小模型部署
        - Positron 就是在为一个收缩中的高端细分市场优化。
        - 将场景区间下修至熊市侧，并重估 TAM 假设。
      - - 巨头价格或捆绑压力加剧
        - 同业定价和巨头捆绑压窄 token 经济性优势
        - 仅靠架构新颖性，已撑不起高毛利预期。
        - 下调估值支撑分，并收紧入场纪律。
      - - 数据室显示优先权或债务包袱很重
        - 尽调中出现重大清算优先序列、认股权证或优先债务
        - 表面企业价值会高估普通股上行空间。
        - 有效入场回报重算前，不领投也不买入。
    notes: 否决触发项绑定可监控的路线图、客户、市场和资本结构事件，而不是只看情绪。
