chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >
              Positron AI 将自己定位为一家为 AI 推理专门打造硬件的公司，使命是大幅降低 transformer 模型推理的成本和能耗。公司总部在 Nevada 州
              Reno，团队以远程优先方式分布在美国各地。公司成立于 2023 年春季；这一日期得到公司简介页面和多篇媒体报道交叉佐证。按 2026 年 6 月报告日计算，公司约 38 个月大。

              商业模式是销售硬件产品：Positron 设计并向云服务商、企业和推理负载重的运营方销售推理加速器系统。旗舰产品 Atlas 是第一代 transformer 推理服务器，围绕 Altera Agilex
              FPGA 芯片打造，并在美国制造和组装。相较 Nvidia H100，Atlas 的营销重点是三项指标：每美元性能高 3.5×，功耗最高低 66%，内存带宽利用率达 93%，而 GPU 系统通常为
              10–30%。客户可用拖放方式加载任何兼容 HuggingFace Transformers 的模型，并通过兼容 OpenAI API 的端点提供服务，无需改代码。

              Atlas 之外，公司还在搭建两条产品路线。Asimov 是一颗定制 ASIC 芯片，设计从内存出发，使用 LPDDR5x 而非 HBM；目标是单芯片 864 GB 至 2.3 TB 内存、2.76 TB/s
              可实现带宽，并在约 400W TDP 下风冷运行。Titan 是基于四颗 Asimov 芯片的下一代系统，目标是单服务器 8+ TB 内存，并支持最高 16 trillion 参数模型。按运行日的
              Positron 网站信息，两款产品都标注为「2027 年推出」。公司的战略判断是，现代 transformer 推理受限于内存而非算力；为训练而设计的 GPU，用在大规模生产推理上并不高效。

              Positron 强调美国制造供应链，把它同时包装成差异化和国家安全论点；在 GPU 供应紧张、推理成本上升、电网供电受限的背景下，公司也把自己定位为客户降低 Nvidia 依赖的替代选择。
