  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与分类
        blocks:
          - type: paragraph
            body: >
              Positron AI 位于两个重叠竞争市场的交叉处：本地部署 AI 推理加速器硬件市场（向企业和云买家直销定制硅服务器），以及云托管 AI 推理 API
              市场（按使用量付费获取加速推理）。买方落在哪个竞争桶里，会实质改变对标对象。

              在本地部署推理硬件中，直接同业包括 Groq（基于 LPU 的定制 ASIC 机架）、Cerebras（Wafer-Scale Engine 系统，现已上市）、SambaNova（RDU
              数据流芯片）、Tenstorrent（基于 RISC-V 的 AI 加速器与 Galaxy 系统）和 d-Matrix（3DIMC chiplet 片上内存计算，PCIe 形态）。它们都瞄准
              transformer 推理负载，也共享同一判断：GPU 架构与推理负载并不匹配，因为 GPU 优化重点是算力而非内存带宽。Nvidia、AMD（Instinct MI 系列）和 Intel（Gaudi
              3）则是既有 GPU 与 GPU 邻近平台厂商；它们掌握绝大多数装机基础和软件生态忠诚度。

              云 API 替代品——GroqCloud、SambaCloud、Cerebras Inference API 和超大规模云 GPU 云——同样争夺开发者和企业推理预算，却不要求买方部署硬件。这一板块构成
              Positron 最主要的切换成本挑战：Groq、Cerebras 和 SambaNova 提供兼容 OpenAI 的
              API，让开发者只需两行代码即可迁移负载，软件层锁定很低。对本地部署买方来说，硬件切换成本更高，Positron 的差异化（内存带宽、风冷、美国制造供应链、隐私）也更持久。

              现状方案和自建替代也很重要。许多企业还没有部署专用 AI 推理硬件——它们仍在既有 GPU 集群或公有云 GPU 实例（AWS Inferentia、Google TPU、Azure AI
              Accelerators）上跑推理。对多数客户而言，芯片开发成本使内部自建并不现实；但 Google、Amazon、Microsoft
              等大型超大规模云厂商拥有自研硅，形成间接竞争。下方竞争图覆盖直接同业、既有加速器平台和云 API 替代品；不包括无法对外采购的超大规模云厂商自研硅。
