              - CI021
      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              Positron 的财务画像，是一家资本密集、硬件优先、处于早期商业化阶段的深科技创业公司。没有披露就无法评估收入质量：公开领域没有
              ARR、毛利率、现金消耗或单位经济性数据。公司的收入模式（直接硬件销售加捆绑支持）在结构上契合推理硬件市场，但能否规模化兑现，完全取决于 Atlas 出货量增长和 Asimov
              成功交付。主要资本充足性风险在于，$230 million Series B 是否足以支撑 Asimov 从设计走到初始量产爬坡，而不必在 2027 年再融资 Series C；如果 ASIC
              开发延迟或成本上升，到 2027 年末资金桥可能变得关键。竞争对手 Groq 将 2025 年收入预测从超过 $2 billion 下调到约 $500
              million，是一个重要反向可比样本：即便资金充足的推理硬件公司，也会在 GPU 既有巨头反击、开源模型效率提升压缩推理单 token 成本时，面对严重需求波动和定价压力。Atlas 已在
              Cloudflare、Jump Trading 和 Parasail 的生产中出货部署，确认真实客户部署并验证了基础用例，但这些部署都没有在公开披露中给出规模或价格。NVIDIA 的持续主导地位已由其 2026
              年 5 月 SEC 10-Q 文件确认，构成 Atlas 必须维持定价权的竞争基准。关键尽调阻断项——缺少审计财务、没有独立基准验证、未披露收入曲线、没有烧钱 /
              现金跑道数据——意味着本章结论是“有意思，但不透明”。
            claimRefs:
              - CI002
              - CI010
              - CI028
              - CI031
              - CI039
              - CI040
