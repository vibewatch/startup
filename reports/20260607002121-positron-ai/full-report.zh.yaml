      - number: '7.3'
        title: 伙伴、客户与生态依赖具备战略价值，但仍然集中
        blocks:
          - type: paragraph
            body: >-
              Positron 的早期伙伴图谱质量高，但集中度很明显。公开记录仍围绕 3 个具名关系：Cloudflare、Jump Trading 和 Parasail。每个关系都有价值，也都有附带条件。Cloudflare
              是 Positron 目标功耗受限分布式环境里的标杆客户，但最具体公开表述仍描述的是长期资格验证流程，更大规模铺开取决于性能。Jump 是最强证明点，因为它先是客户，测试 Atlas
              后又成为联合领投投资者，但它也是非常具体的买方画像，工作负载是延迟敏感的交易，而不是广泛企业参考群。Parasail 是有吸引力的渠道型伙伴，因为它已经通过模型无关 GPU 网络每天服务 500B+
              tokens，但同样的硬件多样性意味着这段关系不太可能排他。除具名客户外，Positron 自己的发布稿指向 Arm、Supermicro 和其他供应链伙伴；其软件策略则有意绕开而不是对抗 Nvidia
              训练出来的模型生态。这样能降低切换摩擦，但也意味着 Positron 仍依赖第三方平台、买方批准和不受其控制的生态行为。
