        - 筹集 >$350M 战略资本；估值未披露
        - 有用的私营推理同业，明确主打 TCO 和企业销售。
        - 未披露估值标记，因此只能提供方向性而非精确定价可比。
      - - NVIDIA
        - 上市公司；2026 财年披露主体
        - $215.9B 收入，持续 SEC 披露节奏
        - 设定 AI 基础设施在融资能力、披露质量和买家预期上的上限。
        - 规模和业务过于多元，不能直接用于 Positron 定价倍数。
      - - AMD / Intel / Arm
        - 上市公司；2026 年持续申报
        - 常规 10-Q 或 6-K 节奏，具备公开市场流动性
        - 更适合衡量退出准备度和披露标准，而非直接匹配倍数。
        - 上市规模和业务组合仍远比 Positron 更广。
