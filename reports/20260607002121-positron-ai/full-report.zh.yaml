      - number: '1.4'
        title: 客户牵引、规模指标与证据缺口
        blocks:
          - type: paragraph
            body: >
              Positron 已公开确认的客户包括 Cloudflare 和 Parasail（通过其 SnapServe 平台）。公司简介页面和多份投资者沟通材料还提到网络、游戏、内容审核、CDN 和 Token
              即服务等垂直领域客户，但未具名。Cloudflare 硬件负责人称，其部署达到「深度技术评估」门槛，而此前只有一家未具名创业公司获得过同等级评估；更大范围全球部署的条件是 Atlas
              必须「交付宣传中的指标」。Jump Trading 的验证是最强公开第三方证据：该公司在生产环境部署 Atlas，在交易推理负载上观察到相较 H100 约 3× 更低的端到端延迟，随后共同领投 Series B。

              员工数、收入、收入运行率、年经常性收入（ARR）、毛利率和净留存率（NRR）均完全未披露。公司在第 15 个月时有 15 人，公司简介页面和媒体材料没有给出更新的员工数。Positron 自称远程优先，总部位于
              Nevada 州 Reno。GitHub 活动（positron-ai 组织下有 aiperf、guidellm、hf-litmus，以及 transformers 和 llama.cpp 的
              fork）证实工程仍在推进，但无法反映团队规模。

              性能宣称来自公司发布，尚未由独立第三方基准机构复现。SemiAnalysis 的 Dylan
              Patel——顾问兼投资人——发表过评论支持内存路线，但他披露了财务利益相关身份，因此独立佐证权重有限。Cloudflare
              正在试验，但尚未发布结果。这些都是重要缺口，后续章节必须把它们作为开放尽调问题保留下来。
