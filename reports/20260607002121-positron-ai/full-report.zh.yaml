        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Positron 已在三轮融资中合计筹集约 $305 million：$12.5 million 种子轮（2023–2024）、$51.6 million Series A（2025 年 7 月，2025
              年总融资超过 $75 million），以及 2026-02-04 完成、投后估值超过 $1 billion 的 $230 million Series B。Series B 超额认购，由 ARENA
              Private Wealth、Jump Trading 和 Unless 联合领投，Qatar Investment Authority（QIA）、Arm Holdings 和 Helena
              提供战略投资。资金用途指定为 Asimov ASIC 开发（目标 2026 年末 tape-out、2027 年初投产）、Atlas 部署扩张和团队增长。现金余额、月度烧钱速度和剩余现金跑道均未公开。参照进行自研
              ASIC 开发周期的早期半导体创业公司，估计月度烧钱速度可能为 $8–20 million，意味着从 2026 年 2 月交割起大致有 18–36
              个月现金跑道——不过这是分析师估计，没有公开数据锚定。公司尚未公开披露信贷额度、设备融资、项目融资或债务义务。Positron 称预期 2026 年收入强劲增长，但未披露具体收入曲线、ARR
              目标或下一轮融资的里程碑触发点。相对纯软件同业，公司的资本强度很高：自研 ASIC 开发、美国本土制造关系和硬件供应链，都要求在 Asimov/Titan 收入足以实质抵消运营开支之前持续获得资本。
