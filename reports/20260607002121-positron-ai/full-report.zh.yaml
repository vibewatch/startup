      - number: '8.2'
        title: 融资背景与可比支持：轮次处在火热推理市场中，但仍远落后于规模化同业
        blocks:
          - type: paragraph
            body: >-
              Positron 受益于在一个仍奖励推理基础设施的市场中发行股票，但可比样本也显示还有大量证据缺失。IDC 和 TechInsights 都把 2026 年描述为推理、数据中心规模和能效走到 AI
              硬件支出中心的一年。Research and Markets 的创业公司盘点与 Polaris 的 AI 芯片评论都指向对推理中心挑战者的持续融资；Groq 和 SambaNova
              则说明，能把架构叙事转化为商业进展的公司，仍能拿到后期私募资本。Groq 2025 年 9 月融资把该公司估值推到 $6.9 billion，Cerebras 于 2026 年 5 月完成
              IPO，SambaNova 于 2026 年 2 月获得超过 $350 million 新战略资本。在这个背景下，Positron 的 $1B+ 标记并不荒谬。但公开可比公司也更成熟或更透明。NVIDIA
              2026 财年文件披露 $215.9 billion 收入和详细风险因素；MarketBeat 与 SEC 界面显示 AMD、Intel 和 Arm 都保持常规公开申报节奏，因此给投资者提供了 Positron
              不具备的流动性和披露。务实结论是，该轮价格作为战略里程碑可以支撑；但如果执行滑坡，公司尚未挣到公开同业享有的披露溢价，因此仍有暴露。
