      - number: '4.6'
        title: 展项
        blocks:
          - type: callout
            title: 客户升级为投资者，验证 GTM 轨迹
            body: >-
              Jump Trading 从 Atlas 客户发展为 Series B 联合领投投资者，是现阶段最强的 GTM 验证信号之一。该公司 CTO 公开称，在生产评估中端到端延迟约比 H100 低 3 倍，Jump
              随后以联合领投规模投入资本。销售到投资的周期被压缩，说明技术信念和商业需求是真实的，不是营销推动。对承销方而言，关键问题是这种模式能否在更广的一组企业客户中、以有意义的规模复制。
            calloutType: strength
            claimRefs:
              - CI017
              - CI018
          - type: callout
            title: 私营公司不透明是主要尽调阻断项
            body: >-
              Positron 尚未以任何形式公开披露收入、ARR、毛利率、现金余额、烧钱速度或单位经济性。整个财务承销只能建立在代理指标上——客户
              logo、投资者质量和基准性能主张——而不是审计财务或管理层报告的财务数据。对一家已融资 $305M、处于 Series B
              阶段的硬件创业公司来说，这很正常，但也意味着没有数据室，就无法判断收入质量、毛利率路径或资本充足性。这是当前阶段任何尽调工作的阻断问题。
            calloutType: risk
            claimRefs:
              - CI010
              - CI039
          - type: callout
            title: Groq 收入波动是直接的行业反向信号
            body: >-
              Groq 将 2025 年收入预测从超过 $2 billion 下调到约 $500 million，凸显 AI 推理硬件市场的结构性波动。即使一家已融资
              $750M+、专注推理芯片且资金充足的公司，也可能遭遇剧烈收入短缺。对 Positron 来说，这说明客户集中、需求波动以及 GPU
              既有厂商带来的竞争性定价压力，都是现实执行风险。缺少多元化收入基础或披露客户数，使外部无法评估 Positron 是否面临类似集中度动态。
