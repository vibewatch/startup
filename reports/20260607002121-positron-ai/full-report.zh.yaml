      - number: '1.2'
        title: 创始人、领导层与关键人物依赖
        blocks:
          - type: paragraph
            body: >
              Positron 由两人共同创立：Thomas Sohmers（CTO）和 Edward Kmett（首席科学家）。Sohmers 曾任竞争性 AI 推理芯片公司 Groq
              的技术战略总监，直接接触过推理市场的架构选择和客户需求。Kmett 是应用数学家，在函数式编程和编译器设计社区知名，为 Positron
              的内存优化方法提供数学基础。公司简介页面把创立故事描述为「一位愿景者、一位应用数学家和一位工程师」的协作，暗示可能存在第三位联合创始人或早期关键技术贡献者；公开证据尚未解开这一点。

              Mitesh Agrawal 在公司成立约第 21 个月加入并出任 CEO，大致是 2024 年末或 2025 年初；Sohmers 同期从 CEO 转任 CTO。Agrawal 此前是 Nvidia 生态 AI
              云服务商 Lambda 的 COO，曾帮助公司从约 $500,000 年化收入运行率扩到近 $500 million，并参与数亿美元融资。他的加入是结构性拐点：Positron
              在需要把早期工程可信度转化为企业销售和融资动能时，引入了一位熟悉大规模 GPU 客户经济性的成熟商业运营者。

              关键人物集中度是实质性风险。Agrawal 是主要商业门面：宣布 Series A 和 Series B 的 CEO，出现在所有主要媒体访谈中，也在官方投资者新闻稿中被引用。Sohmers
              掌握推动客户评估决策的技术可信度（Cloudflare 的「深度技术评估」语境，以及 Jump Trading 的尽调）。Kmett
              的角色更偏科学架构而非日常运营，但若离开，会削弱芯片设计的智力根基。董事会构成、治理结构，以及三人之下的高管梯队深度均未公开，继任风险因此难以评估。
