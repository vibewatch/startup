  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Positron AI 的市场边界，是更广泛 AI 半导体和数据中心基础设施市场中的 AI 推理加速器细分。计入的支出包括用于在生产环境运行已训练 AI
              模型的专用硬件——定制推理加速器、推理优化服务器和相关内存子系统。不计入 AI 训练集群、并非面向推理的通用 CPU/GPU 采购、消费设备神经处理单元和自动驾驶芯片。相邻领域是更广泛的智能数据中心板块；IDC
              估计，2026 年该板块在 CPU、AI 加速器、GPU、定制 ASIC 和网络芯片上的规模为 $281 billion。Positron 只覆盖其中面向推理的子集。

              必须清楚定义现状替代品，因为它们揭示了买方面临的真实切换决策。主导替代品是 NVIDIA GPU 基础设施——H100、H200 和 Blackwell 系列系统，它们在同一个 CUDA
              生态里同时支持训练和推理负载。云托管推理 API（如 AWS Bedrock、Google Vertex、Azure AI）是第二类替代品：尚未建设本地 AI 基础设施的企业，向超大规模云厂商按 token
              付费，而非部署硬件。第三类是用量化或蒸馏模型做 CPU 推理，适用于低吞吐或成本受限负载。第四类是超大规模云厂商自研 ASIC（Google TPU、Amazon
              Trainium/Inferentia、Microsoft Maia、Meta MTIA），它们吸收最大云运营商的预算，但企业买家无法外采。

              Positron 的核心论点是，随着推理负载扩张，上述替代方案会在三类约束中的一项或多项上失效：（1）功率密度——NVIDIA Hopper 和 Blackwell
              系统越来越依赖液冷，无法进入风冷数据中心机群；（2）内存容量——大上下文窗口和多万亿参数模型上的 transformer 推理，会比 HBM 供应更快耗尽 GPU 内存；（3）每 token
              成本——在推理规模下，GPU 经济性不如面向内存受限负载、基于 LPDDR 的推理优化架构。功率、内存或经济性让主导 GPU 替代品无法满足需求的 AI 推理部署子集，构成 Positron 的可服务可用市场。
