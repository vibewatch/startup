        blocks:
          - type: paragraph
            body: >-
              由于 Positron 尚未公开披露收入、毛利率、积压订单、烧钱或 Series B 证券经济性，任何情景区间都必须基于里程碑，而不是伪精确的倍数数学。关键敏感性不在于市场抽象上是否喜欢推理，而在于
              Positron 能否在自研硅转换消耗更多资本之前，把已出货 Atlas 的叙事转化为可重复的商业证据。上行情景需要三件事同时发生：Atlas 部署需要突破灯塔账户，Asimov 必须按 2026 年末
              tape-out、可信 2027 年初投产节奏推进，买方也需要继续为高能效替代方案付费，而不是默认回到既有 GPU
              栈。基准情景假设公司保持战略价值，但尚未证明足够多，无法实质扩大本轮估值标记。悲观情景很容易从公开证据勾勒：较小模型采用削弱对巨内存系统的需求，CUDA 和既有厂商捆绑维持高切换成本，任何 tape-out
              延迟都会在路线图验证前把公司推回融资市场。在这个框架下，价格敏感性很陡：温和执行失误就可能抹掉按当前披露门槛买入的大部分名义上行。
