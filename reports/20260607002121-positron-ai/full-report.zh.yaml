      - number: '7.4'
        title: 资本强度与模型风险被估值和更强对手资产负债表放大
        blocks:
          - type: paragraph
            body: >-
              这里的财务风险，与其说是短期破产，不如说是估值、资本需求和市场在路线图脚下移动速度之间的错配。Positron 已融资略高于 $300M，并达到 $1B+
              估值；对一家年轻硬件公司来说，这是有意义的支持，但路线图仍需要 tape-out、量产爬坡、客户资格验证和现场执行，而这个赛道极其昂贵。Jon Peddie 称公司迄今花费约
              $38M，并报告采购订单高于这一金额；但公开记录仍未披露毛利率、积压订单质量、按收入计算的客户集中度，或当前采购订单是否会转化为重复生产需求。Benchmark 可信度很重要，因为估值隐含假设是 Atlas
              进展和 Asimov/Titan 路线图转化。与此同时，市场可能从两侧收缩。AIM Media
              的反向逻辑认为，较小模型可能缩小对前沿内存推理硬件的可寻址需求；资本更充足的对手则继续补齐分销和制造短板。SambaNova 2026 年公告把新资本、Intel
              和具名生产部署放在一起，说明执行比较会多快变得苛刻。如果 Positron 在进度或证据上滑坡，追赶所需资本可能比客户信任上升得更快。
