        - 没有成文出口项目，或客户尽调反复遇到摩擦
        - 尽调期间无法提供 ECCN、筛查控制或托管访问政策
        - 上调法律风险，限制国际扩张假设，并推迟形成高信心判断
      - - 制造转换
        - Asimov 里程碑滑坡
        - 流片明显晚于 2026 年末，或早期样品未能在 2027 年初窗口到位
        - 将投资逻辑权重调回 Atlas 单一经济性，并假设更高资本需求
      - - 基准与客户集中度
        - 标杆部署仍然狭窄或附带条件
        - Cloudflare 仍停留在试验，新具名生产客户没有出现，或基准复现仍仅限内部
        - 把增长说法视为未证实，并下调收入 / 估值假设
      - - 资本强度与执行
        - 路线图跑得比组织深度或融资能力更快
        - 量产爬坡前需要新增资本，或运营 / 合规梯队未见明显搭建
