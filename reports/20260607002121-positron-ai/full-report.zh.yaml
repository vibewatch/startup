      - number: '5.2'
        title: 架构与软件栈
        blocks:
          - type: paragraph
            body: >-
              Positron 的架构论点很明确：transformer 推理受内存和功耗约束，所以胜出的设计应该优化实际内存带宽、内存容量和部署经济性，而不是追逐标称 FLOPS。Atlas
              把这一论点落在已出货服务器上，配套 Positron 的推理引擎；Asimov 则把它延伸到自研硅，采用 LPDDR5x、双半球设计、片上 ARMv9 控制核心、可重构脉动阵列、专用向量函数硬件、PCIe
              Gen6 加 CXL，以及高带宽芯片间互连。Titan 再把 4 颗 Asimov
              芯片封装成一个系统，定位万亿级参数和长上下文工作负载。公开开发者信号显示，围绕这些硬件的软件姿态更偏兼容，而不是替换生态：GitHub 组织里有大量 benchmark、模型兼容和开源 fork
              活动，hf-litmus 明确提到一条面向 Hugging Face 模型的 Tron 编译 pipeline。不过，“不需要复杂 compiler stack”和 Tron
              具体做的事情之间，公开材料尚未对齐。Positron 有可信证据表明其具备模型摄取和 benchmarking 层，但还没有完整公开的运行时 / 控制平面架构文档。
