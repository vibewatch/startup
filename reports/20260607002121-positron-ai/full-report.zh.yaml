  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 状态
      - 估值 / 披露信号
      - 与 Positron 的相关性
      - 局限
    rows:
      - - Positron AI
        - 私营；2026 年 2 月 Series B 轮
        - 投后 >$1B，新增资本 $230M
        - 标的公司；检验一家已出货但收入未披露的推理厂商能否撑住独角兽价格。
