  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与投资逻辑：公开证据让 $1B+ 轮次合理，但不算明显便宜
        blocks:
          - type: paragraph
            body: >-
              公开证据支持的最干净投资判断是观察，置信度中等。公开融资证据真实，而且对一家私营半导体创业公司来说交叉印证异常充分：Positron 于 2026-02-04 宣布 $230 million Series
              B，投后估值超过 $1 billion，多家独立媒体重复了融资金额和投资者名单，这些报道也确认累计披露资本刚刚超过 $300
              million。这跨过了估值工作的第一道门槛：价格存在，并非传言。更难的问题是公开记录是否足以支撑按这个价格买入。这里的记录是混合的。乐观逻辑很直接：Atlas 已经出货，具名客户包括 Cloudflare 和
              Parasail，Jump Trading 先以客户身份出现、随后成为 Series B
              联合领投，公司路线图也直接瞄准内存与功耗瓶颈，而分析师越来越多地把这些瓶颈描述为推理基础设施的限制因素。反向逻辑同样重要：几乎所有性能和路线图数据点仍来自公司主张，收入和毛利率未披露，也没有公开股权结构表、债务或二级市场信息能让外部投资者建模真实进入经济性。这个组合支持密切跟踪公司并积极尽调，但不支持把当前价格承销为明显便宜。
