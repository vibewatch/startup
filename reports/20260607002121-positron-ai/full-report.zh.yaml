      - number: '4.3'
        title: 成本结构与毛利率路径
        blocks:
          - type: paragraph
            body: >-
              Atlas 依赖基于 FPGA 的架构，使用 Intel Altera（Agilex 级）芯片，在美国 Intel 晶圆代工设施制造，服务器最终组装也在美国完成。由于 FPGA 定价机制，基于 FPGA
              的推理硬件通常比同级 GPU 有更高的单位组件成本，不过节能和风冷形态可能降低买家的总部署成本。基于硬件创业公司可比样本，Atlas 毛利率估计在 30–55%
              区间，但没有公开披露、审计文件或独立估计可验证。转向 Asimov 自研 ASIC 后，成本结构会明显不同：前期非经常性工程（NRE）和 mask set 成本更高，但量产时单位 COGS 更低，这是 ASIC
              毛利改善的典型路径。营运资金需求包括 FPGA 芯片采购提前期、服务器组装，以及面向客户交付的库存缓冲；这些数字均未披露。AMD、Intel 和 Arm Holdings 都有公开 SEC EDGAR
              文件，可作为数据中心加速器单位经济性的竞争参照。库存、应收账款、营运资金或运营费用拆分均未公开。Asimov ASIC 开发是一项多年期 R&D 资本投入，是 Series B
              支出的主要部分；这与自研硅从启动设计到投产通常 18–24 个月的开发周期一致。
