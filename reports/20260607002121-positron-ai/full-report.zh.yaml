      - CI009
      - CI035
  - id: FI004
    title: 资本强度与现金流地图
    type: flow
    layout: standard
    summary: Positron 如何把 Series B 资金投入开发里程碑，直到 Asimov/Titan 收入必须开始抵消经营性烧钱的节点。
    data:
      nodes:
        - id: series-b
          label: Series B 募资（$230M，2026 年 2 月）
          detail: 超额认购轮次，由 ARENA、Jump Trading、Unless 共同领投；QIA、Arm、Helena 作为战略方参投。
          tone: positive
        - id: asimov-dev
          label: Asimov ASIC NRE 与流片
          detail: 自研芯片设计、验证、掩膜、TSMC 晶圆厂 NRE。目标 2026 年末流片。
          tone: warning
        - id: atlas-scale
          label: Atlas 制造与销售放量
          detail: 库存采购、组装爬坡、直销团队扩张；产生早期收入。
          tone: positive
        - id: titan-readiness
          label: Titan 系统集成与认证
          detail: 围绕 4x Asimov 芯片做系统设计，与 Supermicro 合作；仍是收入前投入。
          tone: warning
        - id: revenue-bridge
          label: 收入桥接——Atlas 收入何时抵消烧钱
          detail: Atlas 出货量必须在 Asimov 量产（2027）前显著增长，才能降低现金消耗。
          tone: warning
        - id: series-c-trigger
          label: Series C / 下一轮融资触发点
          detail: 如果 Asimov 爬坡延迟或 Atlas 出货量不及预期，2027 年末前大概率需要 Series C。
          tone: warning
      edges:
        - from: series-b
          to: asimov-dev
        - from: series-b
          to: atlas-scale
        - from: series-b
          to: titan-readiness
        - from: atlas-scale
          to: revenue-bridge
        - from: revenue-bridge
          to: series-c-trigger
        - from: asimov-dev
          to: titan-readiness
    approximationNotes: 所有时点和规模均为分析师推导。Positron 未披露公开烧钱速度、资本开支拆分或收入排期。Series C 触发点是尽调假设，不是公司表述。
    claimRefs:
      - CI008
      - CI021
  - id: FE001
    title: 产品架构图
    type: stack
    layout: standard
    summary: 分层展示 Positron 公开技术栈：从模型资产和兼容工具，到当前 Atlas 硬件和 Asimov/Titan 路线图。
    data:
