      - number: '3.6'
        title: 图表与要点
        blocks:
          - type: callout
            title: 资本差距制造 ASIC 执行风险
            body: >-
              Positron 的 Asimov 定制 ASIC 目标 2027 年量产，但累计融资 $305 million，使其相对 Groq（$6.9 B 估值）、Cerebras（$6.38 B IPO）和
              SambaNova（$350 M+ Series E）处于资本劣势。出货一颗有竞争力的定制推理芯片，通常需要 $200–500 M 用于芯片设计、tape-out 和爬坡成本。如果 Asimov
              延迟或表现不及预期，Positron 的 FPGA Atlas 会面临商品化压力，竞争对手则是资本更充足、分销渠道不断扩大的 ASIC 同业。
            calloutType: risk
            claimRefs:
              - CP038
              - CP042
              - CP043
          - type: callout
            title: 云 API 缺口是结构性市场范围约束
            body: >-
              主要同业 Groq、Cerebras、SambaNova 都同时提供本地部署硬件和云端推理 API。Positron 只卖本地部署硬件。因此，Positron 暂时覆盖不了贡献 API
              使用量的开发者和中小企业（SME）客群，短期 TAM 被限制在有明确本地部署需求的企业买家；相较靠订阅和用量计费的竞争对手，公司也缺一条经常性收入流。
            calloutType: insight
            claimRefs:
              - CP033
              - CP034
              - CP038
              - CP040
          - type: callout
            title: 本地部署的内存优先差异化在受监管垂直行业更耐久
            body: >-
              金融交易（Jump Trading）和 CDN / 安全（Cloudflare）场景需要本地部署；背后是延迟、数据驻留或合规要求，云端 API 无法满足。Positron
              的模型加载足够简单（HuggingFace 拖拽、OpenAI 兼容端点），加上内存带宽效率，在这些细分市场形成守得住的价值。Groq 和 Cerebras 尚未宣布在 Atlas 的价格 /
              形态层级推出竞争性本地部署硬件产品。
            calloutType: strength
            claimRefs:
