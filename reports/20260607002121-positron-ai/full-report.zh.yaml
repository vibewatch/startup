  - id: TM001
    title: 市场定义表
    columns:
      - 细分市场 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 相关性
    rows:
      - - AI 推理加速器（专用）
        - 部署在生产数据中心的专用推理服务器、推理 ASIC，以及为推理优化的 GPU 配置
        - 训练集群、非推理用途 GPU 资本开支、消费级 NPU
        - 云运营商、企业 IT、推理 API 提供商、高频交易公司
        - Positron Atlas 和 Asimov/Titan 平台的核心直接市场
      - - NVIDIA GPU 基础设施（现状替代品）
        - 用于推理的 H100、H200、Blackwell GPU 系统；包括液冷和风冷版本
        - 仅用于训练的 GPU 集群
        - CTO、基础设施资本配置、云采购
        - Positron 必须替代或共存的主导现有替代品
      - - 云推理 API（现状替代品）
        - AWS、Google、Azure 按 token 计费的托管推理服务；包括托管模型端点
        - 本地服务器资本开支、硬件所有权成本
        - 按用量付费的工程负责人和产品团队
        - 企业尚未运行本地推理硬件时的主要替代方案
      - - 超大规模云厂商自研 ASIC（现状替代品）
        - Google TPU、Amazon Trainium/Inferentia、Microsoft Maia、Meta MTIA，在各自云内部署
        - 可供第三方企业买方采购的硬件
        - 内部云工程团队；外部企业买方无法获取
        - 总规模可观，但不是 Positron 目标买方的直接竞争
      - - 智能数据中心相邻市场
        - 数据中心建设中与 AI 加速器配套的 CPU、网络芯片、存储和服务器机箱
        - 消费设备 NPU、汽车芯片、工业 IoT 半导体
        - 数据中心运营商、系统集成商、超大规模云厂商
        - IDC $281B 智能数据中心细分市场的 TAM 背景；大多不在 Positron 直接 SAM 内
      - - 边缘和端侧推理
        - 面向边缘服务器、移动设备和 IoT 的 10W 以下推理芯片；端侧 LLM NPU
        - 高功耗数据中心推理硬件
        - 消费电子 OEM、边缘计算供应商、电信边缘运营商
        - 相邻市场；Positron 的 Atlas 或 Titan 不在这里竞争
    notes: 细分边界来自 IDC 数据中心半导体分类、公开产品披露和分析师覆盖。支出估算是结构性边界描述，不是美元金额估计。Positron 的 SAM 是专用推理加速器支出的子集，在该子集中，功耗、内存和经济性约束有利于非 GPU 架构。
    claimRefs:
