  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入质量包
        - 过去收入、毛利率、客户集中度、积压订单和现金消耗
        - 缺少这些数据，当前价格无法用基本面承销。
        - 任何投资决策前，索取 CFO 材料包或董事会 deck。
      - - 股权结构和优先权序列
        - 证券条款、清算优先权、认股权证、SAFEs 和任何风险债务
        - 表面 EV 未必能转化为有吸引力的普通股回报。
        - 获取最新 cap table 模型和律师摘要。
      - - 制造经济性
        - Asimov/Titan 爬坡的晶圆厂、封装、NRE、营运资本和库存计划
        - 如果误判规模成本，半导体上行会被资本强度吃掉。
        - 与运营和财务负责人审查供应链计划。
      - - 客户扩张证明
        - 标杆客户的付费生产支出、续约模式和经基准验证的节省
        - 具名账户只有转化为重复商业需求才有意义。
        - 访谈头部客户，并索取 cohort 视图。
      - - 基准验证
        - 相比现有巨头替代方案的独立每瓦性能和延迟测试
        - 当前大多数优势主张仍来自公司自述或伙伴引用。
        - 委托第三方基准测试，或查看买方测试数据。
      - - 治理和退出权利
        - 董事会组成、保护性条款、ROFR、战略权利和任何主权投资者约束
        - 这些条款会影响潜在收购方范围、退出时间和投资者控制经济性。
        - 审阅章程、投资者权利和 term sheet 文件。
    notes: 这些索取项是从观望转向可承销买入决策的最低材料包。
