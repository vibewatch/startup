        - 路线图延误、商业化验证薄弱和融资环境收紧叠加，迫使公司在核心里程碑完成前再次融资。
        - $250-$500
        - 低
        - 产品过渡获得验证前，资本结构压力已经显性化。
    notes: 由于 Positron 未公开收入、利润率或股权条款，区间采用里程碑估算；这些区间应视为决策带，而非点预测。
