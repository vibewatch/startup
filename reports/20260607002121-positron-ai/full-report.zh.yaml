      - number: '3.5'
        title: 切换成本、锁定与护城河耐久性
        blocks:
          - type: paragraph
            body: >
              Positron 的竞争护城河结构上不对称：在开发者/云 API 板块较弱，在专用本地部署企业板块较强。在云 API 板块，Positron 没有提供竞争性云服务，因此开发者负载自然流向
              GroqCloud、SambaCloud 或 Cerebras Inference API；这些服务用 API key 即可开始，无需采购周期，并提供兼容 OpenAI
              的接口，入门摩擦更低。这些云提供商之间切换成本低：都提供兼容 Python/JavaScript SDK、按量计费和现货容量。Positron 的 FPGA Atlas 目前无法争夺云 API 开发者负载。

              在本地部署企业板块，硬件切换成本明显更高。一旦 Atlas 部署并接入客户数据管线——Cloudflare 和 Jump Trading
              即是例子——更换硬件就涉及采购周期、重新上架、重新测试和模型再优化。Positron 兼容 HuggingFace 的拖放式模型加载，以及兼容 OpenAI API
              的端点，降低了软件层切换成本；这是一把双刃剑：它降低初始评估门槛，也让客户后续更容易比较和切换。

              供应链准入和伙伴关系是第二层护城河。Positron 与 Altera（Intel 的 FPGA 部门）围绕 Agilex FPGA
              芯片的关系，以及其美国制造说法，形成供应链叙事差异化；在行政令推动「American AI Stack」（Groq 自身营销中也引用）的背景下尤其如此。不过，Groq 同样强调国内供应链可信度，SambaNova
              与 Intel 的合作则提供了比 Positron 已披露内容更直接的制造伙伴关系。

              商品化风险真实存在。推理加速器市场正在收敛到一组共同宣称（内存带宽、风冷、相较 GPU 的 TCO 优势）和基本功能（兼容 OpenAI API、兼容 HuggingFace 模型、企业安全）。当
              Groq、Cerebras、SambaNova 和 Tenstorrent 都提供这些功能时，Positron 的差异化收窄到三点：（a）本地部署模式，（b）Asimov ASIC
              路线图执行，（c）美国供应链定位。第一点随着云 API 改进而成为缩水护城河；第二点仍是未来押注，且融资规模远低于 Groq 的 $6.9 B 和 Cerebras 的 $6.38 B IPO
              募资；第三点是叙事差异化，尚未在披露交易中转化为可衡量的定价权或客户锁定。

              多栖使用在所有 AI 推理买家中都很常见：企业通常会测试多个供应商，再决定标准化对象。Positron 最强的锁定路径是 Asimov/Titan 路线图：部署 Atlas 并承诺过渡到 Asimov（计划
              2027 年）的客户，会形成更深的工作流集成和组织知识投入。但这一锁定要求 Asimov 按时出货并达到性能宣称；截至研究日，没有独立证据佐证这一执行风险已经消除。
