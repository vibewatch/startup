company:
  name: Positron AI
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports Positron's disclosed $230 million Series B at a valuation above $1 billion as plausible, but not obviously attractive. The company has real financing, named customers, and a differentiated memory-first roadmap, yet public disclosure remains too thin on revenue quality, cap table, and manufacturing economics to support a BUY call. The disciplined recommendation is TRACK with medium confidence and a fair-to-stretched view at the current disclosed threshold.
sections:
- id: recommendation-and-thesis
  title: 'Recommendation and thesis: public evidence makes the $1B+ round plausible, but not obviously cheap'
  body: >-
    The cleanest investment call supported by public evidence is TRACK with medium confidence. Public financing evidence is real and unusually well-corroborated for a private semiconductor startup: Positron announced a $230 million Series B on 2026-02-04 at a post-money valuation exceeding $1 billion, multiple independent outlets repeated the amount and investor set, and those reports also confirm that total disclosed capital now stands just above $300 million. That clears the first hurdle for valuation work: the price exists and is not a rumor. The harder question is whether the public record justifies paying into that price. Here the record is mixed. The bullish case is straightforward: Atlas is already shipping, named customers include Cloudflare and Parasail, Jump Trading first showed up as a customer and then as a Series B co-lead, and the company has a roadmap that aims directly at the memory and power bottlenecks analysts increasingly describe as the limiting factor in inference infrastructure.
    The anti-thesis is just as material: nearly every performance and roadmap datapoint remains company-claimed, revenue and margin are undisclosed, and there is no public cap-table, debt, or secondary-market information that would let an outside investor model true entry economics. That combination supports watching the company closely and diligencing aggressively, but not underwriting the current price as a clear bargain.
