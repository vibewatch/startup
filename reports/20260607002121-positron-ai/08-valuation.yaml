- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Illustrative valuation range (USD M)
  - Probability signal
  - Key downside trigger
  rows:
  - - Bull
    - >-
      Atlas converts lighthouse users into repeat production demand; Asimov tapes out in late 2026 and ships in early 2027; new lighthouse customers broaden proof; inference buyers continue paying for power-efficient alternatives.
    - $1,500-$2,000
    - Low to medium
    - Roadmap slip or proof that buyer demand is narrower than management expects.
  - - Base
    - >-
      Atlas traction remains real but concentrated; Asimov timing stays roughly on plan; no public revenue disclosure arrives, but no major negative surprise emerges.
    - $900-$1,300
    - Medium
    - Execution remains credible but not yet strong enough to justify multiple expansion from the round.
  - - Bear
    - >-
      Smaller models and incumbent bundling reduce urgency for giant-memory inference systems; Asimov slips; buyers wait for better-known suppliers.
    - $500-$800
