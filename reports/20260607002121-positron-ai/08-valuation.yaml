    - Delay before production silicon or weak customer expansion.
  - - Reset / down-round risk
    - >-
      Combination of roadmap delay, weak commercialization proof, and tougher financing conditions forces new capital before core milestones are met.
    - $250-$500
    - Low
    - Capital structure stress becomes visible before the product transition is validated.
