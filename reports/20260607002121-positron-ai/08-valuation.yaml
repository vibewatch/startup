figures:
- id: FV001
  title: Recommendation logic
  type: flow
  layout: wide
  summary: >-
    The recommendation path starts with validated financing and shipped-product proof, then gates the decision on financial transparency, roadmap delivery, and capital-structure visibility.
  data:
    nodes:
    - id: funding-proof
      label: $230M Series B at >$1B confirmed
      detail: Official press release plus independent reporting confirm the threshold valuation and round size.
      tone: positive
    - id: product-proof
      label: Atlas is shipping with named lighthouse customers
      detail: Atlas and customer proof exist, but breadth and economics are still unclear.
      tone: positive
    - id: market-tailwind
      label: Inference market and power bottlenecks are real
      detail: Analysts describe 2026 as inference-led and constrained by power, capital, and memory.
      tone: positive
    - id: financial-gap
      label: Revenue-quality pack is missing
      detail: No public revenue, gross-margin, backlog, or burn disclosure supports the round price.
      tone: warning
    - id: roadmap-gate
      label: Asimov/Titan schedule is the main swing factor
      detail: Late-2026 tape-out and early-2027 production remain roadmap claims, not delivered facts.
      tone: warning
    - id: track-call
      label: TRACK
      detail: Public evidence supports plausibility, but not conviction underwriting at current price.
      tone: neutral
    - id: buy-upgrade
      label: Upgrade only after diligence and milestone proof
      detail: Cap table, customer expansion, benchmark validation, and manufacturing economics must clear.
      tone: positive
    edges:
    - from: funding-proof
      to: product-proof
    - from: product-proof
      to: market-tailwind
    - from: market-tailwind
      to: financial-gap
    - from: financial-gap
      to: roadmap-gate
    - from: roadmap-gate
      to: track-call
    - from: track-call
      to: buy-upgrade
  approximationNotes: >-
    This is a decision framework rather than a weighted model; it makes explicit why recommendation quality is limited by missing diligence rather than by lack of market interest.
