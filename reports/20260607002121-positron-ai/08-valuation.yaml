  - CV032
  - CV033
  - CV035
  - CV040
  - CV044
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue quality pack
    - Trailing revenue, gross margin, customer concentration, backlog, and burn
    - Without these, the current price cannot be underwritten on fundamentals.
    - Request CFO package or board deck before any investment decision.
  - - Cap table and preference stack
    - Security terms, liquidation preferences, warrants, SAFEs, and any venture debt
    - Headline EV may not translate into attractive common-equity returns.
    - Obtain latest cap-table model and counsel summary.
  - - Manufacturing economics
    - Foundry, packaging, NRE, working-capital, and inventory plan for Asimov/Titan ramp
    - Semiconductor upside can be consumed by capital intensity if scale costs are misunderstood.
    - Review supply-chain plan with operations and finance leads.
  - - Customer expansion proof
    - Paid production spend, renewal patterns, and benchmarked savings for lighthouse customers
    - Named accounts only matter if they convert into repeat commercial demand.
    - Interview top customers and request cohort view.
  - - Benchmark validation
    - Independent performance-per-watt and latency tests against current incumbent alternatives
    - Most current advantage claims are still company-authored or partner-quoted.
    - Commission third-party benchmarking or inspect buyer test data.
  - - Governance and exit rights
    - Board composition, protective provisions, ROFRs, strategic rights, and any sovereign-investor constraints
    - These terms can shape acquirer set, timing, and investor control economics.
    - Review charter, investor-rights, and term-sheet documents.
  notes: These asks are the minimum package required to move from a watch stance to an underwritten buy decision.
