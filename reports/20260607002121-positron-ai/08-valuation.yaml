  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: capital-structure
    missingEvidence: Current cap table, security stack, liquidation preferences, warrants, and any venture-debt summary.
    whyItMatters: >-
      A $1B+ enterprise value can still produce weak common-equity returns if preferences or debt absorb much of exit proceeds.
    diligencePath: >-
      Request the latest cap-table model, board-approved financing summary, and counsel memo on investor rights before any pricing decision.
    relatedQuestionRefs:
    - QV034
  - type: private-evidence-only
    severity: material
    topic: exit-readiness
    missingEvidence: Audited or board-grade revenue, margin, customer concentration, backlog, and burn disclosure.
    whyItMatters: >-
      Without operating disclosure, timing for IPO, strategic sale, or even a high-conviction late-stage round remains speculative.
    diligencePath: >-
      Request management financial pack and speak with bankers or auditors supporting the next financing or liquidity process.
    relatedQuestionRefs:
    - QV035
  - type: missing-source
    severity: material
    topic: governance-rights
    missingEvidence: >-
      Board composition, protective provisions, ROFRs, and any strategic-investor information rights or sovereign restrictions.
    whyItMatters: >-
      These terms can narrow the acquirer set, slow transactions, or alter minority-investor outcomes even if the company performs well.
    diligencePath: Review charter, investor-rights agreement, side letters, and latest board observer list with counsel.
    relatedQuestionRefs:
    - QV038
  - type: missing-source
    severity: material
    topic: secondary-mark
    missingEvidence: >-
      Secondary transactions, 409A marks, broker indications, or other non-company pricing evidence after the Series B.
    whyItMatters: >-
      The current public record validates the headline round but does not test whether the price has held in the private market afterward.
    diligencePath: Ask management and existing investors for any secondary clears, 409A updates, or tender references from 2026.
    relatedQuestionRefs:
    - QV039
  - type: missing-source
    severity: material
    topic: manufacturing-capex
    missingEvidence: >-
      Foundry commitments, packaging plan, NRE burden, working-capital needs, and unit-economics bridge for Asimov and Titan ramp.
    whyItMatters: >-
      Hardware valuation can compress rapidly if a roadmap requires materially more capital than the public round size implies.
    diligencePath: Review supply-chain plan, manufacturing budget, and sensitivity model with operations and finance leadership.
    relatedQuestionRefs:
    - QV040
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set
    missingEvidence: >-
      A fuller private-peer table with disclosed valuation marks, debt structure, and revenue scale across inference chip startups.
    whyItMatters: >-
      The current comparable table is good enough to bound plausibility, but not exhaustive enough to anchor a precision multiple.
    diligencePath: >-
      Expand the comp deck with broker notes, late-stage financing summaries, and direct investor conversations on private marks.
    relatedQuestionRefs:
    - QV004
    - QV039
    relatedTableRefs:
    - TV004
