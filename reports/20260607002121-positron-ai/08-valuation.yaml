- id: exit-readiness-and-diligence-asks
  title: 'Exit readiness and diligence asks: liquidity timing is still speculative, so kill triggers matter'
  body: >-
    Public evidence is good enough to say Positron could become exit-relevant in the 2027-2029 window, but not good enough to say it is exit-ready today. The financing base is credible, the investor roster includes strategic capital and sophisticated private-market buyers, and the broader market still supports AI-infrastructure liquidity for companies that can demonstrate scale. Yet none of the documents reviewed here disclose the information an investor would normally need before paying through a late-stage round: audited revenue, customer concentration, preference stack, debt terms, manufacturing capex, or banker-ready disclosure discipline. That is why the diligence list matters more than headline enthusiasm. If management can show a clean cap table, repeat customer expansion, defensible gross-margin structure, and an on-time Asimov program, the recommendation could move from TRACK to BUY. If those materials do not exist or reveal a much heavier capital structure than the public story
    implies, the round could prove stretched despite the technical promise. The practical holding stance is therefore watchful rather than aggressive: monitor roadmap delivery, new lighthouse customers, and any secondary or financing signal that puts real numbers behind the current mark.
