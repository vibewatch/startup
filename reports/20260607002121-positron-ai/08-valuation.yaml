- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Status
  - Valuation / disclosure signal
  - Relevance to Positron
  - Limitation
  rows:
  - - Positron AI
    - Private; Feb-2026 Series B
    - '>$1B post-money on $230M new capital'
    - Subject company; tests whether a shipping-but-undisclosed inference vendor can sustain a unicorn price.
    - Revenue, margins, preferences, and debt are not publicly disclosed.
  - - Groq
    - Private; Sep-2025 financing
    - $6.9B post-money on $750M new capital
    - Best disclosed private inference financing comp; shows market appetite for inference infrastructure.
    - Far more capitalized and scaled, with explicit developer footprint data that Positron lacks.
  - - Cerebras
    - Public; May-2026 IPO
    - IPO closed at $185 per share with about $6.38B gross proceeds
    - Shows public-market liquidity remains available for AI hardware stories in 2026.
    - Different architecture and scale; gross proceeds are not directly comparable to enterprise value.
  - - SambaNova
    - Private; Feb-2026 Series E
    - Raised >$350M strategic capital; valuation undisclosed
    - Useful private inference peer with explicit TCO and enterprise-sales messaging.
    - No disclosed valuation mark, so it is a directional rather than precise pricing comp.
  - - NVIDIA
    - Public; fiscal-2026 filer
    - $215.9B revenue and continuous SEC disclosure cadence
    - Sets the upper bound for capital access, disclosure quality, and buyer expectations in AI infrastructure.
    - Too large and diversified to use as a direct pricing multiple for Positron.
  - - AMD / Intel / Arm
    - Public; active 2026 filers
    - Regular 10-Q or 6-K cadence and live public liquidity
    - Useful for exit-readiness and disclosure standards rather than for direct multiple matching.
    - Public scale and business mix remain much broader than Positron.
