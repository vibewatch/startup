- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / evidence
  - Why it breaks the thesis
  - Action implication
  rows:
  - - Asimov schedule slips materially
    - Tape-out misses late-2026 window or production moves materially beyond early 2027
    - The current price depends on credible custom-silicon progress before the next capital decision.
    - Move to avoid unless pricing resets and capital structure remains clean.
  - - Named-customer proof does not widen
    - No new production customers or no evidence of deeper deployment from lighthouse users
    - The commercialization story stays too narrow for a unicorn hardware valuation.
    - Keep recommendation at track or downgrade if capital burn rises.
  - - Small-model trend outpaces memory-heavy demand
    - Customer workload mix shifts toward cheaper small-model deployments
    - Positron would be optimizing for a shrinking premium niche.
    - Cut scenario range toward bear case and reassess TAM assumptions.
  - - Incumbent price or bundle pressure intensifies
    - Peer pricing and incumbent bundles narrow token-economics advantage
    - Architecture novelty alone stops supporting premium gross-margin expectations.
    - Reduce valuation support score and tighten entry discipline.
  - - Data room reveals heavy preference or debt overhang
    - Material liquidation stack, warrants, or debt seniority appears in diligence
    - Headline enterprise value would overstate common-equity upside.
    - Do not lead or buy until effective entry returns are recalculated.
  notes: >-
    Kill triggers are tied to monitorable roadmap, customer, market, and capital-structure events rather than to sentiment alone.
  claimRefs:
