  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: export-controls
    missingEvidence: Company-specific ECCN classifications, denied-party screening procedures, hosted-access controls, and export-compliance ownership.
    whyItMatters: Without these materials, the chapter can describe the regulatory perimeter but cannot underwrite Positron's readiness for sophisticated or international customers.
    diligencePath: Request export-control memo, screening SOPs, restricted-jurisdiction policy, and any outside-counsel compliance review.
    relatedQuestionRefs:
    - QR004
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: ip-risk
    missingEvidence: Patent schedule, pending applications, freedom-to-operate work, and any IP licenses or disputes.
    whyItMatters: IP defensibility is central in semiconductors, but public search surfaces alone did not establish Positron's offensive or defensive position.
    diligencePath: Request counsel-prepared IP summary, assignment records, pending applications, and litigation or demand-letter history.
    relatedQuestionRefs:
    - QR005
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: channel-dependency
    missingEvidence: Parasail commercial terms, exclusivity provisions, shipment volumes, and what share of Parasail demand runs on Positron hardware.
    whyItMatters: Channel leverage can be a strength or a mirage depending on exclusivity and attribution, and public evidence cannot resolve that today.
    diligencePath: Request signed customer or partner summaries, revenue attribution by partner, and any exclusivity or minimum-volume clauses.
    relatedQuestionRefs:
    - QR014
  - type: private-evidence-only
    severity: material
    topic: capital-intensity
    missingEvidence: Runway model, burn, gross margin, backlog quality, and cash conversion from current purchase orders.
    whyItMatters: The public funding total is known, but the amount of capital still required to reach production-scale Asimov deployment is not.
    diligencePath: Request operating plan through 2027, quarterly burn, gross margin assumptions, and order and revenue cohort data.
    relatedQuestionRefs:
    - QR018
  - type: private-evidence-only
    severity: material
    topic: security-posture
    missingEvidence: SOC materials, penetration tests, incident history, buyer-facing trust documentation, and vulnerability-management workflow.
    whyItMatters: Operational security readiness affects customer qualification velocity and downside severity if the company is carrying inference workloads for sensitive buyers.
    diligencePath: Request trust package, security policy owner, third-party assessments, and incident-response materials.
    relatedQuestionRefs:
    - QR015
