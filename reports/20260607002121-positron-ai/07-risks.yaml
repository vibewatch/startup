- id: TR001
  title: Regulatory / legal risk register
  enumerationScope:
    coverage: partial
    basis: Coverage is limited to publicly reviewable U.S. advanced-computing export-control materials, legal analyses, and public IP-search surfaces reviewed through 2026-06-07. It excludes private classification memos, customer contracts, internal screening controls, and any non-public patent filings or opinions.
  columns:
  - Rule / issue
  - Jurisdiction
  - Status
  - Likelihood
  - Severity
  - Mitigation
  - Residual exposure
  - Diligence path
  rows:
  - - Advanced-computing export controls and shifting AI-diffusion policy
    - U.S. / cross-border
    - Rules changed in 2025 and legal guidance still evolving in 2026
    - Medium-High
    - High
    - Current Atlas focus appears domestic and air-cooled; no public sign of prohibited-market strategy
    - International deployment or financing diligence can slow without clear classification and screening evidence
    - Obtain ECCN analysis, denied-party process, customer geography mix, and export-control counsel memo
  - - Foundry / packaging due-diligence burdens for custom silicon
    - U.S. with non-U.S. fabrication touchpoints
    - Sidley says Jan. 2025 measures expanded obligations for foundries and packaging companies
    - Medium
    - High
    - Domestic framing and selected ecosystem partners may help, but public process is undisclosed
    - Asimov supply chain could face added certifications, screening, or shipment friction at exactly the scale-up moment
    - Request named foundry / OSAT chain, party screening controls, and supplier compliance reps
  - - Remote-access / IaaS restrictions tied to advanced compute
    - U.S. export-control perimeter
    - MoFo says Jan. 2026 conditions extend to remote-access/IaaS scenarios for restricted jurisdictions
    - Medium
    - Medium-High
    - No public evidence Positron is offering open remote compute internationally today
    - If Positron broadens from hardware sales into managed access or hosted evaluation, compliance scope widens materially
    - Confirm hosted-eval architecture, geofencing, audit logging, and restricted-jurisdiction policy
  - - Patent visibility and IP defensibility gap
    - U.S. / global
    - Public search surfaces reviewed here did not yield a clearly reviewable Positron-specific corpus
    - Medium
    - Medium
    - None visible publicly beyond general startup secrecy and execution speed
    - Freedom-to-operate, licensing exposure, and defensive moat remain under-evidenced for diligence
    - Request patent schedule, pending applications, outside counsel FTO work, and any licenses or disputes
