- id: people-execution-thesis-breaks
  title: The investable question is whether the team can scale process, leadership, and shipment cadence before larger rivals lock in the market
  body: People and execution risk are unusually important because Positron's public narrative is built around speed. The company emphasizes that Atlas was brought to market quickly with a small team, that it recruited a new CEO in month 21, and that competing with Nvidia requires matching shipping frequency. That is an impressive origin story, but it also creates a demanding operating tempo. Jon Peddie reports headcount around 50 with a plan to reach roughly 100 by end-2026, which means the company is trying to double its team while also moving from deployed FPGA systems to a new ASIC program and a more formalized customer and compliance posture. Public materials clearly name the core technical and commercial leaders, but they do not yet show a broad public bench for manufacturing operations, export compliance, enterprise security, or finance. The practical mitigation is not to assume failure; it is to turn the thesis into monitorable thresholds. If tape-out slips, if Cloudflare-style evaluations
    stop converting, if customer proof remains stuck at three named accounts, if capital must be raised before Asimov reaches production, or if senior operating hires fail to materialize, the residual risk should be marked up quickly. This is a chapter where diligence asks and thesis-break triggers matter as much as current momentum.
