  - id: TP004
    title: Moat durability and competitive risk register
    columns:
      - Moat Claim
      - Threat
      - Severity
      - Evidence / Adverse Signal
      - Diligence Ask
    rows:
      - - Memory-bandwidth efficiency (Atlas 93% utilization vs 10-30% GPU)
        - Cerebras WSE-3 and SambaNova SN50 both emphasize memory efficiency; Groq LPU uses SRAM as primary weight storage
        - High
        - SambaNova cites 5× speed advantage vs competitive chips; Cerebras claims 15× GPU speedup; claims uncorroborated by independent benchmarks
        - Request independent third-party benchmark of Atlas vs GroqCloud/SambaCloud on matching workload
      - - Air-cooled operation at scale
        - Groq GroqRack and SambaNova SN50 also claim air-cooled operation
        - Medium
        - Multiple competitors share this claim; not a durable differentiator at the platform level
        - Verify TDP and cooling specs for Asimov chip vs competitive SN50 specs
      - - US-manufactured supply chain
        - Groq also markets American AI Stack positioning; SambaNova's Intel partnership may strengthen US manufacturing claim
        - Medium
        - Export control tailwinds (BIS EAR) favor US-manufactured chips but do not create exclusivity
        - Confirm Atlas/Asimov assembly is US-based and meets DoD/IC procurement requirements
      - - OpenAI-API compatibility with no code changes
        - All major inference providers offer OpenAI-compatible endpoints; this is table stakes
        - High
        - Groq, Cerebras, SambaNova, and SambaCloud all market OpenAI-compatible APIs
        - Confirm Positron's compatibility depth (streaming, function calling, multimodal) relative to peers
      - - Asimov ASIC custom silicon roadmap
        - Competitors already shipping ASIC products (Groq LPU, Cerebras WSE-3, SambaNova RDU); Positron still in FPGA phase
        - High
        - Positron is shipping first-generation FPGA while peers are on second/third-generation custom ASIC; funding gap ($305 M vs $6.9 B / $6.38 B IPO) limits Asimov R&D runway
        - Confirm Asimov tape-out timeline, TSMC/foundry commitment, and capital budget for 2027 launch
      - - "Distribution: financial-trading anchor (Jump Trading Series B co-lead)"
        - Jump Trading is a single customer/investor; limited evidence of broader vertical expansion
        - Medium
        - Cloudflare trials conditional; Parasail the only other named customer; broader customer base undisclosed
        - Identify whether 2026 customer additions include non-financial, non-CDN verticals
    notes: >-
      Severity assessments are author's judgments based on available public evidence; not
      corroborated by independent analyst benchmarks. Threats are current as of the June 2026 research
      date and may intensify if Groq or Cerebras reduce pricing or expand hardware-as-a-service offerings.
