  - id: challenger-peers-substitute-approaches
    title: "Challenger peers: SambaNova, Tenstorrent, and d-Matrix"
    body: >
      SambaNova Systems is the most active product-launching peer in the 2025-2026 window. Founded in 2017,
      San Jose, California, the company builds the RDU (Reconfigurable Dataflow Unit), a custom ASIC using a
      Dataflow architecture that creates an assembly-line pipeline of AI operations to minimize memory-intensive
      kernel calls. The fifth-generation SN50 chip, unveiled February 24, 2026, claims 5× higher compute per
      accelerator and 4× more network bandwidth than the prior generation; SambaNova cites SemiAnalysis benchmarks
      showing 895 tokens/s for Llama-3.3 70B versus 184 tokens/s for Nvidia B200. The company raised $350 M+ in
      an oversubscribed Series E (February 2026) led by Vista Equity Partners and Cambium Capital, with Intel
      Capital and T. Rowe Price participating; a multi-year collaboration with Intel enables co-selling through
      Intel's global channels. SoftBank is the first SN50 customer for Japan AI data center deployments. IDC
      analyst Peter Rutten described the SN50 as "changing the tokenomics of AI inference at scale." SambaNova
      markets a 3× lower TCO versus GPUs for agentic AI workloads, with multi-model resident memory enabling
      fast model switching. SambaCloud offers DeepSeek, Llama, and other models via an OpenAI-compatible API
      at competitive token prices. SambaNova's Intel partnership significantly expands its distribution access
      and manufacturing capacity relative to Positron.

      Tenstorrent is a Canadian AI accelerator company (headquartered in Austin, Texas) led by Jim Keller,
      a legendary chip architect. Its products use RISC-V-based processing cores (Wormhole and Grayskull chips)
      with the Galaxy system targeting large-scale AI inference. Tenstorrent has a developer-first GTM with
      open-source software via the TT-Metalium SDK, an active patent portfolio, and an industry-leading
      performance claim as of mid-2026. The company has attracted developer community investment via RISC-V
      open standards differentiation, though its public customer and revenue disclosures are limited.
      Tenstorrent has secured noteworthy strategic funding but total raise figures are not publicly confirmed at
      the same level of detail as Groq, Cerebras, or SambaNova.

      d-Matrix is a Santa Clara-based inference chip startup that uses a radically different memory approach:
      3DIMC (3D stacked Digital In-Memory Compute), which places compute directly inside stacked SRAM to
      eliminate data movement bottlenecks. The Corsair platform targets models up to 100 B parameters in a
      PCIe form factor compatible with existing data center configurations, enabling drop-in deployment without
      rack reconfiguration. d-Matrix has shipped over 100 million chips in aggregate (team background claim)
      and targets enterprise workloads with ultra-low latency and high batched throughput. Its PCIe form factor
      is a meaningful differentiator versus Positron's full-rack Atlas: it lowers the deployment friction bar
      but caps the per-deployment footprint and model size. Funding and customer details are not publicly
      disclosed in depth.
