  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: independent-benchmarks
      missingEvidence: >-
        Independent third-party head-to-head benchmark comparing Atlas inference throughput,
        latency, and energy to GroqCloud, Cerebras Inference, and SambaNova SN50 on identical
        transformer models and batch sizes.
      whyItMatters: >-
        All performance claims from Positron and competitors are vendor-authored; without
        independent corroboration, the 3.5× vs H100 claim and the comparative positioning
        against Groq/Cerebras cannot be validated. This is a critical diligence gap for
        any capital deployment decision.
      diligencePath: >-
        Commission benchmark from MLCommons, Artificial Analysis, or SemiAnalysis on a matched
        workload (Llama-3.1-70B, 1K input/1K output, batch 1 and batch 32) across Atlas,
        GroqCloud, Cerebras Inference, and SambaNova SambaCloud.
      relatedQuestionRefs:
        - QP027

    - type: private-evidence-only
      severity: material
      topic: tenstorrent-availability
      missingEvidence: >-
        Confirmed generally available product status, shipping date, and customer references for
        Tenstorrent Galaxy as of Q2 2026; the public website lists the product but does not
        provide GA date or named customer evidence.
      whyItMatters: >-
        Tenstorrent is a credible competitor (Jim Keller architecture, RISC-V ecosystem) but
        inability to confirm GA shipping status limits competitive risk assessment.
      diligencePath: >-
        Direct inquiry to Tenstorrent channel partner or check Tenstorrent community forums and
        TT-Metalium GitHub for customer/deployment evidence.
      relatedQuestionRefs:
        - QP016

    - type: private-evidence-only
      severity: material
      topic: positron-atlas-pricing
      missingEvidence: >-
        Positron Atlas hardware list price, financing/leasing terms, and effective cost-per-token
        at expected utilization rates — enabling an apples-to-apples comparison with GroqCloud
        and Cerebras Inference token pricing.
      whyItMatters: >-
        Without knowing Atlas list price and utilization assumptions, it is impossible to verify
        the "3.5× better performance per dollar vs H100" claim in a production context, or to
        assess whether cloud-API alternatives are economically superior at smaller scale.
      diligencePath: >-
        Request Atlas system price, memory/compute spec sheet, and customer reference workload
        cost model from Positron sales team; cross-reference with Jump Trading deployment economics.
      relatedQuestionRefs:
        - QP007

    - type: missing-source
      severity: material
      topic: d-matrix-funding-customers
      missingEvidence: >-
        D-Matrix total funding raised, lead investors, and named enterprise customers with deployed
        Corsair production workloads.
      whyItMatters: >-
        D-Matrix is a direct on-premise inference peer competing on SRAM-based memory compute;
        without knowing its capitalization and customer traction, the competitive severity
        assessment is incomplete.
      diligencePath: >-
        Check Crunchbase, LinkedIn hiring, and d-matrix.ai press releases for investor and
        customer disclosure; request via d-Matrix enterprise sales inquiry.

    - type: missing-source
      severity: minor
      topic: groq-on-premise-roadmap
      missingEvidence: >-
        Any Groq roadmap or announced intent to offer on-premise LPU hardware products for
        enterprise deployment, which would directly threaten Positron's differentiation.
      whyItMatters: >-
        Groq currently monetizes via GroqCloud API only; if Groq introduces on-premise hardware,
        Positron's primary differentiation (privacy/latency for on-premise buyers) would face
        a new threat from a significantly better-capitalized competitor.
      diligencePath: >-
        Monitor Groq investor materials, conference presentations, and enterprise product pages
        for any on-premise hardware product signals.

    - type: missing-source
      severity: material
      topic: lpu-vs-wse3-benchmarks
      missingEvidence: >-
        Independent head-to-head benchmark comparing Groq LPU throughput to Cerebras WSE-3
        on identical inference workloads (same model, same batch sizes, same context length).
      whyItMatters: >-
        Both Groq and Cerebras claim top inference speed, but their architectures (SRAM-based
        single-core LPU vs wafer-scale on-chip memory) serve different model sizes and batch
        profiles; Positron's competitive positioning relative to each depends on the workload type.
      diligencePath: >-
        Commission or obtain Artificial Analysis or MLCommons benchmarks comparing LPU vs WSE-3
        on Llama-3.1-70B and Llama-3.1-8B with matched batch configurations.
      relatedQuestionRefs:
        - QP006

    - type: enumeration-incomplete
      severity: minor
      topic: competitor-customer-counts
      missingEvidence: >-
        Full named customer lists for Tenstorrent, d-Matrix, and SambaNova beyond SoftBank Japan,
        plus verification of Groq's "Fortune 500" customer claim with specific names.
      whyItMatters: >-
        Customer count and vertical mix are key indicators of which competitors are gaining traction
        in Positron's target segments (finance, CDN, enterprise); without this data the competitive
        threat from SambaNova and Tenstorrent in Positron's core verticals is unquantified.
      diligencePath: >-
        Search competitor case study pages, LinkedIn job postings for "SambaNova" or "Tenstorrent"
