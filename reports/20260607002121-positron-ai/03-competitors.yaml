callouts:
  - calloutType: risk
    title: Capital gap creates ASIC execution risk
    body: >-
      Positron's Asimov custom ASIC targets 2027 production, but at $305 million total raised it faces
      a capital disadvantage versus Groq ($6.9 B valuation), Cerebras ($6.38 B IPO), and SambaNova
      ($350 M+ Series E). Shipping a competitive custom inference chip typically requires $200–500 M
      in chip design, tape-out, and ramp costs. If Asimov slips or underperforms, Positron's FPGA
      Atlas faces commoditization from better-capitalized ASIC peers with growing distribution channels.
    claimRefs:
      - CP038
      - CP042
      - CP043

  - calloutType: insight
    title: Cloud-API gap is a structural market-scope constraint
    body: >-
      Every primary peer—Groq, Cerebras, SambaNova—offers both on-premise hardware and cloud inference
      APIs. Positron offers only on-premise hardware. This means Positron cannot address the developer
      and SME segment that drives API usage volume, limiting near-term TAM to enterprise buyers with
      specific on-premise requirements and creating a recurring revenue gap versus subscription and
      usage-based competitors.
    claimRefs:
      - CP033
      - CP034
      - CP038
      - CP040

  - calloutType: strength
    title: On-premise memory-first differentiation is durable for regulated verticals
    body: >-
      Financial-trading (Jump Trading) and CDN/security (Cloudflare) use cases require on-premise
      deployment for latency, data-residency, or compliance reasons that cloud APIs cannot satisfy.
      Positron's model-loading simplicity (HuggingFace drag-and-drop, OpenAI-compatible endpoint)
      and memory-bandwidth efficiency create defensible value in these segments. Groq and Cerebras
      have not announced competing on-premise hardware products at Atlas's price/form-factor tier.
    claimRefs:
      - CP035
      - CP039
      - CP040

