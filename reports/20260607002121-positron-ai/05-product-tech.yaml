  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Positron solution
      - Measurable benefit
      - Limitation
    rows:
      - - Deploy existing Hugging Face model with minimal rewrite
        - Model owner must choose infrastructure, convert weights, and adapt serving interfaces
        - Upload or link model to Positron Model Manager, then call OpenAI-compatible endpoint
        - Lower migration friction if compatibility claims hold
        - Public docs do not show the full onboarding, auth, or rollback path
      - - Run inference in power-constrained distributed infrastructure
        - Buyer compares GPU racks, cooling limits, and power budgets
        - Atlas pitches 2kW-class air-cooled deployment with lower power than H100/H200 reference systems
        - Potentially easier fit in existing facilities
        - Public evidence is company-led except for Jump Trading latency commentary
      - - Serve latency-sensitive workloads such as trading or always-on token services
        - Teams optimize for TTFT, latency variance, and cost per served token
        - Jump Trading and Parasail examples suggest Atlas is aimed at these workloads
        - 3x lower latency claim from Jump Trading and low-cost always-on service framing from Parasail
        - No broad customer benchmark set or SLA/availability history disclosed
      - - Prepare for long-context or multi-model-resident inference
        - GPU paths often require sharding, storage offload, or cooling/network upgrades
        - Asimov and Titan roadmap centers on large resident memory and long-context serving
        - Roadmap claims point to fewer memory bottlenecks and more models resident per system
        - Pre-shipment roadmap; no public qualification data yet
      - - Benchmark and capacity-plan OpenAI-style inference endpoints
        - Teams often lack realistic load-generation and compatibility test harnesses
        - Public repos expose AIPerf, GuideLLM, and hf-litmus-style tooling around endpoint and model testing
        - Signals practical performance-engineering orientation beyond marketing slides
        - Repos do not prove the same tooling powers commercial deployments end to end
    notes: >-
      Benefits reflect public claims or named third-party commentary only. Limitations capture where the
      public workflow remains under-documented.
