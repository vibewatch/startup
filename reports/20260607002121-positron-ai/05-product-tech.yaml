chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Positron sells a compatibility-first inference stack anchored by the shipping Atlas server,
    OpenAI-compatible serving endpoints, and a roadmap from FPGA-based systems to the Asimov/Titan
    memory-first ASIC platform. The strongest public product evidence is around memory capacity,
    air-cooled deployment, and ecosystem compatibility; the weakest is around control-plane maturity,
    security/compliance documentation, and independently replicated reliability or benchmark data.
sections:
  - id: sec-product-workflow
    title: Product definition in customer workflow terms
    body: >-
      Positron’s public product surface is more than a chip pitch: the homepage describes a workflow
      in which a customer starts with a Hugging Face Transformers model or trained checkpoint,
      uploads or links weights into a Positron Model Manager, and then repoints applications to an
      OpenAI-compatible endpoint. Atlas is the shipping product in that workflow today, with the
      support site reinforcing API-led access and the Atlas page adding concrete system specifications,
      bundled support, and a production-serving footprint. In customer terms, Positron is trying to
      remove the software migration tax that usually blocks accelerator adoption: buyers keep model
      assets, keep OpenAI-style client semantics, and swap the serving substrate underneath. The named
      public workflows fit power-constrained, latency-sensitive environments such as Cloudflare-style
      distributed AI services, Parasail’s token-serving stack, and Jump Trading’s latency-sensitive
      inference use case. The gap is that public materials describe the happy path more clearly than the
      operating path: model lifecycle controls, authentication design, tenant isolation, and deployment
      runbooks are not documented with the same specificity as the hardware and compatibility narrative.
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE005
      - CE006
