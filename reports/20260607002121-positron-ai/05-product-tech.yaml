  - id: sec-trust-quality-roadmap
    title: Trust, reliability, support, and roadmap risk
    body: >-
      Trust and quality evidence is where the public record thins out. Positron does publish a support
      surface and a headline OpenAI-compatible API message, and Atlas lists a 24-hour SLA from a
      Washington/US-based team. But the fetched support and GitHub materials do not show public
      documentation for administrative APIs, role models, audit logging, key rotation, tenant controls,
      uptime commitments beyond the support statement, incident history, return rates, or formal
      security and compliance certifications. Public benchmark evidence is also narrow. Atlas publishes a
      concrete head-to-head scenario, and Jump Trading provides an important third-party latency
      datapoint, but methodology breadth remains limited and the Atlas benchmark explicitly excludes
      speculation and paged attention. Meanwhile the roadmap is time-bound and therefore real diligence
      risk: late-2026 tape-out and early-2027 production for Asimov/Titan are official targets, not
      achieved milestones. The product chapter therefore supports a positive view on technical direction
      and deployment relevance, but only a medium-confidence view on operating maturity because trust,
      quality, and control-plane artifacts remain mostly private or unpublished.
    claimRefs:
      - CE005
      - CE010
      - CE024
      - CE025
      - CE038
      - CE040
      - CE041
      - CE042
      - CE045
    tableRefs:
      - TE004
