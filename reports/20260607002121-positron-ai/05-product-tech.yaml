  evidenceGaps:
    - type: missing-source
      severity: material
      topic: security and compliance documentation
      missingEvidence: >-
        Public enterprise trust materials such as SOC 2 / ISO 27001 status, privacy commitments,
        incident-response process, and security architecture overviews.
      whyItMatters: >-
        Enterprise hardware + API buyers need procurement-grade trust evidence before adopting a new
        serving platform, especially one positioned for cloud and regulated workloads.
      diligencePath: >-
        Request security packet, compliance certifications, DPA/privacy language, and any public or
        private incident-history reporting used in enterprise diligence.
      relatedQuestionRefs: [QE014, QE022, QE025]
      relatedTableRefs: [TE004]
    - type: private-evidence-only
      severity: material
      topic: admin and control-plane maturity
      missingEvidence: >-
        Documentation for authentication, RBAC, key rotation, audit logs, quotas, multi-tenant
        isolation, model lifecycle management, and rollback procedures.
      whyItMatters: >-
        Positron’s public workflow implies a hosted or managed serving plane, but the control mechanisms
        needed for production governance are not externally visible.
      diligencePath: >-
        Ask product and infra leads for admin API docs, control-plane architecture diagrams, SOC
        controls mapped to the service, and a live demo of tenant management.
      relatedQuestionRefs: [QE014, QE023]
      relatedTableRefs: [TE003, TE004]
    - type: missing-source
      severity: material
      topic: benchmark and reliability methodology
      missingEvidence: >-
        Independent or customer-reproducible benchmark protocol, uptime history, hardware failure
        statistics, and service-level reporting beyond the headline SLA.
      whyItMatters: >-
        The value proposition depends on better economics and practical operations; without methodology
        and reliability disclosure, buyers cannot verify expected production outcomes.
      diligencePath: >-
        Request benchmark harnesses, normalized workload definitions, customer references willing to
        discuss operations, and any field-return / burn-in / failure-rate data.
      relatedQuestionRefs: [QE020, QE023, QE025]
      relatedTableRefs: [TE004]
    - type: stale
      severity: material
      topic: Asimov and Titan roadmap milestones
      missingEvidence: >-
        Fresh tape-out, bring-up, qualification, and customer-pilot updates after the official late-2026
        / early-2027 targets.
      whyItMatters: >-
        The chapter’s bullish case depends on the roadmap extending Atlas into a more defensible
        custom-silicon platform; slippage would change competitive and financial conclusions.
      diligencePath: >-
        Re-check roadmap status once late-2026 milestones land, ask for foundry/packaging readiness and
        qualification schedule, and confirm any beta customer commitments.
      relatedQuestionRefs: [QE021, QE025]
      relatedTableRefs: [TE005]
    - type: missing-source
      severity: material
      topic: manufacturing quality and supply resilience
      missingEvidence: >-
        Yield expectations, lead times, domestic-vs-offshore split for Atlas and Asimov, burn-in / QA
        processes, and any warranty or return-rate data.
      whyItMatters: >-
        The company’s differentiation partly relies on supply certainty and quality control, but public
        materials do not show whether those advantages are measurable and durable.
      diligencePath: >-
        Request manufacturing partner map, QA process documents, field-failure metrics, and management
        commentary on foundry transition risk for Asimov.
      relatedQuestionRefs: [QE015, QE025]
      relatedTableRefs: [TE004, TE005]
