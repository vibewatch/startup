callouts:
  - calloutType: strength
    title: Compatibility-first product design is the clearest adoption wedge
    body: >-
      The strongest product claim is not raw benchmark supremacy; it is that buyers can keep familiar
      model assets and OpenAI-style application interfaces while moving inference onto a cheaper,
      lower-power substrate. That is a practical adoption wedge for enterprises that will not rewrite
      applications just to trial new silicon.
    claimRefs:
      - CE001
      - CE006
      - CE007
      - CE023
  - calloutType: insight
    title: Developer signal is strongest around validation tooling, not the core runtime
    body: >-
      The public GitHub surface points to serious attention on benchmarking, compatibility testing, and
      open-source model ecosystems. That is useful because it suggests Positron understands real
      deployment friction, but it also means the public record says more about the company’s validation
      tooling than about the internals of its commercial control plane.
    claimRefs:
      - CE026
      - CE027
      - CE028
      - CE029
      - CE030
      - CE031
  - calloutType: risk
    title: Trust and reliability evidence lags the ambition of the roadmap
    body: >-
      Positron publishes support language and some API-level compatibility, but the public surface is
      still thin on certifications, admin controls, benchmark breadth, and reliability metrics. Asimov
      and Titan may be compelling if delivered, yet the diligence burden remains heavy until these trust
      and operations artifacts are disclosed.
    claimRefs:
      - CE024
      - CE025
      - CE038
      - CE040
      - CE041
      - CE042
