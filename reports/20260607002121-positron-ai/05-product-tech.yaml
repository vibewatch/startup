  - id: sec-architecture
    title: Architecture and software stack
    body: >-
      Positron’s architecture thesis is explicit: transformer inference is memory-bound and
      power-constrained, so the winning design should optimize realized memory bandwidth, memory
      capacity, and deployment economics rather than headline FLOPS. Atlas expresses that thesis in a
      shipping server with Positron’s inference engine, while Asimov extends it into custom silicon with
      LPDDR5x, a dual-hemisphere design, on-chip ARMv9 control cores, a reconfigurable systolic array,
      dedicated vector-function hardware, PCIe Gen6 plus CXL, and high-bandwidth chip-to-chip
      interconnect. Titan then packages four Asimov chips into a system positioned for multi-trillion-
      parameter and long-context workloads. Public developer signal suggests the software posture around
      this hardware is compatibility-oriented rather than ecosystem-replacement oriented: the GitHub
      organization is rich in benchmark, model-compatibility, and open-source fork activity, while
      hf-litmus explicitly references a Tron compilation pipeline for Hugging Face models. That said, the
      exact boundary between “no complex compiler stack” and whatever Tron does is not publicly
      reconciled. Positron has credible evidence of a model-ingestion and benchmarking layer, but not a
      fully documented public runtime/control-plane architecture.
    claimRefs:
