      diligencePath: Request board or operating-review materials with quarterly funnel metrics, CAC/payback by channel, and close-rate by cohort.
      relatedQuestionRefs: [QI003]
    - type: missing-source
      severity: material
      topic: pricing-realization
      missingEvidence: Model-level list pricing, realized ASPs, discount policy, distributor margin, and service or warranty attach by product family.
      whyItMatters: Public revenue and margin growth do not reveal whether gains came from mix, pricing power, discounting, or one-off customer programs.
      diligencePath: Obtain current price books, recent invoices or quotes, and channel agreements for industrial, collaborative, and embodied robots.
