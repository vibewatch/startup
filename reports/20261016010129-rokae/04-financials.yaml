company:
  name: ROKAE
chapter:
  number: 4
  title: Financials
  summary: >-
    ROKAE's latest public disclosures show a sharp H1 2026 step-up in revenue and gross
    margin, with product revenue overwhelmingly replacing lower-quality solutions mix and
    adjusted profit turning positive. The underwriting problem is not whether demand exists,
    but whether post-IPO capital can convert that growth into durable profitability without
    public evidence on realized pricing, sales efficiency, backlog, or working-capital cadence.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and public traction
    body: >-
      The clearest reader-facing financial improvement is mix: ROKAE reported H1 2026
      revenue of RMB414.7 million, with sales of robotic products contributing RMB394.0
      million, or 95.0% of the total, while project-style robotic solutions fell to RMB9.0
      million after management said it became more selective on new projects. Within product
      revenue, embodied intelligent robots already contributed RMB139.1 million, or 33.5%
      of total revenue, which matters because the strongest margin path appears to come from
      scaling standardized robot products rather than bespoke solutions work. Public traction
      is real but incomplete: official sources cite more than 1,000 customers, more than 40
      countries, and 50,000 robots of annual production capacity, yet they do not expose the
      realized ASP, repeat-purchase cadence, or backlog coverage needed to judge how sticky
      that activity is.
    claimRefs: [CI001, CI002, CI008]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: margins-and-unit-economics
    title: Margin path and unit-economics visibility
    body: >-
      The H1 2026 filing and the later earnings summary both point to real gross-margin
      improvement: gross profit rose to RMB123.4 million, reported gross margin reached
      29.8%, and product gross margin before inventory write-downs reached 31.1% as higher
      unit volumes reduced unit costs and improved supplier bargaining power. That is a
      meaningful signal that the company is moving away from lower-margin solution delivery
      toward more repeatable product economics. The caution is that almost every underwriting
      variable below gross margin remains opaque in public: retained sources do not disclose
      realized robot pricing, discounting, CAC, payback, funnel conversion, sales-cycle
      length, churn, or backlog, so the public record is good enough to show improving
      economics but not good enough to model mature sales efficiency.
    claimRefs: [CI003, CI009, CI012]
    tableRefs: [TI002, TI003]
  - id: liquidity-and-capital-needs
    title: Liquidity, balance sheet, and financing dependency
    body: >-
      ROKAE's capital position improved materially after the reporting period, but the timing
      matters. As of June 30, 2026, the company reported RMB115.9 million of cash and cash
      equivalents, RMB138.9 million of term deposits, and RMB132.9 million of financial
      assets at fair value through profit or loss, while shareholders' deficit still stood at
      RMB1,221.7 million and borrowings were RMB50.6 million. The July-August 2026 Hong Kong
      IPO and greenshoe then added approximately HK$937.1 million of net proceeds earmarked
      through FY2029 for R&D, overseas sales build-out, production capacity, strategic
      investment, and working capital. That means near-term liquidity pressure is meaningfully
      lower than the June balance sheet alone suggests, but capital adequacy still depends on
      management converting fresh equity into sustained margin expansion rather than simply
      funding a longer loss runway.
    claimRefs: [CI004, CI005, CI006, CI007, CI011]
  - id: verdict-and-diligence-blockers
    title: Financial verdict and diligence blockers
    body: >-
      The financial verdict is directionally positive but not yet underwriteable on public
      evidence alone. Revenue quality improved because product sales dominated H1 2026 mix,
      gross margin expanded, and operating cash flow turned positive, while post-period IPO
      proceeds reduce immediate financing risk. Even so, independent reporting still frames
      ROKAE as loss-making, internationally underpenetrated, and reliant on continued R&D
      spending to defend share in a still-small collaborative-robot niche. Before treating the
      recent step-up as a durable margin inflection, diligence should request model-level ASPs,
      discounting, backlog, exact cash-flow bridge, customer-concentration updates, and
      channel/sales-efficiency data that are absent from the retained public corpus.
    claimRefs: [CI010, CI012, CI013]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - H1 2026 public status
      - Revenue quality
      - Diligence ask
    rows:
      - [Industrial robots, Hardware sales of industrial robot arms, RMB revenue, "RMB150.0m; 36.2% of total revenue", Standardized product revenue with scale tailwind, "Backlog by model, realized ASP, and warranty/service attach by channel"]
      - [Flexible collaborative robots, Hardware sales of cobots, RMB revenue, "RMB104.9m; 25.3% of total revenue", Standardized product revenue with improving bargaining power, "Channel mix, realized pricing, and repeat-order cadence"]
      - [Embodied intelligent robots, Hardware sales of embodied robot arms/platforms, RMB revenue, "RMB139.1m; 33.5% of total revenue", Fast-growing but early-category revenue stream, "Pilot versus production orders, customer concentration, and service burden"]
      - [Robotic solutions plus other services, Project solutions plus spare parts and technical services, RMB revenue, "Solutions RMB9.0m (2.2%); others RMB11.7m (2.8%)", More variable revenue and lower margin than product mix, "Contract margin by project, milestone billing terms, and services attach rate"]
    notes: >-
      Official H1 2026 disclosures provide revenue by stream and mix, but not recurring
      revenue, backlog coverage, or realized pricing by product family.
    claimRefs: [CI001, CI002]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Line
      - Public price / unit disclosure
      - Revenue recognition cue
      - What is public now
      - List vs realized pricing read-through
      - Source-backed diligence gap
    rows:
      - [Industrial robots, No retained product price list, Sale of robotic products, "Category revenue disclosed in interim results; industrial robot catalogue visible on official site", Public sources do not show realized ASPs or discounts, "Provide model-level list pricing, discount policy, and distributor margin"]
      - [Flexible collaborative robots, No retained product price list, Sale of robotic products, "xMate family is publicly marketed but retained sources do not show contract economics", Catalogue presence is not a proxy for realized pricing, "Provide realized ASPs, service attach, and reseller economics"]
      - [Embodied intelligent robots, No retained product price list, Sale of robotic products, "AR/Human.X/HSA portfolio is public and H1 2026 revenue is disclosed", Revenue is visible but unit pricing and contract duration are not, "Provide order count, pilot-to-production conversion, and price by configuration"]
      - [Robotic solutions and technical services, No retained contract pricing, Provision of robotic solutions and ancillary services, "Solutions revenue and other services revenue are disclosed at category level only", Project pricing and milestone timing remain opaque, "Provide contract template, billing milestones, and gross margin by project type"]
    notes: >-
      Retained sources support revenue mechanisms and category disclosure, but product- or
      contract-level realized pricing is unavailable in the public evidence set.
    claimRefs: [CI002, CI008, CI012]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Gross margin, "29.8% reported gross margin in H1 2026; 31.2% before inventory write-downs", High, Direct evidence for margin-path improvement, "Break out gross margin by product line and after-sales burden"]
      - [Operating cash flow, "Turned positive in H1 2026; retained summary text does not expose the amount", Medium, Indicates whether growth is absorbing or releasing working capital, "Provide exact operating cash flow and bridge to EBITDA and working capital"]
      - [Cash and liquid financial assets, "RMB115.9m cash; RMB138.9m term deposits; RMB132.9m FVTPL assets at 2026-06-30", High, Defines pre-IPO liquidity buffer before fresh equity capital, "Separate restricted versus unrestricted balances and monthly cash burn"]
      - [Borrowings and advance billings, "RMB50.648m borrowings; RMB29.955m contract liabilities", High, Shows leverage and the extent of customer prepayment support, "Provide debt covenants, interest rates, and aging of advance billings"]
      - ["CAC / payback / sales cycle", null, Low, Core underwriting input for scale efficiency, "Provide funnel conversion, customer acquisition cost, payback, and enterprise sales-cycle length"]
      - ["Backlog / retention / customer concentration", "Top-five customers fell to 18.0% of 2024 revenue; backlog and churn not public", Medium, Needed to judge forward coverage and repeatability, "Provide backlog, repeat-order rate, churn, and updated concentration by customer cohort"]
    notes: >-
      Null values indicate metrics not disclosed in retained public sources rather than zero
      economics; where possible, proxies are preserved separately from missing core inputs.
    claimRefs: [CI003, CI005, CI006, CI009, CI012]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      The latest public bridge runs from sharply higher robot shipments to product-heavy revenue,
      wider gross margin, an adjusted profit, and a still-active need for post-IPO capital.
    data:
      nodes:
        - label: Robot unit shipments
          value: "13,000+ units in H1 2026"
          note: "up from 4,000+ units in H1 2025"
        - label: Product revenue
          value: RMB394.0m
          note: "95.0% of H1 2026 revenue across industrial, flexible collaborative, and embodied robots"
        - label: Solutions plus services
          value: RMB20.6m
          note: "RMB9.0m robotic solutions plus RMB11.7m spare parts and technical services"
        - label: Gross profit
          value: RMB123.4m
          note: "29.8% gross margin; 31.2% before inventory write-downs"
        - label: Adjusted net profit
          value: RMB18.4m
          note: "non-HKFRS metric excluding listing expenses, share-based payment, and redemption-liability interest"
        - label: Statutory loss and capital buffer
          value: "RMB79.0m loss; HK$937.1m post-period net IPO proceeds"
          note: "new capital allocated to R&D, overseas sales, production capacity, strategic investment, and working capital through FY2029"
    approximationNotes: >-
      The bridge preserves source values and sequence only; it does not imply hidden conversion
      rates between nodes or common time bases beyond the cited disclosures.
    claimRefs: [CI001, CI003, CI004, CI007, CI013]
callouts:
  - calloutType: insight
    title: Revenue quality improved faster than profitability
    body: >-
      The biggest H1 2026 change is mix: standardized robot product revenue reached 95% of
      total revenue and drove gross-margin expansion, but statutory profitability has not yet
      caught up with the adjusted-profit presentation.
    claimRefs: [CI001, CI003, CI004]
  - calloutType: risk
    title: IPO cash lowers runway pressure but not diligence risk
    body: >-
      Fresh equity materially improves liquidity, yet public disclosures still do not support a
      full model of CAC, pricing realization, backlog, or customer retention, so capital
      adequacy is easier to believe than revenue durability.
    claimRefs: [CI005, CI007, CI012]
