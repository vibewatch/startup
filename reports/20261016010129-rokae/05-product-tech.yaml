    columns:
      - User job
      - Current workflow
      - ROKAE solution
      - Measurable benefit claimed
      - Limitation
    rows:
      - [High-precision assembly, Manual or rigid automation that struggles with variation, xMate collaborative robots with force sensing and vision, "Closed-loop interaction and precision assembly without added extension hardware", "No retained independent throughput, defect-rate, or ROI benchmark"]
      - [Human-safe close-proximity work, Manual hand-guiding or guarded robotic cells, Flexible collaborative robots with torque-sensor collision detection and safety controller, "Safer compliant interaction plus direct teaching and easier deployment", "Safety standards are cited, but model-by-model deployment constraints are not public"]
      - [Welding and metal fabrication, Traditional industrial automation or manual process tuning, Industrial and collaborative robot portfolio plus solutions ecosystem, "Precision and repeatability across difficult production areas", "No retained public evidence on cycle time, consumable economics, or service burden"]
      - [Medical or rehabilitation-adjacent interaction, Human-assisted therapy or specialist devices, Force-controlled collaborative robots and compliant interaction toolkit, "Precision force control and compliant human-robot interaction", "No retained regulatory-clearance matrix or outcome study by deployment type"]
      - [Embodied-AI model training and prototyping, Research-lab integration of custom arms, AR humanoid arms plus HSA joints and open AI interfaces, "Human-like dexterity, plug-and-play interfaces, and easier embodied-intelligence integration", "Commercial customer list, release cadence, and privacy/security governance remain undisclosed"]
    notes: >-
      Benefits are preserved as source-backed product claims or direct quotations; public evidence
      does not quantify downstream economics, utilization, or clinical/production outcomes.
    claimRefs: [CE003, CE004, CE005, CE009, CE010, CE013]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Key dependency
      - Risk
    rows:
      - [Robot bodies and joints, "Industrial robots, xMate cobots, AR humanoid arms, and HSA force-controlled joints deliver the physical work surface", "Force-controlled hardware availability, manufacturing throughput, and component supply", "Public evidence does not break out field failures, spare-parts logistics, or regional certification coverage"]
      - [Control systems, "xCore and iNex coordinate motion control, interfaces, and robot behavior", "Company-owned controller roadmap and AI-interface compatibility", "Open-interface claims are visible, but controller security and patch governance are not"]
      - [AI and perception layer, "ROKAE Brain, force-perception algorithms, and motion-control algorithms are positioned as the embodied-intelligence layer", "Model quality, training data, and hardware-software integration quality", "No retained public evidence on model update cadence, privacy controls, or inference cost/performance"]
      - [Developer and deployment tooling, "ROS2 packages, MoveIt 2 integration, ros2_control, Rokae Studio, and ecosystem tools reduce integration effort", "Vendor SDKs, supported OS/ROS versions, and documentation quality", "Current manual centers on ROS2 Humble and named xMate models, implying version and model support boundaries"]
    notes: >-
      The architecture is reconstructed from retained official documentation and 2026 disclosures;
      unsupported security, privacy, and lifecycle-governance claims are left as explicit gaps.
    claimRefs: [CE006, CE007, CE008, CE009, CE010, CE013]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence shows a layered stack from robot bodies upward through controller and AI
      layers to an external integration surface, but the deepest proof is still in company-issued
      documentation rather than independent field-performance data.
    data:
      layers:
        - label: Application workflows
          detail: Publicly marketed jobs where the hardware and software stack is meant to create value.
          modules:
            - label: Precision assembly
              note: Flexible manufacturing and fine industrial work
            - label: Human-safe interaction
              note: Compliance-sensitive industrial, medical, and rehab contexts
          outputs:
            - label: Multi-scenario deployments
              note: Industrial, commercial-service, medical, and embodied-AI workflows
        - label: Integration and developer surface
          detail: External tools and interfaces that help integrators deploy or simulate systems.
          modules:
            - label: ROS2 + MoveIt 2 + ros2_control
              note: Real-hardware and simulation integration for supported xMate models
            - label: Rokae Studio + 100+ ecosystem tools
              note: Offline programming, simulation, and extension tooling
          outputs:
            - label: Faster integration
              note: Public tooling exists, but security and lifecycle governance evidence does not
        - label: Control and embodied-intelligence layer
          detail: Proprietary controller and AI substrate positioned as the system brain and cerebellum.
          modules:
            - label: xCore / iNex
              note: Motion control, open interfaces, and software ecosystem support
            - label: ROKAE Brain / force algorithms
              note: Multimodal world-model and force-perception layer
          outputs:
            - label: AI-to-motion bridge
              note: Connects AI models with robot hardware through standardized interfaces
        - label: Safety and quality controls
          detail: Publicly disclosed safeguards around force control, redundancy, and standards alignment.
          modules:
            - label: TÜV safety functions
              note: Functional-safety and redundancy claims across collaborative and embodied products
            - label: ISO / reliability signals
              note: ISO references, MTBF claim, and environmental protection messaging
          outputs:
            - label: Trust narrative
              note: Safety evidence is visible, but certification scope by SKU is still incomplete
        - label: Robot bodies and components
          detail: Commercial robot hardware and force-controlled components marketed today.
          modules:
            - label: Industrial + xMate collaborative robots
              note: Existing industrial and cobot portfolio
            - label: AR humanoid arms + HSA joints
              note: Embodied-intelligence hardware sold as standalone products
          outputs:
            - label: Full-stack product base
              note: Broad surface today; independent uptime and certification proof remains limited
        - label: Service and rollout layer
          detail: Field deployment support, localization, and certifications required for global scale.
          modules:
            - label: Global technical support
              note: Official service network and localized support expansion
            - label: CE / UL and regional approvals
              note: Certification workstreams cited in the 2026 filing
          outputs:
            - label: International deployment readiness
              note: Expansion is visible, but completion evidence is not yet comprehensive
    approximationNotes: >-
      The stack preserves public component relationships only; it does not imply verified
      performance superiority, cybersecurity maturity, or common commercialization stage across
      every layer.
    claimRefs: [CE004, CE007, CE008, CE009, CE010]
callouts:
  - calloutType: insight
    title: The real product is a stack, not only a cobot arm
    body: >-
      ROKAE's retained public materials consistently bundle robot bodies, force-controlled joints,
      controller layers, AI interfaces, and external integration tooling, which suggests the
      underwriting unit is closer to a robotics platform than a single hardware SKU.
    claimRefs: [CE001, CE007, CE009, CE010]
  - calloutType: risk
    title: Public trust evidence lags the architecture narrative
    body: >-
      Safety features and integration tooling are visible, but the retained pool does not verify
      controller security, privacy handling, model-governance discipline, or fleet-level uptime,
      and even the company's filing still frames some global certification and service build-out as
      future work.
    claimRefs: [CE005, CE006, CE013]
