company:
  name: "ROKAE"
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    ROKAE's public product surface is broader than a single cobot line: the company markets
    industrial robots, xMate collaborative robots, embodied-intelligence arms and joints, plus
    controller and integration layers that it presents as a full-stack platform. The strongest
    verified strengths in the retained evidence are force-control/safety messaging and the visible
    integration surface around ROS2 and simulation tooling; the weakest areas are controller
    cybersecurity, SKU-by-SKU certification scope, and field-reliability evidence outside company
    materials.
sections:
  - id: product-scope-and-workflow
    title: Product scope and workflow fit
    body: >-
      The retained evidence supports treating ROKAE as a multi-line robotics platform rather than
      a single-model cobot vendor. Official company and investor surfaces consistently group the
      offering into industrial robots, flexible collaborative robots, embodied intelligent robots,
      and related robotic solutions, while the investor-relations profile adds that the public
      lineup already spans 50+ robot products. The workflow focus is also specific rather than
      generic: collaborative robots are marketed for high-precision assembly, compliant
      human-machine interaction, welding, and medical or rehabilitation-adjacent tasks, while the
      embodied portfolio is aimed at humanoid-arm, wheeled dual-arm, and related physical-AI
      development contexts. That breadth matters for diligence because it suggests ROKAE is trying
      to monetize not only robot bodies but also deployment-ready workflows across industrial,
      commercial-service, medical, and embodied-AI scenarios.
    claimRefs: [CE001, CE002, CE003, CE012]
    tableRefs: [TE001, TE002]
  - id: architecture-and-integration
    title: Architecture and integration surface
    body: >-
      The public architecture story has three visible layers. At the hardware layer, ROKAE markets
      industrial robots, xMate collaborative robots, AR humanoid force-controlled arms, and HSA
      force-controlled joints. At the control layer, 2026 disclosures describe xCore and iNex as
      the motion-and-interface substrate and position ROKAE Brain plus force-perception algorithms
      as the embodied-intelligence "brain" layer. At the external integration layer, the strongest
      non-marketing proof is the ROS2 manual: ROKAE documents supported xMate models, ROS2 Humble
      on Ubuntu 22.04, MoveIt 2 plus ros2_control integration, and a hardware plugin that calls a
      vendor SDK. That makes the platform more concrete for integrators than a simple brochure
      would, but it also shows that third-party deployment still depends on ROKAE-controlled APIs,
      model support, and documentation quality rather than a fully open ecosystem.
    claimRefs: [CE004, CE006, CE007, CE008, CE009, CE010, CE011]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-controls-and-risks
    title: Maturity, controls, and product risk
    body: >-
      ROKAE's public trust story is strongest on functional safety and deployment convenience. The
      company repeatedly cites TÜV-backed functional-safety features, ISO collaborative-robot
      standards, redundancy in sensing and control, simulation tooling, and a global service
      network. Independent reporting also repeats the self-developed control-stack and force-control
      differentiation themes, which gives some external corroboration that these are the right
      things to diligence. Still, the public evidence is incomplete where an investor would want it
      to be firmest: the filing says ROKAE still plans to obtain mainstream certifications such as
      CE and UL and to strengthen localized service capabilities, while the retained pool contains
      no direct evidence on controller security architecture, software update governance, privacy
      handling, or fleet-level uptime/warranty outcomes by model. The result is a chapter that can
      verify product breadth and architecture direction, but not yet underwrite global deployment
      quality with high confidence.
    claimRefs: [CE005, CE006, CE011, CE013]
