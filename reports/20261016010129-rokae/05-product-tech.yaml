  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: controller-cybersecurity
      missingEvidence: Public controller/software security architecture, vulnerability-disclosure policy, access-control model, SBOM, and patch/update cadence for xCore, iNex, and related SDKs.
      whyItMatters: Networked robots with open interfaces and external tooling expand the attack surface, so underwriting deployment quality without software-security evidence would overstate trust maturity.
