      - [xMate collaborative robots, Precision-assembly and flexible-manufacturing users, "Publicly marketed core line with ROS2 integration surface", "Force sensing, vision, functional-safety messaging, and open tooling claims", "Real production win rates, realized payload/application mix, and independent uptime evidence"]
      - [Embodied-intelligence products, Embodied-AI developers and robotic-system builders, "Commercial push visible in 2026 filing and product brochure", "AR humanoid arms, HSA joints, and AI-interface positioning", "Pilot versus production deployments, shipment volumes, and customer concentration by embodied SKU"]
      - [Control and software platforms, "Integrators, developers, and system architects", "Visible in filing, manuals, and product pages", "xCore, iNex, ROKAE Brain, MoveIt 2 plus ros2_control, Rokae Studio", "API stability, versioning policy, and security-hardening evidence"]
    notes: >-
      Status reflects what is visible in retained public sources; it does not prove installed-base
      quality, certification scope, or production-scale adoption for every SKU.
    claimRefs: [CE001, CE002, CE007, CE009, CE010, CE012]
