  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "pricing"
      missingEvidence: >-
        Model-level list prices, realized net prices, discount schedules, contract duration,
        warranty terms, service fees, integrator margins, and matched peer quotations.
      whyItMatters: >-
        Without a normalized configured-cell price and service scope, apparent hardware
        differentiation cannot be translated into buyer ROI or margin durability.
      diligencePath: >-
        Run a same-workcell request for quotation across ROKAE, Universal Robots, two global
        industrial incumbents, and two domestic peers, including five-year support and spares.
      relatedQuestionRefs: ["QP004"]
      relatedTableRefs: ["TP003"]
    - type: "missing-source"
      severity: "material"
      topic: "independent-benchmark"
      missingEvidence: >-
        Independent teardown, repeatability, uptime, force-control, commissioning-time, and
        software-ecosystem benchmarks against named competitors.
      whyItMatters: >-
        Vendor specifications and category-level comparisons cannot establish field reliability
        or the persistence of ROKAE's claimed technical advantage.
      diligencePath: >-
        Commission a controlled bake-off on the same application and obtain integrator references
        with failure, maintenance, and deployment-time data.
      relatedQuestionRefs: ["QP003", "QP007", "QP008"]
      relatedTableRefs: ["TP002"]
    - type: "private-evidence-only"
      severity: "material"
      topic: "switching-cost"
      missingEvidence: >-
        Customer retention, repeat-order, software attachment, service renewal, multi-homing, and
        installed-base utilization data by product line and geography.
      whyItMatters: >-
        Product breadth and lifecycle scope suggest potential lock-in, but do not prove durable
        switching cost or account expansion.
      diligencePath: >-
        Review cohort-level orders and interview customers that expanded, multi-homed, or replaced
        ROKAE systems after initial deployment.
