figures:
  - id: "FP001"
    title: "Competitive positioning by differentiated stack and ecosystem maturity"
    type: "quadrant"
    summary: >-
      An ordinal evidence map shows ROKAE's relative hardware/control differentiation alongside
      the ecosystem and service depth that favors established incumbents.
    data:
      xAxis:
        label: "Hardware and control differentiation (ordinal)"
        min: 1
        max: 5
        lowLabel: "Commodity or selected components"
        highLabel: "Integrated differentiated stack"
        description: "Analyst ordinal score from retained qualitative evidence, not a measured benchmark"
        scale: "1-5 ordinal"
      yAxis:
        label: "Channel and ecosystem maturity (ordinal)"
        min: 1
        max: 5
        lowLabel: "Early or project-specific"
        highLabel: "Established global ecosystem"
        description: "Analyst ordinal score from retained qualitative evidence, not installed-base data"
        scale: "1-5 ordinal"
      points:
        - name: "ROKAE"
          label: "ROKAE"
          x: 4
          y: 3
          detail: "Integrated force-control and broad product stack; international service footprint is expanding but not peer-benchmarked."
        - name: "Universal Robots"
          label: "Universal Robots"
          x: 3
          y: 5
          detail: "Reference cobot incumbent in the retained review, with the most mature software and integrator ecosystem."
        - name: "Global industrial incumbents"
          label: "Global industrial incumbents"
          x: 4
          y: 5
          detail: "Established industrial relationships and global service channels; peer-specific hardware evidence is unavailable."
        - name: "Chinese industrial leaders"
          label: "Chinese industrial leaders"
          x: 3
          y: 4
          detail: "Strong local delivery and customization context; individual vendors are not compared in the retained pool."
        - name: "Embodied-AI entrants"
          label: "Embodied-AI entrants"
          x: 2
          y: 1
          detail: "Potential policy-software differentiation, but retained analysis characterizes commercial channels as minimal."
        - name: "Integrator-built fixed automation"
          label: "Integrator-built fixed automation"
          x: 1
          y: 2
          detail: "Process-specific substitute whose capability and support depend on the chosen arm, integrator, and internal team."
    approximationNotes: >-
      Coordinates are evidence-backed ordinal analyst scores, not market shares or measured
      performance. Category-level points avoid unsupported precision for unnamed competitors.
    claimRefs: ["CP009", "CP010", "CP014", "CP016"]
callouts:
  - calloutType: "risk"
    title: "Hardware leadership may not capture the software layer"
    body: >-
      ROKAE's disclosed scale and force-control architecture are credible differentiators, but
      international service requirements and incumbent ecosystems can absorb buyer attention and
      margin. Underwrite repeat deployments, software attachment, and service economics rather
      than assuming arm-level capability becomes durable platform power.
    claimRefs: ["CP010", "CP014", "CP015", "CP016"]
