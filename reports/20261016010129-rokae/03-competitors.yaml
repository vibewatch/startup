company:
  name: "ROKAE"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    ROKAE competes simultaneously with global cobot ecosystems, established industrial-robot
    vendors, domestic Chinese suppliers, and emerging embodied-AI platforms. Its disclosed
    differentiation is strongest in integrated force control, product breadth, and domestic
    scale, but public evidence does not support a complete peer-price benchmark or prove that
    hardware differentiation will overcome incumbent software, integration, and service depth.
sections:
  - id: "competitive-set"
    title: "The buying set is broader than cobot vendors"
    body: >-
      A buyer can meet the same automation need through ROKAE, a global cobot platform such as
      Universal Robots, an established industrial-robot vendor such as FANUC, ABB, KUKA, or
      Yaskawa, a domestic Chinese supplier, an emerging embodied-AI platform, or an
      integrator-built fixed cell. The retained evidence does not name or quantify every domestic
      peer, so the landscape should be read as a category map rather than a league table. ROKAE's
      breadth across industrial, flexible collaborative, and embodied-intelligent robots is
      strategically useful because it can address multiple automation jobs within an account.
      However, Universal Robots' installed base and software ecosystem, and global incumbents'
      service networks, remain distribution and switching-cost advantages that a capable arm
      alone does not erase.
    claimRefs: ["CP001", "CP005", "CP007", "CP008", "CP009"]
    tableRefs: ["TP001"]
    figureRefs: ["FP001"]
  - id: "capability-and-scale"
    title: "ROKAE is scaling a differentiated hardware stack"
    body: >-
      ROKAE's current evidence is strongest on its own operating scale. In the six months ended
      June 30, 2026, the issuer reported RMB150.030 million of industrial-robot revenue,
      RMB104.910 million of flexible-collaborative-robot revenue, and RMB139.102 million of
      embodied-intelligent-robot revenue. Robot-product sales volume rose from more than 4,000
      units in the comparable 2025 period to more than 13,000 units. The same filing reported
      69% year-on-year industrial-robot growth and 72% flexible-cobot growth. Product breadth and
      integrated joint force control therefore have commercial evidence behind them, not just a
      prototype narrative. Yet retained sources contain no independent teardown, repeatability
      benchmark, uptime study, or like-for-like test against named rivals, so capability cells
      outside ROKAE's own disclosures remain unknown rather than guessed.
    claimRefs: ["CP002", "CP003", "CP004", "CP010"]
    tableRefs: ["TP002"]
  - id: "pricing-distribution-and-switching"
    title: "Distribution and lifecycle support matter more than public list price"
    body: >-
      Public pricing is too sparse for a reliable total-cost comparison. A third-party directory
      estimates Human.X at US$150,000-US$200,000, but explicitly labels that figure a typical
      class range rather than a ROKAE quotation. No retained source discloses list prices,
      realized discounts, contract duration, service fees, or integrator economics for ROKAE's
      industrial and collaborative lines or for named peers. Distribution evidence is more
      concrete: ROKAE reports parts warehouses in nine countries and service teams across 13
      countries and regions. Its registered business scope also spans installation, maintenance,
      software, and leasing. That breadth can reduce buyer coordination costs, while also making
      application engineering, controls, software, spares, and service part of the switching
      decision. Multi-homing and retention rates remain undisclosed.
    claimRefs: ["CP006", "CP011", "CP012", "CP013", "CP014"]
    tableRefs: ["TP003"]
  - id: "moat-and-displacement-risk"
    title: "The moat is credible in hardware, less proven in ecosystem"
    body: >-
      ROKAE's strongest moat hypothesis is control over force-sensing joints, motion control, and
      a product family spanning conventional and emerging robot categories. The reported 34%
      share of China's flexible-collaborative-robot subsegment is meaningful, but it comes from a
      Frost & Sullivan study commissioned for the listing and the underlying methodology is not
      in the retained evidence. The broader market is becoming more competitive as domestic
      manufacturers gain share against foreign incumbents. ROKAE also reported an RMB79.0 million
      HKFRS loss for the first half of 2026 despite an RMB18.4 million adjusted non-HKFRS profit,
      preserving the distinction between accounting performance and management's adjusted view.
      International expansion adds certification, channel, training, documentation, and local
      service costs. The investment case therefore depends on converting hardware differentiation
      and volume growth into repeat deployments before competitors commoditize the arm and shift
      value toward software and integration ecosystems.
    claimRefs: ["CP007", "CP008", "CP010", "CP015", "CP016"]
