  evidenceGaps:
    - type: missing-source
      severity: material
      topic: compliance-packet
      missingEvidence: Export-control, sanctions-screening, privacy, safety, and product-certification documentation by geography and product family.
      whyItMatters: Without the underlying compliance packet, it is impossible to judge whether overseas growth is gated by manageable paperwork or by material market-access constraints.
      diligencePath: Request the compliance matrix used for major overseas markets, named certifications, renewal dates, incident escalation owners, and any external audit findings.
      relatedQuestionRefs: [QR002, QR008]
      relatedTableRefs: [TR001]
    - type: missing-source
      severity: material
      topic: overseas-channel-redundancy
      missingEvidence: Country-level revenue, renewal, support SLAs, and partner / distributor mix for overseas operations.
      whyItMatters: The current evidence shows footprint but not whether non-China growth is resilient or concentrated in a thin service-and-channel base.
      diligencePath: Request a country-by-country revenue bridge, top overseas partners, service response metrics, and the pipeline for new local support centers.
      relatedQuestionRefs: [QR005, QR006, QR008]
      relatedTableRefs: [TR002, TR003]
    - type: missing-source
      severity: material
      topic: profitability-durability
      missingEvidence: Post-IPO cash-burn bridge, covenant headroom, backup facilities, and monthly working-capital conversion by major customer group.
      whyItMatters: H1 2026 improvement is encouraging, but underwriting still turns on whether cash generation survives R&D intensity, collections volatility, and overseas build-out.
      diligencePath: Request a 12-18 month cash plan with receivables aging, supplier-finance counterparties, debt covenants, and downside liquidity triggers.
      relatedQuestionRefs: [QR003, QR006]
      relatedTableRefs: [TR003]
    - type: missing-source
      severity: material
      topic: reliability-and-security
      missingEvidence: Public or private evidence on uptime, warranty claims, recalls, vulnerability management, and customer-side security reviews.
      whyItMatters: Open interfaces and developer tooling are valuable only if the deployment, support, and security burden remains controlled as the install base grows.
      diligencePath: Request incident logs, warranty / recall history, SLA performance, penetration-test summaries, and major customer technical-audit outcomes.
      relatedQuestionRefs: [QR004, QR005, QR008]
      relatedTableRefs: [TR002]
