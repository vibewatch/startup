schemaVersion: report-v2
artifact: risks
slug: rokae
runDate: 2026-10-16
company:
  name: ROKAE
chapter:
  number: 7
  title: Risks
  summary: >-
    Retained public evidence supports ROKAE as a newly listed robotics company whose
    biggest current underwriting risks are still-unproven statutory profitability,
    cross-border regulatory complexity as overseas expansion accelerates, and continued
    dependence on heavy R&D commercialization. IPO proceeds, a wider service footprint,
    and visible developer tooling are real mitigants, but the public corpus still does
    not resolve certifications, channel redundancy, or post-IPO customer concentration
    well enough to call those risks closed.
sections:
  - id: ranked-risk-posture
    title: Ranked risk posture
    body: >-
      The most material near-term risk is still financial durability rather than an
      immediate legal overhang. H1 2026 revenue, adjusted profit, and operating cash
      flow improved sharply, but ROKAE still reported a RMB79.0 million statutory loss,
      while independent commentary says losses may continue and that gross-margin
      expansion still has to prove a durable path to profitability. Regulatory and
      expansion risk sits close behind: management itself says it is monitoring
      cross-border trade regulations and geopolitical dynamics while building overseas
      service capacity, and independent analysis flags exposure to export controls and
      sanctions as the company internationalizes. The visible mitigations are real but
      incomplete: post-IPO proceeds are earmarked for R&D, market expansion, working
      capital, and production efficiency, yet public evidence still leaves material
      diligence gaps around certifications, channel redundancy, and process controls.
    claimRefs: [CR003, CR004, CR005, CR006, CR010, CR013, CR014]
    figureRefs: [FR001]
  - id: legal-regulatory-exposure
    title: Legal and regulatory exposure is visible, but not fully diligenceable
    body: >-
      The cleanest current legal fact is narrow: as of June 30, 2026, the interim
      results announcement says ROKAE had no material contingent liability and no
      pending or threatened litigation or claim of material importance. That helps on
      near-term overhang, but it does not prove broad compliance readiness. The formal
      legal framework is visible because the articles of association explicitly anchor
      the company to PRC company and securities law plus Hong Kong listing rules, while
      independent IPO analysis adds a concentrated post-listing control structure around
      founder-chairman-CEO Tuo Hua. The harder question is operational compliance as the
      company expands abroad: management highlights cross-border trade and geopolitical
      monitoring, and independent analysis explicitly names export controls and sanctions,
      yet the retained public corpus still does not enumerate the underlying compliance,
      certification, privacy, or safety-control packet needed to judge maturity.
    claimRefs: [CR001, CR002, CR003, CR004, CR013, CR015]
    tableRefs: [TR001]
  - id: operating-and-technology-risk
    title: Operating execution depends on converting product breadth into repeatable delivery
    body: >-
      Public evidence shows real operating scale, but it also shows how much execution
      still depends on R&D translation and field delivery. Official materials point to a
      50,000-robot annual factory capacity, service coverage in mainland China, overseas
      parts warehouses, and technical support teams across 13 countries and regions, so
      this is not a paper platform. At the same time, the company is still investing
      aggressively in control systems, force-controlled joints, perception, and embodied
      AI commercialization, while independent sources warn that maintaining share in a
      still-small collaborative-robot segment will require sustained R&D intensity and
      that planned overseas service expansion has not yet proven traction. Open SDK,
      ROS2, plugin, and control-system documentation are a credible mitigation because
      they lower integration friction, but they also imply a support, reliability, and
      ecosystem-adoption burden that public sources do not quantify.
    claimRefs: [CR004, CR006, CR007, CR011, CR012, CR013]
    tableRefs: [TR002]
  - id: financial-and-dependency-risk
    title: Balance-sheet relief after listing does not remove financing and counterparty dependence
    body: >-
      The July 2026 listing reduced one important legacy overhang because preferred-share
      redemption liabilities were derecognized into equity after the IPO, but the public
      evidence still describes a business that relies on careful counterparty management.
      The filing says credit risk mainly arises from customer credit extension and
      investing activities, and it also shows RMB50.648 million of bank loans under
      supplier-finance arrangements that settle within one year. Those exposures matter
      because profitability is not yet fully proven and because the post-IPO use-of-
      proceeds plan still reserves meaningful capital for working capital, production
      efficiency, and strategic investment rather than only discretionary expansion. The
      practical question for diligence is whether improved H1 2026 cash generation is a
      durable operating shift or a temporarily favorable mix before global scale, service
      redundancy, and collections discipline are fully tested.
    claimRefs: [CR005, CR008, CR009, CR010, CR014]
    tableRefs: [TR003]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk
      - Jurisdiction / scope
      - Current public status
      - Likelihood
      - Severity
      - Mitigation visible now
      - Residual exposure
      - Diligence path
    rows:
      - ["Cross-border compliance and export-control exposure", "PRC outbound operations plus overseas sales/service footprint", "Independent IPO analysis flags compliance with complex PRC and international rules plus export-control/sanctions exposure; management says it is monitoring cross-border trade regulations and geopolitical dynamics.", High, High, "Localized service teams, parts warehouses, and explicit management monitoring of trade and geopolitical changes.", "Public evidence does not disclose the actual export-control, sanctions-screening, or product-classification process.", "Request export-control policy, restricted-jurisdiction screening flow, major-country product classification, and board-level compliance reporting."]
      - ["Public-company governance and controller concentration", "PRC company law, PRC securities law, Hong Kong listing rules, and post-IPO control structure", "Articles of association tie ROKAE to PRC and Hong Kong listing law; independent analysis says the controlling shareholder group holds 35.37% of voting power post-listing.", Medium, High, "Formal listed-company governance framework, board structure, and 12-month shareholder lock-up after listing.", "Founder-chairman-CEO concentration can still narrow challenge capacity if operating targets miss.", "Request full board-committee map, independent-director voting history, related-party policy, and reserved-matter thresholds."]
      - ["Hidden legal / certification gaps despite no disclosed material case", "Litigation, safety, privacy, product certification, and customer-side compliance requests", "The interim filing says there was no material contingent liability and no material pending or threatened litigation as of 2026-06-30, but retained public sources do not enumerate sector-specific certifications or privacy / safety controls.", Medium, Medium, "Current absence of disclosed material litigation and a formal listed-company disclosure regime.", "No-recorded-case is not proof that safety, privacy, or certification diligence is complete.", "Request litigation docket sweep, certification register, product-liability coverage, privacy / cyber policy set, and customer audit outcomes."]
    notes: >-
      Rows are severity-ranked analyst syntheses from the cited evidence; legal status is
      limited to what the retained public sources explicitly disclose and does not prove
      the absence of undisclosed claims or compliance deficiencies.
    enumerationScope:
      coverage: sample
      basis: >-
        Representative subset of the highest-salience public legal and regulatory risks
        visible in the assigned evidence as of the 2026-10-16 run date.
    claimRefs: [CR001, CR002, CR003, CR004, CR013, CR015]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Evidence-backed signal
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - ["Embodied-AI commercialization lags R&D spend", "Official strategy and independent summaries both show continued heavy investment in control systems, force-controlled joints, perception, and commercialization while profitability is still emerging.", High, High, Medium, "If embodied programs scale slower than planned, R&D intensity can dilute margin gains from mature robot lines.", "No public conversion data from pilot programs to repeat production orders."]
      - ["Overseas service footprint expands faster than local proof", "Official materials cite parts warehouses in nine countries and service teams in 13 countries, but independent commentary says overseas revenue fell from 14.3% to 9.0% between 2023 and 2024 and planned service centers are not yet proven.", Medium, High, Medium, "Field infrastructure exists, yet revenue proof and partner redundancy are still thin in the retained evidence.", "No public country-level revenue, renewal, or channel-performance disclosure."]
      - ["Platform reliability and integration burden rises with openness", "ROKAE publicly exposes xCore, SDK, ROS2, plugin, and download surfaces while management describes standardized open interfaces and a mature software ecosystem.", Medium, Medium, Medium, "Developer tooling can reduce integration friction and shorten deployment time for partners and customers.", "No public reliability metrics, SLA language, security-incident history, or support-volume data were retained."]
      - ["Manufacturing and delivery discipline must hold through scale-up", "Official sources point to 50,000 annual robot capacity, 1,000+ customers, and a broad product matrix, while management still emphasizes supply-chain, manufacturing, delivery, and collection optimization.", Medium, Medium, Medium, "Installed manufacturing footprint, service organization, and existing customer base reduce single-site startup risk.", "No public scrap, yield, warranty, recall, or on-time-delivery dataset in the retained corpus."]
    notes: >-
      Likelihood, severity, and mitigation-maturity labels are analyst-authored rankings
      anchored to the cited operating evidence only; blank operational KPIs remain real
      diligence gaps rather than implied zeros.
    claimRefs: [CR004, CR006, CR007, CR011, CR012, CR013]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / platform
      - Role
      - Concentration signal
      - Failure scenario
      - Severity
      - Mitigation visible now
      - Residual exposure
    rows:
      - ["Supplier-finance working-capital support", "China Merchants Bank supplier-finance facility", "Advances payment to suppliers before original due dates; ROKAE settles with the bank within one year.", "RMB50.648m outstanding at 2026-06-30 under one named facility in the retained filing excerpt.", "Facility tightens, supplier terms change, or collections stretch while ROKAE is still proving profitability.", High, "IPO proceeds add fresh equity capital and H1 2026 operating cash flow turned positive.", "Public evidence does not show covenant headroom, backup facilities, or monthly cash-conversion detail."]
      - ["Developer and integrator ecosystem adoption", "xCore / SDK / ROS2 / plugin stack plus external partners", "Helps third parties build around ROKAE's control platform and hardware.", "Official sources prove the tools exist, but not the size or quality of the active external ecosystem.", "Third-party adoption stays shallow, raising support costs without creating durable ecosystem lock-in.", Medium, "Open interfaces, downloadable tools, and a declared software ecosystem.", "No public developer-retention, certified-integrator, or ecosystem-revenue disclosure in the retained corpus."]
      - ["Overseas service and channel execution", "Local service teams, parts warehouses, and country-level delivery network", "Supports installation, after-sales support, and response times outside China.", "Service presence is visible across multiple countries, but retained public evidence does not show diversified channel economics or partner redundancy.", "A weak partner or underperforming country build-out could slow expansion before the footprint is self-funding.", High, "Existing warehouses, professional service teams, and planned overseas-sales investment from IPO proceeds.", "No public country-level revenue, renewal, or partner-concentration data in the retained corpus."]
    notes: >-
      This register focuses on evidence-backed dependencies visible in the retained
      public corpus; it does not imply these are the only counterparties or platforms
      that matter to ROKAE's operations.
    claimRefs: [CR005, CR008, CR009, CR010, CR012, CR014]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      The retained evidence ranks profitability, regulatory internationalization, and
      commercialization execution as the highest-residual risk clusters.
    data:
      columns:
        - label: Likelihood
          detail: Analyst-authored rating from the cited evidence only.
        - label: Impact
          detail: Underwriting severity if the risk crystallizes.
        - label: Mitigation maturity
          detail: How concrete the visible public mitigations are today.
        - label: Residual exposure
          detail: What remains unresolved after visible mitigations.
        - label: Kill criterion
          detail: Measurable thesis-break or escalation signal.
      rows:
        - label: Profitability and capital discipline
          note: Statutory profitability is not yet proven despite better H1 2026 momentum.
          values:
            - label: High
              tone: high
              note: "RMB79.0m statutory loss remained in H1 2026."
            - label: High
              tone: high
              note: "Margin gains still need to absorb R&D and scale costs."
            - label: Medium
              tone: medium
              note: "IPO proceeds and better operating cash flow buy time."
            - label: High
              tone: high
              note: "Cash-conversion durability and covenant headroom remain undisclosed."
            - label: "If statutory losses widen or operating cash flow turns negative again through 2027."
              tone: high
        - label: Cross-border compliance
          note: International expansion is explicitly tied to regulatory and geopolitical monitoring.
          values:
            - label: Medium
              tone: medium
              note: "Exposure rises with deeper overseas revenue ambitions."
            - label: High
              tone: high
              note: "Sanctions, export-control, or market-access issues could slow growth."
            - label: Low-Medium
              tone: medium
              note: "Monitoring is visible; process detail is not."
            - label: High
              tone: high
              note: "No retained compliance packet or certification matrix."
            - label: "If a key export market requires approvals ROKAE cannot document or sustain."
              tone: high
        - label: Embodied-product commercialization
          note: New product lines matter disproportionately to the current growth narrative.
          values:
            - label: High
              tone: high
              note: "Growth plan leans on embodied robots and force-controlled modules."
            - label: High
              tone: high
              note: "Slow pilot conversion would pressure margin and capital needs."
            - label: Medium
              tone: medium
              note: "R&D budget, product launches, and tooling are visible."
            - label: High
              tone: high
              note: "No public pilot-to-production conversion or warranty dataset."
            - label: "If embodied orders fail to translate into repeat production revenue by the next reporting cycle."
              tone: high
        - label: Overseas service and partner execution
          note: Footprint exists, but monetization proof and redundancy are still thin.
          values:
            - label: Medium
              tone: medium
              note: "Warehouses and service teams are in place across multiple countries."
            - label: Medium-High
              tone: high
              note: "Weak field execution could slow non-China growth and brand trust."
            - label: Medium
              tone: medium
              note: "Network build-out is funded and visibly underway."
            - label: Medium-High
              tone: high
              note: "Country-level revenue, renewal, and partner mix remain undisclosed."
            - label: "If overseas revenue mix fails to recover while service investment keeps rising."
              tone: high
        - label: Governance concentration
          note: Public-market governance exists, but controller power is still meaningful.
          values:
            - label: Medium
              tone: medium
              note: "The concentrated control structure is visible immediately after listing."
            - label: Medium-High
              tone: high
              note: "Weak internal challenge could slow corrective action if execution slips."
            - label: Medium
              tone: medium
              note: "Formal listed-company governance and lock-ups are visible mitigants."
            - label: Medium
              tone: medium
              note: "Public evidence does not include committee behavior or voting-history detail."
            - label: "If related-party discipline weakens or independent oversight proves passive."
              tone: high
        - label: Working-capital counterparty dependence
          note: Supplier-finance and customer-credit exposure can pressure liquidity before profitability fully matures.
          values:
            - label: Medium
              tone: medium
              note: "The exposures are explicit in the interim filing."
            - label: High
              tone: high
              note: "Collections or facility stress could tighten liquidity quickly."
            - label: Medium
              tone: medium
              note: "IPO capital and better H1 cash flow are visible buffers."
            - label: Medium-High
              tone: high
              note: "No backup-facility, covenant, or aging detail is public in the retained evidence."
            - label: "If receivables aging worsens or supplier-finance capacity tightens before profitability is stable."
              tone: high
    approximationNotes: >-
      Cells are analyst-authored qualitative ratings and kill criteria synthesized from
      the cited evidence only; they are not source-reported numeric probabilities.
    claimRefs: [CR003, CR004, CR005, CR006, CR007, CR008, CR010, CR012, CR013, CR014]
callouts:
  - calloutType: risk
    title: IPO cash reduces urgency, not underwriting burden
    body: >-
      The listing removed preferred-share redemption pressure and added capital for R&D,
      working capital, and expansion, but it did not by itself prove a durable statutory
      profit model or low-risk internationalization path.
    claimRefs: [CR005, CR010, CR014]
  - calloutType: insight
    title: ROKAE's biggest unresolved risks are process risks, not headline-crisis risks
    body: >-
      The assigned evidence does not show a current material lawsuit or disclosed crisis
      incident. The harder risks are quieter: compliance process depth, channel and
      service redundancy, and whether heavy technical investment converts into repeatable
      commercial outcomes.
    claimRefs: [CR001, CR003, CR013]
