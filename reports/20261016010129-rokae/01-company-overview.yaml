callouts:
  - calloutType: "risk"
    title: "Founder concentration requires explicit succession diligence"
    body: >-
      Tuo Hua is founder, ultimate controlling shareholder, chair, and chief
      executive/general manager. The board acknowledges the combined-role
      governance-code deviation, so succession, delegated authority, and
      independent-board challenge should be tested directly.
    claimRefs: ["CO006", "CO007"]
  - calloutType: "insight"
    title: "The IPO improves transparency but does not close the cap-table gap"
    body: >-
      Listed-company disclosures now anchor revenue, loss, headcount, proceeds,
      and governance. They do not reconcile the reported nine private rounds,
      current fully diluted ownership, secondary sales, or a current valuation.
    claimRefs: ["CO008", "CO009", "CO011", "CO013", "CO015"]
