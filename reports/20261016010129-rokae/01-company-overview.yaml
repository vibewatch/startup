company:
  name: "ROKAE"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    ROKAE is a publicly listed Chinese robotics company spanning industrial,
    collaborative, and embodied-intelligence robots. Its July 2026 Hong Kong
    listing materially improved disclosure, but founder control, continuing
    accounting losses, and unreconciled private-round and valuation data remain
    central diligence issues.
sections:
  - id: "identity-and-legal-footprint"
    title: "Identity, legal footprint, and operating model"
    body: >-
      ROKAE (Shandong) Robotics Group Inc. designs, develops, manufactures, and
      commercializes intelligent robots and robotic solutions across industrial,
      flexible collaborative, and embodied-intelligence categories. The listed
      issuer's filing dates incorporation in Beijing to December 14, 2014, while
      one independent profile calls 2015 the founding year; this appears to be a
      legal-incorporation-versus-operating-origin convention rather than a
      resolved factual match. The company converted to a joint-stock company in
      December 2024 and now has its registered office in Shandong. Separately,
      its website identifies Beijing as the management and R&D headquarters,
      with R&D centers in Beijing, Tokyo, Shanghai, and Shenzhen. These location
      labels should not be collapsed into a single headquarters claim because
      they describe different corporate functions.
    claimRefs: ["CO001", "CO002", "CO003", "CO004", "CO005"]
  - id: "leadership-control-and-governance"
    title: "Leadership, control, and governance"
    body: >-
      Founder Tuo Hua is the ultimate controlling shareholder and combines the
      roles of executive director, board chair, and general manager; the interim
      announcement also describes him as chief executive officer. Tang Shengtian
      is an executive director and chief financial officer. This gives ROKAE
      concentrated founder leadership, potentially supporting consistent
      execution but increasing succession and oversight dependence on one
      individual. The company expressly disclosed that combining chair and chief
      executive roles departs from Hong Kong Corporate Governance Code provision
      C.2.1, although its board believes the arrangement preserves the balance of
      power and says it will periodically review a split. The disclosed
      leadership table is intentionally partial because the assigned evidence
      does not provide complete biographies or an exhaustive senior-management
      roster.
    claimRefs: ["CO006", "CO007"]
    tableRefs: ["TO002"]
  - id: "capital-history-and-public-market-transition"
    title: "Capital history and public-market transition"
    body: >-
      ROKAE began trading on the Hong Kong Stock Exchange on July 9, 2026 under
      stock code 03752.HK after offering shares at HK$38.00. Following full
      exercise of the over-allotment option, the company reported about HK$1.01
      billion of gross proceeds and HK$937.1 million of net proceeds; these are
      financing inflows, not revenue or cash available for unrestricted use. A
      niche independent publication reports approximately US$210 million raised
      across nine private rounds before the IPO, including a US$6 million Series
      A in 2017 and a pre-IPO round above RMB500 million in April 2024. Those
      private-round totals were not reconciled to primary transaction documents
      in the assigned evidence, and no supportable current equity valuation was
      found. The stakeholder map therefore separates verified public-offering
      facts from reported private-financing history.
    claimRefs: ["CO008", "CO009", "CO015"]
    tableRefs: ["TO003"]
    figureRefs: ["FO001"]
  - id: "scale-financial-snapshot-and-diligence"
    title: "Scale, financial snapshot, and diligence posture"
    body: >-
      The public record now provides useful dated scale markers. ROKAE reports
      serving more than 1,000 enterprises in over 40 countries and regions, and
      its June 2026 interim filing reports 807 employees. For the six months
      ended June 30, 2026, revenue was RMB414.7 million and the accounting loss
      attributable to owners was RMB79.0 million; revenue is not ARR and the
      accounting loss is not cash burn. The company also claims annual factory
      capacity of 50,000 robots and more than 600 patents and technology awards,
      but those figures lack independent verification in this pool. Evidence on
      adverse events is incomplete: the filing reported no material litigation
      likely to have a material adverse effect, while independent commentary
      flags continued losses, weaker overseas mix, and segment concentration.
      That combination supports monitoring, not a conclusion that no incidents
      exist.
    claimRefs: ["CO010", "CO011", "CO012", "CO013", "CO014", "CO016"]
    tableRefs: ["TO001"]
