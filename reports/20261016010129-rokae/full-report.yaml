        - RMB50.648m outstanding at 2026-06-30 under one named facility in the retained filing excerpt.
        - Facility tightens, supplier terms change, or collections stretch while ROKAE is still proving profitability.
        - High
        - IPO proceeds add fresh equity capital and H1 2026 operating cash flow turned positive.
        - Public evidence does not show covenant headroom, backup facilities, or monthly cash-conversion detail.
      - - Developer and integrator ecosystem adoption
        - xCore / SDK / ROS2 / plugin stack plus external partners
        - Helps third parties build around ROKAE's control platform and hardware.
        - Official sources prove the tools exist, but not the size or quality of the active external ecosystem.
        - Third-party adoption stays shallow, raising support costs without creating durable ecosystem lock-in.
        - Medium
        - Open interfaces, downloadable tools, and a declared software ecosystem.
        - No public developer-retention, certified-integrator, or ecosystem-revenue disclosure in the retained corpus.
      - - Overseas service and channel execution
        - Local service teams, parts warehouses, and country-level delivery network
        - Supports installation, after-sales support, and response times outside China.
        - >-
          Service presence is visible across multiple countries, but retained public evidence does not show diversified
          channel economics or partner redundancy.
        - A weak partner or underperforming country build-out could slow expansion before the footprint is self-funding.
        - High
        - Existing warehouses, professional service teams, and planned overseas-sales investment from IPO proceeds.
        - No public country-level revenue, renewal, or partner-concentration data in the retained corpus.
    notes: >-
      This register focuses on evidence-backed dependencies visible in the retained public corpus; it does not imply
      these are the only counterparties or platforms that matter to ROKAE's operations.
    claimRefs:
      - CR005
      - CR008
      - CR009
      - CR010
      - CR012
      - CR014
  - id: TV001
    title: Recommendation summary table
    columns:
      - Metric
      - Current view
      - Evidence anchor
      - Decision implication
    rows:
      - - Recommendation
        - Track / research-more
        - Real commercial traction and financing support, but public valuation support remains incomplete
        - Do not underwrite the IPO valuation as a buy on retained evidence alone
      - - Confidence
        - Medium
        - Recent filings and IPO coverage are directionally consistent, but key underwriting inputs remain undisclosed
        - Proceed only with a diligence-led, price-sensitive process
      - - Risk rating
        - High
        - >-
          Losses persist, governance remains founder-influenced, and embodied-intelligence commercialization is still
          early
        - Require downside protection or stronger post-listing execution proof
      - - Valuation stance
        - Supported as a milestone listing; not yet supported as a compelling entry price
        - Demand, cornerstone support, and proceeds use are visible; comparable and cap-table detail are not
        - Favor watchlist status unless the price or evidence base improves
    notes: >-
      The table reflects public-evidence sufficiency rather than intrinsic company quality; the retained source pool
      supports a track call but not a defended buy price or target return.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV008
