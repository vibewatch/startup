  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      The retained evidence ranks profitability, regulatory internationalization, and commercialization execution as the
      highest-residual risk clusters.
    data:
      columns:
        - label: Likelihood
          detail: Analyst-authored rating from the cited evidence only.
        - label: Impact
          detail: Underwriting severity if the risk crystallizes.
        - label: Mitigation maturity
          detail: How concrete the visible public mitigations are today.
        - label: Residual exposure
          detail: What remains unresolved after visible mitigations.
        - label: Kill criterion
          detail: Measurable thesis-break or escalation signal.
      rows:
        - label: Profitability and capital discipline
          note: Statutory profitability is not yet proven despite better H1 2026 momentum.
          values:
            - label: High
              tone: high
              note: RMB79.0m statutory loss remained in H1 2026.
            - label: High
              tone: high
              note: Margin gains still need to absorb R&D and scale costs.
            - label: Medium
              tone: medium
              note: IPO proceeds and better operating cash flow buy time.
            - label: High
              tone: high
              note: Cash-conversion durability and covenant headroom remain undisclosed.
            - label: If statutory losses widen or operating cash flow turns negative again through 2027.
              tone: high
        - label: Cross-border compliance
          note: International expansion is explicitly tied to regulatory and geopolitical monitoring.
          values:
            - label: Medium
              tone: medium
              note: Exposure rises with deeper overseas revenue ambitions.
            - label: High
              tone: high
              note: Sanctions, export-control, or market-access issues could slow growth.
            - label: Low-Medium
              tone: medium
              note: Monitoring is visible; process detail is not.
            - label: High
              tone: high
              note: No retained compliance packet or certification matrix.
            - label: If a key export market requires approvals ROKAE cannot document or sustain.
              tone: high
        - label: Embodied-product commercialization
          note: New product lines matter disproportionately to the current growth narrative.
          values:
            - label: High
              tone: high
              note: Growth plan leans on embodied robots and force-controlled modules.
            - label: High
              tone: high
              note: Slow pilot conversion would pressure margin and capital needs.
            - label: Medium
              tone: medium
              note: R&D budget, product launches, and tooling are visible.
            - label: High
              tone: high
              note: No public pilot-to-production conversion or warranty dataset.
            - label: If embodied orders fail to translate into repeat production revenue by the next reporting cycle.
              tone: high
        - label: Overseas service and partner execution
          note: Footprint exists, but monetization proof and redundancy are still thin.
          values:
            - label: Medium
              tone: medium
              note: Warehouses and service teams are in place across multiple countries.
            - label: Medium-High
              tone: high
              note: Weak field execution could slow non-China growth and brand trust.
            - label: Medium
              tone: medium
              note: Network build-out is funded and visibly underway.
            - label: Medium-High
              tone: high
              note: Country-level revenue, renewal, and partner mix remain undisclosed.
            - label: If overseas revenue mix fails to recover while service investment keeps rising.
              tone: high
        - label: Governance concentration
          note: Public-market governance exists, but controller power is still meaningful.
          values:
            - label: Medium
              tone: medium
              note: The concentrated control structure is visible immediately after listing.
            - label: Medium-High
              tone: high
              note: Weak internal challenge could slow corrective action if execution slips.
            - label: Medium
              tone: medium
              note: Formal listed-company governance and lock-ups are visible mitigants.
            - label: Medium
              tone: medium
              note: Public evidence does not include committee behavior or voting-history detail.
            - label: If related-party discipline weakens or independent oversight proves passive.
              tone: high
        - label: Working-capital counterparty dependence
          note: Supplier-finance and customer-credit exposure can pressure liquidity before profitability fully matures.
          values:
            - label: Medium
              tone: medium
              note: The exposures are explicit in the interim filing.
            - label: High
              tone: high
