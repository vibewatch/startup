        title: Scale, financial snapshot, and diligence posture
        blocks:
          - type: paragraph
            body: >-
              The public record now provides useful dated scale markers. ROKAE reports serving more than 1,000
              enterprises in over 40 countries and regions, and its June 2026 interim filing reports 807 employees. For
              the six months ended June 30, 2026, revenue was RMB414.7 million and the accounting loss attributable to
              owners was RMB79.0 million; revenue is not ARR and the accounting loss is not cash burn. The company also
