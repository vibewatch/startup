  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Operating proof
        - H1 2026 revenue, margin, and cash-flow direction all improved materially
        - Statutory losses remain and the improvement has only one recent public reporting window
        - Two or more post-listing periods showing sustained operating cash generation and narrower statutory losses
      - - Market validation
        - The IPO was heavily oversubscribed and cornerstone demand covered 31.4% of the offer
        - Strong book-building can signal scarcity and narrative demand more than durable public-market support
        - Evidence of stable post-listing trading support and institutional follow-through beyond debut
      - - Scale and commercialization
        - ROKAE already serves 1,000+ customers in 40+ countries and regions with meaningful factory capacity
        - Public evidence does not disclose realized ASPs, repeat rates, or backlog conversion by cohort
        - Customer-cohort, backlog, and pricing-realization disclosures that connect scale to durable unit economics
      - - Capital structure
        - Lock-ups and rights termination reduce immediate overhang risk
        - >-
          Founder voting control and incomplete private-round valuation history still limit governance and dilution
          visibility
        - Audited cap-table bridge with priced rounds, remaining economic rights, and post-lock-up supply schedule
    notes: >-
      These rows are price-sensitive underwriting arguments, not generic company strengths and weaknesses; each row is
      tied to evidence that could move the recommendation if supplemented.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV006
      - CV008
      - CV009
      - CV010
      - CV015
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Embodied-intelligence orders convert into repeat business, mature robot lines keep margins firm, and
          IPO-funded R&D plus overseas sales expansion compound scale
        - >-
          The company grows into or above the IPO valuation through faster revenue and margin realization rather than
          multiple expansion alone
        - Execution on commercialization and overseas build-out could still lag spend
        - Possible, but needs more than one strong reporting period
      - - Base
        - >-
          Revenue growth remains strong, but statutory profitability improves gradually and disclosure on pricing or
          comparables stays limited
        - The IPO valuation is holdable as a strategic listing benchmark but not obviously cheap
        - Narrative support fades if public evidence does not deepen after listing
        - Most consistent with retained evidence
      - - Bear
        - >-
          Embodied demand proves early, losses persist, and post-listing investors stop paying a scarcity premium
          without cleaner comp support
        - The market would likely demand a discount to the current milestone valuation until proof improves
        - Competition, customer concentration, export-control exposure, and governance concentration weigh on confidence
        - Clearly plausible on current evidence
    notes: >-
      Retained public evidence supports scenario logic but not a precise numeric valuation range; the table therefore
      frames how the current valuation could be earned or discounted rather than inventing unsupported target prices.
    claimRefs:
      - CV002
      - CV003
