chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, legal footprint, and operating model
        blocks:
          - type: paragraph
            body: >-
              ROKAE (Shandong) Robotics Group Inc. designs, develops, manufactures, and commercializes intelligent
              robots and robotic solutions across industrial, flexible collaborative, and embodied-intelligence
              categories. The listed issuer's filing dates incorporation in Beijing to December 14, 2014, while one
              independent profile calls 2015 the founding year; this appears to be a
              legal-incorporation-versus-operating-origin convention rather than a resolved factual match. The company
              converted to a joint-stock company in December 2024 and now has its registered office in Shandong.
              Separately, its website identifies Beijing as the management and R&D headquarters, with R&D centers in
              Beijing, Tokyo, Shanghai, and Shenzhen. These location labels should not be collapsed into a single
              headquarters claim because they describe different corporate functions.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
      - number: '1.2'
        title: Leadership, control, and governance
        blocks:
          - type: paragraph
            body: >-
              Founder Tuo Hua is the ultimate controlling shareholder and combines the roles of executive director,
              board chair, and general manager; the interim announcement also describes him as chief executive officer.
              Tang Shengtian is an executive director and chief financial officer. This gives ROKAE concentrated founder
              leadership, potentially supporting consistent execution but increasing succession and oversight dependence
              on one individual. The company expressly disclosed that combining chair and chief executive roles departs
              from Hong Kong Corporate Governance Code provision C.2.1, although its board believes the arrangement
              preserves the balance of power and says it will periodically review a split. The disclosed leadership
              table is intentionally partial because the assigned evidence does not provide complete biographies or an
              exhaustive senior-management roster.
            claimRefs:
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
      - number: '1.3'
        title: Capital history and public-market transition
        blocks:
          - type: paragraph
            body: >-
              ROKAE began trading on the Hong Kong Stock Exchange on July 9, 2026 under stock code 03752.HK after
              offering shares at HK$38.00. Following full exercise of the over-allotment option, the company reported
              about HK$1.01 billion of gross proceeds and HK$937.1 million of net proceeds; these are financing inflows,
              not revenue or cash available for unrestricted use. A niche independent publication reports approximately
              US$210 million raised across nine private rounds before the IPO, including a US$6 million Series A in 2017
              and a pre-IPO round above RMB500 million in April 2024. Those private-round totals were not reconciled to
              primary transaction documents in the assigned evidence, and no supportable current equity valuation was
              found. The stakeholder map therefore separates verified public-offering facts from reported
              private-financing history.
            claimRefs:
