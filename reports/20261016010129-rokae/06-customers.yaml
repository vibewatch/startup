company:
  name: "ROKAE"
chapter:
  number: 6
  title: "Customers"
  summary: "ROKAE shows credible breadth of adoption in manufacturing and robotics-development workflows, with company surfaces and its interim filing consistently pointing to 1,000+ customers or enterprises across 40+ countries and regions. The strongest named production proof in the assigned pool is a Cummins transmission factory using about 30 ROKAE robots, while broader durability evidence remains weaker because the pool does not disclose retention metrics, top-customer concentration, or contract terms."
sections:
  - id: "customer-footprint"
    title: "Customer footprint is broad, but still manufacturing-heavy"
    body: >
      The assigned pool supports a broad but still mostly manufacturing-centered customer picture. Company surfaces consistently frame ROKAE around industrial robots, collaborative robots, and embodied-intelligence products sold into auto parts, electronics, metals, healthcare, commercial service, and adjacent factory workflows, while the interim filing says the installed base has reached more than 1,000 enterprises across more than 40 countries and regions. The same filing shows the commercial footprint is still domestically concentrated in revenue terms: Mainland China accounted for RMB387.6 million of first-half 2026 customer revenue versus RMB27.1 million overseas. That mix matters because the customer story is stronger on deployment breadth than on balanced geographic monetization.
    claimRefs: ["CU001", "CU002", "CU003"]
    tableRefs: ["TU001"]
  - id: "adoption-proof"
    title: "Proof of use is strongest in automotive and high-end manufacturing"
    body: >
      The clearest production-grade proof in the pool comes from IDEC Factory Solutions' inspection report on ROKAE installations in China, which describes about 30 ROKAE robots operating at a Cummins factory across assembly, deburring, spot welding, and inspection, and reports a two-year payback. Official 2026 event coverage broadens that proof set rather than fully replacing it: ROKAE showcased more than ten application solutions at ITES Shenzhen across 3C electronics, automotive, and precision machining, while Auto China coverage described an embodied-robotics turnkey stack positioned to move partners from technical validation toward commercial deployment. Together, those sources support real adoption surfaces, but they do not yet provide a deep roster of named recurring customers by revenue band or contract duration.
    claimRefs: ["CU004", "CU005", "CU006", "CU007", "CU008", "CU009"]
    tableRefs: ["TU002"]
    figureRefs: ["FU001"]
  - id: "durability-and-expansion"
    title: "Expansion signals exist, but retention and concentration proof is still thin"
    body: >
      Expansion evidence exists in three forms. First, the interim filing says certain existing customers repurchased relatively mature solutions in the first half of 2026. Second, the same filing says a number of leading embodied-intelligence technology enterprises adopted or switched to ROKAE humanoid robotic arms for R&D and product iteration. Third, the broader capital-markets narrative includes explicit plans to expand the overseas sales network. Even so, the assigned pool does not disclose NRR, GRR, churn, renewal rates, average contract length, or top-customer revenue share. The result is a customer chapter with decent deployment and channel proof, but incomplete durability and concentration evidence for underwriting recurring revenue quality.
    claimRefs: ["CU010", "CU011", "CU012", "CU013", "CU014"]
    tableRefs: ["TU003"]
