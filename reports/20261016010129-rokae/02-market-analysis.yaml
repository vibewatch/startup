    rows:
      - [Industrial robots, Industrial robot hardware plus installation and maintenance, Generic non-robot factory automation and unrelated machine tools, Manufacturing users visible; payer not disclosed in assigned evidence, Mature installed base and core automation category]
      - [Flexible collaborative robots, Collaborative robot hardware and control stack for close human-robot work, Standalone end-effectors or software-only AI not sold as robots, User workflows visible in assembly and welding; payer not disclosed, Highest-visibility differentiation zone]
      - [Embodied intelligent robots, "Humanoid arms, wheeled dual-arm platforms, compound robots, and related control platforms", Pure research robotics without commercialized product evidence, Embodied-intelligence enterprises visible; exact buyer budgets not disclosed, Fastest current growth vector]
      - [Robotic solutions and ecosystem tooling, "Solutions, software platforms, AI interfaces, development tools, and SDK-enabled deployment", Generic enterprise software outside robotic deployment, Integrators and developers implied; contract owners not disclosed, Important adoption-enablement layer]
      - [Status-quo substitutes, Manual precision work and incumbent robot platforms competing for the same automation job, Broader enterprise digitization spend unrelated to robotic workflows, Existing factory operators and automation teams are the likely comparison set, Defines displacement risk rather than direct product revenue]
    notes: >-
      Boundary rows are evidence-constrained from charter, product, and IR materials; excluded spend and substitute framing are analytical inferences rather than separately quantified market lines.
