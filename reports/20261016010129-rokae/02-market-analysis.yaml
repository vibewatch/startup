      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - [Auto parts, Auto-parts manufacturers and Tier 1 suppliers, Production and automation teams, Not disclosed in assigned evidence, Flexible manufacturing and industrial automation, Not disclosed in assigned evidence, Need for safer and more precise robotic automation]
      - [Electronics / 3C, Electronics manufacturers, Assembly-line and process teams, Not disclosed in assigned evidence, Precision assembly and light-payload automation, Not disclosed in assigned evidence, Higher precision and flexible deployment]
      - [Metal fabrication, Metal-processing manufacturers, Welding and fabrication teams, Not disclosed in assigned evidence, Welding and heavy-duty industrial robot use, Not disclosed in assigned evidence, Productivity and repeatability gains in difficult production areas]
      - [Healthcare, Medical-technology and rehabilitation settings, Clinical and rehabilitation users, Not disclosed in assigned evidence, Compliant human-robot interaction and medical-grade collaborative use, Not disclosed in assigned evidence, Safety and force-control requirements]
      - [Embodied-AI development, Embodied-intelligence technology enterprises and partners, R&D and product-iteration teams, Not disclosed in assigned evidence, Humanoid-arm R&D and embodied-robot product iteration, Not disclosed in assigned evidence, Faster commercialization of embodied-intelligence systems]
    notes: >-
      Sector and workflow evidence is visible; payer and budget-owner fields remain explicit gaps because the assigned pool does not include procurement pages, public budgets, or customer buying-process detail.
    claimRefs: [CM002, CM003, CM006, CM009, CM015]
