      - Confidence
      - Limitation
    rows:
      - [China multi-joint robot market, RobotAIGeek citing Frost & Sullivan, 2024 base, RMB 21.9 billion, 15.7% CAGR to 2029, Independent article summarizes listing-market study, Medium, Single indirect benchmark rather than directly retained Frost report]
      - [China multi-joint robot market, RobotAIGeek citing Frost & Sullivan, 2029 forecast, RMB 45.3 billion, 15.7% CAGR from 2024, Independent article summarizes listing-market study, Medium, Forecast horizon is long and not triangulated by a second retained benchmark]
      - [China collaborative segment growth, RobotAIGeek citing Frost & Sullivan, 2024-2029, Not separately valued in assigned pool, 28.8% CAGR, Independent article summarizes listing-market study, Medium, Growth rate is available but segment revenue base is not retained]
      - [ROKAE flexible collaborative robot position, RobotAIGeek citing Frost & Sullivan, 2024, Not stated as market value, 34% share, Independent article summarizes listing-market study, Medium, Share is sub-segment specific and not a full SAM estimate]
      - [ROKAE monetized embodied-intelligence demand, HKEX interim results, H1 2026, RMB 139 million, 34% of company revenue, Issuer filing reports realized revenue mix, Medium, Company revenue is not a market-size measure]
    notes: >-
      The pool provides broad-category TAM and company-position lenses, but not a clean public bridge to ROKAE-specific SAM/SOM by geography, vertical, and budget owner.
    claimRefs: [CM007, CM010, CM011, CM015]
