company:
  name: "ROKAE"
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    ROKAE's public footprint points to a market defined by industrial robots, flexible collaborative robots,
    embodied-intelligent robots, and related robotic solutions rather than generic enterprise AI or broad
    factory automation. The strongest independent sizing lens in the assigned pool is a Frost & Sullivan-based
    market view cited by RobotAIGeek: China's multi-joint robot market could grow from RMB 21.9 billion in
    2024 to RMB 45.3 billion by 2029, while ROKAE currently claims a strong position in flexible collaborative
    robots but lacks enough public evidence here to isolate a defensible SAM or SOM by buyer budget.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The assigned evidence supports a robotics-market boundary centered on robot hardware, control systems,
      deployment services, and adjacent embodied-intelligence platforms. Across the company's charter, brand
      pages, and investor materials, ROKAE consistently presents three core product families: industrial robots,
      flexible collaborative robots, and embodied intelligent robots, plus robotic solutions and ecosystem tooling.
      That makes the relevant market narrower than generic "AI" and narrower than all factory automation spend:
      the included spend is the robotic body, control stack, integration-ready software, and related deployment
      services used in manufacturing, healthcare, commercial-service, and embodied-AI workflows. The practical
      substitutes are traditional industrial automation, competing collaborative robots, custom robotic solutions,
      and manual workflows in precision assembly or welding rather than general-purpose SaaS budgets.
    claimRefs: [CM001, CM002, CM003, CM004, CM005]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and current monetization
    body: >-
      Public market sizing in the assigned pool is directional rather than decision-grade. The clearest
      independent lens says China's multi-joint robot market could expand from RMB 21.9 billion in 2024 to
      RMB 45.3 billion by 2029, with the collaborative sub-segment growing faster than the broader category.
      That broad lens fits ROKAE's current mix because the company is already monetizing industrial, collaborative,
      and embodied-intelligent robots, and the latest HKEX filing shows embodied robots reaching 34% of first-half
      2026 revenue. What the pool does not provide is a clean bridge from that large category TAM to the narrower
      portion ROKAE can actually serve by geography, industry, and budget owner, so the chapter can frame the
      opportunity but cannot responsibly publish a bottom-up SAM or SOM estimate.
    claimRefs: [CM006, CM007, CM010, CM011, CM015]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyer segments and adoption path
    body: >-
      The visible adoption path starts with industrial users and their integration partners rather than direct
      consumer demand. Company-controlled pages show live focus sectors in auto parts, electronics, metal
      fabrication, healthcare, commercial services, and general industry, while the EU and investor-facing
      materials describe use cases such as flexible manufacturing, precision assembly, welding, and humanoid-arm
      R&D. The company also emphasizes open control platforms, AI interfaces, and SDK documents, which suggests
      a market-access strategy built around developers, system integrators, and ecosystem partners who can shorten
      deployment cycles. Public evidence is weaker on who exactly owns the budget inside each customer account,
      so sector and workflow visibility is stronger than procurement visibility.
    claimRefs: [CM002, CM003, CM005, CM006, CM008, CM009, CM015]
    tableRefs: [TM003]
  - id: drivers-constraints
    title: Growth drivers, constraints, and diligence gaps
    body: >-
      Adoption drivers are visible: manufacturing upgrading, demand for safer human-robot collaboration,
      expanding embodied-intelligence use cases, and an ecosystem model that tries to reduce integration friction.
      The latest filing also shows that ROKAE is already converting those drivers into product revenue instead
      of relying only on custom project work. The main constraints are equally important. Independent commentary
      describes an intensely competitive domestic market, notes that Chinese vendors have taken majority share in
      multi-joint robots, and warns that ROKAE is still loss-making while trying to defend leadership in a
      relatively narrow flexible-collaborative niche. Because the assigned pool lacks buyer-budget documents,
      procurement examples, and a second independent market-sizing benchmark, the most material diligence gap is
      not whether the market exists, but whether the serviceable share and payback path can be bounded tightly
      enough for underwriting.
    claimRefs: [CM007, CM008, CM009, CM010, CM011, CM012, CM013]
callouts:
  - calloutType: insight
    title: Broad category access, narrow underwritable SAM
    body: >-
      The evidence supports a credible right-to-play across industrial, collaborative, and embodied-robot markets,
      but not a defensible public SAM/SOM split by geography, vertical, and budget owner.
    claimRefs: [CM001, CM006, CM010, CM011]
  - calloutType: risk
    title: Share leadership does not remove commercialization risk
    body: >-
      The strongest independent market-position source still pairs ROKAE's 34% flexible-cobot share with a
      warning that the company remains loss-making and must sustain R&D while the segment scales and competition
      intensifies.
    claimRefs: [CM010, CM012, CM013]
