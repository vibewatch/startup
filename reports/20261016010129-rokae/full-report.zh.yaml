      - number: '1.4'
        title: 规模、财务快照与尽调姿态
        blocks:
          - type: paragraph
            body: >-
              公开记录现在提供了有用的带日期规模指标。ROKAE 称服务超过 1,000 家企业，遍及 40 多个国家和地区；其 2026 年 6 月中期文件披露员工 807 人。截至 2026 年 6 月 30
              日的六个月内，收入为 RMB414.7 million，归属于所有者的会计亏损为 RMB79.0 million；收入不是 ARR，会计亏损也不是现金消耗。公司还声称年产能为 50,000 台机器人，并拥有超过
              600
              项专利和技术奖项，但这些数字在本证据池中没有独立核验。关于不利事件的证据并不完整：文件称没有可能造成重大不利影响的重大诉讼，而独立评论指出公司仍在亏损、海外收入组合较弱且业务分部集中。这一组合支持持续监测，但不能据此断言不存在任何事件。
