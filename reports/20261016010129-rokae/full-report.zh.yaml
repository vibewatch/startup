        title: 展示项
        blocks:
          - type: callout
            title: 创始人集中控制，需要明确做继任尽调
            body: Tuo Hua 兼任创始人、最终控股股东、董事长和首席执行官 / 总经理。董事会承认同时担任多职偏离治理守则，因此应直接检验继任安排、授权边界和独立董事的制衡能力。
            calloutType: risk
            claimRefs:
              - CO006
              - CO007
          - type: callout
            title: IPO 提高透明度，但没有补上股权结构表缺口
            body: 上市公司披露现在能锚定收入、亏损、员工数、募资和治理信息，但仍未核对据报道的九轮私募融资、当前完全摊薄持股、老股转让或当前估值。
            calloutType: insight
            claimRefs:
              - CO008
              - CO009
              - CO011
              - CO013
              - CO015
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              指定证据支持将机器人市场边界划在机器人硬件、控制系统、部署服务和相邻具身智能平台周围。在公司章程、品牌页面和投资者材料中，ROKAE
              始终展示三大产品系列：工业机器人、柔性协作机器人和具身智能机器人，另有机器人解决方案及生态工具。相关市场因此比泛化的“AI”更窄，也比全部工厂自动化支出更窄：纳入的支出是机器人本体、控制栈、可集成软件，以及服务于制造、医疗、商业服务和具身
              AI 工作流的相关部署服务。实际替代方案是传统工业自动化、竞争性协作机器人、定制机器人方案，以及精密装配或焊接中的人工流程，而不是通用 SaaS 预算。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM009
      - number: '2.2'
        title: 市场规模视角与当前变现
        blocks:
          - type: paragraph
            body: >-
              指定证据池中的公开市场规模测算更适合作为方向判断，尚不足以直接决策。最清晰的独立口径称，中国多关节机器人市场可能从 2024 年的 RMB 21.9 billion 增长至 2029 年的 RMB 45.3
              billion，协作机器人子市场增速高于整体品类。这个宽口径与 ROKAE 当前组合相符，因为公司已经在变现工业、协作和具身智能机器人，最新港交所文件显示具身机器人占 2026 年上半年收入的
              34%。但证据池没有提供从大类 TAM 到 ROKAE 按地域、行业和预算负责人实际可服务部分的清晰桥接，因此本章可以界定机会，却不能负责任地发布自下而上的 SAM 或 SOM 估算。
            claimRefs:
              - CM006
              - CM007
              - CM010
              - CM011
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM007
              - CM010
              - CM011
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
              - CM007
              - CM010
              - CM011
              - CM014
      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              可见的采用路径从工业用户及其集成伙伴开始，而不是直接面向消费者。公司自有页面显示重点行业包括汽车零部件、电子、金属加工、医疗、商业服务和一般工业；面向欧洲及投资者的材料则描述了柔性制造、精密装配、焊接和人形机械臂研发等用例。公司还强调开放控制平台、AI
              接口和 SDK 文档，说明其市场进入策略锁定开发者、系统集成商和生态伙伴，以缩短部署周期。公开证据对每个客户账户内究竟由谁掌握预算较弱，因此行业和工作流可见度高于采购可见度。
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM006
              - CM008
              - CM009
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM009
              - CM015
      - number: '2.4'
        title: 增长驱动、约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              采用驱动因素清晰可见：制造业升级、对更安全人机协作的需求、具身智能用例扩张，以及试图降低集成摩擦的生态模式。最新文件还显示，ROKAE
              已将这些驱动因素转化为产品收入，而不是只依赖定制项目。约束同样重要。独立评论称国内市场竞争激烈，中国厂商已在多关节机器人中取得多数份额，并提醒 ROKAE
              仍在亏损，同时要在相对狭窄的柔性协作细分市场守住领先地位。由于指定证据池缺少买方预算文件、采购案例和第二个独立市场规模基准，最重要的尽调缺口不是市场是否存在，而是能否把可服务份额和回本路径压缩到足够严谨的范围内，以支持投资判断。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 大类市场可进入，但可纳入投资判断的 SAM 很窄
            body: 证据支持 ROKAE 在工业、协作和具身机器人市场拥有可信的参与资格，但不足以按地域、垂直行业和预算负责人拆出有说服力的公开 SAM / SOM。
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
              - CM010
              - CM011
          - type: callout
            title: 份额领先并不能消除商业化风险
            body: 最强的独立市场地位来源仍将 ROKAE 34% 的柔性协作机器人份额与一项警示放在一起：公司仍在亏损，必须持续投入研发，而细分市场还在扩张、竞争也在加剧。
            calloutType: risk
            claimRefs:
              - CM010
              - CM012
              - CM013
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 买方选择集不只是协作机器人厂商
        blocks:
          - type: paragraph
            body: >-
              买方可以选择 ROKAE、Universal Robots 这样的全球协作机器人平台、FANUC、ABB、KUKA 或 Yaskawa 这样的成熟工业机器人厂商、中国本土供应商、新兴具身 AI
              平台，或由集成商搭建的固定工作站，以满足同一自动化需求。现有证据没有列出或量化所有国内同行，因此应把这份格局看成品类地图，而不是排名表。ROKAE
              覆盖工业、柔性协作和具身智能机器人，能够在一个客户账户内承接多种自动化任务，具有战略价值。但 Universal Robots
              的装机基数和软件生态，以及全球龙头的服务网络，仍是分销和转换成本优势，单靠一支性能合格的机械臂无法抹平。
            claimRefs:
              - CP001
              - CP005
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP005
              - CP007
              - CP008
              - CP009
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP009
              - CP010
              - CP014
              - CP016
      - number: '3.2'
        title: ROKAE 正在扩张差异化硬件栈
        blocks:
          - type: paragraph
            body: >-
              ROKAE 当前证据最扎实的是自身运营规模。截至 2026 年 6 月 30 日的六个月内，发行人披露工业机器人收入 RMB150.030 million、柔性协作机器人收入 RMB104.910
              million、具身智能机器人收入 RMB139.102 million。机器人产品销量从 2025 年同期的超过 4,000 台升至超过 13,000 台。同一文件披露工业机器人同比增长
              69%，柔性协作机器人增长 72%。因此，产品广度和一体化关节力控背后已有商业证据，而不只是原型叙事。但现有来源没有独立拆解、重复精度基准、正常运行时间研究，或与指定竞争对手的同口径测试；ROKAE
              自有披露之外的能力项应保持未知，不能猜测。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP006
              - CP009
              - CP010
              - CP011
      - number: '3.3'
        title: 分销与全生命周期支持比公开标价更重要
        blocks:
          - type: paragraph
            body: >-
              公开定价过于稀疏，无法可靠比较总拥有成本。一家第三方目录估计 Human.X 价格为 US$150,000-US$200,000，但明确称这是该类别的典型区间，而非 ROKAE 报价。现有来源没有披露 ROKAE
              工业和协作产品线或指定同行的标价、实际折扣、合同期限、服务费或集成商经济性。分销证据更具体：ROKAE 称在九个国家设有零部件仓库，并在 13
              个国家和地区拥有服务团队。其注册经营范围还包括安装、维护、软件和租赁。这种广度可以降低买方协调成本，也意味着应用工程、控制、软件、备件和服务都会进入转换决策。多平台采购和留存率尚未披露。
            claimRefs:
              - CP006
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: 硬件护城河可信，但生态优势尚未充分验证
        blocks:
          - type: paragraph
            body: >-
              ROKAE 最有力的护城河假设是掌握力觉关节、运动控制，以及覆盖传统和新兴机器人品类的产品家族。据报道，中国柔性协作机器人子市场 34% 的份额颇有意义，但该数字来自为上市委托开展的 Frost &
              Sullivan 研究，现有证据未保留其方法论。国内厂商从海外龙头手中扩大份额，整体市场竞争也在加剧。ROKAE 还披露，2026 年上半年按 HKFRS 计亏损 RMB79.0 million，但调整后非
              HKFRS 利润为 RMB18.4
              million，这保留了会计业绩与管理层调整后视角之间的区别。国际扩张还会增加认证、渠道、培训、文档和本地服务成本。因此，投资逻辑取决于公司能否在竞争对手把机械臂商品化、并将价值转向软件和集成生态之前，把硬件差异化和销量增长转成可重复部署。
            claimRefs:
              - CP007
              - CP008
              - CP010
              - CP015
              - CP016
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 硬件领先未必能拿下软件层
            body: ROKAE 披露的规模和力控架构确实构成差异化，但国际服务要求和龙头生态可能吞噬买方注意力与利润。投资判断应盯住重复部署、软件附加率和服务经济性，不能假设机械臂能力自然会变成持久的平台权力。
            calloutType: risk
            claimRefs:
              - CP010
              - CP014
              - CP015
              - CP016
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开进展
        blocks:
          - type: paragraph
            body: >-
              面向读者最清晰的财务改善在收入结构：ROKAE 披露 2026 年上半年收入 RMB414.7 million，其中机器人产品销售贡献 RMB394.0 million，占总额
              95.0%；项目型机器人解决方案降至 RMB9.0 million，管理层称这是因为对新项目更加挑剔。在产品收入中，具身智能机器人已贡献 RMB139.1 million，占总收入
              33.5%；这很重要，因为最强的利润率路径似乎来自扩大标准化机器人产品，而不是定制解决方案。公开进展确实存在，但仍不完整：官方来源称客户超过 1,000 家、覆盖 40 多个国家，并有 50,000
              台机器人的年产能，但没有披露实际 ASP、复购节奏或订单储备覆盖，无法判断这些业务有多稳定。
            claimRefs:
              - CI001
              - CI002
              - CI008
