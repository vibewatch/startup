            body: >-
              ROKAE 的公开信任叙事在功能安全和部署便利性上最强。公司反复强调 TÜV 支持的功能安全特性、协作机器人 ISO
              标准、感知与控制冗余、仿真工具和全球服务网络。独立报道也反复提到自研控制栈和力控差异化，部分印证了这些确实是应当尽调的重点。但投资者最希望看到扎实证据的地方仍不完整：文件称 ROKAE 仍计划获得 CE、UL
              等主流认证并加强本地化服务能力，而现有证据池没有直接说明控制器安全架构、软件更新治理、隐私处理，或按型号划分的车队级正常运行时间 /
              保修结果。因此，本章可以核验产品广度和架构方向，却还不能高置信度地判断全球部署质量。
