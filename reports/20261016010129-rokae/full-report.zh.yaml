  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 现有证据将盈利能力、监管国际化和商业化执行列为剩余风险最高的几类。
    data:
      columns:
        - label: 可能性
          detail: 仅基于引用证据的分析师评分。
        - label: 影响
          detail: 风险兑现时对投资判断的严重程度。
        - label: 缓解成熟度
          detail: 当前可见的公开缓解措施具体到什么程度。
        - label: 剩余风险敞口
          detail: 可见缓解措施之后仍未解决的问题。
        - label: 终止标准
          detail: 可衡量的论点失效或风险升级信号。
      rows:
        - label: 盈利能力和资本纪律
          note: 尽管 2026 年上半年势头改善，法定盈利能力仍未得到验证。
          values:
            - label: 高
              tone: high
              note: 2026 年上半年仍有 RMB79.0m 法定亏损。
            - label: 高
              tone: high
              note: 利润率提升仍需吸收研发和规模化成本。
            - label: 中
              tone: medium
              note: IPO 募资和更好的经营现金流争取了时间。
            - label: 高
              tone: high
              note: 现金转换的可持续性和契约余量仍未披露。
            - label: 如果法定亏损扩大，或经营现金流到 2027 年再次转负。
              tone: high
        - label: 跨境合规
          note: 国际扩张明确绑定监管和地缘政治监测。
          values:
            - label: 中
              tone: medium
              note: 海外收入目标越深入，风险敞口越大。
            - label: 高
              tone: high
              note: 制裁、出口管制或市场准入问题可能拖慢增长。
            - label: 低-中
              tone: medium
              note: 可看到监测，但看不到流程细节。
            - label: 高
              tone: high
              note: 现有材料中没有合规资料包或认证矩阵。
            - label: 如果关键出口市场要求 ROKAE 无法证明已取得或持续维持的审批。
              tone: high
        - label: 具身产品商业化
          note: 新产品线对当前增长叙事的重要性明显更高。
          values:
            - label: 高
              tone: high
              note: 增长计划依赖具身机器人和力控模块。
            - label: 高
              tone: high
              note: 试点转化缓慢会挤压利润率和资本需求。
            - label: 中
              tone: medium
              note: 研发预算、产品发布和工具投入可见。
            - label: 高
              tone: high
              note: 没有公开的试点转生产转化或保修数据集。
            - label: 如果具身智能订单到下一个报告期仍未转化为重复生产收入。
              tone: high
        - label: 海外服务和合作伙伴执行
          note: 布局已经存在，但变现证据和冗余仍然不足。
          values:
            - label: 中
              tone: medium
              note: 多个国家已经设有仓库和服务团队。
            - label: 中-高
              tone: high
              note: 现场执行疲弱可能拖慢中国以外的增长，并损害品牌信任。
            - label: 中
              tone: medium
              note: 网络建设已有资金支持，且正在明显推进。
            - label: 中-高
              tone: high
              note: 按国家划分的收入、续约和合作伙伴结构仍未披露。
            - label: 如果海外收入占比未能恢复，而服务投入继续上升。
              tone: high
        - label: 治理权力集中
          note: 公开市场治理机制已经建立，但控制人权力仍然不容忽视。
          values:
            - label: 中
              tone: medium
              note: 上市后，集中的控制结构立即显现。
            - label: 中高
              tone: high
              note: 内部制衡偏弱时，执行出现偏差后纠偏可能更慢。
            - label: 中
              tone: medium
              note: 上市公司治理规范和锁定期安排构成了可见缓冲。
            - label: 中
              tone: medium
              note: 公开证据没有披露委员会运作或投票历史的细节。
            - label: 若关联方约束减弱，或独立监督被证明流于形式。
              tone: high
        - label: 营运资本对交易对手的依赖
          note: 供应链金融和客户信用敞口可能在盈利能力完全成熟前挤压流动性。
          values:
            - label: 中
              tone: medium
              note: 这些敞口在中期申报中有明确披露。
            - label: 高
              tone: high
              note: 回款或融资安排承压，可能迅速收紧流动性。
            - label: 中
              tone: medium
              note: IPO 资金和 H1 现金流改善构成了可见的缓冲。
