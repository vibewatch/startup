              没有重大或有负债，也没有待决或受到威胁的重大诉讼或索赔。这有助于判断近期悬而未决的风险，但不能证明整体合规准备充分。正式法律框架是可见的，因为公司章程明确以中国公司法、证券法和香港上市规则为基础；独立 IPO
