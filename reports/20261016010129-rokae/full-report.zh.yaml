        title: 产品范围与工作流匹配
        blocks:
          - type: paragraph
            body: >-
              现有证据支持把 ROKAE
              看成多产品线机器人平台，而不是单一型号的协作机器人厂商。公司官方和投资者页面始终将产品归为工业机器人、柔性协作机器人、具身智能机器人和相关机器人解决方案；投资者关系资料还称公开产品线已覆盖 50+
              款机器人。其工作流也很具体：协作机器人面向高精度装配、柔顺人机互动、焊接及医疗或康复相关任务；具身产品则面向人形机械臂、轮式双臂和相关物理 AI 开发场景。这种广度对尽调很重要，因为它说明 ROKAE
              试图变现的不只是机器人本体，还有覆盖工业、商业服务、医疗和具身 AI 场景的可部署工作流。
