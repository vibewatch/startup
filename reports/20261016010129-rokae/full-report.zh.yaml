              - CI003
              - CI004
          - type: callout
            title: IPO 现金降低续航压力，但没有降低尽调风险
            body: 新股权显著改善流动性，但公开披露仍不足以完整建模 CAC、实际定价、订单储备或客户留存，因此资本充足性比收入持久性更容易相信。
            calloutType: risk
            claimRefs:
