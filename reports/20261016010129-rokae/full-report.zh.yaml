      - number: '5.2'
        title: 架构与集成界面
        blocks:
          - type: paragraph
            body: >-
              公开架构叙事有三层。硬件层包括工业机器人、xMate 协作机器人、AR 人形力控机械臂和 HSA 力控关节。控制层的 2026 年披露将 xCore 和 iNex 定位为运动与接口底座，并将 ROKAE
              Brain 加上力觉感知算法定位为具身智能“大脑”层。外部集成层最有力的非营销证据是 ROS2 手册：ROKAE 记录了受支持的 xMate 型号、Ubuntu 22.04 上的 ROS2
              Humble、MoveIt 2 与 ros2_control 集成，以及调用厂商 SDK 的硬件插件。这让平台对集成商而言比简单宣传册更具体，但也说明第三方部署仍依赖 ROKAE 控制的
              API、型号支持和文档质量，而不是完全开放的生态。
