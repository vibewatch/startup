          - type: callout
            title: ROKAE 最大的未解风险是流程风险，而不是头条危机风险
            body: 指定证据没有显示当前重大诉讼或已披露的危机事件。更难处理的是安静的风险：合规流程深度、渠道和服务冗余，以及高强度技术投入能否转成可重复的商业结果。
            calloutType: insight
            claimRefs:
              - CR001
              - CR003
              - CR013
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 价格有支撑，但证据仍落后于估值
        blocks:
          - type: paragraph
            body: >-
              当前估值背景是真实存在的，而非假设。独立 IPO 分析称，发行价为每股 H 股 HK\$38.00，发行新股 23,031,900 股，隐含市值约 HK\$9.95 billion；上市后报道则称 2026 年
              7 月上市在大幅超额认购下募得 HK$875.2 million。这一需求水平更可信，因为经营数据也有所改善：2026 年上半年收入达到 RMB414.7 million，毛利率升至
              29.8%，调整后净利润转正，经营现金流在期内转正。即便如此，估值支撑仍是不完整，而非完整。公开来源仍显示 RMB79.0 million
              法定亏损；现有证据池没有经汇率标准化的同行倍数桥接、已有定价的私募估值标记，也没有足够的上市后交易历史，不能仅因簿记强劲就为溢价买入辩护。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV008
              - CV009
              - CV010
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV010
              - CV014
              - CV016
      - number: '8.2'
        title: 融资风险下降，但治理与股权结构表信息仍有限
        blocks:
          - type: paragraph
            body: >-
              上市前相比，近期融资压力已经降低。现有来源显示，公司将 IPO 净募资约 40% 用于研发，另有 30% 用于海外销售网络扩张；上市后 12 个月内，现有股东、ESOP 平台和 IPO
              前投资者均受限于锁定安排。同一份 IPO 分析称，授予 IPO 前投资者的特殊权利已在上市时终止，降低了最明显的优先权悬而未决风险。剩余警惕点是治理集中和历史融资可见度不完整。独立分析仍称创始人 Tuo Hua
              控制约 38.78% 的总投票权；现有来源也没有清晰核对完整的 IPO 前融资桥接：一份独立分析称十轮合计超过 RMB1.4
              billion，而创业公司资料页重复了夸张的定位，却没有公布定价信息或股权结构表及条款，投资者无法据此直接判断稀释纪律。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
      - number: '8.3'
        title: 可以做情景分析，但可比公司纪律仍弱
        blocks:
          - type: paragraph
            body: >-
              情景框架可以建立在现有证据上，但不能得出精确估值区间。乐观情景是订单和出货动能转成具身智能产品的可重复商业化，并依靠 IPO
              资金再投资，让增长和利润率同步向前。悲观情景同样清晰：现有独立证据仍指出持续亏损、研发强度占收入比重下降、技术和客户集中风险，以及法律或出口管制敞口。可比证据是公开记录最弱的一环。独立上市报道把 ROKAE
              放在中国机器人上市潮中，与 Unitree、UBTech 和 X-Variable 并列，但现有来源没有为这些公司提供标准化收入、利润率或现金流基线，因此它们只能作为里程碑参照，而不是干净的估值可比公司。
            claimRefs:
              - CV005
              - CV007
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: 在价格支撑变强前，建议跟踪 / 继续研究
        blocks:
          - type: paragraph
            body: >-
              基于证据加权后的建议不是“避开公司”，而是“不要把当前估值当成已被证明”。按中国机器人行业标准看，ROKAE 已像一家规模化平台企业：服务超过 1,000 家客户，覆盖 40 多个国家和地区，拥有 50,000
              台机器人的年产能工厂，近期需求证据也足以让这套故事在原则上具备投资价值。但公开记录仍无法填平运营动能与买入纪律之间的缺口。在没有标准化可比公司集合、已有定价的私募估值历史、更清晰的股权经济性，以及
              ASP、订单储备转化和上市后盈利能力的更硬证据之前，正确做法是以高风险评级和对价格敏感的态度继续跟踪 /
              研究。更干净的买入逻辑要求公司在更多季度保持经营现金流为正、法定亏损收窄，靠业绩长进进入估值，而不是只靠叙事。
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV009
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 跟踪发行人，不要追逐当前估值
            body: 投资判断的核心是价格是否足够，而不是 ROKAE 是否真实：增长和 IPO 需求已公开，但估值桥接仍未完成。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV016
          - type: callout
            title: 资本现在是助推器，不再是唯一论点
            body: 锁定安排、权利终止和 IPO 募资降低了最明显的近期融资悬而未决风险，因此下一场争论会转向执行质量和披露深度。
            calloutType: insight
            claimRefs:
              - CV007
              - CV008
              - CV009
          - type: callout
            title: 最干净的悲观情景仍有证据支撑
            body: 亏损、可比公司支持不足、商业化风险和创始人控制仍然存在；因此，即便没有剧烈的外部冲击，公开市场估值下修也不需要特别戏剧性的理由。
            calloutType: risk
            claimRefs:
              - CV010
              - CV012
              - CV013
              - CV014
