      - number: '4.2'
        title: 利润率路径与单位经济性可见度
        blocks:
          - type: paragraph
            body: >-
              2026 年上半年文件和后续业绩摘要都指向真实的毛利率改善：毛利升至 RMB123.4 million，报告毛利率达到 29.8%，扣除存货减值前的产品毛利率达到
              31.1%；销量提高降低单位成本，也增强了对供应商的议价能力。公司正从低毛利解决方案交付转向更可重复的产品经济性。需要警惕的是，除毛利率外，几乎所有投资判断变量在公开市场仍不透明：现有来源没有披露机器人实际定价、折扣、CAC、回本周期、漏斗转化、销售周期、流失或订单储备，因此公开记录足以展示经济性改善，却不足以建模成熟的销售效率。
