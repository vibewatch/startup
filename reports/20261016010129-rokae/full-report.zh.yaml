chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、法律架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              ROKAE (Shandong) Robotics Group Inc. 设计、开发、制造并商业化智能机器人及机器人解决方案，覆盖工业、柔性协作和具身智能品类。上市发行人文件将北京的注册成立日期定为 2014 年
              12 月 14 日，而一份独立资料将 2015 年称为成立年份；这更像是法律注册时间与业务起源口径的差异，而非已经解决的事实匹配。公司于 2024 年 12
              月改制为股份制公司，目前注册办公地在山东。与此同时，公司网站将北京列为管理和研发总部，并列出北京、东京、上海和深圳研发中心。这些地点对应不同公司职能，不应合并成一个总部说法。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
      - number: '1.2'
        title: 领导层、控制权与治理
        blocks:
          - type: paragraph
            body: >-
              创始人 Tuo Hua 是最终控股股东，同时担任执行董事、董事长和总经理；中期公告还称其为首席执行官。Tang Shengtian 担任执行董事和首席财务官。这让 ROKAE
              的创始人领导高度集中，可能有利于保持执行一致性，但也加大了对单一人士继任安排和监督的依赖。公司明确披露，同时担任董事长和首席执行官偏离香港《企业管治守则》C.2.1
              条，尽管董事会认为该安排仍能维持权力平衡，并表示会定期评估是否拆分职务。现有领导层表只列出部分人员，因为指定证据没有提供完整履历或完整的高级管理层名单。
            claimRefs:
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
      - number: '1.3'
        title: 资本历史与公开市场转型
        blocks:
          - type: paragraph
            body: >-
              ROKAE 于 2026 年 7 月 9 日在香港交易所开始交易，股票代码为 03752.HK，发售价为 HK$38.00。超额配股权全部行使后，公司披露募得约 HK$1.01 billion 总额及
              HK$937.1 million 净额；这些是融资流入，不是收入，也不代表可不受限制使用的现金。一家小众独立媒体称，公司 IPO 前九轮私募融资合计约 US$210 million，其中包括 2017 年
              US$6 million 的 A 轮以及 2024 年 4 月超过 RMB500 million 的 IPO
              前轮次。指定证据没有用一级交易文件核对这些私募轮次总额，也未找到可支持的当前股权估值。因此，利益相关者图谱将已验证的公开发行事实与据报道的私募融资历史分开。
            claimRefs:
              - CO008
              - CO009
              - CO015
