              近期最重要的风险仍是财务持久性，而不是眼前的法律阴影。2026 年上半年收入、调整后利润和经营现金流大幅改善，但 ROKAE 仍报告 RMB79.0 million
              法定亏损；独立评论称亏损可能延续，毛利率扩张仍需证明能够持续通向盈利。监管和扩张风险紧随其后：管理层称在建设海外服务能力的同时监测跨境贸易法规和地缘政治动态，独立分析则指出国际化会暴露于出口管制和制裁。可见的缓解措施确实存在，但并不完整：IPO
              后资金指定用于研发、市场扩张、营运资金和生产效率，但认证、渠道冗余和流程控制仍是公开证据没有覆盖的重大尽调缺口。
