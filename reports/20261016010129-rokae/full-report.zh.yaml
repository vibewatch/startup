  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据显示，分层技术栈从机器人本体向上延伸至控制器和 AI 层，再连接到外部集成界面；但最深层的证据仍来自公司发布的文档，而非独立的现场性能数据。
    data:
      layers:
        - label: 应用工作流
          detail: 公开营销的作业场景，硬件和软件栈计划在这些场景中创造价值。
          modules:
            - label: 精密装配
              note: Flexible manufacturing and fine industrial work
            - label: 人机安全交互
              note: Compliance-sensitive industrial, medical, and rehab contexts
          outputs:
            - label: Multi-scenario deployments
              note: Industrial, commercial-service, medical, and embodied-AI workflows
        - label: 集成与开发者界面
          detail: 帮助集成商部署或模拟系统的外部工具和界面。
          modules:
            - label: ROS2、MoveIt 2、ros2_control 组合
              note: Real-hardware and simulation integration for supported xMate models
            - label: Rokae Studio + 100+ 生态工具
              note: Offline programming, simulation, and extension tooling
          outputs:
            - label: Faster integration
              note: Public tooling exists, but security and lifecycle governance evidence does not
        - label: 控制与具身智能层
          detail: 专有控制器和 AI 底座，被定位为系统的“大脑”和“小脑”。
          modules:
            - label: xCore / iNex
              note: Motion control, open interfaces, and software ecosystem support
            - label: ROKAE Brain / 力控算法
              note: Multimodal world-model and force-perception layer
          outputs:
            - label: AI-to-motion bridge
              note: Connects AI models with robot hardware through standardized interfaces
        - label: 安全与质量控制
          detail: 围绕力控、冗余和标准对齐公开披露的安全措施。
          modules:
            - label: TÜV 安全功能
              note: Functional-safety and redundancy claims across collaborative and embodied products
            - label: ISO / 可靠性信号
              note: ISO references, MTBF claim, and environmental protection messaging
          outputs:
            - label: Trust narrative
              note: Safety evidence is visible, but certification scope by SKU is still incomplete
        - label: 机器人本体和组件
          detail: 当前销售的商用机器人硬件和力控组件。
          modules:
            - label: 工业机器人 + xMate 协作机器人
              note: Existing industrial and cobot portfolio
            - label: AR 人形机械臂 + HSA 关节
              note: Embodied-intelligence hardware sold as standalone products
          outputs:
            - label: Full-stack product base
              note: Broad surface today; independent uptime and certification proof remains limited
        - label: 服务与推广层
          detail: 全球规模化所需的现场部署支持、本地化和认证。
          modules:
            - label: 全球技术支持
              note: Official service network and localized support expansion
            - label: CE / UL 和区域审批
              note: Certification workstreams cited in the 2026 filing
          outputs:
            - label: International deployment readiness
              note: Expansion is visible, but completion evidence is not yet comprehensive
    approximationNotes: 该技术栈仅保留公开的组件关系；不代表已验证的性能优势、网络安全成熟度，或每一层都处于同一商业化阶段。
    claimRefs:
      - CE004
      - CE007
      - CE008
      - CE009
      - CE010
