      - number: '4.3'
        title: 流动性、资产负债表与融资依赖
        blocks:
          - type: paragraph
            body: >-
              报告期后 ROKAE 的资本状况明显改善，但时点很重要。截至 2026 年 6 月 30 日，公司披露现金及现金等价物 RMB115.9 million、定期存款 RMB138.9
              million，以及按公允价值计入损益的金融资产 RMB132.9 million；但股东亏绌仍为 RMB1,221.7 million，借款为 RMB50.6 million。随后 2026 年 7—8 月香港
              IPO 及超额配售又带来约 HK$937.1 million 净额，计划在 FY2029 前用于研发、海外销售建设、产能、战略投资和营运资金。单看 6
              月资产负债表，短期流动性压力已明显下降；但资本充足性仍取决于管理层能否把新股权转成持续的利润率扩张，而不是只把亏损周期拉长。
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI011
      - number: '4.4'
        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              财务结论方向偏正面，但仅凭公开证据还不足以支持投资判断。产品销售占据 2026 年上半年收入主导，毛利率扩张，经营现金流转正，报告期后的 IPO
              募资也降低了即时融资风险，因此收入质量有所改善。即便如此，独立报道仍将 ROKAE
              描述为亏损、国际渗透不足，并依靠持续研发投入在仍然较小的协作机器人细分市场守住份额。在把近期跃升视为持久的利润率拐点之前，应索取模型层面的 ASP、折扣、订单储备、完整现金流桥接、客户集中度更新以及渠道 /
              销售效率数据；这些信息在现有公开材料中都缺失。
            claimRefs:
              - CI010
              - CI012
              - CI013
      - number: '4.5'
        title: 展示项
        blocks:
          - type: callout
            title: 收入质量改善快于盈利能力
            body: 2026 年上半年最大的变化是结构：标准化机器人产品收入达到总收入的 95%，推动毛利率扩张，但法定盈利尚未追上调整后利润口径。
            calloutType: insight
            claimRefs:
