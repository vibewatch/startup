      - - 基准
        - 收入增长保持强劲，但法定盈利能力仅逐步改善，定价和可比公司披露仍然有限
        - IPO 估值可以作为战略性上市基准，但显然谈不上便宜
        - 若上市后公开证据仍未进一步充实，叙事支撑会减弱
        - 与现有证据最一致
      - - 悲观
        - 若具身智能需求最终证明仍处早期、亏损持续，上市后投资者在缺少更清晰可比公司支持时可能不再支付稀缺性溢价
        - 在改善得到证明前，市场可能要求当前里程碑估值折价
        - 竞争、客户集中、出口管制风险和治理集中度都会削弱信心
        - 结合当前证据，完全存在这种可能
    notes: 现有公开证据足以支撑情景逻辑，但不足以给出精确的数字估值区间；因此，本表讨论当前估值如何靠业绩兑现、或因业绩不足而折价，而不是臆造没有依据的目标价。
    claimRefs:
      - CV002
      - CV003
      - CV004
