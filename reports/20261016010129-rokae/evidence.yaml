    keyQuote: >-
      Risks include: ▲ continued net losses alongside a structural decline in R&D spending as a share of revenue (22.2%
      → 16.7% → 12.6%); ▲ a still-modest 0.9% revenue share among domestic Chinese suppliers in the industrial robot
      segment, reflecting Rokae’s scale disadvantage relative to the broader market; ▲ intensifying multi-front
      competition from global majors Fanuc, ABB, KUKA, and Yaskawa as well as domestic rivals including Estun, Siasun,
      and JAKA; ▲ an embodied-intelligent robotics business still at an early commercialization stage with an unproven
      long-term profitability model; ▲ approximately 90% revenue concentration in manufacturing customers, exposing the
      business to China’s manufacturing capex cycle; and ▲ a governance structure in which founder Tuo Hua controls
      approximately 38.78% of aggregate voting power via employee shareholding platforms, warranting attention to
      minority-shareholder protections.
