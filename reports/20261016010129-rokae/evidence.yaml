evidenceGaps:
  - type: missing-source
    severity: material
    topic: private-funding
    missingEvidence: Primary round documents, a fully diluted post-IPO cap table, secondary-sale history, and a current valuation.
    whyItMatters: >-
      Without reconciled ownership and financing terms, dilution, control, investor incentives, and valuation cannot be
      underwritten precisely.
    diligencePath: >-
      Obtain the prospectus ownership schedules, shareholder register, financing agreements, and current exchange share
      data; reconcile every round and secondary.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: >-
      Complete executive biographies, tenure history, succession coverage, and current ownership for all directors and
      senior managers.
    whyItMatters: >-
      The current evidence establishes role concentration but not the depth, independence, or continuity of the
      management bench.
    diligencePath: >-
      Request the complete board and senior-management roster, biographies, committee mandates, succession plan, and
      key-person retention arrangements.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-signals
    missingEvidence: >-
      Independent court, regulator, sanctions, recall, outage, and product-incident checks across ROKAE's operating
      jurisdictions.
    whyItMatters: >-
      A company statement that no material litigation exists and an empty retained adverse search are not proof that no
      adverse event occurred.
    diligencePath: >-
      Run jurisdiction-specific company and executive-name searches in PRC court, regulator, sanctions, recall, and
      workplace-safety databases.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: Public bottom-up SAM or SOM by geography, vertical, and budget owner for ROKAE's served market.
    whyItMatters: >-
      Without a narrower sizing bridge, valuation work has to rely on broad category TAM and company share claims rather
      than underwritable serviceable demand.
    diligencePath: >-
      Obtain the IPO prospectus market-study pages or comparable independent industry reports, then map the category
      cuts to ROKAE's actual sectors and channel footprint.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-budget-ownership
    missingEvidence: >-
      Customer procurement pages, public budgets, or case studies that identify who signs and funds deployments in each
      target vertical.
    whyItMatters: >-
      Buyer and workflow visibility is not the same as budget authority, and underwriting adoption pace depends on where
      capex or operating budgets actually sit.
    diligencePath: >-
      Pull public procurement records, named customer case studies, or job postings that show plant, operations,
      engineering, or R&D ownership for ROKAE-like deployments.
    relatedQuestionRefs:
      - QM003
