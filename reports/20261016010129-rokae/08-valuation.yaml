company:
  name: ROKAE
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports ROKAE as a real, scaling robotics issuer with a well-supported July
    2026 Hong Kong IPO and sharply improved H1 2026 operating momentum, but it does not yet
    support paying the public valuation with conviction. The cleanest underwriting stance is
    track/research-more: the company has demand, capital, and milestone credibility, yet the
    retained record still lacks a normalized comparable set, priced private valuation history, and
    the unit-economics detail needed to turn a growth story into a confident entry price.
sections:
  - id: price-support-versus-proof
    title: Price support exists, but proof still trails the valuation
    body: >-
      The current valuation context is tangible rather than hypothetical. Independent IPO analysis
      put the offer at HK\$38.00 per H share for 23,031,900 new shares and an implied market
      capitalization of roughly HK\$9.95 billion, while post-debut reporting said the July 2026
      listing raised HK$875.2 million in a heavily oversubscribed transaction. That level of
      demand is easier to respect because the operating print also improved: H1 2026 revenue
      reached RMB414.7 million, gross margin rose to 29.8%, adjusted net profit turned positive,
      and operating cash flow turned positive during the period. Even so, valuation support is
      incomplete rather than complete. Public sources still show a RMB79.0 million statutory loss,
      and the retained pool does not provide an FX-normalized peer multiple bridge, a priced
      private valuation mark, or enough post-listing trading history to defend paying up simply
      because the book was strong.
    claimRefs: [CV001, CV002, CV003, CV004, CV014, CV016]
    tableRefs: [TV002]
    figureRefs: [FV001]
  - id: financing-overhang-and-governance
    title: Financing risk eased, but governance and cap-table visibility remain partial
    body: >-
      Near-term financing pressure is lower than it was pre-listing. Retained sources show that
      the company directed roughly 40% of IPO net proceeds to R&D and another 30% to overseas
      sales-network expansion, while lock-ups kept existing shareholders, ESOP platforms, and
      pre-IPO investors restricted for 12 months after listing. The same retained IPO analysis
      says special rights granted to pre-IPO investors were terminated on listing, which reduces
      the most obvious preference overhang. The remaining caution is governance concentration and
      incomplete historical funding visibility. Independent analysis still describes founder Tuo
      Hua as controlling approximately 38.78% of aggregate voting power, and retained sources do
      not reconcile the full pre-IPO financing bridge cleanly: one independent analysis cites more
      than RMB1.4 billion across ten rounds, while a startup-profile page repeats superlative
      positioning without publishing the priced marks or cap-table terms that would let investors
      judge dilution discipline directly.
    claimRefs: [CV007, CV008, CV009, CV010, CV011, CV012, CV015]
  - id: scenarios-and-comparable-discipline
    title: Scenario framing is possible, but comparable discipline is still weak
    body: >-
      A scenario framework can be grounded in retained evidence, but a precise valuation range
      cannot. The bull case rests on order and shipment momentum converting into repeatable
      commercialization of embodied-intelligence products, with enough IPO-funded reinvestment to
      keep growth and margin moving together. The bear case is equally visible: retained
      independent evidence still flags ongoing losses, declining R&D intensity as a share of
      revenue, technology and customer concentration risk, and legal or export-control exposure.
      Comparable evidence is the weakest part of the public record. Independent listing coverage
      places ROKAE inside a broader Chinese robotics listing wave alongside Unitree, UBTech, and
      X-Variable, but the retained sources do not provide normalized revenue, margin, or cash-flow
      baselines for those names, so they are milestone references rather than clean valuation
      comps.
    claimRefs: [CV005, CV007, CV012, CV013, CV014, CV015]
    tableRefs: [TV003]
  - id: recommendation-and-diligence-triggers
    title: Recommendation is track / research-more until price support deepens
    body: >-
      The evidence-weighted recommendation is not "avoid the company" but "avoid underwriting the
      current valuation as proven." ROKAE already looks like a scaled platform business by Chinese
      robotics standards: it serves over 1,000 customers in more than 40 countries and regions,
      runs a 50,000-robot annual-capacity factory, and has enough recent demand evidence to make
      the story investable in principle. What the public record still cannot do is close the gap
      between operational momentum and entry discipline. Without a normalized comparable set, a
      priced private valuation history, clearer cap-table economics, and harder evidence on ASPs,
      backlog conversion, and post-listing profitability, the right call is track/research-more
      with a high risk rating and a price-sensitive stance. A cleaner buy case would require the
      company to grow into the valuation through additional periods of positive operating cash flow
      and narrower statutory losses rather than through narrative alone.
    claimRefs: [CV003, CV004, CV006, CV014, CV015, CV016]
    tableRefs: [TV001]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Metric
      - Current view
      - Evidence anchor
      - Decision implication
    rows:
      - [Recommendation, "Track / research-more", "Real commercial traction and financing support, but public valuation support remains incomplete", "Do not underwrite the IPO valuation as a buy on retained evidence alone"]
      - [Confidence, Medium, "Recent filings and IPO coverage are directionally consistent, but key underwriting inputs remain undisclosed", "Proceed only with a diligence-led, price-sensitive process"]
      - [Risk rating, High, "Losses persist, governance remains founder-influenced, and embodied-intelligence commercialization is still early", "Require downside protection or stronger post-listing execution proof"]
      - [Valuation stance, "Supported as a milestone listing; not yet supported as a compelling entry price", "Demand, cornerstone support, and proceeds use are visible; comparable and cap-table detail are not", "Favor watchlist status unless the price or evidence base improves"]
    notes: >-
      The table reflects public-evidence sufficiency rather than intrinsic company quality; the
      retained source pool supports a track call but not a defended buy price or target return.
    claimRefs: [CV001, CV002, CV003, CV004, CV008, CV009, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - [Operating proof, "H1 2026 revenue, margin, and cash-flow direction all improved materially", "Statutory losses remain and the improvement has only one recent public reporting window", "Two or more post-listing periods showing sustained operating cash generation and narrower statutory losses"]
      - [Market validation, "The IPO was heavily oversubscribed and cornerstone demand covered 31.4% of the offer", "Strong book-building can signal scarcity and narrative demand more than durable public-market support", "Evidence of stable post-listing trading support and institutional follow-through beyond debut"]
      - [Scale and commercialization, "ROKAE already serves 1,000+ customers in 40+ countries and regions with meaningful factory capacity", "Public evidence does not disclose realized ASPs, repeat rates, or backlog conversion by cohort", "Customer-cohort, backlog, and pricing-realization disclosures that connect scale to durable unit economics"]
      - [Capital structure, "Lock-ups and rights termination reduce immediate overhang risk", "Founder voting control and incomplete private-round valuation history still limit governance and dilution visibility", "Audited cap-table bridge with priced rounds, remaining economic rights, and post-lock-up supply schedule"]
    notes: >-
      These rows are price-sensitive underwriting arguments, not generic company strengths and
      weaknesses; each row is tied to evidence that could move the recommendation if supplemented.
    claimRefs: [CV002, CV003, CV004, CV006, CV008, CV009, CV010, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Embodied-intelligence orders convert into repeat business, mature robot lines keep margins firm, and IPO-funded R&D plus overseas sales expansion compound scale", "The company grows into or above the IPO valuation through faster revenue and margin realization rather than multiple expansion alone", "Execution on commercialization and overseas build-out could still lag spend", "Possible, but needs more than one strong reporting period"]
      - [Base, "Revenue growth remains strong, but statutory profitability improves gradually and disclosure on pricing or comparables stays limited", "The IPO valuation is holdable as a strategic listing benchmark but not obviously cheap", "Narrative support fades if public evidence does not deepen after listing", "Most consistent with retained evidence"]
      - [Bear, "Embodied demand proves early, losses persist, and post-listing investors stop paying a scarcity premium without cleaner comp support", "The market would likely demand a discount to the current milestone valuation until proof improves", "Competition, customer concentration, export-control exposure, and governance concentration weigh on confidence", "Clearly plausible on current evidence"]
    notes: >-
      Retained public evidence supports scenario logic but not a precise numeric valuation range;
      the table therefore frames how the current valuation could be earned or discounted rather
      than inventing unsupported target prices.
    claimRefs: [CV002, CV003, CV004, CV005, CV007, CV012, CV013, CV014, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The decision chain runs from verified operating momentum and IPO demand to a track call
      because valuation support still lags price support.
    data:
      nodes:
        - label: Current financial proof
          value: "RMB414.7m H1 2026 revenue; 29.8% gross margin"
          note: "adjusted net profit and operating cash flow turned positive, but statutory loss remained RMB79.0m"
        - label: Demand signal
          value: "RMB577.3m orders; 5,100+ Q1 shipments"
          note: "including 2,000+ humanoid robots in Q1 2026"
        - label: Public valuation anchor
          value: "HK$38 offer price; ~HK$9.95b implied market cap"
          note: "23,031,900 new H shares in the global offering"
        - label: Capital support
          value: "HK$810.5m net proceeds; 31.4% cornerstone tranche"
          note: "roughly 40% for R&D and 30% for overseas sales-network expansion"
        - label: Main overhangs
          value: "Losses, governance concentration, weak comp set"
          note: "founder control remains high and public comparables are not normalized"
        - label: Decision
          value: "Track / research-more"
          note: "public evidence supports the company, but not yet a defended buy entry price"
    approximationNotes: >-
      The flow preserves authored sequence and source values only; it is a recommendation chain,
      not a quantified conversion funnel or implied valuation model.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV007, CV010, CV014, CV016]
callouts:
  - calloutType: recommendation
    title: Track the issuer, not the current valuation
    body: >-
      The underwriting question is price sufficiency, not whether ROKAE is real: growth and IPO
      demand are public, but the valuation bridge is still incomplete.
    claimRefs: [CV001, CV002, CV003, CV016]
  - calloutType: insight
    title: Capital is now an enabler, not the only thesis
    body: >-
      Lock-ups, rights termination, and IPO proceeds reduce the most obvious near-term financing
      overhang, which means the next debate shifts toward execution quality and disclosure depth.
    claimRefs: [CV007, CV008, CV009]
  - calloutType: risk
    title: The cleanest bear case is still evidence-backed
    body: >-
      Losses, weak comparable support, commercialization risk, and founder control all remain
      live enough that a public-market de-rating would not require a dramatic external shock.
    claimRefs: [CV010, CV012, CV013, CV014]
