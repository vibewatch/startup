company:
  name: Resulticks
chapter:
  number: 1
  title: Company Overview
  summary: Resulticks is a Singapore-registered, Chennai-rooted enterprise MarTech company founded in 2012 by Redickaa Subrammanian and Kulesh Iyengar, focused on AI-powered customer engagement and real-time CDP workflows. Public transaction materials point to roughly US$150M of FY2025 revenue, US$17M of profit after tax, and a pending Diginex acquisition repriced from US$1.5B to US$1.05B in August 2026. The strongest takeaways are real scale, attractive growth, and strategic relevance; the main open issues are deal completion, audited financial visibility, and post-close capitalization.
sections:
- id: identity-product-and-operating-surface
  title: Company Identity and Business Model
  body: 'Resulticks is positioned as an AI-powered real-time customer engagement and marketing automation platform built around customer data unification, decisioning, and multichannel execution. The operating identity described in the prompt is more coherent than many earlier public summaries: the company was founded in 2012 in Chennai, maintains a Singapore-registered parent entity, and also operates a U.S. subsidiary while using Singapore and Chennai as the practical headquarters pair. Its product scope sits squarely inside enterprise MarTech and customer data platform infrastructure rather than consumer software. The company sells to large enterprises that need real-time segmentation, next-best-action, campaign orchestration, and analytics across email, SMS, WhatsApp, push, in-app, web, and social surfaces. Sector emphasis on financial services, retail, telecom, and hospitality fits the platform architecture because these buyers manage large event volumes, consent-heavy communications,
    and cross-channel lifecycle workflows that reward a unified CDP plus orchestration stack.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO007
  - CO042
  tableRefs:
