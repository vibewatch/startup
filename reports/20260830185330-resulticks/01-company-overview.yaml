- id: leadership-entities-and-footprint
  title: Leadership, Footprint, and Organization
  body: 'The leadership picture supplied for this run is centered on co-founder and chief executive Redickaa Subrammanian and co-founder Kulesh Iyengar, who anchors the technology side of the company. That pairing supports a fairly standard late-stage enterprise software operating model: commercial leadership and external narrative are concentrated in the CEO, while platform continuity and architecture credibility sit with the technical co-founder. The company is described as having roughly 500 to 600 employees, with Chennai functioning as the primary engineering hub and Singapore acting as the APAC commercial and product-management center. A U.S. East Coast business-development presence broadens enterprise coverage without changing the company’s Asia-first operating DNA. The overall footprint suggests a business optimized for cost-efficient product development in India, regional enterprise selling out of Singapore, and selective access to North American accounts rather than a fully U.S.-centered
    go-to-market motion.'
