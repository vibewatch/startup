- id: transaction-evolution-and-current-status
  title: Acquisition Process and Strategic Rationale
  body: 'The most important current corporate event is the pending Diginex transaction. Diginex Limited, a Singapore-linked NASDAQ-listed technology company focused on ESG, compliance, and AI-oriented enterprise data, first announced a US$1.5 billion all-share acquisition in April 2026 and then amended the definitive agreement in August 2026 at a reduced US$1.05 billion valuation. The revised structure still leaves Resulticks shareholders with approximately 86% ownership of the combined company, implying that the deal has reverse-acquisition characteristics even though Diginex is the listed acquirer. The strategic narrative is sensible: combine Diginex’s trust, ESG, and data-governance positioning with Resulticks’ customer engagement, CDP, and autonomous campaign capabilities. But the amended terms also highlight friction. Closing remains targeted for October 30, 2026 and still depends on a US$70 million capital raise, regulatory approvals, and shareholder approvals, so the transaction should
    be treated as material but not complete.'
  claimRefs:
  - CO022
  - CO023
