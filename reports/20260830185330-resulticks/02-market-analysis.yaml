  - type: private-evidence-only
    severity: material
    topic: SOM quantification
    missingEvidence: Pipeline, win-rate, ACV, and country/vertical mix data needed to convert broad market growth into a credible Resulticks-specific SOM.
    whyItMatters: Without private commercial data, public TAM/SAM figures say little about Resulticks' practical opportunity or sales efficiency.
    diligencePath: Request pipeline by region/vertical, average deal size, implementation capacity, and historical win/loss reasons.
  - type: private-evidence-only
    severity: important
    topic: deployment economics
    missingEvidence: No direct implementation-time, services-attach, or utilization cohort data were publicly available in fetched sources.
    whyItMatters: Adoption friction and ROI timing are the key category gating factors.
    diligencePath: Request implementation timelines, services margins, time-to-first-value, and cohort utilization benchmarks.
