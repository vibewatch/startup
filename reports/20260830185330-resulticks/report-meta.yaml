  topStrengths:
  - Public transaction materials describe a scaled business at roughly US$150M revenue with positive profitability and strong multi-year growth.
  - The platform sits at the intersection of CDP, omnichannel orchestration, predictive analytics, and agentic AI, which is strategically relevant for regulated enterprise buyers.
  - Resulticks appears differentiated in Asia-first deployment, APAC channel support such as WhatsApp and SMS, and real-time decisioning for high-volume customer journeys.
  - The Diginex process, even after repricing, indicates Resulticks is material enough to anchor a public-market transformation narrative rather than a routine tuck-in acquisition.
  topRisks:
  - The US$1.05B all-share transaction is still pending, requires a US$70M capital raise, and depends on a smaller listed acquirer completing the financing and approval path.
  - The deal was already revised down from US$1.5B, which raises the possibility of further term deterioration or non-close outcomes.
  - Public disclosure remains limited on audited standalone financials, customer concentration, retention, and the exact capitalization of the combined company.
  - Competition from Salesforce, Adobe, Braze, MoEngage, CleverTap, and other engagement vendors can pressure pricing, differentiation, and win rates outside Resulticks’ strongest APAC niches.
  unresolvedGaps:
  - Audited FY2025 statements and a clean bridge between revenue, EBITDA, and profit-after-tax claims.
  - Verified customer concentration, renewal behavior, NRR/GRR, and logo-to-revenue mix by geography and sector.
  - Detailed cap table and final share-count math for the amended Diginex transaction, including dilution from the required financing.
  - Evidence on gross margin, services mix, implementation economics, and the true contribution of usage-based revenue.
  - Independent confirmation of the founder, entity, and headquarters structure across the Singapore, India, and U.S. operating footprint.
disclaimer: Private company; core financial, customer, and valuation conclusions rely on public transaction materials and company-provided positioning rather than a full audited diligence data room.
