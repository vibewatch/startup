  productSummary: Real-time customer data and engagement platform combining CDP, journey orchestration, omnichannel delivery, predictive analytics, and the Genie agentic AI layer.
  customerFocus: Enterprise customers in financial services, retail, telecom, hospitality, and adjacent sectors across Southeast Asia, South Asia, the Middle East, and North America.
  businessModel: Enterprise SaaS with platform subscriptions, usage-based messaging or event charges, and a smaller implementation or services component delivered directly and with SI partners.
  stage: Late-stage private / acquisition pending
  fundingStatus: Resulticks appears largely bootstrap-funded in the public record, with the visible capital event now being the pending Diginex all-share acquisition revised to US$1.05B in August 2026.
