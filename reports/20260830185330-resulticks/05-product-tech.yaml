  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability and architecture evidence
    missingEvidence: No formal public architecture diagram, uptime history, availability SLOs, benchmarked latency pack, or infrastructure-failover materials were found.
    whyItMatters: Technical diligence needs resilience and scaling evidence, not just capability descriptions.
    diligencePath: Request architecture review, incident history, uptime/SLO metrics, message-delivery benchmarks, and DR / failover documentation.
  - type: private-evidence-only
    severity: important
    topic: developer governance and release process
    missingEvidence: No public changelog, API versioning history, sandbox-quality description, or documented support SLA was surfaced from fetched developer materials.
    whyItMatters: Enterprise extensibility depends on stable interfaces and predictable release governance.
    diligencePath: Request API spec package, versioning policy, changelog, sandbox credentials, and developer support SLAs.
