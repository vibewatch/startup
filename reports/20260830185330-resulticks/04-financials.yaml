- id: transaction-disclosed-financial-profile
  title: Customer Segmentation and Contract Economics
  body: The most important financial numbers in the public corpus do not come from audited Resulticks statements; they come from Diginex transaction materials. In April 2026, Diginex said Resulticks delivered roughly US$150 million of CY2025 revenue, US$46 million of EBITDA, and a 32% EBITDA margin. In June 2026, Diginex repeated the same rough revenue and EBITDA frame. In August 2026, the amended agreement still used US$150 million of revenue, but shifted the profitability frame to US$17 million of profit after tax and more than 60% CAGR since the pandemic. Those numbers could all be directionally true, but they do not reconcile themselves. EBITDA, PAT, tax treatment, one-time items, and entity perimeter are all left undescribed. As a result, investors can use the deal materials as a scenario frame, but not yet as a substitute for quality-of-earnings work or audited standalone statements.
  claimRefs:
  - CI006
  - CI007
  - CI008
  - CI009
  - CI023
  - CI024
  - CI031
