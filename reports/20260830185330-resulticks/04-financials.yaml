chapter:
  number: 4
  title: Financials
  summary: Resulticks appears to monetize as an enterprise SaaS platform with subscription fees, usage-based message or event economics, and a smaller services layer tied to implementation. The public financial story is attractive on growth and profitability, but close underwriting still depends on confirming revenue mix, contract quality, margin durability, and the financing conditions embedded in the pending Diginex transaction.
sections:
- id: public-revenue-model-and-price-surface
  title: SaaS Revenue Model
  body: 'Resulticks clearly looks like an enterprise software business, but its public revenue surface is thin and uneven. The official and customer pages show a platform sold into large enterprises with multi-brand and multichannel complexity, which strongly suggests high-ACV commercial relationships. GetApp exposes at least one visible starting price of US$24,000 per year, while Marketing Star publishes much lower self-serve pricing tiers for a lighter product in the broader family. That contrast is useful: it suggests Resulticks is not monetized through one uniform price sheet but through a portfolio spanning enterprise platform sales, lighter SMB packaging, and likely usage-linked expansion through channels and modules. The partner program adds another economic layer because it implies reseller, consulting, and implementation motions matter in deal execution. That usually means some portion of enterprise value is tied to delivery capacity, ecosystem reach, and enablement execution, not
    just raw software usage. What remains missing is the standard SaaS transparency package: contract shapes, average deal size, services mix, deferred revenue, and actual customer expansion behavior. Those omissions are material for any serious software underwriting.'
  claimRefs:
  - CI001
  - CI002
  - CI003
