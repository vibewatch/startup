figures:
- id: FU001
  title: Customer Journey Map
  type: journey-map
  layout: wide
  summary: The typical Resulticks customer path moves from fragmented data and channels into profile unification, orchestration, production activation, and then potential multi-brand or multi-channel expansion.
  data:
    nodes:
    - id: j1
      label: 1. Fragmented customer data and channel pain
      detail: Customer starts with siloed records, disconnected channels, and weak attribution.
    - id: j2
      label: 2. Enterprise evaluation across marketing, data, and service teams
      detail: Buying group aligns on data, compliance, and engagement requirements.
    - id: j3
      label: 3. Profile unification and segmentation go live
      detail: Resulticks centralizes records and enables faster cohorts and targeting.
    - id: j4
      label: 4. Multichannel journeys and measurement activate
      detail: Teams launch cross-channel journeys and observe ROI/response data.
    - id: j5
      label: 5. Expansion to more brands, channels, or journeys
      detail: Large customers add brands, use cases, and messaging surfaces over time.
  approximationNotes: This is a synthesized customer journey based on public testimonials rather than a vendor-published lifecycle model.
  claimRefs:
  - CU016
  - CU017
  - CU018
  - CU021
  - CU027
  - CU034
- id: FU002
  title: Adoption / Deployment Funnel
  type: funnel
  layout: standard
  summary: Enterprise adoption narrows from general platform fit into implementation, live multichannel operation, and then expansion into additional brands or journeys.
  data:
    items:
    - label: Target enterprise problem identified
      value: 100
      unit: index
      note: Data fragmentation and omnichannel pain are common starting points.
    - label: Multi-stakeholder evaluation
      value: 75
      unit: index
      note: Marketing, data, service, and compliance teams assess fit.
    - label: Implementation with partner / support motion
      value: 52
      unit: index
      note: Deployment usually requires integration and enablement.
    - label: Production multichannel usage
      value: 35
      unit: index
      note: Named references show live use across sectors.
    - label: Expansion to more brands or channels
      value: 22
      unit: index
      note: Biggest upside appears in complex multi-brand accounts.
  approximationNotes: Indexed stage weights are qualitative gating weights, not literal conversion rates.
  claimRefs:
