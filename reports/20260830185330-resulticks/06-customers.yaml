chapter:
  number: 6
  title: Customers
  summary: Resulticks appears to sell into large enterprises across financial services, retail, telecom, hospitality, and adjacent data-rich verticals, with customer proof strongest in APAC and neighboring growth markets. The public signal is positive on production relevance and expansion potential, but transparent evidence on retention, concentration, and logo-to-revenue conversion remains thinner than the company’s overall growth narrative.
sections:
- id: customer-segments-and-evidence-base
  title: Customer Segments and Vertical Focus
  body: 'Resulticks'' public customer record is much stronger on named enterprise references than on marketplace review depth. The official customer page and the HDFC press release make clear that the company is not selling primarily into small or undifferentiated accounts. Instead, the visible footprint sits in sectors where data volume, journey complexity, and customer-value density are all high: banking, healthcare, mutual funds, retail fashion, conglomerate brand portfolios, and super-app ecosystems. That pattern fits the broader corporate narrative from Diginex, which frames Resulticks as an enterprise-scale engagement platform serving customers across several continents. The evidence base is therefore real but asymmetric. We have concrete names and substantive use-case narratives, but we do not have a public customer-count roll-forward, retention cohort, or revenue-by-customer disclosure. Investors can underwrite the existence of sophisticated logos; they cannot yet underwrite concentration
    or durability with the same precision.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU012
  - CU014
  - CU015
  - CU028
  - CU029
  - CU035
  tableRefs:
  - TU001
  - TU002
  figureRefs:
  - FU001
- id: named-deployments-and-production-outcomes
  title: Named Deployments and Workflow Outcomes
  body: 'The strongest chapter evidence comes from named customer deployments that describe real workflows instead of general praise. HDFC remains the single most useful reference because it quantifies scale, process improvement, and outcome orientation: more than 60 million profiles, 1,500-plus attributes, segmentation in minutes rather than a day, and clearer response and ROI visibility. But the story is not limited to HDFC. Medanta uses the platform in patient journeys, RP Sanjiv Goenka Group cites twelve brands and WhatsApp conversations, UTI points to five-plus channels and four million records, Tata Digital positions Resulticks in the Tata Neu super-app journey, and Aditya Birla Fashion and Retail uses the platform across more than fifteen brands. These proofs matter because they show Resulticks inside production-grade, multi-brand, multi-channel operating contexts. That is better evidence than a generic product listing or anonymous star rating would provide. It also suggests the vendor
    is strongest where deployment complexity itself becomes part of the moat.'
  claimRefs:
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
  - CU016
  - CU021
