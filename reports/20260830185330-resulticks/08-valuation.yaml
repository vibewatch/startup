- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue denominator breaks
    - Audited FY2025 revenue lands materially below the US$150M claim
    - Premium multiple logic collapses first.
    - Reset to bear/base range and re-underwrite from scratch.
  - - Close certainty deteriorates
    - Funding weakens, approvals stall, or economics are amended again
    - Current price reference loses signaling value.
    - Increase required return or step away.
  - - Quality-of-revenue disappoints
    - Retention, gross margin, or services mix looks much weaker than implied
    - Premium-software thesis weakens even if top-line is real.
    - Re-rate to ordinary SaaS or services-like multiple band.
  - - Capital structure worsens
    - Dilution, preference, or control mechanics are harsher than expected
    - Common-equity upside compresses sharply.
    - Require structural protections or lower entry price.
  - - Customer concentration surprises
    - A few accounts or partners drive too much revenue
    - Downside risk rises while the quality narrative weakens.
    - Haircut fair value and tighten diligence.
  notes: These triggers translate the chapter from narrative judgment into explicit underwriting tripwires.
