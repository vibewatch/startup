company:
  name: Resulticks
chapter:
  number: 8
  title: Valuation
  summary: The revised US$1.05 billion Diginex transaction implies a plausible but not obviously cheap valuation for a company described at roughly US$150M ARR with strong growth and positive profitability. The valuation can work if the revenue and margin story holds and the deal closes on current terms, but the all-share structure, reverse-acquisition dynamics, and limited audited disclosure argue for a conditional rather than aggressive stance.
sections:
- id: pricing-context-and-recommendation
  title: Capital History and Current Transaction Context
  body: 'Resulticks has a public price reference, but not yet a cleanly underwritable one. The headline has already moved from a US$2.0 billion MOU to a US$1.5 billion definitive deal and then to a US$1.05 billion amended agreement within roughly fourteen months. That alone is not fatal; repricing happens. But the direction matters because it tells investors that price discovery weakened as diligence, financing, and completion mechanics became more concrete. The August frame still leaves a premium-looking transaction: if the stated US$150 million revenue base is accurate, the deal implies about 7.0x revenue. That is below the April 10.0x frame and below the original 13.3x MOU implication, yet still above broad public and average M&A medians. The disciplined public-information stance is therefore wait or reprice, not chase the headline.'
  claimRefs:
  - CV001
  - CV005
  - CV006
  - CV007
  - CV008
