- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable / reference
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Public SaaS median (SaaS Capital)
    - Equal-weighted public ARR multiple
    - ~3.8x (31 Jul 2026)
    - Baseline for broad software market clearing levels.
    - Public median understates control premiums and exceptional AI narratives.
  - - Public growth-band median
    - 20-30% trailing growth band
    - ~5.5x median
    - Useful if Resulticks is growing but not clearly in elite territory.
    - Requires verified growth and a comparable public-quality disclosure set.
  - - Disclosed SaaS transactions
    - Comparable-transaction anchors
    - ~4.0x-4.5x medians; 8.1x+ top quartile
    - Shows where real deal clearing prices often land.
    - Disclosed samples skew to larger, cleaner deals and still may not match Resulticks.
  - - AI-native SaaS private range
    - Private-market guide
    - ~7x-12x for 20-50% growth; 10x-20x for >50% growth
    - Supports the possibility of a premium band.
    - Requires genuine AI differentiation and verified growth quality.
  - - AI-native MarTech M&A median
    - 2026 YTD MarTech M&A reference
    - ~8.0x EV/revenue
    - Most directly supportive precedent for a premium MarTech asset.
    - Category medians still do not prove this specific asset deserves the premium.
  - - Resulticks amended reference
    - Signed August 2026 deal
    - US$1.05B / ~7.0x on stated US$150M revenue
    - Current live price reference.
    - All-share, conditional, and highly sensitive to denominator accuracy.
  notes: The table is exhaustive for the valuation references materially used in this chapter, ordered from broad market baseline to asset-specific reference.
