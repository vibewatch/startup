- id: thesis-antithesis-and-quality-of-proof
  title: Acquisition Terms and Structure
  body: The bull case is easy to understand. Resulticks has real product surfaces, visible enterprise customers, omnichannel and CDP positioning, and a strategic story that fits an AI-and-data engagement thesis. Public reviews and pricing pages also support the idea that this is functioning software sold into meaningful customer workflows, not just a corporate shell. In a market that still pays up for AI-native software and strategic control assets, a premium band is not inherently absurd. The anti-thesis is that investable price proof is much thinner than product proof. The denominator is disputed, audited financials are missing, retention and margin are unpublished, and the acquirer route itself adds capital-markets risk. As a result, the valuation debate is really a confidence debate.
  claimRefs:
