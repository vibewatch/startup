- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Audited FY2025 financials
    - Standalone revenue, EBITDA, PAT, and cash-flow statements
    - Needed to settle the core denominator and quality-of-earnings debate.
    - Management / external auditor
  - - Profitability bridge
    - Reconciliation between April EBITDA and August PAT framing
    - Needed to understand margin quality and one-off items.
    - Finance team / QoE provider
  - - Retention and concentration
    - GRR, NRR, cohort behavior, top-customer share, partner-sourced revenue
    - Needed to judge recurring-revenue durability and downside concentration.
    - Revenue operations / CFO
  - - Gross margin and services mix
    - Software vs services vs message-delivery cost structure
    - Needed to place the company in the right multiple band.
    - Finance / FP&A
  - - Post-close capitalization model
    - Share count, dilution, financing sources, control rights, and approval dependencies
    - Needed to convert headline EV into actual investor economics.
    - Legal / corporate finance
  notes: These asks are the minimum package required to turn the public story into an investable or rejectable underwriting file.
