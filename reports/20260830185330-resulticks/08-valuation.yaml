  claims:
  - id: CV001
    statement: The public Resulticks transaction reference moved from a US$2.0 billion 2025 MOU to a US$1.5 billion April 2026 definitive agreement and then to a US$1.05 billion August 2026 amended agreement.
    type: third-party-reported
    topic: valuation chronology
    sourceRefs:
    - SV007
    - SV001
    - SV003
    confidence: high
    freshness: recent
    answersQuestionRefs:
    - QV001
  - id: CV002
    statement: Diginex' April 2026 materials framed Resulticks at roughly US$150 million of CY2025 revenue, roughly US$46 million of EBITDA, and a 32% EBITDA margin.
    type: third-party-reported
    topic: operating inputs
    sourceRefs:
    - SV001
    - SV008
    - SV014
    confidence: high
    freshness: recent
    answersQuestionRefs:
    - QV002
  - id: CV003
    statement: The June 2026 update reiterated approximately US$150 million in annual revenue and US$46-50 million in EBITDA.
    type: third-party-reported
    topic: operating inputs
    sourceRefs:
    - SV002
    - SV014
    confidence: high
    freshness: recent
    answersQuestionRefs:
    - QV003
  - id: CV004
    statement: The August 2026 amended agreement instead used US$150 million of FY2025 revenue, US$17 million of profit after tax, and CAGR above 60% since the pandemic.
    type: third-party-reported
    topic: operating inputs
    sourceRefs:
    - SV003
    - SV004
    - SV011
    confidence: high
    freshness: recent
    answersQuestionRefs:
    - QV004
  - id: CV005
    statement: At US$1.05 billion on US$150 million of revenue, the headline implied revenue multiple is about 7.0x.
    type: inferred
    topic: valuation math
    sourceRefs:
    - SV003
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV005
  - id: CV006
    statement: At US$1.5 billion on US$150 million of revenue, the April implied revenue multiple is about 10.0x.
    type: inferred
    topic: valuation math
    sourceRefs:
    - SV001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV006
  - id: CV007
    statement: Using the same US$150 million revenue denominator, the earlier US$2.0 billion MOU implies roughly 13.3x revenue.
    type: inferred
    topic: valuation math
    sourceRefs:
    - SV007
    - SV001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV007
  - id: CV008
    statement: The August repricing therefore compressed the implied multiple by roughly 30% from the April frame and by almost half from the original MOU frame.
    type: inferred
    topic: repricing signal
    sourceRefs:
    - SV007
    - SV001
    - SV003
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QV008
  - id: CV009
    statement: SaaS Valuation Multiple's July/August 2026 public benchmark puts the equal-weighted public SaaS median around 3.8x ARR and the BVP Nasdaq Emerging Cloud average around 8.4x.
    type: third-party-reported
    topic: public comp context
    sourceRefs:
    - SV016
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV009
  - id: CV010
    statement: That same source shows median multiples of about 5.5x for 20-30% trailing growth, 3.1x for 10-20% growth, and 1.9x for under-10% growth.
    type: third-party-reported
    topic: growth-band context
    sourceRefs:
    - SV016
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV010
  - id: CV011
    statement: SaaS Valuation Multiple also argues that private valuations typically trade at a 20-35% discount to public comparables because of illiquidity and delayed mark resets.
    type: third-party-reported
    topic: private-market context
    sourceRefs:
    - SV016
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV011
  - id: CV012
    statement: Acquiry's 2025-2026 private-market ranges place AI-native SaaS with >50% ARR growth at 10x-20x ARR and AI-native SaaS with 20-50% ARR growth at 7x-12x ARR.
    type: third-party-reported
    topic: private-market context
    sourceRefs:
    - SV018
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV012
  - id: CV013
    statement: Acquiry places traditional SaaS at about 5x-8x ARR for >30% growth, 3x-5x for 15-30% growth, 1.5x-3x for <15% growth, and 4x-8x for niche vertical SaaS leaders.
    type: third-party-reported
    topic: private-market context
    sourceRefs:
    - SV018
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV013
  - id: CV014
    statement: Windsor Drake presents ARR-revenue multiples as 3x-5x typical and 5x-8x+ premium for growth-stage SaaS M&A, with disclosed comparable-transaction anchors around 4.0x-4.5x medians and 8.1x+ top quartile.
    type: third-party-reported
    topic: transaction context
    sourceRefs:
    - SV017
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV014
  - id: CV015
    statement: SaaSRise frames AI-native MarTech M&A at roughly 8.0x EV/revenue in 2026 YTD versus an overall SaaS M&A median near 4.1x, with CDP around 4.5x and marketing automation around 4.2x.
    type: third-party-reported
    topic: martech comp context
    sourceRefs:
    - SV019
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV015
  - id: CV016
    statement: Resulticks' August 7.0x headline therefore screens rich relative to broad public and average M&A medians, but not obviously impossible for a premium AI-native strategic asset.
    type: inferred
    topic: valuation stance
    sourceRefs:
    - SV016
    - SV017
    - SV019
    - SV003
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QV016
  - id: CV017
    statement: The central question is not whether 7x can exist in 2026; it is whether the public evidence is strong enough to prove Resulticks deserves that premium band.
