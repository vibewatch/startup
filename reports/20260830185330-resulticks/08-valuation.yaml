tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Public evidence
  - Decision implication
  rows:
  - - Recommendation
    - Wait / reprice
    - Company quality is plausible, but valuation proof is incomplete and the deal structure is conditional.
    - Do not treat the signed headline as clean fair value without private diligence.
  - - Confidence
    - Medium
    - Chronology and headline metrics are visible; denominator quality and capital structure are not fully proven.
    - Use as a screening verdict, not a final IC approval.
  - - Risk rating
    - Elevated
    - Revenue denominator disputes and acquirer fragility create asymmetric downside.
    - Require a larger margin of safety and stronger diligence pack.
  - - Valuation stance
    - Roughly US$0.75B-US$1.05B defendable today
    - Base-case math supports this zone if US$150M revenue is real; upside above it needs premium-quality proof.
    - Avoid paying materially above the current amended reference on public evidence alone.
  notes: The recommendation is intentionally conservative because the public record is much stronger on narrative and chronology than on audited economics.
