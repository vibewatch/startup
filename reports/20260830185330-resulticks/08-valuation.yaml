- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What supports it
  - What would change the view
  rows:
  - - Bull thesis
    - Real product, enterprise customers, omnichannel/CDP positioning, and a strategic AI narrative.
    - Audited revenue quality, retention, and margin that validate premium-software status.
  - - Anti-thesis
    - Revenue denominator is disputed, unit economics are opaque, and the acquirer route adds capital-market risk.
    - A clean QoE pack, capitalization model, and confirmed close financing would reduce this concern.
  - - Why the gap matters
    - A premium multiple can be justified only if the company is truly a premium asset, not merely a strategic story.
    - Proof that actual performance resembles the official narrative rather than third-party low-end estimates.
  - - Practical stance
    - Engage, but only with price discipline and explicit downside protections.
    - Stronger private evidence or a lower effective entry price.
  notes: The thesis split is not about whether Resulticks exists; it is about what confidence level the public record deserves.
