evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding and headquarters normalization
    missingEvidence: >-
      A management-approved legal-entity timeline reconciling 2004 roots, 2012 profile dates, 2014 platform launch, and
      current headquarters language.
    whyItMatters: These items anchor identity, stage, and jurisdictional risk across the whole report.
    diligencePath: >-
      Request the current corporate-structure chart, incorporation history, and a one-page headquarters /
      management-location memo.
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: revenue and scale metrics
    missingEvidence: Audited FY2025 revenue, EBITDA / PAT bridge, official headcount, and a normalized active-customer definition.
    whyItMatters: Public valuation, quality of earnings, and customer-scale interpretation all depend on these numbers.
    diligencePath: >-
      Obtain audited FY2025 statements, management accounts, HR headcount by entity, and the methodology behind
      brand/customer claims.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: board control and cap table
    missingEvidence: Full board roster, shareholder percentages, lender consent package, and post-close ownership waterfall.
    whyItMatters: Governance and dilution are central to underwriting a pending change-of-control transaction.
    diligencePath: >-
      Request the cap table, SPA summary schedule, lender-consent list, and board / committee composition before and
      after close.
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: SOM quantification
    missingEvidence: >-
      Pipeline, win-rate, ACV, and country/vertical mix data needed to convert broad market growth into a credible
      Resulticks-specific SOM.
    whyItMatters: >-
      Without private commercial data, public TAM/SAM figures say little about Resulticks' practical opportunity or
      sales efficiency.
    diligencePath: Request pipeline by region/vertical, average deal size, implementation capacity, and historical win/loss reasons.
  - type: private-evidence-only
    severity: important
    topic: deployment economics
    missingEvidence: >-
      No direct implementation-time, services-attach, or utilization cohort data were publicly available in fetched
      sources.
    whyItMatters: Adoption friction and ROI timing are the key category gating factors.
    diligencePath: Request implementation timelines, services margins, time-to-first-value, and cohort utilization benchmarks.
  - type: private-evidence-only
    severity: material
    topic: competitive win-loss evidence
    missingEvidence: >-
      No public win-rate, displacement, or head-to-head evaluation dataset against Salesforce, Adobe, Braze, MoEngage,
      or CleverTap was found.
    whyItMatters: A nuanced market position matters only if it converts into repeatable win rates.
    diligencePath: >-
      Request win/loss analysis, segment-level pipeline data, and customer reasons for selecting or rejecting
      Resulticks.
  - type: private-evidence-only
    severity: important
    topic: pricing and implementation comparability
    missingEvidence: >-
      Fetched public sources do not provide apples-to-apples pricing, services burden, time-to-live, or support-cost
      comparisons across peers.
    whyItMatters: Ease of deployment and total cost are likely decisive in competitive deals.
    diligencePath: Request implementation timelines, services attach, ACV by segment, and competitor battlecards.
  - type: private-evidence-only
    severity: material
    topic: audited financial statements
    missingEvidence: No audited standalone or consolidated Resulticks financial statements were found in the public corpus.
    whyItMatters: Headline revenue, EBITDA, and PAT claims cannot be treated as established fact without audited support whatsoever.
    diligencePath: Request audited FY2025 financial statements, QoE bridge, and entity-perimeter reconciliation.
  - type: private-evidence-only
    severity: material
    topic: software-quality metrics
    missingEvidence: No public CAC, payback, gross margin, NRR, deferred revenue, or cohort economics were found.
    whyItMatters: >-
      These metrics determine whether revenue scale is valuable recurring software revenue or lower-quality mixed
      revenue.
    diligencePath: Request SaaS KPI pack, revenue-by-stream, cohort retention, and gross-margin breakdown.
  - type: private-evidence-only
    severity: material
    topic: reliability and architecture evidence
    missingEvidence: >-
      No formal public architecture diagram, uptime history, availability SLOs, benchmarked latency pack, or
      infrastructure-failover materials were found.
    whyItMatters: Technical diligence needs resilience and scaling evidence, not just capability descriptions.
    diligencePath: >-
      Request architecture review, incident history, uptime/SLO metrics, message-delivery benchmarks, and DR / failover
      documentation.
  - type: private-evidence-only
    severity: important
    topic: developer governance and release process
    missingEvidence: >-
      No public changelog, API versioning history, sandbox-quality description, or documented support SLA was surfaced
      from fetched developer materials.
    whyItMatters: Enterprise extensibility depends on stable interfaces and predictable release governance.
    diligencePath: Request API spec package, versioning policy, changelog, sandbox credentials, and developer support SLAs.
  - type: private-evidence-only
    severity: material
    topic: retention and concentration metrics
    missingEvidence: No public GRR, NRR, logo churn, ARR by customer, or top-customer concentration schedule was found.
    whyItMatters: Customer quality cannot be fully underwritten without durability and concentration metrics.
    diligencePath: Request top-20 customer list, ARR concentration, GRR/NRR by cohort, and renewal history by vertical.
  - type: private-evidence-only
    severity: important
    topic: independent satisfaction depth
    missingEvidence: Marketplace review evidence is fragmented and thin relative to named vendor-hosted testimonials.
    whyItMatters: Reference quality is positive but partially company-mediated.
    diligencePath: Run independent reference calls and request internal NPS/CSAT, case-study pipeline, and lost-customer analyses.
