company:
  name: Resulticks
chapter:
  number: 7
  title: Risks
  summary: Resulticks’ main risks are concentrated in deal completion, competitive pressure, privacy and regulatory execution, and dependence on a founder-led organization entering a complex public-company combination. The mitigation case is real, but the unresolved funding condition, repeated deal repricing, and limited audited private-company disclosure keep the overall risk rating elevated.
sections:
- id: regulatory-privacy-and-cross-border-risk
  title: Deal Completion Risks
  body: 'Resulticks'' product and data posture creates a genuine compliance surface. The platform markets omnichannel engagement across messaging, personalization, and customer-data workflows, which means customer deployments inevitably touch consent, identity, behavioral data, and cross-channel orchestration. Resulticks does have visible mitigants: a public privacy policy, a TRUSTe seal, and an active Data Privacy Framework participant record for Resulticks Solution Inc. Those are meaningful signals because they show at least some formal privacy posture beyond marketing copy. But they do not close the diligence loop. The public record still does not show how consent logic, cross-border transfers, residency controls, or AI-adjacent disclosures are configured market by market. For an APAC-focused platform selling into regulated enterprises, that gap keeps privacy and compliance near the top of the risk stack.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR021
  - CR027
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: deal-close-liquidity-and-capital-markets-risk
  title: Competitive and Market Risks
  body: 'The most urgent public risk is no longer whether Resulticks has a product, but whether the Diginex transaction closes cleanly and leaves the combined company on stable footing. The amended agreement still pointed to an October 2026 target close, while earlier updates highlighted funding commitments and long-stop-date management. Diginex'' own filings make the financing question more serious: its 20-F showed limited cash, operating losses, working-capital strain, and Nasdaq bid-price stress. Combined with an all-share structure and heavy dilution, that means the core risk is not merely valuation volatility. It is execution fragility around funding, approvals, and post-close governance. Even if Resulticks is strategically attractive, the public market shell and financing mechanics can still damage value realization.'
  claimRefs:
  - CR008
  - CR009
  - CR010
  - CR011
  - CR012
  - CR020
