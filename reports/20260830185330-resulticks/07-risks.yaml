- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Deal-close failure or slippage
    - Further extension, amended economics, or broken financing commitment
    - October 2026 target close slips materially or funding terms weaken
    - Re-cut valuation, raise required return, or step away entirely
  - - Privacy or consent control weakness
    - Formal regulator inquiry, customer complaint pattern, or major remediation project
    - Any confirmed compliance failure in a key operating geography
    - Escalate legal diligence and haircut retention / expansion assumptions
  - - Operational quality deterioration
    - Rising implementation complaints, outage evidence, or security incident disclosure
    - Persistent negative evidence without offsetting KPI transparency
    - Increase churn and cost assumptions; reduce conviction
  - - Customer concentration surprise
    - Private diligence reveals top-account or partner dependency far above expectation
    - Top-customer or channel exposure meaningfully exceeds underwritten tolerance
    - Reprice or require downside protections
  - - KPI opacity persists
    - Management cannot provide audited revenue, retention, margin, and incident data
    - Material diligence packet gaps remain near decision time
    - Move stance to avoid or research-more rather than invest
  notes: Kill criteria are deliberately concrete so the chapter can feed directly into IC decision-making.
