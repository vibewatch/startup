  - - Cross-border transfer and residency governance
    - Singapore/APAC operations plus U.S.-linked framework participation
    - Structured but only partially evidenced publicly
    - Medium
    - High
    - TRUSTe seal and active Data Privacy Framework record
    - Medium-High — framework participation is not proof of deployment-level correctness
    - Review transfer maps, SCC modules, residency controls, and customer contract language
  - - AI/privacy rule tightening
    - 2026 privacy, cyber, and AI-adjacent compliance environment
    - External standards becoming stricter
    - Medium
    - High
    - Legal monitoring and existing privacy framework surfaces
    - Medium-High — public record does not show market-by-market AI disclosure practice
    - Review AI feature inventory, disclosure UX, model governance, and regulator-readiness memos
  - - Entity and contractual perimeter ambiguity
    - Singapore entity, U.S. references, and cross-market enterprise contracting
    - Visible but incomplete
    - Medium
    - Moderate
    - Registry proof and official contact surfaces
    - Medium — public entity proof does not explain liability allocation across the group
    - Obtain entity chart, contracting entities by region, and DPA / MSA templates
