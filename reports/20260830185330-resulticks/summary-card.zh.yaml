  topStrengths:
    - 公开交易材料显示，公司收入约 US$150M，已经规模化并实现正利润，多年增长也强劲。
    - 平台卡在 CDP、全渠道编排、预测分析和智能体 AI 的交叉点，对受监管企业买家具备战略相关性。
    - Resulticks 的差异化体现在亚洲优先部署、WhatsApp 和 SMS 等 APAC 渠道支持，以及面向高频客户旅程的实时决策。
    - 即便已重新定价，Diginex 交易仍说明 Resulticks 体量足以支撑一套公开市场转型叙事，而不是常规补强式收购。
  topRisks:
    - US$1.05B 全股票交易仍未交割，还需要 US$70M 融资，并依赖规模较小的上市收购方跑完融资和审批路径。
    - 交易已从 US$1.5B 下调，后续条款继续恶化或无法交割的可能性因此上升。
    - 经审计独立财务、客户集中度、留存，以及合并后公司精确股本结构的公开披露仍有限。
    - Salesforce、Adobe、Braze、MoEngage、CleverTap 等互动营销厂商的竞争，会挤压 Resulticks 在 APAC 核心细分市场之外的定价、差异化和胜率。
  unresolvedGaps:
    - 经审计 FY2025 财报，以及收入、EBITDA 和税后利润口径之间的清晰桥接。
    - 已验证的客户集中度、续约行为、NRR/GRR，以及按地域和行业拆分的 logo-to-revenue 结构。
    - 修订后 Diginex 交易的详细股权结构表和最终股数计算，包括必要融资带来的稀释。
    - 关于毛利率、服务收入占比、实施经济性，以及用量计费收入真实贡献的证据。
    - 对创始人、实体和总部结构的独立确认，覆盖新加坡、印度和美国运营足迹。
