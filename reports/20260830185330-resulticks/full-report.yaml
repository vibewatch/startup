      - number: '8.4'
        title: Bull, Base, and Bear Cases
        blocks:
          - type: paragraph
            body: >-
              The comparable picture is mixed, which is exactly why Resulticks is interesting. Broad SaaS references are
              not supportive of a carefree premium. Equal-weighted public medians around 3.8x ARR, public growth-band
              medians between roughly 1.9x and 5.5x for slower growers, and disclosed SaaS transaction medians around
              4.0x-4.5x all argue for valuation discipline. On the other hand, 2025-2026 private-market guides and
              MarTech M&A references still show that AI-native or strategically important assets can clear materially
              higher ranges: Acquiry's AI-native framework, SaaSRise's roughly 8.0x AI-native MarTech median, and
              Windsor's premium 5x-8x+ band all leave room for a 7x argument. The problem is not the existence of
              premium precedent. It is the lack of audited proof that Resulticks belongs securely in that premium
              bucket.
            claimRefs:
              - CV009
              - CV010
              - CV011
