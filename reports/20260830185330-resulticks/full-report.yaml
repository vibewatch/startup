      - number: '3.2'
        title: Competitor Profiles and Pricing Context
        blocks:
          - type: paragraph
            body: >-
              The strongest case for Resulticks is in complex enterprise use cases where unified data, orchestration,
              and multichannel delivery matter at the same time. Public customer references span banking, healthcare,
              asset management, super-app loyalty, and multi-brand retail, which is a very different signal from a
              lightweight email platform serving mostly smaller merchants. TrustRadius content also credits the product
              with true omnichannel support and near-real-time segmentation. That suggests a platform that can sit
              closer to a customer-operating core. The likely moat is therefore not a single feature checkbox. It is
              workflow integration, vertical execution proof, and regional enterprise services fit. If management can
              show that complex customers select Resulticks because it solves these harder jobs better than more famous
              alternatives, the company has a defensible niche that is more valuable than simple category participation.
              Without that proof, however, the same enterprise breadth can look like undifferentiated martech sprawl.
