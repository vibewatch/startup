      - number: '2.4'
        title: Adoption Constraints and Market Friction
        blocks:
          - type: paragraph
            body: >-
              The same conditions that create demand also create friction. Enterprise engagement platforms are costly to
              deploy, require integration depth, and can fail to realize value if users do not adopt the full stack.
              CDP.com's summarized Gartner findings on underutilization, MarketsandMarkets' AI talent-gap warning, and
              multiple buyer-behavior reports on CFO scrutiny all point in the same direction: adoption is not
              guaranteed simply because the category is growing. Privacy and consent requirements tighten the constraint
              further. UniConsent and McDermott both describe an increasingly punitive web of U.S. privacy, tracking,
              cookie, and automated-decisioning obligations, while Resulticks itself highlights DPF-linked trust and
              FTC-governed commitments in its privacy materials. For APAC-focused vendors, this means growth can be real
              without being frictionless. The winning vendors are not just feature-rich; they are those that can prove
              secure deployment, data governance, measurable ROI, and practical implementation support across
              complicated customer and regulatory environments. That is exactly why category growth should not be
              confused with automatic win probability for any single vendor.
            claimRefs:
              - CM030
              - CM031
              - CM032
              - CM033
              - CM034
