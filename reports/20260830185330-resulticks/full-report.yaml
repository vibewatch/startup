  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Global MarTech Competitive Structure
        blocks:
          - type: paragraph
            body: >-
              Resulticks does not compete in one clean lane. Its peer set sits in the overlap of CDP, marketing
              automation, and multichannel engagement, so the field naturally splits into tiers. Global suites such as
              Salesforce and Adobe compete by bundling engagement with broader enterprise clouds and stronger
              procurement comfort for conservative buyers. Closer operational challengers such as MoEngage, CleverTap,
              and Braze compete on engagement depth, usability, or regional fit. Lighter tools such as Klaviyo compete
              where buyers really want fast channel execution and simpler B2C CRM rather than heavier enterprise
              orchestration. This tiering matters because Resulticks is unlikely to win by being the broadest or the
              simplest. It only wins when buyers value integrated data, orchestration, attribution, and multichannel
              execution enough to justify choosing a smaller and less familiar platform. In practice that means
              Resulticks must persuade buyers that complexity is a feature, not a cost, and that its product breadth
              translates into faster or more measurable operating outcomes than point solutions can provide.
