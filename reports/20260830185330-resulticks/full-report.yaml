      - number: '4.4'
        title: Capital Adequacy, Revenue Quality, and Open Financial Diligence
        blocks:
          - type: paragraph
            body: >-
              The correct underwriting posture is constructive but highly conditional. If the Diginex disclosures are
              broadly accurate, Resulticks is a rare private martech asset with meaningful scale, strong margins, and a
              still-premium strategic valuation even after the August reset. If the independent database estimates
              closer to US$35.8 million to US$45.2 million are directionally closer to truth, the headline transaction
              math becomes far more aggressive and the quality of revenue far more questionable indeed. The public
              record does not let us decide cleanly between those worlds. Therefore the financial chapter should carry
              forward three hard truths into valuation: the business is probably real and commercially significant; the
              public deal narrative is still not audited evidence; and capital-structure mechanics, dilution, and close
