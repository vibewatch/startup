      - number: '2.2'
        title: APAC CDP and Customer Engagement Market Sizing
        blocks:
          - type: paragraph
            body: >-
              Regional demand conditions appear directionally supportive for Resulticks. MarketsandMarkets describes
              Asia Pacific as the fastest-growing region in marketing automation, while CDP-oriented coverage also
              points to strong growth outside North America. That matters because Resulticks does not need to win the
              entire global category; it needs markets where complex customer journeys, high mobile usage, and
              first-party-data intensity create platform demand. The buyer map is also broader than marketing alone.
              Forrester, Consensus, G2, and SoftwareSuggest all point to larger buying groups, more self-directed
              evaluation, greater finance oversight, and heavier use of AI-assisted research. In practice, that means a
              vendor like Resulticks must simultaneously satisfy marketing operators, IT/data gatekeepers, procurement,
              legal/privacy teams, and CFO-level ROI scrutiny. The category still rewards product breadth, but buyer
              success depends as much on implementation proof and trust as on feature checklists.
