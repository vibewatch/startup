      - number: '4.3'
        title: Go-to-Market Strategy and Channel Motion
        blocks:
          - type: paragraph
            body: >-
              The transaction economics matter at least as much as the operating numbers. The deal walked from a US$2.0
              billion MOU to a US$1.5 billion April SPA and then to a US$1.05 billion August amended agreement. At the
              latest terms, consideration is 600 million Diginex shares at US$1.75 each, with Resulticks shareholders
              and expected investors owning about 86% of the enlarged company. The amended package also depends on US$70
              million of fresh private funding. Meanwhile, Diginex' own 20-F shows a much smaller stand-alone public
              company with only 29.1 million shares outstanding at March 31, 2026, US$4.9 million of cash, US$24.9
              million of operating losses, US$14.1 million of operating cash outflow, a working-capital deficit, and
              Nasdaq bid-price stress. That profile makes the transaction look less like a simple acquisition and more
              like a control-shifting public-market recapitalization hinging on external funding and approvals. Put
              differently, financing structure is itself one of the largest economic variables in the case. That sharply
              raises execution and dilution risk.
