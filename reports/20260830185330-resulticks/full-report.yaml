      - number: '8.3'
        title: Valuation Benchmarks and Multiples
        blocks:
          - type: paragraph
            body: >-
              The scenario work is unusually sensitive because small changes in the revenue denominator produce enormous
              value swings. If the lower third-party revenue estimates are closer to truth, the signed price becomes
              very hard to defend. If the official US$150 million base is correct, then the debate shifts from existence
              and scale risk toward whether the company deserves a public-median multiple, a typical private-transaction
              multiple, or a genuine premium AI-native strategic multiple. The forward cases can look attractive on
              paper because Diginex projected US$190-210 million of FY2026 revenue and US$250-280 million by FY2027. But
              those are still management-led projections carried inside a transaction narrative. They support upside
              optionality, not present value certainty.
            claimRefs:
              - CV020
              - CV021
