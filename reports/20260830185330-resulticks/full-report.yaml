      - number: '3.4'
        title: Switching Costs, Distribution Power, and Competitive Risk
        blocks:
          - type: paragraph
            body: >-
              From an underwriting perspective, Resulticks should be treated as a specialist enterprise challenger
              rather than a category winner by default. Its best position is in high-complexity engagement environments
              where data unification, orchestration, and multichannel execution create real switching value. But that
              position is only attractive if it converts into repeatable win rates and healthy renewals. The current
              public record does not show whether Resulticks more often displaces global suites, loses to regional
              challengers, or avoids lower-complexity deals entirely in practice. That uncertainty matters because the
              company sits in a category where narrative compression happens quickly. If buyers experience the platform
              as too small to trust or too heavy to justify, the market can compress it into a crowded middle. If
              management can prove fast time-to-value, durable complex-account wins, and clear reasons customers choose
              it over brand-name alternatives, the same middle position becomes a differentiated niche rather than a
              dangerous no-man's-land.
