      - number: '3.3'
        title: Resulticks Differentiation
        blocks:
          - type: paragraph
            body: >-
              The rival strengths are also obvious. Salesforce and Adobe bring larger ecosystems, deeper trust with
              enterprise buyers, and broader suite adjacency. Braze can appeal where technical cross-channel engagement
              depth is the central buying criterion. MoEngage and CleverTap are especially dangerous because they sit
              close enough to similar use cases while often telling a clearer story on speed, usability, and marketer
              ownership. SelectHub and MoEngage's own materials make this threat explicit: some buyers want accessible
              tooling and fast time-to-value rather than maximal platform breadth. Klaviyo is not a direct enterprise
              match, but it still represents the constant market pressure toward simpler, channel-led solutions. The
              real risk for Resulticks is therefore a squeeze from above and beside: global suites win on confidence,
              while challengers win on simplicity. That leaves little room for unclear messaging or slow implementations
              in enterprise deals at all consistently.
