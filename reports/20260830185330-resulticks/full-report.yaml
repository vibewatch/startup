      - number: '8.5'
        title: Recommendation and Diligence Triggers
        blocks:
          - type: paragraph
            body: >-
              Exit readiness should be scored as moderate, not strong. The transaction path offers a public-market route
              and a plausible strategic narrative, but it still depends on funding, approvals, and a comparatively
              fragile acquirer balance sheet. Investors do not need to reject the company outright to recognize that
              this matters. They do need to insist on a final diligence package that can convert a narrative price into
              an underwritten price. That package is straightforward: audited FY2025 numbers, a clean bridge between the
              EBITDA and profit-after-tax claims, customer retention and concentration, gross margin and services mix,
              and a post-close capitalization model that shows exactly how dilution and financing interact. Until those
              asks are answered, the stock-for-stock headline should be treated as a scenario reference, not a final
              investment truth.
            claimRefs:
