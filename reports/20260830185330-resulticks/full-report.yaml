  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Marketing Technology Market Overview
        blocks:
          - type: paragraph
            body: >-
              Resulticks should be analyzed within a layered market definition rather than a single headline category.
              The company sells into enterprise customer engagement, but its actual value proposition spans at least
              three overlapping software budgets: customer data platforms, multichannel marketing automation, and
              broader marketing cloud or digital-transformation programs. That distinction matters because market-size
              claims vary wildly depending on which boundary is used. CDP-specific estimates in the fetched corpus range
              from roughly US$4 billion to nearly US$10 billion for the current period, while the broader
              marketing-automation category is much larger. The right underwriting approach is therefore to avoid
              claiming that all martech spend is truly addressable. A more defensible lens is the APAC enterprise
              segment that needs unified profiles, cross-channel orchestration, and regulated data governance. Under
              that lens, Resulticks sits in a real growth market, but the practical target segment is much narrower than
              an undifferentiated global TAM number would suggest. This distinction keeps later financial and valuation
              conclusions anchored to plausible adoption shells instead of inflated category rhetoric.
