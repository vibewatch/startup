            body: >-
              The underlying customer logic likely favors a land-and-expand model, but the public record does not let us
              measure how successful that model is. Most showcased customers have characteristics that should support
              expansion: many brands, many channels, high data complexity, or regulated service interactions. That makes
              it plausible that Resulticks can grow by adding journeys, business units, markets, or messaging surfaces
              within the same account. At the same time, the visible proof set leans toward a small number of large,
