        title: Capital History and Current Transaction Context
        blocks:
          - type: paragraph
            body: >-
              Resulticks has a public price reference, but not yet a cleanly underwritable one. The headline has already
              moved from a US$2.0 billion MOU to a US$1.5 billion definitive deal and then to a US$1.05 billion amended
              agreement within roughly fourteen months. That alone is not fatal; repricing happens. But the direction
              matters because it tells investors that price discovery weakened as diligence, financing, and completion
              mechanics became more concrete. The August frame still leaves a premium-looking transaction: if the stated
              US$150 million revenue base is accurate, the deal implies about 7.0x revenue. That is below the April
              10.0x frame and below the original 13.3x MOU implication, yet still above broad public and average M&A
              medians. The disciplined public-information stance is therefore wait or reprice, not chase the headline.
