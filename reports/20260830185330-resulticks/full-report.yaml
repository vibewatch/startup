  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - US$150M current revenue is real; AI-led differentiation earns 8x-10x; close completes cleanly.
        - ~US$1.2B-US$1.5B today, with further upside if FY2026-2027 projections are achieved.
        - Premium thesis could still fail if retention or margin disappoints.
        - Possible but needs private proof.
      - - Base
        - US$150M revenue is broadly real, but market applies only 5x-7x due to disclosure and close risk.
        - ~US$0.75B-US$1.05B, roughly bracketing the current amended reference.
        - Limited upside if deal friction persists.
        - Most defensible on public evidence.
      - - Bear
        - Third-party revenue estimates are directionally closer to truth; market clears at 4x-5x.
        - ~US$0.18B-US$0.23B if revenue is ~US$45M, or ~US$0.14B-US$0.18B at the lower estimate.
        - Denominator error would overwhelm the strategic narrative.
        - Low-probability but severe downside case.
    notes: >-
      Scenario bands use revenue-multiple logic only; they do not yet model preference stack or exact post-close
