chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Resulticks is positioned as an AI-powered real-time customer engagement and marketing automation platform
              built around customer data unification, decisioning, and multichannel execution. The operating identity
              described in the prompt is more coherent than many earlier public summaries: the company was founded in
              2012 in Chennai, maintains a Singapore-registered parent entity, and also operates a U.S. subsidiary while
              using Singapore and Chennai as the practical headquarters pair. Its product scope sits squarely inside
              enterprise MarTech and customer data platform infrastructure rather than consumer software. The company
              sells to large enterprises that need real-time segmentation, next-best-action, campaign orchestration, and
              analytics across email, SMS, WhatsApp, push, in-app, web, and social surfaces. Sector emphasis on
              financial services, retail, telecom, and hospitality fits the platform architecture because these buyers
              manage large event volumes, consent-heavy communications, and cross-channel lifecycle workflows that
              reward a unified CDP plus orchestration stack.
