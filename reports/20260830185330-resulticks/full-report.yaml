    layout: standard
    summary: >-
      Resulticks appears to layer customer-data unification, identity resolution, decisioning, execution, and
      attribution into a modular engagement stack with peripheral product lines around a flagship core.
    data:
      layers:
        - label: Data and profile layer
          detail: RESUL CDP unifies CRM, app, web, transaction, and audience data into real-time profiles.
        - label: Identity and signal layer
          detail: SmartDX and SDK instrumentation collect event and identity signals across devices and properties.
        - label: Decision and orchestration layer
          detail: Genie agents, rules, segmentation, and journey logic convert signals into actions.
        - label: Channel execution layer
          detail: REACHER and campaign surfaces activate Email, SMS, Push, WhatsApp, Voice, and RCS.
        - label: Attribution and analytics layer
          detail: Resulticks measures journeys, ROI, and multi-touch attribution for optimization.
        - label: Portfolio extensions
