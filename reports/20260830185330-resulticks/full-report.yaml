      - number: '1.4'
        title: Scale Metrics, Growth, and Open Questions
        blocks:
          - type: paragraph
            body: >-
              The financial snapshot supplied for this report is unusually strong for a private MarTech company.
              Resulticks is said to have generated approximately US$150 million of FY2025 revenue, US$17 million of
              profit after tax, and EBITDA margins near 32%, while sustaining revenue CAGR above 60% since the pandemic
              and roughly 70% annual growth over a five-year span. ARR is described as roughly coincident with revenue
              at about US$150 million, with FY2026 projected revenue of US$190 million to US$210 million and FY2027
              revenue around US$280 million. Those figures, if confirmed, support the argument that Resulticks is not a
              small regional software vendor but a scaled enterprise platform with meaningful profitability. The
              principal diligence gaps are therefore less about whether a business exists and more about how much of the
              headline narrative is independently audited: customer concentration, detailed cap table, exact entity
              structure, and post-close dilution all still matter. Another unresolved area is the precise mix between
              subscription, usage, and services revenue, because that mix directly affects durability, gross margin
              expectations, and what valuation multiple is truly justified if the public-market transaction does not
              close as currently amended.
