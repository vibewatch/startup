  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 仅基于公开证据，对 Resulticks 投资情境做 IC 式快照。
    data:
      items:
        - label: 市场顺风因素
          value: 4/5
          detail: 客户互动和 APAC 营销科技需求仍有战略意义
        - label: 产品 / 客户证明
          value: 3/5
          detail: 平台和客户信号真实存在，但广度和质量只得到部分验证
        - label: 财务披露
          value: 1/5
          detail: 没有公开经审计的独立资料包或收入质量桥接
        - label: 交易确定性
          value: 1/5
          detail: 融资、审批和公开市场壳依赖仍很关键
        - label: 估值吸引力
          value: 2/5
          detail: 当前修订价格可能只有在证据最充分的叙事版本里才站得住
        - label: 总体建议
          value: Wait / reprice
          detail: 战略资产有吸引力，但仅凭公开证据，还不是干净的溢价买入点
    claimRefs:
