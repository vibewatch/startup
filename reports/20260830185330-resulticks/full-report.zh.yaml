      - number: '3.2'
        title: 竞争对手画像与定价背景
        blocks:
          - type: paragraph
            body: >-
              Resulticks 最强的论据来自复杂企业用例：统一数据、编排和多渠道投放必须同时成立。公开客户案例横跨银行、医疗、资产管理、超级 app
              会员、多品牌零售，这与主要服务小商户的轻量电子邮件平台给出的信号完全不同。TrustRadius
              内容也认可产品具备真正的全渠道支持和近实时分群能力。这说明平台可以更贴近客户运营核心。由此看，可能的护城河不是单一功能勾选项，而是工作流集成、垂直行业执行证明和区域企业服务适配。如果管理层能证明复杂客户选择
              Resulticks，是因为它比更知名替代方案更好地解决这些难题，公司就拥有一个可防守的利基，其价值高于简单参与品类本身。缺少这种证明时，同样的企业级广度也会显得像无差别的 martech 摊大饼。
