              基数正确，争论就会从存在性和规模风险，转向公司应该拿公开市场中位数倍数、典型私人交易倍数，还是名副其实的 AI-native 战略溢价倍数。远期情景在纸面上可以好看，因为 Diginex 预计 FY2026
