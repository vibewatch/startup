  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: SaaS 收入模式
        blocks:
          - type: paragraph
            body: >-
              Resulticks 明显像一家企业软件公司，但公开收入信息稀薄且不均衡。官方页面和客户页面显示，平台卖给具备多品牌、多渠道复杂度的大型企业，这强烈暗示商业关系具备高 ACV。GetApp
              至少披露了一个可见起步价，每年 US$24,000；Marketing Star 则为更大产品家族中的轻量产品发布了低得多的自助定价层。这个对比有用：它说明 Resulticks
              并不是靠一张统一价目表变现，而是用一个组合覆盖企业平台销售、轻量 SMB
              包装，以及可能通过渠道和模块实现的用量挂钩扩张。合作伙伴计划又加了一层经济逻辑，因为它意味着经销、咨询和实施动作会影响交易执行。这通常意味着部分企业价值绑定在交付能力、生态触达和赋能执行上，而不只是原始软件用量。缺失的仍是标准
              SaaS 透明度包：合同形态、平均交易规模、服务收入占比、递延收入和真实客户扩张行为。这些缺口对任何严肃软件投资核验都很重要。
