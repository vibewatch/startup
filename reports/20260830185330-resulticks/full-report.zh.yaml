      - number: '1.4'
        title: 规模指标、增长与未决问题
        blocks:
          - type: paragraph
            body: >-
              本报告获得的财务快照，对一家私人 MarTech 公司而言异常强劲。Resulticks 据称 FY2025 收入约 US$150 million、税后利润 US$17 million，EBITDA 利润率接近
              32%；疫情以来收入 CAGR 高于 60%，五年维度年增长约 70%。ARR 被描述为与收入大致重合，约 US$150 million；FY2026 预计收入为 US$190 million 至 US$210
              million，FY2027 收入约 US$280 million。如果这些数字得到确认，Resulticks
              就不是一家小型区域软件供应商，而是具备实际盈利能力的规模化企业平台。因此，核心尽调缺口不在于业务是否存在，而在于大标题叙事有多少经过独立审计：客户集中度、详细股权结构表、准确实体结构，以及交割后稀释仍然重要。另一个未解问题是订阅、用量和服务收入的精确组合，因为这会直接影响收入耐久性、毛利率预期，以及如果公开市场交易没有按当前修订条款交割，什么估值倍数才真正合理。
