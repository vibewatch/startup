      - number: '2.4'
        title: 采纳约束与市场摩擦
        blocks:
          - type: paragraph
            body: >-
              创造需求的同一组条件也制造摩擦。企业互动平台部署成本高，需要深度集成；如果用户没有采纳整套栈，也可能无法兑现价值。CDP.com 汇总的 Gartner 低利用率发现、MarketsandMarkets 对 AI
              人才缺口的警告，以及多份买方行为报告对 CFO 审查的描述，都指向同一方向：品类增长并不自动保证落地。隐私和同意要求进一步收紧约束。UniConsent 和 McDermott
              都描述了美国隐私、追踪、cookie 和自动化决策义务正在变得更具惩罚性的网络；Resulticks 自身也在隐私材料中强调与 DPF 相关的信任和 FTC 管辖承诺。对于以 APAC
              为重心的供应商，这意味着增长可以真实存在，但不会没有摩擦。胜出的供应商不只是功能多，而是能在复杂客户和监管环境中证明安全部署、数据治理、可衡量 ROI
              和实际实施支持的团队。正因如此，品类增长不应被误读为任何单一供应商的自动胜率。
