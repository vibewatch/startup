      - number: '2.2'
        title: APAC CDP 与客户互动市场规模
        blocks:
          - type: paragraph
            body: >-
              区域需求方向上支持 Resulticks。MarketsandMarkets 将亚太描述为营销自动化增长最快的地区，CDP 相关报道也指向北美以外的强增长。这很重要，因为 Resulticks
              不需要赢下全球整个类目；它需要的是复杂客户旅程、高移动端使用率和一方数据强度能催生平台需求的市场。买方地图也不止营销部门。Forrester、Consensus、G2 和 SoftwareSuggest
              都指向更大的采购群体、更自主的评估、更强的财务审查，以及更多 AI 辅助研究。落到实际，这意味着 Resulticks 这样的供应商必须同时满足营销操盘手、IT / 数据把关人、采购、法务 / 隐私团队和 CFO
              层面的 ROI 审视。品类仍奖励产品广度，但买方成功同样取决于实施证明和信任，而不只是功能清单。
