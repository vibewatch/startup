            body: >-
              交易经济性至少和经营数字一样重要。交易从 US$2.0 billion MOU 走到 April SPA 中的 US$1.5 billion，再走到 August 修订协议中的 US$1.05
              billion。按最新条款，对价为 600 million 股 Diginex 股票，每股 US$1.75；Resulticks 股东和预期投资者将持有扩大后公司约 86%。修订方案还依赖 US$70
              million 新增私募融资。与此同时，Diginex 自身的 20-F 显示，它是一家规模小得多的独立上市公司：截至 March 31, 2026 仅有 29.1 million 股流通、US$4.9
              million 现金、US$24.9 million 经营亏损、US$14.1 million 经营现金流出、营运资本缺口，以及 Nasdaq
              买入价压力。这个画像让交易不像一笔简单收购，更像一次控制权转移的公开市场资本重组，成败取决于外部融资和审批。换句话说，融资结构本身就是本案最大的经济变量之一，并显著抬高执行和稀释风险。
