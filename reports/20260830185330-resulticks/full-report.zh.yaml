  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 从战略证明和溢价先例出发，经过披露缺口，落到等待或重新定价的建议立场。
    data:
      nodes:
        - id: n1
          label: 战略证明
          type: input
          detail: 真实产品、企业客户和 AI/CDP 定位
        - id: n2
          label: 存在溢价先例
          type: process
          detail: AI 原生 SaaS 和营销科技参照可支撑 7x-12x 或更高
        - id: n3
          label: 分母争议
          type: risk
          detail: Latka 和 RocketReach 远低于官方 US$150M 叙事
        - id: n4
          label: 结构风险
          type: risk
          detail: 全股票交易、融资条件和 Diginex 流动性都很关键
        - id: n5
          label: 披露缺口
          type: risk
          detail: 没有经审计的 FY2025 资料包，也没有留存、利润率或集中度证明
        - id: n6
          label: 建议
          type: output
          detail: 等待 / 重新定价，直到私下证据能支撑溢价区间
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n6
        - from: n3
          to: n6
        - from: n4
          to: n6
        - from: n5
          to: n6
