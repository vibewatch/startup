      - number: '7.4'
        title: 运营、技术与人员风险
        blocks:
          - type: paragraph
            body: >-
              Resulticks
              展示了足够客户证据，值得继续尽调，但披露不足以让人放松对集中度或组织风险的警惕。具名参考和案例研究表明，公司服务可信企业客户，包括复杂品牌和金融机构。但公开来源没有披露头部客户敞口、队列留存或由合作伙伴承担的交付比例。公开画像数据库也在员工数和组织规模上彼此不一致，而地点数据暗示公司足迹分布在
              India、Singapore 及其他市场。这个组合可以被管理好，但执行质量会高度依赖管理层深度、协同纪律和本地合规卫生。简言之，客户证明真实，组织韧性只得到部分验证。
