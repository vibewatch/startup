  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 当前 US$150M 收入真实；AI 驱动差异化拿到 8x-10x；交割顺利完成。
        - 当前约 US$1.2B-US$1.5B；若 FY2026-2027 预测兑现，还有进一步上行。
        - 若留存或利润率不及预期，溢价逻辑仍可能失效。
        - 有可能，但需要私有证据。
      - - 基准
        - US$150M 收入大体真实，但由于披露和交割风险，市场只给 5x-7x。
        - 约 US$0.75B-US$1.05B，大致覆盖当前修订参考区间。
        - 如果交易摩擦持续，上行有限。
        - 公开证据下最站得住。
      - - 悲观
        - 第三方收入估计方向上更接近真相；市场以 4x-5x 出清。
        - 若收入约 US$45M，则约 US$0.18B-US$0.23B；按更低估计则约 US$0.14B-US$0.18B。
        - 分母错误会压倒战略叙事。
        - 低概率，但下行严重。
    notes: 情景区间只使用收入倍数逻辑；尚未建模优先股堆叠或交割后精确稀释。
    claimRefs:
