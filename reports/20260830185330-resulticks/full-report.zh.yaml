  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 资本历史与当前交易背景
        blocks:
          - type: paragraph
            body: >-
              Resulticks 有公开价格参考，但还没有一个干净可投资核验的价格。大标题已经在大约十四个月内从 US$2.0 billion MOU，降到 US$1.5 billion 确定性交易，再到 US$1.05
              billion 修订协议。单看这点并不致命，重定价会发生。但方向重要，因为它告诉投资人：随着尽调、融资和完成机制更具体，价格发现变弱了。August 框架仍是一笔看起来带溢价的交易：如果所称 US$150
              million 收入基数准确，交易约等于 7.0x 收入。这低于 April 10.0x 框架，也低于最初 MOU 隐含的 13.3x，但仍高于广义公开市场和平均 M&A
              中位数。因此，基于公开信息的纪律性姿态应是等待或重定价，而不是追逐大标题。
