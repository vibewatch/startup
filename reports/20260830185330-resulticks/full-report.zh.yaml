  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 全球 MarTech 竞争结构
        blocks:
          - type: paragraph
            body: >-
              Resulticks 并不在单一清晰赛道竞争。它的同行集合落在 CDP、营销自动化和多渠道互动的交叉区，因此市场自然分层。Salesforce、Adobe
              等全球套件靠把互动能力捆进更大的企业云，并给保守买家更强采购安全感来竞争。MoEngage、CleverTap、Braze 等更贴近运营的挑战者，则在互动深度、易用性或区域适配上竞争。Klaviyo
              这类轻量工具切入的是买家真正想要快速渠道执行和更简单 B2C CRM，而不是更重的企业编排。这个分层很重要，因为 Resulticks
              不太可能靠“最广”或“最简单”取胜。只有当买家足够重视集成数据、编排、归因和多渠道执行，愿意选择一个更小、熟悉度更低的平台时，Resulticks 才会赢。落到实际，Resulticks
              必须说服买家：复杂度是功能，不是成本；产品广度能转化为比点状方案更快或更可衡量的运营结果。
