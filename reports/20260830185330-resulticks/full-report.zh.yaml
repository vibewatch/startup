              可比图景混杂，这正是 Resulticks 有意思的地方。广义 SaaS 参考并不支持轻松给溢价。等权公开市场中位数约 3.8x ARR，低增速上市公司分位的中位数大约在 1.9x 到 5.5x 之间，已披露
              SaaS 交易中位数约 4.0x-4.5x，都支持估值纪律。另一方面，2025-2026 私募市场指南和 MarTech M&A 参考仍显示，AI-native 或战略重要资产可以跑出明显更高区间：Acquiry
              的 AI-native 框架、SaaSRise 约 8.0x 的 AI-native MarTech 中位数，以及 Windsor 的 5x-8x+ 溢价区间，都给 7x
              论点留出空间。问题不在于溢价先例是否存在，而在于缺少经审计证据，证明 Resulticks 稳稳属于这个溢价桶。
