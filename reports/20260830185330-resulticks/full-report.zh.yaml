  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司 / 参考
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - 公开 SaaS 中位数（SaaS Capital）
        - 公开公司等权 ARR 倍数
        - ~3.8x (31 Jul 2026)
        - 广义软件市场出清水平的基准。
        - 公开市场中位数低估控制权溢价和突出的 AI 叙事。
      - - 公开市场增长区间中位数
        - 历史增长率 20-30% 区间
        - 中位数约 5.5x
        - 如果 Resulticks 在增长、但尚未明显进入头部区间，这个参照有用。
        - 需要核实增长，并拿到可比的公开市场披露口径。
      - - 已披露 SaaS 交易
        - 可比交易锚点
        - 中位数约 4.0x-4.5x；前四分位 8.1x+
        - 显示真实交易出清价格通常落在哪。
        - 已披露样本偏向规模更大、结构更干净的交易，仍未必匹配 Resulticks。
      - - AI 原生 SaaS 私募区间
        - 私募市场指引
        - 20-50% 增长对应约 7x-12x；>50% 增长对应 10x-20x
        - 支持存在溢价区间的可能。
        - 需要真实的 AI 差异化和经验证的增长质量。
      - - AI 原生 MarTech 并购中位数
        - 2026 年初至今 MarTech 并购参照
        - 约 8.0x EV/收入
        - 最直接支撑优质 MarTech 资产溢价的先例。
        - 品类中位数仍不能证明这项具体资产应拿到溢价。
      - - Resulticks 修订交易参照
        - 2026 年 8 月签署的交易
        - US$1.05B / 按披露 US$150M 收入约 7.0x
        - 当前仍有效的价格参照。
        - 全股票、带条件，对分母准确性高度敏感。
    notes: 本表覆盖本章实际用到的重要估值参照，并按从广义市场基准到资产特定参照的顺序排列。
