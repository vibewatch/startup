  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 营销科技市场概览
        blocks:
          - type: paragraph
            body: >-
              分析 Resulticks
              应采用分层市场定义，而不是单一大类目。公司切入企业客户互动市场，但实际价值主张至少覆盖三类重叠的软件预算：客户数据平台、多渠道营销自动化，以及更广义的营销云或数字化转型项目。这个区分很重要，因为市场规模口径会随边界选择大幅摆动。所抓取资料中，CDP
              专项估计在当前时期约从 US$4 billion 到接近 US$10 billion 不等，更广义的营销自动化类目则大得多。因此，正确的投资判断不是宣称所有 martech
              支出都可真实触达。更稳妥的视角，是锁定需要统一画像、跨渠道编排和受监管数据治理的 APAC 企业细分市场。在这个视角下，Resulticks 处于真实增长市场，但实际目标段远窄于无差别全球 TAM
              数字。这个区分能让后续财务和估值结论落在可信采用边界上，而不是被虚高的类目话术带偏。
