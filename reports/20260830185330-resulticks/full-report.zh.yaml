              退出准备度应评为中等，而不是强。交易路径提供了一条公开市场路线和合理的战略叙事，但仍依赖融资、审批，以及相对脆弱的收购方资产负债表。投资人不必直接否定公司，也能认识到这个问题的重要性。他们确实需要坚持一份最终尽调包，把叙事价格转换成可核验价格。这份包很直接：经审计的
              FY2025 数字、EBITDA
