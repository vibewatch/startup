      - number: '2.3'
        title: 增长驱动与行业需求
        blocks:
          - type: paragraph
            body: >-
              这个市场最强的需求驱动，都利好能统一数据并快速在多渠道激活的平台。CDP、营销自动化和买方行为资料反复出现的主题，是 AI
              驱动的个性化、实时决策、全渠道执行和可衡量的收入影响。这些需求在客户记录、事件和受监管通信本来就密集的行业尤其强：银行、零售、电信、旅行及类似高频垂直。HDFC Bank
              的公开案例有价值，不是因为它证明所有细分市场表现相同，而是因为它展示了一组代表性问题：客户画像多、属性多、渠道多，还需要缩短响应滞后。这正是集成平台能替代碎片化营销工具的环境。由此可见，Resulticks
              不需要水平 SMB 打法也能找到需求；它需要赢下复杂企业工作流，在那里编排和数据统一具有实质价值。
