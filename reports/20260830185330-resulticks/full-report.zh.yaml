  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 公开证据
      - 决策含义
    rows:
      - - 建议
        - 等待 / 重新定价
        - 公司质量说得通，但估值证明不完整，交易结构也有条件。
        - 没有私有尽调，不要把已签署交易的公告价当成干净公允价值。
      - - 置信度
        - 中
        - 时间线和公告指标可见；分母质量和资本结构尚未充分证明。
        - 只能作为筛选结论，不能当作最终投委会批准。
      - - 风险评级
        - 偏高
        - 收入分母有争议，收购方脆弱，造成不对称下行。
        - 需要更大的安全边际和更强尽调包。
      - - 估值立场
        - 当前大约 US$0.75B-US$1.05B 可辩护
        - 如果 US$150M 收入真实，基准情景数学支持该区间；高于该区间的上行需要高质量溢价证明。
        - 仅凭公开证据，不应显著高于当前修订参考价付款。
    notes: 建议有意保守，因为公开记录对叙事和时间线的支撑远强于对经审计经济性的支撑。
