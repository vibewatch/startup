        title: 领导层、布局与组织
        blocks:
          - type: paragraph
            body: >-
              本轮材料中的领导层画像，集中在联合创始人兼首席执行官 Redickaa Subrammanian，以及支撑公司技术侧的联合创始人 Kulesh Iyengar。这种搭配符合较典型的后期企业软件运营模型：CEO
              负责商业领导和对外叙事，技术联合创始人承担平台连续性和架构可信度。公司据称约有 500 到 600 名员工，Chennai 是主要工程中心，Singapore 则承担 APAC
              商业和产品管理中心职能。美国东海岸的业务开发存在感拓宽了企业客户覆盖，但没有改变公司亚洲优先的运营底色。整体布局显示，这家公司优化的是印度低成本高效率产品开发、Singapore
              区域企业销售，以及选择性接触北美账户，而不是一套完全以美国为中心的销售打法。
