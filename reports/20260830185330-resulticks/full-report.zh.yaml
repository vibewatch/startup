    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Resulticks 的定位是由 AI 驱动的实时客户互动和营销自动化平台，核心是客户数据统一、决策和多渠道执行。提示中描述的运营身份比许多更早的公开摘要更连贯：公司 2012 年创立于
              Chennai，母公司注册在 Singapore，也运营一家美国子公司，并把 Singapore 和 Chennai 作为实际双总部。产品范围明确落在企业 MarTech
              和客户数据平台基础设施，而不是消费者软件。公司销售对象是大型企业，这些客户需要在电子邮件、SMS、WhatsApp、推送、应用内、网页和社交
              等触点上完成实时分群、下一最佳行动、营销活动编排和分析。金融服务、零售、电信和酒店行业的侧重与平台架构匹配，因为这些买家管理大规模事件量、重同意管理的通信，以及跨渠道生命周期工作流，统一的 CDP
              加编排栈能带来回报。
