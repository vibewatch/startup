              的 CY2025 收入、US$46 million 的 EBITDA，以及 32% EBITDA 利润率。June 2026，Diginex 重复了大致相同的收入和 EBITDA 框架。August
              2026，修订协议仍使用 US$150 million 收入口径，但把盈利框架切换为 US$17 million 税后利润，以及疫情以来超过 60% 的
              CAGR。这些数字在方向上可能都成立，但它们无法自洽。EBITDA、PAT、税务处理、一次性项目和实体范围都没有说明。因此，投资人可以把交易材料当作情景框架，却还不能把它们替代盈利质量工作或经审计的独立报表。
