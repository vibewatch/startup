  - id: TV005
    title: 投资逻辑破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入分母失真
        - 经审计 FY2025 收入显著低于 US$150M 主张
        - 溢价倍数逻辑最先坍塌。
        - 重置到悲观 / 基准区间，并从头重做投资测算。
      - - 交割确定性恶化
        - 融资变弱、审批停滞，或交易经济条款再次修订
        - 当前价格参照失去信号价值。
        - 提高所需回报，或直接退出。
      - - 收入质量不及预期
        - 留存、毛利率或服务收入占比明显弱于隐含预期
        - 即便收入规模真实，优质软件逻辑也会变弱。
        - 重定价到普通 SaaS 或类服务公司的倍数区间。
      - - 资本结构恶化
        - 稀释、优先权或控制权机制比预期更苛刻
        - 普通股上行空间被大幅压缩。
        - 要求结构性保护，或压低进入价格。
      - - 客户集中度超预期
        - 少数客户或合作伙伴贡献收入过高
        - 下行风险上升，质量叙事同时变弱。
        - 下调公允价值，并收紧尽调。
    notes: 这些触发项把本章的叙事判断转成明确的投资测算红线。
