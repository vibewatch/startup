      - number: '6.4'
        title: 集中度、渠道与地域风险
        blocks:
          - type: paragraph
            body: >-
              底层客户逻辑很可能支持先落地再扩张模式，但公开记录无法衡量这个模式有多成功。多数展示客户具备支持扩张的特征：多品牌、多渠道、高数据复杂度或受监管服务互动。因此，Resulticks
              通过在同一账户内增加旅程、业务单元、市场或消息触点来增长，是合理假设。同时，可见证据集偏向少数大型、复杂客户。证据集中可能反映了公司创造最大价值的地方，但也意味着公开观察者无法区分健康的企业客户基础，和过度依赖少数账户的收入结构。Diginex
              和 SEC 材料进一步提高了风险，因为客户连续性和集成可信度显然影响待完成交易。正确的投资核验姿态是：认可账户质量，但在获得私人队列数据前，对集中度和留存保持保守。
