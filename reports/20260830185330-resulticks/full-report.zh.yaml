  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 支撑证据
      - 何种证据会改变判断
    rows:
      - - 乐观逻辑
        - 产品真实、企业客户存在、定位在全渠道 / CDP，还有战略性 AI 叙事。
        - 经审计收入质量、留存和利润率能验证其高端软件资产地位。
      - - 反向逻辑
        - 收入分母有争议，单位经济性不透明，借收购方路径又增加资本市场风险。
        - 干净的 QoE 包、资本结构模型和已确认交割融资会降低该担忧。
      - - 缺口为何重要
        - 只有公司确实是优质资产、而不只是战略故事时，溢价倍数才站得住。
        - 需要证明实际表现更接近官方叙事，而不是第三方低端估计。
      - - 实操立场
        - 可以接触，但必须有价格纪律和明确下行保护。
        - 更强私有证据，或更低有效入场价格。
    notes: 逻辑分歧不在 Resulticks 是否存在；关键是公开记录应拿到多高置信度。
    claimRefs:
