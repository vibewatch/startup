      - number: '6.3'
        title: 留存、满意度与扩张潜力
        blocks:
          - type: paragraph
            body: >-
              独立满意度信号存在，但比供应商托管的推荐层更薄。TrustRadius 给出最清晰可用的第三方评论，强调真正的全渠道支持、机器学习支持、近实时分群和直观界面。FeaturedCustomers
              提供更广的参考数量和较高汇总评分，尽管很多细节被锁定。相比之下，GetApp 目前几乎没有针对 Resulticks 的真实评论深度，Software Advice
              抓取得到的主要是市场包装内容，而不是客户特定证据。Research.com 有助于给产品归类，但不能强力证明客户真的喜爱产品。留存经济性和客户健康衡量因此留下盲点。公开资料没有披露 NRR、logo
              留存、扩张收入、客户健康队列，或从部署到续约的转化。因此，虽然可见客户令人印象深刻，外部投资人仍缺少常规 SaaS 持久性指标，无法判断这些案例是否长期稳定代表一台可重复收入引擎。
