      - number: '1.3'
        title: 收购进程与战略逻辑
        blocks:
          - type: paragraph
            body: >-
              当前最重要的公司事件，是待完成的 Diginex 交易。Diginex Limited 是一家与 Singapore 相关、在 NASDAQ 上市的技术公司，聚焦 ESG、合规和 AI 导向的企业数据；它先在
              April 2026 宣布以 US$1.5 billion 全股票收购 Resulticks，随后在 August 2026 将最终协议修订为 US$1.05 billion 的较低估值。修订后的结构仍让
              Resulticks 股东持有合并后公司约 86% 股权，这意味着虽然 Diginex 是上市收购方，交易仍带有反向收购特征。战略叙事是合理的：把 Diginex 的信任、ESG 和数据治理定位，与
              Resulticks 的客户互动、CDP 和自主化营销活动能力结合起来。但修订条款也凸显了摩擦。交割目标仍是 October 30, 2026，并且仍取决于 US$70 million
              融资、监管批准和股东批准，因此应把这笔交易视为重大但尚未完成。
