      - number: '7.2'
        title: 竞争与市场风险
        blocks:
          - type: paragraph
            body: >-
              最紧迫的公开风险已经不是 Resulticks 有没有产品，而是 Diginex 交易能否干净交割，并让合并后公司站在稳定基础上。修订协议仍指向 October 2026
              目标交割，早前更新也强调融资承诺和最后截止日管理。Diginex 自身文件让融资问题更严重：20-F 显示现金有限、经营亏损、营运资本吃紧，以及 Nasdaq
              买入价压力。再叠加全股票结构和重度稀释，核心风险就不只是估值波动，而是围绕融资、审批和交割后治理的执行脆弱性。即使 Resulticks 在战略上有吸引力，公开市场壳和融资机制仍可能损害价值实现。
