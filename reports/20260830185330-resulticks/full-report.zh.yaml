  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台架构
        blocks:
          - type: paragraph
            body: >-
              Resulticks 在本报告组里拥有更宽的公开产品呈现。旗舰叙事不是单一营销活动工具，而是一个连接客户数据、身份、编排和互动的整合平台。Resulticks 主站和 RESUL
              网站反复描述一套系统：先统一画像，再跨渠道激活旅程和归因。在这个核心周围，公司展示了几个有名称的模块家族：面向智能体 AI 的 Genie、用于身份和旅程追踪的 SmartDX、服务 Google 生态集成的
              GRAPE、消息基础设施 REACHER，以及面向较低端多渠道打法的 Marketing Star。实际含义是，Resulticks
              看起来采用组合式架构，而不是单体一产品叙事。这在战略上有用，因为公司可以分别回应不同任务——数据统一、消息投放、隐私安全追踪或 SMB 营销活动执行——同时让中央 CDP 和编排层贯穿企业用例。
