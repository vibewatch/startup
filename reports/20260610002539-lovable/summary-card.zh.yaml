summary:
  headline: Lovable 增长速度少见，prompt-to-production 产品切口清晰，也有真实企业信号；但在当前价格下，公开证据仍不足以给出买入级信心，因为企业收入占比、留存、利润率、员工数和股权条款相对估值攀升仍过于不透明。
