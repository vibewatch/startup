company:
  name: Lovable
chapter:
  number: 1
  title: Company Overview
  summary: Lovable is a Stockholm-based Swedish AI app-builder that emerged from the GPT Engineer precursor and launched its current product in November 2024 to let non-technical users build software by chatting with AI. The company moved from a $15 million pre-Series A disclosure to a $200 million Series A at a $1.8 billion valuation in July 2025 and then a $330 million Series B at a $6.6 billion valuation in December 2025, while public revenue disclosures moved from $75 million ARR in July to $200 million ARR by late 2025. Growth has been exceptional, but security and governance diligence remains central after public criticism of Lovable-built app security in 2025 and the company’s own April 2026 incident disclosure.
sections:
- id: identity-and-product
  title: Identity, launch, and product scope
  body: |-
    Lovable is consistently described as a Swedish, Stockholm-based AI startup building an app and website creation platform that turns natural-language prompts into working software. The company’s own positioning is unusually explicit: it is not trying to be just another coding copilot for professional engineers, but a product for the much larger population of builders who have software ideas without the ability or desire to code from scratch. That identity is visible across official materials, third-party interviews, and later financing coverage.

    The timeline matters because public sources use two different clocks. The current Lovable product launched in November 2024, while the product lineage clearly traces back to the 2023 GPT Engineer project created by Anton Osika and then commercialized with Fabian Hedin before the January 2025 rebrand to Lovable. For diligence purposes, the safest overview framing is “2023 roots, 2024 launch, 2025 rebrand consolidation.”

    Lovable also broadened from a prompt-based prototype builder into a fuller platform. By late 2025 and early 2026 the company had added Lovable Cloud, Lovable AI, mobile access, and more security/governance surfaces, allowing users to ship apps with authentication, storage, integrations, and AI features without leaving the platform. That fuller-stack move helps explain why public customer references shifted from prototypes toward production use cases.
