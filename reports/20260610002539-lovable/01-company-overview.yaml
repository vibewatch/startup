- id: funding-scale-and-customers
  title: Funding history, valuation path, and operating scale
  body: |-
    Lovable’s capital formation has been exceptionally compressed. Before the headline rounds, the company disclosed a $15 million Creandum-led financing with unusually strong early metrics: $17 million ARR, 30,000 paying customers, 25,000 new projects per day, and 1.2 million apps built. In July 2025 it then announced a $200 million Series A at a $1.8 billion valuation led by Accel, with 20VC, byFounders, Creandum, Hummingbird, and Visionaries Club among the named participants. TechCrunch’s contemporaneous coverage added several well-known angels and, importantly, tied the round to public traction metrics of 2.3 million active users, 180,000 paying subscribers, $75 million ARR, and a team of roughly 45 full-time employees.

    Momentum accelerated rather than normalized after that round. November 2025 reporting and the company’s own one-year post tied Lovable to $100 million ARR and then $200 million ARR, with 10 million to 25 million projects created and 100,000 projects being built per day. In December 2025 the company raised another $330 million at a $6.6 billion valuation, led by CapitalG and Menlo Ventures’ Anthology fund, with a long list of strategic and financial participants including Khosla, Accel, Creandum, and HubSpot Ventures.

    Customer references are now broad enough to matter for diligence, though not all names are equally well corroborated. Public sources repeatedly point to Klarna, Uber, Zendesk, Deutsche Telekom, and HCA Healthcare, while HubSpot appears once in July 2025 customer coverage and later more clearly as an investor through HubSpot Ventures. The clean takeaway is that Lovable has moved beyond hobbyist adoption into enterprise prototyping and selected production use cases, but exact current customer-account definitions remain under-disclosed.
