  - Outcome or proof quality
  - Limitation
  rows:
  - - Atonom
    - AI-agent startup
    - Lovable-built CRM replacing Salesforce and linked to the company's AI SDR
    - Production
    - Specific workflow, prototype speed, and cost reduction disclosed
    - Company-authored case study with no independent customer or renewal corroboration.
  - - eXp Realty
    - Global brokerage / enterprise
    - Country websites, agent microsites, community platform, and internal AI workflows
    - Production
    - 26-country rollout, 83,000-agent context, 85% ticket reduction, and multimillion-dollar savings claims disclosed
    - Evidence is detailed but still comes from Lovable's own case study.
  - - AppDirect
    - B2B commerce platform
    - BOX site rebuild, CRM/CMS, event operations app, and broader internal app portfolio
    - Production
    - 11 projects, 4 live in production, 80+ apps in build, and first-year savings claims disclosed
    - No contract expansion or multiyear retention metrics disclosed.
  - - Konfide
    - Solo-founder marketplace
    - 229-live-agent marketplace with payments, OAuth, subscriptions, and escrow logic
    - Production launch
    - Founder review names concrete product features and a seven-day build window
    - Self-authored Product Hunt proof is not independently audited.
  - - HubSpot
    - Enterprise SaaS
    - Internal tools, prototypes, and production-ready applications per press references
    - Unclear
    - Named in both Google Cloud and TechCrunch materials, which makes the reference more credible than a single logo wall
    - No direct customer quote, go-live date, or outcome metric disclosed.
  - - HCA Healthcare
    - Healthcare enterprise
    - Internal tools, prototypes, and production-ready applications per Google Cloud press
    - Unclear
    - Named enterprise healthcare reference is strategically important because Lovable is selling into compliance-sensitive workflows
    - Only one partner-authored source names HCA and gives no deployment specifics.
  notes: Public named proof is selective and mixes company-authored customer stories, partner press, and customer-generated reviews. It proves Lovable is being used in real workflows, but not that all named logos are deep, multiyear deployments.
