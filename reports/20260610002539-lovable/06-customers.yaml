tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Representative evidence
  - Strategic value
  - Gap
  rows:
  - - Solo founders and independent builders
    - Buyer, user, and payer are often the same individual or tiny team
    - Konfide, Aneta, KidBoost, FamilyCash, Trustpilot and Product Hunt reviews
    - Drives viral top-of-funnel adoption and monetization from non-technical builders
    - Public revenue and retention by this cohort are undisclosed.
  - - SMB replace-SaaS operators
    - Buyer is a function owner; users are sales, finance, or operations teams; payer is the company
    - Atonom CRM replacement and review references to internal business tools
    - Shows willingness to pay for purpose-fit internal software that replaces legacy SaaS
    - No disclosed ACV, deployment count, or renewal rate by SMB account.
  - - Mid-market cross-functional teams
    - Buyer is a non-technical team leader with engineers reviewing later; users span marketing, HR, sales, and ops
    - AppDirect BOX site, back-office CRM/CMS, event app
    - Supports land-and-expand motion across functions without waiting for core engineering teams
    - No public seat expansion or gross margin data by function.
  - - Large enterprise internal-tool teams
    - Buyer is an enterprise team or admin; users are internal operators; payer is a corporate software budget
    - HCA Healthcare, HubSpot, Microsoft, Uber, Zendesk, Klarna references
    - Important for credibility because it shows Lovable is being evaluated beyond hobbyist use cases
    - Most large-enterprise names lack direct customer quotes, deployment dates, or measured outcomes.
  - - Healthcare practitioners and clinical innovators
    - Buyer and user are clinicians or health-program participants; payer appears to be institution or individual team budget
    - Lovable healthcare page and NHS clinician examples
    - Shows adoption in compliance-sensitive workflows and practitioner-led innovation
    - No audited production count, retention data, or procurement detail for healthcare institutions.
  notes: The segmentation lens emphasizes buyer, user, and payer because Lovable's public file mixes solo creators, department-owned tools, and enterprise teams instead of one uniform SaaS customer archetype.
