- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration or procurement risk
  - Impact
  - Diligence path
  rows:
  - - Replace-SaaS economics
    - A few high-spend internal-tool wins could account for disproportionate ARR if enterprise usage is concentrated in a small set of buyers
    - Could make revenue look diversified by user count while remaining concentrated by spend
    - Request ARR, gross margin, and renewal dates for the top 20 accounts plus average spend by plan and by marketplace channel.
  - - Multi-workflow internal-tool expansion
    - Atonom, eXp, and AppDirect all show one successful build leading to adjacent tools, which is positive but anecdotal
    - Suggests expansion potential inside accounts
    - Request account-level app counts over time and a cohort table showing how many customers expand from one app to multiple apps.
  - - Google Cloud procurement channel
    - Marketplace and Gemini Enterprise reduce friction, but they also risk channel dependence on one procurement route
    - Could skew enterprise pipeline toward partners rather than direct sales motion
    - Request pipeline mix by direct, marketplace, and partner-sourced enterprise deals, including win rates and ACV.
  - - Security and disclosure scrutiny
    - Procurement can still stall if buyers focus on disclosure maturity and prior incidents rather than current controls
    - Can slow expansion in regulated or compliance-heavy accounts
    - Request a churn and delay log for deals influenced by security review, legal review, or incident-related objections.
  - - Proof-base concentration in company-authored stories
    - Public success stories are rich but heavily sourced from Lovable itself
    - Raises risk that public proof overstates independent customer advocacy
    - Request a customer-reference pack with direct customer contacts, renewal dates, and measurable outcomes not authored by Lovable.
  - - Review-driven small-team friction
    - Credits, support, and bug-loop complaints could matter most for self-serve and small-team retention
    - Could cap expansion from enthusiastic first projects into durable subscriptions
    - Request monthly support backlog, refund rate, and churn by support-ticket severity for Pro and Business plans.
  notes: This table separates upside drivers from the diligence needed to prove they are durable. Lovable's public record supports expansion stories but not concentration math.
  claimRefs:
  - CU012
  - CU035
  - CU041
  - CU042
  - CU043
  - CU044
  - CU045
  - CU048
- id: TU006
  title: Customer proof quality table
  columns:
  - Evidence surface
  - Examples
  - What it proves well
  - What it does not prove
  - Chapter implication
  rows:
  - - Lovable-authored case studies
    - Atonom, eXp Realty, AppDirect, Aneta
    - Specific workflows, speed, and cost-replacement logic
    - Independent verification, renewal durability, or concentration
    - Best source for workflow detail, but still marketing-adjacent.
  - - Partner or press references
    - Google Cloud press, TechCrunch, TNW
    - Named enterprise logos and enterprise-procurement context
    - Depth of deployment inside each named logo
    - Useful for referenceability and buyer motion, weaker for quantified proof.
  - - Review marketplaces
    - Product Hunt and Trustpilot
    - Broad satisfaction signal, complaint patterns, and product strengths or weaknesses
    - Contract value, production scale, or true enterprise retention
    - Good for sentiment and friction, not for concentration or ACV.
  - - Reference aggregators
    - FeaturedCustomers
    - Evidence that third parties are packaging Lovable customer references and case studies
    - Whether every listed reference is current, production, or attributable to large spend
    - Helpful corroboration that the ecosystem sees a customer story worth cataloging.
  - - Technographic database
    - Apps Run The World
    - A different lens on visible installations and firmographics
    - Completeness or accuracy for Lovable's full installed base
    - Useful counterweight to the enterprise-logo narrative because it skews smaller and more operational.
  notes: Proof quality matters because Lovable has both very broad aggregate usage and a much narrower set of deeply evidenced named deployments. Investors should not treat those two layers as interchangeable.
