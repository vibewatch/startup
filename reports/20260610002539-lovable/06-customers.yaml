- id: durability-reviews-and-concentration-gaps
  title: Durability, reviews, and concentration gaps
  body: 'The durability story is where Lovable''s customer evidence thins out. Review and testimonial surfaces are directionally positive: users consistently praise speed, polished UI, and the ability to build real software without a large engineering team. Trustpilot''s archived snapshot shows high volume and mixed-but-positive sentiment, while Product Hunt and Lovable''s own review page show recurring enthusiasm from founders and operators who could ship quickly. At the same time, the same surfaces repeatedly surface the same friction points: credits feel expensive, support can be weak or slow, and complex projects can trigger bug loops or architectural dead ends. IJONIS is especially explicit that Lovable is superb for prototypes and MVPs but not yet a full substitute for professional engineering tooling in complex or compliance-heavy environments.


    Enterprise procurement adds a second layer of friction. Google Cloud Marketplace availability, SSO, SCIM, audit trails, and security-center tooling all help, and they clearly show Lovable understands what large buyers ask for. But they do not erase the procurement burden created by earlier security incidents and disclosure concerns. Harper Foley and ToolJet both argue, from different angles, that disclosure maturity and architectural control are now part of the buying decision for AI-generated application platforms. Most importantly, the public record still does not answer the key underwriting questions: there is no disclosed NRR, GRR, contract length, top-customer concentration, or revenue dependence by cohort. The exact diligence ask is therefore straightforward: management should produce cohort retention tables, contract-term summaries, and a top-customer exposure schedule before anyone mistakes adoption breadth for durable recurring revenue quality.'
