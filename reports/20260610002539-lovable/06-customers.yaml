- id: TU004
  title: Retention / repeat usage / satisfaction table
  columns:
  - Metric
  - Value
  - Segment
  - Confidence
  - Diligence ask
  rows:
  - - Net revenue retention
    - null
    - All paid cohorts
    - low
    - Request monthly NRR by Free-to-Paid, Pro, Business, and Enterprise cohorts from launch through the current quarter.
  - - Gross revenue retention
    - null
    - All paid cohorts
    - low
    - Request GRR by plan tier and by signup quarter, plus the revenue impact of downgrades versus full churn.
  - - Logo retention / churn
    - null
    - Self-serve, SMB, and enterprise accounts
    - low
    - Request logo churn, paid-account churn, and active-project churn by quarter, with separate treatment for abandoned projects and cancelled subscriptions.
  - - Contract length / renewal term
    - null
    - Business and Enterprise accounts
    - low
    - Request median initial term, renewal rate, auto-renew terms, and cancellation windows for the top 20 enterprise contracts.
  - - Review sentiment proxy
    - 4.1/5 Trustpilot and 4.7/5 FeaturedCustomers; Product Hunt broadly positive but mixed on cost and complexity
    - Broad review surfaces
    - medium
    - Request cohort retention for customers with support tickets versus those without, so sentiment can be tied to actual renewal outcomes.
  - - Expansion proxy from named cases
    - Atonom, eXp Realty, and AppDirect each expanded from one workflow into multiple internal tools
    - Named case-study cohort
    - medium
    - Request 6-, 12-, and 18-month expansion data by account, including credits, cloud spend, app count, and attached users.
  notes: Nulls are deliberate where Lovable's public file lacks retention-grade metrics. Review scores and expansion anecdotes are directional proxies, not substitutes for cohort retention or contract-renewal data.
