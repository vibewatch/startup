company:
  name: Lovable
chapter:
  number: 6
  title: Customers
  summary: Lovable has genuine customer traction across both bottom-up builders and increasingly visible enterprise teams, with the strongest public proofs coming from detailed replace-SaaS or internal-tool case studies such as Atonom, eXp Realty, and AppDirect. But the public record still does not convert those wins into retention, contract-durability, or concentration metrics, and some marquee enterprise names are better supported as references than as deeply documented deployments.
sections:
- id: segment-mix-and-adoption-trajectory
  title: Segment mix and adoption trajectory
  body: 'Lovable''s customer base should be read as a layered stack, not a single enterprise SaaS list. At the top of the funnel it has millions of users and a very large pool of non-technical builders. Lovable''s own build-economy report says 80% of builders are in non-technical roles and that they are building practical software like CRMs, HR tools, inventory systems, and e-commerce storefronts. TechCrunch''s June 2026 profile reinforces that the product is being used by founders, designers, and salespeople rather than only developers. That matters because it explains why broad usage counts are so large: Lovable is expanding software creation to people who historically would have bought software or waited for an internal engineering queue.


    The adoption curve is real, but diligence must keep aggregate counts separate from named deployments. Public sources support a progression from 2.3 million active users and 180,000 paying subscribers in July 2025 to roughly 8 million users by March 2026, with more than 50 million projects built and around 1 million new projects a week by June 2026. Those are impressive scale markers, and the build-economy report adds downstream traffic of 600 million to 720 million visits per month to Lovable-built apps. Still, none of those metrics says how many accounts are retained, how many are budgeted enterprise relationships, or how many projects survive into durable production use. That distinction is central to this chapter: broad usage is proven, while customer durability remains much less disclosed.'
