figures:
- id: FU001
  title: Lovable customer journey map
  type: journey-map
  layout: standard
  summary: Maps the common path from an initial builder or team need to production deployment and account expansion, highlighting where support, security, and procurement friction appear.
  data:
    items:
    - label: Problem owner
      value: Founder, operator, marketer, clinician, or department lead without enough engineering capacity
      note: Lovable's build-economy report says most builders are non-technical, so the journey often starts with the person closest to the workflow pain point.
    - label: First build
      value: Prototype or internal tool assembled in hours or days with prompts, reviews, and integrations
      note: Atonom, Aneta, and AppDirect all describe extremely fast first-build cycles.
    - label: Operational validation
      value: Team starts using the app for CRM, websites, events, HR, or healthcare workflows
      note: This is the step where Lovable stops being a demo and becomes workflow software.
    - label: Governance checkpoint
      value: Security scans, approvals, SSO, audit trails, and procurement review for larger teams
      note: Google Cloud Marketplace availability and Lovable's security controls are meant to reduce this friction, not eliminate it.
    - label: Expansion or stall
      value: Successful accounts replace more SaaS or add more apps; unhappy accounts hit support, cost, or complexity limits
      note: Named case studies show expansion, while reviews and adverse security commentary show the main stalling forces.
  claimRefs:
