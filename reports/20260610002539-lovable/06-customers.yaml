  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: Net revenue retention, gross revenue retention, logo churn, and cohort retention by self-serve, SMB, Business, and Enterprise segments.
    whyItMatters: Public customer proof is strong on adoption and logos but weak on whether usage turns into durable recurring revenue.
    diligencePath: Request monthly cohort tables since launch, including starting ARR, expansion ARR, contraction ARR, churned ARR, and logo counts by plan tier.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: contract-terms
    missingEvidence: Median initial term length, renewal cadence, gross renewal rate, auto-renew mechanics, and cancellation windows for Business and Enterprise contracts.
    whyItMatters: Without contract-term visibility, the investment case cannot separate trial-heavy adoption from multiyear budgeted software relationships.
    diligencePath: Request the current standard order form, top-20 enterprise contract summaries, and a retention waterfall showing term start, renewal, and churn dates.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 and top-20 customer ARR share, cloud-usage concentration, and revenue exposure to Google Marketplace or other channel partners.
    whyItMatters: Logo breadth does not rule out concentration if a small number of enterprise or marketplace-linked accounts drive a disproportionate share of revenue.
    diligencePath: Request a customer concentration schedule with ARR, gross margin, cloud spend, and renewal dates for the top 20 accounts and top 5 channels.
    relatedQuestionRefs:
    - QU026
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-coverage
    missingEvidence: A comprehensive customer list separating logos, pilots, internal tools, production deployments, and measurable outcomes.
    whyItMatters: Public references are selective and mix customer-authored reviews, partner press, and Lovable-authored success stories, which can overstate proof quality.
    diligencePath: Request a named customer ledger with segment, plan tier, deployment type, go-live date, and a direct customer reference or success metric for each account.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU003
