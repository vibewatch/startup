- id: recommendation
  title: 'Recommendation: fair enough at the last close to stay engaged, but not strong enough for a public-only buy'
  body: 'The right public-only call is research-more with medium confidence, high risk, and a fair-at-last-close but stretched-on-next-step valuation stance. The last closed $6.6 billion round can be defended if investors believe the current $500 million run rate is durable, if self-serve demand stays monetizable, and if enterprise adoption keeps climbing. That is the bull logic, and it is not imaginary. But the anti-thesis is at least as strong: public evidence still cannot show whether Lovable is building a durable software company or a very fast-moving self-serve funnel with thin enterprise quality and unknown margin structure. Forbes'' report that enterprise ARR is only about $20 million is especially important because it implies the part of revenue that usually deserves the highest multiple remains a small share of the whole. The same evidence gap makes the rumored $12 billion next round much harder to support. At that price, investors would again be underwriting a sharp premium over
    public software and would need confidence in retention, contribution margin, and cap-table cleanliness that the public file simply does not provide. So the company still looks impressive, but the stock-picking answer is not whether Lovable is good—it is whether the evidence justifies paying up today. On public evidence alone, it does not.'
