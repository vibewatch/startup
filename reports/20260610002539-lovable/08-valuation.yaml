- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - direction
  - argument
  - what would change the view
  rows:
  - - thesis
    - The last closed $6.6B round screens far less aggressive on a current $500M run-rate than it did on the December 2025 denominator.
    - Audited revenue below current run-rate or evidence that a large share is one-time or non-recurring would weaken the case immediately.
  - - thesis
    - Lovable has shown unusually fast product adoption and monetization velocity, which is exactly what private AI investors still reward.
    - A meaningful slowdown in project creation, paid conversion, or monetized usage would narrow the scarcity premium quickly.
  - - thesis
    - Private AI coding rounds such as Cognition and Vercel show investors still tolerate premiums for category leaders before public-company disclosure exists.
    - If private AI coding rounds reset lower or secondary pricing weakens materially, Lovable loses a major support beam.
  - - anti-thesis
    - 'Most public revenue quality signals remain missing: gross margin, retention, enterprise mix, burn, and preference stack are not publicly disclosed.'
    - Data-room disclosure showing strong cohort retention, healthy contribution margin, and clean liquidation terms would materially improve conviction.
  - - anti-thesis
    - Forbes reported only about $20M of ARR is enterprise, which weakens the argument that the whole run-rate deserves enterprise-grade multiples.
    - Proof that enterprise ARR is compounding rapidly and pulling retention above self-serve benchmarks would support higher pricing.
  - - anti-thesis
    - Security scrutiny creates a direct valuation risk because enterprise buyers and later-stage investors discount tools they view as unsafe by default.
    - A long clean operating period plus clear evidence that secure-by-default deployment is improving would reduce the risk discount.
  notes: Arguments are framed around what the current and rumored prices already assume, not around whether Lovable is an impressive product.
