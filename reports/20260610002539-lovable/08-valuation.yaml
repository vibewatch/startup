  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: enterprise-arr-mix
    missingEvidence: Segmented ARR, NRR, and gross retention by self-serve, prosumer, and enterprise cohorts.
    whyItMatters: Public valuation support changes materially if only a small share of revenue is enterprise-quality and retention-backed.
    diligencePath: Request a cohort-retention deck and revenue bridge from finance and revenue operations.
    relatedQuestionRefs:
    - QV009
    - QV032
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-overhang
    missingEvidence: Share classes, preference stack, participation rights, and any ratchets or side letters from prior rounds.
    whyItMatters: Return outcomes can look attractive on headline valuation and still disappoint after preferences and dilution are applied.
    diligencePath: Obtain a counsel-reviewed cap table and waterfall model before underwriting any new-money return case.
    relatedQuestionRefs:
    - QV011
    - QV032
  - type: conflicting-data
    severity: material
    topic: next-round-support
    missingEvidence: A signed term sheet or board-approved financing memo confirming whether the rumored $12B round exists and on what investor protections.
    whyItMatters: The biggest current price-sensitivity question is whether Lovable is really clearing a new round above the last close or merely testing the market.
    diligencePath: Review the latest financing materials directly with management and counsel.
    relatedQuestionRefs:
    - QV027
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, infrastructure spend, support cost, and paid conversion economics by segment.
    whyItMatters: A builder with heavy pass-through cost or weak retained economics should not be valued like high-quality software on the same run-rate.
    diligencePath: Request a margin bridge and vendor-spend schedule tied to revenue cohorts.
    relatedQuestionRefs:
    - QV032
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set-coverage-tv004
    missingEvidence: Live directly fetchable historical private no-code valuation sources for Bubble, Webflow, and Replit were not all available in this run.
    whyItMatters: The comparable table is intentionally partial, so readers should treat it as a decision frame rather than an exhaustive market map.
    diligencePath: Refresh the comp set with additional live private-round sources or secondaries before the next report update.
    relatedQuestionRefs:
    - QV013
    - QV018
    - QV020
    relatedTableRefs:
    - TV004
