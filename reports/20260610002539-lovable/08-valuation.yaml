- id: comparable-frame
  title: 'Comparable frame: public software gives the floor, while private AI coding rounds show how much scarcity still matters'
  body: The cleanest way to frame Lovable is as a private AI builder sitting between mature public software and hotter private AI coding rounds. The public anchor is useful because it puts a ceiling on how much premium the market usually affords scaled software with known economics. GitLab sits around a $5.1 billion market cap, JFrog around $9.8 billion, MongoDB around $27.4 billion, ServiceNow around $110.3 billion, and Wix around $2.0 billion, while rough market-cap-to-revenue proxies for GitLab, JFrog, MongoDB, and ServiceNow cluster around roughly 7x to 16x. Those are imperfect because they mix annualized quarterly revenue, trailing revenue, and market cap instead of EV, but they still show what public investors pay for software businesses with disclosed economics. Private AI coding rounds, however, are still richer and less transparent. Cognition raised at roughly $26 billion post-money while near a $492 million annualized run rate; Vercel announced a $9.3 billion post-money Series
    F and highlighted 82% top-line growth plus meaningful enterprise mix in v0; and Factory raised at $1.5 billion despite earlier scale. The message is not that Lovable is cheap. It is that private buyers are still willing to pay for AI coding leaders before the public market would fully validate the same economics.
