- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - current metric
  - multiple / valuation status
  - relevance
  - limitation
  rows:
  - - GitLab
    - ~$5.11B market cap; ~$0.759B revenue reference
    - ~6.7x rough market-cap/revenue proxy
    - Public developer-tool anchor with disclosed economics and real enterprise exposure.
    - Revenue and market-cap snapshots are from different dates; market cap is not enterprise value.
  - - JFrog
    - ~$9.84B market cap; $154.0M Q1 2026 revenue
    - ~16.0x rough annualized market-cap/revenue proxy
    - AI-adjacent developer infrastructure comp with visible cloud growth and ARR data.
    - Uses annualized quarterly revenue and market cap, not reported EV/NTM revenue.
  - - MongoDB
    - ~$27.36B market cap; $687.6M Q1 FY2027 revenue
    - ~10.0x rough annualized market-cap/revenue proxy
    - Premium developer platform comp showing what public investors pay for scaled growth.
    - Business model is broader and more mature than Lovable's builder workflow.
  - - ServiceNow
    - ~$110.31B market cap; ~$13.278B revenue reference
    - ~8.3x rough market-cap/revenue proxy
    - Workflow and low-code adjacency provide a scale benchmark for enterprise automation software.
    - Far more mature and diversified than Lovable, so it is a ceiling check, not a like-for-like comp.
  - - Wix
    - ~$2.01B market cap; 200M+ users disclosed
    - Mature no-code / website-builder market anchor
    - Useful reminder that large user bases and visual building tools do not guarantee premium valuation persistence.
    - No direct revenue multiple retained here, so relevance is directional rather than formulaic.
  - - Vercel
    - $9.3B Series F post-money; 82% top-line growth; 3.5M+ v0 users
    - Premium private builder / infrastructure comp
    - Closest private benchmark for AI-native building plus deployment and enterprise workflow.
    - Revenue is not fully disclosed, so valuation cannot be normalized cleanly.
  - - Cognition
    - $26B post-money; ~$492M annualized revenue run rate
    - ~53x run-rate proxy
    - Shows how aggressively private investors still value frontier AI coding leaders.
    - Run-rate and valuation both come from private-round reporting rather than audited public filings.
  - - Factory
    - $1.5B valuation on April 2026 round
    - Earlier-stage private AI coding comp
    - Relevant as a lower-scale enterprise AI coding reference.
    - No clean public revenue denominator retained for multiple work.
  - - Lovable last close
    - $6.6B valuation; ~$500M current run-rate proxy
    - ~13x current run-rate proxy
    - Current round screens inside the wider private-AI and premium-public-software zone if the denominator is real.
    - Revenue quality and enterprise mix are weaker and less disclosed than the headline multiple implies.
  notes: This is a partial but decision-useful comparable set covering retained public and private AI-devtools and no-code references with directly fetched valuation evidence in this run.
