chapter:
  number: 7
  title: Risks
  summary: >-
    Lovable carries a high-but-not-fatal risk profile led by recent access-control failures, dense privacy and
    vendor-transfer obligations, and real dependence on third-party cloud, model, billing, and identity infrastructure.
    The upside remains significant, but investors should not underwrite an enterprise-grade trust narrative until
    diligence closes the incident-notice, customer-concentration, and independent-security-assurance gaps.
sections:
  - id: ranked-risk-view
    title: Ranked risk view and thesis-break framing
    body: >-
      Lovable’s risk stack is headed by security and access-control risk, then privacy and AI-governance exposure, then
      provider dependence and economic opacity. The April 2026 public-project incident matters because it was not a
      hypothetical edge case: the company says chat history and source code for public projects could be accessed by any
      authenticated user with a link for more than two months, and that valid reports were closed without escalation
      because its HackerOne triage documentation was stale. The earlier Vidoc write-up matters for a different reason:
      it shows how much trust-boundary complexity sits underneath Lovable’s fast product surface. Repeated 2026
      status-page incidents add operational evidence that service reliability is still maturing. None of this kills the
      company outright, but it changes the burden of proof. Investors should treat Lovable as a promising but still
      hard-to-underwrite platform until diligence confirms incident-notification handling, vendor concentration,
      enterprise renewals, and the depth of controls beyond public marketing pages.
    claimRefs:
      - CR013
      - CR014
      - CR021
      - CR029
      - CR031
      - CR040
      - CR044
      - CR045
      - CR052
    tableRefs:
      - TR005
    figureRefs:
      - FR001
      - FR002
  - id: legal-privacy-and-ip
    title: Legal, privacy, AI-governance, and IP risks
    body: >-
      Legal and privacy exposure is structurally high because Lovable processes code, prompts, telemetry, credentials,
      and domain-registration data while routing work across multiple legal regimes and multiple providers. The privacy
      policy and DPA are helpful in that they explicitly separate free/pro versus enterprise treatment and spell out
      processor-versus-controller boundaries, but they also push material duties back to the customer: lawful basis,
      secure configuration, backups, and the decision not to upload HIPAA or other sensitive data. That means Lovable
      can be a software vendor and still leave deployment-level compliance risk with the buyer. AI-specific regulation
      compounds the issue. The EU AI Act and ICO guidance keep fairness, transparency, accountability, and
      fundamental-rights analysis squarely in play for AI systems, and Lovable’s own terms ban unreviewed use in
      medical, legal, financial, and safety-critical settings. IP and continuity risk are also non-trivial because
      Lovable reserves the right to reclaim lovable.app subdomains and usernames, while custom-domain users must handle
      their own reverse-proxy layer if they need it. Public materials retained for this run do not disclose a named
      regulator notice or litigation schedule, so investors should request that evidence directly instead of assuming
      silence equals clean posture.
