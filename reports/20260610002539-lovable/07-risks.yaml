  - id: TR004
    title: People / execution risk register
    columns:
      - Role / function
      - Dependency or gap
      - Likelihood
      - Severity
      - Mitigation evidence
      - Diligence path
    rows:
      - - Security leadership and triage governance
        - The April 2026 incident shows that vulnerability reporting and product-state documentation fell out of sync.
        - High
        - High
        - Lovable disclosed the miss, said it retrained triagers, and says security tooling is expanding.
        - >-
          Meet the security lead, review escalation SLAs, and inspect monthly metrics on time-to-triage, reopen rates,
          and externally reported issues.
      - - Privacy and compliance operations
        - >-
          A multi-region product with AI, cloud, domains, and enterprise contracts needs strong privacy, AI-governance,
          and customer-trust operations.
        - Medium
        - High
        - Lovable names a DPO and provides DPA, data-residency, and access-governance documentation.
        - >-
          Request org chart, DPIA and RoPA ownership, and the roadmap for EU AI Act readiness and regulated-customer
          onboarding.
      - - Customer success and support coverage
        - >-
          Official support is limited to paying workspaces and excludes project-specific debugging or third-party
          implementation guidance.
        - Medium
        - Medium
        - AI first-response and community channels can absorb some low-end load.
        - >-
          Inspect support staffing, SLA performance, enterprise TAM-to-CSM ratios, and escalation paths for production
          incidents.
      - - Finance and pricing discipline
        - >-
          A credit-plus-usage model can obscure true unit economics if model, cloud, and support costs move faster than
          pricing.
        - High
        - High
        - Lovable publishes plan tables, top-ups, and usage explanations.
        - >-
          Request gross margin by plan, cloud/model COGS bridge, and cohort behavior around top-ups, overages, and
          downgrades.
      - - GTM and referenceability
        - >-
          Public enterprise proof is still concentrated in company-authored stories rather than in independent retention
          data or customer contracts.
        - Medium
        - Medium
        - Named stories across well-known logos show real interest and use cases.
        - >-
          Request third-party references, signed expansion data, and the top-customer schedule to test whether
          lighthouse stories represent the broader base.
    notes: >-
      Execution risk here comes less from founder charisma and more from whether internal process, support, and
      compliance scale as fast as product distribution.
