  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Why it matters
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
    rows:
      - - Project-visibility or remix misconfiguration
        - >-
          Public remixing, preview links, or permissive publish settings can expose code, chat history, or sensitive
          implementation details if teams misunderstand the access model.
        - High
        - High
        - Improving, but still setting-dependent and tier-dependent.
        - >-
          Verify admin defaults, historical project states, and secret-scanning hygiene before assuming customer work is
          safely compartmentalized.
      - - Sandbox or auth trust-boundary failure
        - >-
          Vidoc’s 2025 exploit chain shows how small configuration mistakes inside a multi-tenant sandboxed architecture
          can cascade into account-level compromise.
        - Medium
        - High
        - Point fixes appear fast and the platform now exposes stronger security tooling.
        - Need recurring external pentests and boundary reviews, not just fast patches after discovery.
      - - Shared-responsibility scan gap
        - >-
          Lovable explicitly says its scans do not replace a thorough security review and that frontend code is always
          public and untrusted.
        - High
        - High
        - Basic and Deep scans, scheduled scans, Aikido pentests, Wiz scanning, and secret masking are real mitigations.
        - >-
          Request external assurance artifacts and sample pre-publish escalation data to see how often scanning actually
          changes ship decisions.
      - - Service reliability and operational instability
        - >-
          The status feed shows repeated incidents across preview, cloud, uploads, chat, login, and gateway services in
          May and June 2026.
        - High
        - Medium
        - Backups, regional hosting, and a public status page exist.
        - >-
          Need SLO history, RCA cadence, and customer credit or support policies before treating Lovable as
          production-grade critical infrastructure.
      - - Connector and secret sprawl
        - >-
          Remote MCP connectors, external collaborators, cloud integrations, and secret storage multiply the surfaces
          that can leak or misuse data.
        - Medium
        - Medium
        - Role-based permissions, security center visibility, and secret masking help narrow the blast radius.
        - >-
          Review connector approval workflows, secret rotation rates, least-privilege enforcement, and auditability on
          enterprise workspaces.
    notes: >-
      This register focuses on security and operational failure modes that can hit multiple customers at once; it is not
      a substitute for customer-specific app review.
