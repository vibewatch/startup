figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      The highest-residual risks sit in access control, privacy/vendor governance, and provider dependence rather than
      in simple feature-delivery noise.
    data:
      columns:
        - Low impact
        - Medium impact
        - High impact
      rows:
        - label: High likelihood
          values:
            - label: Support friction
              tone: neutral
              detail: Paid-only official support and AI-first routing can frustrate lower-tier or fast-growing teams.
            - label: Usage-cost volatility
              tone: risk
              detail: Credit plus usage pricing can surprise customers and pressure margin assumptions.
            - label: Privacy / vendor oversight burden
              tone: risk
              detail: Multi-provider data flows keep legal and security diligence continuously active.
        - label: Medium likelihood
          values:
            - label: Reference proof stays thin
              tone: neutral
              detail: Public stories may be real but still fail to represent broader retention quality.
            - label: Repeated availability incidents
              tone: risk
              detail: Status-page frequency suggests reliability still needs to mature for mission-critical use.
            - label: Another access-control lapse
              tone: risk
              detail: Recent incident history raises the consequence of any future visibility or boundary regression.
        - label: Low likelihood
          values:
            - label: Routine feature delay
              tone: positive
              detail: Incremental product slip is unlikely to be the core thesis-break driver by itself.
            - label: Domain / username dispute
              tone: neutral
              detail: Continuity issues are manageable if customers use custom domains and migration plans.
            - label: Formal enforcement or major suit
              tone: risk
              detail: >-
                Public evidence is incomplete, but any named regulator action or lawsuit would be disproportionately
                damaging.
    claimRefs:
      - CR013
      - CR021
      - CR029
      - CR031
      - CR040
      - CR044
      - CR052
