tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk
      - Public evidence
      - Likelihood
      - Severity
      - Current mitigation evidence
      - Residual exposure / diligence path
    rows:
      - - Cross-border privacy and controller/processor ambiguity
        - >-
          Lovable routes customer data through Supabase and multiple AI or billing providers while also reserving
          controller treatment for service, log, aggregated, and de-identified data.
        - High
        - High
        - DPA, named DPO, regional hosting options, and plan-tier privacy documents exist.
        - >-
          Request RoPA/DPIA package, transfer impact assessments, subprocessor contracts, and evidence that controller
          and processor datasets are segregated operationally.
      - - AI-governance and high-risk use-case exposure
        - >-
          The EU AI Act and ICO guidance keep fairness, transparency, accountability, and DPIA-style governance in
          scope, while Lovable terms ban unreviewed use in medical, legal, financial, and safety-critical contexts.
        - Medium
        - High
        - Terms restrict obvious high-risk use and upper tiers add stronger access and publishing controls.
        - >-
          Review customer use-case mix, policy enforcement, and enterprise controls for regulated deployments before
          treating Lovable as a general-purpose enterprise platform.
      - - Incident-notification and access-control liability
        - >-
          Lovable says public-project chat history and source code were exposed from February 3 to April 20, 2026, and
          that valid reports were closed without escalation.
        - High
        - High
        - The company says it fixed the issue quickly, privatized public projects, and retrained triage workflows.
        - >-
          Obtain the full postmortem, breach-notification decisions by jurisdiction, counsel memos, and any regulator
          correspondence tied to the incident.
      - - IP, subdomain, and continuity risk
        - >-
          Lovable can reclaim lovable.app subdomains and usernames, while custom-domain users must manage any CDN or
          reverse-proxy layer they place in front of the service.
        - Medium
        - Medium
        - >-
          Custom domains, transfer-out support, WHOIS privacy controls, and workspace-level domain management are
          documented.
        - >-
          Review indemnities, DMCA or trademark notice logs, registrar agreements, and migration paths away from
          lovable.app or a customer-run proxy.
      - - Public enforcement and litigation posture still unverified
        - >-
          The public legal docs and incident post reviewed in this run do not disclose a named regulator notice, public
          lawsuit, or litigation schedule.
        - Medium
        - Medium
        - No direct negative case was retained in the public source set for this run.
        - >-
          Request a litigation schedule, threatened-claims log, and board-level legal update rather than treating public
          silence as proof of clean posture.
    notes: >-
      Severity reflects investment consequence if the issue becomes real; the last row is intentionally framed as an
      unresolved public-record gap rather than as proof that no case exists.
    enumerationScope:
      coverage: exhaustive
      basis: >-
        This register captures the named legal and regulatory risks surfaced in the retained public source set for this
        run: privacy, AI-governance, incident liability, IP/domain continuity, and undisclosed litigation or enforcement
        posture.
