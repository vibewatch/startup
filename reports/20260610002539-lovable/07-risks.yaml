  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk domain
      - Monitorable trigger
      - Threshold / event
      - Investment implication
    rows:
      - - Access control and incident handling
        - Incident binder completeness
        - >-
          Management cannot produce a complete timeline, notice log, and jurisdiction-by-jurisdiction legal assessment
          for the April 2026 exposure.
        - Pause or materially reprice because trust, compliance, and enterprise readiness are not yet underwritten.
      - - Independent security assurance
        - External evidence of control quality
        - >-
          No current pentest, SOC 2 scope, ISO evidence, or control-exception log is shared for the core platform
          surfaces.
        - >-
          Assume residual platform risk remains high and require a discount versus a mature enterprise-security
          narrative.
      - - Provider concentration
        - Supabase or model-vendor sensitivity
        - >-
          One provider accounts for most critical workloads and no credible fallback exists for outages, policy changes,
          or major price moves.
        - Haircut margin and availability assumptions, and treat provider concentration as a core underwriting variable.
      - - Customer durability
        - Top-customer and renewal concentration
        - >-
          Top customers represent an outsized share of ARR or named lighthouse accounts are weak on renewal or
          expansion.
        - Cut growth-quality assumptions and reduce confidence in the enterprise story.
      - - Publish and sharing hygiene
        - Risky project-state prevalence
        - >-
          A material share of customer projects are public, remixable, or missing recent scans despite handling
          sensitive workflows.
        - Conclude that product defaults and admin guardrails still lag enterprise requirements.
      - - Operational maturity
        - Incident frequency and RCA closure
        - Availability incidents stay frequent or RCAs do not drive visible improvement over the next refresh window.
        - Lower multiple tolerance and treat operational drag as a direct input to churn and support burden.
    notes: >-
      These are not predictions; they are the monitorable facts that would convert today’s concerns into thesis-breaking
      evidence.
