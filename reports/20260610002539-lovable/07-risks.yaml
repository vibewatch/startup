  - id: security-platform-and-operations
    title: Security, platform, and operational resilience risks
    body: >-
      Lovable has a credible security story on paper, but the public record shows meaningful residual platform risk.
      Security pages and documentation describe layered controls: role-based permissions, region selection, encrypted
      secrets, row-level-security linting, deep scans, audit logs, scheduled scans, and optional pentesting or Wiz
      integrations. The problem is that Lovable also tells customers those controls do not replace a thorough security
      review and that frontend code is always public and untrusted. The April 2026 incident and the October 2025 Vidoc
      exploit chain show why that disclaimer matters. In both cases, the challenge was not the absence of controls in
      the abstract; it was control interaction, stale process, or trust-boundary complexity under fast-moving product
      changes. Operationally, the status feed shows repeated issues across preview, file upload, chat, AI gateway,
      login, and cloud services during May and June 2026. For an enterprise buyer, that means security maturity and
      service maturity should be treated as improving, not complete. Investors should request postmortems, pentest
      reports, SLO history, and evidence that policy defaults and incident triage now move as quickly as product release
      velocity.
