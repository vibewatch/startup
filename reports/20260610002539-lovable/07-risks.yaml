  evidenceGaps:
    - type: missing-source
      severity: material
      topic: regulatory-notices
      missingEvidence: >-
        A regulator-correspondence log, breach-notification record, and legal memo explaining whether the April 2026
        exposure triggered notices in any jurisdiction.
      whyItMatters: >-
        Without the notice record, investors cannot tell whether the incident is operationally closed but legally still
        open.
      diligencePath: >-
        Request the incident binder, outside-counsel assessment, and jurisdiction-by-jurisdiction notice matrix from
        management.
      relatedQuestionRefs:
        - QR028
      relatedTableRefs:
        - TR001
    - type: missing-source
      severity: material
      topic: litigation-and-ip
      missingEvidence: >-
        A litigation schedule, threatened-claims log, and any DMCA, trademark, or IP dispute record involving Lovable or
        customer deployments.
      whyItMatters: >-
        Public silence is not proof of no claims, and IP or contract disputes could matter disproportionately for a
        code-generation platform.
      diligencePath: Request the board legal pack, outside-counsel confirmations, and a list of threatened or settled disputes.
      relatedQuestionRefs:
        - QR029
      relatedTableRefs:
        - TR001
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: Top-customer ARR, renewal and expansion data, top-10 customer share, and independent reference calls.
      whyItMatters: >-
        Public proof is still concentrated in company-authored stories, so the durability and concentration of
        enterprise revenue remain unknown.
      diligencePath: >-
        Request the customer concentration schedule, cohort retention tables, and a curated set of independent
        enterprise references.
      relatedQuestionRefs:
        - QR030
      relatedTableRefs:
        - TR003
    - type: private-evidence-only
      severity: material
      topic: security-assurance
      missingEvidence: >-
        Current SOC 2 report, ISO scope statement, external pentest output, and control-exception log for the core
        platform and publish surface.
      whyItMatters: >-
        Public docs describe tooling and controls, but independent assurance is needed to evaluate residual platform and
        enterprise-readiness risk.
      diligencePath: >-
        Request the trust-center packet, recent pentest reports, remediation tracker, and evidence of how scan findings
        map to shipped fixes.
      relatedQuestionRefs:
        - QR012
        - QR013
      relatedTableRefs:
        - TR002
