  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / channel
      - Failure scenario
      - Likelihood
      - Severity
      - Mitigation evidence
      - Residual exposure
    rows:
      - - Core backend and data plane
        - Supabase / Lovable Cloud
        - >-
          An outage, pricing change, or control problem in the Supabase-based backend affects many customer apps at
          once.
        - High
        - High
        - >-
          Regional hosting, daily backups, logs, and open-source foundations improve portability relative to a closed
          black box.
        - >-
          Need restore drills, vendor terms, migration evidence, and deployment-mix data between Lovable Cloud and
          external backends.
      - - Model inference layer
        - OpenAI, Google, OpenRouter, and other AI providers
        - Pricing, retention, policy, or availability changes degrade features or compress Lovable’s margins.
        - High
        - High
        - AI Gateway abstracts multiple providers and the security page says contracts restrict training and retention.
        - Need provider mix, failover coverage, per-feature gross-margin sensitivity, and concentration by model family.
      - - Billing and credit monetization
        - Stripe and Lovable credit system
        - Billing disputes, failed payments, or confusing credit economics slow conversion and cash collection.
        - Medium
        - Medium
        - Top-ups, receipts, and explicit pricing tiers are documented.
        - Request failed-payment trends, refund rates, top-up mix, and revenue-recognition controls.
      - - Domain and network delivery
        - Registrar, DNS, customer CDN/proxy, and status tooling
        - Custom-domain provisioning or regional routing issues take customer sites offline or force manual workarounds.
        - Medium
        - Medium
        - Lovable documents reverse-proxy paths and publishes incidents publicly.
        - >-
          Review domain SLA, incident frequency, proxy best practices, and whether customers need extra processors such
          as Cloudflare in front of Lovable.
      - - Reference-customer concentration
        - Company-published success stories and lighthouse accounts
        - A small set of named stories does not generalize to broader enterprise retention or monetization quality.
        - Medium
        - High
        - There are multiple named stories across sectors and functions.
        - >-
          Need top-customer ARR concentration, renewal cohorts, and independent reference calls to confirm the public
          proof set is representative.
    notes: >-
      Rows mix infrastructure, payment, network, and customer-proof dependencies because each can transmit directly into
      retention, uptime, or valuation.
