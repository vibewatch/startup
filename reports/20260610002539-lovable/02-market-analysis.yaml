  - id: drivers-and-constraints
    title: Adoption drivers, workflow shifts, and governance constraints
    body: >-
      The main demand drivers are speed, labor economics, and the normalization of AI in software workflows. Low-code analysts still anchor the category in faster application delivery and digital transformation, while BLS pay and job-growth data show why organizations continue looking for leverage in software creation. GitHub's developer research suggests AI coding use is already mainstream and collaboration benefits are expected, which helps explain why vendors now package shared workspaces, parallel agents, and one-click publishing rather than only autocomplete. But the same shift introduces constraints. Enterprises need approved tools, identity controls, publishing approvals, and clear data-handling rules or usage moves into shadow AI. Lovable's own security positioning and April 2026 visibility incident make that risk concrete: when non-technical users cannot clearly distinguish project access from published-app access, trust becomes a gating factor for broader deployment. Runtime and hosting costs also matter because adjacent vendors increasingly bundle deployment economics into the buying decision, which raises the bar from prototype quality to production accountability.
    claimRefs:
      - CM005
      - CM007
      - CM022
      - CM023
      - CM024
      - CM025
      - CM026
      - CM034
      - CM035
      - CM036
      - CM037
      - CM038
    tableRefs:
      - TM004
    figureRefs:
      - FM004
  - id: gaps-and-contradictions
    title: Gaps, contradictions, and what remains unproven
    body: >-
      The core analytical risk is treating a fast-moving product cluster as if it already had a settled reporting category. The public evidence base measures low-code broadly, AI coding assistants through developer surveys, and adjacent app builders through vendor positioning and pricing. That is enough to prove a real market is forming, but not enough to produce a clean Lovable-only SAM. It also leaves several buyer questions unresolved: how much demand comes from non-developers versus classic developers, how many teams move from prototype to governed production use, and whether workspace-credit pricing creates durable expansion or mostly low-friction experimentation. Those gaps matter because Lovable sits at the intersection of multiple budget pools. If the company captures software creation work from non-technical teams and prototype-heavy departments, the opportunity can expand beyond developer seats. If adoption remains concentrated in experiments while governance and runtime complexity rise, the monetizable pool could be much smaller than broad low-code TAMs imply. This chapter therefore keeps the surviving dimensions narrow: boundary logic, adjacent market range, buyer map, adoption drivers, and the still-unproven serviceable slice.
    claimRefs:
      - CM019
      - CM037
      - CM038
      - CM039
      - CM040
      - CM041
