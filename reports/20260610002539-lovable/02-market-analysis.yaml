figures:
  - id: FM001
    title: Market sizing lens — where Lovable sits
    type: pyramid
    layout: standard
    summary: Lovable sits inside a narrow AI app-builder slice that is smaller than broad low-code but broader than pure coding-assistant seats.
    data:
      nodes:
        - id: broad
          label: Broad low-code development market
          detail: ~USD 15.7B-15.8B in 2026 across Grand View-derived and Precedence estimates
        - id: adjacent
          label: AI software creation demand layer
          detail: Developer labor, AI coding adoption, and cross-functional app demand support the category but do not isolate a revenue line
        - id: narrow
          label: AI-native app builders with publish / deploy
          detail: Lovable, Replit, Bolt, v0, and Spark indicate a distinct prompt-to-production cluster
        - id: governed
          label: Governed Lovable-relevant slice
          detail: Narrowest serviceable pocket is teams that need collaboration, internal publish, identity, and deployment controls
    approximationNotes: >-
      Only the broad low-code layer carries a defensible dollar estimate from public sources. The inner layers are intentionally qualitative because public datasets do not isolate Lovable's exact category.
    claimRefs:
      - CM015
      - CM016
      - CM017
      - CM018
      - CM019
      - CM040
      - CM041
  - id: FM002
    title: Market estimate range — adjacent low-code market
    type: range
    layout: standard
    summary: Public low-code estimates cluster around USD 15.8B at the low end of comparable 2026 lenses but rise to USD 45.5B when a broader 2025 definition is used.
    data:
      items:
        - label: Grand View-derived low-code 2026
