chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Lovable sits in a narrow but fast-forming AI app-builder layer inside broader low-code software creation and adjacent to AI coding assistants, website builders, and design tools. Public evidence supports a large adjacent market and strong adoption drivers, but it does not isolate a precise standalone TAM for governed prompt-to-production app builders, so this chapter uses multiple sizing lenses and preserves the unresolved gaps.
sections:
  - id: market-boundary
    title: Market boundary and adjacent categories
    body: >-
      Lovable is best understood as a prompt-to-production app builder, not just a coding copilot and not just a no-code site tool. Its own documentation says a project can include frontend, backend, database, authentication, integrations, editable code, and GitHub sync, while the homepage frames the product as creating apps and websites by chatting with AI. That puts Lovable inside a narrow layer of AI-native software creation tools that sits within broader low-code development spend but overlaps with several adjacent categories. Bubble and Glide show the no-code business-app lineage; Webflow shows the AI website-builder edge; Figma Make captures the design-and-prototype edge; and Cursor plus GitHub Copilot represent the coding-assistant edge. Replit, v0, Bolt, and GitHub Spark matter because they confirm a separate cluster of tools that promise prompt-to-app creation and fast publishing. The practical status quo is still a mix of human engineers, agencies, design tools, low-code stacks, and coding assistants stitched together manually rather than one governed workspace.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM009
      - CM010
      - CM011
      - CM012
      - CM013
      - CM014
    tableRefs:
      - TM001
  - id: sizing-lenses
    title: Sizing lenses and estimate range
    body: >-
      Public market data supports a large adjacent opportunity but not a clean Lovable-sized category. Broad low-code estimates cluster around roughly USD 15.7 billion to USD 15.8 billion in 2026 when using Precedence directly or Grand View as a derived CAGR bridge, yet MarketsandMarkets published a much higher USD 45.5 billion figure for 2025. That is too wide a spread to treat as a single consensus TAM, and it likely reflects different definitions of what counts as platform revenue, services, components, or forecast coverage. The strongest numeric lens for Lovable is therefore layered: an outer low-code market, a developer-labor and AI-adoption demand lens showing why software creation tools matter, and a narrower serviceable slice where buyers want prompt-to-deployed applications with collaboration and governance. BLS labor data and GitHub's adoption surveys reinforce demand, but none of the public sources isolates a standalone market for governed vibe-coding platforms. That forces this chapter to preserve multiple lenses rather than invent a false-precision SAM or SOM.
    claimRefs:
      - CM015
      - CM016
      - CM017
      - CM018
      - CM019
      - CM023
      - CM024
      - CM025
      - CM026
      - CM027
      - CM039
      - CM040
      - CM041
