  - id: FM003
    title: Buyer and rollout flow — who starts, who joins, who pays
    type: flow
    layout: wide
    summary: Lovable adoption often begins with one creator but expands into a shared workspace, technical review, and governed rollout once the app proves useful.
    data:
      nodes:
        - id: idea
          label: Idea owner
          detail: Founder, PM, designer, or operator starts from a prompt
        - id: workspace
          label: Shared workspace
          detail: Project becomes collaborative rather than a single-seat coding task
        - id: builder
          label: Technical collaborator
          detail: Engineer or power user connects code, auth, or integrations when needed
        - id: review
          label: Review and control layer
          detail: Approvals, roles, and identity controls matter before wider adoption
        - id: publish
          label: Published or internal app
          detail: Output moves from prototype to live website or internal deployment
        - id: rollout
          label: Department rollout
          detail: Budget owner funds broader use when the workflow becomes durable
      edges:
        - from: idea
          to: workspace
          label: Prototype becomes shared work
        - from: workspace
          to: builder
          label: Complexity brings in technical help
        - from: builder
          to: review
          label: Security and governance checks appear
        - from: review
          to: publish
          label: App is approved for internal or public use
        - from: publish
          to: rollout
          label: Successful use case justifies larger budget
    approximationNotes: >-
      This flow synthesizes Lovable pricing and docs with adjacent vendor positioning. It is a buyer-journey lens, not a measured conversion funnel.
    claimRefs:
      - CM029
      - CM030
      - CM031
      - CM032
      - CM033
      - CM034
  - id: FM004
    title: Adoption funnel — what must happen before recurring spend scales
    type: funnel
    layout: standard
    summary: The monetizable funnel narrows from broad experimentation to the smaller set of use cases that survive governance, publishing, and runtime accountability.
    data:
      items:
        - label: Experimentation
          value: 100
          detail: Many users can start from free or low-friction prompts
        - label: Working prototype
          value: 65
          detail: A subset reaches a useful app or site concept
        - label: Connected workflow
          value: 40
          detail: Data, auth, or integrations are attached
        - label: Published use case
          value: 25
          detail: The app becomes live or internally usable
        - label: Governed rollout
          value: 10
          detail: SSO, approvals, and platform ownership unlock broader budget
    approximationNotes: >-
      Values are ordinal index points to show narrowing stages, not disclosed conversion rates. The funnel is grounded in feature sequencing and buyer requirements visible in product and pricing pages.
    claimRefs:
      - CM034
      - CM035
      - CM036
      - CM037
      - CM038
