summary:
  headline: Lovable has rare growth velocity, a compelling prompt-to-production product wedge, and real
    enterprise signal, but public evidence still does not support buy-grade confidence at current prices
    because enterprise mix, retention, margins, headcount, and cap-table terms remain too opaque relative
    to the valuation climb.
  overallScore: 6.4
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: fair
