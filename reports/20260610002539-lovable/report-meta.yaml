  foundingLocation: Stockholm, Sweden
  headquarters: Stockholm, Sweden
  productSummary: Lovable sells a prompt-to-deploy app-building platform that turns natural-language instructions
    into editable full-stack web apps and websites. The product surface now spans collaborative workspaces,
    code editing, GitHub synchronization, managed backend services through Lovable Cloud, Supabase-based
    data and auth flows, publishing, custom domains, enterprise governance features, and MCP-driven extensions.
  customerFocus: Bottom-up builders such as founders, designers, operators, and business teams, plus growing
    enterprise buyers using Lovable for internal tools, prototypes, and selected production workflows.
  businessModel: 'Hybrid software monetization: shared-workspace subscriptions (for example Pro at $25/month
    and Business at $50), usage-based Lovable Cloud and AI Gateway credits, and custom-priced enterprise
    plans with governance, security, and procurement features.'
