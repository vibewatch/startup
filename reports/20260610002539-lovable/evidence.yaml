evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding
    missingEvidence: >-
      Authoritative incorporation records or a company legal-entity disclosure that reconciles the 2023 precursor with
      the 2024 product launch.
    whyItMatters: Later chapters need one canonical founding date for age, hiring, and valuation-comparison framing.
    diligencePath: >-
      Request legal incorporation documents or an official company profile that states the legal founding date and
      entity history.
    relatedQuestionRefs:
      - QO002
      - QO027
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board seats, observer rights, and any independent director appointments after the 2025 financing rounds.
    whyItMatters: Governance depth and investor control matter for key-person risk, refresh cadence, and later financing analysis.
    diligencePath: >-
      Request cap-table and board materials or management disclosure of board composition, voting agreements, and
      protective provisions.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: A current run-date headcount disclosure or employee-count range from the company.
    whyItMatters: >-
      Headcount is a standard overview KPI and a key denominator for capital efficiency and productivity checks in later
      chapters.
    diligencePath: Ask management for current FTE count by function and reconcile it with any payroll or office-lease evidence.
    relatedQuestionRefs:
      - QO022
      - QO027
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: current-users
    missingEvidence: >-
      A reconciled definition of active users, paying subscribers, paying customers, and enterprise workspaces as of the
      report date.
    whyItMatters: >-
      Public sources mix subscriber, customer, and active-user labels, which can distort later customer concentration
      and monetization analysis.
    diligencePath: >-
      Request a metric glossary and the latest internal KPI dashboard for MAU, active builders, paying subscribers,
      enterprise accounts, and ARR.
    relatedQuestionRefs:
      - QO021
      - QO027
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology still has month-level or inferred dates for several entries.
    missingEvidence: >-
      Exact publication or effective dates for some product launches, early funding disclosures, and infrastructure
      milestones in the chronology.
    whyItMatters: >-
      Later chapters may reuse the milestone table as the single chronology of record, so approximate dates should be
      clearly bounded.
    diligencePath: >-
      Request a company timeline or newsroom export with exact dates for pre-Series A disclosure, Lovable Cloud launch
      month, and acquisition close.
    relatedQuestionRefs:
      - QO017
      - QO019
      - QO027
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: lovable-sam
    missingEvidence: >-
      A third-party dataset that isolates prompt-to-production AI app builders with collaboration and governance as a
      separate revenue category.
    whyItMatters: Without a clean category definition, TAM, SAM, and SOM all remain lens-based and can be overstated.
    diligencePath: >-
      Ask management for internal market segmentation, board materials, or fundraising material that show how Lovable
      itself defines the category.
    relatedQuestionRefs:
      - QM008
      - QM022
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: >-
      Customer-level evidence on who signs contracts, what budget line pays, and how often Lovable expands from one
      workspace to a department deal.
    whyItMatters: Lovable's valuation hinges on whether it sells like a prosumer tool, a team platform, or an enterprise standard.
    diligencePath: Request plan mix, ACV bands, expansion cohorts, and buyer-title data for top enterprise and business accounts.
    relatedQuestionRefs:
      - QM016
      - QM025
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: retention-and-production
    missingEvidence: Retention, publish-to-production conversion, and post-launch usage metrics by customer segment.
    whyItMatters: >-
      Prompt-to-app tools can show high experimentation without durable recurring revenue if projects stall before
      governed deployment.
    diligencePath: >-
      Review retention cohorts, publish rates, infrastructure usage, and case studies showing sustained production use
      six to twelve months after creation.
    relatedQuestionRefs:
      - QM021
      - QM025
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: minor
    topic: non-developer-builder-share
    missingEvidence: Independent measurement of how many Lovable-like users are non-developers versus classic software developers.
    whyItMatters: The upside case depends partly on expanding software creation beyond the existing developer-seat market.
    diligencePath: Ask for user-role mix, onboarding surveys, and active-creator splits between technical and non-technical users.
    relatedQuestionRefs:
      - QM024
      - QM025
  - type: private-evidence-only
    severity: material
    topic: lovable-enterprise-traction
    missingEvidence: >-
      Named enterprise customers, deployment counts, and win-rate or retention evidence for Lovable's team and
      enterprise motion.
    whyItMatters: >-
      Without traction disclosure, it is hard to tell whether Lovable's governance surface is converting into real
      enterprise adoption or is still mostly roadmap and packaging.
    diligencePath: >-
      Request sales pipeline conversion, active enterprise logos, renewal data, and win-loss notes versus Bolt, Replit,
      v0, GitHub, and Webflow.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-credits
    missingEvidence: >-
      Realized Lovable contract pricing, average monthly credit burn by team size, and comparable realized usage
      economics versus Bolt, Replit, and Figma.
    whyItMatters: >-
      Public list prices are not enough to judge gross-margin durability or whether Lovable actually wins on cost in
      production usage.
    diligencePath: >-
      Request anonymized enterprise price sheets, credit-consumption cohorts, gross-margin bridges, and top-up frequency
      by customer segment.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: switching-cost-behavior
    missingEvidence: >-
      Observed customer behavior on export, GitHub sync, migration off-platform, and degree of multi-homing after
      initial app creation.
    whyItMatters: >-
      Lovable's portability may help sales but could weaken retention if customers treat it as a starting point rather
      than a long-lived operating surface.
    diligencePath: >-
      Review telemetry on synced repositories, export frequency, post-export retention, and the share of projects that
      keep publishing through Lovable after code handoff.
    relatedQuestionRefs:
      - QP019
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Latest balance sheet, monthly cash burn, runway model, and any debt or covenant schedule.
    whyItMatters: Without liquidity data, capital adequacy cannot be underwritten even if topline momentum is real.
    diligencePath: Request the last 12 months of cash balance, operating cash flow, board budget, and debt schedule.
    relatedQuestionRefs:
