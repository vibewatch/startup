    whyItMatters: >-
      Revenue quality hinges on whether Lovable is mostly durable enterprise software or a faster-turning self-serve
      credit business.
    diligencePath: Request cohort-level ARR by segment, enterprise logo counts, NRR, GRR, and contract-term distribution.
    relatedQuestionRefs:
