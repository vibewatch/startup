  - id: TU005
    title: 扩张与集中度风险表
    columns:
      - 扩张驱动因素
      - 集中度或采购风险
      - 影响
      - 尽调路径
    rows:
      - - 替代 SaaS 的经济性
        - 如果企业用量集中在少数买方，几个高支出的内部工具客户就可能贡献不成比例的 ARR
        - 按用户数看收入似乎分散，但按支出看仍可能集中
        - 索取前 20 大账户的 ARR、毛利率和续约日期，并按套餐和 marketplace 渠道拆分平均支出。
      - - 多工作流内部工具扩张
        - Atonom、eXp 和 AppDirect 都显示，一个成功构建会延伸到相邻工具；这是正面信号，但仍只是轶事
        - 表明账户内有扩张潜力
        - 索取账户级应用数量的时间序列，以及显示多少客户从一个应用扩张到多个应用的队列表。
      - - Google Cloud 采购渠道
        - Marketplace 和 Gemini Enterprise 降低摩擦，但也让渠道依赖集中到一条采购路径上
        - 企业管线可能更偏向合作伙伴，而不是直销动作
        - 按直销、marketplace 和合作伙伴来源拆分企业交易管线，索取各自胜率和 ACV。
      - - 安全与披露审查
        - 如果买方更关注披露成熟度和既往事件，而不是当前控制，采购仍可能卡住
        - 会拖慢受监管或合规负担重账户的扩张
        - 索取一份流失和延迟日志，覆盖受安全审查、法律审查或事件相关异议影响的交易。
      - - 证明基础集中在公司自写故事
        - 公开成功故事内容丰富，但来源高度集中于 Lovable 自身
        - 公共证明可能高估独立客户背书
        - 索取客户背书包，包含可直接联系的客户、续约日期，以及不是由 Lovable 撰写的可量化结果。
      - - 评论驱动的小团队摩擦
        - credits、支持和缺陷反复相关抱怨，可能最影响自助式和小团队留存
        - 可能限制热情首个项目扩张为稳定订阅
        - 索取 Pro 和 Business 套餐按月支持积压、退款率，以及按支持工单严重度拆分的流失率。
    notes: 本表把上行动因和证明其可持续性所需的尽调拆开。Lovable 的公开记录支持扩张故事，但不支持集中度计算。
