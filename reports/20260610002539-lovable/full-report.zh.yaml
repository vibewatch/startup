      - number: '3.2'
        title: 能力、定价、GTM 和信任姿态正在快速收敛
        blocks:
          - type: paragraph
            body: >-
              Lovable 的公开定价和包装显示，它在有意走出 hobbyists。Pro 标价每月 $25，支持无限用户共享；Business 以 $50 加入 SSO 和团队控制；Enterprise 加入
              SCIM、审计日志和销售主导包装。这让 Lovable 在 self-serve 价格上接近 Bolt，在构建器野心上接近 Replit，并且明显低于 Bubble Team
              或许多企业平台计划的年度合同经济性。但定价本身不是完整竞争故事。Replit 和 Cursor 营销更深的 agent 自主性，v0 把生成与 Vercel 部署绑定，GitHub Spark 把它与
              150-million-developer 平台绑定，Webflow 或 Figma 则把 AI 生成接入已有设计系统和网站工作流。


              信任姿态本身也不再是唯一楔子。Lovable 公开营销 SAML 或 OIDC、SCIM、审批和审计日志，但 Replit、Cursor、Vercel、GitHub、Webflow 和 Figma
              也都宣传有意义的管理员或企业控制面。因此，更耐久的商业问题是：每家厂商已经拥有哪条工作流。Lovable 拥有混合技术 / 非技术团队从提示词到可编辑全栈应用的最快路径。GitHub 和 Cursor
              拥有开发者环境。Webflow 和 Figma 拥有设计和网站工作流。Bubble 和 Glide 拥有 no-code 业务应用用例。这种收敛让 Lovable 必须同时赢在工作流深度和分发上，门槛被抬高了。
