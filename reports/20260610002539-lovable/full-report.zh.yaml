      - number: '2.2'
        title: 规模测算视角和估计区间
        blocks:
          - type: paragraph
            body: >-
              公开市场数据支持一个很大的相邻机会，但不能直接给出一个干净的 Lovable-sized 类别。广义 low-code 估算在 2026 年大致聚集在 USD 15.7 billion 到 USD 15.8
              billion：这是直接使用 Precedence，或用 Grand View 的 CAGR 推导桥接得出的区间；但 MarketsandMarkets 对 2025 年给出了高得多的 USD 45.5
              billion 数字。这个跨度太大，不能当作单一共识 TAM，且很可能反映了平台收入、服务、组件或预测覆盖范围定义不同。Lovable 最强的数字视角因此应分层：外层 low-code 市场；开发者劳动力和 AI
              采用需求视角，用来解释为什么软件创建工具重要；再加一个更窄的可服务切片，即买家需要带协作和治理的 prompt-to-deployed applications。BLS 劳动力数据和 GitHub
              采用调查加强了需求判断，但没有任何公开来源单独隔离出「受治理 vibe-coding 平台」市场。因此本章必须保留多个视角，而不是编造一个虚假精确的 SAM 或 SOM。
