  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 企业客户结构与留存
        - 按自助式、专业消费者和企业拆分 ARR，并按队列提供 NRR 和总 logo 留存。
        - 这是高溢价软件倍数与高速但低质量的消费者式收入运行率之间的核心桥梁。
        - CFO 数据室、队列材料和客户级续约分析。
      - - 毛利率与使用经济性
        - 按客户分层拆分托管、模型、支持和点数充值利润率。
        - 如果构建器有较高基础设施转嫁成本，即便头部收入相同，也不应按纯软件交易。
        - 财务团队的利润率桥表，加基础设施供应商合同。
      - - 股权结构表与优先股堆叠
        - 股份类别、清算优先权、棘轮条款、参与权和任何附函。
        - 即便表面估值标题不变，回报数学也可能显著变化。
        - 经律师审阅的股权结构表导出和瀑布模型。
      - - 安全与信任轨迹
        - 补救历史、渗透测试节奏、默认安全的产品改动，以及企业事件披露。
        - 信任事件会先改变采用质量，可能在明显冲击收入前就压缩倍数。
        - 安全负责人评审、审计材料和企业客户访谈。
      - - 轮次条款与传闻对照
        - 是否确有新融资接近 $12B 成交，以及附带哪些投资人保护。
        - 下一轮上行是关键的价格敏感问题；平轮或结构化轮次会实质改变判断。
        - 董事会材料、已签条款清单和律师出具的投资人权利摘要。
    notes: 每一项索取都指向同一个问题：补上证据质量缺口，区分可跟踪的动量故事和当下可投资的价格。
    claimRefs:
