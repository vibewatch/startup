  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 品类
      - 规模 / 融资
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - Lovable
        - 直接 AI 应用构建器
        - 私营创业公司；公开可见自助服务加企业销售动作
        - 产品团队、创始人、运营人员、技术和非技术混合构建者
        - 生成全栈应用，代码可编辑，可同步 GitHub，共享工作区，分层治理
        - 保留来源没有公开量化装机基础和企业牵引力
      - - Bolt
        - 直接 AI 应用构建器
        - StackBlitz 旗下产品，提供自助服务和企业包装
        - 重视设计的构建者，以及想要快速托管产出的团队
        - 提示词到应用流程、设计系统导入、基于 token 的包装、模型路由
        - 公开定位很强，但生态分发看起来小于 GitHub 或 Vercel
      - - Replit
        - 直接 AI 应用构建器 + 云 IDE
        - 成熟开发者平台，付费计划最高到企业级
        - 想要多智能体工作流和托管开发的构建者
        - 并行智能体、内置数据库、多产物输出、更高的智能体上限
        - Pro 级价格上升很快，分发更偏开发者主导而非业务主导
      - - v0 / Vercel
        - 直接构建器 + 部署既有玩家
        - 由 Vercel 平台和基础设施销售体系支撑
        - 已在 Vercel 部署，或使用现代 Web 技术栈的团队
        - 提示词-构建-发布流程，支持 GitHub 同步和一键 Vercel 部署
        - 工作流与 Vercel 基础设施和定价深度绑定
      - - Cursor
        - 智能体编码新进入者
        - 快速增长的开发者工具，提供团队和企业层级
        - 软件工程师和工程主导型组织
        - 自主编码智能体、共享团队上下文、企业控制
        - 面向非技术构建者的产品化程度低于 Lovable 或 Webflow
      - - GitHub Copilot / Spark
        - 捆绑既有玩家 + 新进入者
        - GitHub 称 Spark 依托一个受 150M+ 开发者信任的平台
        - 开发者和 GitHub 原生团队
        - Copilot 定价阶梯、Spark 一键发布、代码库 / 认证 / 分发已经就位
        - Spark 仍处于公开预览，Lovable 作为独立构建器更专门化
      - - Webflow
        - 网站既有玩家
        - 大型网站平台，提供免费和合同制计划
        - 营销、Web 和设计团队
        - 在现有站点、CMS 和托管工作流内提供 AI 建站器
        - 更偏网站中心，而不是全栈应用中心
      - - Bubble
        - 无代码应用既有玩家
        - 成熟无代码平台，支持移动 / Web 包装和更高团队层级
        - 构建规模化内部应用或客户应用的业务用户和运营人员
        - 可视化编辑配 AI 智能体、任意模型集成、成熟应用运营
        - 团队规模下标价明显高于 Lovable 或直接构建器
      - - Glide
        - 无代码内部应用既有玩家
        - 业务应用供应商，Business 包装 $199+ 起
        - 把数据变成内部工具的运营和业务团队
        - 快速数据驱动应用、无代码 UI、AI 转换、企业附加功能
        - 代码所有权没那么明确，也不太适合定制产品工程
      - - Figma Make
        - 相邻的设计主导新进入者
        - Figma 更广设计和协作平台的一部分
        - 从组件库或原型出发的设计主导团队
        - 提示词加组件库上下文、可编辑原型、基于 Supabase 的 Web 应用生成
        - 仍更接近交付软件的相邻环节，而不是完整通用应用构建器栈
      - - 内部构建
        - 现状替代方案
        - 任何拥有 AI 辅助开发者以及现有云或代码库工具的团队
        - 控制要求强、工程主导的组织
        - 最大灵活性、工具选择和供应商可选性
        - 价值实现路径最慢，集成负担最高
    notes: 该表列出本章保留的竞争集合；对不透明的规模或融资单元保留定性描述，而不是猜测。
