  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 价格语境：头部倍数已经正常化过一次，但证据质量仍落后于增长
        blocks:
          - type: paragraph
            body: >-
              Lovable 的估值故事已经经历两个很不同的阶段。2025 年 7 月，公司与 TechCrunch 的口径一致：Series A 融资 $200 million，估值 $1.8 billion，大约相当于公开
              $100 million ARR 里程碑的 18x。到 2025 年 12 月，公司、TechCrunch 和 CNBC 的口径一致：Series B 融资 $330 million，估值 $6.6
              billion，意味着按当时公开的 $200 million ARR 约为 33x。按任何传统软件筛选框架看，这都很极端。到 2026 年 6 月，画面又变了：TechCrunch、Sacra 和
              GetLatka 都指向大约 $500 million 的年化收入运行率。用这个更新后的分母看，上一轮已完成的 $6.6 billion 估值更接近运行率收入的
              13x——仍是溢价，但相对高增长软件不再荒谬。问题在于，分母本身还达不到尽调级别。Lovable 的收入口径是管理层报告的 ARR 或运行率，不是经审计财务；Forbes 还称其中只有约 $20 million
              ARR 来自企业；公开文件对留存、毛利率、CAC、烧钱速度、现金跑道和清算优先权仍保持沉默。这意味着，估值可以靠动量讲得合理，但还不能靠质量站稳。
