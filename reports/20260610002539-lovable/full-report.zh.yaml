      - number: '4.4'
        title: 财务判断和尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              财务结论是：需求面有利，经济性仍不完整。Lovable
              有可见价格点，已经证明可以把使用转成收入，反复展示超大规模项目创建，也明显能拿到股权资本。这足以说明业务真实且已经很大；但还不足以说明业务质量高。缺失指标恰好都是承保所必需的：按 ARR
              计算的企业占比、折扣后的实际 ASP、云和模型毛利率、按渠道拆分的 CAC 和回本期、按 cohort 拆分的 churn 和 retention，以及带 runway 的当前 cash bridge。2026
              年 4 月安全事件进一步抬高尽调门槛，因为即使私有项目和 Lovable Cloud 没受影响，企业买家也会追问：披露之后，补救成本、保险索赔、销售摩擦或支持负担有没有变化。换句话说，Lovable 看起来是一家
              topline 速度异常、资本可得性很强的公司，但公开证据仍无法把 hype-adjusted 增长，与耐久、可高效变现的软件经济性分开。下一步尽调不应再重复融资头条年表，而应向管理层 data room
              索取聚焦 segment ARR、贡献毛利和流动性的材料。
