  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 方向
      - 论点
      - 什么会改变观点
    rows:
      - - 投资逻辑
        - 按当前 $500M 运行率看，上一轮已完成的 $6.6B 融资远没有按 2025 年 12 月分母看时那么激进。
        - 如果审计收入低于当前运行率，或有证据显示大部分收入是一次性或非经常性，投资逻辑会立刻削弱。
      - - 投资逻辑
        - Lovable 展现出异常快的产品采用和变现速度，而这正是私募 AI 投资人仍然奖励的东西。
        - 如果项目创建、付费转化或可变现用量明显放缓，稀缺性溢价会很快收窄。
      - - 投资逻辑
        - Cognition、Vercel 等私募 AI 编程轮次显示，在上市公司级披露出现前，投资人仍能容忍品类领导者的溢价。
        - 如果私募 AI 编程轮次向下重置，或老股价格明显走弱，Lovable 会失去一根主要支撑梁。
      - - 反向逻辑
        - 多数公开收入质量信号仍缺失：毛利率、留存、企业占比、烧钱速度和优先股堆叠都未公开披露。
        - 如果资料室披露强队列留存、健康贡献毛利和干净清算条款，信心会实质改善。
      - - 反向逻辑
        - Forbes 报道称企业 ARR 只有约 $20M，这削弱了整个运行率都应享受企业级倍数的论点。
        - 如果能证明企业 ARR 正在快速复合，并把留存拉到自助式基准之上，将支持更高定价。
      - - 反向逻辑
        - 安全审查会直接压低估值，因为企业买家和后期投资人会给默认不安全的工具打折。
        - 只有跑出足够长的干净运营期，并证明默认安全部署在改善，风险折价才会下降。
    notes: 这里的论证围绕当前价格和传闻价格已经计入了什么，而不是判断 Lovable 产品是否令人印象深刻。
