  productSummary: >-
    Lovable 销售一个 prompt-to-deploy 应用构建平台，把自然语言指令转成可编辑的全栈 Web 应用和网站。产品界面现在覆盖协作工作区、代码编辑、GitHub 同步、通过 Lovable Cloud
    提供的托管后端服务、基于 Supabase 的数据和认证流程、发布、自定义域名、企业治理功能，以及 MCP 驱动的扩展。
  customerFocus: 自下而上的构建者，包括创始人、设计师、运营人员和业务团队；同时也服务越来越多企业买家，用 Lovable 构建内部工具、原型和部分生产工作流。
  businessModel: 混合软件变现：共享工作区订阅（例如 Pro 每月 $25、Business $50）、按用量计费的 Lovable Cloud 和 AI Gateway credits，以及带治理、安全和采购功能的定制定价企业计划。
