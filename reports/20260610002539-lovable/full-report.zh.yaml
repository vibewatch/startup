companyProfile:
  summary: >-
    Lovable 是一家总部位于斯德哥尔摩的瑞典 AI 应用构建公司，源头可追溯到 Anton Osika 和 Fabian Hedin 创建的 GPT Engineer 前身项目。当前 Lovable 产品于 2024 年 11
    月上线，很快从基于提示词生成原型，扩展为更完整的 prompt-to-deploy 工作流，覆盖协作工作区、GitHub 同步、发布、自定义域名，以及通过 Lovable Cloud
    提供的托管后端选项。公开增长披露非常突出：公司从早期 $15 million 融资，推进到 2025 年 7 月以 $1.8 billion 估值完成 $200 million Series A，又在 2025 年 12 月以
    $6.6 billion 估值完成 $330 million Series B；与此同时，公开收入口径从 2025 年初的 $17 million ARR 爬升到 2026 年 6 月约 $500 million 的年化收入 run
    rate。Lovable 现在同时显示出自下而上和企业端的 traction，但企业经济性是否耐久、治理是否成熟，透明度仍远低于产品势能。
  founders:
    - name: Anton Osika
      role: 联合创始人兼 CEO
      background: GPT Engineer 前身项目创建者，也是 Lovable 面向公众最核心的产品和融资叙事发言人。
