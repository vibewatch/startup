        - ~10.0x 粗略年化市值 / 收入代理倍数
        - 高溢价开发者平台可比公司，显示公开市场愿意为规模化增长付多少。
        - 商业模式比 Lovable 的构建器工作流更宽、更成熟。
      - - ServiceNow
        - ~$110.31B 市值；~$13.278B 收入参照
        - ~8.3x 粗略市值 / 收入代理倍数
        - 工作流和低代码相邻性，为企业自动化软件提供规模基准。
        - 比 Lovable 成熟且多元得多，因此只是上限校验，不是同类可比。
      - - Wix
        - ~$2.01B 市值；披露 200M+ 用户
        - 成熟无代码 / 网站构建器市场锚点
        - 提醒一点：庞大用户基础和可视化构建工具，并不保证溢价估值能持续。
        - 这里没有保留直接收入倍数，因此相关性偏方向性，不能机械套公式。
      - - Vercel
        - F 轮投后 $9.3B；收入增长 82%；v0 用户 3.5M+
        - 高溢价私有构建器 / 基础设施可比对象
        - 最接近的私有基准，覆盖 AI 原生构建、部署和企业工作流。
        - 收入未完整披露，因此估值无法干净标准化。
      - - Cognition
        - 投后 $26B；~$492M 年化收入运行率
        - ~53x 运行率代理倍数
        - 显示私有市场投资人仍在激进定价前沿 AI 编码龙头。
        - 运行率和估值都来自私募轮报道，不是经审计的公开文件。
      - - Factory
        - 2026 年 4 月融资估值 $1.5B
        - 更早期私有 AI 编码可比对象
        - 可作为规模较小的企业 AI 编码参照。
        - 没有保留干净公开收入分母，难以计算倍数。
      - - Lovable 上一轮交割
        - $6.6B 估值；~$500M 当前收入运行率代理
        - ~13x 当前运行率代理倍数
        - 如果分母真实，当前轮次落在更宽的私有 AI 和高溢价公开软件区间内。
        - 收入质量和企业客户占比弱于头部倍数暗示，披露也更少。
    notes: 这是一组不完整但足以支持决策的可比对象，覆盖本轮直接抓取到估值证据的公开和私有 AI 开发工具、无代码参照。
