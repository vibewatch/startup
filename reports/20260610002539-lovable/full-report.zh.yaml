  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接构建器、开发者平台、no-code 既有玩家和内部自建
        blocks:
          - type: paragraph
            body: >-
              Lovable 处在一个不断扩大的竞争集合中，而不是单一小众赛道。最接近的直接对手是 Bolt、Replit 和 v0，因为它们都营销 prompt-to-app
              工作流、快速上线真实产品的路径，以及足够的代码或部署控制，来吸引那些想要的不只是静态 mockup 的构建者。Lovable 自己的文档强调全栈生成、可编辑代码、GitHub
              同步和共享工作区，这让它更接近产品化软件工厂，而不是纯网站生成器。这个差异很关键，因为评估 Lovable 的买家，通常不是在 Lovable 和一张空白页之间做选择；他们是在 Lovable、另一个 AI
              builder、developer-first agent stack、可视化 no-code 工具，或内部自建路径之间做选择。


              更广的竞争场同样重要。Cursor 加 GitHub Copilot 和 Spark 从现有开发者工作流切入同一预算；Webflow、Bubble、Glide 和 Figma Make 从视觉设计和
              no-code 一侧切入。内部自建也仍有可信度，因为开发者 AI 工具已经足够主流，买 Lovable 只是快速做出应用的几条可行路径之一。结果是，Lovable 确实有一个差异化
              bundle——全栈生成加可编辑代码再加治理——但并不垄断底层 job to be done。
