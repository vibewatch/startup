      - number: '5.5'
        title: 差异化、产品成熟度和关键尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Lovable 最清楚的差异化在于，它把通常分散在多个厂商里的界面组合起来：提示词驱动应用创建、协作编辑、代码访问、GitHub export/sync、托管后端、发布、自定义域名，以及越来越多的安全 /
              治理控制。用户和评论者反复把它与只做 UI 的构建器或纯代码 copilot 比较，并给出更高评价，原因就在这条集成路径。成熟度画像并不均衡。Greenfield MVP 和 workflow-heavy Web
              apps 似乎是当前甜点；commerce、MCP 控制和移动捕捉扩展了可覆盖用例，但社区反馈仍指出成本、偶发 bug，以及处理更大、更复杂构建时较弱。公开信息也留下有意义的尽调缺口：没有公开 SLA 或
              uptime 目标，没有深度公开的 plugin/package 生态，核心产品的公开 repository 透明度有限，灾备承诺的公开证明不完整。因此，投资人应把 Lovable
              视为一家高速度、越来越懂企业的平台型 builder，工作流集成有吸引力，但其运营承保仍依赖私下尽调，而不能只靠公开技术披露。
