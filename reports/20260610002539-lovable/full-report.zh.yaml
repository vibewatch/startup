      - number: '8.4'
        title: 情景区间与尽调门槛：上行空间存在，但估值再涨 1x 需要比第一段更好的证明
        blocks:
          - type: paragraph
            body: >-
              情景表应被当作纪律工具，而不是预测。超过 $12 billion 的乐观情景，要求 Lovable 把产品速度转化为质量明显更高的收入：企业组合必须比当前公开 $20 million ARR
              口径深得多，安全和信任问题需要保持可控，增长大概率还要维持到 $800 million 至 $1.0 billion 的收入带。更接近 $5.5 billion 到 $8.5 billion
              的基准情景更容易支撑，因为它假设真实增长继续，但市场开始要求质量证据而不只是速度，倍数向软件常态压缩。如果需求最终更像实验而非持久需求，如果又一次信任事件打击转化，或如果下一轮融资想在企业经济性可见之前完成，那么
              $2 billion 到 $4 billion
              左右的悲观情景也合理。实际含义很简单：价值最高的尽调要求，不是更多项目数，也不是更多媒体里程碑，而是队列留存、毛利率、企业组合、股权结构表条款，以及安全部署正在变得更容易而非更危险的证据。这些事实会把
              Lovable 从继续研究推向买入，或从合理推向昂贵。
