  - id: TE002
    title: Lovable 工作流 / 用例表
    columns:
      - 用户任务
      - 没有 Lovable 时的现有工作流
      - Lovable 方案
      - 可衡量收益
      - 限制
    rows:
      - - 快速上线 MVP 或内部工具
        - 雇开发者、手工接基础设施，或把设计、代码、后端工具拼在一起
        - 提示词驱动的构建循环，内含后端、认证和集成脚手架
        - 按官方定位和用户评价，同日做出原型或可部署 web app 是可能的
        - 收益在绿地项目上最强，对既有复杂系统较弱
      - - 改代码前安全探索功能
        - 白板、文档，或单独开架构评审会
        - Plan mode 会结合代码和日志推理，先保存获批计划，再由 Build mode 执行
        - 降低误改风险，同时理清架构和范围
        - 每条 Plan mode 消息都会消耗额度，且仍依赖用户如何描述问题
      - - 把项目从非技术构建者交给工程师
        - 到别处重建原型，或手工解释没有文档的设置
        - Code Mode 加 GitHub sync 暴露文件、分支和 clone URL，便于本地 IDE 工作流
        - 保住代码所有权，降低重写风险
        - 公开材料没有支持把既有仓库导回 Lovable
      - - 发布有品牌感的公共网站或 app
        - 在多个工具里分别配置托管、DNS 和 SSL
        - 发布快照、连接自定义域名并签发 SSL
        - 简化首次生产部署和域名设置
        - 变更要重新发布才会生效，公开 uptime 条款也未披露
      - - 在浏览器编辑器之外运营项目
        - 退回通用 IDE、脚本或手工运维
        - 移动 app 和 MCP server 把构建与控制界面扩展到 web 编辑器之外
        - 提高跨场景捕捉需求和控制项目的便利性
        - 新界面仍处市场早期，带来支持、治理和一致性问题
    notes: 收益判断来自产品工作流文档以及外部用户 / 开发者界面；它们说明方向，不是经过审计的 time-to-value 指标。
