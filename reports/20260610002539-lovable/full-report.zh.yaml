      - number: '1.3'
        title: 融资历史、估值路径和运营规模
        blocks:
          - type: paragraph
            body: >-
              Lovable 的资本形成被极度压缩。在头部融资轮之前，公司披露了一轮由 Creandum 领投的 $15 million 融资，同时带着异常强的早期指标：$17 million ARR、30,000
              名付费客户、每天 25,000 个新项目、累计构建 1.2 million 个应用。随后，2025 年 7 月，公司宣布以 $1.8 billion 估值完成 $200 million Series A，由
              Accel 领投，20VC、byFounders、Creandum、Hummingbird 和 Visionaries Club 等具名参与。TechCrunch
              同期报道补充了几位知名天使投资人，更重要的是把这一轮与公开 traction 指标挂钩：2.3 million 活跃用户、180,000 名付费订阅用户、$75 million ARR，以及约 45
              名全职员工的团队。


              这轮之后，势能没有回归常态，反而继续加速。2025 年 11 月的报道和公司自己的一周年文章，把 Lovable 与 $100 million ARR、随后 $200 million ARR
              绑定起来，同时披露已创建 10 million 到 25 million 个项目、每天正在构建 100,000 个项目。2025 年 12 月，公司又以 $6.6 billion 估值完成 $330
              million 融资，由 CapitalG 和 Menlo Ventures 的 Anthology fund 领投，参与方包括 Khosla、Accel、Creandum、HubSpot Ventures
              等一长串战略和财务投资人。


              客户引用现在已经广到足以进入尽调，但并非所有名字都有同等强度的佐证。公开来源反复指向 Klarna、Uber、Zendesk、Deutsche Telekom 和 HCA Healthcare；HubSpot 在
              2025 年 7 月客户报道中出现过一次，后来则更清楚地以 HubSpot Ventures 投资人身份出现。干净的结论是：Lovable
              已经从爱好者采用，推进到企业原型和部分生产用例；但当前客户账户到底如何定义，披露仍不足。
