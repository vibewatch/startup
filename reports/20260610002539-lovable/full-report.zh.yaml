      - number: '8.2'
        title: 可比框架：公开软件给出底线，私有 AI 编码轮次则说明稀缺性仍有多重要
        blocks:
          - type: paragraph
            body: >-
              给 Lovable 定位，最干净的框架是把它看作一家私有 AI builder，介于成熟公开软件和更热的私有 AI
              编码轮次之间。公开市场锚点有用，因为它给出了市场通常愿意给已规模化且经济性已知的软件公司多少溢价的上限。GitLab 市值约 $5.1 billion，JFrog 约 $9.8 billion，MongoDB 约
              $27.4 billion，ServiceNow 约 $110.3 billion，Wix 约 $2.0 billion；GitLab、JFrog、MongoDB 和 ServiceNow 的粗略市值 /
              收入口径大约集中在 7x 到 16x。它们并不完美，因为混用了年化季度收入、过去十二个月收入和市值，而不是 EV；但仍能说明公开投资者会为经济性已披露的软件业务支付什么价格。私有 AI
              编码轮次则仍更贵，也更不透明。Cognition 在接近 $492 million 年化运行率时，以约 $26 billion 投后估值融资；Vercel 宣布 Series F 投后估值 $9.3
              billion，并强调 v0 的收入增长 82% 以及有意义的企业组合；Factory 在更早规模下仍以 $1.5 billion 融资。这里的信息不是 Lovable
              便宜，而是私有买方仍愿意在公开市场充分验证同一经济性之前，为 AI 编码领导者付钱。
