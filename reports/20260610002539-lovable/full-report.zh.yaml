  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 分层结构和采用轨迹
        blocks:
          - type: paragraph
            body: >-
              Lovable 的客户基础应读成一个分层栈，而不是单一企业 SaaS 名单。在漏斗顶部，它拥有数百万用户和一个很大的非技术构建者池。Lovable 自己的 build-economy report 称，80%
              的构建者处在非技术岗位，他们正在构建 CRM、HR 工具、库存系统和电商店面等实用软件。TechCrunch 2026 年 6
              月画像也强调，产品被创始人、设计师和销售人员使用，而不只是开发者。这个点很重要，因为它解释了为什么广义使用量如此大：Lovable 正在把软件创建扩展到过去会购买软件、或排队等待内部工程资源的人群。


              采用曲线是真实的，但尽调必须把总量指标与具名部署分开。公开来源支持这样一条进展：2025 年 7 月为 2.3 million 活跃用户和 180,000 名付费订阅用户；到 2026 年 3 月约 8
              million 用户；到 2026 年 6 月已构建超过 50 million 个项目，每周新增约 1 million 个项目。这些都是令人印象深刻的规模标记，build-economy report
              还补充了下游流量：Lovable 构建应用每月 600 million 到 720 million
              次访问。不过，这些指标都没有说明多少账户被留存、多少属于有预算的企业关系，或多少项目进入耐久生产使用。这个区分是本章核心：广泛使用已被证明，客户耐久性披露仍少得多。
