        - label: 运营验证
          value: Team starts using the app for CRM, websites, events, HR, or healthcare workflows
          note: 这一步决定 Lovable 是停留在演示，还是变成工作流软件。
        - label: 治理检查点
          value: Security scans, approvals, SSO, audit trails, and procurement review for larger teams
          note: Google Cloud Marketplace 可用性和 Lovable 的安全控制，目标是降低这道摩擦，而不是消除它。
        - label: 扩张或停滞
          value: >-
            Successful accounts replace more SaaS or add more apps; unhappy accounts hit support, cost, or complexity
            limits
          note: 具名案例研究显示扩张，评论和负面安全评论则指出主要停滞因素。
    claimRefs:
      - CU001
      - CU003
      - CU011
      - CU017
      - CU023
      - CU028
      - CU040
      - CU045
  - id: FU002
    title: Lovable 采用漏斗：广泛使用与具名证明
    type: funnel
    layout: standard
    summary: 这张图解释了为什么 Lovable 的总体使用故事远大于公开记录的具名客户基础：漏斗从数百万用户收窄到少量详细公开证明。
    data:
      items:
        - label: 总用户数
          value: 8000000
          note: TechCrunch 和 Sacra 报道称，2026 年 3 月用户数约为 8 million。
        - label: 活跃用户
          value: 2300000
          note: TechCrunch 报道 2025 年 7 月有 2.3 million 活跃用户，这是本章保留的最清晰公开活跃用户数据点。
        - label: 付费订阅者
          value: 180000
          note: TechCrunch 和 Sacra 报道称，2025 年 7 月付费订阅者为 180,000。
        - label: 本章详细具名证明
          value: 6
          note: Atonom、eXp Realty、AppDirect、Konfide、HubSpot 和 HCA Healthcare 是证据保留最清楚的六个具名证明，尽管披露深度差异很大。
    claimRefs:
      - CU007
      - CU009
      - CU010
      - CU014
      - CU017
      - CU020
      - CU023
      - CU032
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: standard
    summary: 从生产成熟度、结果具体度、独立性和留存可见度几个维度，对比 Lovable 保留客户证明的质量。
    data:
      columns:
        - 生产成熟度
        - 结果具体度
        - 独立性
        - 留存可见度
        - 整体证据质量
      rows:
        - label: Atonom
          values:
            - 高
            - 高
            - 低
            - None
            - 好，但由公司撰写
          note: 本章替代 SaaS 细节最强的案例，但仍由 Lovable 发布，而不是由客户或独立媒体发布。
        - label: eXp Realty
          values:
            - 高
            - 高
            - 低
            - None
            - 好，但由公司撰写
          note: 大规模运营细节和节省成本说法有说服力，但没有第三方续约或 ACV 披露。
        - label: AppDirect
          values:
            - 高
            - 中
            - 低
            - None
            - 好，但仍是内部案例研究
          note: 生产使用是明确的，但节省成本和应用数量说法仍由公司撰写。
        - label: Konfide / 创始人构建产品
          values:
            - 中
            - 中
            - 中
            - None
            - 尚可
          note: Product Hunt 给出具体产品细节和客户声音，但自我报告限制了严谨性。
        - label: 大型企业标识
          values:
            - 不清楚
            - 低
            - 中
            - None
            - 可作引用但偏薄
          note: HubSpot 和 HCA Healthcare 之所以重要，是因为它们被具名；但证据大多停留在标识层面，而非部署层面。
    claimRefs:
      - CU014
      - CU016
      - CU030
      - CU031
      - CU032
      - CU043
      - CU044
      - CU048
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 最高残余风险不在简单的功能交付噪音，而在访问控制、隐私 / 供应商治理和供应商依赖。
    data:
      columns:
        - 低影响
        - 中影响
        - 高影响
      rows:
        - label: 高可能性
          values:
            - label: 支持摩擦
              tone: neutral
              detail: 仅付费用户可用的官方支持和 AI 优先路由，可能让低层级或快速增长团队受挫。
            - label: 使用成本波动
              tone: risk
              detail: 额度加使用量定价可能让客户意外，也会压低利润率假设。
            - label: 隐私 / 供应商监督负担
              tone: risk
              detail: 多供应商数据流让法律和安全尽调持续处于活跃状态。
        - label: 中可能性
          values:
            - label: 引用证明仍薄
              tone: neutral
              detail: 公开故事可能真实，但仍无法代表更广泛的留存质量。
            - label: 反复可用性事件
              tone: risk
              detail: 状态页频率显示，关键任务使用所需的可靠性仍要成熟。
            - label: 又一次访问控制失误
              tone: risk
              detail: 近期事件历史抬高了未来任何可见性或边界回退的后果。
        - label: 低可能性
          values:
            - label: 常规功能延迟
              tone: positive
              detail: 增量产品延期本身不太可能成为击穿投资逻辑的核心驱动因素。
            - label: 域名 / 用户名争议
              tone: neutral
              detail: 如果客户使用自定义域名并制定迁移计划，连续性问题可控。
            - label: 正式执法或重大诉讼
              tone: risk
              detail: 公开证据仍不完整，但任何点名监管行动或诉讼都会造成不成比例的伤害。
    claimRefs:
      - CR013
      - CR021
      - CR029
      - CR031
      - CR040
      - CR044
      - CR052
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Lovable 的主要风险先穿过信任、企业销售摩擦、支持成本和供应商集中度，之后才会体现在收入或估值上。
    data:
      nodes:
        - id: R1
          label: 访问控制失误
          detail: 可见性或权限故障会暴露代码、提示词或客户数据。
          tone: risk
        - id: R2
          label: 客户信任重置
          detail: 用户会降低在平台上存放敏感逻辑或密钥的意愿。
          tone: risk
        - id: R3
          label: 企业销售摩擦
          detail: 安全和法务审查会拖慢或卡住扩张和新交易。
          tone: risk
        - id: R4
          label: 更高支持 / 合规成本
          detail: 团队需要投入更多人工审核、通知和补救工作。
          tone: risk
        - id: R5
          label: 供应商成本压力
          detail: 模型或云成本上涨速度快于定价权。
          tone: risk
        - id: R6
          label: 利润率 / ARR 不及预期
          detail: 增长仍为正，但质量和盈利能力低于预期。
          tone: risk
        - id: R7
          label: 估值压缩
          detail: 市场不再把 Lovable 视为高溢价企业信任资产。
          tone: risk
        - id: R8
          label: 运营事故集中爆发
          detail: 反复宕机或发布质量下降会强化买方犹豫。
          tone: risk
        - id: R9
          label: 标杆证明走弱
          detail: 具名案例无法转化为持久的企业客户队列。
          tone: risk
      edges:
        - from: R1
          to: R2
          label: 信任被侵蚀
        - from: R2
          to: R3
          label: 安全审查拖慢交易
        - from: R3
          to: R6
          label: 管线和扩张走弱
        - from: R1
          to: R4
          label: 响应与通知工作量上升
        - from: R5
          to: R6
          label: 毛利率受压
        - from: R8
          to: R3
          label: 买方质疑可靠性
        - from: R9
          to: R3
          label: 标杆说服力下降
        - from: R4
          to: R6
          label: 运营杠杆走弱
        - from: R6
          to: R7
          label: 质量调整后的增长倍数下降
    claimRefs:
      - CR013
      - CR021
      - CR029
      - CR031
      - CR040
      - CR043
      - CR052
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 平台处在身份、云、模型、计费、域名和监管依赖的中心；任一节点走弱，都可能很快向外扩散。
    data:
      nodes:
        - id: D1
          label: Lovable 平台
          detail: 核心产品、编辑器、发布层和企业控制。
          tone: neutral
        - id: D2
          label: Supabase 数据平面
          detail: 数据库、认证、存储和 serverless 后端基础。
          tone: risk
        - id: D3
          label: AI 供应商
          detail: OpenAI、Google 及其他支撑 AI Gateway 功能的供应商。
          tone: risk
        - id: D4
          label: Stripe 计费层
          detail: 订阅、充值和支付处理基础设施。
          tone: risk
        - id: D5
          label: 注册商 / DNS / CDN
          detail: 自定义域名、代理、路由和公网可达性。
          tone: risk
        - id: D6
          label: 身份栈
          detail: 已验证域名、SSO、SCIM 和协作者策略控制。
          tone: risk
        - id: D7
          label: 研究员 / 分诊工作流
          detail: 外部漏洞披露路径和升级流程。
          tone: risk
        - id: D8
          label: 监管机构 / 隐私义务
          detail: GDPR、ICO 式 AI 指引和 EU AI Act 治理要求。
          tone: risk
        - id: D9
          label: 企业客户
          detail: 业务关键应用和灯塔客户案例。
          tone: risk
      edges:
        - from: D2
          to: D1
          label: 后端可用性和数据控制
        - from: D3
          to: D1
          label: 推理成本和政策依赖
        - from: D4
          to: D1
          label: 计费和商业化
        - from: D5
          to: D1
          label: 域名可达性和品牌连续性
        - from: D6
          to: D1
          label: 管理治理和访问执行
        - from: D7
          to: D1
          label: 漏洞升级质量
        - from: D8
          to: D1
          label: 合规边界
        - from: D1
          to: D9
          label: 产品信任和服务交付
        - from: D9
          to: D1
          label: 可背书程度和收入集中度
    claimRefs:
      - CR005
      - CR006
      - CR018
      - CR023
      - CR025
      - CR026
      - CR034
      - CR037
      - CR038
      - CR046
      - CR047
      - CR048
      - CR051
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 建议更多取决于公开证据是否足够强，能否支撑今天为增长支付溢价，而不是 Lovable 是否仍在高速增长。
    data:
      nodes:
        - id: N1
          label: |-
            超高增长证明
            $100M -> $200M -> $400M -> $500M 收入运行率
        - id: N2
          label: |-
            价格背景
            $1.8B -> $6.6B -> 传闻 $12B
        - id: N3
          label: |-
            质量缺口
            企业占比、留存、利润率、股权结构表未知
        - id: N4
          label: |-
            信任风险
            安全审视可能压缩倍数
        - id: N5
          label: |-
            上一轮收盘视角
            足够合理，可继续跟踪
        - id: N6
          label: |-
            下一轮视角
            缺少新证据时偏紧
        - id: N7
          label: |-
            建议
            继续研究
      edges:
        - to: N5
          label: 支撑价格
          from: N1
        - to: N5
          label: 框定上一轮收盘
          from: N2
        - to: N6
          label: 限制确信度
          from: N3
        - to: N6
          label: 增加折价
          from: N4
        - to: N7
          label: 保持接触
          from: N5
        - to: N7
          label: 暂不买入
          from: N6
    approximationNotes: 这条流是决策链，不是流程图；它概括了哪些变量主导投资判断。
    claimRefs:
      - CV008
      - CV009
      - CV016
      - CV018
      - CV019
      - CV020
      - CV021
      - CV043
      - CV044
      - CV048
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 投资人采用的公开分母不同，Lovable 看起来便宜还是昂贵会急剧变化。
    data:
      items:
        - label: July 2025，ARR $100M
          value: 18
          detail: 对应 $1.8B Series A 的隐含倍数。
          tone: warning
        - label: Dec 2025，ARR $200M
          value: 33
          detail: 对应 $6.6B Series B 的隐含倍数。
          tone: negative
        - label: Jun 2026，$500M 收入运行率
          value: 13.2
          detail: 对应上一轮已完成 $6.6B 估值的隐含倍数。
          tone: neutral
        - label: 传闻 $12B，对应 $500M 收入运行率
          value: 24
          detail: 同一分母下，下一次估值上台阶意味着什么。
          tone: negative
        - label: 上市可比公司低区间
          value: 7
          detail: 来自 GitLab / ServiceNow 类代理的大致底部。
          tone: positive
        - label: 上市可比公司高区间
          value: 16
          detail: 来自 JFrog 类定价的粗略上市代理区间上端。
          tone: warning
    approximationNotes: 这些是简单收入倍数桥，使用已报道估值和收入运行率口径；刻意保持粗略，且不基于 EV。
    claimRefs:
      - CV014
      - CV015
      - CV016
      - CV017
      - CV035
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 公开证据支持很宽的结果区间，因为分母质量和可接受倍数都仍不确定。
    data:
      items:
        - label: 悲观情景
          low: 2
          mid: 3
          high: 4
          displayValue: $2B-$4B
          detail: 倍数向上市软件公司压缩，质量低于预期。
          tone: negative
        - label: 基准情景
          low: 5.5
          mid: 7
          high: 8.5
          displayValue: $5.5B-$8.5B
          detail: 增长延续，但尽调质量仍不完整，倍数收缩。
          tone: warning
        - label: 乐观情景
          low: 12
          mid: 15
          high: 18
          displayValue: $12B-$18B
          detail: 更高质量收入放大，溢价延续。
          tone: positive
    approximationNotes: 这些区间是供投委会讨论的情景化估值输出，不是管理层指引。
    claimRefs:
      - CV043
      - CV044
      - CV045
      - CV046
      - CV047
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Lovable 在需求和品类相关性上得分较高，但证据质量和下行透明度明显更弱。
    data:
      items:
        - label: 市场顺风
          score: 9
          detail: AI 编程需求和构建者热情仍然很强。
          tone: positive
        - label: 需求证明
          score: 9
          detail: 对一家私营软件公司而言，收入运行率和项目增长异常强劲。
          tone: positive
        - label: 分发 / 相关性
          score: 8
          detail: Lovable 仍处在受追捧的私营 AI 编程品类里。
          tone: positive
        - label: 护城河耐久性
          score: 6
          detail: 产品动能真实，但工作流锁定效应和企业深度仍缺少更多证明。
          tone: neutral
        - label: 经济模型清晰度
          score: 3
          detail: 公开证据中基本看不到利润率、留存和股权结构表条款。
          tone: negative
        - label: 风险负担
          score: 4
          detail: 安全和质量担忧压缩倍数的速度可能快于收入恢复。
          tone: warning
        - label: 证据质量
          score: 4
          detail: 足以继续跟踪公司，不足以仅凭公开信息给出买入。
          tone: warning
    approximationNotes: 评分是投委会基于引用证据作出的 0-10 序数判断，不是公司披露的 KPI。
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV042
      - CV043
      - CV048
