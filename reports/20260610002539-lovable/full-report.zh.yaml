      - number: '6.3'
        title: 耐久性、评论和集中度缺口
        blocks:
          - type: paragraph
            body: >-
              Lovable 的持久性叙事，到了客户证据这一层就变薄了。评论和推荐材料的方向是正面的：用户反复称赞速度快、UI 成熟，也认可不用大型工程团队就能做出真正软件。Trustpilot
              的存档快照显示评论量高、情绪有分歧但总体偏正面；Product Hunt 和 Lovable
              自己的评论页也反复出现创始人和运营人员的热情反馈，他们能很快把产品发出去。与此同时，同一批材料也不断露出同样的摩擦点：额度显得贵，支持可能弱或慢，复杂项目会触发 bug 循环或架构死胡同。IJONIS
              说得尤其直白：Lovable 做原型和 MVP 很强，但在复杂或合规要求高的环境里，还不能完全替代专业工程工具。


              企业采购又叠了一层摩擦。Google Cloud Marketplace 上架、SSO、SCIM、审计轨迹和安全中心工具都有帮助，也清楚说明 Lovable
              知道大型买方会问什么。但早前安全事件和披露疑虑带来的采购负担，并不会因此消失。Harper Foley 和 ToolJet 从不同角度都指出，披露成熟度和架构控制，已经成为 AI
              生成应用平台采购决策的一部分。最关键的是，公开记录仍没有回答核心承销问题：没有披露
              NRR、GRR、合同期限、头部客户集中度，也没有按队列披露收入依赖。因此，尽调要求很直接：管理层应先拿出队列留存表、合同期限摘要和头部客户敞口表，避免把采用面广误判为经常性收入质量持久。
