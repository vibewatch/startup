        - 增量点数购买
        - 条款和定价文案支持
        - 中：支撑先落地再扩张的经济性，但弹性未知
        - 要求披露月度充值买方数、单买方支出，以及退款或失效率
      - - 合规和治理增购
        - Business 和 Enterprise 包含 DPA、SSO、SCIM、审批和审计日志
        - 更高信任度套餐
        - 企业就绪度是高端方案的一部分
