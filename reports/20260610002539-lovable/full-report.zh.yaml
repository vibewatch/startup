  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义和构建者工作流
        blocks:
          - type: paragraph
            body: >-
              Lovable 的产品最好理解为把 prompts 转成生产 Web 应用的工作流引擎，而不是单个代码生成 widget。官方文档描述的用户旅程从自然语言指令开始，然后进入共享工作区、迭代聊天、可选 Plan
              mode 推理、Code mode 中直接查看代码、通过 GitHub 同步实现所有权和基于分支的协作，最后发布并绑定自定义域名。这个框架重要，因为 Lovable 同时销售速度和控制：非技术构建者可以留在
              chat 里，技术团队可以检查文件、本地 clone repos，并在平台外保留同步副本。协作围绕项目 / 工作区角色展开，而不只是临时分享链接，这把 Lovable 从单人原型工具推向一个多人构建和发布软件的
              operating environment。因此，核心产品承诺不只是「AI 写代码」，而是「AI 压缩从想法到受治理、可部署 Web app 的路径，同时让客户仍可拥有代码。」
