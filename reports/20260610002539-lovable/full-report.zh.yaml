      - - Pro
        - 25 USD/月，按年付
        - 公开标价
        - 100 个每月点数、每日点数、充值、自定义域名、去除徽章、角色
        - 无公开实际 ARPU 或超额使用行为
        - 说明 Lovable 同时把协作和使用量变现
      - - Business
        - 50 USD
        - 公开标价
        - Pro 全部能力，加上内部发布、SSO、团队工作区、安全中心
        - 无公开合同最低额或席位逻辑
        - 传递信任和协作增购信号
      - - Enterprise
        - 按公司规模收平台费，credit 定价按量
        - 仅定制定价
        - 专属支持、导入支持、SCIM、设计系统、自定义连接器、审计日志
        - 无公开 ASP、期限、爬坡或用量档位
        - 企业商业化存在，但无法从公开数据承保
