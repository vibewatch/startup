  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和相邻类别
        blocks:
          - type: paragraph
            body: >-
              最适合把 Lovable 理解为 prompt-to-production 应用构建器，而不只是 coding copilot，也不只是 no-code
              网站工具。它自己的文档说，一个项目可以包含前端、后端、数据库、认证、集成、可编辑代码和 GitHub 同步；首页则把产品描述为通过与 AI 聊天来创建应用和网站。这让 Lovable 落在一层较窄的
              AI-native 软件创建工具中：它处在更广义 low-code 开发支出之内，又与多个相邻类别重叠。Bubble 和 Glide 代表 no-code 业务应用血脉；Webflow 代表 AI
              网站构建器边界；Figma Make 抓住设计和原型边界；Cursor 加 GitHub Copilot 则代表 coding assistant 边界。Replit、v0、Bolt 和 GitHub Spark
              也重要，因为它们确认了另一组工具正在承诺 prompt-to-app 创建和快速发布。现实状态仍是：人类工程师、代理商、设计工具、low-code 技术栈和 coding assistants
              被手工拼在一起，而不是统一在一个可治理工作区里。
