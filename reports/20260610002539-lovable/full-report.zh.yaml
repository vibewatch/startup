      - number: '5.3'
        title: 信任、安全、隐私和可靠性姿态
        blocks:
          - type: paragraph
            body: >-
              Lovable 现在把信任控制前置为一组产品功能，而不只是法律附录。公开材料宣传 SOC 2 Type II、ISO 27001:2022、SSO/SCIM、发布 gating、secret
              handling、row-level-security review、dependency scanning，以及 Wiz 等可选合作伙伴工具。这些安全控制有意义，因为 Lovable
              的核心工作流让非专业用户也能快速创建全栈软件，从而提高了默认防护的必要性。不过，2026 年 4 月可见性事件，是对营销姿态的真实反重。Lovable
              公开披露，公共项目聊天历史和源代码曾在一段时间内被错误地访问；随后公司修复权限问题、修改默认设置，并重做 HackerOne 流程。透明本身是正面信号，但也证明平台仍在公开环境中打磨权限模型和安全运营。隐私语言对
              Supabase-hosted 数据、通过 AI Gateway 传递给第三方 AI providers，以及工作区数据训练控制，讲得相对明确；但仍没有公开 uptime/SLA
              package，无法让企业买家像评估安全 / 合规声明那样，有同等信心承保托管可靠性。
