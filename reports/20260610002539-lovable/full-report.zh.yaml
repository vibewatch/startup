      - number: '4.3'
        title: 资本可得性明显；资本充足性并不明显
        blocks:
          - type: paragraph
            body: >-
              狭义融资能力上，Lovable 看不出受资本约束。公司公开披露了 $15 million 早期融资、以 $1.8 billion 估值完成的 $200 million Series A，以及以 $6.6
              billion 估值完成的 $330 million Series B。随后 Forbes 报道称，到 2026 年 6 月，公司正在讨论另一轮按 $12 billion 估值融资。SEC filings
              进一步证明，2025 年全年确实发生了真实融资活动，但也让简单的头条故事更复杂：2 月、7 月和 12 月的 Form D filings 分别显示已售金额约为 $20.2 million、$192.7
              million 和 $425.0 million，并且总发行金额里嵌入了已取消 SAFE 的价值。换句话说，Lovable 显然募集了大量资本，但公开来源没有把头条融资轮与实际售出证券或资产负债表上可用现金
              proceeds
              对齐。资金用途语言更偏战略，而不是财务：管理层谈到更深集成、协作、治理、基础设施，甚至并购。但公开文件仍缺少现金余额、burn、runway、债务或营运资本披露。这意味着投资人能看到股权市场胃口和战略野心，却看不到流动性垫、触发下一轮融资的条件，或当前增长是否仍依赖频繁外部资本。
