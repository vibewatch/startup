      - number: '7.3'
        title: 安全、平台和运营韧性风险
        blocks:
          - type: paragraph
            body: >-
              Lovable 在纸面上有可信的安全叙事，但公开记录显示平台仍有实质残余风险。安全页面和文档描述了分层控制：基于角色的权限、区域选择、加密 secrets、行级安全
              lint、深度扫描、审计日志、定期扫描，以及可选的渗透测试或 Wiz 集成。问题在于，Lovable 也告诉客户，这些控制不能替代彻底的安全审查，而且前端代码永远是公开且不可信的。2026 年 4 月事件和
              2025 年 10 月 Vidoc 漏洞链说明，为什么这个免责声明重要。两个案例里，挑战并不是抽象意义上缺少控制，而是产品快速变化下的控制交互、过期流程或信任边界复杂性。运营上，状态流显示 2026 年 5 月和
              6 月，preview、文件上传、聊天、AI
              gateway、登录和云服务反复出问题。对企业买方来说，这意味着安全成熟度和服务成熟度应被视为正在改善，而不是已经完成。投资者应要求管理层提供事后复盘、渗透测试报告、SLO
              历史，以及政策默认值和事件分诊已经能跟上产品发布速度的证据。
