        - 公司或员工基数合同
        - 企业定价为定制，不是自助购买
        - 中：结构可见，合同条款不透明
        - 要求披露平均合同价值、合同期限和折扣审批政策
      - - Lovable Cloud 点数
        - 托管、数据库、存储和后端服务按用量计价
        - Cloud 点数消耗
        - 条款描述了叠加在订阅之上的独立 cloud-credit 余额
        - 中：商业化存在，利润率未知
        - 要求按方案披露 cloud-credit 收入、COGS 和附着率
      - - AI Gateway 点数
        - 借 Lovable 基础设施访问第三方 AI 模型，按用量计价
        - AI Gateway 点数消耗
        - 条款描述了独立的 AI Gateway 余额和计量表
        - 中：有价值的商业化杠杆，但转售毛利未知
