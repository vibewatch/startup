  - id: TV005
    title: 投资逻辑失效与终止触发表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 企业客户占比仍微不足道
        - 头部收入运行率继续上升，但企业 ARR 仍接近当前公开的 ~$20M 水平。
        - 业务会越来越像变现后的实验性需求，而不是高溢价企业软件。
        - 若没有折价，不应承销高于上一轮交割价的上行轮。
      - - 再次发生信任或安全事件
        - 重复事件说明安全部署并未随着规模扩大而变得更容易。
        - 企业转化、留存和后期投资人胃口会同时恶化。
        - 在补救质量得到证明前，从合理 / 继续研究转为偏高或回避。
      - - 下一轮在接近或高于 $12B 成交，但没有新增质量披露
        - 证据集大体不变，价格却上升。
        - 估值再次跑到公开可比公司和当前尽调能支撑的范围之外。
        - 放弃新钱，或要求显著更强的下行保护。
      - - 公开市场倍数压缩时，收入运行率卡在 ~$600M 以下
        - Lovable 证明企业耐久性之前，增长已经放慢。
        - 当前溢价失去支撑，估值比预期更快向公开软件区间收敛。
        - 立即按基准或悲观区间重新承销。
      - - 股权结构条款证明惩罚性强
        - 在低于乐观情景的退出中，优先权、棘轮条款或参与权吃掉价值。
        - 即便公司仍在增长，普通股结果也可能令人失望。
        - 在承销任何回报目标前，要求完整的瀑布模型。
    notes: 这些是可监控的估值触发项，不是经营预测；每一项都重要，因为它会改变分母质量或可接受倍数。
    claimRefs:
