      - - 提供商集中度
        - Supabase 或模型供应商敏感性
        - 单一提供商承载大部分关键工作负载，且在宕机、政策变化或重大涨价时没有可信后备方案。
        - 下调毛利和可用性假设，并把提供商集中度作为核心承保变量。
      - - 客户耐久性
        - 前几大客户和续约集中度
