      - number: '1.2'
        title: 创始人、领导层和治理可见度
        blocks:
          - type: paragraph
            body: >-
              Lovable 仍与两位创始人高度绑定。Anton Osika 是公开 CEO，Fabian Hedin 是公开
              CTO，两人继续支撑公司关于「让非程序员创建软件」的外部叙事。第三方画像说明了这个故事为什么有共鸣：Osika 在 Lovable 之前就构建过技术产品，Hedin 在无障碍和 AI
              系统上具备很强的技术可信度，两者合在一起，帮助公司把产品愿景和工程速度接起来。


              对一家达到 Lovable 估值水平的公司来说，创始人之外的领导层可见度仍相对薄。已审阅来源中最具体的非创始人高管角色，是出现在 2026 年安全合作材料里的 CISO Igor
              Andriushchenko。这个信号说明公司在专业化安全姿态，但不能替代透明的高管名册。已审阅公开材料没有给出完整 C-suite、董事会名单，也没有清楚说明 2025 年融资轮之后的独立治理格局。


              披露有限，带来了真实的关键人集中风险。投资人和后续尽调需要管理层直接披露，才能看清财务、企业 GTM、法务 /
              合规和董事会监督分别由谁负责。现在，概览章节可以有把握地说：创始人仍居中心，治理透明度落后于资本形成速度。
