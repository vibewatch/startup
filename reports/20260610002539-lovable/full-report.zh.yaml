  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序视图与投资逻辑失效框架
        blocks:
          - type: paragraph
            body: >-
              Lovable 的风险栈最上面是安全和访问控制风险，其次是隐私与 AI 治理敞口，再往后是供应商依赖和经济模型不透明。2026 年 4
              月的公开项目事件重要，因为它不是一个假设性的边缘案例：公司称，两个多月里，任何拿到链接并已认证的用户都可能访问公开项目的聊天历史和源代码；由于 HackerOne 分诊文档过期，有效报告被关闭且没有升级。更早的
              Vidoc 分析之所以重要，是因为它说明 Lovable 快速产品表面之下有多复杂的信任边界。2026
              年状态页反复出现的事件，也从运营层面证明服务可靠性仍在成熟。上述问题并不会直接杀死公司，但会改变举证责任。投资者应把 Lovable
              视为有前景、但仍难承销的平台，直到尽调确认事件通知处理、供应商集中度、企业续约，以及公开营销页面之外的控制深度。
