      - number: '8.3'
        title: 建议：上一轮已完成价格足够合理，可以继续跟进，但仅凭公开材料还不足以买入
        blocks:
          - type: paragraph
            body: >-
              仅凭公开材料，正确结论是继续研究：中等信心、高风险，估值立场是上一轮已完成价格尚可，但下一步偏紧。如果投资者相信当前 $500 million 运行率能持续，自助需求仍能变现，企业采用继续爬升，那么上一轮
              $6.6 billion 可以辩护。这就是多头逻辑，而且并非凭空想象。但反向逻辑至少同样强：公开证据仍无法证明 Lovable
              是在打造一家持久软件公司，还是一个移动极快的自助漏斗，企业质量偏薄且利润率结构未知。Forbes 报道企业 ARR 只有约 $20
              million，这点尤其重要，因为通常最应享受高倍数的收入部分，在整体里仍占比很小。同样的证据缺口，让传闻中的 $12 billion
              下一轮更难支撑。在这个价格上，投资者又要承销相对公开软件的尖锐溢价，并且需要对留存、贡献毛利和股权结构表干净程度有信心；公开文件并不能提供这些。因此，公司仍然令人印象深刻，但选股问题不是 Lovable
              好不好，而是证据是否足以支持今天付出溢价。仅凭公开证据，答案是否定的。
