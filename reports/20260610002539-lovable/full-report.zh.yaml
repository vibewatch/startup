  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型和定价架构
        blocks:
          - type: paragraph
            body: >-
              Lovable 的公开财务图景，起点不是单一 SaaS seat 价格，而是一套混合变现栈。定价页显示，年付计划下 Pro 以每月 $25 提供低摩擦入口，Business 层为 $50，Enterprise
              则转向按公司规模加按量 credits 定价的平台费模型。条款里更重要的承保细节是：Lovable Cloud 和 AI Gateway 使用独立 credit
              余额，叠加在平台订阅之上计费，并带有自动充值、结转规则，以及把订阅费和可变用量拆开的月度发票。也就是说，Lovable 变现的不只是软件访问权，还包括基础设施和模型消耗。法律栈也强化了这种分层：DPA
              覆盖、SSO、SCIM、审计日志和审批控制位于 Business 和 Enterprise 一侧，说明公司把合规和治理包装进更高价值计划。公开来源没有揭示的是实际经济性。Lovable 不披露企业
              ASP、seat 下限、折扣梯、云毛利率，或 ARR 中有多少来自经常性订阅、多少来自 credit top-ups。Product Hunt 评论情绪在这里有方向性价值：用户赞赏速度和设计质量，但也反复抱怨
              credits 昂贵，说明当用量提高时，变现已经在测试支付意愿。
