      - number: '7.4'
        title: 商业模式、客户和执行风险
        blocks:
          - type: paragraph
            body: >-
              商业模式风险的关键，不在于有没有需求，而在于企业条件下需求能否持久且有利润。Lovable 靠订阅额度、云与 AI
              用量以及充值收费，因此客户预算和毛利率质量，都取决于公开材料看不到的第三方模型、云和计费成本。治理也分层：许多最强控制，包括受限项目、SSO、SCIM、定期扫描和丰富审计能力，都位于低价层级之上，这会让公开增长故事看起来比企业就绪的控制面更宽。客户证明风险同样真实。公开记录里有若干具名成功案例，但它们高度集中在
              Lovable
              自有营销和博客材料，而不是独立的续约、队列或集中度证据。支持政策又增加一个执行折点，因为官方支持只保证给付费工作区的邮箱地址，并排除项目专属调试或第三方实施帮助。这不意味着客户结果弱；它意味着公开证据仍在集中度、可背书性、支持负载和单位经济上留下真实不确定性。
