      - number: '7.2'
        title: 法律、隐私、AI 治理和知识产权风险
        blocks:
          - type: paragraph
            body: >-
              法律和隐私敞口结构性偏高，因为 Lovable 处理代码、提示词、遥测、凭据和域名注册数据，同时把工作流路由到多个法域和多个供应商。隐私政策和 DPA 有帮助：它们明确区分免费 / Pro
              与企业版的处理方式，也写清处理者与控制者边界；但它们也把重要义务推回给客户，包括合法依据、安全配置、备份，以及不要上传 HIPAA 或其他敏感数据的决定。也就是说，Lovable
              可以只是软件供应商，但部署层面的合规风险仍留给买方。AI 专项监管进一步放大问题。EU AI Act 和 ICO 指引把公平、透明、问责和基本权利分析继续放在台面上；Lovable
              自己的条款也禁止未经审查地用于医疗、法律、金融和安全关键场景。知识产权和连续性风险也不轻，因为 Lovable 保留收回 lovable.app
              子域名和用户名的权利；需要自定义域名的用户，还必须自己处理反向代理层。本轮保留的公开材料没有披露具名监管通知或诉讼清单，因此投资者应直接索取证据，而不是把沉默等同于状态干净。
