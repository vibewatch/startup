      - number: '4.2'
        title: Topline 速度、traction 代理指标和收入质量边界
        blocks:
          - type: paragraph
            body: >-
              Lovable 拥有欧洲软件公司中最清楚的公开增长故事之一，但这个故事仍然更令人印象深刻，而不是已经足够承保。公司自己发布的里程碑显示：2025 年 2 月融资文章中的 $17 million ARR，推进到
              2025 年 7 月的 $100 million ARR、2025 年 11 月的 $200 million ARR、2026 年 2 月的 $400 million ARR，以及 2026 年 6 月约
              $500 million 的年化 run rate。用量代理指标沿着这条曲线放大：早期 Lovable 称已有 30,000 名付费客户、每天 25,000 个新项目、上线以来构建 1.2 million
              个应用；后续文章和 TechCrunch 报道则描述每天 100,000-plus 个新项目、首年 25 million 个项目、Lovable 构建应用每天 5 到 6 million 次访问，以及接近 8
              million 用户。质量问题在于结构。Forbes 称企业客户只贡献 $20 million ARR；如果这个数字相对 2026 年 run-rate 数据大致准确，就意味着大部分收入仍来自
              self-serve 或 prosumer 使用，而不是传统企业合同。这不会否定 topline，但会改变对耐久性、支持负担和 churn 风险的判断。公开分母数据也很混乱：员工数快照从 146 到 1,091
              不等，导致 revenue-per-employee 区间极宽。因此，Lovable 看起来已经变现且增长很快，但公开 traction 仍只是耐久单位经济性的残缺代理。
