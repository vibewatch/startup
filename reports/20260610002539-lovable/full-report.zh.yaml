      - number: '1.4'
        title: 里程碑、负面背景和控制面
        blocks:
          - type: paragraph
            body: >-
              Lovable 的前十八个月同时显示出产品宽度和控制压力。正面看，公司从 prompt-to-prototype 扩展到更完整的栈，推出 Lovable Cloud 和 AI、移动应用，收购 Molnett
              基础设施，并与 Aikido、Wiz 建立安全合作。这些动作说明，公司试图把消费级病毒式采用，转成企业能够信任、管理员能够治理的平台。


              负面记录同样重要，不能淡化。2025 年，Semafor 以及后来的 Cyber Security News 描述了 Lovable 构建应用中的广泛安全问题，问题与 Supabase 访问控制和 RLS
              策略配置错误或引导不足有关。这些报道重要，因为它们攻击的正是平台承诺最脆弱的位置：非技术用户很难自行审计。Lovable 自己在 2026 年 6 月的 scanner update
              也等于承认，自动化基线检查必要但不充分；第三方治理评论则认为，上线生产前仍必须做代码审查和渗透测试。


              2026 年 4 月事件，是公司自己提供的最清楚证据，说明控制缺口存在。Lovable 披露，2026 年 2 月 3 日至 4 月 20
              日期间，公共项目的聊天历史和源代码可能对持有链接的已认证用户可见；随后公司描述了两小时修复、仅模板例外继续公开，以及 HackerOne 流程再培训。再加上 2025 年 11
              月的供应商宕机，画面不是一家坏掉的公司，而是一家增长跑在流程成熟度前面的公司。因此，安全架构、披露纪律和企业治理，会成为后续每一章的核心尽调线索。
