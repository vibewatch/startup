      - number: '2.3'
        title: 买家、用户和付款方分层
        blocks:
          - type: paragraph
            body: >-
              Lovable 的买家地图比传统开发者工具更宽，因为它卖的是带部署的共享工作区，不只是 IDE 里的一个 seat。在 self-serve 端，创始人、产品经理和小型初创团队可以同时是买家、用户和付款方，尤其是
              USD 25 的共享计划和自定义域名已经足够发布真实产品时。往上走，产品、设计、运营和内部工具团队开始变重要，因为 low-code 需求本就横跨业务用户和 IT 开发者，相邻厂商也把 AI 业务应用、网站和
              prompt-to-app 体验卖给混合团队。付款方随后与日常用户分离：部门负责人或创新负责人支付工作区费用，而创建者、评审者和技术协作者都会接触项目。对更大账户，Lovable
              的企业销售动作和治理控制表明，平台归属会转向产品、创新或 IT sponsor，而不是单个工程师预算。这种跨职能形态，是 Lovable 市场不应只按经典 coding assistant 测算的核心原因。
