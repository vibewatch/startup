  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 供应商
      - 公开套餐
      - 价格 / 单位 / 合同模式
      - 包含能力
      - 折扣或未知项
      - 含义
    rows:
      - - Lovable
        - Pro / Business / Enterprise 层级
        - $25 / 月，无限用户共享；Business $50；Enterprise 平台费按公司规模计
        - 额度、自定义域名、协作；层级扩大后加入 SSO / SCIM / 审计日志式治理
        - 实际企业定价和额度消耗不公开
        - Lovable 的定价意在先落地自助服务，再向上进入大客户，而不是模仿只按席位收费的开发者工具
      - - Bolt
        - Free / Pro / Teams / Enterprise 层级
        - Free；Pro $25 / 月；Teams $30 / 成员 / 月；Enterprise 定制
        - 基于 token 的使用量、托管、自定义域名、数据库选项、访问控制
        - 企业价目表和实际使用经济性不公开
        - 定价与 Lovable 足够接近，工作流质量比自助服务标价更重要
      - - Replit
        - Starter / Core / Pro / Enterprise 层级
        - Starter 免费；Core $20 / 月，按年计费；Pro $95 / 月，按年计费；Enterprise 定制
        - 月度额度、已发布应用、协作者限制、并行智能体、企业网络 / 隐私控制
        - 按量付费使用和企业折扣让同口径比较变复杂
        - Replit 入门时看起来便宜，用量变重后会显得昂贵
      - - v0 / Vercel
        - v0 + Vercel 计划
        - v0 公开与 Vercel 定价配套；Vercel Pro 为 $20 / 月，另计使用量
        - GitHub 同步、部署流水线、使用额度、企业基础设施控制
        - v0 专属席位经济性不如 Vercel 基础设施定价明确
        - v0 可以靠捆绑部署经济性和现有 Vercel 支出压低相对价格
      - - Cursor / GitHub
        - Cursor Individual / Teams；Copilot Free / Pro / Pro+ / Max 层级
        - Cursor $20 / 月，Teams 为 $40 / 用户 / 月；Copilot 为 $0、$10、$39 或 $100 / 用户 / 月
        - 智能体编码、前沿模型、云端智能体、代码审查、GitHub 原生分发
        - Spark 定价尚未与更广 GitHub 界面清晰拆开
        - 只按席位比较时，开发者工具竞争可能看起来比 Lovable 更便宜
      - - Webflow
        - Starter / Basic / Premium / Team
        - Free Starter；Basic $15 / 月，按年计费；Premium $25；Team 年度合同
        - AI 建站器、MCP 服务器、云应用托管、CMS / 站点工作流
        - 平台计划定价无法直接与全栈构建器额度比较
        - 任务仍主要是网站而不是产品应用时，Webflow 最强
      - - Bubble
        - Free / Starter / Growth / Team / Enterprise 层级
        - Free；Starter $59，按年计费；Growth $209；Team $549；Enterprise 定制
        - AI 应用构建器、可视化迭代、移动 / Web 应用、基于工作负载的扩展
        - 更高团队层级让公开价格比较对早期买方不利于 Bubble
        - Bubble 更多靠成熟应用运营竞争，而不是靠低入门价格
      - - Glide
        - Free / Business / Enterprise 层级
        - Free；Business 起价 $199 / 月，按年计费；Enterprise 定制
        - 数据驱动应用构建器、包含用户、工作流、API 访问、企业附加功能
        - 使用量和额外用户定价把实际成本推到基础标价之上
        - Glide 面向业务软件替代定价，而不是廉价试验
      - - Figma Make
        - Starter / Professional / Organization / Enterprise 层级
        - Starter 免费但有 AI 点数上限；完整席位按方案每月 $16、$55、$90
        - Make 加上更完整的 Figma 产品栈、AI 点数、设计库、管理控制
        - AI 点数和席位组合让不同团队的总成本可变
        - Figma 可以把原型搭建工作吸收到设计预算里，不必另买独立构建器
    notes: 各行只比较公开标价和打包方式；私下折扣、企业承诺和真实消耗经济性仍有意标为未知。
