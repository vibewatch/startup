      - number: '2.5'
        title: 缺口、矛盾和仍未证实之处
        blocks:
          - type: paragraph
            body: >-
              核心分析风险，是把一个快速移动的产品集群，当作已经拥有稳定报告类别。公开证据基础用宽口径衡量 low-code，通过开发者调查衡量 AI coding assistants，再通过厂商定位和定价衡量相邻 app
              builders。这足以证明一个真实市场正在形成，但不足以产出一个干净的 Lovable-only
              SAM。买家问题也因此留下几处未解：需求中有多少来自非开发者，有多少来自传统开发者；多少团队会从原型推进到受治理的生产使用；workspace-credit
              定价会带来耐久扩张，还是主要促成低摩擦试验。这些缺口重要，因为 Lovable 处在多个预算池交汇处。如果公司捕获的是非技术团队和原型密集部门的软件创建工作，机会可能扩展到开发者 seats
              之外。如果采用仍集中在实验，同时治理和 runtime 复杂度上升，可变现池子可能远小于广义 low-code TAM
              所暗示的规模。因此本章保留下来的维度较窄：边界逻辑、相邻市场区间、买家地图、采用驱动，以及仍未证实的可服务切片。
