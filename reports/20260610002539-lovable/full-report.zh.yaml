        title: 发布速度、路线图线索和开发者信号
        blocks:
          - type: paragraph
            body: >-
              Lovable 的 2026 年发布节奏显示，平台在多个方向同时快速扩展：移动捕捉、desktop/MCP 控制、skills、subagents、SEO/AEO 工具、Wiz 集成和基于 TanStack 的
              SSR，都在短时间内到来。这个节奏意味着，公司正从「AI builder」激进扩张为更广的应用创建平台。开发者信号也支持这个判断，但需要加上 nuance。Product Hunt 评论赞赏 GitHub 和
              Supabase 集成、快速原型和设计输出，同时也指出成本、bug，以及在更大或更复杂项目上表现较弱。2024 年 11 月 Show HN 文章把 Lovable 描述为一次工程努力，目标是系统性降低 LLM
              在全栈开发中的 failure modes，这与今天的产品宽度相符。GitHub 存在感则混合：面向消费者的 org 没有公开 repos，而另一个 Lovable Labs org 开放了基础设施 /
              安全相邻开源项目，但没有开放核心 builder。到 2026 年中，iOS、Android 和 Product Hunt 上的移动端 traction
              看起来有意义，不过这些信号更多说明采用和好奇心，而不是企业耐久性。最强的读法是：Lovable 已经拿到真实的 developer / builder
              mindshare，但生态仍显得被公司策划和主导，还不像成熟开发者平台最终会形成的社区可扩展形态。
