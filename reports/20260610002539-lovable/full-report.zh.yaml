      - number: '2.4'
        title: 采用驱动、工作流迁移和治理约束
        blocks:
          - type: paragraph
            body: >-
              主要需求驱动来自速度、劳动力经济性，以及 AI 在软件工作流中的常态化。Low-code 分析师仍把品类锚定在更快应用交付和数字化转型上，BLS
              薪酬和就业增长数据则说明，组织为什么持续寻找软件创建杠杆。GitHub 的开发者研究显示，AI coding 使用已经进入主流，协作收益也被期待，这解释了为什么厂商现在打包共享工作区、并行 agents
              和一键发布，而不只是自动补全。但同一变化也带来约束。企业需要获批工具、身份控制、发布审批和清晰的数据处理规则，否则使用会滑入 shadow AI。Lovable 自己的安全定位和 2026 年 4
              月可见性事件让这种风险具体化：非技术用户如果分不清项目访问权限和已发布应用访问权限，信任就会成为更大规模部署的闸门。Runtime
              和托管成本同样重要，因为相邻厂商越来越把部署经济性打包进购买决策，把门槛从原型质量抬高到生产责任。
