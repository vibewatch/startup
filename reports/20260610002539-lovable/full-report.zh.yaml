      - number: '5.2'
        title: 产品架构、后端模型和部署栈
        blocks:
          - type: paragraph
            body: >-
              最能被公开证据支撑的架构故事，是分层架构。Lovable 提供前端构建界面、repository 和协作层，然后接入 Lovable 托管后端，或客户自己管理的 Supabase
              后端。公开文档和合作伙伴材料都持续指向 Supabase 是 Lovable Cloud 之下的数据 / 认证 / 存储基础，同时也区分了连接到用户自有 Supabase 实例的项目。2026 年，Lovable
              把新项目从 React + Vite SPA baseline 迁移到 TanStack Start，并在 Cloudflare Workers 上做 server-side
              rendering，这改善了首个请求的 HTML 交付、SEO 和 colocated server-function 模式。发布仍是 snapshot-based，而不是持续 live-sync；这让
              release 控制保持明确，但也意味着运营卫生取决于用户记得重新发布。自定义域名管理、SSL 签发、CDN / proxy 兼容性和基于 MCP
              的外部控制，把产品从生成延伸到部署和运营。因此，受支撑的图景是一套务实技术栈，拥有清晰的一方抽象，但并非完全透明：Lovable 对能力记录充分，却仍把一些底层 runtime、SLA
              和故障转移细节留在公开记录之外。
