  - id: TP004
    title: 护城河耐久度 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 缓释 / 尽调要求
    rows:
      - - 可编辑全栈代码加 GitHub 同步，让工作流更有粘性
        - 同样的可移植性会降低切换成本，让买方之后多平台并用或转向自建
        - 高
        - 要求披露代码导出频率、GitHub 同步绑定情况，以及导出后仍在 Lovable 内活跃构建的留存客户占比
      - - Lovable 可以靠治理能力上探企业市场
        - Replit、Cursor、Vercel、GitHub、Webflow 和 Figma 都在营销实质性的管理或安全控制
        - 高
        - 对比受监管客户赢单、SOC 或认证材料，以及采购成交率相对直接竞品的表现
      - - 直接构建器的价格是优势
        - Bolt 和 Replit 的公开自助价格足够接近，交易大概率由工作流深度和分发决定
        - 中
        - 复盘对 Bolt、Replit 和 v0 的赢单 / 输单原因，不要只依赖标价比较
      - - Prompt-to-app 速度是持久楔子
        - 直接构建器、GitHub Spark、Webflow AI、Bubble AI 和 Figma Make 现在都在宣传类似的从想法到产品叙事
        - 高
        - 测试 Lovable 在交付速度、代码质量和生成后编辑上是否明显胜过同业
      - - Lovable 可以成为技术与非技术混合团队的共享工作区
        - GitHub、Vercel、Webflow 和 Figma 已经占住相邻的协作或部署界面
        - 高
        - 衡量 Lovable 是在拿下全新团队，还是在替换买方每天已经使用的工具
      - - 对多数买方来说，内部自建太慢，影响有限
        - 开发者 AI 采用和通用智能体让重控制团队越来越有可能内部自建
        - 中
        - 按控制敏感型买方切分销售管线，检查交易输给内部自建而不是具名供应商的频率
    notes: 这张登记表聚焦会影响 Lovable 差异化和定价权的承保级威胁，而不是每一个战术功能缺口。
    enumerationScope:
