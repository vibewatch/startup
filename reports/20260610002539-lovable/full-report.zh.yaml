  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 到 2027 年收入扩大到接近 $800M-$1.0B，企业客户占比相对当前公开的 $20M 参照显著提升，信任问题没有扩散。
        - 对应 $12B-$18B 结果，约为上一轮已交割 $6.6B 估值的 1.8x-2.7x（稀释前），假设更高质量增长仍可拿到 12x-18x 溢价倍数。
        - 企业采用停滞，另一轮信任事件打击转化，或下一轮过早按完美情景定价。
        - 这种情景可能成立，但需要比当前公开材料更强的留存、结构和安全部署证据。
      - - 基准
        - 增长继续超过当前收入运行率，但证据质量只部分改善，投资人要求估值倍数适度压缩。
        - 对应 $5.5B-$8.5B，约为上一轮持平至 1.3x，按 9x-12x 收入并假设经营适度改善。
        - 公开市场继续挑剔，自助式收入的耐久度低于预期，或企业扩张仍然有限。
        - 最贴合当前证据：既承认真实增长，也惩罚缺失的质量指标。
      - - 悲观
        - 使用量仍高，但变现质量不及预期，安全担忧反复出现，估值倍数向公开软件区间收敛。
        - 对应 $2B-$4B，较上一轮约低 40%-70%；按 4x-7x 收入计算，收入基数为增速放慢后的 $350M-$500M。
        - 实验性项目留不住，企业买家犹豫，新融资必须低于预期才能成交。
        - 这种下行情景有现实性，因为它不需要需求崩塌，只需要业务质量弱于头部叙事暗示。
    notes: 区间是按情景划出的估值带，不是预测；目的在不确定性下约束承销判断，而不是制造精确感。
