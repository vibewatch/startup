chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、上线和产品范围
        blocks:
          - type: paragraph
            body: >-
              Lovable 一贯被描述为一家瑞典、总部位于斯德哥尔摩的 AI 初创公司，构建一个应用和网站创建平台，把自然语言提示词转成可运行软件。公司自己的定位异常明确：它并不想只做又一个面向专业工程师的 coding
              copilot，而是服务更大一群构建者——他们有软件想法，却没有能力或意愿从零写代码。官方材料、第三方访谈和后续融资报道里，都能看到这种身份定位。


              时间线很关键，因为公开来源用了两套时钟。当前 Lovable 产品在 2024 年 11 月上线，但产品血脉清楚追溯到 Anton Osika 在 2023 年创建的 GPT Engineer 项目，随后与
              Fabian Hedin 一起商业化，并在 2025 年 1 月更名为 Lovable。尽调里最稳妥的概览表述是：「2023 年起源，2024 年上线，2025 年重命名整合。」


              Lovable 也从基于提示词的原型构建器，扩展为更完整的平台。到 2025 年末和 2026 年初，公司已经加入 Lovable Cloud、Lovable AI、移动端入口，以及更多安全 /
              治理界面，让用户不用离开平台就能发布带认证、存储、集成和 AI 功能的应用。这种全栈化解释了为什么公开客户引用从原型转向生产用例。
