    customerCount: 500000
    headcount: null
  topStrengths:
    - >-
      Lovable compressed product launch, monetization, and financing into an unusually short window, moving from launch
      in late 2024 to a $6.6B Series B by December 2025 while public revenue references kept accelerating into 2026.
    - >-
      The product now covers much more than one-shot code generation: collaborative workspaces, editable code, GitHub
      sync, managed backend services, publishing, and governance features create a fuller prompt-to-production workflow
      than many point competitors.
    - >-
      Public customer proof includes both bottom-up replacement stories such as Atonom and larger enterprise references
      such as Klarna, HubSpot, HCA Healthcare, Uber, Microsoft, and Zendesk.
    - >-
      Lovable has attracted a deep investor and ecosystem bench spanning Accel, CapitalG, Menlo-linked capital, Khosla,
      Creandum, Google Cloud Marketplace, Supabase, and other partners that can reinforce distribution and credibility.
  topRisks:
    - >-
      Security and trust remain the clearest underwriting risk after public criticism of vulnerable Lovable-built apps
      in 2025 and Lovable's own April 2026 incident involving public-project code and chat visibility.
    - >-
      Revenue quality is still hard to underwrite because public evidence says enterprise ARR is only about $20M while
      total run-rate is around $500M, leaving retention, mix durability, realized pricing, and margin profile largely
      opaque.
    - >-
      Competitive pressure is intense and increasingly bundle-driven, with Bolt, Replit, v0, GitHub, Webflow, Bubble,
      Glide, and broader AI-coding stacks attacking the same jobs from stronger distribution positions.
    - >-
      The product depends materially on third-party model, cloud, and backend infrastructure such as OpenAI, Google,
      OpenRouter, Supabase, Stripe, and other providers, which raises vendor, privacy, outage, and economics risk.
    - >-
      At the last closed round the valuation can be argued as fair only if current growth proves durable; any move
      toward a rumored $12B step-up would look stretched without much stronger evidence on enterprise durability and
      governance.
  unresolvedGaps:
    - >-
      No public disclosure of gross margin, burn, runway, CAC, payback, or net revenue retention to test whether
      headline growth is efficient and durable.
    - >-
      No public cap-table detail on preference stack, liquidation waterfall, or other rights that matter at a $6.6B+
      private valuation.
    - >-
      No authoritative current headcount figure; public estimates range widely enough to break revenue-per-employee
      analysis.
    - >-
      No public customer concentration, renewal, cohort, or contract-length data to validate whether enterprise
      references translate into durable ARR.
    - >-
      No public SLA or independent assurance pack that fully closes security, support, and enterprise-governance
      diligence after the April 2026 incident.
