- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value or null
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Early 2025 ARR anchor
    - $17M ARR in the February 2025 company post
    - Medium
    - Shows Lovable monetized quickly before the major 2025 rounds
    - Request management ARR bridge and booked revenue for Q1 2025
  - - Mid-2025 ARR anchor
    - $100M ARR by July 2025
    - Medium-high
    - Critical point in the growth curve and Series A narrative
    - Request July 2025 ARR calculation and paid-subscriber cohorts
  - - Late-2025 ARR anchor
    - $200M ARR by November 2025
    - High
    - Corroborated by official and TechCrunch coverage; validates continued velocity
    - Request segment ARR split and churn through year-end 2025
  - - February 2026 ARR anchor
    - $400M ARR according to TechCrunch
    - Medium-high
    - Latest independently reported ARR milestone before the June 2026 run-rate
    - Request monthly recurring revenue series for Jan–Jun 2026
  - - June 2026 run-rate
    - ~$500M annualized revenue run rate
    - Medium
    - Best current public topline proxy, but still management-supplied to media and trackers
    - Request monthly recognized revenue and bookings by month
  - - Enterprise ARR
    - $20M ARR per Forbes in June 2026
    - Medium
    - Implies enterprise may still be a small portion of total run-rate
    - Request enterprise ARR, logo count, NRR, and average contract value
  - - Public employee count range
    - 146 to 1,091 depending on source
    - Low
    - The denominator drives every efficiency and sales-productivity proxy
    - Request HRIS headcount by role, geography, and employment type
  - - Annualized revenue per employee
    - 0.46M to 3.42M USD using $500M run-rate and public headcount range
    - Low
    - Illustrates how unreliable current efficiency reads are without a reconciled denominator
    - Request same-period revenue and headcount on a consistent basis
  - - Gross margin / CAC / payback / churn
    - null
    - Low
    - These are the core underwriting metrics and none are disclosed in reviewed public sources
    - Request contribution margin, CAC by channel, payback, GRR, and NRR by cohort
  notes: Public top-line data are unusually rich for a private company, but margin and denominator data are not. Treat every efficiency output as a range, not a management KPI.
