- id: verdict
  title: Financial verdict and diligence blockers
  body: 'The financial verdict is favorable on demand but incomplete on economics. Lovable has visible price points, a proven ability to convert usage into revenue, repeated evidence of hyperscale project creation, and clear access to equity capital. That is enough to say the business is real and already large. It is not enough to say the business is high quality. The missing metrics are exactly the ones needed for underwriting: enterprise mix by ARR, realized ASP after discounting, cloud and model gross margin, CAC and payback by channel, churn and retention by cohort, and a current cash-bridge with runway. The April 2026 security incident raises the diligence bar further because even if private projects and Lovable Cloud were not impacted, enterprise buyers will ask whether remediation costs, insurance claims, sales friction, or support burden changed after disclosure. Put differently: Lovable looks like a company with exceptional topline velocity and strong capital access, but public
    evidence still cannot separate hype-adjusted growth from durable, efficiently monetized software economics. The next diligence step should be a management data-room request focused on segment ARR, contribution margin, and liquidity, not another chronology of fundraising headlines.'
