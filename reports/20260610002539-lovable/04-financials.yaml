- id: TI002
  title: Pricing / monetization table
  columns:
  - Offer or surface
  - Price / contract
  - List vs. realized pricing
  - Included capabilities
  - Discounts or unknowns
  - Source implication
  rows:
  - - Free / starter usage
    - No disclosed recurring platform fee on pricing page excerpt
    - Entry point only
    - Access to free features plus daily credits
    - Conversion mechanics not publicly disclosed
    - Supports bottom-up acquisition but not unit-economics disclosure
  - - Pro
    - 25 USD per month annual
    - Public list price
    - 100 monthly credits, daily credits, top-ups, custom domains, badge removal, roles
    - No public realized ARPU or overage behavior
    - Shows Lovable monetizes collaboration and usage together
  - - Business
    - 50 USD
    - Public list price
    - Everything in Pro plus internal publish, SSO, team workspace, security center
    - No public contract minimums or seat logic
    - Signals a trust and collaboration upsell
  - - Enterprise
    - Platform fee based on company size plus volume-based credit pricing
    - Custom pricing only
    - Dedicated support, onboarding, SCIM, design systems, custom connectors, audit logs
    - No public ASP, term, ramp, or volume tiers
    - Enterprise monetization exists but is not underwriteable from public data
  - - Cloud and AI Gateway balances
    - Separate metered balances on top of platform subscription
    - Terms-level billing design
    - Cloud hosting and model access meter separately
    - Actual take rate and markup are undisclosed
    - Variable usage likely matters as much as seat count
  - - Credit rollover and top-ups
    - Monthly or annual rollover rules plus optional auto-reload
    - Terms-level policy rather than revenue disclosure
    - Supports heavier usage and prepaid behavior
    - No public data on breakage or top-up incidence
    - Could create attractive prepaid cash flow, but there is no evidence yet
  notes: The public file provides list pricing and billing mechanics, not realized price realization. Every row above needs plan-mix and usage data before it becomes diligence-grade.
