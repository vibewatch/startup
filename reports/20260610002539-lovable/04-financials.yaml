- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwrite
  - Exact diligence path
  - Current public workaround
  - Residual risk
  rows:
  - - Enterprise ARR mix and contract quality
    - Cannot distinguish durable enterprise software from faster-turning self-serve credit spend
    - Request ARR by segment, logo counts, NRR, GRR, ACV, and contract terms
    - Use Forbes's $20M enterprise ARR quote only as a directional clue
    - High
  - - Realized pricing and discounting
    - Cannot convert list prices into actual ARPU or gross profit
    - Request plan-level subscriber counts, realized ASP, discounts, and top-up behavior
    - Rely on pricing page and terms only for billing structure
    - High
  - - Gross margin by revenue stream
    - Cannot tell whether usage credits are accretive after model and hosting costs
    - Request subscription gross margin, cloud COGS, AI Gateway pass-through, and support costs
    - Use Supabase or model-dependency disclosures only as qualitative clues
    - High
  - - CAC, payback, and channel efficiency
    - Cannot judge whether community-led growth remains efficient at current scale
    - Request CAC by acquisition channel, blended CAC, payback, and sales or marketing efficiency
    - Use Product Hunt and growth-story anecdotes as GTM proxies only
    - High
  - - Cash balance, burn, and runway
    - Cannot assess capital adequacy or financing urgency
    - Request latest balance sheet, monthly burn, and 12-month runway model
    - Infer only that capital markets remain open from prior rounds and valuation chatter
    - High
  - - Headcount basis
    - Revenue-per-employee and operating leverage stay too noisy to underwrite
    - Request HRIS roster split by FTE, contractor, and function
    - Use the 146 to 1,091 public range only as a sensitivity band
    - Medium-high
  - - Security-incident cost impact
    - Cannot quantify enterprise sales friction, legal exposure, or incremental security spend after April 2026
    - Request churn analysis, insurance claims, remediation spend, and customer communications
    - Use incident disclosures only to flag diligence risk, not P&L impact
    - Medium-high
  - - Debt, covenants, and off-balance-sheet obligations
    - Cannot rule out venture debt, guarantees, or working-capital constraints
    - Request debt schedule, covenants, and any hosting or model-commitment minimums
    - No public disclosure found
    - Medium
  notes: Lovable's main financial blocker is not lack of public growth signals; it is lack of margin, liquidity, and segment-level disclosures that convert growth into investable economics.
