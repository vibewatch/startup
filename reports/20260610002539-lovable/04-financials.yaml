tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value or status
  - Quality
  - Diligence ask
  rows:
  - - Pro / Business subscriptions
    - Fixed recurring plan fee for software access and collaboration features
    - Account or workspace
    - Public list prices are visible at $25 and $50 respectively
    - 'Medium-high: list price is clear, realized ASP is not'
    - Request subscriber counts, monthly ARPU, and plan mix by geography
  - - Enterprise platform fee
    - Custom enterprise contract priced by company size and governance needs
    - Company or employee-base contract
    - Enterprise pricing is custom rather than self-serve
    - 'Medium: structure is visible, contract terms are opaque'
    - Request average contract value, term length, and discount approval policy
  - - Lovable Cloud credits
    - Usage-priced hosting, database, storage, and backend services
    - Cloud credit consumption
    - Terms describe a separate cloud-credit balance on top of subscriptions
    - 'Medium: monetization exists, margin is unknown'
    - Request cloud-credit revenue, COGS, and attach rate by plan
  - - AI Gateway credits
    - Usage-priced access to third-party AI models through Lovable infrastructure
    - AI gateway credit consumption
    - Terms describe a distinct AI Gateway balance and meter
    - 'Medium: valuable monetization lever, but pass-through margin unknown'
    - Request model-provider spend, markup policy, and top-up conversion rates
  - - On-demand top-ups and auto-reload
    - Users purchase additional credits when allocations run low
    - Incremental credit purchase
    - Supported in terms and pricing copy
    - 'Medium: supports land-and-expand economics, but elasticity is unknown'
    - Request monthly top-up buyers, spend per buyer, and refund or forfeiture rates
  - - Compliance and governance upsell
    - Business and Enterprise include DPA, SSO, SCIM, approvals, and audit logs
    - Higher-trust package
    - Enterprise readiness is part of the premium offer
    - 'Medium: useful for contract expansion, but pricing uplift is not disclosed'
    - Request pricing uplift attributable to security and compliance features
  notes: Lovable monetizes through a hybrid of subscription access and metered cloud or AI usage. Public sources show the structure, but not the realized mix or gross-profit contribution of each stream.
