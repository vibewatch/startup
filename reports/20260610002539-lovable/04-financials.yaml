callouts:
- calloutType: insight
  title: Hybrid monetization is visible already
  body: Lovable is not just charging for access to software. The public record shows recurring platform fees layered with usage-based cloud and AI credits, which means topline can scale quickly even before enterprise contracts dominate.
  claimRefs:
  - CI001
  - CI003
  - CI004
  - CI005
- calloutType: risk
  title: Revenue quality is still mix-dependent
  body: Forbes's $20M enterprise-ARR figure implies the most durable revenue segment may still be small relative to the headline run-rate. Without cohort retention and gross-margin data, public topline should not be treated as proof of high-quality recurring revenue.
  claimRefs:
  - CI020
  - CI031
  - CI032
  - CI045
- calloutType: recommendation
  title: Ask for a segment margin and runway pack
  body: Before underwriting Lovable's next round, request segment ARR, realized pricing, contribution margin by revenue stream, headcount reconciliation, and a 12-month cash bridge. Those five files would close most of the remaining financial blind spots.
  claimRefs:
  - CI036
  - CI045
