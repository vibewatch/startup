- id: TI004
  title: Capital adequacy table
  columns:
  - Metric
  - Public value or status
  - Confidence
  - Why it matters
  - Exact diligence ask
  rows:
  - - Headline disclosed equity rounds
    - $15M early round, $200M Series A, $330M Series B
    - High
    - Shows strong access to equity capital and investor appetite
    - Request cap table and financing summary by round and instrument
  - - February 2025 Form D
    - 22.77M total offering amount; 20.16M sold; includes 7.77M cancelled SAFEs
    - High
    - Indicates real capital formation before the $200M Series A headline
    - Request whether this was seed extension, SAFE conversion, or another instrument
  - - July 2025 Form D
    - 193.43M total offering amount; 192.74M sold; includes 3.935M cancelled SAFEs
    - High
    - Directionally corroborates the Series A but does not match the headline perfectly
    - Request reconciliation of gross proceeds versus converted instruments
  - - December 2025 Form D
    - 425.62M total offering amount; 425.01M sold; includes 9.625M cancelled SAFEs
    - High
    - Suggests a financing event larger or structurally different than the $330M headline alone
    - Request primary versus secondary split and cash proceeds to the company
  - - Latest public valuation signal
    - $12B fundraising talks reported by Forbes in June 2026
    - Medium
    - Useful as market appetite signal, but not as a closed financing fact
    - Request current board-approved financing plan and valuation materials
  - - Planned use of funds
    - Deeper integrations, collaboration or governance, infrastructure, and possible acquisitions
    - Medium-high
    - Indicates growth capital may fund both product and strategic M&A
    - Request 24-month operating plan and M&A budget or criteria
  - - Cash on hand
    - null
    - Low
    - Public sources do not disclose available liquidity
    - Request latest cash balance and restricted-cash detail
  - - Monthly burn and runway
    - null
    - Low
    - Public sources do not show whether Lovable is cash generative or still burning aggressively
    - Request monthly P&L, cash-flow statements, and downside runway scenario
  - - Debt or project-finance obligations
    - No public debt or covenant disclosure found in reviewed sources
    - Low
    - Absence of disclosure is not proof of absence of leverage
    - Request debt schedule, venture debt terms, and covenant package
  - - Capital deployment beyond product
    - TechCrunch says Lovable is looking for acquisitions in 2026
    - Medium
    - Acquisitions can change cash needs and integration risk
    - Request M&A pipeline, integration budget, and capital-allocation policy
  notes: Public sources make the fundraising path visible but leave liquidity opaque. The key diligence job is reconciling securities sold, cash proceeds, and remaining runway.
