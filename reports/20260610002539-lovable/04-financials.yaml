  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Latest balance sheet, monthly cash burn, runway model, and any debt or covenant schedule.
    whyItMatters: Without liquidity data, capital adequacy cannot be underwritten even if topline momentum is real.
    diligencePath: Request the last 12 months of cash balance, operating cash flow, board budget, and debt schedule.
    relatedQuestionRefs:
    - QI015
    - QI028
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: enterprise-mix
    missingEvidence: ARR split by enterprise versus self-serve, paying enterprise count, average contract value, and expansion or renewal rates.
    whyItMatters: Revenue quality hinges on whether Lovable is mostly durable enterprise software or a faster-turning self-serve credit business.
    diligencePath: Request cohort-level ARR by segment, enterprise logo counts, NRR, GRR, and contract-term distribution.
    relatedQuestionRefs:
    - QI008
    - QI026
    - QI027
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: margin-cac
    missingEvidence: Gross margin by subscription, cloud hosting, and AI gateway; CAC and payback by channel; churn and retention by cohort.
    whyItMatters: The business mixes subscriptions with usage credits, so topline alone does not reveal unit economics or scalability.
    diligencePath: Request contribution margin bridge, cloud or model pass-through costs, CAC by acquisition channel, and cohort retention files.
    relatedQuestionRefs:
    - QI020
    - QI021
    - QI026
    relatedTableRefs:
    - TI003
    - TI005
  - type: conflicting-data
    severity: material
    topic: headcount-basis
    missingEvidence: A reconciled employee count that distinguishes full-time employees, contractors, and country payroll entities.
    whyItMatters: Public efficiency proxies swing dramatically depending on whether Lovable has about 146, 517, 1,039, or 1,091 employees.
    diligencePath: Request HRIS export by legal entity, employment type, function, and month-end headcount.
    relatedQuestionRefs:
    - QI017
    - QI018
    - QI025
    relatedTableRefs:
    - TI003
  - type: conflicting-data
    severity: material
    topic: funding-reconciliation
    missingEvidence: Management reconciliation of headline rounds versus Form D sold amounts, including SAFE cancellations and any secondary components.
    whyItMatters: Investors need to understand how much capital was primary, secondary, or instrument conversion before sizing dilution and cash proceeds.
    diligencePath: Request financing summary by round, security type, primary or secondary split, and cash proceeds net of SAFE conversions.
    relatedQuestionRefs:
    - QI013
    - QI025
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: incident-impact
    missingEvidence: Quantified incident costs, customer churn, contractual remediation obligations, cyber-insurance claims, and any pipeline loss.
    whyItMatters: The April 2026 incident may affect enterprise conversion, support cost, and legal exposure even if private projects were not impacted.
    diligencePath: Request post-incident churn analysis, customer notices, security-spend delta, support-ticket volume, and insurance correspondence.
    relatedQuestionRefs:
    - QI022
    - QI028
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Actual blended ASP, top-up conversion rates, cloud-credit attach, and discount ladders by plan.
    whyItMatters: List prices alone do not show willingness to pay or whether reported ARR is supported by healthy gross profit after model and hosting costs.
    diligencePath: Request plan-level subscriber counts, realized ARPU, top-up purchase rates, and enterprise discount approvals.
    relatedQuestionRefs:
    - QI004
    - QI026
    relatedTableRefs:
    - TI002
    - TI005
