  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adjacent categories
        blocks:
          - type: paragraph
            body: >-
              Lovable is best understood as a prompt-to-production app builder, not just a coding copilot and not just a
              no-code site tool. Its own documentation says a project can include frontend, backend, database,
              authentication, integrations, editable code, and GitHub sync, while the homepage frames the product as
              creating apps and websites by chatting with AI. That puts Lovable inside a narrow layer of AI-native
              software creation tools that sits within broader low-code development spend but overlaps with several
              adjacent categories. Bubble and Glide show the no-code business-app lineage; Webflow shows the AI
              website-builder edge; Figma Make captures the design-and-prototype edge; and Cursor plus GitHub Copilot
              represent the coding-assistant edge. Replit, v0, Bolt, and GitHub Spark matter because they confirm a
              separate cluster of tools that promise prompt-to-app creation and fast publishing. The practical status
              quo is still a mix of human engineers, agencies, design tools, low-code stacks, and coding assistants
              stitched together manually rather than one governed workspace.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM010
