            body: >-
              Lovable’s clearest differentiation is that it combines surfaces that are often split across multiple
              vendors: prompt-driven app creation, collaborative editing, code access, GitHub export/sync, managed
              backend, publishing, custom domains, and increasingly security/governance controls. That integrated path
              is why users and reviewers repeatedly compare it favorably against UI-only builders or pure code copilots.
