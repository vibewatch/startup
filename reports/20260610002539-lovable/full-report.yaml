      - number: '3.3'
        title: Switching cost, multi-homing, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Lovable's strongest strategic upside is also a source of fragility. Editable code, GitHub sync, and
              collaboration features make the product easier to adopt inside real software workflows than many legacy
              no-code tools. Those same properties also reduce lock-in because teams can move work into internal
              engineering processes, multi-home across tools, or switch vendors once a project reaches escape velocity.
              In other words, Lovable may be easier to trust precisely because it is less closed than classic no-code
              platforms.


              That makes bundle power and adjacent ownership the central risk. GitHub can attach Spark and Copilot to
              repos, auth, and developer identity that buyers already use. Vercel can attach v0 to deployment and
              infrastructure. Webflow and Figma can attach AI generation to design systems and publishing flows. Bubble
              and Glide can win when buyers prioritize operational app management over code ownership. Internal build
              remains a live substitute because AI tool adoption is already high enough that many teams can approximate
              Lovable's outcome with general-purpose assistants plus existing cloud and repo tooling. Lovable therefore
              has a credible wedge, but its moat looks execution-dependent rather than structurally durable: it must
              keep shipping faster, preserve the editable-code advantage, and prove that its governance and
              collaboration surface can scale faster than larger rivals can copy the workflow.
