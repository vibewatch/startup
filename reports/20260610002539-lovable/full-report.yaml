        title: Topline velocity, traction proxies, and revenue-quality limits
        blocks:
          - type: paragraph
            body: >-
              Lovable has one of the clearest public growth stories in European software, but that story is still more
              impressive than underwriteable. Company-authored milestones move from $17 million ARR in the February 2025
              fundraise post to $100 million ARR by July 2025, $200 million ARR by November 2025, $400 million ARR in
              February 2026, and roughly $500 million annualized run rate by June 2026. Usage proxies scale with that
              curve: early on, Lovable said it had 30,000 paying customers, 25,000 new projects per day, and 1.2 million
              apps built since launch; later posts and TechCrunch coverage describe 100,000-plus new projects per day,
              25 million projects in the first year, 5 to 6 million daily visits to Lovable-built apps, and nearly 8
              million users. The quality question is mix. Forbes says enterprise customers account for only $20 million
              of ARR, which, if directionally accurate against the 2026 run-rate figures, implies most revenue still
              comes from self-serve or prosumer usage rather than traditional enterprise contracts. That does not
              invalidate the topline, but it does change how to think about durability, support burden, and churn risk.
              Public denominator data are also messy: headcount snapshots range from 146 to 1,091, producing an enormous
              revenue-per-employee band. So Lovable looks monetized and fast-growing, but public traction is still an
              incomplete proxy for durable unit economics.
