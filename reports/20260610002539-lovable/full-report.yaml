      - number: '2.4'
        title: Adoption drivers, workflow shifts, and governance constraints
        blocks:
          - type: paragraph
            body: >-
              The main demand drivers are speed, labor economics, and the normalization of AI in software workflows.
              Low-code analysts still anchor the category in faster application delivery and digital transformation,
              while BLS pay and job-growth data show why organizations continue looking for leverage in software
              creation. GitHub's developer research suggests AI coding use is already mainstream and collaboration
              benefits are expected, which helps explain why vendors now package shared workspaces, parallel agents, and
              one-click publishing rather than only autocomplete. But the same shift introduces constraints. Enterprises
              need approved tools, identity controls, publishing approvals, and clear data-handling rules or usage moves
              into shadow AI. Lovable's own security positioning and April 2026 visibility incident make that risk
              concrete: when non-technical users cannot clearly distinguish project access from published-app access,
              trust becomes a gating factor for broader deployment. Runtime and hosting costs also matter because
              adjacent vendors increasingly bundle deployment economics into the buying decision, which raises the bar
              from prototype quality to production accountability.
