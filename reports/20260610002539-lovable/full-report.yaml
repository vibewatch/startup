      - number: '2.2'
        title: Sizing lenses and estimate range
        blocks:
          - type: paragraph
            body: >-
              Public market data supports a large adjacent opportunity but not a clean Lovable-sized category. Broad
              low-code estimates cluster around roughly USD 15.7 billion to USD 15.8 billion in 2026 when using
              Precedence directly or Grand View as a derived CAGR bridge, yet MarketsandMarkets published a much higher
              USD 45.5 billion figure for 2025. That is too wide a spread to treat as a single consensus TAM, and it
              likely reflects different definitions of what counts as platform revenue, services, components, or
              forecast coverage. The strongest numeric lens for Lovable is therefore layered: an outer low-code market,
              a developer-labor and AI-adoption demand lens showing why software creation tools matter, and a narrower
              serviceable slice where buyers want prompt-to-deployed applications with collaboration and governance. BLS
              labor data and GitHub's adoption surveys reinforce demand, but none of the public sources isolates a
              standalone market for governed vibe-coding platforms. That forces this chapter to preserve multiple lenses
              rather than invent a false-precision SAM or SOM.
