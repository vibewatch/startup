chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, launch, and product scope
        blocks:
          - type: paragraph
            body: >-
              Lovable is consistently described as a Swedish, Stockholm-based AI startup building an app and website
              creation platform that turns natural-language prompts into working software. The company’s own positioning
              is unusually explicit: it is not trying to be just another coding copilot for professional engineers, but
              a product for the much larger population of builders who have software ideas without the ability or desire
              to code from scratch. That identity is visible across official materials, third-party interviews, and
              later financing coverage.


              The timeline matters because public sources use two different clocks. The current Lovable product launched
              in November 2024, while the product lineage clearly traces back to the 2023 GPT Engineer project created
              by Anton Osika and then commercialized with Fabian Hedin before the January 2025 rebrand to Lovable. For
              diligence purposes, the safest overview framing is “2023 roots, 2024 launch, 2025 rebrand consolidation.”


              Lovable also broadened from a prompt-based prototype builder into a fuller platform. By late 2025 and
              early 2026 the company had added Lovable Cloud, Lovable AI, mobile access, and more security/governance
              surfaces, allowing users to ship apps with authentication, storage, integrations, and AI features without
              leaving the platform. That fuller-stack move helps explain why public customer references shifted from
              prototypes toward production use cases.
