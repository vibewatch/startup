      - number: '1.4'
        title: Milestones, adverse context, and control surface
        blocks:
          - type: paragraph
            body: >-
              Lovable’s first eighteen months show both product breadth and control stress. On the positive side, the
              company expanded from prompt-to-prototype toward a fuller stack with Lovable Cloud and AI, a mobile app, a
              Molnett infrastructure acquisition, and security partnerships with Aikido and Wiz. Those steps show a
              company trying to convert consumer-style viral adoption into a platform that enterprises can trust and
              administrators can govern.


              The adverse record is also material and should not be minimized. In 2025 Semafor and later Cyber Security
              News described widespread security issues in Lovable-built apps tied to misconfigured or insufficiently
              guided Supabase access controls and RLS policies. Those reports matter because they attack the platform
              promise at exactly the place a non-technical user cannot easily audit. Lovable’s own June 2026 scanner
              update implicitly acknowledges that automated baseline checks are necessary but not sufficient, and
              third-party governance commentary argues that code review and pentesting remain essential before
              production deployment.


              The April 2026 incident is the clearest company-owned evidence of that control gap. Lovable disclosed that
              public-project chat histories and source code could have been visible to authenticated users with links
              between February 3 and April 20, 2026, then described a two-hour fix, template-only public exceptions, and
              HackerOne process retraining. Combined with the November 2025 vendor outages, the picture is not of a
              broken company, but of one whose growth has outrun process maturity. That makes security architecture,
              disclosure discipline, and enterprise governance a central diligence thread for every later chapter.
            claimRefs:
