  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - Enterprise mix stays de minimis
        - Enterprise ARR remains near the current public ~$20M level while headline run-rate keeps rising.
        - The business increasingly looks like monetized experimentation rather than premium enterprise software.
        - Do not underwrite a step-up round above the last close without discounted pricing.
      - - Another trust or security event
        - A repeat incident suggests secure deployment is not becoming easier with scale.
        - Enterprise conversion, retention, and later-stage investor appetite would all deteriorate at once.
        - Move from fair / research-more to stretched or avoid until remediation quality is proven.
      - - Next round clears near or above $12B without new quality disclosure
        - Price rises while the evidence set stays mostly unchanged.
        - The valuation again outruns what public comps and current diligence can support.
        - Pass on new money or require materially stronger downside protection.
      - - Run-rate stalls below ~$600M while public multiples compress
        - Growth slows before Lovable proves enterprise durability.
        - >-
          The current premium loses support and the valuation converges toward public-software bands faster than
          expected.
        - Re-underwrite to the base or bear range immediately.
      - - Cap-table terms prove punitive
        - Preferences, ratchets, or participation consume value in a sub-bull exit.
        - Common-equity outcomes can disappoint even if the company still grows.
        - Require a full waterfall model before underwriting any return target.
    notes: >-
      These are monitorable valuation triggers, not operating forecasts; each one matters because it changes either the
      denominator quality or the acceptable multiple.
    claimRefs:
      - CV009
      - CV010
      - CV017
      - CV019
      - CV020
      - CV021
      - CV044
      - CV047
      - CV048
  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner or diligence path
    rows:
      - - Enterprise mix and retention
        - ARR split by self-serve, prosumer, and enterprise plus NRR and gross logo retention by cohort.
        - >-
          This is the core bridge between a premium software multiple and a fast but lower-quality consumer-style
          run-rate.
        - CFO data room, cohort deck, and customer-level renewal analysis.
      - - Gross margin and usage economics
        - Hosting, model, support, and credit top-up margin by customer segment.
        - >-
          A builder with high infrastructure pass-through should not trade like pure software at the same headline
          revenue.
        - Finance team margin bridge plus infrastructure-vendor contracts.
      - - Cap table and preference stack
        - Share classes, liquidation preferences, ratchets, participation rights, and any side letters.
        - Return math can change materially even if the topline valuation headline looks unchanged.
        - Counsel-reviewed cap-table export and waterfall model.
      - - Security and trust trajectory
        - >-
          Remediation history, penetration-testing cadence, secure-by-default product changes, and enterprise incident
          disclosures.
        - Trust incidents can compress multiples before they visibly hit topline because they alter adoption quality.
        - Security lead review, audit artifacts, and enterprise customer reference calls.
      - - Round terms versus rumor
        - Whether any new financing is actually clearing near $12B and on what investor protections.
        - >-
          The next step-up is the key price-sensitivity question; a flat or structured round would materially change the
          call.
        - Board materials, signed term sheet, and counsel summary of investor rights.
    notes: >-
      Every ask is designed to resolve the evidence-quality gap that separates a trackable momentum story from an
      investable price today.
    claimRefs:
      - CV009
      - CV010
      - CV018
