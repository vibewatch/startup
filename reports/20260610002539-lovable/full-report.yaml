      - number: '2.3'
        title: Buyer, user, and payer segments
        blocks:
          - type: paragraph
            body: >-
              Lovable's buyer map is broader than traditional developer tooling because the product is sold as a shared
              workspace with deployment, not just as a seat in an IDE. At the self-serve end, founders, product
              managers, and small startup teams can be buyer, user, and payer at once, especially when a USD 25 shared
              plan and custom domains are enough to launch something real. Moving upmarket, product, design, operations,
              and internal-tool teams start to matter because low-code demand already spans business users and IT
              developers and because adjacent vendors sell AI business apps, websites, and prompt-to-app experiences to
              mixed teams. The payer then separates from the daily user: a department head or innovation owner funds the
              workspace while creators, reviewers, and technical collaborators all touch the project. For larger
              accounts, Lovable's enterprise sales motion and governance controls suggest platform ownership moves
              toward a product, innovation, or IT sponsor rather than a single engineer budget. That cross-functional
              shape is a core reason Lovable's market should not be sized like a classic coding assistant alone.
