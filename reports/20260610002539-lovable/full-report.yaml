  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and builder workflow
        blocks:
          - type: paragraph
            body: >-
              Lovable’s product is best understood as a workflow engine for turning prompts into production web
              applications, not as a single code-generation widget. Official docs describe a user journey that starts
              with plain-language instructions, then moves through shared workspaces, iterative chat, optional Plan mode
              reasoning, direct code inspection in Code mode, GitHub sync for ownership and branch-based collaboration,
              and finally publish/custom-domain distribution. This framing matters because Lovable is selling both speed
              and control: non-technical builders can stay in chat, while technical teams can inspect files, clone repos
              locally, and keep a synchronized copy outside the platform. Collaboration is built around
              project/workspace roles rather than ad hoc share links alone, which pushes Lovable beyond a solo
              prototyping tool toward a multi-user operating environment for building and shipping software. The core
              product promise is therefore not merely “AI writes code,” but “AI compresses the path from idea to
              governed, deployable web app while leaving code ownership available to the customer.”
