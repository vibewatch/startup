      - number: '5.3'
        title: Trust, security, privacy, and reliability posture
        blocks:
          - type: paragraph
            body: >-
              Lovable now foregrounds trust controls as a product feature set, not just a legal appendix. Public
              materials advertise SOC 2 Type II, ISO 27001:2022, SSO/SCIM, publish gating, secret handling,
              row-level-security review, dependency scanning, and optional partner tooling like Wiz. The security
              controls are meaningful because Lovable’s core workflow lets non-specialists create full-stack software
              quickly, which increases the need for default safeguards. However, the April 2026 visibility incident is a
              real counterweight to the marketing posture. Lovable publicly disclosed that public-project chat history
              and source code were incorrectly reachable for a period, then responded by fixing the permission issue,
              changing defaults, and reworking its HackerOne process. That transparency is a positive signal, but it
              also proves the platform is still maturing its permission model and security operations in public. Privacy
              language is comparatively explicit about Supabase-hosted data, third-party AI provider pass-through via
              the AI Gateway, and workspace data-training controls, yet there is still no public uptime/SLA package that
              would let an enterprise buyer underwrite hosting reliability with the same confidence as the
              security/compliance claims.
