        title: Product architecture, backend model, and deployment stack
        blocks:
          - type: paragraph
            body: >-
              The most supportable architecture story is a layered one. Lovable provides a front-end build surface, a
              repository and collaboration layer, and then either a Lovable-managed backend or a customer-managed
              Supabase backend. Public docs and partner materials consistently point to Supabase as the
              data/auth/storage foundation under Lovable Cloud, while also distinguishing projects connected to a
              user-owned Supabase instance. In 2026 Lovable migrated new projects from a React + Vite SPA baseline to
              TanStack Start with server-side rendering on Cloudflare Workers, which improves first-request HTML
              delivery, SEO, and colocated server-function patterns. Publishing remains snapshot-based rather than
              continuously live-syncing, which keeps release control explicit but also means operational hygiene depends
              on the user remembering to republish. Custom-domain management, SSL issuance, CDN/proxy compatibility, and
              MCP-based external control extend the product from generation into deployment and operations. The
              supported picture is therefore a pragmatic stack with clear first-party abstractions, but not a fully
              transparent one: Lovable documents capabilities well, yet still leaves some lower-level runtime, SLA, and
              failover details outside the public record.
