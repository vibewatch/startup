  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Price context: the headline multiple has already normalized once, but evidence quality still lags growth'
        blocks:
          - type: paragraph
            body: >-
              Lovable's valuation story has already gone through two very different phases. In July 2025, the company
              and TechCrunch aligned on a $200 million Series A at a $1.8 billion valuation, which roughly equated to an
              18x multiple on the public $100 million ARR milestone. By December 2025, the company, TechCrunch, and CNBC
              aligned on a $330 million Series B at a $6.6 billion valuation, implying roughly 33x on the then-public
              $200 million ARR mark. That looked extreme on any conventional software screen. The picture changed again
              by June 2026, when TechCrunch, Sacra, and GetLatka all pointed to a roughly $500 million annualized
              revenue run rate. On that newer denominator, the last closed $6.6 billion valuation screens closer to 13x
              run-rate revenue—still premium, but no longer absurd relative to high-growth software. The problem is that
              the denominator itself is not diligence-grade. Lovable's revenue references are management-reported ARR or
              run-rate, not audited financials; Forbes also said only about $20 million of ARR is enterprise; and the
              public file is still silent on retention, gross margin, CAC, burn, runway, and liquidation preferences.
              That means the valuation can be made to look reasonable on momentum, but not yet robust on quality.
            claimRefs:
              - CV001
              - CV003
