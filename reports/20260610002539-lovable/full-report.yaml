      - number: '1.2'
        title: Founders, leadership, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Lovable remains closely identified with its two founders. Anton Osika is the public CEO and Fabian Hedin
              the public CTO, and both continue to anchor the company’s external narrative around software creation for
              non-coders. Third-party profiles highlight why that story resonates: Osika previously built technical
              products before Lovable and Hedin had unusually strong technical credibility for accessibility and AI
              systems, which together helped the company bridge product vision and engineering speed.


              Leadership visibility outside the founders is still comparatively thin for a company at Lovable’s
              valuation. The most concrete non-founder executive role surfaced in the reviewed sources is CISO Igor
              Andriushchenko, who appears in 2026 security-partnership materials. That is useful evidence that the
              company is professionalizing its security posture, but it is not a substitute for a transparent executive
              roster. Public materials reviewed do not provide a full C-suite list, a board roster, or a clear picture
              of independent governance after the 2025 financing rounds.


              That limited disclosure creates real key-person concentration. Investors and later diligence work will
              need direct management disclosure to understand who owns finance, enterprise go-to-market,
              legal/compliance, and board oversight. For now, the overview chapter can say confidently that the founders
              remain central and that governance transparency lags capital formation.
