  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk view and thesis-break framing
        blocks:
          - type: paragraph
            body: >-
              Lovable’s risk stack is headed by security and access-control risk, then privacy and AI-governance
              exposure, then provider dependence and economic opacity. The April 2026 public-project incident matters
              because it was not a hypothetical edge case: the company says chat history and source code for public
              projects could be accessed by any authenticated user with a link for more than two months, and that valid
              reports were closed without escalation because its HackerOne triage documentation was stale. The earlier
              Vidoc write-up matters for a different reason: it shows how much trust-boundary complexity sits underneath
              Lovable’s fast product surface. Repeated 2026 status-page incidents add operational evidence that service
              reliability is still maturing. None of this kills the company outright, but it changes the burden of
              proof. Investors should treat Lovable as a promising but still hard-to-underwrite platform until diligence
              confirms incident-notification handling, vendor concentration, enterprise renewals, and the depth of
              controls beyond public marketing pages.
            claimRefs:
              - CR013
