      - number: '2.5'
        title: Gaps, contradictions, and what remains unproven
        blocks:
          - type: paragraph
            body: >-
              The core analytical risk is treating a fast-moving product cluster as if it already had a settled
              reporting category. The public evidence base measures low-code broadly, AI coding assistants through
              developer surveys, and adjacent app builders through vendor positioning and pricing. That is enough to
              prove a real market is forming, but not enough to produce a clean Lovable-only SAM. It also leaves several
              buyer questions unresolved: how much demand comes from non-developers versus classic developers, how many
              teams move from prototype to governed production use, and whether workspace-credit pricing creates durable
              expansion or mostly low-friction experimentation. Those gaps matter because Lovable sits at the
              intersection of multiple budget pools. If the company captures software creation work from non-technical
              teams and prototype-heavy departments, the opportunity can expand beyond developer seats. If adoption
              remains concentrated in experiments while governance and runtime complexity rise, the monetizable pool
              could be much smaller than broad low-code TAMs imply. This chapter therefore keeps the surviving
              dimensions narrow: boundary logic, adjacent market range, buyer map, adoption drivers, and the
              still-unproven serviceable slice.
            claimRefs:
              - CM019
              - CM037
              - CM038
              - CM039
              - CM040
              - CM041
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct builders, developer platforms, no-code incumbents, and internal build'
        blocks:
          - type: paragraph
            body: >-
              Lovable sits inside a widening competitive set rather than a single niche. The closest direct rivals are
              Bolt, Replit, and v0 because each markets a prompt-to-app workflow, a fast path to a live product, and
              enough code or deployment control to appeal to builders who want more than a static mockup. Lovable's own
              docs emphasize full-stack generation with editable code, GitHub sync, and shared workspaces, which places
              it closer to a productized software factory than to a pure website generator. That matters because buyers
              comparing Lovable are often not deciding between Lovable and a blank page; they are deciding between
              Lovable, another AI builder, a developer-first agent stack, a visual no-code tool, or an internal build
              path.


              The broader field matters just as much. Cursor plus GitHub Copilot and Spark attack the same budget from
              existing developer workflows, while Webflow, Bubble, Glide, and Figma Make attack from the visual-design
              and no-code side. Internal build also remains credible because developer AI tools are already mainstream
              enough to make buy-Lovable only one of several plausible ways to get to an app quickly. The result is a
              market where Lovable has a real differentiated bundle—full-stack generation plus editable code plus
              governance—but not a monopoly on the underlying job to be done.
