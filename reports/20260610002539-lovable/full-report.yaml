  - id: TP001
    title: Competitor profile table
    columns:
      - competitor
      - category
      - scale/funding
      - target segment
      - differentiation
      - limitation
    rows:
      - - Lovable
        - Direct AI app builder
        - Private startup; self-serve plus enterprise sales motion visible publicly
        - Product teams, founders, operators, mixed technical/non-technical builders
        - Full-stack generation with editable code, GitHub sync, shared workspaces, governance tiers
        - Installed base and enterprise traction are not publicly quantified in retained sources
      - - Bolt
        - Direct AI app builder
        - StackBlitz-owned product with self-serve and enterprise packaging
        - Design-aware builders and teams wanting fast hosted output
        - Prompt-to-app flow, design-system import, token-based packaging, model routing
        - Public positioning is strong, but ecosystem distribution looks smaller than GitHub or Vercel
      - - Replit
        - Direct AI app builder + cloud IDE
        - Established developer platform with paid plans up to enterprise
        - Builders wanting multi-agent workflows and hosted development
        - Parallel agents, built-in database, multi-artifact output, richer agent ceilings
        - Pricing rises quickly at Pro and distribution is more developer-led than business-led
      - - v0 / Vercel
        - Direct builder + deployment incumbent
        - Backed by Vercel platform and infrastructure GTM
        - Teams already deploying on Vercel or in modern web stacks
        - Prompt-build-publish flow with GitHub sync and one-click Vercel deployment
        - Workflow is tightly coupled to Vercel infrastructure and pricing
      - - Cursor
        - Agentic coding entrant
        - Fast-growing developer tool with team and enterprise tiers
        - Software engineers and engineering-led organizations
        - Autonomous coding agents, shared team context, enterprise controls
        - Less productized for non-technical builders than Lovable or Webflow
      - - GitHub Copilot / Spark
        - Bundled incumbent + entrant
        - GitHub says Spark rides a platform trusted by 150M+ developers
        - Developers and GitHub-native teams
        - Copilot pricing ladder, Spark one-click publish, repo/auth/distribution already in place
        - Spark is still public preview and Lovable is more purpose-built as a standalone builder
      - - Webflow
        - Website incumbent
        - Large website platform with free and contracted plans
        - Marketing, web, and design teams
        - AI site builder inside existing site, CMS, and hosting workflow
        - More website-centric than full-stack app-centric
      - - Bubble
        - No-code app incumbent
        - Mature no-code platform with mobile/web packaging and higher team tiers
        - Business users and operators building scaled internal or customer apps
        - Visual editing with AI agent, any-model integration, mature app operations
        - List pricing is materially higher at team scale than Lovable or direct builders
      - - Glide
        - No-code internal-app incumbent
        - Business-app vendor with $199+ business packaging
        - Ops and business teams turning data into internal tools
        - Fast data-driven apps, no-code UI, AI transforms, enterprise add-ons
        - Less explicit code ownership and less suited to custom product engineering
      - - Figma Make
        - Adjacent design-led entrant
        - Part of Figma's broader design and collaboration platform
        - Design-led teams starting from libraries or prototypes
        - Prompts plus library context, editable prototypes, Supabase-backed web app generation
        - Still adjacent to shipping software rather than a full generalized app builder stack
      - - Internal build
        - Status quo substitute
        - Any team with AI-assisted developers and existing cloud or repo tooling
        - Engineering-led organizations with strong control requirements
        - Maximum flexibility, tool choice, and vendor optionality
        - Slowest path to value and highest integration burden
