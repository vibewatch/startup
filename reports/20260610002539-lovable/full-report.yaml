      - number: '3.2'
        title: Capabilities, pricing, GTM, and trust posture are converging fast
        blocks:
          - type: paragraph
            body: >-
              Lovable's public pricing and packaging show a deliberate move beyond hobbyists. Pro is listed at $25 per
              month shared across unlimited users, Business adds SSO and team controls at $50, and Enterprise adds SCIM,
              audit logs, and sales-led packaging. That puts Lovable close to Bolt on self-serve price, close to Replit
              on builder ambition, and clearly below the annual-contract economics of tools like Bubble Team or many
              enterprise platform plans. But pricing alone is not the full competitive story. Replit and Cursor market
              deeper agent autonomy, v0 pairs generation with Vercel deployment, GitHub Spark pairs it with a
              150-million-developer platform, and Webflow or Figma pair AI generation with existing design systems and
              website workflows.


              Trust posture is also no longer a unique wedge by itself. Lovable publicly markets SAML or OIDC, SCIM,
              approvals, and audit logs, but Replit, Cursor, Vercel, GitHub, Webflow, and Figma all advertise meaningful
              admin or enterprise-control surfaces. The more durable commercial question is therefore which workflow
              each vendor already owns. Lovable owns the fastest path from prompt to editable full-stack app for a mixed
              technical and non-technical team. GitHub and Cursor own developer environments. Webflow and Figma own
              design and site workflows. Bubble and Glide own no-code business application use cases. That convergence
              raises the bar for Lovable to win on workflow depth and distribution at the same time.
            claimRefs:
