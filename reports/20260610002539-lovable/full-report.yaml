      - number: '8.4'
        title: >-
          Scenario ranges and diligence gates: upside exists, but the next 1x of valuation needs better proof than the
          first
        blocks:
          - type: paragraph
            body: >-
              The scenario table should be read as a discipline tool rather than a prediction. A bull case above $12
              billion requires Lovable to translate product velocity into meaningfully higher-quality revenue:
              enterprise mix has to deepen well beyond the current public $20 million ARR reference, security and trust
              issues need to stay contained, and growth probably has to sustain into an $800 million to $1.0 billion
              revenue band. A base case closer to $5.5 billion to $8.5 billion is easier to support because it assumes
              real growth continues while multiples compress toward software norms as the market demands proof on
              quality, not just speed. The bear case around $2 billion to $4 billion is plausible if demand turns out to
              be more experimental than durable, if another trust incident hits conversion, or if the next financing
              tries to clear before enterprise economics are visible. The practical implication is simple: the
              highest-value diligence asks are not more project counts or more press milestones. They are cohort
              retention, gross margin, enterprise mix, cap-table terms, and evidence that secure deployment is becoming
              easier rather than riskier. Those are the facts that would move Lovable from research-more to buy, or from
              fair to expensive.
            claimRefs:
