          detail: Run-rate and project growth are unusually strong for a private software company.
          tone: positive
        - label: Distribution / relevance
          score: 8
          detail: Lovable still sits in a favored private AI coding category.
          tone: positive
        - label: Moat durability
          score: 6
          detail: Real product momentum, but workflow lock-in and enterprise depth remain less proven.
          tone: neutral
        - label: Economics clarity
          score: 3
          detail: Margin, retention, and cap-table terms remain largely absent from public evidence.
          tone: negative
        - label: Risk burden
          score: 4
          detail: Security and quality concerns can compress the multiple faster than topline can recover it.
          tone: warning
        - label: Evidence quality
          score: 4
          detail: Enough to track the company, not enough to issue a public-only buy.
          tone: warning
