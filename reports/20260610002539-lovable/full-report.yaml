companyProfile:
  summary: >-
    Lovable is a Stockholm-based Swedish AI app-builder whose roots trace back to the GPT Engineer precursor created by
    Anton Osika and Fabian Hedin. The current Lovable product launched in November 2024 and quickly expanded from
    prompt-based prototype generation into a broader prompt-to-deploy workflow with collaborative workspaces, GitHub
    sync, publishing, custom domains, and managed backend options through Lovable Cloud. Public growth disclosures are
    exceptional: the company moved from a $15 million early round to a $200 million Series A at a $1.8 billion valuation
    in July 2025 and a $330 million Series B at a $6.6 billion valuation in December 2025, while public topline
    references climbed from $17 million ARR in early 2025 to roughly a $500 million annualized revenue run rate by June
    2026. Lovable now shows both bottom-up and enterprise traction, but durable enterprise economics and governance
    remain much less transparent than product momentum.
  founders:
    - name: Anton Osika
      role: Co-founder & CEO
      background: Creator of the GPT Engineer precursor and Lovable's primary public product and fundraising spokesperson.
      claimRefs:
        - CO005
        - CO006
    - name: Fabian Hedin
      role: Co-founder & CTO
      background: Technical co-founder tied to GPT Engineer's commercialization and Lovable's product build-out.
      claimRefs:
        - CO005
        - CO007
  foundingLocation: Stockholm, Sweden
  headquarters: Stockholm, Sweden
  productSummary: >-
    Lovable sells a prompt-to-deploy app-building platform that turns natural-language instructions into editable
    full-stack web apps and websites. The product surface now spans collaborative workspaces, code editing, GitHub
    synchronization, managed backend services through Lovable Cloud, Supabase-based data and auth flows, publishing,
    custom domains, enterprise governance features, and MCP-driven extensions.
  customerFocus: >-
    Bottom-up builders such as founders, designers, operators, and business teams, plus growing enterprise buyers using
    Lovable for internal tools, prototypes, and selected production workflows.
  businessModel: >-
    Hybrid software monetization: shared-workspace subscriptions (for example Pro at $25/month and Business at $50),
    usage-based Lovable Cloud and AI Gateway credits, and custom-priced enterprise plans with governance, security, and
    procurement features.
  stage: Series B private company
  fundingStatus: >-
    Raised an early $15 million round, a $200 million Series A at a $1.8 billion valuation in July 2025, and a $330
    million Series B at a $6.6 billion valuation in December 2025; disclosed round announcements imply roughly $545
    million raised before any instrument reconciliation.
