      - number: '7.4'
        title: Business-model, customer, and execution risks
        blocks:
          - type: paragraph
            body: >-
              Business-model risk is less about whether demand exists and more about how durable and profitable that
              demand is under enterprise conditions. Lovable charges through subscription credits, cloud and AI usage,
              and top-ups, so both customer budgeting and gross-margin quality depend on third-party model, cloud, and
              billing costs that are not visible in public materials. Governance is also tiered: many of the strongest
              controls, including restricted projects, SSO, SCIM, scheduled scans, and rich auditability, sit above the
              lowest tiers, which can make the public growth story look broader than the enterprise-ready control
              surface. Customer-proof risk is similarly real. The public record shows several named success stories, but
              they are heavily concentrated in Lovable-owned marketing and blog materials rather than independent
              renewal, cohort, or concentration evidence. Support policy adds another execution wrinkle because official
              support is guaranteed only for paying-workspace email addresses and excludes project-specific debugging or
              third-party implementation help. That does not mean customer outcomes are weak; it means public evidence
              still leaves real uncertainty around concentration, referenceability, support load, and unit economics.
