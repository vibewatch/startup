  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing architecture
        blocks:
          - type: paragraph
            body: >-
              Lovable's public financial picture starts with a hybrid monetization stack, not a single SaaS seat price.
              The pricing page shows a low-friction Pro tier at $25 per month on the annual plan and a $50 Business
              tier, while Enterprise moves to a platform-fee model based on company size plus volume-priced credits. The
              terms add the more important underwriting detail: Lovable Cloud and the AI Gateway sit on separate credit
              balances that are billed on top of the platform subscription, with auto-reload, rollover rules, and
              monthly invoices that split subscription charges from variable usage. That means Lovable monetizes not
              only software access, but also infrastructure and model consumption. The legal stack reinforces this
              segmentation: DPA coverage, SSO, SCIM, audit logs, and approval controls sit on the Business and
              Enterprise side, suggesting the company is packaging compliance and governance into higher-value plans.
              What public sources do not reveal is realized economics. Lovable does not disclose enterprise ASP, seat
              minimums, discount ladders, cloud gross margin, or how much ARR comes from recurring subscriptions versus
              credit top-ups. Product Hunt review sentiment is directionally useful here: users praise speed and design
              quality, but recurring complaints about expensive credits imply that monetization is already testing
              willingness to pay at higher usage levels.
