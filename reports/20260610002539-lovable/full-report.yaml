      - number: '4.3'
        title: Capital access is obvious; capital adequacy is not
        blocks:
          - type: paragraph
            body: >-
              Lovable does not look capital constrained in the narrow fundraising sense. The company publicly disclosed
              a $15 million early round, a $200 million Series A at a $1.8 billion valuation, and a $330 million Series
              B at a $6.6 billion valuation. Forbes then reported that the company was discussing another round at $12
              billion by June 2026. SEC filings reinforce that real financing activity occurred throughout 2025, but
              they also complicate the simple headline story: the February, July, and December Form D filings show sold
              amounts of roughly $20.2 million, $192.7 million, and $425.0 million respectively, plus cancelled SAFE
              value embedded in total offering amounts. In other words, Lovable clearly raised a lot of capital, but
              public sources do not reconcile headline rounds to securities actually sold or to cash proceeds available
              on the balance sheet. The use-of-funds language is strategic rather than financial: management talks about
              deeper integrations, collaboration, governance, infrastructure, and even acquisitions. Yet the public file
              still lacks cash-on-hand, burn, runway, debt, or working-capital disclosure. That means investors can see
              equity-market appetite and strategic ambition, but not the liquidity cushion, financing trigger, or
