            body: >-
              Lovable's public customer proof is strongest when it moves beyond logos and describes an actual workflow.
              The clearest examples are Lovable's own case studies on Atonom, eXp Realty, and AppDirect. Atonom shows a
              concrete replace-SaaS motion: a Lovable-built CRM replaced Salesforce, reduced annual cost from roughly
              $40,000 to about $1,200, and became operational enough to trigger the company's AI SDR and weekly sales
              review process. eXp Realty shows broader enterprise-style sprawl: country websites, agent microsites,
              internal community tooling, and custom AI workflows spread across a large remote brokerage. AppDirect
              shows a middle path in which non-technical teams build production websites, CRM-like tools, and event
              operations apps while engineers review and productionize when needed. These are materially stronger proofs
              than a logo wall because they show what the buyer actually trusted Lovable to do.


              The next layer down is referenceability without full detail. TechCrunch names Klarna and HubSpot. Google
              Cloud names HCA Healthcare, HubSpot, Microsoft, Uber, and Zendesk. Product Hunt reviews add Konfide, Brand
              Stori, KidBoost, FamilyCash, and ZNS Connect as identifiable customer-built products. FeaturedCustomers
              packages Lovable's references into testimonials and case studies, which helps corroborate that a customer
              story exists. But these thinner proofs are not equal to the Atonom, eXp, or AppDirect cases. They tell
              investors that Lovable is getting used in real teams and real products, yet they rarely tell us whether
              the deployment is a pilot, an internal prototype, a production workflow, or a multiyear contracted
              account. The proof base is therefore credible, but highly uneven.
