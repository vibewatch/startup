      - number: '7.2'
        title: Legal, privacy, AI-governance, and IP risks
        blocks:
          - type: paragraph
            body: >-
              Legal and privacy exposure is structurally high because Lovable processes code, prompts, telemetry,
              credentials, and domain-registration data while routing work across multiple legal regimes and multiple
              providers. The privacy policy and DPA are helpful in that they explicitly separate free/pro versus
              enterprise treatment and spell out processor-versus-controller boundaries, but they also push material
              duties back to the customer: lawful basis, secure configuration, backups, and the decision not to upload
              HIPAA or other sensitive data. That means Lovable can be a software vendor and still leave
              deployment-level compliance risk with the buyer. AI-specific regulation compounds the issue. The EU AI Act
              and ICO guidance keep fairness, transparency, accountability, and fundamental-rights analysis squarely in
              play for AI systems, and Lovable’s own terms ban unreviewed use in medical, legal, financial, and
              safety-critical settings. IP and continuity risk are also non-trivial because Lovable reserves the right
              to reclaim lovable.app subdomains and usernames, while custom-domain users must handle their own
              reverse-proxy layer if they need it. Public materials retained for this run do not disclose a named
              regulator notice or litigation schedule, so investors should request that evidence directly instead of
              assuming silence equals clean posture.
            claimRefs:
