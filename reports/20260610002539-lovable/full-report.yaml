  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - scenario
      - assumptions
      - valuation / return logic
      - key risks
      - probability signal
    rows:
      - - Bull
        - >-
          Revenue scales toward $800M-$1.0B by 2027, enterprise mix rises materially from today's public $20M reference,
          and trust issues stay contained.
        - >-
          $12B-$18B outcome, or roughly 1.8x-2.7x the last closed $6.6B round before dilution, on a still-premium
          12x-18x multiple for higher-quality growth.
        - >-
          Enterprise adoption stalls, another trust incident hits conversion, or the next round prices in perfection too
          early.
        - >-
          Possible, but it needs better evidence on retention, mix, and secure deployment than the public file currently
          offers.
      - - Base
        - >-
          Growth continues beyond the current run-rate, but evidence quality improves only partially and investors
          demand some multiple compression.
        - >-
          $5.5B-$8.5B, or roughly flat to 1.3x versus the last close, on 9x-12x revenue with moderate operating
          improvement.
        - >-
          Public markets stay selective, self-serve revenue proves less durable than expected, or enterprise expansion
          remains modest.
        - Best aligned with current evidence because it respects real growth while penalizing missing quality metrics.
      - - Bear
        - >-
          Usage remains high but monetization quality disappoints, security concerns recur, and multiples converge
          toward public software ranges.
        - >-
          $2B-$4B, or roughly 40%-70% below the last close, on 4x-7x revenue applied to a slower-growth $350M-$500M
          base.
        - >-
          Experimental projects fail to stick, enterprise buyers hesitate, and new financing must clear below
          expectation.
        - >-
          Plausible because the downside does not require demand collapse—only weaker quality than the headline
          narrative implies.
    notes: >-
      Ranges are scenario-based valuation bands, not forecasts; they are meant to discipline underwriting under
      uncertainty rather than imply precision.
    claimRefs:
      - CV008
      - CV010
      - CV016
      - CV017
