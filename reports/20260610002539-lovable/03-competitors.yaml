- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - mitigation/diligence ask
  rows:
  - - Editable full-stack code plus GitHub sync creates sticky workflows
    - The same portability lowers switching costs and lets buyers multi-home or insource later
    - high
    - Ask for code-export frequency, GitHub sync attachment, and the share of retained customers still actively building in Lovable after export
  - - Lovable can move upmarket on governance
    - Replit, Cursor, Vercel, GitHub, Webflow, and Figma all market meaningful admin or security controls
    - high
    - Compare regulated-customer wins, SOC or certification artifacts, and procurement-close rates against direct peers
  - - Direct-builder price is an advantage
    - Bolt and Replit are close enough on public self-serve price that workflow depth and distribution likely decide deals
    - medium
    - Review win-loss reasons against Bolt, Replit, and v0 rather than relying on list-price comparisons
  - - Prompt-to-app speed is a durable wedge
    - Direct builders, GitHub Spark, Webflow AI, Bubble AI, and Figma Make all now advertise a similar idea-to-product narrative
    - high
    - Test whether Lovable materially outperforms peers on shipping speed, code quality, and post-generation editing
  - - Lovable can become the shared workspace for mixed technical and non-technical teams
    - GitHub, Vercel, Webflow, and Figma already own adjacent collaboration or deployment surfaces
    - high
    - Measure whether Lovable is landing greenfield teams or replacing tools buyers already use daily
  - - Internal build is too slow for most buyers to matter
    - Developer AI adoption and general-purpose agents make internal build increasingly viable for control-heavy teams
    - medium
    - Segment pipeline by control-sensitive buyers and inspect how often deals are lost to internal build versus a named vendor
  notes: The register focuses on underwriting-level threats to Lovable's differentiation and pricing power rather than every tactical feature gap.
  enumerationScope:
    coverage: exhaustive
    basis: 'This register covers each material moat-risk theme surfaced in the retained source set for Lovable: portability, governance parity, direct-builder price competition, workflow commoditization, bundle power, and internal build.'
