- id: TP003
  title: Pricing / packaging comparison
  columns:
  - vendor
  - public package
  - price/unit/contract model
  - included capabilities
  - discount or unknowns
  - implication
  rows:
  - - Lovable
    - Pro / Business / Enterprise
    - $25 per month shared across unlimited users; Business $50; Enterprise platform fee by company size
    - Credits, custom domains, collaboration, then SSO/SCIM/audit-log style governance as tiers expand
    - Realized enterprise pricing and credit consumption are not public
    - Lovable is priced to land self-serve and then move upmarket rather than to mimic seat-only developer tooling
  - - Bolt
    - Free / Pro / Teams / Enterprise
    - Free; Pro $25 per month; Teams $30 per member per month; Enterprise custom
    - Token-based usage, hosting, custom domains, database options, access controls
    - Enterprise rate card and realized usage economics are not public
    - Pricing is close enough to Lovable that workflow quality matters more than headline self-serve price
  - - Replit
    - Starter / Core / Pro / Enterprise
    - Starter free; Core $20 per month billed annually; Pro $95 per month billed annually; Enterprise custom
    - Monthly credits, published apps, collaborator limits, parallel agents, enterprise network/privacy controls
    - Pay-as-you-go usage and enterprise discounts complicate clean apples-to-apples comparisons
    - Replit can look cheap at entry and expensive at heavier usage
  - - v0 / Vercel
    - v0 + Vercel plans
    - v0 is paired publicly with Vercel pricing; Vercel Pro is $20 per month plus usage
    - GitHub sync, deploy pipeline, usage credit, enterprise infrastructure controls
    - v0-specific seat economics are less explicit than Vercel infrastructure pricing
    - v0 can undercut via bundled deployment economics and existing Vercel spend
  - - Cursor / GitHub
    - Cursor Individual / Teams; Copilot Free / Pro / Pro+ / Max
    - Cursor $20 per month and $40 per user per month on Teams; Copilot $0, $10, $39, or $100 per user per month
    - Agentic coding, frontier models, cloud agents, code review, GitHub-native distribution
    - Spark pricing is not yet separated clearly from broader GitHub surfaces
    - Developer-tool competition can look cheaper than Lovable on a pure seat basis
  - - Webflow
    - Starter / Basic / Premium / Team
    - Free Starter; Basic $15 per month yearly; Premium $25; Team annual contract
    - AI site builder, MCP server, cloud app hosting, CMS/site workflow
    - Platform-plan pricing is not directly comparable to full-stack builder credits
    - Webflow is strongest where the job is still mostly a site rather than a product app
  - - Bubble
    - Free / Starter / Growth / Team / Enterprise
    - Free; Starter $59 billed annually; Growth $209; Team $549; Enterprise custom
    - AI app builder, visual iteration, mobile/web apps, workload-based scaling
    - Higher team tiers make public price comparison unfavorable to Bubble for early-stage buyers
    - Bubble competes more on mature app operations than on low entry price
  - - Glide
    - Free / Business / Enterprise
    - Free; Business starts at $199 per month billed yearly; Enterprise custom
    - Data-driven app builder, included users, workflows, API access, enterprise add-ons
    - Usage and additional-user pricing push realized cost above the base headline
    - Glide is priced for business-software replacement, not for cheap experimentation
  - - Figma Make
    - Starter / Professional / Organization / Enterprise
    - Starter free with AI-credit cap; full seats $16, $55, and $90 per month by plan
    - Make plus broader Figma stack, AI credits, design libraries, admin controls
    - AI credits and seat mixes make total cost variable across teams
    - Figma can absorb prototyping jobs inside a design budget instead of forcing a separate builder purchase
  notes: Rows compare only public list pricing and packaging; private discounts, enterprise commitments, and actual consumption economics remain intentionally marked as unknown.
