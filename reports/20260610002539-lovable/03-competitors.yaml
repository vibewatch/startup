  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: lovable-enterprise-traction
    missingEvidence: Named enterprise customers, deployment counts, and win-rate or retention evidence for Lovable's team and enterprise motion.
    whyItMatters: Without traction disclosure, it is hard to tell whether Lovable's governance surface is converting into real enterprise adoption or is still mostly roadmap and packaging.
    diligencePath: Request sales pipeline conversion, active enterprise logos, renewal data, and win-loss notes versus Bolt, Replit, v0, GitHub, and Webflow.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-credits
    missingEvidence: Realized Lovable contract pricing, average monthly credit burn by team size, and comparable realized usage economics versus Bolt, Replit, and Figma.
    whyItMatters: Public list prices are not enough to judge gross-margin durability or whether Lovable actually wins on cost in production usage.
    diligencePath: Request anonymized enterprise price sheets, credit-consumption cohorts, gross-margin bridges, and top-up frequency by customer segment.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: switching-cost-behavior
    missingEvidence: Observed customer behavior on export, GitHub sync, migration off-platform, and degree of multi-homing after initial app creation.
    whyItMatters: Lovable's portability may help sales but could weaken retention if customers treat it as a starting point rather than a long-lived operating surface.
    diligencePath: Review telemetry on synced repositories, export frequency, post-export retention, and the share of projects that keep publishing through Lovable after code handoff.
    relatedQuestionRefs:
    - QP019
    relatedTableRefs:
    - TP004
