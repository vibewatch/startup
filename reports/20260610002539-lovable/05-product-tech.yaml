      - TE003
    figureRefs:
      - FE001
      - FE003

  - id: trust-security-privacy
    title: Trust, security, privacy, and reliability posture
    body: >-
      Lovable now foregrounds trust controls as a product feature set, not just a legal appendix. Public materials advertise
      SOC 2 Type II, ISO 27001:2022, SSO/SCIM, publish gating, secret handling, row-level-security review, dependency scanning,
      and optional partner tooling like Wiz. The security controls are meaningful because Lovable’s core workflow lets
      non-specialists create full-stack software quickly, which increases the need for default safeguards. However, the April
      2026 visibility incident is a real counterweight to the marketing posture. Lovable publicly disclosed that public-project
      chat history and source code were incorrectly reachable for a period, then responded by fixing the permission issue,
      changing defaults, and reworking its HackerOne process. That transparency is a positive signal, but it also proves the
      platform is still maturing its permission model and security operations in public. Privacy language is comparatively
      explicit about Supabase-hosted data, third-party AI provider pass-through via the AI Gateway, and workspace data-training
      controls, yet there is still no public uptime/SLA package that would let an enterprise buyer underwrite hosting
      reliability with the same confidence as the security/compliance claims.
    claimRefs:
      - CE015
      - CE016
      - CE017
      - CE018
      - CE019
      - CE020
      - CE021
      - CE022
      - CE023
      - CE024
      - CE040
      - CE041
    tableRefs:
      - TE004

  - id: velocity-roadmap-and-developer-signal
    title: Release velocity, roadmap clues, and developer signal
    body: >-
      Lovable’s 2026 release pattern shows a platform broadening quickly in multiple directions at once: mobile capture,
      desktop/MCP control, skills, subagents, SEO/AEO tooling, Wiz integration, and TanStack-based SSR all arrived within a
      short window. This cadence implies aggressive scope expansion from “AI builder” toward a broader app-creation platform.
      Developer-signal surfaces support that interpretation, but with nuance. Product Hunt reviews praise GitHub and Supabase
      integration, fast prototyping, and design output, while also calling out cost, bugs, and weaker behavior on larger or
      more complex projects. The November 2024 Show HN post framed Lovable as an engineering effort to systematically reduce
      LLM failure modes in full-stack development, which aligns with today’s product breadth. GitHub presence is mixed: the
      consumer-facing org has no public repos, while a separate Lovable Labs org exposes infrastructure/security-adjacent open
      source but not the core builder. Mobile traction looks meaningful by mid-2026 across iOS, Android, and Product Hunt, yet
      those signals say more about adoption and curiosity than they do about enterprise durability. The strongest read-through
      is that Lovable has achieved real developer/builder mindshare, but its ecosystem still looks curated and company-led,
      not community-extensible in the way a mature developer platform eventually becomes.
    claimRefs:
      - CE026
      - CE027
      - CE028
      - CE030
      - CE031
      - CE032
      - CE033
      - CE034
      - CE035
      - CE036
      - CE037
    tableRefs:
      - TE005
    figureRefs:
      - FE004

  - id: differentiation-and-open-gaps
    title: Differentiation, product maturity, and key diligence gaps
    body: >-
      Lovable’s clearest differentiation is that it combines surfaces that are often split across multiple vendors: prompt-driven
      app creation, collaborative editing, code access, GitHub export/sync, managed backend, publishing, custom domains,
      and increasingly security/governance controls. That integrated path is why users and reviewers repeatedly compare it
      favorably against UI-only builders or pure code copilots. The maturity profile is uneven, though. Greenfield MVP and
      workflow-heavy web apps appear to be the current sweet spot; commerce, MCP control, and mobile capture expand addressable
      use cases, but community feedback still flags cost, occasional bugs, and weaker handling of larger, more complex builds.
      Public information also leaves meaningful diligence gaps: no public SLA or uptime target, no deep public plugin/package
      ecosystem, limited public repository transparency around the core product, and incomplete public proof on disaster recovery
      commitments. Investors should therefore view Lovable as a high-velocity, increasingly enterprise-aware builder platform
      with compelling workflow integration, but one whose operational underwriting still depends on private diligence rather than
      public technical disclosure alone.
    claimRefs:
      - CE030
      - CE038
      - CE039
      - CE040
      - CE041
      - CE042

callouts:
  - calloutType: strength
    title: Lovable now owns far more of the app-building loop than most AI builders
    body: >-
      Lovable can now take a user from prompt to governed deployment across first-party surfaces that include planning,
      editable code, GitHub sync, managed Supabase-backed cloud, publish/custom domains, mobile capture, and MCP control.
      That breadth is the product’s most defensible strength because it reduces handoff friction between ideation,
      implementation, and operations.
    claimRefs:
      - CE006
      - CE008
      - CE009
      - CE025
      - CE038
      - CE042

  - calloutType: risk
    title: Operational trust still lags product velocity
    body: >-
      Lovable’s public security tooling is stronger than many peer builders, but the April 2026 visibility incident,
      the absence of public SLA/uptime commitments, and the relatively closed external ecosystem mean buyers still need
      private diligence on reliability, incident handling, and large-project maintainability before underwriting the
      platform for mission-critical workloads.
    claimRefs:
      - CE022
      - CE024
      - CE040
      - CE041

