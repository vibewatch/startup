  claims:
    - id: CE001
      statement: Lovable says users can describe apps in natural language and receive a working application that includes frontend, backend, database, authentication, and integrations backed by editable code.
      type: company-claimed
      topic: workflow
      sourceRefs: [SE001, SE002]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QE001, QE006]
    - id: CE002
      statement: Lovable positions the product as a shared-workspace workflow that spans exploration, prototyping, deployment, and ongoing operation rather than a single one-shot generator.
      type: company-claimed
      topic: workflow
      sourceRefs: [SE001, SE003]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QE001, QE002]
    - id: CE003
      statement: Lovable documents project/workspace roles and notes that editors and above can publish by default.
      type: company-claimed
      topic: collaboration
      sourceRefs: [SE003, SE009]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QE002, QE005]
    - id: CE004
      statement: Code Mode provides direct file browsing, search, manual edits, formatting, copy/download actions, and Markdown preview inside the product.
      type: company-claimed
      topic: code-mode
      sourceRefs: [SE005]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QE004]
    - id: CE005
      statement: Plan Mode is read-only, can inspect project context before any code is written, and saves the latest approved plan to .lovable/plan.md when execution begins.
      type: company-claimed
      topic: plan-mode
      sourceRefs: [SE006]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QE004]
    - id: CE006
      statement: Lovable’s GitHub integration uses a workspace connection plus a project repository link and synchronizes one active branch at a time in both directions.
      type: company-claimed
      topic: github-sync
      sourceRefs: [SE004]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QE003]
    - id: CE007
      statement: Lovable supports github.com on all plans and adds GitHub Enterprise Cloud data residency plus self-hosted GitHub Enterprise Server support on Enterprise.
      type: company-claimed
      topic: github-sync
      sourceRefs: [SE004, SE016]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QE003]
    - id: CE008
      statement: Lovable Cloud exposes managed database, auth, storage, edge functions, logs, analytics, backups, and secrets as first-party project surfaces.
      type: company-claimed
      topic: cloud-backend
      sourceRefs: [SE007]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QE007]
    - id: CE009
      statement: Lovable Cloud is built on a Supabase foundation rather than a wholly separate proprietary backend stack.
      type: company-claimed
      topic: supabase-foundation
      sourceRefs: [SE007, SE020]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QE007, QE008]
    - id: CE010
      statement: Lovable also lets customers connect and own their own Supabase project, which preserves direct dashboard and database access that Lovable-managed Cloud projects do not expose.
      type: company-claimed
      topic: supabase-foundation
      sourceRefs: [SE008, SE021]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QE008]
    - id: CE011
      statement: Lovable’s Supabase integration is documented as handling Postgres tables, auth flows, storage, realtime, and edge functions from prompts.
      type: company-claimed
      topic: supabase-integration
      sourceRefs: [SE008, SE020]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QE006, QE008]
    - id: CE012
      statement: New Lovable projects created from May 13, 2026 use TanStack Start with SSR by default while older apps continue on a React + Vite lineage with crawler prerendering.
      type: company-claimed
      topic: runtime-stack
      sourceRefs: [SE015, SE016]
      confidence: medium
      freshness: recent
      answersQuestionRefs: [QE009, QE019]
    - id: CE013
      statement: Lovable’s publish flow deploys snapshots, so future code changes are not live until the user republishes.
      type: company-claimed
      topic: deployment
      sourceRefs: [SE009]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QE010]
    - id: CE014
      statement: Custom domains can be bought or connected in Lovable, get SSL automatically, and can be routed through a customer-managed CDN or reverse proxy.
