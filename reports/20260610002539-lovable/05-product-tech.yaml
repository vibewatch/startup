        - Platform-level compliance and buyer reassurance
        - Detailed audit artifacts remain private diligence items
      - - Role-based access, SSO, and SCIM
        - Publicly documented
        - Workspace/user administration and enterprise identity
        - Depth of real-world enterprise rollout is not publicly quantified
      - - Publish gating and workspace privacy controls
        - Publicly documented
        - Controls who can publish and who can access projects/apps
        - Buyers still need to validate enforcement in their intended workflow
      - - Basic and deep security scans
        - Publicly documented
        - Pre-publish checks, dependency review, and code/access review
        - Scan efficacy is not publicly benchmarked against false positives/false negatives
      - - Secret handling and reserved variables
        - Publicly documented
        - Keeps backend credentials out of client bundles and standardizes cloud env vars
        - Customer misuse is still possible if teams ignore server/client boundaries
      - - Data training and privacy controls
        - Publicly documented
        - Workspace-level data opt-out plus policy language against training on customer prompts/code
