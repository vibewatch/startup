  - id: TE002
    title: Lovable workflow / use-case table
    columns:
      - User job
      - Current workflow without Lovable
      - Lovable solution
      - Measurable benefit
      - Limitation
    rows:
      - - Launch an MVP or internal tool quickly
        - Hire developers, wire infra manually, or stitch together separate design/code/backend tools
        - Prompt-driven build loop with backend/auth/integration scaffolding included
        - Same-day prototype or deployable web app is plausible based on official positioning and user reviews
        - Benefit is strongest on greenfield builds rather than existing complex systems
      - - Explore a feature safely before changing code
        - Whiteboard, docs, or separate architectural review meetings
        - Plan mode reasons across code/logs, then saves an approved plan before Build mode executes
        - Reduces accidental edits while clarifying architecture and scope
        - Every Plan mode message consumes credits and still depends on user framing
      - - Hand a project from non-technical builder to engineer
        - Rebuild prototype elsewhere or manually explain undocumented setup
        - Code Mode plus GitHub sync exposes files, branches, and clone URLs for local IDE workflows
        - Preserves code ownership and lowers rewrite risk
        - No public support for importing an existing repository back into Lovable
      - - Ship a branded public site or app
        - Separate hosting, DNS, and SSL configuration across multiple tools
        - Publish snapshot, connect custom domain, and issue SSL
        - Simplifies first production deploy and domain setup
        - Changes are not live until republished and public uptime terms are undisclosed
      - - Operate the project from outside the browser editor
        - Fall back to generic IDEs, scripts, or manual ops work
        - Mobile apps and the MCP server extend build and control surfaces beyond the web editor
        - Increases capture and control convenience across contexts
        - New surfaces raise support, governance, and consistency questions that are still early in market life
    notes: >-
      Benefits are based on product workflow documentation plus external user/developer surfaces; they indicate directionality,
      not audited time-to-value metrics.
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE013
      - CE025
      - CE034
      - CE038
      - CE041

  - id: TE003
    title: Lovable technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Key dependency
      - Publicly visible risk / gap
    rows:
      - - Builder interface (chat, Plan mode, Code mode)
        - Captures prompts, reasoning, edits, and direct code access
        - Lovable application layer and workspace permissions
        - No public benchmark on edit success rates or large-project context limits
      - - Collaboration and repository control
        - Manages roles, branch switching, repo links, and external code ownership
        - GitHub app and one active synced branch per project
        - Existing-repo import is unsupported; branch model may feel narrow for some enterprise flows
      - - App runtime for new projects
        - Runs generated full-stack apps with SSR/SSG/CSR per route
        - TanStack Start and Cloudflare Workers
        - Public docs explain the stack shift, but not customer-facing uptime/SLA commitments
      - - Legacy app runtime
        - Keeps older React + Vite projects operating while adding crawler prerendering
        - Existing SPA architecture plus request-time prerendering for crawlers
        - Mixed-stack estate could complicate long-run migration and support
      - - Managed backend
        - Provides database, auth, storage, functions, logs, analytics, and backups in Lovable
        - Supabase foundation under Lovable Cloud
        - Exact RTO/RPO and multi-region failover commitments are not public
      - - Connected external backend
        - Lets customers own the underlying Supabase project directly
        - Customer Supabase account and credentials
        - Operational boundary between Lovable automation and customer-managed infra requires careful diligence
      - - Security and governance layer
        - Runs publish-time scans, secret handling, publish gating, and workspace controls
        - Lovable scanners plus optional Wiz integration
        - Public evidence is feature-rich but still post-incident and not backed by a public audit packet
      - - Commerce / external tool layer
        - Extends app functionality into e-commerce and external AI-client surfaces
        - Shopify and MCP server
        - Connector breadth is growing faster than public implementation depth or case-study coverage
    notes: >-
      Table reflects only architecture elements explicitly described in official docs/blogs and named partner sources; unknown
      lower-level implementation details remain open diligence items rather than assumptions.
    claimRefs:
