  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: audit-artifacts
      missingEvidence: Publicly reviewable SOC 2 report excerpts, pentest summaries, or audit-ready trust artifacts beyond marketing-level summaries.
      whyItMatters: Security claims are directionally strong but still require private diligence to verify operating effectiveness.
      diligencePath: Obtain trust-center artifacts under NDA, recent penetration-test reports, and evidence of closed critical findings.
      relatedQuestionRefs: [QE028]
    - type: missing-source
      severity: material
      topic: ecosystem-gap
      missingEvidence: Public metrics for template/plugin/package ecosystem depth, extension adoption, and community-developed integrations beyond company-led surfaces.
      whyItMatters: Ecosystem depth affects lock-in, extensibility, and durability of developer mindshare.
      diligencePath: Request internal ecosystem metrics, public API roadmap, and data on third-party integration/template creation outside Lovable-managed channels.
      relatedQuestionRefs: [QE029]
    - type: private-evidence-only
      severity: minor
      topic: large-project-performance
      missingEvidence: Public benchmark data on success rates, latency, or maintainability for large/legacy codebases versus greenfield MVP workflows.
      whyItMatters: Reviews suggest Lovable excels on greenfield work but can lose context on more complex builds.
      diligencePath: Ask for enterprise case studies, benchmark methodology, and retention/usage by project size or codebase complexity.
      relatedQuestionRefs: [QE004, QE026]
