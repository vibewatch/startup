chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Lovable delivers a full prompt-to-deploy web-app workflow that now spans natural-language generation,
    collaborative workspaces, editable code, GitHub sync, managed backend options, publishing, custom domains,
    mobile capture, and MCP-based external control. The product surface is unusually broad for an AI app builder,
    but the same speed advantage creates diligence questions around public reliability commitments, ecosystem depth,
    and whether post-incident security/process hardening has fully caught up with the platform’s rapid feature velocity.
sections:
  - id: product-workflow
    title: Product definition and builder workflow
    body: >-
      Lovable’s product is best understood as a workflow engine for turning prompts into production web applications,
      not as a single code-generation widget. Official docs describe a user journey that starts with plain-language
      instructions, then moves through shared workspaces, iterative chat, optional Plan mode reasoning, direct code
      inspection in Code mode, GitHub sync for ownership and branch-based collaboration, and finally publish/custom-domain
      distribution. This framing matters because Lovable is selling both speed and control: non-technical builders can stay
      in chat, while technical teams can inspect files, clone repos locally, and keep a synchronized copy outside the
      platform. Collaboration is built around project/workspace roles rather than ad hoc share links alone, which pushes
      Lovable beyond a solo prototyping tool toward a multi-user operating environment for building and shipping software.
      The core product promise is therefore not merely “AI writes code,” but “AI compresses the path from idea to
      governed, deployable web app while leaving code ownership available to the customer.”
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE037
      - CE038
    tableRefs:
      - TE001
      - TE002
    figureRefs:
      - FE002

  - id: architecture-and-deployment
    title: Product architecture, backend model, and deployment stack
    body: >-
      The most supportable architecture story is a layered one. Lovable provides a front-end build surface, a repository
      and collaboration layer, and then either a Lovable-managed backend or a customer-managed Supabase backend. Public docs
      and partner materials consistently point to Supabase as the data/auth/storage foundation under Lovable Cloud, while
      also distinguishing projects connected to a user-owned Supabase instance. In 2026 Lovable migrated new projects from a
      React + Vite SPA baseline to TanStack Start with server-side rendering on Cloudflare Workers, which improves first-request
      HTML delivery, SEO, and colocated server-function patterns. Publishing remains snapshot-based rather than continuously
      live-syncing, which keeps release control explicit but also means operational hygiene depends on the user remembering to
      republish. Custom-domain management, SSL issuance, CDN/proxy compatibility, and MCP-based external control extend the
      product from generation into deployment and operations. The supported picture is therefore a pragmatic stack with clear
      first-party abstractions, but not a fully transparent one: Lovable documents capabilities well, yet still leaves some
      lower-level runtime, SLA, and failover details outside the public record.
    claimRefs:
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
      - CE013
      - CE014
      - CE025
      - CE029
      - CE042
