              forecasts into concrete, addressable workflow categories. Industry analysts project the overall market for
              generative artificial intelligence developer tooling, infrastructure, and governance to expand into a
              multi-billion-dollar category by 2026. Within that aggregate total, the serviceable addressable market for
              automated AI safety, compliance, and red-teaming represents an estimated $1.5 billion to $3.0 billion
              annual software opportunity. The core economic disruption introduced by Goodfire lies in its unit
              economics: internal activation monitors running on open models such as Kimi K3 cost roughly $185 per
