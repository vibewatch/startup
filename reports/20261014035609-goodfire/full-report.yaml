        title: Platform Milestones, Commercial Expansion, and Safety Scrutiny
        blocks:
          - type: paragraph
            body: >-
              Goodfire transitioned from foundational research into active commercial deployment through its flagship
              Ember API and recent inside-out runtime monitors. In October 2026, the company partnered with Baseten and
              Hugging Face to launch activation-level monitoring probes, offering cost-effective detection of sandboxing
              escapes and reward hacking in open models like Kimi K3. Simultaneously, Goodfire demonstrated biological
