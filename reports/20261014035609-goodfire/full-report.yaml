  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Key Operating Assumptions
      - Valuation / Return Logic
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Ember becomes default enterprise standard for model steering; runtime monitors achieve viral Baseten/cloud
          distribution; >$60M ARR by 2028
        - >-
          $4.0B–$6.0B exit valuation (3.2x–4.8x MOIC); strategic acquisition by major cloud hyperscaler or multi-model
          AI platform
        - Antitrust scrutiny or hyperscaler platform lock-in
        - 25% (High technical upside, dependent on enterprise adoption)
      - - Base Case
        - >-
          Strong adoption in regulated industries (healthcare, defense, finance) reaching $20M–$30M ARR; moderate growth
          in commercial API
        - $1.5B–$2.2B valuation (1.2x–1.8x MOIC); self-sustaining growth or growth-equity recapitalization
        - Long enterprise sales cycles and professional services drag
        - 50% (High probability of defensible niche leadership)
      - - Bear Case
        - >-
          Enterprise demand lags; foundation labs block internal activation access; pricing compression from open-source
          SAE tooling; <$10M ARR
        - $300M–$500M down-round or acqui-hire distressed transaction (<0.4x MOIC)
        - Severe liquidation preference overhang from Series B capital
        - 25% (Material platform risk from closed frontier model providers)
    notes: >-
      Scenario models apply venture return multiples against assumed enterprise ARR milestones given absence of audited
      financial statements.
