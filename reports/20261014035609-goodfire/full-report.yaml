      - number: '6.3'
        title: Named Enterprise Deployments & Partnership Proof
        blocks:
          - type: paragraph
            body: >-
              Goodfire's enterprise credibility rests on high-profile technical collaborations with marquee institutions
              across software and healthcare. The company maintains documented relationships with Microsoft, Mayo
              Clinic, and Arc Institute, deploying custom interpretability pipelines into mission-critical workflows. In
              digital biology, Arc Institute leveraged Goodfire's feature extraction technology on the Evo DNA
              foundation model, successfully mapping fundamental biological concepts such as RNA and tRNA structures
              directly to neural activation clusters. In clinical medicine, Goodfire collaborated with Mayo Clinic and
              biotechnology partner Prima Mente to examine an epigenetic foundation model, isolating a novel class of
              biomarkers for Alzheimer's disease detection through representation reverse-engineering. Furthermore,
              Baseten's inference hosting marketplace provides production proof for Goodfire's activation probe
              architecture, demonstrating that enterprise inference workloads can run continuous automated guardrails
              without prohibitive secondary model compute expenses.
            claimRefs:
              - CU006
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU003
