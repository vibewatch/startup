      - number: '5.3'
        title: Model Steering, Intervention & Domain-Specific Discovery
        blocks:
          - type: paragraph
            body: >-
              Beyond passive safety observation, Goodfire leverages mechanistic interpretability for active model
              intervention and scientific knowledge extraction. In model alignment, Goodfire applies
              interpretability-informed reinforcement learning to identify internal subunits responsible for
              hallucinated outputs, demonstrating a 50% reduction in foundation model hallucinations by penalizing
              ungrounded activation patterns during post-training. In developer workflows, Ember provides autosteering
              capabilities, allowing users to alter prompt behaviors by dynamically amplifying or suppressing targeted
              internal feature vectors such as refusal or tone representations without full weight fine-tuning. In
              scientific domains, Goodfire collaborates with research institutions including Arc Institute, Mayo Clinic,
              and Prima Mente to reverse-engineer biological and clinical foundation models. Peering into an epigenetic
              foundation model developed by Prima Mente, Goodfire isolated novel internal representations corresponding
              to Alzheimer's biomarkers, establishing a workflow for extracting domain hypotheses directly from trained
              biological neural networks.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Technical Dependencies, Scalability Limitations & Verification Gaps
        blocks:
          - type: paragraph
            body: >-
              While Goodfire's internal activation probing delivers compelling theoretical and cost advantages, its
              commercial architecture faces critical technical dependencies and deployment boundaries. Primary among
              these is the strict requirement for white-box access to raw neural activations and forward-pass tensor
              calculations. This structural constraint renders Goodfire's monitors incompatible with closed frontier
              model APIs (such as OpenAI or Anthropic commercial endpoints), restricting deployment exclusively to
              open-weight models or specialized infrastructure providers like Baseten. Furthermore, in benchmark testing
              on Kimi K3, Goodfire's probes exhibited a 5.5% false-positive rate on benign exchanges, introducing
              potential user friction or secondary human-review bottlenecks under enterprise workloads. Scalability also
              presents an ongoing research hurdle: training Sparse Autoencoders requires substantial compute clusters,
              and feature dictionaries trained on dense models do not necessarily transfer smoothly to sparse
              mixture-of-experts architectures without continuous retraining.
            claimRefs:
              - CE006
              - CE008
              - CE010
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE007
              - CE010
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Computational Efficiency of Activation-Level Probing
            body: >-
              By hooking directly into intermediate forward-pass tensor calculations rather than running secondary LLM
              judge passes, Goodfire achieves a 96% reduction in per-token monitoring costs ($185 vs $5,420 per million
              interactions) while adding under 2% to initial response latency.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
              - CE007
          - type: callout
            title: SAE Architectural Scalability and Hosting Dependencies
            body: >-
              Goodfire's 'inside-out' monitoring relies on deep white-box access to model weights and forward-pass
              activations, creating strong deployment dependencies on open-weight models and specialized inference hosts
              like Baseten while leaving closed proprietary APIs unaddressable.
            calloutType: risk
            claimRefs:
              - CE008
              - CE010
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation & Buyer Demand Drivers
        blocks:
          - type: paragraph
            body: >-
              Goodfire's addressable customer landscape divides into four operating segments: frontier model developers,
              digital biology and healthcare institutions, enterprise software builders, and academic safety labs.
              Frontier labs and major platform vendors purchase mechanistic interpretability capabilities to evaluate
              model reliability, inspect neural representations, and eliminate unwanted behavioral failures during
              post-training. In healthcare and digital biology, institutional partners like Mayo Clinic and Arc
              Institute utilize Goodfire's tools as biological microscopes, reverse-engineering epigenetic and genomic
              models to extract clinically validated biomarkers and decipher latent representations of transfer RNA.
              Enterprise application developers are motivated by emerging AI explainability mandates, seeking internal
              activation inspection to audit agent behavior and defend against prompt injections or rogue execution
              before deployment. Meanwhile, academic researchers and safety institutes access the technology through
              subsidized grant programs and open-source sparse autoencoder releases, establishing Goodfire as an
              intellectual standard across the broader research community.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption Trajectory & Product-Led Surfaces
        blocks:
          - type: paragraph
            body: >-
              Historically, Goodfire accessed enterprise demand through forward-deployed research engagements that
              reached seven figures in contract value, mirroring an elite research consultancy rather than a scalable
              software business. In August 2026, the company initiated a commercial pivot toward product-led growth by
              launching Silico, an autonomous ML research platform priced at $1,000 per seat per month with a 50%
              discount for the initial two months. Silico provides an orchestrated multi-agent harness where automated
              agents execute 5 to 10 parallel interpretability experiments weekly, utilizing weekly refreshed token and
              GPU credit pools across Anthropic and OpenAI models. Complementing Silico, Goodfire partnered with
              Baseten's Base Labs and Hugging Face in October 2026 to distribute inside-out activation monitors directly
              to hosted inference customers. Operating at approximately $185 per million exchanges—a 96% cost reduction
              compared to secondary LLM judges—these lightweight monitors catch 93% of malicious hacking attempts with
              under 2% latency overhead, creating an embedded utility channel that monetizes open-weight model
              deployments at inference time.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
