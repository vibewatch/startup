        blocks:
          - type: paragraph
            body: >-
              Goodfire's capitalization trajectory accelerated rapidly within twenty months of inception, advancing from
              an initial seven million dollar Seed round in August 2024 to a fifty million dollar Series A in April
              2025. In February 2026, Goodfire closed a one hundred fifty million dollar Series B financing round led by
              B Capital at a post-money valuation of one point two five billion dollars, bringing cumulative equity
              capital raised to between two hundred seven and two hundred nine million dollars. The cap table features
