              - CR008
      - number: '7.3'
        title: Partner and Infrastructure Dependencies
        blocks:
          - type: paragraph
            body: >-
              Goodfire's go-to-market strategy relies heavily on key infrastructure and ecosystem partnerships to
              achieve enterprise scale. Rather than building a standalone inference cloud, Goodfire partners with
              specialized model hosting platforms such as Baseten to distribute its activation monitors directly into
              customer model serving pipelines. While this architecture dramatically reduces customer integration
              friction and capital expenditure, it introduces critical counterparty dependencies on Baseten's platform
              reliability, security posture, and commercial viability. Furthermore, liability in the AI ecosystem
              increasingly concentrates at the inference provider level, where clusters of compute can be utilized to
              run unaligned models at scale. Goodfire's unit economics are highly compelling—monitoring one million
              exchanges costs approximately $185 compared to over $5,400 for secondary observer models—yet sustained
              commercial success requires expanding partnerships beyond Baseten across major hyperscaler marketplaces
              and enterprise AI platforms.
            claimRefs:
              - CR005
              - CR006
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
      - number: '7.4'
        title: Financial Model, Governance, and Downside Triggers
        blocks:
          - type: paragraph
            body: >-
              Following its $150 million Series B round in February 2026 at a $1.25 billion valuation, Goodfire
              possesses an exceptional balance sheet cushion to fund compute-intensive mechanistic interpretability
              research. However, this premium valuation sets an aggressive growth hurdle, requiring Goodfire to rapidly
              transition from collaborative design partnerships into scalable recurring software revenue. The company
              maintains an internationally distributed technical workforce spanning five countries, which demands
              rigorous IP assignment protocols, export control compliance, and cross-border engineering management.
              Simultaneously, the availability of pre-IPO secondary liquidity through platforms like EquityZen
              highlights early employee liquidity dynamics that management must monitor. Key thesis-break triggers for
              investors include any failure of activation probes to generalize to next-generation frontier reasoning
              architectures, escalation of enterprise false-positive rejection rates, or native absorption of
              interpretability tooling by foundational model creators.
            claimRefs:
              - CR012
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Inference-Time Guardrail Evasion and Open Model Vulnerability
            body: >-
              The rapid enterprise adoption of open-weights models creates severe downside exposure for hosting
              environments when autonomous agents escape test sandboxes or engage in reward hacking. Goodfire's internal
              activation monitors provide an essential cost-effective alternative to expensive secondary observer
              models, but residual risk remains high until probe generalization is proven across multi-turn reasoning
              workflows.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR009
              - CR011
          - type: callout
            title: Public Benefit Charter as Talent Moat and Governance Shield
            body: >-
              Goodfire's incorporation as a Delaware Public Benefit Corporation provides a critical competitive
              advantage in recruiting senior interpretability researchers from frontier labs like OpenAI and Google
              DeepMind who prioritize AI safety. However, this charter also imposes fiduciary duties to balance public
              benefit against pure commercial profit maximization, necessitating transparent board governance during
              future liquidity milestones.
            calloutType: insight
            claimRefs:
              - CR001
              - CR002
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Goodfire has established an exceptional technical foundation in mechanistic interpretability, assembling a
              premier research cadre from OpenAI and Google DeepMind to address the fundamental opacity of modern neural
              networks. The core investment thesis centers on Goodfire's ability to transform mechanistic
              interpretability from an academic discipline into an enterprise model design environment. By decoding
              neural representations into steerable features via sparse autoencoders, Goodfire enables AI practitioners
              to directly intervene on model internals rather than relying on blunt retraining or prompt engineering.
              This capability is evidenced by empirical milestones, including cutting large language model
              hallucinations by nearly half and discovering novel Alzheimer's biomarkers in partnership with the Arc
              Institute and Mayo Clinic. Furthermore, Goodfire's launch of runtime activation monitors on Baseten
              demonstrates an ability to deliver inside-out agent safety at a fraction of the computational overhead
              required by supervisory language models. Conversely, the anti-thesis highlights critical commercial
              uncertainties: the lack of disclosed recurring revenue, long enterprise sales cycles for deep
              interpretability tooling, and the imminent risk that frontier foundation model labs internalize
              activation-monitoring primitives into their proprietary architectures.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV009
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV006
              - CV009
              - CV011
              - CV012
      - number: '8.2'
        title: Financing History and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Goodfire's capital trajectory reflects aggressive venture backing across three financing rounds totaling
              over $200 million in equity capital. The company closed a $7 million Seed round in August 2024 led by
              Lightspeed Venture Partners, followed rapidly by a $50 million Series A in April 2025 led by Menlo
              Ventures with participation from Anthropic and B Capital. In February 2026, Goodfire secured a $150
              million Series B at a $1.25 billion post-money valuation, led by B Capital with participation from DFJ
              Growth, Salesforce Ventures, and Eric Schmidt. Independent financial analysts estimate that these rounds
              resulted in cumulative investor dilution of approximately 25% in the Series A and 12% in the Series B.
              Despite this strong pedigree, Goodfire has maintained complete opacity regarding its commercial financial
              performance. Neither enterprise annual recurring revenue, gross margins, customer retention, nor
              valuation-to-revenue multiples have been publicly disclosed. Private share trading interest on secondary
              platforms such as EquityZen underscores early employee demand for liquidity, while the lack of transparent
              financial benchmarks creates significant pricing risk for prospective growth investors entering at the
              unicorn valuation threshold.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: Scenario Analysis and Valuation Outcomes
        blocks:
          - type: paragraph
            body: >-
              Evaluating Goodfire's investment attractiveness requires modeling three distinct operational scenarios
              against the $1.25 billion entry mark. Under the Bull Case (assigned a 25% probability), Goodfire
              establishes Ember as the definitive enterprise standard for foundation model steering, achieves broad
              distribution through cloud inference providers, and scales annual recurring revenue beyond $60 million by
              2028. This path yields an enterprise valuation of $4.0 billion to $6.0 billion, delivering an attractive
              3.2x to 4.8x venture return. In the Base Case (assigned a 50% probability), Goodfire achieves steady
              adoption within highly regulated verticals such as biopharma, defense, and healthcare where model
              explainability is legally mandated. Here, recurring revenue expands to $20 million to $30 million,
              supporting a $1.5 billion to $2.2 billion valuation and a modest 1.2x to 1.8x return multiple. Under the
              Bear Case (assigned a 25% probability), commercial adoption stalls due to integration complexity, while
              open-source sparse autoencoders and native hyperscaler monitors commoditize the toolset. Stagnating
              revenue below $10 million would trigger down-round compression to $300 million to $500 million, exposing
              common shareholders to substantial liquidation preference overhang from the $150 million Series B round.
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV013
              - CV014
      - number: '8.4'
        title: Recommendation Framework and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Synthesizing Goodfire's technical leadership against its valuation multiples results in a 'research-more'
              recommendation with a medium confidence rating and high investment risk posture. While Goodfire's
              scientific defensibility and elite team warrant close tracking, underwriting equity at a $1.25 billion
              post-money valuation without audited enterprise ARR or customer cohort data would violate core investment
              discipline. The valuation stance is classified as stretched, reflecting premium pricing predicated
              entirely on future category dominance rather than verified recurring software economics. Prior to capital
              commitment, institutional investors must complete three mandatory diligence inquiries: first, obtaining
              non-disclosure access to audited historical revenue, contracted annual recurring revenue, and net revenue
              retention; second, auditing customer concentration across key design partners such as Microsoft, Arc
              Institute, and Mayo Clinic; and third, reviewing the Series B preferred share rights, seniority ranking,
              and governance protections. Any deterioration in native model provider cooperation or evidence of slowing
              commercial adoption would represent a definitive thesis-break trigger.
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV008
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Core Investment Posture
            body: >-
              Goodfire represents one of the premier scientific teams in neural network interpretability, yet the lack
              of audited financial disclosures and verified recurring revenue mandates a disciplined 'research-more'
              recommendation rather than an immediate buy at the $1.25 billion valuation mark.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV013
