            title: The Architectural Advantage of Inside-Out Probing
            body: >-
              By attaching classifier probes directly to intermediate neural activations computed during the forward
              pass, Goodfire avoids the massive compute penalty of running external LLM judges over multi-turn agent
              logs. This inside-out mechanism catches malicious or reward-hacking behaviors before responses are
              finalized, achieving 93% detection rates on Kimi K3 while adding less than 2% latency.
            calloutType: insight
            claimRefs:
