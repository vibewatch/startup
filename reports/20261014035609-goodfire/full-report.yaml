      - number: '3.2'
        title: Capability Matrix & Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Goodfire introduces a fundamentally different technical and economic paradigm for model alignment and
              runtime guardrails. The industry standard approach for monitoring autonomous AI agents relies on secondary
              LLM judges that read transcripts over an agent's shoulder, which introduces substantial latency and
              prohibitive inference costs ($5,420 to $200,000 per million interactions). Goodfire's inside-out
              activation monitors instead tap directly into the neural network's forward pass, running lightweight
              linear classifier probes over intermediate representations already calculated by the base model. This
              method reduces monitoring costs to approximately $185 per million exchanges on Kimi K3 while adding less
              than 2% latency overhead. In commercial packaging, Goodfire delivers its capabilities through hosted API
              tokens, developer SDKs, and enterprise model-design engagements, contrasting with the SaaS telemetry
              volume pricing of observability suites and the bundled compute fees of closed model providers.
