chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Mission, and Public Benefit Corporation Governance
        blocks:
          - type: paragraph
            body: >-
              Goodfire AI, Inc. is an AI interpretability research company and commercial model-design laboratory
              founded in June 2024 and organized as a Delaware Public Benefit Corporation. Headquartered at 1265 Battery
              Street in San Francisco, California, the company operates with the stated charter of transforming opaque
              foundation models into understandable, steerable, and auditable systems. Rather than treating large neural
              networks as black-box probabilistic engines, Goodfire develops mechanistic interpretability tools that
              inspect and intervene on intermediate neural activations. The company's dual mandate balances frontier
              academic research in sparse autoencoders with commercial infrastructure development. Its corporate
              governance as a public benefit corporation legally aligns its fiduciary duties with safety and
              transparency objectives, positioning the company at the intersection of AI safety research and enterprise
              developer tooling across text, multimodal, and biological foundation models.
            claimRefs:
              - CO013
              - CO006
