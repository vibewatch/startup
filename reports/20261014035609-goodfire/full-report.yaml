  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Interpretability Architecture & Core Platform Stack
        blocks:
          - type: paragraph
            body: >-
              Goodfire's technical mission centers on transforming black-box neural networks into understandable and
              steerable software systems. Rather than relying solely on external prompt evaluations, Goodfire builds
              software that extracts and decodes intermediate representations inside foundation models. Its core
              platform, Ember, decodes neural activations to grant developers direct, programmable access to model
              features. To resolve the foundational challenge of neural superposition—where multiple conceptual features
              share overlapping neurons—Goodfire develops and distributes open-source Sparse Autoencoders (SAEs)
              optimized for architectures including Llama and DeepSeek R1. These dictionaries isolate polysemantic
              neuron firings into distinct, human-interpretable feature vectors. On top of this feature layer, Goodfire
              operates its Model Design Environment and Silico research interface, providing commercial and academic
              partners with tools to inspect representations, conduct checkpoint-by-checkpoint diffing, and
              programmatically alter model behaviors.
            claimRefs:
