      partner deployments.
    claimRefs:
      - CM010
      - CM011
      - CM012
      - CM013
  - id: FP001
    title: 'Competitive Positioning: Mechanistic Access vs. Platform Neutrality'
    type: quadrant
    summary: >-
      Goodfire combines deep mechanistic activation access with cross-model platform neutrality, distinguishing it from
      black-box observability tools and proprietary frontier lab research.
    data:
      points:
        - label: Goodfire (Ember / Silico)
          x: 4.5
          'y': 4.2
          description: Hosted mechanistic interpretability and activation probes deployed across open-weight foundation models.
        - label: Arize AI & Arthur AI
          x: 1.2
          'y': 4.5
          description: >-
            Vendor-neutral application observability tracking external inputs and outputs rather than internal neuron
            activations.
        - label: Scale AI
          x: 1
          'y': 3.8
          description: Enterprise data engine and external behavioral evaluation without internal model steering capabilities.
        - label: Google DeepMind
          x: 4.6
          'y': 1.4
          description: >-
            Pioneering internal mechanistic interpretability research deployed strictly within proprietary Gemini
            systems.
        - label: Anthropic
          x: 4.4
          'y': 1.8
          description: World leader in safety and SAE circuits research, focused on proprietary Claude alignment.
        - label: Internal Build / Open Source
          x: 2.8
          'y': 2.5
          description: Custom PyTorch scripts and research notebooks lacking enterprise infrastructure and production hosting.
    approximationNotes: >-
      Axes represent ordinal qualitative scoring: X-axis denotes depth of internal activation and mechanistic model
      access (1=black-box output only to 5=direct neuron steering); Y-axis denotes cross-model neutrality and
      multi-vendor platform independence (1=single proprietary ecosystem to 5=fully cross-model portable).
    claimRefs:
      - CP001
      - CP003
      - CP010
      - CP014
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      How customer model deployment and research activity convert through platform probes and software subscriptions
      into recurring revenue and gross margins.
