      - number: '3.3'
        title: Moat Durability, Switching Dynamics & Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              Goodfire's primary strategic moat stems from its concentrated technical talent and proprietary sparse
              autoencoder training pipelines, led by former Google DeepMind and OpenAI interpretability pioneers.
              However, the durability of this moat faces structural headwinds from both platform incumbents and frontier
              foundation labs. Major labs such as Google DeepMind and Anthropic possess deep internal mechanistic
              interpretability capabilities, though their commercial incentives presently prioritize optimizing their
              own proprietary architectures (Gemini and Claude) rather than providing vendor-neutral tooling across
              competing models. While Anthropic's direct investment validates Goodfire's technical leadership,
              enterprise switching costs remain moderate because models are accessed via standard API gateways and open
              weights. If frontier labs integrate native activation-level steerability directly into hosted endpoints,
              or if open-source interpretability libraries standardize, Goodfire could experience pricing compression in
              basic feature extraction, requiring it to defend defensibility through vertical scientific discoveries and
              complex agent monitoring workflows.
            claimRefs:
              - CP009
              - CP010
              - CP012
              - CP014
