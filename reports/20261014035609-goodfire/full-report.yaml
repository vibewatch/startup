        title: Executive Leadership, Founding Team, and Key-Person Dependencies
        blocks:
          - type: paragraph
            body: >-
              Goodfire was established by co-founders Eric Ho, Dan Balsam, and Tom McGrath, pairing prior
              entrepreneurial scaling experience with foundational research credentials. Chief Executive Officer Eric Ho
              and Chief Technology Officer Dan Balsam previously co-founded recruitment platform RippleMatch in 2016,
              scaling that business to over ten million dollars in annual recurring revenue. Chief Scientist Tom McGrath
              co-founded and led the mechanistic interpretability research team at Google DeepMind before departing to
              co-found Goodfire. The company has concentrated scientific talent from OpenAI, DeepMind, Stanford,
              Harvard, and UC San Diego, including founding researcher Nick Cammarata. While this research-heavy
              concentration provides an exceptional technical pedigree, the organization carries pronounced key-person
              dependency on its founding triumvirate for both research direction and commercial enterprise execution
              across early platform partnerships.
