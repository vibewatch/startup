  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundaries, Included Spend, and Product Scope
        blocks:
          - type: paragraph
            body: >-
              The market for AI interpretability software occupies a distinct tier between general-purpose machine
              learning developer tooling and post-hoc model evaluation frameworks. Unlike conventional black-box
              governance suites that evaluate models exclusively through input prompts and generated output text,
              Goodfire operates within the internal mechanistic layer of neural networks. The company's product
              boundaries encompass internal activation probes, the Ember model-design platform, and the Silico automated
              interpretability research agent. Included spend within this category captures software budgets allocated
              to model steering, representation debugging, reward-hacking prevention, and biological foundation model
              analysis. Conversely, excluded spend covers external prompt-filtering firewalls, generic cloud compute
              infrastructure, basic data annotation pipelines, and traditional application monitoring. By focusing
              strictly on white-box model internals, Goodfire targets specialized engineering and safety budgets that
              conventional observability vendors cannot address.
            claimRefs:
