  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape & Categorization
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape surrounding Goodfire spans five distinct operational tiers: frontier model labs,
              production ML observability platforms, external evaluation and data labeling providers, MLOps
              experiment-tracking suites, and internal research toolchains. Traditional ML monitoring vendors such as
              Arize AI, Arthur AI, and Fiddler treat machine learning models as black boxes, analyzing input prompts and
              output responses to flag drift, hallucinations, and policy violations. In contrast, Goodfire
              differentiates by decomposing internal neural network representations into human-interpretable features
              using sparse autoencoders, allowing engineers to visualize and steer model internals without retraining.
              Meanwhile, data and evaluation leaders like Scale AI operate at the behavioral validation layer through
              external benchmarks, lacking access to model activation streams. Goodfire deliberately avoids training
              frontier foundation models, positioning its Ember platform and Silico design environment as a horizontal,
              cross-model interpretability layer that sits atop open-weight ecosystems including Meta Llama and DeepSeek
              R1.
