figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Chronological development of Goodfire from founding in 2024 through Series B capitalization and inside-out
      monitoring launch in late 2026.
    data:
      items:
        - date: 2024-06
          label: Company Founding
          detail: >-
            Eric Ho, Dan Balsam, and Tom McGrath establish Goodfire as a Delaware Public Benefit Corporation in San
            Francisco.
          tone: neutral
        - date: 2024-08
          label: Seed Financing
          detail: >-
            Goodfire closes a $7 million Seed round led by Lightspeed Venture Partners with Menlo Ventures and South
            Park Commons.
          tone: positive
        - date: 2024-12
          label: Ember API Launch
          detail: >-
            Goodfire releases Ember, the first hosted mechanistic interpretability API, providing programmable feature
            exploration on Llama models.
          tone: positive
        - date: 2025-04
          label: Series A Capitalization
          detail: >-
            Goodfire secures $50 million in Series A funding led by Menlo Ventures, including Anthropic's first direct
            external startup investment.
          tone: positive
        - date: 2025-09
          label: Mayo Clinic Partnership
          detail: >-
            Goodfire announces collaboration with Mayo Clinic to apply mechanistic interpretability to genomic
            foundation models.
          tone: neutral
        - date: 2026-02
          label: Series B & Intentional Design Vision
          detail: >-
            Goodfire announces $150 million Series B at a $1.25 billion valuation led by B Capital, introducing
            intentional design to guide model training.
          tone: positive
        - date: 2026-02
          label: AI Safety Community Debate
          detail: >-
            Departure of founding researcher Liv Gorton and community debate emerge regarding risks of using
            interpretability in model training.
          tone: adverse
        - date: 2026-10
          label: Inside-Out Agent Monitors
          detail: >-
            Goodfire launches internal activation probes with Baseten and Hugging Face to detect agent sandboxing
            escapes and reward hacking.
          tone: positive
