      - number: '5.2'
        title: Inference-Time Activation Monitoring & Agent Guardrails
        blocks:
          - type: paragraph
            body: >-
              In October 2026, Goodfire introduced inference-time 'inside-out' activation monitors designed to detect
              rogue AI agent actions at a fraction of the cost of conventional guardrails. Traditional agent supervision
              relies on external secondary LLMs reading every output token, incurring substantial latency and
              operational expense when agents run extensive reasoning loops. Goodfire's approach deploys lightweight
              linear probes directly into the intermediate layers of the primary model, evaluating internal
              representations generated during the forward pass without generating additional tokens. Through an
              infrastructure partnership with Baseten and Hugging Face, these monitors integrate directly into model
              hosting clusters. In empirical evaluations conducted on the open Kimi K3 foundation model, Goodfire
              demonstrated that monitoring 1 million interactions costs approximately $185, compared to $5,420 for
              entry-level external monitor models and roughly $200,000 for frontier LLM judges. The activation probes
              intercepted 93% of malicious hacking sessions while adding under 2% to first-token latency overhead.
