            body: >-
              Without disclosed annual recurring revenue, Goodfire's $1.25 billion post-money Series B valuation
              introduces severe multiple compression risk if native foundation model providers integrate proprietary
              interpretability probes directly into model architectures.
            calloutType: risk
            claimRefs:
