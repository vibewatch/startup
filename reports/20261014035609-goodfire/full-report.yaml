        title: Buyer Personas, Budget Ownership, and Adoption Workflows
        blocks:
          - type: paragraph
            body: >-
              Commercial adoption of mechanistic interpretability is structured around three distinct enterprise buyer
              segments: frontier model developers, inference hosting providers, and specialized domain researchers.
              Foundation model creators utilize Goodfire's tools to diagnose emergent capabilities, mitigate sycophancy,
