  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Hierarchical market sizing layers contracting from aggregate generative AI infrastructure to specialized white-box
      interpretability.
    data:
      items:
        - label: Total AI Developer & Infrastructure Ecosystem
          value: >-
            Broad market encompassing foundation models, compute hosting, vector search, and data pipelines ($20B+
            market category).
          level: 1
        - label: AI Safety, Governance & Evaluation Market
          value: Addressable segment encompassing compliance, safety guardrails, and model observability ($2B-$3B potential).
          level: 2
        - label: Mechanistic Interpretability & Model Design Tooling
          value: Specialized software segment for internal feature extraction, sparse autoencoders, and model steering.
          level: 3
        - label: Inference-Time Activation Probe Monitoring
          value: High-volume transactional monitoring market replacing expensive LLM judges at $185 per 1M exchanges.
          level: 4
        - label: Specialized Digital Biology & Scientific Foundation Models
          value: >-
            High-value vertical niche applying interpretability to epigenetic and genomic models (Mayo Clinic, Arc
            Institute).
          level: 5
        - label: Goodfire Serviceable Current Footprint
          value: Private commercial footprint backed by $200M+ capital, partnered with Baseten and research institutions.
          level: 6
