              disease biomarkers. Despite these technical milestones, the company's shift toward intentional
              design—using interpretability during model training—ignited sharp debate within the AI safety community
              regarding whether training against interpretability probes induces models to obfuscate their internal
              representations. This scrutiny was accompanied by the departure of founding scientist Liv Gorton,
