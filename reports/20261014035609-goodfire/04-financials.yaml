  - calloutType: "insight"
    title: "Forward-Pass Activation Monitoring Offers Substantial Unit-Cost Defensibility"
    body: "By tapping into intermediate forward-pass tensor activations rather than orchestrating secondary LLM inspection passes, Goodfire achieves a reported monitoring cost of $185 per million exchanges versus thousands of dollars for full-model oversight, creating compelling unit economics for inference partners."
