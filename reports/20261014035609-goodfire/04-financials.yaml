    title: "Private Metric Opacity Precludes Standalone Revenue Multiples"
    body: "Goodfire operates as an opaque private public benefit corporation without public reporting of ARR, gross margins, or customer retention metrics. Underwriters must treat early commercial momentum as research validation rather than verifiable SaaS recurring revenue."
