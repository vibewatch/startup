evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capitalization-and-share-class-terms
    missingEvidence: >-
      Audited cap table detail including Series B liquidation preferences, seniority waterfall, voting control
      agreements, and secondary transaction share transfer restrictions.
    whyItMatters: >-
      Without share-class rights, investors cannot model downside protection or determine whether common shareholders
      face aggressive preference overhang in an adverse exit.
    diligencePath: >-
      Request confidential capitalization table and investors' rights agreement via data room under mutual
      non-disclosure agreement.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: recurring-revenue-and-customer-metrics
    missingEvidence: >-
      Verified annual recurring revenue, software subscription vs research consulting revenue breakdown, and gross
      retention rates.
    whyItMatters: >-
      Determines whether Goodfire functions as a high-multiple pure-play software platform or relies heavily on
      labor-intensive frontier research engagements.
    diligencePath: >-
      Review GAAP financial statements, customer cohort retention schedules, and pipeline conversion audits in
      management diligence sessions.
