chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、使命与公益公司治理
        blocks:
          - type: paragraph
            body: >-
              Goodfire AI, Inc. 是一家 AI 可解释性研究公司和商业模型设计实验室，成立于 2024 年 6 月，以特拉华州公益公司形式设立。公司总部位于加利福尼亚州旧金山 Battery Street
              1265 号，章程使命是把不透明的基础模型变成可理解、可引导、可审计的系统。Goodfire
              不把大型神经网络当作黑箱概率引擎，而是开发机制可解释性工具，检查并干预中间神经激活。公司一手做稀疏自编码器等前沿学术研究，一手建设商业基础设施。公益公司治理在法律上把受托责任与安全、透明目标对齐，使公司处在 AI
              安全研究与企业开发者工具的交叉点，覆盖文本、多模态和生物基础模型。
            claimRefs:
              - CO013
              - CO006
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
      - number: '1.2'
        title: 管理层、创始团队与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              Goodfire 由 Eric Ho、Dan Balsam 和 Tom McGrath 共同创办，团队兼具创业扩张经验和基础研究资历。首席执行官 Eric Ho 与首席技术官 Dan Balsam 曾于 2016
              年共同创办招聘平台 RippleMatch，并将其 ARR 做到超过一千万美元。首席科学家 Tom McGrath 曾在 Google DeepMind 共同创办并领导机制可解释性研究团队，之后离开并创办
              Goodfire。公司汇聚了来自 OpenAI、DeepMind、Stanford、Harvard 和 UC San Diego 的科研人才，其中包括创始研究员 Nick
              Cammarata。科研人才高度集中带来出色的技术履历，但公司对三位创始人的依赖也很重：他们同时承担研究方向和早期平台合作中的企业商业落地。
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.3'
        title: 资本化轨迹、估值基准与投资人阵营
        blocks:
          - type: paragraph
            body: >-
              Goodfire 成立后二十个月内资本化进程迅速提速：2024 年 8 月完成 700 万美元种子轮，2025 年 4 月完成 5,000 万美元 A 轮。2026 年 2 月，公司完成由 B Capital
              领投的 1.5 亿美元 B 轮，投后估值 12.5 亿美元，累计股权融资达到 2.07 亿至 2.09 亿美元。股东表中既有 Menlo Ventures、Lightspeed Venture Partners
              等机构领投方，也有 Anthropic 和 Salesforce Ventures 等战略投资者。Anthropic 的参与是其首次直接投资外部初创公司，为 Goodfire 的可解释性方向提供了验证。但 B
              轮具体清算优先权、投票控制安排和二级流动性规则仍属私密信息，因而下行保护存在尽调空白。
            claimRefs:
              - CO001
              - CO002
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO010
              - CO011
              - CO012
      - number: '1.4'
        title: 平台里程碑、商业扩张与安全审视
        blocks:
          - type: paragraph
            body: >-
              Goodfire 借助旗舰 Ember API 和近期的 inside-out 运行时监控，从基础研究走向商业部署。2026 年 10 月，公司与 Baseten、Hugging Face
              合作推出激活层监控探针，以较低成本检测开放模型（如 Kimi K3）中的沙箱逃逸和奖励黑客行为。同时，Goodfire 还与 Arc Institute、Mayo Clinic 和 Prima Mente
              合作，识别新的阿尔茨海默病生物标志物。尽管技术里程碑不断，公司转向有意设计——在模型训练中使用可解释性——却在 AI 安全社区引发激烈争论：针对可解释性探针训练，是否会诱导模型掩盖内部表征。创始科学家 Liv
              Gorton 离职也发生在这一审视期间，凸显商业能力优化与纯安全审计之间的内在张力。
            claimRefs:
              - CO004
              - CO014
              - CO015
              - CO003
              - CO005
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO004
              - CO013
              - CO014
      - number: '1.5'
        title: 证据展项
        blocks:
          - type: callout
            title: Anthropic 首次直接外部投资带来的战略验证
            body: >-
              Anthropic 在 2025 年 4 月 A 轮期间首次用资产负债表资金直接投资 Goodfire，这既为 Goodfire
              的机制可解释性技术栈提供了非同寻常的技术验证，也与一家领先的前沿模型实验室建立了重要战略联盟。
            calloutType: insight
            claimRefs:
              - CO011
              - CO010
          - type: callout
            title: 有意设计争议与科学治理张力
            body: Goodfire 的有意设计方法引发争论，也暴露出商业化可解释性面临的治理难题。用内部特征探针优化模型，可能会对欺骗性表征施加选择压力；这也说明独立的外部安全审计不可或缺。
            calloutType: risk
            claimRefs:
              - CO014
              - CO015
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与产品范围
        blocks:
          - type: paragraph
            body: >-
              AI 可解释性软件位于通用机器学习开发者工具与事后模型评估框架之间的独立层级。传统黑箱治理套件只通过输入提示和生成文本评估模型；Goodfire
              则深入神经网络内部的机制层。公司产品边界包括内部激活探针、Ember 模型设计平台和 Silico
              自动化可解释性研究代理。该品类纳入的支出包括模型引导、表征调试、奖励黑客防范和生物基础模型分析等软件预算；排除的支出则包括外部提示过滤防火墙、通用云计算基础设施、基础数据标注流水线和传统应用监控。Goodfire
              严格聚焦白箱模型内部，瞄准传统可观测性厂商无法覆盖的专业工程和安全预算。
            claimRefs:
              - CM001
              - CM002
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
      - number: '2.2'
        title: TAM、SAM 与经济规模测算
        blocks:
          - type: paragraph
            body: >-
              评估 Goodfire 的可服务市场，需要把宽泛的人工智能预测拆成具体、可触达的工作流类别。行业分析师预计，到 2026 年，生成式人工智能开发者工具、基础设施和治理的整体市场将扩展为数十亿美元品类。其中，自动化
              AI 安全、合规和红队测试的 SAM 估计为每年 $1.5B 至 $3.0B 的软件机会。Goodfire 带来的核心经济变化在于单位经济性：运行在 Kimi K3 等开放模型上的内部激活监控，每百万次交互成本约
              $185；轻量外部评判模型为 $5,420，前沿 LLM 评估器约 $200,000。尽管成本优势明显，受限于私有商业合同和未披露的经常性收入，公开披露无法精确测算 Goodfire 的 SOM。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM014
