figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Goodfire 从 2024 年创立到 B 轮融资及 2026 年末推出 inside-out 监视器的时间顺序发展历程。
    data:
      items:
        - date: 2024-06
          label: 公司创立
          detail: Eric Ho、Dan Balsam 和 Tom McGrath 在旧金山成立 Goodfire，使其成为特拉华州公益公司。
          tone: neutral
        - date: 2024-08
          label: 种子轮融资
          detail: Goodfire 完成 $7 million 种子轮融资，由 Lightspeed Venture Partners 领投，Menlo Ventures 和 South Park Commons 参投。
          tone: positive
        - date: 2024-12
          label: Ember API 发布
          detail: Goodfire 发布 Ember，这是首个托管式机械可解释性 API，可在 Llama 模型上进行可编程特征探索。
          tone: positive
        - date: 2025-04
          label: A 轮融资
          detail: Goodfire 获得 $50 million A 轮融资，由 Menlo Ventures 领投，其中包括 Anthropic 首次直接对外部初创公司的投资。
          tone: positive
        - date: 2025-09
          label: Mayo Clinic 合作
          detail: Goodfire 宣布与 Mayo Clinic 合作，将机械可解释性应用于基因组基础模型。
          tone: neutral
        - date: 2026-02
          label: B 轮与 Intentional Design 愿景
          detail: Goodfire 宣布完成 $150 million B 轮融资，估值 $1.25 billion，由 B Capital 领投，并引入以 intentional design 指导模型训练。
          tone: positive
        - date: 2026-02
          label: AI 安全社区争论
          detail: 创始研究员 Liv Gorton 离职，社区开始讨论在模型训练中使用可解释性的风险。
          tone: adverse
        - date: 2026-10
          label: Inside-Out 智能体监视器
          detail: Goodfire 与 Baseten 和 Hugging Face 推出内部激活探针，用于检测智能体沙箱逃逸和奖励投机。
          tone: positive
    approximationNotes: null
    claimRefs:
      - CO001
      - CO004
      - CO013
      - CO014
  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 从生成式 AI 基础设施总市场逐层收缩至专业白盒可解释性的分层市场规模框架。
    data:
      items:
        - label: AI 开发者与基础设施生态总规模
          value: >-
            Broad market encompassing foundation models, compute hosting, vector search, and data pipelines ($20B+
            market category).
          level: 1
        - label: AI 安全、治理与评估市场
          value: Addressable segment encompassing compliance, safety guardrails, and model observability ($2B-$3B potential).
          level: 2
        - label: 机械可解释性与模型设计工具
          value: Specialized software segment for internal feature extraction, sparse autoencoders, and model steering.
          level: 3
        - label: 推理时激活探针监视
          value: High-volume transactional monitoring market replacing expensive LLM judges at $185 per 1M exchanges.
          level: 4
        - label: 专业数字生物学与科学基础模型
          value: >-
            High-value vertical niche applying interpretability to epigenetic and genomic models (Mayo Clinic, Arc
            Institute).
          level: 5
        - label: Goodfire 当前可服务市场覆盖
          value: Private commercial footprint backed by $200M+ capital, partnered with Baseten and research institutions.
          level: 6
    approximationNotes: 各层定义将自上而下的行业分类与 Goodfire 的实证单位定价及已披露的合作伙伴部署结合起来。
    claimRefs:
      - CM010
      - CM011
      - CM012
      - CM013
  - id: FP001
    title: 竞争定位：机械访问能力 vs. 平台中立性
    type: quadrant
    summary: Goodfire 将深层机械激活访问能力与跨模型平台中立性结合起来，从黑箱可观测性工具和前沿实验室的专有研究中脱颖而出。
    data:
      points:
        - label: Goodfire (Ember / Silico)
          x: 4.5
          'y': 4.2
          description: 托管式机械可解释性和激活探针，部署在开放权重基础模型上。
        - label: Arize AI 与 Arthur AI
          x: 1.2
          'y': 4.5
          description: 厂商中立的应用可观测性，追踪外部输入和输出，而非内部神经元激活。
        - label: Scale AI
          x: 1
          'y': 3.8
          description: 企业数据引擎和外部行为评估，但不具备内部模型操控能力。
        - label: Google DeepMind
          x: 4.6
          'y': 1.4
          description: 领先的内部机械可解释性研究，仅部署在专有 Gemini 系统内。
        - label: Anthropic
          x: 4.4
          'y': 1.8
          description: 安全与 SAE 回路研究的全球领先者，聚焦专有 Claude 的对齐。
        - label: 内部自建 / 开源
          x: 2.8
          'y': 2.5
          description: 定制 PyTorch 脚本和研究笔记本，缺乏企业基础设施与生产托管。
    approximationNotes: 坐标轴代表有序的定性评分：X 轴表示内部激活和机械模型访问的深度（1=仅黑箱输出，5=直接操控神经元）；Y 轴表示跨模型中立性和多厂商平台独立性（1=单一专有生态，5=完全跨模型可移植）。
    claimRefs:
      - CP001
      - CP003
      - CP010
      - CP014
  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 客户模型部署和研究活动如何经由平台探针及软件订阅，转化为经常性收入和毛利。
    data:
      nodes:
        - label: 模型开发者 / 托管方
          detail: 部署开放或专有基础模型的企业团队和托管平台（例如 Baseten）
        - label: 推理活动
          detail: 在生产端点运行的运行时查询量和智能体执行 token
        - label: 激活探测
          detail: Goodfire 的轻量内部探针复用前向传播的 token 计算，以每 1M 次交互约 $185 的成本评估风险
        - label: 监视与平台使用
          detail: 在模型设计环境中配置检测事件、操控规则和 Silico 智能体能力
        - label: 货币化计费流
          detail: 按使用量收取的每次交互监视费，加上年度企业平台软件订阅费
        - label: 毛利转化
          detail: 扣除探针分类器执行所需云 GPU 开销后的高毛利率软件交付
    approximationNotes: 基于公开定价基准和企业分发机制展示运营转化流程；确切毛利率仍属机密。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI011
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Goodfire 可解释性与模型设计技术栈的分层架构，覆盖基础模型、激活提取、SAE 词典和应用接口。
    approximationNotes: 架构分层概括 Goodfire 已披露的平台组件和合作伙伴部署模式；底层探针执行代码为专有代码。
    data:
      layers:
        - label: 应用与发现界面
          detail: Ember 网页环境、Silico 科学发现界面，以及用于模型检查的企业 REST API
        - label: 监视与操控引擎
          detail: Inside-out 激活监视器、自动操控向量注入和越狱防护控制
        - label: 特征分解层
          detail: 稀疏自编码器（SAE）将多义神经激活转换为可解释的概念词典
        - label: 激活提取与探测
          detail: 轻量线性分类器探针在 token 生成期间读取前向传播的中间表征
        - label: 主机推理与执行
          detail: 在推理集群（Baseten / Base Labs）上共置运行时执行，延迟影响低于 2%
        - label: 基础模型支撑
          detail: 支持 Kimi K3、GLM-5.2、DeepSeek R1、Llama 和生物学 Transformer 等开放基础模型
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE009
