  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 评估技术证明、商业进展、估值倍数风险和最终尽调要求的分析决策路径。
    approximationNotes: 流程顺序展示通向“继续研究”建议的定性分析关卡。
    data:
      nodes:
        - label: 1. 前沿科学履历
          detail: 来自 OpenAI 和 DeepMind 的世界级团队，已验证机械可解释性和 SAE 突破
        - label: 2. 技术验证与合作
          detail: 已证明幻觉减少 50%，并与 Microsoft、Arc Institute 和 Mayo Clinic 建立合作
        - label: 3. 产品商业化
          detail: 在 Baseten 上推出 Ember 模型设计环境和低成本 inside-out 监视器
        - label: 4. 财务披露不透明
          detail: 未披露企业 ARR、客户账户数、毛利率或单位经济
        - label: 5. 估值倍数与稀释风险
          detail: $1.25B B 轮投后估值抬高倍数门槛，并带来潜在下轮融资风险
        - label: 6. 尽调前提
          detail: 必须在 NDA 下审阅经审计财务数据、经常性软件收入构成和 B 轮清算优先权
