      - - 正论支柱 2：低成本运行时安全
        - Inside-out 神经激活监视器相较外部监督 LLM 可降低 90% 以上成本
        - TechCrunch 报道称，Baseten 上每百万次交互成本为 $185，而外部 LLM 监视器为 $5,420 至 $200,000
