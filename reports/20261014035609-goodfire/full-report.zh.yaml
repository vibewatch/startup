      - number: '3.2'
        title: 能力矩阵与定价架构
        blocks:
          - type: paragraph
            body: >-
              Goodfire 为模型对齐和运行时防护栏带来不同的技术与经济范式。行业标准做法是用二级 LLM 评判器“站在代理肩后”阅读转录，带来显著延迟和高昂推理成本（每百万次交互 $5,420 至
              $200,000）。Goodfire 的 inside-out 激活监控直接接入神经网络前向传播，在基础模型已经计算的中间表征上运行轻量线性分类器探针。在 Kimi K3 上，该方法把监控成本降至每百万次交互约
              $185，额外延迟低于 2%。商业上，Goodfire 通过托管 API token、开发者 SDK 和企业模型设计项目交付能力，与可观测性套件按 SaaS 遥测量计费、封闭模型服务商捆绑计算费的方式不同。
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP008
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP008
              - CP013
          - type: table
            tableRef: TP003
