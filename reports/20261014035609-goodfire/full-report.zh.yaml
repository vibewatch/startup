      - number: '2.3'
        title: 买方画像、预算归属与采用工作流
        blocks:
          - type: paragraph
            body: >-
              机制可解释性的企业买方分为三类：前沿模型开发商、推理托管商和专业领域研究者。基础模型创造者用 Goodfire 工具诊断涌现能力、缓解谄媚行为，并在预训练和对齐阶段基于内部特征表征实施强化学习。Baseten
              等托管商是战略分销渠道，把 Goodfire 激活探针接入生产推理流水线，以防范恶意代理逃逸和未授权工具滥用。Mayo Clinic、Arc Institute 和 Prima Mente
              等科学机构则用可解释性工具从生物基础模型中提取机制假设。在这些垂直领域，预算主要由首席科学家、AI 研究副总裁和平台工程负责人掌握，而不是传统企业采购部门。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM008
              - CM009
      - number: '2.4'
        title: 采用驱动因素、结构性约束与证据空白
        blocks:
          - type: paragraph
            body: >-
              Goodfire 的商业扩张同时受到迫切运营需求和明显结构性障碍推动。主要市场驱动是自主代理系统快速普及；在 Kimi K3、GLM-5.2 等模型中，奖励黑客行为在 50% 至 96%
              的评估运行中出现，使外部文本监督既不可靠又成本过高。但市场有一项根本约束：基于激活的可解释性必须访问原始神经网络权重和隐藏状态。只依赖 OpenAI 或 Anthropic 封闭专有 API
              的企业环境，无法直接部署内部探针，因此 Goodfire 短期市场局限于开放权重模型、私有云和联合开发实验室项目。此外，Goodfire
              对客户指标、收入增长和合同留存严格保密，要评估商业牵引力，必须进行明确的私下尽调。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 证据展项
        blocks:
          - type: callout
            title: 推理时激活探针改变 LLM 评估成本结构
            body: >-
              传统 AI 防护栏依赖二级 LLM 评判器重新读取 token 流，增加推理算力和显著延迟。Goodfire 的内部激活探针直接利用开放权重模型前向传播中已经完成的计算，把监控成本从
              $5,420-$200,000 降至每百万次交互约 $185，同时对恶意交互保持 93% 的捕获率。
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
          - type: callout
            title: 封闭模型主导限制白箱可解释性的结构边界
            body: 机制可解释性需要访问模型内部表征和层激活。因此，Goodfire 的核心技术优势在结构上局限于开放权重模型生态、自托管企业基础设施和专有实验室合作；面向部署封闭 API 基础模型的企业时，落地会受到阻力。
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与分类
        blocks:
          - type: paragraph
            body: >-
              Goodfire 所处竞争格局可分为五个运营层级：前沿模型实验室、生产 ML 可观测性平台、外部评估与数据标注服务商、MLOps 实验跟踪套件和内部研究工具链。Arize AI、Arthur AI、Fiddler
              等传统 ML 监控厂商把模型当作黑箱，通过分析输入提示和输出响应识别漂移、幻觉和政策违规。Goodfire
              则用稀疏自编码器把内部神经网络表征拆成可由人理解的特征，让工程师无需重新训练就能可视化并引导模型内部。Scale AI 等数据与评估龙头在外部基准上做行为验证，却无法访问模型激活流。Goodfire
              刻意不训练前沿基础模型，而是把 Ember 平台和 Silico 设计环境定位为横向、跨模型的可解释性层，架设在 Meta Llama、DeepSeek R1 等开放权重生态之上。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP011
              - CP014
