              - CP010
      - number: '3.3'
        title: 护城河持久性、切换动态与替代风险
        blocks:
          - type: paragraph
            body: >-
              Goodfire 的主要战略护城河来自高度集中的技术人才和专有稀疏自编码器训练流水线，核心成员曾在 Google DeepMind 和 OpenAI
              推进可解释性研究。但平台巨头和前沿基础模型实验室都给这条护城河带来结构性压力。Google DeepMind、Anthropic
              等大型实验室拥有深厚的内部机制可解释性能力，只是目前更关注优化自有架构（Gemini、Claude），而不是为竞争模型提供中立工具。Anthropic 的直接投资验证了 Goodfire
              的技术领导力，但企业切换成本仍属中等，因为模型通过标准 API 网关和开放权重访问。如果前沿实验室把原生激活级可引导能力接入托管端点，或开源可解释性库实现标准化，Goodfire
              的基础特征提取可能遭遇价格压缩，必须靠垂直科学发现和复杂代理监控工作流守住防御力。
            claimRefs:
              - CP009
              - CP010
              - CP012
              - CP014
      - number: '3.4'
        title: 证据展项
        blocks:
          - type: callout
            title: Inside-out 探测的架构优势
            body: >-
              Goodfire 把分类器探针直接接到前向传播计算出的中间神经激活上，避免对多轮代理日志运行外部 LLM 评判器的巨大算力惩罚。这种 inside-out 机制能在响应定稿前捕捉恶意或奖励黑客行为，在 Kimi
              K3 上达到 93% 检测率，额外延迟低于 2%。
            calloutType: insight
            claimRefs:
              - CP002
              - CP006
              - CP008
          - type: callout
            title: 前沿实验室侵入与网关商品化
            body: >-
              如果前沿模型开发商把原生激活钩子接入推理 API，Goodfire 的商业地位会受到威胁。当前前沿实验室把可解释性当作内部安全机制，但 Anthropic、OpenAI 或 Google
              一旦开放原生特征引导端点，就可能绕过独立可解释性层，压缩 Goodfire 的可服务市场。
            calloutType: risk
            claimRefs:
              - CP009
              - CP010
              - CP012
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入架构与变现渠道
        blocks:
          - type: paragraph
            body: >-
