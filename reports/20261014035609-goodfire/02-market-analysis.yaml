callouts:
  - calloutType: insight
    title: "Inference-Time Activation Probes Disrupt the Cost Structure of LLM Evaluation"
    body: "Traditional AI guardrails rely on secondary LLM judges that reread token streams, multiplying inference compute and adding substantial latency. Goodfire's internal activation probes tap directly into calculations already executed during the forward pass on open-weight models, reducing monitoring costs from $5,420-$200,000 down to approximately $185 per million exchanges while maintaining a 93% capture rate on malicious interactions."
    claimRefs:
      - "CM004"
      - "CM005"
  - calloutType: risk
    title: "Closed-Model Dominance Imposes Structural Boundary Limits on White-Box Interpretability"
    body: "Mechanistic interpretability requires access to internal model representations and layer activations. Consequently, Goodfire's core technical advantage is structurally confined to open-weight model ecosystems, self-hosted enterprise infrastructure, and proprietary lab partnerships, creating friction when targeting enterprises that deploy closed-API foundation models."
    claimRefs:
      - "CM010"
      - "CM011"
