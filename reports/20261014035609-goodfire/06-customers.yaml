chapter:
  number: 6
  title: "Customers"
  summary: "Goodfire's commercial adoption spans three distinct surfaces: high-touch enterprise research partnerships with Microsoft, Mayo Clinic, and Arc Institute; self-serve ML research teams deploying the Silico agentic platform at $1,000/seat/month; and inference hosting customers running inside-out runtime monitors via Baseten. However, enterprise customer count, ARR, net revenue retention, and customer concentration profiles remain completely undisclosed in public records."
sections:
  - id: "customer-segmentation-demand"
    title: "Customer Segmentation & Buyer Demand Drivers"
    body: "Goodfire's addressable customer landscape divides into four operating segments: frontier model developers, digital biology and healthcare institutions, enterprise software builders, and academic safety labs. Frontier labs and major platform vendors purchase mechanistic interpretability capabilities to evaluate model reliability, inspect neural representations, and eliminate unwanted behavioral failures during post-training. In healthcare and digital biology, institutional partners like Mayo Clinic and Arc Institute utilize Goodfire's tools as biological microscopes, reverse-engineering epigenetic and genomic models to extract clinically validated biomarkers and decipher latent representations of transfer RNA. Enterprise application developers are motivated by emerging AI explainability mandates, seeking internal activation inspection to audit agent behavior and defend against prompt injections or rogue execution before deployment. Meanwhile, academic researchers and safety institutes access the technology through subsidized grant programs and open-source sparse autoencoder releases, establishing Goodfire as an intellectual standard across the broader research community."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-channels"
    title: "Adoption Trajectory & Product-Led Surfaces"
    body: "Historically, Goodfire accessed enterprise demand through forward-deployed research engagements that reached seven figures in contract value, mirroring an elite research consultancy rather than a scalable software business. In August 2026, the company initiated a commercial pivot toward product-led growth by launching Silico, an autonomous ML research platform priced at $1,000 per seat per month with a 50% discount for the initial two months. Silico provides an orchestrated multi-agent harness where automated agents execute 5 to 10 parallel interpretability experiments weekly, utilizing weekly refreshed token and GPU credit pools across Anthropic and OpenAI models. Complementing Silico, Goodfire partnered with Baseten's Base Labs and Hugging Face in October 2026 to distribute inside-out activation monitors directly to hosted inference customers. Operating at approximately $185 per million exchanges—a 96% cost reduction compared to secondary LLM judges—these lightweight monitors catch 93% of malicious hacking attempts with under 2% latency overhead, creating an embedded utility channel that monetizes open-weight model deployments at inference time."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
    figureRefs:
      - "FU001"
    tableRefs:
      - "TU002"
  - id: "named-enterprise-deployments"
    title: "Named Enterprise Deployments & Partnership Proof"
    body: "Goodfire's enterprise credibility rests on high-profile technical collaborations with marquee institutions across software and healthcare. The company maintains documented relationships with Microsoft, Mayo Clinic, and Arc Institute, deploying custom interpretability pipelines into mission-critical workflows. In digital biology, Arc Institute leveraged Goodfire's feature extraction technology on the Evo DNA foundation model, successfully mapping fundamental biological concepts such as RNA and tRNA structures directly to neural activation clusters. In clinical medicine, Goodfire collaborated with Mayo Clinic and biotechnology partner Prima Mente to examine an epigenetic foundation model, isolating a novel class of biomarkers for Alzheimer's disease detection through representation reverse-engineering. Furthermore, Baseten's inference hosting marketplace provides production proof for Goodfire's activation probe architecture, demonstrating that enterprise inference workloads can run continuous automated guardrails without prohibitive secondary model compute expenses."
    claimRefs:
      - "CU006"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU003"
  - id: "durability-unit-economics"
    title: "Durability, Unit Economics & Customer Concentration Risks"
    body: "Despite technical validation and prominent logo references, Goodfire's commercial durability faces material structural uncertainties. CTO Dan Balsam publicly confirmed that Silico's $1,000 monthly seat price is not currently profitable due to substantial agent orchestration tokens and on-demand GPU cluster consumption, meaning self-serve customer expansion currently exerts negative gross margin pressure. Additionally, mechanistic interpretability workflows have historically suffered from superposition bottlenecks, where steering interventions require delicate parameter calibrations that risk producing model gibberish if pushed beyond narrow operating thresholds. Most critically from an underwriting perspective, Goodfire discloses zero audited metrics regarding customer renewal rates, net revenue retention (NRR), annual recurring revenue (ARR), or customer concentration. The business remains exposed to potential revenue volatility if flagship engagements with Microsoft or Mayo Clinic represent episodic research contracts rather than durable recurring software subscriptions."
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
