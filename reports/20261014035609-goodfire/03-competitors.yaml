callouts:
  - calloutType: insight
    title: The Architectural Advantage of Inside-Out Probing
    body: By attaching classifier probes directly to intermediate neural activations computed during the forward pass, Goodfire avoids the massive compute penalty of running external LLM judges over multi-turn agent logs. This inside-out mechanism catches malicious or reward-hacking behaviors before responses are finalized, achieving 93% detection rates on Kimi K3 while adding less than 2% latency.
    claimRefs:
      - CP002
      - CP006
      - CP008
  - calloutType: risk
    title: Frontier Lab Encroachment and Gateway Commoditization
    body: Goodfire's commercial position is vulnerable to frontier model developers integrating native activation hooks into their inference APIs. While frontier labs currently treat interpretability as an internal safety mechanism, any decision by Anthropic, OpenAI, or Google to expose native feature-steering endpoints could bypass standalone interpretability layers and compress Goodfire's addressable market.
    claimRefs:
      - CP009
      - CP010
      - CP012
