    rows:
      - - Goodfire Inside-Out Probes
        - Token API usage & custom enterprise design contracts
        - Hosted SAE search, steering, and inside-out monitoring ($185 / 1M exchanges on Kimi K3)
        - List pricing for enterprise Silico tiers undisclosed; private design contracts
        - Orders-of-magnitude cheaper runtime monitoring compared to secondary LLM judges ($185 vs $5,420+)
      - - Secondary LLM Judges (Status Quo)
        - Per-token LLM inference API consumption
        - Input/output safety scoring by reading complete interaction transcripts ($5,420 to $200,000 / 1M exchanges)
        - Volume discounts available from hyperscalers; compounding token costs for long-horizon agent traces
        - Prohibitive compute cost and latency for autonomous agent workflows with thousands of tool calls
      - - Output Observability SaaS (Arize, Arthur)
        - SaaS subscription tier by telemetry span volume and model seats
        - Application tracing, latency logging, output drift tracking, and prompt analytics
        - Custom enterprise quotes; usage tiers scale with log data retention windows
        - Solves operational dashboarding but fails to catch rogue model actions before tokens are generated
      - - Frontier Lab Native Guardrails (Anthropic, DeepMind)
        - Bundled with proprietary model API consumption
        - First-party safety classifiers and system-level alignment guardrails
        - Opaque pricing bundled into token rates; zero direct access to underlying feature activations
        - Locks enterprise buyers into single-model ecosystems without cross-vendor interpretability auditability
