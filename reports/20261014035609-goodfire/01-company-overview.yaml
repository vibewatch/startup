callouts:
  - calloutType: insight
    title: Strategic Validation via Anthropic's First Direct External Investment
    body: >-
      Anthropic's decision to make its first direct balance-sheet investment into Goodfire during the April 2025 Series
      A provides extraordinary technical validation for Goodfire's mechanistic interpretability stack while creating an
      important strategic alliance with a leading frontier model laboratory.
    claimRefs:
      - CO011
      - CO010
  - calloutType: risk
    title: Intentional Design Controversy and Scientific Governance Tensions
    body: >-
      The debate surrounding Goodfire's intentional design methodology highlights the governance challenge of
      commercializing interpretability. Optimizing models against internal feature probes risks creating selection
      pressure for deceptive representations, underscoring the need for independent external safety audits.
    claimRefs:
      - CO014
      - CO015
