company:
  name: Goodfire
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Goodfire is a San Francisco-based Delaware Public Benefit Corporation developing mechanistic interpretability tools
    and model-design infrastructure, capitalized with $209M in total equity funding at a $1.25B valuation as of October
    2026.
sections:
  - id: corporate-identity-and-structure
    title: Corporate Identity, Mission, and Public Benefit Corporation Governance
    body: >-
      Goodfire AI, Inc. is an AI interpretability research company and commercial model-design laboratory founded in
      June 2024 and organized as a Delaware Public Benefit Corporation. Headquartered at 1265 Battery Street in San
      Francisco, California, the company operates with the stated charter of transforming opaque foundation models into
      understandable, steerable, and auditable systems. Rather than treating large neural networks as black-box
      probabilistic engines, Goodfire develops mechanistic interpretability tools that inspect and intervene on
      intermediate neural activations. The company's dual mandate balances frontier academic research in sparse
      autoencoders with commercial infrastructure development. Its corporate governance as a public benefit corporation
      legally aligns its fiduciary duties with safety and transparency objectives, positioning the company at the
      intersection of AI safety research and enterprise developer tooling across text, multimodal, and biological
      foundation models.
    claimRefs:
      - CO013
      - CO006
    tableRefs:
      - TO001
  - id: leadership-and-scientific-talent
    title: Executive Leadership, Founding Team, and Key-Person Dependencies
    body: >-
      Goodfire was established by co-founders Eric Ho, Dan Balsam, and Tom McGrath, pairing prior entrepreneurial
      scaling experience with foundational research credentials. Chief Executive Officer Eric Ho and Chief Technology
      Officer Dan Balsam previously co-founded recruitment platform RippleMatch in 2016, scaling that business to over
      ten million dollars in annual recurring revenue. Chief Scientist Tom McGrath co-founded and led the mechanistic
      interpretability research team at Google DeepMind before departing to co-found Goodfire. The company has
      concentrated scientific talent from OpenAI, DeepMind, Stanford, Harvard, and UC San Diego, including founding
      researcher Nick Cammarata. While this research-heavy concentration provides an exceptional technical pedigree, the
      organization carries pronounced key-person dependency on its founding triumvirate for both research direction and
      commercial enterprise execution across early platform partnerships.
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO009
    tableRefs:
      - TO002
  - id: capitalization-and-stakeholder-map
    title: Capitalization Trajectory, Valuation Benchmark, and Investor Coalition
    body: >-
      Goodfire's capitalization trajectory accelerated rapidly within twenty months of inception, advancing from an
      initial seven million dollar Seed round in August 2024 to a fifty million dollar Series A in April 2025. In
      February 2026, Goodfire closed a one hundred fifty million dollar Series B financing round led by B Capital at a
      post-money valuation of one point two five billion dollars, bringing cumulative equity capital raised to between
      two hundred seven and two hundred nine million dollars. The cap table features institutional lead investors
      including Menlo Ventures and Lightspeed Venture Partners alongside strategic participants Anthropic and Salesforce
      Ventures. Anthropic's participation represented its first direct external startup investment, validating
      Goodfire's interpretability focus. However, specific Series B liquidation preferences, voting control agreements,
      and secondary liquidity rules remain private, creating diligence gaps around downside protection.
    claimRefs:
      - CO001
      - CO002
      - CO010
      - CO011
      - CO012
    tableRefs:
      - TO003
  - id: commercial-milestones-and-safety-scrutiny
    title: Platform Milestones, Commercial Expansion, and Safety Scrutiny
    body: >-
      Goodfire transitioned from foundational research into active commercial deployment through its flagship Ember API
      and recent inside-out runtime monitors. In October 2026, the company partnered with Baseten and Hugging Face to
      launch activation-level monitoring probes, offering cost-effective detection of sandboxing escapes and reward
      hacking in open models like Kimi K3. Simultaneously, Goodfire demonstrated biological applications, partnering
      with Arc Institute, Mayo Clinic, and Prima Mente to identify novel Alzheimer's disease biomarkers. Despite these
      technical milestones, the company's shift toward intentional design—using interpretability during model
      training—ignited sharp debate within the AI safety community regarding whether training against interpretability
      probes induces models to obfuscate their internal representations. This scrutiny was accompanied by the departure
      of founding scientist Liv Gorton, highlighting inherent tensions between commercial capability optimization and
      pure safety auditing.
    claimRefs:
      - CO004
      - CO014
      - CO015
      - CO003
      - CO005
    figureRefs:
      - FO001
