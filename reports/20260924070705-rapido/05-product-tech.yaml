  name: Rapido
  website: https://rapido.bike
chapter:
  number: 5
  title: Product & Technology
  summary: Rapido’s product surface is now broader than ride-hailing, with mobile
    app, routing, corporate, and delivery workflows tied together by location intelligence
    and a growing safety / trust footprint.
sections:
- id: product-surface
  title: Product surface and workflow
  body: The product is best understood as a set of workflows rather than a single
    app. The official site and app store say Rapido offers bike, auto, and cab rides
    with live tracking, cashless payment, and easy booking. The corporate product
    adds a manager-facing wallet and invoice trail, while Ownly adds a separate food-delivery
    experience on top of the same logistics backbone. In customer terms, Rapido’s
    product promise is not just cheaper rides; it is faster matching, fewer support
    calls, and better route confidence across a range of local transport use cases.
  claimRefs:
  - CE001
  - CE002
  - CE003
- id: architecture-and-reliability
  title: Architecture and operating model
  body: Google Cloud’s customer case study is the strongest public technical source.
    It says Rapido integrated Google Maps Platform mobility services to improve tracking,
    dispatch, ETA quality, and route validation; the case study also reports a reduction
    in rider call-center calls from 5% to less than 1% and a tracking accuracy improvement
    from about 60% to about 95%. That implies the product depends on a location-intelligence
    stack rather than a purely bespoke routing engine. The operational model is therefore
    part software, part marketplace, and part mapping dependency, with trust and dispatch
    quality directly tied to map accuracy.
  claimRefs:
  - CE004
  - CE005
  - CE006
- id: trust-and-roadmap
  title: Trust, safety, and roadmap
  body: The App Store and AppBrain listings show the product has a very large consumer
    footprint and also collects location and contact data, which makes privacy and
    trust part of the product stack. The app store text highlights safety features,
    live tracking, a PIN flow, and multiple languages, while the company’s own launch
    of Ownly and corporate products demonstrates roadmap breadth rather than a narrow
    core ride app. The obvious risk is that product breadth creates more surfaces
    for defects, compliance issues, and pricing confusion, but it also creates more
    leverage if the technology and trust controls hold up. The practical diligence
    question is whether the controls keep pace with the product surface as Rapido
    adds more lines of business.
  claimRefs:
  - CE007
  - CE008
  - CE009
