  topStrengths:
    - Large and growing mobility footprint across bike, auto, cab, corporate, and delivery use cases.
    - FY25 revenue growth and loss compression point to improving operating leverage.
    - Fresh $3B financing anchor shows investor appetite and better exit visibility.
    - Strong consumer app traction and very visible usage / review signals.
  topRisks:
    - Bike-taxi legality and consumer-protection enforcement remain live.
    - Disclosure gaps on cash, runway, cap table, and unit economics are still material.
    - Competition from Uber, Ola, and adjacent delivery platforms is intense.
    - The moat is operational and regulatory, not classic IP-based protection.
  unresolvedGaps:
    - Exact cash balance, runway, and take-rate remain undisclosed.
    - Public headcount remains inconsistent across sources.
    - Cap-table / preference detail after the 2026 financing is not public.
    - Customer retention metrics such as NRR and GRR are not disclosed.
