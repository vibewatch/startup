companyProfile:
  summary: >-
    Rapido is a Bengaluru-based, India-only mobility and delivery platform founded in 2015 by Aravind Sanka, Pavan
    Guntupalli, and Rishikesh S R. It started with bike taxis, expanded into autos and cabs, and now layers in corporate
    travel, parcel logistics, and a zero-commission food-delivery app called Ownly. The company has grown into a scaled
    private market asset with improving public financials, but its legal and consumer-trust risks remain material.
