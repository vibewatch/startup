    notes: 鉴于该公司尚未上市且信息存在一定盲区，观点翻转条件均按尽调触发信号表述。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV006
  - id: TV003
    title: 乐观、基准与悲观情景分析表
    columns:
      - 情景
      - 假设前提
      - 估值与回报逻辑
      - 核心风险
      - 发生概率信号
    rows:
      - - 乐观
        - Ownly 形成规模、IPO 筹备持续推进、监管趋于稳定
        - 收入结构改善、盈利能力提升，推动估值倍数上行
        - 政策冲击风险犹存
        - 中
      - - 基准
        - 维持增长势头，但亏损体量仍不容忽视
        - 合理估值大致落在当前私募市场定价附近
        - 再融资需求与行业竞争
        - 高
      - - 悲观
        - 摩托网约车或交互合规执法趋严
        - 估值倍数承压且退出周期拉长
        - 监管受挫
        - 中
      - - 期权价值
        - Ownly 与企业差旅
        - 更多元的业务结构有望支撑更高估值倍数
        - 政策风险仍占主导
        - 中
    notes: 情景推演刻意采用定性评估，因公开证据不足以支撑站得住脚的单点 DCF 估值模型。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
figures:
  - id: FO001
    title: 公司发展里程碑时间线
    type: timeline
    summary: 梳理 Rapido 自创立起，历经 2026 年融资、产品上线、监管演变及执法处罚等关键节点。
    data:
      items:
        - date: '2015-01-01'
          label: 创立
          detail: Aravind Sanka、Pavan Guntupalli 与 Rishikesh S R 共同创立公司
          tone: positive
          claimRefs:
            - CO001
        - date: '2024-09-01'
          label: Series E 轮独角兽融资
          detail: 完成 $200M 融资，估值达 $1.1B
          tone: positive
          claimRefs:
            - CO005
        - date: '2025-11-09'
          label: 公开讨论 IPO 筹备
          detail: 公开表态计划在 2026 年底前推进 IPO 筹备工作
          tone: positive
          claimRefs:
            - CO009
        - date: '2026-01-06'
          label: CCI 审查通过
          detail: 批准 Prosus / MIH 增持公司股份
          tone: positive
          claimRefs:
            - CO007
        - date: '2026-01-22'
          label: FY25 业绩
          detail: 营收增长 44%，亏损收窄至 ₹258 crore
          tone: positive
          claimRefs:
            - CO004
        - date: '2026-01-23'
          label: 摩托车出租合法性改善
          detail: Karnataka HC 裁定允许持许可证运营摩托网约车
          tone: positive
          claimRefs:
            - CO008
        - date: '2026-03-03'
          label: 上线 Ownly
          detail: 在 Bengaluru 推出零佣金外卖服务
          tone: positive
          claimRefs:
            - CO003
        - date: '2026-05-15'
          label: 完成新一轮融资
