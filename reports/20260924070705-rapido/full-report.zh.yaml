  - number: 6
    title: 客户群体
    sections:
      - number: '6.1'
        title: 客群细分与使用场景
        blocks:
          - type: paragraph
            body: >-
              Rapido 至少服务四类客群：追求低价本地出行的通勤者、提供运力的 captains、管理员工差旅的企业人员，以及可能通过 Ownly
              接单的餐饮商户。与此前更新相比，客户证据更扎实：应用商店评分和下载量可查，Google Cloud
              也发布了具名案例，说明路线和追踪改善如何降低客服负担、提升留存。不过，公司仍未公布清晰的留存看板或可靠的活跃用户分母，客群叙事覆盖面仍大于证据所能支撑的范围。
            claimRefs:
              - CU001
              - CU002
              - CU003
      - number: '6.2'
        title: 采纳轨迹与实名佐证
        blocks:
          - type: paragraph
            body: >-
              用户采用规模看起来真实且不小，但证据既有公司自报，也有第三方数据。App Store 有 290 万条评分，综合得分为 4.8/5；AppBrain 显示下载量达 2.4 亿次，评分约为
              4.79/5。Google Cloud 案例是最有力的具名运营证据：Rapido 使用 Maps Platform
              后，追踪准确率提高，乘客致电客服的次数减少。应用商店评论也提供了具名的正反反馈，呈现出便利与摩擦并存的一面。整体采用情况强劲，但尚未经过全面审计。
            claimRefs:
              - CU004
              - CU005
              - CU006
      - number: '6.3'
        title: 留存率、集中度与待决问题
        blocks:
          - type: paragraph
            body: >-
              客户端最大的缺口是留存和集中度。公开资料没有披露净留存率（NRR）、总留存率（GRR） 或账户集中度，无法据此建立可靠的投资判断模型。Rapido
              在印度市场敞口很大，且受各城市监管影响；即使客户数很大，区域集中风险仍然重要。消费者可能因服务不稳或价格变化而流失，captains
              可能转投其他平台；企业客户和餐饮商户则在意服务是否稳定、定价是否透明。客户规模看得见，客户能否长期留下却不清楚。没有分群留存数据，强劲的客户增长叙事仍不足以证明业务韧性。
            claimRefs:
              - CU007
              - CU008
              - CU009
