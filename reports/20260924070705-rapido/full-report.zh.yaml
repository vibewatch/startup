chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 定位、产品与规模
        blocks:
          - type: paragraph
            body: >-
              Rapido 把自己定位为印度用户首选的同城出行 App，而非小众摩托车出租服务。官网称，公司由 Rishikesh S R、Pavan Guntupalli 和 Aravind Sanka 于 2015
              年创立，现服务逾 1,000 万人，累计完成超过 1 亿次安全行程。第三方资料显示，业务已扩展到摩托车出租、三轮车、网约车、包裹配送、外卖和企业差旅；公开报道还称，公司已进入 400
              多座城市，拥有庞大的司机网络。Rapido 已不再只是从单一出行业务切入，而是发展成覆盖多种出行方式的消费物流平台。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO010
      - number: '1.2'
        title: 融资、股权与里程碑
        blocks:
          - type: paragraph
            body: >-
              2026 年 5 月的新一轮融资显著重设了 Rapido 的公开估值。多家独立报道显示，Prosus 领投 $240 million，WestBridge 和 Accel 参投，投后估值为 $3
              billion。CCI 同时批准 MIH/Prosus 收购股份，另以单独裁定结束一项竞争申诉。Rapido 已是具有分量、受监管的平台型资产，不再只是靠消费者增长的初创公司。公司还在筹备于 2026
              年底启动首次公开募股（IPO）流程；下一轮尽调因此更需看清股权结构、老股交易和公司治理。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.3'
        title: 待解缺口与研判
        blocks:
          - type: paragraph
            body: >-
              公开资料仍留下几项尽调缺口。员工人数估算差异很大：一份资料称 2025 年初有 660 人，较新的追踪数据则估计 2026 年约有 5.7k 人。各来源的营收数字也不完全一致，但趋势相同：FY25 明显好于
              FY24，亏损也在收窄。这些变化支持 Rapido 正走向更具投资价值的经营模式；不过，董事会构成、详细股权结构表、月活用户数、确切抽成率，以及 IPO 后的完整推进路径仍不透明。后续尽调应优先追问这些缺口。
            claimRefs:
              - CO004
              - CO010
              - CO011
              - CO012
