  - number: 7
    title: 风险评估
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Rapido 最大的风险仍是经营许可可能随城市或邦政策变化。Karnataka 2026 年的摩托车出租裁决改善了前景，但邦政府仍主张加强监管，法律争议也没有结束。Tamil Nadu 的环境更不利；CCPA
              罚款则说明消费者保护审查同样严峻。Rapido 并未摆脱监管摩擦，只是从全面不确定转入更细分、仍有争议的监管环境。对投资者而言，法律风险虽低于以往，仍是影响投资逻辑的首要变量。
            claimRefs:
              - CR001
              - CR002
              - CR003
      - number: '7.2'
        title: 运营与平台风险
        blocks:
          - type: paragraph
            body: >-
              Rapido 的日常运营离不开地图质量、派单准确度、客服处理和庞大的分布式 captain 运力网络。Google Cloud
              案例显示，升级地图技术后，客服来电减少、追踪能力改善，这是积极信号；但也说明业务容易受路线或计费误差影响，用户不满可能迅速升温。应用商店评论确有取消、计费和客服响应方面的投诉，这符合高密度、实时双边市场的特点。关键不是能否消除摩擦，而是能否把摩擦控制在用户和司机转投竞品之前。
            claimRefs:
              - CR004
              - CR005
              - CR006
      - number: '7.3'
        title: 外部依赖与财务风险
        blocks:
          - type: paragraph
            body: >-
              Rapido
              还面临显著的外部依赖风险：它依赖外部地图服务、可能同时接多个平台的司机供给，也仍需持续进入资本市场。最新融资有所帮助，但公开资料仍未披露现金余额、现金跑道或正式的现金流衔接模型。市场对价格敏感，车费、抽成或补贴稍有变化，就可能显著影响乘客需求和
              captain 运力。公司的财务风险与其说是近期资不抵债，不如说是利润空间被挤压、需要守住市场份额，以及政策限制削弱业务选择空间。投资者能看清这些风险来自哪里，却仍难以精确建模。
            claimRefs:
              - CR007
              - CR008
              - CR009
