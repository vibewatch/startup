  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与使用场景
        blocks:
          - type: paragraph
            body: >-
              Rapido
              面对的不是单一网约车市场，而是同城出行、首末公里接驳、包裹配送和外卖的交汇地带。官网与第三方资料显示，其业务仍聚焦印度，但已覆盖摩托车出租、三轮车、网约车、企业差旅和周边物流。估值取决于城市交通支出有多少能从分散、非正规或传统服务转向低价
              App 服务。因此，市场测算不能只看摩托车出租，也要纳入日常通勤和更广泛的本地物流需求。
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              Rapido 主要面向想要便宜、快捷市内交通的通勤者；乘客是使用者，付款方则可能是本人、企业账户，也可能是配送链条中的餐厅或顾客。司机 captain 也是市场中的关键一方：订阅制 /
              零佣金既影响乘客定价，也直接关系司机收入。拥堵、价格和 App 使用便利度推动采用，邦级监管、信任和服务可靠性则构成约束。客户章节显示评分高、评论增长快；市场逻辑很直接：现有交通又慢又贵、或仍不规范的地方，就是
              Rapido 的切入点。
            claimRefs:
              - CM004
              - CM005
              - CM006
      - number: '2.3'
        title: 规模测算、制约因素与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              公开数据说明 Rapido 规模不小，却不足以拆出清晰的总可用市场（TAM）/可服务市场（SAM）/可获取市场（SOM）。公司和合作方资料提到覆盖 100 多至 400 多座城市；早期客户资料称每月 4,500
              万次行程，累计行程超过 10
              亿次。新拓展的外卖业务也扩大了可触达的消费支出。这些数据支撑了大市场的判断，但边界不清，就无法得出可用于投资决策的市场规模。更大的约束是监管分散：摩托车出租受各邦政策左右，市场可能逐邦收紧或放开。机会虽有吸引力，估值仍须计入政策风险折价。
            claimRefs:
              - CM007
              - CM008
              - CM009
