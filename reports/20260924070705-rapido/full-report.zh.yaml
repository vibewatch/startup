  - number: 8
    title: 估值分析
    sections:
      - number: '8.1'
        title: 核心多空逻辑
        blocks:
          - type: paragraph
            body: >-
              看多 Rapido 的理由是，它已从早期出行项目成长为具备规模的平台，收入来源更多元、经营杠杆改善，最新融资也给出 $3 billion
              的估值锚点。反方则担心护城河缺少专有壁垒，监管仍可能冲击核心摩托车出租业务，而且现金、跑道和股权结构披露不足，无法精确评估。若订阅、配送和企业差旅收入继续增长，监管环境逐步改善，当前私募市场估值仍有支撑；若监管与价格战风险更突出，则更适合继续研究，而不是直接买入。
            claimRefs:
              - CV001
              - CV002
              - CV003
      - number: '8.2'
        title: 投资建议、置信度与估值立场
        blocks:
          - type: paragraph
            body: >-
              本轮更新维持买入，但置信度为中等、风险评级为高。FY25 营收增长、亏损收窄明显增强了基本面证据；2026 年 5 月融资推高估值，也显示投资者仍有兴趣。CCPA
              罚款和各邦对摩托车出租的政策不确定性，则限制了置信度。更准确地说，这是“买入，但只适合能承受较高政策与执行风险的投资者”。估值判断为合理而非便宜，因为 $3 billion 已计入不少未来成功预期。
            claimRefs:
              - CV004
              - CV005
              - CV006
      - number: '8.3'
        title: 乐观 / 基准 / 悲观情景与退出成熟度
        blocks:
          - type: paragraph
            body: >-
              乐观情景下，Rapido 借助多模态业务继续快速增长、扩大 Ownly，并在 IPO
              流程启动前接近经营性盈亏平衡。基准情景下，公司继续扩张，但需要更多资金；在公开市场信息更充分之前，估值大致维持在合理区间。悲观情景下，监管受挫或价格压力压低增长，也会削弱 2026 年 5
              月融资对应的估值。公开证据支持继续尽调，却不足以支撑假精确模型。退出方面应关注 IPO 准备程度、后续老股流动性，以及法律地位未遭重大冲击时，收入结构能否继续改善。
            claimRefs:
              - CV007
              - CV008
              - CV009
