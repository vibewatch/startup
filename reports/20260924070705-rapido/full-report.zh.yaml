  - number: 4
    title: 财务状况
    sections:
      - number: '4.1'
        title: 收入模型与商业化变现
        blocks:
          - type: paragraph
            body: >-
              Rapido 的收入来源已从单一转向多元。摩托车出租仍是核心业务，三轮车和网约车越来越多采用订阅制；Ownly
              带来配送费和餐厅端收入，企业客户则用账户钱包管理差旅。公司因此不再只靠网约车抽佣，还从平台服务、订阅、广告和物流收费中变现。尽调的重点不是收入有没有，而是收入结构能否继续拓宽，在抵消价格竞争和监管不确定性的同时保持资本效率。
            claimRefs:
              - CI001
              - CI002
              - CI003
      - number: '4.2'
        title: 公开财务业绩与成本信号
        blocks:
          - type: paragraph
            body: >-
              FY25 仍是最可靠的公开财务参照。基于法定申报的报道显示，营收增长 44% 至约 ₹934-1002 crore，净亏损收窄至约 ₹258 crore。ET 另称，Ebitda 亏损大幅收窄至 ₹104
              crore；员工和营销支出仍高，符合大举扩张期公司的特征。Rapido 尚未实现可持续经营盈利，但经营杠杆已有明显改善。虽然不同来源的具体数字略有出入，本轮融资叙事仍比上次更新更可信。
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
      - number: '4.3'
        title: 资金充裕度与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              2026 年 5 月融资让 Rapido 的资金状况更有支撑：公司以 $3 billion 估值融资 $240 million，另有涉及 $730 million 的更大规模交易，也多次谈到 IPO
              筹备。这些信息显示，公司或有足够资金，也能继续获得资本市场支持以推动扩张。但公开资料没有给出确切现金余额、现金跑道或准确的抽成率 /
              ARPU。对资金充裕度只能作方向判断：增长前景足够清晰，披露却不足以支持精确的投资测算。私营公司定期更新可以接受这种透明度，但尽调门槛仍然较高。缺的不是一个孤立数字，而是从增长势头到实际流动性状况之间的完整衔接。
            claimRefs:
              - CI006
              - CI007
              - CI008
