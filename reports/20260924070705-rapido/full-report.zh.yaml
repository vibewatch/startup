  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争态势
        blocks:
          - type: paragraph
            body: >-
              Uber 和 Ola 仍是 Rapido 的直接对手；在配送和外卖领域，它也正与消费者关注度更高的 Swiggy、Zomato 争夺市场。公开报道已反复将 Rapido
              列为主要出行平台，而非小众摩托车出租初创公司。竞争范围也从两轮车扩展到整个城市交通市场，包括网约车、三轮车，以及步行、地铁、公交和私家两轮车等现有选择。Rapido
              不只靠低价竞争，还要拼城市密度、路线经济性和牌照准备。
            claimRefs:
              - CP001
              - CP002
              - CP003
      - number: '3.2'
        title: 差异化与定价模式
        blocks:
          - type: paragraph
            body: >-
              Rapido 以平价和司机订阅制 / 零佣金模式区别于传统高抽佣平台。Google Cloud 案例和公司官网都把地图精度、路线智能及司机收入列为产品优势。乘客对价格敏感，这让 Rapido 有机会与
              Uber、Ola 拉开差异；Ownly 则以零佣金吸引商户，对标外卖巨头。关键在于，这些做法能否形成持久差异化，还是只带来大型对手也能承受的短期价格压力。
            claimRefs:
              - CP004
              - CP005
              - CP006
      - number: '3.3'
        title: 护城河持久度与反向证据
        blocks:
          - type: paragraph
            body: >-
              更持久的竞争风险是，其他平台可以复制 Rapido 的模式，监管也可能限制它。2026 年 Karnataka 裁决和 CCPA 处罚说明，分发优势能否延续，取决于法律许可空间和用户对界面的信任。Inc42 与
              The Company Check 的数据还显示，各来源对公司规模的统计不一，市场仍未看清 Rapido 当前的真实体量。简言之，Rapido 目前位置不错，但护城河靠运营和监管条件，而非传统 IP
              专有技术。低价加本地密度的模式仍有竞争力，前提是网络扩张和合规进展持续快过资金更雄厚、能补贴增长或将出行打包进更大生态的对手。
            claimRefs:
              - CP007
              - CP008
              - CP009
