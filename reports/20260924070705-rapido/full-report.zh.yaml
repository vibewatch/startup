  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面与业务流程
        blocks:
          - type: paragraph
            body: >-
              Rapido 更像一组相互衔接的业务流程，而不只是一款 App。官网和应用商店显示，它提供摩托车、三轮车和网约车服务，支持实时追踪、无现金支付和便捷叫车。企业产品为管理者提供专用钱包和发票记录；Ownly
              则依托同一物流网络，提供独立的外卖体验。对用户而言，价值不只是车费更低，还包括本地出行撮合更快、客服来电更少、路线更可靠。
            claimRefs:
              - CE001
              - CE002
              - CE003
      - number: '5.2'
        title: 架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              Google Cloud 客户案例是公开资料中最有力的技术证据。案例称，Rapido 接入 Google Maps Platform 出行服务，以改善行程追踪、派单、ETA
              质量和路线验证；乘客致电客服中心的比例从 5% 降至 1% 以下，追踪准确率则从约 60% 提升至约 95%。这说明 Rapido
              依赖位置智能技术栈，而非完全自研路线引擎。其运营模式由软件、双边撮合和地图服务依赖共同支撑；平台信任与派单质量也直接受地图精度影响。
            claimRefs:
              - CE004
              - CE005
              - CE006
      - number: '5.3'
        title: 信任、安全与路线图
        blocks:
          - type: paragraph
            body: >-
              App Store 和 AppBrain 页面显示，Rapido 的消费者覆盖面很广，也会收集位置和通讯录数据；隐私与信任因此也是产品体系的一部分。应用商店介绍了安全功能、实时追踪、PIN
              验证和多语言支持。公司推出 Ownly
              和企业产品，也显示业务路线正向出行以外扩展。产品线越多，故障、合规和定价混乱的风险面越大；如果技术和信任管控经得住考验，底层能力也有机会发挥更大效用。尽调要看的是，Rapido
              新增业务线时，内部管控能否同步跟上。
            claimRefs:
