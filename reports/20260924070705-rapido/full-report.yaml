  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and use cases
        blocks:
          - type: paragraph
            body: >-
              Rapido serves at least four customer groups: commuters who want cheap local rides, captains who supply the
              rides, corporate admins who manage employee travel, and merchants / restaurants who may route through
              Ownly. The customer proof is now stronger than in prior refreshes because the product has visible app
              ratings, download counts, and a named Google Cloud case study showing how improved routing and tracking
              translated into lower support burden and better retention. Still, the company has not published a clean
              retention dashboard or a reliable active-user denominator, so the segment story is broader than the proof
              story.
            claimRefs:
              - CU001
              - CU002
              - CU003
      - number: '6.2'
        title: Adoption trajectory and named proof
        blocks:
          - type: paragraph
            body: >-
              Adoption appears real and large, but the proof is a mix of company-claimed and third-party-validated data.
              The App Store shows 2.9 million ratings and a 4.8/5 score, while AppBrain shows 240 million downloads and
              roughly 4.79/5 ratings. Google Cloud’s case study is the best named proof of operational value: Rapido
              used Maps Platform to improve tracking accuracy and reduce rider support calls. The app reviews also
              provide named positive and negative user evidence, which is useful because they show both convenience and
              friction. Taken together, the adoption picture is strong but not fully audited.
            claimRefs:
              - CU004
              - CU005
              - CU006
      - number: '6.3'
        title: Retention, concentration, and open questions
        blocks:
          - type: paragraph
            body: >-
              The most important customer gap is retention and concentration. Public sources do not disclose NRR, GRR,
              or account concentration in a way that supports a clean underwriting model. The company’s huge India
              exposure and city-by-city regulatory dependence mean that regional concentration matters even when the
              overall customer count looks large. For consumers, the risk is churn driven by reliability and pricing;
              for captains, the risk is switching to other platforms. For corporate users and restaurants, the risk is
              service-level consistency and pricing transparency. In other words, customer size is visible; customer
              durability is less visible. That uncertainty matters because the customer story is strong enough to
              attract attention, but not strong enough to underwrite durability without cohorts.
            claimRefs:
              - CU007
              - CU008
              - CU009
