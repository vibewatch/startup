  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Rapido has moved from an idea-stage mobility company to a genuinely scaled platform
              with multiple revenue lines, better operating leverage, and a fresh $3 billion valuation anchor. The
              anti-thesis is that its moat is not deeply proprietary, regulation can still cut into the core bike-taxi
              business, and disclosure is not good enough to underwrite cash, runway, and cap-table precision. If one
              believes the new mix of subscriptions, delivery, and corporate travel can keep growing while the legal
              regime improves incrementally, the stock-equivalent private valuation can still work. If one believes the
              regulatory and pricing risks dominate, it becomes a research-more case rather than a clean buy.
            claimRefs:
              - CV001
              - CV002
              - CV003
      - number: '8.2'
        title: Recommendation, confidence, and stance
        blocks:
          - type: paragraph
            body: >-
              The refresh still lands on a buy recommendation, but with only medium confidence and a high risk rating.
              The reason is simple: FY25 revenue growth and loss compression materially improved the evidence base,
              while the May 2026 financing reset the market value upward and showed investor appetite. At the same time,
              the CCPA penalty and state-level bike-taxi uncertainty prevent a higher conviction rating. The right
              framing is therefore “buy, but only if you can tolerate high policy and execution risk.” The valuation
              stance is fair rather than cheap because the $3 billion mark already prices in a lot of future success.
            claimRefs:
              - CV004
              - CV005
              - CV006
      - number: '8.3'
        title: Bull / base / bear cases and exit readiness
        blocks:
          - type: paragraph
            body: >-
              In the bull case, Rapido uses its multi-modal mix to keep growing fast, expand Ownly, and move closer to
              operating profitability before the IPO process. In the base case, it keeps scaling but needs more capital,
              and the valuation stays roughly in the fair range until public-market visibility improves. In the bear
              case, regulatory setbacks or pricing pressure compress growth and reduce the implied value of the May 2026
              round. The public evidence supports continued diligence, but not a false precision model; the exits to
              watch are IPO readiness, additional secondary liquidity, and whether the revenue mix can continue to
              improve without a hard reset in legal status.
            claimRefs:
              - CV007
              - CV008
              - CV009
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV005
              - CV006
