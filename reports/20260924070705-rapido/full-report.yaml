chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and scale
        blocks:
          - type: paragraph
            body: >-
              Rapido positions itself as India’s chosen intra-city mobility app rather than a niche bike-taxi service.
              The official site says the company was founded in 2015 by Rishikesh S R, Pavan Guntupalli, and Aravind
              Sanka, and now serves more than 10 million people with over 100 million safe rides completed. Independent
              profiles broaden the picture: the business now spans bike taxis, autos, cabs, parcel delivery, food
              delivery, and corporate travel, and public reporting places it at more than 400 cities with a very large
              driver network. The practical takeaway is that Rapido has moved from a single-product mobility wedge to a
              multi-modal consumer logistics platform.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO010
      - number: '1.2'
        title: Funding, ownership, and milestones
        blocks:
          - type: paragraph
            body: >-
              The latest financing round materially reset the company’s public valuation. Multiple independent reports
              describe a May 2026 $240 million raise led by Prosus, with WestBridge and Accel participating, at a $3
              billion post-money valuation. At the same time, CCI approvals for MIH/Prosus share acquisition and a
              separate CCI order closing a competition complaint show that Rapido is now a meaningful regulated-platform
              asset, not just a startup with consumer growth. The company is also preparing for an IPO process by the
              end of 2026, which raises the importance of capital structure, secondary sales, and governance readability
              for the next refresh.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.3'
        title: Open gaps and interpretation
        blocks:
          - type: paragraph
            body: >-
              The public record still leaves several diligence gaps open. Headcount estimates conflict sharply across
              sources, with one profile showing 660 employees in early 2025 and newer trackers showing roughly 5.7k by
              2026. Revenue also varies between sources, though the direction is consistent: FY25 was materially
              stronger than FY24, and losses narrowed. That combination supports the view that Rapido is scaling into a
              more investable operating model, but the company remains opaque on board composition, cap table detail,
              monthly active users, exact take rates, and the full mechanics of its post-IPO path. Those missing items
              remain the most important follow-up questions.
            claimRefs:
