  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape
        blocks:
          - type: paragraph
            body: >-
              Rapido’s direct competition remains Uber and Ola, with the company also pressing into delivery and food
              where Swiggy and Zomato dominate consumer attention. Public reporting now repeatedly frames Rapido as a
              major mobility player rather than a niche bike-taxi startup, which means its competitive set has expanded
              from two-wheelers to the full spectrum of urban transport, including cabs, autos, and the status quo of
              walking, metro, buses, and private two-wheelers. That matters because Rapido’s edge is not only pricing;
              it also relies on city density, route economics, and permit readiness.
            claimRefs:
              - CP001
              - CP002
              - CP003
      - number: '3.2'
        title: Differentiation and pricing model
        blocks:
          - type: paragraph
            body: >-
              Rapido differentiates on affordability and a driver subscription / zero-commission framing rather than a
              classic commission-heavy marketplace. The Google Cloud case study and company pages show that maps
              accuracy, route intelligence, and supply-side earnings are central to the product story. Against Uber and
              Ola, that matters because the buyer is price-sensitive; against food-delivery incumbents, it matters
              because Ownly’s zero-commission offer is positioned as a merchant-friendly wedge. The moat question is
              whether these moves create durable differentiation or merely temporary pricing pressure that larger rivals
              can absorb.
            claimRefs:
              - CP004
              - CP005
              - CP006
      - number: '3.3'
        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The most durable competitive risk is that Rapido’s model can be copied by other platforms or constrained
              by regulators. The 2026 Karnataka and CCPA events show that distribution advantages are only as durable as
              the legal envelope and interface trust behind them. Inc42 and The Company Check also show that scale
              metrics are still inconsistent across sources, which suggests the market is still deciphering what the
              company really is at this size. In short: Rapido appears well-positioned, but the moat is operational and
              regulatory rather than proprietary in the classic IP sense. That matters because a price-led, locally
              dense model can still be strong, but only if density and compliance keep outrunning larger rivals that can
              subsidize growth or bundle transport into broader ecosystems.
            claimRefs:
              - CP007
              - CP008
              - CP009
