  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Rapido’s revenue model is now mixed rather than single-threaded. Bike taxis remain the core transport
              product, but autos and cabs increasingly use a subscription model, while Ownly adds delivery fees and
              restaurant economics. Corporate partners use a wallet-based travel management flow. That means the company
              is monetizing through platform services, subscription income, advertising, and logistics-related charges
              rather than a classic commission-only ride-hailing model. The useful diligence question is not whether
              revenue exists; it is whether the mix is broadening enough to offset pricing pressure and regulatory
              uncertainty while preserving capital-efficient growth.
            claimRefs:
              - CI001
              - CI002
              - CI003
      - number: '4.2'
        title: Public financial results and cost signals
        blocks:
          - type: paragraph
            body: >-
              The best public financial anchor remains FY25, where external reporting based on statutory data says
              revenue grew 44% to roughly ₹934-1002 crore and the net loss narrowed to about ₹258 crore. ET adds that
              Ebitda loss narrowed sharply to ₹104 crore and staff and marketing costs still remained large, which is
              consistent with a company in a heavy expansion phase. The picture is not profitable in the durable
              operating sense, but it does show meaningful operating leverage. That makes the capital story more
              credible than in the prior refresh, even if the exact numbers differ slightly by source.
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
      - number: '4.3'
        title: Capital adequacy and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The May 2026 financing gives Rapido a much stronger balance-sheet narrative. A $240 million round at a $3
              billion valuation, together with a broader $730 million transaction and repeated IPO preparation
              commentary, suggests the company has enough capital and market access to continue scaling. However, no
              public source gives a clean cash balance, runway number, or precise take-rate / ARPU picture. On the
              capital-adequacy question, therefore, the right answer is directional rather than exact: more than enough
              visibility for growth, not enough disclosure for precise underwriting. That is fine for a private-company
              refresh, but it keeps the diligence bar high. The gap is not just a missing number; it is the missing
              bridge between growth momentum and a real liquidity model.
            claimRefs:
              - CI006
              - CI007
              - CI008
