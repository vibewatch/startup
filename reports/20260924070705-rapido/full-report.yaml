  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              The biggest risk remains that Rapido’s operating model depends on permissions that can shift city by city
              or state by state. Karnataka’s 2026 bike-taxi ruling improved the outlook, but the state still argues the
              service needs tighter regulation and the matter remains legally alive. Tamil Nadu remains far less
              favorable, while the CCPA penalty shows that consumer-protection scrutiny is also real. Put simply, Rapido
              has not escaped regulatory friction; it has only moved from a blanket-uncertainty stage to a more
              granular, still-contested regime. For investors, that means the legal risk is lower than before, but still
              a first-order thesis variable.
            claimRefs:
              - CR001
              - CR002
              - CR003
      - number: '7.2'
        title: Operational and platform risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Rapido depends on mapping quality, dispatch integrity, support handling, and a large
              distributed captain network. The Google Cloud case study is actually a positive signal because it shows
              support calls fell and tracking improved when the maps stack was upgraded. But that also reveals the
              fragility: when routing or pricing is off, user frustration spikes quickly. App reviews show real
              complaints around cancellations, pricing, and support, which is what you would expect in a dense,
              real-time, two-sided marketplace. The operational question is therefore not whether friction exists; it is
              whether the platform can keep friction below the level at which users and captains switch away.
            claimRefs:
              - CR004
              - CR005
              - CR006
      - number: '7.3'
        title: Dependency and financial risk
        blocks:
          - type: paragraph
            body: >-
              Rapido also has hard dependency risk. It relies on external map services, on a supply base that can
              multi-home, and on capital access that remains necessary even after the latest financing. The company’s
              financing round helped, but the public record still does not show cash, runway, or a formal cash-flow
              bridge. Meanwhile, the price-sensitive nature of the market means small changes in fares, commissions, or
              incentives can materially move both rider demand and captain supply. That is why the company’s financial
              risk is less about near-term insolvency and more about margin compression, market-share defense, and
              policy-driven loss of optionality. The result is a risk stack that is legible to investors but still
              difficult to model with precision.
            claimRefs:
              - CR007
              - CR008
              - CR009
