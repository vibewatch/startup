chapter:
  number: 2
  title: Market Analysis
  summary: Rapido operates across urban mobility, last-mile logistics, and food delivery
    in India, where congestion, affordability, and permit friction shape adoption
    and limit clean TAM sizing.
sections:
- id: market-boundary
  title: Market boundary and use cases
  body: 'The relevant market is not a single ride-hailing category. Rapido sits at
    the intersection of intra-city mobility, first-mile / last-mile transport, parcel
    delivery, and now food delivery. The official and third-party materials point
    to a broad but still India-specific operating envelope: bike taxis, autos, cabs,
    corporate travel, and adjacent logistics. That matters because the company’s valuation
    case depends on how much of urban transport spending can migrate from fragmented,
    informal or incumbent solutions into app-mediated, low-price services. It also
    means the right sizing lens must include both consumer commuting and broader local
    logistics use, not just bike taxis.'
  claimRefs:
  - CM001
  - CM002
  - CM003
- id: buyers-and-adoption
  title: Buyer, user, and adoption path
  body: 'Rapido’s primary buyer is the commuter seeking cheap, fast intra-city transport;
    the user is the rider or passenger; the payer can be the same person, a corporate
    wallet, or a restaurant/customer in delivery flows. On the supply side, captains
    are also economic participants, because Rapido’s subscription / zero-commission
    framing is as much about driver economics as rider pricing. Adoption is driven
    by congestion, affordability, and easy app access, while constraints include state-level
    regulation, trust, and service reliability. The customer chapter adds proof that
    ratings and review velocity are strong, but the market-analysis point is simpler:
    the product lands where current transport is too slow, too expensive, or too informal.'
  claimRefs:
  - CM004
  - CM005
  - CM006
- id: sizing-and-constraints
  title: Sizing, constraints, and diligence gaps
  body: 'Public data supports large scale but not a clean TAM/SAM/SOM split. Company
    and partner sources describe 100+ to 400+ cities, 45 million monthly rides in
    older customer material, and more than 1 billion cumulative rides, while new expansion
    into food delivery widens the spend pool. Those numbers indicate that Rapido has
    a real large-market thesis, yet they do not provide an investable market size
    without further boundary work. The more important constraint is regulatory fragmentation:
    bike taxis remain state-sensitive, and the market can tighten or expand on a state-by-state
    basis. That makes the market opportunity attractive, but policy-risk adjusted.'
  claimRefs:
  - CM007
  - CM008
  - CM009
