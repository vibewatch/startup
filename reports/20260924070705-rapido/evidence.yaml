evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: >-
      A primary disclosure or consistent third-party source that reconciles whether current headcount is closer to 660,
      5.7k, or another range.
    whyItMatters: Headcount is a core scaling metric and feeds diligence on operating leverage, service quality, and IPO readiness.
    diligencePath: Reconcile company filings, LinkedIn headcount trends, and any official workforce disclosures in the next refresh.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: cap-table
    missingEvidence: A complete cap table or investor rights summary after the May 2026 financing and Swiggy secondary.
    whyItMatters: >-
      Dilution, liquidation preferences, and voting control determine how much of the headline valuation is relevant to
      investors.
    diligencePath: Use future ROC filings, shareholder disclosures, or direct company statements to map the cap table.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: TAM
    missingEvidence: A third-party mobility market study that cleanly isolates Rapido’s addressable spend in India.
    whyItMatters: Investment sizing needs a market lens that is not just company usage metrics.
    diligencePath: Search analyst or industry reports that break out bike taxi / ride-hailing / delivery spend by city tier.
    relatedQuestionRefs:
      - QM006
      - QM008
  - type: missing-source
    severity: minor
    topic: competitor pricing
    missingEvidence: Current direct pricing pages for Uber and Ola in the same cities used for Rapido comparisons.
    whyItMatters: Comparable list pricing would sharpen the competitive differentiation analysis.
    diligencePath: Fetch current city-specific pricing pages in the next refresh.
    relatedQuestionRefs:
      - QP006
      - QP008
  - type: missing-source
    severity: material
    topic: cash and runway
    missingEvidence: A current cash-balance statement or other source that lets the report estimate runway.
