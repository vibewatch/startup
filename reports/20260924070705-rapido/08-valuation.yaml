- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - 'Thesis: scale and loss compression are real'
    - If FY25 or later filings showed deterioration, the buy case would weaken
  - - 'Anti-thesis: regulation and UX enforcement remain live'
    - If multiple states or the CCPA moved against Rapido again, the stance would
      shift down
  - - 'Thesis: multi-line monetization broadens the company'
    - If Ownly or corporate travel stalled, the expansion story would weaken
  - - Capital adequacy
    - If cash burn rose or runway shortened, the buy case would weaken
  notes: The view changes are phrased as diligence triggers because the business is
    still private and partially opaque.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV006
- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Ownly scales, IPO prep continues, regulation stabilizes
    - Higher multiple on better mix and profitability
    - Policy shocks still possible
    - medium
  - - Base
    - Growth persists but losses remain meaningful
    - Fair value around the current private mark
    - Capital needs and competition
    - high
  - - Bear
    - Bike-taxi or UX enforcement worsens
    - Multiple compression and delayed exit
    - Regulatory setbacks
    - medium
  - - Optionality
    - Ownly and corporate travel
    - Broader mix could support a higher multiple
    - Policy risk still dominates
    - medium
  notes: Scenario values are deliberately qualitative because the public evidence
    does not support a defensible single-point DCF.
