  topStrengths:
    - 对一家刚公开露面的临床阶段生物科技公司而言，Series A 资本底子异常厚
    - 先打狼疮的核心资产清晰，可见 Phase 2 催化剂，也有 Fast Track 支持
    - 多资产平台比单项目初创公司留出更多可选路径
    - 管理层经验丰富，Bain Capital 和 Bristol Myers Squibb 撑起赞助方生态
    - 产品叙事落在具体机制上，不是泛泛的生物科技营销
  topRisks:
    - 公开来源没有披露估值、股权结构表、烧钱速度、现金跑道或保留资产经济性
    - 近期逻辑高度押注 afimetoran 及其狼疮读数
    - 生产、CMC 和质量体系细节大多仍属私有
    - 即便 Series A 规模很大，未来融资风险依然真实存在
    - 客户验证仍来自临床和伙伴推动，而非商业化
    - 如果太多项目缺少严格分诊就一起推进，平台可能摊得过开
  unresolvedGaps:
    - 投后估值、每股价格和清算优先权没有公开
    - 现金余额、分职能烧钱速度和现金跑道没有公开
    - 与 Bristol Myers Squibb 的资产级版税、里程碑和治理经济性没有公开
    - 生产准备度、GMP 细节和 CMC 放大计划没有公开
    - 未来市场准入、患者中心服务和商业化建设计划没有公开
