summary:
  headline: |
    Beeline 看起来是一家实力不弱的私有免疫学公司，先打狼疮，资本充足、机制可信，也有多条命中路径；但当前更合适的结论仍是继续研究，因为公开证据尚未披露估值、股权结构表、烧钱速度，或支撑价格判断所需的保留资产经济性。
