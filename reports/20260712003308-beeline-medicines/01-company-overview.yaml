company:
  name: Beeline Medicines
chapter:
  number: 1
  title: Company Overview
  summary: 'Beeline Medicines emerged publicly in April 2026 as an unusually well-financed clinical-stage autoimmune biotech built around five Bristol Myers Squibb assets and a SpringWorks-heavy leadership team. By June 2026 it had expanded its Series A to $426.3 million, giving the company enough disclosed capital to push afimetoran toward pivotal lupus development while broadening the rest of the pipeline. The main diligence caveats are familiar but important: public valuation, cash burn, and formal governance details remain undisclosed, and the public narrative still leans heavily on afimetoran despite the broader platform claim.'
sections:
- id: identity-stage-and-portfolio
  title: Identity, stage, and portfolio definition
  body: 'Beeline Medicines is not a discovery concept with one lab-stage asset; it arrived publicly on April 15, 2026 as a clinical-stage autoimmune biotech already stocked with five Bristol Myers Squibb programs and a $300 million Series A. Bain Capital''s launch release and the joint launch announcement frame the company as a precision-therapy builder for autoimmune and inflammatory disease, while the public homepage itself is narrower and almost entirely centered on afimetoran. That split matters for diligence: the company markets a multi-asset future, but its most concrete public identity today is still the lead lupus program.


    Beeline''s portfolio description is unusually advanced for a newly unveiled startup. Launch materials describe three clinical-stage assets and two earlier-stage biologics, with afimetoran already in Phase 2 for systemic lupus erythematosus, BLN-326 active across lupus and atopic dermatitis studies, and lomedeucitinib carrying prior psoriasis proof-of-concept from Bristol Myers Squibb. The business model is therefore pre-commercial but not preclinical: Beeline is trying to take de-risked immunology programs through pivotal development and, by management''s own telling, ultimately through pricing and commercialization rather than defaulting immediately to licensing.


    Location disclosure is less tidy than product-stage disclosure. Public releases use Stamford, Connecticut and Boston datelines, but retained sources do not clearly identify one city as the sole headquarters. For investors, that means the most defensible statement today is that Beeline operates out of a northeastern U.S. biotech corridor with a dual-base public footprint rather than a crisply disclosed single headquarters address.'
