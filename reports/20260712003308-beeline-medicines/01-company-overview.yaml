  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-terms
    missingEvidence: Exact post-money valuation, ownership split, liquidation preferences, and option-pool structure for both the April 2026 launch round and June 2026 extension.
    whyItMatters: Without round terms, investors cannot translate Beeline's unusually large capital raise into an entry price or dilution-overhang view.
    diligencePath: Request the latest cap table, stock purchase agreement, investor rights agreement, and board-approved option-pool schedule.
    relatedQuestionRefs:
    - QO017
    - QO021
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, trial-by-trial budget, and runway assumptions after the June 2026 extension.
    whyItMatters: Capital adequacy is a central underwriting issue because Beeline is funding several expensive clinical programs at once.
    diligencePath: Request monthly cash bridge, 24-month operating plan, and asset-level development spend assumptions.
    relatedQuestionRefs:
    - QO024
  - type: missing-source
    severity: minor
    topic: governance-process
    missingEvidence: Board committee structure, independent-director roles, reserved matters, and succession planning documentation.
    whyItMatters: Named directors alone do not show how sponsor influence is balanced or how decisions escalate beyond the CEO and board chair.
    diligencePath: Request board committee charters, governance guidelines, and an updated board/committee roster.
    relatedQuestionRefs:
    - QO020
    relatedTableRefs:
    - TO002
    - TO003
  - type: missing-source
    severity: minor
    topic: headquarters-footprint
    missingEvidence: A formal corporate address, office count, and current organization chart that distinguish headquarters from satellite functions.
    whyItMatters: The company's public Stamford/Boston datelines create ambiguity around where core functions sit and how the organization is distributed.
    diligencePath: Request legal-entity records, office leases, and an org chart by function and geography.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO004
