  title: Product & Technology
summary: Beeline's product story is a mechanism-led autoimmune pipeline built around clinically differentiated assets rather than a single commercial product. Afimetoran anchors the platform with an oral TLR7/8 lupus program that the company argues can modulate upstream immune drivers; BLN-326 and lomedeucitinib broaden the platform into Treg biology and TYK2; and BLN-481 plus BLN-498 extend the architecture into earlier biologic programs. The technical diligence question is therefore less about software-style feature breadth and more about whether the company has assembled a coherent, regulator-ready development system that can translate selective mechanisms into durable clinical proof.
sections:
- id: asset-stack-and-user-workflow
  title: Asset stack and user workflow
  body: 'Beeline''s deliverable is a pipeline of precision therapies that fit into specialist autoimmune care rather than a single current commercial product. Public materials consistently describe five assets sourced from Bristol Myers Squibb: afimetoran for lupus, BLN-326 for lupus and atopic dermatitis, lomedeucitinib for psoriasis and future rare autoimmune conditions, BLN-481 in planned first-in-human work, and BLN-498 in preclinical development. The user workflow is therefore clinician-centered. Rheumatologists, dermatologists, nephrologists, investigators, and eventually patients interact first through trial enrollment and specialist evaluation, not through direct self-service product use.


    Afimetoran dominates the current workflow story because the homepage and launch materials are explicit that Beeline is leading with lupus and positioning the program as a once-daily oral option that could fit more naturally into patient lives. BLN-326 introduces a different workflow, because the cited trial materials discuss intravenous or subcutaneous administration in lupus and atopic dermatitis. Lomedeucitinib keeps the oral convenience theme alive, but in a TYK2 and psoriasis context rather than a lupus-first one. As a result, the company is not building one standard operating model; it is building a mixed-modality development platform whose future user experience will vary materially by asset.'
