  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: CMC-and-manufacturing
    missingEvidence: Manufacturing partners, GMP status, release-testing approach, and scale-up readiness by asset.
    whyItMatters: Clinical promise is not enough if CMC readiness lags pivotal or launch plans.
    diligencePath: Request asset-level CMC plan, manufacturing map, comparability strategy, and GMP inspection history.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE004
    - TE005
  - type: missing-source
    severity: material
    topic: pharmacovigilance-and-quality-metrics
    missingEvidence: Public quantitative safety-operations metrics, deviation rates, or product-quality KPIs.
    whyItMatters: Without those metrics, the public trust surface remains more procedural than operational.
    diligencePath: Request SOP summaries, DSUR / safety-governance materials, and product-quality dashboards.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: professional-society-depth
    missingEvidence: A richer public set of conference posters, KOL presentations, or translational publications for the broader pipeline beyond afimetoran.
    whyItMatters: Practitioner-community signals help judge whether the company's mechanistic story is resonating beyond its own press materials.
    diligencePath: Collect conference abstracts, posters, and authored talks for BLN-326, lomedeucitinib, BLN-481, and BLN-498.
    relatedQuestionRefs:
    - QE019
    relatedTableRefs:
    - TE003
