  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cash-burn-runway
    missingEvidence: Current cash balance, monthly burn, and board-approved runway model.
    whyItMatters: These three variables determine whether the existing Series A is sufficient to reach the next financing or approval milestone without pressure.
    diligencePath: Request the latest balance sheet, trailing four-quarter burn, and runway case through afimetoran readout and pivotal planning.
    relatedQuestionRefs:
    - QI011
    - QI012
    - QI013
    relatedTableRefs:
    - TI003
    - TI004
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Share count, post-money valuation, liquidation preferences, anti-dilution terms, and any side letters.
    whyItMatters: A recommendation on valuation quality is impossible without knowing the actual entry price and preference overhang.
    diligencePath: Request signed financing documents, current cap table, and any strategic-investor governance rights.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: minor
    topic: future-pricing-architecture
    missingEvidence: Public product-pricing framework, gross-to-net assumptions, and margin bridge for afimetoran or later assets.
    whyItMatters: Comparator sales prove category value, but they do not reveal what Beeline itself could retain economically.
    diligencePath: Request management's launch-pricing assumptions, payer-access plan, and CMC cost curve by asset.
