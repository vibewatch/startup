- id: pricing-comparables-and-commercial-benchmarks
  title: Pricing comparables and commercial benchmarks
  body: 'Because Beeline does not yet sell approved products, pricing analysis has to rely on comparator economics and on what is missing from public disclosures. The retained sources do not provide a public Beeline price list, net price, reimbursement schedule, or recognized revenue stream for afimetoran, BLN-326, or lomedeucitinib. What they do provide is evidence that the eventual prize can be meaningful. GSK''s annual report shows Benlysta at £1.773 billion of 2025 sales, Aurinia reported $271.3 million of 2025 Lupkynis net product sales with 2026 growth guidance, and AbbVie reported $8.304 billion of Rinvoq revenue within a $30.406 billion immunology franchise.


    These figures should not be treated as Beeline forecasts. Instead, they show the two-sided nature of the financial story. First, approved autoimmune brands can become large, durable assets. Second, companies that reach that state typically carry major commercial infrastructure, patient-support spending, medical affairs, and payer-management obligations. Beeline has not yet provided list-price policy, rebate assumptions, or margin structure, so current valuation work has to rely on comparable market attractiveness rather than on company-specific price realization.'
