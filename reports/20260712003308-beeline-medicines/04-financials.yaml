- id: capital-base-and-near-term-uses
  title: Capital base and near-term uses
  body: 'Public evidence is much stronger on capitalization than on operating metrics. Bain''s launch announcement said the initial $300 million Series A would support operations into late-stage clinical development. The June 30 extension then added $126.3 million from existing shareholders and investors, bringing the total Series A to $426.3 million. Company and independent coverage align that this capital is being aimed at afimetoran''s pivotal preparation and multiple trial initiations across the rest of the pipeline over the next twelve months.


    Those uses imply a very real burn profile even if management has not disclosed the exact monthly number. Afimetoran alone requires Phase 2 completion and pivotal-development preparation. BLN-326 is being studied in both lupus and atopic dermatitis. The extension release also says lomedeucitinib and BLN-481 are expected to enter additional studies, while BLN-498 remains in preclinical development. CEO Saqib Islam told Fierce that all of these trials will be expensive and that the current capital does not remove the need to raise money forever. The right interpretation is that Beeline has unusually strong private capitalization for its stage, but the use-of-proceeds plan is equally ambitious.'
