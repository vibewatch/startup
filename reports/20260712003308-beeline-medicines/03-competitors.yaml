  - - Portfolio optionality
    - Multiple assets let Beeline pivot if one program disappoints.
    - Beeline
    - Medium positive
    - Request capital-allocation framework across assets and kill criteria.
  - - TYK2 class crowding
    - A validated class can shrink future whitespace.
    - SOTYKTU / BMS
    - High
    - Request clearer lomedeucitinib niche selection and differentiation plan.
  - - Lifecycle management by incumbents
    - Self-injection and label expansion can neutralize convenience or scope arguments.
    - Saphnelo / BMS / AbbVie / GSK
    - High
    - Monitor new approvals, new routes, and label-expansion timing.
