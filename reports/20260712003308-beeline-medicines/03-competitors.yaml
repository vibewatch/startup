- id: moat-durability-and-thesis-breaks
  title: Moat durability and thesis-breaks
  body: 'Beeline''s moat today is mostly prospective. It has sponsor capital, multiple shots on goal, and mechanisms that could still prove differentiated. It does not yet have approved labels, product revenue, durable payer contracts, or a demonstrated support ecosystem. That means moat durability depends first on clinical proof and label sequencing, not on commercial scale. If afimetoran shows clearly compelling data or BLN-326 opens a differentiated Treg lane, Beeline can still change the map. If the data are merely good, incumbents may be better positioned to absorb the threat.


    The most important thesis-breaks therefore come before launch, not after it. Saphnelo self-injection already reduced a simple IV-versus-oral convenience narrative. SOTYKTU''s continued TYK2 expansion can narrow future lupus or dermatology whitespace. And if incumbent support systems keep specialists and payers comfortable, Beeline may need a larger efficacy delta than the market currently assumes.


    The competitor verdict is therefore mixed but constructive: Beeline has enough mechanistic and capital credibility to matter, but it is entering fields where scale, access, and label breadth are already defended by formidable incumbents.'
