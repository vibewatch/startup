    - High
    - Ask for Beeline's target product profiles and trial designs versus incumbent endpoints.
  - - Oral convenience
    - Can improve fit and patient preference if efficacy holds.
    - Beeline afimetoran and lomedeucitinib; also Lupkynis and SOTYKTU
