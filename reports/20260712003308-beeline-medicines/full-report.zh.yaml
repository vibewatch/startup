  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与疾病负担
        blocks:
          - type: paragraph
            body: >-
              Beeline 的市场最好理解为专科免疫切口，而不是泛自身免疫 TAM。公司先点名狼疮，但也借 BLN-326 和 lomedeucitinib
              进入特应性皮炎、银屑病，以及未来罕见自身免疫或炎症细分场景。因此，第一步应按适应症和治疗场景界定边界。最窄口径下，afimetoran 竞争的是系统性红斑狼疮市场；CDC 估计美国约 204,000 人患有
              SLE。放到更宽的狼疮框架里，Lupus Foundation 估计 1.5 million 名美国人患有某种形式的狼疮，其中 SLE 约占 70%，且女性占比显著更高。


              皮肤科相邻市场的患病率要大得多。National Eczema Association 材料称，美国有超过 9.6 million 名儿童和约 16.5 million 名成人患有特应性皮炎，其中 6.6
              million 名成人为中重度疾病。National Psoriasis Foundation 称，美国超过 8 million 人患有银屑病。这些更大的疾病池不会自动转化为 Beeline
              可启动市场，但解释了为什么 BLN-326 和 lomedeucitinib 会显著抬高战略上限，相比纯狼疮单资产公司不同。


              实际结论是，患病率应被当作分层证据，而不是销售预测。狼疮给 Beeline 一个更清晰、更紧迫的初始目标；皮肤科和罕见自身免疫扩张提供上行叙事。任何直接从广义自身免疫负担跳到标题式 TAM
              的投资人，都会高估今天公开证据真正能支撑的范围。
