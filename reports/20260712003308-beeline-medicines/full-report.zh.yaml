      - number: '3.3'
        title: 准入、包装与分销对比
        blocks:
          - type: paragraph
            body: >-
              Beeline 与竞争对手之间最清晰的不对称之一，是商业管线铺设。既有品牌卖的不只是分子，也卖支持系统。Benlysta 推广共同支付支持，Saphnelo 强调支持资源和多种给药路径，Lupkynis 提供
              Aurinia Alliance 护士支持，Rinvoq 把患者导向 AbbVie 准入资源，SOTYKTU
              则宣传品牌化支持项目。这些不是装饰性附加项。它们说明，专科免疫竞争会在临床数据之外，靠包装、导航和报销协助一起打。


              这会影响如何比较 Beeline 的“定价”。已审阅公开来源没有提供覆盖全场的统一 WAC
              或净价数字，因此更站得住的比较是公开准入姿态：给药路径、频率、支持，以及每个品牌似乎预期摩擦会出现在哪里。按这个镜头看，既有玩家今天领先很多。Beeline
              未来如果拿到商业优势，更可能来自更简单的使用方式或更好疗效，而不是来自它目前还没有理由搭建的、类似既有玩家的支付方基础设施。


              因此，投资人应把 Beeline 当前位置理解为商业化前挑战者：产品画像可能优雅，但还没有公开证据证明它的包装和准入栈能够匹敌获批品牌。
