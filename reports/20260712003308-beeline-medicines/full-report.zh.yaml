companyProfile:
  summary: >
    Beeline Medicines 是一家由发起方搭建的免疫生物科技公司，正在开发五项面向自身免疫和炎症性疾病的资产管线。当前公开叙事围绕 afimetoran 展开：这是一款每日一次口服 TLR7/8
    抑制剂，正推进用于狼疮；管线还包括用于狼疮和特应性皮炎的 BLN-326、用于 TYK2 相关炎症性疾病的
    lomedeucitinib，以及两个更早期的生物制剂项目。未来客户很可能是狼疮、皮肤科和罕见自身免疫场景里的专科医生、支付方和患者；眼下的证明面仍主要来自临床和合作伙伴，而不是商业化。
