        - 成熟度高得多，技术模态也不同
      - - argenx
        - 上市免疫学公司市值
        - $54.84B 市值（July 2026）
        - 展示聚焦免疫学成功的天花板
        - 商业化成熟度远高于 Beeline
      - - Regeneron
        - 大市值生物科技市值
        - $69.66B 市值（July 2026）
        - 证明生物学驱动的产品线可以放大到极大规模
        - 不适合作为近期倍数可比对象
    enumerationScope:
      coverage: sample
      basis: >-
        Sample spans focused lupus exposure, biotech operator precedent, and larger immunology or platform-biotech
        valuation frames rather than all peers.
    notes: 可比估值只是背景锚点，不是给一家尚未商业化的私营公司直接定价。
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
  - id: TV005
    title: 论点破裂与终止触发点表
    columns:
      - 触发点
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - Afimetoran 读出不及预期
        - 疗效偏弱、安全性意外，或没有清晰关键性试验路径
        - 打破狼疮优先溢价叙事
        - 从跟踪转为回避，除非价格大幅重置
      - - 承压融资
        - 强数据支持前就需要新增资金
        - 削弱估值议价力，加重稀释担忧
        - 要求下行保护，或等待
      - - CMC / 经济条款不透明延续
        - 临近下一道门槛时，仍无股权结构表、BMS 经济条款或生产路径清晰度
        - 阻断从好奇到确信的转换
        - 推荐维持继续研究
      - - 平台扩张过度
        - 推进资产过多，缺少清晰筛选
        - 降低对资本纪律的信心
        - 即使科学仍有看点，也降低确信度
    notes: 触发点刻意可衡量，推荐才能随证据移动。
    claimRefs:
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人或尽调路径
    rows:
      - - 股权结构表和本轮条款
        - 股数、每股价格、优先权、反稀释
        - 决定入场价是有吸引力，还是已经偏贵
        - 索取融资文件和当前股权结构表
      - - BMS 资产经济条款
        - 按资产列明特许权使用费、里程碑、治理和返还细节
        - 决定净留存价值和战略灵活性
        - 索取许可摘要和附函
      - - 现金跑道和资金消耗
        - 现金余额、按职能拆分的资金消耗、下行情形融资方案
        - 决定稀释和议价力风险
        - 索取最新预算和现金跑道模型
      - - CMC 和上市准备度
        - 生产路线图、质量体系、市场准入建设
        - 决定科学成立之后的执行风险
        - 索取 CMC 计划、质量材料和上市准备预算
    notes: 这些问题是从叙事判断转向可定价投资判断所需的最低材料包。
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV040
      - CV041
      - CV042
