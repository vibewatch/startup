    rows:
      - - 核心 SLE 治疗市场
        - 接受专科照护的成人 SLE 患者；品牌药和先进疗法
        - 未绑定 SLE 诊断的全部自身免疫患病人群
        - 风湿科医生；商业和政府支付方
        - afimetoran 的直接上市市场。
      - - 狼疮肾炎子市场
        - 肾脏受累的狼疮患者和肾保护疗法
        - 非狼疮肾病和移植药物
        - 风湿科医生、肾脏科医生、支付方
        - 重要的相邻支出池，也是口服狼疮治疗的竞争基准。
      - - 特应性皮炎系统治疗市场
        - 已从外用治疗升级的中重度 AD 患者
        - 无需系统性品牌药管理的轻度 AD
        - 皮肤科医生、支付方、专科药房
        - 与 BLN-326 相关，且按患病率看远大于狼疮。
      - - 银屑病 / TYK2 市场
        - 中重度银屑病，以及系统性口服 / 生物制剂治疗预算
        - 仅外用或轻度银屑病支出
        - 皮肤科医生、支付方
        - 是 lomedeucitinib 概念验证场景，也能验证 TYK2 类别。
      - - 罕见自身免疫扩展小众市场
        - 规模较小、由专科医生主导，且 Beeline 尚未公开点名的炎症适应症
        - 泛化的大自身免疫 TAM 叙事
        - 亚专科医生、孤儿病支付方
        - 可能带来更长期上行，但来源支撑还不足以精确测算。
    notes: 这张表把可上市的疾病市场和更宽的患病率叙事拆开，避免后续测算重复计算无关自身免疫支出。
