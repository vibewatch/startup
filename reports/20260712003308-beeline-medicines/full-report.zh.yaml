      - number: '2.3'
        title: 买方、用户、支付方与给药方式地图
        blocks:
          - type: paragraph
            body: >-
              买方地图会被疾病和给药路径切开。狼疮和狼疮性肾炎中，风湿科医生和肾脏科医生推动处方，但支付方和输注基础设施仍重要，因为领先产品往往配有支持、可负担性和治疗地点物流。特应性皮炎和银屑病中，皮肤科医生控制更多流程，但治疗阶梯仍受既往治疗失败、专科药房协调和可负担性项目约束。既有产品网站本身就把这些显出来：Benlysta
              强调共同支付支持，Saphnelo 提供输注中心导航和自我注射教育，LUPKYNIS 推出 Aurinia Alliance 护士支持，Rinvoq 则把患者导向 AbbVie 的准入协助。


              给药路径是真实的商业变量，不是外观差异。Afimetoran 被营销为每日一次口服；BLN-326 的狼疮研究使用静脉或皮下给药；Lupkynis 在狼疮性肾炎中为口服；Benlysta
              是生物制剂附加疗法；Saphnelo 现在同时覆盖输注和居家自我注射。因此，Beeline 的便利性优势，在它能用口服选项对比以输注为中心的护理时最强；若竞争对手已经用居家使用形态完成适配，优势就弱一些。


              实际结论是，Beeline 不会卖给一个统一预算负责人。它要进入专科处方习惯、支付方证据门槛和患者支持预期，而这些在狼疮、肾脏病和皮肤科之间差异很大。复杂性可管理，但会抬高临床差异化和市场准入规划的门槛。
