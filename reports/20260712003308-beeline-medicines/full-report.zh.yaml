      - number: '6.3'
        title: 耐久性、扩张与集中度
        blocks:
          - type: paragraph
            body: >-
              由于尚无披露的商业客户，耐久性必须通过集中度和路线图分析，而不是通过留存指标分析。Afimetoran 显然是第一个集中点：它主导主页、近期读出日历和公开启动叙事。Bristol Myers Squibb
              关系在结构上也一样，因为公司围绕转入的 BMS 资产成立，BMS 还保留股权经济权益。这些事实不会让客户故事变弱，但会让它更集中。


              如果公司能越过狼疮优先证明面，扩张仍有可能。BLN-326 把潜在用户群扩展到狼疮和特应性皮炎，lomedeucitinib
              最终也可能触达皮肤科和罕见自身免疫专科医生。但商业门槛已经看得见：既有品牌在支持、可负担性和患者导航上投入很大。这意味着 Beeline
              未来“先落地再扩张”的故事不只取决于适应症数量，也取决于公司能否围绕每种给药路径和疾病场景，搭出可信的专科、支付方和患者支持体验。
