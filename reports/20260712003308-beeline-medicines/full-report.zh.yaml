      - number: '5.3'
        title: 成熟度、路线图与开发依赖
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，管线成熟度有意义但不均衡。Afimetoran 看起来最靠前：公司和 BMS 试验材料引用了皮肤型狼疮 Phase 1b 概念验证、FDA 在系统性狼疮中的 Fast Track
              资格、正在进行的随机 Phase 2 SLE 研究，以及预期 2026 年读出后的关键性开发准备。BLN-326 更早，但仍已进入临床，在狼疮和特应性皮炎中有 Phase 1b 研究。Lomedeucitinib
              在银屑病中有阳性概念验证，并被定位为向罕见自身免疫扩张。BLN-481 和 BLN-498 仍早得多，更像路线图可选项，而不是近期产品表面。


              这些成熟度差异很重要，因为每项资产都依赖不同的执行链条。Afimetoran 取决于读出质量、监管策略，以及为潜在更广狼疮人群扩产的制造能力。BLN-326 取决于早期安全性、给药路径实用性，以及 Treg
              论点是否能显示足够临床信号来支持扩张。Lomedeucitinib 取决于在一个已被 SOTYKTU 商业验证的类别中找到空白。结果是一条有多次出手机会的路线图，但也有多套可能独立失败的依赖栈。
