  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 上市前的买方、用户与支付方地图
        blocks:
          - type: paragraph
            body: >-
              Beeline 仍处在商业化前，因此客户地图必须前瞻性定义。未来可能的用户是风湿科医生、皮肤科医生、肾脏科医生、临床研究者，以及狼疮、特应性皮炎、银屑病和潜在罕见自身免疫疾病患者。未来可能的支付方，是已经为
              Benlysta、Lupkynis、Saphnelo、Rinvoq 等品牌管理专科免疫准入的商业和政府计划。这些都不意味着 Beeline 今天已有活跃付费账户，但能界定临床数据成熟后最重要的利益相关方集合。


              给药路径会影响这张地图。Afimetoran 被定义为每日一次口服狼疮资产，一旦获批，可能指向相对广的专科和患者使用场景。BLN-326 引入更复杂的生物制剂递送流程，lomedeucitinib
              则在不同专科场景中重新带入口服全身治疗。合起来看，买方—用户—支付方栈是异质的：Beeline 不是卖给一个标准客户画像，未来采用负担会因资产和疾病而明显不同。
