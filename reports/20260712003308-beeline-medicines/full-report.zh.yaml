      - number: '7.4'
        title: 缓释、监控与终止标准
        blocks:
          - type: paragraph
            body: >-
              好消息是，Beeline 的大部分重大风险都可监控。投资人不需要随机猜测，可以盯具体事件。正面看，干净的 Phase 2 狼疮数据、清晰的关键性设计，以及更明确的 CMC
              或市场准入规划，都会实质降低不确定性。负面看，疗效含混、下一批研究启动滑坡，或在强读出前就需要融资，都会削弱投资论点。


              因此，正确的缓释姿态应绑定里程碑，而不是绑定个人。投资人应要求看到领衔资产进展的客观证明、平台分流纪律，以及足够透明的资本规划，以证明公司能在不被压力逼着即兴发挥的情况下跨过每个技术关口。如果这些指标改善，风险画像可以很快压缩。若没有改善，Beeline
              仍可能保持科学吸引力，但会在财务和战略上更难测算。
