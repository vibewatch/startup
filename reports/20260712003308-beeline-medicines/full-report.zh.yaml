      - number: '2.2'
        title: 当前支出与疗法基准
        blocks:
          - type: paragraph
            body: >-
              已获批产品的经济表现说明，Beeline 进入的是买方已经愿意为慢性免疫疾病控制支付可观金额的市场。在狼疮中，Benlysta 仍是最显眼的既有品牌，定位为活动性狼疮和狼疮性肾炎的附加疗法，GSK 报告其
              2025 年销售额为 £1.773 billion。Saphnelo 提供另一个品牌化狼疮选项，但自身面向消费者的定位强调更窄的获批用途：中重度 SLE，并明确排除重度活动性狼疮性肾炎和 CNS
              狼疮。Lupkynis 证明口服狼疮性肾炎疗法也能变现，只是当前规模更小：Aurinia 报告 2025 年净产品销售额 $271.3 million，并给出 2026 年 $305-$315 million
              的指引。


              皮肤科和更广免疫市场按支出口径更大。AbbVie 报告 2025 年免疫业务收入 $30.406 billion，仅 Rinvoq 收入就达 $8.304
              billion，凸显多适应症炎症业务版图在一个分子拿到多个标签并被支付方熟悉后可以长到多大。Bristol Myers Squibb 自己的 2025 年年报显示，SOTYKTU 已获批用于斑块型银屑病，并在追求
              SLE 和 Sjögren's disease 等更多用途；这对 Beeline 重要，因为 lomedeucitinib 也是 TYK2 路径故事。


              这些基准比供应商 TAM
              报告更能锚定市场分析。它们显示，市场确实愿意报销有差异化的自身免疫疗法；但也说明，每个子市场都有自己的天花板和竞争集。狼疮可以诞生重磅产品；狼疮性肾炎更小但仍有意义；皮肤科大得多，却拥挤且商业化成熟。
