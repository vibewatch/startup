      - number: '6.2'
        title: 当前证明面与商业采用的差距
        blocks:
          - type: paragraph
            body: >-
              当前最强证明面是临床参与，而不是商业部署。公开试验记录确认，afimetoran、BLN-326 和 lomedeucitinib
              位于正式研究工作流中，这说明研究者和研究网络愿意与这些项目互动。公开融资支持又提供另一类信号：Bain、Bristol Myers Squibb、CPP Investments 和管理层都在 afimetoran
              读出前追加资本。但这些仍是生态信心信号，不是付费客户指标。


              同样重要的是缺失内容。留存公开来源没有披露客户数量、活跃处方医生、卫生系统合同、支付方协议、治疗患者量、重复订单、使用率、满意度、NRR、GRR、流失或续约率。公司网站以信息和新闻稿为导向，而不是产品交易界面。正确读法是：Beeline
              拿到了利益相关方注意力和临床网络参与，但还没有商业采用的公开证明。
