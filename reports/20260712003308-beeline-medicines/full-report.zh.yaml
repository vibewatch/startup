      - number: '3.4'
        title: 护城河耐久性与投资论点击穿点
        blocks:
          - type: paragraph
            body: >-
              Beeline
              今天的护城河主要仍是前瞻性的。它有发起方资本、多次出手机会，也有仍可能证明差异化的机制。它还没有获批标签、产品收入、持久支付方合同，或已验证的支持生态。因此，护城河耐久性首先取决于临床证明和标签排序，而不是商业规模。如果
              afimetoran 拿出明确有说服力的数据，或 BLN-326 打开差异化 Treg 路径，Beeline 仍能改写地图。若数据只是不错，既有玩家可能更有能力吸收威胁。


              最重要的投资论点击穿点会在上市前出现，而不是上市后。Saphnelo 自我注射已经削弱了简单的“IV 对口服”便利性叙事。SOTYKTU 持续拓展
              TYK2，可能压窄未来狼疮或皮肤科空白。如果既有支持系统继续让专科医生和支付方感到舒适，Beeline 可能需要比市场当前假设更大的疗效差距。


              因此，竞争者结论是混合但建设性的：Beeline 具备足够的机制和资本可信度，已经值得关注；但它进入的领域里，规模、准入和标签宽度已被强势既有玩家防守。
