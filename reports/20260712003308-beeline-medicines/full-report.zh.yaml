  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 获批前的收入模式
        blocks:
          - type: paragraph
            body: >-
              Beeline 更应被理解为商业化前开发平台，而不是已经运营的商业业务版图。留存公开来源描述的是一家临床阶段生物科技公司，围绕五项来自 Bristol Myers Squibb
              的自身免疫资产搭建；afimetoran 正处于狼疮 Phase 2 开发，BLN-326 在 Phase 1b 研究中，lomedeucitinib
              准备追加工作，后面还有两个更早期的生物制剂项目。留存官方或独立来源都没有披露产品收入、客户收入、ARR、盈利能力或正在销售的产品组合。这个缺失符合阶段，但很重要，因为它意味着收入质量还不能用正常商业化指标判断。


              更稳妥的框架，是把当前经济和未来经济分开。当前经济是发起方资本、战略资产权利和运营支出。未来经济只有在获批或新业务开发交易之后才会出现，可能来自专科药销售、里程碑流入或合作结构。Business Wire
              启动公告在这里也重要，因为 Bristol Myers Squibb 保留近 20% 股权，加上特许权使用费和里程碑，说明 Beeline 未来总经济权益可能不等于未来净经济权益。因此，投资人不应把很大的
              Series A 误读为自我供血收入引擎的证据。
