      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              主要增长驱动很直接：专科自身免疫市场已经能支撑可观收入，前提是疗法能证明持久疾病控制、使用方式可落地，并给出支付方在意的结局。Benlysta 的规模、Lupkynis 的持续增长、Rinvoq
              数十亿美元轨迹都说明，市场会奖励有效、慢性、多年期治疗关系。Beeline
              还受益于进入有可见未满足需求的细分市场：狼疮仍高度偏女性、负担重、可威胁器官；狼疮性肾炎依旧严重；皮肤科仍有大量患者在不完美选项之间轮换。


              约束同样明显。标签排除、严重安全警告、既往治疗排序和准入支持项目都意味着采用从不无摩擦。Saphnelo 未获批用于重度活动性狼疮性肾炎；Rinvoq
              位于其他疗法失败或不被推荐之后；既有品牌也投入真实资源做共同支付和导航支持。对 Beeline 来说，一个临床上有意思的分子仍需要可信的市场准入故事。


              最重要的分析纪律，是抵住大品类乐观主义。公开证据支持一种嵌套机会观：Beeline 可能先在狼疮获胜，再借 BLN-326 或 lomedeucitinib
              选择性扩张，之后才检验组合能否复利成更广的免疫业务版图。这个市场起点很强，但不等于从第一天起就有一条保证通向重磅药的路。
