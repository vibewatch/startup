  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 狼疮竞争栈
        blocks:
          - type: paragraph
            body: >-
              Beeline 领衔资产 afimetoran 进入的是一个已经按标签、给药路径和疾病范围分层的狼疮市场。Benlysta 是最成熟的既有品牌，覆盖活动性狼疮和狼疮性肾炎，并有可观的 2025
              年销售额支撑。Saphnelo 是更聚焦的 SLE 竞争者，带着现代生命周期管理打法，现已包括自我注射；Lupkynis 的疾病范围更窄，但重要性在于它证明狼疮相关口服疗法可以商业化。因此，Beeline
              面对的不是一个单一巨型狼疮对手，而是一组既有玩家：它们合起来覆盖广义狼疮、SLE 专项疾病控制，以及狼疮性肾炎专项口服疗法。


              这个竞争栈很关键，因为 afimetoran
              的卖点不只是狼疮是一个大且未满足需求高的品类。真正卖点是，每日一次口服疗法可能把便利性和有意义的疾病控制结合起来，更早、更广地嵌入专科实践。公开来源支持给药路径和机制故事，但还没有显示与获批选项的头对头证据。在这些数据出现之前，Beeline
              的狼疮位置最好被看作战略上有吸引力，而不是商业上已证明。


              结论是，竞争场景有吸引力但要求高。未满足需求和已验证支出都看得见，但狼疮里的每个主要参照点已经拥有标签、支持基础设施，或两者都有。
