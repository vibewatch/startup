        - 商业与公共支付方
        - 需要持久皮肤应答和可耐受的长期治疗
        - Lomedeucitinib 必须在拥挤的口服 / 生物制剂格局中胜出。
      - - 罕见自身免疫细分领域
        - 按疾病划分的亚专科医生
        - 规模小、需求高的患者群
        - 专科支付方或孤儿病预算
        - 机制匹配度与试验可行性
        - 潜在定价权更高，但公开患者规模尚未披露。
