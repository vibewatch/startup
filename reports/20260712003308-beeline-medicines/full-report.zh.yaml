  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与临床风险
        blocks:
          - type: paragraph
            body: >-
              最重的风险仍是监管和临床。Afimetoran 尚未获批，公开故事高度依赖管理层预期可推动关键性开发的 Phase 2 SLE 读出。Fast Track
              资格提升了流程可见度，但不能替代阳性疗效、安全性或注册策略。BLN-326 仍处于 Phase 1b，lomedeucitinib 也还必须证明它能在一个已被别处商业验证的 TYK2 格局中赢在哪里。


              这点重要，因为 Beeline
              的公开证明面仍主要锚在机制和试验上。令人失望的读出可能不只是延迟一个资产：它还会削弱客户地图、融资杠杆和对整体组合架构的信心。反过来，强读出也不会消除风险；它只会把公司带入一组新的关键性、CMC
              和上市准备风险。因此，正确的监管视角是二元但分阶段：先是数据风险，其次是注册执行风险。
