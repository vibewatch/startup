      - number: '5.2'
        title: 机制架构与差异化
        blocks:
          - type: paragraph
            body: >-
              技术架构最好概括为：在多个已验证节点上选择性干预免疫通路。Beeline 自己的网站称，afimetoran 是选择性、口服、每日一次、等效力的小分子 TLR7 和 TLR8 抑制剂；这两个内体受体与 I
              型干扰素产生、炎症性细胞因子和自身抗体生成有关。主页还声称，阻断这些受体可以快速压低干扰素信号，并调节包括 B
              细胞在内的免疫细胞激活。每一种机制收益最终是否转化为临床结果仍待证明，但这套架构至少具体，不是空泛营销。


              BLN-326 围绕免疫再校准增加了第二层架构：公司称它是一种 IL-2-CD25 融合蛋白，目标疾病以 Treg 和效应 T 细胞失衡为特征。Lomedeucitinib 借口服变构 TYK2
              抑制增加第三层。合起来看，这三个领衔项目说明 Beeline
              不只是收集自身免疫资产；它在组装一个机制多样但免疫学逻辑一致的组合。若差异化站得住，它不是软件意义上的单一平台技术，而是一条开发论点：把选择性生物学，与可能显著影响专科采用的给药路径和适应症配在一起。
