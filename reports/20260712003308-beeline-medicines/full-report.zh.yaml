      - number: '3.2'
        title: 皮肤科与 TYK2 相邻市场
        blocks:
          - type: paragraph
            body: >-
              BLN-326 和 lomedeucitinib 扩大了 Beeline 的战略范围，也把公司推入更拥挤的市场。在特应性皮炎中，BLN-326 必须面对 Dupixent 在宽年龄段里的根深蒂固、Ebglyss
              更新的生物制剂存在感，以及 Rinvoq 在既往治疗失败后的口服全身治疗定位。这意味着 Beeline 不是进入皮肤科空白地带，而是选择了一个患者池很大、既有玩家投入同样很大的市场。


              Lomedeucitinib 面对的是另一种拥挤。SOTYKTU 已经验证了口服 TYK2 故事在银屑病中的商业吸引力，Bristol Myers Squibb 还在把它延伸到包括 SLE
              在内的更多自身免疫适应症。对 Beeline 来说，这既是好消息也是坏消息：好在类别已被验证，坏在一旦类别领导者定义了便利性基线和支持预期，差异化负担就会上升。


              这些相邻市场抬高了 Beeline 的长期上行，但也让竞争章节的重点从市场规模，转向 Beeline 还能在哪些地方拿出差异化的临床或准入切口。
