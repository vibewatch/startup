      - number: '1.2'
        title: 领导层集中度、董事会构成与治理图景
        blocks:
          - type: paragraph
            body: >-
              除 afimetoran 外，Beeline 最显眼的资产就是团队。Saqib Islam 从 SpringWorks Therapeutics 负责人直接转任 CEO；Beeline 自己的履历称，他带领
              SpringWorks 从创立、两次产品上市，一直到 2025 年被 Merck 以约 $3.9 billion 收购。总裁兼 COO Badreddin Edris、首席技术运营官 Kristin
              Patterson、首席人事官 Daniel Pichl 也都来自 SpringWorks；首席医学官 Nathalie Franchimont 则带来 Nimbus、Biogen 和 Amgen
              的免疫开发经验。管理层叙事很直接：这是一支已经完整跑过一次生物科技到商业化打法的团队。


              同一模式也带来真实的尽调提示。人才厚度够，但运营来源并不特别多元。多名关键高管是 SpringWorks 校友，董事长 Daniel S. Lynch 也有 SpringWorks 背景，多个董事席位属于
              Bain 和 BMS 阵营。公开点名董事包括 Bain 的 Nicholas Downing、Andrew Kaplan 和 Adam Koppel，BMS 首席研究官 Robert Plenge，以及后续加入的
              Martin Mackay。公司因此拿到很强的融资和药企连接，但战略影响力也集中在创建公司的发起方—投资方组合周围。


              公开材料还没有给出下一层治理细节。已审阅来源列出董事并概述履历，但没有说明董事会委员会、独立董事机制或正式治理流程。一家已经拿到 $426.3 million Series A
              的初创公司出现这个缺口并不致命，却会把治理从默认优势变成需要继续追问的事项。
