  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 资产栈与用户工作流
        blocks:
          - type: paragraph
            body: >-
              Beeline 交付的是一组嵌入专科自身免疫护理的精准疗法管线，而不是单一现成商业产品。公开材料持续描述五项来自 Bristol Myers Squibb 的资产：用于狼疮的
              afimetoran、用于狼疮和特应性皮炎的 BLN-326、用于银屑病及未来罕见自身免疫疾病的 lomedeucitinib、计划进入首次人体研究的 BLN-481，以及处于临床前开发的
              BLN-498。因此，用户工作流以临床医生为中心。风湿科医生、皮肤科医生、肾脏科医生、研究者，最终还有患者，首先会在试验入组和专科评估中互动，而不是直接使用自助式产品。


              Afimetoran 主导当前工作流故事，因为主页和启动材料明确显示，Beeline 以狼疮为先，并把该项目定位为每日一次口服选项，可能更自然地嵌入患者生活。BLN-326
              带来另一种工作流，因为引用的试验材料讨论的是在狼疮和特应性皮炎中静脉或皮下给药。Lomedeucitinib 延续口服便利性主题，但场景是 TYK2
              和银屑病，而不是狼疮优先。因此，公司不是在搭一个标准运营模型，而是在搭混合给药方式的开发平台；未来用户体验会因资产而显著不同。
