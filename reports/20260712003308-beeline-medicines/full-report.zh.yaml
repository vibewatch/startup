            body: >-
              因为 Beeline 还没有销售获批产品，定价分析只能依赖可比经济表现和公开披露中缺失的内容。留存来源没有提供 Beeline 针对 afimetoran、BLN-326 或 lomedeucitinib
              的公开价格表、净价、报销时间表或已确认收入流。它们能提供的是：最终奖品可能很有意义。GSK 年报显示 Benlysta 2025 年销售额为 £1.773 billion，Aurinia 报告 2025 年
              Lupkynis 净产品销售额 $271.3 million，并给出 2026 年增长指引；AbbVie 则在 $30.406 billion 免疫业务版图中报告 Rinvoq 收入 $8.304
              billion。


              这些数字不应被当作 Beeline
              预测。它们展示的是财务故事的两面。第一，获批自身免疫品牌可以成为大型、持久资产。第二，达到那个状态的公司通常也要承担庞大商业基础设施、患者支持支出、医学事务和支付方管理义务。Beeline
              还没有给出定价政策、返利假设或利润率结构，所以当前估值工作必须依赖可比市场吸引力，而不是公司自身价格实现能力。
