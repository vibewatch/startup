      - number: '4.2'
        title: 资本基础与近期用途
        blocks:
          - type: paragraph
            body: >-
              公开证据在资本化上远强于运营指标。Bain 的启动公告称，最初 $300 million Series A 将支持运营进入后期临床开发。6 月 30 日延伸融资随后从既有股东和投资人处增加 $126.3
              million，使 Series A 总额达到 $426.3 million。公司和独立报道都指向同一用途：这笔资本将用于 afimetoran 的关键性开发准备，以及未来十二个月内在其余管线中启动多项试验。


              即使管理层没有披露准确月度烧钱数，这些用途也意味着非常真实的烧钱画像。仅 afimetoran 就需要完成 Phase 2，并为关键性开发做准备。BLN-326
              正在狼疮和特应性皮炎中研究。延伸融资公告还称，lomedeucitinib 和 BLN-481 预计进入更多研究，BLN-498 则仍在临床前开发。CEO Saqib Islam 告诉
              Fierce，所有这些试验都会很昂贵，当前资本并不意味着以后永远不需要融资。正确解读是：Beeline 在其阶段拥有异常强的私募资本化，但资金用途计划同样雄心很大。
