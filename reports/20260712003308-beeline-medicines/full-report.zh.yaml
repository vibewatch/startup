      - number: '8.3'
        title: 情景分析与可比公司框架
        blocks:
          - type: paragraph
            body: >-
              在这里，情景分析比虚假的精确更有用。多头情景下，afimetoran 拿出令人信服且有差异化的狼疮数据，关键试验规划按期推进，其余平台项目也能继续融资而不显得过度扩张。到了那个状态，Beeline
              未来可能逐步接近上市免疫学可比公司，或走向战略收购路径。基准情景下，公司仍然有意思，但需要更多证据、更细的资本规划和更严格的资产筛选。空头情景下，如果核心读数偏弱，或在强拐点前遇到融资压力，投资逻辑就会从平台溢价退回到资产挽救。


              公开可比公司只能当外框使用。Aurinia 和 SpringWorks
              说明，聚焦型生物科技公司只要有真实资产和催化剂，市值可以站到低个位数十亿美元区间。Incyte、Alnylam、argenx、Regeneron
              等更大的上市免疫学或专科生物科技公司，说明一旦证据和商业化跑通，终局市场可以做得很大；但它们远比 Beeline 成熟。这些可比公司证明上行空间存在，而不是证明当前价格确定合理。
