  - id: TM005
    title: 增长驱动因素与约束表（商业化视角）
    columns:
      - 主题
      - 重要性
      - 当前公开信号
      - 对采纳的可能影响
      - 哪些信息会增强信心
    rows:
      - - 狼疮优先聚焦
        - Beeline 最清晰的切口是 SLE 中的 afimetoran。
        - 公司和媒体信源都以狼疮为主线。
        - 带来聚焦，也集中市场风险。
        - 更明确说明 SLE 定位、严重亚型差异和标准治疗排序。
      - - 组合扩展到皮肤科
        - BLN-326 和 lomedeucitinib 扩大市场画布。
        - 公司提到 AD、银屑病和后续罕见自身免疫适应症。
        - 抬高上行空间，也增加竞争复杂度。
        - 按资产列出具名适应症顺序、试验时间表和支付方策略。
      - - 基于结果的竞争
        - 现有玩家卖的是疾病控制、减少激素和预防复发。
        - Benlysta 和 Saphnelo 都强调这些结果。
        - 门槛不再只是机制新颖。
        - 头对头数据，或清晰差异化的终点策略。
      - - 给药方式优势被追平
        - 自我注射和已有口服药削弱了简单便利性卖点。
        - Saphnelo 自我注射和 Lupkynis 口服定位已公开。
        - 可能压缩便利性溢价。
        - 需要数据证明依从性或疗效收益足够大，能抵消给药路径趋同。
      - - 支持项目强度
        - 获批之后，商业化基础设施仍可能成本很高。
        - 主要现有玩家都在运营负担能力或准入支持项目。
        - 给上市假设增加非研发成本负担。
        - 详细商业化服务预算和伙伴图谱。
    notes: 第二张约束表从上市打法视角重看同一市场，因为在专科免疫领域，商业复杂度几乎和流行病学一样重要。
