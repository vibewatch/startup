      - number: '7.3'
        title: 伙伴、财务与人员风险
        blocks:
          - type: paragraph
            body: >-
              Beeline 也暴露在伙伴和融资集中度下。Bristol Myers Squibb 贡献资产并保留股权经济权益，这有助于验证平台，但也意味着公司不是从完全切开的经济基线起步。公开来源还显示，尽管 Series
              A 很大，未来资本仍可能来自私募或公开市场。这是合理姿态，但让融资风险与临床时间点不可分割：如果公司在令人信服的价值拐点前需要新钱，议价能力可能下降。


              人员风险更微妙。管理团队经验很深，Saqib Islam 的 SpringWorks 记录也是真实的。即便如此，Beeline
              仍足够早，执行很可能高度依赖一个小型领导团队，在试验、资本配置和资产优先级上做多项相互咬合的决定。关键人集中在生物科技中并不致命，但确实存在。平台故事越锋利，一旦优先级或时间纪律滑坡，伤害就越大。
