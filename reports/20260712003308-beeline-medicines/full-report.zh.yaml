  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、反论点与价格敏感性
        blocks:
          - type: paragraph
            body: >-
              多头逻辑从公开证据看很容易说清楚。Beeline 出场时初始资本异常充足，核心狼疮资产机制清晰，也看得到 Phase 2
              路径；更宽的管线让公司不止押一个项目。管理层还有公开市场投资者已经熟悉的操盘履历：SpringWorks。只要 afimetoran 数据读出理想，平台扩张继续克制，Beeline
              可能很快从「有意思的私人创业公司」变成「下一代免疫学领域的严肃玩家」。


              反面逻辑同样重要。公开来源仍没有披露实际本轮估值、股权结构、清算优先权结构、现金余额、烧钱速度，或与 Bristol Myers Squibb
              的资产级经济分配。也就是说，投资者判断公司质量的把握，远高于判断入场价格的把握。好公司如果价格错了，仍可能不是好投资；用户提供的叙事暗示独角兽身份，但留存的一手来源并未公布数字，未披露定价条款就尤其关键。因此本章必须对价格保持敏感：没有轮次经济条件，推荐质量只能保持有条件。
            claimRefs:
              - CV001
              - CV002
