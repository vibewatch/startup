      - number: '8.2'
        title: 当前融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              公开融资证据能支撑总资本规模，却支撑不了条款。Beeline 启动时拿到 $300 million，June 2026 又追加 $126.3 million，Series A 总资本达到 $426.3
              million。资本底盘足够大，也给公司比典型单资产生物科技公司更多战略余地。可是同一批来源仍留下关键承销问题：没有公开投后估值、每股价格、清算优先权、股数、资金续航披露，也没有说明 afimetoran
              数据若表现参差时的下行融资预案。


              因此，入场纪律很清楚。投资者不应只是因为公司看起来资金充足，或因为后期自身免疫资产可能值钱，就追着买。他们应要求披露轮次条款、扣除 BMS
              义务后的净保留经济权益，以及与读数挂钩的融资应急安排。换句话说，公开记录支持密切跟踪和尽调 Beeline，但不支持把一个未披露的私募估值自动视为合理。
