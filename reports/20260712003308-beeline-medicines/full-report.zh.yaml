chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段与组合定义
        blocks:
          - type: paragraph
            body: >-
              Beeline Medicines 不是一个只有实验室阶段单一资产的发现概念。它在 2026 年 4 月 15 日公开亮相时，已经是一家临床阶段自身免疫生物科技公司，手里有五个来自 Bristol Myers
              Squibb 的项目，还有 $300 million Series A。Bain Capital 的启动新闻稿和联合启动公告，把公司定义为面向自身免疫和炎症性疾病的精准疗法搭建者；但公司公开主页更窄，几乎全部围绕
              afimetoran。这个差异对尽调很关键：公司在销售一个多资产未来，但今天最具体的公开身份仍是领衔狼疮项目。


              Beeline 的组合描述，对一家刚公开的新公司来说成熟度反常地高。启动材料称，公司有三项临床阶段资产和两项更早期生物制剂；其中 afimetoran 已在系统性红斑狼疮（SLE）推进 Phase
              2，BLN-326 在狼疮和特应性皮炎研究中活跃，lomedeucitinib 则承接了 Bristol Myers Squibb 既有的银屑病概念验证。商业模式因此是商业化前，但不是临床前：Beeline
              想把已降风险的免疫项目推向关键性开发，并按管理层自己的说法，最终推向定价和商业化，而不是默认立刻授权出去。


              地址披露没有产品阶段披露那么清楚。公开新闻稿使用 Stamford, Connecticut 和 Boston 的电头，但留存来源没有明确把某一个城市定义为唯一总部。投资人今天最站得住的表述是：Beeline
              在美国东北部生物科技走廊运营，公开足迹呈双基地，而不是已经清楚披露单一总部地址。
