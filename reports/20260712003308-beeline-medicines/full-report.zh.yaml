            body: >-
              今天已有的具名证明很窄，但只要解读得当，仍可使用。第一，Bristol Myers Squibb 是具名战略交易对手，贡献资产并保留经济权益，显示上游机构承诺。第二，afimetoran、BLN-326 狼疮和
              BLN-326 特应性皮炎研究记录表明，具名临床项目足够活跃，可以锚定研究者和站点工作流。这些是上市前最接近采用证据的公开代理变量。


              但证据天花板不高。上述证明面都没有展示支付方胜利、经常性收入、治疗持续性或客户满意度。因此，投资人不应过度解读当前利益相关方地图。说 Beeline
              有真实生态参与和通向未来客户的可信路径是合理的；说公司已经证明持久客户采用还不合理。最佳尽调动作，是要求管理层提供精确站点数量、入组进度、计划中的市场准入搭建，以及任何尚未公开、但内部已在使用的
