      - number: '1.3'
        title: 资本基础、发起方经济权益与剥离逻辑
        blocks:
          - type: paragraph
            body: >-
              Beeline 的融资规模，是后续章节能够认真看待这家公司的核心原因。2026 年 4 月，公司由 Bain Capital 领投启动 $300 million；6 月延伸融资又从既有支持方拿到 $126.3
              million，使 Series A 总额达到 $426.3 million。这个金额即使按生物科技标准也很大，支撑了一个判断：Beeline
              是围绕一批已经昂贵到值得单独开发平台承接的资产组装起来，而不是一个小额种子轮实验。披露资本也足以让公司一边为 afimetoran 的关键性开发做准备，一边在更广管线中启动更多研究。


              经济结构说明了为什么 Bristol Myers Squibb 在剥离后仍重要。联合启动公告中，BMS 称其保留近 20% 股权，并有资格获得转入资产的特许权使用费和里程碑付款。Bain 带来主要资本，但 BMS
              留下真实上行和 Robert Plenge 的董事会席位。结果是一家公司在治理形式上独立，却在战略上仍被资产来源方牵住。


              独立报道还给出一个不那么好听、但很有用的剥离解读。BioPharma Dive 把 Bain 的模式描述为：为更成熟的项目融资，同时让药企把内部未优先推进的资产变现；Fierce 则引用 Islam
              的说法，昂贵试验意味着 Beeline 以后终究还需要融资。这些点不抵消融资优势，却提醒投资人：Beeline 同时是信心故事，也是组合分流故事。之所以需要强资本，正因为这些项目重要到值得继续推进，但还没重要到让
              Bristol Myers Squibb 留作内部优先项。
