      - number: '1.4'
        title: 里程碑、运营搭建与仍然缺失的内容
        blocks:
          - type: paragraph
            body: >-
              公开来源中可见的里程碑路径很短，但逻辑连贯。Beeline 称公司成立于 2025 年 7 月，2026 年 4 月公开亮相，2026 年 6 月扩大融资，并预计 afimetoran 的 Phase 2
              狼疮数据将在 2026 年下半年读出。公司还称，lomedeucitinib 和 BLN-481 的更多研究应在未来一年内启动。独立报道补充了一个有用的运营标记：据称员工人数从亮相时不到 40 人，增至 6
              月底的 60 多人，说明公司不是把资产放仓库里，而是在围绕它们主动搭组织。


              缺失数据同样重要。公开来源没有披露投后估值、股权表、股份类别、当前现金余额、烧钱速度、收入、客户或盈利能力。对一家私营临床阶段生物科技公司来说，这些缺口正常，但仍限制投资测算。实际看，投资人可以验证公司真实存在、资本充足、团队有经验；却还无法验证私募投资人买入的经济条款，或管理层部署资本的具体现金效率。


              因此，公司概览尽调处在有利但不完整的位置。Beeline 已明显越过“隐身叙事”门槛，成为真实运营公司；临床实质也比多数新启动公司更强。但投资论点仍由 afimetoran
              牵引，由异常庞大的发起方资本供血，治理和经济披露也只照亮了一部分。这些保留项可管理，但仍是保留项，不是脚注。
