  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 含义
      - 尽调问题
    rows:
      - - 狼疮和狼疮性肾炎未满足需求高
        - 正向
        - 当前
        - 尽管患病率低于皮肤科疾病，仍支撑尝试差异化疗法的意愿。
        - 验证 afimetoran 相比现有标准附加治疗能否拿出有临床意义的改善。
      - - 皮肤科大患病人群
        - 正向
        - 当前
        - BLN-326 和 lomedeucitinib 把战略上限从狼疮拓宽到更大市场。
        - 要求披露首批皮肤科适应症的具体排序和试验经济性。
      - - 口服便利性叙事
        - 正向
        - 当前至中期
        - 口服定位有助于家庭用药采纳和患者匹配。
        - 量化在 Saphnelo 自我注射和 Lupkynis 口服先例之后，口服便利性是否还算差异化。
      - - 现有品牌药收入基础
        - 正向
        - 当前
        - Benlysta、Lupkynis 和 Rinvoq 证明买方已经为慢性免疫疗法报销。
        - 将 Beeline 的价值主张与这些产品的疗效结果和支持服务主张对标。
      - - 标签排除项和阶梯升级治疗路径
        - 负向
        - 当前
        - 并非每个患病患者都有资格使用高价品牌疗法。
        - 将 afimetoran 和 BLN-326 对应到可能的治疗线定位和排除标准。
      - - 支付方摩擦和支持项目负担
        - 负向
        - 当前
        - 共付、准入和导航服务会增加商业化成本与复杂度。
        - 要求提供市场准入搭建计划、hub 服务预算和专科药房策略。
      - - 拥挤的皮肤科 / TYK2 竞争
        - 负向
        - 当前至中期
        - 即便患病率更高，更大的市场也可能更难打进去。
        - 将 lomedeucitinib 与现有 TYK2 和 JAK 替代方案比较差异化。
      - - 未披露的罕见自身免疫细分规模
        - 负向
        - 当前
        - 公开证据尚未显示哪些罕见适应症能形成最有吸引力的首个细分切口。
        - 要求提供具名罕见适应症短名单，并说明患病率、生物标志物和终点依据。
    notes: 方向反映的是对 Beeline 采纳的可能影响，而不是免疫学整体吸引力。
