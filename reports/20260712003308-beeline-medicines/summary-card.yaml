  topStrengths:
    - Unusually large Series A capital base for a newly public clinical-stage biotech
    - Clear lupus-first lead asset with a visible Phase 2 catalyst and Fast Track support
    - Multi-asset platform provides more optionality than a single-program startup
    - Experienced management and sponsor ecosystem anchored by Bain Capital and Bristol Myers Squibb
    - Product story is mechanistically specific rather than generic biotech marketing
  topRisks:
    - Public sources do not disclose valuation, cap table, burn, runway, or retained asset economics
    - The near-term thesis is highly concentrated around afimetoran and its lupus readout
    - Manufacturing, CMC, and quality-system detail remain largely private
    - Future financing risk remains real despite the large Series A
    - Customer proof is still clinical and partner-driven rather than commercial
    - Platform overreach is possible if too many programs advance without strict triage
  unresolvedGaps:
    - Post-money valuation, price per share, and liquidation preferences are not public
    - Cash balance, burn by function, and runway are not public
    - Asset-level royalty, milestone, and governance economics with Bristol Myers Squibb are not public
    - Manufacturing readiness, GMP detail, and CMC scale-up plans are not public
    - Future market-access, hub-services, and commercialization build plans are not public
