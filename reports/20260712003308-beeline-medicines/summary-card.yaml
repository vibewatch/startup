summary:
  headline: |
    Beeline appears to be a strong private lupus-first immunology company with serious capital,
    credible mechanisms, and multiple shots on goal—but the right current call is research-more
    because public evidence still does not disclose the valuation, cap table, burn, or retained
    asset economics needed for price conviction.
