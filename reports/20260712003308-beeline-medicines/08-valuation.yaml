  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-entry-price
    missingEvidence: Post-money valuation, price per share, preferences, anti-dilution terms, and ownership by investor class.
    whyItMatters: A valuation chapter cannot support a price-sensitive recommendation without the actual price.
    diligencePath: Request the signed round documents, full cap table, and any side-letter rights.
    relatedQuestionRefs:
    - QV006
    - QV007
    - QV011
    relatedTableRefs:
    - TV001
    - TV004
    - TV006
  - type: private-evidence-only
    severity: material
    topic: net-retained-asset-economics
    missingEvidence: Asset-by-asset royalty, milestone, governance, and reversion mechanics with Bristol Myers Squibb.
    whyItMatters: Gross asset appeal can materially overstate net investor value if the retained economics are heavy.
    diligencePath: Request a license summary and model Beeline net proceeds asset by asset.
    relatedQuestionRefs:
    - QV014
    - QV027
    relatedTableRefs:
    - TV002
    - TV006
  - type: private-evidence-only
    severity: material
    topic: runway-and-downside-financing-plan
    missingEvidence: Cash balance, burn, runway, and downside financing contingencies around the afimetoran readout.
    whyItMatters: Financing timing is one of the main ways valuation breaks in private biotech.
    diligencePath: Request the budget, runway cases, and financing trigger thresholds.
    relatedQuestionRefs:
    - QV013
    - QV017
    - QV026
    relatedTableRefs:
    - TV003
    - TV005
    - TV006
