- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Afimetoran readout disappoints
    - Weak efficacy, safety surprise, or no clear pivotal path
    - Breaks the lupus-first premium narrative
    - Move from track to avoid unless price resets dramatically
  - - Financing under pressure
    - New money needed before strong data support
    - Weakens valuation leverage and increases dilution concern
    - Demand downside protection or wait
  - - CMC / economic opacity persists
    - Still no cap-table, BMS economics, or manufacturing clarity near the next gate
    - Blocks conversion from curiosity to conviction
    - Keep recommendation at research more
  - - Platform overreach
    - Too many assets advance without crisp triage
    - Reduces confidence in capital discipline
    - Lower conviction even if science remains interesting
  notes: Triggers are deliberately measurable so the recommendation can move with evidence.
