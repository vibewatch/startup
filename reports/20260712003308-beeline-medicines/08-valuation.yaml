- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Cap table and round terms
    - Share count, price per share, preferences, anti-dilution
    - Determines whether the entry is attractive or already expensive
    - Request financing documents and current cap table
  - - BMS asset economics
    - Royalty, milestone, governance, and reversion details by asset
    - Determines net retained value and strategic flexibility
    - Request license summary and side letters
  - - Runway and burn
    - Cash balance, burn by function, downside financing cases
    - Determines dilution and bargaining-power risk
    - Request latest budget and runway model
  - - CMC and launch readiness
    - Manufacturing map, quality system, market-access build
    - Determines execution risk after good science
    - Request CMC plan, quality materials, and launch-prep budget
  notes: These asks are the minimum package needed to move from a narrative view to a priceable investment view.
