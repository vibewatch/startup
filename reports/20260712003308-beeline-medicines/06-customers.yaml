- id: current-proof-surfaces-versus-commercial-adoption
  title: Current proof surfaces versus commercial adoption
  body: 'The strongest current proof surface is clinical participation, not commercial deployment. Public trial records confirm that afimetoran, BLN-326, and lomedeucitinib sit inside formal study workflows, which is evidence that investigators and study networks are willing to engage with the programs. Public financing support adds another kind of signal: Bain, Bristol Myers Squibb, CPP Investments, and management all added capital ahead of afimetoran''s readout. But those are still ecosystem-confidence signals, not paying-customer metrics.


    Just as important is what is missing. Retained public sources do not disclose customer counts, active prescribers, health-system contracts, payer agreements, treated-patient volumes, repeat orders, utilization, satisfaction, NRR, GRR, churn, or renewal rates. The company website is informational and press oriented rather than a product transaction surface. The right reading is that Beeline has stakeholder attention and clinical-network participation, but not yet public proof of commercial adoption.'
