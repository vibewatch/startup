- id: durability-expansion-and-concentration
  title: Durability, expansion, and concentration
  body: 'Because there are no disclosed commercial customers yet, durability has to be analyzed through concentration and roadmap rather than through retention metrics. Afimetoran is clearly the first concentration point: it dominates the homepage, the near-term readout calendar, and the public launch narrative. The same is true structurally for the Bristol Myers Squibb relationship, because the company was formed around transferred BMS assets and BMS retained equity economics. Those facts do not make the customer story weak; they make it concentrated.


    Expansion remains plausible if the company can move beyond its lupus-first proof surface. BLN-326 broadens the potential user base into both lupus and atopic dermatitis, while lomedeucitinib could eventually reach dermatology and rare-autoimmune specialists. Yet the commercial bar is visible already: incumbent brands devote serious effort to support, affordability, and patient navigation. That means Beeline''s future land-and-expand story will depend not just on indication count, but on whether the company can build a credible specialist, payer, and patient-support experience around each route and disease context.'
