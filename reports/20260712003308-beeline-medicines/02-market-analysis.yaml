- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Primary buyer / prescriber
  - User / patient
  - Payer / budget owner
  - Workflow or access trigger
  - Implication for Beeline
  rows:
  - - SLE
    - Rheumatologist
    - Predominantly women with chronic autoimmune disease
    - Commercial, Medicare, Medicaid plans
    - Failure of current lupus-control regimen and tolerance for chronic therapy
    - Afimetoran must fit specialist workflow and show meaningful disease-control benefit.
  - - Lupus nephritis
    - Rheumatologist plus nephrologist
    - Kidney-involved lupus patient
    - Commercial and public payers with kidney-care spend
    - Need to protect renal function and reduce flares / steroid burden
    - Lupkynis benchmark shows oral therapy matters, but Beeline is not yet targeting LN directly.
  - - Atopic dermatitis
    - Dermatologist / allergy specialist
    - Moderate-to-severe AD patient after topical failure
    - Commercial and public payers; specialty pharmacy
    - Escalation beyond topical therapy and prior systemic use
    - BLN-326 would enter a very large but utilization-managed market.
  - - Psoriasis
    - Dermatologist
    - Moderate-to-severe psoriasis patient
    - Commercial and public payers
    - Need for durable skin response and tolerated long-term therapy
    - Lomedeucitinib must outperform a crowded oral/biologic class context.
  - - Rare autoimmune niche
    - Subspecialist by disease
    - Small, high-need patient cohort
    - Specialty payer or orphan-disease budget
    - Mechanism fit and trial feasibility
    - Potential pricing power is higher, but public population size is not yet disclosed.
  notes: Buyer map reflects who controls prescription and reimbursement decisions, not just who experiences disease burden.
