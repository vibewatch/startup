- id: current-spend-and-therapy-benchmarks
  title: Current spend and therapy benchmarks
  body: 'Approved-product economics show that Beeline is entering markets where buyers already pay meaningful sums for chronic immune-disease control. In lupus, Benlysta remains the most visible incumbent, positioned as an add-on therapy for active lupus and lupus nephritis and reported by GSK at £1.773 billion of 2025 sales. Saphnelo adds another branded lupus option, but its own consumer positioning highlights a narrower approved use in moderate to severe SLE and explicitly excludes severe active lupus nephritis and CNS lupus. Lupkynis demonstrates that oral lupus-nephritis therapy can monetize too, though at a smaller current scale: Aurinia reported $271.3 million of 2025 net product sales and guided to $305-$315 million in 2026.


    Dermatology and broader immunology are even larger on a spend basis. AbbVie reported $30.406 billion of 2025 immunology revenue and $8.304 billion of Rinvoq revenue alone, underscoring how large multi-indication inflammatory franchises can become once a molecule earns multiple labels and payer familiarity. Bristol Myers Squibb''s own 2025 annual report shows SOTYKTU approved in plaque psoriasis and pursuing additional uses in SLE and Sjögren''s disease, which matters for Beeline because lomedeucitinib is also a TYK2-pathway story.


    These benchmarks anchor market analysis better than vendor TAM reports. They show a real willingness to reimburse differentiated autoimmune therapies, but they also show that each submarket has its own ceiling and competitive set. Lupus can produce blockbuster products; lupus nephritis is smaller but still meaningful; dermatology is vastly larger but crowded and commercially sophisticated.'
  claimRefs:
