tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend or patients
  - Excluded spend
  - Buyer / payer
  - Relevance to Beeline
  rows:
  - - Core SLE therapy market
    - Adults with SLE under specialist care; branded and advanced therapies
    - All autoimmune prevalence not tied to SLE diagnosis
    - Rheumatologists; commercial and government payers
    - Direct launch market for afimetoran.
  - - Lupus nephritis subsegment
    - Kidney-involved lupus patients and kidney-protective therapies
    - Non-lupus nephrology and transplant drugs
    - Rheumatologists, nephrologists, payers
    - Important adjacent spend pool and competitive benchmark for oral lupus care.
  - - Atopic dermatitis systemic market
    - Moderate-to-severe AD patients escalated beyond topical therapy
    - Mild AD managed without systemic brands
    - Dermatologists, payers, specialty pharmacy
    - Relevant to BLN-326 and far larger than lupus by prevalence.
  - - Psoriasis / TYK2 market
    - Moderate-to-severe psoriasis and systemic oral/biologic therapy budgets
    - Topical-only or mild psoriasis spend
    - Dermatologists, payers
    - Relevant as lomedeucitinib proof-of-concept territory and class-validation market.
  - - Rare autoimmune expansion niches
    - Smaller, specialist-run inflammatory indications not yet publicly named by Beeline
    - Generic broad autoimmune TAM rhetoric
    - Subspecialists, orphan-disease payers
    - Potential longer-term upside but not yet source-backed enough for precise sizing.
  notes: The table separates launchable disease markets from broader prevalence narratives so that later sizing does not double-count unrelated autoimmune spend.
