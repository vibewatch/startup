- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - High unmet need in lupus and lupus nephritis
    - positive
    - current
    - Supports willingness to try differentiated therapies despite smaller prevalence than dermatology.
    - Test whether afimetoran can show clinically meaningful improvement versus current standard add-ons.
  - - Large dermatology prevalence pools
    - positive
    - current
    - BLN-326 and lomedeucitinib expand the strategic ceiling beyond lupus.
    - Request exact initial dermatology indication sequencing and trial economics.
  - - Oral-convenience narrative
    - positive
    - current to mid-term
    - Oral positioning can help home-use adoption and patient fit.
    - Quantify whether oral convenience is still differentiated after Saphnelo self-injection and Lupkynis oral precedent.
  - - Existing branded revenue base
    - positive
    - current
    - Benlysta, Lupkynis, and Rinvoq prove buyers already reimburse chronic immune therapies.
    - Benchmark Beeline's value proposition against these products' outcome and support claims.
  - - Label exclusions and step-up treatment ladders
    - negative
    - current
    - Not every prevalent patient is eligible for premium branded therapy.
    - Map afimetoran and BLN-326 to likely line-of-therapy positioning and exclusion criteria.
  - - Payer friction and support-program burden
    - negative
    - current
    - Copay, access, and navigation services add commercialization cost and complexity.
    - Request market-access build plan, hub-services budget, and specialty-pharmacy strategy.
  - - Crowded dermatology / TYK2 competition
    - negative
    - current to mid-term
    - Larger markets may be harder to penetrate despite better prevalence.
    - Compare lomedeucitinib against existing TYK2 and JAK alternatives on differentiation.
  - - Undisclosed rare-autoimmune niche sizing
    - negative
    - current
    - Public evidence does not yet show which rare indications create the most attractive first niche.
    - Request named rare-indication shortlist with prevalence, biomarker, and endpoint rationale.
  notes: Direction reflects likely impact on Beeline adoption rather than attractiveness of immunology as a whole.
