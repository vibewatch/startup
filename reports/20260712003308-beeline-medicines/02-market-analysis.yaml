- id: TM005
  title: Growth drivers and constraints table (commercialization lens)
  columns:
  - Theme
  - Why it matters
  - Current public signal
  - Likely effect on adoption
  - What would improve confidence
  rows:
  - - Lupus-first focus
    - Beeline's clearest wedge is afimetoran in SLE.
    - Company and media sources all lead with lupus.
    - Creates focus but concentrates market risk.
    - More explicit SLE positioning versus severe subtypes and standard-of-care sequencing.
  - - Portfolio expansion into dermatology
    - BLN-326 and lomedeucitinib enlarge the market canvas.
    - Company cites AD, psoriasis, and rare autoimmune follow-ons.
    - Raises upside but also competitive complexity.
    - Named indication order, trial timing, and payer strategy by asset.
  - - Outcome-based competition
    - Incumbents sell disease control, steroid reduction, and flare prevention.
    - Benlysta and Saphnelo both emphasize these outcomes.
    - Raises bar beyond pure mechanistic novelty.
    - Head-to-head or clearly differentiated endpoint strategy.
  - - Modality parity catching up
    - Self-injection and oral incumbents reduce a simple convenience pitch.
    - Saphnelo self-injection and Lupkynis oral positioning are already public.
    - Can compress convenience premium.
    - Data showing adherence or efficacy benefits big enough to offset route parity.
  - - Support-program intensity
    - Commercial infrastructure can be costly even after approval.
    - Every major incumbent runs affordability or access-support programs.
    - Adds non-R&D cost burden to launch assumptions.
    - Detailed commercialization services budget and partner map.
  notes: This second constraints table reframes the same market through a go-to-market lens because commercial complexity matters almost as much as epidemiology in specialty immunology.
