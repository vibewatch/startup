  evidenceGaps:
  - type: missing-source
    severity: material
    topic: afimetoran-treated-wedge
    missingEvidence: Publicly sourced disease-activity, line-of-therapy, and treatment-eligibility splits for the subset of SLE patients most relevant to afimetoran's initial commercial wedge.
    whyItMatters: Prevalence alone overstates launch TAM; underwriting needs a narrower estimate of likely treated patients and payer sequencing.
    diligencePath: Request epidemiology deck, target-product-profile assumptions, and market-research work on active SLE treatment flow.
    relatedQuestionRefs:
    - QM022
  - type: missing-source
    severity: material
    topic: rare-autoimmune-sizing
    missingEvidence: Named rare autoimmune indications and prevalence estimates for lomedeucitinib's proposed first niche beyond psoriasis proof-of-concept.
    whyItMatters: Without named diseases, it is impossible to judge whether rare-autoimmune expansion is a focused orphan strategy or just generic optionality.
    diligencePath: Request internal indication-ranking memo and public/non-public prevalence sources for shortlisted rare diseases.
    relatedQuestionRefs:
    - QM023
  - type: conflicting-data
    severity: minor
    topic: overlap-in-prevalence-lenses
    missingEvidence: A deduplicated patient-population model that reconciles overlap among broad prevalence buckets across lupus, eczema, and psoriasis.
    whyItMatters: Top-down market lenses are useful, but double counting can easily overstate the true multi-indication opportunity.
    diligencePath: Build an overlap-adjusted prevalence model or replace broad patient counts with indication-specific treated-population models.
