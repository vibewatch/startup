companyProfile:
  summary: 'Beeline Medicines is a sponsor-built immunology biotech developing a five-asset pipeline for

    autoimmune and inflammatory diseases. The current public story revolves around afimetoran, a

    once-daily oral TLR7/8 inhibitor being advanced in lupus, supported by BLN-326 in lupus and

    atopic dermatitis, lomedeucitinib in TYK2-linked inflammatory disease, and two earlier-stage

    biologic programs. The likely future customers are specialist physicians, payers, and patients

    in lupus, dermatology, and rare autoimmune settings, while the present proof surface is still

    mostly clinical and partner-driven rather than commercial.

    '
  foundedDate: '2025-07-01'
  foundingLocation: Stamford, Connecticut and Boston, Massachusetts, USA
  headquarters: Stamford, Connecticut and Boston, Massachusetts, USA
  productSummary: 'Beeline''s product portfolio consists of five precision-immunology assets: afimetoran, an oral

    TLR7/8 inhibitor for lupus; BLN-326, an IL-2-CD25 fusion protein for lupus and atopic

    dermatitis; lomedeucitinib, an oral allosteric TYK2 inhibitor for psoriasis and future rare

    autoimmune use; BLN-481, an anti-IL-18 receptor beta antibody; and BLN-498, a myeloid-

    selective IL-10 therapeutic.

    '
  customerFocus: 'Future specialist prescribers, investigators, payers, and patients in lupus first, then

    dermatology and rare-autoimmune settings as later assets mature.

    '
