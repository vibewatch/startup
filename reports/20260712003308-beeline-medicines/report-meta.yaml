  shortDescription: 'Beeline Medicines is a private clinical-stage biotechnology company focused on precision

    therapies for autoimmune and inflammatory diseases. Public evidence shows it was formed in

    July 2025, launched publicly in April 2026 with five Bristol Myers Squibb-derived assets and

    $300 million of Bain-led capital, and then upsized its Series A to $426.3 million in June

    2026. The company is centered on afimetoran, an oral TLR7/8 lupus program in Phase 2, with

    BLN-326, lomedeucitinib, BLN-481, and BLN-498 broadening the platform.

    '
subtitle: Lupus-First Immunology Platform — Strong Setup, Limited Price Transparency
coverageNotes: 'Beeline is a private company. Public evidence is strong on capitalization, pipeline identity,

  clinical-stage positioning, and the near-term afimetoran catalyst, but weak on valuation,

  cap-table terms, burn, runway, retained economics by asset, manufacturing readiness, and future

  commercialization infrastructure. This report therefore supports a company-quality view more

  confidently than a price-quality view.

  '
