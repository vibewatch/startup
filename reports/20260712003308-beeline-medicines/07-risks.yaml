  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: CMC-quality-system
    missingEvidence: Manufacturing partners, GMP status, quality metrics, and pharmacovigilance operating detail.
    whyItMatters: Execution risk cannot be sized cleanly without the process layer under the science.
    diligencePath: Request CMC map, manufacturing contracts, quality leadership roster, and safety-governance materials.
    relatedQuestionRefs:
    - QR009
    - QR010
    - QR012
    - QR026
    relatedTableRefs:
    - TR001
    - TR002
  - type: private-evidence-only
    severity: material
    topic: financing-contingency-plan
    missingEvidence: Board-approved financing plan across strong, middling, and weak afimetoran readout outcomes.
    whyItMatters: Future capital timing is one of the main transmission channels from science risk into investment risk.
    diligencePath: Request downside financing cases, covenant-free cash runway planning, and trigger thresholds for new money.
    relatedQuestionRefs:
    - QR015
    - QR016
    - QR017
    - QR023
    relatedTableRefs:
    - TR003
    - TR005
  - type: missing-source
    severity: minor
    topic: commercial-access-prep
    missingEvidence: Public detail on future hub-services, specialty-pharmacy, and access operations.
    whyItMatters: Customer-access risk becomes material as soon as science begins to work.
    diligencePath: Request market-access roadmap, vendor plan, and prelaunch support architecture.
