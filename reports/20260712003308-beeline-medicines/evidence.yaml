evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-terms
    missingEvidence: >-
      Exact post-money valuation, ownership split, liquidation preferences, and option-pool structure for both the April
      2026 launch round and June 2026 extension.
    whyItMatters: >-
      Without round terms, investors cannot translate Beeline's unusually large capital raise into an entry price or
      dilution-overhang view.
    diligencePath: >-
      Request the latest cap table, stock purchase agreement, investor rights agreement, and board-approved option-pool
      schedule.
    relatedQuestionRefs:
      - QO017
      - QO021
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, trial-by-trial budget, and runway assumptions after the June 2026 extension.
    whyItMatters: >-
      Capital adequacy is a central underwriting issue because Beeline is funding several expensive clinical programs at
      once.
    diligencePath: Request monthly cash bridge, 24-month operating plan, and asset-level development spend assumptions.
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: minor
    topic: governance-process
    missingEvidence: Board committee structure, independent-director roles, reserved matters, and succession planning documentation.
    whyItMatters: >-
      Named directors alone do not show how sponsor influence is balanced or how decisions escalate beyond the CEO and
      board chair.
    diligencePath: Request board committee charters, governance guidelines, and an updated board/committee roster.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: headquarters-footprint
    missingEvidence: >-
      A formal corporate address, office count, and current organization chart that distinguish headquarters from
      satellite functions.
    whyItMatters: >-
      The company's public Stamford/Boston datelines create ambiguity around where core functions sit and how the
      organization is distributed.
    diligencePath: Request legal-entity records, office leases, and an org chart by function and geography.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: afimetoran-treated-wedge
    missingEvidence: >-
      Publicly sourced disease-activity, line-of-therapy, and treatment-eligibility splits for the subset of SLE
      patients most relevant to afimetoran's initial commercial wedge.
    whyItMatters: >-
      Prevalence alone overstates launch TAM; underwriting needs a narrower estimate of likely treated patients and
      payer sequencing.
    diligencePath: >-
      Request epidemiology deck, target-product-profile assumptions, and market-research work on active SLE treatment
      flow.
    relatedQuestionRefs:
      - QM022
  - type: missing-source
    severity: material
    topic: rare-autoimmune-sizing
    missingEvidence: >-
      Named rare autoimmune indications and prevalence estimates for lomedeucitinib's proposed first niche beyond
      psoriasis proof-of-concept.
    whyItMatters: >-
      Without named diseases, it is impossible to judge whether rare-autoimmune expansion is a focused orphan strategy
      or just generic optionality.
    diligencePath: Request internal indication-ranking memo and public/non-public prevalence sources for shortlisted rare diseases.
    relatedQuestionRefs:
      - QM023
  - type: conflicting-data
    severity: minor
    topic: overlap-in-prevalence-lenses
    missingEvidence: >-
      A deduplicated patient-population model that reconciles overlap among broad prevalence buckets across lupus,
      eczema, and psoriasis.
    whyItMatters: Top-down market lenses are useful, but double counting can easily overstate the true multi-indication opportunity.
    diligencePath: >-
      Build an overlap-adjusted prevalence model or replace broad patient counts with indication-specific
      treated-population models.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: material
    topic: cross-brand-pricing
    missingEvidence: A harmonized set of exact list prices, net prices, or rebate-adjusted economics across the full competitor set.
    whyItMatters: >-
      Packaging and support can be compared publicly today, but underwriting commercial pressure still needs harder
      price data.
    diligencePath: Collect current WAC and any public net-price disclosures or payer policy benchmarks brand by brand.
    relatedQuestionRefs:
      - QP022
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: head-to-head-efficacy
    missingEvidence: Direct comparative efficacy and safety evidence between Beeline's assets and approved competitors.
    whyItMatters: >-
      Without head-to-head or robust indirect comparisons, competitive differentiation remains conceptual rather than
      decisively proven.
    diligencePath: Request internal benchmark deck, KOL read-through, and any cross-trial matching analyses used by management.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: minor
    topic: future-rare-autoimmune-rivals
    missingEvidence: A public, source-backed map of future rare-autoimmune entrants most relevant to lomedeucitinib's intended niche.
    whyItMatters: >-
