  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis, anti-thesis, and price sensitivity
        blocks:
          - type: paragraph
            body: >-
              The bull thesis is easy to articulate from public evidence. Beeline emerged with unusually large initial
              capital, a lead lupus asset with a coherent mechanism and visible Phase 2 path, and a broader pipeline
              that gives the company more than one shot on goal. Management also benefits from an operator story that
              public investors already know through SpringWorks. If afimetoran reads out well and the broader platform
              stays disciplined, Beeline could move quickly from 'interesting private startup' to 'serious next-wave
              immunology company.'


              The anti-thesis is just as important. Public sources still do not disclose the actual round valuation, cap
              table, preference stack, cash balance, burn, or asset-level economics with Bristol Myers Squibb. That
              means investors can assess company quality far more confidently than entry price. A great company can
              still be a weak investment at the wrong price, and the absence of disclosed pricing terms is especially
              material when the user-provided narrative suggests unicorn status but retained primary sources do not
              publish a number. The chapter therefore has to stay price-sensitive: without round economics,
              recommendation quality must remain conditional.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
