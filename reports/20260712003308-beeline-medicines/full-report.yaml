      - number: '5.3'
        title: Maturity, roadmap, and development dependencies
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows meaningful but uneven maturity across the pipeline. Afimetoran appears the most
              advanced: company and BMS trial materials cite Phase 1b proof of concept in cutaneous lupus, FDA Fast
              Track designation in systemic lupus, an ongoing randomized Phase 2 SLE study, and pivotal-development
              preparation after the expected 2026 readout. BLN-326 is earlier but still clinically active, with Phase 1b
              studies in lupus and atopic dermatitis. Lomedeucitinib has positive proof of concept in psoriasis and is
              being positioned for rare autoimmune expansion. BLN-481 and BLN-498 remain much earlier and function more
              as roadmap optionality than near-term product surfaces.


              Those maturity differences matter because each asset depends on a different chain of execution. Afimetoran
              depends on readout quality, regulatory strategy, and manufacturing scale-up for a potentially broader
              lupus population. BLN-326 depends on early safety, route practicality, and whether the Treg thesis can
              show enough clinical signal to justify expansion. Lomedeucitinib depends on finding whitespace in a class
              that is already commercially validated by SOTYKTU. The result is a roadmap with multiple shots on goal,
              but also multiple dependency stacks that can fail independently.
