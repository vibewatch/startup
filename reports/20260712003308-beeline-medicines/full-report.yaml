  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model before approval
        blocks:
          - type: paragraph
            body: >-
              Beeline is best understood as a pre-revenue development platform rather than as an operating commercial
              franchise. The retained public sources describe a clinical-stage biotechnology company built around five
              Bristol Myers Squibb-derived autoimmune assets, with afimetoran in Phase 2 lupus development, BLN-326 in
              Phase 1b studies, lomedeucitinib preparing for additional work, and two earlier biologic programs behind
              them. None of the retained official or independent sources disclose product revenue, customer revenue,
              ARR, profitability, or an active marketed portfolio. That absence is consistent with stage, but it matters
              because it means revenue quality cannot yet be judged through normal commercialization metrics.


              The more defensible framing is to separate current economics from future economics. Current economics are
              sponsor capital, strategic asset rights, and operating spend. Future economics would come only after
              approvals or new business-development transactions, likely through specialty-drug sales, milestone flows,
              or partnership structures. The Business Wire launch announcement also matters here because Bristol Myers
              Squibb retained nearly 20% equity plus royalties and milestones, signaling that Beeline's future gross
              economics may not equal its future net economics. Investors therefore should not confuse a very large
              Series A with evidence of a self-funding revenue engine.
