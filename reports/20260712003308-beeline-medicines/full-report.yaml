companyProfile:
  summary: |
    Beeline Medicines is a sponsor-built immunology biotech developing a five-asset pipeline for
    autoimmune and inflammatory diseases. The current public story revolves around afimetoran, a
    once-daily oral TLR7/8 inhibitor being advanced in lupus, supported by BLN-326 in lupus and
    atopic dermatitis, lomedeucitinib in TYK2-linked inflammatory disease, and two earlier-stage
    biologic programs. The likely future customers are specialist physicians, payers, and patients
    in lupus, dermatology, and rare autoimmune settings, while the present proof surface is still
    mostly clinical and partner-driven rather than commercial.
