  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and clinical risk
        blocks:
          - type: paragraph
            body: >-
              The heaviest risk remains regulatory and clinical. Afimetoran is still unapproved, and the public story
              depends heavily on a Phase 2 SLE readout that management expects to drive pivotal development. Fast Track
              designation improves process visibility, but it does not substitute for positive efficacy, safety, or
              registrational strategy. BLN-326 remains Phase 1b, and lomedeucitinib still has to prove where it can win
              inside a TYK2 landscape already validated commercially elsewhere.


              This matters because Beeline's public proof surface is still predominantly mechanistic and trial-anchored.
              A disappointing readout could do more than delay one asset: it could weaken customer mapping, fundraising
              leverage, and confidence in the whole portfolio architecture. Conversely, a strong readout would not
              eliminate risk; it would simply move the company into a new set of pivotal, CMC, and launch-preparation
              risks. The correct regulatory view is therefore binary but staged: data risk first, registrational
              execution risk second.
