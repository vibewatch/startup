      - number: '2.3'
        title: Buyer, user, payer, and modality map
        blocks:
          - type: paragraph
            body: >-
              The buyer map is fragmented by disease and route of administration. For lupus and lupus nephritis,
              rheumatologists and nephrologists drive prescribing, but payers and infusion infrastructure still matter
              because leading products often come with support, affordability, and site-of-care logistics. For atopic
              dermatitis and psoriasis, dermatologists control more of the workflow, yet the treatment ladder remains
              gated by prior-treatment failure, specialty-pharmacy coordination, and affordability programs. The
              incumbent product sites themselves make this visible: Benlysta highlights copay support, Saphnelo offers
              infusion-center navigation and self-injection education, LUPKYNIS markets Aurinia Alliance nurse support,
              and Rinvoq directs patients to AbbVie access assistance.


              Route of administration is a real commercial variable, not a cosmetic one. Afimetoran is marketed as
              once-daily oral; BLN-326's lupus study used IV or subcutaneous administration; Lupkynis is oral in lupus
              nephritis; Benlysta is a biologic add-on; and Saphnelo now spans both infusion and home self-injection.
              That means Beeline's convenience edge is strongest where it can offer an oral option against
              infusion-centric care, but weaker where competitors have already adapted with home-use formats.


              The practical takeaway is that Beeline will not sell into one uniform budget owner. It will sell into
              specialist prescribing habits, payer evidence thresholds, and patient-support expectations that differ
              substantially across lupus, nephrology, and dermatology. That complexity is manageable, but it raises the
              bar for clinical differentiation and market-access planning.
