      - number: '3.2'
        title: Dermatology and TYK2 adjacencies
        blocks:
          - type: paragraph
            body: >-
              BLN-326 and lomedeucitinib widen Beeline's strategic scope, but they also push the company into more
              crowded markets. In atopic dermatitis, BLN-326 would have to contend with Dupixent's broad age-range
              entrenchment, Ebglyss's newer biologic presence, and Rinvoq's oral systemic positioning after prior
              treatment failure. That means Beeline is not stepping into an empty white space in dermatology; it is
              choosing a market with very large patient pools but equally large incumbent investment.


              Lomedeucitinib faces a different kind of crowding. SOTYKTU has already validated the commercial appeal of
              an oral TYK2 story in psoriasis and is being extended by Bristol Myers Squibb into additional autoimmune
              indications, including SLE. For Beeline, this is both good and bad news: good because the class is
              validated, bad because the burden of differentiation rises once a class leader has defined the convenience
              baseline and support expectations.


              These adjacencies raise Beeline's long-term upside, but they also make the competitive chapter less about
              market size and more about where Beeline can still claim a differentiated clinical or access wedge.
