  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Asset stack and user workflow
        blocks:
          - type: paragraph
            body: >-
              Beeline's deliverable is a pipeline of precision therapies that fit into specialist autoimmune care rather
              than a single current commercial product. Public materials consistently describe five assets sourced from
              Bristol Myers Squibb: afimetoran for lupus, BLN-326 for lupus and atopic dermatitis, lomedeucitinib for
              psoriasis and future rare autoimmune conditions, BLN-481 in planned first-in-human work, and BLN-498 in
              preclinical development. The user workflow is therefore clinician-centered. Rheumatologists,
              dermatologists, nephrologists, investigators, and eventually patients interact first through trial
              enrollment and specialist evaluation, not through direct self-service product use.


              Afimetoran dominates the current workflow story because the homepage and launch materials are explicit
              that Beeline is leading with lupus and positioning the program as a once-daily oral option that could fit
              more naturally into patient lives. BLN-326 introduces a different workflow, because the cited trial
              materials discuss intravenous or subcutaneous administration in lupus and atopic dermatitis.
              Lomedeucitinib keeps the oral convenience theme alive, but in a TYK2 and psoriasis context rather than a
              lupus-first one. As a result, the company is not building one standard operating model; it is building a
              mixed-modality development platform whose future user experience will vary materially by asset.
