            body: >-
              Beeline's customer map has to be defined prospectively because the company is still pre-commercial. The
              likely future users are rheumatologists, dermatologists, nephrologists, clinical investigators, and
              patients with lupus, atopic dermatitis, psoriasis, and potentially rare autoimmune disease. The likely
              future payers are the commercial and government plans that already manage specialty-immunology access for
              brands like Benlysta, Lupkynis, Saphnelo, and Rinvoq. None of that implies Beeline has active paying
              accounts today, but it does define the stakeholder set that will matter most once clinical data mature.


              The routes of administration matter to this map. Afimetoran is framed as an oral once-daily lupus asset,
              which points toward a relatively broad specialist and patient-use case if approved. BLN-326 introduces
              more complex biologic delivery workflows, and lomedeucitinib reintroduces an oral systemic approach in a
              different specialty context. Taken together, the buyer-user-payer stack is heterogeneous: Beeline is not
              selling into one standard customer profile, and its future adoption burden will vary meaningfully by asset
              and disease.
