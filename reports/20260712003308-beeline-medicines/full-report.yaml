      - number: '7.4'
        title: Mitigations, monitoring, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The good news is that most major Beeline risks are monitorable. Investors do not need to guess randomly;
              they can watch for specific events. On the positive side, clean Phase 2 lupus data, clear pivotal design,
              and more explicit CMC or market-access planning would materially reduce uncertainty. On the negative side,
              ambiguous efficacy, slippage in next-study starts, or a need to finance before a strong readout would all
              be thesis-weakening signals.


              The right mitigation posture is therefore milestone-linked, not personality-linked. Investors should
              require objective proof of lead-asset progress, platform triage discipline, and enough capital planning
              transparency to show that the company can cross each technical gate without improvising under pressure. If
              those indicators improve, the risk profile can compress quickly. If they do not, Beeline can still remain
              scientifically interesting while becoming financially and strategically harder to underwrite.
