      - number: '7.3'
        title: Partner, financial, and people risk
        blocks:
          - type: paragraph
            body: >-
              Beeline is also exposed to partner and financing concentration. Bristol Myers Squibb contributed the
              assets and retained equity economics, which helps validate the platform but also means the company is not
              starting from a fully disentangled economic baseline. Public sources further show that future capital may
              still come from private or public markets despite the large Series A. That is a sensible posture, but it
              makes financing risk inseparable from clinical timing: if the company needs fresh money before a
              convincing value inflection, bargaining power could fall.


              People risk is more nuanced. The management team brings deep experience, and Saqib Islam's SpringWorks
              track record is real. Even so, Beeline is still early enough that execution likely depends heavily on a
              small leadership group making multiple interlocking decisions on trials, capital allocation, and asset
              prioritization. Key-person concentration is not fatal in biotech, but it is real. The sharper the platform
              story, the more damage can occur if prioritization or timing discipline slips.
            claimRefs:
