      - number: '1.3'
        title: Capital base, sponsor economics, and carve-out rationale
        blocks:
          - type: paragraph
            body: >-
              Beeline's financing scale is the core reason later chapters can take the company seriously. The April 2026
              launch brought $300 million led by Bain Capital, and the June 2026 extension added another $126.3 million
              from existing backers, taking total Series A funding to $426.3 million. That amount is large even by
              biotech standards and supports a thesis that Beeline was assembled around assets that are already
              expensive enough to justify a dedicated development platform rather than a small seed-funded experiment.
              The financing also gives the company enough disclosed capital to prepare afimetoran for pivotal work while
              starting more studies across the broader pipeline.


              The economic structure shows why Bristol Myers Squibb matters even after the spinout. In the joint launch
              announcement, BMS said it retained a nearly 20% equity stake and is eligible for royalties and milestones
              on the transferred assets. Bain brought the lead capital, but BMS kept real upside and board presence
              through Robert Plenge. The result is a company that is independent in governance form yet still
              strategically tethered to its asset originator.


              Independent coverage also gives the carve-out a less flattering but useful interpretation. BioPharma Dive
              described Bain's model as a way to fund more advanced programs while pharma monetizes assets it is not
              prioritizing internally, and Fierce quoted Islam acknowledging that expensive trials mean Beeline will
              need future funding eventually. Those points do not negate the financing strength, but they remind
              investors that Beeline is simultaneously a confidence story and a portfolio-triage story: strong capital
              was needed precisely because these programs were important enough to advance, but not important enough for
              Bristol Myers Squibb to keep as internal priorities.
