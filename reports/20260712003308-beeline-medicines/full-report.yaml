  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Lupus competitive stack
        blocks:
          - type: paragraph
            body: >-
              Beeline's lead asset afimetoran enters a lupus market that is already segmented by label, route, and
              disease scope. Benlysta is the most established branded incumbent, spanning active lupus and lupus
              nephritis and backed by meaningful 2025 sales. Saphnelo is a more focused SLE competitor with a modern
              lifecycle-management playbook that now includes self-injection, while Lupkynis is narrower in disease
              scope but important because it proves oral lupus-related therapy can be commercial. Beeline therefore does
              not face one monolithic lupus rival; it faces a stack of incumbents that collectively cover broad lupus,
              SLE-specific disease control, and lupus-nephritis-specific oral therapy.


              That stack matters because afimetoran's pitch is not simply that lupus is a large unmet-need category. It
              is that a once-daily oral therapy could combine convenience with meaningful disease control in a way that
              fits earlier and more broadly into specialist practice. Public sources support the route and mechanism
              story, but they do not yet show head-to-head evidence against approved options. Until those data exist,
              Beeline's lupus position is best viewed as strategically interesting rather than commercially proven.


              The result is a competitive field that is attractive but demanding. There is visible unmet need and proven
              spend, yet every major reference point in lupus already has a label, support infrastructure, or both.
