  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and disease burden
        blocks:
          - type: paragraph
            body: >-
              Beeline's market is best understood as a specialty-immunology wedge rather than a generic autoimmune TAM.
              The company has named lupus first, but it also reaches into atopic dermatitis, psoriasis, and future rare
              autoimmune or inflammatory niches through BLN-326 and lomedeucitinib. That means the right first step is
              to define the boundary by indication and treatment context. In the narrowest view, afimetoran competes in
              systemic lupus erythematosus, where CDC estimates about 204,000 people in the United States have SLE. In
              the broader lupus frame, the Lupus Foundation estimates 1.5 million Americans have some form of lupus,
              with SLE comprising roughly 70% of cases and with a strong female skew.


              The dermatology adjacencies are much larger in prevalence terms. National Eczema Association materials
              describe more than 9.6 million U.S. children and about 16.5 million U.S. adults with atopic dermatitis,
              including 6.6 million adults with moderate-to-severe disease. The National Psoriasis Foundation says more
              than 8 million people in the United States have psoriasis. Those larger disease pools do not automatically
              translate into Beeline's launchable market, but they do explain why BLN-326 and lomedeucitinib materially
              change the strategic ceiling versus a pure lupus single-asset company.


              The practical conclusion is that prevalence should be treated as layered evidence, not a sales forecast.
              Lupus gives Beeline a clearer, more urgent initial target; dermatology and rare-autoimmune expansion
              provide the upside narrative. Any investor who jumps directly from broad autoimmune burden to headline TAM
              will overstate what the public evidence really supports today.
