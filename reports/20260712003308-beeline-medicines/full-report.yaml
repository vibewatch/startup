              - CV042
      - number: '8.3'
        title: Scenario analysis and comparable frame
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis is more useful than false precision here. In the bull case, afimetoran produces
              convincingly differentiated lupus data, pivotal planning stays on schedule, and the rest of the platform
              remains fundable without obvious overreach. In that world, Beeline could plausibly bridge toward
              public-immunology comparables or a strategic-takeout path over time. In the base case, the company still
              looks interesting but requires more proof, more capital planning, and tighter asset triage. In the bear
              case, a weak lead readout or financing pressure before a strong inflection forces the investment case back
              toward asset salvage rather than platform premium.


              Public comparables are helpful only as outer frames. Aurinia and SpringWorks show that focused biotech
              companies can live in the low-single-digit billions of market value when they have real assets and
              catalysts. Larger public immunology or specialty-biotech names such as Incyte, Alnylam, argenx, and
              Regeneron show how large the ultimate market can become once proof and commercialization are established,
              but they are far more mature than Beeline. Those comparables support upside existence, not current price
              certainty.
            claimRefs:
