  - id: TV003
    title: 牛市 / 基本 / 熊市场景表
    columns:
      - 场景
      - 概率信号
      - 隐含股权价值区间
      - 工作倍数逻辑
      - 前提条件
      - 下行触发因素
    rows:
      - - 熊市
        - 25%
        - $4.6B-$5.6B
        - 约 2.0x-2.4x trailing sales
        - 增长放缓、利润率耐久性减弱，或监管 / 赞助银行折价扩大。
        - 市场认定 Chime 只配低端金融科技或类银行倍数。
      - - 基本
        - 50%
        - $6.5B-$8.6B
        - 约 2.8x-3.7x trailing sales
        - Q1 盈利大体延续，增长保持体面，且没有新的重大治理或整改冲击出现。
        - 股价维持在接近当前重置水平的区间内。
      - - 牛市
        - 25%
        - $10.4B-$11.6B
        - 约 4.5x-5.0x trailing sales
        - 更多季度盈利、干净执行，以及投资者愿意把 Chime 估得更接近 SoFi / Dave，而不是类银行贷款机构。
        - 如果市场仍拒绝回到接近 IPO 的估值水平，重估会停住。
    notes: 区间是使用 trailing revenue 和当前上市同业交易水平得出的股权价值区间，不是 DCF 输出。
