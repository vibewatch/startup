      - number: '6.4'
        title: 具名证据偏轶事而非企业级，评论情绪随场景强烈分化
        blocks:
          - type: paragraph
            body: >-
              因为 Chime 服务消费者而非具名企业，公开证据集不同于 B2B 案例研究章节。本轮最好的直接会员证据来自第一人称评论界面。在 Apple 评论页，一名评论者说，被推荐的朋友试用后把工资直存、账单和房租都搬到了
              Chime；另一名则称，无透支费、提醒和自动储蓄让这个产品胜过传统银行。Trustpilot 提供了互补但不那么亮眼的窗口。一名评论者称，提前工资直存、SpotMe、MyPay
              和分期贷款多次帮他应对紧急情况；另一名则称，一笔有争议的未授权交易被拒赔，信任随之消失。规模化后，情绪分裂在评分里很明显：Apple 显示 1.5 million 个评分下为 4.8 / 5，而
              Trustpilot 在 12,183 条评论下为 3.8 / 5。编辑评测落在两极之间。NerdWallet 和 BestMoney 对免费银行和应用质量大体正面，但 TopConsumerReviews 只把
              Chime 评为 Fair。务实解读是，Chime 在日常可用性和费用减免上取胜，但一旦涉及争议、支持、现金访问或账户迁移等边缘场景，客户体验会迅速变弱。
