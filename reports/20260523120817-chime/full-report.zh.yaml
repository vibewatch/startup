      - number: '6.5'
        title: 客户信任是 Chime 最大的定性短板：纯数字银行模式会放大客服和宕机故障
        blocks:
          - type: paragraph
            body: >-
              反向证据太重，不能塞进脚注。CFPB 称，Chime 在数千起案例中未能在账户关闭后十四天内寄出退款，又在另外数千起案例中超过九十天才退款，导致部分消费者一度缺钱买食品、加油、付房租。California
              DFPI 另行要求 Chime 提供 24/7 客服、加强人员配置和培训，并强化投诉处理流程。随后，2026 年 4 月，服务中断和数据泄露相关诉讼给信任又一次冲击。Banking Dive
              报道，三起拟议集体诉讼指称个人信息被盗，并存在持续身份盗用风险；ClassAction.org
              称，事件可能影响数千人，部分用户无法访问资金或查看余额。这些都没有推翻核心产品的强度；数百万会员看起来仍然活跃且高频使用。但它确实说明了无网点模式的下行长什么样：客服、争议处理或系统可用性一旦失灵，会员无法走进网点，原本便利的产品会突然显得不安全。综合来看，Chime
              的客户基本盘在获客、主账户地位和日常效用上很强；但管理层披露更好的留存队列，并证明运营整改已压低投诉强度之前，信任韧性只能算中等。
