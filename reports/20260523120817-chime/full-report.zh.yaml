  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: KPI 卡片说明，按公开证据看 Chime 已不再昂贵，但风险还没低到足以支撑溢价倍数。
    data:
      items:
        - label: 当前市值
          value: $6.78B
          detail: May 22, 2026 实时公开股权价值
        - label: 当前 EV / 销售额
          value: ~2.5x
          detail: 显著低于 SoFi、Nu 和 Dave
        - label: IPO 估值
          value: $11.6B
          detail: June 2025 定价锚
        - label: 2021 年私募峰值
          value: $25B
          detail: 可作情绪上限，不是当前锚点
        - label: 净现金
          value: ~$0.98B
          detail: 为正，但部分现金仍支撑产品和准备金结构
        - label: 回购支撑
          value: $200M
          detail: 若全部执行，按当前报价约占股份的 2.9%
        - label: 估值立场
          value: Fair-to-attractive
          detail: 当前价格合理；若执行保持干净，仍有上行空间
    approximationNotes: KPI 卡片把当前市场数据页面、监管文件和管理层披露合并成一张决策快照。
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV020
      - CV021
      - CV022
      - CV023
      - CV049
