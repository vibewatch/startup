      - number: '7.5'
        title: 财务、宏观和执行风险如今集中在质量、透明度和规模管理
        blocks:
          - type: paragraph
            body: >-
              财务/模式风险现在更多关乎质量和透明度，而不是立即生存。Q1 2026 业绩强劲，但管理层也称该季度受益于退税季节性。同时，随着 MyPay 和 Instant Loans 放量，平台收入增长 50% 至
              $215 million。战略上这是正面的，因为 Chime 正在摆脱对基础交换费的单一依赖；但它也扩大了风控和承保面。10-K 称，2025 年随着 MyPay
              放量，交易和风险损失增加，流动性产品扩张后可能继续上升。管理层披露的缓释因素令人鼓舞——MyPay 在 Q1 的损失率保持 1%，重复借款人的 Instant Loan
              损失相较首次借款人改善——但投资者仍看不到按产品拆分的损失、准备金和分批次全景。资产负债表有帮助，却不能消除风险：文件披露 $475 million 循环信贷额度，且截至 2026 年 3 月 31
              日无提款，因此融资压力不是基准情景问题。更细的宏观问题在于 Chime 服务谁。Federal Reserve 和 Cleveland Fed
              研究显示，低收入和银行服务不足消费者在银行与信贷获取上仍有缺口，非常看重低费用、速度和安全，对存款延迟或难解决的争议尤其敏感。这让 Chime
              的目标市场有吸引力且规模很大，但也让收入和信任比更富裕、基于网点的客群更具周期性。
