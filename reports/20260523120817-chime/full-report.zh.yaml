              周缩短到最快三天。这类内部平台杠杆在消费金融科技里很有分量，因为它会与工资直存规模、更好的风险模型和更快产品发布叠加。路线图也指向当前支票账户加流动性组合之外，Prime、Workplace、投资、联名和托管账户，以及面向消费者的
