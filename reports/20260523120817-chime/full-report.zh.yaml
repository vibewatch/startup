  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值重置和实时公开市场锚
        blocks:
          - type: paragraph
            body: >-
              核心估值事实是，Chime 的重置已经不是假设。公司从 2021 年私募峰值 $25 billion、$69 股价锚，走到 2025 年 6 月 IPO 定价 $27/share、估值约 $11.6
              billion；实时公开市场现在按 $17.80 股价给股权约 $6.78 billion 估值。这意味着投资者已经不需要为私募高峰期的狂热买单。他们要定价的是一家新上市的消费者金融科技公司：股价已比 IPO
              估值低约 42%，比私募峰值低约 73%，同时业务质量却在改善。Q1 2026 收入达到 $647 million，毛利达到 $580 million，净利润达到 $53 million，活跃会员达到 10.2
              million。核心解读是，Chime 的价格重置已经发生，而披露的经营表现仍在增强。因此，本章不需要宏大叙事来解释股票为什么还能从这里上涨；它需要一个纪律化答案：今天剩余折价是合理、过度，还是介于两者之间。
