      - number: '4.4'
        title: 历史亏损状况大幅改善，但交换费和合作银行脆弱性仍定义下行情景
        blocks:
          - type: paragraph
            body: >-
              历史弧线令人鼓舞。Chime 的 S-1 显示，净亏损从 2022 年的 $470.3 million 大幅收窄至 2023 年的 $203.2 million，再到 2024 年的 $25.3
              million；2025 年年报称，收入随后又增长 31% 至 $2.2 billion，活跃会员达到 9.5 million。年报还把 ChimeCore 描述为真正的结构性优势，称交易处理成本下降约
              60%，服务成本降至远低于大型和区域银行的水平。如果这些说法继续成立，Chime 就不再只是一个消费金融科技规模故事，而越来越像一个经营杠杆故事。


              但下行情景仍然集中。Chime 仍高度依赖由合作银行交换费经济性支撑的支付收入；10-K 也明确警告，如果任何银行合作方失去 Durbin 小发行机构豁免，支付收入可能受损。同一批文件还称，随着 MyPay
              扩张，2025 年交易和风险损失上升；随着流动性产品扩张，交易利润率可能持平或下降。最后，合作银行合同的公开披露只能算部分令人满意：投资者能看到续约机制和准备金结构，却看不到转付费用或终止救济的详细经济性。再加上
              DFPI 对投诉处理的执法行动，脆弱性案例并不是“现金很快耗尽”，而是如果政策、承销或运营恶化，收入质量和合作银行依赖可能很快被重估。
