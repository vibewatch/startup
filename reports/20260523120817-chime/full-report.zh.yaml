      - number: '2.2'
        title: 规模测算视角与采用证据
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个很大的可触达市场，但不给出干净的单一 TAM 数字。最宽的视角很简单：银行账户拥有率在美国已经主流化，2024 年 94% 的美国成年人有银行账户，未开户人群只有
              6%，并不存在一个巨大的未服务人口池。Chime 更相关的机会在这个市场中摩擦更重的部分。Financial Health Network 估计，美国有 24.6 million
              户家庭属于银行服务不足或未开户；Federal Reserve 则称，2024 年仍有 11% 的有账户成年人支付过透支费。Chime 自己的 S-1 还加上一道重要筛选：它称 75% 的美国成年人年收入不超过
              $100,000，而公司认为这一收入区间过去一直与传统银行经济性错配。


              采用证据强于收入 TAM 披露。Simon-Kucher 称，新银行已拿下美国新开户的 40%，28% 的客户把新银行作为主要银行关系，70% 强烈偏好数字渠道。但公开数据也显示天花板：Raisin 称，只有
              15% 的美国人想要完全数字化体验，48% 仍偏好混合模式。因此，本章对 Chime 机会的测算应当是主流银行内部的大规模行为迁移，而不是没有既有机构或渠道摩擦的干净绿地市场。
