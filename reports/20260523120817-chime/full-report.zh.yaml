      - number: '4.3'
        title: 资产负债表流动性看起来健康，但流动性产品仍会吃掉真实资金和准备容量
        blocks:
          - type: paragraph
            body: >-
              资产负债表已不再像一家显然需要再融一轮股权才能继续前进的公司。截至 2026 年 3 月 31 日，Chime 披露现金及现金等价物 $607.7 million、可出售证券 $403.6
              million、产品抵押品 $231.5 million、持有至投资贷款 $105.8 million。总资产 $1.95 billion，对应负债 $508.9 million；Q1
              经营现金流从上年同期为负转正至 $87.5 million。这些事实实质性改变了融资讨论：公开证据现在支持公司在不计任何债务容量前，拥有超过 $1.0 billion 的流动性缓冲。


              但这并不意味着模型像纯软件一样资本轻。Chime 的短期限借贷和已赚工资产品仍会占用抵押品、准备金账户、受限现金和资产负债表应收款。S-1 和 10-Q 显示，公司必须在 Stride 维持 MyPay
              资金余额，在 Bancorp 维持准备金结构，同时还背着一笔未提款但规模可观的 $475 million 循环信贷额度，必要时可托底流动性。因此，重要的尽调判断要更细：Chime
              看起来足以支撑当前已披露增长计划，但流动性产品和合作银行结构带来的现金管理复杂度，高于公司免费消费者营销所暗示的水平。
