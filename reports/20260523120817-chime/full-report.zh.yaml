      - number: '3.2'
        title: 直接挑战者正在复制核心日常资金任务
        blocks:
          - type: paragraph
            body: >-
              直接竞争者拥挤，是因为 Chime 过去的多数功能优势如今都能在竞争对手主页上看到。Cash App 把免月费与储蓄、ATM 访问、透支缓冲、借款和庞大的主银行用户群组合起来，已经不只是侧边钱包。SoFi
              从相反方向切入：它有银行牌照，是更宽的“全能应用”，把免费银行服务包在更广的产品栈里，并能交叉销售贷款、投资和更新的资产类别。Varo 是最接近 Chime
              传统大众市场叙事的持牌类比对象，因为它把提前领薪、轻费用银行、短期流动性和信用建设与直接持有银行牌照结合起来，而不是依赖合作银行。Dave
              更窄，但直接争夺工资到账时间和规避透支这份工作，而这份工作常常把用户拉进主账户。Current 披露规模也更窄，但 Build
              Card、工资绑定奖励和青少年银行围绕同一客户队列形成黏性行为循环。简言之，Chime 仍然强，但直接竞争领域如今在那些曾经看起来独特的功能上高度重叠。
