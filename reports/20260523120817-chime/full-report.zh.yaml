  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 基于 Chime 滚动收入的市销率敏感性显示，即使温和重估，也能带来上行空间，并不需要回到 2021 年私募市场的亢奋水平。
    data:
      items:
        - label: 2.0x 销售倍数
          value: 4.64
          unit: USD bn
          detail: 如果市场转向类银行或承压金融科技公司视角，这是深度悲观底部
        - label: 2.4x 销售倍数
          value: 5.57
          unit: USD bn
          detail: 悲观区间上沿
        - label: 2.9x 销售倍数
          value: 6.78
          unit: USD bn
          detail: 当前市值附近
        - label: 3.7x 销售倍数
          value: 8.58
          unit: USD bn
          detail: 基准区间上沿
        - label: 4.5x 销售倍数
          value: 10.44
          unit: USD bn
          detail: 乐观重估，靠近更高质量上市金融科技公司区间
        - label: 5.0x 销售倍数
          value: 11.6
          unit: USD bn
          detail: 大致回到 IPO 估值锚
    approximationNotes: 数值基于约 $2.32 billion 的滚动收入计算，并四舍五入到两位小数。
