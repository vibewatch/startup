      - number: '8.5'
        title: 尽调路径和投资逻辑失效点
        blocks:
          - type: paragraph
            body: >-
              最终判断仍应有条件，而不是自满。上行情景成立，前提是 Chime 能证明 Q1 2026
              是许多可持续上市公司季度的开端，而不是被季节性或一次性经营杠杆美化的单季里程碑。最重要的未解尽调问题很直接：未来还有多少股权薪酬和净发行，IPO 后内部人士供给还剩多少，以及 Chime
              现金头寸中有多少真正可以自由分配，而不是结构性支撑产品抵押品和准备金要求。如果新的投诉处理或赞助银行问题出现，投资逻辑会比市场愿意承认的更快失效。这些不是抽象风险。正是这些原因让 Chime
              仍远低于高溢价金融科技同业。换句话说，股票今天可以合理且有吸引力，同时仍对执行高度敏感。只有未来几个季度继续消除这些具体折价理由，投资者才应上调立场。
