  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 总体风险态势：核心下行是结构性，不只是周期性
        blocks:
          - type: paragraph
            body: >-
              Chime 的风险堆叠更多是结构性问题，而不是急性流动性。文件和政策页面说得很清楚，Chime 仍架在外部牌照上：The Bancorp Bank 或 Stride Bank 发行账户和卡，Durbin
              下合作银行的小发行机构身份仍支撑对模型最关键的借记卡经济性。这种设置意味着，赞助银行、卡组织和账务记录任何一端承压，都可能打到消费者体验和利润率。它比一般金融科技合作伙伴风险更重要，是因为几个最大风险已经不再是假设。CFPB
              和 DFPI 命令记录了退款缓慢和投诉处理不佳；2026 年 4
              月的宕机诉讼显示，服务事件可以多快转成无法访问余额、身份盗用风险和无网点平台信任受损等索赔。近期盈利降低了紧急融资风险，但没有解决合作伙伴集中、监管反复，或 MyPay 和 Instant Loans
              带来的运营复杂性。把发生概率、严重性和缓释成熟度放在一起，Chime 应按中高整体风险纳入投资假设：不是破损资产，但下行仍主要由外部银行依赖和服务信任脆弱性主导。
