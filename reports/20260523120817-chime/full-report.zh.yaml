chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、客户承诺与银行基础设施
        blocks:
          - type: paragraph
            body: >-
              进入 2026 年，Chime 已是一家新近上市的美国消费金融科技平台，主张看似简单：让过去为基础银行服务付出过多费用的人，也能把主账户用顺。公司官方表述仍强调，Chime
              是金融科技公司，不是银行；核心支票、储蓄、借记卡和存款保险功能由 The Bancorp Bank, N.A. 或 Stride Bank, N.A. 提供。这个区分有战略意义：Chime
              掌握会员体验、产品打包、支持模式、数据层和市场打法，却不持有银行牌照。因此，它的运营模型把软件驱动的消费者获客和受监管银行基础设施拼在一起，不建网点、不持有自己的受保存款银行牌照，也能提供免月维护费、无最低余额要求、提前工资直存、免费透支、按需流动性和信用建设功能。


              上市公司披露也说明，Chime 的商业模式并不是“免费银行”慈善，而是一套利益对齐的变现系统：会员越活跃使用账户，公司越能赚钱。管理层反复强调支付和交换费收入是经济核心，再通过
              MyPay、即时转账、Instant Loans 等产品叠加快速增长的平台相关收入。这个框架与公司过往媒体画像一致，也符合 10-Q 披露：合作银行收取交换费，并将部分金额转给
              Chime。后续章节的关键结论是：Chime 的身份不只是一个数字银行品牌，而是搭在合作银行资产负债表基础设施上的软件与分发层，服务的是希望日常金融工具更便宜、更宽容的美国主流消费者。
