      - number: '8.3'
        title: 资本结构、稀释和老股背景
        blocks:
          - type: paragraph
            body: >-
              资本结构状况好于私募后期，但并非毫无摩擦。最重要的简化是优先股堆叠已经消失：2026 年 3 月 10-Q 显示没有在外优先股，因此当前要判断的是普通股价值，而不是清算优先权。按公开市场数据页面，Chime
              仍为净现金为正，进一步降低了看似较低企业价值背后藏着脆弱资产负债表的风险。但股权并没有神奇地变干净。公司仍有约 382.6 million 股普通股在外、双重股权结构和每股 20 票的 Class
              B；内部人士仍持有全部 32.13 million 股 Class B。IPO 还包含有意义的老股出售，因此既有持有人已经获得部分流动性。与此同时，新的 $200 million
              回购授权可以抵消一小部分稀释，但按今日价格只覆盖当前股本约 2.9%。实际结论是，Chime 的估值压力不再来自风险投资优先权；而是普通上市公司的稀释、供给和治理集中。
