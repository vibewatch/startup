      - number: '1.2'
        title: 创始人延续、管理层厚度与治理深度
        blocks:
          - type: paragraph
            body: >-
              Chime 已在 2025 年完成大市值 IPO，但领导故事仍异常以创始人为中心。Chris Britt 仍任联合创始人、CEO 和董事长，Ryan King
              仍任联合创始人和董事，最初的产品与技术创始组合继续留在组织顶端。Britt 的背景很关键，因为 Chime 的模型明确吸收了他在 Green Dot 和 Visa
              得到的经验：工资直存能带来黏性的主账户行为，交换费可以在规模化后支撑低费率主张，主流中低收入消费者又常被传统机构错价或服务不足。Forbes 2024
              年的报道进一步印证，公司一开始就是为富裕海岸科技人群之外的人群刻意打造的。King 在 Plaxo / Comcast 的经历和 Stanford 背景，则用消费者软件执行力和基础设施深度补上这套商业逻辑。


              更大的管理层班底比 Chime 还是私人独角兽时更制度化，公开市场资料列出了 CFO、COO、CTO、增长负责人和人力负责人。不过，公开披露仍比成熟银行通常给投资者的信息更薄。当前 10-K 和 10-Q
              的运营指标很丰富，但董事会构成叙述偏少；易获得的公开资料也无法完全核对委员会结构、创始人投票影响力，或 IPO 后剩余投资人指定治理权。因此还留下治理可见度缺口：Chime 已不再是纯 VC
              支持的创业公司，但监督透明度还没有完全追上新的上市公司身份。创始人带队的延续性在运营上大多是优势，但也让叙事、产品和利益相关方信任比同等规模银行控股公司更集中在 Britt 身上。
