  - id: TV005
    title: 投资逻辑破裂与终止触发表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 盈利能力退坡
        - 连续多个季度 GAAP 盈利反转，且没有清晰的投资性解释
        - 削弱公开市场重估已经过度偏离基本面的判断
        - 把立场从合理偏有吸引力调回单纯合理或更差
      - - 会员增长明显放缓
        - 活跃会员增长停滞，ARPAM 也不再改善
        - 削弱其应拿金融科技倍数、而不是低增长类银行倍数的论点
        - 把情景区间压向 2.0x-2.4x 销售额
      - - 监管或投诉问题再度反复
        - 出现新的 CFPB、DFPI 或合作银行整改事件
        - 把发起银行和执行折价重新定得更高
        - 把相对 SoFi / Nu 的折价视为合理，而不是暂时性
      - - 发起银行经济性恶化
        - 任何披露变化威胁交换费分成或核心合作伙伴稳定
        - 击中核心变现逻辑，而不只是情绪
        - 立即按悲观区间承销
      - - 股本缓慢膨胀跑赢回购
        - SBC 带来的净发行显著超过回购注销
        - 即使企业价值上升，也会压低每股上行空间
        - 要求更低入场价，或更清楚的稀释桥
      - - 缺少新证据却快速重估
        - 在更多干净季度出现前，股价先回到接近 IPO 等价值
        - 把合理偏有吸引力的配置变成偏紧配置
        - 停止加仓，等下个业绩周期后重评
    notes: 每个触发项都能用监管文件、业绩稿、监管行动或简单的市值变动跟踪。
    claimRefs:
      - CV014
      - CV015
