      - number: '4.2'
        title: 公开单位经济性对新银行来说异常好，但一些最好看的指标仍由管理层筛选
        blocks:
          - type: paragraph
            body: >-
              现在的利润率栈比过去私人独角兽叙事暗示的好得多。Q1 2026，Chime 实现毛利 $580.3 million、毛利率 90%，交易利润 $491.4 million、交易利润率 76%，调整后 EBITDA
              $119 million、利润率 18%，GAAP 净利润 $53 million。公开参与度指标也朝正确方向走：活跃会员达到 10.2 million，ARPAM 升至 $263，购买金额达到 $39
              billion；管理层称，近半会员每月使用担保信用卡，推动基于信用的购买金额达到总消费的 25%。最后一点很关键，因为更高收益率的卡组合，是在不增加醒目费用的情况下提升变现最干净的方式之一。


              最好的增量证据来自获客效率和流动性产品表现。管理层称，早期参与度举措把 CAC 回本周期降至五到六个季度；队列在扣除流失后仍保留超过 100% 的美元计交易利润；LTV / CAC 超过 8x。MyPay
              被描述为年化运行率超过 $400 million、交易利润率 62%、损失率 1% 的业务；Instant Loans 在 Q1 放款达到 $180
              million，重复借款人的损失表现明显更好。需要警惕的是，管理层也说 Q1 受益于退税季节性，并指引年内剩余时间交易利润率降至 70% 至 72%，额外的 Prime 相关销售、营销和支持支出会把 Q2 增量
              EBITDA 利润率压到 50% 出头。因此，单位经济性故事很强，但还没有完全常态化。
