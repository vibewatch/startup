  - id: FR003
    title: 依赖关系图 —— Chime 的关键合作伙伴、政策和支持依赖
    type: dag
    layout: wide
    summary: Chime 夹在会员和多层外部控制之间：Bancorp 与 Stride 承接受保账户，卡网络规则决定交易经济性，监管机构监督经营行为，自己的数字支持 / 争议处理栈负责出事后的恢复。
    data:
      nodes:
        - id: bancorp
          label: The Bancorp Bank
        - id: stride
          label: Stride Bank
        - id: fdic-pass-through
          label: 穿透式存款保险
        - id: card-network-rules
          label: 卡网络 / Durbin 经济性
        - id: chime-platform
          label: Chime 应用与服务平台
        - id: support-disputes
          label: 支持与争议处理流程
        - id: mypad-loans
          label: MyPay 与 Instant Loans
        - id: regulators
          label: CFPB / DFPI / 银行监管机构
        - id: members
          label: 会员与直接入账关系
      edges:
        - from: bancorp
          to: fdic-pass-through
          label: 部分会员受保账户记录
        - from: stride
          to: fdic-pass-through
          label: 部分会员受保账户 / 卡片记录
        - from: fdic-pass-through
          to: members
          label: 仅在合作银行条件下提供保障
        - from: card-network-rules
          to: chime-platform
          label: 路由与经济性约束
        - from: bancorp
          to: chime-platform
          label: 银行合作伙伴集成
        - from: stride
          to: chime-platform
          label: 银行合作伙伴集成
        - from: regulators
          to: bancorp
          label: 银行合作伙伴监督
        - from: regulators
          to: chime-platform
          label: 经营行为 / 投诉监督
        - from: mypad-loans
          to: chime-platform
          label: 收入增长叠加信用敞口
        - from: chime-platform
          to: support-disputes
          label: 登录、支持与争议发起
        - from: support-disputes
          to: members
          label: 欺诈或宕机后的恢复路径
        - from: chime-platform
