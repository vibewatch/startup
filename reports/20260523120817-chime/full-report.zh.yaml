      - number: '7.2'
        title: 监管、法律和治理风险已经兑现，不是假设
        blocks:
          - type: paragraph
            body: >-
              监管记录最清楚地说明，Chime 的下行是真实的，不是理论风险。CFPB 称，公司在数千起案例中未能在账户关闭后 14 天内发放退款，又在另外数千起案例中超过 90 天，并下令至少 $1.3 million
              补偿和 $3.25 million 民事罚款。California DFPI 另行处以 $2.5 million 罚款，并要求 24/7 客服、更强人员配置和培训，以及更好的投诉处理流程。更早的 2021 年
              California 品牌和解仍然重要，因为它抓住了模式里的核心法律张力：Chime
              想让消费者感觉它就是主要银行关系，但法律上只是叠在持牌合作伙伴之上的非银行界面。治理能缓和部分风险，却不能消除风险。委托书显示双重股权结构，Class B 股每股 20 票；创始人 Chris Britt 仍任
              CEO 和董事长；内部人士作为一个群体仍持有大量 Class B。上市公司委员会和风险监督流程已经存在，但控制权仍明显由创始人主导，而不是银行式或广泛分散。一个现场尽调缺口仍未关闭：本轮访问中，当前存款账户协议
              URL 被拦截，因此在给诉讼敞口定价前，应直接复核现行有效的仲裁和账户关闭条款。
