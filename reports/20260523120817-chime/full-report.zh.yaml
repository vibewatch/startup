      - number: '8.4'
        title: 情景和估值判断
        blocks:
          - type: paragraph
            body: >-
              情景测算指向一个已经包含当前股价的基准情景。按约 $2.32 billion 往绩收入，2.0x 至 2.4x 销售额的悲观区间意味着约 $4.6 billion 至 $5.6 billion
              股权价值，对应市场认为 Chime 因赞助银行和整改风险应享有更大折价。2.8x 至 3.7x 的基准区间意味着约 $6.5 billion 至 $8.6 billion，并稳稳覆盖当前报价。4.5x 至
              5.0x 的乐观区间意味着约 $10.4 billion 至 $11.6 billion，大致回到 IPO 区域，但仍远低于旧的 $25 billion 私募峰值。这个框架决定了本章立场。按公开证据，Chime
              不再显得偏高。相反，股票看起来合理到有吸引力：足够有吸引力，纪律型投资者可以选择性买入；但并未便宜到可以忽略入场纪律或尽调。市场已经明显惩罚公司；现在 Chime 需要证明折价应继续收窄。
