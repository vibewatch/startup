  - id: TV004
    title: 可比估值表
    columns:
      - 参照
      - 日期 / 状态
      - 收入基数
      - 股权 / EV 锚点
      - 隐含倍数视角
      - 参考意义
      - 局限
    rows:
      - - Chime 当前公开市场定价
        - May 22, 2026 / 实时
        - $2.32B 滚动收入
        - $6.78B 市值；约 $5.8B-$5.9B EV
        - 约 2.93x sales；约 2.50x-2.55x EV/sales
        - 直接实时投资判断锚点
        - 上市仅一年，干净公开盈利也只有一个季度
      - - Chime IPO 估值
        - Jun 11, 2025 / 定价
        - $2.2B FY2025 收入在定价时尚未可知；公开市场买家承接的是 2026 年前的证明
        - 按每股 $27 计，估值约 $11.6B
        - 按当前滚动基数，历史上约 5x sales
        - 最硬的公开交易锚点
        - 定价发生在若干 2026 年证据和后续股价重置之前
      - - Chime 2021 年私募峰值
        - Aug 2021 / 历史
        - 私募期增长故事
        - $25B 私募估值
        - 不是有用的实时倍数；只可作为情绪上限
        - 显示周期后段金融科技估值曾比当前市场跑得多远
        - 私募峰值是在完全不同的资本市场环境中定下的
      - - SoFi
        - May 2026 / 实时
        - $3.91B 滚动收入
        - $20.0B 市值；$18.4B EV
        - 约 5.13x sales；约 4.70x EV/sales
        - 已规模化的上市金融科技基准，产品广度更好且拥有银行牌照
        - 产品集比 Chime 更宽，资产负债表组合也不同
      - - Nu
        - May 2026 / 实时
        - $7.59B 滚动收入
        - $61.9B 市值；$52.1B EV
        - 约 8.15x sales；约 6.86x EV/sales
        - 高溢价的大型数字金融基准
        - 地域、盈利轨迹和市场叙事都不同于 Chime
      - - Dave
        - May 2026 / 当前
        - $605M 过去十二个月收入
        - $2.90B 市值；$2.99B EV
        - 约 4.80x 销售额；约 4.95x EV/销售额
        - 近期增长强劲的美国消费金融科技可比公司
        - 规模小得多，信贷组合也不同
      - - LendingClub
        - May 2026 / 当前
        - $1.37B 过去十二个月收入
        - $1.80B 市值；$1.01B EV
        - 约 1.31x 销售额；约 0.74x EV/销售额
        - 为低倍数公开参照提供类银行 / 类贷款机构底部
        - 业务模型更偏贷款，和日常资金超级应用更不像
    notes: 这一组覆盖本章选定的公开股票锚点：Chime 当前与历史锚点，加上最适合框定消费金融科技倍数区间的四家公开同行。
    enumerationScope:
