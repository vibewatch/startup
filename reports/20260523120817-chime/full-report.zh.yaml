  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 决策路径从估值硬重置和基本面改善出发，经过同业折价与残余模型风险，落到合理至有吸引力的判断：可以按纪律控制入场仓位。
    data:
      nodes:
        - id: n1
          label: 硬重置已经发生
          detail: $25B 私募峰值 -> $11.6B IPO -> 当前市值约 $6.8B
        - id: n2
          label: 业务质量改善
          detail: Q1 收入 $647M，净利润 $53M，活跃会员 10.2M
        - id: n3
          label: 同业折价清晰可见
          detail: Chime 的销售倍数低于 SoFi、Nu 和 Dave
        - id: n4
          label: 资本结构更干净
          detail: 无在外优先股；净现金仍为正
        - id: n5
          label: 模型风险折价仍在
          detail: 发起银行、交换费和补救压力仍是压制因素
        - id: n6
          label: 当前判断
          detail: 合理至有吸引力；选择性吸纳，不追逐快速重估
      edges:
        - from: n1
          to: n6
          label: 形成入场吸引力
        - from: n2
          to: n6
          label: 支撑上行空间
        - from: n3
          to: n6
          label: 显示重估空间
        - from: n4
          to: n6
          label: 简化股权逻辑
        - from: n5
          to: n6
          label: 限制确信度
    approximationNotes: 本图概括决策逻辑，并非机械评分模型。
