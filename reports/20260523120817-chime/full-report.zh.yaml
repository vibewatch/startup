      - number: '7.3'
        title: 合作银行和模式依赖，是关乎投资逻辑的集中风险
        blocks:
          - type: paragraph
            body: >-
              赞助银行架构仍是 Chime 最重要的结构性集中。The Bancorp 自己的合作公告称，长期延期让 The Bancorp 继续担任关键银行合作伙伴和存款账户持有人；Chime
              的政策页面也重申，银行服务、发卡和穿透式存款保险都依赖 Bancorp 或 Stride，而不是 Chime 自身。说白了，Chime
              拥有品牌、软件、获客、客服和大量产品逻辑，但不拥有受监管的存款或发卡行栈。这同时影响经济性和连续性。Chime 文件反复警告，合作银行是否符合 Durbin
              小发行机构豁免，会影响借记卡交换费经济性；同一批文件还依赖合作银行和第三方遵守网络规则与服务水平。公开语料对当前结构讲得多，对应急方案讲得少：The Bancorp
              的公开文件索引可见，但本轮可访问资料没有写明核心合作方退出或被整改时的备用赞助银行计划、迁移时间表或终止经济条款。只要关系保持稳定，这个缺口还可容忍。一旦合作银行经济性、穿透式保险机制或监管姿态变化，Chime
              的利润率和会员体验可能比单看损益表所显示的更快重估。
