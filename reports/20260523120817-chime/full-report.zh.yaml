        title: 参与度看起来真实，交叉销售在扩大，但公开忠诚度证据仍止步于队列留存之外
        blocks:
          - type: paragraph
            body: >-
              Chime 最强的忠诚度证据是行为性的，不是合同性的。年报称会员平均每月交易超过 50 次；10-Q 称多数是主要关系用户；产品策略也越来越奖励加深关系的会员。SpotMe、MyPay 和 Instant
              Loans 在 2025 年末的年化发放量超过 $40 billion，平台收入在 Q1 2026 同比增长 50%。这意味着客户不只是把一张免费提现卡放着备用；至少一部分客户在反复用 Chime
              处理短期流动性和相邻金融任务。Prime 和 Plus 把这套逻辑讲得很明白。每月交付至少 $3,000 合格工资直存的会员可解锁 Prime，获得 5% 返现和 3.75% APY；较低工资直存门槛则解锁
              Plus 奖励。Chime 和合作方材料还声称，自报满意度强：97% 的会员称 Chime 帮助解锁财务进步，一份支持合作伙伴案例研究称公司现在每月处理超过 1 million 通电话，解决率接近
