  - id: TV006
    title: 最终尽调追问表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 路径
    rows:
      - - 剩余 SBC 与稀释
        - 扣除回购后的期权 / RSU 发行前瞻排期
        - 每股上行空间取决于股数，不只是企业价值
        - 下一份委托书和股权薪酬附注
      - - IPO 后二级供给
        - 内部人出售、禁售期结束影响和任何大宗交易的汇总记录
        - 即使经营强劲，意外供给也会压住重估
        - Forms 4、13D / 13G、后续发行文件
      - - 可用现金折扣
        - 运营受限的现金和抵押品有多少，真正超额现金有多少
        - 如果支持性余额受限，EV 到股权价值换算可能夸大上行空间
        - 10-Q 储备 / 抵押品披露，加上业绩会追问
      - - 常态化盈利能力
        - 再有两到三个季度证明强季节之外也能盈利
        - 合理偏有吸引力的判断需要证明 Q1 可持续，而不是一次性里程碑
        - 接下来两份业绩稿
      - - 发起银行经济性
        - 关于合作银行经济性或 Durbin 敏感敞口的任何更新披露
        - 相对高端金融科技同行的折价，很大程度是模型风险折价
        - 风险因素和合作伙伴披露
      - - 监管韧性
        - 投诉和退款整改在规模扩大后仍保持干净的证据
        - 新的执法问题会迅速把倍数重置得更低
        - 监测 CFPB、DFPI 和公司披露
    notes: 这些追问是把股票从合理偏有吸引力推向明确有吸引力的最短路径。
    claimRefs:
