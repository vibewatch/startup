companyProfile:
  summary: >-
    Chime 是一家总部位于 San Francisco 的消费金融科技公司。它去掉惩罚性费用，把工资直存、日常消费、短期流动性、储蓄和信用建设包进移动优先体验，做成了美国主流主账户业务。公司通过合作银行 The Bancorp
    Bank, N.A. 和 Stride Bank, N.A. 运营，2025 年 6 月在 Nasdaq 上市；到 2026 年中，活跃会员达到 10.2 million，盈利能力改善，平台也扩大到
    ChimeCore、MyPay、SpotMe、Chime Card 和高级会员层级。它最强的优势是规模、产品效用和成本杠杆；主要压力来自合作银行依赖、监管旧伤，以及产品级经济性披露不完整。
