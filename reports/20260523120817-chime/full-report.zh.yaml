      - number: '6.2'
        title: 大众市场获客仍显顶级，因为 Chime 能把切换意愿转成有资金账户
        blocks:
          - type: paragraph
            body: >-
              客户获取故事已经不只是旧的新银行品牌认知。独立市场份额研究显示，Chime 确实能把意愿转成开户。J.D. Power 称，Chime 在 Q4 2025 新支票账户开设中占 12.8%，并转换了 78%
              的支票账户考虑者和 85% 的储蓄账户考虑者。Crowdfund Insider 2026 年对同一研究的总结称，Chime 在 Q1 2026 大众市场支票账户开设中占 14.2%，仍转换了 76%
              的支票账户线索。The Financial Brand 给出了正确解读：这对传统机构是一个软切换问题，消费者先开第二个账户，再逐渐把它变成主账户。Chime 自己的 Q1
              业绩随后补上一条更偏宣传但方向一致的说法：其新开户量领先下一家金融机构超过 50%。驱动这个飞轮的获客信息简单且面向消费者：免月费、容易储蓄、提前领薪、信用工具和 SpotMe
              式流动性。尚未证明的是，这种切换优势有多少来自雇主和薪资分发，又有多少只是普通应用商店和口碑增长。
