      - number: '1.3'
        title: 资本形成、规模拐点与公开市场重估
        blocks:
          - type: paragraph
            body: >-
              今天的 Chime 规模来自两个很不一样的阶段。第一阶段是私募增长期，公司靠风险资本搭品牌、扩产品宽度和铺分发。Forbes 报道，2021 年那轮融资以 $25 billion 估值融入 $750
              million；TechCrunch 则把 IPO 前累计私募融资估在约 $2.65 billion。这个私募市场高点如今更像建品牌和基础设施所需资本的证据，而不是公允价值锚。第二阶段始于 2025 年 6 月
              IPO，Chime 以每股 $27 出售 32 million 股，包括新股和老股，并以约 $11.6 billion 完全摊薄估值进入公开市场。换句话说，Chime 确实走到了公开市场，但定价比 2021
              年风投基准克制得多。


              运营上，上市公司披露支持一个判断：重估伴随了业务质量的真实改善。2025 年年报称收入增长 31% 至 $2.2 billion，活跃会员达到 9.5 million；Q1 2026 业绩披露收入 $647
              million、毛利 $580 million、净利润 $53 million、活跃会员 10.2 million。Chime 还强调 ChimeCore
              已把核心处理迁入内部，降低成本并加快产品发布。因此，概况图景已经不同于 2021 年投资者看到的那家公司：Chime
              不再只是有品牌故事的大型私人新银行，而是一家已上市金融科技公司，规模得到验证，盈利能力改善，产品栈也更宽，纳入了高级会员、按需薪酬、分期信贷，以及通过 Chime Workplace 做雇主分发。
