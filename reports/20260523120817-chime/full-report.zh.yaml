        title: 产品版图已超出免费支票账户，但工作流仍从主账户工资直存开始
        blocks:
          - type: paragraph
            body: >-
              Chime 公开产品版图已经比最初的新银行叙事更宽。当前栈覆盖支票账户、储蓄账户、SpotMe 透支覆盖、MyPay 已赚工资提前支取、Instant Loans、担保信用建设，以及 Prime / Plus
              高级层级。把这些模块连起来的不是市场型平台或开放 API 生态，而是主账户工作流。Chime 希望会员工资先进入 Chime 支票账户，再让消费、储蓄、信用建设、短期流动性和支持互动都在同一个应用里完成。这就是
              Prime 为什么由工资直存门槛解锁，MyPay 和 Instant Loans 为什么以存款和风险行为为依据，以及 Chime Workplace 为什么即便不是面向消费者的银行产品也很重要。Workplace
              试图把公司更上游地嵌入薪资和工资直存设置，让产品宽度和获客互相强化。公开帮助内容也显示，公司正在把旧版 Credit Builder 机制简化为更统一的担保卡模型，而不是永远保留杂乱的模块扩张。
