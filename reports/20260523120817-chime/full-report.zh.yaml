      - number: '2.4'
        title: 增长驱动、约束与估值含义
        blocks:
          - type: paragraph
            body: >-
              Chime
              市场的下一阶段，受监管塑造的程度不亚于需求。开放银行是顺风，因为它降低切换成本，让消费者更容易把银行历史和支付授权带到更好的服务方。透支改革也在方向上利好挑战者，因为它压缩超大型银行的费用模式，让消费者更容易比价。与此同时，已赚工资提前支取仍处在联邦与州规则混杂的演进期，Chime
              的流动性产品不能被当成无摩擦增长杠杆。


              更深的约束是，美国新银行已经不是新鲜品类。Simon-Kucher 描述的市场里，大约 20
              家有规模的新银行在争同一批客户；由于合作银行模式限制了对利息收入的直接获取，经济性仍偏向交换费和收费型收入。CoinLaw 的盈利能力框架、BPM 对合作银行审查的讨论、Chambers
              对州联邦规则拼图的描述，都指向同一个结论：Chime 参与的是一个巨大且持久的市场，但估值上行取决于它能否证明，主账户深度、雇主分发和产品宽度足以克服监管拖累和结构性拥挤。市场是真的；开放问题是 Chime
              能否同时拿到银行式持久性和金融科技式利润率。
