      - number: '1.4'
        title: 监管旧伤与剩余依赖风险
        blocks:
          - type: paragraph
            body: >-
              概况里最主要的警示线索，是 Chime 的崛起反复引来监管和客服审查。2021 年 California 围绕 “bank” 和 “banking” 用语达成和解，迫使 Chime 在 California 停用
              chimebank.com，并强调自己并非银行。那次事件不致命，却把模型里的长期张力具象化：Chime 希望被消费者视为主要银行关系，但法律上只是叠在持牌合作方之上的非银行界面。2024 年 CFPB 和
              DFPI 行动更严重，因为焦点不是品牌语义，而是具体运营伤害。CFPB 称，数千名消费者在账户关闭后等退款等了太久；DFPI 另行罚款，并要求改善 24/7 支持、人员配备、培训和投诉处理。


              这些问题没有抹掉 Chime 的进展，却会塑造尽调重点。展示增长的同一批披露，也把合作银行关系、交换费规则、第三方可靠性和会员支持质量列为持续风险。Chime
              的主张只有在消费者愿意把工资到账、流动性和日常消费托付给它时才成立；因此，即便短暂服务故障，声誉伤害也会比相邻金融科技应用更大。公司已用更强控制、上市公司治理和更明确的风险披露作出回应，但投资者仍需盯住整改是否持久，以及随着
              Chime 通过 Prime、信贷和职场分发继续上探，合作银行经济性或可靠性会不会变成瓶颈。
