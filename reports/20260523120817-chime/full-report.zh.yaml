          detail: 首个借记账户产品借助合作银行轨道推向市场。
        - date: '2018-01-01'
          label: Get Paid Early
          detail: 直接存款提前到账成为标志性获客钩子。
        - date: '2019-01-01'
          label: SpotMe
          detail: 免手续费透支功能扩大日常用途和留存。
        - date: '2020-01-01'
          label: 信用建设扩展
          detail: 担保信用产品扩展产品组合，也拓宽信用建设故事。
        - date: '2021-03-29'
          label: 加州命名和解
          detail: DFPI 要求 Chime 在加州停止使用 chimebank.com，并澄清其非银行身份。
        - date: '2021-08-01'
