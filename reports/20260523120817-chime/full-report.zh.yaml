      - number: '2.3'
        title: 买方分群、激活与留存路径
        blocks:
          - type: paragraph
            body: >-
              Chime
              的市场不是一个单一的“新银行用户”群体。最重要的队列包括费用敏感的主流家庭、工资直存劳动者、容易被透支收费的消费者、信用建设者，以及现金到账时间波动的零工或小时工。在这些分群里，买方、用户、付款方和预算所有者多数是同一个家庭，所以产品设计比采购流程更重要。雇主渠道是主要例外：借助
              Chime Workplace，HR 或福利负责人可以引入产品，但员工仍是经济终端用户。


              公开运营指标也说明，产品想成为主账户，而不是侧边钱包。Chime 对活跃会员的定义要求近期发生资金流动事件；S-1 称，2025 年初活跃会员月均交易 54 次，其中 75% 与 Chime
              品牌卡消费有关，70%
              的购买活动集中在非可选消费品类。工资直存是解锁高价值功能的门槛，也让流动性产品的还款位置更有利；信用建设和雇主分发的福利则拓宽留下来的理由。剩余尽调缺口不在于这些动作是否存在，而在于确切的分群组合，以及当前各功能渗透率。
