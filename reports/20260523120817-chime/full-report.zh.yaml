      - 当前判断
      - 证据基础
      - 决策含义
    rows:
      - - 推荐
        - 跟踪 / 选择性建仓
        - 当前公开市场倍数已重置，但还没有便宜到足以积极追涨。
        - 只有能承受监管和赞助银行风险时才建仓。
      - - 置信度
        - 中
        - 公开申报和市场数据很丰富，但盈利正常化和稀释还需要再看几个季度。
        - 足够形成区间判断，但不足以支撑虚假精度。
      - - 风险评级
        - 高
        - 赞助银行依赖、交换费敏感性和近期监管伤痕，仍支撑相对高溢价金融科技同业的折价。
        - 暂时不要支付 Nu 式溢价。
      - - 估值立场
        - 合理至有吸引力
        - 按约 2.5x EV/sales 和约 2.9x sales 交易，Chime 低于 SoFi、Nu 和 Dave，但高于 LendingClub 更低的银行 / 贷款机构底部。
        - 如果执行保持干净，当前定价合理且有上行空间。
      - - 入场纪律
        - 偏好市值在约 $8.5B 或以下
        - 这让入场点落在基本情景区间，而不是重估后的牛市情景。
        - 没有新证据时，避免追逐快速回到 IPO 定价附近的涨势。
      - - 上调触发因素
        - 更多季度的持续盈利和干净监管执行
        - 下一次重估需要证据证明 Q1 不只是第一个干净的公开市场季度。
        - 若耐久性得到确认，从合理转向有吸引力。
      - - 主要下行触发因素
        - 压缩至 2.0x-2.4x sales
        - 该熊市区间会把 Chime 拉近低端金融科技或类银行估值框架。
        - 如果增长质量或赞助银行经济性转弱，快速重置判断。
    notes: 判断表以当前公开市场数据、申报和同业交易区间为锚，而不是只看管理层愿景。
