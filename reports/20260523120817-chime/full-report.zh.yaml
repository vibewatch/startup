  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与直接 / 相邻边界
        blocks:
          - type: paragraph
            body: >-
              Chime 不再只和其他无网点支票账户品牌竞争。证据现在指向三层格局：Cash App、SoFi、Varo、Dave、Current 等直接主账户挑战者；Revolut US
              等仍在向更完整美国银行姿态推进的相邻数字金融应用；以及 Ally、Capital One 等数字化传统机构，它们不用金融科技标签，也能满足许多相同的日常需求。Chime 自己的 Q1 2026
              披露在这里很关键，因为它同时显示公司规模和防守姿态：10.2 million 活跃会员、继续声称开户领先，并推出新的高级层级。这个组合说明 Chime
              足够大，已成为该细分市场的参照点；也说明管理层不再假设免费支票账户本身就是足够差异化。竞争集合已经从“其他新银行”扩大到任何有可能成为消费者主要消费、存款、流动性或信用建设归宿的产品。
