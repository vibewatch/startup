  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Chime
              所处的消费银行市场，比“免费支票账户”更宽，但比全服务零售银行更窄。公开文件和公司材料一直把产品栈描述为面向日常美国人的低摩擦主账户关系：存款账户、提前领薪、免费透支覆盖、信用建设、短期流动性和储蓄工具。这种组合把相关市场界定为数字优先的主账户银行服务和现金流管理；雇主分发的财务健康则是相邻渠道，而不是一门单独业务。Chime
              并不试图复制网点银行的完整组合：房贷、财富管理、网点咨询和富裕客户关系银行都不在核心目标里。


              因此，最相关的替代品是传统支票账户、预付卡、发薪日贷款或透支替代方案，以及家庭用来拼接日常资金流动的支付应用。Chime
              盯住的缺口不只是开户便利，而是为不喜欢惩罚性费用结构、资金到账慢或现金流工具碎片化的消费者，提供一个费率更低、绑定工资、移动优先的替代方案。这个框架对后续估值很重要，因为 Chime
              争的是主账户这份工作，而不只是第二钱包位置。
