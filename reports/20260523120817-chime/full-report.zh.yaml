      - number: '5.2'
        title: ChimeCore 把核心处理内化，但架构仍依赖合作银行和外部通道
        blocks:
          - type: paragraph
            body: >-
              公开记录里最重要的技术事实是 ChimeCore。Chime 的文件称，公司 2024 年推出自研支付处理器和账本，并在 2025 年完成迁移，取代此前对 Galileo
              核心交易处理的依赖。管理层把这次迁移与处理成本降低、发布更快、产品控制力更强联系起来，因此 ChimeCore 不只是后台重构。但处理栈仍叠着重要外部依赖。Bancorp 和 Stride
              仍是存款账户和卡的受监管发行方，Visa 仍是卡网络，现金存款通过 InComm，ATM 访问通过 Allpoint、MoneyPass 和 Visa Plus Alliance，向外即时转账通过
              TabaPay，平台本身仍跑在 AWS 上。换句话说，Chime
              把体验中的账本和授权核心内化了，却没有变成垂直一体化银行。这个架构强于纯中间件金融科技公司，但一旦合作关系或供应商表现恶化，仍有可能影响可用性、经济性和监管暴露的集中依赖点。
