              Chime 的 AI 故事在运营上比消费者营销里那些炫技叙事更实在。10-K
              称，公司运行实时数据流平台和自研机器学习平台，用于欺诈、风险、承销、实验和会员支持自动化。这已经是生产栈的重要部分，因为速度和信用损失控制直接关系到 MyPay、Instant Loans
              等产品。最清晰的第三方验证来自 AWS：Chime 称自己在 Amazon Bedrock 中使用 Claude 做通话摘要，并结合 Amazon Transcribe 和 Bedrock
