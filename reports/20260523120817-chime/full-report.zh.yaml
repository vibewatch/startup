      - number: '8.2'
        title: 上市可比公司区间和倍数支撑
        blocks:
          - type: paragraph
            body: >-
              当前上市可比公司不支持把 Chime 称为昂贵。按当前市场数据页面，Chime 约为 2.9x 往绩收入、约 2.5x EV/sales。绝对意义上这不便宜，但明显低于 SoFi、Nu 和
              Dave；这些公司按当前收入倍数交易都高得多，同时 Chime 仍高于 LendingClub 低得多的底部。可比公司传递的信息很重要：Chime 不需要溢价倍数，也能解释从这里往上的空间。只要向 SoFi 或
              Dave 区间下沿靠拢，股票就会明显重估，而不需要公开市场重造 2021 年泡沫，或给 Chime 类似 Nu 的光环。市场已经给出真实的赞助银行、监管和执行折价。因此问题不是 Chime
              是否应该有折价；几乎肯定应该有。问题是，考虑到 Chime 已上市、已盈利、且增长仍快于低倍数类银行同业，当前折价是否已经足够宽。
