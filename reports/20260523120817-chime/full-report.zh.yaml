      - number: '3.4'
        title: 持久性、切换成本与风险集中
        blocks:
          - type: paragraph
            body: >-
              最重要的竞争结论是，Chime 的护城河越来越像分发型，而不是功能型。竞争产品已经复制透支缓冲、提前领薪、信用建设工具、高级包装，以及更广的忠诚度或奖励结构。这并不意味着 Chime
              弱；它的规模、品牌熟悉度和工资直存激活循环仍显得异常强。但这也意味着切换成本有限，而且往往是行为性的，不是合同性的。J.D. Power 的多账户数据和 The Financial Brand
              对软切换的讨论支持一个判断：消费者可以先加第二或第三个账户，再过很久才完全放弃主账户。信任分布也不均。Cash App 的 CFPB 命令对可信度是真实拖累，而 Varo、SoFi、Ally 和 Capital
              One 受益于更强的牌照或银行基础设施控制。尽调关键问题不是 Chime 有没有竞争对手——显然有——而是它能否在竞争对手围绕更广平台或更可信银行栈打包类似功能之前，更快地把费用敏感用户转成持久主账户关系。
