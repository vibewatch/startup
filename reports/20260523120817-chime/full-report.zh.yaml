    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础广且分散，但经济价值集中在把 Chime 作为主账户的会员
        blocks:
          - type: paragraph
            body: >-
              Chime 没有经典企业客户名单；它拥有的是非常庞大的美国零售会员基础。当前最强证据是硬的、官方的：Q1 2026 活跃会员 10.2 million，同比增长 19%，2025 年年末已有 9.5
              million 活跃会员。更重要的客户质量事实不只是规模，而是主账户地位。Chime 的 10-Q 称，大多数活跃会员把 Chime 作为主要金融关系；S-1/A 用行为口径定义这种关系：至少 $200
              的合格工资直存，或每月 15 次及以上卡消费。年报还补充，会员平均每月交易超过 50
              次，并由工资直存锚定；这种习惯强度在消费金融科技账户里异常高。因此，按经典头部客户集中度看，客户基础是分散的；但从经济性看并不分散：披露产品和门槛意味着，最有价值的会员是把工资流、日常消费和流动性需求迁入
              Chime 的人。Workplace 在这里重要，因为管理层把它描述为从源头建立工资直存的方式，尽管公开材料仍没有量化该渠道实际贡献了多少获客。
