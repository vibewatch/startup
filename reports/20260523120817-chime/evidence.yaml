evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: Current post-IPO board committee composition, founder voting control, and any investor-designated board rights.
    whyItMatters: Governance concentration and minority-holder protections affect key-person risk and post-IPO stewardship quality.
    diligencePath: >-
      Review the latest proxy statement, insider ownership filings, and committee charters once fully posted on
      investor-relations and EDGAR mirrors.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: cap-table-and-stakeholders
    missingEvidence: >-
      A full post-IPO cap table with investor ownership percentages, lockup status, and remaining preferred-share
      economics.
    whyItMatters: Without ownership detail, it is hard to assess control, overhang, and future secondary-sale pressure.
    diligencePath: Reconcile the S-1, proxy, 13G/13D filings, and any secondary-sale disclosures into a current ownership table.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: >-
      A company-filed or management-confirmed current employee count for 2026 rather than third-party estimates and
      older media references.
    whyItMatters: Headcount efficiency is part of the ChimeCore operating-leverage narrative and affects scalability assessment.
    diligencePath: >-
      Look for headcount commentary in the proxy, earnings call transcript, or data-provider updates tied to a clear
      company source.
    relatedQuestionRefs:
      - QO016
  - type: missing-source
    severity: material
    topic: partner-bank-economics
    missingEvidence: >-
      Detailed economics of Bancorp and Stride revenue-sharing, service-level obligations, and contingency arrangements
      if one partner exits.
    whyItMatters: Partner-bank dependence is central to Chime's margin durability, regulatory resilience, and service continuity.
    diligencePath: >-
      Review contract disclosures, bank-partner filings, or management commentary for revenue-share mechanics and
      transition protections.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology
    missingEvidence: >-
      A fully exhaustive milestone log with exact day-level dates for every product launch, employer rollout, and
      governance event in Chime's history.
    whyItMatters: >-
      The milestone table is decision-useful already, but exact day-level chronology would make product cadence and
      remediation timing easier to benchmark against peers.
    diligencePath: >-
      Reconcile archived newsroom posts, app-version history, and older press coverage into a day-level chronology
      before any investment-committee packet is finalized.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: public-revenue-tam
    missingEvidence: >-
      Accessible public sources do not provide a well-methodologized U.S. revenue TAM or SAM for digital consumer
      banking that can be reconciled cleanly to Chime's product boundary.
    whyItMatters: >-
      Without a transparent revenue-market estimate, valuation work has to lean on adoption and pain-segment lenses
      rather than a clean top-down market-size model.
    diligencePath: >-
      Obtain paid analyst work from Cornerstone, Insider Intelligence, or comparable banking-market providers and
      reconcile it with Chime's disclosed product scope.
    relatedQuestionRefs:
      - QM006
      - QM027
    relatedTableRefs:
      - TM002
