    {
      "id": "historical-losses-and-fragility",
      "title": "The historical loss profile improved dramatically, but interchange and partner-bank fragility still define the downside case",
      "body": "The historical arc is encouraging. Chime’s S-1 showed a large narrowing of net losses from $470.3 million in 2022 to $203.2 million in 2023 and then to $25.3 million in 2024, and the 2025 annual report said revenue then grew another 31% to $2.2 billion while Active Members reached 9.5 million. The annual report also framed ChimeCore as a genuine structural advantage, claiming transaction processing costs are down about 60% and cost to serve has fallen toward levels far below large and regional banks. If those claims keep holding, Chime is no longer merely a consumer-fintech scale story; it is increasingly an operating-leverage story.\n\nThe downside case remains concentrated, however. Chime still relies heavily on payments revenue funded by partner-bank interchange economics, and the 10-K explicitly warns that payments revenue could be harmed if any bank partner loses the Durbin small-issuer exemption. The same filings also say transaction and risk losses rose in 2025 as MyPay scaled and could keep transaction margin flat or lower as liquidity products expand. Finally, public disclosure around partner-bank contracts is only partly satisfying: investors can see renewal mechanics and reserve structures, but not the detailed economics of pass-through fees or termination remedies. Add the DFPI enforcement action on complaint handling, and the fragility case is not “cash runs out soon”; it is that revenue quality and partner dependence could re-rate quickly if policy, underwriting, or operations deteriorate.",
