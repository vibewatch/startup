    "summary": "Chime entered mid-2026 with public-company scale, a $647 million Q1 revenue base, 90% gross margin, and positive operating cash flow, so the near-term capital story is no longer classic startup burn. The harder underwriting issue is revenue quality: the business is still anchored in interchange pass-through plus fast-growing liquidity products whose realized take rates, charge-offs, and partner-bank economics remain only partly disclosed."
