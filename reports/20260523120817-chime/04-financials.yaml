  "sections": [
    {
      "id": "revenue-mix-and-monetization",
      "title": "Revenue mix is improving, but it is still built on interchange plus liquidity-product monetization",
      "body": "The current public picture is strong on top-line scale and direction. Chime reported $647.4 million of Q1 2026 revenue, of which $432.6 million came from payments revenue and $214.7 million came from platform-related revenue. That means the company is still predominantly monetizing through member card activity, even though the mix is becoming less one-dimensional than it was before the IPO. The most important qualitative shift is that platform revenue is no longer just a grab bag of ancillary fees. The 10-Q explicitly ties a large part of platform revenue to MyPay receivables and separately highlights outbound instant transfer growth, while the earnings materials say the broader platform line is being pushed higher by MyPay and Instant Loans.\n\nThat mix shift matters because Chime is trying to improve revenue quality without abandoning its fee-free consumer brand. Prime and Plus are not classic subscription bundles; they are direct-deposit-gated tiers that use richer rewards, higher savings rates, and better liquidity access to deepen the primary-account relationship. That is strategically cleaner than adding a visible monthly fee, but it also means the company still wins only when members route payroll, spending, and short-term liquidity through Chime at scale. The underwriting conclusion is that diversification is real, but it is still diversification inside one behavioral loop rather than a move to an entirely new monetization model.",
