    {
      "id": "balance-sheet-and-capital-adequacy",
      "title": "Balance-sheet liquidity looks healthy, but liquidity products still absorb real funding and reserve capacity",
      "body": "The balance sheet no longer looks like a company that obviously needs another equity round just to keep moving. At March 31, 2026 Chime reported $607.7 million of cash and cash equivalents, $403.6 million of marketable securities, $231.5 million of product collateral, and $105.8 million of loans held for investment. Total assets were $1.95 billion against $508.9 million of liabilities, and operating cash flow flipped positive to $87.5 million in Q1 after being negative in the year-ago quarter. Those facts materially change the financing debate: public evidence now supports a liquidity cushion north of $1.0 billion before counting any debt capacity.\n\nThat does not mean the model is capital-light in the same way pure software would be. Chime’s short-duration lending and earned-wage products still tie up collateral, reserve accounts, restricted cash, and balance-sheet receivables. The S-1 and 10-Q show that the company must maintain MyPay funding balances with Stride and reserve structures with Bancorp, while also carrying an undrawn but substantial $475 million revolving credit facility that can backstop liquidity if needed. The important diligence view is therefore nuanced: Chime appears adequately capitalized for the current disclosed growth plan, but liquidity products and partner-bank structures introduce more cash-management complexity than the company’s fee-free consumer marketing might suggest.",
