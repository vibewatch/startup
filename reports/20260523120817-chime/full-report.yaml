      - number: '7.6'
        title: Mitigations exist, but the investment only improves if the next diligence pack closes specific gaps
        blocks:
          - type: paragraph
            body: >-
              Mitigations are real, but they are not complete enough to make the chapter low-risk. Chime can point to
              faster dispute handling, lower fraud losses, AI-assisted support, no draw on its revolver, public-company
              governance mechanics, and a stronger multi-product platform. Those mitigants lower the probability that
              one bad quarter becomes a solvency event. They do not solve the three issues that would most quickly break
              the thesis. First, sponsor-bank/Durbin dependence remains the critical structural concentration. Second,
              complaint and dispute durability after CFPB/DFPI remediation still lacks the clean monthly disclosure that
              would show whether the fixes actually held under scale. Third, the April 2026 incident still lacks a fully
              public forensic and docket package that would let investors separate a brief outage from a genuine
              security-control failure. The right underwriting stance is therefore conditional rather than dismissive.
              Chime looks like an improving public fintech, but the next diligence pass should demand sponsor-bank
              contingency terms, product-level loss vintages for MyPay and Instant Loans, post-remediation
              complaint/refund trend data, and the current operative customer-agreement language before treating the
              risk profile as fully normalized.
