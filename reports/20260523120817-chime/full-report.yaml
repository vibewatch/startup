  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation reset and live public anchor
        blocks:
          - type: paragraph
            body: >-
              The main valuation fact is that Chime’s reset is no longer hypothetical. The company moved from a 2021
              private peak of $25 billion and a $69 share-price anchor into a June 2025 IPO priced at $27 per share and
              roughly an $11.6 billion valuation, and the live public market now values the equity closer to $6.78
              billion at a $17.80 share price. That means investors are no longer being asked to underwrite peak-private
              exuberance. They are underwriting a newly public consumer fintech whose stock already fell roughly 42%
              below its IPO valuation and roughly 73% below the private peak while business quality improved. Q1 2026
              revenue reached $647 million, gross profit reached $580 million, net income reached $53 million, and
              Active Members reached 10.2 million. The core interpretive point is that Chime’s price reset has already
              happened while reported operating performance kept strengthening. The chapter therefore does not need a
              heroic narrative to explain why the stock can work from here; it needs a disciplined answer to whether
              today’s remaining discount is deserved, excessive, or somewhere in between.
