      - number: '6.2'
        title: Acquisition still looks elite in the mass market because Chime converts switch intent into funded accounts
        blocks:
          - type: paragraph
            body: >-
              The customer-acquisition story is no longer just old neobank brand awareness. Independent market-share
              work suggests Chime is genuinely converting intent into opened accounts. J.D. Power put Chime at 12.8% of
              new checking openings in Q4 2025 and said it converted 78% of checking considerers and 85% of savings
              considerers. Crowdfund Insider's 2026 summary of the same research said Chime held 14.2% of mass-market
              checking openings in Q1 2026 and still converted 76% of checking leads. The Financial Brand drew the right
              interpretation: this is a soft-switching problem for incumbents, where consumers open a second account and
              gradually make it primary. Chime's own Q1 release then adds the more promotional but directionally
              consistent claim that it was more than 50% ahead of the next financial institution on new-account
              openings. The acquisition message that powers this flywheel is simple and consumer-specific rather than
              prestige-oriented: no monthly fees, easy savings, early pay, credit tools, and SpotMe-style liquidity.
              What remains unproven is how much of this switching advantage comes from employer and payroll distribution
