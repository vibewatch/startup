      - number: '7.4'
        title: Outage, fraud, and reputation risk are amplified by the branchless operating model
        blocks:
          - type: paragraph
            body: >-
              Operational and reputation risk are tightly coupled because Chime has no branch fallback. The official
              status page shows that the company must keep a wide set of rails up simultaneously: card purchases, direct
              deposit, cash deposits, MyPay, dispute filing, login, live chat, and phone support all sit inside the same
              digital service envelope. When that envelope breaks, recovery and remediation can fail together. That is
              what made the April 2026 incident important. Banking Dive reported three proposed class actions after the
              April 1 disruption; plaintiffs alleged Team 313 stole personally identifying information and, in at least
              one case, that inability to view balances contributed to a late rent payment. Chime disputes those claims
              and says only its marketing site plus a separate internal issue were affected, with no member funds or
              data compromised. Even if Chime is right on the merits, the episode shows how quickly trust can swing when
              a paycheck-centered, branchless product is unavailable. The help-center dispute flow reinforces that
              point. Users are told to freeze cards, wait for pending transactions to post, gather documentation, and in
              some cases call support to continue the process. That is operationally reasonable, but it also means the
              customer bears meaningful procedural burden precisely when funds are contested. Third-party signals still
              show the same tension: Trustpilot's archived rating is respectable, yet many complaints focus on denied or
              slow disputes, and NerdWallet explicitly cut Chime's rating because complaint levels look high relative to
              the asset size of its partner banks.
