    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Current pricing sits in the lower half of the base band, leaving upside without needing a return to 2021-style
      private multiples.
    data:
      items:
        - label: Bear
          low: 4.6
          mid: 5.1
          high: 5.6
          unit: USD bn
          note: Compression toward low-fintech or bank-like pricing
        - label: Current market cap
          low: 6.78
          mid: 6.78
          high: 6.78
          unit: USD bn
          note: Live May 22, 2026 public mark
        - label: Base
          low: 6.5
          mid: 7.5
          high: 8.6
          unit: USD bn
          note: Current quote already fits here
        - label: Bull
          low: 10.4
          mid: 11
          high: 11.6
          unit: USD bn
          note: Rerating back toward IPO territory, not back to the 2021 private peak
    approximationNotes: Ranges are equity-value brackets derived from trailing-sales bands, not discounted cash-flow outputs.
