      - number: '4.5'
        title: 'Verdict: financially improved enough to underwrite, but not transparent enough to treat like a mature bank'
        blocks:
          - type: paragraph
            body: >-
              On disclosed numbers alone, Chime now deserves a materially better financial verdict than it did in its
              late-private period. Revenue scale is real, gross margin is high, operating cash flow is positive, the
              revolver is undrawn, and management has enough confidence to authorize buybacks while still guiding for
              2026 growth and EBITDA. The company is also showing the kinds of second-order metrics that investors want
              from a scaled fintech: better card mix, healthy ARPAM growth, a cohort-retention story, and credible
              evidence that liquidity products can be profitable rather than merely promotional.


              But the final judgment should still stop short of “fully underwritten.” The public record is unusually
              rich for a consumer fintech and still thin relative to a mature bank or card issuer. Chime does not give
              public investors a full product-by-product revenue waterfall, realized interchange take rates, cohort
              charge-offs by MyPay versus Instant Loans versus SpotMe, or channel-level CAC by direct, tax, referral,
              and workplace acquisition. Those omissions matter because the current bull case depends on exactly those
              hidden unit-economics details staying favorable as Prime, credit mix, and liquidity products scale. The
              right conclusion is therefore positive but conditional: Chime looks adequately capitalized and
              increasingly profitable, yet the remaining diligence work sits squarely in revenue quality, partner-bank
              economics, and credit-loss transparency rather than in simple top-line growth.
