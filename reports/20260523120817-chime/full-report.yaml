  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Dimension
      - Investment thesis
      - Counter-thesis
      - What changes the view
    rows:
      - - Reset level
        - The stock already reset well below the 2021 private mark and materially below the IPO valuation.
        - >-
          A lower headline price does not automatically make the stock cheap if the discount simply reflects real model
          risk.
        - Show the discount is too wide relative to durable earnings and growth, not just relative to old private marks.
      - - Operating quality
        - Q1 2026 delivered strong revenue growth and positive GAAP profit as a public company.
        - >-
          One quarter of profitability is not the same as a fully seasoned earnings profile across cycles and tax-season
          timing.
        - Confirm profitability and cash generation through additional quarters.
      - - Peer support
        - Chime trades below SoFi, Nu, and Dave on current sales multiples.
        - >-
          Those peers earn their higher multiples through charters, broader product sets, or different risk mixes that
          Chime may not deserve.
        - Prove Chime can sustain growth and margins without new regulatory damage.
      - - Capital structure
        - >-
          No preferred stock remains outstanding, so common-equity underwriting is simpler than in late-private
          fintechs.
        - Dual-class control and ongoing SBC can still dilute minority holders economically or governance-wise.
        - Provide a cleaner forward dilution bridge and insider-selling record.
      - - Secondary context
        - >-
          Existing holders already got some liquidity in the IPO, which lowers pressure for an immediate valuation
          escape hatch.
        - Post-IPO insider supply can still weigh on the stock if lock-up expiry or Form 4 selling accelerates.
        - Track follow-on supply and insider behavior after the next earnings cycle.
      - - Market narrative
        - Current price looks more like disciplined pricing than euphoric fintech premium chasing.
        - >-
          The same discount can also be read as the market correctly pricing sponsor-bank, Durbin, and complaint-history
          risk.
        - The multiple should rise only if operational and regulatory execution keeps improving.
    notes: The anti-thesis emphasizes why a post-reset stock can still be only fair, not automatically attractive.
