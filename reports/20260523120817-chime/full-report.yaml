  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / path
    rows:
      - - Remaining SBC and dilution
        - Forward schedule of option / RSU issuance net of repurchases
        - Per-share upside depends on share count, not just enterprise value
        - Next proxy and stock-comp note
      - - Post-IPO secondary supply
        - Consolidated record of insider sales, lock-up expiry effects, and any block trades
        - Unexpected supply can cap rerating even with strong operations
        - Forms 4, 13D / 13G, follow-on filings
      - - Cash availability haircut
        - How much cash and collateral is operationally trapped versus truly excess
        - EV-to-equity translation can overstate upside if support balances are constrained
        - 10-Q reserve / collateral disclosures plus earnings call follow-up
      - - Normalized profitability
        - Two or three more quarters showing profit outside the strongest seasonal periods
        - A fair-to-attractive call needs proof Q1 was durable, not a one-off milestone
        - Next two earnings releases
      - - Sponsor-bank economics
        - Any updated disclosure on partner-bank economics or Durbin-sensitive exposure
        - The discount versus premium fintech peers is largely a model-risk discount
        - Risk factors and partner disclosures
      - - Regulatory durability
        - Evidence that complaint and refund remediation remains clean under scale
        - A fresh enforcement issue would reset the multiple lower quickly
        - Monitor CFPB, DFPI, and company disclosures
    notes: These asks are the shortest path to moving the stock from fair-to-attractive toward clearly attractive.
    claimRefs:
      - CV020
