      - number: '7.2'
        title: Regulatory, legal, and governance risk is already realized rather than hypothetical
        blocks:
          - type: paragraph
            body: >-
              The regulatory record is the clearest evidence that Chime's downside is real rather than theoretical. CFPB
              said the company failed to issue post-account-closure refunds within 14 days in thousands of cases and
              within 90 days in thousands more, then ordered at least $1.3 million of redress and a $3.25 million civil
              penalty. California's DFPI separately imposed a $2.5 million penalty and required 24/7 support, stronger
              staffing and training, and better complaint-handling procedures. The older 2021 California branding
              settlement still matters because it captures the core legal tension in the model: Chime wants to feel like
              the consumer's primary bank relationship while legally operating as a nonbank interface layered over
              chartered partners. Governance moderates some of this risk but does not remove it. The proxy shows a
              dual-class structure with 20-vote Class B shares, founder Chris Britt still serving as CEO and chair, and
              a large Class B position still held by insiders as a group. Public-company committees and a risk-oversight
              process exist, yet control remains meaningfully founder-led rather than bank-like or widely dispersed. One
              live diligence hole remains open: the current deposit-account-agreement URL was blocked during this run,
              so the exact operative arbitration and account-closure language should be rechecked directly before
              underwriting litigation exposure.
