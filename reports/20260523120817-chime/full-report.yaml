      - number: '7.3'
        title: Partner-bank and model dependency is the thesis-critical concentration
        blocks:
          - type: paragraph
            body: >-
              The sponsor-bank architecture is still Chime's single most important structural concentration. The
              Bancorp's own partnership announcement said the long-term extension keeps The Bancorp in its key role as
              banking partner and deposit-account holder, while Chime's policy pages reiterate that banking services,
              card issuance, and pass-through deposit insurance all depend on Bancorp or Stride rather than Chime
              itself. In plain English, Chime owns brand, software, acquisition, support, and much of the product logic,
              but it does not own the regulated deposit or card-issuer stack. That matters on both economics and
              continuity. Chime's filings repeatedly warn that bank-partner qualification for the Durbin small-issuer
              exemption affects debit interchange economics, and the same filings rely on partner-bank and third-party
              compliance with network rules and service levels. The public corpus is much thinner on contingency than on
              current structure: The Bancorp's public filings index is visible, but the accessible materials in this run
              do not spell out a backup sponsor-bank plan, migration timetable, or termination economics if a core
              partner exits or is remediated. That gap is tolerable only so long as the relationships remain stable. If
              partner-bank economics, pass-through insurance mechanics, or regulatory posture change, Chime's margin and
              member experience could re-rate much faster than the income statement alone suggests.
