  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Profitability fades
        - GAAP profitability reverses for multiple quarters without a clear investment explanation
        - Undercuts the case that the public-market reset already overshot fundamentals
        - Move stance from fair-to-attractive back toward plain fair or worse
      - - Member growth slows sharply
        - Active Member growth stalls while ARPAM also stops improving
        - Weakens the argument for a fintech multiple rather than a low-growth bank-like multiple
        - Compress scenario band toward 2.0x-2.4x sales
      - - New regulatory or complaint relapse
        - A new CFPB, DFPI, or partner-bank remediation event surfaces
        - Re-prices the sponsor-bank and execution discount higher
        - Treat the discount to SoFi / Nu as deserved, not temporary
      - - Sponsor-bank economics worsen
        - Any disclosed change that threatens interchange pass-through or core partner stability
        - Hits the core monetization logic, not just sentiment
        - Underwrite toward the bear band immediately
      - - Share-count creep outpaces buybacks
        - Net issuance from SBC meaningfully exceeds repurchase retirement
        - Reduces per-share upside even if enterprise value rises
        - Demand a lower entry price or a cleaner dilution bridge
      - - Fast rerating without new proof
        - Stock rerates back near IPO-equivalent value before multiple more clean quarters arrive
        - Turns a fair-to-attractive setup into a stretched one
        - Stop adding and reassess after the next results cycle
    notes: Every trigger is monitorable from filings, earnings releases, regulatory actions, or simple market-cap movement.
