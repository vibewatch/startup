      - number: '1.3'
        title: Capital Formation, Scale Inflection, and the Public-Market Reset
        blocks:
          - type: paragraph
            body: >-
              Chime's scale today is the product of two very different eras. The first era was the private-growth
              period, when the company used venture capital to build brand, product breadth, and distribution. Forbes
              reported that the 2021 round brought in $750 million at a $25 billion valuation, while TechCrunch put
              cumulative private funding before the IPO at roughly $2.65 billion. That private-market peak now matters
              less as a fair-value anchor than as evidence of how much capital was required to build the brand and
              infrastructure. The second era began with the June 2025 IPO, when Chime sold 32 million shares at $27,
              including both primary and secondary stock, and entered the public market at an approximately $11.6
              billion fully diluted valuation. In other words, Chime did make it to the public market, but at a far more
              disciplined price than the 2021 venture benchmark.


              Operationally, the public-company disclosures support the case that the reset came alongside a real
              improvement in business quality. The 2025 annual report says revenue grew 31% to $2.2 billion and Active
              Members reached 9.5 million, while the Q1 2026 release showed $647 million of revenue, $580 million of
              gross profit, $53 million of net income, and 10.2 million Active Members. Chime also emphasizes that
              ChimeCore has moved core processing in-house, lowering costs and accelerating product shipping. The result
              is a materially different overview picture than the one investors had in 2021: Chime is no longer just a
              large private neobank with a brand story; it is a public fintech with demonstrated scale, improving
              profitability, and a broader product stack that now includes premium membership, on-demand pay,
              installment credit, and employer distribution through Chime Workplace.
