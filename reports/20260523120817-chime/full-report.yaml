      - number: '1.2'
        title: Founder Continuity, Executive Bench, and Governance Depth
        blocks:
          - type: paragraph
            body: >-
              The leadership story remains unusually founder-centric for a company that completed a large-cap IPO in
              2025. Chris Britt remains co-founder, CEO, and chairperson, while Ryan King remains a co-founder and
              director, preserving the original product-and-technology founding pair at the top of the organization.
              Britt's background matters because Chime's model explicitly borrows from lessons he drew at Green Dot and
              Visa: direct deposit creates sticky primary-account behavior, interchange can fund a low-fee proposition
              at scale, and mainstream lower-to-middle-income consumers are frequently mispriced or underserved by
              incumbents. Forbes' 2024 profile reinforces that the company was built deliberately for people outside the
              affluent-coastal tech archetype. King's Plaxo/Comcast and Stanford background complements that commercial
              logic with consumer-software execution and infrastructure depth.


              The broader bench is more institutional than in Chime's private-unicorn phase, with public-market profiles
              naming a CFO, COO, CTO, growth leader, and people chief. That said, public disclosure is still thinner
              than what investors typically get from mature banks. The current 10-K and 10-Q are rich on operating
              metrics but light on narrative board composition details, and easily accessible public profiles do not
              fully reconcile committee structure, founder voting influence, or remaining investor-designated governance
              rights after the IPO. That leaves a residual governance gap: Chime is no longer a purely venture-backed
              startup, but oversight visibility has not yet fully caught up to its new public-company status. The
              founder-led continuity is mostly a strength operationally, yet it also concentrates narrative, product,
              and stakeholder reliance around Britt more than at an equivalent-sized bank holding company.
