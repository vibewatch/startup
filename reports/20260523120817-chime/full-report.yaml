              Current public comps argue against calling Chime expensive. On current market-data pages, Chime sits
              around 2.9x trailing sales and roughly 2.5x EV-to-sales. That is not cheap in an absolute sense, but it is
              clearly below SoFi, Nu, and Dave, which all trade materially richer on current sales multiples, while
