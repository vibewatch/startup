      - number: '3.2'
        title: Direct challengers are copying the core daily-money job
        blocks:
          - type: paragraph
            body: >-
              The direct set is crowded because most of Chime’s historic feature advantages are now visible on
              competitor homepages. Cash App pairs no monthly fees with savings, ATM access, overdraft relief,
              borrowing, and a large primary-banking user base, which makes it more than a side-wallet. SoFi comes from
              the opposite direction: it is a chartered, broader “everything app” that wraps no-fee banking inside a
              much wider product stack and can cross-sell lending, investing, and newer asset categories. Varo is the
              closest chartered analogue to Chime’s traditional mass-market story because it pairs early payday,
              fee-light banking, short-term liquidity, and credit building with direct bank ownership rather than
              sponsor-bank dependence. Dave is narrower, but it competes directly for the paycheck-timing and
              overdraft-avoidance job that often pulls users into a primary account. Current is also narrower on
              disclosed scale, yet its Build Card, payroll-linked rewards, and teen banking create sticky behavioral
              loops around the same customer cohort. Put simply, Chime still looks strong, but the direct field now
              overlaps heavily on the exact features that once felt unique.
