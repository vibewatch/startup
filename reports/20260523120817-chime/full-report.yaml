        title: >-
          Customer base is broad and consumer-diffuse, but economic value is concentrated in members who make Chime
          primary
        blocks:
          - type: paragraph
            body: >-
              Chime does not have a classic enterprise customer list; it has a very large U.S. retail member base. The
              strongest current proof is hard and official: 10.2 million active members in Q1 2026, up 19% year over
              year, with 9.5 million active members already in place at year-end 2025. The more important
              customer-quality fact is not just scale but primacy. Chime's 10-Q says a majority of active members use
              Chime as their primary financial relationship, and the S-1/A defines that relationship in behavioral
              terms: a qualifying direct deposit of at least $200 or fifteen or more monthly card purchases. The annual
              report adds that members transact more than fifty times per month on average, anchored by direct deposit,
              which is unusually high habit intensity for a consumer-fintech account. That makes the customer base look
              diffuse in classic top-account concentration terms, but not diffuse economically: the disclosed products
              and thresholds imply that the most valuable members are those who move paycheck flow, routine spend, and
              liquidity needs into Chime. Workplace matters here because management describes it as a way to establish
              direct deposit at the source, though public materials still do not quantify how much acquisition actually
              comes from that channel.
