        title: Product surface is broader than fee-free checking, but the workflow still starts with primary direct deposit
        blocks:
          - type: paragraph
            body: >-
              Chime's public product surface is now broader than the original neobank pitch. The current stack spans
              checking, savings, SpotMe overdraft coverage, MyPay earned-wage access, Instant Loans, secured credit
              building, and premium Prime/Plus tiers. The connective tissue across those modules is not a marketplace or
              open API ecosystem; it is the primary-account workflow. Chime wants the member's paycheck to land in a
              Chime checking account first, then wants spending, saving, credit building, short-duration liquidity, and
              support interactions to happen in the same app. That is why Prime is unlocked by direct deposit
              thresholds, why MyPay and Instant Loans key off deposit and risk behavior, and why Chime Workplace matters
              even though it is not a consumer-facing bank product. Workplace tries to move the company farther upstream
              into payroll and direct-deposit setup, so product breadth and customer acquisition reinforce one another.
              Public help content also suggests the company is simplifying older Credit Builder mechanics into a more
              unified secured-card model rather than preserving a cluttered module sprawl forever.
