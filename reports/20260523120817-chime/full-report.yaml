companyProfile:
  summary: >-
    Chime is a San Francisco-based consumer fintech that built a mainstream U.S. primary-account franchise by stripping
    out punitive fees and wrapping direct deposit, everyday spending, short-term liquidity, savings, and credit-building
    into a mobile-first experience. The company operates through partner banks The Bancorp Bank, N.A. and Stride Bank,
    N.A., went public on Nasdaq in June 2025, and entered mid-2026 with 10.2 million Active Members, improving
    profitability, and a broader platform anchored by ChimeCore, MyPay, SpotMe, Chime Card, and premium membership
    tiers. Its strongest advantages are scale, product utility, and cost leverage; its main overhangs are partner-bank
    dependence, regulatory scar tissue, and incomplete disclosure on product-level economics.
  foundedDate: '2011-12-31'
