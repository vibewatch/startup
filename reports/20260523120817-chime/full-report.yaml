    title: Recommendation summary table
    columns:
      - Metric
      - Current read
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - Track / accumulate selectively
        - Current public multiple is reset, but not obviously mispriced enough for an aggressive chase.
        - Build only with tolerance for regulatory and sponsor-bank risk.
      - - Confidence
        - Medium
        - >-
          Public filings and market data are rich, but normalization of profitability and dilution still need another
          few quarters.
        - Conviction is good enough for a range view, not for false precision.
      - - Risk rating
        - High
        - >-
          Sponsor-bank dependence, interchange sensitivity, and recent regulatory scar tissue still justify a discount
          versus premium fintech peers.
        - Do not pay a Nu-like premium yet.
      - - Valuation stance
        - Fair-to-attractive
        - >-
          At about 2.5x EV/sales and about 2.9x sales, Chime trades below SoFi, Nu, and Dave, but above LendingClub’s
          lower bank/lender floor.
        - Current pricing looks reasonable with upside if execution stays clean.
      - - Entry discipline
        - Prefer market cap at or below about $8.5B
        - That keeps entry within the base-case band rather than in a rerated bull case.
        - Avoid chasing a fast move back toward IPO pricing without new proof.
      - - Upgrade trigger
        - Multiple more quarters of durable profitability and clean regulatory execution
        - The next rerating needs evidence that Q1 was not just the first clean public quarter.
        - Move from fair toward attractive if durability confirms.
      - - Primary downside trigger
        - Compression toward 2.0x-2.4x sales
        - That bear band would pull Chime closer to a low-fintech or bank-like valuation frame.
        - Reset quickly if growth quality or sponsor-bank economics weaken.
