      - number: '3.3'
        title: Adjacent super-apps and digital incumbents widen the threat surface
        blocks:
          - type: paragraph
            body: >-
              Revolut US and the digital incumbents matter because Chime can lose users without losing them to a perfect
              like-for-like neobank. Revolut is still adjacent in the U.S. because its current stack relies on partner
              banks and its public messaging emphasizes paid tiers, travel, and broader global-finance utility. But its
              charter application and announced U.S. investment show clear ambition to move closer to the core
              primary-account job over time. On the incumbent side, Ally and Capital One demonstrate that a bank does
              not need a challenger brand to neutralize many fintech advantages. Ally already combines early pay, ATM
              reimbursement, overdraft protections, and a fully digital operating model, while Capital One positions 360
              Checking as no-fee online checking and now absorbs Discover’s digital deposit base after the 2025 merger.
              Independent industry sources reinforce the substitute risk: customers increasingly maintain multiple
              deposit relationships, mobile remains the dominant banking surface, and incumbents are spending
              aggressively to close the execution gap that initially let challengers sprint ahead.
