        title: Diligence path and thesis-breaks
        blocks:
          - type: paragraph
            body: >-
              The final judgment should still be conditional rather than complacent. The upside case works only if Chime
              can show that Q1 2026 was the first of many durable public-company quarters rather than a one-quarter
              milestone flattered by seasonality or one-time operating leverage. The most important open diligence asks
              are straightforward: how much stock-based compensation and net issuance still sits ahead, how much insider
              supply remains after the IPO, and how much of Chime’s cash position should really be treated as freely
              distributable rather than structurally supporting product collateral and reserve requirements. The thesis
              also breaks faster than the market might like to admit if a new complaint-handling or sponsor-bank issue
              emerges. Those are not abstract risks. They are exactly the reasons Chime still trades well below premium
              fintech peers. In other words, the stock can be fair-to-attractive today and still be highly sensitive to
              execution. Investors should upgrade the stance only if the next few quarters keep removing those specific
              reasons for discount.
