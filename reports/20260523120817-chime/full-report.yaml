            body: >-
              The capital-structure picture is better than in the late-private period, but it is not frictionless. The
              most important simplifier is that the preferred stack is gone: the March 2026 10-Q shows no preferred
              stock outstanding, so current underwriting is about common-equity value rather than liquidation
              preferences. Chime also remains net-cash positive on public market-data pages, which further reduces the
              risk that a seemingly low enterprise value hides a fragile balance sheet. But the equity is not magically
              clean. The company still has roughly 382.6 million common shares outstanding, a dual-class structure with
              20-vote Class B stock, and insiders still holding the full 32.13 million Class B shares. The IPO also
              included a meaningful secondary component, so existing holders already obtained some liquidity. Meanwhile,
              the new $200 million repurchase authorization can offset a slice of dilution, but only about 2.9% of the
              current share base at today’s price. The practical conclusion is that Chime’s valuation overhang is no
              longer venture preferences; it is ordinary public-company dilution, supply, and governance concentration.
