      - number: '4.2'
        title: >-
          Public unit economics are unusually good for a neobank, but some of the best-looking metrics remain
          management-selected
        blocks:
          - type: paragraph
            body: >-
              The margin stack now looks much better than the old private-unicorn narrative implied. In Q1 2026 Chime
              posted $580.3 million of gross profit at a 90% gross margin, $491.4 million of transaction profit at a 76%
              transaction margin, $119 million of adjusted EBITDA at an 18% margin, and $53 million of GAAP net income.
              Public engagement metrics also moved the right way: Active Members hit 10.2 million, ARPAM rose to $263,
              purchase volume reached $39 billion, and management said nearly half of members were using a secured
              credit card monthly, pushing credit-based purchase volume to 25% of total spend. That last point matters
              because higher-take-rate card mix is one of the cleanest ways to lift monetization without adding headline
              fees.


              The best incremental evidence is on acquisition efficiency and liquidity-product performance. Management
              said early engagement initiatives lowered CAC payback to five to six quarters, cohorts retain more than
              100% of dollar-based transaction profit net of churn, and LTV-to-CAC is over 8x. MyPay was described as a
              $400 million-plus run-rate business with a 62% transaction margin and 1% loss rate, while Instant Loans
              reached $180 million of Q1 originations with materially better loss performance among repeat borrowers.
              The caution is that management also said Q1 benefited from tax-refund seasonality and guided transaction
              margin down to 70% to 72% for the rest of the year, with extra Prime-related sales, marketing, and support
              spend depressing Q2 incremental EBITDA margins into the low 50s. So the unit-economics story is strong,
              but not yet fully normalized.
