        title: ChimeCore internalized core processing, but the architecture still depends on sponsor banks and outside rails
        blocks:
          - type: paragraph
            body: >-
              The most important technical fact in the public record is ChimeCore. Chime's filings say the company
              launched its proprietary payment processor and ledger in 2024 and completed migration in 2025, replacing a
              prior dependence on Galileo for core transaction processing. Management ties that shift to lower
              processing cost, faster shipping, and more product control, which makes ChimeCore more than a back-office
              refactor. But the processing stack is still layered on meaningful external dependencies. Bancorp and
              Stride remain the regulated issuers for deposit accounts and cards, Visa remains the card network, cash
              deposits run through InComm, ATM access through Allpoint, MoneyPass, and Visa Plus Alliance, outbound
              instant transfers through TabaPay, and the platform itself still runs on AWS. In other words, Chime has
              internalized the ledger-and-authorization heart of the experience without becoming a vertically integrated
              bank. The architecture looks stronger than a pure middleware fintech, yet it still has concentrated
              dependency points that can affect availability, economics, and regulatory exposure if partner
              relationships or vendor performance deteriorate.
