      - number: '2.3'
        title: Buyer Segments, Activation, and Retention Path
        blocks:
          - type: paragraph
            body: >-
              Chime's market is not one monolithic "neobank user" segment. The most important cohorts are fee-sensitive
              mainstream households, direct-deposit wage earners, overdraft-exposed consumers, credit-builders, and gig
              or hourly workers with volatile cash timing. In most of those segments the buyer, user, payer, and budget
              owner are the same household, which is why product design matters more than procurement. The employer
              channel is the main exception: with Chime Workplace, HR or benefits leaders can introduce the product, but
              the employee is still the economic end user.


              Public operating metrics reinforce that the product is trying to become the primary account, not a side
              wallet. Chime's own definition of an Active Member requires a recent money-movement event, and the S-1
              says active members averaged 54 monthly transactions in early 2025, with 75% of those transactions tied to
              Chime-branded card purchases and 70% of purchase activity concentrated in nondiscretionary categories.
              Direct deposit is the gating step that unlocks higher-value features and keeps repayment position
              favorable on liquidity products, while credit-building and employer-distributed benefits widen the reasons
              to stay. The remaining diligence gap is not the existence of these motions, but their exact segment mix
              and current take rates by feature.
