  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      The KPI card shows why Chime is no longer expensive on public evidence, but not yet risk-free enough for a premium
      multiple.
    data:
      items:
        - label: Current market cap
          value: $6.78B
          detail: Live May 22, 2026 public equity value
        - label: Current EV / sales
          value: ~2.5x
          detail: Well below SoFi, Nu, and Dave
        - label: IPO valuation
          value: $11.6B
          detail: June 2025 pricing anchor
        - label: 2021 private peak
          value: $25B
          detail: Useful as a sentiment ceiling, not a live anchor
        - label: Net cash
          value: ~$0.98B
          detail: Positive, but some cash still supports product and reserve structures
        - label: Buyback support
          value: $200M
          detail: About 2.9% of shares at the current quote if fully executed
        - label: Valuation stance
          value: Fair-to-attractive
          detail: Current price looks reasonable with upside if execution stays clean
    approximationNotes: KPI card mixes current market-data pages, filings, and management disclosures into a decision snapshot.
