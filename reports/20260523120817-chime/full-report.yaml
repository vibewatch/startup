  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The decision path runs from a hard valuation reset and improving fundamentals through peer discounts and remaining
      model risk to a fair-to-attractive read with disciplined entry sizing.
    data:
      nodes:
        - id: n1
          label: Hard reset already happened
          detail: $25B private peak -> $11.6B IPO -> about $6.8B current market cap
        - id: n2
          label: Business quality improved
          detail: $647M Q1 revenue, $53M net income, 10.2M Active Members
        - id: n3
          label: Peer discount is visible
          detail: Chime trades below SoFi, Nu, and Dave on sales multiples
        - id: n4
          label: Capital structure is cleaner
          detail: No preferred stock outstanding; net cash remains positive
        - id: n5
          label: Model-risk discount persists
          detail: Sponsor-bank, interchange, and remediation overhangs still matter
        - id: n6
          label: Current call
          detail: Fair-to-attractive; accumulate selectively, do not chase a fast rerating
      edges:
        - from: n1
          to: n6
          label: creates entry appeal
        - from: n2
          to: n6
          label: supports upside
        - from: n3
          to: n6
          label: shows rerating room
        - from: n4
          to: n6
          label: simplifies equity case
        - from: n5
          to: n6
          label: caps conviction
    approximationNotes: This figure summarizes decision logic rather than a mechanical scoring model.
    claimRefs:
      - CV007
      - CV014
      - CV016
      - CV018
      - CV026
      - CV028
      - CV029
      - CV032
      - CV041
      - CV049
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      Price-to-sales sensitivity on Chime’s trailing revenue shows that even a moderate rerating can create upside
      without returning to 2021 private-market exuberance.
    data:
      items:
        - label: 2.0x sales
          value: 4.64
          unit: USD bn
          detail: Deep-bear floor if the market leans toward a bank-like or stressed-fintech view
        - label: 2.4x sales
          value: 5.57
          unit: USD bn
          detail: Upper end of the bear band
        - label: 2.9x sales
          value: 6.78
          unit: USD bn
          detail: Approximate current market cap
        - label: 3.7x sales
          value: 8.58
          unit: USD bn
          detail: Upper end of the base band
        - label: 4.5x sales
          value: 10.44
          unit: USD bn
          detail: Bull rerating toward a higher-quality public fintech band
        - label: 5.0x sales
          value: 11.6
          unit: USD bn
          detail: Roughly back to the IPO valuation anchor
    approximationNotes: Values are calculated from trailing revenue of about $2.32 billion and rounded to two decimals.
    claimRefs:
      - CV006
      - CV007
      - CV042
      - CV043
      - CV044
      - CV045
