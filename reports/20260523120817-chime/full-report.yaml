chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Customer Promise, and Banking Stack
        blocks:
          - type: paragraph
            body: >-
              Chime entered 2026 as a newly public U.S. consumer-fintech platform built around a deceptively simple
              proposition: make the primary account relationship useful for people who historically paid too much for
              basic banking. Official company language still emphasizes that Chime is a financial technology company,
              not a bank, and that core checking, savings, debit-card, and deposit insurance functions are provided by
              The Bancorp Bank, N.A. or Stride Bank, N.A. That distinction matters strategically because Chime owns the
              member experience, product packaging, support model, data layer, and go-to-market motion, but it does not
              own a banking charter. The operating model therefore blends software-led consumer acquisition with
              regulated-bank infrastructure, letting Chime offer no monthly maintenance fees, no minimum balance
              requirements, early direct deposit, fee-free overdraft, on-demand liquidity, and credit-building features
              without building a branch network or holding its own insured-bank charter.


              The public-company disclosures also make clear that Chime's business model is not a “free banking”
              charity; it is an aligned monetization system that earns mostly when members actively use their accounts.
              Management repeatedly highlights payments and interchange revenue as the economic core, with fast-growing
              platform-related revenue layered on top through products such as MyPay, instant transfers, and Instant
              Loans. That framing is consistent with the company's historical positioning in media profiles and with the
              10-Q disclosure that bank partners collect interchange and pass through amounts to Chime. For later
              chapters, the key overview takeaway is that Chime's identity is not merely a digital bank brand; it is a
              software-and-distribution layer sitting on top of partner-bank balance-sheet infrastructure, optimized for
              mainstream U.S. consumers seeking cheaper, more forgiving daily financial tools.
