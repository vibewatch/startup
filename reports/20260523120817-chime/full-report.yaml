  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and direct-versus-adjacent boundaries
        blocks:
          - type: paragraph
            body: >-
              Chime is no longer competing only with other branchless checking brands. The evidence now points to a
              three-layer landscape: direct primary-account challengers such as Cash App, SoFi, Varo, Dave, and Current;
              adjacent digital finance apps such as Revolut US that are still building toward a fuller U.S. bank
              posture; and digital incumbents such as Ally or Capital One that can meet many of the same day-to-day
              needs without using a fintech label. Chime’s own Q1 2026 disclosure matters here because it shows both the
              company’s scale and its defensive posture: 10.2 million Active Members, continued claims of
              account-opening leadership, and a new premium tier. That combination implies Chime is large enough to be
              the reference point for the segment, but it also implies management no longer assumes that fee-free
              checking alone is sufficient differentiation. The competitor set has widened from “other neobanks” to any
              product that can plausibly become a consumer’s primary spending, deposit, liquidity, or credit-building
              home.
