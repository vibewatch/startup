    {
      "id": "public-comp-band-and-multiple-support",
      "title": "Public comp band and multiple support",
      "body": "Current public comps argue against calling Chime expensive. On current market-data pages, Chime sits around 2.9x trailing sales and roughly 2.5x EV-to-sales. That is not cheap in an absolute sense, but it is clearly below SoFi, Nu, and Dave, which all trade materially richer on current sales multiples, while remaining above the much lower LendingClub floor. The comp message is important because it shows Chime does not need a premium multiple to justify upside from here. A move only toward the lower end of the SoFi or Dave band would already re-rate the stock materially without asking public markets to recreate the 2021 bubble or give Chime a Nu-like halo. The market is already pricing in a real sponsor-bank, regulatory, and execution discount. The question is therefore not whether Chime deserves some discount; it almost certainly does. The question is whether the current discount is already wide enough given the evidence that Chime is now public, profitable, and still growing faster than lower-multiple bank-like peers.",
