    {
      "id": "engagement-cross-sell-and-loyalty-signals",
      "title": "Engagement looks real, and cross-sell is broadening, but public loyalty proof still stops short of cohort retention",
      "body": "Chime's strongest loyalty evidence is behavioral rather than contractual. The annual report says members transact more than fifty times per month on average, the 10-Q says the majority are primary-relationship users, and the product strategy increasingly rewards members who deepen that relationship. SpotMe, MyPay, and Instant Loans exited 2025 at more than $40 billion in annualized origination volume, while platform revenue grew 50% year over year in Q1 2026. That means customers are not just keeping a fee-free card on standby; at least some are repeatedly using Chime for short-term liquidity and adjacent financial tasks. Prime and Plus make the logic explicit. Members who deliver at least $3,000 per month of qualifying direct deposit unlock Prime with 5% cash back and 3.75% APY, while a lower direct-deposit threshold unlocks Plus rewards. Chime and partner materials also claim strong self-reported satisfaction: 97% of members say Chime helped unlock financial progress, and a support partner case study says the company now handles more than one million calls per month with nearly 70% resolution. The major hole is that none of this equals cohort retention. There is still no public NRR, GRR, churn, or product-level renewal disclosure.",
