  "callouts": [
    {
      "calloutType": "risk",
      "title": "Partner-bank dependence is still the thesis-critical structural risk",
      "body": "The deepest structural risk is not cash burn but the fact that Chime still monetizes and insures through external bank charters and Durbin-sensitive debit economics. If a sponsor bank exits, loses the small-issuer exemption, or faces remediation, Chime would have to preserve pass-through insurance, card issuance, and direct-deposit continuity while re-underwriting its core margin structure.",
      "claimRefs": [
        "CR001",
        "CR002",
        "CR033",
        "CR035",
        "CR041"
      ]
    },
    {
      "calloutType": "risk",
      "title": "The risk record is realized, not merely disclosed",
      "body": "CFPB and DFPI orders plus the April 2026 lawsuits mean the operating-risk thesis is no longer speculative. Chime may be improving support and fraud metrics, but the public record already contains real consumer-protection failures and fast reputation swings when refunds, outages, or dispute handling go wrong.",
      "claimRefs": [
        "CR004",
        "CR007",
        "CR014",
        "CR024",
        "CR028"
      ]
    },
    {
      "calloutType": "recommendation",
      "title": "Minimum diligence package before a fresh underwriting decision",
      "body": "Require sponsor-bank contingency terms, monthly complaint and refund trend data post-remediation, product-level MyPay and Instant Loans loss vintages, the April 2026 forensic and litigation package, and the current operative deposit-account-agreement language. Without that packet, the business can be called improved, but not fully de-risked.",
      "claimRefs": [
        "CR033",
        "CR037",
        "CR041",
        "CR047",
        "CR048"
      ]
    }
