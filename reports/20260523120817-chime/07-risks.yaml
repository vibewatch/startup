    "number": 7,
    "title": "Risks",
    "summary": "Chime's risk stack remains structurally higher than its recent profitability suggests because the company is still a nonbank consumer interface dependent on Bancorp/Stride, Durbin-exempt debit economics, and digitally mediated support and dispute handling. The official record now contains both realized consumer-protection failures—CFPB and DFPI orders—and fresh 2026 outage/cyber litigation, while new liquidity products increase fraud, loss, and compliance surface area. Mitigations are visible, but the unresolved underwriting items are sponsor-bank contingency planning, post-remediation complaint durability, and the exact legal/customer-agreement terms now governing disputes and account closures."
  },
  "sections": [
    {
      "id": "overall-risk-posture",
      "title": "Overall risk posture: the core downside is structural, not purely cyclical",
      "body": "Chime's risk stack is more structural than acute liquidity. Filings and policy pages make clear that Chime still sits on external charters: The Bancorp Bank or Stride Bank issue accounts and cards, and partner-bank small-issuer status under Durbin still supports the debit economics that matter most to the model. That creates a setup where sponsor-bank, card-network, and recordkeeping stress can all hit consumer experience and margin. The reason this matters more than a generic fintech-partner warning is that several of the biggest risks are no longer hypothetical. CFPB and DFPI orders documented slow refunds and poor complaint handling, and April 2026 outage litigation showed how quickly a service incident can turn into claims about inaccessible balances, identity-theft risk, and trust damage for a branchless platform. Recent profitability reduces emergency financing risk, but it does not solve partner concentration, regulatory relapse, or the operational complexity created by MyPay and Instant Loans. Netting likelihood, severity, and mitigation maturity together, Chime should be underwritten as medium-high overall risk: not a broken franchise, but one whose downside is still dominated by external-bank dependence and service-trust fragility.",
