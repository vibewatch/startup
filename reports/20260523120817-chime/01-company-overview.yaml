  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Chime reached mid-2026 as a newly public U.S. consumer fintech with 10.2 million Active Members, $2.2 billion of 2025 revenue, and its first GAAP-profitable public-company quarter after a June 2025 IPO priced at an $11.6 billion fully diluted valuation. The overview evidence shows a stronger operating business than the 2021 private-market peak implied, but it also confirms persistent dependence on partner banks and meaningful regulatory scar tissue around refund handling, complaint operations, and \u201cbank\u201d branding."
  },
  "sections": [
    {
      "id": "identity-and-model",
      "title": "Identity, Customer Promise, and Banking Stack",
      "body": "Chime entered 2026 as a newly public U.S. consumer-fintech platform built around a deceptively simple proposition: make the primary account relationship useful for people who historically paid too much for basic banking. Official company language still emphasizes that Chime is a financial technology company, not a bank, and that core checking, savings, debit-card, and deposit insurance functions are provided by The Bancorp Bank, N.A. or Stride Bank, N.A. That distinction matters strategically because Chime owns the member experience, product packaging, support model, data layer, and go-to-market motion, but it does not own a banking charter. The operating model therefore blends software-led consumer acquisition with regulated-bank infrastructure, letting Chime offer no monthly maintenance fees, no minimum balance requirements, early direct deposit, fee-free overdraft, on-demand liquidity, and credit-building features without building a branch network or holding its own insured-bank charter.\n\nThe public-company disclosures also make clear that Chime's business model is not a \u201cfree banking\u201d charity; it is an aligned monetization system that earns mostly when members actively use their accounts. Management repeatedly highlights payments and interchange revenue as the economic core, with fast-growing platform-related revenue layered on top through products such as MyPay, instant transfers, and Instant Loans. That framing is consistent with the company's historical positioning in media profiles and with the 10-Q disclosure that bank partners collect interchange and pass through amounts to Chime. For later chapters, the key overview takeaway is that Chime's identity is not merely a digital bank brand; it is a software-and-distribution layer sitting on top of partner-bank balance-sheet infrastructure, optimized for mainstream U.S. consumers seeking cheaper, more forgiving daily financial tools.",
