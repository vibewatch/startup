summary:
  headline: >-
    Chime looks like a scaled public consumer-fintech winner, but the current discount mostly reflects real
    sponsor-bank, regulatory, and disclosure risks rather than market misunderstanding alone.
  overallScore: 6.8
  recommendation: track
