  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "Chime is competing in a large but already mainstream market for digital-first primary banking, cash-flow management, and credit-building rather than in a tiny niche of unbanked households. Public evidence suggests strong demand tailwinds — 40% of new account openings flowing to neobanks, 28% primary-neobank penetration, and persistent fee pain among underbanked or overdraft-exposed users — but it also shows clear limits from hybrid-channel preference, sponsor-bank scrutiny, and crowded category economics. The right market lens for valuation is therefore behavioral share shift within U.S. consumer banking, not a single opaque TAM number."
  },
  "sections": [
    {
      "id": "market-boundary-and-status-quo",
      "title": "Market Boundary and Status-Quo Alternatives",
      "body": "Chime operates in a consumer-banking market that is broader than \"free checking\" but narrower than full-service retail banking. The public filings and company materials consistently describe a product stack built for everyday Americans who want a low-friction primary account relationship: deposit accounts, early paycheck access, fee-free overdraft coverage, credit building, short-term liquidity, and savings tools. That combination makes the relevant market one of digital-first primary banking and cash-flow management, with employer-distributed financial wellness emerging as an adjacent channel rather than a separate business. What Chime is not trying to replicate is the full branch-bank bundle of mortgages, wealth management, branch advice, and affluent relationship banking.\n\nThe most relevant substitutes therefore are traditional checking accounts, prepaid cards, payday or overdraft alternatives, and payment apps that households use to patch together everyday money movement. The gap Chime is targeting is not merely account access; it is a lower-fee, payroll-linked, mobile-first alternative for consumers who dislike punitive fee structures, slow funds availability, or fragmented cash-flow tools. That framing matters for later valuation work because Chime is competing for the primary-account job, not just for a secondary wallet slot.",
