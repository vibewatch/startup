      "id": "sizing-lenses-and-adoption",
      "title": "Sizing Lenses and Adoption Evidence",
      "body": "Public evidence supports a large reachable market but not a clean single-number TAM. The broadest lens is simply that bank account ownership is already mainstream: 94% of U.S. adults were banked in 2024, leaving a 6% unbanked share rather than a giant unserved population. The more relevant opportunity for Chime sits inside the friction-heavy portion of that market. Financial Health Network estimates 24.6 million U.S. households are underbanked or unbanked, while the Federal Reserve says 11% of banked adults still paid an overdraft fee in 2024. Chime's own S-1 adds another important filter by claiming that 75% of U.S. adults earn up to $100,000 annually, which is the income band it frames as historically misaligned with traditional banking economics.\n\nAdoption evidence is stronger than revenue-TAM disclosure. Simon-Kucher says neobanks already capture 40% of new U.S. account openings and 28% of customers treat a neobank as their primary banking relationship, while 70% strongly prefer digital channels. Yet the public data also show a ceiling: Raisin says only 15% of Americans want a fully digital-only experience and 48% still prefer a hybrid model. For this chapter, that means Chime's opportunity should be sized as a large behavioral shift within mainstream banking, not as a clean greenfield market with no incumbent or channel friction.",
