    rows:
      - ["Advisor wealth platform", "Advisors and their client books", "Commercial and scaling", "Single environment spanning planning, portfolio, tax, estate, and AI-assisted workflows", "No module-level adoption or attach-rate disclosure"]
      - ["Farther Family Office", "UHNW families plus lead advisors", "Launched in 2026 and expanding", "AI-native wrapper for whole-life coordination, tax, estate, and lending-adjacent support", "No public onboarding, staffing, or retention metrics by segment"]
      - ["Custody and data integration layer", "Operations, advisors, and platform engineering", "In production but only partially described", "Multi-custodian ingestion and reconciliation across Schwab, Fidelity, Pershing, and other data sources", "No public SLA, latency, or exception-rate reporting"]
      - ["AI workflow and review layer", "Internal teams, advisor growth, and content/operations staff", "Active and still maturing", "Agent inventory, structured prompts/components, and human-in-the-loop review before external use", "No public model-governance, approval, or audit metrics"]
    notes: "Rows synthesize retained public product surfaces and hiring signals; maturity labels distinguish commercially visible offers from partially disclosed internal infrastructure."
    claimRefs: ["CE001", "CE004", "CE005", "CE006", "CE009", "CE010", "CE013"]
  - id: "TE002"
    title: "Workflow / use-case table"
    columns:
      - "User job"
      - "Current workflow"
      - "Farther solution"
      - "Measurable benefit"
      - "Limitation"
    rows:
      - ["Breakaway or independent advisor operations", "Fragmented planning, trading, reporting, and back-office tooling", "Integrated advisor platform with data, execution, tax, risk, and client-service workflows", "Public sources consistently position time savings and better operating leverage for advisors", "No externally audited productivity baseline or churn comparison"]
      - ["High-net-worth client wealth coordination", "Separate advisory, tax, estate, and alternative-investment relationships", "Single advisory relationship plus platform access to tax-aware portfolios, private markets, and estate coordination", "Broader product breadth than a plain portfolio account", "No public evidence for renewal, satisfaction, or cross-sell rates"]
      - ["Ultra-high-net-worth family office workflow", "Legacy family-office or private-bank stack assembled across providers", "Farther Family Office as an AI-native, open-architecture environment", "Extends the platform into a higher-value client segment", "No public disclosure of implementation time, service-team ratios, or family-office economics"]
    notes: "Benefits are company- or publisher-described workflow outcomes, not audited ROI metrics."
    claimRefs: ["CE001", "CE002", "CE003", "CE008", "CE009", "CE013"]
  - id: "TE003"
    title: "Technology / operating architecture table"
    columns:
      - "Layer / process / component"
      - "Role"
      - "Dependency"
      - "Risk"
    rows:
      - ["Custodial ingestion and canonical data models", "Normalize account, position, transaction, and balance data across custodians", "Third-party custodian feeds and internal financial systems", "Data-quality drift or reconciliation errors can propagate into advisor and AI workflows"]
      - ["AI-ready retrieval and agent data layer", "Support embeddings, vector search, retrieval, and agent-driven workflows", "Accurate schemas, metadata, lineage, and permissioning", "Weak governance could create hallucination, privacy, or suitability risk"]
      - ["Human review and operational workflow controls", "Keep prompts, components, and AI outputs inside supervised processes", "Cross-functional review between product, compliance, marketing, recruiting, and advisor teams", "Control burden rises as advisor count and use cases scale"]
    notes: "Architecture is inferred from public hiring requirements plus third-party operating-model descriptions; Farther does not publish a formal technical architecture document in the retained sources."
    claimRefs: ["CE004", "CE005", "CE006", "CE010", "CE012"]
