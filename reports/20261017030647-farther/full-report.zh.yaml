        blocks:
          - type: paragraph
            body: >-
              指定资料一致将 Taylor Matthews 列为联合创始人兼 CEO，将 Brad Genser 列为联合创始人兼 CTO。 第三方资料将 Matthews 与财富行业运营经验联系起来，将 Genser
              与其在 Goldman Sachs 从事的私人财富技术和 AI 工作联系起来， 因而这对创始人组合同时关系到分销和产品执行。尽管强调技术，公司的运营模式仍高度依赖人力。 Farther
              当前的一则职位转发描述了支持数百名顾问的系统、跨职能合规工作流，以及对 AI 输出的人审。
              这些证据支持其规模，但也说明顾问招募、留存和创始人主导的执行是核心依赖。指定公开证据中没有完整高管名单、董事会名单或委员会架构。
