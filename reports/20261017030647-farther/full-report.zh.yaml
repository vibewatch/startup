      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Farther 的采用路径经过两组相互连接的客户。第一买方是考虑离开 wirehouse 或传统 RIA 环境的顾问或顾问团队； 用户是该顾问及支持人员，经济决策取决于分成、工作流效率、招募支持和客户账簿所有权。
              第二买方/付款方是资产上平台后持续支付顾问费的终端客户家庭或实体。公开描述始终将高净值家庭视为核心， 同时延伸到超高净值家族办公室场景，并明确提及机构和小企业。这个结构很重要，因为 Farther
              不必一次赢得广泛消费者心智； 它需要持续招募顾问，让顾问的账簿和终端客户随之迁移。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM010
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM011
              - CM012
      - number: '2.4'
        title: 需求驱动、约束与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              指定证据中最强的需求驱动是替换工作流。公司和独立描述反复将 Farther 定位为传统顾问软件泛滥的解法， 承诺让顾问有更多时间服务客户、获得更好的数据，以及一体化的规划、税务和投资工作流。
              这解释了为什么顾问招募是市场扩张的入口。同一批证据也指出主要约束：留存条件必须足够有吸引力， 让招募来的顾问不离开；招募资产与已迁移资产之间的缺口必须收窄；合规和服务质量必须跟上快速扩张。
              这些风险不会推翻增长故事，但公开记录更支持可服务市场论点，而不是一套完整承销的 TAM/SAM/SOM 模型。
            claimRefs:
              - CM009
              - CM011
              - CM013
              - CM014
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局分散，但最接近的买方替代方案清晰
        blocks:
          - type: paragraph
            body: >-
              指定证据指向分散格局，而不是一个一对一的对手。独立文章将 Farther 与 Savvy、Compound 等技术型招募/平台 RIA， 与 Corient、Creative Planning 等大型整合者，以及
              Addepar、Orion 等在顾问工作流上重叠但不替代完整顾问关系的基础设施供应商放在一起比较。 这很关键，因为评估 Farther 的买方实际上是在不同运营模式之间选择：软件驱动的招募平台、收购驱动的
              incumbent， 或围绕现有事务所拼装的点方案栈。公开规模指标也区分了这些群体。Savvy 和 Compound 是池中最接近的产品模式邻居， 但披露的 AUM 都远小于 Farther
              的公开平台主张；Corient 和 Creative Planning 则构成相反威胁： 分销和资产负债表规模大得多，即便在保留证据中软件故事并不居于中心。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
