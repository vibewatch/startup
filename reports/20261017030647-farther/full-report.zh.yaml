            body: >-
              Farther 将自己定位为一体化财富管理公司，而非独立软件供应商：顾问继续承担面向客户的一层， Intelligent Wealth Platform
              则处理数据、交易执行、投资组合管理、税务优化能力和私募市场准入。 公司材料描述的客户范围很广，包括高收入个人、超高净值家庭、小企业和机构。公开资料中的法律和运营身份并不统一。 各来源都将其描述为 2019
              年成立的注册投资顾问业务，但总部标签在纽约和旧金山之间切换。 因此，在把某一总部认定为事实基准前，仍需一份当前的主要申报或公司披露。
