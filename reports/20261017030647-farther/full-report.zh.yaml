  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              公开记录支持的市场定义比笼统的“wealthtech”更窄。Farther 竞争的是现代收费制财富顾问服务及其背后的顾问运营层：
              规划、投资组合管理、税务与遗产工作流、私募市场准入，以及在一个平台上交付的客户报告。 因此，纳入的支出是绑定客户关系的经常性顾问服务和工作流支出；排除的支出包括自主经纪、纯银行产品，
              以及不承载完整顾问关系的独立点工具。替代方案不只是其他技术型 RIA，还包括 wirehouse、私人银行， 以及 Farther 声称正在取代的零散传统顾问工具。这一边界很重要，因为 Farther
              的增长从顾问切换运营模式开始， 而不是从匿名零售 App 下载开始。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM006
              - CM007
      - number: '2.2'
        title: 规模视角真实存在，但不是清晰的 TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              Farther 披露的运营指标足以勾勒机会形状，但不足以拆出外部 TAM、SAM 和 SOM。与公司相关的来源称招募资产超过 $23 billion、 管理资产超过 $15 billion；关联方 Form
              ADV 摘要则报告监管口径 AUM 为 $2.905 billion、客户账户 9,645 个。 这些数字都有效，但不能互换：招募资产包含加入顾问预计带来的资产，管理资产描述更宽泛的运营快照， 监管口径 AUM
              则是申报定义的子集，有自己的时间和实体边界。因此，当前公开规模数据最好视为一组受约束的可服务市场视角， 而不是单一的市场规模证明。这既让本章有证据支撑，也保留了对估值仍然关键的尽调缺口。
            claimRefs:
