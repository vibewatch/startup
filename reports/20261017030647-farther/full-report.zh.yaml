  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: |-
              建议是 **track**，不是因为 Farther 缺乏势头，而是公开证据对战略质量的支持明显强于对当前价格的支持。
              独立行业报道和联合发布的融资公告都确认，Farther 在 2026 年 5 月完成 General Atlantic 领投的 $150 million Series D，
              公司也继续将自己定位为面向顾问和高净值客户的现代 AI 原生财富平台。这是实在的融资验证。
              问题在于，公开材料中最强的运营证明仍是招募资产，而不是已完全转化的管理资产或已披露收入。
              Farther 自己称招募资产超过 $23 billion，但同一公司披露将该数字定义为已承诺账簿，其中包含仍在加入顾问预计带来的资产。
              一份独立法律市场资料进一步警告，公开材料区分监管口径 AUM、管理资产和招募资产；因此 headline 规模数字方向积极，
              却不足以单独支撑溢价倍数。在没有公开收入、利润率、烧钱或清算优先权披露的情况下，现有证据足以把公司留在观察名单，
              但不足以证明当前独角兽价格明显有吸引力。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
