      - number: '7.4'
        title: 缓释措施、监测指标与论点破坏触发器
        blocks:
          - type: paragraph
            body: >-
              指定公开证据无法验证缓释措施的成熟度，因此投资判断标准应以证据为基础。投资前，管理层应提供当前 Form ADV 及修订、 检查和投诉历史、诉讼与保险清单、SOC
              或同等控制、渗透测试整改、业务连续性测试结果、托管方事故与对账指标，以及顾问迁移 cohort。 每月监测应区分监管口径 AUM、管理 AUM 和招募资产；披露转化时间和流失；跟踪顾问与客户留存；并将现金、烧钱和
              runway 与招聘及 onboarding 计划核对。 论点破坏触发器包括重大监管行动、未解决的客户资产或数据安全事故、招募资产与管理资产缺口持续扩大、顾问留存恶化，
              或拒绝提供可审计的财务和控制证据。通过尽调需要经核实的控制和趋势数据，而不只是这组有限来源中没有负面报道。
