      - number: '4.3'
        title: 资本支持增长，但尚未带来投资判断清晰度
        blocks:
          - type: paragraph
            body: >-
              最扎实的已披露资本事实是 2026 年 5 月 General Atlantic 领投的 $150 million Series D， 使累计融资超过 $272
              million，并被描述为继续扩张平台和创新的燃料。这支持 Farther 仍处于投资期的判断： 顾问招募、平台开发、家族办公室扩张和服务交付同时扩大，而公司仍依赖自报增长指标，而非已发布财务报表。
              独立评论还指出模式的结构性下行风险：如果顾问流入放缓，以服务为重的组织可能在固定运营成本重新调整前失去 AUM 势头。 在现金余额、烧钱或债务义务未披露的情况下，这轮融资证明有可用资源，但不能证明 runway
              足够。
