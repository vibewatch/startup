      - number: '4.2'
        title: 公开进展指标使用不同分母
        blocks:
          - type: paragraph
            body: >-
              Farther 的 headline 规模主张势头很强，但混用了三种基础：招募资产、管理资产和监管口径 AUM。 公司称 2026 年第一季度招募资产超过 $23
              billion，并明确包括预计未来数月由顾问带来的账簿； RIABiz 则另报 2026 年 4 月管理资产 $15 billion，一页基于申报数据的页面显示 Farther Asset Management
              在 2026 年 8 月 Form ADV 中的监管口径 AUM 为 $2.91 billion。这些都不能互换为收费收入的衡量方式。 它们确实显示出异常快的商业势头和庞大的 onboarding
              管线，但投资者仍看不到从顾问招募到已迁移资产、计费家庭、收入收益率和贡献利润的公开桥梁。
