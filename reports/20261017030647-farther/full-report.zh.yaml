      - number: '3.2'
        title: Farther 的切入口是深度一体化工作流，而不只是顾问品牌
        blocks:
          - type: paragraph
            body: >-
              保留证据中，Farther 最强的竞争位置不是低价，而是一体化运营模式。官方和独立来源都将 Farther 描述为把顾问招募到自有 RIA 平台，
              将规划、投资组合管理、税务工作、遗产规划、私募市场和家族办公室服务打包在一起。 管理层最新推出的产品进一步强化了这一定位：内部 proposal 工具取代了由 Excel、PowerPoint
              和第三方系统拼接的旧工作流， 同时把 onboarding 数据留在 Farther 自己的技术栈中。通过 Fidelity、Schwab、Pershing 和 Apex 支持多托管方也有竞争意义，
              因为这减少了顾问常见的顾虑：强迫客户经历破坏性的托管方变更。换句话说，Farther 卖给顾问的是更高生产力的运营环境， 而不只是一个新的面向客户的品牌。
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP009
              - CP016
