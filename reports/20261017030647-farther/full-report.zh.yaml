      - number: '8.2'
        title: 融资背景与情景边界
        blocks:
          - type: paragraph
            body: |-
              融资背景有支撑，但估值支撑仍薄弱。Farther 自己的 Series D 公告称公司已成为独角兽，独立登记类资料则将最新报告估值放在约 $1.25 billion，
              将此前 Series C 的投后估值列为 $542 million。这足以框定情景范围，却不足以把确切估值视为完全核实，
              因为至少一家独立追踪机构仍称最新已知估值未公开披露。可比公司集合也不完美。指定证据池中的公开类比对象将 Farther 与 Savvy Wealth、
              Compound Planning 等较小的平台型同行相比，而 Corient、Creative Planning 等大型 incumbent 通过并购扩张，属于不同商业模式。
              因此，下方估值区间是锚定已披露融资价格和公开运营里程碑的投资判断框架，不是市场已经验证精确公允价值的断言。
              基准情景假设资本仍可获得，但价格支撑仍不完整；乐观情景需要更好的转化和披露；悲观情景则围绕证明点未出现后的倍数压缩。
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: 尽调触发器与论点破坏因素
        blocks:
          - type: paragraph
            body: |-
              最终投资判断问题是，什么会让评级从 track 变成可投资。第一项要求是经审计或管理层认证的收入、利润率和烧钱披露，
              让买方检验 Farther 应获得软件型还是顾问事务所型倍数。第二项是资本结构清晰度：准确的 Series D 后估值、稀释后股数、
              期权池、参与投资者和清算优先权。第三项是证明招募资产故事确实转化为实际管理资产、顾问生产力和留存，
              而不是停留在规模很大但部分未转化的管线。问题解决前，论点破坏信号很明确：顾问招募放缓、招募与管理资产缺口扩大、
              转化或留存弱于预期，或任何定价低于或等于当前独角兽叙事的融资。任何一项出现，都会让当前入场价格显得过高，而不只是证据不足。
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: 展示
        blocks:
          - type: callout
            title: 公开证据对战略质量的支持强于对入场价格的支持
            body: Farther 看起来具备融资能力且有差异化，但收入、烧钱、股权结构表和招募转管理转化证据缺失， 使当前独角兽叙事不足以支持立即投资建议。
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV011
              - CV012
