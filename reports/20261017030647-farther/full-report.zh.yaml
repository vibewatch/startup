            - 税务、遗产与私募市场协调
          outputs:
            - 个性化顾问指导
        - label: 客户与家族办公室体验
          detail: 面向高净值和超高净值家庭的一体化服务与报告界面
          items:
            - 整合客户关系
            - 面向超高净值家庭的家族办公室服务
          outputs:
            - 全生命周期协调
        - label: 组合与财富引擎
          detail: 2026 年公司和出版方描述中提到的核心投资能力
          modules:
            - 动态资产配置
            - 增强执行
            - 风险管理
            - 另类资产 / 私募市场准入
        - label: 托管与规范数据
          detail: 公开招聘信息显示的多托管方数据基础
          modules:
            - 接入 Schwab、Fidelity 和 Pershing 的托管数据
            - 规范财务模型与对账
        - label: AI 检索与智能体层
          detail: 公开招聘信息显示的 AI 就绪数据和工作流组件
          modules:
            - 嵌入、向量搜索和适配 RAG 的数据模式
            - 智能体驱动的工作流与个性化洞察
        - label: 治理与审核控制
          detail: 公开招聘信息显示的数据和 AI 输出受控使用机制
          modules:
            - 数据血缘、可观测性与细粒度访问控制
            - 顾问交付前的智能体清单与人工审核
    claimRefs:
      - CE002
      - CE004
      - CE005
      - CE006
      - CE010
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Farther 的客户路径从招募顾问开始，随后扩展到家庭、家族办公室和更深层的客户关系。
    data:
      items:
        - label: 顾问招募
          touchpoints:
            - 脱离原机构的顾问和独立顾问因技术、运营支持和增长机会加入。
        - label: 平台导入
          touchpoints:
            - 规划、组合、税务、遗产和报告工作流迁移到一体化平台。
        - label: 客户组合转移
          touchpoints:
            - 现有客户关系转入 Farther，而托管仍可留在熟悉的服务商处。
        - label: 高净值家庭服务
          touchpoints:
            - 家庭获得投资、税务、遗产和整合报告方面的协调支持。
        - label: 超高净值扩展
          touchpoints:
            - Farther 家族办公室增加对更复杂税务、贷款、私募市场和遗产需求的支持。
        - label: 关系深化
          touchpoints:
            - 更多资产和更复杂的需求可以沿同一顾问—客户关系流转。
    approximationNotes: 这是根据公开材料对 Farther 顾问主导获客模式和客户扩展界面的方向性归纳，不是实测转化漏斗。
    claimRefs:
      - CU001
      - CU003
      - CU008
      - CU011
  - id: FR001
    title: 定性剩余风险热力图
    type: matrix
    summary: 最高的剩余风险同时具备潜在严重的客户或监管影响，以及偏高的运营信号或尚无法确定的发生概率。
    data:
      columns:
        - label: 可能性未确定
        - label: 中等可能性
        - label: 较高可能性
      rows:
        - label: 严重影响
          values:
            - 监管证据缺口；托管链与网络安全连续性
            - null
            - null
        - label: 高影响
          values:
            - 资本充足性与财务透明度
            - 顾问留存与客户组合可转移性
            - 招揽资产向管理资产的转化；合规与服务能力
        - label: 中等影响
          values:
            - 私募市场与费用冲突披露
            - 多托管方协调复杂度
            - 家族办公室执行广度
        - label: 转化质量
          values:
            - 费用实现仍未验证
            - 顾问群体流失
            - 预期资产落后于管理 AUM
        - label: 控制成熟度
          values:
            - 无法获得一手鉴证
            - 托管方协调
            - 规模化合规能力
        - label: 投资后果
          values:
            - 维持较高尽调负担
            - 要求持续监测顾问群体
            - 设置论点失效触发条件
    approximationNotes: 仅为分析师定性综合判断。概率未经统计估计；“可能性未确定”表示指定证据不足以支持可能性评估。
    claimRefs:
      - CR004
      - CR005
      - CR007
      - CR008
      - CR010
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 推荐仍为跟踪，原因是强劲融资势头被薄弱的公开价格支撑所抵消。
    data:
      nodes:
        - id: scale-proof
          label: 规模证明
          detail: $150 million D 轮融资和顾问招募势头显示公司仍能持续获得市场资源。
        - id: operating-caveat
          label: 运营提示
          detail: 最强的公开规模指标是招揽资产，而非已完全转化的管理资产或已披露收入。
        - id: valuation-anchor
          label: 估值锚点
          detail: 公开来源支持独角兽身份和据报道约 $1.25B 的估值，但不足以完全核实当前准确估值。
        - id: disclosure-gap
          label: 披露缺口
          detail: 公开来源仍无法获得收入、利润率、烧钱、股权结构表和清算优先权数据。
        - id: downside-risk
          label: 下行风险
          detail: 如果转化或留存不及预期，估值倍数压缩或平轮 / 下轮融资都可能发生。
        - id: recommendation
          label: 跟踪 / 估值偏高
          detail: 等待更充分的经济指标披露或更好的价格，再转为积极的投资判断。
      edges:
        - from: scale-proof
          to: operating-caveat
          label: 受……调节
        - from: operating-caveat
          to: valuation-anchor
          label: 限制
        - from: valuation-anchor
          to: disclosure-gap
          label: 仍缺少
        - from: disclosure-gap
          to: downside-risk
          label: 造成
        - from: downside-risk
          to: recommendation
          label: 驱动
    approximationNotes: 这是逻辑链，不是量化估值模型。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV009
      - CV011
      - CV012
