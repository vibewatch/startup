              - CI009
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              从财务角度看，Farther 是一个招募势头真实、变现层次多的高增长财富平台，但仅凭公开证据仍很难判断收入质量和利润率持久性。
              公开来源展示了费率上限、监管账户、融资和广泛的资产汇聚势头；没有展示经审计收入、毛利率、CAC、回本期、经营杠杆或烧钱。
              最影响决策的问题因此不是平台是否在增长，而是招募资产多快转为收费管理资产、各客户群的实际收入收益率和服务成本如何，
              以及最新融资能支撑当前招聘、产品和顾问获客投入多久。在管理层提供这些桥梁前，财务案例仍有吸引力但并不完整。
            claimRefs:
              - CI014
              - CI015
