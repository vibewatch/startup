      - number: '3.3'
        title: 持久性取决于能否对抗大型 incumbent、持续吸引顾问流入
        blocks:
          - type: paragraph
            body: >-
              壁垒有分量，但保留证据并未显示它不可攻破。Simplify 的批评摘要认为，Farther 以服务为重的模式仍需持续招募， 在 non-solicit 限制被否定时也会暴露于顾问可携客户之争。AI
              Pressroom 又发出市场结构警告：RIA 行业截至 2025 年第三季度完成 345 笔交易， 因此 Farther 必须在整合中的市场里与其他技术优先平台及正在整合 AI
              的大型公司竞争。价格透明度同样不均衡。 Farther 自身的费率区间和 wrap 披露部分公开，但指定资料池基本没有同行客户定价，难以证明持久的价格优势。 最后，Farther Asset Management
              的 Form ADV 数据强调，受监管实体指标与 headline 招募资产指标不是一回事， 因此尽调应把平台势头与已完整 onboarding 且产生费用的资产分开。
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP014
              - CP015
      - number: '3.4'
        title: 展示
        blocks:
          - type: callout
            title: Farther 将多个替代工具压缩进一个顾问工作流
            body: 保留证据在 Farther 替代手工或碎片化顾问工作流的地方最有说服力，而不是在其声称拥有简单费率优势的地方。 这正是它能从附加型机构和点方案栈手中赢得顾问的最清晰理由。
            calloutType: strength
            claimRefs:
