    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 牛市
        - 管理资产和顾问生产力追上招募资产增长，且管理层披露与高端平台经济性一致的收入和利润率数据。
        - 只有公开数据或仅限尽调的数据证明经济性持久且转化率高，报告约 $1.25B 水平之上的上行空间才有支撑。
        - 披露仍可能滞后；在证据出现前，高端倍数可能压缩。
        - 没有新增披露时，概率低。
      - - 基准
        - Farther 继续融资并招募顾问，但市场仍需从资产和招募里程碑推断经济性。
        - 公允价值集中在当前独角兽叙事附近，而非明显高于该叙事，因此更适合持有 / 跟踪，而不是激进入场。
        - 在投资判断支撑仍不完整时，市场可能继续奖励增长势头。
        - 以当前证据看，概率最高。
      - - 熊市
        - 招募资产增长放缓、转化为管理资产的表现令人失望，或融资条款暴露出弱于标题融资轮所暗示的经济性。
        - 由于公开记录尚不足以证明应显著高于今日报告区间的价格，私募估值持平至下调都变得合理。
        - 下轮融资风险、倍数压缩或优先权悬置可能主导叙事。
        - 如果尽调无法填补当前缺口，影响将很大。
    notes: 情景区间是基于已披露融资轮标记（> $1B 独角兽地位和报告约 $1.25B 的最新估值）的投资判断，而非报告的公允价值。
    claimRefs:
      - CV001
      - CV003
