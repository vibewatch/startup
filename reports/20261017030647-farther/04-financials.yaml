  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-disclosure
      missingEvidence: Audited revenue, gross margin, EBITDA, and the revenue-recognition policy by business line.
      whyItMatters: Underwriting revenue quality and margin path is not possible from fundraising and asset-gathering disclosures alone.
      diligencePath: Request audited or board-quality financial statements plus a revenue bridge by advisory, wrap, planning, and alternative-product lines.
      relatedQuestionRefs: [QI004, QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: pricing-realization
      missingEvidence: Realized fee yield by household/advisor cohort, discount policy, and the share of assets billed under each pricing model.
      whyItMatters: Public fee caps and ranges do not reveal actual monetization or contribution margin.
      diligencePath: Request billing exports or cohort summaries tying managed assets to billed advisory revenue and ancillary fees.
      relatedQuestionRefs: [QI003, QI008]
      relatedTableRefs: [TI001, TI002]
    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: Current cash balance, monthly burn, debt or credit facilities, and management's runway assumptions after the Series D.
      whyItMatters: A large raise confirms capital access but does not prove runway sufficiency at current recruiting and product-investment intensity.
      diligencePath: Request treasury dashboard excerpts, latest cash reconciliation, debt schedules, and the board runway model.
      relatedQuestionRefs: [QI005, QI008]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Advisor recruiting CAC, transition timeline, client acquisition CAC where relevant, retention, and payback by recruiting vintage.
