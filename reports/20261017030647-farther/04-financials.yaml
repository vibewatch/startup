      - [Typical advisory fee, "≈1% according to third-party review", "Directional realized proxy, not audited company disclosure", "Basis, sample, and exceptions not published", "private.law review"]
      - [Wrap program, "0.35%-2.00% depending on size and complexity", "List/range only", "Share of assets inside wrap and embedded trading economics not public", "private.law review of ADV"]
      - [Hourly planning / flat fee, "Up to $1,000 per hour; flat fees at firm discretion", "Available, but not quantified as revenue mix", "Utilization, average realization, and client segment mix not public", "private.law review"]
      - [Alternative / private-market products, "Charged on top of base advisory fee", "Ancillary monetization path", "Manager economics, revenue share, and attach rate not public", "private.law review"]
    notes: "This table distinguishes publicly observable pricing surfaces from realized monetization, which remains undisclosed in the assigned evidence."
    claimRefs: [CI006, CI007]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Recruited assets (Q1 2026)", "$23B", high, "Shows adviser-recruiting momentum and future billing pipeline", "Bridge recruited assets to transitioned AUM, billed accounts, and monthly revenue"]
      - ["Managed assets (Apr 2026)", "$15B", medium, "Closer to fee-bearing assets than recruited-assets headline", "Provide monthly managed-AUM history and transition lag from signed advisers"]
      - ["Regulatory AUM (Aug 13 2026 filing)", "$2.91B", high, "Harder filing-based asset measure for Farther Asset Management", "Reconcile filing entity, billing entity, and consolidated platform assets"]
      - ["Client accounts (Aug 13 2026 filing)", "9,645", high, "Supports household/account scale but not revenue per account", "Disclose households, average revenue per household, and segment mix"]
      - ["Advisor growth proxy", "Up to 3x organic growth vs industry average", high, "Suggests sales productivity, but it is company-claimed rather than independently audited", "Provide cohort-level advisor productivity, retention, and payback by recruiting vintage"]
      - ["Public revenue / gross margin", null, low, "Core underwriting base is missing from public sources", "Provide audited revenue, gross margin, EBITDA, and revenue recognition policy"]
      - ["CAC / payback / burn / runway", null, low, "Capital adequacy cannot be underwritten without acquisition cost and cash-consumption data", "Provide advisor recruiting CAC, client acquisition CAC where relevant, monthly burn, cash balance, and runway assumptions"]
    notes: "Null values indicate material public-data gaps rather than zero; public sources disclose asset and account measures but not the operating-income bridge."
    claimRefs: [CI003, CI004, CI005, CI010, CI014, CI015]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence supports the monetization chain from adviser recruitment to asset-based fees, but the bridge breaks before disclosed revenue yield or gross profit.
    data:
      nodes:
        - label: Recruit advisers onto Farther
          detail: Public materials repeatedly frame growth around advisor recruitment and platform adoption.
          claimRefs: [CI008, CI010]
        - label: Win recruited assets
          value: "$23B recruited assets"
          detail: Company metric includes both transitioned assets and books expected from incoming advisors.
          claimRefs: [CI003]
        - label: Convert to managed assets
          value: "$15B managed assets"
          detail: Independent reporting shows a lower managed-assets figure than recruited assets, implying onboarding and transition lag.
          claimRefs: [CI004]
        - label: Filing-based regulatory AUM
          value: "$2.91B regulatory AUM"
          detail: Form ADV reporting for Farther Asset Management provides a still narrower regulatory asset base.
          claimRefs: [CI005]
        - label: Charge advisory and wrap fees
          value: "0.35%-2.00% wrap; up to 2% cap"
          detail: Public fee surfaces show list and ceiling pricing rather than realized monetization.
          claimRefs: [CI006, CI007]
        - label: Realized revenue and gross profit remain undisclosed
          detail: Assigned public sources do not disclose audited revenue, gross margin, CAC, payback, burn, or runway.
          claimRefs: [CI014, CI015]
    claimRefs: [CI003, CI004, CI005, CI006, CI007, CI014, CI015]
