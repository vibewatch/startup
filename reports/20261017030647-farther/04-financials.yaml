      - [Planning / hourly / flat fees, "Planning engagements priced outside or alongside recurring AUM billing", "Hourly or flat fee", "Hourly pricing up to $1,000; flat fees available at firm discretion", "Available publicly, but contribution is not quantified", "Disclose annual revenue contribution and attach sample client agreements"]
      - [Private markets / fund access, "Additional fees on alternatives and third-party products layered onto advisory relationship", "Product-specific fees", "Publicly acknowledged, but fee economics not broken out", "Mechanism is known; take rate and attach rate are unknown", "Disclose private-market fee splits, average attachment by client cohort, and conflicts controls"]
