company:
  name: Farther
chapter:
  number: 4
  title: Financials
  summary: >-
    Farther's public financial picture is dominated by fundraising and asset-gathering disclosures rather than audited operating statements. The clearest supported model is an adviser-recruiting RIA that monetizes transitioned client assets through negotiable AUM-based fees, but public evidence still does not disclose realized take rate, gross margin, CAC/payback, burn, or runway.
sections:
  - id: revenue-model
    title: Revenue model and pricing visibility
    body: >-
      The public evidence supports Farther as an RIA whose monetization is tied primarily to adviser-led asset gathering rather than a separate disclosed software-license stream. Company materials frame the platform as the operating layer that helps recruited advisers win and serve clients, while third-party summaries describe the fee stack as negotiable AUM-based pricing, wrap-program fees, and additional charges for private-market or third-party products. That is enough to establish the revenue mechanism, but not the realized net take rate: list and ceiling pricing are public, while discounts, waivers, household mix, and the share of assets that pay a full advisory fee remain undisclosed. The result is a monetization model that is legible at the product level but still under-documented for underwriting.
    claimRefs: [CI006, CI007, CI008]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-metrics
    title: Public traction metrics use different denominators
    body: >-
      Farther's headline scale claims are directionally strong but mix three different bases: recruited assets, managed assets, and regulatory AUM. The company says recruited assets surpassed $23 billion in Q1 2026, explicitly including books that advisers are expected to bring over in coming months, while RIABiz separately reported $15 billion of managed assets in April 2026 and a filing-derived page shows $2.91 billion of regulatory AUM for Farther Asset Management in an August 2026 Form ADV filing. Those are not interchangeable measures of fee-bearing revenue. They do indicate unusually fast commercial momentum and a large onboarding pipeline, but they also leave investors without a public bridge from advisor recruiting to transitioned assets, billed households, revenue yield, and contribution margin.
    claimRefs: [CI003, CI004, CI005, CI010]
    tableRefs: [TI003]
  - id: capital-needs
    title: Capital supports growth, not yet underwriting clarity
    body: >-
      The strongest disclosed capital fact is the May 2026 $150 million Series D led by General Atlantic, which took cumulative funding above $272 million and was described as fuel for continued platform expansion and innovation. That supports the view that Farther is still in investment mode: adviser recruiting, platform development, family-office expansion, and service delivery are all scaling simultaneously, while the company still relies on self-reported growth metrics rather than published financial statements. Independent commentary also flags a structural downside to the model: if advisor inflows slow, the services-heavy organization can lose AUM momentum before fixed operating costs rebase. Without disclosed cash balance, burn, or debt obligations, the capital raise is evidence of resources available but not of runway sufficiency.
    claimRefs: [CI001, CI002, CI009, CI011, CI012, CI013]
  - id: verdict
    title: Financial verdict and diligence blockers
    body: >-
      Financially, Farther looks like a high-growth wealth platform with real recruiting traction and multiple monetization layers, but revenue quality and margin durability remain hard to underwrite from public evidence alone. Public sources show fee ceilings, regulatory accounts, fundraising, and broad asset-gathering momentum; they do not show audited revenue, gross margin, CAC, payback, operating leverage, or burn. The most decision-relevant questions are therefore not whether the platform is growing, but how quickly recruited assets convert into fee-paying managed assets, what realized revenue yield and service cost look like by client segment, and how long the latest financing can fund current hiring, product, and advisor-acquisition intensity. Until management provides those bridges, the financial case remains promising but incomplete.
    claimRefs: [CI014, CI015]
callouts:
  - calloutType: insight
    title: Asset headline is not revenue
    body: >-
      The $23 billion recruited-assets figure is a pipeline-plus-AUM metric, not a disclosed revenue base, and public sources separately show smaller managed-assets and regulatory-AUM measures.
    claimRefs: [CI003, CI004, CI005]
  - calloutType: strength
    title: Fresh capital buys operating time
    body: >-
      A $150 million Series D and more than $272 million raised since founding meaningfully expand Farther's capacity to keep investing in adviser recruiting and platform development.
    claimRefs: [CI001, CI002, CI009]
  - calloutType: risk
    title: Recruiting dependence is the key financial fragility
    body: >-
      Public adverse commentary consistently points to the same risk: if advisor recruiting and transition slow, Farther's services-heavy model can see AUM momentum fade before its cost base adjusts.
    claimRefs: [CI011, CI012]
