      really is.
    diligencePath: Obtain management reporting that breaks out AUM, revenue, and inflows by top relationships and advisor cohorts.
    relatedQuestionRefs:
      - QU006
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: named-user-proof
    missingEvidence: Independently verified customer case studies with timestamps, deployment scope, and measured outcomes.
    whyItMatters: The chapter can verify named advisor-side usage, but not independently validate customer outcome quality.
    diligencePath: Ask for three referenceable client or advisor case studies with external corroboration and production dates.
    relatedQuestionRefs:
      - QU003
      - QU009
    relatedTableRefs:
      - TU003
  - type: conflicting-data
    severity: material
    topic: metric-scope
    missingEvidence: >-
