evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headquarters
    missingEvidence: >-
      A primary current filing or company disclosure that identifies Farther's principal office and complete
      operating-office footprint.
    whyItMatters: >-
      Headquarters is a reusable identity fact, and conflicting city labels can distort later regulatory and hiring
      analysis.
    diligencePath: >-
      Obtain the current Form ADV brochure or another company-approved legal-entity disclosure naming the principal
      office.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: valuation-and-governance
    missingEvidence: >-
      The exact Series D post-money valuation, fully diluted cap table, liquidation preferences, board roster, and
      investor control rights.
    whyItMatters: >-
      Public evidence supports unicorn status but cannot establish dilution, control, or the exact valuation paid by
      investors.
    diligencePath: Request the Series D term sheet, current cap table, charter, investor-rights agreement, and board materials.
    relatedQuestionRefs:
      - QO002
      - QO003
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited revenue, gross margin, operating loss, cash balance, burn, runway, verified headcount, and current
      customer count.
    whyItMatters: Funding raised is not cash available, and recruited assets do not establish revenue quality or profitability.
    diligencePath: >-
      Request audited financial statements, monthly management accounts, a current KPI deck, and dated HR and
      client-count exports.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: scale-conversion
    missingEvidence: >-
      A reconciliation of recruited assets to onboarded regulatory AUM, including conversion timing, attrition, and
      advisor-cohort retention.
    whyItMatters: >-
      The $23 billion headline includes expected incoming assets and therefore cannot be used as a current
      managed-assets denominator.
    diligencePath: Request cohort-level recruited, committed, transferred, and retained asset schedules with advisor start dates.
    relatedQuestionRefs:
      - QO004
      - QO006
  - type: missing-source
    severity: material
    topic: adverse-signals
    missingEvidence: >-
      Primary court records and management context for the cited client-poaching dispute, plus advisor attrition and
      non-solicitation policy data.
    whyItMatters: A single job-board summary cannot establish the scope, outcome, or ongoing economic effect of the dispute.
    diligencePath: >-
      Obtain the complaint and docket, interview management, and review advisor departures, client portability, and
      legal expense trends.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: material
    topic: tam-gap
    missingEvidence: >-
      An external market study or public-company disclosure that isolates the addressable spend for advisor operating
      platforms plus discretionary wealth-advice services in Farther's target segment.
    whyItMatters: >-
      Without an external denominator, valuation work has to lean on company-footprint metrics instead of a clean
      TAM/SAM/SOM frame.
    diligencePath: >-
      Request management's internal market map and the outside studies or benchmarking decks used in board and
      fundraising materials.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: conversion-pipeline
    missingEvidence: Cohort data showing how recruited advisor books convert into transitioned managed assets over time.
    whyItMatters: >-
      The central growth metric in public materials is recruited assets, but underwriting adoption durability requires
      conversion timing and fallout rates.
    diligencePath: >-
      Ask for onboarding funnel data by advisor cohort, including booked assets, transitioned assets, time to
      conversion, and attrition.
    relatedQuestionRefs:
      - QM005
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: budget-ownership
    missingEvidence: >-
      Public detail on how advisory fees, platform economics, and any advisor-level subsidies split between Farther and
      recruited advisors.
    whyItMatters: >-
      The buyer and payer roles are clear directionally, but the exact economic decision-maker matters for adoption
      timing and margin quality.
    diligencePath: Request advisor recruiting decks, sample economics, and anonymized client/advisor fee schedules.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable client fee schedules, payout grids, and realized pricing data for Savvy, Compound, Corient, Creative
      Planning, and the infrastructure vendors in the retained set.
    whyItMatters: >-
      Without like-for-like peer pricing and advisor-economics data, it is not possible to prove whether Farther wins on
      price, on payout, or mainly on workflow productivity.
    diligencePath: >-
      Request peer fee cards, advisor transition packages, and realized client pricing from management or channel checks
      before underwriting pricing-based differentiation.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: Audited revenue, gross margin, EBITDA, and the revenue-recognition policy by business line.
    whyItMatters: >-
      Underwriting revenue quality and margin path is not possible from fundraising and asset-gathering disclosures
      alone.
    diligencePath: >-
      Request audited or board-quality financial statements plus a revenue bridge by advisory, wrap, planning, and
      alternative-product lines.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: >-
      Realized fee yield by household/advisor cohort, discount policy, and the share of assets billed under each pricing
      model.
    whyItMatters: Public fee caps and ranges do not reveal actual monetization or contribution margin.
    diligencePath: Request billing exports or cohort summaries tying managed assets to billed advisory revenue and ancillary fees.
    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Current cash balance, monthly burn, debt or credit facilities, and management's runway assumptions after the
      Series D.
    whyItMatters: >-
      A large raise confirms capital access but does not prove runway sufficiency at current recruiting and
      product-investment intensity.
    diligencePath: Request treasury dashboard excerpts, latest cash reconciliation, debt schedules, and the board runway model.
    relatedQuestionRefs:
      - QI005
      - QI008
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Advisor recruiting CAC, transition timeline, client acquisition CAC where relevant, retention, and payback by
      recruiting vintage.
    whyItMatters: The economic durability of Farther's adviser-led growth engine cannot be assessed from asset headlines alone.
    diligencePath: >-
      Request cohort reporting that links recruiting cost, advisor productivity, transitioned AUM, revenue, and
      retention over time.
    relatedQuestionRefs:
      - QI004
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: trust-controls-gap
    missingEvidence: >-
      A public or management-provided trust package covering security architecture, SOC or equivalent audit status,
      penetration-test summary, data-retention rules, model-governance controls, and incident-response procedures.
    whyItMatters: >-
      Farther's differentiation increasingly depends on AI-assisted workflows in a regulated wealth environment, so
      underwriting the product requires more than marketing language about human review.
    diligencePath: >-
      Request the latest security and compliance package, including third-party audit letters, model-governance policy,
      role-based access controls, and any client-facing trust documentation.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: deployment-metrics
    missingEvidence: >-
      Module-level adoption, onboarding duration, support-response targets, uptime history, exception rates, and
      book-conversion metrics from recruited assets to managed platform usage.
    whyItMatters: >-
      The platform story depends on operational leverage at scale, but public sources stop at product breadth and
      fundraising without proving implementation reliability.
    diligencePath: >-
      Ask management for operational dashboards by module and custodian, plus cohort data on advisor onboarding, service
      tickets, and conversion from recruited to managed assets.
    relatedQuestionRefs:
      - QE004
      - QE008
    relatedTableRefs:
      - TE001
      - TE002
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: Public NRR, GRR, churn, renewal, and cohort data by advisor vintage or client segment.
    whyItMatters: >-
      Retention quality is the clearest test of customer durability and expansion, and it is missing from the assigned
      pool.
    diligencePath: >-
      Request cohort tables for households, client assets, and advisor books by join quarter with renewal and attrition
      detail.
    relatedQuestionRefs:
      - QU006
  - type: missing-source
    severity: material
    topic: concentration
