      accounts.
    whyItMatters: Without a reconciliation, customer-scale claims can overstate realized adoption or hide onboarding lag.
    diligencePath: >-
      Request a dated funnel bridge that reconciles every public asset and account metric to the relevant legal entity
      and onboarding stage.
    relatedQuestionRefs:
      - QU002
      - QU004
    relatedTableRefs:
      - TU002
  - type: missing-source
    severity: material
    topic: primary-risk-evidence
    missingEvidence: >-
      Current Form ADV Parts 1 and 2, amendments, examination correspondence, complaints, litigation records, and
      insurance schedules.
    whyItMatters: >-
      Primary records are required to characterize regulatory and legal likelihood rather than infer safety from limited
