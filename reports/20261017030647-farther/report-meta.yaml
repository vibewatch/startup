companyProfile:
  summary: >-
    Farther is an advisor-led, AI-native wealth-management company that pairs a proprietary Intelligent Wealth Platform
    with recruited advisors to serve high-net-worth and ultra-high-net-worth households, while also reaching some
    small-business and institutional relationships. The company has raised a $150 million Series D led by General
    Atlantic and publicly positions growth around asset gathering, advisor productivity, and automation, but audited
    economics, a clean cap table, and complete governance disclosure remain opaque.
