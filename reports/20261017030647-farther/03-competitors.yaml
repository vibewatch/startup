schemaVersion: report-v2
artifact: competitors
slug: farther
runDate: 2026-10-17
company:
  name: Farther
chapter:
  number: 3
  title: Competitors
  summary: >-
    Farther competes less with pure robo-advisors than with three buyer choices:
    tech-forward recruiter/platform RIAs, large consolidators and wirehouses,
    and advisor infrastructure vendors that overlap on workflow. The company's
    most defensible edge in the assigned evidence is its integrated RIA plus
    in-house AI tooling, but that edge still has to outrun much larger
    distribution engines and a recruiting model that depends on continued advisor
    inflows.
sections:
  - id: competitive-set
    title: Competitive set is fragmented, but the closest buyer alternatives are identifiable
    body: >-
      The assigned evidence points to a fragmented landscape rather than a single
      one-to-one rival. Independent writeups place Farther against tech-forward
      recruiter/platform RIAs such as Savvy and Compound, against much larger
      consolidators such as Corient and Creative Planning, and against
      infrastructure vendors such as Addepar and Orion that overlap on advisor
      workflow but do not replace the full advisory relationship. That matters
      because a buyer evaluating Farther is really choosing among different
      operating models: a software-led recruiting platform, an acquisition-led
      incumbent, or a point-solution stack assembled around an existing practice.
      Public scale markers also separate these cohorts. Savvy and Compound are
      the closest product-model neighbors in the pool, but both remain much
      smaller on disclosed AUM than Farther's public platform claims, while
      Corient and Creative Planning represent the opposite threat: far larger
      distribution and balance-sheet scale even if their software story is less
      central in the retained evidence.
    claimRefs: [CP003, CP004, CP005, CP006, CP007]
    tableRefs: [TP001]
  - id: differentiation-and-switching
    title: Farther's wedge is integrated workflow depth, not just advisor branding
    body: >-
      Farther's strongest competitive position in the retained evidence is not
      low price; it is an integrated operating model. Official and independent
      sources consistently describe Farther as recruiting advisors onto a
      proprietary RIA platform that bundles planning, portfolio management, tax
      work, estate planning, private markets, and family-office services.
      Management's newest launch sharpens that position: the in-house proposal
      tool replaces an older workflow stitched across Excel, PowerPoint, and
      third-party systems, while preserving onboarding data inside Farther's own
      stack. Multi-custodian support through Fidelity, Schwab, Pershing, and
      Apex also matters competitively because it reduces a common advisor
      objection: forcing clients through a disruptive custodian change. In other
      words, Farther is selling a higher-productivity operating environment to
      advisors, not merely a new client-facing brand.
    claimRefs: [CP001, CP002, CP008, CP009, CP016]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: durability-risks
    title: Durability depends on sustaining advisor inflows against larger incumbents
    body: >-
      The moat is meaningful, but the retained evidence does not show it is
      unassailable. Simplify's critic summary argues that Farther's
      services-heavy model still needs relentless recruiting and remains exposed
      to advisor-portability fights when non-solicit restrictions are rejected.
      AI Pressroom adds a market-structure warning: the RIA sector logged 345
      transactions through Q3 2025, so Farther must compete in a consolidating
      market against other tech-first platforms and larger firms integrating AI.
      Pricing transparency also remains uneven. Farther's own fee bands and wrap
      disclosures are partly public, but peer client pricing is largely absent in
      the assigned pool, which makes it hard to prove a durable price advantage.
      Finally, Form ADV data for Farther Asset Management underscores that
      regulated-entity metrics and headline recruited-asset metrics are not the
      same thing, so diligence should separate platform momentum from assets that
      are already fully onboarded and fee-bearing.
    claimRefs: [CP010, CP011, CP012, CP013, CP014, CP015]
    tableRefs: [TP003]
tables:
  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor
      - Category
      - Public scale or funding signal
      - Target segment
      - Differentiation
      - Limitation
    rows:
      - [Savvy Wealth, Tech-forward recruiter/platform RIA, "~$4B AUM by summer 2026; $26.5M Series A in Aug 2024", Advisors seeking a central platform plus HNW clients, Adviser recruiting paired with a central technology platform, Smaller than Farther on disclosed scale]
      - [Compound Planning, Digital family office / tech-led RIA, "Passed $5B AUM in Apr 2026", Tech audience and affluent households, Digital family-office positioning, Smaller than Farther on disclosed scale]
      - [Corient, Incumbent consolidator RIA, "$508B client assets after 2026 UK deals", Wealthy households via acquired RIAs, Massive distribution and acquisition capacity, Growth model is M&A-led rather than a software-native platform]
      - [Creative Planning, Large independent wealth manager, "$300B+ client assets", Broad full-service advice users, Scale plus independent-channel alternative to wirehouses, Assigned pool does not evidence software depth comparable to Farther's stack]
    notes: >-
      Scale and category data come from retained independent dossiers; rows mix
      AUM, client assets, and funding because peer disclosures are not uniform.
    claimRefs: [CP004, CP005, CP006]
  - id: TP002
    title: Feature / capability matrix
    columns:
      - Buying criterion
      - Farther
      - Tech-forward recruiter RIAs
      - Consolidators / wirehouses
      - Infrastructure vendors
    rows:
      - [Primary growth motion, Recruits independent and breakaway advisors onto its own RIA platform, Comparable recruiter-platform or digital-family-office model, Primarily scale through M&A or legacy distribution, Sell software into advisory firms rather than the full advisory relationship]
      - [Client experience scope, Planning plus investing tax estate private markets and family office inside one stack, Partial public evidence in assigned pool, Full-service advice exists but software depth is not evidenced in the retained pool, Workflow overlap on reporting and portfolio operations rather than end-to-end wealth management]
      - [Switching friction, Multi-custodian setup can preserve an existing custodian relationship, Unknown in assigned sources, Unknown in assigned sources, Not a direct custody-transition substitute for the client relationship]
      - [AI / workflow depth, In-house AI proposal tool and integrated onboarding workflow are explicit, Not supported in assigned sources, Not supported in assigned sources, Tooling overlap exists but full-stack advice is not evidenced in retained sources]
    notes: >-
      Unsupported cells are marked unknown or partial rather than inferred from
      outside sources; this matrix compares public evidence quality as well as
      product scope.
    claimRefs: [CP001, CP002, CP003, CP004, CP008, CP016]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Commercial lever
      - Farther evidence
      - Alternative evidence in assigned pool
      - Implication
    rows:
      - [End-client advisory fee, "Negotiable; disclosed cap of 2% of AUM and reviews cite ~1% typical level", Peer client fee schedules were not surfaced in retained sources, Public fee transparency is stronger for Farther than for the retained peers but realized pricing still needs diligence]
      - [Wrap / program pricing, "Current ADV description cited at 0.35-2.00% depending on size and complexity", No comparable wrap pricing surfaced for peer platforms, Buyers still need all-in fee-stack diligence including underlying fund and private-market charges]
      - [Advisor transition economics, "Independent-channel pitch includes equity participation and book ownership", "Wirehouses can pay >300% of annual revenue with ~10-year vesting", Competitive pressure is as much about advisor payout and ownership as about end-client sticker price]
    notes: >-
      This table mixes client pricing and advisor economics because the assigned
      pool exposes Farther's fee bands and wirehouse recruiting economics but not
      clean like-for-like peer fee cards.
    claimRefs: [CP010, CP014, CP015]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal map of workflow integration versus distribution leverage based only
      on retained evidence.
    xAxis:
      label: Integrated workflow depth (ordinal)
      min: 1
      max: 6
      low: Point-solution overlap only
      high: Full-stack advice plus proprietary workflow
      description: Evidence-backed ordinal scoring from retained sources
      scale: ordinal
    yAxis:
      label: Distribution and scale leverage (ordinal)
      min: 1
      max: 6
      low: Niche or emerging reach
      high: National scale or entrenched distribution
      description: Evidence-backed ordinal scoring from retained sources
      scale: ordinal
    data:
      points:
        - label: Farther
          x: 5
          y: 4
          detail: Integrated RIA platform plus in-house AI tooling; >15B managed assets and ~23B recruited assets in public materials.
        - label: Savvy Wealth
          x: 4
          y: 2
          detail: Comparable recruiter-platform model; ~4B AUM by summer 2026.
        - label: Compound Planning
          x: 4
          y: 2.5
          detail: Digital family-office positioning; >5B AUM by Apr 2026.
        - label: Creative Planning
          x: 2.5
          y: 5.5
          detail: ">300B client assets; large independent channel alternative, but software depth is not evidenced in the retained pool."
        - label: Corient
          x: 2.5
          y: 6
          detail: $508B client assets and acquisition-led scale.
        - label: Addepar / Orion class
          x: 4
          y: 3
          detail: Strong workflow overlap on analytics and portfolio operations, but retained evidence does not show a full-service advisory relationship.
    approximationNotes: >-
      Coordinates are ordinal judgments anchored to retained evidence, not
      measured benchmarks; they compare operating-model position rather than
      valuation or market share.
    claimRefs: [CP003, CP005, CP006, CP007, CP008]
callouts:
  - calloutType: strength
    title: Farther compresses multiple substitute tools into one advisor workflow
    body: >-
      The retained evidence is most convincing where Farther replaces manual or
      fragmented advisor workflows, not where it claims a simple fee advantage.
      That is the clearest reason it can win advisors away from bolt-on
      institutions and point-solution stacks.
    claimRefs: [CP001, CP002, CP016]
  - calloutType: risk
    title: Scale incumbents can counter with distribution and advisor economics
    body: >-
      Farther does not need a single perfect rival to face pressure. Large
      consolidators and wirehouses can counter with much bigger distribution,
      acquisition capacity, or recruiting packages, while the platform's own
      momentum still depends on sustained advisor inflows.
    claimRefs: [CP006, CP011, CP012, CP015]
