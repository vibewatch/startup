    notes: "These are constrained sizing lenses drawn from public operating disclosures; they are not additive and should not be treated as a clean TAM/SAM/SOM stack."
    claimRefs: ["CM001", "CM008", "CM009", "CM010", "CM014"]
  - id: "TM003"
    title: "Segment / buyer map"
    columns: ["Segment", "Buyer", "User", "Payer", "Workflow", "Budget owner", "Adoption trigger"]
    rows:
