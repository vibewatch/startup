      - ["Mass-affluent / HNW households", "Household client choosing an advisor relationship", "Household members plus advisor", "Household advisory fee", "Integrated planning, investing, tax, and reporting", "Household decision-maker", "Desire for coordinated advice instead of fragmented accounts and point solutions"]
      - ["UHNW families / entrepreneurs", "Family principals or entrepreneurs", "Family-office stakeholders, advisor, and specialists", "Family entity or household", "Family-office coordination, private markets, estate and lending complexity", "Family principal or delegated CFO / office lead", "Need for bespoke, multi-service coordination"]
      - ["Small businesses / institutions", "Owner, CFO, or investment decision-maker", "Finance staff, beneficiaries, and advisor", "Business or institutional entity", "Advisory relationship named in company materials, often alongside broader planning and investment oversight", "Business owner, CFO, or committee", "Need for a modern alternative to legacy advisory relationships"]
    notes: "The map reflects stated segments and workflow roles from assigned sources; payer mechanics remain only partially disclosed in public materials."
    claimRefs: ["CM003", "CM004", "CM005", "CM011", "CM012"]
