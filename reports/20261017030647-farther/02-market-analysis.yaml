chapter:
  number: 2
  title: "Market Analysis"
  summary: "Public evidence supports Farther as an advisor-led wealth-management platform rather than a generic fintech TAM story: the market boundary is modern discretionary advice plus the operating stack that lets breakaway advisors serve households more efficiently. The available numeric lenses are useful but non-comparable, because public sources mix recruited assets, managed assets, affiliate regulatory AUM, and client-account counts instead of a clean external TAM/SAM/SOM."
sections:
  - id: "market-boundary"
    title: "Market boundary and substitute set"
    body: "The public record supports a narrower market definition than a generic \"wealthtech\" label. Farther is competing in modern fee-based wealth advice and the advisor operating layer that sits behind it: planning, portfolio management, tax and estate workflows, private-market access, and client reporting delivered through one platform. That means the included spend is recurring advisory and workflow spend attached to client relationships, while excluded spend includes self-directed brokerage, pure banking products, and standalone point tools that do not carry the full advice relationship. The substitute set is therefore not only other tech-forward RIAs, but also wirehouses, private banks, and the fragmented mix of legacy advisor tools Farther says it is replacing. This boundary matters because Farther's growth motion starts with advisors switching operating models, not with anonymous retail app downloads."
    claimRefs: ["CM001", "CM002", "CM003", "CM006", "CM007"]
    tableRefs: ["TM001"]
  - id: "sizing-lenses"
    title: "Sizing lenses are real, but they are not a clean TAM/SAM/SOM"
    body: "Farther discloses enough operating metrics to frame the shape of the opportunity, but not enough to isolate an external TAM, SAM, and SOM. Company-linked sources cite more than $23 billion in recruited assets and more than $15 billion in managed assets, while an affiliate Form ADV excerpt reports $2.905 billion of regulatory AUM and 9,645 client accounts. Those are all valid numbers, but they are not interchangeable: recruited assets include expected books from joining advisors, managed assets describe a broader operating snapshot, and regulatory AUM is a filing-defined subset with its own timing and entity boundary. As a result, public sizing today is best treated as a set of constrained serviceable-market lenses rather than a single market-size proof point. That keeps the chapter evidence-backed while preserving the diligence gap that still matters for valuation."
    claimRefs: ["CM008", "CM009", "CM010", "CM014"]
    tableRefs: ["TM002"]
    figureRefs: ["FM001"]
  - id: "buyers-and-adoption"
    title: "Buyer, user, payer, and adoption path"
    body: "Farther's adoption path runs through two linked customer groups. The first buyer is the advisor or advisory team considering a move away from a wirehouse or legacy RIA environment; the user is that advisor and supporting staff, and the economic decision is tied to payout, workflow efficiency, recruiting support, and ownership of the client book. The second buyer/payer is the end client household or entity that pays ongoing advisory fees once assets are on platform. Public descriptions consistently point to high-net-worth households as the center of gravity, with extensions into ultra-high-net-worth family-office use cases, plus smaller but explicit references to institutions and small businesses. That structure is important because Farther does not need to win broad consumer mindshare all at once; it needs to keep recruiting advisors whose books and end-clients migrate with them."
    claimRefs: ["CM003", "CM004", "CM005", "CM010", "CM012"]
    tableRefs: ["TM003"]
  - id: "drivers-and-constraints"
    title: "Demand drivers, constraints, and remaining diligence gaps"
    body: "The strongest demand driver in the assigned evidence is workflow replacement. Company and independent descriptions repeatedly frame Farther as an answer to legacy advisor software sprawl, promising more time with clients, better data, and integrated planning, tax, and investment workflows. That helps explain why advisor recruitment is the front door to market expansion. The same evidence also points to the main constraints: retention has to stay attractive enough that recruited advisors do not leave, the gap between recruited and transitioned assets has to close, and compliance and service quality have to keep pace with rapid scale. Those risks do not invalidate the growth story, but they do mean the public record supports a serviceable-market thesis better than a fully underwritten TAM/SAM/SOM model."
    claimRefs: ["CM009", "CM011", "CM013", "CM014"]
