    title: "Constrained public market-sizing stack"
    type: "pyramid"
    summary: "The public record supports a narrowing operating stack from distribution footprint to recruited and managed assets, but the layers are not additive enough to pass as a classical TAM/SAM/SOM."
    data:
      items:
        - label: "Status-quo substitute layer"
          detail: "Wirehouses, private banks, and fragmented advisor software are the incumbent alternative Farther is trying to displace."
          note: "Boundary anchor rather than a revenue denominator."
          claimRefs: ["CM007"]
        - label: "RIA distribution footprint"
          value: 51
          unit: "jurisdictions"
          detail: "Farther's SEC registration plus state and D.C. notice filings show national distribution capacity."
          claimRefs: ["CM001"]
        - label: "Advisor-led recruited pipeline"
          value: 23
          unit: "USD billions"
          detail: "Company-defined recruited assets include both current AUM and books expected from joining advisors."
          claimRefs: ["CM003", "CM009"]
        - label: "Managed-asset snapshot"
          value: 15
          unit: "USD billions+"
          detail: "Independent profile cites more than $15B of managed assets as of April 2026."
          claimRefs: ["CM008"]
        - label: "Affiliate regulatory AUM"
          value: 2.905
          unit: "USD billions"
          detail: "Farther Asset Management affiliate Form ADV excerpt dated Aug. 13, 2026."
          claimRefs: ["CM008", "CM010"]
        - label: "Affiliate reported client accounts"
          value: 9645
          unit: "accounts"
          detail: "Account mix in the same filing excerpt is concentrated in individual and high-net-worth individual accounts."
          claimRefs: ["CM010"]
    approximationNotes: "Ordered as an evidence-backed operating stack rather than a mathematically additive TAM/SAM/SOM. The layers mix jurisdictions, assets, and account counts and should not be read as conversion rates."
    claimRefs: ["CM001", "CM003", "CM007", "CM008", "CM009", "CM010"]
