schemaVersion: report-v2
artifact: customers
slug: farther
runDate: 2026-10-17
company:
  name: Farther
chapter:
  number: 6
  title: Customers
  summary: >-
    Farther's customer motion is two-sided: it recruits advisors onto its platform and, through
    them, serves mass-affluent, high-net-worth, and newer ultra-high-net-worth relationships. The
    strongest adoption signal is headline recruited assets above $23 billion, but public evidence
    uses three different denominators—recruited assets, managed assets/client families, and
    regulatory AUM/accounts—while retention, concentration, and renewal quality remain largely
    undisclosed.
sections:
  - id: who-farther-serves
    title: Who pays and uses the product
    body: >-
      Farther does not look like a single-sided retail RIA. The company and independent profiles
      consistently describe a two-layer model in which advisors are recruited onto Farther's
      technology stack, then use that stack to serve end clients. On the client side, public
      evidence centers on high-earning, high-net-worth, and ultra-high-net-worth households, with
      newer claims that the platform also serves small businesses and institutions. That matters
      because buyer, user, and beneficiary are not always the same: the advisor appears to be the
      primary operating user, while households and family-office relationships are the economic end
      customers receiving planning, portfolio, tax, estate, and reporting services.
    claimRefs: [CU001, CU002, CU003, CU008, CU011]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof-and-scale
    title: Adoption proof and scale signals
    body: >-
      Farther has real adoption signals, but the signals are not interchangeable. Company-issued
      2026 materials repeatedly cite more than $23 billion of recruited assets, and both the
      Series D release and the Inc. 5000 post clarify that this includes assets already under
      management plus assets expected from advisors joining in coming months. Independent profiles
      add lower layers of the funnel: private.law reports more than $15 billion of managed assets,
      about 200 advisers, and about 19,000 client families as of April 2026, while the Form ADV
      derivative page for Farther Asset Management reports $2.91 billion of regulatory AUM and
      9,645 client accounts in August 2026. The chapter can therefore confirm real operating scale,
      but not treat every asset figure as the same stage of customer adoption.
    claimRefs: [CU004, CU005, CU006, CU007, CU009, CU010, CU015]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-risk
    title: Durability, expansion, and concentration risk
    body: >-
      The most credible expansion vector in the assigned pool is upstream advisor recruiting and
      downstream wallet expansion into Farther Family Office, not disclosed net retention metrics.
      Public materials argue that the platform's multi-custodian design reduces switching friction
      because clients do not always need to change custody when their advisor moves, and independent
      reporting says the family-office offer was built to win more complex UHNW relationships.
      Still, the evidence base is weak on durability: there is no public NRR, GRR, churn, renewal,
      or top-customer concentration disclosure in the assigned pool, and the only explicitly adverse
      commentary warns that the model depends on continual advisor recruiting and can trigger client
      portability disputes. That leaves Farther's customer quality easier to describe than to
      underwrite.
    claimRefs: [CU008, CU011, CU012, CU013, CU014]
callouts:
  - calloutType: insight
    title: Advisor-led distribution is the core customer engine
    body: >-
      Farther's strongest repeat pattern is not direct retail lead generation but recruiting
      advisors, then onboarding the client books attached to those advisors onto the platform.
    claimRefs: [CU003, CU011]
  - calloutType: risk
    title: Public adoption metrics use incompatible denominators
    body: >-
      Recruited assets, managed assets/client families, and regulatory AUM/accounts describe
      different stages of the funnel, so they cannot be used interchangeably as proof of realized
      customer adoption or retention.
    claimRefs: [CU004, CU005, CU006, CU007, CU015]
  - calloutType: risk
    title: Retention and concentration quality remain largely undisclosed
    body: >-
      The assigned pool does not disclose NRR, GRR, churn, renewal, top-client share, or
      advisor-book concentration, leaving durability and concentration risk as diligence gaps.
    claimRefs: [CU012, CU013, CU014]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Breakaway and independent advisors
        - Advisors are the operating users of the platform and the acquisition wedge into client books.
        - Practice operating system, portfolio management, planning, tax workflows, and client reporting.
        - Multiple sources describe advisor recruiting as the growth engine; Farther says advisors can keep clients on familiar custodians.
        - Primary distribution channel and source of recruited assets.
        - Public materials do not disclose advisor payout, retention, or average book size after transition.
      - - Mass-affluent and high-net-worth households
        - End clients receive the advice relationship; advisors and Farther share the service delivery.
        - Planning, investing, tax optimization, estate coordination, and consolidated reporting.
        - Independent and official profiles repeatedly describe HNW-focused service and household onboarding.
        - Core fee-paying advice base.
        - No public churn, renewal, or wallet-share data in the assigned pool.
      - - Ultra-high-net-worth families
        - Family-office clients are served through Farther Family Office.
        - Complex tax, estate, lending, alternatives, and consolidated household oversight.
        - Family Office launched in 2026; independent sources say it has no formal minimums.
        - Expansion into higher-value relationships and broader wallet capture.
        - No disclosed current Farther AUM, client count, or retention for the UHNW cohort.
      - - Small businesses
        - Company-issued material lists small businesses as part of the served base.
        - Wealth-management and related planning services through advisor relationships.
        - Mentioned in the Series D release as part of the broad client base.
        - Potential adjacency beyond households.
        - No public segmentation, account count, or revenue contribution.
      - - Institutions
        - Company-issued material lists institutions as part of the served base.
        - Institution-facing wealth and investment relationships via the platform.
        - Mentioned in the Series D release as part of the broad client base.
        - Diversifies the customer mix beyond households.
        - No public disclosure of institutional logos, assets, or renewal terms.
    notes: >-
      Segment evidence mixes company-issued descriptions with independent profiles; asset/account
      totals are not disclosed by segment, so strategic value is directional rather than quantified.
    claimRefs: [CU001, CU002, CU003, CU008]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Recruited assets
        - $7.8B
        - Q1 2025 baseline
        - VCAOnline / Farther Inc. 5000 post
        - Medium
        - Baseline used in company-controlled year-over-year growth framing.
        - Includes transitioned plus expected assets, not just fully onboarded client assets.
      - - Recruited assets
        - $23B+
        - Q1 2026
        - VCAOnline / NVC / Farther Inc. 5000 post
        - High
        - Confirms strong top-of-funnel advisor-book recruitment momentum.
        - Not directly comparable to regulatory AUM or live client accounts.
      - - Managed assets
        - $15B+
        - Apr 2026
        - private.law
        - Medium
        - Indicates a large live book already transitioned onto the platform.
        - Managed assets are narrower than recruited assets and broader than regulatory AUM.
      - - Client families
        - ~19,000
        - Apr 2026
        - private.law
        - Medium
        - Gives the clearest publicly cited live household count in the assigned pool.
        - Family count is not tied to revenue, retention, or average assets per family.
      - - Advisers
        - ~200
        - Apr 2026
        - private.law
        - Medium
        - Shows advisor-side adoption scale behind the client base.
        - No disclosed split between newly recruited and seasoned retained advisors.
      - - Regulatory AUM
        - $2.91B
        - Aug 13 2026 filing
        - FormDs / Form ADV Item 5.F
        - Medium
        - Provides a regulated lower-bound asset measure for Farther Asset Management.
        - Reflects one filing entity and filing-date scope, not the whole recruited-assets headline.
      - - Client accounts
        - 9,645
        - Aug 13 2026 filing
        - FormDs / Form ADV Item 5.D
        - Medium
        - Confirms thousands of live accounts under the filing entity.
        - Accounts are not the same as individual clients or families.
      - - Advisor productivity claim
        - Up to 3x organic growth vs industry average
        - Jan-Dec 2025 comparison disclosed Aug 2026
        - Farther Inc. 5000 post
        - Medium
        - Supports the advisor recruiting message.
        - Company-controlled benchmark; no underlying cohort distribution or retention data disclosed.
    notes: >-
      These rows describe different adoption stages and scopes; recruited assets, managed assets,
      regulatory AUM, client accounts, and client families should not be treated as interchangeable
      customer metrics.
    claimRefs: [CU004, CU005, CU006, CU007, CU010, CU015]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / user proof
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Lauren Moone, CFA, CFP, CPWA
        - Advisor-user
        - Publicly listed managing director on Farther's customer-facing wealth page.
        - Production
        - Demonstrates a live named advisor bench in San Francisco rather than anonymous logos alone.
        - Company-controlled proof; no disclosed book size, retention, or client outcomes.
      - - Daniel Gilham, CFP, PhD
        - Advisor-user
        - Publicly listed managing director of advisor strategy on the same customer-facing page.
        - Production
        - Reinforces that advisor enablement is part of the live operating model.
        - No disclosed client count, NPS, or renewal quality attached to the role.
      - - Allison Dunlap
        - Advisor-user
        - Publicly listed managing director, wealth advisor, in Washington, DC.
        - Production
        - Shows Farther's named advisor coverage beyond a single office.
        - Public listing is not independent proof of customer outcomes.
      - - Ben Seidenstein, CFA
        - UHNW family-office lead
        - Independent sources identify him as the head of Farther Family Office after leaving Goldman.
        - Production
        - Supports that Farther launched a real UHNW service line rather than a prelaunch concept.
        - Prior client-book size does not prove current Farther AUM retention or client revenue.
    notes: >-
      The strongest named proofs in the assigned pool are advisor-users and the family-office lead,
      not independent client case studies; this confirms live deployment but not customer outcome
      quality or retention.
    enumerationScope:
      coverage: partial
      basis: >-
        Partial named proof drawn from the assigned pool's publicly named advisor roster and 2026
        family-office leadership references; the pool contains no exhaustive customer list or
        independently verified client case-study registry.
    claimRefs: [CU008, CU009, CU014]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Farther's customer motion starts with advisor recruitment, then expands into household,
      family-office, and broader relationship depth.
    data:
      items:
        - label: Advisor recruitment
          touchpoints:
            - Breakaway and independent advisors join for technology, operating support, and growth.
        - label: Platform onboarding
          touchpoints:
            - Planning, portfolio, tax, estate, and reporting workflows move onto the integrated platform.
        - label: Client-book transition
          touchpoints:
            - Existing client relationships move to Farther while custody can remain with familiar providers.
        - label: HNW household servicing
          touchpoints:
            - Households receive coordinated investing, tax, estate, and consolidated reporting support.
        - label: UHNW expansion
          touchpoints:
            - Farther Family Office adds more complex tax, lending, private-markets, and estate needs.
        - label: Relationship deepening
          touchpoints:
            - More assets and more complex needs can move through the same advisor-client relationship.
    approximationNotes: >-
      This is a directional workflow synthesized from public descriptions of Farther's advisor-led
      acquisition model and client expansion surfaces; it is not a measured conversion funnel.
    claimRefs: [CU001, CU003, CU008, CU011]
