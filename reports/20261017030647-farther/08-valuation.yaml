    columns: ["Dimension", "Assessment", "Decision implication"]
    rows:
      - ["Recommendation", "Track", "Evidence supports quality and momentum, but not a clear buy at the current price."]
      - ["Confidence", "Medium", "Core funding facts are verifiable, but underwriting inputs remain incomplete."]
      - ["Risk rating", "High", "Execution, conversion, disclosure, and financing-risk questions are still open."]
      - ["Valuation stance", "Stretched", "Unicorn pricing is directionally supported, but precise price support is thin."]
      - ["Entry discipline", "Wait for better proof or better price", "Upgrade only after revenue/cap-table disclosure or a meaningfully improved entry."]
    notes: "Public sources verify the round and strategic momentum, but not audited revenue, margins, burn, or the full preference stack."
    claimRefs: [CV001, CV005, CV006, CV007, CV010, CV012]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: ["Lens", "Thesis", "Anti-thesis / what would change the view"]
    rows:
      - ["Distribution and scale", "Series D funding plus $23B recruited assets show strong advisor-recruiting momentum.", "Recruited assets are not the same as fully converted managed assets; evidence improves only if conversion and retention are disclosed."]
      - ["Platform and customer fit", "Multiple sources describe a differentiated, integrated wealth platform for advisors and high-net-worth clients.", "The edge matters less if platform usage does not translate into durable economics, advisor retention, and revenue productivity."]
      - ["Price support", "Independent profiles place the latest reported valuation around $1.25B, up sharply from the $542M Series C mark.", "The latest exact valuation, cap table, revenue base, and liquidation preferences are still not publicly disclosed, so the reported step-up may overstate actionable fair value support."]
    notes: "The supportive side relies on financing and growth signals; the anti-thesis focuses on missing economic disclosure and recruited-versus-managed asset conversion."
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV010, CV011]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: ["Scenario", "Assumptions", "Valuation / return logic", "Key risks", "Probability signal"]
    rows:
      - ["Bull", "Managed assets and advisor productivity catch up to recruited-asset growth, and management discloses revenue and margin data consistent with premium platform economics.", "Upside from the reported ~$1.25B level is only supportable if public or diligence-only data proves durable economics and high conversion.", "Disclosure still may lag; premium multiple could compress before proof arrives.", "Low without new disclosure."]
      - ["Base", "Farther keeps raising capital and recruiting advisors, but the market still has to infer economics from asset and recruiting milestones.", "Fair value clusters around the current unicorn narrative rather than obviously above it, implying hold/track rather than aggressive entry.", "The market may continue to reward momentum while underwriting support stays incomplete.", "Highest probability on current evidence."]
      - ["Bear", "Growth in recruited assets slows, conversion into managed assets disappoints, or financing terms reveal weaker economics than the headline round implies.", "A flat-to-down private mark becomes plausible because the public record does not yet justify paying materially above today's reported range.", "Down-round risk, multiple compression, or preference overhang could dominate the narrative.", "Material if diligence fails to close the current gaps."]
    notes: "Scenario ranges are underwriting views anchored to disclosed round markers (> $1B unicorn status and a reported ~$1.25B latest mark), not reported fair values."
    claimRefs: [CV001, CV003, CV006, CV007, CV008, CV009, CV010, CV011, CV012]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: "The recommendation stays at track because strong financing momentum is offset by weak public price support."
    data:
      nodes:
        - id: scale-proof
          label: "Scale proof"
          detail: "$150M Series D and advisor-recruiting momentum show continued market access."
        - id: operating-caveat
          label: "Operating caveat"
          detail: "The strongest public scale metric is recruited assets, not fully converted managed assets or disclosed revenue."
        - id: valuation-anchor
          label: "Valuation anchor"
          detail: "Public sources support unicorn status and a reported ~$1.25B mark, but not a fully verified exact current valuation."
        - id: disclosure-gap
          label: "Disclosure gap"
          detail: "Revenue, margin, burn, cap-table, and liquidation-preference data remain unavailable in public sources."
        - id: downside-risk
          label: "Downside risk"
          detail: "If conversion or retention underwhelms, multiple compression or a flat/down round becomes plausible."
        - id: recommendation
          label: "Track / stretched"
          detail: "Wait for better economics disclosure or a better price before moving to a positive underwriting call."
      edges:
        - from: scale-proof
          to: operating-caveat
          label: "tempered by"
        - from: operating-caveat
          to: valuation-anchor
          label: "limits"
        - from: valuation-anchor
          to: disclosure-gap
          label: "still lacks"
        - from: disclosure-gap
          to: downside-risk
          label: "creates"
        - from: downside-risk
          to: recommendation
          label: "drives"
    approximationNotes: "This is a logic chain, not a quantitative valuation model."
    claimRefs: [CV001, CV005, CV006, CV007, CV009, CV011, CV012]
callouts:
  - calloutType: recommendation
    title: "Public evidence supports strategic quality more than entry price"
    body: >-
      Farther looks financeable and differentiated, but the missing revenue, burn, cap-table, and
      recruited-to-managed conversion evidence make the current unicorn narrative too thin for an
      invest-now recommendation.
    claimRefs: [CV007, CV011, CV012]
