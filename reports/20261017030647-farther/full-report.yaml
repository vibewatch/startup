  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Farther's customer motion starts with advisor recruitment, then expands into household, family-office, and broader
      relationship depth.
    data:
      items:
        - label: Advisor recruitment
          touchpoints:
            - Breakaway and independent advisors join for technology, operating support, and growth.
        - label: Platform onboarding
          touchpoints:
            - Planning, portfolio, tax, estate, and reporting workflows move onto the integrated platform.
        - label: Client-book transition
          touchpoints:
            - Existing client relationships move to Farther while custody can remain with familiar providers.
        - label: HNW household servicing
          touchpoints:
            - Households receive coordinated investing, tax, estate, and consolidated reporting support.
        - label: UHNW expansion
          touchpoints:
            - Farther Family Office adds more complex tax, lending, private-markets, and estate needs.
        - label: Relationship deepening
          touchpoints:
            - More assets and more complex needs can move through the same advisor-client relationship.
