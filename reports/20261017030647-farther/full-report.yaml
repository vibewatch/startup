              - CI004
              - CI005
          - type: callout
            title: Fresh capital buys operating time
            body: >-
              A $150 million Series D and more than $272 million raised since founding meaningfully expand Farther's
              capacity to keep investing in adviser recruiting and platform development.
            calloutType: strength
            claimRefs:
              - CI001
              - CI002
              - CI009
          - type: callout
            title: Recruiting dependence is the key financial fragility
            body: >-
              Public adverse commentary consistently points to the same risk: if advisor recruiting and transition slow,
              Farther's services-heavy model can see AUM momentum fade before its cost base adjusts.
            calloutType: risk
            claimRefs:
              - CI011
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and customer workflow
        blocks:
          - type: paragraph
            body: >
              Farther's public product is not a narrow robo-advisory tool or one-off advisor utility. Across official
              pages and third-party profiles, the company presents an integrated wealth stack that supports advisors
              while packaging planning, portfolio management, tax work, estate support, private markets, and Family
              Office coordination into one client relationship. The Family Office launch also matters strategically: it
              shows Farther trying to reuse the same platform and advisor workflow for more complex UHNW needs rather
              than building a separate service line with entirely separate infrastructure. For diligence, the key
              takeaway is that Farther sells workflow consolidation and operating leverage as much as investment advice
              itself, so product evaluation should focus on whether the integrated experience is real, scalable, and
              defensible rather than on any single feature module.
            claimRefs:
