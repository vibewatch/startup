    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Farther presents itself as an integrated wealth-management company rather than a stand-alone software
              vendor: advisors remain the client-facing layer while its Intelligent Wealth Platform handles data,
              execution, portfolio administration, tax-aware capabilities, and access to private markets. Company
              materials describe a broad client scope spanning high-earning individuals, ultra-high-net-worth families,
              small businesses, and institutions. The legal and operating identity is less tidy in public profiles.
              Sources consistently describe a registered investment-advisory business founded in 2019, but they
              alternate between New York-based and San Francisco headquarters labels. A primary current filing or
              company disclosure is therefore still needed before a single headquarters is treated as ground truth.
