  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitute set
        blocks:
          - type: paragraph
            body: >-
              The public record supports a narrower market definition than a generic "wealthtech" label. Farther is
              competing in modern fee-based wealth advice and the advisor operating layer that sits behind it: planning,
              portfolio management, tax and estate workflows, private-market access, and client reporting delivered
              through one platform. That means the included spend is recurring advisory and workflow spend attached to
              client relationships, while excluded spend includes self-directed brokerage, pure banking products, and
              standalone point tools that do not carry the full advice relationship. The substitute set is therefore not
              only other tech-forward RIAs, but also wirehouses, private banks, and the fragmented mix of legacy advisor
              tools Farther says it is replacing. This boundary matters because Farther's growth motion starts with
              advisors switching operating models, not with anonymous retail app downloads.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM006
              - CM007
      - number: '2.2'
        title: Sizing lenses are real, but they are not a clean TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              Farther discloses enough operating metrics to frame the shape of the opportunity, but not enough to
              isolate an external TAM, SAM, and SOM. Company-linked sources cite more than $23 billion in recruited
              assets and more than $15 billion in managed assets, while an affiliate Form ADV excerpt reports $2.905
              billion of regulatory AUM and 9,645 client accounts. Those are all valid numbers, but they are not
              interchangeable: recruited assets include expected books from joining advisors, managed assets describe a
              broader operating snapshot, and regulatory AUM is a filing-defined subset with its own timing and entity
              boundary. As a result, public sizing today is best treated as a set of constrained serviceable-market
              lenses rather than a single market-size proof point. That keeps the chapter evidence-backed while
              preserving the diligence gap that still matters for valuation.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM010
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
              - CM007
              - CM008
              - CM009
              - CM010
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Farther's adoption path runs through two linked customer groups. The first buyer is the advisor or
              advisory team considering a move away from a wirehouse or legacy RIA environment; the user is that advisor
              and supporting staff, and the economic decision is tied to payout, workflow efficiency, recruiting
              support, and ownership of the client book. The second buyer/payer is the end client household or entity
              that pays ongoing advisory fees once assets are on platform. Public descriptions consistently point to
              high-net-worth households as the center of gravity, with extensions into ultra-high-net-worth
              family-office use cases, plus smaller but explicit references to institutions and small businesses. That
              structure is important because Farther does not need to win broad consumer mindshare all at once; it needs
              to keep recruiting advisors whose books and end-clients migrate with them.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM010
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM011
              - CM012
      - number: '2.4'
        title: Demand drivers, constraints, and remaining diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest demand driver in the assigned evidence is workflow replacement. Company and independent
              descriptions repeatedly frame Farther as an answer to legacy advisor software sprawl, promising more time
              with clients, better data, and integrated planning, tax, and investment workflows. That helps explain why
              advisor recruitment is the front door to market expansion. The same evidence also points to the main
              constraints: retention has to stay attractive enough that recruited advisors do not leave, the gap between
              recruited and transitioned assets has to close, and compliance and service quality have to keep pace with
              rapid scale. Those risks do not invalidate the growth story, but they do mean the public record supports a
              serviceable-market thesis better than a fully underwritten TAM/SAM/SOM model.
            claimRefs:
              - CM009
              - CM011
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set is fragmented, but the closest buyer alternatives are identifiable
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence points to a fragmented landscape rather than a single one-to-one rival. Independent
              writeups place Farther against tech-forward recruiter/platform RIAs such as Savvy and Compound, against
              much larger consolidators such as Corient and Creative Planning, and against infrastructure vendors such
              as Addepar and Orion that overlap on advisor workflow but do not replace the full advisory relationship.
              That matters because a buyer evaluating Farther is really choosing among different operating models: a
              software-led recruiting platform, an acquisition-led incumbent, or a point-solution stack assembled around
              an existing practice. Public scale markers also separate these cohorts. Savvy and Compound are the closest
              product-model neighbors in the pool, but both remain much smaller on disclosed AUM than Farther's public
              platform claims, while Corient and Creative Planning represent the opposite threat: far larger
              distribution and balance-sheet scale even if their software story is less central in the retained
              evidence.
