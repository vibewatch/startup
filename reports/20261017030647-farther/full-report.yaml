      - number: '3.2'
        title: Farther's wedge is integrated workflow depth, not just advisor branding
        blocks:
          - type: paragraph
            body: >-
              Farther's strongest competitive position in the retained evidence is not low price; it is an integrated
              operating model. Official and independent sources consistently describe Farther as recruiting advisors
              onto a proprietary RIA platform that bundles planning, portfolio management, tax work, estate planning,
              private markets, and family-office services. Management's newest launch sharpens that position: the
              in-house proposal tool replaces an older workflow stitched across Excel, PowerPoint, and third-party
              systems, while preserving onboarding data inside Farther's own stack. Multi-custodian support through
              Fidelity, Schwab, Pershing, and Apex also matters competitively because it reduces a common advisor
              objection: forcing clients through a disruptive custodian change. In other words, Farther is selling a
              higher-productivity operating environment to advisors, not merely a new client-facing brand.
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP009
              - CP016
