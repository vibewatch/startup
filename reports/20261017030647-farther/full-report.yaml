          - type: paragraph
            body: >-
              Farther has real adoption signals, but the signals are not interchangeable. Company-issued 2026 materials
              repeatedly cite more than $23 billion of recruited assets, and both the Series D release and the Inc. 5000
              post clarify that this includes assets already under management plus assets expected from advisors joining
              in coming months. Independent profiles add lower layers of the funnel: private.law reports more than $15
              billion of managed assets, about 200 advisers, and about 19,000 client families as of April 2026, while
              the Form ADV derivative page for Farther Asset Management reports $2.91 billion of regulatory AUM and
              9,645 client accounts in August 2026. The chapter can therefore confirm real operating scale, but not
              treat every asset figure as the same stage of customer adoption.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU009
              - CU010
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU010
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
              - CU009
              - CU014
      - number: '6.3'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The most credible expansion vector in the assigned pool is upstream advisor recruiting and downstream
              wallet expansion into Farther Family Office, not disclosed net retention metrics. Public materials argue
              that the platform's multi-custodian design reduces switching friction because clients do not always need
              to change custody when their advisor moves, and independent reporting says the family-office offer was
              built to win more complex UHNW relationships. Still, the evidence base is weak on durability: there is no
              public NRR, GRR, churn, renewal, or top-customer concentration disclosure in the assigned pool, and the
              only explicitly adverse commentary warns that the model depends on continual advisor recruiting and can
              trigger client portability disputes. That leaves Farther's customer quality easier to describe than to
              underwrite.
            claimRefs:
              - CU008
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Advisor-led distribution is the core customer engine
            body: >-
              Farther's strongest repeat pattern is not direct retail lead generation but recruiting advisors, then
              onboarding the client books attached to those advisors onto the platform.
            calloutType: insight
            claimRefs:
              - CU003
              - CU011
          - type: callout
            title: Public adoption metrics use incompatible denominators
            body: >-
              Recruited assets, managed assets/client families, and regulatory AUM/accounts describe different stages of
              the funnel, so they cannot be used interchangeably as proof of realized customer adoption or retention.
            calloutType: risk
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU015
          - type: callout
            title: Retention and concentration quality remain largely undisclosed
            body: >-
              The assigned pool does not disclose NRR, GRR, churn, renewal, top-client share, or advisor-book
              concentration, leaving durability and concentration risk as diligence gaps.
            calloutType: risk
            claimRefs:
              - CU012
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Risk hierarchy: rapid scale meets limited primary disclosure'
        blocks:
          - type: paragraph
            body: >-
              The central risk is not a documented enforcement action or outage; the assigned evidence contains no
              current primary regulator, court, security-attestation, or incident record from which to establish either
              one. Instead, the evidence shows a regulated RIA scaling a broad advisory and investment platform while
              relying largely on company-issued growth disclosures and secondary profiles. Farther reports $23 billion
              of recruited assets, but that measure includes both assets under management and assets expected from
              advisers still joining. A secondary profile separately reports more than $15 billion of managed AUM as of
              April 2026, making onboarding conversion, reporting discipline, and service capacity the highest-priority
              diligence areas. Regulatory severity is potentially high because client assets, fiduciary obligations, and
              private-market access are involved, while likelihood remains unquantified without the current Form ADV,
              examination history, complaints, litigation search, and control reports.
            claimRefs:
              - CR002
              - CR004
              - CR009
              - CR012
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR012
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR008
              - CR010
              - CR016
      - number: '7.2'
        title: Operational, technology, and service-quality exposure
        blocks:
          - type: paragraph
            body: >-
              Scale creates a compound execution problem: adviser books must transition onto the platform, custody
              records must remain accurate across multiple independent custodians, and compliance and client service
              must keep pace with recruited assets. Independent secondary analysis identifies quality-at-scale, adviser
              retention, and conversion of recruited assets into managed AUM as the model's principal pitfalls.
              Independent custody reduces balance-sheet commingling risk but does not remove cyber, fraud,
              operational-continuity, or custody-chain risk. The platform's advertised risk-management and AI tooling
              are mitigants only at the product-description level; the assigned sources provide no uptime history,
              penetration-test results, SOC report, disaster-recovery metrics, material-incident register, or
              service-level evidence. The practical monitor is therefore transition quality: conversion timing,
              exception rates, client complaints, adviser attrition, and control failures should be tracked together.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR012
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR012
              - CR016
      - number: '7.3'
        title: Partner dependencies and financial-model opacity
        blocks:
          - type: paragraph
            body: >-
              Farther's operating model distributes rather than eliminates dependencies. Independent custodians hold
              client assets, advisers carry client relationships onto the platform, and outside capital funds continued
              expansion. That structure can limit direct custody exposure, but it leaves transition quality dependent on
              custody integrations and growth dependent on advisers choosing to move and retain their books. The $150
              million Series D is evidence of financing access, not evidence of available cash, runway, positive
              operating cash flow, or profitability. Independent profiles report that profitability is not publicly
              disclosed and that available revenue figures are third-party estimates. The investment implication is to
              treat capital adequacy, unit economics, and dilution as unresolved rather than infer them from round size
              or valuation.
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR010
              - CR011
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR010
              - CR013
              - CR015
      - number: '7.4'
        title: Mitigations, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Mitigation maturity cannot be verified from the assigned public evidence, so the underwriting standard
              should be evidence-based. Before investment, management should provide the current Form ADV and
              amendments, examination and complaint history, litigation and insurance schedules, SOC or equivalent
              controls, penetration-test remediation, business-continuity test results, custodian incident and
              reconciliation metrics, and adviser-transition cohorts. Monthly monitoring should separate regulatory AUM,
              managed AUM, and recruited assets; disclose conversion time and fallout; track adviser and client
              retention; and reconcile cash, burn, and runway to hiring and onboarding plans. Thesis-break triggers are
              a material regulatory action, an unresolved client-asset or data-security incident, persistently widening
              recruited-to-managed asset gaps, deterioration in adviser retention, or refusal to provide auditable
              financial and control evidence. Passing diligence requires verified controls and trend data, not merely
              the absence of adverse reporting in this limited source set.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR006
              - CR007
              - CR008
              - CR010
              - CR013
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not equate recruited assets with managed AUM
            body: >-
              Farther defines recruited assets to include assets already managed and additional assets expected from
              advisers joining in coming months. Underwriting should track conversion and fallout by cohort rather than
              treating the full $23 billion as current fee-bearing AUM.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR004
          - type: callout
            title: Evidence required before risk can be re-rated
            body: >-
              Maintain a high diligence burden until primary regulatory records, control assurance, incident history,
              adviser and client retention cohorts, recruited-to-managed conversion, audited financials, cash, burn, and
              runway are available and internally consistent.
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR010
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: |-
              The recommendation is **track**, not because Farther lacks momentum, but because the public
              evidence supports strategic quality more clearly than it supports today's price. Independent
              trade coverage and the syndicated round announcement agree that Farther raised a $150 million
              Series D in May 2026 led by General Atlantic, and the company continues to frame itself as a
              modern, AI-native wealth platform for advisors and high-net-worth clients. That is real
              financing validation. The problem is that the strongest operating proof in public materials is
              still recruited assets rather than fully converted managed assets or disclosed revenue. Farther
              itself says recruited assets surpassed $23 billion, but the same company disclosures define
              that figure as committed books that include assets expected from advisors still joining. An
              independent legal-market profile goes further and warns that public materials distinguish
              regulatory AUM, managed assets, and recruited assets, which means the headline scale number is
              directionally positive but not enough on its own to underwrite a premium multiple. With no
              public revenue, margin, burn, or liquidation-preference disclosure, the available evidence is
              strong enough to keep the company on the watchlist, but not strong enough to justify treating
              the current unicorn price as obviously attractive.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV010
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV009
              - CV011
              - CV012
      - number: '8.2'
        title: Financing context and scenario bounds
        blocks:
          - type: paragraph
            body: |-
              The financing context is supportive, but valuation support is still thin. Farther's own
              Series D announcement says the company is now a unicorn, while independent registry-style
              profiles place the latest reported valuation around $1.25 billion and the prior Series C at
              $542 million post-money. That is enough to frame scenario ranges, but not enough to treat the
              exact mark as fully verified because at least one independent tracker still says the latest
              known valuation is not publicly disclosed. The comparable set is also imperfect. Available
              public analogs in the assigned evidence pool compare Farther with smaller platform-led peers
              such as Savvy Wealth and Compound Planning, while much larger incumbents such as Corient and
              Creative Planning scale through M&A and sit in a different business-model bucket. As a result,
              the valuation range below is an underwriting framework anchored to disclosed funding marks and
              publicly described operating milestones, not a claim that the market has already validated a
              precise fair value. The base case assumes capital remains available but price support remains
              incomplete; the bull case requires better conversion and disclosure; the bear case centers on
              multiple compression if those proof points do not emerge.
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: Diligence triggers and thesis-breakers
        blocks:
          - type: paragraph
            body: |-
              The final underwriting question is what would move the call from track to investable. The
              first requirement is audited or management-certified revenue, margin, and burn disclosure so a
              buyer can test whether Farther deserves a software-like or advice-firm-like multiple. The
              second is capital-structure clarity: exact post-Series D valuation, diluted share count,
              option pool, participating investors, and liquidation preferences. The third is proof that the
              recruited-assets story converts into realized managed assets, advisor productivity, and
              retention rather than remaining a large but partially unconverted pipeline. Until those points
              are answered, the thesis-break signals are straightforward: slowing advisor recruiting, a
              widening gap between recruited and managed assets, evidence that conversion or retention is
              weaker than expected, or any financing that prices at or below the current unicorn narrative.
              Any one of those would make the current entry look stretched rather than merely underproven.
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public evidence supports strategic quality more than entry price
            body: >-
              Farther looks financeable and differentiated, but the missing revenue, burn, cap-table, and
              recruited-to-managed conversion evidence make the current unicorn narrative too thin for an invest-now
              recommendation.
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV011
              - CV012
