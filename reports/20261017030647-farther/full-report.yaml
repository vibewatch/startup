      - number: '3.3'
        title: Durability depends on sustaining advisor inflows against larger incumbents
        blocks:
          - type: paragraph
            body: >-
              The moat is meaningful, but the retained evidence does not show it is unassailable. Simplify's critic
              summary argues that Farther's services-heavy model still needs relentless recruiting and remains exposed
              to advisor-portability fights when non-solicit restrictions are rejected. AI Pressroom adds a
              market-structure warning: the RIA sector logged 345 transactions through Q3 2025, so Farther must compete
              in a consolidating market against other tech-first platforms and larger firms integrating AI. Pricing
              transparency also remains uneven. Farther's own fee bands and wrap disclosures are partly public, but peer
              client pricing is largely absent in the assigned pool, which makes it hard to prove a durable price
              advantage. Finally, Form ADV data for Farther Asset Management underscores that regulated-entity metrics
              and headline recruited-asset metrics are not the same thing, so diligence should separate platform
              momentum from assets that are already fully onboarded and fee-bearing.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP014
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Farther compresses multiple substitute tools into one advisor workflow
            body: >-
              The retained evidence is most convincing where Farther replaces manual or fragmented advisor workflows,
              not where it claims a simple fee advantage. That is the clearest reason it can win advisors away from
              bolt-on institutions and point-solution stacks.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP016
          - type: callout
            title: Scale incumbents can counter with distribution and advisor economics
            body: >-
              Farther does not need a single perfect rival to face pressure. Large consolidators and wirehouses can
              counter with much bigger distribution, acquisition capacity, or recruiting packages, while the platform's
              own momentum still depends on sustained advisor inflows.
            calloutType: risk
            claimRefs:
