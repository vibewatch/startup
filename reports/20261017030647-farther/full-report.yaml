        title: Public traction metrics use different denominators
        blocks:
          - type: paragraph
            body: >-
              Farther's headline scale claims are directionally strong but mix three different bases: recruited assets,
              managed assets, and regulatory AUM. The company says recruited assets surpassed $23 billion in Q1 2026,
              explicitly including books that advisers are expected to bring over in coming months, while RIABiz
