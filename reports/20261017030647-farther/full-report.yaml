      - number: '5.3'
        title: Maturity, controls, and diligence risks
        blocks:
          - type: paragraph
            body: >
              The evidence supports a commercially live product story, but not a fully transparent maturity story. The
              2026 financing narrative repeatedly ties new capital to further platform development and advisor
              expansion, which implies the platform is still being extended while scaling rather than sitting in a
              stable, fully disclosed operating state. That is normal for a growth-stage wealthtech, but it raises
              diligence questions because the retained public sources do not provide uptime statistics,
              implementation-time benchmarks, module-level adoption data, named trust certifications, or a public
              incident/status surface. Farther therefore looks differentiated on product ambition and data-engineering
              intent, yet investors still need private diligence on service reliability, control testing, AI-governance
              standards, and the conversion of recruited-advisor books into durable managed-platform usage before
              treating the technology edge as fully underwritten.
            claimRefs:
              - CE010
              - CE011
              - CE012
