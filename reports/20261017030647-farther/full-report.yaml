  - id: FR001
    title: Qualitative residual-risk heatmap
    type: matrix
    summary: >-
      The highest residual exposures combine potentially severe client or regulatory impact with either elevated
      operating signals or probability that cannot yet be established.
    data:
      columns:
        - label: Likelihood unestablished
        - label: Moderate likelihood
        - label: Elevated likelihood
      rows:
        - label: Severe impact
          values:
            - Regulatory evidence gap; custody-chain and cyber continuity
            - null
            - null
        - label: High impact
          values:
            - Capital adequacy and financial transparency
            - Adviser retention and client-book portability
            - Recruited-to-managed conversion; compliance and service capacity
        - label: Moderate impact
          values:
            - Private-market and fee-conflict disclosure
            - Multi-custodian coordination complexity
            - Family-office execution breadth
        - label: Conversion quality
          values:
            - Fee realization remains unverified
            - Adviser-cohort fallout
            - Expected assets lag managed AUM
        - label: Control maturity
          values:
            - Primary assurance unavailable
            - Custodian coordination
            - Compliance capacity at scale
        - label: Investment consequence
          values:
            - Maintain high diligence burden
            - Require cohort monitoring
            - Apply thesis-break triggers
    approximationNotes: >-
      Qualitative analyst synthesis only. No probability is statistically estimated; "likelihood unestablished" means
      the assigned evidence cannot support a likelihood assessment.
    claimRefs:
      - CR004
      - CR005
      - CR007
      - CR008
      - CR010
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: The recommendation stays at track because strong financing momentum is offset by weak public price support.
    data:
      nodes:
        - id: scale-proof
          label: Scale proof
          detail: $150M Series D and advisor-recruiting momentum show continued market access.
        - id: operating-caveat
          label: Operating caveat
          detail: >-
            The strongest public scale metric is recruited assets, not fully converted managed assets or disclosed
            revenue.
        - id: valuation-anchor
          label: Valuation anchor
          detail: >-
            Public sources support unicorn status and a reported ~$1.25B mark, but not a fully verified exact current
            valuation.
        - id: disclosure-gap
          label: Disclosure gap
          detail: Revenue, margin, burn, cap-table, and liquidation-preference data remain unavailable in public sources.
        - id: downside-risk
          label: Downside risk
          detail: If conversion or retention underwhelms, multiple compression or a flat/down round becomes plausible.
        - id: recommendation
          label: Track / stretched
          detail: Wait for better economics disclosure or a better price before moving to a positive underwriting call.
      edges:
        - from: scale-proof
          to: operating-caveat
          label: tempered by
        - from: operating-caveat
          to: valuation-anchor
          label: limits
        - from: valuation-anchor
          to: disclosure-gap
          label: still lacks
        - from: disclosure-gap
          to: downside-risk
          label: creates
        - from: downside-risk
          to: recommendation
          label: drives
    approximationNotes: This is a logic chain, not a quantitative valuation model.
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV009
      - CV011
      - CV012
