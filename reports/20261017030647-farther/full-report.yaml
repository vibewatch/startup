  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports Farther as an RIA whose monetization is tied primarily to adviser-led asset
              gathering rather than a separate disclosed software-license stream. Company materials frame the platform
              as the operating layer that helps recruited advisers win and serve clients, while third-party summaries
              describe the fee stack as negotiable AUM-based pricing, wrap-program fees, and additional charges for
              private-market or third-party products. That is enough to establish the revenue mechanism, but not the
              realized net take rate: list and ceiling pricing are public, while discounts, waivers, household mix, and
              the share of assets that pay a full advisory fee remain undisclosed. The result is a monetization model
              that is legible at the product level but still under-documented for underwriting.
