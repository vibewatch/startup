      - number: '5.2'
        title: Architecture, data layer, and operating dependencies
        blocks:
          - type: paragraph
            body: >
              Public technical detail remains indirect, but the available signals are more concrete than generic fintech
              marketing. Farther's AI-native data-platform role calls out ingestion across multiple custodians,
              canonical financial models, reconciliation across vendor datasets, and AI-ready schemas built for
              embeddings, vector search, and retrieval workflows. Combined with independent descriptions of a
              multi-custodian operating model and with Simplify's evidence that Farther maintains an inventory of agents
              plus human review of AI outputs, the likely architecture is a regulated advisory workflow sitting on top
              of normalized custodial data and controlled AI assistance rather than end-to-end autonomous wealth
              management. The biggest technical dependency is therefore not a public API ecosystem; it is Farther's
              ability to keep reconciled data, permissions, and review loops accurate as more advisors and client books
              move onto the platform.
            claimRefs:
