      - number: '4.3'
        title: Capital supports growth, not yet underwriting clarity
        blocks:
          - type: paragraph
            body: >-
              The strongest disclosed capital fact is the May 2026 $150 million Series D led by General Atlantic, which
              took cumulative funding above $272 million and was described as fuel for continued platform expansion and
              innovation. That supports the view that Farther is still in investment mode: adviser recruiting, platform
              development, family-office expansion, and service delivery are all scaling simultaneously, while the
              company still relies on self-reported growth metrics rather than published financial statements.
              Independent commentary also flags a structural downside to the model: if advisor inflows slow, the
              services-heavy organization can lose AUM momentum before fixed operating costs rebase. Without disclosed
              cash balance, burn, or debt obligations, the capital raise is evidence of resources available but not of
              runway sufficiency.
            claimRefs:
              - CI001
              - CI002
              - CI009
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Financially, Farther looks like a high-growth wealth platform with real recruiting traction and multiple
              monetization layers, but revenue quality and margin durability remain hard to underwrite from public
              evidence alone. Public sources show fee ceilings, regulatory accounts, fundraising, and broad
              asset-gathering momentum; they do not show audited revenue, gross margin, CAC, payback, operating
              leverage, or burn. The most decision-relevant questions are therefore not whether the platform is growing,
              but how quickly recruited assets convert into fee-paying managed assets, what realized revenue yield and
              service cost look like by client segment, and how long the latest financing can fund current hiring,
              product, and advisor-acquisition intensity. Until management provides those bridges, the financial case
              remains promising but incomplete.
            claimRefs:
              - CI014
              - CI015
