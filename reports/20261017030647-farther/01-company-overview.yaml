slug: farther
runDate: "2026-10-17"
company:
  name: Farther
chapter:
  number: 1
  title: Company Overview
  summary: Farther is a 2019-founded wealth-management company that pairs advisors with a proprietary technology platform and raised a $150 million Series D led by General Atlantic in May 2026. The assigned evidence supports rapid financing and recruited-asset growth, but exact valuation, headquarters, headcount, revenue, customer count, and governance remain unresolved or conflicting.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Farther presents itself as an integrated wealth-management company rather
      than a stand-alone software vendor: advisors remain the client-facing
      layer while its Intelligent Wealth Platform handles data, execution,
      portfolio administration, tax-aware capabilities, and access to private
      markets. Company materials describe a broad client scope spanning
      high-earning individuals, ultra-high-net-worth families, small businesses,
      and institutions. The legal and operating identity is less tidy in public
      profiles. Sources consistently describe a registered investment-advisory
      business founded in 2019, but they alternate between New York-based and
      San Francisco headquarters labels. A primary current filing or company
      disclosure is therefore still needed before a single headquarters is
      treated as ground truth.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO013
    tableRefs:
      - TO001
  - id: leadership-and-execution
    title: Leadership and execution model
    body: >-
      The assigned pool consistently identifies Taylor Matthews as co-founder
      and CEO and Brad Genser as co-founder and CTO. Third-party profiles connect
      Matthews to wealth-industry operating experience and Genser to private
      wealth technology and AI work at Goldman Sachs, making the founder pairing
      relevant to both distribution and product execution. The operating model
      remains people-intensive despite its technology positioning. A current
      Farther job repost describes systems supporting hundreds of advisors,
      cross-functional compliance workflows, and human review of AI output.
      That evidence supports scale, but it also makes advisor recruiting,
      retention, and founder-led execution central dependencies. No complete
      executive roster, board list, or committee structure appears in the
      assigned public evidence.
    claimRefs:
      - CO004
      - CO012
      - CO014
    tableRefs:
      - TO002
  - id: financing-and-stakeholders
    title: Financing, valuation, and stakeholders
    body: >-
      The strongest current financing fact is the 21 May 2026 Series D: Farther
      and multiple third-party pages report a $150 million round led by General
      Atlantic with participation from existing investors. The longer funding
      ladder is also directionally consistent across two databases, progressing
      through Series A, B, C, and D rounds. Precision falls away beyond the round
      size. Company-issued material says lifetime funding exceeded $272 million,
      while third-party totals range from $268 million to $273 million.
      Valuation databases similarly report either $1.0 billion or $1.25 billion
      for the Series D. Unicorn status is therefore supportable, but an exact
      post-money valuation, ownership percentage, liquidation stack, and board
      control map are not.
    claimRefs:
      - CO005
      - CO006
      - CO008
      - CO009
      - CO010
    tableRefs:
      - TO003
  - id: scale-milestones-and-gaps
    title: Scale, milestones, and unresolved metrics
    body: >-
      Farther said recruited assets exceeded $23 billion around the Series D,
      but its own footnote defines that figure as both assets under management
      and assets expected from advisors joining in coming months. It is not a
      clean substitute for current regulatory AUM, revenue, or cash available.
      Public headcount figures also range from 574 to more than 600, with the
      Simplify page citing 646 employees by July 2026. These discrepancies do
      not erase strong momentum; they limit precision. The evidence also records
      expansion through the SignalPoint acquisition and Family Office launch,
      while leaving audited revenue, profitability, customer count, burn,
      runway, and recruited-to-managed asset conversion unavailable. Those
      items should remain explicit diligence gaps rather than estimated cover
      metrics.
    claimRefs:
      - CO007
      - CO011
      - CO015
      - CO016
    figureRefs:
      - FO001
