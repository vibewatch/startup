callouts:
  - calloutType: strength
    title: Financing momentum is the clearest current signal
    body: The Series D amount, lead investor, and date are supported by both company-issued material and independent reporting, while the broader round history is directionally consistent across two databases.
    claimRefs:
      - CO005
      - CO008
  - calloutType: risk
    title: Scale metrics are not interchangeable
    body: Recruited assets include expected incoming-advisor assets, headcount figures conflict, and no audited revenue is public in the assigned evidence, so funding raised and recruiting momentum should not be read as cash availability or profitability.
    claimRefs:
      - CO007
      - CO011
      - CO015
