  topStrengths:
    - Advisor recruiting has produced real scale, with recruited assets above $23 billion.
    - The May 2026 Series D extends runway and validates investor appetite for the platform.
    - >-
      The product thesis is differentiated: advisors get a proprietary operating stack, not just a generic custodial
      layer.
  topRisks:
    - Audited revenue, gross margin, burn, and runway remain undisclosed.
    - Recruited assets are not the same as fee-bearing managed assets, so conversion risk stays material.
    - >-
      Regulatory and service-quality exposure cannot be fully underwritten without current ADV, complaints, and control
      evidence.
  unresolvedGaps:
    - >-
      Audited revenue, gross margin, and income statement: absolute revenue base, gross margin, operating cost
      structure, and EBITDA are not publicly disclosed and are required to support any forward-multiple valuation
      approach
    - >-
      Form ADV Item 11 disciplinary alerts: specific nature, timing, identity of affected entity or individual, and
      current operational impact of all three alerts must be obtained from management and assessed before regulatory
      risk can be characterized
    - >-
      Exact post-Series D valuation and capitalization table: the greater-than-$1B unicorn threshold is confirmed but
      precise valuation, diluted share count, investor ownership percentages, and liquidation preference stack are not
      publicly available
    - >-
      Burn rate, monthly cash position, and runway: Series D proceeds of $150M provide capital but the spending run rate
      is undisclosed, preventing confirmation of adequate runway at the current advisor growth pace
    - >-
      Recruited-assets-to-managed-AUM conversion rate and timeline: the approximately $8B gap between $23B recruited
      assets and $15B managed AUM reflects an onboarding pipeline whose conversion timing and discount rate have not
      been disclosed
