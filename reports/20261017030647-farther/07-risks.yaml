figures:
  - id: "FR001"
    title: "Qualitative residual-risk heatmap"
    type: "matrix"
    summary: >-
      The highest residual exposures combine potentially severe client or regulatory impact with
      either elevated operating signals or probability that cannot yet be established.
    data:
      columns:
        - label: "Likelihood unestablished"
        - label: "Moderate likelihood"
        - label: "Elevated likelihood"
      rows:
        - label: "Severe impact"
          values:
            - "Regulatory evidence gap; custody-chain and cyber continuity"
            - null
            - null
        - label: "High impact"
          values:
            - "Capital adequacy and financial transparency"
            - "Adviser retention and client-book portability"
            - "Recruited-to-managed conversion; compliance and service capacity"
        - label: "Moderate impact"
          values:
            - "Private-market and fee-conflict disclosure"
            - "Multi-custodian coordination complexity"
            - "Family-office execution breadth"
        - label: "Conversion quality"
          values:
            - "Fee realization remains unverified"
            - "Adviser-cohort fallout"
            - "Expected assets lag managed AUM"
        - label: "Control maturity"
          values:
            - "Primary assurance unavailable"
            - "Custodian coordination"
            - "Compliance capacity at scale"
        - label: "Investment consequence"
          values:
            - "Maintain high diligence burden"
            - "Require cohort monitoring"
            - "Apply thesis-break triggers"
    approximationNotes: >-
      Qualitative analyst synthesis only. No probability is statistically estimated; "likelihood
      unestablished" means the assigned evidence cannot support a likelihood assessment.
    claimRefs: [CR004, CR005, CR007, CR008, CR010, CR016]
callouts:
  - calloutType: "risk"
    title: "Do not equate recruited assets with managed AUM"
    body: >-
      Farther defines recruited assets to include assets already managed and additional assets
      expected from advisers joining in coming months. Underwriting should track conversion and
      fallout by cohort rather than treating the full $23 billion as current fee-bearing AUM.
    claimRefs: [CR002, CR003, CR004]
  - calloutType: "recommendation"
    title: "Evidence required before risk can be re-rated"
    body: >-
      Maintain a high diligence burden until primary regulatory records, control assurance,
      incident history, adviser and client retention cohorts, recruited-to-managed conversion,
      audited financials, cash, burn, and runway are available and internally consistent.
    claimRefs: [CR006, CR007, CR008, CR010, CR016]
