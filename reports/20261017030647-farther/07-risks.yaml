schemaVersion: "report-v2"
artifact: "risks"
slug: "farther"
runDate: "2026-10-17"
company:
  name: "Farther"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    Farther's most consequential risks arise from scaling a regulated advisory platform faster
    than public evidence can verify its compliance capacity, operating resilience, adviser
    retention, and conversion of recruited assets into managed AUM. The $150 million Series D
    expands strategic capacity but does not establish cash availability, runway, profitability,
    or control maturity.
sections:
  - id: "risk-hierarchy"
    title: "Risk hierarchy: rapid scale meets limited primary disclosure"
    body: >-
      The central risk is not a documented enforcement action or outage; the assigned evidence
      contains no current primary regulator, court, security-attestation, or incident record from
      which to establish either one. Instead, the evidence shows a regulated RIA scaling a broad
      advisory and investment platform while relying largely on company-issued growth disclosures
      and secondary profiles. Farther reports $23 billion of recruited assets, but that measure
      includes both assets under management and assets expected from advisers still joining. A
      secondary profile separately reports more than $15 billion of managed AUM as of April 2026,
      making onboarding conversion, reporting discipline, and service capacity the highest-priority
      diligence areas. Regulatory severity is potentially high because client assets, fiduciary
      obligations, and private-market access are involved, while likelihood remains unquantified
      without the current Form ADV, examination history, complaints, litigation search, and control
      reports.
    claimRefs: [CR002, CR004, CR009, CR012, CR016]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: "operational-resilience"
    title: "Operational, technology, and service-quality exposure"
    body: >-
      Scale creates a compound execution problem: adviser books must transition onto the platform,
      custody records must remain accurate across multiple independent custodians, and compliance
      and client service must keep pace with recruited assets. Independent secondary analysis
      identifies quality-at-scale, adviser retention, and conversion of recruited assets into
      managed AUM as the model's principal pitfalls. Independent custody reduces balance-sheet
      commingling risk but does not remove cyber, fraud, operational-continuity, or custody-chain
      risk. The platform's advertised risk-management and AI tooling are mitigants only at the
      product-description level; the assigned sources provide no uptime history, penetration-test
      results, SOC report, disaster-recovery metrics, material-incident register, or service-level
      evidence. The practical monitor is therefore transition quality: conversion timing, exception
      rates, client complaints, adviser attrition, and control failures should be tracked together.
    claimRefs: [CR004, CR005, CR006, CR007, CR008, CR012, CR016]
    tableRefs: [TR002]
  - id: "dependencies-and-model"
    title: "Partner dependencies and financial-model opacity"
    body: >-
      Farther's operating model distributes rather than eliminates dependencies. Independent
      custodians hold client assets, advisers carry client relationships onto the platform, and
      outside capital funds continued expansion. That structure can limit direct custody exposure,
      but it leaves transition quality dependent on custody integrations and growth dependent on
      advisers choosing to move and retain their books. The $150 million Series D is evidence of
      financing access, not evidence of available cash, runway, positive operating cash flow, or
      profitability. Independent profiles report that profitability is not publicly disclosed and
      that available revenue figures are third-party estimates. The investment implication is to
      treat capital adequacy, unit economics, and dilution as unresolved rather than infer them from
      round size or valuation.
    claimRefs: [CR001, CR005, CR007, CR010, CR011, CR015]
    tableRefs: [TR003]
  - id: "mitigations-and-kill-criteria"
    title: "Mitigations, monitoring indicators, and thesis-break triggers"
    body: >-
      Mitigation maturity cannot be verified from the assigned public evidence, so the underwriting
      standard should be evidence-based. Before investment, management should provide the current
      Form ADV and amendments, examination and complaint history, litigation and insurance
      schedules, SOC or equivalent controls, penetration-test remediation, business-continuity test
      results, custodian incident and reconciliation metrics, and adviser-transition cohorts.
      Monthly monitoring should separate regulatory AUM, managed AUM, and recruited assets; disclose
      conversion time and fallout; track adviser and client retention; and reconcile cash, burn, and
      runway to hiring and onboarding plans. Thesis-break triggers are a material regulatory action,
      an unresolved client-asset or data-security incident, persistently widening recruited-to-managed
      asset gaps, deterioration in adviser retention, or refusal to provide auditable financial and
      control evidence. Passing diligence requires verified controls and trend data, not merely the
      absence of adverse reporting in this limited source set.
    claimRefs: [CR002, CR003, CR004, CR006, CR007, CR008, CR010, CR013, CR014, CR016]
