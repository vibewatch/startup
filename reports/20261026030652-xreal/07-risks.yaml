company:
  name: XREAL
chapter:
  number: 7
  title: Risks
  summary: "XREAL's central risks are weak AR-category scale, product and accessory friction, and dependency on host-device and Android XR ecosystems. Public evidence supports specific diligence tests, but not a precise cash-runway estimate, company-wide defect rate, or conclusion that XREAL has violated any regulation."
sections:
  - id: ranked-risk-picture
    title: Ranked risk picture
    body: >-
      Category economics are the highest residual exposure. Smart Analytics Global estimates that
      global AR-glasses shipments remained below 1 million units in 2025, versus about 8.5 million
      AI-glasses units and US$2.3 billion of AI-glasses revenue, and links XREAL's continuing losses
      to the weak-margin pressure created by small scale. Those estimates are not XREAL financial
      disclosures, so they establish a risk signal rather than burn, runway, or cash availability.
      The investment gate is evidence of product-level gross margin, inventory turns, warranty
      burden, and downside runway.

      Product execution ranks next. The 1S depends entirely on a compatible connected device and
      lacks environment mapping or object anchoring; reviewers also identify extended-session
      fatigue and recurring difficulty with Ultra-Wide mode. AURA moves battery and compute into a
      wired puck, and its final production runtime was not confirmed in the retained review. These
      observations do not establish fleet-wide defect rates, but they make compatibility, runtime,
      returns, firmware incidents, and support tickets necessary monitoring indicators rather than
      optional operating detail.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR007, CR009, CR010, CR012]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: regulatory-and-legal-exposure
    title: Regulatory and legal exposure
    body: >-
      AURA's cameras, microphones, contextual AI, and cloud-connected software broaden the control
      surface beyond a wearable display. VR Expert specifically says enterprise deployments must
      evaluate privacy, cloud processing, account management, and data governance. In the European
      Union, the Commission says AI Act transparency rules took effect in August 2026 and describes
      separate obligations for prohibited, high-risk, and general-purpose AI. The retained evidence
      does not determine whether any specific XREAL feature is high-risk, nor does it show an
      enforcement action; classification depends on the final feature, provider role, deployment,
      and data flows.

      China's multi-ministry 2022-2026 plan supports VR development and industrial integration,
      but the retained policy summary does not establish successor policy, XREAL-specific licenses,
      subsidies, or export-control treatment after the plan horizon. The practical mitigation is a
      jurisdiction-by-jurisdiction product and data-flow map, documented AI Act role analysis,
      privacy impact assessments, incident response, and an IP and licensing schedule. Until those
      primary records are produced, legal severity remains high while likelihood is explicitly
      uncertain.
    claimRefs: [CR008, CR015, CR016]
    tableRefs: [TR001]
  - id: dependencies-and-kill-criteria
    title: Dependencies, mitigations, and kill criteria
    body: >-
      XREAL's products depend on counterparties even when the hardware is proprietary. The 1S needs
      DisplayPort Alt Mode from a host device; AURA uses Android XR and a separate compute puck; and
      a hands-on TechRadar account confirms that AURA's battery and processing are outside the
      glasses. CNBC also reported XREAL's co-founder acknowledging that platform owners could
      eventually build competing glasses and block XREAL. The current 1 Pro+ release initially
      relied on XREAL.com, with broader retail availability described only as coming soon, so channel
      timing should not be treated as completed distribution.

      Mitigation should be measured through a tested compatibility matrix, offline or degraded
      modes, accessory availability, firmware rollback, contractual data portability, and channel
      sell-through. The thesis should break if host-device changes materially shrink compatibility,
      AURA misses production runtime or reliability thresholds, camera and AI features ship without
      auditable governance, or category scale remains niche while losses persist. It should also be
      re-underwritten if XREAL cannot provide audited runway, product-margin, return-rate, and
      counterparty-concentration evidence.
    claimRefs: [CR002, CR003, CR006, CR008, CR011, CR012, CR013, CR014]
    tableRefs: [TR003]
