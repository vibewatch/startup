    title: Regulatory / legal risk register
    columns: [Rank, Rule or exposure, Jurisdiction, Evidence and status, Likelihood, Severity, Mitigation maturity, Residual exposure, Diligence path]
    enumerationScope:
      coverage: partial
      basis: "Public policy and product evidence retained for the 2026 refresh; company-specific legal records were not available."
    rows:
      - [1, "Camera, microphone, and contextual-AI privacy controls", "Multi-jurisdiction", "VR Expert flags privacy, cloud processing, account management, and data-governance review; XREAL controls are not disclosed here", "Exposure certain; violation likelihood unknown", High, "Publicly unverified", High, "Obtain data-flow maps, DPIAs, retention terms, subprocessors, security tests, and incident records"]
      - [2, "AI Act transparency or high-risk classification", "European Union", "Transparency rules took effect in August 2026; feature-level classification for XREAL is unresolved", "Medium applicability; classification uncertain", High, "No retained XREAL classification", High, "Map provider/deployer roles, intended uses, human oversight, logs, model contracts, and prohibited-use controls"]
      - [3, "Post-plan industrial VR policy and market-access dependence", China, "A five-department 2022-2026 plan supported VR development and industrial integration; successor treatment is not established", "Policy continuity unknown", Medium, "No XREAL-specific evidence retained", Medium, "Verify licenses, subsidies, standards, export controls, local data rules, and successor-policy exposure"]
    notes: "Rows are a partial risk inventory, not findings of non-compliance; likelihood and severity are analyst assessments, and unresolved company status requires primary legal and regulatory records."
    claimRefs: [CR008, CR015, CR016]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Evidence, Likelihood, Severity, Mitigation maturity, Residual exposure, Monitor or kill criterion]
    rows:
      - ["Host-device incompatibility or tether failure", "1S requires a connected DisplayPort Alt Mode device for power and content", "High dependency; failure rate unknown", High, "Public compatibility controls not assessed", "Medium-high", "Break or re-underwrite if supported-device coverage, attach success, or returns deteriorate materially"]
      - ["AURA puck, cable, runtime, or thermal shortfall", "Two reviews describe external battery and compute; final production runtime was not confirmed", "Medium; production evidence absent", High, "Architecture disclosed, production metrics absent", High, "Require runtime distributions, thermal limits, cable/puck failure rates, and warranty reserves before scale"]
      - ["Feature reliability and troubleshooting burden", "Two reviewers reported Ultra-Wide mode difficulty; one observed a black screen requiring reconnection", "Medium signal from two reviews", Medium, "Firmware remediation not established", Medium, "Monitor firmware incidents, support contacts, successful activation, and repeat failures by host"]
      - ["Extended-session comfort or fatigue", "Cybernews says extended use may cause fatigue for some users", "Medium; cohort rate unknown", Medium, "Fit features exist, outcome data absent", Medium, "Require return reasons, session-duration cohorts, comfort complaints, and safety testing"]
    notes: "Review observations cover individual devices and sessions and do not estimate company-wide defect, return, or incident rates."
    claimRefs: [CR003, CR005, CR006, CR007, CR009, CR010, CR012]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Concentration evidence, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Host video output and device support", "Phone, laptop, console, and operating-system vendors", "Function depends on compatible host protocols; concentration percentage is undisclosed", "Protocol or policy change prevents use or raises support and return costs", High, "Maintain certified-device matrix, adapters, regression testing, and fallback modes", "Medium-high"]
      - ["Android XR, Gemini, and cloud software", "Google and other software or model providers", "AURA is built around Android XR; contractual concentration is undisclosed", "API, model, policy, account, or data-term change reduces utility or increases compliance work", High, "Secure portability, service terms, offline modes, audit rights, and an exit plan", High]
      - ["Direct and retail distribution", "XREAL.com and future retail stores", "1 Pro+ launched on XREAL.com first; retail expansion was described as forthcoming", "Retail rollout delay or channel underperformance limits sell-through and support reach", Medium, "Track sell-through, return rates, retailer activation, and geographic availability", Medium]
    notes: "Counterparty concentration and failure probabilities are not disclosed in the retained evidence; the register preserves those quantities as gaps."
    claimRefs: [CR003, CR006, CR011, CR012, CR013, CR014]
