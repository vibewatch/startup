  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing-gap
      missingEvidence: A reconciled optical-AR and smart-glasses market model with explicit unit, geography, channel, and revenue definitions.
      whyItMatters: Published market totals differ by multiples and cannot support a single valuation denominator without a scope bridge.
      diligencePath: Obtain dated analyst workbooks or commission a bottom-up model separating display AR glasses, audio glasses, headsets, software, and enterprise services.
      relatedQuestionRefs: [QM002, QM008, QM009]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: adoption-economics
      missingEvidence: XREAL sell-through, returns, repeat purchase, gross margin, attach rates, and channel-level cohort data.
      whyItMatters: Shipment share and reservations show reach but not durable demand or contribution margin.
      diligencePath: Request monthly cohorts by product and channel, including units shipped versus sold-through, returns, support burden, gross margin, and repeat-purchase behavior.
      relatedQuestionRefs: [QM005, QM009]
      relatedTableRefs: [TM003]
    - type: conflicting-data
      severity: minor
      topic: shipment-share
      missingEvidence: The IDC methodology, period, denominator, and geography underlying the reported 36% XREAL market share.
      whyItMatters: A percentage without its market definition cannot be compared with the broad AR or smart-glasses forecasts.
      diligencePath: Obtain the underlying IDC release or licensed table and reconcile units, geography, and product class.
      relatedQuestionRefs: [QM003, QM008]
      relatedTableRefs: [TM002]
