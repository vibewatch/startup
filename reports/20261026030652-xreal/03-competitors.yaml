chapter:
  number: 3
  title: Competitors
  summary: XREAL occupies a strong position in tethered display glasses, with a broad $199-$699 catalog and a Google Android XR partnership. Its differentiation is clearest in optics, spatial display, and price-weighted portability, while host-device dependence, limited standalone functionality, and direct pressure from VITURE, Meta, and ecosystem-scale entrants constrain durability.
sections:
  - id: landscape-and-position
    title: Landscape and position
    body: >-
      The relevant competitive set is broader than “AR glasses.” XREAL sells
      mostly tethered display glasses that turn a phone, laptop, or console into
      a large virtual screen, while other products emphasize camera, audio, AI,
      or transparent overlays. AR Compare records 11 XREAL models, seven
      currently available, priced from $199 to $699; its catalog therefore
      spans entry display, spatial-computing accessories, and higher-end
      see-through AR rather than one homogeneous product. Independent coverage
      places VITURE's prism-display products directly against XREAL on field of
      view, brightness, and head tracking, while PCMag's tested market also
      includes Meta's camera-and-AI glasses and other display vendors. The
      status quo remains a phone, laptop, tablet, console, or monitor: the
      buyer can avoid a new wearable and still consume the same underlying
      content. XREAL's 2026 Google relationship improves platform reach, but it
      also makes the company a hardware participant in an ecosystem where
      Google, Meta, Apple, Samsung, and device manufacturers control
      distribution and software.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: buying-tradeoffs
    title: Buying trade-offs and packaging
    body: >-
      XREAL's practical advantage is a relatively light, screen-first workflow:
      a connected device supplies content and the glasses supply the private
      display and spatial positioning. Electronic Design describes the 1S as
      compatible with smartphones, laptops, and game consoles over USB-C, with
      1,200-pixel resolution, 700 nits, and a 120-Hz maximum refresh rate.
      AppleInsider's review confirms the One Pro can use an iPhone, iPad, or
      other DisplayPort-over-USB-C host, but also characterizes it as a display
      that cannot operate as an independent headset. The same review says the
      camera needed to move from 3DoF to 6DoF is a $99 add-on and wireless use
      requires another accessory. VITURE's products therefore compete on a
      similar wired display job, while Meta's glasses compete for a different
      all-day camera, audio, and AI use case. Buyers must compare the complete
      system cost, comfort, content source, and ecosystem fit rather than
      headline glasses price alone.
    claimRefs: [CP005, CP006, CP007, CP008]
    tableRefs: [TP002, TP003]
  - id: moat-and-displacement
    title: Moat durability and displacement risk
    body: >-
      XREAL's moat is a combination of optical engineering, custom spatial
      silicon, product breadth, and ecosystem access, not a fully standalone
      operating system with captive demand. The company says its X1 chip and
      optical systems are core to its products, and Android Authority reports a
      multi-year extension under which XREAL is a lead hardware partner for the
      Android XR ecosystem. That partnership can lower platform risk and give
      XREAL a route into see-through devices such as Project Aura. It does not
      eliminate dependency on Google or the need to prove consumer demand.
      Independent reviews identify the current One Pro's host cable, absent
      camera, and accessory requirements as material limitations. Competitive
      pressure is also concrete: Road to VR reports XREAL's U.S. patent suit
      against VITURE and notes Meta's shift toward AI and smart glasses. The
      suit may protect differentiation, but it also signals that optical
      features are contested and that rivals can attack the same buyer job.
      Durability therefore depends on converting display leadership into
      repeatable software, partner distribution, and a broader installed base.
    claimRefs: [CP009, CP010, CP011, CP012]
    tableRefs: []
    figureRefs: []
