callouts:
  - calloutType: strength
    title: Differentiation is real but category-specific
    body: XREAL has a credible screen-first position built on breadth, spatial display, and a Google platform relationship, but its strongest advantages apply to buyers seeking a private virtual display rather than all-day ambient AI glasses.
    claimRefs: [CP001, CP002, CP009]
  - calloutType: risk
    title: The complete system is harder to compare than the glasses price
    body: Host devices, cables, optional cameras, and wireless accessories can raise friction and weaken the apparent price advantage against direct display peers or against the status quo.
    claimRefs: [CP006, CP007, CP008]
  - calloutType: recommendation
    title: Underwrite conversion from display leadership to ecosystem durability
    body: The key diligence question is whether XREAL can turn optics and Android XR access into repeat purchases, software or service revenue, and distribution that is less dependent on a host-device ecosystem.
    claimRefs: [CP009, CP010, CP011]
