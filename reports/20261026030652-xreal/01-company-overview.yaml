callouts:
  - calloutType: strength
    title: Strategic validation with measurable execution
    body: >-
      The combination of a $100 million financing, a Google multiyear relationship,
      and an HKEX listing application is stronger evidence of institutional traction
      than partnership announcements alone.
    claimRefs: [CO007, CO009, CO014]
  - calloutType: risk
    title: Public scale evidence remains incomplete
    body: >-
      Reported revenue and geographic reach coexist with losses, operating cash
      outflow, and missing customer, headcount, board, ownership, and financing-term
      disclosures.
    claimRefs: [CO010, CO011, CO012, CO013]
