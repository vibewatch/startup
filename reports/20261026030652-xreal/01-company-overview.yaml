company:
  name: XREAL
chapter:
  number: 1
  title: Company Overview
  summary: >-
    XREAL is a Beijing-based consumer AR-glasses company founded in 2017 that has
    paired own-brand hardware with accessories and enterprise development services.
    A January 2026 Series D and April 2026 Hong Kong listing application support its
    scale narrative, while reported losses, negative operating cash flow, and thin
    public governance disclosure keep the investment case evidence-constrained.
sections:
  - id: identity-and-business-model
    title: Identity, business model, and operating footprint
    body: >-
      XREAL is a Beijing-based AR-glasses maker founded in 2017. Its disclosed
      model combines designing, developing, manufacturing, and selling own-brand
      glasses with related accessories and enterprise technical-development
      services. That makes the company principally a consumer-hardware vendor,
      not a recurring-software business, even though technical services add a
      second revenue stream. The latest public operating snapshot says its sales
      network covered 40 countries and regions at year-end 2025 and that more than
      70% of 2025 revenue came from overseas. Customer count and employee
      headcount remain undisclosed in the assigned evidence and are therefore
      treated as diligence gaps rather than estimated scale metrics.
    claimRefs: [CO001, CO002, CO005, CO013]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and key-person exposure
    body: >-
      The public leadership record is founder-led: Chi Xu is identified as
      co-founder and chief executive, while Peng Jin is identified as co-founder.
      Chi Xu personally announced the latest financing on Bloomberg Television,
      increasing the visibility of CEO dependence around capital formation and
      external narrative. Peng Jin was the named spokesperson for the 2023
      rebrand and international-expansion story, but the assigned current sources
      do not refresh his operating remit. No source in the assigned pool provides
      a current board roster, independent-director profile, voting-control map,
      succession plan, or founder ownership. Governance quality and key-person
      mitigation therefore cannot be assessed from public evidence alone.
    claimRefs: [CO003, CO004, CO006, CO007]
    tableRefs: [TO002, TO003]
  - id: funding-scale-and-financial-signal
    title: Funding, listing status, and financial signal
    body: >-
      XREAL completed a reported $100 million Series D in January 2026 at a
      reported $1 billion valuation; Road to VR separately cited Crunchbase for
      $433 million of total outside funding since 2017. The company then submitted
      a Main Board listing application to the Hong Kong Stock Exchange on April 1,
      with CICC and Citi named as joint sponsors. The filing-derived operating
      record is mixed: 2025 revenue was RMB 516 million and annual loss was RMB
      456 million, while 36Kr reported year-end cash of RMB 63.63 million and RMB
      203 million of 2025 operating cash outflow. Funding raised is not cash
      available, and annual loss is not cash burn; runway, debt, secondaries, and
      preference terms remain unavailable.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012]
  - id: milestones-and-strategic-dependencies
    title: Milestones and strategic dependencies
    body: >-
      XREAL's public arc runs from a 2017 founding and 2019 commercial product
      launch through the 2023 Nreal-to-XREAL rebrand, a Google relationship around
      Project Aura, the January 2026 financing, and the April listing application.
      In October 2026 the company launched the XREAL 1 Pro+ at $599, initially
      through its own website. Google distribution and platform alignment create
      strategic validation, but they also concentrate ecosystem dependence outside
      XREAL's control. Independent reviews reinforce that the current value
      proposition remains display-centric and externally powered or computed, with
      fit, warmth, optical bulk, and all-day-use constraints. These limitations do
      not negate product utility, but they narrow the leap from wearable display
      vendor to general-purpose spatial-computing platform.
    claimRefs: [CO002, CO005, CO006, CO007, CO009, CO014, CO015, CO016]
    figureRefs: [FO001]
