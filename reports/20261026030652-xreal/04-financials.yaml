company:
  name: XREAL
chapter:
  number: 4
  title: Financials
  summary: >-
    XREAL's public record shows a hardware-led business that reached RMB 516 million of
    revenue and a 35.2% gross margin in 2025, but remained loss-making and ended that year
    with only RMB 64 million of cash and cash equivalents. The January 2026 financing and
    Hong Kong IPO filing improve access to capital, but public evidence does not establish
    current cash burn, runway, working-capital needs, realized pricing, or customer-acquisition economics.
sections:
  - id: revenue-quality-and-mix
    title: Revenue quality improved, but hardware still dominates
    body: >-
      XREAL generated RMB 516 million of revenue in 2025, about $72 million in the reporting
      cited by UC Today, while gross margin rose from 18.8% in 2023 to 35.2% in 2025. The
      improvement is meaningful but does not make the business software-like: AR glasses
      contributed RMB 403 million, or 78.1% of 2025 revenue; accessories contributed roughly
      RMB 73 million, or 14.1%; and services and other income contributed roughly RMB 40 million,
      or 7.8%. More than 70% of revenue came from overseas markets, increasing exposure to
      channel execution, foreign demand, and product-cycle timing. The public mix therefore
      indicates better hardware economics rather than recurring revenue, and no retained source
      reports ARR, contracted backlog, renewal behavior, or revenue-recognition policy.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001]
  - id: pricing-and-go-to-market
    title: List prices span several tiers, while realized economics remain private
    body: >-
      Public price points show a deliberate ladder from display glasses to higher-spec spatial
      computing devices. XREAL's company-issued release lists the XREAL 1 Pro+ at $599, Business
      Insider reported a $699 pre-order price for Air 2 Ultra in 2024, and TechRadar said Aura's
      price was not yet confirmed but would be no more than $1,500. These are list prices or
      product guidance, not realized average selling prices or gross profit per unit. The 2025
      product data reported by 36Kr suggests that One-series volume dominated, while the
      entry-level Air series contracted sharply from its prior-year volume. Overseas revenue
      concentration and historical reliance on Amazon point to meaningful channel exposure, but
      the retained evidence does not disclose channel fees, discounts, return rates, sales cycle,
      CAC, or payback.
    claimRefs: [CI003, CI005, CI006, CI009, CI010, CI011, CI012]
    tableRefs: [TI002]
  - id: margin-and-unit-economics
    title: Gross-margin progress has not yet produced operating self-sufficiency
    body: >-
      The 35.2% gross margin in 2025 is a clear improvement, but adjusted net loss was still
      RMB 250 million, versus RMB 437 million in 2023. That accounting loss must not be treated
      as cash burn: the retained sources do not provide a complete cash-flow statement, capex,
      inventory turns, payment terms, debt schedule, or project-finance obligations. Public
      forecasting also deserves a discount. Business Insider relayed a 2024 management projection
      of $200 million to $300 million of 2025 revenue, whereas the later prospectus-based reporting
      put 2025 revenue at about $72 million. Different reporting currencies do not change the large
      directional gap, but the comparison is a forecast-versus-actual signal, not a restatement of
      audited guidance accuracy.
    claimRefs: [CI001, CI002, CI007, CI013, CI014]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: capital-adequacy-and-verdict
    title: Financing access is proven; capital adequacy is not
    body: >-
      XREAL ended 2025 with RMB 64 million of cash and cash equivalents, down from RMB 205 million
      one year earlier, according to adverse 36Kr analysis of the prospectus. Sina and StartupHub
      each reported a $100 million January 2026 financing at roughly or above a $1 billion
      valuation, while Sina said proceeds would support technology development and production
      capacity. Funding raised is not cash currently available, and no retained source reconciles
      the financing to post-close cash, restricted cash, operating outflows, inventory commitments,
      or debt. The April 2026 Hong Kong IPO filing provides another financing path, but it does not
      establish that the listing will complete. The financial verdict is therefore mixed: revenue
      quality and gross margin improved, yet liquidity, runway, working capital, and unit economics
      remain material underwriting blockers.
    claimRefs: [CI007, CI008, CI015, CI016]
callouts:
  - calloutType: risk
    title: Runway cannot be inferred from funding headlines
    body: >-
      The reported January 2026 financing cannot be treated as current cash available. Obtain
      monthly cash, operating and investing cash flows, inventory commitments, debt, and the
      financing closing statement before underwriting runway.
    claimRefs: [CI008, CI015, CI016]
