      - [FY2025 adjusted net loss, "RMB 250m", "Medium; one adverse analytical source", "Shows gross profit did not cover adjusted operating costs", "Adjustment bridge and monthly operating expense detail"]
      - [Cash and cash equivalents at FY2025 end, "RMB 64m", "Medium; one adverse analytical source", "Signals limited pre-financing liquidity", "Bank statements, restrictions, and post-financing cash reconciliation"]
      - [Cash burn and runway, null, "Unavailable", "Accounting loss and funding raised do not establish burn or runway", "Monthly operating and investing cash flow plus minimum-cash policy"]
      - [CAC and payback, null, "Unavailable", "Required to judge direct and channel sales efficiency", "CAC by channel, contribution margin, cohort payback, and sales-cycle data"]
      - [Working-capital cycle, null, "Unavailable", "Inventory and supplier terms can dominate hardware cash needs", "Inventory aging, deposits, receivables, payables, and purchase commitments"]
