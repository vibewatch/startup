  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and demand
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not all augmented reality. For XREAL, the core addressable category is consumer and
              prosumer optical AR glasses that provide a visual display, spatial computing, and media or productivity
              use cases; it includes tethered and lightweight wired glasses, while excluding phone-only AR, conventional
              VR headsets, audio-only glasses, and industrial systems sold without a consumer-glasses path. This
              distinction matters because the assigned market sources mix these populations. Accio describes a 2026
              landscape with high-performance spatial-computing glasses, AI lifestyle audio glasses, and low-cost
              functional frames, while the specialist market-research source estimates smart glasses at $7.5
              billion-$12.5 billion in 2026. The broader AR estimates are much larger and include software, services,
              industrial overlays, and mobile experiences. XREAL's product evidence supports several buyer jobs inside
              the narrower boundary: portable large-screen entertainment, gaming, productivity, and spatial
              applications. It also shows an expansion path into enterprise and healthcare through developer and partner
              applications, but those are adoption adjacencies rather than proof of a separately measurable XREAL SAM.
              The status quo is still a phone, laptop, television, monitor, or conventional headset, and the practical
              substitution test is whether a buyer will tolerate tethering, battery limits, fit constraints, and a
              premium price for hands-free or private spatial viewing.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and comparability
        blocks:
          - type: paragraph
            body: >-
              Public sizing is directionally bullish but not directly additive. Mordor Intelligence reports a broad
              augmented-reality market of $125.11 billion in 2026, rising to $387.23 billion in 2031 at a 25.35% CAGR,
              while Precedence Research reports $207.16 billion in 2026 and $2.80482 trillion by 2034 at a 38.5% CAGR.
              Those estimates use different definitions and methodologies, so the gap is a diligence signal rather than
              a midpoint to underwrite. The smart-glasses-specific source gives a narrower $7.5 billion-$12.5 billion
              2026 range and a 22%-28% 2026-2031 CAGR, which is more relevant to XREAL but still combines display and
              non-display categories. A separate 2026 Accio synthesis cites a $24.88 billion market valuation, but its
              source labels and methodology are not transparent enough to reconcile it with the other estimates.
              XREAL-specific shipment evidence is more useful for competitive position than for TAM: Shenzhen Daily,
              citing IDC, says XREAL captured 36% of the market in the second quarter and shipments grew 114% year over
              year, but the article does not state the market's denominator or unit definition. The underwriting
              conclusion is an evidence-constrained range, not a single TAM: broad AR is a context ceiling; smart
              glasses is the nearer category; XREAL's obtainable share requires verified unit economics, attach rates,
              retention, and channel data that are not public in the assigned evidence.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM011
      - number: '2.3'
        title: Buyers, adoption path, and constraints
        blocks:
          - type: paragraph
            body: >-
              The buyer map separates the person who uses the glasses from the person who controls the budget. Consumers
              and early adopters can self-fund entertainment, gaming, travel, and private-screen use; professional users
              may justify a purchase through portable productivity, training, or visualization, but the assigned sources
              do not establish enterprise contract values or deployment conversion. XREAL AURA's announced ecosystem
              spans entertainment, productivity, gaming, sports, healthcare, and enterprise applications, and its launch
              plan includes Best Buy plus reservations in the US, UK, and Japan, creating a plausible
              retail-to-developer adoption path. Google Play availability, Android XR, Gemini, and partner applications
              can reduce software discovery friction, but they also increase dependency on platform partners and content
              quality. The biggest constraints remain the historical hardware/software mismatch, comfort and social
              acceptance, tethering and battery limitations, privacy concerns for camera-enabled devices, and price.
              TechCrunch reports that the industry has historically absorbed large investment with little profit and
              quotes XREAL's CEO saying the company expects potential break-even the following year; that is company
              guidance, not proof of market profitability. The market can grow rapidly while XREAL remains exposed to
              returns, support burden, component costs, and the unresolved question of which use case is frequent enough
              to sustain repeat purchases.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
              - CM017
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM012
              - CM013
              - CM017
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwrite the narrow category, not the broad AR headline
            body: >-
              The broad AR forecasts establish strategic context, but the smart-glasses range and XREAL's product-level
              adoption evidence are the more decision-useful lenses. A defensible valuation case should bridge from
              category demand to XREAL-specific sell-through, margin, retention, and channel evidence rather than
              applying a broad-market CAGR to company revenue.
            calloutType: insight
            claimRefs:
              - CM006
              - CM008
              - CM010
              - CM016
          - type: callout
            title: Adoption inflection remains conditional
            body: >-
              The evidence supports improving hardware, software, and distribution, but it also documents a history of
              weak industry profitability and unresolved comfort, privacy, battery, and price tradeoffs. These
              constraints can delay conversion even if headline market forecasts remain strong.
            calloutType: risk
            claimRefs:
              - CM012
              - CM014
              - CM015
              - CM017
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and position
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than “AR glasses.” XREAL sells mostly tethered display glasses
              that turn a phone, laptop, or console into a large virtual screen, while other products emphasize camera,
              audio, AI, or transparent overlays. AR Compare records 11 XREAL models, seven currently available, priced
              from $199 to $699; its catalog therefore spans entry display, spatial-computing accessories, and
              higher-end see-through AR rather than one homogeneous product. Independent coverage places VITURE's
              prism-display products directly against XREAL on field of view, brightness, and head tracking, while
              PCMag's tested market also includes Meta's camera-and-AI glasses and other display vendors. The status quo
              remains a phone, laptop, tablet, console, or monitor: the buyer can avoid a new wearable and still consume
              the same underlying content. XREAL's 2026 Google relationship improves platform reach, but it also makes
              the company a hardware participant in an ecosystem where Google, Meta, Apple, Samsung, and device
              manufacturers control distribution and software.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP008
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP005
              - CP008
              - CP009
              - CP010
      - number: '3.2'
        title: Buying trade-offs and packaging
        blocks:
          - type: paragraph
            body: >-
              XREAL's practical advantage is a relatively light, screen-first workflow: a connected device supplies
              content and the glasses supply the private display and spatial positioning. Electronic Design describes
              the 1S as compatible with smartphones, laptops, and game consoles over USB-C, with 1,200-pixel resolution,
              700 nits, and a 120-Hz maximum refresh rate. AppleInsider's review confirms the One Pro can use an iPhone,
              iPad, or other DisplayPort-over-USB-C host, but also characterizes it as a display that cannot operate as
              an independent headset. The same review says the camera needed to move from 3DoF to 6DoF is a $99 add-on
              and wireless use requires another accessory. VITURE's products therefore compete on a similar wired
              display job, while Meta's glasses compete for a different all-day camera, audio, and AI use case. Buyers
              must compare the complete system cost, comfort, content source, and ecosystem fit rather than headline
              glasses price alone.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              XREAL's moat is a combination of optical engineering, custom spatial silicon, product breadth, and
              ecosystem access, not a fully standalone operating system with captive demand. The company says its X1
              chip and optical systems are core to its products, and Android Authority reports a multi-year extension
              under which XREAL is a lead hardware partner for the Android XR ecosystem. That partnership can lower
              platform risk and give XREAL a route into see-through devices such as Project Aura. It does not eliminate
              dependency on Google or the need to prove consumer demand. Independent reviews identify the current One
              Pro's host cable, absent camera, and accessory requirements as material limitations. Competitive pressure
              is also concrete: Road to VR reports XREAL's U.S. patent suit against VITURE and notes Meta's shift toward
              AI and smart glasses. The suit may protect differentiation, but it also signals that optical features are
              contested and that rivals can attack the same buyer job. Durability therefore depends on converting
              display leadership into repeatable software, partner distribution, and a broader installed base.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is real but category-specific
            body: >-
              XREAL has a credible screen-first position built on breadth, spatial display, and a Google platform
              relationship, but its strongest advantages apply to buyers seeking a private virtual display rather than
              all-day ambient AI glasses.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP009
          - type: callout
            title: The complete system is harder to compare than the glasses price
            body: >-
              Host devices, cables, optional cameras, and wireless accessories can raise friction and weaken the
              apparent price advantage against direct display peers or against the status quo.
            calloutType: risk
            claimRefs:
              - CP006
              - CP007
              - CP008
          - type: callout
            title: Underwrite conversion from display leadership to ecosystem durability
            body: >-
              The key diligence question is whether XREAL can turn optics and Android XR access into repeat purchases,
              software or service revenue, and distribution that is less dependent on a host-device ecosystem.
            calloutType: recommendation
            claimRefs:
              - CP009
              - CP010
              - CP011
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue quality improved, but hardware still dominates
        blocks:
          - type: paragraph
            body: >-
              XREAL generated RMB 516 million of revenue in 2025, about $72 million in the reporting cited by UC Today,
              while gross margin rose from 18.8% in 2023 to 35.2% in 2025. The improvement is meaningful but does not
              make the business software-like: AR glasses contributed RMB 403 million, or 78.1% of 2025 revenue;
              accessories contributed roughly RMB 73 million, or 14.1%; and services and other income contributed
              roughly RMB 40 million, or 7.8%. More than 70% of revenue came from overseas markets, increasing exposure
              to channel execution, foreign demand, and product-cycle timing. The public mix therefore indicates better
              hardware economics rather than recurring revenue, and no retained source reports ARR, contracted backlog,
              renewal behavior, or revenue-recognition policy.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI003
              - CI004
      - number: '4.2'
        title: List prices span several tiers, while realized economics remain private
        blocks:
          - type: paragraph
            body: >-
              Public price points show a deliberate ladder from display glasses to higher-spec spatial computing
              devices. XREAL's company-issued release lists the XREAL 1 Pro+ at $599, Business Insider reported a $699
              pre-order price for Air 2 Ultra in 2024, and TechRadar said Aura's price was not yet confirmed but would
              be no more than $1,500. These are list prices or product guidance, not realized average selling prices or
              gross profit per unit. The 2025 product data reported by 36Kr suggests that One-series volume dominated,
              while the entry-level Air series contracted sharply from its prior-year volume. Overseas revenue
              concentration and historical reliance on Amazon point to meaningful channel exposure, but the retained
              evidence does not disclose channel fees, discounts, return rates, sales cycle, CAC, or payback.
            claimRefs:
              - CI003
              - CI005
              - CI006
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI009
              - CI010
              - CI011
      - number: '4.3'
        title: Gross-margin progress has not yet produced operating self-sufficiency
        blocks:
          - type: paragraph
            body: >-
              The 35.2% gross margin in 2025 is a clear improvement, but adjusted net loss was still RMB 250 million,
              versus RMB 437 million in 2023. That accounting loss must not be treated as cash burn: the retained
              sources do not provide a complete cash-flow statement, capex, inventory turns, payment terms, debt
              schedule, or project-finance obligations. Public forecasting also deserves a discount. Business Insider
              relayed a 2024 management projection of $200 million to $300 million of 2025 revenue, whereas the later
              prospectus-based reporting put 2025 revenue at about $72 million. Different reporting currencies do not
              change the large directional gap, but the comparison is a forecast-versus-actual signal, not a restatement
              of audited guidance accuracy.
            claimRefs:
              - CI001
              - CI002
              - CI007
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI007
              - CI008
              - CI015
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI003
              - CI005
              - CI007
              - CI008
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Financing access is proven; capital adequacy is not
        blocks:
          - type: paragraph
            body: >-
              XREAL ended 2025 with RMB 64 million of cash and cash equivalents, down from RMB 205 million one year
              earlier, according to adverse 36Kr analysis of the prospectus. Sina and StartupHub each reported a $100
              million January 2026 financing at roughly or above a $1 billion valuation, while Sina said proceeds would
              support technology development and production capacity. Funding raised is not cash currently available,
              and no retained source reconciles the financing to post-close cash, restricted cash, operating outflows,
              inventory commitments, or debt. The April 2026 Hong Kong IPO filing provides another financing path, but
              it does not establish that the listing will complete. The financial verdict is therefore mixed: revenue
              quality and gross margin improved, yet liquidity, runway, working capital, and unit economics remain
              material underwriting blockers.
            claimRefs:
              - CI007
              - CI008
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Runway cannot be inferred from funding headlines
            body: >-
              The reported January 2026 financing cannot be treated as current cash available. Obtain monthly cash,
              operating and investing cash flows, inventory commitments, debt, and the financing closing statement
              before underwriting runway.
            calloutType: risk
            claimRefs:
              - CI008
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product lines map to two distinct customer jobs
        blocks:
          - type: paragraph
            body: >-
              XREAL's shipping One family is principally a wearable-display product: the glasses turn a phone, computer,
              console, or handheld into a large virtual screen for media, gaming, and productivity. The October 2026
              XREAL 1 Pro+ release kept the X1 chip, native 3DoF anchoring, and 57-degree field of view while adding
              brighter display output, AI HDR, faster 2D-to-3D conversion, and fit changes. Aura is a different
              proposition. Independent hands-on coverage describes optical-see-through 2K displays, a 70-degree field of
              view, cameras, hand tracking, and an external compute puck, shifting the workflow from screen extension
              toward multi-app Android XR spatial computing. Air 2 Ultra remains the clearest public developer device,
              with dual environment sensors and 6DoF features. These surfaces form a coherent ladder, but Aura's
              shipment timing and production behavior were not independently confirmed by the reviewed evidence.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE008
              - CE015
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE006
              - CE007
              - CE010
              - CE011
      - number: '5.2'
        title: Split compute reduces head-worn burden but adds dependency layers
        blocks:
          - type: paragraph
            body: >-
              The architecture separates display and sensing from heavier compute. Public reporting describes Aura's X1S
              chip in the glasses and Snapdragon XR2+ Gen 2 in a separate puck, while the established wearable-display
              workflow can depend on a USB-C host or Beam-like companion. At the software layer, XREAL's SDK has moved
              from proprietary NRSDK-style APIs toward Unity's XR Plugin, XR Interaction Toolkit, and AR Foundation. The
              official documentation exposes motion tracking, plane detection, image anchoring, hand tracking, depth
              mesh, spatial anchors, and rendering optimization. That standards alignment may lower porting friction,
              but the public developer proof is still thin: one company-linked troubleshooting template documents a
              current Unity and SDK setup, while no independent package-download, contributor, application-catalog, or
              production-usage series was found in the assigned evidence.
            claimRefs:
              - CE004
              - CE006
              - CE007
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE006
              - CE007
              - CE009
              - CE010
              - CE015
              - CE016
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE008
              - CE011
              - CE012
      - number: '5.3'
        title: Differentiation is moving from optics toward platform leverage
        blocks:
          - type: paragraph
            body: >-
              The near-term differentiation case combines lightweight optical engineering, proprietary spatial silicon,
              broad host compatibility, and a Google-aligned Android XR roadmap. Two independent reports describe a
              multiyear Google partnership that makes XREAL a lead Android XR hardware partner and extends work to
              optical-see-through and wired XR devices. The strongest product-specific external evidence is hands-on
              rather than longitudinal: TechRadar found the Aura form factor comfortable and functional in a demo, while
              a low-reputation Sohu comparison reported favorable latency, field-of-view, and runtime results for 1 Pro+
              without publishing reproducible raw data. Management's stated 2027-2028 mass-adoption horizon also depends
              on improvements in multimodal AI, supply chains, and agent ecosystems. The resulting moat is therefore
              partly execution and ecosystem access, not yet a demonstrated durability advantage.
            claimRefs:
              - CE003
              - CE005
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Public specifications outpace public assurance evidence
        blocks:
          - type: paragraph
            body: >-
              XREAL discloses detailed display, tracking, and interaction capabilities, but the assigned official SDK
              and developer pages do not disclose security certifications, privacy-control architecture,
              vulnerability-management practices, service-level objectives, incident history, or field reliability. This
              is especially important for Aura because cameras, hand and eye tracking, Gemini integration, Google Play
              access, and a compute puck expand the data and dependency surface. Split compute also creates cable,
              host-compatibility, thermal, battery, and platform-release dependencies even as it improves comfort.
              Diligence should therefore treat product specifications as feature evidence rather than proof of
              production quality. Release-level return rates, warranty claims, support-ticket burden, device failure
              rates, privacy assessments, and secure-update commitments are required before underwriting enterprise
              readiness or a durable technical moat.
            claimRefs:
              - CE004
              - CE007
              - CE010
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Feature maturity is not assurance maturity
            body: >-
              Public material is specific about optics, tracking, and developer APIs but does not provide the
              field-reliability, security, privacy, and secure-update evidence needed to underwrite enterprise-grade
              deployment.
            calloutType: risk
            claimRefs:
              - CE007
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying motion
        blocks:
          - type: paragraph
            body: >-
              XREAL's disclosed customer surface is primarily consumer hardware rather than a named enterprise-account
              base. Its glasses address entertainment, gaming, productivity, travel viewing, and emerging
              spatial-computing use cases. The buyer, user, and payer are generally the same individual, while phones,
              laptops, consoles, or external compute devices provide content and processing. The 2025 channel mix
              reported by Baidu Baike was 70.8% direct sales and 29.2% distribution; the same source reported that 71%
              of revenue came from outside mainland China, led by the United States, Japan, and Europe. Those figures
              indicate a globally distributed consumer motion, but they do not disclose active users, channel
              sell-through, retailer inventory, or the share of repeat buyers.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU008
      - number: '6.2'
        title: Adoption trajectory and product usage
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption evidence is unit shipment history rather than a customer cohort. Multiple current
              sources report annual AR-glasses volume of about 137,200 units in 2023, 124,900 in 2024, and 133,700 in
              2025, leaving total volume broadly flat across the period. Within that stable total, the mix changed
              sharply: the One series reached roughly 111,000 units in 2025 while Air fell to roughly 17,000, suggesting
              premium-product substitution rather than broad unit expansion. Mashable separately reported about 10,000
              One Pro pre-orders fulfilled before repeated sell-outs, while a hands-on 1S review described more than two
              hours of comfortable viewing. These observations support real launch demand and usable consumer workflows,
              but not retention, repeat purchase, or durable engagement.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU016
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU016
      - number: '6.3'
        title: Named proof, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Named relationships widen XREAL's route to market but should not be mistaken for a customer roster. Google
              and XREAL publicly positioned Project Aura as Android XR eyewear, and TechRadar's hands-on account
              described the glasses working with an external compute puck. Amazon and Best Buy provide production retail
              availability, while the 1 Pro+ launched first through XREAL.com at $599 with additional retail stores to
              follow. These are concrete platform and distribution signals, yet none discloses paid deployment volume,
              partner-sourced revenue, retailer sell-through, or top-counterparty exposure. The evidence therefore
              supports channel breadth and an upgrade path, not demonstrated land-and-expand economics or low
              concentration.
            claimRefs:
              - CU007
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU009
              - CU010
              - CU011
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU007
              - CU009
              - CU011
              - CU015
      - number: '6.4'
        title: Durability and diligence implications
        blocks:
          - type: paragraph
            body: >-
              Customer durability remains the chapter's central unresolved issue. The assigned evidence provides no NRR,
              GRR, churn, renewal, repeat-purchase, return-rate, warranty, support-ticket, or product-level active-use
              series. It also does not reconcile cumulative-unit claims to a current installed base. Category evidence
              adds caution: CNBC cited Omdia's view that display-equipped AI glasses would represent only 10% of
              projected 2026 global smart-glasses sales, while current XREAL reporting describes approximately flat
              annual AR-glasses volume. Diligence should therefore prioritize cohort and channel records over additional
              logos. Until XREAL supplies sell-in versus sell-through, returns, support burden, upgrade behavior, and
              top-account or partner concentration, the customer thesis is best characterized as credible product
              adoption with unproven durability.
            claimRefs:
              - CU005
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Distribution and use cases are tangible
            body: >-
              XREAL combines direct sales, third-party retail, and a product ladder spanning entertainment, gaming,
              productivity, and emerging Android XR use.
            calloutType: strength
            claimRefs:
              - CU001
              - CU003
              - CU007
              - CU009
          - type: callout
            title: Unit visibility is not retention proof
            body: >-
              Approximately flat annual AR-glasses volume and the absence of cohort metrics prevent a conclusion that
              launch demand is converting into durable expansion.
            calloutType: risk
            claimRefs:
              - CU005
              - CU013
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              Category economics are the highest residual exposure. Smart Analytics Global estimates that global
              AR-glasses shipments remained below 1 million units in 2025, versus about 8.5 million AI-glasses units and
              US$2.3 billion of AI-glasses revenue, and links XREAL's continuing losses to the weak-margin pressure
              created by small scale. Those estimates are not XREAL financial disclosures, so they establish a risk
              signal rather than burn, runway, or cash availability. The investment gate is evidence of product-level
              gross margin, inventory turns, warranty burden, and downside runway.

              Product execution ranks next. The 1S depends entirely on a compatible connected device and lacks
              environment mapping or object anchoring; reviewers also identify extended-session fatigue and recurring
              difficulty with Ultra-Wide mode. AURA moves battery and compute into a wired puck, and its final
              production runtime was not confirmed in the retained review. These observations do not establish
              fleet-wide defect rates, but they make compatibility, runtime, returns, firmware incidents, and support
              tickets necessary monitoring indicators rather than optional operating detail.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR009
              - CR010
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR007
              - CR009
              - CR010
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
              - CR008
              - CR009
              - CR010
              - CR012
              - CR014
              - CR015
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              AURA's cameras, microphones, contextual AI, and cloud-connected software broaden the control surface
              beyond a wearable display. VR Expert specifically says enterprise deployments must evaluate privacy, cloud
              processing, account management, and data governance. In the European Union, the Commission says AI Act
              transparency rules took effect in August 2026 and describes separate obligations for prohibited,
              high-risk, and general-purpose AI. The retained evidence does not determine whether any specific XREAL
              feature is high-risk, nor does it show an enforcement action; classification depends on the final feature,
              provider role, deployment, and data flows.

              China's multi-ministry 2022-2026 plan supports VR development and industrial integration, but the retained
              policy summary does not establish successor policy, XREAL-specific licenses, subsidies, or export-control
              treatment after the plan horizon. The practical mitigation is a jurisdiction-by-jurisdiction product and
              data-flow map, documented AI Act role analysis, privacy impact assessments, incident response, and an IP
              and licensing schedule. Until those primary records are produced, legal severity remains high while
              likelihood is explicitly uncertain.
            claimRefs:
              - CR008
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR008
              - CR015
              - CR016
      - number: '7.3'
        title: Dependencies, mitigations, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              XREAL's products depend on counterparties even when the hardware is proprietary. The 1S needs DisplayPort
              Alt Mode from a host device; AURA uses Android XR and a separate compute puck; and a hands-on TechRadar
              account confirms that AURA's battery and processing are outside the glasses. CNBC also reported XREAL's
              co-founder acknowledging that platform owners could eventually build competing glasses and block XREAL.
              The current 1 Pro+ release initially relied on XREAL.com, with broader retail availability described only
              as coming soon, so channel timing should not be treated as completed distribution.

              Mitigation should be measured through a tested compatibility matrix, offline or degraded modes, accessory
              availability, firmware rollback, contractual data portability, and channel sell-through. The thesis should
              break if host-device changes materially shrink compatibility, AURA misses production runtime or
              reliability thresholds, camera and AI features ship without auditable governance, or category scale
              remains niche while losses persist. It should also be re-underwritten if XREAL cannot provide audited
              runway, product-margin, return-rate, and counterparty-concentration evidence.
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR008
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR006
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Evidence boundary
            body: >-
              No retained source establishes an XREAL regulatory violation, fleet-wide defect rate, counterparty
              concentration percentage, cash-burn amount, or cash runway; those remain diligence items rather than
              inferred facts.
            calloutType: risk
            claimRefs:
              - CR002
              - CR007
              - CR008
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is that XREAL has built a recognizable consumer AR-glasses position before larger
              platform companies fully mature the category. Its official company profile says it sells through more than
              40 countries and regions and held the number-one global AR-glasses sales-revenue position for 2022–2025;
              an independent market article likewise reports 27.0% 2025 global AR-glasses revenue share and 24.8% volume
              share. Ecosystem signals support optionality because current reporting identifies Google and ASUS ROG as
              strategic hardware partners. The anti-thesis is stronger at the current evidence quality: 2025 revenue was
              RMB516 million, annual AR-glasses volume remained near 130,000 units, and 2025 operating cash flow was
              negative. The valuation therefore depends on category expansion and execution that are not yet proven by
              recurring software revenue, retention, or audited public-company disclosures.
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV011
              - CV014
              - CV018
          - type: table
            tableRef: TV001
            claimRefs:
              - CV007
              - CV009
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
              - CV020
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV010
              - CV013
              - CV014
              - CV015
              - CV018
      - number: '8.2'
        title: Price sensitivity and financing context
        blocks:
          - type: paragraph
            body: >-
              The financing record supports a headline value but not a fully underwritten entry price. PYMNTS, citing a
              Bloomberg Television interview with CEO Chi Xu, reports that XREAL raised $100 million in January 2026 and
              was valued at more than $1 billion. Baidu Baike separately reports a $67.76 million Series D at an $833
              million post-money valuation. IPO-focused accounts report approximately RMB64 million of cash at end-2025
              and RMB203 million of 2025 operating cash outflow. These figures are not interchangeable: the reported
              round size and valuation references conflict, and the public evidence does not establish whether the
              greater-than-$1 billion figure is post-money, a financing mark, or an IPO expectation. The available
              record also does not disclose dilution, liquidation preferences, debt terms, or an offer price. Without
              those terms, a precise equity-value recommendation would be false precision. The decision should be
              conditional on primary prospectus review, cash runway, cap table, and the price paid for the relevant
              security.
            claimRefs:
              - CV007
              - CV009
              - CV010
              - CV015
              - CV019
      - number: '8.3'
        title: Scenarios and comparable signals
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more defensible than a single multiple because the business is still concentrated
              in hardware. The 2025 revenue mix reported from the prospectus was 78.1% AR glasses, 14.1% accessories,
              and 7.8% services and other. That mix can support a bull case if higher-priced products expand the
              category and services become a second growth curve, but it also creates downside exposure to inventory,
              component, and channel risk. The comparable evidence is directional rather than a peer-set valuation:
              CompaniesMarketCap reports Vuzix at a $0.17 billion market capitalization on 25 October 2026, but Vuzix is
              a public competitor with different scale and financial profile. XREAL should not be marked to that figure
              mechanically. The more relevant conclusion is that public-market pricing for small AR hardware can be
              volatile, so a private $1 billion mark needs evidence of growth, liquidity, and governance premium to be
              credible.
            claimRefs:
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV009
              - CV010
              - CV012
              - CV014
              - CV015
              - CV019
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV006
              - CV010
              - CV013
              - CV014
              - CV018
              - CV020
      - number: '8.4'
        title: Recommendation and diligence gates
        blocks:
          - type: paragraph
            body: >-
              The recommendation is track, with research-more as the immediate diligence action, not buy. The positive
              case has real support: market share, current ecosystem relationships, and a reported gross-margin
              improvement to 35.2% in 2025. The negative case is equally decision-relevant: revenue scale remains
              modest, 2025 cash generation was negative, unit volumes have been broadly stagnant, and the company is
              pursuing an IPO with limited public liquidity detail. XREAL also disclosed a US patent suit against Viture
              affiliates; because the announcement is company-issued, it establishes the existence of the claim, not the
              merits or expected financial outcome. Before increasing conviction, obtain the filed prospectus, audited
              statements, cap table and preference schedule, use-of-proceeds and runway analysis, product-level gross
              margins, cohort/return data, channel concentration, and status of the litigation. Thesis-break triggers
              are a failed listing without alternative liquidity, cash falling below a documented operating runway,
              continued flat unit volume despite category growth, or evidence that the gross-margin improvement is
              offset by inventory and customer-acquisition costs.
            claimRefs:
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
              - CV018
              - CV019
              - CV020
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, not buy
            body: >-
              XREAL has enough category and product proof to merit continued diligence, but not enough public financing,
              cash-flow, or security-term evidence to support a buy recommendation at the reported private valuation.
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV009
              - CV011
              - CV020
          - type: callout
            title: Liquidity is the gating question
            body: >-
              The reported cash balance and operating cash outflow make runway and financing terms more
              decision-relevant than a headline market-share ranking.
            calloutType: risk
            claimRefs:
              - CV010
              - CV015
