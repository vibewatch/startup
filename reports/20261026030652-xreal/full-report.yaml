  - id: FI001
    title: Revenue-to-liquidity evidence bridge
    type: flow
    summary: >-
      Public evidence supports product revenue and gross-margin improvement, but the bridge to free cash flow and runway
      is incomplete.
    data:
      nodes:
        - id: device-demand
          label: Device demand
          value: 133,731 glasses in 2025
          detail: Reported unit volume; sell-through and return rates are not disclosed.
        - id: channel-capture
          label: Channel capture
          value: Over 70% of revenue overseas
          detail: Net channel fees, discounts, duties, and customer concentration are unavailable.
        - id: revenue
          label: Revenue
          value: RMB 516m in 2025
          detail: Predominantly AR glasses and accessories; no ARR is reported.
        - id: gross-profit
          label: Gross profit
          value: 35.2% gross margin
          detail: Improved from 18.8% in 2023; SKU and channel contribution margins are private.
        - id: adjusted-result
          label: Adjusted result
          value: RMB 250m adjusted net loss
          detail: Accounting loss is not a cash-burn measure.
        - id: liquidity
          label: Liquidity
          value: RMB 64m cash at FY2025 end
          detail: Pre-financing cash and cash equivalents; restrictions are not disclosed.
        - id: external-capital
          label: External capital
          value: $100m financing reported in January 2026
          detail: Funding raised is not current cash; IPO completion and post-close runway remain unverified.
    approximationNotes: >-
      The ordered flow is conceptual and does not calculate conversion rates, free cash flow, or runway from unlike
      units.
    claimRefs:
      - CI003
      - CI005
      - CI007
      - CI008
      - CI014
      - CI015
      - CI016
  - id: FE001
    title: XREAL product architecture stack
    type: stack
    summary: >-
      The product family keeps the head-worn layer light by distributing sensing, spatial processing, host compute, and
      platform services across several dependent layers.
    data:
      layers:
        - label: Experience layer
          detail: Portable displays, gaming, productivity windows, and spatial applications
          items:
            - One-series large virtual screen
            - Aura multi-window Android XR experience
        - label: Wearable layer
          detail: Optics, displays, audio, cameras, sensors, and fit
          items:
            - Optical display and audio
            - Cameras, sensors, and mechanical fit
        - label: Spatial processing layer
          detail: In-glasses silicon and firmware support anchoring and environment understanding
          items:
            - X1 or X1S spatial processing
            - 3DoF or 6DoF sensing
        - label: Compute and connectivity layer
          detail: External hosts or dedicated puck provide heavier compute, power, and input
          items:
            - USB-C phone, PC, console, or handheld
            - Snapdragon XR2+ Gen 2 compute puck
        - label: Developer toolchain layer
          detail: Unity abstractions and XREAL spatial APIs expose device capabilities
          items:
            - XREAL SDK, XRI, and AR Foundation
            - Tracking, meshes, anchors, and hand interaction
        - label: Platform ecosystem layer
          detail: Android XR and Google services supply applications and platform capabilities
          items:
            - Android XR platform and developer support
            - Google Play and Gemini
    approximationNotes: >-
      Conceptual dependency stack based on public product and SDK descriptions; component boundaries are not a physical
      teardown.
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE008
      - CE011
      - CE012
