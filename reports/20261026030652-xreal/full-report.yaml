              - CO009
              - CO010
              - CO011
              - CO012
      - number: '1.4'
        title: Milestones and strategic dependencies
        blocks:
          - type: paragraph
            body: >-
              XREAL's public arc runs from a 2017 founding and 2019 commercial product launch through the 2023
              Nreal-to-XREAL rebrand, a Google relationship around Project Aura, the January 2026 financing, and the
              April listing application. In October 2026 the company launched the XREAL 1 Pro+ at $599, initially
              through its own website. Google distribution and platform alignment create strategic validation, but they
              also concentrate ecosystem dependence outside XREAL's control. Independent reviews reinforce that the
              current value proposition remains display-centric and externally powered or computed, with fit, warmth,
              optical bulk, and all-day-use constraints. These limitations do not negate product utility, but they
              narrow the leap from wearable display vendor to general-purpose spatial-computing platform.
