  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risk and trigger
    rows:
      - - Bull
        - >-
          AR-glasses category expands; One/flagship products grow; services become a larger mix; IPO or strategic
          liquidity clears
        - >-
          Upside could justify a premium to the reported $1B mark, but no defensible target return can be calculated
          without dilution and offer terms
        - Category adoption or platform competition fails to convert into XREAL volume growth
      - - Base
        - >-
          Hardware remains the main revenue source; gross margin stays improved but unit volume grows slowly; financing
          remains necessary
        - Track around the reported private mark only if cash runway and cap-table terms are acceptable
        - Operating cash outflow persists or listing terms transfer value to later investors
      - - Bear
        - Unit volume stagnates, larger platforms compress share, and working capital consumes cash
        - Downside to the reported private mark is plausible; no lower bound is supportable from retained evidence
        - Failed IPO, inventory build, margin reversal, or adverse litigation outcome
    notes: >-
      These are conditional underwriting scenarios, not forecasts or probability-weighted valuations; public evidence
      does not support numerical probabilities or a target price.
    claimRefs:
      - CV007
      - CV009
      - CV010
      - CV012
      - CV014
      - CV015
      - CV019
