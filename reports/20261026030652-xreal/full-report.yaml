    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, business model, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              XREAL is a Beijing-based AR-glasses maker founded in 2017. Its disclosed model combines designing,
              developing, manufacturing, and selling own-brand glasses with related accessories and enterprise
              technical-development services. That makes the company principally a consumer-hardware vendor, not a
              recurring-software business, even though technical services add a second revenue stream. The latest public
              operating snapshot says its sales network covered 40 countries and regions at year-end 2025 and that more
              than 70% of 2025 revenue came from overseas. Customer count and employee headcount remain undisclosed in
              the assigned evidence and are therefore treated as diligence gaps rather than estimated scale metrics.
