      - number: '1.3'
        title: Funding, listing status, and financial signal
        blocks:
          - type: paragraph
            body: >-
              XREAL completed a reported $100 million Series D in January 2026 at a reported $1 billion valuation; Road
              to VR separately cited Crunchbase for $433 million of total outside funding since 2017. The company then
              submitted a Main Board listing application to the Hong Kong Stock Exchange on April 1, with CICC and Citi
              named as joint sponsors. The filing-derived operating record is mixed: 2025 revenue was RMB 516 million
              and annual loss was RMB 456 million, while 36Kr reported year-end cash of RMB 63.63 million and RMB 203
              million of 2025 operating cash outflow. Funding raised is not cash available, and annual loss is not cash
              burn; runway, debt, secondaries, and preference terms remain unavailable.
            claimRefs:
