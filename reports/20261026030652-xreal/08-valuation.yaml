    title: Track, not buy
    body: "XREAL has enough category and product proof to merit continued diligence, but not enough public financing, cash-flow, or security-term evidence to support a buy recommendation at the reported private valuation."
    claimRefs: [CV007, CV009, CV011, CV020]
  - calloutType: risk
    title: Liquidity is the gating question
    body: "The reported cash balance and operating cash outflow make runway and financing terms more decision-relevant than a headline market-share ranking."
    claimRefs: [CV010, CV015]
