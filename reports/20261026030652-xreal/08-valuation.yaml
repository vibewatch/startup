company:
  name: XREAL
chapter:
  number: 8
  title: Valuation
  summary: XREAL has credible category position and improving gross margin, but public evidence still describes a hardware-led business with modest scale, negative 2025 operating cash flow, and a financing-dependent path to liquidity. The appropriate stance is track/research-more rather than buy until the HKEX process, cash runway, preference stack, and repeat-demand economics are verified.
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: >-
      The investable thesis is that XREAL has built a recognizable consumer AR-glasses position before larger platform companies fully mature the category. Its official company profile says it sells through more than 40 countries and regions and held the number-one global AR-glasses sales-revenue position for 2022–2025; an independent market article likewise reports 27.0% 2025 global AR-glasses revenue share and 24.8% volume share. Ecosystem signals support optionality because current reporting identifies Google and ASUS ROG as strategic hardware partners. The anti-thesis is stronger at the current evidence quality: 2025 revenue was RMB516 million, annual AR-glasses volume remained near 130,000 units, and 2025 operating cash flow was negative. The valuation therefore depends on category expansion and execution that are not yet proven by recurring software revenue, retention, or audited public-company disclosures.
    claimRefs: [CV002, CV003, CV006, CV011, CV014, CV018]
    tableRefs: [TV001, TV002]
  - id: price-sensitive-call
    title: Price sensitivity and financing context
    body: >-
      The financing record supports a headline value but not a fully underwritten entry price. PYMNTS, citing a Bloomberg Television interview with CEO Chi Xu, reports that XREAL raised $100 million in January 2026 and was valued at more than $1 billion. Baidu Baike separately reports a $67.76 million Series D at an $833 million post-money valuation. IPO-focused accounts report approximately RMB64 million of cash at end-2025 and RMB203 million of 2025 operating cash outflow. These figures are not interchangeable: the reported round size and valuation references conflict, and the public evidence does not establish whether the greater-than-$1 billion figure is post-money, a financing mark, or an IPO expectation. The available record also does not disclose dilution, liquidation preferences, debt terms, or an offer price. Without those terms, a precise equity-value recommendation would be false precision. The decision should be conditional on primary prospectus review, cash runway, cap table, and the price paid for the relevant security.
    claimRefs: [CV007, CV009, CV010, CV015, CV019]
  - id: scenarios-and-comparables
    title: Scenarios and comparable signals
    body: >-
      A scenario framework is more defensible than a single multiple because the business is still concentrated in hardware. The 2025 revenue mix reported from the prospectus was 78.1% AR glasses, 14.1% accessories, and 7.8% services and other. That mix can support a bull case if higher-priced products expand the category and services become a second growth curve, but it also creates downside exposure to inventory, component, and channel risk. The comparable evidence is directional rather than a peer-set valuation: CompaniesMarketCap reports Vuzix at a $0.17 billion market capitalization on 25 October 2026, but Vuzix is a public competitor with different scale and financial profile. XREAL should not be marked to that figure mechanically. The more relevant conclusion is that public-market pricing for small AR hardware can be volatile, so a private $1 billion mark needs evidence of growth, liquidity, and governance premium to be credible.
    claimRefs: [CV012, CV013, CV014]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: decision-and-diligence
    title: Recommendation and diligence gates
    body: >-
      The recommendation is track, with research-more as the immediate diligence action, not buy. The positive case has real support: market share, current ecosystem relationships, and a reported gross-margin improvement to 35.2% in 2025. The negative case is equally decision-relevant: revenue scale remains modest, 2025 cash generation was negative, unit volumes have been broadly stagnant, and the company is pursuing an IPO with limited public liquidity detail. XREAL also disclosed a US patent suit against Viture affiliates; because the announcement is company-issued, it establishes the existence of the claim, not the merits or expected financial outcome. Before increasing conviction, obtain the filed prospectus, audited statements, cap table and preference schedule, use-of-proceeds and runway analysis, product-level gross margins, cohort/return data, channel concentration, and status of the litigation. Thesis-break triggers are a failed listing without alternative liquidity, cash falling below a documented operating runway, continued flat unit volume despite category growth, or evidence that the gross-margin improvement is offset by inventory and customer-acquisition costs.
    claimRefs: [CV010, CV011, CV014, CV015, CV016, CV018, CV019, CV020]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Evidence-based view, Decision implication]
    rows:
      - [Recommendation, "Track; research-more before committing capital", "Do not underwrite a buy without primary financing and cash evidence"]
      - [Confidence, "Medium-low: several public figures are reported from prospectus coverage rather than a retained filing", "Treat valuation inputs as provisional"]
      - [Risk rating, "High", "Hardware concentration, negative operating cash flow, listing execution, and legal uncertainty require monitoring"]
      - [Valuation stance, "Unknown to fair at most; not supportable as attractive", "Require security terms, dilution, and offer-price evidence"]
    notes: "Public sources mix company claims, reported prospectus figures, and market-data snapshots; valuation and cash figures are not normalized across issuers."
    claimRefs: [CV007, CV009, CV010, CV013, CV014, CV015, CV016, CV020]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Category leadership", "Reported 27.0% 2025 global AR-glasses revenue share and official four-year number-one claim", "Independent audited market-share methodology or sustained share with volume growth"]
      - ["Margin inflection", "Reported gross margin rose from 18.8% to 35.2% between 2023 and 2025", "Product-level gross margin and warranty/returns data"]
      - ["Liquidity concern", "Reported RMB64 million cash and RMB203 million 2025 operating cash outflow", "Audited cash-flow statement, runway, and financing terms"]
      - ["Scale ceiling", "Reported annual unit volume stayed around 130,000 for three years", "Repeatable unit growth and evidence of non-hardware recurring revenue"]
    notes: "The table separates positive operating signals from the evidence that would falsify or strengthen each interpretation; no claim assumes that reported market share equals economic moat."
    claimRefs: [CV002, CV003, CV010, CV013, CV014, CV015, CV018]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risk and trigger]
    rows:
      - [Bull, "AR-glasses category expands; One/flagship products grow; services become a larger mix; IPO or strategic liquidity clears", "Upside could justify a premium to the reported $1B mark, but no defensible target return can be calculated without dilution and offer terms", "Category adoption or platform competition fails to convert into XREAL volume growth"]
      - [Base, "Hardware remains the main revenue source; gross margin stays improved but unit volume grows slowly; financing remains necessary", "Track around the reported private mark only if cash runway and cap-table terms are acceptable", "Operating cash outflow persists or listing terms transfer value to later investors"]
      - [Bear, "Unit volume stagnates, larger platforms compress share, and working capital consumes cash", "Downside to the reported private mark is plausible; no lower bound is supportable from retained evidence", "Failed IPO, inventory build, margin reversal, or adverse litigation outcome"]
    notes: "These are conditional underwriting scenarios, not forecasts or probability-weighted valuations; public evidence does not support numerical probabilities or a target price."
    claimRefs: [CV007, CV009, CV010, CV012, CV014, CV015, CV019]
