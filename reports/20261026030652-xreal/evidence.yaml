evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board roster, independent-director biographies, founder ownership, voting control, delegated authority,
      and succession planning
    whyItMatters: The public record cannot establish governance quality or quantify founder and CEO key-person dependence.
    diligencePath: >-
      Request the board pack, constitutional documents, cap table, voting agreements, delegation matrix, and succession
      plan.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: >-
      Full cap table, security classes, liquidation preferences, secondaries, debt or credit facilities, and January
      2026 financing proceeds
    whyItMatters: Headline funding and valuation do not determine dilution, preference overhang, cash available, or runway.
    diligencePath: Request signed financing documents, debt schedules, bank statements, and a fully diluted cap table.
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: operating-scale
    missingEvidence: Current customer count, active-user definition, employee headcount, channel concentration, and customer retention
    whyItMatters: >-
      Revenue and geographic reach cannot establish the breadth, durability, or organizational capacity of the operating
      base.
    diligencePath: >-
      Obtain customer and channel cohorts, payroll records, organization charts, sell-through data, return rates, and
      retention schedules.
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A reconciled optical-AR and smart-glasses market model with explicit unit, geography, channel, and revenue
      definitions.
    whyItMatters: >-
      Published market totals differ by multiples and cannot support a single valuation denominator without a scope
      bridge.
    diligencePath: >-
      Obtain dated analyst workbooks or commission a bottom-up model separating display AR glasses, audio glasses,
      headsets, software, and enterprise services.
    relatedQuestionRefs:
      - QM002
      - QM008
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: adoption-economics
    missingEvidence: XREAL sell-through, returns, repeat purchase, gross margin, attach rates, and channel-level cohort data.
    whyItMatters: Shipment share and reservations show reach but not durable demand or contribution margin.
    diligencePath: >-
      Request monthly cohorts by product and channel, including units shipped versus sold-through, returns, support
      burden, gross margin, and repeat-purchase behavior.
    relatedQuestionRefs:
      - QM005
      - QM009
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: shipment-share
    missingEvidence: The IDC methodology, period, denominator, and geography underlying the reported 36% XREAL market share.
    whyItMatters: A percentage without its market definition cannot be compared with the broad AR or smart-glasses forecasts.
    diligencePath: Obtain the underlying IDC release or licensed table and reconcile units, geography, and product class.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: customer-switching
    missingEvidence: Cohort retention, repeat purchase, returns, and multi-homing data by product and channel.
    whyItMatters: >-
      The public record shows product capability and market position but not whether buyers remain loyal or shift
      between XREAL, VITURE, Meta, and the status quo.
    diligencePath: Request channel-level cohort, return, warranty, and accessory-attach data for the last eight quarters.
    relatedQuestionRefs:
      - QP007
  - type: missing-source
    severity: material
    topic: distribution
    missingEvidence: Comparable sell-through, channel economics, and retail availability across XREAL, VITURE, Meta, and other peers.
    whyItMatters: A broad catalog and platform partnership do not prove durable distribution or lower customer-acquisition cost.
    diligencePath: Obtain retailer sell-through, direct-versus-distributor mix, channel margins, and partner contract terms.
    relatedQuestionRefs:
      - QP006
      - QP007
  - type: conflicting-data
    severity: material
    topic: market-share
    missingEvidence: >-
      A consistent independent methodology reconciling revenue share, unit share, and category definitions for AR versus
      AI glasses.
    whyItMatters: XREAL can rank first in a narrow AR-glasses measure while facing stronger unit or adjacent-category competition.
    diligencePath: Commission a current third-party market dataset with explicit category, geography, unit, and revenue definitions.
    relatedQuestionRefs:
      - QP002
      - QP008
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: >-
      CAC, contribution margin, sales-cycle length, channel fees, return rates, and cohort payback by product and
      geography.
    whyItMatters: >-
      List prices and revenue growth cannot establish whether customer acquisition and channel expansion create durable
      contribution profit.
    diligencePath: Request monthly cohort economics by SKU, channel, and country, reconciled to net revenue and gross profit.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Post-financing cash, monthly operating and investing cash flow, inventory commitments, working-capital cycle,
      debt, covenants, and minimum-cash policy.
    whyItMatters: >-
      Accounting losses, year-end cash, and financing headlines do not establish cash burn, current liquidity, or runway
      under delayed-IPO scenarios.
    diligencePath: >-
      Obtain bank statements, financing close documents, debt schedules, inventory aging, supplier terms, and a
      board-approved 24-month cash plan.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: trust-and-reliability
    missingEvidence: >-
      Product-level return rates, warranty claims, failure modes, support-ticket burden, battery degradation, thermal
      tests, and sustained-comfort results.
    whyItMatters: >-
      Public specifications and demonstrations cannot establish production quality, ownership cost, or deployment
      reliability.
    diligencePath: >-
      Request anonymized monthly quality dashboards, return-reason cohorts, warranty reserves, reliability test
      protocols, and top support categories for each active SKU.
    relatedQuestionRefs:
      - QE003
      - QE006
      - QE008
    relatedTableRefs:
      - TE001
      - TE002
      - TE003
  - type: missing-source
    severity: material
    topic: security-and-privacy
    missingEvidence: >-
      Security certifications, privacy assessments, sensor-data flows, retention rules, vulnerability disclosure,
      secure-update policy, and incident records.
    whyItMatters: >-
      Aura's cameras, tracking, Gemini integration, and Google services increase the trust and compliance surface for
      consumer and enterprise use.
    diligencePath: >-
      Obtain the security architecture, data-flow diagrams, privacy impact assessment, penetration-test summary, SBOM
      process, update commitment, and certification register.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: developer-adoption
    missingEvidence: >-
      Independent SDK download trends, active developers, repository history, application catalog, production
      deployments, and developer retention.
    whyItMatters: >-
      A standards-aligned SDK and partner roadmap do not by themselves prove ecosystem pull or defensible platform
      adoption.
    diligencePath: >-
      Request monthly SDK downloads and active keys, app submissions and approvals, developer cohorts, release notes,
      issue-resolution metrics, and named production references.
    relatedQuestionRefs:
      - QE004
      - QE005
    relatedTableRefs:
      - TE001
      - TE002
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      Product- and channel-level cohorts showing active use, repeat purchase, churn, renewal, returns, warranty claims,
      and support burden.
    whyItMatters: Shipment and review evidence cannot distinguish durable customer value from one-time hardware purchases.
    diligencePath: >-
      Request monthly cohorts by SKU, channel, geography, purchase date, return status, active-use status, and
      repeat-order status.
    relatedQuestionRefs:
      - QU004
      - QU008
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof
    missingEvidence: >-
      A complete schedule separating named paying customers, production deployments, pilots, ecosystem partners,
      retailers, and component suppliers.
    whyItMatters: >-
      Public names can overstate commercial traction when a relationship is a demonstration, listing, or partnership
      rather than a paying deployment.
    diligencePath: >-
      Obtain customer and partner contracts, deployment counts, production status, revenue contribution, and renewal
      terms by counterparty.
    relatedQuestionRefs:
      - QU005
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: >-
      Channel sell-through, retailer inventory, geographic profit contribution, and top-customer or partner
      concentration percentages.
    whyItMatters: >-
      Direct and retail availability do not reveal whether demand is broad or dependent on a few channels or
      counterparties.
    diligencePath: Request quarterly sell-in and sell-through by retailer, direct channel, geography, and top ten counterparties.
    relatedQuestionRefs:
      - QU002
      - QU005
      - QU006
  - type: conflicting-data
    severity: material
    topic: installed-base reconciliation
    missingEvidence: >-
      An audited bridge from historical cumulative product sales to annual shipments, returns, replacements, and active
      installed devices.
    whyItMatters: >-
      Cumulative-unit claims and annual shipment series use different denominators and cannot establish current active
      customers.
    diligencePath: Reconcile shipped, sold-through, returned, replaced, and active devices by year and product line.
    relatedQuestionRefs:
      - QU003
      - QU004
      - QU009
  - type: private-evidence-only
    severity: blocking
    topic: financial-model
    missingEvidence: Audited product-level margin, working-capital, cash-burn, cash-runway, inventory, and warranty-reserve evidence.
    whyItMatters: >-
      The retained market analysis identifies scale and loss pressure but cannot quantify XREAL's liquidity or operating
      leverage.
    diligencePath: >-
      Request monthly management accounts, cash forecast, SKU margin bridge, inventory aging, warranty reserve, and
      downside runway case.
    relatedQuestionRefs:
      - QR006
  - type: enumeration-incomplete
    severity: material
    topic: legal-status
    missingEvidence: >-
      Company-specific AI classification, privacy assessments, licenses, IP schedule, litigation, enforcement, and
      post-2026 China policy exposure.
    whyItMatters: >-
      General policy sources define potential obligations but do not establish XREAL's compliance status or complete
      legal risk inventory.
    diligencePath: >-
      Obtain counsel memoranda, DPIAs, data-flow maps, license register, IP and litigation schedules, and regulator
      correspondence by jurisdiction.
    relatedQuestionRefs:
      - QR001
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: >-
      Production runtime distribution, thermal limits, compatibility matrix, return rates, support tickets, and firmware
      incident history.
    whyItMatters: Review evidence identifies concrete friction but does not establish company-wide rates or financial impact.
    diligencePath: Request anonymized cohorts by model, host device, geography, firmware version, and session duration.
    relatedQuestionRefs:
      - QR003
      - QR004
      - QR007
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: platform-dependency
    missingEvidence: >-
      Counterparty concentration, Android XR and Gemini terms, channel sell-through, accessory supply continuity, and
      portability rights.
    whyItMatters: >-
      Architecture and founder comments establish dependency mechanisms, but the retained record cannot quantify
      concentration or switching cost.
    diligencePath: >-
      Review contracts, service commitments, termination rights, fallback modes, channel reports, and supplier
      business-continuity plans.
    relatedQuestionRefs:
      - QR005
      - QR007
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: Filed prospectus, audited statements, cap table, preference schedule, debt terms, and IPO offer-price mechanics.
    whyItMatters: >-
      The reported $833 million and $1 billion valuation figures may refer to different instruments or transaction
      points, so entry price and dilution cannot be underwritten.
    diligencePath: >-
      Obtain the HKEX filing and investor materials, reconcile each financing round, and model proceeds, dilution,
      preferences, and exit waterfalls.
    relatedQuestionRefs:
      - QV002
      - QV007
  - type: missing-source
    severity: material
    topic: liquidity
    missingEvidence: Audited cash-flow bridge, working-capital schedule, inventory aging, and runway under IPO-delay scenarios.
    whyItMatters: >-
      Reported cash and negative operating cash flow suggest financing dependence, but the retained articles do not
      provide a complete liquidity model.
    diligencePath: >-
      Request the latest management accounts and build a monthly runway model with inventory, payables, returns, and
      planned IPO proceeds.
    relatedQuestionRefs:
      - QV006
      - QV008
  - type: missing-source
    severity: material
    topic: recurring-revenue
    missingEvidence: Product-level gross margin, return rates, repeat purchase, cohort retention, and service/software revenue detail.
    whyItMatters: >-
      A hardware-heavy mix makes category share insufficient evidence of durable cash generation or a recurring-revenue
      multiple.
    diligencePath: >-
      Obtain SKU/channel cohorts and contribution-margin data, separating glasses, accessories, services, warranty, and
      customer-acquisition costs.
    relatedQuestionRefs:
      - QV003
      - QV004
