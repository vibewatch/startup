      - [Android XR and application ecosystem, "Provide operating system, Play Store applications, Gemini, and platform services", "Google roadmap, Android XR maturity, developer tooling, and partner policies", "Platform timing, policy control, privacy obligations, and strategic dependence on Google"]
    notes: "Architecture is reconstructed only from assigned official documentation and independent product reporting; it is not a teardown, security audit, or bill-of-materials analysis."
    claimRefs: [CE004, CE006, CE007, CE009, CE010, CE015, CE016]
