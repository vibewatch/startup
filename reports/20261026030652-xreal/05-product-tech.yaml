      - [In-glasses spatial silicon, "Anchor and transform displayed content with low head-worn compute", "X1 or X1S silicon, sensors, firmware, and thermal envelope", "Proprietary-chip roadmap, firmware quality, and limited independent benchmarks"]
      - [Host or compute puck, "Supply application compute, battery, connectivity, and input", "Phone, PC, console, Beam-like device, or Snapdragon XR2+ Gen 2 puck", "Cable reliability, battery life, thermal load, compatibility, and component availability"]
