chapter:
  number: 5
  title: Product & Technology
  summary: >-
    XREAL now spans shipping wearable displays, developer-oriented spatial glasses, and
    the pre-release Aura Android XR system, with split compute and proprietary in-glasses
    silicon used to keep the headset light. The product direction is credible and externally
    visible, but reliability, security, privacy, returns, and production-scale developer
    adoption remain materially under-disclosed.
sections:
  - id: product-lines-and-workflows
    title: Product lines map to two distinct customer jobs
    body: >-
      XREAL's shipping One family is principally a wearable-display product: the glasses
      turn a phone, computer, console, or handheld into a large virtual screen for media,
      gaming, and productivity. The October 2026 XREAL 1 Pro+ release kept the X1 chip,
      native 3DoF anchoring, and 57-degree field of view while adding brighter display
      output, AI HDR, faster 2D-to-3D conversion, and fit changes. Aura is a different
      proposition. Independent hands-on coverage describes optical-see-through 2K displays,
      a 70-degree field of view, cameras, hand tracking, and an external compute puck,
      shifting the workflow from screen extension toward multi-app Android XR spatial
      computing. Air 2 Ultra remains the clearest public developer device, with dual
      environment sensors and 6DoF features. These surfaces form a coherent ladder, but
      Aura's shipment timing and production behavior were not independently confirmed by
      the reviewed evidence.
    claimRefs: [CE001, CE002, CE003, CE008, CE015]
    tableRefs: [TE001, TE002]
  - id: architecture-and-developer-surface
    title: Split compute reduces head-worn burden but adds dependency layers
    body: >-
      The architecture separates display and sensing from heavier compute. Public reporting
      describes Aura's X1S chip in the glasses and Snapdragon XR2+ Gen 2 in a separate puck,
      while the established wearable-display workflow can depend on a USB-C host or Beam-like
      companion. At the software layer, XREAL's SDK has moved from proprietary NRSDK-style
      APIs toward Unity's XR Plugin, XR Interaction Toolkit, and AR Foundation. The official
      documentation exposes motion tracking, plane detection, image anchoring, hand tracking,
      depth mesh, spatial anchors, and rendering optimization. That standards alignment may
      lower porting friction, but the public developer proof is still thin: one company-linked
      troubleshooting template documents a current Unity and SDK setup, while no independent
      package-download, contributor, application-catalog, or production-usage series was found
      in the assigned evidence.
    claimRefs: [CE004, CE006, CE007, CE009, CE010, CE011]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-roadmap-and-differentiation
    title: Differentiation is moving from optics toward platform leverage
    body: >-
      The near-term differentiation case combines lightweight optical engineering,
      proprietary spatial silicon, broad host compatibility, and a Google-aligned Android XR
      roadmap. Two independent reports describe a multiyear Google partnership that makes
      XREAL a lead Android XR hardware partner and extends work to optical-see-through and
      wired XR devices. The strongest product-specific external evidence is hands-on rather
      than longitudinal: TechRadar found the Aura form factor comfortable and functional in
      a demo, while a low-reputation Sohu comparison reported favorable latency, field-of-view,
      and runtime results for 1 Pro+ without publishing reproducible raw data. Management's
      stated 2027-2028 mass-adoption horizon also depends on improvements in multimodal AI,
      supply chains, and agent ecosystems. The resulting moat is therefore partly execution
      and ecosystem access, not yet a demonstrated durability advantage.
    claimRefs: [CE003, CE005, CE012, CE013, CE014]
  - id: reliability-trust-and-diligence
    title: Public specifications outpace public assurance evidence
    body: >-
      XREAL discloses detailed display, tracking, and interaction capabilities, but the
      assigned official SDK and developer pages do not disclose security certifications,
      privacy-control architecture, vulnerability-management practices, service-level
      objectives, incident history, or field reliability. This is especially important for
      Aura because cameras, hand and eye tracking, Gemini integration, Google Play access,
      and a compute puck expand the data and dependency surface. Split compute also creates
      cable, host-compatibility, thermal, battery, and platform-release dependencies even as
      it improves comfort. Diligence should therefore treat product specifications as
      feature evidence rather than proof of production quality. Release-level return rates,
      warranty claims, support-ticket burden, device failure rates, privacy assessments, and
      secure-update commitments are required before underwriting enterprise readiness or a
      durable technical moat.
    claimRefs: [CE004, CE007, CE010, CE015, CE016]
