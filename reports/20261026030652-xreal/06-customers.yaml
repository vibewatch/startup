company:
  name: XREAL
chapter:
  number: 6
  title: Customers
  summary: XREAL has verifiable consumer distribution, product-use evidence, and named ecosystem relationships, but annual AR-glasses volume remained near 130,000 units from 2023 through 2025. Public evidence is materially weaker on active users, repeat purchase, retention, returns, sell-through, and counterparty concentration.
sections:
  - id: customer-segments-and-buying-motion
    title: Customer segments and buying motion
    body: >-
      XREAL's disclosed customer surface is primarily consumer hardware rather than a
      named enterprise-account base. Its glasses address entertainment, gaming,
      productivity, travel viewing, and emerging spatial-computing use cases. The
      buyer, user, and payer are generally the same individual, while phones, laptops,
      consoles, or external compute devices provide content and processing. The 2025
      channel mix reported by Baidu Baike was 70.8% direct sales and 29.2% distribution;
      the same source reported that 71% of revenue came from outside mainland China,
      led by the United States, Japan, and Europe. Those figures indicate a globally
      distributed consumer motion, but they do not disclose active users, channel
      sell-through, retailer inventory, or the share of repeat buyers.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-product-usage
    title: Adoption trajectory and product usage
    body: >-
      The strongest adoption evidence is unit shipment history rather than a customer
      cohort. Multiple current sources report annual AR-glasses volume of about 137,200
      units in 2023, 124,900 in 2024, and 133,700 in 2025, leaving total volume broadly
      flat across the period. Within that stable total, the mix changed sharply: the
      One series reached roughly 111,000 units in 2025 while Air fell to roughly 17,000,
      suggesting premium-product substitution rather than broad unit expansion.
      Mashable separately reported about 10,000 One Pro pre-orders fulfilled before
      repeated sell-outs, while a hands-on 1S review described more than two hours of
      comfortable viewing. These observations support real launch demand and usable
      consumer workflows, but not retention, repeat purchase, or durable engagement.
    claimRefs: [CU005, CU006, CU007, CU008, CU016]
    tableRefs: [TU002]
  - id: named-proof-and-expansion-risk
    title: Named proof, expansion, and concentration
    body: >-
      Named relationships widen XREAL's route to market but should not be mistaken for
      a customer roster. Google and XREAL publicly positioned Project Aura as Android
      XR eyewear, and TechRadar's hands-on account described the glasses working with
      an external compute puck. Amazon and Best Buy provide production retail
      availability, while the 1 Pro+ launched first through XREAL.com at $599 with
      additional retail stores to follow. These are concrete platform and distribution
      signals, yet none discloses paid deployment volume, partner-sourced revenue,
      retailer sell-through, or top-counterparty exposure. The evidence therefore
      supports channel breadth and an upgrade path, not demonstrated land-and-expand
      economics or low concentration.
    claimRefs: [CU007, CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
    figureRefs: [FU001]
  - id: durability-and-diligence
    title: Durability and diligence implications
    body: >-
      Customer durability remains the chapter's central unresolved issue. The assigned
      evidence provides no NRR, GRR, churn, renewal, repeat-purchase, return-rate,
      warranty, support-ticket, or product-level active-use series. It also does not
      reconcile cumulative-unit claims to a current installed base. Category evidence
      adds caution: CNBC cited Omdia's view that display-equipped AI glasses would
      represent only 10% of projected 2026 global smart-glasses sales, while current
      XREAL reporting describes approximately flat annual AR-glasses volume. Diligence
      should therefore prioritize cohort and channel records over additional logos.
      Until XREAL supplies sell-in versus sell-through, returns, support burden,
      upgrade behavior, and top-account or partner concentration, the customer thesis
      is best characterized as credible product adoption with unproven durability.
    claimRefs: [CU005, CU013, CU014, CU015]
