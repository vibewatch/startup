  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: "Product- and channel-level cohorts showing active use, repeat purchase, churn, renewal, returns, warranty claims, and support burden."
      whyItMatters: "Shipment and review evidence cannot distinguish durable customer value from one-time hardware purchases."
      diligencePath: "Request monthly cohorts by SKU, channel, geography, purchase date, return status, active-use status, and repeat-order status."
      relatedQuestionRefs: [QU004, QU008]
    - type: enumeration-incomplete
      severity: material
      topic: named customer proof
      missingEvidence: "A complete schedule separating named paying customers, production deployments, pilots, ecosystem partners, retailers, and component suppliers."
      whyItMatters: "Public names can overstate commercial traction when a relationship is a demonstration, listing, or partnership rather than a paying deployment."
      diligencePath: "Obtain customer and partner contracts, deployment counts, production status, revenue contribution, and renewal terms by counterparty."
      relatedQuestionRefs: [QU005]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: "Channel sell-through, retailer inventory, geographic profit contribution, and top-customer or partner concentration percentages."
      whyItMatters: "Direct and retail availability do not reveal whether demand is broad or dependent on a few channels or counterparties."
      diligencePath: "Request quarterly sell-in and sell-through by retailer, direct channel, geography, and top ten counterparties."
      relatedQuestionRefs: [QU002, QU005, QU006]
    - type: conflicting-data
      severity: material
      topic: installed-base reconciliation
      missingEvidence: "An audited bridge from historical cumulative product sales to annual shipments, returns, replacements, and active installed devices."
      whyItMatters: "Cumulative-unit claims and annual shipment series use different denominators and cannot establish current active customers."
      diligencePath: "Reconcile shipped, sold-through, returned, replaced, and active devices by year and product line."
      relatedQuestionRefs: [QU003, QU004, QU009]
