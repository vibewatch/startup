figures:
  - id: FU001
    title: Observable customer journey and expansion surfaces
    type: journey-map
    summary: The public journey runs from review or retail discovery to device-based use and product upgrades, but no source quantifies conversion or retention.
    data:
      nodes:
        - id: discovery
          label: Review or partner discovery
          detail: Independent reviews, Google Android XR exposure, and product launches create awareness.
          touchpoints: [TechRadar, CNBC, Google ecosystem]
        - id: selection
          label: Use-case and price selection
          detail: Buyers choose among entertainment, gaming, productivity, and spatial-computing propositions.
          touchpoints: [XREAL 1S, One series, 1 Pro+, Aura]
        - id: purchase
          label: Direct or retail purchase
          detail: XREAL.com, Amazon, Best Buy, and distributors provide purchase routes.
          touchpoints: [Direct store, Marketplace, Electronics retail]
        - id: setup
          label: Connected-device setup
          detail: Phones, laptops, consoles, or external compute devices supply content and processing.
          touchpoints: [USB-C, Compute puck, Beam-class accessory]
        - id: recurring-use
          label: Recurring use
          detail: Entertainment, gaming, travel, and productivity are visible use cases, but usage frequency is undisclosed.
          touchpoints: [Viewing, Gaming, Work]
        - id: expansion
          label: Upgrade or ecosystem expansion
          detail: Premium glasses, accessories, and Android XR create possible expansion paths without disclosed conversion rates.
          touchpoints: [One series, Accessories, Aura]
    claimRefs: [CU002, CU007, CU009, CU011, CU015]
    approximationNotes: "This is a qualitative sequence of observable surfaces, not a measured funnel; no conversion, retention, or expansion rates are available."
callouts:
  - calloutType: strength
    title: Distribution and use cases are tangible
    body: XREAL combines direct sales, third-party retail, and a product ladder spanning entertainment, gaming, productivity, and emerging Android XR use.
    claimRefs: [CU001, CU003, CU007, CU009]
  - calloutType: risk
    title: Unit visibility is not retention proof
    body: Approximately flat annual AR-glasses volume and the absence of cohort metrics prevent a conclusion that launch demand is converting into durable expansion.
    claimRefs: [CU005, CU013, CU015]
