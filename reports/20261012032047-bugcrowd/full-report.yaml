    summary: >-
      Progression of enterprise customers from initial vulnerability disclosure to continuous penetration testing and
      red-teaming.
    data:
      items:
        - label: 'Phase 1: VDP Ingestion'
          stage: 'Phase 1: Initial Ingestion & VDP'
          actor: Enterprise Security Team
          action: Deploy Vulnerability Disclosure Program
          touchpoints:
            - Public vulnerability disclosure policy
            - Bugcrowd intake portal and engineered triage
          outcome: Establish structured, safe vulnerability reporting without upfront bounty payouts
        - label: 'Phase 2: Private Bounty'
          stage: 'Phase 2: Private Bug Bounty'
          actor: Application Security Lead
          action: Launch Scoped Private Bounty
          touchpoints:
            - CrowdMatch invitation of vetted researchers
            - Severity-based reward pool allocation
          outcome: Surface critical zero-day vulnerabilities in high-value digital assets
        - label: 'Phase 3: Public Bounty'
          stage: 'Phase 3: Public Bounty Expansion'
          actor: CISO / Security Leadership
          action: Expand to Public Bug Bounty
          touchpoints:
            - Global hacker community access
            - Continuous asset monitoring
          outcome: Continuous external testing simulating real-world attacker pressure
        - label: 'Phase 4: PTaaS Testing'
          stage: 'Phase 4: Penetration Testing as a Service'
          actor: Compliance & Audit Team
          action: Integrate PTaaS Engagements
          touchpoints:
            - Time-bound compliance-focused testing
            - Real-time SDLC remediation workflow
          outcome: Replace 60% of costly annual third-party pen tests with agile on-demand testing
        - label: 'Phase 5: RTaaS Simulation'
          stage: 'Phase 5: Red Team as a Service (RTaaS)'
          actor: Enterprise SecOps Leadership
          action: Deploy Continuous Adversarial Simulation
          touchpoints:
            - Advanced TTP adversary simulation
            - Root-cause attack chain mapping
          outcome: Validate defense-in-depth security posture against sophisticated threats
        - label: 'Phase 6: Platform Consolidation'
          stage: 'Phase 6: Multi-Product Platform Expansion'
          actor: Executive Risk Committee
          action: Consolidate External Security Spend
          touchpoints:
            - Unified vulnerability knowledge graph
            - Platform-wide executive ROI reporting
          outcome: Achieve 268% three-year ROI and reduced cyber insurance premiums
