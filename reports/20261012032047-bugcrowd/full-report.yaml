            title: Valuation Multiple Tension vs Financial Disclosure Opacity
            body: >-
              Bugcrowd's $1.0B+ Series E valuation benchmark represents an aggressive valuation mark in the absence of
              audited ARR, gross margins, or net retention rates, leaving equity investors exposed to potential
              liquidation preference overhang if revenue growth lags category forecasts.
            calloutType: risk
            claimRefs:
