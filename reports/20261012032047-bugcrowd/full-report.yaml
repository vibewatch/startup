figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: Chronological trajectory of Bugcrowd corporate, financing, product, and operational milestones from 2012 to 2026.
    data:
      items:
        - label: Company Founded in Sydney
          date: 2012-09
          detail: >-
            Casey Ellis, Chris Raethke, and Sergei Belokamen establish Bugcrowd as a pioneer in crowdsourced bug
            bounties.
          tone: positive
        - label: Seed Funding Round
          date: 2013-09
          detail: Raises $1.6M seed funding led by Rally Ventures to expand vetting of ethical hackers.
          tone: positive
        - label: Series A Funding Round
          date: 2015-03
          detail: >-
            Secures $6M Series A led by Costanoa Ventures; expands managed bug bounty programs to enterprise customers
            like Western Union.
          tone: positive
        - label: Series B & C Expansion
          date: 2016-04
          detail: >-
            Raises $15M Series B led by Blackbird Ventures, followed by $26M Series C in 2018 led by Triangle Peak
            Partners.
          tone: positive
        - label: Series D Growth Round
          date: 2020-04
          detail: Secures $30M Series D led by Rally Ventures to scale PTaaS and attack surface management offerings globally.
          tone: positive
        - label: CVE Numbering Authority Authorization
          date: 2022-10
          detail: Authorized by the international CVE Program as a CVE Numbering Authority (CNA) to assign CVE IDs.
          tone: positive
        - label: Series E Growth Funding & Unicorn Mark
          date: 2024-02
          detail: Raises $102M Series E led by General Catalyst at a reported $1B+ valuation; Paul Sagan becomes Board Chair.
          tone: positive
        - label: AI Triage Bottlenecks & Platform Evolution
          date: 2026-07
          detail: >-
            Surge in AI-assisted vulnerability submissions strains bounty triage; Bugcrowd rolls out anti-spam checks
            and Savant Pathseeker AI testing.
          tone: warning
