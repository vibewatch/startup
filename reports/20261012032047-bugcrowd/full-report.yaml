      - number: '6.2'
        title: Adoption Trajectory and Quantified Customer ROI
        blocks:
          - type: paragraph
            body: >-
              Bugcrowd reports serving more than 1,200 customer accounts globally, reflecting widespread commercial
              adoption of crowdsourced vulnerability management and penetration testing as a service. Independent
              economic modeling conducted by Forrester Consulting on a composite enterprise customer generating $750
              million in annual revenue demonstrated a 268% three-year return on investment and a net present value of
              $1.43 million. Key quantified benefits driving enterprise procurement include $819,000 saved by avoiding
              two full-time SecOps hires through Bugcrowd's managed triage layer, $552,000 saved by replacing 60% of
              legacy consulting pen tests, and $528,000 in avoided breach costs.
            claimRefs:
