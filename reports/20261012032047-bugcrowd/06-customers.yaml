    title: "Economic Moat in Managed Triage"
    body: "The core driver of customer retention and ROI is Bugcrowd's managed triage layer. By filtering noise, deduplicating reports, and validating exploitability before escalating to internal customer teams, Bugcrowd eliminates the need for 2 full-time SecOps hires per enterprise composite."
    claimRefs:
      - "CU007"
      - "CU008"
  - calloutType: "risk"
