callouts:
  - calloutType: insight
    title: AI-Era Triage Economics and Platform Moat
    body: While Bugcrowd's CrowdMatch and proprietary triage services historically provided high signal-to-noise ratios, the 2026 proliferation of AI-assisted vulnerability discovery creates severe operational strain on triage economics, requiring continuous verification tooling to prevent queue degradation.
    claimRefs:
      - CO012
      - CO016
  - calloutType: risk
    title: Valuation Multiple Tension vs Financial Disclosure Opacity
    body: Bugcrowd's $1.0B+ Series E valuation benchmark represents an aggressive valuation mark in the absence of audited ARR, gross margins, or net retention rates, leaving equity investors exposed to potential liquidation preference overhang if revenue growth lags category forecasts.
    claimRefs:
      - CO005
      - CO014
