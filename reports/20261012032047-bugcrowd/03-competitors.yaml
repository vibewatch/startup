callouts:
  - calloutType: insight
    title: Duopoly Market Structure Shapes Enterprise Selection
    body: Gartner and G2 customer reviews confirm that Bugcrowd and HackerOne operate as the primary alternatives for large-scale enterprise bug bounties. Selection frequently hinges on total cost of ownership and support responsiveness rather than core platform capability, with Bugcrowd frequently cited as more cost-effective for comparable program scope.
    claimRefs:
      - CP004
      - CP005
  - calloutType: risk
    title: AI-Generated Submissions Challenge Triage Economics
    body: The proliferation of AI-assisted vulnerability discovery tools is inflating submission volumes with lower average signal quality, increasing triage labor overhead. Platforms that fail to automate semantic deduplication risk either burning customer security teams with noise or lengthening response times to legitimate researchers.
    claimRefs:
      - CP003
      - CP013
      - CP014
