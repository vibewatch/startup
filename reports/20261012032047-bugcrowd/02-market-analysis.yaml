callouts:
  - calloutType: insight
    title: Regulatory Mandates as Primary Catalysts for Public-Sector VDP Adoption
    body: >-
      CISA Binding Operational Directive 20-01 fundamentally shifted crowdsourced security from an optional Silicon
      Valley practice to a mandatory compliance baseline for federal civilian agencies. This regulatory tailwind drove a
      151% increase in government vulnerability submissions and a 58% increase in critical P1 rewards on Bugcrowd
      platform, demonstrating that compliance enforcement accelerates enterprise and public sector procurement faster
      than unmandated risk awareness.
    claimRefs:
      - CM005
      - CM007
  - calloutType: risk
    title: Triage Overhead and AI-Driven Submission Volume Risk Platform Margins
    body: >-
      Human validation and triage form the core operational bottleneck for bug bounty platforms. As researchers leverage
      generative AI and automated tooling to submit proof-of-concept reports at higher frequencies, platform triage
      operations absorb substantial validation costs. Without high signal-to-noise filtering and automated triage
      enhancements, rising report volume threatens gross margin efficiency.
    claimRefs:
      - CM011
