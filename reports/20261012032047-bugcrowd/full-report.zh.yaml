      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: AI 时代的分流经济性与平台护城河
            body: 虽然 Bugcrowd 的 CrowdMatch 和专有分流服务过去能带来较高信噪比，但 2026 年 AI 辅助漏洞发现的扩散给分流经济性带来严重运营压力，必须持续使用验证工具，防止队列质量下滑。
            calloutType: insight
            claimRefs:
              - CO012
              - CO016
          - type: callout
            title: 估值倍数与财务披露不透明的张力
            body: 在没有经审计 ARR、毛利率或净留存率的情况下，Bugcrowd $1.0B+ 的 E 轮估值基准显得激进；若收入增长落后于行业预测，股权投资人将暴露于潜在清算优先权悬置风险。
            calloutType: risk
            claimRefs:
              - CO005
