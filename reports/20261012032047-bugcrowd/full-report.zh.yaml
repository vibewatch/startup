      - number: '2.4'
        title: 监管要求、分流瓶颈与采用约束
        blocks:
          - type: paragraph
            body: >-
              市场加速主要由严格的监管要求和日益复杂的威胁推动，但结构性逆风仍在。政府部门采用率空前增长，Bugcrowd 平台上的漏洞提交同比增加 151%，关键 P1 漏洞赏金提高 58%。核心结构性驱动因素是 CISA
              约束性运营指令 20-01（BOD 20-01），它要求联邦民事机构发布正式漏洞披露政策并建立处理机制。零售（+34%）、企业服务（+20%）和计算机软件（+12%）参与度也有所扩大，以降低供应链和 API
              泄露风险。相反，采用约束集中在分流负担和信噪比。分流运营是漏洞赏金平台的首要运营瓶颈；低质量或 AI 生成报告激增，会推高验证成本，而一旦响应 SLA 拉长，还可能导致研究员倦怠。此外，Mandos
              等企业次级目录上的自动化数据采集显示出客户端渲染障碍，反映出公开报告仍不透明。
            claimRefs:
              - CM005
              - CM007
              - CM011
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 监管要求成为公共部门采用 VDP 的主要催化剂
            body: >-
              CISA 约束性运营指令 20-01 将众包安全从可选的硅谷实践，根本性地变成联邦民事机构必须遵守的合规基线。这一监管顺风推动政府漏洞提交量增加 151%，Bugcrowd 平台关键 P1 赏金增加
              58%，表明合规执行比非强制性的风险认知更快推动企业和公共部门采购。
            calloutType: insight
            claimRefs:
              - CM005
              - CM007
          - type: callout
            title: 分流负担和 AI 驱动的提交量威胁平台利润率
            body: 人工验证和分流是漏洞赏金平台的核心运营瓶颈。研究员借助生成式 AI 和自动化工具，以更高频率提交概念验证报告，平台分流运营因此承担了大量验证成本。若缺少高信噪筛选和自动化分流增强，报告量上升将威胁毛利率效率。
            calloutType: risk
            claimRefs:
              - CM011
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 市场结构：双寡头核心与专业 PTaaS 挑战者
        blocks:
          - type: paragraph
            body: >-
              众包网络安全市场的高端企业漏洞赏金项目由集中度很高的双寡头主导，外围是专业渗透测试即服务挑战者和区域玩家 [CP001, CP002]。Bugcrowd 及其主要竞争对手 HackerOne 掌握了《财富》500
              强企业和联邦机构的大多数大型商业漏洞赏金及漏洞披露项目 [CP001]。双寡头之外，专业供应商建立了可防御的细分地位：Synack 依靠邀请制、高度筛选的研究员网络提供持续测试，深受国防承包商青睐；Cobalt
              提供适配快速工程冲刺的敏捷渗透测试即服务；欧洲运营商 YesWeHack 和 Intigriti 则满足本地数据主权和 GDPR 合规要求
              [CP002]。与此同时，传统现状替代方案——传统咨询公司的阶段性人工渗透测试，以及内部应用安全团队使用自动化漏洞扫描器——仍是尚未采用持续众包安全组织的默认支出类别 [CP002,
              CP010]。Bugcrowd 包括 2024 年 $102M 轮在内累计融资 $234M，用于推动扩张；但公司仍将自身与 Mandiant 或 CrowdStrike
              等广泛的事件响应或终端检测供应商区分开来，重点放在对抗性发现和情境化利用洞察上 [CP010, CP011]。
            claimRefs:
              - CP001
              - CP002
              - CP010
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP010
              - CP011
      - number: '3.2'
        title: 与 HackerOne 正面对比：规模、定价与企业认知
        blocks:
          - type: paragraph
            body: >-
              在直接竞争的项目中，HackerOne 是 Bugcrowd 在企业客户中的主要基准和替代威胁 [CP001, CP005]。截至 2024 年，HackerOne 累计向研究员支付超过
              $300M，社区规模占优，并经常在快速成长的科技公司中获得更早的品牌认知 [CP003, CP004]。不过，G2 和 Listicler 上的企业同行评价也凸显两家平台在商业和运营上的取舍 [CP004,
              CP005]。买家经常认为 HackerOne 订阅定价偏高、商业套餐更僵化，而 Bugcrowd 则反复被评价为在相当的众包覆盖下提供更具成本效益的总拥有成本 [CP004,
              CP005]。两家平台的核心能力都包括托管分流服务：在把结果交给客户工程队列前，验证、复现并去重提交 [CP006]。HackerOne 借助更大的社群规模，Bugcrowd 则以 CrowdMatch
              算法分配研究员、整合攻击面发现和托管漏洞披露工作流回应，强调信噪比而非原始提交量 [CP006, CP012]。
