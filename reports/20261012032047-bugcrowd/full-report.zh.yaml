  - id: FU001
    title: 客户旅程与平台扩展地图
    type: journey-map
    summary: 梳理企业客户从初次漏洞披露到持续渗透测试和红队演练的推进路径。
    data:
      items:
        - label: 阶段 1：VDP 接入
          stage: 阶段 1：初始接入与 VDP
          actor: 企业安全团队
          action: Deploy Vulnerability Disclosure Program
          touchpoints:
            - 公开漏洞披露政策
            - Bugcrowd 接入门户与工程化分诊
          outcome: Establish structured, safe vulnerability reporting without upfront bounty payouts
        - label: 阶段 2：私有赏金
          stage: 阶段 2：私有漏洞赏金
          actor: 应用安全负责人
          action: Launch Scoped Private Bounty
          touchpoints:
            - CrowdMatch 邀请经筛选的研究员
            - 按严重性分配奖励池
          outcome: Surface critical zero-day vulnerabilities in high-value digital assets
        - label: 阶段 3：公开赏金
          stage: 阶段 3：公开赏金扩展
          actor: CISO / 安全领导层
          action: Expand to Public Bug Bounty
          touchpoints:
            - 接入全球黑客社区
            - 持续资产监控
          outcome: Continuous external testing simulating real-world attacker pressure
        - label: 阶段 4：PTaaS 测试
          stage: 阶段 4：渗透测试即服务
          actor: 合规与审计团队
          action: Integrate PTaaS Engagements
          touchpoints:
            - 有时限的合规导向测试
            - 实时 SDLC 修复工作流
          outcome: Replace 60% of costly annual third-party pen tests with agile on-demand testing
        - label: 阶段 5：RTaaS 演练
          stage: 阶段 5：红队即服务（RTaaS）
          actor: 企业 SecOps 领导层
          action: Deploy Continuous Adversarial Simulation
          touchpoints:
            - 高阶 TTP 对手模拟
            - 根因攻击链映射
          outcome: Validate defense-in-depth security posture against sophisticated threats
        - label: 阶段 6：平台整合
          stage: 阶段 6：多产品平台扩展
          actor: 执行风险委员会
          action: Consolidate External Security Spend
          touchpoints:
            - 统一漏洞知识图谱
            - 全平台高管 ROI 报告
          outcome: Achieve 268% three-year ROI and reduced cyber insurance premiums
    approximationNotes: 旅程阶段综合 Bugcrowd 产品分类及 Forrester Consulting 客户采用模式。
    claimRefs:
      - CU009
      - CU010
