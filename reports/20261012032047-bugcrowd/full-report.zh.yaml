              辅助漏洞发现工具和自动化测试代理快速扩散，使众包安全平台的流入提交量大幅增加。Bugcrowd
              虽已更新提交政策并部署工具来识别高频提交者，但人工分流分析师仍是验证可利用性和筛除误报的运营瓶颈。当提交量增长快于熟练分流能力时，项目响应时间会拉长，客户满意度会下降。此外，Bugcrowd 通过 2024
