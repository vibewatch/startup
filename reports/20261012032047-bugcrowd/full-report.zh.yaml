  - id: FE001
    title: Bugcrowd 平台架构栈
    type: stack
    summary: 由外部接入面向下拆解 Bugcrowd，分为六层，直至企业治理。
    data:
      layers:
        - label: 接入与攻击面发现
          detail: 受监控的电子邮件、嵌入式网页提交表单、Bugcrowd 研究员门户及 Informer 外部资产发现
        - label: 计划编排与范围治理
          detail: 多租户 Organization 层在 Security Programs 之间分配访问权限、奖励池及参与政策
        - label: 众包情报与匹配层
          detail: CrowdMatch AI 算法为全球研究员能力建立索引，并将经过筛选的黑客路由至匹配范围
        - label: 托管式分诊与去重引擎
          detail: 混合 AI 与分析师分诊，验证可复现性、分配 CVSS 评分并过滤重复报告
        - label: 知识图谱与分析
          detail: Security Knowledge Graph 将数千个客户计划的多年漏洞遥测数据结构化
        - label: 企业 SDLC 集成层
          detail: 预构建连接器（Jira、ServiceNow、Slack、Trello、Qualys、Kenna）及开发者 API 同步修复工作
    approximationNotes: 架构层基于 Bugcrowd 官方技术文档、G2 数据表及行业评估整理。
    claimRefs:
