              轮。为在不立即稀释股权的情况下支持战略并购和国际扩张，Bugcrowd 于 2024 年 11 月从 Silicon Valley Bank 的 Technology Banking Group 获得额外
              $50M 增长资本债务工具。公司目前拥有超过 1,200 家企业客户，包括 OpenAI、Atlassian、Google、T-Mobile 和美国国防部等知名账户。不过，在审计 SVB
              工具的债务契约、利息偿付负担、净现金消耗和剩余现金跑道之前，资本充足性无法得到完整评估。非正式二级估值标记和缺少经审计财务报表，使得在评估任何流动性事件前必须完成全面数据室核验。
