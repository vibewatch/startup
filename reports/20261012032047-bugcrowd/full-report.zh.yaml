chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、平台架构与核心产品
        blocks:
          - type: paragraph
            body: >-
              Bugcrowd Inc. 是一家企业级众包网络安全公司，2012 年由 Casey Ellis、Chris Raethke 和 Sergei Belokamen
              在澳大利亚悉尼创立，如今总部位于旧金山，并在悉尼和伦敦设有主要区域中心。公司开创了众包软件即服务（CSaaS）运营模式，把企业安全买家与经过筛选的全球道德黑客和安全研究员社群连接起来。Bugcrowd
              的核心解决方案围绕专有 Security Knowledge Platform
              构建，统筹四大商业测试支柱：托管漏洞赏金计划、渗透测试即服务（PTaaS）、漏洞披露计划（VDP）和攻击面管理（ASM）。传统的一次性渗透测试往往无法跟上不断扩大的云基础设施和持续部署周期。为此，Bugcrowd
              将研究员的人工洞察与工程化分流、专有 CrowdMatch 算法引擎结合，依据数百项能力维度筛选并激活研究员。在金融服务、科技和政府领域，Bugcrowd 服务超过 1,000
              家企业，提供持续风险降低、经验证的漏洞发现及结构化修复情报，并直接接入企业 SDLC 工作流。
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO013
