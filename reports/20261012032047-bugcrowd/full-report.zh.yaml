  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义、支出边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              众包安全市场在更广义的信息安全领域中占据独立且不断扩大的边界。传统上，企业漏洞评估依赖定期咨询项目和自动化扫描设备。然而，静态应用安全测试（SAST）、动态扫描器及合规驱动的年度渗透测试，往往系统性地漏掉新颖的多步骤逻辑缺陷。众包安全平台汇聚经筛选的全球道德黑客，通过协调漏洞披露、渗透测试即服务（PTaaS）和漏洞赏金，持续开展进攻性测试。计入的支出包括软件平台订阅费、工程化分流服务和专门的客户出资赏金池。相反，内部安全人员薪酬、硬件测试实验室、SIEM
              基础设施和终端检测许可严格不在这一商业边界内。现状替代方案包括传统专业服务公司的阶段性人工测试和内部红队；两者都面临严重的网络安全人才短缺及不断上升的小时计费率。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM013
      - number: '2.2'
        title: 市场规模、TAM / SAM / SOM 架构与商业轨迹
        blocks:
          - type: paragraph
            body: >-
              评估 Bugcrowd 的可服务机会，需要多层次测算视角，而不是一个宽泛的单一估计。宏观层面，全球信息安全和风险管理支出每年超过 $215B。其中，安全测试和漏洞管理构成 $15B-$20B
              的软件与服务可服务市场。专业众包安全和 PTaaS 的可服务可获得市场（SAM）估计为全球 $2.5B-$3.5B，随着企业把传统咨询预算转向持续交付的 SaaS 测试，复合年增长率超过
              20%。核心商业漏洞赏金平台市场的可服务规模为 $1.2B-$1.8B，HackerOne 累计向研究员支付超过 $300M，显示该市场已有显著资金流量。Bugcrowd 由 General Catalyst
              领投、以超过 $1B 估值完成 $102M 增长融资，验证了主流企业需求。然而，Bugcrowd 是一家不披露经审计 ARR
              分组数据的私有供应商，因此其精确的可服务可获得市场（SOM）份额仍受私人披露不透明性的限制。
            claimRefs:
              - CM001
              - CM004
              - CM012
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM012
              - CM014
