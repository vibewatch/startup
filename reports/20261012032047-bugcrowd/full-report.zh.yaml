        - 1,000 - 1,320
        - 代理式测试变现成功，企业 ARR 增长 >30%，分诊效率稳定
        - 漏洞发现商品化；客户抵触平台订阅费
      - - 基准情景
        - 75 - 90
        - 8.0x - 9.0x
        - 600 - 810
        - 收入温和增长 15-20%，托管式分诊吸收 AI 报告，PTaaS 稳步采用
        - 倍数压缩至可比公司中位数 6.0x；企业合同续签放缓
      - - 悲观情景
        - 55 - 65
        - 6.0x - 7.0x
        - 330 - 455
        - 分诊利润率恶化，客户转向自动化工具，增长停滞在 10% 以下
        - 平台分诊 SLA 失效，一级企业客户流失，清算优先权受损
    notes: 估值情景将远期收入倍数应用于不同预估经营表现层级；Bugcrowd 未披露经审计 GAAP 收入。
    claimRefs:
      - CV005
      - CV008
      - CV010
      - CV012
      - CV013
      - CV014
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 以时间顺序梳理 Bugcrowd 2012 至 2026 年的公司、融资、产品及运营里程碑。
    data:
      items:
        - label: 公司在悉尼成立
          date: 2012-09
          detail: Casey Ellis、Chris Raethke 和 Sergei Belokamen 创立 Bugcrowd，使其成为众包漏洞赏金领域的先行者。
          tone: positive
        - label: 种子轮融资
          date: 2013-09
          detail: 完成 $1.6M 种子轮融资，由 Rally Ventures 领投，用于扩大对道德黑客的筛选。
          tone: positive
        - label: A 轮融资
          date: 2015-03
          detail: 完成由 Costanoa Ventures 领投的 $6M A 轮融资；将托管式漏洞赏金计划扩展至 Western Union 等企业客户。
          tone: positive
        - label: B 轮与 C 轮扩张
          date: 2016-04
          detail: 完成由 Blackbird Ventures 领投的 $15M B 轮融资，随后于 2018 年完成由 Triangle Peak Partners 领投的 $26M C 轮融资。
          tone: positive
        - label: D 轮成长融资
          date: 2020-04
          detail: 完成由 Rally Ventures 领投的 $30M D 轮融资，在全球扩展 PTaaS 和攻击面管理产品。
          tone: positive
        - label: 获得 CVE 编号机构授权
          date: 2022-10
          detail: 获国际 CVE 计划授权，成为可分配 CVE ID 的 CVE 编号机构（CNA）。
          tone: positive
        - label: E 轮成长融资与独角兽估值
          date: 2024-02
          detail: 完成由 General Catalyst 领投的 $102M E 轮融资，据报道估值超过 $1B；Paul Sagan 出任董事会主席。
          tone: positive
        - label: AI 分诊瓶颈与平台演进
          date: 2026-07
          detail: AI 辅助漏洞提交激增令赏金分诊承压；Bugcrowd 上线反垃圾检查及 Savant Pathseeker AI 测试。
          tone: warning
    approximationNotes: 里程碑时间线综合了经核实的公司公告、SEC / 监管披露及科技行业报道。
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO011
      - CO012
