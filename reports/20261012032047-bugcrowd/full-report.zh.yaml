            body: >-
              Bugcrowd 的软件架构采用分层多租户结构，客户账户通过 Organization 层向各个 Security Program 下放管理权限、用户角色和资金分配。每个 Security Program
              都是一个运营边界，定义目标资产范围、奖励池预算、研究员访问层级和外发工作流配置。漏洞报告通过嵌入式网站提交表单、受监控的安全邮箱和经过认证的研究员门户等多个入口进入平台。漏洞提交后，Bugcrowd
              的托管分流流水线会截获报告。专业分流分析师验证可复现性，依据项目政策规则确认范围合规性，按标准化分类指标评估漏洞严重度，并标记重复提交。通过将验证集中到结构化分流层，Bugcrowd
              避免客户工程团队承担处理无效或未经验证漏洞提交的行政负担。
