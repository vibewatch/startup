            body: >-
              Bugcrowd 的成本结构由两大运营成本中心主导：负责托管分流的内部安全工程人员，以及支持 Security Knowledge Graph 和 AI 驱动 CrowdMatch
              引擎的云基础设施。分流是平台首要运营瓶颈；专业安全分析师必须人工审阅、复现和去重提交，以确保企业客户获得足够的信噪比。在 AI
              辅助漏洞研究时代，提交量急剧上升，平台面临更高的分流转付费比和更低的有效发现比例，分流队列因此承受严重压力。为保护毛利和运营吞吐，Bugcrowd 已整合自动化分流工具并收购
