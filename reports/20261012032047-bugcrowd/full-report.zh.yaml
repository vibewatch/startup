      - number: '1.2'
        title: 执行团队、治理结构与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              Bugcrowd 的执行团队和公司治理框架，将经验丰富的网络安全运营高管与知名机构软件投资人结合起来。首席执行官 Dave Gerry 负责公司运营和商业战略，曾任 WhiteHat Security
              首席运营官，并在 Veracode 担任高级管理职务。Gerry 专注于扩大 Bugcrowd 的企业渗透测试覆盖、引入自动化威胁情报并推进平台变现。创始人 Casey Ellis
              任董事长兼首席战略官，维持创始人主导的战略一致性，同时代表全球道德黑客社群和 disclose.io 等开放漏洞披露标准。公司完成 $102M E 轮融资后，机构治理进一步扩展：General Catalyst
              高级顾问、前 Akamai Technologies CEO Paul Sagan 出任董事会主席，General Catalyst 合伙人 Mark Crane
              也加入董事会。管理层在工程和全球销售两条线都展现出扎实的职能深度，但关键人物依赖仍明显集中在 Casey Ellis 的研究员社群信誉和 Dave Gerry 的后期企业商业执行能力上。
            claimRefs:
              - CO007
              - CO008
