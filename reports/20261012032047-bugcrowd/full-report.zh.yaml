      - number: '8.2'
        title: 估值基准与市场经济学
        blocks:
          - type: paragraph
            body: >-
              第三方平台追踪机构称，Bugcrowd 在 2024 年初完成由 General Catalyst 领投的 $102 million 战略增长融资后，达到非正式的 $1.0 billion
              独角兽估值基准。Caplight 和行业分析师将 HackerOne 视为 Bugcrowd 最主要的可比公司，商业模式相似度最高，其后是 Synack 和
              Intigriti。不过，市场经济学仍面临结构性摩擦。企业定价由每年 $30,000 至超过 $150,000 的平台订阅费，以及通常为 $50,000 至
              $500,000、由客户另行出资的研究员赏金池组成。平台费能产生经常性软件毛利，
              但托管分诊和研究员协调带来了类似服务业的成本结构。此外，公司没有公开披露经审计的收入、净留存率和毛利率，因此无法验证软件倍数是否合理。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV007
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
