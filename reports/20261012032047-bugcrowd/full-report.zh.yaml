      - number: '2.3'
        title: 企业买家画像、预算归属与采购路径
        blocks:
          - type: paragraph
            body: >-
              企业采用众包安全的路径具有明确的买家画像和正式的公司采购流程。经济买家主要是员工超过 500 人、年度安全预算超过 $50M 的企业中的首席信息安全官（CISO）和信息安全副总裁。应用安全经理、DevSecOps
              负责人和安全运营中心（SOC）分析师是终端用户及关键影响者，负责协调漏洞接收并修复已确认缺陷。采用触发因素包括董事会层面的风险审查、云现代化项目、即将进行的并购资产整合，以及超过六个月的严重渗透测试积压。企业客户覆盖
              National Australia Bank 等高度受监管金融机构、Atlassian 等软件巨头、高等教育机构和州政府实体。合同通常以年度 SaaS
              订阅采购，包含托管分流工作流和平台能力，并辅以客户分配的赏金储备。
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
