      - number: '3.4'
        title: 护城河持久性：分流经济性、社群质量与 AI 冲击
        blocks:
          - type: paragraph
            body: >-
              Bugcrowd 的长期竞争持久性取决于在人工智能加速冲击时代守住分流护城河并维持研究员参与度 [CP007, CP013]。平台数据表明，开放范围项目的关键 P1 漏洞提交量可增加十倍，但 AI
              辅助安全研究工具的扩散也带来了严重运营瓶颈 [CP007, CP013]。生成式 AI
              和自动化侦察工具让单个研究员能够提交大量合成撰写的报告，以低严重度或误报结果挤满分流审核队列，令所有众包平台的内部分析师经济性承压 [CP013]。为抵御商品化，Bugcrowd 在 2024
              年收购攻击面管理供应商 Informer，并于 2025 年收购 AI 安全公司 Mayhem Security，将自动化利用验证和 AI 模型测试嵌入技术栈 [CP008,
              CP009]。此外，Anthropic 的 Project Glasswing 等新兴非赏金模式，直接与受影响组织协调披露 1,596 个漏洞，且不经过商业平台，显示出传统漏洞赏金聚合商面临潜在去中介化风险
              [CP014]。
            claimRefs:
              - CP007
