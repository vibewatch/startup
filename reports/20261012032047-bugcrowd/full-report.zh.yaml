  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 将运营规模、平台防御与估值倍数压力串联起来，最终得出“跟踪”立场。
    data:
      nodes:
        - id: N1
          label: 1. 企业验证
          detail: 已证明主要商业客户及政府计划采用众包模式。
        - id: N2
          label: 2. 平台广度
          detail: 集成 PTaaS、VDP、攻击面管理，并战略性收购 Informer 和 Mayhem。
        - id: N3
          label: 3. 颠覆性逆风
          detail: AI 辅助报告量上升，加剧分诊摩擦；直接 CVD 渠道绕过漏洞赏金平台。
        - id: N4
          label: 4. 财务不透明
          detail: 缺少公开的经审计 ARR、留存指标及清算优先权瀑布。
        - id: N5
          label: 5. 估值摩擦
          detail: 非正式的 $1.0B 独角兽估值对应激进的约 11x-13x 收入倍数，而基准情景收入区间为 $600M-$810M。
        - id: N6
          label: 6. 投资结论
          detail: 在数据室披露单位经济模型及资本结构前，维持“跟踪 / 需进一步研究”立场。
