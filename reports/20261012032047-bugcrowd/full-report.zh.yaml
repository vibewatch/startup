      - number: '1.4'
        title: 公司里程碑、AI 分流逆风与平台演进
        blocks:
          - type: paragraph
            body: >-
              在十四年的运营历程中，Bugcrowd 达成了关键企业和监管里程碑，尤其是在 2022 年 10 月获正式授权成为 CVE 编号机构（CNA），可为公开披露的漏洞分配 CVE
              标识符。为扩大攻击面管理和自动化测试覆盖，Bugcrowd 于 2024 年 5 月收购外部资产发现专家 Informer，随后在 2025 年末收购 AI 测试专家 Mayhem
              Security。然而，2026 年众包网络安全的运营环境正面临由生成式 AI
              编程助手和自主漏洞发现工具扩散所驱动的前所未有的结构性压力。威胁研究员越来越多地借助大语言模型自动完成侦察、攻击面扫描和概念验证合成。AI
              辅助报告激增，令分流队列大幅膨胀、信噪比下降，因为分流人员必须人工审阅数百份低影响或幻觉生成的提交。对此，Bugcrowd 已部署身份验证门槛、强制概念验证可复现要求和 Savant Pathseeker
              等持续验证工具，以守住分流经济性、客户 SLA 并避免队列耗尽。
            claimRefs:
              - CO011
              - CO012
              - CO015
              - CO016
