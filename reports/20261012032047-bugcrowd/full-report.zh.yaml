            body: >-
              Bugcrowd 通过多层架构将 SaaS 平台订阅、托管漏洞赏金项目和渗透测试即服务（PTaaS）结合起来，实现众包网络安全变现。客户支付经常性平台访问费并出资建立赏金池，Bugcrowd
              负责协调研究员付款和托管分流。第三方私有可比公司研究将 Bugcrowd 的核心收入模式视为软件订阅与交易佣金的组合，随客户在 Web
              应用、API、移动目标和攻击面管理上的项目范围扩大而增长。渗透测试即服务已成为增长最快的产品线，企业用持续按需测试替代或补充传统阶段性渗透测试，推动其同比增长接近
              100%。标准渗透测试项目公开目录基准起价为一次性购买 $5,000；托管漏洞披露项目月费约从 $299 起，再根据多资产范围扩展为定制企业合同。
