      - number: '1.3'
        title: 融资历程、资本结构与估值动态
        blocks:
          - type: paragraph
            body: >-
              自 2012 年成立以来，Bugcrowd 通过六轮股权融资和高级信贷工具累计筹资约 $236M。早期风险投资始于 2013 年由 Rally Ventures 领投的 $1.6M 种子轮，随后是 2015 年
              Costanoa Ventures 领投的 $6M A 轮、2016 年 Blackbird Ventures 领投的 $15M B 轮、2018 年 Triangle Peak Partners 领投的
              $26M C 轮，以及 2020 年 Rally Ventures 领投的 $30M D 轮。2024 年 2 月，Bugcrowd 完成由 General Catalyst 领投、Costanoa
              Ventures 和 Rally Ventures 参与的 $102M E 轮增长股权融资。该轮融资形成了非正式的 $1.0B+ 投后估值标记，使 Bugcrowd 成为网络安全独角兽。2024 年末，公司又从
              Silicon Valley Bank 获得 $50M 增长资本债务工具，为国际市场拓展和战略并购提供资金。尽管资本规模亮眼，Bugcrowd 的财务仍高度不透明：ARR、NRR 和毛利率均未公开。若 ARR
              增长落后于高端企业 SaaS 基准，这种不透明会使 $1.0B+ 估值标记面临潜在倍数压缩。
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO010
              - CO014
