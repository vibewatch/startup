  - id: TE003
    title: Technology and Operating Architecture Decomposition
    columns:
      - Architecture Layer / Component
      - Functional Role
      - Core Technological Dependency
      - Key Operational or Technical Risk
    rows:
      - - Intake & Multi-Tenant Gateway
        - Captures vulnerability submissions via monitored email, web forms, and Bugcrowd portal
        - Multi-tenant Organization-to-Security Program delegation model
        - Data isolation and granular RBAC boundaries across complex federated business units
      - - CrowdMatch AI & Routing Engine
        - Matches verified security researchers to customer scopes based on historical skills and track record
        - Historical engagement telemetry and proprietary researcher skill indexing
        - Model drift and mismatch risks when evaluating novel technology stacks or zero-day classes
      - - Managed Triage & Deduplication Engine
        - Validates reproducibility, filters false positives, deduplicates, and assigns CVSS severity tiers
        - Human-in-the-loop professional security analyst team aided by semantic similarity matching
        - Triage bottleneck when AI-generated submissions accelerate report volume without increasing valid findings
      - - Integration & Ecosystem Connectors
        - Exports validated findings into enterprise systems (Jira, ServiceNow, Slack, Qualys, Kenna)
        - REST APIs, webhooks, and pre-built enterprise workflow connectors
        - Webhook delivery reliability, connector schema drift, and third-party API deprecations
    notes: System decomposition derived from Bugcrowd official architecture documentation, developer surfaces, and external security analyses.
