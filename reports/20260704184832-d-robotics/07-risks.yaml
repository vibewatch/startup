- calloutType: assumption
  title: Fresh capital reduces urgency, not residual risk
  body: The 2026 B1 and B2 rounds buy time, but public silence on revenue, burn, and margin means financing is not yet evidence of business-model durability. In a chip-plus-ecosystem model, capital often masks execution risk before it cures it.
  claimRefs:
