- id: market-channel-and-support
  title: Market concentration, channel dependence and support risk
  body: 'The market-expansion risk is less about whether D-Robotics can sell anything outside China and more about what kind of international footprint it currently has. The distributor page is encouraging because it shows visible reseller coverage across several Asian and European countries. But that same page is also a caution flag: the footprint is still mostly reseller-led, and the accessories page routes peripheral fulfillment through local distributors as well. That is a perfectly normal early-stage channel design, but it is weaker than having direct field teams, named global OEM deployments, and published international customer references.


    The support surface reinforces that caution. Public forum activity in early July 2026 shows real issues around CAN FD, GPIO, dropped frames, model conversion, and S100 boot behavior. That is evidence of active usage, but it also means operating complexity is showing up in the open. Add in the strong education-and-developer flavor of the public onboarding surfaces, and the result is a company with healthy ecosystem energy but still uncertain international monetization depth. Investors should therefore separate visible community engagement from proven overseas revenue diversification.'
