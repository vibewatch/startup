callouts:
- calloutType: risk
  title: The master risk is not one missing feature; it is standard adoption
  body: If non-China robotics teams keep defaulting to Jetson-class or Qualcomm-class stacks because of software familiarity, supply confidence, and support expectations, D-Robotics can still ship capable boards without becoming the default platform investors hope for.
  claimRefs:
