- calloutType: risk
  title: Demand-timing risk may bite before supply-side risk does
  body: 'Export controls are a slow-moving, primarily supply-side risk that D-Robotics can partially route around with domestic substitution and channel diversification. The embodied-AI investment cycle is a faster-moving, demand-side risk: if VC enthusiasm for humanoid robotics cools before D-Robotics'' S100/BPU Nash line reaches durable industrial and AMR revenue, near-term order flow could soften well before any single export-control event forces a strategic reset.'
