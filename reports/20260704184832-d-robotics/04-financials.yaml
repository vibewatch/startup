company:
  name: D-Robotics
chapter:
  number: 4
  title: Financials
  summary: 'D-Robotics’ public record supports a clear platform-style monetization thesis—chips, RDK developer kits, software/toolchain enablement, and partner ecosystem services—but not a clean quantitative underwriting model. Secondary 2026 sources point to a $120M B1 round in March and a $150M B2 in April after a $100M 2025 A round, yet cash, burn, runway, revenue, gross margin, and customer concentration remain undisclosed. Public signals such as 229 GitHub repositories, course engagement, partner breadth, and developer-case activity suggest strong ecosystem traction, while recent forum issues imply continuing support and hardening cost. The financial verdict is therefore structurally positive but data-room dependent: D-Robotics looks well funded for expansion, not publicly proven on revenue quality or profitability.'
sections:
- id: revenue-model
  title: Revenue model and monetization posture
  body: 'D-Robotics’ public commercial posture is much closer to an enabling platform vendor than to a robot OEM. The clearest outside description comes from 36Kr, which says the company does not intend to manufacture robot bodies and instead wants to become the shared soft/hardware base for many robot makers. That positioning is consistent with the fetched official surfaces: the company markets RDK X5 and RDK S100 as development and compute platforms, publishes a TogetheROS.Bot manual, maintains a large GitHub organization, and curates a BPU-focused model zoo. Taken together, the visible stack suggests three monetizable layers: hardware kits and compute modules, software/toolchain enablement, and partner/developer ecosystem services.


    The missing piece is price realization. Public pages expose product capability and onboarding materials, but not list prices, discount bands, attach rates, or recurring software contract terms. That means the most defensible financial read is structural rather than quantitative: D-Robotics appears to monetize developer access and downstream platform adoption, but public sources do not yet reveal what proportion of revenue comes from board sales, chip/module programs, or software-linked services.'
