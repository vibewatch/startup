- id: TI005
  title: Public financial gaps table
  columns:
  - Missing item
  - Impact on analysis
  - Exact diligence path
  rows:
  - - Revenue / ARR / growth
    - Without it, valuation and sales-efficiency analysis remain structural only
    - Request monthly revenue and annualized run-rate by product line
  - - Gross margin by stream
    - Cannot tell whether kits, chips, or support are scaling profitably
    - Request product P&L by board, chip/module, and software/support category
  - - Cash / burn / runway
    - Cannot assess next-round trigger or capital adequacy
    - Request monthly cash bridge and twelve-month operating burn
  - - B1/B2 investor roster and terms
    - Cannot judge signaling quality, liquidation stack, or governance additions
    - Request signed financing summary with investor names and security terms
  - - Customer and partner concentration
    - Cannot translate ecosystem breadth into revenue resilience
    - Request top-10 customers, top-10 partners, and revenue mix by segment
  notes: These are the minimum data-room asks needed to turn a platform story into an investable financial model.
