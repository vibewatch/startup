tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Public status
  - Revenue quality
  - Diligence ask
  rows:
  - - RDK developer kits
    - Sale of RDK X5 / RDK S-series development hardware to developers and robot teams
    - Product pages and tutorials visible; realized volume undisclosed
    - Hardware revenue, likely transactional and launch-dependent
    - Disclose unit shipments, ASP, and repeat-purchase rate by board family
  - - Embedded compute chips / modules
    - Platform compute sold into downstream robot makers
    - S100 and BPU Nash compute positioning visible; commercial design-win count undisclosed
    - Potentially high-value but opaque program revenue
    - Disclose active design wins, shipment ramp, and module/chip pricing basis
  - - Software / toolchain enablement
    - TogetheROS.Bot, model-zoo workflows, ISP training, toolchain manuals
    - Extensive public enablement surface exists; contract model undisclosed
    - Could raise stickiness but monetization form is unclear
    - Clarify which tools are free, bundled, paid support, or enterprise-licensed
  - - Partner ecosystem services
    - Co-marketing, integration support, ecosystem onboarding, contests
    - Partner and activity feeds visible; service revenue not disclosed
    - Indirect monetization and demand generation rather than clean ARR
    - Disclose partner rebates, certification fees, and co-development economics
  - - Education / training programs
    - Course delivery, competitions, and school cooperation
    - High engagement proxies visible; revenue capture unclear
    - Good funnel signal but weak direct revenue visibility
    - Disclose whether training is subsidized, paid, or channel-supported
  notes: Public evidence supports multiple monetization surfaces, but no source discloses stream-level revenue mix or realized pricing.
