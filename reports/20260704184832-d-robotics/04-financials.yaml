- id: revenue-quality
  title: Public traction versus private metric gaps
  body: 'The public record is much stronger on ecosystem traction than on revenue quality. Baidu Baike cites more than 100 products, more than 100 partners, 100,000 developers, and cooperation with over 500 schools by late 2025. Community APIs and course catalogs show tangible post-launch activity, and the developer-case feed confirms real third-party builds across manipulation, quadrupeds, smart fitness, service robots, and safety systems. These are useful indicators that the platform is being tried, taught, and integrated.


    What they do not establish is revenue durability. None of the fetched public sources disclose contracted revenue, ARR, gross margin, churn, customer concentration, or product-level mix. Even partner breadth cannot be translated into diversification because no public revenue split exists by customer type, segment, or geography. The result is a familiar private-hardware-platform problem: D-Robotics looks commercially active, but revenue quality is still opaque outside a diligence room.'
