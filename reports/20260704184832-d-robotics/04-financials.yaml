- id: capital-adequacy
  title: Funding history and capital adequacy
  body: 'Accessible public sources give enough evidence to establish recent funding momentum, but not enough to underwrite capital adequacy cleanly. Baidu Baike records a $100 million A round in May 2025, a $120 million B1 in March 2026, and a $150 million B2 in April 2026, implying $270 million of B-round capital alone. Public sources also describe D-Robotics as an emerging unicorn, which is directionally consistent with the user brief’s late-stage growth framing, but the fetched pages do not publish a hard post-money valuation table, investor roster, or a bridge from proceeds to balance-sheet runway.


    That omission matters because D-Robotics is building a full-stack robotics platform: chips, kits, software manuals, training content, community support, and partner programs. Those activities all imply continued R&D, ecosystem, and support spend. Without cash-on-hand, burn, inventory, and gross-margin disclosure, the prudent conclusion is that the recent B rounds reduced financing urgency but did not remove next-round dependency from the thesis.'
