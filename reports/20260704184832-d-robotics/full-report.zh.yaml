      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              D-Robotics 的买方地图天然是跨职能的。平台工程、SRE 和机器人软件团队最像一线使用者，因为他们管理部署、节点利用率、传感器集成和机器人应用性能。财务与 FinOps
              团队同样重要，因为效率和费用回显也是立项理由的一部分，尤其当机器人项目横跨云、边缘和混合环境时。随着 D-Robotics 推进具身智能，AI
              基础设施负责人也会成为关键利益相关者，因为加速器效率、散热上限和软硬件兼容性会决定一个设计能否成立。因此，采用路径通常从原型或开发者项目开始，进入真实机器人形态上的评估；一旦客户能证明性能、可靠性和单位经济性，再放大到量产预算。官网上创客与企业用户的分层，也符合这条从实验到部署的路径。
