        blocks:
          - type: paragraph
            body: >-
              今天要承保一条清晰的公开市场式退出路径还太早。更可能的近期结果是另一轮私募融资、战略合作路径，或在 D-Robotics 披露可复制客户经济性之后再推进
              IPO。避免买贵的最好办法，是盯住真正会打破投资逻辑的事项。如果公司在收入质量可见前又融资，如果国际客户证明无法从偏中国市场的
              基础向外拓宽，或者出口管制收紧实质性改变供应商行为，合理估值区间就应下调，而不是上调。


              最后的尽调问题直接而且要求很高：确切轮次条款、完整 cap
              table、产品线毛利率、烧钱和跑道、出口链依赖，以及按地域和用例划分的客户集中度。没有这些答案，即便战略故事仍有吸引力，公司也过于不透明，无法给出买入判断。因此，「跟踪」是正确的操作立场：保持贴近、快速更新，并且只在硬数据追上时才准备重估。
            claimRefs:
              - CV029
              - CV030
              - CV031
              - CV032
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
          - type: table
