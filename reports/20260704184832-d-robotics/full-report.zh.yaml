      - number: '3.4'
        title: 护城河耐久性、商品化与替代风险
        blocks:
          - type: paragraph
            body: >-
              D-Robotics 护城河最强的版本不是公开基准测试的绝对领先，而是一体化可达性。当买方需要低功耗本地推理、机器人中间件、示例和从套件到部署机器人更快的路径时，D-Robotics
              相比纯芯片供应商或纯云替代方案会显得不同。这个优势真实存在，但很脆弱。公开竞品证据显示，多家供应商现在都把 AI 加速与软件工具链、长生命周期支持或工业参考设计打包，削弱了“硬件 +
              SDK”基础卖点的独特性。NVIDIA 也用软件丰富、高性能的物理 AI 平台抬高买方预期上限，Renesas 和 TI
              则把买方注意力拉向完整系统安全和电机控制集成。同样重要的是，本次审阅的公开材料没有提供同口径基准测试、TCO 研究或量产价格矩阵，证明 D-Robotics
              能在不同负载中取胜。因此，投资人应把护城河视为有潜力但尚未充分证明；基准测试、渠道和商品化风险仍需重点尽调。
