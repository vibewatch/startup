  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              D-Robotics 的正面估值逻辑不难理解。公开来源显示，它不是一次性的开发板项目，而是真实的机器人平台：公司销售计算套件、开发者工具和生态资产，同时踩中边缘 AI 与具身机器人两条强叙事。2026 年 B1
              和 B2 融资也证明，投资者愿意用有分量的资本支持这条叙事。如果 D-Robotics 能把平台宽度转化为 AMR 或人形机器人相邻场景里的耐久软硬件标准，今天的私募估值回头看仍可能显得保守。


              反论点是，公开证据现在仍更像一个生态故事，而不是一台商业机器。已审阅资料没有披露收入、毛利率、烧钱速度或客户集中度。Ambarella 和 Horizon 这些有真实估值的公开可比公司，也有 D-Robotics
              目前拿不出来的申报级透明度。与此同时，Yicai 关于 2026 资本周期的报道警告，中国机器人和硬科技估值可能已经偏热。实际含义是，D-Robotics
              相比普通硬件创业公司应享有真实平台溢价，但在已披露经济性追上叙事之前，这个溢价应被封顶。
