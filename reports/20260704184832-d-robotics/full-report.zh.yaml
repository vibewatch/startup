      - number: '7.5'
        title: 分拆执行和财务模型风险
        blocks:
          - type: paragraph
            body: >-
              执行风险仍然偏高，因为 D-Robotics 不是一家从零起步的软件公司；它是近期分拆出来的公司，要同时商业化芯片、板卡、中间件、工具、社区支持和伙伴赋能。母公司的规模对比会让人冷静。Horizon
              Robotics 现在披露数十亿 RMB 收入、数百万终端用户和数千万芯片出货，而 D-Robotics
              仍在证明这套聚焦机器人的技术栈能独立撑起经济性。这不等于存在隐藏依赖，但确实意味着管理层必须把继承来的品牌信任，替换成自己的可复制执行能力。


              财务上，公开记录证明了融资动能，但没有证明自我造血的经济性。Yicai 和 CXO 都报道了 2026 年分两步完成的 $270 million Series
              B，但同一批公开记录仍未披露收入、毛利率、现金、烧钱速度或跑道。这个平台在结构上资本开支很重，因为产品开发、生态赋能和支持要一起扩张。在这样竞争激烈的市场里，即便资金充足，公司也可能比投资者预期更快再次依赖融资。管理层拿出干净的变现、成本和跑道披露之前，财务模型应被视为风险放大器，而不是稳定器。
