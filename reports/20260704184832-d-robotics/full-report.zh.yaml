  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与方案类型
        blocks:
          - type: paragraph
            body: >-
              分析 D-Robotics 时，应把它同几类解决同一机器人算力任务的替代方案比较。公司自己的公开触点描述的是一个完整栈：开发板、基于 BPU 的推理、兼容 ROS
              的中间件、文档和开发者上手路径。因此，它最接近的竞争对象不只是边缘 AI 芯片。NVIDIA 代表物理 AI 和人形机器人项目的高端既有路径，Jetson Orin 覆盖宽模块梯队，Jetson Thor
              则走向更大内存和 Transformer 级推理负载。Qualcomm 通过嵌入式参考平台竞争，把 AI、连接能力和对 ROS 友好的开发套件打包在一起。Ambarella、Renesas、TI 和
              MediaTek 从不同角度切入：低功耗视觉 SoC、工业机器人控制与安全、传感器融合和电机控制子系统，或通用边缘 AI 模块。最后，一些买方可以在共享基础设施问题上沿用 Autopilot、Karpenter
              和既有 FinOps 工具，再自行集成机器人组件。关键尽调点在于，D-Robotics 卖的是碎片化市场中的一体化机器人算力路径，而不只是打一场单一基准测试竞赛。
            claimRefs:
              - CP001
              - CP002
