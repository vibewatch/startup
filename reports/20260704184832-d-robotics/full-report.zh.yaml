  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与相邻品类
        blocks:
          - type: paragraph
            body: >-
              不能把 D-Robotics
              当成向单一垂直行业销售成品机器人的公司来分析。它的公开触点显示的是一套机器人开发与边缘算力栈：开发者硬件、具身机器人算力平台、中间件和部署工具。这把公司放在几个支出池的交汇处。最宽的相邻池是 Cloud
              FinOps 和云成本优化，因为买方越来越在意算力效率、工作负载放置和业务价值问责。更窄但运营上更相似的池是 Kubernetes
              成本管理和集群级自动化，节点供给、成本归因和工作负载效率已经是明确预算项。机器人专属层则叠在这些抽象之上：具身机器人、工业机器人、家庭机器人和移动机器人都需要本地感知、控制、联网和带安全意识的算力。因此，相关市场应包括边缘
              AI 芯片、机器人中间件和开发者基础设施，同时排除通用 ERP 采购软件，以及不直接购买算力或开发工具的终端机器人服务收入。这个边界逻辑很关键，否则任何机器人或云算力统计都会显得可以被公司全部触达。
