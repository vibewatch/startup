  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 技术差异化与竞争替代风险
        blocks:
          - type: paragraph
            body: >-
              核心技术风险在于，D-Robotics 想在机器人计算市场建立标准，但这个市场里，最显眼的既有巨头已经同时覆盖芯片和软件控制平面。NVIDIA 的 Jetson 产品梯队已经从 67 TOPS 的 Orin
              Nano、275 TOPS 的 AGX Orin，延伸到配 128 GB 内存、2070 FP4 TFLOPS 的 Thor；JetPack 7 又把 CUDA、TensorRT、Isaac
              ROS、OTA、安全和云原生部署工具打包在一起。机器人团队拿到的是一套全球更容易识别、也更容易解释的软件界面；D-Robotics 目前公开的基准测试级证据，还没有打出同等清晰度。


              D-Robotics 自己当然有真实技术栈：X3、X5、S100、NodeHub 和 DGP 拼出了一条完整开发路径。但公开证据读起来仍更像生态驱动的差异化，而不是全球性能经济性更优的硬证明。Qualcomm
              仍在投入 RB3 Gen 2 和 RB5 机器人路径，Ambarella 用每瓦性能叙事切入低功耗机器人感知，Kneron 的资金也足以继续推进边缘 AI 叙事。风险不是 D-Robotics
              没有产品；风险在于，在 D-Robotics 拿出更清晰的基准测试、软件和部署优势之前，本土市场之外的买家可能仍会默认选择全球更标准化的技术栈。
