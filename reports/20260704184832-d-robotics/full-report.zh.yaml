      - number: '6.4'
        title: 留存不透明、集中度风险与负面信号
        blocks:
          - type: paragraph
            body: >-
              本次审阅未发现任何官方或独立 2026 年来源披露 D-Robotics
              任一客户或伙伴细分的净收入留存、毛留存、续约率或流失率，也没有任何来源披露客户集中度指标，例如最大具名账户占出货量或收入的比例。这种不透明很重要，因为 D-Robotics 自己的增长标题——出货量约增长
              180%、客户数增长 200%，并由 KrASIA/36Kr 和 Yicai Global 交叉佐证——并不能说明增长是在约 60 个具名或报道过的供应链伙伴中广泛发生，还是集中在扫地机器人等少数高出货量 OEM
              品类中。独立行业评论提供了本章最清晰的负面信号：China Biz Insider 对中国具身 AI 独角兽群体的分析把 D-Robotics
              描述为“从芯片层进攻问题”，这是一种无论哪个应用层人形机器人赢家出现都能捕获价值的芯片级策略；但同一分析也把大多数群体公司——包括 D-Robotics——置于 18–24 个月现金续航上，并预计行业将在
              2027 至 2028 年之间面临清算，同时指出 D-Robotics 自己的 2026 年 4 月融资轮估值约为 RMB 10.8
              billion，却没有披露客户收入集中度。额外集中度风险来自地理：本章讨论的几乎每一个具名客户或伙伴——Hengbot、Narwal、Vbot 和 Beijing Innovation
              Center——都位于中国具身 AI 生态内，因此即便 OEM 品类组合保持多元，国内政策或出口管制变化也可能对客户基础产生不成比例的影响。在 D-Robotics
              或具名伙伴披露留存、续约或集中度数字之前，已报告增长率的耐久性——以及 200,000 名开发者漏斗顶部与少数可独立佐证商业部署之间的落差——仍是本章最核心的未解尽调问题。
