      - number: '5.4'
        title: 成熟度、部署与发布证据
        blocks:
          - type: paragraph
            body: >-
              公开成熟度证据最强的地方在文档、分支、课程和持续生态维护。rdk_x5 分支被明确标为 RDK X5 的主交付分支，S100 硬件文档页则说明内容在 2026 年 6
              月迁移到新的文档中心，而不是被弃置。课程流显示有专门的 X5 ISP 和 S100 ISP 培训，也有较早的 YOLOv5
              和工具链课程，并且互动量不低。这就是一个活着的开发者平台应有的样子：不像消费级电器那样打磨完美，但在持续维护。


              但公开成熟度不等于企业级资质。当前最好的证据是版本迁移、培训刷新、示例广度和使用案例，而不是正式认证包或基准测试记分卡。买方可以推断 D-Robotics
              在积极维护平台；尽调团队仍无法仅凭已抓取页面推断确定性性能边界或生命周期保证。
