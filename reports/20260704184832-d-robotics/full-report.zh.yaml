      - number: '8.2'
        title: 建议、置信度和出价纪律
        blocks:
          - type: paragraph
            body: >-
              我们将 D-Robotics
              评级为「跟踪」，置信度中等，估值立场为「合理」。这不是「公司不好、回避」的结论。公司拥有足够的产品宽度、融资能力和机器人赛道窗口，值得留在主动观察名单上。但它也还不是一个清晰的「买入」，因为价格无法和公开单位经济性挂钩。在半导体加系统业务里，这比纯软件更重要，因为产品、支持和生态投入会一起扩张。


              因此，出价纪律应按里程碑推进。只有在 D-Robotics
              证明有国际说服力的客户采用、软件变现以及围绕烧钱和毛利率的更干净披露之后，投资者才应愿意支付更高价格。在此之前，「合理」是最平衡的立场：说便宜过于慷慨，因为平台范围和已募集资本已经支撑了有意义溢价；说过高又过于严厉，因为公司相较未来可能追赶的公开平台，规模仍明显更小、证明也更少。
