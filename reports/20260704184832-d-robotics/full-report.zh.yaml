  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与变现姿态
        blocks:
          - type: paragraph
            body: >-
              D-Robotics 公开呈现出的商业姿态，更像赋能型平台供应商，而不是机器人 OEM。最清晰的外部描述来自
              36Kr：公司不打算制造机器人本体，而是想成为许多机器人厂商共用的软硬件底座。这个定位与已抓取的官方触点一致：公司把 RDK X5 和 RDK S100 推为开发与算力平台，发布 TogetheROS.Bot
              手册，维护大型 GitHub 组织，并运营围绕 BPU 的模型库。合在一起看，可见栈暗示了三层可变现空间：硬件套件和算力模块、软件 / 工具链赋能，以及伙伴 / 开发者生态服务。


              缺失的一环是价格兑现。公开页面展示了产品能力和上手材料，但没有给出标价、折扣区间、附加销售率或经常性软件合同条款。因此，最站得住的财务解读是结构性的，而不是定量的：D-Robotics
              看起来通过开发者入口和下游平台采用变现，但公开来源尚未说明收入中有多少来自开发板销售、芯片 / 模块项目或软件挂钩服务。
