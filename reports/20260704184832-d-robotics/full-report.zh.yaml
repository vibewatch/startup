        - 决定真实入场经济性
        - 公司 / 法律顾问
      - - 现金续航
        - 现金余额、月度现金消耗、下一轮融资时间
        - 决定下行风险和议价能力
        - 公司 / 财务
      - - 利润率
        - 按芯片、套件和软件 / 服务层拆分的毛利率
        - 决定平台价值是复利还是流失
        - 公司 / 财务
      - - 客户质量
        - 具名量产客户、留存、按地区的集中度
        - 决定生态牵引是否转成可持续收入
        - 公司 / GTM
      - - 供应链
        - 代工、封装、EDA 与出口链依赖
        - 决定地缘政治折价和韧性
        - 公司 / 运营
      - - 软件变现
        - 付费支持、工具许可证或附加经济性
        - 决定平台广度是否配得上溢价倍数
        - 公司 / 产品
    notes: 没有这些输入，公允价值只能表达为区间，而不是精确的当前估值。
