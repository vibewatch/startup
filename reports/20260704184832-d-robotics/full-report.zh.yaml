      - - Cambricon
        - 中国公开 AI 芯片可比公司
        - CNY 850.08B / ~$125.60B 市值信号
        - 公开市场热度信号
        - 显示 AI 芯片情绪能热到什么程度
        - 过度亢奋、覆盖过宽，不适合作为基准情景可比公司
    notes: 这个可比组合混合了一个干净的公开功能可比、一个母公司平台锚、一个动量很强的中国公开可比，以及一个私募融资类比，因为不存在完美一一对应的公开机器人芯片可比公司。
