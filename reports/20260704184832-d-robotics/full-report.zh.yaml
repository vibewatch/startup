      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强的增长驱动并不是某一种机器人形态，而是三个问题的汇合：云原生复杂度、对高效推理的需求上升，以及物理系统中实时安全控制的必要性。Renesas、Ambarella、TI 和 MediaTek
              都在强调低功耗、视觉 AI、连接能力或可安全落地的运动控制中的某种组合，说明市场扩张来自机器人现在每瓦都需要更多本地智能。与此同时，多重约束会限制 D-Robotics 这类供应商能抓住多少机会。GKE
              Autopilot 和 Karpenter 等原生工具会削掉部分第三方需求。OpenShift 成本管理等平台套件能在既有环境中提供可视化和费用回显。公开来源也仍无法精确拆出中国专属边缘机器人
              SAM。结果是：这个市场有清晰的结构性增长，也有替代风险、品类边界模糊和真实的测量不确定性。
