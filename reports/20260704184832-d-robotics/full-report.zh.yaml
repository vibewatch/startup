      - number: '3.2'
        title: 竞品画像与买方决策标准
        blocks:
          - type: paragraph
            body: >-
              买方决策不只看 TOPS。D-Robotics 能讲出连贯的机器人故事，因为 RDK X5、RDK S100、TogetheROS.Bot、GitHub 文档、NodeHub
              和社区触点共同压缩了从评估到跑通机器人演示的时间。对重视中间件、示例代码、传感器包和小板卡形态的开发者来说，这个栈有意义。NVIDIA 赢在光谱的另一端：更宽的 Jetson 梯队，以及面向人形机器人、智能体
              AI 和重型多传感器负载设计的 Thor 路线图。Qualcomm 处在移动基因嵌入式 AI 与机器人参考套件之间；Ambarella 强调低功耗计算机视觉，Renesas 强调视觉加电机控制、联网和安全，TI
              强调系统级人形机器人需求，MediaTek 则把 Genio 放在成本敏感的 IoT 和边缘 AI 设备中。实际采购时，买方会比较每瓦性能、ROS 与 SDK
              成熟度、电机控制相邻能力、摄像头和传感器支持、价格透明度、伙伴可得性，以及必须由自己承担多少定制集成。
