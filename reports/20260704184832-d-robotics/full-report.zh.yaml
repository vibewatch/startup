companyProfile:
  summary: >-
    D-Robotics（地瓜机器人）是一家总部位于北京的边缘 AI 芯片与机器人基础设施公司，2024 年 1 月从 Horizon Robotics 的 AIoT 部门分拆出来。公司打造自研 Brain Processing
    Unit（BPU）、RDK 硬件开发套件（X5 为 10 TOPS；S100 为 80–128 TOPS）、TogetheROS.Bot 机器人操作系统，以及 NodeHub
    开放应用市场。它的市场进入策略押注开发者生态：注册开发者超过 100,000、GitHub 仓库 229 个、开源算法超过 200 个，并以 OEM 伙伴计划切入人形机器人、陪伴机器人和自动化机械。公司在 2025 年 5 月完成
    $100M A 轮，2026 年初合计完成 $270M B 轮（B1 + B2），投资方包括 Didi Global、Meituan Long-Z Fund、Prosperity7 Ventures、GL
    Ventures、Vertex Growth 和 5Y Capital。D-Robotics 被列入 2025 中国独角兽观察报告新增独角兽。最近披露期内，出货量同比约增长 180%，客户数约增长 200%。
