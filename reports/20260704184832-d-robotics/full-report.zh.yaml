      - number: '8.3'
        title: 融资背景、进入纪律和融资条款风险
        blocks:
          - type: paragraph
            body: >-
              最站得住脚的融资结论很清楚，但并不完整。D-Robotics 在 2026 年募集了足够可见的资本，近期不会显得资金不足；单凭这一点，它已经区别于许多更早期的私有边缘 AI
              供应商。与此同时，公开记录仍未揭示这些轮次的确切投后估值、优先权结构或下行保护。也就是说，投资者被要求对头条式动能作出反应，却缺少判断普通股进入经济性是否真正有吸引力所需的保护。


              公开可比公司在这里主要是纪律工具。Ambarella 和 Horizon 证明，投资者最终会奖励边缘 AI 平台，但前提是这些平台接受申报级披露和公开市场审视。D-Robotics
              还没到这一步。因此，进入纪律应聚焦轮次结构、烧钱与跑道的关系，以及下一轮融资更可能来自证明，还是来自希望。没有这些答案，合理估值区间比任何单点估值更有用。
            claimRefs:
              - CV001
