      - number: '6.3'
        title: 扩张飞轮：DGP 项目、开发者社区与布道者网络
        blocks:
          - type: paragraph
            body: >-
              D-Robotics 运营着一套刻意设计的漏斗顶部扩张机制，独立于具名 OEM 订单。Robotics Dream Keeper Challenge
              提供四阶段晋级（Explorer、Builder、Creator、Core Developer），包括导师指导、$1,000 大奖和购买 RDK X5
              的现金返利，明确要把爱好者开发者转化为重复购买硬件的用户。公司还举办了与 Make: Magazine 编辑 David Groom 联合推广的线上“RDK X5 Show & Tell”活动，并送出一台
              Elephant Robotics myCobot 280 机械臂来拉动参与；其开发者门户 API 显示 2026 年项目仍在活跃，包括一项 Smart Healthcare
              挑战赛道，嵌入全国大学生智能汽车竞赛，报名开放到 2026 年 8 月。D-Robotics 社区页点名了五位代表品牌参与活动和线上传播的“机器人布道者”，其中包括 Frank Fu，被描述为 Navbot
              CEO。不过，这段关系也说明采用质量上的一个重要差别：NavBot 自己的主页把其四足和 STEM 机器人产品营销为“NVIDIA Jetson Powered”，公开产品信息从未提到 D-Robotics 或
              RDK 硬件。因此，Fu/Navbot 联系更像社区触达或布道者关系，而不是 Navbot 在自有产品中出货 D-Robotics 芯片的确认证据。D-Robotics
              自己门户上的开发者案例展示，在更大范围内强化了同样的谨慎判断：列出的几十个项目绝大多数是面向竞赛或个人学习的学生和爱好者投稿，而不是付费商业部署。因此，这个扩张飞轮是真实且活跃的社区建设机制，但它是未来商业关系的管线，不能替代具名、带收入客户证据。
