      - number: '3.3'
        title: 切换成本、分销力量与替代品
        blocks:
          - type: paragraph
            body: >-
              只有当机器人团队已经押注某个技术栈之后，切换成本才会上升。采购早期，多栈并行是可行的，因为开发者可以混用 ROS2 工作流、云工具、传感器供应商和参考套件，同时保持应用逻辑可迁移。之后，成本会围绕开发板 I/O
              假设、加速器专属模型工具、中间件包、调试习惯和渠道关系上升。这种动态有利于拥有广泛全球渠道和已知 OEM 信誉的既有玩家。NVIDIA 在高端最有生态引力，Renesas 和 TI
              等工业供应商则受益于长期控制、安全和联网关系。D-Robotics 也有对冲因素：开放 GitHub 触点、兼容 ROS
              的中间件、开发者示例、社区上手路径，以及日本零售和第三方产品采用带来的至少一些外部渠道证明。但现状替代品仍然真实存在。基础设施团队可以先用 Autopilot、Karpenter
              或内部自建路径解决部分运营问题，直到机器人出货量或延迟需求逼近临界点，再决定是否引入新的专用平台供应商。
