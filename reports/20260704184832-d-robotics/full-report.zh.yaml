    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位、产品边界与机器人技术栈
        blocks:
          - type: paragraph
            body: >-
              D-Robotics 给自己的定位不是单板供应商，而是机器人基础设施公司。当前英文官网和产品页把开发者硬件、操作系统或中间件层、应用示例和部署工具都收进 RDK
              体系。虽然命名还在演进，公开硬件叙事已经清楚：RDK X5 主打 10 TOPS 机器人与边缘智能开发板，RDK S100 则定位更高端的具身智能平台，围绕 BPU Nash 以及 CPU+BPU+MCU
              的感知、决策、控制分工搭建。软件层也比典型设备厂商的支持页厚得多。TogetheROS.Bot、NodeHub、RDK Studio 和公开文档仓库显示，D-Robotics
              想把开发者工作流从模型适配、传感器集成一路管到基于 ROS2 的机器人应用开发。这种组合与公司公开定位一致：为更小形态机器人提供低功耗边缘推理方案，替代更笨重的通用 GPU 栈。
