      - number: '5.6'
        title: 技术风险、信任缺口与尽调问题
        blocks:
          - type: paragraph
            body: >-
              公开负面证据是实际使用层面的，而不是根本性的。近期论坛主题显示，用户仍会遇到 CAN FD 问题、掉帧、GPIO 接触问题、gdc-tool
              下载链接缺失和模型转换精度疑问。首次上手仍需要外部教程。这些对一个活跃开发者平台来说正常，但很重要，因为它们暴露了集成成本仍会回流到客户身上的位置。它们也暗示，D-Robotics
              的产品成熟度仍部分依赖社区排障，而不完全是开箱即用体验。


              更大的信任缺口是披露完整性。已抓取来源没有披露正式的正常运行时间承诺、安全证明、可下载审计包，也没有一张工业买方能直接塞进供应商记分卡的清晰基准测试表。D-Robotics
              对严肃试点和伙伴主导建设看起来很强。若要支撑量产级技术尽调，它仍需要在可靠性、认证范围和确定性性能上拿出更深的公开证明。
