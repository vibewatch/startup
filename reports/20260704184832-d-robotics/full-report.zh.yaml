      - number: '7.3'
        title: 具身 AI 商业化疑虑、泡沫风险和中国产业政策敞口
        blocks:
          - type: paragraph
            body: >-
              中国自己的机器人生态正被两股力量同时拉扯。IFR 2026 年 5 月关于中国第十五个五年规划的简报称，机器人被放在国家产业战略核心；中国已拥有约 2 million 台工业机器人装机基础，约为日本存量的 4.5
              倍，并且按 World Robotics 2025 Report 口径，占 2025 年全球工业机器人安装量的
              54%。这对国内机器人计算供应商是一个可信顺风，但也有反作用：国家主导的产业政策往往会把支持和需求牵引集中到官方认定的「国家队」平台；公开记录尚未显示 D-Robotics
              是这轮推进里的优先受益者，还是只是众多争夺同一政策相关需求的国内供应商之一。


              叠在政策顺风之上的，是公司无法控制的需求时点风险：人形机器人和具身 AI 商业化疑虑。TechCrunch 转述机器人学家 Rodney Brooks
              的批评，认为当前人形机器人路径建立在关于灵巧度和安全物理约束的「纯粹幻想式思维」之上，并预测真正的人形机器人实用性到来时间会比今天资本市场假设得更久。另据 Robotics & Automation News
              报道的 CB Insights 数据，人形机器人在最近一个季度已经拿下所有 AI 垂直赛道中单一类别最高的 VC 交易量，同时投资者也明确警告泡沫，并呼吁坚持「收入优先」纪律。ChinaBizInsider
              2026 年中统计至少 25 家中国具身 AI 独角兽，其中 15 家仅在 2026 年上半年诞生，合计吸收 RMB46 billion (~US$6.39 billion) 已披露融资；每家公司现金跑道只有
              18-24 个月。这意味着 2027-2028 年很可能出现一波整合、降价轮或关停。


              这直接关系到 D-Robotics，因为它的 RDK S100 / BPU Nash 产品线明确面向具身和人形机器人客户。如果人形机器人投资周期在商业化放量前降温，D-Robotics
              可触达的近期需求可能比其更宽的边缘 AI 和 AMR 业务所暗示的收缩得更快；公开记录也没有披露当前出货或在手订单中，有多少绑定人形机器人需求，多少来自更耐久的工业、AMR
              或行车记录仪需求。另一个独立问题是，未发现任何公开标准机构或监管方在机器人安全、互操作性或认证语境中点名 D-Robotics；这留下的是一个待尽调事项，而不是已确认的合规缺口。
