      - number: '5.5'
        title: 差异化与生态触达
        blocks:
          - type: paragraph
            body: >-
              D-Robotics 的差异化不在某个单一头部参数，而在周边生态密度。GitHub 组织公开了 229 个仓库，模型库覆盖从分类到 OCR 和多模态任务，DGP 页面明确要压缩机器人 MVP
              时间，合作伙伴动态把平台连接到传感器、教育机器人、陪伴机器人和具身系统。开发者案例流进一步证明，第三方正在这个栈之上做出真实作品，而不只是阅读营销页。


              这并不意味着 D-Robotics 是唯一尝试打包模块、开发套件、软件和伙伴的公司；NVIDIA Jetson 显然是这条全栈边缘 AI 路线的标尺。但已抓取的 2026
              年来源确实支持一个有差异的本地论点：D-Robotics 正把机器人原生、BPU 优先的平台推入具身和教育场景，并拥有可见的中文社区密度和伙伴宽度。
