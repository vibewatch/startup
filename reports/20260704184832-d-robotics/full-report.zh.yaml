      - number: '6.2'
        title: Hengbot、Narwal、Insta360 与 Tiangong 3.0 的实名客户证据和采用轨迹
        blocks:
          - type: paragraph
            body: >-
              最强的公开客户证据来自两个联名产品发布。D-Robotics 自己的博客点名 Hengbot 的 Sirius 机器狗运行一颗最高 5 TOPS 的 RDK X3 AI 头部模组，这一规格也能在
              D-Robotics 的 RDK X3 产品页独立匹配；Hengbot 自己的主页显示，截至运行日，该活动已获得 1,150 名支持者和 $912,768 众筹金额——不过原始活动的两个公开索引
              Kickstarter URL 都返回 HTTP 404，因此众筹一手记录本身无法独立恢复。Elephant Robotics 的 myCobot 280 RDK X5 是第二个围绕 D-Robotics RDK
              X5 开发板打造并商业销售的实名产品。沿证据强度再往下一步，KrASIA 转载的 36Kr 报道称，D-Robotics 已与 60 多家供应链玩家合作，具体点名 Narwal 的 Xiaoyao 002
              扫地机器人、Insta360 的 Antigravity A1 全景无人机和一款 Vbot 四足陪伴机器人。Narwal 和 Insta360 各自在官网独立确认了真实且庞大的商业足迹（分别为 450
              million 名用户和全球产品线），但两个官网本身都没有点名 D-Robotics，因此两者的芯片归因目前依赖第三方媒体，而不是买方自己的材料。Vbot
              提及更弱：它只是单一媒体引用，未找到佐证来源或产品页。2026 年最重要的进展是 Tiangong 3.0，这是一款全尺寸人形机器人，由 D-Robotics 与 Beijing Innovation
              Center of Humanoid Robotics 围绕 Xuri/Sunrise S600 芯片共同工程开发；Gasgoo 和独立媒体 en.shuziqushi.com（引用 Jiemian
              News）都确认，量产和交付计划在 2026 年下半年进行，成品机器大规模量产后成本预计下降超过 50%。合在一起，采用轨迹证据显示的是：两个成熟联名消费产品、两个仅由媒体确认的 OEM
              关系、一个单一来源且证据薄弱的关系，以及一个尚未产生收入但证据较充分的人形机器人设计导入。投资人不应把这组梯度压缩成一个“具名客户”标题数字。
