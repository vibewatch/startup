  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手 / 类别
      - 品类
      - 规模 / 融资信号
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - D-Robotics
        - 直接技术栈供应商
        - 2026 年 Series B 轮总额约 $270M；分拆信息披露仍有限
        - AMR、人形机器人、边缘 AI 开发者、机器人 OEM
        - 低功耗 BPU 板卡，加 ROS 兼容中间件和开发者工具
        - 公开基准、定价和治理披露仍有限
      - - NVIDIA Jetson
        - 既有物理 AI 平台
        - 全球既有玩家，Jetson 产品梯队宽，Thor 路线图清晰
        - 人形机器人、自主机器、高端边缘 AI
        - 已审阅对象中，可见算力覆盖最宽，物理 AI 软件栈最丰富
        - 对成本敏感的小型机器人项目来说，可能配置过剩或功耗偏高
      - - Qualcomm Robotics RB 系列
        - 嵌入式参考平台竞品
        - 嵌入式平台谱系生命周期长；RB5 公开开发套件价格可见
        - AMR、无人机、嵌入式机器人、IoT
        - 连接能力、对 ROS 友好的 Linux 支持，以及紧凑参考套件定位
        - 已审阅公开材料中，机器人生态牵引力不如 NVIDIA 明显
      - - Ambarella
        - 以视觉为中心的低功耗竞品
        - 公开 AIoT 与机器人 SoC 目录
        - 消费机器人、AGV、机器视觉、物流
        - 强调低功耗 CVflow 计算机视觉和 AI 每瓦性能
        - 端到端机器人中间件叙事窄于 D-Robotics 或 NVIDIA
      - - Renesas
        - 工业机器人既有玩家
        - 工业机器人和人形机器人解决方案组合较宽
        - 工业、移动、协作、家用、人形机器人
        - 视觉 AI 加电机控制、安全、工业网络和 ROS 2 就绪能力
        - 更偏子系统和工业技术栈，而不是单一开发套件叙事
      - - Texas Instruments
        - 子系统与安全既有玩家
        - 控制与模拟业务根基深；公开人形机器人思想领导力
        - 人形与工业机器人设计方
        - 传感器融合、确定性通信、电源和电机控制积累深
        - 已审阅来源没有把它定位成单一机器人计算平台赢家
      - - MediaTek Genio
        - 相邻边缘 AI 平台
        - 覆盖较广的 IoT 边缘平台，有多款伙伴设备
        - 智能设备、工业 HMI、生产力与安全系统
        - 通用边缘 AI 模块可能削弱专用平台需求
        - 已审阅来源中，机器人原生软件栈表述不够明确
      - - 现状 / 内部自建
        - 替代方案
        - 现有集群、云和工程预算
        - 基础设施团队和 OEM 在内部解决部分需求
        - 组合 Autopilot、Karpenter、FinOps 工具和自定义集成，避免供应商锁定
        - 单靠它无法解决机器人本地计算、运动控制或机器人中间件
    notes: 行覆盖直接、既有、相邻和替代类别中最显眼的公开替代方案，而非全球每一家机器人半导体供应商。
