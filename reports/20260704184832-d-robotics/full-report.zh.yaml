      - - 基准
        - ~45%
        - 生态牵引逐步转化；不透明性只部分改善
        - 选择性设计定点，以及更清晰的变现
        - $1.2-1.8B
      - - 牛
        - ~25%
        - 中国以外 OEM 定点、软件附加率和供应链信心都改善
        - 平台不只停留在开发套件，开始可复制
        - $2.2-3.0B
      - - 当前立场
        - n/a
        - 最佳公开证据区间，而不是精确估值
        - 重新评级前等待更硬证据
        - 合理
