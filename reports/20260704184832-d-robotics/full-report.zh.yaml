      - number: '8.5'
        title: 可比公司组和估值背景
        blocks:
          - type: paragraph
            body: >-
              可比公司组提示应谨慎，但不支持直接否定。Ambarella 是功能上最干净的公开可比公司，因为它是一家已披露的边缘 AI 芯片公司，目前估值约 $3.43B。Horizon
              是更具战略意义的上限锚点，因为它是已上市的母平台，规模大得多，当前市值为 HK$68.2B。Cambricon 是可比组里的警示标签：当前公开市场数据把它推到极高水平，因此它能说明 AI
              芯片市场情绪，却不能作为保守估值模板。Kneron 是更干净的私有可比点，因为它披露融资历史并经营全栈边缘 AI，但从可见已融资本看，它仍比 D-Robotics 更早期、规模更小。


              合在一起，可比公司组说明 D-Robotics 应高于简单早期硬件叙事，但低于一家充分披露的公开边缘 AI
              平台。这正是「合理」成为正确中间地带的原因。公司比只有炒作的创业公司更有实质，但公开证明还不足以支撑龙头倍数。
