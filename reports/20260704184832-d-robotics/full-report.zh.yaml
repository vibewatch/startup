        title: 财务结论与投资判断卡点
        blocks:
          - type: paragraph
            body: >-
              从结构看，D-Robotics 有几个正面因素。它卖向宽口径机器人赋能层，而不是单一设备利基；它围绕硬件有可见的软件和社区资产；它也已经募集足够多的后期私募资本，支撑 2026 年继续扩张。NVIDIA
              Jetson 等公开可比平台也说明，边缘 AI 供应商可以靠打包算力、开发套件和软件生态捕获价值，而不只是卖芯片。


              但投资判断卡点很重。公开证据没有揭示实际成交价格、芯片与套件收入结构、软件变现、烧钱速度、现金续航、客户集中度或单位经济性。2026 年 B
              轮投资方身份无法从可访问页面完整恢复，精确估值仍是二手来源估计，而不是公开申报事实。财务上，D-Robotics 更像一个资金充裕但尚未披露关键数据的增长平台：定性模型能看懂，定量可投资性仍未解决。
