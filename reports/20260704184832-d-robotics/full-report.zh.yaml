              D-Robotics 的公开栈足够宽，支撑的是可信平台叙事，而不是单板故事。RDK X5 被呈现为机器人开发套件，具备较强通用 I/O、Ubuntu 22.04
              支持、有线和无线连接，以及创客到原型开发者都熟悉的工作流。RDK S100 在栈中的位置更高，被定位为具身智能算控平台，并明确使用“大脑 +
