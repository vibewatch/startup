      - number: '1.4'
        title: 风险信号与披露缺口
        blocks:
          - type: paragraph
            body: >-
              最大的尽调问题不是缺少动作，而是披露不均。公开证据确认了 2026
              年融资大幅跃升和可信的产品栈，但收入构成、软件授权经济性、董事会控制权，以及总部或法律实体足迹的精确情况，仍留下重大盲区。独立报道还显示，更广义的机器人资本市场正在升温并变得更扭曲。Yicai 2026 年 4
              月的私募股权分析称，资本正涌入机器人等硬科技赛道，同时部分投资人警告估值可能已经处在周期高点，热门轮次的入场还可能要求异常的下一轮承诺或保证金。该信号并不意味着 D-Robotics
              自身有特定问题，但说明公司正在一个融资条款可能快过基本面的市场里扩张。实际含义是，投资人可以把产品和生态牵引力视为真实存在，但在管理层提供更干净的一手数据室前，应暂缓判断估值公允性、收入质量和治理水平。
