            body: >-
              公开材料对公司源流的证据强于正式治理。D-Robotics 没有在英文网站披露完整管理层页面或董事会名单，但独立报道和 Nash BPU 品牌上的技术延续性，都强烈指向它与 Horizon Robotics
              的关系。Horizon 自己的英文介绍页将 Dr. Yu Kai 标为创始人兼 CEO，Yicai 则把 D-Robotics 描述为 2024 年 1 月从 Horizon 的 AIoT
              部门分拆出来的公司。开发者足迹更容易核验。GitHub 显示它有一个大型公开组织，仓库数以百计，并明确包含 RDK OS、模型库、摄像头和机器人栈项目。围绕 TogetheROS.Bot 和 NodeHub
              的文档说明，D-Robotics 面向的是生态开发者和 OEM 伙伴，而不只是内部参考设计。LinkedIn 提供了中等规模团队信号：员工区间为 51-200，关注者数千；Discord、YouTube
              和社区页等公开社区触点，也显示公司持续招募布道者、创客和创业团队。这些信号不能证明市场主导地位，但确实显示出一套有意推进的国际化开发者获客动作。
