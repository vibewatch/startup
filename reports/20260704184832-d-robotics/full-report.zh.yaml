  - id: TV005
    title: 论点击穿与否决触发点表
    columns:
      - 触发点
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 证明前融资
        - 收入质量或利润率可见前就需要新一轮融资
        - 说明资本强度跑在证明前面
        - 将区间移向熊情景
      - - 无国际量产定点
        - 到下一轮融资周期仍无可信海外 OEM 证明
        - 全球标准论点弱化
        - 下调溢价和退出假设
      - - 出口管制冲击
        - 关键供应商或工具路径受到实质性约束
        - 地缘政治折价扩大
        - 重新测算整个可比公司组合
      - - 支持负担持续
        - 板卡 / 工具链摩擦跨版本仍可见
        - 软件护城河论点弱化
        - 假设长期利润率更低
      - - 私募估值跑过已披露证明
        - 披露未追上，估值却开始接近公开可比公司区间
        - 合理变成偏贵
        - 不追轮次
    notes: 这些具体事件最可能击穿当前公允价值立场。
