    rows:
      - - D-Robotics RDK S100 开发套件
        - 日本零售价 ¥102,300
        - 80 TOPS BPU Nash 板卡，聚焦机器人开发，配件生态
        - 仅有板卡零售价；无公开 SDK 授权或量产芯片价格
        - 对开发者入门验证有用，但不足以证明量产经济性
      - - D-Robotics RDK X5
        - 已审阅材料中未清晰披露
        - 10 TOPS 机器人 / 边缘 AI 套件，带软件生态
        - 本章材料未直接审阅到公开价格
        - 限制入门成本的同口径对比
      - - Qualcomm RB5 核心 / 视觉套件
        - $485 核心套件；$695 视觉套件
        - 15 TOPS 机器人开发套件，支持 Linux、Ubuntu、ROS 2 和连接能力
        - 较早参考平台快照；量产价格不可见
        - 说明 Qualcomm 历史上曾以透明开发套件价格参与竞争
      - - Qualcomm RB3 Gen 2
        - 公开套件打包可见；已审阅来源没有给出清晰价格摘录
        - 12 TOPS QCS6490 平台，配摄像头和传感器
        - 无法从已审阅材料确定当前套件价格
        - 评估阶段有竞争力，但不足以支撑 TCO 论证
      - - NVIDIA Jetson Orin / Thor
        - 公开产品页更强调性能和伙伴，而非价格
        - Jetson 梯队覆盖面广，从较小 Orin 模块到面向人形机器人的 Thor
        - 定价需要在已审阅核心页面之外查询伙伴或渠道
        - 渠道覆盖宽度可能比标价更重要
      - - 现状工具
        - Autopilot 按用量计价，Karpenter 开源，FinOps 工具包开源
        - 无需专门机器人供应商即可获得基础设施自动化和成本控制
        - 不覆盖机器人本地计算和控制层
        - 替代方案试用成本低，可能推迟专门供应商采用
    notes: 已审阅公开材料在开发套件定价上远比在量产模块、SDK 或企业合同经济性上更充分。
