      - number: '5.2'
        title: RDK X3 到 S600 的硬件梯队与平台工具（NodeHub、RDK Studio）
        blocks:
          - type: paragraph
            body: >-
              公开目录呈现的是分层硬件梯队，而不是单一开发板。RDK X3 是 D-Robotics 的入门层——一个四核 Cortex-A53 模块，配备双核 Bernoulli 架构 BPU，额定 5 TOPS，支持 4K
              编解码，载板形态兼容通用机器人底盘。RDK X5 位于其上，推理预算约翻倍（10 TOPS），无线 I/O 也更丰富。RDK S100 进一步抬高上限，采用本章其他部分描述的 CPU+BPU Nash+MCU
              分工；D-Robotics 还公开宣布了作为梯队顶端的 RDK S600：一款 560-TOPS（INT8）算力平台，在 DDC 2025 大会上发布，面向具身智能负载，目标 2026
              年初上市，并明确围绕边云协同而不是纯端侧算力来定位。

              两个工具触点包裹着这条硬件梯队。NodeHub 是 D-Robotics
              公开的“智能机器人应用中心”——一个即取即用节点和算法示例目录（视觉巡线、室内服务机器人导航、机械臂演示），公司称大约一分钟即可跑通部署，项目源码也公开发布在 GitHub。RDK X3 和 RDK S100
              营销页都直接引用了这个目录深度，从 X3 发布时的“100+ 开源算法和应用”，发展到 S100/DDC-2025 阶段的“200+ 开源算法和应用演示”。RDK Studio 是第二个触点：一款“AI
              原生工作台”桌面工具，可烧录和管理 RDK X3、X5、S100/S100P 开发板，也能通过 SSH 连接通用 Linux 主机、NVIDIA Jetson、Raspberry Pi 和 Rockchip
              开发板，提供范围更窄的 RDK 专属功能，并提供一条受 SSH 或网络可达性约束的“OpenClaw”端侧部署路径。合在一起，硬件梯队和工具强化了同一套平台论点：D-Robotics
              卖的是一段可逐级上探的算力范围，以及配套部署和算法工具，而不是一块旗舰板。
            claimRefs:
