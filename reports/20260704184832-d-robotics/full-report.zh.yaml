  productSummary: >-
    核心产品分三层：（1）边缘 AI 芯片——BPU Nash 架构，在 S100 平台提供 80–128 TOPS，在 X5 提供 10 TOPS，覆盖 5–128 TOPS 性能区间；（2）开发者套件——RDK X5 和 RDK
    S100 开发板，支持 Ubuntu 22.04、兼容 ROS2，并提供多传感器 IO；（3）软件栈——TogetheROS.Bot（兼容 ROS2 的 RTOS，支持零拷贝通信和硬件加速 CV）、NodeHub（开放应用中心）以及
    200+ 算法模型库。
  customerFocus: 面向人形、陪伴、服务和物流机器人的机器人 OEM；嵌入式 AI 系统集成商；基于 BPU 开发者平台搭建项目的高校与创业开发者。
  businessModel: 硬件销售（芯片 + 开发套件）、潜在的软件授权和云开发者服务，以及 OEM 在量产机器人中采用 BPU 芯片后形成的生态收入模式。
