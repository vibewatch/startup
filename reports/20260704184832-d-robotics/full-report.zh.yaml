              - CV039
      - number: '8.7'
        title: 图表
        blocks:
          - type: callout
            title: 跟踪平台，不追逐轮次传闻
            body: D-Robotics 在战略上足够有意思，值得密切观察；但公开证据目前只支持一个合理估值区间，而不是一个应被积极追逐的精确私募估值。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV021
              - CV022
              - CV033
              - CV040
          - type: callout
            title: 公开可比公司有帮助，但必须大幅折价后使用
            body: >-
              Ambarella 和 Horizon 证明已披露的边缘 AI 平台可以有多高价值，但 D-Robotics 还没有赢得公开市场式透明度，也没有解除地缘政治风险折价。与此同时，Cambricon
              动量属性太重，不能作为干净的基准锚点。
            calloutType: risk
