      - 类型
      - 估值 / 状态
      - 证明强度
      - 适用性
      - 局限
    rows:
      - - D-Robotics
        - 标的公司
        - 近期 B 轮融资 $270M；确切投后估值未验证
        - 产品与融资信号强，公开经济性弱
        - 直接投资测算对象
        - 当前精确估值未获公开确认
      - - Kneron
        - 非上市边缘 AI 可比公司
        - $97M B 轮；总融资 >$190M
        - 非上市融资历史已披露
        - 最接近的非上市全栈边缘 AI 类比
        - 融资额不等于当前估值
      - - Ambarella
        - 公开边缘 AI 可比公司
        - $3.43B 市值
        - 公开申报文件和市场数据
        - 功能上最接近的公开芯片可比公司
        - 公开市场流动性和披露溢价
      - - Horizon Robotics
        - 公开母公司 / 平台锚
        - HK$68.20B 市值
        - 已上市、有披露、规模更大的平台
        - 有用的上界和母公司背景锚
