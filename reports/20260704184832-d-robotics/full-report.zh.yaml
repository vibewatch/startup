      - number: '8.4'
        title: 乐观、基准和悲观情景
        blocks:
          - type: paragraph
            body: >-
              D-Robotics 仍然披露很轻，因此情景分析比点估值更好用。悲观情景下，公司仍是有前景的技术平台，但在收入质量或出口链韧性令人信服之前就必须再次融资；这指向更接近低于 $1.1B
              的结果。基准情景下，D-Robotics 持续把生态牵引转化为进展，保持融资渠道，并逐步改善变现证明，但仍没有完全摆脱不透明；这支撑约 $1.2-1.8B
              区间。乐观情景下，公司证明中国之外的量产客户，展现真实软件或模块变现杠杆，并降低地缘政治折价；届时 $2.2-3.0B 区间会更可信。


              关键不是精确到小数点，而是路径依赖。今天的价值更多由未来里程碑驱动，而不是当前财务产出。因此，「合理」立场可以和有意义的上行空间并存，前提是投资者对下一个估值档位必须满足什么条件保持纪律。
