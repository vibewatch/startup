      - number: '5.3'
        title: 架构与算控设计
        blocks:
          - type: paragraph
            body: >-
              已抓取来源中最有辨识度的技术主张是 S100 架构。D-Robotics 不只是营销更多 TOPS，而是描述了一种横跨 CPU、BPU Nash 和 MCU
              资源的算力分工，让感知、规划和关节级控制不必都挤在同一个处理器预算里。公开文本称，BPU Nash 承担 80/128 TOPS，支持超过 160 个 ONNX 算子，并针对 CNN 和 Transformer
              优化；Arm Cortex-R52+ MCU 资源则处理低延迟执行。相比之下，RDK X5 更像经典边缘 AI 开发板，提供丰富 I/O 和无线接口用于原型开发。


              软件架构补上了这套分工。TogetheROS.Bot 展示安装、ROS2 包使用、SLAM
              和语音控制演示，模型库则记录转换、量化、推理和验证流水线。结果是一张相当具体的公开架构图：底层是异构硬件，中间是机器人中间件，上层是以 BPU 为中心的模型工具。
