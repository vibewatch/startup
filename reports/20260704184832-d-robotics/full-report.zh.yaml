      - number: '2.2'
        title: 规模测算视角与受约束的 TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              公开市场规模只有在视角明确时才有用。MarketsandMarkets 给出宽口径 Cloud FinOps 框架，The Business Research Company 提供窄得多的 Kubernetes
              成本管理视角，Verified Market Reports 则给出单独的云成本优化预测。没有一个口径能完美映射到
              D-Robotics，因为它一部分落在软件效率里，一部分落在机器人专属边缘算力里。这意味着，直接拿一个大标题数字会夸大确定性。更好的方法是把宽口径报告当作外层 TAM
              边界，再把可服务市场收窄到那些除成本和编排功能外，还需要本地机器人推理、实时控制或全栈开发工具的买方。这样得到的 2026 SAM 区间更克制但更可信，大致在低个位数十亿美元；第三方供应商可拿到的 SOM
              还会更小，因为原生工具和既有平台套件会吃掉一部分预算。
