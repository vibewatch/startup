  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 细分：消费级机器人 OEM、DGP 创业公司与机构型人形机器人买方
        blocks:
          - type: paragraph
            body: >-
              D-Robotics 的公开客户记录横跨五个不同买方触点，而不是一个清晰的企业理想客户画像。公司自己的关于页面把核心商业关系定义为覆盖人形机器人、陪伴机器人、扫地机器人和割草机器人的 OEM 合作；CEO
              Wang Cong 对 36Kr 表示，当前出货量仍依赖大众市场品类——扫地机、割草机和陪伴机器人——而不是具身智能或人形机器人订单，后者被他界定为更早期、周期更长的押注。叠加在这个 OEM 基础之上的是
              D-Robotics Gravity Program（DGP）：公司称该加速器已经支持 200 多家早期机器人公司，产出 100 多个机器人产品品类；其开发者门户 API 还独立列出 9
              个实名合作伙伴，覆盖教育机器人、可穿戴设备、高尔夫球童机器人和智能健身。第三个触点是 Beijing Innovation Center of Humanoid Robotics
              这类机构型人形机器人买方，该机构正在围绕 D-Robotics 的 Xuri S600 芯片联合开发 Tiangong 3.0 人形机器人。第四个触点是 Yicai 和 D-Robotics 自己的
              myCobot 博文都提到的 100,000+ 全球开发者社区；第五个触点则是 Insta360 支持的 Antigravity 团队等消费级无人机和影像伙伴。每个触点的买方—用户—付款方逻辑都不同：OEM
              采购芯片并把成本传导给终端消费者；DGP 成员实际以购买硬件以及股权 /
              注意力资源付费，而不只是现金；机构型人形机器人买方共同投入工程时间；开发者社区则多以免费或低价硬件为主，并不会成为具名商业账户。这种宽度在战略上是正面的，因为它降低了对单一机器人品类的依赖，但也意味着“客户”必须拆开理解：社区门户上的开发者案例投稿绝大多数是未付费的学术或创客项目，而不是商业买方；D-Robotics
              自己“全球数百万用户”的表述，也部分借用了 Narwal 等下游 OEM 品牌的规模，后者独立报道的 450 million 名用户属于 Narwal，而不是 D-Robotics 自己可归因账户。
