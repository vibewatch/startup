      - number: '7.2'
        title: 地缘政治、出口管制和供应链风险
        blocks:
          - type: paragraph
            body: >-
              地缘政治是这份材料里最清晰的非公司特定风险之一。BIS 2026 年 5 月 31 日指引明确表示，先进计算物项流向总部位于 Country Group D:5 或 Macau
              的实体时，即便该实体位于这些地区之外，仍需要许可证。WilmerHale 2025 年分析补充说，AI Diffusion Rule 可能已被暂停，但围绕中国相关 AI
              出口、支持活动和转运筛查的执法姿态变得更敏感，而不是更宽松。另一份 WilmerHale 备忘录显示，晶圆厂和 OSAT 封测厂现在面临更重的尽调和审批负担，且这些负担会在 2026 年进一步加硬。


              对 D-Robotics 来说，公开资料并未证明发生过直接制裁事件。风险更隐蔽，也因此更重要：如果与中国相关的机器人和边缘 AI
              项目更难获得服务，全球供应商即便没有看到直接点名公司的禁令，也可能放慢工具、芯片、封装或支持交付。现有证据也没有足够清楚披露 D-Robotics
              的代工或封装链，无法量化台湾或其他外部卡点敞口。因此，任何长期承保判断都要保留一层有分量的地缘政治压力。


              管制体系还在叠加，并非静止不动。BIS 2025 年 3 月将 80 家实体加入 Entity List，理由是这些实体参与与中国军工复合体相关的先进 AI、超级计算和高性能芯片活动；此前 2024 年 12
              月的一揽子规则中，Torres Trade Law 称已新增 140 家实体和 16 项 Footnote-5 指定，并引入新的 Foreign Direct Product
              规则和许可证例外。Congressional Research Service 2025 年 9 月更新把这放在美国多年努力的一部分：拖慢中国提出的 2030 半导体自给目标。BIS 自己的 2024 年 12
              月晶圆代工规则也要求封装厂在出货某些先进芯片前，核验晶体管数量，或持有 Approved/Authorized IC-designer 或 OSAT 身份。TrendForce
              数据另行显示，美国对允许进入中国的芯片有意维持一到两代（「N-1」/「N-2」）性能差距；与此同时，晶圆产能和 HBM 瓶颈仍在约束中国 AI 芯片厂商，即便其国内市场份额预计 2026 年接近
              50%。这些来源都没有直接点名 D-Robotics，但每一轮新规则都会扩大需要额外筛查的交易对手、封装伙伴和工具供应商范围；这种累积效应，比任何单一规则更构成长期风险。
