              正在搭建全栈机器人平台：芯片、套件、软件手册、培训内容、社区支持和伙伴计划。这些动作都意味着持续的研发、生态和支持开支。缺少账上现金、烧钱速度、库存和毛利率披露时，审慎结论只能是：近期 B
