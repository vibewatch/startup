      - number: '7.4'
        title: 市场集中、渠道依赖和支持风险
        blocks:
          - type: paragraph
            body: >-
              市场扩张风险的核心，不是 D-Robotics
              能否在中国之外卖出产品，而是它当前拥有怎样的国际足迹。经销商页面令人鼓舞，因为它显示公司在多个亚洲和欧洲国家有可见转售覆盖。但同一页面也是一个警示：足迹仍主要由经销商驱动，配件页面也把外设履约导向本地分销商。这是非常正常的早期渠道设计，但弱于直接现场团队、具名全球
              OEM 部署和已发布的国际客户背书。


              支持面也强化了这一谨慎判断。2026 年 7 月初的公开论坛活动显示，围绕 CAN FD、GPIO、掉帧、模型转换和 S100
              启动行为存在真实问题。这证明产品确实有人在用，但也意味着运营复杂度已经公开显现。再叠加公开上手界面浓厚的教育和开发者导向，结论是一家公司拥有健康的生态活力，但国际变现深度仍不确定。投资者因此应把可见社区参与和已证明的海外收入多元化分开看。
