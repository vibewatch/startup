      - number: '5.2'
        title: Hardware tier ladder and platform tooling (RDK X3 to S600, NodeHub, RDK Studio)
        blocks:
          - type: paragraph
            body: >-
              The public catalog is a tiered hardware ladder rather than a single board. RDK X3 is D-Robotics’ entry
              tier — a quad-core Cortex-A53 module with a dual-core Bernoulli-architecture BPU rated at 5 TOPS, 4K
              encode/decode, and a carrier-board form factor compatible with generic robot chassis. RDK X5 sits above it
              with roughly double the inference budget (10 TOPS) and richer wireless I/O. RDK S100 raises the ceiling
              again with the CPU+BPU Nash+MCU split described elsewhere in this chapter, and D-Robotics has publicly
              announced RDK S600 as the top of the ladder: a 560-TOPS (INT8) compute platform unveiled at the DDC 2025
              conference for embodied-intelligence workloads, targeted for an early-2026 launch and explicitly framed
              around edge-cloud collaboration rather than pure on-device compute.

              Two tooling surfaces wrap around that hardware ladder. NodeHub is D-Robotics’ public "intelligent robotics
              application center" — a catalog of ready-to-deploy nodes and algorithm examples (visual line patrol,
              indoor service-robot navigation, robot-arm demos) that the company says can reach a working deployment in
              about a minute, with project source published openly on GitHub. RDK X3 and RDK S100 marketing pages both
              cite this catalog depth directly, moving from "100+ open source algorithms and applications" at X3 launch
              to "200+ open-source algorithms and application demos" by the S100/DDC-2025 period. RDK Studio is the
              second surface: an "AI-native workbench" desktop tool that flashes and manages RDK X3, X5, S100/S100P
              boards and can also reach generic Linux hosts, NVIDIA Jetson, Raspberry Pi, and Rockchip boards over SSH
              for a narrower set of RDK-specific functions, plus an "OpenClaw" on-device deployment path gated by SSH or
              network reachability. Together, the ladder and the tooling reinforce the same platform thesis: D-Robotics
              is selling a graduated compute range plus the deployment and algorithm tooling to move up it, not a single
              flagship board.
            claimRefs:
