  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization posture
        blocks:
          - type: paragraph
            body: >-
              D-Robotics’ public commercial posture is much closer to an enabling platform vendor than to a robot OEM.
              The clearest outside description comes from 36Kr, which says the company does not intend to manufacture
              robot bodies and instead wants to become the shared soft/hardware base for many robot makers. That
              positioning is consistent with the fetched official surfaces: the company markets RDK X5 and RDK S100 as
              development and compute platforms, publishes a TogetheROS.Bot manual, maintains a large GitHub
              organization, and curates a BPU-focused model zoo. Taken together, the visible stack suggests three
              monetizable layers: hardware kits and compute modules, software/toolchain enablement, and
              partner/developer ecosystem services.


              The missing piece is price realization. Public pages expose product capability and onboarding materials,
              but not list prices, discount bands, attach rates, or recurring software contract terms. That means the
              most defensible financial read is structural rather than quantitative: D-Robotics appears to monetize
              developer access and downstream platform adoption, but public sources do not yet reveal what proportion of
