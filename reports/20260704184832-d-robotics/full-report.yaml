chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product Scope, and Robotics Stack
        blocks:
          - type: paragraph
            body: >-
              D-Robotics presents itself as a robotics infrastructure company rather than a single-board vendor. Its
              current English homepage and product pages tie together developer hardware, an operating-system or
              middleware layer, application examples, and deployment tooling under the RDK umbrella. The public hardware
              story is clear even if naming is still evolving: the company markets RDK X5 as a 10 TOPS robotics and
              edge-intelligence board, while RDK S100 is framed as a higher-end embodied-intelligence platform built
              around BPU Nash and a CPU+BPU+MCU split for perception, decision, and control. The software layer is also
              more substantial than a typical device-maker support page. TogetheROS.Bot, NodeHub, RDK Studio, and the
              public documentation repo show that D-Robotics is trying to own the developer workflow from model
              adaptation through sensor integration and ROS2-based robot application development. That mix is consistent
              with the company's public positioning as a low-power edge-inference alternative to bulkier general-purpose
              GPU stacks for smaller robot form factors.
