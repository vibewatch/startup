      - number: '2.2'
        title: Sizing Lenses and Constrained TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              Public market sizing is helpful only when the lens is explicit. MarketsandMarkets provides a broad Cloud
              FinOps frame, The Business Research Company offers a much narrower Kubernetes cost-management lens, and
              Verified Market Reports gives a separate cloud cost-optimization forecast. None of these maps perfectly
              onto D-Robotics, which sits partly inside software efficiency and partly inside robotics-specific edge
              compute. That means using one large headline figure would overstate confidence. A better approach is to
              treat the broader reports as the outer TAM envelope, then constrain the serviceable market to the subset
              of buyers who need local robotics inference, real-time control, or full-stack development tooling in
              addition to cost and orchestration functionality. This produces a more modest but more believable 2026 SAM
              range around the low single-digit billions and a still smaller SOM for third-party vendors because native
              tools and incumbent platform suites will absorb part of the budget.
