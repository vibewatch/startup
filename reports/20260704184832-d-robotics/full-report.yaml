      - number: '8.6'
        title: Exit readiness, thesis-break triggers and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              It is too early to underwrite a clean public-style exit path today. The more likely near-term outcomes are
              another private round, a strategic partnership path, or a later IPO only after D-Robotics discloses
              repeatable customer economics. The best way to avoid overpaying is therefore to focus on what would
              actually break the thesis. If another financing arrives before revenue quality is visible, if
              international customer proof fails to broaden beyond a China-heavy base, or if export-control tightening
              changes vendor behavior materially, the fair band should move down—not up.


              The final diligence asks are straightforward and demanding: exact round terms, full cap table,
              product-line margins, burn and runway, export-chain dependencies, and customer concentration by geography
              and use case. Without those answers, the company remains too opaque for a buy call even if the strategic
              story stays compelling. Track is therefore the right operational stance: stay close, update quickly, and
              be ready to rerate only when hard data catches up.
