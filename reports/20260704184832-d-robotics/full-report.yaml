      - number: '2.3'
        title: Buyers, Users, Payers, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The buyer map for D-Robotics is inherently cross-functional. Platform engineering, SRE, and robotics
              software teams are the most natural hands-on users because they manage deployment, node utilization,
              sensor integration, and robot application performance. Finance and FinOps teams matter because efficiency
              and showback are part of the justification, especially when robotics programs operate across cloud, edge,
              and hybrid environments. As D-Robotics pushes into embodied intelligence, AI infrastructure owners also
              become key stakeholders because accelerator efficiency, thermal limits, and hardware-software
              compatibility can determine whether a design is viable. The adoption path therefore usually starts with a
              prototype or developer program, moves into evaluation on a real robot form factor, and then scales into
              production budgets once the customer can prove performance, reliability, and unit economics. The company’s
              maker-versus-business split on the website is consistent with this progression from experimentation to
              deployment.
