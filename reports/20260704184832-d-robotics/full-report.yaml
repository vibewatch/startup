            body: >-
              The strongest public customer proof sits with two co-branded product launches. D-Robotics' own blog names
              Hengbot's Sirius robotic dog as running an RDK X3 AI head at up to 5 TOPS, a spec independently matched on
              D-Robotics' RDK X3 product page, and Hengbot's own homepage shows the campaign has drawn 1,150 backers and
              $912,768 in funding as of the run date -- though both publicly indexed Kickstarter URLs for the original
              campaign return HTTP 404, so the primary crowdfunding record itself is not independently recoverable.
              Elephant Robotics' myCobot 280 RDK X5 is a second named, commercially sold product built around
              D-Robotics' RDK X5 board. Moving one step down the evidence gradient, 36Kr reporting carried by KrASIA
              states D-Robotics has partnered with more than 60 supply-chain players, specifically naming Narwal's
              Xiaoyao 002 robot vacuum, Insta360's Antigravity A1 panoramic drone, and a Vbot quadruped companion robot.
              Narwal and Insta360 each independently confirm a large, real commercial footprint (450 million users and a
              global product lineup, respectively) on their own homepages, but neither homepage itself names D-Robotics,
              so the chip attribution for both currently rests on third-party press rather than the buyer's own
              materials. The Vbot mention is weaker still: it is a single press reference with no corroborating source
              or product page found. The most consequential 2026 development is Tiangong 3.0, a full-size humanoid
              jointly engineered by D-Robotics and the Beijing Innovation Center of Humanoid Robotics around the
              Xuri/Sunrise S600 chip; Gasgoo and the independent outlet en.shuziqushi.com (citing Jiemian News) both
              confirm mass production and delivery are planned for the second half of 2026, with the finished machine's
              cost projected to fall by more than 50% at scale. Taken together, adoption trajectory evidence shows two
              mature co-branded consumer products, two OEM relationships confirmed only by press, one thin single-source
              relationship, and one pre-revenue but well-corroborated humanoid design win -- a gradient investors should
              not collapse into a single 'named customers' headline count.
