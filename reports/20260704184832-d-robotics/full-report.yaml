      - number: '4.5'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              On structure, D-Robotics has several positives. It is selling into a broad robotics-enablement layer, not
              a single-device niche; it has visible software and community assets around the hardware; and it has raised
              enough late-stage private capital to keep expanding through 2026. Public comparable platforms such as
              NVIDIA Jetson also show that edge-AI vendors can capture value through bundled compute, dev kits, and
              software ecosystems rather than through chips alone.


              But the underwriting blockers are substantial. Public evidence does not reveal realized pricing,
              chip-versus-kit mix, software monetization, burn, runway, customer concentration, or unit economics.
              Investor identities for the 2026 B rounds are not recoverable from the accessible pages, and the exact
              valuation remains a secondary-source estimate rather than a public filing fact. Financially, D-Robotics
