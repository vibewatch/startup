      - number: '4.2'
        title: GTM motion and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              The strongest public sales-efficiency evidence is ecosystem intensity rather than booked revenue.
              D-Robotics maintains a 229-repository GitHub organization, a model zoo with end-to-end deployment
              examples, course catalogs with material view counts, recent contests, and a growing partner list spanning
              education robots, industrial cameras, companion robots, and dual-arm embodied systems. Those are not
              substitutes for CAC or payback data, but they do imply a developer-led funnel that can lower pre-sales
              friction and widen product discovery. The partner feed also suggests that D-Robotics uses external
              hardware makers and integrators as downstream distribution rather than building all end products itself.


              The adverse side of that same model is visible in the support surface. Recent forum topics still include
              CAN FD issues, dropped-frame reports, missing tool-download links, and model-conversion precision
              complaints. Combined with external onboarding tutorials on CSDN, the evidence points to a still-maturing
              enablement burden. D-Robotics likely trades lower direct-sales intensity for higher documentation,
              support, and ecosystem-investment costs.
