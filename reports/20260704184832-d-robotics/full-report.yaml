      - number: '3.2'
        title: Competitor Profiles and Buyer Decision Criteria
        blocks:
          - type: paragraph
            body: >-
              The buyer decision is not only about TOPS. D-Robotics can show a coherent robotics story because RDK X5,
              RDK S100, TogetheROS.Bot, GitHub documentation, NodeHub, and community surfaces all reduce the time from
              evaluation to a working robot demo. That stack is meaningful for developers who value middleware, sample
              code, sensor packages, and a smaller-board footprint. NVIDIA wins the opposite end of the spectrum: a
              broader Jetson ladder and a Thor roadmap designed for humanoids, agentic AI, and heavy multi-sensor
              workloads. Qualcomm sits between mobile-heritage embedded AI and robotics reference kits, while Ambarella
              emphasizes low-power computer vision, Renesas emphasizes vision plus motor control, networking, and
              safety, TI emphasizes system-level humanoid requirements, and MediaTek positions Genio across
              cost-sensitive IoT and edge AI devices. In practice, buyers compare performance per watt, ROS and SDK
              maturity, motor-control adjacency, camera and sensor support, pricing transparency, partner availability,
              and how much custom integration they must own themselves.
