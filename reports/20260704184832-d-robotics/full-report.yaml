      - number: '6.3'
        title: 'Expansion loop: the DGP program, developer community, and evangelist network'
        blocks:
          - type: paragraph
            body: >-
              D-Robotics runs a deliberate top-of-funnel expansion mechanism distinct from its named OEM deals. The
              Robotics Dream Keeper Challenge offers a four-stage progression (Explorer, Builder, Creator, Core
              Developer) with mentoring, a $1,000 grand prize, and cash rebates toward RDK X5 purchases, explicitly
              designed to convert hobbyist developers into repeat hardware buyers. The company also hosted a live 'RDK
              X5 Show & Tell' event co-promoted with Make: Magazine editor David Groom, giving away an Elephant Robotics
              myCobot 280 arm to drive engagement, and its developer-portal API shows 2026-dated programming still
              active, including a Smart Healthcare challenge track inside a national university intelligent-vehicle
              competition open for registration through August 2026. D-Robotics' community page names five 'robotics
              evangelists' who represent the brand at events and online, including Frank Fu, described as CEO of Navbot.
              That relationship illustrates an important adoption-quality distinction, however: NavBot's own homepage
              markets its quadruped and STEM robotics products as 'NVIDIA Jetson Powered' and never mentions D-Robotics
              or RDK hardware in its public product messaging, so the Fu/Navbot tie reads as a community-outreach or
              evangelist relationship rather than confirmed proof that Navbot ships D-Robotics silicon in its own
              products. The developer-case showcase on D-Robotics' own portal reinforces the same caution at scale: the
              dozens of listed projects are overwhelmingly student and hobbyist submissions built for competitions or
              personal learning, not paying commercial deployments. This expansion loop is therefore a real and active
              community-building mechanism, but it is a pipeline for future commercial relationships, not a substitute
              for named, revenue-bearing customer proof.
