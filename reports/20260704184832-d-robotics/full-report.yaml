      - number: '7.5'
        title: Spinout execution and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              Execution risk remains elevated because D-Robotics is not a greenfield software company; it is a recent
              spinout trying to commercialize chips, boards, middleware, tooling, community support, and partner
              enablement at once. The parent-scale comparison is sobering. Horizon Robotics now reports
              multi-billion-RMB revenue, millions of end users, and tens of millions of chip shipments, while D-Robotics
              is still proving that its robotics-focused stack can stand on its own economically. That does not imply
              hidden dependence, but it does imply that management must replace inherited brand trust with its own
              repeatable execution.


              Financially, the public record proves funding momentum but not self-sustaining economics. Yicai and CXO
              both report a $270 million two-step Series B in 2026, yet the same public record still does not disclose
              revenue, margin, cash, burn, or runway. The platform is structurally capital intensive because product
              development, ecosystem enablement, and support all scale together. In a market this competitive, that
              means a well-funded company can still become financing dependent again faster than investors expect. Until
              management provides clean monetization, cost, and runway disclosure, the financial model should be treated
              as a risk amplifier rather than a stabilizer.
