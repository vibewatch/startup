  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Technology differentiation and competitive displacement risk
        blocks:
          - type: paragraph
            body: >-
              The core technology risk is that D-Robotics is trying to establish a robotics-compute standard in a market
              where the most visible incumbent already spans both the silicon and the software-control plane. NVIDIA's
              Jetson ladder now runs from Orin Nano at 67 TOPS through AGX Orin at 275 TOPS and up to Thor at 2070 FP4
              TFLOPS with 128 GB of memory, while JetPack 7 bundles CUDA, TensorRT, Isaac ROS, OTA, security, and
              cloud-native deployment tooling. That gives robotics teams a far more globally legible software surface
              than D-Robotics currently shows in public benchmark-grade form.


              D-Robotics absolutely has a real stack of its own: X3, X5, S100, NodeHub, and DGP create an integrated
              developer path. But the public evidence still reads as ecosystem-led differentiation rather than hard
              proof of superior global performance economics. Qualcomm is still investing in RB3 Gen 2 and RB5 robotics
              pathways, Ambarella is attacking low-power robotics perception with a per-watt story, and Kneron remains
              funded enough to keep pressing the edge-AI narrative. The risk is not that D-Robotics lacks products; it
              is that buyers outside its home market may still default to more globally standard stacks until D-Robotics
              proves a clearer benchmark, software, and deployment edge.
            claimRefs:
