        title: Architecture and compute/control design
        blocks:
          - type: paragraph
            body: >-
              The most distinctive technical claim in the fetched sources is the S100 architecture. D-Robotics does not
              merely market more TOPS; it describes a compute split across CPU, BPU Nash, and MCU resources so that
              perception, planning, and joint-level control do not all collapse onto the same processor budget. Public
              text says the BPU Nash handles 80/128 TOPS and supports more than 160 ONNX operators with CNN and
              Transformer optimization, while Arm Cortex-R52+ MCU resources handle low-latency actuation. In contrast,
              the RDK X5 looks like a more classic edge-AI board that exposes rich I/O and wireless interfaces for
              prototyping.


              The software architecture complements that split. TogetheROS.Bot exposes installation, ROS2 package usage,
              SLAM, and voice-control demos, while the model zoo documents conversion, quantization, inference, and
              validation pipelines. The result is a reasonably specific public architecture map: hardware heterogeneity
              below, robotics middleware in the middle, and BPU-centric model tooling above.
