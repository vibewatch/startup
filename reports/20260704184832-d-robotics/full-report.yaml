            body: >-
              D-Robotics’ public stack is broad enough to support a credible platform thesis rather than a single-board
              story. RDK X5 is presented as a robotics development kit with strong general-purpose I/O, Ubuntu 22.04
              support, wired and wireless connectivity, and a familiar maker-to-prototyper workflow. RDK S100 is
              positioned higher in the stack as an embodied-intelligence compute-and-control platform, with explicit
              “big brain + small brain” language that pairs application compute with motion control. Around those
              hardware layers, D-Robotics exposes a robotics software manual, a public GitHub organization, a model zoo
              for BPU deployment, and training surfaces that help developers move from first boot to model execution.


              That creates a visible workflow: select hardware, flash and configure the board, use robotics middleware
              and examples, port or quantize models into BPU-compatible formats, and then integrate the board into a
              partner or self-built robot. It is a coherent developer journey, though still oriented toward builders who
              can tolerate setup work and community-driven troubleshooting.
