      - number: '7.2'
        title: Geopolitical, export-control and supply-chain risk
        blocks:
          - type: paragraph
            body: >-
              Geopolitics is one of the clearest non-company-specific risks in the file. BIS's May 31, 2026 guidance
              explicitly says a license is still required for advanced-computing items going to entities headquartered
              in Country Group D:5 or Macau even when the entity sits outside those geographies. WilmerHale's 2025
              analysis adds that the AI Diffusion Rule may have been paused, but the enforcement posture around
              China-related AI exports, support activities, and diversion screening has become more—not less—sensitive.
              A second WilmerHale note shows fabricators and OSATs now face tighter due diligence and approval burdens
              that harden further into 2026.


              For D-Robotics, the public file does not prove a direct sanctions event. The risk is more subtle and
              therefore more important: if China-linked robotics and edge-AI programs become harder to service, global
              vendors may slow-walk tools, silicon, packaging, or support even without a headline prohibition aimed at
              the company itself. The evidence base also does not disclose D-Robotics' foundry or packaging chain
              clearly enough to quantify Taiwan or other external choke-point exposure. That leaves a meaningful
              residual geopolitical overhang on any long-duration underwriting case.


              The control regime is also layering, not static. BIS added 80 entities to the Entity List in March 2025
              for advanced-AI, supercomputing, and high-performance-chip activity tied to China's military-industrial
              complex, on top of a December 2024 rule package that Torres Trade Law says added 140 entities and 16
              Footnote-5 designations while introducing new Foreign Direct Product rules and license exceptions. The
              Congressional Research Service's September 2025 update frames this as part of a multi-year US effort to
              slow China's stated 2030 semiconductor self-sufficiency goal, and BIS's own December 2024 foundry rule now
              requires packaging houses to verify transistor counts or hold Approved/Authorized IC-designer or OSAT
              status before shipping certain advanced chips. TrendForce data separately shows the US maintaining an
              intentional one-to-two-generation ("N-1"/"N-2") performance gap on chips it does allow into China, while
              wafer-capacity and HBM bottlenecks continue to constrain Chinese AI-chip makers even as domestic market
              share is projected near 50% in 2026. None of these sources name D-Robotics directly, but each new round
              expands the population of counterparties, packaging partners, and tool vendors that could face added
              screening, and that compounding effect is a bigger long-run risk than any single rule.
            claimRefs:
