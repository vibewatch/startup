              moderate workforce signal with a 51-200 employee band and a few thousand followers, while public community
              surfaces on Discord, YouTube, and the community page show ongoing recruitment of evangelists, makers, and
              startup builders. Those signals do not prove market dominance, but they do show a deliberate international
              developer go-to-market motion.
