  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Solution Classes
        blocks:
          - type: paragraph
            body: >-
              D-Robotics should be compared against several alternative ways to solve the same robotics-compute job. Its
              own public surfaces describe a full stack that combines boards, BPU-based inference, ROS-compatible
              middleware, documentation, and developer onboarding. That makes its closest competition broader than edge
              AI chips alone. NVIDIA represents the high-end incumbent path for physical AI and humanoid programs, with
              Jetson Orin covering a wide module ladder and Jetson Thor moving into much larger memory and
              transformer-scale reasoning workloads. Qualcomm competes through embedded reference platforms that package
              AI, connectivity, and ROS-friendly development kits. Ambarella, Renesas, TI, and MediaTek compete from
              different angles: low-power vision SoCs, industrial robotics control and safety, sensor-fusion and
              motor-control subsystems, or general edge AI modules. Finally, some buyers can stay with status quo
              substitutes such as Autopilot, Karpenter, and existing FinOps tooling for shared infrastructure problems,
              then integrate robotics components themselves. The key diligence point is that D-Robotics is selling an
              integrated robotics-compute path inside a fragmented market, not merely fighting one benchmark race.
