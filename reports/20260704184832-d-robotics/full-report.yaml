      - number: '7.3'
        title: Embodied-AI commercialization skepticism, bubble risk, and China industrial-policy exposure
        blocks:
          - type: paragraph
            body: >-
              China's own robotics ecosystem is being pulled in two directions at once. IFR's May 2026 briefing on
              China's 15th Five-Year Plan describes robotics being placed at the heart of national industrial strategy,
              with the country already running an installed industrial-robot base of roughly 2 million units -- about
              4.5 times Japan's stock -- and accounting for 54% of 2025's global industrial robot installations per the
              World Robotics 2025 Report. That is a plausible tailwind for a domestic robotics-compute vendor, but it
              cuts both ways: state-directed industrial policy tends to concentrate favor and demand-pull toward
              officially anointed "national champion" platforms, and the public record does not show whether D-Robotics
              is positioned as a preferred beneficiary of that push or is simply one of many domestic vendors competing
              for the same policy-linked demand.


              Layered on top of that policy tailwind is a demand-timing risk the company does not control: humanoid and
              embodied-AI commercialization skepticism. TechCrunch's account of roboticist Rodney Brooks' critique
              argues that current humanoid approaches rest on "pure fantasy thinking" about dexterity and safety
              physics, and predicts a much longer timeline to real humanoid utility than today's capital markets assume.
              Separately, CB Insights data reported by Robotics & Automation News shows humanoid robotics already
              captured the most single-category VC deal volume of any AI vertical in a recent quarter, alongside
              explicit investor warnings of a bubble and calls for a "revenue-first" discipline. ChinaBizInsider's
              mid-2026 count of at least 25 Chinese embodied-AI unicorns -- 15 of them minted in just the first half of
              2026, absorbing a combined RMB46 billion (~US$6.39 billion) of disclosed funding -- with only 18-24 months
              of cash runway each, implies a probable wave of consolidation, down-rounds, or shutdowns arriving in
              2027-2028.


              This matters directly for D-Robotics because its RDK S100 / BPU Nash line is explicitly positioned toward
              embodied and humanoid robotics customers. If the humanoid investment cycle cools before commercial volume
              materializes, D-Robotics' addressable near-term demand could shrink faster than its broader edge-AI and
              AMR business would suggest, and the public record does not disclose what share of current shipments or
              backlog is humanoid-linked versus more durable industrial, AMR, or dashcam demand. Separately, no public
              standards body or regulator was found naming D-Robotics in a robotics safety, interoperability, or
              certification context, leaving that as an open diligence item rather than a confirmed compliance gap.
            claimRefs:
              - CR047
              - CR048
              - CR049
              - CR050
              - CR051
              - CR052
              - CR053
              - CR054
              - CR055
              - CR056
      - number: '7.4'
        title: Market concentration, channel dependence and support risk
        blocks:
          - type: paragraph
            body: >-
              The market-expansion risk is less about whether D-Robotics can sell anything outside China and more about
              what kind of international footprint it currently has. The distributor page is encouraging because it
              shows visible reseller coverage across several Asian and European countries. But that same page is also a
              caution flag: the footprint is still mostly reseller-led, and the accessories page routes peripheral
              fulfillment through local distributors as well. That is a perfectly normal early-stage channel design, but
              it is weaker than having direct field teams, named global OEM deployments, and published international
              customer references.


              The support surface reinforces that caution. Public forum activity in early July 2026 shows real issues
              around CAN FD, GPIO, dropped frames, model conversion, and S100 boot behavior. That is evidence of active
              usage, but it also means operating complexity is showing up in the open. Add in the strong
              education-and-developer flavor of the public onboarding surfaces, and the result is a company with healthy
              ecosystem energy but still uncertain international monetization depth. Investors should therefore separate
              visible community engagement from proven overseas revenue diversification.
            claimRefs:
